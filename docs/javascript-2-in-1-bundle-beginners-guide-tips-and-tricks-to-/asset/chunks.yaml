  trans: "\n\n当修改 DOM 时，你将选择一个元素并对其进行你想要的任何更改。这个过程通常是通过 JavaScript 完成的。为了从 JavaScript\
    \ 访问 DOM，你需要使用被使用的对象 `document`。它将由浏览器提供，以便代码允许与页面内容中的代码进行交互。\n\n## 获取元素\n\n当你获取一个元素时，取决于你所使用的浏览器，你会有几种方法可以来实现。\n\
    \n### ID\n\n当你尝试通过其 `Id` 检索项时，`document.getElementById` 将是你你使用的方法。\n\n代码：\n```javascript\n\
    var pageHeader = document.getElementById('pageheader');\n```\n\n使用这段代码，你可以选择 ID\
    \ 为 `pageheader` 的元素并将其存储在变量 `pageHeader` 中。稍后，你可以修改它、获取它的内容，甚至隐藏和显示它。这里有一个示例。\n\
    \n代码：\n```javascript\nalert(pageHeader.innerHTML);\n```\n\n这将弹出 ID 为 `pageHeader`\
    \ 的元素的内容。例如，如果 `pageheader` 看起来像这样：\n\n代码：\n```html\n<p id=\"pageheader\">This\
    \ is the page header</p>\n```\n\n它将弹出“This is the page header”文本。\n\n你会注意到 `getElementById`\
    \ 是与 `document` 对象一起使用的方法。其他一些方法将可以访问在文件中定位了元素的页面。\n\n### 标签名\n\n`document.getElementsByTagName`\
    \ 的工作方式与 `getElementById` 相同，但它需要一个标签名，如 `a`、`li` 或 `ul`，而不是 ID。它将被返回为 `NodeList`，这基本上是来自\
    \ DOM 的元素列表或数组。\n\n例如，如果你只有两个这样的 `<p>` 元素：\n\n代码：\n```html\n<p>This is one paragraph</p>\n\
    <p>This is another paragraph</p>\n```\n\n那么你可以使用以下代码将这两个元素存储在 `paragraphs` 变量中：\n\
    \n代码：\n```javascript\nvar paragraphs = document.getElementsByTagName(\"p\");\n\
    alert(paragraphs[0].innerHTML);\nalert(paragraphs[1].innerHTML);\n```\n\n`Alert`\
    \ 函数将显示第一个段落的内容，然后是第二个段落的内容。\n\n### 类名\n\n`Document.getElementsByClassName` 返回与标签名方法相同的列表。最大的区别在于，你需要传递一个匹配的类名，而不是标签名。\n\
    \n### CSS\n\n对于现代浏览器，有一些新方法供你使用，通过使用 CSS 选择器让选择元素变得更容易。CSS 的语法为：`document.querySelector`\
    \ 和 `document.querySelectorAll`。\n\n代码：\n```javascript\nvar pageHeader = document.querySelector(\"\
    #example”);\nvar buttons = document.querySelectorAll(\".btn”);\n```\n\n`querySelector`\
    \ 就像你通过 ID 搜索元素一样，它只会返回一个元素。但是，`querySelectorAll` 将返回 `NodeList`。因此，如果有多个元素匹配你的搜索标准，你就需要使用\
    \ `querySelector`，以便你只获取返回的第一个，而不是所有的元素。\n\n## 第 12 节：JavaScript 回调和事件\n\n位于浏览器内部的代码将是事件驱动的，当你编写交互式应用程序时，你必须等待并响应最终将改变浏览器行为的事件。当页面加载或用户与页面上的某些内容交互时，就会发生事件。还有其他会被触发的时间，但这些必须手动完成。\n\
    \n当你需要对事件做出反应时，你必须监听它，以便提供一个函数。每当事件发生时，浏览器都会调用该函数，它被称为回调。\n\n代码：\n```javascript\n\
    var handleClick = function(event) {\n    // 选择一个不同的动作！\n};\n\nvar button = document.querySelector('#big-button');\n\
    button.addEventListener('click',handleClick);\n```\n\n`addEventListener` 是可以在所有\
    \ DOM 元素上找到的方法。当它被调用时，元素将被保存在变量 `button` 中。字符串中第一个列出的参数将是你应该监听的事件名称。这段代码中的事件是鼠标点击或手指的触摸。回调是\
    \ `handleClick`。\n\n如果你正在使用 Internet Explorer，如果你运行的版本早于版本 9，则不支持 `addEventListener`。在这种情况下，你应该使用\
    \ `attachEvent`。\n\n代码：\n```javascript\nbutton.attachEvent('onclick', handleClick);\n\
    ```\n\n如果你仔细看，你会发现需要 `onclick` 而不是 `click`。这会在你遇到的大多数事件中发生。正是像这样的对象创建了如 `jQuery`\
    \ 之类的库来帮助你，即使两个浏览器之间的监听方式不同，得由于作为回调传递的事件，这也不再重要了。\n\n传递的任何特定事件的数据都是回调。当你查看上面声明的\
    \ `handleClick` 时，你会发现参数或 `event` 是描述对象属性的地方。\n\n代码：\n```javascript\n{\n  offsetX:\
    \ 7,\n  offsetY: 0,\n  pageX: 1,\n  pageY: 1,\n  target: 2,\n  timestamp: 3,\n\
    \  type: “click”,\n  x: 4,\n  y: 5\n}\n```\n\n## 第 13 节：结合 JavaScript AJAX\n\n\
    在进入这一节之前，非常注意的是，许多浏览器在直接从用户处调用时会自动 AJAX。为了让 AJAX 正常工作，你需要一个 Web 主机或本地。当 Web 最初出现时，情况比现在简单。页面现在有文本和样式，同时可能有引导你到另一个页面的链接。要在页面上放置新内容，你必须将其从一个页面移动到另一个页面。开发者一直试图让网页具有交互性，但显然新内容需要一种不需要每次重新加载的方法。\n\
    \n在检索新内容时，有一种名为 `XHR` 或 `XML HTTP Request` 的软件可以帮助。互联网应用程序使用 AJAX。AJAX 的意思是异步\
    \ JavaScript 和 XML。大多数网页都可以通过这种技术无需重新加载页面即可获取内容。微软实际上在创建 Outlook 时决定应该使用 `XML\
    \ Http Request`。\n\n### XML HTTP 请求\n\n你知道 `XML HTTP Request` 是什么，但它是如何显示的呢？\n\
    \n代码：\n```javascript\nvar req = new XMLHttpRequest ();\nreq.onload = function\
    \ ( event) { … };\nreq.open('get' , 'some-file.txt' , true);\nreq.send();\n```\n\
    \n当创建一个 `XMLHttpRequest` 时，你需要一个新的关键字来调用它，类似于调用函数的方式。回调将在信息可用的时间点发生，然后它将事件输入传递到第一个参数。\n\
    \n异步的参数将默认为 `false`，这会导致代码的执行暂停，直到请求到适当的数据，这被称为同步。\n\n"
- fmt: "\nSynchronous XMLHttpRequest are very rarely used which is an offer to the\
    \ system that can sometimes take a long time to load. The last line is going to\
    \ allow the web page to deny the request for any information.\n\nIn using `XMLHttpRequest`,\
    \ you are going to be able to load `JSON`, `XML`, `HTML`, and a series of text\
    \ over the `HTTP` and `HTTPS` servers while continuing to support rules such as\
    \ `FTP`. Ultimately they are useful when it comes to a range of tasks that are\
    \ going to be involved in the development of JavaScript applications.\n\n# AJAX\
    \ and Libraries\n\nTechniques used with `AJAX` are being created so that there\
    \ are now applications that are single pages with a demand that brings up the\
    \ JavaScript script so that it is allowed to appear asynchronously any other scripting\
    \ that needs to be loaded from the server. There are entire libraries and frameworks\
    \ that are built in order to help this happen.\n\n# Chapter 14: JSON\n\nJSON stands\
    \ for `JavaScript Object Notation`. This is a set of text formatting rules that\
    \ are used for storing and moving data around in a machine so that a human can\
    \ read it. It is going to look similar to the object literal syntax that is used\
    \ with `JavaScript` but this is where `JSON` is going to orginate.\n\n`JSON` may\
    \ not be part of `JavaScript`’s official code, it is a big part of `JavaScript`\
    \ so while it is a different language, it is still important for you to understand\
    \ how it works when it works with `JavaScript`.\n\n### Code\n```\n{ “name” : “Luke”\
    \ , age: 894, “lightsaber” : { “color” : “green” } }\n```\n\nJust like with normal\
    \ `JavaScript` code, the brackets are used to notate specific parts of the code.\n\
    \n`JSON` is going to transfer the infromation that needs to be moved between the\
    \ browser to its server or it will be saved in a text file that will be retrieved\
    \ later since it is nothing more than text. Because of this, you are not going\
    \ to be allowed to store complex data such as functions. However, arrays and any\
    \ other objects contains contains simple data is going to be used.\n\n`JSON` will\
    \ take over `XML` when the data transfer format from the web and the new `APIs`\
    \ are written which are going to serve `JSON` exclusively. This means that you\
    \ are going to be able to use `AJAX` technology in order to grab `JSON`.\n\n##\
    \ Using JSON\n\nData has the ability to be convereted from or to `JSON` by using\
    \ the `stringify` method along with the `parse` method. `JSON` is when the object\
    \ that is available is available through most all modern browsers, but you can\
    \ add it to your browser if it does not already exist there.\n\n### Code\n```\n\
    var jsonString = JSON.stringify( {\n\nMake: \"McLaren\" ,\n\nModel: \"MP4-12C\"\
    \ ,\n\nMiles: 5023\n\n} ) ;\n```\n\n`JSON.stringify` will convert an object into\
    \ a `JSON` string. Like in the code the `jsonString` is going to be `{ “make”\
    \ : “McLaren”, “model” : “MP4-12C”, “miles”: 5023 }`.\n\n### Code\n```\nvar car\
    \ = JSON.parse(jsonString);\n```\n\nThe string is going to be allowed to be converted\
    \ into a `JavaScript` object by using `JSON.parse`. `.car` where it is now a `JavaScript`\
    \ object that can be used where you can set the properties.\n\n### Code\n```\n\
    car.model = “P1” ;\n```\n\n# Chapter 15: Scopes with JavaScript\n\nA scope is\
    \ going to be the term that will determine what the variable visibility is. The\
    \ variables scope is going to be the part of the code that is going to access\
    \ as well as modify the variable. There is a function scope that is going to be\
    \ used with `JavaScript`.\n\nScope going to be dictated by the block of code where\
    \ the variable has been declared. The block will be anything that is contained\
    \ inside of two curly brackets or is indented.\n\n### Code\n```\nvar a = 10 ;\n\
    \nif(a > 5) {\n\nvar b = 5;\n\n}\n\nvar c = a + b; //this is bad programming practice!\n\
    ```\n\nGlobal variables are going to be read and modified wherever you put them\
    \ in your application, but they are not going to be the best to use because they\
    \ are going to expose the security issues in the code which is ultimately going\
    \ to make the code harder to maintain.\n\nIt is important to remember that your\
    \ code needs to read more than it is written. Whenever code is read by a human\
    \ but is unable to be determined as to where the variable has come from or what\
    \ potential values there are, you are going to have a problem.\n\nYou are going\
    \ to get your best results when you limit the scope of the variable as much as\
    \ you possibly can which will make it visible to as few parts of the code as possible.\n\
    \n## Function scope\n\nSince `JavaScript` does things differently, it is going\
    \ to use a function scope. A function scope is going to mean that the variables\
    \ will not be visible when they are outside of the function where they were declared.\
    \ If they have not been declared in a function, then they are going to be visible\
    \ globally.\n\n### Code\n```\nvar doSomething = function() {\n\nvar a = 10 ;\n\
    \n} ;\n\ndoSomething () ;\n\nconsole.log(a) ; // this shows that a has been undefined.\n\
    ```\n\n### Child scopes\n\nVariables are also going to come in child scopes that\
    \ will have their own scopes. For the code, if the `doSomethingElse` is a child\
    \ of the `doSomething` function then the variable `\"a\"` will be visible when\
    \ it is placed inside of `doSomethingElse`.\n\n### Code\n```\nvar doSomething\
    \ = function() {\n\nvar a = 10;\n\nvar doSomethingElse = function() {\n\nconsole.log(a);\
    \ //a will be 10\n\n} ;\n\ndoSomethingElse ();\n\n} ;\n\ndoSomething() ;\n```\n\
    \nFunctional scopes are going to be very powerful tools when it comes to creating\
    \ elegant codes, but it takes a while to actually get the hang of it.\n\n# Chapter\
    \ 16: jQuery in JavaScript\n\nThere is going to be a set of tools that is going\
    \ to be used when modifying and controlling the DOM. This is a little bit messy\
    \ though there are different DOMs. So that you can make the coding experience\
    \ simpler, there are a large amount of resources that have been set up so the\
    \ large mistakes are hidden and it makes a more uniform way provide the functionality\
    \ which will then take the stress of how complex coding is away. `jQuery` is a\
    \ well-known DOM library that is going to be used across a variety of pages. But,\
    \ the process you use to communicate with the DOM will be called an Application\
    \ Programming Interface or `API`.\n\n`jQuery` is going to have a syntax that is\
    \ very distinctive because it is going to be based on the dollar symbol.\n\n###\
    \ Code\n```\n$('.btn').click (\n\nfunction() {\n\n//choose a different action\
    \ \n\n}\n\n) ;\n```\n\nThe code for this is going to attach to the click handler\
    \ of all the elements that are listed in the `btn` class. The selector syntax\
    \ will be the core of `jQuery`. `jQuery` can be placed on the website with the\
    \ scripting element. You can pull the file from `jquery.com` or you can add from\
    \ a CDN.\n\n### Code\n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n```\n\nYou should not always use a library, but you should choose\
    \ if it is going to have a structure that is established on the product of the\
    \ developers choosing. For example, if `jQuery` has an extensive document that\
    \ needs to be introduced, then the downloading is going to be slow for the page,\
    \ especially when it comes to mobile browsers that might have weak connections.\n\
    \n# Chapter 17: jQuery DOMs and APIs\n\nWhen elements are selected and then interacting\
    \ with the DOM, `jQuery` is most likely to be used. Thankfully, it is easy for\
    \ you to be able to use since the syntax is simple when it comes to choosing an\
    \ element or even a set of elements. This is almost exactly like the CSS.\n\n\
    `jQuery` allows the performance of actions that are done on elements to be done\
    \ at the same time which saves some time in your coding process.\n\nThe `$('.note`\
    \ is going to be selecting all of the elements that has \"note\" class.\n\n###\
    \ Code\n```javascript\n$('.note').css('background', 'red').height(100);\n```\n"
