  trans: "\n现在你创建了两个变量。`var` 只使用了一次的原因是因为你进行了初始化并给变量赋了值。当你只写一次关键字并用逗号将它们分开时，你可以省去一些额外的工作。\n\
    \n在 JavaScript 的帮助下，你将能够计算出你拥有多少个水果。\n\n代码：\n```javascript\nvar piecesOfFruit\
    \ = apples + oranges;\n```\n\n这段代码将告诉浏览器，在将结果重新赋值给 `piecesOfFruit` 的数量之前，它需要根据右侧的数字计算总和。但是，变量名不会被相加，只有值会被相加。你的浏览器会知道你在做什么，并且只会给你这些值的总和。\n\
    \n你的总和不会是 \"pieces of fruit\"（水果个数），而是 `piecesOfFruit`，因为你的变量不能包含任何空格。很容易发现，`Of`\
    \ 和 `Fruit` 中的 `O` 和 `F` 是大写的。这被称为驼峰命名法（camel casing），它有助于使变量更易读。\n\n请记住，代码有多种读取方式。这就是为什么确保你的代码易于阅读和理解是非常重要的。\n\
    \n### 拆分\n\n当你进行数学运算时，不仅仅有加法。对于代码来说，还有除法。\n\n代码：\n```javascript\nvar piecesForEachPerson\
    \ = piecesOfFruit / 3 ;\n```\n\nJavaScript 能够完成这些数学计算，而你无需拿出计算器来确保计算正确。\n\n除法是通过正斜杠\
    \ `/` 完成的，以确保你将左侧除以右侧。\n\n### 运算符\n\n为了得到一组数字的总和，你将为每种操作使用符号。\n\n- 乘法 (`*`)\n\
    - 加法 (`+`)\n- 除法 (`/`)\n- 减法 (`-`)\n\n每个符号都被称为运算符，因为它们将对某些数学数据进行操作。就像任何数学题一样，执行的执行有一个特定的顺序，这被称为运算符优先级（operator\
    \ precedence）。\n\n看到一组括号意味着在执行乘法、除法、加法或减法过程之前需要先执行它们。记住这个运算顺序简单方法是 `PEMDAS`（括号、指数、乘法和除法、以及加法和减法）。\n\
    \n代码：\n```javascript\n(10+2) / 2 + 4 * 2\n12 / 2 + 4 * 2\n6 + 4 * 2\n6 + 8\n```\n\
    \n# 第 5 章：JavaScript 逻辑\n\n在编程时，能够比较不同的值是非常重要的以便在涉及代码以及如何执行代码时做出决策。比较将使你的结果为假（false）或真（true）。然后，还有一种特殊的数据类型，被称为布尔型（Boolean）数据类型。\n\
    \n使用 JavaScript 进行数学计算将引入一组与布尔值工作的运算符。这些比较将在你操作控制台时进行。你从每行得到的任何结果都将显示为 true 或\
    \ false。\n\n### 等于\n\n要确定两个不同的值是否相等，你将使用三个等号（`===`）。\n\n代码：\n```javascript\n15.234\
    \ === 15.234\nTrue\n```\n\n要检查两个变量是否不等，你需要使用两个等号并在它们前面加一个感叹号（`!==`）。\n\n```javascript\n\
    15.234 !== 18.4545\nTrue\n```\n\n包含数字的字符串在值上等于该数字，但在类型上不等，因此 `===` 比较将返回 false：\n\
    \n```javascript\n“10” === 10\nFalse\n```\n\n然而，如果你使用两个等号（`==`）比较这两个值，它将返回 true，因为两个等号只比较变量的值，而不比较类型！所以这将返回\
    \ true：\n\n```javascript\n\"10\" == 10\nTrue\n```\n\n### 大于/小于\n\n两个数字可以比较为其中一个大于或小于另一个。当一个数字大于另一个数字时，你将使用大于符号\
    \ `>`。\n\n代码：\n```javascript\n10 > 5\nTrue\n```\n\n小于符号是大于符号的反符号（`<`）。\n\n代码：\n\
    ```javascript\n20.4 < 20.2\nFalse\n```\n\n### 组合比较\n\n当数字相等且大小可以比较时，可以使用大于等于（`>=`）或小于等于（`<=`）运算符进行数字比较。\n\
    \n代码：\n```javascript\n10 >= 10\nTrue\n10 <= 5\nFalse\n```\n\n# 第 6 章：JavaScript\
    \ 条件\n\n使用 JavaScript 逻辑将根据所做的比较类型来为代码做出决策。在进行比较之前，必须设置一个条件。JavaScript 中使用了多种条件，但最常用的是\
    \ `If` 语句。\n\n### If 语句\n\n当发现条件为真时，代码将按照预期方式运行。得益于 `if` 语句，当条件证明不成立时，你可以添加必须运行的代码。当条件返回为假时，将会有可选运行的额外条件和代码块。这个选项就是\
    \ `if-else` 语句。\n\n代码：\n```javascript\nif(10 > 5) {\n  // 运行代码\n}\n```\n\n当条件返回为假时，将会有可选运行的额外条件和代码块。这就是\
    \ `if-else` 语句。\n\n```javascript\nif (condition) {\n  // 运行代码\n}\n```\n在大括号内的代码在条件成立时运行。\n\
    \n### If-else\n\n`if-else` 语句是 `if` 的另一种形式，当条件返回为假时使用。\n\n代码：\n```javascript\n\
    if (4 < 2) {\n// 运行代码\n} else {\n// 另一种代码\n}\n```\n\n# 第 7 章：使用 JavaScript 循环\n\
    \n就像圆一样，循环将重复执行代码。循环通常在需要多次执行代码时使用。\n\n你最常用的两种循环是 `while` 循环和 `for` 循环。这些条件将结合在一起，直到条件不再为真。\n\
    \n### While 循环\n\n`while` 循环在条件为真时将重复代码。`while` 循环与 `if` 语句非常相似，放在括号内的条件为真。\n\n\
    代码：\n```javascript\nvar i = 1;\nwhile ( i < 10 ) {\n  alert(i);\n  i = i + 1 ;\n\
    }\n// i 现在是 10\n```\n\n一旦循环完成，代码将在括号后继续运行。这段代码将产生从 1 到 9 的弹出框，当循环完成后 `i` 的值将等于\
    \ 10。\n\n### For 循环\n\n`for` 循环也类似于 `if` 语句，主要区别在于使用三个分号分隔放在括号之间的信息。`for` 循环将初始化条件以获取最终表达式。\n\
    \n在初始化时，你将创建一个变量，以便跟踪你循环到多远，就像你之前使用 `while` 语句时的那样。你的条件将是循环逻辑所在的地方。最终表达式将在创建的每个循环结束时运行。\n\
    \n代码：\n```javascript\nfor(var i = 1 ; i < 10 ; i++ ) {\n  alert(i) ;\n}\n```\n\
    \n在代码中，将弹出一个警告框，按正确顺序给出 1 到 10 的数字。`i++` 等同于 `i = i + 1`。`(i++)` 被称为增量 `i` 的值。正如你所见，在这种情况下\
    \ `for` 和 `while` 循环的作用是一样的。你可能想知道什么时候使用 `for` 循环，什么时候使用 `while` 循环。这是一个简短的解释。\n"
- fmt: "\nWhile loops are generally used when you don't know the number of how many\
    \ times the loop will circle around. For example, user is playing a game, where\
    \ he needs to guess the hidden number. You can never know how lucky the user is,\
    \ so you don't know when he will pick the right number. That is why you set the\
    \ `while` loop and just wait for the right number to come up.\n\nCode:\n\n```javascript\n\
    var number = 0;\n\n// 7 is the hidden number!\n\nprompt(\"Try to guess the number!\"\
    );\n\nwhile (number !== 7)\n\n{\n\nnumber = parseInt(prompt(\"Wrong number, try\
    \ again!\"));\n}\n\nalert(\"Congratulations, you guessed it correctly!\");\n```\n\
    \nWhen the user enters `7`, it will display the congratulations message, but if\
    \ user enters any other number, it will continue to display an error message until\
    \ the user enters the number `7`.\n\nOn the other hand, in using `for` loops,\
    \ we use them when we know exactly how many times we need to execute the loop;\
    \ it is mostly used when working with arrays, which we will learn in a later chapter.\n\
    \n# Chapter 8: Functions Used in JavaScript\n\nFunctions are going to reuse the\
    \ blocks of code so a specific task can be carried out. In order to execute the\
    \ code inside a function that you call, the function will be allowed to pass any\
    \ argument that is used so that a value is returned to what originally called\
    \ it.\n\nFunctions can be saved for the value of your variable. The function is\
    \ going to use the variable and the parentheses to invoke the function.\n\nCode:\n\
    \n```javascript\ndoSomething() ;\n\nfindAnInterestingThing() ;\n```\n\nCreating\
    \ a function means you are going to use the `function` keyword. After that has\
    \ been used, the arguments are going to be listed inside a set of parentheses\
    \ so that the block has the functions code.\n\nCode:\n\n```javascript\nvar add\
    \ = function(a, b) {\n\nreturn a + b ;\n\n} ;\n```\n\nThe `a` and `b` are going\
    \ to be the parameter for the functions while the value is going to be returned\
    \ by the keyword.\n\nThe keyword that is used for the `return` is going to stop\
    \ the code that has been placed in the function; therefore nothing is going to\
    \ run after it.\n\nCode :\n\n```javascript\nvar result = add( 1, 2); // the result\
    \ is going to be 3\\.\n```\n\nThe call is going to add the argument of one and\
    \ two, which have been saved for the `a` and `b` variables.\n\n# Chapter 9: Objects\
    \ Located in JavaScript\n\nWhen an object has been found in JavaScript, it is\
    \ going to be much like a real life object that contains a set of properties and\
    \ abilities.\n\nThe object will have a collection of properties that are named,\
    \ and methods that are going to determine how it is going to function.\n\nThe\
    \ object is going to be saved into a variable while everything else can be obtained\
    \ through a phrase using dot notation.\n\nAs an analogy, if you look at a person,\
    \ they are going to have a name, they have an age, and they are able to move,\
    \ learn, and talk. Should that human be placed into JavaScript, their name and\
    \ age are going to be considered properties which are nothing more than pieces\
    \ of data. The ability to move, talk, and learn are going to be the functions\
    \ of the human being because they are complex behaviors. An object that has theses\
    \ abilities is known as a method.\n\nVariables can hold objects while they create\
    \ the object through the use of a special syntax that is going to be enclosed\
    \ in a set of brackets.\n\nCode:\n\n```javascript\nvar jedi = {\n\nName: “Luke”,\n\
    \nAge: 899,\n\nTalk: function() {\n\n    alert(“another... Sky... walk …”);\n\
    }\n\n};\n```\n\nThe name and age of the Jedi are going to be the properties or\
    \ variables that are sitting inside the object. Objects are able to store any\
    \ data that a variable can. The talking that the Jedi can do is going to be the\
    \ property where the function is being held, also known as the method. The data\
    \ can come back from the object through the use of the phrases using dot notation.\n\
    \nCode:\n\n```javascript\njedi.Name;\n\nLuke\n\njedi.Age ;\n\n899\n\njedi.Talk()\
    \ ;\n\n//an alert box is going to be produced.\n```\n\nThe properties can also\
    \ be reassigned to the object.\n\nCode:\n\n```javascript\njedi.Name = “Mace Windu”;\n\
    ```\n\nOr you can add in new variable objects that were not added in earlier.\n\
    \n```javascript\njedi.lightsaber = “purple” ;\n```\n\nThe properties do not have\
    \ to be any specific data; they can be anything as well as objects and arrays.\
    \ When one object is listed as the property for a different object, you have successfully\
    \ created a nested objected.\n\nCode:\n\n```javascript\nvar person = {\n\nage:\
    \ 122\n\n};\n\nperson.name = {\n\nFirst: “Jeanne” ,\n\nLast: “Calment”\n\n};\n\
    ```\n\nNow if you want to know what the person's first name is, you will use this.\n\
    \nCode:\n\n```javascript\nalert(person.name.First);\n```\n\nTo create the item\
    \ that will be empty you will need to add the properties and methods.\n\nCode:\n\
    \n```javascript\nvar dog = {};\n\ndog.bark = function() {\n\nalert(“Woof!” );\n\
    };\n```\n\n# Chapter 10: JavaScript Arrays\n\nAn array is a list of any sort of\
    \ data and it is not limited to including other arrays. Every item that is listed\
    \ in an array is going to have an index that will be used in retrieving an element\
    \ from the array.\n\nThe index is going to start at zero always and all the elements\
    \ that fall in line are going to increase by one so that the last element will\
    \ be one number less that the length of the total array.\n\nCreating an array\
    \ in JavaScript means that you use an array-literal syntax.\n\nCode:\n\n```javascript\n\
    var emptyArray = [] ;\n\nvar shoppingList = [ 'Rice', 'Soda', 'Buns'];\n```\n\n\
    You are going to be able to get a specific element with the use of a square bracket\
    \ syntax.\n\nCode:\n\n```javascript\nshoppingList[0];\n\nRice\n```\n\nYou can\
    \ also set the value to the particular index by using the square bracket syntax\n\
    \nCode:\n\n```javascript\nshoppingList[1] = 'Chips';\n\n// your shoppingList is\
    \ now going to be ['Soda', 'Chips', 'Rice']\n```\n\nThe quantity of items present\
    \ in the array is going to use the `length` property to tell you how many elements\
    \ there are.\n\nCode:\n\n```javascript\nshoppingList.length;\n\n3\n```\n\nThe\
    \ `push` and `pop` methods can be used so that elements can be added and removed\
    \ from the finish of the array.\n\nCode:\n\n```javascript\nshoppingList.push ('A\
    \ new car');\n\n// shoppingList [ 'Soda', 'Buns', 'Rice', 'A new car']\n\nshoppingList.pop();\n\
    \n// shoppingList is now ['Soda', 'Buns', 'Rice']\n```\n\nThe code below is going\
    \ to create a push, pop, and then iterate it over the array so that it can be\
    \ passed to the name of the function that is labeled as `helloFrom`. Then `helloFrom`\
    \ is going to be returned to the string for the greeting of: “Hello from” and\
    \ then the user’s name. After you have finished with the push and pop method,\
    \ the list of user’s name is going to be “Burt”, “Luke”, “Ron”, and “Tim”.\n\n\
    Code:\n\n```javascript\nvar helloFrom = function(personName) {\n\nreturn “Hello\
    \ from” + personName;\n\n}\n\nvar people = ['Burt', 'Luke', 'Ron'];\n\npeople.push('Tim');\n\
    \npeople.push('Dr Evil');\n\npeople.pop();\n\nfor(var I = 0 ; I < people.length;\
    \ I ++)\n\nvar greeting = helloFrom(people[I]);\n\nalert(greeting) ;\n}\n```\n\
    \n# Chapter 11: DOM\n\nDOM stands for Document Object Model and it will manipulate\
    \ how an HTML page is structured and styled. It is going to be represented by\
    \ the internal pages that the browser is going to see so that the developer is\
    \ able to alter the JavaScript code.\n\nIn order to look at the DOM for a page,\
    \ you are going to open the developer tool inside of the browser that you are\
    \ using and locate the \"elements\" pane. You can do this by clicking right click\
    \ somewhere on the page in your browser and clicking \"Inspect Element\" from\
    \ the menu list.\n\n## Trees and Branches\n\nHTML is similar to the structure\
    \ of an XML in that the elements are going to contain parent nodes from the structure\
    \ that it creates along with children nodes. It is much like tree branches. HTML\
    \ is going to have a single root element that contains branches much like a head\
    \ and body and the limbs that are going to be attached to it. Because of this,\
    \ DOM is also known as a DOM tree.\n"
