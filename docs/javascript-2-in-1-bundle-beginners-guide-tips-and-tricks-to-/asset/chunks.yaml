    \ `switch` 语句在被 JavaScript 执行之前会被评估。当一个语句与另一个语句具有相同的标签时，它将成功匹配。\n\n### Code\n\
    ```javascript\nvar month = 8\n\nif(month === 1) {\n\n  alert(\"January\");\n\n\
    } else if (month === 2) {\n\n  alert(\"February\");\n\n}\n\n… 以此类类推。\n```\n\n\
    当使用 `if-then else` 语句时，会对表达式的清晰度进行检查。`if-then else` 语句将测试任何表达式，以检查是否根据使用的枚举值、字符串值和整数进行测试所需的条件和任何值。`switch`\
    \ 语句将结束任何 `break` 语句。\n\n控制流将继续执行放置在 `switch` 块之后的任何注释。`break` 语句仅在 `switch` 块发生穿透（fall\
    \ through）时使用，但所有其他语句都需要相同的标签，以便按照它们放置的顺序进行执行。`case` 标签的位置并不重要，直到遇到 `break` 语句为止。\n\
    \n### Code\n```javascript\nvar futureMonths = [ ];\n\nvar month = 8;\n\nswitch\
    \ (month) {\n\ncase 1: futureMonths.push (\"January\") ;\n\ncase 2: futureMonths.push\
    \ (\"February\") ;\n\ncase 3: futureMonths.push (\"March\") ;\n\ncase 4: futureMonths.push\
    \ (\"April\") ;\n\ncase 5: futureMonths.push (\"May\") ;\n\ncase 6: futureMonths.push\
    \ (\"June\") ;\n\ncase 7: futureMonths.push (\"July\") ;\n\ncase 8: futureMonths.push\
    \ (\"August\") ;\n\ncase 9: futureMonths.push (\"September\") ;\n\ncase 10: futureMonths.push\
    \ (\"October\") ;\n\ncase 11: futureMonths.push (\"November\") ;\n\ncase 12: futureMonths.push\
    \ (\"December\") ;\n\nbreak ;\n\nbreak ;\n\nDefault: break ;\n\n}\n\nif(futureMonths.length\
    \ === 0) {\n\n  alert (\"Invalid month number\") ;\n\n} else {\n\n  for(var i=0;\
    \ i<futureMonths.length; i++) {\n\n    alert(monthName);\n\n  }\n\n}\n```\n\n\
    该代码的输出将弹出从 8 月到 12 月的月份。\n\n当 `break` 结束时，你不需要替换任何代码，因为代码已经从 `switch` 语句中消失了。强烈建议使用此\
    \ `break`，因为它使修改代码变得更容易，从而减少可能收到的错误。`default` 下的代码部分将处理未放置在 `case` 部分的值。代码可以包含多个\
    \ `case`。\n\n### Code\n```javascript\nvar month = 2;\n\nvar year = 2016;\n\nvar\
    \ numDays = 0;\n\nswitch (month) {\n\ncase 1: case 3: case 5:\n\ncase 7: case\
    \ 8: case 10:\n\ncase 12:\n\nnumDays = 28;\n\nbreak ;\n\ncase 4: case 6:\n\ncase\
    \ 9: case 11:\n\nnumDays = 31;\n\nbreak;\n\ncase 2:\n\nif ((year % 4 === 0) &&\n\
    \n!(year % 100 === 0)\n\n|| (year % 400 === 0))\n\nnumDays = 29;\n\nelse\n\nnumDays=\
    \ 28;\n\nbreak;\n\ndefault: alert (\"Invalid month.\") ;\n\nbreak ;\n\n}\n\nalert(\"\
    Number of Days = \" + numDays) ;\n```\n\n结果将是 29，因为在 2 月发现了 29 天。\n\n### Switch\
    \ 语句字符串\n字符串对象将被放入 `switch` 语句中。在某个时刻，将放置一个 `switch`，其表达式将根据 `case` 标签与其他表达式进行比较。只有当\
    \ `case` 为小写且 `case` 标签也是小写时，这些字符串才能被 `switch` 。\n\n### Code\n```javascript\n\
    var month = \"January\";\n\nvar monthNumber = 0;\n\nswitch (month.toLowerCase())\
    \ {\n\ncase \"january\":\n\nmonthNumber = 1\n\nbreak ;\n\n}\n```\n\n该语句将继续执行，直到所有十二月份都以小写写出来以及对应的月份数字。\n\
    \n### While 和 do while 语句\n`while` 语句只有在条件为真时才会在语句块上连续工作。\n\n#### Syntax\n```\n\
    while (expression) {\n  Statement(s)\n}\n```\n\n`while` 语句会在返回布尔语句之前评估任何和所有表达式。当发现条件为真时，它将执行\
    \ `while` 块中的任何语句。但当语句被测试时，它将一直执行到语句被证明为假为止。\n\n### Code\n```javascript\nvar count\
    \ = 5 ;\n\nwhile (count < 15) {\n\n  alert(\" Count is: \" + count) ;\n\n  count++;\n\
    \n}\n```\n\n无限循环将以此语法在 `while` 语句中实现：\n```javascript\nwhile(true){\n// 脚本属于此部分\n\
    }\n```\n\n`do while` 语句也可以是 JavaScript 编码的一部分。\n\n```javascript\ndo {\n  Statement(s)\n\
    } while (expression) ;\n```\n\n`do while` 语句与无限循环之间的主要区别在于，作为 `while` 循环执行执行的表达式会在\
    \ JavaScript 向上运行时时首先被评估。\n\n### Code\n```javascript\nvar count = 5\n\ndo {\n\
    \  alert(\"Count is: \" + count)\n  count++;\n\n} while (count < 10) ;\n```\n\n\
    ### For 语句\n`For` 语句为迭代提供了一种方法。\n\n#### Syntax\n```\nfor (initialization; termination;\
    \ Increment) {\n  Statement(s)\n}\n```\n\n当你处理 `for` 语句时，必须记住每当条件为假时就会发生 `termination`。`Increment`\
    \ 表达式将在循环后调用。最后，初始化将启动循环。\n\n### Code\n```javascript\nfor (var i=1 ; i<12; i++){\n\
    \  alert (\"Count is: \" + i);\n}\n```\n\n输出将是从一到十的数字。当声明代码时，变量将从其声明的地方开始扩展。如果变量在\
    \ `for` 语句中声明，则不能在循环外部使用。`j`、`k` 和 `I` 等变量用于循环控制。一旦变量被声明，该变量的生命周期就会缩短，从而减少错误发生的概率。在\
    \ `for` 循环中将使用三个表达式。`for` 语句可以包含一个在迭代过程中使用的不同变体。\n\n### Code\n```javascript\n\
    var numbers = [11, 12, 13, 14, 15, 16, 17, 18, 19];\n\nfor (var i=0; i<numbers.length;\
    \ i++) {\n  alert (\" Count is : \" + numbers[i])\n}\n```\n\n这种变体使语句更短。使用这种变体将按照\
    \ `for` 语句通常的通用方式写出语句。\n\n### break 语句\nJavaScript 中使用了两种 `break` 语句，带标签的语句和无标签的语句。无标签语句用于使用\
    \ `switch` 语句时。这些 `break` 也会终止大多数循环。\n\n### Code\n```javascript\nvar arrayOfInts\
    \ = [72, 57, 5, 579, 14, 1179, 2120, 9, 655, 145];\n\nvar searchfor = 14;\n\n\
    var I;\n\nvar foundIt = false;\n\nfor (I = 0; I < arrayOfInts.length; I++) {\n\
    \  if (arrayOfInts [I] === searchfor) {\n    foundIt = true;\n    break;\n  }\n\
    }\n\nif (foundIt) {\n  alert(\"found \" + searchfor + \" at index \" + I);\n}\
    \ else {\n  alert(\"not in the array\");\n}\n```\n\n"
- fmt: "\n`break` statements have to be placed in bold print wherever the loop has\
    \ been terminated before the value that you want to extract is reached. Most control\
    \ flow statements can be transferred into loops.\n\nIn the code, above, the output\
    \ will be the number twelve and that it was found at the fourth index.\n\n`breaks`\
    \ are going to be unlabeled and therefore will terminate any inside parts of the\
    \ `switch`, while, `do while`, and `for` statements. When a `break` is labeled,\
    \ it will stop any statement that is found on the outside.\n\nCode:\n\n```javascript\n\
    var arrayOfInts = [ [ 32, 87, 3, 589 ], [ 12, 1076, 2000, 8 ], [ 622, 127, 77,\
    \ 955] ];\n\nvar searchfor = 12;\n\nvar I;\n\nvar j = 0;\n\nvar foundIt = false;\n\
    \nsearch:\n\nfor(I =0; I < arrayOfInts.length; I++) {\n  for (j = 0; j < arrayOfInts[I].length;\
    \ j++) {\n    if (arrayOfInts[I][j] === searchfor) {\n      foundIt = true;\n\
    \      break search;\n    }\n  }\n}\n\nif (foundIt) {\n  alert(\"Found \" + searchfor\
    \ + \" at \" + I + \", \" +j);\n} else {\n  alert(searchfor + \" not in the array\"\
    );\n}\n```\n\nThe output will be that twelve was found in the first index.\n\n\
    Labeled statements are going to stop at `break` statements and then the flow is\
    \ not going to be transferred. When a control flow statement is transferred, the\
    \ label is going to stop the statement.\n\n### Continue statements\n\n`continue`\
    \ statements are going to skip over any iteration that you place inside of a `for`,\
    \ `do while`, or `while` loop. The forms that are unlabeled will be skipped so\
    \ that the code on the inside is evaluated before the Boolean expression that\
    \ is going to control your loop.\n\nCode:\n\n```javascript\nvar searchMe = \"\
    Peter Piper picked a \" + \"peck of pickled peppers\";\n\nvar max = searchMe.length;\n\
    \nvar numPs=0;\n\nfor (var I = 0; I < max; I++) {\n  // interested only in p’s\n\
    \  if (searchMe[I] !== 'p')\n    continue;\n  // process p’s\n  numPs++;\n}\n\n\
    alert(\"found \"  + numPs + \" p-s in the string. );\n```\n\nThere are 7 p’s that\
    \ were found in the code above.\n\nWhenever the `continue` statement is removed,\
    \ there are really going to be thirty-five p’s found. The statement is going to\
    \ be skipped it is found to have a label for the current iteration on the outer\
    \ loop.\n\nIn this code you are going to see that there are two loops that have\
    \ been nested together so that the substring can be searched. At the point in\
    \ time that two loops are nested, it will be required that one is iterated over\
    \ the substring while the other string is searched.\n\nCode:\n\n```javascript\n\
    var searchMe = \"Look for a substring in me\" ;\n\nvar substring = \"sub\";\n\n\
    var foundIt = false;\n\nvar max = searchMe.length - substring.length;\n\ntest:\n\
    \nfor (var I = 0; I <= max; I++) {\n  var n = substring.length;\n  var j = I;\n\
    \  var k =0;\n  while (n-- !== 0) {\n    if (searchMe[j++] !== substring[k++])\
    \ {\n      continue test;\n    }\n  }\n  foundIt = true;\n  break test;\n}\n\n\
    alert(foundIt ? \"Found it\" : \"Didn’t find it\");\n```\n\n### Return statement\n\
    \nA `return` statement can be found at the end of a branching statement. `return`\
    \ statements are used as exit methods for current control flow statements so that\
    \ they can return to the point that the method was first invoked. Just like the\
    \ other expression, there are going to be two different expressions that can be\
    \ used for a statement that has been returned.\n\nWhen a value is found in one\
    \ statement, it is going to be returned while the value for the other will not\
    \ be. To get a value returned, you are going to need to have the value listed\
    \ after the keyword that you want returned. The syntax will be `return ++ count\
    \ ;`.\n\nThe data type that has been returned is going to need to match the type\
    \ that the method declared. Once the method has been declared then the value will\
    \ be bad and it is not going to return a value.\n\n### Conclusion\n\nThank for\
    \ making it through to the end of JavaScript: Beginner’s Guide to Programming\
    \ Code with JavaScript, let’s hope it was informative and able to provide you\
    \ with all of the tools you need to achieve your goals whatever it may be.\n\n\
    The next step is to use the coding skills that you have learned and create your\
    \ own code. It is not going to be easy at first, but it is going to be worth it.\
    \ There will be times that you are going to mess up, but you should be patient\
    \ because just like when you learn anything new, you are going to make mistakes.\n\
    \nDo not give up because your code does not work the first time. Go over the lessons\
    \ in this book again and reread them. Learning how to write code is going to be\
    \ confusing until you get the hang of it because of all the different conditions\
    \ and exceptions that you are going to learn.\n\nOnce you have gotten the hang\
    \ of code, you are going to have the ability to create your own web pages, mobile\
    \ applications, and so much more. JavaScript is a versatile code that is going\
    \ to help you in more ways than one.\n\nFinally, if you found this book useful\
    \ in inway, a review on Amazon is always appreciated! \n\nJavaScript:\nTips and\
    \ Tricks to Programming Code\nwith JavaScript\nCharlie Masterson\n\n**Table of\
    \ Contents**\n- [Introduction](#026.html)\n- [Chapter 1: Simple Tricks to Help\
    \ You Learn Faster](#028.html)\n- [Chapter 2: JavaScript Cheat Sheet – Must Haves\
    \ for Every Programmer](#030.html)\n- [Chapter 3: Tips and Tricks to Design and\
    \ Build Your Own Library](#032.html)\n- [Chapter 4: Tips and Tricks to Keep and\
    \ Remember](#034.html)\n- [Chapter 5: JavaScript Skills to Know Moving Forward](#037.html)\n\
    - [Conclusion](#039.html)\n"
