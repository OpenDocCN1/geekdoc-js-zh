    \ when a `switch` statement is used. These breaks are also going to terminate\
    \ most loops.\n\n### Code\n```javascript\nvar arrayOfInts = [72, 57, 5, 579, 14,\
    \ 1179, 2120, 9, 655, 145];\n\nvar searchfor = 14;\n\nvar I;\n\nvar foundIt =\
    \ false;\n\nfor (I = 0; I < arrayOfInts.length; I++) {\n  if (arrayOfInts [I]\
    \ === searchfor) {\n    foundIt = true;\n    break;\n  }\n}\n\nif (foundIt) {\n\
    \  alert(\"found \" + searchfor + \" at index \" + I);\n} else {\n  alert (\"\
    not in the array\");\n}\n```\n"
