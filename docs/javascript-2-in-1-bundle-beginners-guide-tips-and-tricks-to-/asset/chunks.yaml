    \ (\"December\") ;\n\nbreak ;\n\nbreak ;\n\nDefault: break ;\n\n}\n\nif(futureMonths.length\
    \ === 0) {\n\n  alert (\"Invalid month number\") ;\n\n} else {\n\n  for(var i=0;\
    \ i<futureMonths.length; i++) {\n\n    alert(monthName);\n\n  }\n\n}\n```\n\n\
    The output for the code will popup the months from August through December.\n\n\
    When the `break` ends, you are not going to need to replace any of the code because\
