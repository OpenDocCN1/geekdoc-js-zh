  trans: "\n\n但对于大多数开发者或编码人员来说，拥有自己的库是一种爱好；这让他们能够编写多个代码、帮助他人并为这一过程做出贡献。\n\n# 你的目标与工作范围\n\
    \n在开始编写代码之前，你需要明确你开发这个库的目标是什么。这可以帮助你专注于你所遇到的问题，以及如何用你的库来解决它们。\n\n你的首要目标也是让你的库易于使用。从本质上说，`API`\
    \ 越简单，任何人就越容易使用你的库。\n\n所以问问自己——你的库解决了什么问题，你又如何解决它？你是打算利用别人库中的代码，还是将亲手编写一切？\n\n\
    在第 1 章中，我们讨论了如何创建路线图。你库的路线图将成为你在进行任何其他代码开发时使用的技巧之一。\n\n## 你的库的路线图：\n\n-   列出你希望库中具备的功能\n\
    -   使这些功能保持最少且实用\n-   为每个功能创建里程碑\n\n你通过路线图所做的是为每个函数设定目标，本质上是将你的项目拆分为易于管理的规模，使其更容易完成，并让创建过程变得更加愉快。它还能让你保持理智和专注。\n\
    \n# 你的库 API 设计\n\n在创建库时，将自己想象成终端用户。通过把自己置于用户的位置，朝着以用户为中心的设计和开发工作。这将使得任何访问该库的人都能使用得更加方便。\n\
    \n## 测试你的 API\n\n测试 `API` 质量最好的方法是将其用于你的项目。你可以尝试将应用程序代码替换为你的库，看看它给结果是否涵盖了你想要的所有功能。尽可能保持最核心的基础，同时也为灵活性留出空间以更改和修订任何可能略有偏差的内容。\n\
    \n以下是实现代码或 User-Agent 字符串库的示例：\n\n代码：\n\n```javascript\n// 从空的 UserAgent string\
    \ 开始\n\nvar userAgent = new UserAgent;\n\n// 创建并添加第一个产品：EvilCorpBrowser/1.2 (X11;\
    \ Linux; en-us)\n\nvar application = new UserAgent.Product('EvilCorpBrowser',\
    \ '1.2');\n\napplication.setComment('X11', 'Linux', 'en-us');\n\nuserAgent.addProduct(application);\n\
    \n// 创建并添加第二个产品：Blink/20420101\n\nvar engine = new UserAgent.Product('Blink',\
    \ '20420101');\n\nuserAgent.addProduct(engine);\n\n// EvilCorpBrowser/1.2 (X11;\
    \ Linux; en-us) Blink/20420101\n\nuserAgent.toString();\n\n// 对 engine 产品进行更多更改\n\
    \nengine.setComment('Hello World');\n\n// EvilCorpBrowser/1.2 (X11; Linux; en-us)\
    \ Blink/20420101 (Hello World)\n\nuserAgent.toString();\n```\n\n取决于你库的复杂程度，你还需要考虑结构化。实现此点的一种方法是利用设计模式来结构化你的库，并克服在此过程中可能遇到的任何技术问题。\n\
    \n结构化还可以减少在你的库添加新功能时，重新对齐大部分部分的风险。\n\n## 灵活性与自定义\n\n市面上大多数 JavaScript 库酷酷的一点在于其灵活性。然而，许多开发者在决定哪些可以自定义哪些不能自定义时会面临问题。其中之一就是\
    \ `chart.js` 和 `D3.js`。\n\n这两个都是数据可视化的优秀库。如果你需要对图形有更多的控制权，那么 `D3.js` 就是你想要的。如果你想要某种易于创建且提供不同类型内置图表的东西，那么\
    \ `Chart.js` 是你的选择。\n\n有三种方法可以让你用户对你的库拥有控制权：\n\n1.  配置\n2.  暴露公共方法\n3.  回调函数与事件\n\
    \n配置一个库通常是在项目初始化阶段完成的，但某些库也允许你在运行时期间设置。这些配置通常仅限于简单的问题，因为更改这些设置只会更新这些值以供以后使用。\n\
    \n代码：\n\n```javascript\n// 在初始化时配置\n\nvar userAgent = new UserAgent({\n\n  commentSeparator:\
    \ ';'\n});\n\n// 使用公共方法进行运行时配置\n\nuserAgent.setOption('commentSeparator', '-');\n\
    \n// 使用公共属性进行运行时配置\n\nuserAgent.commentSeparator = '-';\n```\n\n某些方法被刻意暴露，以便与实例交互（getter），例如从实例中检索数据或将数据放入实例（setter），以及执行某些操作。\n\
    \n代码：\n\n```javascript\nvar userAgent = new UserAgent;\n\n// 用于从所有产品中检索注释的 getter\n\
    \nuserAgent.getComments();\n\n// 打乱所有产品顺序的 action\n\nuserAgent.shuffleProducts();\n\
    ```\n\n回调函数有时也会通过公共方法接受并传递，它通常用于在异步任务后运行用户代码。\n\n```javascript\nvar userAgent\
    \ = new UserAgent;\n\nuserAgent.doAsyncThing(function asyncThingDone() {\n\n \
    \ // 在异步任务完成后运行代码\n});\n```\n\n事件在 JavaScript 库中具有巨大的潜力。与回调函数略相似，它们有一个微小的区别，添加事件处理器不会触发动作。事件还用于指示某些事件，并可以向用户提供额外信息，同时返回一个供库对应的特定值。\n\
    \n代码：\n\n```javascript\nvar userAgent = new UserAgent;\n\n// 在添加时验证产品\n\nuserAgent.on('product.add',\
    \ function onAdd(product) {\n  var shouldProduct = product.toString().length <\
    \ 5;\n  // 告诉库添加\n  return shouldProduct;\n});\n```\n\n你也可以允许用户扩展你的库。为了让扩展遵循某些约定，你需要编写文档。你需要提供公共方法或属性，例如\
    \ Angular 模块。\n\n代码：\n\n```javascript\n(angular.module('myModule')) && jQuery.fn.myPlugin\n\
    ```\n\n你也可以什么都不做，让用户通过其命名空间访问你的库。\n\n代码：\n\n```javascript\n// AngryUserAgent 模块\n\
    // 拥有 UserAgent\n(function AngryUserAgent(UserAgent) {\n  // 创建新方法 .toString()\n\
    \  UserAgent.prototype.toString = function() {\n    return this.toString().toUpperCase();\n\
    \  };\n})(UserAgent);\n\n// 应用代码\nvar userAgent = new UserAgent;\n\n// ...\n\n\
    // EVILCORPBROWSER/1.2 (X11; Linux; en-us) BLINK/20420101\n\nuserAgent.toString();\n\
    ```\n\n同样，这允许你覆盖方法。\n\n代码：\n\n```javascript\n// AngryUserAgent 模块\n(function AngryUserAgent(UserAgent)\
    \ {\n  // 存储旧的 .toString() 方法备后使用\n  var _toString = UserAgent.prototype.toString;\n\
    \n  // 覆盖 .toString()\n  UserAgent.prototype.toString = function() {\n    return\
    \ _toString.call(this).toUpperCase();\n  };\n})(UserAgent);\n\nvar userAgent =\
    \ new UserAgent;\n\n// ...\n\n// EVILCORPBROWSER/1.2 (X11; Linux; en-us) BLINK/20420101\n\
    \nuserAgent.toString();\n```\n\n在这种情况下，让用户访问库的命名空间也意味着你对插件和扩展的定义控制力较小。\n\n为了允许扩展遵循某些约定，你需要编写文档。\n\
    \n# 测试\n\n对于测试驱动开发，大纲是至关重要的。换句话说，这是你以测试的形式写下功能和标准的时刻，甚至在编写实际库之前。\n\n如果你的测试显示某个功能的行为符合预期，并且你在将其写入库中之前就写下了它，那么这种策略被称为行为驱动开发。\n\
    \n如果你的测试涵盖了库的每一个方面，那么只要你的代码通过了所有这些测试，你就可以安全地说你的库运行良好。\n\n你还可以使用的其他测试框架有：\n\n[使用\
    \ Mocha 和 Chai 测试你的 JavaScript](http://www.sitepoint.com/unit-test-javascript-mocha-chai/)\
    \ 由 Jani Hartikainen 编写，其中你可以在 Mocha 中编写单元测试。\n\n"
- fmt: "\n[Testing JavaScript with Jasmine, Travis, and Karma](http://www.sitepoint.com/testing-javascript-jasmine-travis-karma/)\
    \ by Tim Evko shows you how to set up a testing pipeline coherently with another\
    \ framework called `Jasmine`.\n\nBelow mentioned is another outline that you can\
    \ try by Tim Severien. He has used a `Jasmine` test for his library and it looks\
    \ something like this.\n\nCode:\n\n```javascript\ndescribe('Basic usage', function\
    \ () {\n\n  it('should generate a single product', function () {\n    // Create\
    \ a single product\n    var product = new UserAgent.Product('EvilCorpBrowser',\
    \ '1.2');\n    product.setComment('X11', 'Linux', 'en-us');\n    expect(product.toString())\n\
    \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; en-us)');\n  });\n\n  it('should\
    \ combine several products', function () {\n    var userAgent = new UserAgent;\n\
    \    // Create and add first product\n    var application = new UserAgent.Product('EvilCorpBrowser',\
    \ '1.2');\n    application.setComment('X11', 'Linux', 'en-us');\n    userAgent.addProduct(application);\n\
    \    // Create and add second product\n    var engine = new UserAgent.Product('Blink',\
    \ '20420101');\n    userAgent.addProduct(engine);\n    expect(userAgent.toString())\n\
    \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101');\n  });\n\
    \n  it('should update products correctly', function () {\n    var userAgent =\
    \ new UserAgent;\n    // Create and add first product\n    var application = new\
    \ UserAgent.Product('EvilCorpBrowser', '1.2');\n    application.setComment('X11',\
    \ 'Linux', 'en-us');\n    userAgent.addProduct(application);\n    // Update first\
    \ product\n    application.setComment('X11', 'Linux', 'nl-nl');\n    expect(userAgent.toString())\n\
    \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; nl-nl)');\n  });\n});\n```\n\n\
    Once you have done your testing and you are completely satisfied with the API\
    \ design for your first library version, then you can start thinking about the\
    \ site’s architecture and how exactly will your library be used.\n\n### Module\
    \ Loader Compatibility\n\nNot many developers use module loaders, and this is\
    \ entirely up to you too. However, you need to be aware that some developers that\
    \ use your library might choose to use a module loader, so you need to make your\
    \ library compatible with this feature.\n\nYou can choose some of the popular\
    \ module loaders such as `AMD`, `RequireJS`, and `CommonJS`. If choosing between\
    \ these functions is hard for you, you can also try `Universal Module Definition`\
    \ (`UMD`) which is aimed at supporting several types of module loaders.\n\nTo\
    \ make your library `UMD` compatible, you can also find some variations such as\
    \ the `UMD` GitHub repository. Begin to create your library by using one of these\
    \ templates. Another tip is to use `Babel` to compile `ES5` combined with `Babel`’s\
    \ `UMD` plugin if you choose to use `ES2015` `import/export` syntax function.\
    \ This way, you can use `ES2015` in your projects as well as produce a library\
    \ that can be used by all kinds of developers using various modules.\n\n### Documentation\n\
    \nYou need to start your documentation with basic information such as your project\
    \ name as well as a short description of what it is about. This will help others\
    \ understand what your library is meant to do and whether using your library is\
    \ a good choice for them. You can also include a little bit more information on\
    \ things such as scope and goals so users are better informed. Your roadmap can\
    \ also be included so users know what they can expect in the future in your library\
    \ development and how they can also contribute to it.\n\n### API, Tutorials and\
    \ Examples\n\nAPI documentation is also an essential part of documentation as\
    \ it will tell users how exactly to use your library. Other good additions would\
    \ be examples as well as tutorials. This can take up some time so you can do this\
    \ as your library development is on-going.\n\n### Meta-tasks\n\nUsers will also\
    \ want to make changes to your library and this is usually in the form of a contribution\
    \ but some may want to create a custom build only for private use. For these users,\
    \ you can include documentation for meta-tasks that include a list of commands\
    \ to build the library, run testing, generate and convert or download data.\n\n\
    ### Contribution\n\nContributions are great especially when you open-source your\
    \ library. Another documentation you can add in is to guide contributors to explain\
    \ the steps in making a contribution to the library and what kind of criteria\
    \ should they fill before making a contribution. This will make your review process\
    \ easier to accept contributions that can actively upgrade and enhance your library.\n\
    \n### License\n\nLicenses are important too. Include licenses so everyone knows\
    \ what material is copyrighted. [ChooseALicense.com](http://choosealicense.com/)\
    \ is recommended as an excellent resource for acquiring a license without any\
    \ legal advisor. Save your chosen license as text in a `LICENSE.txt` file format\
    \ in your project’s root.\n\n### Adding Versions/Releases to Your Git\n\nVersioning\
    \ is necessary for a good library. The current standard for versioning is [SemVer](http://semver.org/),\
    \ which comprises three numbers: major, minor and patch. To create a tag, open\
    \ your terminal and do the following:\n\n```bash\ngit tag -a [version] -m [message]\n\
    ```\n\nExample:\n\n```bash\ngit tag -a v1.0.0 -m \"First release\"\n```\n\n###\
    \ Publishing to Common Repositories\n\nMost programming languages are equipped\
    \ with package managers or they at least have a third party package manager. For\
    \ example, PHP’s manager is [Composer](http://www.sitepoint.com/mastering-composer-tips/)\
    \ and Ruby on Rails is [RubyGems](https://rubygems.org/). By default, your `npm`\
    \ package will be available publicly. But you also have the option of publishing\
    \ the following:\n\n- [private packages](https://www.npmjs.com/npm/private-packages)\n\
    - [set up a private registry](https://docs.npmjs.com/misc/registry#can-i-run-my-private-registry)\n\
    - [completely avoid publishing](https://docs.npmjs.com/misc/registry#i-dont-want-my-package-published-in-the-official-registry-its-private)\n\
    \nHowever, should you decide to publish your package, then you need the `package.json`\
    \ file. You can do this manually or use an interactive wizard for this. To begin\
    \ this wizard, start by typing:\n\n```bash\nnpm init\n```\n\nThe `version` property\
    \ should match your git tag. Include the `README.md` file as well. Just like GitHub,\
    \ `npm` uses that for the page presenting your package.\n\nOnce done, publish\
    \ your package by typing:\n\n```bash\nnpm publish\n```\n\nThat’s it! You have\
    \ successfully published your `npm` package.\n\n### Bower\n\nAnother useful package\
    \ manager called `Bower` surfaced a few years ago. This is a package manager designed\
    \ for the web. Here, you can find all major front-end asserts. The only thing\
    \ is, your library will benefit from using `Bower` to publish your package is\
    \ if your library set up to be browser-compatible. `npm` packages are primarily\
    \ for JavaScript and many front-end packages still use `npm` but `Bower` is still\
    \ fundamentally popular so go ahead and publish using `Bower` too.\n\nTo generate\
    \ a `bower.json` file, type:\n\n```bash\nbower init\n```\n\nJust like `npm init`,\
    \ the instructions are self-explanatory. Finally, to publish your package:\n\n\
    ```bash\nbower register [package-name] [repo-url]\n```\n\nNow you have your library\
    \ available for everyone to use in their Node projects or on the web!\n\n### Conclusion\n\
    \nRemember that your code development is the library. Make sure your library solves\
    \ a problem, it is convenient and easy to use and above all stable. This will\
    \ ensure that you and many other developers who use it are happy.\n"
  raw: '[Testing JavaScript with Jasmine, Travis, and Karma](http://www.sitepoint.com/testing-javascript-jasmine-travis-karma/)
    by Tim Evko shows you how to set up a testing pipeline coherently with another
    framework called Jasmine.


    Below mentioned is another outline that you can try by Tim Severien. He has used
    a Jasmine test for his library and it looks something like this.


    Code:


    describe(''Basic usage'', function () {


      it(''should generate a single product'', function () {


        // Create a single product


        var product = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');


        product.setComment(''X11'', ''Linux'', ''en-us'');


        expect(product.toString())


          .toBe(''EvilCorpBrowser/1.2 (X11; Linux; en-us)'');


      });


      it(''should combine several products'', function () {


        var userAgent = new UserAgent;


        // Create and add first product


        var application = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');


        application.setComment(''X11'', ''Linux'', ''en-us'');


        userAgent.addProduct(application);


        // Create and add second product


        var engine = new UserAgent.Product(''Blink'', ''20420101'');


        userAgent.addProduct(engine);


        expect(userAgent.toString())


          .toBe(''EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101'');


      });


      it(''should update products correctly'', function () {


        var userAgent = new UserAgent;


        // Create and add first product


        var application = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');


        application.setComment(''X11'', ''Linux'', ''en-us'');


        userAgent.addProduct(application);


        // Update first product


        application.setComment(''X11'', ''Linux'', ''nl-nl'');


        expect(userAgent.toString())


          .toBe(''EvilCorpBrowser/1.2 (X11; Linux; nl-nl)'');


      });


    });


    Once you have done your testing and you are completely satisfied with the API
    design for your first library version, then you can start thinking about the site’s
    architecture and how exactly will your library be used.


    Module Loader Compatibility


    Not many developers use module loaders, and this is entirely up to you too. However,
    you need to be aware that some developers that use your library might choose to
    use a module loader, so you need to make your library compatible with this feature.


    You can choose some of the popular module loaders such as AMD, RequireJS, and
    CommonJS. If choosing between these functions is hard for you, you can also try
    Universal Module Definition (UMD) which is aimed at supporting several types of
    module loaders.


    To make your library UMD compatible, you can also find some variations such as
    the UMD GitHub repository. Begin to create your library by using one of these
    templates. Another tip is to use Babel to compile ES5 combined with Babel’s UMD
    plugin if you choose to use ES2015 import/export syntax function. This way, you
    can use ES2015 in your projects as well as produce a library that can be used
    by all kinds of developers using various modules.


    Documentation


    You need to start your documentation with basic information such as your project
    name as well as a short description of what it is about. This will help others
    understand what your library is meant to do and whether using your library is
    a good choice for them. You can also include a little bit more information on
    things such as scope and goals so users are better informed. Your roadmap can
    also be included so users know what they can expect in the future in your library
    development and how they can also contribute to it.


    API, Tutorials and Examples


    API documentation is also an essential part of documentation as it will tell users
    how exactly to use your library. Other good additions would be examples as well
    as tutorials. This can take up some time so you can do this as you library development
    is on-going.


    Meta-tasks


    Users will also want to make changes to your library and this is usually in the
    form of a contribution but some may want to create a custom build only for private
    use. For these users, you can include documentation for meta-tasks that include
    a list of commands to build the  library, run testing, generate and convert or
    download data.


    Contribution


    Contributions are great especially when you open-source your library. Another
    documentation you can add in is to guide contributors to explain the steps in
    making a contribution to the library and what kind of criteria should they fill
    before making a contribution. This will make your review process easier to accept
    contributions that can actively upgrade and enhance your library.


    License


    Licenses are important too. Include licenses so everyone knows what material is
    copyrighted. [ChooseALicense.com](http://choosealicense.com/) is recommended as
    an excellent resource for acquiring a license without any legal advisor. Save
    your chosen license as text in a LICENSE.txt file format in your project’s root.


    Adding Versions/Releases to Your Git Repository


    Versioning is necessary for a good library. The current standard for version naming
    is via the SemVer, short for [Semantic Versioning](http://semver.org/). This version
    comprises three numbers to indicate different changes for major, minor and patch.
    If you do have a git repository, you can also add in version numbers. Consider
    the snapshots of your repository or Tags. To create a tag, open its terminal and
    do the following:


    # git tag -a [version] -m [version message]


    git tag -a v1.2.0 -m "Awesome Library v1.2.0"


    GitHub for example provides a comprehensive view of all your versions as well
    as download links for each one of them.


    Publishing to Common Repositories


    npm


    Most programming languages are equipped with package managers or they at least
    have a third party package manager that enables users to pull in specific libraries
    for that specific programming language. For example, PHP’s manager is [Composer](http://www.sitepoint.com/mastering-composer-tips-tricks/) and
    Ruby on Rails is [RubyGems](https://rubygems.org/). For a standalone JavaScript
    engine such as Node.js you have [npm](https://www.npmjs.com/). By default, your
    npm package will be available publicly. But you also have the option of publishing
    the following:


    - [private packages](https://www.npmjs.com/npm/private-packages)


    - [set up a private registry](https://docs.npmjs.com/misc/registry#can-i-run-my-own-private-registry) 


    - [completely avoid publishing](https://docs.npmjs.com/misc/registry#i-dont-want-my-package-published-in-the-official-registry-its-private)


    However, should you decide to publish your package, then you need the package.json
    file. You can do this manually or use an interactive wizard for this. To begin
    this wizard, start by typing:


    npm init


    The version property should match your git tag. Include the README.md file as
    well. Just like GitHub, npm uses that for the page presenting your package.


    Once done, publish your package by typing:


    npm publish


    That’s it! You have successfully published your npm package.


    Bower


    Another useful package manager called Bower surfaced a few years ago. This is
    a package manager designed for the web. Here, you can find all major front-end
    asserts. The only thing is, your library will benefit from using Bower to publish
    your package is if your library set up to be browser-compatible.


    npm packages are primarily for JavaScript and many front-end packages still use
    npm but Bower is still fundamentally popular so go ahead and publish using Bower
    too.


    To generate a bower.json file, type:


    bower init


    Just like npm init, the instructions are self-explanatory. Finally, to publish
    your package:


    bower register awesomelib [https://github.com/you/awesomelib](https://github.com/you/awesomelib)


    Now you have your library available for everyone to use in their Node projects
    or on the web!


    Conclusion


    Remember that your code development is the library. Make sure your library solves
    a problem, it is convenient and easy to use and above all stable. This will ensure
    that you and many other developers who use it are happy.'
