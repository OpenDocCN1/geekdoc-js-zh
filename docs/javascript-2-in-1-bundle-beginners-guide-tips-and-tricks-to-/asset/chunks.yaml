    ### Code\n```javascript\nvar month = 2;\n\nvar year = 2016;\n\nvar numDays = 0;\n\
    \nswitch (month) {\n\ncase 1: case 3: case 5:\n\ncase 7: case 8: case 10:\n\n\
    case 12:\n\nnumDays = 28;\n\nbreak ;\n\ncase 4: case 6:\n\ncase 9: case 11:\n\n\
    numDays = 31;\n\nbreak;\n\ncase 2:\n\nif ((year % 4 === 0) &&\n\n!(year % 100\
    \ === 0)\n\n|| (year % 400 === 0))\n\nnumDays = 29;\n\nelse\n\nnumDays= 28;\n\n\
    break;\n\ndefault: alert (\"Invalid month.\") ;\n\nbreak ;\n\n}\n\nalert(\"Number\
    \ of Days = \" + numDays) ;\n```\n\nThe result will be 29 being that there are\
    \ 29 days found in February.\n\n### Switch statement strings\nThe string objects\
    \ are going to be placed into switch statements. At some point in time a switch\
    \ is going to be placed with the expression being compared to other expressions\
    \ based on their case labels. These strings can be accepted into a switch only\
    \ if the case is lowercase and the case labels are lowercased as well.\n\n###\
    \ Code\n```javascript\nvar month = \"January\";\n\nvar monthNumber = 0;\n\nswitch\
    \ (month.toLowerCase()) {\n\ncase \"january\":\n\nmonthNumber = 1\n\nbreak ;\n\
    \n}\n```\n\nThe statement is going to continue to be executed until the point\
    \ in time that all twelve months have been written out in lower case along with\
    \ the number that is associated with that month.\n\n### While and do while statements\n\
    While statements are going to work on the statement blocks continuously only if\
    \ a condition is met to be true.\n\n#### Syntax\n```\nwhile (expression) {\n \
    \ Statement(s)\n}\n```\n\nA `while` statement is going to evaluate any and all\
    \ expressions before returning a Boolean statement. When the condition is found\
    \ to be true, it is going to execute any statements that are found in the `while`\
    \ block. But, when the statement is tested, it will be executed up until the statement\
    \ has been proven as false.\n\n### Code\n```javascript\nvar count = 5 ;\n\nwhile\
    \ (count < 15) {\n\n  alert(\" Count is: \" + count) ;\n\n  count++;\n\n}\n```\n\
    \nThe infinite loops are going to be implemented in a `while` statement with this\
    \ syntax:\n```javascript\nwhile (true){\n// your script belongs in this section\n\
    }\n```\n\nA `do while` statement can be part of the coding for JavaScript as well.\n\
    \n```javascript\ndo {\n  Statement(s)\n} while (expression) ;\n```\n\nThe main\
    \ dissimilarity between a `do while` statement and an infinite loop is going to\
    \ be that the expressions found as condition for `while` loop to execute will\
    \ be evaluated first as JavaScript works its way to the top.\n\n### Code\n```javascript\n\
    var count = 5\n\ndo {\n  alert(\"Count is: \" + count)\n  count++;\n\n} while\
    \ (count < 10) ;\n```\n\n### For statement\n`For` statements are going to provide\
    \ a way for to be iterated.\n\n#### Syntax\n```\nfor (initialization; termination;\
    \ Increment) {\n  Statement(s)\n}\n```\n\nWhen you are dealing with `for` statements,\
    \ you have to remember that `termination` is to happen whenever the condition\
    \ is false. `Increment` expressions are going to be called after the loop, Finally,\
    \ the initialization will start the loop.\n\n### Code\n```javascript\nfor (var\
    \ i=1 ; i<12; i++){\n  alert (\"Count is: \" + i);\n}\n```\n\nThe output will\
    \ be the numbers one through ten. When a code is stated, the variable is going\
    \ to extend from where it was declared. Should the variable be declared in a `for`\
    \ statement, it cannot be used outside of the loop. Variables such as `j`, `k`,\
    \ and `I` are used when it comes to loop controls. Once the variable is declared,\
    \ the life span of that variable is going to be cut down so that there are less\
    \ of a chance for errors to occur. In a `for` loop there are going to be three\
    \ expressions that will be used. The `for` statement can contain a different variation\
    \ that is used during the iteration process.\n\n### Code\n```javascript\nvar numbers\
    \ = [11, 12, 13, 14, 15, 16, 17, 18, 19];\n\nfor (var i=0; i<numbers.length; i++)\
    \ {\n  alert (\" Count is : \" + numbers[i])\n}\n```\n\nThis variation makes the\
    \ statement smaller. The use of this variation is going to write out the statements\
    \ in the general that a `for` statement is normally written out.\n\n### break\
    \ statement\nThere are two `break` statements that are used in JavaScript, the\
