    Chapter 4:


    JavaScript Tips & Tricks


    to Keep and Remember


    In this chapter, we will look into some short and useful tips related to improving
    your JavaScript skills and enhancing your code writing.


    | USING === Instead of == | The == (or !=) operator performs an automatic type
    conversion if needed. The === (or !==) operator will not perform any conversion.What
    it will do is compare the value and the type, which could be considered faster
    ([jsPref](http://jsperf.com/strictcompare)) than ==.[10] ==  10 // is true[10]
    === 10      // is false''10'' ==  10 // is true''10'' === 10      // is false[] 
    ==  0 // is true[]  === 0       // is false''''  ==  false   // is true but true
    == "a" is false''''  === false // is false |


    | charAt() Shorthand | To do this, you can utilize the eval() function however
    this bracket notation shorthand technique is much simpler than an evaluation  Longhand:"myString".charAt(0);Shorthand:"myString"[0];
    // Returns ''m'' |


    | Strings convert to Numbers | The fastest and easiest ([jsPerf](https://jsperf.com/number-vs-parseint-vs-plus/29))
    way to do this would be using the + (plus) operator.  var  one  =  ''1'';var  numberOne  =  +one;  //
    Number 1


     You can also use the - (minus) operator which type-converts the value into number
    but also negates it.


    var  one  =  ''1'';var  negativeNumberOne  =  -one;  // Number -1 |


    | Truthy/falsy values converted to boolean |  You can convert a Truthy or Falsy
    value to true boolean with ‘!!’ 


    !!""  // false!!0  // false!!null  // false!!undefined  // false!!NaN  // false!!"hello"  //
    true!!1  // true!!{}  // true!![]  // true |


    | Using JSON.Stringify | Let’s say there is an object with properties “prop1”,
    “prop2”, “prop3”. Additional params can be passed to JSON.stringify to selectively
    write properties of the object to string like:  var  obj  =  { ''prop1'':  ''value1'',
    ''prop2'':  ''value2'', ''prop3'':  ''value3''};var  selectedProperties  =  [''prop1'',  ''prop2''];var  str  =  JSON.stringify(obj,  selectedProperties);//
    str// {"prop1":"value1","prop2":"value2"}


     The “str” will contain only info on selected properties only. Instead of array
    we can pass a function also.function  selectedProperties(key,  val)  { // the
    first val will be the entire object, key is empty string if  (!key)  { return  val;
    } if  (key  ===  ''prop1''  &#124;&#124;  key  ===  ''prop2'')  { return  val;
    } return;}The last optional paramit takes is to modify the way it writes theobject
    to string.var  str  =  JSON.stringify(obj,  selectedProperties,  ''\t\t'');/*
    str output with double tabs in every line.{        "prop1": "value1",        "prop2":
    "value2"}*/ |


    | Single Method for Arrays and Writing Single Element |  Instead of writing separate
    methods to hold an array and a single element parameter, you can write functions
    so that they can handle both.You just have to concat everything into an array
    first. Array.concat will accept an array or a single element.


     function  printUpperCase(words)  {   var  elements  =  [].concat(words  &#124;&#124;  []);
    for  (var  i  =  0;  i  <  elements.length;  i++)  { console.log(elements[i].toUpperCase());
    }}


     Print UpperCase is now ready to accept a single node or an array of nodes as
    its parameter. It also avoids the potentialTypeError that would be thrown if no
    parameter was passed.


    printUpperCase("cactus");// => CACTUSprintUpperCase(["cactus",  "bear",  "potato"]);//
    => CACTUS//  BEAR//  POTATO |


    | Measure performance for a JavaScript Block | For quickly measuring performance
    of a JavaScript block, we can use the  console functions like [console.time(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimelabel) and[console.timeEnd(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimeendlabel)console.time("Array
    initialize");var  arr  =  new  Array(100),    len  =  arr.length, i;for  (i  =  0;  i  <  len;  i++)  {
    arr[i]  =  new  Object();};console.timeEnd("Array initialize");  // Outputs: Array
    initialize: 0.711ms |


    | Hoisting | Hoisting will help you manage your function scope.  Variable declarations
    and functions are hoisted to the top where as variable definitions are not.  function  doTheThing()  {
    // ReferenceError: notDeclared is not defined console.log(notDeclared); // Outputs:
    undefined console.log(definedLater); var  definedLater; definedLater  =  ''I am
    defined!'' // Outputs: ''I am defined!'' console.log(definedLater) // Outputs:
    undefined console.log(definedSimulateneously); var  definedSimulateneously  =  ''I
    am defined!'' // Outputs: ''I am defined!'' console.log(definedSimulateneously)
    // Outputs: ''I did it!'' doSomethingElse(); function  doSomethingElse(){ console.log(''I
    did it!''); } // TypeError: undefined is not a function functionVar(); var  functionVar  =  function(){
    console.log(''I did it!''); } |


    Chapter 5:


    JavaScript Skills to Know Moving Forward


    Whether you like it or not, as a programmer or web or app developer, you need
    to learn JavaScript. It is considered the computer language of the future simply
    because it is an integral part of web ad app development.


    As common as it is, JavaScript is pretty complicated especially when trends keep
    changing and with that, comes the ensuing chaos. Despite all that, things are
    improving in the JavaScript landscape, and with technology evolving, old problems
    with JavaScript are fixed, no doubt with new ones coming in.


    If you are a new developer in 2016, your willingness and ability to learn JavaScript
    will definitely contribute to the success of your career and your skills as a
    programmer/coder/hacker or developer.


    So what are the trends of JavaScript development should programmers work on going
    forward?


    In this chapter, we will look at the various things that will go big in the programming
    language world.


    React & Redux


    In 2015, React gained traction especially when more and more programmers started
    complaining about the AngularJS framework as 2014 came to an end. The fact that
    news broke out that Angular 2 will be unsuitable to run with Angular 1 made it
    even worse for the Angular community. React came in and closed this gap in 2016.


    ![github star growth](images/00010.jpeg)


    Estimates based on screenshots from the internet archive. Perhaps a more telling
    pointer would be the npm download count for react, angular, and Angular2 packages:


    [![angularjs vs react](images/00011.jpeg)](http://www.npmtrends.com/react-vs-angular)


    For the past year, React has been getting more traction from the JavaScript community
    than AngularJS has. So if you look at the graph above, you are probably wondering
    what happened after August? It shows that npm downloads for React have surged
    significantly and it also shows exactly when GitHub stars for React being to catch
    up with AngularJS’s stars.


    The change is due to Redux, created by Dan Abramov during the ReactEurope2015
    conference. Redux had a simple flux implementation that convinced many programmers
    that it was time to adopt the one and only React.


    Before the materialization of Redux, React was turbulent as people were trying
    to figure out how to best execute the ‘Flux’ architecture. Since then, many other
    implementations begin surfacing, and while they aren’t bad, they weren’t exactly
    solving any issues that made most JavaScript developers wary.


    In spite of the universal rendering and the gold stars for React and its virtual
    DOM, programmers were still cautious about using it in their projects. Despite
    this, more and more people started using Redux and realized it makes testing and
    debugging apps running on JavaScript a lot easier. From then on, Redux rose from
    the Flux are the real winner.'
