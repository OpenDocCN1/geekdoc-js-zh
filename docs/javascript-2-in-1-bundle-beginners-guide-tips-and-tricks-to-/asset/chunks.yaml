    you are going to have only one element that is returned. But, querySelectorAll
    is going to return the NodeList. So, if multiple elements match your search criteria,
    then you are going to need to use the querySelector so that you are only getting
    the first one returned instead of all of them.


    Chapter 12:


    Callbacks and Events with JavaScript


    The code that is located inside of a browser is going to be event driven and when
    you are writing applications that are interactive, you are going to have to wait
    for as well as react to the events that are going to ultimately alter the behavior
    from the browser. An event is going to occur when the page has been loaded, or
    the user has interacted with something on the page. There are also other times
    that are going to be triggered, but these have to be done manually.


    When you need to react to an event, you are going to have to listen for it so
    that you can supply a function. The function is going to be called by the browser
    whenever the event has occured and it is known as a callback.


    Code:


    var handleClick = function(event) {


    // choose a different action !


    };


    var button = document.querySelector(''#big-button'');


    button.addEventListener(''click'',handleClick);


    addEventListener is a method that is going to be found on all of the DOM elements.
    When it is called upon, the element is going to be saved in the variable of button.
    The argument that is listed first in the string is going to be the name of the
    event that you should be listening for. The event in this code is the tapping
    of a mouse or someone’s finger. The call back is going to be the handleClick.


    If you are using Internet Explorer, addEventListener is not going to be supported
    if you are running a version that is earlier than version 9\. In that case, you
    should use attachEvent instead.


    Code:


    button.attachEvent(''onclick'', handleClick);


    If you look, you will notice that the onclick is required over a click. This is
    going to happen for a majority of the events that you come across. It is objects
    such as this that have created the libraries such as jQuery to aid you so that
    even if the way of listening is different between two browsers, it is not going
    to matter thanks to the event that was passed as a callback.


    Data for any particular event that has been passed is a callback. When you look
    at the handleClick that was declared above, you are going to realize that the
    argument or the event is going to be where the object’s properties are described.


    Code:


    {


    offsetX: 74,


    offsetY: 10,


    pageX: 154,


    pageY: 698,


    target: h2,


    timestamp: 215897564812,


    type: “click”,


    x: 154,


    y: 395


    }


    Chapter 13:


    AJAX with JavaScript


    Before moving to this section, it is very important to notice that a lot of browsers
    automatically blocks AJAX, if it is invoked directly from a user''s machine. In
    order for AJAX to work properly, you will either need a webhost or localhost installed.


    Whenever the web first came around, things were simpler than they are now. The
    page now has text and styles while possibly having links that are going to take
    you to a different web page. To put new content on a page, you have to move it
    from one page to another. The developers of web pages have been more ambitious
    trying to get web pages to be interactive. But, it is obvious that new content
    needs a new way to be loaded onto the page without fully reloading the page each
    time.


    In retrieving new content, there is software that will help known as XHR or XML
    HTTP Request that is applied. Applications for the internet use AJAX applications.
    The letters of AJAX mean Asynchronous JavaScript and XML.


    Most web pages are going to be able to pull the new content without having to
    reload the page with this technique. Microsoft is actually the one who decided
    that XML Http Request should be used when they were creating Outlook.


    XML HTTP Request


    You know what XML HTTP Request is, but how is it displayed?


    Code:


    var req = new XMLHttpRequest () ;


    req.onload = function ( event)  { … };


    req.open(''get'' , ''some-file.txt'' , true);


    req.send();


    When creating a XMLHttpRequest, you are going to need a new keyword that is going
    to call upon XMLHttpRequest similar to how a function is called upon. The call
    back will happen at the point in time that the information has been made available
    and then it will skip the input from that event into the fist argument.


    The data is going to be extracted by using req . open. The disput will be the
    HTTP technique. Next is going to be the URL fetch that will be identical to the
    aspect of a link by href.


    The next one will be a Boolean that is going to specify if the request of asynchronous
    can be found as true. therefore, the XMLHttpRequest will be fired off and then
    the code that is executed will continue to be executed until there is an answer
    from the system that cause the callback to be executed.


    The parameters for an asynchronous is going to be defaulted to false which is
    going to cause the execution of the code to be paused until the appropriate data
    has been requested which is called synchronous.'
