    ## 第 1 章：JavaScript……它是什么？它将如何使受益？


    `JavaScript` 是一种客户端脚本语言。这意味着该语言或代码被发送到用户的计算机并在那里执行。这与 `ASP.NET` 或 `PHP` 等服务器端技术形成对比，后者是在结果传递给用户计算机之前在
    Web 服务器上运行代码。


    通过 `JavaScript`，你将与不同的网页进行交互，以便创建 Web 应用程序。Netscape Communications 在 1995 年首次实现了
    `JavaScript`。


    在构建网页时，你通常会在三种主流语言中遇到 `JavaScript`，另外两种是 `HTML` 和 `CSS`。因此，虽然 `HTML` 处理页面的内容和结构，`CSS`
    处理页面的呈现（如指定背景颜色），但 `JavaScript` 是页面交互和行为的编程语言。


    例如，当你在“联系我们”页面的表单字段中输入错误的值会发生什么？让网页具有交互性并执行 `HTML` 和 `CSS` 无法实现的功能，让你发现了 `JavaScript`
    对网站的用性。


    但我必须指出，`JavaScript` 并不是作为一种通用的全能语言而设计的；它有局限性。例如，它无法访问计算机的文件系统，也无法与数据库通信。尽管如此，它在实现网页交互方面表现非常好。


    `JavaScript` 很容易与 `Java` 混淆，因为它们的名字非常相似；但它们并不是一回事。不过的是，它们可以在客户端共同交互，例如你的网络浏览器，因为它们可以直接嵌入
    Web 源码中。


