  trans: "\njQuery 拥有一种链式语法，在您设置任何类型的方法时都非常有效。jQuery 将返回与选择器函数相同的元素。美元符号 `$` 是一个函数，用于返回一个封装在元素之上的\
    \ jQuery 对象。`.css()` 方法可以将背景颜色更改为红色，而 `.height()` 则设置你所选元素的高度。还有一个可以用于宽度的方法。\n\
    \n### 获取器与设置器 (Getters and Setters)\n\n如所示，`.css()` 和 `.height()` 用于为元素设置值，但这些方法也被获取器（getters）。当你调用\
    \ `.height()` 且没有提供任何要设置的值时，元素的当前高度将通过带有简单 CSS 属性的 `.css()` 方法来获取该属性的值。\n\n####\
    \ 代码：\n```javascript\nvar currentHeight = $('.note').height(),\ncurrentColor =\
    \ $('.note').css('color');\n```\n\n当选中了多个元素时，获取器将获取其中第一个元素的值。\n\n### 上下文 (Context)\n\
    \n在某些情况下，需要限制选择元素的 DOM 范围。被使用的 DOM 区域被称为不同的上下文（context）。\n\n你需要通过第二个参数告诉 jQuery\
    \ 你想要选择的区域，该参数可以是一个 DOM 元素、字符串选择器，甚至是 jQuery 对象。jQuery 只会在你选择器所在的上下文中搜索，而不涉及其他内容。\n\
    \n#### 代码：\n```javascript\nvar $header = $('header'),\n$headerBoxes = $('.note',\
    \ $header);\n```\n\n### 第 18 章：jQuery 和 AJAX\n\n在 jQuery 方面，有一些 AJAX 辅助方法可以帮助你节省时间并让你的代码看起来更轻松。它们是\
    \ `$` 变量的方法：`$.get`、`$.post` 和 `$.ajax`。\n\n`$.ajax` 策略是构建 AJAX 请求的主要技术和方法。其他方法将作为配置的快捷方式，例如获取数据或提交数据。\n\
    \n#### 代码：\n```javascript\n$.ajax({\n  url: '/data.json',\n  method: 'GET',\n\
    \  success: function (data) {\n    console.log(data);\n  }\n});\n```\n\n当 jQuery\
    \ 需要检索时，将使用对象配置。它会提供基础信息，如 URL。该方法默认使用 get 方法，每当数据检索完成后都会调用该函数，其命名为 `success`\
    \ 回调。\n\n#### $.get\n\n该方法的代码将获取一系列信息，由于这是函数的基础，jQuery 将提供一个辅助方法。\n\n#### 代码：\n\
    ```javascript\n$.get('/data.json', function (data) {\n  console.log(data);\n});\n\
    ```\n\n还会提供一个错误回调（callback error），让你知道是否出现错误，从而导致找不到服务器的情况。\n\n#### 代码：\n```javascript\n\
    $.get('/data.json', function (data) {\n  console.log(data);\n}).fail(function\
    \ () {\n  // 噢，那不对\n});\n```\n\n#### $.post\n\n当你将输入重定向到系统时，将使用 `$.post` 方法。第二个参数将导致数据发送到函数以外的任何地方。jQuery\
    \ 会找到一种发送数据的方法。\n\n#### 代码：\n```javascript\n$.post('/save', { username: 'burt'\
    \ }, function (data) {\n  console.log(data);\n}).fail(function () {\n  // 错误操作\n\
    });\n```\n\n#### $.ajax\n\n为了对信息的流向拥有更大的控制权限，你会使用 `$.ajax` 方法。\n\n#### 代码：\n```javascript\n\
    $.ajax({\n  url: '/save',\n  method: 'POST',\n  data: { username: 'burt' },\n\
    \  success: function (data) {\n    console.log(data);\n  },\n  error: function\
    \ () {\n    // 错误操作\n  }\n});\n```\n\n### 第 19 章：jQuery 和其他技巧\n\njQuery 将帮助你完成其他常见任务，特别是当一系列浏览器之间存在不一致时。\n\
    \n#### DOM 内容加载完成 (DOM Content Loaded)\n\n在某些情况下，JavaScript 在 DOM 加载后运行，以便代码尝试将对象移动到网站的不同部分，或设计新网站。这完全是\
    \ JavaScript 的。但它并不是在每个浏览器中都能工作。\n\n#### 代码：\n```javascript\nvar doSomething =\
    \ function(event) {...};\nwindow.addEventListener('DOMContentLoaded', doSomething);\n\
    ```\n\n然而，使用 jQuery 这样做会更容易，并且它可以跨越多个浏览器。\n\n#### 代码：\n```javascript\n$(doSomething);\n\
    ```\n\n#### 加载 (Load)\n\n在特定情况下，你需要在页面完全加载后再尝试对其进行任何操作。当你使用 jQuery 时，你将监听加载到窗口的事件。\n\
    \n#### 代码：\n```javascript\nwindow.addEventListener('load', doSomething);\n```\n\
    \n使用 jQuery，这会更简单。\n\n#### 代码：\n```javascript\n$(window).load(doSomething);\n\
    ```\n\n#### 类型检查 (Type Checking)\n\n要找出存储在变量中的数据，JavaScript 会很笨拙，但 jQuery 能够展示你如何做。\n\
    \n#### 代码：\n```javascript\n$.isArray([1, 2, 3]); // True\n$.isFunction(function()\
    \ { }); // True\n$.isNumeric(10); // True\n```\n``` // True\n\n### 第 20 章：JavaScript\
    \ 控制语句\n\n在前面的章节中我们讨论了 `if`、`else` 和循环，但本节将详细解释它们。\n\n#### if-then\n\n`if` then\
    \ 语句在条件为真时执行。\n\n#### 代码：\n```javascript\nfunction applyBrakes() {\n  if (isMoving)\
    \ {\n    // \"if\" 子句\n    acceleration--;\n}\n```\n\n当省略大括号时，你的代码会变得脆弱。如果在代码中放置另一个表达式，就会增加一个要求，意味着你必须使用大括号。JavaScript\
    \ 编译器不会捕捉这个错误；它只会给你不正确的结果。\n\n#### if-then-else\n\n`if then else` 子句会在语句失败时为代码创建一个辅助路径。\n\
    \n#### 代码：\n```javascript\nfunction applyBrakes() {\n  if (isMoving) {\n    currentSpeed--;\n\
    \  } else {\n    alert(\"车辆未移动！\");\n  }\n}\n```\n\n#### switch\n\n`switch` 语句为代码执行提供了不同的路径。`switch`\
    \ 语句适用于 `int`、`short`、`char` 和 `byte` 数据以及枚举数据类型。\n\n#### 代码：\n```javascript\n\
    var month = 8;\nvar monthString;\nswitch(month) {\n  case 1: monthString = \"\
    January\"; break;\n  case 2: monthString = \"February\"; break;\n  case 3: monthString\
    \ = \"March\"; break;\n  case 4: monthString = \"April\"; break;\n  case 5: monthString\
    \ = \"May\"; break;\n  case 6: monthString = \"June\"; break;\n  case 7: monthString\
    \ = \"July\"; break;\n  case 8: monthString = \"August\"; break;\n  case 9: monthString\
    \ = \"September\"; break;\n  case 10: monthString = \"October\"; break;\n  case\
    \ 11: monthString = \"November\"; break;\n  case 12: monthString = \"December\"\
    ; break;\n  default: monthString = \"无效月份\"; break;\n}\nalert(monthString);\n\
    ```\n"
