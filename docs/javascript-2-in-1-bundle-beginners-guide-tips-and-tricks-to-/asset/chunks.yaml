    # Chapter 3: Tips and Tricks to Design and Build Your Own JavaScript Library


    JavaScript Library you say?


    No, it doesn’t contain books. It does, however, include packaged codes that web
    designers, developers, and programmers can use in their projects that will save
    time and effort. In other words, you do not need to reinvent the wheel when you
    want to apply the same package of codes to deliver the same kind of effect on
    different websites and programs.


    ### What makes a JavaScript Library?


    Here are a few distinct features of a JavaScript Library:


    - It has one file or several files in a single folder

    - Its coding must be maintained separately and remain as-is when you use it to
    implement a project

    - It should allow the user to set project-specific behavior or configuration


    In this chapter, we will talk about why you should build a JavaScript library
    and how they are built- in the simplest ways possible.


    ### Why build your own JavaScript Library?


    Firstly, it makes things convenient for programmers and web developers alike,
    especially if you code and develop plenty of programs, websites, and web applications.
    Having a library with existing codes makes your job easier and saves you time
    since you do not need to keep digging up old projects from some obscure folder
    in your hard drive. All you just need to is pull it out of your library.


    Essentially, any code that makes your work easier and which can be reused is a
    great component to be added to the library. One such good example is `jQuery`.
    `jQuery`’s API is a more simplified DOM API. Back when cross-browser DOM manipulation
    was difficult, `jQuery` was essential.


    And if an open-source venture becomes increasingly popular, more developers use
    it, and it will eventually encourage more developers to join in and assist with
    this venture by contributing to the code and submitting issues that will help
    make it easier to manipulate. This contribution will benefit the library and all
    other experiments that depend on it.


    Popular open-source projects can also lead to fantastic opportunities for developers
    alike. A tech firm or any organization may be impressed by the quality of a developer’s
    work, and they will be offered a job. It could also mean that a company will provide
    a developer to collaborate on a project or get them to integrate their project
    into an application of their own.

