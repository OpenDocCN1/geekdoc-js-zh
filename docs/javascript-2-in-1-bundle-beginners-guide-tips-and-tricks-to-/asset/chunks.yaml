    它是所有主流浏览器中最通用的计算机语言，从简陋的 Internet Explorer 到先进的 Google Chrome 和 Safari 都是如此。大多数计算机的系统中已经安装了
    `JavaScript`，因此可以确保世界各地的访问者都能看到你在互联网上的内容、软件和计算机程序。


    每个人和任何人都可以使用 `JavaScript`，而无需购买许可。


    此外，如果你好奇的话，`JavaScript` 和 `Java` 是两种完全不同的计算机语言，用于各种编程需求。


    `JavaScript` 的用处在于，有许多预先写好的 `JavaScript` 代码你可以直接复制并将其插入到你的网页中以实现类似的效果，而不需要自己重新编写所有代码。你只需要弄清楚代码的作用，然后知道将这些代码复制并粘贴到哪些特定位置，以获得所需的效果，就像烘焙蛋糕一样。


    如果你打开了这本书，我们不会深入探讨 `JavaScript` 的细节，也不会教你编码、编程的基础知识或步骤，或是将这些代码粘贴到你的网页中。


    然而，这本书将做的是为你提供大量的技巧和窍门，帮助你成为一名更优秀的程序员，并更高效地使用 `JavaScript`。


    # JavaScript 简史


    回到 20 世纪 90 年代，当世界网仍处于发展阶段时，所有的网页都是静态的，用户与网站之间没有交互方式。你看到的完全就是设置好的。


    当时最流行的两个浏览器是 Internet Explorer 和 Netscape Navigator。虽然 Internet Explorer 著名得多，但
    Netscape 是第一个引入让网页能够与用户交互的编程语言的。这种语言被称为 `LiveScript`，并被集成到 Netscape 浏览器中。得益于这种语言，任何使用
    Netscape 的人都可以与页面交互。`LiveScript` 不需要插件。


    另外，还有另一种编程语言需要单独的插件才能运行，它被称为 `Java`。此时，`Java` 变得非常广为人知，Netscape 决定通过将 `LiveScript`
    重命名为 `JavaScript` 来从中获利。


    正如前面提到的，`Java` 和 `JavaScript` 之间存在巨大差异，尽管它们的代码看起来相似。


    然后，Internet Explorer 出于创新的需求进行了更新，并受到了两种集成语言的支持：一种基于 `BASIC` 编程的 `vbscript`，另一个是类似于
    `JavaScript` 的 `Jscript`。


    当 Internet Explorer 成为最常用的浏览器时，`JavaScript` 也成为了新兴浏览器中最接受、使用最广泛的编程语言。


    回到 1996 年，脚本语言变得如此重要，以至于将其交给竞争对手的浏览器开发商是有风险的。在同一年，`JavaScript` 被交给了 ECMA，该机构是负责编程语言开发的国际标准组织。这种语言被正式重命名为
    `ECMAScript`，但程序员和所有其他人仍然称它为 `JavaScript`。


    它的名字听起来也酷得多。


    # JavaScript 的重要性


    理解如何使用 `JavaScript`，就是理解开发网页的其它编程语言的基本作用。


    简单来说：


    1. `HTML` 是用于标记内容的语言。`HTML` 定义了内容是什么，而不是它在网页上什么样子。

    2. `CSS` 用于定义网页的外观。这包括指定哪种媒体对应哪条命令。


    仅仅通过这两种语言，你就可以创建一个静态网页，无论你在什么设备上查看该网页，或使用何种浏览器进行访问，都可以轻松访问。


    然而，这类网页最大的缺点是，访问者与你的静态站点交互的唯一方法就是填写表单并等待新页面加载。


    这就是 `JavaScript` 用用场的地方。


    `JavaScript` 将静态页面转换为交互式页面，这样网站访问者在每次发出请求时都不需要等待新页面加载。`JavaScript` 让你的网页具有行为——让它们能够实时响应各种操作。


    通过 `JavaScript`，你可以：


    - 在用户输入信息时验证表单中的每个字段，而不是等填完整个表单并在提交表单后才被告知用户拼写错误。

    - 让你的页面能够比涉及表单更多的更多方式进行交互。

    - 为页面添加动画，吸引对特定部分的注意，或让网站更易用。

    - 在网页上加载新的、更重的图像和脚本。

    - 让你能够改进访问者的体验。


    # 第 1 章：帮助你的简单技巧


    ## 更快地学习 JavaScript


    通常，当任何人在学习 `JavaScript` 或任何编码技能的道路上时，他们经常会遇到这些问题：


    - 概念混淆

    - 学习的时间和动力

    - 容易忘记代码

    - 工具领域不断变化


    在本章中，我们将学习通过一些心理技巧来克服这些挑战，这些技巧可以帮助你更快地熟悉 `JavaScript` 领域，让你成为一名更高效的程序员。


    ### 技巧 1：为你想要学习的内容创建一个一个路线图


    面对现实吧——有许多框架可以使用，新手总是处于应该从哪一个开始的十字路口。与其研究应该从哪种框架开始，克服这一点的最佳方法之一是创建一个你需要知道的学习路线图。


    例如，如果你想成为一名前端开发人员，你的路线图可能像这样：


    ![](img/00001.jpeg)


    `HTML` 和 `CSS` 是你在继续学习其他内容之前需要知道的最基础编码知识。然后你可以继续学习 `JavaScript` 和 `jQuery`。一旦你创建了路线图，它将让你更容易专注于本质的事情，而不是浪费时间和精力。


    ### 技巧 2：慢慢来


    '
- fmt: '

    Finding time to practice coding can be difficult. However, the same people who
    code are also heavy social media users, often spending time on YouTube and Facebook,
    Reddit or even Wikipedia. Whether or not you are like this, there are valuable
    lessons to be learned from using social media.


    The fact that we all spend so much time on Facebook even if all we just wanted
    to do was just to look at one notification says a lot. We get sucked into Facebook
    because one thing leads to another and because you constantly have people updating
    their status and walls and your news feed always have something new to see.


    Using this same psychology, you can use this to your advantage in learning code.
    Instead of committing several hours of learning codes, you can just tell yourself
    that you will commit to 15 whole minutes without any disturbance.


    Then look at Facebook, take a little break.


    Then come back again and do another 15 minutes.


    But, this technique can only work if stay focused to your goal, and not allow
    Facebook or anything other suck you into, and make you totally forget what you
    were doing.


    ### TIP 5: GIVE YOURSELF TIME


    There’s a saying that goes if you take your time to think slowly, you’ll learn
    a lot faster. Coding needs time. You need time to understand it. Otherwise, you’ll
    only get more confused. Take your time to figure out what it is that you are trying
    to learn. Explain it to someone if you have to. Take your time to go through each
    step, and each line of code before you figure it all in one go.


    ### TIP 6: WRITE IN PLAIN LANGUAGE


    Coding can be incredibly complex. If what you are reading becomes too complicated
    or unfamiliar, then try writing it out in simple terms- or in any way that you
    can understand it first. That way, you can figure out what it is that you want
    to code before actually writing it.


    This will enable you to code much easily the next time around, and you’ll also
    be faster at writing your codes because you wouldn’t need to stop and think with
    each line of code. You’ll also be able to spot bugs even before you code them
    in.


    ### BOTTOM LINE


    Many of these tips can make you learn JavaScript easily and at a faster rate.
    The truth is, you would be able to apply these tips to learn any sort of lesson
    you need to.


    # Chapter 2: JavaScript Cheat Sheet – Must Haves for Every Programmer


    By now you know how important learning JavaScript is if you are serious about
    becoming a programmer. JavaScript is no doubt the most practical programming language
    in our digital world. It is used in app development, web apps, web pages and programming
    in general.


    In this chapter, we introduce to you some of the must-have cheat sheets you can
    get your hands on to make yourself better at coding and writing the programming
    language. These cheat sheets are handy to have as they help you master the basics
    while you are learning.


