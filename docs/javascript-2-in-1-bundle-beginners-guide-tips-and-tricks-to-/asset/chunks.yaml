- fmt: "\nNow you have created your two variables. The reason that `var` was only\
    \ used once is because you did an initialization and gave the variables a value.\
    \ When you write the keyword once and separate them with a comma, you save yourself\
    \ extra work.\n\nWith the help of JavaScript, you are going to be able to figure\
    \ out how many pieces of fruit you have.\n\nCode:\n```javascript\nvar piecesOfFruit\
    \ = apples + oranges;\n```\n\nThe code is going to tell the browser that is needs\
    \ to figure out the sum from the number on the right before it reassigns that\
    \ result to how many `piecesOfFruit` there are. But, the names from the variables\
    \ are not going to be added together, only the values are going to be added. Your\
    \ browser is going to know what you are doing and will only give you the sum of\
    \ the values.\n\nYour sum is not going to be pieces of fruit but instead it will\
    \ be `piecesOfFruit` since your variables cannot contain any spaces. It is easy\
    \ to notice that the `O` and `F` in `Of` and `Fruit` are capitalized. This is\
    \ known as camel casing and it helps to make the variable easier to read.\n\n\
    Keep in mind that there are various ways for code to be read. That is why it is\
    \ so important for you to be sure that your code is easy to read and understand.\n\
    \n### Splitting\n\nThere is more than just addition when you are doing math. For\
    \ code, there is division.\n\nCode:\n```javascript\nvar piecesForEachPerson =\
    \ piecesOfFruit / 3 ;\n```\n\nJavaScript is able to do this math without you having\
    \ to get out a calculator to make sure that the math is done properly.\n\nDivision\
    \ is done with a forward slash to ensure that you are dividing the left side from\
    \ the right side.\n\n### Operators\n\nTo get the sum of a set of numbers, you\
    \ are going to use symbols for every operation.\n\n- Multiplication (`*`)\n- Addition\
    \ (`+`)\n- Division (`/`)\n- Subtraction (`-`)\n\nEach symbol is called an operator\
    \ since they are going to operate some sort of mathematical data. Just like any\
    \ math problem, there are going to be a particular order of how things are going\
    \ to be done, it is called the operator precedence.\n\nSeeing a set of parentheses\
    \ means that they need to be done first before you do the multiplication, division,\
    \ addition, or subtraction process. An easy way to remember this order of operations\
    \ is `PEMDAS` (Parentheses, Exponents, Multiplication and Division, and Addition\
    \ and Subtraction).\n\nCode:\n```javascript\n(10+2) / 2 + 4 * 2\n12 / 2 + 4 *\
    \ 2\n6 + 4 * 2\n6 + 8\n```\n\n# Chapter 5: JavaScript Logic\n\nWhen you are programming,\
    \ it is important to have the ability to compare different values so that decisions\
    \ can be made when it comes to the code and how it is going to be carried out.\
    \ The comparison will either make your outcome false or true. Then, there is a\
    \ special data type that is known as a Boolean data type.\n\nUsing JavaScript\
    \ to do math will bring out a set of operators that are going to work with Booleans.\
    \ These comparisons are going to be made when you are working on a console. Whichever\
    \ result you get from every line is going to be shown as true or false.\n\n###\
    \ Equality\n\nTo determine if two different values are equal you will use three\
    \ equals signs. (`===`)\n\nCode:\n```javascript\n15.234 === 15.234\nTrue\n```\n\
    \nTo check if two variables are not equal, you will need to use two equals signs\
    \ and also use exclamation sign before them. (`!==`)\n\n```javascript\n15.234\
    \ !== 18.4545\nTrue\n```\n\nStrings that contains numbers, are equal to that number\
    \ in value, but not in type, so the `===` comparison is going to return false:\n\
    \n```javascript\n“10” === 10\nFalse\n```\n\nHowever, if you compare these two\
    \ using two equals marks (`==`) it is going to return true, because two equals\
    \ marks only compares the value of variables, not the type! So this will return\
    \ true:\n\n```javascript\n\"10\" == 10\nTrue\n```\n\n### Greater than/ less than\n\
    \nTwo numbers can be compared as one being larger or smaller than the other. When\
    \ a number is greater than the other you are going to use a greater than symbol\
    \ of `>`.\n\nCode:\n```javascript\n10 > 5\nTrue\n```\n\nThe less than symbol will\
    \ be the opposite of the greater than symbol (`<`).\n\nCode:\n```javascript\n\
    20.4 < 20.2\nFalse\n```\n\n### Combined comparison\n\nNumbers can be compared\
    \ when they are of equality and the size is going to be able to be compared with\
    \ a greater than or equal to (`>=`) or the less than or equal to (`<=`) operators.\n\
    \nCode:\n```javascript\n10 >= 10\nTrue\n10 <= 5\nFalse\n```\n\n# Chapter 6: JavaScript\
    \ Conditions\n\nUsing JavaScript logic will make the decision for the code based\
    \ on what sort of comparison has been made. Before the comparison can be made,\
    \ there has to be a condition set. There are several conditions that are used\
    \ in JavaScript, but the most common one is the `If` statement.\n\n### If statement\n\
    \nWhen the condition is found to be true, the code is going to be run the way\
    \ that it is supposed to. Thanks to the `if` statement, you are going to be able\
    \ to add in extra code that has to be run should the condition turn out to not\
    \ be true. When the condition is returned as false, then there will have to be\
    \ extra conditions and blocks of code that are going to be run optionally. This\
    \ option is going to be the `if-else` statement.\n\nCode:\n```javascript\nif(10\
    \ > 5) {\n  // Run the code here\n}\n```\n\nAny code that has been placed between\
    \ the curly brackets is going to be considered a block and will be connected to\
    \ the `If` statement. However, it is only going to be run if the condition that\
    \ falls between the parentheses turns out to be true.\n\n### If-else\n\nThe `if-else`\
    \ statement is a different form of the `if` statement that will use a block if\
    \ the condition comes back as false. The code that falls between the parentheses\
    \ is ignored in favor of the `else block`.\n\nCode:\n```javascript\nif (43 < 2)\
    \ {\n// Run the code here\n} else {\n//A different code is run\n}\n```\n\n# Chapter\
    \ 7: Looping with JavaScript\n\nJust like a circle, a loop is going to continue\
    \ to repeat the same code multiple times. Loops are usually used when an code\
    \ needs to be carried out for an array.\n\nTwo loops that you are going to use\
    \ most often are `while` loops and `for` loops. The conditions are going to be\
    \ combined together and then the block of code is going to be run until the condition\
    \ is no longer true.\n\n### While loops\n\n`While` loops will repeat the code\
    \ while the condition turns out to be true. `While` loops are very similar to\
    \ `if` statements and the condition that is placed inside the parentheses is true.\n\
    \nCode:\n```javascript\nvar i = l;\nwhile ( i < 10 ) {\n  alert(i);\n  i = i +\
    \ 1 ;\n}\n// i is now going to be 10\n```\n\nOnce the loop has been completed,\
    \ the code continues running after the closing bracket. This code will produce\
    \ popup alert boxes displaying numbers from 1 to 9, and when it completes the\
    \ loop value for `i` will be equal to 10.\n\n### For loops\n\n`For` loops are\
    \ also similar to `if` statements, the main difference being that there will be\
    \ three semicolons used to separate bits of information that is placed between\
    \ a set of parentheses. A for loop is going to to initialize the condition to\
    \ get a final expression.\n\nWhile initializing, you will be creating the variable\
    \ so that you can track how far into the loop you are going to go just like you\
    \ did with the `while` statement. Your condition is going to be where the loop’s\
    \ logic will go. The final expression is going to be run at the end of every loop\
    \ that has been created.\n\nCode:\n```javascript\nfor(var i = 1 ; i < 10 ; i++\
    \ ) {\n  alert(i) ;\n}\n```\n\nIn the code, an alert box is going to pop up that\
    \ is going to give the numbers 1 to 10 in their proper order. The `i++` will be\
    \ the same as `i = i + 1`. `(i++)` is called \"incrementing\" the value of `i`.\
    \ As you can see, both `for` and `while` loops work the same in this case. You\
    \ probably wonder when to use `for` and when to use `while` loop. This is a short\
    \ explanation.\n"
