  trans: "\n\n[使用 Jasmine, Travis 和 Karma 进行 JavaScript 测试](http://www.sitepoint.com/testing-javascript-jasmine-travis-karma/)\
    \ 由 Tim Evko 编写，向你展示了如何与名为 `Jasmine` 的另一个框架一致地设置测试流水线。\n\n下面是 Tim Severien 提供的另一个你可以尝试的大纲。他为他的库使用了\
    \ `Jasmine` 测试，它看起来像这样。\n\n代码：\n\n```javascript\ndescribe('Basic usage', function\
    \ () {\n\n  it('should generate a single product', function () {\n    // Create\
    \ a single product\n    var product = new UserAgent.Product('EvilCorpBrowser',\
    \ '1.2');\n    product.setComment('X11', 'Linux', 'en-us');\n    expect(product.toString())\n\
    \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; en-us)');\n  });\n\n  it('should\
    \ combine several products', function () {\n    var userAgent = new UserAgent;\n\
    \    // Create and add first product\n    var application = new UserAgent.Product('EvilCorpBrowser',\
    \ '1.2');\n    application.setComment('X11', 'Linux', 'en-us');\n    userAgent.addProduct(application);\n\
    \    // Create and add second product\n    var engine = new UserAgent.Product('Blink',\
    \ '20420101');\n    userAgent.addProduct(engine);\n    expect(userAgent.toString())\n\
    \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101');\n  });\n\
    \n  it('should update products correctly', function () {\n    var userAgent =\
    \ new UserAgent;\n    // Create and add first product\n    var application = new\
    \ UserAgent.Product('EvilCorpBrowser', '1.2');\n    application.setComment('X11',\
    \ 'Linux', 'en-us');\n    userAgent.addProduct(application);\n    // Update first\
    \ product\n    application.setComment('X11', 'Linux', 'nl-nl');\n    expect(userAgent.toString())\n\
    \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; nl-nl)');\n  });\n});\n```\n\n\
    一旦你完成了测试并且对你第一个库版本的 API 设计完全满意，你就可以开始考虑网站的架构以及你的库具体将如何被使用。\n\n### 模块加载器兼容性\n\n\
    并不是很多开发者使用模块加载器，这完全取决于你。然而，你需要意识到，某些使用你库的开发者可能会选择模块加载器，因此你需要让你的库兼容此功能。\n\n你可以选择一些流行的模块加载器，如\
    \ `AMD`、`RequireJS` 和 `CommonJS`。如果你在这些功能之间做出选择很困难，你也可以尝试`通用模块定义` (`UMD`），它旨在支持多种类型的模块加载器。\n\
    \n为了让你的库兼容 `UMD`，你也可以找到一些变体，例如 `UMD` GitHub 仓库。通过使用这些模板之一开始创建你的库。另一个技巧是，如果你选择使用\
    \ `ES2015` 的 `import/export` 语法，可以使用 `Babel` 编译为 `ES5` 并结合 `Babel` 的 `UMD` 插件。这样，你可以在项目中使用\
    \ `ES2015`，同时生成一个可以被使用各种模块的开发者使用的库。\n\n### 文档\n\n你需要从基础信息开始编写文档，例如你的项目名称以及关于其内容的简短描述。这将帮助他人理解你的库是做什么的，以及使用你的库对他们来说是否是一个不错的选择。你还可以包含更多关于范围和目标等方面的信息，以便用户获得更充分的信息。你还可以包含路线图，让用户知道他们对你的库开发未来可以期待什么，以及他们如何也能对此做出贡献。\n\
    \n### API、教程和示例\n\nAPI 文档也是文档不可或缺的一部分，因为它会告诉用户具体如何使用你的库。其他很好的补充内容是示例以及教程。这可能花费一些时间，因此你可以在库开发过程中进行这些工作。\n\
    \n### 元任务 (Meta-tasks)\n\n用户还会想要对你的库进行更改，这通常是以贡献的形式存在的，但某些人可能只想为私有用途创建一个自定义构建。对于这些用户，你可以包含关于元任务的文档，其中包含构建库、运行测试、生成和转换或下载数据的命令列表。\n\
    \n### 贡献\n\n贡献是非常棒的，特别是当你开源你的库时。你可以添加的另一个文档是，引导贡献者解释向库提交贡献的步骤，以及在提交贡献之前他们应该填写哪些标准。这将使你的评审工作变得更容易。\n\
    \n### 许可证 (License)\n\n许可证也是重要的。包含许可证可以让大家知道哪些内容受版权保护。将你选择的许可证保存为根目录下的 `LICENSE`\
    \ 文件。\n\n### 为 Git 添加版本\n\n版本控制对于一个良好的库是必要的。目前的版本标准是 [SemVer](https://semver.org/)，它包含主版本、次要版本和补丁版本。要创建一个标签，打开终端并执行：\n\
    \n```bash\ngit tag -a [version] -m [message]\n```\n\n示例：\n\n```bash\ngit tag -a\
    \ v1.0.0 -m \"First release\"\n```\n\n### 发布到仓库\n\n大多数编程语言都带有包管理器，或者至少有第三方包管理器。例如，PHP\
    \ 的管理器是 [Composer](https://www.sitepoint.com/mastering-composer-tips/)，Ruby on\
    \ Rails 是 [Gems](https://rubygems.org/)。默认情况下，你的 npm 包将公开。但你也可以选择发布：\n\n- [私有包](https://www.npmjs.com/npm/private-packages)\n\
    - [设置私有注册表](https://docs.npmjs.com/misc/registry#can-i-run-my-private-registry)\n\
    - [完全避免将包发布到官方注册表](https://docs.npmjs.com/misc/registry#i-dont-want-my-package-published-in-official-registry)\n\
    \n然而，如果你决定发布你的包，你需要 `package.json` 文件。你可以手动执行，也可以使用交互式向导。开始向导请输入：\n\n```bash\n\
    npm init\n```\n\n`version` 属性应与你的 git 标签匹配。包含 `README.md` 文件。就像 GitHub 一样，npm\
    \ 使用它作为展示包的页面。\n\n完成后，通过输入以下发布你的包：\n\n```bash\nnpm publish\n```\n\n就这样！你成功发布了\
    \ npm 包。\n\n### Bower\n\n另一个名为 `Bower` 的实用包管理器几年前出现了。这是一个为 Web 设计的包管理器。在这里，你可以找到所有的前端断。唯一的是，如果你的库设置为为了兼容浏览器，那么使用\
    \ `Bower` 发布你的包将让你获益。npm 包主要用于 JavaScript，许多前端包仍使用 npm，但 `Bower` 仍然非常流行，所以也去使用\
    \ `Bower` 发布吧。\n\n要生成 `bower.json` 文件，输入：\n\n```bash\nbower init\n```\n\n和 `npm\
    \ init` 一样，指令是显而易懂的。最后，发布你的包：\n\n```bash\nbower register [package-name] [repo-url]\n\
    ```\n\n现在你的库可以供大家在他们的 Node 项目或 Web 上使用了！\n\n### 总结\n\n记住，你的代码开发就是库。确保你的库解决了问题、方便易用，最重要的是稳定。这将确保你和许多其他使用它的开发者都感到满意。\n\
    \n"
- fmt: "\nThe tasks explained above are easily automated such as running tests and\
    \ creating tags, updating your versions and publishing your packages.\n\n# Chapter\
    \ 4: JavaScript Tips & Tricks\n\n## To Keep and Remember\n\nIn this chapter, we\
    \ will look into some short and useful tips related to improving your JavaScript\
    \ skills and enhancing your code writing.\n\n| USING === Instead of == | The `==`\
    \ (or `!=`) operator performs an automatic type conversion if needed. The `===`\
    \ (or `!==`) operator will not perform any conversion.What it will do is compare\
    \ the value and the type, which could be considered faster ([jsPref](http://jsperf.com/strictcompare))\
    \ than `==`.[10] <```\n[10] == 10 // is true\n[10] === 10     // is false\n'10'\
    \ == 10 // is true\n'10' === 10     // is false\n[] == 0 // is true\n[] === 0\
    \      // is false\n'' == false   // is true but true == \"a\" is false\n'' ===\
    \ false // is false\n``` |\n| charAt() Shorthand | To do this, you can utilize\
    \ the `eval()` function however this bracket notation shorthand technique is much\
    \ simpler than an evaluation  Longhand:<```\n\"myString\".charAt(0);\nShorthand:\"\
    myString\"[0]; // Returns 'm'\n``` | |\n| Strings convert to Numbers | The fastest\
    \ and easiest ([jsPerf](https://jsperf.com/number-vs-parseint-vs-plus/29)) way\
    \ to do this would be using the `+` (plus) operator.  <```\nvar one = '1';\nvar\
    \ numberOne = +one;  // Number 1\n```\nYou can also use the `-` (minus) operator\
    \ which type-converts the value into number but also negates it.\n```\nvar one\
    \ = '1';\nvar negativeNumberOne = -one;  // Number -1\n``` | |\n| Truthy/falsy\
    \ values converted to boolean | You can convert a Truthy or Falsy value to true\
    \ boolean with `!!`\n<```\n!!\"\"  // false\n!!0  // false\n!!null  // false\n\
    !!undefined  // false\n!!NaN  // false\n!!\"hello\"  // true\n!!1  // true\n!!{}\
    \  // true\n!![]  // true\n``` | |\n| Using JSON.Stringify | Let’s say there is\
    \ an object with properties “prop1”, “prop2”, “prop3”. Additional params can be\
    \ passed to `JSON.stringify` to selectively write properties of the object to\
    \ string like:  <```\nvar obj = { 'prop1': 'value1', 'prop2': 'value2', 'prop3':\
    \ 'value3'};\nvar selectedProperties = ['prop1', 'prop2'];\nvar str = JSON.stringify(obj,\
    \ selectedProperties);\n// str {\"prop1\":\"value1\",\"prop2\":\"value2\"}\n```\n\
    The `str` will contain only info on selected properties only. Instead of array\
    \ we can pass a function also.\n<```\nfunction selectedProperties(key, val) {\
    \ // the first val will be the entire object, key is empty string if\n  (!key)\
    \ { return val; } if  (key === 'prop1' || key === 'prop2') { return val; } return;}\n\
    ```\nThe last optional paramit takes is to modify the way it writes theobject\
    \ to string.\n<```\nvar str = JSON.stringify(obj, selectedProperties, '\\t\\t');\n\
    /* str output with double tabs in every line.{\n      \"prop1\": \"value1\",\n\
    \      \"prop2\": \"value2\"}*/\n``` | |\n| Single Method for Arrays and Writing\
    \ Single Element | Instead of writing separate methods to hold an array and a\
    \ single element parameter, you can write functions so that they can handle both.You\
    \ just have to concat everything into an array first. `Array.concat` will accept\
    \ an array or a single element.\n<```\nfunction printUpperCase(words) {\n  var\
    \ elements = [].concat(words || []); for (var i = 0; i < elements.length; i++)\
    \ { console.log(elements[i].toUpperCase()); }}\n```\nPrint UpperCase is now ready\
    \ to accept a single node or an array of nodes as its parameter. It also avoids\
    \ the potential `TypeError` that would be thrown if no parameter was passed.\n\
    <```\nprintUpperCase(\"cactus\");// => CACTUS\nprintUpperCase([\"cactus\", \"\
    bear\", \"potato\"]);// => CACTUS\n// BEAR\n// POTATO\n``` | |\n| Measure performance\
    \ for a JavaScript Block | For quickly measuring performance of a JavaScript block,\
    \ we can use the `console` functions like `[console.time(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimabel)`\
    \ and `[console.timeEnd(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimeendlabel)\n\
    <```\nconsole.time(\"Array initialize\");\nvar arr = new Array(100), len = arr.length,\
    \ i;\nfor (i = 0; i < len; i++) { arr[i] = new Object();};\nconsole.timeEnd(\"\
    Array initialize\");  // Outputs: Array initialize: 0.711ms\n``` | |\n| Hoisting\
    \ | Hoisting will help you manage your function scope. Variable declarations and\
    \ functions are hoisted to the top where as variable definitions are not. <```\n\
    function doTheThing() { // ReferenceError: notDeclared is not defined\nconsole.log(notDeclared);\
    \ // Outputs: undefined\nconsole.log(definedLater); var definedLater; definedLater\
    \ = 'I am defined!' // Outputs: 'I am defined!'\nconsole.log(definedLater) //\
    \ Outputs: undefined\nconsole.log(definedSimulateneously); var definedSimulateneously\
    \ = 'I am defined!' // Outputs: 'I am defined!'\nconsole.log(definedSimulateneously)\
    \ // Outputs: 'I did it!'\ndoSomethingElse();\nfunction doSomethingElse(){ console.log('I\
    \ did it!'); } // TypeError: undefined is not a function\nfunctionVar(); var functionVar\
    \ = function(){ console.log('I did it!'); }\n``` | |\n\n# Chapter 5: JavaScript\
    \ Skills to Know Forward\n\nWhether you like it or not, as a programmer or app\
    \ developer, you need to learn JavaScript. It is considered the computer language\
