    Chapter 20:


    JavaScript Control Flow Statements


    In earlier chapters we have discussed if, else and loops, but this section is
    going to explain these in more detail.


    Source files are going to have narratives that will be executed in the exact order
    that they have been written out. A control flow statement will deal with the way
    that the operators will flow based on the looping, decision making, branching,
    and how programs are enabled to operate due to specific chunks of code that have
    conditions attached to them.


    If-then


    An if then statement is going to be the simplest control statement that you are
    going to use. This statement will execute your code only if the expression in
    the brackets is true.


    Driver’s Ed class will only enable the breaks to slow down the car’s acceleration
    only if the car is already moving. 


    Code:


    function applyBrakes() {


    // the "if" clause: car is already in motion


    if(isMoving) {


    // the "then" clause: lower car’s acceleration


    acceleration -- ;


    } }


    If the condition is false then the control statement is going to move on to the
    next statement that is in the block of code. The curly brackets are going to be
    strictly optional; however, this is only going to be the case if the statement
    that is between them is a single statement.


    Code:


    function applyBrakes() {


    // same as above code, only the curly brackets are not going to be here.


    if(isMoving) CurrentSpeed -- ;


    }


    Whenever curly brackets have been omitted, you are making your code breakable.
    If another expression is placed in the code, then a requirement will be added
    which is going to mean that you have to use curly brackets, but sometimes they
    are forgotten by the coder. The JavaScript complier is not going to catch this
    mistake; it is only going to give you improper results.


    If- then- else


    If then else clauses are going to create a secondary path for the code to follow
    if the clause ends up failing.


    Code:


    function applyBrakes() {


    if(isMoving) {


    currentSpeed -- ;


    } else {


    alert("The car is not moving!");


    }


    }


    Switches


    A switch statement offers different paths for code to be executed. The switch
    statements will work with int, short, char, and byte data along with enumerated
    data types.


    Code:


    var month = 8;


    var monthString ;


    switch(month) {


    case 1: monthString = "January";


    break;


    case 2: monthString = "February";


    break;


    case 3: monthString = "March";


    break;


