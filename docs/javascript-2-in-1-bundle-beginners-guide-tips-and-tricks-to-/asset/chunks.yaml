- fmt: '

    React, and Redux definitely is the hottest trend for 2016, and it doesn’t look
    like it’ll fade away come 2017, regarding front-end ‘framework’ JavaScript. Netflix,
    Yahoo!, and Dropbox have all adopted React into their tech arsenal, giving it
    a confidence boost. Even so, Facebook’s Relay looks like a prospective contender
    in 2017.


    ## Other Frameworks of Interest


    Other frameworks may come into the foray and while they aren’t comparable but
    here’s a general overview of what other frameworks are out there. Again, things
    may change with anything regarding technology. What may not work so well this
    year might end up becoming top of the league the next year.


    Without further ado, here are some other frameworks to look into.


    ### Angular2


    Plenty of non-tech companies will be looking into using `Angular 2` especially
    businesses that use Microsoft''s `.NET` framework. `Angular 2`, developed through
    a partnership between Google and Microsoft was designed to make JavaScript a more
    manageable language.


    Microsoft themselves were pushing for the `.NET` aggressively last year as it
    open-sourced quite some elements and strove to make Microsoft tools more accessible
    to developers. After the rewrite, the teams hope to fix any sort of escalating
    issues with the `Angular 1` apps, and performance so far has been stellar. `Angular2`
    has been developed to support web components, and according to Google, it is the
    future for web development. The `AngularJS` community though has differing opinions
    about the direction that `Angular` is taking- all this despite the efforts the
    `Angular` team has been investing in helping developers transition properly from
    `Angular 1` to `Angular 2`.


    This rewrite has also allowed `React` to develop and mature as with its community
    growing larger each day. Because of this, programmers are skeptical that `Angular
    2` will be as successful as `Angular 1`. However, as mentioned above, things can
    change in the tech world so it could be `Angular 2` will have room to grow in
    2017. `Angular2` is still preferred as an alternative to the `React` app.


    ### Meteor


    Another upcoming trend to look out for is `Meteor`, which has been enjoying steady
    downloads and GitHub stars. It integrates well with `React` and `Angular` and
    has plenty of nifty features. As a lightweight, full-stack JavaScript framework,
    developers are finding the `Meteor` framework a pleasure to work with. `Meteor`,
    always known as a solid beginner framework is great for prototyping as well.


    The thing that has prevented `Meteor` from becoming a mainstream success is due
    to the hidden complexities that keep cropping up over time particularly when production
    is concerned. `Meteor`, despite having raised loads of money, isn’t backed by
    a leading tech enterprise with a broad pool of engineers, like what `React` &
    `AngularJS` are. Notwithstanding the fact that `AngularJS` has plenty of issues
    and yet is backed up by Google, `Meteor`, on the other hand, is considered an
    investment risk as it’s a framework for both the backend and frontend development.
    To get the most out of the deployment ease, `Meteor` would also need to be hosted.


    Another thing that isn’t working for `Meteor` at the moment is that many developers
    aren’t big fans of the `MongoDB` and well, `Mongo` is `Meteor`’s default database.
    `Meteor` will remain a nice though for 2017 since more developers will likely
    wait for more reliable evidence that `Meteor` can be used for large and more complex
    application development. Needless to say, `Meteor` will likely remain niche going
    forward in 2016 or even 2017. Most professional developers will wait for any evidence
    that it can be used for developing large, complex applications.


    ### ES6 At Last


    One of the things that JavaScript developers do in 2016 moving forward 2017 is
    to ensure that all their apps are `ES2015` compliant. But like many other complications
    with tech apps and programming language, we have the `Babel` vs. `TypeScript`
    issue.


    `Babel` mostly translates the `ES6` code to `ES5` whereas `TypeScript` is really
    a superset of JavaScript that adds necessary but optional static typing to JavaScript
    and then compiles all of this to plain JavaScript as well. `Babel` and `TypeScript`
    have been created with totally different purposes and therefore not comparable.


    `Babel`, developed by Facebook, supports `Flow` which also adds in the static
    type-checking for JavaScript. Using `Babel` makes a little bit more sense since
    you can use both consecutively. `Babel` was also the first to helped bridge the
    difference between `ES5` and `ES6` applications.


    `TypeScript` on the other hand only supports `ES6`, thus playing second fiddle
    to `Babel` when it comes to progressiveness. Checking in with the GitHub stars,
    it looks like `Babel` is the most preferred transpiler. `React` developers also
    prefer to use the `Babel` + `Webpack` combo.


    ![https://s3.amazonaws.com/codementor_content/2016-May/babel_vs_typescript.png](images/00012.jpeg)


    Despite the stars, `TypeScript` seems to be a lot more viable and sometimes and
    even preferred choice especially if you are looking for a solution to make your
    JavaScript codebase much more manageable. JavaScript has always been known to
    be a difficult to read language making it even more difficult to debug, due to
    its weak type-checking system. So in terms of support, `TypeScript` has enjoyed
    a larger following than `Flow`.


    ![https://s3.amazonaws.com/codementor_content/2016-May/so_staticjs.png](images/00013.jpeg)


    The graph below shows the Google Trends Graph showing the growth of interest for
    `TypeScript`.


    ![https://s3.amazonaws.com/codementor_content/2016-May/es6.png](images/00014.jpeg)


    Another reason that `TypeScript` could be getting popular is because of `Angular2`,
    but just because JavaScript apps get larger focus, that isn’t the contributing
    reason of why `TypeScript` becomes popular.


    While `Redux` has made testing much easier, `TypeScript` makes codebase a lot
    easier to maintain. Apart from this, Google, Facebook, and Microsoft are collaborating
    to add on static typing to JavaScript and thus paving the way to `EMCAScript`.


    At the same time, Google dropped `AtScript` and `AngularJS` in favor for TypeScript.
    `Flow` by Facebook, on the other hand, doesn’t have the same community popularity
    as `TypeScript`.


    This goes to show that statically typed JavaScript is an active and growing trend
    that even JavaScript non-believers will approve of where is `TypeScript` the most
    solid solution.


    ## Functional Programming is Becoming Mainstream


    Plenty of functional programming platforms have been making their way into mainstream
    programming but very recently, the ‘functional programming model’ has gained plenty
    of attention especially with the rise of complex web apps.


    ![https://s3.amazonaws.com/codementor_content/2016-May/hn-fp.png](images/00015.jpeg)


    `Scala` is coming back as a favored language among backend developers who want
    to embrace functional programming. However, Facebook’s `React`, on the other hand,
    has encouraged front-end JavaScript developers to take on UI development using
    a practical approach.


    More and more positive feedback is coming in for functional programming, and it
    looks like it will become mainstream in 2017. At this point of time, front-end
    web development is taking the forefront in reactive and functional programming.


    So the `React+Redux` agenda is really the most sought after beginner-friendly
    solution for those that are comfortable with programming that is object-oriented.
    In other words, `React` only needs developers to take a functional approach to
    UI whereas `Redux` is mostly a system that encourages a practical approach to
    handling data. All other things are done in the OOP-style.


    RxJS

