    ### Book 1

    [JavaScript: Beginner’s Guide to Programming Code with JavaScript](#part0000_split_000.html_B1)

    Here you will learn the basic essentials of learning `JavaScript` – the necessary
    topics you require in gaining beginner level knowledge.


    ### Book 2

    [JavaScript: Tips and Tricks to Programming Code with JavaScript](#part0000_split_023.html_B2)

    Here you will progress and learn intermediate level useful tips and tricks in
    learning about the `JavaScript` programming language – to help you progress in
    your path towards `JavaScript` mastery.


    Thanks again for owning this book! Let us begin with the first book in the `JavaScript`
    bundle:


    ## Chapter 1: JavaScript… What is it and How will it Benefit Me?


    `JavaScript` is a client-side, scripting language. What this means is that the
    language or code is sent to a user’s computer and it executes the code there.
    This is in contrast with server-side technologies such as `ASP.NET` or `PHP` where
    the code is being run on the web server before the results are delivered to the
    user’s computer.


    With `JavaScript` you are going to be interacting with different web pages so
    that you are able to create a web application. Netscape Communications first implemented
    `JavaScript` in 1995.


    In building web pages, you usually come across `JavaScript` as part of the three
    main languages being used, with the other two being `HTML` and `CSS`. So while
    `HTML` does the content and structure of web pages and `CSS` works on the presentation
    of the page like specifying its background color, it is `JavaScript` that functions
    as the programming language for the interactivity and behavior on the page.


    For example, what happens when you type the wrong value in a form field on a Contact
    Us form page? The ability to make a web page interactive and perform added functionality
    that `HTML` and `CSS` cannot do makes you discover the usefulness of `JavaScript`
    for a website.


    Let me point out though that `JavaScript` wasn’t created to be used as a general,
    do-it-all language; it has limits. For instance, it cannot have access to your
    computer’s file system nor communicate with a database. But while this is the
    case, what it does in terms of making web pages interactive, it does really well.


    `JavaScript` is easily confused with `Java` because the two of them have very
    similar names; however, they are not the same thing. The good thing though is
    that it can interact together on the client side like your web browser for instance,
    because they can be embedded directly into the web source.

