  trans: "\n\n`while` 循环通常用于你不知道循环会执行多少次的情况。例如，用户正在玩游戏，他需要猜一个隐藏的数字。你永远不知道用户有多幸运，所以你不知道他什么时候会选中正确的数字。这就是为什么你设置一个\
    \ `while` 循环并等待正确的数字出现。\n\n代码：\n\n```javascript\nvar number = 0;\n\n// 7 是隐藏的数字！\n\
    \nprompt(\"Try to guess the number!\");\n\nwhile (number !== 7)\n\n{\n\nnumber\
    \ = parseInt(prompt(\"Wrong number, try again!\"));\n}\n\nalert(\"Congratulations,\
    \ you guessed it correctly!\");\n```\n\n当用户输入 `7` 时，它将显示恭喜消息；但如果用户输入其他数字，它将继续显示错误消息，直到用户输入数字\
    \ `7` 为止。\n\n另一方面，在使用 `for` 循环时，我们是在确切知道需要执行循环多少次数时使用它们；它们主要用于处理数组，我们将在稍后的章节中学习数组。\n\
    \n# 第 8 章：JavaScript 中使用的函数\n\n函数将重用代码块以便执行特定的任务。为了执行你调用的函数内部的代码，函数将允许传递任何所使用的参数，以便将值返回给最初调用它的地方。\n\
    \n函数可以保存你变量的值。函数将使用该变量和括号来调用函数。\n\n代码：\n\n```javascript\ndoSomething() ;\n\nfindAnInterestingThing()\
    \ ;\n```\n\n创建一个函数意味着你将使用 `function` 关键字。在使用该关键字之后，参数将列在一组括号内，以便代码块拥有函数的代码。\n\n\
    代码：\n\n```javascript\nvar add = function(a, b) {\n\nreturn a + b ;\n\n} ;\n```\n\
    \n`a` 和 `b` 将是函数的参数，而值将由关键字返回。\n\n用于 `return` 的关键字将停止放在函数中的代码执行；因此，它之后将不再有代码运行。\n\
    \n代码：\n\n```javascript\nvar result = add( 1, 2); // 结果将是 3。\n```\n\n调用会将参数一和参数二相加，这些参数已保存到\
    \ `a` 和 `b` 变量中。\n\n# 第 9 章：JavaScript 中的对象\n\n当 JavaScript 中 中一个对象时，它将非常像现实中的对象，包含一组属性和能力。\n\
    \n对象将拥有一组命名的属性，以及决定其如何运行的方法。\n\n对象将保存到变量中，而其他内容可以通过使用点符号法（dot notation）短语来获取。\n\
    \n作为一个类比，如果你看一个人，他们会有名字、年龄，并且能够移动、学习和说话。如果将这个人类放入 JavaScript 中，他们的名字和年龄将被视为属性，这些无非数据片段。移动、说话和学习的能力将是人类的函数，因为它们是复杂的行为。拥有这些能力的对象被称为方法。\n\
    \n变量可以持有对象，它们通过封装在括号内的特殊语法来创建对象。\n\n代码：\n\n```javascript\nvar jedi = {\n\nName:\
    \ “Luke”,\n\nAge: 899,\n\nTalk: function() {\n\n    alert(“another... Sky... walk\
    \ …”);\n}\n\n};\n```\n\n绝地武（Jedi）的名字和年龄将是对象内部的属性或变量。对象可以存储变量可以存储的任何数据。绝地可以进行的对话是存储函数的属性，也称为方法。数据可以通过使用点符号法的短语从对象中返回。\n\
    \n代码：\n\n```javascript\njedi.Name;\n\nLuke\n\njedi.Age ;\n\n899\n\njedi.Talk()\
    \ ;\n\n// 将产生一个警告框。\n```\n\n属性也可以重新赋值给对象。\n\n代码：\n\n```javascript\njedi.Name =\
    \ “Mace Windu”;\n```\n\n或者你也可以添加之前没有添加的新变量对象。\n\n```javascript\njedi.lightsaber\
    \ = “purple” ;\n```\n\n属性不需要是任何特定的数据；它们可以是任何内容，也可以是对象和数组。当一个对象列为另一个对象的属性时，你就成功地创建了一个嵌套对象。\n\
    \n代码：\n\n```javascript\nvar person = {\n\nage: 122\n\n};\n\nperson.name = {\n\n\
    First: “Jeanne” ,\n\nLast: “Calment”\n};\n```\n\n现在如果你想知道这个人的名字是什么，你将使用这个。\n\n\
    代码：\n\n```javascript\nalert(person.name.First);\n```\n\n要创建一个为空的项，你需要添加属性和方法。\n\
    \n代码：\n\n```javascript\nvar dog = {};\n\ndog.bark = function() {\n\nalert(“Woof!”\
    \ );\n};\n```\n\n# 第 10 章：JavaScript 数组\n\n数组是任何类型数据的列表，它不限于包含其他数组。数组中列出的每个项目都将有一个索引，该索引将用于从数组中检索元素。\n\
    \n索引始终从零开始，所有排序的元素都会加一。\n\n在 JavaScript 中创建数组意味着你使用数组字面量语法。\n\n代码：\n\n```javascript\n\
    var emptyArray = [];\n\nvar shoppingList = ['Soda', 'Buns'];\n```\n\n你可以使用方括号法获取特定的元素。\n\
    \n代码：\n\n```javascript\nshoppingList[0];\n\nSoda\n```\n\n你也可以通过方括号法为索引设置值。\n\n\
    代码：\n\n```javascript\nshoppingList[1] = 'Chips';\n\n// 你的 shoppingList 现在是 ['Soda',\
    \ 'Chips']\n```\n\n数组中存在的数量将使用 `length` 属性告知你有多少元素。\n\n代码：\n\n```javascript\n\
    shoppingList.length;\n\n3\n```\n\n可以使用 `push` 和 `pop` 方法从数组末尾添加或删除元素。\n\n代码：\n\
    \n```javascript\nshoppingList.push('A car');\n\n// shoppingList ['Soda', 'Buns',\
    \ 'Chips', 'A car']\n\nshoppingList.pop();\n\n// shoppingList 现在是 ['Soda', 'Buns',\
    \ 'Chips']\n```\n\n下面的代码将创建一个 push、pop，然后遍历数组，以便将其传递给标记为 `helloFrom` 的函数。然后 `helloFrom`\
    \ 将返回用于问候字符串：“Hello from”以及用户的名字。在完成 push 和 pop 方法后，用户的名字列表将是“Burt”、“Luke”、“Ron”和“Tim”。\n\
    \n代码：\n\n```javascript\nvar helloFrom = function(personName) {\n\nreturn “Hello\
    \ from” + personName;\n\n}\n\nvar people = ['Burt', 'Luke', 'Ron'];\n\npeople.push('Tim');\n\
    \npeople.push('Dr Evil');\n\npeople.pop();\n\nfor(var I = 0 ; I < people.length;\
    \ I ++)\n\nvar greeting = helloFrom(people[I]);\n\nalert(greeting) ;\n}```\n\n\
    # 第 11 章：DOM\n\nDOM 代表文档对象模型，它将操控 HTML 页面的结构和样式。它将由浏览器看到的内部页面表示，以便开发者修改 JavaScript\
    \ 代码。\n\n为了查看页面的 DOM，你需要打开正在使用的浏览器的开发者工具并定位到“元素”（elements）面板。你可以通过在页面的任何地方点击右键并点击菜单列表中的“检查”来实现。\n\
    \n## 树与分支\n\nHTML 的结构与 XML 相似，元素将包含其创建的结构中的父节点以及子节点。这非常像树枝。HTML 将有一个单一根元素，包含分支，就像头部、身体以及连接在其上的肢体。因此，DOM\
    \ 也称为 DOM 树。"
- fmt: "\nWhen altering a DOM, you are going to pick an element and change whatever\
    \ you want about it. This process is normally done with JavaScript. In order to\
    \ access DOM from JavaScript, you are going to need the `document` for the object\
    \ that is being used. It will be provided by the browser so that the code is allowed\
    \ to interact with the code that is on the page’s content.\n\n## Getting Elements\n\
    \nWhen you are getting an element, you are going to have several ways that you\
    \ can do it depending on the browser that you are using.\n\n### ID\n\n`document.getElementByIdById`\
    \ will be the method that you use when you are trying to retrieve an item with\
    \ its `Id`.\n\nCode:\n```javascript\nvar pageHeader = document.getElementById('pageheader');\n\
    ```\n\nUsing this code, you can select element with ID of `pageheader` and store\
    \ it in the `pageHeader` variable. Later on, you can modify it, get its content,\
    \ or even hide and display it. Here is one example.\n\nCode:\n```javascript\n\
    alert(pageHeader.innerHTML);\n```\n\nThis will popup the contents of element with\
    \ ID `pageHeader`. For example, if `pageheader` looks like this:\n\nCode:\n```html\n\
    <p id=\"pageheader\">This is the page header</p>\n```\n\nIt will popup \"This\
    \ is the page header\" text.\n\nYou are going to notice that `getElementById`\
    \ is going to be the method that is used with an object of a `document`. Some\
    \ of the other methods are going to have access to the page that has been located\
    \ on the file for the element.\n\n### Tag name\n\n`document.getElementsByTagName`\
    \ is going to work the same way that the `getElementById` does but it is going\
    \ to need a tag name such as `a`, `li`, or `ul` instead of having an ID. It will\
    \ then be returned to the `NodeList` which is basically an list or array of elements\
    \ from DOM.\n\nIf you have for example only two `<p>` elements like this:\n\n\
    Code:\n```html\n<p>This is one paragraph</p>\n<p>This is another paragraph</p>\n\
    ```\n\nThen you can store these two elements in `paragraphs` variable using:\n\
    \nCode:\n```javascript\nvar paragraphs = document.getElementsByTagName(\"p\");\n\
    alert(paragraphs[0].innerHTML);\nalert(paragraphs[1].innerHTML);\n```\n\n`Alert`\
    \ functions will display the content of the first paragraph, and then the content\
    \ of the second paragraph.\n\n### Class name\n\n`Document.getElementsByClassName`\
    \ will return the same list that the tag name method does. The biggest difference\
    \ is that you are going to have to pass a class name that will match instead of\
    \ a tag name.\n\n### CSS\n\nWith modern browsers, there are a few new methods\
    \ available for you to use that makes selecting elements easier through the use\
    \ of a CSS selector. The syntax for CSS is: `document.querySelector` and `document.querySelectorAll`.\n\
    \nCode:\n```javascript\nvar pageHeader = document.querySelector(\"#example”);\n\
    var buttons = document.querySelectorAll(\".btn”);\n```\n\nThe `querySelector`\
    \ is going to be like when you search for an element by the ID, you are going\
    \ to have only one element that is returned. But, `querySelectorAll` is going\
    \ to return the `NodeList`. So, if multiple elements match your search criteria,\
    \ then you are going to need to use the `querySelector` so that you are only getting\
    \ the first one returned instead of all of them.\n\n## Chapter 12: Callbacks and\
    \ Events with JavaScript\n\nThe code that is located inside of a browser is going\
    \ to be event driven and when you are writing applications that are interactive,\
    \ you are going to have to wait for as well as react to the events that are going\
    \ to ultimately alter the behavior from the browser. An event is going to occur\
    \ when the page has been loaded, or the user has interacted with something on\
    \ the page. There are also other times that are going to be triggered, but these\
    \ have to be done manually.\n\nWhen you need to react to an event, you are going\
    \ to have to listen for it so that you can supply a function. The function is\
    \ going to be called by the browser whenever the event has occured and it is known\
    \ as a callback.\n\nCode:\n```javascript\nvar handleClick = function(event) {\n\
    \    // choose a different action !\n};\n\nvar button = document.querySelector('#big-button');\n\
    button.addEventListener('click',handleClick);\n```\n\n`addEventListener` is a\
    \ method that is going to be found on all of the DOM elements. When it is called\
    \ upon, the element is going to be saved in the variable of `button`. The argument\
    \ that is listed first in the string is going to be the name of the event that\
    \ you should be listening for. The event in this code is the tapping of a mouse\
    \ or someone’s finger. The callback is going to be the `handleClick`.\n\nIf you\
    \ are using Internet Explorer, `addEventListener` is not going to be supported\
    \ if you are running a version that is earlier than version 9. In that case, you\
    \ should use `attachEvent` instead.\n\nCode:\n```javascript\nbutton.attachEvent('onclick',\
    \ handleClick);\n```\n\nIf you look, you will notice that the `onclick` is required\
    \ over a `click`. This is going to happen for a majority of the events that you\
    \ come across. It is objects such as this that have created the libraries such\
    \ as `jQuery` to aid you so that even if the way of listening is different between\
    \ two browsers, it is not going to matter thanks to the event that was passed\
    \ as a callback.\n\nData for any particular event that has been passed is a callback.\
    \ When you look at the `handleClick` that was declared above, you are going to\
    \ realize that the argument or the `event` is going to be where the object’s properties\
    \ are described.\n\nCode:\n```javascript\n{\n  offsetX: 74,\n  offsetY: 10,\n\
    \  pageX: 154,\n  pageY: 698,\n  target: h2,\n  timestamp: 215897564812,\n  type:\
    \ “click”,\n  x: 154,\n  y: 395\n}\n```\n\n## Chapter 13: AJAX with JavaScript\n\
    \nBefore moving to this section, it is very important to notice that a lot of\
    \ browsers automatically blocks AJAX, if it is invoked directly from a user's\
    \ machine. In order for AJAX to work properly, you will either need a webhost\
    \ or localhost. Whenever the web first came around, things were simpler than they\
    \ are now. The page now has text and styles while possibly having links that are\
    \ going to take you to a different page. To put new content on a page, you have\
    \ to move it from one page to another. The developers of web pages have been more\
    \ ambitious trying to get web pages to be interactive. But, it is obvious that\
    \ new content needs a new way to be loaded without fully reloading the page each\
    \ time.\n\nIn retrieving new content, there is software that will help known as\
    \ `XHR` or `XML HTTP Request` that is applied. Applications for the internet use\
    \ AJAX applications. The letters of AJAX mean Asynchronous JavaScript and XML.\
    \ Most web pages are going to be able to pull the new content without having to\
    \ reload the page with this technique. Microsoft is actually the one who decided\
    \ that `XML Http Request` should be used when they were creating Outlook.\n\n\
    ### XML HTTP Request\n\nYou know what `XML HTTP Request` is, but how is it displayed?\n\
    \nCode:\n```javascript\nvar req = new XMLHttpRequest ();\nreq.onload = function\
    \ ( event) { … };\nreq.open('get' , 'some-file.txt' , true);\nreq.send();\n```\n\
    \nWhen creating a `XMLHttpRequest`, you are going to need a new keyword that is\
    \ going to call upon it similar to how a function is called upon. The callback\
    \ will happen at the point in time that the information has been made available\
    \ and then it will skip the input from that event into the fist argument.\n\n\
    The data is going to be extracted by using `req.open`. The disput will be the\
    \ HTTP technique. Next is going to be the URL fetch that will be identical to\
    \ the aspect of a link by `href`.\n\nThe next one will be a Boolean that is going\
    \ to specify if the request of asynchronous can be found as `true`. therefore,\
    \ the `XMLHttpRequest` will be fired off and then the code that is executed will\
    \ continue to be executed until there is an answer from the system that cause\
    \ the callback to be executed.\n\nThe parameters for an asynchronous is going\
    \ to be defaulted to `false` which is going to cause the execution of the code\
    \ to be paused until the appropriate data has been requested which is called synchronous.\n"
