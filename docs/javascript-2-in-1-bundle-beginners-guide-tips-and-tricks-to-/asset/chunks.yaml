    \ `==` 更快 ([jsPref](http://jsperf.com/strictcompare))。[10] <```\n[10] == 10 //\
    \ is true\n[10] === 10     // is false\n'10' == 10 // is true\n'10' === 10   \
    \  // is false\n[] == 0 // is true\n[] === 0      // is false\n'' == false   //\
    \ is true but true == \"a\" is false\n'' === false // is false\n``` |\n| charAt()\
    \ 简写 | 要实现这一点，你可以利用 `eval()` 函数，但这种括号符号简写技术比求值写法要简单得多。写法：<```\n\"myString\".charAt(0);\n\
    Shorthand:\"myString\"[0]; // Returns 'm'\n``` | |\n| 字符串转换为数字 | 执行此操作最快且简单 ([jsPerf](https://jsperf.com/number-vs-parseint-vs-plus/29))\
    \ 方法是使用 `+`（加号）运算符。 <```\nvar one = '1';\nvar numberOne = +one;  // Number 1\n\
    ```\n你也可以使用 `-`（减号）运算符，它会将值类型转换为数字，但也会进行取反。\n```\nvar one = '1';\nvar negativeNumberOne\
    \ = -one;  // Number -1\n``` | |\n| 真值/假值转换为布尔值 | 你可以使用 `!!` 将真值或假值转换为布尔值 `true`\n\
    <```\n!!\"\"  // false\n!!0  // false\n!!null  // false\n!!undefined  // false\n\
    !!NaN  // false\n!!\"hello\"  // true\n!!1  // true\n!!{}  // true\n!![]  // true\n\
    ``` | |\n| 使用 JSON.Stringify | 假设有一个带有属性“prop1”、“prop2”、“prop3”的对象。可以向 `JSON.stringify`\
    \ 传递额外的参数，以选择性地将对象的属性写入字符串，例如： <```\nvar obj = { 'prop1': 'value1', 'prop2': 'value2',\
    \ 'prop3': 'value3'};\nvar selectedProperties = ['prop1', 'prop2'];\nvar str =\
    \ JSON.stringify(obj, selectedProperties);\n// str {\"prop1\":\"value1\",\"prop2\"\
    :\"value2\"}\n```\n`str` 将仅包含所选属性的信息。除了数组，我们也可以传递一个函数。\n<```\nfunction selectedProperties(key,\
    \ val) { //第一个 val 将是整个对象，如果 key 为空字符串\n  (!key) { return val; } if  (key ===\
    \ 'prop1' || key === 'prop2') { return val; } return;}\n```\n最后一个可选参数用于修改将对象写入字符串的方式。\n\
    <```\nvar str = JSON.stringify(obj, selectedProperties, '\\t\\t');\n/* str 输出在每行都有双制表符。\n\
    \      \"prop1\": \"value1\",\n      \"prop2\": \"value2\"}*/\n``` | |\n| 数组和写入单个元素的单一方法\
    \ | 与编写单独的方法来存储数组和单个元素参数，你可以编写函数使它们能够同时处理两者。你只需要先将所有内容合并到一个数组中。`Array.concat`\
    \ 将接受数组或单个元素。\n<```\nfunction printUpperCase(words) {\n  var elements = [].concat(words\
    \ || []); for (var i = 0; i < elements.length; i++) { console.log(elements[i].toUpperCase());\
    \ }}\n```\n`printUpperCase` 现在准备好接受单个节点或节点数组作为参数。它还避免了未传递参数时可能抛出的 `TypeError`。\n\
    <```\nprintUpperCase(\"cactus\");// => CACTUS\nprintUpperCase([\"cactus\", \"\
    bear\", \"potato\"]);// => CACTUS\n// BEAR\n// POTATO\n``` | |\n| 测量 JavaScript\
    \ 代码块的性能 | 为了快速测量 JavaScript 代码块的性能，我们可以使用 `console` 函数，如 `[console.time(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimabel)`\
