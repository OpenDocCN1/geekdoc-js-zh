- fmt: '

    But for those who still want to go on track with the full-on functional reactive
    programming, which is considered the ‘true’ FRP and still want to use JavaScript,
    then `RxJS` is a necessary skill to learn. `RxJS` is an extension of JavaScript
    that is reactive that can be used to replace the `Flux` architecture. It may sound
    like overkill for simple and small apps but in truth, it builds a powerful foundation
    for web applications that will go through a complicated stream of processing.


    Netflix uses `RxJS` while `Angular2` also relies on `RxJS`. Developed by Microsoft,
    `RxJS` works incredibly well with `TypeScript` thus developers can expect that
    `RxJS` will continue to be improved.


    Learning `RxJS` though is an entirely different arena. It has a steep learning
    curve that make most developers give up on doing any FRP in JavaScript and pick
    up other functional programming languages that are compatible with JavaScript.


    ![https://s3.amazonaws.com/codementor_content/2016-May/frp_gtrend.png](images/00016.jpeg)


    Some of the compatible programming that developers choose to use instead of `RxJS`
    is `ClojureScript` and `Elm`. However all these program’s growth and popularity
    pales in comparison with `Redux+React`.


    ![https://s3.amazonaws.com/codementor_content/2016-May/frp_with_redux.png](images/00017.jpeg)


    The thing is, looking at how functional programming fits perfectly with addressing
    modern issues in web development, one has to agree that functional programming
    paradigm and its equivalent concepts will stick around as a necessary skill that
    JavaScript developers will need to harness and learn.


    ## Desktop Framework Showdown: Nw.js vs. Electron


    Plenty of data nowadays requires synchronizing data from various platforms such
    as a desktop and mobile. However, many services mostly start out as web apps before
    they are converted as desktop apps for enhanced user-experience. It is done this
    way because web app developments are a lot faster and more easily updated. Above
    all, users can also try out web apps more instantly without having to install
    anything else.


    Developers in the past were confined to using `CEF` if they wanted to use web
    technologies to create front-end UI for desktop apps. Not an easy process and
    the apps themselves weren’t truly cross-platform compatible. Though that, `Node.js`
    has made cross-platform apps easier for desktop frameworks. The shift of using
    web technologies for desktop app development began to rise starting 2014\.


    Thus, let’s take a look at the GitHub Star history for both projects:


    ![nwjs vs electron](images/00018.jpeg)


    Although `Nw.js` broke into the scene much earlier and is considered older, it
    looks like `Electron` is growing at an explosive rate, while `nw.js` is growing
    at a monotonous linear rate.


    ![nw.js vs electron](images/00019.jpeg)


    While `Electron` is pretty new, it is used by several established organizations
    like `Slack`, `Microsoft` (`Visual Studio Code`), `WordPress`, and `Sencha`. But
    with the ease of use that `Electron’s has, the network and community grew very
    fast. This wave of popularity is very likely to go on into 2017, thus enabling
    `Electron` to become the framework of choice for desktop and web app development.


    ## Mobile App Framework Showdown: React Native vs. Ionic


    When `Reactive Native` came out, it was predicted that it would take over and
    charts the course of mobile development with web technologies since it can be
    used to develop cross-platform apps natively. So is 2017 the year of `React Native`?
    There might be some expectations to that through this graph:


    ![react native vs ionic](images/00020.jpeg)


    At this moment, `React Native` has not yet released any updated software as it
    is still at version 0.26\. Whether or not it will become mainstream in 2017 depends
    largely on developer’s patience to deal with app- development changes that needs
    refactoring the whole codebase together with other issues.


    Therefore, let’s take a look at the approximate `npm` downloads of `React Native`
    vs `Ionic`:


    ![react native vs ionic](images/00021.jpeg)


    From the graph, it seems that `React Native` is on track to overtake `ionic` as
    the framework of choice for cross-platform mobile development using web technologies.


    In terms of the job market, `React Native` is also becoming more in-demand than
    `Ionic`:


    [![react native vs ionic](images/00022.jpeg)](http://www.indeed.com/jobtrends/q-react-native-q-ionic.html)


    A quick search on job postings, show that at least 75 job postings are looking
    for developers with `ionic` skills whereas 65 job postings are looking for developers
    with `React` skills. This shows that there is an increasing surge of the familiarity
    with `React Native` that will most likely be a huge push to any up and coming
    developers going forward 2017\.


    ## The Future of Web API: GraphQL vs REST


    Soon after `Facebook` mentioned that they were open-sourcing `GraphQL`, plenty
    of JavaScript developers jumped onto the hype train earlier on in 2016, especially
    since `Facebook` turned into the Apple of JavaScript when it came to open source
    projects.


    ![graphql](images/00023.jpeg)


    `GraphQL` was aiming to sort of replace `REST` APIs, but considering how ubiquitous
    `REST` APIs are, this is an unlikely scenario:


    ![rest vs graphql](images/00024.jpeg)


    `GraphQL` would do well with `REST` APIs, but it will definitely not replace `REST`
    as some developers thought it would have. Even more to do with this is that `GraphQL`
    is relatively new and linked with `Facebook Relay`, so there aren’t any learning
    resources or best practices for programmers and developers to pick the skill up
    elsewhere. With that said, 2017 is still too early for `GraphQL` to be going mainstream.


    ### JavaScript Trends Conclusion


    In conclusion, the community of JavaScript moves and changes at a fast pace, keeping
    up with any trends and in line with mainstream technology means more support,
    relevance, and resources. Based on the trends discussed in this chapter, JavaScript
    developers should equip themselves with `Redux & React` and also with other functional
    programming such as `TypeScript`. Not only that, having experience with `React
    Native` and `Electron` will definitely give upcoming programmers a lot more push
    and credibility in a job search.


    ### Conclusion


    Thank for making it through the end of JavaScript: Tips and Tricks to Programming
    Code with JavaScript. Let’s hope it was informative and able to provide you with
    all the tools you need to achieve your goals whatever it may be.


    The next step is to use the coding skills that you have learned and apply it to
    your own projects. Learning takes time, but you should be patient because just
    when you learn anything new, you are going to make mistakes.


    Go over the lessons in this book again and reread them. Learning how to write
    code is going to be confusing until you get the hang of it because of all the
    different conditions and exceptions that you are going to learn.


    Finally, if you found this book useful in anyway, a review on Amazon is always
    appreciated!


    ## About the Author


    Charlie Masterson is a computer programmer and instructor who have developed several
    applications and computer programs.


    As a computer science student, he got interested in programming early but got
    frustrated learning the highly complex subject matter.


    Charlie wanted a teaching method that he could easily learn from and develop his
    programming skills. He soon discovered a teaching series that made him learn faster
    and better.


    Applying the same approach, Charlie successfully learned different programming
    languages and is now teaching the subject matter through writing books.


    With the books that he writes on computer programming, he hopes to provide great
    value and help readers interested to learn computer-related topics.

