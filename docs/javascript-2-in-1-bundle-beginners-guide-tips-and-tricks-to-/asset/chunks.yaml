- fmt: "\nWhenever you are looking at where JavaScript is supported, you are going\
    \ to be surprised to find that it is supported almost everywhere. In browsers\
    \ such as `Firefox`, `Google Chrome`, and `Safari`, if you are unsure if your\
    \ browser is a vendor that has been licensed by JavaScript, you can go to your\
    \ settings and see if you can enable or disable JavaScript. If you can, then your\
    \ browser was licensed by JavaScript.\n\n## Benefits\n\nKnowing JavaScript is\
    \ going to benefit you in being able to either advance you in your career or find\
    \ a different career. If you want to go into I.T. or even web design, JavaScript\
    \ is a must.\n\nShould you already have a job in one of these areas, you are going\
    \ to be able to advance in your career because you have furthered your knowledge\
    \ in something that is going to be beneficial to you.\n\nJavaScript is not only\
    \ good if you are in I.T. or web design. JavaScript can be used in any job, if\
    \ you are unsure if it can be used in your job, ask your boss. Showing an initiative\
    \ to learn beyond what your job calls for is going to impress your boss and earn\
    \ you favor.\n\n## Chapter 2: Writing your first JavaScript code\n\nAs mentioned\
    \ in the previous chapter, the JavaScript that helps run interactive websites\
    \ does not work alone and functions alongside HTML and CSS, forming the three\
    \ core languages that make up a web page.\n\nSo let us begin writing JavaScript.\
    \ Since JavaScript will run in a web page we need to first have a web page where\
    \ the JavaScript language would be written.\n\nBelow is a simple web page example\
    \ to use as our reference:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Title\
    \ here</title>\n</head>\n<body>\n<p>This is a web page</p>\n</body>\n</html>\n\
    ```\n\nCode is composed of basic HTML and no CSS, very basic stuff. So now if\
    \ you copy the code and paste it on a Notepad application, then save it as an\
    \ HTML file, for example `first.html`, and then double-click that file, (if the\
    \ browser does not open the file when you double-click it, open the browser manually\
    \ and drag the file to its window) then the web browser installed in your computer\
    \ should be able to render the code successfully and produce the result of\n\n\
    This is a web page.\n\nAnd just as we use opening and closing `p` tags to surround\
    \ a paragraph, for JavaScript we enclose it with `script` tags. `<script> </script>`\n\
    \nFor the first JavaScript code to add to this HTML file example, we are going\
    \ to use a JavaScript popup box called `alert` that produces a popup message box\
    \ upon running the web page and output the text ‘Hello World’. \n\n```javascript\n\
    <script>\nalert (\"Hello World!\");\n</script>\n```\n\nNote that in order for\
    \ the popup box to appear, make sure your browser’s Privacy Settings would allow\
    \ this.\n\nNow putting everything together, we add the JavaScript code to the\
    \ rest of the HTML:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Title\
    \ here</title>\n</head>\n<body>\n<p>This is a web page</p>\n<script>\nalert (\"\
    Hello World!\");\n</script>\n</body>\n</html>\n```\n\nSave the file and double-click\
    \ on it to open it up in the web browser. If this does not work, open the browser\
    \ and just drag the file to the browser window; it will open the webpage you are\
    \ creating. You should then see the alert message box pop up with the text ‘Hello\
    \ World!’.\n\n**Result: Hello World!**\n\nCongratulations – you have written your\
    \ first JavaScript code. In the next chapters, we will discuss more about the\
    \ language and how you can use it to produce better web pages.\n\n## Chapter 3:\
    \ Data and JavaScript variables\n\nData is normally stored so that it can be used\
    \ at a later date. This is a very important aspect of writing code. JavaScript\
    \ is a wonderful programming language that is going to store the data so that\
    \ you can use it later and do not have to worry about it getting lost.\n\nWhen\
    \ you are writing code, you are going to be able to have it interact with the\
    \ users by asking for information that may be able to be used at a later time.\n\
    \n### Code\n\nYou would like for the user to enter their last name so that you\
    \ can personalize a greeting for them.\n\n```javascript\nvar surname = prompt(“Greetings\
    \ user, may I ask what your surname is?”);\n```\n\nAfter the code has been run,\
    \ a box is going to appear asking the user what their last name is. All the user\
    \ is going to need do is type in their last name before they hit enter or click\
    \ the okay button for the information to be moved and stored in the proper place.\n\
    \nCongratulations, you have now created a variable that will be the surname of\
    \ the user.\n\n### Variables\n\nVariables are going to be easier to understand\
    \ if you think of them as shelves. Each shelf has a name that is created once\
    \ the variable has been created. So, for the previous code, your shelf’s name\
    \ is going to be `surname` and the object that is setting on that shelf is the\
    \ user’s surname.\n\nAnything you want to make as a variable can be made. But,\
