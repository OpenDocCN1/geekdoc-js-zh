    } ;


    The a and b are going to be the parameter for the functions while the value is
    going to be returned by the keyword.


    The keyword that is used for the return is going to stop the code that has been
    placed in the function; therefore nothing is going to run after it.


    Code :


    var result = add( 1, 2); // the result is going to be 3\.


    The call is going to add the argument of one and two, which have been saved for
    the a and b variables.


    Chapter 9:


    Objects Located in JavaScript


    When an object has been found in JavaScript, it is going to be much like a real
    life object that contains a set of properties and abilities.


    The object will have a collection of properties that are named, and methods that
    are going to determine how it is going to function.


    The object is going to be saved into a variable while everything else can be obtained
    through a phrase using dot notation.


    As an analogy, if you look at a person, they are going to have a name, they have
    an age, and they are able to move, learn, and talk. Should that human be placed
    into JavaScript, their name and age are going to be considered properties which
    are nothing more than pieces of data. The ability to move, talk, and learn are
    going to be the functions of the human being because they are complex behaviors.
    An object that has theses abilities is known as a method.


    Variables can hold objects while they create the object through the use of a special
    syntax that is going to be enclosed in a set of brackets.


    Code:


    var jedi = {


    Name: “Luke”,


    Age: 899,


    Talk: function() {


        alert(“another... Sky... walk …”);


    }


    };


    The name and age of the Jedi are going to be the properties or variables that
    are sitting inside the object. Objects are able to store any data that a variable
    can. The talking that the Jedi can do is going to be the property where the function
    is being held, also known as the method. The data can come back from the object
    through the use of the phrases using dot notation.


    Code:


    jedi.Name;


    Luke


    jedi.Age ;


    899


    jedi.Talk() ;


    //an alert box is going to be produced.


    The properties can also be reassigned to the object.


    Code:


    jedi.Name = “Mace Windu”;


    Or you can add in new variable objects that were not added in earlier.


    jedi.lightsaber = “purple” ;


    The properties do not have to be any specific data; they can be anything as well
    as objects and arrays. When one object is listed as the property for a different
    object, you have successfully created a nested objected.


    Code:


    var person = {


    age: 122


    };


    person.name = {


    First: “Jeanne” ,


    Last: “Calment”


    };


    Now if you want to know what the person''s first name is, you will use this.


    Code:


    alert(person.name.First);


    To create the item that will be empty you will need to add the properties and
    methods.


    Code:


    var dog = {};


    dog.bark = function() {


    alert(“Woof!” );


    };


    Chapter 10:


    JavaScript Arrays


    An array is a list of any sort of data and it is not limited to including other
    arrays. Every item that is listed in an array is going to have an index that will
    be used in retrieving an element from the array.


    The index is going to start at zero always and all the elements that fall in line
    are going to increase by one so that the last element will be one number less
    that the length of the total array.


    Creating an array in JavaScript means that you use an array-literal syntax.


    Code:


    var emptyArray = [] ;


    var shoppingList = [ ''Rice'', ''Soda'', ''Buns''];


    You are going to be able to get a specific element with the use of a square bracket
    syntax.


    Code:


    shoppingList[0];


    Rice


    You can also set the value to the particular index by using the square bracket
    syntax


    Code:


    shoppingList[1] = ''Chips'';


    // your shoppingList is now going to be [''Soda'', ''Chips'', ''Rice'']


    The quantity of items present in the array is going to use the length property
    to tell you how many elements there are.


    Code:


    shoppingList.length;


    3


    The push and pop methods can be used so that elements can be added and removed
    from the finish of the array.


    Code:


    shoppingList.push (''A new car'');


    // shoppingList [ ''Soda'', ''Buns'', ''Rice'', ''A new car'']


    shoppingList.pop();


    // shoppingList is now [''Soda'', ''Buns'', ''Rice'']


    The code below is going to create a push, pop, and then iterate it over the array
    so that it can be passed to the name of the function that is labeled as helloFrom.
    Then helloFrom is going to be returned to the string for the greeting of: “Hello
    from” and then the user’s name. After you have finished with the push and pop
    method, the list of user’s name is going to be “Burt”, “Luke”, “Ron”, and “Tim”.


    Code:


    var helloFrom = function(personName) {


    return “Hello from” + personName;


    }


    var people = [''Burt'', ''Luke'', ''Ron''];


    people.push(''Tim'');


    people.push(''Dr Evil'');


    people.pop();


    for(var I = 0 ; I < people.length; I ++) {


    var greeting = helloFrom(people[I]);


    alert(greeting) ;


    }


    Chapter 11:


    DOM


    DOM stands for Document Object Model and it will manipulate how an HTML page is
    structured and styled. It is going to be represented by the internal pages that
    the browser is going to see so that the developer is able to alter the JavaScript
    code.


    In order to look at the DOM for a page, you are going to open the developer tool
    inside of the browser that you are using and locate the "elements" pane. You can
    do this by clicking right click somewhere on the page in your browser and clicking
    "Inspect Element" from the menu list that appears. This will give you a good insight
    as to how the browser thinks. In most browsers, you are going to have the ability
    to modify and remove elements directly without asking for permission.


    Trees and Branches


    HTML is similar to the structure of an XML in that the elements are going to contain
    parent nodes from the structure that it creates along with children nodes. It
    is much like tree branches. HTML is going to have a single root element that contains
    branches much like a head and body and the limbs that are going to be attached
    to it. Because of this, DOM is also known as a DOM tree.'
