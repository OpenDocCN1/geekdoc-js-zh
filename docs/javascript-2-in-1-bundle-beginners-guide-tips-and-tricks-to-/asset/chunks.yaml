- fmt: "\nBut for most developers or coders, having their own library is a hobby;\
    \ one that enables them to write multiple codes and help others and contribute\
    \ to the process.\n\n# Your Goals and Scope of Work\n\nBefore you set out writing\
    \ your codes, you need to be clear on what your goals are for this library. With\
    \ this, it will help you keep focused on what problems you encounter and how to\
    \ solve them with your library.\n\nYour primary goal is also to make your library\
    \ easy to use. Essentially, the simpler your `API`, the easier it will be for\
    \ anyone to use your library.\n\nSo ask yourself- what problems does your library\
    \ solve and how can you solve it? Will you utilize codes from someone else’s library\
    \ or will you write everything yourself?\n\nIn chapter 1, we discussed creating\
    \ a roadmap. This roadmap for your library will be one of the techniques you use\
    \ in any other code development you set out to do.\n\n## A Roadmap for your library:\
    \ \n\n- List out the features you want in your library\n- Make these features\
    \ minimum and practical\n- Create milestones for each feature\n\nWhat you are\
    \ doing with the roadmap is setting goals for each function, essentially breaking\
    \ your project into manageable sizes so it is easier to accomplish and the process\
    \ of creating it is a lot more enjoyable. It’ll also keep you sane and focused.\n\
    \n# Your Library API Design\n\nWhen creating your library, think of yourself as\
    \ the end-user. By putting yourself as the user, you will work towards a user-centric\
    \ design and development. This will make your library more convenient to use by\
    \ anyone who has access to it.\n\n## Testing Your API\n\nThe best way to test\
    \ the quality of your `API` is to use it for your projects. What you can do is\
    \ substitute the application code with your library and see if the result it gives\
    \ covers all the features you want. Keep to the minimum bare essentials as possible\
    \ and also provide room for flexibility to change and revise anything that may\
    \ seem slightly off.\n\nHere is one example of what the implementation coding\
    \ or User-Agent string library outline would look like:\n\nCode:\n\n```javascript\n\
    // Start with empty UserAgent string\n\nvar userAgent = new UserAgent;\n\n// Create\
    \ and add first product: EvilCorpBrowser/1.2 (X11; Linux; en-us)\n\nvar application\
    \ = new UserAgent.Product('EvilCorpBrowser', '1.2');\n\napplication.setComment('X11',\
    \ 'Linux', 'en-us');\n\nuserAgent.addProduct(application);\n\n// Create and add\
    \ second product: Blink/20420101\n\nvar engine = new UserAgent.Product('Blink',\
    \ '20420101');\n\nuserAgent.addProduct(engine);\n\n// EvilCorpBrowser/1.2 (X11;\
    \ Linux; en-us) Blink/20420101\n\nuserAgent.toString();\n\n// Make some more changes\
    \ to engine product\n\nengine.setComment('Hello World');\n\n// EvilCorpBrowser/1.2\
    \ (X11; Linux; en-us) Blink/20420101 (Hello World)\n\nuserAgent.toString();\n\
    ```\n\nDepending on how complex your library is, you also need to give some thought\
    \ to structuring. One way to do this is to utilize design patterns to structure\
    \ your library as well as overcome any technical issues you may experience along\
    \ the way.\n\nStructuring also reduces the risk of re-aligning huge parts when\
    \ you are adding new features to your library.\n\n## Flexibility and Customization\n\
    \nA cool thing about most JavaScript libraries out there is its flexibility. However,\
    \ many developers face problems when deciding what they can and cannot customize.\
    \ One of this is the `chart.js` and `D3.js`.\n\nBoth elements are great libraries\
    \ to visualize data. If you need more control over your graphics, then the `D3.js`\
    \ is what you want. If you want something that is easy to create yet give you\
    \ different types of built-in charts, then `Chart.js` is the one to use.\n\nThere\
    \ are three ways that you can give your user control over your library:\n\n1.\
    \ Configuration\n2. Exposing public methods\n3. Callbacks & events\n\nConfiguring\
    \ a library is often done at the project initialization stage, but some of these\
    \ libraries also allow you to set during run-time. These configurations are commonly\
    \ limited to simple issues as changing these settings will only update these values\
    \ for use later on. \n\nCode:\n\n```javascript\n// Configure at initialization\n\
    \nvar userAgent = new UserAgent({\n\n  commentSeparator: ';'\n});\n\n// Run-time\
    \ configuration using a public method\n\nuserAgent.setOption('commentSeparator',\
    \ '-');\n\n// Run-time configuration using a public property\n\nuserAgent.commentSeparator\
    \ = '-';\n```\n\nCertain methods are exposed intentionally to interact with an\
    \ instance (getters) such as to retrieve data from the instance or to put data\
    \ in the instance (setters) as well as perform certain actions.\n\nCode:\n\n```javascript\n\
    var userAgent = new UserAgent;\n\n// A getter to retrieve comments from all products\n\
    \nuserAgent.getComments();\n\n// An action to shuffle the order of all products\n\
    \nuserAgent.shuffleProducts();\n```\n\nCallbacks are also sometimes accepted and\
    \ passed using public methods and it often used to run user-codes after an asynchronous\
    \ task.\n\n```javascript\nvar userAgent = new UserAgent;\n\nuserAgent.doAsyncThing(function\
    \ asyncThingDone() {\n\n  // Run code after async thing is done\n});\n```\n\n\
    Events have a huge potential in JavaScript libraries. Slightly similar to callbacks,\
    \ they have a slight difference where adding event handlers do not cause trigger\
    \ actions. Events are also used to indicate certain events and can provide additional\
    \ information to the user as well as return a specific value for the library to\
    \ correspond with.\n\nCode:\n\n```javascript\nvar userAgent = new UserAgent;\n\
    \n// Validate a product on addition\n\nuserAgent.on('product.add', function onAdd(product)\
    \ {\n  var shouldProduct = product.toString().length < 5;\n  // Tell the library\
    \ to add\n  return shouldProduct;\n});\n```\n\nYou may also enable your users\
    \ to extend your library. In order to do this, you need to make available your\
    \ public method or property so users can populate it, such as the Angular modules.\n\
    \nCode:\n\n```javascript\n(angular.module('myModule')) && jQuery.fn.myPlugin\n\
    ```\n\nYou can also just do nothing of the above and allow users to access your\
    \ library through its namespace.\n\nCode:\n\n```javascript\n// AngryUserAgent\
    \ module\n// Has access to UserAgent\n(function AngryUserAgent(UserAgent) {\n\
    \  // Create new method .toString()\n  UserAgent.prototype.toString = function()\
    \ {\n    return this.toString().toUpperCase();\n  };\n})(UserAgent);\n\n// Application\
    \ code\nvar userAgent = new UserAgent;\n\n// ...\n\n// EVILCORPBROWSER/1.2 (X11;\
    \ LINUS; EN-US) BLINK/20420101\n\nuserAgent.toString();\n```\n\nSimilarly, this\
    \ allows you to overwrite methods as well.\n\nCode:\n\n```javascript\n// AngryUserAgent\
    \ module\n(function AngryUserAgent(UserAgent) {\n  // Store old .toString() method\
    \ for later use\n  var _toString = UserAgent.prototype.toString;\n\n  // Overwrite\
    \ .toString()\n  UserAgent.prototype.toString = function() {\n    return _toString.call(this).toUpperCase();\n\
    \  };\n})(UserAgent);\n\nvar userAgent = new UserAgent;\n\n// ...\n\n// EVILCORPBROWSER/1.2\
    \ (X11; LINUS; EN-US) BLINK/20420101\n\nuserAgent.toString();\n```\n\nIn this\
    \ case, giving users access to your library’s namespace also gives you less control\
    \ over how plugins and extensions are defined.\n\nTo allow for extensions to follow\
    \ some certain convention, you need to write documentation.\n\n# Testing\n\nFor\
    \ test-driven development, an outline is essential. In other words, this is the\
    \ time when you write down the features and criteria in the form of tests, even\
    \ before you write down the actual library.\n\nIf your test show you that a feature\
    \ behaves like it was supposed to, and you write it down before writing it in\
    \ your library, then this strategy is called behavior-driven development.\n\n\
    If your tests cover every aspect of your library then if your code surpasses all\
    \ these tests, then you can safely say that your library is working well.\n\n\
    Other testing frameworks that you can use are:\n\n[Unit Test Your JavaScript Using\
    \ Mocha and Chai](http://www.sitepoint.com/unit-test-javascript-mocha-chai/) by\
    \ Jani Hartikainen, where you can write unit tests in Mocha.\n"
  raw: 'But for most developers or coders, having their own library is a hobby; one
    that enables them to write multiple codes and help others and contribute to the
    process.


    Your Goals and Scope of Work


    Before you set out writing your codes, you need to be clear on what your goals
    are for this library. With this, it will help you keep focused on what problems
    you encounter and how to solve them with your library.


    Your primary goal is also to make your library easy to use. Essentially, the simpler
    your API, the easier it will be for anyone to use your library.


    So ask yourself- what problems does your library solve and how can you solve it?
    Will you utilize codes from someone else’s library or will you write everything
    yourself?


    In chapter 1, we discussed creating a roadmap. This roadmap for your library will
    be one of the techniques you use in any other code development you set out to
    do.


    A Roadmap for your library:


    -    List out the features you want in your library


    -    Make these features minimum and practical


    -    Create milestones for each feature


    What you are doing with the roadmap is setting goals for each function, essentially
    breaking your project into manageable sizes so it is easier to accomplish and
    the process of creating it is a lot more enjoyable. It’ll also keep you sane and
    focused.


    Your Library API Design


    When creating your library, think of yourself as the end-user. By putting yourself
    as the user, you will work towards a user-centric design and development. This
    will make your library more convenient to use by anyone who has access to it.


    Testing Your API


    The best way to test the quality of your API is to use it for your projects. What
    you can do is to substitute the application code with your library and see if
    the result it gives covers all the features you want. Keep to the minimum bare
    essentials as possible and also provide room for flexibility to change and revise
    anything that may seem slightly off.


    Here is one example of what the implementation coding or User-Agent string library
    outline would look like:


    Code:


    // Start with empty UserAgent string


    var userAgent = new UserAgent;


    // Create and add first product: EvilCorpBrowser/1.2 (X11; Linux; en-us)


    var application = new UserAgent.Product(''EvilCorpBrowser'', ''1.2'');


    application.setComment(''X11'', ''Linux'', ''en-us'');


    userAgent.addProduct(application);


    // Create and add second product: Blink/20420101


    var engine = new UserAgent.Product(''Blink'', ''20420101'');


    userAgent.addProduct(engine);


    // EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101


    userAgent.toString();


    // Make some more changes to engine product


    engine.setComment(''Hello World'');


    // EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101 (Hello World)


    userAgent.toString();


    Depending on how complex your library is, you also need to give some thought to
    structuring. One way to do this is to utilize design patterns to structure your
    library as well as overcome any technical issues you may experience along the
    way.


    Structuring also reduces the risk of re-aligning huge parts when you are adding
    new features to your library.


    Flexibility and Customization


    A cool thing about most JavaScript libraries out there is its flexibility. However,
    many developers face problems when deciding what they can and cannot customize.
    One of this is the chart.js and D3.js.


    Both elements are great libraries to visualize data. If you need more control
    over your graphics, then the D3.js is what you want. If you want something that
    is easy to create yet give you different types of built-in charts, then Chart.js
    is the one to use.


    There are three ways that you can give your user control over your library:


    1-    Configuration


    2-    Exposing public methods


    3-    Callbacks & events


    Configuring a library is often done at the project initialization stage, but some
    of these libraries also allow you to set during run-time. These configurations
    are commonly limited to simple issues as changing these settings will only update
    these values for use later on. 


    Code:


    // Configure at initialization


    var userAgent = new UserAgent({


      commentSeparator: '';''


    });


    // Run-time configuration using a public method


    userAgent.setOption(''commentSeparator'', ''-'');


    // Run-time configuration using a public property


    userAgent.commentSeparator = ''-'';


    Certain methods are exposed intentionally to interact with an instance (getters)
    such as to retrieve data from the instance or to put data in the instance (setters)
    as well as perform certain actions.


    Code:


    var userAgent = new UserAgent;


    // A getter to retrieve comments from all products


    userAgent.getComments();


    // An action to shuffle the order of all products


    userAgent.shuffleProducts();


    Callbacks are also sometimes accepted and passed using public methods and it often
    used to run user-codes after an asynchronous task.


    var userAgent = new UserAgent;


    userAgent.doAsyncThing(function asyncThingDone() {


      // Run code after async thing is done


    });


    Events have a huge potential in JavaScript libraries. Slightly similar to callbacks,
    they have a slight difference where adding event handlers do not cause trigger
    actions. Events are also used to indicate certain events and can provide additional
    information to the user as well as return a specific value for the library to
    correspond with.


    Code:


    var userAgent = new UserAgent;


    // Validate a product on addition


    userAgent.on(''product.add'', function onProductAdd(e, product) {


      var shouldAddProduct = product.toString().length < 5;


      // Tell the library to add the product or not


      return shouldAddProduct;


    });


    You may also enable your users to extend your own library. In order to do this,
    you need to make available your public method or property so that users can populate
    it, such as  the Angular modules.


    Code:


    (angular.module(''myModule'')) and jQuery’s fn(jQuery.fn.myPlugin)


    You can also just do nothing of the above and allow users to access  your library
    through its namespace.


    Code:


    // AngryUserAgent module


    // Has access to UserAgent namespace


    (function AngryUserAgent(UserAgent) {


      // Create new method .toAngryString()


      UserAgent.prototype.toAngryString = function() {


        return this.toString().toUpperCase();


      };


    })(UserAgent);


    // Application code


    var userAgent = new UserAgent;


    // ...


    // EVILCORPBROWSER/1.2 (X11; LINUX; EN-US) BLINK/20420101


    userAgent.toAngryString();


    Similarly, this allows you to overwrite methods as well.


    // AngryUserAgent module


    (function AngryUserAgent(UserAgent) {


      // Store old .toString() method for later use


      var _toString = UserAgent.prototype.toString;


      // Overwrite .toString()


      UserAgent.prototype.toString = function() {


        return _toString.call(this).toUpperCase();


      };


    })(UserAgent);


    var userAgent = new UserAgent;


    // ...


    // EVILCORPBROWSER/1.2 (X11; LINUX; EN-US) BLINK/20420101


    userAgent.toString();


    In this case, giving users access to your library’s namespace also gives you less
    control over how plugins and extensions are defined.


    To allow for extensions to follow some certain convention, you need to write documentation.


    Testing


    For test-driven development, an outline is essential. In other words, this is
    the time when you write down the features and criteria in the form of tests, even
    before you write down the actual library.


    If your test show you that a feature behaves like it was supposed to, and you
    write it down before writing it in your library, then this strategy is called
    behavior-driven development.


    If your tests cover every aspect of your library then and if your code surpasses
    all these tests, then you can safely say that your library is working well.


    Other testing frameworks that you can use are:


    [Unit Test Your JavaScript Using Mocha and Chai](http://www.sitepoint.com/unit-test-javascript-mocha-chai/)
    by Jani Hartikainen, where you can write unit tests in Mocha.'
