    It’s the most common computer language utilized in all major browsers from the
    humble Internet Explorer to the advanced Google Chrome and Safari. Most computers
    already come with `JavaScript` installed into their system, so it’s guaranteed
    that visitors from all around the world will be able to view what you have on
    the internet, software and computer programs.


    Everyone and anyone can use `JavaScript` without purchasing licenses.


    Also, in case you are wondering, `JavaScript` and `Java` are completely two different
    computer languages used for various programming needs.


    The thing about `JavaScript` is that there are plenty of `JavaScript` codes pre-written
    that you can copy and plug it directly into your web page for a similar effect,
    instead of writing all the codes again on your own. All you need to know is find
    out what the code does and then where to copy and paste these codes in its particular
    places to get the desired effect, like baking a cake.


    If you have opened this book, we are not going to go into the specifics of `JavaScript`
    and teach you the basics or the steps of coding and programming or pasting these
    codes into your web page.


    What this book will do however, is give you loads of tips and tricks to help you
    navigate your way into becoming a better programmer and use `JavaScript` more
    efficiently.


    # A Brief History of JavaScript


    Back in the 1990s when the world wide web was still in its developing stages,
    all web pages were static there was no way of interaction between user and the
    website. What you saw was exactly what was set up.


    Two of the most popular browsers at that time were Internet Explorer and Netscape
    Navigator. While the Internet Explorer was a lot more famous, Netscape was the
    first to bring about a programming language that enabled a webpage to be interactive
    with the user. This language was called `LiveScript` and it was integrated into
    Netscape’s browsers. Anyone using Netscape could now interact with the pages thanks
    to this language. `LiveScript` did not need a plugin.


    On another note, there was another programming language that required a separate
    plugin to run and that was called `Java`. At this point, `Java` became very well
    known and Netscape decided to cash in on this by renaming `LiveScript` to `JavaScript`.


    As mentioned earlier, there is a wide difference between `Java` and `JavaScript`,
    although their codes appear similar.


    And then Internet Explorer, with the need to innovate, is updated and supported
    by two integrated languages which was called `vbscript` based on `BASIC` programming
    and another called `Jscript` which was similar to `JavaScript`.


    By the time Internet Explore became the most used browser, `JavaScript` also became
    the most accepted and widely used programming language to be used in up and coming
    web browsers.


    Fast forward to 1996, scripting language became so important that it was risky
    to leave it to competing browser developers. In that same year, `JavaScript` was
    given to the ECMA, the international standards body who was responsible for the
    development of programming language. This language was officially renamed to `ECMAScript`
    but programmers and everyone else still know it as `JavaScript`.


    It’s a lot cooler sounding too.


    # The Importance of JavaScript


    To understand how `JavaScript` is used is to understand the basic roles of other
    programming that goes into the development of a webpage.


    Simply put:


    1. `HTML` is the language that is used to markup content. `HTML` defines what
    the content is, and not how it looks on a webpage.

    2. `CSS` is used to define the appearance of a webpage. This entails specifying
    which media corresponds to which command.


    Just by using these two languages, you can already create a static webpage that
    can be easily accessed regardless of what device you view the webpage on and what
    browser is used to access it.


    However, the biggest disadvantage of web pages like these is that the only way
    your visitor can interact with your static site is by filling up a form and waiting
    for a new page to load.


    That’s where `JavaScript` comes in.


    `JavaScript` converts static pages into one that is interactive so that site visitors
    won’t need to wait for a new page to load every time they make a request. `JavaScript`
    enables your web pages to have a behavior - to make them capable of responding
    to a variety of actions in real-time.


    With `JavaScript`, you can:


    - Validate each field in a form as a user enters the information and not fill
    up the whole form and only be told the user made a typo after submitting the form.

    - Enables your page to be interactive in more ways than involving forms.

    - Add animations to a page, attracting attention to a specific part or making
    the website easier to use.

    - Load new and heavier images and scripts on the webpage.

    - Enables you to improve your visitor’s experiences.


    # Chapter 1: Simple Tricks to Help You


    ## Learn JavaScript Faster


    Oftentimes when anyone is on the path of learning `JavaScript` or any coding skill,
    they often experience some of these issues:


    - Confusing concepts

    - Time and motivation to learn

    - Easy to forget codes

    - Tooling landscape keeps changing


    In this chapter, we are going to look at conquering these challenges with some
    mind tricks that can help you learn the `JavaScript` landscape faster, making
    you a more productive coder.


    ### TIP 1: CREATE A ROADMAP OF WHAT YOU WANT TO LEARN


    Let’s face it- there are plenty of frameworks to use and new coders are always
    at the crossroads of which to start off with first. Instead of researching which
    frameworks to start on, one of the best ways to overcome this would be to create
    your roadmap of learning what you need to know.


    For example, if you want to become a front-end developer, then your roadmap could
    look like this:


    ![](images/00001.jpeg)


    `HTML` and `CSS` are the most basic coding knowledge you need to know before you
    proceed to learn other things. Then you can move on to `JavaScript` and `jQuery`.
    Once you have created your roadmap, it’ll make it easier for you to focus on what
    is essential first so you don’t waste time and effort.


    ### TIP 2: TAKE YOUR TIME


    Wanting to understand coding quickly will be one of the harmful things that can
    halt your progress of learning coding and `JavaScript`.


    Attempting to skim something and then moving on to the next issue at hand will
    only make you forget things even more. You’ll forget what you read the first time,
    go back to it and read it to refresh your memory and then move on. By this time,
    you’d have forgotten something entirely. This cycle will keep repeating, and then
    you’ll find yourself discouraged. To prevent this from happening, you can do this:


    - Limit the amount of coding to a particular task. Learn one thing at a time.

    - Practice what you’ve learned.


    By learning and practicing your coding skills, you’ll find that it is a lot easier
    to remember things and absorb them as you go on learning new things. This process
    may seem longer, but practice does make it perfect.


    ### TIP 3: PRACTICE WITH THE RIGHT MINDSET


    Remember this: if you try to take shortcuts in your `JavaScript` practice, you
    will only end up taking a longer time to learn it. Yes practicing is boring and
    repetitive but here are some ways to make it exciting:


    Try treating each new concept in `JavaScript` like a new toy, car or iPhone or
    even a new dress. You are excited to try it, especially when it’s new and you
    use it several times. Apply something cool with the concept that you’ve just learned;
    surprise yourself and show your friends your new skill.


    With a slightly more playful approach to learning new things, you can have fun
    while learning. You’ll also find that you remember these concepts longer and you
    learn a lot faster.


    ### TIP 4: COMPARTALIZING YOUR TIME

