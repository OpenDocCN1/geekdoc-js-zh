    兼容的函数编程语言。


    ![`s3.amazonaws.com/codementor_content/2016-May/frp_gtrend.png`](img/00016.jpeg)


    开发者选择代替 `RxJS` 的某些兼容编程语言是 `ClojureScript` 和 `Elm`。然而，所有程序的增长和流行程度与 `Redux+React`
    相比都显得黯然失色。


    ![`s3.amazonaws.com/codementor_content/2016-May/frp_with_redux.png`](img/00017.jpeg)


    事实是，看到函数编程如何完美地解决 Web 开发中的现代问题，人们必须同意函数编程范式及其等概念作为 JavaScript 开发者需要掌握和学习的必要技能一直存在。


    ## 桌面框架对决：Nw.js vs. Electron


    如今有很多需要从桌面和移动等各种平台同步数据。然而，许多服务最初都是以 Web 应用的形式出现，然后转换为桌面应用以增强用户体验。这样做是因为 Web 应用的开发速度更快且更容易更新。此外，用户还可以更快速地尝试
    Web 应用，而无需安装任何其他东西。


    过去的开发者如果想使用 Web 技术为桌面应用创建前端 UI，只能受限于使用 `CEF`。这不是一个简单的过程，应用程序本身并不是真正的跨平台兼容。尽管如此，`Node.js`
    让桌面框架的跨平台应用变得更加容易。使用 Web 技术进行桌面应用开发的趋势从 2014 年开始兴起。


    因此，让我们来看看这两个项目的 GitHub Star 历史：


    ![nwjs vs electron](img/00018.jpeg)


    尽管 `Nw.js` 早得多进入领域并被认为更老旧，但看起来 `Electron` 正在以爆炸性的速度增长，而 `nw.js` 则以单调的线性速度增长。


    ![nw.js vs electron](img/00019.jpeg)


    虽然 `Electron` 还很新，但它被 `Slack`、`Microsoft` (`Visual Studio Code`)、`WordPress` 和
    `Sencha` 等多个成熟机构使用。凭借 `Electron` 的易用性，网络和社区增长非常快。这种流行趋势可能会持续到 2017 年，从而使 `Electron`
    成为桌面和 Web 应用开发的框架框架。


    ## 移动应用框架对决：React Native vs. Ionic


    当 `React Native` 出世时，人们预测它将接管并利用 Web 技术引领移动开发的路线，因为它可以用于开发原生跨平台应用。那么 2017 年是 `React
    Native` 的年吗？通过这张图表可能会产生一些预期：


    ![react native vs ionic](img/00020.jpeg)


    此时，`React Native` 尚未发布任何更新的软件，因为它仍处于 0.26 版本。它在 2017 年是否会成为主流，很大程度上取决于开发者处理需要一起重构整个代码库以及其他问题的应用开发变化的耐心。


    因此，让我们来看看 `React Native` 对比 `Ionic` 的近似 `npm` 下载量：


    ![react native vs ionic](img/00021.jpeg)


    从图表中可以看出，`React Native` 有望超越 `ionic`，成为使用 Web 技术进行跨平台移动开发的首框架。


    在就业市场方面，`React Native` 也比 `Ionic` 更有需求：


    ![react native vs ionic](http://www.indeed.com/jobtrends/q-react-native-q-ionic.html)


    快速搜索招聘信息显示，至少有 75 个招聘职位寻找具有 `ionic` 技能的开发者，而 65 个招聘职位正在寻找具有 `React` 技能的开发者。这表明人们对
    `React Native` 的熟悉程度正在增加，这很可能对 2017 年之后的任何新兴开发者提供巨大的推动力。


    ## Web API 的未来：GraphQL vs REST


    在 `Facebook` 提到他们将开源 `GraphQL` 后，许多 JavaScript 开发者在 2016 年早期就加入了这一热潮，特别是当 `Facebook`
    在开源项目方面变成了 JavaScript 界的“苹果公司”。


    ![graphql](img/00023.jpeg)


    `GraphQL` 旨在取代 `REST` API，但考虑到 `REST` API 的无处不在，这种情况不太可能发生：


    ![rest vs graphql](img/00024.jpeg)


    `GraphQL` 与 `REST` API 配合得很好，但它绝对不会像某些开发者认为的那样取代 `REST`。更重要的是，`GraphQL` 相对较新并与
    `Facebook Relay` 关联，因此程序员和开发者在其他地方没有获取该技能的学习资源或最佳实践。尽管如此，2017 年对于 `GraphQL` 成为主流仍然太早了。


    ### JavaScript 趋势结论


    结论，JavaScript 社区的移动和变化非常快，跟上任何趋势并符合主流技术意味着更多的支持、相关性和资源。根据本章讨论的趋势，JavaScript 开发者应该为自己配备
    `Redux & React` 以及其他函数式编程语言，如 `TypeScript`。不仅如此，拥有 `React Native` 和 `Electron`
    的经验无疑会为未来的程序员在求职中中提供更多推力和信誉。


