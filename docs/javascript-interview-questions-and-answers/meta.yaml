- img_proc: true
  md: 'You can use <script> tag in html. <script> tag has type attribute which defined
    code is there inside the script tag.

    nYou can use <script> element in web pages in following ways:


    +   - In head element

    - In body element

    - As an external script file


    To use Javascript as a scripting language for web pages in <head> or <body> you
    can define type as "text/javascript".

    e.g.

    <script type="text/javascript">

    </script>


    Sometimes you may need to use same Javascript code in several web pages, in such
    cases you can store Javascript code in external file and save file as <filename>.js
    file.

    Then this script can be made available to web page using src attribute of <script>
    tag


    e.g.

    <script src="external file URL">

    </script>


    # 8. What are advantages of using external javascript?


    Placing JavaScript code in external js files has few advantages over inline scripts.


    Segregating HTML and JavaScript code helps to manage the code base better.


    To improve development output designers can work along with coders in parallel
    without code conflicts.

    This approach also works well with modern source code version control systems
    like GIT and SVN.

    Each of these files can maintain history.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Segregating HTML and JavaScript makes code as well as HTML is easily readable.


    Segregated external JavaScript files are cached by browsers and can speed up page
    load times


    These small files can be minified to reduce the size and make it not readable
    by humans, using Google closure or YUI Compressor or other.


    Many popular JavaScript libraries are available as hosted on content delivery
    networks (cdn) and you can simply point to them using the URL in the src, this
    avoids copying the js file to local folder.


    Using external Js you can take benefits of advanced tools such as RequireJS or
    CommonJS to load these scripts logically and modularly


    # 9. Javascript is case sensitive language?


    Yes, Javascript is case sensitive scripting language. Variables, functions, keywords
    must have consistent casing otherwise it will not be recognized by Javascript
    and generate error.


    e.g.


    ```

    var pratik;

    var praTik;

    ```


    In above case pratik and praTik will be considered as different variables.


    # 10. Is Semicolon compulsory in Javascript at end of the statement?


    No, it is not necessary to use semicolon at end of the statement still will be
    considered as valid statement.


    # 11. What are different data types in Javascript?


    Below are basic data types in Javascript:


    Primitive Data Types:


    +   Number: Represent numeric values, both integer and float.'
