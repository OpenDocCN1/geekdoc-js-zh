    HTML provides high-level interfaces that can be used to represent HTML document.


    Level2: Consist of six specifications:


    CORE2, VIEWS, EVENTS, STYLE, TRAVERSAL AND RANGE.


    CORE2: extends functionality of CORE specified by DOM level 1.


    VIEWS: allow programs to dynamically access and manipulate content of document.


    EVENTS: events are scripts that are executed when user reacts to web page.


    STYLE: allow programs to dynamically access and manipulate content of style sheets.


    TRAVERSAL: allows programs to dynamically traverse the document.


    RANGE: allows programs to dynamically identify range of content in document.


    Level3 consists of five different specifications: CORE3, LOAD, SAVE, VALIDATIONS,
    EVENTS AND XPath.


    CORE3: extents functionality of CORE specified by DOM level 2.


    LOAD and SAVE: allows program to dynamically load the content of XML document
    into DOM document and save DOM document into XML document by serialization.'
  - '[PAGE 46]


    VALIDATION: allows program to dynamically update the content and

    structure of document while ensuring the document is valid.


    EVENTS: extents functionality of Events specified by DOM level 2.


    XPATH: XPATH is a path language that can be used to access DOM tree.


    # 104. What are deferred scripts?


    By default, Javascript files interrupt parsing of HTML document in

    order for them to be fetched and executed.


    The defer attribute tells browser to only execute the script file once the

    HTML document has been fully parsed.


    ```

    <script src="myscript.js">

    ```


    This reduces loading time of web page and web page is displayed faster.


    # 105. What are asynchronous scripts?


    By default, Javascript files interrupt parsing of HTML document in

    order for them to be fetched and executed.


    The async attribute is used to indicate browser that script file can be

    executed asynchronously.


    ```

    <script async src="somscript.js">

    ```


    The HTML parser does not have pause at the point it reaches the script

    tag to fetch and execute, the execution can occur whenever the script

    comes ready after being fetched in parallel with document parsing.


    # 106. What is difference between attribute and property?


    Attributes: Provide more details on an element like id, type, value etc.


    Property: Value assigned to the property like type="text",

    value=''Name’ etc.'
  - '[PAGE 47]


    107. What is the difference between innerHTML & innerText?

    innerHTML: It will process an HTML tag if found in a string

    innerText: It will not process an HTML tag if found in a string


    108. What is the difference between textContent & innerText?

    The textContent returns every element in the node.

    The innerText is aware of styling and won''t return the text of “hidden” elements.


    109. What is HTMLCollection?

    The HTMLCollection interface represents a generic collection of elements (in document
    order) and offers methods & properties for selecting from the list.

    HTMLCollection has length property which returns the number of items in the collection.

    It is not possible to iterate over HTMLCollection list using foreach default.


    110. What is NodeList?

    NodeList objects are collections of nodes which are usually returned by properties
    such as Node.childNodes and functions such as document.querySelectorAll().

    NodeList has length property which returns the number of nodes in nodelist.

    for...of loops will loop over NodeList objects accurately.


