    \ 42. 什么是 alert？\n\nalert() 函数用于在消息框中显示信息。\n\n## 43. 什么是 confirm？\n\nconfirm()\
    \ 函数显示带有 Ok 和 cancel 按钮的消息框。点击 Ok 按钮返回 true。点击 cancel 按钮返回 false。\n\n## 44. 什么是\
    \ charAt？\n\ncharAt() 函数返回指定索引的字符。\n例如：\n\n```\nvar str=\"Pratik\";\nconsole.log(str.charAt(0));\n\
    ```\n输出 P\n\n## 45. 什么是 indexOf？\n\n此函数返回字符串对象中指定值的首次索引，如果未找到则返回 -1。\n\n例如：\n\n\
    ```\nvar str=\"This is javascript book\";\nconsole.log(str.indexOf(\"javascript\"\
    ));\n```\n输出：8\n\n## 46. 什么是函数作用域？\n\n作用域定义函数及其变量的可访问性。在 JavaScript 中作用域分为两类：\n\
    \n- 全局：全局作用域的函数可以在任何地方访问。\n- 局部：局部作用域的函数仅在其内部访问。\n\n## 47. 什么是严格模式？\n\n严格模式防止某些操作并抛出更多异常。\"\
    use strict\" 语句指示浏览器使用严格模式，这是更简单、更安全的 JavaScript 特性集。\n\n严格模式通过将静默错误转换为抛异常来消除\
    \ JavaScript 中的某些错误。\n\n严格模式解决了 JavaScript 引擎难以进行优化的错误，因此严格模式的代码有时运行比非严格模式的代码快。\n\
    \n它在采取不安全操作（如访问全局对象）时阻止操作。禁用了混乱或考虑不周的功能。严格模式适用于单个函数或整个脚本。它不适用于封装在 { } 大括号中的块语句；将其应用于此类上下文无效。\n\
    \n要为整个脚本启用严格模式，在任何其他语句之前放置 \"use strict\"。\n\n要为函数启用严格模式，在函数体的任何其他语句之前放置 \"use\
    \ strict\"。\n\n## 48. 什么是函数闭包？\n\n闭包是 JavaScript 中的一种特性，内部函数可以访问外部（闭包）函数的变量。\n\
    \n## 49. 什么是回调函数？\n\n作为参数传递给另一个函数，然后在该函数外部调用以完成某种操作的函数被称为回调函数。\n\n例如：\n\n```\n\
