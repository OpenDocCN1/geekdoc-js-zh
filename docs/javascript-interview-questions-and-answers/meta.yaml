  md: '# 10. Error and Exception Handling


    # 131. What is error object?


    When an exception occurs, an object representing the error is constructed and
    thrown.


    The Error constructor creates an error object.


    When runtime errors occur, instances of Error objects are thrown as a base object
    for user-defined exceptions.


    ```

    var error = new Error("error message");

    ```


    "Error" objects contain two properties, "name" and "message". The "name" property
    specifies the type of exception The "message" property provides a more detailed
    description of the exception.


    The "message" gets its value from the string passed to the constructor of exception.


    # 132. What are different error types in Javascript?


    Below are primary error types in javascript:


    +   * SyntaxError : Raised when syntax error occurs while parsing the Javascript
    code.


    +   * RangeError : Raised when numeric value exceeds allowed range.


    +   * EvalError : Raised when the eval() function is used in an incorrect manner.


    +   * ReferenceError : Raised when an invalid reference is used


    +   * TypeError : Raised when type of variable is not as expected.


    +   * URIError : Raised when the encodeURI() or decodeURI() functions are used
    in an inaccurate manner.


    +   * InternalError : Raised when internal error in the javascript engine is thrown.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# 133. How to handle exceptions in JavaScript?


    JavaScript uses the try...catch...finally statement as well as the throw operator
    to handle exceptions.


    You can catch user-defined runtime exceptions, but you cannot catch JavaScript
    syntax errors.


    # 134. Explain try...catch...finally.


    **Try** : wraps spaghetti code that may throw an error in catch block.


    **Catch** : Write code to do something when error occurs in catch block. The catch
    block can have parameters which will give you error information. Usually, catch
    block is used to log an error or display specific messages to the user.


    **Finally** : code in finally block will always be executed regardless of the
    occurrence of an error. The finally block is usually used to complete the remaining
    task or reset variables that might have changed before error occurred in try block.


    # 135. How to throw exceptions programmatically?


    It is possible to throw exceptions programmatically using “throw” statement.


    There is no restriction on data type that can be thrown as an exception. e.g.


    ```

    throw "error occurred!";

    throw new SyntaxError(\syntax error occurred!");

    ```'
  merge: -1
