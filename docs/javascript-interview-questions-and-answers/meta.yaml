    # Javascript 面试题与解答


    Pratik Bandal


    # 关于书籍


    Javascript 面试题与解答对于准备 Javascript 或 Web 技术面试的初学者和专业人士非常有帮助。本书涵盖了 UI 和全栈开发所需的 Javascript
    面试题。同时也建议学习 HTML、CSS 等其他 Web 技术，因为在这本小书中很难涵盖这么多技术。


    本书将帮助你准备面试，并完善你的 Javascript 知识，让你为进入行业工作做好准备。


    对于关于这本书的任何正面或负面反馈，请通过 pratikbandal007@gmail.com 与我联系。


    # 关于作者


    我是 Pratik Bandal，目前在一家大型跨国公司工作，在软件行业拥有 6 年以上的经验。我获得了电子与通信（E&TC）学学位和高级计算研究生文凭。我在医疗、支付和银行等不同领域拥有经验。


    但最重要的是，我像你们一样也是一名开发者，每天工作 8 小时。写作是我在工作之余做的事情，我热爱它。没有人是完美的，对我也是如此。没有你们，我就无法成为一名作者。


    编写一本面试题书是一项巨大的责任。但面试中巨大的自然差异在本书书中很难完全涵盖。


