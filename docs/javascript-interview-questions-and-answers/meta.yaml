  md: '# 12. AJAX overview


    # 146. What is AJAX?


    AJAX stands for Asynchronous Javascript and XML. It is collection of related technologies
    like Javascript, XML, JSON, HTML and XMLHttpRequest etc.


    AJAX allows you to send and receive data asynchronously without reloading web
    page and hence makes web pages more fast and interactive.


    # 147. What is difference between GET and POST?


    | GET | POST |

    |---|---||

    | History | Parameters remain in browser history as they are part of URL. | Parameters
    are not saved in browser history. |

    | Security | GET is less secure as sent as part of URL. | POST is more secure
    than GET because parameters are not stored in browser history. |

    | Parameters | Parameter data is limited to what you can stuff in URL. Safest
    to use less than 2K of parameters. | Parameters can contain uploaded data files
    and larger data than GET. |

    | Caching | Can be cached. | Not cached. |


    # 148. What is XMLHttpRequest object?


    XMLHttpRequest object is used for asynchronous communication between client and
    server.'
