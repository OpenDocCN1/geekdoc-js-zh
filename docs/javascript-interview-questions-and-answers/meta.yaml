  md: 'In the capturing phase:


    The browser checks to see if the element''s outer-most ancestor (<html>) has an
    onclick event handler registered on it during the capturing phase, and runs it
    if so.


    Then it moves on to the next element <html> and does the same thing, then the
    next one, and so on until it reaches the element that was actually clicked on.


    The capturing phase is not often used. Usually it is invisible to us.


    # 64. What is event delegation?


    Event delegation concept relies on the fact that if you want some code to run
    when you click any one of a large number of grouped child elements, you can set
    the event listener on their parent and have events that happen on them bubble
    up to their parent, instead of having to set the event listener on every child
    individually.


    A good example is a series of list items <li> — You can set the click listener
    on the parent <ul>, if you want each of them<li></li> to pop up a message when
    clicked and it will bubble to the list items.'
