    # 1. Fundamentals


    ## 1. What is Javascript?


    Javascript is basically a scripting language used to make web pages more interactive
    as it can be inserted into HTML.


    Javascript is understood by all modern web browsers.


    ## 2. What are features of Javascript?


    **Input validation** : Javascript allows you to validate user input before sending
    it to server for backend operations.


    **Control over browser** : Javascript gives more control over browser to which
    you can change the background colour of this page as well as the text on the browser''s
    status bar.


    **Detect browser and OS** : Javascript enables you to detect user''s browser and
    OS due to which you can perform platform dependant operations.


    **Handling date and time** : Javascript enables you to write code based on user''s
    date and time, it also enables you to capture users date and time as user and
    server may be in different time zone.


    **Generating HTML on fly** : Javascript enables you to dynamically generate HTML.


    ## 3. What are advantages of Javascript?


    **Faster speed** : JavaScript is fast because it run immediately within the client-side
    browser. Javascript is not dependant on network unless backend data is required
    to be processed. Need to compile Javascript on the client-side as it is interpreted
    directly by web browsers.


    **Interoperability** : Javascript can be inserted into web page regardless of
    extension. Within other languages such as Perl and PHP it can be used inside the
    script.


    **Rich interfaces** : Javascript has vast libraries like (charts, drag and drop,
    sliders etc.) which enables you to provide attractive look to your website.


    **Reduction in server load** : Since Javascript is client-side scripting language
    it reduces load on website servers as many operations can be performed at client-side
    which reduces load on server and enables it serve to more users.


    # 4. What are disadvantages of Javascript?


    **Client-side security** : JavaScript code executes in users'' computer hence
    in some cases it can be manipulated for malicious purpose.


    **Browser support** : JavaScript is sometimes interpreted differently by different
    browsers.


    # 5. What is difference between Javascript and ECMAScript?


    JavaScript is a scripting language that has been formed by keeping ECMAScript
    specification at its core.


    ECMAScript is nothing but a standard or specification defined in order to create
    different scripting languages and one of them is Javascript.


    Javascript, Jscript and ActionScript are few scripting languages that follow ECMAScript
    specifications.


    # 6. Who developed Javascript?


    JavaScript was created in 1995 by Brendan Eich during his time at Netscape Communications.
    It was inspired by Java, Scheme and Self.


    # 7. How to insert Javascript in Web page?


    You can use <script> tag in html. <script> tag has type attribute which defined
    code is there inside the script tag.

    You can use <script> element in web pages in following ways:


    - In head element

    - In body element

    - As an external script file


    To use Javascript as a scripting language for web pages in <head> or <body> you
    can define type as "text/javascript".

    e.g.

    <script type="text/javascript">

    </script>


    Sometimes you may need to use same Javascript code in several web pages, in such
    cases you can store Javascript code in external file and save file as <filename>.js
    file.

    Then this script can be made available to web page using src attribute of <script>
    tag


    e.g.

    <script src="external file URL">

    </script>


    # 8. What are advantages of using external javascript?


    Placing JavaScript code in external js files has few advantages over inline scripts.


    Segregating HTML and JavaScript code helps to manage the code base better.


    To improve development output designers can work along with coders in parallel
    without code conflicts.

    This approach also works well with modern source code version control systems
    like GIT and SVN.

    Each of these files can maintain history.


    Segregating HTML and JavaScript makes code as well as HTML is easily readable.


    Segregated external JavaScript files are cached by browsers and can speed up page
    load times


    These small files can be minified to reduce the size and make it not readable
    by humans, using Google closure or YUI Compressor or other.


    Many popular JavaScript libraries are available as hosted on content delivery
    networks (cdn) and you can simply point to them using the URL in the src, this
    avoids copying the js file to local folder.


    Using external Js you can take benefits of advanced tools such as RequireJS or
    CommonJS to load these scripts logically and modularly


    # 9. Javascript is case sensitive language?


    Yes, Javascript is a case sensitive scripting language. Variables, functions,
    keywords must have consistent casing otherwise it will not be recognized by Javascript
    and generate error.


    e.g.


    ```

    var pratik;

    var praTik;

    ```


    In above case pratik and praTik will be considered as different variables.


    # 10. Is Semicolon compulsory in Javascript at end of the statement?


    No, it is not necessary to use semicolon at end of the statement still will be
    considered as valid statement.


    # 11. What are different data types in Javascript?


    Below are basic data types in Javascript:


    Primitive Data Types:


    - Number: Represent numeric values, both integer and float.

    - String: Sequence of characters are represented using String.

    - Boolean: Represent Boolean value, true or false.

    - Undefined: Represent undefined value.

    - Null: Represent null.


    # Non-Primitive Data Types:


    - Object: Represent more complex data structure.

    - Array: Represent group of elements.

    - RegExp: Represent regular expression.


    # 12. How to add comment?


    JavaScript provides two kinds of comments:

    Single-line comments and multiline comments.


    Single-line comments start with // and are terminated by the end of the line.


    Multiline comments are delimited by /* and */: e.g.


    ```

    /* This is

    a multiline

    comment.

    */

    ```


    # 13. What is Javascript engine?


    JavaScript engine is a computer program used to execute code. JS engines were
    developed by browser vendors and every major browser has one.


    Chrome V8 from google is most used. SpiderMonkey is developed by Mozilla. JavaScriptCore
    is Apples Safari.


    # 14. What are different frameworks that you know?


    Many frameworks are based on Javascript now, below are:


    - Angular

    - React

    - Vue

    - Node

    - Ember

    - Backbone

    - Aurelia

    - Polymer

    - Mithril


    # 15. Explain variable in Javascript.


    Basically, variable is used for temporary storage of data. It has name, memory
    address. You have to declare variable before using it.


    You can also define multiple variables using single statement as:


    - variable1, variable2, variable3;


    Value can be assigned to variable as:


    - varilename = value;


    # 16. What is var?


    The var statement declares a variable and can optionally initialize its value.


    Variables are declared using var as below:


    ```

    var var1 [= value1] [, var2 [= value2]] [ , varN [= valueN]];

    ```


    # 17. What is let?


    The ''let'' allows you to declare variables that are limited in scope to the particular
    block, expression on which it is used or statement.


    Variables are declared using let as below:


    ```

    let var1 [= value1] [, var2 [= value2]] [ , varN [= valueN]];

    ```


    # 18. What is const?


    Constants are block-scoped, much like variables defined using the let statement.
    The value of a constant cannot change through reassignment, and it can''t be re-declared.


    # 19. What is difference between let and var?


    The variable defined with var is available anywhere within the function hence
    ‘var’ keyword has function scope.


    The let has a Block Scope. A variable declared with ‘let’ has a scope only within
    that block.


    # 20. What is difference between let and const?


    ‘let’ allows you change the value of variable any number of times.


    Using ‘const’, after the first assignment of the value we cannot redefine the
    value again.


    # 21. What is automatic type conversion?


    When Javascript tries to operate on a wrong date type it will try to convert the
    value to a “right” type.


    # 22. What are operators in Javascript?


    An operator is a symbol or word which is used to perform particular operation.


    Arithmetic, Assignment, Comparison, Logical and Conditional Operators are types
    of operators.


    # 23. Explain different types of operators in Javascript.


    Below are types of operators:


    - Arithmetic operators : Arithmetic operators are used to perform arithmetic between
    variables and values. Addition (+), Subtraction (-), Multiplication (*), Division
    (/), Modulus

