    # ## 61. What is event bubbling?


    When an event bubbles on an element, it first runs the handlers on that particular
    element, after handlers on its parent elements, this happens all the way up on
    all other ancestors.


    This bubbling of events from child to parent is called event bubbling.


    A click on inner <p> first runs onclick on <p>, then on outer <div>, then on outer
    <form> and so on till document object.


    ![](img/24f7348e451430199b686a6109b6f16a_30_0.png)


    This process is called “bubbling”, because events “bubble” from the inner element
    up through parent like a bubble in the water.


    # ## 62. Is it possible to stop event bubbling?


    Yes, by using method event.stopPropagation().


    If you want to stop the event flow from event target to top element in DOM, event.stopPropagation()
    method stops the event to travel to the bottom to top.


    # ## 63. What is event capturing?'
