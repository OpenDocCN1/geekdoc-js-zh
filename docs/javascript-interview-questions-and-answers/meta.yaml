    # 78. What is prototype in javascript?


    All objects in Javascript property called as prototype, the prototype is an object
    which has a constructor properties by default.


    The prototype object is associated with every functions and objects by default
    in JavaScript, where function''s prototype property is accessible and modifiable
    and object''s prototype property is not visible.


    The prototype property allows you to add properties and methods to any object.


    e.g.

    somecustomcreationobject.prototype.age=29;


    # 79. What is prototypal inheritance?


    Object have property called as prototype which can refer to other object.


    When you want to read a property from object, and it''s missing, JavaScript automatically
    takes it from the prototype. This is called “prototypal inheritance”.


    # 80. What is difference between call() and apply()?


    The Function.prototype.call() method calls a function with a provided value and
    arguments provided individually.


    It is necessary to know arguments of function when using call() method.


    The Function.prototype.apply() method calls a function with a provided value,
    and arguments provided as an array (or an array-like object).


    It is necessary to know arguments of function when using apply() method.


    # 81. What is Promise?


    The Promise object represents the eventual completion (or failure) of an asynchronous
    operation along with its resulting value.


    A Promise is a proxy for a value which may or may not be known when the promise
    is created.'
