  md: '# # 1. Fundamentals


    # ## 1. What is Javascript?


    Javascript is basically scripting language used to make web pages more interactive
    as it can be inserted into HTML.


    Javascript is understood by all modern web browsers.


    # ## 2. What are features of Javascript?


    **Input validation** : Javascript allows you to validate user input before sending
    it to server for backend operations.


    **Control over browser** : Javascript gives more control over browser to which
    you can change the background colour of this page as well as the text on the browser''s
    status bar.


    **Detect browser and OS** : Javascript enables you to detect user''s browser and
    OS due to which you can perform platform dependant operations.


    **Handling date and time** : Javascript enables you to write code based users
    date and time, it also enables you to capture users date and time as user and
    server may be in different time zone.


    **Generating HTML on fly** : Javascript enables you to dynamically generate HTML.


    # ## 3. What are advantages of Javascript?


    **Faster speed** : JavaScript is fast because it run immediately within the client-side
    browser. Javascript is not dependant on network unless backend data is required
    to be processed. Need to compile Javascript on the client-side as it is interpreted
    directly by web browsers.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Interoperability : Javascript can be inserted into web page regardless of extension.
    Within other languages such as Perl and PHP it can be used inside the script.


    Rich interfaces : Javascript has vast libraries like (charts, drag and drop, sliders
    etc.) which enables you to provide attractive look to your website.


    Reduction in server load : Since Javascript is client-side scripting language
    it reduces load on website servers as many operations can be performed at client-side
    which reduces load on server and enables it serve to more users.


    # 4. What are disadvantages of Javascript?


    Client-side security : JavaScript code executes in users computer hence in some
    cases it can be manipulated for malicious purpose.


    Browser support : JavaScript is sometimes interpreted differently by different
    browsers.


    # 5. What is difference between Javascript and ECMAScript?


    JavaScript is a scripting language that has been formed by keeping ECMAScript
    specification at its core.


    ECMAScript is nothing but a standard or specification defined in order to create
    different scripting languages and one of them is Javascript.


    Javascript, Jscript and ActionScript are few scripting languages that follow ECMAScript
    specifications.


    # 6. Who developed Javascript?


    JavaScript was created in 1995 by Brendan Eich during his time at Netscape Communications.
    It was inspired by Java, Scheme and Self.


    # 7. How to insert Javascript in Web page?'
