    `prompt()` 方法接受两个参数：显示给用户的文本以及文本框的默认值（如果你需要，可以为空字符串）。以下代码行将显示对应的窗口：

    `prompt("Enter the country","USA");`


    ![](img/24f7348e451430199b686a6109b6f16a_41_0.png)


    ## 87. 如何跳转到其他网页？


    在 JavaScript 中，可以通过直接给 `window.location` 赋值，或使用 `location.assign()`、`location.replace()`
    和 `location.reload()` 方法跳转到其他网页。


    ## 88. 什么是 Navigator 对象？


    navigator 对象用于获取浏览器信息，如名称、版本、类型、语言。它拥有 `javaEnabled()` 和 `taintedEnabled()` 等方法。


    ## 89. 如何识别客户端设备的操作系统？


    使用“Navigator.appVersion”来查找客户端设备的操作系统。


    ## 90. 什么是 History 对象？


    History 对象由用户在浏览器中访问过的 URL 数组组成。


    History 对象提供了 `back()`、`forward()` 和 `go()` 等方法。


    ## 91. 如何通过代码加载浏览器的上一页？


    可以使用 `history.back()` 通过代码加载浏览器的上一页。


    ## 92. 如何通过代码加载浏览器的下一页？


    可以使用 `history.forward()` 通过代码加载浏览器的下一页。


    ## 93. history 对象的 go 方法是什么？


    `go()` 方法从历史记录列表中加载特定的 URL。

    `history.go(number|URL)`


    `number|URL` 参数可以是数字（跳转到特定位置的 URL，1 表示前进一页，-1 表示后退一页），也可以是字符串。字符串必须是部分或完整的 URL，函数将跳转到匹配该字符串的第一个
    URL。


    ## 94. 什么是 Screen 对象？


    Screen 对象包含了关于显示屏的信息，如屏幕的高度、宽度和色彩位深。


    ## 95. 什么是 Location 对象？


    Location 对象包含了关于 window 对象中当前 URL 的信息。

    Location 对象提供了 `assign()`、`reload` 和 `replace()` 等方法。


    ## 96. 如何打印网页？


    调用 `window.print()` 时，会打印当前网页。


    ## 7. 文档对象模型 (DOM)


    ## 97. 什么是 Document 对象？


    Document 对象代表在窗口中显示的 HTML 文档。Document 对象拥有属性，允许访问和修改文档内容。


    访问和修改文档的方式被称为文档对象模型或 DOM。


    Document 对象提供了 `open()`、`close()`、`write()`、`getElementById()`、`getElementsByByName()`、`getElementTagName()`
    等方法。


    ## 98. 什么是 DOM？


    文档对象模型 (DOM) 以一种方式表示 HTML 或 XML 页面，使得程序可以更改文档的结构、内容和样式。


    DOM 代表文档节点也代表对象。


    DOM 是网页的面向对象的表示，可以通过 JavaScript 等脚本语言进行修改。


    ## 99. 什么是 DOM 节点？


    根据 W3C HTML DOM 标准，HTML 中的一切内容都可以表示为节点。


    文档节点（Document node）代表整个文档。


    元素节点（Element node）代表每个 HTML 元素，如 `HTML`、`HEAD`、`BODY`、`A`、`H1` 等。


    文本节点（Text node）代表元素内部的文本。


    属性节点（Attribute node）代表每个 HTML 属性。


    节点（Node）拥有包含节点相关信息的节点属性。


    `nodeValue` 属性指定节点的值。


    `nodeType` 属性指定节点的类型。


    ![](img/24f7348e451430199b686a6109b6f16a_44_0.png)


    ## 100. 如何在 DOM 中通过 id 获取元素？


    可以使用 document 对象的 `getElementById()` 方法通过 id 获取元素。


    例如：


    ```javascript

    document.getElementById("myUniqueId");

    ```


    ## 101. 如何在 DOM 中通过 class 获取元素？


    可以使用 document 对象的 `getElementsByClassName()` 方法通过 class 获取元素。


    例如：


    ```javascript

    document.getElementsByClassName("myClass");

    ```


    ## 102. 如何获取任何元素的内容？


    `innerHTML` 属性对于获取或替换 HTML 元素的内容。


    ## 103. 什么是 DOM 级别？


    W3C DOM 规范分为不同的级别，每个级别包含一些必选模块和可选模块。


    Level 1：核心 DOM。


    Level 2：增加了对 CSS 的支持和更多功能。


    Level 3：增加了验证和更多功能。


    ## 104. 什么是延迟脚本？


    `defer` 属性允许脚本在 HTML 文档完全解析后执行。


    ```html

    <script src="script.js" defer></script>

    ```


    ## 105. 什么是异步脚本？


    `async` 属性允许脚本在下载完成后立即执行。


    ```html

    <script src="script.js" async></script>

    ```


    ## 106. 属性（attribute）和属性（property）之间有什么区别？


    Attributes 是定义在 HTML 标记中的，如 `id` 或 `class`。


    Properties 是 DOM 对象的一部分，如 `value` 或 `checked`。


    ## 107. innerHTML 和 innerText 有什么区别？


    `innerHTML` 返回元素内部的标记，包括标签。


    `innerText` 返回元素的文本内容，并会考虑 CSS 样式。


    ## 108. textContent 和 innerText 有什么区别？


    `textContent` 返回所有元素的文本，包括隐藏的元素。


    `innerText` 会感知样式且不会返回隐藏的文本。


    ## 109. 什么是 HTMLCollection？


    HTMLCollection 接口表示元素（按文档顺序）的通用集合，并提供了用于从中选择的方法和属性。


    HTMLCollection 拥有 `length` 属性，返回集合中的项目数量。


    无法使用 `foreach` 遍历 HTMLCollection 列表。


    ## 110. 什么是 NodeList？


    NodeList 对象是节点集合，通常由 `childNodes` 等属性和 `querySelectorAll()` 等函数返回。


    NodeList 拥有 `length` 属性，返回节点的数量。


    使用 `for...of` 循环可以遍历 NodeList。


    ## 111. 什么是帧（frames）？


    Frame 将页面划分为若干部分，在每个部分中可以显示不同的页面。


    ## 8. Cookies


    Cookies 是很小的数据项，由名称和值对组成。它们存储在你的计算机上，以便你的网络浏览器访问。


    网络浏览器和服务器通过 HTTP 协议进行通信。这种无状态协议独立地处理每个请求，因此服务器在将数据发送给浏览器后不会保留数据。通过 Cookie，这些数据可以从存储的
    cookie 文件中获取，而不是与服务器通信。


    例如，当用户访问网页时，可以将用户名存储在 cookie 中。现在当用户下次访问该页面时，属于该页面的 cookie 会被添加到请求中。


    ## 112. Cookie 如何帮助客户端服务器之间的 HTTP 通信？


    当用户向服务器发送请求时，每个该请求都会被视为由不同用户发送的新请求。


    在接收 HTTP 请求时，服务器可能在响应中发送一个 `Set-Cookie` 头部。


    现在，每当用户向服务器发送请求时，cookie 都会自动添加到该请求中。由于 cookie 的存在，服务器可以识别用户。

