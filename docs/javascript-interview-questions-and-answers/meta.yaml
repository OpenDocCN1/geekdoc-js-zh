    \n但但 ‘==’ 运算符测试严格相等，即它不会进行类型转换，因此如果两个值不是同一类型，比较时它将返回 false。\n\n## 28. 什么是 typeof\
    \ 运算符？\n\ntypeof 运算符用于获取其操作数的数据类型。操作数可以是字面量或数据结构，如变量、函数或对象。\n\n例如：\n\n```\nconsole.log(typeof\
    \ somevar);\n```\n\ntypeof 运算符返回以下字符串值：object, Boolean, function, number, string\
