  mdcn: "\n# 114. Cookie 存储在哪里？\n\n在浏览会期间，浏览器将 Cookie 存储在内存中，在退出时，它们会进入名为 `cookies.txt`\
    \ 的文件。\n\n不同的浏览器会将 Cookie 文件存储在磁盘的不同位置。\n\n例如，在 Windows 系统上，Chrome 将 Cookie 存储以下位置：`C:\\\
    Users\\YourUser\\AppData\\Local\\Google\\Chrome\\User\\Default\\`\n\n当 Cookie\
    \ 过期后，它将不再保存在硬盘上。\n\n# 115. Cookie 的参数有哪些？\n\nCookie 有六个参数：名称（name）、值（value）、过期（expires）、路径（path）、域名（domain）和安全性（security）。\n\
    \n名称和值是必须的，而其他其他参数都是可选的。\n\n```\ndocument.cookie=\"name=VALUE;expires=DATE;path=PATH;domain=DOMAIN;secure\"\
    ;\n```\n\n**Name and Value**：Cookie 的第一部分必须包含名称和值。整个名称/值必须是一个单一字符串，不能包含逗号、分号或空白字符。\n\
    \n**Expires**：用户退出浏览器时，Cookie 会消失。为了让 Cookie 保存得久一点，你必须按照以下格式设置过期日期：\n\nDD-Mon-YY\
    \ HH:MM:SS GMT\n\n**Path**：通常路径被设置为根级目录（'/'），这意味着该 Cookie 适用于你网站的所有页面。如果你希望 Cookie\
    \ 在特定目录 `<directoryname>` 中是可的，则路径应指定为 `path/<directoryname>`。\n\n**Domain**：某些网站有许多域名。“domain”参数的目的是允许\
    \ Cookie 用于其他域名。在情况下，如果网站是 `http://www.<domain>.com`，拥有子域名 `http://www.<subdomainaine>.<domain>.com`\
    \ 和 `http://www.<subdomaintwo>.<domain>.com`，访问 `subdomainaine` 页面设置的 Cookie，`subdomaintwo`\
    \ 页面将无法读取。但如果你添加 `domain=<domain>`，则所有以 `<domain>` 结尾的域名都可以读取该 Cookie。\n\n**Secure**：Cookie\
    \ 的最后一个参数是 secure，这是一个布尔值。如果 Cookie 被标记为 secure，则 Cookie 将发送到 Web 服务器，并尝试使用安全通信通道进行检索。\n\
    \n# 116. 用户可以禁用 Cookie 吗？\n\n是的，用户可以从浏览器禁用 Cookie。\n在 Chrome 中，你可以进入：设置 --> 高级设置\
    \ --> 隐私和安全 --> 内容设置 --> Cookie 并禁用 Cookie。\n\n# 117. 如何创建 Cookie？\n\n当访问者第一次访问网页时，他输入自己的姓名。该名称将如下所示存储在\
    \ Cookie 中：\n\n```\nfunction createCookie(username, value) {\n  document.cookie=username\
    \ + \"=\" + value;\n}\n```\n\n# 118. 如何读取 Cookie？\n\n可以像这样读取 JavaScript Cookie：\n\
    `var x = document.cookie;`\n\n# 119. 如何删除 Cookie？\n\n删除 Cookie 时，不需要指定值。\n通过将\
    \ `expires` 参数设置为过去的日期，可以删除 JavaScript Cookie。\n`document.cookie=\"username; expires=Thu,\
    \ 01 Jan 1970 00:00:00 UTC; path /=\";`\n如果不指定路径，某些浏览器将不允许你删除 Cookie。\n\n# 120.\
    \ 本存储（Local Storage）和话存储（Session Storage）有什么区别？\n\n**Local Storage**：对于每个 HTTP\
    \ 请求，数据都不会发送回服务器（HTML、图像、JavaScript、CSS 等），从而减少了客户端和服务器之间的总流量。数据将一直保留，直到通过设置或程序手动清除。\n\
    **Session Storage**：类似于本地存储；唯一区别在于存储在本地存储中的数据没有过期时间，而存储在会存储中的数据会在会话结束时清除。浏览器关闭时，Session\
    \ Storage 会清除。\n\n# 9. 表单验证（Form validation）\n\n121. 什么是表单验证？\n\n表单验证验证表单中的所有字段是否按照要求的格式填写。\n\
    \n如果用户输入的数据不符合格式，则向用户显示相应的错误信息。\n\n表单可以使用服务端验证和客户端验证进行校验。\n\n服务端验证更安全，且需要服务器连接进行验证；而客户端验证速度更快，不需要服务器连接，但安全性较低。\n\
    \nJavascript 用于客户端验证。\n\n客户端验证的优点是：它可以节省时间、减轻服务器负载，并可以在表单提交之前验证表单元素。\n\n122. 什么是\
    \ required 属性？\n\nHTML 元素中的 `required` 属性防止元素作为空值提交。\n\n123. 什么是 pattern 属性？\n\
    \n`pattern` 属性允许你指定一个正则表达式。如果值不匹配，则表单无法提交。\n"
