    ```\nfunction createCookie(username, value) {\n  document.cookie=username + \"\
    =\" + value;\n}\n```"
  - '[PAGE 52]


    # 118. How to read cookie?


    Javascript cookies can be read like this,

    var x = document.cookie;


    # 119. How to delete cookie?


    While deleting cookie you don''t have to specify value.

    Javascript cookies can be deleted by specifying expires parameter to a past date.

    ocument.cookie="username; expires=Thu, 01 Jan 1970 00:00:00 UTC; path /=";

    Some browsers will not let you delete cookie if you don''t specify the path.


    # 120. What is difference between local storage and session storage?


    Local Storage : For every HTTP request, the data is not sent back to the server
    (HTML, images, JavaScript, CSS, etc) reducing the total traffic between client
    and server. Data will stay until it is manually cleared using settings or through
    program.

    Session Storage : It is similar to local storage; the only difference is data
    stored in local storage has no expiration time whereas data stored in session
    storage gets cleared when the page session ends. Session Storage gets cleared
    when the browser is closed.'
  - '[PAGE 53]


    # 9. Form validation


    121. What is form validation?


    Form validation verifies whether all fields in form are filled according to required
    format.


    If data entered by user is not according to format then appropriate error message
    is displayed to the user.


    Forms can be validated using server-side as well as client-side validations.


    Server-side validation is more secure and required server connection to validate,
    whereas client-side validation is quicker and doesn''t require server connection
    but it is less secure.


    Javascript is used for client side validation.


    Advantages of client side validation is that, it saves time, reduces load on server
    and can validate form element even before form is submitted.


    122. What is required attribute?


    The required attribute in HTML element prevents element being submitted as blank.


    e.g.


    ```

    <input type="text" name="employename" required>

    ```


    In above case, as long as text field employee is blank form submission will be
    prevented.


    123. What is pattern attribute?


    The pattern attribute specifies a regular expression against which elements value
    is checked.


    If element value does not match the regex pattern form submission will be prevented.


    e.g


    ```

    <input type="text" name="employename" pattern="[A-Za-z]">

    ```'
