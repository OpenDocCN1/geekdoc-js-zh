    # 19. What is difference between let and var?


    The variable defined with var is available anywhere within the function hence
    ‘var’ keyword has function scope.


    The let has a Block Scope. A variable declared with ‘let’ keyword has a scope
    only with in that block.


    # 20. What is difference between let and const?


    ‘let’ allows you change the value of variable any number of times.


    Using ‘const’, after the first assignment of the value we cannot redefine the
    value again.


    # 21. What is automatic type conversion?


