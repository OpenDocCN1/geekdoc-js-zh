  md: '# 2. Variables, Operators and Statements


    # 15. Explain variable in Javascript.


    Basically, variable is used for temporary storage of data. It has name, value
    and memory address. You have to declare variable before using it for storing data.
    Below is syntax to declare variable:


    var varilename;


    Here var is keyword and varilename is name of the variable.


    You can also define multiple variables using single statement as:


    +   - var variable1, variable2, variable3;


    +   - Value can be assigned to variable as:


    +   - var varilename = value;


    # 16. What is var?


    The var statement declares a variable and can also optionally initialize its value.


    Variables are declared using var as below,


    ```

    var varname1 [= value1] [, varname2 [= value2] ... [, varnameN [= valueN]]

    ```


    # 17. What is let?


    The ''let'' allows you to declare variables that are limited in scope to the particular
    block, expression on which it is used or statement.


    Variables are declared using let as below,


    ```

    let var1 [= value1] [, var2 [= value2]] [ , ..., varN [= valueN];

    ```


    # 18. What is const?


    Constants are block-scoped, much like variables defined using the let statement.
    The value of a constant cannot change through'
