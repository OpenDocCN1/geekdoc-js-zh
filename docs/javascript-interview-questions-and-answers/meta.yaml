    # 6. Browser Object Model


    # 82. What is Browser Object Model?


    The browser object model (BOM) is a hierarchy of browser objects that are used
    to manipulate methods and properties associated with the Web browser itself.


    The default object of browser is window means you can invoke all the functions
    of window by specifying window or directly


    Objects that make up the BOM include the window object, navigator, screen object,
    location object, history, and the document object.


    # 83. What is Window Object?


    In a tabbed browser, each tab is represented as Window object.


    Every object, variable, and function defined in a web page uses uses of the window
    as its Global object.


    Window object provides methods like alert(), blur(), close(), confirm(), print(),
    prompt(), open().


    # 84. What alert method in window object?


    Alert dialogs are typically used when users have to be aware of something that
    they have no control over, such as errors.


    Often alert dialog pops up when the user enters invalid data into a form.


    When alert() is called, the browser creates a system message box that displays
    the given text with an OK button.


    For example, the following line of code causes the message box in to be displayed:


    ```

    alert("Your error message!!!");

    ```'
