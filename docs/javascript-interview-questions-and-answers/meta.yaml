    # 1. 基础


    ## 1. 什么是 Javascript？


    Javascript 基本上是一种脚本语言，由于它可以插入 HTML 中，因此使网页更具交互性。


    所有现代网络浏览器都能识别 Javascript。


    ## 2. Javascript 有哪些特性？


    **输入验证**：Javascript 允许你在将用户输入发送到服务器进行后端操作之前对其进行验证。


    **控制浏览器**：Javascript 提供了对浏览器的更多控制，你可以更改此页面的背景颜色以及浏览器状态栏上的文本。


    **检测浏览器和操作系统**：Javascript 能够让你你检测用户的浏览器和操作系统，因此你可以执行依赖于平台的操作。


    **处理日期和时间**：Javascript 允许你根据用户的日期和时间编写代码，它还允许你获取用户的日期和时间，因为用户和服务器可能处于不同的时区。


    **动态生成 HTML**：Javascript 允许你动态生成 HTML。


    ## 3. Javascript 有哪些优势？


    **速度快**：JavaScript 运行很快，因为它在客户端浏览器中立即运行。除非需要处理后端数据，否则 Javascript 不依赖于网络。由于它被网络浏览器直接解释，因此在客户端不需要编译
    Javascript。


    **互操作性**：无论扩展名如何，Javascript 都可以插入到网页中。在 Perl 和 PHP 等其他语言中，可以在脚本内部使用。


    **丰富的接口**：Javascript 拥有大量的库（如图表、拖放、滑块等），这让你能够为你的网站提供吸引人的外观。


    **减轻服务器负载**：由于 Javascript 是客户端脚本语言，它减轻了网站服务器的负载，因为许多操作可以在客户端完成，从而减轻了服务器负载并使其为更多用户提供服务。


    # 4. Javascript 有哪些缺点？


    **客户端安全**：JavaScript 代码在用户的计算机上执行，因此在某些情况下它可能会被出于恶意目的操纵。


    **浏览器支持**：JavaScript 有时会被不同的浏览器以不同的方式解释。


    # 5. Javascript 和 ECMAScript 之间有什么区别？


    JavaScript 是一种脚本语言，它是以 ECMAScript 规范为核心形成的。


    ECMAScript 无非是为了创建不同的脚本语言而定义的标准或规范，其中之一就是 Javascript。


    Javascript、Jscript 和 ActionScript 是遵循 ECMAScript 规范的脚本语言。


    # 6. 谁开发了 Javascript？


    JavaScript 是 Brendan Eich 在 1995 年于 Netscape Communications 期间创建的。它的灵感源于 Java、Scheme
    和 Self。


    # 7. 如何在网页中插入 Javascript？


    你可以在 html 中使用 `<script>` 标签。<script>` 标签有一个 `type` 属性，用于定义标签内部的代码类型。

    你可以通过以下方式在网页中使用 `<script>` 元素：


    - 在 head 元素中

    - 在 body 元素中

    - 作为外部脚本文件


    在 `<head>` 或 `<body>` 中使用 Javascript 作为网页的脚本语言时，你可以将 type 定义为 "text/javascript"。

    例如：

    <script type="text/javascript">

    </script>


    有时，你可能需要在多个网页中使用相同的 Javascript 代码，在这种情况下，你可以将 Javascript 代码存储在外部文件中并保存为 `<filename>.js`
    文件。

    然后可以使用 `<script>` 标签的 `src` 属性为网页提供此脚本


    例如：

    <script src="external file URL">

    </script>


    # 8. 使用外部 javascript 有哪些优势？


    将 JavaScript 代码放置在外部 js 文件中比内联脚本有几个优势。


    分离 HTML 和 JavaScript 代码有助于更好地管理代码库。


    为了提高开发输出，设计人员可以与编码并行工作而不会发生代码冲突。

    这种方法也适用于 GIT 和 SVN 等现代源代码版本控制系统。

    这些中的每个文件都可以维护历史。


    分离 HTML 和 JavaScript 使代码以及 HTML 变得易于阅读。


    分离的外部 JavaScript 文件会被浏览器缓存并可以加快页面加载速度。


    这些小文件可以进行最小化以减小大小并使其人类无法阅读，可以使用 Google closure 或 YUI Compressor 等工具。


    许多流行的 JavaScript 库托管在内容分发网络 (cdn) 上，你只需使用 src 中的 URL 指向它们，这避免了将 js 文件复制到本地文件夹。


    使用外部 Js，你可以利用 RequireJS 或 CommonJS 等高级工具逻辑化和模块化地加载这些脚本


    # 9. Javascript 是大小敏感语言吗？


    是的，Javascript 是一种大小敏感的脚本语言。变量、函数、关键字必须具有一致的大小，否则 Javascript 将无法识别并产生错误。


    例如：


    ```

    var pratik;

    var praTik;

    ```


    在上述情况下，pratik 和 praTik 被视为不同的变量。


    # 10. Javascript 语句末尾的分号是强制的吗？


    不是，在语句末尾没有使用分号，但仍被视为有效语句。


    # 11. Javascript 有哪些不同的数据类型？


    以下是 Javascript 中的基本数据类型：


    原始数据类型：


    - Number：代表数值，包括整数和浮点数。

    - String：使用 String 表示的字符序列。

    - Boolean：表示布尔值，true 或 false。

    - Undefined：表示未定义值。

    - Null：表示空。


    # 非原始数据类型：


    - Object：表示更复杂的数据结构。

    - Array：表示元素组。

    - RegExp：表示正则表达式。


    # 12. 如何添加注释？


    JavaScript 提供了两种类型的注释：

    单行注释和多行注释。


    单行注释以 `//` 开始，并以行尾结束。


    多行注释由 `/*` 和 `*/` 分隔：例如：


    ```

    /* 这是一个

    多行

    注释。

    */

    ```


    # 13. 什么是 Javascript 引擎？


    JavaScript 引擎是用于执行代码的计算机程序。JS 引擎由浏览器厂商开发，每个种浏览器浏览器都有一个。


    谷歌的 Chrome V8 使用最多。SpiderMonkey 由 Mozilla 开发。JavaScriptCore 是苹果 Safari 的内核。


    # 14. 你知道哪些不同的框架？


    现在有很多框架基于 Javascript，以下是：


    - Angular

    - React

    - Vue

    - Node

    - Ember

    - Backbone

    - Aurelia

    - Polymer

    - Mithril


    # 15. 解释 Javascript 中的变量。


    基本上，变量用于临时的临时存储。它有名称、内存地址。你必须在使用变量之前对其进行声明。


    你也可以使用单条语句定义多个变量，如：


    - variable1, variable2, variable3;


    可以将值赋值给变量如下：


    - varilename = value;


    # 16. 什么是 var？


    `var` 语句声明一个变量并可以可选地初始化其值。


    使用 `var` 声明变量如下：


    ```

    var var1 [= value1] [, var2 [= value2]] [ , varN= valueN]];

    ```


    # 17. 什么是 let？


    ''let'' 允许你声明范围限于特定块、表达式或语句的变量。


    使用 `let` 声明变量如下：


    ```

    let var1 [= value1] [, var2 [= value2]] [ , varN [= valueN]];

    ```


    # 18. 什么是 const？


    常量是块范围的，与使用 let 语句定义的变量一样。常量的值不能通过重新赋值更改，且不能重复声明。


    # 19. let 和 var 之间有什么区别？


    使用 `var` 定义的变量在函数范围内任何可用，因此 `var` 关键字具有函数作用域。


    `let` 具有块作用域。使用 `let` 声明的变量作用域仅限于该块。


    # 20. let 和 const 之间有什么区别？


    `let` 允许你多次变量的值。


    使用 `const` 在第一次赋值后我们无法再次定义该值。


    # 21. 什么是自动类型转换？


    当 Javascript 尝试对错误的数据类型进行操作时，它会尝试将值转换为“正确”类型。


    # 22. Javascript 中的运算符是什么？


    运算符用于执行特定操作的符号或单词。


    算术、赋值、比较、逻辑和条件运算符是运算符的类型。


    # 23. 解释 Javascript 中不同的运算符。


    以下是运算符的类型：


    - 算术运算符：算术运算符用于在变量和值之间执行算术运算。加 (+)、减 (-)、乘 (*)、除 (/)、取模 (%)


    '
