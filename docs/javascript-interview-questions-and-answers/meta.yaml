    The prompt() method accepts two arguments: the text to display to the user and
    the default value for the text box (which can be an empty string if you so desire).
    The following line results in the window displayed:

    prompt("Enter the country","USA");


    ![](img/24f7348e451430199b686a6109b6f16a_41_0.png)


    ## 87. How to redirect other webpage?


    It is possible to redirect to other webpage in javascript by directly assigning
    value to window.location or by using location.assign(), location.replace() and
    location.reload() methods.


    ## 88. What is Navigator Object?


    The navigator object is used to get browser information like name, version, type,
    language. It has methods like javaEnabled() and taintedEnabled().


    ## 89. How to identify operating system of client device?


    “Navigator.appVersion” is used to find operating system of client device.


    ## 90. What is History Object?


    The History object consist of array of URLs which are visited by a user in browser.


    History object provides method like back(), forward() and go().


    ## 91. How to load previous page in browser programmatically?


    history.back() can be used to load previous page in browser through code.


    ## 92. How to load next page in browser programmatically?


    history.forward() can be used to load next page in browser through code.


    ## 93. What is go method of history object?


    The go() method loads a specific URL from the history list.

    history.go(number|URL)


    number|URL parameter can either be a number which goes to the URL within the specific
    position (1 goes forward one page, -1 goes back one page), or a string. The string
    has to be a partial or full URL, and the function will go to the first URL that
    matches the string.


    ## 94. What is Screen Object?


    The Screen object consist of information about display screen like height, width
    and colour bits of screen.


    ## 95. What is Location Object?


    The Location object consist of information about current URL of window object.

    Location object provides methods like assign(), reload and replace().


    ## 96. How to print a web page?


    The window.print() will print the current web page when invoked.


    ## 7. Document Object Model


    ## 97. What is Document Object?


    The Document object represents HTML document that is displayed in window. Document
    object has properties which allows access and modification of document content.


    The way document is accessed and modified is called Document Object Model or DOM.


    Document object provides methods like open(), close(), write(), getElementById(),
    getElementByName(), getElementByTagName().


    ## 98. What is DOM?


    The Document Object Model (DOM) represents HTML or XML page in such a way that
    programs can change document structure, content and style.


    The DOM represents the document nodes as well as objects.


    The DOM is object oriented representation of web page, which can be modified by
    scripting language like Javascript.


    ## 99. What are DOM nodes?


    According to the W3C HTML DOM standards, everything in HTML can be represented
    as nodes.


    Document node represents whole document.


    Element node represents every HTML element such as HTML, HEAD, BODY, A, H1 etc.


    Text node represents text content inside the element.


    Attribute node represents every HTML attribute.


    Node has node properties that contain information about the node.


    The nodeValue property specifies value of the node.


    The node property specifies type of the node.


    ![](img/24f7348e451430199b686a6109b6f16a_44_0.png)


    ## 100. How to get element with id in DOM?


    The getElementById() method of document object can be used to get element using
    id.


    e.g.


    ```javascript

    document.getElementById("myUniqueId");

    ```


    ## 101. How to get element using class in DOM?


    The getElementClassName() method of document object can be used to get element
    using class.


    e.g.


    ```javascript

    document.getElementsByClassName("myClass");

    ```


    ## 102. How to get content of any element?


    The innerHTML property is useful for getting or replacing the content of HTML
    elements.


    ## 103. What are DOM levels?


    The W3C DOM specifications are divided into different levels where each level
    contain some required and optional modules.


    Level 1: The core DOM.


    Level 2: Adds support for CSS and more features.


    Level 3: Adds validation and more.


    ## 104. What are deferred scripts?


    The defer attribute allows the script to be executed after the HTML document has
    been fully parsed.


    ```html

    <script src="script.js" defer></script>

    ```


    ## 105. What are asynchronous scripts?


    The async attribute allows the script to be executed as soon as it is finished
    downloading.


    ```html

    <script src="script.js" async></script>

    ```


    ## 106. What is the difference between attribute and property?


    Attributes are defined in the HTML markup, like id or class.


    Properties are part of the DOM object, like value or checked.


    ## 107. What is the difference between innerHTML & innerText?


    innerHTML returns the markup inside the element, including tags.


    innerText returns the text content of the element, considering CSS styling.


    ## 108. What is the difference between textContent & innerText?


    textContent returns the text of all elements, including hidden ones.


    innerText is aware of styling and won''t return hidden text.


    ## 109. What is HTMLCollection?


    The HTMLCollection interface represents a generic collection of elements (in document
    order) and offers methods & properties for selecting from.


    HTMLCollection has length property which returns the number of items in the collection.


    It is not possible to iterate over HTMLCollection list using foreach.


    ## 110. What is NodeList?


    NodeList objects are collections of nodes which are usually returned by properties
    such as childNodes and functions such as querySelectorAll().


    NodeList has length property which returns the number of nodes.


    for...of loops will loop over NodeList.


    ## 111. What are frames?


    Frame divides page into section and in each section different page can be displayed.


    ## 8. Cookies


    Cookies are small items of data that consist of name and value pair. They are
    stored on your computer so that it can be accessed by your web browser.


    A web browser and server communicate through HTTP which is protocol. Stateless
    protocol treats each request independently, so server does not keep data after
    sending it to browser. With cookies such data can be fetched from stored cookie
    file instead of communicating with server.


    For example when user visits web page, user name can be stored in cookie. Now
    when next time user visits the page cookie belonging to the page is added to the
    request.


    ## 112. How cookie helps client server HTTP communication?


    When a user sends a request to the server, each of that request is treated as
    a new request sent by the different user.


    When receiving an HTTP request, a server can possibly send a Set-Cookie header
    with the response.


    Now, whenever a user sends a request to the server, the cookie is added with that
    request automatically. Due to the cookie, the server recognizes the user.'
