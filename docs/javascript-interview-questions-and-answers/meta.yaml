    # 10. Error and Exception Handling


    # 131. What is error object?


    When an exception occurs, an object representing the error is constructed and
    thrown.


    The Error constructor creates an error object.


    When runtime errors occur, instances of Error objects are thrown as a base object
    for user-defined exceptions.


    ```

    var error = new Error("error message");

    ```


    "Error" objects contain two properties, "name" and "message". The "name" property
    specifies the type of exception The "message" property provides a more detailed
    description of the exception.


    The "message" gets its value from the string passed to the constructor of exception.


    # 132. What are different error types in Javascript?


    Below are primary error types in javascript:


    +   * SyntaxError : Raised when syntax error occurs while parsing the Javascript
    code.


    +   * RangeError : Raised when numeric value exceeds allowed range.


    +   * EvalError : Raised when the eval() function is used in an incorrect manner.


    +   * ReferenceError : Raised when an invalid reference is used


    +   * TypeError : Raised when type of variable is not as expected.


    +   * URIError : Raised when the encodeURI() or decodeURI() functions are used
    in an inaccurate manner.


    +   * InternalError : Raised when internal error in the javascript engine is thrown.'
- md: "\n## 133. How to handle exceptions in JavaScript?\n\nJavaScript uses the try...catch...finally\
    \ statement as well as the throw operator to handle exceptions.\n\nYou can catch\
    \ user-defined runtime exceptions, but you cannot catch JavaScript syntax errors.\n\
    \n## 134. Explain try...catch...finally.\n\n**Try** : wraps spaghetti code that\
    \ may throw an error in catch block.\n\n**Catch** : Write code to do something\
    \ when error occurs in catch block. The catch block can have parameters which\
    \ will give you error information. Usually, catch block is used to log an error\
    \ or display specific messages to the user.\n\n**Finally** : code in finally block\
    \ will always be executed regardless of the occurrence of an error. The finally\
    \ block is usually used to complete the remaining task or reset variables that\
    \ might have changed before error occurred in try block.\n\n## 135. How to throw\
    \ exceptions programmatically?\n\nIt is possible to throw exceptions programmatically\
    \ using “throw\" statement.\n\nThere is no restriction on data type that can be\
    \ thrown as an exception. e.g.\n\n```\nthrow \"error occurred!\";\nthrow new SyntaxError(\"\
    syntax error occurred!\");\n```\n\n## 11. Debugging\n\n## 136. What is debugging?\n\
    \nDebugging is the process of detecting and fixing existing and potential errors\
    \ in software code that can cause it to behave unexpectedly.\n\nTo debug a program,\
    \ programmer has to start with problem, identify source of the problem and then\
    \ fix it.\n\nSometimes it takes more time debugging a program than coding it.\n\
    \n## 137. What is debugger keyword?\n\nDebugger statement stops the execution\
    \ of Javascript. If debugging functionality is not available, this statement has\
    \ no effect.\n\nDebugger keyword is like breakpoint in script source code.\n\n\
    e.g.\n\n```\nfunction someErroneousFunction() {\n    debugger;\n    code;\n}\n\
    ```\n\n## 138. What is console object?\n\nConsole object provides access to browsers\
    \ debugging console.\n\nIf browser supports debugging you can use console.log()\
    \ method to display required text in debugging window.\n\nConsole object provides\
    \ methods like debug(), log(), error(), info(), trace(), warn() which are useful\
    \ for code debugging.\n\n## 139. How to activate debugging in browser?\n\nYou\
    \ can activate debugging in browser by pressing F12 and then select console in\
    \ debugger menu.\n\n## 140. How to get mobile devices view of webpage in desktop\
    \ browser?\n\nIn browser press F12,\nThen click on toggle device toolbar,\n\n\
    ![](img/24f7348e451430199b686a6109b6f16a_60_0.png)\n\nThen, select device for\
    \ which you want webpage view.\n\n![](img/24f7348e451430199b686a6109b6f16a_60_1.png)\n\
    \n## 141. How to deactivate breakpoint in browser?\n\nThis can be done by clicking\
    \ on “deactivate breakpoints” icon in “Sources\" tab of browser developer tool.\n\
    \n![](img/24f7348e451430199b686a6109b6f16a_60_2.png)\n\n## 142. How to pause script\
    \ execution?\n\nThis can be done by clicking on \"pause script execution\" icon\
    \ in \"Sources\" tab of browser developer tool.\n\n## 143. How to execute function\
    \ line by line while debugging?\n\nThis can be done by clicking on \"Step into\
    \ next function call\" icon in \"Sources\" tab of browser developer tool.\n\n\
    ![](img/24f7348e451430199b686a6109b6f16a_61_0.png)\n\n## 144. How to execute function\
    \ without stepping into it while debugging?\n\nThis can be done by clicking on\
    \ \"Step over next function call\" icon in \"Sources\" tab of browser developer\
    \ tool.\n\n![](img/24f7348e451430199b686a6109b6f16a_61_1.png)\n\n## 145. What\
    \ is code smell?\n\nIn computer programming, a code smell is any characteristic\
    \ in the source code of a program which possibly indicates a deeper problem.\n\
    \nDetermining what is a code smell and what is not a code smell is subjective,\
    \ and varies by language, developer, and development methodology.\n\nThe two main\
    \ known open source tools used for JavaScript code analysis are ESLint and JSHint.\n\
    \n## 12. AJAX\n\n## 146. What is AJAX?\n\nAJAX stands for Asynchronous JavaScript\
    \ and XML. It allows to exchange data with a server without reloading the page.\n\
    \n## 147. What difference between GET and POST?\n\n| GET | POST |\n|---|---|\n\
    | History: Parameters remain in history. | Parameters are not saved in browser\
    \ history. |\n| Security: GET is sent as URL. | POST is more secure than GET.\
    \ |\n| Caching: Can be cached. | Not cached. |\n\n## 148. What is XMLHttpRequest\
    \ object?\n\nXMLHttpRequest object is used for asynchronous communication between\
    \ client and server. It provides methods like open(), send(), setRequestHeader().\n\
    \n## 149. How to make GET call using AJAX?\n\nTo make GET call in AJAX, you first\
    \ need to initialize a new XMLHttpRequest().\n\nSpecify URL endpoint, HTTP method\
    \ (GET) to open() method of XMLHttpRequest object.\n\nThen call send() to hit\
    \ the request.\n\nReceive the response using XMLHttpRequest.onreadystatechange.\n\
    \ne.g.\n\n```javascript\nconst xhr = new XMLHttpRequest();\nxhr.open(\"GET\",\
    \ \"http://some.domain.com/method\");\nxhr.send();\nxhr.onreadystatechange = (event)\
    \ => {\n  console.log(xhr.responseText);\n};\n```\n\n## 150. How to make POST\
    \ call using AJAX?\n\nTo make POST call in AJAX, you first need to initialize\
    \ a new XMLHttpRequest().\n\nSpecify URL endpoint, HTTP method (POST) to open()\
    \ method of XMLHttpRequest object.\n\nThen call send() and pass data to send()\
    \ method to hit the request.\n\nReceive the response using XMLHttpRequest.onreadystatechange.\n\
    \ne.g.\n\n```javascript\nconst xhr = new XMLHttpRequest();\nxhr.open(\"POST\"\
    , \"http://some.domain.com/method\");\nxhr.send(\"fname=Pratik&lname=Bandal\"\
    );\nxhr.onreadystatechange = (event) => {\n  console.log(xhr.responseText);\n\
    };\n```\n\n## 151. What are HTTP status codes?\n\nHTTP status codes are the standard\
    \ response code given by website servers. These codes help identify the cause\
    \ of problem when web page or other resource does not load properly.\n\n### 4xx\
    \ Client Error:\n\nThis category of HTTP status code includes those where request\
    \ for a web page or other resource contains bad syntax or cannot be filled for\
    \ some reason, presumably due to fault of client.\n\nCommon client error HTTP\
    \ status codes are 404 (Not Found), 403 (Forbidden) and 400 (Bad request).\n\n\
    ### 5xx Server Error:\n\nThis category of HTTP status code includes those where\
    \ the request for a web page or other resource is understood by the website server\
    \ but is incapable of filling it for some reason.\n\nCommon server error HTTP\
    \ status codes are 500 (Internal server error), 503 (Service Unavailable) and\
    \ 502 (Bad Gateway).\n\nThere are also 1xx, 2xx and 3xx code that are informational,\
    \ confirm success or dictate redirection which are not errors, so you shouldn’t\
    \ be alerted about them.\n"
  mdcn: "\n\n## 133. 如何在 JavaScript 中处理异常？\n\nJavaScript 使用 `try...catch...finally`\
    \ 语句以及 `throw` 运算符来处理异常。\n\n你可以捕获用户定义的运行时异常，但无法捕获 JavaScript 语法错误。\n\n## 134.\
    \ 解释 try...catch...finally。\n\n**Try**：将可能抛出错误的“意大利面条式”代码包裹在 catch 块中。\n\n**Catch**：在\
    \ catch 块中发生错误时编写代码来执行某些操作。catch 块可以包含参数，为你提供错误信息。通常，catch 块用于记录错误或向用户显示特定消息。\n\
    \n**Finally**：无论是否发生错误，finally 块中的代码都将始终执行。finally 块通常用于完成剩余任务，或重置在 `try` 块中发生错误前可能已更改的变量。\n\
    \n## 135. 如何通过程序抛出异常？\n\n可以使用 `throw` 语句程序化地抛出异常。\n\n对于作为异常抛出的数据类型没有限制。例如：\n\n\
    ```\nthrow \"error occurred!\";\nthrow new SyntaxError(\"syntax error occurred!\"\
    );\n```\n\n## 11. 调试\n\n## 136. 什么是调试？\n\n调试是检测并修复软件代码中现有和潜在错误的过程，这些错误可能会导致程序出现异常之外的行为。\n\
    \n为了调试程序，程序员必须从问题开始，识别问题源，然后修复它。\n\n有时调试一个程序花费的时间比编写代码还要长。\n\n## 137. 什么是 debugger\
    \ 关键字？\n\n`debugger` 语句会停止 JavaScript 的执行。如果调试功能可用，此语句将不起作用。\n\n`debugger` 关键字就像脚本源代码中的断点。\n\
    \n例如：\n\n```\nfunction someErroneousFunction() {\n    debugger;\n    code;\n}\n\
    ```\n\n## 138. 什么是 console 对象？\n\n`console` 对象提供了访问浏览器调试控制台的方法。\n\n如果浏览器支持调试，你可以使用\
    \ `console.log()` 方法在调试窗口中显示所需的文本。\n\n`console` 对象提供了 `debug()`、`log()`、`error()`、`info()`、`trace()`、`warn()`\
    \ 等方法，这些方法对代码调试非常有用。\n\n## 139. 如何在浏览器中激活调试？\n\n你可以通过按 F12 并在调试器菜单中选择 `console`\
    \ 来激活浏览器调试。\n\n## 140. 如何在桌面浏览器中获取网页的移动设备视图？\n\n在浏览器中按 F12，\n然后点击“切换设备工具”，\n\n\
    ![](img/24f7348e451430199b686a6109b6f16a_60_0.png)\n\n然后，选择你想查看网页的设备。\n\n![](img/24f7348e451430199b686a6109b6f16a_60_1.png)\n\
    \n## 141. 如何在浏览器中停用断点？\n\n可以通过点击浏览器开发者工具中“Sources（源代码）”选项卡中的“停用断点”图标来实现。\n\n![](img/24f7348e451430199b686a6109b6f16a_60_2.png)\n\
    \n## 142. 如何暂停脚本执行？\n\n可以通过点击“Sources（源代码）”选项卡中的“暂停脚本执行”图标来实现。\n\n## 143. 如何在调试时逐行执行代码？\n\
    \n可以通过点击“Sources（源代码）”选项卡中的“逐行执行”图标来实现。\n\n![](img/24f7348e451430199b686a6109b6f16a_60_0)\n\
    \n## 144. 如何在调试时跳过函数执行？\n\n可以通过点击“Sources（源代码）”选项卡中的“跳过函数”图标来实现。\n\n![](img/24f7348e451430199b686a6109b6f16a_60_1)\n\
    \n## 145. 什么是气味（Code Smell）？\n\n在编程中，代码气味是指任何可能指示深层次问题的特征。\n\n确定什么是代码气味是主观的，并且因语言而异。\n\
    \n用于代码分析的两个工具是 ESLint 和 JSHint。\n\n## 12. AJAX\n\n## 146. 什么是 AJAX？\n\nAJAX 代表异步\
    \ JavaScript 和 XML。它允许在不刷新页面的情况下与服务器交换数据。\n\n## 147. GET 和 POST 的区别是什么？\n\n| GET\
    \ | POST |\n|---|---|\n| 历史：参数保留在历史中。 | 参数不会保存在历史中。 |\n| 安全：发送 URL。 | POST 更安全。\
    \ |\n| 缓存：可以缓存。 | 不缓存。 |\n\n## 148. 什么是 XMLHttpRequest 对象？\n\n`XMLHttpRequest`\
    \ 对象用于客户端与服务器之间的异步通信。它提供了 `open()`、`send()`、`setRequestHeader()` 等方法。\n\n## 149.\
    \ 如何使用 AJAX 进行 GET 请求？\n\n要使用 AJAX 发送 GET 请求，首先需要实例化 `XMLHttpRequest`。\n\n使用对象的\
    \ `open()` 方法指定 URL 和 HTTP 方法（GET）。\n\n然后调用 `send()` 方法来发送请求。\n\n通过 `onreadystatechange`\
    \ 接收响应。\n\n例如：\n\n```javascript\nconst xhr = new XMLHttpRequest();\nxhr.open(\"\
    GET\", \"http://some.domain.com/method\");\nxhr.send();\nxhr.onreadystatechange\
    \ = (event) => {\n  console.log(xhr.responseText);\n};\n```\n\n## 150. 如何使用 AJAX\
    \ 进行 POST 请求？\n\n要使用 AJAX 发送 POST 请求，首先需要实例化 `XMLHttpRequest`。\n\n使用对象的 `open()`\
    \ 方法指定 URL 和 HTTP 方法（POST）。\n\n然后调用 `send()` 方法并传递数据来发送请求。\n\n通过 `onreadystatechange`\
    \ 接收响应。\n\n例如：\n\n```javascript\nconst xhr = new XMLHttpRequest();\nxhr.open(\"\
    POST\", \"http://some.domain.com/method\");\nxhr.send(\"fname=Pratik&lname=Bandal\"\
    );\nxhr.onreadystatechange = (event) => {\n  console.log(xhr.responseText);\n\
    };\n```\n\n## 151. 什么是 HTTP 状态码？\n\nHTTP 状态码是网站服务器提供的标准响应码。这些代码有助于识别导致网页或其他资源无法正常加载的原因。\n\
    \n### 4xx 客户端错误：\n\n此类 HTTP 状态码包括对网页或资源的请求包含语法错误，或由于某些原因无法执行，通常是客户端的错。\n\n常见的客户端错误\
    \ HTTP 状态码包括 404（未找到）、403（禁止）和 400（请求错误）。\n\n### 5xx 服务器错误：\n\n此类 HTTP 状态码包括网站服务器理解了对网页或其他资源的请求，但由于某些原因无法执行。\n\
    \n常见的服务器错误 HTTP 状态码包括 500（内部服务器错误）、503（服务不可用）和 502（网关错误）。\n\n还有 1xx、2xx 和 3xx\
    \ 代码是信息性的、确认成功的或指示重定向的，它们不是错误，因此你不应该对它们发出警报。\n\n"
