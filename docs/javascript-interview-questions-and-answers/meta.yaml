  md: '# 8. Cookies


    # 112. What is cookie?


    The Cookies are small items of data that consists of name and value pair. Cookies
    are stored on your computer so that it can be accessed by your web browser.


    A web browser and server communicate through HTTP which is stateless protocol.
    Stateless protocol treats each request independently, so server does not keep
    data after sending it to browser. With cookies such data can be fetched directly
    from stored cookie file instead of communicating with server.


    For example when user visits web page, user name can be stored in cookie. Now
    when next time user visits the page cookie belonging to the page is added to the
    request. This way server gets necessary data “remembered” by cookie.


    # 113. How cookie helps client server HTTP communication?


    When a user sends a request to the server, each of that request is treated as
    a new request sent by the different user.


    When receiving an HTTP request, a server can possibly send a Set-Cookie header
    with the response.


    Now, whenever a user sends a request to the server, the cookie is added with that
    request automatically. Due to the cookie, the server recognizes'
  merge: -1
  pgno: 49
- img_proc: true
  md: '![](img/24f7348e451430199b686a6109b6f16a_50_0.png)


    #  114. Where are cookies stored?


    During browsing session browser stored cookies in memory, at the time of quitting
    they go to file called as cookies.txt.


    Different browser store cookies file in a different location on disk.


    For instance, on windows chrome stores the cookies in below location, C:\Users\YourUser\AppData\Local\Google\Chrome\User\Default\


    As cookie expires it is no longer saved on hard drive.


    #  115. Where are parameters of cookie?


    There are six parameters of cookie: name, value, expires, path, domain and security.


    The name and value are required whereas all other parameters are optional.


    ```

    document.cookie="name=VALUE;expires=DATE;path=PATH;domain=DOMAIN;secure";

    ```


    **Name and Value : The first part of cookie must have name and value. The entire
    name/value must be a single string with no commas, semicolons or whitespace characters.'
