    \n## 38. JavaScript 中函数的类型有哪些？\n\n以下是函数的类型：\n\n命名函数：在定义时具有名称的函数是命名函数。\n\n例如：\n\
    \n```\nfunction print() {\n  console.log(\"This is named function!!!\");\n}\n\
