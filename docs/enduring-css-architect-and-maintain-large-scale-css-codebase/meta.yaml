    HTML classes in the markup/templates too. Which made me ponder the question:


    > Why can’t the thing, just be the thing?


    For now, you may counter with, ‘this is a daft example, if a design has so many
    eventualities, it should be normalised’. At which point I would counter that it
    shouldn’t be necessary to. Those tasked with coding the front-end shouldn’t need
    to hobble a designers creativity just because it makes their code less predictable.
    They should be able to code out a new design simply and easily without concerning
    themselves for how the new component/module/thing may impact others.


    > Trying to prevent visual changes to a project merely because they make our codebase
    difficult to maintain is not a defensible stance. We should be able to build out
    any new visual treatment with speed and predictability without fear of inadvertently
    affecting other areas of the project.


    When I’ve used OOCSS to tackle my needs, my speed to build new visuals decreased
    and the amount of single responsibility principle classes increased; often a class
    is used just once or twice on an entire project.


    When using a OOCSS on a rapidly changing project I also found that after some
