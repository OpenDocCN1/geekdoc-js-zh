  md: "```\n.co-Button {\n    background-color: $color-button-passive;\n    &[aria-selected=\"\
    true\"] {\n        background-color: $color-button-selected;\n    }\n}\n```\n\n\
    We use the ampersand (&) as a parent selector and the attribute selector to leverage\
    \ the enhanced specificity having the aria attribute on the node provides. Then\
    \ we can just style the changes as needed.\n\nThe ability to nest state changes\
    \ within a rule in this manner provides increased developer ergonomics. The intention\
    \ is that a rule is only defined at root level once throughout the entire application\
    \ styles. This provides a single source of truth to define all possible eventualities\
    \ pertaining to that class. For more information, ensure you read Chapter 8, The\
    \ Ten Commandments of Sane Style Sheets.\n\n> As a related note, the CSS Selectors\
    \ Level 4 specification makes provision for case insensitivity by using a `i`\
    \ flag before the closing square bracket. For example: `.co-Button { background-color:\
    \ $color-button-passive; &[aria-selected=\"true\" i] { background-color: $color-button-selected;\
    \ } }` This allows any case value variant of the attribute to pass (by default\
    \ it is case sensitive)\n\n# States and properties, redone with ARIA\n\nSection\
    \ 6.5.1. of the WAI-ARIA specification describes 'Widget Attributes', these contain\
    \ many of the common states needed when working with a web application and rapidly\
