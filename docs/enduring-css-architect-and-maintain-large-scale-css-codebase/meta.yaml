    \ stick inside the braces are what really affects performance. It stands to reason\
    \ that scrolling a page that requires endless expensive re-paints and layout changes\
    \ is going to put a strain on the device. Nice HiDPI screen? It will be even worse\
    \ as the CPU/GPU strains to get everything re-painted to screen in under 16ms.\n\
    \nWith the expensive styles test, on the 15\" Retina MacBook Pro I tested on,\
    \ the paint time shown in continuous paint mode in Chrome never dropped"
  - '[PAGE 119]


    below 280ms (and remember, we are aiming for sub–16ms). To put that in perspective
    for you, the first selector test page, never went above 2.5ms. That wasn’t a typo.
    Those properties created a 112X increase in paint time. Holy expensive properties
    Batman! Indeed Robin. Indeed.


    # ## What properties are expensive?


    An ''expensive'' property/value pairing is one we can be pretty confident will
    make the browser struggle with when it has to repaint the screen (e.g. on scroll).


    How can we know what will be an ''expensive'' style? Thankfully, we can apply
    common sense to this and get a pretty good idea what is going to tax the browser.
    Anything that requires a browser to manipulate/calculate before painting to the
    page will be more costly. For example, box-shadows, border-radius, transparency
    (as the browser has to calculate what is shown below), transforms and performance
    killers like CSS filters - if performance is your priority, anything like that
    is your worst enemy.


    Juriy ''kangax'' Zaytsev did [a fantastic blog post also covering CSS performance](link)
    back in 2012. He was using the various developer tools to measure performance.
    He did a particularly good job of showing the difference that various properties
    had on performance. If this kind of thing interests you then that post is well
    worth your time.


    # ## Summary


    Some takeaways from these tests:


    +   - sweating over the selectors used in modern browsers is futile; most selection
    methods are now so fast it''s really not worth spending much time over. Furthermore,
    there is disparity across browsers of what the slowest selectors are anyway. Look
    here last to speed up your CSS.'
  - '[PAGE 120]


    # Appendix 1: CSS selector performance


    +   • excessive unused styles are likely to cost more, performance wise, than
    any selectors you chose so look to tidy up there second. 3000 lines that are unused
    or surplus on a page are not even that uncommon. While it''s common to bunch all
    the styles up into a great big single `styles.css`, if different areas of your
    site/web application can have different (additional) style sheets added (dependency
    graph style), that may be the better option.


    +   • if your CSS has been added to by a number of different authors over time,
    look to tools like [UnCSS](https://github.com/uncss/uncss) to automate the removal
    of styles; doing that process by hand is no fun!


    +   • the battle for high performing CSS will not be won in the selectors used,
    it will be won with the judicious use of property and values.


    +   • getting something painted to screen fast is obviously important but so is
    how a page feels when the user interacts with it. Look for expensive property
    and value pairs first (Chrome continuous repaint mode is your friend here), they
    are likely to provide the biggest gains.'
  - '[PAGE 121]


    # # Appendix 2: Browser representatives on CSS performance


    As a companion to Appendix 1, the following text deals with what browser representatives
    have to say about CSS performance.


    # ## TL;DR


    If you read nothing more of this section, read this next paragraph and take it
    to heart:


    Do not memorize rules关系中 to CSS performance without checking your own ‘data’.
    They are largely useless, transient and too subjective. Instead become acquainted
    with tools and use them to reveal relevant data for your own scenario. This is
    basically the mantra the Chrome Developer relations folks have been promoting
    for years, I believe it was Paul Lewis (more of which below) that coined the term,
    ‘Tools, not rules’ in relation to troubleshooting web performance.


    Nowadays I get that sentiment. Really get it.


    # ## Browser representatives on CSS performance


    While I generally never worry CSS selectors when authoring a style sheet (typically
    I just put a class on anything I want to style and select it directly) every so
    often I see comments from people way smarter than me that relate specifically
    to a certain selector. Here’s a quote from [Paul Irish](https://www.paulirish.com/)
    in relation to a [post on A List Apart from Heydon Pickering](https://alistapart.com/article/)
    which used a specific type of selector:'
- md: 'These selectors are among the slowest possible, ~500x slower than something
    wild like "div.box:not(:empty):last-of-type .title". Test page http://jsbin.com/gozula/1/quiet.
    That said, selector speed is rarely a concern, but if this selector ends up in
    a dynamic webapp where DOM changes are very common, it could have a large effect.
    So, good for many use cases but keep in mind it might become a perf bottleneck
    as the app matures. Something to profile at that point. Cheers.


    What are we to take from that? Do we try and hold that kind of selector in some
    ''do not use in case of emergency'' vault in our heads?


    To try and get some ''real'' answers, I asked the smart folks who actually work
    on browsers what they think we should concern ourselves with in regards to CSS
    performance.


    In the front-end world we are lucky that the Chrome Developer relations team are
    so accessible. However, I like balance. In addition, I reached out to people at
    Microsoft and Firefox and included some great input from WebKit too.


    ## Should we worry about CSS selectors?


    The question was essentially, "Should authors concern themselves with the selectors
    used in relation to CSS performance?"


    Let''s start at the beginning, where things like the CSSOM and DOM actually get
    constructed. [Paul Lewis](https://twitter.com/aerotwist), Developer Advocate for
    Chrome Developer Relations explains, "Style calculations are affected by two things:
    selector matching and the size of the invalidation. When you first load a page
    all the styles need to be calculated for all the elements, and that''s a function
    of tree size and the number of selectors."


    For more detail, Lewis quotes [Rune Lillesveen](https://twitter.com/runeopd) on
    the Opera team (who does a lot of work on Blink''s style code):


    > At the time of writing, roughly 50% of the time used to calculate the computed
    style for an element is used to match selectors, and the other half of the time
    is used for constructing the RenderStyle (computed style representation) from
    the matched rules.


    OK, that went a bit ''science'' for me so does that mean we need to worry about
    selectors or not?


    Lewis again, "Selector matching can affect performance, but in my experience the
    tree size tends to be the most significant factor."


    It stands to reason that if you have an enormous DOM tree, and a whole raft of
    irrelevant styles, things are going to start chugging. My own bloat test backs
    this up. Consider this another way. If I give you two piles of 1000 cards, each
    with different names on except for 5 matching ones, it stands to reason it will
    take longer to pair those matching names than if there were only 100, or 10 cards.
    Same principle for the browser.


    I think we can all agree that style bloat is a bigger concern than the CSS selector
    used. Maybe that''s one rule we can bank on?


    > "For most websites I would posit that selector performance is not the best area
    to spend your time trying to find performance optimizations. I would highly recommend
    to focus on what is inside the braces than the selectors outside of them", says
    Greg Whitworth, Program Manager at Microsoft.


    ## What about JavaScript?


    However, Whitworth also notes that extra diligence is required when dealing with
    JavaScript and dynamism in the DOM structure, "If you are using JavaScript to
    add or replace classes on events over and over again you should think about how
    that will affect the overall web pipeline and the DOM structure of the box you''re
    touching."


    This ties in with the earlier comment from Paul Irish. Rapid invalidation of areas
    of the DOM thanks to class changes can occasionally show up complex selectors.
    So, maybe we should be worried about selectors? "There are exceptions to every
    rule and there are selectors that are more performant than others but we normally
    only see these in cases where there are massive DOM trees in tandem with JavaScript
    anti-patterns that causes DOM thrashing and additional layout or painting to take
    place," says Whitworth.


    For more simplistic JavaScript changes, Lewis offers this advice, "The solution
    is normally to target elements as closely as possible, though increasingly Blink
    is smart about which elements will truly be affected by a change to a parent element."
    So, practically speaking, if you need to affect a change in a DOM element, add
    a class directly above it in the DOM tree if possible, rather than up on the body
    or html node.


    ## Dealing with CSS performance


    At this point I''m happily re-concluding the conclusion arrived at in Appendix
    1 - that CSS selectors are rarely a problem with static pages. Plus, attempting
    to second guess which selector will perform well is probably futile.


    However, for large DOMs and dynamic DOMs (e.g. not the odd class toggle, we are
    lyric writing of JavaScript manipulation) it may not be beyond the realms of possibility
    that CSS selectors could be causing an issue. "I can''t speak for all of Mozilla,
    but I think when you''re dealing with performance, you want to focus on what''s
    slow. Sometimes that will be selectors; usually it will be other things," says
    [L. David Baron](https://dbaron.org/), of [Mozilla](https://www.mozilla.org/)
    and a member of the W3C''s CSS working group. "I''ve definitely seen pages where
    selector performance matters, and I''ve definitely seen lots of pages where it
    doesn''t."


    So what should we do? What''s the most pragmatic approach?


    "You should use profiling tools to determine where your performance problems are,
    and then work on solving those problems," says Baron. Everyone I spoke to echoed
    these sentiments.


    ## Summary


    If you''ve developed on the web for any non-trivial period of time you will know
    that the answer to most web related questions is ''it depends''. I hate that there
    are no simple, cast-iron rules in relation to CSS performance that can be banked
    upon in every situation. I''d genuinely love to write those rules out here in
    a nice little paragraph and believe they would be universally true. But I can''t
    because there simply aren''t any universal ''cast-iron'' truths in relation to
    performance. There can''t ever be any because there are simply too many variables.
    Engines update, layout methods become optimised, every DOM tree is different,
    all CSS files are different. On and on ad infinitum. You get the picture.


    I''m afraid the best I can offer is to not sweat things like CSS selectors or
    layout methods in advance. It''s unlikely they will be your problem (but, you
    know, they just might). Instead, concentrate on making ''the thing''. Then, when
    ''the thing'' is made, test ''the thing''. If it''s slow or broke, find the problem
    and fix ''the thing''.


    ## Additional Information


    - Greg Whitworth recommends [A 2012 Build talk](https://www.youtube.com/watch?v=a2zpL3-hz-A)

    - [CSS Triggers](https://csstriggers.com/) by Paul Lewis indicates what changes
    in CSS will trigger Layout, Paint and Composite operations in the Blink engine
    (Chrome/Opera)'
  mdcn: '

    这些选择器属于最慢的一类，比"div.box:not(:empty):last-of-type .title"这种复杂选择器慢约500倍。测试页面 http://jsbin.com/gozula/1/quiet。话虽如此，选择器速度很少是个问题，但如果这个选择器出现在DOM变化非常频繁的动态Web应用中，可能会产生较大影响。因此，对许多用例来说是好的，但要记住，随着应用成熟，它可能会成为性能瓶颈。到那一步时值得进行性能分析。


    我们能从中得出什么结论呢？我们是否要把这类选择器牢牢记在脑中某个"紧急情况下不要使用"的保险柜里？


    为了获得一些"真实的"答案，我请教了实际在浏览器上工作的聪明人，询问他们认为我们在CSS性能方面应该关注什么。


    在前端领域，我们很幸运Chrome开发者关系团队如此平易近人。不过，我喜欢保持平衡。此外，我还联系了微软和火狐的人，并纳入了WebKit的一些精彩见解。


    ## 我们应该担心CSS选择器吗？


    这个问题本质上是"作者是否应该关注所使用的选择器与CSS性能的关系？"


    让我们从头开始，从CSSOM和DOM实际构建的地方说起。[Paul Lewis](https://twitter.com/aerotwist)，Chrome开发者关系团队的技术推广工程师解释道："样式计算受两个因素影响：选择器匹配和失效范围的大小。当你首次加载页面时，需要为所有元素计算所有样式，这是树大小和选择器数量的函数。"


    更多细节，Lewis引用了Opera团队的[Rune Lillesveen](https://twitter.com/runeopd)（他在Blink的样式代码方面做了很多工作）的话：


    > 在撰写本文时，计算元素的计算样式所用的时间中，大约有50%用于匹配选择器，另一半时间用于从匹配的规则构建RenderStyle（计算样式的表示）。


    好吧，这对我来说有点"科学"了，那这是否意味着我们需要担心选择器呢？


    Lewis又说："选择器匹配会影响性能，但据我的经验，树大小往往是最显著的因素。"


    如果你有一个庞大的DOM树和大量无关的样式，事情开始变得卡顿，这是理所当然的。我自己的膨胀测试也证实了这一点。换个角度想。如果我给你两堆各1000张卡片，每张都有不同的名字，只有5张是匹配的，那么很显然，这比只有100张或10张时需要更长时间才能配对这些匹配的名字。浏览器也是同样的原理。


    我想我们都能认同，样式膨胀比所使用的CSS选择器更令人担忧。或许这是我们可以确定的一条规则？


    > "对于大多数网站，我认为选择器性能不是花时间寻找性能优化的最佳领域。我强烈建议关注花括号**里面**的内容，而不是花括号**外面**的选择器"，微软项目经理Greg
    Whitworth说。


    ## 那JavaScript呢？


    不过，Whitworth也指出，在处理JavaScript和DOM结构的动态性时需要更加谨慎，"如果你使用JavaScript来反复添加或替换事件中的类，你应该考虑这将如何影响整体的Web流水线以及你所操作的盒子的DOM结构。"


    这与Paul Irish之前的评论相呼应。由于类变化导致DOM区域的快速失效，偶尔会使复杂选择器暴露出问题。那么，也许我们应该担心选择器？"每个规则都有例外，有些选择器确实比其他选择器性能更好，但我们通常只会在以下情况看到这些：巨大的DOM树与JavaScript反模式相结合，导致DOM抖动以及额外的布局或绘制操作发生"，Whitworth说。


    对于更简单的JavaScript变化，Lewis提供了这样的建议："解决方案通常是尽可能精确地定位目标元素，不过Blink越来越聪明，能够判断哪些元素真正会受到父元素变化的影响。"所以，实际来说，如果你需要影响DOM元素的变化，尽可能直接在DOM树中它的上方添加类，而不是在body或html节点上。


    ## 处理CSS性能


    此时，我很高兴地重新得出了附录1中得出的结论——对于静态页面，CSS选择器很少是问题。而且，试图猜测哪个选择器性能良好可能是徒劳的。


    然而，对于大型DOM和动态DOM（例如，不是偶尔切换类，而是大量JavaScript操作），CSS选择器可能造成问题并非不可能。"我不能代表整个Mozilla发言，但我认为当你处理性能时，你应该关注慢的部分。有时那会是选择器；通常会是其他东西"，[Mozilla](https://www.mozilla.org/)的[L.
    David Baron](https://dbaron.org/)说道，他是W3C CSS工作组的成员。"我肯定见过选择器性能重要的页面，也肯定见过大量选择器性能不重要的页面。"


    那么我们应该做什么？最务实的方法是什么？


    "你应该使用性能分析工具来确定你的性能问题所在，然后解决这些问题"，Baron说。我采访的每个人都附和了这些观点。


    ## 总结


    如果你从事Web开发有任何非平凡的时间，你就会知道大多数Web相关问题的答案都是"看情况"。我讨厌在CSS性能方面没有任何简单、铁定的规则可以在每种情况下都依赖。我很想在下面用一段漂亮的文字写出这些规则，并相信它们是普遍正确的。但我不能，因为根本不存在关于性能的普遍"铁定"真理。永远不可能有，因为变量实在太多了。引擎更新，布局方法优化，每个DOM树都不同，所有CSS文件都不同。等等等等，无穷无尽。你明白的。


    恐怕我能提供的最好建议是：不要预先担心CSS选择器或布局方法这类事情。它们不太可能是你的问题（但是，你知道的，它们也可能就是）。相反，专注于做出"那个东西"。然后，当"那个东西"做出来之后，测试"那个东西"。如果它慢或者有毛病，找出问题并修复"那个东西"。


    ## 附加信息


    - Greg Whitworth推荐[A 2012 Build talk](https://www.youtube.com/watch?v=a2zpL3-hz-A)

    - [CSS Triggers](https://csstriggers.com/) by Paul Lewis 显示了CSS中的哪些变化会在Blink引擎（Chrome/Opera）中触发布局、绘制和合成操作

    '
