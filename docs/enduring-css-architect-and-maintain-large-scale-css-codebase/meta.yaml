    (specifically code organisation by component) of this approach from his work.
    I’d been name-spacing components for some time (and I’m therefore claiming pseudo
    multiple discovery) but the approach of organising code by component is taken
    entirely from hearing him talk on this matter.


    With the exception of intentionally ‘global’ CSS, all code that relates to the
    presentation of a component or module should be included in the partials that
    sit alongside the HTML/JS of that component.'
