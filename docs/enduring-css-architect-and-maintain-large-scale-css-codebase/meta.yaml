- md: " ## Appendix 1: CSS selector performance\n\nBack at the beginning of 2014 I\
    \ was having a \"debate\" (I used air-quotes there people) with some fellow developers\
    \ about the irrelevance, or not, of worrying about CSS selector speed.\n\nWhenever\
    \ exchanging theories/evidence about the relative speed of CSS selectors, developers\
    \ often reference Steve Souders work on CSS selectors from 2009. It's used to\
    \ validate claims such as 'attribute selectors are slow' or 'pseudo selectors\
    \ are slow'.\n\nFor the last few years, I've felt these kinds of things just weren't\
    \ worth worrying about. The sound-bite I have been wheeling out for years is:\n\
    \n> With CSS, architecture is outside the braces; performance is inside\n\nBut\
    \ besides referencing Nicole Sullivan's later post on Performance Calendar to\
    \ back up my conviction that the selectors used don't really matter, I had never\
    \ actually tested the theory.\n\nTo try and address this, I attempted to produce\
    \ some tests of my own that would settle the argument. At the least, I believed\
    \ it would prompt someone with more knowledge/evidence to provide further data.\n\
    \n## Testing selector speed\n\nSteve Souders' aforementioned tests use JavaScript's\
    \ `new Date()`. However, nowadays, modern browsers (iOS/Safari were a notable\
    \ exception at the time of testing) support the Navigation Timing API which gives\
    \ us a more accurate measure we can use. For the tests, I implemented it like\
    \ this:\n\n```\n<script>\n    ;(function TimeThisMother() {\n        window.onload\
    \ = function(){\n            setTimeout(function(){\n            var t = performance.timing;\n\
    \                alert(\"Speed of selection is: \" + (t.loadEventEnd - t.responseEnd)\
    \ + \" milliseconds\");\n            }, 0);\n        };\n    })();\n</script>\n\
    ```\n\nThis lets us limit the timing of the tests between the point all assets\
    \ have been received(responseEnd) and the point the page is rendered (loadEventEnd).\n\
    \nSo, I set up a very simple test. 20 different pages, all with an identical,\
    \ enormous DOM, made up of 1000 identical chunks of this markup:\n\n```\n<div\
    \ class=\"tagDiv wrap1\">\n  <div class=\"tagDiv layer1\" data-div=\"layer1\"\
    >\n    <div class=\"tagDiv layer2\">\n      <ul class=\"tagUl\">\n        <li\
    \ class=\"tagLi\"><b class=\"tagB\"><a href=\"/\" class=\"tagA link\" data-select=\"\
    link\">Select</a></b></li>\n      </ul>\n    </div>\n  </div>\n</div>\n```\n\n\
    20 different CSS selection methods were tested to colour the inner most nodes\
    \ red. Each page differed only in the rule applied to select the inner most node\
    \ within the blocks. Here were the different selectors tested and a link to the\
    \ the test page for that selector:\n\n- Data attribute\n- Data attribute (qualified)\n\
    - Data attribute (unqualified but with value)\n- Data attribute (qualified with\
    \ value)\n- Multiple data attributes (qualified with values)\n- Solo pseudo selector\
    \ (e.g. :after)\n- Combined classes (e.g. class1.class2)\n- Multiple classes\n\
    - Multiple classes with child selector\n- Partial attribute matching (e.g. [class^=\"\
    wrap\"])\n- nth-child selector\n- nth-child selector followed by another nth-child\
    \ selector\n- Insanity selection (all selections qualified, every class used e.g.\
    \ div.wrapper > div.tagDiv > div.tagDiv.layer2 > ul.tagUL > li.tagLi > b.tagB\
    \ > a.TagA.link)\n- Slight insanity selection (e.g. .tagLi .tagB a.TagA.link)\n\
    - Universal selector\n- Element single\n- Element double\n- Element treble\n-\
    \ Element treble with pseudo\n- Single class\n\nThe test was run 5 times on each\
    \ browser and the result averaged across the 5 results. The browsers tested:\n\
    \n- Chrome 34.0.1838.2 dev\n- Firefox 29.0a2 Aurora\n- Opera 19.0.1326.63\n- Internet\
    \ Explorer 9.0.8112.16421\n- Android 4.2 (7\" tablet)\n\nA previous version of\
    \ Internet Explorer (rather than the latest Internet Explorer available to me)\
    \ was used to shed some light on how a 'non evergreen' browser performed. All\
    \ the other browsers tested received regular updates so I wanted to be sure that\
    \ there wasn't a considerable difference in the way modern regularly updating\
    \ browsers deal with CSS selectors and how slightly older ones do.\n\nWant to\
    \ try the same tests out for yourself? Go and grab the files from this GitHub\
    \ link: https://github.com/benfrain/css-performance-tests. Just open each page\
    \ in your browser of choice (remember the browser must support the Network Timing\
    \ API to alert a response). Also be aware that when I performed the test I discarded\
    \ the first couple of results as they tended to be unusually high in some browsers.\n\
    \nWhen considering the results, don't consider one browser against another. That\
    \ is not the purpose of the tests. The purpose is purely to try and evaluate the\
    \ comparative difference in selection speed between the different selectors employed\
    \ on each browser. For example, is selector 3 any faster than selector 7 on any\
    \ browser? Therefore, when looking at the table, it makes more sense to look down\
    \ the columns than across the rows.\n\nHere are the results. All times in milliseconds:\n\
    \n| Test | Chrome 34 | Firefox 29 | Opera 19 | IE9 | Android 4 |\n|------|-----------|------------|----------|-----|-----------|\n\
    | 1 | 56.8 | 125.4 | 63.6 | 152.6 | 1455.2 |\n| 2 | 55.4 | 128.4 | 61.4 | 141\
    \ | 1404.6 |\n| 3 | 55 | 125.6 | 61.8 | 152.4 | 1363.4 |\n| 4 | 54.8 | 129 | 63.2\
    \ | 147.4 | 1421.2 |\n| 5 | 55.4 | 124.4 | 63.2 | 147.4 | 1411.2 |\n| 6 | 60.6\
    \ | 138 | 58.4 | 162 | 1500.4 |\n| 7 | 51.2 | 126.6 | 56.8 | 147.8 | 1453.8 |\n\
    | 8 | 48.8 | 127.4 | 56.2 | 150.2 | 1398.8 |\n| 9 | 48.8 | 127.4 | 55.8 | 154.6\
    \ | 1348.4 |\n| 10 | 52.2 | 129.4 | 58 | 172 | 1420.2 |\n| 11 | 49 | 127.4 | 56.6\
    \ | 148.4 | 1352 |\n| 12 | 50.6 | 127.2 | 58.4 | 146.2 | 1377.6 |\n| 13 | 64.6\
    \ | 129.2 | 72.4 | 152.8 | 1461.2 |\n| 14 | 50.2 | 129.8 | 54.8 | 154.6 | 1381.2\
    \ |\n| 15 | 50 | 126.2 | 56.8 | 154.8 | 1351.6 |\n| 16 | 49.2 | 127.6 | 56 | 149.2\
    \ | 1379.2 |\n| 17 | 50.4 | 132.4 | 55 | 157.6 | 1386 |\n| 18 | 49.2 | 128.8 |\
    \ 58.6 | 154.2 | 1380.6 |\n| 19 | 48.6 | 132.4 | 54.8 | 148.4 | 1349.6 |\n| 20\
    \ | 50.4 | 128 | 55 | 149.8 | 1393.8 |\n| Biggest Diff. | 16 | 13.6 | 17.6 | 31\
    \ | 152 |\n| Slowest | 13 | 6 | 13 | 10 | 6 |\n\n## The difference between fastest\
    \ and slowest selector\n\nThe Biggest Diff. row shows the difference in milliseconds\
    \ between the fastest and slowest selector. Of the desktop browsers, IE9 stands\
    \ out as having the biggest difference between fastest and slowest selectors at\
    \ 31ms. The others are all around half of that figure. However, interestingly\
    \ there was no consensus on what the slowest selector was.\n\n## The slowest selector\n\
    \nI was interested to note that the slowest selector type differed from browser\
    \ to browser. Both Opera and Chrome found the 'insanity' selector (test 13) the\
    \ hardest to match (the similarity between Opera and Chrome here perhaps not surprising\
    \ given they share the blink engine), while Firefox struggled with a single pseudo\
    \ selector (test 6), as did the Android 4.2 device (a Tesco hudl 7\" tablet).\
    \ Internet Explorer 9's Achilles heel was the partial attribute selector (test\
    \ 10).\n\n## Good CSS architecture practices\n\nOne thing we can be clear on is\
    \ that using a flat hierarchy of class-based selectors, as is the case with ECSS,\
    \ provides selectors that are as fast as any others.\n\n## What does this mean?\n\
    \nFor me, it has confirmed my believe that it is absolute folly to worry about\
    \ the type of selector used. Second guessing a selector engine is pointless as\
    \ the manner selector engines work through selectors clearly differs. Further\
    \ more, the difference between fastest and slowest selectors isn't massive, even\
    \ on a ludicrous DOM size like this. As we say in the North of England, \"There's\
    \ bigger fish to fry\".\n\nSince documenting my original results, Benjamin Poulain,\
    \ a WebKit Engineer got in touch to point out his concerns with the methodology\
    \ used. His comments were very interesting and some of the information he related\
    \ is quoted verbatim below:\n\n> \"By choosing to measure performance through\
    \ the loading, you are measuring plenty of much much bigger things than CSS, CSS\
    \ Performance is only a small part of loading a page:\n>\n> If I take the time\
    \ profile of `[class^=\"wrap\"]` for example (taken on an old WebKit so that it\
    \ is somewhat similar to Chrome), I see:\n>\n> - ~10% of the time is spent in\
    \ the rasterizer.\n> - ~21% of the time is spent on the first layout.\n> - ~48%\
    \ of the time is spent in the parser and DOM tree creation\n> - ~8% is spent on\
