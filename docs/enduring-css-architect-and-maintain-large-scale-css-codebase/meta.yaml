  mdcn: "\n ```css\n.sc-Item_Header-bg1 {} /* 分类 1 的图片 */\n.sc-Item_Header-bg2 {}\
    \ /* 分类 2 的图片 */\n.sc-Item_Header-bg3 {} /* 分类 3 的图片 */\n```\n\n这里选择器中的 `-bg3`\
    \ 部分表明，这个 `.sc-Item_Header` 是分类 3 的版本（因此可以为其分配适当的样式）。\n\n## 在 ECSS 选择器中双重使用\n\n\
    我们之前的例子表明，这是一种非常适合在元素上使用两个类的情况。一个用于分配默认样式，另一个用于设置变体的特定样式。\n\n考虑以下标记：\n\n```html\n\
    <div class=\"sc-Item_Header sc-Item_Header-bg1\">\n    <!-- 内容 -->\n</div>\n```\n\
    \n这里我们用 `sc-Item_Header` 设置元素的通用样式，然后用 `sc-Item_Header-bg1` 设置特定于变体的样式。这种方法并没有什么革命性的，我在这里记录下来只是为了说明，ECSS\
    \ 方法中没有任何东西会排除这种做法。\n\n## 总结\n\n我们在本章中涵盖了很多细节。我们主要看了两个领域：如何组织项目的语言文件以便于维护，以及如何在\
    \ ECSS 中命名类和选择器，以便 DOM 中元素的类能够告诉我们关于其来源、用途和预期上下文的所有信息。我们还详细了解了 ECSS 选择器的公认语法，以及在哪里、如何应用大小写差异来划分选择器的不同部分。到目前为止，我们只关注了静态元素。在下一章中，我们将看看\
    \ ECSS 如何处理元素的状态变化。\n\n# 第 6 章 处理状态\n\n大多数 Web 应用程序都需要处理状态。\n\n首先，让我们明确一下\"状态\"\
    的含义。考虑一些例子：\n\n- 用户点击按钮。\n- 界面中的某个值被更新。\n- 界面的某个区域被禁用。\n- 界面中的某个部件处于忙碌状态。\n- 输入的值超出了允许的值。\n\
    - 应用程序的某个部分开始包含实时数据。\n\n所有这些情况都需要在 DOM 中传达状态变化，以便必要的前端样式变化也能够应用到应用程序中。\n\nWeb\
    \ 应用程序本身很少需要修改 DOM 来跟踪状态。例如，客户端 JavaScript 应用程序通常有内部的手段来处理和跟踪状态。因此，到目前为止，对 DOM\
    \ 的更改纯粹是为了通过 CSS 实现美学变化（样式目的）。\n\n## ECSS 过去如何处理状态变化\n\n在第 3 章中，我提到了我非常喜欢 SMACSS\
    \ 传达状态的方法。例如：\n\n```\n.has-MiniCartActive {}\n```\n\n表示在这个节点上，或在其下方的某个位置，\"迷你购物车\"\
    是激活的。\n\n另一个例子：\n\n```\n.is-ShowingValue {}\n```\n\n这表示该组件或其内部的某个组件正在显示某个值（不再隐藏）。历史上，这就是我应用\
    \ ECSS 时传达状态的方式。我使用了一个微命名空间的类，附加到节点上的任何现有类来传达这种状态。例如：\n\n- `.is-Suspended` {}\n\
    - `.is-Live` {}\n- `.is-Selected` {}\n- `.is-Busy` {}\n\n在 DOM 中使用这些类的节点可能如下所示：\n\
    \n```html\n<button class=\"co-Button is-Selected\">老式按钮</button>\n```\n\n## 转向\
    \ WAI-ARIA\n\n然而，如果这些信息必须放入 DOM 纯粹作为样式钩子，那么它不妨在的同时也承担多一点重量。\n\n这些相同的样式钩子实际上可以作为\
    \ [WAI-ARIA](attachment:WAI-ARIA_link) 状态放入 DOM 中。WAI-ARIA 的[状态和属性](attachment:States_and_Properties_link)部分描述了\
    \ W3C 标准化的方式，用于在应用程序内向辅助技术传达状态和属性。在 WAI-ARIA 摘要描述的开头部分，有这样一句话：\n\n> 这些语义旨在允许作者通过文档级标记，向辅助技术正确传达用户界面行为（原文如此）和结构信息\n\
    \n虽然该规范旨在帮助向残障用户传达状态和属性（通过辅助技术），但它完美地满足了 Web 应用程序项目架构的需求。采用这种方法会产生一种（或许令人有些尴尬的）被称为\"\
    双赢\"的局面。我们可以改善 Web 应用程序的可访问性，同时还能获得一个明确定义的、经过深思熟虑的词汇表，用于传达我们应用程序逻辑中需要的状态。以下是使用\
    \ aria 重新编写的先前示例，用于传达状态：\n\n```html\n<button class=\"co-Button\" aria-selected=\"\
    true\">老式按钮</button>\n```\n\n类处理按钮的美学样式。`aria-*` 属性传达该节点或其后代的状态（如果有）。\n\n在 JavaScript\
    \ 应用程序领域，唯一需要做的改变是将状态变化从 `classList` 修改转向 `setAttribute` 修改。例如，要设置我们的按钮属性：\n\n\
    ```javascript\nbutton.setAttribute(\"aria-selected\", \"true\");\n```\n\n> 请注意，以这种方式分离关注点确实需要在\
    \ JavaScript 中额外的\"接触点\"。如果你绝对、肯定地想要最快/最简单的方式来处理状态变化，使用一次 `classList` 更新会更快。\n\
    \n## 将 ARIA 属性作为 CSS 选择器\n\n在我们首选的 CSS 语法中，在单一套大括号内编写该变化看起来像这样：\n\n```scss\n.co-Button\
    \ {\n    background-color: $color-button-passive;\n    &[aria-selected=\"true\"\
    ] {\n        background-color: $color-button-selected;\n    }\n}\n```\n\n我们使用与号（&）作为父选择器，并使用属性选择器来利用节点上\
    \ aria 属性提供的增强特异性。然后我们可以根据需要设置样式变化。\n\n以这种方式在规则内嵌套状态变化提供了更好的开发者体验。其意图是，在整个应用程序样式的根级别只定义一次规则。这为定义与该类相关的所有可能的最终情况提供了单一的真相来源。想了解更多信息，请务必阅读第\
    \ 8 章《健全样式表的十大戒律》。\n\n> 附带一提，CSS 选择器第 4 级规范提供了通过在右方括号之前使用 `i` 标志来实现不区分大小写的规定。例如：`.co-Button\
    \ { background-color: $color-button-passive; &[aria-selected=\"true\" i] { background-color:\
    \ $color-button-selected; } }` 这允许属性值的任何大小写变体通过（默认情况下是区分大小写的）。\n\n## 使用 ARIA 重做的状态和属性\n\
    \nWAI-ARIA 规范的第 6.5.1 节描述了\"小部件属性\"，其中包含了许多在使用 Web 应用程序和处理快速变化数据时常见的状态。\n\n以下是本章开头给出的示例，使用\
    \ ARIA 重新编写：\n\n- `aria-disabled=\"true\"`（代替 `is-Suspended`）\n- `aria-live=\"\
    polite\"`（代替 `.is-Live`，polite 值是描述更新应如何传达的[三个可能值](http://)之一）\n- `aria-current=\"\
    true\"`（这一项目前是为 WAI-ARIA 1.1 提出的 [http://www.w3.org/TR/wai-aria-1.1/#aria-current](http://www.w3.org/TR/wai-aria-1.1/#aria-current)）\n\
    - `aria-busy=\"true\"`（代替 `is-Busy`，表示元素及其子树（如果有）处于忙碌状态）\n\n还有很多其他的属性，而且按照 W3C\
    \ 规范的标准来看，这个规范相对容易理解。\n\n## 如果无法使用 ARIA\n\n如果由于某种原因，你无法在一个网站或应用程序中使用 aria-* 属性来传达状态。我现在倾向于不使用微命名空间来命名选择器以表示状态。例如，与其这样：\n\
    \n```html\n<button class=\"co-Button is-Selected\">老式按钮</button>\n```\n\n我更推荐使用选择器的变体版本，像这样：\n\
    \n```html\n<button class=\"co-Button co-Button-selected\">老式按钮</button>\n```\n"
