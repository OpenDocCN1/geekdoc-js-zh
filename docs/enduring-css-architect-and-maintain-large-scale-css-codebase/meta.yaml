    \ HTML 中散布相应的 OOCSS 类才能恢复视觉效果。\n\n这值得吗？\n\n鉴于没有其他属性组合具有那样的冗长度和重复度，从文件大小的角度来看，在我看来当然不值得。这会牺牲大量的开发敏捷性（记住，抽象会使编写和迭代变慢，因为必须同时修改模板和\
    \ CSS）和响应式灵活性（如果我想在不同视口中让这个东西表现不同怎么办），而 CSS 重量的收益却微乎其微。这就是 CSS 版的\"拆东墙补西墙\"。\n\
    \n让我明确一点。尽管 gzip 很有效，但如果你的优先级是让 CSS 文件尽可能小，ECSS 并不是你的最佳选择。相反，去看看 [Atomic CSS](https://acss.io)\
    \ 吧。它的创建者们非常聪明，事实上，[Thierry Koblentz](https://twitter.com/thierrykoblentz) 是我认识的最聪明的\
    \ CSS 专家之一。我相信 ACSS 能很好地满足你的需求。\n\n另一方面，ECSS 的优先级是开发者体验（可理解的类名约定）、易于维护（按组件组织的样式，易于删除）和样式封装（命名空间防止抽象泄漏）。\n\
    \n不同的问题，不同的解决方案。\n\n## 总结\n\n我希望我已经给了你足够的理由来考虑：如果你试图创建可维护的样式表，那么纠结于重复的属性值和属性对并不是最好的追求。在下一章中，除了探讨\
    \ ECSS 命名约定的好处之外，我还会论证：合理的项目组织方法从长远来看会比类抽象和重用产生更精简的样式表。\n\n## 第 5 章 文件组织与命名约定\n\
    \n### 项目组织\n\n如果我们希望促进网站/应用中模块化部分的轻松移除，我们就需要考虑构成这些模块的文件的组织方式。\n\n通常，在构建 Web 项目时，按技术类型拆分项目文件是一种常见模式。考虑这个基本的文件夹结构：\n\
    \n```\nmy-project/\n- html/\n- js/\n- css/\n```\n\n在这些文件夹中，你可能会为相关文件命名。例如：\n\n\
    ```\nmy-project/\n- html/\n    - v2ShoppingCart.html\n- js/\n    - v2ShoppingCart.js\n\
    - css/\n    - v2ShoppingCart.css\n```\n\n问题在于，尽管给文件起了相关的名字，但到了某个程度之后，很难推断每个样式表、逻辑文件和模板之间的关系。CSS\
    \ 文件夹中可能有 80 多个 CSS 部分文件，html 文件夹中可能有 50 多个模板存根。\n\n> 我认识到现实情况是，网站或应用程序的\"视图\"\
    部分通常由多种不同的技术生成，例如 Ruby、PHP、.NET 甚至 JavaScript——而不是纯 HTML。\n\n这样一来，越来越有必要依赖文本编辑器中的\"\
    查找\"功能来找到使用某个类的文件。反过来也是如此；需要\"查找\"来定位包含某个模块模板所需样式的部分文件。\n\n这种结构并不会让工作无法进行，只是效率低下，而且通常需要一点心理调整来记住什么和什么对应。\n\
    \n虽然这对 ECSS 来说不是必需的，但通常更可取的是，与其按技术类型组织，不如按视觉或逻辑组件来组织和分组文件。所以，与其这样：\n\n```\nhtml/\n\
    - shopping-cart-template.html\n- callouts-template.html\n- products-template.html\n\
    \njs/\n- shopping-cart-template.js\n- callouts-template.js\n- products-template.js\n\
    \ncss/\n- shopping-cart-template.css\n- callouts-template.css\n- products-template.css\n\
    ```\n\n我们的目标是这样的：\n\n```\nshopping-cart-template/\n- shopping-cart.html\n- shopping-cart.css\n\
    - shopping-cart.js\n```\n\n```\ncallouts-template/\n- callouts.html\n- callouts.js\n\
    - callouts.css\n```\n\n```\nproducts-template/\n- products.html\n- products.js\n\
    - products.css\n```\n\n乍一看，这似乎是一个看似无关紧要的差别，但它带来了重要的好处。每个组件的代码在物理上变得自包含。然后，在我们持久的项目中，当需要更改或弃用功能时，可以轻松更新/移除该模块的所有相关代码（样式、视图逻辑（HTML）和\
    \ JS）。\n\n> **致谢：** Nicolas Gallagher 在思考大规模 CSS 实现方面总是走在前面，我从他的工作中借鉴并改编了大量元素（特别是按组件组织代码的方法）。我使用组件命名空间已经有段时间了（因此我声称近似多重发现），但按组件组织代码的方法完全是从听他对这个问题的讨论中获得的。\n\
    \n除了有意为之的\"全局\"CSS 之外，所有与组件或模块展示相关的代码都应该件应包含在位于该组件 HTML/JS 旁边的部分文件中。\n\n尽管你可能不喜欢，但总有一些全局\
    \ CSS 是必要的；至少需要一个简单的重置或规范化样式集，例如。\n\n如果 CSS 和应用逻辑（例如 JS/PHP/Ruby）可以存储在同一个文件夹中，那就更好了。这使得了解哪些\
    \ CSS 代码与模块相关、哪些不相关变得更加容易。\n\n当某个模块被弃用时，与之相关的所有语言文件都可以一次性轻松地从代码库中移除；只需删除包含该模块的文件夹。\n\
    \n为了更加清楚，考虑我们想象中的 ShoppingCart 组件的文件夹结构：\n\n```\nShoppingCart/\n  - ShoppingCart.js\n\
    \  - ShoppingCart.css\n```\n\n现在假设我们创建了一个新的购物车：\n\n```\nv2ShoppingCart/\n  - v2ShoppingCart.js\n\
    \  - v2ShoppingCart.css\n```\n\n一旦我们的 v2 购物车完成，就可以很容易地从代码库中移除旧版本的代码，我们只需删除包含 ShoppingCart\
    \ 文件夹。\n\n### 当同文件夹组织不可行时\n\n可能无法或不宜将样式表和应用逻辑包含在同一个文件夹中。\n\n在这种情况下，次优选择是模仿逻辑的结构。举个例子。假设某个组件的逻辑存储在如下文件夹结构中：\n\
    \n```\nsrc/app/v2ShoppingCart/v2ShoppingCart.js\n```\n\n我们应该尽可能地模仿这种结构。在任何大型应用中，这将使定位相关文件变得更加容易。所以我们可以这样做：\n\
    \n```\nsrc/app/css/v2ShoppingCart/v2ShoppingCart.css // 尽可能匹配模块逻辑部分的文件夹层级\n```\n\
    \n使用 ECSS 时，相同的父文件夹绝对应该被视为\"黄金\"标准，但如果没有这个条件，模仿逻辑文件的结构应该能提供一些好处。\n\n在有了如何组织项目文件的具体想法后，让我们转向可以通过什么主要方式向我们的选择器/类传达额外含义和开发者便利。\n\
    \n## 使用 ECSS 命名类和选择器\n\n早在第 3 章，我就认识到了 BEM 命名 CSS 选择器的方法给我们带来的好处。命名一个块，然后以该块为基础命名任何子元素，为子元素创建了一个命名空间。\n\
    \n为模块的 CSS 添加命名空间创造了一种隔离形式。通过防止与其他元素发生名称冲突，CSS 块可以更容易地从一个环境移动到另一个环境（例如从原型到生产）。某个选择器的样式更改也不太可能无意中影响到另一个。\n"
