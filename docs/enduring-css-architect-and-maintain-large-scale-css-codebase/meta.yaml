    \n```\n\n> Excerpt From: Jonathan Snook. \"Scalable and Modular Architecture for\
    \ CSS.\"\n\nWhile these definitions make perfect sense in many scenarios, they\
    \ didn't for mine. I wanted an approach that was looser, an approach that didn't\
    \ make me need to consider fitting what I needed to build into those visual definitions;\
    \ the applications I was building and maintaining often defied adherence to those\
    \ definitions.\n\n## BEM\n\nBEM is a methodology developed by the developers at\
    \ http://yandex.ru.\n\nThe key thing I took from BEM (which stands for Block Element\
    \ Modifier) is just how much a naming convention can buy you when it comes to\
    \ CSS maintenance.\n\nIf you are interested in reading more about BEM, the canonical\
    \ resource is http://en.bem.info. For a good explanation of where it all began\
    \ I recommend starting here: https://en.b也是很.info/method/history//history/\n\n\
    Again, like SMACSS I'm not going to attempt to fully explain the ins and outs\
    \ of BEM methodology. However, I will give you the 'elevator pitch' explanation\
    \ of the key points. The BEM methodology works around the notion that key areas\
    \ of a page can be defined as 'Blocks'. In turn, those key areas are made up of\
    \ Elements. We can then represent the relationship between the Block and its Elements\
    \ in the way we name things. Consider the OOCSS media object example from before.\
