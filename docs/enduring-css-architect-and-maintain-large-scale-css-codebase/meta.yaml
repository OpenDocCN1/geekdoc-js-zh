    Our constant is the module itself and we can use a namespace to provide context
    for it. We always use the full name of the application module or component as
    the module section of the ECSS style selector. This has the benefit of making
    all HTML classes explicit as to their origin and purpose.


    > When naming the class for the outermost container of a module or component,
    no child extension should be added to the class/s-elector. Only the child parts
    of a module or component should get the node extension.


    OK, so, at this point, our selectors could be named like this in the CSS:


    ```

    .mod-ShoppingCart {} /*Modal*/

    .page-ShoppingCart {} /*Page*/

    .mod-ShoppingCartLines {} /*Modal*/

    .page-ShoppingCartLines {} /*Page*/

    ```


    This way our module and component have their two contexts isolated by a namespace
    switch. We are free to style each as we see fit with no potential leakage of styles
    from one to the other. This is the exact kind of scenario that typically becomes
    fraught when components and modules share HTML classes in the interest of abstraction
    and re-use.


    Let''s consider a twist on this scenario. Let''s suppose we don''t switch contexts
