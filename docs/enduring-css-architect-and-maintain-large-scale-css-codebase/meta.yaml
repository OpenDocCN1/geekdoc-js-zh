- img_proc: true
  md: 'These selectors are among the slowest possible. ~500 slower than something
    wild like "div.box:not(:empty):last-of-type .title". Test page http://jsbin.com/gozula/1/quiet
    That said, selector speed is rarely a concern, but if this selector ends up in
    a dynamic webapp where DOM changes are very common, it could have a large effect.
    So, good for many use cases but keep in mind it might become a perf bottleneck
    as the app matures. Something to profile at that point. Cheers


    What are we to take from that? Do we try and hold that kind of selector in some
    ''do not use in case of emergency'' vault in our heads?


    To try and get some ''real'' answers, I asked the smart folks who actually work
    on browsers what they think we should concern ourselves with in regards to CSS
    performance.


    In the front-end world we are lucky that the Chrome Developer relations team are
    so accessible. However, I like balance. In addition, I reached out to people at
    Microsoft and Firefox and included some great input from WebKit too.


    # Should we worry about CSS selectors?


    The question was essentially, "Should authors concern themselves with the selectors
    used in relation to CSS performance?"


    Let''s start at the beginning, where things like the CSSOM and DOM actually get
    constructed. [Paul Lewis](https://twitter.com/aerotwist), Developer Advocate for
    Chrome Developer Relations explains, "Style calculations are affected by two things:
    selector matching and the size of the invalidation. When you first load a page
    all the styles need to be calculated for all the elements, and that''s a function
    of tree size and the number of selectors."


    For more detail, Lewis quotes [Rune Lillesveen](https://twitter.com/runeopd) on
    the Opera team (who does a lot of work on Blink''s style code):


    > At the time of writing, roughly 50% of the time used to calculate the computed
    style for an element is used to match selectors,'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'and the other half of the time is used for constructing the RenderStyle (computed
    style representation) from the matched rules.


    OK, that went a bit ''science'' for me so does that mean we need to worry about
    selectors or not?


    Lewis again, "Selector matching can affect performance, but in my experience the
    tree size tends to be the most significant factor."


    It stands to reason that if you have an enormous DOM tree, and a whole raft of
    irrelevant styles, things are going to start chugging. My own bloat test backs
    this up. Consider this another way. If I give you two piles of 1000 cards, each
    with different names on except for 5 matching ones, it stands to reason it will
    take longer to pair those matching names than if there were only 100, or 10 cards.
    Same principal for the browser.


    I think we can all agree that style bloat is a bigger concern than the CSS selector
    used. Maybe that''s one rule we can bank on?


    > "For most websites I would posit that selector performance is not the best area
    to spend your time trying to find performance optimizations. I would highly recommend
    to focus on what is inside the braces than the selectors outside of them", says
    Greg Whitworth, Program Manager at Microsoft.


    # ## What about JavaScript


    However, Whitworth also notes that extra diligence is required when dealing with
    JavaScript and dynamism in the DOM structure, "If you are using JavaScript to
    add or replace classes on events over and over again you should think about how
    that will affect the overall web pipeline and the DOM structure of the box you''re
    touching."


    This ties in with the earlier comment from Paul Irish. Rapid invalidation of areas
    of the DOM thanks to class changes can occasionally show up complex selectors.
    So, maybe we should be worried about selectors? "There are exceptions to every
    rule and there are selectors that are more performant than'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'others but we normally only see these in cases where there are massive DOM
    trees in tandem with JavaScript anti-patterns that causes DOM thrashing and additional
    layout or painting to take place," says Whitworth.


    For more simplistic JavaScript changes, Lewis offers this advice, "The solution
    is normally to target elements as closely as possible, though increasingly Blink
    is smart about which elements will truly be affected by a change to a parent element."
    So, practically speaking, if you need to affect a change in a DOM element, add
    a class directly above it in the DOM tree if possible, rather than up on the body
    or html node.


    # Dealing with CSS performance


    At this point I''m happily re-concluding the conclusion arrived at in Appendix
    1 - that CSS selectors are rarely a problem with static pages. Plus, attempting
    to second guess which selector will perform well is probably futile.


    However, for large DOMs and dynamic DOMs (e.g. not the odd class toggle, we are
    lyric writing of JavaScript manipulation) it may not bebeyondTherealmsofpossibilitythatCSSselectorscouldbecausinganissue."Ican''t
    speak for all of Mozilla, but I think when you''re dealing with performance, you
    want to focus on what''s slow. Sometimes that will be selectors; usually it will
    be other things," says [L. David Baron](https://dbaron.org/), of [Mozilla](https://www.mozilla.org/)
    and a member of the W3C''s CSS working group. "I''ve definitely seen pages where
    selector performance matters, and I''ve definitely seen lots of pages where it
    doesn''t."


    So what should we do? What''s the most pragmatic approach?


    "You should use profiling tools to determine where your performance problems are,
    and then work on solving those problems," says Baron. Everyone I spoke to echoed
    these sentiments.


    # Summary


    If you''ve developed on the web for any non-trivial period of time you will know
    that the answer to most web related questions is ''it depends''. I hate'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'that there are no simple, cast-iron rules in relation to CSS performance that
    can be banked upon in every situation. I''d genuinely love to write those rules
    out here in a nice little paragraph and believe they would be universally true.
    But I can''t because there simply aren''t any universal ''cast-iron'' truths in
    relation to performance. There can''t ever be any because there are simply too
    many variables. Engines update, layout methods become optimised, every DOM tree
    is different, all CSS files are different. On and on ad infinitum. You get the
    picture.


    I''m afraid the best I can offer is to not sweat things like CSS selectors or
    layout methods in advance. It''s unlikely they will be your problem (but, you
    know, they just might). Instead, concentrate on making ''the thing''. Then, when
    ''the thing'' is made, test ''the thing''. If it''s slow or broke, find the problem
    and fix ''the thing''.


    # Additional Information


    +   - Greg Whitworth recommends [A 2012 Build talk](https://www.youtube.com/watch?v=a2zpL3-hz-A)

    - [CSS Triggers](https://csstriggers.com/) by Paul Lewis indicates what changes
    in CSS will trigger Layout, Paint and Composite operations in the Blink engine
    (Chrome/Opera)'
