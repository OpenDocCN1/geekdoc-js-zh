    \  }\n}\n```\n\n# 5. Thou shalt use variables for sizing, colours and z-index\n\
    \nFor any project of size, setting variables for sizing, colours and z-index is\
    \ essential.\n\nUIs are typically based upon some form of grid or sizing ratio.\
    \ Therefore sizing should be based upon set sizes, and sensible delineations of\
    \ those sizes. For example here is 11px based sizing and variants as variables:\n\
    \n```\n$size-full: 11px;\n$size-half: 5.5px;\n$size-quarter: 2.75px;\n$size-double:\
    \ 22px;\n$size-treble: 33px;\n$size-quadruple: 44px;\n```\n\nFor a developer,\
    \ the use of variables offers additional economies. For example, it saves colour\
    \ picking values from composites. It also helps to normalise designs.\n\nFor example,\
    \ if a project uses only 13, 15 and 22px font sizes and a change comes through\
    \ requesting 14px font-sizing, the variables provide some normalisation reference.\
    \ In this case, should the fonts be 13 or 15px as 14 is not used anywhere else?\
    \ This allows developers to feedback possible design inconsistencies to the designers.\n\
    \nThe same is true of colour values. For example, suppose we have a variable for\
    \ the hex #333. We can write that as a variable like this:"
