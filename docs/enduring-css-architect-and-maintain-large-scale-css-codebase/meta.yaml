    # Reiterating the benefits


    As namespaced modules and components are almost guaranteed to not leak into one
    another, it makes it incredibly easy to build out and iterate on new designs.
    It affords a hitherto un-thinkable blanket of impunity. Just make a new partial
    file for the thing you are building, assign a suitable micro-namespace and module
    name and write your styles, confident in the fact you won’t be adversely affecting
    anything you don’t want to. If the new thing you are building doesn’t work out,
    you can just delete the partial file, also confident that you won’t be removing
    the styles for something else. CSS authoring and maintenance confidence - finally!


    # Source order becomes unimportant


    As our rules are now isolated, it makes the order of rules in a style sheet unimportant.
    This benefit becomes essential when working on a large-scale project. In these
    scenarios it is often preferable for partial files to be assembled in any order.
    With rules isolated from each other, this is simple. With our ‘self-quarantined’
    rules, it makes file globbing of partial styles sheets simple and risk free. With
    some basic tooling in place you can compile all the CSS partials within a module
    in one fell swoop like this:


    ```

    @import "**/*.css";

    ```


    No more writing `@import` statements for every partial in a project and worrying
    about the order it comes in.


    🔑 We will talk more about file globbing in Chapter 9.


