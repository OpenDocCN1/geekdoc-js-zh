    At first glance this may seem like a seemingly unimportant distinction but it
    brings important benefits.

    The code for each component becomes physically self-enclosed. Then, on our enduring
    project, when features need changing or are deprecated, all associated code for
    that module (styles, view logic (HTML) and JS) can be easily updated/removed.


    > **Due credit:** Nicolas Gallagher is always ahead of the game when it comes
