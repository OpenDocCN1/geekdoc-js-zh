- md: " .flex-center {\n    -webkit-box-align: center;\n    -webkit-align-items: center;\n\
    \    -ms-flex-align: center;\n    align-items: center;\n}\n\nThat block was repeated\
    \ **117** times. Doesn't seem like any better reason to abstract to an OOCSS class,\
    \ right? That must be causing some serious bloat right there? Not so fast, Batman!\n\
    \nIf those blocks of code were removed and the file re-gzipped, the CSS file size\
    \ dropped to 41.9 KB.\n\nExtracting the most common and verbose visual pattern\
    \ to an OOCSS class saved just 1KB of CSS over the wire. And despite just a 1KB\
    \ saving in the CSS, factor in that if abstracting those styles to a class, it\
    \ would also be necessary to litter the HTML with the relevant OOCSS classes to\
    \ get the visual effect back.\n\nWas it worth it?\n\nGiven that no other property\
    \ combination had anything like that sort of verbosity and repetition, from a\
    \ file size perspective, certainly not in my book. It would cost a lot of development\
    \ agility (remember abstraction makes authoring and iteration slower as its necessary\
    \ to change both templates and CSS) and responsive flexibility (what if I want\
    \ this thing to do something different in a different viewport) for a minuscule\
    \ gain in CSS weight. It's the CSS equivalent of 'robbing Peter to pay Paul'.\n\
    \nLet me be quite clear. Despite the efficacy of gzip, if your priority is having\
    \ the smallest possible CSS file size, ECSS isn't your best choice. Instead, go\
    \ take a look at [Atomic CSS](https://acss.io). It's creators are smart people,\
    \ indeed, [Th}/{ry Koblentz](https://twitter.com/thierrykoblentz) is one of the\
    \ smartest CSSers I know of. I'm sure ACSS will serve your needs well.\n\nOn the\
    \ other hand, the priorities of ECSS are developer ergonomics (understandable\
    \ class naming conventions), easy maintainability (styles organised by component\
    \ and simple to delete) and style encapsulation (namespacing prevents leaky abstractions).\n\
    \nDifferent problems, different solution.\n\n## Summary\n\nI hope I've given you\
    \ enough to consider that maybe obsessing over repeated property values and pairs\
    \ isn't the best pursuit if you are trying to create maintainable style sheets.\
    \ In the next chapter, besides looking at the benefits of the ECSS naming convention,\
    \ I'll also be arguing that a sound project organisational approach will generate\
    \ far leaner style sheets in the long term than class abstraction and re-use.\n\
    \n## Chapter 5. File organisation and naming conventions\n\n### Project organisation\n\
    \nIf we want to facilitate the easy removal of modular parts from our web-site/application,\
    \ we need to think about the way we organise the files that make up the modules.\n\
    \nOrdinarily, when building web stuff, it's a common pattern to split up files\
    \ in a project by technology type. Consider this basic folder structure:\n\n```\n\
    my-project/\n- html/\n- js/\n- css/\n```\n\nIn each of these folders you might\
    \ name related files. For example:\n\n```\nmy-project/\n- html/\n    - v2ShoppingCart.html\n\
    - js/\n    - v2ShoppingCart.js\n- css/\n    - v2ShoppingCart.css\n```\n\nThe rub\
    \ though is that beyond a certain point, even giving the files related names,\
    \ it's difficult to reason about how each style sheet, logic file and template\
    \ relate. There might be 80+ CSS partials in the CSS folder and 50+ template stubs\
    \ in the html folder.\n\n> I recognise the reality is that the 'view' part of\
    \ a website or application is usually generated by any number of different technologies\
    \ such as Ruby, PHP, .NET or even JavaScript - rather than vanilla HTML.\n\nIt\
    \ then becomes increasingly necessary to rely on 'find' in the text editor to\
    \ find any files that a certain class is being used on. The same is true in reverse;\
    \ 'find' is needed to locate the partial(s) that contains the styles needed for\
    \ a certain module template.\n\nThis structure doesn't make things unworkable,\
    \ just inefficient and it typically requires a little mental orientation to remember\
    \ what goes with what.\n\nWhile not essential for ECSS, it's generally preferable\
    \ that rather than organise by technology type, files are organised and grouped\
    \ by visual or logical component. So, instead of this:\n\n```\nhtml/\n- shopping-cart-template.html\n\
    - callouts-template.html\n- products-template.html\n\njs/\n- shopping-cart-template.js\n\
    - callouts-template.js\n- products-template.js\n\ncss/\n- shopping-cart-template.css\n\
    - callouts-template.css\n- products-template.css\n```\n\nWe aim for something\
    \ like this:\n\n```\nshopping-cart-template/\n- shopping-cart.html\n- shopping-cart.css\n\
    - shopping-cart.js\n```\n\n```\ncallouts-template/\n- callouts.html\n- callouts.js\n\
    - callouts.css\n```\n\n```\nproducts-template/\n- products.html\n- products.js\n\
    - products.css\n```\n\nAt first glance this may seem like a seemingly unimportant\
    \ distinction but it brings important benefits. The code for each component becomes\
    \ physically self-enclosed. Then, on our enduring project, when features need\
    \ changing or are deprecated, all associated code for that module (styles, view\
    \ logic (HTML) and JS) can be easily updated/removed.\n\n> **Due credit:** Nicolas\
    \ Gallagher is always ahead of the game when it comes to thinking about CSS implementations\
    \ at scale and I took and adapted large elements (specifically code organisation\
    \ by component) of this approach from his work. I'd been name-spacing components\
    \ for some time (and I'm therefore claiming pseudo multiple discovery) but the\
    \ approach of organising code by component is taken entirely from hearing him\
    \ talk on this matter.\n\nWith the exception of intentionally 'global' CSS, all\
    \ code that relates to the presentation of a component or module should be included\
    \ in the partials that sit alongside the HTML/JS of that component.\n\nAlthough\
    \ you may not like it, there's always a degree of global CSS needed; at the very\
    \ least a simple set of reset or normalise styles for example.\n\nWhere the CSS\
    \ and application logic (e.g. JS/PHP/Ruby) can be stored in the same folder, so\
    \ much the better. This makes it even easier to know what CSS code is relevant\
    \ to a module and what is not.\n\nWhen a module is deprecated, all language files\
    \ associated with it can be easily removed from the codebase in one go; just delete\
    \ the modules containing folder.\n\nJust to be crystal clear, consider this folder\
    \ structure for our imagined ShoppingCart component:\n\n```\nShoppingCart/\n \
    \ - ShoppingCart.js\n  - ShoppingCart.css\n```\n\nNow suppose we create a new\
    \ shopping cart:\n\n```\nv2ShoppingCart/\n  - v2ShoppingCart.js\n  - v2ShoppingCart.css\n\
    ```\n\nAs soon as our v2 shopping cart is finished, it's easy to remove the code\
    \ for old version from our code base, we just delete the containing ShoppingCart\
    \ folder.\n\n### When same folder organisation isn't possible\n\nIt may not be\
    \ possible or preferable to contain style sheets and application logic within\
    \ the same folder.\n\nIn that situation, the next best choice is to mimic the\
    \ structure of the logic. To exemplify. Suppose the logic for a component is stored\
    \ in a folder structure like this:\n\n```\nsrc/app/v2ShoppingCart/v2ShoppingCart.js\n\
    ```\n\nWe should mimic this structure as far as possible. On any sizeable application\
    \ this will make locating related files easier. So we might do this:\n\n```\n\
    src/app/css/v2ShoppingCart/v2ShoppingCart.css // matching the folder hierarchy\
    \ of the logic part of the module as much as possible\n```\n\nSame parent folder\
    \ should definitely be considered the 'gold' standard when using ECSS but in the\
    \ absence of that, mimicking the structure of the logic files should provide some\
    \ of the benefits.\n\nWith a concrete idea of how to organise the files within\
    \ our project, let's turn to the principle way in which we can convey additional\
    \ meaning and developer convenience to our selectors/classes.\n\n## Naming classes\
    \ and selectors with ECSS\n\nBack in Chapter 3, I recognised the benefits that\
    \ the BEM approach of naming CSS selectors gave us. Naming a block and then naming\
    \ any child elements in relation to that block created a namespace for the child\
    \ elements.\n\nName-spacing the CSS of a module creates a form of isolation. By\
    \ preventing name collisions with other elements, chunks of CSS can be more easily\
    \ moved from one environment to another (from prototype to production for example).\
    \ It's also far less likely that a change of styles on one selector would inadvertently\
    \ affect another."
