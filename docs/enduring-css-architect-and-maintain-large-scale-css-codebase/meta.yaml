  mdcn: "\n我不太喜欢那样。我们在嵌套选择器，把样式绑定到元素上，这基本上是我们通常想要避免的所有ECSS问题。不过，说实话，这很可能是我们能做的最佳折中了。只要有可能，我们绝对应该给元素添加类。然而，有些情况下这根本做不到，而那些时候，再多的象牙塔式理想主义也帮不上忙。记住\"\
    因地制宜\"！\n\n## 总结\n\n在这一章中，我们已经了解了应用ECSS的两种主要方式。我们还考虑了一个完整模块的可能文件夹结构。我希望到这时，你已经对如何在自己的项目中应用ECSS有了相当清晰的想法。\n\
