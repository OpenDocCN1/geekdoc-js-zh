  md: '# # Chapter 3. Implementing perceived wisdom


    > You often don''t really understand the problem until after the first time you
    implement a solution - [The Cathedral and the Bazaar](https://en.wikipedia.org/wiki/The_Cathedral_and_the_Bazaar)


    In the last chapter we considered some of the more obvious difficulties of dealing
    with a large CSS codebase. In this chapter, we''ll consider some existing approaches
    for dealing with those problems.


    Over the course of two years I''ve been on a CSS architecture and maintenance
    odyssey. Near the beginning of the experience I did what any sensible developer
    should do. I looked to see how smart people had dealt with the problem already.


    🔍 Due to the inherent issues of scaling CSS, CSS architectural approaches can
    seem like the equivalent of diet pills for the overweight. It''s easy to snatch
    at apparent solutions, hoping they''ll be exactly what you need. However, you
    probably don''t know exactly what you need until you''ve tried to solve your problems
    at least once. That advice applies here too. It maybe that ECSS isn''t the solution
    to the problems you have so if you''re just starting to solve your CSS issues,
    be sure to consider what different methodologies offer.


    At the time, the principle approaches for dealing with CSS at scale were:


    +   - OOCSS (Object Orientated CSS), developed by [Nicole Sullivan](https://github.com/stubbornella)

    - SMACSS (Scalable and Modular Architecture for CSS), developed by [Jonathan Snook](https://snook.ca/)'
