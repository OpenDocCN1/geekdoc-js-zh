    # ## Nodes within a component


    To recap. Used in this way, the ECSS naming convention of nodes within a component
    should always be:


    ```

    ns-Component_Node-variant

    ```


    +   - **ns** : the micro-namespace (always lowercase)

    - **-Component** : the Component name (always upper camel-case)

    - **_Child** : the child node of a component (always upper camel-case preceded
    by an underscore)

    - **-variant** : the optional variant of a node (always lowercase and preceded
    by a hyphen)


    # ### Variants


    Note that the -variant part of a node within a component is optional and should
    only be used to denote subtle variations on otherwise identical items. For example,
    multiple sport classification headers that are identical apart from a differing
    background image might be rendered like this:


    ```

    <div class="sb-Classification_Header sb-Classification_Header-2"></div>

    ```


    # ## A note on working with generated content from a CMS


