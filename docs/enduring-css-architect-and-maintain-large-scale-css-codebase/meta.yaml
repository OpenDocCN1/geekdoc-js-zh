    \ needs to be. This makes any future overrides more difficult to reason about\
    \ and perform.\n\nWhile it may seem overly verbose, this is how that scenario\
    \ should be handled:\n\n```\n<p class=\"ch-ShoppingCart_TextIntro\">Here is the\
    \ contents of your cart. You currently have <b class=\"ch-ShoppingCart_TextIntroStrong\"\
    >5 items</b>.</p>\n```\n\nAnd this CSS:\n\n```\n.ch-ShoppingCart_TextIntro {\n\
    \    /* Styles for the text */\n}\n\n.ch-ShoppingCart_TextIntroStrong {\n    /*\
    \ Styles for the bold section within */\n}\n```\n\nEach element has its own selector\
    \ and rule. Neither depends upon the other. Neither rule requires particular markup\
    \ to be applied.\n\n> Each rule applied to an element should be as opinionated\
    \ about its own appearance as possible. For example, if you have an element that\
    \ contains two text nodes it seems logical to apply the font size and line height\
    \ to the wrapping element so the two text nodes will inherit from it. However,\
    \ this prevents that text node being moved to another location and rendering consistently.\
    \ Instead, apply the color, font-size and line-height to each node, even if they\
    \ are initially very similar (perhaps at the outset only the colour differs).\
    \ It will seem counter-intuitive at first but protects against possible deviations\
    \ in the future (being moved in the DOM, styles diverging etc).\n\n## Applying\
    \ ECSS methodology with visual components\n\n'Visual' components refers to areas\
    \ of markup that are not necessarily generated by a particular piece of application\
    \ logic.\n\nYou can still break areas into logical **visual** areas and apply\
    \ ECSS to them. This is the approach employed on the [http://ecss.io](http://ecss.io)\
    \ website.\n\nThere are no hard and fast rules. As an example, we might break\
    \ a design into visual areas for Structure, Menu, Footer, Navigation, Quick Jump\
    \ Menu, Hero Image etc.\n\nAnd in this case, our selectors look like this:\n\n\
    ```\n.st-Header {\n    /* Structural container for header */\n}\n\n.st-Footer\
    \ {\n    /* Structural container for footer */\n}\n```\n\nHowever, we might just\
    \ as easily do this:\n\n```\n.hd-Outer {\n    /* Structural container for header\
    \ */\n}\n\n.ft-Outer {\n    /* Structural container for footer */\n}\n```\n\n\
    Or even like this if it's the module:\n\n```\n.hd-Header {\n    /* Structural\
    \ container for the Header module */\n}\n\n.ft-Footer {\n    /* Structural container\
    \ for the footer module */\n}\n```\n\nNone of those is wrong or right. As long\
    \ as child nodes/selectors follow the same naming convention, the styles will\
    \ be isolated to the particular area.\n\nThe reality is that on smaller sites,\
    \ you could use pretty much any class-naming approach you like and the dangers\
    \ of collision would be minimal. However, as soon as projects start to grow the\
    \ benefits of namespacing and a strict naming convention will start to pay you\
    \ back handsomely.\n\n## Organising Modules, their Components and naming files\n\
    \nAt this point, I think it will be useful to consider a more detailed example\
    \ module structure. It's similar to the structure in which I'm used to employing\
    \ ECSS. It's a little more involved than our prior examples and gives another\
    \ subtly different variation on how files could be organised and selectors named.\
    \ As ever, from our CSS point of view our aim is isolation, consistency and solid\
    \ developer ergonomics. Let's take a look.\n\nSuppose we have a module. Its job\
    \ is to load the sidebar area of our site. The directory structure might initially\
    \ look like this:\n\nSidebarModule/ => everything SidebarModule related lives\
    \ in here\n\n- `/assets` => any assets (images etc) for the module\n- `/css` =>\
    \ all CSS files\n- `/min` => minified CSS/JS files\n- `/components` => all component\
    \ logic for the module in here\n- `css-namespaces.json` => a file to define all\
    \ namespaces\n- `SidebarModule.js` => logic for the module\n- `config.json` =>\
    \ config for the module\n\nIn terms of the example markup structure this Module\
    \ should produce, we would expect something like this initially:\n\n```\n<div\
    \ class=\"sb-SidebarModule\">\n\n</div>\n```\n\nThe CSS that styles this initial\
    \ element should live inside the css folder like this:\n\n```\nSidebarModule/\n\
    \  /assets\n  /css\n    /components\n    SidebarModule.css\n  /min\n  /components\n\
    \  css-namespaces.json\n  SidebarModule.js\n  config.json\n```\n\nNow, suppose\
    \ we have a component inside the SidebarModule that creates a header for the SidebarModule.\
    \ We might name the component with a file called `Header.js` and store it inside\
    \ the `components/` sub-folder of our SidebarModule like this:\n\nSidebarModule/\n\
    \  /assets\n  /css\n    /components\n    SidebarModule.css\n  /min\n  /components\n\
    \    **Header.js**\n  css-namespaces.json\n  SidebarConfig.js\n  SidebarModule.js\n\
    \  config.json\n\nWith that in place, the Header.js might render markup like this:\n\
    \n```\n<div class=\"sb-SidebarModule\">\n    <div class=\"sb-Header\">\n     \
    \   <div class=\"sb-Header_Logo\"></div>\n    </div>\n</div>\n```\n\nNote how\
    \ the Header component, due to being within the context of the SidebarModule carries\
    \ the `sb-` micro-namespace to designate its parentage. And the nodes created\
    \ by this new component are named according to the logic that creates them.\n\n\
    In terms of the general conventions to follow:\n\nComponents should carry the\
    \ micro-namespace of the originating logic. If you are creating a component that\
    \ sits within a module, it should carry a/the namespace of the originating module\
    \ (possible namespaces for a module are defined in `css-namespaces.json`).\n\n\
    HTML classes/CSS selectors should be named according to the file name/components\
    \ that generated them. For example, if we created another component inside our\
    \ module called 'HeaderLink.ts' which renders its markup inside a child of the\
    \ `Header.ts` component, then the markup it generates and the applicable CSS selectors\
    \ should match this file name.\n\nFor example:\n\n```\n<div class=\"sb-SidebarModule\"\
    >\n    <div class=\"sb-HeaderPod\">\n        <div class=\"sb-HeaderPod_Logo\"\
    ></div>\n    </div>\n    <div class=\"sb-HeaderPod_Nav\">\n        <div class=\"\
    sb-HeaderLink\">Node Value</div>\n        <div class=\"sb-Header萝1\">Node Value</div>\n\
    \        <div class=\"sb-HeaderLink\">Node Value</div>\n        <div class=\"\
    sb-HeaderLink\">Node Value</div>\n    </div>\n</div>\n```\n\nIn terms of the folder\
    \ structure, it would now look like this:\n\n```\nSidebarModule/\n  /assets\n\
    \  /css\n    /components\n      Header.css\n      HeaderLink.css\n    SidebarModule.css\n\
    \  /min\n  /components\n    Header.ts\n    HeaderLink.ts\n  css-namespaces.json\n\
    \  SidebarConfig.ts\n  SidebarModule.ts\n  tsconfig.json\n```\n\nNotice how there\
    \ is a 1:1 correlation between component logic (the *.ts file) and the associated\
    \ styles (the *.css files) – both sit within a `ui` sub-folder. Although both\
    \ logic and styles don't share the same immediate parent folder, they both live\
    \ within the same module folder, making removal of the entire module simple if\
    \ needed.\n\n## Nodes within a component\n\nTo recap. Used in this way, the ECSS\
    \ naming convention of nodes within a component should always be:\n\n```\nns-Component_Node-variant\n\
    ```\n\n- **ns** : the micro-namespace (always lowercase)\n- **-Component** : the\
    \ Component name (always upper camel-case)\n- **_Child** : the child node of a\
    \ component (always upper camel-case preceded by an underscore)\n- **-variant**\
    \ : the optional variant of a node (always lowercase and preceded by a hyphen)\n\
    \n### Variants\n\nNote that the -variant part of a node within a component is\
    \ optional and should only be used to denote subtle variations on otherwise identical\
    \ items. For example, multiple sport classification headers that are identical\
    \ apart from a differing background image might be rendered like this:\n\n```\n\
    <div class=\"sb-Classification_Header sb-Classification_Header-2\"></div>\n```\n\
    \n## A note on working with generated content from a CMS\n\nIt's probable that\
    \ if you use ECSS with any sort of Content Management System (Wordpress, Ghost,\
    \ Drupal et al) you will encounter a situation where it's not possible to add\
    \ a class to every element. For example, in a Wordpress page or post, it would\
    \ be unrealistic to expect users entering content to remember the right class\
    \ to add to each paragraph tag. In these situations, I think pragmatism has to\
    \ win out.\n\nSet a ECSS class to the enclosing element and (grudgingly) accept\
    \ that all the nested elements will be set with a type selector. Here's some example\
    \ markup:\n\n```\n<main class=\"st-Main\">\n    <h1>How to survive in South Central?</h1>\n\
    \    <p>A place where bustin' a cap is fundamental. </p>\n    <ul>\n        <li>Rule\
    \ number one: get yourself a gun. A nine in yo' ass'll be fine</li>\n        <li>Rule\
    \ number two: don't trust nobody.</li>\n    </ul>\n\n</main>\n```\n\nHere is how\
    \ you might author the CSS to handle selecting those elements:\n\n```\n.st-Main\
    \ {\n    h1 {\n        /* Styles for h1 */\n    }\n    p {\n        /* Styles\
    \ for p */\n    }\n    ul {\n        /* Styles for ul */\n    }\n    li {\n  \
    \      /* Styles for li */\n    }\n}\n```"
  mdcn: "\n 2. 由于第 1 点，我们创建了一个比实际需要更具体的选择器。这使得任何未来的覆盖都更难推理和执行。\n\n虽然这可能显得过于冗长，但这就是该场景的处理方式：\n\
    \n```\n<p class=\"ch-ShoppingCart_TextIntro\">Here is the contents of your cart.\
    \ You currently have <b class=\"ch-ShoppingCart_TextIntroStrong\">5 items</b>.</p>\n\
    ```\n\n以及对应的 CSS：\n\n```\n.ch-ShoppingCart_TextIntro {\n    /* Styles for the\
    \ text */\n}\n\n.ch-ShoppingCart_TextIntroStrong {\n    /* Styles for the bold\
    \ section within */\n}\n```\n\n每个元素都有自己的选择器和规则。两者互不依赖。两条规则都不需要特定的标记来应用。\n\n> 应用于元素的每条规则应尽可能对其自身外观有明确的定义。例如，如果你有一个包含两个文本节点的元素，将字体大小和行高应用于包装元素似乎是合乎逻辑的，这样两个文本节点可以继承它。然而，这会阻止该文本节点被移动到另一个位置并一致地渲染。相反，将颜色、字体大小和行高应用于每个节点，即使它们最初非常相似（也许一开始只有颜色不同）。一开始这似乎会违反直觉，但可以防止未来可能出现的偏差（在\
    \ DOM 中被移动、样式分化等）。\n\n## 将 ECSS 方法论应用于视觉组件\n\n\"视觉\"组件指的是不一定由特定应用程序逻辑生成的标记区域。\n\
    \n你仍然可以将区域划分为逻辑的**视觉**区域并对其应用 ECSS。这是 [http://ecss.io](http://ecss.io) 网站采用的方法。\n\
    \n没有硬性规定。例如，我们可以将设计划分为结构、菜单、页脚、导航、快速跳转菜单、主图等视觉区域。\n\n在这种情况下，我们的选择器看起来像这样：\n\n\
    ```\n.st-Header {\n    /* Structural container for header */\n}\n\n.st-Footer\
    \ {\n    /* Structural container for footer */\n}\n```\n\n然而，我们也可以很容易地这样做：\n\n\
    ```\n.hd-Outer {\n    /* Structural container for header */\n}\n\n.ft-Outer {\n\
    \    /* Structural container for footer */\n}\n```\n\n或者如果是模块的话，甚至可以像这样：\n\n```\n\
    .hd-Header {\n    /* Structural container for the Header module */\n}\n\n.ft-Footer\
    \ {\n    /* Structural container for the footer module */\n}\n```\n\n这些做法没有对或错。只要子节点/选择器遵循相同的命名约定，样式就会隔离到特定区域。\n\
    \n现实情况是，在较小的网站上，你可以使用几乎任何你喜欢的类命名方法，冲突的风险极小。然而，一旦项目开始增长，命名空间和严格命名约定的好处就会开始丰厚地回报你。\n\
    \n## 组织模块、它们的组件以及命名文件\n\n在这一点上，我认为考虑一个更详细的示例模块结构会很有用。它与我习惯使用 ECSS 的结构类似。它比我们之前的示例稍微复杂一些，提供了文件如何组织和选择器如何命名的另一种微妙不同的变体。一如既往，从我们的\
    \ CSS 角度来看，我们的目标是隔离、一致性和良好的开发者体验。让我们来看一下。\n\n假设我们有一个模块。它的工作是加载我们网站的侧边栏区域。目录结构最初可能看起来像这样：\n\
    \nSidebarModule/ => 所有与 SidebarModule 相关的内容都放在这里\n\n- `/assets` => 模块的任何资源（图片等）\n\
    - `/css` => 所有 CSS 文件\n- `/min` => 压缩后的 CSS/JS 文件\n- `/components` => 模块的所有组件逻辑都在这里\n\
    - `css-namespaces.json` => 定义所有命名空间的文件\n- `SidebarModule.js` => 模块的逻辑\n- `config.json`\
    \ => 模块的配置\n\n就示例标记结构而言，这个模块最初应该产生类似这样的内容：\n\n```\n<div class=\"sb-SidebarModule\"\
    >\n\n</div>\n```\n\n样式化这个初始元素的 CSS 应该放在 css 文件夹中，如下所示：\n\n```\nSidebarModule/\n\
    \  /assets\n  /css\n    /components\n    SidebarModule.css\n  /min\n  /components\n\
    \  css-namespaces.json\n  SidebarModule.js\n  config.json\n```\n\n现在，假设我们在 SidebarModule\
    \ 中有一个组件，它为 SidebarModule 创建一个标题。我们可以将组件命名为名为 `Header.js` 的文件，并将其存储在 SidebarModule\
    \ 的 `components/` 子文件夹中，如下所示：\n\nSidebarModule/\n  /assets\n  /css\n    /components\n\
    \    SidebarModule.css\n  /min\n  /components\n    **Header.js**\n  css-namespaces.json\n\
    \  SidebarConfig.js\n  SidebarModule.js\n  config.json\n\n有了这个设置，Header.js 可能会渲染如下标记：\n\
    \n```\n<div class=\"sb-SidebarModule\">\n    <div class=\"sb-Header\">\n     \
    \   <div class=\"sb-Header_Logo\"></div>\n    </div>\n</div>\n```\n\n注意 Header\
    \ 组件由于其位于 SidebarModule 的上下文中，因此带有 `sb-` 微命名空间来标示其父级。而这个新组件创建的节点则根据其创建的命名逻辑来命名。\n\
    \n关于一般约定需要遵循：\n\n组件应携带源逻辑的微型命名空间。如果你正在创建一个位于模块内的组件，它应携带源模块的命名空间（模块的可能命名空间在 `css-namespaces.json`\
    \ 中定义）。\n\nHTML 类/CSS 选择器应根据文件名/生成它们的组件来命名。例如，如果我们在模块中创建了另一个名为 'HeaderLink.ts'\
    \ 的组件，它在 `Header.ts` 组件的子元素内渲染其标记，那么它生成的标记以及适用的 CSS 选择器应与该文件名匹配。\n\n不虚此行：\n\n\
    ```\n<div class=\"sb-SidebarModule\">\n    <div class=\"sb-HeaderPod\">\n    \
    \    <div class=\"sb-HeaderPod_Logo\"></div>\n    </div>\n    <div class=\"sb-HeaderPod_Nav\"\
    >\n        <div class=\"sb-HeaderLink\">节点值</div>\n        <div class=\"sb-Header萝1\"\
    >节点值</div>\n        <div class=\"sb-HeaderLink\">节点值</div>\n        <div class=\"\
    sb-HeaderLink\">节点值</div>\n    </div>\n</div>\n```\n\n就文件夹结构而言，现在它看起来像这样：\n\n\
    ```\nSidebarModule/\n  /assets\n  /css\n    /components\n      Header.css\n  \
    \    HeaderLink.css\n    SidebarModule.css\n  /min\n  /components\n    Header.ts\n\
    \    HeaderLink.ts\n  css-namespaces.json\n  SidebarConfig.ts\n  SidebarModule.ts\n\
    \  tsconfig.json\n```\n\n注意组件逻辑（*.ts 文件）和相关样式（*.css 文件）之间存在 1:1 的对应关系——两者都位于 `ui`\
    \ 子文件夹中。尽管逻辑和样式不共享相同的直接父文件夹，但它们都位于同一个模块文件夹中，使得在需要时可以轻松移除整个模块。\n\n## 组件内的节点\n\n\
    回顾。以这种方式使用时，组件内节点的 ECSS 命名约定应始终为：\n\n```\nns-Component_Node-variant\n```\n\n-\
    \ **ns** : 微型命名空间（始终为小写）\n- **-Component** : 组件名称（始终为大驼峰式）\n- **_Child** : 组件的子节点（始终为大驼峰式，前面加下划线）\n\
    - **-variant** : 节点的可选变体（始终为小写，前面加连字符）\n\n### 变体\n\n请注意，组件内节点的 -variant 部分是可选的，应仅用于表示基本相同项的细微变化。例如，多个运动分类标题，除了背景图片不同外完全相同，可以这样渲染：\n\
    \n```\n<div class=\"sb-Classification_Header sb-Classification_Header-2\"></div>\n\
    ```\n\n## 关于与 CMS 生成内容协作的说明\n\n如果你将 ECSS 与任何类型的内容管理系统（Wordpress、Ghost、Drupal 等）一起使用，你很可能会遇到无法为每个元素添加类的情况。例如，在\
    \ Wordpress 页面或文章中，期望输入内容的用户记住要添加到每个段落标签的正确类是不现实的。在这些情况下，我认为实用主义必须占上风。\n\n为包含元素设置一个\
    \ ECSS 类，并（不情愿地）接受所有嵌套元素将使用类型选择器设置。以下是一些示例标记：\n\n```\n<main class=\"st-Main\"\
    >\n    <h1>How to survive in South Central?</h1>\n    <p>A place where bustin'\
    \ a cap is fundamental. </p>\n    <ul>\n        <li>Rule number one: get yourself\
    \ a gun. A nine in yo' ass'll be fine</li>\n        <li>Rule number two: don't\
    \ trust nobody.</li>\n    </ul>\n\n</main>\n```\n\n以下是你可能编写 CSS 来选择这些元素的方式：\n\n\
    ```\n.st-Main {\n    h1 {\n        /* Styles for h1 */\n    }\n    p {\n     \
    \   /* Styles for p */\n    }\n    ul {\n        /* Styles for ul */\n    }\n\
    \    li {\n        /* Styles for li */\n    }\n}\n```\n"
