    \n在编写样式表时，关键选择器应该只被编写一次。这使我们可以搜索代码库中的关键选择器，并为我们的选择器找到一个\"唯一的真相来源\"。得益于扩展CSS语法的使用，发生在该关键选择器上的**一切**都可以被封装在单个规则块中。\n\
