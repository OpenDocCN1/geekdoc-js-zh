    \n.class-on-sidebar .widget {\n    /* 为什么这个不起作用 */\n}\n```\n\n| 选择器 | 内联 | ID\
    \ | 类 | 类型 |\n| --- | --- | --- | --- | --- |\n| .widget | 0 | 0 | 1 | 0 |\n|\
    \ aside#sidebar .widget | 0 | 1 | 1 | 1 |\n| .class-on-sidebar .widget | 0 | 0\
    \ | 2 | 0 |\n"
