  md: '# # Chapter 4. Introducing ECSS


    In the last chapter we considered existing CSS methodologies and where, for your
    humble authors needs, they fell short.


    I''m not about to try and convince you that the Enduring CSS approach is the ''Alpha
    and the Omega''. However, it does have different strengths and aims than the existing
    approaches. Therefore, even if taking it wholesale doesn''t appeal, I''d hope
    there may be something you can borrow to solve your own issues.


    Highlights of ECSS:


    +   - It gains maintainability by isolating each visual pattern.

    - File size remains minimal over long periods of time by virtue of the fact that
    you can cut out sections/features/components with impunity.

    - Rules are ''self-quarantining''.

    - Class names/selectors can communicate context, originating logic and variation.

    - All language/technology fileswavell files that create a module are contained
    within a shared folder.


    When I first wrote about Enduring CSS I was expecting a backlash of sorts. At
    that time (August 2014), no-one was really advocating what I was suggesting. Common
    perceived wisdom was to abstract visual patterns, normalise designs as much as
    possible and DRY out code. Enduring CSS is in some ways the antithesis of these
    beliefs.


    > > In case you aren''t aware of the acronym, DRY stands for Don''t Repeat Yourself,
    a popular goal when coding so that logic is only written once in a codebase to
    provide a single source of truth'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Before we get into this, I think it may help to clarify the terminology that
    will be used. The terms used to define the visual parts of a page are known by
    different names in different approaches. There’s nothing revelatory in what I’m
    suggesting or the terms I’m using, it’s just important we’re all on the same page
    before we get into this.


    # Defining terminology


    I’m using the term ‘module’ to designate an area of functionality and/or the code
    that creates it. To exemplify, the header of a website could be considered a module.
    The header module would, in turn, be made up of other smaller pieces of functionality.
    For example, drop down menus or search boxes. These nested pieces of functionality
    would be defined as components. Finally, our smallest ‘items’ would be the child
    nodes that make up a component or module.

    So, to reiterate:


    +   - a **module** is the widest, visually identifiable, individual section of
    functionality.

    - **components** are the nested pieces of functionality that are included within
    a module

    - **child nodes** are the individual parts that go to make up a component (typically
    nodes in the DOM)


    For brevity, for what follows, when I’m referring to modules, it could be a module
    or component. The difference from a ECSS authoring perspective is unimportant.


    # The problems ECSS solves


    My primary goal with ECSS was to isolate styles as opposed to abstracting them.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Ordinarily, it makes sense to make CSS classes that are abstractions of common
    functionality. The benefit being that they can then be re-used and re-applied
    on many varied elements. That’s sound enough in principle. The problem is, on
    larger and more complicated user interfaces, it becomes impossible to make even
    minor tweaks and amendments to those abstractions without inadvertently effecting
    things you didn’t intend to. A guiding principle with ECSS therefore was to isolate
    styles to the intended target. Depending upon your goals, even at the cost of
    repetition, isolation can buy you greater advantages; allowing for predictable
    styling and simple decoupling of styles.


    A further advantage of isolating styles is that designers can be encouraged to
    bring whatever they needed making, without needing them to be encumbered by existing
    visual patterns. Every new module that needs to be coded can be a ‘greenfield’.
    I found that I could code out designs far faster when starting from scratch than
    attempting to build them from any number of vague abstractions.


    # Dealing with specificity


    I also wanted to negate issues surrounding specificity. To this ends, I adopted
    the widely used approach of insisting all selectors used a single (or as close
    to that ideal as possible) class-based selector.


    > If you’re having CSS problems I feel bad for you son, I got 99 problems but
    specificity ain’t one.


    https://twitter.com/benfrain/status/537339394706141184


    Furthermore, structural HTML elements (with the exception of pseudo-elements)
    are NEVER referenced in the style sheets as type selectors. In addition ID selectors
    are completely avoided in ECSS. Not because ID selectors are bad per se, but because
    we need a level playing field of selector strength.'
  merge: -1
  pgno: 34
- img_proc: true
  md: "'Changes' to components are handled via simple overrides. However, the way\
    \ they are handled from an authoring perspective makes them easy to manage and\
    \ reason about.\n\nSuppose you have an element that needs to be a different width\
    \ if it is within a certain container - easy peasy, we don't need to be draconian\
    \ in the manner an override can happen. We don't need a modifier applied to that\
    \ specific element. We can handle very loose and typical scenarios but manage\
    \ them confidently. You would write it like this in the authoring style sheets:\n\
    \n```\n.my-Module_Component {\n    width: 100%;\n    /* If in the sidebar */\n\
    \    .sw-Sidebar & {\n        width: 50%;\n    }\n}\n```\n\nAnd it would yields\
    \ this CSS:\n\n```\n.my-Module_Component {\n  width: 100%;\n}\n\n.sw-Sidebar .my-Module_Component\
    \ {\n  width: 50%;\n}\n```\n\nThis may seem like a subtle benefit. After all,\
    \ we may be authoring things a little differently, by nesting the overrides, but\
    \ the net result is typical CSS; an element that gets different styles based upon\
    \ a different and more specific selector.\n\nHowever, by authoring a key selector\
    \ just once and writing all the over- rides for that selector within a single\
    \ rule block it has proved incredibly"
