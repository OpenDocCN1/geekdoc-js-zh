    \ important for ongoing maintenance and an OOCSS didn't facilitate this need well.\n\
    \n## SMACSS\n\nSMACSS, which stands for Scalable Modular Architecture for CSS,\
    \ is detailed fully in [Jonathan Snook's book on the subject](https://smacss.com/).\
    \ I'm not going into detail about SMACSS here as I think you should go and check\
    \ that book out for yourself. Reading SMACSS gave me plenty to chew over as I\
