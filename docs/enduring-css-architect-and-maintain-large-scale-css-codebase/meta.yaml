    >\n    <a href=\"#\" class=\"media__img\">\n        <img class=\"media__headshot\"\
    \ src=\"mini.jpg\" alt=\"Stubbornella\" />\n    </a>\n    <div class=\"media__attribution\"\
    >@Stubbornella 14 minutes ago</div>\n</div>\n```\n\nWhat's so useful about this\
    \ naming scheme is that it clearly communicates a relationship between the elements\
    \ and the block they belong to. Plus, away from the HTML, if we came across a\
