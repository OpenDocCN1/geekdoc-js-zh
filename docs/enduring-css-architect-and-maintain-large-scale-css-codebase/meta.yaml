    My first big lesson when employing OOCSS therefore was the same lesson that the
    fine fellow Kaelig Deloumeau-Prigent learnt in his time working on large CSS codebases
    at the BBC and The Guardian newspaper:


    > Two years ago I wrote a book where I was preaching DRY code, but after working
    on enduring projects, it’s “decoupling” that became more important to me.


    On large, rapidly changing projects, being able to easily decouple visual modules
    from the project is incredibly important for ongoing maintenance and an OOCSS
    didn’t facilitate this need well.


    # SMACSS


    SMACSS, which stands for Scalable Modular Architecture for CSS, is detailed fully
    in [Jonathan Snook’s book on the subject](https://smacss.com/). I’m not going
    into detail about SMACSS here as I think you should go and check that book out
    for yourself. Reading SMACSS gave me plenty to chew over as I faced my own challenges
    and I certainly took things, such as how to think about state changes, from it.
    However, I will detail why SMACSS didn’t work for me. Again, like my caveat regarding
    my opinions on OOCSS, this isn’t a critique of SMACSS. It’s simply highlighting
    the parts that didn’t work for me and why I felt it failed to solve my own problems.
    SMACSS has clearly defined terminology and concepts for the visual aspects of
    a website. It therefore prescribes base, layout, modules and optional theme rules/files
    to support these definitions. For example, consider this suggested file structure:'
  - '[PAGE 27]


    ```

    +-layout/

    | +-grid.scss

    | +-alternate.scss

    +-module/

    | +-callout.scss

    | +-bookmarks.scss

    | +-btn.scss

    | +-btn-compose.scss

    +-base.scss

    +-states.scss

    +-site-settings.scss

    +-mixins.scss"

    ```


    > Excerpt From: Jonathan Snook. "Scalable and Modular Architecture for CSS."


    While these definitions make perfect sense in many scenarios, they didn''t for
    mine. I wanted an approach that was looser, an approach that didn''t make me need
    to consider fitting what I needed to build into those visual definitions; the
    applications I was building and maintaining often defied adherence to those definitions.


    # BEM


    BEM is a methodology developed by the developers at http://yandex.ru.


    The key thing I took from BEM (which stands for Block Element Modifier) is just
    how much a naming convention can buy you when it comes to CSS maintenance.


    ![](img/599d07ddffb980e572103ffb27d26093_27_0.png)


    If you are interested in reading more about BEM, the canonical resource is http://en.bem.info.
    For a good explanation of where it all began I recommend starting here: https://en.bem.info/method/history//history/'
  - "[PAGE 28]\n\nAgain, like SMACSS I’m not going to attempt to fully explain the\
    \ ins and outs of BEM methodology. However, I will give you the ‘elevator pitch’\
    \ explanation of the key points. The BEM methodology works around the notion that\
    \ key areas of a page can be defined as ‘Blocks’. In turn, those key areas are\
    \ made up of Elements. We can then represent the relationship between the Block\
    \ and its Elements in the way we name things. Consider the OOCSS media object\
    \ example from before. In a BEM approach we might use classes like this:\n\n```\n\
    <div class=\"media\">\n    <a href=\"#\" class=\"media__img\">\n        <img class=\"\
    media__headshot\" src=\"mini.jpg\" alt=\"Stubbornella\" />\n    </a>\n    <div\
    \ class=\"media__attribution\">@Stubbornella 14 minutes ago</div>\n</div>\n```\n\
    \nWhat’s so useful about this naming scheme is that it clearly communicates a\
    \ relationship between the elements and the block they belong to. Plus, away from\
    \ the HTML, if we came across a selector like this in the CSS:\n\n```\n.media__headshot\
    \ {\n\n}\n```\n\nWe instantly know that this is a Element called ‘headshot’ that\
    \ lives inside a Block called ‘media’. This namespacing a component as part of\
    \ something else helps to isolate styles and prevent the applied styles from ‘leaking’\
    \ out – one of my major bug-bears with OOCSS. This was definitely a step in the\
    \ right direction for the problems I was trying to solve.\nBEM also has the notion\
    \ of ‘modifiers’. A modifier is something that gets added to the Block to modify\
    \ its appearance. Suppose we wanted to theme our media object differently in a\
