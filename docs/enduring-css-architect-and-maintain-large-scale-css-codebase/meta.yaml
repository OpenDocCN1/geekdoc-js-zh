    \ or don't put whitespace where required. Generally speaking, you can use linters\
    \ to enforce any kind of coding conventions you like and while more than useful\
    \ when working alone, they can be a Godsend when working in teams: where many\
    \ (careless) hands touch the code.\n\n## Chapter 8. The Ten Commandments of Sane\
    \ Style Sheets\n\n72\n\n## Rationale\n\nWhen we are authoring ECSS, we want to\
