  md: 'This keeps the context of the module in tact and merely indicates a variant
    of this same class is being applied.


    > You should be aware that there is a particularly large fly in the ointment of
    using attribute selectors to communicate state. Certain older versions of Android
    (Android 4.0.3 stock browser as an example) don’t force a re-calculation of styles
    when an attribute value is changed. The upshot of this is that any styles that
    rely on a attribute won’t work dynamically (for example when toggled with JavaScript).
    There are two possible workarounds. Firstly, you can toggle a class somewhere
    in the DOM at the same time you change the attribute. Alternatively, you can initiate
    the attribute selectors by listing empty rules for each somewhere in the CSS.
    Even chaining together works e.g. [aria-thing][aria-thing2]{}. Either option certainly
    adds an undesirable complication to proceedings. A bug report of this behaviour
    can be found for WebKit here: https://bugs.webkit.org/show_bug.cgi?id=64372 and
    the workaround mentioned came courtesy of this Stack Overflow question: http://stackoverflow.com/questions/6655364/css-attribute-selector-descendant-gives-a-bug-in-webkit/


    # Summary


    Using WAI-ARIA states to communicate changes in the DOM provides styling hooks
    that are as useful and easy to use as HTML classes. Although purely preference,
    I’m also a fan of the fact that an entirely different selector is used to communicate
    state in the style sheets; it is simpler to spot within a rule.


    None of those prior factors really get you anything new. What using WAI-ARIA states
    will do, virtually for free, is start to provide a better means of communicating
    your web applications state to users of assistive technology. If money talks,
    consider also that by using WAI-ARIA you are widening your product up to a greater
    number of users (see the additional info below).'
