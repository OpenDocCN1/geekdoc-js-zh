- img_proc: true
  md: '**Namespace**


    As discussed above, the first part of a HTML class/CSS selector is the micro namespace
    (all lowercase/train-case). The namespace is used to prevent collisions and provide
    some soft isolation for easier maintenance of rules.


    **Module or Component**


    This is the visual module or piece of logic that created the selector. It should
    be written in upper camel case. I’ve seen ECSS applied to great effect when the
    module or component directly references the name of the file that creates it.
    For example, a file called ‘CallOuts.js’ could have a selector such as `sw-CallOuts`
    (the `sw-` micro namespace here used to denote it would be used ‘Site Wide’).
    This removes any ambiguity for future developers as to the origin point of this
    element.


    **Child Node**


    If something UpperCamelCase is preceded by an underscore (_) it is a child node
    of a module or component.


    For example:


    ```

    `.sc-Item_Header {}`

    ```


    Here, `_Header` is indicating that this node is the ‘Header’ child node of the
    ‘Item’ module or component that belongs to the ‘sc’ namespace (and if it it were
    a component, that namespace could indicate the parent module).


    **Variant**


    If something is all lowercase/train-case and not the first part of a class name
    it is a variant flag. The variant flag is reserved for eventualities where many
    variants of a selector need to be referenced. Suppose we have a module that needs
    to display a different background image depending upon what category number has
    been assigned to it. We might use the variant indicator like this:'
  merge: -1
  pgno: 52
- img_proc: true
  md: "```\n.sc-Item_Header-bg1 {} /* Image for category 1 */\n.sc-Item_Header-bg2\
    \ {} /* Image for category 2 */\n.sc-Item_Header-bg3 {} /* Image for category\
    \ 3 */\n```\n\nHere the `-bg3` part of the selector indicates that this `.sc-Item_Header`\
    \ is the category 3 version (and can therefore have an appropriate style assigned).\n\
    \n# ## Doubling up on ECSS selectors\n\nOur previous example indicates a perfect\
    \ situation where it would be appropriate to use 2 classes on the element. One\
    \ to assign default styles and another to set specifics to a variant.\n\nConsider\
    \ this markup:\n\n```\n<div class=\"sc-Item_Header sc-Item_Header-bg1\">\n   \
    \ <!-- Stuff -->\n</div>\n```\n\nHere we would set the universal styles for the\
    \ element with `sc-Item_Header` and then the styles specific to the variant with\
    \ `sc-Item_Header-bg1`. There's nothing revolutionary about this approach, I'm\
    \ just documenting it here to make it clear there is nothing in the ECSS approach\
    \ that precludes this practice.\n\n# ## Summary\n\nWe've covered a lot of detail\
    \ in this chapter. The two main areas we looked at were how to organise the language\
    \ files of our project so that they can be more easily maintained and how to name\
    \ classes and selectors in ECSS so that the class of an element in the DOM can\
    \ tell us everything we need to know about it's origin purpose and intended context.\
    \ We also had a detailed look at the accepted syntax for ECSS selectors. Where\
    \ and how to apply casing differences to delineate different parts of the selector.\
    \ So far, we have only concerned ourself with static elements. In the next chapter\
    \ we will look at how ECSS deals with state change of elements."
