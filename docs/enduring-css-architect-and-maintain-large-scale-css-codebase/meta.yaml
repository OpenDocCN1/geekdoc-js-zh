  md: '# Chapter 8. The Ten Commandments of Sane Style Sheets


    72


    # Rationale


    When we are authoring ECSS, we want to avoid producing CSS that suffers from being
    overly specific, littered with unneeded prefixes, poorly commented and full of
    ‘magic’ numbers.

    The following 10 rules set-out what are considered to be the most important rules
    to achieve this goal.


    # Definitions used throughout:


    +   * **override**: a situation where the values of a key selector are purposely
    amended based upon inheritance

    * **key selector**: the right most selector in any CSS rule

    * **prefixes**: vendor specific prefixes e.g. `-webkit-transform`;

    * **authoring style sheets**: the files we author the styling rules in

    * **CSS**: the resultant CSS file generated by the tooling and ultimately consumed
    by the browser


    Let’s now consider each rule and the problem it aims to solve.


    # 1. Thou shalt have a single source of truth for all key selectors


    In the authoring style sheets, a key selector should only be written once. This
    allows us to search for a key-selector in the code base and find a ‘single source
    of truth’ for our selector. Thanks to the use of an extended CSS syntax, EVERYTHING
    that happens to that key selector can be encapsulated in a single rule block.

    Overrides to the key selector are handled by nesting and referencing the key selector
    with the ‘parent’ selector. More of which shortly.

    Consider this example:'
  merge: -1
  pgno: 76
- img_proc: true
  md: "# Chapter 8. The Ten Commandments of Sane Style Sheets\n\n```\n.key-Selector\
    \ {\n    width: 100%;\n    @media (min-width: $M) {\n        width: 50%;\n   \
    \ }\n    .an-Override_Selector & {\n        color: $color-grey-33;\n    }\n}\n\
    ```\n\nThat would yield the following in the CSS:\n\n```\n.key-Selector {\n  width:\
    \ 100%;\n}\n\n@media (min-width: 768px) {\n  .key-Selector {\n    width: 50%;\n\
    \  }\n}\n\n.an-Override_Selector .key-Selector {\n  color: #333;\n}\n```\n\nIn\
    \ the authoring style sheets, the key selector (`.key-Selector`) is never repeated\
    \ at a root level. Therefore, from a maintenance point of view, we only have to\
    \ search for `.key-Selector` in the code base and we will find everything that\
    \ could happen to that key selector described in a single location; a single source\
    \ of truth.\n\n+   - What happens if we need it to display differently in a different\
    \ view-port size?\n- What happens when it lives within containerX?"
