    \ 0;\n$zi-below-ground: -1;\n```\n\n## 6. 必须始终使用移动优先的方式编写规则（避免使用 max-width）\n\n\
    对于任何响应式工作，我们都希望在样式中采用移动优先的理念。因此，规则根目录中的属性和值应该是适用于最小视口（例如移动设备）的属性。然后，我们在需要时使用媒体查询来覆盖或添加这些样式。\n\
    \n请看这个例子：\n\n```\n.med-Video {\n    position: relative;\n    background-color:\
    \ $color-black;\n    font-size: $text13;\n    line-height: $text15;\n    /* 在中等尺寸时，我们希望增大文字\
    \ */\n    @media (min-width: $M) {\n        font-size: $text15;\n        line-height:\
    \ $text18;\n    }\n    /* 在更大的视口中，文字和行高再次变化 */\n    @media (min-width: $L) {\n\
    \        font-size: $text18;\n        line-height: 1;\n    }\n}\n```\n\n这会生成如下\
    \ CSS：\n\n```\n.med-Video {\n  position: relative;\n  background-color: #000;\n\
    \  font-size: 13px;\n  line-height: 15px;\n}\n\n@media (min-width: 768px) {\n\
    \  .med-Video {\n    font-size: 15px;\n    line-height: 18px;\n  }\n}\n\n@media\
    \ (min-width: 1200px) {\n  .med-Video {\n    font-size: 18px;\n    line-height:\
    \ 1;\n  }\n}\n```\n\n我们只需要在不同的视口处更改字体大小和行高，所以我们只修改这些。通过在媒体查询中使用 min-width（而不是\
    \ max-width），如果字体大小和行高在更大的视口尺寸下需要保持不变，我们就不需要额外的媒体查询。只有当属性随着视口尺寸增大而发生变化时，我们才需要媒体查询。因此，不鼓励将\
    \ max-width 作为媒体查询的唯一参数。\n\n底线是：使用 min-width 而不是 max-width 编写媒体查询。唯一的例外是，如果你想要将某些样式隔离到中间的范围内。例如，在中等和大型视口之间。示例：\n\
    \n```\n.med-Video {\n    position: relative;\n    background-color: $color-black;\n\
    \    font-size: $text13;\n    line-height: $text15;\n    /* 在中等和大型尺寸之间，我们希望增大文字\
    \ */\n    @media (min-width: $M) and (max-width: $L) {\n        font-size: $text15;\n\
    \        line-height: $text18;\n    }\n}\n```\n\n## 7. 谨慎使用 mixins（并避免使用 @extend）\n\
    \n避免将代码抽象为 mixins 的诱惑。有一些领域非常适合使用 mixins。例如 CSS 文本截断的代码（如 `@mixin Truncate`）或\
    \ iOS 风格的惯性滚动面板，这些需要为不同的浏览器处理多个伪选择器。另一个好的用例可以是复杂的字体栈。\n\n字体栈很难处理，编写起来也很繁琐。处理字体最合理的方式是让\
    \ body 使用最常见的字体栈，然后在需要时只更换为不同的字体栈。\n\n例如：\n\n```\n.med-Video {\n    position:\
    \ relative;\n    background-color: $color-black;\n    font-size: $text13;\n  \
    \  line-height: $text15;\n    /* 在中等尺寸时，我们希望增大文字 */\n    @media (min-width: $M)\
    \ {\n        @mixin FontHeadline;\n        font-size: $text15;\n        line-height:\
