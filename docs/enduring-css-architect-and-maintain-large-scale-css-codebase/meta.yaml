  md: '# # Chapter 7. Applying ECSS to web applications


    ECSS is an approach well suited to developing the CSS codebases of large applications.


    Typically, from a logic perspective (e.g. the JavaScript/TypeScript/Ruby/whatever),
    a particular file will be generating ''a thing''. It can therefore make a lot
    of sense to use that file name as the name for the module or component of a module.
    If a file is called ''Header.js'' and generates the container for the header,
    any component parts of that header would be named accordingly. For example, a
    company registration number might get `sw-Header_Reg` as its class. By extension,
    a search box component inside the header might have classes like `sw-HeaderSearch_Input`
    (the input box created by the `HeaderSearch.js` file).


    # ## An example


    Let''s consider an example. Suppose we are authoring a JavaScript client-side
    application and we have a JavaScript component called ''ShoppingCartLines.js''.
    It''s task is to render out the lines within a shopping cart and it in turn displays
    within a module called ''ShoppingCart.js''. The ''ShoppingCart'' module renders
