    \n## 总结\n\n使用 WAI-ARIA 状态来传达 DOM 中的变化，提供了与 HTML 类一样实用且易于使用的样式钩子。虽然纯属个人偏好，但我也很喜欢在样式表中使用完全不同的选择器来传达状态；这样在规则中更容易识别。\n\
    \n上述这些先决因素实际上并不能给你带来任何新的东西。使用 WAI-ARIA 状态所能做的，几乎是免费的，就是开始提供一种更好的方式，向辅助技术用户传达你的\
    \ Web 应用程序状态。如果谈钱的话，也可以考虑通过使用 WAI-ARIA，你可以将产品开放给更多的用户（参见下面的附加信息）。\n\n因此，使用 WAI-ARIA\
    \ 状态和属性，是采用 ECSS 方法论的项目中传达状态的推荐方式。\n\n## 来自英国皇家盲人协会（RNIB）的附加信息和统计数据\n\n[英国皇家盲人协会（RNIB）](http://www.rnib.org.uk/)\
