    # # Chapter 7. Applying ECSS to web applications


    ECSS is an approach well suited to developing the CSS codebases of large applications.


    Typically, from a logic perspective (e.g. the JavaScript/TypeScript/Ruby/whatever),
    a particular file will be generating ''a thing''. It can therefore make a lot
    of sense to use that file name as the name for the module or component of a module.
    If a file is called ''Header.js'' and generates the container for the header,
    any component parts of that header would be named accordingly. For example, a
    company registration number might get `sw-Header_Reg` as its class. By extension,
    a search box component inside the header might have classes like `sw-HeaderSearch_Input`
    (the input box created by the `HeaderSearch.js` file).


    # ## An example


    Let''s consider an example. Suppose we are authoring a JavaScript client-side
    application and we have a JavaScript component called ''ShoppingCartLines.js''.
    It''s task is to render out the lines within a shopping cart and it in turn displays
    within a module called ''ShoppingCart.js''. The ''ShoppingCart'' module renders
    out anything to do with the shopping cart itself. Straight forward enough so far.


    Now let''s complicate our imagined scenario a little by suggesting that our shopping
    cart will work within a modal view in some scenarios and as part of the page,
    in normal document flow, in others.


    In this instance, we have a wider module: ''ShoppingCart'' and a component that
    typically lives within the module called ''ShoppingCartLines''. Each of those
    will have their own child nodes. The module and component have two'
  - '[PAGE 62]


    possible views: in a modal and in the page. Let''s imagine that the switch of
    contexts would be handled by the application logic.


    Our constant is the module itself and we can use a namespace to provide context
    for it. We always use the full name of the application module or component as
    the module section of the ECSS style selector. This has the benefit of making
    all HTML classes explicit as to their origin and purpose.


    > When naming the class for the outermost container of a module or component,
    no child extension should be added to the class/s-elector. Only the child parts
    of a module or component should get the node extension.


    OK, so, at this point, our selectors could be named like this in the CSS:


    ```

    .mod-ShoppingCart {} /*Modal*/

    .page-ShoppingCart {} /*Page*/

    .mod-ShoppingCartLines {} /*Modal*/

    .page-ShoppingCartLines {} /*Page*/

    ```


    This way our module and component have their two contexts isolated by a namespace
    switch. We are free to style each as we see fit with no potential leakage of styles
    from one to the other. This is the exact kind of scenario that typically becomes
    fraught when components and modules share HTML classes in the interest of abstraction
    and re-use.


    Let''s consider a twist on this scenario. Let''s suppose we don''t switch contexts
    with application logic. Instead, we have a switch of styles with media queries.
    We have a modal implementation at smaller viewports and the page style at larger
    viewports.


    In this instance, we could have a single namespace e.g. `sc-ShoppingCart` (I''m
    using `sc-` to designate the context is ''ShoppingCart'') and use media queries
    in the CSS to provide visual changes.


    For example:'
