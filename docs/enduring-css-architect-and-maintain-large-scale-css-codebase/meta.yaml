  md: 'Different interpretations of DRY I wasn''t convinced that the goal of DRY code
    that other CSSers were pursuing and extolling the virtues of, was the same kind
    of DRY code I wanted. To explain that a little more - I didn''t care much about
    repeated values and pairs across my rules, which is what most people were concentrating
    on DRYing out. What I cared about was key selectors not being repeated in the
    codebase. Key selectors were my ''single source of truth'' and that was the area
    I wanted to DRY out. To that ends, with ECSS, an authoring convention is enforced
    that prevents a key selector being defined more than once project wide. We will
    get into that in much more detail in the ''Ten Commandments of Sane Style Sheets''
    chapter.


    We will cover file system organisation and naming conventions in the next chapter.
    First though I think it''s important to deal with a possible ''elephant in the
    room''. I solemnly try and convince you that eliminating repetition of properties
    and values across files may not buy as much, from a maintenance perspective, as
    a solid and contained set of modules that are easy to remove from a codebase as
    needed.


    # Embracing Repetition


    The ECSS approach embraces repetition in the properties and values of the CSS.


    With ECSS, every single visual module or component is written with a micro-namespace
    to provide isolation from modules and components. Here is a typical example of
    an authored ECSS rule (the authoring syntax is very similar to Sass, but typically
    facilitated by PostCSS):'
