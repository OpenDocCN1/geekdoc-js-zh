    \ | 0 | 0 | 2 | 0 |"
  mdcn: "\n ## 第 1 章. 持久型 CSS\n\n为快速变化、长期存在的 Web 项目编写样式\n\n## 简介\n\n这其实不是一本关于如何编写\
    \ CSS（即花括号内的内容）的书。它是一本关于 CSS 的组织与架构的书；也就是花括号之外的部分。这些考虑事项在小项目中可以轻松地忽略掉，但在大型项目中，它们却会成为编写\
    \ CSS 时最困难的部分。\n\n像“大规模 CSS”或“CSS 规模化”这样的术语可能显得相当模糊。我将尝试澄清一下。\n\n## 定义问题\n\n持久型\
    \ CSS（Enduring CSS）诞生于我自己对为大型 Web 应用编写 CSS 制定一种理性方法的需求。\n\n以下是该应用在 iPad 上的截图：\n\
    \n![](img/599d07ddffb980e572103ffb27d26093_9_0.png)\n\nhttp://mobile.bet365.com，2015\
    \ 年\n\n这是一个响应式应用，允许用户在全球范围内对体育赛事进行投注。右上角的场地部分提供了所选比赛的实时呈现，并配有动画 SVG。当体育赛事进行时，左下角的赔率和比赛分数会实时更新，右下角的赛事历史时间线摘要也会持续更新。\n\
    \n由于该应用的复杂性，经过多次迭代，CSS 逐渐变得难以驾驭。它难以继续迭代，难以理解，而且没人确切知道哪里存在多余的 CSS，是否可以安全地移除而不至于无意中影响到应用的其他部分。如果你曾经接手过一个大型\
    \ CSS 代码库，相信你能感同身受。\n\n因此，在我开始这段旅程之初，我定义了一些基本需求。更简单来说，这些是任何新的 CSS 编写方法都必须解决的问题。以下就是这些需求的清单：\n\
    \n- 允许长期轻松维护大型 CSS 代码库\n- 允许将部分 CSS 代码从代码库中移除，而不会影响剩余的样式\n- 能够对新设计进行快速迭代\n- 修改应用于某个视觉元素的属性和值时，不应意外影响到其他元素\n\
    - 任何解决方案都应只需要最少的工具和工作流改动即可实施\n- 在可能的情况下，应使用 W3C 标准（如 ARIA）来传达用户界面中的状态变化\n\n在下一章中，我们将更具体地审视这些问题。不过，首先，一个重要的警示。\n\
    \n## 解决你自己的问题\n\n我相信“Pin Cing Do”，大致翻译为“[*务实编码之道*](link)”。这意味着解决你实际遇到的问题。因此，我要\
    \ upfront 声明一些对某些人而言可能显而易见的事情：\n\n可能我遇到的问题并不是你遇到的问题。因此，你应该相应地斟酌本书提供的建议和方法。或者，考虑你的需求可能更适合由其他方法和方法论来解决。我不会试图说服你\
    \ ECSS 在所有情况下都是最佳解决方案。例如：\n\n- ECSS 无法给你最小的 CSS 体积（如果需要，请考虑 [Atomic CSS](link)）。\n\
    - 它并未被广泛使用和记录（如果普及性是主要关注点，请考虑 [BEM](link)）。\n- ECSS 不会抽象样式，也不允许通过一堆特定的实用类来为元素设置样式。如果你需要那个，应该看看\
    \ OOCSS 并阅读其众多倡导者的文章。\n\n好的，公共服务公告到此结束。让我们继续进入下一章。在那里，我们将审视在大型项目中使用 CSS 时的主要问题：特异性、层叠、隔离以及与结构元素绑定的选择器。\n\
    \n## 第 2 章. 规模化 CSS 的问题\n\n在大多数项目中，CSS 都从一些简单的规则开始。一开始，除非做了相当愚蠢的事情，否则很难让 CSS 的维护变得困难。\n\
    \n然而，随着项目的发展，CSS 也在增长。需求变得更加复杂。更多的作者参与到样式的编写中。边缘情况和浏览器兼容性处理需要编写并纳入考量。事情很容易迅速变得混乱不堪。\n\
    \n让我们考虑一下一个简单小组件不断增长的需求：\n\n- “当小组件位于侧边栏时，我们能缩小字体大小吗？”\n- “在首页时，小组件能有不同的背景色吗？”\n\
    - “在较大的视口中，我们能让小组件内部的内容垂直堆叠吗？”\n- “当小组件在产品页的侧边栏中时，字体颜色需要改变”\n\n不久之后，我们需要为基选择器编写一整套覆盖规则。让我们考虑一下我们可能需要的各种选择器：\n\
    \n```css\n.widget {\n    /* 基础样式 */\n}\n\naside#sidebar .widget {\n    /* 侧边栏专属\
    \ */\n}\n\nbody.home-page aside#sidebar .widget {\n    /* 首页侧边栏专属 */\n}\n\n@media\
    \ (min-width: 600px) {\n    .widget {\n        /* 600px 及以上的基础样式 */\n    }\n\n\
    \    aside#sidebar .widget {\n        /* 600px 及以上的侧边栏专属 */\n    }\n\n    body.home-page\
    \ aside#sidebar .widget {\n        /* 600px 及以上的首页侧边栏专属 */\n    }\n}\n\nbody.product-page\
    \ .widget {\n    /* 产品页专属 */\n}\n\nbody.product-page aside#sidebar .widget {\n\
    \    /* 产品页侧边栏专属 */\n}\n```\n\n如果这是我们想要规模化的 CSS，那么其中存在一些基本的编写问题。现在让我们来审视一下这些规则中一些更明显的问题。\n\
    \n## 特异性\n\n规模化 CSS 的第一个主要问题是我们想要绕过特异性问题。通常情况下，特异性是有用的。它允许我们在 CSS 中引入某种形式的逻辑。在浏览器中，更具特异性的样式会得以应用。我们上面的例子展示了这一点：不同的规则会在不同的情况下应用（例如，在侧边栏中时，我们想要覆盖默认样式）。\n\
    \n现在，CSS 选择器可以由 ID、类、属性及类型选择器以及它们的任意组合构成。对于响应式设计，你还可以将媒体查询也纳入其中。\n\n然而，并非所有选择器都是平等的。W3C\
    \ 在这里描述了特异性是如何计算的：[http://www.w3.org/TR/css3-selectors/#specificity](http://www_resources264com/resources264.com/TR/css3-selectors/#specificity)。以下是最相关的部分：\n\
    \n> 选择器的特异性计算如下：计算选择器中 ID 选择器的数量（= a）计算选择器中类选择器、属性选择器和伪类选择器数量（= b）计算选择器中类型选择器和伪元素选择器数量（=\
    \ c）忽略通用选择器否定伪类内部的选择器按任何其他选择器一样计算，但否定本身不计算为伪类。将三个数字 a-b-c 连接起来（采用大基数数字系统）即得到特异性。\n\
    \n那里缺少一个重要的东西是 style 属性。[其他地方的说明](elsewhere)告诉我们：\n\n> style 属性中的声明应用于该属性所属的元素。在层叠中，这些声明被视为具有作者来源和高于任何选择器的特异性。\n\
    \n因此，在元素的 style 属性中应用的样式将比 CSS 文件中同等规则更具特异性。\n\n无论如何，这里最大的要点是 ID 选择器比基于类的选择器具有无限更高的特异性。这使得覆盖任何包含\
    \ ID 选择器的选择器要困难得多。例如，对于侧边栏中的小组件，这样是行不通的：\n\n```css\n.widget {\n    /* 侧边栏中的小组件\
