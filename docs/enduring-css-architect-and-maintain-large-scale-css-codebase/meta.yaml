    # Responsive issues


    I consider [Atomic CSS](https://en.wikipedia.org/wiki/Atomic_CSS) (not to be confused
    with [Atomic Design](https://atomicdesign.bradfrost.com/)) to represent OOCSS
    taken the the nth-degree. Let’s consider an imaginary Atomic CSS example:


    ```

    <div class="blk m-10 fr">Here I am</div>

    ```


    In this OOCSS/Atomic CSS example, the visual needs of the element have been split
    up/abstracted into re-usable classes. One sets a block formatting context (`.blk`),
    another sets some margin (`.m-10`) and finally one provides a floating mechanism
    for the element (`.fr`). Un-opinionated and terse for sure.


    > In principle, Atomic CSS is very similar to the first architectural approach
    I devised.


    It was called ‘PST!’ which was an acronym for Position Structure Theme. The idea
    was this: there would be no semantic HTML classes/CSS selectors. Instead, every
    element on the page could be described by it’s position, structure and theme.
    Each new selector would just take the next available number. For example, `s1`,
    `s2`, `s3` and on and on. It wasn’t quite a class for each responsibility as is
    the case with Atomic CSS but it was a way of heavily abstracting stylistic needs.


    Markup looked like this:


    `<div class="p1 s3 t4">Content</div>`


    Like Atomic CSS it was terse, and there was no pondering on what to call something
    as you authored but in practice it was hugely problematic. Reasoning about the
    created DOM was tricky as it was near impossible to'
