    # If ARIA can''t be used


    If, for whatever reason, you aren''t able to use aria-* attributes to communicate
    state in a site or application. I now tend to lean towards naming selectors without
    using the micro-namespace to designate state. For example, instead of:


    ![](img/599d07ddffb980e572103ffb27d26093_58_0.png)


    ```

    <button class="co-Button is-Selected">Old Skool Button</button>

