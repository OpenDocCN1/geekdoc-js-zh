    \ For example:\n\n```\naside#sidebar ul > li a {\n    /* Styles */\n}\n```\n\n\
    In this case we need to have an 'a' tag inside an 'li' which is a direct child\
    \ of a 'ul' inside an 'aside' element with an ID of 'sidebar' - phew!\n\nWhat\
    \ happens if we want to apply those styles to a div somewhere else? Or any other\
    \ markup structure?\n\nWe've just unnecessarily tied our rule to specific markup\
    \ structure. It's often quite tempting to do this, as it can seem ridiculous to\
    \ add a class to something as (seemingly) trivial as an 'a' or 'span' tag. However,\
    \ I hope once you reach the end of ECSS you'll be convinced to avoid the practice.\n\
    \n## The cascade\n\nTypically, the cascade part of CSS is useful. It allows equivalent\
    \ rules further down the CSS file to be applied over rules higher up.\n\nHowever,\
    \ in a large codebase it becomes an unwanted safety net, allowing authors to continually\
    \ add CSS to the codebase.\n\nThis can happen for a number of reasons. As an example,\
    \ authors more familiar with other languages often lack the confidence or intimate\
    \ knowledge of the CSS codebase to be able to confidently remove existing code.\
    \ They therefore take the safe option and override existing rules using a more\
    \ specific set of rules. In practical terms this means adding the new rules, with\
    \ whatever selectors are necessary to get the job done, to the bottom of the existing\
    \ styles.\n\nThis is a common and frustrating scenario developers face when they\
    \ inherit a CSS codebase; bloated CSS files that have been a breeding ground for\
    \ CSS cruft.\n\n## Summary\n\nAt this point, we've covered some of the high level\
    \ problems that are symptomatic of a CSS codebase struggling to cope at scale.\
    \ We've looked at the problems of specificity and the cascade. In the next chapter,\
    \ we'll look at the accepted wisdom and approaches of trying to tame large CSS\
    \ codebases and consider any shortcomings they present.\n\n## Chapter 3. Implementing\
    \ perceived wisdom\n\n> You often don't really understand the problem until after\
    \ the first time you implement a solution - [The Cathedral and the Bazaar](https://en.wikipedia.org/wiki/The_Cathedral_and_the_Bazaar)\n\
    \nIn the last chapter we considered some of the more obvious difficulties of dealing\
    \ with a large CSS codebase. In this chapter, we'll consider some existing approaches\
    \ for dealing with those problems.\n\nOver the course of two years I've been on\
    \ a CSS architecture and maintenance odyssey. Near the beginning of the experience\
    \ I did what any sensible developer should do. I looked to see how smart people\
    \ had dealt with the problem already.\n\n\U0001F50D Due to the inherent issues\
    \ of scaling CSS, CSS architectural approaches can seem like the equivalent of\
    \ diet pills for the overweight. It's easy to snatch at apparent solutions, hoping\
    \ they'll be exactly what you need. However, you probably don't know exactly what\
    \ you need until you've tried to solve your problems at least once. That advice\
    \ applies here too. It maybe that ECSS isn't the solution to the problems you\
    \ have so if you're just starting to solve your CSS issues, be  sure to consider\
    \ what different methodologies offer.\n\nAt the time, the principle approaches\
    \ for dealing with CSS at scale were:\n\n- OOCSS (Object Orientated CSS), developed\
    \ by [Nicole Sullivan](https://github.com/stubbornella)\n- SMACSS (Scalable and\
    \ Modular Architecture for CSS), developed by [Jonathan Snook](https://snook.ca/)\n\
    - BEM (Block Element Modifier), developed by [Yandex](https://yandex.com)\n\n\
    Now, I'll tell you unashamedly right now, I've stolen elements from each. However,\
    \ none of those actually solved the problems I had.\n\nBefore we get to ECSS proper\
    \ I'd like to go over the brief advantages and disadvantages of each of the existing\
    \ approaches I looked at. That way, at least when we get to ECSS you can appreciate\
    \ the problems it is solving.\n\n## On OOCSS\n\nThe most widely practised, and\
    \ certainly most widely lauded of the existing approaches I looked at was OOCSS.\
    \ That was the first approach that I utilised when trying to wrestle my ever growing\
    \ CSS codebase.\n\nOne of the principal arguments for an OOCSS approach is that\
    \ it removes duplication of code and therefore results in a more maintainable\
    \ CSS codebase. In essence, you build a set of CSS 'Lego' pieces you can then\
    \ use in your HTML/templates to quickly build out designs. The hope is that once\
    \ your OOCSS styles are written they shouldn't grow (much). You re-use where possible\
    \ and extend where needed.\n\nBefore we look at OOCSS I need to get some caveats\
    \ out there.\n\n1. This isn't an attack on OOCSS, Atomic CSS or any related single\
    \ responsibility principle (SRP) approaches. It's merely my argument that a different\
    \ approach, depending upon your goals can offer a preferential outcome.\n2. I'm\
    \ not suggesting that the approach I advocate is a panacea to all CSS scaling\
    \ problems. It is not (there are none).\n\n## Responsive web design, the Achilles\
    \ heel of OOCSS\n\nFor me, the two biggest problems with an OOCSS approach are:\n\
    \n- Responsive Web Design\n- Frequent design changes and on-going maintenance\n\
    \nLet's see if I can demonstrate why I feel these two issues are worth considering.\n\
    \n### Responsive issues\n\nI consider [Atomic CSS](https://en.wikipedia.org/wiki/Atomic_CSS)\
    \ (not to be confused with [Atomic Design](https://atomicdesign.bradfrost.com/))\
    \ to represent OOCSS taken the the nth-degree. Let's consider an imaginary Atomic\
    \ CSS example:\n\n```\n<div class=\"blk m-10 fr\">Here I am</div>\n```\n\nIn this\
    \ OOCSS/Atomic CSS example, the visual needs of the element have been split up/abstracted\
    \ into re-usable classes. One sets a block formatting context (`.blk`), another\
    \ sets some margin (`.m-10`) and finally one provides a floating mechanism for\
    \ the element (`.fr`). Un-opinionated and terse for sure.\n\n> In principle, Atomic\
    \ CSS is very similar to the first architectural approach I devised.\n\nIt was\
    \ called 'PST!' which was an acronym for Position Structure Theme. The idea was\
    \ this: there would be no semantic HTML classes/CSS selectors. Instead, every\
    \ element on the page could be described by it's position, structure and theme.\
    \ Each new selector would just take the next available number. For example, `s1`,\
    \ `s2`, `s3` and on and on. It wasn't quite a class for each responsibility as\
    \ is the case with Atomic CSS but it was a way of heavily abstracting stylistic\
    \ needs.\n\nMarkup looked like this:\n\n`<div class=\"p1 s3 t4\">Content</div>`\n\
    \nLike Atomic CSS it was terse, and there was no pondering on what to call something\
    \ as you authored but in practice it was hugely problematic. Reasoning about the\
    \ created DOM was tricky as it was near impossible to discern one section of DOM\
    \ from another.\n\nHowever, what happens when the viewport changes and we don't\
    \ want 10px margin or the item floating?\n\nWe could of course make some classes\
    \ to do things at certain breakpoints. For example, `Mplus-cc2` might change a\
    \ colour at an Mplus breakpoint. But I find this practice to be slow and laborious.\
    \ Making very specific changes at certain breakpoints and tying them to a class\
    \ that has to be added to the HTML seems needlessly complex. Furthermore, you\
    \ inevitably end up with a raft of SRP classes in your style sheets that are obsolete.\
    \ What's the authoring mechanism for removing any cruft from the authoring styles\
    \ sheets when no longer needed?\n\n### Maintenance and iteration\n\nLet's continuing\
    \ with our prior example. Suppose at some point in the future, we change our product\
    \ to a more progressive layout mechanism; we move from float based layouts to\
    \ Flexbox based layouts. At this point, we will now have twice the maintenance\
    \ burden. We will need to not only change classes in the markup/templates but\
    \ also alter the CSS rules themselves (or write entirely new ones). Furthermore,\
    \ using `float` is redundant with Flexbox so either we leave `.fr` alone (and\
    \ so it continues to exist, needlessly in our CSS) or we make `.fr` responsible\
    \ for something else such as `justify-content: flex-end`. But then what happens\
    \ if we change the flex-direction of our parent at a particular viewport? Arrgggghhhh!\n\
    \nHopefully you can see the inherent shortcomings of an OOCSS approach for maintenance\
    \ when your designs change frequently or you need to render an entirely different\
    \ layout at a different viewport?\n\nAtomic CSS has developed considerably since\
    \ Thierry's article in Smashing Magazine back in 2013. Depending upon your goals,\
    \ it may be just the thing you need, I'd encourage you to check the project out\
    \ at http://acss.io."
  mdcn: "\n因此，你可以在这里看到，中间的选择器比最后一个具有更高的特异性。真糟糕。\n\n在单个或较小的文件中，这并不算是什么大问题。我们只需创建一个更具体的规则。然而，如果你的代码库的\
    \ CSS 分散在许多较小的部分 CSS 文件中，找到一个阻止你的覆盖生效的规则可能会成为不必要的负担。现在，这个问题并不仅限于 ID 选择器。它更像是样式表中权重不均等的选择器所带来的问题。想象一下，一个重量级拳击手对阵一个蝇量级选手。这不是一场公平的比赛。在使用的选择器之间创建公平的竞争环境，比实际使用的选择器本身更重要。\n\
    \n这种不匹配的选择器大杂烩就是特异性问题的核心所在。一旦你的 CSS 代码库有了数百条规则，任何不必要的特异性都会开始成为主要的\"眼中钉\"（那是一个技术性术语）。\n\
    \n所以，总而言之，在我们不断增长的 CSS 代码库中，特异性是一个我们需要解决的问题。\n\n## 与选择器绑定的标记结构\n\n编写大规模 CSS 时另一个典型的失误是使用类型选择器；即与特定标记相关联的选择器。例如：\n\
    \n```\naside#sidebar ul > li a {\n    /* Styles */\n}\n```\n\n在这种情况下，我们需要一个 'a'\
    \ 标签在一个 'li' 内部，而 'li' 是一个 'ul' 的直接子元素，而这个 'ul' 又在一个 ID 为 'sidebar' 的 'aside'\
    \ 元素内部——呼！\n\n如果我们想把这些样式应用到其他地方的 div 呢？或者任何其他的标记结构 OG视讯官网地址 ？\n\n我们只是不必要地将我们的规则与特定的标记结构绑定了。这样做往往很诱人，因为给一个（看似）微不足道的\
    \ 'a' 或 'span' 标签添加类名似乎很荒谬。然而，我希望当你读到 ECSS 的结尾时，你会被说服去避免这种做法。\n\n## 层叠\n\n通常情况下，CSS\
    \ 的层叠部分是有用的。它允许 CSS 文件中更靠下的等效规则覆盖更靠上的规则。\n\n然而，在大型代码库中，它变成了一个不受欢迎的安全网，让作者能够不断地向代码库中添加\
    \ CSS。\n\n这可能出于多种原因。例如，熟悉其他语言的作者往往缺乏对 CSS 代码库的足够信心或深入了解，无法自信地删除现有代码。因此，他们选择了安全的做法，使用更具体的规则集来覆盖现有规则。实际上，这意味着将新规则（以及完成作业所需的任何选择器）添加到现有样式的底部。\n\
    \n这是开发人员在继承 CSS 代码库时面临的一个常见而令人沮丧的场景；臃肿的 CSS 文件已成为 CSS 冗余的温床。\n\n## 总结\n\n到目前为止，我们已经介绍了一些高层级的问题，这些都是\
    \ CSS 代码库在规模上难以应对的症状。我们探讨了特异性和层叠的问题。在下一章中，我们将了解试图驯服大型 CSS 代码库的公认智慧和做法，并考虑它们存在的任何不足。\n\
    \n## 第 3 章 实施公认的智慧\n\n> 往往在你第一次实施解决方案之前，你并不能真正理解问题——[《大教堂与集市》](https://en.wikipedia.org/wiki/The_Cathedral_and_the_Bazaar)\n\
    \n在上一章中，我们考虑了处理大型 CSS 代码库的一些较为明显的困难。在本章中，我们将考虑一些现有的处理这些问题的方法。\n\n在两年的历程中，我一直在进行\
    \ CSS 架构和维护的探索。在经验的初期，我做了任何明智的开发人员都会做的事。我去看看聪明人已经如何处理过这个问题。\n\n\U0001F50D 由于 CSS\
    \ 扩展的固有问题，CSS 架构方法可能相当于超重者的减肥药丸。人们很容易去抓取看似显而易见的解决方案，希望它们正是你所需要的。然而，在你至少尝试过一次解决问题之前，你可能并不知道自己真正需要什么。这个建议在这里也适用。ECSS\
    \ 可能并不是你面临的问题的解决方案，所以如果你刚开始解决你的 CSS 问题，请务必考虑不同方法论所提供的不同方案。\n\n当时，处理大规模 CSS 的主要方法有：\n\
    \n- OOCSS（面向对象的 CSS），由 [Nicole Sullivan](https://github.com/stubbornella) 开发\n\
    - SMACSS（CSS 的可扩展模块化架构），由 [Jonathan Snook](https://snook.ca/) 开发\n- BEM（块元素修饰符），由\
    \ [Yandex](https://yandex.com) 开发\n\n现在，我要毫不掩饰地告诉你，我从每个方法中都借鉴了一些元素。然而，这些方法都没有真正解决我所面临的问题。\n\
    \n在我们进入 ECSS 之前，我想简要介绍一下我所了解的每种现有方法的优缺点。这样，至少当我们谈到 ECSS 时，你可以理解它在解决什么问题。\n\n##\
    \ 关于 OOCSS\n\n在我所了解的方法中，最广泛使用且最受称赞的无疑是 OOCSS。这是我试图控制不断增长 CSS 代码库时首先使用的方法。\n\n\
    支持 OOCSS 方法的主要论点之一是它消除了代码的重复，因此产生了更可维护的 CSS 代码库。本质上，你构建了一组 CSS \"乐高\" 积木，然后可以在你的\
    \ HTML/模板中使用它们来快速构建设计。希望是一旦你的 OOCSS 样式写好了，它们就不应该（太多地）增长。你在可能的情况下重用，在需要时扩展。\n\n\
    在我们了解 OOCSS 之前，我需要先做一些免责声明。\n\n1. 这不是对 OOCSS、Atomic CSS 或任何相关的单一职责原则（SRP）方法的攻击。这只是我的论点，即根据不同的目标，不同的方法可以提供更优选的结果。\n\
    2. 我不建议我所倡导的方法是解决所有 CSS 扩展问题的灵丹妙药。它不是（没有什么是）。\n\n## 响应式设计，OOCSS 的阿喀琉斯之踵\n\n对我来说，OOCSS\
    \ 方法的两大问题是：\n\n- 响应式网页设计\n- 频繁的设计变更和持续维护\n\n让我们看看能否演示为什么我觉得这两个问题值得考虑。\n\n### 响应式问题\n\
    \n我认为 [Atomic CSS](https://en.wikipedia.org/wiki/Atomic_CSS)（不要与 [Atomic Design](https://atomicdesign.bradfrost.com/)\
    \ 混淆）代表了 OOCSS 的极致运用。让我们考虑一个想象中的 Atomic CSS 例子：\n\n```\n<div class=\"blk m-10\
    \ fr\">Here I am</div>\n```\n\n在这个 OOCSS/Atomic CSS 例子中，元素的视觉需求被拆分/抽象成了可重用的类。一个设置块格式化上下文（`.blk`），另一个设置一些边距（`.m-10`），最后，一个为元素提供浮动机制（`.fr`）。确实是无倾向且简洁的。\n\
    \n> 原则上，Atomic CSS 与我设计的第一个架构方法非常相似。\n\n它被称为 'PST!'，这是 Position Structure Theme\
    \ 的缩写。想法是这样的：没有语义化的 HTML 类/CSS 选择器。相反，页面上的每个元素都可以通过其位置、结构和主题来描述。每个新选择器只需使用下一个可用的数字。例如，`s1`、`s2`、`s3`\
    \ 等等。它不完全像 Atomic CSS 那样每个职责一个类，但它是 heavily abstracting stylistic needs（重度抽象样式需求）的一种方式。\n\
    \n标记看起来像这样：\n\n`<div class=\"p1 s3 t4\">Content</div>`\n\n和 Atomic CSS 一样，它很简洁，而且在编写时不需要考虑如何命名某物，但在实践中它非常成问题。对创建\
    \ DOM 的推理很困难，因为几乎无法区分 DOM 的一个部分和另一个部分。\n\n然而，当视口变化而我们不想要 10px 边距或项目浮动时会发生什么？\n\
    \n我们当然可以在某些断点做一些类来实现。例如，`Mplus-cc2` 可能在 Mplus 断点处改变颜色。但我发现这种做法既缓慢又繁琐。在某些断点进行非常具体的更改，并将其与必须添加到\
    \ HTML 的类绑定，似乎 unnecessarily complex（不必要地复杂）。此外，你最终不可避免地会在样式表中得到大量过时的 SRP 类。当不再需要时，从编写样式表中移除任何冗余的创作机制是什么？\n\
    \n### 维护与迭代\n\n让我们继续前面的例子。假设在将来的某个时候，我们将产品改为更先进的布局机制；我们从基于浮动的布局转向基于 Flexbox 的布局。此时，我们现在将有双倍的维护负担。我们不仅需要更改标记/模板中的类，还需要修改\
    \ CSS 规则本身（或编写全新的规则）。此外，使用 `float` 在 Flexbox 中是多余的，所以要么我们不理会 `.fr`（因此它继续存在于我们的\
    \ CSS 中，毫无必要），要么我们让 `.fr` 负责其他事情，比如 `justify-content: flex-end`。但如果我们在特定视口更改父元素的\
    \ flex-direction 呢？啊！\n\n希望你能看到，当设计频繁变化或需要在不同视口渲染完全不同的布局时，OOCSS 方法在维护方面存在的固有缺陷。\n\
    \nAtomic CSS 自 2013 年 Thierry 在 Smashing Magazine 发表文章以来已经发展了很多。根据你的目标，它可能正是你需要的东西，我鼓励你在\
    \ http://acss.io 查看该项目。\n"
