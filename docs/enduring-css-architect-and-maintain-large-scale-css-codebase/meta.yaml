  md: "Chapter 4. Introducing ECSS 32\n\nadvantageous to long term maintenance on\
    \ the projects I have employed the method on.\n\n> If you are interested in the\
    \ recommended authoring syntax of ECSS (e.g. the way the CSS is actually written),\
    \ check out the Chapter 8, The Ten Commandments of Sane Style Sheets.\n\n# This\
    \ is !important\n\nIf on the odd occasion the presence of one one override isn’t\
    \ enough, we can rely on !important.\n\nAlthough !important has little to do with\
    \ specificity, you will likely be aware that in the wrong situation it should\
