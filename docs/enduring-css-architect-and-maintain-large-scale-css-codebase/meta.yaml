  - "[PAGE 16]\n\nSo you can see here that the middle selector has a greater specificity\
    \ than the last. Bummer.\n\nOn a single or smaller file, this isn't that much\
    \ of a big deal. We just create a more specific rule. However, if the CSS of your\
    \ codebase is split across many smaller partial CSS files, finding a rule that\
    \ is preventing your override from working can become an unwanted burden. Now,\
    \ the problem isn't specific to ID selectors. It's more of a problem with unequally\
    \ weighted selectors in the style sheets. Think of it like a heavyweight boxer\
    \ pitted against a flyweight. It's not a fair contest. Creating a level playing\
    \ field across the selectors used is more important than the actual selectors\
    \ used.\n\nThis mis-matched soup of selectors is the crux of the specificity issue.\
    \ As soon as you have a CSS codebase with hundreds of rules, any unneeded specificity\
    \ starts to become a major 'pain in the ass' (that's a technical term).\n\nSo,\
    \ to conclude, specificity is a problem we need to address in an ever-growing\
    \ CSS codebase.\n\n# Markup structure tied to selectors\n\nAnother typical faux\
    \ pas when authoring large scale CSS is using type selectors; selectors that relate\
    \ to specific markup. For example:\n\n```\naside#sidebar ul > li a {\n    /* Styles\
