  md: '# # Chapter 2. The problems of CSS at scale


    In most projects, the CSS starts out with some simple rules. At the outset, you’d
    have to be doing something fairly daft to make maintenance of the CSS problematic.


    However, as the project grows, so too does the CSS. Requirements become more complicated.
    More authors get involved writing the styles. Edge cases and browser workarounds
    need to be authored and factored in. It’s easy for things to get unruly fast.


    Let’s consider the growing demands on a humble widget:


    +   - “When the widget is in the sidebar, can we reduce the font size?”

    - “When we’re on the home page, can the widget have a different background colour?”

    - “Can we have the things inside the widget stacked vertically at larger viewports?”

    - “When the widget is in the sidebar on the product page, the font colour needs
    to change”


    Before long we need to write a whole raft of overrides to a base selector. Let’s
    consider the selectors we might need:'
  merge: -1
