    With a concrete idea of how to organise the files within our project, let’s turn
    to the principle way in which we can convey additional meaning and developer convenience
    to our selectors/classes.


    # Naming classes and selectors with ECSS


    Back in Chapter 3, I recognised the benefits that the BEM approach of naming CSS
    selectors gave us. Naming a block and then naming any child elements in relation
    to that block created a namespace for the child elements.


    Name-spacing the CSS of a module creates a form of isolation. By preventing name
    collisions with other elements, chunks of CSS can be more easily moved from one
    environment to another (from prototype to production for example). It’s also far
    less likely that a change of styles on one selector would inadvertently affect
    another.'
