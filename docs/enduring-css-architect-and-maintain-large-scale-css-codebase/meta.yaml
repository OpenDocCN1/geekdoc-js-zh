    >\n      <ul class=\"tagUl\">\n        <li class=\"tagLi\"><b class=\"tagB\"><a\
    \ href=\"/\" class=\"tagA link\" data-select=\"link\">Select</a></b></li>\n  \
    \    </ul>\n    </div>\n  </div>\n</div>\n```\n\n20 different CSS selection methods\
    \ were tested to colour the inner most nodes red. Each page differed only in the\
    \ rule applied to select the inner most node within the blocks. Here were the\
    \ different selectors tested and a link to the the test page for that selector:\n\
    \n+   1. Data attribute"
