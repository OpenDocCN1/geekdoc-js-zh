  - '[PAGE 54]


    # Chapter 6. Dealing with state


    The majority of web applications need to deal with states.

    First let’s just crystallise what we mean by ‘states’. Consider some examples:


    +   - A user clicks a button.

    - A value in an interface is updated.

    - An area of an interface is disabled.

    - A widget in the interface is busy.

    - An entered value exceeds allowable values.

    - A section of the application starts containing live data.


    All these eventualities require state changes to be communicated in the DOM, so
    that any styles changes necessary can be applied in the front-end of the application
    too.

    The web application itself, rarely actually requires any changes to the DOM to
    keep track of state. Client-side JavaScript applications for example, usually
    have internal means of dealing with state and tracking it. Therefore, until now,
    making changes to the DOM has been purely to affect aesthetic change via CSS (styling
    purposes).


    # How ECSS used to handle state change


    Back in Chapter 3, I related how much I liked the SMACSS approach of communicating
    state. For example:


    ```

    .has-MiniCartActive {}

    ```


    Indicates that on, or somewhere below this node, the ‘Mini Cart’ is active.

    Another example:'
  - '[PAGE 55]


    Chapter 6. Dealing with state 51


    ```

    .is-ShowingValue {}

    ```


    This would communicate that the Component or one within it is showing some value
    (that was previously hidden). Historically, that was how I communicated state
    when applying ECSS. I used a micro-namespaced class, in addition to any existing
    classes on the node to communicate this state. For example:


    +   ![icon](attachment:icon.png)

    .is-Suspended {}

    .is-Live {}

    .is-Selected {}

    .is-Busy {}


    A node using these classes in the DOM might look like this:


    ```

    <button class="co-Button is-Selected">Old Skool Button</button>

    ```


    # Switching to WAI-ARIA


    However, if this information has to go in the DOM purely for styling hooks, it
    may as well lift a little more weight while it’s there.


    These same styling hooks can actually be placed in the DOM as [WAI-ARIA](attachment:WAI-ARIA_link)
    states. The [States and Properties](attachment:States_and_Properties_link) section
    of WAI-ARIA describes the W3C’s standardised manner in which to communicate states
    and properties to assistive technology within an application. In the opening section
    of the abstract description for WAI-ARIA, it contains this:


    > These semantics are designed to allow an author to properly convey user interface
    behaviors (sic) and structural information to assistive technologies in document-level
    markup'
  - '[PAGE 56]


    While the specification is aimed at helping communicate state and properties to
    users with disability (via assistive technology) it serves the need of a web application
    project architecture beautifully. Adopting this approach results in what is (perhaps
    cringingly) referred to as a ‘Win Win’ situation. We get to improve the accessibility
    of our web application, while also gaining a clearly defined, well considered
    lexicon for communicating the states we need in our application logic. Here’s
    the prior example re-written with aria to communicate state:


    ```

    <button class="co-Button" aria-selected="true">Old Skool Button</button>

    ```


    Class handles the aesthetics of the button. The `aria-*` attribute communicates
    the state (if any) of that node or its descendants.


    In JavaScript application land, the only change needed is shifting from `classList`
    amendments for state changes to `setAttribute` amendments. For example, to set
    our button attribute:


    ```

    button.setAttribute("aria-selected", "true");

    ```


    > Be aware that separating concerns in this manner does require an additional
    ‘touchpoint’ in your JavaScript. If you absolutely, positively want the fastest/easiest
    way to handle a state change, doing it once with a `classList` update will be
    faster.


    # ARIA attributes as CSS selectors


    In our preferred CSS syntax, writing that change within a single set of braces
    would look like this:'
  - "[PAGE 57]\n\n```\n.co-Button {\n    background-color: $color-button-passive;\n\
    \    &[aria-selected=\"true\"] {\n        background-color: $color-button-selected;\n\
    \    }\n}\n```\n\nWe use the ampersand (&) as a parent selector and the attribute\
    \ selector to leverage the enhanced specificity having the aria attribute on the\
    \ node provides. Then we can just style the changes as needed.\n\nThe ability\
    \ to nest state changes within a rule in this manner provides increased developer\
    \ ergonomics. The intention is that a rule is only defined at root level once\
    \ throughout the entire application styles. This provides a single source of truth\
    \ to define all possible eventualities pertaining to that class. For more information,\
    \ ensure you read Chapter 8, The Ten Commandments of Sane Style Sheets.\n\n> As\
    \ a related note, the CSS Selectors Level 4 specification makes provision for\
    \ case insensitivity by using a `i` flag before the closing square bracket. For\
    \ example: `.co-Button { background-color: $color-button-passive; &[aria-selected=\"\
    true\" i] { background-color: $color-button-selected; } }` This allows any case\
    \ value variant of the attribute to pass (by default it is case sensitive)\n\n\
    # States and properties, redone with ARIA\n\nSection 6.5.1. of the WAI-ARIA specification\
    \ describes 'Widget Attributes', these contain many of the common states needed\
    \ when working with a web application and rapidly changing data."
  - '[PAGE 58]


    Here are the examples given at the beginning of this chapter re-written using
    ARIA:


    +   - `aria-disabled="true"` (used instead of `is-Suspended`)

    - `aria-live="polite"` (used instead of `.is-Live`, the polite value is one of
    [three possible values](http://) to describe how updates should be communicated)

    - `aria-current="true"` (this one is currently proposed for WAI-ARIA 1.1 [http://www.w3.org/TR/wai-aria-1.1/#aria-current](http://www.w3.org/TR/wai-aria-1.1/#aria-current))

    - `aria-busy="true"` (used instead of `is-Busy`, to indicate the element and it''s
    subtree (if any) are busy


    There are plenty more and the specification is, by W3C specification standards,
    easy to understand.


    # If ARIA can''t be used


    If, for whatever reason, you aren''t able to use aria-* attributes to communicate
    state in a site or application. I now tend to lean towards naming selectors without
    using the micro-namespace to designate state. For example, instead of:


    ![](img/599d07ddffb980e572103ffb27d26093_58_0.png)


    ```

    <button class="co-Button is-Selected">Old Skool Button</button>

    ```


    I would instead recommend using a variant version of the selector like this:


    ```

    <button class="co-Button co-Button-selected">Old Skool Button</button>

    ```'
- md: " This keeps the context of the module in tact and merely indicates a variant\
    \ of this same class is being applied.\n\n> You should be aware that there is\
    \ a particularly large fly in the ointment of using attribute selectors to communicate\
    \ state. Certain older versions of Android (Android 4.0.3 stock browser as an\
    \ example) don't force a re-calculation of styles when an attribute value is changed.\
    \ The upshot of this is that any styles that rely on a attribute won't work dynamically\
    \ (for example when toggled with JavaScript). There are two possible workarounds.\
    \ Firstly, you can toggle a class somewhere in the DOM at the same time you change\
    \ the attribute. Alternatively, you can initiate the attribute selectors by listing\
    \ empty rules for each somewhere in the CSS. Even chaining together works e.g.\
    \ [aria-thing][aria-thing2]{}. Either option certainly adds an undesirable complication\
    \ to proceedings. A bug report of this behaviour can be found for WebKit here:\
    \ https://bugs.webkit.org/show_bug.cgi?id=64372 and the workaround mentioned came\
    \ courtesy of this Stack Overflow question: http://stackoverflow.com/questions/6655364/css-attribute-selector-descendant-gives-a-bug-in-webkit/\n\
    \n## Summary\n\nUsing WAI-ARIA states to communicate changes in the DOM provides\
    \ styling hooks that are as useful and easy to use as HTML classes. Although purely\
    \ preference, I'm also a fan of the fact that an entirely different selector is\
    \ used to communicate state in the style sheets; it is simpler to spot within\
    \ a rule.\n\nNone of those prior factors really get you anything new. What using\
    \ WAI-ARIA states will do, virtually for free, is start to provide a better means\
    \ of communicating your web applications state to users of assistive technology.\
    \ If money talks, consider also that by using WAI-ARIA you are widening your product\
    \ up to a greater number of users (see the additional info below).\n\nAs such,\
    \ using WAI-ARIA states and properties, is the recommended means of communicating\
    \ state in projects adopting a ECSS methodology.\n\n## Additional information\
    \ and statistics from the Royal National Institute for the Blind (RNIB)\n\nThe\
    \ [RNIB](http://www.rnib.org.uk/) was kind enough to supply a little data regarding\
    \ the number of blind people here in the UK. These may turnaround: considering\
    \ a case for using ARIA states in your project:\n\n- There are just over 84,000\
    \ registered blind and partially sighted people of working age in the UK (out\
    \ of an estimated population of around 64 million).\n\nHowever, according to the\
    \ government's Labour Force Survey, around 185,000 people of working age in the\
    \ UK have a self-reported \"seeing difficulty\". This includes people whose sight\
    \ loss would not be eligible for registration, but which is still of sufficient\
    \ severity to affect their everyday lives. It also includes those who do not consider\
    \ themselves as disabled. Of the 185,000:\n\n- 113,000 consider themselves as\
    \ long-term disabled with a \"seeing difficulty\"\n- 72,000 consider themselves\
    \ as not disabled with a \"seeing difficulty\".\n- Estimated number of people\
    \ in the UK living with sight loss in 2011 - 1,865,900\n- Estimated number of\
    \ people in the UK predicted to be living with sight loss in 2020 - 2,269,700\n\
    - Estimated number of adults with diabetes, a major cause of visual impairments\
    \ in 2012 - 3,866,980\n\n# Chapter 7. Applying ECSS to web applications\n\nECSS\
    \ is an approach well suited to developing the CSS codebases of large applications.\n\
    \nTypically, from a logic perspective (e.g. the JavaScript/TypeScript/Ruby/whatever),\
    \ a particular file will be generating 'a thing'. It can therefore make a lot\
    \ of sense to use that file name as the name for the module or component of a\
    \ module. If a file is called 'Header.js' and generates the container for the\
    \ header, any component parts of that header would be named accordingly. For example,\
    \ a company registration number might get `sw-Header_Reg` as its class. By extension,\
    \ a search box component inside the header might have classes like `sw-HeaderSearch_Input`\
    \ (the input box created by the `HeaderSearch.js` file).\n\n## An example\n\n\
    Let's consider an example. Suppose we are authoring a JavaScript client-side application\
    \ and we have a JavaScript component called 'ShoppingCartLines.js'. It's task\
    \ is to render out the lines within a shopping cart and it in turn displays within\
    \ a module called 'ShoppingCart.js'. The 'ShoppingCart' module renders out anything\
    \ to do with the shopping cart itself. Straight forward enough so far.\n\nNow\
    \ let's complicate our imagined scenario a little by suggesting that our shopping\
    \ cart will work within a modal view in some scenarios and as part of the page,\
    \ in normal document flow, in others.\n\nIn this instance, we have a wider module:\
    \ 'ShoppingCart' and a component that typically lives within the module called\
    \ 'ShoppingCartLines'. Each of those will have their own child nodes. The module\
    \ and component have two possible views: in a modal and in the page. Let's imagine\
    \ that the switch of contexts would be handled by the application logic.\n\nOur\
    \ constant is the module itself and we can use a namespace to provide context\
    \ for it. We always use the full name of the application module or component as\
    \ the module section of the ECSS style selector. This has the benefit of making\
    \ all HTML classes explicit as to their origin and purpose.\n\n> When naming the\
    \ class for the outermost container of a module or component, no child extension\
    \ should be added to the class/selector. Only the child parts of a module or component\
    \ should get the node extension.\n\nOK, so, at this point, our selectors could\
    \ be named like this in the CSS:\n\n```\n.mod-ShoppingCart {} /*Modal*/\n.page-ShoppingCart\
    \ {} /*Page*/\n.mod-ShoppingCartLines {} /*Modal*/\n.page-ShoppingCartLines {}\
    \ /*Page*/\n```\n\nThis way our module and component have their two contexts isolated\
    \ by a namespace switch. We are free to style each as we see fit with no potential\
    \ leakage of styles from one to the other. This is the exact kind of scenario\
    \ that typically becomes fraught when components and modules share HTML classes\
    \ in the interest of abstraction and re-use.\n\nLet's consider a twist on this\
    \ scenario. Let's suppose we don't switch contexts with application logic. Instead,\
    \ we have a switch of styles with media queries. We have a modal implementation\
    \ at smaller viewports and the page style at larger viewports.\n\nIn this instance,\
    \ we could have a single namespace e.g. `sc-ShoppingCart` (I'm using `sc-` to\
    \ designate the context is 'ShoppingCart') and use media queries in the CSS to\
    \ provide visual changes.\n\nFor example:\n\n```\n.sc-ShoppingCart {\n    /*Modal\
    \ styles for smaller viewports*/\n    @media (min-width: $M) {\n        /* Page\
    \ styles for larger viewports */\n    }\n}\n\n.sc-ShoppingCartLines {\n    /*\
    \ Modal styles for smaller viewports */\n    @media (min-width: $M) {\n      \
    \  /* Page styles for larger viewports */\n    }\n}\n```\n\n## Child nodes of\
    \ a module or component\n\nAs mentioned previously, a module or component will\
    \ have its own child node elements. These selectors should be named with a child\
    \ extension. For example:\n\n```\n.sc-ShoppingCart {\n    /* The root of the component/module,\
    \ no child extension needed */\n}\n\n.sc-ShoppingCart_Title {\n    /* The 'title'\
    \ child node of the Shopping Cart */\n}\n\n.sc-ShoppingCart_Close {\n    /* A\
    \ 'close' button child of the Shopping Cart for when the cart \n    is modal */\n\
    }\n```\n\nEach child gets the namespace and component (or module) name of its\
