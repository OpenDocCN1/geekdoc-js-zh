    If that wasn''t enough, Stylelint is extensible. It''s easy to add additional
    functionality. For current builds ECSS projects in my workplace we have additional
    Stylelint rules to:


    +   - prevent key selectors from being compound (e.g. `.ip-Selector.ip-Selector2
    {}`)

    - ensure key selectors are singular (e.g. `.ip-Thing` not `.a-Parent .ip-Thing
    {}`)

    - ensure only overrides and media queries can be nested (prevents nests that don''t
    use a parent (`&`) selector)

    - ensure that key selectors match ECSS naming conventions (Stylelint now has a
    ''selector-class-pattern'' [rule to help](https://stylelint.io/user-guide/rules/selector-class-pattern)
    with this)


    These offer bespoke quality assurance that would be time consuming and error prone
    to perform ''by hand''.


    In case I''m not making it clear I want you to know that I love Stylelint and
    think linting is an indispensable piece of tooling for large projects with multiple
    authors. I simply cannot recommend it highly enough.


    There''s a little more about Stylelint in [this blog post](https://benfrain.com/better-linting-for-stylelint/)
    or via the official [Stylelint](https://stylelint.io/) website.'
  - '[PAGE 107]


    # Summary


    In this chapter we''ve covered what I consider to be the best tooling for facilitating
    and improving the CSS authoring experience. However, out of everything we have
    covered, the tooling advice is likely to be the most short-lived. Tooling technology
    moves at a blistering pace. In just three years I went from vanilla CSS to Sass
    (with [scss-lint](https://github.com/brigade/scss-lint)), to PostCSS and Stylelint
    while also moving from GUI build tools like CodeKit to JavaScript build tools
    Grunt and then Gulp.


    I have no idea what the best choice will be in 6 months time so the take away
    is to think about how tooling can improve the style sheet authoring experience
    across teams, not necessarily what the current tooling consists of.


    > > Be monogamous in your personal relationships and a philandering whore in your
    choice of tools and techniques. [The Way Of Pragmatic Coding](https://pragprog.com/)'
  - '[PAGE 108]


    # # The closing curly brace


    Now my friends we have reached not just the end of the chapter but the end of
    this little book.


    While I''d hope that some of you might be able to take ECSS ''off the peg'' and
    start implementing it wholesale, I''ll be just as happy if it merely provokes
    your own journey of discovery.


    At the outset I was trying to find an approach to scaling CSS that dealt with
    the following problems:


    +   - to allow the easy maintenance of a large CSS codebase over time

    - to allow portions of CSS code to be removed from the codebase without effecting
    the remaining styles

    - it should be possible to rapidly iterate on any new designs

    - changing the properties and values that applied to one visual element should
    not unintentionally effect others

    - any solution should require minimal tooling and workflow changes to implement

    - where possible, W3C standards such as ARIA should be used to communicate state
    change within the user interface


    ECSS answers all of those problems:


    +   - Compartmentalizing CSS into modules allows easy removal of deprecated features.

    - The unique naming convention avoids global naming collisions, reduces specificity
    and prevents unwanted changes to unrelated elements.

    - As all new modules are ''greenfield'' it''s simple to build out new designs.'
  - '[PAGE 109]


    +   - Despite some tooling to accommodate globbing imports and linting, we are
    still writing CSS in CSS files, making on-boarding developers a far easier process.

    - We can also embrace ARIA as a means to control and communicate state change,
    not just for assistive technology but in a wider sense too.


    The considerations of scaling CSS are a somewhat niche pursuit. In time, we will
    have things like [CSS Scoping](https://www.w3.org/TR/css-scoping-1/) but until
    then we must use the tools and techniques at our disposal to bend existing technology
    to our will.


    I''ve mentioned it numerous times but there are many ways to skin this cat. Other
    methods may be preferable. What follows is a list of people and resources, in
    no particular order that may help in your own odyssey. Until next time dear reader,
    I wish you the most fruitful of adventures.


    # ## Resources


