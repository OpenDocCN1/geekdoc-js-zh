  md: '# # The closing curly brace


    Now my friends we have reached not just the end of the chapter but the end of
    this little book.


    While I''d hope that some of you might be able to take ECSS ''off the peg'' and
    start implementing it wholesale, I''ll be just as happy if it merely provokes
    your own journey of discovery.


    At the outset I was trying to find an approach to scaling CSS that dealt with
    the following problems:


    +   - to allow the easy maintenance of a large CSS codebase over time

    - to allow portions of CSS code to be removed from the codebase without effecting
    the remaining styles

    - it should be possible to rapidly iterate on any new designs

    - changing the properties and values that applied to one visual element should
    not unintentionally effect others

    - any solution should require minimal tooling and workflow changes to implement

    - where possible, W3C standards such as ARIA should be used to communicate state
    change within the user interface


    ECSS answers all of those problems:


    +   - Compartmentalizing CSS into modules allows easy removal of deprecated features.

    - The unique naming convention avoids global naming collisions, reduces specificity
    and prevents unwanted changes to unrelated elements.

    - As all new modules are ''greenfield'' it''s simple to build out new designs.'
  merge: -1
