    \ #333 的变量。我们可以这样将其写为变量：\n\n```\n$color-grey-33: #333;\n```\n\n表面上看，变量名比十六进制值还要长，写变量似乎很荒谬。然而，同样地，使用变量可以防止不需要的变体\
    \ creeping 到代码库中（例如 `#323232`），并帮助识别代码中的\"红色警报\"。\n\n在调整颜色时，仍然使用变量也很重要。在变量上使用颜色函数来实现你的目标。例如，假设我们想要一个半透明的\
