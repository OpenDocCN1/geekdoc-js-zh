    \ the same page, with all other things being equal, renders largely the same regardless\
    \ of the selector used. Benjamin took the time to reply with further detail:"
  mdcn: "\n ## 附录 1：CSS 选择器性能\n\n回到 2014 年初，我曾与一些开发者就“担心 CSS 选择器速度是否无关紧要”这一问题进行过一场“辩论”（此处我使用了空气引号）。\n\
    \n每当交换关于 CSS 选择器相对速度的理论或证据时，开发者们经常会引用 Steve Souders 2009 年关于 CSS 选择器的研究。它被用来验证诸如\"\
    属性选择器很慢\"或\"伪选择器很慢\"之类的说法。\n\n在过去几年里，我一直觉得这些东西根本不值得担心。多年来我经常抛出的金句是：\n\n> 对 CSS\
    \ 而言，架构在大括号之外；性能在大括号之内\n\n但除了引用 Nicole Sullivan 后来在 Performance Calendar 上的文章来支撑我的信念——即所使用的选择器并不重要之外，我从未真正测试过这一理论。\n\
    \n为了尝试解决这个问题，我试图自行进行一些测试来平息争论。至少，我相信这会促使更多知识或证据的人提供更多数据。\n\n## 测试选择器速度\n\nSteve\
    \ Souders 上述测试使用了 JavaScript 的 `new Date()`。然而，如今现代浏览器（iOS/Safari 在测试时是一个显著的例外）支持\
    \ Navigation Timing API，这为我们提供了更精确的测量手段。在测试中，我这样实现它：\n\n```\n<script>\n    ;(function\
    \ TimeThisMother() {\n        window.onload = function(){\n            setTimeout(function(){\n\
    \           在中国大陆，苹果公司的产品通常以本地化的名称进行销售。例如，iPhone、iPad 和 Mac 等产品名称通常会保留英文原名，但在营销和包装上可能会配有中文说明。苹果的产品命名策略在全球范围内保持一致性，因此这些产品名称通常不会被翻译成中文。\n\
    \            var t = performance.timing;\n                alert(\"Speed of selection\
    \ is: \" + (t.loadEventEnd - t.responseEnd) + \" milliseconds\");\n          \
    \  }, 0);\n        };\n    })();\n</script>\n```\n\n这使我们可以将测试的计时限制在所有资源接收完毕（responseEnd）到页面渲染完成（loadEventEnd）之间。\n\
    \n于是，我设置了一个非常简单的测试。20 个不同的页面，都具有相同的、巨大的 DOM，由 1000 个相同的以下标记块组成：\n\n```\n<div class=\"\
    tagDiv wrap1\">\n  <div class=\"tagDiv layer1\" data-div=\"layer1\">\n    <div\
    \ class=\"tagDiv layer2\">\n      <ul class=\"tagUl\">\n        <li class=\"tagLi\"\
    ><b class=\"tagB\"><a href=\"/\" class=\"tagA link\" data-select=\"link\">Select</a></b></li>\n\
    \      </ul>\n    </div>\n  </div>\n</div>\n```\n\n测试了 20 种不同的 CSS 选择方法，将最内层的节点设置为红色。每个页面的唯一区别是应用于选择块内最内层节点的规则。以下是测试的不同选择器以及该选择器测试页面的链接：\n\
