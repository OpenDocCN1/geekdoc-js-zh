    \ none;\n  }\n}\n```\n\n## 5. 尺寸、颜色和 z-index 必须使用变量\n\n对于任何规模的项目，为尺寸、颜色和 z-index\
    \ 设置变量都是必不可少的。\n\n用户界面通常基于某种形式的网格或尺寸比例。因此，尺寸应基于设定的大小以及这些大小的合理划分。例如，以下是以 11px 为基础的尺寸及其变量变体：\n\
    \n```\n$size-full: 11px;\n$size-half: 5.5px;\n$size-quarter: 2.75px;\n$size-double:\
    \ 22px;\n$size-treble: 33px;\n$size-quadruple: 44px;\n```\n\n对于开发者而言，使用变量还能带来额外的好处。例如，它省去了从设计稿中吸取颜色值的工作，同时也有助于规范化设计。\n\
    \n例如，如果一个项目仅使用 13px、15px 和 22px 的字体大小，而此时需求变更要求使用 14px 的字体大小，变量就提供了规范化的参考。在这种情况下，字体应该是\
