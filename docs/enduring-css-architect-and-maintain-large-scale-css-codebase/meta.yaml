- img_proc: true
  md: '> I completely agree it is useless to optimize selectors upfront, but for completely
    different reasons:


    It is practically impossible to predict the final performance impact of a given
    selector by just examining the selectors. In the engine, selectors are reordered,
    split, collected and compiled. To know the final performance of a given selectors,
    you would have to know in which bucket the selector was collected, how it is compiled,
    and finally what does the DOM tree looks like. All of that is very different between
    the various engines, making the whole process even less predictable.


    The second argument I have against web developers optimizing selectors is that
    they will likely make things worse. The amount of misinformation about selectors
    is larger than correct cross-browser information. The chance of someone doing
    the right thing is pretty low.


    In practice, people discover performance problems with CSS and start removing
    rules one by one until the problem go away. I think that is the right way to go
    about this, it is easy and will lead to correct outcome.


    # Cause and effect


    At this point I felt vindicated that the CSS selector used was almost entirely
    irrelevant. However, I did wonder what else we could gleam from the tests.


    If the number of DOM elements on the page was halved, as you might expect, the
    speed to complete any of the tests dropped commensurately. But getting rid of
    large parts of the DOM isn''t always a possibility in the real world. This made
    me wonder what difference the amount of unused styles in the CSS would have on
    the results.


    # What difference does style bloat make?


    Another test: I grabbed a big fat style sheet that had absolutely no relevance
    to the DOM tree. It was about 3000 lines of CSS. All these irrelevant styles were
    inserted before a final rule that would select our inner `a.link` node'
