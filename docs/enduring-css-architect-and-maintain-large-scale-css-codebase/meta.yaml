- img_proc: true
  md: '# # Defining the problem


    Enduring CSS was born from my own need to define a rational approach to writing
    CSS on a large scale web application.


    Here''s a grab of the application viewed on an iPad:


    ![](img/599d07ddffb980e572103ffb27d26093_9_0.png)


    http://mobile.bet365.com in 2015


    It''s a responsive application that allows users to place bets on sporting events
    world wide. The pitch area at the upper right gives a live representation of the
    selected match with animated SVGs. The odds and game scores on the lower left
    are updated live as the sporting events plays out and a timeline summary of the
    game history is constantly updated in the lower right.


    Due to the complexity of the application, over time and a number of iterations,
    the CSS had become unruly. It was difficult to iterate upon, hard'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'to reason about and nobody was quite sure where any unneeded CSS was and if
    it could be safely removed without inadvertently effecting other parts of the
    application. If you''ve ever inherited a large CSS codebase, I''m sure you can
    sympathise.


    Therefore, at the outset of my journey, I defined some basic needs. More simply,
    these were the problems that any new CSS authoring approach had to solve. Here
    is the list of those needs:


    +   - to allow the easy maintenance of a large CSS codebase over time

    - to allow portions of CSS code to be removed from the codebase without effecting
    the remaining styles

    - it should be possible to rapidly iterate on any new designs

    - changing the properties and values that applied to one visual element should
    not unintentionally effect others

    - any solution should require minimal tooling and workflow changes to implement

    - where possible, W3C standards such as ARIA should be used to communicate state
    change within the user interface


    In the next chapter we are going to look more specifically at these problems.
    However, first, an important cautionary note.


    # ## Solve your own problems


    I believe in ''Pin Cing Do'', which translates roughly as the ''[The way of pragmatic
    coding](link)''. This means solving the problems you actually have. Therefore,
    I''ll state something up front that may be obvious to some:


    It may be that the problems I had were not the problems you have. As such, you
    should temper the advice and approach offered herein accordingly. Alternatively,
    consider that your needs may be better addressed by different approaches and methodologies.
    I''m not going to try and convince you that ECSS is necessarily the best solution
    in all situations. For example:'
  merge: -1
  pgno: 10
- img_proc: true
  md: '+   - ECSS won''t give you the smallest possible CSS footprint (consider [Atomic
    CSS](link) for that).


    +   - It isn''t widely used and documented (consider [BEM](link) if ubiquity is
    a major concern).


    +   - ECSS does not abstract styles and allow styling of elements from a bunch
    of specific utility classes. You should look at OOCSS and read the writing of
    its many advocates for that.


    OK, public service announcement out of the way. Let''s head on to the next chapter.
    This is where we''ll look at the principle problems of working with CSS on large
    scale projects: specificity, the cascade, isolation and selectors tied to structural
    elements.'
