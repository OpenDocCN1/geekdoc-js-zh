    # # Chapter 9. Tooling for an ECSS approach


    In this final chapter we will look at some of the tooling that''s available free
    and open source to facilitate writing sane and maintainable style sheets.


    When authoring the CSS for an enduring project, the technology employed to produce
    the CSS should be largely immaterial. We should always be aware that a better
    or more efficient tool may become available to achieve our aims and when possible,
    and if preferable, it should be embraced.


    Therefore, it shouldn''t matter whether Sass, PostCSS, LESS, Stylus, Myth or any
    other CSS processor is employed to author the style sheets. The authored style
    sheets should be as easy to migrate to another meta-language as possible, if and
    when needed.


    Furthermore, the CSS processor employed should best serve the needs of the project
    as a whole and not merely the preferences of any individual author. That said,
    there are some necessary capabilities for the CSS processor so we will cover that
    briefly next.


    # ## CSS requisites for CSS processors


    I consider a CSS processor for style sheet authoring essential. This allows a
    differentiation between ''authoring'' style sheets (the style sheets that the
    author writes in their CSS processor of choice) and the ''resultant'' CSS (the
    compiled and minified CSS that gets served to the user).


    Despite stating that a CSS processor is essential, the requisite features needed
    are fairly trivial:


    +   - variables: to mitigate human errors with colour picking and specifying constants
    like grid measures'
  - '[PAGE 101]


    +   - partials: to facilitate one-to-one parity of authoring style sheets with
    a feature branch, template or logic file

    - colour manipulations: to allow consistent manipulation of the aforementioned
    variables e.g. being able to adjust or easily adjust the alpha of a colour

    - all other abilities are considered non-essential and should be appraised particular
    to the needs of the project.


    # ## Building CSS from authoring style sheets


    A build system of some sort is required to compile the authoring style sheets
    (with their variables, mxins and the like) into plain CSS. There are many tools
    available to perform this task e.g Grunt, Gulp and Brocolli to name just a few.
    Just as there is no universally ''right'' CSS processor, so there is no universally
    ''right'' build tool.


    Besides merely compiling authoring style sheets into CSS, good tooling can provide
    further benefits.


    +   - Linting: to enable code conformity and prevent non-working code reaching
    deployment

    - Aggressive minification: rebasing z-indexes, converting length values to smaller
    length values e.g. (while ''1pt'' is equivalent to ''16px'' it is one less character),
    merging alike selectors

    - Autoprefixer: to enable fast and accurate vendor prefixing and prevent vendor
    prefixes being present in the authoring style sheets


    > For considerations of what is deemed essential, syntax-wise, in style sheet
    authoring, refer to Chapter 8 ''Ten Commandments of Sane Style Sheets''.'
  - '[PAGE 102]


    # Save to compile, the journey of an ECSS style sheet


    In terms of tooling, at the time of writing, I currently write ECSS with the help
    of Gulp and PostCSS plus it’s many and varied plugins.


    For the very curious, a little more on my [journey from Sass to PostCSS](http://journey-from-sass-to-postcss.com)
    can be found here.


    The style sheet authors write into a partial CSS file (with a *.css file extension),
    using a syntax that is very similar to Sass.

    On saving an authoring style sheet, the Gulp watch task notices the file change
    and first starts the authoring style sheets linting task. Then, providing all
    is well, it compiles the partial authoring style sheets to CSS, auto-prefixes
    them and then BrowserSync injects the changed CSS directly into the webpage I’m
    working on. Typically, we will also create a source map file as some authors find
    them easier for debugging. All this happens before I can alt+tab into my browser
    window or even move my gaze from text editor to browser window.


    If it’s CSS heading for production, the resultant CSS typically takes an extra
    step through [cssnano](https://cssnano.co). It’s a fantastic and modular CSS minifier
    by the extraordinarily talented Ben Briggs. Highly recommended.


    Here’s an example `gulpfile.js` that demonstrate how PostCSS might be setup in
    a Gulp based build tool.'
- md: " ## Chapter 9. Tooling for an ECSS approach\n\n```javascript\n//PostCSS related\n\
    var postcss = require(\"gulp-postcss\");\nvar postcssImport = require(\"postcss-import\"\
    );\nvar autoprefixer = require(\"autoprefixer\");\nvar simpleVars = require(\"\
    postcss-simple-vars\");\nvar mixins = require(\"postcss-mixins\");\nvar cssnano\
    \ = require(\"cssnano\");\nvar reporter = require(\"postcss-reporter\");\nvar\
    \ stylelint = require(\"stylelint\");\nvar stylelinterConfig = require(\"./stylelintConfig.js\"\
    );\nvar colorFunction = require(\"postcss-color-function\");\nvar nested = require(\"\
    postcss-nested\");\nvar sourcemaps = require(\"gulp-sourcemaps\");\n\n// Create\
    \ the styles\ngulp.task(\"styles\", [\"lint-styles\"], function () {\n\n    var\
    \ processors = [\n        postcssImport({glob: true}),\n        mixins,\n    \
    \    simpleVars,\n        colorFunction(),\n        nested,\n        autoprefixer({\
    \ browsers: [\"last 2 version\", \"safari 5\", \"opera 12.1\", \"ios 6\", \"android\
    \ 2.3\"] }),\n        cssnano\n    ];\n\n    return gulp.src(\"preCSS/styles.css\"\
    )\n\n    // start Sourcemaps\n    .pipe(sourcemaps.init())\n\n    // We always\
    \ want PostCSS to run\n    .pipe(postcss(processors).on(\"error\", gutil.log))\n\
    \n    // Write a source map into the CSS at this point\n    .pipe(sourcemaps.write())\n\
    \n    // Set the destination for the CSS file\n    .pipe(gulp.dest(\"./build\"\
    ))\n\n    // If in DEV environment, notify user that styles have been compiled\n\
    \    .pipe(notify(\"Yo Mofo, check dem styles!!!\"))\n\n    // If in DEV environment,\
    \ reload the browser\n    .pipe(reload({stream: true}));\n});\n```\n\nWith Gulp\
    \ the build choices are fairly limitless, this is merely an illustration. However,\
    \ note how the first thing the 'styles' task does, it run the 'lint-styles' task.\n\
    \nThe linting of the style sheets is a very important step on a project where\
    \ multiple style sheets authors are involved. Let's look a little more at that\
    \ next.\n\n## Stylelint\n\nStylelint is a Node based linting tool for the static\
    \ analysis of style sheets. In layman's terms it will analysis your style sheets\
    \ for the rules you specifically care about and warn you of any problems.\n\n\
    > \U0001F50D If you use Sass you should check out [scss-lint](link) which provides\
    \ similar functionality for Sass files.\n\nThe linting job fails the build if\
    \ any authoring errors are found. Typically it's most beneficial to have linting\
    \ running in two places. In the text editor (e.g. Sublime) and in the build tool\
    \ (e.g. Gulp). This way, if an author has the requisite text editor then the [editor\
    \ based linting](link) indicates problems before an author even clicks 'save'.\n\
    \nEven if a user doesn't have in-editor linting available, the linting job runs\
    \ via Gulp on save. The build step prevents compiled code making its way to production\
    \ (as continuous integration software would also fail the build).\n\nThis is a\
    \ massive time saver and has proved invaluable when it comes to peer reviewing\
    \ code and performing quality assurance tests.\n\nHere is an example configuration\
    \ object for Stylelint (this is for v3 of Stylelint so future/previous versions\
    \ may vary slightly):\n\n```javascript\n// Config for linting\n{\n    \"rules\"\
    : {\n        \"block-no-empty\": true,\n        \"color-no-invalid-hex\": true,\n\
    \        \"declaration-colon-space-after\": \"always\",\n        \"declaration-colon-space-before\"\
    : \"never\",\n        \"function-comma-space-after\": \"always\",\n        \"\
    function-url-quotes\": \"double\",\n        \"media-feature-colon-space-after\"\
    : \"always\",\n        \"media-feature-colon-space-before\": \"never\",\n    \
    \    \"media-feature-name-no-vendor-prefix\": true,\n        \"max-empty-lines\"\
    : 2,\n        \"number-leading-zero\": \"never\",\n        \"number-no-trailing-zeros\"\
    : true,\n        \"property-no-vendor-prefix\": true,\n        \"rule-no-duplicate-properties\"\
    : true,\n        \"declaration-block-no-single-line\": true,\n        \"rule-trailing-semicolon\"\
    : \"always\",\n        \"selector-list-comma-newline-after\": \"always-multi-line\"\
    ,\n        \"selector-no-id\": true,\n        \"string-quotes\": \"double\",\n\
    \        \"value-no-vendor-prefix\": true\n    }\n};\n```\n\nThis is just an example,\
    \ you can set whichever rules you care about from the [ever expanding list](https://stylelint.io/user-guide/rules).\n\
    \nIf that wasn't enough, Stylelint is extensible. It's easy to add additional\
    \ functionality. For current builds ECSS projects in my workplace we have additional\
    \ Stylelint rules to:\n\n- prevent key selectors from being compound (e.g. `.ip-Selector.ip-Selector2\
    \ {}`)\n- ensure key selectors are singular (e.g. `.ip-Thing` not `.a-Parent .ip-Thing\
    \ {}`)\n- ensure only overrides and media queries can be nested (prevents nests\
    \ that don't use a parent (`&`) selector)\n- ensure that key selectors match ECSS\
    \ naming conventions (Stylelint now has a 'selector-class-pattern' [rule to help](https://stylelint.io/user-guide/rules/selector-class-pattern)\
    \ with this)\n\nThese offer bespoke quality assurance that would be time consuming\
    \ and error prone to perform 'by hand'.\n\nIn case I'm not making it clear I want\
    \ you to know that I love Stylelint and think linting is an indispensable piece\
    \ of tooling for large projects with multiple authors. I simply cannot recommend\
    \ it highly enough.\n\nThere's a little more about Stylelint in [this blog post](https://benfrain.com/better-linting-for-stylelint/)\
    \ or via the official [Stylelint](https://stylelint.io/) website.\n\n## Summary\n\
    \nIn this chapter we've covered what I consider to be the best tooling for facilitating\
    \ and improving the CSS authoring experience. However, out of everything we have\
    \ covered, the tooling advice is likely to be the most short-lived. Tooling technology\
    \ moves at a blistering pace. In just three years I went from vanilla CSS to Sass\
    \ (with [scss-lint](https://github.com/brigade/scss-lint)), to PostCSS and Stylelint\
    \ while also moving from GUI build tools like CodeKit to JavaScript build tools\
    \ Grunt and then Gulp.\n\nI have no idea what the best choice will be in 6 months\
    \ time so the take away is to think about how tooling can improve the style sheet\
    \ authoring experience across teams, not necessarily what the current tooling\
    \ consists of.\n\n> Be monogamous in your personal relationships and a philandering\
    \ whore in your choice of tools and techniques. [The Way Of Pragmatic Coding](https://pragprog.com/)\n\
    \n## The closing curly brace\n\nNow my friends we have reached not just the end\
    \ of the chapter but the end of this little book.\n\nWhile I'd hope that some\
    \ of you might be able to take ECSS 'off the peg' and start implementing it wholesale,\
    \ I'll be just as happy if it merely provokes your own journey of discovery.\n\
    \nAt the outset I was trying to find an approach to scaling CSS that dealt with\
    \ the following problems:\n\n- to allow the easy maintenance of a large CSS codebase\
    \ over time\n- to allow portions of CSS code to be removed from the codebase without\
    \ effecting the remaining styles\n- it should be possible to rapidly iterate on\
    \ any new designs\n- changing the properties and values that applied to one visual\
    \ element should not unintentionally effect others\n- any solution should require\
    \ minimal tooling and workflow changes to implement\n- where possible, W3C standards\
    \ such as ARIA should be used to communicate state change within the user interface\n\
    \nECSS answers all of those problems:\n\n- Compartmentalizing CSS into modules\
    \ allows easy removal of deprecated features.\n- The unique naming convention\
    \ avoids global naming collisions, reduces specificity and prevents unwanted changes\
    \ to unrelated elements.\n- As all new modules are 'greenfield' it's simple to\
    \ build out new designs.\n- Despite some tooling to accommodate globbing imports\
    \ and linting, we are still writing CSS in CSS files, making on-boarding developers\
    \ a far easier process.\n- We can also embrace ARIA as a means to control and\
    \ communicate state change, not just for assistive technology but in a wider sense\
    \ too.\n\nThe considerations of scaling CSS are a somewhat niche pursuit. In time,\
    \ we will have things like [CSS Scoping](https://www.w3.org/TR/css-scoping-1/)\
    \ but until then we must use the tools and techniques at our disposal to bend\
    \ existing technology to our will.\n\nI've mentioned it numerous times but there\
    \ are many ways to skin this cat. Other methods may be preferable. What follows\
    \ is a list of people and resources, in no particular order that may help in your\
    \ own odyssey. Until next time dear reader, I wish you the most fruitful of adventures.\n\
    \n### Resources\n\nHere are some folks that often talk or write about CSS architecture/scaling:\n\
    \n- [Thierry Koblentz](https://twitter.com/thierrykoblentz)\n- [Nicolas Gallagher](https://twitter.com/necolas)\n\
    - [Kaelig Deloumeau-Prigent](https://twitter.com/kaelig)\n- [Nicole Sullivan](https://twitter.com/stubbornella)\n\
    - [Harry Roberts](https://twitter.com/csswizardry)\n- [Jonathan Snook](https://twitter.com/snookca)\n\
    - [Micah Godbolt](https://twitter.com/micahgodbolt)\n\nFor a discussion about\
    \ using inline-styles via JavaScript: [Shop Talk show #180](https://shoptalkshow.com/episodes/180/)\n\
    \nInteresting approaches/projects around CSS:\n\n- [Radium for React](https://github.com/FormidableLabs/radium)\n\
    - [React Native for Web](https://github.com/necolas/react-native-web)\n- [CSS\
    \ Modules](https://github.com/css-modules/css-modules)\n- [Atomic CSS](https://acss.io/)"
  mdcn: "\n ## 第9章. ECSS 方法的工具支持\n\n```javascript\n//PostCSS 相关\nvar postcss = require(\"\
    gulp-postcss\");\nvar postcssImport = require(\"postcss-import\");\nvar autoprefixer\
    \ = require(\"autoprefixer\");\nvar simpleVars = require(\"postcss-simple-vars\"\
    );\nvar mixins = require(\"postcss-mixins\");\nvar cssnano = require(\"cssnano\"\
    );\nvar reporter = require(\"postcss-reporter\");\nvar stylelint = require(\"\
    stylelint\");\nvar stylelinterConfig = require(\"./stylelintConfig.js\");\nvar\
    \ colorFunction = require(\"postcss-color-function\");\nvar nested = require(\"\
    postcss-nested\");\nvar sourcemaps = require(\"gulp-sourcemaps\");\n\n// 创建样式\n\
    gulp.task(\"styles\", [\"lint-styles\"], function () {\n\n    var processors =\
    \ [\n        postcssImport({glob: true}),\n        mixins,\n        simpleVars,\n\
    \        colorFunction(),\n        nested,\n        autoprefixer({ browsers: [\"\
    last 2 version\", \"safari 5\", \"opera 12.1\", \"ios 6\", \"android 2.3\"] }),\n\
    \        cssnano\n    ];\n\n    return gulp.src(\"preCSS/styles.css\")\n\n   \
    \ // 启动 Sourcemaps\n    .pipe(sourcemaps.init())\n\n    // 始终运行 PostCSS\n    .pipe(postcss(processors).on(\"\
    error\", gutil.log))\n\n    // 在此位置将 source map 写入 CSS\n    .pipe(sourcemaps.write())\n\
    \n    // 设置 CSS 文件的目标位置\n    .pipe(gulp.dest(\"./build\"))\n\n    // 如果处于 DEV\
    \ 环境，通知用户样式已编译完成\n    .pipe(notify(\"Yo Mofo, check dem styles!!!\"))\n\n    //\
    \ 如果处于 DEV 环境，重新加载浏览器\n    .pipe(reload({stream: true}));\n});\n```\n\n使用 Gulp\
    \ 时，构建的选择几乎是无限的，这仅仅是一个示例。不过请注意，'styles' 任务所做的第一件事就是运行 'lint-styles' 任务。\n\n在涉及多个样式表作者的项目中，对样式表进行\
    \ lint 检查是非常重要的一步。接下来让我们更深入地了解一下这一点。\n\n## Stylelint\n\nStylelint 是一款基于 Node 的\
    \ lint 工具，用于对样式表进行静态分析。用通俗的话说，它会根据你特别关注的规则来分析你的样式表，并在发现问题时向你发出警告。\n\n> \U0001F50D\
    \ 如果你使用 Sass，应该了解一下 [scss-lint](link)，它为 Sass 文件提供了类似的功能。\n\n如果发现任何编写错误，lint 任务会导致构建失败。通常情况下，最有益的做法是在两个地方运行\
    \ lint 检查：在文本编辑器（例如 Sublime）中和在构建工具（例如 Gulp）中。这样，如果作者使用相应的文本编辑器，那么[基于编辑器的 lint\
    \ 检查](link)就能在作者点击\"保存\"之前就指出问题。\n\n即使用户无法使用编辑器内的 lint 检查功能，lint 任务也会在保存时通过 Gulp\
    \ 运行。构建步骤会阻止已编译的代码进入生产环境（就像持续集成软件也会导致构建失败一样）。\n\n这能节省大量时间，在进行代码同行评审和执行质量保证测试时被证明是无价之宝。\n\
    \n以下是 Stylelint 的配置对象示例（这是针对 Stylelint v3 版本的，因此未来/之前的版本可能会略有不同）：\n\n```javascript\n\
    // lint 检查的配置\n{\n    \"rules\": {\n        \"block-no-empty\": true,\n      \
    \  \"color-no-invalid-hex\": true,\n        \"declaration-colon-space-after\"\
    : \"always\",\n        \"declaration-colon-space-before\": \"never\",\n      \
    \  \"function-comma-space-after\": \"always\",\n        \"function-url-quotes\"\
    : \"double\",\n        \"media-feature-colon-space-after\": \"always\",\n    \
    \    \"media-feature-colon-space-before\": \"never\",\n        \"media-feature-name-no-vendor-prefix\"\
    : true,\n        \"max-empty-lines\": 2,\n        \"number-leading-zero\": \"\
    never\",\n        \"number-no-trailing-zeros\": true,\n        \"property-no-vendor-prefix\"\
    : true,\n        \"rule-no-duplicate-properties\": true,\n        \"declaration-block-no-single-line\"\
    : true,\n        \"rule-trailing-semicolon\": \"always\",\n        \"selector-list-comma-newline-after\"\
    : \"always-multi-line\",\n        \"selector-no-id\": true,\n        \"string-quotes\"\
    : \"double\",\n        \"value-no-vendor-prefix\": true\n    }\n};\n```\n\n这只是一个示例，你可以从[不断扩展的规则列表](https://stylelint.io/user-guide/rules)中设置你关心的任何规则。\n\
    \n如果这还不够，Stylelint 是可扩展的。添加额外功能非常容易。对于当前我工作场所的 ECSS 项目构建，我们额外添加了以下 Stylelint 规则：\n\
    \n- 防止关键选择器被复合（例如 `.ip-Selector.ip-Selector2 {}`）\n- 确保关键选择器是单一的（例如 `.ip-Thing`，而非\
    \ `.a-Parent .ip-Thing {}`）\n- 确保只有覆盖规则和媒体查询可以嵌套（防止不使用父级 (`&`) 选择器的嵌套）\n- 确保关键选择器符合\
    \ ECSS 命名约定（Stylelint 现在有一个 'selector-class-pattern' [规则来帮助](https://stylelint.io/user-guide/rules/selector-class-pattern)实现这一点）\n\
    \n这些提供了定制化的质量保证，如果\"手动\"执行将会费时且容易出错。\n\n以防我说得不够清楚，我想让你知道：**我非常热爱 Stylelint**，并认为\
    \ lint 检查是大型多作者项目中**不可或缺的**工具。我怎么强烈推荐它都不为过。\n\n关于 Stylelint 的更多内容，可以查看[这篇博客文章](https://benfrain.com/better-linting-for-stylelint/)或官方\
    \ [Stylelint](https://stylelint.io/) 网站。\n\n## 总结\n\n在本章中，我们介绍了我个人认为最能促进和提升 CSS\
    \ 编写体验的工具。然而，在我们所涵盖的所有内容中，工具建议可能是最短命的。工具技术的发展速度极其迅猛。在短短三年内，我从 vanilla CSS 到 Sass（配合\
    \ [scss-lint](https://github.com/brigade/scss-lint)），再到 PostCSS 和 Stylelint，同时从\
    \ CodeKit 等 GUI 构建工具转向 JavaScript 构建工具 Grunt，再到 Gulp。\n\n我无法预测 6 个月后什么是最好的选择，所以关键要点是思考工具如何能够**改善团队间的样式表编写体验**，而不一定是当前的工具组合是什么。\n\
    \n> 在个人关系中保持专一，但在工具和技术选择上做个*花心的*。[The Way Of Pragmatic Coding](https://pragprog.com/)\n\
    \n## 最后的右花括号\n\n现在，我的朋友们，我们不仅到达了本章的结尾，也到达了这本小书的结尾。\n\n虽然我希望你们中的一些人能够直接采用 ECSS\
    \ 并开始**全面实施**，但如果它只是激发了你们自己的探索之旅，我也会同样开心。\n\n在一开始，我试图找到一种扩展 CSS 的方法，以解决以下问题：\n\
    \n- 允许轻松维护大型 CSS 代码库\n- 允许从代码库中移除部分 CSS 代码而不影响剩余的样式\n- 应该能够快速迭代任何新设计\n- 更改应用于一个视觉元素的属性和值不应该*无意中*影响其他元素\n\
    - 任何解决方案都应该需要最少的工具和工作流变更即可实施\n- 在可能的情况下，应使用 W3C 标准（如 ARIA）来传达用户界面中的状态变化\n\nECSS\
    \ 回答了所有这些问题：\n\n- 将 CSS 划分为模块，便于移除废弃的功能。\n- 唯一的命名约定避免了全局命名冲突，降低了特异性，并防止了对不相关元素的意外更改。\n\
    - 由于所有新模块都是\"*绿地项目*\"，构建新设计变得简单。\n- 尽管需要一些工具来支持 glob 导入和 lint 检查，但我们仍然是在 CSS 文件中编写\
    \ CSS，这使得开发人员的入职变得容易得多。\n- 我们还可以利用 ARIA 来控制及传达状态变化，不仅用于辅助技术，而且在更广泛的意义上也是如此。\n\n\
    扩展 CSS 的考虑是一个 somewhat niche 的追求。总有一天，我们将拥有 [CSS Scoping](https://www.w3.org/TR/css-scoping-1/)\
    \ 这样的技术，但在此之前，我们必须利用手头的工具和技术，让现有技术为我们所用。\n\n我已经多次提到过，解决这个问题的方法*有很多种*。其他方法可能更可取。以下是一份人员和资源的列表，顺序不分先后，可能会对你自己的探索之旅有所帮助。亲爱的读者，下次再见，祝你最富有成果的冒险。\n\
    \n### 资源\n\n以下是一些经常谈论或撰写关于 CSS 架构/扩展文章的人：\n\n- [Thierry Koblentz](https://twitter.com/thierrykoblentz)\n\
    - [Nicolas Gallagher](https://twitter.com/necolas)\n- [Kaelig Deloumeau-Prigent](https://twitter.com/kaelig)\n\
    - [Nicole Sullivan](https://twitter.com/stubbornella)\n- [Harry Roberts](https://twitter.com/csswizardry)\n\
    - [Jonathan Snook](https://twitter.com/snookca)\n- [Micah Godbolt](https://twitter.com/micahgodbolt)\n\
    \n关于通过 JavaScript 使用内联样式的讨论：[Shop Talk show #180](https://shoptalkshow.com/episodes/180/)\n\
    \n有趣的 CSS 方法/项目：\n\n- [Radium for React](https://github.com/FormidableLabs/radium)\n\
    - [React Native for Web](https://github.com/necolas/react-native-web)\n- [CSS\
    \ Modules](https://github.com/css-modules/css-modules)\n- [Atomic CSS](https://acss.io/)\n"
