  - '[PAGE 7]


    # Preface


    This is a little book that encapsulates my current thinking for how best to write
    and maintain CSS codebases for rapidly changing, long-lived web projects.


    +   - There is no framework to download.

    - There are no requisite tools (although there are opinionated guidelines for
    what tooling should provide).

    - Nothing is written for you.


    Put metaphorically, ''Enduring CSS'' is not giving you fish; it''s teaching you
    how to fish.


    It''s a methodology for writing CSS that once implemented, will provide your project
    with a predictable, and easy to maintain CSS codebase.


    The earliest iterations of Enduring CSS were first documented in the blog post,
    [Enduring CSS: writing style sheets for rapidly changing, long-lived projects](https://benfrain.com/enduring-css-writing-style-sheets-rapidly-changing-long-lived-projects/).


    However, the ECSS approach has developed a little since then and so this book
    should be considered the canonical resource on the approach.


    I hope you enjoy reading it.


    **Ben Frain** 26th October, 2015'
- md: " ## Chapter 1. Enduring CSS\n\nWriting styles for rapidly changing, long-lived\
    \ web projects\n\n## Introduction\n\nThis isn't actually a book about writing\
    \ CSS, as in the stuff inside the curly braces. It's a book about the organising\
    \ and architecture of CSS; the parts outside the braces. It's the considerations\
    \ that can be happily ignored on smaller projects but actually become the most\
    \ difficult part of writing CSS in larger projects.\n\nTerms like 'CSS at scale',\
    \ or 'Large-scale CSS' can seem quite nebulous. I'll try and clarify.\n\n## Defining\
    \ the problem\n\nEnduring CSS was born from my own need to define a rational approach\
    \ to writing CSS on a large scale web application.\n\nHere's a grab of the application\
    \ viewed on an iPad:\n\n![](img/599d07ddffb980e572103ffb27d26093_9_0.png)\n\n\
    http://mobile.bet365.com in 2015\n\nIt's a responsive application that allows\
    \ users to place bets on sporting events world wide. The pitch area at the upper\
    \ right gives a live representation of the selected match with animated SVGs.\
    \ The odds and game scores on the lower left are updated live as the sporting\
    \ events plays out and a timeline summary of the game history is constantly updated\
    \ in the lower right.\n\nDue to the complexity of the application, over time and\
    \ a number of iterations, the CSS had become unruly. It was difficult to iterate\
    \ upon, hard to reason about and nobody was quite sure where any unneeded CSS\
    \ was and if it could be safely removed without inadvertently effecting other\
    \ parts of the application. If you've ever inherited a large CSS codebase, I'm\
    \ sure you can sympathise.\n\nTherefore, at the outset of my journey, I defined\
    \ some basic needs. More simply, these were the problems that any new CSS authoring\
    \ approach had to solve. Here is the list of those needs:\n\n- to allow the easy\
    \ maintenance of a large CSS codebase over time\n- to allow portions of CSS code\
    \ to be removed from the codebase without effecting the remaining styles\n- it\
    \ should be possible to rapidly iterate on any new designs\n- changing the properties\
    \ and values that applied to one visual element should not unintentionally effect\
    \ others\n- any solution should require minimal tooling and workflow changes to\
    \ implement\n- where possible, W3C standards such as ARIA should be used to communicate\
    \ state change within the user interface\n\nIn the next chapter we are going to\
    \ look more specifically at these problems. However, first, an important cautionary\
    \ note.\n\n## Solve your own problems\n\nI believe in 'Pin Cing Do', which translates\
    \ roughly as the '[The way of pragmatic coding](link)'. This means solving the\
    \ problems you actually have. Therefore, I'll state something up front that may\
    \ be obvious to some:\n\nIt may be that the problems I had were not the problems\
    \ you have. As such, you should temper the advice and approach offered herein\
    \ accordingly. Alternatively, consider that your needs may be better addressed\
    \ by different approaches and methodologies. I'm not going to try and convince\
    \ you that ECSS is necessarily the best solution in all situations. For example:\n\
    \n- ECSS won't give you the smallest possible CSS footprint (consider [Atomic\
    \ CSS](link) for that).\n- It isn't widely used and documented (consider [BEM](link)\
    \ if ubiquity is a major concern).\n- ECSS does not abstract styles and allow\
    \ styling of elements from a bunch of specific utility classes. You should look\
    \ at OOCSS and read the writing of its many advocates for that.\n\nOK, public\
    \ service announcement out of the way. Let's head on to the next chapter. This\
    \ is where we'll look at the principle problems of working with CSS on large scale\
    \ projects: specificity, the cascade, isolation and selectors tied to structural\
    \ elements.\n\n## Chapter 2. The problems of CSS at scale\n\nIn most projects,\
    \ the CSS starts out with some simple rules. At the outset, you'd have to be doing\
    \ something fairly daft to make maintenance of the CSS problematic.\n\nHowever,\
    \ as the project grows, so too does the CSS. Requirements become more complicated.\
    \ More authors get involved writing the styles. Edge cases and browser workarounds\
    \ need to be authored and factored in. It's easy for things to get unruly fast.\n\
    \nLet's consider the growing demands on a humble widget:\n\n- \"When the widget\
    \ is in the sidebar, can we reduce the font size?\"\n- \"When we're on the home\
    \ page, can the widget have a different background colour?\"\n- \"Can we have\
    \ the things inside the widget stacked vertically at larger viewports?\"\n- \"\
    When the widget is in the sidebar on the product page, the font colour needs to\
    \ change\"\n\nBefore long we need to write a whole raft of overrides to a base\
    \ selector. Let's consider the selectors we might need:\n\n```css\n.widget {\n\
    \    /* Base Styles */\n}\n\naside#sidebar .widget {\n    /* Sidebar specific\
    \ */\n}\n\nbody.home-page aside#sidebar .widget {\n    /* Home page sidebar specific\
    \ */\n}\n\n@media (min-width: 600px) {\n    .widget {\n        /* Base Styles\
    \ 600px and above */\n    }\n\n    aside#sidebar .widget {\n        /* Sidebar\
    \ specific 600px and above */\n    }\n\n    body.home-page aside#sidebar .widget\
    \ {\n        /* Home page sidebar specific 600px and above */\n    }\n}\n\nbody.product-page\
    \ .widget {\n    /* Product page specific */\n}\n\nbody.product-page aside#sidebar\
    \ .widget {\n    /* Product page sidebar specific */\n}\n```\n\nThere's some basic\
    \ authoring problems there if this was CSS that we wanted to scale. Let's consider\
    \ some of the more obvious problems in those rules now.\n\n## Specificity\n\n\
    The first major problem of CSS at scale is we want to by-pass the problem of specificity.\
    \ Ordinarily, specificity is a useful thing. It allows us to introduce some form\
    \ of logic in the CSS. Styles that are more specific than others get applied in\
    \ the browser. Our example above demonstrates this: different rules will be applied\
    \ in different eventualities (for example, when in the sidebar, we want to override\
    \ the default styles).\n\nNow, CSS selectors can be made up of ID, class, attribute\
    \ & type selectors and any combination of those. With responsive designs you can\
    \ throw in media queries into the mix too.\n\nHowever, not all selectors are created\
    \ equal. The W3C describes how specificity is calculated here: [http://www.w3.org/TR/css3-selectors/#specificity](http://www_resources264com/resources264.com/TR/css3-selectors/#specificity).\
    \ Here is the most relevant section:\n\n> A selector's specificity is calculated\
    \ as follows: count the number of ID selectors in the selector (= a) count the\
    \ number of class selectors, attributes selectors, and pseudo-classes in the selector\
    \ (= b) count the number of type selectors and pseudo-elements in the selector\
    \ (= c) ignore the universal selector Selectors inside the negation pseudo-class\
