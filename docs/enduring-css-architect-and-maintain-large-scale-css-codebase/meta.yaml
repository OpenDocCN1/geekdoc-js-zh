    # The difference between fastest and slowest selector


    The Biggest Diff. row shows the difference in milliseconds between the fastest
    and slowest selector. Of the desktop browsers, IE9 stands out as having the biggest
    difference between fastest and slowest selectors at 31ms. The others are all around
    half of that figure. However, interestingly there was no consensus on what the
    slowest selector was.


    # The slowest selector


    I was interested to note that the slowest selector type differed from browser
    to browser. Both Opera and Chrome found the ‘insanity’ selector (test 13) the
    hardest to match (the similarity between Opera and Chrome here perhaps not surprising
    given they share the blink engine), while Firefox struggled with a single pseudo
    selector (test 6), as did the Android 4.2 device (a Tesco hudl 7” tablet). Internet
    Explorer 9’s Achilles heel was the partial attribute selector (test 10).


    # Good CSS architecture practices


    One thing we can be clear on is that using a flat hierarchy of class-based selectors,
    as is the case with ECSS, provides selectors that are as fast as any others.'
