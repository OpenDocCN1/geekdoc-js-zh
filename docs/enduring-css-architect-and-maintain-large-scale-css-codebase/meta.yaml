    \ Writing loops, mixins and functions should be minimised or used very seldom.\
    \ As a general rule, if there are less than 10 variations of a rule, write it\
    \ 'by-hand'. If on the other hand you need to create background positions for\
    \ a sprite sheets of 30 images, this is something that tooling should be used\
    \ for.\n\nThe creation and use of mixins is discouraged. The overuse of mixins\
    \ can create code that is overly abstracted from the result. While mixins should\
    \ be used for font-stacks or to automatically yield error prone strings there\
    \ are few additional situations where they prove worthwhile.\n\nThis pursuit of\
    \ simplicity should be extended in the manner layouts are achieved. If a better\
    \ supported layout mechanism achieves the same goal with the same amount of DOM\
    \ nodes as a less well supported one, use the former. However, if a different\
    \ layout mechanism reduces the number of DOM nodes needed or presents additional\
    \ benefits yet is simply unfamiliar (I'm thinking of you Flexbox), take the time\
    \ to understand the benefits it might offer.\n\n## Summary\n\nRules are nothing\
    \ without enforcement. When many hands are touching the CSS codebase, no amount\
    \ of education or insistence can save your CSS content getting abused. Alongside\
    \ the carrot, I'm afraid it can be essential to give a little 'stick'. In this\
    \ case, the 'stick' can take the form of tools to fail the build of your product\
    \ when code is written against the rules you have implemented. In the next chapter\
    \ we will look at how to approach that. Here come the 'Fun Police'!\n\n# Chapter\
    \ 8. The Ten Commandments of Sane Style Sheets\n\n# Chapter 9. Tooling for an\
    \ ECSS approach\n\nIn this final chapter we will look at some of the tooling that's\
    \ available free and open source to facilitate writing sane and maintainable style\
    \ sheets.\n\nWhen authoring the CSS for an enduring project, the technology employed\
    \ to produce the CSS should be largely immaterial. We should always be aware that\
    \ a better or more efficient tool may become available to achieve our aims and\
    \ when possible, and if preferable, it should be embraced.\n\nTherefore, it shouldn't\
    \ matter whether Sass, PostCSS, LESS, Stylus, Myth or any other CSS processor\
    \ is employed to author the style sheets. The authored style sheets should be\
    \ as easy to migrate to another meta-language as possible, if and when needed.\n\
    \nFurthermore, the CSS processor employed should best serve the needs of the project\
    \ as a whole and not merely the preferences of any individual author. That said,\
    \ there are some necessary capabilities for the CSS processor so we will cover\
    \ that briefly next.\n\n## CSS requisites for CSS processors\n\nI consider a CSS\
    \ processor for style sheet authoring essential. This allows a differentiation\
    \ between 'authoring' style sheets (the style sheets that the author writes in\
    \ their CSS processor of choice) and the 'resultant' CSS (the compiled and minified\
    \ CSS that gets served to the user).\n\nDespite stating that a CSS processor is\
    \ essential, the requisite features needed are fairly trivial:\n\n- variables:\
    \ to mitigate human errors with colour picking and specifying constants like grid\
    \ measures\n- partials: to facilitate one-to-one parity of authoring style sheets\
    \ with a feature branch, template or logic file\n- colour manipulations: to allow\
    \ consistent manipulation of the aforementioned variables e.g. being able to adjust\
    \ or easily adjust the alpha of a colour\n\nAll other abilities are considered\
    \ non-essential and should be appraised particular to the needs of the project.\n\
    \n## Building CSS from authoring style sheets\n\nA build system of some sort is\
    \ required to compile the authoring style sheets (with their variables, mixins\
    \ and the like) into plain CSS. There are many tools available to perform this\
    \ task e.g. Grunt, Gulp and Broccoli to name just a few. Just as there is no universally\
    \ 'right' CSS processor, so there is no universally 'right' build tool.\n\nBesides\
    \ merely compiling authoring style sheets into CSS, good tooling can provide further\
    \ benefits.\n\n- Linting: to enable code conformity and prevent non-working code\
    \ reaching deployment\n- Aggressive minification: rebasing z-indexes, converting\
    \ length values to smaller length values e.g. (while '1pt' is equivalent to '16px'\
    \ it is one less character), merging alike selectors\n- Autoprefixer: to enable\
    \ fast and accurate vendor prefixing and prevent vendor prefixes being present\
    \ in the authoring style sheets\n\n> For considerations of what is deemed essential,\
    \ syntax-wise, in style sheet authoring, refer to Chapter 8 'Ten Commandments\
    \ of Sane Style Sheets'.\n\n## Save to compile, the journey of an ECSS style sheet\n\
    \nIn terms of tooling, at the time of writing, I currently write ECSS with the\
    \ help of Gulp and PostCSS plus its many and varied plugins.\n\nFor the very curious,\
    \ a little more on my [journey from Sass to PostCSS](http://journey-from-sass-to-postcss.com)\
    \ can be found here.\n\nThe style sheet authors write into a partial CSS file\
    \ (with a *.css file extension), using a syntax that is very similar to Sass.\n\
    \nOn saving an authoring style sheet, the Gulp watch task notices the file change\
    \ and first starts the authoring style sheets linting task. Then, providing all\
    \ is well, it compiles the partial authoring style sheets to CSS, auto-prefixes\
    \ them and then BrowserSync injects the changed CSS directly into the webpage\
    \ I'm working on. Typically, we will also create a source map file as some authors\
    \ find them easier for debugging. All this happens before I can alt+tab into my\
    \ browser window or even move my gaze from text editor to browser window.\n\n\
    If it's CSS heading for production, the resultant CSS typically takes an extra\
    \ step through [cssnano](https://cssnano.co). It's a fantastic and modular CSS\
    \ minifier by the extraordinarily talented Ben Briggs. Highly recommended.\n\n\
    Here's an example `gulpfile.js` that demonstrates how PostCSS might be setup in\
    \ a Gulp based build tool."
