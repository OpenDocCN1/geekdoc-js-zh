    \ is: \" + (t.loadEventEnd - t.responseEnd) + \" milliseconds\");\n          \
    \  }, 0);\n        };\n    })();\n</script>\n```\n\nThis lets us limit the timing\
    \ of the tests between the point all assets have been received (responseEnd) and\
    \ the point the page is rendered (loadEventEnd).\n\nSo, I set up a very simple\
    \ test. 20 different pages, all with an identical, enormous DOM, made up of 1000\
    \ identical chunks of this markup:\n\n```\n<div class=\"tagDiv wrap1\">\n  <div\
