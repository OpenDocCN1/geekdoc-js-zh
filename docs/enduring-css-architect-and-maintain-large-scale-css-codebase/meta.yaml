    For simpler font-stacks, a variable can handle this need easily so may be preferable.


    Mixins are great for more complex font stacks, where it''s preferable to have
    certain font stacks apply in different situations. For example, perhaps even for
    the body text, one font is required for LoDPI, and another for HiDPI. These situations
    can''t be dealt with by using a variable alone so a mixin is used as needed.


    Ultimately, aim for ten or less mixins in a project. Any more than that and it''s
    probable mixins are being abused to needlessly abstract code.


    # # Avoid @extends


    To determine whether using @extend was worthwhile I did a short experiment on
    a Sass codebase I was working with. There were 73 instances that would require
    a Headline font stack and 37 instances that would require a Headline Condensed
    font stack (so if going the mixin route, that''s 73 `@include Headline` and 37
    instances of `@include HeadlineCondensed`).


    # ## Using @includes


    Using mixins (`@includes` in Sass) for the ''Headline'' and ''Headline Condensed''
    the file size of the resultant CSS was:


    146.9kB (minified), 15.4kB (Gzipped)


    # ## With NO @includes


    With no font declarations AT ALL (e.g. all instances of `@include Headline` and
    `@include HeadlineCondensed` were simply removed):


    105.5kB (minified), 14.2kB (Gzipped)


    A large saving in raw file size but when Gzipped, Just over a 1KB saving.'
