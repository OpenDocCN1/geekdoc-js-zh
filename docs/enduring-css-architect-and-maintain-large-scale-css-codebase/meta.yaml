    \ */\n}\n\n.class-on-sidebar .widget {\n    /* Why doesn't this work */\n}\n```\n\
    \nInrelationed(applyingaweonev3Cspecifycliscoumwecomrule\n\n| selector | inline\
    \ | ID | class | type |\n| --- | --- | --- | --- | --- |\n| .widget | 0 | 0 |\
