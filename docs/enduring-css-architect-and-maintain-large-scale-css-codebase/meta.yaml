    # ## What properties are expensive?


    An ''expensive'' property/value pairing is one we can be pretty confident will
    make the browser struggle with when it has to repaint the screen (e.g. on scroll).


    How can we know what will be an ''expensive'' style? Thankfully, we can apply
    common sense to this and get a pretty good idea what is going to tax the browser.
    Anything that requires a browser to manipulate/calculate before painting to the
    page will be more costly. For example, box-shadows, border-radius, transparency
    (as the browser has to calculate what is shown below), transforms and performance
    killers like CSS filters - if performance is your priority, anything like that
    is your worst enemy.


    Juriy ''kangax'' Zaytsev did [a fantastic blog post also covering CSS performance](link)
    back in 2012. He was using the various developer tools to measure performance.
    He did a particularly good job of showing the difference that various properties
    had on performance. If this kind of thing interests you then that post is well
    worth your time.


    # ## Summary


    Some takeaways from these tests:


    +   - sweating over the selectors used in modern browsers is futile; most selection
    methods are now so fast it''s really not worth spending much time over. Furthermore,
    there is disparity across browsers of what the slowest selectors are anyway. Look
    here last to speed up your CSS.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Appendix 1: CSS selector performance


    +   • excessive unused styles are likely to cost more, performance wise, than
    any selectors you chose so look to tidy up there second. 3000 lines that are unused
    or surplus on a page are not even that uncommon. While it''s common to bunch all
    the styles up into a great big single `styles.css`, if different areas of your
    site/web application can have different (additional) style sheets added (dependency
    graph style), that may be the better option.


    +   • if your CSS has been added to by a number of different authors over time,
    look to tools like [UnCSS](https://github.com/uncss/uncss) to automate the removal
    of styles; doing that process by hand is no fun!


    +   • the battle for high performing CSS will not be won in the selectors used,
    it will be won with the judicious use of property and values.


    +   • getting something painted to screen fast is obviously important but so is
    how a page feels when the user interacts with it. Look for expensive property
    and value pairs first (Chrome continuous repaint mode is your friend here), they
    are likely to provide the biggest gains.'
  merge: -1
  pgno: 120
