    \nPostCSS支持使用扩展的CSS语法。为了编写目的，所使用的语法大量借鉴自[Sass](https://sass-lang.com)。这提供了使我们的编写样式表更易于维护的功能。\n\
    \n使用PostCSS，我们能够利用：\n\n- 变量\n- mixin（类似于某些设置的宏，例如字体族）\n- 用&符号引用**关键选择器**\n- 为冗长的规则集编写循环的能力（例如100种不同颜色的标题变体）\n\
    \n实际上，PostCSS在功能上类似于Sass、LESS或Stylus等CSS预处理器。\n\n它的不同之处在于其模块化和可扩展性。与上述预处理器需要\"\
