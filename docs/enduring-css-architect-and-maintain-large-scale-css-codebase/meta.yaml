    \ is something that gets added to the Block to modify its appearance. Suppose\
    \ we wanted to theme our media object differently in a different scenario. BEM\
    \ facilitates it like this:"
  mdcn: "\n可以说，用原子 CSS 作为例子可能并不公平，也未必能公正地代表 OOCSS。然而，要找到一个经典的 OOCSS 示例却很困难，因为 CSS\
    \ 作者们对其理解和实现方式似乎存在很大差异。\n\n```\n.media { overflow: hidden; margin: 10px; }\n.media\
    \ .img { float: left; margin-right: 10px; }\n.media .img img { display: block;\
    \ }\n.media .imgExt { float: right; margin-left: 10px; }\n```\n\n## OOCSS 的\"\
    经典\"示例；\"媒体对象\"模式\n\n然而，也许这个媒体对象在 300px 宽的视口中需要以不同的方式布局。你可以设置一个媒体查询，在这种情况下让它变成基于列的布局。但假设你在相同的视口宽度下，在不同的上下文中使用了相同的\"\
    对象\"呢？而且在那个上下文中，它不应该采用列布局。概括来说：\n\n- 一个媒体对象在 300px 宽时需要是列布局（我们称之为 'media1'）\n\
    - 第二个媒体对象在 300px 宽时需要是行布局（因为它处于另一个上下文/容器中，我们称之为 'media2'）\n\n让我们创建一个能分离更多关注点的类。它让媒体对象在特定视口下变成列布局：\n\
    \n## 第三章：实施被感知的智慧\n\n```\n@media (min-width: 18.75rem) {\n    .media-vp-small\
    \ {\n        /* Styles */\n    }\n}\n```\n\n这会被添加到任何需要在该视口下变成列的元素上（'media1'），所以你需要去模板/HTML\
    \ 中进行修改，在需要的地方添加这个类。\n\n此外，'media2' 在更大的视口下需要有不同的背景色。让我们再添加一个类来分离这个关注点：\n\n```\n\
    @media (min-width: 60rem) {\n    .draw-focus {\n        /* Styles */\n    }\n\
    }\n```\n\n进入 HTML/模板，在需要的地方添加那个样式。\n\n哦，还有，'media1' 需要在更大的视口下让 .img 更宽，并且去掉外边距。我们可以再做一个类来实现：\n\
    \n```\n@media (min-width: 60rem) {\n    .expand-img {\n        width: 40%;\n \
    \       margin-right: 0!important;\n    }\n}\n```\n\n回到 HTML/模板中去实现这个改动。\n\n希望现在你能看出这正在走向何方？为了实现我们的媒体对象需要适应的众多不同场景，大量单一职责原则（SRP）类被添加了进去。\n\
    \n这种方法并没有让我的大型响应式代码库更易于维护。事实上，恰恰相反。每当需要改动时，都必须去寻找特定情境下的特定 SRP 类，而且经常还需要在标记/模板中添加/删除\
    \ HTML 类。这让我思考一个问题：\n\n> 为什么这个东西，不能就是那个东西呢？\n\n现在，你可能会反驳说，\"这个例子很蠢，如果一个设计有这么多可能性，应该被规范化\"\
    。对此我会反驳说，这并不应该是必要的。那些负责前端编码的人不应该因为可预测性问题而束缚设计师的创造力。他们应该能够简单轻松地编码实现新设计，而不必担心新组件/模块/事物可能会如何影响其他部分。\n\
    \n> 试图仅仅因为视觉变化会让我们的代码库难以维护就阻止它们，这是一种站不住脚的立场。我们应该能够迅速且可预测地构建任何新的视觉处理，而不必担心无意中影响项目的其他领域。\n\
    \n当我使用 OOCSS 来满足需求时，我构建新视觉效果的速度降低了，单一职责原则类的数量却增加了；往往一个类在整个项目中只使用一两次。\n\n在快速变化的项目中使用\
    \ OOCSS 时，我还发现过了一段时间后，当需要改动时，\"拆解\"这些抽象类变得极其令人沮丧。我经常需要创建许多非常相似的抽象类，而它们实际上很少被使用。像\
    \ *w10, w15, w20, w25* 等用于不同宽度百分比的工具类，看起来是个好主意，也是显而易见的抽象，但它们最终证明是无用的，而且不利于设计的迭代（又回到了在不同上下文中需要执行不同操作的问题）。\n\
    \n因此，在使用 OOCSS 时我得到的第一个重要教训，与优秀的 Kaelig Deloumeau-Prigent 在 BBC 和《卫报》从事大型 CSS\
    \ 代码库工作时学到的教训相同：\n\n> 两年前我在一本书中宣扬 DRY 代码，但在从事长期项目之后，\"解耦\"对我来说变得更为重要。\n\n在大型、快速变化的项目中，能够轻松地将视觉模块从项目中解耦出来，对于持续维护至关重要，而\
    \ OOCSS 并不能很好地满足这一需求。\n\n## SMACSS\n\nSMACSS，即可扩展的模块化 CSS 架构（Scalable Modular\
    \ Architecture for CSS），在 [Jonathan Snook 关于此主题的书](https://smacss.com/)中有详细阐述。我不会在这里详细讨论\
    \ SMACSS，因为我认为你应该自己去阅读那本书。阅读 SMACSS 让我在面对自己的挑战时有很多思考，我当然也从中借鉴了一些东西，比如如何思考状态变化。然而，我会详细说明为什么\
    \ SMACSS 对我不适用。再次声明，就像我对 OOCSS 观点的免责声明一样，这不是对 SMACSS 的批评。这只是强调那些对我不适用的部分，以及为什么我觉得它没能解决我的问题。SMACSS\
    \ 为网站的视觉方面明确定义了术语和概念。因此，它规定了基础、布局、模块和可选的主题规则/文件来支持这些定义。例如，考虑这个建议的文件结构：\n\n```\n\
    +-layout/\n| +-grid.scss\n| +-alternate.scss\n+-module/\n| +-callout.scss\n| +-bookmarks.scss\n\
    | +-btn.scss\n| +-btn-compose.scss\n+-base.scss\n+-states.scss\n+-site-settings.scss\n\
    +-mixins.scss\"\n```\n\n> 摘录自：Jonathan Snook.《Scalable and Modular Architecture\
    \ for CSS》。</blockquote>\n\n虽然这些定义在许多场景下都很合理，但对于我的场景却不适用。我想要一种更松散的方案，一种不需要让我考虑将需要构建的内容套入那些视觉定义中的方案；我构建和维护的应用程序常常无法遵循这些定义。\n\
    \n## BEM\n\nBEM 是由 http://yandex.ru 的开发人员开发的一种方法论。\n\n我从 BEM（即块元素修饰符，Block Element\
    \ Modifier）中学到的关键点是：命名约定在 CSS 维护方面能带来多大的价值。\n\n如果你想了解更多关于 BEM 的信息，权威资源是 http://en.bem.info。关于它的起源，我建议从这里开始阅读：https://en.bem.info/method/history/\n\
    \n同样，就像 SMACSS 一样，我不会试图全面解释 BEM 方法论的方方面面。不过，我会给你一个\"电梯演讲\"式的关键要点概述。BEM 方法论的核心概念是：页面的关键区域可以被定义为\"\
    块\"（Blocks）。而这些关键区域由元素（Elements）组成。我们可以通过命名方式来表示块与其元素之间的关系。以之前提到的 OOCSS 媒体对象为例。在\
    \ BEM 方法中，我们可能会这样使用类：\n\n```\n<div class=\"media\">\n    <a href=\"#\" class=\"\
    media__img\">\n        <img class=\"media__headshot\" src=\"mini.jpg\" alt=\"\
    Stubbornella\" />\n    </a>\n    <div class=\"media__attribution\">@Stubbornella\
    \ 14 minutes ago</div>\n</div>\n```\n\n这种命名方案的好处在于，它清楚地传达了元素与其所属块之间的关系。此外，在 HTML\
    \ 之外，如果我们在 CSS 中遇到这样的选择器：\n\n```\n.media__headshot {\n\n}\n```\n\n我们立刻就能知道这是一个名为\
    \ 'headshot' 的元素，它位于名为 'media' 的块内部。这种将组件作为某部分进行命名空间划分的方法有助于隔离样式，防止应用的样式\"泄漏\"\
    出去——这是我对 OOCSS 最主要的抱怨之一。这无疑是朝着解决我所面临问题的正确方向迈出了一的一步。\n\nBEM 还有\"修饰符\"（modifier）的概念。修饰符是添加到块上以修改其外观的东西。假设我们在不同的场景下想要以不同的主题为我们的媒体对象设置样式。BEM\
    \ 可以这样实现：\n"
