    \ Frain 自 1996 年以来一直从事 Web 设计/开发工作。他目前在 bet365 担任高级前端开发工程师。\n\n在涉足 Web 之前，他曾是一名被低估（且谦虚）的电视演员和技术记者，毕业于索尔福德大学，获得媒体与表演学位。\n\
    \n他写了四部同样被低估（他的看法）的剧本，仍然抱有（逐渐淡化的）能够卖出一部的信念。工作之余，他享受简单的乐趣；趁身体和妻子还允许的时候踢室内足球，以及和他的两个儿子摔跤。\n\
    \n他的其他著作，[《Responsive Web Design with HTML5 and CSS3》](http://example.com) 和 [《Sass\
    \ and Compass for Designers》](http://example.com) 现已出版。请访问 Ben 的在线网站 [www.benfrain.com](http://www.benfrain.com)，并在\
    \ Twitter 上关注他 [twitter.com/benfrain](http://twitter.com/benfrain)。\n\n## 致谢\n\
    \n我要向直接 or 间接帮助完成这本书的少数人表示感谢。\n\n首先，[Matthew Mitchell](https://example.com)，他提供了封面\
    \ artwork、排版指导和网站设计，并忍受（双关语）我每天都在喋喋不休地谈论 CSS。\n\n我还要感谢我在 bet365 的工作同事，主要是 [Pete\
    \ Griffiths](https://example.com)，他鼓励开发团队大规模采用 ECSS 方法。\n\n最后，我要感谢我那长期受苦的妻子，允许我在厨房里\"\
    敲敲打打\"无数个小时，以便把这些东西从脑子里倒出来。\n\n## 前言\n\n这是一本小书，凝练了我目前对于如何最好地编写和维护面向快速变化、长期存在的\
    \ Web 项目的 CSS 代码库的思考。\n\n- LilyJames 没有可下载的框架。\n- 没有必需的工具（尽管有对于工具应提供什么功能的主观指导）。\n\
    - 没有为你写好的东西。\n\n metaphorically 说，\"持久的 CSS\"不是给你鱼；而是教你钓鱼。\n\n这是一种编写 CSS 的方法论，一旦实施，将为你的项目提供可预测且易于维护的\
    \ CSS 代码库。\n\n持久 CSS 的最早迭代首次记录在博客文章 [《持久 CSS：为快速变化、长期存在的项目编写样式表》](https://benfrain.com/enduring-css-writing-style-sheets-rapidly-changing-long-lived-projects/)\
    \ 中。\n\n然而，ECSS 方法自此有所发展，因此本书应被视为该方法的权威资源。\n\n希望你喜欢阅读。\n\n**Ben Frain** 2015 年\
    \ 10 月 26 日\n"
