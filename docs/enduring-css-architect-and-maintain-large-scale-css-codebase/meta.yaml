    depending upon your goals can offer a preferential outcome.

    2. I’m not suggesting that the approach I advocate is a panacea to all CSS scaling
    problems. It is not (there are none).


    # Responsive web design, the Achilles heel of OOCSS


    For me, the two biggest problems with an OOCSS approach are:


