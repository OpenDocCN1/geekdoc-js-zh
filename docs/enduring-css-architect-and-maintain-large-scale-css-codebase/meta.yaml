    # Appendix 1: CSS selector performance


    Back at the beginning of 2014 I was having a “debate” (I used air-quotes there
    people) with some fellow developers about the irrelevance, or not, of worrying
    about CSS selector speed.


    Whenever exchanging theories/evidence about the relative speed of CSS selectors,
    developers often reference Steve Souders work on CSS selectors from 2009. It’s
    used to validate claims such as ‘attribute selectors are slow’ or ‘pseudo selectors
    are slow’.


    For the last few years, I’ve felt these kinds of things just weren’t worth worrying
    about. The sound-bite I have been wheeling out for years is:


    > With CSS, architecture is outside the braces; performance is inside


    But besides referencing Nicole Sullivan’s later post on Performance Calendar to
    back up my conviction that the selectors used don’t really matter, I had never
    actually tested the theory.


    To try and address this, I attempted to produce some tests of my own that would
    settle the argument. At the least, I believed it would prompt someone with more
    knowledge/evidence to provide further data.


    # Testing selector speed


    Steve Souders’ aforementioned tests use JavaScript’s `new Date()`. However, nowadays,
    modern browsers (iOS/Safari were a notable exception at the time of testing) support
    the Navigation Timing API which gives us a more accurate measure we can use. For
    the tests, I implemented it like this:'
