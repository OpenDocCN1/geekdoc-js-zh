  md: '# Using @extend


    By using an `@extend` rather than an `@include`:


    106.9kB (minified), 14.5 (Gzipped)


    What to conclude from this data? For me, all other things being equal, if you
    absolutely want the smallest file size, perhaps `@extend` is the way to go. There
    is some saving, albeit minor. However, being realistic. If there is any maintainability
    gain for you using `@include` instead of `@extend` I certainly wouldn''t worry
    about the file size. Personally, I don''t allow `@extend` functionality in projects.
    It adds an additional layer of complexity to debugging for very little gain.


    # 8. Thou shalt comment all magic numbers and browser hacks


    The variables file should contain all variables relevant to the project.


    PostCSS facilitates variables and mixins defined in either CSS files or as JavaScript
    objects. You can read [more about the latter here](https://github.com/postcss/postcss-custom-properties).
    SAFARI.


    If a situation arises where a pixel based value needs entering into the authoring
    style sheets that isn''t already defined in the variables this should serve as
    a red flag to you. This scenario is also covered above. In the case where a ''magic''
    number needs entering in the authoring style sheets, ensure a comment is added
    on the line above to explain it''s relevance. This may seem superfluous at the
    time but think of others and yourself in 3 months time. Why did you add a negative
    margin of 17 pixels to that element?


    Example:'
