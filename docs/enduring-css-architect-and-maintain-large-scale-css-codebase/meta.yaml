- md: 'The BEM documents dictate the use of a single underscore character to identify
    a Modifier for a Block. This modifier class must always be used alongside the
    block name. For example, you must do this:


    ```

    <div class="media media_dark">

    ```


    And not this:


    ![](img/599d07ddffb980e572103ffb27d26093_29_0.png)


    ```

    <div class="media_dark">

    ```


    I see the value in using modifiers in this manner but it proved problematic for
    me. Often the things I was styling needed to behave differently in a more traditional
    manner. Perhaps visuals needed to display differently depending upon the context
    they were being used, or if another class was being added above it in the DOM.
    Or due to certain media query conditions, or indeed any combination of those scenarios.
    I needed a way to author styles that was pragmatic enough to deal with the non-ideal
    situations that occurred. Some way to keep some sanity in the authoring style
    sheets no matter what was thrown at them.


    ## Summary


    Of all the existing CSS methodologies I looked at, I took the most from BEM. There
    is much to appreciate in BEM:


    - All elements get the same specificity; a class is added to all the elements.

    - There is no use of type selectors so HTML structure isn''t tightly coupled to
    the styles.

    - It''s easy to reason about what the parent of an element is, whether viewing
    the DOM tree in the browser developer tools or the CSS in a code editor.


    However, the use of modifiers didn''t really fit my needs. Although perhaps it
    wasn''t preferable, my reality was that often I would need to override styles
    on a Block (in BEM parlance) depending upon some eventuality above it or by the
    side of it in the DOM.


    For example, in the scenario where existing logic is already determined in an
    application, there may be a scenario where a class like `contains2columns` would
    be added above the item in question in the DOM and I would need to style changes
    based upon that, as opposed to changes directly upon the Block in question.


    With BEM I couldn''t find a clear way of understanding how that eventuality should
    be handled. Or how I could contain those kinds of overrides in the authoring style
    sheets. I wanted to define items and encapsulate all the eventualities that may
    occur on a particular item.


    I also found the syntax confusing to reason over when glancing at classes. The
    differentiation between the way modifiers were written and the way elements were
    written was negligible. This would be an easy fix but it was still something that
    bugged me about it.


    Finally, I realised I needed something extra. I wanted the ability to communicate
    and facilitate different contexts for a module. When a ''thing'' was created by
    the same piece of logic but could be used and styled differently in different
    contexts, I wanted a means of communicating that.


    From SMACSS the main thing I found useful was dealing with state. I liked the
    declarative manner in which classes like `is-pressed` or attributes `.btn[data-state=pressed]`
    clearly communicated the state of elements.


    OOCSS turned out to be the antithesis of what I needed. Whilst I appreciate what
    OOCSS can offer, it wasn''t the solution to the problems I had. I didn''t want
    to create a Lego box of styles that authors could use to build up visuals in a
    DOM/template. The abstractions OOCSS facilitated were inherently ''leaky'' which
    made maintenance problematic (change the value in one rule and you may inadvertently
    affect many elements), it was also difficult to find ways of dealing with varying
    viewports, for all the reasons already explained.


    Ultimately, by trying and failing, to varying degrees, with each of these existing
    solutions I finally fully understood my problems. Now it was time to tailor make
    a solution.


    > Good ~~artists~~ coders copy, great ~~artists~~ coders steal **Pablo Picasso**
    (sort of - sorry Pablo)


    Walk with me.


    ## Chapter 4. Introducing ECSS


    In the last chapter we considered existing CSS methodologies and where, for your
    humble authors needs, they fell short.


    I''m not about to try and convince you that the Enduring CSS approach is the ''Alpha
    and the Omega''. However, it does have different strengths and aims than the existing
    approaches. Therefore, even if taking it wholesale doesn''t appeal, I''d hope
    there may be something you can borrow to solve your own issues.


    Highlights of ECSS:


    - It gains maintainability by isolating each visual pattern.

    - File size remains minimal over long periods of time by virtue of the fact that
    you can cut out sections/features/components with impunity.

    - Rules are ''self-quarantining''.

    - Class names/selectors can communicate context, originating logic and variation.

    - All language/technology files that create a module are contained within a shared
    folder.


    When I first wrote about Enduring CSS I was expecting a backlash of sorts. At
    that time (August 2014), no-one was really advocating what I was suggesting. Common
    perceived wisdom was to abstract visual patterns, normalise designs as much as
    possible and DRY out code. Enduring CSS is in some ways the antithesis of these
    beliefs.


    > In case you aren''t aware of the acronym, DRY stands for Don''t Repeat Yourself,
    a popular goal when coding so that logic is only written once in a codebase to
    provide a single source of truth


    Before we get into this, I think it may help to clarify the terminology that will
    be used. The terms used to define the visual parts of a page are known by different
    names in different approaches. There''s nothing revelatory in what I''m suggesting
    or the terms I''m using, it''s just important we''re all on the same page before
    we get into this.


    ## Defining terminology


    I''m using the term ''module'' to designate an area of functionality and/or the
    code that creates it. To exemplify, the header of a website could be considered
    a module. The header module would, in turn, be made up of other smaller pieces
    of functionality. For example, drop down menus or search boxes. These nested pieces
    of functionality would be defined as components. Finally, our smallest ''items''
    would be the child nodes that make up a component or module.


    So, to reiterate:


    - A **module** is the widest, visually identifiable, individual section of functionality.

    - **Components** are the nested pieces of functionality that are included within
    a module.

    - **Child nodes** are the individual parts that go to make up a component (typically
    nodes in the DOM).


    For brevity, for what follows, when I''m referring to modules, it could be a module
    or component. The difference from an ECSS authoring perspective is unimportant.


    ## The problems ECSS solves


    My primary goal with ECSS was to isolate styles as opposed to abstracting them.


    Ordinarily, it makes sense to make CSS classes that are abstractions of common
    functionality. The benefit being that they can then be re-used and re-applied
    on many varied elements. That''s sound enough in principle. The problem is, on
    larger and more complicated user interfaces, it becomes impossible to make even
    minor tweaks and amendments to those abstractions without inadvertently affecting
    things you didn''t intend to. A guiding principle with ECSS therefore was to isolate
    styles to the intended target. Depending upon your goals, even at the cost of
    repetition, isolation can buy you greater advantages; allowing for predictable
    styling and simple decoupling of styles.


    A further advantage of isolating styles is that designers can be encouraged to
    bring whatever they needed making, without needing them to be encumbered by existing
    visual patterns. Every new module that needs to be coded can be a ''greenfield''.
    I found that I could code out designs far faster when starting from scratch than
    attempting to build them from any number of vague abstractions.


    ## Dealing with specificity


    I also wanted to negate issues surrounding specificity. To this end, I adopted
    the widely used approach of insisting all selectors used a single (or as close
    to that ideal as possible) class-based selector.


    > If you''re having CSS problems I feel bad for you son, I got 99 problems but
    specificity ain''t one.


    https://twitter.com/benfrain/status/537339394706141184


    Furthermore, structural HTML elements (with the exception of pseudo-elements)
    are NEVER referenced in the style sheets as type selectors. In addition ID selectors
    are completely avoided in ECSS. Not because ID selectors are bad per se, but because
    we need a level playing field of selector strength.'
