  md: '# The cascade


    Typically, the cascade part of CSS is useful. It allows equivalent rules further
    down the CSS file to be applied over rules higher up.


    However, in a large codebase it becomes an unwanted safety net, allowing authors
    to continually add CSS to the codebase.


    This can happen for a number of reasons. As an example, authors more familiar
    with other languages often lack the confidence or intimate knowledge of the CSS
    codebase to be able to confidently remove existing code. They therefore take the
    safe option and override existing rules using a more specific set of rules. In
    practical terms this means adding the new rules, with whatever selectors are necessary
    to get the job done, to the bottom of the existing styles.


    This is a common and frustrating scenario developers face when they inherit a
    CSS codebase; bloated CSS files that have been a breeding ground for CSS cruft.


    # Summary


    At this point, we''ve covered some of the high level problems that are symptomatic
    of a CSS codebase struggling to cope at scale. We''ve looked at the problems of
    specificity and the cascade. In the next chapter, we''ll look at the accepted
    wisdom and approaches of trying to tame large CSS codebases and consider any shortcomings
    they present.'
  merge: -1
