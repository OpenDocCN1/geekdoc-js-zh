    \n## 处理覆盖\n\n在前面的例子中，已经演示了如何处理关键选择器的覆盖。我们将覆盖选择器嵌套在关键选择器的规则块内，并用&符号引用父元素。&符号，与Sass语言中一样，是父选择器。把它大致等同于JavaScript中的`this`可能有助于理解。\n\
