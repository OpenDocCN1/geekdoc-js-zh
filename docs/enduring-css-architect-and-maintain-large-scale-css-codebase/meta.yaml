    阿门。\n\n### 为什么是十诫？\n\n以下这套极具主观性的规则，是作为跨开发团队编写可预测样式表的方法而产生的。这些规则各自解决不同的需求，而且大多数情况下可以通过工具强制执行。当项目中只有一两个CSS开发者时，这些工具可能显得多余。然而，超过几个活跃的开发者，这些工具就能一次又一次地收回其时间投资。我们将在下一章中处理用于\"\
