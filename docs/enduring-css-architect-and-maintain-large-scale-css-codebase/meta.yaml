    \  }\n}\n```\n\n## 5. Thou shalt use variables for sizing, colours and z-index\n\
    \nFor any project of size, setting variables for sizing, colours and z-index is\
    \ essential.\n\nUIs are typically based upon some form of grid or sizing ratio.\
    \ Therefore sizing should be based upon set sizes, and sensible delineations of\
    \ those sizes. For example here is 11px based sizing and variants as variables:\n\
    \n```\n$size-full: 11px;\n$size-half: 5.5px;\n$size-quarter: 2.75px;\n$size-double:\
    \ 22px;\n$size-treble: 33px;\n$size-quadruple: 44px;\n```\n\nFor a developer,\
    \ the use当以 uses variables offers additional economies. For example, it saves\
    \ colour picking values from composites. It also helps to normalise designs.\n\
    \nFor example, if a project uses only 13, 15 and 22px font sizes and a change\
    \ comes through requesting 14px font-sizing, the variables provide some normalisation\
    \ reference. In this case, should the fonts be 13 or 15px as 14 is not used anywhere\
    \ else? This allows developers to feedback possible design inconsistencies to\
    \ the designers.\n\nThe same is true of colour values. For example, suppose we\
    \ have a variable for the hex #333. We can write that as a variable like this:\n\
    \n```\n$color-grey-33: #333;\n```\n\nOn the surface it seems ridiculous to write\
    \ the variable name when the hex value is shorter. However, again, using variables\
    \ prevents unwanted variants creeping in to the code base (e.g. `#323232`) and\
    \ helps identify 'red flags' in the code.\n\nIt's also important to still use\
    \ the variables when making amendments to colours. Use colour functions on the\
    \ variables to achieve your goal. For example, suppose we want a semi-opaque `#333`\
    \ colour.\n\nThat should be achieved in the authoring style sheets like this:\n\
    \n```\n.ip-Header {\n    background-color: color($color-grey-33 a(.5));\n}\n```\n\
    \nPostCSS can provide a polyfill for the W3C colour functions: https://drafts.csswg.org/css-color/#modifying-colors\
    \ and the example above yields this CSS:\n\n```\n.ip-Header {\n    background-color:\
    \ rgba(51, 51, 51, 0.5);\n}\n```\n\nIn this example we have used the alpha CSS\
    \ colour function. We use the `color()` function, pass in the colour we want to\
    \ manipulate and then the manipulation (alpha in this instance).\n\nUsing the\
    \ variables can initially seem more complex but makes it easier for future authors\
    \ to reason about what colour is being manipulated.\n\nThe use of variables for\
    \ z-index is equally important. This enforces some sanity when it comes to stacking\
    \ contexts. There should be no need for `z-index: 999` or similar. Instead, use\
    \ one of only a few defaults (set as variables). Here are some relevant variables\
    \ for z-index:\n\n```\n$zi-highest: 50;\n$zi-high: 40;\n$zi-medium: 30;\n$zi-low:\
    \ 20;\n$zi-lowest: 10;\n$zi-ground: 0;\n$zi-below-ground: -1;\n```\n\n## 6. Thou\
    \ shalt always write rules mobile first (avoid max-width)\n\nFor any responsive\
    \ work, we want to embrace a mobile-first mentality in our styles. Therefore,\
    \ the properties and values within the root of a rule should be the properties\
    \ that apply to the smallest viewports (e.g. mobile). We then use media queries\
    \ to override or add to these styles as and when needed.\n\nConsider this:\n\n\
    ```\n.med-Video {\n    position: relative;\n    background-color: $color-black;\n\
    \    font-size: $text13;\n    line-height: $text15;\n    /* At medium sizes we\
    \ want to bump the text up */\n    @media (min-width: $M) {\n        font-size:\
    \ $text15;\n        line-height: $text18;\n    }\n    /* Text and line height\
    \ changes again at larger viewports */\n    @media (min-width: $L) {\n       \
    \ font-size: $text18;\n        line-height: 1;\n    }\n}\n```\n\nThat would yield\
    \ this CSS:\n\n```\n.med-Video {\n  position: relative;\n  background-color: #000;\n\
    \  font-size: 13px;\n  line-height: 15px;\n}\n\n@media (min-width: 768px) {\n\
    \  .med-Video {\n    font-size: 15px;\n    line-height: 18px;\n  }\n}\n\n@media\
    \ (min-width: 1200px) {\n  .med-Video {\n    font-size: 18px;\n    line-height:\
    \ 1;\n  }\n}\n```\n\nWe only need to change the font-size and line-height at different\
    \ viewports so that is all we are amending. By using min-width (and not max-width)\
    \ in our media query, should the font-size and line-height need to stay the same\
    \ at a larger size viewport we wouldn't need any extra media queries. We only\
    \ need a media query when things change going up the viewport size range. To this\
    \ ends, the use of max-width as the single argument of a media query is discouraged.\n\
    \nBottom line: write media queries with min-width not max-width. The only exception\
    \ here is if you want GREAT want to isolate some style to a middle range. For\
    \ example between medium and large viewports. Example:\n\n```\n.med-Video {\n\
    \    position: relative;\n    background-color: $color-black;\n    font-size:\
    \ $text13;\n    line-height: $text15;\n    /* Between medium and large sizes we\
    \ want to bump the text up */\n    @media (min-width: $M) and (max-width: $L)\
    \ {\n        font-size: $text15;\n        line-height: $text18;\n    }\n}\n```\n\
    \n## 7. Use mixins sparingly (and avoid @extend)\n\nAvoid the temptation of abstracting\
    \ code into mixins. There are a few areas where mixins are perfect. The code for\
    \ CSS text truncation (e.g. `@mixin Truncate`) or iOS style inertia scrolling\
    \ panels, where there are number of pseudo selectors to get right for different\
    \ browsers. Another good use case can be complex font stacks.\n\nFont stacks are\
    \ difficult to get right and tedious to author. The sanest way to deal with fonts\
    \ is to have the body use the most common font stack and then only this with a\
    \ different font-stack as and when needed.\n\nFor example:\n\n```\n.med-Video\
    \ {\n    position: relative;\n    background-color: $color-black;\n    font-size:\
    \ $text13;\n    line-height: $text15;\n    /* At medium sizes we want to bump\
    \ the text up */\n    @media (min-width: $M) {\n        @mixin FontHeadline;\n\
    \        font-size: $text15;\n        line-height: $text18;\n    }\n}\n```\n\n\
    For simpler font-stacks, a variable can handle this need easily so may be preferable.\n\
    \nMixins are great for more complex font stacks, where it's preferable to have\
    \ certain font stacks apply in different situations. For example, perhaps even\
    \ for the body text, one font is required for LoDPI, and another for HiDPI. These\
    \ situations can't be dealt with by using a variable alone so a mixin is used\
    \ as needed.\n\nUltimately, aim for ten or less mixins in a project. Any more\
    \ than that and it's probable mixins are being abused to needlessly abstract code.\n\
    \n### Avoid @extends\n\nTo determine whether using @extend was worthwhile I did\
    \ a short experiment on a Sass codebase I was working with. There were 73 instances\
    \ that would require a Headline font stack and 37 instances that would require\
    \ a Headline Condensed font stack (so if going the mixin route, that's 73 `@include\
    \ Headline` and 37 instances of `@include HeadlineCondensed`).\n\n### Using @includes\n\
    \nUsing mixins (`@includes` in Sass) for the 'Headline' and 'Headline Condensed'\
    \ the file size of the resultant CSS was:\n\n146.9kB (minified), 15.4kB (Gzipped)\n\
    \n### With NO @includes\n\nWith no font declarations AT ALL (e.g. all instances\
    \ of `@include Headline` and `@include HeadlineCondensed` were simply removed):\n\
    \n105.5kB (minified), 14.2kB (Gzipped)\n\nA large saving in raw file size but\
    \ when Gzipped, just over a 1KB saving.\n\n### Using @extend\n\nBy using an `@extend`\
    \ rather than an `@include`:\n\n106.9kB (minified), 14.5kB (Gzipped)\n\nWhat to\
    \ conclude from this data? For me, all other things being equal, if you absolutely\
    \ want the smallest file size, perhaps `@extend` is the way to go. There is some\
    \ saving, albeit minor. However, being realistic. If there is any maintainability\
    \ gain for you using `@include` instead of `@extend` I certainly wouldn't worry\
    \ about the file size. Personally, I don't allow `@extend` functionality in projects.\
    \ It adds an additional layer of complexity to debugging for very little gain.\n\
    \n## 8. Thou shalt comment all magic numbers and browser hacks\n\nThe variables\
    \ file should contain all variables relevant to the project.\n\nPostCSS facilitates\
    \ variables and mixins defined in either CSS files or as JavaScript objects. You\
    \ can read [more about the latter here](https://github.com/postcss/postcss-custom-properties).\n\
    \nSAFARI.\n\nIf a situation arises where a pixel based value needs entering into\
    \ the authoring style sheets that isn't already defined in the variables this\
    \ should serve as a red flag to you. This scenario is also covered above. In the\
    \ case where a 'magic' number needs entering in the authoring style sheets, ensure\
    \ a comment is added on the line above to explain it's relevance. This may seem\
    \ superfluous at the time but think of others and yourself in 3 months time. Why\
    \ did you add a negative margin of 17 pixels to that element?\n\nExample:\n```"
