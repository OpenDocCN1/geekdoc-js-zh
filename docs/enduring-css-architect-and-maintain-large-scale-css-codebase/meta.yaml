    }\n```\n\nIn the authoring style sheets, the key selector (`.key-Selector`) is\
    \ never repeated at a root level. Therefore, from a maintenance point of view,\
    \ we only have to search for `.key-Selector` in the code base and we will find\
    \ everything that could happen to that key selector described in a single location;\
    \ a single source of truth.\n\n+   - What happens if we need it to display differently\
    \ in a different view-port size?\n- What happens when it lives within containerX?"
  - "[PAGE 78]\n\n+   - What happens when this or that class gets added to it via\
    \ JavaScript?\n\nIn all these instances the eventualities for that key selector\
    \ are nested within that single rule block. This means that any possible specificity\
    \ issues are entirely isolated within a single set of curly braces.\n\nLet's look\
    \ at overrides in further detail next.\n\n# Dealing with overrides\n\nIn the prior\
    \ example, there was a demonstration of how to deal with an override to a key\
    \ selector. We nest the overriding selector inside the rule block of the key selector\
    \ and reference the parent with the & symbol. The & symbol, as in the Sass language,\
    \ is a parent selector. It might help you to think of it as being roughly equivalent\
    \ to `this` in JavaScript.\n\n![](img/599d07ddffb980e572103ffb27d26093_78_0.png)\n\
    \nTo test rules using the parent selector I recommend [http://sassmeister.com](http://sassmeister.com)\n\
    \n# Standard override\n\nConsider this example:\n\n```\n.ip-Carousel {\n    font-size:\
    \ $text13;\n    /* The override is here for when this key-selector sits within\
    \ a\\ \nip-HomeCallouts element */\n    .ip-HomeCallouts & {\n        font-size:\
    \ $text15;\n    }\n}\n```\n\nThis would yield the following CSS:"
  - "[PAGE 79]\n\n```\n.ip-Carousel {\n  font-size: 13px;\n}\n\n.ip-HomeCallouts .ip-Carousel\
    \ {\n  font-size: 15px;\n}\n```\n\nThis results in a font-size increase for the\
    \ `ip-Carousel` when it is inside an element with a class of `ip-HomeCallouts`.\n\
    \n# override with additional class on same element\n\nLet's consider another example,\
    \ what if we need to provide an override when this element gets an additional\
    \ class? We should do that like this:\n\n```\n.ip-Carousel {\n    background-color:\
    \ $color-green;\n    &.ip-ClassificationHeader {\n        background-color: $color-grey-a7;\n\
    \    }\n}\n```\n\nThat would yield this CSS:\n\n```\n.ip-Carousel {\n  background-color:\
    \ #14805e;\n}\n\n.ip-Carousel.ip-ClassificationHeader {\n  background-color: #a7a7a7;\n\
    }\n```\n\nAgain, the override is contained within the rule block for the key selector."
- md: "## Chapter 8. The Ten Commandments of Sane Style Sheets\n\n# override when\
    \ inside another class and also has an additional class\n\nFinally let's consider\
    \ how to do contain the eventuality where we need to provide an override where\
    \ the key selector is inside another element and also has an additional class\
    \ present:\n\n```\n.ip-Carousel {\n    background-color: $color-green;\n    .home-Container\
    \ &.ip-ClassificationHeader {\n        background-color: $color-grey-a7;\n   \
    \ }\n}\n```\n\nThat would yield the following CSS:\n\n```\n.ip-Carousel {\n  background-color:\
    \ #14805e;\n}\n\n.home-Container .ip-Carousel.ip-ClassificationHeader {\n  background-color:\
    \ #a7a7a7;\n}\n```\n\nWe have used the parent selector here to reference our key\
    \ selector between an override above (`.home-Container`) and alongside another\
    \ class (`.ip-ClassificationHeader`).\n\n# override with media queries\n\nFinally,\
    \ let's consider overrides with media queries. Consider this example:\n\n```\n\
    .key-Selector {\n    width: 100%;\n    @media (min-width: $M) {\n        width:\
    \ 50%;\n    }\n}\n```\n\nThat would yield this CSS:\n\n```\n.key-Selector {\n\
    \  width: 100%;\n}\n\n@media (min-width: 768px) {\n  .key-Selector {\n    width:\
    \ 50%;\n  }\n}\n```\n\nAgain, all eventualities contained within the same rule.\
    \ Note the use of a variable for the media query width. We will come on to that\
    \ shortly.\n\nAny and all media queries should be contained in the same manner.\
    \ Here's a more complex example:\n\n```\n.key-Selector {\n    width: 100%;\n \
    \   @media (min-width: $M) and (max-width: $XM) and (orientation: portrait) {\n\
    \        width: 50%;\n    }\n    @media (min-width: $L) {\n        width: 75%;\n\
    \    }\n}\n```\n\nThat would yield this CSS:\n\n```\n.key-Selector {\n  width:\
    \ 100%;\n}\n```\n\n```\n@media (min-width: 768px) and (max-width: 950px) and (orientation:\
    \ portrait) {\n  .key-Selector {\n    width: 50%;\n  }\n}\n```\n\n```\n@media\
    \ (min-width: 1200px) {\n  .key-Selector {\n    width: 75%;\n  }\n}\n```\n\nWith\
    \ all the nesting of overrides we have just looked at, you may think it makes\
    \ sense to nest child elements too? You are wrong. Very wrong. This would be a\
    \ very very bad thing to do. We'll look at why next.\n\n## 2. Thou shalt not nest\
    \ (unless thou art nesting media queries, overrides or thou really hast to)\n\n\
    The key selector in CSS is the rightmost selector in any rule. It is the selector\
    \ upon which the enclosed property/values are applied.\n\nWe want our CSS rules\
    \ to be as 'flat' as possible. We **DO NOT** want other selectors before a key\
    \ selector (or any DOM element) unless we absolutely need them to override the\
    \ default key selector styles. Adding additional selectors and using element types\
    \ (for example `h1.yes-This_Selector`):\n\n- creates additional unwanted specificity\n\
    - makes it harder to maintain as overrides need to be ever more specific\n- adds\
    \ unneeded bloat to the resultant CSS file\n- in the case of element types, ties\
    \ the rule to a specific element and/or structure\n\nFor example, suppose we have\
    \ a CSS rule like this:\n\n![](img/599d07ddffb980e572103ffb27d26093_83_0.png)\n\
    \n```\n#notme .or-me [data-thing=\"nope\"] .yes-This_Selector {\n    width: 100%;\n\
    }\n```\n\nIn that above example, `yes-This_Selector` is the key selector. If those\
    \ property/values should be added to the key selector in all eventualities, we\
    \ should make a simpler rule.\n\nTo simplify that prior example, if all we want\
    \ to target is the key-selector we would want a rule like this:\n\n```\n.yes-This_Selector\
    \ {\n    width: 100%;\n}\n```\n\n### Don't nest children within a rule\n\nSuppose\
    \ we have a situation where we have a video play button inside a wrapping element.\
    \ Consider this markup:\n\n```\n<div class=\"med-Video\">\n    <div class=\"med-Video_Play\"\
    >Play</div>\n</div>\n```\n\nLet's set some basic styling for the wrapper:\n\n\
    ```\n.med-Video {\n    position: absolute;\n    background-color: $color-black;\n\
    }\n```\n\nNow we want to position the play element within that wrapping element.\
    \ You might be tempted to do this:\n\n![](img/599d07ddffb980e572103ffb27d26093_84_0.png)\n\
    \n```\n.med-Video {\n    position: absolute;\n    background-color: $color-black;\n\
    \    /* Center the play button */\n    .med-Video_Play {\n        position: absolute;\n\
    \        top: 50%;\n        left: 50%;\n        transform: translate(-50%, -50%);\n\
    \    }\n}\n```\n\nThat would yield this CSS (vendor prefixes removed for brevity):\n\
    \n![](img/599d07ddffb980e572103ffb27d26093_85_0.png)\n\n```\n.med-Video {\n  position:\
    \ absolute;\n  background-color: #000;\n  /* Center the play button */\n}\n\n\
    .med-Video .med-Video_Play {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n\
    \  transform: translate(-50%, -50%);\n}\n```\n\nDo you see the problem here? We\
    \ have introduced additional specificity for our `.med-Video_Play` element when\
    \ it is completely unneeded.\n\nThis is a very subtle illustration. However, it\
    \ is important to be aware of, and avoid, doing this as we don't want rules like\
    \ this:\n\n![](img/599d07ddffb980e572103ffb27d26093_85_1.png)\n\n```\n.MarketGrid\
    \ > .PhoneOnlyContainer > .ClickToCallHeader > .ClickToCallHeaderMessage > .MessageHolder\
    \ > span {\n  font-weight: bold;\n  padding-right: 5px;\n}\n```\n\nInstead, remember\
    \ that **each key selector gets its own rule block**. Overrides are nested, child\
    \ elements are not. Here is that example rewritten correctly:\n\n```\n.med-Video\
    \ {\n    position: absolute;\n    background-color: $color-black;\n}\n```\n\n\
    ```\n/* Center the play button */\n.med-Video_Play {\n    position: absolute;\n\
    \    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n}\n```\n\
    \nThat would yield this CSS:\n\n```\n.med-Video {\n  position: absolute;\n  background-color:\
    \ #000;\n}\n```\n\n```\n/* Center the play button */\n.med-Video_Play {\n  position:\
    \ absolute;\n  top: 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n\
    }\n```\n\nEach key selector is only as specific as it needs to be and no more.\n\
    \n## 3. Thou shalt not use ID selectors (even if thou thinkest thou hast to)\n\
    \nThe limitations of IDs in a complex UI are well documented. In summary, they\
    \ are far more specific than a class selector - therefore making overrides more\
    \ difficult. Plus they can only be used once in the page anyway so their efficacy\
    \ is limited.\n\n> Remember we dealt with specificity back in Chapter 2.\n\nWith\
    \ ECSS we do not use ID selectors in the CSS. They present no advantages over\
    \ class based selectors and introduce unwanted problems.\nIn the almost unbelievable\
    \ situation where you HAVE to use an ID to select an element, use it within an\
    \ attribute selector instead to keep specificity lower:\n\n```\n[id=\"Thing\"\
    ] {\n    /* Property/Values Here */\n}\n```\n\n## 4. Thou shalt not write vendor\
    \ prefixes in the authoring style sheets\n\nThanks to PostCSS, we now have tooling\
    \ that means it is unnecessary to write vendor prefixes for any W3C specified\
    \ property/values in the authoring style sheets. The prefixes are handled auto-magically\
    \ by the Autoprefixer tool that can be configured to provide vendor prefixes for\
    \ the required level of platforms/browser support.\nFor example, don’t do this:\n\
    \n```\n.ip-Header_Count {\n    position: absolute;\n    right: $size-full;\n \
    \   top: 50%;\n    -webkit-transform: translateY(-50%);\n    -ms-transform: translateY(-50%);\n\
    \    transform: translateY(-50%);\n}\n```\n\nInstead you should just write this:\n\
    \n```\n.ip-Header_Count {\n    position: absolute;\n    right: $size-full;\n \
    \   top: 50%;\n    transform: translateY(-50%);\n}\n```\n\nNot only does this\
    \ make the authoring style sheets easier to read and work with, it also means\
    \ that when we want to change our level of support we can make a single change\
    \ to the build tool and the vendor prefixes that get added will update automatically.\n\
    \nThe only exception to this scenario is non-W3C property/values that might still\
    \ be desirable. For example, for touch inertia scrolling panels in WebKit devices,\
    \ it will still be necessary to add certain vendor prefixed properties in the\
    \ authoring styles as they are non-W3C. For example:\n\n```\n.ui-ScrollPanel {\n\
    \    -webkit-overflow-scrolling: touch;\n}\n```\n\nOr in the case of removing\
    \ the scrollbar for WebKit:"
  mdcn: "\n## 第八章：明智样式表的十条戒律\n\n# 在另一个类内部覆盖时，同时具有额外类\n\n最后，让我们考虑如何处理这种情况：我们需要提供一个覆盖，其中关键选择器位于另一个元素内部，同时还有另一个类存在：\n\
    \n```\n.ip-Carousel {\n    background-color: $color-green;\n    .home-Container\
    \ &.ip-ClassificationHeader {\n        background-color: $color-grey-a7;\n   \
    \ }\n}\n```\n\n这将生成以下 CSS：\n\n```\n.ip-Carousel {\n  background-color: #14805e;\n\
    }\n\n.home-Container .ip-Carousel.ip-ClassificationHeader {\n  background-color:\
    \ #a7a7a7;\n}\n```\n\n我们在这里使用了父选择器来引用我们的关键选择器，它位于一个覆盖选择器（`.home-Container`）之内，并与另一个类（`.ip-ClassificationHeader`）并列。\n\
    \n# 使用媒体查询进行覆盖\n\n最后，让我们考虑使用媒体查询进行覆盖。看看这个例子：\n\n```\n.key-Selector {\n    width:\
    \ 100%;\n    @media (min-width: $M) {\n        width: 50%;\n    }\n}\n```\n\n\
    这将生成以下 CSS：\n\n```\n.key-Selector {\n  width: 100%;\n}\n\n@media (min-width: 768px)\
    \ {\n  .key-Selector {\n    width: 50%;\n  }\n}\n```\n\n同样，所有可能性都包含在同一个规则中。注意媒体查询宽度使用了变量。我们很快会讲到这一点。\n\
    \n任何和所有的媒体查询都应该以同样的方式包含。这里有一个更复杂的例子：\n\n```\n.key-Selector {\n    width: 100%;\n\
    \    @media (min-width: $M) and (max-width: $XM) and (orientation: portrait) {\n\
    \        width: 50%;\n    }\n    @media (min-width: $L) {\n        width: 75%;\n\
    \    }\n}\n```\n\n这将生成以下 CSS：\n\n```\n.key-Selector {\n  width: 100%;\n}\n```\n\
    \n```\n@media (min-width: 768px) and (max-width: 950px) and (orientation: portrait)\
    \ {\n  .key-Selector {\n    width: 50%;\n  }\n}\n```\n\n```\n@media (min-width:\
    \ 1200px) {\n  .key-Selector {\n    width: 75%;\n  }\n}\n```\n\n鉴于我们刚刚看到的所有嵌套覆盖，你可能会认为嵌套子元素也是合理的？你错了。大错特错。这将是一件非常非常糟糕的事情。我们接下来将看看为什么。\n\
    \n## 2. 不要嵌套（除非你正在嵌套媒体查询、覆盖，或者你确实必须这样做）\n\nCSS 中的关键选择器是任何规则中最右边的选择器。它是应用所包含属性/值的选择器。\n\
    \n我们希望我们的 CSS 规则尽可能“扁平”。我们**不希望**在关键选择器（或任何 DOM 元素）之前有其他选择器，除非我们绝对需要它们来覆盖默认的关键选择器样式。添加额外的选择器并使用元素类型（例如\
    \ `h1.yes-This_Selector`）：\n\n-   会产生额外的、不必要的特异性\n-   使维护变得更困难，因为覆盖需要越来越高的特异性\n\
    -   给生成的 CSS 文件增加不必要的臃肿\n-   在元素类型的情况下，会将规则绑定到特定的元素和/或结构\n\n例如，假设我们有一个这样的 CSS\
    \ 规则：\n\n![](img/599d07ddffb980e572103ffb27d26093_83_0.png)\n\n```\n#notme .or-me\
    \ [data-thing=\"nope\"] .yes-This_Selector {\n    width: 100%;\n}\n```\n\n在上面的例子中，`yes-This_Selector`\
    \ 是关键选择器。如果那些属性/值在所有情况下都应该添加到关键选择器中，我们应该制定一个更简单的规则。\n\n为了简化前面的例子，如果我们只想定位关键选择器，我们需要一个这样的规则：\n\
    \n```\n.yes-This_Selector {\n    width: 100%;\n}\n```\n\n### 不要在规则内嵌套子元素\n\n假设我们遇到这样一种情况：在一个包装元素内部有一个视频播放按钮。考虑这个标记：\n\
    \n```\n<div class=\"med-Video\">\n    <div class=\"med-Video_Play\">Play</div>\n\
    </div>\n```\n\n让我们为包装器设置一些基本样式：\n\n```\n.med-Video {\n    position: absolute;\n\
    \    background-color: $color-black;\n}\n```\n\n现在我们想要将播放元素定位在那个包装元素内部。你可能会忍不住这样做：\n\
    \n![](img/599d07ddffb980e572103ffb27d26093_84_0.png)\n\n```\n.med-Video {\n  \
    \  position: absolute;\n    background-color: $color-black;\n    /* Center the\
    \ play button */\n    .med-Video_Play {\n        position: absolute;\n       \
    \ top: 50%;\n        left: 50%;\n        transform: translate(-50%, -50%);\n \
    \   }\n}\n```\n\n这将生成以下 CSS（为简洁起见，省略了浏览器厂商前缀）：\n\n![](img/599d07ddffb980e572103ffb27d26093_85_0.png)\n\
    \n```\n.med-Video {\n  position: absolute;\n  background-color: #000;\n  /* Center\
    \ the play button */\n}\n\n.med-Video .med-Video_Play {\n  position: absolute;\n\
    \  top: 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n}\n```\n\n你看到这里的问题了吗？我们为\
    \ `.med-Video_Play` 元素引入了额外的特异性，而这完全是不需要的。\n\n这是一个非常微妙的例子。然而，意识到并避免这样做很重要，因为我们不希望有这样的规则：\n\
    \n![](img/599d07ddffb980e572103ffb27d26093_85_1.png)\n\n```\n.MarketGrid > .PhoneOnlyContainer\
    \ > .ClickToCallHeader > .ClickToCallHeaderMessage > .MessageHolder > span {\n\
    \  font-weight: bold;\n  padding-right: 5px;\n}\n```\n\n相反，请记住**每个关键选择器都有自己的规则块**。覆盖是嵌套的，而子元素不是。以下是重写后的正确示例：\n\
    \n```\n.med-Video {\n    position: absolute;\n    background-color: $color-black;\n\
    }\n```\n\n```\n/* Center the play button */\n.med-Video_Play {\n    position:\
    \ absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\
    }\n```\n\n这将生成以下 CSS：\n\n```\n.med-Video {\n  position: absolute;\n  background-color:\
    \ #000;\n}\n```\n\n```\n/* Center the play button */\n.med-Video_Play {\n  position:\
    \ absolute;\n  top: 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n\
    }\n```\n\n每个关键选择器的特异性都恰好是它所需要的，不多也不少。\n\n## 3. 不要使用 ID 选择器（即使你认为你必须使用）\n\nID 在复杂\
    \ UI 中的局限性已有很多文献记载。总而言之，它们比类选择器特异性高得多——因此使得覆盖更加困难。另外，它们在页面中只能使用一次，所以其有效性有限。\n\n\
    > 记得我们在第二章讲过特异性。\n\n在 ECSS 中，我们不在 CSS 中使用 ID 选择器。它们相比基于类的选择器没有优势，反而会引入不必要的问题。\n\
    在那种几乎难以置信的情况下，你必须使用 ID 来选择一个元素，请在属性选择器中使用它，以保持较低的特异性：\n\n```\n[id=\"Thing\"] {\n\
    \    /* Property/Values Here */\n}\n```\n\n## 4. 不要在创作样式表中编写浏览器厂商前缀\n\n多亏了 PostCSS，我们现在有了工具，这意味着在创作样式表中为任何\
    \ W3C 指定的属性/值编写浏览器厂商前缀是不必要的。前缀由 Autoprefixer 工具自动处理，该工具可以配置为根据所需的平台/浏览器支持级别添加厂商前缀。\n\
    例如，不要这样做：\n\n```\n.ip-Header_Count {\n    position: absolute;\n    right: $size-full;\n\
    \    top: 50%;\n    -webkit-transform: translateY(-50%);\n    -ms-transform: translateY(-50%);\n\
    \    transform: translateY(-50%);\n}\n```\n\n相反，你应该只写这个：\n\n```\n.ip-Header_Count\
    \ {\n    position: absolute;\n    right: $size-full;\n    top: 50%;\n    transform:\
    \ translateY(-50%);\n}\n```\n\n这不仅使创作样式表更易于阅读和使用，还意味着当我们想要更改支持级别时，可以对构建工具进行一次更改，添加的厂商前缀就会自动更新。\n\
    \n这种情况的唯一例外是可能仍然需要的非 W3C 属性/值。例如，对于 WebKit 设备中的触摸惯性滚动面板，仍然有必要在创作样式表中添加某些带厂商前缀的属性，因为它们是非\
    \ W3C 的。例如：\n\n```\n.ui-ScrollPanel {\n    -webkit-overflow-scrolling: touch;\n\
    }\n```\n\n或者，在 WebKit 中移除滚动条的情况下：\n"
