  md: '# # Chapter 8. The Ten Commandments of Sane Style Sheets


    +   1. Thou shalt have a single source of truth for all key selectors

    2. Thou shalt not nest (unless thou art nesting media queries, overrides or thou
    really hast to)

    3. Thou shalt not use ID selectors (even if thou thinkest thou hast to)

    4. Thou shalt not write vendor prefixes in the authoring style sheets

    5. Thou shalt use variables for sizing, colours and z-index

    6. Thou shalt always write rules mobile first (avoid max-width)

    7. Use mixins sparingly (and avoid @extend)

    8. Thou shalt comment all magic numbers and browser hacks

    9. Thou shalt not inline images

    10. Thou shalt not write complicated CSS when simple CSS will work just as well


    Blessed are those that follow these rules for they shall inherit sane style sheets.


    Amen.


    # ## Why the ten commandments?


    The following, highly opinionated, set of rules came about as a way to author
    predictable style sheets across teams of developers. The rules all address a different
    need and for the most part can be enforced with tooling. When there are just one
    or CSS developers on a project, the tooling may seem superfluous. However, beyond
    a couple of active developers the tooling will earn it''s time investment time
    and again. We will deal with the tooling to ''police'' the rules in the next chapter.
    For now, let''s consider the syntax and the rules themselves.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# ## Tooling


    To achieve more maintainable style sheets we can lean upon PostCSS, a piece of
    CSS tooling that allows the manipulation of CSS with JavaScript. The curious can
    look here for more information: [https://github.com/postcss/postcss](https://github.com/postcss/postcss)


    PostCSS facilitates the use of an extended CSS syntax. For the purpose of authoring,
    the syntax used borrows heavily from [Sass](https://sass-lang.com). This provides
    functionality to make our authoring style sheets easier to maintain.


    Using PostCSS we are able to make use of:


    +   - variables

    - mixins (like macros for certain settings such as font-families)

    - referencing a **key-selector** with an ampersand symbol (&)

    - the ability to write loops for lengthy rule sets (100 variants of different
    coloured headers for example)


    Practically, PostCSS is similar in functionality to a CSS pre-processor such as
    Sass, LESS or Stylus.


    Where it differs is in its modularity and extensibility. Rather than ''swallow
    the whole pill'' as is needed with the aforementioned pre-processors, using PostCSS
    allows us to be more selective about the feature set we employ. It also allows
    us to easily extend our feature set at will, either with any number of ''off the
    peg'' plugins, or, by writing our own plugins with JavaScript.


    In addition it allows us to perform static analysis of the authoring styles via
    linting and can fail builds when undesirable code is authored.


    > > 💡 In case the term ''linting'' is alien to you, you should know it''s a static
    analysis tool. It looks at the generated code and makes suggestions based on any
    number of pre-defined rules. For example, it might issue a warning if you use
    floats, or don''t put whitespace where required. Generally speaking, you can use
    linters to enforce any kind of coding conventions you like and while more than
    useful when working alone, they can be a Godsend when working in teams: where
    many (careless) hands touch the code.'
  merge: -1
  pgno: 75
