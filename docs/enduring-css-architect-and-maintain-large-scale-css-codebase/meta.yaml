  md: 'There are a number of other approaches to solve the name collision problem.
    For example, if you are building an application with the popular [React](https://reactjs.org/)
    framework, consider [Radium](https://formidable.com/open-source/radium/) which
    will inline the styles for each node so you can effectively serve no CSS at all.
    Naturally, there are trade-offs such as a lack of caching and no way to add reset
    styles but it it certainly solves the issue at hand. In addition, when not building
    with React, consider [CSS Modules](https://github.com/css-modules/css-modules).
    While still requiring more involved tooling than ECSS it means you could forgo
    having to think about naming things altogether as it creates CSS scoped for you.
    Read [more about that here](https://github.com/css-modules/css-modules).


    ECSS takes the notion of selector namespacing and turns it [up to 11](https://en.wikipedia.org/wiki/Up_to_eleven).
    Selectors are effectively namespaced in two ways:


    +   - a micro namespace: usually used to designate context but can also indicate
    a parent module

    - the module''s own namespace: usually the name of the logic file that created
    the element in question


    Let''s look at these in more detail. The ''micro'' namespace is a simple 2–3 letter
    namespace for each module. Building a shopping cart? Try `.sc-` as your micro
    namespace. Building the next version of that same shopping cart? That''ll be `.sc2-`
    then. It''s just enough to isolate your component styles and allow the styles
    to be more self documenting. Let''s consider a more involved example.


    > When it comes to naming things, different things will make sense in different
    projects. While ECSS can happily adapt to different approaches, I would recommend
    a consistent approach on a each project.


    For example, suppose the micro namespace was being used to convey the parent or
    origin of the logic that created it. Back to our shopping cart example. We might
    have a file called ''ShoppingCart.php'' that contains all the logic relating to
    our imaginary shopping cart. We could therefore use'
