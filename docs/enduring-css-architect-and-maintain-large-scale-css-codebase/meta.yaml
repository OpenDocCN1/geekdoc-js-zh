    The linting of the style sheets is a very important step on a project where multiple
    style sheets authors are involved. Let''s look a little more at that next.


    # Stylelint


    Stylelint is a Node based linting tool for the static analysis of style sheets.
    In layman''s terms it will analysis your style sheets for the rules you specifically
    care about and warn you of any problems.


    > 🔍 If you use Sass you should check out [scss-lint](link) which provides similar
    functionality for Sass files.


    The linting job fails the build if any authoring errors are found. Typically it''s
    most beneficial to have linting running in two places. In the text editor (e.g.
    Sublime) and in the build tool (e.g. Gulp). This way, if an author has the'
  - "[PAGE 105]\n\nrequisite text editor then the [editor based linting](link) indicates\
    \ problems before an author even clicks 'save'.\n\nEven if a user doesn't have\
    \ in-editor linting available, the linting job runs via Gulp on save. The build\
    \ step prevents compiled code making its way to production (as continuous integration\
    \ software would also fail the build).\n\nThis is a massive time saver and has\
    \ proved invaluable when it comes to peer reviewing code and performing quality\
    \ assurance tests.\n\nHere is an example configuration object for Stylelint (this\
    \ is for v3 of Stylelint so future/previous versions may very slightly):\n\n```\n\
    // Config for linting\n{\n    \"rules\": {\n        \"block-no-empty\": true,\n\
    \        \"color-no-invalid-hex\": true,\n        \"declaration-colon-space-after\"\
    : \"always\",\n        \"declaration-colon-space-before\": \"never\",\n      \
