    \ 120\n\n## About the author\n\nBen Frain has been a web designer/developer since\
    \ 1996. He is currently employed as a Senior Front-end Developer at bet365.\n\n\
    Before the web, he worked as an underrated (and modest) TV actor and technology\
    \ journalist, having graduated from Salford University with a degree in Media\
    \ and Performance.\n\nHe has written four equally underrated (his opinion) screenplays\
    \ and still harbours the (fading) belief he might sell one. Outside of work, he\
    \ enjoys simple pleasures; playing indoor football while his body and wife still\
    \ allow it, and wrestling with his two sons.\n\nHis other books, [Responsive Web\
    \ Design with HTML5 and CSS3](http://example.com) and [Sass and Compass for Designers](http://example.com)\
    \ are available now. Visit Ben online at [www.benfrain.com](http://www.benfrain.com)\
    \ and follow him on Twitter at [twitter.com/benfrain](http://twitter.com/benfrain).\n\
    \n## Thanks\n\nI'd like to extend my thanks to a few people who directly or indirectly\
    \ helped in getting this book written.\n\nFirstly, [Matthew Mitchell](https://example.com),\
    \ who provided the cover artwork, typographic guidance and website design, and\
    \ endures (pun intended) my constant blathering about CSS on a daily basis.\n\n\
    I'd also like to thank my work colleagues at bet365, principally [Pete Griffiths](https://example.com)\
    \ who encouraged the development teams to make use of the ECSS approach on a grand\
    \ scale.\n\nFinally, I'd like to thank my long-suffering wife for allowing me\
    \ to 'tap away' in the kitchen for countless hours in order to get this stuff\
    \ out of my head.\n\n## Preface\n\nThis is a little book that encapsulates my\
    \ current thinking for how best to write and maintain CSS codebases for rapidly\
    \ changing, long-lived web projects.\n\n- There is no framework to download.\n\
    - There are no requisite tools (although there are opinionated guidelines for\
    \ what tooling should provide).\n- Nothing is written for you.\n\nPut metaphorically,\
    \ 'Enduring CSS' is not giving you fish; it's teaching you how to fish.\n\nIt's\
    \ a methodology for writing CSS that once implemented, will provide your project\
    \ with a predictable, and easy to maintain CSS codebase.\n\nThe earliest iterations\
    \ of Enduring CSS were first documented in the blog post, [Enduring CSS: writing\
    \ style sheets for rapidly changing, long-lived projects](https://benfrain.com/enduring-css-writing-style-sheets-rapidly-changing-long-lived-projects/).\n\
    \nHowever, the ECSS approach has developed a little since then and so this book\
    \ should be considered the canonical resource on the approach.\n\nI hope you enjoy\
    \ reading it.\n\n**Ben Frain** 26th October, 2015"
