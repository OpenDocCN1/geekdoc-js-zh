    \ and apply ECSS to them. This is the approach employed on the [http://ecss.io](http://ecss.io)\
    \ website.\n\nThere are no hard and fast rules. As an example, we might break\
    \ a design into visual areas for Structure, Menu, Footer, Navigation, Quick Jump\
    \ Menu, Hero Image etc.\n\nAnd in this case, our selectors look like this:\n\n\
    ```\n.st-Header {\n    /* Structural container for header */\n}\n\n.st-Footer\
    \ {\n    /* Structural container for footer */\n}\n```\n\nHowever, we might just\
    \ as easily do this:\n\n```\n.hd-Outer {\n    /* Structural container for header\
