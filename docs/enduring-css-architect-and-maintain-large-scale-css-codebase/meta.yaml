    If I take the time profile of `[class^="wrap"]` for example (taken on an old WebKit
    so that it is somewhat similar to Chrome), I see:


    +   - ~10% of the time is spent in the rasterizer.

    - ~21% of the time is spent on the first layout.

    - ~48% of the time is spent in the parser and DOM tree creation

    - ~8% is spent on style resolution

    - ~5% is spent on collecting the style -- this is what we should be testing and
    what should take most of the time. (The remaining time is spread over many many
    little functions).


    With the test above, let say we have a baseline of 100 ms with the fastest selector.
    Of that, 5 ms would be spent collecting style. If a second selector is 3 times
    slower, that would appear as 110ms in total. The test should report a 300% difference
    but instead it only shows 10%."


    At this point, I responded that whilst I understood what Benjamin was pointing
    out, my test was only supposed to illustrate that the same page, with all other
    things being equal, renders largely the same regardless of the selector used.
    Benjamin took the time to reply with further detail:'
- md: " > I completely agree it is useless to optimize selectors upfront, but for\
    \ completely different reasons:\n\nIt is practically impossible to predict the\
    \ final performance impact of a given selector by just examining the selectors.\
    \ In the engine, selectors are reordered, split, collected and compiled. To know\
    \ the final performance of a given selectors, you would have to know in which\
    \ bucket the selector was collected, how it is compiled, and finally what does\
    \ the DOM tree looks like. All of that is very different between the various engines,\
    \ making the whole process even less predictable.\n\nThe second argument I have\
    \ against web developers optimizing selectors is that they will likely make things\
    \ worse. The amount of misinformation about selectors is larger than correct cross-browser\
    \ information. The chance of someone doing the right thing is pretty low.\n\n\
    In practice, people discover performance problems with CSS and start removing\
    \ rules one by one until the problem go away. I think that is the right way to\
    \ go about this, it is easy and will lead to correct outcome.\n\n## Cause and\
    \ effect\n\nAt this point I felt vindicated that the CSS selector used was almost\
    \ entirely irrelevant. However, I did wonder what else we could gleam from the\
    \ tests.\n\nIf the number of DOM elements on the page was halved, as you might\
    \ expect, the speed to complete any of the tests dropped commensurately. But getting\
    \ rid of large parts of the DOM isn't always a possibility in the real world.\
    \ This made me wonder what difference the amount of unused styles in the CSS would\
    \ have on the results.\n\n## What difference does style bloat make?\n\nAnother\
    \ test: I grabbed a big fat style sheet that had absolutely no relevance to the\
    \ DOM tree. It was about 3000 lines of CSS. All these irrelevant styles were inserted\
    \ before a final rule that would select our inner `a.link` node and make it red.\
    \ I did the same averaging of the results across 5 runs on each browser.\n\nHalf\
    \ those rules were then cut out and the test repeated to give a comparison. Here\
    \ are the results:\n\n| Test | Chrome 34 | Firefox 29 | Opera 19 | IE9 | Android\
    \ 4 |\n|------|-----------|------------|----------|-----|-----------|\n| Full\
    \ bloat | 64.4 | 237.6 | 74.2 | 436.8 | 1714.6 |\n| Half bloat | 51.6 | 142.8\
    \ | 65.4 | 358.6 | 1412.4 |\n\n## Rules diet\n\nThis provides some interesting\
    \ figures. For example, Firefox was 1.7X slower to complete this test than it\
    \ was with its slowest selector test (test 6). Android 4.3 was 1.2X slower than\
    \ its slowest selector test (test 6). Internet Explorer was a whopping 2.5X slower\
    \ than it's slowest selector!\n\nYou can see that things dropped down considerably\
    \ for Firefox when half of the styles were removed (approx 1500 lines). The Android\
    \ device came down to around the speed of its slowest selector at that point too.\n\
    \n## Removing unused styles\n\nDoes this kind of horror scenario sound familiar\
    \ to you? Enormous CSS files with all manner of selectors (often with selectors\
    \ in that don't even work), heaps of ever more specific selectors seven or more\
    \ levels deep, non-applicable vendor-prefix's, ID selectors all over the place\
    \ and file sizes of 50–80KB (sometimes more).\n\nIf you are working on a code\
    \ base that has a big fat CSS file like this, one that no-one is quite sure what\
    \ all the styles are actually for, my advice would be to look there for your CSS\
    \ optimisations before the selectors being employed. Hopefully by this point you\
    \ will be convinced that an ECSS approach might help in this respect.\n\nThen\
    \ again, that won't necessarily help with the actual performance of your CSS.\n\
    \n## Performance inside the brackets\n\nThe [final test](final test) I ran was\
    \ to hit the page with a bunch of 'expensive' properties and values. Consider\
    \ this rule:\n\n```css\n.link {\n    background-color: red;\n    border-radius:\
    \ 5px;\n    padding: 3px;\n    box-shadow: 0 5px 5px #000;\n    -webkit-transform:\
    \ rotate(10deg);\n    -moz-transform: rotate(10deg);\n    -ms-transform: rotate(10deg);\n\
    \    transform: rotate(10deg);\n    display: block;\n}\n```\n\nWith that rule\
    \ applied, here are the results:\n\n| Test | Chrome 34 | Firefox 29 | Opera 19\
    \ | IE9 | Android 4 |\n|------|-----------|------------|----------|-----|-----------|\n\
    | Expensive Styles | 65.2 | 151.4 | 65.2 | 259.2 | 1923 |\n\nHere all browsers\
    \ are at least up with their slowest selector speed (IE was 1.5X slower than its\
    \ slowest selector test (10) and the Android device was 1.3X slower than the slowest\
    \ selector test (test 6)) but that's not even the full picture. Try and scroll\
    \ that page! Repaint on those kind of styles can bring a browser to its knees\
    \ (or whatever the equivalent of knees is for a browser).\n\nThe properties we\
    \ stick inside the braces are what really affects performance. It stands to reason\
    \ that scrolling a page that requires endless expensive re-paints and layout changes\
    \ is going to put a strain on the device. Nice HiDPI screen? It will be even worse\
    \ as the CPU/GPU strains to get everything re-painted to screen in under 16ms.\n\
    \nWith the expensive styles test, on the 15\" Retina MacBook Pro I tested on,\
    \ the paint time shown in continuous paint mode in Chrome never dropped below\
    \ 280ms (and remember, we are aiming for sub–16ms). To put that in perspective\
    \ for you, the first selector test page, never went above 2.5ms. That wasn't a\
    \ typo. Those properties created a 112X increase in paint time. Holy expensive\
    \ properties Batman! Indeed Robin. Indeed.\n\n## What properties are expensive?\n\
    \nAn 'expensive' property/value pairing is one we can be pretty confident will\
    \ make the browser struggle with when it has to repaint the screen (e.g. on scroll).\n\
    \nHow can we know what will be an 'expensive' style? Thankfully, we can apply\
    \ common sense to this and get a pretty good idea what is going to tax the browser.\
    \ Anything that requires a browser to manipulate/calculate before painting to\
    \ the page will be more costly. For example, box-shadows, border-radius, transparency\
    \ (as the browser has to calculate what is shown below), transforms and performance\
    \ killers like CSS filters - if performance is your priority, anything like that\
    \ is your worst enemy.\n\nJuriy 'kangax' Zaytsev did [a fantastic blog post also\
    \ covering CSS performance](link) back in 2012. He was using the various developer\
    \ tools to measure performance. He did a particularly good job of showing the\
    \ difference that various properties had on performance. If this kind of thing\
    \ interests you then that post is well worth your time.\n\n## Summary\n\nSome\
    \ takeaways from these tests:\n\n- sweating over the selectors used in modern\
    \ browsers is futile; most selection methods are now so fast it's really not worth\
    \ spending much time over. Furthermore, there is disparity across browsers of\
    \ what the slowest selectors are anyway. Look here last to speed up your CSS.\n\
    - excessive unused styles are likely to cost more, performance wise, than any\
    \ selectors you chose so look to tidy up there second. 3000 lines that are unused\
    \ or surplus on a page are not even that uncommon. While it's common to bunch\
    \ all the styles up into a great big single `styles.css`, if different areas of\
    \ your site/web application can have different (additional) style sheets added\
    \ (dependency graph style), that may be the better option.\n- if your CSS has\
    \ been added to by a number of different authors over time, look to tools like\
    \ [UnCSS](https://github.com/uncss/uncss) to automate the removal of styles; doing\
    \ that process by hand is no fun!\n- the battle for high performing CSS will not\
    \ be won in the selectors used, it will be won with the judicious use of property\
    \ and values.\n- getting something painted to screen fast is obviously important\
    \ but so is how a page feels when the user interacts with it. Look for expensive\
    \ property and value pairs first (Chrome continuous repaint mode is your friend\
    \ here), they are likely to provide the biggest gains.\n\n# Appendix 2: Browser\
    \ representatives on CSS performance\n\nAs a companion to Appendix 1, the following\
    \ text deals with what browser representatives have to say about CSS performance.\n\
    \n## TL;DR\n\nIf you read nothing more of this section, read this next paragraph\
    \ and take it to heart:\n\nDo not memorize rules in relation to CSS performance\
    \ without checking your own 'data'. They are largely useless, transient and too\
    \ subjective. Instead become acquainted with tools and use them to reveal relevant\
    \ data for your own scenario. This is basically the mantra the Chrome Developer\
    \ relations folks have been promoting for years, I believe it was Paul Lewis (more\
    \ of which below) that coined the term, 'Tools, not rules' in relation to troubleshooting\
    \ web performance.\n\nNowadays I get that sentiment. Really get it.\n\n## Browser\
    \ representatives on CSS performance\n\nWhile I generally never worry CSS selectors\
    \ when authoring a style sheet (typically I just put a class on anything I want\
    \ to style and select it directly) every so often I see comments from people way\
    \ smarter than me that relate specifically to a certain selector. Here's a quote\
    \ from [Paul Irish](https://www.paulirish.com/) in relation to a [post on A List\
    \ Apart from Heydon Pickering](https://alistapart.com/article/) which used a specific\
    \ type of selector:"
  mdcn: "\n> 我完全同意预先优化选择器是毫无意义的，但理由却截然不同：\n\n仅仅通过检查选择器，实际上不可能预测其最终性能影响。在引擎内部，选择器会被重新排序、拆分、收集并编译。要知道某个选择器的最终性能，你必须知道它被收集到哪个桶中、如何编译，以及最终DOM树的形态。所有这些在不同的引擎之间差异巨大，使得整个过程更加难以预测。\n\
    \n我反对Web开发者优化选择器的第二个论点是，他们很可能会让事情变得更糟。关于选择器的错误信息远多于正确的跨浏览器信息。一个人做出正确选择的可能性相当低。\n\
    \n实际上，人们发现CSS性能问题后，会开始逐一移除规则，直到问题消失。我认为这是正确的解决方法，它很简单，并且会带来正确的结果。\n\n## 因与果\n\n\
    此时，我确信CSS选择器的使用几乎是完全无关紧要的。不过，我确实想知道我们还能从这些测试中得出什么结论。\n\n如果页面上的DOM元素数量减半，正如你可能预料的那样，完成任何测试的速度会相应下降。但在现实世界中，移除大部分DOM并不总是可行的。这让我想知道CSS中未使用样式量的多少会对结果产生什么影响。\n\
    \n## 样式臃肿有何影响？\n\n另一项测试：我抓取了一个庞大的样式表，它与DOM树完全无关。大约有3000行CSS。所有这些无关的样式都插入在最后一条规则之前，该规则会选择我们的内部`a.link`节点并使其变红。我对每个浏览器运行5次的结果进行了同样的平均值计算。\n\
    \n然后，移除其中一半的规则并重复测试以进行比较。结果如下：\n\n| 测试 | Chrome 34 | Firefox 29 | Opera 19 | IE9\
    \ | Android 4 |\n|------|-----------|------------|----------|-----|-----------|\n\
    | 完全臃肿 | 64.4 | 237.6 | 74.2 | 436.8 | 1714.6 |\n| 一半臃肿 | 51.6 | 142.8 | 65.4\
    \ | 358.6 | 1412.4 |\n\n## 规则节食\n\n这提供了一些有趣的数据。例如，Firefox完成此测试比其最慢的选择器测试（测试6）慢1.7倍。Android\
    \ 4.3比其最慢的选择器测试（测试6）慢1.2倍。Internet Explorer比其最慢的选择器慢了足足2.5倍！\n\n你可以看到，当移除一半样式（约1500行）时，Firefox的性能显著下降。Android设备的速度也下降到了接近其最慢选择器测试时的水平。\n\
    \n## 移除未使用的样式\n\n这种恐怖场景听起来熟悉吗？巨大的CSS文件，包含各种各样的选择器（有时甚至包含无效的选择器），堆积如山、层级深达七层或更深的越来越具体的选择器，不适用的浏览器前缀，随处可见的ID选择器，文件大小达到50-80KB（有时更大）。\n\
    \n如果你正在处理一个像这样拥有庞大CSS文件的代码库，而且没有人确切知道所有样式到底用于何处，我的建议是，在考虑所使用的选择器之前，先从这里寻找CSS优化的可能。希望到此时，你会相信ECSS方法在这方面可能有所帮助。\n\
    \n不过，那也未必能解决CSS实际性能的问题。\n\n## 花括号内的性能\n\n我进行的[最终测试](final test)是向页面应用一堆“昂贵”的属性和值。考虑这条规则：\n\
    \n```css\n.link {\n    background-color: red;\n    border-radius: 5px;\n    padding:\
    \ 3px;\n    box-shadow: 0 5px 5px #000;\n    -webkit-transform: rotate(10deg);\n\
    \    -moz-transform: rotate(10deg);\n    -ms-transform: rotate(10deg);\n    transform:\
    \ rotate(10deg);\n    display: block;\n}\n```\n\n应用该规则后，结果如下：\n\n| 测试 | Chrome\
    \ 34 | Firefox 29 | Opera 19 | IE9 | Android 4 |\n|------|-----------|------------|----------|-----|-----------|\n\
    | 昂贵样式 | 65.2 | 151.4 | 65.2 | 259.2 | 1923 |\n\n这里所有浏览器都达到了它们最慢的选择器速度（IE比其最慢的选择器测试（测试10）慢1.5倍，Android设备比最慢的选择器测试（测试6）慢1.3倍），但这甚至不是全貌。试着滚动那个页面！使用这类样式进行重绘可能会让浏览器不堪重负（或者无论对浏览器来说相当于“膝盖”的是什么）。\n\
    \n我们放在花括号里的属性才是真正影响性能的因素。道理很简单，滚动一个需要无休止进行昂贵重绘和布局更改的页面会给设备带来压力。漂亮的HiDPI屏幕？当CPU/GPU费力地将所有内容在16毫秒内重绘到屏幕上时，情况会更糟。\n\
    \n在昂贵样式测试中，在我测试的15英寸Retina MacBook Pro上，Chrome中连续重绘模式下显示的绘制时间从未低于280毫秒（记住，我们的目标是低于16毫秒）。为了让你有个概念，第一个选择器测试页面从未超过2.5毫秒。这没有打错字。这些属性导致绘制时间增加了112倍。天呐，昂贵的属性！确实是，罗宾。确实是。\n\
    \n## 哪些属性是昂贵的？\n\n一个“昂贵”的属性/值配对是我们相当确信会让浏览器在必须重绘屏幕时（例如滚动时）举步维艰的配对。\n\n我们怎么知道哪些样式会是“昂贵的”呢？值得庆幸的是，我们可以运用常识来大致了解什么会给浏览器带来负担。任何需要浏览器在绘制到页面之前进行操作/计算的内容都会更耗资源。例如，`box-shadow`、`border-radius`、透明度（因为浏览器必须计算下方显示的内容）、`transform`以及像CSS滤镜这样的性能杀手——如果性能是你的首要考虑，那么任何类似的东西都是你最大的敌人。\n\
    \nJuriy 'kangax' Zaytsev在2012年写了一篇[同样涵盖CSS性能的精彩博文](link)。他使用各种开发工具来测量性能。他特别出色地展示了各种属性对性能的不同影响。如果你对这类事情感兴趣，那篇文章非常值得一读。\n\
    \n## 总结\n\n从这些测试中得到的一些要点：\n\n- 在现代浏览器中，为选择器的使用而绞尽脑汁是徒劳的；大多数选择方法现在都如此之快，确实不值得花太多时间在此之上。此外，对于哪些是最慢的选择器，不同浏览器之间本身就存在差异。最后再考虑这里来加速你的CSS。\n\
    - 过多的未使用样式在性能方面可能比你选择的任何选择器代价更高，所以其次应该考虑清理这里。页面上有3000行未使用或多余的样式甚至并不罕见。虽然将所有样式打包到一个巨大的`styles.css`文件中很常见，但如果你的网站/网站应用程序的不同区域可以添加不同的（附加的）样式表（依赖图样式），那可能是更好的选择。\n\
    - 如果你的CSS是由许多不同的作者随着时间的推移添加的，请考虑使用像[UnCSS](https://github.com/uncss/uncss)这样的工具来自动移除样式；手动执行此过程可不好玩！\n\
    - 高性能CSS的战斗不会在所使用的选择器上取胜，而会通过对属性和值的明智运用来取胜。\n- 将内容快速绘制到屏幕上显然很重要，但页面在用户交互时的体验也同样重要。首先寻找昂贵的属性和值配对（Chrome的连续重绘模式在这里是你的好帮手），它们很可能提供最大的收益。\n\
    \n# 附录2：浏览器代表谈CSS性能\n\n作为附录1的配套，以下文本涉及浏览器代表关于CSS性能的言论。\n\n## 太长不看\n\n如果你只打算阅读本节的一部分，请阅读下面这段话并铭记于心：\n\
    \n不要在不检查你自己的“数据”的情况下记住关于CSS性能的规则。它们大多是无用的、短暂的且过于主观的。相反，应该熟悉工具，并使用它们来揭示与你自己情况相关的数据。这基本上是Chrome开发关系团队多年来一直倡导的理念，我相信是Paul\
    \ Lewis（下文会更多提到）在有关排查Web性能问题时创造了“工具，不是规则”这个术语。\n\n如今我理解了这种情感。真的理解了。\n\n## 浏览器代表谈CSS性能\n\
    \n虽然我在编写样式表时通常从不担心CSS选择器（通常我只是在我想要设置样式的任何元素上放一个类并直接选择它），但偶尔我会看到比我聪明得多的人发表的、专门针对某个选择器的评论。这是[Paul\
    \ Irish](https://www.paulirish.com/)关于[Heydon Pickering在A List Apart上使用特定类型选择器的帖子](https://alistapart.com/article/)的引述：\n"
