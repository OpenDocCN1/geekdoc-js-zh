    ```\n\nAnd use these selectors to apply styles to the contents of that b tag:\n\
    \n```\n.ch-ShoppingCart_TextIntro {\n    /* Styles for the text */\n    b {\n\
    \        /* Styles for the bold section within */\n    }\n}\n```\n\nThere are\
    \ a couple of problems here:\n\n+   1. We have created a dependency on certain\
