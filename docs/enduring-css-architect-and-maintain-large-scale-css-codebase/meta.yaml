  md: 'now.


    # Specificity


    The first major problem of CSS at scale is we want to by-pass the problem of specificity.
    Ordinarily, specificity is a useful thing. It allows us to introduce some form
    of logic in the CSS. Styles that are more specific than others get applied in
    the browser. Our example above demonstrates this: different rules will be applied
    in different eventualities (for example, when in the sidebar, we want to override
    the default styles).


    Now, CSS selectors can be made up of ID, class, attribute & type selectors and
    any combination of those. With responsive designs you can throw in media queries
    into the mix too.


    However, not all selectors are created equal. The W3C describes how specificity
    is calculated here: [http://www.w3.org/TR/css3-selectors/#specificity](http://www.w3.org/TR/css3-selectors/#specificity).
    Here is the most relevant section:


    > A selector''s specificity is calculated as follows: count the number of ID selectors
    in the selector (= a) count the number of class selectors, attributes selectors,
    and pseudo-classes in the selector (= b) count the number of type selectors and
    pseudo-elements in the selector (= c) ignore the universal selector Selectors
    inside the negation pseudo-class are counted like any other, but the negation
    itself does not count as a pseudo-class. Concatenating the three numbers a-b-c
    (in a number system with a large base) gives the specificity.


    One important thing missing there is the style attribute. Information on that
    [elsewhere](elsewhere) tells us that:


    > The declarations in a style attribute apply to the element to which the attribute
    belongs. In the cascade, these declarations are considered to have author origin
    and a specificity higher than any selector.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "So, a style applied in a style attribute on an element is going to be more\
    \ specific than an equivalent rule in a CSS file.\n\nRegardless, the biggest takeaway\
    \ here is that ID selectors are infinitely more specific than class based selectors.\
    \ This makes overriding any selector containing an ID based selector far more\
    \ difficult. For example, with a widget in the sidebar this won't work:\n\n```\n\
    .widget {\n    /* Widget in the sidebar */\n}\n\naside#sidebar .widget {\n   \
    \ /* Widget in an aside element with the ID of sidebar */\n}\n\n.class-on-sidebar\
    \ .widget {\n    /* Why doesn't this work */\n}\n```\n\nIn this instance we would\
    \ be applying a HTML class (`class-on-sidebar`) on the sidebar element (the aside\
    \ element with the ID of sidebar) and then selecting that in the CSS lower down\
    \ than the ID based selector. However, the rule still won't be applied.\n\nKnowing\
    \ what we know about specificity from the W3C specifications we can calculate\
    \ the specificity of these rules.\n\nLet's run the numbers. Left to right, the\
    \ numbers after the selectors below relate to: number of inline styles, number\
    \ of ID selectors, number of class selectors, and finally the number of type selectors\n\
    \n| selector | inline | ID | class | type |\n| --- | --- | --- | --- | --- |\n\
    | .widget | 0 | 0 | 1 | 0 |\n| aside#sidebar .widget | 0 | 1 | 1 | 1 |\n| .class-on-sidebar\
    \ .widget | 0 | 0 | 2 | 0 |"
  merge: -1
  pgno: 15
- img_proc: true
  md: "So you can see here that the middle selector has a greater specificity than\
    \ the last. Bummer.\n\nOn a single or smaller file, this isn't that much of a\
    \ big deal. We just create a more specific rule. However, if the CSS of your codebase\
    \ is split across many smaller partial CSS files, finding a rule that is preventing\
    \ your override from working can become an unwanted burden. Now, the problem isn't\
    \ specific to ID selectors. It's more of a problem with unequally weighted selectors\
    \ in the style sheets. Think of it like a heavyweight boxer pitted against a flyweight.\
    \ It's not a fair contest. Creating a level playing field across the selectors\
    \ used is more important than the actual selectors used.\n\nThis mis-matched soup\
    \ of selectors is the crux of the specificity issue. As soon as you have a CSS\
    \ codebase with hundreds of rules, any unneeded specificity starts to become a\
    \ major 'pain in the ass' (that's a technical term).\n\nSo, to conclude, specificity\
    \ is a problem we need to address in an ever-growing CSS codebase.\n\n# Markup\
    \ structure tied to selectors\n\nAnother typical faux pas when authoring large\
    \ scale CSS is using type selectors; selectors that relate to specific markup.\
    \ For example:\n\n```\naside#sidebar ul > li a {\n    /* Styles */\n}\n```\n\n\
    In this case we need to have an 'a' tag inside an 'li' which is a direct child\
    \ of a 'ul' inside an 'aside' element with an ID of 'sidebar' - phew!\n\nWhat\
    \ happens if we want to apply those styles to a div somewhere else? Or any other\
    \ markup structure?\n\nWe've just unnecessarily tied our rule to specific markup\
    \ structure. It's often quite tempting to do this, as it can seem ridiculous to\
    \ add a class to something as (seemingly) trivial as an 'a' or 'span' tag. However,\
    \ I hope once you reach the end of ECSS you'll be convinced to avoid the practice."
  merge: -1
  pgno: 16
