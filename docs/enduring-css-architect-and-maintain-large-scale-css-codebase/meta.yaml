  md: '# # Chapter 1. Enduring CSS


    Writing styles for rapidly changing, long-lived web projects


    # ## Introduction


    This isn''t actually a book about writing CSS, as in the stuff inside the curly
    braces. It''s a book about the organising and architecture of CSS; the parts outside
    the braces. It''s the considerations that can be happily ignored on smaller projects
    but actually become the most difficult part of writing CSS in larger projects.


    Terms like ''CSS at scale'', or ''Large-scale CSS'' can seem quite nebulous. I''ll
    try and clarify.'
