    • Frequent design changes and on-going maintenance


    Let’s see if I can demonstrate why I feel these two issues are worth consid-ering.


    # Responsive issues


    I consider [Atomic CSS](https://en.wikipedia.org/wiki/Atomic_CSS) (not to be confused
    with [Atomic Design](https://atomicdesign.bradfrost.com/)) to represent OOCSS
    taken the the nth-degree. Let’s consider an imaginary Atomic CSS example:


    ```

    <div class="blk m-10 fr">Here I am</div>

    ```


    In this OOCSS/Atomic CSS example, the visual needs of the element have been split
    up/abstracted into re-usable classes. One sets a block formatting context (`.blk`),
    another sets some margin (`.m-10`) and finally one provides a floating mechanism
    for the element (`.fr`). Un-opinionated and terse for sure.


    > In principle, Atomic CSS is very similar to the first architectural approach
    I devised.


    It was called ‘PST!’ which was an acronym for Position Structure Theme. The idea
    was this: there would be no semantic HTML classes/CSS selectors. Instead, every
    element on the page could be described by it’s position, structure and theme.
    Each new selector would just take the next available number. For example, `s1`,
    `s2`, `s3` and on and on. It wasn’t quite a class for each responsibility as is
    the case with Atomic CSS but it was a way of heavily abstracting stylistic needs.


    Markup looked like this:


    `<div class="p1 s3 t4">Content</div>`


    Like Atomic CSS it was terse, and there was no pondering on what to call something
    as you authored but in practice it was hugely problematic. Reasoning about the
    created DOM was tricky as it was near impossible to'
  - '[PAGE 21]


    discern one section of DOM from another.


    However, what happens when the viewport changes and we don''t want 10px margin
    or the item floating?

    We could of course make some classes to do things at certain breakpoints. For
    example, `Mplus-cc2` might change a colour at an Mplus breakpoint. But I find
    this practice to be slow and laborious. Making very specific changes at certain
    breakpoints and tying them to a class that has to be added to the HTML seems needlessly
    complex. Furthermore, you inevitably end up with a raft of SRP classes in your
    style sheets that are obsolete. What''s the authoring mechanism for removing any
    cruft from the authoring styles sheets when no longer needed?


    # Maintenance and iteration


    Let''s continuing with our prior example. Suppose at some point in the future,
    we change our product to a more progressive layout mechanism; we move from float
    based layouts to Flexbox based layouts. At this point, we will now have twice
    the maintenance burden. We will need to not only change classes in the markup/templates
    but also alter the CSS rules themselves (or write entirely new ones). Furthermore,
    using `float` is redundant with Flexbox so either we leave `.fr` alone (and so
    it continues to exist, needlessly in our CSS) or we make `.fr` responsible for
    something else such as `justify-content: flex-end`. But then what happens if we
    change the flex-direction of our parent at a particular viewport? Arrgggghhhh!

    Hopefully you can see the inherent shortcomings of an OOCSS approach for maintenance
    when your designs change frequently or you need to render an entirely different
    layout at a different viewport?


    Atomic CSS has developed considerably since Thierry''s article in Smashing Magazine
    back in 2013. Depending upon your goals, it may be just the thing you need, I''d
    encourage you to check the project out at http://acss.io.'
