    \ specific markup structure. It's often quite tempting to do this, as it can seem\
    \ ridiculous to add a class to something as (seemingly) trivial as an 'a' or 'span'\
    \ tag. However, I hope once you reach the end of ECSS you'll be convinced to avoid\
    \ the practice."
