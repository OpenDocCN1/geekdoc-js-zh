    \    background-image: inline(\"/path/to-image/relevant-image-name.png\");\n}\n\
    ```\n\n## 10. 不要编写复杂的 CSS，如果简单的 CSS 同样有效\n\n尽量编写尽可能简单的 CSS 代码，以便他人在未来能够理解。循环、混入和函数的使用应最小化或极少使用。作为一般规则，如果一个规则的变体少于\
    \ 10 个，请“手动”编写。另一方面，如果你需要为包含 30 张图片的精灵表创建背景位置，这应该是使用工具来完成的事情。\n\n不鼓励创建和使用混入。过度使用混入可能创建与结果过于抽象分离的代码。虽然混入应该用于字体栈或自动生成容易出错的字符串，但除此之外证明其价值的情况很少。\n\
    \n对简单的追求应延伸到实现布局的方式。如果一个支持更好的布局机制在相同数量的 DOM 节点下实现与支持较差的相同目标，请使用前者。但是，如果一个不同的布局机制减少了所需的\
    \ DOM 节点数量或提供了额外的好处，只是不熟悉（我想到的是你，Flexbox），请花时间理解它可能提供的好处。\n\n## 总结\n\n没有强制执行的规则毫无意义。当许多双手在接触\
    \ CSS 代码库时，再多的教育或坚持也无法拯救你的 CSS 内容免受滥用。除了“胡萝卜”，恐怕给一点“大棒”也是必要的。在这种情况下，“大棒”可以采取工具的形式，当代码违反你实施的规则时，让构建失败。在下一章，我们将看看如何做到这一点。“趣味警察”来了！\n\
    \n# 第八章 健康样式表的十条戒律\n\n# 第九章 ECSS 方法的工具\n\n在最后一章，我们将看看一些免费和开源的可用工具，以促进编写健康和可维护的样式表。\n\
    \n在为持久项目编写 CSS 时，用于生成 CSS 的技术在很大程度上无关紧要。我们应该始终意识到，更好的或更高效的工具可能变得可用以实现我们的目标，并且在可能且可取的情况下，应该接受它。\n\
    \n因此，无论是 Sass、PostCSS、LESS、Stylus、Myth 还是任何其他 CSS 处理器用于编写样式表，都不应该重要。编写的样式表应尽可能容易地迁移到另一种元语言，如果并且需要的话。\n\
    \n此外，所采用的 CSS 处理器应最好服务于整个项目的需求，而不仅仅是任何单个作者的偏好。话虽如此，CSS 处理器有一些必要的能力，所以我们接下来将简要介绍。\n\
    \n## CSS 处理器的 CSS 要求\n\n我认为用于样式表编写的 CSS 处理器是必不可少的。这允许区分“编写”样式表（作者在其选择的 CSS 处理器中编写的样式表）和“结果”CSS（编译和压缩后提供给用户的\
    \ CSS）。\n\n尽管指出 CSS 处理器是必不可少的，但所需的功能相当简单：\n\n-   变量：以减轻颜色选择和指定常量（如网格度量）时的人为错误\n\
    -   局部文件：以促进编写样式表与功能分支、模板或逻辑文件之间的一一对应关系\n-   颜色操作：以允许对前述变量进行一致的操作，例如能够调整或轻松调整颜色的\
    \ alpha 值\n\n所有其他能力被认为是非必需的，应根据项目的具体需求进行评估。\n\n## 从编写样式表构建 CSS\n\n需要某种构建系统将编写样式表（包含其变量、混入等）编译为纯\
    \ CSS。有许多工具可用于执行此任务，例如 Grunt、Gulp 和 Broccoli 等。正如没有普遍“正确”的 CSS 处理器一样，也没有普遍“正确”的构建工具。\n\
    \n除了仅仅将编写样式表编译为 CSS 之外，好的工具还能提供进一步的好处。\n\n-   Linting：以启用代码一致性并防止非工作代码到达部署\n-\
    \   激进的压缩：重新设置 z-index 基础值，将长度值转换为更小的长度值（例如，虽然 '1pt' 等同于 '16px'，但它少了一个字符），合并相似的选择器\n\
    -   Autoprefixer：以启用快速且准确的供应商前缀，并防止供应商前缀出现在编写样式表中\n\n> 关于样式表编写中什么是语法上必要的考虑，请参阅第八章“健康样式表的十条戒律”。\n\
    \n## 保存并编译，ECSS 样式表的旅程\n\n在工具方面，在撰写本文时，我目前在 Gulp 和 PostCSS 及其众多插件的帮助下编写 ECSS。\n\
    \n对于非常好奇的人，可以在[这里](http://journey-from-sass-to-postcss.com)找到更多关于我[从 Sass 到 PostCSS\
    \ 之旅](http://journey-from-sass-to-postcss.com)的内容。\n\n样式表作者将内容写入一个部分 CSS 文件（使用\
    \ *.css 文件扩展名），使用非常类似于 Sass 的语法。\n\n在保存编写样式表时，Gulp watch 任务会注意到文件更改，并首先启动编写样式表的\
    \ linting 任务。然后，如果一切正常，它会将部分编写样式表编译为 CSS，自动添加前缀，然后 BrowserSync 将更改的 CSS 直接注入我正在处理的网页。通常，我们还会创建一个源映射文件，因为一些作者发现它们更容易调试。所有这些都在我\
    \ alt+tab 到浏览器窗口之前，甚至目光从文本编辑器移到浏览器窗口之前发生。\n\n如果是用于生产的 CSS，结果 CSS 通常会通过 [cssnano](https://cssnano.co)\
    \ 进行额外处理。它是由极具才华的 Ben Briggs 开发的出色的模块化 CSS 压缩器。强烈推荐。\n\n这是一个 `gulpfile.js` 示例，展示了如何在基于\
    \ Gulp 的构建工具中设置 PostCSS。\n"
