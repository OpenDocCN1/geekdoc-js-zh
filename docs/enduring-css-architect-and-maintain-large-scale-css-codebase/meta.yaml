    \ ECSS 所做的那样，可以提供与其他任何选择器一样快的选择速度。这对于那些考虑选择器性能的人来说是一个重要的发现，因为它表明优化的架构可以弥补选择器本身可能存在的任何差异。\n\
    \n在评估结果时，不要将一个浏览器与另一个浏览器进行比较。这不是测试的目的。目的纯粹是尝试评估每个浏览器上使用的不同选择器之间的选择速度相对差异。例如，在任何浏览器上，选择器\
    \ 3 是否比选择器 7 更快？因此，查看表格时，纵向看列比横向看行更有意义。\n\n以下是结果。所有时间单位为毫秒：\n\n| Test | Chrome\
