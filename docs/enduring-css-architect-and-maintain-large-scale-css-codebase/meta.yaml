    # A note on type selectors\n\nWhen authoring CSS, there are occasions when it\
    \ can be tempting to use type selectors. Typically, when there are inline level,\
    \ seemingly innocuous nodes such as `<i>`, `<b>`, `<em>` or `<span>`. For example,\
    \ suppose we have a sentence with a couple of words that need to be bold. Then\
    \ temptation would be to do this:\n\n```\n`<p class=\"ch-ShoppingCart_TextIntro\"\
