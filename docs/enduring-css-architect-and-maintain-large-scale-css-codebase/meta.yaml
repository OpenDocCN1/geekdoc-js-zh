  md: 'sc- as an abbreviation of that file name so we know that any elements that
    begin with that namespace relate to the shopping cart and are rendered by that
    related file.


    In this case, we would then have selectors like:


    +   - `sc-Title` : the title of the shopping cart.

    - `sc-RemoveBtn` : a button that removes an item from the shopping cart.


    Here the selectors are quite compact - aesthetically pleasing if a selector can
    be indeed be described in that way. However, suppose we have a shopping cart which
    can live in multiple contexts. A mini cart view and a full page view. In that
    instance we might decide to use the micro namespace to convey context. For example:


    +   - `mc-ShoppingCart_Title` : The title of the shopping cart, generated by the
    file ‘ShoppingCart’ when in the ‘mini cart’ view/context.

    - `mc-ShoppingCart_RemoveBtn` : the remove button of the shopping cart, generated
    by the file ‘ShoppingCart’ when in the ‘mini cart’ view/context.


    Neither of these is the one true way. Part of ECSS philosophy is that while some
    core principles are essential, it can adapt to differing needs. Generally speaking,
    for smaller scale use cases, the former approach is fine. However, despite the
    comparative verbosity of the selectors in the second approach, it is the most
    resilient and self-documenting. With the second approach you know context, the
    file that generated the selector (and therefore the module it belongs to) and
    the element it relates to.


    > There is more specific information about applying ECSS conventions to web applications
    and visual modules in Chapter 7.'
