    \ by the tooling and ultimately consumed by the browser\n\nLet's now consider\
    \ each rule and the problem it aims to solve.\n\n## 1. Thou shalt have a single\
    \ source of truth for all key selectors\n\nIn the authoring style sheets, a key\
