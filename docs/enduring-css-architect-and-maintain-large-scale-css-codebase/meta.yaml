    \ than it needs to be. This makes any future overrides more difficult to reason\
    \ about and perform.\n\nWhile it may seem overly verbose, this is how that scenario\
    \ should be handled:\n\n```\n<p class=\"ch-ShoppingCart_TextIntro\">Here is the\
    \ contents of your cart. You currently have <b class=\"ch-ShoppingCart_TextIntroStrong\"\
    >5 items</b>.</p>\n```\n\nAnd this CSS:\n\n```\n.ch-ShoppingCart_TextIntro {\n\
    \    /* Styles for the text */\n}\n\n.ch-ShoppingCart_TextIntroStrong {\n    /*\
    \ Styles for the bold section within */\n}\n```\n\nEach element has its own selector\
    \ and rule. Neither depends upon the other. Neither rule requires particular markup\
    \ to be applied.\n\n> Each rule applied to an element should be as opinionated\
    \ about it's own appearance as possible. For example, it you have an element that\
    \ contains two text nodes it seems logical to apply the font size and line height\
    \ to the wrapping element so the two text nodes will inherit from it. However,\
    \ this prevents that text node being moved to another location and rendering consistently.\
    \ Instead, apply the color, font-size and line-height to each node, even if they\
    \ are initially very similar (perhaps at the outset only the colour differs).\
    \ It will seem counter-intuitive at first but protects against possible deviations\
    \ in the future (being moved in the DOM, styles diverging etc)."
