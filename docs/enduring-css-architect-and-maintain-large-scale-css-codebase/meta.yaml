    \ - 3,866,980\n\n# 第 7 章. 将 ECSS 应用于 Web 应用程序\n\nECSS 是一种非常适合开发大型应用程序 CSS 代码库的方法。\n\
    \n通常，从逻辑角度来看（例如 JavaScript/TypeScript/Ruby/其他），一个特定的文件会生成\"一个东西\"。因此，使用该文件名作为模块或模块组件的名称是非常合理的。如果一个文件名为\
    \ 'Header.js' 并生成 header 的容器，那么该 header 的任何组成部分都会相应地命名。例如，公司注册号可能会得到 `sw-Header_Reg`\
    \ 作为其类名。以此类推，header 内的搜索框组件可能会有类似 `sw-HeaderSearch_Input` 的类名（由 `HeaderSearch.js`\
    \ 文件创建的输入框）。\n\n## 示例\n\n让我们来看一个例子。假设我们正在编写一个 JavaScript 客户端应用，我们有一个名为 'ShoppingCartLines.js'\
    \ 的 JavaScript 组件。它的任务是渲染购物车中的商品行，而它本身显示在一个名为 'ShoppingCart.js' 的模块中。'ShoppingCart'\
    \ 模块渲染与购物车本身相关的任何内容。到目前为止还算简单。\n\n现在让我们把想象中的场景稍微复杂化一点，假设我们的购物车在某些场景中以模态视图工作，而在其他场景中作为页面的一部分，处于正常的文档流中。\n\
    \n在这种情况下，我们有一个更大的模块：'ShoppingCart'，以及一个通常位于该模块内的组件 'ShoppingCartLines'。它们各自都有自己的子节点。该模块和组件有两种可能的视图：模态框中和页面中。让我们假设这种上下文的切换由应用程序逻辑来处理。\n\
    \n我们的恒定因素是模块本身，我们可以使用命名空间来为其提供上下文。我们总是使用应用程序模块或组件的完整名称作为 ECSS 样式选择器的模块部分。这样做的好处是使所有\
    \ HTML 类名都明确地表明了它们的来源和用途。\n\n大大咧咧 为模块或组件的最外层容器命名类时，不应向类/选择器添加子扩展。只有模块或组件的子部分才应该获得节点扩展。\n\
    \nOK，那么，此时我们的选择器在 CSS 中可以这样命名：\n\n```\n.mod-ShoppingCart {} /*模态框*/\n.page-ShoppingCart\
    \ {} /*页面*/\n.mod-ShoppingCartLines {} /*模态框*/\n.page-ShoppingCartLines {} /*页面*/\n\
    ```\n\n这样，我们的模块和组件的两种上下文就被命名空间切换隔离开了。我们可以自由地为每个上下文设计样式，而不会有样式从一个泄漏到另一个的风险。这正是当组件和模块为了抽象和复用而共享\
    \ HTML 类名时，通常会变得棘手的那种场景。\n\n让我们考虑一下这个场景的变体。假设我们不通过应用程序逻辑来切换上下文。相反，我们通过媒体查询来切换样式。我们在较小的视口上有模态实现，在较大的视口上有页面样式。\n\
    \n在这种情况下，我们可以使用单一的命名空间，例如 `sc-ShoppingCart`（我用 `sc-` 来指代上下文是 'ShoppingCart'），并在\
    \ CSS 中使用媒体查询来提供视觉变化。\n\n例如：\n\n```\n.sc-ShoppingCart {\n    /*较小视口的模态框样式*/\n\
    \    @media (min-width: $M) {\n        /* 较大视口的页面样式 */\n    }\n}\n\n.sc-ShoppingCartLines\
    \ {\n    /* 较小视口的模态框样式 */\n    @media (min-width: $M) {\n        /* 较大视口的页面样式\
    \ */\n    }\n}\n```\n\n## 模块或组件的子节点\n\n如前所述，模块或组件会有自己的子节点元素。这些选择器应该使用子扩展来命名。例如：\n\
    \n```\n.sc-ShoppingCart {\n    /* 组件/模块的根节点，不需要子扩展 */\n}\n\n.sc-ShoppingCart_Title\
    \ {\n    /* 购物车的 'title' 子节点 */\n}\n\n.sc-ShoppingCart_Close {\n    /* 购物车的 'close'\
    \ 按钮子节点，用于购物车\n    为模态框时 */\n}\n```\n\n每个子节点都获得其父节点的命名空间和组件（或模块）名称。\n\n\U0001F50D\
    \ ECSS 命名约定的详细信息见第 5 章。\n\n## 关于类型选择器的说明\n\n编写 CSS 时，有时会觉得使用类型选择器很诱人。通常，当有内联级别、看似无害的节点（如\
    \ `<i>`、`<b>`、`<em>` 或 `<span>`）时会出现这种情况。例如，假设我们有一个句子，其中几个单词需要加粗。那么诱惑会这样做：\n\n\
    ```\n<p class=\"ch-ShoppingCart_TextIntro\">Here is the contents of your cart.\
    \ You currently have <b>5 items</b>.</p>\n```\n\n并使用这些选择器来给该 b 标签的内容应用样式：\n\n\
    ```\n.ch-ShoppingCart_TextIntro {\n    /* 文本的样式 */\n    b {\n        /* 内部加粗部分的样式\
    \ */\n    }\n}\n```\n\n这里有几个问题：\n\n- 1. 我们创建了了对特定标记的依赖（它必须是子节点，而且必须是 b 标签）。\n"
