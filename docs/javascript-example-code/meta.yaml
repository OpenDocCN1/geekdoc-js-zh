    \ local scope is within the function, block scope is within the braces. Sometimes\
    \ you create braces to identify some code. Let's take a look to show you what\
    \ I mean.\n\n```\nconsole.log(\"here\");\n{\n  let blockScopeVariable = 0;\n \
    \ console.log(blockScopeVariable);\n}\n// we can't reference blockScopeVariable\
    \ here\nconsole.log(blockScopeVariable); // won't work\n```\n\nAs you can see\
    \ create a block scope variable within the braces. Then outside of that, it won't\
    \ be able to be referenced.\n\n## Gotchas\n\nThe scope can be confusing and lead\
    \ to some errors. As you get more experience with JavaScript, you can spot them\
