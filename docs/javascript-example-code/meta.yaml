- img_proc: true
  md: "As you can see create a block scope variable within the braces. Then outside\
    \ of that, it won't be able to be referenced.\n\nGotchas\n\nThe scope can be confusing\
    \ and lead to some errors. As you get more experience with JavaScript, you can\
    \ spot them early on. For instance, if we look at this code snippet:\n\n```\n\
    const colors = ['red', 'blue', 'white'];\n\nfor (let i = 0, l = colors.length;\
    \ i < l; i++) {\n    console.log(colors[i]); // 'red', 'blue', 'white'\n}\nconsole.log(l);\
    \ // ???\nconsole.log(i); // ???\n```\n\nThe variables i and l will get reference\
    \ errors. They are out of scope similar to our previous examples. Dmitri Pavlutin\
    \ explains this more in-depth He also covers a few common mistakes we may make\
    \ in coding.\nJavaScript scope has a few basic principles you need to remember.\
    \ Global scope is visible everywhere. Local and Block scope are more focused.\n\
    Overall you should use the latter and avoid the former. Keep on coding!"
