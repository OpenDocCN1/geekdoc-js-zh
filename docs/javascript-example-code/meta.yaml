  md: '# Exploit JavaScript Closures More and Don’t Panic


    ![](img/c4712982624c6b0b4d50250b90aebac6_36_0.png)


    Photo by Cristina Gottardi on Unsplash


    Having dipped into JavaScript occasionally over my development career Closures
    have been something I didn’t encounter much. They have some great value.


    Closures


    How can we define closures? Well, this article defines it like this. “Closure
    in JavaScript is a form of lexical scoping used to preserve variables from the
    outer scope of a function in the inner scope of a function.”'
  merge: -1
  pgno: 36
- img_proc: true
  md: "```\nfunction outerFunction() {\n  var x = 10;\n\n  function innerFunction()\
    \ {\n    return x;\n  }\n  return innerFunction;\n}\n\nvar inner = outerFunction();\n\
    console.log(inner);\n```\n\nHere is an example of a closure. The outer function\
    \ outerFunction() creates a variable x and a function innerFunction(). The inner\
    \ function innerFunction() returns the value of the variable x. The outer function\
    \ then returns the inner function innerFunction().\n\nNext inner function innerFunction()\
    \ is then assigned to the variable inner. When the variable inner is called, it\
    \ returns the value of the variable x, even though the outer function outerFunction()\
    \ has already returned.\n\nIn a moment we can cover lexical scoping. First, let's\
    \ understand why we need them. Plus some disadvantages too.\n\n# Pros and Cons\n\
    \nClosures can help hide the encapsulation details. Like Java’s private variables\
    \ and functions, this allows us to control access. The downside of this is closures\
    \ take up more memory. These items can not be garbage collected. Lastly, it can\
    \ slow down execution. Deepak Mankotia explores this more in-depth.\n\n# Lexical\
    \ Scoping"
