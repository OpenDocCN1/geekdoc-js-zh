  - '[PAGE 16]


    ```

    let declareVariable; // just declaring

    ```


    The let keyword followed by the name declares the variable. Note our previous
    example set the value. This one does not.


    # Initialize


    When we give it a value we are initializing the variable. So we can use our declareVariable
    here and initialize it too.


    ```

    declareVariable = 123; // initialize variable

    ```


    As you look through the examples you see that my first example did all at once.
    So you can declare and initialize on separate lines or all at once. This can be
    personal preference. It can aid in the readability of separating them.


    # Naming


    As you name your variables you have a few rules to learn in JavaScript. The length
    can be as short as one character. The first character is limited to letters, underscore(_),
    and dollar sign($). Numbers are not allowed for the first character.


    ```

    let a; // letter

    let arelongnameforvariablethatyouwontwanttread; // long but

    let _var; // underscore first

    let $sal; // dollar sign first

    ```'
  - '[PAGE 17]


    let 4num; // illegal - won''t work!


    The other characters in the name can be letters, numbers, and

    characters. Also, the case can be mixed too.


    let aMixtureUpperCaseAndLowerCase;

    let a123$;


    let _jsfgiu$234432;


    JavaScript gives you a lot of options to name your variables. Your

    fellow developers would appreciate meaningful names. I like to make

    wisecacks, but your code is not a good place to try this.


    Const


    If you have a variable you don''t want to change you can use the const

    keyword to declare it. This is in place of the let keyword.


    ```

    const pi = 3.14; // not able to change

    let exangeRate = 3.4; // able to change

    ```


    Just make sure you think this through. Use the const keyword wisely. If

    you get crazy with it you will have issues.


    let vs var


    Variables can be declared with the var keyword too. Using the var

    keyword declares the variable in the whole function. While let is only for

    the block it is defined.'
