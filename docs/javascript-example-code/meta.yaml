    \ x = 2;\n  console.log(x); // will print 2\n}\n\nconsole.log(x); // will print\
    \ 2\n}\n```\n\n```\nfunction letScoping() {\n  let x = 1;\n\nif (true) {\n  let\
    \ x = 2;\n  console.log(x); // will print 2\n}\n\nconsole.log(x); // will print\
    \ 1\n}\n```\n\nThis article shares more about these two options. It can be confusing\
    \ to a newbie. Overall use let unless you need var. The global nature of var can\
    \ cause some side effects.\n\nThese are the foundations of understanding JavaScript.\
    \ Variables and values give us something to work with as we progress on our journey.\
    \ We learned how to declare and initialize the variables. Plus we covered naming\
    \ and different keywords to use."
- md: "## First easy JavaScript function basics that are the most fascinating\n\n\
    ![](img/c4712982624c6b0b4d50250b90aebac6_19_0.png)\n\nPhoto by Stanley Dai on\
    \ Unsplash\n\nFunctions are the powerhouse in JavaScript. This is where the work\
    \ happens. Do we need to calculate the space of a floor? This calls for a function.\n\
    \n```javascript\nfunction calculateFlooring(length, width) {\n  return length\
    \ * width;\n}\n```\n\nThis function will calculate the flooring we need if we\
    \ remodel the kitchen. So why do we need functions?\n\n## Benefits\n\nThink of\
    \ a function as a container for your code. Similar to a code block but, we can\
    \ call this function repeatedly. This will facilitate reusable code. In our prior\
    \ example, you could copy the statement. Of course, if we wanted to change that\
    \ we needed to search for that code and change all the occurrences.\n\n## Example\n\
    \nIn our first function example, we calculated the flooring. Let’s step back and\
    \ make it even easier. We can print something on the screen.\n\n```javascript\n\
    function greetTom() {\nalert(\"Hello Tom!\");\n}\n```\n\nOf course, you can put\
    \ your name in place of mine. If you want to keep the tradition, you can replace\
    \ it with “Hello World”. Have you wondered why that is the tradition, look...\n\
    \n## Calling\n\nThe code may look nice but nothing happens if you don’t call it.\
    \ How do you do that? I am glad you asked. Here is an example.\n\n```javascript\n\
    function greetTom() {\nalert(\"Hello Tom!\");\n}\n```\n\n```javascript\ngreetTom();\n\
    // do other things...\n```\n\nThat call is easy as it takes no arguments. In our\
    \ first function, we had two arguments we needed. Let’s try that next.\n\n## Passing\
    \ arguments\n\nIn our first example, we started with a function to calculate flooring.\
    \ It took two arguments.\n\n```javascript\nfunction calculateFlooring(length,\
    \ width) {\n  return length * width;\n}\n\ncalculateFlooring(12,10);\n```\n\n\
    We can pass in the two numbers to get the flooring needed. In this example, we\
    \ hard-code the value. You won’t do that often or ever.\n\n```javascript\nfunction\
    \ calculateFlooring(length, width) {\n  return length * width;\n}\n\ncalculateFlooring(length,width);\n\
    ```\n\nAs you see here, we have the two arguments as variables. The names are\
    \ the same as the function but don’t have to be.\n\n## Returning data\n\nIt is\
    \ helpful when we return the calculation. If we don't the function is not as useful\
    \ as it could be. We just need to use the return. We did this in our calculate\
    \ flooring function. Although we need to assign this or print it out.\n\n```javascript\n\
    function calculateFlooring(length, width) {\n  return length * width;\n}\n\nlet\
    \ totalFlooring = 0;\ntotalFlooring = calculateFlooring(length,width);\n```\n\n\
    Now we can use this value later in the application. The prior examples didn't\
    \ use the value returned. This is always an option if you don't need it later\
    \ on.\n\nFunctions can do a lot for us. They provide us with a container for our\
    \ code. Then we can call them and pass parameters. Along with that, they can return\
    \ the data. If you need more information here is some further...\n\n## Avoid painful\
    \ mistakes with these Simplistic JavaScript Conditionals\n\n![](img/c4712982624c6b0b4d50250b90aebac6_23_0.png)\n\
    \nPhoto by Artur Aldyrkhanov on Unsplash\n\nApplications help us make decisions.\
    \ A basic decision is an if condition. For example, if the pizza delivery driver\
    \ arrives open the door. JavaScript like other languages has many conditionals\
    \ like:\n\n```javascript\nif\n```\n\nAn if statement starts with a condition.\
    \ If it is true the statement following will happen.\n\n```javascript\nif(pizzaArrives)\
    \ {\n  openDoor();\n}\n```\n\nSo if pizzaArrives is true we call the function\
    \ openTheDoor. I added the braces after the if statement. This is optional but\
    \ helps readability. Omitting the braces can cause you to miss bugs. So please\
    \ include them!\n\n### if/else\n\nThere are times when you have two different\
    \ courses of action. We can add the else statement along with the if. Say you\
    \ are cooking some hamburgers.\n\n```javascript\nif(sideCooked) {\n  flipBurger();\n\
    } else {\n  keepCooking();\n}\n```\n\nThis check can run the cooking robot at\
    \ your favorite house of burgers. It might need some code though. If you need\
    \ to check two conditions you can have if else:\n\n```javascript\nif(sideCooked)\
    \ {\n  flipBurger();\n} else if(otherCooked) {\n  removeFromGrill();\n} else {\n\
    \  keepCooking();\n}\n```\n\nThis gives us to check additional values. If you\
    \ need more checks switch statement may work better. More on that later.\n\n##\
    \ Conditional Operators\n\nThe operators we use for if statements must resolve\
    \ to true or false. There are quite a few options for you to use. Speaking from\
    \ experience you need to test out the right one.\n\n```javascript\nif(9>5) { alert(\"\
    Greater than\"); } // greater than\nif(5<8) { alert(\"Less than\"); } // less\
    \ than\nif(9>=6) { alert(\"Greater equal to\"); } // greater equal to\nif(4<=6)\
    \ { alert(\"Less equal to\"); } // less equal to\nif(4!=6) { alert(\"Not equal\
    \ to\"); } // not equal to\n```\n\nThere are also logical operators. The Logical\
    \ And (&&) and Logical Or (||). They are used a lot but don’t be intimidated.\n\
    \n```javascript\nconst value1 = 4;\nconst value2 = -3;\n\nconsole.log(value1 >\
    \ 0 && value2 > 0); // Expected output: false\nconsole.log(value1 > 0 || value2\
    \ > 0); // Expected output: true\n```\n\nThe Logical And must have both values\
    \ to resolve as true. The Logical Or needs one to be true.\n\n## switch\n\nSwitch\
    \ statements evaluate the expression to determine which statement to execute.\
    \ Then it runs until reaching a break statement. Here is an example that tells\
    \ us the price you want:\n\n```javascript\nconst shoes = 'Reebok';\nswitch (shoes)\
    \ {\n  case 'Nike':\n    console.log('Nike shoes are.');\n    break;\n  case 'Adidas':\n\
    \  case 'Reebok':\n    console.log('Adidas and Reebok.');\n    break;\n  default:\n\
    \    console.log(`Sorry, we don't carry ${shoes}.`);\n}\n```\n\nIn this example,\
    \ we removed the break from the Nike statement. Do you know what happens here?\
    \ It will print ‘Nike shoes are.’ and then ‘Adidas and Reebok are.’ This type\
    \ of bug is common for beginner programmers. Don’t feel bad. You are now part\
    \ of the club!\n\nConditionals are fundamental to JavaScript. Similar to other\
    \ languages it allows us to provide solutions quickly. The if/else and switch\
    \ are easy to use.\n\n## JavaScript has sizable loops that will explode your mind\n\
    \n![](img/c4712982624c6b0b4d50250b90aebac6_28_0.png)\n\nAs a kid, we planted a\
    \ windbreak on our farm. A line of trees that needed watering a few times a week.\
    \ Turn on the hose water the first tree and count to ten. Move to the second tree\
    \ and repeat. Similar to life our computer programs must repeat things. That’s\
    \ where loops come in handy. For loops are quite common so let’s start there.\n\
    \n### for\n\nIf we have an array of books and we would like to print them out.\
    \ We could use the following loop.\n\n```javascript\nfor (let i = 0; i < books.length;\
    \ i++) {\n  text += books[i] + \"\";\n}\n```\n\nThe for loop has three basic parts.\
    \ Start, Condition, and Step.\n\n**start**\nThis is the part where we set up the\
    \ loop variable. In our example that is Usually, we initialize to zero. Although,\
    \ you can set it to say 10 and then count down too.\n\n**condition**\nNext is\
    \ the condition where check to see if we need to run this loop again. Our example\
    \ checks if we still have more books to loop through. If we are done stop.\n\n\
    **step**\nThe last part is the step. This tells us what happens after each iteration.\
    \ Our example uses the increment operator(++). This is the normal step but we\
    \ can do other things for cases.\n\n### while\n\nIf my dog Baxter wants to eat\
    \ I want to create a loop that feeds him while he is hungry. The while loop can\
    \ do this. Here is an example.\n\n```javascript\nlet baxterHungry = true;\n\n\
    while (baxterHungry) {\n  console.log(feedBaxter);\n  checBaxter();\n}\n```\n\n\
    We set the variable to true. Then we feed the dog until it becomes false. The\
    \ while loop evaluates the condition we give it. It needs to resolve to be true\
    \ or false.\n\nIf it is true the code inside the loop executes. We evaluate the\
    \ condition again. Once the condition becomes false the loop stops.\n\n### do-while\n\
    \nThe for and while loops check the condition then run the code statements. The\
    \ do-while is different in that it runs the code and then checks your condition.\
    \ It is less common but useful in special situations.\n\n```javascript\nlet donutsEaten\
    \ = 0;\ndo {\n  console.log(\"Donuts eaten \" + donutsEaten);\n  donutsEaten++;\n\
    } while (donutsEaten < 5)\nconsole.log(\"I'm full of Donuts!\");\n```"
  mdcn: "\n## 最迷人的入门简单 JavaScript 函数基础\n\n![](img/c4712982624c6b0b4d50250b90aebac6_19_0.png)\n\
    \n图片由 Stanley Dai 提供自 Unsplash\n\n函数是 JavaScript 的动力源。这是工作发生的地方。我们需要计算地板的面积吗？这就需要一个函数。\n\
    \n```javascript\nfunction calculateFlooring(length, width) {\n  return length\
    \ * width;\n}\n```\n\n如果我们重新装修厨房，这个函数将计算出所需的地板面积。那么，为什么我们需要函数呢？\n\n## 益处\n\n将函数想象成你代码的容器。它类似于代码块，但我们可以重复调用这个函数。这将有助于代码的复用。在我们先先的示例中，你可以复制该语句。当然，如果我们想修改它，我们需要搜索那段代码并修改所有的出现处。\n\
    \n## 示例\n\n在第一个函数示例中，我们计算了地板面积。让我们退一步，让它变得更简单。我们可以在屏幕上打印一些内容。\n\n```javascript\n\
    function greetTom() {\nalert(\"Hello Tom!\");\n}\n```\n\n当然，你可以把我的名字换成你的。如果你想遵循这个传统，可以将其替换为“Hello\
    \ World”。你是否好奇过为什么这是传统，看……\n\n## 调用\n\n代码看起来很不错，但如果你不调用它，什么都不会发生。该怎么做呢？我很高兴你问。这里有一个示例。\n\
    \n```javascript\nfunction greetTom() {\nalert(\"Hello Tom!\");\n}\n```\n\n```javascript\n\
    greetTom();\n// do other things...\n```\n\n那个调用非常简单，因为它不需要参数。在我们第一个函数中，我们两个两个参数。让我们下一个试试。\n\
    \n## 传递参数\n\n在我们的第一个示例中，我们从一个计算地板的函数开始。它接收两个参数。\n\n```javascript\nfunction calculateFlooring(length,\
    \ width) {\n  return length * width;\n}\n\ncalculateFlooring(12,10);\n```\n\n\
    我们可以传入这两个数字来获取所需的地板。在这个示例中，我们硬编码了值。你通常不会这样做，或者永远不会这样做。\n\n```javascript\nfunction\
    \ calculateFlooring(length, width) {\n  return length * width;\n}\n\ncalculateFlooring(length,width);\n\
    ```\n\n如你在此看到的，我们将两个参数作为变量。名字与函数相同，但并不一定相同。\n\n## 返回数据\n\n当我们返回计算结果时是有帮助的。如果不这样做，函数就没有它本可以那么用。我们只需要使用\
    \ `return`。我们在计算地板函数中已经这样做了。尽管我们需要将其赋值或打印出来。\n\n```javascript\nfunction calculateFlooring(length,\
    \ width) {\n  return length * width;\n}\n\nlet totalFlooring = 0;\ntotalFlooring\
    \ = calculateFlooring(length,width);\n```\n\n现在我们可以在应用程序稍中使用这个值。之前的示例没有使用返回的值。如果你以后不需要它，这始终是一个选项。\n\
    \n函数可以为我们做很多事情。它们为我们的代码提供了一个容器。然后我们可以调用它们并传递参数。此外，它们还可以返回数据。如果你需要更多信息，这里有一些进一步的……\n\
    \n## 使用这些简单的 JavaScript 条件判断避免痛苦的错误\n\n![](img/c4712982624c6b0b4d50250b90aebac6_23_0.png)\n\
    \n图片由 Artur Aldyrkhanov 提供自 Unsplash\n\n应用程序帮助我们做决定。一个基础决定是一个 `if` 条件。例如，如果披萨送卖员到了就开门。JavaScript\
    \ 其他语言一样有很多条件判断，如：\n\n```javascript\nif\n```\n\n`if` 语句以一个条件开始。如果它为真，后面的语句将会执行。\n\
    \n```javascript\nif(pizzaArrives) {\n  openDoor();\n}\n```\n\n所以，如果 `pizzaArrives`\
    \ 为真，我们就调用函数 `openTheDoor`。我在 `if` 语句之后添加了大括号。这是可选的，但有助于可读性。省略大括号可能会导致你漏掉错误。所以请包含它们！\n\
    \n### if/else\n\n有时你有两种不同的行动方案。我们可以在 `if` 的同时添加 `else` 语句。假设你正在做一些汉堡。\n\n```javascript\n\
    if(sideCooked) {\n  flipBurger();\n} else {\n  keepCooking();\n}\n```\n\n这个检查可以运行你最喜欢的汉堡店的烹饪机器人。它可能需要一些代码。如果你需要检查两个条件，你可以使用\
    \ `if else`：\n\n```javascript\nif(sideCooked) {\n  flipBurger();\n} else if(otherCooked)\
    \ {\n  removeFromGrill();\n} else {\n  keepCooking();\n}\n```\n\n这让我们能够检查额外的值。如果你需要更多检查，`switch`\
    \ 语句可能会更好。关于这一点稍后会介绍。\n\n## 条件运算符\n\n我们用于 `if` 语句的运算符必须解析为真或假。你有很多选项供你使用。根据经验，你需要测试出正确的那个。\n\
    \n```javascript\nif(9>5) { alert(\"Greater than\"); } // 大于\nif(5<8) { alert(\"\
    Less than\"); } // 小于\nif(9>=6) { alert(\"Greater equal to\"); } // 大于\nif(4<=6)\
    \ { alert(\"Less equal to\"); } // 小于\nif(4!=6) { alert(\"Not equal to\"); } //\
    \ 不等于\n```\n\n还有逻辑运算符。逻辑与 (`&&`) 和逻辑或 (`||`)。 它们被频繁使用，但不要被它们吓到。\n\n```javascript\n\
    const value1 = 4;\nconst value2 = -3;\n\nconsole.log(value1 > 0 && value2 > 0);\
    \ // 预期输出: false\nconsole.log(value1 > 0 || value2 > 0); // 预期输出: true\n```\n\n\
    逻辑与必须两个值都解析为真。逻辑或需要其中一个为真。\n\n## switch\n\n`switch` 语句评估表达式以确定执行哪个语句。然后它一直运行直到遇到\
    \ `break` 语句。这里有一个示例告诉我们你想要的价格：\n\n```javascript\nconst shoes = 'Reebok';\nswitch\
    \ (shoes) {\n  case 'Nike':\n    console.log('Nike shoes are.');\n    break;\n\
    \  case 'Adidas':\n  case 'Reebok':\n    console.log('Adidas and Reebok.');\n\
    \    break;\n  default:\n    console.log(`Sorry, we don't carry ${shoes}.`);\n\
    }\n```\n\n在这个示例中，我们从 `Nike` 语句中删除了 `break`。你知道会发生什么吗？条件判断是 JavaScript 的基础。`if/else`\
    \ 和 `switch` 很容易用。\n\n## JavaScript 有循环会让你大脑爆炸\n\n![](img/c4712982624c6b0b4d50250b90aebac6_28_0.png)\n\
    \n正如一个孩子，我们在农场种了树需要浇水。就像生活一样，计算机程序必须重复。这就是循环有用的地方。`for` 循环非常常见，所以让我们从那里开始。\n\n\
    ### for\n\n如果我们有一个书籍数组并想打印它们。可以使用以下循环。\n\n```javascript\nfor (let i = 0; i < books.length;\
    \ i++) {\n  text += books[i] + \"\";\n}\n```\n\n`for` 循环有三个部分。开始、条件和步骤。\n\n**start**\n\
    这是我们设置循环变量的部分。在我们示例中，通常初始化为 0。尽管你也可以将其设置为 10 然后递减。\n\n**condition**\n下一步是条件，检查是否需要再次运行此循环。我们的示例检查是否还有更多书籍需要遍历。如果我们完成了就停止。\n\
    \n**step**\n最后一部分是步骤。它告诉我们每次迭代后发生了什么。我们的示例使用了增量运算符(`++`)。这是正常的步骤，但我们也可以做其他事情。\n\
    \n### while\n\n如果我的狗 Baxter 想吃，我想创建一个在他饥饿时喂给他的循环。`while` 循环可以做到这一点。这里有一个示例。\n\n\
    ```javascript\nlet baxterHungry = true;\n\nwhile (baxterHungry) {\n  console.log(feedBaxter);\n\
    \  checBaxter();\n}\n```\n\n我们将变量设置为真。然后我们喂狗直到它变为假。`while` 循环评估我们给它的条件。它需要解析为真或假。\n\
    \n如果是真，循环内部的代码将执行。我们再次评估条件。一旦条件变为假，循环停止。\n\n### do-while\n\n`for` 和 `while` 循环检查条件后运行代码语句。`do-while`\
    \ 不同之处在于它先运行代码然后检查你的条件。它不常见，但在特殊情况下有用。\n\n```javascript\nlet donutsEaten = 0;\n\
    do {\n  console.log(\"Donuts eaten \" + donutsEaten);\n  donutsEaten++;\n} while\
    \ (donutsEaten < 5)\nconsole.log(\"I'm full of Donuts!\");\n```\n"
