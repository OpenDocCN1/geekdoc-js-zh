  md: "In they have a few different types of scope. We can use them accordingly. If\
    \ you have done other coding you you have encountered similar concepts.\n\n# Global\n\
    \nGlobal scope items are visible everywhere. In our example, we create a visible\
    \ variable in the function and outside.\n\n```\nlet myGlobalVariable = \"TheBigGlobalVariable\"\
    ;\n\nfunction logGlobalVariable() {\n  console.log(myGlobalVariable);\n}\n```\n\
    \nlogGlobalVariable();\n\nI bet you are wondering, what if I add a variable in\
    \ the function? This leads us to the local scope example.\n\n# Local\n\nLocal\
    \ variables are visible only in the function. Here is an example to try this out.\n\
    \n```\nlet myGlobalVariable = \"TheBigGlobalVariable\";\n\nfunction logGlobalVariable()\
    \ {\n  console.log(myGlobalVariable);\n  let localVariable = \"TheLocalOne\"\n\
    \  console.log(localVariable);\n}\n```"
