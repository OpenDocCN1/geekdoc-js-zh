    \ = ['red', 'blue', 'white'];\n\nfor (let i = 0, l = colors.length; i < l; i++)\
    \ {\n    console.log(colors[i]); // 'red', 'blue', 'white'\n}\nconsole.log(l);\
    \ // ???\nconsole.log(i); // ???\n```\n\nThe variables i and l will get reference\
    \ errors. They are out of scope similar to our previous examples. Dmitri Pavlutin\
    \ explains this more in-depth. He also covers a few common mistakes we may make\
    \ in coding.\nJavaScript scope has a few basic principles you need to remember.\
    \ Global scope is visible everywhere. Local and Block scope are more focused.\n\
    Overall you should use the latter and avoid the former. Keep on coding!\n\n# Exploit\
    \ JavaScript Closures More and Don’t Panic\n\n![](img/c4712982624c6b0b4d50250b90aebac6_36_0.png)\n\
    \nPhoto by Cristina Gottardi on Unsplash\n\nHaving dipped into JavaScript occasionally\
    \ over my development career, Closures have been something I didn’t encounter\
    \ much. They have some great value.\n\n## Closures\n\nHow can we define closures?\
    \ Well, this article defines it like this. “Closure in JavaScript is a form of\
    \ lexical scoping used to preserve variables from the outer scope of a function\
    \ in the inner scope of a function.”\n\n```\nfunction outerFunction() {\n  var\
    \ x = 10;\n\n  function innerFunction() {\n    return x;\n  }\n  return innerFunction;\n\
    }\n\nvar inner = outerFunction();\nconsole.log(inner);\n```\n\nHere is an example\
    \ of a closure. The outer function outerFunction() creates a variable x and a\
    \ function innerFunction(). The inner function innerFunction() returns the value\
    \ of the variable x. The outer function then returns the inner function innerFunction().\n\
    \nNext inner function innerFunction() is then assigned to the variable inner.\
    \ When the variable inner is called, it returns the value of the variable x, even\
    \ though the outer function outerFunction() has already returned.\n\nIn a moment\
    \ we can cover lexical scoping. First, let's understand why we need them. Plus\
    \ some disadvantages too.\n\n## Pros and Cons\n\nClosures can help hide the encapsulation\
    \ details. Like Java’s private variables and functions, this allows us to control\
    \ access. The downside of this is closures take up more memory. These items can\
    \ not be garbage collected. Lastly, it can slow down execution. Deepak Mankotia\
    \ explores this more in-depth.\n\n## Lexical Scoping\n\nThe term lexical scoping\
    \ refers to where the variable is defined. Along with that where it can be referenced\
    \ or not.\n\n```\nlet x = 10\nlet myFunc = function () {\n  let y = 20;\n  console.log(\"\
    x and y is accessible (outer):\", x, y);\n  let insideFunc= function () {\n  \
    \  let z = 30;\n    console.log(\"x and y and z is accessible (inner):\", x, y,\
    \ z);\n  }\n  insideFunc();\n  return;\n}\nmyFunc();\nconsole.log(\"only x is\
    \ accessible (global):\", x);\n```\n\nIn this example, insideFunc is defined within\
    \ the myFunc. In this case, myFunc is its parent. That of the parent function\
    \ lexically binds the child function. JavaScript Closures are a form of Lexical\
    \ Scoping.\n\nJavaScript Clos are powerful tools. They have some distinct values.\
    \ It allows you to encapsulate details, but it can slow down your execution. Consider\
