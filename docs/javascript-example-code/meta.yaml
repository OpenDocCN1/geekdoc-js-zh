    \ website, or distribute it by any other means without permission.\n\n# First\
    \ edition\n\nThis book was professionally typeset on Reedsy\nFind out more at\
    \ reedsy.com\n\n# Contents\n\n- Preface\n- 1. JavaScript A Useful Tool For Tired\
    \ Minds\n- 2. Look I found these astounding benefits of JavaScript variables and\
    \ values\n- 3. First easy JavaScript function basics that are the most fascinating\n\
    - 4. Avoid painful mistakes with these Simplistic JavaScript Conditionals\n- 5.\
    \ JavaScript has sizable loops that will explode your mind\n- 6. Surprisingly\
    \ Improved JavaScript Variable Scope You Need\n- 7. Exploit JavaScript Closures\
    \ More and Don't Panic\n- About the Author\n\n# Preface\n\nIf you are just starting\
    \ to code with JavaScript or need a refresher this is the book for you. We cover\
    \ some of the basics so you can understand it. Then we will also do some basic\
    \ coding.\n\nThere was a time in my coding career when I would read thick books\
    \ before beginning. I learned that was a form of procrastinating. The best way\
    \ to learn anything is by practice.\n\nIn this book, we don’t overwhelm you with\
    \ a lot of information. As they say in “Just the facts ma’am”. After reading a\
    \ chapter or two you should be ready to start. Then come back for a few more tidbits.\n\
    \nHappy Coding!\n\n# JavaScript A Useful Tool For Tired Minds\n\n![](img/c4712982624c6b0b4d50250b90aebac6_7_0.png)\n\
    \nI have a confession. JavaScript and I started badly. My first foray was for\
    \ form validation. I would cuss about its existence.\n\nAs luck would have after\
    \ being reintroduced to it I began to respect it. Over the years it has grown\
    \ into a powerful language.\n\nJavaScript\n\nWith its humble beginnings, JavaScript\
    \ has evolved into a modern programming language. From the browser to the server\
    \ it can handle almost everything. Node.js gives it a powerful framework on the\
    \ server side.\n\nMozilla created it and here is how they define it. “JavaScript\
    \ is a lightweight interpreted programming language with first-class functions.”\
    \ That is a mouthful!\n\n# Code\n\nLet’s look at some basic code. It is an HTML\
    \ file displaying some JavaScript. Save this code to your local machine.\n\n```html\n\
    <html>\n```\n\n# Test 1\n\n# Test 2\n\nRegular text\n\nWhen we run this we will\
    \ see this.\n\n![](img/c4712982624c6b0b4d50250b90aebac6_10_0.png)\n\nJavaScript\
    \ alert message\n\nOnce you click ok you will see this.\n\n# Test 1\n\n# Test\
    \ 2\n\nRegular text\n\nHTML Screen-shot\n\nStatement\n\nThe statement is the basic\
    \ instruction for JavaScript. We can create some variables and then assign them\
    \ values.\n\n```javascript\nlet a, b, c; // Statement creating three variables\n\
    a = 2; // Statement assign the value of 2 to variable a\nb = 3; // Statement assign\
    \ the value of 3 to variable b\nc = a + b; // Statement assign a plus b to c\n\
    ```\n\nThe semicolon is at the end of the statement. Although we could put multiple\
    \ statements together.\n\n```javascript\na = 2; b = 3;\n```\n\nThis isn’t readable\
    \ so most programmers prefer not to. So just because you can do something doesn’t\
    \ mean you should.\n\n# Functions\n\nWhen we want to perform a task we can create\
    \ a function. If we need to sum two numbers we could do this in code or create\
    \ a function.\n\n```javascript\n// Add two numbers\nnum3 = num1 + num2;\n```\n\
    \n```javascript\n// Function to sum two numbers\nfunction sumTwoNumbers(num1,\
    \ num2) {\n  return num1 + num2;\n}\n```\n\nWhen we want to perform a task we\
