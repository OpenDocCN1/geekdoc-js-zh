  mdcn: "\n# JavaScript 基础\n\n![](img/c4712982624c6b0b4d50250b90aebac6_1_0.png)\n\n\
    Tom Henricksen\n\n# Tom Henricksen\n\nJavaScript 基础\n\nCopyright © 2024 Tom Henricksen\n\
    \n保留所有权利。未经出版者书面许可，不得以任何形式或通过任何手段（电子、机械、复印、录音、扫描或其他）对本书的任何部分进行复制、存储或传输。未经许可复制此书、将其发布到网站或通过任何其他方式进行分发都是非法的。\n\
    \n# 第一版\n\n本书已在 Reedsy 完成了专业排版\n访问 reedsy.com 了解更多信息\n\n# 目录\n\n- 序言\n- 1. JavaScript：疲惫大脑的有用工具\n\
    - 2. 看，我发现了 JavaScript 变量和值的这些惊人益处\n- 3. 最着人的第一个简单 JavaScript 函数基础知识\n- 4. 使用这些简单的\
    \ JavaScript 条件语句避免痛苦的错误\n- 5. JavaScript 拥有巨大的循环，将让你大脑爆炸\n- 6. 你需要的意想不到的 JavaScript\
    \ 变量作用域\n- 7. 充分利用 JavaScript 闭包，不要恐慌\n- 关于作者\n\n# 序言\n\n如果你刚刚开始学习 JavaScript\
    \ 编程，或者需要复习，这本书正适合你。我们涵盖了一些基础知识以便你理解它。然后我们还将进行一些基础编码。\n\n在我的编程生涯中，有一段时间我会在开始之前读厚厚的书。我发现那是一种拖延。学习任何知识最好的方法就是实践。\n\
    \n在本书中，我们不会用大量信息让你 overwhelming不堪。正如人们所说，“只要陈述，女士”。读一两章后，你就应该准备好开始了。然后再回来获取更多小技巧。\n\
    \n祝编程愉快！\n\n# JavaScript：疲惫大脑的有用工具\n\n![](img/c4712982624c6b0b4d50250b90aebac6_7_0.png)\n\
    \n我有一个坦白。JavaScript 和我的开始很糟糕。我的第一次尝试是为了表单验证。我曾对它的存在大骂。\n\n幸运的是，在重新接触它后，我开始尊重它。多年来，它已经成长为一种强大的语言。\n\
    \nJavaScript\n\n尽管起点卑微，JavaScript 已经演变成一种现代编程语言。从浏览器到服务器，它几乎可以处理一切。Node.js 在服务器端为它提供了强大的框架。\n\
    \nMozilla 创建了它，以下是他们对其定义。“JavaScript 是一种具有一等函数的轻量级解释型编程语言。”这听起来真绕口！\n\n# 代码\n\n\
    让我们来看基础代码。这是一个显示某些 JavaScript 的 HTML 文件。将此代码保存到你的本地机器。\n\n```html\n<html>\n```\n\
    \n# 测试 1\n\n# 测试 2\n\n普通文本\n\n当我们运行它时，我们将看到这个\n\n![](img/c4712982624c6b0b4d50250b90aebac6_10_0.png)\n\
    \nJavaScript 警告消息\n\n一旦点击 ok，你将看到这个。\n\n# 测试 1\n\n# 测试 2\n\n普通文本\n\nHTML 截图\n\n\
    语句\n\n语句是 JavaScript 的基本指令。我们可以创建一些变量并为它们赋值。\n\n```javascript\nlet a, b, c; //\
    \ 创建三个变量的语句\na = 2; // 将值 2 赋值给变量 a 的语句\nb = 3; // 将值 3 赋值给变量 b 的语句\nc = a + b;\
    \ // 将 a 加 b 赋值给 c 的语句\n```\n\n分号位于语句末。虽然我们可以多个语句放在一起。\n\n```javascript\na = 2;\
    \ b = 3;\n```\n\n这不可读，所以大多数程序员倾向于这样做。仅仅因为你可以做某事，并不意味着你应该这样做。\n\n# 函数\n\n当我们想要执行某个任务时，可以创建一个函数。如果我们需要两个数字之和，我们可以在代码中这样做，也可以创建一个函数。\n\
    \n```javascript\n// 加两个数字\nnum3 = num1 + num2;\n```\n\n```javascript\n// 两个数字之和的函数\n\
    function sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n}\n```\n\n当我们想要执行某个任务时，可以创建一个函数。如果我们需要两个数字之和，我们可以在代码中这样做，也可以创建一个函数。\n\
    \n```javascript\n// 加两个数字\nnum3 = num1 + num2;\n```\n\n```javascript\n// 两个数字之和的函数\n\
    function sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n}\n```\n\n当我们想要执行某个任务时，可以创建一个函数。如果我们需要两个数字之和，我们可以在代码中这样做，也可以创建一个函数。\n\
    \n```javascript\n// 加两个数字\nnum3 = num1 + num2;\n```\n\n```javascript\n// 两个数字之和的函数\n\
    function sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n}\n\n当我们想要执行某个任务时，可以创建一个函数。如果我们需要两个数字之和，我们可以在代码中这样做，也可以创建一个函数。\n\
    \n```javascript\n// 加两个数字\nnum3 = num1 + num2;\n```\n\n```javascript\n// 两个数字之和的函数\n\
    function sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n}\n\n当我们想要执行某个任务时，可以创建一个函数。如果我们需要两个数字之和，我们可以在代码中这样做，也可以创建一个函数。\n\
    \n```javascript\n// 加两个数字\nnum3 = num1 + num2;\n```\n\n```javascript\n// 两个数字之和的函数\n\
    function sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n```\n"
