    \ 'e']\n\n**解析**：`slice()` 方法不会修改原始数组，而是返回一个新数组。原始数组保持不变。\n\n**以下哪种不是 JavaScript\
    \ 中声明变量的有效方式？**\n\n- A) let x = 1;\n- B) var x = 1;\n- C) const x = 1;\n- D) int\
