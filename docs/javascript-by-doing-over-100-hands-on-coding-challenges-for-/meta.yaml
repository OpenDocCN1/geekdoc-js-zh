    new Promise(resolve => resolve(1))

    .then(result => {

    console.log(result); // Outputs 1

    return result * 2;

    })

    .then(result => {

    console.log(result); // Outputs 2

    return result * 2;

    })

    .then(result => {

    console.log(result); // Outputs 4

    return result * 2;

    });


    **Explanation**:

    This example shows how to chain .then() methods to process data sequentially.
    Each .then() handles the result of the previous promise and can modify the data
    before passing it to the next .then().


    ## Promise.all for Concurrent Promises


    **Task**: Use Promise.all to handle multiple promises running concurrently and
    log their results.


    **Purpose**: Explore handling multiple asynchronous operations that run concurrently.


    **JavaScript Code**:

    ```

    let promise1 = Promise.resolve(3);

    let promise2 = 42;

    let promise3 = new Promise((resolve, reject) => {

    setTimeout(resolve, 100, ''foo'');

    });

    Promise.all([promise1, promise2, promise3]).then(values => {

    console.log(values); // Outputs [3, 42, "foo"]

    });

    ```


    **Explanation**:

    Promise.all takes an iterable of promises and returns a single Promise that resolves
    when all of the input promises have resolved. This is used to handle situations
    where multiple tasks need to be completed before proceeding.


    ## Creating and Handling a Failing Promise in a List


    **Task**: Create an array of promises where one rejects and use Promise.allSettled
    to handle each promise''s outcome.


    **Purpose**: Manage multiple promises and handle both success and failure cases.


    **JavaScript Code**:

    ```

    let promises = [

    Promise.resolve(10),

    Promise.reject(new Error("Failure")),

    Promise.resolve(30)

    ];

    Promise.allSettled(promises).then(results => {

    results.forEach((result, index) => {

    console.log(`Promise ${index + 1}:`, result.status);

    });

    });

    ```


    **Explanation**:

    Promise.allSettled returns a promise that resolves after all the given promises
    have either resolved or rejected, with an array of objects reflecting the outcome
    of each promise. It is useful for cases where you need to know the outcome of
    each promise regardless of whether they succeeded or failed.


    ## Multiple Choice Quiz Questions


    **What does a JavaScript promise represent?**


    - A) An array of functions that might not execute in order.

    - B) A single future value that may not yet be available.

    - C) A looping mechanism for asynchronous operations.

    - D) A synchronous callback function.


    **Correct Answer**: B) A single future value that may not yet be available.


    **Explanation**: A promise in JavaScript represents a value that may not yet be
    available but will be resolved at some point in the future.


    **Which method is used to execute code after a promise is resolved or rejected?**


    - A) Promise.then()

    - B) Promise.catch()

    - C) Promise.finally()

    - D) Promise.resolve()


    **Correct Answer**: C) Promise.finally()


    **Explanation**: The finally() method returns a promise. When the promise is settled,
    i.e., either fulfilled or rejected, the specified callback function is executed.
    This provides a way for code to be run whether the promise was fulfilled successfully
    or rejected.


    **How can you handle errors in a chain of promises?**


    - A) Using a loop to catch errors in each promise.

    - B) Using the .error() method at the end of the chain.

    - C) Using a single .catch() method at the end of the chain.

    - D) Errors in promises cannot be caught.


    **Correct Answer**: C) Using a single .catch() method at the end of the chain.


    **Explanation**: Placing a .catch() at the end of a promise chain ensures that
    any error thrown in the chain can be caught and handled appropriately.


    **What does Promise.all do?**


    - A) It resolves all promises in the array regardless of whether some are rejected.

    - B) It rejects as soon as one of the promises in the array rejects.

    - C) It only resolves if all promises are rejected.

    - D) It increases the speed of promise resolution.


    **Correct Answer**: B) It rejects as soon as one of the promises in the array
    rejects.


    **Explanation**: Promise.all is an all-or-nothing method that resolves only if
    all promises in the iterable resolve. It rejects immediately if any of the promises
    reject.


    **What advantage does Promise.allSettled have over Promise.all?**


    - A) It resolves immediately after the first promise settles.

    - B) It only returns successful results.

    - C) It waits for all promises to settle, regardless of whether they resolve or
    reject.

    - D) It rejects all promises if at least one fails.


    **Correct Answer**: C) It waits for all promises to settle, regardless of whether
    they resolve or reject.


    **Explanation**: Promise.allSettled returns a promise that resolves after all
    the given promises have either resolved or rejected, with an array of objects
    that each describe the outcome of each promise.


    These exercises and questions provide a solid foundation in understanding and
    using promises to handle asynchronous operations in JavaScript, crucial for modern
    web application development.


