    D) A method used to close a web connection


    **Answer:** C) A combination of a function and the lexical environment within
    which it was declared


    **Explanation:** A closure is a feature in JavaScript where an inner function
    has access to variables from an outer function''s scope even after the outer function
    has returned.


    # Which HTML tag is used to include an external JavaScript file?


