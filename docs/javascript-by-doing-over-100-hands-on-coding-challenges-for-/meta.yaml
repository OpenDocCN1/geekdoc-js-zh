    # # Functions


    Let''s delve into the concept of functions in JavaScript, a crucial part of writing
    maintainable, reusable code. Functions allow you to encapsulate code that performs
    a specific task and call it from various points in your program. Here, I''ll explain
    the syntax and different aspects of functions, including basic definitions, parameter
    handling, variable scope, and function expressions.


    # ### Basic Function Definition and Invocation


    A function is defined using the function keyword, followed by a name, a set of
    parentheses () which can optionally contain parameters, and a block of code enclosed
    in curly braces {}.


    ```

    function greet() {

    console.log("Hello, world!");

    }

    ```


    Invocation: To run the function, you use the function name followed by parentheses.


    ```

    greet(); // Calls the function, outputting "Hello, world!"

    ```


    # ### Function with Parameters


    Functions can be designed to accept parameters, which are variables used to pass
    values into functions.


    ```

    function greet(name) {

    console.log("Hello, " + name + "!");

    }

    ```


    Invocation with Parameters:


    ```

    greet("Alice"); // Outputs: "Hello, Alice!"

    ```


    In this example, name is a parameter that the function greet uses to customize
    the greeting.


    # ### Default Parameters


    Default parameters allow you to initialize functions with default values. A default
    parameter kicks in when the argument is not provided or is undefined.


    ```

    function greet(name = "Guest") {

    console.log("Hello, " + name + "!");

    }

    ```


    Using Default Parameters:


    ```

    greet("Alice"); // Outputs: "Hello, Alice!"

    greet(); // Outputs: "Hello, Guest!" because no argument is provided

    ```


    # ### Scope of Variables Inside Functions


    Variables declared inside a function cannot be accessed from outside the function.
    This is known as the function scope. Variables within a function are local to
    the function.


    ```

    function sum() {

    let a = 5; // Local variable

    let b = 3; // Local variable

    console.log(a + b); // Works fine, outputs 8

    ```'
