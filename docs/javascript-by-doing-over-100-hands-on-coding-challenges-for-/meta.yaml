    \ conditional logic based on the value of a variable:\n\n```\nlet score = 85;\n\
    if (score >= 90) {\n  console.log(\"Excellent\");\n} else if (score >= 80) {\n\
    \  console.log(\"Good\");\n} else {\n  console.log(\"Needs Improvement\");\n}\n\
    ```\n\n# Combining Strings\n\nConcatenating strings can be done using the + operator\
