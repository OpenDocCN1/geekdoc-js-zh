  mdcn: "\n## 使用 API\n\n在 JavaScript 中使用 API 涉及与远程服务器交互以获取或发送数据。fetch API 是一种现代化的网络请求方式，相比\
    \ XMLHttpRequest 等传统方法，它提供了更简单、更强大的接口。下面，我将解释使用 fetch 处理 API 的相关概念，包括发起基本 fetch\
    \ 请求、获取和显示数据、处理网络错误、发起 POST 请求，以及将 async/await 与 fetch 结合使用。\n\n## 基本 Fetch 请求\n\
    \nfetch 函数用于向远程服务器发起 HTTP 请求，并返回一个 promise，该 promise 会解析为表示请求响应的 Response 对象。\n\
    \n```\nExample: Basic Fetch Request\nfetch('https://api.example.com/data')\n.then(response\
    \ => response.json())\n.then(data => console.log(data))\n.catch(error => console.error('Error\
    \ fetching data:', error));\n```\n\n- 在此示例中，fetch 用于向指定的 URL（https://api.example.com/data）发起\
    \ GET 请求。\n- then 方法用于使用 Response 对象的 json 方法解析 JSON 响应。\n- 后续的 then 方法处理解析后的数据，catch\
    \ 方法处理 fetch 操作期间发生的任何错误。\n\n## 获取并显示数据\n\n从 API 获取数据后，可以将其显示在用户界面中，或根据需要进行进一步处理。\n\
    \n```\nExample: Fetching and Displaying Data\nfetch('https://api.example.com/data')\n\
    .then(response => response.json())\n.then(data => {\n  // Display data in the\
    \ UI\n  document.getElementById('result').textContent = data;\n})\n.catch(error\
    \ => console.error('Error fetching data:', error));\n```\n\n- 在此示例中，通过将 ID 为 result\
    \ 的元素的文本内容设置为获取的数据，将获取的数据显示在 UI 中。\n\n## 处理网络错误\n\n使用 API 时，优雅地处理网络错误以提供良好的用户体验至关重要。\n\
    \n```\nExample: Handling Network Errors\nfetch('https://api.example.com/data')\n\
    .then(response => {\n  if (!response.ok) {\n    throw new Error('Network response\
    \ was not ok');\n  }\n  return response.json();\n})\n.then(data => console.log(data))\n\
    .catch(error => console.error('Error fetching data:', error));\n```\n\n- 在此示例中，检查\
    \ Response 对象的 ok 属性以确定请求是否成功。\n- 如果响应不正常，则会抛出错误并由 catch 方法捕获。\n\n## 使用 Fetch\
    \ 发起 POST 请求\n\nFetch 还可以通过在 fetch 调用中提供附加选项来发起 POST 请求。\nExample: POST Request\
    \ Using Fetch\n\n```\nfetch('https://api.example.com/submit', {\n  method: 'POST',\n\
    \  headers: {\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify({\
    \ key: 'value' }),\n})\n.then(response => response.json())\n.then(data => console.log(data))\n\
    .catch(error => console.error('Error:', error));\n```\n\n- 在此示例中，method 选项设置为\
    \ 'POST'，body 选项用于以 JSON 格式向服务器发送数据。\n\n## 将 Async/Await 与 Fetch 结合使用\n\nAsync/await\
    \ 可以简化发起 fetch 请求的代码，特别是在链式调用多个请求或处理复杂数据时。\nExample: Using Async/Await with Fetch\n\
    \n```\nasync function fetchData() {\n  try {\n    const response = await fetch('https://api.example.com/data');\n\
    \    const data = await response.json();\n    console.log(data);\n  } catch (error)\
    \ {\n    console.error('Error fetching data:', error);\n  }\n}\n\nfetchData();\n\
    ```\n\n- 在此示例中，定义了一个 async 函数 fetchData，用于发起 fetch 请求并使用 await 解析 JSON 响应。\n-\
    \ fetch 操作期间发生的任何错误都会在 catch 块中被捕获并记录。\n\n使用 fetch 处理 API 可以将外部数据无缝集成到 Web 应用程序中。通过了解如何有效使用\
    \ fetch，你可以构建动态且交互式的应用程序，从互联网上的各种来源获取、显示和操作数据。\n\n## 使用 Fetch 获取数据的编程练习\n\n**使用\
    \ API：使用 fetch 从外部 API 获取数据。** 以下是一些专注于在 JavaScript 中使用 fetch 方法处理 API 的编程练习和多项选择题。这些练习将帮助学习者了解如何从外部\
    \ API 获取数据、处理 JSON 响应以及处理潜在错误。\n\n### 基本 Fetch 请求\n\n**任务**：从 JSON 占位符 API 获取数据并记录\
    \ JSON 响应。\n**目的**：学习使用 fetch 执行 GET 请求并处理 JSON 数据。\n**JavaScript 代码**：\n\n```\n\
    fetch('https://jsonplaceholder.typicode.com/posts/1')\n.then(response => response.json())\n\
    .then(json => console.log(json))\n.catch(error => console.error('Error fetching\
    \ data:', error));\n```\n\n**说明**：\n此练习演示了 fetch API 的基本用法，用于向 JSON 占位符服务发起 GET\
    \ 请求。它展示了如何链式调用 .then() 来处理 fetch 返回的 promise，将响应转换为 JSON，然后进行处理。使用 .catch() 进行错误处理。\n\
    \n### 获取并显示数据\n\n**任务**：从 API 获取用户列表，并在 HTML 列表中显示他们的姓名。\n**目的**：将数据获取与 DOM 操作相结合以显示数据。\n\
    HTML + JavaScript 代码：\n\n```\n<ul id=\"userList\"></ul>\n<script>\nfetch('https://jsonplaceholder.typicode.com/users')\n\
    .then(response => response.json())\n.then(users => {\n  const userList = document.getElementById('userList');\n\
    \  users.forEach(user => {\n    const li = document.createElement('li');\n   \
    \ li.textContent = user.name;\n    userList.appendChild(li);\n  });\n})\n.catch(error\
    \ => console.error('Error loading user data:', error));\n</script>\n```\n\n**说明**：\n\
    此脚本获取有关用户的数据，并通过遍历返回的数组进行处理。它为每个用户动态创建列表项，并将它们附加到 DOM 中的无序列表。这演示了如何处理异步数据并相应地更新\
    \ DOM。\n\n### 处理网络错误\n\n**任务**：从 API 获取数据并优雅地处理网络错误。\n**目的**：实现错误处理以管理网络故障等常见问题。\n\
    **JavaScript 代码**：\n\n```\nfetch('https://jsonplaceholder.typicode.com/posts/2')\n\
    .then(response => {\n  if (!response.ok) {\n    throw new Error('Network response\
    \ was not ok ' + response.statusText);\n  }\n  return response.json();\n})\n.then(json\
    \ => console.log(json))\n.catch(error => console.error('Failed to fetch:', error));\n\
    ```\n\n**说明**：\n此代码使用 response.ok 检查响应状态。如果存在问题（例如，响应状态不在 200-299 范围内），则会抛出错误，然后由\
    \ .catch() 块捕获，从而提供稳健的错误处理。\n\n### 使用 Fetch 发起 POST 请求\n\n**任务**：使用 fetch 通过 POST\
    \ 请求向 API 发送数据。\n**目的**：学习使用 fetch 向服务器发送数据。\n**JavaScript 代码**：\n\n```\nfetch('https://jsonplaceholder.typicode.com/posts',\
    \ {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json'\n\
    \  },\n  body: JSON.stringify({\n    title: 'foo',\n    body: 'bar',\n    userId:\
    \ 1\n  })\n})\n.then(response => response.json())\n.then(json => console.log('Post\
    \ created:', json))\n.catch(error => console.error('Error posting data:', error));\n\
    ```\n\n**说明**：\n此练习展示了如何使用 fetch 进行 POST 请求，通过指定 method、headers 和 body。它使用 JSON.stringify\
    \ 将 JavaScript 对象转换为 JSON 字符串，然后在请求体中发送。\n\n### 将 Async/Await 与 Fetch 结合使用\n\n\
    **任务**：使用 async/await 重写 fetch 请求以获得更清晰的语法。\n**目的**：练习使用现代 JavaScript 特性来简化异步代码。\n\
    **JavaScript 代码**：\n\n```\nasync function fetchPost() {\n  try {\n    const response\
    \ = await fetch('https://jsonplaceholder.typicode.com/posts/3');\n    if (!response.ok)\
    \ {\n      throw new Error('Failed to fetch: ' + response.statusText);\n    }\n\
    \    const post = await response.json();\n    console.log(post);\n  } catch (error)\
    \ {\n    console.error(error);\n  }\n}\nfetchPost();\n```\n\n**说明**：\n此函数演示了如何使用\
    \ async/await 与 fetch 结合，使异步 HTTP 请求更具可读性且更易于管理。它直接在 async 函数中使用 try/catch 进行错误处理。\n\
    \n## 多项选择题\n\n**fetch 函数返回什么？**\nA) 一个 JSON 对象\nB) 一个立即解析的 promise\nC) 一个解析为请求响应的\
