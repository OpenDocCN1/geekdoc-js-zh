- md: "# JavaScript by Doing\n\n## Over 100 Hands-On Coding Challenges for Mastering\
    \ JS\n\nBy\n\n**Laurence Lars Svekis**\n\nCopyright © 2024 Laurence Lars Svekis\
    \ All rights reserved.\n\nDedicated to\n\nAlexis and Sebastian\n\nThank you for\
    \ your support\n\n## Introduction to the Book\n\nWelcome to \"JavaScript by Doing:\
    \ Over 100 Coding Challenges\" the perfect guide for beginners eager to dive into\
    \ the world of JavaScript. This book is structured to provide a clear, step-by-step\
    \ approach to learning JavaScript by actually coding. Whether you are a complete\
    \ novice or have some familiarity with programming, the exercises in this book\
    \ are designed to enhance your understanding and proficiency in JavaScript. From\
    \ simple variable assignments and data types to complex functions and asynchronous\
    \ operations, this guide covers it all, providing both theoretical insights and\
    \ practical exercises to ensure you gain a comprehensive grasp of the language.\n\
    \n### Example Exercises for Beginners\n\n**Displaying Text:** Learn to use console.log()\
    \ to display messages in the browser's console.\n\nExercise: Write a JavaScript\
    \ line of code that prints \"Hello, JavaScript!\" to the console.\n\nSample Code:\
    \ console.log(\"Hello, JavaScript!\");\n\n**Working with Variables:** Introduce\
    \ variable creation and manipulation.\n\nExercise: Declare a variable named age\
    \ and set it to your age. Print this variable to the console.\n\nSample Code:\n\
    let age = 25; // Replace 25 with your age\nconsole.log(age);\n\n**Basic Conditional\
    \ Logic:** Using simple if statements to make decisions.\n\nExercise: Write a\
    \ program that checks if a number (e.g., 5) is even and prints a corresponding\
    \ message to the console.\n\nlet number = 5;\nif (number % 2 === 0) {\nconsole.log(\"\
    The number is even.\");\n} else {\nconsole.log(\"The number is odd.\");\n}\n\n\
    These exercises are designed to help you start coding in JavaScript immediately,\
    \ with simple yet effective tasks that build a solid foundation in programming\
    \ basics. As you progress through the book, the exercises will gradually increase\
    \ in complexity, preparing you for more advanced JavaScript programming challenges.\n\
    \n### Source Code\n\nGet the book source code at [https://github.com/lsvekis/The-JavaScript-Challenge](https://github.com/lsvekis/The-JavaScript-Challenge)\n\
    \nLearn more about JavaScript at [https://basescripts.com/](https://basescripts.com/)\n\
    \n## Introduction to JavaScript\n\n### What is JavaScript?\n\nJavaScript is a\
    \ programming language that allows you to implement complex features on web pages.\
    \ It is the scripting language that enables you to create dynamically updating\
    \ content, control multimedia, animate images, and pretty much everything else.\
    \ It's what makes web pages interactive and engaging.\n\n### History of JavaScript\n\
    \nJavaScript was developed by Brendan Eich in 1995 and quickly became a staple\
    \ of web development. Over the years, it has evolved significantly, with the ECMAScript\
    \ specification standardizing the core of JavaScript, ensuring compatibility across\
    \ different web browsers.\n\n### Why Learn JavaScript?\n\nJavaScript is essential\
    \ for web development. It's one of the three core technologies of the web, alongside\
    \ HTML and CSS, enabling dynamic interactions on webpages. Its versatility extends\
    \ beyond the browser with environments like Node.js, which allow for server-side\
    \ scripting. Learning JavaScript opens doors to web and software development roles\
    \ and is crucial for front-end, back-end, and full-stack development paths.\n\n\
    ## Coding Exercises Introduction\n\n### Setting Up the Environment\n\nTo run JavaScript,\
    \ you typically include it within an HTML document. This setup involves creating\
    \ a simple HTML file and linking a JavaScript file using a `<script>` tag, allowing\
    \ the browser to execute the JavaScript.\n\n### Basic HTML page structure with\
    \ JavaScript\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript\
    \ Practice</title>\n</head>\n<body>\n  <script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\n### Exercise: Displaying Text\n\nThe console.log() function in\
    \ JavaScript is used to print any messages or variables to the browser's console.\
    \ It's a helpful tool for debugging and showing output during development.\n\n\
    ### Understanding Variables\n\nVariables in JavaScript are named containers for\
    \ storing data values. JavaScript uses `var`, `let`, and"
