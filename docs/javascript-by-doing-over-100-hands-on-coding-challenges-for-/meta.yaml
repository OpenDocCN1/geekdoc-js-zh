    \ year.\");\n}\n```\n\n- && and ||: In the leap year check:\n    - year % 4 ===\
    \ 0 && year % 100 !== 0: The year must be divisible by 4 and not divisible by\
    \ 100.\n    - year % 400 === 0: Alternatively, the year can be divisible by 400.\n\
    \    - The || operator means that if either set of conditions is true, the year\
    \ is a leap year.\n\n## Lowercase Conversion for String Comparison\n\nTo ensure\
    \ that user input is compared in a case-insensitive manner, strings are often\
    \ converted to a consistent case (lower or upper) before comparison.\n\n```\n\
    if (input.toLowerCase() === \"hello\") {\n    console.log(\"Hello! Nice to meet\
    \ you.\");\n}\n```\n\ntoLowerCase(): This method converts a string to all lower\
    \ case, facilitating case-insensitive comparisons, which makes the program more\
    \ robust and user-friendly.\n\nThese elements collectively form the backbone of\
    \ many simple yet essential JavaScript programs. Understanding these basics paves\
    \ the way for writing more complex and functional scripts.\n\n## Coding Exercises\
    \ on Conditional Statements\n\n**Conditional Statements if, else, and switch for\
