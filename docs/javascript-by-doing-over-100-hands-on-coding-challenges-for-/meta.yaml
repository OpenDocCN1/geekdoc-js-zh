    Correct Answer: C) Attaches an event handler to an element

    **Explanation:** addEventListener is used to attach an event handler to a DOM
    element, which will listen for specific types of events and execute a function
    when those events occur.


    # **What is event propagation in JavaScript?**


    +   A) The method of passing arguments to events

    B) The way events sequence through phases including capturing and bubbling

    C) The process of adding multiple event listeners to an element

    D) The default action of reloading the page when an event occurs


    Correct Answer: B) The way events sequence through phases including capturing
    and bubbling

    **Explanation:** Event propagation refers to the way some events will travel from
    the window object down to the target element (capturing phase) and then back up
    to the window object (bubbling phase).


    # **What method is used to prevent a form from submitting traditionally when a
    submit button is clicked?**


    +   A) stopPropagation()

    B) preventDefault()

    C) stopImmediatePropagation()

    D) haltExecution()


    Correct Answer: B) preventDefault()

    **Explanation:** The preventDefault method is commonly used to prevent the default
    action of events, such as preventing a form from submitting in the traditional
    way when using AJAX to handle the form data.


    # **In the context of event handling, what does the this keyword refer to within
    an event handler function?**


    +   A) The document object

    B) The window object

    C) The element that the event was attached to

    D) The element that triggered the event


    Correct Answer: C) The element that the event was attached to

    **Explanation:** In event handlers, this refers to the element to which the event
    handler was attached, not necessarily the element that triggered the event.


    # **Which technique is best for adding event listeners to a large number of similar
    elements?**


    +   A) Adding an event listener to each element individually

    B) Using the window.onload event to add listeners

    C) Adding a single event listener to their common parent element

    D) Creating a loop to add listeners during page load


    Correct Answer: C) Adding a single event listener to their common parent element

    **Explanation:** Event delegation, by adding a single event listener to a common
    parent element, is more memory-efficient and performant, especially for handling
    events on large numbers of elements.


    These exercises and questions provide a robust understanding of handling events
    in JavaScript, essential for interactive web development.'
