    \ using if-else statements to make decisions.\n**Sample Code:**\n\n```\nlet age\
    \ = 20;\nif (age >= 18) {\n    console.log(\"You are eligible to vote.\");\n}\
    \ else {\n    console.log(\"You are not eligible to vote yet.\");\n}\n```\n\n\
    **Explanation:**\nThis exercise uses an if-else statement to check whether the\
