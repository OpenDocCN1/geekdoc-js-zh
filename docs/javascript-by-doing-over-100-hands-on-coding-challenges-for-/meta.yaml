    \n### 使用 POST 创建数据\n\n**任务：** 发送数据以在 API 端点创建新资源。\n\n**目的：** 练习使用 POST 方法提交数据。\n\
    \n**JavaScript 代码：**\n\n```\nfetch('https://jsonplaceholder.typicode.com/posts',\
