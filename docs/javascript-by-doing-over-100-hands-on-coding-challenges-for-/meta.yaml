    \ 标识的资源发出 PUT 请求以更新该资源。\n- method 选项设置为 'PUT'，更新后的数据通过 JSON.stringify 以 JSON 格式指定在\
    \ body 选项中。\n\n### 使用 PATCH 进行部分更新\n\nPATCH 方法用于对资源应用部分修改。\n\n**示例：使用 PATCH 进行部分更新**\n\
    \n```\nfetch('https://api.example.com/data/123', {\n  method: 'PATCH',\n  headers:\
    \ {\n    'Content-Type': 'application/json'\n  },\n  body: JSON.stringify({ key:\
    \ 'partial value' })\n})\n.then(response => response.json())\n.then(data => console.log(data))\n\
