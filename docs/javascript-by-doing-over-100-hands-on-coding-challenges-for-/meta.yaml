    \ import User from './User.js';**\n**解释：** 模块的默认导出可以使用简单的 import 语句导入，无需花括号。\n\
    \n**何时应使用命名导出而非默认导出？**\n\n- A) 当你只需要从模块导出一个值时\n- B) 当你想从模块导出多个值时\n- C) 当导出的值不需要在其他文件中使用时\n\
    - D) 当模块不与其他模块交互时\n\n**正确答案：B) 当你想从模块导出多个值时**\n**解释：** 命名导出非常适合导出多个值，允许只导入模块中需要的部分。\n\
