    **Explanation:**

    This exercise shows a function expression where the function is assigned to the
    variable square. Unlike function declarations, function expressions are not hoisted,
    meaning they cannot be called before they are defined in the code.


    # **Multiple Choice Quiz Questions**


    **What will happen if you try to call a function before it is defined in JavaScript?**

    A) It will throw an error.

    B) It will return undefined.

    C) It will work if it''s a function declaration.

    D) It will work only if it''s a function expression.

    Correct Answer: C) It will work if it''s a function declaration

    **Explanation:** Function declarations are hoisted in JavaScript, which means
    they are moved to the top of their containing scope during the compile phase,
    allowing them to be called before they are defined.


    **What is a correct example of a function with default parameters?**

    A) function multiply(a, b = 1) { return a * b; }

    B) function multiply(a = 1, b) { return a * b; }

    C) function multiply(a, b) { return a * b = 1; }

    D) function multiply(a = 1, b) { return a * b = 1; }

    Correct Answer: A) function multiply(a, b = 1) { return a * b; }

    **Explanation:** This is the correct way to set default parameters in JavaScript
    functions. The second parameter b is given a default value of 1.


    **What does the following function return?**

    function checkNum(num) {

    if (num > 10) {

    return true;

    }

    }

    console.log(checkNum(8));

    A) true

    B) false

    C) undefined

    D) 0

    Correct Answer: C) undefined

    **Explanation:** Since the condition num > 10 is not met and there is no else
    part, the function returns undefined for any input less than or equal to 10.


    **Which statement about the scope of variables in JavaScript is true?**

    A) Variables defined inside a function are accessible globally.'
