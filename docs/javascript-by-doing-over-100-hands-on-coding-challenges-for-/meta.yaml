    \ 'POST'，要发送的数据通过 JSON.stringify 以 JSON 格式指定在 body 选项中。\n\n### 使用 PUT 更新数据\n\n\
    PUT 方法用于更新资源，如果资源不存在则创建新资源。\n\n**示例：使用 PUT 更新数据**\n\n```\nfetch('https://api.example.com/data/123',\
    \ {\n  method: 'PUT',\n  headers: {\n    'Content-Type': 'application/json'\n\
