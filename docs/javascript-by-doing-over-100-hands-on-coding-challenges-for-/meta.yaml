    id\": 2, \"name\": \"Bob\"}\n    ]\n}\n```\n\n更新你的 fetchData 函数以使用本地 URL。在我的示例中，我使用的是本地服务器上的\
    \ 5500 端口。\n\n```\nfetchData(\"http://127.0.0.1:5500/data.json\");\n```\n\n##\
    \ 基本的 try...catch 实现\n\n**任务：** 编写一个 JavaScript 函数，尝试解析 JSON 字符串，并使用 try...catch\
    \ 处理出现的任何错误。\n\n**目的：** 理解如何以可控的方式优雅地捕获和处理错误。\n\n**示例代码：**\nfunction parseJSON(jsonString)\
    \ {\n\n```\ntry {\nlet jsonObj = JSON.parse(jsonString);\nconsole.log(\"JSON parsed\
    \ successfully:\", jsonObj);\n} catch (error) {\nconsole.error(\"Failed to parse\
    \ JSON:\", error);\n}\n}\nparseJSON('{\"name\":\"John\", \"age\":30}'); // 有效的\
