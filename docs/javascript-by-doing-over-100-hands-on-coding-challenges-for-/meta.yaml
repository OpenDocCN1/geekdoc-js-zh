    \ User from './User.js';\n- C) import './User.js';\n- D) import * as User from\
    \ './User.js';\n\n**Correct Answer: B) import User from './User.js';**\n**Explanation:**\
    \ The default export of a module can be imported using a simple import statement\
    \ without curly braces.\n\n**When would you use named exports over default exports?**\n\
    \n- A) When you only need to export one value from a module\n- B) When you want\
    \ to export multiple values from a module\n- C) When the export values do not\
    \ need to be used in other files\n- D) When the module does not interact with\
    \ other modules\n\n**Correct Answer: B) When you want to export multiple values\
    \ from a module**\n**Explanation:** Named exports are ideal for exporting multiple\
    \ values, allowing specific imports of only the needed parts of a module.\n\n\
    **What is the correct way to import multiple specific functions from a module?**\n\
    \n- A) import { functionOne, functionTwo } from './module.js';\n- B) import *\
    \ from './module.js';\n- C) import './module.js';\n- D) import functionOne, functionTwo\
    \ from './module.js';\n\n**Correct Answer: A) import { functionOne, functionTwo\
    \ } from './module.js';**\n**Explanation:** To import multiple specific functions\
    \ or values, use the named import syntax with curly braces.\n\n**How can you handle\
    \ a naming conflict when importing a function?**\n\n- A) By importing the module\
    \ only\n- B) By changing the function name in the module\n- C) By using an alias\
    \ in the import statement\n- D) By not importing the conflicting function\n\n\
    **Correct Answer: C) By using an alias in the import statement**\n**Explanation:**\
    \ Aliases can be used during the import to resolve naming conflicts or provide\
    \ more descriptive names locally.\n\nThese exercises and questions provide comprehensive\
    \ insights into using ES6 modules effectively, enhancing code organization and\
    \ maintainability in JavaScript development.\n\n## Modern JavaScript Features\n\
    \n## Template Literals\n\nTemplate literals provide a more flexible and readable\
    \ way to work with strings in JavaScript. They allow embedding expressions directly\
    \ within strings and support multiline strings.\n\nExample: Template Literals\n\
    \n```\nconst name = 'John';\nconst age = 30;\nconst greeting = `Hello, my name\
    \ is ${name} and I am ${age} years old.`;\nconsole.log(greeting);\n```\n\n- In\
    \ this example, the ${} syntax within backticks (`) allows embedding variables\
    \ directly into the string.\n- Template literals support multiline strings without\
    \ needing to concatenate multiple strings or use escape characters.\n\n## Arrow\
    \ Functions\n\nArrow functions provide a more concise syntax for defining functions,\
    \ especially for simple one-liners. They also inherit the lexical scope from the\
    \ surrounding code.\n\nExample: Arrow Functions\n\n```\nconst add = (a, b) =>\
    \ a + b;\nconst greet = name => `Hello, ${name}!`;\nconsole.log(add(2, 3)); //\
    \ Output: 5\nconsole.log(greet('Alice')); // Output: Hello, Alice!\n```\n\n- Arrow\
    \ functions are defined using the (parameters) => expression syntax.\n- They have\
    \ an implicit return if there's only one expression, which makes them concise\
    \ for simple functions.\n\n## let and const\n\nlet and const are block-scoped\
    \ variable declarations introduced in ES6. let allows reassignment, while const\
    \ declares a constant value.\n\nExample: let and const\n\n```\nlet count = 0;\n\
    count = 1;\nconst PI = 3.14;\n```\n\n- let allows variables to be reassigned after\
    \ declaration, while const variables cannot be reassigned after initialization.\n\
    - Both let and const are block-scoped, meaning they are only accessible within\
    \ the block in which they are defined.\n\n## Object Destructuring\n\nObject destructuring\
    \ provides a concise syntax for extracting values from objects and assigning them\
    \ to variables.\n\nExample: Object Destructuring\n\n```\nconst person = {\nfirstName:\
    \ 'John',\nlastName: 'Doe',\nage: 30\n};\nconst { firstName, lastName } = person;\n\
    console.log(firstName, lastName); // Output: John Doe\n```\n\n- Destructuring\
    \ allows extracting properties from objects and binding them to variables with\
    \ the same name.\n- It provides a more concise way to access object properties\
    \ compared to dot notation.\n\n## Async/Await\n\nAsync/await is a modern approach\
    \ to handling asynchronous code in JavaScript. It allows writing asynchronous\
    \ code in a synchronous-like manner, making it easier to read and maintain.\n\n\
    Example: Async/Await\n\n```\nasync function fetchData() {\n  try {\n    const\
    \ response = await fetch('https://api.example.com/data');\n    const data = await\
    \ response.json();\n    console.log(data);\n  } catch (error) {\n    console.error('Error\
    \ fetching data:', error);\n  }\n}\nfetchData();\n```\n\n- Async functions return\
    \ promises implicitly, allowing them to be used with await to wait for asynchronous\
    \ operations to complete.\n- await suspends the execution of the async function\
    \ until the promise is settled, either resolving or rejecting.\n\nThese modern\
    \ JavaScript features enhance code readability, maintainability, and developer\
    \ productivity, making JavaScript a more powerful and expressive language for\
    \ building web applications.\n\n## Coding Exercises on Modern JavaScript Features\n\
