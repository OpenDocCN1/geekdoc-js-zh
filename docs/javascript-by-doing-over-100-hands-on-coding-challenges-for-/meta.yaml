    D) Nothing\n\n正确答案：A) Fizz\n\n**解释：** 由于9能被3整除，条件 x % 3 === 0 为真，因此打印 \"Fizz\"\
    。\n\n#### switch 语句中 default case 的用途是什么？\n\nA) 指定 switch 的结束\nB) 处理 switch case\
