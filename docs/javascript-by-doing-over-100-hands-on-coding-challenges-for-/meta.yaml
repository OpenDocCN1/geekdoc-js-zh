    \ with conditional logic to determine number properties.\n**Sample Code:**\n\n\
    ```\nlet number = 7;\nif (number % 2 === 0) {\n  console.log(\"The number is even.\"\
    );\n} else {\n  console.log(\"The number is odd.\");\n}\n```\n\n**Explanation:**\n\
    The modulus operator % is used to find the remainder of the division of number\
    \ by 2. If the remainder is 0, the number is even; otherwise, it's odd.\n\n###\
    \ Leap Year Checker\n\n**Task:** Determine whether a given year is a leap year.\n\
    **Purpose:** Use nested conditional statements to check for multiple criteria\
    \ in a decision-making process.\n**Sample Code:**\n\n```\nlet year = 2024;\nif\
    \ (year % 4 === 0) {\n  if (year % 100 === 0) {\n    if (year % 400 === 0) {\n\
    \      console.log(`${year} is a leap year.`);\n    } else {\n      console.log(`${year}\
    \ is not a leap year.`);\n    }\n  } else {\n    console.log(`${year} is a leap\
    \ year.`);\n  }\n} else {\n  console.log(`${year} is not a leap year.`);\n}\n\
    ```\n\n**Explanation:**\nThis exercise involves checking a year for leap year\
    \ status using nested if statements. A year is a leap year if it is divisible\
    \ by 4, but years divisible by 100 are not leap years unless they are also divisible\
    \ by 400.\n\n### Multiple Choice Quiz Questions\n\n#### What will the following\
    \ code output if x = 9?\n\n```\nif (x % 3 === 0) {\n    console.log(\"Fizz\");\n\
    } else {\n    console.log(\"Buzz\");\n}\n```\n\nA) Fizz\nB) Buzz\nC) FizzBuzz\n\
    D) Nothing\n\nCorrect Answer: A) Fizz\n\n**Explanation:** Since 9 is divisible\
    \ by 3, the condition x % 3 === 0 is true, thus it prints \"Fizz\".\n\n#### What\
    \ is the purpose of the default case in a switch statement?\n\nA) To specify the\
    \ ending of the switch\nB) To handle any case that is not explicitly handled by\
    \ the switch cases\nC) To break out of the switch block\nD) To declare default\
    \ variables\n\nCorrect Answer: B) To handle any case that is not explicitly handled\
    \ by the switch cases\n\n**Explanation:** The default case in a switch statement\
    \ is used to execute a block of code when none of the other case conditions match\
    \ the switch expression.\n\n#### Which statement about the else clause in JavaScript\
    \ is true?\n\nA) It must always follow an if statement.\nB) It can stand alone\
    \ without an if statement.\nC) It executes a block of code if the preceding if\
    \ statement is true.\nD) It requires its own condition.\n\nCorrect Answer: A)\
    \ It must always follow an if statement.\n\n**Explanation:** The else clause is\
    \ used to execute a block of code when the condition in the preceding if statement\
    \ is false. It cannot stand alone without an if.\n\n#### What will the following\
    \ code print?\n\n```\nlet fruit = \"apple\";\nswitch (fruit) {\n    case \"banana\"\
    :\n        console.log(\"Yellow\");\n        break;\n    case \"apple\":\n   \
    \     console.log(\"Red\");\n        break;\n    default:\n        console.log(\"\
    Unknown\");\n}\n```\n\nA) Yellow\nB) Red\nC) Unknown\nD) Nothing\n\nCorrect Answer:\
    \ B) Red\n\n**Explanation:** Since the variable fruit matches the case \"apple\"\
    , it executes the associated block and prints \"Red\".\n\n#### Which operator\
    \ is commonly used to check equality and type in a condition?\n\nA) ==\nB) =\n\
    C) ===\nD) !=\n\nCorrect Answer: C) ===\n\n**Explanation:** The === operator checks\
    \ both the value and the type of the variables, which is recommended for more\
    \ accurate and predictable results in conditions.\n\nThese exercises and questions\
    \ provide a structured approach to mastering conditional statements in JavaScript,\
    \ enhancing logical thinking and coding precision in various scenarios.\n\n##\
    \ Loops\n\nLet's explore the concepts of loops in JavaScript, including their\
    \ syntax and usage. Loops are fundamental for automating repetitive tasks by executing\
    \ a block of code multiple times under certain conditions. I'll cover the different\
    \ types of loops used in JavaScript, namely for, while, do...while, and provide\
    \ explanations of their syntax and common uses, including handling nested loops\
    \ and breaking out of loops.\n\n### for Loop\n\nThe for loop is one of the most\
    \ common loops in JavaScript. It is used when the number of iterations is known\
    \ before the loop starts. The syntax of a for loop is:\n\n```\nfor (initialization;\
    \ condition; increment) {\n    // Code to execute on each iteration\n}\n```\n\n\
    - Initialization: Typically used to initialize a counter variable.\n- Condition:\
    \ The loop continues to execute as long as this condition is true.\n- Increment:\
    \ Updates the loop counter each time the loop is executed.\n\n### Example: Counting\
    \ with a for Loop\n\n```\nfor (let i = 1; i <= 10; i++) {\n    console.log(i);\
    \ // This will print numbers from 1 to 10\n}\n```\n\nIn this example, i starts\
    \ at 1 and increments by 1 each loop iteration until it exceeds 10, at which point\
    \ the loop stops.\n\n### while Loop\n\nA while loop continues to run as long as\
    \ its condition is true. It's useful when the number of iterations is not known\
    \ beforehand.\n\n```\nwhile (condition) {\n    // Code to execute as long as condition\
    \ is true\n}\n```\n\n### Example: While Loop Basics\n\n```\nlet i = 1;\nwhile\
    \ (i <= 10) {\n    console.log(i);\n    i++;\n}\n```\n\nHere, the loop will execute\
    \ as long as i is less than or equal to 10. It's crucial to increment i inside\
    \ the loop to avoid an infinite loop.\n\n### do...while Loop\n\nThe do...while\
    \ loop is similar to the while loop, but it guarantees that the body of the loop\
    \ will run at least once because the condition is checked after the loop's body.\n\
    \n```\ndo {\n    // Code to execute\n} while (condition);\n```"
