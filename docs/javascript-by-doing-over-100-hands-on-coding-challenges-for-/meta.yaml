    \ triggering an alert.\n\n# **Mouse Over and Mouse Out Events**\n\nMouse over\
    \ (mouseover) and mouse out (mouseout) events are triggered when the mouse pointer\
    \ enters or leaves the element area respectively.\nExample: Handling Mouse Over\
    \ and Mouse Out Events\n\n```\nconst box = document.getElementById('myBox');\n\
    box.addEventListener('mouseover', function() {\n    box.style.backgroundColor\
    \ = 'blue'; // Changes background color when mouse over\n});\nbox.addEventListener('mouseout',\
    \ function() {\n    box.style.backgroundColor = 'red'; // Changes background color\
    \ when mouse out\n});\n```\n\n+   - The mouseover event changes the box's background\
    \ color to blue when the mouse pointer is over the box.\n- The mouseout event\
    \ changes it back to red when the mouse pointer leaves the box.\n\n# **Keyboard\
