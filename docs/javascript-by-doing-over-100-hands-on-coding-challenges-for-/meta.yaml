    # Callbacks


    In JavaScript, callbacks are a fundamental concept, particularly in dealing with
    asynchronous operations. A callback is a function passed into another function
    as an argument to be executed later. This section will cover basic usage of callbacks,
    callbacks with parameters, asynchronous callbacks, error handling in callbacks,
    and managing nested callbacks, often referred to as "callback hell."


    # Basic Callback Usage


    A basic callback function is used to continue code execution after a specific
    task completes. It is a simple function that is called through another function.

    Example: Basic Callback Usage


    ```

    function greeting(name, callback) {

    console.log(''Hello '' + name);

    callback();

    }


    greeting(''Alice'', function() {

    console.log(''Callback executed'');

    });

    ```


    +   * greeting function takes a name and a callback as arguments.

    * The callback function is called right after printing the greeting message.


    # Callback with Parameters


    Callbacks can also receive parameters, allowing data to be passed to them when
    they are executed.

    Example: Callback with Parameters


    ```

    function processUserInput(callback) {

    let name = prompt(''Please enter your name.'');

    callback(name);

    }


    processUserInput(function(name) {

    console.log(''Hello '' + name);

    });

    ```


    +   * The processUserInput function collects user input and then calls the callback,
    passing the input data (name) to it.


    # Asynchronous Callback


    Asynchronous callbacks are commonly used in JavaScript, especially for handling
    operations like reading files, making HTTP requests, or any operations that depend
    on external data sources and take time to complete.

    Example: Asynchronous Callback


    ```

    setTimeout(function() {

    console.log(''This prints after 2 seconds'');

    }, 2000);

    ```'
