    \        line += '* ';\n    }\n    console.log(line);\n}\n```\n\n**Explanation:**\n\
    This exercise uses two nested for loops. The outer loop iterates five times (once\
    \ for each row), and the inner loop iterates five times for each outer loop iteration\
    \ (once for each column), creating a line of asterisks which is printed before\
    \ the next line starts.\n\n## Breaking Out of a Loop\n\n**Task:** Write a for\
    \ loop that prints numbers from 1 to 100, but stops when it reaches a number that\
    \ is divisible by 10.\n\n**Purpose:** Learn how to use the break statement to\
    \ exit a loop early.\n\n**Sample Code:**\n```javascript\nfor (let i = 1; i <=\
    \ 100; i++) {\n    if (i % 10 === 0) {\n        console.log(\"Breaking at:\",\
    \ i);\n        break;\n    }\n    console.log(i);\n}\n```\n\n**Explanation:**\n\
    This for loop checks each number from 1 to 100 to see if it is divisible by 10\
    \ using the modulus operator (%). When it finds the first number that meets this\
    \ condition, it prints that number, executes a break statement to exit the loop,\
    \ and stops further iterations.\n\n## Multiple Choice Quiz Questions\n\n**What\
    \ is the output of the following while loop?**\n\n```javascript\nlet num = 5;\n\
    while (num > 8) {\n    console.log(num);\n    num--;\n}\n```\n\n- A) 5\n- B) Nothing\n\
    - C) 8\n- D) Error\n\n**Correct Answer:** B) Nothing\n\n**Explanation**: Since\
    \ the condition num > 8 is false initially (5 is not greater than 8), the loop\
    \ body does not execute, and nothing is printed.\n\n## Which statement about do...while\
    \ loops is true?\n\n- A) The condition is checked before the first execution of\
    \ the loop body.\n- B) It is identical to the while loop in every aspect.\n- C)\
    \ The loop body is executed at least once regardless of the condition.\n- D) The\
    \ loop cannot use break or continue statements.\n\n**Correct Answer:** C) The\
    \ loop body is executed at least once regardless of the condition.\n\n**Explanation**:\
    \ A do...while loop guarantees that the loop body will execute at least once,\
    \ even if the condition is initially false, because the condition check occurs\
    \ after the loop body's execution.\n\n## What will the following nested loops\
    \ print?\n\n```javascript\nfor (let i = 0; i < 2; i++) {\n    for (let j = 0;\
    \ j < 3; j++) {\n        console.log(i, j);\n    }\n}\n```\n\n- A) 0 0, 0 1, 0\
    \ 2, 1 0, 1 1, 1 2\n- B) 0 1, 0 2, 0 3, 1 1, 1 2, 1 3\n- C) 0 0, 0 1, 1 0, 1 1\n\
    - D) 0 0, 1 0, 2 0, 0 1, 1 1, 2 1\n\n**Correct Answer:** A) 0 0, 0 1, 0 2, 1 0,\
    \ 1 1, 1 2\n\n**Explanation**: The outer loop iterates twice (for i values of\
    \ 0 and 1), and for each iteration of the outer loop, the inner loop iterates\
    \ three times (for j values of 0, 1, and 2), resulting in six print statements.\n\
    \n## How can you immediately exit a loop in JavaScript?\n\n- A) exit()\n- B) break\n\
    - C) continue\n- D) return\n\n**Correct Answer:** B) break\n\n**Explanation**:\
    \ The break statement is used to exit a loop immediately, skipping any remaining\
    \ iterations and moving control out of the loop body.\n\n## Which loop is most\
    \ suitable when the number of iterations is not known beforehand?\n\n- A) for\
    \ loop\n- B) while loop\n- C) do...while loop\n- D) Both B and C\n\n**Correct\
    \ Answer:** D) Both B and C\n\n**Explanation:** Both while and do...while loops\
    \ are suitable when the number of iterations is not predetermined, as they continue\
    \ to loop based on a condition, rather than a counter.\n\nThese exercises and\
    \ quiz questions provide a thorough introduction to using loops in JavaScript,\
    \ helping learners practice essential programming skills for automating and simplifying\
    \ repetitive tasks.\n\n# Functions\n\nLet's delve into the concept of functions\
    \ in JavaScript, a crucial part of writing maintainable, reusable code. Functions\
    \ allow you to encapsulate code that performs a specific task and call it from\
    \ various points in your program. Here, I'll explain the syntax and different\
    \ aspects of functions, including basic definitions, parameter handling, variable\
    \ scope, and function expressions.\n\n### Basic Function Definition and Invocation\n\
    \nA function is defined using the function keyword, followed by a name, a set\
    \ of parentheses () which can optionally contain parameters, and a block of code\
    \ enclosed in curly braces {}.\n\n```javascript\nfunction greet() {\n    console.log(\"\
    Hello, world!\");\n}\n```\n\nInvocation: To run the function, you use the function\
    \ name followed by parentheses.\n\n```javascript\ngreet(); // Calls the function,\
    \ outputting \"Hello, world!\"\n```\n\n### Function with Parameters\n\nFunctions\
    \ can be designed to accept parameters, which are variables used to pass values\
    \ into functions.\n\n```javascript\nfunction greet(name) {\n    console.log(\"\
    Hello, \" + name + \"!\");\n}\n```\n\nInvocation with Parameters:\n\n```javascript\n\
    greet(\"Alice\"); // Outputs: \"Hello, Alice!\"\n```\n\nIn this example, name\
    \ is a parameter that the function greet uses to customize the greeting.\n\n###\
    \ Default Parameters\n\nDefault parameters allow you to initialize functions with\
    \ default values. A default parameter kicks in when the argument is not provided\
    \ or is undefined.\n\n```javascript\nfunction greet(name = \"Guest\") {\n    console.log(\"\
    Hello, \" + name + \"!\");\n}\n```\n\nUsing Default Parameters:\n\n```javascript\n\
    greet(\"Alice\"); // Outputs: \"Hello, Alice!\"\ngreet(); // Outputs: \"Hello,\
    \ Guest!\" because no argument is provided\n```\n\n### Scope of Variables Inside\
    \ Functions\n\nVariables declared inside a function cannot be accessed from outside\
    \ the function. This is known as the function scope. Variables within a function\
    \ are local to the function.\n\n```javascript\nfunction sum() {\n    let a = 5;\
    \ // Local variable\n    let b = 3; // Local variable\n    console.log(a + b);\
    \ // Works fine, outputs 8\n}\n```"
  mdcn: "\n## 示例：Do...While 循环示例\n\n```javascript\n// 要执行的代码\n} while (条件);\n```\n\
    \n```javascript\nlet i = 1;\ndo {\n  console.log(i);\n  i++;\n} while (i <= 10);\n\
    ```\n\n这个循环会打印从 1 到 10 的数字。与 while 循环不同，do...while 循环的条件在第一次迭代之后才会被评估。\n\n## 嵌套\
    \ for 循环\n\n嵌套循环是嵌套在另一个循环内部的循环。它们通常用于遍历多维数据结构。\n\n```javascript\nfor (let i =\
    \ 0; i < n; i++) {\n  for (let j = 0; j < m; j++) {\n    // 要执行的代码\n  }\n}\n```\n\
    \n## 示例：嵌套 for 循环\n\n```javascript\nfor (let i = 0; i < 3; i++) {\n  for (let\
    \ j = 0; j < 3; j++) {\n    console.log(`Row ${i}, Column ${j}`);\n  }\n}\n```\n\
    \n这将输出 3x3 矩阵中每个元素的网格位置。\n\n## 跳出循环\n\nbreak 语句用于立即退出循环，无论循环的条件如何。\n\n```javascript\n\
    for (let i = 1; i <= 10; i++) {\n  if (i === 6) {\n    break; // 当 i 为 6 时退出循环\n\
    \  }\n  console.log(i);\n}\n```\n\n在这个场景中，循环会打印从 1 到 5 的数字。当 i 等于 6 时，执行 break\
    \ 语句，停止循环。\n\n理解这些循环结构对于编写需要处理重复任务或遍历数据结构的高效 JavaScript 代码至关重要。每种循环类型在不同情况下提供不同的优势，为代码执行方式提供了灵活性。\n\
    \n## JavaScript 循环的编程练习\n\n循环：for、while 和 do...while 循环用于重复操作。以下是一组详细的编程练习和多项选择题，专注于理解和使用\
    \ JavaScript 中不同类型的循环：for、while 和 do...while。这些练习和问题旨在帮助学习者掌握循环的概念，以便在编程中实现重复任务的自动化。\n\
    \n## 使用 for 循环计数\n\n**任务：** 使用 for 循环打印从 1 到 10 的数字。\n**目的：** 熟悉 for 循环的语法和用法。\n\
    **示例代码：**\n```javascript\nfor (let i = 1; i <= 10; i++) {\n    console.log(i);\n\
    }\n```\n**解释：**\n这个简单的 for 循环从 i 初始化为 1 开始。只要 i 小于或等于 10，循环就会继续运行。每次迭代时，i 增加 1（i++），并将其值打印到控制台。\n\
    \n## While 循环基础\n\n**任务：** 使用 while 循环打印从 10 递减到 1 的数字。\n**目的：** 理解如何使用 while\
    \ 循环处理递减序列。\n**示例代码：**\n```javascript\nlet i = 10;\nwhile (i > 0) {\n    console.log(i);\n\
    \    i--;\n}\n```\n**解释：**\n这个 while 循环从 i 为 10 开始，只要 i 大于 0 就会继续运行。在循环内部，先打印\
    \ i 的值，然后将其减 1（i--）。这个循环展示了如何用递减值控制循环。\n\n## Do...While 循环示例\n\n**任务：** 使用 do...while\
    \ 循环反复请求用户输入一个数字，直到他们输入 0。\n**目的：** 学习 do...while 循环如何确保循环体至少执行一次。\n**示例代码：**\n\
    ```javascript\nlet number;\ndo {\n    number = parseInt(prompt(\"Enter a number\
    \ (0 to stop):\"), 10);\n    console.log(\"You entered:\", number);\n} while (number\
    \ !== 0);\n```\n**解释：**\ndo...while 循环与 while 循环的不同之处在于，它在检查条件之前至少执行一次循环体。在本例中，它提示用户输入一个数字并打印它，直到用户输入\
    \ 0。\n\n## 嵌套 for 循环\n\n**任务：** 使用嵌套 for 循环打印一个 5x5 的星号（*）网格。\n\n**目的：** 练习使用嵌套循环生成多维结构。\n\
    \n**示例代码：**\n```javascript\nfor (let i = 0; i < 5; i++) {\n    let line = \"\"\
    ;\n    for (let j = 0; j < 5; j++) {\n        line += '* ';\n    }\n    console.log(line);\n\
    }\n```\n\n**解释：**\n这个练习使用两个嵌套的 for 循环。外层循环迭代五次（每行一次），内层循环对外层循环的每次迭代迭代五次（每列一次），创建一行星号并在下一行开始前打印。\n\
    \n## 跳出循环\n\n**任务：** 编写一个 for 循环，打印从 1 到 100 的数字，但当遇到能被 10 整除的数字时停止。\n\n**目的：**\
    \ 学习如何使用 break 语句提前退出循环。\n\n**示例代码：**\n```javascript\nfor (let i = 1; i <= 100;\
    \ i++) {\n    if (i % 10 === 0) {\n        console.log(\"Breaking at:\", i);\n\
    \        break;\n    }\n    console.log(i);\n}\n```\n\n**解释：**\n这个 for 循环检查从 1\
    \ 到 100 的每个数字，看是否能被 10 整除（使用取模运算符 %）。当它找到第一个满足此条件的数字时，打印该数字，执行 break 语句退出循环，并停止进一步迭代。\n\
    \n## 多项选择题\n\n**以下 while 循环的输出是什么？**\n\n```javascript\nlet num = 5;\nwhile (num\
    \ > 8) {\n    console.log(num);\n    num--;\n}\n```\n\n- A) 5\n- B) 没有任何输出\n-\
    \ C) 8\n- D) 错误\n\n**正确答案：** B) 没有任何输出\n\n**解释**：由于条件 num > 8 最初为假（5 不大于 8），循环体不会执行，因此没有任何输出。\n\
    \n## 关于 do...while 循环的哪个说法是正确的？\n\n- A) 条件在循环体第一次执行之前检查。\n- B) 它在各方面与 while 循环完全相同。\n\
    - C) 无论条件如何，循环体至少执行一次。\n- D) 循环不能使用 break 或 continue 语句。\n\n**正确答案：** C) 无论条件如何，循环体至少执行一次。\n\
    \n**解释**：do...while 循环保证循环体至少执行一次，即使条件最初为假，因为条件检查发生在循环体执行之后。\n\n## 以下嵌套循环会打印什么？\n\
    \n```javascript\nfor (let i = 0; i < 2; i++) {\n    for (let j = 0; j < 3; j++)\
    \ {\n        console.log(i, j);\n    }\n}\n```\n\n- A) 0 0, 0 1, 0 2, 1 0, 1 1,\
    \ 1 2\n- B) 0 1, 0 2, 0 3, 1 1, 1 2, 1 3\n- C) 0 0, 0 1, 1 0, 1 1\n- D) 0 0, 1\
    \ 0, 2 0, 0 1, 1 1, 2 1\n\n**正确答案：** A) 0 0, 0 1, 0 2, 1 0, 1 1, 1 2\n\n**解释**：外层循环迭代两次（i\
    \ 值为 0 和 1），对于外层循环的每次迭代，内层循环迭代三次（j 值为 0、1 和 2），结果产生六次打印语句。\n\n## 如何在 JavaScript\
    \ 中立即退出循环？\n\n- A) exit()\n- B) break\n- C) continue\n- D) return\n\n**正确答案：**\
    \ B) break\n\n**解释**：break 语句用于立即退出循环，跳过任何剩余迭代并将控制权移出循环体。\n\n## 当迭代次数事先未知时，哪种循环最合适？\n\
    \n- A) for 循环\n- B) while 循环\n- C) do...while 循环\n- D) B 和 C 都是\n\n**正确答案：** D)\
    \ B 和 C 都是\n\n**解释：** while 和 do...while 循环都适用于迭代次数未预先确定的情况，因为它们基于条件而不是计数器继续循环。\n\
    \n这些练习和测验题全面介绍了 JavaScript 中循环的使用，帮助学习者练习用于自动化和简化重复任务的基本编程技能。\n\n# 函数\n\n让我们深入探讨\
    \ JavaScript 中函数的概念，这是编写可维护、可重用代码的关键部分。函数允许你将执行特定任务的代码封装起来，并从程序中的各个点调用它。在这里，我将解释函数的语法和不同方面，包括基本定义、参数处理、变量作用域和函数表达式。\n\
    \n### 基本函数定义和调用\n\n函数使用 function 关键字定义，后跟名称、一组括号（）——可以选填参数——以及用大括号 {} 括起来的代码块。\n\
    \n```javascript\nfunction greet() {\n    console.log(\"Hello, world!\");\n}\n\
    ```\n\n调用：要运行函数，使用函数名后跟括号。\n\n```javascript\ngreet(); // 调用函数，输出 \"Hello, world!\"\
    \n```\n\n### 带参数的函数\n\n函数可以设计为接受参数，参数是用于向函数传递值的变量。\n\n```javascript\nfunction\
    \ greet(name) {\n    console.log(\"Hello, \" + name + \"!\");\n}\n```\n\n带参数的调用：\n\
    \n```javascript\ngreet(\"Alice\"); // 输出：\"Hello, Alice!\"\n```\n\n在这个例子中，name\
    \ 是函数 greet 用于定制问候语的参数。\n\n### 默认参数\n\n默认参数允许你用默认值初始化函数。当参数未提供或为 undefined 时，默认参数会生效。\n\
    \n```javascript\nfunction greet(name = \"Guest\") {\n    console.log(\"Hello,\
    \ \" + name + \"!\");\n}\n```\n\n使用默认参数：\n\n```javascript\ngreet(\"Alice\"); //\
    \ 输出：\"Hello, Alice!\"\ngreet(); // 输出：\"Hello, Guest!\" 因为没有提供参数\n```\n\n###\
    \ 函数内部变量的作用域\n\n在函数内部声明的变量不能从函数外部访问。这被称为函数作用域。函数内的变量对于该函数是局部的。\n\n```javascript\n\
    function sum() {\n    let a = 5; // 局部变量\n    let b = 3; // 局部变量\n    console.log(a\
    \ + b); // 正常工作，输出 8\n}\n```\n"
