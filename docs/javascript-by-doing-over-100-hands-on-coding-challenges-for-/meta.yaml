  - '[PAGE 5]


    # # Introduction to the Book


    Welcome to "JavaScript by Doing: Over 100 Coding Challenges" the perfect guide
    for beginners eager to dive into the world of JavaScript. This book is structured
    to provide a clear, step-by-step approach to learning JavaScript by actually coding.
    Whether you are a complete novice or have some familiarity with programming, the
    exercises in this book are designed to enhance your understanding and proficiency
    in JavaScript. From simple variable assignments and data types to complex functions
    and asynchronous operations, this guide covers it all, providing both theoretical
    insights and practical exercises to ensure you gain a comprehensive grasp of the
    language.


    # ## Example Exercises for Beginners


    **Displaying Text:** Learn to use console.log() to display messages in the browser''s
    console.

    Exercise: Write a JavaScript line of code that prints "Hello, JavaScript!" to
    the console.

    Sample Code: console.log("Hello, JavaScript!");


    **Working with Variables:** Introduce variable creation and manipulation.

    Exercise: Declare a variable named age and set it to your age. Print this variable
    to the console.

    Sample Code:

    let age = 25; // Replace 25 with your age

    console.log(age);


    **Basic Conditional Logic:** Using simple if statements to make decisions.

    Exercise: Write a program that checks if a number (e.g., 5) is even and prints
    a corresponding message to the console.

    let number = 5;

    if (number % 2 === 0) {

    console.log("The number is even.");

    } else {

    console.log("The number is odd.");

    }


    These exercises are designed to help you start coding in JavaScript immediately,
    with simple yet effective tasks that build a solid foundation in programming basics.
    As you progress through the book, the exercises will gradually increase in complexity,
    preparing you for more advanced JavaScript programming challenges.


    # ## Source Code


    Get the book source code at [https://github.com/lsvekis/The-JavaScript-Challenge](https://github.com/lsvekis/The-JavaScript-Challenge)


    Learn more about JavaScript at [https://basescripts.com/](https://basescripts.com/)'
