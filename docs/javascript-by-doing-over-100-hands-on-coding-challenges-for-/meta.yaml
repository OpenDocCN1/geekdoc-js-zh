    \ to make a PATCH request to apply partial updates to the resource identified\
    \ by the URL (https://api.example.com/data/123).\n- The method option is set to\
    \ 'PATCH', and the partial update data is specified in the body option as JSON\
    \ format using JSON.stringify.\n\n### Deleting Data with DELETE\n\nThe DELETE\
    \ method is used to delete a resource identified by a specified URL.\n\n**Example:\
