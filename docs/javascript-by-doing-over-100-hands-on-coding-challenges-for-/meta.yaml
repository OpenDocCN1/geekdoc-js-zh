    # Event Propagation (Bubbling and Capturing)


    **Task**: Create a nested structure with a div containing a button. Demonstrate
    stopping the bubbling phase using stopPropagation.

    **Purpose**: Understand how event propagation works and how to stop it.

    HTML + JavaScript Code:


    ```

    <div id="myDiv" style="padding: 20px; border: 1px solid black;">

    Click the box or the button!

    <button id="myButton">Click Me</button>

    </div>

    <script>

    document.getElementById(''myDiv'').addEventListener(''click'', function() {

    alert(''Div clicked!'');

    });

    document.getElementById(''myButton'').addEventListener(''click'', function(event)
    {

    event.stopPropagation();

    alert(''Button clicked!'');

    });

    </script>

    ```


    **Explanation**:

    In this setup, clicking the button will alert "Button clicked!" and stop further
    propagation of the event, so the div''s click event will not be triggered. This
    demonstrates the control of event flow using stopPropagation.


    # Preventing Default Actions


    **Task**: Add an event listener to a link and prevent its default navigation action.

    **Purpose**: Learn to prevent the default action of an event.

    HTML + JavaScript Code:


    ```

    <a href="https://www.example.com" id="myLink">Go to Example.com</a>

    <script>

    document.getElementById(''myLink'').addEventListener(''click'', function(event)
    {

    event.preventDefault();

    alert(''Default action prevented!'');

    });

    </script>

    ```


    **Explanation**:

    The event listener attached to the link intercepts the click event and uses preventDefault
    to stop the link from navigating to "https://www.example.com", displaying an alert
    instead.


