    此代码尝试解析 JSON 字符串。如果 JSON 有效，它会记录解析后的对象。如果解析失败（例如，由于语法错误），错误会被 catch 块捕获，然后记录错误消息。\n\
    \n## 使用 finally 块\n\n**任务：** 实现一个 finally 块，在 try...catch 之后运行，以清理资源，无论是否发生错误。\n\
