    A) 30

    B) "1020"

    C) "30"

    D) 1020

    Correct Answer: B) "1020"

    **Explanation:** In JavaScript, when a number is used with a + operator and a
    string, the number is converted to a string and concatenated, not added arithmetically.


    **Which of the following is not a primitive data type in JavaScript?**

    A) string

    B) number

    C) object

    D) boolean

    Correct Answer: C) object

    **Explanation:** The object type is a complex data type, whereas string, number,
    and boolean are all primitive types in JavaScript.


    **What does the following expression evaluate to?**

    typeof null

    A) "null"

    B) "object"

    C) "undefined"

    D) "number"

    Correct Answer: B) "object"

    **Explanation:** This is a known quirk in JavaScript; typeof null returns "object",
    indicating a bug in initial JavaScript implementations.


    ```

