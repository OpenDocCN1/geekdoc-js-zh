    \n**解释：** 此代码使用 POST 方法向服务器发送新数据。headers 指定请求主体格式为 JSON。然后处理并记录响应，展示如何在服务器上创建新数据条目。\n\
    \n### 使用 PUT 更新数据\n\n**任务：** 更新服务器上的现有数据。\n\n**目的：** 理解如何使用 PUT 方法完全更新资源。\n\n\
    **JavaScript 代码：**\n\n```\nfetch('https://jsonplaceholder.typicode.com/posts/1',\
