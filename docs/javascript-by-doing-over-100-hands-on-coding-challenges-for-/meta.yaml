    That's not a valid weather type!\");\n}\n```\n\n此代码演示了如何使用 switch 语句处理多种可能的字符串输入。它根据天气状况处理不同的活动。\n\
    \n### 偶数或奇数判断\n\n**任务：** 编写一个程序，检查一个数字是偶数还是奇数，并打印适当的消息。\n**目的：** 将取模运算符与条件逻辑结合使用，以确定数字的性质。\n\
