- md: "## Deleting Data with DELETE\n\n**Task:** Delete a resource from the server.\n\
    **Purpose:** Learn to remove data using the DELETE method.\n**JavaScript Code:**\n\
    \n```javascript\nfetch('https://jsonplaceholder.typicode.com/posts/1', {\n  method:\
    \ 'DELETE'\n})\n.then(() => console.log('Deleted successfully'))\n.catch(error\
    \ => console.error('Error deleting data:', error));\n```\n\n**Explanation:**\n\
    This example uses the DELETE method to remove a resource specified by its ID.\
    \ The response does not typically contain content, but the status of the operation\
    \ is logged.\n\n## Multiple Choice Quiz Questions\n\n**What HTTP method is commonly\
    \ used to retrieve data from a server?**\n- A) POST\n- B) GET\n- C) DELETE\n-\
    \ D) PUT\n\nCorrect Answer: B) GET\n\n**Explanation:** The GET method is primarily\
    \ used to request data from a server and does not alter the state of the resource.\n\
    \n**Which HTTP method should you use to create a new resource?**\n- A) GET\n-\
    \ B) POST\n- C) PATCH\n- D) PUT\n\nCorrect Answer: B) POST\n\n**Explanation:**\
    \ POST is used to send data to a server to create a new resource.\n\n**What is\
    \ the main difference between PUT and PATCH methods?**\n- A) PUT updates all parts\
    \ of a resource; PATCH can update specific parts.\n- B) PUT is faster than PATCH.\n\
    - C) PATCH creates new resources; PUT does not.\n- D) There is no difference;\
    \ they are interchangeable.\n\nCorrect Answer: A) PUT updates all parts of a resource;\
    \ PATCH can update specific parts.\n**Explanation:** PUT is used for updating\
    \ a resource completely, while PATCH is used for making partial updates to a resource.\n\
    \n## What does the DELETE method do?\n- A) Retrieves data to be deleted.\n- B)\
    \ Updates data that will be deleted.\n- C) Removes data from the server.\n- D)\
    \ None of the above.\n\nCorrect Answer: C) Removes data from the server.\n**Explanation:**\
    \ DELETE is used to delete resources from the server.\n\n## When using the fetch\
    \ API, what property must be set to specify the HTTP method?\n- A) method\n- B)\
    \ header\n- C) body\n- D) type\n\nCorrect Answer: A) method\n**Explanation:**\
    \ When making a request with fetch, the method property of the options object\
    \ is used to specify the HTTP method (e.g., GET, POST, PUT, DELETE).\n\nThese\
    \ exercises and questions offer comprehensive insights into using different HTTP\
    \ methods effectively in JavaScript, which is crucial for interacting with APIs.\n\
    \n## JavaScript Modules\n\nJavaScript modules provide a way to organize code into\
    \ reusable units. They allow you to encapsulate functionality and selectively\
    \ expose parts of it to other parts of your application. Below, I'll explain the\
    \ concepts related to JavaScript modules, including creating and exporting a module,\
    \ importing a module, default exports, and renaming imports and exports.\n\nThe\
    \ `type=\"module\"` attribute in a `<script>` tag is used to indicate that the\
    \ script should be treated as an ES6 module. When a browser encounters a script\
    \ tag with `type=\"module\"`, it knows to load the script as a module and handle\
    \ its dependencies accordingly. Here's how it works:\n\n1. Module Loading: When\
    \ a browser encounters a script tag with `type=\"module\"`, it treats the script\
    \ as an ES6 module. This means that the script is loaded asynchronously, and its\
    \ dependencies are fetched and executed in parallel.\n2. Isolation: Modules loaded\
    \ with `type=\"module\"` have their own scope. This means that variables, functions,\
    \ and classes defined in one module are not accessible in other modules unless\
    \ explicitly exported and imported.\n3. Dependency Resolution: When a module imports\
    \ other modules using `import` statements, the browser automatically resolves\
    \ the dependencies and fetches the imported modules before executing the current\
    \ module.\n4. Strict Mode: Modules are automatically executed in strict mode (`'use\
    \ strict';`). This helps catch common programming errors and promotes cleaner\
    \ code.\n5. CORS Policy: Modules loaded with `type=\"module\"` are subject to\
    \ the Cross-Origin Resource Sharing (CORS) policy. This means that they can only\
    \ import modules from the same origin unless the server explicitly allows cross-origin\
    \ requests.\n\nHere's an example of how to use `type=\"module\"` in a script tag:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Module Example</title>\n</head>\n<body>\n    <!-- Load a module\
    \ script -->\n    <script type=\"module\" src=\"main.js\"></script>\n</body>\n\
    </html>\n```\n\nIn this example, the `main.js` script will be treated as an ES6\
    \ module, and the browser will load it accordingly. You can then use `import`\
    \ and `export` statements in `main.js` to work with other modules in your application.\n\
    \n## Creating and Exporting a Module\n\nTo create a module in JavaScript, you\
    \ can define functions, variables, or classes within a file and use the `export`\
    \ keyword to export them.\n\n**Example: Creating and Exporting a Module**\n\n\
    ```javascript\n// math.js\nexport function add(a, b) {\n    return a + b;\n}\n\
    export function subtract(a, b) {\n    return a - b;\n}\n```\n\n- In this example,\
    \ a module named `math` is created, which contains two functions: `add` and `subtract`.\n\
    - The `export` keyword is used to export each function, making them accessible\
    \ to other modules.\n\n## Importing a Module\n\nTo use functions, variables, or\
    \ classes from a module in another module, you can use the `import` keyword followed\
    \ by the module's path and the name of the exported item.\n\n**Example: Importing\
    \ a Module**\n\n```javascript\n// main.js\nimport { add, subtract } from './math.js';\n\
    console.log(add(5, 3)); // Output: 8\nconsole.log(subtract(10, 4)); // Output:\
    \ 6\n```\n\n- In this example, the `add` and `subtract` functions from the `math`\
    \ module are imported into the `main` module.\n- The functions can then be used\
    \ just like any other function in the `main` module.\n\n## Default Exports\n\n\
    In addition to named exports, a module can have a default export, which represents\
    \ the main functionality of the module.\n\n**Example: Default Export**\n\n```javascript\n\
    // utility.js\nexport default function greet(name) {\n    return `Hello, ${name}!`;\n\
    }\n```\n\n- In this example, the `greet` function is exported as the default export\
    \ of the `utility` module.\n- Default exports are imported without using braces\
    \ and can be renamed during import.\n\n## Importing a Default Export\n\nTo import\
    \ a default export from a module, you can use the `import` keyword followed by\
    \ the module's path and an alias for the default export.\n\n**Example: Importing\
    \ a Default Export**\n\n```javascript\n// app.js\nimport customGreet from './utility.js';\n\
    console.log(customGreet('Alice')); // Output: Hello, Alice!\n```\n\n- In this\
    \ example, the `greet` function from the `utility` module is imported as `customGreet`\
    \ in the `app` module.\n- The function can then be used using the alias `customGreet`.\n\
    \n## Renaming Imports and Exports\n\nYou can rename imported or exported items\
    \ using the `as` keyword.\n\n**Example: Renaming Imports and Exports**\n\n```javascript\n\
    // constants.js\nconst PI = 3.14159;\nexport { PI as PI_VALUE };\n```\n\n- In\
    \ this example, the constant `PI` is exported from the `constants` module as `PI_VALUE`.\n\
    - When importing, you can use the new name `PI_VALUE` to refer to the exported\
    \ constant.\n\nJavaScript modules provide a clean and modular way to structure\
    \ your code, making it easier to manage and maintain large applications. By exporting\
    \ and importing specific parts of your code, you can create a clear separation\
    \ of concerns and improve code reuse and readability.\n\n## Coding Exercises on\
    \ JavaScript ES6 Modules\n\n**JavaScript Modules: Understanding ES6 modules (import/export)\
    \ for better code organization.** Here’s a structured guide with coding exercises\
    \ and multiple-choice quiz questions focused on understanding and using ES6 modules\
    \ in JavaScript. These exercises will help learners grasp the concepts of importing\
    \ and exporting modules, which are essential for organizing code more effectively\
    \ and maintaining larger applications.\n\n### Creating and Exporting a Module\n\
    \n**Task:** Create a module that exports a function to calculate the area of a\
    \ rectangle.\n**Purpose:** Learn to define and export a module.\n**JavaScript\
    \ Code (rectangle.js):**\n\n```javascript\n// Define and export the area function\n\
    export function area(width, height) {\n  return width * height;\n}\n```\n\n**Explanation:**\n\
    This exercise shows how to create a simple function that calculates the area of\
    \ a rectangle and exports it. Using `export` before the function declaration makes\
    \ it accessible to other modules.\n\n### Importing a Module\n\n**Task:** Import\
    \ the area function from the rectangle module and use it in a different file.\n\
    **Purpose:** Practice importing functions from one module to another.\n**JavaScript\
    \ Code (main.js):**"
  mdcn: "\n## 使用 DELETE 删除数据\n\n**任务：** 从服务器删除一个资源。\n**目的：** 学习使用 DELETE 方法移除数据。\n\
    **JavaScript 代码：**\n\n```javascript\nfetch('https://jsonplaceholder.typicode.com/posts/1',\
    \ {\n  method: 'DELETE'\n})\n.then(() => console.log('Deleted successfully'))\n\
    .catch(error => console.error('Error deleting data:', error));\n```\n\n**说明：**\n\
    此示例使用 DELETE 方法删除由其 ID 指定的资源。响应通常不包含内容，但会记录操作的状态。\n\n## 多项选择测验题\n\n**从服务器检索数据通常使用哪种\
    \ HTTP 方法？**\n- A) POST\n- B) GET\n- C) DELETE\n- D) PUT\n\n正确答案：B) GET\n\n**说明：**\
    \ GET 方法主要用于从服务器请求数据，并且不会更改资源的状态。\n\n**创建新资源应该使用哪种 HTTP 方法？**\n- A) GET\n- B)\
    \ POST\n- C) PATCH\n- D) PUT\n\n正确答案：B) POST\n\n**说明：** POST 用于向服务器发送数据以创建新资源。\n\
    \n**PUT 和 PATCH 方法的主要区别是什么？**\n- A) PUT 更新资源的所有部分；PATCH 可以更新特定部分。\n- B) PUT 比\
    \ PATCH 更快。\n- C) PATCH 创建新资源；PUT 不会。\n- D) 没有区别；它们可以互换机制。\n\n正确答案：A) PUT 更新资源的所有部分；PATCH\
    \ 可以更新特定部分。\n**说明：** PUT 用于完全更新资源，而 PATCH 用于对资源进行部分更新。\n\n## DELETE 方法有什么作用？\n\
    - A) 检索要删除的数据。\n- B) 更新将要删除的数据。\n- C) 从服务器移除数据。\n- D) 以上都不是。\n\n正确答案：C) 从服务器移除数据。\n\
    **说明：** DELETE 用于从服务器删除资源。\n\n## 使用 fetch API 时，必须设置哪个属性来指定 HTTP 方法？\n- A) method\n\
    - B) header\n- C) body\n- D) type\n\n正确答案：A) method\n**说明：** 使用 fetch 发出请求时，options\
    \ 对象的 method 属性用于指定 HTTP 方法（例如 GET、POST、PUT、DELETE）。\n\n这些练习和问题提供了在 JavaScript\
    \ 中有效使用不同 HTTP 方法的全面了解，这对于与 API 交互至关重要。\n\n## JavaScript 模块\n\nJavaScript 模块提供了一种将代码组织成可重用单元的方式。它们允许你封装功能，并有选择地将其部分暴露给应用程序的其他部分。下面，我将解释与\
    \ JavaScript 模块相关的概念，包括创建和导出模块、导入模块、默认导出，以及重命名导入和导出。\n\n`<script>` 标签中的 `type=\"\
    module\"` 属性用于指示脚本应被视为 ES6 模块。当浏览器遇到带有 `type=\"module\"` 的脚本标签时，它知道要将脚本作为模块加载并相应地处理其依赖关系。其工作原理如下：\n\
    \n1. 模块加载：当浏览器遇到带有 `type=\"module\"` 的脚本标签时，它将该脚本视为 ES6 模块。这意味着脚本异步加载，其依赖项并行获取和执行。\n\
    2. 隔离：使用 `type=\"module\"` 加载的模块具有自己的作用域。这意味着在一个模块中定义的变量、函数和类无法在其他模块中访问，除非显式地导出和导入。\n\
    3. 依赖解析：当模块使用 `import` 语句导入其他模块时，浏览器会自动解析依赖关系，并在执行当前模块之前获取导入的模块。\n4. 严格模式：模块自动在严格模式下执行（`'use\
    \ strict';`）。这有助于捕获常见的编程错误并促进更清晰的代码。\n5. CORS 策略：使用 `type=\"module\"` 加载的模块受同源资源共享（CORS）策略的约束。这意味着它们只能从同一来源导入模块，除非服务器显式允许跨域请求。\n\
    \n以下是如何在脚本标签中使用 `type=\"module\"` 的示例：\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>Module Example</title>\n\
    </head>\n<body>\n    <!-- Load a module script -->\n    <script type=\"module\"\
    \ src=\"main.js\"></script>\n</body>\n</html>\n```\n\n在此示例中，`main.js` 脚本将被视为 ES6\
    \ 模块，浏览器将相应加载它。然后，你可以在 `main.js` 中使用 `import` 和 `export` 语句来处理应用程序中的其他模块。\n\n\
    ## 创建和导出模块\n\n要在 JavaScript 中创建模块，你可以在文件内定义函数、变量或类，并使用 `export` 关键字将其导出。\n\n**示例：创建和导出模块**\n\
    \n```javascript\n// math.js\nexport function add(a, b) {\n    return a + b;\n\
    }\nexport function subtract(a, b) {\n    return a - b;\n}\n```\n\n- 在此示例中，创建了一个名为\
    \ `math` 的模块，其中包含两个函数：`add` 和 `subtract`。\n- `export` 关键字用于导出每个函数，使其可被其他模块访问。\n\
    \n## 导入模块\n\n要在另一个模块中使用某个模块的函数、变量或类，可以使用 `import` 关键字，后跟模块路径和导出项的名称。\n\n**示例：导入模块**\n\
    \n```javascript\n// main.js\nimport { add, subtract } from './math.js';\nconsole.log(add(5,\
    \ 3)); // 输出: 8\nconsole.log(subtract(10, 4)); // 输出: 6\n```\n\n- 在此示例中，从 `math`\
    \ 模块导入 `add` 和 `subtract` 函数到 `main` 模块。\n- 然后，这些函数可以像 `main` 模块中的任何其他函数一样使用。\n\
    \n## 默认导出\n\n除了命名导出之外，模块还可以有一个默认导出，代表模块的主要功能。\n\n**示例：默认导出**\n\n```javascript\n\
    // utility.js\nexport default function greet(name) {\n    return `Hello, ${name}!`;\n\
    }\n```\n\n- 在此示例中，`greet` 函数作为 `utility` 模块的默认导出导出。\n- 默认导出在导入时不使用花括号，并且可以在导入期间重命名。\n\
    \n## 导入默认导出\n\n要从模块导入默认导出，可以使用 `import` 关键字，后跟模块路径和默认导出的别名。\n\n**示例：导入默认导出**\n\
    \n```javascript\n// app.js\nimport customGreet from './utility.js';\nconsole.log(customGreet('Alice'));\
    \ // 输出: Hello, Alice!\n```\n\n- 在此示例中，`utility` 模块中的 `greet` 函数以 `customGreet`\
    \ 的名称导入到 `app` 模块中。\n- 然后可以使用别名 `customGreet` 来使用该函数。\n\n## 重命名导入和导出\n\n可以使用 `as`\
    \ 关键字重命名导入或导出的项目。\n\n**示例：重命名导入和导出**\n\n```javascript\n// constants.js\nconst\
    \ PI = 3.14159;\nexport { PI as PI_VALUE };\n```\n\n- 在此示例中，常量 `PI` 从 `constants`\
