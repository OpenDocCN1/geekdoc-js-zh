- md: "# JavaScript Quick Interview Questions\n\n**Question:** What is JavaScript\
    \ and what are its key features?\n**Answer:**\n\nJavaScript is a high-level, interpreted\
    \ programming language primarily used for web development. Key features include:\n\
    \n- Dynamically typed.\n- Supports both procedural and object-oriented programming.\n\
    - Runs on the client side (web browsers).\n- Asynchronous programming with callbacks\
    \ and Promises.\n\n**Question:** Explain the difference between var, let, and\
    \ const in JavaScript.\n**Answer:**\n\n- var: Function-scoped, can be redeclared,\
    \ and is hoisted.\n- let: Block-scoped, can be reassigned, and is hoisted.\n-\
    \ const: Block-scoped, cannot be reassigned after declaration, and is hoisted.\n\
    \n**Question:** What is the significance of closures in JavaScript?\n**Answer:**\n\
    \nClosures allow functions to retain access to variables from their outer (enclosing)\
    \ scope even after the outer function has finished executing. They are crucial\
    \ for creating private variables and maintaining state.\n\n**Question:** Explain\
    \ the event delegation in JavaScript.\n**Answer:**\n\nEvent delegation is a technique\
    \ where a single event listener is attached to a common ancestor instead of individual\
    \ elements. It takes advantage of event bubbling, reducing the number of event\
    \ listeners and improving performance.\n\n**Question:** What is the purpose of\
    \ the this keyword in JavaScript?\n**Answer:**\n\nthis refers to the object that\
    \ is currently executing the function. Its value is determined by how a function\
    \ is called, and it allows access to the object's properties and methods.\n\n\
    **Question:** Describe the concept of prototypal inheritance in JavaScript.\n\
    **Answer:**\n\nJavaScript uses prototypal inheritance, where objects can inherit\
    \ properties and methods from other objects via a prototype chain. Each object\
    \ has a prototype object, and if a property is not found in the object, JavaScript\
    \ looks up the chain until it finds the property or reaches the end.\n\n**Question:**\
    \ What is a closure and provide an example?\n**Answer:**\n\nA closure is a function\
    \ that has access to variables from its outer (enclosing) scope, even after the\
    \ outer function has finished executing. Example:\n\n```\nfunction outer() {\n\
    \  let outerVar = 10;\n  function inner() {\n    console.log(outerVar);\n  }\n\
    \  return inner;\n}\nconst closureFunc = outer();\nclosureFunc(); // Outputs:\
    \ 10\n```\n\nIn this example, inner forms a closure with access to outerVar.\n\
    \n**Question:** What is the difference between null and undefined in JavaScript?\n\
    **Answer:**\n\n- null: A deliberate assignment indicating the absence of a value.\n\
    - undefined: A variable that has been declared but not assigned a value, or a\
    \ non-existent property in an object.\n\n**Question:** Explain the purpose of\
    \ the bind method in JavaScript.\n**Answer:**\n\nThe bind method creates a new\
    \ function that, when called, has its this keyword set to a specific value. It\
    \ is often used to create functions with a fixed this value.\n\n**Question:**\
    \ What is the difference between == and === in JavaScript?\n**Answer:**\n\n- ==:\
    \ Loose equality operator, only checks for equality of values after type coercion.\n\
    - ===: Strict equality operator, checks for equality of values and types without\
    \ type coercion.\n\n**Question:** Explain the purpose of the map function in JavaScript.\n\
    **Answer:**\n\nThe map function is used to transform each element of an array\
    \ and create a new array with the results. It does not modify the original array.\n\
    \n```\nconst numbers = [1, 2, 3];\nconst squaredNumbers = numbers.map(num => num\
    \ * num);\n// Result: [1, 4, 9]\n```\n\n**Question:** What is the purpose of the\
    \ async and await keywords in JavaScript?\n**Answer:**\n\nasync is used to declare\
    \ an asynchronous function, and await is used to pause the execution of an async\
    \ function until the promise is resolved, returning the resolved value.\n\n```\n\
    async function fetchData() {\n    const result = await fetch('https://example.com');\n\
    \    const data = await result.json();\n    console.log(data);\n}\n```\n\n**Question:**\
    \ Explain the concept of hoisting in JavaScript.\n**Answer:**\n\nHoisting is a\
    \ JavaScript behavior where variable and function declarations are moved to the\
    \ top of their containing scope during compilation. However, only the declarations\
    \ are hoisted, not the initializations.\n\n**Question:** What is the purpose of\
    \ the reduce method in JavaScript?\n**Answer:**\n\nThe reduce method is used to\
    \ accumulate values in an array and reduce it to a single value. It takes a callback\
    \ function that performs the accumulation.\n\n```\nconst numbers = [1, 2, 3, 4];\n\
    const sum = numbers.reduce((acc, num) => acc + num, 0);\n// Result: 10\n```\n\n\
    **Question:** How does event delegation work in JavaScript?\n**Answer:**\n\nEvent\
    \ delegation involves attaching a single event listener to a common ancestor,\
    \ rather than attaching multiple listeners to individual elements. It leverages\
    \ event bubbling, allowing the handling of events on descendant elements through\
    \ a single listener.\n\n**Question:** Explain the purpose of the localStorage\
    \ in JavaScript.\n**Answer:**\n\nlocalStorage is a web storage object that allows\
    \ developers to store key/value pairs in a web browser with no expiration time.\
    \ The stored data persists even when the browser is closed and reopened.\n\n```\n\
    // Storing data\nlocalStorage.setItem('username', 'John');\n// Retrieving data\n\
    const username = localStorage.getItem('username');\nconsole.log(username); //\
    \ Outputs: John\n```\n\n**Question:** How do you handle errors in JavaScript?\n\
    **Answer:**\n\nErrors in JavaScript can be handled using try, catch, finally blocks.\n\
    \n```\ntry {\n  // Code that might throw an error\n  throw new Error('An error\
    \ occurred');\n} catch (error) {\n  console.error(error.message);\n} finally {\n\
    \  // Code that always runs\n}\n```\n\n**Question:** What is the purpose of the\
    \ Promise object in JavaScript?\n**Answer:**\n\nPromise is an object representing\
    \ the eventual completion or failure of an asynchronous operation and its resulting\
    \ value. It allows better handling of asynchronous operations, especially with\
    \ async/await.\n\n**Question:** How does the event loop work in JavaScript?\n\
    **Answer:**\n\nThe event loop is a mechanism in JavaScript that allows the execution\
    \ of code to be non-blocking. It consists of a call stack, callback queue, and\
    \ event loop. The call stack processes synchronous code, while asynchronous code\
    \ is handled through callback functions pushed to the callback queue by web APIs.\n\
    \n**Question:** Explain the concept of arrow functions in JavaScript.\n**Answer:**\n\
    \nArrow functions provide a concise syntax for writing function expressions. They\
    \ do not have their own this and arguments and are not suitable for functions\
    \ that require these features.\n\n```\nconst add = (a, b) => a + b;\n```\n\n**Question:**\
    \ What is the purpose of the Object.create() method in JavaScript?\n**Answer:**\n\
    \nObject.create() is used to create a new object with a specified prototype object.\
    \ It allows for prototypal inheritance.\n\n```\nconst person = {\n  greet: function()\
    \ {\n    console.log('Hello!');\n  }\n};\n\nconst john = Object.create(person);\n\
    john.greet(); // Outputs: Hello!\n```\n\n**Question:** Explain the concept of\
    \ the event bubbling and capturing phases.\n**Answer:**\n\nEvent propagation in\
    \ the DOM occurs in two phases: capturing phase (top-down) and bubbling phase\
    \ (bottom-up). Event listeners can be placed in either phase to handle events\
    \ as they propagate through the DOM.\n\n**Question:** What is a RESTful API, and\
    \ how does it work in JavaScript?\n**Answer:**\n\nA RESTful API (Representational\
    \ State Transfer) is an architectural style for designing networked applications.\
    \ It uses standard HTTP methods (GET, POST, PUT, DELETE) for communication and\
    \ is stateless. In JavaScript, the fetch API is often used to interact with RESTful\
    \ APIs.\n\n**Question:** What is the purpose of the setTimeout function in JavaScript?\n\
    **Answer:**\n\nsetTimeout is used to delay the execution of a function by a specified\
    \ number of milliseconds.\n\n```\nconsole.log('Start');\nsetTimeout(() => {\n\
    \  console.log('Delayed');\n}, 1000);\nconsole.log('End');\n```\n\nOutput:\n\n\
    ```\nStart\nEnd\nDelayed\n```\n\n**Question:** How does the typeof operator work\
    \ in JavaScript?\n**Answer:**\n\nThe typeof operator returns a string indicating\
    \ the type of an operand. It is often used to check the type of a variable.\n\n\
    ```\nconsole.log(typeof 42); // Outputs: 'number'\n```"
  mdcn: "\n# JavaScript 快速面试题\n\n**问题：** 什么是 JavaScript，它有哪些关键特性？\n**回答：**\n\nJavaScript\
    \ 是一种高级、解释型的编程语言，主要用于 Web 开发。关键特性包括：\n\n- 动态类型。\n- 支持过程式和面向对象编程。\n- 在客户端（Web 浏览器）运行。\n\
    - 使用回调和 Promise 进行异步编程。\n\n**问题：** 解释 JavaScript 中 `var`、`let` 和 `const` 的区别。\n\
    **回答：**\n\n- `var`：函数作用域，可重新声明，存在变量提升。\n- `let`：块级作用域，可重新赋值，存在变量提升。\n- `const`：块级作用域，声明后不可重新赋值，存在变量提升。\n\
    \n**问题：** 闭包在 JavaScript 中的重要性是什么？\n**回答：**\n\n闭包允许函数即使在外部（包含）函数执行完毕后，仍能访问其外部作用域的变量。它们对于创建私有变量和维护状态至关重要。\n\
    \n**问题：** 解释 JavaScript 中的事件委托。\n**回答：**\n\n事件委托是一种技术，它将单个事件监听器附加到公共祖先元素上，而不是每个元素都附加。它利用事件冒泡机制，减少事件监听器的数量并提高性能。\n\
    \n**问题：** JavaScript 中 `this` 关键字的目的是什么？\n**回答：**\n\n`this` 指向当前正在执行函数的对象。其值由函数的调用方式决定，它允许访问对象的属性和方法。\n\
    \n**问题：** 描述 JavaScript 中原型继承的概念。\n**回答：**\n\nJavaScript 使用原型继承，对象可以通过原型链从其他对象继承属性和方法。每个对象都有一个原型对象，如果在对象中找不到某个属性，JavaScript\
    \ 会沿着原型链向上查找，直到找到该属性或到达链的末端。\n\n**问题：** 什么是闭包，请提供一个示例？\n**回答：**\n\n闭包是一个函数，它即使在其外部（包含）函数执行完毕后，仍能访问外部作用域的变量。示例：\n\
    \n```\nfunction outer() {\n  let outerVar = 10;\n  function inner() {\n    console.log(outerVar);\n\
    \  }\n  return inner;\n}\nconst closureFunc = outer();\nclosureFunc(); // 输出:\
    \ 10\n```\n\n在这个示例中，`inner` 函数形成了一个闭包，可以访问 `outerVar`。\n\n**问题：** JavaScript 中\
    \ `null` 和 `undefined` 的区别是什么？\n**回答：**\n\n- `null`：一个故意的赋值，表示没有值。\n- `undefined`：一个已声明但未赋值的变量，或者对象中不存在的属性。\n\
    \n**问题：** 解释 JavaScript 中 `bind` 方法的目的。\n**回答：**\n\n`bind` 方法创建一个新函数，当该函数被调用时，其\
    \ `this` 关键字被设置为指定的值。它通常用于创建具有固定 `this` 值的函数。\n\n**问题：** JavaScript 中 `==` 和 `===`\
    \ 的区别是什么？\n**回答：**\n\n- `==`：宽松相等运算符，仅在类型强制转换后检查值是否相等。\n- `===`：严格相等运算符，不进行类型转换，直接检查值和类型是否相等。\n\
    \n**问题：** 解释 JavaScript 中 `map` 函数的目的。\n**回答：**\n\n`map` 函数用于转换数组的每个元素，并创建一个包含结果的新数组。它不会修改原始数组。\n\
    \n```\nconst numbers = [1, 2, 3];\nconst squaredNumbers = numbers.map(num => num\
    \ * num);\n// 结果: [1, 4, 9]\n```\n\n**问题：** JavaScript 中 `async` 和 `await` 关键字的目的是什么？\n\
    **回答：**\n\n`async` 用于声明一个异步函数，`await` 用于暂停异步函数的执行，直到 Promise 被解析，然后返回解析后的值。\n\n\
    ```\nasync function fetchData() {\n    const result = await fetch('https://example.com');\n\
    \    const data = await result.json();\n    console.log(data);\n}\n```\n\n**问题：**\
    \ 解释 JavaScript 中变量提升的概念。\n**回答：**\n\n变量提升是 JavaScript 的一种行为，在编译阶段，变量和函数声明会被移动到其包含作用域的顶部。但是，只有声明会被提升，初始化不会。\n\
    \n**问题：** JavaScript 中 `reduce` 方法的目的是什么？\n**回答：**\n\n`reduce` 方法用于累加数组中的值，将其归约为单个值。它接受一个执行累加操作的回调函数。\n\
    \n```\nconst numbers = [1, 2, 3, 4];\nconst sum = numbers.reduce((acc, num) =>\
    \ acc + num, 0);\n// 结果: 10\n```\n\n**问题：** 事件委托在 JavaScript 中是如何工作的？\n**回答：**\n\
    \n事件委托涉及将单个事件监听器附加到公共祖先元素，而不是为每个子元素附加多个监听器。它利用事件冒泡，允许通过单个监听器处理后代元素上的事件。\n\n**问题：**\
    \ 解释 JavaScript 中 `localStorage` 的目的。\n**回答：**\n\n`localStorage` 是一个 Web 存储对象，允许开发者在\
    \ Web 浏览器中存储键/值对，且没有过期时间。存储的数据在浏览器关闭并重新打开后仍然存在。\n\n```\n// 存储数据\nlocalStorage.setItem('username',\
    \ 'John');\n// 检索数据\nconst username = localStorage.getItem('username');\nconsole.log(username);\
    \ // 输出: John\n```\n\n**问题：** 如何处理 JavaScript 中的错误？\n**回答：**\n\nJavaScript 中的错误可以使用\
    \ `try`、`catch`、`finally` 块来处理。\n\n```\ntry {\n  // 可能会抛出错误的代码\n  throw new Error('An\
    \ error occurred');\n} catch (error) {\n  console.error(error.message);\n} finally\
    \ {\n  // 总是会执行的代码\n}\n```\n\n**问题：** JavaScript 中 Promise 对象的目的是什么？\n**回答：**\n\
    \nPromise 是一个表示异步操作最终完成或失败及其结果值的对象。它允许更好地处理异步操作，特别是与 `async/await` 结合使用时。\n\n\
    **问题：** JavaScript 中事件循环是如何工作的？\n**回答：**\n\n事件循环是 JavaScript 中一种允许代码非阻塞执行的机制。它由调用栈、回调队列和事件循环本身组成。调用栈处理同步代码，而异步代码则通过\
    \ Web API 推送到回调队列中，由回调函数处理。\n\n**问题：** 解释 JavaScript 中箭头函数的概念。\n**回答：**\n\n箭头函数提供了一种编写函数表达式的简洁语法。它们没有自己的\
    \ `this` 和 `arguments`，因此不适合需要这些特性的函数。\n\n```\nconst add = (a, b) => a + b;\n\
    ```\n\n**问题：** JavaScript 中 `Object.create()` 方法的目的是什么？\n**回答：**\n\n`Object.create()`\
    \ 用于创建一个具有指定原型对象的新对象。它允许进行原型继承。\n\n```\nconst person = {\n  greet: function()\
    \ {\n    console.log('Hello!');\n  }\n};\n\nconst john = Object.create(person);\n\
    john.greet(); // 输出: Hello!\n```\n\n**问题：** 解释事件冒泡和捕获阶段的概念。\n**回答：**\n\nDOM 中的事件传播分为两个阶段：捕获阶段（自顶向下）和冒泡阶段（自底向上）。事件监听器可以放置在任一阶段，以处理事件在\
    \ DOM 中传播时的事件。\n\n**问题：** 什么是 RESTful API，它在 JavaScript 中是如何工作的？\n**回答：**\n\n\
    RESTful API（表述性状态转移）是一种用于设计网络应用程序的架构风格。它使用标准 HTTP 方法（GET、POST、PUT、DELETE）进行通信，并且是无状态的。在\
    \ JavaScript 中，通常使用 `fetch` API 与 RESTful API 进行交互。\n\n**问题：** JavaScript 中 `setTimeout`\
    \ 函数的目的是什么？\n**回答：**\n\n`setTimeout` 用于延迟执行一个函数，延迟时间以毫秒为单位指定。\n\n```\nconsole.log('Start');\n\
    setTimeout(() => {\n  console.log('Delayed');\n}, 1000);\nconsole.log('End');\n\
    ```\n\n输出：\n\n```\nStart\nEnd\nDelayed\n```\n\n**问题：** JavaScript 中 `typeof` 运算符是如何工作的？\n\
    **回答：**\n\n`typeof` 运算符返回一个表示操作数类型的字符串。它通常用于检查变量的类型。\n\n```\nconsole.log(typeof\
    \ 42); // 输出: 'number'\n```\n"
