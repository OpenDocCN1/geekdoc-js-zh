    # ## for Loop


    The for loop is one of the most common loops in JavaScript. It is used when the
    number of iterations is known before the loop starts. The syntax of a for loop
    is:


    ```

    for (initialization; condition; increment) {

    // Code to execute on each iteration

    }

    ```


    +   - Initialization: Typically used to initialize a counter variable.

    - Condition: The loop continues to execute as long as this condition is true.

    - Increment: Updates the loop counter each time the loop is executed.


    # ## Example: Counting with a for Loop


    ```

    for (let i = 1; i <= 10; i++) {

    console.log(i); // This will print numbers from 1 to 10

    }

    ```


    In this example, i starts at 1 and increments by 1 each loop iteration until it
    exceeds 10, at which point the loop stops.


    # ## while Loop


    A while loop continues to run as long as its condition is true. It''s useful when
    the number of iterations is not known beforehand.


    ```

    while (condition) {

    // Code to execute as long as condition is true

    }

    ```


    # ## Example: While Loop Basics


    ```

    let i = 1;

    while (i <= 10) {

    console.log(i);

    i++;

    }

    ```


    Here, the loop will execute as long as i is less than or equal to 10. It''s crucial
    to increment i inside the loop to avoid an infinite loop.


    # ## do...while Loop


    The do...while loop is similar to the while loop, but it guarantees that the body
    of the loop will run at least once because the condition is checked after the
    loop''s body.


