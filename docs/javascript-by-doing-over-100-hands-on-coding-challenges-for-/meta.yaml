  md: '# Multiple Choice Quiz Questions


    **What is a callback function in JavaScript?**

    A) A function that calls back the JavaScript engine to execute a task.

    B) Any function that is passed as an argument to another function and is invoked
    after a certain event or condition.

    C) A special function type that can only be used with arrays.

    D) A function that can return multiple values.

    Correct Answer: B) Any function that is passed as an argument to another function
    and is invoked after a certain event or condition.

    **Explanation:** Callbacks are functions that are passed as arguments to other
    functions and are executed after certain conditions or operations complete.


    **Which scenario best represents a typical use of callbacks?**

    A) Defining functions that must execute in a particular sequence.

    B) Waiting for a user to exit the page before executing the function.

    C) Performing an operation after receiving data from a server.

    D) Calculating mathematical operations synchronously.

    Correct Answer: C) Performing an operation after receiving data from a server.

    **Explanation:** Callbacks are often used in asynchronous operations, such as
    retrieving data from a server, where the callback executes once the data is available.


    **What issue is commonly associated with excessive use of nested callbacks?**

    A) Memory leaks

    B) Callback hell

    C) Data type errors

    D) Scope creep

    Correct Answer: B) Callback hell

    **Explanation:** "Callback hell" refers to complex, nested callbacks that are
    difficult to read and maintain, often occurring in deeply nested asynchronous
    code.


    **How can you handle errors in a callback pattern?**

    A) By throwing an exception inside the callback

    B) By passing the error as the first argument to the callback

    C) By calling a global error handling function

    D) Errors cannot be handled in callbacks

    Correct Answer: B) By passing the error as the first argument to the callback

    **Explanation:** In the callback pattern, especially in Node.js, it''s conventional
    to handle errors by passing them as the first argument to the callback function,
    allowing the caller to handle the error appropriately.


    **What does the setTimeout function demonstrate about JavaScript callbacks?**

    A) Synchronous blocking behavior

    B) Dependency on external libraries

    C) Asynchronous non-blocking behavior

    D) Incompatibility with modern JavaScript development

    Correct Answer: C) Asynchronous non-blocking behavior

    **Explanation:** setTimeout is used to illustrate how JavaScript handles asynchronous
    execution,'
