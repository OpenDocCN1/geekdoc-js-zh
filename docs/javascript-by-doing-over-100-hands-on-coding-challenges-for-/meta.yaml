    ```

    function add(a, b) {

    return a + b;

    }

    console.log(add(5, 3)); // Outputs 8

    ```


    **Explanation:** The add function demonstrates functions with parameters and a
    return statement. It receives two arguments, a and b, adds them, and returns the
    sum. The return statement sends this value back to where the function was called.


    # Default Parameters


    **Task:** Create a function named multiply that multiplies two numbers. Assign
    a default value of 1 to both parameters.

    **Purpose:** Understand default parameter values in functions.

    **Sample Code:**


    ```

    function multiply(a = 1, b = 1) {

    return a * b;

    }

    console.log(multiply(4)); // Outputs 4

    console.log(multiply(4, 5)); // Outputs 20

    ```


    **Explanation:** This function utilizes default parameters. If the function is
    called with less than two arguments, the missing arguments are assigned a default
    value of 1. This prevents errors and allows the function to operate with fewer
    inputs.


    # Scope of Variables Inside Functions


    **Task:** Demonstrate the scope of a variable by defining a variable inside a
    function and trying to access it outside the function.

    **Purpose:** Explore the concept of local scope within functions.

    **Sample Code:**


    ```

    function showNumber() {

    let num = 10; // Local variable

    console.log(num); // Accessible here

    }

    showNumber();

    console.log(num); // Error: num is not defined

    ```


    **Explanation:** The variable num is defined inside the showNumber function, making
    it local to that function. It cannot be accessed outside the function, illustrating
    the concept of local scope.


