    if (err) {

    console.error(err);

    } else {

    console.log(data);

    }

    });

    ```


    **Refactored JavaScript Code:**


    ```

    function getData() {

    return new Promise((resolve, reject) => {

    setTimeout(() => {

    resolve("Data received");

    }, 1000);

    });

    }

    getData()

    .then(data => console.log(data))

    .catch(error => console.error(error));

    ```


    # Explanation:


    Converting the callback-based getData function into a Promise-based approach enhances
    error handling and simplifies chaining asynchronous operations. This also makes
    the function more versatile and easier to integrate with other Promise-based code.


