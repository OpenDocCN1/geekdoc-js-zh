    - B) document.addEventListener(''click'', functionName);

    - C) document.addEventListener.onClick(functionName);

    - D) document.onClick(''click'', functionName);


    **Answer:** B) document.addEventListener(''click'', functionName);

    **Explanation:** addEventListener is used to add an event listener, and it takes
    two arguments: the event type and the callback function to execute when the event
    is triggered.


    ## **What is NaN in JavaScript?**


    - A) A syntax error

