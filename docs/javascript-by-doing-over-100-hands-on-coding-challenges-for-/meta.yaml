    \ 是 undefined。\n\n## 哪个 HTML 事件属性可以在元素被点击时直接运行 JavaScript 代码？\n\n- A) onclick\n\
    - B) onexecute\n- C) onrun\n- D) onaction\n\n**答案：** A) onclick\n\n**解析：** onclick\
    \ 属性用于在 HTML 元素被点击时执行 JavaScript 代码。\n\n## 关于 JavaScript 中的 switch 语句，哪个说法是正确的？\n\
