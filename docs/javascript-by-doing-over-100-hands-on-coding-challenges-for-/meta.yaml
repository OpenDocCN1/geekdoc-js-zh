    the function keyword and the parentheses.


    # ## Arrow Function


    Introduced in ES6, arrow functions provide a concise syntax for writing functions.
    They are especially useful for short functions that just return a value. Arrow
    functions also don''t bind their own this, making them ideal for use in contexts
    where you want to maintain the this value from the surrounding code.


    Example: Basic Arrow Function


    ```

    const add = (a, b) => a + b;

    console.log(add(5, 3)); // Output: 8

    ```


    This example shows a simple arrow function that takes two parameters and returns
    their sum. The return statement is omitted because the function consists of only
    one expression.


