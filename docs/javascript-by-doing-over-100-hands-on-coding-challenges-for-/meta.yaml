    C) <js>

    D) <link>


    **Answer:** B) <script>


    **Explanation:** The <script> tag is used to embed a JavaScript file into an HTML
    document with the src attribute specifying the path to the file.


    # What is the primary purpose of the splice() method in an array?


    +   A) To join two arrays into one

    B) To search for a specified value within the array

    C) To change the contents of an array by removing or replacing existing elements
    and/or adding new elements

    D) To reverse the order of the elements of the array


    **Answer:** C) To change the contents of an array by removing or replacing existing
    elements and/or adding new elements


    **Explanation:** The splice() method modifies the contents of an array in place
    and can be used to remove, replace, or add new elements to an array.


    # How do you declare an asynchronous function in JavaScript?


