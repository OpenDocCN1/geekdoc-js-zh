    **Task**: Rewrite a callback-based function to use Promises for better error handling
    and flow control.


    **Purpose**: Improve code readability and error management with Promises.


    **Initial JavaScript Code:**


    ```

    function getData(callback) {

    setTimeout(() => {

    callback(null, "Data received");

    }, 1000);

    }

