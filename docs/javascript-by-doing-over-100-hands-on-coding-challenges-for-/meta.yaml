    \ 3)); // Output: 8\nconsole.log(subtract(10, 4)); // Output: 6\n```\n\n+   -\
    \ In this example, the add and subtract functions from the math module are imported\
    \ into the main module.\n- The functions can then be used just like any other\
    \ function in the main module.\n\n# Default Exports\n\nIn addition to named exports,\
    \ a module can have a default export, which represents the main functionality\
