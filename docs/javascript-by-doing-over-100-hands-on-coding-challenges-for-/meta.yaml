    # Object Destructuring


    **Task**: Extract multiple properties from an object using object destructuring.


    **Purpose**: Simplify the extraction of multiple properties from objects.


    **JavaScript Code**:


    ```

    const person = {

    firstName: "Jane",

    lastName: "Doe",

    age: 28,

    occupation: "Engineer"

    };

    // Destructure the object

    const { firstName, lastName, age } = person;

    console.log(`${firstName} ${lastName} is ${age} years old.`); // Outputs: Jane
    Doe is 28 years old.

    ```


    **Explanation**:


    Object destructuring allows properties to be unpacked directly into variable declarations,
    making the code cleaner and easier to read, especially when working with objects
    containing multiple properties.


    # Async/Await


    **Task**: Write an async function that fetches data from an API and logs the result
    using async/await.


    **Purpose**: Demonstrate modern asynchronous JavaScript handling using async/await
    for more readable asynchronous code.


    **JavaScript Code**:


    ```

    async function fetchData() {

    try {

    const response = await fetch(''https://jsonplaceholder.typicode.com/posts/1'');

    const data = await response.json();

    console.log(data);

    } catch (error) {

    console.error("Error fetching data:", error);

    }

    }

    fetchData();

    ```


    **Explanation**:


    This example uses async/await to perform asynchronous operations in a way that
    looks synchronous, making the code much easier to follow. Error handling is managed
    with try/catch, similar to synchronous code.


