- md: "## Optimizing Loops\n\n**Task:** Optimize a loop by minimizing property accesses\
    \ and method calls within the loop.\n**Purpose:** Improve performance, especially\
    \ in scenarios involving large datasets or high-frequency operations.\n\nInitial\
    \ JavaScript Code:\n\n```javascript\nfor (let i = 0; i < document.querySelectorAll('.item').length;\
    \ i++) {\n  console.log(document.querySelectorAll('.item')[i].textContent);\n\
    }\n```\n\nRefactored JavaScript Code:\n\n```javascript\nconst items = document.querySelectorAll('.item');\n\
    const itemsLength = items.length;\nfor (let i = 0; i < itemsLength; i++) {\n \
    \ console.log(items[i].textContent);\n}\n```\n\n**Explanation:**\nBy caching the\
    \ length of the array and the DOM query result outside the loop, the browser doesn't\
    \ have to recalculate the length or re-query the DOM on each iteration, leading\
    \ to better performance.\n\n## Error Handling with Try-Catch\n\n**Task:** Implement\
    \ robust error handling in a function that might throw exceptions.\n**Purpose:**\
    \ Ensure the application remains stable and provides meaningful error information.\n\
    \n```javascript\nfunction fetchData(url) {\n  try {\n    const response = fetch(url);\n\
    \    const data = response.json();\n    console.log(data);\n  } catch (error)\
    \ {\n    console.error(\"Failed to fetch data:\", error);\n  }\n}\nfetchData(\"\
    https://api.example.com/data\");\n```\n\n**Explanation:**\nWrapping potentially\
    \ error-prone code in a try-catch block helps manage exceptions gracefully, preventing\
    \ the application from crashing and providing users with helpful error messages.\n\
    \n## Using Asynchronous Patterns Properly\n\n**Task:** Rewrite a callback-based\
    \ function to use Promises for better error handling and flow control.\n**Purpose:**\
    \ Improve code readability and error management with Promises.\n\n**Initial JavaScript\
    \ Code:**\n\n```javascript\nfunction getData(callback) {\n  setTimeout(() => {\n\
    \    callback(null, \"Data received\");\n  }, 1000);\n}\ngetData((err, data) =>\
    \ {\n  if (err) {\n    console.error(err);\n  } else {\n    console.log(data);\n\
    \  }\n});\n```\n\n**Refactored JavaScript Code:**\n\n```javascript\nfunction getData()\
    \ {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n   \
    \   resolve(\"Data received\");\n    }, 1000);\n  });\n}\ngetData()\n  .then(data\
    \ => console.log(data))\n  .catch(error => console.error(error));\n```\n\n**Explanation:**\n\
    Converting the callback-based getData function into a Promise-based approach enhances\
    \ error handling and simplifies chaining asynchronous operations. This also makes\
    \ the function more versatile and easier to integrate with other Promise-based\
    \ code.\n\n## Multiple Choice Quiz Questions\n\n**Why is it recommended to use\
    \ const for variables that do not change?**\n\n- A) It makes the code run faster.\n\
    - B) It prevents accidental reassignment of variables.\n- C) It reduces the amount\
    \ of memory used.\n- D) It is a requirement in modern JavaScript.\n\n**Answer:**\
    \ B) It prevents accidental reassignment of variables.\n**Explanation:** Using\
    \ const ensures that once a variable is assigned, its value cannot be changed\
    \ unintentionally, promoting safer and more predictable code.\n\n**What is the\
    \ benefit of modularizing code into smaller functions?**\n\n- A) It decreases\
    \ the memory usage of the application.\n- B) It increases the execution speed\
    \ of the program.\n- C) It enhances readability and reusability of the code.\n\
    - D) It automatically handles all exceptions.\n\n**Answer:** C) It enhances readability\
    \ and reusability of the code.\n**Explanation:** Breaking code into smaller, function-based\
    \ modules makes it easier to read, maintain, and reuse, facilitating better software\
    \ design.\n\n**What is a key performance optimization technique for loops in JavaScript?**\n\
    \n- A) Placing all loop content in a single line.\n- B) Minimizing property accesses\
    \ and method calls inside loops.\n- C) Using only for loops instead of while or\
    \ forEach.\n- D) Looping in reverse order.\n\n**Answer:** B) Minimizing property\
    \ accesses and method calls inside loops.\n**Explanation:** Reducing the number\
    \ of property accesses and method calls within loops decreases the computational\
    \ overhead in each iteration, improving performance.\n\n**What is the advantage\
    \ of using try-catch for error handling?**\n\n- A) It compiles the code faster.\n\
    - B) It allows developers to handle errors locally where they occur.\n- C) It\
    \ increases the security of the application.\n- D) It prevents users from seeing\
    \ any errors.\n\n**Answer:** B) It allows developers to handle errors locally\
    \ where they occur.\n**Explanation:** Try-catch blocks enable developers to manage\
    \ exceptions directly within the code where errors might occur, allowing for more\
    \ controlled and graceful error handling.\n\n**How do Promises improve handling\
    \ asynchronous operations compared to traditional callbacks?**\n\n- A) Promises\
    \ allow synchronous execution of asynchronous code.\n- B) Promises provide better\
    \ control flow and error handling.\n- C) Promises eliminate all potential for\
    \ errors in asynchronous code.\n- D) Promises speed up the execution of asynchronous\
    \ functions.\n\n**Answer:** B) Promises provide better control flow and error\
    \ handling.\n**Explanation:** Promises simplify the management of asynchronous\
    \ operations by providing a cleaner and more robust way to chain operations and\
    \ handle errors, compared to the nested structure often created with callbacks\
    \ (callback hell).\n\n**What is the primary use of the console.log() function\
    \ in JavaScript?**\n\n- A) To log errors to the console.\n- B) To display information\
    \ in the browser's console.\n- C) To log user input.\n- D) To debug HTML code.\n\
    \n**Answer:** B) To display information in the browser's console.\n**Explanation:**\
    \ console.log() is a JavaScript function that outputs a message to the web console.\
    \ It is useful for testing purposes or to debug by printing out values of variables\
    \ or other informational messages.\n\n**Which operator is used to check both value\
    \ and type in a comparison?**\n\n- A) ==\n- B) =\n- C) ===\n- D) !=\n\n**Answer:**\
    \ C) ===\n**Explanation:** The === operator, known as the strict equality operator,\
    \ compares both the value and type of two operands, ensuring that both are identical\
    \ without any type coercion.\n\n**What would be the output of the following code\
    \ snippet?**\n\n```javascript\nlet x = [10, 20, 30, 40, 50];\nconsole.log(x[2]);\n\
    ```\n\n- A) 10\n- B) 20\n- C) 30\n- D) undefined\n\n**Answer:** C) 30\n**Explanation:**\
    \ Arrays in JavaScript are zero-indexed. So x[2] refers to the third element in\
    \ the array, which is the number 30.\n\n**Which statement creates a new object\
    \ in JavaScript?**\n\n- A) let obj = ();\n- B) let obj = {}\n- C) let obj = []\n\
    - D) let obj = //\n\n**Answer:** B) let obj = {}\n**Explanation:** In JavaScript,\
    \ curly braces {} are used to create a new object, which is a collection of key-value\
    \ pairs.\n\n**What is the purpose of the Array.prototype.map() method?**\n\n-\
    \ A) To loop through an array's items.\n- B) To check if any items in an array\
    \ pass a test.\n- C) To create a new array with the results of calling a function\
    \ for every array element.\n- D) To merge two or more arrays.\n\n**Answer:** C)\
    \ To create a new array with the results of calling a function for every array\
    \ element.\n**Explanation:** The map() method creates a new array populated with\
    \ the results of calling a provided function on every element in the calling array.\n\
    \n**What keyword is used to declare a variable whose value can't be reassigned?**\n\
    \n- A) let\n- B) var\n- C) const\n- D) static\n\n**Answer:** C) const\n**Explanation:**\
    \ The const keyword is used to declare a block-scoped variable that cannot be\
