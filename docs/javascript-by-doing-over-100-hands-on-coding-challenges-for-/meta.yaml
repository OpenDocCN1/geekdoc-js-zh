    assign a function to a variable. Function expressions can be anonymous; they do
    not need to have a name.


    ```

    const greet = function(name) {

    console.log("Hello, " + name + "!");

    };

    ```


    Calling a Function Expression:


    ```

    greet("Alice"); // Outputs: "Hello, Alice!"

    ```


    Function expressions are useful because they allow you to create functions at
    runtime, assign them to variables, and pass them around as arguments to other
    functions.


    Each of these function types and behaviors allows JavaScript developers to create
    flexible, modular, and reusable code. Understanding when and how to use each type
    can significantly enhance your ability to write effective JavaScript code.


    # Coding Exercises on JavaScript Functions


    Functions: Definition, invocation, parameters, return values, and scope. Here''s
    a detailed set of coding exercises and multiple-choice quiz questions focusing
    on JavaScript functions, including their definition, invocation, parameters, return
    values, and scope.


    # Basic Function Definition and Invocation


    Task: Write a JavaScript function named greet that prints "Hello, World!" to the
    artistry-1.stg.dev.autodesk.com console.


    Purpose: Learn how to define and call a simple function.


    Sample Code:


    ```

    function greet() {

    console.log("Hello, World!");

    }

    greet(); // Function invocation

    ```


    Explanation:


    This exercise demonstrates the basic structure of a function in JavaScript. The
    greet function is defined using the function keyword followed by the name of the
    function. It encapsulates a console log statement and is called (invoked) by its
    name followed by parentheses.


    # Function with Parameters


    Task: Define a function named add that takes two parameters and returns their
    sum.


    Purpose: Practice writing functions that take parameters and understand how to
    return a value.


    Sample Code:'
