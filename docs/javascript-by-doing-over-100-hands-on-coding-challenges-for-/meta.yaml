  md: '# # Modern JavaScript Features


    # ## Template Literals


    Template literals provide a more flexible and readable way to work with strings
    in JavaScript. They allow embedding expressions directly within strings and support
    multiline strings.


    Example: Template Literals


    ```

    const name = ''John'';

    const age = 30;

    const greeting = `Hello, my name is ${name} and I am ${age} years old.`;

    console.log(greeting);

    ```


    +   - In this example, the ${} syntax within backticks (`) allows embedding variables
    directly into the string.

    - Template literals support multiline strings without needing to concatenate multiple
    strings or use escape characters.


    # ## Arrow Functions


    Arrow functions provide a more concise syntax for defining functions, especially
    for simple one-liners. They also inherit the lexical scope from the surrounding
    code.


    Example: Arrow Functions


    ```

    const add = (a, b) => a + b;

    const greet = name => `Hello, ${name}!`;

    console.log(add(2, 3)); // Output: 5

    console.log(greet(''Alice'')); // Output: Hello, Alice!

    ```


    +   - Arrow functions are defined using the (parameters) => expression syntax.

    - They have an implicit return if there''s only one expression, which makes them
    concise for simple functions.


    # ## let and const


    let and const are block-scoped variable declarations introduced in ES6. let allows
    reassignment, while const declares a constant value.


    Example: let and const


    ```

    let count = 0;

    count = 1;

    const PI = 3.14;

    ```


    +   - let allows variables to be reassigned after declaration, while const variables
    cannot be reassigned after initialization.

    - Both let and const are block-scoped, meaning they are only accessible within
    the block in which they are defined.


