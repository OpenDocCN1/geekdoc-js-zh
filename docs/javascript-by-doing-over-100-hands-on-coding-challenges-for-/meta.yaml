    ## 多项选择测验问题


    **JavaScript 的 Promise 代表什么？**


    - A) 一组可能不按顺序执行的函数。

    - B) 一个可能尚不可用的单一未来值。

    - C) 异步操作的循环机制。

    - D) 一个同步回调函数。


    **正确答案**：B) 一个可能尚不可用的单一未来值。


    **解释**：JavaScript 中的 Promise 代表一个可能尚不可用，但将在未来某个时间点解决的值。


    **哪个方法用于在 Promise 解决或拒绝后执行代码？**


    - A) Promise.then()

    - B) Promise.catch()

    - C) Promise.finally()

    - D) Promise.resolve()


    **正确答案**：C) Promise.finally()


    **解释**：finally() 方法返回一个 Promise。当 Promise 定案（settled），即已履行或被拒绝时，将执行指定的回调函数。这提供了一种方式，无论
    Promise 是成功履行还是被拒绝，都可以运行代码。


