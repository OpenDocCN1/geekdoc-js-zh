    A) Synchronous blocking behavior

    B) Dependency on external libraries

    C) Asynchronous non-blocking behavior

    D) Incompatibility with modern JavaScript development

    Correct Answer: C) Asynchronous non-blocking behavior

    **Explanation:** setTimeout is used to illustrate how JavaScript handles asynchronous
    execution,'
