    ```


    **What will be the result of the following JavaScript code?**

    A) 2.5

    B) 1

    C) 5

    D) 2

    Correct Answer: B) 1

    **Explanation:** The % operator returns the remainder of the division of x by
    y. Since 5 divided by 2 equals 2 with a remainder of 1, the result is 1.


    **Which operator is used to assign a value to a variable in JavaScript?**

    A) ==

    B) =

    C) ===

    D) !=

    Correct Answer: B) =

    **Explanation:** The single equals sign = is the assignment operator, used to
    set the value of a variable.


    ## **Which of the following statements about let and const is true?**


    - A) Variables declared with let or const are hoisted to the top of the block.

    - B) let allows reassignment while const does not.

    - C) let and const are function-scoped.

    - D) const variables can be declared without initialization.


    **Answer:** B) let allows reassignment while const does not.

    **Explanation:** Variables declared with let can be reassigned, but const is used
    for declaring variables meant to remain constant. Both are block-scoped, not function-scoped,
    and const must be initialized at the time of declaration.


    ## **What does the this keyword refer to within an arrow function?**


    - A) The function itself

    - B) The global object

    - C) The parent scope where the arrow function was defined

    - D) The first argument passed to the function


    **Answer:** C) The parent scope where the arrow function was defined

    **Explanation:** Arrow functions do not have their own this context but inherit
    this from the parent scope at the time they are defined.


    ## **In JavaScript, what is a Promise?**


    - A) A function that defers execution until a condition is met

    - B) An object representing the eventual completion or failure of an asynchronous
    operation

    - C) A callback function used for asynchronous operations

    - D) A data structure for storing multiple values


    **Answer:** B) An object representing the eventual completion or failure of an
    asynchronous operation

    **Explanation:** A Promise is an object that encapsulates the result of an asynchronous
    operation, allowing for more manageable asynchronous code.


    ## **Which statement correctly adds an event listener in JavaScript?**


