  md: "# Conditional Statements\n\nJavaScript supports several types of conditional\
    \ statements:\n\n+   - if statement: Executes a block of code if the specified\
    \ condition is true.\n- else statement: Executes a block of code if the condition\
    \ in the if statement is false.\n- else if statement: Specifies a new condition\
    \ to test, if the first condition is false.\n- switch statement: Specifies many\
    \ alternative blocks of code to be executed.\n\nThe if-else statement is the fundamental\
    \ control structure that allows JavaScript to make decisions. The syntax is:\n\
    \n```\nif (condition) {\n  // Code to execute if the condition is true\n} else\
    \ {\n  // Code to execute if the condition is false\n}\n```\n\ncondition: This\
    \ can be any expression that evaluates to true or false. If the condition is true,\
    \ the code inside the if block runs; otherwise, the code inside the else block\
    \ runs.\n\nWhen you have multiple conditions to evaluate, you can use an \"else\
    \ if\" ladder, which is a series of if statements that are checked in sequence.\n\
    \n```\nif (condition1) {\n  // Code runs if condition1 is true\n} else if (condition2)\
    \ {\n  // Code runs if condition1 is false and condition2 is true\n} else {\n\
    \  // Code runs if all preceding conditions are false\n}\n```\n\ncondition1, condition2,\
    \ etc.: These are evaluated in order until one is found to be true. Once a true\
    \ condition is found, its associated block of code runs, and the rest of the conditions\
    \ are not evaluated.\n\nThe modulus operator returns the remainder of a division\
    \ of two numbers. It is frequently used to check if a number is even or odd:\n\
    \n```\nif (number % 2 === 0) {\n  console.log(\"The number is even.\");\n} else\
    \ {\n  console.log(\"The number is odd.\");\n}\n```\n\nnumber % 2: This operation\
    \ checks the remainder when number is divided by 2. An even number has no remainder\
    \ (0), while an odd number has a remainder of 1."
