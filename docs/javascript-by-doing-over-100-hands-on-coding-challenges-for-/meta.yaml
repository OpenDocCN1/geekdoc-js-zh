    \ 用于退出 switch 代码块，一旦找到匹配项就停止后续 case 的执行。\n\n这些练习和问题提供了对 JavaScript 控制结构和数据处理的实践与理论见解，为更高级的编程概念奠定了坚实的基础。\n\
    \n## 条件语句\n\nJavaScript 支持多种类型的条件语句：\n\n- if 语句：如果指定条件为真，则执行一段代码块。\n- else 语句：如果\
    \ if 语句中的条件为假，则执行一段代码块。\n- else if 语句：如果第一个条件为假，则指定一个要测试的新条件。\n- switch 语句：指定多个要执行的代码块备选项。\n\
    \nif-else 语句是允许 JavaScript 做出决策的基本控制结构。其语法如下：\n\n```\nif (condition) {\n  // 如果条件为真，则执行此处的代码\n\
    } else {\n  // 如果条件为假，则执行此处的代码\n}\n```\n\ncondition（条件）：可以是任何计算结果为 true 或 false\
    \ 的表达式。如果条件为真，则运行 if 代码块内的代码；否则，运行 else 代码块内的代码。\n\n当您有多个条件需要评估时，可以使用“else if”阶梯，即一系列按顺序检查的\
    \ if 语句。\n\n```\nif (condition1) {\n  // 如果 condition1 为真，则运行此处的代码\n} else if\
