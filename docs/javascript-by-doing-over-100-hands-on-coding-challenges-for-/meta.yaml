    \ {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json'\n\
    \  },\n  body: JSON.stringify({\n    title: 'foo',\n    body: 'bar',\n    userId:\
    \ 1\n  })\n})\n.then(response => response.json())\n.then(data => console.log('Created:',\
    \ data))\n.catch(error => console.error('Error posting data:', error));\n```\n\
    \n**Explanation:** This code uses the POST method to send new data to the server.\
    \ The headers specify that the request body format is JSON. The response is then\
    \ processed and logged, showcasing how to create new data entries on the server.\n\
    \n### Updating Data with PUT\n\n**Task:** Update existing data on a server.\n\n\
    **Purpose:** Understand how to use the PUT method to update a resource completely.\n\
    \n**JavaScript Code:**\n\n```\nfetch('https://jsonplaceholder.typicode.com/posts/1',\
