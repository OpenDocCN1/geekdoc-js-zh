    \n- A) function() {...}();\n- B) (function() {...})();\n- C) immediately function()\
    \ {...};\n- D) function() {...} immediate;\n\n**答案**：B) (function() {...})();\n\
    \n**解析**：语法 `(function() {...})();` 定义了一个立即执行函数表达式（IIFE），它在定义后立即运行。\n\n**以下 JavaScript\
    \ 代码会输出什么？**\n\n```\nlet arr = ['a', 'b', 'c', 'd', 'e'];\narr.slice(2, 4);\n\
    console.log(arr);\n```\n\n- A) ['c', 'd']\n- B) ['a', 'b', 'c', 'd']\n- C) ['a',\
