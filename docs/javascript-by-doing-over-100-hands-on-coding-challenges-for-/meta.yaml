    # Multiple Choice Quiz Questions


    **What does the event.preventDefault() method do when called inside an event handler
    function?**


    +   A) It stops the browser from executing the default action associated with
    the event.

    B) It prevents the event from propagating or bubbling up to parent elements.

    C) It cancels the event entirely, not allowing other handlers to execute.

    D) It resets the event''s default properties.


