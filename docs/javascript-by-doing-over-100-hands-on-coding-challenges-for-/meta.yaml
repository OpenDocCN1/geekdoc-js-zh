    );\n  }\n});\n</script>\n```\n\n**解释：**\nkeypress 事件监听器附加到输入框。它使用 event 对象检查按下的键是否为\
    \ \"Enter\" 键，如果是，则触发警告。\n\n### 表单提交事件\n\n**任务：** 处理表单提交事件以阻止默认表单提交，并在 div 中显示表单数据。\n\
    **目的：** 使用 JavaScript 操作表单行为并处理数据输入。\nHTML + JavaScript Code：\n\n```\n<form id=\"\
    myForm\">\n  <input type=\"text\" name=\"username\" placeholder=\"Enter your name\"\
    >\n  <button type=\"submit\">Submit</button>\n</form>\n<div id=\"result\"></div>\n\
    <script>\n  document.getElementById('myForm').addEventListener('submit', function(event)\
    \ {\n    event.preventDefault();\n    let name = this.elements['username'].value;\n\
    \    document.getElementById('result').textContent = \"Hello, \" + name;\n  });\n\
    </script>\n```\n\n**解释：**\n此代码阻止表单的默认提交，从而阻止页面重新加载。然后获取表单中输入的名称，并将其显示在 div 中，展示了基本的表单处理和\
    \ DOM 操作。\n\n### 选择元素的更改事件\n\n**任务：** 为下拉菜单（select 元素）附加一个 change 事件监听器，用用户的选择更新段落。\n\
    **目的：** 使用 change 事件来对下拉菜单中的用户选择作出响应。\nHTML + JavaScript Code：\n\n```\n<select\
    \ id=\"mySelect\">\n<option value=\"Apple\">Apple</option>\n<option value=\"Banana\"\
    >Banana</option>\n<option value=\"Cherry\">Cherry</option>\n</select>\n<p id=\"\
    selectedFruit\">Selected fruit will appear here</p>\n<script>\ndocument.getElementById('mySelect').addEventListener('change',\
    \ function() {\nlet selectedValue = this.value;\ndocument.getElementById('selectedFruit').textContent\
    \ = \"You selected: \" + selectedValue;\n});\n</script>\n```\n\n**解释：**\n当用户从下拉菜单中选择一个选项时，会触发\
    \ change 事件。事件监听器然后更新段落元素以显示所选选项，展示了与用户输入的实时交互。\n\n### 多项选择测验题\n\n**当在事件处理函数内部调用时，event.preventDefault()\
    \ 方法有什么作用？**\n\n+   A) 阻止浏览器执行与事件关联的默认操作。\nB) 阻止事件传播或冒泡到父元素。\nC) 完全取消事件，不允许其他处理程序执行。\n\
    D) 重置事件的默认属性。\n\n正确答案：A) 阻止浏览器执行与事件关联的默认操作。\n**解释：** event.preventDefault() 用于阻止浏览器对该事件采取的默认操作，例如跟随\
    \ `<a href=\"...\">` 中的链接。\n\n**要检测用户何时将鼠标移到元素上，应使用哪种事件类型？**\n\n+   A) click\n\
    B) mouseover\nC) mousemove\nD) mouseenter\n\n正确答案：B) mouseover\n**解释：** 当鼠标指针进入元素及其后代时，会触发\
    \ mouseover 事件。mouseenter 也是一个有效的答案，但未在此处列出作为选项。\n\n**如何附加一个只运行一次的事件监听器？**\n\n\
    +   A) 使用带有 { once: true } 选项的 addEventListener 方法。\nB) 在处理程序内部手动移除事件监听器。\nC)\
    \ 使用 one 方法代替 addEventListener。\nD) 设置一个全局变量来跟踪事件是否已运行。\n\n正确答案：A) 使用带有 { once:\
    \ true } 选项的 addEventListener 方法。\n**解释：** addEventListener 的 { once: true } 选项允许事件只执行一次。\n"
