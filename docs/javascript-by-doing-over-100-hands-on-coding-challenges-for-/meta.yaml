- md: " ```\n// Import the area function from rectangle.js\nimport { area } from './rectangle.js';\n\
    // Use the imported function\nconsole.log(\"Area of rectangle:\", area(5, 3));\
    \ // Outputs: Area of rectangle: 15\n```\n\n```\n**rectangle.js**\n// Define and\
    \ export the area function\nexport function area(width, height) {\n    return\
    \ width * height;\n    }\n```\n\n**Explanation:**\nThis script demonstrates how\
    \ to import a function from a module using curly braces {} and use it just like\
    \ any locally defined function. This separation of concerns aids in maintaining\
    \ cleaner code.\n\n## Default Exports\n\n**Task:** Create a module that has a\
    \ default export of a class.\n**Purpose:** Understand the usage of default exports\
    \ in modules.\n\n```\nJavaScript Code (User.js):\n// Define a User class and export\
    \ it as default\nexport default class User {\nconstructor(name, age) {\nthis.name\
    \ = name;\nthis.age = age;\n}\ngreet() {\nreturn `Hello, my name is ${this.name}\
    \ and I am ${this.age} years old.`;\n}\n}\n// main.js\nimport User from './User.js';\n\
    // Create a new instance of the User class\nconst user = new User('John', 30);\n\
    // Call the greet method\nconsole.log(user.greet()); // Output: Hello, my name\
    \ is John and I am 30 years old.\n```\n\n**Explanation:**\nThe User class is exported\
    \ as the default export of the module. Default exports are useful when a module\
    \ is intended to export a single main functionality, such as a class or a library.\n\
    \n## Importing a Default Export\n\n**Task:** Import the default User class from\
    \ its module and create an instance.\n**Purpose:** Learn to import a default export\
    \ from a module.\n\n```\nJavaScript Code (app.js):\n// Import the default export\
    \ from User.js\nimport User from './User.js';\n```\n\n```\n// Create an instance\
    \ of User\nconst newUser = new User(\"John Doe\", 30);\nconsole.log(newUser.greet());\
    \ // Outputs: Hello, my name is John Doe and I am 30 years old.\n```\n\n**Explanation:**\n\
    This script imports the User class (a default export) and uses it to create a\
    \ User object. It showcases how default exports are imported without curly braces.\n\
    \n## Renaming Imports and Exports\n\n**Task**: Import specific functions from\
    \ a module and rename them for local use.\n**Purpose**: Learn to use aliases in\
    \ import statements.\n\nJavaScript Code (utilities.js):\n\n```\nexport function\
    \ add(x, y) {\nreturn x + y;\n}\nexport function subtract(x, y) {\nreturn x -\
    \ y;\n}\n```\n\nJavaScript Code (calc.js):\n\n```\n// Import with renaming\nimport\
    \ { add as addition, subtract as subtraction } from './utilities.js';\nconsole.log(\"\
    Addition result:\", addition(10, 5)); // Outputs: Addition result: 15\nconsole.log(\"\
    Subtraction result:\", subtraction(10, 5)); // Outputs: Subtraction result: 5\n\
    ```\n\n**Explanation:**\nThis exercise shows how to rename imports to avoid naming\
    \ conflicts or to provide more context in the local scope. It's particularly useful\
    \ in large projects where name clashes are possible.\n\n## Multiple Choice Quiz\
    \ Questions\n\n**What is the main purpose of using export in a JavaScript module?**\n\
    \n- A) To load functions from another module\n- B) To share code across different\
    \ files\n- C) To increase performance\n- D) To secure the code\n\n**Correct Answer:\
    \ B) To share code across different files**\n**Explanation:** The export statement\
    \ is used in JavaScript modules to make parts of a module available for use in\
    \ other files.\n\n**Which statement correctly imports a default export from a\
