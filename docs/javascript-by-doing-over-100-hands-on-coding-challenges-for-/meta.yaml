    \ deleted successfully');\n  } else {\n    console.error('Failed to delete data');\n\
    \  }\n})\n.catch(error => console.error('Error deleting data:', error));\n```\n\
    \n- In this example, the fetch function is used to make a DELETE request to delete\
    \ the resource identified by the URL (https://api.example.com/data/123).\n- The\
    \ method option is set to 'DELETE'.\n- The response.ok property is checked to\
    \ determine if the request was successful.\n\nUnderstanding HTTP methods is essential\
