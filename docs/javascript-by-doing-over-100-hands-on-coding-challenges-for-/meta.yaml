    # Immediately Invoked Function Expression (IIFE)


    An IIFE is a function that runs as soon as it is defined. It is a design pattern
    which is also used to create a new scope, isolating the function from the global
    scope.


    Example: Using an IIFE


    ```

    (function() {

    let message = "IIFE Example";

    console.log(message);

    })();

    ```


    This function executes immediately upon its definition. The variables inside the
    IIFE (like message) do not pollute the global scope.


    # Using Arrow Function to Simplify Code


    Arrow functions can make code cleaner and more readable, especially when dealing
    with functions that require only a single operation.


    Example: Simplifying with Arrow Functions


    ```

    let numbers = [1, 2, 3, 4, 5];

    let squares = numbers.map(number => number * number); // Uses arrow function


    console.log(squares); // Output: [1, 4, 9, 16, 25]

    ```


    Here, an arrow function is used with the map method to create a new array containing
    the squares of the numbers in the original array. This approach is much cleaner
    compared to using a traditional function expression.


    Understanding these advanced functions enhances your ability to write more concise,
    efficient, and readable JavaScript code. These functions are particularly useful
    in modern JavaScript frameworks and libraries, where functional programming patterns
    are prevalent.


