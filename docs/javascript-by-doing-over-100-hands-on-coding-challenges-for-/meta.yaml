- md: " const to declare variables:\n\n- var is the oldest keyword, with function\
    \ scope.\n- let introduces block scope, better controlling the variable's lifetime.\n\
    - const is like let but for constants, which means the value assigned to a const\
    \ variable cannot be changed.\n\n## Exercise: Working with Variables\n\nHere's\
    \ how variables are declared and used in JavaScript:\n\n```\nlet message = \"\
    Hello, World!\"; // Declares a variable that can be changed\nconst PI = 3.14159;\
    \          // Declares a constant whose value cannot be changed\nvar age = 30;\
    \                // Declares a variable with function scope\n```\n\n## Common\
    \ Data Types\n\nJavaScript variables can store different types of values, each\
    \ of which behaves differently:\n\n- String: Represents textual data, e.g., \"\
    Alice\".\n- Number: An integer or a floating-point number, e.g., 25 or 3.14.\n\
    - Boolean: Represents a logical entity and can have two values: true or false.\n\
    - Null: An assignment value that represents no value or a null value.\n- Undefined:\
    \ A variable that has been declared but not assigned a value is automatically\
    \ assigned the value undefined.\n- Object: Collections of properties, can be seen\
    \ as a collection of key-value pairs. Arrays in JavaScript are a type of object.\n\
    - Array: A global object that is used in the construction of arrays; a high-level\
    \ list-like object.\n\n## Exercise: Exploring Data Types\n\nHere's how to demonstrate\
    \ different data types in JavaScript:\n\n```\nlet name = \"Alice\";\nlet age =\
    \ 25;\nlet isStudent = true;\nlet address = null;\nlet definition;\nconsole.log(typeof\
    \ name);        // Outputs \"string\"\nconsole.log(typeof age);         // Outputs\
    \ \"number\"\nconsole.log(typeof isStudent);   // Outputs \"boolean\"\nconsole.log(typeof\
    \ address);     // Outputs \"object\" because `null` is treated as an object\n\
    console.log(typeof definition);  // Outputs \"undefined\"\n```\n\n## Basic Conditional\
    \ Logic\n\n### Introduction to if Statements\n\nThe if statement is used to execute\
    \ a statement or block of code if a specified condition is true. It can be paired\
    \ with else and else if to handle multiple conditions and provide alternate execution\
    \ paths.\n\n## Exercise: Using Conditional Logic\n\nHere's an example showing\
    \ how to use conditional logic based on the value of a variable:\n\n```\nlet score\
    \ = 85;\nif (score >= 90) {\n  console.log(\"Excellent\");\n} else if (score >=\
    \ 80) {\n  console.log(\"Good\");\n} else {\n  console.log(\"Needs Improvement\"\
    );\n}\n```\n\n## Combining Strings\n\nConcatenating strings can be done using\
    \ the + operator or template literals (backticks), which allow for embedded expressions.\n\
    \n## Exercise: Create a Greeting\n\nHere's how you can use both methods to concatenate\
    \ strings:\n\n```\nlet user = \"Alice\";\nlet greeting = \"Hello, \" + user +\
    \ \"! Welcome to JavaScript.\"; // Using the + operator\nconsole.log(greeting);\n\
    console.log(`Hello, ${user}! Welcome to JavaScript.`); // Using template literals\n\
    ```\n\n## Coding Exercises\n\n### Hello, JavaScript!\n\n**Task**: Write a JavaScript\
    \ program that prints \"Hello, JavaScript!\" to the console.\n\n**Purpose**: Familiarize\
    \ with basic output in JavaScript.\n\n**Sample Code**:\n\n```\nconsole.log(\"\
    Hello, JavaScript!\");\n```\n\n**Explanation**:\n\nThis exercise introduces you\
    \ to the console.log() method, which is used to print any message you want to\
    \ the console. Here, the message \"Hello, JavaScript!\" is displayed in the console,\
    \ demonstrating the simplest way to output information in JavaScript.\n\n### Variable\
    \ Assignments\n\n**Task**: Declare two variables, a and b. Assign 5 to a and 6\
    \ to b. Then create a third variable c that holds the sum of a and b. Print c\
    \ to the console.\n\n**Purpose**: Practice declaring variables and performing\
    \ arithmetic operations.\n\n**Sample Code**:\n\n```\nlet a = 5;\nlet b = 6;\n\
    let c = a + b;\nconsole.log(c);\n```\n\n**Explanation:**\n\nThis exercise introduces\
    \ variable declarations using let, which is a keyword used to declare variables\
    \ that can have block scope and be reassigned. Here, a and b are assigned numerical\
    \ values, which are then added together and assigned to c. Finally, c is printed\
    \ to the console, showing the result of the arithmetic operation.\n\n## Data Type\
    \ Exploration\n\n**Task:** Create variables of different data types: number, string,\
    \ boolean, null, and undefined. Use the typeof operator to print the type of each\
    \ variable to the console.\n\n**Purpose:** Understand different data types and\
    \ the typeof operator.\n\n**Sample Code:**\n\n```\nlet number = 42;\nlet string\
    \ = \"JavaScript\";\nlet boolean = true;\nlet nothing = null;\nlet undefinedVariable;\n\
    console.log(typeof number); // \"number\"\nconsole.log(typeof string); // \"string\"\
    \nconsole.log(typeof boolean); // \"boolean\"\nconsole.log(typeof nothing); //\
    \ \"object\" (quirk in JavaScript)\nconsole.log(typeof undefinedVariable); //\
    \ \"undefined\"\n```\n\n**Explanation:**\n\nThis exercise explores different data\
    \ types in JavaScript. typeof is an operator used to determine the type of a variable.\
    \ This is useful for debugging or to ensure variables are of expected types before\
    \ they are manipulated in functions or conditions.\n\n## Basic Conditional Logic\n\
    \n**Task:** Write a JavaScript program that uses a conditional statement to check\
    \ if a number stored in a variable is even. If it is, print \"The number is even\"\
    \ to the console.\n\n/command"
