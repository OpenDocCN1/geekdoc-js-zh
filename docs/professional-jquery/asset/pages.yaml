  md: '# UNDERSTANDING NUMBERS


    Like any other programming, JavaScript manipulates values such as numbers or text.
    The kinds of values a language can work with is its data types. JavaScript supports
    the basic types of number and string. All numbers are 64-bit double-precision,
    and range from -5e324 to 1.7976931482315e308. In other words, there''s no difference
    between integers and floating-point numbers; they are just numbers. The following
    example uses the typeof operator to


    +   > typeof 1;

    > typeof 1.5;


    > Code snippet is from typeof.txt


    All JavaScript numbers are represented in binary as IEEE-754 Doubles. Also that
    means you should apply some caution when doing arithmetic. For example, if you
    are summing two number values in your, representing a currency operation, you
    may get very unexpected results, as shown in the following:


    +   > .1 + .2

    0.30000000000000004


    > Code snippet is from unexpected-addition.txt


    Unfortunately, JavaScript has no built-in decimal type. The language offers two
    methods on Number, toPrecision and toFixed, which will format a number using a
    fixed number of decimal places. The following code shows both action.


    ```

    >var num = 1234.12345123;

    >num.toFixed(2);

    1234.12


    var num2 = 1234.12345123 ;

    num2.toPrecision(8);

    1234.1235

    ```


    > Code snippet is from decimal.txt


    If you use a number, or obtain a result, out of the 64-bit range, JavaScript returns
    a special number called Infinity, or -Infinity. Division by zero returns Infinity.
    There is one more special value, NaN, meaning "Not a Number" is a "toxic value"
    that is often the source of bugs.


    NaNs occur when attempting to cast an invalid string object to a number. It has
    a viral nature; when performing an operation between numbers and a NaN returns
    a NaN. You can test if a variable is a NaN by using the built-in isNaN() function.'
