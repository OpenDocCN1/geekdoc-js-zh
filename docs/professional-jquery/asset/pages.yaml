    \ remove an item from a\nqueue and execute it. The code sample shows a simplified\
    \ example of a manual usage\nqueue and dequeue. A second animation is added to\
    \ the queue, and is then pulled off the stack and\nexecuted with dequeue.\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\" src=\"\
    //code.jquery.com/jquery-1.7.1.js\"></script>\n  <style type=\"text/css\">\n#animation\
    \ {\n  width:200px;\n  height:200px;\n  background:#ccc;\n}\n</style>\n  <script\
    \ type=\"text/javascript\">\n  $.ready(function() {\n    $('#animation').show(\"\
    slow\");\n    $('#animation').queue(function () {\n      $(this).animate({width:'+400px'},1000);\n\
    \      $(this).dequeue();\n    });\n  });\n  </script>\n</head>\n<body>\n  <div\
    \ id=\"animation\" style=\"display:none\"></div>\n</body>\n</html>\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_69_0.png)\n\
    \nCode snippet from queue-and-dequeue.txt\n\n# Strings\n\nThere is just one utility\
