  md: "```\nstart();\n\n});\n\n});\n```\n\n> Code snippet is from mockjax.html\n\n\
    Even without an Internet connection or a completed data service, the test will\
    \ pass. This allows you to test your code without worrying about the state of\
    \ the other parts of the system. If you're working in a large team, this ability\
    \ to write and test to an interface without the interface existing is invaluable.\n\
    Figure 14-11 shows a completed test using mockjax.\n\n![](img/16459f9d4793f783ab42cec76c544db0_318_0.png)\n\
    \nFIGURE 14-11\n\n# Additional Mockjax Features\n\nBecause web development needs\
    \ to handle more than just a simple, successful JSON request, you'll be glad to\
    \ know that Mockjax has features to handle most Ajax situations. While exploring\
    \ them in full will let you know never what you might have to accommodate in testing,\
    \ but the two that are worth looking at off the bat.\n\n# Using a Mockjax Data\
    \ Proxy\n\nOne nice feature is the ability to create a data proxy. Listing out\
    \ a couple of data elements when setting up a simple test is convenient, but if\
    \ you're trying to test a full interface, it can be awkward to wrap a large data\
    \ structure inside the plugin setup caf. If this fix, Mockjax has an option to\
    \ set a data proxy, which will point to a static file to serve as the data source\
    \ for your Ajax request. All it takes, other than having the file itself, is to\
    \ add an optional proxy parameter when the plugin is set up. The simplest possible\
    \ example would look like this:\n\n```\n$.mockjax{\n  url: '/data/json',\n  proxy:\
    \ '/mock/data/json'\n});\n```\n\nDo that you can use complicated data structures\
    \ without worrying about embedding them directly in your testing framework. You\
    \ do need to have access to JSON.stringify, which may require the use of json2.js\
    \ (https://github.com/douglasrockford/JSON-js) if you're going to be testing in\
    \ legacy browsers."
