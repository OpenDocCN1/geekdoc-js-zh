  md: "The first two methods are Deferred.done and Deferred.fail.\n\nDeferred.done\
    \ accepts a single function or array of functions to fire when a promise is resolved\
    \ successfully.\n\nDeferred.fail also accepts a function or array of functions.\
    \ It fires when a promise is rejected.\n\nAs a note, if an argument is passed\
    \ to $.when and it is not a Deferred, it is treated as a resolved Deferred. If\
    \ no other Deferred objects are passed to $.when, then Deferred.done fires.\n\n\
