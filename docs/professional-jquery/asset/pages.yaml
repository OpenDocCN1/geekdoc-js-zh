  md: 'The final piece is an HTML document with a body tag with a class and an id
    that correspond to site features or features mapped out in the object literal:


    ```

    <body id="settings" class="dashboard">

    ```


    Putting them all together would fire events in the following order:


    +   - myApp.common.init()

    - myApp.dashboard.init()

    - myApp.dashboard.settings()

    - myApp.common.settings()


    This pattern can expand beyond the single class shown in the previous example.
    Multiple classes can be strung, which allows multiple features to fire automatically.
    This is especially cool because it''s in place, it allows JavaScript features
    to be initialized without having to touch a line of JavaScript code. An engineer
    working in PHP or Java can simply apply a class to a page and know that the proper
    initialization code for a module will


    # Using HTML5 Data Attributes Instead of CSS Classes and IDs


    Jason Barber''s variation is very similar, with the key difference that it uses
    HTML5 data attributes to trigger the execution.


    If you''re unfamiliar with them, HTML5 data attributes are defined methods for
    storing custom data in HTML attributes. Application developers have long string
    data in custom attributes, which is a case of the Web Hypertext Application Technology
    Working Group (WHATWG) “paving the cowpaths” andizing common developer behavior.
    The benefit of standardization is that the data-prefix allows for predictable
    access to custom attributes. You learn more about that in an upcoming section,
    but for now, you see the difference in the body tag:


    ```

    <body data-controller="dashboard" data-action="render">

    ```


    Instead of CSS classes and IDs, this method maps controllers to actions. This
    is a very elegant method, especially if you''re building a Ruby on Rails (or similar)
    application where consistent naming conventions are a high priority. It also allows
    body IDs and classes to be used for other methods, if the need arises.


    The downside is leveraging data attributes for section-styling is awkward. In
    a sense, it''s a choice of where the one-to-one correspondence will be — on the
    server with your Ruby on Rails controllers and actions or in your CSS file with
    section-specific classes and IDs.


    Regardless of what specific example you choose, this pattern provides an elegant
    addition to your toolset, adding in a consistent, scalable, and maintainable method
    of running code on $(document).ready().'
