  md: 'project that makes full use of all the widgets and tools of jQuery UI, and
    in those cases, it''s better to download only the necessary components in order
    to reduce the download size footprint on your final product. For exploring and
    experimenting, download the complete set of options.


    If you want to edit your theme, the file css/selected-theme-name/jquery-ui-xxx.css,
    there is a series of commented outlines (in my file, it''s around line 50) with
    an HTTP address. Use this address to re-create your altered theme in ThemeRoller,
    and continue modifying to your heart''s content.


    The following folders are included in the jQuery UI download:


    +   - index.html: a "gallery" of the widgets included with jQuery UI as well as
    the CSS classes

    - js: A folder containing a copy of the latest, full version of jQuery UI, alongside
    a local copy of the core jQuery library

    - css: A folder containing a default UI theme

    - development-bundle: a folder containing full, unmodified versions of all the
    jQuery UI files


    jQuery UI contains a comprehensive CSS framework, which gives all of the widgets
    a consistent look and feel.


    The CSS framework files are located in two places: the css folder at the top level
    and the development-bundle folders. The css file found at the top level contains
    all the definitions in a single file, which reduces the number of HTTP requests
    required to obtain CSS definitions. The files found under the development-bundle
    directory contain both the base theme and the selected custom theme.


    # THEROLLER


    jQuery UI is themeable (that''s the word the jQuery maintainers use) and customizable.
    You have a few different approaches for modifying themes:


    +   - Make a theme from scratch

    - Use a premiere theme without making any changes

    - Alter a theme manually

    - Use ThemeRol to modify a premiere theme


    Making a theme from scratch is hard but practical given the sheer number of CSS
    classes you''d have to create. Using the default themes is a great option, but
    the out-of-the-box defaults probably don''t match the colors of your application,
    so your best bet is to modify an existing theme. If you feel inclined, you can
    modify the CSS classes manually, but using ThemeRol is much less of a hassle.


    You can find ThemeRol at http://jquery.com/themroller. This page shows a preview
    of each of the widgets and the icon set before you download it. On the left side
    of the page is a panel displaying options for "Roll your own" themes, a gallery
    of premiere themes, and a Help tab. Choose a theme that closely resembles what
    you''d like as a final product, and modify the options to suit your needs. When
    you''re finished, click the Download button. It''s that simple.'
