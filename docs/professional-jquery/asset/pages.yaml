  md: "# Writing Less Verbose JavaScript with jQuery\n\nJavaScript, although a very\
    \ powerful language in its right, is sometimes verbose. JavaScript frameworks\
    \ like jQuery offer numerous shortcuts for reducing the amount of code needed\
    \ to accomplish common web development tasks. You've already seen a few:\n\n#\
    \ JAVASCRIPT WAY\n\n```\nwindow.onload = function() {\n  var elements = document.getElementsByTagName(\"\
    div\");\n  for (var i = 0; i < elements.length; i++) {\n    elements[i].style.color\
    \ = green;\n  }\n}\n```\n\n# JQUERY WAY\n\n```\n$(function() {\n  $('div\").each(function(index,\
    \ value) {\n    $(this).css(\"color\", \"green\")\n  });\n});\n```\n\nThe code\
    \ feels more concise and abbreviated, and although the difference between the\
    \ number of lines is not big you all, it comes very quickly. It becomes a habit\
    \ to use the $(function() {..}); instead of window.onload().\n\nOf course, there\
    \ are deeper, benefits to using a library like jQuery. Adding powerful features\
    \ in a cross-browser way is even better. In this specific example, jQuery grants\
    \ you the ability, in a cross-browser way, set multiple callbacks for the onload\
    \ event. Without a cross-browser solution only one callback could be set for event\
    \ which means that you could accidentally overwrite methods if you weren't careful.\n\
    \nAs an aside, this problem was originally solved by the community centering on\
    \ a series of blog posts by the influential JavaScript developer Dean Edwards:\
    \ http://dean.edwards.name/weblog/2005/09/buster/ and http://dean.edwards.name/weblog/2006/06/again/.\
    \ One name that appears as an important contributor to the completed solution\
    \ was none other than the creator of jQuery, John Resig.\n\n# THE JQUERY FRAMEWORK\
    \ STRUCTURE\n\nBecause jQuery is a well-written framework, it is easy to treat\
    \ it as a black box. But, it is instructive to learn the underlying code, and\
    \ see how the nuts and bolts go together. If you're interested, as of jQuery 1.3,\
    \ the selector engine is now based on a separate project by John Resig, called\
    \ sizzle, and offers performance enhancements over the previous method for selecting\
    \ selectors. See http://sizzle.com for more.\n\nIf you recall Chapter 2, a self-invoking\
    \ anonymous function looks like this:\n\n```\n(function(arguments) {\n  // do\
    \ something\n})()\n```"
  merge: -1
