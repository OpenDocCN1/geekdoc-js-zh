- img_proc: true
  md: "This organizational approach allows you to test site sections or features without\
    \ having to run an entire test suite. This is a useful feature if you're on a\
    \ large project with many associated tests.\n\n# Filtering Tests with URL Parameters\n\
    \nSimilar to the way you can set the `nolds` and `notrycatch` flags with query\
    \ parameters, you can also filter tests. Simply add `filtername` to the URL and\
    \ QUnit will only run tests names contain `filtername`. This can be based on module\
    \ names or test names and allows you to easily target specific features when doing\
    \ tests.\n\nThe use of this feature is particularly apt when bug fixing the jQuery\
    \ core. Although you're required to run the full test suite before issuing a pull\
    \ request, you *don't* want to test the entire library when you're testing your\
    \ feature-specific fix.\n\nWith filtering, you can only run the pertinent areas\
    \ while developing and then you only need to run the full test once, before you\
    \ send off your (presumably heroic) bug fix.\n\n# ASYNCHRONOUS TESTING\n\nSometimes,\
    \ you need to be able to control the flow of a test. An obvious example is an\
    \ Ajax request. Looking at the following code sample, you see an Ajax request\
    \ that is part of the test. Inside the callback are two assertions, `ok` and `equal`.\n\
    \n```\ntest(\"stops & starts\", function() {\n  expect(2);\n\n  var url = `/data/json/\\\
    `;\n  $.getJSON(url, {name: \"Testing\"}, function(data) {\n    ok(data,\"data\
    \ returned from the server\");\n    equal(data.name, \"Testing\", \"We're Testing\"\
    );\n  });\n});});\n```\n\n> Code snippet from broken-ajax-test.html\n\nRunning\
    \ the test generates the result shown in Figure 14-9.\n\n![](img/16459f9d4793f783ab42cec76c544db0_315_0.png)\n\
    \n**FIGURE 14-9**"
  merge: -1
  pgno: 315
- img_proc: true
  md: "# This is an unexpected result.\n\nBecause the Ajax request is asynchronous,\
    \ neither of the tests is run. You're not going to catch many errors that may\
    \ vary. Frankly, QUnit provides a pair of methods to control this flow: start\
    \ and stop. Rewriting the test to pass as expected, the test is paused with stop()\
    \ before the Ajax request, and the test is restarted with start() at the end of\
    \ the callback.\n\n```\ntest(*async\", function() {\n  expect(2);\n\n  stop();\n\
    \  $.JSON(\"/data/json/\", function(data) {\n    ok(data, \"We expect to get data\
    \ from the server\");\n    equal(data.name, \"Testing\", \"We expect the name\
    \ property to match\");\n    start();\n  });\n});\n\n```\n\n> Available to download\
    \ on Wqx.com\n\nCode snippet from start-stop.btml\n\nRunning this code produces\
    \ the desired result. As you see in Figure 14-10, both expected tests are run\
    \ and both pass.\n\n| QUnit example | noglotrycatch |\n| Hide passed tests |\n\
    | Mobile (J2) | Windows NT 6.1; WOW64; rv:8.0; Gecko/20100101; Firefox/8.0 |\n\
    | Tests completed in 22 milliseconds.\n| 2 tests of 2 passed, 0 failed |\n| 1\
    \ async(0, 7)|\n\nFIGURE 14-10\n\n# Using asyncTest\n\nThe convenience methods\
    \ available with $Ajax, QUnit has a convenience method for the common pattern\
    \ of starting a test, and then stopping it for an asynchronous action.\n\nThe\
    \ following code shows the previous example rewritten with that convenience method,\
    \ asyncTest:\n\n```\nasyncTest(\"async\", function() {\n  expect(2);\n\n  $.JSON(\"\
    /data/json/\", function(data) {\n    ok(data, \"We expect to get data from the\
    \ server\");\n  });\n}\n```\n\n> Available to download on Wqx.com\n\n*"
