  md: '# CHAPTER 4 DOM ELEMENT SELECTION ANDIPULATION


    Not only can you pass a DOM element, but also a jQuery wrapper object passed in
    an argument contains more than one element, then .index() returns the index of
    the first match.


    A third type of argument that .index() accepts a selector string. Again, if more
    than one element is returned, the zero-based index of the first match is returned.
    Both .get() and .index() are considered destructive because they break a jQuery
    chain. A chain is broken when the method invoked does not return a jQuery wrapper
    object, and hence the chain can''t continue.


    It''s useful to think of a chain as if it were a stack, where each item on the
    stack is a set of elements. Upon calling a method, such as .filter() or .find(),
    a new element is pushed onto the stack. At times you might need to revert back
    to the original wrapper object. This is accomplished with the .end() method as
    the following example shows:


