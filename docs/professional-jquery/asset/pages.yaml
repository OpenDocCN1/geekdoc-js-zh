    # # Accordion


    Accordion widgets, similarly to tabs, are a great way to display and categorize
    a large amount of information. This widget is an expandable/collapsible box. It''s
    not meant to have all of its content expanded at the same time, but rather to
    display one "slice" of content at time.


    TABLE 8-6: Available $.accordion Methods


    | METHOD | DESCRIPTION |

    | --- | --- |

    | $(selector).accordion(); | Initializes an accordion widget. |

    | $(selector).accordion( "destroy" ); | Removes the accordion widget completely.
    This option rolls the selected element back to its initial state. |

    | $(selector).accordion( "disable" ); | Disables the accordion widget. |

    | $(selector).accordion( "enable" ); | Enables the accordion widget. |

    | $(selector).accordion( "option" optionName, [value] ); | Get or set any accordion
    option. If the third argument acts as a getter. Otherwise, it sets the optionName
    with the provided value. |

    | $(selector).accordion( "widget" ); | Returns the .ui-accordion element. |

    | $(selector).accordion( "activate", index ); | Activates a content part of the
    accordion widget. The index indicates the zero-indexed number matching the position
    of the header to close or a selector matching element. |

    | $(selector).accordion( "resize" ); | Recomputes the heights of the accordion
    widget contents. |'
