  md: "```\n//handle negative result\n}\nfunction fulfilled() {\n  //handle successful\
    \ result\n}\nfunction failed() {\n  //Error!\n}\n\npromise.then(\n  unfilled,\n\
    \  fulfilled,\n  failed\n);\n```\n\nCode snippet is from pseudocode.txt\n\nIn\
    \ English, ajaxPromise goes off, gets data with an XMLHttpRequest, and when the\
    \ request finishes, it returns a promise in one of the three states. The .then()\
    \ method returns the result to one of three functions designed to handle state.\
    \ Now that logic is bound to ajaxPromise itself. It's all handled outside the\
    \ function, which allows ajaxPromise to remain more generic because less application\
    \ logic is bound to it.\n\nNow you've got some history on the concept, in the\
    \ next section, you look at the power of jQuery's Deferred implementation.\n\n\
    # THE JQUERY DEFERRED OBJECT\n\njQuery's implementation adds onto the basic promise\
    \ of the with several useful enhancements. Importantly, it also integrates directly\
    \ with one of the core features of the library, $.ajax, so Deferred opens up a\
    \ world of possibilities once you've got your head wrapped around it.\n\nAs is\
    \ the jQuery way, the format of the implementation is heavy on the ability to\
    \ chain methods in a convenient way. It's also written in a friendly, human-readable\
    \ style.\n\nThis section looks at jQuery's basic implementation and walks through\
    \ some of the more advanced features available.\n\n# $.when, Deferred.done, and\
    \ Deferred.fail\n\nWorking with Deferred, you'll find a lot of activity flows\
    \ through the jQuery method $.when. .when accepts one or one Deferred objects\
    \ (which importantly include $.ajax calls) or a plain object.\n\nIf a Deferred\
    \ is passed to $.when, its promise object is returned by the method. You see more\
    \ how to manage jQuery's promises in a later section, but additional methods are\
    \ then available to chain and structure callbacks."
