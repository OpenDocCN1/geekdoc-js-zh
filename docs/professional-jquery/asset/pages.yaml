  md: "# TABLE 14-1: QUnit Assertions\n\n| ASSERTION | ARGUMENTS | DESCRIPTION |\n\
    |---|---|---|\n| Ok | state, message | A Boolean assertion. Passes if state is\
    \ truthful. |\n| Equal | actual, expected, message | A comparison assertion. Compares\
    \ actual and expected. Passes if actual and expected are leniently (==) equals.\
    \ |\n| notEqual | actual, expected, message | A comparison assertion. Compares\
    \ actual and expected. Passes if actual and expected are leniently unequal. |\n\
    | deepEqual | actual, expected, message | A deep recursive assertion. Recursively\
    \ compares objects. Fails if some property isn't equal. |\n| notDeepEqual | actual,\
    \ expected, message | A deep recursive comparison assertion. Recursively compares\
    \ objects. The inverse of deepEqual. Passes if some property isn't equal. |\n\
    | strictEqual | actual, expected, message | A comparison assertion. Compares actual\
    \ and expected. Passes if actual and expected are strictly (===) equal. |\n| notStrictEqual\
    \ | actual, expected, message | A comparison assertion. Compares actual and expected.\
    \ Passes if actual and expected are strictly unequal. |\n| Raises | block, expected,\
    \ message | This assertion tests if code throws error. |\n\n# # Testing DOM Elements\n\
    \nIf you're doing DOM manipulations (and because you're reading a jQuery book,\
    \ you probably, you'll want to test the output. QUnit provides an interface to\
    \ do that. To test DOM elements, simply set your markup in #junit-fixture, make\
    \ your DOM magic, and then use assertions to test the state of the DOM. QUnit\
    \ run junit-fixture after each test.\n\nA simple example is shown in the following\
    \ QUnit:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n  <link rel=\"stylesheet\" href=\"http://code.jquery.com/qunit/git/qunit.css\"\
    \ />\n  <script type=\"text/javascript\" src=\"http://code.jquery.com/qunit/git/qunit.js\"\
    ></script>\n  <script>\n    $(function() {\n```"
