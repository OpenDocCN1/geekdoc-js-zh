  md: "# Animations with HTML5 Canvas\n\nTo get any real use of canvas, you'll need\
    \ JavaScript. The following example demonstrates how to create a rectangle:\n\n\
    ```\n$function() {\n  var rect_ctx = $(\"canvas#\\0].getContext(\"2d\");\n  rect_ctx.fillRect(10,\
    \ 10, 50, 50);\n}\n```\n\nThe canvas object is selected, and used to get a handle\
    \ on its context. Then the context is used to draw a rectangle at the point (10,\
    \ 10) with a width of 50 and a height of 50. The context is an object that contains\
    \ all of the drawing methods and properties for the canvas. In the previous example,\
    \ you used the fillRect() method to create a rectangle using the system default\
    \ black color.\n\nThe coordinate system has its origin at the top-left corner\
    \ of the browser window with an increasing x value towards the right and an increasing\
    \ y value downward. Figure 7-3 illustrates this system.\n\n![](img/16459f9d4793f783ab42cec76c544db0_172_0.png)\n\
    \nThe strokeStyle is the outline style, and the fillStyle obviously is for inside\
    \ the draw area. Here are a couple of rectangles with different fill and stroke\
    \ styles:\n\n```\n$function() {\n  var ctx = $(\"canvas#c1\").getContext(\"2d\"\
    );\n\n  ctx.fillStyle = \"rgb(0,150,0)\";\n  ctx.strokeStyle = \"rgb(200,0,0)\"\
    ;\n  ctx.fillRect(0,0,150,150);\n\n  ctx.fillStyle = \"rgb(100,100,0)\";\n  ctx.fillRect(150,150,150,150);\n\
    }\n```\n\nYou can also draw connected lines. First map out the path, and then\
    \ do the actual\n\n```\nctx.beginPath();\nctx.moveTo(1,1);\nctx.lineTo(10,10);\n\
    ctx.stroke();\nctx.closePath();\n```\n\nTo get a good primer on the canvas tag\
    \ we recommend the canvas chapter of Mark Pilgrim’s, \"Dive Into HTML5.\". You\
    \ can find it at http://diveintohtml5.io/canvas.html.\n\nIn the next example,\
    \ you redo the same box animation, but this time you use canvas of a div. Even\
    \ though this is a simple box consider, consider that it could be a more complex\
    \ drawn\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <style type=\"text/css\"\n\
    ```"
