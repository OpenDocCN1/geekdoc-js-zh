  md: "# CHAPTER 4 DOM ELEMENT SELECTION AND MANIPULATION\n\n| TABLE 4-2 (continued)\
    \ |\n| ATTRIBUTE SELECTOR | DESCRIPTION |\n| elem[attr~val] | Select elements\
    \ that contain an attribute attr with a value that contains the word val. Words\
    \ are delimited. |\n| elem[attr*=val] | Selects elements that have specified the\
    \ attribute attr with a value containing the given substring val. |\n\n# # Selecting\
    \ by Position\n\nElements can also be selected by their relation to other elements\
    \ (child/parent relationships), or by hierarchical position in a document. Some\
    \ examples might include selecting the first or last items in a list, or even\
    \ rows in a table. Suppose you have an ordered list like the one in the following\
    \ code snippet. \"fowl\". The JavaScript that illustrates several variations on\
    \ jQuery's selectors by position. They resolve as:\n\n+   * li:even returns the\
    \ even numbered members of the matched set.\n* li:odd returns the even numbered\
    \ members of the matched set.\n* li:first returns the first element of the matched\
    \ set.\n* li:last returns the last element of the matched set.\n* li:eq(3) returns\
    \ the 4th element in the matched set.\n* li:gt(2) returns all elements of index\
    \ greater than 2 in the matched set.\n* li:lt(3) returns all elements of index\
    \ less than 3 in the matched set.\n\nNote that all position selectors start their\
    \ count at zero except for the nth-child filter, which starts at one, which we\
    \ will explain in the section \"Filtering by Relationships.\"\n\n```\n<ol id=\"\
    fowl\">\n  <li>Turkey/</li> <!-- 0 -->\n  <li>Chicken/</li> <!-- 1 -->\n  <li>Parrot/</li>\
    \ <!-- 2 -->\n  <li>Pigeon/</li> <!-- 3 -->\n  <li>Hawk/</li> <!-- 4 -->\n</ol>\n\
    \n$(:even) // returns turkey, carrot, and hawk\n$(:odd) // returns chicken and\
    \ pigeon\n$(:first) // returns turkey\n$(:last) // returns hawk\n$(:eq(3)) //\
    \ returns pigeon\n$(:gt(2)) // returns pigeon and hawk\n$(:lt(3)) // returns parrot,\
    \ chicken, turkey.\n```\n\n# # Using Filter Selectors\n\nNotice that the set of\
    \ all selectors begins with a colon (:). This class of selectors is known as filters,\
    \ because they filter a base selector. Just to add more to the jQuery filter mayhem,\
    \ there are"
  merge: -1
  pgno: 93
