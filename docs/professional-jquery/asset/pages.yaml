    \ request\");\n  }\n})\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n\
    Code snippet from ajax-find.txt\n\nThis example appends the titles found to the\
    \ document body. The .find() method searches an XML document for the element name\
    \ specified. Just like an HTML document, if you want to access an attribute use\
    \ the .attr() method.\n\n![](img/16459f9d4793f783ab42cec76c544db0_152_0.png)"
