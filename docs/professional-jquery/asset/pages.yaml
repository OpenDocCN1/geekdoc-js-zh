  md: "# CHAPTER 13 ADVANCED ASYNCHRONOUS PROGRAMMING WITH JQUERY DEFERRED\n\n```\n\
    function callback() {\n  console.log(\"The animation is done. On to the next operation\"\
    );\n}\nfunction alternativeCallback() {\n  console.log(\"The animation is done.\
    \ Let's follow a different path.\");\n}\nfunction specialCase() {\n  console.log(\"\
    This is a special case. Let's do a special UI update.\");\n}\n\n$.when( updateStatus()\
    \ )\n  .done( callback );\n\n// an alternative callback\n$.when( updateStatus()\
    \ )\n  .done( alternativeCallback );\n\n// multiple callbacks\n$.when( updateStatus()\
    \ )\n  .done(\n    [ callback,\n      specialCase\n    ]\n  );\n```\n\n> Code\
    \ snippet from decoupled-callbacks.txt\n\nAs you can see, the code nicely deferred\
    \ the callback logic from the animation buried in the function body. This allows\
    \ for greater reuse and presents a much clearer pattern for any other developers\
    \ on the project to grasp. No one needs to read updateStatus to know how the application\
    \ flows. It's all out in (nearly) plain English.\n\n# Deferred,then Syntax for\
    \ Deferred.fail and Deferred.done\n\nAs with aliases $.ajax like $.get and $.post,\
