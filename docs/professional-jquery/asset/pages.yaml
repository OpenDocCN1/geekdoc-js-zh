  md: "# UNDERSTANDING ACCESS LEVELS\n\nThere's no official syntax for access levels\
    \ in JavaScript, like the private or protected keywords provided in Java. By default,\
    \ all members in an object are publicly accessible. But it's possible to get the\
    \ same effect of private and privileged properties. To achieve the effect of private\
    \ methods and properties, use closures.\n\n```\nfunction TimeMachine() {\n  //\
    \ private members\n  var destination = 'October 5, 1955';\n\n  // public members\n\
    \  this.getDestination= function() {\n    return destination;\n  };\n}\n\nvar\
    \ deleon = new TimeMachine();\nconsole.log(deleon.getDestination());\n// October\
    \ 5, 1955\n// console.log(deleon.destination);\n// undefined\n```\n\nThe getDestination\
    \ is a privileged method because it has access to private members of the TimeMachine.\
    \ Meanwhile, the variable, destination, is \"private\" and its value is only accessible\
    \ through the privileged method.\n\n# APPLYING MODULES\n\nJust like the private\
    \ and privileged access levels, JavaScript has no built-in syntax for packages.\
    \ The module pattern is an easy and popular way to create self-contained, modularized\
    \ code. To create a module, declare a namespace, bind an immediate function to,\
    \ and define any private and privileged members. Let's rewrite the TimeMachine\
    \ object.\n\n```\n// create namespace object\nTIMEMACHINE = {};\n\nTIMEMACHINE.createDeleorean\
    \ = (function() {\n  // private\n  var destination = '';\n  var model = '';\n\
    \  var fuel = '';\n\n  // public access methods\n  return {\n    // setters\n\
    \    setDestination: function(dest) {\n      this.destination = dest;\n```"
