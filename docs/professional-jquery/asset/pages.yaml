- img_proc: true
  md: '# Taming a Tangle of Strings | 225


    This example creates a jQuery Template with the name comics. The id is tied to
    the name of the template in theating engine. The special type indicates to jQuery
    that it''s a script block. The browser ignores script-mpl block because it doesn''t
    know what to do with a script of type text/x-jquery. This example also introduced
    the first template tag, ${}, which exposes variables to the template structure.


    This is the cleaner of two patterns, representing a full break between script
    and behavior. The recommended pattern if you don''t have many templates or if
    you need to expose templates to team members who may not spend a lot of time around
    JavaScript files.


    As a note, it''s also possible to create templates in any element (a DIV with
    display:none as a CSS rule, for example), but such markup could cause unexpected
    errors.


    # Creating Templates with $.template()


    Alternatively, you can create templates in your JavaScript files using the $.template()
    method:


    ```

    $(''comics'', ''<div class=''comic''>

    <img src=''${Img}'' /><div class=''details''><div class=''title''>

    <h3>${title}</h2>

    <div class=''year''>${year}</div>

    <div class=''number''>${number}</div></div></div>'');

    ```


    > Code snippet is from template-method.txt


    Both examples use the same template format, with variables encapsulated in {}
    blocks. The difference is here that the template string passed as the second of
    a pair of arguments to the, $.template() method. The first argument is the id
    of the template, analogous to the id attribute of the script tag in the first
    example.


    Because it''s not as clean as separation, this method is suggested only if you
    have many templates in your site or advantage to leverage browser caching for
    the template definitions. The previously illustrated formatted script blocks are
    included inline in the markup, they are downloaded and parsed each time a page
    is loaded.


    Placing your templates in a script file allows them to be downloaded once and
    retrieved from memory on each subsequent page view, saving network connection
    and download time. This may not matter if your templates are focused on individual
    pages or site sections in a single-page application, but if you have many templates
    spread across a large site, it might be preferable to have them served in a cacheable
    manner.


    # Making the $.template() Method Maintainable


    If you find yourself needing to use the $.template() method, we suggest looking
    at something similar to the following pattern. It uses a function to initialize
    all templates for the site or application. While, the markup kept in JavaScript
    files is not the best possible solution, it''s at least keep it in a more, maintainable
    location. You always know where your templates are. The following code illustrates
    this pattern. The basic pattern should be similar from Chapter 10''s discussion
    of the Garber-Irish implementation. In you have a common object that holds code
    common to all pages. One piece of that code is a method called init. init, among
    any'
