    # jQuery-Specific Selector Performance


    To be as efficient as possible, it''s also important to understand jQuery''s strategy
    for selectors. In general, jQuery wants to pass the selector immediately to a
    native DOM method. As you saw in the previous section, if you''re using #id as
    a selector, jQuery passes that directly to `document.getElementById("id")`. As
    you saw in Table 10-3, that''s extremely fast. Selectors that can be passed along
    to `document.getElementsByTagName` and `document.getElementsByClassName` are also
    fast for the same reason.


    As an aside, if you know browser feature lists, you''ll know that the latter isn''t
    supported in older versions of IE, so explain why selectors are slow in Internet
    Explorer 6 and 7.


    # document.querySelectorAll and jQuery Extensions


    Selectors that can be passed to `document.querySelectorAll(QSA)` when it''s available
    are also very fast. The thing to keep in mind is that every jQuery selector isn''t
    necessarily available in the native implementations of QSA. Because they''re hand-rolled
    implementations and browser-optimized, these jQuery extensions to the CSS selectors
    are comparatively slow.


    The jQuery extensions to the CSS3 engine are listed in Table 10-4. Use them with
    care. When using these selectors, it''s suggested that you pass a pure CSS selector
    to jQuery and use `.filter()` to gather your specific results.'
