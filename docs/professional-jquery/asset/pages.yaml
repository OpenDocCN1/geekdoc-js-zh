  md: "The widget sets also accept an object for configuring the many available options\
    \ for fine controlling of the widgets.\n\n# Button\n\nBrowsers use the default\
    \ OS button for inputs. While this is certainly a\nfunctional choice, you'll often\
    \ want to create custom styles to match your site's\\overall design. Figure 8-2\
    \ illustrates how jQuery UI button class enhances\nthe native version.\n\nThe\
    \ $.button() style is applied to individual buttons whereas $.buttonset() is applied\
    \ to\ngroups like radio inputs and checkboxes. Table 8-2 lists the available methods\
    \ for both types of\nbutton widgets.\n\n![](img/16459f9d4793f783ab42cec76c544db0_179_0.png)\n\
    \nFIGURE 8-2\n\nTABLE 8-2: Available $.button() and $.buttonset() Methods\n\n\
    | METHOD | DESCRIPTION |\n| --- | --- |\n| $(selector).button();\n$(selector).buttonset();\
    \ | Creates a default button widget |\n| $(selector).button('disable');\n$(selector).buttonset('disable');\
    \ | Disables a previously created button widget. |\n| $(selector).button('enable');\n\
    $(selector).buttonset('enable'); | Enables a previously enabled button widget.\
    \ |\n| $(selector).button('destroy');\n$(selector).buttonset('destroy'); | Removes\
    \ the button widget completely. This option\rolls the selected element back to\
    \ its initial state. |\n| $(selector).button('option',\noptionName, value);\n\
    $(selector).buttonset('option',\noptionName, value); | Gets or sets any button\
    \ option. If the third argument\nomitted, acts as a getter. Otherwise, it sets\
    \ the\noptionName with the provided value. |\n| $(selector).button('widget');\n\
    $(selector).buttonset('widget'); | Returns the .ui-button element. |\n| $(selector).button('refresh');\n\
    $(selector).buttonset('refresh'); | Refreshes the visual state of the button widget.\
    \ |\n\nTable 8-3 shows the options available for the button and buttonset.\n\n\
    | OPTION | ACCEPTS | DESCRIPTION |\n| --- | --- | --- |\n| Disabled | Boolean\
    \ | Disables the button widget. |\n| Text | Boolean | Option dictating if text\
    \ should be displayed or not. |"
