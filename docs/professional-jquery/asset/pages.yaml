    # Datetime


    The datepicker is one of the more versatile jQuery Widgets. Chances, if you''ve
    made a reservation online for flight or hotel, you''ve used a JavaScript datepicker.

    nThe "out of the box" version of the datepicker is incredibly useful, but there''s
    a mind-numbing amount of additional features and options that extends its capabilities.
    Besides the various ways of presenting the datepicker, it also includes a set
    of utility functions and shortcuts for navigation. You could call the default
    datepicker like so:


    ```

    $(selector).datepicker();

