  md: '# 5

    Event Handling


    WHAT''S IN THIS CHAPTER?


    +   - Understanding the Browser Event Model

    - Understanding How jQuery Handles Events

    - Working with jQuery Events


    Any GUI-based modern application is inherently event-driven, and web applications
    are no exception. All event-driven applications follow the familiar pattern of
    setting up event-handling mechanisms, waiting for an interesting event to occur
    (such as a mouse click), and responding to that event. Beyond the normal clicking
    and key-pressing events, there''s also page loading and other semantic events,
    as well as the more recently added events as swipe gestures, which are now important
    given the popularity of touch devices as iPhones and Android. Events are fundamental
    to the Web; the use of JavaScript is seriously limited without them. The jQuery
    categorize event methods into document loading, form events, event-handler attachments,
    browser events, methods related to the Event object, and keyboard events.


    Most likely, at some point in your career as a developer you''ve heard about the
    various cross-browser issues that plague web development. How different browsers
    manage events is one of the most significant cross-browser problems.


    In this chapter you review basic JavaScript event handling, DOM level 0 and level
    2, event propagation, bubbling, and Internet Explorer''s model to get a better
    understanding of what''s going on under the hood. Then you translate that knowledge
    to jQuery''s event-handling mechanism, and see how it normalizes all of the cross-browser
    difficulties. Finally, you apply all this to a sample application.'
  merge: -1
  pgno: 116
- img_proc: true
  md: "# UNDERSTANDING THE BROWSER EVENT MODEL\n\nBefore getting into iQuery handles\
    \ events, and how it saves a lot of grief, let's review JavaScript event models.\
    \ JavaScript was originally introduced as LiveScript back in 1995. Getting the\
    \ DeLorean and jumping back in time to 1996, Netscape Navigator and Microsoft\
    \ Internet Explorer 3 were all the young crowd. Table 5-1 illustrates the various\
    \ event models in play during those primordial days of web scripting.\n\n**Table\
    \ 5-1:** DOM Level Events\n\n| DOM LEVEL | DESCRIPTIONS |\n| --- | --- |\n| 0\
    \ | Original event models developed by Netscape. All browsers support this model.\
    \ |\n| 2 | Standard event model, more advanced than level 0, but not supported\
    \ by IE. |\n| IE Model | A separate event model that only IE browsers use.\n\n\
    DOM level 0 refers to the document model support by Netscape Navigator 2.0, which\
    \ is also adopted by browsers. This level is not a formal, but all major browsers\
    \ are level 0 compatible. The DOM provides an interface for accessing and modifying\
    \ the content, style, and structure of an HTML document. DOM level 0 events are\
    \ handled inline, with an \"on\" attribute added to the element with JavaScript\
    \ code as the attribute value, or by selecting the element inside JavaScript code\
    \ and binding an anonymous function as the event handler. The following snippet\
    \ demonstrates the former method:\n\n```\n<html>\n<head>\n<style type=\"text/css\"\
    >\n.clickDiv {\n  width:100px;\n  height:100px;\n  background-color:blue;\n}\n\
    </style>\n<script type=\"text/javascript\">\nfunction hitMe() {\n  var txtNode\
    \ = document.createTextNode(\" clicked \");\n  var br = document.createElement(\"\
    br\");\n  document.getElementsByTagName(\"body\")[0].appendChild(txtNode);\n \
    \ document.getElementsByTagName(\"body\")[0].appendChild(br);\n}\n</script>\n\
    </head>\n<body>\n<div class=\"clickDiv\" onclick=\"hitMe();\"></div>\n</body>\n\
    </html>\n```\n\nCode snippet is from onclick.txt"
  merge: -1
  pgno: 117
- img_proc: true
  md: "The JavaScript in this example is obviously intrusive. I've bound to the onclick\
    \ event the hitMe() . The previous example can also be written as:\n\n```\n<html>\n\
    <head>\n  <style type=\"text/css\">\n  .clickDiv {\n    width:100px;\n    height:100px;\n\
    \    background-color:blue;\n  }\n</style>\n  <script type=\"text/javascript\"\
    >\n  document.getElementById(\"clickDiv\").onclick = function(event){\n    document.getElementsByTagName(\"\
    body\")[0].appendChild(\"clicked\");\n  }\n</script>\n</head>\n<body>\n  <div\
    \ id=\"clickDiv\" class=\"clickBox\">Click Here</div>\n</body>\n</html>\n```\n\
    \nwhich now separates the control logic from the structure. This still suffers\
    \ from a few setbacks. The function bound to the onclick event accepts a event\
    \ object. While most browsers accept the standard event object, Internet Explorer\
    \ uses window.event, or in other words, the event object to the global window\
    \ object. Using feature detection, preferred over browser detection, your event\
    \ handler script do something like the following:\n\n```\nvar evt = (window.event\
    \ ? window.event : event);\n```\n\nFurthermore, the standard event object is not\
    \ the same as the IE's Event object, and supports a slightly different set of\
    \ properties. For cross-browser scripts, this is very annoying and breaks compatibility.\
    \ Table 5-2 illustrates some of the similarities/differences between the IE Event\
    \ object and the standard Event object.\n\n# TABLE 5-2: Firefox Event Object (In)\
    \ Compatibilities\n\n| NAME | PROPERTY OR METHOD? | IE EQUIVALENT |\n|---|---|---|n|\
    \ stopPropagation() | Method | cancelBubble() |\n| layerX, layerY | Property |\
    \ offsetX, offset |\n| Target | Property | srcElement |\n| Type | Property | Type\
    \ |\n| preventDefault() | Method | returnValue() |\n\nCode snippet is from better-onclick.txt\n\
    \ncontinues"
