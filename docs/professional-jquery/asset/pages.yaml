  md: 'Separating markup from functionality is the way of modern web development,
    for many reasons. One reason for keeping your JavaScript/jQuery code in an external
    .js file is that it helps the debugger catch the error with the actual line number,
    not to mention it keeps your code unobtrusive.


    Make your projects driven. Later in the book, I describe how to use JUnit to add
    unit tests to your projects. You probably already know, although jQuery handles
    most cross-browser concerns, it''s still necessary to test in different browsers
    and environments, including portable devices like iPhones. Having a full test
    suite will make it easier to detect and squash cross-browser bugs.


    For small bits of code-liners, use code applications like jQuery and Rhino to
    make sure you''re getting the expected results.


    Make sure of the obvious. The most experienced programmer may miss something obvious.
    Who hasn''t added a script tag for jQuery, only to find out much later, to dismay
    the path was mistyped? The debuggers will let you know if the $ variable is undefined.


    Being aware of browser-specific issues and their particular behaviors is important.
    Trailing comma in an object literal is just priceless after you''ve developed
    in a browser like Firefox or Safari for hours, only to have your beautifully scripted
    project explode in IE.


    One point we mention and agree in this book is the necessity to really go JavaScript.
    The learning curve for jQuery is low; it''s a wonderful framework for beginners
    to create dazzling JavaScript effects. However, advanced users doing development
    shouldn''t treat it as a black box. It embeds and extends JavaScript, and this
    requires JavaScript understanding.


    Of course, there are all the other regular tips as well. For example, make sure
    your HTML and XML are well formed, use version control tools like Mercurial or
    Git, and call on the Google or Stack overflow gods when you''re really stuck.


    # USING THE FIREQUERY PLUGIN


    There''s another FireQuery plugin for your jQuery repertoire: the FireQuery plugin,
    which enhances Firebug for better handling of jQuery. Its features include:


    +   - Elements and dynamically added by jQuery at run time can be visually inspected
    in the console.

    - Elements that are members of a jQuery "collection" are highlighted in the window
    on a mouseover event.

    - jQuery-specific expressions are recognized and presented in the FireQuery console.


    One of its most interesting features is the "jQueryify" button, which dynamically
    loads jQuery into any web page viewed by the browser. This is useful if you''re
    running tests with jest, because it cuts out the step of loading jQuery from a
    CDN using the load() command in the console.


    After you install FireQuery, you can check that it is working correctly by visiting
    the page at http://firequery.binaryage.com/test/index.html. Figure 1-5 shows a
    successful install of FireQuery.'
