  md: "# CHAPTER 5 EVENT HANDLING\n\n| TABLE 5-2 (continued) |\n| NAME | PROPERTY\
    \ OR METHOD? | IE EQUIVALENT |\n| altKey, ctrlKey, shiftKey | Property | altKey,\
    \ ctrlKey, shiftKey |\n| Button | Property | Button |\n| charCode | Property |\
    \ keyCode |\n| relatedTarget | Property | fromElement, toElement |\n| Bubbles\
    \ | Property | N/A |\n\nAt times, you may want to bind several different handlers\
    \ to the `onclick` event of the same element. In DOM level 0, binding will overwrite\
    \ any other method bound to the event.\n\nThe solution is found in DOM level 2\
    \ events. You probably noticed a lack of DOM level 1 events; it's because they\
    \ don't exist. Level 2, on the other hand, is a more advanced model than level\
    \ 0, and is supported by most browsers except for IE version 8 and earlier; on\
    \ this deviation. In this model, assigning an event handler as an object property\
    \ each page element in the DOM has a method called `addEventListener()`, which\
    \ allows you to add more than one handler to an element.\n\n```\n<html>\n<head>\n\
    \  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n  <script>\n\
    \    function() {\n      var eventType = \"click\";\n      var useCapturePhase\
    \ = false;\n      var handler1 = function(event) { /* handler code here */ };\n\
    \      var handler2 = function(event) { /* handler code here */ };\n\n      $(\"\
    #element\").addEventListener(eventType, handler1, useCapturePhase);\n      $(\"\
    #element\").addEventListener(eventType, handler2, useCapturePhase);\n    }\n \
    \ </script>\n</head>\n<body>\n</body>\n</html>\n```\n\nCode snippet from addEventListener.txt\n\
    \nThe `addEventListener` accepts three arguments: the event type (in this case\
    \ it's \"click\"), the function that will handle the event, and a Boolean value\
    \ for using the capturing phase. “What’s that?” you ask.\n\n![](img/16459f9d4793f783ab42cec76c544db0_119_0.png)"
