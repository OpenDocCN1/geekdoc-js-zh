  md: "# JQuery's New Event API | 15\n\n```\n<body>\n<div id=\"aDiv\" class=\"boxDiv\"\
    >Press Me\n</div>\n</body>\n</html>\n```\n\n> Code snippet is from on-click.txt\n\
    \nBeyond that basic example, on() also exposes the same functionality present\
    \ in .delegate() and .live() and does so with the exact same syntax. We use .on()\
    \ like delegate() or .live(), simply add a second, optional selector argument\
    \ representing the target element. The first example shows on() to replace our\
    \ example of live() from earlier in the chapter. In it, on() is used to listen\
    \ for clicks on the document and fire the provided handler function if the click\
    \ originates from the ID #anchor. Since the listener is set on the document, it\
    \ will work whenever and wherever the #anchor appears.\n\n```\n<html>\n<head>\n\
    <script src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n<script>\n$function()\
    \ {\n  // element doesn't exist yet, but we can create handler\n  // anyways\n\
    \  $(document).on(\"click\", \"#anchor\", function(event) {\n    console.log(\"\
    I have a handler\");\n  });\n\n  $(body).append(\"<a id='anchor'>I go where </a>\"\
    );\n}\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_136_0.png)\n\
    \n> Code snippet is from on-live.txt\n\nUsing on() like delegate uses the exact\
    \ same syntax as the live() replacement in the previous example. This illustrates\
    \ one of the benefits of the new, simplified API. Instead of remembering two separate\
    \ methods and their associated arguments, you simply remember the on() method\
    \ and adjust your arguments accordingly. If you truly need to bind events to generic\
    \ elements over the whole page, you just use .on() on the document and in your\
    \ generic p or a selector. If you want to follow the more delegate pattern, you\
    \ simply apply .on() to a more focused selector.\n\nRewriting the earlier .delegate()\
    \ example to use .on() is shown in the following code sample. In it, .on() is\
    \ used to listen for clicks on the #delegate div and fires the provided handler\
    \ function if the click originates from a p."
