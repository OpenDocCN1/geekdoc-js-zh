  md: '# CHAPTER 1 GETTING STARTED


    TABLE 1-1: Type Checks

    | OBJECT | TYPE CHECK EXPRESSION |

    |---|--|

    | String | typeof object === "string" |

    | Number | typeof object === "number" |

    | Boolean | typeof object === "boolean" |

    | Object | typeof object === "object" |

    | Element | object.nodeType |

    | null | object === null |

    | null or undefined | object === null |


    Table 1-2 illustrates objects that are type checked using the jQuery API


    TABLE 1-2: Type Checks Using the jQuery API

    | OBJECT | JQUERY METHOD TO USE FOR TYPE CHECKING |

    |---|--|

    | Plain Object | jquery.isObject(object) |

    | Function | jquery.isFunction(object) |

    | Array | jquery.isArray(object) |


    Table 1-3 illustrates methods for type checking undefined.


    TABLE 1-3: Checking undefined

    | OBJECTS | |

    |---|--|

    | Global Variables | typeof variable === "undefined" |

    | Local Variables | variable === undefined |

    | Properties | object.prop === undefined |


    +   - RegExp: Create regular expressions (RegExp) with .text() .exec().

    - Strings: Double quotes are preferred over single quotes.


    The docs also mention validations with JSLint. JSLint is covered in the next section
    on Development Tools.


    There are differences between the Google Style Guide and jQuery''s Style Guide.
    For example, the Google JavaScript Style Guide suggests the use of single quotes,
    whereas the jQuery team uses double quotes as a standard. For this book, we stick
    to the jQuery team''s suggestion.'
