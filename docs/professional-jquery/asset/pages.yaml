  md: "# Getting Started with QUnit | 293\n\nAdditionally, you can filter modules\
    \ at run time (more than in a second) and set up specific environment variables\
    \ for the module's test to run under.\n\nThe following code shows a simplified\
    \ module, complete with two additional new features that empower the custom environment:\
    \ setup and teardown. These are methods that are run before and after the tests\
    \ in the module, and allow for great flexibility in terms of setting up the test\
    \ environment for similar modules.\n\nThe following example sets up a variable\
    \ to test throughout the module, arr (an array). It also stores a value in a variable,\
    \ control, to test later, or off the chance that crazy happens to arr during the\
    \ test. Inside the module itself are two tests. One contains ok assertions and\
    \ the other contains all testing pieces of the Array.\n\n```\nmodule(\"fun with\
    \ arrays\", {\n  setup: function() {\n    this.arr = [1,2,3,4,5];\n    this.control\
    \ = this.arr.length;\n  },\n\n  teardown: function() {\n    equal(this.arr.length,\
    \ this.control, \"Just Checking to see if it's still\\nanArray\");\n  }\n});\n\
    ntest(\"Truthness is golden\", function() {\n  expect(3);\n  var bool = $.isArray(this.arr);\n\
    \nok(bool, \"We're expecting an array *\");\n\nbool = this.arr.indexOf(5);\n \
    \ ok(bool, \"We expect 5 to be in the Array\");\n});\n\ntest(\"Getting Deep\"\
    , function() {\n  expect(2);\n  deepEqual(this.arr, [1,2,3,4,5]);\n});\n```\n\n\
    ![](img/16459f9d4793f783ab42cec76c544db0_314_0.png)\n\nCode snippet is from module.html\n\
    \nRunning these tests produces the output shown in Figure 14-8. As you can see,\
    \ the tests are nested under the \"fun with arrays\" module name.\n\n![](img/16459f9d4793f783ab42cec76c544db0_314_1.png)\n\
    \nFIGURE 14-8"
  merge: -1
