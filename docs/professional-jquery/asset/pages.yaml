  md: "```\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n  <script>\n  function() {\n    $(\"delegate\").on(\"click\", \"p\"\
    , function () {\n      console.log('ouch');\n    }}).css(\"color\", \"green\"\
    );\n  }\n  </script>\n</head>\n<body>\n  <div id=\"delegate\">\n    <p>Hit Me!</p>\n\
    \  </div>\n</body>\n</html>\n```\n\nCode snippet for on-delegate.txt\n\nRemoving\
    \ events is as simple as reversing the process with .off(), the same way you would\
    \ use .unbind() or .die(). The following code shows how to remove the events in\
    \ the previous examples.\n\n```\n$(\"#delegate\").off(\"click\", \"p\");\n$(document).off(\"\
    click\", \"#anchor\");\n$(\"#aDiv\").off('click');\n```\n\nAs you can see, this\
    \ new event API radically simplifies the way jQuery handles events. All the same\
    \ power and convenience you've learned in this chapter is still available, it's\
    \ just presented in a more straightforward, consistent manner.\n\n# SUMMARY\n\n\
    At this point your jQuery scripts are taking on a whole new dimension. You can\
    \ select elements in any number of ways, traverse the DOM, manipulate the classes\
    \ and attributes of any element, and apply a uniform event-handling mechanism,\
    \ independent of browser types.\n\nIn this chapter you also learned the historical\
    \ differences of event handling is different across browsers; about event propagation,\
    \ the Event object, and how jQuery helps cut through the haze and deliver a simple\
    \ solution to managing events easily. Finally, you put together all this event\
    \ know into a useful example.\n\nIn the next step of your journey, you'll use\
    \ your knowledge of events to work with data and forms, and learn about submission\
    \ of forms via Ajax, a cornerstone of modern web development."
