  md: "The preceding code can be rewritten to look like this:\n\n```\nfunction($)\
    \ {\n  $fn.pinkify = function() {\n    return this.css({\n      \"background\"\
    \ : \"#fe57al\",\n      \"color\" : \"#fff\",\n      \"text-shadow\" : \"none\"\
    \n    });\n  }\n}(jQuery );\n```\n\nCode snippet is from return-css.txt\n\nMany\
    \ jQuery methods will also return a full collection, leverage that fact when authorizing\
    \ plugins. It's good to leverage what jQuery offers, especially when you're offering\
    \ your code to the community. Every little bit helps.\n\n# Applying Plugin Best\
    \ Practices\n\nThe following sections examine plugin best practices that the jQuery\
    \ community has built up over the past years. With anything, not all of these\
    \ will be applicable to every line of code you write, but it's good to understand\
    \ these concepts for your own work and to understand the work of other plugin\
    \ authors better.\n\n# Applying the jQuery Plugin Pattern\n\nIn his post \"A Plugin\
    \ Development Pattern\" (http://www.learningjquery.com/2007/10/a-plugin-development-pattern),\
    \ Mike Alias outlines a comprehensive set of best practices to follow when developing\
    \ jQuery plugins. Although the post is several years old, it still holds and is\
    \ cited as a vital resource for plugin developers. This section examines the pattern\
    \ in more detail.\n\n# Claim Only a Single Name in the jQuery Namespace\n\nGiven\
    \ the large number of plugins available and the common convergence of functionality\
    \ and/or plugin focus, there exists a strong possibility that plugin names will\
    \ collide. To limit this as much as possible, it's useful to claim only a single\
    \ name for your plugin. For example, instead of offering several related methods\
    \ like this:\n\n```\njQuery.fn.bestPluginEverInit = function() {\n  //init\n};\n\
    jQuery.fn.bestPluginEverFlip = function () {\n  //flip\n};\njQuery.fn.bestPluginEverFlop\
    \ = function () {\n  //flop\n};\n```"
