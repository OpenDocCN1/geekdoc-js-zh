  md: "# The Plugin Basics | 245\n\nthe most part, be similar to developing jQuery\
    \ applications, sites, or components. That said, you\nhave some key differences\
    \ and gotchas to keep in mind when writing plugins. This section outlines a\n\
    few of those.\n\n# Remember the this Keyword\n\nOne error people commonly make\
    \ when they move from basic to more advanced jQuery development\nis to forget\
    \ where the this commonly refers to the context of a plugin. In jQuery development,\
    \ the\nthis commonly refers to the DOM element being manipulated. In the immediate\n\
    context of a plugin, this points to the current jQuery instance itself. so, instead\
    \ of doing somethingnlike the following inside your plugin body:\n\n```\n$(this).toggle()\n\
    ```\n\n> Code snippet is from extra-this.txt\n\nyou can actually just call:\n\n\
    ```\nthis.toggle()\n```\n\n> Code snippet is from simplified-this.txt\n\nInside\
    \ the body of a plugin, wrapping this in $() is the equivalent of doing something\
    \ like\n$(\"*element\").\n\nThe exception is to when you are iterating over all\
    \ the elements in the current jQuery collection.\nInside the body of your $, the\
    \ focus of this shifts to the current DOM element that's\nexposed in that particular\
    \ iteration. The following code example shows this:\n\n```\nfunction(){\n  //\
    \ plugin definition\n  $.fn.pinkify = function () {\n    // this refers to jQuery,\
    \ each() is immediately available\n    return this.each(function () {\n      //\
    \ inside the loop refers to the DOM element\n      $().css({\n        \"background\"\
    \ : \"#fe57al\",\n        \"color\" : \"#fff\",\n        \"text-shadow\" : \"\
    #none\"\n      });\n    });\n  });\n}(jQuery);\n```\n\n> Code snippet is from\
    \ remember-this.txt\n\n# Always Ensure that $ Points to jQuery\n\nOne of the most\
    \ important pieces of code to use when authoring jQuery plugins is also one of\
    \ the\nsimplest. Without fail, you should use an immediately executing function\
    \ expression that binds $"
  merge: -1
  pgno: 266
- img_proc: true
  md: "jQuery. It's always possible that some other library (commonly PrototypeJS)\
    \ or other code has rewritten to some point value, so it's vital to protect against\
    \ eventuality.\n\nThe following code shows how to do this. A function expression\
    \ is wrapped around the plugin definition. It accepts one argument, and because\
    \ the function is immediately executed with jQuery as the same argument, $ is\
    \ guaranteed to bound to jQuery.\n\n```\n(function($() {\n  $.newStuff = function()\
    \ {\n    /* $ is now jQuery, no matter what value\n     * $ might have in the\
    \ global namespace\n    */\n  };\n})( jQuery );\n```\n\nCode snippet is from jquery-is-jquery.txt\n\
    \nAdditionally, there's a common enhancement to this pattern that's worth taking\
    \ look at. It creates local references for window and document and ensures that\
    \ undefined remains undefined. This pattern provides several benefits.\n\nHaving\
    \ local references for window and document allows them to be minimized inside\
    \ the function body (by byte counts) and speeds up access to those objects inside\
    \ the function body by shortening the lookup table.\n\nAdditionally, undefined\
    \ can be reassigned in older versions of the ECMScript standard, it's a source\
    \ of potential bugs if someone accidentally or maliciously redefines undefined.\
    \ Defining it as an argument and not defining it is a clear way to ensure that\
    \ the value is as expected.\n\n```\n(function($, window, document, undefined)\
    \ {\n  $.newStuff = function() {\n    /* $ is now jQuery, no matter what value\n\
    \     * $ might have in the global namespace\n    */\n  };\n})( jQuery, window,\
    \ document );\n```\n\nCode snippet is from window-document.-undefined.txt\n\n\
    # Use Semicolons Properly\n\nIf you're lucky enough to have your plugin use, it's\
    \ important to remember that they'll probably end up concatenating your script\
    \ along with other code. It's worth paying attention to proper semicolon usage.\n\
    \nIf you follow good coding practice, you should be fine, but it's especially\
    \ important when your code is going to live on unknown environments.\n\nFor reference,\
    \ the Google JavaScript Style Guide (http://google-styleguide.googlecode.com/svn/trunk/javascript.xml#Semicolons)\
    \ says the following about semicolons:"
  merge: -1
  pgno: 267
- img_proc: true
  md: "Relying on implicit insertion can cause subtle, that debug problems. Don't\
    \ it. You're better than that.\n\nTranslated — semicolons are your friend.\n\n\
    Additionally, it's a relatively common practice to include a leading semicolon\
    \ in your plugin definition to ensure your code will function properly in a minified\
    \ and concatenated environment. It's possible (even likely) that other code will\
    \ be broken when minified because of poor semicolon usage or buggy matters. Inserting\
    \ a semicolon at the beginning of your plugin definition ensures that any previous\
    \ statements will be explicitly ended at that point.\n\n```\nfunction($, window,\
    \ document, undefined) {\n  $fn.newStuff = function() {\n  };\n}}(jQuery, window,\
    \ document);\n```\n\n# Return the jQuery Object Wherever Possible\n\nWith in mind,\
    \ it's clear that one of the key features of jQuery is the ability to chain methods.\
    \ The concise, \"Fluent\" feel of the API by chaining was one of the features\
    \ that really drew people into the library, and remains a popular feature for\
    \ jQuery and other JavaScript libraries, large and small.\n\nThis feature is enabled\
    \ by the jQuery API, wherever possible, returning this, which points to the jQuery\
    \ object. Because your plugins live in that same environment, it's vital that\
    \ your plugin also return the jQuery object wherever possible. Most of the time,\
    \ your plugins will follow the pattern outlined in the following code example.\
    \ It returns in its immediate scope and maintains the full collection so that\
    \ it can be passed along to other jQuery methods.\n\n```\nfunction($) {\n  $fn.pinkify\
    \ = function() {\n    return this.css({\n      \"background\" : \"#fe57al\",\n\
    \      \"color\" : \"#fff\",\n      \"text-shadow\" : \"none\"\n    });\n  };\n\
    };}(jQuery);\n```"
  merge: -1
  pgno: 268
