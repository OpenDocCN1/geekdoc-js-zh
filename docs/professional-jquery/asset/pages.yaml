  md: "# Determining the Current Time\n\nFor checking the current time, use the $.now\
    \ shortcut, as its name implies. It's a shortcut for (new Date).getTime(), and\
    \ obviously it's much easier to write $.now().\n\n# Detecting Browser Features\n\
    \nYou've probably heard that it's better to detect browser features rather than\
    \ detect browsers. Using the $.support() method you can detect what features a\
    \ browser supports. This function detects $.browser from earlier versions of jQuery.\
    \ A good example of use is: if $.support.ajax() } to check if a browser supports\
    \ Ajax requests (aka XMLHttpRequest object creation).\n\n# Evaluation in the Global\
    \ Context\n\nThe last utility method we use is .globalEval(). You may recall the\
    \ eval() expression, used to execute JavaScript code:\n\n```\n// create a variable,\
    \ and initialize it to 0 after DOM elements are loaded\n$(function() {\n  eval(\"\
    var x = 0;\");\n});\n```\n\nThe context of eval is not global, but rather local.\
    \ You may want the execution context for your statements to exist globally, or\
    \ when loading external JavaScript files. This is where .globalEval() comes into\
    \ play:\n\n```\n// in global context\n$(function() {\n  $.globalEval(\"var x =\
    \ 0;\");\n});\n```\n\nTable 3-2: Summary of Utility Methods discussed.\n\n| METHOD\
    \ | CATEGORY | DESCRIPTION |\n| --- | --- | --- |\n| $.type() | Utilities | Determine\
    \ the internal JavaScript [[Class]] of an object. |\n| $.isEmpty() | Utilities\
    \ | Check if an object is empty (contains no properties). |\n| $.isPlainObject()\
    \ | Utilities | Check if an object is a plain object (created using \"{}\\ or\
    \ \"new Object\"). |\n| $.extend() | Utilities | Merge the contents of two or\
    \ more objects together into the first object. |\n| $.isFunction() | Utilities\
    \ | Determine if the argument passed is a JavaScript function object. |"
