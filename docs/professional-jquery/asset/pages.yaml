- img_proc: true
  md: 'As you''ll soon see, the benefits are potentially significant, ramping up to
    unit testing in your development toolbox is a worthwhile effort.


    # WHAT IS UNIT TESTING?


    Unit testing is a software practice where individual pieces of code (called units)
    are tested to determine their viability for a specific task. Units should be as
    small as possible, have one or a few inputs, and a single output.


    Unit tests are generally automated, either as a part of a build process, or as
    a pre-commit hook check-ins or some other step of the software life cycle. Each
    test returns a binary/fail result.


    Unit testing is a vital partner of software testing much more familiar to JavaScript
    developers: functional testing. Functional testing, what most people think of
    as “QA”, or more formally, acceptance testing, tests the site or application from
    the end user''s perspective, after it completes. Unit tests flip the model on
    its head. Unit tests are written alongside the code they''re meant to test and
    are, most importantly, written from the developer''s perspective.


    Instead of testing the result, an end user will see unit tests the expected result,
    from a software perspective, of a piece of code.


    # Benefits of Unit Testing


    Some of the benefits of unit testing should be obvious. Testing code early and
    often improves quality by uncovering issues that might be missed over with simple,
    unstructured developer tests. Better quality code means fewer bugs during functional
    testing or worse, in production.


    > “Fewer bugs” should make everyone involved with your project happy, including
    your users.


    Beyond producing better code at the start of a project, one other key use of unit
    testing is automated regression testing. This is one of the most important uses
    of unit testing in the jQuery project itself. Using automated unit tests ensures
    that new features and/or bug fixes do not introduce other errors. This is a key
    to ensuring the stability of the library.


    Rick Waldron''s line in the jQuery Bug Fixing Guide (http://weblog.bocoup.com/javascript-jquery-bug-fixing-guide)
    below (in all caps) the importance of this with the admonition “ALWAYS RUN THE
    FULL SUITE BEFORE COMMITTING AND PUSH A PATCH!” That’s clarity.


    Running the full suite and ensuring all tests still pass the code you''ve added
    to, but not subtracted from, the library as a whole.


    The unit testing architecture allows for easier refactoring. Because you know
    exactly what tests a particular piece of code needs to, you can more confidently
    refactor code without the nagging fear that you''re missing something or other.
    No developer will feel the fear that the code she or he has rewritten will bring
    the application crashing down. Passing existing unit tests alleviates that significantly.


    Additionally, good unit testing relies on testing standalone modules, for unit
    testing forces developers to write more loosely coupled code. You want to avoid
    writing tests that spread'
  merge: -1
  pgno: 303
- img_proc: true
  md: "# What Is Unit Testing? | 283\n\nacross than one module, you're forced to write\
    \ more abstract interfaces for inputs and outputs that can more easily be mocked\
    \ in a testing framework.\n\nCoding for standalone unit tests also means that\
    \ code can be tested and verified well before other, dependent systems are complete.\
    \ With a well-documented interface and well-written unit tests, modules can be\
    \ coded even if other modules are to be created later in the process. This can\
    \ be especially beneficial with large teams spread across different organizations.\
    \ A consultant can come in, create a module for which he's specifically suited,\
    \ and if his code is well tested and works he could theoretically move on to the\
    \ next gig, before the rest of the organization catches up to his progress. This\
    \ doesn't negate the need for integration tests (to ensure that the actual systems\
    \ function as expected when coupled), but it should alleviate many of the surprises\
    \ that it can pop up with a structured approach to development.\n\n# Test-Driven\
    \ Development\n\nUnit testing is the foundation of an advanced software methodology\
    \ called Test-Driven Development (TDD). TDD encourages short development cycles\
    \ by centering the development life on small units. A developer will start by\
    \ writing a failing unit test. He will then write the minimum amount of code to\
    \ pass that failing test. Finally, he'll move on to the next feature and/or refactor\
    \ the code for better quality. Although this chapter doesn't go into specific\
    \ TDD practices, TDD is often mentioned alongside unit testing, so the relationship\
    \ is important to point out.\n\nBasically, you can't TDD without unit tests, unless\
    \ you can unit test without signing up to practice the full spectrum of TDD.\n\
    \n# Understanding What Makes a Good Unit Test\n\nNow that you know the basics\
    \ of unit testing, it's important to get a sense of how to create a quality unit\
    \ test.\n\nThere are several hallmarks of a good unit test. The following list\
    \ outlines some tenets to follow. In general, unit tests should be:\n\n+   * **Automated**:\
    \ Getting developers to do anything is hard enough as it is. Testing has to be\
    \ as easy as possible or else there won't buy-in from the front lines.\n* **Fast**:\
    \ Anything else and developers are going to be less likely to get to the testing\
    \ program.\n* **Focused**: This should test as narrow a component as possible\
    \ to cut down ambiguity.\n* **Independent**: This can be approached from two different\
    \ angles. Both are important:\n    * **Self-contained**: Tests need to be atomic.\
    \ This means that you may need to use some code to stand in external inputs/outputs.\
    \ This code is known in testing circles as \"mocks\" or \"stubs.\" You see more\
    \ mocks later in the chapter.\n    * **Standalone**: In addition to having no\
    \ external dependencies, unit tests should be able to run in any order, without\
    \ having sequential dependencies on any other test."
  merge: -1
  pgno: 304
- img_proc: true
  md: '+   Consistent: Tests should always return the same results.


    +   Readable: Tests should be clear in intent and focus so that the developers
    that follow you onto a project will be able to pick up the purpose of your tests
    without much ramp-up time.


    +   Maintainable: Unit tests will live with your project, so they should be maintainable.
    Having out-of-date tests is better than having no tests at all, but out-of-date
    tests will cause their own problems.


    +   Trustworthy: Developers should have complete confidence in the result of a
    unit test.


    Now that you''ve got a handle on unit testing in general, it''s time to take a
    look at the star of the show, QUnit.


    # # GETTING STARTED WITH QUNIT


    QUnit was born May 2008, out of the jQuery project''s one testner. As it evolved,
    it was spun off as a separate project, gaining a name, documentation, and eventually
    being completely decoupled from jQuery.


    If you''re comfortable with the concepts of unit testing in general, getting up
    and running with QUnit is relatively straightforward. The following section outlines
    the key structure of QUnit testing and illustrates the basic assertions you''ll
    use to test your code.


    # # The QUnit Hello World equal


    The following file shows a bare-bones QUnit test. It contains a copy of jQuery,
    a copy of the QUnit script file, a copy of the QUnit CSS file, and some markup
    that make up the body of the test itself.


    The script blocks the QUnit method `test`. test does what the name implies - it
    sets up a test to run. It accepts a pair of arguments, a name, "Hello World,"
    and a function that actually represents the test. The function argument uses the
    QUnit function `equal`. In unit testing terminology, `equal` is referred to as
    an *assertion*. An assertion indicates what you expect the code to do. As the
    name implies, `equal` equivalence accepts three arguments: an `actual`, `expected
    value`, and a `message` to display alongside the assertion.


    The markup contains several QUnit-specific HTML elements:'
