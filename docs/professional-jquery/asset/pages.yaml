  md: '# # 1


    # ## Getting Started


    # ### WHAT''S IN THIS CHAPTER?


    +   - What jQuery is Good At

    - The jQuery "Hello World" Code Conventions and Development Tools


    You probably spend more time in front of a computer than with your significant
    other. Hence, having a nice comfortable seat, a fast computer, and software that
    accelerates development is essential.


    Starting with the basics, we''ll review requirements, different ways to obtain
    jQuery, and how to run it on both client and server, and set up some conventions
    for the rest of the book, using Google''s JavaScript standards.


    In this chapter we set up your work environment for developing and debugging jQuery
    and JavaScript code. A major portion of development time goes into debugging,
    so a good debugger isn''t really an option. After reviewing Firebase, Chrome,
    and IE debuggers a portion of this chapter covers debugging JSON, tools for inspecting
    HTTP headers, and the JSint code quality tool.


    You learn to package your .js files for production use, explore tools, and establish
    some coding conventions.


    # ## WHAT QUERY IS GOOD AT


    Without a doubt, one of the strong points of using jQuery is how it diminishes
    many cross-browser concerns. Without it, writing cross-browser compatible JavaScript
    code is tedious, and unnecessary, exercise. It''s difficult not to marvel at much
    time we are saving things running in both IE and Firefox with jQuery. The core
    is also excellent at traversing the DOM tree and selecting elements. It''s also
    very lightweight, with the production version standing at 29 kb, which is minified
    and compressed. That''s a lot of kick for a small file. When debugging and testing,
    you''re better off using the uncompressed development version, which is 212 kb.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'jQuery is also good at handling fairly complex JavaScript code with relatively
    little code. This was one of my initial attractions to the framework. For a newbie
    trying to learn the “ropes” with Ajax, jQuery lowers the learning curve. Understanding
    what’s going on under the hood is important, but as a first step, using $.ajax()
    isn’t a bad start.


    An active community means active support. Googling returns about 36.8 million
    results at the time of writing. New official and third-party plugins come out
    every day, extending its core functionality. With many projects dependent on jQuery,
    it’s easy to find help online (and really cool print books too).


    With that said, it might be overkill in some cases. Remember that the jQuery library
    has some overhead, even if it’s small, and if you’re only using the selectors
    to get an element by its ID, the built-in JavaScript capability of the browser
    is enough. But, if you plan to build a featurerich, dynamic Ajax web application,
    jQuery is the way to go.


    # HARDWARE AND BROWSER REQUIREMENTS


    Your requirements for running jQuery are very light: a computer, smartphone, or
    device capable of running a modern browser. The browser requirements are fairly
    liberal as well. The official site lists the following browsers that are supported
    as well:


    +   * Firefox 2.0+

    * Internet Explorer 6+

    * Safari 3+

    * Opera 10.6+

    * Chrome 8+


    The following browsers are known to give problems:


    +   * Mozilla Firefox 1.0.x

    * Internet Explorer 1.0–5.x

    * Safari 1.0–2.0.1

    * Opera 1.0–9.x

    * Konqueror


    Quirksmode has a great page detailing CSS compatibilities of different browsers,
    including CSS3. To find out more visit www.quirksmode.org/css/contents.html.


    # OBTAINING JQUERY AND QUERY UI


    Besides the links found at jquery.com for downloading the production and development
    versions, you have two other options for obtaining or linking to the jQuery libraries.
    You can link to several content delivery networks (CDNs) in your applications
    such as Google, Microsoft, and the jQuery CDN'
