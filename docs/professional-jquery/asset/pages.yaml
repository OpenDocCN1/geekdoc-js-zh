    # PROGRESSBAR


    Users to be informed. They want to know whether a progress is loading, an operation
    is being performed, or if it''s stuck. A progress bar is a classic tool for communicating
    this information to the end user. It''s important to keep in mind that the value
    of the progress bar displayed should be accurate, or you will still anger your
    users, at which point they may leave your page.


    The progressbar widget is fairly simple in comparison with the other widgets studied
    so far, and only accepts two options, of, summarized in Table 8-14.


    **Table 8-14:** Progressbar Options


    | OPTION | ACCCEP | DESCRIPTION |

    | --- | --- | --- |

    | Disabled | Boolean | Enables (true) or enables (false) the progressbar. |

    | Value | Number | Indicates the initial value of the progressbar widget |'
