    \ method of the Ajax request. This will generally be a GET or a POST, although\
    \ esoteric HTTP methods like PUT or DELETE are possible, depending on browser\
    \ support. |\n| data | Data to be sent to the server. |\n| dataType | The type\
    \ of data you're expecting back the server. The available types are: \"XML\",\
    \ \"HTML\", \"script\", \"JSON\", \"JSONSP\" and \"text\". |\n| success(data,\
    \ textStatus, jXHR) | A function to be called if the request succeeds. |\n| error(jqXHR,\
    \ textStatus, errorThrown) | A function to be called if the request fails. |\n\
    | complete(jqXHR, textStatus) | A function to be called when the Ajax request\
    \ is completed. |\n| timeout | Set a timeout (in milliseconds) for the request.\
    \ |\n\nThe following example sends a post to the URL /post/2/here.html, which\
    \ receives plain text, and logs the result on success, or displays any log on\
    \ error:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n<script type=\"text/javascript\">\n  $.ajax({\n```"
