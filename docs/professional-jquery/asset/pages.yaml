  md: '# ABOUT THE AUTHORS


    CESAR OTERO a freelance web developer currently living in Mountain View, California.
    His technical interests include Python, JavaScript, and jQuery. Cesar occasionally
    contributes articles to IBM''s developer works. He holds a degree in electrical
    engineering from the Inter American University of Puerto Rico.


    ![](img/16459f9d4793f783ab42cec76c544db0_8_0.png)


    ROB LARSEN has more than 12 years'' experience as a front-end engineer and team
    leader, building websites and applications for some of the world''s biggest brands.
    He is currently a Senior Specialist, Platform at Sapient Global.


    Prior to his time at Sapient, Rob spent time at Isobar, The Brand Experience,
    Cramer, and as an independent consultant. Rob has solved unique problems for clients
    like Adidas, Motorola, Philips, Reebok, Gillette, Boston''s Museum of Science,
    State Street Corporation, and Harvard Kennedy School.


    Rob is an active writer and speaker on web technology with a special focus on
    emerging standards like HTML5, CSS3, and the ongoing evolution of the JavaScript
    programming language. He''s also active in the open-source community, helping
    to bridge the gap between the front lines of web development and the people actively
    working on the tools that drive the web.


    ![](img/16459f9d4793f783ab42cec76c544db0_8_1.png)


    # ABOUT THE TECHNICAL EDITOR


    ANDREW MONTALENT is a technologist with over a decade of experience in software
    engineering, and over eight years of experience in web development. He is cofounder
    and CTO at Parse.ly, a tech startup that provides insights to the web''s best
    publishers. He is also the founder and CEO of Aleph Point, a boutique firm that
    specializes in large-scale text analysis, information retrieval, and UI design,
    with a focus on Python, Grails, and JavaScript web programming. He specializes
    in the rapid development of prototypes. Prior to becoming an entrepreneur, he
    was a team lead and project manager for a small, super-bright team within a top-tier
    investment bank.


    ![](img/16459f9d4793f783ab42cec76c544db0_8_2.png)'
