  md: "120 | CHAPTER 6 HTML FORMS, DATA, AND AJAX\n\nJust for the record, we’re aware\
    \ of the fact that we can assign “1999” directly to the alt attribute, but just\
    \ suppose you need to add the string programmatically. There’s a semantic problem\
    \ with this because the attribute used to store the data is not meaningfully associated.\
    \ Is 1999 a year, a random integer, or what? A better approach is to use jQuery’s\
    \ .data() method, which stores arbitrary data for any element with a meaningful\
    \ key. It takes the following form:\n\n```\n$.data( element, key, value );\n```\n\
    \nOr, to retrieve the stored data use:\n\n```\n$.data( element, key );\n```\n\n\
    For example:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"\"></script>\n\
    \  <script type=\"text/javascript\">\n  $(function() {\n    $(\"randomEl\").data(\"\
    itemPrice\", \"1999\");\n  }\n  </script>\n</head>\n<body>\n  <img src=\"usefulImage.jpg\"\
    \ id=\"randomEl\"></div>\n</body>\n</html>\n```\n\nNow it’s obvious that 1999\
    \ isn’t a year, but rather a price. HTML5 introduces custom data attributes, where\
    \ any attribute prefixed with data- can be used in a standardized, programmatic\
    \ way. For example, the following div contains the data attribute data-age. That’s\
    \ an alternative for storing information on the client side.\n\n```\n<div id=\"\
    person\" data-age=\"31\"></div>\n```\n\nMicrosoft contributed to the three additional\
    \ plugins that were, for a time, officially endorsed by the jQuery project; Data\
    \ Template, Data Link, and Globalization. In a later chapter we review the Template\
    \ plugin. The Data Link plugin allows two-way binding between objects. In other\
    \ words, it links the field of one object to another, so changing the value of\
    \ one field changes the corresponding field on the second object. You can use\
    \ this feature to simplify communication between a form and an object it removes\
    \ glue code. For example:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"\
    http://code.jquery.com/jquery-1.6.1.js\"></script>\n  <script src=\"datalink.js\"\
    ></script>\n  <script type=\"text/javascript\">\n  $(document).ready(function()\
    \ {\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_141_0.png)"
