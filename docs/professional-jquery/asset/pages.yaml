  md: '# TABLE 8-4: Available .tabs() Methods


    | METHOD | DESCRIPTION |

    | --- | --- |

    | $(selector).tabs(); | Initializes the tab widget on the selected element. |

    | $(selector).tabs("destroy"); | Removes the tab completely. This option rolls
    the selected element back to its initial state. |

    | $(selector).tabs("disable"); | Disables the tab widget. |

    | $(selector).tabs("enable"); | Enables the tab widget. |

    | $(selector).tabs("option", optionName, [value]); | Gets or sets any tab option.
    If the third argument is omitted, it acts as a getter. Otherwise, it sets the
    optionName with the provided value. |

    | $(selector).tabs("widget"); | Returns the ui-elements. |

    | $(selector).tabs("add", url, label, [index]); | Adds a new tab widget. The url
    argument is either a fragment identifier for an in-page tab or a full URL for
    a remote (Ajax) tab. The label argument represents the text for the new tab. The
    optional index argument is the zero-based position to insert the new tab. |

    | $(selector).tabs("remove", index); | Removes the tab widget. The index argument
    indicates the tab to be removed. |

    | $(selector).tabs("enable", index); | Enables a disabled tab widget. The second
    index argument indicates the tab to be enabled. |

    | $(selector).tabs("disable", index); | Disables a tab widget. As a note, the
    currently selected tab cannot be disabled. The second index argument indicates
    the tab to be disabled. |

    | $(selector).tabs("select", index); | Selects a tab widget, as if it were clicked.
    The second index argument indicates the tab to be selected or the id selector
    of the associated panel. |

    | $(selector).tabs("load", index); | Reloads the tab widget. The second index
    argument indicates the tab to be loaded. |

    | $(selector).tabs("url", index, url); | Changes the url from which an Ajax tab
    will be loaded. The second index argument indicates the tab to be removed. The
    third argument is the url to load the new content. |

    | $(selector).tabs("length"); | Retrieves the number of tabs of the first matched
    widget. |

    | $(selector).tabs("abort"); | Terminates all running ajax requests and animations.
    |

    | $(selector).tabs("rotate", ms, [continuing]); | Sets up an automatic rotation
    of tabs. The ms argument indicates the time between rotations. The third argument,
    continuing, controls whether or not the rotation continues after a tab has been
    selected by a user.'
