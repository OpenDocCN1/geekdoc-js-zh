  md: "```\nif (!$.data(this, 'plugin_' + pluginName)) {\n  $.data(this, 'plugin_'\
    \ + pluginName,\n    new Plugin(this, options));\n}\n}\n\n}(jQuery, window, document);\n\
    ```\n\n> Code snippet is from jquery.basic.plugin-boilerplate.\n\nAs you can see,\
    \ this boilerplate code encapsulates all the best practices illustrated in this\
    \ chapter and adds a couple of important enhancements, such as preventing multiple\
    \ plugin instantiations looking for the presence of the plugin in $.data.\n\n\
    You can't go starting with such a solid foundation, and because the project is\
    \ on Github, you will benefit from the ongoing vais and tweaking offered up by\
    \ the larger jQuery community.\n\n# CLOSER LOOK AT THE WIDGET FACTORY\n\nIt touched\
    \ upon briefly, the Widget Factory provides an alternative, powerful path to jQuery\
    \ plugin development. It's a slightly more advanced option, but it offers several\
    \ features that might be beneficial depending on the style of plugin you're looking\
    \ to write. The following list outlines some of the useful features that come\
    \ along automatically once you go into the Widget Factory method of plugin creation.\
    \ You'll notice that many of these were touched on in previous sections. They\
    \ come along for the ride with the Widget Factory.\n\n+   * Prevention of multiple\
    \ instances of the plugin on the same object.\n* Methods to enable, disable, or\
    \ destroy the widget.\n* Widgets are stable, destroying the instance DOM element\
    \ to its original state.\n* Namespace and prototype selector.\n* A pseudoselector\
    \ is also generated from the namespace and name.\n* The ability to override defaults\
    \ with new options.\n* Default values are exposed to set plugin defaults.\n* Methods\
    \ for setting and responding to changes in plugin options.\n* Plugin instance\
    \ accessible via the object's stored data.\n* Automatic method lookup table.\n\
    \nAlthough the earlier example you was a one-liner, truly getting up and running\
    \ with the Widget Factory is significantly more involved than a one-liner.\n\n\
    The following code shows the minimum to get a $.widget plugin going. Pass it a\
    \ namespace to run under and an object literal to serve the prototype of your\
    \ widget. The ideal object should include an options object; a _create function,\
    \ which will automatically run the first time the widget is called; a _destroy\
    \ (or destroy, if you're using 1.8) function, which destroys an instantiated plugin\
    \ and cleans up the DOM; _setOption, which responds to option changes; and then\
    \ your plugin methods."
