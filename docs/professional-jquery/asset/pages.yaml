    \ the traditional loop executes in one scope, any variables defined outside the\
    \ loop still remain in the current scope.\n\n# Caching Objects\n\nBuilding on\
    \ the idea of using local variables to speed up your script, you'll also want\
    \ to think of caching objects in local scope to avoid additional script overhead.\
    \ In general, if you're going to use an object more than once in a function, it's\
    \ useful to cache that object in a local variable. It shortens lookup time, and\
    \ if the variable is the result of a jQuery call, it cuts down on the number of\
    \ times jQuery needs to do its selector match.\n\nIt's very common to need to\
    \ do this with $(this) because the object bound to a function is often the subject\
    \ of multiple operations in a function.\n\nAs a matter of style, when the object\
    \ being saved to a local variable is a jQuery object, it's also helpful to append\
    \ $ to the variable name. This indicates to anyone else on the project that it's\
    \ more than just a plain variable and has jQuery methods baked right. Listing\
    \ 10-4 shows a example that illustrates this technique on two separate variables.\n\
    \n+   LISTING 10-4: Caching objects for repeated use\n\n```\nvar this = $( this\
