    and element normalization in legacy versions of Internet Explorer.


    ```

    http://www.modernizr.com/

    ```


    **QUnit** QUnit is a powerful, easy-to-use, JavaScript test suite used by the
    jQuery project to test its code and plugins.


    ```

    http://docs.jquery.com/QUnit

    ```


    **Data Link Plugin** The Data Link plugin links objects together, allowing for
    each object''s properties to update when one or more properties change.


    ```

    https://github.com/jquery/jquery-datalink

