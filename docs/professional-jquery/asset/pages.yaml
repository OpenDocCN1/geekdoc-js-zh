    myList\">\n  <ul>\n    <li>foo/</li>\n    <li>bar/</li>\n  </ul>\n</div>\n</body>\n\
    </html>\n```\n\nCode snippet is from all-selector.txt\n\nBy default, when selecting\
    \ elements, jQuery searches through the entire DOM tree. At times, you may search\
    \ through a subtree of the DOM. You can accomplish this by passing an optional\
    \ second parameter to the jQuery function to give the selection a context. For\
    \ example, say you have a series of links you'd like to retrieve from a single\
    \ div in the DOM. You could do the following:\n\n```\n$(\"a\",.js_links#div);\n\
    ```\n\n# Selecting by CSS Styles\n\nIn a similar fashion to CSS, if you want to\
    \ select elements by class, use a dot (.). For example:\n\n```\n$(\"p.highlighted\"\
    );\n```\n\nUp to now, you've selected elements using the format $(\"#id\"),$(element.class),\
    \ or something similar. It's not actually necessary to precede any of these selectors\
    \ with an element name followed by the dot. It's just as valid to rewrite the\
    \ previous examples like this:\n\n```\n$(\\#stuffId\")\n(\".myCssClass\")\n```\n\
    \nBecause characters such as hash (#) have special meaning, if you want to use\
    \ them in selection expressions, you'll need to backslash escape those characters.\
    \ The following list of characters contain special meaning inside of selectors,\
    \ and should be backslash escaped if you want to match them:\n\n```\n# ; & . +\
    \ * ~ - ' : ! ^ $ [ ] ( ) = > /\n```"
