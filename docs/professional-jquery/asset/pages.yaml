- img_proc: true
  md: 'Dragging and dropping aren''t features that are available to web pages by default,
    although they are common idioms of everyday computer use. Thankfully, jQuery UI
    makes it simple and approachable. Although the actions are coupled, they require
    separate calls.


    A component is made by calling the jQuery UI draggable method, $(selector).draggable(),
    as simple as that. Many of the method calls you''ve seen in this book, the .draggable()
    method is overloaded, reducing namespace clutter. (See Table 9-1).


    # TABLE 9-1: $.draggable() Methods


    | METHOD | DESCRIPTION |

    | --- | --- |

    | $(selector).draggable(); | Makes selected element draggable. |

    | $(selector).draggable("destroy"); | Removes the draggable functionality completely.
    This option returns the selected element back to its initial state. |

    | $(selector).draggable("disable"); | Disables the draggable element. |

    | $(selector).draggable("enable"); | Enables the draggable element. |

    | $(selector).draggable("option", optionName, "value"); | Gets or sets any draggable
    element. If the third argument is omitted, acts as a getter. Otherwise, it sets
    the optionName with the provided value. |

    | $(selector).draggable("widget"); // | Returns the .ui-draggable element. |


    Table 9-2 shows the different options for draggable elements.


    # TABLE 9-2: Draggable Elements


    | OPTIONS | ACCEPTS | DESCRIPTION |

    | --- | --- | --- |

    | disabled | Boolean | Enables/disables the draggable functionality. |

    | addClasses | Boolean | Prevents adding the ui-draggable class when set to false.
    |

    | appendTo | Element, Selector | Defines where the helper element is appended
    during the drag. |

    | axis | String | Constrains movement to either the x or y axis. |

    | cancel | | Prevents dragging from starting on specified elements. |

    | connectToSortable | Selector | Allows the selected draggable element to be dropped
    on a sortable element. |'
