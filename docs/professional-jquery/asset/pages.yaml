  md: "Similarly, if your plugin needs to store data, it's best to store it under\
    \ a single $.data entry. If you need to store multiple pieces of data, you should\
    \ do so with an object literal containing all of the necessary data in that single\
    \ $.data entry.\n\nThe following example code shows the use of an object literal\
    \ with $.data:\n\n```\nvar data = this.data('bestPluginEver');\nif (data) {\n\
    \  this.data('bestPluginEver',{\n    \"color\": \"blue\",\n    \"title\": \"my\
    \ dashboard\",\n    \"width\": \"960px\"\n  });\n}\n```\n\nCode snippet is for\
    \ namespaced-data.txt\n\nIf you follow these simple guidelines, the danger of\
    \ a namespace collision is significantly reduced. This will save you, somewhere\
    \ down the road a mess of trouble.\n\n# Accept Options to Control Plugin Behavior\n\
    \nThere’s nothing more frustrating as a developer trying to remember the order\
    \ of arguments in a function or method call — \"Does the code to execute before\
    \ or after the number of milliseconds in setTimeout?\" One or two are okay more\
    \ than that and you’re likely to have to go to the documentation to figure out\
    \ what argument goes where.\n\nAdditionally, in case you have multiple, optional\
    \ arguments, you can run into confusing function calls strewn with myArgs, like\
    \ this:\n\n```\nsoManyOptions(\"#myDiv\", 14, \"ff0000\");\n```\n\nCode snippet\
    \ is from empty-arguments.txt\n\nNo one wants to deal with code like that. It’s\
    \ confusing (“Am I on the fifth argument or the fourth”) and honestly, ugly.\n\
    \nTo alleviate that, it's recommended that you accept an object as an argument\
    \ that can extend the default settings when the plugin is invoked. The following\
    \ code illustrates accepting options argument and using $.extend to merge it with\
    \ the plugin defaults.\n\nThis is the preferred way to use $()\n\n```\n$(function()\
    \ {\n  $.fn.bestPluginEver = function(options) {\n    var settings = $.extend({\n\
    \      \"color\": \"blue\",\n      \"title\": \"my dashboard\",\n      \"width\"\
    : \"960px\"\n    });\n  }\n```"
