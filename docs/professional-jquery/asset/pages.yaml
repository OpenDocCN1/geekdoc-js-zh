  md: "# Selecting by Attributes\n\njQuery allows for an extraordinary amount of flexibility\
    \ for selecting elements according to their attributes. First, and most obvious,\
    \ is selecting an attribute that matches an exact string pattern:\n\n```\n$*[attributeName='string2match']\n\
    ```\n\nor\n\n```\n$*[attributeName='string2match']\n```\n\nBut, there are also\
    \ attribute selectors reminiscent of regexes, so you can match part of a string\
    \ as well; for example, the attribute starts and ends selectors. The attribute\
    \ starts selector all elements that begin with a specified string. Likewise, the\
    \ attribute ends selector selects all elements that end with a particular string:\n\
    \n```\n$*[attributeName^='value']; // attribute starts\n$*[attributeName$='value'];\
