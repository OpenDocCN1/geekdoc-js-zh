  md: "```\n// my comment\nvar x = 'blah';\n\nvar x = 'blah'; // bad\n```\n\n+   **Equality:**\
    \ Always use identity (===) comparison over simple quality (==). The jQuery team\
    \ makes the exception of using simple when testing for null. As the guidelines\
    \ say, \"It’s actually quite useful to do == null != null as it will pass (or)\
    \ if the value is either null or undefined.\"\n\n+   **Block presentation:** Always\
    \ use braces for control structures (if/else/while/try), and distribute over multiple\
    \ lines. Don't use the one liner if without braces. Braces should always be placed\
    \ on the same line as else/else if/catch. It's also suggested to avoid replacing\
    \ if/else statements with ternary operators. Here are some examples:\n\n```\n\
    // bad\nif(stuffHappens ) alert('blaaah');\n\n// good\nif(stuffHappens) {\n  alert('blaaah');\n\
    }\n\n// also good\nif (option) {\n  // code here\n} else {\n  // code here\n}\n\
    ```\n\n+   **Function format:** Include extra spaces around function call arguments\
    \ with the exception of when a function is nested, a function call is empty, or\
    \ object literals and arrays are passed:\n\n```\n// These are OK\nf( arg);\nf(g(arg));\n\
    f();\nf({});\nf([]);\n```\n\n+   **Arrays and objects:** No extra spacing is preferred\
    \ for empty object and array literals, but do use a space between colons and colons:\n\
    \n```\nvar a = {};\nvar b = [];\nvar c = [ 1, 2, 3 ];\n```\n\n+   **Assigning\
    \ variables/objects:** Always use a semicolon at the end of assignments with an\
    \ inline ending. As noted by the Google Style Guide, semicolons should always\
    \ be used.\n\n+   **Type checks:** Table 1-1 demonstrates what strings to use\
    \ when doing a type check."
