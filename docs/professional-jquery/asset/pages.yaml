  md: "# Garber-Irish Implementation\n\nThe following pattern expands on the singleton\
    \ and module pattern with cleverly chosen markup and style hooks to create a seamless\
    \ initialization pattern for sites and applications.\n\nThis pattern was introduced\
    \ in 2009 by Paul Irish in a blog post titled \"Markup-based unobtrusive comprehensive\
    \ DOM-ready execution\" (http://paulirish.com/2009/markup-based-unobtrusive-comprehensive-dom-ready-execution/)\
    \ and later modified by Jason Garber in a blog post titled \"Extending Paul Irish's\
    \ comprehensive DOM-ready execution\" (http://www.vigiget.com/inspire/extending-paul-irish-comprehensive-dom-ready-execution/).\n\
    \nIn short, it leverages a small utility script and either CSS classes or HTML5\
    \ data attributes on the body element to selectively `init()` events depending\
    \ on the site or page type. This pattern alleviates the problem of trying to hunt\
    \ down `$(document).ready()` calls throughout an application, instead providing\
    \ consistent, structured approach that works across multiple domains (server code,\
    \ JavaScript, and script).\n\nYou can use this recipe, depending on your taste,\
    \ I'll share both. First is Paul's original version.\n\n# The Original Recipe\n\
    \nThe pattern starts with a typical object literal. This variation has a couple\
    \ of enhancements that are shown in Listing 10-12. Take note of the sections with\
    \ `init` and the common section, which contains a method called `finalize`. The\
    \ `init` methods are designed to fire on `$(document).ready()` when the relevant\
    \ section or feature is needed. This is determined by the HTML structure which\
    \ will be shortly. The `finalize` methods are for code that needs to execute as\
    \ soon as possible but not affect the initial load of the page.\n\n+   LISTING\
    \ 10-12: Object literal enhanced for \"markup-based unobtrusive comprehensive\
    \ DOM-ready execution.\"\n\n```\nmyApp = {\n  common: {\n    init: function()\
    \ {\n      //init()\n    },\n    finalize: function() {\n      //we're saving\
    \ these for a little later\n    }\n  },\n  dashboard: {\n    init: function()\
    \ {\n      //dashboard init\n    },\n    settings: function() {\n      //dashboard\
    \ settings\n    },\n    render: function() {\n      //render\n    }\n  }\n}\n\
    ```\n\ncontinues\n\n![](img/16459f9d4793f783ab42cec76c544db0_234_0.png)"
  merge: -1
  pgno: 234
