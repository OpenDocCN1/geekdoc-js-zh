    ```


    # Consider Skipping jQuery Methods Entirely


    If performance is of concern to your site or application, it''s useful to skip
    jQuery methods entirely, falling back to quicker core JavaScript methods and properties.
    One example is using attr("href") the href attribute and then using attr(\() to
    apply it to any element:


    ```

    $("baz").attr("href").attr("href") );

    ```


    If you know core JavaScript, the preceding line code can be rewritten as follows:


    ```

    document.getElementById("baz").href = this.href;

    ```


    As you can see, calls to jQuery are removed because you use document.getElementById
    to reference the element in question and use direct lookups to the href attribute
    of each element'
