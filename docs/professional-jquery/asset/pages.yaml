  md: "# APPLYING JQUERY EVENT HANDLERS\n\nThe jQuery way to bind a function to an\
    \ event is through the .bind() method, which accepts three arguments: the event\
    \ type, data, and the function handler. For example, to bind a mouseover event:\n\
    \n```\n$(\\#objId).bind('mouseover', function(event) {\n  // code here...\n});\n\
    ```\n\nIn this example, an element, objId is selected by id and a mouseover event\
    \ bound to an anonymous function.\n\nTable 5-4 lists all the available event handlers.\n\
    \n**TABLE 5-4:** Query Events\n\n| blur() | mouseenter() |\n| --- | --- |\n| focus()\
    \ | mousemove() |\n| select() | mouseout() |\n| submit() | mouseover() |\n| click()\
    \ | mouseup() |\n| dblclick() | toggle() |\n| focusin() | error() |\n| focusout()\
    \ | resize() |\n| hover() | scroll() |\n| mousedown() | |\n\nIt's also possible\
    \ to remove any bindings with .unbind(), which accepts a string denominating the\
    \ event type to unbind. Using the previous example as a reference, to remove the\
    \ binding do to the following:\n\n```\n$(\\#selectorHere).unbind('mouseover');\n\
    ```\n\nThis removes all events of type mouseover from the selected elements. If\
    \ you want the capability to unbind a particular class of events, events can also\
    \ be namespaced.\n\nThe element you want to bind an event handler may not exist\
    \ given the dynamic nature of JavaScript/jQuery. If this is the case, bind won't\
    \ work, instead use the corresponding method .live(). This is very useful for\
    \ cases where DOM elements are added on the fly in the following example, where\
    \ the click handler to a non-existent anchor element is bound using .live(). When\
    \ the .ready() event is executed, the anchor is dynamically added and is bound\
    \ to the click handler."
  merge: -1
  pgno: 124
