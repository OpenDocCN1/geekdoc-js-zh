  md: "# THE POWER OF JQUERY SELECTORS\n\nProbably at some point, every JavaScript\
    \ developer tries something similar to this. You want to find all of the rows\
    \ that have a CSS of \"highlighted,\" and you'd like to change it to a class of\
    \ \"normal\":\n\n```\nvar tr = document.getElementsByTagName('tr');\nfor (var\
    \ i = i; i < tr.length; i++) {\n  if (tr[i].class === 'highlighted') {\n    tr[i].class\
    \ = 'normal';\n  }\n}\n```\n\nIt works, but verbose. The jQuery way is more concise:\n\
    \n```\n$('tr.highlighted').removeClass('highlighted').addClass('normal');\n```\n\
    \nNo loop, if statement, no intermediate variables needed, and condensed from\
    \ six lines of code to one, but still verbose; bad at all. Here you're using a\
    \ few jQuery concepts: the selector, chaining, and utility methods. The important\
    \ point to note is that jQuery selectors greatly reduce the amount of code needed\
    \ to get an array of DOM elements.\n\n# Selecting Elements\n\njQuery provides\
    \ a myriad of ways to select DOM elements: you can select elements by attributes,\
    \ element type, element position, CSS class, or a combination of these. The syntax\
    \ for selecting elements is as follows:\n\n```\n$(selector, [context])\n```\n\n\
    or\n\n```\njQuery(selector, [context])\n```\n\nTo select elements by tag name,\
    \ use the tag name in the selector. For example, $(\"div\") retrieves all of the\
    \ divs in a document. Running the previous example in a \"JQueried\" console,\
    \ you can see the returned object in the Firebug window.\n\nIn the next example,\
    \ the same div selector expression is used, with three empty divs in the body.\
    \ With the length property, you can verify that the selector returns three elements\
    \ using a console.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n</head>\n<script>\n  $(document).ready(function() {\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_85_0.png)"
