    \ often than form, data is processed and posted to a server somewhere asynchronously;\
    \ rather than the old-fashioned post-process-reload technique. Here, you explore\
    \ one of the biggest revolutions in web development of the past 10 years — Ajax.\
    \ You also learn how insanely easy jQuery makes it, simplifying asynchronous communication\
    \ with the server.\n\n# ## JQUERY DATA APPRECIATION\n\nAn misused feature of tag\
    \ elements is using attributes such as alt or class to attach useful data to an.\
