  md: 'The Mozilla UI” (https://developer.mozilla.org/en/Writing_Efficient_CSS), the
    article lays out the way in which the browser parses the elements in a CSS selector
    and outlines several selector patterns that are particularly expensive.


    The basic takeaways from this article:


    +   - The engine evaluates each rule from right to left, starting with the “key”
    selector and moving through each selector until it finds a match or gives.

    - Using fewer selectors is generally more efficient.

    - Be as specific as possible — IDs are better than tags.

    - Avoid unnecessary redundancy.


    What’s interesting is JavaScript selector engines, including Sizzle and the built-in
    document.querySelectorAll, also use some of the same techniques and also benefit
    from the attention to efficiency.


    In general, keeping your selectors short and sweet (leveraging IDs, for example)
    and keeping your selectors as specific as possible will speed up your site you''re
    working with JavaScript or CSS.


    Table 10-3 illustrates applying these selector rules to jQuery. As you can clearly
    see, no matter what you are using, leveraging IDs and single classes are by the
    fastest ways to select an element. Anything more complicated than that is going
    to be much slower in every browser. It''s not always possible to use an ID or
    single class, but it''s fastest when you can.


