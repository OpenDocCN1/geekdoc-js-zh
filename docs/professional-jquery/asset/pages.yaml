  md: 'The .isEmpty() method is used to test whether an object contains any properties,
    including inherited properties, independent of object type:


    ```

    $.isEmpty("); // returns true

    $.isEmpty({}); // returns true


    var mailman = {};nmailman.letters = 100;

    $.isEmpty(mailman); // returns false

    ```


    There''s a similar .isPlainObject() method. It also tests whether an object contains
    any properties, but must be of an Object instance. An empty string will return
    false in this case:


    ```

    $.isPlainObject(""); // false

    $.isPlainObject({}); // true

    $.isPlainObject(new Object); // true

    ```


    You mean, "OK, that''s great, but what else can I do with objects? Glad asked.
    You can also merge two or more objects with the .extend() method. More specifically,
    .extend() combines the properties of one or more objects into a target object.
    In the next example, obj1 receives the properties of obj2 and obj3


    ```

    var obj1 = {"1":"property 1"};

    var obj2 = {"2":"property 2"};

    var obj3 = {"3":"property 3"};

    $.extend(obj1, obj2, obj3);

    console.log(obj1["3"]); // displays property 3

    ```


    An interesting note about .extend is that you can use it to clone objects (this
    is different from the .clone() method):


    ```

    var clonedObject = $.extend({}, anObject);

    ```


    .extend() accepts an additional first argument for a deep merge of objects, in
    other words, a recursive copy. You can also use this to do a deep clone of objects
    as:


    ```

    var clonedObject = $.extend(true, {}, anObject);

    ```


    # Functions


    jQuery has two utility methods for functions: .isFunction() and .noop(). As its
    name implies, .isFunction() tests whether an object is a function. Make sure not
    to put parentheses in the function name. In the next example, .isFunction() is
    passed to itself. Because it is itself a function, it must return true.


    ```

    $.isFunction(function()); // false

    $.isFunction($.isFunction); // true

    $.isFunction($.isFunction()()); // false, because of parenthesis

    ```'
