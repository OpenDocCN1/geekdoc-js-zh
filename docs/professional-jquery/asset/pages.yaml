  md: "# The Plugin Basics | 243\n\nIf you're unfamiliar with the concept of prototype\
    \ inheritance, it's the key element of JavaScript inheritance.\nSimply defined,\
    \ the prototype of a JavaScript object is another object that contains properties\
    \ and functions native to that type of object. The core JavaScript natives have\
    \ their own prototype property. The following code illustrates a use of a native\
    \ prototype. In this case, the example illustrates an enhancement of Array.prototype,\
    \ a polyfill for native EcmaScript functionality in nonconforming browsers. Running\
    \ this code adds an .every() method to all arrays created in the future or past\
    \ on the containing page.\n\n![](img/16459f9d4793f783ab42cec76c544db0_264_0.png)\n\
    \n```\n// https://developer.mozilla.org/JavaScript/Reference/Global_Objects/Array/every\n\
    if (!Array.prototype.every) {\n  Array.prototype.every = function (fun, this)\
    \ {\n    \"use strict\";\n    if (this === void 0 || this === null) {\n      throw\
    \ new TypeError();\n    }\n    var t = Object(this);\n    var len = t.length >>>\
    \ 0;\n    if (typeof fun !== \"function\") {\n      throw new TypeError();\n \
    \   }\n    var args = arguments;\n    for (var i = 0; i < len; i++) {\n      if\
    \ (i in t && !fun.call(this, i, t)) {\n        return false;\n      }\n    }\n\
    \    return true;\n  });\n}\n```\n\nCode snippet from every.txt\n\nOne interesting\
    \ thing to note that fn/prototype is live. Any all elements created of that type\
    \ are going to receive access to any prototype properties or methods added at\
    \ any time. JavaScript's dot operator is specified to search the expression on\
    \ the left of the operator for the key on the right, walking up the \"prototype\
    \ chain\" until it finds it. Instances of objects have their internal \"classes\"\
    \ as their prototypes, which is what makes the \"live\" for instances. This explains\
    \ why you're able to instantiate a jQuery at one point and then add features and\
    \ functionality to jQuery via scripts loaded later in the page cycle — seconds\
    \ or minutes later.\nThe most basic use of jquery.fn is as follows:\n\n![](img/16459f9d4793f783ab42cec76c544db0_264_1.png)\n\
    \n```\njquery.fn.newStuff = function () {\n  console.log('It's full of (javascript)\
    \ stars');\n};\n```\n\nCode snippet from basic-fin-plugin.txt\n\nThis initial\
    \ example is imperfect, but it's the minimum needed to add a new function to jQuery.\
    \ The pattern is enhanced and improved upon the following pages."
  merge: -1
  pgno: 264
- img_proc: true
  md: "# Using $.extend()\n\nIn addition to JavaScript prototypal inheritance pattern,\
    \ jQuery also offers a utility method called $.extend, which can be used to enhance\
    \ jQuery. As you learned in Chapter 3, at its most basic, $.extend is a method\
    \ that merges two objects. When it's called with only a single argument, it merges\
    \ the argument object into jQuery.\n\nThe following code extends jQuery with a\
    \ method named newStuff:\n\n```\njQuery.extend({\n  newStuff: function() {\n \
    \   console.log(\"It's full of (javascript stars)\");\n  }\n});\n```\n\n# jQuery\
    \ UI Widget Factory\n\nThe Widget Factory is a jQuery method that accepts two\
    \ or three arguments: a namespace, an existing widget prototype to inherit from,\
    \ and an optional object literal to become the new widget's prototype.\n\nThe\
    \ Widget Factory is used behind the scenes in the jQuery UI project, and it is\
    \ designed to create complex, stateful plugins with a consistent API.\n\nThe simplest\
    \ implementation would be a single line, like:\n\n```\n$.widget('namespace.newStuff',\
    \ {});\n```\n\nThat's call to $.widget with a namespace (namespace.newStuff) and\
    \ an empty object as the prototype. It won't actually do much, of course, but\
    \ it's a start.\n\nYou might look at more features of the Widget Factory in “A\
    \ Closer Look at the Widget Factory” later in this chapter.\n\n# Which to Use?\n\
    \nAll of these methods are valid, and you're free to pick your preference depending\
    \ on the needs of the plugin you're writing. Choosing patterns for plugin development\
    \ is discussed in more detail in the chapter. For beginning plugin developers,\
    \ the first of the two might be a better place to start.\n\nTo simplify, most\
    \ of the examples follow use the more straightforward and JavaScript-centered\
    \ jQuery.fn approach.\n\n# General Plugin Guidelines\n\nNow that you've seen the\
    \ basics of extending jQuery, it's time to look at some guidelines that will keep\
    \ your plugin development on track. From here, the basics of plugin development\
    \ will be, for"
