  md: "You might have cringing at the sight of an embedded CSS style in one of the\
    \ tags. It's a common tenet of standards-based web development that presentation\
    \ information, in the form of CSS styles, should be separated from the content\
    \ and structure of the page, represented by the HTML. To do this with the preceding\
    \ example, the styles should be placed in an external CSS file. The improved example\
    \ should look more like this:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <style\
    \ type=\"text/css\" src=\"myCss.css\"></style>\n  <script type=\"text/javascript\"\
    >\n    function showStuff() {\n      var content = document.getElementById(\"\
    content\");\n      content.style.display = \"block\";\n    }\n\n    function changeColor(elem)\
    \ {\n      elem.style.backgroundColor = \"green\";\n    }\n  </script>\n</head>\n\
    <body>\n  <ul id=\"content\" onload=\"javascript:changeColor(this)\" class=\"\
    contentClass\">\n    <li onclick=\"javascript:changeColor(this)\">Item 1</li>\n\
    \    <li onclick=\"javascript:changeColor(this)\">Item 2</li>\n    <li onclick=\"\
    javascript:changeColor(this)\">Item 3</li>\n    <li onclick=\"javascript:changeColor(this)\"\
    >Item 4</li>\n  </ul>\n</body>\n</html>\n```\n\nWhat's true for the markup (HTML)\
    \ and style (CSS) is also true for the behavior (JavaScript). Code representing\
    \ the behavior of the page should also be removed from the page. Inline event\
    \ handlers, and inline JavaScript should be avoided wherever possible. This keeps\
    \ unobtrusive JavaScript. The following code sample shows the preceding example\
    \ rewritten in fully separate style, content and behavior.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <style type=\"text/css\" src=\"myCss.css\"></style>\n  <script>\n\
    \    (function(document) {\n      content.onload = function() {\n        content.style.display\
    \ = \"block\";\n      }\n\n      var listItems = document.getElementsByTagName(\"\
    li\");\n      for (i = 0; i < listItems.length; i++) {\n```"
