  md: "# QUnit example\n\n```\nwide passed tests\nMozilla/5.0 (Windows NT 6.1; WOW64;\
    \ Gecko/20100101) Firefox/8.0\nTests completed in 81 milliseconds\n0 tests of\
    \ 1, 1 failed\n1 Hello World, [1] Failed\n1. We expect the message to be 'hello\
    \ world'\nExpected: \"hello world\"\nResult: \"goodbye cruel world\"\nDiff: -hello\
    \ world +goodbye cruel world\nSource: (http://code.jquery.com/qunit/qunit.js:104)\n\
    ```\n\nFIGURE 14-2\n\n# Testing for Truthfulness with ok\n\nIn some ways, this\
    \ would have made a better \"Hello World\" example, because it's the most basic\
    \ assertion. ok accepts two arguments: a Boolean state to test and a message to\
    \ display in the case of a failing test. If passes then the state is true. The\
    \ following code example shows ok in action. It tests whether the return value\
    \ of an array is array using the jQuery method $.isArray.\n\n```\ntest(\"Truthiness\
    \ is golden\", function() {\n  var val = function() {\n    var arr = [1,2,3,4,5];\n\
    \    //dustoff\n    return arr;\n  }\n  ok($.isArray(val()), \"We're expecting\
    \ an array as a return value\");\n});\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_308_0.png)\n\
    \nCode snippet for ok.html\n\n# Setting Expectations\n\nOne good habit to get\
    \ into is set expectations for your tests. Basically, you tell QUnit, \"Expect\
    \ to see x assertions.\" If QUnit doesn't see exactly x assertions, the test will\
    \ will fail. This is true even if the assertions did not run all.\n\nTests might\
    \ not run for a variety of reasons, from something as simple as a typo to more\
    \ complicated issues relating to application flow. Use the prime example of why\
    \ expect is important when you learn about asynchronous testing in a later section.\n\
    \nYou set expectations in QUnit in two ways. The first is by calling the expect\
    \ method within the test body. The following example shows expect in use. Two\
    \ assertions are expected but only one is present, the whole test fails."
