    Code snippet is from expect.btml


    Figure 14-3 illustrates the result of this test. The test fails even though all
    of the assertions that did passed.


    ![](img/16459f9d4793f783ab42cec76c544db0_309_0.png)


    FIGURE 14-3


    In addition to the expect method, it allows to set expectations with an optional
    second argument to the test method:


    ```

    test("Hello World", 2, function() (

    var message = "hello world";

    equal(message, "hello world", "We expect the message to match ");

    ));

    ```


    Code snippet is from expect.btml


    While both are valid options, you''ll see it both in large test suites, the explicit
    call to expect within the test body is much cleaner and easier to read. I prefer
    over the second argument to test.


    # Additional Assertions


    Table 14-1 lists all available assertions in QUnit. For the most part, they have
    the same straightforward syntax you''ve already seen with the other assertions
    in this section. They either provide negative assertions like notEqual (the opposite
    of equal) or more/different levels of precision like deepEqual and strictEqual.
    Familiarize yourself with this list; it will help when you''re writing your own
