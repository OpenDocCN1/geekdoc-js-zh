  md: 'Now, when the request is requested and successful, doSomthing() is executed.
    Table 6-2 shows the different states.


    # TABLE 6-2: The ReadyState Object


    | STATE | DESCRIPTION |

    |---|---|

    | 0: Uninitialized | The object has been constructed. |

    | 1: Loading | The open() method has been successfully invoked. During this request
    headers can be set using setRequestHeader() and the request can be made using
    the send() method. |

    | 2: Loaded | All redirects (if any) have been received. Several response members
    of the object are have now available. |

    | 3: Interactive | The response entity is being received. |

    | 4: Completed | The data transfer has been completed or something wrong during
    the transfer (e.g., infinite redirects). |


    From: http://www.w3.org/TR/XMLHttpRequest/#states


    After the request is completed and successful, you can get the response using
    the xhr object''s responseText. What the responseText returns is the server-side
    code. It can be of any format, not just XML. Now that you can get any data format
    from the server — HTML, XML, JSON, plain text, and so on, each with its own pros
    and cons for parsing data retrieved.


    The major trends have shifted toward using JSON as the data interchange format
    of code. Since it''s a native JavaScript object, people find it easier to deal
    with programmatically. Instead of firing up DOM travels to walk through the XML
    returned by the server, you can simply use notation to access properties of the
    JSON response. Also, JSON is generally less verbose than XML so it lowers the
    cost of each request over the wire.


    You''ll see XML, of course, and there are uses for plain text and even blocks
    of HTML, but it''s much more common to see JSON these days.


    As you''ve no doubt, jQuery offers alternative ways of handling AJAX request and
    response in a more simplified manner.


    # APPLYING AJAX WITH JQUERY


    Just as you saw in the previous chapter with event handling, jQuery answers many
    of the details of AJAX communication. For example, you don''t have to worry about
    how the xhr object is instantiated. The general jQuery method for sending Ajax
    calls is (drum roll...) the $.ajax() method, which takes the:


    ```

    $.ajax(url, [settings]);

    ```'
