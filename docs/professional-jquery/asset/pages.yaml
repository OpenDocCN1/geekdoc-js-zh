  md: "# 104 | CHAPTER 5 EVENT HANDLING\n\n```\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n  <script>\n  function() {\n    // element doesn't exist yet, but\
    \ we can create handler\n    // anyways\n    (\"anchor\").live(\"click\", function(event)\
    \ {\n      console.log(\"I have a handler\");\n    });\n  }\n\n  $(document).append(\"\
    <a id='anchor'>I go nowhere </a>\");\n}\n</script>\n</head>\n<body>\n<body>\n\
    </body>\n</html>\n```\n\nCode snippet is from live.txt\n\nSimilar to .unbind(),\
    \ .live() has a corresponding .die() method for removing the handlers by .live().\
    \ The .live() method cannot be chained, unlike jQuery Methods. In cases where\
    \ you want to use chaining, use the .delegate() method instead, which also binds\
    \ a handler independent of whether the DOM element exists.\n\n```\n<html>\n<head>\n\
    \  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n  <script>\n\
    \  function() {\n    $(\"body\").delegate(\"p\", \"click\", function() {\n   \
    \   .css(\"color\", \"green\");\n    });\n  }\n</script>\n</head>\n<body>\n  <p>Hit\
    \ Me!</p>\n</body>\n</html>\n```\n\nCode snippet is from delegate.txt\n\nAnd again,\
    \ just like .unbind() and .die(), .delegate() has a corresponding .delegate method.\
    \ For example, live removing the binding from the previous example you could do\
    \ the following:\n\n```\n$(\"body\").unbind(\"p\", \"click\");\n```\n\nIn some\
    \ cases, you may want for a handler to execute only, or at most once. You can\
    \ accomplish this using the .one() method as the following snippet demonstrates.\
    \ The click event handler is executed only once for the first div."
