    lorem\">Lorem Ipsum</p>\n    <p id=\"blah\">blah blah blah</p>\n  </div>\n</body>\n\
    </html>\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_78_0.png)\n\nCode snippet\
    \ is from chaining.txt\n\nUsing Lindling's terminology, any jQuery method that\
    \ returns another wrapper object is denoted as a \"constructive\" method because\
