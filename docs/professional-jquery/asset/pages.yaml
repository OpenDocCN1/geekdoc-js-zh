    # RESIZING ELEMENTS


    You might have expected a simple utility method for resizing an element on the
    onresize event. $.resize() is a handler for the resize event. Unless you''re using
    $.animate(), you''ll have to code your own


    To resize an element change its height and width attributes using .css(). For
    example, to shrink the width of an element you would do the following:


    ```

    var w = $("#myElement").css("width");

    w = parseInt(w.replace("px","")) - 10;

    $("#myElement").css("width", w);

    ```


    But this has the disadvantage of returning a string with a unit, like pixels.
    By using the $.height() and $.width() methods, you can get the height and width
    of an element, making it easier to resize:


    ```

    var w = $("#myElement").width() - 10;

    $("#myElement").width(w);

    ```


    # DESIGNING CUSTOM ANIMATIONS


    All of the previous methods for animating elements are nice, but there''s a more
    elegant weapon for these utilized times, the $.animate() method. jQuery has a
    more general method for doing animations, which permits you to modify more than
    one attribute simultaneously. Any attribute that uses a numeric value such as
    top, left, height, width and opacity is open for manipulation by $.animate().
    It accepts an object with the properties to be animated, the duration of the animation,
    a string denoting the easing algorithm to use, and a callback function executed
    upon completion:


    ```

    $(selector).animate( properties, [duration,] [easing,] [complete] )

    ```'
