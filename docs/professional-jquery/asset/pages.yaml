  md: 'In addition to JSLint, there''s an alternative code quality tool that''s gaining
    popularity, JSHint www.jshint.com/. Originally forked from JSLint to create a
    more configurable version of JSLint that didn''t enforce one particular coding
    style, JSHint has grown into a project of its own, with its goals and ideals.
    If you find yourself running up against specific, non-configurable rules in JSLint
    or merely want to try out an alternative then JSHint might be a good option for
    you.


    Finally, after finishing of any modules or plugins, and validating using JSLint,
    you''ll probably want to minify your .js files for production. Several options
    are available on the market, popular open source options for all of your projects,
    the UI Compressor, the Google Closure Compiler, UglifyJS, and JSMin. YUI Compressor
    offers the additional ability to minify CSS alongside your JS. While it is convenient
    to have one-stop shop for all of your projects the dominant choices right now
    are UglifyJS, a NodeJS-based utility, and Google''s Closure Compiler. Both are
    in use at popular JavaScript performance-observed projects. UglifyJS is the minifier
    for the jQuery project itself and the Closure Compiler is the minification choice
    for HTML5 Boilerplate. Both can run from the command line, which allows you to
    automate this minification process alongside any JSLint tests you may also be
    running. The HTML5 Boilerplate project offers a full-featured Ant build script
    which does both minification and JSLint or JSHint tests (and more)


    If you''re interested in getting your hands dirty, the following code samples
    show how easy it is to run both UglifyJS and Closure Compiler from the command
    line.


    Assuming you''re running NodeJS, installing UglifyJS is setting the -o (output)
    flag, as follows:


    ```

    npm install -g uglify-js

    ```


    Running it is like calling UglifyJS, setting the -o (output) flag, and setting
    an output filename and setting in the input file name to be minified:


    ```

    uglify -o app.min.js app

    ```


    Using Closure Compiler is also very simple. Simply download the latest jar from
    http://closure-google.com/files/compiler-latest.zip, unzip it and then run it
    from the command line. It follows a similar pattern with an input file and an
    output file provided as command line arguments.


    ```

    java -jar compiler.jar --js app.js --js_output_file app.min.js

    ```


    If you are not a guru, or don''t understand how to use a command line, don''t
    sweat it. There are the web-based applications to get the same results.


    # DEBUGGING JAVASCRIPT AND JQUERY


    It''s time to use the tools discussed in this chapter'
