  md: "# Use JavaScript Patterns\n\n![](img/16459f9d4793f783ab42cec76c544db0_230_0.png)\n\
    \n# FIGURE 10-2\n\nThere's more namespaces than preventing bugs. This single singleton\
    \ can be extended to create separate objects for individual application features\
    \ and/or sites.\n\nThis allows multiple developers to work in a single application\
    \ namespace across multiple files, allowing for greater maintainability and less\
    \ chance of conflicts in version control or otherwise stepping on each other's\
    \ toes. Though individuals might be able to get away with it, working with a monolithic\
    \ JavaScript file can cause disasters.\n\nYou can see the simple object you've\
    \ been working with broken out into multiple application objects in Listing 10-8.\
    \ Structurally, each site section would be broken out into a separate file. These\
    \ would be `common.js`, `dashboard.js`, `controlPanel.js`, and `settings.js` in\
    \ this example. With the exception of `common.js`, individual developers could\
    \ own each site section and file without really worrying about anyone else was\
    \ doing. `common.js` would be owned by the project lead, both for the sake of\
    \ maintenance and because the question of what's truly \"common\" has some nuance\
    \ to it.\n\n# LISTING 10-8: A simple application framework\n\n```\nvar MyApp =\
    \ {\n  // common object holds common to all application sections\n  common : {\n\
    \    init : function(){\n      // code to initialize your application\n    }\n\
    \  },\n\n  myApp.dashboard = {\n    // your dashboard feature has an init function\
    \ as well.\n    init : function(){\n      // init code\n    },\n\n    update :\
    \ function(){\n      // code to update the dashboard\n    },\n\n    render : function(){\n\
    \      // code to render the dashboard\n    }\n  },\n\nMyApp.controlPanel = {\n\
    \  // your control panel feature has an init function as well.\n  init : function()\
    \ {\n```\n\ncontinues"
  merge: -1
