    </head>\n<body>\n</body>\n</html>\n```\n\nValid types of data that can be returned\
    \ XML, HTML, JSON, JSONP, text and script.\n\nAs you've seen in previous chapters,\
    \ jQuery is particularly adept at traversing DOM trees. In a situation where the\
    \ server response is XML, jQuery has the .find() method for getting data from\
    \ an XML document. So you have an Ajax call that returns an XML document that\
    \ describes a book, and you'd like to review the chapters. The following code\
