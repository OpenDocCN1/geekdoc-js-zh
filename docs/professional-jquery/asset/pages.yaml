  md: '# SUMMARY


    You''ve now been introduced to the fundamental concepts of unit testing. You''ve
    also been introduced to everything you need to write your own unit tests with
    QUnit. From the assertions you''ll use to the methods you''ll use to test DOM
    manipulations and Ajax interactions, you have a full skillset at your disposal
    to start testing your own applications.


    This chapter also marks the end of the book. At this point, you''ve gone in-depth
    much of what jQuery has to offer. From the core concepts covered in the first
    half of the book to the more advanced topics covered in the later chapters, you
    should be a confident, capable jquery programmer. Moving beyond simple DOM manipulations,
    canned animations, and implementing plugins, you''re going to dive in and do toe
    to toe with the ninjas and pirates of the JavaScript world. Maybe you''re going
    to dive in and do some plugin development of your own, enhancing and extending
    core jQuery functionality into new and useful areas, or maybe you''re going to
    dive in and add some rigor to your JavaScript practice with a formal framework
    using QUnit. Whatever lessons you take away from this book, the biggest one should
    be that any library or tool is only as valuable as you make it. Diving into the
    subject with the depth you have in this book will empower you to make jQuery very
    valuable indeed.


    We can''t wait to see what you do with that power.'
