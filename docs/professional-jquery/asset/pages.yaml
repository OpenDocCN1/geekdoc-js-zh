  md: '# Understanding the Structure of a jQuery Script


    When you call a jQuery method, such as .addClass(),, it applies the method to
    all of the selected elements. There''s no need to iterate over the collection
    with a loop.


    We''ve mentioned that the jQuery object contains several methods. Table 3-1 shows
    a sampling of some of them.


    # TABLE 3-1: jQuery Methods


    | METHOD | CATEGORY | DESCRIPTION |

    | --- | --- | --- |

    | .ready() | Events | Specifies a function to run when the DOM is fully loaded.
    |

    | .click() | Events | Sets click event handlers on the set of matched elements.
    |

    | .ajax() | Ajax | jQuery''s Ajax utility. |

    | .addClass() | CSS | Adds a CSS class to the set of matched elements. |

    | .removeClass() | CSS | Removes a class from the set of matched elements. |

    | .attr() | Attributes | Gets or sets the value of the specified attribute. |

    | .html() | Attributes, DOM Insertion | Gets or sets the HTML content of the first
    matched element. |

    | .type() | Utility | Determines the internal JavaScript [[Class]] of an object.
    |


    jQuery is eco-friendly; it doesn''t pollute the namespace with globals except
    for jquery and $. The s alias might be used in other libraries, it''s highly unlikely
    that any other library uses jquery as a variable.


    # Utility Functions


    If you recall, functions are also objects. Hence, a function may have properties
    and its own methods. The jQuery object has several useful methods conveniently
    called utility methods. Methods exist for enhancing operations for arrays, objects,
    functions, and even data manipulation.


    # Objects


    The plain-old jQuery way of checking the type of an object is using the type()
    operator, which is sometimes inconsistent. In some instances typeof() returns
    an incorrect or unexpected value. Take example of typeof(null — it returns object
    instead of null. Luckily, jQuery has a custom .type() method for these situations:


    ```

    $.type(null); // returns null

    $.type([]); // returns array

    ```'
