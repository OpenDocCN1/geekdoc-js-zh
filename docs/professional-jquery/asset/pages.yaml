  md: "filters specifically for form elements, such as :button or :input, a filter\
    \ for detecting an element is in a state of animation, and other goodies. The\
    \ jQuery doc classify the filter selectors into basic, visibility, content, child,\
    \ and form. We talk about the :animated filter in Chapter 7.\n\n# Selection Using\
    \ Basic Filters\n\nTable 4-3 lists the basic filters available in jQuery. They\
    \ all follow the same usage pattern as seen in the previous example.\n\nTABLE\
    \ 4-3: Basic Filters\n\n| TYPE | DESCRIPTION |\n| --- | --- |\n| :animated | Selects\
    \ elements that are animated |\n| :eq() | Selects elements that are equal |\n\
    | :even | Selects even elements |\n| :first | Selects the first element |\n| :gt()\
    \ | Selects elements greater than a value |\n| :header | Selects all elements\
    \ that are headers, like h1, h2, h3 and so on |\n| :last | Selects the last element\
    \ |\n| :lt() | Selects elements less than |\n| :not() | Selects elements that\
    \ don't equal a value |\n| :odd | Selects the odd elements |\n\n# Filtering Forms\n\
    \nAs you know well, validating, parsing, and submitting form data is an everyday\
    \ part of a developer's life. So jQuery, of course, contains filters that make\
