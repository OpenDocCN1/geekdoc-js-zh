  md: "# 208 | CHAPTER 10 WRITING EFFECTIVE JQUERY\n\n![](img/16459f9d4793f783ab42cec76c544db0_229_0.png)\n\
    \nFIGURE 10-1\n\nIt doesn't take long for a JavaScript developer to discover that\
    \ polluting the global namespace with multiple variables can cause serious issues.\
    \ For an obvious example, imagine naming a variable _, or $ in the global namespace.\
    \ That's going to cause some problem down the line.\n\nMore obscure names might\
    \ be safer, but they're still not safe, so don't think naming your variables after\
    \ characters from Jabwocky is going to save you from variable collisions.\n\n\
    Just wait until you have Lewis Carroll on a project.\n\nSo, instead of merely\
    \ merging a series of functions into a global namespace, you can alternatively\
    \ leverage a single variable to hold all of your application code. In the simplest\
    \ example, this variable is an object literal, which in turn will contain your\
    \ application modules and properties. A simple example is shown in Listing 10-7.\n\
    \n# LISTING 10-7: a singleton\n\n```\nvar myApp = {\n  init : function(){\n  \
    \  // code to initialize your application\n\n    dashboard: function() {\n   \
    \ // dashboard feature goes here\n  },\n\n  controlPanel: function() {\n    //\
    \ panel code goes here\n  },\n\n  appSettings: function() {\n    // code that\
    \ updates settings goes here\n  }\n}\n// kick it off with init(ready())\n$( document\
    \ ).ready(myApp.init)\n```\n\n> Code snippet from singleton.txt\n\nFiring up Firefox\
    \ with this new structure shows that there's only the single myApp variable in\
    \ the global namespace.\n\nEven in this simplified example, that cuts down the\
    \ possibilities of a variable collision significantly. If your application has\
    \ dozens or even hundreds of similar methods and properties, the benefit of an\
    \ application namespace is even greater."
