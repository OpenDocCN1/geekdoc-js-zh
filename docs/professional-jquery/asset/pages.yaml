  md: "# AUGMENTING TYPES\n\nJavaScript allows the facility for binding methods and\
    \ other properties to built-in types, such as strings, numbers, and arrays. Strings,\
    \ just like any other object, have prototypes. You can also augment String with\
    \ convenience. For example, String has no method for converting the string \"\
    false\" or \"true\" to a Boolean. You can add this capability as the following\
    \ code demonstrates:\n\n```\nString.prototype.boolean = function() {\n  return\
    \ \"true\" == this;\n}\n\nvar t = 'true'.boolean();\nvar f = 'false'.boolean();\n\
    \nconsole.log(t);\nconsole.log(f);\n\ntrue\nfalse\n```\n\nCode snippet is from\
    \ string-boolean.txt\n\nAdmitted, it's annoying to have to redundantly type prototype\
    \ every you want to add a method. Douglas Crockford has a neat bit of code for\
    \ around this, which augments the Function.prototype with a method called method\
    \ (please pardon the redundancy.) This is shown in the following code sample.\n\
    \n```\nFunction.prototype.method = function(name, func) {\n  this.prototype[name]\
    \ = func;\n}\n```\n\nCode snippet is from method-boolean.txt\n\nNow you can rewrite\
    \ the boolean method for strings:\n\n```\nString.method('boolean', function()\
    \ {\n  return \"true\" == this;\n}\n\n> \"true\".boolean();\nTrue\n```\n\nCode\
    \ snippet is from new-boolean.txt\n\nThis technique is useful for writing a library\
    \ of utility methods and including it in your projects."
