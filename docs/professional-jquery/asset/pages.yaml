- img_proc: true
  md: "```\ntry {\n  return new XMLHttpRequest(\"Msxml2.XMLHTTP.3.0\");\n} catch (e)\
    \ {\ntry {\n  return new XMLHttpRequest(\"Msxml2.XMLHTTP\");\n} catch (e) {\n\
    \  throw new Error(\"No XMLHttpRequest\");\n}\n}\nvar xhr = new XMLHttpRequest();\n\
    ```\n\nOnce the details of creating the request object have been taken care of,\
    \ a connection must be established with the server, using the `xhr.open()` method,\
    \ which follows the form:\n\n```\nxhr.open(method, url, isAsynchronous);\n```\n\
    \nwhere `method` refers to the HTTP method, the action to be performed on the\
    \ specified resource. While the full list of HTTP methods (or \"verbs\") is much\
    \ longer, Ajax requests typically be a POST or GET. The second parameter is the\
    \ URL used to exchange data, and `isAsynchronous` is a Boolean flag indicating\
    \ whether the call is asynchronous. This flag indicates whether or not the request\
    \ should block the execution of the script. As the nature of technique, this will\
    \ normally be set to true. So you can use the request object to make synchronous\
    \ posts to the server, but would be defeating the purpose of Ajax. After opening\
    \ the connection, use the `xhr.send()` to initiate the request to the server.\
    \ It accepts a `data` argument:\n\n```\nxhr.open(\"POST\", \"/request/url/\",\
    \ true);\nxhr.send(data);\n```\n\nBecause communication is asynchronous you can't\
    \ count sequential execution of methods. For example:\n\n```\nxhr.send(data);\n\
    doSomething();\n```\n\nThe `send` method is executed and runs immediately, whereas\
    \ the request and response each operate on separate threads. You will have the\
    \ response from the server when `doSomething()` gets executed. The solution is\
    \ to use the callback handler `onreadystatechange`, which is invoked when there\
    \ is a request state change. So, the previous snippet can be rewritten as:\n\n\
    ```\nxhr.onreadystatechange = function() {\nif (this.readyState === 4) {\n  if\
    \ (this.status >= 200 && this.status < 300) {\n    doSomething();\n  } else {\n\
    \    // problem with communication\n  }\n}\n}\nxhr.send( data );\n```"
