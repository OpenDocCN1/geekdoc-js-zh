  md: "# CHAPTER 10 WRITING EFFECTIVE JQUERY CODE\n\nBe warned — once you start pay\
    \ strict attention to performance, it can infect all of your coding. Your users\
    \ will love you.\n\n# Minimize DOM Updates\n\nOne of the most fundamental concepts\
    \ of optimized front-end code is to keep the number of DOM updates in any given\
    \ interaction down to the absolute minimum. Crossing over the JavaScript engine\
    \ into the DOM is a costly proposition. This is especially true if the operation\
    \ is going to cause a repaint or reflow.\n\nIf you're unfamiliar with the concept\
    \ of refills and repaints, pay particular attention to the next section. Understanding\
    \ these concepts, how they differ, and how they affect both perceived and clock\
    \ performance of a web page or application, is vital knowledge for the serious\
    \ front-end engineer.\n\n# Reflows Repaints\n\nTwo common, but potentially expensive\
    \ operations in the life of a web page are refills and repaints. Reflows and repaints\
    \ happen when the browser needs to update its rendering model (the combination\
    \ of the DOM and the CSS rules that make up the style component of the page).\
    \ This happens at least once a page load (because the browser must draw something\
    \ at least once), but can happen many times in the case of dynamic applications.\n\
    \nThe events are related, but slightly different. Understanding the difference\
    \ can make or break performance of a page:\n\n+   - A repaint is caused by a stylistic\
    \ change to the page that doesn't change the overall geometry. Hiding an element\
    \ or changing an element's background color would cause a repaint.\n- A reflow\
    \ is caused by a structural update to the page. Adding or removing an element\
    \ from a document, changing its dimensions, or changing its display property can\
    \ all cause a reflow. This is the more expensive of the two events because it\
    \ involves calculating page geometry using the current DOM/CSS landscape.\n\n\
    # Minimizing DOM Updates in Practice\n\nYou can see a dramatic and simple illustration\
    \ of the performance penalty for DOM updates in Listing 10-1. The first example\
    \ adds 10000 rows to a table by calling $.append() during every iteration of the\
    \ for loop. The second example creates a string, entirely in the JavaScript domain,\
    \ and writes the results to the DOM once, after the loop is completed.\n\nLISTING\
    \ 10-1: Minimizing DOM updates\n\n```\nfor (var i=0; i < 10000; i++) {\n  $(\"\
    #main table\").append(\"<tr><td>My job is to log table rows, this is row #\" +\
    \ i + \"</td></tr>\");\n}\n```\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_217_0.png)"
