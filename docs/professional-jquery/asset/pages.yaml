    \ Your Events and Data\n\nIn addition to claiming a single name in the jQuery\
    \ namespace, it's important to be frugal with your plugin events and data as well.\
    \ With events and data, the issues are under the hood and are therefore less obvious.\
    \ That doesn't mean it's not to play nice.\n\nTo end, when setting events, take\
    \ advantage of the ability to add event names to the bound events. This simple\
    \ technique enables you to unbind events without the danger of unbinding events\
    \ bound to the same elements by outside the scope of your plugin.\n\nYou accomplish\
    \ this by appending .namespace to the end of the bound event name. The code illustrates\
    \ this pattern by setting a namespaced resize event on the window:\n\n```\nfunction($)\
    \ {\n  var methods = {\n    init: function(options) {\n      $( window ).bind('resize.bestFunctionEver',\
    \ methods.flop );\n    },\n    destroy: function() {\n      $( window ).unbind('resize.bestFunctionEver');\n\
    \      flip: function(howMany) {\n    },\n    flop: function() {\n      // flop\n\
    \    },\n    fly : function() {\n      // fly\n    }\n  };\n  $.fn.bestPluginEver\
