  md: "HTML5 controls degrade gracefully. That means that if a browser doesn't support\
    \ a particular control — for example, at the time of this writing only Opera supports\
    \ the color control — a regular input box is displayed.\n\nIn some cases you may\
    \ want to validate against values in a database, and using Ajax you can achieve\
    \ this effect. But first, the following section provides a quick review of Ajax\
    \ and later on our return to form validation.\n\n# REVISITING AJAX BASICS\n\n\
    The definition of Ajax has evolved from its original acronym of Asynchronous JavaScript\
    \ and XML, a method for sending and retrieving data (XML) to a server asynchronously\
    \ without the need to completely reload a web document. It refers to methods for\
    \ creating interactive web and dynamic applications with JavaScript, as youve\
    \ in previous chapters, as well as asynchronous communication between the client\
    \ and server. These days it's not always XML's used to transport information between\
    \ the server and client, but often other formats such as JSON.\n\nAt the heart\
    \ of Ajax is the XMLHttpRequest object, which dates back to 2000 when Microsoft\
    \ introduced an ActiveX object for asynchronous communication between server and\
    \ client. In 2005, the term \"Ajax\" was coined by Jesse Garrett to describe this\
    \ technique.\n\nThe disparity between you browsers managers events is also observed\
    \ with Ajax, albeit not as complex. To create a new request object in Internet\
    \ Explorer, you would do the following:\n\n```\nvar xhr = new XMLHttpRequest(\"\
    Microsoft.XMLHTTP\");\n```\n\nor in older versions of IE:\n\n```\nvar xhr = new\
    \ XMLHttpRequest(\"MSXML2.XMLHTTP\");\n```\n\nIn IE7 and any other browser that\
    \ supports XMLHttpRequest, you use the native JavaScript XMLHttpRequest object:\n\
    \n```\nvar xhr = new XMLHttpRequest();\n```\n\nLuckily, the method names used\
    \ with the standard XMLHttpRequest object and the Microsoft ActiveX object are\
    \ remarkably similar, simplifying mappings. Typically, if you were to handle the\
    \ details yourself might need bit of code like this to instantiate a request object:\n\
    \n```\n/*nSupport for the original ActiveX object in older versions of Internet\
    \ Explorer\nThis works all the way back to IE5.\n*/\nif (typeof XMLHttpRequest\
    \ == \"undefined\") {\n  XMLHttpRequest = function () {\n    try {\n      return\
    \ new XMLHttpRequest(\"Msxml2.XMLHTTP.6.0*\");\n    }\n  }\ncatch (e) {\n```"
