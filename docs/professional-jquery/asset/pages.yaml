  md: "# Promises\n\nBasically defined, a *promise* is a proxy for the result of an\
    \ action that will happen at an unspecified time in the future.\n\nAlthough they're\
    \ relatively new to jQuery, software promises have been around for a good while.\
    \ The name and concept of promises dates back to a paper written in 1976 by Daniel\
    \ P. Friedman and David Wise. Though language implementations are generally more\
    \ academic than practical, library implementations exist for Java, Scala, Ruby,\
    \ Perl, Python, and Common Lisp. Closer to home, a major JavaScript implementation\
    \ has been in place in the framework from version 0.9.\n\nBecause they're so easily\
    \ asynchronous, they're particularly suited to web programming, so it was inevitable\
    \ that they'd land in jQuery.\n\n# The Promises/A Proposal\n\njQuery's specific\
    \ implementation is based on the Promises/A proposal from CommonJS. CommonJS is\
    \ a group centered on interoperability in JavaScript and the growth of a healthy\
    \ JavaScript ecosystem is similar to the ones that have developed around other\
    \ languages like Python, Ruby, and Java. The group's main focus is on the question\
    \ of modules, which the Common JS Modules API addresses directly, but they've\
    \ worked on other language features. One is the CommonJS Wiki lists several proposals\
    \ for the Promise. Promises/A proposal is from Kris Zyp. It's defined as:\n\n\
    > A promise represents the eventual value returned from the single completion\
    \ of an operation. A promise may be one of the three states, unfilled, fulfilled,\
    \ and failed. The promise may only move from unfilled to fulfilled, or unfilled\
    \ to failed. Once a promise is fulfilled or failed, the promise's value MUST not\
    \ be changed the immutable characteristic of promises are important for avoiding\
    \ side-effects from listeners that can create unanticipated changes in behavior\
    \ and allows promises to be passed to other functions without affecting the caller,\
    \ in same way that the caller's variable will be modified by the callback.\n\n\
    A promise is defined as an object that has a function as the value for the property\
    \ 'then'.\n\n```\nhttp://wiki.commonjs.org/wiki/Promises/A\n```\n\nThe following\
    \ code sample presents a simplified look at the concepts presented in the Promises/A\
    \ proposal.\n\nAssuming that ajaxPromise returns a promise that is in one of three\
    \ states (unfilled, fulfilled, or failed), the following illustrates the general\
    \ principle:\n\n```\nvar promise = ajaxPromise() {\n  // XHR request\n  //state\
    \ is set to fulfilled, unfilled, or failed\n  // depending on the result of the\
    \ request\n  return state\n}\n\nfunction unfilled() {\n```"
