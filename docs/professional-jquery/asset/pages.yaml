  md: '# SUMMARY


    You should now have a solid understanding of the possibilities and power of jQuery
    Deferred object and its many available methods.


    Throughout the chapter, you''ve seen examples of Deferred being used to pull application
    logic out of function bodies and into the more maintainable, flexible structure
    provided by methods like Deferred.when, Deferred.then, and Deferred.done.


    You also learned about creating, resolving, and rejecting promises manually, a
    vital piece in unlocking the power of Deferred.


    Additionally, you had some exposure to more obscure options like the ability to
    notify on the progress of a Deferred and the ins and outs of debugging with Deferred.state.


    Once your head is truly wrapped around Deferred, you''ll start looking at your
    current and past codebases with the goal of refactoring that old code to leverage
    the power and structure provided by Deferred. The flexibility and clarity it brings
    to your application code makes it one of the most important recent features added
    to the library.'
