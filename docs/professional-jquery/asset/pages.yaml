  md: "# More Effective Looping\n\nBefore you get into this functionality, it should\
    \ be pointed out that, most of the time, using the jQuery convenience method $.each()\
    \ on a collection is a perfectly acceptable solution to iterating over the members\
    \ of an array.\n\nSometimes, however, using $.each() isn't acceptable. With larger\
    \ collections where speed is an issue, using traditional control structures is\
    \ a more effective solution.\n\n# $each() and Array.forEach(): Trading Convenience\
    \ for Speed\n\nAll implementations of this functionality, whether it the aforementioned\
    \ jQuery convenience method or the ECMasScript 5th Edition method forEach(), are\
    \ slower than an associated for loop. To understand why this is, it's useful to\
    \ understand the levels in which the coded loop runs.\n\n# The Price of Function\
    \ Creation and Adding Levels to Symbol Lookup\n\nTake a look at the simple example\
    \ in Listing 10-3 that loops through a collection of integers and tests to see\
    \ if they are multiples of 5. One test is done with a traditional for loop, one\
    \ with [].forEach(), and the other is done with $.each().\n\n# LISTING 10-3: $.each()\
    \ vs. [].forEach() vs. a traditional for loop\n\n```\n/*\n Here's the setup function\
    \ which populates an array with integers\n */\n\nvar numbers = [],\nfives = [];\n\
    for ( var i=0; i<1000000; i++) (\n  numbers.push(Math.round(Math.random()*i));\n\
    )\n\n/*\n First we use a traditional for loop,\n caching the length\n */\n\nvar\
    \ test = numbers.length;\nfor ( var j= 0; j<test; j++) (\n  if (( numbers[j] %\
    \ 5) === 0 && numbers[j] != 0 ) (\n    fives.push(numbers[j]);\n)\n```"
  merge: -1
