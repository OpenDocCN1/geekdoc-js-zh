  md: "```\njQuery.fn.bestPluginEverFly = function() { \n//fly\n};\n```\n\nCode snippet\
    \ is from toomanames.txt\n\nyou could, instead, create a single entry point and\
    \ expose additional functionality in a more unobtrusive way.\n\n```\njQuery.fn.bestPluginEver\
    \ = function() { \n//single namespace\n}\n```\n\nCode snippet is from single-namespace.txt\n\
    \nFrom starting point, you could use a method lookup table to expose internal\
    \ methods to the public endpoint. This pattern keeps a clean namespace by encapsulating\
    \ all of your methods in the plugin's closure. They're then called by passing\
    \ the name of the method required, and then passing any additional parameters\
    \ needed for the method as a second argument. This type of method encapsulation\
    \ and architecture is a standard in the jQuery community and it is used by countless\
    \ plugins, including the plugins and widgets in jQuery UI. The basic pattern is\
    \ illustrated in the following:\n\n```\n(function() { \nvar methods = {\ninit\
    \ : function(options ) { \n// init\n},\nflip : function(howMany ) { \n// flip\n\
    },\nflop: function() { \n// flop\n},\nfly : function( ) { \n// fly\n}\n};\n```\n\
    \n```\n$fn.bestPluginEver = function( method ) { \n\nif { methods[method] ) {\
    \ \nreturn methods[method].apply(this,\nArray.prototype.slice(arguments, 1));\
    \ \n} else if ( typeof method === 'object' || ! method ) { \nreturn methods.init.apply(this,\
    \ arguments); \n} else { \n$.error('Method \n+ method \n+ does not exist in the\
    \ bestPluginEver ');\n```"
