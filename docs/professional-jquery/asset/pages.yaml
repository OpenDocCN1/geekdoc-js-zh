  md: '# 8

    jQuery UI

    Part I—Making Things Look Slick


    # WHAT''S IN THIS CHAPTER?


    +   - Theming and Styling with jQuery

    - Using ThemeRoller

    - Using jQuery UI Widgets


    jQuery UI is an associated user interface library for jQuery that contains widgets,
    animations, and interactions. Widgets in this rich set are themeable, a process
    simplified by the ThemeRoller web app, and has an advanced look and feel to them.
    The framework also includes very complete classes useful for theming your application.
    While many of these features are replicated in other plugins, the unified codebase
    and API, overall quality, and flexibility of jQuery UI make it an indispensable
    asset when building complete applications.

    UI themming, creating custom themes, widgets, and other ways to get effects that
    the jQuery core doesn''t provide.


    # THEMING AND STYLING


    Getting started with jQuery UI is easy. You simply navigate over jqueryui.com
    to obtain a copy. You can download a preexisting theme or make your own. As shown
    in Figure 8-1, the download page also gives you the option of choosing components
    to include in your download. It''s rare


    ![](img/16459f9d4793f783ab42cec76c544db0_176_0.png)


    FIGURE 8-1'
