  md: '# CHAPTER 1 GETTING STARTED


    ![](img/16459f9d4793f783ab42cec76c544db0_35_0.png)


    FIGURE 1-4


    Another essential tool is JSLint, the "JavaScript code quality tool," which checks
    and validates code. Douglas Crockford explains it: JSLint takes a JavaScript source
    and scans it. If it finds a problem, it returns a message describing the problem
    and an approximate location within the source. Just like inline, it''s a convenient
    web application for validating your JavaScript code; use www.jslint.com. Optionally,
    choose the source from Github at https://github.com/douglascrockford/jslint.int.
    In the source code you will find fulljslint.js, which you can run outside of a
    browser. Using Mozilla Rhino, you can use a script for validating JavaScript/jQuery
    from a command line.


    ```

    load(''JSLint/fulljslint.js'');

    var src = readFile(arguments[0]);

    var passes = JSLINT(src);

    print (''Passes Validation'' : ''Failed Validation'');

    ```


    The functions load(), readFile(), and print() are Rhino-specific functions. The
    load() function takes the input string pointing to the fulljslint.js file, loads
    the code into memory, and executes it giving you the readFile() function obtains
    the first parameter passed in the command line, using the arguments array, and
    reads the source into a string. The JSLINT() function then validates the contents
    of the src variable, and returns a Boolean object whether or not the string validated.
    A ternary operator is then printed to the console depending on whether the file
    passed validation. Open a terminal, and try validating a simple JavaScript file:


    ```

    $ rhino runLint js.test

    Passes Lint Validation

    ```


    If the above seems like too much work, you can also take a look at the project,
    jslint4java at http://code.google.com/p/jslint4java/, which simplifies the code
    line seen in the following snippet:


    ```

    $ java -jar jslint4java-1.4.jar test.js

    ```'
  merge: -1
