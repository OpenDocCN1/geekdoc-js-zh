  md: "# Execute a Function No Matter What the Promise Resolution\nis with Deferred.always\n\
    \nOftentimes, you want a function to be called no matter what the promise resolution\
    \ is. This is\nanalogous to the complete callback, which fires on any resolution\
    \ of $.ajax request. In the\nworld of Deferred, the method to use is Deferred.always.\
    \ like takes a single function or an array of functions to fire whenever a promise\
    \ is\nresolved or rejected. The following code shows a simplified example that\
