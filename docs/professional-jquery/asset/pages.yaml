  md: "# Adding Additional HTTP Headers\n\nMockjax also allows you to set additional\
    \ HTTP headers. For advanced Ajax programming, this is vital. Standard ones, like\
    \ HTTP status and contentType are available directly from the Mockjax setup object.\
    \ Others can be set using an optional headers property, which can contain a series\
    \ of name/value pairs representing the desired HTTP headers. The following example\
    \ shows all three of these:\n\n```\n$.ajax({\n  url: '/data/json',\n  file not\
    \ found!,\n  status: 404,\n  contentType: 'text/json',\n  headers: {\n    secretSau:\
    \ 'shhh'\n  }\n});\n```\n\n# PUTTING IT ALL TOGETHER TEST SUITE\n\nOnce again,\
    \ the jQuery test suite is going to offer some lessons on how to organize QUnit\
    \ tests. There's really no better place to look for practical QUnit implementation\
    \ hints because it's the largest, most mature set of QUnit tests available.\n\n\
    As you saw earlier, the jQuery test suite is broken out into 17 modules representing\
    \ granular sections of the library, like data, css, and deferred. Within those\
    \ modules are multiple tests, containing multiple assertions. To get a sense of\
    \ how these modules are organized in a real project, take a look at this heavily\
    \ edited version of the Core module presented in the following code sample. Many\
    \ the tests have been dropped and almost all of the assertions have been commented\
    \ out, but the lessons on structure, granularity, and the ways can still be seen\
    \ through.\n\nSpecific features are tested individually with multiple assertions\
    \ per test. Also, note the presence of bug reports in jquery.merge() and jquery('html',\
    \ context). These issues were reported, test cases were created, and the code\
    \ was fixed. The test cases remain, providing confidence that the bugs remain\
    \ fixed months or years later. Additionally, a reminder that QUnit tests can be\
    \ dynamically created can be seen in the jquery.camelCase() test, which uses an\
    \ Array of subjects and then jquery.each() to loop through them, testing each\
    \ of the seven expected assertions.\n\n```\nmodule('core', { teardown: moduleTeardown\
    \ });\n\ntest('Basic requirements', function() {\n  expect(7);\n  ok( Array.prototype.push.apply(\
    \ \"Array.push()\" );\n  ok( Function.prototype.apply( \"Function.apply()\" );\n\
    \  ok( document.getElementById, \"getElementById()\" );\n  ok( document.getElementsByTagName,\
    \ \"getElementsByByTagName()\" );\n  ok( RegExp, \"RegExp()\" );\n  ok( jQuery,\
    \ \"jQuery\" );\n});\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_319_0.png)"
