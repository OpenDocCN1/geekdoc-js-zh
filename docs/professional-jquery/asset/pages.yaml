    \n# AN EXAMPLE PLUGIN IMPLEMENTATION\n\nAs you canably tell from the breadth of\
    \ options presented in this chapter, you have a lot of ways to approach jQuery\
    \ plugin development. There's no one true.\n\nThat means you need to choose patterns\
    \ and options to follow depending on the goals of your plugin.\n\nAs the following\
    \ code shows, the plugin takes a DOM element and creates an HTML Canvas element\
    \ in the same position and containing the same text as the target element. It's\
    \ pointed at an age of the H1s on.\n\nThis example plugin uses Ben Alman's Globally\
    \ and Per-Call Overridable Options (Best Options Pattern) as it's called in the\
    \ \"Essential jQuery Plugin Patterns\" article to expose a hefty object to both\
    \ global and per-call configuration. Because it's so heavily skewed toward the\
    \ style of the Canvas plugin element, the plugin needs to offer full-featured\
    \ configuration. Because it could operate on many elements on a page, it makes\
    \ sense to allow for default configuration override as well as per-call configuration.\n\
    \n+   * A semicolon leading into an immediately executing function expression\n\
    * $window, document, and undefined passed in as variables to ensure that $ is\
    \ always jQuery, undefined is always undefined, and to shorten lookups to document\
