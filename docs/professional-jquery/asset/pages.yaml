  md: '# INTRODUCTION


    OVER THE PAST SEVERAL YEARS JAVASCRIPT has undergone a remarkable transformation.
    Where once it was a "toy" language relegated to secondary status it''s now one
    of the most important programming languages in the world. With the ongoing importance
    of Ajax-based development and the rise of full-featured JavaScript libraries,
    the stigma surrounding JavaScript has all vanished. As easily as the most popular
    and beginner-friendly library, jQuery is responsible for the lion''s share of
    that.


    jQuery is more than just a beginner''s choice; however, it''s in use by some of
    the largest organizations in the world, adding interactivity to billions of pages
    views every month. Amazon, IBM, Twitter, NBC, Best Buy and Dell are a few of the
    companies using jQuery in production.


    With a web-scale footprint it would come as no surprise that jQuery is evolving
    at web speed. 2011 saw no less than three major releases and the community surrounding
    jQuery continues to blossom as developers the world over bug fixes, plugins and
    work on related projects like UI and QUnit. This flurry of activity ensures that
    jQuery presents a full-featured option for any developer looking to do world-class
    JavaScript.


    This is no matter what philosophy or technique is followed: jQuery is prominently
    featured in the front end of Java/Spring, PHP, .NET, Ruby on Rails, and Python/Django
    stacks all over the Web.


    If you have experience with HTML, CSS, and JavaScript, then this book is for you.
    This book will expand your jQuery knowledge by focusing on the core library with
    the benefit of strong JavaScript expertise coloring learning the lessons. The
    first few chapters will help you to set up a development environment, and review
    important JavaScript concepts. Chapters 3 to 7 examine the jQuery core concepts.
    The second half of the book focuses on applying jQuery in the real world, detailing
    jQuery UI, plugin development, templates, unit testing, best practices, and JavaScript
    design patterns applied with jQuery.


    Hopefully, this book will give you the jQuery chops you''ll need to solve whatever
    problems the Web throws at.


    # WHO THIS BOOK IS FOR


    This book is aimed at three groups of readers:


    +   - Experienced server-side web application developers looking to move more
    heavily into the client side using the world''s most popular front-end library

    - Experienced JavaScript programmers looking to ramp up quickly on jQuery

    - Novice to intermediate jQuery developers looking to expand their jQuery knowledge
    into more advanced topics'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# INTRODUCTION


    This book is not aimed at beginners. For beginners looking to start from the basics
    of HMTL, CSS, and JavaScript/jQuery development, Beginning JavaScript and CSS
    Development with jQuery (Wrox Preface to Programmer) by Richard York is a more
    appropriate choice.


    # WHAT THIS BOOK COVERS


    Professional jQuery provides a developer-level introduction to jQuery as well
    as providing an in-depth look at more advanced features.


    Starting with the first part, the book offers an in-depth introduction to jQuery
    fundamentals, selecting elements, manipulating to the DOM, and binding and reacting
    to browser events.


    Building on solid foundation the book will outline more advanced topics, including
    plugin development, unit testing with JavaScript and other advanced features of
    the library.


    The book focuses on features available as of jQuery 1.7.1, but tries to make note
    of feature support in older versions of the library wherever relevant.


    # HOW THIS BOOK IS STRUCTURED


    This book is divided into two parts, jQuery Fundamentals and Applied jQuery. jQuery
    Fundamentals introduces the core concepts and jQuery focuses on more advanced
    subjects.


    Part I — jQuery Fundamentals consists of the following chapters:


    +   1. Getting Started — This chapter sets up an environment for developing and
    debugging jQuery and JavaScript code and defines the code standards that will
    be used throughout the book. It also talks about ways to package JavaScript for
    production and sets up code.


    +   2. jQuery Primer — This chapter goes through the basics of the JavaScript
    programming language to firm up the foundation upon which the rest of the book
    is built. jQuery is a JavaScript library after all, and many of the best features
    from clever application of core jQuery techniques.


    +   3. The jQuery Core — Introduces the basic functions that make up the library.
    It illuminates the usages of jQuery and introduces many of the utility functions
    that you''ll need to perform a variety of tasks.


    +   4. DOM Element Selection and Manipulation — This chapter dives into one of
    the core features of jQuery, the ability to select and manipulate HTML elements.


    +   5. Event Handling — Introduces another feature of jQuery, the cross-browser
    ability to bind and manage browser events.


    +   6. HTML Forms, Data, and Ajax — Explores one of the biggest revolutions in
    web development of the past 10 years — Ajax.


    +   7. Animations and Effects — Explores some of the shortcuts jQuery offers for
    animating components in your web applications such as moving, fading, toggling,
    and resizing elements.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Part II — Applied jQuery covers the following topics:


    +   8. jQuery UI Part I: Making Things Look Slick — Introduces jQuery UI. jQuery
    UI is an associated user interface library for jQuery that contains widgets, effects,
    animations, and interactions.


    +   9. jQuery UI Part II: Mouse Interactions — Explores additional jQuery UI features
    including moving, sorting, resizing, and selecting elements with the mouse.


    +   10. Writing Effective jQuery Code — Teaches a variety of techniques, best
    practices, and patterns that you can apply to your code immediately to make it
    more efficient, maintainable, and clear.


    +   11. jQuery Templates — Focus on the jQuery Template plugin. jQuery templates
    are a standard way of marking data and markup snippets.


    +   12. Writing jQuery Plugins — Focuses on authorizing jQuery plugins. Being
    able to extend the power of jQuery with custom methods is a fundamental skill
    for a jQuery developer.


    +   13. Advanced Asynchronous Programming with jQuery Deferred — Introduces the
    jQuery Deferred object. $.Deferred, introduced in version 1.5, is a chainable
    utility object that provides fine-tuned control over how callback functions are
    handled.


    +   14. Unit Testing with QUnit — Introduces the general concept of unit testing
    and goes into detail with the specific unit testing framework created and used
    by the jQuery project itself, QUnit.


    # WHAT YOU NEED TO USE THIS BOOK


    jQuery supports the following web browsers. You''ll need one of them to run the
    samples provided with:


    +   - Firefox 3.6, Current – 1 version

    - Internet Explorer 6+

    - Safari 5.0.x

    - Opera Current – 1 version

    - Chrome Current – 1 version


    # CONVENTIONS


    To help you get the most from the text and keep what track of what''s happening,
    we''ve used a number of conventions throughout the book.'
  merge: -1
  pgno: 18
