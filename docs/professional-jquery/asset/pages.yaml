  md: "# Using JQuery UI Widgets | 159\n\n| OPTION | ACCEPTS | DESCRIPTION |\n|---|---|---|\n\
    | Icons | Options | Icons displayed with button widget. Contains a primary and\
    \ secondary icon |\n| Label | String | Button text. |\n\nAs you can tell from\
    \ the options list, you can also include icons with the buttons. A button may\
