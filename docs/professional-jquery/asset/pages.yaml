  md: "# 214 | CHAPTER 10 WRITING EFFECTIVE JQUERY CODE\n\n# LISTING 10-12 (continued)\n\
    \n```\n}\n}\n```\n\n> Code snippet is from garber-irish-object-literal.txt\n\n\
    The next component is a small utility script, which parses the body id and className\
    \ and attempts to fire functions based on the patterns exposed. taken directly\
    \ from Paul's original post, is shown in Listing 10-13.\n\n# LISTING 10-13: \"\
    Markup-based unobtrusive comprehensive DOM-ready execution.\"\n\n```\n/*\n* from\n\
    * http://paulirish.com/2009/markup-based-unobtrusive-comprehensive-dom-ready-execution/\n\
    * License: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication\n*/\n\nUTIL =\
    \ {\nfire : function(func, funcname, args) {\n  var namespace = '' myApp; // indicate\
    \ your obj literal namespace here\n\n  funcname = (funcname === undefined) ? 'init'\
    \ : funcname;\n  if (func== && namespace[func] && typeof namespace[func][funcname]\
    \ == 'function') {\n    namespace[func](args);\n  }\n},\\oadEvents : function()\
    \ {\n  var bodyId = document.body.id;\n  // hit common first.\n  UTIL.fire('common');\n\
    \n  // do all the classes too.\n  $.each(document.body.className.split(/\\s+/),function(i,classnm)\
    \ {\n    UTIL.fire(classnm);\n    UTIL.fire(classnm, bodyId);\n  });\n\n  UTIL.fire('common',\
    \ 'finalize');\n}\n}\n// kick it all off here\n$(document).ready(UTIL.loadEvents);\n\
    ```\n\n![](img/16459f9d4793f783ab42cec76c544db0_235_0.png)\n\n> Code snippet is\
    \ from irish.txt"
