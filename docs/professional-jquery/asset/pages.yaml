    \ performance becomes an issue, there might be gains waiting for you.\n\n# DRY\n\
    \n\"Don't repeat yourself\" (DR) is an off-beat mantra in software development.\
    \ It's an important principle for maintenance and performance. With the simple\
    \ elegance of the jQuery API, it's important stylistically. One place where jQuery\
    \ can encourage enrichment with the liberal use of anonymous functions. Because\
    \ it's so common to pass an anonymous function in an event handler, it's not uncommon\
    \ to see several functions doing the same thing in a block of code. Although this\
    \ may feel faster and convenient in the short term, it's in your best-term interest\
    \ to simplify the code. You don't want to wade through a thousand lines later\
    \ to make code that lives in five places in your application.\n\nA typical example\
    \ is shown in Listing 10-5. The function changes the bound element, fires an Ajax\
    \ request, and then shows a jQuery UI dialog indicating the results of the request.\
    \ Writing it once as an anonymous function makes sense. It's short and full of\
    \ code. If it appears several times throughout your site, it's to simplify.\n\n\
    # LISTING 10-5: Repeating yourself\n\n```\n$*(\"#foo\").click(\n  $(this).addClass(\"\
    active\");\n  $.get(\"/my/app/service/\", function( data ) {\n    $(\"#dialog\"\
    ).text(data.status).dialog(\"open\");\n  }\n```\n\ncontinues"
