    \n# Tabs\n\nTabs are a great way to pack a dense amount of information on a single\
    \ page, and help to organize the content. To create a tab widget, you need a list,\
    \ either ordered or unordered, with an anchor element in each list item. In addition,\
    \ each list item must contain a reference to the associated tab content. A simple\
    \ setup would look something like the following code sample. The href attribute\
    \ of the anchors within our tab list reference their tab content elements ids.\n\
    \n```\n<div id=\"tabs\">\n<ul>\n  <li><a href='#tab1\">Tab #1</a></li>\n  <li><a\
    \ href='#tab2\">Tab #2</a></li>\n</ul>\n<div id=\"tab1\">Tab Number 1</div>\n\
    <div id=\"tab2\">Tab Number 2</div>\n</div>\n```\n\nCode snippet is from sample-tab-markup.txt\n\
    \nTable 8-4 lists the available $.tab() methods."
