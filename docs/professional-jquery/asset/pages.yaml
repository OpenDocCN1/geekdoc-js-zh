  md: '# Event Capturing and Bubbling


    Consider the situation of nested elements with the same kind of event type, for
    example an onclick event type. Which element should have its onclick event handler
    executed first, the inner element or the outer element? Originally, Netscape decided
    that the handling should be from outer to inner, called capturing, as Figure 5-1
    illustrates.


    ![](img/16459f9d4793f783ab42cec76c544db0_120_0.png)


    Microsoft went with the opposite approach where the inner element’s “onclick”
    handler should be executed before the outer element’s, or the bubbling phase,
    as shown in Figure 5-2.


    ![](img/16459f9d4793f783ab42cec76c544db0_120_1.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: "The third argument to the .addEventListener() method is a Boolean flag to determine\
    \ whether or you should use the capture phase.\n\nBut, you may not want event\
    \ propagation or bubbling to occur at all; this can also be controlled in JavaScript.\
    \ In browsers that follow the W3C standard, a call to the method .stopPropagation()\
    \ is used. In older versions of IE, the property cancelBubble() of the event object\
    \ is assigned a value of true.\n\nThe following example demonstrates event capturing:\n\
    \n```\n<html>\n<head>\n  <style type=\"text/css\">\n  .divClass {\n    width:\
    \ 300;\n    height: 300;\n    background-color: blue;\n  }\n\n  .div2Class {\n\
    \    width: 200;\n    height: 200;\n    background-color: green;\n  }\n\n  .div3Class\
    \ {\n    width: 100;\n    height: 100;\n    background-color: red;\n  }\n</style>\n\
    \  <script src=\"http://code.jquery/jquery-1.7.1.js\"></script>\n  <script>\n\
    \ $(function() {\n  function f(id) {\n    document.body.innerHTML += \"<p>executing\
    \ handler for div *\" + id + \"</p>\";\n  }\n\n  document.getElementById(\"div1\"\
    ).onclick = function() {\n    f(\"1\");\n  }\n\n  document.getElementById(\"div2\"\
    ).onclick = function() {\n    f(\"2\");\n  }\n\n  document.getElementById(\"div3\"\
    ).onclick = function() {\n    f(\"3\");\n  }\n});\n  </script>\n</head>\n<body>\n\
    ```"
