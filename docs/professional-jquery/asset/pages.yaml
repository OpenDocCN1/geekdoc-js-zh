  md: "Extending the pattern to additional modules: Listing 10-11 illustrates a dashboard\
    \ module, complete with a private configuration object and a public method to\
    \ allow access to dashboard configuration based on a set of predefined criteria.\
    \ If you've got experience with languages like C#, Java, and C++, you're familiar\
    \ with the usage of the private and public keywords. Patterns allow JavaScript\
    \ to provide similar functionality. It's not every day that you'll need to use\
    \ this kind of protected access, but it's important to know that it's when the\
    \ need arises.\n\n# LISTING 10-11: A dashboard module\n\n```\nmyApp.dashboard\
    \ = function ($ ) {\n  // private variables and methods\n  var config = {\n  \
    \  \"color\" : \"blue\",\n    \"title\" : \"my dashboard\",\n    \"width\" : \"\
    960px\"\n  };\n  return {\n    init : function() {\n      //initialize the dashboard\n\
    \    },\n    //updateConfig allows for monitored configuration config object\n\
    \    updateConfig : function( obj ) {\n      if ($.inArray(obj.color, [\"red\"\
    , \"blue\", \"green\", \"purple\"] !== -1) {\n        config.color = obj.color;\n\
    \      }\n      config.title = obj.title || config.title;\n      config.width\
    \ = obj.width || config.width;\n    },\n    render : function() {\n      //renders\
    \ the dashboard\n      var $dashboard = ${(\"div/>\").html(\"<h1>\");\n      $dashboard.text(config.title);\n\
    \      .css({\n        \"width\" : config.width,\n        \"color\" : config.color\n\
    \      });\n      $(\"#main\").append($dashboard);\n    }\n  };\n}( jQuery );\n\
    ```\n\n> Code snippet is from advanced-module.txt"
