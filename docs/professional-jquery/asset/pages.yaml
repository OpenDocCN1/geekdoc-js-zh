- img_proc: true
  md: "```\nequal(data.name, \"Testing\", We expect the name to match);\n\nstart();\n\
    });\n));\n```\n\n> Code snippet is from asynctest.html\n\nThis is definitely a\
    \ recommended option. It guarantees your asynchronous tests will be set up correctly\
    \ and will allow you to differentiate between regular and asynchronous tests.\
    \ Doing so will make your tests more readable. Other developers will know, without\
    \ reading any of the assertions or other logic within the test body, that this\
    \ is an asynchronous test.\n\n# Mocking Ajax Requests\n\nThough it's possible\
    \ to test Ajax requests with live data, it's not recommended. As you'll remember\
    \ from earlier in the chapter, one of the fundamentals of unit testing is that\
    \ tests be self-contained. To test that, it's best to mock your Ajax requests.\n\
    \nThankfully, there is a plugin already available to do that in QUnit. Mockjax\
    \ from the fine folks at appendto (https://github.com/appendto/query-mockjax)\
    \ allows you to set up URLs that will be captured by the Mockjax plugin. Doing\
    \ means they'll be intercepted before they hit the traditional Ajax method and\
    \ the response will be handled by Mockjax. Mockjax allows you to craft a testable\
    \ response and customize it with headers of your own design.\n\nRewriting the\
    \ previous example to better following test practices, the following example shows\
    \ a way to write up a proper, testable Ajax request with Mockjax.\n\nIn this example,\
    \ the Mockjax plugin takes three arguments: the url to be captured and mapped\
    \ to Mockjax, the responseTime to simulate latency, and the responseText, which\
    \ in this case, will be converted to the JSON data passed into any successful\
    \ Ajax callback methods.\n\nWith Mockjax, the test is now self-contained.\n\n\
    ```\ntest(\"async\", function() {\n  expect(2);\n  $.mockjax({\n    url: '/data/json/',\n\
    \    responseTime: 100,\n    responseText: {\n      status: 'success',\n     \
    \ name: 'Testing'\n    }\n  });\n});\n\nstop();\n\n$.getJSON(\"/data/json/\",\
    \ function(data) {\n  ok(data, \"We expect to get data from the server\");\n \
    \ equal(data.name, \"Testing\", We expect the name match\");\n});\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_317_0.png)"
