  md: "If you see that for all of your tests, it's time to go to lunch. You've earned\
    \ it.\n\n# The Differences between xUnit and QUnit\n\nAlthough the name might\
    \ imply otherwise, it should be noted that QUnit isn't part of the xUnit family.\n\
    \nxUnit is the name given to a family of testing frameworks that trace their roots\
    \ back to a design by Kent Beck, outlined in the paper \"Simple Smalltalk Testing:\
    \ With Patterns\"http://www.programming.com/testfram.htm). Originally implemented\
    \ for Smalltalk as SUnit, this design has gone to be ported to other languages\
    \ including Java (JUnit), C++ (CppUnit), and .NET (NUnit).\n\nThough QUnit shares\
    \ basic concepts like assertions, significant differences exist between the xUnit\
    \ design and QUnit. If you are, in the previous example, you saw two arguments\
    \ for equal:actual and expected. In the xUnit design, the order of these arguments\
    \ is reversed.\n\nSay xUnit and QUnit also have completely different assertion\
    \ names. Looking again at the previous example, equal is analogous to the xUnit\
    \ assertEquals. They serve the same purpose, just with slightly different syntax.\
    \ Another difference is that some assertions included in xUnit are missing from\
    \ QUnit.\n\nNone of this will matter if you're not familiar with the xUnit family,\
    \ of course. If you are, it is worth keeping your eye on the differences so you\
    \ don't get tripped moving forward.\n\nNow that you've gotten potential gotcha\
    \ out of the way, you can continue your examination of QUnit.\n\n# A Failing QUnit\
    \ Test\n\nYou've seen a passing test; now it's time to look at a failing test.\
    \ With the same markup as the previous example, you can run the test with an equal\
    \ assertion:\n\n```\ntest(\"Hello World\", function() {\n  var message = \"Goodbye\
    \ cruel world\";\n  equal(message, \"hello world. We expect the message to match\
    \ \");\n});\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_307_0.png)\n\nCode\
    \ snippet from failing-test.html\n\nAs you can see in Figure 14-2, a failing test\
    \ provides more interesting information than a passing test. For starters, the\
    \ message defined as the third argument is displayed alongside the expected and\
    \ actual values of the variable being tested, in this case \"hello world\" and\
    \ \"Goodbye cruel world,\" respectively. Additionally, it does a diff of the variables\
    \ and a pointer to the line that generated the error."
  merge: -1
