  md: "Additionally, the related methods Deferred.rejectWith() and Deferred.resolveWith()\
    \ are available to allow you to set a specified this context as the first argument\
    \ when resolving or rejecting a Deferred.\n\n# Tracking Progress with Deferred.progress\
    \ and Deferred.notify\n\nAdded in jQuery 1.7, the Deferred.progress and Deferred.notify\
    \ methods combine to allow for in-process updating of long-running functions.\n\
    \nThe basic setup is simple. At different points in your application, you use\
    \ notify methods that are designed to fire at specific points in an application\
    \ or in a long-running method. Deferred.notify accepts an optional argument, which\
    \ will be passed along to the Deferred.progress callback. The function Deferred.notify\
    \ accepts with a context argument indicating the desired this for the Deferred.progress\
    \ callback. The Deferred.progress callback is added to the chain. This callback\
    \ method should handle whatever was sent along Deferred.notify or Deferred.notifyWith.\n\
    \nIn the simple example that follows, the function longRunning is a Deferred that\
    \ uses setTimeout to take 500ms to resolve its promise. Before the timer, there\
    \ is a string notification sent out. The progress function accepts that argument\
    \ and updates the text into the DOM. After the process is finished, you notify\
    \ that the process is complete and manually resolve the promise.\n\nIn theory,\
    \ the text update could have been handled by the Deferred.done callback, leaving\
    \ the progress callback to handle just the original notification. Deferred.notify\
    \ at both ends of the process. Also, there's always a case to be keeping repetition\
    \ of code down to a minimum. So it just makes sense to keep all of the notifications\
    \ bound to progress.\n\n```\nvar longRunning = function() {\n  return S.Deferred(function(dfd)\
    \ {\n    dfd.notify(\"operation started\");\n    var callback = function() {\n\
    \      dfd.notify(\"operation finished\");\n      dfd.resolve();\n    }\n\n  \
    \  setTimeout(callback, 5000);\n  }).promise();\nlongRunning.progress(\n  function(notification)\
    \ {\n    $(\"#notifier\").text(notification).fadeIn(500);\n  }\n).done(function()\
    \ {\n  $(\"#notifier\").css({\n    \"color\": \"green\",\n    \"font-weight\"\
    : \"bold\"\n  });\n});\n});\",\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_298_0.png)"
  merge: -1
  pgno: 298
- img_proc: true
  md: "# Debugging Deferred.state\n\nIf you ever need to debug Deferred resolution\
    \ (and if you will ever get deep into using Deferrals), you'll be taking advantage\
    \ of Deferred.state.\n\nA simple utility function, Deferred.state returns a string\
    \ value representing the current state of a Deferred. The three return values\
    \ are \"pending,\" \"resolved,\" and \"rejected.\"\n\nTable 13-1 defines the three\
    \ states.\n\n**TABLE 13-1** Potential Deferred States\n\n| STATE | DEFINITION\
    \ |\n| --- | --- |\n| pending | The Deferred object is not yet in a completed\
    \ state. |\n| resolved | The Deferred object is in the resolved state, meaning\
    \ that the deferred.resolve() method has been called and the Deferred callback\
    \ methods have fired. |\n| rejected | The Deferred object is in the resolved state,\
    \ meaning that the deferred.reject() method has been called and the Deferred fail\
    \ callback methods have fired. |\n\nThe following example shows Deferred.state\
    \ calls sprinkled throughout a short Defer chain based on the long-running example\
    \ from the previous section.\n\n```\nvar longRunning = function() {\n  return\
    \ $.Deferred(function (dfd) {\n    dfd.notify(\"operation started\");\n    console.log(dfd.state);\n\
    \    var callback = function() {\n      dfd.notify(\"operation finished\");\n\
    \      dfd.resolve();\n    };\n    setTimeout(callback, 5000);\n  }).promise();\n\
    }\n```\n\n```\nlongRunning().progress(\n  function (notification) {\n    console.log(dfd.state);\n\
    \    $(\"#notifier\").text(notification).fadeIn(500);\n  }).done(function() {\n\
    \    console.log(dfd.state);\n    $(\"#notifier\").css({\n      \"color\": \"\
    green\",\n      \"font-weight\": \"bold\"\n    });\n  });\n);\n```\n\n> Code snippet\
    \ is from deferred-state.txt"
  merge: -1
