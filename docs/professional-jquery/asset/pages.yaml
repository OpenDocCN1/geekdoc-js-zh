  md: "# Resolving and Rejecting Promises\n\nAs you've seen in throughout this chapter,\
    \ you occasionally need to manually resolve or reject promises. You've already\
    \ encountered the two most common methods to do this: Deferred.resolve and Deferred.reject.\
    \ What you haven't seen is the optional arguments in use. Both of these methods\
    \ accept an optional argument which, in turn, will be passed to the Deferred.done\
    \ or Deferred.fail methods depending on the resolution of the promise.\n\nThe\
    \ following example shows a simplified illustration of these optional arguments.\
    \ Returning to the mail example, the code snippet creates an updated date string\
    \ to represent the time of the mail update. This string is passed along to the\
    \ Deferred.fail and Deferred.done methods. Additionally, the number of messages\
    \ is passed to Deferred.done to update the #message paragraph with the current\
    \ number of new messages retrieved.\n\n```\nfunction newMessages( obj ) {\n  $(\"\
    message\").text(\"updated at \"n    + obj.date\n    + \" and have \"n    + obj.number\n\
    \    + \" new messages\")\n}\n\nfunction noMessages( obj ) {\n  $(\"message\"\
    ).text(\"updated at \"n    + obj.date\n    + \" and have no new messages\")\n\
    }\n\n$.when(\n  $.ajax( \"/get/mail/\") )\n).pipe(\n  function( data ) {\n   \
    \ var date = new Date();\n    date = date.toDateString() + \" * at \" + date.toTimeString();\n\
    \    if ( data.messages.length > 0 ) {\n      return Deferred.resolve({\n    \
    \    date: date,\n        number: data.messages.length\n      });\n    } else\
    \ {\n      return Deferred.reject({\n        date: date\n      });\n    }\n  }\n\
    ).done(\n  newMessages\n).fail(\n  noMessages\n);\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_297_0.png)\n\
    \nCode snippet is from resolving-and-rejecting.txt"
