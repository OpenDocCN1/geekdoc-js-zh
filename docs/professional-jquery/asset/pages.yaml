  md: "# CHAPTER 5 EVENT HANDLING\n\n```\n<label for=\"userName\">\n<input type=\"\
    text\" name=\"userName\" /><br>\n<label for=\"email\">Email</label>\n<input type=\"\
    text\" name=\"email\" /><br>\n<label for=\"password\">Password</label>\n<input\
    \ type=\"password\" name=\"password\" />Re-enter Password\n<label for=\"chkPassword\"\
    ></label>\n<input type=\"text\" name=\"chkPassword\" /><br>\n<input type=\"button\"\
    \ name=\"validate\" value=\"Validate Inputs \" />\n</form>\n<input type=\"button\"\
    \ name=\"addLocation\" value=\"Add Location \" />\n<body>\n</body>\n</html>\n\
    ```\n\nCode snippet from event-handling.txt\n\n# JQUERY'S NEW EVENT API\n\nStarting\
    \ with 1.7, jQuery has made to simplify the API for setting events. While you'll\
    \ still be able to .bind() and .unbind(), .live() and .die() and set .click()\
    \ and .blur() the old way, there's now a unified API which bundles all the various\
    \ functionalities under one, consistent API. The two new methods are .on() and\
    \ .off(). Moving forward, these two methods represent the preferred API, so it's\
    \ worth learning about them now so that any new projects you kick off going start\
    \ by using the recommended API.\n\nThe beauty of .on() is that it replaces the\
    \ functionality of all the event methods covered in this chapter with a single,\
    \ flexible API. The following code sample shows a basic example of .on(), using\
    \ it to bind a click to an element present in the DOM. IT accepts two arguments\
    \ in this example, an eventType and a handler function to execute.\n\nThis would\
    \ come directly using .bind(\"click\") or .click() and as proof, this sample rewrites\
    \ the .bind() example earlier in the chapter.\n\n```\n<html>\n<head>\n<script\
    \ src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n<script>\n$(function()\
    \ {\n  $(\"#aDiv\").on('click', function() {\n    console.log(\"Handler 1\");\n\
    \  });\n\n  $(\"#aDiv\").on('click', function() {\n    console.log(\"Handler 2\"\
    );\n  });\n});\n</script>\n</head>\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_135_0.png)"
  merge: -1
  pgno: 135
