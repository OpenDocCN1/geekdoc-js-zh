  md: "These days it's frequent to use JavaScript objects in JSON format, which is\
    \ completely logical considering JSON objects are Java objects. They also have\
    \ the advantage of being lighter-weight than XML data. You could use the $.ajax()\
    \ method to obtain a JSON object from the server like this:\n\n```\n$.ajax({\n\
