  md: "# USING $.data()\n\nAs you saw in the previous section, the new HTML5 attribute\
    \ is designed for structured, programmatic access to custom attributes. jQuery\
    \ provides a straightforward way to do just with $.data(). Data attribute sets\
    \ on an HTML element are immediately available to be retrieved with $.data().\
    \ Though that extremely convenient, $.data() also provides the ability to bind\
    \ any data to a DOM element. This allows arrays and complicated objects to be\
    \ stored as well as the strings previously possible with hand-rolled attributes.\
    \ It should be noted that while $.data() can read HTML attributes, it doesn't\
    \ actually write values to elements in form of data attributes. This makes sense\
    \ because arrays and objects don't lend themselves to being stored as string values\
    \ of HTML attributes.\n\nThis is extremely powerful, and if you've been doing\
    \ this for a while, it will feel like something you've been searching for your\
    \ whole career.\nIf you've ever passed an object as an argument between several\
    \ methods, you'll be happy to know you'll never have to learn to embrace the $.data()\
    \ method. Gone are the days of managing application state with function chains\
    \ across a half dozen calls. Now, you can simply bind any data or component directly\
    \ on the DOM element itself for convenience, direct access throughout the application\
    \ life cycle.\n\nAdditionally, it's important to note that the data API stores\
    \ data in a way that is safe from circular references, which prevents memory leaks.\n\
    \nA note on support: HTML5 data attribute was supported in jQuery 1.4.3 and a\
    \ revision was released to market the W3C spec more closely in jQuery 1.6.\n\n\
    # The Basics of the .data() API\n\nLike jQuery methods, $.data() can be used as\
    \ both a setter and a getter. If two arguments, as a name/value pair, or an object\
    \ of name/value pairs is passed, $.data() will set the data values correctly.\
    \ A single string passed will return the value of named data property. Some basic\
    \ examples, including strings, Boolean, arrays, and objects being used as values\
    \ for the $.data() method, are shown in Listing 10-14.\n\n> LISTING 10-14: Simple\
    \ .data() examples\n\n```\n$('#dashboard).data('updated', 1321358806453);\n\n\
    $('#body).data('fantastic', true);\n\n$('#settings).data('faves', [1,4,6,8,9,14,27,42]);\n\
    \n$('#boston).data(bostonTeams, {\n  'mlb': 'Red Sox', 'nfl': 'Patriots',\n  'nba':\
    \ 'Celtics', 'nhl': 'Bruins'\n});\n```\n\nCode snippet from data-examples.txt"
  merge: -1
