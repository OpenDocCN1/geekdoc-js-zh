    # Leverage DOM Hyppace


    Another, related way to improve DOM manipulations is to do them in what has been
    referred to as "DOM Hyperspace." Basically, this boils down to creating and/or
    DOM elements entirely on the JavaScript side of the bridge and crossing over to
    the DOM itself once manipulations are complete. You can do this by creating jQuery
    queries as variables to be manipulated or by using $.detach() to pull elements
    out of the DOM to manipulate. In each case, the frames are inserted after the
    operations are completed. The basic idea behind each technique is shown in Listing
    10-2.


    # LISTING 10-2: Creating and manipulating elements in JavaScript


    ![](img/16459f9d4793f783ab42cec76c544db0_218_0.png)


    ```

    //Detach to pull elements out of the document.

    var $sidebar = \$("#sidebar").detach();

    /*

    Populate the sidebar with menus, ads, and other miscellaneous elements

    */

    $("#main").append($sidebar);


    //Creating DOM elements with jQuery to later append to the document

    var $sidebar = \$("<aside id=''sidebar''></aside>").detach();\n/*

    Populate the sidebar with menus, ads, and other miscellaneous elements

    ```


