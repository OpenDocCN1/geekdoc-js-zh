  md: "# 176 | CHAPTER 8 JQUERY UI PART I—MAKING THINGS LOOK SLICK\n\nExpectedly,\
    \ to change \"percent finished\" of the progress bar, change the value option.\
    \ The following example shows a progress bar that slowly increments to 100 percent\
    \ after page load:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <link href=\"css/ui-jquery/jquery-ui-1.8.13.css\"\
    \ rel=\"stylesheet\" />\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n  <script src=\"jquery-ui-1.8.13.custom.min.js\"></script>\n  <script>\n\
    \    $(function() {\n      $(\"bar\").progressbar({ value: 0 });\n      setTimeout(updateProgress,\
    \ 500);\n    });\n\n    function updateProgress() {\n      var progress;\n   \
    \   progress = $(\"bar\").progressbar(\"option\", \"value\");\n      if (progress\
