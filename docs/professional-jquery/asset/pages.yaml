  md: "For more software design patterns in general, the classic \"Gang of Four\"\
    \ book, Design Patterns: Elements of Reusable Object-Oriented Software by Erich\
    \ Gamma, Richard Helm, Ralph Johnson, and John Vlissides, is the indispensable\
    \ reference. Check out it if anything in the following section strikes a chord\
    \ with you.\n\nIn this section, you learn about techniques that limit global namespace\
    \ pollution, provide logical module initialization, and allow for easier collaboration\
    \ among multiple developers.\n\n# Creating an Application Namespace with a Singleton\n\
    \nOne of the simplest techniques you can use to structure your code is to use\
    \ well-chosen namespaces. This pattern is commonly called a singleton.\n\nBefore\
    \ you look into, look at the unstructured approach it agrees upon. This style\
    \ of code is still common and was especially prevalent in the earliest days of\
    \ JavaScript programming. For a long time, it was typical to simply present a\
    \ series of function declarations defined at the global space. This throwback\
    \ approach is shown in Listing 10-6.\n\n+   LISTING 10-6: The old-school approach\n\
    \n```\nfunction myFunctionInit() {\n  //code to initialize your application\n\
    }\n\nfunction myFunctionDashboard() {\n  //your dashboard feature goes here\n\
    }\n\nfunction myControlPanel() {\n  //control panel code goes here\n}\n\nfunction\
    \ myFunctionSettings() {\n  //code that updates settings goes here\n}\n\nkicked\
    \ off with the ready() function {\n  $( document ).ready(myAppInit);\n```\n\n\
    > Code snippet from multiple-functions.txt\n\nThough there's nothing wrong about\
    \ this pattern in a technical sense, it presents some compatibility hurdles.\n\
    \nTo see the compatibility issues, you can just pop open Firebug and navigate\
    \ to the DOM tab. There'll see all the functions created available in the global\
    \ namespace. This is illustrated in Figure 10-1."
