    \nCode snippet is from escaped-selectors.txt\n\nThe last two basic selectors in\
    \ this section are the multiple selector and descendant selector.\nThe descendant\
    \ selector, which takes the form $(\"ancestor descendant\"), returns a wrapper\
    \ object\nwith the descendants of a specified ancestor. For example:\n\n```\n\
    $(*form input)\n```\n\nreturns a wrapper with all of the inputs that are children\
