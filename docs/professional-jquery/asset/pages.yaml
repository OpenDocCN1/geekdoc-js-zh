  md: "# MAKING ELEMENTS SELECTABLE\n\nYet another desktop paradigm to the web environment\
    \ is selectable. A selectable component is selected by clicking and holding a\
    \ blank area and dragging the mouse up to another area and releasing the mouse\
    \ button. Or you can just click inside of the component.\n\nClicking on an outside\
    \ area deselects, and holding Ctrl + click (or Command + click on Apple computers)\
    \ enables you to select multiple items, as shown in Table 9-8. Selected elements\
    \ are given the class `ui-selected`.\n\nTABLE 9-8: Selectable Options\n\n| OPTION\
    \ | ACCEPTS | DESCRIPTION |\n|---|---|---|\n| disabled | Boolean | Enables/disables\
    \ the functionality. |\n| autoRefresh | Boolean | This determines whether to refresh\
    \ the position and size of each selected element at the beginning of each selection\
    \ operation. |\n| cancel | Selector | Prevents selection from starting on specified\
    \ elements. |\n| delay | Integer | Delay time, in milliseconds, before selection\
    \ goes into. |\n| distance | Integer | The distance, in pixels, for when selection\
    \ should start. |\n| filter | Selector | The matching child elements will be able\
    \ to be selected. |\n\nThe following example shows a combination of a div, anchor\
