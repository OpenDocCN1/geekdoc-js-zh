  md: '# Writing jQuery Plugins


    WHAT''S IN THIS CHAPTER?


    +   - Plugin Basics

    - Plugin Best Patterns and Practices

    - jQuery UI Widget Factory


    In this chapter, you learn how to write jQuery plugins. Being able to extend the
    power of jQuery with custom methods is a fundamental skill for a top jQuery developer.


    A large part of the popularity of jQuery comes from the community-driven plugin
    ecosystem and the wide array of functionality available to expand on jQuery''s
    core functionality.


    From subtle user-interface enhancements like those provided by hoverintent to
    full-featured components like those available as part of the jQuery UI project,
    the plugin environment in jQuery is a vibrant, vital resource. It''s easy enough
    to take part and create plugins of your own. This chapter outlines how.


    You will learn about the different methods of extending jQuery, common plugin
    conventions, and advanced options to further expand your plugin possibilities.


    After reading this chapter, you''ll be ready to extend and enhance jQuery on your
    own, and will have a variety of resources available to help you in pretty much
    any plugin situation you''re likely to experience.


    # THE PLUGIN BASICS


    At the most basic level, creating a jQuery plugin is remarkably easy. After just
    the first page or two of this chapter, you should have enough knowledge to create
    a simple plugin.


    Don''t be fooled by the ease of the basic level. "Easy" to do a basic version
    doesn''t mean it''s easy to do it right. Following a number of best practices
    will ensure optimized performance,'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'cut down by jquery, and provide the highest degree of interoperability between
    your code and the rest of the jQuery environment in which your code is running.
    This first section goes through some important plugin fundamentals.


    # # Applying Plugin Naming Conventions


    Imagine after reading this chapter, you''re full of knowledge about plugin development
    and you''re happy to be sitting down to write your first jquery. You fire up your
    favorite editor or IDE, and create a new script file. Depending on your editor
    of choice, you may have the option of creating a file then and you may not have
    the option until save. Regardless of the reality in your particular editor, you''ll
    want to know in advance how to name your files. The answer is straightforward,
    but it''s nice to be prepared.


    Generally, jQuery plugins are named with the following pattern:


    ```

    jquery.pluginName.js

    ```


    Minified versions are similarly named, adding a min flag:


    ```

    jquery.pluginName.min.js

    ```


    The reason for including jquery in the name is simple. It''s a jQuery plugin,
    so it''s convenient to indicate compatibility right in the filename. Some plugins
    come with support for multiple libraries, so this is an important touch.


    Adding .min to minified versions allows for two versions to exist side by side,
    which is very handy because it enables developers to switch between full and minified
    versions while debugging.


    # # How to Extend jQuery


    Now that you know how to name your files, it''s time to actually get down to the
    business of extending jQuery.


    jQuery offers two, simple patterns for extending jQuery and one more complicated,
    but very powerful, and most common, is a simple alias for the prototype property
    of the jQuery function, jquery.fn.


    The first, the second is the method $.extend(). The third, more complicated option
    is the powerful jQuery Widget Factory.


    # # Using jQuery.fn


    If you''ve ever looked at the jQuery source, you''ve seen the following very early
    in the source code. As of 1.7.1, it''s visible on line 97:


    ```

    jQuery.fn = jQuery.prototype = ( //jquery goes here //

    ```


    > Code snippet is from jquery.fn.txt


