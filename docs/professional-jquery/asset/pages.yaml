  md: 'In a nutshell, a minimized version of jQuery is loaded from an online CDN over
    the Web. The jQuery function is called with the document object passed as a parameter.
    This creates a jQuery wrapper object which has a ready() method whose only argument
    is a function. This function is invoked when the browser has finished converting
    the HTML into the page document model (or DOM). At that moment, your function
    displays an alert, "Hello World." There''s much going on there than makes the
    eye and if you don''t understand yet, don''t worry. jQuery revisits JavaScript,
    and most importantly, jQuery''s way of mapping functions. You''ll understand the
    reason for the anonymous function. In Chapters 3 and 4, you see the concepts behind
    the jQuery wrapper, and using selectors to get elements from the DOM. Then you''ll
    have a better idea of what handles the aforementioned .ready(). So, although the
    code written for this example is brief, it''s rather dense and will be unpacked
    later.


    # JAVASCRIPT CONVENTIONS USED IN THIS BOOK


    Throughout this book, we''ll stick to a small subset of the JavaScript Style Guide
    found at http://google-styleguide.com/svn/trunk/javascriptguide.xml and the jQuery
    Core Style Guidelines found at http://docs.jquery.com/jQuery_Core_Style_Guidelines.
    The Google JavaScript Style Guide specifies the following:


    +   - Declarations of variables always use var, except intentionally creating
    a global variable.

    - Always use semicolons. This is important for modifying code.

    - Constants are uppercase, with each word separated by an underscore.

    - Functions, variables, and method names use all camel notation with the first
    letter lowercase.

    - Classes and enum names also use camel notation but with the first letter uppercase.


    The big exception to any of these rules is when an example demonstrates how to
    not do something. The jQuery team also published a set of conventions for development
    of the core library. The documentation mentions the following:

    - Spacing code: Abundantly use spacing, using instead of tabs. Don''t use spaces
    at the end of lines and empty lines should not have spaces either. This example
    illustrates the preferred spacing.


    +   - Using comments: For multiple-line comments use /* */ and for single-line
    comments use //, with an empty line above the comment. The single-line comment
    precedes the comment that it refers to, and should be the only thing on on the
    line.'
