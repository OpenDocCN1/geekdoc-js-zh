  md: '# Understanding the Structure of a jQuery Script


    The .noop() method is a stub function; it doesn''t perform any operation. But,
    it''s still useful for moments you''d like to pass an empty function as an argument,
    e.g., to install a new event that does nothing by default.


    # Array Operations


    Similar to .isObject() and .is(), you also have an .isArray() at your disposal.
    Besides checking whether an object is an array, you can turn an array-like object
    to a true array using .makeArray(). By converting an array-like object to an array,
    you lose its methods and properties. The following illustrates a simple use of
    makeArray() which converts a cloned version of jQuery into a standard Array.


    ```

    // clone jQuery object

    var clonedjq = $.extend(true, {}, $);

    // returns "object"

    $.type(clonedjq)


    // convert to JS array

    var jArray = $.makeArray(clonedjq);


    // returns "array"

    $.type(jArray);

    ```


    jQuery also provides an additional convenience method called .merge(), which takes
    the elements from a second array and appends them to the elements of a first array,
    preserving the order of the two arrays:


    ```

    var spooks = ["wraiths", "vampires", "lichs"];

    var nums = [1,2,3];

    var mergedArrays = $.merge(spooks, nums);

    alert(mergedArrays); // displays: wraiths, vampires, ls, 1, 2, 3

    ```


    The next two methods are useful for working with the elements of an array. .isArray()
    checks for the existence of a value (in the array no less) and returns the index
    of the value if found. If the value isn''t in the array, -1 is returned. .unique()
    removes duplicate elements from an array of DOM elements. This following snippet
    demonstrates both methods:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    </head>

    <body>

    <p></p>

    <p></p>

    <p></p>

    <p class="duplicate"></p>

    <p class="duplicate"></p>

    <p class="duplicate"></p>

    </p>

    <script

    src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>

    ```


