  md: "Finally, there's one more selection method to look at before moving onto modifying\
    \ elements.andSelf() is the kind of method that you don't always need, but when\
    \ you do it it's invaluable. As learned when looking at .end() jQuery maintains\
    \ a stack that keeps track of changes to the matched elements. When a method traverses\
    \ the DOM .filter() or .find() the new set is pushed onto the stack. If you need\
    \ to manipulate the previous set of matched elements, .andSelf() will come to\
    \ the rescue. The following code sample illustrates using .andSelf() to add a\
    \ div back onto the stack after a .find() manipulates the set. The new set of\
    \ elements matches the order of the DOM.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <script src='http://code.jquery.com/jquery-1.7.1.js'></script>\n</head>\n<script>\n\
    function() {\n  console.log(\" * \");\n  // [ div ]\n  console.log(\" *\").find(\"\
    p*\")\\n  // [ p, p, p ]\n  console.log(\" div \").find(\"p*\").andSelf());\n\
    \  // [ div, p, p, p ]\n}\n</script>\n</head>\n<body>\n<div>\n  <p>Paragraph</p>\n\
    \  <p>Paragraph</p>\n  <p>Paragraph</p>\n  <p>Paragraph</p>\n</div>\n</body>\n\
