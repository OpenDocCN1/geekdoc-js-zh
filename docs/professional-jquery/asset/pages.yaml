  md: "browsers support this by default with a placeholder attribute. For example,\
    \ the following code sample shows two inputs with the placeholder attribute set.\
    \ Figure 6-2 shows these inputs rendered on the page.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <form>\n    <input type=\"text\" placeholder=\"name\">\n   \
    \ <input type=\"text\" placeholder=\"email\">\n  </form>\n</body>\n</html>\n```\n\
    \nThis placeholder attribute solves, at the browser level, a naturally hard-coded\
    \ usability enhancement. It while every browser supports placeholder natively,\
    \ we're not at the place where we can put away the code solutions. The following\
    \ code sample will show how to implement a polyfill for placeholder using jQuery.\
    \ Again, we use Modernizr to detect if the browser supports this feature, and\
    \ then we use jQuery guesswork to fill the gap for other browsers.\n\nIn a production\
    \ environment, you'd likely use one of the excellent placeholder polyfill, like\
    \ the one written by Matthias Byens: https://github.com/mathiasbynens/jquery-placeholder.\
    \ It is instructive to show how you might solve this problem without the use of\
    \ plugins. Feature detection and polyfills are a strong piece of modern web development,\
    \ or seeing how it works under the hood can enlighten in ways simply using a plugin\
    \ can't.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\n  <script src=\"http://ajax.ajdn.com/ajax/libs/modernizr/1.7/modernizr-1.7.min.js\"\
    ></script>\n  <script type=\"text/javascript\">\n  function() {\n    if (!Modernizr.input.placeholder)\
    \ {\n      $('input[type=text]').focus(function() {\n        if ($(this).val()\
    \ === $(this).attr('placeholder')) {\n          $(this).val('');\n        }\n\
    \      });\n      \n      $('input[type=text]').blur(function() {\n        if\
    \ ($(this).val() === '') {\n          $(this).val($(this).attr('placeholder'));\n\
    \        }\n      });\n    }\n  });\n  </script>\n</head>\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_146_0.png)"
