  md: "\"promises\" to give a value at a convenient future time; this is particularly\
    \ useful for asynchronous computing. jQuery deferred objects, also based on the\
    \ promise pattern, allow chainable callback functions.\n\nDeferred objects begin\
    \ in the unresolved state, and can change from unresolved to either resolved or\
    \ rejected. Deferred objects are covered in depth in Chapter 13.\n\n$.ajax() method,\
    \ indeed all Ajax methods, returns a promise object called jqXHR which is a superset\
    \ of the XMLHttpRequest object. This allows Ajax calls to be rewritten, as:\n\n\
    ```\n$.ajax(url : \"/go/here\")n.success(function() { /* handle success */ }\n\
    .complete(function() { /* handle complete method */ });\n```\n\nThere are some\
    \ shortcut methods as well, $.get() and $.post(), which send and get post requests,\
    \ respectively. In the case of $.get(), instead of having to write:\n\n```\n$.ajax({\n\
    \  type: \"get\",\n  url: \"/go/here.php\",\n  data: data,\n  success: callbackFunction,\n\
    \  dataType: \"json\"\n});\n```\n\nyou can instead use:\n\n```\nvar jqxhr = $.get(\"\
    /go/here.php\", function(data) { });\n```\n\nThe general format is\n\n```\n$.get(url,\
    \ parameters, callback, type );\n```\n\nJust like $.ajax(), the $.get() method\
    \ returns a jqXHR object. The corresponding shortcut for posts, $.post(), is almost\
    \ identical, except for the type of course:\n\n```\n$.post( url, parameters, callback,\
    \ type );\n```\n\njQuery also has an incredibly useful method, $.load(), for making\
