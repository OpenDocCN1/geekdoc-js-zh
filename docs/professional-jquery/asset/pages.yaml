  md: '# Development Tools


    To install Firebug, go to Tools 🛠️ Add Ons on the menu bar, click Get Add Ons
    on the resulting dialog, and search for Firebug. Click Add to Firefox. After installing,
    you''ll notice a bug icon at the bottom right of the window. Click it to open
    the Firebug explorer.


    You''ll notice Firebug includes six tabs: Console, HTML, CSS, Script, DOM, and
    .NET. Each tab contains features to simplify your life as a web developer.


    The Console tab provides an output interface for viewing warning and error messages,
    logs, debugging information, general info, and XmlRequest and response objects.
    Use this console to log console messages of your workings of application. The
    console object contains several methods, which you can check out at http://firebug.com/wiki/index.php/Console_API.
    Table I-5 lists a subset of the methods contained by the console object provided
    by the Firebug Wiki.


    # TABLE 1-5: Some Console Object Methods


    | METHOD | DESCRIPTION |

    | --- | --- |

    | console.log(object, { ... }) | Writes a message to the console. |

    | console.debug(object, { ... }) | Writes a message to the console, including
    a hyperlink to the line where it was called. |

    | console.info(object, { ... }) | Writes a message to the console with the visual
    "info" icon and color coding and a hyperlink to the line where it was called.
    |

    | console.warn(object, { ... }) | Writes a message to the console with the visual
    "warning" icon and color coding and a hyperlink to the line where it was called.
    |

    | console.error(object, { ... }) | Writes a message to the console with the visual
    "error" icon and color coding and a hyperlink to the line where it was called.
    |

    | console.assert(expression, { ... }) | Tests that an expression is true. If not,
    it will write a message to the console and throw an exception. |

    | console.clear() | Clears the console. |


    The profiler is used for performance analysis of your application. Profiling is
    as simple as clicking a button. Load your page, click the Profile button under
    the Console tab, use your application for a while, and click the button to generate
    a report.


    The HTML tab enables you to parse the DOM and edit HTML code "on the fly." The
    tags are displayed in a tree widget, which expands to show the children of each
    node. The CSS tab allows editing of styles and layout, while neatly displaying
    the values of each cascading style'
