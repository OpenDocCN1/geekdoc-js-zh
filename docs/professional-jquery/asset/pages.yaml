  md: "# DOING DOM TRAVERSAL\n\nBy now you've convinced that the jQuery selectors\
    \ offer a diverse set of options for creating a wrapper object with elements selected\
    \ from the DOM. The next set of tools you'll need in your arsenal will allow you\
    \ to manage your wrapped set. Handling tasks such as getting element references,\
    \ getting another wrapper object with a subset of the original, or just traversing\
    \ the DOM are all handled with jQuery.\n\nUsing the .find() method you can retrieve\
    \ descendants from an already wrapped set of elements in a similar manner to selecting\
    \ the jQuery function. The .find() method also accepts a selector string. The\
    \ effect of using .find() is updating the current wrapper set you're operating\
    \ on. In contrast to the jQuery function, the selector expression is required.\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"http://code.jquery.com/jquery-1.7.1.js\"\
    ></script>\nfunctionfunction()functionnnvarvarvar\n  console.log(\"selected list\
    \ count: count + wrapper. +);\n\nnvar newWrapper = wrapper. =(\"#techBooks\");\n\
    \n  console.log(\"selected list count:\" + newWrapper.length);\n});\n</head>\n\
