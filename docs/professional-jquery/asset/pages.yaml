  md: "# CHAPTER 4 DOM SELECTION AND MANIPULATION\n\nAs you can see you can select\
    \ elements with exact matches on the attribute values, matches on the beginning\
    \ and end of the attribute value, matching by a string an attribute value does\
    \ not contain, and a string appearing anywhere in the attribute value. Is there\
    \ more? Yep. There's also the attribute selector, where each word is space delimited.\
    \ This small snippet shows the syntax for using an attribute selector.\n\n```\n\
    $*[attributeName='value']\n```\n\nThis is useful for extracting data from an input\
