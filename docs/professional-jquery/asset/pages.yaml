    # WORKING WITH HTML FORM ELEMENTS


    As you''ve seen, missing HTML5 functionality can be reconstructed using jQuery
    techniques. This section explores some of the additions to form elements.


    It''s important to know when not to use jQuery as when to use it. HTML5 brings
    the table new elements and functionality. Table 6-1 shows a selection of the new
    input types and controls.


    **TABLE 6-1:** New HTML5 Form Controls


    | CONTROL TYPE | INPUT TYPE | DESCRIPTION |

    | --- | --- | --- |

    | URL | url | A control for editing a URL. |

    | E-mail | e-mail | A control for entering or editing an e-mail address. |

    | Telephone | tel | A one-line-plain-text edit control for entering a telephone
    number. |

    | Search | search | A one-line-plain-text edit control for entering one or more
    search terms. |

    | Slider | range | An imprecise control for setting the element''s value to a
    string representing a number. |

    | Number | number | A precise control for setting the element''s value to a string
    representing a number. |

    | Date | date | A control for setting the element''s value to a string representing
    a date. |

    | Date and Time | datetime | A control for setting the value to a string representing
    a global date and time (with timezone information). |

    | Color | color | A color-well control for setting the element''s value to a string
    representing a simple color |


    From http://www.w3.org/TR/html-markup


