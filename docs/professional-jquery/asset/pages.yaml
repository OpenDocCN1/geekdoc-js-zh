  md: 'references. Although this is a common solution, jQuery Templates improve on
    the pattern in some important ways.


    # Separation of Content and Behavior


    jQuery Templates allow for a further separation of content and behavior.


    One of the central tenets of modern web development is the separation of code
    that describes the structure and content of the page (the HTML) from the code
    that defines the style (CSS) and code that manages the behavior (JavaScript).
    Historically, this separation has most often been in the context of moving from
    style-based HTML elements like font and patterns like table-based layouts to CSS
    layouts. Secondly, it''s also seen a movement toward using inline CSS and JavaScript
    in HTML files. Though these are positive steps, the trend toward more dynamic
    sites and applications has introduced a new battlefront. As more and more developers
    rely on JavaScript to drive sites, more and more style, content, and structure
    are starting to work their way into JavaScript files.


    This is acceptable when you''re working on a small codebase, but once your application
    gets into the thousands or tens of thousands of lines, and more developers are
    expected to be able to manage them, this can quickly cause issues as the question
    "Where is this markup coming from?" more frequent.


    As you''ll see, the jQuery Template plugin allows for a complete break between
    structure and program logic. This is a key to writing maintainable code.


    # Code Reuse


    With the capacity to define templates once and to apply them multiple times, including
    mixing and matching with other templates, you have many more opportunities to
    create reusable markup patterns with a template engine.


    # Aesthetics and Clarity


    A good template is simply easier to read. Instead of focusing on balancing quotation
    marks, plus signs, and data references, the focus with jQuery Templates is once
    again on creating clean, consistent markup.


    # The Past, Present, and Future of jQuery Templates


    Before you get into the nuts and bolts, a little background is in order.


    jQuery Templates started out in March 2010, when John Resig posted a prototype.
    Starting in May 2010, Boris Moore started working on a fork of his plugin. This
    was eventually merged into the main branch and branded a jQuery Official Plugin.
    Work continued on it, eventually reaching beta stage.


    As of April 2011, activity on the jQuery Template plugin stopped, leaving it permanently
    in that beta state. In the blog post announcing the change (http://blog.jquery.com/2011/04/16/'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'official-plugins-a-change-in-the-roadmap/), it was noted that development of
    a new

    Template plugin was being initiated under the aegis of the jQuery UI project.


    # The Future


    The driving force behind the original jQuery Template plugin, Boris Moore, has
    continued working

    on the problem of templates using the jQuery UI team. In October 2011, Moore wrote
    a blog

    post (http://www.borismore.com/2011/10/jquery-templates-and-jsviews-roadmap.html),

    updating the community with the new plugin''s progress. In it, he stated the solution
    will eventually be

    in two parts:


    +   - JsRender templates are described as "Next-generation jQuery Templates


    +   - JViews are described as "Interactive data-driven views, built on top of
    JsRender templates."


    This new solution promises speed improvements, greater flexibility, and a better
    separation of

    presentation and behavior.


    # The Present


    Although we have confidence in this newer effort, having a sane templating system
    is vital right now

    to modern web development. It is therefore sensible to leverage the existing plugin
    until the newer

    effort is enough to supplement it.


    # Creating Templates


    You can use two basic methods for creating jQuery Templates. Which one you depends
    on

    the nature of your project, the makeup of your team, and the performance demands
    on your site

    or application.


    # Creating Inline Templates


    The cleanest way to create templates is through the use of a specially crafted
    tag:


    ```

    <script id="comics" type="text/x-tmpl">

    <div class="comic">

    <img src="${imgSrc}\ />

    <div class="title">

    <h3>${title}</h3>

    </div>

    <div class="year">

    ${year}

    </div>

    <div class="number">

    ${number}

    </div>

    </div>

    </div>

    </script>

    ```


    ![](img/16459f9d4793f783ab42cec76c544db0_245_0.png)


    > Code snippet is from script-tag-template.txt'
