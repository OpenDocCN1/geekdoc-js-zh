    \ data can be attached to HTML element storage/retrieval. The utility method .data()\
    \ is used for this purpose. .data() will be covered in Chapter 6.\n\n# Other Utility\
    \ Methods\n\nThese last few methods do not fit into any of the categories: .contains(),\
    \ .isWindow(), .isXMLDoc(), .now(), .support(), and .globalEval(). This section\
    \ tackles each one.\n\n# Checking for Subnodes\n\nThe method .contains() checks\
    \ to see if a DOM node is a child, or of another node. It takes two arguments\
    \ — the possible container and the contained node:\n\n```\n$contains(\"head\"\
    ) [0], \\$(\"title\") [0];\n```\n\nThe jQuery wrapper is array-like, so to get\
    \ the reference to the actual element, you'll need to use the square brackets\
    \ to retrieve the element references. The title tag is always a child of the head\
    \ tag, and hence returns true.\n\n# Checking for Windows\n\nConsider the situation\
    \ you have an iframe. In one of operations you may need to distinguish between\
    \ that iframe and the browser window. To do this use the .isWindow() method:\n\
    \n![](img/16459f9d4793f783ab42cec76c544db0_70_0.png)\n\n```\n<!DOCTYPE html>\n\
    <head>\n<script type=\"text/javascript\" src=\"jquery.js\"></script>\n<script\
    \ type=\"text/javascript\">\n  $.ready(function() {\n    var inlineFrame = \\\
    $(\"#frame\")[0];\n    $.isWindow(inlineFrame); // returns false\n    $.isWindow(window);\
    \ // returns true\n  });\n</script>\n</head>\n<body>\n<iframe id=\"frame\" src=\"\
    externalPage.html\"></iframe>\n</body>\n</html>\n```\n\nCode snippet is from isWindow.txt"
