  md: "# The jQuery Framework Structure | 59\n\njQuery is also a self-executing anonymous\
    \ function, which accepts two arguments — the window object and undefined:\n\n\
    ```\n(function( window, undefined)\n  // definition of core\n)(window);\n```\n\
    \nThe window object is passed in as a small performance boost. For any call to\
    \ the global window object inside the jQuery function definition, instead of looking\
    \ up the definition of the window in the global context, it looks inside the local\
    \ context avoiding one step in the loop. It's small, but does represent an improvement.\n\
    \nAt first, we might see a little baffle to pass in undefined, but there is a\
    \ good reason. The undefined built-in type is so agile. conceivably, someone on\
    \ your development team could do something like undefined = true; then your comparisons\
    \ won't work as expected. (Paul Irish has a special for team members like this;\
    \ see his video on \"10 Things I Learned from the jQuery Source\" at http://paulish.com/2010/10-things-i-learned-from-the-jquery-source/).\n\
    \nLooking further down the code, you can see how the utility methods are added\
    \ to the jQuery function:\n\n```\njQuery.extend({\n  noConflict: function() {\n\
    \    isFunction: function(obj) {\n      isArray: Array.isArray || function(obj)\
    \ {\n    }\n  });\n```\n\nThe jQuery function is .extend(-ed) with an object literal,\
    \ with key-value pairs of method names to method definitions, as you can see from\
    \ the previous snippet from jQuery source. Looking through the method definitions\
    \ you can see exactly how the comparisons are done, and what each method expects.\n\
    \nOur favorite lesson from looking at the source is how $.ready() works. There\
    \ isn't an .ready() event in the DOM. Again, looking at the source code is instructive:\n\
    \n```\n// The DOM ready check for Internet Explorer\nfunction scrollCheck() {\n\
    \  if ( jQuery.ready ) {\n    return;\n  }\n}\ntry {\n  // If IE is used, use\
    \ the trick by Diego Perini\n  // http://javascript.nwbox.com/IEContentLoaded/\n\
    \  document.documentElement.doScroll(\"*left\")\n} catch (e) {\n  setTimeout(doScrollCheck,\
    \ 1);\n}\n```"
