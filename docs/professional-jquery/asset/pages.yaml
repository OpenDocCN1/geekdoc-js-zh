  md: "# Keep Private Functions Private\n\nThe flipside to exposing pieces of your\
    \ plugin to outside enhancement is that it can cause unpredictable results if\
    \ you're not careful with identifying which pieces should be accessible and which\
    \ shouldn't. It's important to tone the function of your plugin and won't offer\
    \ any real benefit by being exposed to plugin users, it's probably best to keep\
    \ that function private. To do that, define the function inside the body of your\
    \ function, but outside of the return object.\n\n```\nfunction($ {\n  $.fn.dataCruncher\
    \ = function(options) {\n    //inaccessible outside the plugin\n    function privateSort(\
    \ data ) {\n      //private method\n    }\n    return this.each(function() {\n\
    \      var data = privateSort(data);\n    });\n  }\n}\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_276_0.png)\n\
    \n> Code snippet from private-functions-private.txt\n\n# Support the Metadata\
    \ Plugin\n\nOf of the original recommendations, this is one that isn't as relevant\
    \ as it was. The Metadata plugin itself has been deprecated in favor of similar\
    \ provided by $.data(). Still, it's worth looking in case you find yourself working\
    \ with an older version of jQuery refactoring code or working in an environment\
    \ where the core library has been updated in some time.\n\nThe Metadata plugin\
    \ extracts data from a DOM element and returns it as an object. It provides a\
    \ convenient, markup-based method for customizing plugins. One example of where\
    \ this can be extremely handy if you need to extract data for use in a plugin\
    \ of a CMS. Allowing CMS authors to update slideshow by clicking a couple of checkboxes\
    \ and exposing their choices with metadata.\n\nSupport for the Metadata plugin\
    \ is easy to add, so it can be a handy addition to your plugin configuration options.\n\
    \nThe following code sample illustrates support for Metadata. It tests for the\
    \ presence of $.metadata, and if the plugin is there, it merges data found with\
    \ the settings and options object that drives the style into CSS.\n\n```\n<html>\n\
    <head>\n  <script src=\"http://code.jquery.com/jquery-1.7.1.js\"></script>\n \
    \ <script src=\"jquery.metadata.js\"></script>\n  <script>\nfunction($ {\n   \
    \ // plugin definition\n    var settings = {\n      \"background\" : \"#fe57a1\"\
    ,\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_276_1.png)"
