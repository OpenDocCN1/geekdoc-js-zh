    \ instead of $ to refer to the jQuery Core. The following code alone demonstrates\
    \ an example:\n\n```\n<html>\n<head>\n  <script src=\"conflictingFramework.js\"\
    ></script>\n  <script src=\"jquery.js\"></script>\n  <script>\n    jQuery.noConflict();\n\
    \n    jQuery('<I am a paragraph</p>').appendTo(body);\n\n    // $ references conflictingframework.js,\
    \ not jQuery\n    $.blahMethodFromOtherLibrary();\n  </script>\n</head>\n<body>\n\
    \n</body>\n</html>\n```\n\nOpening up the hood, you can see the actual definition\
    \ of $.noConflict():\n\n```\nnoConflict: function( deep ) {\n  window.$ = _; \n\
    \n  if ( deep ) {\n    window.jQuery = _jQuery;\n  }\n\n  return jQuery;\n}\n\
    ```\n\nAs you can see, it's very short. jQuery maintains an internal reference\
    \ to the value of $ — after $.noConflict is called, the value of $ is restored\
    \ to its previous value, which is the value of the conflicting library.\n\n# SUMMARY\n\
    \nIn review, you're now familiar with the structure and syntax of jQuery-based\
    \ JavaScript programs, taking view of how jQuery makes use the pattern of unobtrusive\
    \ JavaScript behavior from markup. Without fear or reserve, you've also taken\
    \ a very basic tour of the jQuery core. Choosing not to treat jQuery as a black\
    \ box gives you an advantage over many other web developers. Studying the core\
    \ also teaches several JavaScript techniques that you can apply in your own projects.\n\
    \nNow that you've had some exposure to the basics, you can delve into one of the\
    \ most powerful features of jQuery — its very complete selector mechanism — in\
    \ the following chapter."
