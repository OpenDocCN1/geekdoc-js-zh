  md: "Although this is a best practice and is preferred, sometimes it's not possible\
    \ to return the jQuery object. That exception is valuable to note. Whereas you\
    \ generally want to allow valid reasons except to break the chain.\n\nTypes of\
    \ methods that will break the chain are those that return a specific value. jQuery\
    \ itself offers several examples. These can be a metric, $.height (at least when\
    \ it's called as a getter), Boolean like $.inArray, or something like $.type (which\
    \ returns a String indicating the internal [[Class]] of a JavaScript object).\
    \ The code that follows illustrates another exception. This plugin returns a Boolean\
    \ whether or not an element is larger than a set of provided dimensions:\n\n```\n\
    function() {\n  $.iswider = function ( width ) {\n    return this.width() > width;\n\
    \  }\n}}(jQuery);\n```\n\nCode snippet is from iswider.txt\n\n# Iterating Over\
    \ Objects\n\nOftentimes with plugin development, you're looping over all the objects\
    \ in a collection and operating on each member. You will often need to do this\
    \ $.each. The following code illustrates this common pattern, returning the result\
    \ of this.each:\n\n```\nfunction() {\n  $.randomText = function() {\n    return\
    \ this.each(function() {\n      $(this).text(Math.random() * 1000).show();\n \
    \   });\n}}(jQuery);\n```\n\nCode snippet is from randomTxt.txt\n\nAlthough this\
    \ is common, it is important to note that in some cases, you don't need to use\
    \ $.each. Look at the following example. The use of $.each is redundant, because\
    \ $.css will operate on every item in the collection.\n\n```\nfunction() {\n \
    \ $.pinkify = function() {\n    return this.each(function() {\n      $(this).css({\n\
    \        \"background\" : \"#fe57al\",\n        \"color\" : \"#fff\",\n      \
    \  \"text-shadow\" : \"none\"\n      });\n    });\n  }\n}}(jQuery);\n```\n\nCode\
    \ snippet is from extra-each.txt"
