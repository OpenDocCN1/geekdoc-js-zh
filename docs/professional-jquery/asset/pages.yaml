    never use. On the other hand, the creators of jQuery thoroughly kept these kinds
    of “add on” modules, and kept the jQuery core small and compact. It is, however,
    extensible through the plugin system, which is covered in Chapter 12.


    The jQuery core function, sometimes also referred to as a factory object, is referenced
    as either jQuery() or, more commonly, by its alias $(). If you recall the JavaScript
