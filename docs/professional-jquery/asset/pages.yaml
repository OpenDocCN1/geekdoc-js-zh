- img_proc: true
  md: "Although the basics of the API are straightforward, the power and convenience\
    \ cannot be understated. Having a coherent, standard method of storing and retrieving\
    \ data clears years of awkward coding and disparate patterns. The following section\
    \ lays out this benefit with a more realistic example.\n\nBefore we look at that\
    \ example, it should be noted that $.data() allows for storing-level data, it\
    \ does not help you all with storing persistent data. To store persistent data,\
    \ you'll have to deal with cookies or the new TML5 storage API, which are the\
    \ standards for persistent data in the browser.\n\n# Fully Leveraging the Data\
    \ API\n\nListing 10-15 illustrates an application fragment. This piece initializes\
    \ a small Google Maps application. In it, you create a Map and use the W3C's Geolocation\
    \ API to place a marker on the map based on the user's latitude and longitude.\n\
    \nThroughout this, the .data() method is used to capture variables, objects, and\
    \ even instantiated Google Maps objects.\n\nInitially, you store a reference to\
    \ the map itself. Every Google Maps API call works off of an instantiated object;\
    \ for example, a map, geocoder, or marker. Storing the reference to your map simplifies\
    \ later map manipulations. You also store the mapOptions object. This is a simple\
    \ scheme to store the initial state of the map if you need to reset it for any\
    \ reason.\n\nLater on, in both the success and failure functions, you store a\
    \ geocoder object and an initialLocation. The geocoder can be used for any address\
    \ lookups without the cost of instantiation, and the initialLocation can be used\
    \ to reset or recent the map based on the updated latitude and longitude provided\
    \ by the geolocation lookup.\n\n# LISTING 10-15: Using $.data() in an application\
    \ context\n\n```\nvar loadMap = {\n  init: function() {\n    var GM = google.maps,\n\
    \    defaultPosition = new GM.LatLng(42, -71),\n    mapOptions = {\n      zoom:\
    \ 12,\n      center: defaultPosition,\n      mapTypeId: GM.MapTypeId.ROADMAP\n\
    \    },\n    map = new GM.Map(document.getElementById('map'), mapOptions);\n\n\
    $(\"#map\").data(\"map\", map, \"mapOptions\" : mapOptions); function () {\n \
    \ var success = function (data) {\n    var position = new GM.LatLng(\n      data.coords.latitude,\n\
    \      data.coords.longitude),\n    niceAddress = 'Your location',\n    geocoder\
    \ = new GM.Geocoder();\n  }$(\"#map\").data(\"geocoder\", geocoder); };\n```\n\
    \n![](img/16459f9d4793f783ab42cec76c544db0_238_0.png)\n\ncontinues"
