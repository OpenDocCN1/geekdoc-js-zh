  md: 'In addition to running these tests by checking some checkboxes, you can also
    run them by appending a query parameter to the URL. To run tests with noglobals,
    for example, you would run this test list:


    ```

    http://example.com/tests/tests.html?noglobals=true

    ```


    This is a handy feature if you''re running multiple tests on a large application.


    # Organizing Tests into Modules


    One key feature of QUnit is the ability to organize tests into modules. Just like
    the code you''re testing, the ability to organize code into separate modules for
    greater flexibility when running tests.


    Grouping tests that target a specific method or feature is a prime example of
    module usage. Looking at the test suite for your jQuery core in Figure 14-7, you
    can see that the project is broken into separate modules.


    ![](img/16459f9d4793f783ab42cec76c544db0_313_0.png)'
