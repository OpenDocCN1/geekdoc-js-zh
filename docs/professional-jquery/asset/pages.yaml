  md: "# 210 | CHAPTER 10 WRITING EFFECTIVE JQUERY CODE\n\n# LISTING 10-8 (continued)\n\
    \n```\n//init code\n},\n  settings : function(){\n  //code for control panel settings\n\
    }\nmyApp.settings = {\n  //your settings page has an init as well\n  init : function(){\n\
    \  //init code\n  },\n  update : function(){\n  //code to update site settings\n\
    }\n```\n\nCode snippet from a-simple-application-framework.txt\n\nOne thing to\
    \ note is, although working in multiple files is a best practice, actually serving\
    \ multiple files to users is not suggested. If you're working in multiple files\
    \ in your project, it's worth looking at ways to atomically concatenate (minify)\
    \ your files together into a single file. A good starting point for this task\
    \ is the HTML5 Boilerplate project and its associated build script. You can find\
    \ it at http://html5boilerplate.com/. As an alternative to a static build script,\
    \ a loader like LabsJs http://labs.com/ offers a JavaScript-based method for loading\
    \ files as an as-needed basis\n\n# The Module Pattern\n\nA variation on the singleton,\
    \ the module pattern was created by Douglas Crockford, Chief JavaScript Architect\
    \ at Yahoo! and was popularized in a post by Eric Miraglia on the Yahoo User Interface\
    \ Blog in June 2007 (http://www.yuiblog.com/blog/2007/06/12/module-pattern/) and\
    \ is covered in depth in Crockford's book, JavaScript The Good Parts (O'Reilly\
    \ Media, 2008). It enhances the encapsulation provided by the singleton\n\nThe\
    \ module pattern consists of three main components: a namespace to clear the one\
    \ leveraged in the previous example, a function that immediately executes, and\
    \ the function's return object, which contains available methods and properties.\
    \ You can see a simplified example in Listing 10-9.\n\n# LISTING 10-9: The JavaScript\
    \ module pattern\n\n```\n//Our apps namespace. We use the jQuery object to shorten\
    \ lookups\nvar myApp = function () {\n  // private variables and methods, only\
    \ available within this myApp\n  var message = \"not directly accessible from\
    \ outside the module\";\n  function multiplier (x, y) {\n    return x * y\n  }\n\
    };\n```\n\n![](img/16459f9d4793f783ab42cec76c544db0_231_0.png)"
