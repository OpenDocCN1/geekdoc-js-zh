  md: '# DEVELOPMENT TOOLS


    You have several tools at your disposal for developing JavaScript and jQuery,
    other than the traditional editor/browser setup. If your style of development
    is more command-line-oriented, you have jconsole and Rhino. Rhino is a web application
    that enables you interactively enter JavaScript code. It comes with a few additional
    functions such as print(), load(), and clear(). Multiple entry are allowed by
    pressing Ctrl+Enter after each line. Press Enter executes the current code in
    the text area. jconsole also maintains a history of entered commands, which is
    accessed by pressing the up or down arrows to view the previous and next commands.
    Figure 1-1 shows jconsole in action.


    ![](img/16459f9d4793f783ab42cec76c544db0_30_0.png)


    To load jQuery into jconsole using the load() function with a CDN URL. For example:


    ```

    load(''https://ajax.googleapis.com/ajax/libs/jquery/1.5.1/jquery.min.js'');

    $(document).click(function() { alert(''It worked!''); });

    ```


    jconsole also has an autocomplete feature, and to dynamically change the context
    by using the scope() function. For quickly testing small bits of code, jconsole
    really is priceless.


    You probably up this book for using jQuery in a browser environment, but it''s
    also possible to use jQuery on the server. Mozilla Rhino is a JavaScript interpreter
    implemented in Java. It features a JavaScript shell, debugger, and compiler. Using
    the framework Enviys, also written by the jQuery creator John Resig, it is possible
    to use jQuery in a server environment. Enviys is a portable JavaScript implementation
    of a “headless browser,” or browser that lacks a user interface that provides
    a scripting environment. It''s possible to get the same effect with other environments,
    such as Google V8, but I''ll stick to Rhino for this example.


    Table 1-4 lists the dependencies for getting up and running with jquery and Rhino.'
