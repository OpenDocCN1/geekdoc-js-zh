    要让程序运行起来，你必须在命令行中输入 `java HelloWorld`。随后屏幕上会弹出“Hello, World!”这段文字。任何计算机上的命令行都是强大且具有控制权的入口。请小心通过命令行执行的命令——输入错误的指令可能会导致数据全部丢失。如果你之前没有编程经验，可能不知道命令行在哪里。例如，苹果的
    Mac OS 系统将命令行存放在一个名为“终端”的程序中，该程序位于“应用程序”文件夹内的“实用工具”文件夹里。计算机科学教师大卫·鲍姆戈尔德（David
    Baumgold）表示，Windows 有自己的命令行，但使用起来比较困难。他推荐安装一个名为 Babun 的免费且易用的命令行程序。


    ![Image](img/imgg_046_.jpg)


    ## 动手尝试与实验


    完成这样一个简单的练习后，新手程序员可能会想一些自己感兴趣且容易实现的项目。在学习过程中，追求自己选择的目标会更有动力。你或许想让一匹马的图像从屏幕一端移动到另一端；或者创建一个随机侮辱生成器，它能吐出类似“你这臭烘烘的、穿着呕吐袜的蛆虫馅饼！”这样的短语；又或者想尝试制作一个简单的二维游戏。学习的关键在于尝试一些项目，并观察它们如何运作。


    ![Image](img/imgg_047_.jpg)


    程序员是将大问题分解为简单步骤的王者。编程让世界变得更简单，因为它实现了自动化——但需要亲手编写代码才能获得让他人生活更轻松的成果。和任何技能一样，一个人编程练习得越多，就越得心应手。看到编程成果实际运行可能需要一些时间。程序往往在第一次运行时无法正常工作，因此程序员需要耐心地回去重新尝试。他们需要仔细检查代码行，确保一切正确。这需要大量精确的细节检查——这就是为什么程序员遵循古老的木匠谚语：“量两次，切一次。”


    关于编程的常见抱怨是它可能令人沮丧、乏味且无聊。有些编程工作涉及大量复制粘贴现有代码来完成工作。这虽然能让工作更轻松，但有时会削弱过程中的创造力。为了让编程保持趣味性，程序员会接手自己感兴趣的项目和挑战。编程提供了创造原创作品的可能性。为了激发学习
    Java 或其他程序的灵感，选择一个有趣且个人感兴趣的项目会有所帮助。


    ![Image](img/imgg_048_.jpg)


    ## 来自《我的世界》的激励


    进入编程世界的一个有趣方式是通过电脑游戏，而《我的世界》不仅是全球最受欢迎的游戏之一，它还提供了理解编程的工具。凭借超过 1.22 亿份的销量和每月 5500
    万用户，《我的世界》已成为一种全球现象。


    瑞典视频游戏程序员马库斯·“Notch”·佩尔松（Markus “Notch” Persson）最初将《我的世界》作为一个业余项目开始开发。尽管他从未完成高中学业，但佩尔松热爱玩乐高积木，并在七岁时父亲带回家一台
    Commodore 电脑后开始自学编程。八岁时，他就写出了第一个程序。2009 年，他对乐高、游戏和编程的热情汇聚在一起，制作了《我的世界》的第一个版本。同年，他与创意合伙人雅各布·波尔塞（Jakob
    Porsér）共同创办了 Mojang 公司（瑞典语意为“小玩意儿”），以进一步开发和销售《我的世界》及其他游戏。


    ![Image](img/imgg_049_.jpg)


    《我的世界》几乎一炮而红，第一年就售出了约两万份下载量——而第二年常常每天就能达到这个数字。2012 年 9 月，佩尔松以 25 亿美元的价格将 Mojang
    卖给了微软。


    《我的世界》被称为沙盒游戏。它提供了一个无限的环境，玩家可以随意漫游并改变虚拟世界，用方块搭建建筑。游戏中的角色在一个充满泥土、树木、水、云、熔岩、山脉等元素的世界中破坏和替换方块。《我的世界》玩家可以上线，在多人模式中与其他玩家互动。随着游戏的发展，羊、猪、牛、僵尸、爬行者、骷髅、船、铁轨和雪等元素被加入其中。


    为了制作方块、工具和材料，《我的世界》提供了庞大的物品库存和合成网格。《我的世界》开发者创造了红石，它允许用户制作电路。在这个虚拟宇宙中，红石基本上是一种传输“电”的手段，可以被塑形和设置，用来制作各种发明，从灯和时钟到计算机和工厂。游戏不断添加动态特性，例如可以在活塞上升降的平台。


    ## 加入模组小队


    编程通过一个名为“模组”（mods，即“修改”的缩写）的功能在这里发挥作用。由于《我的世界》是用 Java 编写的，Java 编程解锁了自定义模组制作的世界。《我的世界》让玩家能够改变角色、物体和景观的属性。通过
    Java，皮肤——即决定角色在游戏中外观的图像——可以被更改。模组可以为游戏添加新角色，改变开放世界的视觉和感觉，或者让建造新结构变得更容易。


    CodaKid 在线儿童编程学院的创始人大卫·道奇（David Dodge）表示，通过拖放式可视化积木工具，学习《我的世界》编程的基础知识很容易。这些工具演示了事件驱动编程，即编写代码以响应用户或系统生成的操作。2016
    年，微软和 Code.org 为《我的世界》推出了一个拖放式平台。这些代码块可能包含 if-then 语句（条件语句）、循环、顺序、数组、变量或其他指令。拖放技术是进入编程世界的第一步。虽然它不涉及代码的语法，但它直观地展示了编程指令如何像拼图一样组合在一起，使功能得以实现。


    掌握了基本原理后，新手可以更上一层楼，使用实际的 Java 语言。在 Codakid.com 上，大卫·道奇表示，任何人都可以用 Java 创建一把能发射闪电的雷霆锤，制作一个自定义的熔岩炸弹，或者设计其他自己发明的物品。程序员将自己的创意愿景变为现实。一旦代码在游戏中执行，回报是即时的。用户可以在自己最喜欢的游戏中看到自己编写的代码实际运行，从而获得极大的乐趣。


    要创建《我的世界》模组，集成开发环境（IDE）可以提供帮助。这是一种提供图形用户界面（GUI）的软件应用程序，可以简化工作并帮助调试软件。一个常见且非常适合
    Java 模组的 IDE 叫做 Eclipse。另一个用于模组制作的工具是应用程序编程接口（API）。流行的模组 API，如 Bukkit 或 Hmod，提供了与《我的世界》轻松通信的接口。像
    Notepad++ 这样的源代码编辑器可以简化编辑源代码的过程。


    ### Java 术语：学习编程的行话


    当一个人学习编程的诀窍时，会用到一些常用短语来描述不同的元素。以下是一些术语，应该能帮助初学者更流利地掌握编程语言。


    Array（数组）：数组是数据或变量的集合、组或列表。例如，它可以是一个名字列表。数组可以被描述为一个包含多条数据的变量。一旦数据存储在数组中，就可以通过引用变量名和键（或隔间名）来检索。搜索引擎可能会使用数组来存储用户搜索时找到的网站。


    Class（类）：类是作为对象蓝图的代码，描述其内容。类描述数据字段并定义称为方法的操作。

