    然而，Java 的爱好者认为它非常对初学者友好，因为它的语法（或结构）直观易懂，易于编写、阅读和理解。有些语言（如 C++）比 Java 更复杂，尽管 Java
    使用的语法与 C++ 类似。如果学习 Java 的人有 C++ 的经验，那会很有帮助。


    Java 拥有工具集和编辑器，能让用户立即发现是否犯了错误。而且，Java 拥有庞大的用户社区，可以在线咨询任何问题或难题。


    ![图片](img/imgg_042_.jpg)


    ## 计算基础


    对于知识很少或没有知识的人来说，掌握 Java 的旅程始于对计算机和编程如何运作的基本理解。在尝试编写一行代码之前，必须掌握一些基本要点。


    计算机编程需要对解决问题有兴趣。它涉及创造力、逻辑和耐心。耐心尤其关键，因为完全理解代码的结构以及代码如何告诉计算机需要做什么可能需要时间。有时，工作可能看起来令人不知所措，因此暂停一下、深呼吸，并在学习过程中寻求帮助来理解每一步会很有帮助。没有代码和计算机，人类所知的整个现代世界将会崩溃。学习它可能很困难，但它极其重要！


    计算机在处理信息时有四个主要功能：从用户处获取信息；处理信息；存储信息；以及输出信息。


    ## 二进制大脑


    在某种程度上，计算机中的一切都在二进制系统上运行。在日常生活中，大多数人使用十进制系统。该系统基于数字 1 到 9 和 0。而二进制系统仅使用 0 和 1
    来表示数字、字母和其他数据。


    今天的计算机使用晶体管运行。计算机包含数百万或数十亿个这样的晶体管。它们是触发电子信号的小型开关。晶体管是计算机芯片的构建块，而芯片构成了处理单元和内存单元。作为一组开关，晶体管可以处于开或关状态。计算机通过晶体管的开/关组合来运行。二进制代码是一种语言，它告诉计算机哪些开关要打开（用
    1 表示），哪些开关要关闭（用 0 表示）。


    用数十亿个 1 和 0 来编写代码几乎是不可能的，因此计算机科学家想出了如何编写更简单的编程语言。当用 Java 这样的语言编写程序并准备运行时，它会通过编译器将指令转换为计算机可以读取和执行的机器代码。机器代码是由
    1 和 0 组成的基本语言，告诉计算机该做什么。


    ![图片](img/imgg_043_.jpg)


    ## 组合对象


    由于 Java 处理大型程序，它被设计为一种面向对象的语言。基本上，Java 中的对象是预先开发好的代码片段。使用这种代码的程序员不一定需要看到构成实际“对象”的代码。他们知道如何将这些对象组合起来构建自己的程序。


    一个对象可以有多个变量（称为属性或特性）来存储不同类型的数据，并且可以有自己的特定函数（称为方法）来操作对象的变量。这些术语一开始可能难以理解，但一个人编程越多，它们就会变得越清晰。


    ## 迈出第一步


    在用户能够编写并运行一个简单的 Java 程序之前，他/她需要在自己的计算机系统上安装平台。可以在 Oracle.com 上免费下载适用于 Linux、Windows、Mac
    和 Solaris 操作系统的 Java 软件开发工具包。一旦 Java 平台安装并配置好，用户就可以尝试编写并运行一个非常简单的程序。


    许多编程课程从教授“Hello, World!”程序开始。这是一个简单地将“Hello, World!”字样打印到屏幕上的程序。通常，程序会在文本编辑器中编写，文本编辑器是操作系统和软件开发包提供的工具。文本编辑器用于输入编程语言的源语句。该程序应保存为
    `HelloWorld.java`。然后，用户通过该名称访问代码并在计算机上运行。


    ![图片](img/imgg_044_.jpg)


    “Hello, World!”程序的简单代码如下所示：


    ```

    public class Main {


    public static void main(String[] args) { System.out.println(“Hello, World!”);
    } }

    ```


    代码的第一行声明它是 `public`，意味着它具有公共访问权限。任何其他类都可以访问它。


    应用程序中的第二行称为 `main` 方法。Java 中的每个应用程序都必须包含一个 `main` 方法。Java 编译器从 `main` 方法开始执行代码。这一行是强制性的代码行，作为程序运行的主要入口点。理解代码的每个部分需要更深入的学习。例如，`String[]
    args` 意味着人们可以查看和编辑“参数”。参数是独立的数据项或变量，包含数据或代码。


    代码的最后一行实际上是程序的核心，它告诉计算机该做什么。`println` 告诉计算机将字符串（即提供的文本）“Hello, World!”写入计算机屏幕，然后插入一个换行符。


    这段简单的代码让初学者对 Java 计算机语言的工作原理有了一些了解，但要理解所有细节需要深入的学习。根据 Java 语法，每个语句必须以分号结尾，单行注释必须以两个正斜杠（`//`）开头。方法和类用花括号定义。


    ### >>深入探索：在线教程


    要了解更多关于 Java 编程的知识，新手可以探索互联网上提供的众多资源。以下是一些值得探索的知名网站：


    Code Academy：自 2011 年以来，CodeAcademy.com 为包括 Java 在内的不同编程语言提供免费的交互式编程课程。该网站对某些附加服务收费。


    LearnJavaOnline.org：这个免费的交互式教程面向所有水平的程序员——从绝对初学者到更有经验的人。


    Udemy：Udemy.com 于 2009 年推出，已提供超过六万五千门在线课程。数十万学生参加了其“Java 完全初学者教程”，该教程专为没有编程知识的人设计。


    Youth Digital：Youthdigital.com 提供在线技术课程，教授 8 至 14 岁的孩子如何编码、设计、开发和制作动画。


    ![图片](img/imgg_045_.jpg)


    ## 尝试运行代码


    在文本编辑器中编写并保存代码后，必须对其进行编译，以便计算机能够读取。为此，用户输入命令：`javac HelloWorld.java`。如果一切顺利，编译器会在
    `HelloWorld.class` 文件中生成字节码。Java 编译器的一大优点是它会告诉用户是否存在错误，包括哪一行或哪些行代码有误。


