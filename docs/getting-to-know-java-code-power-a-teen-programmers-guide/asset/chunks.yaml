- fmt: '

    On a daily basis, businesses, governments, and other major organizations must
    deal with enormous amounts of data. They gather it, store it, keep track of it,
    and analyze it to make strategic business decisions. For programmers today, the
    challenge is keeping up with this ongoing tsunami of information. Antonio Regalado,
    senior editor for the *Technology Review,* said that only about .5 percent of
    all data is ever analyzed. Because Java is ready to use on desktops, mobile devices,
    and tablets—and offers vast libraries of code—the language can take on many of
    the tasks related to dealing with big data. By 2018, Hadoop had become a popular
    set of procedures and programs used to form the backbone of big data operations.
    Hadoop itself was developed in Java.


    ## TO SPACE AND BEYOND


    Java technology has taken steps into areas where no one has gone before. The National
    Aeronautics and Space Administration (NASA) uses Java in many projects, including
    its World Wind software development kit that provides a virtual 3D globe. Viewers
    can zoom in and out of various locations on Earth. Modern robotics engineering
    makes use of Java as well. An award-winning self-driving car operates on the code.
    Dan Royer, who constructs and sells robots through his company, Marginally Clever,
    relies on Java. The language is also behind Makelangelo, an art robot that draws
    posters and murals. Combining the worlds of robotics and health care, Ali Lemus
    assembled a low-cost prosthetic hand. Lemus provides instructions on how to build
    the appendage using a 3D printer and Java code.


    ![Image](images/imgg_055_.jpg)


    Thanks to Java technology, Doctor Online provides an interactive patient care
    service. In the world of show business, Industrial Light & Magic (ILM) has turned
    to Java for all sorts of effects. ILM has produced such effects as the squidlike
    face of Davy Jones in the Pirates of the Caribbean movie series and the photorealistic
    metal surfaces of Ironman’s suit in many Marvel films.


    The cloud is another cutting-edge area where Java has made its mark. Cloud computing
    is the practice of using a network of remote servers hosted on the internet to
    store, manage, and process data. Organizations and individuals access these computing
    services remotely. When someone stores data on or runs programs from his or her
    computer’s hard drive, that is called local storage and computing—not cloud computing.
    Cloud computing services have become preferred by some as a more affordable option
    to owning and operating computers and networks. One example is Microsoft’s Office
    Online. A user can tap into internet-only versions of Word, Excel, PowerPoint,
    and OneNote accessed via the internet without installing anything. They are cloud
    computing tools. Google Drive is a popular cloud form of file storage. Since Java
    can run anywhere, it has been well suited to cloud development.


    ## »OTHER TOP PROGRAMMING LANGUAGES


    Java is often used along with other programming languages. Here are a few of the
    other widely used ones any beginner should learn about.


    ### C

    Widely used, C is a general-purpose language that was created in 1972. It is closely
    tied to the UNIX operating system.


    ### C++

    Able to run on a variety of platforms, such as Windows, Mac OS, and the various
    versions of UNIX, C++ has been one of the most popular languages for years. It
    was created in 1979 as a more extensive version of C.


    ### C#

    A hybrid of C and C++, C# was developed by Microsoft to compete with Java.


    ### Objective-C

    This is the primary programming language for writing software for OS X and iOS.


    ### Python

    A top-ranking language, this interactive, object-oriented programming language
    is free to use. It was named after the British comedy troupe Monty Python’s Flying
    Circus. Many components of Google are written in Python, as are the games *Battlefield
    2, Star Trek Bridge Commander,* and Civilization 4.


    ### Ruby on Rails

    Sometimes just called Rails, Ruby on Rails is an open-source web application framework
    that was built with the language Ruby by David Heinemeier Hansson. It incorporates
    Ruby with HTML, CSS, and JavaScript. Ruby is known among programmers for being
    an uncluttered language.


    ### SQL

    Structured Query Language is geared toward storing, manipulating, and querying
    data stored in databases.


    ## EVERYTHING IS CONNECTED


    In the rapidly changing technological world, a relatively new concept is the Internet
    of Things (IoT). This refers to the linking of all kinds of devices to the internet—kitchen
    appliances, driverless cars, heart monitors, and more. These electronic products
    connect via M2M, or machine to machine, communication.


    Smart bike locks open and close via a special phone app— and if someone tries
    to tamper with a user’s bike, his or her phone receives a text message. Devices
    now exist that track the freshness of milk and eggs in the fridge and send messages
    alerting consumers when foods have gone bad. The June oven and complementary June
    app lets users control cooking with their iPhone or iPad and monitor the food
    all via a live video stream. In theory, the technology inside devices also lets
    companies collect more data about their own products and their own internal systems.
    The research firm Gartner reported that an estimated 8.4 billion devices were
    connecting with the internet, sharing and collecting information, in 2017. One
    of the big concerns with the IoT, however, is security. Hackers have demonstrated
    how systems can be broken into to gain control of items like home security systems
    and computer-driven vehicles.


    In an interview on Oracle.com, Vinicius Senger, founder of Globalcode, says that
    Java was born to do this kind of stuff. He says:


    > Java has been all about providing corporate solutions, selling items on the
    Internet, and banking, but Java was initially designed as a programming language
    to connect things such as home appliances. Java is the best platform for the Internet
    of Things because it''s flexible for computers of different sizes.

    >

    > The same architectures, security, and communication protocols that Java applies
    to banks, retail enterprises, and internet businesses can be used on embedded
    devices. Java is the gateway into a brave new future of technology, programming,
    and convenience for everyone.


    ## GLOSSARY


    **ANDROID** A mobile operating system developed by Google that is based on an
    open-source operating system.


    **APPLETS** Small applications that perform specific tasks.


    **APPLICATION PROGRAMMING INTERFACE (API)** A set of routines, protocols, and
    tools for building software.


    **BUG** A coding error or flaw in a computer program.


    **CLIENT SIDE/FRONT END** Refers to actions that take place on a user’s computer.


    **COMPILER** Software that translates statements written in a programming language
    into machine language that a computer can understand.


    **COMPUTER ARCHITECTURE** How a computer system is organized and structured.


    **DATABASE MANAGEMENT** The organization and maintenance of information collected
    in a computer program.


    **DEBUG** To find and fix errors in software or hardware.


    **EMBEDDED** Describing a computer system with a dedicated function within a larger
    mechanical or electrical system.


    **GRAPHICAL USER INTERFACE (GUI)** Often pronounced “gooey,” GUI is basically
    the visual components that let a person use and interact with a computer. They
    are designed with visual elements that make the computer easier to use. Microsoft
    Windows and Apple Mac interfaces all use a “desktop” screen where icons are displayed.


    **INTEGRATED DEVELOPMENT ENVIRONMENT (IDE)** A programming environment that streamlines
    the development and debugging of software and coding.


    **IOS** A mobile operating system created and developed by Apple Inc.


    **MACHINE CODE** An elemental language that a computer’s central processing unit
    understands.


    **MOD** Short for “modification,” an alteration that changes some aspect of a
    video game.


    **PARADIGM** A style or way of programming.

