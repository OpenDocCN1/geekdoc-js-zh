    ![Image](images/imgg_049_.jpg)


    *Minecraft* was practically an instant success, selling about twenty thousand
    downloads in its first year—and often that many every day in its second year.
    In September 2012, Persson sold Mojang to Microsoft for $2.5 billion.


    *Minecraft* is known as a sandbox game. It provides an infinite environment in
    which players can wander and change a virtual world at will, building structures
    with cubes. Characters in the game destroy blocks and replace blocks in a world
    filled with dirt, trees, water, clouds, lava, mountains, and more. Minecrafters can
    go online and interact with others in a multiplayer version. Sheep, pigs, cows,
    zombies, creepers, skeletons, boats, rails, and snow were added as the game developed.


    To make blocks, tools, and materials, *Minecraft* supplies a vast inventory of
    items and a crafting grid. *Minecraft* developers created redstone, which allowed
    users to make circuitry. In this virtual universe, redstone is basically a means
    to carry “electricity,” and it can be shaped and set up to make all sorts of inventions,
    from lamps and clocks to computers and factories. The game continues to add dynamic
    features, such as platforms that raise or lower on pistons.


    JOIN THE MOD SQUAD


    Programming comes into play here with a feature called mods, short for “modifications.”
    Because *Minecraft* was written in Java, Java coding unlocks the world of customized
    mod making. *Minecraft* gives players the ability to change qualities of characters,
    objects, and landscapes. With Java, the skins—or the images that determine what
    a character looks like in the game—can be changed. A mod can add new characters
    to the game, alter the look and feel of the open world, or make it easy to build
    new structures.


    David Dodge, the founder of CodaKid Online Kids Coding Academy, says that fundamentals
    of coding for *Minecraft* are easy to learn with drag-and-drop visual block tools.
    These tools demonstrate event-driven programming, which is written to respond
    to actions generated by the user or the system. In 2016, Microsoft and Code.org
    introduced a drag-and-drop platform for *Minecraft.* These code blocks may contain
    if-then statements (conditionals), loops, sequencing, arrays, variables, or other instructions.
    The drag-and-drop technique is a great first step into coding. Although it does
    not involve the syntax of coding, it visually shows how coding instructions fit
    together like a puzzle to bring a function to life.


    With basic principles mastered, newbies can kick it up a notch and work with the
    actual Java language. On Codakid.com, David Dodge says that anyone can use Java
    to create a Thunder Hammer that shoots lightning, make a custom LavaBomb, or design
    other items of his or her own invention. The programmer brings his or her own
    creative vision to life. Once the code is executed in the game, the reward is
    instant. Users can have great fun seeing their own coded work in action in their favorite
    game.


    To create a *Minecraft* mod, an integrated development environment (IDE) can help.
    This is a software application that provides a graphical user interface (GUI)
    that streamlines the work and helps debug software. One common IDE that happens
    to be great for Java mods is called Eclipse. Another tool for modding is an application
    programming interface (API). Popular modding APIs, such as Bukkit or Hmod, provide
    an interface that easily communicates with *Minecraft.* A source code editor such
    Notepad++ can ease the process of editing source code.


    ###### >>JAVA JIVE: LEARNING THE LINGO OF PROGRAMMING


    As a person learns the ropes of programming, some common phrases are used to describe
    different elements. Here are a few terms that should help the beginner become
    more fluent in the language of coding.


    Array: An array is a collection, group, or list of data or variables. It could
    be a list of names, for example. An array could be described as a variable that
    holds multiple pieces of data. Once the data is stored in an array, it can be
    retrieved by referring to the variable name and the key (or compartment name).
    A search engine may use an array to store websites found when a user does a search.


    Class: A class is the code that is the blueprint for the object and describes
    its contents. The class describes data fields and defines operations called methods.'
