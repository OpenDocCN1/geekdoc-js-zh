    没有什么比从事一份现实世界的工作更能了解某个职业的真实面貌了。那些攻读计算机科学学士学位的学生通常可以通过学校利用实习机会。实习让学生获得实际工作经验，同时还能赚取课程学分。大多数大公司都提供计算机科学相关的实习项目。沃尔玛有一个与在线销售相关的实习项目。雪佛龙公司招聘实习生协助其应用程序、数据库管理和业务分析工具。苹果、通用电气、惠普、威瑞森、IBM、波音、微软、塔吉特、康卡斯特、陶氏化学、戴尔、哈门那、甲骨文、时代华纳以及成千上万的其他公司都有技术实习岗位。


    ![图片](img/imgg_052_.jpg)


    学生可以研究问题，并帮助开发和实施解决方案。与熟练的专业人员一起工作，学生能够掌握技术术语，并了解技术世界中最新的挑战。实习还常常带来宝贵的工作人脉。这既是承担新责任来丰富简历的机会，也是建立专业人脉网络的机会，这些人脉可能成为推荐信来源，甚至带来全职工作。


    ## 英语专业学生掌握 Java


    并非所有 Java 和编程专家都出身于计算机科学背景。乔纳森·范伯格是谷歌的高级软件工程师，他负责编写驱动绘图引擎的代码，这个工具让其他软件工程师能够为他们的安卓、iOS（苹果移动设备使用的操作系统）以及网络应用程序添加绘图功能。他用
    Java 以及 C++、Objective-C 和 JavaScript 编写代码。


    尽管他从小热爱计算机编程，但这并不是他进入大学时的首选方向。虽然他的许多同事拥有计算机科学学位，但范伯格拥有的是英语与美国文学学士学位。不过，如果有人对编程职业感兴趣，他建议学习计算机科学或软件工程，并且在
    21 世纪，掌握 Java、C++或 Python 是件好事。


    范伯格用 Java 创建了 Wordle，这是一个用于从用户提供的文本生成“词云”的小工具。他还为 Processing（processing.org）做出了贡献，这是一个灵活的软件速写本和一种在视觉艺术背景下学习编程的语言。范伯格主要致力于
    Processing 对安卓编程的初始支持以及 Python 模式，该模式允许用户使用 Python 编程语言创建 Processing 速写（不过 Python
    模式本身是用 Java 编写的）。


    他主要通过阅读《Java 编程语言》第一版来学习 Java，然后想出有趣的小项目来挑战自己。他编写了一个纸牌游戏程序，以及许多其他小程序来制作动画。


    对于范伯格的用途而言，Java 提供了编写交互式计算机图形程序的最佳工具包。“所谓的 Java 2D API 仍然是我最喜欢的图形工具包——在探索或设计图形程序时，我最容易‘用它思考’，”他说。


    Java 也有助于避免编码错误。他说，有整整几类错误（编程错误）在 Java 中根本不可能发生，因为该语言使它们无法出现。“这些类型的错误是 C 和 C++程序许多崩溃的原因，”他补充说，Java
    对错误的处理方式正是许多公司（包括谷歌）选择该语言用于某些大型软件项目的原因。


    至于缺点，范伯格指出 Java 以冗长著称。“表达简单的想法需要打很多字，”他说，“这可能会令人沮丧，并导致代码读起来很无聊。这有点像必须通过填写税表来写一部小说。”


    ## 应用程序的天赋


    作为 Scientific Games Interactive 公司的高级软件工程师，威尔·里德通过添加新功能和排查现有问题来维护和扩展移动社交赌场游戏应用。他们有两款热门游戏是《彩虹财富》和《斯巴达克斯：罗马角斗士》。尽管公司的大部分代码库是用
    C#或 Flash/ActionScript 编写的，但他们使用 Java 作为“粘合剂”来与安卓硬件交互。


    里德在 11 岁时对编程产生了兴趣，当时他的数学提高班去当地一所大学的计算机实验室进行实地考察。他发现自己热爱编程中解决问题的方面——无论是玩解谜游戏，还是找到编写解谜游戏的最佳方式。他说，这个过程要求他问自己：“我如何从
    A 点到 B 点？这两点之间有没有更高效的路径？”


    他通过使用 Java 开发安卓应用程序来掌握它，他说，现在有很多机会给那些懂 Java 和其他编程语言的年轻人。


    ![图片](img/imgg_053_.jpg)


    作为一种不断演变且至今仍在开发的计算机语言，Java 始终处于前沿。该语言定期获得更新和新版本。在线 Java 社区人数达数百万，用户已经汇集了大量开源库和开发工具，使编程挑战变得更容易。


    在接受专门从事 Java 招聘的猎头公司 Pearson Frank 的采访时，软件开发公司 Atomist 的开发人员、播客《Greater Than Code》的小组成员杰西卡·克尔表示，世界发展越来越快，对自动化的需求也在增加。由于
    Java 实用且多功能，她认为它将继续在技术的未来中发挥重要作用。


    ## 强化应用程序


    近年来，随着消费者对这些设备比以往更加依赖，移动设备的应用程序开发大幅增长。安卓应用开发的官方语言是 Java。2014 年，移动互联网使用量超过了桌面端。毫无疑问，应用程序业务规模巨大。


    ![图片](img/imgg_054_.jpg)


    应用情报公司 Sensor Tower 计算得出，2017 年全球应用收入增长了 35%，达到近 600 亿美元。游戏应用位居排行榜榜首。例如，万代南梦宫娱乐的《龙珠
    Z：激战》每天带来约 200 万美元的收入。对于那些对游戏开发充满热情的人来说，一些网站已经涌现出来提供帮助，包括 Java-gaming.org 和轻量级
    Java 游戏库（[www.lwjgl.org](http://www.lwjgl.org)）。


    对许多人来说，Facebook、Messenger、Google、Gmail、Instagram、Amazon 和 Apple Music 等应用已经融入了他们的日常生活。音乐应用
    Pandora 和 Spotify、视频流媒体应用 Netflix 和 Hulu 以及其他有用的应用也大受欢迎。许多注重健康的消费者转向应用来追踪体重、卡路里和锻炼目标。2017
    年，TechCrunch 报道称，尽管移动应用使用量持续增长，但随着市场被大量应用淹没，增长可能正在放缓。


    在应用开发方面，程序员必须考虑其应用将针对哪个平台设计。苹果的 iOS 平台一直处于领先地位，安卓紧随其后。Fuel.com 2017 年的一份报告称，16%的安卓应用开发者每月收入超过
    5000 美元。一些青少年电脑奇才凭借他们的应用创意发了大财。当尼克·达洛伊西奥 16 岁时，他想出了 Trimit，一个将大量文本压缩成简短摘要的应用。他最终以
    3000 万美元的价格将他的创意卖给了雅虎。


    ## 推动大数据发展


