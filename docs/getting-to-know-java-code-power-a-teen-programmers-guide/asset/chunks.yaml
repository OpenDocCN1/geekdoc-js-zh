    客户端，也称为前端，指的是网页浏览器。客户端代码（主要用 JavaScript 编写）在网页加载后运行在个人计算机上。


    ## 面向对象风格


    编程有不同的风格或方式，称为范式。程序员使用不同的范式来组织软件，使其按预期工作。一种常见的编程风格称为过程式。这种范式使用一系列任务，为计算机提供逐步指令。大多数最初的编程语言都是过程式的，包括
    C、COBOL 和 Fortran。


    另一方面，Java 是一种面向对象编程（OOP）语言。OOP 语言将数据视为对象，并使用一组相互交互的对象，而不是一长串命令。每个对象都扮演着独特的角色。例如，动画程序中的一个对象可以告诉角色行走或跳跃。一个对象也知道如何与程序中的其他对象交互。


    任何面向对象语言——包括 Java——都使用类。类是对象的蓝图代码，描述其内容。类描述数据字段并定义操作，称为方法。通过向对象发送消息，它执行其方法之一。


    OOP 通常用于存在大量可共享和重用代码的情况。当创建一个对象来处理复杂任务或行为时，程序员可以轻松地在代码中的任何地方再次使用该对象。过程式代码可能易于理解，但当代码量巨大时，维护起来就会变得困难。


    由于对象是可重用的，OOP 提高了速度和效率，特别是 Java 在速度方面已被证明优于其他语言。开发人员经常使用它，因为它减轻了编写软件时的一些工作量。


    ## JavaScript 和 Java 是截然不同的东西


    由于这两种常见的计算机编程语言的名称，人们有时认为 Java 和 JavaScript 是相关的。然而，JavaScript 并不是 Java 平台的一部分。虽然它们都是面向对象语言，但差别很大。正如开发者
    Jeremy Keith 在 2009 年所说：“Java 之于 JavaScript，就像火腿之于仓鼠。”以下是一些区别。


    JavaScript 通常用于在网页浏览器中创建交互效果。Java 的小程序（applets）也曾用于此目的，但如今已逐渐失宠。虽然 Java 以服务器端的“工作马”著称，但
    JavaScript 代码传统上只在浏览器中运行——尽管它在服务器端编程方面也日益流行。Java 代码需要编译，而 JavaScript 代码全是文本。总体而言，JavaScript
    被认为比 Java 简单，如果有人想制作生动、交互式的网页，它是一种很好的学习语言。


    那么，既然它们如此不同，为什么会有相似的名字呢？JavaScript 最初由网景公司的 Brendan Eich 开发，名为 Mocha，后来改名为 LiveScript。1995
    年，网景和 Sun Microsystems 达成了许可协议，该语言被重命名为 JavaScript。它旨在作为 Java 的补充脚本语言（意味着它不需要编译）。当时，Java
    是一种热门的新编程语言，一些人认为 JavaScript 的命名是为了给产品带来更多的声望和关注。


    ![Image](img/imgg_038_.jpg)


    > 图中所示的 Brendan Eich 在 20 世纪 90 年代开发了 JavaScript，旨在与 Java 协同工作，服务于高级应用和用户。


    ## Java 的完整体系


    当人们考虑 Java 时，它不仅仅是一种语言。它包括整个 Java 平台，即支持该语言以及构建 Web 系统和应用程序的完整环境。这包括其编译器、Java
    虚拟机（JVM）、库、框架和应用程序编程接口（API）。Java 运行时环境（JRE）是由 Oracle 开发和提供的一个捆绑包，其中包括 Java 虚拟机（JVM）、库以及运行
    Java 应用程序和小程序（执行特定任务的小型应用程序）所需的其他组件。


    当有人下载 Java 软件时，他会收到这个运行时环境，这为他提供了在网页浏览器上运行 Java 所需的一切。JRE 包括 Java 插件软件，允许用 Java
    编程语言编写的小程序在各种浏览器中运行。Web 开发人员曾使用小程序为网页带来功能——在网页上创建交互式按钮、复选框、表单和其他小动画。如今，小程序几乎已经消亡，被其他技术所取代——根据
    Oracle 的说法，JRE 9 继续提供 Java 插件，并支持在仍然提供标准插件支持的浏览器上启动小程序，但仅限有限使用，且不推荐。


    ## 翻译工具


    与许多计算机语言一样，Java 平台拥有工具——编译器和解释器——来翻译语言，以便机器能够理解。编译器是一种特殊程序，它将用一种编程语言编写的语句转换为计算机处理器最终会使用的代码。这种与平台无关的语言称为
    Java 字节码。虽然字节码类似于机器语言，但它并不是任何实际计算机的机器语言。Java 编译器还会在用户使用 Java 的“语法”或句法出错时告知用户。*《Java
    面向对象编程》*的合著者 Bill McCarty 博士将编译器比作一个严厉的监工，它“绝不容忍任何偏离 Java 语言官方规则的行为”。在开发早期而不是后期（当产品可能已经发布给公众时）发现这些语法错误非常重要。


    ![Image](img/imgg_039_.jpg)


    Java 虚拟机就是解释器。JVM 解读编译器生成的字节码。所有计算机的运行方式各不相同，JVM 将 Java 字节码转换为可执行指令。安装了 JVM 的计算机系统可以运行
    Java 程序，无论这些应用程序最初是在哪个计算机系统上开发的。每种类型的计算机都需要自己的 Java 字节码解释器，但所有这些解释器都解释相同的字节码语言。


    Oracle 解释说，由于 JVM 的存在，在装有 Windows NT 操作系统（OS）的个人计算机（PC）上开发的 Java 程序，无需修改即可在装有
    Solaris 操作系统的 Sun Ultra 工作站上同样良好地运行，反之亦然。


    平台的另一部分是 API。这些是省时的、现成的编译代码库，可用于 Java 程序。框架由多个库组成。它们是大量预编写的代码，任何人都可以将其添加到自己的代码中以节省时间。


    ![Image](img/imgg_040_.jpg)


    Linus Torvalds，一位开发了 Linux 操作系统、Android 和 Chrome OS 背后技术的软件工程师，曾说过：“大多数优秀的程序员编程，并不是因为他们期望获得报酬或公众的赞誉，而是因为编程很有趣。”理论上，编程应该是有趣且富有创造性的——而且通常也确实如此。但如果一个人是编程游戏中的完全新手，学习像
    Java 这样的计算机语言需要一些时间。用代码思考是一个非常独特的过程。学习基础知识可能需要长达六个月，而要达到相当熟练的程度则需要两到三年。这个过程取决于许多因素——投入的时间、学习能力和天赋。


    ## 优点与缺点


    谈到 Java，这种语言得到的评价褒贬不一。有些人认为 Java 笨重，比其他语言需要更多的工作。一位在线 Java 用户说，Java 的乐趣就像看着关闭的
    DMV 办公室墙上米色油漆变干一样。批评者称它冗长，需要太多工作才能让事情正常运行。


    ![Image](img/imgg_041_.jpg)

