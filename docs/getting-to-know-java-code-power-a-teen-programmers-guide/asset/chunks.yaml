    # 引言


    在计算机编程语言中，Java 非常热门。根据衡量编程语言使用情况的 TIOBE 指数（2018 年），Java 目前比 C++、Python、C#、PHP
    和 JavaScript 等几种广泛使用的语言更受欢迎。Java 运行着安卓智能手机上的应用程序，构建电子游戏，并驱动许多网络功能。在一定程度上，Java
    一直是许多热门网站（包括 LinkedIn、eBay、亚马逊和谷歌）背后的构建工具。此外，从自动取款机到停车计时器再到蓝光播放器，数十亿台设备都依赖 Java
    运行。然而，令人惊讶的是，Java 并不用于编程那些能煮出热咖啡的咖啡机。这些咖啡机通常运行在 C 或 C++ 语言上。


    虽然 C 和 C++ 都发明于 20 世纪 70 年代，至今仍然流行，但 Java 在 1991 年由詹姆斯·高斯林发明时便超越了它们。他在加利福尼亚的太阳微系统公司（Sun
    Microsystems）与一个名为“绿色团队”的小型工程师团队共同创造了这门语言。如今，所有与 Java 相关的材料都来自计算机技术公司甲骨文（Oracle），该公司于
    2010 年收购了太阳微系统公司。


    Java 的根源可以追溯到一个名为 Oak 的程序，它以一位工程师办公室外的一棵橡树命名。最初，高斯林和绿色团队开发 Oak 程序是为了操作一个面向数字有线电视行业的交互式手持家庭娱乐控制器。到
    1994 年，该程序已演变为 Java。名称之所以改变，是因为另一家名为 Oak Technology 的公司已经在使用它。在 JavaWorld.com
    的一次采访中，Oak 产品经理金·波利斯表示，她将程序命名为 Java，是因为它“反映了该技术的本质：动态、革命性、生动、有趣”。


    ![Image](img/imgg_033_.jpg)![Image](img/imgg_034_.jpg)


    高斯林和绿色团队成功创造了一种简单、安全（可用于编写防篡改和防病毒系统）且能在多种操作系统上运行的语言。Java 的口号是“一次编写，到处运行”。用这种新语言在一台计算机上编写的代码可以在另一台计算机系统上运行。高斯林和同事们设计了一个系统，消除了编写代码时的一些繁琐方面。Java
    允许用户编写可重复使用的代码片段，而无需反复重写代码。随着互联网在 20 世纪 90 年代的普及，设计者们意识到这种新语言非常适合创建在线应用程序。1995
    年，该团队宣布 Netscape Navigator 互联网浏览器将集成 Java 技术。Navigator 成为 20 世纪 90 年代的主流网络浏览器。当今流行的浏览器，如
    Safari、Explorer、Firefox 和 Chrome，也支持 Java 应用程序。


    尽管 Java 已有二十多年的历史，但它仍然需求旺盛。此外，许多人认为它比其他编程语言相对容易学习。在接受 TechRepublic 采访时，招聘公司 Hays
    的数字技术总监詹姆斯·米利根表示：“你可以通过在线课程掌握基础知识。” Java 也被认为是学习其他编程语言的良好基础。因此，对于那些对探索编程感兴趣的人来说，强烈建议先体验一下
    Java。


    ![Image](img/imgg_035_.jpg)


    Java 是世界上最流行的编程语言之一，运行在超过 70 亿台设备上，全球有超过 900 万开发者使用它。飞机系统、自动取款机、手机、计算机、医疗设备和电视机都运行在
    Java 上。Java 也已成为安卓移动应用开发的语言。Kickstarter 和 WordPress 的应用程序是用 Java 创建的，VLC 媒体播放器、MovieGuide、音乐应用
    Timber 和 Phonograph、游戏《像素地牢》、《兄弟连》和《自由飞行模拟：3D 飞机模拟器》也是如此。基于 Java 的谷歌应用包括 YouTube
    视频下载、Facebook Messenger、Instagram、Netflix、Spotify 和 Uber。


    对于当今对编程感兴趣的人来说，掌握 Java 是必须的。许多技术专业人士认为它易于学习，其编码风格被称为几乎是直观的（意味着它很自然）。


    对于那些有兴趣学习、实验和用 Java 构建的人来说，它是免费的开源软件。“开源”意味着源代码可以免费获取，并且可以重新分发和修改。开源软件为开发者提供了更多创作和分享作品的自由。公众现在可以在甲骨文网站上免费获取它。可下载的
    Java 开发工具包提供了使用 Java 编程语言构建应用程序和组件所需的一切。


    ![Image](img/imgg_036_.jpg)


    机器中的大脑


    电子设备和系统并非自行运作。许多设备依赖于内部计算机芯片提供的电子“脑力”。这种微处理器被称为嵌入式处理器或逻辑芯片，它告诉机器如何运行。例如，自动取款机依靠处理器接收用户指令，从而执行所需任务——接受存款、取款、出具余额报表等。基本上，自动取款机是一个数据终端，其嵌入式处理器与银行的宿主处理器通信，后者保存着客户银行账户的实际详细信息。宿主处理器检查持卡人提交的详细信息（包括安全码）；如果一切无误，交易便完成。


    在网站方面，Java 以其服务器端能力而闻名。许多需要处理大量流量的主要公司——如山姆会员店、亚马逊和苹果应用商店——都依赖它。每天支持超过四亿条推文的 Twitter，其核心基础设施基于
    Java 系统。Java 编程在公司服务器上执行所有工作，服务器是一种设计用于处理请求并通过互联网或局域网向其他计算机传输数据的计算机。服务器端（也称为后端）托管着客户端通过其网络浏览器在互联网上访问的网页。Java
    编程告诉网站或应用程序如何运行。


    ![Image](img/imgg_037_.jpg)


