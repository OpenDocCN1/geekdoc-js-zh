  trans: '

    在日常生活中，企业、政府和其他大型组织必须处理海量数据。他们收集、存储、跟踪并分析这些数据，以制定战略性的商业决策。对于当今的程序员来说，挑战在于跟上这股持续不断的信息浪潮。《技术评论》高级编辑安东尼奥·雷加拉多表示，所有数据中只有大约
    0.5%被真正分析过。由于 Java 可以在台式机、移动设备和平板电脑上直接使用，并且提供了庞大的代码库，因此该语言能够承担许多与处理大数据相关的任务。到
    2018 年，Hadoop 已成为一套流行的程序和流程，构成了大数据运营的支柱。Hadoop 本身是用 Java 开发的。


    ## 迈向太空与更远的地方


    Java 技术已经踏足前人未至的领域。美国国家航空航天局（NASA）在许多项目中都使用了 Java，包括其提供虚拟 3D 地球的 World Wind 软件开发工具包。用户可以放大或缩小地球上的各个位置。现代机器人工程也利用了
    Java。一款获奖的自动驾驶汽车就是基于 Java 代码运行的。通过他的公司 Marginally Clever 制造和销售机器人的丹·罗耶也依赖 Java。该语言还支撑着
    Makelangelo——一款绘制海报和壁画的艺术机器人。结合机器人技术和医疗保健领域，阿里·莱穆斯组装了一只低成本假手。莱穆斯提供了如何使用 3D 打印机和
    Java 代码构建这只假手的说明。


    ![图片](img/imgg_055_.jpg)


    得益于 Java 技术，Doctor Online 提供了一种交互式患者护理服务。在演艺界，工业光魔（ILM）已转向 Java 来制作各种特效。ILM 制作了诸如《加勒比海盗》系列电影中戴维·琼斯那类似鱿鱼的脸，以及许多漫威电影中钢铁侠战衣那逼真的金属表面等特效。


    云是 Java 留下印记的另一个前沿领域。云计算是指使用托管在互联网上的远程服务器网络来存储、管理和处理数据的实践。组织和个人可以远程访问这些计算服务。当某人将数据存储在自己的计算机硬盘上或从硬盘运行程序时，这被称为本地存储和计算——而非云计算。一些人更倾向于选择云计算服务，认为这是拥有和运营计算机及网络的一种更经济实惠的替代方案。一个例子是微软的
    Office Online。用户无需安装任何东西，即可通过互联网访问仅限在线版本的 Word、Excel、PowerPoint 和 OneNote。这些就是云计算工具。Google
    Drive 是一种流行的云文件存储形式。由于 Java 可以在任何地方运行，因此它非常适合云开发。


    ## »其他主流编程语言


    Java 通常与其他编程语言一起使用。以下是初学者应该了解的其他几种广泛使用的语言。


    ### C

    C 是一种通用语言，创建于 1972 年，被广泛使用。它与 UNIX 操作系统紧密相关。


    ### C++

    C++能够在多种平台上运行，如 Windows、Mac OS 以及各种版本的 UNIX，多年来一直是最流行的语言之一。它于 1979 年创建，是 C 语言的扩展版本。


    ### C#

    C#是 C 和 C++的混合体，由微软开发，旨在与 Java 竞争。


    ### Objective-C

    这是为 OS X 和 iOS 编写软件的主要编程语言。


    ### Python

    Python 是一种顶级语言，这种交互式、面向对象的编程语言可免费使用。它以英国喜剧团体蒙提·派森的飞行马戏团命名。谷歌的许多组件都是用 Python 编写的，游戏《战地
    2》、《星际迷航：桥牌指挥官》和《文明 4》也是如此。


    ### Ruby on Rails

    有时简称为 Rails，Ruby on Rails 是一个开源 Web 应用框架，由大卫·海涅迈尔·汉森用 Ruby 语言构建。它将 Ruby 与 HTML、CSS
    和 JavaScript 结合在一起。Ruby 在程序员中以简洁清晰的语言风格而闻名。


    ### SQL

    结构化查询语言（SQL）专门用于存储、操作和查询数据库中存储的数据。


    ## 万物互联


    在快速变化的技术世界中，一个相对较新的概念是物联网（IoT）。它指的是将各种设备连接到互联网——厨房电器、无人驾驶汽车、心脏监测器等。这些电子产品通过 M2M（机器对机器）通信进行连接。


    智能自行车锁通过一个特殊的手机应用打开和关闭——如果有人试图破坏用户的自行车，用户的手机就会收到一条短信。现在已有设备可以跟踪冰箱中牛奶和鸡蛋的新鲜度，并在食物变质时发送消息提醒消费者。June
    烤箱及其配套的 June 应用让用户可以通过 iPhone 或 iPad 控制烹饪，并通过实时视频流监控食物。理论上，设备内部的技术也让公司能够收集更多关于自身产品和内部系统的数据。研究公司
    Gartner 报告称，2017 年估计有 84 亿台设备连接到互联网，共享和收集信息。然而，物联网的一大担忧是安全性。黑客已经展示了如何入侵系统以控制家庭安全系统和计算机驱动的车辆等物品。


    在接受 Oracle.com 采访时，Globalcode 创始人维尼修斯·森格表示，Java 天生就是为了做这类事情而生的。他说：


    > Java 一直致力于提供企业解决方案、在互联网上销售商品以及银行业务，但 Java 最初被设计为一种连接家用电器等物品的编程语言。Java 是物联网的最佳平台，因为它对不同尺寸的计算机都具有灵活性。

    >

    > Java 应用于银行、零售企业和互联网业务的相同架构、安全性和通信协议也可以用于嵌入式设备。Java 是通往一个勇敢的新技术、编程和便利未来的大门。


    ## 词汇表


    **ANDROID** 一种由谷歌开发的移动操作系统，基于开源操作系统。


    **APPLETS** 执行特定任务的小型应用程序。


    **应用程序编程接口（API）** 一组用于构建软件的程序、协议和工具。


    **BUG** 计算机程序中的编码错误或缺陷。


    **客户端/前端** 指在用户计算机上发生的操作。


    **编译器** 将编程语言编写的语句翻译成计算机能理解的机器语言的软件。


    **计算机架构** 计算机系统的组织和结构方式。


    **数据库管理** 对计算机程序中收集的信息进行组织和维护。


    **DEBUG** 查找并修复软件或硬件中的错误。


    **嵌入式** 描述在更大的机械或电气系统中具有专用功能的计算机系统。


    **图形用户界面（GUI）** 常读作“gooey”，GUI 基本上是让用户使用和与计算机交互的视觉组件。它们通过视觉元素设计，使计算机更易于使用。微软 Windows
    和苹果 Mac 界面都使用显示图标的“桌面”屏幕。


    **集成开发环境（IDE）** 一种简化软件和代码开发及调试的编程环境。


    **IOS** 由苹果公司创建和开发的移动操作系统。


    **机器代码** 计算机中央处理器能够理解的基本语言。


    **MOD** “修改”的缩写，指改变电子游戏某些方面的改动。


    **范式** 一种编程风格或方式。


