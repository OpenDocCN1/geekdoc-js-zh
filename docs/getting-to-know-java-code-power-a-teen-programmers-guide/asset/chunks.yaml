    # Introduction


    When it comes to computer programming languages, Java is hot. According to the
    TIOBE Index for 2018, which measures the use of programming languages, Java is
    currently more popular than several widely used languages, including C++, Python,
    C#, PHP, and JavaScript. Java runs the applications on Android smartphones, builds
    video games, and operates many web functions. To one degree or another, Java has
    been the tool behind the construction of many popular websites, including LinkedIn,
    eBay, Amazon, and Google. In addition, billions of devices hum along on Java,
    from ATMs to parking meters to Blu-ray players. Surprisingly, however, Java is
    not used to program the coffee makers that pump out hot java. Typically, these
    run on the languages C or C++.


    While C and C++, both invented in the 1970s, are still popular today, Java surpassed
    them when James Gosling invented it in 1991. He created the language at Sun Microsystems
    in California while working with a small group of engineers called the Green Team.
    Today, all materials related to Java come from the computer technology company
    Oracle, which bought Sun Microsystems in 2010.


    The roots of Java can be found in a program called Oak, named after a tree that
    stood outside an engineer’s office. Originally, Gosling and the Green Team developed
    the Oak program to operate an interactive, handheld home-entertainment controller
    that was targeted at the digital cable television industry. By 1994, the program
    had evolved into Java. The name changed along the way because it turned out another
    company, Oak Technology, was already using it. In an interview in JavaWorld.com,
    Kim Polese, who was the Oak product manager, said she named the program Java because
    it “reflected the essence of the technology: dynamic, revolutionary, lively, fun.”


    ![Image](images/imgg_033_.jpg)![Image](images/imgg_034_.jpg)


    Gosling and the Green Team succeeded in making a language that was simple, secure
    (it can be used to write tamper-free and virus-protected systems), and operated
    on multiple operating systems. Java’s catchphrase was “write once, run anywhere.”
    Code written on one computer in this new lingo could run on another computer system.
    Gosling and colleagues concocted a system that eliminated some of the tedious
    aspects of writing code. Java allowed the user to write bits of code that could
    be reused later without needing to rewrite the code over and over again. As internet
    use became widespread in the 1990s, the designers realized that the new language
    was ideal for creating online applications. In 1995, the team announced that the
    Netscape Navigator internet browser would incorporate Java technology. Navigator
    became the dominant web browser in the 1990s. Popular browsers of today, such
    as Safari, Explorer, Firefox, and Chrome, also support Java applications.


    Although it is now more than twenty years old, Java remains highly in demand.
    Plus, many consider it relatively simple to learn compared to other programming
    languages. In an interview with TechRepublic, James Milligan, director of digital
    technology at the recruiting firm Hays, said, “You can grasp the basics through
    an online course.” Java is considered a good foundation for learning other programming
    languages as well. So for those interested in exploring coding, getting a taste
    of Java is highly recommended.


    ![Image](images/imgg_035_.jpg)


    Java is one of the most popular programming languages in the world, operating
    on more than seven billion devices and used by more than nine million developers
    around the globe. Airplane systems, ATMs, cell phones, computers, medical equipment,
    and televisions all run on Java. Java has also become the language of Android
    mobile app development. Kickstarter and WordPress apps are created with Java,
    as are the VLC media player, MovieGuide, the music apps Timber and Phonograph,
    the games *Pixel Dungeon, Brothers in Arms, and Free Flight Sim: 3D Airplane Simulator.*
    There are Java-based Google apps for YouTube video downloads, Facebook Messenger,
    Instagram, Netflix, Spotify, and Uber.


    For those interested in coding today, knowledge of Java is a must. Many technology
    professionals consider it easy to learn, with a coding style that has been called
    almost intuitive (meaning it comes naturally).


    For those interested in learning, experimenting, and constructing with Java, it
    is free and open-source software. “Open source” means the source code is made
    freely available and may be redistributed and modified. Open-source software gives
    developers more freedom to create and share their work. The general public can
    access it freely today at the Oracle website. A downloadable Java Development
    Kit provides all one needs for building applications and components using the
    Java programming language.


    ![Image](images/imgg_036_.jpg)


    THE MIND IN THE MACHINE


    Electronic devices and systems don’t operate on their own. Many depend on the
    electronic “brainpower” provided by a computer chip within. Called an embedded
    processor or a logic chip, this microprocessor tells a machine how to function.
    ATMs, for example, rely on processors to receive instructions from users so they
    can perform the tasks required—accept deposits, make withdrawals, issue balance
    statements, etc. Basically, the ATM is a data terminal, and its embedded processor
    communicates with the bank’s host processor, which holds the actual details about
    customer bank accounts. The host processor checks the details submitted by the
    cardholder (including the security code); if everything checks out, the transaction
    is completed.


    When it comes to websites, Java is known for its server-side powers. Many major
    companies that need to handle a large volume of traffic—such as Sam’s Club, Amazon,
    and the Apple App Store—depend on it. Twitter, which supports more than four hundred
    million tweets a day, has its core infrastructure based on a Java system. Java
    programming performs all the work on a company’s server, which is a computer designed
    to process requests and deliver data to other computers over the internet or a
    local network. The server side, also called the back end, houses web pages that
    can be accessed over the internet by clients through their web browsers. The Java
    programming tells a website or application how to behave.


