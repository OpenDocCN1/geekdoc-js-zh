    # 条件语句

    这些是代码中的“如果-那么”结构，告诉计算机如果某个条件为真，则执行某个操作。例如，如果银行账户余额低于 100 美元，代码可能会发出声明：“余额不足。”


    # 循环

    循环是一段重复执行的代码，用于完成主要任务。


    # 脚本编程

    脚本编程是一种使用特定脚本语言编写的特定编码类型。所有脚本都是编码，但并非所有编码都是脚本。脚本语言无需编译——它们是解释执行的。例如，通常 Java 程序在运行前需要编译，而像
    JavaScript 或 PHP 这样的脚本语言通常不需要编译。


    # 方法

    方法是在数据字段中定义的操作或过程。


    # 顺序

    这是对动作或事件的安排，使其按照预定顺序引导至下一个有序动作。


    # 变量

    这些是根据程序可以改变的值。它们可以根据需要被创建、编辑或删除。


    # 探索应用世界

    Web 应用程序涵盖广泛的功能。它们可以通过在线表单收集输入、统计投票、处理产品订单、预订航班或允许用户登录。现在人们可以上网购买衣服、办理银行业务或参与讨论——这一切都归功于
    Web 应用程序。世界各地的用户可以通过他们的电脑浏览器访问这些应用程序——因此实际上可能有数百万人同时使用同一个应用。


    开始吧


    ![图片](img/imgg_050_.jpg)


    在客户端（普通用户可见），网站可以使用标记语言或脚本语言构建，例如 HTML（超文本标记语言）、CSS（层叠样式表）或 JavaScript。Java 也用于应用程序，但通常用于服务器端。例如，Java
    Servlet 是服务器程序，通常响应网站用户的请求，最常见的是 HTTP（超文本传输协议）请求。Java 在处理与许多其他系统通信的大型 Web 应用程序方面建立了良好声誉，例如银行和保险公司使用的系统。


    Java 已发展成为构建在 Android 智能手机上运行的程序所必需的语言。谷歌选择 Java 作为其广受欢迎的 Android 移动操作系统的编程语言。甚至
    Gmail 的服务器端功能也是由 Java 和 C++运行的。2006 年，谷歌推出了基于 Java 的 Gmail 手机应用程序。应用程序让任何人通过移动设备进行广泛的活动，从玩在线游戏到与世界各地的人聊天，再到查看
    3D 图像。尽管 Android 一直依赖基于 Java 的应用程序，但 Oracle 已对谷歌提起诉讼，声称 Android 侵犯了其专利——而谷歌则声称其根据合理使用法律合法地整合了
    Java 技术。


    ![图片](img/imgg_051_.jpg)


    2017 年 5 月，EdX——一个提供大学水平课程的大型在线平台——将 Java 列为你可以免费在线学习的三种最赚钱的编程技能之一（另外两种是 SQL 和
    C）。该公司强调 Java 为打开通常年薪超过 10 万美元的绝佳机会铺平了道路。美国劳工统计局（BLS）的数据显示，2016 年计算机程序员的年薪中位数为
    79,840 美元。衡量编程语言流行度的 TIOBE 指数在 2018 年 2 月将 Java 列为第一——这意味着懂 Java 的人比懂任何其他语言的人拥有更多的就业机会。


    Java 大师拥有广泛的就业选择。例如，Java 软件开发人员负责开发应用程序和软件，通常与 Web 开发人员和软件工程师合作，将 Java 集成到不同的业务系统中。这些应用程序可能用于移动设备或平板电脑，也可能在计算机上运行。各种类型的企业和组织都在使用
    Java 软件。


    # 开发人员与程序员

    Java 编码人员可能正在处理文字处理软件、Web 浏览器工具、游戏或媒体播放器（如 iTunes）。软件开发通常是一项非常有创造性的工作，因为它需要提出新想法。通常，开发人员参与产品的每一个步骤，从概念到推向世界。在此过程中，他们测试和分析产品，检查任何潜在问题。如果出现任何问题，开发人员需要找到解决方案。他们需要确保拥有最佳质量的产品，并且程序用户友好。此外，开发人员可能会编写详细说明产品的文档，以便其他人了解所有细节。开发人员展示软件结构及其与其他程序如何协同工作的宏观图景。在许多情况下，他们制作解释如何编写代码的图表和流程图，然后将实际的代码编写工作交给程序员。


    与开发人员相比，程序员的工作可能创造性较低。他们执行开发人员提出的计划，整天编写大量代码。他们还进行调试（测试和修复错误），并将信息收集到库中，以便以后使用，使未来的代码编写更容易。程序员可能有不同的专长。游戏程序员编写驱动计算机游戏图形的代码。Web
    程序员构建网站及其相关的应用程序。他们可能将基于 Java 的程序与用 HTML（基本的 Web 开发语言）构建的页面结合起来。Web 设计融合了许多技能，包括计算机编程和图形设计。网站创建者知道如何整合动画、视频、音频和交互功能。


    尽管在技术驱动的世界中，设计师和程序员的需求量很大，但美国劳工统计局预测，2014 年至 2024 年间，计算机程序员的工作岗位将减少 8%。部分原因是公司正在从美国以外雇佣更便宜的程序员。


    # 教育路径

    如果编程和软件开发成为你希望追求的职业，那么你需要超越在线教程。许多大型雇主只雇佣拥有计算机科学、信息系统、数学或密切相关领域学位的人。课程可能涵盖数据结构、计算机体系结构、数据库管理、统计和技术写作。这些对于使用任何语言的程序员来说都是重要的技能。


    虽然通过大学学位是计算机编程成功的标准途径，但能够展示经验并精通 Java 编码的人仍然可以获得极好的职位。Oracle 拥有自己的“大学”，提供在线课程和认证。通过官方能力考试会提高求职者的价值。正如许多程序员和开发人员所证明的，教育过程永无止境。编码世界不断变化，因此专业人士需要跟上所有最新进展。即使是高级程序员也必须掌握新引入的特性。如果你将此作为职业，请准备好享受终身学习。


    ### »实习提供真实世界的视角


