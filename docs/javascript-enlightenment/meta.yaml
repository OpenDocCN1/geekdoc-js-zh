    objects


    The null and undefined values are trivial values that do not require a constructor
    function, nor the use of the new operator to establish them as a JavaScript value.
    To use null or undefined, all you do is test as if they were an object. The remaining
    primitive values string, number, and boolean, while technically returned from
    a constructor function, rest are not objects.


