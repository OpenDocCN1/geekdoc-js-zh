    ## Chapter 1 - JavaScript Objects


    ### Creating objects


    In JavaScript, objects are king: Almost everything is an object or acts like an
    object. Understand objects and you will understand JavaScript. So let''s examine
    the creation of objects in JavaScript.


    An object is just a container for a collection of named values (aka properties).
    Before we look at any JavaScript code, let''s first reason this out. Take myself,
    for example. Using plain language, we can express in a table, a "cody":


    | property: | property value: |

    | :--- | :--- |

    | living | true |

    | age | 33 |

    | gender | male |


    The word "cody" in the table above is just a label for the group of property names
    and corresponding values that make up exactly what cody is. As you can see from
    the table I am living, 33, and male.


    JavaScript, however, does not speak in tables. It speaks in objects, which are
    not unlike the parts contained in the "cody" table. Translating the above table
    into an actual JavaScript object would look like this:


    > live code: http://jsfiddle.net/javascriptlightening/ckVA5/


    ```javascript

    <!DOCTYPE html><html lang="en"><body><script>


    // create the cody object...

    var cody = new Object();


    // then fill the cody object with properties (using dot notation)

    cody.living = true;

    cody.age = 33;

    ```


    ```javascript

    cody.gender = ''male'';

    console.log(cody); // logs Object {living = true, age = 33, gender = ''male''}

    </script></body></html>

    ```


    Keep this at the forefront of your mind: objects are really just containers for
    properties, each of which has a name and a value. This notion of a container of
    properties with named values (i.e. an object) is used by JavaScript as the building
    blocks for expressing values in JavaScript. The cody object is a value which I
    expressed as a JavaScript object by creating an object, giving the object a name,
    and giving it properties.


    Up to this point, the cody object we are discussing has only static information.
    Since we are dealing with a programming language, we want to program our cody
    object to do something. Otherwise, all we really have a database, akin to JSON.
    In order to bring the cody object to life, I need to add a property method. Property
    methods perform a function. To be precise, in JavaScript, methods that contain
    a Function() object, whose intent is to operate on the function is contained within.


    If I were to update the cody table with a getGender method, in plain English it
    would look like this:


    | property: | property value: |

    | :--- | :--- |

    | living | true |

    | age | 33 |

    | gender | male |

    | getGender | [function] |


    The word "cody" in the table above is just a label for the group of property names
    and corresponding values that make up exactly what cody is. As you can see from
    the table I am living, 33, and male.


    JavaScript, however, does not speak in tables. It speaks in objects, which are
    not unlike the parts contained in the "cody" table. Translating the above table
    into an actual JavaScript object would look like this:


