    # The semantics between "JavaScript objects" vs. "Object() objects


    Do not confuse the general term "JavaScript objects", which refers to the notion
    of objects in JavaScript, with Object() objects. An Object() object (e.g. var
    myArray = new Object()) is a very specific type of value expressed in JavaScript.
    Just as an Array() object is a type of object called array, an Object() object
    is a type of object called object. The gist is that the Object() constructor function
    produces an empty generic object container, which is referred to as an Object()
    object. Similarly, the Array() constructor function produces an array object,
    and we refer to these objects as Array() objects.


    The term "JavaScript objects" in this book is used to refer to all objects in
    JavaScript, because most of the values in JavaScript can act like objects. This
    is due to the fact that the majority of JavaScript values are created from a native
    constructor function which produces a very specific type of object.


    What you need to remember is that an Object() object is a very specific kind of
    value. It''s a generic empty object. Do not confuse this with the term "JavaScript
    objects" used to refer to most of the values that can be expressed in JavaScript
    as an object.'
