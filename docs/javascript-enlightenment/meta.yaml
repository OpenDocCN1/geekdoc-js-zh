  mdcn: "\n当函数使用 `new` 关键字调用时，`this` 的值——正如所提到的，构造函数指向的是实例本身。换句话说：在构造函数中，我们可以在对象实际创建之前通过\
    \ `this` 来使用该对象。在这种情况下，`this` 的默认值变化方式与使用 `call()` 或 `apply()` 不同。\n\n下面，我们设置了一个\
    \ `Person` 构造函数，它使用 `this` 来引用正在创建的对象。当创建一个 `Person` 实例时，`this.name` 将引用新创建的对象，并在新对象中设置一个名为\
    \ `name` 的属性，其值为传递给构造函数的参数 `(name)`。\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_88_0.png)\n\
