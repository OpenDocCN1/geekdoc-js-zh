  md: "* An unlimited number of function and eval scopes can be created, while only\
    \ one global scope is used by a JavaScript environment.\n\n- The global scope\
    \ is the last stop in the scope chain.\n\n* Functions that contain functions create\
    \ stacked execution scopes. These stacks which are chained together are often\
    \ referred to the scope chain.\n\n# JavaScript does not have block scope\n\nSince\
    \ logic statements (e.g. if) and looping statements (e.g. for) do not create a\
    \ scope, variables can overwrite each other. Examine the code below and make sure\
    \ you understand that the value of foo is redefined as the program executes the\
    \ code.\n\n> live code: http://jsfiddle.net/javascriptenenment/Wn9p6/\n\n```\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar foo = 1; // foo = 1\n\n\
    if (true) {\n  foo = 2; // foo = 2\nfor(var i = 3; i <= 5; i++) {\n    foo = i;\
    \ // foo = 3,4, then 5\n    console.log(foo); // logs 3,4,5\n  }\n}\n\n</script></body></html>\n\
    ```\n\nfoo is changing as the code executes because JavaScript has no block scope\
    \ — only function, global, or eval scope.\n\n# Use var inside of functions to\
    \ declare variables and avoid scope gotchas\n\nJavaScript will declare any variables\
    \ lacking a var declaration (even those contained in a function or encapsulated\
    \ functions) to be in the global scope instead of the intended local scope. Have\
    \ a look at"
