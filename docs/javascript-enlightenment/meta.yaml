    How is the value of sayHiText found when it is not contained inside the scope
    of the func2 function?

    JavaScript first looks in the func2 function for a variable named sayHiText. Not
    finding func2 there, it looks up to func2''s parent function, func1. The sayHiText
    variable is not found in the func1 scope, either, so JavaScript continues to the
    global scope where sayHiText is found, at which point the value of sayHiText is
    delivered. If sayHiText had not been defined in the global scope, undefined would
    have been returned by JavaScript.


    This is such an important concept to grep. Let''s examine another code example.
    Below, we grab three from three different scopes.


    ![](img/ad11d036d555f7d1771aeb8c30e67ba2_94_0.png)


    ```

    <!DOCTYPE html><html> lang="en"><body><script>


    var x = 10;

    var foo = function() {

    var y = 20;

    var bar = function() {

    var z = 30;

    console.log(z + y + x); // z is local, y & z are found in the scope chain

    });

    });


    foo(); // logs 60


    <script></body></html>

    ```


    The value for z is local to the bar function and the context in which the console.log
    is invoked, the value for y in the foo function, which is the parent of bar(),
    and the value for x is in the global scope. All of these are accessible to the
    bar function via the scope chain. Make sure you understand that referencing variables
    in the bar function will check all the way up the scope chain for the variables.


    +   - The scope chain, if you think about it, is not different from the prototype
    chain. Both are simply a way for a value to be looked up by checking a systematic
    and hierarchical set of locations.'
