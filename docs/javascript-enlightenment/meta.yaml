    Quite simply, primitive values represent the lowest form (i.e simplest) of datum/information
    available in JavaScript.


    # Notes


    +   - As opposed to creating values with literal syntax, when a String(), Number(),
    or Boolean() value is created using the new keyword, the object created is actually
    a complex object.

    - It''s critical that you understand the fact that the String(), Number(), and
    Boolean() constructors are dual-purpose constructors used to create literal/primitive
    values as well as complex values. These constructors do not always return objects,
    but instead, when used without the "new" operator, can return a primitive representation
    of the actual complex value.


    # The primitive values null, undefined, "string", 10, true, and false are not
    objects


    The null and undefined values are trivial values that do not require a constructor
    function, nor the use of the new operator to establish them as a JavaScript value.
    To use null or undefined, all you do is test as if they were an object. The remaining
    primitive values string, number, and boolean, while technically returned from
    a constructor function, rest are not objects.


    Below, I contrast the difference between primitive values and the rest of the
    native JavaScript objects.


    > live code: http://jsfiddle.net/javascriptlightenment/ZwqGoD/


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    // no object is created when producing primitive values, notice no use of the
    "new" keyword

    var primitiveString = "foo"

    var primitiveString = String(''foo'');

    var primitiveNumber1 = 10;

    var primitiveNumber2 = Number(''10'');

    var primitiveBoolean1 = true;

    var primitiveBoolean2 = Boolean(''true'');


    // confirm if the type is not object

    console.log(typeof primitiveString1); // ''string,string''

    console.log(typeof primitiveNumber1, typeof primitiveNumber2); // ''number,number''

    console.log(typeof primitiveBoolean1, typeof primitiveBoolean2); // ''boolean,boolean''


    // versus the usage of a constructor and new for creating objects

    var myNumber = Number(23);

    var myString = new String(''male'');

    ```'
