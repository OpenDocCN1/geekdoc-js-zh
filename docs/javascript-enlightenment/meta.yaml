  md: "```\n</script><body></html>\n```\n\nThe `this` used in `this.gender` simply\
    \ refers to the `cody` object on which the function is operating.\n\nThe topic\
    \ of `this` can be confusing, but it does not have to be. Just remember that,\
    \ in general, `this` is used inside functions to refer to the object is contained\
    \ within, as opposed to the itself (exceptions include using the `new` keyword\
    \ or `call()` and `apply()`).\n\n+   - The `this` keyword looks and acts like\
    \ any other variable, except you cannot modify it.\n- As opposed to `arguments`\
    \ and any parameters sent to the function, `this` is a keyword (not a property)\
    \ in the call/activation context.\n\n# How is the value of `this` determined?\n\
    \nThe value of `this`, passed to all functions, is based on the context in which\
    \ the function is called at `runtime`. Pay attention here, because this is one\
    \ of quirks you just need to memorize.\n\nThe `myObject` object in the code below\
    \ is a property called `sayFoo`, which points to the `sayFoo` function. When the\
    \ `sayFoo` is called from the global scope, `this` refers to the `window` object.\
    \ When it is called as a method of `myObject`, `this` refers to `myObject`.\n\n\
    Since `myObject` has a property named `foo`, that property is used.\n\n```\n<!DOCTYPE><html\
    \ lang=\"en\"><body><script>\n\nvar foo = 'foo';\nvar myObject = {foo: I am myObject.foo};\n\
    \nvar sayFoo = function() {\n  console.log(this['foo']);\n};\n\n// give myObject\
    \ a sayFoo property and have it point to sayFoo function\nmyObject.sayFoo = sayFoo;\n\
    \nmyObject.sayFoo(); // logs I am myObject.foo\n```\n\nlive code: http://jsbin.com/oxaliq/edit"
