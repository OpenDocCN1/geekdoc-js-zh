    ## 第 1 章 - JavaScript 对象


    ### 创建对象


    在 JavaScript 中，对象是一切的核心：几乎所有内容都是对象，或者表现得像对象。理解了对象，你就理解了 JavaScript。所以，让我们来看 JavaScript
    中对象的创建。


    对象仅仅是具命名值（又称为属性）集合的容器。在查看任何 JavaScript 代码之前，让我们先进行逻辑推导。以我为例，用通俗的语言，我们可以用表格表示一个“cody”：


    | 属性: | 属性值: |

    | :--- | :--- |

    | living | true |

    | age | 33 |

    | gender | male |


    上表中的“cody”一词只是属性名及其对应值组的标签，这些值共同构成了 cody 的真面。正如从表中看到的，我是着的（living），33岁，且是男性（male）。


    然而，JavaScript 并不用表格来交流。它使用对象进行交流，而对象与“cody”表格中包含的部分相似。将上述表格转换为实际的 JavaScript 对象看起来如下：


    > 实时运行代码：http://jsfiddle.net/javascriptlightening/ckVA5/


    ```javascript

    <!DOCTYPE html><html lang="en"><body><script>


    // 创建 cody 对象...

    var cody = new Object();


    // 然后用属性填充 cody 对象（使用点符号表示法）

    cody.living = true;

    cody.age = 33;

    ```


    ```javascript

    cody.gender = ''male'';

    console.log(cody); // 记录 Object {living = true, age = 33, gender = ''male''}

    </script></body></html>

    ```


    请牢记这一点：对象本质上只是属性的容器，每个属性都有一个名称和一个值。这种带有命名值的属性容器的概念（即对象）被 JavaScript 用作在 JavaScript
    中表示值的构建块。cody 对象是一个值，我通过创建一个对象、给该对象命名并赋予其属性，将其以 JavaScript 对象的形式表达出来。


    到目前为止，我们讨论的 cody 对象只有静态信息。由于我们处理的是编程语言，我们希望编写我们的 cody 对象来执行某些操作。否则，我们拥有的仅仅是一个类似于
    JSON 的数据库。为了让 cody 对象活起来，我需要添加一个属性方法（Property method）。属性方法执行一个函数。具体来说，在 JavaScript
    中，包含 `Function()` 对象的方法，其意图是对其中包含的函数进行操作。


    如果我为 cody 表格更新一个 `getGender` 方法，用通俗的语言描述看起来是这样：


    | 属性: | 属性值: |

    | :--- | :--- |

    | living | true |

    | age | 33 |

    | gender | male |

    | getGender | [function] |


    上表中的“cody”一词只是属性名及其对应值组的标签，这些值共同构成了 cody 的真面。正如从表中看到的，我是着的，33岁，且是男性。


    然而，JavaScript 并不用表格来交流。它使用对象进行交流，而对象与“cody”表格中包含的部分相似。将上述表格转换为实际的 JavaScript 对象看起来如下：


    > 实时运行代码：http://jsfiddle.net/javascriptlightening/ckVA5/


    ```javascript

