  md: "```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar myObject = {};\n\
    \nvar myFunction = function(param1, param2) {\n  // set via call('this') points\
    \ to myObject when function is invoked\n  this.foo = param1;\n  this.bar = param2;\n\
    \  console.log(this) // logs Object {foo = 'foo', bar = 'bar'}\n}\n\nmyFunction.call(myObject,\
    \ 'foo', 'bar'); // invoke function, set this value to myObject\n\nconsole.log(myObject)\
    \ // logs Object {foo = 'foo', bar = 'bar'}\n\n</script></body></html>\n```\n\n\
    In the example above, we are using call(), but apply() could be used as well.\
    \ The difference between the two is how the parameters for the function are passed.\
    \ Using call(), the parameters are just comma separated. Using apply(), the parameter\
    \ values are passed inside an array. Below, is the same idea, but using apply().\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar myObject = {};\n\
    \nvar myFunction = function(param1, param2) {\n  // set via apply(), this points\
    \ to myObject when function is invoked\n  this.foo = param1;\n  this.bar = param2;\n\
    \  console.log(this) // logs Object {foo = 'foo', bar = 'bar'}\n}\n\nmyFunction.apply(myObject,\
    \ ['foo', 'bar']); // invoke function, set this value\n\nconsole.log(myObject)\
    \ // logs Object {foo = 'foo', bar = 'bar'}\n\n</script></body></html>\n```\n\n\
    You need to take away here is that that you can override the default way in which\
    \ JavaScript determines the value of this in a function's scope.\n\n# Using the\
    \ this keyword inside a user-defined constructor function"
