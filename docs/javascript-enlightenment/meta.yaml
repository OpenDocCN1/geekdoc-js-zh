    Understanding the creation, nature, and usage of objects and their primitive equivalents
    is the focus of the rest of this book.


    # JavaScript constructors construct and return object instances


    The role of a constructor function is to create multiple objects that share certain
    qualities and behaviors. Basically a constructor function is a cookie cutter for
    producing objects that have default properties and property methods.


    If you say, "A constructor is nothing more than a function," then I would reply,
    "You are correct — unless that function is invoked using the new keyword. (e.g.
    new String(''foo'')). When this happens, a function takes on a special role, and
    JavaScript treats the function as setting the value of this for the function to
    the new object that is being constructed. In addition to this special behavior,
    the function will return the newly created object (i.e this) by default inside
    the value false. The new object that is returned from the function is considered
    to be an instance of the value function that constructs it.


