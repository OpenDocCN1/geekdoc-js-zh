  md: "# Chapter 7 - Scope & Closures\n\n# Conceptual overview of JavaScript scope\n\
    \nIn JavaScript, scope is the context in which code is executed, and there are\
    \ three types of scope: global scope, local scope (sometimes referred to as \"\
    function scope\"), and eval scope.\n\nCode defined using var inside of a function\
    \ is locally scoped, and is only \"visible\" to other expressions in that function,\
    \ which includes code inside nested/child functions. Variables defined in the\
    \ global scope can be accessed from anywhere because it is the highest level/last\
    \ stop in the scope chain.\n\nExamine the code below and make sure you understand\
    \ that each declaration foo is unique because each one of scope.\n\nlive code:\
    \ http://jsfiddle.net/javascriptenlightenment/RNLM3/\n\n```\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\nvar foo = 0; // global scope\nconsole.log(foo);\
    \ // logs 0\n\nvar myFunction = function() {\n  var foo = 1; // local scope\n\
    \  console.log(foo); // logs 1\n\n  var nestedFunction = function() {\n    var\
    \ foo = 2; // local scope\n    console.log(foo); // logs 2\n  }\n};\n\neval('var\
    \ foo = 3; console.log(foo)'); // eval scope\n</script></body></html>\n```\n\n\
    Make sure you understand that each foo variable contains a different value because\
    \ each one is defined in a specifically delineated scope."
