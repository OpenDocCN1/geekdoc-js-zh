  - "[PAGE 91]\n\n# Chapter 7 - Scope & Closures\n\n# Conceptual overview of JavaScript\
    \ scope\n\nIn JavaScript, scope is the context in which code is executed, and\
    \ there are three types of scope: global scope, local scope (sometimes referred\
    \ to as \"function scope\"), and eval scope.\n\nCode defined using var inside\
    \ of a function is locally scoped, and is only \"visible\" to other expressions\
    \ in that function, which includes code inside nested/child functions. Variables\
    \ defined in the global scope can be accessed from anywhere because it is the\
    \ highest level/last stop in the scope chain.\n\nExamine the code below and make\
    \ sure you understand that each declaration foo is unique because each one of\
    \ scope.\n\nlive code: http://jsfiddle.net/javascriptenlightenment/RNLM3/\n\n\
    ```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar foo = 0; // global scope\n\
    console.log(foo); // logs 0\n\nvar myFunction = function() {\n  var foo = 1; //\
    \ local scope\n  console.log(foo); // logs 1\n\n  var nestedFunction = function()\
    \ {\n    var foo = 2; // local scope\n    console.log(foo); // logs 2\n  }\n};\n\
    \neval('var foo = 3; console.log(foo)'); // eval scope\n</script></body></html>\n\
    ```\n\nMake sure you understand that each foo variable contains a different value\
    \ because each one is defined in a specifically delineated scope."
  - "[PAGE 92]\n\n* An unlimited number of function and eval scopes can be created,\
    \ while only one global scope is used by a JavaScript environment.\n\n- The global\
    \ scope is the last stop in the scope chain.\n\n* Functions that contain functions\
    \ create stacked execution scopes. These stacks which are chained together are\
    \ often referred to the scope chain.\n\n# JavaScript does not have block scope\n\
    \nSince logic statements (e.g. if) and looping statements (e.g. for) do not create\
    \ a scope, variables can overwrite each other. Examine the code below and make\
    \ sure you understand that the value of foo is redefined as the program executes\
    \ the code.\n\n> live code: http://jsfiddle.net/javascriptenenment/Wn9p6/\n\n\
    ```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar foo = 1; // foo =\
    \ 1\n\nif (true) {\n  foo = 2; // foo = 2\nfor(var i = 3; i <= 5; i++) {\n   \
    \ foo = i; // foo = 3,4, then 5\n    console.log(foo); // logs 3,4,5\n  }\n}\n\
    \n</script></body></html>\n```\n\nfoo is changing as the code executes because\
    \ JavaScript has no block scope — only function, global, or eval scope.\n\n# Use\
    \ var inside of functions to declare variables and avoid scope gotchas\n\nJavaScript\
    \ will declare any variables lacking a var declaration (even those contained in\
    \ a function or encapsulated functions) to be in the global scope instead of the\
    \ intended local scope. Have a look at"
  - "[PAGE 93]\n\nthe code below and notice without the use of var bar, the variable\
