  mdcn: "\n\n实时代码: http://jsfiddle.net/javascriptlightenment/4TEtb/\n\n```\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\n// 传递给 Boolean 的参数 = 0 = false，因此 foo\
    \ = false\nvar foo = new Boolean(0)\nconsole.log(foo);\n\n// 传递给 Boolean() 的参数\
    \ = Math = true，因此 bar = true\nvar bar = new Boolean(Math)\nconsole.log(bar);\n\
    \n</script></body></html>\n```\n\n# 注意事项\n\n- 使用 `new` 关键字来自 `Boolean()` 构造函数的实例会产生实际复杂的对象。你应该避免使用\
    \ `Boolean()` 构造函数处理值（应使用字面量/原始数字），因为存在与 `typeof` 运算符相关的潜在问题。`typeof` 运算符会将布尔对象报告为\
    \ 'object'，而不是你预期的原始类型标签（'boolean'）。此外，使用字面量/原始值编写速度更快。\n\n# Boolean() 属性和方法\n\
    \nBoolean() 对象具有以下属性：\n\n属性（例如 Boolean.prototype）：\n\n- * prototype\n\n# Boolean\
    \ 对象实例属性和方法\n\nBoolean 对象实例具有以下属性和方法（不包括继承的属性和方法）：\n\n实例属性（例如 var myBoolean =\
    \ false; myBoolean.constructor）：\n\n- * constructor\n\n实例方法（例如 var myNumber =\
    \ false; myBoolean.toString()）：\n\n- * toSource()\n- * toString()\n- * valueOf()\n\
    \n# 非原始假布尔对象转换为 true\n\n由 `Boolean()` 构造函数创建的假对象（相对于原始值）是一个对象，而对象会转换为 true。通过\
    \ `Boolean()` 构造函数创建假布尔对象时，值本身会转换为 true。下面，我将演示假布尔对象始终是“真值”（truthy）。\n\n```\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar falseValue = new Boolean(false);\n\
    \nconsole.log(falseValue); // 我们有一个假布尔对象，但对象是真值\n\nif (falseValue) { // 布尔对象、假布尔对象都是真\n\
    \    console.log(`falseValue is truthy`);\n}\n\n</script></body></html>\n```\n\
    \n如果你需要将非布尔值转换为布尔值，只需使用不带 `new` 关键字的 `Boolean()` 构造函数，返回的值将是原始值而不是布尔对象。\n\n# 某些值为假，其余所有均为真\n\
    \n之前已经提到，但由于转换的原因值得再次提到。如果一个值是 0、-0、null、false、NaN、undefined 或空字符串(\"\")\"),它就是假的。JavaScript\
    \ 中除上述值之外的任何值在布尔语文中使用（例如 `if (true){}`）都会被转换为 true。\n\n```\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\n// 这些所有都返回假布尔值\nconsole.log(Boolean(0));\nconsole.log(Boolean(-0));\n\
    ```\n\n```\nconsole.log(Boolean(null));\nconsole.log(Boolean(false));\nconsole.log(Boolean(''));\n\
    console.log(Boolean(undefined));\nconsole.log(Boolean(null));\n\n// 这些所有都返回真布尔值\n\
    console.log(Boolean(1789));\nconsole.log(Boolean('false')); // 字符串 'false' 不是布尔值\n\
    console.log(Boolean(Math));\nconsole.log(Boolean(Array()));\n\n<script></body></html>\n\
    ```\n\n理解哪些 JavaScript 值会被还原为假至关重要，这样你就会知道其他值都被视为真。\n\n# 处理原始字符串、数字和布尔值\n\n# 当访问属性时，原始/字面量值转换为对象\n\
    \n不要对字符串、数字和布尔字面量可以像带有属性的对象一样处理（`true.toString()`）这一事实感到困惑。当这些原始值通过尝试访问属性被当作对象处理时，JavaScript\
    \ 将从原始值关联的构造函数创建一个包装对象，以便可以访问包装对象的属性和方法。一旦访问了属性，包装对象就会被丢。这种转换允许我们编写代码，使得原始值看起来真的是对象。说实话，当在代码中被当作对象时，JavaScript\
    \ 会将其转换为对象以便属性访问，并在返回后转换回原始值。这里需要了解的是，以及 JavaScript 在后台为你做了什么。\n\n字符串：\n\n实时代码:\
    \ http://jsfiddle.net/javascriptenlight/kpfNk/\n\n```\n<!DOCTYPE html><html lang=\"\
    en\"><script>\n// 字符串对象被当作对象\nvar stringObject = new String('foo');\nconsole.log(stringObject.length);\
