    # Instances inherit properties from prototype will always get the latest values


    The prototype property is dynamic in the sense that instances will always get
    the latest value from the prototype, regardless of when it was instantiated, changed,
    or appended. In the code below, we create a Foo constructor, add the property
    x to the prototype, and create an instance of Foo() named FooInstance. Next, we
    log the value of x. Then we update the prototype''s value of x and log it again
    to find that our instance has access to the latest value found in the prototype
    object.


    ```

    <DOCTYPE html>html lang="en"><body><script>


    var Foo = function Foo();


    Foo.prototype.x = 1;


    var FooInstance = new Foo();


    console.log(FooInstance.x); // logs 1


    Foo.prototype.x = 2;


    console.log(FooInstance.x); // logs 2, the FooInstance was updated


    </script></body></html>

    ```


    Given how lookup chain works, this behavior should not be that surprising. If
    you are wondering this works the same, regardless of whether you use the default
    prototype object or override it with your own. Here I replace the default prototype
    object to demonstrate this fact:'
