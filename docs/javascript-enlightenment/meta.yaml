    \ sayHiText from the func2 function scope.\n\nlive code: http://jsfiddle.net/javascriptlightenment/2CNW7/\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar sayHiText = 'howdy';\n\
