    \ boo = function() {\n    bar = 2; // no var used, bar is placed in the global\
    \ scope at window.bar\n  }\n}\n\nconsole.log(bar); // logs 2, because bar is in\
    \ the global scope\n\n// As opposed to...\nvar foo = function() {\n  var boo =\
    \ function() {\n    var doo = 2;\n  }\n}\n\n// console.log(doo); // logs undefined,\
    \ doo is in the boo function scope, error occurs\n</script></body></html>\n```\n\
    \nThe take away here is that you should always use var when defining variables\
    \ inside of a function. This will prevent you from dealing with potentially confusing\
    \ scope problems. The exception to this convention, of course, is when you want\
    \ to create or change properties in the global scope from within a function.\n\
    \n# The scope chain (aka lexical scoping)\n\nThere is a lookup chain that is followed\
    \ when JavaScript looks for the value associated with a variable. This chain is\
