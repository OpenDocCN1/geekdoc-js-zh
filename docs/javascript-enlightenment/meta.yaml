    JavaScript is really just a language that is pre-packaged with a few native constructors
    used to produce complex objects which express a very specific type of value (e.g.
    numbers, strings, functions, object, arrays...) as well as the raw materials via
    Function() objects for crafting user-defined object constructors (e.g. Person()).
