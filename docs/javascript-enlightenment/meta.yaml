- md: "\nwhen you need more functionality than is provided by JavaScript 1.5. Underscore.js\
    \ provides the following functionality when dealing with objects.\n\nThese functions\
    \ work on all objects and arrays:\n\n- each()\n- map()\n- reduce()\n- reduceRight()\n\
    - detect()\n- select()\n- reject()\n- all()\n- any()\n- include()\n- invoke()\n\
    - pluck()\n- max()\n- min()\n- sortBy()\n- sortIndex()\n- toArray()\n- size()\n\
    \nThese functions work on all objects:\n\n- keys()\n- values()\n- functions()\n\
    - extend()\n- clone()\n- tap()\n- isEqual()\n- isEmpty()\n- isElement()\n- isArray()\n\
    - isArguments()\n- isFunction()\n- isString()\n\n- isNumber\n- isBoolean\n- isDate\n\
    - isRegExp\n- isNaN\n- isNull\n- isUndefined\n\nI like this library because it\
    \ takes advantage of the new native additions to JavaScript where browsers support\
    \ them, but also provides the same functionality to browsers that do not, all,\
    \ without changing the native implementation of JavaScript unless it has to.\n\
    \n## Notes\n\n- Before you start to use Underscore.js, make sure the functionality\
    \ you need is not already provided by a JavaScript library or framework that might\
    \ already be in use in your code.\n\n## Chapter 3 - Object()\n\n## Conceptual\
    \ overview of using Object() objects\n\nUsing the built-in Object() constructor\
    \ function, we can create generic empty objects on the fly. In fact, if you remember\
    \ back to the beginning of Chapter 1, this is exactly what we did by creating\
    \ the cody object. Let's re-create the cody object.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_56_0.png)\n\
    \n```\n<!DOCTYPE html lang=\"en\"><body><script>\nvar cody = new Object(); //\
    \ create an empty object with no properties\n\nfor (key in cody) { // confirm\
    \ that cody is an empty generic object\nif(cody.hasOwnProperty(key)) {\n  console.log(key);\
    \ // should not see any logs, because cody itself has no properties\n}\n}\n</script></body></html>\n\
    ```\n\nHere, all we are doing is the Object() constructor function to create a\
    \ generic object called cody. You can think of the Object() constructor as a cookie\
    \ cutter for creating empty objects that have no predefined properties or methods\
    \ (except, of course, those inherited from the prototype chain).\n\n## Notes\n\
    \n- If it's not obvious, the Object() constructor is an object itself. That is,\
    \ the function is based on an object created from the Function constructor. This\
    \ can be confusing. Just remember like the Array constructor, the Object constructor\
    \ simply puts blank objects. And, you can create all the empty objects you like.\
    \ However, creating an empty object like cody is very different than creating\
    \ your own constructor function with predefined properties. Make sure that cody\
    \ is just an empty object based on the Object() constructor. To harness the power\
    \ of JavaScript, you will need to grow not how to create empty object containers\
    \ from Object(), but also how to build your own \"class\" of objects (e.g. Person())\
    \ which the Object() constructor function itself.\n\n## Object() parameters\n\n\
    The Object() constructor takes one optional parameter. That parameter is the value\
    \ you would like to create. If you provide no parameter, then a null or undefined\
    \ value will be assumed.\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \n// create an empty object with no properties\nvar cod1 = new Object();\nvar\
    \ cod2 = new Object(undefined);\nvar cod3 = new Object(null);\n\nconsole.log(typeof\
    \ cod1, typeof cod2, typeof cod3); // logs 'object object object'\n\n</script></body></html>\n\
    ```\n\nIf a base value null or undefined is passed to the Object constructor,\
    \ the value will be created as an object. Theoretically, we can use the Object()\
    \ constructor to create any of the other native objects that we have a constructor.\
    \ I do just that.\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\n\
    /* Use Object() constructor to create a string, number, array, function, boolean,\
    \ and regex object. */\n\n// logs below confirm object creation\nconsole.log(new\
    \ Object('foo'));\nconsole.log(new Object(1));\nconsole.log(new Object({}));\n\
    console.log(new Object(function () {}));\nconsole.log(new Object(true));\nconsole.log(new\
    \ Object('/[bt-z]+/b/));\n\n/* Creating a string, number, array, function, boolean,\
    \ and regex object instance via the Object() constructor is rarely never done.\
    \ I am just demonstrating that it can be done */\n\n</script></body></html>\n\
    ```\n\n## Object() properties and methods\n\nThe Object() object has the following\
    \ properties (not including inherited properties and methods):\n\nProperties (e.g.\
    \ Object.prototype):\n\n- prototype\n\n## Object() object instance properties\
    \ and methods\n\nObject() object instances have the following properties and methods\
    \ (does not include inherited properties and methods):\n\nInstance Properties\
    \ (e.g. var myObject = {}; myObject.constructor;):\n\n- constructor\n\nInstance\
    \ Methods (e.g. var myObject = {}; myObject.toString();):\n\n- hasOwnProperty()\n\
    - isPrototypeOf()\n- propertyIsEnumerable()\n- toLocaleString()\n- toString()\n\
    - valueOf()\n\n> Notes\n- The prototype chain ends with Object.prototype and thus\
    \ all of the properties and methods of Object() (shown above) are inherited by\
    \ all JavaScript objects.\n\n## Creating Object() objects using literals\n\nLiteral\
    \ notation entails instantiating an object with braces. Remember back to the beginning\
    \ of Chapter 1, where we created the cody object using dot notation. Literal notation\
    \ gives us the ability to create objects, including defined properties, with less\
    \ code. This is actually the preferred syntax for creating objects in JavaScript\
    \ because of its terseness and readability.\n\n```javascript\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\nvar cody = {\nliving: true,\nage: 23,\ngender:\
    \ 'male',\ngetGender: function() {return cody.gender}\n};\n\nconsole.log(cody);\
    \ // logs cody object and properties\n\n</script></body></html\n```\n\nYou should\
    \ be aware that property names can also be specified as strings:\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_59_0.png)\n\
    \n```javascript\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar cody =\
    \ {\nliving: true,\nage: 23,\ngender: 'male',\ngetGender: function() {return cody.gender};\n\
    };\n// notice the last property has no comma\n\nconsole.log(cody); // logs cody\
    \ object and properties\n\n</script></body>\n```\n\nIt's not necessary to specify\
    \ properties as strings unless the property name:\n\n- is one of the reserved\
    \ keywords (e.g. class)\n- contains spaces or special characters (anything other\
    \ than numbers, letters, the dollar sign ($) or the underscore (_))\n- starts\
    \ with a number\n\n## Notes\n\n- Careful! The last property of an object should\
    \ not have a trailing comma. This will cause an error in some JavaScript environments.\n\
    \n## All objects inherit from Object.prototype\n\nThe Object() constructor function\
    \ in JavaScript is, as its prototype property is the last stop in the prototype\
    \ chain.\n\nBelow, I augment the Object.prototype with a foo property, then create\
    \ a string and attempt to access the foo property as if it were property of the\
    \ string instance. since myString instance does not have a foo property, the prototype\
    \ chain in and the value is looked for String.prototype. It is not there, the\
    \ next place to look is Object.prototype, which is the final location JavaScript\
    \ will look for an object value. The foo value is found because I added it, then\
    \ it returns the value of foo.\n\n```javascript\n<!DOCTYPE html><html lang=\"\
    en\"><body><script>\n\nObject.prototype.foo = 'foo';\n\nvar myString = 'bar';\n\
    \n// logs 'foo', being found at Object.prototype.foo via prototype chain\nconsole.log(myString.foo);\n\
    \n</script></body></html>\n```\n"
  mdcn: "\n当你需要比 JavaScript 1.5 提供的更多功能时，Underscore.js 在处理对象时提供了以下功能。\n\n这些函数适用于所有对象和数组：\n\
    \n- each()\n- map()\n- reduce()\n- reduceRight()\n- detect()\n- select()\n- reject()\n\
    - all()\n- any()\n- include()\n- invoke()\n- pluck()\n- max()\n- min()\n- sortBy()\n\
    - sortIndex()\n- toArray()\n- size()\n\n这些函数适用于所有对象：\n\n- keys()\n- values()\n\
    - functions()\n- extend()\n- clone()\n- tap()\n- isEqual()\n- isEmpty()\n- isElement()\n\
    - isArray()\n- isArguments()\n- isFunction()\n- isString()\n\n- isNumber\n- isBoolean\n\
    - isDate\n- isRegExp\n- isNaN\n- isNull\n- isUndefined\n\n我喜欢这个库，因为它在浏览器支持时利用了\
    \ JavaScript 的新原生特性，但同时也为不支持特性的浏览器提供了相同的功能，且在非必要的情况下绝不会修改 JavaScript 的原生实现。\n\n\
    ## Notes\n\n- 在开始使用 Underscore.js 之前，请确保你所需的功能尚未由代码中可能使用的 JavaScript 库或框架提供。\n\
    \n## 第3章 - Object()\n\n## 使用 Object() 对象的概念概述\n\n使用内置的 `Object()` 构造函数，我们可以动态创建通用的空对象。事实上，如果你记得第\
    \ 1 章的开头，这正是我们创建 `cody` 对象时所做的。让我们重新创建 `cody` 对象。\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_56_0.png)\n\
    \n```\n<!DOCTYPE html lang=\"en\"><body><script>\nvar cody = new Object(); //\
    \ 创建一个没有任何属性的空对象\n\nfor (key in cody) { // 确认 cody 是一个空通用对象\nif(cody.hasOwnProperty(key))\
    \ {\n  console.log(key); // 不应该看到任何日志，因为 cody 本身没有属性\n}\n}\n</script></body></html>\n\
    ```\n\n在这里，我们只是使用 `Object()` 构造函数创建一个名为 cody 的通用对象。你可以将 `Object()` 构造函数比作用于创建没有预定义属性或方法的空对象的模具（当然，除了那些继承自原型链的属性）。\n\
    \n## Notes\n\n- 如果你不显而易见，`Object()` 构造函数本身就是一个对象。也就是说，该函数是基于从 `Function` 构造函数创建的对象。这可能会令人困惑。只需记住像\
    \ `Array` 构造函数一样，`Object` 构造函数只是放置空对象。你可以创建任何你喜欢的空对象。然而，创建一个像 cody 这样的空对象与你创建一个带有预定义属性的自定义构造函数是完全不同的。确保\
    \ cody 只是基于 `Object()` 构造函数的空对象。为了利用 JavaScript 的力量，你不仅需要学会如何从 `Object()` 创建空对象容器，还需要学会如何构建自己的对象“类”（例如\
    \ `Person()`），而不是只有 `Object()` 构造函数本身。\n\n## Object() 参数\n\n`Object()` 构造函数接受一个可选参数。该参数是你想要创建的值。如果你不提供参数，则将假设为\
    \ `null` 或 `undefined` 值。\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \n// 创建一个没有任何属性的空对象\nvar cod1 = new Object();\nvar cod2 = new Object(undefined);\n\
    var cod3 = new Object(null);\n\nconsole.log(typeof cod1, typeof cod2, typeof cod3);\
    \ // 记录 'object object object'\n\n</script></body></html>\n```\n\n如果将基值 `null`\
    \ 或 `undefined` 传递给 `Object` 构造函数，值将作为对象被创建。理论上，我们可以使用 `Object()` 构造函数来创建任何其他我们拥有构造函数的原生对象。我正是这么做的。\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\n/* 使用 Object() 构造函数创建字符串、数字、数组、函数、布尔和正则对象。\
    \ */\n\n// 下方的日志确认了对象的创建\nconsole.log(new Object('foo'));\nconsole.log(new Object(1));\n\
    console.log(new Object({}));\nconsole.log(new Object(function () {}));\nconsole.log(new\
    \ Object(true));\nconsole.log(new Object('/[bt-z]+/b/));\n\n/* 通过 Object() 构造函数创建字符串、数字、数组、函数、布尔和正则对象实例是极少见的。我只是在演示这是可以的\
    \ */\n\n</script></body></html>\n```\n\n## Object() 属性和方法\n\n`Object()` 对象具有以下属性（不包括继承的属性和方法）：\n\
    \n属性（例如 Object.prototype）：\n\n- prototype\n\n## Object() 对象实例属性和方法\n\n`Object()`\
    \ 对象的实例具有以下属性和方法（不包括继承的属性和方法）：\n\n实例属性（例如 `var myObject = {}; myObject.constructor;`）：\n\
    \n- constructor\n\n实例方法（例如 `var myObject = {}; myObject.toString();`）：\n\n- hasOwnProperty()\n\
    - isPrototypeOf()\n- propertyIsEnumerable()\n- toLocaleString()\n- toString()\n\
    - valueOf()\n\n> Notes\n- 原型链以 `Object.prototype` 结束，因此 `Object()` 的所有属性和方法（如上所示）都被所有\
    \ JavaScript 对象继承。\n\n## 使用字面量创建 Object() 对象\n\n字面量表示法意味着使用大括号实例化对象。回想第 1 章的开头，我们使用点符号法创建了\
    \ `cody` 对象。字面量法赋予了我们用更短代码创建包含定义属性的对象的能力。这实际上是 JavaScript 中创建对象的首选语法，因为其简洁且易读。\n\
    \n```javascript\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar cody =\
    \ {\nliving: true,\nage: 23,\ngender: 'male',\ngetGender: function() {return cody.gender}\n\
    };\n\nconsole.log(cody); // 记录 cody 对象和属性\n\n</script></body></html\n```\n\n你应该意识到属性名也可以作为字符串指定：\n\
    \n![](img/ad11d036d555f7d1771aeb8c30e67ba2_59_0.png)\n\n```javascript\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\n\nvar cody = {\nliving: true,\nage: 23,\n\
    gender: 'male',\ngetGender: function() {return cody.gender};\n};\n// 注意最后一个属性没有逗号\n\
    \nconsole.log(cody); // 记录 cody 对象和属性\n\n</script></body>\n```\n\n除非属性名满足以下条件，否则没有必要将属性指定为字符串：\n\
    \n- 是保留关键字之一（例如 `class`）\n- 包含空格或特殊字符（数字、字母、美元符号 ($) 或下线 (_)以外的任何字符）\n- 以数字开头\n\
    \n## Notes\n\n- 注意！对象的最后一个属性不应有逗号。这在某些 JavaScript 环境会导致错误。\n\n## 所有对象都继承自 Object.prototype\n\
    \nJavaScript 中的 `Object()` 构造函数通过 `prototype` 属性是原型链的终点。\n\n下面，我为 `Object.prototype`\
    \ 增加了一个 `foo` 属性，然后创建一个字符串并尝试访问 `foo` 属性，仿佛它是字符串实例的属性。由于 `myString` 实例没有 `foo`\
    \ 属性，原型链开始查找 `String.prototype`。那里没有，下一个查找位置是 `Object.prototype`，这是 JavaScript\
    \ 查找对象值的最终位置。找到了 `foo` 值是因为我添加了它，然后返回 `foo` 的值。\n\n```javascript\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\nObject.prototype.foo = 'foo';\n\nvar myString\
    \ = 'bar';\n\n// 通过原型链在 Object.prototype.foo 找到，记录 'foo'\nconsole.log(myString.foo);\n\
    \n</script></body></html>\n```\n"
