  md: "When function is invoked with the new keyword, the value of this — as it's\
    \ stated the constructor refers to the instance itself. Said another way: in the\
    \ constructor function, we can leverage the object via this before the object\
    \ is actually created. In this, the default value of this changes in a way unlike\
    \ using call() or apply().\n\nBelow, we set up a Person constructor function that\
    \ uses this to reference an object being created. When an instance of Person is\
    \ created, this.name will reference the newly created object and place a property\
    \ called name in the new object with a value from the parameter (name) passed\
    \ to the constructor function.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_88_0.png)\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar Person = function(name)\
    \ {\n  this.name = name || 'john doe'; // this will refer to the instance created\n\
    }\n\nvar cody = new Person('Cody Lindley'); // create an instance, based on Person\
    \ constructor\nconsole.log(cody.name); // logs Cody Lindley\n</script></body></html>\n\
    ```\n\nAgain, this refers to the \"object that is to be\" when the constructor\
    \ function is invoked using the new keyword. We had not used the new keyword,\
    \ the value of this would be the context in which Person is invoked — in this\
    \ case the head object. Let's examine this scenario.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_88_1.png)\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar Person = function(name)\
    \ {\n  this.name = name || 'john doe';\n}\n\nvar cody = Person('Cody Lindley');\
    \ // notice we did not use 'new'\nconsole.log(cody.name); // undefined, the value\
    \ is actually set at window.name\n\nconsole.log(window.name); // logs 'Cody Lindley'\n\
    </script></body></html>\n```"
