    # # Chapter 5 - The Head/Global Object


    # ## Conceptual overview of the head object


    JavaScript code, itself, must be contained within an object. As an example, crafting
    JavaScript code for a web browser environment, JavaScript is contained and executed
    within the window object. This window object is considered to be the "head object,"
    or sometimes confusingly referred to as "the global object." All implementations
    of JavaScript require the use of a single head object.


    The head object is set up JavaScript behind the scenes to encapsulate user-defined
    code and to house the native code with JavaScript comes prepackaged. User-defined
    code is placed by JavaScript inside the head object for execution. Let''s verify
    this as it pertains to a web browser.


    Below, I am creating JavaScript values and verifying the values are placed in
    the head object.


    ```

    <!DOCTYPE html> lang="en"><body><script>


    var myString = ''myString'';

    var myFunction = function() {};

    var myString = ''myString'';

    var myFunction = function() {};


    console.log(''myStringVar'' in window); // returns true

    console.log(''myFunctionVar'' in window); // returns true

    console.log(''myString'' in window); // returns true

    console.log(''myFunction'' in window); // returns true


    </script></body></html>

    ```


    You should be aware that when you write JavaScript, it will be written in the
    context of the head object. The remaining material in this chapter assumes you
    are aware that the term "head object" is synonymous with "global object."


