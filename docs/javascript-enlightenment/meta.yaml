    # Using hasOwnProperty, verify that an object property is not from the prototype
    chain


    While the in operator can check for properties of an object, including properties
    from the prototype chain, the hasOwnProperty method can check an object for a
    property that is not from the prototype chain.


    Below, we want to know if myArray contains the property foo, and that it is not
    inheriting the property from the prototype chain. To do this, we ask if myObject
    has its property called foo.


    ```

    <!DOCTYPE html><html lang="en"><script>


    var myObject = {foo: ''value''};


    console.log(myObject.hasOwnProperty(''foo'')) // logs tree


    // vs. a property from the prototype chain

    console.log(myObject.hasOwnProperty(''toString'')); // logs false


    </script></body></html>

    ```


    The hasOwnProperty method should be leveraged when you need to determine whether
    a property is local to an object or inherited from the prototype chain.


    # Checking if an object contains a given property using the in operator


    The in operator is used to verify (true or false) if an object contains a given
    property. Below, we are checking to see if foo is a property in myObject.'
