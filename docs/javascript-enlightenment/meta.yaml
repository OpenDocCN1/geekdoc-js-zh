    \ // logs false\n\n<script></body></html>\n```\n\n不，它确实。我的 `myArray` 可以访问 `join()`\
    \ 方法，就像它是它自己的属性一样。这里发生了什么？嗯，你观察到了原型链的作用。我们访问了一个属性，虽然该属性没有包含在 `myArray` 对象中，但 JavaScript可以在其他地方找到它。那个地方非常特殊。`Array()`\
    \ 构造函数是由 JavaScript 创建的，而 `join()` 方法（以及其他方法）被作为 `Array()` 原型的属性添加的。\n\n重申一下，如果你尝试访问一个不包含该属性的对象的属性，JavaScript\
    \ 将在原型链中搜索该值。首先，它会查看创建该对象的构造函数（例如 `Array`），并检查原型（例如 `Array.prototype`）以查看是否可以找到该属性。如果第一个原型没有该属性，JavaScript\
    \ 将继续沿链向上查找，直到初始构造函数之前。它可以一直持续到链的末端。\n\n链在何结束？让我们再次检查这个示例，在 `myArray` 上调用 `toString()`\
    \ 方法。\n\n> live code: http://jsfiddle.net/javascriptenenment/vwMe/\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n\n// Array & Array.prototype\
    \ 不包含 toString() 方法\nvar myArray = ['foo', 'bar'];\n\n// toString() 实际上定义在 Object.prototype.toString()\
    \ 上\nconsole.log(myArray.toString()); // logs `foo,bar`\n\n</script></body></html>\n\
    ```\n\n`toString()` 方法没有定义在 `myArray` 对象内部。因此，触发了原型链规则，JavaScript 在 `Array` 构造函数的原型属性（例如\
    \ `Array.prototype`）中查找该属性。那里没有，所以触发了链，我们在 `Object()` 原型属性（`Object.prototype`）中查找该属性。是的，找到了。如果没找到，JavaScript\
    \ 将产生一个错误，说明该属性未定义。\n\n由于所有原型属性都是对象，链的最后一个环节是 `Object.prototype`。没有其他构造函数原型属性可以被检查。\n\
    \n有一整章章节专门将原型链拆分为更小的部分，所以如果你完全没有理解，请阅读该章节并回到这个解释以巩固你的理解。通过这段关于主题的简短阅读，我希望你理解当找不到属性（并被视为\
    \ undefined）时，JavaScript 将查看多个原型对象以确定该属性是未定义的。查找总是会发生，而这个查找过程就是 JavaScript 处理继承的方式，就像属性查找一样简单。\n\
    \n# 使用 hasOwnProperty 验证对象属性不是来自原型链\n\n虽然 `in` 运算符可以检查对象的属性，包括来自原型链的属性，但 `hasOwnProperty`\
    \ 方法可以检查对象的某个并非来自原型链的属性。\n\n下面，我们想知道 `myArray` 是否包含属性 `foo`，并且该属性不是从原型链继承的。为了做到这一点，我们询问\
    \ `myObject` 是否它拥有一个名为 `foo` 的属性。\n\n```html\n<!DOCTYPE html><html lang=\"en\"\
    ><script>\n\nvar myObject = {foo: 'value'};\n\nconsole.log(myObject.hasOwnProperty('foo'))\
    \ // logs true\n\n// 对比来自原型链的属性\nconsole.log(myObject.hasOwnProperty('toString'));\
    \ // logs false\n\n</script></body></html>\n```\n\n当你需要确定属性是对象局部的还是从原型链继承的时，应该利用\
    \ `hasOwnProperty` 方法。\n\n# 使用 in 运算符检查对象是否包含给定的属性\n\n`in` 运算符用于验证（真或假）对象是否包含给定的属性。下面，我们正在检查\
    \ `foo` 是否是 `myObject` 中的一个属性。\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \nvar myWeb = {foo: 'value'};\nconsole.log('foo' in myWeb); // logs true\n\n</script></body></html>\n\
    ```\n\n你应该意识到，`in` 运算符不仅检查所引对象中包含的属性，还检查该对象通过原型链继承的属性。因此，属性查找规则适用，如果该属性不在当前对象中，将在原型链上进行搜索。\n\
    \n这意味着上述代码中的 `myObject` 实际上通过原型链包含了一个 `toString` 属性方法（`Object.prototype.toString`），即使我们从没有指定过它（例如\
    \ `myObject.toString = 'foo'`）。\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \nvar myObject = {foo: 'value'};\nconsole.log('toString' in myObject); // logs\
    \ true\n\n</script></body></html>\n```\n\n在最后一个示例中，`toString` 属性字面上并不在 `myObject`\
    \ 内部。然而，它继承自 `Object.prototype`，所以 `in` 运算符得出 `myObject` 确实拥有继承的 `toString()`\
    \ 属性方法。\n\n# 使用 for in 循环枚举（遍历）对象的属性\n\n通过 `for in`，我们可以遍历对象中的每个属性。在下面的代码中，我们正在使用\
    \ `for in` 循环从 `cody` 对象中获取属性名。\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \nvar cody = {\nage : 23,\ngender : 'male'\n\nfor (var key in cody) { // key 是表示每个属性名的变量\n\
    // 避免来自原型链继承的属性\nif (cody.hasOwnProperty(key)) {\n  console.log(key);\n}\n}\n\
    </script></body></html>\n```\n\n# 注意事项\n\n- `for in` 循环有一个缺点。它会访问来自原型链继承的属性。它会包含所遍历对象的任何属性。因此，如果这不是预期的结果，我们通常需要在循环中使用一个简单的语句来确保我们只访问特定的对象。这可以通过使用\
    \ `hasOwnProperty()` 方法来实现。\n- 在循环中访问属性的顺序并不总是我们定义属性的顺序。只有可枚举的属性（即在遍历对象时可见）才会通过\
    \ `for in` 循环显示。例如，构造函数属性就不会显示。可以使用方法检查哪些属性是枚举的。\n\n# 宿对象与原生对象\n\n你应该意识到，执行 JavaScript\
    \ 的环境（例如 浏览器）通常包含所谓的宿对象。宿对象不是 ECMAScript 实现的一部分，但在执行期间可用的。当然，宿对象的可用性完全取决于宿环境提供了什么。\n\
    \n例如，宿环境中的 `window` 对象被视为宿对象。下面，我检查 `window` 的属性。\n\n> live code: http://jsfiddle.net/javascriptenen/zn4Y/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nfor (x in window)\
    \ {\nconsole.log(x); // logs window 的所有属性\n}\n</script></body></html>\n```\n\n\
    你注意到原生对象不在宿对象的列表中。浏览器区分宿对象和原生对象是非常常见的。\n\n对于 浏览器而言，最著名的宿对象是用于处理 HTML 文档的接口，称为\
    \ DOM。下面，是列出浏览器提供的 `window.document` 对象内部所有对象的方法。\n\n> live code: http://jsfiddle.net/javascriptlight/ITS7X/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nfor (x in window.document)\
    \ {\n  console.log();\n}\n</script></body></html>\n```\n\n我想让你的是，JavaScript 规范并不关心宿对象，反之亦然。\n\
    \n# 使用 Underscore.js 增强和扩展对象\n\nJavaScript 1.5 在需要认真管理和处理对象时显得欠缺。如果你在浏览器中运行 JavaScript，我想大胆地建议使用\
    \ Underscore.js。\n\n"
