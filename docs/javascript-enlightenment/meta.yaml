    \ = 'female';\ncody['getGender'] = function() { return Gender = ' ' + cody.gender;\
    \ }\n\nconsole.log(cody);\n\n</script></</body>></html>\n```\n\nBracket notation\
    \ can be very handy when you need to access property key and have to work with\
