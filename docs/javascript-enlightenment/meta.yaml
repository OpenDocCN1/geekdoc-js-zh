    \  this.living = living;\n  this.age = age;\n  this.gender = gender;\n  this.getGender\
    \ = function() {return this.gender};\n};\n\nvar cody = new Person(true, 33, 'male');\n\
    console.log(cody); // Object (living=true, age=33, gender=\"male\", ...)\n\nvar\
    \ lisa = new Person(true, 34, 'female');\nconsole.log(lisa); // Object (living=true,\
    \ age=34, gender=\"female\", ...)\n\n</script></body>></html\n```\n\n如你所见，通过传递参数和调用\
    \ `Person()` 构造函数，你可以轻松地创建大量唯一的人对象。当你需要两个或三个具有相同属性但不同值的对象时，这非常有用。正因为如此，这正是 JavaScript\
    \ 对原生对象所做的事情。`Person()` 构造函数遵循与 `Array()` 构造函数相同的原理。因此，`new Array('foo', 'bar')`\
    \ 与 `new Person(true, 33, 'male')` 没有区别。创建自己的构造函数只是使用了 JavaScript 用于其自身的原生构造函数时相同的模式。\n\
