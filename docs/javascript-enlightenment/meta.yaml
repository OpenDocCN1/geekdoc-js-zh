    \ Person('Cody Lindley'); // 根据 Person 构造函数创建一个实例\nconsole.log(cody.name); //\
    \ 打印 Cody Lindley\n</script></body></html>\n```\n\n再次，当构造函数使用 `new` 关键字调用时，它指向的是“即将要生成的对象”。如果我们没有使用\
    \ `new` 关键字，`this` 的值将是 `Person` 被调用的上下文——在这种情况下，是全局对象。让我们来看一下场景。\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_88_1.png)\n\
