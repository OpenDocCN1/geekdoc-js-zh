    \ function to the global scope, your function can still access, via the scope\
    \ chain, its parent function's scope. Below, we define a parentFunction that returns\
    \ an anonymous function, and we called the return from the global scope. Because\
    \ our anonymous function was defined as being contained inside parentFunction,\
    \ it still has access to parentFunction's scope when it is invoked. This is called\
    \ a closure.\n"
  mdcn: "\n\n});\n};\n\n<script></</body>></html>\n\n当 `sayHiText` 不在 `func2` 函数的作用范围内时，它是如何找到其值的？\n\
