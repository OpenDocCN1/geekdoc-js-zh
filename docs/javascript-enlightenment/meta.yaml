- md: "\n# Instantiating constructors using the new operator\n\nA constructor function\
    \ is basically a cookie cutter template used to create pre-configured objects.\
    \ Take String() for this example. This function, when used with the new operator\
    \ (new String('foo')) creates a string instance based on the String() template.\
    \ Let's look at an example.\n\n```\nlive code: http://jsfiddle.net/javascriptlightenment/FKdjsp/\n\
    ```\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar myString\
    \ = new String('foo');\nconsole.log(myString); // logs foo {0 = \"f\", 1 = \"\
    o\", 2 = \"o\"}\n</script></body></html>\n```\n\nAbove, we created a new string\
    \ object that is instance of the String() constructor function. Just like that,\
    \ we have a string value expressed in JavaScript.\n\n### Notes\n\n- I'm not suggesting\
    \ that you use constructors instead of their literal/primitive equivalents — like\
    \ var string=\"foo\"; I, however, suggesting that you understand what is going\
    \ on behind literal/primitive values.\n\nAs previously mentioned, the JavaScript\
    \ language has the following native constructors: Number(), String(), Boolean(),\
    \ Object(), Array(), Function(), Date(), RegExp(), Error(). We can instantiate\
    \ an object from any of these constructors by using the new operator. Below, I\
    \ construct these nine native JavaScript objects.\n\n```\nlive code: http://jsfiddle.net/javascriptlightenment/M9cWA/\n\
    ```\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n// instantiate\
    \ an instance for each native constructor using the new\nvar myNumber = new Number(23);\n\
    var myString = new String('male');\nvar myBoolean = new Boolean(false);\nvar myObject\
    \ = new Object();\nvar myArray = new Array('foo', 'bar');\nvar myFunction = new\
    \ Function(\"x\", \"y\", \"return x+y\");\nvar myDate = new Date();\nvar myRegExp\
    \ = new RegExp('[a-z]+\\b');\nvar myError = new Error('Crap!');\n\n// // verify\
    \ which constructor created the object\nconsole.log(myNumber.constructor); //\
    \ logs Number\nconsole.log(myString.constructor); // logs String\nconsole.log(myBoolean.constructor);\
    \ // logs Boolean\nconsole.log(myObject.constructor); // logs Object\nconsole.log(myArray.constructor);\
    \ // logs Array(), in modern browsers\nconsole.log(myFunction.constructor); //\
    \ logs Function\nconsole.log(myDate.constructor); // logs Date()\nconsole.log(myRegExp.constructor);\
    \ // logs RegExp()\nconsole.log(myError.constructor); // logs Error\n</script></body></html>\n\
    ```\n\nBy using the new operator, we are telling the JavaScript interpreter that\
    \ we would like above, an object that is an instance of the corresponding constructor\
    \ function. In the example above, the Date() constructor function is used to create\
    \ date objects. The Date() constructor function is a cookie cutter for date objects.\
    \ That is, it produces objects from a default pattern defined by the Date() constructor.\n\
    \nAt this point, you should be well acquainted with creating objects from native\
    \ (e.g. new String('foo')) and user-defined constructor functions (e.g. new Person(true,\
    \ 33, 'male')).\n\n### Notes\n\n- Keep in mind that Math is a static object —\
    \ a container for other methods — and is not a constructor that uses the new operator.\n\
    \n# Creating shorthand/literal values from constructors\n\nJavaScript provides\
    \ shortcuts — called \"literals\" — for manufacturing of the native object values\
    \ without having to use new Foo() or new Bar(). For the most part, the literal\
    \ syntax accomplishes the same thing as using the new operator. The exceptions\
    \ are: Number(), String(), and Boolean() — see notes below.\n\nIf you come from\
    \ other programming backgrounds, you are likely more familiar with the literal\
    \ way of creating objects. I, instantiate the native JavaScript constructors using\
    \ the new operator and create corresponding literal equivalents.\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\nvar myNumber = Number(23); //\
    \ an object\nvar myNumberLiteral = 23; // primitive number value, not an object\n\
    \nvar myString = String('male'); // an object\nvar myStringLiteral = 'male'; //\
    \ primitive string value, not an object\n\nvar myBoolean = Boolean(false); //\
    \ an object\nvar myLiteral = false; // primitive boolean value, not an object\n\
    \nvar myObject = new Object();\nvar myObjectLiteral = {};\n\nvar myArray = new\
    \ Array(['foo', 'bar']);\nvar myArrayLiteral = ['foo', 'bar'];\n\nvar myFunction\
    \ = new function(x, \"y\") { return x+y };\nvar myFunctionLiteral = function(x,\
    \ y) { return x+y };\n\nvar myRegExp = new RegExp('[a-z]+\\b');\nvar myRegExpLiteral\
    \ = /[a-z]+\\b/;\n\n// verify that literals are created from some constructor\n\
    console.log(myNumber.constructor, myNumberLiteral);\nconsole.log(myString.constructor,\
    \ myStringLiteral);\nconsole.log(myBoolean.constructor, myLiteral);\nconsole.log(myObject.constructor,\
    \ myObjectLiteral);\nconsole.log(myArray.constructor, myArrayLiteral);\nconsole.log(myFunction.constructor,\
    \ myFunctionLiteral);\nconsole.log(myRegExp.constructor, myRegExpLiteral);\n</script></body></html>\n\
    ```\n\nWhat you need to take away here is the fact that, in general, the underlying\
    \ process identical to using the `new` operator. Maybe more importantly, it's\
    \ a lot more complicated with the primitive string, number, and boolean values.\
    \ In these, literals take the characteristics of primitive values rather than\
    \ complex object. See notes below.\n\n- When using literal values for string,\
    \ number, and boolean, an actual object is never created until the value is treated\
    \ as an object. In other words, you are defining a primitive type until you use\
    \ methods or retrieve properties associated with the constructor (e.g. var foo\
    \ = 'foo'.length). When this happens, JavaScript creates a wrapper object for\
    \ the literal behind the scenes, allowing the value to be treated as an object.\
    \ This hope clarifies the misconception.\n\n# Primitive (aka simple) values\n\n\
    The JavaScript values `foo`, `true`, `false`, as well as `null` and `undefined`,\
    \ are considered primitive because they are `irreducible`. That is, a number is\
    \ a number, a string is a string, a boolean is either true or false, and `null`\
    \ and `undefined` are just that, do not represent values up of other values.\n\
    \nExamine the code below and ask yourself if string, number, `null`, and `undefined`\
    \ values could be more complex. Contrast this to what you know of `Object()` instance\
    \ or `Array()` or any complex object.\n\n> live code: http://jsfiddle.net/javascriptlightenment/xUQTC/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar myString = 'string';\n\
    var myNumber = 10;\nvar myBoolean = false; // could be true or false, but that\
    \ is it\nvar myNull = null;\nvar myUndefined = undefined;\n\nconsole.log(myString,\
    \ myNumber, myBoolean, myNull, myUndefined);\n\n/* Consider that a complex object\
    \ or array can be made up of multiple primitive values, and thus becomes a complex\
    \ set of multiple values. */\nvar myObject = {\n  myString: 'string',\n  myNumber:\
    \ 10,\n  myBoolean: false,\n  myNull: null,\n  myUndefined: undefined\n};\nconsole.log(myObject);\n\
    \nvar myArray = ['string', 10, false, null, undefined];\nconsole.log(myArray);\n\
    </script></body></html>\n```\n\nQuite simply, primitive values represent the lowest\
    \ form (i.e simplest) of datum/information available in JavaScript.\n\n### Notes\n\
    \n- As opposed to creating values with literal syntax, when a String(), Number(),\
    \ or Boolean() value is created using the new keyword, the object created is actually\
    \ a complex object.\n- It's critical that you understand the fact that the String(),\
    \ Number(), and Boolean() constructors are dual-purpose constructors used to create\
    \ literal/primitive values as well as complex values. These constructors do not\
    \ always return objects, but instead, when used without the \"new\" operator,\
    \ can return a primitive representation of the actual complex value.\n\n# The\
    \ primitive values null, undefined, \"string\", 10, true, and false are not objects\n\
    \nThe null and undefined values are trivial values that do not require a constructor\
    \ function, nor the use of the new operator to establish them as a JavaScript\
    \ value. To use null or undefined, all you do is test as if they were an object.\
    \ The remaining primitive values string, number, and boolean, while technically\
    \ returned from a constructor function, are not objects.\n\nBelow, I contrast\
    \ the difference between primitive values and the rest of the native JavaScript\
    \ objects.\n\n> live code: http://jsfiddle.net/javascriptlightenment/ZwqGoD/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n// no object is created\
    \ when producing primitive values, notice no use of the \"new\" keyword\nvar primitiveString\
    \ = \"foo\";\nvar primitiveString = String('foo');\nvar primitiveNumber1 = 10;\n\
    var primitiveNumber2 = Number('10');\nvar primitiveBoolean1 = true;\nvar primitiveBoolean2\
    \ = Boolean('true');\n\n// confirm if the type is not object\nconsole.log(typeof\
    \ primitiveString); // 'string'\nconsole.log(typeof primitiveNumber1, typeof primitiveNumber2);\
    \ // 'number,number'\nconsole.log(typeof primitiveBoolean1, typeof primitiveBoolean2);\
    \ // 'boolean,boolean'\n\n// versus the usage of a constructor and new for creating\
    \ objects\nvar myNumber = Number(23);\nvar myString = new String('male');\n</script></body></html>\n\
    ```\n"
  mdcn: "\n\n# 使用 new 运算符实例化构造函数\n\n构造函数基本上是一个用于创建预配置对象的“切饼干模具”模板。以 `String()` 为例。该函数在配合\
    \ `new` 运算符使用时（如 `new String('foo')`），会创建一个基于 `String()` 模板的字符串实例。让我们来看一个例子。\n\
    \n```\nlive code: http://jsfiddle.net/javascriptlightenment/FKdjsp/\n```\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\nvar myString = new String('foo');\n\
    console.log(myString); // logs foo {0 = \"f\", 1 = \"o\", 2 = \"o\"}\n</script></body></html>\n\
    ```\n\n上面，我们创建了一个 `String()` 构造函数实例的新字符串对象。就这样这样，我们得到了一个在 JavaScript 中表示的字符串值。\n\
    \n### Notes\n\n- 我并不是建议你使用构造函数来代替它们的字面量/原始等价物——例如 `var string=\"foo\";`。然而，我建议你理解字面量/原始值背后发生了什么。\n\
    \n如前所述，JavaScript 语言具有以下原生构造函数：`Number()`、`String()`、`Boolean()`、`Object()`、`Array()`、`Function()`、`Date()`、`RegExp()`、`Error()`。我们可以通过\
    \ `new` 运算符从这些任何构造函数实例化对象。下面，我构造了这九个原生 JavaScript 对象。\n\n```\nlive code: http://jsfiddle.net/javascriptlightenment/M9cWA/\n\
    ```\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n// 使用 new 为每个原生构造函数实例化\n\
    var myNumber = new Number(23);\nvar myString = new String('male');\nvar myBoolean\
    \ = new Boolean(false);\nvar myObject = new Object();\nvar myArray = new Array('foo',\
    \ 'bar');\nvar myFunction = new Function(\"x\", \"y\", \"return x+y\");\nvar myDate\
    \ = new Date();\nvar myRegExp = new RegExp('[a-z]+\\b');\nvar myError = new Error('Crap!');\n\
    \n// // 验证哪个构造函数创建了对象\nconsole.log(myNumber.constructor); // logs Number\nconsole.log(myString.constructor);\
    \ // logs String\nconsole.log(myBoolean.constructor); // logs Boolean\nconsole.log(myObject.constructor);\
    \ // logs Object\nconsole.log(myArray.constructor); // logs Array(), in modern\
    \ browsers\nconsole.log(myFunction.constructor); // logs Function\nconsole.log(myDate.constructor);\
    \ // logs Date()\nconsole.log(myRegExp.constructor); // logs RegExp()\nconsole.log(myError.constructor);\
    \ // logs Error\n</script></body></html>\n```\n\n通过使用 `new` 运算符，我们告诉 JavaScript\
    \ 解释器我们想要一个对应对应构造函数的实例对象。在上面的例子中，`Date()` 构造函数被用于创建日期对象。`Date()` 构造函数是日期对象的切饼模具。也就是说，它根据\
    \ `Date()` 构造函数定义的默认模式产生对象。\n\n到此时，你应该已经非常熟悉从原生构造函数（例如 `new String('foo')`）和用户定义的构造函数（例如\
    \ `new Person(true, 33, 'male')`）创建对象。\n\n### Notes\n\n- 请记住 `Math` 是一个静态对象——其他方法的容器——它不是一个使用\
    \ `new` 运算符的构造函数。\n\n# 从构造函数创建简写/字面量值\n\nJavaScript 提供了快捷方式——称为“字面量”——用于制造原生对象值，而无需使用\
    \ `new Foo()` 或 `new Bar()`。在大多数情况下，字面量语法实现的实现与使用 `new` 运算符相同。例外是：`Number()`、`String()`\
    \ 和 `Boolean()`——见下文注释。\n\n如果你来自其他编程背景，你可能更熟悉用字面量创建对象。我使用 `new` 运算符实例化原生 JavaScript\
    \ 构造函数，并创建对应的字面量等价物。\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    var myNumber = Number(23); // an object\nvar myString = String('male'); // an\
    \ object\nvar myBoolean = Boolean(false); // an object\nvar myObject = new Object();\
    \ // an object\nvar myArray = new Array('foo', 'bar'); // an object\nvar myFunction\
    \ = new Function(\"x\", \"y\", \"return x+y\"); // an object\nvar myDate = new\
    \ Date(); // an object\nvar myRegExp = new RegExp('[a-z]+\\b'); // an object\n\
    var myError = new Error('Crap!'); // an object\n\n// 字面量形式\nvar myNumberLiteral\
    \ = 23; // primitive value\nvar myStringLiteral = 'male'; // primitive string\n\
    var myBooleanLiteral = false; // primitive boolean\nvar myObjectLiteral = {};\
    \ // primitive object\nvar myArrayLiteral = ['foo', 'bar']; // primitive array\n\
    var myFunctionLiteral = function(x, y) { return x+y }; // primitive function\n\
    var myDateLiteral = new Date(); // primitive date\nvar myRegExpLiteral = /[a-z]+\\\
