    </script></body></html>\n```\n\nThe good news is that this will be fixed in ECMAScript\
    \ 5. For now, you should be aware of this predicament, especially when you start\
    \ functions around as values to other functions.\n\nConsider the code below and\
    \ what happens when passing an anonymous function to foo.func1. When the anonymous\
    \ function is called foo.func1 (a function inside of another function) the value\
    \ inside of the anonymous function will be a reference to the head object.\n\n\
    ```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar foo = {\n func1:function(bar)\
    \ {\n  bar(); // logs window, not foo\n console.log(this); // this keyword here\
    \ will be a reference to foo object\n }\n}\nfoo.func1(function(){console.log(this)});\n\
    </script></body></html>\n```\n\nNow you will never forget: this value will always\
    \ be a reference to the head object when its function is encapsulated inside of\
    \ another function or invoked within the context of another function (again, this\
    \ is fixed in ECMAScript 5)."
