    # Chapter 12 - Boolean()


    # Conceptual overview of using the Boolean() object


    The Boolean() constructor function can be used to create boolean objects, as well
    as boolean primitive values, that represent either a true or a false value.


    In the code below, I detail the creation of boolean values in JavaScript.


    ```

    <!DOCTYPE html lang="en"><script>

    // create boolean object using the new keyword and the Boolean() constructor

    var myBoolean1 = new Boolean(false); // using new keyword

    console.log(typeof myBoolean1); // logs ''object''


    // create boolean literal/primitive by directly using the number constructor without

    var myBoolean2 = Boolean(0) // without new keyword

    console.log(typeof myBoolean2); // logs ''boolean''


    // create boolean literal/primitive (constructor leveraged behind the scene)

    var myBoolean3 = false;

    console.log(typeof myBoolean3); // logs ''boolean''

    console.log(typeof myBoolean1, myBoolean2, myBoolean3); // logs false false false


    </script></body></html>

    ```


    # Boolean() parameters


    The Boolean() constructor function takes one parameter to be converted to a boolean
    value (i.e. true or false). Any valid JavaScript value that is not 0, -0, null,
    false, NaN, undefined, or an empty string (""), will be converted to true. Below,
    we create boolean object values. One true one false.'
