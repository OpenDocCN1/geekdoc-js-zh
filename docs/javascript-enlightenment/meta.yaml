    \ // 注意我们没有使用 'new'\nconsole.log(cody.name); // undefined，值实际上设置在 window.name\
    \ 上\n\nconsole.log(window.name); // 打印 'Cody Lindley'\n</script></body></html>\n\
    ```\n\n# 原型方法中的关键字 this 指向构造函数实例\n\n当用于添加到构造函数 `prototype` 属性的函数时，`this` 指向调用方法的实例。假设我们有一个自定义的\
    \ `Person()` 构造函数。作为参数，它需要 `Person` 的全名。如果我们需要这个人的全名，我们在 `Person.prototype` 上添加一个\
    \ `whatMyFullName` 方法，以便所有的 `Person` 实例都能继承该方法。使用 `this` 时，该方法可以引用调用实例（以及它的属性）。\n\
    \n在这里我演示了两个 `Person` 对象（cody 和 lisa）的创建，以及包含 `this` 关键字以访问实例的继承自 `whatMyFullName`\
    \ 方法。\n\n在线代码：http://jsfiddle.net/javascriptenlight/uV3sP/\n\n```\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\nvar Person = function(x){\n  if(this.fullName =\
    \ x);\n}\n\nPerson.prototype.whatMyFullName = function(){\n  return this.fullName;\
    \ // 'this' 指向从 Person 创建的实例\n}\n\nvar cody = new Person('cody lindley');\nvar\
    \ lisa = new Person('lisa lindley');\n\n// 调用继承的 whatMyFullName 方法，该方法使用 this\
    \ 来引用实例\nconsole.log(cody.whatMyFullName(), lisa.whatMyFullName());\n\n/* 原型链仍然有效，因此如果实例没有\
