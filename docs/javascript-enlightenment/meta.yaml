  - '[PAGE 133]


    # Chapter 14 - Undefined


    # Conceptual overview of the undefined value


    The undefined value is used by JavaScript in two slightly different ways.


    The first way it''s used is to indicate that a declared variable (e.g. var foo)
    has no assigned value. The second way it''s used is to indicate that an object
    property you''re trying to access is not defined (i.e. it has not even been named),
    and is not found in the prototype chain.


    Below, I examine both usages of undefined by JavaScript.


    ![](img/ad11d036d555f7d1771aeb8c30e67ba2_133_0.png)


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var initializedVariable; // declare variable

    console.log(initializedVariable); // logs undefined

    console.log(typeof initializedVariable); // confirm that JavaScript returns undefined

    var foo = {};

    console.log(foo.bar); // logs undefined, no bar property in foo object

    console.log(typeof foo.bar); // confirm that JavaScript returns undefined

    </script></body></html>

    ```


    # Notes


    +   - It is considered a good practice to allow JavaScript alone to use undefined.
    You should never find yourself setting a value to undefined, as foo = undefined.
    Instead, null should be used if you are specifying that a property or variable
    value is not available.'
  - '[PAGE 134]


    # JavaScript ECMA-262 edition 3 (and later) declares the undefined variable in
    the global scope


    Unlike previous versions, JavaScript ECMA-262 edition 3 (and later) has a global
    variable called undefined declared in the global scope. Because the variable is
    declared, and not assigned a value, the undefined variable is set to undefined.


    live code: http://jsfiddle.net/javascriptenlight/MhRkB/


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    // confirm that undefined is a property of the global scope

    console.log(undefined in this); // logs true


    </script></body></html>

    ```'
