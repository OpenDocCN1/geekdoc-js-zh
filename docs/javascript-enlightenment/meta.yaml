    # 关于作者


    Cody Lindley 是一位客户端工程师（又称前端开发人员）以及一名康复中的 Flash 开发者。他在 HTML、CSS、JavaScript、Flash
    以及与 Web 开发相关的客户端性能技术方面拥有丰富的专业背景（11 年以上经验）。当他没有在编写客户端代码时，他可能在钻研界面/交互设计，或者在编写素材以及在各种会议上演讲。当没有坐在电脑前时，可以肯定他正在爱达荷州波伊斯与妻子孩子待在一起——训练铁项运动、滑雪、山地自行车、公路自行车、登山登山、阅读、看电影，或对基督教世界观理性证据进行辩论。


    # 关于技术编辑


    ### Michael Richardson


    Michael Richardson 是一位住在爱达荷州波伊斯的 Web 和应用开发者。早些时候，他在莎拉洛伦斯学院获得了创意写作硕士学位，并在 2003
    年出版了一部名为《蘑菇广播站计划》（Plans for a Mushroom Radio）的小说。如今，当没有与其爱的妻子和调皮的孩子共度时光时，他正在管理着名为
    Timeglider 的小型 Web 应用。


    ### Kyle Simpson


    Kyle Simpson 是一位来自德克萨斯州奥斯汀的 JavaScript 系统架构师。他专注于 JavaScript、Web 性能优化特别是“后端”架构。如果某些东西无法通过
    JavaScript 或 Web Stack 技术实现，他可能对此觉得无趣。他运行着多个开源项目，包括 LABajs、Handlebar.JS 和 BlockchainJS。Kyle
    在 Mozilla 的开发工具团队担任软件工程师。


    ### Nathan Smith


    Nathan Smith 是 普惠（HP）的一名 UX 开发者。他拥有阿斯伯里神学院的神学硕士（MDiv）。他从上世纪就开始构建网站，并喜欢硬编码 HTML、CSS
    和 JavaScript。他创建了 960 网格系统，这是一个用于草图、设计和编写页面布局的设计与 CSS 框架。他还制作了 Formalize，这是一个旨在为表单样式带来理性的
    JavaScript 和 CSS 框架。


    ### Ben Nadel


    Ben Nadel 是 Epicenter Consulting 的首席软件工程师，这是一家位于曼哈顿的 Web 开发公司，专门从事创新的定制软件，改变其客户的业务模式。他还是
    Adobe 社区专业人士以及 Adobe 认证的高级 ColdFusion 专业人士。空闲时间，他会在 www.bennadel.com 上大量撰写关于痴迷的
    Web 应用开发各个方面的博客。


    ### Ryan Florence


    Ryan Florence 是一位来自犹他州盐湖市的前端 Web 开发者，自 90 年代初开始就开始创建网站。他特别感兴趣的是创建让终端用户和继承项目的开发者都感到愉悦的体验。Ryan
    活跃于 JavaScript 社区，编写插件、为流行的 JavaScript 库做出贡献、在会议和聚会上演讲，并在网上撰写相关文章。他目前在 Clock Four
    担任高级技术顾问。


    ### Nathan Logan


    Nathan Logan 已经做了 8 年专业 Web 开发者了。他的重点是客户端技术，但也研究服务端。他目前与本书作者一起在 Molomane 工作。从个人而言，Nathan
    拥有非常出色的妻子和儿子，喜欢山地自行车、温泉、辣味食物、苏格兰忌以及基督教信仰/神学。


    # 引言


    这本书不是关于 JavaScript 设计模式，也不是如何用 JavaScript 代码实现面向对象的范式。它的编写并不是为了区分 JavaScript 语言的优特性和坏特性。它不是一份完整的参考指南。它的目标不是编程初学者或完全没有接触过
    JavaScript 的人。它也不是一份 JavaScript 食谱。那类书已经写过了。


    我的意图是通过检查原生 JavaScript 对象和支持它们的细微差别（复杂值、原始值、作用域、继承、顶层对象等），为读者提供一个准确的 JavaScript
    世界观。我希望这本书是对 ECMA-262 第 3 版规范的简短易于理解的总结，重点关注 JavaScript 中对象的本质。


    如果你是一个只在库（如 jQuery、Prototype 等）掩护下使用 JavaScript 的设计师或开发者，我希望书中的材料能让你从一个 JavaScript
    库用户转变为一个 JavaScript 开发者。


    # 为什么我要写这本书？


    首先，我必须承认我写这本书是为了我自己。说实话，我创作这些材料是为了让自己能够“下自己的药”（drink my own Kool-Aid），并永远记住它的味道。换句话说，我想用我自己的语言有一个参考，以检验记忆。此外：


    - 库促进了“黑箱”综合，这在某些方面是有益的，但在另一些方面是有害。事情可能完成得很快且高效，但你并不知道如何以及为什么。当出现问题或性能成为问题时，如何以及为什么至关重要。事实上，任何打算在构建
    Web 应用（或只是一个好的注册页面）时实现 JavaScript 库或框架的人，都应该查看内部构造并理解引擎。这本书是为那些想要翻开书并亲手操作 JavaScript
    的人编写的。


    - Mozilla 已经提供了 JavaScript 1.5 的最新且完整的参考指南。我认为缺失的是一份从单一视角撰编写的、易于理解的文档，以与他们的参考指南配合使用。我希望这本书能作为
    JavaScript 值的“你需要知道的”手册，详细说明超出 Mozilla 参考指南所涵盖的概念。


    - JavaScript 1.5 版本将持续存在很长一段时间，但随着我们向 ECMA 第 5 版中语言的新特性迈进，我想记录下可能将长久存在的 JavaScript
    核心概念。


    - 关于编程语言的高级技术书籍通常充斥着大块的代码。我更倾向于用简短的解释来直达主题，并以真实代码作为支撑。我创造了“薄切片”（thin-slicing）的术语，来描述我在书中尝试做的事情。


    '
