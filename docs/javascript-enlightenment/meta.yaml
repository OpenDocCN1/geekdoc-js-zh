  md: '* Version 1.5 of JavaScript is going to be around for a fair amount of time,
    but as we move towards

    t new additions to the language found in ECMA edition 5, I wanted to document
    the cornerstone

    concepts of JavaScript that will likely be perennial.


    * Advanced technical books written about programming languages are often full
    of monolithic code

    examples and pointless meanders. I prefer short explanations to get to the point,
    backed by

    real code that I can run. I coined a term, "technical thin-slicing," to describe
    what I am

    ntempting to employ in this book. This entails reducing complex topics into smaller,
    digestible

    concepts taught with minimal words and backed with comprehensive/focused examples.


    * Most JavaScript books worth reading are three inches thick. Definitive guides,
    like David Flanagan''s

    certainly have their place, but I wanted to create a book that hones in on the
    important stuff without

    being exhaustive.


    # Who should read this book?


    This book is targeted at two types of people. The first is an advanced beginner
    or intermediate

    JavaScript developer who wishes to solidify his or her understanding of the language
    through an in-

    deep look at JavaScript objects. The second type is JavaScript library veteran
    who is ready to

    behind the curtain. This book is not ideal for novices to programming, JavaScript
    libraries, or

    JavaScript itself.


    # Why JavaScript 1.5 & ECMA-262 Edition 3?


    In this book, I focus on version 1.5 of JavaScript (equivalent to ECMA-262 Edition
    3) because it is the

    most widely implemented version of JavaScript to date. The next version of this
    book will certainly be

    geared towards the up-and-coming ECMA-262 Edition 5.


    # Why didn''t I cover the Date(), Error(), RegEx()?


    Like I said, this book is not an exhaustive reference guide to JavaScript. Rather,
    it focuses on objects

    as a lens through which understand JavaScript. So I have not decided to cover
    the Date(), Error (),

    or RegEx () objects because, as useful as they are, grasping the details of these
    objects will not make

    or break your general understanding of objects in JavaScript. My hope is that
    you simply apply what

    you learn here to all objects available in the JavaScript environment.'
