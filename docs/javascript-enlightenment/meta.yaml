    The big take away here is that when you change a complex value — because it is
    stored by reference — you change the value stored in all variables that reference
    that complex value. In our code example, myObject and copyOfMyObject are changed
    when you update the object stored in either variable.


    # Notes


    - When the values String(), Number(), and Boolean() are created using the new
    keyword, or converted to complex objects behind the scenes, the values continue
    to be stored/copied by value. So, even primitive values can be treated like complex
    values, they take on the quality of being copied by reference.


    - To truly make a copy of an object, you have to extract the values from the old
    object, and inject them into a new object.


    ## Complex objects are equal by reference


    When comparing complex objects, they are equal only when they reference the same
    object (i.e. have the same address). Two variables containing identical objects
    are not equal to each other since they do not actually point at the same object.


    Below, objectFoo and objectBar have the same properties and are, in fact, identical
    objects, but when asked if they are equal via JavaScript tells us they are not.


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var objectFoo = {name: ''same''};

    objectBar = {name: ''same''};


    // logs false, JS does not care that they are identical and of the same object
    type

    console.log(objectFoo === objectBar);


    // how complex objects are measured for equality

    var objectA = (foo: ''bar'');

    var objectB = objectA;


    console.log(objectA === objectB); // logs true because they reference the same
    object


    </script></body></html>

    ```


    The take away here is variables that point to a complex object in memory are equal
    only because they are using the same "address". Conversely, two independently
    created objects are not equal even if they are of the same type and possess the
    exact same properties.


    ## Complex objects have dynamic properties


    A new variable that points to an existing object does not copy the object. This
    is why complex objects are sometimes called reference objects. A complex object
    can have as many references as you want, and they will always refer to the same
    object, even as that object changes.


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var objA = {property: ''value''};

    var pointer1 = objA;

    var pointer2 = pointer1;


    // update the objA.property, and all references (pointer1 & pointer2) are updated

    objA.property = null;


    // logs ''null null'' because objA, pointer1, and pointer2 all reference the same
    object

    console.log(objA.property, pointer1.property, pointer2.property);

    </script></body></html>

    ```


    This allows for dynamic object properties because you can define an object, create
    references, the object, and all of the variables referring to the object will
    "get" that update.


    ## The typeof operator used on primitive and complex values


    The typeof operator can be used to return the type of value you are dealing with.
    The values returned from it are not exactly consistent or what some might say,
    logical. The following code exhibits the returned values using the typeof operator.


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    // primitive values

    var myNull = null;

    var myUndefined = undefined;

    var primitiveString1 = "string";

    var primitiveString2 = String(''string'');

    var primitiveNumber1 = 10;

    var primitiveNumber2 = Number(''10'');

    var primitiveBoolean1 = true;

    var primitiveBoolean2 = Boolean(''true'');


    console.log(typeof myNull); // logs object? WHAT? Be aware...

    console.log(typeof myUndefined); // logs undefined

    console.log(typeof primitiveString1, typeof primitiveString2); // logs string
    string

    console.log(typeof primitiveNumber1, typeof primitiveNumber2); // logs number
    number

    console.log(typeof primitiveBoolean1, typeof primitiveBoolean2); // logs boolean
    boolean


    // Complex Values

    var myNumber = new Number(23);

    var myString = new String(''male'');

    var myBoolean = new Boolean(false);

    var myObject = new Object();

    var myArray = new Array(''foo'', ''bar'');

    var myFunction = new Function(''x'', ''y'', ''return x * y'');

    var myDate = new Date();

    var myExp = new RegExp(''\b[a-z]+\b'');

    var myError = new Error();


    console.log(typeof myNumber); // logs object

    console.log(typeof myString); // logs object

    console.log(typeof myBoolean); // logs object

    console.log(typeof myObject); // logs object

    console.log(typeof myArray); // logs object

    console.log(typeof myFunction); // logs function

    console.log(typeof myDate); // logs object

    console.log(typeof myExp); // logs regexp

    console.log(typeof myError); // logs object

