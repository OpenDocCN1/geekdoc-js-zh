    \ http://jsfiddle.net/javascriptlightenment/Uhjbb/\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\nvar myFunction = function(z, s, d, e, r, m, q)\
    \ {\n  return myFunction.length;\n}\n\nconsole.log(myFunction()); // logs 7\n\
    </script></body></html>\n```\n\nThe arguments.length property with JavaScript\
    \ 1.4 is deprecated, and the number of arguments sent to a function can be accessed\
    \ from the length property of the function object. So, moving forward, you can\
    \ get the length value by leveraging the callee property to first gain reference\
    \ to the function being invoked (i.e. arguments.callee.length).\n\n# Redefining\
    \ function parameters\n\nA function's parameters can be redefined inside the function\
    \ it directly, or by using the arguments array. Take a look at this code:\n\n\
    ![](img/ad11d036d555f7d1771aeb8c30e67ba2_69_0.png)\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\nvar foo = false;\nvar bar = false;\n\nvar myFunction\
    \ = function(foo, bar) {\n  arguments[0] = true;\n  bar = true;\n  console.log(arguments[0],\
    \ bar); // logs true true\n}\n\nmyFunction();\n\n</script></body></html>\n```\n\
    \nNotice that I can redefine the value of the bar parameter using the arguments\
    \ index or by directly reassigning a new value to the parameter.\n\n# Return a\
    \ function before it is done (i.e. cancel function execution)\n\nFunctions can\
    \ be cancelled at any time during invocation by using the return keyword or without\
    \ a value. Below, we are cancelling the add function if the parameters are undefined\
    \ or not a number.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_69_1.png)\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar add = function(x, y) {\n\
    \  // If the parameters are not numbers, return error.\n  if (typeof x !== 'number'\
    \ || typeof y !== 'number') return 'pass in numbers';\n  return x + y;\n}\n\n\
    console.log(add(3,3)); // logs 6\nconsole.log(add('2', '2')); // logs 'pass in\
    \ numbers'\n\n</script></body></html>\n```\n\nThe take away here is that you can\
    \ cancel a function's execution by using the return keyword at any point in the\
    \ execution of the function.\n\n# Defining a function (statement, expression,\
    \ or constructor)\n\nA function can be defined in three different ways: a function\
    \ constructor, a function statement, or a function expression. Below, I demonstrate\
    \ each variation.\n\nlive code: http://jsfiddle.net/javascriptenlightenment/DLRak/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><script>\n\n/* function constructor:\
    \ the last parameter is the function logic,\nevery before it is a parameter */\n\
    var addConstructor = new Function('x', 'y', 'return x + y');\n\n// function statement\n\
    function addStatement(x, y) {\n  return x + y;\n}\n\n// function expression\n\
    var addExpression = function(x, y) {\n  return x + y;\n}\n\nconsole.log(addConstructor(2,2),\
    \ addStatement(2,2), addExpression(2,2)); // logs '4 4 4'\n\n</script></body></html>\n\
    ```\n\n- Some have said that there is a fourth type of definition for functions,\
    \ called the \"named function expression.\" A named function expression is simply\
    \ a function expression that also contains a name (e.g. var add = function add(x,\
    \ y) {return x+y});).\n\n# Invoking a function (function, method, constructor,\
    \ or call() & apply())\n\nFunctions are invoked using four different scenarios\
    \ or patterns.\n\n- As a function\n- As a method\n- As a constructor\n- Using\
    \ apply() or call()\n\nIn the code below, we examine each of these invocation\
    \ patterns.\n\n> live code: http://jsfiddle.net/javascriptenenment/aqbQ9/\n\n\
    ```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n// function pattern\n\
    var myFunction = function(){return 'foo'};\nconsole.log(myFunction()); // log\
    \ 'foo'\n\n// method pattern\nvar myObject = {myFunction: function(){return 'bar'};};\n\
    console.log(myObject.myFunction()); // log 'bar'\n\n// constructor pattern\nvar\
    \ Cody = function(){\n  this.living = true;\n  this.age = 3;\n  this.gender =\
    \ 'male';\n  this.getGender = function() {return this.gender;};};\nvar code =\
    \ new Cody(); // invoke via constructor\nconsole.log(code); // logs object and\
    \ properties\n\n// apply() and call() pattern\nvar greet = {\nrunGreet: function(){\n\
    \  console.log(this.name,arguments[0],arguments[1]);\n}\n};\nvar code = {name:'cody'};\n\
    var lisa = {name:'lisa'};\n\n// invoke the runGreet function as inside of code\
    \ object\ngreet.call(code,'foo','bar'); // logs code foo bar\n\n// invoke the\
    \ runGreet function as inside of lisa object\ngreet.apply(lisa, ['foo', 'bar']);\
    \ // logs lisa bar\n```\n\nNotice the difference between call() and apply() in\
    \ how parameters are sent to the function being invoked. Make sure you are aware\
    \ of all four invocation patterns, as you will encounter any of them.\n\n# Anonymous\
    \ functions\n\nAn anonymous function is a function that is not given an identifier.\
    \ Anonymous functions are mostly used for passing functions as another function.\n\
    \nlive code: http://jsfiddle.net/javascriptenenment/4AX/\n\n```html\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\n\nfunction(){console.log('hi');}; //\
    \ anonymous function, no way to invoke it\n\n// create a function that can invoke\
    \ our anonymous function\nvar sayHi = function() {\nfunction();\n}\n\n// pass\
    \ an anonymous function as parameter\nsayHi(function(){console.log('hi');}); //\
    \ log 'hi'\n\n</script></body></html>\n```\n\n# Self-invoking function expression\n\
    \nA function expression (really any function except created from Function() constructor)\
    \ can be immediately invoked after definition by using the parentheses. Below,\
    \ we create a sayWord() expression and then immediately invoke the function. This\
    \ is considered to be self-invoking function.\n\nlive code: http://jsfiddle.net/javascriptenenment/w9j/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar sayWord = function()\
    \ {console.log('Word 2 mo!');}; // logs 'Word 2 mo!'\n</script></body></html>\n\
    ```\n\n# Self-invoking function statements\n\nIt's possible to create an anonymous\
    \ function statement that is self-invoked. This is called self-invoking anonymous\
    \ function. Below, we create several anonymous functions that are immediately\
    \ invoked.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_73_0.png)\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\n// most commonly used/seen in\
    \ the wild\n(function(msg) {\n  console.log(msg);\n})('Hi');\n\n// slightly different\
    \ but achieving the same thing:\n(function(msg) {\n  console.log(msg)\n}('Hi');\n\
    \n// the shortest possible solution\n!function sayHi(msg) {console.log(msg)}('Hi');\n\
    \n// FYI, this does NOT work!\n// function sayHi() {console.log('hi');}\n\n</script></body></html>\n\
    ```\n\n# Notes\n\n- According to the ECMAScript standard, the parentheses around\
    \ the function (or anything that transforms the function into an expression) are\
    \ required if the function is to be invoked immediately.\n\n# Functions can be\
    \ nested\n\nFunctions can be nested inside other functions indefinitely. Below,\
    \ we encapsulate the goo function inside the bar function, which is inside of\
    \ the foo function.\n\nlive code: http://jsfiddle.net/javascriptlightenment/ZshHua/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar foo = function()\
    \ {\n  var bar = function() {\n    var goo = function() {\n      console.log(this);\
    \ // logs reference to window object\n    }\n  };\n};\n\n</script></body></html>\n\
    ```\n\nThe simple take away here is that functions can be nested and that there\
    \ is no limit to how deep the nesting can go.\n\n# Notes\n\n- Remember, the value\
    \ of this for nested functions will be the head object (e.g. window object in\
    \ a web browser) in JavaScript 1.5, ECMA-262, edition 3.\n\n# Passing functions\
    \ to functions & returning functions from functions\n\nAs previously mentioned,\
    \ functions are first-class citizens in JavaScript. And since a function is a\
    \ value, and a function can be passed any sort of value, a function can be passed\
    \ to a function. Functions that take and/or return other functions are sometimes\
    \ \"higher-order functions\".\n\nBelow, we are passing an anonymous function to\
    \ the foo function which we then immediately return from the foo function. It\
    \ is this anonymous function that the variable bar points to, foo accepts and\
    \ then returns the anonymous function.\n\nlive code: http://jsfiddle.net/javascriptlightenment/w2C75/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n```\n"
