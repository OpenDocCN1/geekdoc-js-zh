    var myRegExp = new RegExp(''\[a-z]+\b'');

    var myError = new Error(''Crap!'');


    // // verify which constructor created the object

    console.log(myNumber.constructor); // logs Number

    console.log(myString.constructor); // logs String

    console.log(myBoolean.constructor); // logs Boolean

    console.log(myObject.constructor); // logs Object

    console.log(myArray.constructor); // logs Array(), in modern browsers

    console.log(myFunction.constructor); // logs Function

    console.log(myDate.constructor); // logs Date()

    console.log(myRegExp.constructor); // logs RegExp()

    console.log(myError.constructor); // logs Error


    <script></body></html>

    ```


    By using the new operator, we are telling the JavaScript interpreter that we would
    like above, an object that is an instance of the corresponding constructor function.
    In the example above, the Date() constructor function is used to create date objects.
    The Date() constructor function is a cookie cutter for date objects. That is,
    it produces objects from a default pattern defined by the Date() constructor.


    At this point, you should be well acquainted with creating objects from native
    (e.g. new String(''foo'')) and user-defined constructor functions (e.g. new Person(true,
    33, ''male'')).


    Notes


    +   - Keep in mind that Math is a static object — a container for other methods
    — and is not a constructor that uses the new operator.


    # Creating shorthand/literal values from constructors


    JavaScript provides shortcuts — called "literals" — for manufacturing of the native
    object values without having to use new Foo() or new Bar(). For the most part,
    the literal syntax accomplishes the same thing as using the new operator. The
    exceptions are: Number(), String(), and Boolean() — see notes below.


    If you come from other programming backgrounds, you are likely more familiar with
    the literal way of creating objects. I, instantiate the native JavaScript constructors
    using the new operator and create corresponding literal equivalents.'
