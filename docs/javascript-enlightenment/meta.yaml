- md: "\nString() constructor function can produce string objects. The Person() constructor\
    \ is no less capable, and is no more or less malleable, the native String() constructor\
    \ or any of the native constructors found in JavaScript.\n\nRemember how the cody\
    \ object we first looked at was produced from an Object(). It's important to note\
    \ that the Object() constructor function and the new Person() constructor shown\
    \ in the last code example can give us identical object with the same properties\
    \ and property methods. Examine the two sections of code below, showing that codyA\
    \ and codyB have the same object values, even though they are produced in different\
    \ ways.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_18_0.png)\n\n```javascript\n\
    <!DOCTYPE html><html lang=\"en\"><body<script>\n\n// create a cody object using\
    \ the Object() constructor\n\nvar codyA = new Object();\ncodyA.living = true;\n\
    codyA.age = 33;\ncodyA.gender = 'male';\ncodyA.getGender = function() {return\
    \ codyA.gender};\n\nconsole.log(codyA); // logs Object {living=true, age=33, gender=\"\
    male\", ...}\n\n/* The same cody object is created below, but instead of using\
    \ the native Object()\nconstructor to create a one-off cody, we first define our\
    \ own Person() constructor that can\ncreate a cody object (and any other Person\
    \ object we like) and then instantiate it with\n\"new\". */\n\nvar Person = function(living,\
    \ age, gender) {\nthis.living = living;\nthis.age = age;\nthis.gender = gender;\n\
    this.getGender = function() {return this.gender};\n};\n\n// logs Object {living=true,\
    \ age=33, gender=\"male\", ...}\n codyB = new Person(true, 33, 'male');\n\nconsole.log(codyB)\n\
    </script></body>></html>\n```\n\nThe main difference between the codyA and codyB\
    \ objects is not found in the object itself, but in the constructor functions\
    \ used to produce them. The codyA object was produced using an instance of the\
    \ Object() constructor. The Person() constructor, constructed codyB can also be\
    \ used as a powerful, centrally defined object \"factory\" to be used for creating\
    \ more Person() objects. Crafting your own constructors for producing custom objects\
    \ also sets up prototypypal inheritance for Person instances.\n\nBoth solutions\
    \ resulted in the same complex object being created. It's these two patterns that\
    \ are the most commonly used for constructing objects.\n\nJavaScript is really\
    \ just a language that is pre-packaged with a few native constructors used to\
    \ produce complex objects which express a very specific type of value (e.g. numbers,\
    \ strings, functions, object, arrays...) as well as the raw materials via Function()\
    \ objects for crafting user-defined object constructors (e.g. Person()). The end\
    \ result—no matter the pattern for creating the object—is typically the creation\
    \ of a complex object.\n\nUnderstanding the creation, nature, and usage of objects\
    \ and their primitive equivalents is the focus of the rest of this book.\n\n#\
    \ JavaScript constructors construct and return object instances\n\nThe role of\
    \ a constructor function is to create multiple objects that share certain qualities\
    \ and behaviors. Basically a constructor function is a cookie cutter for producing\
    \ objects that have default properties and property methods.\n\nIf you say, \"\
    A constructor is nothing more than a function,\" then I would reply, \"You are\
    \ correct — unless that function is invoked using the new keyword. (e.g. new String('foo')).\
    \ When this happens, a function takes on a special role, and JavaScript treats\
    \ the function as setting the value of this for the function to the new object\
    \ that is being constructed. In addition to this special behavior, the function\
    \ will return the newly created object (i.e this) by default inside the value\
    \ false. The new object that is returned from the function is considered to be\
    \ an instance of the value function that constructs it. \n\nConsider the Person()\
    \ constructor again, but this time read the comments in the code below, as they\
    \ highlight the effect of the new keyword.\n\n```javascript\n<!DOCTYPE html><html\
    \ lang=\"en\"><body<script>\n\n/* Person is a constructor function. It was written\
    \ with the intent of being used with the new keyword. */\n\nvar Person = function\
    \ Person(living, age, gender) {\n```\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_19_0.png)\n\
    \n```javascript\n// \"this\" below is the new object that is being created (i.e.\
    \ this = new Object())\nthis.living = living;\nthis.age = age;\nthis.gender =\
    \ gender;\nthis.getGender = function() {return this.gender};\n// when the function\
    \ is called with the new keyword \"this\" is returned instead of false\n// instantiate\
    \ a Person object named cody\nvar cody = new Person(true, 33, 'male');\n\n// cody\
    \ is an object and an instance of Person\nconsole.log(typeof cody); // logs object\n\
    console.log(cody); // logs the internal properties and values of cody\nconsole.log(cody.constructor);\
    \ // logs Person()\n</script></body>></html>\n```\n\nThe above code leverages\
    \ a user-defined constructor function (i.e. Person()) to create cody object. This\
    \ is no different from the Array() constructor creating an object (e.g. new Array()):\n\
    \n```javascript\nlive code: http://jsfiddle.net/javascriptlightenment/Ka3a/\n\
    <!DOCTYPE html><html lang=\"en\"><body<script>\n\n// instantiate an Array object\
    \ named myArray\nvar myArray = new Array(); // myArray is an instance of Array\n\
    \n// myArray is an object and an instance of Array\nconsole.log(typeof myArray);\
    \ // logs object!\nconsole.log(myArray); // logs []\n\nconsole.log(myArray.constructor);\
    \ // logs Array()\n</script></body>></html>\n```\n\nIn JavaScript, most values\
    \ (excluding primitive values) involve objects being created, or instantiated,\
    \ from a constructor function. An object returned from a constructor is called\
    \ an instance. Make sure you are comfortable with these semantics, well as the\
    \ pattern of leveraging constructors to construct objects.\n\n# The JavaScript\
    \ native/built-in object constructors\n\nThe JavaScript language contains nine\
    \ native (or built-in) constructors. These objects are used by JavaScript to construct\
    \ the language, and by \"construct\" I mean these objects are used to express\
    \ values in JavaScript code, as orchestrate several features of the language.\
    \ Thus, the native constructors are multifaceted in that they produce objects\
    \ but are also used to create other objects when called as constructor functions.\
    \ Below, I list the nine constructors that come pre-packaged with JavaScript:\n\
    \n- Number()\n- String()\n- Boolean()\n- Object()\n- Array()\n- Function()\n-\
    \ Date()\n- RegExp()\n- Error()\n\nJavaScript is mostly constructed from these\
    \ nine objects (as well as string, number, and boolean primitives). Understanding\
    \ these objects in detail is key to taking advantage of JavaScript's unique power\
    \ and flexibility.\n\n> Notes\n> The Math object is the oddball. It's a static\
    \ object, rather than a constructor function, meaning you cannot do this: `var\
    \ x = new Math()`. You can use it already instantiated (e.g. Math.PI). Truly,\
    \ Math is just an object set up by JavaScript to house math functions.\n> The\
    \ native objects are sometimes referred to as \"global objects\" since they are\
    \ the objects that JavaScript has made available for use. Do not confuse the term\
    \ object with the global object that is the topmost level of scope, for example,\
    \ the window object in all browsers.\n> The Number(), String(), and Boolean()\
    \ constructors not only construct objects; they also provide a primitive value\
    \ for string, number and boolean depending on how the constructor is leveraged.\
    \ If you called these constructors directly, a complex object is returned. If\
    \ you simply express a number, string, or boolean value in your code (primitive\
    \ values like 5, \"foo\" and true), then the constructor will return a primitive\
    \ value instead of a complex object value.\n\n# User-defined/non-native object\
    \ constructor functions\n\nAs you saw with the Person() constructor, we can make\
    \ our own constructor functions, from which we can produce multiple custom objects.\n\
    \nBelow, I present the Person() constructor function:\n\n```javascript\nline code:\
    \ http://jsfiddle.net/javascriptenlightenment/GLMR8/\n<!DOCTYPE html><html lang=\"\
    en\"><body<script>\n\nvar Person = function(living, age, gender) {\n  this.living\
    \ = living;\n  this.age = age;\n  this.gender = gender;\n  this.getGender = function()\
    \ {return this.gender};\n};\n\nvar cody = new Person(true, 33, 'male');\nconsole.log(cody);\
    \ // Object (living=true, age=33, gender=\"male\", ...)\n\nvar lisa = new Person(true,\
    \ 34, 'female');\nconsole.log(lisa); // Object (living=true, age=34, gender=\"\
    female\", ...)\n\n</script></body>></html>\n```\n\nAs you can, by passing parameters\
    \ and invoking the Person() constructor function, you could easily create a vast\
    \ number of unique people objects. This can be pretty handy when you need more\
    \ than two or three objects that possess the same properties but with different\
    \ values. Because of this, it is exactly what JavaScript does with the native\
    \ objects. The Person() constructor follows the same principles as the Array()\
    \ constructor. So `new Array('foo', 'bar')` is really not different than `new\
    \ Person(true, 33, 'male')`. Creating your own constructor functions is just using\
    \ the same pattern that JavaScript uses for its own native constructor functions.\n\
    \n- It is not required, when creating custom constructor functions use the new\
    \ operator, but it's best practice to make the first character of the constructor\
    \ name uppercase: Person() rather than person()\n"
  mdcn: "\n`String()` 构造函数可以产生字符串对象。`Person()` 构造函数同样强大，其灵活性与原生的 `String()` 构造函数或\
