    The getGender method, a property of the cody object, is used to return one of
    cody/s other values: the value "male" stored in the gender property. What you
    realize is that without methods, our object would not do much except static properties.


    The cody object we have discovered so far is known as an Object() object. We created
    the cody object using a blank slate that was provided to us by invoking the Object()
    constructor function. Think of constructor functions as a template or cookie cutter
    for producing pre-defined objects. In the case of the cody object I used the Object()
    constructor function to produce an empty object which I named cody. Since now
    cody is an object constructed from the Object() constructor, we can call cody
    any Object() object. What you really need to know, the creation of a simple Object()
    object like cody, is that the majority of values in JavaScript objects are (primitive
    values like "foo", 5, and true are exception but equivalent wrapper objects).


    Consider that the cody object created from the Object() constructor function is
    not really different from say a string object created via the String() constructor
    function. To drive this fact, examine and contrast the code below:


    ```

    live code: http://jsfiddle.net/javascriptlightenment/XcfC5/


    <!DOCTYPE>html lang="en"><body><script>


    var myObject = new Object(); // produces an Object() object

    myObject[''0''] = ''f'';

    myObject[''1''] = ''o'';

    myObject[''2''] = ''o'';


    console.log(myObject); // logs Object {0="f", 1="o", 2="o"}


    var myString = new String(''foo''); // produces a String() object


    console.log(myString); // logs foo {0="f", 1="o", 2="o"


    </script></body></html>

    ```


    It turns out, myObject and myString are both ... objects! They can have properties,
    inherit properties, and are produced from a constructor function. The myString
    variable containing the ''foo'' string value seems as simple as it goes, but amazingly
    it does get an object structure under its surface. If you examine both of the
    objects you produce will see that they are identical objects in'
