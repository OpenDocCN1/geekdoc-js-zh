    # Object() parameters


    The Object() constructor takes one optional parameter. That parameter is the value
    you would like to create. If you provide no parameter, then a null or undefined
    value will be assumed.


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    // create an empty object with no properties

    var cod1 = new Object();

    var cod2 = new Object(undefined);

    var cod3 = new Object(null);


    console.log(typeof cod1, typeof cod2, typeof cod3); // logs ''object object object''


    </script></body></html>

    ```


    If a base value null or undefined is passed to the Object constructor, the value
    will be created as an object. Theoretically, we can use the Object() constructor
    to create any of the other native objects that we have a constructor. I do just
    that.


    ```

