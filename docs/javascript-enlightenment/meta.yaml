    \ All this is to showcase the fact that functions can be passed around just like\
    \ any other value.\n\n## Invoking function statements before they are defined\
    \ (aka function hoisting)\n\nA function statement can be invoked during execution\
    \ before its actual definition. This is a bit odd, but you should be aware of\
    \ it so you can leverage it, or at least know what's going on when you encounter\
    \ it. Below, I invoke the sayYo() and sum() function statements before they are\
    \ defined.\n\n> live code: http://jsfiddle.net/javascriptlightenment/7hUw/\n\n\
    ```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\n// Example 1\nvar\
    \ speak = function() {\n  sayYo() has not been defined yet but it can still be\
    \ invoked, logs 'yo'\n  function sayYo() {console.log('sayYo');}\n};\n// invoke\n\
    \n// Example 2\nconsole.log(sum(2, 2)); // invoke sum(), which is not defined\
    \ yet, but can still be invoked\nfunction sum(x, y) {return x + y;}\n\n</script></body></html>\n\
    ```\n\nThis happens before the code runs; function statements are interpreted\
    \ and added to the execution stack/context. Make sure you are aware of this as\
    \ you use function statements.\n\n- Notes:\n  Functions, defined as 'function\
    \ expressions' are not hoisted; only 'function statements' are hoisted.\n\n##\
    \ A function can call itself (aka recursion)\n\nIt's perfectly legitimate for\
    \ a function to call itself. In fact, this is often used in well-known coding\
    \ patterns. In the code below, we kick off the countDownFrom function, which then\
    \ calls itself via the function name countDownFrom. Essentially, this creates\
    \ a loop that counts down from 5 to 0.\n\nlive code: http://jsfiddle.net/javascriptlightenment/xacle/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar countDownFrom\
    \ = function countDownFrom(num) {\n  num--; // change the parameter value\n  if\
    \ (num < 0) return false; // if num < 0 return function with no recursion\n  //\
    \ could have also done arguments.callee(num) if it was an anonymous function\n\
    \  countDownFrom(num);\n}\ncountDownFrom(5); // kick off the function, which logs\
