  md: '# Working with Primitive String, Number and Boolean values


    # Primitive/literal values are converted to objects when properties are accessed


    Do not be mystified by the fact that string, number, and boolean literals can
    be treated like an object with properties (true.toString()). When these primitive
    values are treated like an object by attempting to access properties, JavaScript
    will create a wrapper object from the primitive''s associated constructor, so
    that the properties and methods of the wrapper object can be accessed. Once the
    properties have been accessed, the wrapper object is discarded. This conversion
    allows us to write code that would make it appear as if a primitive value was,
    in fact, an object. Truth be told, when it is treated like an object in code,
    JavaScript will convert it to an object so property access will work, and back
    to a primitive value once it is returned. The key thing to know here is what is
    occurring, and that JavaScript is doing for you behind the scenes.


