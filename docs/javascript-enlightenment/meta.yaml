  mdcn: '

    不需要拥有自己的 `join()` 方法。所有实例都可以利用同一个 `join()` 方法，因为该方法存储在原型链中。


    ## 原型在所有 Function() 实例上都是标准的


    所有函数都是通过 `Function()` 构造函数创建的，即使你没有直接调用 `Function()` 构造函数（例如 `var add = new Function(''x'',
    ''y'', ''return x + z'');`），而是使用字面量符号（例如 `var add = function(x,y){return x + z});`）。


    当函数被创建时，它总是被赋予一个 `prototype` 属性，该属性是一个空对象。下面我们定义一个名为 `myFunction` 的函数，然后访问 `prototype`
    属性，它仅仅是一个空对象。


    ```html

    <!DOCTYPE html><html lang="en"><body><script>


    var myFunction = function() {};

    console.log(myFunction.prototype); // logs object

    console.log(typeof myFunction.prototype); // logs ''object''


    </script></body></html

    ```


    确保完全理解 `prototype` 属性是来自 `Function()` 构造函数的。只有当我们打算将函数作为用户定义的构造函数使用时，才会利用 `prototype`
    属性，但这并没有改变 `Function()` 构造函数为每个实例提供一个属性的事实。


    ## 默认的原型属性是一个 Object() 对象


    这些关于原型的讨论可能会有点深奥。事实上，原型（prototype）只是 JavaScript 在后台创建的一个名为 "prototype" 的空对象，并通过调用
    `Function()` 构造函数来提供的。如果你手动执行，它看起来会像这样：


    ```html

    <!DOCTYPE html><html lang="en"><body><script>


    var myFunction = function() {};

    myFunction.prototype = {}; // add the prototype property and set it to an empty
    object

    console.log(myFunction.prototype); // logs an empty object


    </script></body></html

    ```


    事实上，上述代码运行良好，本质上复制了 JavaScript 已经执行的操作。


    ## 注意事项


    - `prototype` 属性的值可以设置为 JavaScript 中提供的任何复杂值（即对象）。JavaScript 将忽略任何设置为原始值的 `prototype`
    属性。


    ## 从构造函数创建的实例与构造函数的 prototype 属性相连


    虽然 `prototype` 只是一个对象，但原型链将每个实例连接到其构造函数的 `prototype` 属性。这意味着任何使用 `new` 关键字从构造函数创建的对象（或为原始值创建对象包装器时），都会在创建的对象与用于创建它的构造函数的
    `prototype` 属性之间添加一个隐藏链接。这个链接在实例内部被称为 `__proto__`（尽管它仅在 Firefox 2+、Safari、Chrome
    和 Android 中通过代码暴露/支持）。当调用构造函数时，JavaScript 在后台将这些者连接起来，它的链接使得原型链能够成为……链的吧，一条链。下面，我们在原生的
    `Array()` 构造函数的原型上添加一个属性，然后我们可以通过在该实例上设置的 `__proto__` 从 `Array()` 实例访问它。


    live code: http://jsfiddle.net/javascriptlightenment/kcz6q/


    ```html

    <!DOCTYPE> <html lang="en"><body><script>

    //此代码仅在支持 __proto__ 访问的浏览器中有效


    Array.prototype.foo = ''foo'';

    var myArray = new Array();


    console.log(myArray.__proto__.foo); // logs foo, because myArray.__proto__ = Array.prototype


    </script></body></html>

    ```


    由于访问 `proto` 不是官方 ECMA 标准的一部分，因此有一种更通用的方法来追踪从对象到其继承的原型对象之间的链接，那就是使用 `constructor`
    属性。下文所示。


    live code: http://jsfiddle.net/javascriptlightenment/2QLQv/


    ```html

    <!DOCTYPE html><html lang="en"><body><script>

    Array.prototype.foo = ''foo''; // 所有 Array() 实例现在都继承了 foo 属性

    var myArray = new Array();


    // 利用 *.constructor.prototype 以详细的方式追踪 foo

    console.log(myArray.constructor.foo);


    // 或者，当然，留出链

    console.log(myArray.foo) // logs foo

    // 使用原型链在 Array.prototype.foo 查找属性

    </script></body></html

    ```


    在上面的代码中，`foo` 在原型对象中被找到。你需要意识到，这仅仅是因为 `Array()` 实例与 `Array()` 构造函数原型对象（即 `Array.prototype`）之间的关联/链接。简单来说，`myArray.__proto__`（或
    `myArray.constructor.prototype`）引用了 `Array.prototype`。


    ## 原型链的终点是 Object.prototype


    由于访问 `proto` 不是官方 ECMA 标准的一部分，因此有一种更通用的方法来追踪从对象到其继承的原型对象之间的链接，那就是使用 `constructor`
    属性。下文所示。（等待，为了逻辑流重复了上下文）


    live code: http://jsfiddle.net/javascriptlightenment/L6Za/


    ```html

    <!DOCTYPE html><html lang="en"><body><script>

    var myArray = [];

    console.log(myArray.foo) // logs undefined

    </script></body></html>

    ```

