    \n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar Person = function(living,\
    \ age, gender) {\n  this.living = living;\n  this.age = age;\n  this.gender =\
    \ gender;\n  this.getGender = function() {return this.gender};\n};\n\nvar cody\
    \ = new Person(true, 33, 'male');\nconsole.log(cody); // Object (living=true,\
    \ age=33, gender=\"male\", ...)\n\nvar lisa = new Person(true, 34, 'female');\n\
    console.log(lisa); // Object (living=true, age=34, gender=\"female\", ...)\n\n\
    </script></html>\n```\n\nAs you can, by passing parameters and invoking the Person()\
    \ constructor function, you could easily create a vast number of unique people\
    \ objects. This can be pretty handy when you need more than two or three objects\
    \ that possess the same properties, but with different values. Come of it this,\
    \ it is exactly what JavaScript does with the native objects. The Person() constructor\
    \ follows the same principles as the Array() constructor. So new Array('foo',\
    \ 'bar') is really not different than new Person(true, 33, 'male'). Creating your\
    \ own constructor functions is just using the same pattern that JavaScript uses\
    \ for its own native constructor functions.\n\n+   - It is not required, when\
    \ creating custom constructor functions use the new operator, it's best practice\
    \ to make the first character of the constructor name uppercase: Person() rather\
    \ than person()\n- One tricky thing about constructor functions is the this value\
    \ inside of the function. Remember, a constructor function is just a cookie cutter.\
    \ When you use with the new keyword, it will create an object with properties\
    \ and values defined inside of the constructor function. When new is used the\
    \ value this literally means the objectinstance that was created based on the\
