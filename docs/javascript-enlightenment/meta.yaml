    # How primitive values are stored/copied in JavaScript


    It is extremely important to grok that primitive values are stored and manipulated
    at "face value". It might sound simple, but this means that if I store the string
    value "foo" in a variable myString, then the value "foo" is literally stored in
    memory as. Why is this important? Once you begin manipulating (e.g. copying) values,
    you have to be equipped with this knowledge, because primitive values are copied
    literally.


    In the example below, we store a copy of the String value ("foo") in the variable
    myStringCopy, and its value is literally copied. Even if we change the original
    value, the copied value, referenced by the variable myStringCopy, remains unchanged.


    ```

    <!DOCTYPE html>html lang="en"><body><script>


    var myString = ''foo''; // create a primitive string object

    var myStringCopy = myString; // copy its value into a new variable


    var myString = null; // manipulate the value stored in the myString variable

    ```


