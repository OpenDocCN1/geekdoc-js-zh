    console.log(typeof cody); // logs object\n// 打印 cody 的内部属性和值\nconsole.log(cody);\
    \ // logs Object\nconsole.log(cody.constructor); // logs Person()\n</script></body>></html\n\
    ```\n\n上述代码利用了用户定义的构造函数（即 `Person()`）来创建 `cody` 对象。这与 `Array()` 构造函数创建对象不同：\n\n\
    ```javascript\nlive code: http://jsfiddle.net/javascriptlightenment/Ka3a/\n<!DOCTYPE\
