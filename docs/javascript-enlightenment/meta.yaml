- md: "\n```\n</script>\n</body>\n```\n\n# Notes\n\n- Careful! Anything added to Object.prototype\
    \ will show up in a for in loop and the prototype chain. Because of this, it's\
    \ been said that changing Object.prototype is forbidden or verboten, as some might\
    \ say.\n\n# Conceptual overview of using Function() objects\n\nA function is a\
    \ container of code statements that can be invoked using the parentheses () operator.\
    \ Parameters can be passed inside the parentheses during invocation so that the\
    \ statements in the function can access certain values when the function is invoked.\n\
    \nBelow, we create two versions of an addNumbers function object — one using the\
    \ new operator and another using the more common, literal pattern. In each case,\
    \ we invoke the function, passing parameters in the parentheses () operator.\n\
    \n![](img/ad11d036d555f7d1771aeb8c30e67ba2_62_0.png)\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><<body><script>\nvar addNumbers = new Function('num1', 'num2', 'return\
    \ num1 + num2');\nconsole.log(addNumbers(2, 2)); // logs 4\n\n// could also be\
    \ written the literal way, which is much more common\nvar addNumbersB = function(num1,\
    \ num2) { return num1 + num2 };\n\nconsole.log(addNumbersB(2, 2)); // logs 4\n\
    </script></body></html>\n```\n\nA function can be used to return a value, construct\
    \ an object, or as a mechanism to simply run code. JavaScript has several uses\
    \ for functions, but in its most basic form, a function is simply a unique scope\
    \ of executable statements.\n\n# Function() parameters\n\nThe Function() constructor\
    \ takes an infinite number of parameters, but the last parameter expected by Function()\
    \ constructor is a string containing statements that comprise the body of the\
    \ function. Any parameters passed to the constructor before the last will be available\
    \ to the function created. It's also possible to send multiple parameters, as\
    \ comma separated string.\n\nBelow, I contrast the usage of the Function() constructor\
    \ with the more common patterns of instantiating a function object.\n\nlive code:\
    \ http://jsfiddle.net/javascriptenlight/RT8QD/\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><script>\n\nvar addFunction = new Function('num1', 'num2', 'return\
    \ num1 + num2');\n\n/* Alternately, a comma-separated string arguments can be\n\
    the first parameter of the constructor, with the function body following. */\n\
    var timesFunction = new Function('num1,num2', 'return num1 * num2');\nconsole.log(addFunction(2,2),timesFunction(2,2));\
    \ // logs '4 4'\n\n// versus the more common patterns for instantiating a function\n\
    var addFunctionExpr = function(num1, num2) {return num1 + num2}; // expression\
    \ form\nfunction addFunctionStmt(num1, num2) {return num1 + num2}; // statement\
    \ form\n\n</script></body></html>\n```\n\n# Notes\n\n- Directly leveraging the\
    \ Function() constructor is not recommended or typically ever done JavaScript\
    \ will use eval() to parse the string containing the function's logic. Many consider\
    \ eval() to be unnecessary overhead. If it's in use, a flaw in the design of the\
    \ code is highly possible.\n- Using the Function() constructor without the new\
    \ keyword has the same effect as using only the constructor to create function\
    \ objects (e.g. newFunction('x','return x') v.s. function('x','return x')).\n\
    - No closure is created (see Chapter 7) when invoking the Function() constructor\
    \ directly.\n\n# Function() properties and methods\n\nThe function object has\
    \ the following properties (not including inherited properties and methods):\n\
    \nProperties (e.g. Function.prototype):\n\n- prototype\n\n# Function object instance\
    \ properties and methods\n\nFunction object instances have the following properties\
    \ and methods (not including inherited properties and methods):\n\nInstance Properties\
    \ (e.g. `var myFunction = function(x, y, z) {}; myFunction.length;`)\n\n- arguments\n\
    - constructor\n- length\n\nInstance Methods (e.g. `var myFunction = function(x,\
    \ y, z) {}; myFunction.toString();`)\n\n- apply()\n- call()\n- toString()\n\n\
    # Functions always return a value\n\nWhile it's possible to create a function\
    \ simply to execute code statements, it's also very common for a function to return\
    \ a value. Below, we are returning a string from the `sayHi` function.\n\n> code:\
    \ http://jsfiddle.net/javascriptenenment/G6Q/\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\nvar sayHi = function() {\n  return 'Hi';\n}\nconsole.log(sayHi());\
    \ // logs \"Hi\"\n</script></body></html>\n```\n\nIf a function does not specify\
    \ a return value, then `undefined` is returned. Below, we call the `sayHi` function\
    \ which logs `undefined` to the console without explicitly returning a value.\n\
    \n> code: http://jsfiddle.net/javascriptenment/Lib/\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\nvar sayHi = function() {\n  console.log('I am\
    \ here!');\n/* logs true because a value is always returned, even if we don't\
    \ specifically return one */\nconsole.log(sayHi() === undefined);\n</script></body></html>\n\
    ```\n\nThe takeaway is that functions return a value, even if you do not provide\
    \ a value to return. If you do not specify a value, the value returned is undefined.\n\
    \n# Functions are first-class citizens (not just syntax, but values)\n\nIn JavaScript,\
    \ functions are objects. This means that a function can be stored in a variable,\
    \ array, or object. Also, a function can be passed to, and returned from, another\
    \ function. A function has properties because it is an object. All of these make\
    \ functions first-class citizens in JavaScript.\n\n> live code: http://jsfiddle.net/javascriptenment/2BT/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\n// functions can\
    \ be stored in variables (funcA), arrays (funcB), and objects (funcC)\nvar funcA\
    \ = function(){}; // called like: funcA()\nvar funcB = [function(){}]; // called\
    \ like: funcB()\nvar funcC = {method:function(){}}; // called like: funcC['method']()\n\
    \n// functions can be sent to, and sent back from, functions\nvar funcD = function(){\n\
    \  return 'Hi';\n};\n\nvar runFuncToFunc = funcD(function() { \n\n// functions\
    \ are objects, which means they can have properties\nvar funcE = function(){};\n\
    funcE.answer = 'yes'; // instance property\nconsole.log(funcE.answer); // logs\
    \ 'yes'\n\n</script></body></html>\n```\n\nIt is crucial to realize a function\
    \ is an object, and thus a value. It can be passed around or augmented like any\
