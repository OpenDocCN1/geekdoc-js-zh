    \ // logs 4\n\n</script></body></html>\n```\n\nIn the code above, a Person() constructor\
    \ function is created. We then add properties to the prototype property of Person(),\
    \ which can be inherited by all instances. So clearly, in your code you can leverage\
    \ the prototype chain the same way JavaScript leverages it for object inheritance.\n\
    \nAs a good example of how you might leverage this, you can create a constructor\
    \ function whose instances inherit legs and arms properties if they are not provided\
    \ as parameters. Below, the Person() constructor is sent parameters, they are\
    \ used as instance properties, but if one or more parameters is not provided,\
    \ there is a fallback. These instance properties then shadow or mask the inherited\
    \ properties. So you have the best of both worlds.\n\nlive code: http://jsfiddle.net/javascriptlightenment/BmeEA/\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar Person = function(legs,\
    \ arms) {\n  // shadow prototype value\n  if (legs !== undefined) {this.legs =\
    \ legs;\n  if (arms !== undefined) {this.arms = arms;\n  }\n\nPerson.prototype.legs\
