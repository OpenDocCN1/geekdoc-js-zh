- img_proc: true
  md: "+   * asin()\n* atan()\n* anat()\n* ceil()\n* cos()\n* exp()\n* floor()\n*\
    \ log()\n* max()\n* min()\n* pow()\n* random()\n* round()\n* sin()\n* sort()\n\
    * tan()\n\n# # Math is not a constructor function\n\nThe Math object is unlike\
    \ the built-in objects that are instantiated. Math is a one-off object created\
    \ to house static properties and methods, ready to be used when dealing with numbers.\
    \ There is no way to create an instance of Math, as there is no constructor.\n\
    \n# # Math has constants you cannot augment/mutate\n\nMany of the Math properties\
    \ are constants that cannot be mutated. Since this is a departure from the mutable\
    \ nature of JavaScript, these properties are in all-caps (e.g. Math.PI.). Do not\
    \ confuse property constants for constructor functions due to the capitalization\
    \ of their first letter. They are simply object properties that cannot be changed.\n\
    \n> Notes\n\n User-defined constants are not possible in JavaScript 1.5, ECMA-262,\
    \ edition 3."
  merge: -1
