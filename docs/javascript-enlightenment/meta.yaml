    \ = new Array(); // myArray 是 Array 的实例\n\n// myArray 是一个对象以及 Array 的实例\nconsole.log(typeof\
    \ myArray); // logs object!\nconsole.log(myArray); // logs []\n\nconsole.log(myArray.constructor);\
    \ // logs Array()\n</script></body>></html\n```\n\n在 JavaScript 中，大多数值（排除原始值）都涉及从构造函数创建或实例化的对象。从构造函数返回的对象被称为实例。请确保你熟悉这些语义，以及利用构造函数来构建对象的模式。\n\
    \n# JavaScript 原生/内置对象构造函数\n\nJavaScript 语言包含了九个原生（或内置）构造函数。这些对象被 JavaScript 用于构建语言，我所说的“构建”是指这些对象被用于在\
    \ JavaScript 代码中表示值。因此，原生构造函数是多功能的，它们既产生对象，又在作为构造函数调用时用于创建其他对象。下面列出了 JavaScript\
    \ 预装的九个构造函数：\n\n- `Number()`\n- `String()`\n- `Boolean()`\n- `Object()`\n- `Array()`\n\
    - `Function()`\n- `Date()`\n- `RegExp()`\n- `Error()`\n\nJavaScript 大部分基于这九个对象（以及字符串、数字和布尔值）。详细了解这些对象是利用\
    \ JavaScript 独特力量和灵活性的关键。\n\n> 注意\n> Math 对象是一个例外。它是一个静态对象，而不是构造函数，意味着你不能这样做：`var\
    \ x = new Math()`。你可以使用已经实例化的它（例如：`Math.PI`）。实际上，Math 只是由 JavaScript 设置的用于存放函数的对象。\n\
    > 原生对象有时被称为“全局对象”，因为它们是 JavaScript 可供使用的对象。不要将“对象”这一术语与全局对象混淆，例如所有浏览器中的 `window`\
    \ 对象。\n> `Number()`、`String()` 和 `Boolean()` 构造函数不仅构建对象，还根据利用构造函数的方式为字符串、数字和布尔提供原始值。如果你直接调用这些构造函数，返回的是一个复杂对象。如果你在代码中简单地表示数字、字符串或布尔值（原始值，如\
    \ 5、\"foo\" 和 true），那么构造函数将返回原始值而不是复杂对象值。\n\n# 用户定义的/非原生对象构造函数\n\n正如你在 `Person()`\
    \ 构造函数看到的那样，我们可以编写自己的构造函数，从中产生多个自定义对象。\n\n下面我展示了 `Person()` 构造函数：\n\n```javascript\n\
    line code: http://jsfiddle.net/javascriptenlightenment/GLMR8/\n<!DOCTYPE html><html\
