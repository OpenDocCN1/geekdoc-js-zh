  md: "The JavaScript language contains nine native (or built-in) object constructors.\
    \ These objects are used by JavaScript to construct the language, and by \"construct\"\
    \ I mean these objects are used to express object values in JavaScript code, as\
    \ orchestrate several features of the language. Thus, the native constructors\
    \ are multifaceted in that they produce objects, but are also leveraged in facilitating\
    \ the language's programming conventions. For example, functions are objects created\
    \ from the Function() constructor, but are also used to create other objects when\
    \ called as constructor functions using the new keyword.\n\nBelow, I list the\
    \ nine object constructors that come pre-packaged with JavaScript:\n\n+   * Number()\n\
    * String()\n* Boolean()\n* Object()\n* Array()\n* Function()\n* Date()\n* RegExp()\n\
    * Error()\n\nJavaScript is mostly constructed from just these nine objects (as\
    \ well as string, number, and boolean primitives). Understanding these objects\
    \ in detail is key to taking advantage of JavaScript's unique programming power\
    \ and language flexibility.\n\n> Notes\n The Math object is the oddball. It's\
    \ a static object, rather than a constructor function, meaning you cannot do this:\
    \ var x = new Math().\n You can use it if it has already been instantiated (e.g.\
    \ Math.Pi). Truly, Math is just an object namesake set up by JavaScript to house\
    \ math functions.\n The native objects are sometimes referred to as \"global objects\"\
    \ since they are the objects that JavaScript has made available for use. Do not\
    \ confuse the term object with the \"head\" global object that is the topmost\
    \ level of scope, for example, the window object in all browsers.\n The Number(),\
    \ String(), and Boolean() constructors not only construct objects; they also provide\
    \ a primitive value for a string, number and boolean, depending on how the constructor\
    \ is leveraged. If you called these constructors directly, a complex object is\
    \ returned. If you simply express a number, string, or boolean value in your code\
    \ (primitive values like 5, \"foo\" and true), then the constructor will return\
    \ a primitive value instead of a complex object value."
