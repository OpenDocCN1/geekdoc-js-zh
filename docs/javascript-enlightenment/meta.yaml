  - '[PAGE 49]


    ```

    var myArray = [''foo'', ''bar''];


    console.log(myArray.hasOwnProperty(''join'')); // logs false


    <script></body></html>

    ```


    No it does. My myArray has access to the join() method as if it were its own property.
    What happened here? Well, you observed the prototype chain in action. We accessed
    a property that, although not contained in the myArray object, could be found
    by JavaScript somewhere else. That somewhere is very specific. The Array() constructor
    was created by JavaScript, the join() method added (among others) as a property
    of the prototype of Array().


    To reiterate, if you try to access a property on an object that does not contain
    it, JavaScript will search the prototype chain for this value. First It will look
    at the constructor function that created the object (e.g. Array), and inspect
    the prototype (e.g. Array.prototype) to see if the property can be found. If the
    first prototype does not have the property, JavaScript keeps searching up the
    chain at the constructor before the initial constructor. It can do all the way
    to the end of the chain.


    Where does the chain end? Let''s examine the example again, invoking the toString()
    method on myArray.


    > live code: http://jsfiddle.net/javascriptenenment/vwMe/


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    // Array & Array.prototype contains no toString() method

    var myArray = [''foo'', ''bar''];


    // toString() is actually defined on Object.prototype.toString()

    console.log(myArray.toString()); // logs `foo,bar`


    </script></body></html>

    ```


    The toString() method is not defined within the myArray object. So, the prototype
    chaining rule is invoked and JavaScript looks for the property in the Array constructor''s
    prototype property (e.g. Array.prototype). It is not there, so the chain is invoked
    and we look for the property in the Object() prototype property (Object.prototype).
    And yes, it is found. If it had not been found, JavaScript would have produced
    an error stating that the property was undefined.


    Since all prototype properties are objects, the final link in the chain is Object.prototype.
    There is no other constructor prototype property that can be examined.'
