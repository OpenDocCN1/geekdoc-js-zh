    # Primitive (aka simple) values


    The JavaScript values 5, `foo`, `true`, `false`, as well as `null` and `undefined`,
    are considered primitive because they are `irreducible`. That is, a number is
    a number, a string is a string, a boolean is either true or false, and `null`
    and `undefined` are just that, values are inherently simple, and do not represent
    values that can be made up of other values.


    Examine the code below and ask yourself if string, number, `null`, and `undefined`
    values could be more complex. Contrast this to what you know of `Object()` instance
    or `Array()` or really any complex object.


    > live code: http://jsfiddle.net/javascriptenlightenment/xUQTC/


    ```

    <!DOCTYPE html><html lang="en"><body><script>

    var myString = ''string'';

    varNumber = 10;

    var myBoolean = false; // could be true or false, but that is it

    var myNull = null;

    var myUndefined = undefined;


    console.log(myString,myNumber,myBoolean,myNull,myUndefined);


    /* Consider that a complex object array or object can be made up of multiple primitive
    values, and thus becomes a complex set of multiple values. */


    var myObject = {

    myString: ''string'',

    myNumber: 10,

    myBoolean: false,

    myNull: null,

    myUndefined: undefined

    };


    console.log(myObject);


    var myArray = [''string'', 10, false, null, undefined];


    console.log(myArray);


    </script></body></html>

    ```'
