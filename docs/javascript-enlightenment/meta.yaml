    # Why care about the prototype property?


    You should care about the prototype property for three reasons.


    Reason 1:


    The first reason is that the prototype property is used by the native constructor
    functions (e.g. Object(), Array(), Function(), etc.) to allow constructor instances
    to inherit properties and methods. It is the mechanism that JavaScript itself
    to allow objects to inherit properties and methods from the constructor function''s
    prototype. If you want to understand JavaScript better, need to understand how
    JavaScript itself leverages the prototype object.


    Reason 2:


    When creating-defined constructor functions, you can orchestrate inheritance the
    same way JavaScript native objects do. But first you have to grow how it works.


    Reason 3:


    You might really prototypal inheritance or prefer another pattern for object inheritance,
    but the reality is that someday you might have to edit or manage someone else''s
    code who thought prototypal inheritance was the bee''s knees. When this happens,
    you should be aware of how prototypal inheritance works, as well as how it can
    be replicated by developers who make use of custom constructor functions.


    Reason 4:


    By using prototypal inheritance, you can create efficient object instances that
    all leverage the same methods. As already mentioned, not all array objects, which
