  - "[PAGE 56]\n\n# Chapter 3 - Object()\n\n# Conceptual overview of using Object()\
    \ objects\n\nUsing the built-in Object() constructor function, we can create generic\
    \ empty objects on the fly. In fact, if you remember back to the beginning of\
    \ Chapter 1, this is exactly what we did by creating the cody object. Let's re-create\
    \ the cody object.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_56_0.png)\n\n```\n\
    <!DOCTYPE html lang=\"en\"><body><script>\nvar cody = new Object(); // create\
    \ an empty object with no properties\n\nfor (key in cody) { // confirm that cody\
    \ is an empty generic object\nif(cody.hasOwnProperty(key)) {\n  console.log(key);\
    \ // should not see any logs, because cody itself has no properties\n}\n}\n</script></body></html>\n\
    ```\n\nHere, all we are doing is the Object() constructor function to create a\
    \ generic object called cody. You can think of the Object() constructor as a cookie\
    \ cutter for creating empty objects that have no predefined properties or methods\
    \ (except, of course, those inherited from the prototype chain).\n\n# Notes\n\n\
    +   - If it's not obvious, the Object() constructor is an object itself. That\
    \ is, the function is based on an object created from the Function constructor.\
    \ This can be confusing. Just remember like the Array constructor, the Object\
    \ constructor simply puts blank objects. And, you can create all the empty objects\
    \ you like. However, creating an empty object like cody is very different than\
    \ creating your own constructor function with predefined properties. Make sure\
    \ that cody is just an empty object based on the Object() constructor. To harness\
    \ the power of JavaScript, you will need to grow not how to create empty object\
    \ containers from Object(), but also how to build your own \"class\" of objects\
    \ (e.g. Person()) which the Object() constructor function itself."
