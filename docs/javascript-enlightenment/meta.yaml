    # Conclusion


    It''s my hope that after reading this book, you will be equipped to either better
    understand your JavaScript library of choice, or better yet, be equipped to write
    your own JavaScript solutions. Either way this book alone was not written to be
    a definitive guide to the language. From here, I would recommend reading, or re-reading,
    the following books so that the topics here may be reinforced by a different voice,
    and additional JavaScript topics may be examined and explored.


    - JavaScript: The Good Parts, by Douglas Crockford

    - JavaScript Patterns, by Stoyan Stefanov

    - Object-Oriented JavaScript, by Stoyan Stefanov

    - Professional JavaScript for Web Developers, by Nicholas C. Zakas

    - High Performance JavaScript, by Nicholas C. Zakas

