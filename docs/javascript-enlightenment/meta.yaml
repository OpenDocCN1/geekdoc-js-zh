    </script></body></html>\n```\n\n这里的结论是，当 `this` 在包含在原型对象的方法中使用时，它用于引用实例。如果实例不包含该属性，则将开始原型查找。\n\
    \n- 如果实例或 `this` 指向的对象不包含被引用的属性，将适用于任何属性查找的规则，该属性将在原型链上被“查找”。在我们的示例中，如果实例中不包含\
    \ `fullName` 属性，则会在 `Person.prototype.fullName` 查找，然后是 `Object.prototype.fullName`。\n\
    \n# 第 7 章 - 作用域与闭包\n\n## 作用域的概念概述\n\n在 JavaScript 中，作用域是代码执行的上下文，共有三种作用域：全局作用域、函数作用域和\
    \ eval 作用域。\n\n当 JavaScript 查找变量关联的值时，会遵循一条查找链。这条链基于作用域的层级结构。在下面的代码中，我正在打印来自 `func2`\
