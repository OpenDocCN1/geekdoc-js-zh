    # Chapter 14 - Undefined


    ## Conceptual overview of the undefined value


    The undefined value is used by JavaScript in two slightly different ways.


    The first way it''s used is to indicate that a declared variable (e.g. var foo)
    has no assigned value. The second way it''s used is to indicate that an object
    property you''re trying to access is not defined (i.e. it has not even been named),
    and is not found in the prototype chain.


    Below, I examine both usages of undefined by JavaScript.


    ![](img/ad11d036d555f7d1771aeb8c30e67ba2_133_0.png)


    ```html

    <!DOCTYPE html><html lang="en"><body><script>

    var initializedVariable; // declare variable

    console.log(initializedVariable); // logs undefined

    console.log(typeof initializedVariable); // confirm that JavaScript returns undefined

    var foo = {};

    console.log(foo.bar); // logs undefined, no bar property in foo object

    console.log(typeof foo.bar); // confirm that JavaScript returns undefined

    </script></body></html>

    ```


    # Notes


    - It is considered a good practice to allow JavaScript alone to use undefined.
    You should never find yourself setting a value to undefined, as foo = undefined.
    Instead, null should be used if you are specifying that a property or variable
    value is not available.


    # JavaScript ECMA-262 edition 3 (and later) declares the undefined variable in
    the global scope


    Unlike previous versions, JavaScript ECMA-262 edition 3 (and later) has a global
    variable called undefined declared in the global scope. Because the variable is
    declared, and not assigned a value, the undefined variable is set to undefined.


    live code: http://jsfiddle.net/javascriptenlight/MhRkB/


    ```html

    <!DOCTYPE html><html lang="en"><body><script>


    // confirm that undefined is a property of the global scope

    console.log(undefined in this); // logs true


    </script></body></html>

    ```


    # Chapter 15 - Math Function


    ## Conceptual overview of the built in Math Object


    The Math object contains static properties and methods for mathematically dealing
    with numbers or mathematical constants (e.g. Math.PI). This object is built into
    JavaScript, as opposed to being based on a Math() constructor that creates math
    instances.


    > Notes

    > It might seem odd that Math starts with a capitalized letter since you do not
    instantiate an instance of a Math object. Do not be thrown off by this. Simply
    be aware that JavaScript sets this up for you.


    # Math properties and methods


    The Math object has the following properties and methods:


    Properties (e.g. Math.PI):


    - E

    - LN2

    - LN10

    - LOG2E

    - LOG10E

    - PI

    - SQRT1_2

    - SQRT2


    Methods (e.g. Math.random()):


    - abs()

    - acos()

    - asin()

    - atan()

    - anat()

    - ceil()

    - cos()

    - exp()

    - floor()

    - log()

    - max()

    - min()

    - pow()

    - random()

    - round()

    - sin()

    - sort()

    - tan()


    # Math is not a constructor function


    The Math object is unlike the built-in objects that are instantiated. Math is
    a one-off object created to house static properties and methods, ready to be used
    when dealing with numbers. There is no way to create an instance of Math, as there
    is no constructor.


    # Math has constants you cannot augment/mutate


    Many of the Math properties are constants that cannot be mutated. Since this is
    a departure from the mutable nature of JavaScript, these properties are in all-caps
    (e.g. Math.PI.). Do not confuse property constants for constructor functions due
    to the capitalization of their first letter. They are simply object properties
    that cannot be changed.


    > Notes

    > User-defined constants are not possible in JavaScript 1.5, ECMA-262, edition
    3.


