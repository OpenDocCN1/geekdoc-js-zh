    # Notes


    The term "complex object" has also been expressed in other writings as "complex
    objects" or "reference types". If it''s not obvious all

    these names describe the nature of a JavaScript value excluding primitive values.
    Primitive values are not "referenced by value" and can

    not represent a composite (i.e. thing made up of several parts or elements) of
    other values. While complex objects are "referenced by

    value" and can contain or encapsulate other values.


    # How complex values are stored/copied in JavaScript


    It is extremely important to grok complex values are stored and manipulated by
    reference. When

    creating a variable containing a complex object, the value is stored in memory
    at an address. When you

    reference a complex object, you''re using its name (i.variable or object property)
    to retrieve the value

    at address in memory. The implications are significant when what happens when
    you

    tempt to copy a complex value. Below, we create an object stored in the variable
    gameObject. Then the

    value in gameObject is copied to the variable copyOfObject. Really, it is not
