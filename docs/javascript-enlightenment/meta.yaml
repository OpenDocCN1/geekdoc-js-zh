    # Complex objects are equal by reference


    When comparing complex objects, they are equal only when they reference the same
    object (i.e. have the same address). Two variables containing identical objects,
    are not equal to each other since they do not actually point at the same object.


    Below, objectFoo and objectBar have the same properties and are, in fact, identical
    objects, but when asked if they are equal via JavaScript tells us they are not.


    ```

    <!DOCTYPE html><html lang="en"><body><script>

