    \ this.legs + this.arms);\n\nvar chuck = new Person(0,0);\n\nconsole.log(chuck.countlimbs());\
    \ // logs 0\n\n</script></body></html>\n```\n\n## Creating inheritance chains\
    \ (the original intention)\n\nPrototical inheritance was conceived to allow inheritance\
    \ chains that mimic the inheritance patterns found in traditional object oriented\
    \ programming languages. In order for one object to inherit from another object\
