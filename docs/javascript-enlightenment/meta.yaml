    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar sayHiText = 'howdy';\n\
    var func1 = function() {\n  var func2 = function() {\n    console.log(sayHiText);\
    \ // func2 作用域，但它在全局作用域找到了 sayHiText\n```\n"
