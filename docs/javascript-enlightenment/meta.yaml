  - "[PAGE 86]\n\n# Working around the nested function issue by leveraging the scope\
    \ chain\n\nSo that the this value does not get lost, you can simply use the scope\
    \ chain to keep a reference to this in the parent function. The code below demonstrates\
    \ how, using a variable called that, and leveraging its scope, we can keep better\
    \ track of function context.\n\nlive code: http://jsfiddle.net/javascriptenlight/k8uCu/\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><script>\nvar gameObject = {\n  myProperty\
    \ : 'I can see the light',\n  myMethod : function() {\n    var that = this; //\
    \ store a reference to this (i.e. myObject) in myMethod scope\n    var helperFunction()\
    \ { // child function\n    // logs I can see the light via scope chain because\
    \ that = this\n    console.log(that.myProperty); // logs I can see the light\n\
    \    console.log(this); // logs window object, if we don't use \"that\"\n  }\n\
    }\n\ngameObject.myMethod(); // invoke myMethod\n</script></body></html>\n```\n\
    \n# Controlling the value of this using call() or apply()\n\nThe value of this\
    \ is normally determined from the context in which a function is called (except\
    \ when the new keyword is used – more about a minute), you can overwrite/control\
    \ the value of this using apply() or call() to define what this points to when\
    \ invoking a function. Using these methods is like saying: \"Hey, call X but tell\
    \ the function to use Z object for this.\" By doing so, the default way in JavaScript\
    \ determines the value of this is overridden.\n\nBelow, we create an object and\
    \ a function. We then invoke the function via call() so that the value of this\
    \ inside the function uses gameObject as its context. The statements inside the\
    \ myFunction function will populate gameObject with properties instead of populating\
    \ the head object. We have altered the object to which this (inside of myFunction)\
    \ refers."
  - "[PAGE 87]\n\n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\nvar myObject\
    \ = {};\n\nvar myFunction = function(param1, param2) {\n  // set via call('this')\
