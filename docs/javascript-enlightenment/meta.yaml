    # Creating shorthand/literal values from constructors


    JavaScript provides shortcuts — called "literals" — for manufacturing of the native
    object values without having to use new Foo() or new Bar(). For the most part,
    the literal syntax accomplishes the same thing as using the new operator. The
    exceptions are: Number(), String(), and Boolean() — see notes below.


    If you come from other programming backgrounds, you are likely more familiar with
    the literal way of creating objects. I, instantiate the native JavaScript constructors
    using the new operator and create corresponding literal equivalents.'
