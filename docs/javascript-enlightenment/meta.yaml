    \ 和 `codyB` 具有相同的对象值，尽管它们的生成方式不同。\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_18_0.png)\n\
    \n```javascript\n<!DOCTYPE html><html lang=\"en\"><body<script>\n\n// 使用 Object()\
    \ 构造函数创建一个 cody 对象\n\nvar codyA = new Object();\ncodyA.living = true;\ncodyA.age\
    \ = 33;\ncodyA.gender = 'male';\ncodyA.getGender = function() {return codyA.gender};\n\
    \nconsole.log(codyA); // logs Object {living=true, age=33, gender=\"male\", ...}\n\
    \n/* 在下方创建了相同的 cody 对象，但不是使用原生的 Object()\n构造函数来创建一个一次性的 cody，而是先定义了自己的 Person()\
    \ 构造函数，它可以\n创建一个 cody 对象（以及任何我们喜欢的 Person 对象），然后用\n\"new\" 来实例化它。 */\n\nvar Person\
    \ = function(living, age, gender) {\nthis.living = living;\nthis.age = age;\n\
    this.gender = gender;\nthis.getGender = function() {return this.gender};\n};\n\
    \n// logs Object {living=true, age=33, gender=\"male\", ...}\n codyB = new Person(true,\
    \ 33, 'male');\n\nconsole.log(codyB)\n</script></body>></html>\n```\n\n`codyA`\
    \ 和 `codyB` 对象之间的主要区别于对象本身，而在于用于生成它们的构造函数。`codyA` 对象是通过 `Object()` 构造函数的实例产生的。构建\
    \ `codyB` 的 `Person()` 构造函数也可以被用作强大的、集中式定义的对象“工厂”，用于创建更多的 `Person()` 对象。为生产自定义对象构建自己的构造函数还为\
    \ `Person` 实例设置了原型继承。\n\n这两种解决方案都创建了相同的复杂对象。这两种模式是构建对象最常用的模式。\n\nJavaScript 实际上是一门预装了几个原生构造函数的语言，这些构造函数用于产生表示非常特定类型值（例如：数字、字符串、函数、对象、数组……）的复杂对象，同时也通过\
    \ `Function()` 对象提供原材料，用于刻画用户定义的对象构造函数（例如：`Person()`）。最终结果——无论创建对象的模式如何——通常都是创建一个复杂对象。\n\
    \n理解对象的创建、本质和用法，以及它们的原始等价物，是本书其余部分的重点。\n\n# JavaScript 构造函数构建并返回对象实例\n\n构造函数的作用是创建多个共享某些特质和行为的对象。基本上，构造函数就像一个饼干模具，用于生产具有默认属性和属性方法的对象。\n\
    \n如果你说：“构造函数仅仅是一个函数，”那么我会回答：“你是对的——除非该函数使用 `new` 关键字被调用（例如：`new String('foo')`）。当这种情况发生时，函数就承担了一个特殊的角色，JavaScript\
    \ 将该函数视为将 `this` 的值设置为正在构造的新对象。除了这种特殊行为外，该函数默认会在值 `false` 内部返回新创建的对象（即 `this`）。从函数返回的新对象被认为是构造它的该值函数的实例。\n\
    \n再次考虑 `Person()` 构造函数，但这次阅读下面的代码注释，它们突显了 `new` 关键字的效果。\n\n```javascript\n<!DOCTYPE\
    \ html><html lang=\"en\"><body<script>\n\n/* Person 是一个构造函数。它的编写意图是配合 new 关键字使用。\
