  md: "# The keyword this inside a prototype method refers to a constructor instance\n\
    \nWhen used in functions added to a constructor's prototype property, this refers\
    \ to the instance on which the method is invoked. Say we have a custom Person()\
    \ constructor function. As a parameter, it requires the Person's full name. In\
    \ case we need the full name of the person, we add a whatMyFullName method to\
    \ the Person.prototype, so that all Person instances inherit the method. When\
    \ using this, the method can refer to the instance invoking (and thus its properties).\n\
    \nHere I demonstrate the creation of two Person objects (cody and lisa) and the\
    \ inherited whatMyFullName method that contains the this keyword to access the\
    \ instance.\n\nlive code: http://jsfiddle.net/javascriptenlight/uV3sP/\n\n```\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\nvar Person = function(x){\n \
    \ if(this.fullName = x);\n}\n\nPerson.prototype.whatMyFullName = function(){\n\
    \  return this.fullName; // 'this' refers to the instance created from Person\n\
    }\n\nvar cody = new Person('cody lindley');\nvar lisa = new Person('lisa lindley');\n\
    \n// call the inherited whatMyFullName method, which uses this to refer to the\
    \ instance\nconsole.log(cody.whatMyFullName(), lisa.whatMyFullName());\n\n/* The\
    \ prototype chain is still in effect, so if the instance does not have a fullName\n\
    property, it will look it in the prototype chain. Below, we add a fullName property\n\
    to both the Person prototype and the Object prototype. See notes. */\n\nObject.prototype.fullName\
    \ = 'John Doe';\nvar john = new Person(); // no argument is passed so fullName\
    \ is not added to instance\nconsole.log(john.whatMyFullName()); // logs 'John\
    \ Doe'\n\n</script></body></html>\n```\n\nThe takeaway here is that this is used\
    \ to refer to instances when used inside a method contained in the prototype object.\
    \ If the instance does not contain the property, the prototype lookup begins.\n\
    \n+   - If the instance or the object pointed to by this does not contain the\
    \ property being referenced, the rules that apply to any property\nlookup get\
    \ applied and the property will be \"looked up\" on the prototype chain. In our\
    \ example, if fullName property was not\ncontained within our instance then fullName\
    \ would be looked for at Person.prototype.fullName then Object.prototype.fullName."
