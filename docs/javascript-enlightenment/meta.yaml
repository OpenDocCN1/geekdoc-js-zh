  md: "# Chapter 6 - The this Keyword\n\n# Conceptual overview of this and how it\
    \ refers to objects\n\nWhen a function is created, a keyword called this is created\
    \ (behind the scenes), which links to the object in which the function operates.\
    \ Another way, this is available to the scope of its function, yet is a reference\
    \ to the object of that function is a property/method.\n\nLet's take a look at\
    \ the cody object from Chapter 1 again:\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_82_0.png)\n\
    \n```\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar cody = {\n  living\
    \ : true,\n  age : 23,\n  gender: 'male',\n  getGender: function() { return cody.gender;};\n\
    }\nconsole.log(cody.getGender()); // logs 'male'\n</script></body></html>\n```\n\
    \nNotice how inside of the getGender we are accessing the gender property using\
    \ dot notation (e.g. cody.gender) on the cody object itself. This can be rewritten\
    \ using this to access the cody object because this points to the cody object.\n\
    \n![](img/ad11d036d555f7d1771aeb8c30e67ba2_82_1.png)\n\n```\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\nvar cody = {\n  living: true,\n  age: 23,\n  gender:\
    \ 'male',\n  getGender: function() { return this.gender;};\n}\nconsole.log(cody.getGender());\
    \ // logs 'male'\n```"
