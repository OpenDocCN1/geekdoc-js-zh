- md: '

    # About the Author


    Cody Lindley is a client-side engineer (aka front-end developer) and recovering
    Flash developer. He has an extensive background working professionally (11+ years)
    with HTML, CSS, JavaScript, Flash, and client-side performance techniques as it
    pertains to web development. If he is not wielding client-side code he is likely
    toying with interface/interaction design or authoring material and speaking at
    various conferences. When not sitting in front of a computer, it is a sure bet
    he is hanging out with his wife and kids in Boise, Idaho – training for triathlons,
    skiing, mountain biking, road biking, alpine climbing, reading, watching movies,
    or debating the rational evidence for a Christian worldview.


    # About the Technical Editors


    ### Michael Richardson


    Michael Richardson is a web and application developer living in Boise, Idaho.
    Way back when, he got an MFA in creative writing from Sarah Lawrence and published
    a novel in 2003 called Plans for a Mushroom Radio. These days, when he''s not
    spending quality time with his lovely wife and rascal kid, he''s managing his
    little web-based application called Timeglider.


    ### Kyle Simpson


    Kyle Simpson is a JavaScript Systems Architect from Austin, TX. He focuses on
    JavaScript, web performance optimization, and "middle-end" architecture particular.
    If something can''t be done in JavaScript or web stack technology, he''s probably
    bored by it. He runs several open-source projects, including LABajs, Handlebar.JS,
    and BlockchainJS. Kyle works as a Software Engineer on the Development Tools team
    for Mozilla.


    ### Nathan Smith


    Nathan Smith is a UX developer at HP. He holds a MDiv from Asbury Theological
    Seminary. He began building sites last century and enjoys hard coding HTML, CSS,
    and JavaScript. He created the 960 Grid System, a design and CSS framework for
    sketching, designing, and coding page layouts. He also made Formalize, a JavaScript
    and CSS framework that endeavors to bring sanity to form styling.


    ### Ben Nadel


    Ben Nadel is the chief software engineer at Epicenter Consulting, a Manhattan-based
    web development firm specializing in innovative custom software that transforms
    the way its clients do business. He is also an Adobe Community Professional as
    well as an Adobe Certified Professional in Advanced ColdFusion. In his spare time,
    he blogs extensively about all aspects of obsessively thorough web application
    development at www.bennadel.com.


    ### Ryan Florence


    Ryan Florence is a front-end web developer from Salt Lake City, Utah and has been
    creating websites since the early 90''s. He is especially interested in creating
    experiences that are pleasing to both the end user and the developer inheriting
    the project. Ryan is active in the JavaScript community writing plugins, contributing
    to popular JavaScript libraries, speaking at conferences & meet-ups, and writing
    about it on the web. He currently works as a Senior Technical Consultant at Clock
    Four.


    ### Nathan Logan


    Nathan Logan has been a professional web developer for 8 years. His focus is on
    client-side technologies, but he also digs the server-side. He currently works
    for Molomane alongside the author of this book. Personally, Nathan is blessed
    with a wonderful wife and son, and enjoys mountain biking, hot springs, spicy
    food, scotch, and Christian faith/theology.


    # Introduction


    This book is not about JavaScript design patterns or implementing an object-oriented
    paradigm with JavaScript code. It was not written to distinguish the good features
    of the JavaScript language from the bad. It is not meant to be a complete reference
    guide. It is not targeted at people new to programming or those completely new
    to JavaScript. Nor is this a cookbook of JavaScript recipes. Those books have
    been written.


    It was my intention to write a book to give the reader an accurate JavaScript
    worldview through an examination of native JavaScript objects and supporting nuances:
    complex values, primitive values, scope, inheritance, the head object, etc. I
    intend this book to be a short and digestible summary of the ECMA-262, Edition
    3 specification, focused on the nature of objects in JavaScript.


    If you are a designer or developer who has only used JavaScript under the mantle
    of libraries (such as jQuery, Prototype, etc), it is my hope that the material
    in this book will transform you from a JavaScript library user into a JavaScript
    developer.


    # Why did I write this book?


    First, I must admit that I wrote this book for myself. Truth be told, I crafted
    this material so I could drink my own Kool-Aid and always remember what it tastes
    like. In other words, I wanted a reference in my own words to know my memory.
    Additionally:


    - Libraries facilitate a "black box" syndrome that can be beneficial in some regards
    but detrimental to others. Things may get done fast and efficiently but you know
    no how or why. And the how and why really matter when things goes wrong or performance
    becomes an issue. The fact is that anyone who intends to implement a JavaScript
    library or framework when building a web application (or just a good signup) should
    look under the hood and understand the engine. This book was written for those
    who want to pop the book and get their hands dirty in JavaScript.


    - Mozilla has provided the up-to-date and complete reference guide for JavaScript
    1.5. I believe what is missing is a digestible document, written from a single
    point of view, to go along with their reference guide. It is my hope that this
    book serve as a "what you need to know" manual for JavaScript values, detailing
    concepts beyond what the Mozilla reference covers.


    - Version 1.5 of JavaScript is going to be around for a fair amount of time, but
    as we move towards the new additions to the language found in ECMA edition 5,
    I wanted to document the cornerstone concepts of JavaScript that will likely be
    perennial.


    - Advanced technical books written about programming languages are often full
    of monolithic code. I prefer short explanations to get to the point, backed by
    real code. I coined a term "thin-slicing," to describe what I am attempting in
    this book.


    - Most JavaScript books worth reading are three inches thick. I hope to create
    a book that focuses on the important stuff without being exhaustive.


    # Who should read this book?


    This book is targeted at two types of people. The first is an advanced beginner
    or intermediate JavaScript developer who wishes to solidify his or her understanding
    of the language. The second type is JavaScript library veteran who is ready to
    look behind the curtain. This book is not ideal for novices to programming.


    # Why JavaScript 1.5 & ECMA-262 Edition 3?


    In this book, I focus on version 1.5 of JavaScript (equivalent to ECMA-262 Edition
    3) because it is the most widely implemented version to date. The next version
    of this book will certainly be geared towards the up-coming ECMA 5.


    # Why didn''t I cover Date(), Error(), RegEx()?


    Like I said, this book is not an exhaustive reference guide. Rather it focuses
    on objects as a lens through which understand JavaScript. So I have not decided
    to cover Date(), Error(), or RegEx() objects because, as useful as they are, grasping
    the details of these objects will not break your general understanding of objects
    in JavaScript. My hope is that you simply apply what you learn here to all objects
    available in the environment.


    # Preface


    Before you begin, it is important to understand various styles employed in this
    book. Please do not skip this section because it contains important information
    that will aid you as you read the book.


    # More code, less words


    Please examine the code examples in detail. The text should be viewed as secondary
    to the code itself. It is my opinion that a code example is worth a thousand words.
    Do not worry if you''re confused by explanations. Examine the code. Tinker with
    it. Reread the code comments. Repeat this process until the concept being explained
    becomes clear. I hope you achieve a level of expertise such that well-documented
    code is all you need to grok a concept.


    # Exhaustive code and repetition


    You will probably curse me for repeating myself and for being so comprehensive
    with my code examples. And while I might deserve it, I prefer to err on the side
    of being exact, verbose, and repetitive, than make false assumptions others make
    about their reader. Yes, both can be annoying, depending upon what knowledge you
    bring to the subject, but they can also serve a useful purpose for those who want
    to learn a subject in detail.


    # Color-coding Conventions


    In the JavaScript code examples (example shown below), orange is used to highlight
    code directly relevant to the concept being discussed. Any additional code used
    to support the orange colored code will be green. The color gray in the code examples
    is reserved for JavaScript comments (example shown below).


    ```

    <!DOCTYPE html><html lang="en"><<body><script>

    ```

    '
