- md: "\n});\n};\n\n<script></</body>></html>\n\nHow is the value of sayHiText found\
    \ when it is not contained inside the scope of the func2 function?\nJavaScript\
    \ first looks in the func2 function for a variable named sayHiText. Not finding\
    \ func2 there, it looks up to func2's parent function, func1. The say-HiText variable\
    \ is not found in the func1 scope, either, so JavaScript continues to the global\
    \ scope where sayHiText is found, at which point the value of sayHiText is delivered.\
    \ If sayHiText had not been defined in the global scope, undefined would have\
    \ been returned by JavaScript.\n\nThis is such an important concept to grep. Let's\
    \ examine another code example. Below, we grab three from three different scopes.\n\
    \n![](img/ad11d036d555f7d1771aeb8c30e67ba2_94_0.png)\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\nvar x = 10;\nvar foo = function() {\nvar y = 20;\n\
    var bar = function() {\nvar z = 30;\nconsole.log(z + y + x); // z is local, y\
    \ & z are found in the scope chain\n});\n});\n\nfoo(); // logs 60\n\n<script></</body>></html>\n\
    ```\n\nThe value for z is local to the bar function and the context in which the\
    \ console.log is invoked, the value for y in the foo function, which is the parent\
    \ of bar(), and the value for x is in the global scope. All of these are accessible\
    \ to the bar function via the scope chain. Make sure you understand that referencing\
    \ variables in the bar function will check all the way up the scope chain for\
    \ the variables.\n\n- The scope chain, if you think about it, is not different\
    \ from the prototype chain. Both are simply a way for a value to be looked up\
    \ by checking a systematic and hierarchical set of locations.\n\n## The scope\
    \ chain lookup returns the first found value\n\nIn the code below, a variable\
    \ called x exists in the same scope in which it is examined with console.log.\
    \ This \"local\" value of x is used, and one might say that it shadows, or masks,\
    \ the identically-named variables found further up the scope chain.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_95_0.png)\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar x = false;\nvar\
    \ foo = function() {\n  var x = false;\n  bar = function() {\n    var x = true;\n\
    \    console.log(x); // local x is first in the scope so it shadows the rest\n\
    \  }\n}\nfoo(); // logs true\n</script></body></html>\n```\n\nRemember the scope\
    \ lookup ends when the variable is found in the nearest available link of the\
    \ chain, even if the same variable name is used further up the chain.\n\n## Scope\
    \ is determined during function definition, not invocation\n\nSince functions\
    \ determine scope and functions can be passed around just like any JavaScript\
    \ value, one might think that deciphering the scope chain is complicated. It is\
    \ actually very simple. The scope chain is decided based on the location of a\
    \ function during definition, not invocation. This is also called lexical scoping.\
    \ Long and hard about this, as most people stumble over a lot in JavaScript code.\n\
    \nThe scope chain is created before you invoke a function. Because of this, we\
    \ can create closures. For example, we can have a function return a nested function\
    \ to the global scope, your function can still access, via the scope chain, its\
    \ parent function's scope. Below, we define a parentFunction that returns an anonymous\
    \ function, and we called the return from the global scope. Because our anonymous\
    \ function was defined as being contained inside parentFunction, it still has\
    \ access to parentFunction's scope when it is invoked. This is called a closure.\n\
    \n![](img/ad11d036d555f7d1771aeb8c30e67ba2_95_1.png)\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\nvar parentFunction = function() {\n  var foo =\
    \ 'foo';\n  return function() { // anonymous function returned\n    console.log(foo);\
    \ // logs 'foo'\n  }\n}\n\n// nestedFunction refers to the nested function returned\
    \ from parentFunction\nvar nestedFunction = parentFunction();\n\nnestedFunction();\
    \ // logs foo because the returned function accesses foo via the scope chain\n\
    \n</script></body></html>\n```\n\nThe scope chain is decided based on the location\
    \ of a function during definition, not invocation. This is also called lexical\
    \ scoping. Long and hard about this, as most people stumble over a lot in JavaScript\
    \ code.\n\nThe scope chain is created before you invoke a function. Because of\
