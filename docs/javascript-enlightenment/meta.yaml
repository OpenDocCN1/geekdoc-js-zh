    \ does not delete properties that are found on the prototype chain.\n- Deleting\
    \ is the only way to actually remove a property from an object. Setting the property\
    \ to `undefined` or `null` only changes the value of a property. It does not remove\
    \ the property from the object.\n\n## How references to object properties are\
    \ resolved\n\nIf you attempt to access a property that is not contained in an\
