    \ {\n func1: function() {\n  console.log(this); // logs window\n...`\nActually,\
    \ I'll just output the result.\n\n[content]\n- Being explicit (e.g. window.alert()\
    \ v.s. alert()) costs a little bit more with regards to performance (how fast\
    \ the code runs). It's faster if you rely on the scope chain alone and avoid explicitly\
    \ referencing the head even if you know the property you want is contained in\
    \ the global scope.\n\n## Chapter 6 - The this Keyword\n\n## Conceptual overview\
    \ of this and how it refers to objects\n\nWhen a function is created, a keyword\
    \ called this is created (behind the scenes), which links to the object in which\
    \ the function operates. Another way, this is available to the scope of its function,\
    \ yet is a reference to the object of that function is a property/method. \n\n\
    Let's take a look at the cody object from Chapter 1 again:\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_82_0.png)\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar cody = {\n  living\
    \ : true,\n  age : 23,\n  gender: 'male',\n  getGender: function() { return cody.gender;};\n\
    }\nconsole.log(cody.getGender()); // logs 'male'\n</script></</body>></html>\n\
    ```\n\nNotice how inside of the getGender we are accessing the gender property\
    \ using dot notation (e.g. cody.gender) on the cody object itself. This can be\
    \ rewritten using this to access the cody object because this points to the cody\
    \ object.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_82_1.png)\n\n```html\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\nvar cody = {\n  living: true,\n  age:\
    \ 23,\n  gender: 'male',\n  getGender: function() { return this.gender;};\n}\n\
    console.log(cody.getGender()); // logs 'male'\n</script></body></body></html>\n\
    ```\n\nThe `this` used in `this.gender` simply refers to the `cody` object on\
    \ which the function is operating.\n\nThe topic of `this` can be confusing, but\
    \ it does not have to be. Just remember that, in general, `this` is used inside\
    \ functions to refer to the object is contained within, as opposed to the itself\
    \ (exceptions include using the `new` keyword or `call()` and `apply()`).\n\n\
    - The `this` keyword looks and acts like any other variable, except you cannot\
    \ modify it.\n- As opposed to `arguments` and any parameters sent to the function,\
    \ `this` is a keyword (not a property) in the call/activation context.\n\n## How\
    \ is the value of `this` determined?\n\nThe value of `this`, passed to all functions,\
    \ is based on the context in which the function is called at `runtime`. Pay attention\
    \ here, because this is one of quirks you just need to memorize.\n\nThe `myObject`\
    \ object in the code below is a property called `sayFoo`, which points to the\
    \ `sayFoo` function. When the `sayFoo` is called from the global scope, `this`\
    \ refers to the `window` object. When it is called as a method of `myObject`,\
    \ `this` refers to `myObject`.\n\nSince `myObject` has a property named `foo`,\
    \ that property is used.\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \nvar foo = 'foo';\nvar myObject = {foo: 'I am myObject.foo'};\n\nvar sayFoo =\
    \ function() {\n  console.log(this['foo']);\n};\n\n// give myObject a sayFoo property\
    \ and have it point to sayFoo function\nmyObject.sayFoo = sayFoo;\n\nmyObject.sayFoo();\
    \ // logs I am myObject.foo\n```\n\nlive code: http://jsbin.com/oxaliq/edit\n\n\
    ```html\nsayFoo(); // logs 'foo'\n\n</script></body></html>\n```\n\nClearly, the\
    \ value of this is based on the context in which the function is being called.\
    \ Consider that both myWeb.sayFoo and sayFoo point to the same function. However,\
    \ depending upon where (i.e. the context) sayFoo() is called from, the value of\
    \ this is different.\n\nIf it helps, here is the same code with the head object\
    \ (i.e window) explicitly used.\n\n```html\n<!DOCTYPE html>html lang=\"en\"><body><script>\n\
    \nwindow.foo = 'foo';\nwindow.myObject = {foo: 'I am myObject.foo.'};\n\nwindow.sayFoo\
    \ = function() {\n  console.log(this.foo);\n};\n\nwindow.myObject.sayFoo = window.sayFoo;\n\
    \nwindow.myObject.sayFoo();\nwindow.sayFoo();\n\n</script></body></html>\n```\n\
    \nMake sure that you pass around functions, or have multiple references to a function,\
    \ you realize that the value of this will change depending upon the context in\
    \ which you call the function.\n\n- Notes\n- All variables except this and arguments\
    \ follow lexical scope.\n\n## The this keyword refers to the head object in nested\
    \ functions\n\nYou might be wondering what happens to this when it is inside of\
    \ a function that is contained inside of another function. The bad news is ECMA3,\
    \ this loses its way and refers to the head object (window object in browsers),\
    \ instead of the object within which the function is defined.\n\nIn the code below,\
    \ this inside of func2 and func3 loses its way and refers not to myObject instead\
    \ to the head object.\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    var myObject = {\n func1: function() {\n  console.log(this); // logs myObject\n\
    \ var func2 = function() {\n  console.log(this); // logs window, and will do so\
    \ from this point on\n  var func3 = function() {\n   console.log(this); // logs\
    \ window, as it's the head object\n   }\n  }\n }\n}\nmyObject.func1();\n</script></body></html>\n\
    ```\n\nThe good news is that this will be fixed in ECMAScript 5. For now, you\
    \ should be aware of this predicament, especially when you start functions around\
    \ as values to other functions.\n\nConsider the code below and what happens when\
    \ passing an anonymous function to foo.func1. When the anonymous function is called\
    \ foo.func1 (a function inside of another function) the value inside of the anonymous\
    \ function will be a reference to the head object.\n\n(Note: The OCR text ends\
    \ abruptly/is garbled in the final section; I have processed the available legible\
    \ text.)\n"
  mdcn: "\n- 显式调用（例如 `window.alert()` 对比 `alert()`）在性能方面（代码运行速度）会稍微增加一点开销。如果你仅依赖作用域链并避免显式引用头对象，即使你知道所需的属性包含在全局作用域中，速度也会更快。\n\
    \n## 第 6 章 - this 关键字\n\n## this 的概念概述以及它如何引用对象\n\n当一个函数被创建时，后台会创建一个名为 `this`\
    \ 的关键字，它链接到函数运行所在的对象。另一种方式是，`this` 在其函数作用域内是可用，但它是对该函数作为属性/方法的对象的引用。\n\n让我们再次查看第\
    \ 1 章中的 `cody` 对象：\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_82_0.png)\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\nvar cody = {\n  living : true,\n\
    \  age : 23,\n  gender: 'male',\n  getGender: function() { return cody.gender;};\n\
    }\nconsole.log(cody.getGender()); // logs 'male'\n</script></</body>></html>\n\
    ```\n\n注意在 `getGender` 内部，我们使用点符号法（例如 `cody.gender`）在 `cody` 对象本身上访问 `gender`\
    \ 属性。可以使用 `this` 来重写访问 `cody` 对象，因为 `this` 指向 `cody` 对象。\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_82_1.png)\n\
    \n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\nvar cody = {\n  living:\
    \ true,\n  age: 23,\n  gender: 'male',\n  getGender: function() { return this.gender;};\n\
    }\nconsole.log(cody.getGender()); // logs 'male'\n</script></body></body></html>\n\
    ```\n\n`this.gender` 中使用的 `this` 仅指向函数运行所在的 `cody` 对象。\n\n`this` 的主题可能会令人困惑，但其实并非如此。只需记住，通常情况下，`this`\
    \ 在函数内部用于引用它所包含的对象，而不是它本身（例外包括使用 `new` 关键字或 `call()` 和 `apply()`）。\n\n- `this`\
    \ 关键字看起来和行为像任何其他变量一样，但你不能修改它。\n- 与 `arguments` 和发送给函数的任何参数不同，`this` 是调用/激活上下文中的一个关键字（而不是属性）。\n\
    \n## `this` 的值是如何确定的？\n\n传递给所有函数的 `this` 的值基于函数在 `runtime`（运行时）被调用的上下文。注意这里，因为这是你只需要记忆的奇特性之一。\n\
    \n下方代码中的 `myObject` 对象有一个名为 `sayFoo` 的属性，它指向 `sayFoo` 函数。当从全局作用域调用 `sayFoo` 时，`this`\
    \ 指向 `window` 对象。当作为 `myObject` 的方法被调用时，`this` 指向 `myObject`。\n\n由于 `myObject`\
    \ 有一个名为 `foo` 的属性，因此使用了该属性。\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \nvar foo = 'foo';\nvar myObject = {foo: 'I am myObject.foo'};\n\nvar sayFoo =\
    \ function() {\n  console.log(this['foo']);\n};\n\n// 给 myObject 一个 sayFoo 属性并让它指向\
    \ sayFoo 函数\nmyObject.sayFoo = sayFoo;\n\nmyObject.sayFoo(); // logs I am myObject.foo\n\
    ```\n\nlive code: http://jsbin.com/oxaliq/edit\n\n```html\nsayFoo(); // logs 'foo'\n\
    \n</script></body></html>\n```\n\n显然，`this` 的值基于函数被调用的上下文。考虑一下 `window.sayFoo`\
    \ 和 `sayFoo` 都指向同一个函数。然而，取决于你从哪里（即哪个上下文）调用 `sayFoo()`，`this` 的值是不同的。\n\n如果有帮助，这里是显式使用头对象（即\
    \ `window`）的相同代码。\n\n```html\n<!DOCTYPE html>html lang=\"en\"><body><script>\n\
    \nwindow.foo = 'foo';\nwindow.myObject = {foo: 'I am myObject.foo.'};\n\nwindow.sayFoo\
    \ = function() {\n  console.log(this.foo);\n};\n\nwindow.myObject.sayFoo = window.sayFoo;\n\
    \nwindow.myObject.sayFoo();\nwindow.sayFoo();\n\n</script></body></html>\n```\n\
    \n确保你在传递函数时，或者对函数有多个引用时，能意识到 `this` 的值会根据你调用函数的上下文而改变。\n\n- 注意事项\n- 除 `this` 和\
    \ `arguments` 之外的所有变量都遵循词法作用域。\n\n## `this` 关键字在嵌套函数中指向头对象\n\n你可能会疑惑，当 `this`\
    \ 位于一个包含另一个内部的函数内部时会发生什么。坏消息是 ECMA3，它会迷失方向并指向头对象（浏览器中的 `window` 对象），而不是函数定义的对象。\n\
    \n在下方代码中，`func2` 和 `func3` 内部的 `this` 迷失了方向，指向不是 `myObject` 而是头对象。\n\n```html\n\
    <!DOCTYPE html><html lang=\"en\"><body><script>\nvar myObject = {\n func1: function()\
    \ {\n  console.log(this); // logs myObject\n var func2 = function() {\n  console.log(this);\
    \ // logs window, and will do so from this point on\n  var func3 = function()\
    \ {\n   console.log(this); // logs window, as it's the head object\n   }\n  }\n\
    \ }\n}\nmyObject.func1();\n</script></body></html>\n```\n\n好消息是 ECMAScript 5 修复这个问题。现在，你应该意识到这种困境，特别是当你将函数作为值传递给其他函数时。\n\
    \n考虑下面的代码，以及当将匿名函数传递给 `foo.func1` 时会发生什么。当匿名函数被调用时（`func1` 是另一个函数内部的匿名函数），匿名函数内部的\
    \ `this` 将是头对象的引用。\n\n"
