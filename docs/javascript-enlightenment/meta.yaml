    Notice in the code that creating the cody object and its properties took five
    statements. Using the "object literal" notation we can express the same cody object
    in one statement.


    ![](img/ad11d036d555f7d1771aeb8c30e67ba2_59_0.png)


    ```

    <!DOCTYPE html><html lang="en"><body><script>


    var cody = {

    living: true,

    age: 23,

    gender: ''male'',

    getGender: function() {return cody.gender};

    };

    // notice the last property has no comma after it


    console.log(cody); // logs cody object and properties


    </script>

    </body>

    ```


    Literal notation gives us the ability to create objects, including defined properties,
    with less code and visually encapsulate the related data. Notice the use of the
    : and , operators in a single statement. This is actually the preferred syntax
    for creating objects in JavaScript because of it''s terseness and readability.


    You should be aware that property names can also be specified as strings:


