  md: "```\n<!DOCTYPE html><html> lang=\"en\"><body><script>\n\nvar foo = 'bar';\n\
    \nwindowRef1 = window;\nwindowRef2 = this;\n\nconsole.log(windowRef1, windowRef2);\
    \ // logs reference to window object\nconsole.log(windowRef1.foo, windowRef2.foo);\
    \ // logs 'bar', 'bar'\n\n</script></body></html>\n```\n\nIn the code above, we\
    \ explicitly store a reference to the head object in two variables that are used\
    \ to gain access to the global foo variable.\n\n# The head object is implied and\
    \ typically not referenced explicitly\n\nTypically a reference to the head object\
    \ is not used because it is implied. For example, in the browser environment window.alert\
    \ and alert() are essentially the same statement. JavaScript fills in the blanks\
    \ here. Because the window object (i.e. the head object) is the last object in\
    \ the scope chain for value, the window object is essentially always implied.\
    \ But, we leverage the alert() function which is contained in the global scope.\n\
    \n```\n<!DOCTYPE html><html> lang=\"en\"><body><script>\n\n foo = { // window\
    \ is implied here, window.foo\n  fooMethod: function() {\n    alert('foo ' + 'bar');\
    \ // window is implied here, window.alert\n    window.alert('foo' + 'bar'); //\
    \ window is explicitly used, with the same effect\n  }\n}\n\nfoo.fooMethod();\
    \ // window is implied here, window.foo.fooMethod()\n\n</script></body></html>\n\
    ```\n\nMake sure you understand that the head object is implied, even when you\
    \ don't explicitly include it, because the head object is the last stop in the\
    \ scope chain."
