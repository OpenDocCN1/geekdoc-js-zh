    ```\n\n## Instances inherit properties from prototype will always get the latest\
    \ values\n\nThe prototype property is dynamic in the sense that instances will\
    \ always get the latest value from the prototype, regardless of when it was instantiated,\
    \ changed, or appended. In the code below, we create a Foo constructor, add the\
    \ property x to the prototype, and create an instance of Foo() named FooInstance.\
    \ Next, we log the value of x. Then we update the prototype's value of x and log\
    \ it again to find that our instance has access to the latest value found in the\
    \ prototype object.\n\n```html\n<!DOCTYPE html><html lang=\"en\"><body><script>\n\
    \nvar Foo = function Foo();\n\nFoo.prototype.x = 1;\n\nvar FooInstance = new Foo();\n\
    \nconsole.log(FooInstance.x); // logs 1\n\nFoo.prototype.x = 2;\n\nconsole.log(FooInstance.x);\
    \ // logs 2, the FooInstance was updated\n\n</script></body></html>\n```\n\nGiven\
    \ how lookup chain works, this behavior should not be that surprising. If you\
    \ are wondering this works the same, regardless of whether you use the default\
    \ prototype object or override it with your own. Here I replace the default prototype\
    \ object to demonstrate this fact:\n\n```html\n<!DOCTYPE html><html lang=\"en\"\
    ><body><script>\n\nvar Foo = function Foo();\n\nFoo.prototype = {x:1}; // the\
    \ logs below still work the same\n\nvar FooInstance = new Foo();\n\nconsole.log(FooInstance.x);\
    \ // logs 1\n\nFoo.prototype.x = 2;\n\nconsole.log(FooInstance.x); // logs 2,\
    \ the FooInstance was updated\n\n</script></body></html>\n```\n\n## Replacing\
    \ the prototype property with a new object does not update former instances\n\n\
    You might think that you can replace the prototype entirely anytime that all instances\
    \ will be updated, but this is not correct. When you create an instance, that\
    \ instance will be tied to the prototype that was \"minted\" at the time of instantiation.\
    \ Providing a new object as the prototype property does not update the connection\
    \ between instances already created and the new prototype. Remember, as I stated\
    \ above, you can update or add to the originally created prototype object and\
    \ those values remain connected to the first instance(s).\n\n```javascript\n<!DOCTYPE\
    \ html><html lang=\"en\"><body><script>\n\nvar Foo = function Foo();\n\nFoo.prototype.x\
    \ = 1;\n\nvar FooInstance = new Foo();\n\nconsole.log(FooInstance.x); // logs\
    \ 1, as you think it would\n\n// now let's replace/override the prototype object\
    \ with a new Object()\nFoo.prototype = {x:2};\n\nconsole.log(FooInstance.x); //\
    \ logs 1, WHAT? Shouldn't it log 2, we just updated prototype\n/* FooInstance\
    \ still retains the same state of the prototype object that\nwas there when it\
    \ was instantiated. */\n\n// create a new instance of Foo()\nvar NewFooInstance\
    \ = new Foo();\n\n// the new instance is now tied to the new prototype object\
    \ value (i.e. {x:2});\nconsole.log(NewFooInstance.x); // logs 2\n\n<script></body></html>\n\
    ```\n\nThe key take away here is that an object's prototype should not be replaced\
    \ with a new object once start creating instances. Doing so will result in instances\
    \ that have a link to different prototypes.\n\n## User-defined constructors can\
    \ leverage the same prototype inheritance of native constructors\n\nHopefully\
    \ at this point in the chapter it is sinking in how JavaScript itself leverages\
    \ the prototype property for inheritance (e.g. Array.prototype). This same pattern\
    \ can be leveraged when creating non-native, user-defined constructors. Below,\
    \ we take the classic Person object and mimic the pattern JavaScript uses for\
    \ inheritance.\n\n![](img/ad11d036d555f7d1771aeb8c30e67ba2_107_0.png)\n\n```html\n\
