    # Instantiating constructors using the new operator


    A constructor function is basically a cookie cutter template used to create pre-configured
    objects. Take String() for this example. This function, when used with the new
    operator (new String(''foo'')) creates a string instance based on the String()
    template. Let''s look at an example.


    ```

    live code: http://jsfiddle.net/javascriptlightenment/FKdjsp/

    ```


    ```

    <!DOCTYPE html><html><html lang="en"><body><script>

    var myString = new String(''foo'');

    console.log(myString); // logs foo {0 = "f", 1 = "o", 2 = "o"}

    </script></body></html>

    ```


    Above, we created a new string object that is instance of the String() constructor
    function. Just like that, we have a string value expressed in JavaScript.


    Notes


    +   - I''m not suggesting that you use constructors instead of their literal/primitive
    equivalents — like var string="foo"; I, however, suggesting that you understand
    what is going on behind literal/primitive values.


    As previously mentioned, the JavaScript language has the following native constructors:
    Number(), String(), Boolean(), Object(), Array(), Function(), Date(), RegExp(),
    Error(). We can instantiate an object from any of these constructors by using
    the new operator. Below, I construct these nine native JavaScript objects.


    ```

    live code: http://jsfiddle.net/javascriptlightenment/M9cWA/

    ```


    ```

    <!DOCTYPE html><html><html lang="en"><body><script>

    // instantiate an instance for each native constructor using the new

    var myNumber = new Number(23);

    var myString = new String(''male'');

    var myBoolean = new Boolean(false);

    var myObject = new Object();

    var myArray = new Array(''foo'', ''bar'');

    ```'
