    \n![](img/ad11d036d555f7d1771aeb8c30e67ba2_44_0.png)\n\n```html\n<!DOCTYPE html><html\
    \ lang=\"en\"><body><script>\n\n// create Object() object\nvar code = new Object();\n\
    \n// setting properties\ncody.living = true;\ncody.age = 33;\ncody.gender = 'male';\n\
