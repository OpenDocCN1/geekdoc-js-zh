    \n## Tables\n\nWhen we want to mark up data that would be best presented in a\
    \ table, we need to create HTML tables. Tabular data usually reminds us of spreadsheets,\
    \ but HTML tables are slightly different from spreadsheets tables because they\
    \ consist of rows and cells in a row. There is no need to define a number of columns,\
    \ as the number of cells in each row determines how many columns a table will\
    \ have. Nevertheless, marking up tabular data is relatively easy, as HTML provides\
    \ us with plenty of semantic elements for data organization.\n\nThe starting point\
    \ for every HTML table is the `<table>` element. Let us start adding a table to\
    \ redesign the Skills section in our sample CV.\n\n```html\n<table>\n</table>\n\
    ```\n\nUsing just a `<table>` tag is not sufficient to create the table; we need\
    \ to add a table row with the `<tr>` element.\n\n```html\n<table>\n    <tr>\n\
    \    </tr>\n</table>\n```\n\nFinally, we need to add a few cells in this row in\
    \ order to have a basic table displayed in our browser. When discussing HTML table\
    \ semantics, we must be aware that there are two types of elements to represent\
    \ table cells: `<td>` and `<th>`. The `<td>` element stands for table data and\
    \ represents a regular cell that contains data. The `<th>` element stands for\
    \ table header and defines a cell that contains a heading for a table row or a\
    \ column.\n\nIn our example, in the first row we will insert two header cells\
    \ one for ‘Web Technology’ and the other for ‘Skill Level’.\n\n```html\n<table>\n\
    \    <tr>\n        <th>Web Technology</th>\n        <th>Skill Level</th>\n   \
    \ </tr>\n</table>\n```\n\nTo complete our table, we will insert three more rows.\
    \ In these rows, instead of `<th>` we will use the `<td>` element for representing\
    \ cells, as these cells will contain actual data and no headings. Our final table\
    \ code will look like this:\n\n```html\n<table>\n    <tr>\n        <th>Web Technology</th>\n\
    \        <th>Skill Level</th>\n    </tr>\n    <tr>\n        <td>HTML</td>\n  \
    \      <td>Expert</td>\n    </tr>\n    <tr>\n        <td>CSS</td>\n        <td>Expert</td>\n\
    \    </tr>\n    <tr>\n        <td>JavaScript</td>\n        <td>Advanced</td>\n\
    \    </tr>\n</table>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_61_0.png)\n\
    \nThis basic table doesn’t have any borders, but the data appears in neatly lined\
    \ rows and columns. Borders and additional visual table properties are managed\
    \ through CSS.\n\n> **Note:** *Tables have a long web history. While originally\
    \ conceived just to hold tabular data, they were quickly misused for a much bigger\
    \ task: serving as the foundation for complicated page layouts with features that\
    \ were impossible before the advent of CSS.*\n\nOur sample CV now has the following\
    \ structure:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"\
    utf-8\">\n    <title>Curriculum Vitae</title>\n</head>\n<body>\n<h1>Curriculum\
    \ Vitae</h1>\n<h2>Personal Info</h2>\n<p><strong>Name:</strong> Scott Johnson</p>\n\
    <p><strong>Occupation:</strong> Web Designer</p>\n<p><strong>Date of birth:</strong>\
    \ 09/09/1980</p>\n<p><strong>Address:</strong><br>\n523 Beaumont Way<br>\nSanta\
    \ Rosa<br>\nCalifornia 52409</p>\n<hr>\n<h2>Education</h2>\n<ul>\n    <li>MIT</li>\n\
    \    <ul>\n        <li>PhD Degree in Computer Science</li>\n        <li>Bachelor\
    \ Degree in Computer Science</li>\n    </ul>\n    <li>Santa Rosa High School</li>\n\
    </ul>\n<hr>\n<h2>Skills</h2>\n<table>\n    <tr>\n        <th>Web Technology</th>\n\
    \        <th>Skill Level</th>\n    </tr>\n    <tr>\n        <td>HTML</td>\n  \
    \      <td>Expert</td>\n    </tr>\n    <tr>\n        <td>CSS</td>\n        <td>Expert</td>\n\
    \    </tr>\n    <tr>\n        <td>JavaScript</td>\n        <td>Advanced</td>\n\
    \    </tr>\n</table>\n<hr>\n<h2>Portfolio</h2>\n<p>I have worked as a freelance\
    \ web designer for the following companies:</p>\n<ul>\n    <li>H₂O Wireless -\
    \ a broadband Internet provider</li>\n    <li>DSQUARED² - an international fashion\
    \ house</li>\n</ul>\n```\n\n## Special Characters\n\nNot all characters available\
    \ on the web are available on our keyboards. So what happens when we want to add\
    \ special characters like a copyright symbol (©) or a degree (°)? HTML supports\
    \ all these characters along with about 250 relatives, including mathematical\
    \ symbols and special letters. To add them to our web page, we need to use what\
    \ is known as an HTML character entity. An HTML character entity is initiated\
    \ by the ampersand (&) symbol, followed by a keyword (or ASCII code) and concluded\
    \ with the semicolon (;) symbol. For example, the HTML character code for a non-breaking\
    \ space will be written as &nbsp;.\n\nOther HTML character entities are presented\
    \ in the following table:\n\n| CHARACTER | NAME OF CHARACTER | CODE |\n|---|---|---|\n\
    | < | Left angle bracket | &lt; |\n| > | Right angle bracket | &gt; |\n| & | Ampersand\
    \ | &amp; |\n| \" | Double quotation mark | &quot; |\n| © | Copyright | &copy;\
    \ |\n| ® | Registered trademark | &reg; |\n| ¢ | Cent sign | &cent; |\n| £ | Pound\
    \ sterling | &pound; |\n| € | Euro sign | &euro; |\n| ° | Degree sign | &deg;\
    \ |\n| ± | Plus or minus | &plusmn; |\n| µ | Micro sign | &micro; |\n| ½ | Fraction\
    \ one-half | &frac12; |\n\nTable 2. HTML Character Entities\n\n## Inserting Images\n\
    \nWe can place all kinds of images on our web page, from logos to photographs.\
    \ Web images appear automatically when the visitor jumps to our page, as long\
    \ as the browser is configured to view them.\n\nTo place an image in a web document,\
    \ we use the `<img>` element. The image does not reside in the web page. It is\
    \ stored as a separate file, and the HTML code points to its location. Technically,\
    \ an image element is an empty element, as it will be replaced by the actual referenced\
    \ image content. As an empty element, it consists only of attributes and is opened\
    \ and closed in a single tag.\n\nTo point to the actual image that we want to\
    \ display, we use the `src` attribute to insert the relative or absolute path\
    \ to the image.\n\n```html\n<img src=\"images\\cv_picture.jpg\">\n```\n\nWhen\
    \ a browser reads this `<img>` element, it sends out a request for the `cv_picture.jpg`\
    \ file from the `images` folder. After retrieving the file, the browser will insert\
    \ that picture into the page in the location of the `<img>` tag.\n\nWe are also\
    \ strongly encouraged to use the `alt` attribute along with the `<img>` attribute.\
    \ Short for alternate text, this attribute is used to describe the image and its\
    \ meaning in words in order to give it context in the document.\n\n```html\n<img\
    \ src=\"images\\cv_picture.jpg\" alt=\"Scott Johnson profile picture\">\n```\n\
    \nUsually, alternate text doesn’t show up on the web page with the image, but\
    \ it provides several important features. First, in keeping with the semantic\
    \ importance of markup, it lets the image provide some meaning to the document.\
    \ Without the alternate text in the `<img>` element, the image would be essentially\
    \ “meaningless,” and the document would lose some of its semantic value. Second,\
    \ from a more functional perspective, the browser will display the alternate text\
    \ if it can’t display the image itself for any reason. Finally, and most importantly,\
    \ the alternate text acts as an accessibility tool for visitors who are visually\
    \ impaired and use a screen-reading program to access our website.\n\n> *Note:*\
    \ While alternate text can theoretically be as long as we like, most browsers\
    \ don’t automatically wrap long lines. Therefore, it’s a good idea to keep it\
    \ under 50 characters.\n\nWhen working with web images, we have to consider two\
    \ variables: image dimensions"
