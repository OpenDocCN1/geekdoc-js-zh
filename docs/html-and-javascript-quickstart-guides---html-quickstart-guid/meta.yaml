    store information on local computers with cookies.


    We can push things even further with AJAX, creating uninterrupted applications
    that don’t require page refreshing for server communication. We can explore JavaScript
    frameworks such as jQuery or Modernizr to see how we can take JavaScript to its
    limit and easily create sophisticated high-class applications. Finally, we can
    learn how to create the perfect code with advanced error handling and using sophisticated
    debugging tools.


    We at ClydeBank Media would really like to thank you for purchasing our book.
    As a token of our appreciation, please take advantage of the Free Gift that was
    presented in the beginning of this book - a free audiobook and a lifetime [ClydeBank
    Media VIP Membership](http://link).


