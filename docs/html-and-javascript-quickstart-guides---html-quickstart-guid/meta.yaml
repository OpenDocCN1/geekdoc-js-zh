    \ the reference to the element node, we can finally construct a proper event handler.\n\
    \n```\nfirstLink.onclick = linkClick;\n```\n\nThe complete syntax is as follows:\n\
    \n```\nfunction linkClick(){\n    this.className = “current”;\n}\nvar firstLink\
