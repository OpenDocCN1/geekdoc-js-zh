  md: '# **Additional Head Tags**


    One of the most important elements that is used in the head section of an HTML
    document is the <title> element. It is used to give your document a title, and
    this title is visible in the title bar of the web browser window or the browser
    tab of the viewed page. Additionally, the document title is the default name associated
    with the page when a user bookmarks the page via a browser or a third-party app.
    Finally, the title is also commonly used as the headline in search results from
    search engines like Google, directly affecting web page rankings.


    The <title> element is required in every HTML document, cannot be used more than
    once, and cannot contain any additional tags or formatting rules.


    Another popular HTML element in the head section of a web page is the <meta> element.
    The <meta> element is used to provide information about the document itself, such
    as page description, keywords, document author and other metadata, through the
    use of attributes with name/value pairs. This information is not displayed on
    the page but is accessible to other applications like browsers, search engine
    robots or other web services.


    The most common attribute in a <meta> tag is the charset attribute. This attribute
    specifies the character encoding for the HTML document, and the most common value
    is the utf-8 value. This meta information informs the browser that the content
    inside is encoded using the Unicode (UTF-8) character set. In turn, this allows
    the web browser to use the widest range of character glyphs available, so if the
    webpage is written in a language that uses a different script such as Arabic,
    or Cyrillic for Russian, the actual letters will be available and displayed on
    the screen.


    Additionally, the <head> section can contain links to stylesheets and JavaScript
    files through the <link> tag, or they can be embedded into the document with the
    <style> tag. Stylesheets provide information on how the web page should be visually
    displayed, while scripts provide different kinds of interactivity and advanced
    functionalities. Both stylesheets and scripts are beyond the scope of this book.


    +   1. Place the cursor between the opening and closing head tags.

    2. Type <meta charset=”utf-8” />

    3. Type <title>.

    4. Enter the title of our web page (ex. Curriculum Vitae).

    5. Type </title>.'
  merge: -1
