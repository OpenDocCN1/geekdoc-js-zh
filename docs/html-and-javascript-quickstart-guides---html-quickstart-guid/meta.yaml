    **Image 34.** Changing multiple properties on a click event


    We can see that in our examples no parentheses are added after the function name
    when the function is assigned to the event. The reason for this is that when if
    use the `linkClick()` syntax with parentheses we would be executing the function
    and assigning its value to `onclick` . When we don’t use parentheses we assign
    the function (not the value) to the `onclick` property. We no longer control how
    the event handler function is executed as the browser will execute the function
    for us by automatically passing an Event object to the handler function.'
  - "[PAGE 196]\n\n# Event Listeners\n\nThe more recent innovation to handling events\
    \ is called an event listener. An event listener deals with multiple functions\
    \ at the same time, although older browser support is lacking. The event listener\
    \ is attached to the element via the `addEventListener()` method which takes three\
    \ properties.\n\nAs an example let us rewrite the previous code and change the\
    \ event handler to an event listener. The function will remain the same.\n\n```\n\
    function linkClick(){\n    this.className = \"current\";\n    this.textContent\
    \ = \"Party Finished\"\n}\n\nvar firstLink = document.getElementById(\"testLink\"\
    );\nfirstLink.addEventListener(\"click\", linkClick, false);\n```\n\nWe can see\
    \ that instead of the event property, what is attached to the `firstlink` variable\
    \ is the `addEventListener()` method. Within the parentheses we first have the\
    \ event (without the preceding ‘on’), followed by the name of the function and\
    \ something called event flow. Event flow indicates the order in which the event\
    \ is captured and it is usually set to false."
