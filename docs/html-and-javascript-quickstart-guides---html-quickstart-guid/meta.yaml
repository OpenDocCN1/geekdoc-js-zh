    \n- H<sub>2</sub>O Wireless - 一家宽带互联网服务提供商\n- DSQUARED<sup>2</sup> - 一家国际时装公司\n\
    \n**图 16.** 示例简历部分视图\n\n# HTML 注释\n\n注释是完全被任何网页浏览器忽略的代码片段。其存在的目的是为代码提供信息，或移除代码的某些部分但仍将其保留以供日后使用。注释甚至可以在你的\
    \ HTML 中充当通知和提醒。遵循良好实践，我们会在 HTML 代码中添加注释，尤其是在复杂文档中，以标示文档的各个部分。这将帮助我们和其他人更好地理解代码，并提高其可读性。\n\
    \n我们可以使用字符序列 `<!--` 标记注释的开始，使用字符序列 `-->` 标记注释的结束来创建 HTML 注释。在解析文档时，网页浏览器会自动忽略放在这两个标记之间的所有内容，无论它是纯文本内容还是\
    \ HTML 标记。以下示例在“教育背景”部分之前放置了一个 HTML 注释。\n\n```\n<hr>\n\n<!-- Starting Education\
    \ section-->\n\n<h2>Education</h2>\n```\n\n我们可以将注释放在多行中，只要 `<!--` 放在第一行之前，`-->`\
    \ 放在最后一行之后。但是，双破折号序列“—”不能出现在注释内部，除非作为结束标记 `-->` 的一部分。这防止了注释嵌套，因为注释不能在没有双破折号的情况下嵌套在另一个注释中。此外，我们必须确保在注释开始字符串\
    \ ‘<’ 和 ‘!’ 之间没有空格，这意味着 < !— 将无法正确渲染。例如，如果我们在最终文档中将作品集部分的列表注释掉，浏览器将只显示段落文本。\n\n\
    ```\n<h2 id=\"portfolio\">Portfolio</h2>\n\n<p>I have worked as a freelance web\
    \ designer for the following companies</p>\n\n<!--\n\n<ul>\n\n    <li>H<sub>2</sub>O\
    \ Wireless - a broadband Internet provider</li>\n\n    <li>DSQUARED<sup>2</sup>\
    \ - an international fashion house</li>\n\n</ul>\n\n-->\n```\n\n**图 17.** 隐藏的已注释列表\n\
    \n## 作品集\n\n我曾作为自由网页设计师为以下公司工作\n\n## 总结\n\nHTML5 规范中还有更多的标签和属性，但本书的内容对于初学者来说已经足够。任何类型标记的目的都是为文档添加意义；我们甚至可以将用荧光笔划线阅读一本书的过程视为为文档添加标记。如前所述，当\
    \ HTML 首次出现时，标记的目的是解释文档的结构——哪些文本代表标题，什么是段落，什么是项目符号点等等。随着其日益普及，HTML 开始包含控制文档外观的标记。HTML5\
    \ 旨在将标记功能恢复到仅描述文档的结构和语义。\n\n几乎所有 HTML 元素都会被网页浏览器以不同的方式解释和呈现。例如，`<h1>` 到 `<h6>`\
    \ 元素与 `<p>` 元素的内容呈现方式不同；`<ol>` 元素中的列表项与 `<ul>` 元素中的列表项呈现方式也不同。然而，所有这些元素都描述了文档的结构：什么是标题，什么是编号列表中的项目，等等。这些元素内容的呈现方式反映了标记所强加的结构，这就是为什么标题元素从\
    \ `<h1>` 到 `<h6>` 逐渐变小，以及为什么 `<li>` 元素根据它们是包含在 `<ol>` 还是 `<ul>` 元素内，会创建单独的编号项目或项目符号点。\n\
    \n描述文档结构的元素与那些仅影响文档呈现而不添加任何意义的元素非常不同。因此，HTML5 从 HTML 中移除了这些纯粹用于表现的元素和属性。\n\n#\
    \ 第四章：内容结构\n\nHTML5 的核心在于语义。语义化元素通过让我们识别页面不同区域的逻辑目的，为页面内容添加意义和结构。\n\n在定义规范之前，HTML5\
    \ 的贡献者分析了现有的网页，以确定它们的共同元素。因此，HTML5 现在包含了仅用于定义意义和结构的新元素。这些元素用于将相关的内容分组在一起，定义内容的哪些部分是页眉、页脚或主体，描述导航菜单等。网站用户永远不会意识到这些信息，但许多工具会使用它。例如，搜索引擎使用语义化元素来更多地了解我们的页面。屏幕阅读程序更有效地呈现内容，因为语义化元素创建了更具可访问性的内容。其他工具可以用来从我们的页面提取数据，并以各种不同的方式使用它，例如在新闻源中呈现。\n\
    \n## 内容分节\n\n内容分节用于将 HTML 文档划分为各个部分。文档的每个部分通常会有自己的页眉、主体内容，可能还有页脚。\n\n在 HTML5 之前的\
    \ HTML 版本中，更具体地说是 HTML 4 和 XHTML 1，用于内容分节的选择相当有限。设计师唯一可用的分节元素是 `<body>` 和 `<div>`\
    \ 标签；`<div>` 是一个通用元素，用于表示一个分区。这使得文档的语义化标记几乎不可能，并且使得屏幕阅读器和其他辅助设备难以评估页面。新的 HTML5\
    \ 语义化标记使得机器和人都能轻松理解内容的意义和上下文，并提供了一种区分关键内容与侧边栏或无关信息的方法。\n\nHTML5 的每个语义化元素都没有特定的输出、颜色或设计。除非使用了\
    \ CSS 进行样式设置，否则每个语义化元素在网页浏览器中查看时将是不可见的，其内容将显得单调乏味。\n\n> *注意：理论上，分节元素允许我们使用标题、表单标题、表格标题以及任何其他合适的地标来创建文档大纲，这些地标可以勾勒出文档的轮廓。大纲算法已在\
    \ HTML5 规范中明确定义，但浏览器和辅助技术尚未实现它。*\n"
