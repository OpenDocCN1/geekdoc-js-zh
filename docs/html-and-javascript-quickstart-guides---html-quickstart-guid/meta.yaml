    \ car is \" + car.color + \"<br>\");\ncar.changeColor(\"green\");\n```\n\n**Image\
    \ 25. Changing the properties of an object**\n\n> *Note: We can always distinguish\
    \ a method from a property by the parentheses. A method name always ends in parentheses.*\n\
    \nAnother way to create objects in JavaScript is with object literal notation.\
    \ With this approach we use curly brackets to enclose the properties and methods\
    \ for the object. To reproduce the car object with literal notation we would write\
    \ the following code:\n\n```\nvar car = {\n    color: \"red\",\n    make: \"Ford\"\
    ,\n    model: \"Mustang\",\n    startCar: function () {\n        document.write(\"\
    The engine has started. <br>\");\n    },\n    changeColor: function (othercolor)\
    \ {\n        this.color = othercolor;\n        document.write(\"The car is now\
    \ \" + this.color);\n    }\n}\n```\n\nFrom the example it is noticeable that in\
    \ literal notation each name/value pair is separated by a colon, including the\
    \ method function. We can have as many name/value pairs as necessary as long as\
    \ each pair is separated with a comma.\n\nUnknowingly, we have been using JavaScript\
    \ objects in our statements. For example, our most frequently used statement in\
    \ all our examples is the `document.write()` statement. As a matter of fact in\
    \ using this statement we have actually been addressing the `document` object\
    \ and telling it to execute the `write()` method. We will learn more about the\
    \ document object in the next chapter.\n\n# Chapter 5: Document Object Model (DOM)\n\
    \nIn the previous chapter we learned how objects work and we even looked at some\
    \ of JavaScript’s predefined objects. We are now prepared to investigate the most\
    \ important web object that is the document object. The document object will primarily\
    \ help us to gather information about the web page.\n\nThe document object is\
    \ an object that is created by the browser for each new HTML page. When it is\
    \ created, JavaScript allow us access to a number of properties and methods of\
    \ this object that can affect the document in various ways, such as managing or\
    \ changing information. As a matter of fact we have been continuously using a\
    \ method of this object, `document.write()`, in order to display content in a\
    \ web page. Nevertheless, before exploring properties and methods we will first\
    \ take a look at the Document Object Model (DOM).\n\n# Fundamental DOM Concepts\n\
    \nWe are aware that when the web browser receives an HTML file it displays it\
    \ as a web page on the screen with all of the accompanying files like images and\
    \ CSS styles. Nevertheless, the browser also creates a model of that web document\
    \ based on its HTML structure. This means that all the tags, their attributes\
    \ and the order in which they appear is remembered by the browser. This representation\
    \ is called the Document Object Model (DOM) and it is used to provide information\
    \ to JavaScript how to communicate with the web page elements. Additionally, the\
    \ DOM provides tools which can be used to navigate or modify the HTML code.\n\
    The Document Object Model is a standard defined by the World Wide Web Consortium\
    \ (W3C) that is used by most browser developers. To better understand the DOM,\
    \ let us first take a look at a very simple web page:\n\n```\n<!doctype html>\n\
    <html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>Party Schedule</title>\n\
    \    <style type=\"text/css\">\n        .current {\n            color:red;\n \
    \       }\n        .finished {\n            color:green;\n        }\n    </style>\n\
    </head>\n<body>\n    <h1 id=\"partytitle\">Party Plan</h1>\n    <ul id=\"partyplan\"\
    >\n        <li id=\"phase1\">20:00 - Home warm-up</li>\n        <li id=\"phase2\"\
    >22:00 - Joe's Bar</li>\n        <li id=\"phase3\">00:00 - Nightclub 54</li>\n\
    \    </ul>\n</body>\n</html>\n```\n\nOn a web page, tags wrap around other tags.\
    \ The `<html>` tag wraps around the `<head>` and `<body>` tags. The `<head>` tag\
    \ wraps around tags such as `<title>`, `<meta>` and `<script>`. The `<body>` wraps\
    \ around all content tags such as `<p>`, `<h1>` through `<h6>`, `<ul>`, `<table>`\
    \ and so on.\n\nThis relationship between tags can be represented with a tree\
    \ structure where the `<html>` tag acts as the root of the tree, while other tags\
    \ represent different tree branch structures dependent on the tag hierarchy within\
    \ the document. In addition to tags, a web browser also memorizes the attributes\
    \ of the tag as well as the textual content within the tag. In the DOM each of\
    \ these items, tags, attributes and text, are treated as individual units which\
    \ are called nodes.\n\n**Image 26. Tree structure of an HTML document**\n\nIn\
    \ the tree structure for our basic HTML page the `<html>` element acts as a root\
    \ element, while the `<head>` and `<body>` elements are nodes. In defining this\
    \ relationship we can also refer to `<html>` as the parent node, and the `<head>`\
    \ and `<body>` elements as child notes. In turn, both the `<head>` and `<body>`\
    \ elements contain child nodes and so on. When we reach an item that contains\
    \ no other child node we terminate the tree structure at that node, also known\
    \ as a leaf node.\n\n# Selecting Document Elements\n\nWith the DOM structure in\
    \ place, JavaScript can access the elements within the document in several different\
    \ ways, dependent on whether we want to select individual or multiple elements.\
    \ In all approaches we first have to locate the node representing the element\
    \ we need to access and subsequently use the content, child elements and attributes\
    \ of that node.\n\n# Selecting Individual Elements\n\nTo select individual elements\
    \ we most commonly use the `getElementById()` method. This method will let us\
    \ select an element with a particular ID attribute applied to its HTML tag. This\
    \ method is the most efficient way to access an element if we follow the presumption\
    \ that the ID attribute is unique for every element within the page. In the following\
    \ example we will access the element whose ID attribute has the value ‘phase1’:\n\
    \n```\nvar firststop = document.getElementById(\"phase1\");\n```\n\nBy using the\
    \ `getElementById()` method on the document object means that we are searching\
    \ for the element with this ID anywhere on the page. Once the ‘phase1’ element\
    \ is assessed, which in our case is the first `<h1>` element, the reference to\
    \ this node is stored in the `firststop` variable and we can use JavaScript to\
    \ make changes. As an example we will assign the attribute `class` with the value\
    \ ‘current’ to this element. We will include this code in a `<script>` tag in\
    \ the `<head>` section of our document.\n\n```\nvar firststop = document.getElementById(\"\
    phase1\");\nfirststop.className = \"current\";\n```\n\n**Image 27. Changing the\
    \ style of a page element**"
