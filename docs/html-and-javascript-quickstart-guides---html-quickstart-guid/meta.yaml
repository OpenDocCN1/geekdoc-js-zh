    # 第 1 章：HTML 简介


    超文本标记语言，更广为人知的 HTML，是万维网（WWW）的语言。了解 HTML 是任何网页设计师的核心技能之一，因此应该是您最早掌握的技能之一。


    在本书中，我们将学习关于 HTML 的所有知识，从理解 HTML 文档到编写完全符合 HTML5 标准的网页。首先，我们将专注于 HTML 语法、标签和属性的基础知识，并学习文档结构化的过程。接下来，我们将学习构成
    HTML 语言主体的最常见元素，如段落、标题、列表和表格。最后，我们将探讨旨在创建更有意义文档的 HTML5 分节元素，这反过来将帮助我们创建具有更丰富语义的页面。


    **HTML 术语**


    如前所述，HTML 是超文本标记语言的缩写。如果我们仔细观察这个全称，它的意思是*用于标记超文本的语言*，而“标记”是关键词。标记语言指的是一种纯文本语言，与编程毫无关系。单词“超”象征着这种语言的网络特性。在概念形成时，“超文本”是一个流行词，表示文档之间的链接。


    **元素与标签**


    尽管我们今天看到的网页可能充满了文本、图片和视频，但在这些表面之下，是一个充满 HTML 文本的单个长文件。当我们“请求”浏览器加载一个网页时，浏览器会检索一个用
    HTML 编写的文档，这是一种我们的浏览器能够理解并解释的语言。文本中的“标记”指示浏览器内容从哪里开始、到哪里结束以及它们起什么作用。


    为了准备一个用于网络的文档，我们需要通过一个简单的过程：使用一组称为标签的特定文本元素来标记文本。标签是网页的基本构建块，本质上是放置在‘<’和‘>’字符之间的保留字。例如，元素
    `<html>` 就代表一个标签。


    HTML 中所有的标签都是成对出现的，这意味着有一个标签表示元素的开始，也称为**开始标签**，还有一个标签表示元素的结束，称为**结束标签**。开始标签和结束标签具有相同的名称，唯一的区别是结束标签的名称前面总是有一个斜杠字符‘/’。


    例如，以下 HTML 代码：


    ```

    Carl <strong>Jung</strong>

    ```


    将在页面上显示为：


    Carl **Jung**


    当网络浏览器读取 HTML 文档并遇到 `<strong>` 元素时，它不会在网页上显示文本 `<strong>`。相反，当浏览器遇到一个标签时，它会将其解释为一个命令，以特定的、预定义的方式显示文本。在这个例子中，当遇到
    `<strong>` 标签时，浏览器解释为从这一点开始，文本被标记为加粗的、更重要的文本，并将其显示为粗体，直到遇到结束标签 `</strong>`。


    > **注意：** 虽然标记的文本在浏览器中具有默认的“外观”，但 HTML 元素的实际视觉呈现是由另一组称为级联样式表（CSS）的规则控制的。


    重申一下，在 HTML 术语中，一个**元素**指的是开始标签、结束标签以及它们之间编写的所有内容。开始标签和结束标签之间的内容称为**元素内容**。在上面的例子中，`<strong>Jung</strong>`
    是一个元素，‘Jung’ 是元素内容，‘<strong>’ 是该元素的开始标签，而 ‘</strong>’ 是该元素的结束标签。


    # 空元素


    一些 HTML 元素不包含任何元素内容，这意味着开始标签和结束标签之间确实没有任何内容，既没有文本，也没有其他元素。然而，这些元素仍然可以包含属性。空 HTML
    元素的例子包括 `<img>` 元素（包含如何显示图像的信息）和 `<br>` 元素（仅表示换行）。


    **空元素**可以按照常规方式编写，带有开始和结束标签，例如 `<br></br>`。HTML 允许通过在开始标签的右尖括号之前直接包含结束斜杠来合并两个标签的选项，例如
    `<br />`。在 HTML5 中，空元素不再要求有结束标签，可以完全省略。

