  md: '# Image 20. Retrieving information from a function


    The checkPrice function accepts two values as arguments, the price of the product
    and the discount that needs to be applied. Once these valued are accepted they
    are stored in the price and discount variables respectively. The function then
    calculates the discounted price and assigns this calculated value to the variable
    total . The mathematical formula price-price*discount/100 is just the formula
    used to make this calculation. Finally, the value for the variable total is returned
    to the main script with the return statement.


    What is passed down to the script is the value of the total variable, not the
    variable itself. In order to use this ‘returned’ value in the script, we need
    to store it inside a variable. In the above example, we call the checkPrice()
    function to calculate a 20% discount to a price of $100 and assign the resulting
    value to the actualprice variable. This variable is then used in the main script
    and can be displayed on screen with the document.write() command.


    We are not required to store the return value in a varible. We can also use it
    directly in the document.write() command.


    ```

    document.write(“The discounted price of the product excluding VAT is “+checkPrice(100,
    20));

    ```


    We have to be aware that as soon as the browser’s JavaScript interpreter encounters
    a return statement, it will exit the function. This means that if there are any
    lines of code after the return statement they will not be executed. Therefore,
    the return statement should be the last line of code within the function.'
