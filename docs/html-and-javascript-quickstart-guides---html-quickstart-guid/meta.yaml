  md: "# Event Listeners\n\nThe more recent innovation to handling events is called\
    \ an event listener. An event listener deals with multiple functions at the same\
    \ time, although older browser support is lacking. The event listener is attached\
    \ to the element via the `addEventListener()` method which takes three properties.\n\
