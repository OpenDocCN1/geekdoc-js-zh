  md: "# Creating Headings\n\nHeadings are typically used as section titles above\
    \ paragraphs. They help define the hierarchy of our document with larger headings\
    \ identifying more important topics and smaller headings denoting issues of lesser\
    \ importance within the context of that larger topic. To make sure our document\
    \ follows a logical outline, we will always start with the largest heading (level\
    \ 1) and work our way down.\n\nHTML supports up to six levels of headings starting\
    \ at <h1>, the largest, and finishing with <h6>, the smallest, although headings\
    \ below <h4> are seldom necessary. This helps separate the document into a proper\
    \ and more readable structure. By default, the browser will display headings in\
    \ boldface at various sizes, depending on the heading level.\n\n> **Note:** *The\
    \ actual look of headings can be controlled with stylesheets.*\n\nTo organize\
    \ our web page with headers:\n\n+   1) In the body section of our HTML document,\
    \ type <hn>, in which n is a number from 1 to 6, depending on the level of header\
    \ that we want to create.\n2) Type the contents of the header.\n3) Type </hn>\
    \ in which n is the same number used in step 1.\n\nBy including headings, the\
    \ sample content for our CV web page would look like this:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>Curriculum Vitae</title>\n\
    </head>\n<body>\n<h1>Curriculum Vitae</h1>\n```"
