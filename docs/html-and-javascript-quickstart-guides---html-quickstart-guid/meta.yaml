  md: '# Conclusion (HTML)


    This book covered the fundamental concepts of HTML as the language of the web.
    HTML can be used to create any web page, regardless of its complexity.


    In the first chapter we introduced the basic terminology and building blocks of
    the HTML language. We learned about opening tags, closing tags and tag attributes.
    We also elaborated on using markup language to define a proper document structure
    before learning more about the historical development of HTML specifications and
    the birth of today’s HTML5.


    The actual learning of HTML and HTML tags began with the second chapter. We became
    familiar with the generic markup structure for an HTML page. This generic structure
    consists of a <head> section, in which all the functionality of the page is defined
    and a <body> section, in which all the actual content appears. Additionally, we
    encountered the most common tags that go into the <head> sections, which are <meta>
    and <title>. Finally, we learned how to help the browser distinguish between different
    HTML versions by defining a document declaration.


    Next, in chapter three, we learned the most common HTML elements. We learned how
    to place content on a web page and give it structure using the appropriate tags.
    We started from paragraphs and headings, continued on with lists and tables and
    finally dealt with images and links. We also created comments to help us improve
    our coding without affecting the web browser.


    In the final chapter we visited the latest semantic tags introduced in HTML5.
    We started by sectioning content with simple <section> and <article> tags before
    moving on to more specific structures like navigation menus and side content.
    We worked with headers and footers, then expanded on the semantics of images with
    the <figure> and <figcaption> tags. Finally, we looked at the capability of different
    browsers to handle the latest HTML5 elements and looked at some alternatives to
    actual implementation by applying JavaScript and CSS.'
  merge: -1
  pgno: 96
