  md: '# Lists


    HTML allows three different kinds of lists. Two of the list types, ordered and
    unordered, are commonly used in everyday writing, while the third type, definition
    list, is not so common.


    +   - Ordered lists are meant to present items in a sequential order when the
    order of the items is important. A sequential number or letter precedes each item.


    - Unordered lists, commonly referred to as a bullet point lists, are the most
    frequently used lists on the web. They itemize things without implying a sequence,
    so a bullet precedes each item.


    - Description lists display terms that need to be followed by a definition or
    a description. As they are meant to hold glossary items (ex. a dictionary), and
    no symbols are needed to precede them.'
  merge: -1
  pgno: 42
- img_proc: true
  md: "# **Ordered Lists**\n\nThe ordered list is perfect for explaining step-by-step\
    \ instructions to complete a particular task. To create an ordered list, we use\
    \ the <ol> element. As this element defines the list as a whole, every subsequent\
    \ item on the list has to be defined with the <li> element, with all <li> elements\
    \ contained within the <ol> element.\n\nThe following example presents a list\
    \ of top 5 movies of all time.\n\n```\n<ol>\n    <li>Avatar</li>\n    <li>Titanic</li>\n\
    \    <li>The Avengers</li>\n    <li>Harry Potter</li>\n    <li>Frozen</li>\n</ol>\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_43_0.png)\n\n**Image 5.** List\
    \ of Top 5 Movies\n\nIn an ordered list, HTML will consecutively number each item\
    \ starting with the value ‘1’ unless otherwise specified. We will not need to\
    \ supply the numbers; instead, the browser will automatically add the appropriate\
    \ number in front of each list item. This allows us to"
  merge: -1
  pgno: 43
- img_proc: true
  md: "insert and remove list items without messing up the numbering scheme. By default,\
    \ the browser will align and indent the list items and insert some space between\
    \ the paragraph preceding the list and the list itself.\n\nOrdered lists can be\
    \ extended with three attributes: start, type and reversed.\n\n+   - The **start**\
    \ attribute lets us start the list at a value other than 1. However, there is\
    \ no way to continue the numbering from a previous list.\n\n- The **type** attribute\
    \ lets us choose the numbering styles from numbers, roman numerals and letters.\
    \ The values for the type attribute are presented in Table 1.\n\n- The **reversed**\
    \ attribute, which is exclusive to HTML5, allows us to specify the list numbering\
    \ in a descending order. This attribute doesn’t come with any values.\n\n| ATTRIBUTE\
    \ VALUE | NUMBERING | EXAMPLE |\n| :---: | :---: | :---: |\n| 1 | Numbers | 1,2,3\
    \ |\n| a | Lowercase Letters | a,b,c |\n| A | Uppercase Letters | A,B,C |\n| i\
    \ | Lowercase Roman Numerals | i,ii,iii |\n| I | Uppercase Roman Numerals | I,II,III\
    \ |\n\n**Table 1.** Types of Ordered Lists\n\nThe following example will reverse\
    \ the numbering in the list of top 5 movies:\n\n```\n<ol reversed>\n\n  <li>Frozen</li>\n\
    \n  <li>Harry Potter</li>\n\n  <li>The Avengers</li>\n\n  <li>Titanic</li>\n```"
