    \    <p><a href=\"#portfolio\">Portfolio</a></p>\n    </nav>\n</header>\n<section>\n\
    \    <h2 id=\"personal\">Personal Info</h2>\n    <p><strong>Name:</strong> Scott\
    \ Johnson</p>\n    <p><strong>Occupation:</strong> Web Designer</p>\n    <p><strong>Date\
    \ of birth:</strong> 09/09/1980</p>\n    <p><strong>Address:</strong><br>\n  \
