    # Chapter 5: Document Object Model (DOM)


    In the previous chapter we learned how objects work and we even looked at some
    of JavaScript’s predefined objects. We are now prepared to investigate the most
    important web object that is the document object. The document object will primarily
    help us to gather information about the web page.


    The document object is an object that is created by the browser for each new HTML
    page. When it is created, JavaScript allow us access to a number of properties
    and methods of this object that can affect the document in various ways, such
    as managing or changing information. As a matter of fact we have been continuously
    using a method of this object, `document.write()` , in order to display content
    in a web page. Nevertheless, before exploring properties and methods we will first
    take a look at the Document Object Model (DOM).'
  - "[PAGE 171]\n\n# Fundamental DOM Concepts\n\nWe are aware that when the web browser\
    \ receives an HTML file it displays it as a web page on the screen with all of\
    \ the accompanying files like images and CSS styles. Nevertheless, the browser\
    \ also creates a model of that web document based on its HTML structure. This\
    \ means that all the tags, their attributes and the order in which they appear\
    \ is remembered by the browser. This representation is called the Document Object\
    \ Model (DOM) and it is used to provide information to JavaScript how to communicate\
    \ with the web page elements. Additionally, the DOM provides tools which can be\
    \ used to navigate or modify the HTML code.\nThe Document Object Model is a standard\
    \ defined by the World Wide Web Consortium (W3C) that is used by most browser\
    \ developers. To better understand the DOM, let us first take a look at a very\
    \ simple web page:\n\n```\n<!doctype html>\n<html>\n<head>\n<meta charset=\"utf-8\"\
    >\n<title>Party Schedule</title>\n<style type=\"text/css\">\n.current {\n    color:red;\n\
    }\n.finished {\n    color:green;\n}\n</style>\n</head>\n<body>\n<h1 id=\"partytitle\"\
    >Party Plan</h1>\n<ul id=\"partyplan\">\n    <li id=\"phase1\">20:00 - Home warm-up</li>\n\
    \    <li id=\"phase2\">22:00 - Joe's Bar</li>\n    <li id=\"phase3\">00:00 - Nightclub\
    \ 54</li>\n</ul>\n</body>\n</html>\n```\n\nOn a web page, tags wrap around other\
    \ tags. The <html> tag wraps around"
  - '[PAGE 172]


    the <head> and <body> tags. The <head> tag wraps around tags such as <title>,
    <meta> and <script>. The <body> wraps around all content tags such as <p>, <h1>
    through <h6>, <ul>, <table> and so on.


    This relationship between tags can be represented with a tree structure where
    the <html> tag acts as the root of the tree, while other tags represent different
    tree branch structures dependent on the tag hierarchy within the document. In
    addition to tags, a web browser also memorizes the attributes of the tag as well
    as the textual content within the tag. In the DOM each of these items, tags, attributes
    and text, are treated as individual units which are called nodes.


    ![](img/f8023be36714e65595b822db3c227be4_172_0.png)


    # **Image 26.** Tree structure of an HTML document


    In the tree structure for our basic HTML page the <html> element acts as a root
    element, while the <head> and <body> elements are nodes. In defining this relationship
    we can also refer to <html> as the parent node, and the <head> and <body> elements
    as child notes. In turn, both the <head> and <body> elements contain child nodes
    and so on. When we reach an item that contains no other child node we terminate
    the tree structure at that node, also known as a leaf node.'
  - '[PAGE 173]


    # Selecting Document Elements


    With the DOM structure in place, JavaScript can access the elements within the
    document in several different ways, dependent on whether we want to select individual
    or multiple elements. In all approaches we first have to locate the node representing
    the element we need to access and subsequently use the content, child elements
    and attributes of that node.'
  - '[PAGE 174]


    # Selecting Individual Elements


    To select individual elements we most commonly use the `getElementById()` method.
    This method will let us select an element with a particular ID attribute applied
    to its HTML tag. This method is the most efficient way to access an element if
    we follow the presumption that the ID attribute is unique for every element within
    the page. In the following example we will access the element whose ID attribute
    has the value ‘phase1’:


    ```

    var firststop = document.getElementById("phase1");

    ```


    By using the `getElementById()` method on the document object means that we are
    searching for the element with this ID anywhere on the page. Once the ‘phase1’
    element is assessed, which in our case is the first `<h1>` element, the reference
    to this node is stored in the `firststop` variable and we can use JavaScript to
    make changes. As an example we will assign the attribute `class` with the value
    ‘current’ to this element. We will include this code in a `<script>` tag in the
    `<head>` section of our document.


    ```

    var firststop = document.getElementById("phase1");

    firststop.className = "current";

    ```


    ![](img/f8023be36714e65595b822db3c227be4_174_0.png)


    **Image 27.** Changing the style of a page element'
- md: "## Selecting Group Elements\n\nWhile sometimes selecting an individual element\
    \ will be sufficient, other times we may need to select a group of elements. For\
    \ example, we might need to select all `<li>` tags on a page, or all elements\
    \ that share a class attribute. In these cases JavaScript offers the following\
    \ two methods:\n\n- **getElementsByTagName()** – a method which will let us select\
    \ every instance of a particular tag.\n- **getElementsByClassName()** – a method\
    \ that retrieves all elements that share a particular class name.\n\nSelecting\
    \ a group of elements means that the method will return more than one node. This\
    \ collection of nodes is known as a NodeList and will be stored in an array-like\
    \ item. Each node will be given an index number, starting with 0, while the order\
    \ of the nodes will be the same order in which they appear on the page. Although\
    \ NodeLists look like arrays and behave like arrays, semantically they are a type\
    \ of object called a collection. As an object, a collection has its own properties\
    \ and methods which are rather useful when dealing with a NodeList.\n\nThe following\
    \ example will select all `<li>` elements and assign their node references to\
    \ the schedule variable.\n\n```javascript\nvar schedule = document.getElementsByTagName(\"\
    li\");\n```\n\nIf we want to access each element separately, we can use an array\
    \ syntax. For example:\n\n```javascript\nvar item1 = schedule[0];\nvar item2 =\
    \ schedule[1];\nvar item3 = schedule[2];\n```\n\nHowever, when we select a group\
    \ of items we usually want to interact with the whole group. As an example, let\
    \ us assign the class attribute with the \"finished\" value to all `<li>` elements.\
    \ For this purpose we can use a loop to go through each element in the NodeList.\n\
    \n```javascript\nvar schedule = document.getElementsByTagName(\"li\");\nfor (var\
    \ i = 0; i < schedule.length; i++) {\n    schedule[i].className = \"finished\"\
    ;\n}\n```\n\n**Image 29. Changing the class attribute for all <li> elements**\n\
    \nSimilarly to working with arrays, when working with collections we can use the\
    \ length property to determine the size of the collection. We can then use this\
    \ information in a for loop in order to effectively go through every NodeList\
    \ item and assign the \"finished\" class attribute.\n\nWe can use exactly the\
    \ same logic for the `getElementsByClassName()` method. We will get a NodeList\
    \ stored in a collection with each node having an index number. Like with the\
    \ `getElementByTagName()` method, we can access individual items and manage the\
    \ collection through its object properties and methods.\n\n## Traveling Through\
    \ the DOM\n\nWhen we use any of the previously discussed methods to select an\
    \ element node, we can also select other elements in relation to this elements.\
    \ This type of relative selection is considered as an element property.\n\n##\
    \ previousSibling & nextSibling\n\nThe `previousSibling` and `nextSibling` properties\
    \ refer to adjacent elements on the same DOM level. For example, if we select\
    \ the second `<li>` element with the `id` value \"phase2\", the \"phase1\" `<li>`\
    \ element would be considered a `previousSibling`, while the \"phase3\" `<li>`\
    \ element would be `nextSibling`. In the case where there is no sibling, (ex.\
    \ the \"phase1\" element has no `previousSibling`), the value of this property\
    \ remains null.\n\nIn the following example we select the `<li>` element which\
    \ has \"phase2\" as a value for its `id` attribute and we change the `class` attribute\
    \ for both the selected element and its previous sibling.\n\n```javascript\nvar\
    \ secondstop = document.getElementById(\"phase2\");\nvar prevstop = secondstop.previousSibling;\n\
    secondstop.className = \"current\";\nprevstop.className = \"finished\";\n```\n\
    \n## Parents & Children\n\nWe can also travel to different levels of the DOM hierarchy\
    \ using the selected element as a starting point. If we want to move one level\
    \ up we can use the `parentNode` property. For example, if we have the second\
    \ `<li>` element selected we can refer to its parent element, the `<ul>` element,\
    \ with the following syntax:\n\n```javascript\nvar secondstop = document.getElementById(\"\
    phase2\");\nvar upperelement = secondstop.parentNode;\n```\n\nAlternatively, if\
    \ we want to move one level down, we can use either the `firstChild` or the `lastChild`\
    \ property. In the following example we have selected the `<ul>` element with\
    \ \"partyplan\" as a value for its id attribute. Using the `firstChild` property\
    \ we refer to the first `<li>` element of this list, while with the `lastChild`\
    \ property we refer to the last `<li>` element of this list.\n\n```javascript\n\
    var plan = document.getElementById(\"partyplan\");\nvar child1 = plan.firstChild;\n\
    var child2 = plan.lastChild;\n```\n\n## Adding and Managing Content\n\nUntil this\
    \ point we discussed how to find elements in the DOM. The more interesting aspect\
    \ are the approaches to managing content within the DOM.\n\n## Changing HTML\n\
    \nWe already talked about the `textContent` property, but this property retrieves\
    \ only text values and ignores the subsequent HTML structure. If we want to edit\
    \ the page HTML we have to use the `innerHTML` property. This property can be\
    \ used on any element node and it is capable of both retrieving and editing content.\n\
    \n```javascript\nvar liContent = document.getElementById(\"phase1\").innerHTML;\n\
    ```\n\nWhen retrieving the HTML from the `<li>` element with \"phase1\" as a value\
    \ for its `id` attribute, `innerHTML` captures the whole content of the element,\
    \ text and markup, as a string variable. If we apply the same syntax for the `<ul>`\
    \ element, the `innerHTML` property will capture all of the `<li>` items.\n\n\
    We can also use the `innerHTML` property to change the content of the element.\
    \ If this content contains additional markup, these new elements will be processed\
    \ and added to the DOM tree. For example, let us add the `<em>` tag to the first\
    \ `<li>` item in the party list:\n\n```javascript\nvar firstStop = document.getElementById(\"\
    phase1\");\nfirstStop.innerHTML = \"<em>20:00 - Home warm-up</em>\";\n```\n\n\
    ## DOM Manipulation\n\nA more direct technique to managing document content is\
    \ to use DOM manipulation. This is a 3-step process that uses the following methods:\n\
    \n1. **createElement()** - The process begins by creating a new element node with\
    \ the `createElement()` method. This element node is stored in a variable and\
    \ it is not yet a part of the DOM.\n2. **createTextNode()** - The process continues\
    \ by creating a new text node with the `createTextNode()` method. Like in the\
    \ previous step, this text node is stored in a variable and it is not a part of\
    \ the document.\n3. **appendChild()** - The final step is adding the created element\
    \ to the DOM tree with the `appendChild()` method. The element will be added as\
    \ a child to an existing element. The same method can be used to add the text\
    \ node to the element node.\n\nAs an example let us create a new element that\
    \ we will add to the existing party list. We will use the `createElement()` method\
    \ and add this element to the `newPlan` variable.\n\n```javascript\nvar newPlan\
    \ = document.createElement(\"li\");\n```\n\nFollowing, we will create a new text\
    \ node and add its content as a value to the `newPlanText` variable.\n\n```javascript\n\
    var newPlanText = document.createTextNode(\"04:00 - Back to home\");\n```\n\n\
    We can now assign the content of the text node to the `newPlan` element by using\
    \ the `appendChild()` method.\n\n```javascript\nnewPlan.appendChild(newPlanText);\n\
    ```\n\nFinally, we would like to add this element to the list. We will use the\
    \ `getElementById()` method to select the list through its \"partyplan\" id, and\
    \ apply the `appendChild()` method to attach the `newPlan` element to the list.\n\
    \n```javascript\ndocument.getElementById(\"partyplan\").appendChild(newPlan);\n\
    ```"
  mdcn: "\n## 选择组元素\n\n虽然有时选择单个元素就足够了，但在其他情况下，我们可能需要选择一组元素。例如，我们可能需要选择页面上的所有 `<li>`\
    \ 标签，或所有共享某个类属性的元素。在这些情况下，JavaScript 提供了以下两种方法：\n\n- **getElementsByTagName()**\
    \ – 此方法允许我们选择特定标签的所有实例。\n- **getElementsByClassName()** – 此方法检索所有共享特定类名的元素。\n\n\
    选择一组元素意味着该方法将返回多个节点。这个节点集合被称为 NodeList，并将存储在一个类数组项中。每个节点都会被分配一个从 0 开始的索引号，而节点的顺序与它们在页面上出现的顺序相同。尽管\
    \ NodeList 看起来像数组且行为类似数组，但从语义上讲，它们是一种称为集合的对象。作为一种对象，集合拥有自己的属性和方法，这些在处理 NodeList\
    \ 时非常有用。\n\n以下示例将选择所有 `<li>` 元素，并将其节点引用分配给 schedule 变量。\n\n```javascript\nvar\
    \ schedule = document.getElementsByTagName(\"li\");\n```\n\n如果我们想分别访问每个元素，可以使用数组语法。例如：\n\
    \n```javascript\nvar item1 = schedule[0];\nvar item2 = schedule[1];\nvar item3\
    \ = schedule[2];\n```\n\n但是，当我们选择一组项目时，通常希望与整个组进行交互。举个例子，让我们将 `class` 属性值设为 \"\
    finished\"，并将其应用于所有 `<li>` 元素。为此，我们可以使用循环遍历 NodeList 中的每个元素。\n\n```javascript\n\
    var schedule = document.getElementsByTagName(\"li\");\nfor (var i = 0; i < schedule.length;\
    \ i++) {\n    schedule[i].className = \"finished\";\n}\n```\n\n**图片 29. 更改所有 <li>\
    \ 元素的 class 属性**\n\n类似于处理数组，处理集合时，我们可以使用 `length` 属性来确定集合的大小。然后，我们可以将此信息用于 `for`\
    \ 循环中，以便有效地遍历每个 NodeList 项并分配 \"finished\" 类属性。\n\n我们完全可以使用相同的逻辑来处理 `getElementsByClassName()`\
    \ 方法。我们将获得一个存储在集合中的 NodeList，每个节点都有一个索引号。与 `getElementByTagName()` 方法一样，我们可以通过其对象属性和方法来访问单个项目并管理集合。\n\
    \n## 遍历 DOM\n\n当我们使用前面讨论的任何方法选择一个元素节点时，我们也可以选择与此元素相关的其他元素。这种相对选择被视为元素属性。\n\n##\
    \ previousSibling 和 nextSibling\n\n`previousSibling` 和 `nextSibling` 属性指的是同一 DOM\
    \ 层级上的相邻元素。例如，如果我们选择 `id` 值为 \"phase2\" 的第二个 `<li>` 元素，那么 \"phase1\" `<li>` 元素将被视为\
    \ `previousSibling`，而 \"phase3\" `<li>` 元素将是 `nextSibling`。如果没有兄弟节点（例如 \"phase1\"\
    \ 元素没有 `previousSibling`），则此属性的值保持为 null。\n\n在下面的示例中，我们选择了 `id` 属性值为 \"phase2\"\
    \ 的 `<li>` 元素，并更改了所选元素及其前一个兄弟元素的 `class` 属性。\n\n```javascript\nvar secondstop\
    \ = document.getElementById(\"phase2\");\nvar prevstop = secondstop.previousSibling;\n\
    secondstop.className = \"current\";\nprevstop.className = \"finished\";\n```\n\
    \n## 父级与子级\n\n我们也可以使用选中的元素作为起点，遍历到 DOM 层次结构的不同层级。如果我们想向上移动一级，可以使用 `parentNode`\
    \ 属性。例如，如果我们选择了第二个 `<li>` 元素，可以使用以下语法引用其父元素，即 `<ul>` 元素：\n\n```javascript\nvar\
    \ secondstop = document.getElementById(\"phase2\");\nvar upperelement = secondstop.parentNode;\n\
    ```\n\n或者，如果我们想向下移动一级，可以使用 `firstChild` 或 `lastChild` 属性。在下面的示例中，我们选择了 `id` 属性值为\
    \ \"partyplan\" 的 `<ul>` 元素。使用 `firstChild` 属性，我们引用此列表的第一个 `<li>` 元素；而使用 `lastChild`\
    \ 属性，我们引用此列表的最后一个 `<li>` 元素。\n\n```javascript\nvar plan = document.getElementById(\"\
    partyplan\");\nvar child1 = plan.firstChild;\nvar child2 = plan.lastChild;\n```\n\
    \n## 添加和管理内容\n\n到目前为止，我们讨论了如何在 DOM 中查找元素。更有趣的方面是管理 DOM 内容的方法。\n\n## 更改 HTML\n\n\
    我们之前已经讨论过 `textContent` 属性，但该属性只检索文本值，并忽略后续的 HTML 结构。如果我们想编辑页面 HTML，必须使用 `innerHTML`\
    \ 属性。此属性可用于任何元素节点，并且能够检索和编辑内容。\n\n```javascript\nvar liContent = document.getElementById(\"\
    phase1\").innerHTML;\n```\n\n当从 `id` 属性值为 \"phase1\" 的 `<li>` 元素中检索 HTML 时，`innerHTML`\
    \ 将元素的全部内容（文本和标记）捕获为一个字符串变量。如果我们将相同的语法应用于 `<ul>` 元素，`innerHTML` 属性将捕获所有 `<li>`\
    \ 项目。\n\n我们还可以使用 `innerHTML` 属性来更改元素的内容。如果此内容包含额外的标记，这些新元素将被处理并添加到 DOM 树中。例如，让我们为派对列表中的第一个\
    \ `<li>` 项目添加 `<em>` 标签：\n\n```javascript\nvar firstStop = document.getElementById(\"\
    phase1\");\nfirstStop.innerHTML = \"<em>20:00 - Home warm-up</em>\";\n```\n\n\
    ## DOM 操作\n\n管理文档内容的更直接技术是使用 DOM 操作。这是一个 3 步过程，使用以下方法：\n\n1. **createElement()**\
    \ - 过程首先使用 `createElement()` 方法创建一个新的元素节点。此元素节点存储在一个变量中，它还不是 DOM 的一部分。\n2. **createTextNode()**\
    \ - 过程继续，使用 `createTextNode()` 方法创建一个新的文本节点。与上一步类似，此文本节点存储在一个变量中，它还不是文档的一部分。\n\
    3. **appendChild()** - 最后一步是使用 `appendChild()` 方法将创建的元素添加到 DOM 树中。该元素将作为子元素添加到现有元素中。相同的方法可用于将文本节点添加到元素节点。\n\
    \n例如，让我们创建一个新元素，并将其添加到现有的派对列表中。我们将使用 `createElement()` 方法，并将此元素添加到 `newPlan` 变量中。\n\
    \n```javascript\nvar newPlan = document.createElement(\"li\");\n```\n\n接下来，我们将创建一个新的文本节点，并将其内容作为值添加到\
    \ `newPlanText` 变量中。\n\n```javascript\nvar newPlanText = document.createTextNode(\"\
    04:00 - Back to home\");\n```\n\n我们现在可以使用 `appendChild()` 方法将文本节点的内容分配给 `newPlan`\
    \ 元素。\n\n```javascript\nnewPlan.appendChild(newPlanText);\n```\n\n最后，我们希望将此元素添加到列表中。我们将使用\
    \ `getElementById()` 方法通过其 \"partyplan\" id 选择列表，并应用 `appendChild()` 方法将 `newPlan`\
    \ 元素附加到列表。\n\n```javascript\ndocument.getElementById(\"partyplan\").appendChild(newPlan);\n\
    ```\n"
