    # # Chapter 4: Content Structure


    HTML5 is all about the semantics. Semantic elements add meaning and structure
    to the content of our pages by letting us identify the logical purpose of its
    different areas.


    Before defining the specifications, HTML5 contributors analyzed existing web pages
    to determine their common elements. Consequently, HTML5 now includes new elements
    that are solely used to define meaning and structure. These elements are used
    for grouping related content together, defining which parts of the content are
    header, footer or main body elements, describing navigational menus, etc. The
    website user is never aware of this information, but many tools use it. For example,
    search engines use the semantic elements to learn more about our page. Screen
    reading programs present the content more effectively, as semantic elements create
    more accessible content. Other tools can be used to extract data from our page
    and use it in a variety of different ways, like presenting it in a newsfeed.'
  - '[PAGE 81]


    # **Sectioning Content**


    Sectioning content is used to divide an HTML document into sections. Every section
    of the document would generally have its own header, main content and possibly
    footer.


    In HTML revisions prior to HTML5, more notably HTML 4 and XHTML 1, the choices
    for sectioning content were rather limited. The only sectioning elements designers
    had to work with were the <body> and <div> tags; <div> is a generic element used
    to signify a division. This made the semantic markup of a document virtually impossible
    and made it difficult for screen readers and other assistive devices to evaluate
    a page. The new HTML5 semantic markup makes it easy for machines and people alike
    to understand the content’s meaning and context and provides a way to differentiate
    the key content from sidebars or unrelated information.


    Each semantic element of HTML5 has no specific output, color, or design.. Unless
    it has been styled with CSS, each semantic element will be invisible, and its
    contents will appear drab and monotone when viewed in a web browser.


    > *Note: Theoretically, sectioning elements allow us to create document outlines
    using headings, form titles, table titles, and any other appropriate landmarks
    that map out the document. The outlining algorithm has been clearly defined in
    the HTML5 spec, but browsers and assistive technologies have not yet implemented
    it.*'
- md: "## The `<section>` and `<article>` Elements\n\nThe `<section>` element is the\
    \ most generic element for sectioning content and is primarily used for grouping\
    \ content with similar meanings. It is meant as a general container element with\
    \ some additional semantic meaning when the content has to represent a logical\
    \ group of related content. A section, in this context, is a thematic grouping\
    \ of content, typically starting with its own heading. Additionally, you can use\
    \ `<section>` to define page segments. For example, on your web page, you could\
    \ put blog posts, news, and a sidebar of ads into separate `<section>` elements.\n\
    \nSimilar to `<section>`, the `<article>` element was introduced as a way to group\
    \ together related information in a document. It is most appropriate to consider\
    \ the `<article>` element as a specialized type of `<section>` with more specific\
    \ semantic meaning. This element represents whatever we consider an article, meaning\
    \ a section of self-contained content like a newspaper article, blog entry, forum\
    \ post or similar content items. For example, an `<article>` element will contain\
    \ a single blog post, while a `<section>` element can contain several (or all)\
    \ blog posts on the page.\n\nWhat is the actual difference between `<section>`\
    \ and `<article>` elements? A `<section>` is a logical part of a document, and\
    \ an `<article>` is actual content. Think of a newspaper. A `<section>` element\
    \ is like the sports section. The sports section has many articles, just like\
    \ `<section>` can contain a lot of `<article>` elements. Semantically, articles\
    \ may be long and content-rich with the need to be divided into their own bunch\
    \ of sections. Following are a few examples that show the interchangeable use\
    \ of `<section>` and `<article>`.\n\nA simple web blog article would have the\
    \ following structure:\n\n```\n<article>\n    <h1>Blog Article Heading</h1>\n\
    \    <p>Article Content</p>\n</article>\n```\n\nConversely, a page that lists\
    \ multiple blog articles would have the following structure:\n\n```\n<section>\n\
    \    <article>\n        <h1>Blog Article #1 Heading</h1>\n        <p>Article Content</p>\n\
    \    </article>\n    <article>\n        <h1>Blog Article #2 Heading</h1>\n   \
    \     <p>Article Content</p>\n    </article>\n    <article>\n        <h1>Blog\
    \ Article #3 Heading</h1>\n        <p>Article Content</p>\n    </article>\n</section>\n\
    ```\n\nOn the other hand, a long article, like our sample CV, can contain subsections\
    \ and follow this structure:\n\n```\n<article>\n    <h1>Curriculum Vitae</h1>\n\
    \    <section>\n        <h2>Personal Info</h2>\n        <p>Content</p>\n    </section>\n\
    \    <section>\n        <h2>Education</h2>\n        <p>Content</p>\n    </section>\n\
    \    <section>\n        <h2>Skills</h2>\n        <p>Content</p>\n    </section>\n\
    \    <section>\n        <h2>Portfolio</h2>\n        <p>Content</p>\n    </section>\n\
    </article>\n```\n\n## What is This `<div>` Element?\n\nDocuments written prior\
    \ to the advent of HTML5 are plagued with `<div>` tags. The `<div>` tag was the\
    \ king element of semantic markup in previous HTML revisions. It was the only\
    \ container available for sectioning off content, but it was far more appropriate\
    \ for defining web page layout than tables. In combination with CSS styles used\
    \ through IDs and classes, the `<div>` element allowed us to create visually rich\
    \ pages with a rather flexible design.\n\nIn HTML5, `<div>` has the semantic meaning\
    \ of a general element. As modern HTML coding requires us to use the most suitable\
    \ or semantically accurate element, the `<div>` element is now used only when\
    \ there are no other elements that are more appropriate.\n\n## Navigation and\
    \ Supplemental Content\n\nThe `<nav>` element defines a section of a page that\
    \ contains navigation links. These links may point to topics on the current page\
    \ or to other web pages on a website. It is not unusual to have a page with multiple\
    \ `<nav>` sections, one for the main navigation menu, one for the submenu, another\
    \ for topics within the current article, etc. All of the links on a web page don’t\
    \ need to be included inside a `<nav>` element. Generally speaking, the `<nav>`\
    \ element is reserved for the more important navigational sections.\n\nIn our\
    \ sample CV we can use the `<nav>` element to wrap the initial navigation menu\
    \ that bookmarks different sections of the CV.\n\n```\n<nav>\n    <p><a href=\"\
    #personal\">Personal Information</a></p>\n    <p><a href=\"#education\">Education</a></p>\n\
    \    <p><a href=\"#skills\">Skills</a></p>\n    <p><a href=\"#portfolio\">Portfolio</a></p>\n\
    </nav>\n```\n\nThe `<aside>` element is perfectly suited for a sidebar. A sidebar\
    \ can refer to a bar physically located to the side of a page or a section of\
    \ content that provides “additional information.” Essentially, `<aside>` represents\
    \ a complete chunk of content that’s separate from the main content of the page\
    \ but is still related to that content. For example, it makes sense to use `<aside>`\
    \ to create a sidebar with related content or links next to a main article. We\
    \ can also use `<aside>` to define a block of ads.\n\n## Headers and Footers\n\
    \nThe `<header>` element groups together introductory content that may also include\
    \ navigational links. The `<header>` usually wraps the heading section of a website\
    \ including the logo, tagline, and navigation menu. It can also appear at the\
    \ beginning of an article and include content such as a title, a byline and maybe\
    \ some links to article subtopics. Traditionally, when we think of a header, we\
    \ imagine only one header per page. In an HTML5 document we can have more than\
    \ one `<header>` section as long as each `<header>` section relates to different\
    \ content.\n\nFor example, in our sample CV we can include the Curriculum Vitae\
    \ heading, the image and the navigation menu in a `<header>` element.\n\n```\n\
    <header>\n    <h1>Curriculum Vitae</h1>\n    <p><img src=\"images\\cv_picture.jpg\"\
    \ alt=\"Scott Johnson profile picture\" width=\"100\" height=\"150\"></p>\n  \
    \  <nav>\n        <p><a href=\"#personal\">Personal Information</a></p>\n    \
    \    <p><a href=\"#education\">Education</a></p>\n        <p><a href=\"#skills\"\
    >Skills</a></p>\n        <p><a href=\"#portfolio\">Portfolio</a></p>\n    </nav>\n\
    </header>\n```\n\nThe `<footer>` element defines a footer at the bottom of the\
    \ page or the section. A `<footer>` typically contains information such as copyright,\
    \ contact, sitemap, related documents and similar items. Just like with the `<header>`\
    \ element, we may have multiple `<footer>` elements per page, each grouped into\
    \ a different `<section>`.\n\n> **Note:** The `<hgroup>` element was a new HTML5\
    \ element used to combine multiple heading levels such as a title and a subtitle.\
    \ However, this element has been dropped since it was “fraught with accessibility\
    \ problems and lacked many compelling use cases.”\n\n## Semantic Images with `<figure>`\
    \ and `<figcaption>`\n\nThe ability to add images on the web influenced the growth\
    \ of the WWW from academia to a worldwide wonder. The `<img>` element has existed\
    \ since the early days of the World Wide Web. From a semantic perspective, the\
    \ `<img>` element is greatly limited when it comes to associating explanatory\
    \ text with the image. While the ‘alt’ attribute does partially deal with this\
    \ issue, this text is neither visible nor functional beyond its accessibility\
    \ features.\n\nTo address this issue, HTML5 offers the `<figure>` and `<figcaption>`\
    \ elements. The `<figure>` element groups the figure with its corresponding caption.\
    \ For example, we can use the `<figure>` and `<figcaption>` elements to add greater\
    \ semantic meaning to the image in our sample CV.\n\n```\n<figure>\n    <img src=\"\
    images\\cv_picture.jpg\" alt=\"Scott Johnson's profile picture\" width=\"100\"\
    \ height=\"150\">\n    <figcaption>Scott Johnson</figcaption>\n</figure>\n```\n\
    \nPhysically, the figure itself does not necessarily have to be an `<img>` element.\
    \ It can be an SVG drawing, a `<canvas>` element or even an ASCII graphic, generally\
    \ anything that can be interpreted as a figure.\n\n> **Note:** *The `<canvas>`\
    \ element is a new HTML5 element that acts as a container for graphics. The graphics\
    \ themselves are created or drawn via scripting, and the practical application\
    \ of this element goes beyond the scope of this book.*\n\n## HTML5 Compatibility\n\
    \nWhen using the HTML5 elements described in this book, it is necessary to acknowledge\
    \ that older browsers, like IE8, lack the capability to recognize these elements.\
    \ When browsers can’t recognize a specific tag, they simply ignore the tag and\
    \ render the remaining content as simple text. This is acceptable up to a certain\
    \ point, as semantic elements are not meant for formatting, but ignoring tags\
    \ means that the browser will not structure the text in a separate line and will\
    \ treat everything as part of the same element. In addition to not representing\
    \ unrecognized elements, IE doesn’t even acknowledge their existence, thus preventing\
    \ us from styling these elements with CSS.\n\nTo resolve this issue we will have\
    \ to trick the older IE browser into recognizing a foreign element by registering\
    \ it with a JavaScript command. As JavaScript is beyond the scope of this book\
    \ and beyond the scope of many web designers, we will have to resort to a strategy\
    \ called HTML5 Shiv. HTML5 Shiv is an already created fully compatible JavaScript\
    \ code developed by Sjoerd Visscher and is available online via googlecode.com.\
    \ We don’t have to retrieve or understand this code to use it. Rather, we simply\
    \ need to reference it in the head section of our page like this:\n\n```\n<head>\n\
    \    <meta charset=\"utf-8\">\n    <title>Curriculum Vitae</title>\n    <script\
    \ src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n</head>\n\
    ```\n\nWhen we want to add JavaScript code to our web page, we use the `<script>`\
    \ element. In the example above, by using the src attribute, this element grabs\
    \ the html5.js JavaScript file from the web server at html5shiv.googlecode.com\
    \ and runs it before the browser starts processing the rest of the page, thus\
    \ rendering any HTML elements properly. The script is short, simple, loads very\
    \ fast and uses code to create all the new HTML5 elements for older browsers.\
    \ Then, all we have to do is use the new elements and style them with appropriate\
    \ CSS rules.\n\nTechnically, we can solve most HTML5 issues of older, non-IE browsers\
    \ with CSS rules. Therefore, if we only want the HTML5 Shiv JavaScript code executed\
    \ for IE browsers, we can place it inside a conditional comment. A conditional\
    \ comment is a special type of comment that only Internet Explorer can read; it\
    \ can even target specific versions of IE.\n\n```\n<head>\n```"
  mdcn: "\n## `<section>` 和 `<article>` 元素\n\n`<section>` 元素是用于划分内容的最通用元素，主要用于将具有相似含义的内容分组。当内容需要表示一组逻辑相关的主题内容时，它被用作具有额外语义含义的通用容器元素。在此上下文中，一个“节”是指内容的主题分组，通常以其自身的标题开始。此外，你可以使用\
    \ `<section>` 来定义页面分段。例如，在你的网页上，你可以将博客文章、新闻和侧边栏广告放入不同的 `<section>` 元素中。\n\n与 `<section>`\
    \ 类似，`<article>` 元素被引入是为了在文档中将相关信息组合在一起。将 `<article>` 元素视为 `<section>` 的一种具有更具体语义含义的专业类型是最合适的。这个元素代表了我们所认为的“文章”，即一段自包含的内容，如报纸文章、博客条目、论坛帖子或类似的内容项。例如，一个\
    \ `<article>` 元素将包含单篇博客文章，而一个 `<section>` 元素可以包含页面上的多篇（或所有）博客文章。\n\n`<section>`\
    \ 和 `<article>` 元素之间实际的区别是什么？`<section>` 是文档的逻辑部分，而 `<article>` 是实际的内容。以报纸为例。`<section>`\
    \ 元素就像体育版块。体育版块包含许多文章，就像 `<section>` 可以包含许多 `<article>` 元素一样。从语义上讲，文章可能篇幅较长、内容丰富，需要划分为自己的若干部分。以下是几个展示\
    \ `<section>` 和 `<article>` 互换使用的示例。\n\n一个简单的博客文章会有如下结构：\n\n```\n<article>\n \
    \   <h1>Blog Article Heading</h1>\n    <p>Article Content</p>\n</article>\n```\n\
    \n反之，一个列出多篇博客文章的页面会有如下结构：\n\n```\n<section>\n    <article>\n        <h1>Blog Article\
    \ #1 Heading</h1>\n        <p>Article Content</p>\n    </article>\n    <article>\n\
    \        <h1>Blog Article #2 Heading</h1>\n        <p>Article Content</p>\n  \
    \  </article>\n    <article>\n        <h1>Blog Article #3 Heading</h1>\n     \
    \   <p>Article Content</p>\n    </article>\n</section>\n```\n\n另一方面，一篇长文，比如我们的简历示例，可以包含多个子节，并遵循以下结构：\n\
    \n```\n<article>\n    <h1>Curriculum Vitae</h1>\n    <section>\n        <h2>Personal\
    \ Info</h2>\n        <p>Content</p>\n    </section>\n    <section>\n        <h2>Education</h2>\n\
    \        <p>Content</p>\n    </section>\n    <section>\n        <h2>Skills</h2>\n\
    \        <p>Content</p>\n    </section>\n    <section>\n        <h2>Portfolio</h2>\n\
    \        <p>Content</p>\n    </section>\n</article>\n```\n\n## 这个 `<div>` 元素是什么？\n\
    \n在 HTML5 出现之前编写的文档充斥着 `<div>` 标签。在之前的 HTML 版本中，`<div>` 标签是语义标记的王者元素。它是划分内容唯一可用的容器，但与表格相比，它更适用于定义网页布局。结合通过\
    \ ID 和类使用的 CSS 样式，`<div>` 元素使我们能够创建视觉丰富且设计相当灵活的页面。\n\n在 HTML5 中，`<div>` 具有一般元素的语义含义。由于现代\
    \ HTML 编码要求我们使用最合适或语义上最准确的元素，`<div>` 元素现在仅在没有其他更合适的元素时才使用。\n\n## 导航和补充内容\n\n`<nav>`\
    \ 元素定义了页面中包含导航链接的部分。这些链接可能指向当前页面上的主题，也可能指向网站上的其他网页。一个页面包含多个 `<nav>` 部分并不罕见，例如一个用于主导航菜单，一个用于子菜单，另一个用于当前文章中的主题等等。网页上的所有链接都不需要包含在\
    \ `<nav>` 元素内。一般来说，`<nav>` 元素是为更重要的导航部分保留的。\n\n在我们的简历示例中，我们可以使用 `<nav>` 元素来包裹初始导航菜单，该菜单链接到简历的不同部分。\n\
    \n```\n<nav>\n    <p><a href=\"#personal\">Personal Information</a></p>\n    <p><a\
    \ href=\"#education\">Education</a></p>\n    <p><a href=\"#skills\">Skills</a></p>\n\
    \    <p><a href=\"#portfolio\">Portfolio</a></p>\n</nav>\n```\n\n`<aside>` 元素非常适合用作侧边栏。侧边栏可以指物理上位于页面侧边的栏，或者提供“附加信息”的内容部分。本质上，`<aside>`\
    \ 代表了一个与页面主要内容分离但仍然相关的完整内容块。例如，在主文章旁边使用 `<aside>` 创建包含相关内容或链接的侧边栏是有意义的。我们也可以使用\
    \ `<aside>` 来定义一个广告区块。\n\n## 页眉和页脚\n\n`<header>` 元素将介绍性内容分组，其中也可能包括导航链接。`<header>`\
    \ 通常包裹网站的标题部分，包括标志、标语和导航菜单。它也可以出现在文章的开头，并包含诸如标题、署名以及可能还有一些指向文章子主题的链接等内容。传统上，当我们想到页眉时，我们想象每个页面只有一个页眉。在\
    \ HTML5 文档中，我们可以有多个 `<header>` 部分，只要每个 `<header>` 部分与不同的内容相关即可。\n\n例如，在我们的简历示例中，我们可以将简历标题、图片和导航菜单包含在一个\
    \ `<header>` 元素中。\n\n```\n<header>\n    <h1>Curriculum Vitae</h1>\n    <p><img\
    \ src=\"images\\cv_picture.jpg\" alt=\"Scott Johnson profile picture\" width=\"\
    100\" height=\"150\"></p>\n    <nav>\n        <p><a href=\"#personal\">Personal\
    \ Information</a></p>\n        <p><a href=\"#education\">Education</a></p>\n \
    \       <p><a href=\"#skills\">Skills</a></p>\n        <p><a href=\"#portfolio\"\
    >Portfolio</a></p>\n    </nav>\n</header>\n```\n\n`<footer>` 元素定义了页面或部分底部的页脚。`<footer>`\
    \ 通常包含诸如版权、联系方式、站点地图、相关文档和类似项目等信息。就像 `<header>` 元素一样，我们可以在每个页面上有多个 `<footer>`\
    \ 元素，每个元素都分组到不同的 `<section>` 中。\n\n> **注意：** `<hgroup>` 元素是 HTML5 的一个新元素，用于组合多个标题级别，例如标题和副标题。然而，由于它“存在诸多可访问性问题且缺乏许多令人信服的用例”，该元素已被移除。\n\
    \n## 使用 `<figure>` 和 `<figcaption>` 的语义化图像\n\n在网络上添加图像的能力推动了万维网从学术界向全球奇迹的发展。`<img>`\
    \ 元素自万维网早期就已存在。从语义角度来看，`<img>` 元素在将解释性文本与图像关联方面存在很大局限性。虽然 ‘alt’ 属性确实部分解决了这个问题，但这段文本除了其可访问性功能外，既不可见也无法实现其他功能。\n\
    \n为了解决这个问题，HTML5 提供了 `<figure>` 和 `<figcaption>` 元素。`<figure>` 元素将图形与其对应的说明文字组合在一起。例如，我们可以使用\
    \ `<figure>` 和 `<figcaption>` 元素为简历示例中的图像添加更丰富的语义含义。\n\n```\n<figure>\n    <img\
    \ src=\"images\\cv_picture.jpg\" alt=\"Scott Johnson's profile picture\" width=\"\
    100\" height=\"150\">\n    <figcaption>Scott Johnson</figcaption>\n</figure>\n\
    ```\n\n从物理上讲，图形本身不一定必须是 `<img>` 元素。它可以是 SVG 绘图、`<canvas>` 元素，甚至是 ASCII 图形，通常任何可以解释为图形的东西都可以。\n\
    \n> **注意：** *`<canvas>` 元素是 HTML5 的一个新元素，用作图形的容器。图形本身是通过脚本创建或绘制的，该元素的实际应用超出了本书的范围。*\n\
    \n## HTML5 兼容性\n\n在使用本书中描述的 HTML5 元素时，必须认识到较旧的浏览器（如 IE8）缺乏识别这些元素的能力。当浏览器无法识别特定标签时，它们只是忽略该标签并将剩余内容渲染为简单文本。这在一定程度上是可以接受的，因为语义元素并非用于格式化，但忽略标签意味着浏览器不会将文本结构化为单独的行，而是将所有内容视为同一元素的一部分。除了不呈现无法识别的元素外，IE\
    \ 甚至不承认它们的存在，从而阻止我们使用 CSS 为这些元素设置样式。\n\n为了解决这个问题，我们将不得不通过 JavaScript 命令注册来“欺骗”较旧的\
    \ IE 浏览器以识别外部元素。由于 JavaScript 超出了本书的范围，也超出了许多网页设计师的范围，我们将不得不采用一种称为 HTML5 Shiv\
    \ 的策略。HTML5 Shiv 是由 Sjoerd Visscher 开发的、已创建的完全兼容的 JavaScript 代码，可在网上通过 googlecode.com\
    \ 获取。我们不需要获取或理解这段代码即可使用它。相反，我们只需要像这样在页面的 head 部分引用它：\n\n```\n<head>\n    <meta\
    \ charset=\"utf-8\">\n    <title>Curriculum Vitae</title>\n    <script src=\"\
    http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n</head>\n```\n\
    \n当我们想要向网页添加 JavaScript 代码时，我们使用 `<script>` 元素。在上面的示例中，通过使用 src 属性，此元素从 html5shiv.googlecode.com\
    \ 的 Web 服务器获取 html5.js JavaScript 文件，并在浏览器开始处理页面其余部分之前运行它，从而正确呈现任何 HTML 元素。该脚本短小精悍，加载非常快，并使用代码为较旧的浏览器创建所有新的\
    \ HTML5 元素。然后，我们所要做的就是使用新元素并用适当的 CSS 规则为它们设置样式。\n\n从技术上讲，我们可以使用 CSS 规则解决大多数较旧的非\
    \ IE 浏览器的 HTML5 问题。因此，如果我们只想让 HTML5 Shiv JavaScript 代码在 IE 浏览器中执行，我们可以将其放在条件注释中。条件注释是一种只有\
    \ Internet Explorer 可以读取的特殊注释类型；它甚至可以针对特定版本的 IE。\n\n```\n<head>\n```\n"
