    ## 第5章：文档对象模型（DOM）\n\n- DOM 基本概念\n- 选择文档元素\n- 选择单个元素\n- 选择元素组\n- 遍历 DOM\n- previousSibling\
    \ 与 nextSibling\n- 父节点与子节点\n- 添加与管理内容\n- 更改 HTML\n- DOM 操作\n\n## 第6章：事件\n\n- 事件类型\n\
    - 响应事件\n- 事件处理器\n- 事件监听器\n\n## 结论\n\n## 术语表\n\n## 关于 ClydeBank Technology\n\n\
    ## 简介\n\nHTML 并不太智能。它主要让人们查看文本和图像，并允许他们跳转到其他页面查看更多相同内容。为网页增添智能的是 JavaScript。它通过让页面在访客与内容交互时做出响应，使网站更具吸引力、更高效、更有用。\n\
    \n本书假设我们已了解如何使用 HTML 来指定网页结构和内容。如果我们还熟悉如何使用 CSS（独立于网页结构）为页面设置样式，那将额外有益。如果是这样，那么我们就准备好使用\
    \ JavaScript 为页面添加一些行为，使其更具动态性和交互性。否则，没有 HTML 和 CSS，JavaScript 对我们帮助不大。它们被视为网页的三大基本支柱：结构、表现和行为。\n\
    \n本书将从 JavaScript 和编程的入门开始。我们将逐步探索存在于 JavaScript 中的编程逻辑构建模块。在深入函数和对象等稍高级的领域之前，我们将基于这些基础高效地介绍交互性。最后，我们将介绍\
    \ DOM 模型，并学习如何有效地控制浏览器及其所有内容。\n\n## **什么是 JavaScript？**\n\nJavaScript 是 Web 的脚本语言，其唯一目的是为我们的页面增加交互性。除了交互性，现代版本的\
    \ JavaScript 还可用于从外部来源甚至网站用户加载和解析信息。JavaScript 本质上是一段嵌入在网页 HTML 结构中的编程代码。当网页浏览器读取此代码时，它会激活一个内置解释器，该解释器知道如何解密这种语言并处理其命令。\n\
    \n尽管编码过程中涉及编程，但 JavaScript 并非编程语言。在传统的 Web 编程语言（如 Java 或 .NET）中，代码在执行前必须经过编译。编译意味着代码必须首先发送到服务器上运行的特殊程序。该程序（也称为应用服务器软件）翻译代码，创建所请求的页面和/或功能，并将其作为\
    \ HTML 返回。像 JavaScript 这样的脚本语言不是编译的，而是实时解释的。这意味着不需要特殊软件，因为用户的浏览器在遇到代码时就会运行和执行它。\n\
    \n> **注意：** JavaScript 诞生于 Java 非常流行的时代。除此之外，这两种语言并无关联，除了基本的编程逻辑外几乎没有共同之处。\n\n\
    ## **JavaScript 的诞生与发展**\n\nJavaScript 最初名为 LiveScript，由 Brendan Eich 于 1995 年在短短\
    \ 10 天内创建。该语言最初的想法是通过为前端界面添加脚本功能来改进 Netscape Navigator 浏览器。然而，该语言大受欢迎，一年之内就被逆向工程并包含在\
    \ Internet Explorer 浏览器中。到 2000 年，该语言已广受欢迎并得到显著扩展，因此被提交给 ECMA 委员会进行标准化。\n\n一旦标准化，JavaScript\
    \ 的采用率和流行度就随着万维网的扩展和增长以及浏览体验的优化而持续增长。事实上，Google 在 2005 年发布 Google Maps 时，展示了 JavaScript\
    \ 如何用于创建令人兴奋的动态交互，从而大力推动了它进入专业领域。\n\n## 实现 JavaScript\n\n现在我们对 JavaScript 有了大致了解，我们可以开始使用这种语言了。由于\
    \ JavaScript 代码是 HTML 文档的一部分，我们需要知道如何告诉浏览器运行我们的脚本。当我们将 JavaScript 包含在 Web 文档中时，有两种常用选项，并且在这两种情况下，我们都将使用\
    \ `<script>` 元素。`<script>` 标签用于告诉浏览器 JavaScript 代码在 HTML 文档中的起始和结束位置。因此，此标签可以包含在页面的\
    \ head 或 body 部分。\n\n第一个选项是将代码内联放置在文档结构中。为此，我们将首先打开一个 `<script>` 标签，输入 JavaScript\
    \ 代码，然后使用 `</script>` 标签结束。理论上，我们可以将文档保留为这样，因为几乎所有浏览器默认都会假设 `<script>` 标签之间的脚本语言是\
    \ JavaScript。然而，为了最大限度地兼容性，我们将使用 type 属性和 `text/javascript` 值扩展此标签，以指示浏览器如何准确解释代码。\n\
    \n```html\n<script type=\"text/javascript\">\n    //A JavaScript comment\n</script>\n\
    ```\n\n第二个选项是从外部文件将 JavaScript 代码加载到我们的 HTML 文档中。为此，我们可以再次使用 `<script>` 元素，但这次除了\
    \ type 属性外，我们还将在 `<script>` 元素的 src 属性中包含外部文件的 URL。外部文件必须是仅包含纯 JavaScript 代码（不包含任何\
    \ HTML 元素或 CSS 规则）的文本文件，文件扩展名为 .js。例如，要将外部 scripts.js 文件调用到我们的浏览器中，我们将使用以下代码：\n\
    \n```html\n<script src=\"script.js\" type=\"text/javascript\">\n</script>\n```\n\
    \n当我们希望在整个网站共享功能时，我们将 JavaScript 放在外部文件中并将其包含在网页中。否则，如果我们只需要添加一些本地交互行为，我们就会将代码嵌入到页面中。\n\
    \n> 注意：脚本文件按照它们在 HTML 代码中出现的顺序加载。\n\n## 第 1 章：JavaScript 基本概念\n\n通常，当我们听到编程这个词时，我们立即想到其他人输入一串难以理解的字母和数字。编程看起来像凡人无法企及的魔法。然而，编程的概念并不难掌握，因为它们总是有现实世界的应用。JavaScript\
    \ 虽然不像 HTML 或 CSS 那样简单，但也不是一门过于复杂的语言。与其他语言不同，它的“语法”或多或少是描述性和直观的，使其适合作为第一门编程语言。基本上，学习\
    \ JavaScript 就像学习一门新语言，但一门类似于英语的新语言。一旦我们学会了新单词，并理解如何将它们组合成“句子”，我们就会学得很好。\n\n##\
    \ 语法\n\n每种语言都有自己的一套字符和单词，以及一套关于如何将这些字符和单词组合成结构良好的句子的规则。这些规则也称为语言语法，正是语法将语言结合在一起并赋予其意义。\n\
    \n在开始学习一些 JavaScript 语法示例之前，让我们首先设置 JavaScript 环境。如前所述，JavaScript 代码始终是 HTML 代码的一部分。因此，要使用\
    \ JavaScript，我们首先需要创建一个基本的 HTML 文档。那么，让我们打开一个文本编辑器（如记事本）并输入最基础网页的 HTML 代码。除了基本的\
    \ HTML 标签外，我们还将在 `<head>` 部分包含一个 `<script>` 元素，我们将在其中开始放置 JavaScript 代码。\n\n```html\n\
    <!doctype html>\n<head>\n<title>First Steps in JavaScript</title>\n<script type=\"\
    text/javascript\">\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n让我们将此文档另存为\
    \ firststeps.html。如果我们使用记事本，我们必须记住将“另存为类型”字段更改为“所有文件”。\n"
