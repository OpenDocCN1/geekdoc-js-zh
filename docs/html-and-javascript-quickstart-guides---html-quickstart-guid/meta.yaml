    2. Type <meta charset=”utf-8” />

    3. Type <title>.

    4. Enter the title of our web page (ex. Curriculum Vitae).

    5. Type </title>.'
- md: "## Document Declaration\n\nWith so many HTML specifications, how is the web\
    \ browser supposed to know to correctly parse the document? The absolute top of\
    \ any HTML document contains one additional element called a DOCTYPE declaration.\
    \ The DOCTYPE declaration is an instruction found above the opening `<html>` tag\
    \ that tells the web browser what version of HTML the document uses. For HTML5\
    \ we simply write the following piece of code:\n\n```html\n<!doctype html>\n<html>\n\
    <head>\n```\n\nThe DOCTYPE declaration isn't exactly a tag or an element. As its\
    \ name states, it is simply a declaration.\n\nHTML5 has greatly simplified the\
    \ DOCTYPE declaration, as in previous revisions this was a very illegible piece\
    \ of code. The following example is the DOCTYPE declaration for the HTML 4.01\
    \ Strict specification.\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01\
    \ Strict//EN\" \"http://www.w3.org/TR/html4/strict.dtd\">\n```\n\nIf for any reason\
    \ we don't want to use the HTML5 DOCTYPE, our second choice should be the HTML\
    \ 4.01 Strict DOCTYPE. The \"strict\" part refers to the removal of all the deprecated\
    \ tags, and it is great for pages that are absolutely correct against the standard.\n\
    \nWith that said, our main document structure for the sample CV should look like\
    \ this:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\"\
    \ />\n    <title>Curriculum Vitae</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n## Chapter 3: Page Content\n\nAs mentioned previously, all the visible\
    \ content is placed within the `<body>` tag. Since HTML is all about proper document\
    \ markup, initially we have to view the text in the document as headings, paragraphs\
    \ and lists.\n\n### Paragraphs & Line Breaks\n\nTo define a paragraph of text\
    \ we will use the `<p>` element. Paragraphs are the first and the most common\
    \ levels of structure for web page text. To define a paragraph, we simply enclose\
    \ the text in between the opening and the closing `<p>` tag.\n\n```html\n<p>Name:\
    \ Scott Johnson</p>\n```\n\nWhen we put several paragraphs in a row, the browser\
    \ separates the paragraphs by approximately a half line of text by default. However,\
    \ if the paragraph is empty, the browser will completely ignore the element, and\
    \ it won't display it as an extra line break.\n\n```html\n<p>Name: Scott Johnson</p>\n\
    <p>Occupation: Web Designer</p>\n<p></p>\n<p>Date of birth: 09/09/1980</p>\n```\n\
    \n![](img/f8023be36714e65595b822db3c227be4_35_0.png)\n\n**Image 2.** Visual Representation\
    \ of Paragraphs\n\nSometimes we will have to start a new line of text without\
    \ using the paragraph element. For example, we want to include our address in\
    \ our CV, and we want it in the standard single-spaced three-line format. In situations\
    \ like this, we will use the standalone line break element `<br>`. The `<br>`\
    \ element tells a browser to move the text to the start of the following line.\n\
    \n```html\n<p>Address:<br>\n523 Beaumont Way<br>\nSanta Rosa<br>\nCalifornia 52409</p>\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_36_0.png)\n\n**Image 3.** Visual\
    \ Representation of Line Breaks\n\nWe have to be careful not to misuse line breaks.\
    \ We don't need to perfect our paragraphs, as the browser will rewrap the text\
    \ differently in different resolutions and browser sizes. Additionally, we shouldn't\
    \ be concerned about the amount of space between regular paragraphs; this concerns\
    \ appearance and is manageable via CSS. A good rule for using line breaks is to\
    \ avoid them in regular paragraphs and use them to force breaks in addresses,\
    \ outlines, poems, and other types of text that structurally require tighter flow\
    \ control.\n\n### Empty Spaces\n\nWe have already learned that browsers ignore\
    \ extra spaces and line breaks in the HTML, so what happens in the rare situation\
    \ in which we need to use additional spaces? Well, in HTML empty space is treated\
    \ like a special character and needs to be entered as a special code, `&nbsp;`.\
    \ The `&` symbol signals to the browser that a code for a special character will\
    \ follow; the `nbsp` is the code for the special character, which in this case\
    \ is a short-hand for non-breaking space, while the semicolon (`;`) signals to\
    \ the browser that the code for the special character has ended and from here\
    \ on out the text should be treated as normal.\n\n### Creating Headings\n\nHeadings\
    \ are typically used as section titles above paragraphs. They help define the\
    \ hierarchy of our document with larger headings identifying more important topics\
    \ and smaller headings denoting issues of lesser importance within the context\
    \ of that larger topic. To make sure our document follows a logical outline, we\
    \ will always start with the largest heading (level 1) and work our way down.\n\
    \nHTML supports up to six levels of headings starting at `<h1>`, the largest,\
    \ and finishing with `<h6>`, the smallest, although headings below `<h4>` are\
    \ seldom necessary. This helps separate the document into a proper and more readable\
    \ structure. By default, the browser will display headings in boldface at various\
    \ sizes, depending on the heading level.\n\n> **Note:** *The actual look of headings\
    \ can be controlled with stylesheets.*\n\nTo organize our web page with headers:\n\
    \n1) In the body section of our HTML document, type `<hn>`, in which `n` is a\
    \ number from 1 to 6, depending on the level of header that we want to create.\n\
    2) Type the contents of the header.\n3) Type `</hn>` in which `n` is the same\
    \ number used in step 1.\n\nBy including headings, the sample content for our\
    \ CV web page would look like this:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <meta charset=\"utf-8\">\n    <title>Curriculum Vitae</title>\n</head>\n\
    <body>\n<h1>Curriculum Vitae</h1>\n```\n\n# Personal Info\n\nName: Scott Johnson\n\
    \nOccupation: Web Designer\n\nDate of birth: 09/09/1980\n\nAddress:\n523 Beaumont\
    \ Way\nSanta Rosa\nCalifornia 52409\n\n# Education\n\n# Skills\n\n</body>\n</html>\n\
    \n**Image 4.** CV with Headings and Paragraphs\n\n### Lists\n\nHTML allows three\
    \ different kinds of lists. Two of the list types, ordered and unordered, are\
    \ commonly used in everyday writing, while the third type, definition list, is\
    \ not so common.\n\n- **Ordered lists** are meant to present items in a sequential\
    \ order when the order of the items is important. A sequential number or letter\
    \ precedes each item.\n- **Unordered lists**, commonly referred to as bullet point\
    \ lists, are the most frequently used lists on the web. They itemize things without\
    \ implying a sequence, so a bullet precedes each item.\n- **Description lists**\
    \ display terms that need to be followed by a definition or a description. As\
    \ they are meant to hold glossary items (ex. a dictionary), and no symbols are\
    \ needed to precede them.\n\n#### Ordered Lists\n\nThe ordered list is perfect\
    \ for explaining step-by-step instructions to complete a particular task. To create\
    \ an ordered list, we use the `<ol>` element. As this element defines the list\
    \ as a whole, every subsequent item on the list has to be defined with the `<li>`\
    \ element, with all `<li>` elements contained within the `<ol>` element.\n\nThe\
    \ following example presents a list of top 5 movies of all time.\n\n```html\n\
    <ol>\n    <li>Avatar</li>\n    <li>Titanic</li>\n    <li>The Avengers</li>\n \
    \   <li>Harry Potter</li>\n    <li>Frozen</li>\n</ol>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_43_0.png)\n\
    \n**Image 5.** List of Top 5 Movies\n\nIn an ordered list, HTML will consecutively\
    \ number each item starting with the value '1' unless otherwise specified. We\
    \ will not need to supply the numbers; instead, the browser will automatically\
    \ add the appropriate number in front of each list item."
  mdcn: "\n## 文档声明\n\n面对如此多的 HTML 规范，浏览器应该如何正确解析文档？任何 HTML 文档的最顶部都包含一个名为 DOCTYPE 声明的额外元素。DOCTYPE\
    \ 声明是位于 `<html>` 开始标签上方的一条指令，它告诉 Web 浏览器文档使用的 HTML 版本。对于 HTML5，我们只需编写以下代码：\n\n\
    ```html\n<!doctype html>\n<html>\n<head>\n```\n\nDOCTYPE 声明并非一个严格的标签或元素。正如其名，它只是一个声明。\n\
    \nHTML5 大大简化了 DOCTYPE 声明，因为在以前的版本中，这是一段非常难读的代码。以下示例是 HTML 4.01 Strict 规范的 DOCTYPE\
    \ 声明。\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01 Strict//EN\" \"\
    http://www.w3.org/TR/html4/strict.dtd\">\n```\n\n如果出于任何原因我们不想使用 HTML5 DOCTYPE，我们的第二个选择应该是\
    \ HTML 4.01 Strict DOCTYPE。“严格”部分指的是移除了所有已弃用的标签，它非常适合那些完全符合标准的页面。\n\n话虽如此，我们的示例简历的主要文档结构应该如下所示：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\" />\n \
    \   <title>Curriculum Vitae</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n\
    ## 第三章：页面内容\n\n如前所述，所有可见内容都放置在 `<body>` 标签内。由于 HTML 全部是关于正确的文档标记，最初我们必须将文档中的文本视为标题、段落和列表。\n\
    \n### 段落和换行\n\n要定义一段文本，我们将使用 `<p>` 元素。段落是网页文本的第一级也是最常见的结构层次。要定义一个段落，我们只需将文本包含在\
    \ `<p>` 开始标签和结束标签之间。\n\n```html\n<p>Name: Scott Johnson</p>\n```\n\n当我们连续放置几个段落时，浏览器默认会用大约半行文本的间距来分隔段落。然而，如果段落为空，浏览器将完全忽略该元素，并且不会将其显示为额外的换行符。\n\
    \n```html\n<p>Name: Scott Johnson</p>\n<p>Occupation: Web Designer</p>\n<p></p>\n\
    <p>Date of birth: 09/09/1980</p>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_35_0.png)\n\
    \n**图 2.** 段落的可视化表示\n\n有时我们需要在不使用段落元素的情况下开始新的文本行。例如，我们想在简历中包含我们的地址，并且希望它是标准的单倍行距三行格式。在这种情况下，我们将使用独立的换行元素\
    \ `<br>`。`<br>` 元素告诉浏览器将文本移到下一行的开头。\n\n```html\n<p>Address:<br>\n523 Beaumont\
    \ Way<br>\nSanta Rosa<br>\nCalifornia 52409</p>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_36_0.png)\n\
    \n**图 3.** 换行的可视化表示\n\n我们必须小心不要滥用换行符。我们不需要完美地安排我们的段落，因为浏览器会在不同的分辨率和浏览器窗口大小下重新排列文本。此外，我们不应担心普通段落之间的间距；这涉及外观，可以通过\
    \ CSS 来管理。使用换行符的一个好规则是避免在普通段落中使用它们，而使用它们来强制在地址、提纲、诗歌和其他在结构上需要更严格流程控制的文本类型中换行。\n\
    \n### 空格\n\n我们已经知道浏览器会忽略 HTML 中的额外空格和换行符，那么在我们需要使用额外空格的罕见情况下会发生什么呢？在 HTML 中，空格被视为一个特殊字符，需要作为特殊代码输入，即\
    \ `&nbsp;`。`&` 符号向浏览器发出信号，表示一个特殊字符的代码将紧随其后；`nbsp` 是该特殊字符的代码，在这种情况下是 non-breaking\
    \ space（不间断空格）的简写，而分号 (`;`) 向浏览器发出信号，表示特殊字符的代码已结束，从此处开始，文本应被视为正常文本。\n\n### 创建标题\n\
    \n标题通常用作段落上方的章节标题。它们有助于定义文档的层次结构，较大的标题标识更重要的主题，较小的标题表示在较大主题的上下文中重要性较低的问题。为了确保我们的文档遵循逻辑大纲，我们将始终从最大的标题（1\
    \ 级）开始，然后逐步向下进行。\n\nHTML 支持最多六级标题，从 `<h1>`（最大）开始，到 `<h6>`（最小）结束，尽管低于 `<h4>` 的标题很少使用。这有助于将文档分隔成合适且更具可读性的结构。默认情况下，浏览器会以各种大小的粗体显示标题，具体取决于标题级别。\n\
    \n> **注意：** *标题的实际外观可以通过样式表控制。*\n\n使用标题组织我们的网页：\n\n1) 在 HTML 文档的 body 部分，输入 `<hn>`，其中\
    \ `n` 是一个从 1 到 6 的数字，具体取决于我们想要创建的标题级别。\n2) 输入标题的内容。\n3) 输入 `</hn>`，其中 `n` 与步骤\
    \ 1 中使用的数字相同。\n\n通过包含标题，我们的简历网页的示例内容将如下所示：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <title>Curriculum Vitae</title>\n</head>\n\
    <body>\n<h1>Curriculum Vitae</h1>\n```\n\n# 个人信息\n\n姓名：斯科特·约翰逊\n\n职业：网页设计师\n\n\
    出生日期：1980年9月9日\n\n地址：\n523 Beaumont Way\nSanta Rosa\nCalifornia 52409\n\n# 教育背景\n\
    \n# 技能\n\n</body>\n</html>\n\n**图 4.** 包含标题和段落的简历\n\n### 列表\n\nHTML 允许三种不同类型的列表。其中两种列表类型，有序列表和无序列表，在日常写作中很常见，而第三种类型，定义列表，则不太常见。\n\
    \n- **有序列表** 用于在顺序很重要时按顺序呈现项目。每个项目前面都有一个序号或字母。\n- **无序列表**，通常称为要点列表，是网页上最常用的列表。它们逐项列出事物，不暗示顺序，因此每个项目前面都有一个项目符号。\n\
    - **定义列表** 显示需要跟随定义或描述的术语。它们旨在容纳词汇表项目（例如字典），并且不需要符号来引导。\n\n#### 有序列表\n\n有序列表非常适合解释完成特定任务的分步说明。要创建有序列表，我们使用\
    \ `<ol>` 元素。由于此元素定义了整个列表，列表中的每个后续项目都必须用 `<li>` 元素定义，并且所有 `<li>` 元素都包含在 `<ol>`\
    \ 元素内。\n\n以下示例展示了有史以来排名前 5 的电影列表。\n\n```html\n<ol>\n    <li>Avatar</li>\n    <li>Titanic</li>\n\
    \    <li>The Avengers</li>\n    <li>Harry Potter</li>\n    <li>Frozen</li>\n</ol>\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_43_0.png)\n\n**图 5.** 排名前 5 的电影列表\n\
    \n在有序列表中，HTML 将从值 '1' 开始连续编号每个项目，除非另有指定。我们不需要提供数字；相反，浏览器会自动在每个列表项前面添加适当的数字。\n"
