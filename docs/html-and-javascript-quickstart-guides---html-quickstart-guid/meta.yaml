  md: '# Basic Document Template


    Regardless of its content, every web page has the same basic foundation for a
    document structure.


    # The <html> element


    In an HTML document everything begins and ends with the <html> tag. This tag tells
    the browser that what is being read is an HTML document and should therefore be
    processed as a web page. The <html> tag is also known as the root of the HTML
    document, meaning that every other tag in the document will be placed inside this
    root element. To begin our web page, we will type in <html></html>, leaving a
    few rows in between for the other tags.


    ```

    <html>


    </html>

    ```


    > **Note:** When writing tags it is common practice to write the opening and the
    closing tags at the same time and then place the content in between. As there
    will be many tags written throughout web page documents, this makes it easier
    to ensure that all opened tags have been closed.


    In the new HTML5 specification, the <html> tag can be extended with the manifest
    attribute. This attribute accepts the location of a manifest file, which in turn
    contains information on the document’s cache. This means that the browser is instructed
    to store the files listed in the manifest locally on the user’s computer in order
    to allow the user to access the page without an Internet connection. The manifest
    file listed in the attribute is a simple text file that lists the resources that
    the browser should cache for offline access. Except for offline browsing, cached
    resources help the page load faster and decrease the request load on the server.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Head and Body


    Web pages are divided into two sections, the head and the body, with each section
    defined with the <head> and <body> tags respectively.


    The <head> tag contains information that describes the HTML document. The information
    placed inside this tag is not displayed in the web browser window, but is instead
    used to define specific functionalities that apply to the web page. It can contain
    a large amount of information such as document title, scripts, styles, and meta
    information. This element can be used only once in a web page. It starts immediately
    after the opening <html> tag and ends directly before the <body> tag. It contains
    no specific attributes that are supported in HTML5.


    The body of our HTML document encloses the content of our web page. This is the
    part that visitors will see, including all the content such as text, links, lists
    tables, and images. It contains no specific attributes that are supported in HTML5.
    We will focus more on the body element and its subsequent content in the following
    chapter.


    To create the head and body sections:


    +   1) Directly after the opening HTML tag type <head>.

    2) Leave a few spaces for the contents of the head section.

    3) Type </head>.

    4) After the second </head> tag, type <body>.

    5) Leave a few spaces for the contents of the web page.

    6) Type </body>.


    At this point your document should look like this:


    ```

    <html>

    <head>

    ```'
