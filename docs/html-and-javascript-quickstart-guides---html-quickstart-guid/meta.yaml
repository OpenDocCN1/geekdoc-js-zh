  md: '# Loop Statements


    During our daily activities to complete a task we have to repeat the same series
    of steps over and over again. To wash the dishes, we have to wash each dish separately.
    To climb down the stairs we have to step down one stair at a time. At the checkout
    counter, we have to take each item out of the cart, scan it and put it back in
    a bag. Well, in programming repetitive tasks are very easy to do. As a matter
    of fact, JavaScript is very good at performing repetitive tasks as it has all
    the necessary tools to do the same thing over and over again. In programming lingo,
    repeatedly performing the same task is called a loop.


    There are several different types of loops. They essentially do the same thing,
    but the approach is slightly different. In this section we will familiarize ourselves
    with while loops and for loops.'
  merge: -1
  pgno: 141
- img_proc: true
  md: "# # While Loops\n\nIn a while loop, the same code is repeated as long as a\
    \ certain condition is true. Let us dive into an example that checks our age as\
    \ we grow every year.\n\n```\nvar age = 1;\nwhile (age < 18) {\n    document.write(\"\
    Another year has passed. You are now \"+age+\" years old.<br>\");\n    age = age\
    \ + 1;\n}\ndocument.write(age+\"? Congratulations! You are now an adult.\");\n\
    ```\n\nIn this example, after declaring the age variable, we introduce a while\
    \ statement. Following the while keyword we place a condition between parentheses,\
    \ which in our case is age<18 . If the condition is true, the JavaScript interpreter\
    \ will run the code that appears between the braces. Unlike a conditional statement,\
    \ when the closing brace of the while statement is reached, JavaScript does not\
    \ continue with the rest of the program, but instead it initiates the while statement\
    \ again. As long as the number stored in the age variable is less than 18, the\
    \ script will run the document.write() command.\n\nOnly when the condition is\
    \ false, the interpreter will ‘exit’ the loop and continue parsing the rest of\
    \ the code. This makes the last line of the while loop very important. It not\
    \ only changes the value of the condition variable, but it also makes it possible\
    \ for the test condition to eventually be false. Without this possibility, we\
    \ will ‘lock’ the interpreter into performing the same task over and over again...\
    \ forever. This is known as an infinite loop, which is essentially a loop that\
    \ never completes. An infinite loop will run either until it crashes the computer\
    \ or it receives a timeout from a modern interpreter after a certain period of\
    \ time."
  merge: -1
