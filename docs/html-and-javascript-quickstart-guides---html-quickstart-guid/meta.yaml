  md: '# Paragraphs & Line Breaks


    To define a paragraph of text we will use the <p> element. Paragraphs are the
    first and the most common levels of structure for web page text. To define a paragraph,
    we simply enclose the text in between the opening and the closing <p> tag.


    ```

    <p>Name: Scott Johnson</p>

    ```


    When we put several paragraphs in a row, the browser separates the paragraphs
    by approximately a half line of text by default. However, if the paragraph is
    empty, the browser will completely ignore the element, and it won’t display it
    as an extra line break.


    ```

    <p>Name: Scott Johnson</p>


    <p>Occupation: Web Designer</p>


    <p></p>


    <p>Date of birth: 09/09/1980</p>

    ```


    ![](img/f8023be36714e65595b822db3c227be4_35_0.png)'
