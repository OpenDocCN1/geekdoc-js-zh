    # Quotations


    We can indicate that a selection of text is quoted from another source using the
    <blockquote> element. The <blockquote> element only indicatesthat its content
    was sourced from somewhere else, so we still need to use elements such as headlines
    and paragraphs to mark up the quotation’s content. For shorter quotations that
    don’t need additional document structure, we can use the <q> element. Both the
    <blockquote> and the <q> elements can be extended with the cite attribute. The
    cite attribute specifies the URL source of the quotation. An example for <blockquote>
    is:


    ```

    <blockquote cite="http://www.worldwildlife.org/who/index.html">

    <p> For 50 years, WWF has been protecting the future of nature. The world’s leading
    conservation organization, WWF works in 100 countries and is supported by 1.2
    million members in the United States and close to 5 million globally.</p>

    </blockquote>

    ```


    A short quote, <q> example is:


    ```

    <p>WWF’s goal is to: <q cite="http://www.wwf.org">Build a future where people
    live in harmony with nature. </q>We hope they succeed.</p>

    ```'
