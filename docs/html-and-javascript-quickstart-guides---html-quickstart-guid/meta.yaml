  md: "# Nesting Lists\n\nWhile lists work well on their own, we may create lists\
    \ within a list, also known as nesting lists. This technique allows us to build\
    \ multilayered outlines and detailed sequences of instructions. We can even mix\
    \ ordered and unordered lists.\n\nTo nest a list, we declare a new list, <ol>\
    \ or <ul>, inside a <li> element of an existing list. For example, we can reorganize\
    \ our Education list in our sample CV as follows:\n\n```\n<ul>\n    <li>MIT</li>\n\
    \    <ul>\n        <li>PhD Degree in Computer Science</li>\n        <li>Bachelor\
    \ Degree in Computer Science</li>\n    </ul>\n    <li>Santa Rosa High School</li>\n\
    </ul>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_48_0.png)"
