    \ ‘phase1’ 的元素：\n\n```\nvar firststop = document.getElementById(\"phase1\");\n\
    ```\n\n通过在 document 对象上使用 `getElementById()` 方法，意味着我们在页面上的任何地方搜索具有此 ID 的元素。一旦获取了\
    \ ‘phase1’ 元素（在我们的例子中是第一个 `<h1>` 元素），该节点的引用就存储在 `firststop` 变量中，我们可以使用 JavaScript\
    \ 进行更改。例如，我们将 `class` 属性赋值为 ‘current’ 给这个元素。我们将把这段代码放在文档 `<head>` 部分的 `<script>`\
    \ 标签中。\n\n```\nvar firststop = document.getElementById(\"phase1\");\nfirststop.className\
    \ = \"current\";\n```\n\n**图27. 更改页面元素的样式**\n"
