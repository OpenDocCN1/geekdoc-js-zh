  md: '# # Chapter 3: Functions


    By now we have seen that when writing JavaScript code we are actually writing
    detailed instructions for what we want to happen one step at a time. In real life,
    we need detailed instructions only for the first time we perform the action. Afterwards
    we familiarize ourselves with the steps and do the actions automatically. For
    example, let us go back to the first time we used a touchscreen smartphone. To
    turn on the phone we had to perform two unknown actions: click a button to initiate
    the screen and swipe across the screen to unlock the phone. For each subsequent
    time we wanted to turn our phone on, we didn''t need these instructions; we had
    already committed them to memory.


    JavaScript has a similar mechanism that memorizes steps of a frequently used action,
    and this mechanism is called a function. A function is a series of steps we create
    in the beginning of our script in order to use it whenever we need those steps
    performed. We write the code only once and we run it any time we desire.


    This chapter will explain the fundamentals behind using functions. We will learn
    what a function is, how to define and structure functions, and how to call functions
    in our scripts.'
  merge: -1
  pgno: 148
- img_proc: true
  md: "# Creating Functions\n\nThe main purpose of a function is to perform a series\
    \ of actions through a single command. The actual task that the function will\
    \ perform is dependent on the code itself. It can be something simple as writing\
    \ a single line of text in the browser, to complex calculations such as evaluation\
    \ the final price of a shopping basket including discounts and shipping methods.\
    \ Except for making our scripts more portable, functions are useful because they\
    \ are reusable. Rather than rewriting blocks of code, we can use the function\
    \ as many times as necessary. This becomes especially helpful when the functions\
    \ are lengthy and perform complex tasks.\n\nTo define a basic function in JavaScript\
    \ it is necessary to declare it with its name and code. When choosing a name for\
    \ a function it would be preferable if we select a name that reflects its purpose.\
    \ Basically, the name of the function should indicate what the function does.\n\
    \nFor our initial example we will use the keyword function followed by the function\
    \ name writeText and a set of parentheses to declare a function:\n\n```\nfunction\
    \ writeText() {\n    document.write(“The answer is 42.”);\n}\n```\n\nBy using\
    \ the keyword function we inform the interpreter that what follows is a series\
    \ of steps that need to be remembered. The steps are listed between two curly\
    \ braces, which mark the beginning and the end of the JavaScript code that is\
    \ a part of the function. In the example above, the steps will be remembered as\
    \ the name of the function, which is writeText . Hence, whenever we want to initiate\
    \ this sequence of steps it will be sufficient to only write out the function\
    \ name followed by empty parentheses. This is also known as calling a function.\n\
    \n```\nwriteText();\n```\n\nIn this basic example, every time we call the function\
    \ within the main script the text “The answer is 42.” will be written on the web\
    \ page. For a more precise and functional example, let us modify a previous script\
    \ and create a function that will check the age of the user.\n\n```\nfunction\
    \ checkAge() {\n    if (age >= 18) {\n        document.write(“You have reached\
    \ the age of wisdom, please enter and have some fun.”);\n    }\n}\n```"
