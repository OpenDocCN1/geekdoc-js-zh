    # 数学运算符


    JavaScript 中直接提供了基本的数学运算符，如加法 (+)、减法 (-)、乘法 (*) 和除法 (/)。它们可用于独立的语句中，也可在声明变量时使用。例如，通过对变量
    `currentYear` 和 `yearofBirth` 进行“运算”，我们可以确定变量 `age` 的值。


    ```javascript

    var currentYear = 2015;

    var yearofBirth = 1979;

    var age = currentYear - yearofBirth;

    document.write(age);

    ```


    ![](img/f8023be36714e65595b822db3c227be4_119_0.png)


    **图 4. 使用变量计算年龄**


    > *注意：将变量“调用”到网页上显示很容易。只需使用 `document.write()` 命令即可。*


    数学运算符，特别是加法运算符，可用于组合两个或多个字符串。这种组合字符串的过程称为连接。在下面的例子中：


    ```javascript

    var firstName = "Martwan";

    var lastName = "Jenkins";

    var fullName = firstName + lastName;

    document.write(fullName);

    ```


    ![](img/f8023be36714e65595b822db3c227be4_120_0.png)


    `fullName` 的值最终会是 `MartwanJenkins`。为了确保格式正确，我们需要在引号中包含空格作为字符串。例如，我们可以使用以下声明：


    ```javascript

    var fullName = firstName + " " + lastName;

    ```


    ![](img/f8023be36714e65595b822db3c227be4_121_0.png)


    **图 6. 连接带空格的字符串**


    我们可以看到，运算符在连接文本和/或组合变量时也非常有用。事实上，我们可以用它来构建更具逻辑性的句子。例如，我们可以将“My name is”文本与一个计算变量的值组合起来。


    ```javascript

    var firstName = "Martwan";

    var lastName = "Jenkins";

    var fullName = firstName + " " + lastName;

    document.write("My name is " + fullName);

    ```


    ![](img/f8023be36714e65595b822db3c227be4_122_0.png)


    **图 7. 连接完整的句子**


    > **注意：** 在一个语句中执行多个数学运算时，需要遵循运算优先级规则。


    # 赋值运算符


    就像现实生活中事物会变化一样，JavaScript 程序中的变量也会变化。为了在 JavaScript 中改变变量，我们将使用赋值运算符。我们已经熟悉基本的赋值运算符等号
    (=)，它用于给变量赋予初始值或新值。还有其他赋值运算符也可以改变变量的值，但它们的方式略有不同。


    例如，随着时间的流逝，我们年龄增长，年龄逐年递增变化。在 JavaScript 中实现这种变化有几种不同的方法，结果都是一样的。为了尝试改变变量的可能性，我们可以尝试下面的代码，其中
    `age` 变量的值改变后会在浏览器中显示：


    ```javascript

    var age = 35;

    document.write("<p>My age is \"" + age + "\"</p>");

    age = age + 1;

    document.write("<p>A year has passed, so now I am \"" + age + "\"</p>");

    age += 10;

    document.write("<p>What? Are you telling me that I am a grandad now? But I am
    only \"" + age + "\"</p>");

    ```


    ![](img/f8023be36714e65595b822db3c227be4_123_0.png)


    图 8. 使用赋值运算符改变变量


    虽然这些操作起初看起来可能有点令人困惑，但从编程的角度来看，它们仍然是合乎逻辑的。例如，如果我们反向读取语句 `age=age+1`，发生的事情是将值 1
    加到当前年龄 35 上，这将使 36 成为 `age` 的新值。此外，我们可以在语句 `age+=10` 中使用复合赋值运算符（如 `+=`）来将变量的值增加
    10。我们也可以将同样的逻辑应用于其他运算，如减法、除法和乘法。


    ```javascript

    age -= 5;    等同于    age = age - 5;

    age *= 5;    等同于    age = age * 5;

    age /= 5;    等同于    age = age / 5;

    ```


    此外，当我们想将变量的值增加/减少 1 时，也可以使用以下赋值运算符：


    ```javascript

    age++;     等同于    age = age + 1;

    age--;     等同于    age = age - 1;

    ```


    # 比较运算符


    顾名思义，比较运算符用于比较两个值。比较完成后，会返回一个 true 或 false 的值，具体取决于比较是否精确。比较运算符主要用于在循环或条件语句中评估条件，这将在下一章中讨论。


    下表总结了最常见的比较运算符。


    | 运算符 | 含义             | 示例    | 返回值 |

    | ------ | ---------------- | ------- | ------ |

    | ==     | 等于             | 4 == 4  | 真     |

    | >      | 大于             | 3 > 4   | 假     |

    | <      | 小于             | 3 <   | 真     |

    | >=     | 大于或等于       | 4 >= 4  | 真     |

    | <=     | 小于或等于       | 4 <= 5  | 真     |

    | !=     | 不等于           | 3 != 4  | 真     |


    表 1. 比较运算符


    # 逻辑运算符


    逻辑运算符允许我们比较两个或多个条件语句。通过比较，我们可以确定哪个语句为真，从而相应地进行处理。与比较运算符一样，逻辑运算符返回一个 true 或 false
    的值，具体取决于运算符两侧的值。三个最常见的逻辑运算符是 AND、OR 和 NOT。


    AND 运算符由 `&&` 代码表示。只有当 `&&` 运算符两侧的语句都为真时，运算符才返回真值。如果其中一个或两个语句为假，运算符返回假值。这与日常语言的规则一致，例如，语句“*这件夹克有所有美国的颜色，红、白和蓝*”只有在夹克是红色的（真）、白色的（真）和蓝色的（真）时才为真。如果其中一种颜色不同（假），那么该语句也为假。在
    JavaScript 语法中，它看起来类似于以下内容：


    ```javascript

    (color1 == "red" && color2 == "white" && color3 == "blue")

    ```


    OR 运算符由 `||` 代码表示。如果运算符一侧或两侧的语句为真，它就返回真值。只有当两个语句都为假时，运算符才会返回假值。例如，语句“*我的哥哥暑假要么去巴西，要么去泰国*”如果我哥哥去了其中一个（或可能两个）地方，那就是真的。


    ```javascript

    (destination1 == "Brazil" || destination2 == "Thailand")

    ```


    NOT 运算符由 `!` 代码表示，用于“声明”相反的语句为真。因此，对于除了明确陈述的条件之外的任何其他条件，运算符都会返回真值。例如，语句“*布莱恩的体重不是
    200 磅*”对于除 200 以外的任何体重值都是真的。


    ```javascript

    !(weight == 200)

    ```


    我们将在下一章学习逻辑运算符更实际的应用，届时我们将重点介绍条件语句和循环。


    # 数组


    到目前为止我们检查过的变量一次只能记住一条信息。然而，我们经常需要跟踪多个值，比如一年的月份或购物清单。在这种情况下，JavaScript 提供了一种很好的方式来在单个变量下记住多个值，称为数组。让我们从定义一个数组变量开始，它将保存一年的前六个月。


    ```javascript

    var months = ["January", "February", "March", "April", "May", "June"];

    ```


    声明数组变量时，我们首先使用 `var` 关键字，后跟变量名，就像普通变量一样。由于数组包含多个项目，我们将在方括号 `[]` 之间为每个项目提供一个值。像普通变量一样，如果项目的值是字符串，我们会将其放在引号内。否则，如果值是数字或可能是另一个变量，我们不会使用任何引号字符。例如，我们可以声明以下随机项目的数组：


    ```javascript

    var randomItems = ["ball", -0.5, "black pony", 333, true];

    ```


    也可以定义一个空数组。我们将使用相同的语法，但省略任何项目的值。


    ```javascript

    var hole = [];

    ```

