    we want to link the text to the www.carljung.com web page.


    ```

    <a href=”http://www.carljung.com”>Carl Jung</a>

    ```


    Each HTML element has a certain set of valid attributes and valid values for those
    attributes. A tag’s properties can be expanded upon with more than one attribute.
    All of the attributes are included in the same opening tag of the element and
    are separated with an empty space. For example, the following code defines both
    the width and the height of an image.


    ```

    <img width=”200” height=”100”></img>

    ```


    > **Note:** End tags never contain any attributes.


    A common question concerns the difference between tags and attributes. Generally,
    attributes are used when you need to describe the data itself. In other words,
    if it’s data that’s meant to be seen by the end user, it’s best to mark it up
    in an element. If it’s data that describes some other data in the document, it’s
    best to use an attribute.'
