  md: '# Empty Spaces


    We have already learned that browsers ignore extra spaces and line breaks in the
    HTML, so what happens in the rare situation in which we need to use additional
    spaces? Well, in HTML empty space is treated like a special character and needs
    to be entered as a special code, `&nbsp;`. The & symbol signals to the browser
    that a code for a special character will follow; the nbsp is the code for the
    special character, which in this case is a short-hand for non-breaking space,
    while the semicolon (;) signals to the browser that the code for the special character
    has ended and from here on out the text should be treated as normal.'
  merge: -1
