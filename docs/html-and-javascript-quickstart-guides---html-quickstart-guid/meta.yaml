    \ will not need to supply the numbers; instead, the browser will automatically\
    \ add the appropriate number in front of each list item. This allows us to"
- md: "## Ordered Lists\n\nOrdered lists can be extended with three attributes: `start`,\
    \ `type` and `reversed`. By default, the browser will align and indent the list\
    \ items and insert some space between the paragraph preceding the list and the\
    \ list itself. It is also possible to insert and remove list items without messing\
    \ up the numbering scheme.\n\n- The **start** attribute lets us start the list\
    \ at a value other than 1. However, there is no way to continue the numbering\
    \ from a previous list.\n- The **type** attribute lets us choose the numbering\
    \ styles from numbers, roman numerals and letters. The values for the type attribute\
    \ are presented in Table 1.\n- The **reversed** attribute, which is exclusive\
    \ to HTML5, allows us to specify the list numbering in a descending order. This\
    \ attribute doesn’t come with any values.\n\n| ATTRIBUTE VALUE | NUMBERING | EXAMPLE\
    \ |\n| :---: | :---: | :---: |\n| 1 | Numbers | 1,2,3 |\n| a | Lowercase Letters\
    \ | a,b,c |\n| A | Uppercase Letters | A,B,C |\n| i | Lowercase Roman Numerals\
    \ | i,ii,iii |\n| I | Uppercase Roman Numerals | I,II,III |\n\n**Table 1.** Types\
    \ of Ordered Lists\n\nThe following example will reverse the numbering in the\
    \ list of top 5 movies:\n\n```html\n<ol reversed>\n  <li>Frozen</li>\n  <li>Harry\
    \ Potter</li>\n  <li>The Avengers</li>\n  <li>Titanic</li>\n  <li>Avatar</li>\n\
    </ol>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_45_0.png)\n\n**Image 6.**\
    \ Descending List of Top 5 Movies\n\n## Unordered Lists\n\nUnordered lists are\
    \ very similar to ordered lists but with bullets rather than numbers to precede\
    \ the list items. They are the most widely used lists on the web for a series\
    \ of items that requires no particular order. For unordered lists, we use the\
    \ `<ul>` element as a substitute for the `<ol>` element, but each item on the\
    \ list will remain defined by the `<li>` element.\n\nAs an example let’s use an\
    \ unordered list to present the Education section in our sample CV:\n\n```html\n\
    <ul>\n    <li>PhD in Computer Science at MIT</li>\n    <li>Bachelor of Computer\
    \ Science at MIT</li>\n    <li>Santa Rosa High School</li>\n</ul>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_46_0.png)\n\
    \n**Image 7.** Unordered List for Education Section\n\nThe unordered list has\
    \ no attributes that are supported by HTML5.\n\n**Note:** For both ordered and\
    \ unordered lists, no text is permitted between the opening list tag (`ol` or\
    \ `ul`) and the first `li` tag.\n\n## Nesting Lists\n\nWhile lists work well on\
    \ their own, we may create lists within a list, also known as nesting lists. This\
    \ technique allows us to build multilayered outlines and detailed sequences of\
    \ instructions. We can even mix ordered and unordered lists.\n\nTo nest a list,\
    \ we declare a new list, `<ol>` or `<ul>`, inside a `<li>` element of an existing\
    \ list. For example, we can reorganize our Education list in our sample CV as\
    \ follows:\n\n```html\n<ul>\n    <li>MIT</li>\n    <ul>\n        <li>PhD Degree\
    \ in Computer Science</li>\n        <li>Bachelor Degree in Computer Science</li>\n\
    \    </ul>\n    <li>Santa Rosa High School</li>\n</ul>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_48_0.png)\n\
    \n## Description Lists\n\nHTML provides a third type of list called a description\
    \ list. In previous HTML revisions, the name “definition list” was used instead\
    \ of “description list.” This type of list has a slightly different structure\
    \ than unordered and ordered lists and is well suited for glossaries and dictionaries.\
    \ It can work well with any text structure that needs to pair a word or a phrase\
    \ with a longer description.\n\nThe description list is defined by the `<dl>`\
    \ element. Each description list item contains two parts: a term and a description.\
    \ The term is used to define a term/name and utilizes the `<dt>` element. The\
    \ definition element, `<dd>`, follows the `<dt>` element and is used to describe\
    \ the term/name.\n\nIn the HTML5 specification, no additional attributes are supported\
    \ for any description list element.\n\n> *Note: When using description lists,\
    \ it is possible to define multiple descriptions for one item by adding each description\
    \ in an additional `<dd>` element.*\n\nThe following description list example\
    \ defines the different ways to prepare espresso:\n\n```html\n<dl>\n    <dt>Cappuccino</dt>\n\
    \    <dd>1 part espresso, 1 part hot milk, steamed milk foam</dd>\n    <dt>Macchiato</dt>\n\
    \    <dd>1 part espresso, 1 part foamed milk, shaved cocoa</dd>\n    <dt>Espresso</dt>\n\
    \    <dd>1 part espresso, 0 parts of anything else</dd>\n</dl>\n```\n\n**Cappuccino**\n\
    1 part espresso, 1 part hot milk, steamed milk foam\n\n**Macchiato**\n1 part espresso,\
    \ 1 part foamed milk, shaved cocoa\n\n**Espresso**\n1 part espresso, 0 parts of\
    \ anything else\n\n**Image 9.** Definition List for Different Espresso Drinks\n\
    \n## Quotations\n\nWe can indicate that a selection of text is quoted from another\
    \ source using the `<blockquote>` element. The `<blockquote>` element only indicates\
    \ that its content was sourced from somewhere else, so we still need to use elements\
    \ such as headlines and paragraphs to mark up the quotation’s content. For shorter\
    \ quotations that don’t need additional document structure, we can use the `<q>`\
    \ element. Both the `<blockquote>` and the `<q>` elements can be extended with\
    \ the `cite` attribute. The `cite` attribute specifies the URL source of the quotation.\
    \ An example for `<blockquote>` is:\n\n```html\n<blockquote cite=\"http://www.worldwildlife.org/who/index.html\"\
    >\n<p>For 50 years, WWF has been protecting the future of nature. The world’s\
    \ leading conservation organization, WWF works in 100 countries and is supported\
    \ by 1.2 million members in the United States and close to 5 million globally.</p>\n\
    </blockquote>\n```\n\nA short quote, `<q>` example is:\n\n```html\n<p>WWF’s goal\
    \ is to: <q cite=\"http://www.wwf.org\">Build a future where people live in harmony\
    \ with nature.</q> We hope they succeed.</p>\n```\n\n## Additional Text Elements\n\
    \nThe HTML5 specification contains additional tags that give text different semantic\
    \ meanings. These tags have either been inherited and redefined from previous\
    \ HTML revisions or are brand new for this latest iteration. Here are some of\
    \ the more commonly used tags:\n\n- `<em>` is used to stress emphasis. The emphasis\
    \ is linguistic; if spoken it would emphasize pronunciation on a word, which would\
    \ change the nuance of the sentence. By default the browser renders the `<em>`\
    \ element as italic text.\n- `<strong>` is used to show strong importance for\
    \ its content as defined by the user. By default the browser renders the `<strong>`\
    \ element as bold text.\n- `<small>` is used for side comments such as small print,\
    \ a copyright statement, a disclaimer and similar items.\n- `<mark>` is a new\
    \ HTML5 element used to indicate text that we are specifically trying to highlight\
    \ without changing its importance or emphasis. The mark element represents a run\
    \ of text in one document marked or highlighted for reference purposes due to\
    \ its relevance in another context.\n- `<sub>` defines subscript text. Subscript\
    \ text is mostly used in math and chemistry formulas. It will appear below the\
    \ normal line and will often be rendered in a smaller font.\n- `<sup>` defines\
    \ superscript text. Superscript text is mostly used in footnotes or math. It will\
    \ appear half a character above the normal line and will often be rendered in\
    \ a smaller font.\n- `<abbr>` defines an abbreviation. This element is usually\
    \ extended with the `title` attribute to show the full version of the abbreviation/acronym\
    \ when we mouse the cursor over the marked content.\n- `<hr>` is a horizontal\
    \ rule used for a paragraph-level thematic break, which indicates a change in\
    \ topic. By default the browser presents the `<hr>` element as a horizontal line.\n\
    \nIn our CV example we can use the `<strong>` element to indicate the importance\
    \ of the text labels within the Personal Info section.\n\n```html\n<h2>Personal\
    \ Info</h2>\n\n<p><strong>Name:</strong> Scott Johnson</p>\n\n<p><strong>Occupation:</strong>\
    \ Web Designer</p>\n\n<p><strong>Date of birth:</strong> 09/09/1980</p>\n\n<p><strong>Address:</strong><br>\n\
    523 Beaumont Way<br>\nSanta Rosa<br>\nCalifornia 52409</p>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_54_0.png)\n\
    \nWe can also use the `<sup>` and `<sub>` elements to note names of specific companies\
    \ in our"
  mdcn: "\n## 有序列表\n\n有序列表可以通过三个属性进行扩展：`start`、`type` 和 `reversed`。默认情况下，浏览器会对齐并缩进列表项，并在列表前的段落和列表本身之间插入一些间距。也可以在不打乱编号方案的情况下插入和删除列表项。\n\
    \n-   **start** 属性允许我们从一个不是1的值开始列表。但是，无法从先前的列表继续编号。\n-   **type** 属性允许我们从数字、罗马数字和字母中选择编号样式。type\
    \ 属性的值在表1中列出。\n-   **reversed** 属性是 HTML5 独有的，允许我们指定列表按降序编号。该属性没有值。\n\n| 属性值 |\
    \ 编号方式 | 示例 |\n| :---: | :---: | :---: |\n| 1 | 数字 | 1,2,3 |\n| a | 小写字母 | a,b,c\
    \ |\n| A | 大写字母 | A,B,C |\n| i | 小写罗马数字 | i,ii,iii |\n| I | 大写罗马数字 | I,II,III\
    \ |\n\n**表 1.** 有序列表的类型\n\n以下示例将反转“前5部电影”列表中的编号：\n\n```html\n<ol reversed>\n \
    \ <li>Frozen</li>\n  <li>Harry Potter</li>\n  <li>The Avengers</li>\n  <li>Titanic</li>\n\
    \  <li>Avatar</li>\n</ol>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_45_0.png)\n\
    \n**图 6.** 前5部电影的降序列表\n\n## 无序列表\n\n无序列表与有序列表非常相似，但列表项前是项目符号而非数字。它们是网页上最常用的列表，用于一系列不需要特定顺序的项目。对于无序列表，我们使用\
    \ `<ul>` 元素作为 `<ol>` 元素的替代，但列表中的每个项目仍然由 `<li>` 元素定义。\n\n例如，让我们使用无序列表来展示示例简历中的教育背景部分：\n\
    \n```html\n<ul>\n    <li>PhD in Computer Science at MIT</li>\n    <li>Bachelor\
    \ of Computer Science at MIT</li>\n    <li>Santa Rosa High School</li>\n</ul>\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_46_0.png)\n\n**图 7.** 教育背景部分的无序列表\n\
    \n无序列表没有 HTML5 支持的属性。\n\n**注意：** 对于有序列表和无序列表，列表开始标签（`ol` 或 `ul`）和第一个 `li` 标签之间不允许有文本。\n\
    \n## 嵌套列表\n\n虽然列表本身效果很好，但我们可以创建列表内的列表，也称为嵌套列表。这种技术使我们能够构建多层大纲和详细的指令序列。我们甚至可以混合使用有序和无序列表。\n\
    \n要嵌套列表，我们可以在现有列表的 `<li>` 元素内声明一个新列表，`<ol>` 或 `<ul>`。例如，我们可以按以下方式重新组织示例简历中的教育背景列表：\n\
    \n```html\n<ul>\n    <li>MIT</li>\n    <ul>\n        <li>PhD Degree in Computer\
    \ Science</li>\n        <li>Bachelor Degree in Computer Science</li>\n    </ul>\n\
    \    <li>Santa Rosa High School</li>\n</ul>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_48_0.png)\n\
    \n## 描述列表\n\nHTML 提供了第三种类型的列表，称为描述列表。在之前的 HTML 版本中，使用了“定义列表”这个名称而不是“描述列表”。这种列表的结构与无序列表和有序列表略有不同，非常适合用于词汇表和词典。它可以很好地与任何需要将单词或短语与较长描述配对的文本结构一起使用。\n\
    \n描述列表由 `<dl>` 元素定义。每个描述列表项包含两部分：术语和描述。术语用于定义术语/名称，使用 `<dt>` 元素。定义元素 `<dd>` 紧随\
    \ `<dt>` 元素之后，用于描述该术语/名称。\n\n在 HTML5 规范中，描述列表元素不支持任何附加属性。\n\n> *注意：使用描述列表时，可以通过在附加的\
    \ `<dd>` 元素中添加每个描述来为一个项目定义多个描述。*\n\n以下描述列表示例定义了制备浓缩咖啡的不同方法：\n\n```html\n<dl>\n\
    \    <dt>Cappuccino</dt>\n    <dd>1 part espresso, 1 part hot milk, steamed milk\
    \ foam</dd>\n    <dt>Macchiato</dt>\n    <dd>1 part espresso, 1 part foamed milk,\
    \ shaved cocoa</dd>\n    <dt>Espresso</dt>\n    <dd>1 part espresso, 0 parts of\
    \ anything else</dd>\n</dl>\n```\n\n**卡布奇诺**\n1份浓缩咖啡，1份热牛奶，蒸奶泡\n\n**玛奇朵**\n1份浓缩咖啡，1份奶泡，刨可可粉\n\
    \n**浓缩咖啡**\n1份浓缩咖啡，0份其他任何东西\n\n**图 9.** 不同浓缩咖啡饮品的定义列表\n\n## 引文\n\n我们可以使用 `<blockquote>`\
    \ 元素来表明一段文本是从其他来源引用的。`<blockquote>` 元素仅表明其内容来自其他地方，因此我们仍然需要使用标题和段落等元素来标记引文的内容。对于不需要额外文档结构的短引文，我们可以使用\
    \ `<q>` 元素。`<blockquote>` 和 `<q>` 元素都可以用 `cite` 属性进行扩展。`cite` 属性指定引文的 URL 来源。`<blockquote>`\
    \ 的一个示例是：\n\n```html\n<blockquote cite=\"http://www.worldwildlife.org/who/index.html\"\
    >\n<p>For 50 years, WWF has been protecting the future of nature. The world’s\
    \ leading conservation organization, WWF works in 100 countries and is supported\
    \ by 1.2 million members in the United States and close to 5 million globally.</p>\n\
    </blockquote>\n```\n\n短引文 `<q>` 的示例是：\n\n```html\n<p>WWF’s goal is to: <q cite=\"\
    http://www.wwf.org\">Build a future where people live in harmony with nature.</q>\
    \ We hope they succeed.</p>\n```\n\n## 额外的文本元素\n\nHTML5 规范包含额外的标签，这些标签赋予文本不同的语义含义。这些标签要么从之前的\
    \ HTML 版本继承并重新定义，要么是最新版本中全新引入的。以下是一些更常用的标签：\n\n-   `<em>` 用于强调语气。这种强调是语言学上的；如果读出来，它会强调某个单词的发音，这将改变句子的细微差别。默认情况下，浏览器将\
    \ `<em>` 元素渲染为斜体文本。\n-   `<strong>` 用于显示其内容对用户的重要性。默认情况下，浏览器将 `<strong>` 元素渲染为粗体文本。\n\
    -   `<small>` 用于旁注，如小字体印刷品、版权声明、免责声明等类似项目。\n-   `<mark>` 是一个新的 HTML5 元素，用于指示我们特别想要突出显示的文本，而不改变其重要性或强调。mark\
    \ 元素表示文档中的一段文本，因其在另一个上下文中的相关性而被标记或高亮以供参考。\n-   `<sub>` 定义下标文本。下标文本主要用于数学和化学公式。它会出现在正常行下方，并且通常以较小的字体渲染。\n\
    -   `<sup>` 定义上标文本。上标文本主要用于脚注或数学。它会出现在正常行上方约半个字符的位置，并且通常以较小的字体渲染。\n-   `<abbr>`\
    \ 定义缩写。此元素通常使用 `title` 属性进行扩展，以便当我们将鼠标悬停在标记内容上时显示缩写的完整版本。\n-   `<hr>` 是水平分隔线，用于段落级别的主题分隔，表示主题的改变。默认情况下，浏览器将\
    \ `<hr>` 元素呈现为水平线。\n\n在我们的简历示例中，我们可以使用 `<strong>` 元素来表示“个人信息”部分中文本标签的重要性。\n\n\
    ```html\n<h2>Personal Info</h2>\n\n<p><strong>Name:</strong> Scott Johnson</p>\n\
    \n<p><strong>Occupation:</strong> Web Designer</p>\n\n<p><strong>Date of birth:</strong>\
    \ 09/09/1980</p>\n\n<p><strong>Address:</strong><br>\n523 Beaumont Way<br>\nSanta\
    \ Rosa<br>\nCalifornia 52409</p>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_54_0.png)\n\
    \n我们也可以使用 `<sup>` 和 `<sub>` 元素来注明特定公司的名称\n"
