- md: "## Working With Array Items\n\nAccessing array items is not the same as accessing\
    \ common variables. Since an array holds multiple values it is not sufficient\
    \ just to use the name of the array variable, we also need to indicate its location\
    \ within the array. The position of each item in an array is indicated by a number\
    \ called an index. Therefore, to access an array item we have to use the array\
    \ variable name and the index number. For example, if we want to display the first\
    \ and the last item from our months variable we will use the array name followed\
    \ by a number enclosed in square brackets.\n\n```\nvar months = [\"January\",\
    \ \"February\", \"March\", \"April\", \"May\", \"June\"];\ndocument.write(months[0]);\n\
    document.write(months[5]);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_128_0.png)\n\
    \n**Image 9.** Example for defining and displaying array results\n\n> *Note:*\
    \ JavaScript numbers each array item automatically. The index value for the first\
    \ item is always 0, the index value for the second item is always 2, and so on.\n\
    \nWe will use the index position in the case when we want to change the value\
    \ of a specific array item. For example, let us say that in our months array we\
    \ want to replace the name of the months with their shorthand. We can change each\
    \ variable with the following statements:\n\n```\nmonths[0] = “Jan”;\nmonths[1]\
    \ = “Feb”;\nmonths[2] = “Mar”;\nmonths[3] = “Apr”;\nmonths[4] = “May”;\nmonths[5]\
    \ = “Jun”;\n```\n\n## Managing Array Elements\n\nIf we know the index value of\
    \ the last array item, we can simply add more items by assigning values to subsequent\
    \ items. For example, the following statement will add one more item in the array\
    \ under the index value of 6.\n\n```\nmonths[6] = “Jul”;\n```\n\nHowever, while\
    \ programming we are almost never required to actually remember such trivialities\
    \ such as the last index value. Instead, to add one or more elements to the end\
    \ of an array we can use the keyword push. To add the final five months to our\
    \ months array, we will combine the push keyword with the array name to form the\
    \ following statement:\n\n```\nmonths.push(“Aug”, “Sep”, “Oct”, “Nov”, “Dec”,\
    \ “Jan”);\n```\n\nWell, it seems that we went over and added an extra month. To\
    \ remove the last element of an array we will use the pop keyword. Like previously,\
    \ we will combine the pop keyword with the array name to form the following statement:\n\
    \n```\nmonths.pop();\n```\n\nThis statement will delete the last array element,\
    \ “Jan”, leaving us with an array containing all the months of the year. When\
    \ we want to add an element to the beginning of an array instead of the end, we\
    \ can use the unshift keyword. Alternatively, when we want to remove an element\
    \ from the beginning of an array we can use the shift keyword. The following two\
    \ statements will add and subsequently remove a bogus first month to our array.\n\
    \n```\nmonths.unshift(“Sext”);\nmonths.shift();\n```\n\nIf at any time we want\
    \ to check the number of elements that are contained within an array, we can initiate\
    \ the length property for the months array, `months.length`, and print it with\
    \ the document.write statement. To review all the different aspects we have covered\
    \ our complete code will be:\n\n```\nvar months = [“January”, “February”, “March”,\
    \ “April”, “May”, “June”];\nmonths[0] = \"Jan\";\nmonths[1] = \"Feb\";\nmonths[2]\
    \ = \"Mar\";\nmonths[3] = \"Apr\";\nmonths[4] = \"May\";\nmonths[5] = \"Jun\"\
    ;\nmonths[6] = \"Jul\";\nmonths.push(\"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"\
    , \"Jan\");\nmonths.pop();\nmonths.unshift(\"Sext\");\nmonths.shift();\ndocument.write(\"\
    The number of items in the array is: \", months.length);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_131_0.png)\n\
    \n## Image 10. Manipulating and displaying the array length\n\n## Comments\n\n\
    From working with HTML and CSS we should already be familiar with comments. Basically,\
    \ commenting is a way to tell the browser to ignore segments of the code. The\
    \ purpose of comments is to leave notes about our code either for us or whoever\
    \ is going to read the code after us. As JavaScript can be more difficult to understand\
    \ when it is revised on a later date, commenting is even more important.\n\nJavaScript\
    \ recognizes two different approaches to commenting, marking a single line as\
    \ a comment and marking multiple lines as comments. Regardless of the approach,\
    \ lines which are commented will not be executed by the interpreter.\n\nSingle\
    \ line comments are created by two forward slashes. When the interpreter finds\
    \ two forward slashes it will ignore everything that follows until the end of\
    \ the line.\n\n```\n//this is a single line comment\n```\n\nIt is also possible\
    \ to write a line that is part code and part comment. In the following example,\
    \ after the variable year is declared, the rest of the line will be treated as\
    \ a comment.\n\n```\nvar year = 2015; //this is most likely the current year\n\
    ```\n\nWhen we need more than one line of comments we can use an alternative approach.\
    \ Multiline comments in JavaScript are the same as multiline comments in CSS.\
    \ The comments have a beginning, initiated by a forward slash and an asterisk\
    \ (/*) and they have an end initiated by an asterisk and a forward slash (*/).\
    \ Anything between these opening and closing comment signifiers will always be\
    \ ignored by the interpreter.\n\n```\n/*This is a comment that\nis written in\
    \ exactly\nthree lines */\n```\n\n# Chapter 2: Conditional & Loop Statements\n\
    \nCreating a variable and storing a value in the variable is not really an accomplishment,\
    \ neither is changing this variable with simple operators. What we need to do\
    \ to start making things interesting is to make our programs react to our actions,\
    \ make them more intelligent. And we can do this by using conditional statements\
    \ and loops.\n\n## Conditional Statements\n\nWe make a myriad of choices during\
    \ our everyday activities: *“Should I get out of bed?”*, *“What should I eat?”*,\
    \ *“Where should I go for coffee?”*. These choices depend on the current situation\
    \ as our decisions are affected by the surrounding circumstances. In a similar\
    \ fashion, JavaScript also has decision-making capabilities called conditional\
    \ statements. Fundamentally, conditional statements are a simple yes or no question\
    \ with the program doing one thing if the answer is yes, and either nothing or\
    \ another thing if the answer is no.\n\nThe most basic conditional statement is\
    \ the so-called if statement. This statement executes a task only if the answer\
    \ to the question is true. To understand the syntax of an if statement let us\
    \ look at the following example:\n\n```\nvar age = prompt(\"What is your age?\"\
    ,\"\");\n\nif (age > 30) {\n    document.write (\"You are not so young anymore.\"\
    );\n}\n```\n\nThe if statement consists of three parts. The if keyword indicates\
    \ that what follows is a conditional statement. The parentheses, (), contain the\
    \ yes/no question, also known as the condition. Finally, the curly braces, {},\
    \ contain one or more statements that need to be executed if the answer to the\
    \ question is positive. Essentially, the { brace marks the beginning and the }\
    \ brace marks the end of the code that will be run if the condition is fulfilled.\n\
    \nIn our example, the condition is a comparison between two values. With the condition\
    \ (age>30) we check whether the age variable has a value greater than 30. If the\
    \ condition is true then the statement to write the text within the brackets on\
    \ the web page is executed, otherwise, if false, the interpreter will skip all\
    \ of the statements within the curly brackets.\n\n## Alternative Conditions\n\n\
    In real life when one condition fails we always have an alternative. If the restaurant\
    \ is out of cake, we can always order a fruit salad for dessert. Similarly, in\
    \ JavaScript we also want something to happen when the condition is true and when\
    \ the condition is false. To achieve this we can extend the if statement with\
    \ an else clause. For example:\n\n```\nvar age = prompt(\"What is your age?\"\
    , \"\");\nif (age < 18) {\n    document.write(\"You can enter the web site.\"\
    );\n}\nelse {\n    document.write(\"You are too old to watch cartoons.\");\n}\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_136_0.png)\n\n**Image 11.** Using\
    \ a conditional statement to respond to users' input\n\nIn the example above the\
    \ user is asked to enter his/her age. Then the if statement evaluates whether\
    \ the value of the age variable is less than 18. If this is true, the text \"\
    You can enter the web site\" is displayed on the page. If this condition is false,\
    \ and the user has entered a value that is equal to or greater than 18, then the\
    \ else clause is initiated and the text \"You"
  mdcn: "\n## 处理数组元素\n\n访问数组元素与访问普通变量不同。由于数组包含多个值，仅使用数组变量名是不够的，我们还需要指明元素在数组中的位置。数组中每个元素的位置由一个称为索引的数字表示。因此，要访问数组元素，必须使用数组变量名和索引号。例如，如果我们想显示`months`变量的第一个和最后一个元素，我们将使用数组名后跟方括号中的数字。\n\
    \n```\nvar months = [\"January\", \"February\", \"March\", \"April\", \"May\"\
    , \"June\"];\ndocument.write(months[0]);\ndocument.write(months[5]);\n```\n\n\
    ![](img/f8023be36714e65595b822db3c227be4_128_0.png)\n\n**图 9.** 定义和显示数组结果的示例\n\
    \n> *注意：* JavaScript会自动为每个数组元素编号。第一个元素的索引值始终是0，第二个元素的索引值始终是1，依此类推。\n\n当我们想要更改特定数组元素的值时，我们将使用索引位置。例如，假设在我们的`months`数组中，我们想将月份名称替换为它们的缩写。我们可以使用以下语句来更改每个变量：\n\
    \n```\nmonths[0] = \"Jan\";\nmonths[1] = \"Feb\";\nmonths[2] = \"Mar\";\nmonths[3]\
    \ = \"Apr\";\nmonths[4] = \"May\";\nmonths[5] = \"Jun\";\n```\n\n## 管理数组元素\n\n\
    如果我们知道最后一个数组元素的索引值，我们只需为后续元素赋值就可以简单地添加更多元素。例如，以下语句将在索引值6下向数组中添加一个新元素。\n\n```\n\
    months[6] = \"Jul\";\n```\n\n然而，在编程中，我们几乎从不需要记住诸如最后一个索引值之类的琐事。相反，要向数组末尾添加一个或多个元素，我们可以使用`push`关键字。要将最后五个月添加到我们的`months`数组中，我们将`push`关键字与数组名组合，形成以下语句：\n\
    \n```\nmonths.push(\"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\", \"Jan\");\n```\n\
    \n嗯，看来我们多加了一个月。要删除数组的最后一个元素，我们将使用`pop`关键字。与之前一样，我们将`pop`关键字与数组名组合，形成以下语句：\n\n\
    ```\nmonths.pop();\n```\n\n此语句将删除最后一个数组元素“Jan”，留下一个包含所有月份的数组。当我们想在数组开头而非末尾添加元素时，我们可以使用`unshift`关键字。或者，当我们想从数组开头删除元素时，可以使用`shift`关键字。以下两个语句将向我们的数组添加并随后删除一个虚假的第一个月份。\n\
    \n```\nmonths.unshift(\"Sext\");\nmonths.shift();\n```\n\n如果我们想随时检查数组中包含的元素数量，我们可以调用`months`数组的`length`属性`months.length`，并使用`document.write`语句将其打印出来。为了回顾我们涵盖的所有不同方面，我们的完整代码将是：\n\
    \n```\nvar months = [\"January\", \"February\", \"March\", \"April\", \"May\"\
    , \"June\"];\nmonths[0] = \"Jan\";\nmonths[1] = \"Feb\";\nmonths[2] = \"Mar\"\
    ;\nmonths[3] = \"Apr\";\nmonths[4] = \"May\";\nmonths[5] = \"Jun\";\nmonths[6]\
    \ = \"Jul\";\nmonths.push(\"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\", \"Jan\"\
    );\nmonths.pop();\nmonths.unshift(\"Sext\");\nmonths.shift();\ndocument.write(\"\
    The number of items in the array is: \", months.length);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_131_0.png)\n\
    \n## 图 10. 操作和显示数组长度\n\n## 注释\n\n从处理HTML和CSS中，我们应该已经熟悉了注释。基本上，注释是一种告诉浏览器忽略某些代码段的方式。注释的目的是为我们或之后将阅读代码的人留下关于代码的笔记。由于JavaScript在日后修改时可能更难理解，因此注释甚至更为重要。\n\
    \nJavaScript识别两种不同的注释方法：将单行标记为注释和将多行标记为注释。无论使用哪种方法，被注释的行都不会被解释器执行。\n\n单行注释由两个正斜杠创建。当解释器找到两个正斜杠时，它将忽略直到行尾的所有内容。\n\
    \n```\n//this is a single line comment\n```\n\n也可以编写一行包含代码和注释的行。在下面的示例中，在声明变量`year`之后，该行的其余部分将被视为注释。\n\
    \n```\nvar year = 2015; //this is most likely the current year\n```\n\n当我们需要多行注释时，我们可以使用另一种方法。JavaScript中的多行注释与CSS中的多行注释相同。注释有一个由正斜杠和星号(`/*`)开始的开头，和一个由星号和正斜杠(`*/`)开始的结束。这些开始和结束注释标记之间的所有内容都将被解释器忽略。\n\
    \n```\n/*This is a comment that\nis written in exactly\nthree lines */\n```\n\n\
    # 第2章：条件与循环语句\n\n创建变量并在变量中存储值并不是真正的成就，使用简单运算符更改这个变量也不是。要开始让事情变得有趣，我们需要做的是让我们的程序对我们的操作做出反应，让它们更智能。我们可以通过使用条件语句和循环来做到这一点。\n\
    \n## 条件语句\n\n我们在日常活动中做出无数的选择：*“我应该起床吗？”*、*“我应该吃什么？”*、*“我应该去哪里喝咖啡？”*。这些选择取决于当前情况，因为我们的决策受到周围环境的影响。类似地，JavaScript也有称为条件语句的决策能力。从根本上讲，条件语句是一个简单的是或否问题，程序在答案为是时执行一件事，在答案为否时执行另一件事或什么都不做。\n\
    \n最基本的条件语句是所谓的`if`语句。此语句仅在问题的答案为真时执行任务。要理解`if`语句的语法，让我们看下面的示例：\n\n```\nvar age\
    \ = prompt(\"What is your age?\",\"\");\n\nif (age > 30) {\n    document.write\
    \ (\"You are not so young anymore.\");\n}\n```\n\n`if`语句由三部分组成。`if`关键字表示后面是一个条件语句。圆括号`()`包含是/否问题，也称为条件。最后，花括号`{}`包含如果问题答案为正则需要执行的一个或多个语句。本质上，`{`括号标记了条件满足时将运行的代码的开始，`}`括号标记了其结束。\n\
    \n在我们的示例中，条件是两个值之间的比较。使用条件`(age>30)`，我们检查`age`变量是否具有大于30的值。如果条件为真，则执行将括号内的文本写入网页的语句；否则，如果为假，解释器将跳过花括号内的所有语句。\n\
    \n## 替代条件\n\n在现实生活中，当一个条件失败时，我们总有一个替代方案。如果餐厅没有蛋糕，我们可以总是点一份水果沙拉作为甜点。类似地，在JavaScript中，我们也希望当条件为真和条件为假时发生一些事情。为此，我们可以用`else`子句扩展`if`语句。例如：\n\
    \n```\nvar age = prompt(\"What is your age?\", \"\");\nif (age < 18) {\n    document.write(\"\
    You can enter the web site.\");\n}\nelse {\n    document.write(\"You are too old\
    \ to watch cartoons.\");\n}\n```\n\n![](img/f8023be36714e65595b822db3c227be4_136_0.png)\n\
    \n**图 11.** 使用条件语句响应用户输入\n\n在上面的示例中，要求用户输入其年龄。然后，`if`语句评估`age`变量的值是否小于18。如果为真，则在页面上显示文本“You\
    \ can enter the web site”。如果此条件为假，并且用户输入了等于或大于18的值，则启动`else`子句，并显示文本“You are too\
    \ old to watch cartoons.”\n"
