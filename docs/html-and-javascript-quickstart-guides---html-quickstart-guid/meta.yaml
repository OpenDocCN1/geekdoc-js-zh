    \     <td>Expert</td>\n        </tr>\n        <tr>\n            <td>CSS</td>\n\
    \            <td>Expert</td>\n        </tr>\n        <tr>\n            <td>JavaScript</td>\n\
    \            <td>Advanced</td>\n        </tr>\n    </table>\n</section>\n<hr>\n\
