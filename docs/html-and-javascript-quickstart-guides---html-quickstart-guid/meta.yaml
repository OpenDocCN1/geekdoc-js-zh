    You are driving a \" + car.color + \" \" + car.make + \" \" + car.model);\n}\n\
    \ncar.startCar();\n```\n\n**Image 24. Defining a car object**\n\nWe can use methods\
    \ for anything that we can use functions for, and that is anything that we can\
    \ imagine. We can even use a method to change the properties of the object itself.\
    \ As an example let us create a method that will change the color of the car.\n\
    \n```\ncar.changeColor = function (othercolor) {\n    this.color = othercolor;\n\
    \    document.write(\"The car is now \" + this.color);\n}\n```\n\nWe can notice\
    \ two differences from the previous method: we are passing an argument to the\
    \ method and we are using a new keyword, `this`. The keyword `this` is used to\
    \ refer to the object itself in order to allow us to assign new property values\
    \ or even creating new properties at the same time. The complete code will be:\n\
    \n```\nvar car = new Object();\ncar.color = \"red\";\ncar.make = \"Ford\";\ncar.model\
