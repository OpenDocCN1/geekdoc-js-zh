  md: '# *The Concept of Document Structure*


    Before we dive into the intricacies of the web markup language, HTML, let’s look
    at the general concept of marking up the structure of text.


    For the purpose of explaining this concept, we will create our own tags instead
    of using a predefined HTML set, as it will be easier to follow and understand
    the underlying ideas.


    Let us consider the following text:


    The Fellowship of the Ring


    We may either identify this text as the title of a book written by JRR Tolkien
    or as the title of a movie directed by Peter Jackson. Others might not be familiar
    with this text, and therefore it is necessary to mark it properly. For starters,
    let us consider that this text refers to a book and use a label that will identify
    this text as a title.


    ```

    <title>The Fellowship of the Ring</title>

    ```


    After that, let us add information about the author so the readers know which
    author wrote this book.


    ```

    <title>The Fellowship of the Ring</title>


    <author>J.R.R. Tolkien</author>

    ```


    We can then continue to add more information about this book. For example, we
    can add the genre and the publication date as follows:


    ```

    <title>The Fellowship of the Ring</title>


    <author>J.R.R. Tolkien</author>


    <genre>Fantasy</genre>


    <published>July 29th, 1954</published>

    ```


    Let us take this one step further and encode information about more books in the
    same'
  merge: -1
