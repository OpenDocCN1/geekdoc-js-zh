    # # Chapter 1: Fundamental JavaScript Concepts


    Generally, when we hear the term programming we immediately think of other people
    typing an incomprehensible string of letters and numbers. Programming looks like
    magic beyond the realm of mere mortals. Nevertheless, the concepts in programming
    are not difficult to grasp as they always have real life applications. JavaScript,
    although it is not as simple as HTML or CSS, is not an overly complicated language.
    Unlike other languages, its “grammar” is more or less descriptive and intuitive
    making it a good fit for a first programming language. Basically, learning JavaScript
    is like learning a new language, but a new language that is similar to English.
    Once we learn the new words, and understand how to put them together to form “sentences”
    we’ll be good to go.'
  - '[PAGE 111]


    # Syntax


    Every language has its own set of characters and words that go along with a set
    of rules as to how to arrange these characters and words together into a well-formed
    sentence. These rules are also known as the language syntax and it is the syntax
    that holds the language together and gives it meaning.


    Before start with some examples of JavaScript syntax, let us first set up the
    environment for JavaScript. As discussed previously, JavaScript code is always
    a part of the HTML code. Therefore, in order to work with JavaScript we will first
    need to create a basic HTML document. So to start, let us open a text editor (like
    Notepad) and type in the HTML code for the most basic web page. In addition to
    the basic HTML tags, we will include a <script> element in the <head> section
    where we will start placing the JavaScript code.


    ```

    <!doctype html>

    <head>

    <title>First Steps in JavaScript</title>

    <script type="text/javascript">

    </script>

    </head>

    <body>

    </body>

    </html>

    ```


    Let us save this document as firststeps.html. If we are using Notepad, we have
    to remember to change the Save as Type field to ‘All files’.'
- md: "## **Statements**\n\nTo express ourselves in everyday common language we use\
    \ sentences as the basic form of communication. Similarly, in JavaScript we also\
    \ form sentences to express our intentions which are more formally called statements.\
    \ A JavaScript sentence is the basic unit of communication, usually representing\
    \ a single step in the program. And just like we put sentences together to express\
    \ an opinion, we combine statements together to create a program.\n\nLet us look\
    \ at a simple JavaScript statement and see what it does. Between the opening and\
    \ closing `<script>` tag of the html document place the following text:\n\n```javascript\n\
    alert(\"JavaScript is starting to make a little sense.\");\n```\n\nIn further\
    \ examples we will not show the complete HTML code unless it is necessary, but\
    \ for initial reference your document should look like the following:\n\n```html\n\
    <!doctype html>\n<head>\n<title>First Steps in JavaScript</title>\n<script type=\"\
    text/javascript\">\n    alert(\"JavaScript is starting to make a little sense.\"\
    );\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\nWe can save the firststeps.html\
    \ document and open it in a web browser. Once the page opens, we will get an alert\
    \ window with the message “*JavaScript is starting to make a little sense*”.\n\
    \nNow that we know what the effect is, let us go back to the JavaScript statement\
    \ and interpret it into common language so it makes more sense.\n\n```javascript\n\
    alert(\"JavaScript is starting to make a little sense.\");\n```\n\nJavaScript\
    \ statements are instructions which are executed by the web browser. The statement\
    \ starts with a command, presented by keyword. The keyword identifies the action\
    \ that needs to be performed. In this case the keyword `alert` makes the web browser\
    \ open a dialog box and display a message. If we just had the statement `alert();`\
    \ the dialog box would have been empty, however in our case the statement consists\
    \ of a specific input, the actual message text, also known as an argument. Finally,\
    \ just like every sentence ends with a period, a JavaScript sentence ends with\
    \ a semicolon. The semicolon makes it clear that the statement is over and once\
    \ the interpreter executes it, it should move on to the next item.\n\nNow we are\
    \ ready to translate the JavaScript statement. Its plain English interpretation\
    \ would be, \"Open a dialog box and display the text *JavaScript is starting to\
    \ make a little sense* in that box.\"\n\n> **Note:** When passing text arguments\
    \ we can use either double quote marks (\"sense\") or single quote marks ('sense')\
    \ present the text.\n\nBefore we move on, let us look at another JavaScript statement.\
    \ In the `<script>` element replace the previous code with the following and preview\
    \ it in a web browser to see the results:\n\n```javascript\ndocument.write(\"\
    <p>JavaScript is starting to make a little sense.</p>\");\n```\n\n**Image 2.**\
    \ Example of a document.write statement\n\nWhat we can see from the results is\
    \ that the previously empty document, now has one paragraph of text. Following\
    \ the previous interpretation of how JavaScript works and from the web browser\
    \ results we can correctly assume that the `document.write` keyword commands the\
    \ browser to write directly onto the web page. Similar to `alert()`, it writes\
    \ whatever is placed between the opening and closing brackets.\n\n## **Variables**\n\
    \nOne of the fundamental aspect of JavaScript, and any programming language in\
    \ general, is the concept of variables. A variable is a way to declare and store\
    \ information which can later be used. This information can vary with the circumstances\
    \ and hence the name variable.\n\nLet us look at the following statement.\n\n\
    ```javascript\nvar name = \"Martin\";\n```\n\nIn plain language this is the same\
    \ as saying “My name is Martin”. The keyword `var` is JavaScript speak for “create\
    \ a variable”, or in a programming dialect, “declare a variable”. What follows\
    \ is the name of the variable which can be anything we choose with certain limits.\
    \ Assigning a value to the variable is done with the `=` sign, which is not immediately\
    \ necessary, as this can happen later. We can declare an undefined variable in\
    \ one statement, and assign it a value in a later statement.\n\nFor example:\n\
    \n```javascript\nvar name;\nname = \"Martin\";\n```\n\nAs mentioned previously,\
    \ variable names can be anything, like `name`, `abc`, `R2D2`, with a few rules.\
    \ Variable names can contain letters, numbers, dollar sign (`$`), or lower line\
    \ (`_`), other special characters are not allowed. Furthermore, a variable name\
    \ cannot begin with a number, any other allowed value is acceptable. Finally,\
    \ variable names are case-sensitive, meaning that the interpreter in the web browser\
    \ makes a distinction between uppercase and lowercase letters, making ‘score’\
    \ different from ‘Score’.\n\n> **Note:** Although we can use almost anything for\
    \ a variable name, it is wise to use names which are meaningful as this will help\
    \ us and other programmers to better understand the written code.\n\n## **Variable\
    \ Types**\n\nBased on the type of data, variables come in different flavors. The\
    \ three most basic types are number, string, and boolean.\n\nA **number** variable\
    \ is represented by a numeric character. This variable can accept whole integers,\
    \ negative integers and fractional integers. Numbers are frequently used in calculations,\
    \ hence our number variables are often included in mathematical operations. The\
    \ following statement declares a variable named `age` and assigns it a value of\
    \ 35.\n\n```javascript\nvar age = 35;\n```\n\nA **string** variable is used to\
    \ represent any series of letters like words or sentences. Strings are represented\
    \ as a series of characters enclosed within quotation marks, with the quotation\
    \ marks signaling to the interpreter that what follows is a string variable. JavaScript\
    \ allows us to use both the double quotes (`\"`) or the single quote (`'`) marks,\
    \ but we have to be mindful to use the same type of quotation mark.\n\n```javascript\n\
    var location = \"California\";\n```\n\nA **boolean** variable is rather simple\
    \ as it can accept only one of two values: `true` or `false`. This variable is\
    \ used when we create JavaScript programs that we want to intelligently react\
    \ to user actions. We will address them in the next chapter when we start discussing\
    \ more complex programs.\n\n## **User Variables**\n\nJavaScript would not be fun\
    \ if it didn’t allow us to share our thoughts and create or alter the variables\
    \ directly. One of the simplest ways to “give” our input is to use the `prompt()`\
    \ command.\n\n```javascript\nvar name = prompt (“What is your name?”, “”)\ndocument.write(name);\n\
    ```\n\nThe result of the `prompt()` command is a dialog box. Instead of just displaying\
    \ a message like the `alert` dialog box, the `prompt` dialog box can also receive\
    \ an answer. Hence, in the syntax for a `prompt` dialog box it is necessary to\
    \ provide two arguments between the parentheses separated with a comma. The first\
    \ argument is the prompt text that is displayed in the box, while the second argument\
    \ is the default value for the text box, and consequently, the variable.\n\nIn\
    \ the example above, the prompt text displayed in the box will be ‘*What is your\
    \ name?*’ and the default value presented in the box will be empty, as there is\
    \ obviously no content between the quotation marks. Once we type in something\
    \ in the box and either click OK or press the Enter key, the variable receives\
    \ the value that was entered in the field. Consequently, the name will be displayed\
    \ on the web page. Otherwise, if we click on Cancel, press the Esc key or close\
    \ the prompt box, the returned value would be empty and there would be no text\
    \ on the screen.\n\n> **Note:** Instead of `prompt()` we can also use the more\
    \ formal `window.prompt` command.\n\n## **Operators**\n\nStoring information in\
    \ a variable is a first step, the beauty of programming is the ability to manipulate\
    \ this information in many creative ways. For this, JavaScript provides different\
    \ operators that allow us to modify data. An operator, represented by a symbol\
    \ or a word, is something that can change one or more values into something else.\
    \ The type of operators available are different based on the data type."
  mdcn: "\n## **语句**\n\n在日常交流中，我们使用句子作为基本的表达形式。同样，在 JavaScript 中，我们也通过形成句子来表达意图，这些句子更正式地被称为语句。JavaScript\
    \ 语句是通信的基本单元，通常代表程序中的一个步骤。就像我们将句子组合起来表达一个观点一样，我们将语句组合起来创建一个程序。\n\n让我们看一个简单的 JavaScript\
    \ 语句，看看它的作用。在 HTML 文档的 `<script>` 标签的开始和结束之间放置以下文本：\n\n```javascript\nalert(\"\
    JavaScript is starting to make a little sense.\");\n```\n\n在后续示例中，除非必要，我们将不再展示完整的\
    \ HTML 代码，但作为初始参考，你的文档应该如下所示：\n\n```html\n<!doctype html>\n<head>\n<title>First\
    \ Steps in JavaScript</title>\n<script type=\"text/javascript\">\n    alert(\"\
    JavaScript is starting to make a little sense.\");\n</script>\n</head>\n<body>\n\
    \n</body>\n</html>\n```\n\n我们可以保存 firststeps.html 文档并在 Web 浏览器中打开它。页面打开后，我们将收到一个警报窗口，其中显示消息\
    \ \"*JavaScript is starting to make a little sense*\"。\n\n现在我们知道它的效果了，让我们回到 JavaScript\
    \ 语句，用通俗语言解释它，以便更好地理解。\n\n```javascript\nalert(\"JavaScript is starting to make\
    \ a little sense.\");\n```\n\nJavaScript 语句是由 Web 浏览器执行的指令。语句以命令开始，由关键字表示。该关键字标识需要执行的操作。在这种情况下，关键字\
    \ `alert` 使 Web 浏览器打开一个对话框并显示消息。如果我们只有语句 `alert();`，对话框将是空的，但在我们的例子中，该语句包含一个特定的输入，即实际的消息文本，也称为参数。最后，就像每个句子以句号结束一样，JavaScript\
    \ 语句以分号结束。分号明确表示语句结束，一旦解释器执行完该语句，它就应该继续处理下一项。\n\n现在我们准备翻译这个 JavaScript 语句。其英文的简单解释是：\"\
    打开一个对话框并在该框中显示文本 *JavaScript is starting to make a little sense*。\"\n\n> **注意：**\
    \ 传递文本参数时，我们可以使用双引号 (\"sense\") 或单引号 ('sense') 来表示文本。\n\n在继续之前，让我们看另一个 JavaScript\
    \ 语句。在 `<script>` 元素中，用以下代码替换之前的代码，并在 Web 浏览器中预览结果：\n\n```javascript\ndocument.write(\"\
    <p>JavaScript is starting to make a little sense.</p>\");\n```\n\n**图 2.** document.write\
    \ 语句示例\n\n从结果中我们可以看到，先前为空的文档现在有了一段文本。根据之前对 JavaScript 工作方式的解释以及 Web 浏览器的结果，我们可以正确地推断出，`document.write`\
    \ 关键字命令浏览器直接写入网页。类似于 `alert()`，它会写入放在开括号和闭括号之间的任何内容。\n\n## **变量**\n\nJavaScript\
    \ 以及任何编程语言的一个基本方面是变量的概念。变量是一种声明和存储信息的方式，这些信息可以稍后使用。这些信息可以随情况变化，因此得名变量。\n\n让我们看下面的语句。\n\
    \n```javascript\nvar name = \"Martin\";\n```\n\n用通俗的语言来说，这就像说 \"My name is Martin\"\
    （我的名字叫 Martin）。关键字 `var` 是 JavaScript 中用于 \"创建变量\" 的说法，或者用编程术语来说，\"声明变量\"。接下来是变量名，我们可以选择任何符合某些限制的名称。使用\
    \ `=` 符号为变量赋值，这并不一定需要立即完成，可以稍后进行。我们可以在一个语句中声明一个未定义的变量，然后在后面的语句中为其赋值。\n\n例如：\n\n\
    ```javascript\nvar name;\nname = \"Martin\";\n```\n\n如前所述，变量名可以是任何名称，例如 `name`、`abc`、`R2D2`，但有一些规则。变量名可以包含字母、数字、美元符号\
    \ (`$`) 或下划线 (`_`)，不允许使用其他特殊字符。此外，变量名不能以数字开头，任何其他允许的值都是可以接受的。最后，变量名区分大小写，这意味着\
    \ Web 浏览器中的解释器区分大写字母和小写字母，使得 'score' 与 'Score' 不同。\n\n> **注意：** 虽然我们几乎可以使用任何内容作为变量名，但明智的做法是使用有意义的名称，因为这将帮助我们和其他程序员更好地理解编写的代码。\n\
    \n## **变量类型**\n\n根据数据类型，变量有不同的种类。三个最基本的类型是数字、字符串和布尔值。\n\n**数字** 变量由数字字符表示。该变量可以接受整数、负整数和小数。数字经常用于计算，因此我们的数字变量经常出现在数学运算中。以下语句声明了一个名为\
    \ `age` 的变量并为其赋值 35。\n\n```javascript\nvar age = 35;\n```\n\n**字符串** 变量用于表示任何一系列字母，如单词或句子。字符串表示为引号内的一系列字符，引号向解释器表明后面的内容是一个字符串变量。JavaScript\
    \ 允许我们使用双引号 (`\"`) 或单引号 (`'`)，但我们必须注意使用相同类型的引号。\n\n```javascript\nvar location\
    \ = \"California\";\n```\n\n**布尔** 变量相当简单，因为它只能接受两个值之一：`true` 或 `false`。当我们创建希望对用户操作做出智能反应的\
    \ JavaScript 程序时，就会使用此变量。我们将在下一章开始讨论更复杂的程序时处理它们。\n\n## **用户变量**\n\n如果 JavaScript\
    \ 不允许我们分享想法并直接创建或修改变量，它就不会那么有趣。\"给出\" 我们输入的最简单方法之一是使用 `prompt()` 命令。\n\n```javascript\n\
    var name = prompt (“What is your name?”, “”)\ndocument.write(name);\n```\n\n`prompt()`\
    \ 命令的结果是一个对话框。与仅显示消息的 `alert` 对话框不同，`prompt` 对话框还可以接收答案。因此，在 `prompt` 对话框的语法中，有必要在括号内提供两个参数，用逗号分隔。第一个参数是显示在框中的提示文本，第二个参数是文本框的默认值，因此也是变量的默认值。\n\
    \n在上面的示例中，框中显示的提示文本将是 '*What is your name?*'，框中显示的默认值将是空的，因为引号之间显然没有内容。一旦我们在框中输入内容并单击确定或按\
    \ Enter 键，变量将接收在字段中输入的值。因此，名称将显示在网页上。否则，如果我们单击取消、按 Esc 键或关闭提示框，则返回的值将为空，屏幕上将没有文本。\n\
    \n> **注意：** 除了 `prompt()`，我们也可以使用更正式的 `window.prompt` 命令。\n\n## **运算符**\n\n将信息存储在变量中只是第一步，编程的魅力在于能够以多种创造性方式操作这些信息。为此，JavaScript\
    \ 提供了不同的运算符，允许我们修改数据。运算符由符号或单词表示，可以将一个或多个值转换为其他内容。可用运算符的类型根据数据类型的不同而不同。\n"
