  md: '# Managing Array Elements


    If we know the index value of the last array item, we can simply add more items
    by assigning values to subsequent items. For example, the following statement
    will add one more item in the array under the index value of 6.


    ```

    months[6] = “Jul”;

    ```


    However, while programming we are almost never required to actually remember such
    trivialities such as the last index value. Instead, to add one or more elements
    to the end of an array we can use the keyword push . To add the final five months
    to our months array, we will combine the push keyword with the array name to form
    the following statement:


    ```

    months.push(“Aug”, “Sep”, “Oct”, “Nov”, “Dec”, “Jan”);

    ```


    Well, it seems that we went over and added an extra month. To remove the last
    element of an array we will use the pop keyword. Like previously, we will combine
    the pop keyword with the array name to form the following statement:


    ```

    months.pop();

    ```


    This statement will delete the last array element, “Jan” , leaving us with an
    array containing all the months of the year.

    When we want to add an element to the beginning of an array instead of the end,
    we can use the unshift keyword. Alternatively, when we want to remove an element
    from the beginning of an array we can use the shift keyword. The following two
    statements will add and subsequently remove a bogus first month to our array.


    ```

    months.unshift(“Sext”);

    months.shift();

    ```


    If at any time we want to check the number of elements that are contained within
    an array, we can initiate the length property for the months array, months.length
    , and print it with the document.write statement.

    To review all the different aspects we have covered our complete code will be:


    ```

    var months = [“January”, “February”, “March”, “April”, “May”, “June”];

    ```'
