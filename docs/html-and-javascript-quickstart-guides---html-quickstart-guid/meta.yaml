  md: "# **Local and Global Variables**\n\nBy now we are aware that functions provide\
    \ us with a great advantage by decreasing the amount of code we have to write.\
    \ However, before we continue we need to clarify one more aspect which is the\
    \ behavior of variables inside of a function and outside of the function. There\
    \ is a difference as to how these variables are treated which is very relevant\
    \ for our coding practices.\n\nFor the JavaScript interpreter, the variables declared\
    \ inside of a function are treated differently than variables declared outside\
    \ of a function. The so-called ‘scope’ of the variables is different in each situation.\
    \ The variables that exist inside a function are not visible to the rest of the\
    \ script, they are valid only for the function itself. This means that function\
    \ variables have a local scope. On the other hand, variables which are declared\
    \ in the main part of the JavaScript code are meaningful to all parts of the script.\
    \ This means that all existing functions in a script can access the variables\
    \ which are created in its main body. These variables have a global scope.\n\n\
    To clarify the difference let us look at a few examples where we will calculate\
    \ the number of drinks we have during a fun night out.\n\n```\nvar drinks = 0;\n\
    \nfunction nightOut() {\n    drinks = 5;\n    document.write(“Drinks in the function\
    \ “, +drinks);\n}\n\ndocument.write(“Drinks on the outside “, +drinks);\n```"
  merge: -1
