  md: "# Validating a Website for HTML5 Compliance\n\nTo verify how well a website\
    \ supports HTML5, we can use an HTML5 validator tool. There are many online tools\
    \ available, but the one that conforms to the most recent HTML5 specifications\
    \ is the W3C Markup Validation Service available at http://validator.w3.org. The\
    \ W3C Markup Validation Service enables us to verify a website against non-English\
    \ character-encoding types and even older markup languages, such as HTML versions\
    \ 4.01, 3.2, and 2.0, various XHTML standards, MathML, Scalable Vector Graphics\
    \ (SVG), and Synchronized Multimedia Integration Language (SMIL).\n\nTo use the\
    \ W3C Markup Validation Service, the web page to be tested has to be published\
    \ online. To use this tool, we submit the URL address of the web page, and the\
    \ tool downloads the HTML source code for the site, auto-detects the encoding\
    \ and document type, and analyzes the page for compliance. The registered infractions\
    \ are categorized like errors and warnings and are rated by severity. The tool\
    \ even offers explanations and possible solutions to the noted problems.\n\nEven\
    \ if an HTML5 web page fails validation, it may still render correctly in a web\
    \ browser. This is because the HTML5 specifications state that web developers\
    \ must avoid deprecated tags, but web browsers may honor them. This is a critical\
    \ requirement of maintaining backward compatibility with earlier HTML versions\
    \ and web pages that have not been updated to the latest standard.\n\nWith all\
    \ of the interventions thus far, our sample CV should now have the following HTML\
    \ structure:\n\n```\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n    <meta charset=\"\
    utf-8\">\n\n    <title>Curriculum Vitae</title>\n\n    <!--[if lt IE 9]>\n\n \
    \   <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n\
    \n    <![endif]-->\n\n</head>\n\n<body>\n\n<article>\n```"
