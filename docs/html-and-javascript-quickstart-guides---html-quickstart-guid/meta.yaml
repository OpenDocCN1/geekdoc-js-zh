    \ to happen when the condition is true and when the condition is false. To achieve\
    \ this we can extend the if statement with an else clause. For example:\n\n```\n\
    var age = prompt(\"What is your age?\", \"\");\nif (age < 18) {\n    document.write(\"\
    You can enter the web site.\");\n}\nelse {\n    document.write(\"You are too old\
    \ to watch cartoons.\");\n}\n```\n\n![](img/f8023be36714e65595b822db3c227be4_136_0.png)\n\
    \n**Image 11.** Using a conditional statement to respond to users' input\n\nIn\
    \ the example above the user is asked to enter his/her age. Then the if statement\
    \ evaluates whether the value of the age variable is less than 18. If this is\
    \ true , the text \"You can enter the web site\" is displayed on the page. If\
    \ this condition is false , and the user has entered a value that is equal to\
    \ or greater than 18, than the else clause is initiated and the text \"You"
- md: "are too old to watch cartoons” is displayed on the web page.\n\nTo initiate\
    \ an else clause we simply add it as a keyword after the closing brace of the\
    \ conditional statement. The statement(s) that we want to execute are also placed\
    \ in braces {} , as we have the option to add as many lines of code as necessary.\n\
    \nMore than often there are more than two possible outcomes to a situation. When\
    \ this is the case, JavaScript lets us use cascading else if statements to offer\
    \ solutions to multiple alternatives. We start with an if statement for the first\
    \ option, and then add one or more else if statements to trigger additional options.\
    \ Like previously the else clause is used in the end as the last alternative.\n\
    \n```\nvar money = prompt(\"How much money do you have in your pocket?\", \"\"\
    );\n\nif (money < 20) {\n    document.write(\"That is not enough. Go to the ATM\
    \ to get some more.\");\n}\n\nelse if (money == 20) {\n    document.write(\"Exactly\
    \ 20? That's great, buy me a nice burger meal.\");\n}\n\nelse {\n    document.write(\"\
    You shouldn't carry so much money around. Give some to me.\");\n}\n```\n\n![](img/f8023be36714e65595b822db3c227be4_138_0.png)\n\
    \n**Image 12.** Using alternative conditional statements\n\nIn the example above,\
    \ the user is asked to enter the amount of money he/she possesses. Afterwards,\
    \ the JavaScript program assesses the answer and replies with one of three available\
    \ responses based on the entered amount.\n\n## Multiple Conditions\n\nNow that\
    \ we have covered all alternative, let us see what happens when there is more\
    \ than one variable. When we are dealing with different variables we will need\
    \ to form more complex conditional statements. For example, if we are having a\
    \ private bachelorette party we must make sure that we don’t let people in unless\
    \ they are female and over 18. Using the logical operators from the previous chapter\
    \ and the if/else conditional statements we can build more intricate comparisons.\n\
    \n```\nvar gender = prompt(\"What is your gender?\",\"\");\nvar age = prompt(\"\
    How old are you?\",\"\");\nif ((gender == \"female\") && (age >= 18)) {\n    document.write(\"\
    Please enter. Hope you brought a nice gift.\");\n}\nelse if (gender == \"male\"\
    ) {\n    document.write(\"This is a bachelorette party. No guys allowed.\");\n\
    }\nelse {\n    document.write(\"You are probably too young to enter. Come back\
    \ in a few years.\");\n}\n```\n\n![](img/f8023be36714e65595b822db3c227be4_139_0.png)\n\
    \n### **Image 13.** Checking for multiple conditions\n\nIn the example above we\
    \ are making decisions based on two factors, gender and age. The only positive\
    \ decision is available when two conditions are true, the person is a female over\
    \ 18 years of age. In JavaScript, we combine conditions using logical operators,\
    \ which in this case is the AND operator represented by double ampersands ( &&\
    \ ). When using this operator between two conditions within a single conditional\
    \ statement we summarize the outcome into only one condition.\n\n## Loop Statements\n\
    \nDuring our daily activities to complete a task we have to repeat the same series\
    \ of steps over and over again. To wash the dishes, we have to wash each dish\
    \ separately. To climb down the stairs we have to step down one stair at a time.\
    \ At the checkout counter, we have to take each item out of the cart, scan it\
    \ and put it back in a bag. Well, in programming repetitive tasks are very easy\
    \ to do. As a matter of fact, JavaScript is very good at performing repetitive\
    \ tasks as it has all the necessary tools to do the same thing over and over again.\
    \ In programming lingo, repeatedly performing the same task is called a loop.\n\
    \nThere are several different types of loops. They essentially do the same thing,\
    \ but the approach is slightly different. In this section we will familiarize\
    \ ourselves with while loops and for loops.\n\n### While Loops\n\nIn a while loop,\
    \ the same code is repeated as long as a certain condition is true. Let us dive\
    \ into an example that checks our age as we grow every year.\n\n```\nvar age =\
    \ 1;\nwhile (age < 18) {\n    document.write(\"Another year has passed. You are\
    \ now \"+age+\" years old.<br>\");\n    age = age + 1;\n}\ndocument.write(age+\"\
    ? Congratulations! You are now an adult.\");\n```\n\nIn this example, after declaring\
    \ the age variable, we introduce a while statement. Following the while keyword\
    \ we place a condition between parentheses, which in our case is age<18 . If the\
    \ condition is true, the JavaScript interpreter will run the code that appears\
    \ between the braces. Unlike a conditional statement, when the closing brace of\
    \ the while statement is reached, JavaScript does not continue with the rest of\
    \ the program, but instead it initiates the while statement again. As long as\
    \ the number stored in the age variable is less than 18, the script will run the\
    \ document.write() command.\n\nOnly when the condition is false, the interpreter\
    \ will ‘exit’ the loop and continue parsing the rest of the code. This makes the\
    \ last line of the while loop very important. It not only changes the value of\
    \ the condition variable, but it also makes it possible for the test condition\
    \ to eventually be false. Without this possibility, we will ‘lock’ the interpreter\
    \ into performing the same task over and over again... forever. This is known\
    \ as an infinite loop, which is essentially a loop that never completes. An infinite\
    \ loop will run either until it crashes the computer or it receives a timeout\
    \ from a modern interpreter after a certain period of time.\n\n### For Loops\n\
    \nIn JavaScript there is a second option for creating a loop statement which is\
    \ more compact and slightly more confusing. For loops can achieve the same thing\
    \ as a while loop with fewer lines of code, but a code that is a bit unintuitive\
    \ for the novice programmer. In a for loop, the variable declaration, the condition\
    \ and the changing value of the variable is all done at the same time. As an example\
    \ let us write the previous age-growing while loop with a for loop syntax.\n\n\
    ```\nfor (var age = 1; age < 18; age++) {\n    document.write(\"Another year has\
    \ passed. You are now \"+age+\" years old.<br>\");\n}\n\ndocument.write(age+\"\
    ? Congratulations! You are now an adult.\");\n```\n\n![](img/f8023be36714e65595b822db3c227be4_143_0.png)\n\
    \nAs evident from the image, the resulting content is exactly the same in both\
    \ cases. Each loop begins with the for keyword. This is the followed by a set\
    \ of parentheses that contains three parts.\n\n1) The first part, which is applied\
    \ only once at the beginning of the statement, declares the condition variable,\
    \ age , and sets its initial value to 1. The initial value is used as a starting\
    \ point for the number of times the loop will repeat and can be any number. If\
    \ this variable had been initialized earlier in the script, the var keyword would\
    \ have been unnecessary.\n\n2) The second part is the condition itself, which\
    \ is evaluated every time before the loop is executed. As long as the condition\
    \ is true, the for statement will keep repeating the code. When the condition\
    \ is false, the loop will be instructed to stop running which in our example is\
    \ when the age variable becomes greater than or equal to 18.\n\n3) Finally, the\
    \ third part determines the rate at which the condition variable is changed. In\
    \ our example the condition variable increases by one after each cycle, but this\
    \ is not mandatory. The condition variable can get larger or smaller and can increase/decrease\
    \ by any amount we set.\n\nTo finish the structure of the for loop we have curly\
    \ brackets that enclose the code that we want to use within the loop, which in\
    \ our example is to write a line of text on the web page with document.write()\
    \ .\n\n## Loops and Arrays\n\nLoop statement are very useful when we want do handle\
    \ array variables. In JavaScript, we can use loops to cycle through array items,\
    \ and when necessary, perform an action on each item.\n\nEarlier in this book\
    \ we created an array, called months , that contained the twelve months of the\
    \ year.\n\n```\nvar months = [\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"\
    Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"];\n```\n\nUsing either\
    \ a while or a for loop we will go through each item in the array and print it\
    \ to the page. We will access the array items by using their index and we will\
    \ subsequently increase the index value in each loop cycle. If we use a while\
    \ statement we will have the following code:\n\n```\nvar counter = 0;\nwhile (counter\
    \ < months.length) {\n    document.write(months[counter] + \" \");\n    counter++;\n\
    }\n```\n\nWe initiate a counter variable that has the same starting value as the\
    \ index of the first array item, which is 0. Following, we begin a while loop\
    \ that runs until the counter value is less than the length of the array. The\
    \ condition, counter < months.length inquires whether the current value of the\
    \ counter variable is lower than the number of array items by comparing it to\
    \ the array’s length property. Each time the while loop runs we print the value\
    \ of a single array item and we subsequently increase the value of the counter\
    \ variable by 1.\n\nIf we want to perform the same action with a for loop we can\
    \ use the following code:\n\n```\nvar months = [\"Jan\", \"Feb\", \"Mar\", \"\
    Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"\
    ];\nfor (var counter = 0; counter < months.length; counter++) {\n    document.write(months[counter]\
    \ + \" \");\n}\n```"
