  md: "# Sending Information to Functions\n\nWe can send one or more values to the\
    \ function, thus increasing its versatility. When we send these values, the function\
    \ is capable of processing this information before it comes back with an answer.\
    \ The values we send are also known as arguments, while the process of sending\
    \ information to a function is called ‘passing an argument’. Once the argument\
    \ is received the function will use this data while carrying out the sequence\
    \ of actions as specified in the code.\n\nThe basic syntax would look like the\
    \ following:\n\n```\nfunction functionName(argument) {\n    //JavaScript code\n\
    }\n```\n\nArguments are set on the first line of the function inside the set of\
    \ parentheses, which we previously left blank. The values brought in as arguments\
    \ automatically become declared variables within the function. These variables\
    \ use the names given inside the parentheses and do not need to be further declared\
    \ with the var keyword.\n\nAs the most basic example, let us create a function\
    \ that will shorten the syntax of the document.write() command.\n\n```\nfunction\
    \ print(message) {\n    document.write(message);\n}\nprint(“<p>What are you doing?\
    \ document.write is a perfect command.</p>”);\nprint(“<p>42 is the answer, but\
    \ what is the question?</p>”);\n```"
  merge: -1
  pgno: 153
- img_proc: true
  md: "![](img/f8023be36714e65595b822db3c227be4_154_0.png)\n\n**Image 18.** Substituting\
    \ the document.write command with an argument function\n\nThis function, named\
    \ print() , can accept one argument. When the function is called, this argument\
    \ is passed on to the function and is stored as a variable named message . When\
    \ the document.write() command is initiated within the function it writes the\
    \ contents of the message variable on the page.\n\nAs mentioned previously, functions\
    \ are not limited to processing single arguments. We can pass as many arguments\
    \ to the function as needed as long as each argument is specified in the function\
    \ and the function is called with the same number of arguments in the same order.\n\
    \nAs an example let’s revisit the checkAge() function and try to make it more\
    \ versatile. We will provide the variables name and years to the function and\
    \ have it respond with a personalized message.\n\n```\nfunction checkAge(name,\
    \ years) {\n    if (years < 18) {\n        document.write(name+\" you are too\
    \ young to enter.<br>\");\n    }\n    else {\n        document.write(name+\" you\
    \ are above 18. Please come in.<br>\");\n    }\n}\n```"
