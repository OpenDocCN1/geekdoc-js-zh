  md: "# Selecting Group Elements\n\nWhile sometimes selecting an individual element\
    \ will be sufficient, other times we may need to select a group of elements. For\
    \ example, we might need to select all `<li>` tags on a page, or all elements\
    \ that share a class attribute. In these cases JavaScript offers the following\
    \ two methods:\n\n+   - **getElementsByTagName()** – a method which will let us\
    \ select every instance of a particular tag.\n- **getElementsByClassName( )**\
    \ – a method that retrieves all elements that share a particular class name.\n\
    \nSelecting a group of elements means that the method will return more than one\
    \ node. This collection of nodes is known as a NodeList and will be stored in\
    \ an array-like item. Each node will be given an index number, starting with 0,\
    \ while the order of the nodes will be the same order in which they appear on\
    \ the page. Although NodeLists look like arrays and behave like arrays, semantically\
    \ they are a type of object called a collection. As an object, a collection has\
    \ its own properties and methods which are rather useful when dealing with a NodeList.\n\
    \nThe following example will select all `<li>` elements and assign their node\
    \ references to the schedule variable.\n\n```\nvar schedule = document.getElementsByTagName(“li”);\n\
    ```\n\nIf we want to access each element separately, we can use an array syntax.\
    \ For example:\n\n```\nvar item1 = schedule[0];\nvar item2 = schedule[1];\nvar\
    \ item3 = schedule[2];\n```\n\nHowever, when we select a group of items we usually\
    \ want to interact with the whole group. As an example, let us assign the class\
    \ attribute with the “finished” value to all `<li>` elements. For this purpose\
    \ we can use a loop to go through each element in the NodeList.\n\n```\nvar schedule\
    \ = document.getElementsByTagName(“li”);\nfor (var i = 0; i < schedule.length;\
    \ i++) {\n    schedule[i].className = “finished”;\n}\n```"
  merge: -1
  pgno: 176
- img_proc: true
  md: '![](img/f8023be36714e65595b822db3c227be4_177_0.png)


    **Image 29. Changing the class attribute for all <li> elements**


    Similarly to working with arrays, when working with collections we can use the
    length property to determine the size of the collection. We can then use this
    information in a for loop in order to effectively go through every NodeList item
    and assign the “finished” class attribute.


    We can use exactly the same logic for the `getElementsByClassName()` method. We
    will get a NodeList stored in a collection with each node having an index number.
    Like with the `getElementByTagName()` method, we can access individual items and
    manage the collection through its object properties and methods.'
