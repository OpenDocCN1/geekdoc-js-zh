    and image file size. Image dimensions determine how much screen real estate an
    image occupies in pixels. The image file size will determine the time it will
    take for that image to be transferred over the Internet from a web server to a
    browser client. While parsing the code, when a browser reaches the img tag, it
    must first load the image to see how big it is and how much space it will consume
    on the screen. If we specify the image’s dimensions, the browser can reserve some
    screen space and load the rest of the page content as the image loads.


    The <img> element lets us specify the image dimensions through its optional height
    and width attributes. If we want to use the original dimensions of the image,
    we need to take the following steps:


    +   1) In Windows Explorer right-click the image.


    2) Choose Properties from the contextual pop-up menu. A box will appear showing
    the dimensions of our image in pixels.


    Once we figure out the size of our image, we can use the width and height attributes
    to specify the width and height of our image in pixels. The width and height attributes
    don’t necessarily have to reflect the actual size of the image, as we can insert
    any value we want.


    ```

    <img src=“images\cv_picture.jpg” alt=“Scott Johnson profile picture” width=“100”
    height =“150”>

    ```


    In the above example, we tell the browser to reserve 100x150 pixels of screen
    estate in which to load the cv_picture.jpg image from the images folder.


    > Note: Some HTML editors, like Dreamweaver and Expression Web, will automatically
    add the height and width attributes when you insert an image.'
  - '[PAGE 67]


    # Web Images


    Web browsers are not capable of displaying every image type. As a matter of fact,
    they are limited only to formats that offer very high compression rates in order
    to provide smaller image sizes. This limits our options to only three formats:
    JPEG, GIF and PNG, and partially SVG.


    **JPEG** is suitable for photos that can tolerate some loss of quality. The JPEG
    format compresses an image’s file size so that it downloads faster. It doesn’t
    work well if the picture contains text or line art.


    **GIF** is suitable for graphics with very few colors like simple logos or clip
    art. It is limited to 256 colors and therefore gives horrible results when used
    for compressing photographic images.


    **PNG** is a format created specifically for the web and is suitable for all kinds
    of images. It doesn’t always compress as well as JPEG, but it is particularly
    good for small, sharp graphics, and it is used as a more powerful replacement
    for the GIF standard.


    **SVG** is an up-and-coming standard for vector drawings with a number of advantages,
    including small size and flexibility, as you can resize SVG images without losing
    detail or producing blurry images. It is not supported by Internet Explorer versions
    8 and earlier, so it is not yet a viable choice for web graphics.'
  - '[PAGE 68]


    # Links


    Creating a single web page is an important step in building a website, but we
    need more than one page to complete the website, and these pages will need to
    be connected so a visitor can easily jump from one page to another via links.
    Furthermore, we also want to create connections to web pages on other websites.


    All links, officially called hyperlinks, are managed through the so-called anchor
    element, <a>.


    ```

    <a>Link to page</a>

    ```


    The <a> element has no function by itself. To be a fully functioning link, it
    must have a destination to specify what happens when the visitor clicks the link.
    The most common links load a new page, but they can also show an image, play a
    sound or movie, download files, open a newsgroup, send an e-mail message, run
    a CGI program, and more. To define a destination, we extend the <a> element with
    the href attribute, which is shorthand for “hypertext reference,” and define a
    URL. By default the browser displays text links as blue underlined text.


    ```

    <a href="page.html">Link to page</a>

    ```


    ![](img/f8023be36714e65595b822db3c227be4_68_0.png)'
  - '[PAGE 69]


    The text between the opening and closing tags of the <a> element is also known
    as a label, the part the visitor sees and clicks to reach the destination. This
    text in itself is very important since search engines index it in a special way
    and pay special attention to the actual content of the link. Hence it is advisable
    to use descriptive text (ex. Products, Register, About) instead of vague words
    such as “click here,” “more,” or “this link.”


    Two additional attributes that extend the functionality of the <a> element can
    be very helpful when it comes to links:


    +   - **Target** - The target attribute specifies where we want to open the linked
    document. The most common value we use for the target attribute is _blank, when
    we want the link to open in a new tab/browser window, instead of the current window
    (ex. <a href=“sample_cv.html” target=“_blank”).


    +   - **Download** - The download attribute specifies that the target will be
    downloaded when a user clicks on the hyperlink instead of displayed in the web
    browser window (ex. <a href=“thesis_document.pdf” download>Get the Thesis Document</a>).'
  - '[PAGE 70]


    # Link Types


    We are obviously not limited to creating internal links, or links to other web
    pages on our own website. Alternatively, we can create external links that will
    point to pages or resources on other websites.


    To create an external link, we need to use an absolute URL, meaning we have to
    set the complete address of the page including the protocol. For example, the
    following link will point to the W3Schools page that explains the <a> element:


    ```

    <a href="http://www.w3schools.com/tags/tag_th.asp">More information about HTML
    links</a>

    ```


    A mailto link helps users send an email message. When a user clicks on a mailto
    link, the web browser will open the default email program and begin creating a
    new email message.

    To create a mailto link, we need to specify a value in the href attribute that
    starts with the word “mailto,” followed by a colon (:) and our email address.
    For example,


    ```

    <a href="mailto:contact@samplecv.com">contact@samplecv.com </a>

    ```


    Notice that we used the email address as a label for this mailto link instead
    of something vague like “Email Us.” We did this because the mailto link doesn’t
    always work for users that have web-based email services like Gmail. Providing
    the actual address will help them get the actual email contact information if
    they can’t click on the link.


    If we create a link to a file that the browser does not know how to handle (ex.
    a Word or Excel file), the browser will either try to open a helper program to
    view the file or will try to download it to the user’s hard disk.'
  - '[PAGE 71]


    # Bookmarks


    Most links on our website will lead us from one page to another. When we click
    on a link and a new page is loaded, by default we are taken to the top of the
    indicated page, but the link doesn''t always have to point to the top. We can
    also create links to specific parts of a page. This is particularly useful when
    we want to direct the user to a particular segment of a long, scrolling page.
    The position on the page to which we send the user is a specific tag called a
    fragment. We can create links to fragments on the current web page or to a specific
    fragment on another web page.


    Creating a link that points to a fragment is a two-step process:

    First we identify the tag to which we will point by extending the tag with the
    id attribute. The id attribute assigns a unique name to any HTML element. For
    instance, let us say that in our CV sample we want to create a navigation menu
    that will point to different fragments of the CV. And let us assume that we want
    these fragments to be defined at each <h2> heading: Personal Information, Education,
    Skills and Portfolio. We need to identify the headings that we want to point to
    and we will do this as follows:


    ```

    <h2 id="education">Education</h2>

    ```


    By placing an id attribute in the <h2> heading, we have effectively created a
    bookmark.

    Second, we create a link that points to this bookmark. To do this, we add the
    number-sign symbol (#) followed by the bookmark name in the href attribute of
    an <a> element. For example:


    ```

    <a href="#education">Education</a>

    ```


    We can also create a link to a bookmark on a different page. All we need to do
    is append the bookmark to the end of the URL. For example:


    ```

    <a href="sample_cv.html#education">Education</a>

    ```


    When users click on this link the browser will first take them to the sample_cv.html
    page and then scroll them down until they reach the #education bookmark.


    > *Note:* When our bookmark is near the bottom of a page, a browser might not
    be able to scroll the bookmark all the way to the top of its window if there is'
