  md: '# # Chapter 1: Introduction to HTML


    Hypertext Markup Language, more commonly known as HTML, is the language of the
    World Wide Web (WWW). Knowing HTML is one of the core skills of any web designer
    and therefore should be one of the first things to master.


    In this book, we will learn everything we need to know about HTML, from understanding
    HTML documents to writing fully HTML5-compliant web pages. First, we will focus
    on the basics of HTML syntax, tags and attributes, and learn the process of structuring
    documents. Next, we will study the most common HTML elements that make up the
    bulk of the language such as paragraphs, headings, lists and tables. Finally,
    we will look at the HTML5 sectioning elements designed to create more meaningful
    documents, which will in turn help us create pages with greater semantic meaning.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# **HTML Terminology**


    As mentioned previously, HTML is an acronym for Hypertext Markup Language. If
    we observe this full name more closely, it means *language for marking hyper text*,
    and “marking” is the operative word. Markup language refers to a plain text language
    that is not even remotely related with programming. The word “hyper” symbolizes
    the web tendencies of this language. When the concept was conceived “hypertext”
    was a buzzword that indicated the linking of documents.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# **Elements and Tags**


    Even though a web page we look at today may be full of text, pictures and videos,
    underneath that facade is a single long file full of HTML text. When we “ask”
    our browser for a web page, the browser retrieves a document written in HTML,
    a language our browser can understand and interpret. The text has “markings” that
    instruct the browser where things begin, where they end, and what purpose they
    serve.


    To prepare a document for the web, we need to go through the simple process of
    marking up the text with a specific set of textual elements called tags. A tag
    is the basic building block of a web page and is essentially a reserved word placed
    between the ‘<’ and ‘>’ characters. For example, the element <html> represents
    a tag.


    All tags in HTML come in pairs, meaning there is a tag that signals the beginning
    of the element, also known as an **opening tag**, and a tag that signals the end
    of the element called a **closing tag**. The opening and the closing tags have
    the same name, with the only difference being that the name of the closing tag
    is always preceded by the slash character ‘/’.


    For example, the following HTML code:


    ```

    Carl <strong>Jung</strong>

    ```


    Will be displayed on the page as:


    Carl **Jung**


    When a web browser reads the HTML document and reaches the <strong> element, it
    doesn’t display the text <strong> on the web page. Instead, when the browser encounters
    a tag, it interprets it as a command to display text in a specific, predefined
    way. In this example, when encountering the <strong> tag the browser interprets
    that from that point on the text is marked up as strong, more important text,
    and it displays that text in bold until it reaches the closing tag </strong>.


    > **Note:** While marked up text has a default “look” in the browser, the actual
    visual representation of HTML elements is controlled by a different set of rules
    called Cascading Style Sheets (CSS).


    To reiterate, in HTML-speak, an **element** refers to the opening tag, the closing
    tag, and anything written between them. The content between the opening tag and
    the closing tag is referred to as **element content**. In the example above ‘<strong>Jung</strong>’
    is an element, ‘Jung’ is the element content, ‘<strong>’ is the opening tag of
    the element, and ‘</strong>’ is the closing tag of the element.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Empty Elements


    Some HTML elements do not contain any element content, meaning there is literally
    nothing between the opening and closing tag, neither text, nor other elements.
    However, these elements can still contain attributes. Examples or empty HTML elements
    are the <img> element, which contains information about how to display an image,
    and the <br> element, which simply indicates a line break.


    The **empty elements** can be written regularly with opening and closing tags,
    for example as <br></br>. HTML allows the option to combine both tags simply by
    including the closing forward slash right before the right angle bracket of the
    opening tag, for example <br />. In HTML5, the closing tag is no longer a requirement
    for empty elements and can be fully omitted.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# **Attributes**


    Attributes can extend the context and functionality of tags by allowing for the
    addition of extra properties to HTML elements. Attributes specify a specific value
    in the form:


    ```

    attributename=”attributevalue”

    ```


    The attribute name/value pair is added right after the reserved word of the opening
    tag. Some attributes are used to give necessary information such as where to find
    an image or where a link should point to, while others simply help give the element
    meaning. For example, let us assume that we want our previous example, the ‘Carl
    Jung’ text, to be defined as a link:


    ```

    <a>Carl Jung</a>

    ```


    However, to define the actual web page to which the link would point, it is necessary
    to extend the functionality of the <a> tag with the href attribute. In our example,
    we want to link the text to the www.carljung.com web page.


    ```

    <a href=”http://www.carljung.com”>Carl Jung</a>

    ```


    Each HTML element has a certain set of valid attributes and valid values for those
    attributes. A tag’s properties can be expanded upon with more than one attribute.
    All of the attributes are included in the same opening tag of the element and
    are separated with an empty space. For example, the following code defines both
    the width and the height of an image.


    ```

    <img width=”200” height=”100”></img>

    ```


    > **Note:** End tags never contain any attributes.


    A common question concerns the difference between tags and attributes. Generally,
    attributes are used when you need to describe the data itself. In other words,
    if it’s data that’s meant to be seen by the end user, it’s best to mark it up
    in an element. If it’s data that describes some other data in the document, it’s
    best to use an attribute.'
  merge: -1
