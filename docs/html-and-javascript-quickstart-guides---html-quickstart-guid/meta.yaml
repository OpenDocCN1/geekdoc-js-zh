    \ {\n    document.write(months[counter] + ” “);\n    counter++;\n}\n```\n\nWe\
    \ initiate a counter variable that has the same starting value as the index of\
    \ the first array item, which is 0. Following, we begin a while loop that runs\
    \ until the counter value is less than the length of the array. The condition,\
    \ counter < months.length inquires whether the current value of the counter variable\
    \ is lower than the number of array items by comparing it to the array’s length\
    \ property. Each time the while loop runs we print the value of a single array\
    \ item and we subsequently increase the value of the counter variable by 1.\n\n\
    If we want to perform the same action with a for loop we can use the following\
    \ code:\n\n```\nvar months = [“Jan”, “Feb”, “Mar”, “Apr”, “May”, “Jun”, “Jul”,\
    \ “Aug”, “Sep”, “Oct”, “Nov”, “Dec”];\nfor (var counter = 0; counter < months.length;\
