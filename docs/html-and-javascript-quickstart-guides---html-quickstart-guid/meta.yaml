    \ that we want removed from the page.\n\n```\ncontainerForHeading.removeChild(removeHeading);\n\
    ```\n\nThe complete syntax is as follows:\n\n```\nvar removeHeading = document.getElementById(\"\
    partytitle\");\nvar containerForHeading = removeHeading.parentNode;\ncontainerForHeading.removeChild(removeHeading);\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_186_0.png)\n\n## Chapter 6: Events\n\
    \nOne of the most important concepts in JavaScript is the use of events. An event\
    \ is simply something that happens, like pressing a key on the keyboard or clicking\
    \ somewhere on the page. As long as something happens and it has been expected\
    \ we can respond to it with a specific action. We can intercept the anticipated\
    \ event and respond in kind by calling a function when that event occurs. As we\
    \ will see in this final chapter, to make JavaScript anticipate events we will\
    \ use event handlers or event listeners. But first, let us look at the type of\
    \ events that we can handle or listen for.\n\n### Event Types\n\nWhen we interact\
    \ with web pages we initiate a lot of events. We click a link, hover over an element,\
    \ type text, open the browser, close a tab, copy/paste text, fill-out forms and\
    \ so on. Almost everything we do triggers an event, and when an event is triggered\
    \ we usually want to code a function that will react specifically to that event.\n\
    \nThere are many types of events that we can react to, but we will only focus\
    \ on mouse events, keyboard events and browser/object events. The following three\
    \ tables give a brief description of the most commonly used events for each event\
    \ type.\n\n**Mouse events** occur when the user does something with the mouse\
    \ like moving, clicking, dragging, etc.\n\n| EVENT | DESCRIPTION |\n|---|---|\n\
    | onclick | The user clicks an element |\n| ondblclick | The user double clicks\
    \ an element |\n| onmouseover | The user positions the mouse pointer on a specific\
    \ element |\n| onmouseout | The user moves the mouse pointer away from a specific\
    \ element |\n| ondrag | The user clicks and drags an element |\n\n**Table 2.**\
    \ Mouse events\n\n**Keyboard events** are simpler as they occur either when a\
    \ key is pressed or depressed.\n\n| EVENT | DESCRIPTION |\n|---|---|\n| onkeydown\
    \ | The user is pressing a key |\n| onkeyup | The user has released a pressed\
    \ key |\n\n**Table 3.** Keyboard events\n\n**Browser/object events** are more\
    \ generic events that occur at different times like when the web page is loaded.\n\
    \n| EVENT | DESCRIPTION |\n|---|---|\n| onload | The page/object has loaded |\n\
    | onunload | The page/object has unloaded |\n| onfocus | The page/element gets\
    \ focus |\n| onblur | The page/element loses focus |\n| onerror | An error has\
    \ occurred on the page |\n| onresize | The page/object is resized |\n| onscroll\
    \ | The scrollbar of the page/object is used |\n\n**Table 4. Browser/Object events**\n\
    \nMouse events are the most common user-based events that occur on a web page.\
    \ However, with the advent of touch-based devices there is an increased consideration\
    \ for touch events.\n\n> *Note: The full list of possible events is rather large\
    \ and beyond the scope of this book. Please visit the W3C Schools web site for\
    \ a complete list (http://www.w3schools.com/jsref/dom_obj_event.asp).*\n\n###\
    \ Reacting to Events\n\nIn order to program JavaScript to react to an event we\
    \ have to bind that event to an element on the page via event handlers. Event\
    \ handlers let us indicate the event we are listening for on any specific element.\
    \ For this purpose there are three different approaches to event handlers:\n\n\
    - **HTML event handlers** are a set of attributes that can respond to events on\
    \ the element they are added. Although still present in older web pages, this\
    \ approach is no longer used as it integrates JavaScript into HTML when it should\
    \ separate.\n- **DOM event handlers** are the approach introduced in the original\
    \ DOM specification. They are separate from the HTML document and have a strong\
    \ support in all major browsers. Their main drawback is the limitation of attaching\
    \ only a single function to an event.\n- **DOM event listeners** are the favored\
    \ approach to handling events, introduced in an update of the DOM specification.\
    \ They allow one event to trigger multiple functions, however they are not supported\
    \ by IE8 and earlier versions of that browser.\n\nWhen dealing with events we\
    \ first have to select the element that will be the object of interaction. If\
    \ for example this element is a link, then we need to specify the DOM node for\
    \ that link element. After we have the element selected we will need to indicate\
    \ the event that will act as a trigger. In programmer speak this is called “binding\
    \ the event to the element node”. Finally, we have to state the code, which is\
    \ usually a function that we want to have triggered when the event happens.\n\n\
    In the remainder of the chapter we will focus on event handlers and event listeners\
    \ and ignore the discarded HTML approach. To follow the examples in this chapter\
    \ we will use a similar HTML structure like in the Party Schedule example from\
    \ the previous chapter. The only difference is the link elements that have been\
    \ added to every list item.\n\n```\n<!doctype html>\n<html>\n<head>\n<meta charset=\"\
    utf-8\">\n<title>Party Schedule</title>\n<style type=\"text/css\">\n.current {\n\
    \    color:red;\n}\n.finished {\n    color:green;\n}\n</style>\n</head>\n<body>\n\
    <h1 id=\"partytitle\">Party Plan</h1>\n<ul id=\"partyplan\">\n  <li id=\"phase1\"\
    >20:00 - <a href=\"#\" id=\"testLink\">Home warm-up</a></li>\n  <li id=\"phase2\"\
    >22:00 - Joe's Bar</li>\n  <li id=\"phase3\">00:00 - Nightclub 54</li>\n</ul>\n\
    </body>\n</html>\n```\n\n### Event Handlers\n\nThere are many very similar approaches\
    \ to using traditional DOM event handlers. Some are very compact, while others\
    \ have more lines of code, but might be more understandable. As an example, let\
    \ us write a brief script that will change the color of the link once it is clicked.\
    \ To begin we will first create the function that we want to have triggered when\
    \ the event occurs.\n\n```\nfunction linkClick(){\n    this.className = \"current\"\
    ;\n}\n```\n\nBy using the `this.className` property we instruct the object calling\
    \ on this function to set its `className` property to “current”. Now that we have\
    \ our function in place let us call on the object that will trigger the event\
    \ by using the `getElementById()` method and assign its element node to a variable.\n\
    \n```\nvar firstLink = document.getElementById(\"testLink\");\n```\n\nAs we have\
    \ retrieved the reference to the element node, we can finally construct a proper\
    \ event handler.\n\n```\nfirstLink.onclick = linkClick;\n```\n\nThe complete syntax\
    \ is as follows:\n\n```\nfunction linkClick(){\n    this.className = \"current\"\
    ;\n}\nvar firstLink = document.getElementById(\"testLink\");\nfirstLink.onclick\
    \ = linkClick;\n```\n\n![](img/f8023be36714e65595b822db3c227be4_194_0.png)\n\n\
    **Image 33.** Using an event handler to change the link color\n\nConsidering that\
    \ JavaScript is a very flexible language we can actually compact this in two lines\
    \ of code, but we will lose some of the flexibility.\n\n```\ndocument.getElementById(\"\
    testLink\").onclick = function linkClick() {\n    this.className = \"current\"\
    ;\n}\n```\n\nThe `linkClick` function that is triggered by the `onclick` event\
    \ doesn't have to be simple. We can change more than one property and we can even\
    \ write complex scripts that deal with different situations. For example, the\
    \ following code will change the text of the link in addition to the addition\
    \ of a class.\n\n```\nfunction linkClick(){\n    this.className = \"current\"\
    ;\n    this.textContent = \"Party Finished\"\n}\nvar firstLink = document.getElementById(\"\
    testLink\");\n```"
