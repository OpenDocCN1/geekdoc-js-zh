  md: '# DOM Manipulation


    A more direct technique to managing document content is to use DOM manipulation.
    This is a 3-step process that uses the following methods:


    +   1) **createElement()** - The process begins by creating a new element node
    with the `createElement()` method. This element node is stored in a variable and
    it is not yet a part of the DOM.


    2) **createTextNode()** - The process continues by creating a new text node with
    the `createTextNode()` method. Like in the previous step, this text node is stored
    in a variable and it is not a part of the document.


    3) **appendChild()** - The final step is adding the created element to the DOM
    tree with the `appendChild()` method. The element will be added as a child to
    an existing element. The same method can be used to add the text node to the element
    node.


    As an example let us create a new element that we will add to the existing party
    list. We will use the `createElement()` method and add this element to the `newPlan`
    variable.


    ```

    var newPlan = document.createElement(“li”);

    ```


    Following, we will create a new text node and add its content as a value to the
    `newPlanText` variable.


    ```

    var newPlanText = document.createTextNode(“04:00 - Back to home”);

    ```


    We can now assign the content of the text node to the `newPlan` element by using
    the `appendChild()` method.


    ```

    newPlan.appendChild(newPlanText);

    ```


    Finally, we would like to add this element to the list. We will use the `getElementById()`
    method to select the list through its “partyplan” id , and apply the `appendChild()`
    method to attach the `newPlan` element to the list.


    ```

    document.getElementById(“partyplan”).appendChild(newPlan);

    ```'
