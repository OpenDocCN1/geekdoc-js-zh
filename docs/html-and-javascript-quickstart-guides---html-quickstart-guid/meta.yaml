    \ with 0 drinks the variable `drinks` is declared in the main body of the JavaScript\
    \ code with the assigned value of 0. As the `drinks` variable is declared in the\
    \ main code it has global scope, meaning that it is accessible to all other functions.\
    \ For this reason, when we display this variable with the `document.write` statement\
    \ both in the function and in the main code we get the assigned value of 5.\n\n\
    Now, let us assume that we want to track the number of drinks at each place we\
