  md: '# Comments


    From working with HTML and CSS we should already be familiar with comments. Basically,
    commenting is a way to tell the browser to ignore segments of the code. The purpose
    of comments is to leave notes about our code either for us or whoever is going
    to read the code after us. As JavaScript can be more difficult to understand when
    it is revised on a later date, commenting is even more important.


    JavaScript recognizes two different approaches to commenting, marking a single
    line as a comments and marking multiple lines as comments. Regardless of the approach,
    lines which are commented will not be executed by the interpreter.


    Single line comments are created by two forward slashes. When the interpreter
    finds two forward slashes it will ignore everything that follows until the end
    of the line.


    ```

    //this is a single line comment

    ```


    It is also possible to write a line that is part code and part comment. In the
    following example, after the variable year is declared, the rest of the line will
    be treated as a comment.


    ```

    var year = 2015; //this is most likely the current year

    ```


    When we need more than one line of comments we can use an alternative approach.
    Multiline comments in JavaScript are the same as multiline comments in CSS. The
    comments have a beginning, initiated by a forward slash and an asterisk ( /* )
    and they have an end initiated by an asterisk and a forward slash ( */). Anything
    between these opening and closing comment signifiers will always ignored by the
    interpreter.


    ```

    /*This is a comment that

    is written in exactly

    three lines */

    ```'
