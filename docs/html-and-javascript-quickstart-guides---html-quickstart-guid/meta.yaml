    To represent physical things and concepts in the programming world we need to
    use objects. But before we use programming objects let us examine an object from
    the real world, a car. If we want to describe a car we will talk about its characteristics
    such as color, make and model. We might expand our description to number of doors,
    seats, engine type, maximum speed or any other set of characteristics. We can
    also talk about how we use the car, from turning the ignition key, to driving
    or listening to the stereo, or even how we use parts of the car, like reclining
    the seats. We can even compare different car “versions” based on this outline.


    In programming, the car would be described as an object. The characteristics of
    the car such as color, make, model, would be defined as the properties of the
    car object. The things we can do with the car, like driving or listening to music
    are represented by what is known as methods. And finally, each actual representation
    of a car is called an instance. For example, in the following image you are looking
