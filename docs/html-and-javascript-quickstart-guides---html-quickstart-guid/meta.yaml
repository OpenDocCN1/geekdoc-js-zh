    \n**图片 12.** 使用替代条件语句\n\n在上面的例子中，用户被要求输入他/她拥有的金额。然后，JavaScript 程序评估答案，并根据输入的金额从三个可用的响应中回复一个。\n\
    \n## 多重条件\n\n现在我们已经介绍了所有替代方案，让我们看看当存在多个变量时会发生什么。当我们处理不同的变量时，我们需要构建更复杂的条件语句。例如，如果我们正在举行一个私人单身派对，我们必须确保不让任何人进来，除非他们是女性并且超过\
    \ 18 岁。使用上一章的逻辑运算符和 `if/else` 条件语句，我们可以构建更复杂的比较。\n\n```\nvar gender = prompt(\"\
    What is your gender?\",\"\");\nvar age = prompt(\"How old are you?\",\"\");\n\
    if ((gender == \"female\") && (age >= 18)) {\n    document.write(\"Please enter.\
    \ Hope you brought a nice gift.\");\n}\nelse if (gender == \"male\") {\n    document.write(\"\
    This is a bachelorette party. No guys allowed.\");\n}\nelse {\n    document.write(\"\
    You are probably too young to enter. Come back in a few years.\");\n}\n```\n\n\
    ![](img/f8023be36714e65595b822db3c227be4_139_0.png)\n\n### **图片 13.** 检查多重条件\n\
    \n在上面的例子中，我们根据两个因素做出决定：性别和年龄。只有当两个条件都为真时，即这个人是年满 18 岁的女性，才会做出肯定的决定。在 JavaScript\
    \ 中，我们使用逻辑运算符组合条件，在本例中是 `AND` 运算符，由双 `&` 符号 (`&&`) 表示。在单个条件语句中，当在两个条件之间使用此运算符时，我们将结果总结为一个条件。\n\
    \n## 循环语句\n\n在我们日常完成一项任务的过程中，我们必须一遍又一遍地重复相同的步骤系列。为了洗碗，我们必须单独洗每一个盘子。为了下楼梯，我们必须一次走下一个台阶。在收银台，我们必须把购物车里的每件商品拿出来，扫描一下，然后放回袋子里。嗯，在编程中，重复性任务很容易完成。事实上，JavaScript\
    \ 非常擅长执行重复性任务，因为它拥有所有必要的工具来一遍又一遍地做同样的事情。在编程术语中，重复执行同一任务被称为循环。\n\n有几种不同类型的循环。它们本质上做同样的事情，但方法略有不同。在本节中，我们将熟悉\
    \ `while` 循环和 `for` 循环。\n\n### While 循环\n\n在 `while` 循环中，只要某个条件为真，相同的代码就会被重复执行。让我们看一个例子，它随着我们每年年龄的增长来检查我们的年龄。\n\
    \n```\nvar age = 1;\nwhile (age < 18) {\n    document.write(\"Another year has\
    \ passed. You are now \"+age+\" years old.<br>\");\n    age = age + 1;\n}\ndocument.write(age+\"\
    ? Congratulations! You are now an adult.\");\n```\n\n在这个例子中，在声明了 `age` 变量之后，我们引入了一个\
    \ `while` 语句。在 `while` 关键字之后，我们在括号中放置一个条件，在我们的例子中是 `age<18`。如果条件为真，JavaScript\
    \ 解释器将运行出现在大括号之间的代码。与条件语句不同，当遇到 `while` 语句的结束大括号时，JavaScript 不会继续执行程序的其余部分，而是再次启动\
    \ `while` 语句。只要存储在 `age` 变量中的数字小于 18，脚本就会运行 `document.write()` 命令。\n\n只有当条件为假时，解释器才会“退出”循环并继续解析代码的其余部分。这使得\
    \ `while` 循环的最后一行非常重要。它不仅改变了条件变量的值，还使测试条件最终可能为假。如果没有这种可能性，我们将“锁定”解释器一遍又一遍地执行相同的任务...永远。这就是所谓的无限循环，本质上是一个永远不会完成的循环。无限循环将一直运行，直到它使计算机崩溃，或者在一定时间后从现代解释器收到超时信号。\n\
    \n### For 循环\n\n在 JavaScript 中，有第二个选项来创建循环语句，它更紧凑但稍微更令人困惑。`for` 循环可以用更少的代码行实现与\
    \ `while` 循环相同的功能，但对于初学者程序员来说，代码有点不直观。在 `for` 循环中，变量声明、条件和变量值的更改都在同一时间完成。例如，让我们用\
    \ `for` 循环语法编写之前的年龄增长 `while` 循环。\n\n```\nfor (var age = 1; age < 18; age++) {\n\
    \    document.write(\"Another year has passed. You are now \"+age+\" years old.<br>\"\
    );\n}\n\ndocument.write(age+\"? Congratulations! You are now an adult.\");\n```\n\
    \n![](img/f8023be36714e65595b822db3c227be4_143_0.png)\n\n如图所示，在这两种情况下，生成的内容完全相同。每个循环都以\
    \ `for` 关键字开始。这后面跟着一组括号，其中包含三个部分。\n\n1)  第一部分仅在语句开始时应用一次，声明条件变量 `age`，并将其初始值设置为\
    \ 1。初始值用作循环将重复次数的起点，可以是任何数字。如果该变量在脚本中已经初始化过，则 `var` 关键字将是不必要的。\n\n2)  第二部分是条件本身，在每次执行循环之前都会进行评估。只要条件为真，`for`\
    \ 语句将不断重复代码。当条件为假时，循环将被告知停止运行，在我们的例子中，这发生在 `age` 变量变得大于或等于 18 时。\n\n3)  最后，第三部分决定了条件变量的更改速率。在我们的例子中，条件变量在每个周期后增加\
    \ 1，但这不是强制性的。条件变量可以变大或变小，并且可以按我们设置的任何数量增加/减少。\n\n为了完成 `for` 循环的结构，我们有大括号，其中包含我们希望在循环中使用的代码，在我们的例子中是用\
    \ `document.write()` 在网页上写一行文本。\n\n## 循环与数组\n\n当我们想要处理数组变量时，循环语句非常有用。在 JavaScript\
    \ 中，我们可以使用循环遍历数组项，并在必要时对每一项执行操作。\n\n在本书前面，我们创建了一个名为 `months` 的数组，其中包含一年中的十二个月。\n\
    \n```\nvar months = [\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"\
    Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"];\n```\n\n使用 `while` 或 `for`\
    \ 循环，我们将遍历数组中的每一项并将其打印到页面上。我们将通过使用它们的索引来访问数组项，并在每个循环周期中依次增加索引值。如果我们使用 `while`\
    \ 语句，我们将有以下代码：\n\n```\nvar counter = 0;\nwhile (counter < months.length) {\n \
    \   document.write(months[counter] + \" \");\n    counter++;\n}\n```\n\n我们启动一个计数器变量，它的起始值与第一个数组项的索引相同，即\
    \ 0。接下来，我们开始一个 `while` 循环，该循环一直运行到计数器值小于数组的长度。条件 `counter < months.length` 通过将计数器变量的当前值与数组的\
    \ `length` 属性进行比较，询问当前值是否低于数组项的数量。每次 `while` 循环运行时，我们打印单个数组项的值，然后将计数器变量的值增加 1。\n\
    \n如果我们想用 `for` 循环执行相同的操作，我们可以使用以下代码：\n\n```\nvar months = [\"Jan\", \"Feb\", \"\
    Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\"\
    , \"Dec\"];\nfor (var counter = 0; counter < months.length; counter++) {\n   \
    \ document.write(months[counter] + \" \");\n}\n```\n"
