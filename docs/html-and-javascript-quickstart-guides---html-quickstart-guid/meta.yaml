  md: "# For Loops\n\nIn JavaScript there is a second option for creating a loop statement\
    \ which is more compact and slightly more confusing. For loops can achieve the\
    \ same thing as a while loop with fewer lines of code, but a code that is a bit\
    \ unintuitive for the novice programmer. In a for loop, the variable declaration,\
    \ the condition and the changing value of the variable is all done at the same\
    \ time. As an example let us write the previous age-growing while loop with a\
