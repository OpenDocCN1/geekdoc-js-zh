  md: '# # Chapter 4: Content Structure


    HTML5 is all about the semantics. Semantic elements add meaning and structure
    to the content of our pages by letting us identify the logical purpose of its
    different areas.


    Before defining the specifications, HTML5 contributors analyzed existing web pages
    to determine their common elements. Consequently, HTML5 now includes new elements
    that are solely used to define meaning and structure. These elements are used
    for grouping related content together, defining which parts of the content are
    header, footer or main body elements, describing navigational menus, etc. The
    website user is never aware of this information, but many tools use it. For example,
    search engines use the semantic elements to learn more about our page. Screen
    reading programs present the content more effectively, as semantic elements create
    more accessible content. Other tools can be used to extract data from our page
    and use it in a variety of different ways, like presenting it in a newsfeed.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# **Sectioning Content**


    Sectioning content is used to divide an HTML document into sections. Every section
    of the document would generally have its own header, main content and possibly
    footer.


    In HTML revisions prior to HTML5, more notably HTML 4 and XHTML 1, the choices
    for sectioning content were rather limited. The only sectioning elements designers
    had to work with were the <body> and <div> tags; <div> is a generic element used
    to signify a division. This made the semantic markup of a document virtually impossible
    and made it difficult for screen readers and other assistive devices to evaluate
    a page. The new HTML5 semantic markup makes it easy for machines and people alike
    to understand the content’s meaning and context and provides a way to differentiate
    the key content from sidebars or unrelated information.


    Each semantic element of HTML5 has no specific output, color, or design.. Unless
    it has been styled with CSS, each semantic element will be invisible, and its
    contents will appear drab and monotone when viewed in a web browser.


    > *Note: Theoretically, sectioning elements allow us to create document outlines
    using headings, form titles, table titles, and any other appropriate landmarks
    that map out the document. The outlining algorithm has been clearly defined in
    the HTML5 spec, but browsers and assistive technologies have not yet implemented
    it.*'
  merge: -1
  pgno: 81
- img_proc: true
  md: "# The <section> and <article> Elements\n\nThe <section> element is the most\
    \ generic element for sectioning content and is primarily used for grouping content\
    \ with similar meanings. It is meant as a general container element with some\
    \ additional semantic meaning when the content has to represent a logical group\
    \ of related content. A section, in this context, is a thematic grouping of content,\
    \ typically starting with its own heading. Additionally, you can use <section>\
    \ to define page segments. For example, on your web page, you could put blog posts,\
    \ news, and a sidebar of ads into separate <section> elements.\n\nSimilar to <section>,\
    \ the <article> element was introduced as a way to group together related information\
    \ in a document. It is most appropriate to consider the <article> element as a\
    \ specialized type of <section> with more specific semantic meaning. This element\
    \ represents whatever we consider an article, meaning a section of self-contained\
    \ content like a newspaper article, blog entry, forum post or similar content\
    \ items. For example, an <article> element will contain a single blog post, while\
    \ a <section> element can contain several (or all) blog posts on the page.\n\n\
    What is the actual difference between <section> and <article> elements? A <section>\
    \ is a logical part of a document, and an <article> is actual content. Think of\
    \ a newspaper. A <section> element is like the sports section. The sports section\
    \ has many articles, just like <section> can contain a lot of <article> elements.\
    \ Semantically, articles may be long and content-rich with the need to be divided\
    \ into their own bunch of sections. Following are a few examples that show the\
    \ interchangeable use of <section> and <article>.\n\nA simple web blog article\
    \ would have the following structure:\n\n```\n<article>\n    <h1>Blog Article\
    \ Heading</h1>\n    <p>Article Content</p>\n</article>\n```\n\nConversely, a page\
    \ that lists multiple blog articles would have the following structure:\n\n```\n\
    <section>\n    <article>\n        <h1>Blog Article #1 Heading</h1>\n        <p>Article\
    \ Content</p>\n    </article>\n```"
  merge: -1
  pgno: 82
- img_proc: true
  md: '```

    <article>


    <h1>Blog Article #2 Heading</h1>


    <p>Article Content</p>


    < /article> <article>


    <h1>Blog Article #3 Heading</h1>


    <p>Article Content</p>


    < /article>


    </section>

    ```


    On the other hand, a long article, like our sample CV, can contain subsections
    and follow this structure:


    ```

    <article>


