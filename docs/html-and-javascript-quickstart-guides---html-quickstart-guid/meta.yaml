- md: "## **Attributes**\n\nAttributes can extend the context and functionality of\
    \ tags by allowing for the addition of extra properties to HTML elements. Attributes\
    \ specify a specific value in the form:\n\n```\nattributename=”attributevalue”\n\
    ```\n\nThe attribute name/value pair is added right after the reserved word of\
    \ the opening tag. Some attributes are used to give necessary information such\
    \ as where to find an image or where a link should point to, while others simply\
    \ help give the element meaning. For example, let us assume that we want our previous\
    \ example, the ‘Carl Jung’ text, to be defined as a link:\n\n```\n<a>Carl Jung</a>\n\
    ```\n\nHowever, to define the actual web page to which the link would point, it\
    \ is necessary to extend the functionality of the `<a>` tag with the `href` attribute.\
    \ In our example, we want to link the text to the `www.carljung.com` web page.\n\
    \n```\n<a href=”http://www.carljung.com”>Carl Jung</a>\n```\n\nEach HTML element\
    \ has a certain set of valid attributes and valid values for those attributes.\
    \ A tag’s properties can be expanded upon with more than one attribute. All of\
    \ the attributes are included in the same opening tag of the element and are separated\
    \ with an empty space. For example, the following code defines both the width\
    \ and the height of an image.\n\n```\n<img width=”200” height=”100”></img>\n```\n\
    \n> **Note:** End tags never contain any attributes.\n\nA common question concerns\
    \ the difference between tags and attributes. Generally, attributes are used when\
    \ you need to describe the data itself. In other words, if it’s data that’s meant\
    \ to be seen by the end user, it’s best to mark it up in an element. If it’s data\
    \ that describes some other data in the document, it’s best to use an attribute.\n\
    \n## *The Concept of Document Structure*\n\nBefore we dive into the intricacies\
    \ of the web markup language, HTML, let’s look at the general concept of marking\
    \ up the structure of text.\n\nFor the purpose of explaining this concept, we\
    \ will create our own tags instead of using a predefined HTML set, as it will\
    \ be easier to follow and understand the underlying ideas.\n\nLet us consider\
    \ the following text:\n\nThe Fellowship of the Ring\n\nWe may either identify\
    \ this text as the title of a book written by JRR Tolkien or as the title of a\
    \ movie directed by Peter Jackson. Others might not be familiar with this text,\
    \ and therefore it is necessary to mark it properly. For starters, let us consider\
    \ that this text refers to a book and use a label that will identify this text\
    \ as a title.\n\n```\n<title>The Fellowship of the Ring</title>\n```\n\nAfter\
    \ that, let us add information about the author so the readers know which author\
    \ wrote this book.\n\n```\n<title>The Fellowship of the Ring</title>\n\n<author>J.R.R.\
    \ Tolkien</author>\n```\n\nWe can then continue to add more information about\
    \ this book. For example, we can add the genre and the publication date as follows:\n\
    \n```\n<title>The Fellowship of the Ring</title>\n\n<author>J.R.R. Tolkien</author>\n\
    \n<genre>Fantasy</genre>\n\n<published>July 29th, 1954</published>\n```\n\nLet\
    \ us take this one step further and encode information about more books in the\
    \ same document. The Lord of the Rings is actually a trilogy of books written\
    \ by JRR Tolkien, so let us record all of them. To achieve this and separate one\
    \ book from the other, we need to group the elements referring to a single book\
    \ together to clearly note where one book ends and another begins. To group the\
    \ elements, we will do what is known as **nesting**, meaning we will place one\
    \ element or many elements inside another to create a meaningful group.\n\n```\n\
    <book>\n    <title>The Fellowship of the Ring</title>\n    <author>J.R.R. Tolkien</author>\n\
    \    <genre>Fantasy</genre>\n    <published>July 29th, 1954</published>\n</book>\n\
    ```\n\nWith this we have defined one `<book>` element. As this element encloses\
    \ four other elements, we can call the `<book>` element a parent element, and\
    \ `<title>`, `<author>`, `<genre>` and `<published>`, child elements. We can now\
    \ extend this document to include all books from the trilogy by simply duplicating\
    \ the markup tags and changing the content within.\n\n```\n<book>\n    <title>\
    \ The Fellowship of the Ring</title>\n    <author>J.R.R. Tolkien</author>\n  \
    \  <genre>Fantasy</genre>\n    <published>July 29th, 1954</published>\n</book>\n\
    <book>\n    <title>The Two Towers</title>\n    <author>J.R.R. Tolkien</author>\n\
    \    <genre>Fantasy</genre>\n    <published>November 11th, 1954</published>\n\
    </book>\n```\n\n```\n<book>\n    <title>The Return of the King</title>\n    <author>J.R.R.\
    \ Tolkien</author>\n    <genre>Fantasy</genre>\n    <published>October 20th, 1955</published>\n\
    </book>\n```\n\nThe indentation of the child elements and the placement of the\
    \ opening and closing tags of the parent element into separate lines are strictly\
    \ for readability. For software programs that can interpret this markup, placing\
    \ everything in one line would have the exact same meaning. Additionally, markup-reading\
    \ applications will typically ignore all whitespace between the tags, like empty\
    \ spaces, indentations or line breaks. The application simply interprets any number\
    \ of consecutive spaces or tabs as a single space.\n\n```\n<book><title>The Lord\
    \ of the Rings: The Fellowship of the Ring</title><author>J.R.R. Tolkien</author><genre>Fantasy</genre><published>July\
    \ 29th, 1954</published></book>\n```\n\nHowever, writing markup in this manner\
    \ is not conducive to reading and managing the text, therefore it is recommended\
    \ to place each element on a new line.\n\n> **Note:** There is a higher order\
    \ markup language that allows us to create our own tags, just like in this example.\
    \ This language is called eXtensible Markup Language (XML).\n\n## A Little Background\n\
    \nHTML was originally designed as a markup language to describe the structure\
    \ and semantics of a web document. The elements and attributes of HTML were supposed\
    \ to indicate things such as the title of a document, what part of the text was\
    \ a heading, what part of the text was a paragraph, what data belonged in a table,\
    \ and so on. In its earliest form, the web was intended to transmit scientific\
    \ documents so that the research community had quick and easy access to published\
    \ work.\n\n> **Note:** *There was never any such thing as HTML 1. The first official\
    \ HTML specification was HTML 2.0.*\n\nAt the time, many people saw the potential\
    \ of the growing web. These users started creating web pages for all different\
    \ kinds of purposes, from personal home pages to huge corporate sites advertising\
    \ a company’s products and services. It wasn’t long before web page authors wanted\
    \ to control how their sites looked, and they expected the same level of control\
    \ over their pages’ appearance as print designers had over their creations. The\
    \ web designers wanted to be able to control the fonts and colors used in documents\
    \ and where their text would appear on a page. These needs and wants gave rise\
    \ to what is known as presentational or stylistic markup, because it affects the\
    \ way that pages look. Stylistic markup does not describe the structure and semantics\
    \ of the document, which was the initial intention of HTML. Many of the features\
    \ in these specifications were driven by existing implementations of market-leading\
    \ browsers as a response to user demand.\n\n## **The Rise and Fall of XHTML**\n\
    \nTo keep this story short, the HTML language evolved from version 2.0 to 4.01,\
    \ at which point the original purpose of structuring the document was completely\
    \ lost. The people in charge of developing web standards, the World Wide Web Consortium\
    \ (W3C), decided to remove all stylistic markup from HTML and rewrite it completely\
    \ by using XML syntax. This new major revision was called XHTML 1.0.\n\nThe content\
    \ of the XHTML 1.0 specification was identical to that of HTML 4.01; no new elements\
    \ or attributes were added. As a matter of fact all presentational tags and attributes\
    \ were removed, so XHTML 1.0 had fewer tags and attributes than its previous iteration.\n\
    \nThe only major difference between XHTML 1.0 and HTML 4.01 was in the syntax\
    \ of the language. While HTML allowed authors complete freedom in how they structured\
    \ their elements, XHTML required authors to follow the stricter rules of XML,\
    \ encouraging authors to use a single writing style. During this time period,\
    \ web designers embraced the emergence of web standards, so the stricter syntax\
    \ of XHTML was viewed as a “best practice” for writing markup.\n\n> **Note:**\
    \ The publication of XHTML 1.0 coincided with the rise of browser support for\
    \ CSS; therefore it was very easy to completely move all stylistic markup away\
    \ from the structure of the document.\n\nThen the W3C tried to push XHTML toward\
    \ an XML-based future. They published XHTML 1.1 and moved toward XHTML 2, which\
    \ would be a new, pure language that was backwards compatible with neither existing\
    \ web content nor previous versions of HTML. The W3C were starting to formulate\
    \ theoretically pure standards unrelated to the needs of web designers and vendors\
    \ who wanted emphasis placed on the creation of web applications. This caused\
    \ a schism in the W3C itself, and the dissatisfied people formed their own group,\
    \ the Web Hypertext Application Technology Working Group (WHATWG).\n\nFrom here\
    \ the story becomes so convoluted and technical that we will just skip to the\
    \ part in which XHTML 2 never comes to fruition and instead the HTML5 specification\
    \ becomes the new official revision of the HTML language."
  mdcn: "\n## **属性**\n\n属性可以通过向 HTML 元素添加额外的属性来扩展标签的上下文和功能。属性以如下形式指定特定值：\n\n```\n\
    attributename=”attributevalue”\n```\n\n属性名/值对紧跟在开始标签的保留字之后。一些属性用于提供必要信息，例如图片的位置或链接应指向的位置，而另一些则只是帮助赋予元素含义。例如，假设我们希望之前的示例中的“Carl\
    \ Jung”文本被定义为一个链接：\n\n```\n<a>Carl Jung</a>\n```\n\n然而，要定义链接实际指向的网页，就需要使用 `href`\
    \ 属性扩展 `<a>` 标签的功能。在我们的示例中，我们希望将文本链接到 `www.carljung.com` 网页。\n\n```\n<a href=”http://www.carljung.com”>Carl\
    \ Jung</a>\n```\n\n每个 HTML 元素都有一组有效的属性和这些属性的有效值。一个标签的属性可以通过多个属性来扩展。所有属性都包含在同一个元素的开始标签中，并用空格分隔。例如，下面的代码同时定义了图片的宽度和高度。\n\
    \n```\n<img width=”200” height=”100”></img>\n```\n\n> **注意：** 结束标签中从不包含任何属性。\n\
    \n一个常见的问题是关于标签和属性的区别。通常，当你需要描述数据本身时，会使用属性。换句话说，如果是希望最终用户看到的数据，最好将其标记在元素中。如果是描述文档中其他数据的数据，最好使用属性。\n\
    \n## *文档结构概念*\n\n在我们深入探讨网络标记语言 HTML 的复杂性之前，让我们先看看标记文本结构的一般概念。\n\n为了解释这个概念，我们将创建自己的标签，而不是使用预定义的\
    \ HTML 集合，因为这样更容易理解其基本思想。\n\n让我们考虑以下文本：\n\nThe Fellowship of the Ring\n\n我们可以将这段文本识别为\
    \ JRR Tolkien 所写书籍的标题，或者 Peter Jackson 执导的电影标题。其他人可能不熟悉这段文本，因此有必要正确地标记它。首先，让我们假设这段文本指的是一本书，并使用一个标签将这段文本标识为标题。\n\
    \n```\n<title>The Fellowship of the Ring</title>\n```\n\n之后，让我们添加关于作者的信息，这样读者就知道是哪位作者写了这本书。\n\
    \n```\n<title>The Fellowship of the Ring</title>\n\n<author>J.R.R. Tolkien</author>\n\
    ```\n\n然后，我们可以继续添加关于这本书的更多信息。例如，我们可以按如下方式添加体裁和出版日期：\n\n```\n<title>The Fellowship\
    \ of the Ring</title>\n\n<author>J.R.R. Tolkien</author>\n\n<genre>Fantasy</genre>\n\
    \n<published>July 29th, 1954</published>\n```\n\n让我们更进一步，在同一个文档中编码更多书籍的信息。指环王实际上是\
    \ JRR Tolkien 写的三部曲，所以让我们把它们都记录下来。为了实现这一点并区分一本书与另一本书，我们需要将引用单本书的元素分组在一起，以清楚地标记一本书的结束和另一本书的开始。为了分组元素，我们将执行所谓的**嵌套**，这意味着我们将一个或多个元素放在另一个元素内部以创建有意义的分组。\n\
    \n```\n<book>\n    <title>The Fellowship of the Ring</title>\n    <author>J.R.R.\
    \ Tolkien</author>\n    <genre>Fantasy</genre>\n    <published>July 29th, 1954</published>\n\
    </book>\n```\n\n通过这种方式，我们定义了一个 `<book>` 元素。由于这个元素包含了另外四个元素，我们可以称 `<book>` 元素为父元素，而\
    \ `<title>`、`<author>`、`<genre>` 和 `<published>` 为子元素。我们现在可以通过简单地复制标记标签并更改其内容来扩展此文档，使其包含三部曲中的所有书籍。\n\
    \n```\n<book>\n    <title>The Fellowship of the Ring</title>\n    <author>J.R.R.\
    \ Tolkien</author>\n    <genre>Fantasy</genre>\n    <published>July 29th, 1954</published>\n\
    </book>\n<book>\n    <title>The Two Towers</title>\n    <author>J.R.R. Tolkien</author>\n\
    \    <genre>Fantasy</genre>\n    <published>November 11th, 1954</published>\n\
    </book>\n```\n\n```\n<book>\n    <title>The Return of the King</title>\n    <author>J.R.R.\
    \ Tolkien</author>\n    <genre>Fantasy</genre>\n    <published>October 20th, 1955</published>\n\
    </book>\n```\n\n子元素的缩进以及父元素的开始和结束标签分行放置严格是为了可读性。对于能够解释此标记的软件程序来说，将所有内容放在一行中具有完全相同的含义。此外，标记读取应用程序通常会忽略标签之间的所有空格，例如空格、缩进或换行符。该应用程序只是将任意数量的连续空格或制表符解释为单个空格。\n\
    \n```\n<book><title>The Lord of the Rings: The Fellowship of the Ring</title><author>J.R.R.\
    \ Tolkien</author><genre>Fantasy</genre><published>July 29th, 1954</published></book>\n\
    ```\n\n然而，以这种方式编写标记不利于阅读和管理文本，因此建议将每个元素放在新的行中。\n\n> **注意：** 有一种更高级别的标记语言允许我们像在这个示例中一样创建自己的标签。这种语言称为可扩展标记语言（XML）。\n\
    \n## 一些背景知识\n\nHTML 最初被设计为一种标记语言，用于描述网页文档的结构和语义。HTML 的元素和属性应该指示诸如文档标题、文本的哪部分是标题、哪部分是段落、哪些数据属于表格等等。在其最早的形式中，网络旨在传输科学文档，以便研究界能够快速便捷地访问已发表的作品。\n\
    \n> **注意：** *从未有过 HTML 1。第一个官方 HTML 规范是 HTML 2.0。*\n\n当时，许多人看到了不断发展的网络的潜力。这些用户开始为各种不同的目的创建网页，从个人主页到宣传公司产品和服务的大型企业网站。不久之后，网页作者希望控制他们的网站外观，并期望对页面外观的控制水平与平面设计师对其创作的控制水平相同。网络设计师希望能够控制文档中使用的字体和颜色，以及他们的文本在页面上出现的位置。这些需求和愿望催生了所谓的呈现性或样式标记，因为它影响了页面的外观。样式标记并不描述文档的结构和语义，而这正是\
    \ HTML 的初衷。这些规范中的许多功能是由市场领先的浏览器的现有实现驱动的，作为对用户需求的回应。\n\n## **XHTML 的兴衰**\n\n长话短说，HTML\
    \ 语言从版本 2.0 发展到 4.01，此时其最初的结构化文档的目的已完全丧失。负责制定网络标准的万维网联盟（W3C）决定从 HTML 中移除所有样式标记，并使用\
    \ XML 语法完全重写它。这个新的主要修订版被称为 XHTML 1.0。\n\nXHTML 1.0 规范的内容与 HTML 4.01 完全相同；没有添加任何新的元素或属性。事实上，所有的呈现性标签和属性都被移除了，因此\
    \ XHTML 1.0 比其前一版本拥有更少的标签和属性。\n\nXHTML 1.0 和 HTML 4.01 之间唯一的主要区别在于语言的语法。HTML 允许作者在如何构建元素方面完全自由，而\
    \ XHTML 要求作者遵循更严格的 XML 规则，鼓励作者使用单一的写作风格。在此期间，网络设计师接受了网络标准的出现，因此更严格的 XHTML 语法被视为编写标记的“最佳实践”。\n\
    \n> **注意：** XHTML 1.0 的发布恰逢浏览器对 CSS 支持的兴起；因此，很容易将所有的样式标记完全从文档结构中移除。\n\n然后，W3C\
    \ 试图推动 XHTML 走向基于 XML 的未来。他们发布了 XHTML 1.1，并朝向 XHTML 2 发展，这将是一种新的、纯粹的语言，与现有的网络内容或以前版本的\
    \ HTML 都不向后兼容。W3C 开始制定理论上纯粹的标准，与网络设计师和供应商的需求无关，而后者希望强调网络应用程序的创建。这导致了 W3C 内部的分裂，不满意的人成立了自己的组织，即网络超文本应用程序技术工作组（WHATWG）。\n\
    \n从这里开始，故事变得如此复杂和技术化，我们将直接跳过 XHTML 2 从未实现的部分，而是 HTML5 规范成为 HTML 语言新的正式修订版。\n"
