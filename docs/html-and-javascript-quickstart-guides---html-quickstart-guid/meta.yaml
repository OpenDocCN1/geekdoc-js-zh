    \n不知不觉中，我们一直在语句中使用 JavaScript 对象。例如，在所有示例中，我们最常用的语句就是 `document.write()` 语句。事实上，在使用这个语句时，我们实际上一直在访问\
    \ `document` 对象并告诉它执行 `write()` 方法。我们将在下一章中了解更多关于 document 对象的知识。\n\n# 第5章：文档对象模型（DOM）\n\
    \n在上一章中，我们学习了对象的工作原理，甚至查看了 JavaScript 的一些预定义对象。现在我们准备研究最重要的 Web 对象——文档对象。文档对象将主要帮助我们收集关于网页的信息。\n\
    \n文档对象是浏览器为每个新 HTML 页面创建的一个对象。当它被创建时，JavaScript 允许我们访问这个对象的许多属性和方法，这些属性和方法可以以各种方式影响文档，例如管理或更改信息。事实上，我们一直在持续使用这个对象的一个方法\
    \ `document.write()`，以便在网页上显示内容。尽管如此，在探索属性和方法之前，我们将首先了解文档对象模型（DOM）。\n\n# DOM 基本概念\n\
    \n我们知道，当 Web 浏览器接收到一个 HTML 文件时，它会将其显示为屏幕上的一个网页，并附带所有相关的文件，如图像和 CSS 样式。然而，浏览器还会根据其\
    \ HTML 结构为该网页文档创建一个模型。这意味着浏览器会记住所有的标签、它们的属性以及它们出现的顺序。这种表示被称为文档对象模型（DOM），它用于向 JavaScript\
    \ 提供如何与网页元素通信的信息。此外，DOM 提供了可用于浏览或修改 HTML 代码的工具。\n文档对象模型是由万维网联盟（W3C）定义的一个标准，被大多数浏览器开发者使用。为了更好地理解\
    \ DOM，让我们首先看一个非常简单的网页：\n\n```\n<!doctype html>\n<html>\n<head>\n    <meta charset=\"\
    utf-8\">\n    <title>Party Schedule</title>\n    <style type=\"text/css\">\n \
    \       .current {\n            color:red;\n        }\n        .finished {\n \
    \           color:green;\n        }\n    </style>\n</head>\n<body>\n    <h1 id=\"\
    partytitle\">Party Plan</h1>\n    <ul id=\"partyplan\">\n        <li id=\"phase1\"\
    >20:00 - Home warm-up</li>\n        <li id=\"phase2\">22:00 - Joe's Bar</li>\n\
    \        <li id=\"phase3\">00:00 - Nightclub 54</li>\n    </ul>\n</body>\n</html>\n\
    ```\n\n在网页上，标签包裹着其他标签。`<html>` 标签包裹着 `<head>` 和 `<body>` 标签。`<head>` 标签包裹着 `<title>`、`<meta>`\
    \ 和 `<script>` 等标签。`<body>` 标签包裹着所有内容标签，如 `<p>`、`<h1>` 到 `<h6>`、`<ul>`、`<table>`\
    \ 等等。\n\n这种标签之间的关系可以用树状结构来表示，其中 `<html>` 标签作为树的根，而其他标签根据文档内的标签层次结构表示不同的树分支结构。除了标签，Web\
    \ 浏览器还会记住标签的属性以及标签内的文本内容。在 DOM 中，这些项——标签、属性和文本——都被视为单独的单元，称为节点。\n\n**图26. HTML文档的树状结构**\n\
    \n在我们基础 HTML 页面的树状结构中，`<html>` 元素充当根元素，而 `<head>` 和 `<body>` 元素是节点。在定义这种关系时，我们也可以将\
    \ `<html>` 称为父节点，将 `<head>` 和 `<body>` 元素称为子节点。反过来，`<head>` 和 `<body>` 元素都包含子节点，依此类推。当我们到达一个不包含其他子节点的项时，我们就终止了该节点的树结构，该节点也称为叶节点。\n\
    \n# 选择文档元素\n\n有了 DOM 结构，JavaScript 可以通过多种不同的方式访问文档中的元素，具体取决于我们是要选择单个还是多个元素。在所有方法中，我们都必须首先定位代表我们需要访问的元素的节点，然后使用该节点的内容、子元素和属性。\n\
