  md: '# Special Characters


    Not all characters available on the web are available on our keyboards. So what
    happens when we want to add special characters like a copyright symbol (©) or
    a degree (°)? HTML supports all these characters along with about 250 relatives,
    including mathematical symbols and special letters. To add them to our web page,
    we need to use what is known as an HTML character entity. An HTML character entity
    is initiated by the ampersand (&) symbol, followed by a keyword (or ASCII code)
    and concluded with the semicolon (;) symbol. For example, the HTML character code
    for a non-breaking space will be written as &nbsp;.


    Other HTML character entities are presented in the following table:


    | CHARACTER | NAME OF CHARACTER | CODE |

    |---|---|---|

    | < | Left angle bracket | &lt; |

    | > | Right angle bracket | &gt; |

    | & | Ampersand | &amp; |

    | “ | Double quotation mark | &quot; |

    | © | Copyright | &copy; |

    | ® | Registered trademark | &reg; |

    | ¢ | Cent sign | &cent; |

    | £ | Pound sterling | &pound; |

    | € | Euro sign | &euro; |

    | ° | Degree sign | &deg; |

    | ± | Plus or minus | &plusmn; |

    | µ | Micro sign | &micro; |

    | ½ | Fraction one-half | &frac12; |


    Table 2. HTML Character Entities'
  merge: -1
