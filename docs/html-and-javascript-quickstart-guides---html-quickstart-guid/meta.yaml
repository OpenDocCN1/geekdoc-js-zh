    \n## Conclusion (HTML)\n\nThis book covered the fundamental concepts of HTML as\
    \ the language of the web. HTML can be used to create any web page, regardless\
    \ of its complexity.\n\nIn the first chapter we introduced the basic terminology\
    \ and building blocks of the HTML language. We learned about opening tags, closing\
    \ tags and tag attributes. We also elaborated on using markup language to define\
    \ a proper document structure before learning more about the historical development\
    \ of HTML specifications and the birth of today’s HTML5.\n\nThe actual learning\
    \ of HTML and HTML tags began with the second chapter. We became familiar with\
    \ the generic markup structure for an HTML page. This generic structure consists\
    \ of a <head> section, in which all the functionality of the page is defined and\
    \ a <body> section, in which all the actual content appears. Additionally, we\
    \ encountered the most common tags that go into the <head> sections, which are\
    \ <meta> and <title>. Finally, we learned how to help the browser distinguish\
    \ between different HTML versions by defining a document declaration.\n\nNext,\
    \ in chapter three, we learned the most common HTML elements. We learned how to\
    \ place content on a web page and give it structure using the appropriate tags.\
    \ We started from paragraphs and headings, continued on with lists and tables\
    \ and finally dealt with images and links. We also created comments to help us\
    \ improve our coding without affecting the web browser.\n\nIn the final chapter\
    \ we visited the latest semantic tags introduced in HTML5. We started by sectioning\
    \ content with simple <section> and <article> tags before moving on to more specific\
    \ structures like navigation menus and side content. We worked with headers and\
    \ footers, then expanded on the semantics of images with the <figure> and <figcaption>\
    \ tags. Finally, we looked at the capability of different browsers to handle the\
    \ latest HTML5 elements and looked at some alternatives to actual implementation\
    \ by applying JavaScript and CSS.\n\n## Glossary (HTML)\n\n**Accessibility** -\
    \ the ability of people with disabilities to use a website, including the visually\
    \ impaired, hearing impaired, colorblind users, or those with other disabilities.\n\
    \n**Anchor** - the text a link uses to refer to our site.\n\n**Browser** - the\
    \ program that enables a user to view our web site.\n\n**Cascading Style Sheets\
    \ (CSS)** - rules that define a website’s look and feel.\n\n**Comment** - a bit\
    \ of information contained in the HTML code which the browser ignores.\n\n**Conditional\
    \ comment** - a special type of comment visible only to Internet Explorer browsers.\n\
    \n**Deprecated** - code that is no longer included in the language specifications.\n\
    \n**Doctype** - a declaration that specifies which version of HTML is used in\
    \ a web page.\n\n**Element** - the central building block of any HTML document.\n\
    \n**Extensible Markup Language (XML)** - a markup language used for writing custom\
    \ markup languages.\n\n**HTML5 Shiv** - a fully compatible JavaScript code that\
    \ recreates all of the new HTML5 elements for compatibility with older browsers.\n\
    \n**Hypertext Markup Language (HTML)** - the primary language used for writing\
    \ web pages.\n\n**Hypertext** - any computer text that includes hyperlinks.\n\n\
    **Metadata** - the data contained in the head of the web page that offers additional\
    \ information about that web page.\n\n**Non-breaking space** - a white-space character\
    \ that isn't condensed by HTML.\n\n**Script** - a portion of code, most often\
    \ written in JavaScript, that makes the page more dynamic and interactive.\n\n\
    **Semantic markup** - markup that offers context to what the content contains.\n\
    \n**Tag** - a set of markup characters used around an element to indicate where\
    \ it begins and where it ends.\n\n**Web page** - a single document written in\
    \ HTML meant to be viewed in a web browser.\n\n## JavaScript® QuickStart Guide\n\
    \nThe Simplified Beginner’s Guide To JavaScript\n\n**Jump To:**\n\n[HTML QuickStart\
    \ Guide](HTML QuickStart Guide)\n\n## Table of Contents\n\n### Introduction\n\n\
    - What is JavaScript?\n- The Birth and Growth of JavaScript\n- Implementing JavaScript\n\
    \n### Chapter 1: Fundamental JavaScript Concepts\n\n- Syntax\n- Statements\n-\
    \ Variables\n- Variable Types\n- User Variables\n- Operators\n- Mathematical Operators\n\
    - Assignment Operators\n- Comparison Operators\n- Logical Operators\n- Arrays\n\
    - Working With Array Items\n- Managing Array Elements\n- Comments\n\n### Chapter\
    \ 2: Conditional & Loop Statements\n\n- Conditional Statements\n- Alternative\
    \ Conditions\n- Multiple Conditions\n- Loop Statements\n- While Loops\n- For Loops\n\
    - Loops and Arrays\n\n### Chapter 3: Functions\n\n- Creating Functions"
  mdcn: "\n## 验证网站的HTML5合规性\n\n要验证网站对HTML5的支持程度，我们可以使用HTML5验证工具。虽然有许多在线工具可用，但最符合最新HTML5规范的是W3C标记验证服务，其网址为\
    \ http://validator.w3.org。W3C标记验证服务使我们能够针对非英语字符编码类型甚至更早的标记语言（如HTML 4.01、3.2和2.0版本、各种XHTML标准、MathML、可缩放矢量图形（SVG）和同步多媒体集成语言（SMIL））来验证网站。\n\
    \n使用W3C标记验证服务，需要被测试的网页必须已发布在线。使用此工具时，我们提交网页的URL地址，工具会下载该网站的HTML源代码，自动检测编码和文档类型，并分析页面的合规性。记录的违规行为被分类为错误和警告，并按严重程度评级。该工具甚至提供对所指出问题的解释和可能的解决方案。\n\
    \n即使一个HTML5网页未通过验证，它仍可能在网页浏览器中正确渲染。这是因为HTML5规范指出网页开发者必须避免使用已废弃的标签，但网页浏览器可能会支持它们。这是维护与早期HTML版本及未更新到最新标准的网页的向后兼容性的关键要求。\n\
    \n经过上述所有调整，我们的示例简历现在应具有以下HTML结构：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <meta charset=\"utf-8\">\n    <title>Curriculum Vitae</title>\n    <!--[if\
    \ lt IE 9]>\n    <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n    <![endif]-->\n</head>\n<body>\n<article>\n<header>\n    <h1>Curriculum\
    \ Vitae</h1>\n    <figure>\n    <img src=\"images\\cv_picture.jpg\" alt=\"Scott\
