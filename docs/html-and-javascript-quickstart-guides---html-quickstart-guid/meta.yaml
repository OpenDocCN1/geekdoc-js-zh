  md: "# # Unordered Lists\n\nUnordered lists are very similar to ordered lists but\
    \ with bullets rather than numbers to precede the list items. They are the most\
    \ widely used lists on the web for a series of items that requires no particular\
    \ order. For unordered lists, we use the `<ul>` element as a substitute for the\
    \ `<ol>` element, but each item on the list will remain defined by the `<li>`\
    \ element.\n\nAs an example let’s use an unordered list to present the Education\
    \ section in our sample CV:\n\n```\n<ul>\n    <li>PhD in Computer Science at MIT</li>\n\
    \    <li>Bachelor of Computer Science at MIT</li>\n    <li>Santa Rosa High School</li>\n\
    </ul>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_46_0.png)\n\n**Image 7.\
    \ Unordered List for Education Section**\n\nThe unordered list has no attributes\
    \ that are supported by HTML5."
