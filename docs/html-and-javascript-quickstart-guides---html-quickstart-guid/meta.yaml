    ```\n\n![](img/f8023be36714e65595b822db3c227be4_185_0.png)\n\nUsing a similar\
    \ process we can also use DOM manipulation to remove an element from the page.\
    \ As an example let us remove the `<h1>` element which acts as the main page heading.\
    \ We will first select the element through its id attribute with “partytitle”\
