  md: "# Creating Objects\n\nThere are two approaches to creating objects in JavaScript,\
    \ we can either use an object constructor function or literal notation. Let us\
    \ start with an object constructor example.\n\n```\nvar car = new Object();\n\
    ```\n\nThe first part of this statement is familiar, we use the `var` keyword\
    \ to define a car variable. As we want to define the variable as an object we\
    \ use the new operator followed by the `Object()` constructor. This will instruct\
    \ JavaScript to create an empty object and assign it the name car.\n\nOnce the\
    \ empty object has been created we can start defining its properties. Each property\
    \ will have a name and a value, with each name/value pair describing a particular\
    \ instance of the object. For our car object we can assign the properties `color`\
    \ , `make` and `model` .\n\n```\nvar car = new Object();\ncar.color = \"red\"\
    ;\ncar.make = \"Ford\";\ncar.model = \"Mustang\";\n```\n\nWe can notice that when\
    \ defining properties we use the object name, followed by a dot, followed by the\
    \ property name. This is known as dot syntax, where the dot is what connects the\
    \ property (or method) to the object.\n\nTo define a method for the object, we\
    \ need to create a function that will become a part of the object. To begin, let\
    \ us create a simple method that will display a notification that the car has\
    \ been turned on.\n\n```\ncar.startCar = function () {\n    document.write(\"\
    The engine has started.<br>\");\n}\n```\n\nAs we are familiar with functions we\
    \ can see that the `startCar` method is created with the `function` keyword, followed\
    \ by a series of statements placed within curly braces. Since this code only creates\
    \ the method, in order to see this method in action we have to call it in the\
    \ script using the object name.\n\n```\ncar.startCar();\n```"
