- md: '# Mathematical Operators


    The basic mathematical operators like addition (+), subtraction (-), multiplication
    (*) and division (/) are readily available in JavaScript. They can be used in
    independent statements or used when declaring variables. For example, by "operating"
    with the variables `currentYear` and `yearofBirth`, we can determine the value
    of the variable `age`.


    ```javascript

    var currentYear = 2015;

    var yearofBirth = 1979;

    var age = currentYear - yearofBirth;

    document.write(age);

    ```


    ![](img/f8023be36714e65595b822db3c227be4_119_0.png)


    **Image 4. Using variables to calculate age**


    > *Note: "Calling" a variable to be presented on a web page is easy. Simply use
    the `document.write()` command.*


    Mathematical operators, specifically the addition operator, can be used to combine
    two or more strings. This process of combining strings is called concatenation.
    In the following example:


    ```javascript

    var firstName = "Martwan";

    var lastName = "Jenkins";

    var fullName = firstName + lastName;

    document.write(fullName);

    ```


    ![](img/f8023be36714e65595b822db3c227be4_120_0.png)


    The value for `fullName` will end up being `MartwanJenkins`. To make sure that
    everything is in its proper form we need to include the empty space as a string
    in quotation marks. For example, we can use the following declaration:


    ```javascript

    var fullName = firstName + " " + lastName;

    ```


    ![](img/f8023be36714e65595b822db3c227be4_121_0.png)


    **Image 6. Concatenating strings with spaces**


    We can see that operators are also useful when we want to join text and/or combine
    variables. As a matter of fact, we can use this to construct more logical sentences.
    For example, we can combine the "My name is" text with a value from a calculated
    variable.


    ```javascript

    var firstName = "Martwan";

    var lastName = "Jenkins";

    var fullName = firstName + " " + lastName;

    document.write("My name is " + fullName);

    ```


    ![](img/f8023be36714e65595b822db3c227be4_122_0.png)


    **Image 7. Concatenating a full sentence**


    > **Note:** When performing several mathematical operations in one statement,
    the rules of precedence apply.


    # Assignment Operators


    Just like things change in real life, so do variables within a JavaScript program.
    And to change variables within JavaScript we will use assignment operators. We
    are already familiar with the fundamental assignment operator, the equal sign
    (=), which is used to give an initial or a new value to a variable. There are
    other assignment operators that also change the value of a variable, but they
    do this in a slightly different way.


    For example, as the year passes we grow older and our age incrementally changes
    by one. To make this change in JavaScript there are several different approaches
    we can take, all with the same results. To play around with the possibilities
    of changing variables, we can try the following code where after the age variable
    changes its value is displayed in the browser:


    ```javascript

    var age = 35;

    document.write("<p>My age is \"" + age + "\"</p>");

    age = age + 1;

    document.write("<p>A year has passed, so now I am \"" + age + "\"</p>");

    age += 10;

    document.write("<p>What? Are you telling me that I am a grandad now? But I am
    only \"" + age + "\"</p>");

    ```


    ![](img/f8023be36714e65595b822db3c227be4_123_0.png)


    Image 8. Changing variables with assignment operators


    While at first these operations might appear slightly confusing, they are still
    logical if viewed from the programming angle. For example, if we read the statement
    `age=age+1` backwards what happens is that the value of 1 is added to the current
    age of 35 which would make 36 the new value of `age`. Additionally, we can use
    a complex assignment operator such as `+=` in the statement `age+=10`, to increase
    the value of the variable by 10. We can also use the same logic to other operations
    like subtraction, division and multiplication.


    ```javascript

    age -= 5;    is the same as    age = age - 5;

    age *= 5;    is the same as    age = age * 5;

    age /= 5;    is the same as    age = age / 5;

    ```


    Additionally, when we want to increase/decrease the value of the variable by 1,
    we can also use the following assignment operators:


    ```javascript

    age++;     is the same as    age = age + 1;

    age--;     is the same as    age = age - 1;

    ```


    # Comparison Operators


    Like the name suggests, comparison operators are used to compare two values. After
    the comparison is made a value of either true or false is returned depending on
    whether the comparison was exact or not. Comparison operators are mostly used
    when evaluating conditions in loops or conditional statements, discussed in the
    next chapter.


    The following table summarizes the most common comparison operators.


    | OPERATOR | MEANING                 | EXAMPLE | RETURN VALUE |

    | -------- | ----------------------- | ------- | ------------ |

    | ==       | equal to                | 4 == 4  | True         |

    | >        | greater than            | 3 > 4   | False        |

    | <        | less than               | 3 < 4   | True         |

    | >=       | greater than or equal to| 4 >= 4  | True         |

    | <=       | less than or equal to   | 4 <= 5  | True         |

    | !=       | not equal to            | 3 != 4  | True         |


    Table 1. Comparison operators


    # Logical Operators


    Logical operators allow us to compare two or more conditional statements. The
    comparison lets us determine which statement is true so we can proceed accordingly.
    Just like comparison operators, logical operators return a value of either true
    or false, depending on the values on either side of the operator. The three most
    common logical operators are AND, OR and NOT.


    The AND operator is represented by the `&&` code. Only when statements on both
    sides of the `&&` operator are true, the operator returns a true value. If one
    or both statements are false, the operator returns a false value. This is in agreement
    with the rules of common language, for example, the statement "*This jacket has
    all the American colors, red, white and blue*", is only true if the jacket has
    red (true), white (true) and blue (true). If only one of those colors is different
    (false), then the statement would also be false. In JavaScript syntax, this would
    look something like the following:


    ```javascript

    (color1 == "red" && color2 == "white" && color3 == "blue")

    ```


    The OR operator is represented by the `||` code. It returns a true value if statement
    on one or both sides of the operator are true. Only if both statements are false,
    the operator would return a false value. For example, the statement "*My brother
    will either go to Brazil or Thailand for his summer holiday*" would be true if
    my brother visited one (or maybe both) of those places.


    ```javascript

    (destination1 == "Brazil" || destination2 == "Thailand")

    ```


    The NOT operator, represented by the `!` code, is used to "claim" that the opposite
    statement is true. So, the operator will return a true value for any other condition
    than what is explicitly stated. For example, the statement "*Brian does not weigh
    200 pounds*" is true for any other value of weight except 200.


    ```javascript

    !(weight == 200)

    ```


    We will learn the more practical aspects of logical operators in the next chapter
    where we focus on conditional statements and loops.


    # Arrays


    The variables we examined up until this point can remember only a single piece
    of information at a time. However, more than often we need to keep track of multiple
    values like the months of the year or a shopping list. In such a case, JavaScript
    provides a nice way to remember multiple values under one variable, called array.
    Let us start by defining an array variable that will hold the first six months
    of the year.


    ```javascript

    var months = ["January", "February", "March", "April", "May", "June"];

    ```


    When declaring an array variable we first use the `var` keyword followed by the
    name of the variable just like with regular variables. As the array contains multiple
    items, we will provide a value for each item between opening and closing square
    brackets, `[]`. Like with normal variables if the value of the item is a string
    we will place it within quotation marks. Otherwise, if the value is a number or
    possibly another variable we will not use any quotation characters. As an example,
    we can declare the following array of random items:


    ```javascript

    var randomItems = ["ball", -0.5, "black pony", 333, true];

    ```


    It is also possible to define an empty array. We will use the same syntax, but
    leave out the values for any item.


    ```javascript

    var hole = [];

    ```'
