    # Conclusion (JavaScript)


    When we decide to learn something as complicated as JavaScript, there is a long
    process ahead of us. It is not sufficient to get acquainted with information,
    we have to apply that information in practical situations and real-life examples.


    In this book we introduced the fundamental concepts of JavaScript and its approach
    to programming. We learned that JavaScript is a scripting language that enables
    us to enhance web pages by providing dynamic and interactive content. We looked
    into the process the browser follows when interpreting web pages as it parses
    the code element by element and acts on JavaScript instructions. We saw that JavaScript
    code is embedded into the web page itself; its presence marked with the `<script>`
    elements.


    Starting from the basic syntax and statement structure, in the second chapter
    we built up our knowledge with JavaScript’s data types and variables. Particularly,
    we now know that JavaScript supports a number of types of data, such as numbers,
    text, and booleans. Numbers behave like numbers should, text is represented by
    strings of characters and is surrounded by quotation marks and booleans are either
    true or false. These data types are stored in variables, making their values committed
    to memory so that they can be used later in our code. However, before giving value
    to a variable we are now aware that we first must declare its existence to the
    JavaScript interpreter. We also familiarized ourselves with arrays as a special
    type of variable that can hold more than one piece of data which is managed by
    means of a unique index number.


    In the third chapter we continued to learn the core of the JavaScript language
    and its syntax. Specifically, we looked into decision making with conditional
    statements and repetitive code use with loops. We started by understanding `if`,
    `else` and `else if` statements as the ability to make decisions is essentially
    what gives the code its “intelligence”. Determining whether a condition is true
    or false can help us decide on a course of action to follow and in using the statements
    we can choose the block of code that will be executed respectively. Following,
    we looped the code with while and for loops as it is often necessary to repeat
    a block of code a number of times. We learned that looping requires initialization,
    condition testing, and incrementation in order to successfully execute blocks
    of code a specified number of times.


    We finished looking at the JavaScript core scripting capabilities in the fourth
    chapter by observing functions as reusable bits of code. Although there are main
    built-in functions available, JavaScript enables us to define and use your own
    functions using the function keyword. We saw that functions can have zero or more
    parameters passed to them and can return a value if that is their intended purpose.
    In relation to functions, we learned about variable scope, where variables declared
    outside a function are available globally while variables defined inside a function
    are private to that function and can’t be accessed by the main code.


    In chapter five we moved on to the vital concept of objects. We learned that JavaScript
    is an object-based language as it represents things, such as strings, dates, and
    arrays using this object concept. We created new objects with the object constructor
    function or literal'
  - '[PAGE 199]


    notation. We also set the properties of those objects and we defined their methods.
    We also learned how to access these properties and call these methods when needed.


    We examined the document object model in chapter six where we saw how the DOM
    offers means to access web page elements. We learned that the DOM represents the
    HTML document as a tree structure. We then learned how this tree structure makes
    it possible to navigate through its “branches” to different elements to use their
    properties and methods. We saw how we can select individual elements and groups
    of elements by locating element nodes. We then manipulated the content by either
    adding new elements or changing the existing structure.


    We now have the basic knowledge and understanding to move on to learning more
    advanced concepts. There are many directions we can take as JavaScript offers
    a vast amount of directions we can take. We can focus on form interaction and
    see how we can use JavaScript to evaluate and interact with form data. To do this
    we also need to learn about serialization to translate the structure and information
    of the object. We can then personalize the user experience by learning how to
    store information on local computers with cookies.


    We can push things even further with AJAX, creating uninterrupted applications
    that don’t require page refreshing for server communication. We can explore JavaScript
    frameworks such as jQuery or Modernizr to see how we can take JavaScript to its
    limit and easily create sophisticated high-class applications. Finally, we can
    learn how to create the perfect code with advanced error handling and using sophisticated
    debugging tools.


