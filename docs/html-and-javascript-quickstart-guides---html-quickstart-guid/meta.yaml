    \ between parentheses, which in our case is age<18 . If the condition is true,\
    \ the JavaScript interpreter will run the code that appears between the braces.\
    \ Unlike a conditional statement, when the closing brace of the while statement\
    \ is reached, JavaScript does not continue with the rest of the program, but instead\
    \ it initiates the while statement again. As long as the number stored in the\
    \ age variable is less than 18, the script will run the document.write() command.\n\
    \nOnly when the condition is false, the interpreter will ‘exit’ the loop and continue\
    \ parsing the rest of the code. This makes the last line of the while loop very\
    \ important. It not only changes the value of the condition variable, but it also\
    \ makes it possible for the test condition to eventually be false. Without this\
    \ possibility, we will ‘lock’ the interpreter into performing the same task over\
    \ and over again... forever. This is known as an infinite loop, which is essentially\
    \ a loop that never completes. An infinite loop will run either until it crashes\
    \ the computer or it receives a timeout from a modern interpreter after a certain\
    \ period of time."
  - "[PAGE 143]\n\n# For Loops\n\nIn JavaScript there is a second option for creating\
    \ a loop statement which is more compact and slightly more confusing. For loops\
    \ can achieve the same thing as a while loop with fewer lines of code, but a code\
    \ that is a bit unintuitive for the novice programmer. In a for loop, the variable\
    \ declaration, the condition and the changing value of the variable is all done\
    \ at the same time. As an example let us write the previous age-growing while\
    \ loop with a for loop syntax.\n\n```\nfor (var age = 1; age < 18; age++) {\n\
    \    document.write(“Another year has passed. You are now “+age+” years old.<br>”);\n\
    }\n\ndocument.write(age+”? Congratulations! You are now an adult.”);\n```\n\n\
    ![](img/f8023be36714e65595b822db3c227be4_143_0.png)\n\nAs evident from the image,\
    \ the resulting content is exactly the same in both cases. Each loop begins with\
    \ the for keyword. This is the followed by a set of parentheses that contains\
    \ three parts."
  - '[PAGE 144]


    1) The first part, which is applied only once at the beginning of the statement,
    declares the condition variable, age , and sets its initial value to 1. The initial
    value is used as a starting point for the number of times the loop will repeat
    and can be any number. If this variable had been initialized earlier in the script,
    the var keyword would have been unnecessary.


    2) The second part is the condition itself, which is evaluated every time before
    the loop is executed. As long as the condition is true, the for statement will
    keep repeating the code. When the condition is false, the loop will be instructed
    to stop running which in our example is when the age variable becomes greater
    than or equal to 18.


    3) Finally, the third part determines the rate at which the condition variable
    is changed. In our example the condition variable increases by one after each
    cycle, but this is not mandatory. The condition variable can get larger or smaller
    and can increase/decrease by any amount we set.


    To finish the structure of the for loop we have curly brackets that enclose the
    code that we want to use within the loop, which in our example is to write a line
    of text on the web page with document.write() .'
  - "[PAGE 145]\n\n# Loops and Arrays\n\nLoop statement are very useful when we want\
    \ do handle array variables. In JavaScript, we can use loops to cycle through\
    \ array items, and when necessary, perform an action on each item.\n\nEarlier\
    \ in this book we created an array, called months , that contained the twelve\
    \ months of the year.\n\n```\nvar months = [“Jan”, “Feb”, “Mar”, “Apr”, “May”,\
    \ “Jun”, “Jul”, “Aug”, “Sep”, “Oct”, “Nov”, “Dec”];\n```\n\nUsing either a while\
    \ or a for loop we will go through each item in the array and print it to the\
    \ page. We will access the array items by using their index and we will subsequently\
    \ increase the index value in each loop cycle. If we use a while statement we\
    \ will have the following code:\n\n```\nvar counter = 0;\nwhile (counter < months.length)\
    \ {\n    document.write(months[counter] + ” “);\n    counter++;\n}\n```\n\nWe\
    \ initiate a counter variable that has the same starting value as the index of\
    \ the first array item, which is 0. Following, we begin a while loop that runs\
    \ until the counter value is less than the length of the array. The condition,\
    \ counter < months.length inquires whether the current value of the counter variable\
    \ is lower than the number of array items by comparing it to the array’s length\
    \ property. Each time the while loop runs we print the value of a single array\
    \ item and we subsequently increase the value of the counter variable by 1.\n\n\
    If we want to perform the same action with a for loop we can use the following\
    \ code:\n\n```\nvar months = [“Jan”, “Feb”, “Mar”, “Apr”, “May”, “Jun”, “Jul”,\
    \ “Aug”, “Sep”, “Oct”, “Nov”, “Dec”];\nfor (var counter = 0; counter < months.length;\
    \ counter++) {\n    document.write(months[counter] + ” “);\n}\n```"
- md: "## Chapter 3: Functions\n\nBy now we have seen that when writing JavaScript\
    \ code we are actually writing detailed instructions for what we want to happen\
    \ one step at a time. In real life, we need detailed instructions only for the\
    \ first time we perform the action. Afterwards we familiarize ourselves with the\
    \ steps and do the actions automatically. For example, let us go back to the first\
    \ time we used a touchscreen smartphone. To turn on the phone we had to perform\
    \ two unknown actions: click a button to initiate the screen and swipe across\
    \ the screen to unlock the phone. For each subsequent time we wanted to turn our\
    \ phone on, we didn't need these instructions; we had already committed them to\
    \ memory.\n\nJavaScript has a similar mechanism that memorizes steps of a frequently\
    \ used action, and this mechanism is called a function. A function is a series\
    \ of steps we create in the beginning of our script in order to use it whenever\
    \ we need those steps performed. We write the code only once and we run it any\
    \ time we desire.\n\nThis chapter will explain the fundamentals behind using functions.\
    \ We will learn what a function is, how to define and structure functions, and\
    \ how to call functions in our scripts.\n\n### Creating Functions\n\nThe main\
    \ purpose of a function is to perform a series of actions through a single command.\
    \ The actual task that the function will perform is dependent on the code itself.\
    \ It can be something simple as writing a single line of text in the browser,\
    \ to complex calculations such as evaluation the final price of a shopping basket\
    \ including discounts and shipping methods. Except for making our scripts more\
    \ portable, functions are useful because they are reusable. Rather than rewriting\
    \ blocks of code, we can use the function as many times as necessary. This becomes\
    \ especially helpful when the functions are lengthy and perform complex tasks.\n\
    \nTo define a basic function in JavaScript it is necessary to declare it with\
    \ its name and code. When choosing a name for a function it would be preferable\
    \ if we select a name that reflects its purpose. Basically, the name of the function\
    \ should indicate what the function does.\n\nFor our initial example we will use\
    \ the keyword function followed by the function name writeText and a set of parentheses\
    \ to declare a function:\n\n```javascript\nfunction writeText() {\n    document.write(\"\
    The answer is 42.\");\n}\n```\n\nBy using the keyword function we inform the interpreter\
    \ that what follows is a series of steps that need to be remembered. The steps\
    \ are listed between two curly braces, which mark the beginning and the end of\
    \ the JavaScript code that is a part of the function. In the example above, the\
    \ steps will be remembered as the name of the function, which is writeText. Hence,\
    \ whenever we want to initiate this sequence of steps it will be sufficient to\
    \ only write out the function name followed by empty parentheses. This is also\
    \ known as calling a function.\n\n```javascript\nwriteText();\n```\n\nIn this\
    \ basic example, every time we call the function within the main script the text\
    \ “The answer is 42.” will be written on the web page. For a more precise and\
    \ functional example, let us modify a previous script and create a function that\
    \ will check the age of the user.\n\n```javascript\nfunction checkAge() {\n  \
    \  if (age >= 18) {\n        document.write(\"You have reached the age of wisdom,\
    \ please enter and have some fun.\");\n    }\n    else {\n        document.write(\"\
    Please come back in a few years.\");\n    }\n}\n```\n\nThe JavaScript code that\
    \ is placed in a function is stored in the browser’s memory, waiting for us to\
    \ call the function whenever we need to perform that specific action. In this\
    \ example, the function checks how the age variable relates to the value of 18.\
    \ Like mentioned previously, to call the function we will simply need to write\
    \ out the name of the function, followed by a pair of parentheses. We will also\
    \ add a prompt() which asks the user to provide the value for his/her age.\n\n\
    ```javascript\nvar age = prompt(\"How old are you?\");\ncheckAge();\n```\n\nThe\
    \ complete script would be:\n\n```javascript\nfunction checkAge() {\n    if (age\
    \ >= 18) {\n        document.write(\"You have reached the age of wisdom, please\
    \ enter and have some fun.\");\n    }\n    else {\n        document.write(\"Please\
    \ come back in a few years.\");\n    }\n}\nvar age = prompt(\"How old are you?\"\
    );\ncheckAge();\n```\n\nImage 16. Implementing a function to check the users’\
    \ age\n\nAdditionally, we can use what we learned in previous chapters and make\
    \ this function more intelligent. Instead of just receiving the answer “Please\
    \ come back in a few years.”, we can calculate the actual difference between 18\
    \ and the age entered by the user. To do this we will first introduce a variable\
    \ named difference in the function, than calculate that difference as 18-age if\
    \ the entered value for age is less than 18, and finally print the difference\
    \ variable along with the text.\n\n```javascript\nfunction checkAge() {\n    var\
    \ difference;\n    if (age >= 18) {\n        document.write(\"You have reached\
    \ the age of wisdom, please enter and have some fun.\");\n    }\n    else {\n\
    \        difference = 18 - age;\n        document.write(\"Please come back in\
    \ \"+difference+\" years.\");\n    }\n}\nvar age = prompt(\"How old are you?\"\
    ,\"\");\ncheckAge();\n```\n\nImage 17. Smart check age\n\n### Sending Information\
    \ to Functions\n\nWe can send one or more values to the function, thus increasing\
    \ its versatility. When we send these values, the function is capable of processing\
    \ this information before it comes back with an answer. The values we send are\
    \ also known as arguments, while the process of sending information to a function\
    \ is called ‘passing an argument’. Once the argument is received the function\
    \ will use this data while carrying out the sequence of actions as specified in\
    \ the code.\n\nThe basic syntax would look like the following:\n\n```javascript\n\
    function functionName(argument) {\n    //JavaScript code\n}\n```\n\nArguments\
    \ are set on the first line of the function inside the set of parentheses, which\
    \ we previously left blank. The values brought in as arguments automatically become\
    \ declared variables within the function. These variables use the names given\
    \ inside the parentheses and do not need to be further declared with the var keyword.\n\
    \nAs the most basic example, let us create a function that will shorten the syntax\
    \ of the document.write() command.\n\n```javascript\nfunction print(message) {\n\
    \    document.write(message);\n}\nprint(\"<p>What are you doing? document.write\
    \ is a perfect command.</p>\");\nprint(\"<p>42 is the answer, but what is the\
    \ question?</p>\");\n```\n\nImage 18. Substituting the document.write command\
    \ with an argument function\n\nThis function, named print(), can accept one argument.\
    \ When the function is called, this argument is passed on to the function and\
    \ is stored as a variable named message. When the document.write() command is\
    \ initiated within the function it writes the contents of the message variable\
    \ on the page.\n\nAs mentioned previously, functions are not limited to processing\
    \ single arguments. We can pass as many arguments to the function as needed as\
    \ long as each argument is specified in the function and the function is called\
    \ with the same number of arguments in the same order.\n\nAs an example let’s\
    \ revisit the checkAge() function and try to make it more versatile. We will provide\
    \ the variables name and years to the function and have it respond with a personalized\
    \ message.\n\n```javascript\nfunction checkAge(name, years) {\n    if (years <\
    \ 18) {\n        document.write(name+\" you are too young to enter.<br>\");\n\
    \    }\n    else {\n        document.write(name+\" you are above 18. Please come\
    \ in.<br>\");\n    }\n}\n```\n\n```javascript\ncheckAge(\"Jack\", 80);\ncheckAge(\"\
    Alicia\", 8);\ncheckAge(\"Simonetta\", 15);\ncheckAge(\"Geronimo\", 30);\n```\n\
    \nImage 19. Checking the age for multiple user with a single function\n\nIn the\
    \ example above, we initiate the checkAge() function several times, each time\
    \ with two different values, one for name and another for age. Whenever we call\
    \ the function, both values are passed to the function as arguments. The first\
    \ argument is stored as the name variable and the second value is stored as the\
    \ years variable. Following, the years variable is used in a conditional statement\
    \ to evaluate whether it is less than or greater than 18. Correspondingly, the\
    \ name variable is used in the personalized message displayed through the document.write()\
    \ command. We end each personalized message with a `<br>` tag in order to have\
    \ the messages displayed in a separate line.\n\n> *Note: You can send any type\
    \ of JavaScript variable or value to a function: string, number, boolean, array,\
    \ etc.*"
  mdcn: "\n## 第三章：函数\n\n至此我们已经了解到，编写 JavaScript 代码实际上就是在编写详细的指令，这些指令将一步步指引计算机完成我们想要执行的操作。在现实生活中，我们通常只需要在第一次执行某项操作时遵循详细指令。随后，我们便熟悉了步骤并能自动完成操作。例如，让我们回想第一次使用触屏智能手机的情景。要开启手机，我们需要执行两个陌生的操作：点击一个按钮点亮屏幕，然后滑动屏幕解锁手机。此后每次想要开机时，我们都不再需要这些指令；因为我们已经记住了它们。\n\
    \nJavaScript 也有一种类似的机制，用于记忆常用操作的步骤，这种机制被称为**函数**。函数是我们预先在脚本中创建的一系列步骤，以便在需要时随时调用。我们只需编写一次代码，就可以在任何时候运行它。\n\
    \n本章将介绍使用函数的基础知识。我们将学习什么是函数、如何定义和构造函数，以及如何在脚本中调用函数。\n\n### 创建函数\n\n函数的主要目的是通过单一命令执行一系列操作。函数将执行的实际任务取决于其自身的代码。它可能像在浏览器中写入一行文本那样简单，也可能涉及复杂的计算，例如计算购物车最终价格（包含折扣和运费）。除了使脚本更具可移植性外，函数之所以实用，还在于它们的可复用性。我们无需重写代码块，只需在必要时多次调用函数即可。当函数较长且执行复杂任务时，这一点尤其有用。\n\
    \n要在 JavaScript 中定义一个基本函数，需要用名称和代码对其进行声明。为函数选择名称时，最好选择一个能反映其用途的名称。基本上，函数名称应该表明该函数的功能。\n\
    \n在我们的初始示例中，我们将使用关键字 `function`，后跟函数名 `writeText` 和一对圆括号来声明一个函数：\n\n```javascript\n\
    function writeText() {\n    document.write(\"The answer is 42.\");\n}\n```\n\n\
    通过使用关键字 `function`，我们告知解释器，后续代码是一系列需要记忆的步骤。这些步骤列在两个花括号之间，它们标志着属于该函数的 JavaScript\
    \ 代码的开始和结束。在上面的例子中，这些步骤将以函数的名称 `writeText` 被记忆。因此，每当我们要启动这一系列步骤时，只需写出函数名后跟空圆括号即可。这也被称为调用函数。\n\
    \n```javascript\nwriteText();\n```\n\n在这个基本示例中，每当我们在主脚本中调用该函数时，文本“The answer is\
    \ 42.”就会被写入网页。为了给出一个更精确和实用的例子，让我们修改之前的脚本，创建一个检查用户年龄的函数。\n\n```javascript\nfunction\
    \ checkAge() {\n    if (age >= 18) {\n        document.write(\"You have reached\
    \ the age of wisdom, please enter and have some fun.\");\n    }\n    else {\n\
    \        document.write(\"Please come back in a few years.\");\n    }\n}\n```\n\
    \n放在函数中的 JavaScript 代码会存储在浏览器的内存中，等待我们在需要执行特定操作时调用该函数。在这个例子中，函数会检查 `age` 变量与 18\
    \ 这个值的关系。如前所述，要调用该函数，我们只需写出函数名，后跟一对圆括号。我们还将添加一个 `prompt()`，要求用户输入其年龄值。\n\n```javascript\n\
    var age = prompt(\"How old are you?\");\ncheckAge();\n```\n\n完整的脚本如下：\n\n```javascript\n\
    function checkAge() {\n    if (age >= 18) {\n        document.write(\"You have\
    \ reached the age of wisdom, please enter and have some fun.\");\n    }\n    else\
    \ {\n        document.write(\"Please come back in a few years.\");\n    }\n}\n\
    var age = prompt(\"How old are you?\");\ncheckAge();\n```\n\n图片 16. 实现一个检查用户年龄的函数\n\
    \n此外，我们可以利用前面章节学到的知识，使这个函数更加智能。与其仅仅收到“Please come back in a few years.”这样的回复，我们可以计算出\
    \ 18 与用户输入年龄之间的实际差值。为此，我们将在函数中引入一个名为 `difference` 的变量，然后如果输入的年龄值小于 18，则计算差值为 `18\
    \ - age`，最后将 `difference` 变量与文本一起打印出来。\n\n```javascript\nfunction checkAge() {\n\
    \    var difference;\n    if (age >= 18) {\n        document.write(\"You have\
    \ reached the age of wisdom, please enter and have some fun.\");\n    }\n    else\
    \ {\n        difference = 18 - age;\n        document.write(\"Please come back\
    \ in \"+difference+\" years.\");\n    }\n}\nvar age = prompt(\"How old are you?\"\
    ,\"\");\ncheckAge();\n```\n\n图片 17. 智能年龄检查\n\n### 向函数发送信息\n\n我们可以向函数发送一个或多个值，从而增强其通用性。当我们发送这些值时，函数能够在返回答案之前处理这些信息。我们发送的值也称为**参数**，而向函数发送信息的过程称为“传递参数”。一旦接收到参数，函数将在执行代码中指定的操作序列时使用这些数据。\n\
    \n基本语法如下所示：\n\n```javascript\nfunction functionName(argument) {\n    //JavaScript\
    \ code\n}\n```\n\n参数设置在函数的第一行，即我们之前留空的那对圆括号内。作为参数传入的值会自动成为函数内声明的变量。这些变量使用圆括号内给出的名称，无需再用\
    \ `var` 关键字进一步声明。\n\n作为最基本的示例，让我们创建一个函数，用于简化 `document.write()` 命令的语法。\n\n```javascript\n\
    function print(message) {\n    document.write(message);\n}\nprint(\"<p>What are\
    \ you doing? document.write is a perfect command.</p>\");\nprint(\"<p>42 is the\
    \ answer, but what is the question?</p>\");\n```\n\n图片 18. 用带参数的函数替代 document.write\
    \ 命令\n\n这个名为 `print()` 的函数可以接受一个参数。当函数被调用时，这个参数被传递给函数，并存储为名为 `message` 的变量。当函数内部的\
    \ `document.write()` 命令启动时，它会将 `message` 变量的内容写入页面。\n\n如前所述，函数不限于处理单个参数。只要每个参数在函数中被指定，并且函数在调用时传入了相同数量且顺序相同的参数，我们就可以根据需要向函数传递任意多个参数。\n\
    \n例如，让我们重新审视 `checkAge()` 函数，并尝试使其更加通用。我们将向函数提供 `name` 和 `years` 变量，并让它返回个性化的消息。\n\
    \n```javascript\nfunction checkAge(name, years) {\n    if (years < 18) {\n   \
    \     document.write(name+\" you are too young to enter.<br>\");\n    }\n    else\
    \ {\n        document.write(name+\" you are above 18. Please come in.<br>\");\n\
    \    }\n}\n```\n\n```javascript\ncheckAge(\"Jack\", 80);\ncheckAge(\"Alicia\"\
    , 8);\ncheckAge(\"Simonetta\", 15);\ncheckAge(\"Geronimo\", 30);\n```\n\n图片 19.\
    \ 使用单个函数检查多个用户的年龄\n\n在上面的例子中，我们多次调用 `checkAge()` 函数，每次传递两个不同的值，一个用于 `name`，另一个用于\
    \ `age`（在函数参数中对应 `years`）。每次调用函数时，这两个值都作为参数传递给函数。第一个参数存储为 `name` 变量，第二个值存储为 `years`\
    \ 变量。随后，`years` 变量在一个条件语句中用于评估其是小于 18 还是大于 18。相应地，`name` 变量用于通过 `document.write()`\
    \ 命令显示的个性化消息中。我们每条个性化消息都以 `<br>` 标签结尾，以便让消息在单独的行中显示。\n\n> *注意：你可以向函数发送任何类型的 JavaScript\
    \ 变量或值：字符串、数字、布尔值、数组等。*\n"
