- md: "## Retrieving Information from Functions\n\nNow that we have seen how to send\
    \ information we can “push” functions even further and get information back from\
    \ them. To retrieve a value from the function to the main script we can use the\
    \ return statement. The generic syntax would look like the following:\n\n```\n\
    function functionName(argument1, argument2) {\n    // JavaScript code\n    return\
    \ data;\n}\n```\n\nFor a more specific example let us assume that we want to learn\
    \ the price of a product after a discount.\n\n```\nfunction checkPrice(price,\
    \ discount) {\n    var total = price - price * discount / 100;\n    return total;\n\
    }\n\nvar actualprice = checkPrice(100, 20);\ndocument.write(\"The discounted price\
    \ of the product excluding VAT is \"+actualprice);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_156_0.png)\n\
    \nThe checkPrice function accepts two values as arguments, the price of the product\
    \ and the discount that needs to be applied. Once these values are accepted they\
    \ are stored in the price and discount variables respectively. The function then\
    \ calculates the discounted price and assigns this calculated value to the variable\
    \ total. The mathematical formula price-price*discount/100 is just the formula\
    \ used to make this calculation. Finally, the value for the variable total is\
    \ returned to the main script with the return statement.\n\nWhat is passed down\
    \ to the script is the value of the total variable, not the variable itself. In\
    \ order to use this ‘returned’ value in the script, we need to store it inside\
    \ a variable. In the above example, we call the checkPrice() function to calculate\
    \ a 20% discount to a price of $100 and assign the resulting value to the actualprice\
    \ variable. This variable is then used in the main script and can be displayed\
    \ on screen with the document.write() command.\n\nWe are not required to store\
    \ the return value in a variable. We can also use it directly in the document.write()\
    \ command.\n\n```\ndocument.write(\"The discounted price of the product excluding\
    \ VAT is \"+checkPrice(100, 20));\n```\n\nWe have to be aware that as soon as\
    \ the browser’s JavaScript interpreter encounters a return statement, it will\
    \ exit the function. This means that if there are any lines of code after the\
    \ return statement they will not be executed. Therefore, the return statement\
    \ should be the last line of code within the function.\n\n## Local and Global\
    \ Variables\n\nBy now we are aware that functions provide us with a great advantage\
    \ by decreasing the amount of code we have to write. However, before we continue\
    \ we need to clarify one more aspect which is the behavior of variables inside\
    \ of a function and outside of the function. There is a difference as to how these\
    \ variables are treated which is very relevant for our coding practices.\n\nFor\
    \ the JavaScript interpreter, the variables declared inside of a function are\
    \ treated differently than variables declared outside of a function. The so-called\
    \ ‘scope’ of the variables is different in each situation. The variables that\
    \ exist inside a function are not visible to the rest of the script, they are\
    \ valid only for the function itself. This means that function variables have\
    \ a local scope. On the other hand, variables which are declared in the main part\
    \ of the JavaScript code are meaningful to all parts of the script. This means\
    \ that all existing functions in a script can access the variables which are created\
    \ in its main body. These variables have a global scope.\n\nTo clarify the difference\
    \ let us look at a few examples where we will calculate the number of drinks we\
    \ have during a fun night out.\n\n```\nvar drinks = 0;\n\nfunction nightOut()\
    \ {\n    drinks = 5;\n    document.write(\"Drinks in the function \", +drinks);\n\
    }\n\ndocument.write(\"Drinks on the outside \", +drinks);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_159_0.png)\n\
    \nAs we begin the day with 0 drinks the variable `drinks` is declared in the main\
    \ body of the JavaScript code with the assigned value of 0. As the `drinks` variable\
    \ is declared in the main code it has global scope, meaning that it is accessible\
    \ to all other functions. For this reason, when we display this variable with\
    \ the `document.write` statement both in the function and in the main code we\
    \ get the assigned value of 5.\n\nNow, let us assume that we want to track the\
    \ number of drinks at each place we visit with the following code:\n\n```\nvar\
    \ drinks=0;\nvar bardrinks = 0;\nvar clubdrinks = 0;\nfunction nightOut() {\n\
    \    var bardrinks = 3;\n    var clubdrinks = 5;\n    var drinks = bardrinks +\
    \ clubdrinks;\n    document.write(\"<p>Bar drinks in the function \", +bardrinks);\n\
    \    document.write(\"<p>Club drinks in the function \", +clubdrinks);\n    document.write(\"\
    <p>Drinks in the function \", +drinks);\n\nnightOut();\ndocument.write(\"<p>Bar\
    \ drinks on the outside \", +bardrinks);\ndocument.write(\"<p>Club drinks on the\
    \ outside \", +clubdrinks);\ndocument.write(\"<p>Drinks on the outside \", +drinks);\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_160_0.png)\n\n**Image 22.** Local\
    \ vs. global variables extended example\n\nLike in the previous example, the variable\
    \ `drinks` is declared in the main body of the script and therefore it has a global\
    \ scope. However, in this variation we also declare two additional variables,\
    \ `bardrinks` and `clubdrinks`, within the function. These two variables will\
    \ have a local scope and can be accessed only in the function itself. Hence, when\
    \ we display these variables with the `document.write()` statement within the\
    \ function we see values, while when we display these variables in the main code\
    \ we don’t see any values.\n\n## Chapter 4: Objects\n\nThe real world is filled\
    \ with objects, a random example being cars, TV’s, and dolls. Most of these objects\
    \ are made up of many different parts (ex. cars have doors, a TV’s have screens,\
    \ dolls have heads) and can also do one or more actions (ex. transport people,\
    \ watch images). The programming world, specifically JavaScript, is also full\
    \ of objects.\n\nWe have reached the point where we need to take our JavaScript\
    \ knowledge to the next level. For this purpose we will look at the more advanced\
    \ concepts starting with objects and object-oriented programming. Understanding\
    \ these concepts will provide us with a vital set of tools that we can even apply\
    \ when learning other programming languages.\n\n## What Are Objects?\n\nTo represent\
    \ physical things and concepts in the programming world we need to use objects.\
    \ But before we use programming objects let us examine an object from the real\
    \ world, a car. If we want to describe a car we will talk about its characteristics\
    \ such as color, make and model. We might expand our description to number of\
    \ doors, seats, engine type, maximum speed or any other set of characteristics.\
    \ We can also talk about how we use the car, from turning the ignition key, to\
    \ driving or listening to the stereo, or even how we use parts of the car, like\
    \ reclining the seats. We can even compare different car “versions” based on this\
    \ outline.\n\nIn programming, the car would be described as an object. The characteristics\
    \ of the car such as color, make, model, would be defined as the properties of\
    \ the car object. The things we can do with the car, like driving or listening\
    \ to music are represented by what is known as methods. And finally, each actual\
    \ representation of a car is called an instance. For example, in the following\
    \ image you are looking at two instances of a car.\n\n![](img/f8023be36714e65595b822db3c227be4_163_0.png)\n\
    \n**Image 23.** Two identical cars\n\n## Creating Objects\n\nThere are two approaches\
    \ to creating objects in JavaScript, we can either use an object constructor function\
    \ or literal notation. Let us start with an object constructor example.\n\n```\n\
    var car = new Object();\n```\n\nThe first part of this statement is familiar,\
    \ we use the `var` keyword to define a car variable. As we want to define the\
    \ variable as an object we use the new operator followed by the `Object()` constructor.\
    \ This will instruct JavaScript to create an empty object and assign it the name\
    \ car.\n\nOnce the empty object has been created we can start defining its properties.\
    \ Each property will have a name and a value, with each name/value pair describing\
    \ a particular instance of the object. For our car object we can assign the properties\
    \ `color`, `make` and `model`.\n\n```\nvar car = new Object();\ncar.color = \"\
    red\";\ncar.make = \"Ford\";\ncar.model = \"Mustang\";\n```\n\nWe can notice that\
    \ when defining properties we use the object name, followed by a dot, followed\
    \ by the property name. This is known as dot syntax, where the dot is what connects\
    \ the property (or method) to the object.\n\nTo define a method for the object,\
    \ we need to create a function that will become a part of the object. To begin,\
    \ let us create a simple method that will display a notification that the car\
    \ has been turned on.\n\n```\ncar.startCar = function () {\n    document.write(\"\
    The engine has started.<br>\");\n}\n```\n\nAs we are familiar with functions we\
    \ can see that the `startCar` method is created with the `function` keyword, followed\
    \ by a series of statements placed within curly braces. Since this code only creates\
    \ the method, in order to see this method in action we have to call it in the\
    \ script using the object name.\n\n```\ncar.startCar();\n```"
  mdcn: "\n## 从函数中检索信息\n\n既然我们已经了解了如何传递信息，我们就可以更进一步，让函数把信息“带”回来。为了从函数中取回一个值到主脚本中，我们可以使用\
    \ `return` 语句。其通用语法如下所示：\n\n```\nfunction functionName(argument1, argument2) {\n\
    \    // JavaScript 代码\n    return data;\n}\n```\n\n举一个更具体的例子，假设我们想了解产品折扣后的价格。\n\
    \n```\nfunction checkPrice(price, discount) {\n    var total = price - price *\
    \ discount / 100;\n    return total;\n}\n\nvar actualprice = checkPrice(100, 20);\n\
    document.write(\"产品不含增值税的折扣价为 \"+actualprice);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_156_0.png)\n\
    \n`checkPrice` 函数接受两个值作为参数：产品的价格和需要应用的折扣。一旦这些值被接受，它们就分别存储在 `price` 和 `discount`\
    \ 变量中。然后，函数计算折扣价并将这个计算出的值赋给变量 `total`。数学公式 `price-price*discount/100` 正是用于进行此计算的公式。最后，变量\
    \ `total` 的值通过 `return` 语句返回给主脚本。\n\n传递给脚本的是 `total` 变量的值，而不是变量本身。为了在脚本中使用这个“返回”的值，我们需要将它存储在一个变量中。在上面的例子中，我们调用\
    \ `checkPrice()` 函数来计算 100 美元价格打 20% 折扣后的值，并将结果赋给 `actualprice` 变量。然后这个变量在主脚本中使用，并可以通过\
    \ `document.write()` 命令显示在屏幕上。\n\n我们不一定需要将返回值存储在变量中。我们也可以直接在 `document.write()`\
    \ 命令中使用它。\n\n```\ndocument.write(\"产品不含增值税的折扣价为 \"+checkPrice(100, 20));\n```\n\
    \n我们必须知道，一旦浏览器的 JavaScript 解释器遇到 `return` 语句，它就会退出该函数。这意味着 `return` 语句之后的任何代码行都不会被执行。因此，`return`\
    \ 语句应该是函数中的最后一行代码。\n\n## 局部变量与全局变量\n\n到目前为止，我们已经知道函数通过减少我们需要编写的代码量为我们提供了巨大的优势。然而，在继续之前，我们需要阐明另一个方面：函数内部变量与函数外部变量的行为。这些变量的处理方式存在差异，这对于我们编写代码的实践非常重要。\n\
    \n对于 JavaScript 解释器来说，在函数内部声明的变量与在函数外部声明的变量被区别对待。这些变量的所谓“作用域”在每种情况下是不同的。存在于函数内部的变量对脚本的其余部分不可见，它们只对该函数本身有效。这意味着函数变量具有局部作用域。另一方面，在\
    \ JavaScript 代码主体部分声明的变量对脚本的所有部分都有意义。这意味着脚本中的所有现有函数都可以访问在其主体中创建的变量。这些变量具有全局作用域。\n\
    \n为了阐明这种差异，让我们看几个例子，我们将计算一个有趣的外出夜晚中我们喝了多少饮料。\n\n```\nvar drinks = 0;\n\nfunction\
    \ nightOut() {\n    drinks = 5;\n    document.write(\"函数内的饮料数量 \", +drinks);\n\
    }\n\ndocument.write(\"函数外的饮料数量 \", +drinks);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_159_0.png)\n\
    \n当我们以 0 杯饮料开始一天时，变量 `drinks` 在 JavaScript 代码的主体中声明，并赋值为 0。由于 `drinks` 变量在主体代码中声明，它具有全局作用域，这意味着它可以被所有其他函数访问。因此，当我们在函数和主代码中用\
    \ `document.write` 语句显示这个变量时，我们得到的是赋值后的值 5。\n\n现在，让我们假设我们想要用以下代码跟踪我们在每个地方访问的饮料数量：\n\
    \n```\nvar drinks=0;\nvar bardrinks = 0;\nvar clubdrinks = 0;\nfunction nightOut()\
    \ {\n    var bardrinks = 3;\n    var clubdrinks = 5;\n    var drinks = bardrinks\
    \ + clubdrinks;\n    document.write(\"<p>函数内的酒吧饮料数量 \", +bardrinks);\n    document.write(\"\
    <p>函数内的俱乐部饮料数量 \", +clubdrinks);\n    document.write(\"<p>函数内的饮料总数 \", +drinks);\n\
    }\n\nnightOut();\ndocument.write(\"<p>函数外的酒吧饮料数量 \", +bardrinks);\ndocument.write(\"\
    <p>函数外的俱乐部饮料数量 \", +clubdrinks);\ndocument.write(\"<p>函数外的饮料总数 \", +drinks);\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_160_0.png)\n\n**图片 22.** 局部变量与全局变量的扩展示例\n\
    \n与前一个例子类似，变量 `drinks` 在脚本主体中声明，因此具有全局作用域。然而，在这个变体中，我们还在函数内部声明了两个额外的变量 `bardrinks`\
    \ 和 `clubdrinks`。这两个变量将具有局部作用域，只能在函数本身内部访问。因此，当我们在函数内用 `document.write()` 语句显示这些变量时，我们可以看到值，而当我们在主代码中显示这些变量时，则看不到任何值。\n\
    \n## 第四章：对象\n\n现实世界充满了对象，随机举例如汽车、电视和玩偶。这些对象大多由许多不同的部分组成（例如，汽车有门，电视有屏幕，玩偶有头），并且可以执行一个或多个动作（例如，运输人，观看图像）。编程世界，特别是\
    \ JavaScript，也充满了对象。\n\n我们已经到了需要将我们的 JavaScript 知识提升到更高水平的时候。为此，我们将从对象和面向对象编程开始，研究更高级的概念。理解这些概念将为我们提供一套重要的工具，我们甚至可以在学习其他编程语言时应用它们。\n\
    \n## 什么是对象？\n\n要在编程世界中表示物理事物和概念，我们需要使用对象。但在我们使用编程对象之前，让我们先考察一个现实世界中的对象——汽车。如果我们想描述一辆汽车，我们会谈论它的特征，比如颜色、品牌和型号。我们可能会将描述扩展到车门数量、座椅数量、发动机类型、最高速度或任何其他特征集。我们还可以谈论我们如何使用汽车，从转动点火钥匙，到驾驶或听立体声，甚至如何使用汽车的某些部分，比如调节座椅。我们甚至可以根据这个大纲比较不同的汽车“版本”。\n\
    \n在编程中，汽车将被描述为一个对象。汽车的特征，如颜色、品牌、型号，将被定义为汽车对象的属性。我们可以对汽车做的事情，如驾驶或听音乐，由所谓的**方法**表示。最后，每辆汽车的实际表示称为**实例**。例如，在下面的图片中，你看到的是两辆汽车的两个实例。\n\
    \n![](img/f8023be36714e65595b822db3c227be4_163_0.png)\n\n**图片 23.** 两辆相同的汽车\n\n\
    ## 创建对象\n\n在 JavaScript 中创建对象有两种方法：我们可以使用**对象构造函数**或**字面量表示法**。让我们从一个对象构造函数的例子开始。\n\
    \n```\nvar car = new Object();\n```\n\n这个语句的第一部分很熟悉，我们使用 `var` 关键字定义一个 `car` 变量。由于我们希望将变量定义为对象，所以我们使用\
    \ `new` 运算符，后跟 `Object()` 构造函数。这将指示 JavaScript 创建一个空对象并将其命名为 `car`。\n\n一旦空对象被创建，我们就可以开始定义它的属性。每个属性将有一个名称和一个值，每个名称/值对描述对象的一个特定实例。对于我们的汽车对象，我们可以分配属性\
    \ `color`、`make` 和 `model`。\n\n```\nvar car = new Object();\ncar.color = \"red\"\
