  md: '# **What is This `<div>` Element?**


    Documents written prior to the advent of HTML5 are plagued with `<div>` tags.
    The `<div>` tag was the king element of semantic markup in previous HTML revisions.
    It was the only container available for sectioning off content, but it was far
    more appropriate for defining web page layout than tables. In combination with
    CSS styles used through IDs and classes, the `<div>` element allowed us to create
    visually rich pages with a rather flexible design.


    In HTML5, `<div>` has the semantic meaning of a general element. As modern HTML
    coding requires us to use the most suitable or semantically accurate element,
    the `<div>` element is now used only when there are no other elements that are
    more appropriate.'
  merge: -1
  pgno: 85
- img_proc: true
  md: "# **Navigation and Supplemental Content**\n\nThe <nav> element defines a section\
    \ of a page that contains navigation links. These links may point to topics on\
    \ the current page or to other web pages on a website. It is not unusual to have\
    \ a page with multiple <nav> sections, one for the main navigation menu, one for\
    \ the submenu, another for topics within the current article, etc. All of the\
    \ links on a web page don’t need to be included inside a <nav> element. Generally\
    \ speaking, the <nav> element is reserved for the more important navigational\
    \ sections.\n\nIn our sample CV we can use the <nav> element to wrap the initial\
    \ navigation menu that bookmarks different sections of the CV.\n\n```\n<nav>\n\
    \    <p><a href=\"#personal\">Personal Information</a></p>\n    <p><a href=\"\
    #education\">Education</a></p>\n    <p><a href=\"#skills\">Skills</a></p>\n  \
    \  <p><a href=\"#portfolio\">Portfolio</a></p>\n</nav>\n```\n\nThe <aside> element\
    \ is perfectly suited for a sidebar. A sidebar can refer to a bar physically located\
    \ to the side of a page or a section of content that provides “additional information.”\
    \ Essentially, <aside> represents a complete chunk of content that’s separate\
    \ from the main content of the page but is still related to that content. For\
    \ example, it makes sense to use <aside> to create a sidebar with related content\
    \ or links next to a main article. We can also use <aside> to define a block of\
    \ ads."
  merge: -1
  pgno: 86
- img_proc: true
  md: "# # Headers and Footers\n\nThe <header> element groups together introductory\
    \ content that may also include navigational links. The <header> usually wraps\
    \ the heading section of a website including the logo, tagline, and navigation\
    \ menu. It can also appear at the beginning of an article and include content\
    \ such as a title, a byline and maybe some links to article subtopics. Traditionally,\
    \ when we think of a header, we imagine only one header per page. In an HTML5\
    \ document we can have more than one <header> section as long as each <header>\
    \ section relates to different content.\n\nFor example, in our sample CV we can\
    \ include the Curriculum Vitae heading, the image and the navigation menu in a\
    \ <header> element.\n\n```\n<header>\n    <h1>Curriculum Vitae</h1>\n    <p><img\
    \ src=\"images\\cv_picture.jpg\" alt=\"Scott Johnson profile picture\" width=\"\
    100\" height =\"150\"></p>\n    <nav>\n        <p><a href=\"#personal\">Personal\
    \ Information</a></p>\n        <p><a href=\"#education\">Education</a></p>\n \
    \       <p><a href=\"#skills\">Skills</a></p>\n        <p><a href=\"#portfolio\"\
    >Portfolio</a></p>\n    </nav>\n</header>\n```\n\nThe <footer> element defines\
    \ a footer at the bottom of the page or the section. A <footer> typically contains\
    \ information such as copyright, contact, sitemap, related documents and similar\
    \ items. Just like with the <header> element, we may have multiple <footer> elements\
    \ per page, each grouped into a different <section>.\n\n> > **Note:** The <hgroup>\
    \ element was a new HTML5 element used to combine multiple heading levels such\
    \ as a title and a subtitle. However, this element has been dropped since it was\
    \ “fraught with accessibility problems and lacked many compelling use cases.”"
  merge: -1
  pgno: 87
- img_proc: true
  md: "# Semantic Images with `<figure>` and `<figcaption>`\n\nThe ability to add\
    \ images on the web influenced the growth of the WWW from academia to a worldwide\
    \ wonder. The `<img>` element has existed since the early days of the World Wide\
    \ Web. From a semantic perspective, the `<img>` element is greatly limited when\
    \ it comes to associating explanatory text with the image. While the ‘alt’ attribute\
    \ does partially deal with this issue, this text is neither visible nor functional\
    \ beyond its accessibility features.\n\nTo address this issue, HTML5 offers the\
    \ `<figure>` and `<figcaption>` elements. The `<figure>` element groups the figure\
    \ with its corresponding caption. For example, we can use the `<figure>` and `<figcaption>`\
    \ elements to add greater semantic meaning to the image in our sample CV.\n\n\
    ```\n<figure>\n    <img src=\"images\\cv_picture.jpg\" alt=\"Scott Johnson's profile\
    \ picture\" width=\"100\" height=\"150\">\n    <figcaption>Scott Johnson</figcaption>\n\
    </figure>\n```\n\nPhysically, the figure itself does not necessarily have to be\
    \ an `<img>` element. It can be an SVG drawing, a `<canvas>` element or even an\
    \ ASCII graphic, generally anything that can be interpreted as a figure.\n\n>\
    \ **Note:** *The `<canvas>` element is a new HTML5 element that acts as a container\
    \ for graphics. The graphics themselves are created or drawn via scripting, and\
    \ the practical application of this element goes beyond the scope of this book.*"
  merge: -1
  pgno: 88
- img_proc: true
  md: "# HTML5 Compatibility\n\nWhen using the HTML5 elements described in this book,\
    \ it is necessary to acknowledge that older browsers, like IE8, lack the capability\
    \ to recognize these elements. When browsers can’t recognize a specific tag, they\
    \ simply ignore the tag and render the remaining content as simple text. This\
    \ is acceptable up to a certain point, as semantic elements are not meant for\
    \ formatting, but ignoring tags means that the browser will not structure the\
    \ text in a separate line and will treat everything as part of the same element.\
    \ In addition to not representing unrecognized elements, IE doesn’t even acknowledge\
    \ their existence, thus preventing us from styling these elements with CSS.\n\n\
    To resolve this issue we will have to trick the older IE browser into recognizing\
    \ a foreign element by registering it with a JavaScript command. As JavaScript\
    \ is beyond the scope of this book and beyond the scope of many web designers,\
    \ we will have to resort to a strategy called HTML5 Shiv. HTML5 Shiv is an already\
    \ created fully compatible JavaScript code developed by Sjoerd Visscher and is\
    \ available online via googlecode.com. We don’t have to retrieve or understand\
    \ this code to use it. Rather, we simply need to reference it in the head section\
    \ of our page like this:\n\n```\n<head>\n\n    <meta charset=\"utf-8\">\n\n  \
    \  <title>Curriculum Vitae</title>\n\n    <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    ></script>\n\n</head>\n```\n\nWhen we want to add JavaScript code to our web page,\
    \ we use the <script> element. In the example above, by using the src attribute,\
    \ this element grabs the html5.js JavaScript file from the web server at html5shiv.googlecode.com\
    \ and runs it before the browser starts processing the rest of the page, thus\
    \ rendering any HTML elements properly. The script is short, simple, loads very\
    \ fast and uses code to create all the new HTML5 elements for older browsers.\
    \ Then, all we have to do is use the new elements and style them with appropriate\
    \ CSS rules.\n\nTechnically, we can solve most HTML5 issues of older, non-IE browsers\
    \ with CSS rules. Therefore, if we only want the HTML5 Shiv JavaScript code executed\
    \ for IE browsers, we can place it inside a conditional comment. A conditional\
    \ comment is a special type of comment that only Internet Explorer can read; it\
    \ can even target specific versions of IE.\n\n```\n<head>\n```"
