    document.getElementById(\"partyplan\").appendChild(newPlan);\n```\n\n![](img/f8023be36714e65595b822db3c227be4_185_0.png)\n\
    \n使用类似的过程，我们也可以通过 DOM 操作从页面中移除一个元素。举个例子，让我们移除作为页面主标题的 `<h1>` 元素。我们将首先通过其 id 属性（值为“partytitle”）来选择该元素，并将该元素节点存储在一个变量中。\n\
    \n```\nvar removeHeading = document.getElementById(\"partytitle\");\n```\n\n接下来，我们需要找到作为\
    \ `<h1>` 元素容器的父元素，在本例中就是 `<body>` 元素。我们可以直接选择此元素，或者使用先前选择元素的 parentNode 属性。无论哪种情况，我们都需要将父元素存储在另一个变量中。\n\
    \n```\nvar containerForHeading = removeHeading.parentNode;\n```\n\n最后，我们将使用父元素上的\
    \ removeChild() 方法，以从页面中移除我们想要移除的元素。\n\n```\ncontainerForHeading.removeChild(removeHeading);\n\
    ```\n\n完整的语法如下：\n\n```\nvar removeHeading = document.getElementById(\"partytitle\"\
    );\nvar containerForHeading = removeHeading.parentNode;\ncontainerForHeading.removeChild(removeHeading);\n\
    ```\n\n![](img/f8023be36714e65595b822db3c227be4_186_0.png)\n\n## 第 6 章：事件\n\n\
    JavaScript 中最重要的概念之一是事件的使用。事件就是发生的事情，比如在键盘上按键或点击页面上的某个位置。只要发生了某件事并且是预期的，我们就可以用特定的操作来响应它。我们可以通过在事件发生时调用一个函数来拦截预期事件并做出相应反应。正如我们将在本章最后看到的，要让\
    \ JavaScript 预期事件，我们将使用事件处理程序或事件监听器。但首先，让我们看看我们可以处理或监听的事件类型。\n\n### 事件类型\n\n当我们与网页交互时，我们会触发很多事件。我们点击链接、将鼠标悬停在元素上、输入文本、打开浏览器、关闭选项卡、复制/粘贴文本、填写表单等等。几乎我们做的每一件事都会触发一个事件，而当一个事件被触发时，我们通常希望编写一个函数来专门对该事件做出反应。\n\
    \n我们可以对许多类型的事件做出反应，但我们将只关注鼠标事件、键盘事件和浏览器/对象事件。以下三个表格简要描述了每种事件类型中最常用的事件。\n\n**鼠标事件**发生在用户用鼠标做某些事情时，比如移动、点击、拖动等。\n\
    \n| 事件 | 描述 |\n|---|---|\n| onclick | 用户点击一个元素 |\n| ondblclick | 用户双击一个元素 |\n\
    | onmouseover | 用户将鼠标指针定位在特定元素上 |\n| onmouseout | 用户将鼠标指针移离特定元素 |\n| ondrag |\
    \ 用户点击并拖动一个元素 |\n\n**表 2.** 鼠标事件\n\n**键盘事件**更简单，因为它们发生在按键被按下或释放时。\n\n| 事件 | 描述\
    \ |\n|---|---|\n| onkeydown | 用户正在按下一个键 |\n| onkeyup | 用户已释放一个按下的键 |\n\n**表 3.**\
    \ 键盘事件\n\n**浏览器/对象事件**是更通用的事件，在不同的时间发生，例如网页加载时。\n\n| 事件 | 描述 |\n|---|---|\n| onload\
    \ | 页面/对象已加载 |\n| onunload | 页面/对象已卸载 |\n| onfocus | 页面/元素获得焦点 |\n| onblur | 页面/元素失去焦点\
    \ |\n| onerror | 页面上发生错误 |\n| onresize | 页面/对象被调整大小 |\n| onscroll | 页面/对象的滚动条被使用\
    \ |\n\n**表 4. 浏览器/对象事件**\n\n鼠标事件是网页上最常见的基于用户的事件。然而，随着触摸设备的出现，触摸事件越来越受到重视。\n\n\
    > *注意：可能的事件完整列表相当庞大，超出了本书的范围。请访问 W3C Schools 网站获取完整列表（http://www.w3schools.com/jsref/dom_obj_event.asp）。*\n\
    \n### 响应事件\n\n为了编写 JavaScript 以响应事件，我们必须通过事件处理程序将该事件绑定到页面上的元素。事件处理程序让我们可以在任何特定元素上指明我们正在监听的事件。为此，有三种不同的事件处理程序方法：\n\
    \n- **HTML 事件处理程序**是一组属性，可以响应添加它们的元素上的事件。尽管在旧的网页中仍然存在，但这种方法不再被使用，因为它将 JavaScript\
    \ 集成到了 HTML 中，而实际上应该将它们分离。\n- **DOM 事件处理程序**是原始 DOM 规范中引入的方法。它们与 HTML 文档分离，并在所有主要浏览器中得到很好的支持。它们的主要缺点是只能将单个函数附加到事件上。\n\
    - **DOM 事件监听器**是处理事件的首选方法，在 DOM 规范的更新中引入。它们允许一个事件触发多个函数，但是 IE8 及更早版本的浏览器不支持它们。\n\
    \n在处理事件时，我们首先必须选择将成为交互对象的元素。例如，如果这个元素是一个链接，那么我们需要指定该链接元素的 DOM 节点。在选择了元素之后，我们需要指明将作为触发器的事件。用程序员的话说，这叫做“将事件绑定到元素节点”。最后，我们必须声明代码，通常是一个函数，我们希望在事件发生时触发该函数。\n\
    \n在本章的剩余部分，我们将重点介绍事件处理程序和事件监听器，忽略已废弃的 HTML 方法。为了遵循本章的示例，我们将使用类似上一章聚会日程示例的 HTML\
    \ 结构。唯一的区别是每个列表项都添加了链接元素。\n\n```\n<!doctype html>\n<html>\n<head>\n<meta charset=\"\
    utf-8\">\n<title>Party Schedule</title>\n<style type=\"text/css\">\n.current {\n\
    \    color:red;\n}\n.finished {\n    color:green;\n}\n</style>\n</head>\n<body>\n\
    <h1 id=\"partytitle\">Party Plan</h1>\n<ul id=\"partyplan\">\n  <li id=\"phase1\"\
    >20:00 - <a href=\"#\" id=\"testLink\">Home warm-up</a></li>\n  <li id=\"phase2\"\
    >22:00 - Joe's Bar</li>\n  <li id=\"phase3\">00:00 - Nightclub 54</li>\n</ul>\n\
    </body>\n</html>\n```\n\n### 事件处理程序\n\n使用传统 DOM 事件处理程序有许多非常相似的方法。有些非常紧凑，而另一些则有更多行代码，但可能更容易理解。举个例子，让我们写一个简短的脚本，在链接被点击时改变它的颜色。首先，我们将创建我们希望在事件发生时触发的函数。\n\
    \n```\nfunction linkClick(){\n    this.className = \"current\";\n}\n```\n\n通过使用\
    \ `this.className` 属性，我们指示调用此函数的对象将其 `className` 属性设置为“current”。现在我们已经有了函数，让我们通过使用\
    \ `getElementById()` 方法来调用触发事件的对象，并将其元素节点分配给一个变量。\n\n```\nvar firstLink = document.getElementById(\"\
    testLink\");\n```\n\n既然我们已经获取了对元素节点的引用，我们最终可以构建一个适当的事件处理程序。\n\n```\nfirstLink.onclick\
    \ = linkClick;\n```\n\n完整的语法如下：\n\n```\nfunction linkClick(){\n    this.className\
    \ = \"current\";\n}\nvar firstLink = document.getElementById(\"testLink\");\n\
    firstLink.onclick = linkClick;\n```\n\n![](img/f8023be36714e65595b822db3c227be4_194_0.png)\n\
    \n**图 33.** 使用事件处理程序改变链接颜色\n\n考虑到 JavaScript 是一种非常灵活的语言，我们实际上可以将其压缩为两行代码，但我们会失去一些灵活性。\n\
    \n```\ndocument.getElementById(\"testLink\").onclick = function linkClick() {\n\
    \    this.className = \"current\";\n}\n```\n\n由 `onclick` 事件触发的 `linkClick` 函数不必是简单的。我们可以改变不止一个属性，甚至可以编写处理不同情况的复杂脚本。例如，以下代码除了添加一个类之外，还会更改链接的文本。\n\
    \n```\nfunction linkClick(){\n    this.className = \"current\";\n    this.textContent\
    \ = \"Party Finished\"\n}\nvar firstLink = document.getElementById(\"testLink\"\
    );\n```\n"
