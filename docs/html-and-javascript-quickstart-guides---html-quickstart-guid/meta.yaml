  md: '# Glossary (HTML)


    **Accessibility** - the ability of people with disabilities to use a website,
    including the visually impaired, hearing impaired, colorblind users, or those
    with other disabilities.


    **Anchor** - the text a link uses to refer to our site.


    **Browser** - the program that enables a user to view our web site.


    **Cascading Style Sheets (CSS)** - rules that define a website’s look and feel.


    **Comment** - a bit of information contained in the HTML code which the browser
    ignores.


    **Conditional comment** - a special type of comment visible only to Internet Explorer
    browsers.


    **Deprecated** - code that is no longer included in the language specifications.


    **Doctype** - a declaration that specifies which version of HTML is used in a
    web page.


    **Element** - the central building block of any HTML document.


    **Extensible Markup Language (XML)** - a markup language used for writing custom
    markup languages.


    **HTML5 Shiv** - a fully compatible JavaScript code that recreates all of the
    new HTML5 elements for compatibility with older browsers.


    **Hypertext Markup Language (HTML)** - the primary language used for writing web
    pages.


    **Hypertext** - any computer text that includes hyperlinks.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '**Metadata** - the data contained in the head of the web page that offers additional
    information about that web page.


    **Non-breaking space** - a white-space character that isn''t condensed by HTML.


    **Script** - a portion of code, most often written in JavaScript, that makes the
    page more dynamic and interactive.


    **Semantic markup** - markup that offers context to what the content contains.


    **Tag** - a set of markup characters used around an element to indicate where
    it begins and where it ends.


    **Web page** - a single document written in HTML meant to be viewed in a web browser.'
