  md: '# *previousSibling & nextSibling*


    The `previousSibling` and `nextSibling` properties refer to adjacent elements
    on the same DOM level. For example, if we select the second `<li>` element with
    the `id` value “phase2”, the “phase1” `<li>` element would be considered a `previousSibling`
    , while the “phase3” `<li>` element would be `nextSibling` . In the case where
    there is no sibling, (ex. the “phase1” element has no `previousSibling` ), the
    value of this property remains null.


    In the following example we select the `<li>` element which has “phase2” as a
    value for its `id` attribute and we change the `class` attribute for both the
    selected element and its previous sibling.


    ```

    var secondstop = document.getElementById(“phase2”);

    var prevstop=secondstop.previousSibling;

    secondstop.className = “current”;

    prevstop.className = “finished”;

    ```'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Parents & Children


    We can also travel to different levels of the DOM hierarchy using the selected
    element as a starting point. If we want to move one level up we can use the `parentNode`
    property. For example, if we have the second `<li>` element selected we can refer
    to its parent element, the `<ul>` element, with the following syntax:


    ```

    var secondstop = document.getElementById("phase2");

    var upperelement = secondstop.parentNode;

    ```


    Alternatively, if we want to move one level down, we can use either the `firstChild`
    or the `lastChild` property. In the following example we have selected the `<ul>`
    element with "partyplan" as a value for its id attribute. Using the `firstChild`
    property we refer to the first `<li>` element of this list, while with the `lastChild`
    property we refer to the last `<li>` element of this list.


    ```

    var plan = document.getElementById("partyplan");

    var child1 = plan.firstChild;

    var child2 = plan.lastChild;

    ```'
