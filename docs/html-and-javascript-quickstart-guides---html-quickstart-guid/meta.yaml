  mdcn: "\n# 事件监听器\n\n处理事件的较新创新被称为事件监听器。事件监听器可以同时处理多个函数，尽管对较旧浏览器的支持有所欠缺。事件监听器通过`addEventListener()`方法附加到元素上，该方法接受三个属性。\n\
    \n举个例子，让我们重写之前的代码，将事件处理程序改为事件监听器。函数将保持不变。\n\n```javascript\nfunction linkClick(){\n\
    \    this.className = \"current\";\n    this.textContent = \"Party Finished\"\n\
    }\n\nvar firstLink = document.getElementById(\"testLink\");\nfirstLink.addEventListener(\"\
    click\", linkClick, false);\n```\n\n我们可以看到，附加到`firstlink`变量上的不是事件属性，而是`addEventListener()`方法。在括号内，我们首先有事件（没有前面的'on'），然后是函数的名称，以及称为事件流的东西。事件流指示事件被捕获的顺序，通常设置为false。\n\
    \n我们可以看到，在我们的例子中，当函数被赋给事件时，函数名后面没有添加括号。原因是，如果我们使用带有括号的`linkClick()`语法，我们将执行该函数并将其值赋给`onclick`。当我们不使用括号时，我们将函数（而不是值）赋给`onclick`属性。我们不再控制事件处理函数如何执行，因为浏览器将通过自动传递一个Event对象给处理函数来为我们执行该函数。\n\
    \n# 结论（JavaScript）\n\n当我们决定学习像JavaScript这样复杂的东西时，我们面前有一个漫长的过程。仅仅熟悉信息是不够的，我们必须在实际情况和现实例子中应用这些信息。\n\
    \n在本书中，我们介绍了JavaScript的基本概念及其编程方法。我们了解到JavaScript是一种脚本语言，它通过提供动态和交互式内容来增强网页。我们研究了解释网页时浏览器遵循的过程，因为它逐个元素地解析代码并处理JavaScript指令。我们看到JavaScript代码嵌入在网页本身中；它的存在以`<script>`元素为标志。\n\
    \n从基本语法和语句结构开始，在第二章中，我们通过JavaScript的数据类型和变量来构建我们的知识。特别是，我们现在知道JavaScript支持多种数据类型，例如数字、文本和布尔值。数字的行为就像数字应有的样子，文本由字符字符串表示并用引号括起来，布尔值是true或false。这些数据类型存储在变量中，使其值提交到内存中，以便稍后可以在我们的代码中使用。然而，在给变量赋值之前，我们现在意识到我们必须首先向JavaScript解释器声明它的存在。我们还熟悉了数组，这是一种特殊的变量类型，可以保存多条数据，并通过唯一的索引号进行管理。\n\
    \n在第三章中，我们继续学习JavaScript语言的核心及其语法。具体来说，我们研究了使用条件语句进行决策以及使用循环重复代码。我们从理解`if`、`else`和`else\
    \ if`语句开始，因为做出决策的能力本质上赋予了代码其“智能”。确定条件是真还是假可以帮助我们决定要遵循的行动路线，使用这些语句我们可以选择将要执行的代码块。接下来，我们使用while和for循环来循环代码，因为经常需要重复执行代码块多次。我们了解到循环需要初始化、条件测试和递增，以便成功执行代码块指定次数。\n\
    \n在第四章中，我们通过观察作为可重用代码片段的函数来完成JavaScript核心脚本功能的讲解。虽然有主要的内置函数可用，但JavaScript使我们能够使用function关键字定义和使用自己的函数。我们看到函数可以有零个或多个参数传递给它们，并且如果这是它们的预期目的，它们可以返回一个值。关于函数，我们学习了变量作用域，其中在函数外部声明的变量是全局可用的，而在函数内部定义的变量是该函数的私有变量，不能被主代码访问。\n\
    \n在第五章中，我们转向了对象这一至关重要的概念。我们了解到JavaScript是一种基于对象的语言，因为它使用这个对象概念来表示事物，如字符串、日期和数组。我们使用对象构造函数函数或字面量表示法创建了新对象。我们还设置了这些对象的属性并定义了它们的方法。我们还学习了如何在需要时访问这些属性和调用这些方法。\n\
    \n在第六章中，我们研究了文档对象模型，在那里我们看到DOM如何提供访问网页元素的方法。我们了解到DOM将HTML文档表示为树结构。然后我们学习了这种树结构如何使其能够通过其“分支”导航到不同的元素，以使用它们的属性和方法。我们看到如何通过定位元素节点来选择单个元素和元素组。然后我们通过添加新元素或更改现有结构来操作内容。\n\
    \n我们现在具备了继续学习更高级概念的基础知识和理解。我们可以采取许多方向，因为JavaScript提供了我们可以采取的大量方向。我们可以专注于表单交互，看看我们如何使用JavaScript来评估和与表单数据交互。为此，我们还需要学习序列化以转换对象的结构和信息。然后我们可以通过学习如何在本地计算机上使用cookies存储信息来个性化用户体验。\n\
    \n我们可以通过AJAX更进一步，创建不需要页面刷新即可与服务器通信的无中断应用程序。我们可以探索JavaScript框架，如jQuery或Modernizr，看看如何将JavaScript发挥到极限并轻松创建复杂的高端应用程序。最后，我们可以学习如何通过使用高级错误处理和复杂的调试工具来创建完美的代码。\n\
    \nClydeBank Media全体成员衷心感谢您购买我们的书。作为我们感激之情的表示，请利用本书开头提供的免费礼物——一本免费有声读物和终身[ClydeBank\
    \ Media VIP会员资格](http://link)。\n\n![](img/f8023be36714e65595b822db3c227be4_199_0.png)\n\
    \n作为ClydeBank Media VIP会员，当我们的书籍以及我们合作伙伴出版公司的书籍在Kindle商店免费提供时，您将收到通知。激活您的ClydeBank\
    \ Media VIP会员资格的链接如下。\n\n# 术语表（JavaScript）\n\n**参数** - 函数使用的变量，该变量已传递给该函数。\n\n\
    **数组** - 单一数据类型的值的集合。\n\n**布尔值** - 接受true/false变量的数据类型。\n\n**构造函数** - 创建对象新实例的一种方式。\n\
    \n**CSS** – 层叠样式表\n\n**DOM** - 一组定义，允许用JavaScript编写的程序与网页上的对象进行交互。\n\n**ECMAScript**\
    \ - JavaScript语言的核心规范。\n\n**事件** - 网页上发生的事情。\n\n**函数** - 一组收集在一起并赋予名称的语句。\n\n\
    **HTML** – 超文本标记语言\n\n**实例** - 对象的特定表示。\n\n**JavaScript** - 一种脚本语言，允许增强用户与网页之间的交互。\n\
    \n**方法** - 附加到特定对象的函数。\n\n**节点** - DOM树结构中的单元表示。\n"
