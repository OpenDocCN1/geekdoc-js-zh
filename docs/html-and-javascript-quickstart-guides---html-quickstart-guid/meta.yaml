    # Chapter 6: Events


    One of the most important concepts in JavaScript is the use of events. An event
    is simply something that happens, like pressing a key on the keyboard or clicking
    somewhere on the page. As long as something happens and it has been expected we
    can respond to it with a specific action. We can intercept the anticipated event
    and respond in kind by calling a function when that event occurs. As we will see
    in this final chapter, to make JavaScript anticipate events we will use event
    handlers or event listeners. But first, let us look at the type of events that
    we can handle or listen for.'
  - '[PAGE 189]


    # *Event Types*


    When we interact with web pages we initiate a lot of events. We click a link,
    hover over an element, type text, open the browser, close a tab, copy/paste text,
    fill-out forms and so on. Almost everything we do triggers an event, and when
    an event is triggered we usually want to code a function that will react specifically
    to that event.


    There are many types of events that we can react to, but we will only focus on
    mouse events, keyboard events and browser/object events. The following three tables
    give a brief description of the most commonly used events for each event type.


    **Mouse events** occur when the user does something with the mouse like moving,
    clicking, dragging, etc.


    | EVENT | DESCRIPTION |

    |---|---|

    | onclick | The user clicks an element |

    | onbdlclick | The user double clicks an element |

    | onmouseover | The user positions the mouse pointer on a specific element |

    | onmouseout | The user moves the mouse pointer away from a specific element |

    | ondrag | The user clicks and drags an element |


    **Table 2.** Mouse events


    **Keyboard events** are simpler as they occur either when a key is pressed or
    depressed.


    | EVENT | DESCRIPTION |

    |---|---|

    | onkeydown | The user is pressing a key |

    | onkeyup | The user has released a pressed key |


    **Table 3.** Keyboard events


    **Browser/object events** are more generic events that occur at different times
    like when the web page is loaded.'
  - '[PAGE 190]


    | EVENT | DESCRIPTION |

    |---|---|

    | onload | The page/object has loaded |

    | onunload | The page/object has unladed |

    | onfocus | The page/element gets focus |

    | onblur | The page/element loses focus |

    | onerror | An error has occurred on the page |

    | onresize | The page/object is resized |

    | onscroll | The scrollbar of the page/object is used |


    **Table 4. Browser/Object events**


    Mouse events are the most common user-based events that occur on a web page. However,
    with the advent of touch-based devices there is an increased consideration for
    touch events.


    > *Note: The full list of possible events is rather large and beyond the scope
    of this book. Please visit the W3C Schools web site for a complete list (http://www.w3schools.com/jsref/dom_obj_event.asp).*'
