  md: '# *Reacting to Events*


    In order to program JavaScript to react to an event we have to bind that event
    to an element on the page via event handlers. Event handlers let us indicate the
    event we are listening for on any specific element. For this purpose there are
    three different approaches to event handlers:


    +   - **HTML event handlers** are a set of attributes that can respond to events
    on the element they are added. Although still present in older web pages, this
    approach is no longer used as it integrates JavaScript into HTML when it should
    separate.

    - **DOM event handlers** are the approach introduced in the original DOM specification.
    They are separate from the HTML document and have a strong support in all major
    browsers. Their main drawback is the limitation of attaching only a single function
    to an event.

    - **DOM event listeners** are the favored approach to handling events, introduced
    in an update of the DOM specification. They allow one event to trigger multiple
    functions, however they are not supported by IE8 and earlier versions of that
    browser.


    When dealing with events we first have to select the element that will be the
    object of interaction. If for example this element is a link, then we need to
    specify the DOM node for that link element. After we have the element selected
    we will need to indicate the event that will act as a trigger. In programmer speak
    this is called “binding the event to the element node”. Finally, we have to state
    the code, which is usually a function that we want to have triggered when the
    event happens.


    In the remainder of the chapter we will focus on event handlers and event listeners
    and ignore the discarded HTML approach. To follow the examples in this chapter
    we will use a similar HTML structure like in the Party Schedule example from the
