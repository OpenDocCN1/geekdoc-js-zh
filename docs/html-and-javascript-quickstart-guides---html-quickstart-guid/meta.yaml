    HTML was originally designed as a markup language to describe the structure and
    semantics of a web document. The elements and attributes of HTML were supposed
    to indicate things such as the title of a document, what part of the text was
    a heading, what part of the text was a paragraph, what data belonged in a table,
    and so on. In its earliest form, the web was intended to transmit scientific documents
    so that the research community had quick and easy access to published work.


    **Note:** *There was never any such thing as HTML 1. The first official HTML specification
    was HTML 2.0.*


    At the time, many people saw the potential of the growing web. These users started
    creating web pages for all different kinds of purposes, from personal home pages
    to huge corporate sites advertising a company’s products and services. It wasn’t
    long before web page authors wanted to control how their sites looked, and they
    expected the same level of control over their pages’ appearance as print designers
    had over their creations. The web designers wanted to be able to control the fonts
    and colors used in documents and where their text would appear on a page. These
    needs and wants gave rise to what is known as presentational or stylistic markup,
    because it affects the way that pages look. Stylistic markup does not describe
    the structure and semantics of the document, which was the initial intention of
    HTML. Many of the features in these specifications were driven by existing implementations
    of market-leading browsers as a response to user demand.'
  - '[PAGE 21]


    # **The Rise and Fall of XHTML**


    To keep this story short, the HTML language evolved from version 2.0 to 4.01,
    at which point the original purpose of structuring the document was completely
    lost. The people in charge of developing web standards, the World Wide Web Consortium
    (W3C), decided to remove all stylistic markup from HTML and rewrite it completely
    by using XML syntax. This new major revision was called XHTML 1.0.


    The content of the XHTML 1.0 specification was identical to that of HTML 4.01;
    no new elements or attributes were added. As a matter of fact all presentational
    tags and attributes were removed, so XHTML 1.0 had fewer tags and attributes than
    its previous iteration.


    The only major difference between XHTML 1.0 and HTML 4.01 was in the syntax of
    the language. While HTML allowed authors complete freedom in how they structured
    their elements, XHTML required authors to follow the stricter rules of XML, encouraging
    authors to use a single writing style. During this time period, web designers
    embraced the emergence of web standards, so the stricter syntax of XHTML was viewed
    as a “best practice” for writing markup.


    > Note: The publication of XHTML 1.0 coincided with the rise of browser support
    for CSS; therefore it was very easy to completely move all stylistic markup away
    from the structure of the document.


    Then the W3C tried to push XHTML toward an XML-based future. They published XHTML
    1.1 and moved toward XHTML 2, which would be a new, pure language that was backwards
    compatible with neither existing web content nor previous versions of HTML. The
    W3C were starting to formulate theoretically pure standards unrelated to the needs
    of web designers and vendors who wanted emphasis placed on the creation of web
    applications. This caused a schism in the W3C itself, and the dissatisfied people
    formed their own group, the Web Hypertext Application Technology Working Group
    (WHATWG).


    From here the story becomes so convoluted and technical that we will just skip
    to the part in which XHTML 2 never comes to fruition and instead the HTML5 specification
    becomes the new official revision of the HTML language.'
- md: '## HTML5


    Keen to avoid the mistakes of the past, HTML5 was drafted on a series of design
    principles to guide its development. First, HTML5 needed to be flexible enough
    to support existing content, even if most of the existing content is completely
    messy. Second, the specification needed to be powerful enough to support the creation
    of web applications. Straying too far in either direction would cause it to suffer
    the fates of its previous brethren, HTML 4.01 and XHTML 2.


    HTML5 is now the latest version of Hypertext Markup Language, the code that describes
    web pages. It has been designed to deliver almost everything we would want to
    do online without requiring additional software such as browser plugins. HTML5
    does everything from animation to movies and can be used to build incredibly complicated
    applications that will run in our browsers. Moreover, the web applications can
    still work when we are offline, and they can tell websites where we are physically
    located. This revision is also cross-platform, which means it works flawlessly
    on all systems and devices from smartphones to TVs as long as the browser supports
    HTML5.


    Explaining the features and capabilities of HTML5 can fill a few books by itself.
    In the following chapters, we will first take a look at the more common HTML elements
    that have more or less remained the same during all revisions. Then we will focus
    on some of the more recent elements and functionalities exclusive to HTML5.


    ## Chapter 2: Basic Page Structure


    Instead of adding to HTML’s complexity, HTML5 strives to make things more intuitive.
    Therefore, while there is a definite learning curve with the more advanced concepts,
    HTML5 is much easier to learn and understand.


    HTML documents are essentially simple text files that can be built with any text-editing
    application. You don’t need any special software to create webpages. To begin
    it is sufficient to use the most basic text editing software you can find. On
    a Windows machine, this application could be Notepad.


    - In Windows, click on Start and choose All Programs > Accessories > Notepad,
    to open the plain Notepad text editor.

    - In Notepad’s main menu, click on File and choose Save.

    - Select a destination on your computer where you will save your first web page.
    By default, you can select the My Documents folder.

    - In the Save As dialog window, type in sampleCV.html as a File Name and choose
    All Files from the Save As Type menu in order to save the document as a web page
    and not a .txt file.

    - Once all parameters are set, click on the Save button.


    ## Basic Document Template


    Regardless of its content, every web page has the same basic foundation for a
    document structure.


    ## The &lt;html&gt; element


    In an HTML document everything begins and ends with the &lt;html&gt; tag. This
    tag tells the browser that what is being read is an HTML document and should therefore
    be processed as a web page. The &lt;html&gt; tag is also known as the root of
    the HTML document, meaning that every other tag in the document will be placed
    inside this root element. To begin our web page, we will type in &lt;html&gt;&lt;/html&gt;,
    leaving a few rows in between for the other tags.


    ```

    <html>


    </html>

    ```


    > **Note:** When writing tags it is common practice to write the opening and the
    closing tags at the same time and then place the content in between. As there
    will be many tags written throughout web page documents, this makes it easier
    to ensure that all opened tags have been closed.


    In the new HTML5 specification, the &lt;html&gt; tag can be extended with the
    manifest attribute. This attribute accepts the location of a manifest file, which
    in turn contains information on the document’s cache. This means that the browser
    is instructed to store the files listed in the manifest locally on the user’s
    computer in order to allow the user to access the page without an Internet connection.
    The manifest file listed in the attribute is a simple text file that lists the
    resources that the browser should cache for offline access. Except for offline
    browsing, cached resources help the page load faster and decrease the request
    load on the server.


    ## Head and Body


    Web pages are divided into two sections, the head and the body, with each section
    defined with the &lt;head&gt; and &lt;body&gt; tags respectively.


    The &lt;head&gt; tag contains information that describes the HTML document. The
    information placed inside this tag is not displayed in the web browser window,
    but is instead used to define specific functionalities that apply to the web page.
    It can contain a large amount of information such as document title, scripts,
    styles, and meta information. This element can be used only once in a web page.
    It starts immediately after the opening &lt;html&gt; tag and ends directly before
    the &lt;body&gt; tag. It contains no specific attributes that are supported in
    HTML5.


    The body of our HTML document encloses the content of our web page. This is the
    part that visitors will see, including all the content such as text, links, lists
    tables, and images. It contains no specific attributes that are supported in HTML5.
    We will focus more on the body element and its subsequent content in the following
    chapter.


    To create the head and body sections:


    - Directly after the opening HTML tag type &lt;head&gt;.

    - Leave a few spaces for the contents of the head section.

    - Type &lt;/head&gt;.

    - After the second &lt;head&gt; tag, type &lt;body&gt;.

    - Leave a few spaces for the contents of the web page.

    - Type &lt;/body&gt;.


    At this point your document should look like this:


    ```

    <html>

    <head>

    </head>

    <body>




    </body>

    </html>

    ```


    ## Additional Head Tags


    One of the most important elements that is used in the head section of an HTML
    document is the &lt;title&gt; element. It is used to give your document a title,
    and this title is visible in the title bar of the web browser window or the browser
    tab of the viewed page. Additionally, the document title is the default name associated
    with the page when a user bookmarks the page via a browser or a third-party app.
    Finally, the title is also commonly used as the headline in search results from
    search engines like Google, directly affecting web page rankings.


    The &lt;title&gt; element is required in every HTML document, cannot be used more
    than once, and cannot contain any additional tags or formatting rules.


    Another popular HTML element in the head section of a web page is the &lt;meta&gt;
    element. The &lt;meta&gt; element is used to provide information about the document
    itself, such as page description, keywords, document author and other metadata,
    through the use of attributes with name/value pairs. This information is not displayed
    on the page but is accessible to other applications like browsers, search engine
    robots or other web services.


    The most common attribute in a &lt;meta&gt; tag is the charset attribute. This
    attribute specifies the character encoding for the HTML document, and the most
    common value is the utf-8 value. This meta information informs the browser that
    the content inside is encoded using the Unicode (UTF-8) character set. In turn,
    this allows the web browser to use the widest range of character glyphs available,
    so if the webpage is written in a language that uses a different script such as
    Arabic, or Cyrillic for Russian, the actual letters will be available and displayed
    on the screen.


    Additionally, the &lt;head&gt; section can contain links to stylesheets and JavaScript
    files through the &lt;link&gt; tag, or they can be embedded into the document
    with the &lt;style&gt; tag. Stylesheets provide information on how the web page
    should be visually displayed, while scripts provide different kinds of interactivity
    and advanced functionalities. Both stylesheets and scripts are beyond the scope
    of this book.


    - Place the cursor between the opening and closing head tags.

    - Type &lt;meta charset="utf-8" /&gt;

    - Type &lt;title&gt;.

    - Enter the title of our web page (ex. Curriculum Vitae).

    - Type &lt;/title&gt;.'
  mdcn: '

    ## HTML5


    为了避免重蹈覆辙，HTML5在制定时遵循了一系列设计原则来指导其发展。首先，HTML5需要具备足够的灵活性以支持现有内容，即使大部分现有内容可能杂乱无章。其次，规范需要足够强大以支持Web应用程序的开发。若向任一方向偏离过远，都可能导致其重蹈前代HTML
    4.01和XHTML 2的覆辙。


    HTML5是超文本标记语言的最新版本，它是一种用于描述网页的代码。其设计目标是在无需依赖浏览器插件等额外软件的前提下，提供我们在网上几乎想做的一切功能。HTML5能实现从动画到视频的各种效果，并可用于构建极其复杂的、可在浏览器中运行的应用程序。此外，这些Web应用在离线时依然可用，并且能够获取我们所在的真实位置信息。此版本还具备跨平台特性，这意味着只要浏览器支持HTML5，它就能在从智能手机到电视的所有系统和设备上无缝运行。


    阐述HTML5的特性和功能本身就能写满几本书。在接下来的章节中，我们将首先介绍那些在历次修订中基本保持不变的常见HTML元素。然后，我们将重点介绍一些更新的、HTML5独有的元素和功能。


    ## 第2章：基本页面结构


    HTML5致力于让事物更直观，而不是增加HTML的复杂性。因此，尽管掌握更高级的概念存在一定的学习曲线，但HTML5在学习和理解上要容易得多。


    HTML文档本质上是简单的文本文件，可以使用任何文本编辑应用程序构建。你不需要任何特殊软件来创建网页。起步时，只需使用你能找到的最基本的文本编辑软件即可。在Windows机器上，这个应用程序可以是记事本。


    - 在Windows中，点击“开始”菜单，选择“所有程序”>“附件”>“记事本”，打开纯文本编辑器记事本。

    - 在记事本主菜单中，点击“文件”并选择“保存”。

    - 在计算机上选择一个位置来保存你的第一个网页。默认情况下，可以选择“我的文档”文件夹。

    - 在“另存为”对话框中，在“文件名”处输入`sampleCV.html`，并在“保存类型”菜单中选择“所有文件”，以将文档保存为网页而非`.txt`文件。

    - 设置好所有参数后，点击“保存”按钮。


    ## 基本文档模板


    无论内容如何，每个网页都拥有相同的基本文档结构基础。


    ## &lt;html&gt; 元素


    在HTML文档中，一切都始于并终于&lt;html&gt;标签。此标签告知浏览器正在读取的是HTML文档，因此应将其作为网页进行处理。&lt;html&gt;标签也被称为HTML文档的根，意味着文档中的所有其他标签都将放置在此根元素内部。为了开始我们的网页，我们将输入&lt;html&gt;&lt;/html&gt;，并在其之间留出几行空间用于放置其他标签。


    ```

    <html>


    </html>

    ```


    > **注意：** 编写标签时，常见的做法是同时编写开始标签和结束标签，然后将内容置于两者之间。由于网页文档中会编写大量标签，这有助于确保所有已打开的标签都已关闭。


    在新的HTML5规范中，&lt;html&gt;标签可以通过manifest属性进行扩展。此属性接受一个清单文件的位置，该清单文件又包含有关文档缓存的信息。这意味着浏览器被指示将清单中列出的文件存储在用户计算机本地，以便用户在没有互联网连接时也能访问该页面。属性中列出的清单文件是一个简单的文本文件，它列出了浏览器应为离线访问而缓存的资源。除了离线浏览外，缓存资源还有助于页面更快加载，并减少服务器的请求负载。


    ## Head 和 Body


    网页分为两个部分：head和body，分别使用&lt;head&gt;和&lt;body&gt;标签定义。


    &lt;head&gt;标签包含描述HTML文档的信息。放置在此标签内的信息不会在网页浏览器窗口中显示，而是用于定义适用于网页的特定功能。它可以包含大量信息，如文档标题、脚本、样式和元信息。此元素在一个网页中只能使用一次。它始于&lt;html&gt;开始标签之后，终于&lt;body&gt;标签之前。它不包含HTML5支持的特定属性。


    我们HTML文档的body部分包含了网页的内容。这是访客将看到的部分，包括所有内容，如文本、链接、列表、表格和图像。它不包含HTML5支持的特定属性。我们将在下一章更深入地关注body元素及其后续内容。


    要创建head和body部分：


    - 在HTML开始标签后直接输入&lt;head&gt;。

    - 留出几行空间用于head部分的内容。

    - 输入&lt;/head&gt;。

    - 在第二个&lt;head&gt;标签后，输入&lt;body&gt;。

    - 留出几行空间用于网页内容。

    - 输入&lt;/body&gt;。


    此时你的文档应如下所示：


    ```

    <html>

    <head>

    </head>

    <body>




    </body>

    </html>

    ```


    ## 附加的 Head 标签


    HTML文档head部分中最重要的元素之一是&lt;title&gt;元素。它用于为文档设置标题，该标题在浏览器窗口的标题栏或查看页面的浏览器标签中可见。此外，当用户通过浏览器或第三方应用将页面加入书签时，文档标题是与该页面关联的默认名称。最后，标题也常用作搜索引擎（如Google）搜索结果中的标题，直接影响网页排名。


    每个HTML文档都需要&lt;title&gt;元素，它不能使用超过一次，也不能包含任何额外的标签或格式规则。


    网页head部分中另一个常用的HTML元素是&lt;meta&gt;元素。&lt;meta&gt;元素用于通过使用name/value对属性，提供有关文档本身的信息，如页面描述、关键词、文档作者和其他元数据。此信息不会显示在页面上，但可供浏览器、搜索引擎机器人或其他Web服务等其他应用程序访问。


    &lt;meta&gt;标签中最常见的属性是charset属性。此属性指定HTML文档的字符编码，最常见的值是utf-8。此元信息告知浏览器，其内部内容使用Unicode（UTF-8）字符集编码。这反过来又允许Web浏览器使用最广泛的可用字符字形，因此，如果网页是使用不同文字书写的语言（如阿拉伯语或用于俄语的西里尔字母），实际的字母将可用并显示在屏幕上。


    此外，&lt;head&gt;部分可以通过&lt;link&gt;标签包含指向样式表和JavaScript文件的链接，或者通过&lt;style&gt;标签将它们嵌入到文档中。样式表提供了关于网页应如何视觉显示的信息，而脚本则提供不同类型的交互性和高级功能。样式表和脚本都超出了本书的范围。


    - 将光标置于开始和结束的head标签之间。

    - 输入&lt;meta charset="utf-8" /&gt;

    - 输入&lt;title&gt;。

    - 输入我们网页的标题（例如：简历）。

    - 输入&lt;/title&gt;。

    '
