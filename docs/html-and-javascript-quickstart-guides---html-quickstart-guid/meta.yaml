    \ Web Designer</p>\n    <p><strong>Date of birth:</strong> 09/09/1980</p>\n  \
    \  <p><strong>Address:</strong><br>\n    523 Beaumont Way<br>\n    Santa Rosa<br>\n\
    \    California 52409</p>\n</section>\n<hr>\n<section>\n    <h2>Education</h2>\n\
    \    <ul>\n        <li>MIT\n            <ul>\n                <li>PhD Degree in\
    \ Computer Science</li>\n                <li>Bachelor Degree in Computer Science</li>\n\
    \            </ul>\n        </li>\n        <li>Santa Rosa High School</li>\n \
    \   </ul>\n</section>\n<hr>\n<section>\n    <h2 id=\"skills\">Skills</h2>\n  \
