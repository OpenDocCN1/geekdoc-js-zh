    \n**Date of birth:** 09/09/1980\n\n**Address:**\n523 Beaumont Way\nSanta Rosa\n\
    California 52409\n\n---\n\n## Education\n\n- MIT\n    - PhD Degree in Computer\
    \ Science\n    - Bachelor Degree in Computer Science\n- Santa Rosa High School\n\
    \n## Skills\n\n| Web Technology | Skill Level |\n| :--- | :--- |\n| HTML | Expert\
    \ |\n| CSS | Expert |\n| JavaScript | Advanced |\n\n## Portfolio\n\nI have worked\
    \ as a freelance web designer for the following companies:\n\n- H<sub>2</sub>O\
    \ Wireless - a broadband Internet provider\n- DSQUARED<sup>2</sup> - an international\
    \ fashion house\n\n**Image 16.** Partial View of Sample CV\n\n# HTML Comments\n\
    \nA comment is a piece of code that is fully ignored by any web browser. The reason\
    \ for its existence is to either provide information about the code or to remove\
    \ sections of the code but leave them available for later use. Comments can even\
    \ act as notifications and reminders in your HTML. In alignment with good practice,\
    \ we add comments into our HTML code, especially in complex documents, to indicate\
    \ sections of a document. This will help us and others to better understand the\
    \ code and increase its readability.\n\nWe can create an HTML comment using the\
    \ character sequence `<!--` to mark the start of the comment, and the character\
    \ sequence `-->` to mark the end of the comment. When parsing the document, the\
    \ web browser will automatically ignore everything placed between these two markers,\
    \ regardless of whether it is plain content or HTML markup. The following example\
    \ puts an HTML comment before the Education section.\n\n```\n<hr>\n\n<!-- Starting\
    \ Education section-->\n\n<h2>Education</h2>\n```\n\nWe can place our comments\
    \ in multiple lines as long as `<!--` is placed before the first line and `-->`\
    \ is placed after the last line. However, the double-dash sequence “—” may not\
    \ appear inside a comment except as part of the closing `-->` tag. This prevents\
    \ comment nesting, as a comment cannot be nested inside another comment without\
    \ the double-dash. Additionally, we must make sure that there are no spaces in\
    \ the start-of-comment string between ‘<’ and ‘!’, meaning that < !— will not\
    \ be rendered properly. For example, if we comment out the list in the Portfolio\
    \ section in the final document, the browser will only display the paragraph text.\n\
    \n```\n<h2 id=\"portfolio\">Portfolio</h2>\n\n<p>I have worked as a freelance\
    \ web designer for the following companies</p>\n\n<!--\n\n<ul>\n\n    <li>H<sub>2</sub>O\
    \ Wireless - a broadband Internet provider</li>\n\n    <li>DSQUARED<sup>2</sup>\
    \ - an international fashion house</li>\n\n</ul>\n\n-->\n```\n\n**Image 17.**\
    \ Invisible Commented List\n\n## Portfolio\n\nI have worked as a freelance web\
    \ designer for the following companies\n\n## Wrapping Things Up\n\nThere are a\
    \ lot more tags and attributes in the HTML5 specification, but the content in\
    \ this book is sufficient for starters. The purpose of any type of markup is to\
    \ add meaning to a document; we can even think of going through a book with a\
    \ highlighter pen as adding markup to a document. As it was mentioned previously,\
    \ when HTML first appeared, the purpose of markup was to explain the structure\
    \ of a document—what text represents a heading, what is a paragraph, what is a\
    \ bulleted point, and so on. As it grew in popularity, HTML started to include\
    \ markup that controlled the appearance of documents. HTML5 aims to return the\
    \ markup function to solely describing the structure and semantics of the document.\n\
    \nAlmost all HTML elements are interpreted by web browsers and presented in a\
    \ different manner from each other. For example, the <h1> to <h6> elements are\
    \ all presented differently from the content of a <p> element; list items in an\
    \ <ol> element are presented differently from those in a <ul> element. However,\
    \ all of these elements describe the structure of the document: what is a heading,\
    \ what is an item in a numbered list, and so on. The way the content of these\
    \ elements is presented reflects the structure that the markup imposes, which\
    \ is why the heading elements get smaller from <h1> through to <h6>, and why the\
    \ <li> elements create separate numbered items or bulleted points depending on\
    \ whether they are contained inside an <ol> or <ul> element.\n\nElements that\
    \ describe a document’s structure are very different from those that just affect\
    \ the presentation of the document without adding any meaning. Therefore, HTML5\
    \ cuts these purely presentational elements and attributes from HTML.\n\n# Chapter\
    \ 4: Content Structure\n\nHTML5 is all about the semantics. Semantic elements\
    \ add meaning and structure to the content of our pages by letting us identify\
    \ the logical purpose of its different areas.\n\nBefore defining the specifications,\
    \ HTML5 contributors analyzed existing web pages to determine their common elements.\
    \ Consequently, HTML5 now includes new elements that are solely used to define\
    \ meaning and structure. These elements are used for grouping related content\
    \ together, defining which parts of the content are header, footer or main body\
    \ elements, describing navigational menus, etc. The website user is never aware\
    \ of this information, but many tools use it. For example, search engines use\
    \ the semantic elements to learn more about our page. Screen reading programs\
    \ present the content more effectively, as semantic elements create more accessible\
    \ content. Other tools can be used to extract data from our page and use it in\
    \ a variety of different ways, like presenting it in a newsfeed.\n\n## Sectioning\
    \ Content\n\nSectioning content is used to divide an HTML document into sections.\
    \ Every section of the document would generally have its own header, main content\
    \ and possibly footer.\n\nIn HTML revisions prior to HTML5, more notably HTML\
    \ 4 and XHTML 1, the choices for sectioning content were rather limited. The only\
    \ sectioning elements designers had to work with were the <body> and <div> tags;\
    \ <div> is a generic element used to signify a division. This made the semantic\
    \ markup of a document virtually impossible and made it difficult for screen readers\
    \ and other assistive devices to evaluate a page. The new HTML5 semantic markup\
    \ makes it easy for machines and people alike to understand the content’s meaning\
    \ and context and provides a way to differentiate the key content from sidebars\
    \ or unrelated information.\n\nEach semantic element of HTML5 has no specific\
    \ output, color, or design. Unless it has been styled with CSS, each semantic\
    \ element will be invisible, and its contents will appear drab and monotone when\
    \ viewed in a web browser.\n\n> *Note: Theoretically, sectioning elements allow\
    \ us to create document outlines using headings, form titles, table titles, and\
    \ any other appropriate landmarks that map out the document. The outlining algorithm\
    \ has been clearly defined in the HTML5 spec, but browsers and assistive technologies\
    \ have not yet implemented it.*"
