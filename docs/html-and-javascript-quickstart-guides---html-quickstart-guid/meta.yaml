    \ 和 JavaScript。\n\n## 作品集\n\n我曾为以下公司担任自由网页设计师：\n\n- H₂O Wireless - 一家宽带互联网服务提供商\n\
    - DSQUARED² - 一家国际时装公司\n\n## 表格\n\n当我们想要标记最适合以表格形式呈现的数据时，需要创建 HTML 表格。表格数据通常让我们想到电子表格，但\
    \ HTML 表格与电子表格表格略有不同，因为它们由行和行中的单元格组成。无需定义列数，因为每一行中的单元格数量决定了表格将有多少列。不过，标记表格数据相对容易，因为\
    \ HTML 为我们提供了大量的语义元素来组织数据。\n\n每个 HTML 表格的起点都是 `<table>` 元素。让我们开始向示例简历的技能部分添加一个表格。\n\
    \n```html\n<table>\n</table>\n```\n\n仅使用 `<table>` 标签不足以创建表格；我们需要用 `<tr>` 元素添加表格行。\n\
    \n```html\n<table>\n    <tr>\n    </tr>\n</table>\n```\n\n最后，我们需要在该行中添加几个单元格，以便在浏览器中显示一个基本的表格。在讨论\
    \ HTML 表格语义时，我们必须知道有两种类型的元素来表示表格单元格：`<td>` 和 `<th>`。`<td>` 元素代表表格数据，表示一个包含数据的常规单元格。`<th>`\
    \ 元素代表表头，定义一个包含表格行或列标题的单元格。\n\n在我们的示例中，第一行我们将插入两个标题单元格，一个用于“网页技术”，另一个用于“技能水平”。\n\
    \n```html\n<table>\n    <tr>\n        <th>Web Technology</th>\n        <th>Skill\
    \ Level</th>\n    </tr>\n</table>\n```\n\n为了完成表格，我们将再插入三行。在这些行中，我们将使用 `<td>` 元素而不是\
    \ `<th>` 来表示单元格，因为这些单元格将包含实际数据而非标题。我们最终的表格代码将如下所示：\n\n```html\n<table>\n    <tr>\n\
    \        <th>Web Technology</th>\n        <th>Skill Level</th>\n    </tr>\n  \
    \  <tr>\n        <td>HTML</td>\n        <td>Expert</td>\n    </tr>\n    <tr>\n\
    \        <td>CSS</td>\n        <td>Expert</td>\n    </tr>\n    <tr>\n        <td>JavaScript</td>\n\
    \        <td>Advanced</td>\n    </tr>\n</table>\n```\n\n![](img/f8023be36714e65595b822db3c227be4_61_0.png)\n\
    \n这个基础表格没有任何边框，但数据以整齐排列的行列形式呈现。边框和额外的视觉表格属性通过 CSS 来管理。\n\n> **注意：** *表格有着悠久的网络历史。虽然最初仅为容纳表格数据而设计，但很快就被误用于一个更大的任务：作为复杂页面布局的基础，这些布局在\
    \ CSS 出现之前是不可能实现的。*\n\n我们的示例简历现在具有以下结构：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <title>Curriculum Vitae</title>\n</head>\n\
    <body>\n<h1>Curriculum Vitae</h1>\n<h2>Personal Info</h2>\n<p><strong>Name:</strong>\
    \ Scott Johnson</p>\n<p><strong>Occupation:</strong> Web Designer</p>\n<p><strong>Date\
    \ of birth:</strong> 09/09/1980</p>\n<p><strong>Address:</strong><br>\n523 Beaumont\
    \ Way<br>\nSanta Rosa<br>\nCalifornia 52409</p>\n<hr>\n<h2>Education</h2>\n<ul>\n\
    \    <li>MIT</li>\n    <ul>\n        <li>PhD Degree in Computer Science</li>\n\
    \        <li>Bachelor Degree in Computer Science</li>\n    </ul>\n    <li>Santa\
    \ Rosa High School</li>\n</ul>\n<hr>\n<h2>Skills</h2>\n<table>\n    <tr>\n   \
    \     <th>Web Technology</th>\n        <th>Skill Level</th>\n    </tr>\n    <tr>\n\
    \        <td>HTML</td>\n        <td>Expert</td>\n    </tr>\n    <tr>\n       \
    \ <td>CSS</td>\n        <td>Expert</td>\n    </tr>\n    <tr>\n        <td>JavaScript</td>\n\
    \        <td>Advanced</td>\n    </tr>\n</table>\n<hr>\n<h2>Portfolio</h2>\n<p>I\
    \ have worked as a freelance web designer for the following companies:</p>\n<ul>\n\
    \    <li>H₂O Wireless - a broadband Internet provider</li>\n    <li>DSQUARED²\
    \ - an international fashion house</li>\n</ul>\n```\n\n## 特殊字符\n\n并非网络上所有可用的字符都存在于我们的键盘上。那么当我们想要添加像版权符号\
    \ (©) 或度数符号 (°) 这样的特殊字符时该怎么办呢？HTML 支持所有这些字符以及大约 250 个相关字符，包括数学符号和特殊字母。要将它们添加到我们的网页中，我们需要使用所谓的\
    \ HTML 字符实体。HTML 字符实体以与号 (&) 符号开始，后跟一个关键字（或 ASCII 码），并以分号 (;) 符号结束。例如，不间断空格的 HTML\
    \ 字符代码将写作 &nbsp;。\n\n其他 HTML 字符实体在下表中列出：\n\n| 字符 | 字符名称 | 代码 |\n|---|---|---|\n\
    | < | 左尖括号 | &lt; |\n| > | 右尖括号 | &gt; |\n| & | 与号 | &amp; |\n| \" | 双引号 | &quot;\
