    \ their attributes and the order in which they appear is remembered by the browser.\
    \ This representation is called the Document Object Model (DOM) and it is used\
    \ to provide information to JavaScript how to communicate with the web page elements.\
    \ Additionally, the DOM provides tools which can be used to navigate or modify\
    \ the HTML code.\nThe Document Object Model is a standard defined by the World\
    \ Wide Web Consortium (W3C) that is used by most browser developers. To better\
    \ understand the DOM, let us first take a look at a very simple web page:\n\n\
