  md: "# Conditional Statements\n\nWe make a myriad of choices during our everyday\
    \ activities: *“Should I get out of bed?”*, *“What should I eat?”*, *“Where should\
    \ I go for coffee?”*. These choices depend on the current situation as our decisions\
    \ are affected by the surrounding circumstances. In a similar fashion, JavaScript\
    \ also has decision-making capabilities called conditional statements. Fundamentally,\
    \ conditional statements are a simple yes or no question with the program doing\
    \ one thing if the answer is yes, and either nothing or another thing if the answer\
    \ is no.\n\nThe most basic conditional statement is the so-called if statement.\
    \ This statement executes a task only if the answer to the question is true. To\
    \ understand the syntax of an if statement let us look at the following example:\n\
    \n```\nvar age = prompt(\"What is your age?\",\"\");\n\nif (age > 30) {\n    document.write\
    \ (\"You are not so young anymore.\");\n}\n```\n\nThe if statement consists of\
    \ three parts. The if keyword indicates that what follows is a conditional statement.\
    \ The parentheses, (), contain the yes/no question, also known as the condition.\
    \ Finally, the curly braces, {} , contain one or more statements that need to\
    \ be executed if the answer to the question is positive. Essentially, the { brace\
    \ marks the beginning and the } brace marks the end of the code that will be run\
    \ if the condition is fulfilled.\n\nIn our example, the condition is a comparison\
    \ between two values. With the condition (age>30) we check whether the age variable\
    \ has a value greater than 30. If the condition is true then the statement to\
    \ write the text within the brackets on the web page is executed, otherwise, if\
    \ false, the interpreter will skip all of the statements within the curly brackets."
