    \ ); // 3\n```\n\n# 私有类字段 (Private Class Fields)\n\nES6 类中的所有属性默认公共，可以在类外部检查或修改。在上面的\
    \ Animal 示例中，没有任何机制阻止在不调用 `eats` setter的情况下更改 `food` 属性：\n\n```javascript\nclass\
