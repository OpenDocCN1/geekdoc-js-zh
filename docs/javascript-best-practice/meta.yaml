  - '[PAGE 19]


    # Build Tools


    The code that we write the same code that will go to production. We write code
    in a modern version of JavaScript that may not be supported by the browser, we
    make heavy use of third-party packages that are in a node_modules folder along
    with their own dependencies, we can have processes like static analysis tools
    or minifiers, etc. Build tooling exists to help transform all this into something
    that can be deployed efficiently and that''s understood by most browsers.


    # Module bundling


    When writing clean, reusable code with ES2015/CommonJS modules, we need some way
    to load these modules (at least until browsers support ES2015 module loading natively).
    Including a bunch of script tags in your HTML isn''t really a viable option, as
    it would quickly become unwieldy for any serious application, and all separate
    HTTP requests would hurt performance.


    We can include all the modules where we need them using the import statement from
    CommonJS and use a module bundler to combine everything together into one or more
    files (bundles). It''s bundled file that we''re going to upload to our server
    and include in our HTML. It will include all your imported modules and their necessary
    dependencies.


    There are currently a couple of popular options for this, the most popular ones
    being Webpack, Browserify and Rollup.js. You can choose one or another depending
    on your needs.


    # Further Reading on Module Bundling


    If you want to learn about module bundling and how it fits into the bigger picture
    of app development, I recommend reading Understanding JavaScript Modules: Bundling
    & Transpiling.


    # Transpilation


    While support for modern JavaScript is pretty good among newer browsers, your'
  - '[PAGE 20]


    target audience may include legacy browsers and devices with partial or no support.


    In order to make our modern JavaScript work, we need to translate the code to
    write in an earlier version (usually ES5). The standard tool for this task is
    Babel — a compiler that translates your code into compatible code for most browsers.
    In this way, you don''t have to wait for vendors to implement everything; you
    can just use all the modern JS features.


    There are a couple of features that need more than a syntax translation. Babel
    includes a Polyfill that emulates some of the machinery required for some complex
    features such as promises.


    # Build systems & task runners


    Module bundling and transpilation are just two of the build processes that we
    may need in our projects. Others include code minification (to reduce file sizes),
    tools for analysis, and perhaps tasks that don''t have anything to do with JavaScript,
    like image optimization or CSS/HTML pre-processing.


    The management of tasks can become a laborious thing to do, and we need a way
    to handle it in an automated way, being able to execute everything with simpler
    commands. The two most popular tools for this are Grunt.js and Gulp.js, which
    provide a way to organize your tasks into groups in an ordered way.


    For example, you have a command gulp build which may run a code linter, the transpilation
    process with Babel, and module bundling with Browserify. Instead of having to
    remember three commands and their associated arguments in order, we just execute
    one that will handle the whole process automatically.


    Whenever you find yourself manually organizing processing steps for your project,
    think if it can be automated with a task runner.


    # Further Reading on Gulp.js


    Further reading: An Introduction to Gulp.js.'
- md: "\n# Application Architecture\n\nWeb applications have different requirements\
    \ from websites. For example, while page reloads may be acceptable for a blog,\
    \ that's certainly not the case for an application like Google Docs. Your application\
    \ should behave as closely as possible to a desktop type. Otherwise, the usability\
    \ will be compromised.\n\nOld-style web applications were usually done by sending\
    \ multiple pages from a web server, and when a lot of dynamism was needed, content\
    \ was loaded via Ajax by replacing chunks of HTML according to user actions. Although\
    \ it was a big step forward to a more dynamic web, it certainly had its complications.\
    \ Sending HTML fragments or even pages on each user action represented a waste\
    \ of resources — especially of time, from the user's perspective. The usability\
    \ still didn't match the responsiveness of desktop applications.\n\nLooking to\
    \ improve things, we created two new methods to build web applications — from\
    \ the way we present them to the user, to the way we communicate between the client\
    \ and the server. Although the amount of JavaScript required for an application\
    \ also increased drastically, the result is applications that behave closely to\
    \ native ones, without page reloading or extensive waiting periods each time we\
    \ click a button.\n\n# Single Page Applications (SPAs)\n\nThe most common, high-level\
    \ architecture for web applications is called SPA, which stands for Single Page\
    \ Application. SPAs are big blobs of JavaScript that contain everything the application\
    \ needs to work properly. The UI is rendered entirely client-side, so no reloading\
    \ is required. The only thing that changes is the data inside the application,\
    \ which is usually handled with a remote API via Ajax or another asynchronous\
    \ method of communication.\n\nOne downside to this approach is that the application\
    \ takes longer to load the first time. Once it has been loaded, however, transitions\
    \ between views (pages) are generally a lot quicker, since it's only pure data\
    \ being sent between client and server.\n\n# Universal / Isomorphic Applications\n\
    \nAlthough SPAs provide a great user experience, depending on your needs, they\
    \ might not be the optimal solution — especially if you need quicker initial response\
    \ times or optimal indexing by search engines.\n\nThere's a fairly recent approach\
    \ to solving these problems, called Isomorphic (or Universal) JavaScript applications.\
    \ In this type of architecture, most of the code can be executed both on the server\
    \ and the client. You can choose what you want to render on the server for a faster\
    \ initial page load, and after that, the client takes over the rendering while\
    \ the user is interacting with the app. Because pages are initially rendered on\
    \ the server, search engines can index them properly.\n\n# Deployment\n\nWith\
    \ modern JavaScript applications, the code you write is not the same as the code\
    \ that you deploy for production: you only deploy the result of your build process.\
    \ The workflow to accomplish this can vary depending on the size of your project,\
    \ the number of developers working on it, and sometimes the tools/libraries you're\
    \ using.\n\nFor example, if you're working alone on a simple project, each time\
    \ you're ready for deployment you can just run the build process and upload the\
    \ resulting files to a web server. Keep in mind that you only need to upload the\
    \ resulting files from the build process (transpilation, module bundling, minification,\
    \ etc.), which can be just one .js file containing your entire application and\
    \ dependencies.\n\nYou can have a directory structure like this:\n\n```\ndist\n\
    \  app.js\n  index.html\nnode_modules\n  src\n    lib\n      login.js\n      user.js\n\
    \    app.js\n    index.html\ngulpfile.js\npackage.json\nREADME\n```\n\nYou thus\
    \ have all of your application files in a src directory, written in ES2015+, importing\
    \ packages installed with npm and your own modules from a lib directory.\n\nThen\
    \ you can run Gulp, which will execute the instructions from a gulpfile.js to\
    \ build your project — bundling all modules into one file (including the ones\
    \ installed with npm), transpiling ES2015+ to ES5, minifying the resulting file,\
    \ etc. Then you can configure it to output the result in a convenient dist directory.\n\
    \n### Files That Matter\n\nIf you have files that don't need any processing, you\
    \ can just copy them from src to the dist directory. You can configure a task\
    \ for that in your build system.\n\nNow you can just upload the files from the\
    \ dist directory to a web server, without having worry about the rest of the files,\
    \ which are only useful for development.\n\n# Team development\n\nIf you're working\
    \ with other developers, it's likely you're also using a shared code repository,\
    \ like GitHub, to store the project. In this case, you can run the build process\
    \ right before making commits and store the result with the other files in the\
    \ Git repository, to later be downloaded onto a production server.\n\nHowever,\
    \ storing built files in the repository is prone to errors if several developers\
    \ are working together, and you might want to keep everything clean from build\
    \ artifacts. Fortunately, there's a better way to deal with that problem: you\
    \ can put a service like Jenkins, Travis CI, CircleCI, etc. in the middle of the\
    \ process, so it can automatically build your project after each commit is pushed\
    \ to the repository. Developers only have to worry about pushing code changes\
    \ without building the project first each time. The repository is also kept clean\
    \ of automatically generated files, and at the end, you still have the built files\
    \ available for deployment.\n\n# Conclusion\n\nThe transition from simple web\
    \ pages to modern JavaScript applications can seem daunting if you've been away\
    \ from web development in recent years, but I hope this article was useful as\
    \ a starting point. I've linked to more in-depth articles on each topic where\
    \ possible so you can explore further.\n\nAnd remember that if at some point,\
    \ after looking all the options available, everything seems overwhelming and messy,\
    \ just keep in mind the KISS principle, and use only what you think you need and\
    \ not everything you have available. At the end of the day, solving problems is\
    \ what matters, not using the latest of everything.\n\n# Chapter 2: Clean Code\
    \ with ES6 Default Parameters & Property Shorthands\n\nby Moritz Kröger\n\nCreating\
    \ a method also means writing an API — whether it’s for yourself, another developer\
    \ on your team, or other developers using your project. Depending on the size,\
    \ complexity, and purpose of your function, you have to think of default settings\
    \ and the API of your input/output.\n\nDefault function parameters and shorthands\
    \ are two handy features of ES6 that can help you write your API.\n\n# ES6 Default\
    \ Parameters\n\nLet’s freshen up our knowledge quickly and take a look at the\
    \ syntax again.\nDefault parameters allow us to initialize functions with default\
    \ values. A default is used when an argument is either omitted or undefined —\
    \ meaning null is a valid value. A default parameter can be anything from a number\
    \ to another\n\n```\n// Basic syntax\nfunction multiply(a, b = 2) {\n  return\
    \ a * b;\n}\nmultiply(5); // 10\n\n// Default parameters are also available to\
    \ later default\nfunction foo(num = 1, multi = multiply(num)) {\n  return [num,\
    \ multi];\n}\nfoo(); // [1, 2]\nfoo(6); // [6, 12]\n```\n\n# A realworld example\n\
    \nLet's take a basic function and demonstrate how default parameters can speed\
    \ up your development and make the code better organized.\n\nOur example method\
    \ is called createElement(). It takes a few configuration arguments, and returns\
    \ an HTML element. The API looks like this:\n\n```\n// We want a <p> element,\
    \ with some text content and two classes attached.\n// Returns <p class=\"very-special-text\
    \ super-big\">Such unique text</p>\ncreateElement('p',\n  content: 'Such unique\
    \ text',\n  classNames: ['very-special-text', 'super-big']\n);\n\n// To make this\
    \ method even more useful, it should always return a default\n// element when\
    \ any argument is left out or none are passed at all.\n```\n"
  mdcn: "\n\n# 应用架构\n\nWeb 应用程序与网站有不同的要求。例如，对于博客来说，页面刷新是可以接受的，但对于像 Google Docs 这样的应用则完全不是。你的应用程序行为应该尽可能接近桌面类型，否则易用性将受到影响。\n\
    \n旧式的 Web 应用通常通过从 Web 服务器发送多个页面来实现，当需要大量动态效果时，通过 Ajax 根据用户操作替换 HTML 块来加载内容。虽然这是向更动态的\
    \ Web 迈出的巨大一步，但它确实存在其复杂性。每次用户操作都发送 HTML 片段甚至页面都是资源的浪费——从用户的角度来看，尤其是时间的浪费。其易用性仍然无法匹配桌面应用的响应速度。\n\
    \n为了改进这些，我们创建了两种构建 Web 应用的新方法——从我们向用户展示的方式到客户端与服务器之间的通信方式。虽然应用程序所需的 JavaScript\
    \ 数量也大幅增加，但结果是应用程序的行为非常接近原生应用，每次点击按钮时无需重新加载页面或长时间的等待。\n\n# 单页应用 (SPAs)\n\nWeb\
    \ 应用最常见的高层架构被称为 SPA，全称单页应用（Single Page Application）。SPA 是巨大的 JavaScript 集合，包含了应用程序运行所需的所有内容。UI\
    \ 完全在客户端渲染，因此不需要重新加载。唯一变化的是应用程序内部的数据，这些数据通常通过 Ajax 或另一种异步通信方法通过远程 API 处理。\n\n\
    这种方法的一个缺点是应用程序首次加载时间较长。然而，一旦加载，视图（页面）之间的切换通常要快得多，因为客户端和服务器之间传输的是纯数据。\n\n# 通用 /\
    \ 同构应用 (Universal / Isomorphic Applications)\n\n尽管 SPA 提供了极的用户体验，但根据你的需求，它们可能不是最佳解决方案——如果你需要更快的初始响应时间或搜索引擎的最优索引时。\n\
    \n有一种相当新的解决这些问题的方法，被称为同构（或通用）JavaScript 应用。在这种类型的架构中，大部分代码可以同时在服务器和客户端上执行。你可以选择在服务器上渲染的内容，以获得更快的初始页面加载，之后在用户与应用交互时，由客户端接管渲染。由于页面最初是在服务器上渲染的，搜索引擎可以正确地索引它们。\n\
    \n# 部署\n\n在现代 JavaScript 应用中，你编写的代码与你部署到生产环境的代码不同：你只部署构建过程的结果。实现此点的的工作流取决于项目规模、参与开发者数量，有时还取决于你使用的工具/库。\n\
    \n例如，如果你独自开发一个简单的项目，每当你准备好部署时，只需运行构建过程并将生成的文件上传到 Web 服务器即可。请记住，你只需要上传构建过程产生的文件（转译、模块打包、压缩等），这可能只是一个包含你整个应用程序和依赖的单个\
    \ .js 文件。\n\n你可以拥有这样的目录结构：\n\n```\ndist\n  app.js\n  index.html\nnode_modules\n\
    \  src\n    lib\n      login.js\n      user.js\n    app.js\n    index.html\ngulpfile.js\n\
    package.json\nREADME\n```\n\n因此，你所有的应用程序文件都在 `src` 目录中，使用 ES2015+ 编写，导入了通过 npm\
    \ 安装的包以及来自 `lib` 目录的自定义模块。\n\n然后你可以运行 Gulp，它将执行 `gulpfile.js` 中的指令来构建你的项目——将所有模块打包成一个文件（包括通过\
    \ npm 安装的模块）、将 ES2015+ 转译为 ES5、压缩结果文件等。你可以配置它将结果输出到方便的 `dist` 目录中。\n\n### 重要的文件\n\
    \n如果你有不需要任何处理的文件，可以直接将它们从 `src` 拷贝到 `dist` 目录。你可以在你的构建系统中为此配置一个任务。\n\n现在你只需要将\
    \ `dist` 目录中的文件上传到 Web 服务器，而无需担心其他文件（它们仅对开发有用）。\n\n# 团队开发\n\n如果你与其他开发者一起工作，你可能还会使用共享代码仓库（如\
    \ GitHub）来存储项目。在这种情况下，你可以在提交之前运行构建过程，并将结果与其他文件一起存储在 Git 仓库中，稍后下载到生产服务器。\n\n然而，如果有多个开发者共同工作，在仓库中存储构建后的文件很容易出错，而且你可能希望保持一切不被构建产物污染。幸运的是，有一种更好的处理该问题的方法：你可以在过程中间加入\
    \ Jenkins、Travis CI、CircleCI 等服务，这样它可以在每次提交推送到仓库后自动构建你的项目。开发者只需要担心推送代码更改，而不需要每次都先构建项目。仓库也会保持没有自动生成的文件，而且最后，你仍然拥有可部署的构建文件。\n\
    \n# 结论\n\n如果你已经离开 Web 开发几年了，从简单的 Web 页面到现代 JavaScript 应用的转变可能看起来望而生畏，但我希望这篇文章可以作为一个起点。我尽可能为每个主题链接了更深入的文章，以便你进一步探索。\n\
    \n并记住，如果在某一点，在查看了所有可用选项后，一切看起来都难以应对且混乱，请记住 KISS 原则（保持简单），只使用你认为需要的，而不是你拥有的。根结底，解决问题才是重要的，而不是使用最新的一切。\n\
    \n# 第 2 章：使用 ES6 默认参数与属性简写编写洁代码\n\n作者 Moritz Kröger\n\n创建一个方法意味着编写一个 API——无论是为了你自己、团队中的其他开发者，还是使用你项目的其他开发者。根据你函数的规模、复杂性和目的，你必须考虑默认设置以及输入输出的\
    \ API。\n\n默认函数参数和简写是 ES6 的两个实用特性，可以帮助你编写 API。\n\n# ES6 默认参数\n\n让我们快速复习一下知识并再次查看语法。默认参数允许我们用默认值初始化函数。当参数缺失或为\
    \ `undefined` 时会使用默认值——这意味着 `null` 是一个有效值。默认参数可以是从数字到其他任何类型\n\n```\n// 基础语法\n\
    function multiply(a, b = 2) {\n  return a * b;\n}\nmultiply(5); // 10\n\n// 默认参数也可以用于后置默认\n\
    function foo(num = 1, multi = multiply(num)) {\n  return [num, multi];\n}\nfoo();\
    \ // [1, 2]\nfoo(6); // [6, 12]\n```\n\n# 真实世界示例\n\n让我们来看一个基础函数，演示默认参数如何加速你的开发并使代码组织更良好。\n\
    \n我们的示例方法名为 `createElement()`。它接受几个配置参数并返回一个 HTML 元素。API 看起来如下：\n\n```\n// 我们想要一个\
    \ <p> 元素，带有一些文本内容并附加两个类名。\n// 返回 <p class=\"very-special-text super-big\">Such\
    \ unique text</p>\ncreateElement('p',\n  content: 'Such unique text',\n  classNames:\
    \ ['very-special-text', 'super-big']\n);\n\n// 为了让这个方法更有用，当省略任何参数或未传递参数时，\n//\
    \ 它应该始终返回一个默认元素。\n```\n\n"
