    \nSitePoint specializes in publishing fun, practical, and easy-to-understand content\
    \ for web professionals. Visit http://www.sitepoint.com/ to access our blogs,\
    \ books, newsletters, articles, and community forums. You'll find a stack of information\
    \ on JavaScript, PHP, design, and more.\n\n## Preface\n\nThere’s no doubt that\
    \ the JavaScript ecosystem changes fast. Not only are new tools and frameworks\
    \ introduced and developed at a rapid rate, the language itself has undergone\
    \ big changes with the introduction of ES2015 (aka ES6). Understandably, many\
    \ articles have been written complaining about how difficult it is to learn modern\
    \ JavaScript development these days. We're aiming to minimize that confusion with\
    \ this set of books on modern JavaScript.\n\nThis book presents modern JavaScript\
    \ best practice, utilizing the features now available in the language, enabling\
    \ you to write more powerful code that is clean, performant, maintainable, and\
    \ reusable.\n\n# Who Should Read This Book?\n\nThis book is for all front-end\
    \ developers who wish to improve their JavaScript skills. You’ll need to be familiar\
    \ with HTML and CSS and have a reasonable level of understanding of JavaScript\
    \ in order to follow the discussion.\n\n# Conventions Used\n\n### Code Samples\n\
    \nCode in this book is displayed using a fixed-width font, like so: `<h1>A Perfect\
    \ Summer's Day</h1><p>It was a lovely day for a walk in the park. The birds were\
    \ singing and the kids were all back at school.</p>`\n\nWhere existing code is\
    \ required for context, rather than repeat all of it, will be displayed: `function\
    \ animate() { new_variable = \"Hello\"; }`\n\nSome lines of code should be entered\
    \ on one line, but we've had to wrap them because of page constraints. An ➤ indicates\
    \ a line break that exists for formatting purposes only, and should be ignored:\
    \ `URL.open(\"http://www.sitepoint.com/responsive-web-design-real-user-testing/?responsive1\"\
    );`\n\nYou'll notice we've used certain layout styles throughout this book to\
    \ signify different types of information. Look out for the following items.\n\n\
    ### Tips, Notes, and Warnings\n\nHey, You!\n\nTips provide helpful little pointers.\n\
