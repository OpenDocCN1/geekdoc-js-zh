  md: "# Async/Await\n\nPromises can be daunting, so ES2017 introduced async await.\
    \ While it may only be syntactical sugar, it makes Promises far sweeter, and you\
    \ can avoid .then() chains altogether. Consider the Promise-based example below:\n\
    \n```\nfunction connect() {\n  return new Promise((resolve, reject) => {\n   \
    \ asyncDBconnect('http://localhost:1234')\n      .then(asyncGetSession)\n    \
    \  .then(asyncGetUser)\n      .then(asyncLogAccess)\n      .then(result => resolve(result))\n\
    \      .catch(err => reject(err))\n  });\n}\n\n// run connect (self-executing\
    \ function)\n(() => {\n  connect();\n  .then(result => console.log(result))\n\
    \  .catch(err => console.log(err))\n})();\n```\n\nTo rewrite this using async/await:\
    \ and\n\n+   1. the outer function must be preceded by an async statement,\n2.\
    \ calls to asynchronous Promise-based functions must be preceded by await to ensure\
    \ processing completes before the next command executes.\n\n```\nasync function\
    \ connect() {\n  try {\n    const connection = await asyncDBconnect('http://localhost:1234'),\n\
    \    session = await asyncGetSession(connection),\n    user = await asyncGetUser(session),\n\
    \    log = await asyncLogAccess(user);\n\n    return log;\n```"
