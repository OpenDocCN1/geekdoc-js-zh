  md: "# Package Management\n\nOther languages have long had their own package repositories\
    \ and managers to make it easier to find and install third-party libraries and\
    \ components. Node.js comes with its own package manager and repository, npm.\
    \ Although there are other package managers available, npm has become the facto\
    \ JavaScript package manager and is said to be the largest registry in the world.\n\
    \nIn the npm repository you can find third-party modules that you can easily download\
    \ and use in your projects with a single npm install <package> command. The packages\
    \ are downloaded into a local node_modules directory, which contains all the packages\
    \ and their dependencies.\n\nThe packages that you download can be registered\
    \ as dependencies of your project in a package.json file, along with information\
    \ about your project or module (which can be published as a package on npm).\n\
    \nYou can define separate dependencies for both development and production. While\
    \ the production dependencies are needed for the package to work, the development\
    \ dependencies are only necessary for the developers of the package.\n\n# Example\
    \ package.json file\n\n```\n{\n  \"name\": \"demo\",\n  \"version\": \"1.0.0\"\
    ,\n  \"description\": \"Demo package.json\",\n  \"main\": \"main.js\",\n  \"dependencies\"\
    : {\n    \"mkdirp\": \"^0.5.1\",\n    \"underscore\": \"^1.8.3\"\n  },\n  \"devDependencies\"\
    : {},\n  \"scripts\": {\n    \"test\": \"echo \\Error: no test specified\\ &&\
    \ exit 1\"\n  },\n  \"author\": \"Sitepoint\",\n  \"license\": \"ISC\"\n}\n```"
