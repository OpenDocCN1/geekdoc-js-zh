    The author and publisher have made every effort to ensure the accuracy of the\
    \ the information herein.\n\nWait, I (lambdas), dropping the function keyword\
    \ when the body has only one expression. The asynchronous nature of JavaScript\
    \ has long represented a challenge; any non-trivial application ran the risk of\
    \ falling into callback hell when dealing with things like Ajax requests.\n\n\
    Fortunately, ES2015 added native support for promises. Promises represent values\
    \ that don’t exist at the moment of the computation but that may be available\
    \ later, making the management of asynchronous function calls more manageable\
    \ without getting deeply nested callbacks.\n\nES2017 introduced async functions\
    \ (sometimes referred to as async/await) make improvements in this area, allowing\
    \ you to treat asynchronous code as if it were synchronous:\n\n```javascript\n\
    async function doAsyncOp() {\n  var val = await asynchronousOperation();\n  console.log(val);\n\
    \  return val;\n}\n```\n\n## Modules\n\nAnother prominent feature added in ES2015\
    \ is a native module format, making the definition and usage of modules a part\
    \ of the language. Loading modules were previously only available in the form\
    \ of third-party libraries. We’ll look at modules in more depth in the next section.\n"
