    # # Chapter 8: JavaScript’s New Private Class Fields, and How to Use Them


    by Craig Buckler


    ES6 introduced classes to JavaScript, but they’re too simplistic for complex applications.
    Class fields (also referred to as class properties) aim to deliver simpler constructors
    with private and static members. The proposal is currently at TC39 stage 3: candidate
    and could appear in ES2019 (ES10).


    A quick recap of ES6 classes is useful before we examine class fields in more
    detail.'
  - "[PAGE 98]\n\n# ES6 Class Basics\n\nJavaScript’s prototypal inheritance model\
    \ can appear confusing to developers with an understanding of the classical inheritance\
    \ used in languages such as C++, C#, Java and PHP. JavaScript classes are primarily\
    \ syntactical sugar, but they offer familiar object-oriented programming concepts.\n\
    \nA class is a template which defines how objects of that type behave. The following\
    \ Animal class defines generic animals (classes are normally denoted with an initial\
    \ capital to distinguish them from objects and other types):\n\n```\nclass Animal\
    \ {\n  constructor(name = 'anonymous', legs = 4, noise = 'nothing') {\n    this.type\
    \ = 'animal';\n    this.name = name;\n    this.legs = legs;\n    this.noise =\
    \ noise;\n  }\n\n  speak() {\n    console.log(`${this.name} says \"${this.noise}\\\
    `);\n  }\n\n  walk() {\n    console.log(`${this.name} walks on ${this.legs}`);\n\
    \  }\nn}\n```\n\nClass declarations execute in strict mode; there’s no need to\
    \ add 'use strict'.\n\nA constructor method is run when an object of this type\
    \ is created, and it typically defines initial properties. speak() and walk()\
    \ are methods which add further functionality.\n\nAn object can now be created\
    \ from class with the new keyword:\n\n```\nconst rex = new Animal('Rex', 4, 'woof');\n\
    rex.speak(); // Rex says \"woof\"\n```"
