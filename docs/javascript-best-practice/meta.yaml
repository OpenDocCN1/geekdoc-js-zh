    \n它会将运行时从你所有的其他 chunk 中提取并放入自己的文件中，在此例中名为 `runtime.js`。只需确保在加载主 JS 包之前加载它。例如：\n\
    \n```html\n<script src=\"runtime.js\">\n<script src=\"main-bundle.js\">\n```\n\
    \n然后是转译代码和填充程序（polyfills）的话。如果你正在编写现代（ES6+）JavaScript，你可能正在使用 Babel 将其转译为兼容 ES5\
    \ 的代码。转译不仅因为冗冗性增加了文件大小，还增加了复杂性，而且与原生 ES6+ 代码相比，它通常会有性能退化。\n\n此外，你可能还在使用 `babel-polyfill`\
    \ 包和 `whatwg-fetch` 来修补旧版浏览器中缺失的功能。然后，如果你编写代码时使用了 `async/await`，你还需要使用生成器（generators）对其进行转译，这需要包含\
    \ `regenerator-runtime`……\n\n要点是，你向 JS 包中增加了近 100KB，这不仅导致了巨大的文件体积，还有巨大的解析和执行成本，仅仅是为了支持旧版浏览器。\n\
    \n然而，惩罚使用现代浏览器的用户是没有意义的。我的一种方法（Philip 在这篇文章中也提到）是创建两个独立的包并根据条件加载它们。Babel 通过 `babel-preset-env`\
    \ 让这变得简单。例如，你有一个支持 IE 11 的包，另一个是不带填充程序的适用于最新现代浏览器的包。\n\n一种粗暴但高效的方法是将以下内容放在内联脚本中：\n\
    \n```javascript\nfunction() {\n  try {\n    new Function('async () => {}}');\n\
    \  } catch (error) {\n    // 创建指向 legacy-bundle.js 的 script 标签；\n    return;\n\
    \  }\n  // 创建指向 modern-bundle.js 的 script 标签；\n}}();\n```\n\n如果浏览器无法评估异步函数，我们假设它是旧浏览器，并直接发送带填充程序的包。否则，用户将获得整洁且现代的版本。\n\
    \n## 结论\n\n我们希望你从这篇文章获得的收获是JS 是昂贵的，应该节约使用。\n\n确保在低端设备和真实网络条件下测试你网站的性能。你的网站应该快速加载并尽快实现可交互。这意味着通过任何必要手段发送更少的\
    \ JS，并更快地发送。你的代码应该始终经过压缩，拆分成更小的、易于维护的包，并尽可能地异步加载。在服务器端，确保已启用 HTTP/2 以实现更快的并行传输，并使用\
    \ gzip/Brotli 压缩来大幅减小 JS 的传输大小。\n\n## 第4 章：JavaScript 设计模式：单例\n\n作者 Samier Saeed\n\
    \n在本章中，我们将深入探讨在 JavaScript 中实现单例的最佳方法，观察它如何随着 ES6 的兴起而演变。\n\n在广泛用于生产的语言中，JavaScript\
    \ 的进化速度是最快的，它看起来不像早期的迭代，而更像 Python，随着 ECMA International 提出的每一项新规范。虽然这些变化也有许多反对者，但新的\
    \ JavaScript 确实成功地让代码更易阅读和推理，更容易以符合软件工程最佳实践（特别是模块化概念和 SOLID 原则）的方式编写，并且更容易组装成标准的软件设计模式。\n\
    \n## 解释 ES6\n\nES6（又称 ES2015）自2009年 ES5 标准化以来该语言的首次重大更新。几乎所有现代浏览器都支持 ES6。然而，如果你需要兼容旧版浏览器，可以使用\
    \ Babel 等工具将 ES6 代码轻松转译为 ES5。ES6 为 JavaScript 提供了许多新功能，包括更优的类语法和用于变量声明的新关键字。你可以通过阅读\
    \ SitePoint 上关于该主题的文章来了解更多。\n\n## 什么是单例\n\n如果你不熟悉单例模式，它本质上是一种限制类实例化为单个对象的的设计模式。通常，目标是管理全局应用程序状态。我见过或自己编写过的一些示例包括：使用单例作为\
    \ Web 应用配置设置的源；在客户端处理任何通过 API 密钥启动的操作（例如，你通常不想承担发送多次分析跟踪调用的风险），以及在客户端 Web 应用程序中内存中存储数据（例如\
    \ Flux 中的 stores）。\n\n单例对于调用代码来说应该是不可变的，并且不应该存在实例化多个单例的危险。\n\n> **单例坏的吗？**\n>\
    \ 在某些情况下，单例可能是坏的，也有观点认为它们实际上总是坏的。关于这个讨论，你可以查看这篇关于该主题的有用文章。\n\n## 在 JavaScript\
    \ 中创建单例的旧方法\n\n在 JavaScript 中编写单例的旧方法涉及利用闭包和立即调用函数表达式（IIFE）。以下是我们可能如何为一个假设的 Flux\
    \ 实现编写一个（非常简单的）store：\n\n```javascript\nvar UserStore = (function(){\n  var data\
    \ = [];\n  function add(item){\n    data.push(item);\n  }\n  function get(id){\n\
    \    return data.find((d) => {\n      return d.id === id;\n    });\n  }\n  return\
    \ { add: add, get: get };\n})();\n```\n\n代码被解释时，UserStore 将设置为立即调用函数的结果——一个允许访问数据的对象。但是，由于对象是不可变的，无法对其进行更改或添加。但这种方法比需要的冗长，而且我们的示例简单到看不到类的优势。此外，有时你可能希望利用类的优势。\n\
    \n## 新方法（们）\n\n通过利用 ES6 特性，我们可以以简洁且强大的方式编写单例。让我们从最基础的实现开始：\n\n```javascript\n\
    const data = [];\nconst UserStore = {\n  add: item => data.push(item),\n  get:\
    \ id => data.find(d => d.id === id)\n};\n\nObject.freeze(UserStore);\nexport default\
    \ UserStore;\n```\n\n你可以看到，这提供了改进。但从技术上说，使用这两种模式的单例不可变性和不可覆盖性可以被有心的挑衅者破坏。对象字面量即使是\
    \ `const` 也可以通过 `Object.assign` 进行拷贝。当我们导出类的实例时，虽然我们没有直接将其暴露给调用代码，但任何实例的构造函数在\
    \ JavaScript 中都是可用的并可以被调用创建新实例。显然，这至少需要一些努力，希望你的同事在违反单例模式方面不要如此。\n\n假设你想额外确保没人破坏你单例的唯一性，而且你还想更贴近面向对象世界中单例的实现。这是你可以这样做：\n\
    \n```javascript\nclass UserStore {\n  constructor() {\n    this._data = [];\n\
    \  }\n\n  add(item){\n    this._data.push(item);\n  }\n\n  get(id){\n    return\
    \ this._data.find(d => d.id === id);\n  }\n}\n\nconst instance = new UserStore();\n\
    Object.freeze(instance);\n\nexport default instance;\n```\n\n"
