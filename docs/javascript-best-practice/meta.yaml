    # Chapter 1: The Anatomy of a Modern JavaScript Application


    by James Kolce


    There''s no doubt that the JavaScript ecosystem changes fast. Not only new tools
    and frameworks introduced and developed at a rapid rate, the language itself has
    undergone big changes with the introduction of ES2015 (aka ES6). Understandably,
    many articles have been written complaining about how difficult it is to learn
    modern JavaScript development these days.


    In this article, I''ll introduce you to modern JavaScript. We''ll take a look
    at recent developments in the language and get an overview of the tools and techniques
    currently used to write front-end web applications. If you''re starting out with
    learning the language, or you''ve not touched it for a few years and are wondering
    what happened to the JavaScript you used to know, this article is for you.'
  - '[PAGE 11]


    # A Note About Node.js


    Node.js is a runtime that allows server-side programs to be written in JavaScript.
    It’s possible to have full-stack JavaScript applications, where both the front
    and back end of the app is written in the same language. Although this article
    is focused on client-side development, Node.js still plays an important role.


    The arrival of Node.js had a significant impact on the JavaScript ecosystem, introducing
    the npm package manager and popularizing the CommonJS module format. Developers
    started to build more innovative tools and develop new approaches to blur the
    line between the browser, the server, and native applications.'
  - "[PAGE 12]\n\n# JavaScript ES2015+\n\nIn 2015, the sixth version of ECMAScript\
    \ — the specification that defines the JavaScript language — was released under\
    \ the name of ES2015 (still often referred to as ES6). This new version included\
    \ substantial additions to the language, making it easier and more feasible to\
    \ build ambitious applications. But improvements don’t stop with ES2015; each\
    \ year, a new version is released.\n\n# Declaring variables\n\nJavaScript now\
    \ has two additional ways to declare variables: let and const.\n\nlet is the successor\
    \ to var. Although var is still available, let limits the scope of variables to\
    \ the block (rather than the function) they’re declared within, which reduces\
    \ the room for error:\n\n```\n// ES5\nfor (var i = 1; i < 5; i++) {\n  console.log(i);\n\
    }\n// <-- logs the numbers 1 to 4\nconsole.log(i);\n// <-- 5 (variable i still\
    \ exists outside the loop)\n\nES2015\nfor (let j = 1; j < 5; j++) {\n  console.log(j);\n\
    }\nconsole.log(j);\n// <-- 'Uncaught ReferenceError: j is not defined\n```\n\n\
    Using const allows you to define variables that cannot be rebound to new values.\
    \ For primitive values as strings and numbers, this results in something similar\
    \ to a constant, as you cannot change the value once it has been declared:\n\n\
    ```\nconst name = 'Bill';\nname = 'Steve';\n// <-- 'Uncaught TypeError: Assignment\
    \ to constant variable.'\n```"
  - "[PAGE 13]\n\n```\n// Gotcha\nconst person = { name: 'Bill' };\nperson.name =\
    \ 'Steve';\n// person.name is now Steve.\n// As we're not changing the object\
    \ that person is bound to,\nJavaScript doesn't complain.\n```\n\n# Arrow functions\n\
    \nArrow functions provide a cleaner syntax for declaring anonymous functions (lambdas),\
    \ dropping the function keyword and the return keyword when the body function\
    \ has only one expression. This can allow you to write functional style code in\
    \ a nicer way:\n\n```\n// ES5\nvar add = function(a, b) {\n  return a + b;\n}\n\
    \n// ES2015\nconst add = (a, b) => a + b;\n```\n\nThe other important feature\
    \ of arrow functions is that they inherit the value of this from the context in\
    \ which they are defined:\n\n```\nfunction Person(){\n  this.age = 0;\n}\n\n//\
    \ ES5\nsetInterval(function() {\n  this.age++; // ||this| refers to the global\
    \ object\n}, 1000);\n\n// ES2015\nsetInterval(() => {\n  this.age++; // ||this|\
    \ properly refers to the person object\n}, 1000);\n\nvar p = new Person();\n```\n\
    \n# Improved Class syntax\n\nIf you're a fan of object-oriented programming, you\
    \ might like the addition of"
  - "[PAGE 14]\n\nclasses to the language on top of the existent mechanism based on\
    \ prototypes. While it’s mostly syntactic sugar, it provides a cleaner syntax\
    \ for developers trying to treat classical object-orientation with prototypes.\n\
    \n```\nclass Person {\n  constructor(name) {\n    this.name = name;\n  }\n\n \
    \ greet() {\n    console.log(`Hello, my name is ${this.name}\\`);\n  }\n}\n```\n\
    \n# # Promises / Async functions\n\nThe asynchronous nature of JavaScript has\
    \ long represented a challenge; any non-trivial application ran the risk of falling\
    \ into a callback hell when dealing with things like Ajax requests.\n\nFortunately,\
    \ ES2015 added native support for promises. Promises represent values that don’t\
    \ exist at the moment of the computation but that may be available later, making\
    \ the management of asynchronous function calls more manageable without getting\
    \ deeply nested callbacks.\n\nES2017 introduced async functions (sometimes referred\
    \ to as async/await) make improvements in this area, allowing you to treat asynchronous\
    \ code as if it were synchronous:\n\n```\nasync function doAsyncOp() {\n  var\
    \ val = await asynchronousOperation();\n  console.log(val);\n  return val;\n}\n\
    ```\n\n# # Modules\n\nAnother prominent feature added in ES2015 is a native module\
    \ format, making the definition and usage of modules a part of the language. Loading\
    \ modules were previously only available in the form of third-party libraries.\
    \ We’ll look at modules in more depth in the next section."
- md: "\nThere are other features we won't talk about here, but we've covered some\
    \ of the major differences you're likely to notice when looking at modern JavaScript.\
    \ You can check a complete list with examples on the [Learn ES2015](https://developer.mozilla.org/)\
    \ page on the [Babel site](https://babeljs.io/), which you might find useful to\
    \ get up to date with the language. Some of those features include template strings,\
    \ block-scoped variables and constants, iterators, generators, new data structures\
    \ such as Map and Set, and more.\n\n# Code linting\n\nLinters are tools that parse\
    \ your code and compare it against a set of rules, checking for syntax errors,\
    \ formatting, and good practices. Although the use of a linter is recommended\
    \ to everyone, it's especially useful if you're getting started. When configured\
    \ correctly for your code editor/IDE, you can get instant feedback to ensure you\
    \ don't get stuck with syntax errors as you're learning new features.\n\nYou can\
    \ [check out ESLint](https://eslint.org/), which is one of the most popular and\
    \ supports ES2015+.\n\n# Modular Code\n\nModern web applications can have thousands\
    \ (even hundred of thousands) of lines of code. Working at that size becomes almost\
    \ impossible without a mechanism to organize everything in smaller components,\
    \ writing specialized and isolated pieces of code that can be reused as necessary\
    \ in a controlled way. This is the job of modules.\n\n# CommonJS modules\n\nA\
    \ handful of module formats has emerged over the years, the most popular of which\
    \ is CommonJS. It's the default module format in Node.js, and can be used in client-side\
    \ code with the help of module bundlers, which we'll talk about shortly.\n\nIt\
    \ makes use of a module object to export functionality from a JavaScript file\
    \ and require() to import that functionality where you need it.\n\n```\n// lib/math.js\n\
    function sum(x, y) {\n  return x + y;\n}\nconst pi = 3.141593\n\nmodule.exports\
    \ = {\n  sum: sum,\n  pi: pi\n};\n\n// app.js\nconst math = require(\"lib/math\"\
    );\n\nconsole.log(\"2pi \" + math.sum(math.pi, math.pi));\n```\n\n# ES2015 modules\n\
    \nES2015 introduces a way to define and consume components right into the language,\
    \ which was previously possible only with third-party libraries. You can have\
    \ separate files with the functionality you want and export certain parts have\
    \ separate files with functionality you want, and export just certain parts to\
    \ make them available to your application.\n\n### Native Browser Support\n\nAt\
    \ the time of writing, native browser support for ES2015 modules is still under\
    \ development, so you currently need some additional tools to be able to use them.\n\
    \nHere's an example:\n\n```\n// lib/math.js\n\nexport function sum(x, y) {\n \
    \ return x + y;\n}\nexport const pi = 3.141593;\n```\n\nHere we have a module\
    \ that exports a function and a variable. We can include that file in another\
    \ one and use those exported functions:\n\n```\n// app.js\n\nimport * as math\
    \ from \"lib/math\";\n\nconsole.log(\"2pi = \" + math.sum(math.pi, math.pi));\n\
    ```\n\nOr we can also be specific and import only what we need:\n\n```\n// otherApp.js\n\
    \nimport {sum, pi} from \"lib/math\"\n\nconsole.log(\"2pi = \" + sum(pi, pi));\n\
    ```\n\nThese examples have been extracted from the Babel website. For an in-depth\
    \ look, check out Understanding ES6 Modules.\n\n# Package Management\n\nOther\
    \ languages have long had their own package repositories and managers to make\
    \ it easier to find and install third-party libraries and components. Node.js\
    \ comes with its own package manager and repository, npm. Although there are other\
    \ package managers available, npm has become the facto JavaScript package manager\
    \ and is said to be the largest registry in the world.\n\nIn the npm repository\
    \ you can find third-party modules that you can easily download and use in your\
    \ projects with a single npm install <package> command. The packages are downloaded\
    \ into a local node_modules directory, which contains all the packages and their\
    \ dependencies.\n\nThe packages that you download can be registered as dependencies\
    \ of your project in a package.json file, along with information about your project\
    \ or module (which can be published as a package on npm).\n\nYou can define separate\
    \ dependencies for both development and production. While the production dependencies\
    \ are needed for the package to work, the development dependencies are only necessary\
    \ for the developers of the package.\n\n# Example package.json file\n\n```\n{\n\
    \  \"name\": \"demo\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Demo package.json\"\
    ,\n  \"main\": \"main.js\",\n  \"dependencies\": {\n    \"mkdirp\": \"^0.5.1\"\
    ,\n    \"underscore\": \"^1.8.3\"\n  },\n  \"devDependencies\": {},\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified && exit 1\\\"\"\n  },\n\
    \  \"author\": \"Sitepoint\",\n  \"license\": \"ISC\"\n}\n```\n\n# Build Tools\n\
    \nThe code that we write is the code that will go to production. We write code\
    \ in a modern version of JavaScript that may not be supported by the browser,\
    \ we make heavy use of third-party packages that are in a node_modules folder\
    \ along with their own dependencies, we can have processes like static analysis\
    \ tools or minifiers, etc. Build tooling exists to help transform all this into\
    \ something that can be deployed efficiently and that's understood by most browsers.\n\
    \n# Module bundling\n\nWhen writing clean code, we need a mechanism to organize\
    \ everything in smaller components, writing specialized and isolated pieces of\
    \ code that can be reused as necessary in a controlled way. This is the job of\
    \ modules.\n\nWhen writing clean code, we need a mechanism to organize everything\
