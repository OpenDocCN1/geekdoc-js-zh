  md: "# Deployment\n\nWith modern JavaScript applications, the code you write is\
    \ not the same as the code that you deploy for production: you only deploy the\
    \ result of your build process. The workflow to accomplish this can vary depending\
    \ on the size of your project, the number of developers working on it, and sometimes\
    \ the tools/libraries you're using.\n\nFor example, if you're working alone on\
    \ a simple project, each time you're ready for deployment you can just run the\
    \ build process and upload the resulting files to a web server. Keep in mind that\
    \ you only need to upload the resulting files from the build process (transpilation,\
    \ module bundling, minification, etc.), which can be just one .js file containing\
    \ your entire application and dependencies.\n\nYou can have a directory structure\
    \ like this:\n\n```\ndist\n  app.js\n  index.html\nnode_modules\n  src\n    lib\n\
    \      login.js\n      user.js\n    app.js\n    index.html\ngulpfile.js\npackage.json\n\
    README\n```\n\nYou thus have all of your application files in a src directory,\
    \ written in ES2015+, importing packages installed with npm and your own modules\
    \ from a lib directory.\n\nThen you can run Gulp, which will execute the instructions\
    \ from a gulpfile.js to build your project — bundling all modules into one file\
    \ (including the ones installed with npm), transpiling ES2015+ to ES5, minifying\
    \ the resulting file, etc. Then you can configure it to output the result in a\
    \ convenient dist directory.\n\nFiles That Matter"
  merge: -1
  pgno: 23
- img_proc: true
  md: 'If you have files that don''t need any processing, you can just copy them from
    src to the dist directory. You can configure a task for that in your build system.


    Now you can just upload the files from the dist directory to a web server, without
    having worry about the rest of the files, which are only useful for development.


    # Team development


    If you''re working with other developers, it''s likely you''re also using a shared
    code repository, like GitHub, to store the project. In this case, you can run
    the build process right before making commits and store the result with the other
    files in the Git repository, to later be downloaded onto a production server.


    However, storing built files in the repository is prone to errors if several developers
    are working together, and you might want to keep everything clean from build artifacts.
    Fortunately, there''s a better way to deal with that problem: you can put a service
    like Jenkins, Travis CI, CircleCI, etc. in the middle of the process, so it can
    automatically build your project after each commit is pushed to the repository.
    Developers only have to worry about pushing code changes without building the
    project first each time. The repository is also kept clean of automatically generated
    files, and at the end, you still have the built files available for deployment.'
  merge: -1
