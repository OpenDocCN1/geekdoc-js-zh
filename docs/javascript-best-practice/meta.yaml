    \ But think about what the code you’re writing is trying to accomplish, where\
    \ you’re going to need to deploy it, and who will be modifying it next. Then decide\
    \ for yourself what the best approach would be.\n\n## Chapter 7: Flow Control\
    \ in Modern JS: Callbacks to Promises to Async/Await\n\nby Craig Buckler\n\nJavaScript\
    \ is regularly claimed to be *asynchronous*. What does that mean? How does it\
