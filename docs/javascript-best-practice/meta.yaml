    # Comparison


    Over the years, JavaScripters have had an on-and-off relationship with the prototype
    chain, and today the two most common styles you''re likely to encounter are the
    class syntax,, which relies heavily on the prototype chain, and the factory function
    syntax, which typically doesn''t rely on the prototype chain at all. The two styles
    differ — but only slightly — in performance and features.


    # Performance


    JavaScript engines are so heavily optimized today that it''s nearly impossible
    to look at what will be faster. Measurement is crucial. Yet sometimes even measurement
    can fail. Typically, an updated JavaScript engine is released every six weeks,
    with significant changes in performance, and any measurements we had previously
    taken, and any decisions we based on those measurements, go right out the window.
    So, my rule of thumb has been to favor the most official and most widely used
    syntax, under the presumption that it will receive the most scrutiny and be the
    most performant of the time. Right now, that''s the class syntax, and as I write
    this, the class syntax is roughly 3x faster than a factory function returning
    a literal.


    # Features


    What few feature differences there were between classes and factory functions
    evaporated with ES6. Today, both factory functions and classes can enforce private
    data—factory functions with closures and classes with weak maps. Both can achieve
    multiple-inheritance factory functions by mixing other properties into their own
    object, and classes also by mixing other properties into their prototype, or with
    class factories, or with proxies. Both factory functions and classes can return
    any arbitrary object if need be. And both offer a simple syntax.'
