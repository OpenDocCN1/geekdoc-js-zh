    \nA class is a template which defines how objects of that type behave. The following\
    \ Animal class defines generic animals (classes are normally denoted with an initial\
    \ capital to distinguish them from objects and other types):\n\n```\nclass Animal\
    \ {\n  constructor(name = 'anonymous', legs = 4, noise = 'nothing') {\n    this.type\
    \ = 'animal';\n    this.name = name;\n    this.legs = legs;\n    this.noise =\
