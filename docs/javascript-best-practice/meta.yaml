  - "[PAGE 87]\n\n# Promises\n\nES2015 (ES6) introduced Promises. Callbacks are still\
    \ used below the surface, but Promises provide a clearer syntax that *chains asynchronous\
    \ commands so they run in series (more about that in the next section).\n\nTo\
    \ enable Promise-based execution, asynchronous callback-based functions must be\
    \ changed so they immediately return a Promise object. That object promises to\
    \ run one of two functions (passed as arguments) at some point in the future:\n\
    \n+   * *resolve*: a callback function run when processing successfully completes,\
    \ and\n * *reject*: an optional callback function run when a failure occurs.\n\
    \nIn the example below, a database API provides a connect() method which accepts\
    \ a callback function. The outer asyncDBconnect() function immediately returns\
    \ a new Promise and runs either resolve() or reject() once a connection is established\
    \ or fails:\n\n```\nconst db = require('database');\n\n// connect to database\n\
    function asyncDBconnect(param) {\n\n  return new Promise(resolve, reject) => {\n\
    \n    db.connect(param, (err, connection) => {\n      if (err) reject(err);\n\
    \      else resolve(connection);\n    });\n  });\n};\n```\n\nNode.js 8.0+ provides\
    \ a util.promisify utility to convert a callback-based function into a Promise-based\
    \ alternative. There are a couple of conditions:\n\n+   1. the callback must be\
    \ passed as the last parameter to an asynchronous function, and"
  - "[PAGE 88]\n\n2. the callback function must expect an error followed by a value\
    \ parameter.\n\nExample:\n\n```\n// Node.js: promisify fs.readFile\nconst\n  util\
    \ = require('util'),\n  fs = require('fs'),\n  readFileAsync = util.promisify(fs.readFile)\n\
    \nreadFileAsync('file.txt');\n```\n\nVarious client-side libraries also provide\
