    # Child or SubClasses


    It''s often practical to use one class as the base for another. If we''re mostly
    creating dog objects, Animal is too generic, and we must specify the same 4-leg
    and "woof" noise details every time.


    A Dog class can inherit all the properties and methods from the Animal class using
    extends. Dog-specific properties and methods can be added or removed as necessary:
    class Dog extends Animal { constructor(name) { // call the Animal constructor
    super(name, 4, ''woof''); this.type = ''dog''; } // override Animal.speak speak(to)
    { if (to) console.log(''to ${to}''); } }


    super refers to the parent class and is usually called in the constructor. In
    this example, the Dog speak() method overrides the one defined in Animal.


    Object instances of Dog can now be created: const rex = new Dog(''Rex''); rex.speak(''everyone'');
    // Rex says "woof" to everyone rex.eats = ''anything''; console.log( rex.dinner
    ); // Rex eats anything for dinner.'
  - "[PAGE 102]\n\n# Static Methods and Properties\n\nDefining a method with the static\
    \ keyword allows it to be called on a class without creating an object instance.\
    \ JavaScript doesn't support static properties in the same way as other languages,\
    \ but it is possible to add properties to the class definition (a class is a JavaScript\
    \ object in itself!).\n\nThe Dog class can be adapted to retain a count of how\
    \ many dog objects have been created: class Dog extends Animal {\n\n```\nconstructor(name)\
    \ {\n\n// call the Animal constructor super(name, 4, 'woof'); this.type = \n'dog';\n\
    \n// update count of Dog objects Dog.count++;\n\n}\n// override Animal.speak speak(to)\
    \ {\n\nsuper.speak();\nif (to) console.log(`${to}`);\n\n// return number of dog\
    \ objects static get COUNT() {\nreturn Dog.count; }\n}\n// static property (added\
    \ after class is defined) Dog.count = 0;\n\nThe class's static COUNT returns the\
    \ number of dogs created:\nconsole.log(`Dogs defined: ${Dog.COUNT}`); // Dogs\
    \ defined: 0`\n```"
