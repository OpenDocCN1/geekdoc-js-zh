    \ for dinner.`;\n  }\n}\nconst rex = new Animal('Rex', 4, 'woof');\n\nrex.eats\
    \ = 'anything'; // 标准 setter\n\nrex.food = 'tofu'; // 完全绕过了 eats setter\n\nconsole.log(\
    \ rex.dinner ); // Rex eats tofu for dinner.\n```\n\n其他语言允许声明私有属性。这在 ES6 中是不可行的，尽管开发者可以使用下划线约定\
    \ (`_propertyName`)、闭包、符号 (Symbols) 或 WeakMaps 来规避。\n\n在 ESnext 中，私有类字段使用哈希 `#`\
    \ 前缀定义：\n\n```javascript\nclass MyClass {\n\n  a = 1; // a 是公共的\n\n  #b = 2; //\
    \ #b 是私有的\n\n  static #c = 3; // #c 是私有且静态的\n\n  incB() {\n    this.#b++;\n  }\n\
    \n}\nconst m = new MyClass();\n\nm.incB(); // 运行正常\n\nm.#b = 0; //  - 类外部无法修改私有属性\n\
    ```\n\n注意，目前还没有定义私有方法、getter 和 setter的方法，尽管 TC39 阶段 2 建议在名称上使用哈希 `#` 前缀。例如：\n\n\
    ```javascript\nclass MyClass {\n\n  // 私有属性\n  #x = 0;\n\n  // 私有方法（只能在类内调用）\n\
    \  #incX() {\n    this.#x++;\n  }\n\n  // 私有 setter（只能在类内调用）\n  set #setX(x) {\n\
    \    this.#x = x;\n  }\n\n  // 私有 getter（只能在类内调用）\n  get #getX() {\n    return\
    \ this.#x;\n  }\n}\n```\n\n# 直接收益：更简洁的 React 代码！\n\nReact 组件通常有绑定到 DOM 事件的方法。为了确保这些方法指向组件，必须对每个方法进行相应的绑定。例如：\n\
    \n```javascript\nclass App extends Component {\n\n  constructor() {\n    super();\n\
    \n    state = { count: 0 };\n\n    // 绑定所有方法\n    this.incCount = this.incCount.bind(this);\n\
