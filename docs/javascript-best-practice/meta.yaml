    \ for that scroll-to-top animation? The convenience of npm and isolated components\
    \ in frameworks comes with a downside: the first response of developers to a problem\
    \ has become to throw more JS at it. When you all have a hammer, everything looks\
    \ like a nail.\n\nWhen you're pruning the weeds and shipping less JS, try it smarter.\
    \ Ship what you need, when you need it.\n\nWebpack 3 has amazing features called\
    \ code splitting and dynamic imports. Instead of bundling all your JS modules\
    \ into a monolithic app.js bundle, it can automatically split the code using the\
