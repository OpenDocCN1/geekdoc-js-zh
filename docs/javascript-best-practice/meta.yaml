    \ possible. This means shipping less JS, and shipping faster by any means necessary.\
    \ Your code should always be minified, split into smaller, manageable bundles\
    \ and loaded asynchronously whenever possible. On the server side, make sure it\
    \ has HTTP/2 enabled for faster parallel transfers and gzip/Brotli compression\
    \ to drastically reduce the transfer sizes of your JS.\n\n## Chapter 4: JavaScript\
    \ Design Patterns: The Singleton\n\nby Samier Saeed\n\nIn this chapter, we'll\
    \ dig into the best way to implement a singleton in JavaScript, looking at how\
    \ this has evolved with the rise of ES6.\n\nAmong languages used in widespread\
    \ production, JavaScript is by far the most quickly evolving, looking less like\
    \ its earliest iterations and more like Python, with every new spec put forth\
    \ by ECMA International. While the changes have their fair share of detractors,\
    \ the new JavaScript does succeed in making code easier to read and reason about,\
    \ easier to write in a way that adheres to software engineering best practices\
    \ (particularly the concepts of modularity and SOLID principles), and easier to\
    \ assemble into canonical software design patterns.\n\n## Explaining ES6\n\nES6\
    \ (aka ES2015) was the first major update to the language since ES5 was standardized\
    \ in 2009. Almost all modern browsers support ES6. However, if you need to accommodate\
    \ older browsers, ES6 code can easily be transpiled into ES5 using a tool such\
    \ as Babel. ES6 gives JavaScript ton of new features, including a superior syntax\
    \ for classes, and new keywords for variable declarations. You can learn more\
    \ about it by perusing SitePoint articles on the subject.\n\n## What Is a Singleton\n\
    \nIn case you're unfamiliar with the singleton pattern, it is, at its core, a\
    \ design pattern that restricts the instantiation of a class to one object. Usually,\
    \ the goal is to manage global application state. Some examples I've seen or written\
    \ myself include using a singleton as the source of config settings for a web\
    \ app, on the client side for anything initiated with an API key (you usually\
    \ don't want to risk sending multiple analytics tracking calls, for example),\
    \ and to store data in memory in a client-side web application (e.g. stores in\
    \ Flux).\n\nA singleton should be immutable by the consuming code, and there should\
    \ be no danger of instantiating more than one of them.\n\n> **Are Singletons Bad?**\n\
    > There are scenarios when singletons might be bad, and arguments that they are,\
    \ in fact, always bad. For that discussion, you can check out this helpful article\
    \ on the subject.\n\n## The Old Way of Creating a Singleton in JavaScript\n\n\
    The old way of writing a singleton in JavaScript involves leveraging closures\
    \ and immediately invoked function expressions. Here's how we might write a (very\
    \ simple) store for a hypothetical Flux implementation:\n\n```javascript\nvar\
    \ UserStore = (function(){\n  var data = [];\n  function add(item){\n    data.push(item);\n\
    \  }\n  function get(id){\n    return data.find((d) => {\n      return d.id ===\
    \ id;\n    });\n  }\n  return { add: add, get: get };\n})();\n```\n\nWhen that\
    \ code is interpreted, UserStore will be set to the result of that immediately\
    \ invoked function — an object that allows access to the data. However, because\
    \ the object is immutable, it cannot be changed or added to from the outside.\
    \ But this way is more verbose than it needs to be, and our example is so simple\
    \ that we don't really see any benefits from using a class. Moreover, there are\
    \ times you might want to exploit the benefits of a class.\n\n## The New Way(s)\n\
    \nBy leveraging ES6 features, we can write singletons in ways that are not only\
    \ concise but powerful. Let's start with the most basic implementation:\n\n```javascript\n\
    const data = [];\nconst UserStore = {\n  add: item => data.push(item),\n  get:\
    \ id => data.find(d => d.id === id)\n};\n\nObject.freeze(UserStore);\nexport default\
    \ UserStore;\n```\n\nAs you can see, this offers an improvement. But, technically,\
    \ the immutability and non-overridability of the singleton using both of these\
    \ patterns can be subverted by the motivated provocateur. An object literal can\
    \ be copied, even if it is const, by using Object.assign. And when we export an\
    \ instance of a class, though we aren't directly exposing it to the consuming\
    \ code, the constructor of any instance is available in JavaScript and can be\
    \ invoked to create new instances. Obviously, though, that all takes at least\
    \ a little bit of effort, and hopefully your fellow devs aren't so inconsistent\
    \ in violating the singleton pattern.\n\nLet's say you wanted to be extra sure\
    \ that nobody messed with the singleness of your singleton, and you also wanted\
    \ to match the implementation of singletons in the object-oriented world even\
    \ more closely. Here's something you could do:\n\n```javascript\nclass UserStore\
    \ {\n  constructor() {\n    this._data = [];\n  }\n\n  add(item){\n    this._data.push(item);\n\
    \  }\n\n  get(id){\n    return this._data.find(d => d.id === id);\n  }\n}\n\n\
    const instance = new UserStore();\nObject.freeze(instance);\n\nexport default\
    \ instance;\n```\n"
