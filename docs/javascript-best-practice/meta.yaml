    If your app responds to a user action in under 100ms, the user perceives the response
    as immediate. This applies to tappable elements, but not when scrolling or dragging.


    # Animate


    On a 60Hz monitor, we want to target a constant 60 frames per second when animating
    and scrolling. That results in around 16ms per frame. Out of that 16ms'
