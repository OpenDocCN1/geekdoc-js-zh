    \ Map 和 Set）等。\n\n# 代码代码检查 (Code linting)\n\n代码检查工具（Linters）是解析你的代码并将其与一组规则进行比较的工具，用于检查语法错误、格式和良好实践。虽然建议每个人使用代码检查工具，但当你刚开始时，它会格外有用。如果为你的代码编辑器/IDE\
    \ 配置了正确的工具，你可以获得即时反馈，确保你在学习新功能时不会被语法错误所困扰。\n\n你可以[查看 ESLint](https://eslint.org/)，它是最流行的工具之一，并且支持\
    \ ES2015+。\n\n# 模块化代码 (Modular Code)\n\n现代 Web 应用可能会有成千上万（甚至几十万）行代码。如果没有一种机制将所有内容组织成更小的组件，编写专门且隔离的代码片段并在需要时以受控的方式进行复用，那么在这种规模下工作将几乎是不可能的。这就是模块（modules）的工作。\n\
    \n# CommonJS 模块 (CommonJS modules)\n\n多年来出现了一些模块格式，其中最流行的是 CommonJS。它是 Node.js\
    \ 的默认模块格式，并可以在模块打包器（我们稍后会讨论）的帮助下在客户端代码中使用。\n\n它利用一个模块对象（module object）来从 JavaScript\
    \ 文件导出功能，并使用 `require()` 在需要的地方导入这些功能。\n\n```javascript\n// lib/math.js\nfunction\
    \ sum(x, y) {\n  return x + y;\n}\nconst pi = 3.141593\n\nmodule.exports = {\n\
    \  sum: sum,\n  pi: pi\n};\n\n// app.js\nconst math = require(\"lib/math\");\n\
    \nconsole.log(\"2pi \" + math.sum(math.pi, math.pi));\n```\n\n# ES2015 模块 (ES2015\
    \ modules)\n\nES2015 引入了一种直接在语言中定义和消费组件的方法，这以前只能通过第三方库实现。你可以拥有包含你所需功能的单独文件，并导出某些部分供你的应用程序使用。\n\
    \n### 原生浏览器支持 (Native Browser Support)\n\n在编写本文时，对 ES2015 模块的原生浏览器支持仍在开发中，因此你目前需要一些额外的工具才能使用它们。\n\
    \n这是一个示例：\n\n```javascript\n// lib/math.js\n\nexport function sum(x, y) {\n  return\
    \ x + y;\n}\nexport const pi = 3.141593;\n```\n\n在这里我们有一个导出函数和变量的模块。我们可以将该文件包含在另一个文件中并使用这些导出函数：\n\
    \n```javascript\n// app.js\n\nimport * as math from \"lib/math\";\n\nconsole.log(\"\
    2pi = \" + math.sum(math.pi, math.pi));\n```\n\n或者我们也可以具体，只导入我们需要的：\n\n```javascript\n\
    // otherApp.js\n\nimport {sum, pi} from \"lib/math\"\n\nconsole.log(\"2pi = \"\
    \ + sum(pi, pi));\n```\n\n这些示例提取自 Babel 网站。要深入了解，请查看《理解 ES6 模块》（Understanding\
    \ ES6 Modules）。\n\n# 包管理 (Package Management)\n\n其他语言长期以来一直有自己的包仓库和管理器，以便更容易地找到和安装第三方库和组件。Node.js\
    \ 自带了自己的包管理器和仓库，即 npm。虽然还有其他包可用，但 npm 已经成为事实上的 JavaScript 包管理器，并被称为世界上最大的注册表。\n\
    \n在 npm 仓库中，你可以找到第三方模块，通过单一的 `npm install <package>` 命令即可轻松地下载并将其用于你的项目中。包被下载到本地的\
    \ `node_modules` 目录，该目录包含了所有包及其依赖项。\n\n你下载的包可以在 `package.json` 文件中被注册为项目的依赖项，同时包含有关你的项目或模块的信息（这些信息可以发布为\
    \ npm 上的一个包）。\n\n你可以为开发和生产环境定义不同的依赖。生产依赖是包运行所需要的，而开发依赖仅对于包的开发者来说是必要的。\n\n# 示例\
    \ package.json 文件 (Example package.json file)\n\n```json\n{\n  \"name\": \"demo\"\
    ,\n  \"version\": \"1.0.0\",\n  \"description\": \"Demo package.json\",\n  \"\
    main\": \"main.js\",\n  \"dependencies\": {\n    \"mkdirp\": \"^0.5.1\",\n   \
    \ \"underscore\": \"^1.8.3\"\n  },\n  \"devDependencies\": {},\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified && exit 1\\\"\"\n  },\n\
    \  \"author\": \"Sitepoint\",\n  \"license\": \"ISC\"\n}\n```\n\n# 构建工具 (Build\
    \ Tools)\n\n我们编写的代码是将来进入生产环境的代码。我们使用现代版本的 JavaScript 编写代码，浏览器可能并不支持它；我们大量使用位于\
    \ `node_modules` 文件夹中的第三方包及其自身的依赖项；我们可能会诸如静态分析工具或压缩器等过程。构建工具的存在是为了帮助将所有这些内容转换为可以高效部署并被大多数浏览器理解的内容。\n\
    \n# 模块打包 (Module bundling)\n\n在编写整洁的代码时，我们需要一种机制将所有内容组织成更小的组件，编写专门且隔离的代码片段并在需要时以受控的方式进行复用。这就是模块的工作。\n\
    \n（注：原文文本中存在大量重复，此处已根据逻辑流进行了去重处理。）\n"
