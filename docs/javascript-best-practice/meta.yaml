    \ = { count: 0 };\n\n  incCount = () => {\n    this.setState(ps => ({ count: ps.count\
    \ + 1 }));\n  };\n\n  render() {\n    return (\n      <div>\n        <p>{this.state.count}</p>\n\
    \        <button onClick={this.incCount}>add one</button>\n      </div>\n    );\n\
    \  }\n}\n```\n\n# 今日如何使用类字段\n\n目前浏览器或 Node.js 尚不支持类字段。但是，可以使用 Babel 对语法进行转译，Create\
    \ React App 默认启用了该功能。或者，可以使用以下终端命令安装并配置 Babel：\n\n`mkdir class-properties && cd\
    \ class-properties && npm init -y && npm install --save-dev babel-cli babel-plugin-transform-class-properties\
    \ && echo '{ \"plugins\": [\"transform-class-properties\"] }' > .babelrc`\n\n\
    在 `package.json` 的 `scripts` 部分添加构建命令：\n`\"scripts\": { \"build\": \"babel in.js\
    \ -o out.js\" }`\n\n然后运行 `npm run build` 将 ESnext 文件 `in.js` 转译为兼容的 `out.js`。\n\
    \n针对私有方法、getter 和 setter 的 Babel 支持已经提交。\n\n"
