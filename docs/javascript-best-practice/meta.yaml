    the major differences you''re likely to notice when looking at modern JavaScript.
    You can check a complete list with examples on the [Learn ES2015](https://developer.mozilla.org/)
    page on the [Babel site](https://babeljs.io/), which you might find useful to
    get up to date with the language. Some of those features include template strings,
    block-scoped variables and constants, iterators, generators, new data structures
    such as Map and Set, and more.


    # Code linting


    Linters are tools that parse your code and compare it against a set of rules,
    checking for syntax errors, formatting, and good practices. Although the use of
    a linter is recommended to everyone, it''s especially useful if you''re getting
    started. When configured correctly for your code editor/IDE, you can get instant
    feedback to ensure you don''t get stuck with syntax errors as you''re learning
    new features.


    You can [check out ESLint](https://eslint.org/), which is one of the most popular
    and supports ES2015+.'
  - "[PAGE 16]\n\n# Modular Code\n\nModern web applications can have thousands (even\
    \ hundred of thousands) of lines of code. Working at that size becomes almost\
    \ impossible without a mechanism to organize everything in smaller components,\
    \ writing specialized and isolated pieces of code that can be reused as necessary\
    \ in a controlled way. This is the job of modules.\n\n# CommonJS modules\n\nA\
    \ handful of module formats has emerged over the years, the most popular of which\
    \ is CommonJS. It's the default module format in Node.js, and can be used in client-side\
    \ code with the help of module bundlers, which we'll talk about shortly.\n\nIt\
    \ makes use of a module object to export functionality from a JavaScript file\
    \ and require() to import that functionality where you need it.\n\n```\n// lib/math.js\n\
    function sum(x, y) {\n  return x + y;\n}\nconst pi = 3.141593\n\nmodule.exports\
    \ = {\n  sum: sum,\n  pi: pi\n};\n\n// app.js\nconst math = require(\"lib/math\"\
    );\n\nconsole.log(\"2pi \" + math.sum(math.pi, math.pi));\n```\n\n# ES2015 modules\n\
    \nES2015 introduces a way to define and consume components right into the language,\
    \ which was previously possible only with third-party libraries. You can have\
    \ separate files with the functionality you want and export certain parts"
  - "[PAGE 17]\n\nhave separate files with functionality you want, and export just\
    \ certain parts\nto make them available to your application.\n\n# ### Native Browser\
    \ Support\n\nAt the time of writing, native browser support for ES2015 modules\
    \ is still under\ndevelopment, so you currently need some additional tools to\
    \ be able to use them.\n\nHere's an example:\n\n```\n// lib/math.js\n\nexport\
    \ function sum(x, y) {\n  return x + y;\n}\nexport const pi = 3.141593;\n```\n\
    \nHere we have a module that exports a function and a variable. We can include\n\
    that file in another one and use those exported functions:\n\n```\n// app.js\n\
    \nimport * as math from \"lib/math\";\n\nconsole.log(\"2pi = \" + math.sum(math.pi,\
    \ math.pi));\n```\n\nOr we can also be specific and import only what we need:\n\
    \n```\n// otherApp.js\n\nimport {sum, pi} from \"lib/math\"\n\nconsole.log(\"\
    2pi = \" + sum(pi, pi));\n```\n\nThese examples have been extracted from the Babel\
    \ website. For an in-depth\nlook, check out Understanding ES6 Modules."
  - "[PAGE 18]\n\n# Package Management\n\nOther languages have long had their own\
    \ package repositories and managers to make it easier to find and install third-party\
    \ libraries and components. Node.js comes with its own package manager and repository,\
    \ npm. Although there are other package managers available, npm has become the\
    \ facto JavaScript package manager and is said to be the largest registry in the\
    \ world.\n\nIn the npm repository you can find third-party modules that you can\
    \ easily download and use in your projects with a single npm install <package>\
    \ command. The packages are downloaded into a local node_modules directory, which\
