    \ functions and returns another Promise. For example:\n\n```\nPromise.all([ async1,\
    \ async2, async3 ])\n.then(values => {\\      // array of resolved values\n  console.log(values);\
    \      // (in same order as function array)\n  return values;\n})\n.catch(err\
    \ => {\\      // called on any reject\n  console.log('error', err);\n});\n```\n\
    \nPromise.all() terminates immediately if any one of the asynchronous functions\
    \ calls reject.\n\n# Multiple Asynchronous Calls with Promise.race\n\nPromise.race()\
    \ is similar to Promise.all(), except that it will resolve or reject as soon as\
    \ the first Promise resolves or rejects. The fastest Promise-based asynchronous\
    \ function will complete:\n\n```\nPromise.race([ async1, async2, async3 ])\n.then(value\
    \ => {\\      // single value\n  console.log(value);\n  return value;\n})\n.catch(err\
    \ => {\\      // called on any reject\n  console.log('error', err);\n});\n```\n\
    \n# A Promising Future?\n\nPromises reduce callback hell but introduce their own\
    \ problems.\n\nTutorials often fail to mention that the whole Promise chain is\
    \ asynchronous. Any function using a series of promises should either return its\
    \ own Promise or run callback functions in the final .then(), .catch() or .finally()\
    \ methods.\n\nI also have a confession: Promises confused me for a long time.\
    \ The syntax often seems more complicated than callbacks, there's a lot to get\
