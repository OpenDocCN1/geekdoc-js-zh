    # The Old Way of Creating a Singleton in JavaScript


    The old way of writing a singleton in JavaScript involves leveraging closures
    and immediately invoked function expressions. Here''s how we might write a (very
    simple) store for a hypothetical Flux implementation the var: UserStore = (function(){
    var data = []; function add(item){ data.push(item); } function get(id){ return
    data.find((d) => { return d.id === id; }); }); return { add: add, get: get };
    })();();


    When that code is interpreted, UserStore will be set to the result of that immediately
    invoked function — an object that exposes two functions, but that does not grant
    direct access to the collection of data.


    However, this code is more verbose than it needs to be, and also doesn''t give
    us the immutability we desire when making use of singletons. Code executed later
    could modify either one of the exposed functions, or even redefine UserStore altogether.
    Moreover, the modifying/offending code could be anywhere! If we got bugs as a
    result of unexpected modification of usersStore, tracking them down in a larger
    project could prove very frustrating.


    There are more advanced moves you could pull to mitigate some of these downsides,
    as specified in this article by Ben Cherry. (His goal is to create modules, which
    just happen to be singletons, but the pattern is the same.) But those add unnecessary
    complexity to the code, while still failing to get exactly what we want.'
