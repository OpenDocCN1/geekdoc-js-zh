    need to make sure all your JS be done executing in under 8ms per frame in order
    to keep the animations smooth.


    CSS animations and transitions, on the other hand, running off the main thread
    --- on the GPU, if implemented performantly, without causing relays/reflows.


    Considering that most animations are running during loading or user interaction,
    this can give your web apps the much-needed room to breathe.


    The Web Animations API is an upcoming feature set that will allow you to do performant
    JS animations off the main thread, but for now, stick to CSS transitions and techniques
    like FLIP.'
  - "[PAGE 46]\n\n# Bundle Sizes are Everything\n\nToday it's all about bundles. Gone\
    \ are the times of Bower and dozens of <script> tags before the closing </body>\
    \ tag.\n\nNow it's all npm install-ing whatever shiny toy you find on NPM, bundling\
    \ them together with Webpack in a huge single 1MB JS file and hammering your users'\
    \ browser to a crawl capping off their data plans.\n\nTry shipping less JS. You\
    \ might not the entire Lodash library for your project. Do you absolutely need\
    \ to use a JS framework? If you considered something other than React, Preact\
