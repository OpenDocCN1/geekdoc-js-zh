    \    return;\n  }\n  // create script tag pointing to modern-bundle.js;\n}}();\n\
    ```\n\nIf the browser isn't able to evaluate an async function, we assume that\
    \ it's an old browser and just ship the polyfilled bundle. Otherwise, the user\
    \ gets the neat and modern variant.\n\n## Conclusion\n\nWhat we would like you\
    \ to gain from this article is that JS is expensive and should be used sparingly.\n\
    \nMake sure you test your website’s performance on low-end devices, under real\
