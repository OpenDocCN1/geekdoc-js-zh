- md: "\n```javascript\nthis.c = 3;\n\n}\n}\n```\n\nInitializers are executed before\
    \ any constructor runs (presuming a constructor is still necessary).\n\n# Static\
    \ Class Fields\n\nClass fields permit static properties to be declared within\
    \ the class. For example:\n\n```javascript\nclass MyClass {\n\n  x = 1;\n  y =\
    \ 2;\n\n  static z = 3;\n}\nconsole.log( MyClass.z ); // 3\n```\n\nthe elegant\
    \ ES5 equivalent:\n\n```javascript\nclass MyClass {\n\n  constructor() {\n\n \
    \   this.x = 1;\n\n    this.y = 2;\n\n  }\n}\nMyClass.z = 3;\n\nconsole.log(MyClass.z\
    \ ); // 3\n```\n\n# Private Class Fields\n\nAll properties in ES6 classes are\
    \ public by default and can be examined or modified outside the class. In the\
    \ Animal example above, there’s nothing to prevent the food property being changed\
    \ without calling the eats setter:\n\n```javascript\nclass Animal {\n  constructor(name\
    \ = 'anonymous', legs = 4, noise = 'nothing') {\n\n    this.type = 'animal';\n\
    \n    this.name = name;\n\n    this.legs = legs;\n\n    this.noise = noise;\n\
    \  }\n\n  set eats(food) {\n\n    this.food = food;\n  }\n\n  get dinner() {\n\
    \n    return `${this.name} eats ${this.food || 'nothing'} for dinner.`;\n  }\n\
    }\nconst rex = new Animal('Rex', 4, 'woof');\n\nrex.eats = 'anything'; // standard\
    \ setter\n\nrex.food = 'tofu'; // bypass the eats setter altogether\n\nconsole.log(\
    \ rex.dinner ); // Rex eats tofu for dinner.\n```\n\nOther languages permit private\
    \ properties to be declared. That's not possible in ES6, although developers can\
    \ work around it using an underscore convention (_propertyName), closures, symbols,\
    \ or WeakMaps.\n\nIn ESnext, private class fields are defined using a hash # prefix:\n\
    \n```javascript\nclass MyClass {\n\n  a = 1; // a is public\n\n  #b = 2; // #b\
    \ is private\n\n  static #c = 3; // #c is private and static\n\n  incB() {\n \
    \   this.#b++;\n  }\n\n}\nconst m = new MyClass();\n\nm.incB(); // runs OK\n\n\
    m.#b = 0; // error - private property cannot be modified outside class\n```\n\n\
    Note that there's no way to define private methods, getters and setters, although\
    \ a TC39 stage 2: draft proposal suggests using a hash # prefix on names. For\
    \ example:\n\n```javascript\nclass MyClass {\n\n  // private property\n  #x =\
    \ 0;\n\n  // private method (can only be called within the class)\n  #incX() {\n\
    \    this.#x++;\n  }\n\n  // private setter (can only be called within the class)\n\
    \  set #setX(x) {\n    this.#x = x;\n  }\n\n  // private getter (can only be called\
    \ within the class)\n  get #getX() {\n    return this.#x;\n  }\n}\n```\n\n# Immediate\
    \ Benefit: Cleaner React Code!\n\nReact components often have methods tied to\
    \ DOM events. To ensure this resolves to the component, it's necessary to bind\
    \ every method accordingly. For example:\n\n```javascript\nclass App extends Component\
    \ {\n\n  constructor() {\n    super();\n\n    state = { count: 0 };\n\n    //\
    \ bind all methods\n    this.incCount = this.incCount.bind(this);\n  }\n\n  incCount()\
    \ {\n    this.setState(ps => ({ count: ps.count + 1 }));\n  }\n\n  render() {\n\
    \    return (\n      <div>\n        <p>{this.state.count}</p>\n        <button\
    \ onClick={this.incCount}>add one</button>\n      </div>\n    );\n  }\n}\n```\n\
    \nIf incCount is defined as a class field, it can be set to a function using ES6\
    \ => fat arrow, which automatically binds it to the defining object. The state\
    \ can also be declared as a class field so no constructor is required:\n\n```javascript\n\
    class App extends Component {\n\n  state = { count: 0 };\n\n  incCount = () =>\
    \ {\n    this.setState(ps => ({ count: ps.count + 1 }));\n  };\n\n  render() {\n\
    \    return (\n      <div>\n        <p>{this.state.count}</p>\n        <button\
    \ onClick={this.incCount}>add one</button>\n      </div>\n    );\n  }\n}\n```\n\
    \n# Using Class Fields Today\n\nClass fields are not currently supported in browsers\
    \ or Node.js. However, it's possible to transpile the syntax using Babel, which\
    \ is enabled by default using Create React App. Alternatively, Babel can be installed\
    \ and configured using the following terminal commands:\n\n`mkdir class-properties\
    \ && cd class-properties && npm init -y && npm install --save-dev babel-cli babel-plugin-transform-class-properties\
    \ && echo '{ \"plugins\": [\"transform-class-properties\"] }' > .babelrc`\n\n\
    Add a build command to the scripts section of package.json:\n`\"scripts\": { \"\
    build\": \"babel in.js -o out.js\" }`\n\nThen run with `npm run build` to transpile\
    \ the ESnext file in.js to a cross-compatible out.js.\n\nBabel support for private\
    \ methods, getters and setters has been proposed.\n"
