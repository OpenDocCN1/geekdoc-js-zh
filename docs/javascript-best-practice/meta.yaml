    ''{ "plugins": ["transform-class-properties"] }'' > .babelrc


    Add a build command to the scripts section of package.json: "scripts": { "build":
    "babel in.js -o out.js" } ,


    Then run with npm run build to transpile the ESnext file in.js to a cross-compatible
    out.js.


