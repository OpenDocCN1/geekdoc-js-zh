    \ JavaScript 至关重要。\n\n## 当你的 const 不一致时\n\n现代 JavaScript 引入两个关键字 `let` 和 `const`，它们在大多数情况下有效地取代了声明变量时对\
    \ `var` 的需求。它们的行为与 `var`并不相同。\n\n在传统的 JavaScript 中，在使用变量之前用 `var` 关键字声明变量始终是一种良好的编码实践。不这样做意味着你声明的变量可以被在相同上下文中运行的任何脚本在全局作用范围内访问。由于传统的\
    \ JavaScript 经常运行在可能加载多个脚本的网页上，这意味着在一个脚本中声明的变量可能会泄漏到另一个脚本中。\n\n现代 JavaScript 中\
    \ `var` 最干净的直接替代品是 `let`。但 `let` 有一些与 `var` 不同的特殊之处。使用 `var` 声明的变量总是被提升到其所在作用域的顶部，无论它们位于作用域内的什么位置。这意味着即使是深度嵌套的变量，从作用域开始就可以被视为已声明并可用。`let`\
