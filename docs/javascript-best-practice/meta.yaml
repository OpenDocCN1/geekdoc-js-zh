- md: "\n# Promises\n\nES2015 (ES6) introduced Promises. Callbacks are still used\
    \ below the surface, but Promises provide a clearer syntax that *chains asynchronous\
    \ commands so they run in series (more about that in the next section).\n\nTo\
    \ enable Promise-based execution, asynchronous callback-based functions must be\
    \ changed so they immediately return a Promise object. That object promises to\
    \ run one of two functions (passed as arguments) at some point in the future:\n\
    \n- *resolve*: a callback function run when processing successfully completes,\
    \ and\n- *reject*: an optional callback function run when a failure occurs.\n\n\
    In the example below, a database API provides a connect() method which accepts\
    \ a callback function. The outer asyncDBconnect() function immediately returns\
    \ a new Promise and runs either resolve() or reject() once a connection is established\
    \ or fails:\n\n```javascript\nconst db = require('database');\n\n// connect to\
    \ database\nfunction asyncDBconnect(param) {\n\n  return new Promise((resolve,\
    \ reject) => {\n    db.connect(param, (err, connection) => {\n      if (err) reject(err);\n\
    \      else resolve(connection);\n    });\n  });\n};\n```\n\nNode.js 8.0+ provides\
    \ a util.promisify utility to convert a callback-based function into a Promise-based\
    \ alternative. There are a couple of conditions:\n\n- 1. the callback must be\
    \ passed as the last parameter to an asynchronous function, and\n- 2. the callback\
    \ function must expect an error followed by a value parameter.\n\nExample:\n\n\
    ```javascript\n// Node.js: promisify fs.readFile\nconst\n  util = require('util'),\n\
    \  fs = require('fs'),\n  readFileAsync = util.promisify(fs.readFile)\n\nreadFileAsync('file.txt');\n\
    ```\n\nVarious client-side libraries also provide promisify options, but you can\
    \ create one yourself in a few lines:\n\n```javascript\n// promisify a callback\
    \ function passed as the last parameter\n// the callback function must accept\
    \ (err, data) parameters\nfunction promisify(fn) {\n  return function() {\n  \
    \  return new Promise(\n      (resolve, reject) => fn(\n        ...Array.from(arguments),\n\
    \        (err, data) => err ? reject(err) : resolve(data)\n      )\n    );\n \
    \ };\n}\n\n// example\nfunction wait(time, callback) {\n  setTimeout(() => callback(null,\
    \ 'done'), time);\n}\n\nconst asyncwait = promisify(wait);\nasyncwait(1000);\n\
    ```\n\n# Asynchronous Chaining\n\nAnything that returns a Promise can start a\
    \ series of asynchronous function calls defined in .then() methods. Each is passed\
    \ the result from the previous resolve:\n\n```javascript\nasyncDBconnect('http://localhost:1234')\n\
    \  .then(asyncGetSession) // passed result of asyncDBconnect\n  .then(asyncGetUser)\
    \ // passed result of asyncGetSession\n  .then(asyncLogAccess) // passed result\
    \ of asyncGetUser\n  .then((result) => { // non-asynchronous function\n    console.log('complete');\
    \ // (passed result of asyncLogAccess)\n    return result; // (result passed to\
    \ next .then())\n  }).catch((err) => { // called on any reject\n    console.log('error',\
    \ err);\n  });\n```\n\nSynchronous functions can be executed in .then() blocks.\
    \ The returned value is passed to the next .then() (if any).\n\nThe .catch() method\
    \ defines functions that's called when any previous reject fired. At point, no\
    \ further .then() methods will be run. You can have multiple .catch() methods\
    \ throughout the chain to capture different errors.\n\nES2018 introduces a .finally()\
    \ method, which runs any final logic regardless of the outcome — for example,\
    \ clean up, close a database connection etc. It's currently supported in Chrome\
    \ and Firefox, but Technical Committee 39 has released a .finally() polyfill.\n\
    \n```javascript\nfunction doSomething() {\n    doSomething(1)\n    .then(doSomething2)\n\
    \    .then(doSomething3)\n    .catch((err) => {\n        console.log(err);\n \
    \   })\n    .finally(() => {\n        // tidy up here!\n    })\n}\n```\n\n# Multiple\
    \ Asynchronous Calls with Promise.all\n\nPromise .then() runs asynchronous functions\
    \ one after the other. If the order doesn't matter — for example, initialising\
    \ unrelated components — it's faster to launch all asynchronous functions at the\
    \ same time and finish when the last (slowest) function resolve.\n\nThis can be\
    \ achieved with Promise.all(). It accepts an array of functions and returns another\
    \ Promise. For example:\n\n```javascript\nPromise.all([ async1, async2, async3\
    \ ])\n.then(values => {      // array of resolved values\n  console.log(values);\
    \      // (in same order as function array)\n  return values;\n})\n.catch(err\
    \ => {      // called on any reject\n  console.log('error', err);\n});\n```\n\n\
    Promise.all() terminates immediately if any one of the asynchronous functions\
    \ calls reject.\n\n# Multiple Asynchronous Calls with Promise.race\n\nPromise.race()\
    \ is similar to Promise.all(), except that it will resolve or reject as soon as\
    \ the first Promise resolves or rejects. The fastest Promise-based asynchronous\
    \ function will complete:\n\n```javascript\nPromise.race([ async1, async2, async3\
    \ ])\n.then(value => {      // single value\n  console.log(value);\n  return value;\n\
    })\n.catch(err => {      // called on any reject\n  console.log('error', err);\n\
    });\n```\n"
  mdcn: "\n\n# Promises (承诺)\n\nES2015 (ES6) 引入了 Promises。虽然底层仍然在使用回调函数，但 Promises\
    \ 提供了一种更清晰的语法来*链式调用异步命令使其按顺序执行（更多信息请见下一节）。*\n\n为了启用基于 Promise 的执行，必须对基于回调的异步函数进行修改，以便它们立即返回一个\
    \ Promise 对象。该对象承诺在未来的某个时刻执行两个函数之一（作为参数传递）：\n\n- *resolve*：当处理成功完成时执行的回调函数，以及——\n\
    - *reject*：当发生失败时执行的可选回调函数。\n\n在下例中，一个数据库 API 提供了一个接受回调函数的 `connect()` 方法。外层的\
    \ `asyncDBconnect()` 函数会立即返回一个新的 Promise，并在连接建立或失败后运行 `resolve()` 或 `reject()`：\n\
    \n```javascript\nconst db = require('database');\n\n// connect to database 连接数据库\n\
    function asyncDBconnect(param) {\n\n  return new Promise((resolve, reject) =>\
    \ {\n    db.connect(param, (err, connection) => {\n      if (err) reject(err);\n\
    \      else resolve(connection);\n    });\n  });\n};\n```\n\nNode.js 8.0+ 提供了\
    \ `util.promisify` 工具，可以将基于回调的函数转换为基于 Promise 的替代方案。需要满足两个条件：\n\n- 1. 回调必须作为最后一个参数传递给异步函数，并且\n\
    - 2. 回调函数必须期望一个错误参数后接值参数。\n\n示例：\n\n```javascript\n// Node.js: promisify fs.readFile\n\
    const\n  util = require('util'),\n  fs = require('fs'),\n  readFileAsync = util.promisify(fs.readFile)\n\
    \nreadFileAsync('file.txt');\n```\n\n各种客户端库也提供了 `promisify` 选项，但你可以自己用几行代码创建一个：\n\
    \n```javascript\n// 将作为最后一个参数的回调函数 Promise化\n//回调函数必须接受 (err, data) 参数\nfunction\
    \ promisify(fn) {\n  return function() {\n    return new Promise(\n      (resolve,\
    \ reject) => fn(\n        ...Array.from(arguments),\n        (err, data) => err\
    \ ? reject(err) : resolve(data)\n      )\n    );\n  };\n}\n\n// 示例\nfunction wait(time,\
    \ callback) {\n  setTimeout(() => callback(null, 'done'), time);\n}\n\nconst asyncwait\
    \ = promisify(wait);\nasyncwait(1000);\n```\n\n# 异步链式 (Asynchronous Chaining)\n\
    \n任何返回 Promise 的内容都可以开始在 `.then()` 方法中定义的系列异步函数调用。每个调用都会接收来自上一个 `resolve` 的结果：\n\
    \n```javascript\nasyncDBconnect('http://localhost:1234')\n  .then(asyncGetSession)\
    \ // 传递 asyncDBconnect 的结果\n  .then(asyncGetUser) // 传递 asyncGetSession 的结果\n\
    \  .then(asyncLogAccess) // 传递 asyncGetUser 的结果\n  .then((result) => { // 非异步函数\n\
    \    console.log('complete'); // (传递 asyncLogAccess 的结果)\n    return result; //\
    \ (传递给下一个 .then() 的结果)\n  }).catch((err) => { // 在任何 reject 时调用\n    console.log('error',\
    \ err);\n  });\n```\n\n同步函数可以在 `.then()` 块中执行。返回值会被传递给下一个 `.then()`（如果有）。\n\n\
    `.catch()` 方法定义了当任何之前的 `reject` 触发时被调用的函数。在此之后，将不再有后续的 `.then()` 方法运行。你可以在整个链中使用多个\
    \ `.catch()` 方法来捕获不同的错误。\n\nES2018 引入了 `.finally()` 方法，无论结果如何都会执行任何最终逻辑——例如清理工作、关闭数据库连接等。它目前在\
    \ Chrome 和 Firefox 中支持，但技术委员会 39（TC39）发布了 `.finally()` 的填充程序（polyfill）。\n\n```javascript\n\
    function doSomething() {\n    doSomething(1)\n    .then(doSomething2)\n    .then(doSomething3)\n\
    \    .catch((err) => {\n        console.log(err);\n    })\n    .finally(() =>\
    \ {\n        // 在此处清理！\n    })\n}\n```\n\n# 使用 Promise.all 进行多次异步调用\n\nPromise\
    \ `.then()` 接一个地执行异步函数。如果顺序不重要——例如初始化不相关的组件——那么同时启动所有异步函数并在最后一个（最慢的）函数 `resolve`\
    \ 时完成会更快。\n\n这可以通过 `Promise.all()` 实现。它接受一个函数数组并返回另一个 Promise。例如：\n\n```javascript\n\
    Promise.all([ async1, async2, async3 ])\n.then(values => {      // 已 resolve 值的数组\n\
    \  console.log(values);      // (顺序与函数数组相同)\n  return values;\n})\n.catch(err\
    \ => {      // 在任何 reject 时调用\n  console.log('error', err);\n});\n```\n\n如果任何一个异步函数调用\
    \ `reject`，`Promise.all()` 将立即终止。\n\n# 使用 Promise.race 进行多次异步调用\n\n`Promise.race()`\
    \ 与 `Promise.all()` 类似，不同之处在于它会在第一个 Promise resolve 或 reject 时立即变为 resolve 或 reject。最快的基于\
    \ Promise 的异步函数将完成：\n\n```javascript\nPromise.race([ async1, async2, async3 ])\n\
    .then(value => {      // 单个值\n  console.log(value);\n  return value;\n})\n.catch(err\
    \ => {      // 在任何 reject 时调用\n  console.log('error', err);\n});\n```\n\n"
