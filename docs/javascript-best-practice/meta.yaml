    # Chapter 7: Flow Control in Modern JS: Callbacks to Promises to Async/Await


    by Craig Buckler


    JavaScript is regularly claimed to be *asynchronous*. What does that mean? How
    does it affect development? How has the approach changed in recent years?


    Consider the following code:


    ```

    result1 = doSomething1();

    result2 = doSomething2(result1);

    ```


    Most languages process each line *synchronously*. The first line runs and returns
    a result. The second line runs once the first has finished *regardless of how
    long it takes*.'
  - '[PAGE 84]


    # Singlethread Processing


    JavaScript runs on a single processing thread. When executing in a browser tab,
    everything else stops. This is necessary because changes to the page DOM can''t
    occur on parallel threads; it would be dangerous to have one thread redirecting
    to a different URL while another attempts to append child nodes.


    This is rarely evident to the user, because processing occurs quickly in small
    chunks. For example, JavaScript detects a button click, runs a calculation, and
    updates the DOM. Once complete, the browser is free to process the next item on
    the queue.


    # Other Languages


    Other languages such as PHP also use a single thread but may be managed by a multi-threaded
    server such as Apache. Two requests to the same PHP page at the same time can
    initiate two threads running isolated instances of the PHP runtime.'
  - "[PAGE 85]\n\n# Going Asynchronous with Callbacks\n\nSingle threads raise a problem.\
    \ What happens when JavaScript calls a “slow” process such as an Ajax request\
    \ in the browser or a database operation on the server? That operation could take\
    \ several seconds — even minutes. A browser would become locked while it waited\
    \ for a response. On the server, Node.js application would not be able to process\
    \ further user requests.\n\nThe solution is asynchronous processing. Rather than\
    \ wait for completion, a process is to call another function when the result is\
    \ ready. This is known as a callback, and it's passed as an argument to any asynchronous\
    \ function. For example: doSomethingAsync(callback1); console.log('finished');\
    \ // call when doSomethingAsync completes function callback1(error) { if (!error)\
    \ console.log('doSomethingAsync complete');\n\ndoSomethingAsync() accepts a callback\
    \ function as a parameter (only a reference to that function is passed so there's\
    \ little overhead). It doesn’t matter how long doSomethingAsync() takes; all we\
    \ know is that callback1() will be executed at some point in the future. The console\
    \ will show: finished doSomethingAsync complete\n\n# Callback Hell\n\nOften, a\
    \ callback is only ever called by one asynchronous function. It's therefore possible\
    \ to use concise, anonymous inline functions:\n\n```\ndoSomethingAsync(error =>\
    \ {\n  if (!error) console.log('doSomethingAsync complete');\n});\n```\n\nA series\
    \ of two or more asynchronous calls can be completed in series by nesting callback\
    \ functions. For example:\n\n```\nasync1(err, res) => {\n  if (!err) async2(res,\
    \ err, res) => {\n    if (!err) async3(res, err, res) => {\n      console.log('async1,\
    \ async2, async3 complete.');\n    }\n  }\n});\n});\n```"
