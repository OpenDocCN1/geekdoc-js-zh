    \ ES5\nsetInterval(function() {\n  this.age++; // ||this| refers to the global\
    \ object\n}, 1000);\n\n// ES2015\nsetInterval(() => {\n  this.age++; // ||this|\
    \ properly refers to the person object\n}, 1000);\n\nvar p = new Person();\n```\n\
    \n# Improved Class syntax\n\nIf you're a fan of object-oriented programming, you\
    \ might like the addition of"
