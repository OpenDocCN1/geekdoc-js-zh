- md: "\n# Something Solid to Cling To\n\nI don't know anybody who isn't confused\
    \ by the state of JavaScript these days, whether you're new to JavaScript, or\
    \ you've been coding with it for a while. So many new frameworks, so many changes\
    \ to the language, and so many contexts to consider. It's a wonder that anybody\
    \ gets any work done, with all of the new things that we have to learn every month.\n\
    \nI believe that the secret to success with any programming language, no matter\
    \ how complex the application, is getting back to the basics. If you want to understand\
    \ Rails, start by working on your Ruby skills, and if you want to use immutables\
    \ and unidirectional flow in isomorphic React with webpack (or whatever the cool\
    \ nerds are doing these days) start by knowing your core JavaScript.\n\nUnderstanding\
    \ how the language itself works is much more practical than familiarizing yourself\
    \ with the latest frameworks and environments. Those change faster than the weather.\
    \ And with JavaScript, we have a long history of thoughtful information online\
    \ about how JavaScript was created and how to use it effectively.\n\nThe problem\
    \ is that some of the new techniques that have come around with the latest versions\
    \ of JavaScript make some of the old rules obsolete. But not all of them! Sometimes\
    \ a new syntax may replace a clunkier one to accomplish the same task. Other times\
    \ the new approach may seem like a simpler drop-in replacement for the way we\
    \ used to do things, but there are subtle differences, and it's important to be\
    \ aware of what those are.\n\n## A Spoonful of Syntactic Sugar\n\nA lot of the\
    \ changes in JavaScript in recent years have been described as syntactic sugar\
    \ for existing syntax. In many cases, the syntactic sugar can help the medicine\
    \ go down for Java programmers learning how to work with JavaScript, or for the\
    \ rest of us just want a cleaner, simpler way to accomplish something we already\
    \ knew how to do. Other changes seem to introduce magical new capabilities.\n\n\
    But if you try to use modern syntax to recreate a familiar old technique, or stick\
    \ it without understanding how it actually behaves, you run the risk of:\n\n-\
    \ having debug code that worked perfectly before\n- introducing subtle mistakes\
    \ that may catch you least expect at runtime\n- creating code that fails silently\
    \ when you least expect it.\n\nIn fact, several of the changes that appear to\
    \ be drop-in replacements for existing techniques actually behave differently\
    \ from the code that they supposedly replace. In many cases, it can make more\
    \ sense to use the original, older style to accomplish what you're trying to do.\
    \ Recognizing when that's happening, and knowing how to make the choice, is critical\
    \ to writing effective JavaScript.\n\n## When Your const Isn’t Consistent\n\n\
    Modern JavaScript introduced two keywords, let and const, which effectively replace\
    \ the need for var when declaring variables in most cases. They don't behave exactly\
    \ the same way that var does.\n\nIn traditional JavaScript, it was always a clean\
    \ coding practice to declare your variables with the var keyword before using\
    \ them. Failure to do so meant that the variables you declared could be accessed\
    \ in the global scope by any scripts that happened to run in the same context.\
    \ And because traditional JavaScript was frequently run on webpages where multiple\
    \ scripts might be loaded simultaneously, that meant it was possible for variables\
    \ declared in one script to leak into another.\n\nThe cleanest drop-in replacement\
    \ for var in modern JavaScript is let. But let has a few idiosyncrasies that distinguish\
    \ it from var. Variable declarations with var were always hoisted to the top of\
    \ their containing scope by default, regardless of where they were placed inside\
    \ of scope. That meant even a deeply nested variable could be considered declared\
    \ and available right from the beginning of its scope. The same is not true of\
    \ let or const.\n\n```javascript\nconsole.log(usingVar); // undefined\nvar usingVar\
    \ = \"defined\";\nconsole.log(usingVar); // \"defined\"\n\nconsole.log(usingLet);\
    \ // error\nlet usingLet = \"defined\"; // never gets executed\nconsole.log(usingLet);\
    \ // never gets executed\n```\n\nWhen you declare a variable let or const, the\
    \ scope for that variable is limited to the local block where it’s declared. A\
    \ block in JavaScript is distinguished by a set of curly braces {}, such as the\
    \ body of a function or the executable code within a loop.\n\nThis is a great\
    \ convenience for block-scoped uses of variables such as iterators and loops.\
    \ Previously, variables declared within loops would be available to the containing\
    \ scope, leading to potential confusion when multiple counters might use the same\
    \ variable name. However, let can catch you by surprise if you expect your variable\
    \ declared somewhere inside of block of your script to be available elsewhere.\n\
    \n```javascript\nfor (var count = 0; count < 5; count++) {\n  console.log(count);\n\
    } // outputs the numbers 0 - 4 to the console\nconsole.log(count); // 5\n```\n\
    \n## Limiting the Scope of the Function\n\nTraditional functions, defined using\
    \ the function keyword, can be called to execute statements, and optionally return\
    \ a value:\n\n```javascript\nfunction doSomething(param) {\n  return `Hello ${param}`;\n\
    }\nconsole.log(doSomething(\"World\")); // \"Hello World\"\n```\n\nThey can also\
