    {


    return (`${data} from a traditional function`);


    const arrow = data => `${data} from an arrow function`;

    console.log(traditional("Hi")); // "Hi from a traditional function

    console.log(arrow("Hi")); // "Hi from an arrow function


    Arrow functions encapsulate several qualities that can make them more convenient,
    and leave out other behavior that is not as useful when calling a function. They
    are not drop-in replacements for the more versatile traditional function keyword.


    For example, an arrow function inherits both this and arguments from the contexts
    in which it''s called. That''s great for situations like event handling or setTimeout
    when a programmer frequently wants the behavior being called to apply to the context
    in which it was requested. Traditional functions have forced programmers to write
    convoluted code that binds a function to an existing function by using .bind(this).
    None of that is necessary with arrow functions.


