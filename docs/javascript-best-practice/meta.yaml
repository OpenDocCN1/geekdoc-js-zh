  md: "# JavaScript ES2015+\n\nIn 2015, the sixth version of ECMAScript — the specification\
    \ that defines the JavaScript language — was released under the name of ES2015\
    \ (still often referred to as ES6). This new version included substantial additions\
    \ to the language, making it easier and more feasible to build ambitious applications.\
    \ But improvements don’t stop with ES2015; each year, a new version is released.\n\
    \n# Declaring variables\n\nJavaScript now has two additional ways to declare variables:\
    \ let and const.\n\nlet is the successor to var. Although var is still available,\
    \ let limits the scope of variables to the block (rather than the function) they’re\
    \ declared within, which reduces the room for error:\n\n```\n// ES5\nfor (var\
    \ i = 1; i < 5; i++) {\n  console.log(i);\n}\n// <-- logs the numbers 1 to 4\n\
    console.log(i);\n// <-- 5 (variable i still exists outside the loop)\n\nES2015\n\
    for (let j = 1; j < 5; j++) {\n  console.log(j);\n}\nconsole.log(j);\n// <-- 'Uncaught\
    \ ReferenceError: j is not defined\n```\n\nUsing const allows you to define variables\
    \ that cannot be rebound to new values. For primitive values as strings and numbers,\
    \ this results in something similar to a constant, as you cannot change the value\
    \ once it has been declared:\n\n```\nconst name = 'Bill';\nname = 'Steve';\n//\
    \ <-- 'Uncaught TypeError: Assignment to constant variable.'\n```"
  merge: -1
