    \ any await which fails. If you have a long set of asynchronous await commands,\
    \ you may need multiple try/catch blocks.\n\nOne alternative is a higher-order\
    \ function, which catches errors so try/catch blocks become unnecessary (thanks\
    \ to @wesbos for the suggestion):\n\n```\nasync function connect() {\n  const\n\
    \    connection = await asyncDBconnect('http://localhost:1234'),\n    session\
    \ = await asyncGetSession(connection),\n    user = await asyncGetUser(session),\n\
    \    log = await asyncLogAccess(user);\n\n  return true;\n}\n\n// higher-order\
    \ function to catch errors\nfunction catchErrors(fn) {\n  return function (...args)\
    \ {\n    return fn(...args).catch(err => {\n      console.log('ERROR', err);\n\
    \    });\n  }\n}\n\n(async () => {\n  await catchErrors(connect());\n})();\n```\n\
    \nHowever, this option may not be practical in situations where an application\
    \ must react to some errors in a different way from others.\n\nDespite some pitfalls,\
    \ async/await is an elegant addition to JavaScript. Further resources:\n\n+  \
    \ - MDN async and await\n- Async functions - making promises friendly\n- TC39\
    \ Async Functions specification\n- Simplifying Asynchronous Coding with Async\
    \ Functions"
  - '[PAGE 96]


    # JavaScript Journey


    Asynchronous programming is a challenge that’s impossible to avoid in JavaScript.
    Callbacks are essential in most applications, but it’s easy to become entangled
    in deeply nested functions.


    Promises abstract callbacks, but there are many syntactical traps. Converting
    existing functions can be a chore and .then() chains still look messy.


    Fortunately, async/await delivers clarity. Code looks synchronous, but it can’t
    monopolize the single processing thread. It will change the way you write JavaScript
    and could even make you appreciate Promises — if you didn’t before!'
