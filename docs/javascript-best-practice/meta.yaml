    # Setting the Stage


    First of all, let''s get the following out of the way: if you''re testing exclusively
    on your desktop device, you''re excluding more than 50% of your users.


    # Desktop vs Mobile vs Tablet Market Share Worldwide

    Oct 2016 - Oct 2017


    ![](img/e8f64d4072ea21c0e3b4884a8310a816_37_0.png)


    This trend will only continue to grow, as the emerging market''s preferred gateway
    to the web is a sub-$100 Android device. The era of the desktop as the main device
    to access the Internet is over, and the next billion internet users will visit
    your sites primarily through a mobile device.


    Testing in Chrome DevTools'' device mode isn''t a valid substitute to testing
    on a real device. Using CPU and network throttling helps, but it''s a fundamentally
    different beast. Test on real devices.'
