  md: "# Modular Code\n\nModern web applications can have thousands (even hundred\
    \ of thousands) of lines of code. Working at that size becomes almost impossible\
    \ without a mechanism to organize everything in smaller components, writing specialized\
    \ and isolated pieces of code that can be reused as necessary in a controlled\
    \ way. This is the job of modules.\n\n# CommonJS modules\n\nA handful of module\
    \ formats has emerged over the years, the most popular of which is CommonJS. It's\
    \ the default module format in Node.js, and can be used in client-side code with\
    \ the help of module bundlers, which we'll talk about shortly.\n\nIt makes use\
    \ of a module object to export functionality from a JavaScript file and require()\
    \ to import that functionality where you need it.\n\n```\n// lib/math.js\nfunction\
    \ sum(x, y) {\n  return x + y;\n}\nconst pi = 3.141593\n\nmodule.exports = {\n\
    \  sum: sum,\n  pi: pi\n};\n\n// app.js\nconst math = require(\"lib/math\");\n\
    \nconsole.log(\"2pi \" + math.sum(math.pi, math.pi));\n```\n\n# ES2015 modules\n\
    \nES2015 introduces a way to define and consume components right into the language,\
    \ which was previously possible only with third-party libraries. You can have\
    \ separate files with the functionality you want and export certain parts"
  merge: -1
  pgno: 16
- img_proc: true
  md: "have separate files with functionality you want, and export just certain parts\n\
    to make them available to your application.\n\n# ### Native Browser Support\n\n\
    At the time of writing, native browser support for ES2015 modules is still under\n\
    development, so you currently need some additional tools to be able to use them.\n\
    \nHere's an example:\n\n```\n// lib/math.js\n\nexport function sum(x, y) {\n \
    \ return x + y;\n}\nexport const pi = 3.141593;\n```\n\nHere we have a module\
    \ that exports a function and a variable. We can include\nthat file in another\
    \ one and use those exported functions:\n\n```\n// app.js\n\nimport * as math\
    \ from \"lib/math\";\n\nconsole.log(\"2pi = \" + math.sum(math.pi, math.pi));\n\
    ```\n\nOr we can also be specific and import only what we need:\n\n```\n// otherApp.js\n\
    \nimport {sum, pi} from \"lib/math\"\n\nconsole.log(\"2pi = \" + sum(pi, pi));\n\
    ```\n\nThese examples have been extracted from the Babel website. For an in-depth\n\
    look, check out Understanding ES6 Modules."
