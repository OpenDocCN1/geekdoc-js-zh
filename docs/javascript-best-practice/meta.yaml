    \n```\nif (document.querySelector('.mega-widget')) {\n  import('./mega-widget');\n\
    }\n```\n\nIf your app finds the widget on the page, it will dynamically load the\
    \ required supporting code. Otherwise, all's good.\n\nAlso, Webpack needs its\
