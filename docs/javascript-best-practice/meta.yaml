    \n# 关于 SitePoint\n\nSitePoint 专门为 Web 行业人士编写有趣、实用且易于理解的内容。访问 http://www.sitepoint.com/\
    \ 访问我们的博客、书籍、通讯、文章和社区论坛。你可以在那里找到关于 JavaScript、PHP、设计等大量信息。\n\n## 前言\n\n毫无疑问，JavaScript\
    \ 生态系统的变化非常快。不仅新的工具和框架以快速的速度被引入和开发，语言本身随着 ES2015（又称 ES6）的引入也发生了巨大变化。可以理解，有很多文章在抱怨如今学习现代\
    \ JavaScript 开发有多么困难。我们的目标是通过这一关于现代 JavaScript 的书籍，尽可能地减少这种困惑。\n\n本书介绍了现代 JavaScript\
