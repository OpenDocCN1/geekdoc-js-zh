    // person.name is now Steve.\n// As we're not changing the object that person\
    \ is bound to,\nJavaScript doesn't complain.\n```\n\n# Arrow functions\n\nArrow\
    \ functions provide a cleaner syntax for declaring anonymous functions (lambdas),\
    \ dropping the function keyword and the return keyword when the body function\
    \ has only one expression. This can allow you to write functional style code in\
    \ a nicer way:\n\n```\n// ES5\nvar add = function(a, b) {\n  return a + b;\n}\n\
