  mdcn: "\n\n在 JavaScript 中，使用 `function` 关键字进行原型继承即使在脚本中后后定义也能正常工作，因为函数声明会被自动提升到顶部，而\
    \ `class` 并不会这样。\n\n```javascript\n// 使用函数声明并实例化对象（已提升）\nlet aProto = new Proto(\"\
    Myra\"); aProto.greet(); // \"Hi Myra\"\n\nfunction Proto(name) {\n  this.name\
    \ = name;\n  this.greet = function() {\n    console.log(`Hi ${this.name}`); \n\
    \  };\n}\n\n// 使用类声明并实例化对象（未提升）\nclass Classy {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n  greet() {\n    console.log(`Hi ${this.name}`);\n  }\n}\nlet\
    \ aClass = new Classy(\"Sonja\"); aClass.greet(); // \"Hi Sonja\"\n```\n\n## 与箭头函数的区别\n\
    \n传统函数的其他方面现在可以使用箭头函数来访问，这种新语法允许你更简洁地编写可调用函数，以便更整齐地嵌套在回调函数中。事实上，箭头函数最简单的语法是完全省略大括号的单行代码，并且它会自动返回所执行语句的结果：\n\
    \n```javascript\nfunction traditional(data) {\n  return (`data} from a traditional\
    \ function`);\n}\n\nconst arrow = data => `${data} from an arrow function`;\n\
    console.log(traditional(\"Hi\")); // \"Hi from a traditional function\"\nconsole.log(arrow(\"\
    Hi\")); // \"Hi from an arrow function\"\n```\n\n箭头函数封装了几个使其变得更方便的特性，并省略了其他在调用函数时不实用的行为。它们并不是功能更强大的传统\
    \ `function` 关键字的无缝替代品。\n\n例如，箭头函数会从调用它的上下文继承 `this` 和 `arguments`。这对于事件处理或 `setTimeout`\
    \ 等情况非常有用，因为程序员经常希望被调用的行为应用于请求它时的上下文中。传统函数迫使程序员编写复杂的代码，通过使用 `.bind(this)` 将函数绑定到现有的函数上。使用箭头函数时这些都不需要了。\n\
    \n```javascript\nclass GreeterTraditional {\n  constructor() {\n    this.name\
    \ = \"Joe\";\n  }\n\n  greet() {\n    setTimeout(function () {\n      console.log(`Hello\
    \ ${this.name}`);\n    }, 1000); // 内部函数有自己的 this，没有名字\n  }\n}\n\nlet greeterTraditional\
    \ = new GreeterTraditional();\ngreeterTraditional.greet(); // \"Hello \"\n\nclass\
    \ GreeterBound {\n  constructor() {\n    this.name = \"Steven\";\n  }\n\n  greet()\
    \ {\n    setTimeout(function () {\n      console.log(`Hello ${this.name}`);\n\
    \    }.bind(this), 1000); // 从外部上下文传递 this\n  }\n}\n\nlet greeterBound = new GreeterBound();\
    \ // \"Hello Steven\"\ngreeterBound.greet();\n\nclass GreeterArrow {\n  constructor()\
    \ {\n    this.name = \"Ravi\";\n  }\n\n  greet() {\n    setTimeout(() => {\n \
    \     console.log(`Hello ${this.name}`);\n    }, 1000); // 箭头函数默认继承 this\n  }\n\
    }\n\nlet greeterArrow = new GreeterArrow();\ngreeterArrow.greet(); // \"Hello\
    \ Ravi\"\n```\n\n## 理解你所获得的内容\n\n这不仅仅是语法糖。JavaScript 引入的许多新变化是因为需要新功能。但这并不意味着\
    \ JavaScript 传统语法的旧原因已经消失了。继续使用传统的 JavaScript 语法通常是有意义的，有时使用新语法可以让你你的代码写得更快、更易理解。\n\
    \n检查一下你正在学习的在线教程。如果作者使用 `var` 初始化所有变量，忽略 `class` 而倾向于使用原型继承，或者在回调函数中依赖函数语句，那么你可以预期的其余语法将基于旧的、传统的\
    \ JavaScript。对于今天来说，从 JavaScript 一直以来教学和使用的传统方式中，我们仍然有许多可以学习和应用的内容。但如果你在初始化中看到\
    \ `let` 和 `const`，在回调中看到箭头函数，并将 `class` 作为面向对象模式的基础，那么你可能也会在示例中看到其他现代 JavaScript\
    \ 代码。\n\n现代 JavaScript 的最佳实践是关注语言实际上在做什么。取决于你的习惯，这并不总是显而易见的。但请思考你写的代码试图实现什么，你将在哪里部署它，以及下一个修改它的人是谁。然后自己决定什么是最佳方法。\n\
    \n## 第7 章：现代 JS 中的流程控制：从回调到 Promise 再到 Async/Await\n\n作者 Craig Buckler\n\nJavaScript\
    \ 经常被称为是*异步*的。这意味着什么？它如何影响开发？近年来这种方法发生了怎样的变化？\n\n考虑以下代码：\n\n```javascript\nresult1\
    \ = doSomething1();\nresult2 = doSomething2(result1);\n```\n\n大多数语言*同步*地处理每一行。第一行运行并返回结果。第二行在第一行完成后运行，*无论它需要多长时间*。\n\
    \n## 单线程处理\n\nJavaScript 运行在单个处理线程上。在浏览器标签页中执行时，其他所有操作都会停止。这是必要的，因为对页面 DOM 的更改不能并行发生。这对用户来说很少明显，因为处理是以小分块进行的。例如，JavaScript\
    \ 检测到按钮点击、运行计算并更新 DOM。\n\n## 其他语言\n\nPHP 等其他语言也使用单线程，但可能由多线程服务器实例管理。同时对同一个 PHP\
    \ 页面的两个请求可以启动\n\n## 使用回调实现异步\n\n单线程引发了一个问题。当 JavaScript 调用“慢”过程（如浏览器中的 Ajax 请求或服务器上的数据库操作）时会发生什么？该操作可能需要几秒甚至几分钟。浏览器将在等待响应时被锁定。\n\
    \n解决方案是异步处理。与其等待完成，处理方法是在结果准备绪时调用另一个函数。这被称为回调（callback），它被作为参数传递给任何异步函数。例如：\n\n\
    ```javascript\ndoSomethingAsync(callback1);\nconsole.log('finished'); // 当 doSomethingAsync\
    \ 完成时调用\n\nfunction callback1(error) {\n  if (!error) console.log('doSomethingAsync\
    \ complete');\n}\n```\n\ndoSomethingAsync() 接受一个回调函数作为参数（仅传递该函数的引用，因此开销很小）。doSomethingAsync()\
    \ 需要多长时间并不重要；我们只知道 callback1() 将在未来的某个时刻执行。控制台将显示：finished doSomethingAsync complete\n\
    \n## 回调地狱\n\n通常，回调只会被一个异步函数调用。因此可以使用简洁的匿名内联函数：\n\n```javascript\ndoSomethingAsync(error\
    \ => {\n  if (!error) console.log('doSomethingAsync complete');\n});\n```\n\n\
    两个或多个异步调用可以通过嵌套回调函数来顺序完成。例如：\n\n```javascript\nasync1(err, res => {\n  if (!err)\
    \ async2(res, err, res) => {\n    if (!err) async3(res, err, res) => {\n     \
    \ console.log('async1, async2, async3 complete.');\n    }\n  }\n});\n```\n\n不幸的是，这引入了**回调地狱**（callback\
    \ hell）——一个臭名昭著的概念甚至有自己的网页（https://en.wikipedia.org/wiki/Callback_hell）！代码难以阅读，在添加错误处理逻辑后会变得糟糕。\n\
    \n回调地狱在客户端编码中相对罕见。如果你在进行 Ajax 调用、更新 DOM 并等待动画完成，可能会达到两三层，但通常仍然可控。\n\n在操作系统或服务器进程上情况不同。Node.js\
    \ API 调用可以在发送响应之前，接收文件上传、更新多个数据库表、写入日志并进行进一步的 API 调用。\n\n"
