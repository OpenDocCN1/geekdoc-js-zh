    ```\n\nMost languages process each line *synchronously*. The first line runs and\
    \ returns a result. The second line runs once the first has finished *regardless\
    \ of how long it takes*.\n\n## Singlethread Processing\n\nJavaScript runs on a\
    \ single processing thread. When executing in a browser tab, everything else stops.\
    \ This is necessary because changes to the page DOM can't occur on parallel. This\
    \ is rarely evident to the user because processing occurs in small chunks. For\
