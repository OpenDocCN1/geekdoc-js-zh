    # # Conclusion


    The transition from simple web pages to modern JavaScript applications can seem
    daunting if you''ve been away from web development in recent years, but I hope
    this article was useful as a starting point. I''ve linked to more in-depth articles
    on each topic where possible so you can explore further.


    And remember that if at some point, after looking all the options available, everything
    seems overwhelming and messy, just keep in mind the KISS principle, and use only
    what you think you need and not everything you have available. At the end of the
    day, solving problems is what matters, not using the latest of everything.'
