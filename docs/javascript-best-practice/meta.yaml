    \ // \"My cat's name is Fluffy\"\n```\n\n## 按时到达类\n\n函数的一部分已被 `class` 关键字接管。这允许程序员选择倾向于使用可调用箭头函数遵循函数式编程范式，还是使用类这种更面向对象的方法代替传统函数的原型继承。\n\
