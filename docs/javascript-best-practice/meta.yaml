    # Pointed Differences with Arrow Functions


    The other aspect of traditional functions can now be accessed using arrow functions,
    a new syntax that allows you to write a callable function more concisely, to fit
    more neatly inside a callback. In fact, the simplest syntax for an arrow function
    is a single line that leaves off the curly braces entirely, and automatically
