  md: "# ES6 Default Parameters\n\nLet’s freshen up our knowledge quickly and take\
    \ a look at the syntax again.\nDefault parameters allow us to initialize functions\
    \ with default values. A default is used when an argument is either omitted or\
    \ undefined — meaning null is a valid value. A default parameter can be anything\
    \ from a number to another\n\n```\n// Basic syntax\nfunction multiply(a, b = 2)\
    \ {\n  return a * b;\n}\nmultiply(5); // 10\n\n// Default parameters are also\
    \ available to later default\nfunction foo(num = 1, multi = multiply(num)) {\n\
    \  return [num, multi];\n}\nfoo(); // [1, 2]\nfoo(6); // [6, 12]\n```\n\n# A realworld\
    \ example\n\nLet's take a basic function and demonstrate how default parameters\
    \ can speed up your development and make the code better organized.\n\nOur example\
    \ method is called createElement(). It takes a few configuration arguments, and\
    \ returns an HTML element. The API looks like this:\n\n```\n// We want a <p> element,\
    \ with some text content and two classes attached.\n// Returns <p class=\"very-special-text\
    \ super-big\">Such unique text</p>\ncreateElement('p',\n  content: 'Such unique\
    \ text',\n  classNames: ['very-special-text', 'super-big']\n);\n\n// To make this\
    \ method even more useful, it should always return a default\n// element when\
    \ any argument is left out or none are passed at all.\n```"
  merge: -1
