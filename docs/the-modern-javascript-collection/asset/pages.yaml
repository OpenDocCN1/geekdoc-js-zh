  md: 'enough for the initial setup.

    Choose task runner and stick with it for a while. Don''t switch to another option
    on a whim.


    Some of the tools and concepts may be new to you, take a deep breath and concentrate
    on one thing at a time.


    # Task Runners: the Options


    Build tools such as GNU Make have been available for decades, but web-specific
    task runners are a relatively new phenomenon. The first to achieve critical mass
    was Grunt — Node.js task runner which used plugins controlled (originally) by
    a JSON configuration file. Grunt was hugely successful, but there were a number
    of issues:


    +   - Grunt required plugins for basic functionality as file watching.

    - Grunt plugins often performed multiple tasks, which made customisation more
    awkward.

    - JSON configuration could become unwieldy for all the most basic tasks.

    - Tasks could run slowly because Grunt saved files between every processing step.


    Many issues were addressed in later editions, but Gulp had already arrived and
    offered a number of improvements:


    +   - Features such as file watching were built in.

    - Gulp plugins were (mostly) designed to a single job.

    - Gulp used JavaScript configuration code that was less verbose, easier to read,
    simpler to modify, and provided better flexibility.

    - Gulp was faster because it uses Node.js streams to pass data through a series
    of piped plugins. Files were only written at the end of the task.


    Of course, Gulp itself is not perfect, and new task runners such as Broccoli.js,
    Brunch and webpack are also competing for developer attention. More, npm itself
    has been touted as a simpler option. All have their pros and cons, but Gulp remains
    the favorite and is currently used by more than 40% of web developers.


    Gulp requires Node.js, while some JavaScript knowledge is beneficial, learning
    from such feedback is useful'
