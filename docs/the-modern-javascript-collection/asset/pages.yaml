    # Constructors


    Arrow functions can''t be used as constructors as other functions can. Don''t
    use them to create similar objects as you would with other functions. If you attempt
    to use new with an arrow function, it will throw an error. Arrow functions, built-in
    functions (aka methods), don''t have a prototype property or other internal methods.
    Because constructors are generally used to create class-like objects in JavaScript,
    you should use the new ES6 classes instead.


    # Generators


    Arrow functions are designed to be lightweight and can''t be used as generators.
    Using the yield keyword in ES6 will throw an error. Use ES6 generators instead.


    # Arguments object


    Arrow functions don''t have the local variable arguments as do other functions.
    The arguments object is an array-like object that allows developers to dynamically
    discover and access a function''s arguments. This is helpful because JavaScript
    functions can take an unlimited number of arguments. Arrow functions do not have
    this object.


