- img_proc: true
  md: 'Being a popular library, Axios benefits from an ecosystem of thirdparty libraries
    that extend its functionality. From interceptors to testing adaptors to loggers,
    there''s quite a variety available. Here are a few that I think you may find useful:


    +   - axios-mock-adapter: allows you to easily mock requests to facilitate testing
    your code.

    - axios-cache-plugin: a wrapper for selectively caching GET requests.

    - redux-axios-middleware: if you''re a Redux user, this middleware provides a
    neat way to dispatch Ajax requests with plain old actions.


    A list of more Axios add-ons and extentions is available on the Axios GitHub repo.


    In summary, Axios has a lot to recommend it. It has a straightforward API, with
    helpful shortcut methods that will be familiar to anyone who''s used jQuery before.
    Its popularity, and the availability of a variety of thirdparty add-ons, make
    it a solid choice for including in your apps, whether front end, back end, or
    both.'
