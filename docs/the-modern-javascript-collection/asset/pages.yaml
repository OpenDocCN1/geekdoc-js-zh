    # # Regular Expression Unicode Property Escapes


    Until now, it hasn''t been possible to access Unicode character properties

    atively in regular expressions. ES2018 adds Unicode property escapes — in the

    form \{...} and \P{...} — in regular expressions that have the u (unicode)

    flag set. For example:


    ```

    const reGreekSymbol = \p{Script=Greek}u;

    reGreekSymbol.test(''\pi''); // true

    ```


    # # Template Literals Tweak


    Finally, all syntactic restrictions related to escape sequences in template literals

    have been removed.


    Previously, a \u started a unicode escape, an \x started a hex escape, and \

