  md: '# Preface


    There’s no doubt that the JavaScript ecosystem changes fast. Not only are new
    tools and frameworks introduced and developed at a rapid rate, the language itself
    has undergone big changes with the introduction of ES2015 (aka ES6) and further
    revisions. Understandably, many articles have been written complaining how difficult
    it is to learn modern JavaScript development these days. We''re aiming to minimize
    confusion with this set of books on modern JavaScript.


    This collection contains:


    +   * Practical ES6 is a collection of articles introducing many of the powerful
    new JavaScript language features that were introduced in ECMAScript 2015, as well
    as features introduced in ECMAScript 2016 and 2017. It also takes a look at the
    features planned for ECMAScript 2018 in this rapidly evolving language.

    * JavaScript: Best Practice presents articles discussing JavaScript best practice,
    enabling you to write more powerful code that is clean, performant, maintainable,
    and reusable.

    * 6 JavaScript Projects presents six complete JavaScript projects; each taking
    advantage of modern JavaScript and its ecosystem. You''ll learn to build several
    different apps, and along the way you''ll pick up ton of useful advice, tips,
    and techniques.

    * Modern JavaScript Tools & Skills contains a collection of articles outlining
    essential tools and skills that every modern JavaScript developer should know.


    # Who Should Read This Collection?


    This book is for all front-end developers who wish to improve their JavaScript
    skills. You’ll need to be familiar with HTML and CSS and have a reasonable level
    of understanding JavaScript in order to follow the discussion.


    # Conventions Used'
