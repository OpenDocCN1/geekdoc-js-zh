    # HTTP/2


    One of the primary benefits of using a module bundle like Webpack can help you
    improve performance by giving control over how the assets are built and then fetched
    on the client. It has been considered best practice for years to concatenate files
    to reduce the number of requests that need to be made on the client. This is still
    valid, but HTTP/2 now allows multiple files to be delivered in a single request,
    so concatenation is a silver bullet among. Your app may actually benefit from
    having many small files individually cached. The client could then fetch a single
    changed module rather than having to fetch an entire bundle again with mostly
    the same contents.


    The creator of Webpack, Tobias Koppers, has written an informative post explaining
    why bundling is so important, even in the HTTP/2 era.


    Read more about this over at Webpack & HTTP/2.


    # Over to You


    I hope you''ve found this introduction to Webpack helpful and are able to start
    using it to get great effect. It can take a little time to wrap your head around
    Webpack''s configuration, loaders and plugins, but learning how this tool will
    pay off.


    The documentation for Webpack 4 is currently being worked on, but is really well
    put together. I highly recommend reading through the Concepts and Guides for more
    information. Here''s a few other topics you may be interested in:


    +   - Source Maps for development

    - Source Maps for production

    - Cache busting with hashed filenames

    - Splitting a vendor bundle'
