  md: '# npm scripts


    npm has a feature called scripts that allows you to run specific pieces of code
    with a single command. We can use this to create a couple of scripts that will
    speed up our use of Parcel.


    Add the following to the "scripts" section of the package.json file:


    ```

    "start": "parcel src/index.html --out-dir docs"

    "build": "parcel build src/index.html --out-dir docs --pub-url ./

    ```


    Now we can simply run the following commands to start the server:


    ```

    npm start

    ```


    And the following command will run the build process:


    ```

    npm run build

    ```


    If you''ve never used npm scripts, or would like a refresher, you might like to
    check out our beginner-friendly tutorial on the subject.


    # Deploying to GitHub Pages


    GitHub is a great place for hosting your code, and it also has a great feature
    called GitHub Pages that allows you to host static sites on GitHub. To get started,
    you''ll need to make sure you have a GitHub account and you have git installed
    on your local machine.


    To make sure we don''t commit unnecessary files, let''s add a gitignore file to
    the hyper list directory:


    ```

    touch .gitignore

    ```


    As the name suggests, this file tells which files (or patterns) it should ignore.
    It''s usually used to avoid committing files that''t useful to other collaborators
    (such as the temporary files IDEs create, etc.).


    I''d recommend adding the following items to make sure they''re not tracked by
    git (remember that gitignore is a hidden file!).'
