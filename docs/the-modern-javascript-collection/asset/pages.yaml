  md: '# Chapter 12: Understanding ES6 Modules


    by Craig Buckler


    This chapter explores ES6 modules, showing how they can be used today with the
    help of a transpiler.


    Almost every language has a concept of modules — a way to include functionality
    within one file another. Typically, a developer creates an encapsulated library
    of code responsible for handling related tasks. That library can be referenced
    by applications or other modules.


    The benefits:


    +   1. Code can be split into smaller files of self-contained functionality.

    2. The same modules can be shared across any number of applications.

    3. Ideally, modules need never be examined by another developer, because they''ve
    been proven to work.

    4. Code referencing a module understands it''s a dependency. If the module file
    is changed or moved, the problem is immediately obvious.

    5. Module code (usually) helps avoid naming naming conflicts. Function x() in
    module1 cannot clash with function x() in module2. Options such as namespacing
    so calls become module1.x() and module2.x().


    # Where are Modules in JavaScript?


    Anyone starting development a few years ago would have been shocked to discover
    there was no concept of modules in JavaScript. It was impossible to directly reference
    or include one JavaScript file in another. Developers therefore resorted to alternative
    options.


