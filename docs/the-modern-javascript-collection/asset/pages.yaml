  md: 'expect, is that outside the if block you can''t access the bar variable. For
    example, running the equivalent code in C results in the error ''bar'' undeclared
    at line ... which refers to the use of bar outside the if.


    This situation changed in ES6 with the availability of block scope. The ECMA organization
    members knew they could not change the behavior of the keyword var, as would break
    backward compatibility. So they decided to introduce a new keyword called let.
    The latter can be used to define variables limiting their scope to the block in
    which they are declared. In addition, unlike var, variables using let aren''t
    hoisted. If you reference a variable in a block before the let declaration for
    variable is encountered, this results in a ReferenceError. But what does this
    mean in practice? Is it only good for newbies? Not all!


    To explain you why you''ll love let, consider the following code taken from my
    article 5 More JavaScript Interview Exercises:


    ```

    var nodes = document.getElementsByTagName(''button'');

    for (var i = 0; i < nodes.length; i++) {

    nodes[i].addEventListener(''click'', function() {

    console.log(''You clicked element #'' + i);

    });

    }

    ```


    Here you can recognize a well-known issue that comes from variable declaration,
    their scope, and event handlers. If you don''t know what I''m talking about, check
    the article I mentioned and come back.


    Thanks to ES6, we can easily solve this issue by declaring the i in the loop using
    let:


    ```

    var nodes = document.getElementsByTagName(''button'');

    for (let i = 0; i < nodes.length; i++) {

    nodes[i].addEventListener(''click'', function() {

    console.log(''You clicked element #'' + i);

    });

    }

    ```


    The let statement is supported in Node and all modern browsers. There are, however,
    a couple of gotchas in Internet Explorer 11 which you can read about in the ES6
    compatibility table.'
