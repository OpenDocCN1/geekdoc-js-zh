  md: 'This specifies that the entry point is the index.html file. This is all Parcel
    needs to know about, as it will follow the link to index.js that''s in this file
    and then follow the import directives in that file.


    It also specifies that a folder docs can be used to output all of the static files
    to. By default, this is usually called dist — but, as you''ll see later, we need
    to be called docs so that we can integrate it with GitHub Pages.


    You should also see a message that the app is being built in the terminal window.
    You might even notice that Parcel installs the npm module node-sass for you as
    it automatically notices we''ve been using SCSS files, but also that we don''t
    have node-sass installed. How cool is that?


    After a few seconds, you should see a message similar to the following:


    ```

    Server running at http://localhost:1234

    Built in 3.15s.

    ```


    The server is now running, and if you open up your browser and go to http://localhost:1234,
    you''ll be able to see the app running. This will update on the fly, so any changes
    you make in your code will be reflected on the page straight away (or after a
    brief pause to rebuild the code). It also hotloads modules, so it will automatically
    install any npm modules that are required as they''re needed, like it did with
    “node-sass”. Awesome!


    Once you''re happy with how the site looks, it''s time to build the static site.
    First of all, stop the server by holding down Ctrl and c together. Then run the
    following command in the terminal:


    ```

    ./node_modules/.parcel build src/index.html --out-dir docs --public

    ```


    This will build the static files and place them inside the docs folder.


    If you take a peek inside the docs folder, you should find a file called index.html.
    Open this in your browser and you should see the site running, using only the
    static files in the docs folder. Parcel has bundled all the relevant code used
    Babel to transpile our modern JavaScript into a single JavaScript file and used
    node-sass to pre-process our SCSS files into a single CSS file. Open them up and
    you can see that the code also has been minimized!


    ```

    npm run scripts

    ```'
