- img_proc: true
  md: '# Chapter 3: Build a JavaScript Single Page App Without a Framework


    by Michael Wanyoike


    **Frontend frameworks are great. They abstract away much of the complexity of
    building a single-page application (SPA) and help you organize your code in an
    intelligible manner as your project grows.


    However, there''s a flip side: these frameworks come with a degree of overhead
    and can introduce complexity of their own.


    That''s why, in this tutorial, we''re going to learn how to build an SPA from
    scratch, without using a clientside JavaScript framework. This will help you evaluate
    these frameworks actually do for you and at what point it makes sense to use one.
    It will also give you an understanding of the pieces that make a typical SPA and
    how they''re wired together.


    Let''s get started ...


    # Prerequisites


    For this tutorial, you''ll need a fundamental knowledge of modern JavaScript and
    jQuery. Some experience using Handlebars, Express and Axios will come handy, though
    it''s not strictly necessary. You''ll also need to have the following setup in
    your environment:


    +   * Node.js

    * Git or Git Bash for Windows users.


    # Example Code


    You can find the completed project on our GitHub repository.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Building the Project


    We''re going to build a simple currency application that will provide the following
    features:


    +   - display the latest currency rates

    - convert from one currency to another

    - display past currency rates based on a specified date.


    We''ll make use of the following free online REST APIs to implement these features:


    +   - fixer.io API

    - Free Currency Converter API.


    Fixer is a well-built API that provides a foreign exchange and currency conversion
    JSON API. Unfortunately, it''s a commercial service and the free plan doesn''t
    allow currency conversion. So we''ll also need to use the Free Currency Converter
    API. The conversion API has a few limitations, which luckily won''t affect the
    functionality of our application. It can be accessed directly without requiring
    an API key. However, Fixer requires an API key to perform any request. Simply
    sign up on their website to get an access key for the free plan.


    Ideally, we should be able to build the entire single-page application on the
    client side. However, since we''ll be dealing with sensitive information (our
    API key) won''t be possible to store this in our client code. Doing so will leave
    our app vulnerable and open to any junior hacker to bypass the API and access
    data directly from our API endpoints. To protect such sensitive information, we
    need to put it in server code. So, we''ll set an Express server to act as a proxy
    between the client code and the cloud services. By using a proxy, we can safely
    access this key, since server code is never exposed to the browser. Below is a
    diagram illustrating how our completed project will work.'
  merge: -1
  pgno: 308
