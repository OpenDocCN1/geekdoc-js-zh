  md: '# Modules: Bundling & Transpiling.


    # Transpilation


    While support for modern JavaScript is pretty good among newer browsers, your
    target audience may include legacy browsers and devices with partial or no support.


    In order to make our modern JavaScript work, we need to translate the code we
    write to it in an earlier version (namely ES5). The standard tool for this task
    is Babel — a compiler that translates your code into compatible code for most
    browsers. In this way, you don''t have to wait for vendors to implement everything;
    you can just use all the modern JS features.


    There are a couple of features that need more than a syntax translation. Babel
    includes a Polyfill that emulates some of the machinery required for some complex
    features such as promises.


    # Build systems & task runners


    Module bundling and transpilation are just two of the build processes we may need
    in our projects. Others include code minification (to reduce file sizes), tools
    for analysis, and perhaps tasks that don''t have anything to do with JavaScript,
    like image optimization or CSS/HTML pre-processing.


    The management of tasks can become a laborious thing, and we need a way to handle
    it in an automated way, being able to execute everything with simpler commands.
    The most popular tools for these are Grunt.js and Gulp.js, which provide a way
    to organize your tasks into groups in an ordered way.


    For example, you can have a command gulp build which may run a code linter, the
    transpilation process with Babel, and module bundling with Browserify. Instead
    of having to remember three commands and their associated arguments in order,
    we just execute one that will handle the process automatically.


    Wherever you find yourself manually organizing processing steps for your project,
    think if it can be automated with a task runner.'
