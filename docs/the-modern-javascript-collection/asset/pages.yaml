  md: '# # Chapter 16: Introduction to the Fetch API


    by Ludovico Fischer


    In this chapter, we''ll learn what the new Fetch API looks like, what problems
    it solves, and the most practical way to retrieve remote data inside your web
    page using the fetch() function.


    For years, XMLHttpRequest has been developers’ trusted sidekick. Whether directly
    or under the hood, XMLHttpRequest has enabled Ajax and a whole new type of interactive
    experience, from Gmail to Facebook.


    XMLHttpRequest is slowly being superseded by the Fetch API. Both can be used to
    make network requests, but the Fetch API is Promise-based, which enables a cleaner,
    more concise syntax and keeps you out of callback hell.


    # ## The Fetch API


    The Fetch API provides a fetch() method defined on the window object, which you
    can use to perform requests. This method returns a Promise that you can use to
    retrieve the response of the request.


    The fetch method only has one mandatory argument, which is the URL of the resource
    you wish to fetch. A very basic example would look something like the following.
    This fetches the five posts from r/javascript on Reddit:


    ```

    fetch(''https://www.reddit.com/r/javascript/top/.json?limit=5)

    then(res => console.log(res));

    ```


    If you inspect the response in your browser’s console, you should see a Response
    object with several properties:


    ```

    {

    body: ReadableStream

    ```'
