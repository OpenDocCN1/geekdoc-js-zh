  md: "memory in a client-side web application (e.g. stores in Flux).\n\nA singleton\
    \ should be immutable by the consuming code, and there should be no danger of\
    \ instantiating more than one of them.\n\n# Are Singletons Bad?\n\nThere are scenarios\
    \ when singletons might be bad, and arguments that they are, in fact, always bad.\
    \ For that discussion, you can check out this helpful article on the subject.\n\
    \n# The Old Way of Creating a Singleton in JavaScript\n\nThe old way of writing\
    \ a singleton in JavaScript involves closures and immediately invoked function\
    \ expressions. Here's how we might write a (very simple) store for a hypothetical\
    \ Flux implementation the old way:\n\n```\nvar UserStore = (function({\n  var\
    \ data = [];\n\n  function add(item){\n    data.push(item);\n  }\n\n  function\
