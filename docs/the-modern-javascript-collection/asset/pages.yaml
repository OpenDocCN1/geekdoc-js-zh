  md: '# # Chapter 7: Flow Control in Modern JS: Callbacks to Promises to Async/Await


    by Craig Buckler


    JavaScript is regularly claimed to be *asynchronous*. What does that mean? How
    does it affect development? How has the approach changed in recent years?


    Consider the following code:


    ```

    result1 = doSomething();

    result2 = doSomething2(result1);

    ```


    Most languages process each line *synchronously*. The first line runs and returns
    a result. The second line runs once the first has finished *regardless of how
    long it* takes.


    # ## Singlethread Processing


    JavaScript runs on a single processing thread. When executing in a browser tab,
    everything else stops. This is necessary because changes to the page DOM can''t
    occur on parallel threads; it would be dangerous to have one thread redirecting
    to a different URL while another attempts to append child nodes.


    This is rarely evident to the user, because processing occurs in small chunks.
    For example, JavaScript detects a button click, runs a calculation, and updates
    the DOM. Once complete, the browser is free to process the next item on the queue.


    # ## Other Languages


    Other languages such as PHP also use a single thread but may be managed by multi-threaded
    servers such as Apache. This corresponds to the same PHP-process'
