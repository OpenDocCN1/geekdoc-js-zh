  md: '# # Chapter 2: Build a WebRTC Video Chat Application with SimpleWebRTC


    by Michael Wanyoike


    With the advent of WebRTC and the increasing capacity of browsers to handle peer-to-peer
    communications in real time, it''s easier than ever to build real-time applications.
    In this tutorial, we''ll take a look at [SimpleWebRTC](SimpleWebRTC) and how it
    can make our lives easier when implementing WebRTC. Throughout the chapter, we''ll
    be building a WebRTC video chat app with messaging features.


    If you need a bit of a background regarding WebRTC and peer-to-peer communication,
    I recommend reading [The Dawn of WebRTC](The Dawn of WebRTC) and [Introduction
    to the getUserMedia API](Introduction to the getUserMedia API).


    # ## What is SimpleWebRTC


    Before we move on, it''s important that we understand the main tool that we''ll
    be using, [SimpleWebRTC](SimpleWebRTC) is a JavaScript library that simplifies
    WebRTC peer-to-peer data, video, and audio calls.


    SimpleWebRTC acts as a wrapper around the browser''s WebRTC implementation. As
    you might already know, browser vendors don''t exactly agree on a single way of
    implementing different features, which means for every browser there''s a different
    implementation for WebRTC. As the developer, you''d have to write different code
    for every browser you plan to support. SimpleWebRT acts as the wrapper for that
    code. The API that it exposes is easy to use and understand, which makes it a
    really great candidate for implementing cross-browser WebRTC.


    # ## Building the WebRTC Video Chat App'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'Now it''s time to get our hands dirty building the app. We''ll build a single
    page application that runs on top of an Express server.


    # Running the Examples


    Please note that you can download the code for this tutorial from our GitHub repo.
    To run it, or follow along at home, you''ll need to have Node and npm installed.
    If you''re not familiar with these, or would like some help getting them installed,
    check out our previous tutorials:


    +   * Install Multiple Versions of Node.js using nvm

    * A Beginner''s Guide to npm — the Node Package Manager


    You also need a PC or laptop that has a webcam. If not, you''ll need to get yourself
    a USB webcam that can connect to the top of your monitor. You''ll probably need
    a friend or a second device to test remote connections.


    # Dependencies


    We''ll be using the following dependencies to build our project:


    +   * SimpleWebRTC — the WebRTC library

    * Semantic CSS — an elegant CSS framework

    * jQuery — used for selecting elements on the page and event handling.

    * Handlebars — a JavaScript templating library, which we''ll use to generate HTML
    for the messages

    * Express — NodeJS server.


