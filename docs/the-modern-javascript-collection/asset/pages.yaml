    # Why would you do such a thing?


    I won''t delve too far into this topic, but here are a few reasons to consider:


    +   - A JavaScript component you may want in your project depend on other assets
    to function properly (HTML, CSS, Images, SVG). If these can be bundled together,
    it''s far easier to import and use.

    - Dead code elimination: When a JS component is no longer imported by your code,
    the CSS will no longer be imported. The bundle produced will only contain code
    that does something.

    - CSS Modules: The global namespace of CSS makes it very difficult to be confident
    that a change to your CSS will not have any side effects. CSS modules change this
    by making CSS local by default and exposing unique class names that you can reference
    in your JavaScript.

    - Bring down the number of HTTP requests by bundling/splitting code in clever
    ways.'
