    ES2015 was the first offering to follow the TC39 process, a proposal-based model
    for discussing and adopting elements.


    # The TC39 Process


    There are five stages through which a proposal must pass before it can be accepted
    into an upcoming version of ECMAScript.


    # Stage 0: Strawman


    This is a convenience step to permit the submission of ideas to the specification.
    Features can be suggested by anyone — namely, TC39 members and members who have
    registered as a contributor.


    # Stage 1: Proposal


    The first stage at which a proposal is formalized. It’s necessary that:


    +   * any existing problems rectified by the solution are described

    * an API outline is provided, alongside high-level implementation details, as
    well as polyfills and/or demos

    * potential impediments are discussed upfront.


    A champion must be selected to adopt and advance the proposal. This individual
    must be a TC39 member.


    # Stage 2: Draft


    This is the milestone at which a feature is likely to be included in a future
    version of ECMAScript. Here, the proposal’s syntax and semantics are detailed
    using the formal language described by the specification. An experimental implementation
    should be available at this point.


    # Stage 3: Candidate'
