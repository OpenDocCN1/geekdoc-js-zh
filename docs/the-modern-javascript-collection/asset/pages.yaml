    just happen to be singletons, but the pattern is the same) But those added unneeded
    complexity to the code, while still failing to get us exactly what we want.


    # The New Way(s)


    By leveraging ES6 features, mainly modules and the new const variable declaration,
    we can write singletons in ways that are not only more concise, but better meet
    our requirements.


    Let''s start with the most basic implementation. Here''s (a cleaner and more powerful)
    modern interpretation of the example:


    ```

    const _data = [];

    const UserStore = {

    add: item => data.push(item),

    get: id => data.find(d => d.id === id)

    }


    Object.freeze(UserStore);

    export default UserStore;

    ```


    As you can see, this way offers an improvement in readability. But where it really
    shines is the constraint imposed upon code that consumes our little module cannot
    recognize UserStore because of the const keyword. And as a result of our use of
    Object.freeze, its methods cannot be changed, nor can new methods or properties
    be added to it. Furthermore, because we''re taking advantage of ES6 modules, we
    know exactly where UserStore is used.'
