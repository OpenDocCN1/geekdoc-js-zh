    ```


    You have all of your application files in a src directory, written in ES2015+,
    importing packages installed with npm and your own modules from a lib directory.


    Then you can run Gulp, which will execute the instructions from a gulpfile.js
    to build your project — bundling all modules into one file (including the ones
    installed with npm), transpiling ES2015+ to ES5, minifying the resulted file,
    etc. Then you can configure it to output the result in a convenient dist directory.


    # Files That Don''t Need Processing


    If you have files that don''t need any processing, you can just copy them from
    src to the dist directory. You can configure a task for that in your build system.


    Now you can just upload the files from the dist directory to a web server, without
    having to worry about the rest of the files, which are only useful for development.


    # Team development


    If you''re working with other developers, it''s likely you''re also using a shared
    repository, like GitHub, to store the project. In this case, you can run the build
    process before making commits and store the result with the other files in the
    Git repository, to later be downloaded onto a production server.


    However, storing built files in the repository is prone to errors if several developers
    are working together, and you might want to keep everything clean from build artifacts.
    Fortunately, you can put a service like Jenkins, Travis CI, CircleCI, etc. in
    the middle of the process, so it can automatically build your project after each
    commit is pushed to the repository. Developers only have to worry about pushing
    code changes without building the project first each time. The repository is also
    kept clean of automatically generated files, and at the end, you still have the
    built files for deployment.


    # Conclusion'
