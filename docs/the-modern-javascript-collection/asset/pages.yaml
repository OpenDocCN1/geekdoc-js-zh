  md: "# Proxy Example: Profiling\n\nProxies allow you to create generic wrappers\
    \ for any object without having to change the code within the target objects themselves.\n\
    \nIn this example, we'll create a profiling proxy which counts the number of times\
    \ a property is accessed. First, we require a makeProfiler factory function which\
    \ returns the Proxy object and returns the count state:\n\n```\n// create a profiling\
    \ Proxy\nfunction makeProfiler(target) {\n  const count = {};\n  const handler\
    \ = {\n    get: function(target, name) {\n      if (name in target) {\n      \
    \  count[name] = (count[name] || 0) + 1;\n      }\n      return target[name];\n\
    \    }\n  };\n  return {\n    proxy: new Proxy(target, handler),\n    count: count\n\
    \  };\n}\n```\n\nWe can now apply this proxy wrapper to any object or another\
    \ proxy. For example:\n\n```\nconst myObject = {\n  h: 'Hello',\n  w: 'World'\n\
    };\n\n// create a myObject proxy\nconst p0Obj = makeProfiler(myObject);\n\n//\
    \ access properties\nconsole.log(p0Obj.proxy.h); // Hello\nconsole.log(p0Obj.proxy.h);\
    \ // Hello\nconsole.log(p0Obj.proxy.w); // World\n```"
