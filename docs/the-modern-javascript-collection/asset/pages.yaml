    pretty sure the first question you would ask would be “How am I ever going to
    confirm my code is working correctly?”


    The answer lies in debugging tools. For a long time, developers, including myself,
    have been using console.log to debug broken code. It''s quick and easy to use.
    However, things can get finicky if you don''t know where and what is causing the
    bug. Often you''ll find laying down console.log traps all over your code to see
    which one will reveal the culprit.


    To remedy this, we need to change our habits and start using debugging tools.
    There are a number of tools available for debugging JavaScript code, such as the
