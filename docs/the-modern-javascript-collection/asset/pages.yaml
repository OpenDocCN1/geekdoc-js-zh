    # Array.prototype.fill()


    If you''ve worked in the PHP world (like me), you''ll recall a function named
    array_fill() that was missing in JavaScript. In ES6 this method is no longer missing.
    Array.prototype.fill() fills an array with a specified value optionally from a
    start index to an end index (not included).


    The syntax of this method is the following:


    ```

    Array.prototype.fill(value[, start[, end])

    ```


    The default values for start and end are respectively 0 and the length of the
    array. If start or end are negative, the positions are calculated starting from
    the end of the array.


    An example of use of this method is shown below:


    ```

    const arr = new Array(6);

    // This statement fills positions from 0 to 2

    arr.fill(1, 0, 3);

    // This statement fills positions from 3 up to the end of the array

    arr.fill(2, 3);


    // prints [1, 1, 1, 2, 2, 2]

    console.log(arr);

    ```


    A live demo of the previous code is available at JSBin.


    The method is supported in Node and all modern browsers, with the exception of
    Internet Explorer. As polyfills you can employ the one on the method''s page on
    MDN, or the polyfill developed by Addy Osmani.


    # Conclusion'
