    Using the bracket notation, we can also use a symbol as a property key. There
    are a couple of advantages to doing so. Symbol-based keys will never clash, unlike
    string keys, which might conflict with keys for existing properties or methods
    of an object. Second, they won''t be enumerated in for loops, and are ignored
    by functions such as Object.keys(), Object.getOwnPropertyNames() and JSON.stringify().
    This makes them ideal for properties that you don''t want to be included when
    serializing an object.


    ```

    const user = {};

    const email = Symbol();


    user.name = ''Fred'';

    user.age = 30;

    user[email] = ''fred@example.com'';


    Object.keys(user);

    // <-- Array [ "name", "age" ]


    Object.getOwnPropertyNames(user);

    // <-- Array [ "name", "age" ]


    JSON.stringify(user);

    // <-- {"name":"Fred","age":30}",

    ```


    It''s worth noting, however, that using symbols doesn''t guarantee privacy. There
    are some new tools provided to allow you to access symbol-based property keys.
    Object.getOwnPropertySymbols() returns an array of any symbol-based keys, while
    Reflect.ownKeys() will return an array of all keys, including symbols.


    ```

    Object.getOwnPropertySymbols(user);

    // <-- Array [ Symbol() ]

    ```


    ```

    Reflect.ownKeys(user);

    // <-- Array [ "name", "age", Symbol() ]

    ```


    # Wellknown Symbols'
