  md: '# # Chapter 6: Interactive Data Visualization with Modern JavaScript and D3


    by Adam Janes


    In this chapter, I want to take you through an example project that I built recently
    — a totally original type of visualization using the D3 library, showcases how
    each of these components add to make D3 a great library to learn.


    D3 stands for Data Driven Documents. It''s a JavaScript library that can be used
    to make all sorts of wonderful data visualizations and charts.


    If you''ve ever seen the fabulous interactive stories from the New York Times,
    you''ll have already seen D3 in action. You can also see cool examples of great
    projects that have been built with D3 here.


    The learning curve is pretty steep for getting started with the library, since
    D3 has a few special quirks that you probably won''t have seen before. However,
    if you get past the first phase of learning D3 to be dangerous, you''ll soon be
    able to build some really cool stuff for yourself.


