  md: '# # Chapter 7: Symbols and Their Uses


    by Nilson Jacques


    While ES2015 introduced many language features that have been on developers''
    wish lists for some time, there are some new features that are less well known
    and understood, and the benefits of which are much less — such as symbols.


    The symbol is a new primitive type, a unique token''s guaranteed never to clash
    with another symbol. In this sense, you could think of symbols as a kind of UUID
    (universally unique identifier). Let''s look at how symbols work, and what we
    can do with them.


    # ## Creating New Symbols


    Creating new symbols is very straightforward and is simply a case of calling the
    Symbol function. Note that this is a just standard function and not an object
    constructor. Trying to call it with the new operator will result in a TypeError.
    Every time you call the Symbol function, you''ll get a new and completely unique
    value.


    ```

    const foo = Symbol();

    const bar = Symbol();

    ```


    ```

    foo === bar

    // <-- false

    ```


    Symbols can also be created with a label, by passing a as the first argument.
    The label doesn''t affect the value of the symbol, but is useful for debugging,
    and if the symbol''s toString() method is called. It''s possible to create multiple
    symbols with the same label, but there''s no advantage to doing so and this would
    probably just lead to confusion.


    let foo = Symbol(''baz'');'
