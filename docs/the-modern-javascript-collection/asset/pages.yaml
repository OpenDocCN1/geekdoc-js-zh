    Before you hit anything, let''s take a look at the sections that make up the debug
    panel:


    +   * **Variables**: displays local and global variables within the current scope
    (i.e. at the point of execution)

    * **Watch**: you can manually add expressions of variables you want to monitor

    * **Call Stack**: displays a call stack of the highlighted code

    * **Breakpoints**: displays a list of files with breakpoints, along with their
    line numbers.


    To add an expression to the Watch section, simply click the + sign and add any
    valid JavaScript expression — such as places.length. When the debugger pauses,
    if your expression is in scope, the value will be printed out. You can also hover
