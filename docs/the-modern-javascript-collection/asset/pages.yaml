  md: '# Alternatives


    Writing modern web applications sometimes requires more than the features available
    in JavaScript. Other languages can also be translated to compatible JavaScript
    but implement other useful features.


    The most popular option is TypeScript, which is regular JavaScript that implements
    modern ES features but also adds others, especially regarding type safety.


    On the other extreme, there are entirely different languages across different
    categories, from the functional ones like PureScript to the object-oriented like
    Dart.


    For a deeper overview of alternative languages, take a look at 10 Languages that
    Compile to JavaScript.


    # Conclusion


    Babel is a great option for writing modern applications while serving up JavaScript
    that can be understood by all developers and the wide range of browsers the code
    needs to run in.


    Babel is not only useful for transforming ES2015+ to previous versions of the
    language — both in the browser and on platforms such as Node.js — but also for
    adding new features that aren''t part of the standard. To see what I mean, just
    take a look at the npm directory to find all the Babel plugins or presets.


    As JavaScript is evolving at such a rapid pace, it''s obvious that browser manufacturers
    will need a while to implement the latest features. Giving Babel a place in your
    toolkit means that you can writing cutting-edge JavaScript today, safe in the
    knowledge that you''re not abandoning any of your users. What''s not to love?'
  merge: -1
