  md: '# Further Reading on Gulp.js


    Further reading: An Introduction to Gulp.js.


    # Application Architecture


    Web applications have different requirements from websites. For example, while
    page reloads may be acceptable for a blog, that''s certainly not the case for
    an application like Google Docs. Your application should behave as closely as
    possible to a desktop one. Otherwise, the usability should be compromised.


    Old-style web applications were usually done by sending multiple pages from a
    web server, and when a lot of dynamism was needed, content was loaded via Ajax
    replacing chunks of HTML according to user actions. Although it was a big step
    forward to a dynamic web, it certainly had its complications. Sending HTML fragments
    or even pages on each user action represented a waste of resources — especially
    of time, from the user''s perspective. The usability didn''t match the responsiveness
    of desktop applications.


    Looking to improve things, we created two ways to build applications — from the
    way we present them to the user, to the way we communicate between the client
    and the server. Although the amount of JavaScript required for an application
    also increased drastically, the result is applications that behave very closely
    to native ones, without page reloading or extensive waiting times each we click
    a button.


    # Single Page Applications (SPAs)


    The most common, high-level architecture for web applications is called SPA, which
    stands for Single Page Application. SPAs are big blobs of JavaScript that contain
    everything the application needs to work properly. The UI is rendered entirely
    client-side, so no reloading is required. The only thing that changes is the data
    input into the application, which is usually handled with a remote API via Ajax
    or another asynchronous method of communication.


    One downside to this approach is that the application takes longer to load for
    the first time. Once it has been loaded, however, transitions between views (pages)
    are generally a lot quicker, since it''s only pure data being sent between client
    and server.'
