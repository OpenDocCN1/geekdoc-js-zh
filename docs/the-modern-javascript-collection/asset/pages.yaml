  md: 'Here, the majority of the proposal and the backing technology have been developed,
    but it requires further feedback from users and implementers (such as browser
    vendors). Once this is available and acted upon, the outline and specification
    details are finalized and signed off by designated reviewers and the appointed
    editor. As a compliant implementation is required at this stage, only critical
    changes are henceforth embraced.


    # Stage 4: Finished


    The proposal has been accepted and can be added to ECMAScript. It’s thus inherent
    that:


    +   - acceptance tests, which are part of the Test262 suite and are crafted with
    JavaScript, have been written to prove the conformity and behavior of the feature

    - at least two compliant implementations are available, and have shipped, all
    of which demonstrate robustness and developer usability

    - a pull request has been submitted to the official ECMA262 repo, which has been
    signed off by the specification editor.


    The above repository’s contribution document further details the use of GitHub
    issues and pull requests for managing additions to the language.


