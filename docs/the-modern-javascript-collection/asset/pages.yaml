  md: "# Getting to Class on Time\n\nOne part of the traditional function has been\
    \ taken over by the class keyword.\nThis allows programmers to choose whether\
    \ they would prefer to follow a more functional programming paradigm with callable\
    \ arrow functions, or use a more object-oriented approach with classes to substitute\
    \ for the prototypal inheritance of traditional functions.\n\nClasses in JavaScript\
    \ look and act like simple classes in other object-oriented languages, and may\
    \ be an easy stepping stone for Java and C++ developers looking to expand into\
    \ JavaScript as JavaScript expands out to the server.\n\nOne difference between\
    \ functions and classes when doing object-oriented programming in JavaScript is\
    \ that classes require forward declaration, the way they do in C++ (although not\
    \ in Java). That is, a class needs to be declared in the script before it is instantiated\
    \ with a new keyword. Prototypal inheritance using the function keyword works\
    \ in JavaScript even if its defined later in the script, since a function declaration\
    \ is automatically hoisted to the top, unlike a class.\n\n```\n// Using a function\
    \ to declare and instantiate an object (hoisted)\nlet Proto = new Proto(\"Myra\"\
    );\nProto.greet(); // \"Hi Myra\"\n\nfunction Proto(name) {\n  this.name = name;\n\
    \  this.greet = function() {\n    console.log(`Hi ${this.name}`);\n  }\n}\n\n\
    // Using a class to declare and instantiate an object (not hoisted)\nclass Class\
    \ {\n  constructor(name) {\n    this.name = name;\n  }\n  greet() {\n    console.log(`Hi\
    \ ${this.name}`);\n  }\n}\n\nlet aClass = new Class(\"Sonja\");\n```"
