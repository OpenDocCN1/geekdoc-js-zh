  md: 'The other alternative declaration is const, which is supposed to represent
    a constant. But it''s not completely constant.


    A const can''t be declared without a value, unlike a var or let.


    ```

    var x; // valid

    let y; //valid

    const z; // error

    ```


    A const will also throw an error if you try to set it to a new value after it''s
    been declared:


    ```

    const z = 3; // valid

    z = 4; // error

    ```


    But if you expect your const to be immutable in all cases, you may be in for a
    surprise when an object or an array declared as a const lets you alter its content.


    ```

    const z = []; // valid

    z.push(1); // valid, and z is now [1]

    z = [2] // error

    ```


    For this reason, I remain skeptical when people recommend using const in place
    of var for all variable declarations, even when you have every intention of never
    altering them after they''ve been declared.


    While it''s a good practice to treat your variables as immutable, JavaScript won''t
    enforce that the contents of a reference variables like arrays and objects declared
    with const without some help from external scripts. The const keyword might make
    casual readers and newcomers to JavaScript expect more than it actually provides.


    I''m inclined to use const for simple number or string variables I want to initialize
    and never alter, or for named functions and classes that I expect to define once
    and then leave closed for modification. Otherwise, I use let for most variable
    declarations — especially those I wanted to be bounded by the scope in which they
    were defined. I haven''t found the need to use var lately, but if I wanted a declaration
    to break scope and get hoisted to the top of my script, that''s how I would do
    it.


    # Limiting the Scope of the Function'
