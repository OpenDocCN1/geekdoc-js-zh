  md: '# # Trap types


    We''ve seen the get and set in action which are likely to be the most useful traps.
    However, there are several other trap types you can use to supplement proxy handler
    code:


    +   - **construct(target, argList)** Traps the creation of a new object with the
    new operator.

    - **get(target, property)** Traps Object.get() and must return the property value.

    - **set(target, property, value)** Traps Object.set() and must set the property
    value. Return true if successful. In strict mode, returning false will throw a
    TypeError exception.

    - **deleteProperty(target, property)** Traps a delete operation on an object''s
    property. Must return either true or false.

    - **apply(target, thisArg, argList)** Traps function calls.

    - **has(target, property)** Traps in operators and must return either true or
    false.

    - **ownKeys(target)** Traps Object.getOwnPropertyNames() and must return an enumerable
    object.

    - **getPrototypeOf(target)** Traps Object.getPrototypeOf() and must return the
    prototype object or null.

    - **setPrototype(target, prototype)** Traps Object.setPrototypeOf() to set the
    prototype object. No value is returned.

    - **isExtensible(target)** Traps Object.isExtensible(), which determines whether
    an object can have new properties added. Must return either true or false.

    - **preventExtensions(target)** Traps Object.preventExtensions(), which prevents
    new properties from being added to an object. Must return either true or false.

    - **getOwnPropertyDescriptor(target, property)** Traps Object.getOwnPropertyDescriptor(),
    which returns undefined or a property descriptor object with attributes for value,
    get, set, configurable and enumerable.

    - **defineProperty(target, property, descriptor)** Traps Object.defineProperty()
    which defines or modifies an object property. Must return true if the property
    was successfully defined or false not.


