  md: "Axios works in all modern web browsers, and Internet Explorer 8.\n\n# Making\
    \ Requests\n\nSimilar to jQuery's $.ajax function, you can make any kind of HTTP\
    \ request by passing an options object to Axios:\n\n```\naxios({\n  method: 'post',\n\
    \  url: '/login',\n  data: {\n    user: 'brunos',\n    lastName: 'ilovenodejs'\n\
    \  }\n});\n```\n\nHere, we're telling Axios which HTTP method we'd like to use\
    \ (e.g. GET/POST/DELETE etc.) and which URL the request should be made to.\n\n\
    We're also providing some data to be sent along with the request in the form of\
    \ a simple JavaScript object of key/value pairs. By default, Axios will serialize\
    \ this as JSON and send it as the request body.\n\n# Request Options\n\nThere\
    \ are a whole bunch of additional options you can pass when making a request,\
    \ but here are the most common ones:\n\n+   - baseurl: if you specify a base URL,\
    \ it'll be prepended to any relative URL you use.\n- headers: an object of key/value\
    \ pairs that will be sent as headers.\n- params: an object of key/value pairs\
    \ that will be serialized and appended to the URL as a query string.\n- responseType:\
    \ if you're expecting a response in a format other than JSON, you can set this\
    \ property to arraybuffer, blob, document, text, or stream.\n- auth: passing an\
    \ object with username and password fields will use these credentials for HTTP\
    \ Basic auth on the request.\n\n# Convenience methods"
  merge: -1
  pgno: 494
- img_proc: true
  md: "Also like jQuery, there are shortcut methods for performting different types\
    \ of request.\n\nThe get, delete, head and options methods all take two arguments:\
    \ a URL, and an optional config object.\n\n```\naxios.get('products5');\n```\n\
    \nThe post, put, and patch methods take a data object as their second argument,\
    \ and an optional config object as the third:\n\n```\naxios.post(\n  '/products',\n\
    \  { name: 'Waffle Iron', price: 21.50 },\n  { options }\n);\n```\n\n# Receiving\
    \ a Response\n\nOnce you make a request, Axios returns a promise that will resolve\
    \ to either a response object or an error object.\n\n```\naxios.get('/product/9')\n\
    .then(response => console.log(response))\n.catch(error => console.log(error));\n\
    ```\n\n# The response object\n\nWhen the request is successful, your then() callback\
    \ will receive a response object with the following properties:\n\n+   - data:\
    \ the payload returned from the server. By default, Axios expects JSON and will\
    \ parse this back into a JavaScript object for you.\n- status: the HTTP code returned\
    \ from the server.\n- statusText: the HTTP status message returned by the server.\n\
    - headers: all the headers sent back by the server.\n- config: the original request\
    \ configuration.\n- request: the actual XMLHttpRequest object (when running in\
    \ a browser).\n\n# The error object"
