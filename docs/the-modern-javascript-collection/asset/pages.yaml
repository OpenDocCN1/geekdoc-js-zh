  md: "# # Chapter 8: How to Use Proxies\n\nby Craig Buckler\n\nIn computing terms,\
    \ proxies sit between you and the things you're communicating with. The term is\
    \ most often applied to a proxy server — a device between the web browser (Chrome,\
    \ Firefox, Safari, Edge etc.) and the web server (Apache, Nginx, IIS etc.) where\
    \ a page is located. The proxy server can modify requests and responses. For example,\
    \ it can increase efficiency by caching regularly accessed assets and serving\
    \ them to multiple users.\n\nES6 proxies sit between your code and an object.\
    \ A proxy allows you to perform meta-programming operations such as intercepting\
    \ a call to inspect or change an object's property.\n\nThe following terminology\
    \ is used in relation to ES6 proxies:\n\n**target** The original object the proxy\
    \ will virtualize. This could be a JavaScript object such as the jQuery library\
    \ or native objects such as arrays or even other proxies.\n\n**handler** An object\
    \ that implements the proxy's behavior using...\n\n**traps** Functions defined\
    \ in the handler which provide access to the target when specific properties or\
    \ methods are called.\n\nIt's best explained with a simple example. We'll create\
    \ a target object named target which has three properties:\n\n```\nconst target\
    \ = {\n  a: 1,\n  b: 2,\n  c: 3\n};\n```\n\nWe'll now create a handler object\
    \ which intercepts all get operations. This returns the target's property when\
    \ it's available or 42 otherwise:"
