    # The Project


    As an economics major in college, I had always been interested in income inequality.
    I took a few classes on the subject, and it struck me as something that wasn''t
    fully understood to the degree that it should be.


    I started exploring income inequality using Google''s Public Data Explorer ...


    ![](img/db696b7ce627f45564f80b8e17757e2e_369_0.png)


    When you adjust for inflation, household income has stayed much constant for the
    bottom 40% of society, although per-worker productivity has been skyrocketing.
    It''s only really the top 20% that we have reaped more of the benefits (and within
    that bracket, the difference is even more shocking if you look at the top 5%).


    Here was a message that I wanted to get across in a convincing way, which provided
    a perfect opportunity to use some D3, so I started sketching up a few ideas.


    # Sketching'
