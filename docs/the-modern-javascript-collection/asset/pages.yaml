  md: '• View. This is a function that returns virtual node objects that compile to
    HTML code. It can use JSX or a similar templating language and has access to the
    state and actions objects.


    These three parts interact with each other to produce a dynamic application. Actions
    are triggered by events on the page. The action then updates the state, which
    then triggers an update to the view. These changes are made to the Virtual DOM,
    which Hyperapp uses to update the actual DOM on the web page.


    # # Getting Started


    To get started as quickly as possible, we''re going to use CodePen to develop
    our app. You need to make sure that the JavaScript preprocessor is set to Babel
    and the Hyperapp package is loaded as an external resource using the following
    link:


    https://unpkg.com/hyperapp


    To use Hyperapp, we need to import the app function as well as the h method, which
    Hyperapp uses to create VDOM nodes. Add the following code to the JavaScript pane
    in CodePen:


    ```

    const { h, app } = hyperapp;

    ```


    We''ll be using JSX for the view code. To make sure Hyperapp knows this, we need
    to add the following comment to the code:


    ```

    /** @jsx h */

    ```


    The app() method is used to initialize the application:


    ```

    const main = app(state, actions, view, document.body);

    ```


    This takes the state and actions objects as its first two parameters, the view()
    function as its third parameter, and the last parameter is the HTML element where
    the application is be inserted into your markup. By convention, this is the <body>
    tag, represented by document.body.


    To make it easy to get started, I''ve created a boilerplate Hyperapp code template
    on CodePen that contains all the elements mentioned above. It can be forked by
    clicking on this link.'
