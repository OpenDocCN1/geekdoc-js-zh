  md: '# # Chapter 2: A Beginner’s Guide to Webpack 4 and Module Bundling


    by Mark Brown


    The [Webpack 4 docs]() state that:


    Webpack is a module bundle. Its main purpose is to bundle JavaScript files for
    usage in a browser, yet it is also capable of transforming, bundling, or packaging
    just about any resource or asset.


    [Webpack]() has become one of the most important tools for modern web development.
    It’s primarily a module bundle for your JavaScript, but it can be taught to transform
    all of your front-end assets like HTML, CSS, images. It can give you more control
    over the number of HTTP requests your app is making and allows you to use other
    flavors of those assets (Pug, Sass, and ES8, for example). Webpack also allows
    you to easily consume packages from npm.


    This article is aimed at those who are new to Webpack, and will cover initial
