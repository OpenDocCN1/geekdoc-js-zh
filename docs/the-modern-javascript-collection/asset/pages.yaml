  md: "```\nconst handler = {\n  get: function(target, name) {\n  return (\n    name\
    \ in target ? target[name] : 42\n  );\n}\n}\n```\n\nWe now create a new Proxy\
    \ by passing the target and handler objects. Our code can interact with the proxy\
    \ rather than accessing the target object directly:\n\n```\nconst proxy = new\
