  md: '# # Chapter 3: New Array.* and Array.prototype.* Methods


    by Aurelio De Rosa


    In this chapter we''ll discuss most of the new methods available in ES6 that work
    with the Array type, using Array.* and Array.prototype.*


    When discussing them, I''ll write Array.method() when I describe a “class” method
    and Array.prototype.method() when I outline an “instance” method.


    We''ll also use some examples and mention several polyfills for them. If you need
    a polyfill-them-all library, you can use es6-shim by Paul Miller.


    # ## Array.from()


    The first method I want to mention is Array.from(). It creates a new Array instance
    from an array-like or an iterable object. This method can be used to solve an
    old problem with array-like objects that most developers solve using this code:


    ```

    // typically arrayLike is arguments

    var arr = [].slice.call(arrayLike);

    ```


    The syntax of Array.from() is shown below:


    ```

    Array.from(arrayLike[, mapFn[, thisArg]])

    ```


    The meaning of its parameters are:


    +   * arrayLike: an array-like or an iterable object

    * mapFn: a function to call on every element contained

    * thisArg: a value to use as the context (this) of the mapFn function


    Now that we know its syntax and its parameters, let''s see this method in action.
    In the code below we''re going to create a function that accepts a variable number
    of arguments and returns an array containing these elements doubled.'
  merge: -1
