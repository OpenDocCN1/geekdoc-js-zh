  md: '# Chapter 1: A Beginner’s Guide to Babel


    by James Kolce


    **This article introduces Babel, a JavaScript compiler that allows developers
    to use next-generation JavaScript today.**


    It can be frustrating to write JavaScript when building web applications. We have
    to think about the features available in the browsers we''re targeting and what
    happens when a feature isn''t implemented. Some people would recommend simply
    not using it, which is a painful experience of the time we’re building something
    complicated.


    Thankfully, some tools allow us to stop worrying about what’s supported and just
    write the best code we can. They’re called transpilers. **A transpiler is** a
    tool that takes source code as input and produces new source code as output, with
    a different syntax but semantically as close as possible — ideally equivalent
    — to the original.


    Babel is pretty much the standard transpiler to translate modern JavaScript (ES215+)
    into compatible implementations that run in old browsers. It’s the perfect solution
    if you just want to concentrate on writing JavaScript.


    And though the main goal of Babel is to translate the latest standards of ECMAScript
    (ES) for old — or sometimes — browsers, it can do more. There’s an ecosystem of
    presets and plugins that make possible the addition of non-standard features as
    well. Each plugin makes a new feature/transformation available for your code,
    and presets are just a collection of plugins.


    # Getting Started


    There are different ways to set up Babel depending on your project and the tools
    you use. In this article, we’re going to explain how to set up Babel using the
    CLI, although if you’re using a build system or framework, you can check out'
  merge: -1
  pgno: 398
- img_proc: true
  md: "specific instructions on the official site. Most of the time the CLI is the\
    \ fastest and easiest way to get started, if you're a first-time user, feel free\
    \ to continue.\n\nThe first step to set up Babel in a project is to install the\
    \ package using npm and add it as a dev dependency. Assuming you have a working\
    \ Node.js environment already in place, it's just a matter of running the following\
    \ in your terminal:\n\n```\nmkdir babel-test\ncd babel-test\npm init -y\nnpm install\
    \ --save-dev babel-cli\n```\n\nThis will create a directory (babel-test) change\
    \ into the directory, initialize an npm project (thus creating a package.json\
    \ file) and then install the babel-cli as a dev dependency.\n\nIf you need any\
    \ help with the above, please consult our tutorials on installing Node and working\
    \ with npm.\n\nNext, we can open package.json and add a build command to our npm\
    \ scripts:\n\n```\n\"scripts\": {\n  \"build\": \"babel src -d dist\"\n}\n```\n\
    \nThis will take the source files from the src directory and output the result\
    \ in a dist directory. Then we can execute it as:\n\n```\nnpm run build\n```\n\
    \nBut wait! Before running Babel we must install and set up the plugins that will\
    \ transform our code. The easiest and quickest way to do this is to add the Env\
    \ preset, which selects the appropriate plugins depending on the target browsers\
    \ you indicate. It can be installed using:\n\n```\nnpm install babel-preset-env\
    \ --save-dev\n```\n\nThen create a .babelrc file in the root of your project and\
    \ add the preset:\n\n```\n{\n  \"presets\": [\"env\"]\nn}\n```"
  merge: -1
  pgno: 399
- img_proc: true
  md: "The .babelrc file is the place where you put all your settings for Babel. You’ll\
    \ be using this primarily for setting up presets and plugins, but a lot more options\
    \ are available. You can check the complete list in the Babel API page.\n\nPlease\
    \ note that, depending on your operating system, files beginning with a dot will\
    \ be hidden by default. If this is problematic for you (or if you prefer fewer\
    \ files), you can put your Babel settings in the package.json file, under a babel\
    \ key, like so:\n\n```\n{\n  \"name\": \"babel-test\",\n  \"version\": \"1.0.0\"\
    ,\n  \"babel\": {\n    // config\n  }\n}\n```\n\nFinally, let’s create the directories\
    \ and files Babel is expecting to find:\n\n```\nmkdir src dist\n```\n\nAnd give\
    \ it something to transform:\n\n```\nlet a = 1;\nlet b = 2;\n[a, b] = [b, a];\n\
    console.log(a);\nconsole.log(b);\n```\n\nThis example uses destructuring assignment\
    \ to swap the values of two variables.\n\n# Running Babel\n\nNow that you have\
    \ a ready-to-use Babel installation, you can execute the build command to run\
    \ the compilation process:\n\n```\nnpm run build\n```\n\nThis will take the code\
    \ from src/main.js, transform it to ES5 code and output the transformed code to\
    \ dist/main.js.\n\nHere’s what it produced:"
  merge: -1
  pgno: 400
- img_proc: true
  md: "```\n\"use strict\";\nnvar a = 1;\nvar b = 2;\nvar ref = [b, a];\na = ref[0];\n\
    b = _ref[1];\n\nconsole.log(a);\nconsole.log(b);\n```\n\nAs you see, let has been\
    \ replaced by var and Babel has introduced a temporary variable (denoted by the\
    \ underscore) to facilitate the swap.\n\nAnd that's it. The code that you write\
    \ in the src directory will be translated to previous versions of the language.\
    \ By default, if you don't add any options to the preset, it will load all the\
    \ transformations. You can also indicate the target browsers as follows:\n\n```\n\
    {\n  \"presets\": [\n    \"env\", {\n      \"targets\": {\n        \"browsers\"\
    : [\"last 2 versions\", \"safari >= 7\"]\n      }\n    }\n  ]\n}\n```\n\nThis\
    \ will load the required transformations to support the latest two versions of\
    \ each browser and Safari greater or equal to version 7. You can find the available\
    \ options for the target browsers in the Browserlist repository.\n\n# Babel Ecosystem:\
    \ A Quick Overview\n\nAs you noticed in the previous section, Babel won't do anything\
    \ by itself when you install it. We have to install a set of plugins to obtain\
    \ the desired behavior, or we can use presets, which are predefined sets of plugins.\n\
    \nUsually, each feature that you want to include will be in the form of a plugin.\
    \ Some examples for ES2015 include:"
  merge: -1
  pgno: 401
- img_proc: true
  md: '+   - constants

    - arrow functions

    - block-scoped functions

    - classes

    - for-of

    - spread

    - template literals


    See the Plugins page in the Babel Docs for a complete list.


    But sometimes you don''t want to include all the plugins one by one. So there
    are prebuilt presets that will facilitate the process of installing each plugin.


    The three official presets currently available are:


    +   - Env

    - React

    - Flow


    Env is the most frequently used and the one we''ve used here. It automatically
    loads all the necessary transformations to make your code compatible depending
    on the targeted browsers.


    The React preset transforms code typically found in React projects, mainly adding
    compatibility with Flow annotations and JSX.


    And finally, the Flow preset is used to clean up the code from Flow type annotations
    (although it doesn''t check whether the types are valid or not.)


    # # Babel Polyfill


    There are JavaScript features that can''t be transformed syntactically, usually
    because there''s no equivalent functionality implemented — for example, Promises
    and generator functions.


    Those kinds of features have to be implemented in the browser by a library to
    be used in your code, and that''s the work of a polyfill.


    The Babel polyfill is composed by core-js and the Regenerator runtime. Together,
    they cover all the features in ES2015.'
  merge: -1
  pgno: 402
- img_proc: true
  md: "# Advanced Use\n\nAs mentioned, Babel can also be used to transform features\
    \ that haven't yet been implemented in the language. A good example of this is\
    \ the class fields proposal (currently at TC39 stage 3: candidate). This is particularly\
    \ popular among React devs, as it removes the necessity to explicitly bind methods\
    \ to a particular component, and also means that a component's state can be declared\
    \ as a class field (potentially eliminating the need for a constructor).\n\nFor\
    \ those of you wanting to use class fields today, you would need to add the babel-plugin-transform-class-properties\
    \ as a dev dependency:\n\n```\nnpm install --save-dev babel-plugin-transform-class-properties\n\
    ```\n\nYou'd also update your .babelrc file as follows:\n\n```\n{\n  \"presets\"\
    : [\"env\"],\n  \"plugins\": [\"transform-class-properties\"]\n}\n```\n\nNow you\
    \ can write:\n\n```\nclass App extends Component {\n  state = { count: 0 };\n\n\
    \  incCount = () => {\n    this.setState(ps => ({ count: ps.count + 1 }));\n \
    \ }\n\n  render() {\n    return (\n      <div>\n        <p>{this.state.count}</p>\n\
    \        <button onClick={this.incCount}>add one</button>\n      </div>\n    );\n\
    \  }\n}\n```\n\nAnd it doesn't stop there. You can also use Babel to add new features\
    \ of your own to the language, as our tutorial Understanding ASTs by Building\
    \ Your Own Babel Plugin demonstrates."
  merge: -1
