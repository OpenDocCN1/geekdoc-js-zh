  md: 'A live demo that shows the difference between var and let is available at JSBin.


    # const


    const addresses the common need of developers to associate a mnemonic with a given
    value such that the value cannot be changed (or in simpler terms, define a constant).
    For example, if you''re working with math formulas, you may need to create a Math
    object. Inside this object you want to associate the values of it and e with a
    mnemonic. const allows you to achieve this goal. Using it you can create a constant
    that can be global or local to the function in which it is declared.


    Constants defined with const follow the same scope rules as variables, but they
    cannot be redeclared. Constants also share a feature with variables declared using
    let in they are block-scoped inside function-scoped (and thus they''re not hoisted).
    If you try to access a constant before it''s declared, you you try to assign a
    different value to a variable with const, you''ll receive a TypeError.


    Please note, however, that const is not about immutability. As Mathias Bynens
    states in his blog post ES2015 const is not about immutability, const creates
    an immutable binding, but does not indicate that a value is immutable, as the
    following code demonstrates:


    ```

    const foo = {};nfoo.bar = 42;

    console.log(foo.bar);

    // -> 42

    ```


    If you want to make an object''s values truly immutable, use Object.freeze().


    Browser support for const is equally good as for let. The statement const is supported
    in Node and all modern browsers. But here, too, there are some gotchas in Internet
    Explorer 11, which you can read about in the ES6 compatability table.


    An example usage of const is shown below:


    ```

    ''use strict'';

    ```'
