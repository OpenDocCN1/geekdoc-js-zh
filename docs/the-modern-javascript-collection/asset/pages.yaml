  md: '# Chapter 1: Build a Full-Sphere 3D Image Gallery with React VR


    by Michaela Lehr


    React VR is a JavaScript library by Facebook that reduces the effort of creating
    a WebVR application. You may compare React VR with A-Frame by Mozilla, but instead
    of writing HTML, with React VR we’re using JavaScript to create a WebVR scene.


    React VR is built on the WebGL library three.js and the React Native framework.
    This means we’re able to use JSX tags, React Native components, like <view> or
    <Text>, or React Native concepts, like the flexbox layout. To simplify the process
    of creating a WebVR scene, React VR has built-in support for 3D meshes, lights,
    videos, 3D shapes, or spherical images.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '![](img/db696b7ce627f45564f80b8e17757e2e_252_0.png)


    In this chapter, we want to use React VR to build a viewer for spherical images.
    For this, we''ll use four equirectangular photos, which I shot React Conf 2017
    with my Theta S camera. The gallery will have four buttons to swap the images,
    which will work with the mouse and/or VR headset. You can download the equirectangular
    images as well as the button graphics here. Last but not least, we''ll take a
    look at how animations work with React VR by adding a simple button transition.


    For development, we''re using a browser like Chrome on the desktop. To check if
    the stereoscopic rendering for VR devices, we''re using a Samsung phone with Gear
    VR. In theory, any mobile browser capable of WebVR should be able to render our
    app in a stereoscopic view for the usage with GearVR, Google Cardboard, or even
    Google Daydream. But the library, as well as the API, are still under development,
    support may not be reliable. Here''s a good summary of browsers currently supporting
    WebVR features.


    # # Development Setup and Project Structure'
