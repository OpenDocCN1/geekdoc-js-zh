- img_proc: true
  md: 'a framework. But there are a few things we should be concerned about:


    +   **DOM Performance.** In our clientside code, we''re directly manipulating
    the DOM. This can soon get out of hand as the project grows, causing the UI to
    become sluggish.


    +   **Browser Performance.** There are quite a number of frontend libraries we''ve
    loaded as scripts in index.html, which is okay for development purposes. For production
    deployment, we need a system for bundling all scripts such that the browsers use
    a single request for loading the necessary JavaScript resources.


    +   **Monolithic Code.** For the server code, it''s easier to break down code
    into modular parts since it runs within a Node environment. However, for clientside
    code, it''s not easy to organize in modules unless you use a bundler like webpack.


    +   **Testing.** So far we''ve been doing manual testing. For a production-ready
    application, we need to set up a testing framework like Jasmine, Mocha or Chai
    to automate this work. This will help prevent recurring errors.


    These are just a few of the many issues you''ll face when you approach project
    development without using a framework. Using something such as Angular, React
    or Vue will help alleviate a lot of these concerns. I hope this tutorial has been
    helpful and that it will aid you in your journey to becoming a professional JavaScript
    developer.'
