  md: '# Chapter 4: JavaScript Design Patterns: The Singleton


    by Samier Saed


    In this chapter, we''ll dig into the best way to implement a singleton in JavaScript,
    looking at how this has evolved with the rise of ES6.


    Among languages used in widespread production, JavaScript is by the far most quickly
    evolving, looking less like its earliest iterations and more like Python, with
    every new spec put forth by ECMA International. While the changes have their fair
    share of detractors, the new JavaScript succeeds in making code easier to read
    and reason about, to write in a way that adheres to software engineering best
    practices (particularly the concepts of modularity and SOLID principles), and
    to assemble into canonical software design patterns.


    # Explaining ES6


    ES6 (aka ES2015) was the major update to the language since ES5 was standardized
    in 2009. Almost all modern browsers support ES6. However, if you need to accommodate
    older browsers, ES6 code can easily be transpiled into ES5 using a tool as Babel.
    ES6 gives JavaScript a ton of new features, including a superior syntax for classes,
    and new keywords for variable declarations. You can learn more about it by perusing
    SitePoint articles on the subject.


    # What Is a Singleton


    In case you''re unfamiliar with the singleton pattern, it is, at its core, a design
    pattern that restricts the instantiation of a class to one object. Usually, the
    goal is to manage global application state. Some examples I''ve seen or written
    myself include using a singleton as the source of config settings for a web app,
    on the client side for anything initiated with an API key (you usually don''t
    want to risk sending multiple analytics tracking calls, for example), and to store
    data in'
  merge: -1
