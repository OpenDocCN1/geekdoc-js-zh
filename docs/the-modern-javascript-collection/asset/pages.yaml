  md: 'Maps and Sets are new ES6 collections of key/value pairs. That said, JavaScript
    objects can still be used as collections in many situations. No need to switch
    to the ES6 collections unless the situation calls for it.


    MDN has a nice list of questions to determine when to use an object or a keyed
    collection:


    +   - Are keys usually unknown until run time, and do you need to look them up
    dynamically?

    - Do all values have the same type, and can be used interchangeably?

    - Do you need keys that aren''t strings?

    - Are key-value pairs often added or removed?

    - Do you have an arbitrary (easily changing) amount of key-value pairs?

    - Is the collection iterated?


    # New ES6 Collections Yield a More Usable JavaScript


    JavaScript collections have previously been quite limited, but this has been remedied
    with ES6. These new ES6 collections will add power and flexibility to the language,
    as well as simplify the task of JavaScript developers who adopt them.'
