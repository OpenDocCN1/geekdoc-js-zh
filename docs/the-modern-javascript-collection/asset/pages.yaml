- img_proc: true
  md: "If there's a problem with the request, the promise will be rejected with an\
    \ error object containing at least some of the following properties:\n\n+   *\
    \ message: the error message text.\n* response: the response object (if received)\
    \ as described in the previous section.\n* request: the actual XMLHttpRequest\
    \ object (when running in a browser).\n* config: the original request configuration.\n\
    \n# Transforms and Interceptors\n\nAxios provides a couple of neat features inspired\
    \ by Angular's $http library. Although they appear similar, they have slightly\
    \ different use cases.\n\n# Transforms\n\nAxios allows you to provide functions\
    \ to transform the outgoing or incoming data, in the form of two configuration\
    \ options you can set when making a request: transformRequest and transformResponse.\
    \ Both properties are arrays, allowing you to chain multiple functions that the\
    \ data will be passed through.\n\nAny functions passed to transformRequest are\
    \ applied to PUT, POST and PATCH requests. They receive the request data, and\
    \ the headers object as arguments must return a modified data object\n\n```\n\
    const options = {\ntransformRequest: [\n  (data, headers) => {\n    // do something\
    \ with data\n    return data;\n  }\n]\n}\n```\n\nFunctions can be added to transformResponse\
    \ in the same way, but are called only with the response data, and before the\
    \ response is passed to any chained then() callbacks.\n\nSo what could we use\
    \ transforms for? One potential use case is dealing with an API that expects data\
    \ in a particular format — say XML or even CSV. You could set up a pair of transforms\
    \ to convert outgoing and incoming data to and"
  merge: -1
  pgno: 496
- img_proc: true
  md: 'Could set up all of transforms to convert outgoing and incoming data to and
    from the format API requires.


    It''s worth noting that Axios'' default transformRequest and transformResponse
    transform data to and from JSON, and specifying your own transforms will override
    these.


    # Interceptors


    While transforms let you modify outgoing and incoming data, Axios also allows
    you to add functions called interceptors. Like transforms, these functions can
    be attached to when a request is made, or when a response is received.


    ```

    // Add a request interceptor

    axios.interceptors.request.use((config) => {

    // Do something before request is sent

    return config;

    }, (error) => {

    // Do something with request error

    return Promise.reject(error);

    });


    // Add a response interceptor

    axios.interceptors.response.use((response) => {

    // Do something with response data

    return response;

    }, (error) => {

    // Do something with response error

    return Promise.reject(error);

    });

    ```


    As you might have noticed from the examples above, interceptors have important
    differences from transforms. Instead of just receiving the data or headers, interceptors
    receive the full request config or response object.


    When creating interceptors, you can also choose to provide an error handler function
    that allows you to catch any errors and deal with them appropriately.


    Request interceptors can be used to do things such as retrieve a token from local
    storage and send with all requests, while a response interceptor could be used
    to catch 401 responses and redirect to a login page for authorization.


    # Thirdparty Add-ons'
