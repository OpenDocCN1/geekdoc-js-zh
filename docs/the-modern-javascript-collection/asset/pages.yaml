    # # Loading JSON


    We can''t block the user interface waiting until the request finishes. That''s
    why fetch() returns a Promise, an object which represents a future result. In
    the above example, we''re using the then method to wait for the server''s response
    and log it to the console.


    Now let''s see how we can extract the JSON payload from that once request completes:


    ```

    fetch(''https://www.reddit.com/r/javascript/top/.json?limit=5'')

    .then(res => res.json())

    .then(json => console.log(json));

    ```


    We start the request by calling fetch(). When the promise is fulfilled, it returns
    a Response object, which exposes a json method. Within the first then() we can
    call this json method to return the response body as JSON.


    However, the json method also returns a promise, which means we need to chain
    after then(), before the JSON response is logged to the console.


    And why does json() return a promise? Because HTTP allows you to stream content
    to the client chunk by chunk, even if the browser receives a response from the
    server, the content body might not all be there yet!


