  md: "# Universal / Isomorphic Applications\n\nAlthough SPAs provide a great user\
    \ experience, depending on your needs, they might not be the optimal solution\
    \ — especially if you need quicker initial response times or optimal indexing\
    \ by search engines.\n\nThere’s a fairly recent approach to solving these problems,\
    \ called Isomorphic (or Universal) JavaScript applications. In this type of architecture,\
    \ most of the code can be executed both on the server and the client. You can\
    \ choose what you want to render on the server for a faster initial page load,\
    \ and after that, the client takes over the rendering while the user is interacting\
    \ with the app. Because pages are initially rendered on the server, search engines\
    \ can index them properly.\n\n# Deployment\n\nWith modern JavaScript applications,\
    \ the code you write is not the same as the code you deploy for production: you\
    \ only deploy the result of your build process. The workflow to accomplish this\
    \ can vary depending on the size of your project, the number of developers working\
    \ on it, and sometimes the tools/libraries you’re using.\n\nFor example, if you’re\
    \ working on a simple project, each time you’re ready for deployment you can just\
    \ run the build process and upload the resulting files to a web server. Keep in\
    \ mind that you only need to upload the resulting files from the build process\
    \ (transpilation, module bundling, minification, etc.), which can be just one\
    \ .js file containing your entire application and dependencies.\n\nYou can have\
    \ a directory structure like this:\n\n```\ndist\n  app.js\n  index.html\nnode_modules\n\
    \  lib\n    login.js\n      user.js\n  app.js\n  index.html\n```"
