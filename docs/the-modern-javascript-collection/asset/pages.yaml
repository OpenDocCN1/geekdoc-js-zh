  md: 'Feeling sufficiently frustrated? Good. Let''s get to work and fix the web.


    # # Context is Everything


    You might have noticed that the main bottleneck is the time it takes to load up
    your website. Specifically, the JavaScript download, parse, compile and execution
    time. There''s no way around it but load less JavaScript and load smarter.


    But what about the actual work that your code does aside from booting the website?
    There has to be some performance gains there, right?


    Before you dive into optimizing your code, consider what you''re building. Are
    you building a framework or a VDOM library? Does your code need to do thousands
    of operations per second? Are you doing a time-critical library for handling user
    input and/or animations? If not, you may want to shift your time and somewhere
    impactful.


