  md: "# ES6 Property Shorthands\n\nIf a method accepts large configuration objects\
    \ as an argument, your code can become quite large. It's common to prepare some\
    \ variables and add them to said object. Property shorthands are syntactic sugar\
    \ to make this step shorter and more readable:\n\n```\nconst a = 'foo', b = 42,\
    \ c = function () {};\n\n// Previously we would use these constants like this.\n\
    const alphabet = {\n  a: a,\n  b: b,\n  c: c\n};\n\n// But with the new shorthand\
    \ we can actually do this now,\n// which is equivalent to the above.\nconst alphabet\
    \ = { a, b, c };\n```\n\n# Shorten Your API\n\nOkay, back to another, more common\
    \ example. The following function takes some data, mutates it and calls another\
    \ method:\n\n```\nfunction updateSomething(data = {}) {\n  const target = data.target;\n\
    \  const veryLongProperty = data.veryLongProperty;\n  let willChange = data.willChange;\n\
    \n  if (willChange === 'unwantedValue') {\n    willChange = 'wayBetter';\n  }\n\
    \n  // Do more.\n\n  useDataSomewhere({\n    target: target,\n    property: veryLongProperty,\n\
    \    willChange: willChange,\n    // .. more\n  });\n}\n```"
