  md: 'If you''re used to JavaScript, some of this stuff will look a bit like voodoo,
    but it''s actually not too bad. We have that strange asterisk after the keyword
    function, but all this does is to tell JavaScript we''re defining a generator.


    The other funky bit would be the yield keyword. This is actually what a generator
    spits out when you call it. It''s roughly equivalent to return, but it keeps the
    state of the function instead of rerunning everything whenever you call it. It
    “remembers” its place while running, the next time you call it, it carries on
    where it left off.


    This means we can do this:


    ```

    const nextPrime = getNextPrime();

    ```


    And then call nextPrime whenever we want to obtain — you guessed it — the next
    prime:


    ```

    console.log(nextPrime.next().value); // 2

    console.log(nextPrime.next().value); // 3

    console.log(nextPrime.next().value); // 5

    console.log(nextPrime.next().value); // 7

    ```


    You can just call nextPrime.next(), which is useful in situations your generator
    isn''t infinite, because it returns an object like this:


    ```

    console.log(nextPrime.next());

    // {value: 2, done: false}

    ```


    Here, that key tells you whether or not the function has completed its task. In
    our case, our function will never finish, and that could theoretically give us
    all prime numbers up to infinity (if we had that much computer memory, of course).


