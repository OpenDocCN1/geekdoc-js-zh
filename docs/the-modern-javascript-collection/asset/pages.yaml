  md: '# Full Project Code


    This is all we had to do create a small WebVR application with React VR. You can
    find the entire project code on GitHub.


    This is all we had to do create a small WebVR application with React VR. React
    VR has a few more components we didn’t discuss in this tutorial:


    +   - There’s a Text component for rendering text.


    +   - Four different light components can be used to add light to a scene: AmbientLight,
    DirectionalLight, PointLight, and Spotlight.


    +   - A Sound component adds spatial sound to a location in the 3D scene.


    +   - To add videos, the Video component or the VideoPano component can be used.
    A special VideoControl component adds controls for video playback and volume.


    +   - With the Model component we can add 3D models in the obj format to the application.


    +   - A CylindricalPanel component can be used to align child elements to the
    inner surface of a cylinder — for example, to align user interface elements.


    +   - There are three components to create 3D primitives: a sphere component,
    a plane component and a box component.


    Also, React VR is still under development, which is also the reason for it running
    only in the Carmel Developer Preview browser. If you’re interested in learning
    more about React VR, here are a few interesting resources:


    +   - React VR Docs


    +   - React VR on GitHub'
