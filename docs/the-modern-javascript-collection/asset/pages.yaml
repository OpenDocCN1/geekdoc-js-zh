    # Parcel


    Unfortunately, our code won''t work in all browsers as it stands. We stands.

    we need to use a build process to transpose our code to ES5 and merge all our

    JS files into a single file. Let''s use Parcel to do that.


    Parcel is a module bundler, similar to webpack or Rollup, that promises zero-

    configuration and is blazing fast. It allows us to write modern JavaScript in

    separate files, and then bundles them together into a single, minified JavaScript

    file that most browsers will be able to consume. It also supports multiple CSS,

    SCSS and PostCSS files out of the box.


    First of all, let''s install Parcel:


    ```

    npm install --save parcel-bundler

    ```


    Parcel comes with its own built-in server. This means that you can continue to

    develop and make changes to the app and Parcel will build it in the background,

    so any changes are shown instantly!


    To start the server running, enter the following command:


    ```

    ./node_modules/.bin/parcel src/index.html --out-dir docs

    ```'
