  md: 'ES6 classes fixed this by changing when and by whom objects are allocated.
    In ES5, objects were allocated before invoking of subclass constructor, and the
    subclass would pass that object to the superclass constructor. Now with ES6 classes,
    objects are allocated before invoking the superclass constructor, and the superclass
    makes that object available to the subclass constructor. This lets Array allocate
    an exotic object even when we invoke new on our subclass.


    ```

    // ES6

    class D extends Array {}


    let d = new D();


    d[0] = 42;


    d.length; // 1 - good, array exotic behavior

    ```


