    In this tutorial, we''ll be using Hyperapp to build a to-do list app. If you want
    to learn functional programming principles, but not get bogged down in details,
    read on.


    Hyperapp is hot right now. It recently surpassed 11,000 stars on GitHub and made
    the 5th place in the Front-end Framework section of the 2017 JavaScript Rising
    Stars. It was also featured on SitePoint recently, when it hit its version 1.0.


    The reason for Hyperapp''s popularity is attributed to its pragmatism and ultralight
    size (1.4 KB), while at the same time achieving results similar to React and Redux
    out of the box.


    # So, What Is Hyperapp?


    Hyperapp allows you to build dynamic, single-page web apps by taking advantage
    of a virtual DOM to update the elements on a page quickly and efficiently in a
    similar way to React. It also uses a single object that''s responsible for keeping
    track of the application''s state, just like Redux. This makes it easier to manage
    the state of the app and make sure that different elements don''t get out of sync
    with each other. The main influence behind Hyper was the Elm architecture.


    At its core, Hyperapp has three main parts:


    +   - State. This is a single object tree that stores all of the information about
    the application.

    - Actions. These are methods that are used to change and update the values in
    the state object.'
