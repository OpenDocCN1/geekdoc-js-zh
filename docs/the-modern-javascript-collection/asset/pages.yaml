    now cli over your system:


    ```

    npm install -g now

    ```


    After installation is complete, you can deploy the application. Simply execute
    the following command at the root of your project folder:


    ```

    now --public

    ```


    If this is the first time you''re running the command, you''ll be asked to enter
    your email address. You''ll then receive an email that you''ll need to verify
    your login. After verification has been done, you''ll need to execute the command
    now --public again. After a few seconds, your app will be up and running at a
    specified URL that will be printed out on the terminal.'
