  md: "The next stop on our JavaScript object creation tour is the factory function.\
    \ This is the absolute simplest way to create a family of objects that share the\
    \ same structure, interface, and implementation. Rather than creating an object\
    \ literal directly, instead we return an object literal from a function. This\
    \ way, if we need to create the same type of object multiple times or in multiple\
    \ places, we only need to invoke a function:\n\n```\nfunction thing() {\n  return\
    \ {\n    x: 42,\n    y: 3.14,\n    f: function() {},\n    g: function() {}\n \
    \ };\n}\n```\n\nvar o = thing();\n\nBut there's a drawback. This approach of JavaScript\
    \ object creation can cause memory bloat, because each object contains its own\
    \ unique copy of each function. Ideally, we want every object to share just one\
    \ copy of its functions.\n\n#  Prototype Chains\n\nJavaScript gives us a built-in\
    \ mechanism to share data across objects, called the **prototype chain**. When\
    \ we access a property on an object, it can fulfill that request by delegating\
    \ to some other object. We can use that and change our factory function so that\
    \ each object creates only the unique data to that particular object, and delegate\
    \ all other property requests to a single, shared object:\n\n```\nvar thingPrototype\
    \ = {\n  f: function() {},\n  g: function() {}\n};\n\nfunction thing() {\n  var\
    \ o = Object.create(thingPrototype);\n\n  o.x = 42;\n  o.y = 3.14;\n}\n```"
