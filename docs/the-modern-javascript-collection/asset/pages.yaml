  md: 'a multi-threaded server such as Apache. Two requests to the same PHP page at
    the same time can initiate two threads running isolated instances of the PHP runtime.


    # Going Asynchronous with Callbacks


    Single threads raise a problem. What happens when JavaScript calls a “slow” process
    such as an Ajax request in the browser or a database operation on the server?
    That operation could take several seconds — even minutes. A browser would become
    locked while it waited for a response. On a server, a Node.js application would
    not be able to process further requests.


    The solution is asynchronous processing. Rather than wait for completion, a process
    is told to call another function when the result is ready. This is known as a
    callback, and it’s passed as an argument to any asynchronous function. For example:


    ```

    doSomethingAsync(callback1);

    console.log(''finished'');


    // call when doSomethingAsync completes

    function callback1(error) {

    if (!error) console.log(''doSomethingAsync complete'');

    }

    ```


    doSomethingAsync() accepts a callback function as a parameter (only a reference
    to it passed so there’s little overhead). It doesn’t matter how long doSomethingAsync()
    takes; all we know is that callback1() will be executed at some point in the future.
    The console will show:


    ```

    finished

    doSomethingAsync complete

    ```


    # Callback Hell


    Often, a callback is only ever called by one asynchronous function. It’s therefore
    possible to use concise, anonymous inline functions:


    ```

    doSomethingAsync(error => {

    if (!error) console.log(''doSomethingAsync complete'');

    });

    ```'
