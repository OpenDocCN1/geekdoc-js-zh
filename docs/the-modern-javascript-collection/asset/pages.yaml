  md: '# # Chapter 9: Destructuring Assignment


    by Craig Buckler


    Destructuring assignment sounds complex. It reminds me of object-oriented terms
    such as encapsulation and polymorphism. I''m convinced they were chosen to make
    simple concepts appear more sophisticated!


    In essence, ECMAScript 6 (ES2015) destructuring assignment allows you to extract
    individual items from arrays or objects using a shorthand syntax. Those coming
    from PHP may have encountered list() function, which extracts arrays into variables
    in one operation. ES6 takes it to another level.


    Presume we have an array:


    ```

    var myArray = [''a'', ''b'', ''c''];

    ```


    We can extract these values by index in ES5:


    ```

    var

    one = myArray[0],

    two = myArray[1],

    three = myArray[2];


    // one = ''a'', two = ''b'', three = ''c''

    ```


    ES6 destructuring permits a simpler and less error-prone alternative:


    ```

    const [one, two, three] = myArray;


    // one = ''a'', two = ''b'', three = ''c''

    ```


    You can ignore certain values, e.g.


    ```

    const [one, , three] = myArray;

    ```'
