  md: "# # Chapter 1: New Keywords: let and const\n\nby Aurelio de Rosa\n\nIn this\
    \ tutorial, I'll introduce let and const, two new keywords added to JavaScript\
    \ with the arrival of ES6. They enhance JavaScript by providing a way to define\
    \ block-scope variables and constants.\n\n# let\n\nUp ES5, JavaScript had only\
    \ two types of scope, function scope and global scope. This caused a lot of frustration\
    \ and unexpected behaviors for developers coming from other languages such as\
    \ C, C++ or Java. JavaScript lacked block scope, meaning that a variable is only\
    \ accessible within the block in which it's defined. A block is everything inside\
    \ an opening and closing curly bracket. Let's look at the following example:\n\
    \n```\nfunction foo() {\n  var par = 1;\n  if (par >= 0) {\n    var bar = 2;\n\
    \    console.log(par); // prints 1\n    console.log(bar); // prints 2\n  }\n \
    \ console.log(par); // prints 1\n  console.log(bar); // prints 2\n}\nfoo();\n\
    ```\n\nAfter running this code, you'll see the following output in the console:\n\
    \n+   1\n2\n1\n2\n\nWhat most developers coming from the languages mentioned above\
    \ would"
