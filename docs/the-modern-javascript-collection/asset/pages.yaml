  md: "Let's take a basic function and demonstrate how default parameters can speed\
    \ up your development and make the code better organized.\n\nOur example method\
    \ is called createElement(). It takes a few configuration arguments, and returns\
    \ an HTML element. The API looks like this:\n\n```\n// We want a <p> element,\
    \ with some text content and two classes att\n// Returns <p class=\"very-special-text\
    \ super-big\">Unique text</\ncreateElement('p'), {\n  content: 'Such unique text',\n\
    \  classNames: ['Very-special-text', 'super-big']\n});\n// To make this method\
    \ even more useful, it should always return a d\n// element when any argument\
    \ is left out or none are passed at all.\ncreateElement(); // <div class=\"module-text\
    \ default\">Very default/</d\n```\n\nThe implementation of this won't have much\
    \ logic, but can become large due to its default coverage.\n\n```\n// Without\
    \ default parameters it looks bloated and unnecessary\nfunction createElement(tag,\
    \ config) {\n  tag = tag || 'div';\n  config = config || {};\n\n  const element\
    \ = document.createElement(tag);\n  const content = config.content || 'Very default';\n\
    \  const text = document.createTextNodeNode(content);\n  let classNames = config.classNames;\n\
    \n  if (classNames === undefined) {\n    classNames = ['module-text', 'default'];\n\
    \  }\n\n  element.classList.add(...classNames);\n  element.appendChild(text);\n\
    \n  return element;\n}\n```\n\nSo far, so good. What's happening here? We're doing\
    \ the following:\n\n+   1. setting default values for both our parameters tag\
    \ and config, in case they aren't passed (note that some linters don't like parameter\
    \ reassigning)"
  merge: -1
  pgno: 181
- img_proc: true
  md: "2. creating constants with the actual content (and default values)\n3. checking\
    \ if classNames is defined, and assigning a default array if not\n4. creating\
    \ and modifying the element before we return it.\n\nNow let's take this function\
    \ and optimize it to be cleaner, faster to write, and so it's more obvious what\
    \ its purpose is:\n\n```\n// Default all the things\nfunction createElement(tag\
    \ = 'div', {\n  content = 'Very default',\n  classNames = ['module-text', 'special']\n\
    }) = {\n  const element = document.createElement(tag);\n  const text = document.createTextNodeNode(content);\n\
    \n  element.classList.add(...classNames);\n  element.appendChild(text);\n\n  return\
    \ element;\n}\n```\n\nWe didn't touch the function's logic, but removed all default\
    \ handling from the function body. The function signature now contains all defaults.\n\
    \nLet me further explain one part, which might be slightly confusing:\n\n```\n\
    // What happens here?\nfunction createElement ({\n  content = 'Very default',\n\
    \  classNames = ['module-text', 'special']\n}) = {\n  // function body\n}\n```\n\
    \nWe not only declare a default object parameter, but also default object properties.\
