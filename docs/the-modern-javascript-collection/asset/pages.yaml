    # Number.isSafeInteger()


    The Number.isSafeInteger() method is a completely new addition to ES6. It tests
    whether the value passed is a number that is a safe integer, in which case it
    returns true. A safe integer is defined as an integer that satisfies both the
    two conditions:


    +   - the number can be exactly represented as an IEEE-754 double precision number

    - the IEEE-754 representation of the number can''t be the result of rounding any
    other integer to fit the IEEE-754 representation.


    Based on this definition, safe integers are all the integers from -(2⁵³ - 1) inclusive
    to 2⁵³-1. These values are important and we''ll discuss them a little more at
    the end of this section.


    The syntax of this method is:


    ```

    Number.isSafeInteger(value)

    ```


    Here, value is the value you want to test. A few example uses of this method are
    shown below:


    ```

    // prints ''true''

    console.log(Number.isSafeInteger(5));


    // prints ''false''

    console.log(Number.isSafeInteger(''19''));


    // prints ''false''

    console.log(Number.isSafeInteger(Math.pow(2, 53)));


    // prints ''true''

    console.log(Number.isSafeInteger(Math.pow(2, 53) - 1));

    ```


    A live demo of this code is available at JSBin.


    The Number.isSafeInteger() is supported in Node and all modern browsers,'
