  md: '# Chapter 3: An Introduction to Gulp.js


    by Craig Buckler


    Developers spend new precious little time coding. Even if we ignore irritating
    meetings, much of the job involves basic tasks which can sap your working day:


    +   - generating HTML from templates and content files

    - compressing new and modified images

    - compiling Sass to CSS code

    - removing console and debugger statements from scripts

    - transpiling ES6 to cross-browser-compatible ES5 code

    - code linting and validation

    - concatenating and minifying CSS and JavaScript files

    - deploying files to development, staging and production servers.


    Tasks must be repeated every time you make a change. You may start with intentions,
    the most infallible developer will forget to compress an image or two. Over time,
    pre-production tasks become increasingly arduous and time-consuming; you''ll dread
    the inevitable content and template changes. It''s mindnumbing, repetitive work.
    Wouldn''t it be better to spend your time on more profitable jobs?


    If so, you need a task runner or build process.


    # That Sounds Scarily Complicated!


    Creating a build process will take time. It''s more complex than performing each
    task manually, but over the long term, you''ll save hours of effort, reduce human
    error and save your sanity. Adopt a pragmatic approach:


    +   - Automate the most frustrating tasks first.

    - Try not to over-complicate your build process. An hour or two is more than'
