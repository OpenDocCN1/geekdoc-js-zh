  md: 'Symbol.keyFor(symbol) allows you to retrieve the key for a given symbol. Calling
    the method with a symbol that doesn’t exist in the registry returns undefined:


    ```

    const debbie = Symbol.for(''user'');

    const mike = Symbol.for(''user'');

    dbbie === mike

    // <-- true


    Symbol.keyFor(debbie)

    // <-- "user"

    ```


    # # Use Cases


    There are a couple of use cases where using symbols provides an advantage. One,
    I touched on earlier in the chapter, is when you want to add “hidden” properties
    to objects that won’t be included when the object is serialized.


    Library authors could also use symbols to safely augment client objects with properties
    or methods without having to worry about existing keys (or having their keys overwritten
    by other code). For example, widget components (such as date pickers) are often
    initialized with various options and state that need to be stored somewhere. Assigning
    the instance to a property of the DOM element is not ideal, because that property
    could potentially clash with another. Using a symbol-based key neatly steps this
    issue and ensures that your instance won’t be overwritten. See the Mozilla blog
    post [ES6 in Depth: Symbols](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol)
    for a more detailed exploration of this idea.


    # # Browser Support


    If you want to experiment with symbols, mainstream browser support [is quite good](https://caniuse.com/#).
    As you can see, the current versions of Chrome, Firefox, Microsoft Edge and Opera
    support the Symbol type natively, with Android 5.1 and iOS 9 on mobile devices.
    There are also [polyfills available](https://github.com/polyfill/polyfill) if
    you need to support older browsers.


    # # Conclusion'
