  md: '# Chapter 6: ES6 Arrow Functions: Fat and Concise Syntax in JavaScript


    by Kyle Pennell


    Arrow functions were introduced with ES6 as a new syntax for writing JavaScript
    functions. The good news is that many major modern browsers support the use of
    arrow functions.


    This chapter will cover the details of arrow functions — how to use them, common
    syntaxes, common use cases, and gotchas/pitfalls.


    # What Are Arrow Functions?


    Arrow functions — also called “fat arrow” functions, from CoffeeScript (a transcompiled
    language) — are more concise syntax for writing function expressions. They utilize
    a new token, =>, that looks like a fat arrow. Arrow functions are anonymous and
    change the way this binds in functions.


    Arrow functions make our code more concise, and simplify function scoping and
    the this keyword. They are one-line mini functions which work like Lambdas in
    other languages like C# or Python. (See also lambdas in JavaScript). By using
    arrow functions, we avoid having to type the function keyword, return keyword
    (it’s implicit in arrow functions), and curly brackets.


    # Using Arrow Functions


    There are a variety of syntaxes available in arrow functions, of which MDN a thorough
    list. We’ll cover the common ones here to get you started. Let’s compare how ES5
    code with function expressions can now be written in ES6 using arrow functions.'
