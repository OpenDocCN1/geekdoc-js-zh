- img_proc: true
  md: 'Because symbol-keyed properties are effectively invisible to pre-ES6 code,
    they’re ideal for adding new functionality to JavaScript''s existing types without
    breaking backwards compatibility. The so-called “wellknown” symbols are predefined
    properties of the Symbol function that are used to customize the behavior of certain
    language features, and are used to implement new functionality such as iterators.


    Symbol.iterator is a wellknown symbol that’s used to assign a special method to
    objects, which allows them to be iterated over:


    ```

    const band = [''Freddy'', ''Brian'', ''John'', ''Roger''];

    const iterator = band[Symbol.iterator]();


    iterator.value();

    // <-- { value: "Freddy", done: false }

    iterator.value();

    // <-- { value: "Brian", done: false }

    iterator.value();

    // <-- { value: "John", done: false }

    iterator.value();

    // <-- { value: "Roger", done: false }

    iterator.value();

    // <-- { value: undefined, done: false }

    ```


    The built-in types String, Array, TypedArray, Map and Set all have a default Symbol.iterator
    method which is called when an instance of these types is used in a for...of loop,
    or with the spread operator. Browsers are also starting to use the Symbol iterator
    key to allow DOM structures such as NodeList and HTMLCollection to be iterated
    over in the same way.


    # The Global Registry


    The specification also defines a runtime-wide symbol registry, which means you
    can store and retrieve symbols across different execution contexts, such as between
    a document and an embedded iframe or service worker.


    Symbol.for(key) retrieves the symbol for a given key from the registry. If a symbol
    doesn’t exist for the key, a new one is returned. As you might expect, subsequent
    calls for the same key will return the same symbol.'
