  md: 'However, this code is more verbose than it needs to be, and also doesn''t give
    us the immutability we desire when making use of singletons. Code executed later
    could modify one of the exposed functions, or even redefine UserStore altogether.
    Moreover, the modifying/offending code could be anywhere! If we got bugs as a
