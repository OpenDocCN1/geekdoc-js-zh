    ```


    This tutorial assumes your assets will be compiled to the builder folder and committed
    to your Git repository or uploaded directly to the server. However, it may be
    preferable to build assets on the live server if you want to change the way they
    are created. For example, HTML, CSS and JavaScript files are minified on production
    but not development environments. In that case, use the -save option for Gulp
    and all plugins, i.e.


    ```

    npm install gulp --save-dev

    ```


    This sets Gulp as an application dependency in the "dependencies" section of package.json.
    It will be installed when you enter npm install and can be run wherever the project
    is deployed. You can remove the build folder from your repository since the files
