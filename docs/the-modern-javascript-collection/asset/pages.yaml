  md: '# Chapter 7: Introducing Axios, a Popular, Promise-based HTTP Client


    by Nilson Jacques


    Axios is a popular, promise-based HTTP client that sports an easy-to-use API and
    can be used in both the browser and Node.js.


    Making HTTP requests to fetch or save data is one of the most common tasks a client-side
    JavaScript application will need to do. Thirdparty libraries — especially jQuery
    — have been a popular way to interact with the more verbose browser APIs, and
    abstract away cross-browser differences.


    As people move away from jQuery in favor of improved native DOM APIs, and front-end
    UI libraries like React and Vue.js, including purely for its $ajax functionality
    makes less sense.


    Let''s take a look at how to get started using Axios in your code, and see some
    of the features that contribute to its popularity among JavaScript developers.


    # Axios vs Fetch


    As you''re probably aware, modern browsers ship with the newer Fetch API built
    in, so why not just use that? There are several differences between the two that
    many feel Axios the edge.


    One such difference is in how the two libraries treat HTTP error codes. When using
    Fetch, if the server returns a 4xx or 5xx error, your catch() callback won''t
    be triggered and it is down to the developer to check the response code to determine
    if the request was successful. Axios, on the other hand, will reject the request
    if one of these status codes is returned.


    Another small difference, which often trips up developers new to the API, is that
    Fetch doesn''t automatically send cookies back to the server when making a'
  merge: -1
  pgno: 492
- img_proc: true
  md: 'Axios automatically sends cookies back to the server when making a request.
    It''s necessary to explicitly pass an option for them to be included. Axios has
    your back here.


    One difference that may end up being a show-stopper for some is progress updates
    on uploads/downloads. As Axios is built on top of the older XHR API, you''re able
    to register callback functions for onLoadProgress and onDownloadProgress to display
    the percentage complete in your app''s UI. Currently, Fetch has no support for
    this.


    Lastly, Axios can be used in both the browser and Node.js. This facilitates sharing
    JavaScript code between the browser and the back end or doing rendering of your
    front-end apps.


    # Fetch API for Node


    there are versions of the Fetch API available for Node but, in my opinion, the
    other features Axios give it the edge.


    # Installing


    As you might expect, the most common way to install Axios is via the npm package
    manager:


    ```

    npm i axios

    ```


    and include it in your code where needed:


    ```

    // ES2015 style import

    import axios from ''axios'';


    // Node.js style require

    const axios = require(''axios'');

    ```


    If you''re not using some kind of module bundler (e.g. webpack), then you can
    always pull in the library by a CDN in the traditional way:


    ```

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    ```


    # Browser support'
  merge: -1
