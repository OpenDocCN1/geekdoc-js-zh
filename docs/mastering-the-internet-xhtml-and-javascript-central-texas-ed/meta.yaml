    # 3.16 Wireless E-Mail


    Wireless (mobile or handheld) e-mail is an ideal application to use the IMAP protocol
    for com-

    munication, it avoids the downloading of messages into handheld devices, which
    have limited

    storage capacity. IMAP also contributes to keeping e-mail in one location: the
    incoming e-mail


    There are three key issues to wireless, handheld, and mobile e-mail. The first
    is security.

    The downloading of e-mail should be done via a secure Internet connection that
    uses encryption

    keys. The second is a single-mailbox integration. Syncing the handheld device''s
    mailbox

    with desktop mailboxes could be confusing for users. The third issue is known
    as a push, **Push is**nprocess by which e-mail is automatically delivered to the
    handheld device rather than

    user having to initiate the process each time.


