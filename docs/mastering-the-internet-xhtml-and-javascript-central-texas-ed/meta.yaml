    # # FAQs


    Mailing Lists (Section 5.2)


    +   Q: Will subscribing to a mailing list cause me to receive an increased amount
    of span

    A: Mailing-list servers install spam filters to shield their lists members from
    spam and unsolicited e-mail.


    +   Q: Can I send an HTML e-mail message to a mailing list?

    A: List servers such as LISTSERV support both XHTML and text formats. However,
    plain text is recommended.


    Usenet Newgroups (Section 5.4)


    +   Q: What port number do NNTP use?

    A: The default port number is 119.


    +   Q: Are there any public servers that I can use to configure my browser as
    a newsreader?

    A: There are very few. You have to search for them. The one in Example 5.3 of
    this chapter is a German news server. To find others, run a Google search using
