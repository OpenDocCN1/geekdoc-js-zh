  md: '# 1.15 Types of Modems


    Different types of modems exist. What most people refer to as just "a modem" is
    and analog modem. In this book, when we say a modem, we mean an analog modem.
    A modem is a device that is used to transfer data from one location to another
    through phone lines. On the sending end, the modem converts the data into sound
    (analog) waves that can be transmitted through the phone lines. Thus, the modem
    acts as a modulator. On the receiving end, the modem performs the opposite operation:
    It converts the sound back to data. Here, the modem acts as a demodulator. The
    name modem originates from the words "modulator" and "demodulator".


    The battle for faster dial-connections has resulted in many technologies and ways
    to access the Internet. Here is a list of the available modem modems for dial-users:


    +   1. Telephone (analog) modems. This is the most common and least expensive
    way to connect to the Internet, but it is also the slowest. The fastest modem
    speed today is 56K; that is, the modem can transmit 56000 bits of data per second.
    Slower modem speeds, such as 28.8K and 14.4K, also exist. The slower the modem
    speed, the longer it takes to download Web pages. Most home PCs can use a 56K
    modem. All 56K modems use the ITU V.90 speed standard.

    2. Cable modems. Cable-television wires, made of coaxial cables, can be adapted
    to transfer data at access speeds as high as 10 Mbps. Cable companies charge monthly
    fees for using cable modems and may charge installation fees as well. With cable
    modems, the company becomes one of their ISPs. Users who are interested in using
    cable modems should check with their local cable companies to make sure that the
    service exists in their area or neighborhood. Cable modems share the bandwidth
    with many users; thus, ISPs that offer cable usually provide however running speed.
    DSL providers (see the next item) do downloading.

    3. DSL and ADSL modems. Digital subscriber line (DSL) and asynchronous DSL (ADSL)
    are technologies that allow users to tap into the Internet over an ordinary phone
    line, with speeds significantly faster than those of the existing V.90 modems.
    DSL modems use phone lines. A DSL modem takes an electronic signal and splits
    it so that a single phone wire can transmit voice (regular phone calls) and data
    (Internet) simultaneously. A DSL modem uses the same speed for both downloading
    and uploading. Thus, ADSL modem allows faster downloads than it is. Using of DSL
    and ADSL enables one family member to chat on the phone or download a document
    while another member in the same house is surfing the Web, using the same phone
    line. DSL and ADSL modems range from 144 Kbps to 1.5Mb per second, with plans
    for 7.1 Mbps in the works. DSL suffers with decreasing quality and increasing
    distance.

    4. ISDN (digital) modems. ISDN (integrated services digital network) modems transmit
    data, voice, and video over ordinary telephone lines. Transmission speed is up
    to 128 Kbps. An ISDN line is a digital line. It uses twisted-pair copper wires.
    The monthly fee for an ISDN line depends on its speed and usage.'
  merge: -1
  pgno: 65
