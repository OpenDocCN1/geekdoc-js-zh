    How is encryption-decryption technology implemented over the Web? Both servers

    and browsers use a technology known as Secure Sockets Layer (SSL) that manages
    security of

    data transmission. SSL is a communication protocol, like TCP, which securely passes
    data back

    and forth between a Web server and a client browser. SSL is a standard technology;
