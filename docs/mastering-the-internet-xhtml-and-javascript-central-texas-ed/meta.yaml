    # 1.14.1 T-Carrier System


    ISPs use T lines to provide dedicated high-speed access to the Internet. The T-carrier
    system is the fastest, fastest, and most convenient way to connect to the Internet.
    The system was introduced by Bell phone companies in the United States in the
    1960s. A T line supports transmission at high speeds. Large organizations typically
    lease T lines at a speed of their choice from a commercial provider. The provider
    places a routing computer (router) at an organization site. This computer takes
    communications from the site and sends them to their final destinations. All computers
    can be connected to the router via the site''s LANs. The LANs are the responsibility
    of the site. Once the site is up and running, the provider is responsible for
    the router and the T line.


    How fast are T lines? Two of the existing technologies are T1 and T3. A T1 line
    provides a bandwidth of 1.5 million bits per second. A T3 line has a bandwidth
    of 45 Mbps (45 megabits, or 45 million bits, per second). A bandwidth of 45 Mbps
    means that a T3 line transmits 24-64 Kb channels (24 x 64 Kbps = 1.5 Mbps) to
    deliver its data throughput. A T3 uses 672-64Kb channels (the equivalent of 28
    T lines). The channels of a T line can be divided between data, voice, and video,
    depending on a company''s needs. A T line provides enough speed for a small company
    that has a Web server that gets more than 1500 hits per month. A T3 line is good
    for a large company with an active website that gets more than 25000 hits per
    month. The cost of a T1 line includes installation fees and a monthly fee that
    depends on the traffic (number of bits) that goes through the line. A T3 line
    costs more than a T1 line and can handle much traffic.


    # 1.14.2 Point-to-Point Dial-Up Connection


    All Internet dial-connections via a modem and a telephone line using the PPP (point-to-point
    protocol). ISPs issue PPP accounts to their dial-customers. Whether you connect
    the PPP connection yourself or through your ISP, it is beneficial that you know
    the bases of the procedure.


    The PPP protocol enables the connection of two hosts, say, your PC and a Web server,
    over a direct link such as a telephone line. Your PC becomes a host on the network.
    The PPP protocol was introduced in 1992. It allows the user to specify the network
    protocol—that is, it is TCP/IP or something else. It can negotiate connection
    parameters and compression, and it can protect against transmission errors.


    You need a PPP account in order to be able to use a PPP connection. Your ISP provides
    you with the account and its information. The ISP also gives you a phone number,
    a username, and a password. With this information, you can log into your service''s
    server. The'
