  md: '# Overview of the Internet


    # Goal


    Understand and master some of the basic concepts of the Internet and the World
    Wide Web in order to be able to use them effectively in ordinary life, as well
    as in professional activities.


    # Objectives


    +   * Client/server model

    * Data and file transmission across the Internet

    * URLs and IP addresses as unique Internet IDs

    * The structure of e-mail addresses

    * File protocols and compression and decompression of files

    * Inranets and extranets

    * Requirements and types of Internet connections

    * Modem types


    ![](bbox=[0.045, 0.0, 0.768, 0.375])'
  merge: -1
  pgno: 44
- img_proc: false
  md: '# Outline


    +   1.1 Introduction

    1.2 The Internet and the World Wide Web

    1.3 Internet Jargon

    1.4 Client/Server Model

    1.5 Client/Server Diagnostic Commands

    1.6 Evolution of the Internet and the World Wide Web

    1.7 Transmission across the Internet

    1.8 IP Addresses and URLs

    1.9 Internet Domain Names

    1.10 E-mail Addresses

    1.11 File Protocols on the Internet

    1.12 File Compression and Decompression

    1.13 Intranets and Extranets

    1.14 Connecting to the Internet

    1.15 Types of Modems

    1.16 Internet Tools

    1.17 Tutorials

    FAQs -Blackbox -Check Your Progress - Problems


    # 1.1 Introduction


    The Internet has been acknowledged as the source of a profound information revolution.
    It has already changed our lives and the ways in which we communicate and conduct
    business. For example, many of us send e-mail messages back and forth to friends,
    colleagues, customers, clients and relatives all over the world. The Internet
    provides an instant mode of communication in the form of electronic mail—or e
    mail for short—and instant messaging. You can meet people on the Internet. Web
    pages clutter the Internet. Today, Internet Yellow Pages assist in helping people
    shift through the clutter. There is no doubt that this medium of communication
    will dominate and surpass any other medium. The Internet had more users in its
    first 5 years than the telephone did in its first 30 years, and the volume of
    e-mail sent everyday already outnumbers of regular mail.


    While reading and about the Internet, putting all its related pieces together
    is often confusing. This chapter provides an overview of the structure of the
    Internet, explains how the Internet works, and discusses the different types of
    connections to the Internet.


    # 1.2 The Internet and the World Wide Web


    The Internet encompasses diverse computers and programs working together seamlessly
    as a network. A network is a collection of devices (such as computers and printers)
    that are connected together by communication paths. These devices are called the
    nodes of the network, and'
  merge: -1
  pgno: 45
- img_proc: false
  md: '# The Internet and the World Wide Web


    the communication paths may be with wires, fiber-optic cables, or wireless connections.
    The Internet is a network of networks. These networks include various federal
    networks, a set of regional networks, campus networks, and foreign networks. The
    Internet connects many geographical regions; sometimes it is known as the “information
    superhighway.” It enables worldwide international networks to communicate with
    each other.


    This definition of the Internet typically does not mean much to the end user.
    The user only wants to do something specific, such as a run program, access a
    website, or download a particular file. As such, an end user does not need to
    worry about how the Internet is put together. A good analogy is the telephone
    system; it, too, is a network. Phone companies at AT&T, MCI, and Sprint are all
    separate corporations running pieces of the telephone system. They worry about
    how to make it work together; all the user has to do is dial the number. The user
    begins to worry only when a problem occurs, such when a phone call cannot be completed.
    In such cases, the company that owns the part of the system causing the problem
    should fix it. It is the same for the Internet: Each network has its own operations
    center. If something goes wrong with the network, the company that it operates
    fixes the problem.


    The Web, the section of the Internet that features multimedia capabilities (i.e.,
    as video, audio, images, and text). The Web began to take off after Mosaic, the
    first graphical Web viewer (browser), came out in 1994 and has quickly become
    a vast network of data, news, shopping-guides, promotional materials, periodicals,
    and Web pages, displayed in colors, with audio and video output. As described
    in detail in Part II of the book, extensible hypertext markup language (XHTML)
    allows website creators to link their Web pages to other pages, with each page
    accessed by a simple click of the mouse button.


    The Internet''s driving force is the World Wide Web (also known as WWW, W3, or


    ![](bbox=[0.36, 0.603, 0.631, 0.703])


    The Internet links powerful services in every part of the world. A server is a
    program that resides on a computer and provides services for other computer programs
    known as clients. A particular computer may contain both client and server programs.
    Web users can transfer files to and from other computers (known as uploading and
    downloading, respectively), send electronic messages to the e-mail addresses of
    other users, and set up their own Web pages for whatever they desire. Companies,
    universities, government agencies, and individuals throughout the world now maintain
    pages on the Web, and the demand for Web access is increasing PC (personal computer)
    use.


    The methods for finding and accessing information on the Internet are very unique.
    Traditionally, as found in libraries, information is organized in books that are
    indexed and shelved within'
  merge: -1
  pgno: 46
- img_proc: false
  md: '# 6 Chapter 1 • Overview of the Internet


    order, according to a standard classification system. Unlike information in libraries,
    however, information on the Internet is not organized at all. Information is contained
    in Web pages. In order to find a particular piece of information, a Web surfer
    uses a search engine. A Web surfer is a person who uses the Internet to find desired
    information. A search engine is a computer program that searches one or more words
    that might be found in websites containing the information), and the search engine
    returns links to the Web pages that contain the search (usually as hits).


    The conclusion drawn from the foregoing analogy is that we need to use a different
    mental model when dealing with information on the Web. The heart of this model
    is a dynamic nature and randomness of information. Thus, one should not tend to
    memorize the addresses and titles of websites, but rather how to search for information
    effectively.


    # 1.3 Internet Jargon


    The Internet is full of acronyms and new words. The chapters of this book introduce
    definitions as we need, and these definitions are listed again in the glossary
    in Appendix A. For additional information on Internet jargon, refer to the following
    websites or use a search engine: http://www.whatis.com and http://www.wbopedia.com.


    # 1.4 Client/Server Model


    The client/server model is central to Internet communication, distributed computing,
    and services. This model uses two computer programs installed on two separate,
    but networked, computers at different locations. The client program (or client,
    for short) installed on one computer communicates with the server program on the
    other computer, as shown in Figure 1.1. The client requests services from the
    server. While the server is running, it acts as a daemon. A daemon is a process
    that awaits (''listens'') to client requests. When it receives a request from
    a client, it grants the request and sends a response back to the client. A common
    example of client/server communication is a Web browser acting as a client when
    requesting a Web page from a Web server.


    Multiple clients can access a server concurrently. This situation increases the
    demand for traffic, or number of hits on the server and may slow its response
    time significantly. In such a case, the server (also known as the host computer
    or machine, or host for) must be upgraded or replaced with a faster computer to
    handle the increased demand. Balancing a server''s load to improve its response
    time is a very interesting and practical problem, but is beyond the scope of this
    book.


    ![](bbox=[0.358, 0.755, 0.638, 0.953])'
  merge: -1
  pgno: 47
- img_proc: false
  md: '# Client/Server Model


    ![](bbox=[0.187, 0.118, 0.758, 0.327])


    ![](bbox=[0.175, 0.365, 0.742, 0.574])


    **Figure 1.1** Client/server model.


    Client/server databases are used extensively on the Web. A **database** is a set
    of data that is organized and stored in a file or many files. For example, a bank
    customer can use a browser to access the bank''s database, installed on a server,
    to check his or her account balance. A common architecture of a client/server
    database is the **two-tier model**, where two networked computers are used as
    shown in Figure 1.1a). The client, running as an application in a browser, sends
    requests (queries) to the database. The database, accessed through a server, sends
    the query results back to the client. Another architecture is the **three-tier
    model**, where a middle server is added between the database and the client for
    security purposes.


    ![](bbox=[0.285, 0.816, 0.648, 0.923])


    Three-tier database model'
  merge: -1
  pgno: 48
- img_proc: false
  md: '# 8 Chapter 1 • Overview of the Internet


    The client/server model and the increasing accessibility of the Internet has spurred
    the concept of remote hosting of applications for delivery over the Internet.
    A subscriber can rent any of these applications from an ASP (application server
    provider) for a fee, instead of installing and maintaining the applications in-house.
    The ASP hosts the software on its Web servers, which entails installing, maintaining,
    managing, and upgrading it. The burden of computing then shifts from the client
    (subscriber) to the ASP server. Renting applications from ASPs frees subscribers
    resources, saves money, and allows them to focus on their core activities. The
    evaluation and choice of an ASP should include an assessment of the service, scalability
    (can it handle a significant increase in the number of users or amount of data?),
    and security the ASP provides.


    # 1.5 Client/Server Diagnostic Commands


    There are many operating system-level (OS-level) commands that a client can use
    to probe communication with a server. These commands are supported by many OSs
    such as Windows and Unix. We cover three commands in this section: finger, ping,
    and traceroute. Refer to Tutorial 1.17.1 for an example in this use. We cover
    the nslookup command in Section 1.8.


    The finger command allows you to find out who is currently logged into a given
    host or whether a particular user is logged in. To finger a host, use the command
    finger hostname—for example, finger neu.edu, for which the result would be a list
    of the users currently logged into the neu.host. To finger a particular user,
    use the command finger username@hostname—for example, finger zeid@coe.edu. If
    the user is logged in, you will receive back the login name, and the logging time
    of the user. You need to realize that some computers may reject the finger command,
    for security reasons.


    The ping command allows a client to check whether a server is up and running.
    The general command syntax is ping hostname—for example, ping neu.edu. The command
    returns whether the host is up or down. This command is helpful to use before
    you connect to a host.


    The traceroute (Unix) and traceroute (Windows) commands trace the transmission
    route that data takes from a client to a server. The general command syntax is
    traceroute hostname—for example, traceroute mit.edu. The route is measured in
    term of hops. A hop is the trip that data takes from one router to another. Alternatively,
    a hop is an intermediate network node that data passes. The command also calculates
    and displays the amount of time each hop takes, traceroute is useful in debugging
    network problems, especially with determining where they are.


    There are computer programs that include finger, ping, traceroute, and other diagnostic
    commands. Interested readers can search for them which they may download and install
    one of these programs. To do so, go to a search engine and enter the string "ping
    and trace tools". Examples of the programs include NetMaps and CyberKit.'
  merge: -1
  pgno: 49
- img_proc: false
  md: '# Evolution of the Internet and the World Wide Web


    **Example 1.1** Use client/server diagnostic commands.


    Check the status of the following two hosts: mit.edu and neu.edu. How many hops
    it takes to connect to each host?


