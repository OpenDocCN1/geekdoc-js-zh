    # 3.5 Acronyms and Emoticons


    Some users use acronyms and emoticons in the text of their e-mail messages. An
    acronym is an abbreviation for a group of words. Acronyms are used to compose
    a message quickly. An emoticon (sometimes referred to as a smiley, the name of
    the original emoticon) is a short sequence of keyboard characters that emulates
    facial expressions or describe the accompanying parts of an e-mail message. In
    addition to using them, acronyms and emoticons are used in online chatting. It
    is recommended not to overuse them in e-mail messages, as recipients may not be
    aware of them or remember what they mean.


