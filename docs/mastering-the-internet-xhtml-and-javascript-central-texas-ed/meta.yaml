    #  2.14 History List


    Browsers help users retrace their surfing steps by providing them with a browsing
    history. The history can be short (Web pages viewed in the current session are
    stored in the browser''s memory cache) or long term (Web pages viewed in a number
    of sessions are stored in the browser''s disk cache). All browsers provide the
    Back and Forward buttons for viewing the previous pages of current browsing session.
    Browsers also provide a Go or Navigation menu or button, as well as a drop-down
    list at the right end of the URL toolbar.


    Many users employ the CTRL+H shortcut to display the browser history list. The
    browser window must be the active window on the desktop for the browser shortcut
    to work. Both the IE and CB browsers provide a History button (sidebar) on the
    navigation toolbar on the left side of the browser window. Once this is opened,
    click any URL in the history list to open it. In both Netscape 4.8 and 7.01, the
    CTRL+H shortcut opens a separate history window on the desktop. Once this window
    is opened, double-click any URL in the history list to open it. In the Opera browser,
    type opera:history in its URL toolbar to open the history list as a Web page inside
    the Opera browser. Click any URL in the list to open the corresponding Web page.


    We should mention that a browser history poses a threat to individual privacy.
    Anyone can display the history list of a browser on a computer and be able to
    find out all the websites the user has visited, for example, in the last 30 days.
    Investigators use the history list to shed some light on many crimes. To protect
    their privacy, users can set both the memory and disk cache of their history to
    zero.


