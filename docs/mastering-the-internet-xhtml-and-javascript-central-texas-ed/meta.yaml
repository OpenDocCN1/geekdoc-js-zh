    # 2.8 Opera


    Opera is a Web browser that is similar in nature to both IE and Netscape. It can
    be downloaded from http://www.opera.com. Its Norwegian developer offers it free
    of charge, but with banner advertising. When Opera starts, it gives the user to
    continue previous sessions. A session is the period starting when a browser window
    opens until it closes. Opera is fast in downloading Web pages and does not crash
    very often. It also saves all currently open pages of a session and starts the
    next where it left off.


