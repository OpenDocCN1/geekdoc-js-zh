    A browser uses the two types of caches according to the following scenario: User
    requests a Web page by typing its URL, into the browser''s URL toolbar or by using
    the Back and Forward buttons of the browser. In either case, the browser checks
    its memory cache first, followed by its disk cache. If it finds the Web page in
    cache, it loads into its window. Guard against old content in its disk cache,
    the browser usually contacts the Web page''s server to verify whether the content
    of a Web page has been altered since its last retrieval. If it has, the browser
    downloads the new content. The browser does not perform this check for its memory
    cache, because content change is highly unlikely within one browser session.


    Most browsers allow users to change the size of memory and disk caches. As the
    available cache space is filled, old Web pages are replaced with new ones. Decreasing
    the size of cache will decrease the chances of previously visited Web pages available
    from the cache. A user who does not want to store Web pages between browser sessions
    should set the disk cache to zero.


