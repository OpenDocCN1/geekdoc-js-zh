  md: '# 132 Chapter 3 • E-Mail Tools


    Communication and Protocols (Sections 3.2 and 3.3)

    Is Inbox a standard folder name that all e-mail clients use?

    A: But many clients do use it. For example, Hotmail, Yahoo! Mail, Outlook, and
    Netscape Mailer use it. However, Eudora uses In, while Opera uses Received.

    : How many incoming e-mail servers can I specify in my e-mail program when I configure
    it to set up an account?

    A: You can specify multiple IMAP and POP servers. To access your account on any
    one of them, you must use the account login (username and password). You cannot
    always specify multiple IMAP and POP servers. It depends on the e-mail program
    you use.

    : What are queued e-mail messages on an SMTP server?

    A: These are messages that are waiting to be sent, because the receiving server
    could be down or experiencing heavy e-mail traffic.

    : What are the standard port numbers used by e-mail servers?

    A: SMTP servers listen on port number 25, while POP3 servers listen on port 110
    and IMAP servers listen on port 143. When an e-mail client sends a message, the
    SMTP server receives it through port 25. When the client checks the e-mail, the
    POP3 (IMAP) server sends it through port 110 (143).


    ![](bbox=[0.315, 0.495, 0.685, 0.615])


    : What are some e-mail clients that can be configured to use different types of
    incoming-mail servers?

    A: The program Mail.app that runs on a Macintosh can specify multiple POP3 servers
    or a mixture of POP3 and IMAP servers. Other e-mail programs can have multiple
    servers of mixed type include Pine and Mutt on Unix systems.

    Content, Attachments, and Etiquette (Section 3.4)

    : I received an e-mail message that is only one very long line. Why? How do I
    read it?

    A: Assuming that the sender did not intend to write a very long line, this means
    that word wrap of your e-mail client did not work for this message. Sometimes
    this happens when you receive messages from a different OS (e.g., a message sent
    Mac to Windows). To read the message, check the setup of your e-mail program and
    turn the word wrap option. Alternatively, you can copy and paste the body of the
    message into Notepad or Word.'
