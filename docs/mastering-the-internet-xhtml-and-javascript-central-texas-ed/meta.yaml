  md: '# 196


    # Chapter 6 • Security and Privacy


    from the Internet and send it to the requesting server. The net effect is that
    the outside computer hosting the information never comes into contact with any
    of the computers behind the firewall. The stateful-inspection method does not
    inspect the contents of each TCP packet; instead, it compares key parts of the
    packet with a database of trusted information. For example, some firewalls do
    not allow the receipt of e-mail from outsiders unless the outsiders have received
    prior e-mail messages from inside the firewall.


    Firewalls are customizable. A firewall can be set up to block all traffic to or
    from a given IP address or domain name, to assign one or two computers to a specific
    protocol (only HTTP, for example), to block a certain port number, or to block
    access to websites that contain specific phrases and words.


    A firewall protects against many breaches, including unauthorized remote login,
    exploitation of application holes and operating-system bugs by crackers, and the
    sending of spam and viruses. The highest level of security a firewall offers is
    to block everything, which defeats the purpose of an Internet connection. A good
    system administrator should set up a firewall effectively.


    # 6.5 P3P


    Web users and applications have been increasing steadily, at both the professional
    and personal levels. As a result, large amounts of sensitive and personal information
    are exchanged via the Internet. This condition has prompted a surge of interest
    in privacy protection and means of ensuring people that their personal information
    will be collected and used according to their permission and will. The W3C organization
    has taken the initiative to develop privacy-practice disclosure with respect to
    data collected through the Internet. The result of this is P3P.


    P3P (Platform for Privacy Preferences) is a protocol created by the W3C organization
    to provide a simple, automated way for users to control the use of their personal
    information on websites that they visit, P3P is about establishing privacy disclosure
    technology. For website developers, P3P provides a standard to articulate their
    privacy policies to visitors. For Web surfers, P3P provides a set of multiple-choice
    questions covering the major aspects of a website''s privacy policies. The answer
    user provides to these questions specifies his or her desired level of privacy.
    Essentially, P3P provides a clear representation of how a website handles personal
    and private information about its users. P3P-enabled websites make this information
    available in a machine-readable format. P3P-enabled browsers can automatically
    retrieve and easily inspect this information and compare it with the user''s own
    set of privacy preferences that he or she specified through the browsers.


    P3P allows users to automate the acceptance or the rejection of a website''s requests
    for information (through the use of cookies), based on the privacy preferences
    they set in their browsers. Users are assured that their privacy is protected
    without having to read each website''s privacy policy. P3P does not give users
    more privacy; it only allows them to exercise data preferences. It makes users
    better informed about what data are collected and why.


    There are commercially available P3P policy editors, with visual development tools
    and interfaces, to create a website''s privacy policy in the P3P protocol. These
    editors produce'
