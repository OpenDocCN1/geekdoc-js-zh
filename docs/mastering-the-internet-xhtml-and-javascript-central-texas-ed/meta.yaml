    How do outgoing and incoming mail servers handle e-mail messages? They both handle
    mail in a similar fashion to the post office mail system. The outgoing mail server
    sends messages as they come. If the recipient''s mail server is down, the sender''s
    outgoing mail server holds the messages in a queue and tries to send them again
    later. This holding process is known as queuing. The incoming mail server has
    a queue for the messages that it receives, from which it delivers the messages
    to the mailboxes of their intended recipients. It also holds the messages in the
    mailboxes (Figure 3.1) until the recipients check their mail.


    A mailbox typically has multiple mail folders, including Inbox, Sent, Draft, and
    Trash. The Inbox folder receives and stores the incoming mail. The Sent folder
    holds copies of the outgoing (already sent) mail messages. Users utilize the Draft
    folder to keep in progress messages that are not ready to be sent. The Trash folder
    keeps the messages to be deleted. A message requires two deletes in order to remove
    it completely from a mailbox. The first delete removes the message from its current
    folder, such as Inbox, Sent, or Draft. The delete actually does not delete the
    message; instead, it moves it to the Trash folder. The second truly deletes the
    message. The user must open the Trash folder, highlight the message, and delete
    it.


