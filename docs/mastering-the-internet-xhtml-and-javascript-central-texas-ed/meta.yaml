  md: '# 2.17 Wireless Browsing


    Wireless browsing (also known as mobile or handheld browsing) refers to browsing
    activities on miniature screens of small devices. Handheld devices are mobile,
    and some are wireless. They include pocket PCs, handheld PCs, cell and smart phones,
    and PDAs (personal digital assistants) such as Palm Pilots, Handspring Visors,
    Blackberries, and many organizers. These handhelds are known to be memory starved
    and power and space constrained, as well as to have small display screens compared
    with those of desktop computers. Thus, stripped-down versions of desktop Web browsers
    must be developed to accommodate the limited onboard memory of these devices.


    ![](bbox=[0.198, 0.335, 0.833, 0.638])


    Pocket PC Handheld PC Blackberry Palm Pilot Cell phone Handhelds


    Handheld browsing may be done online or off-line. Handheld online browsing requires
    a wireless modem and an ISP. Handheld off-line browsing requires the user first
    to download the desired Web pages from their respective websites to the handheld
    device itself for later viewing off-line. This process is known as synchronizing
    (or syncing) for the handheld device, and is done by loading the device onto its
    cradle. The cradle is, in turn, connected to the Internet via a desktop computer
    during the sync process. Users of handheld devices often sync them in the morning
    before becoming “mobile” and then browse the Web pages off-line while on the road.
    The sync process can be used to download new Web pages or replace the old content
    of already synced Web pages. The downloaded content is mostly text, because of
    the memory limitations of the handheld devices. Popular content among handheld
    users includes weather forecasts, news (financial, sports, and otherwise), maps
    and driving directions, entertainment, travel data, and restaurant information.'
  merge: -1
