  md: '# Search Techniques


    method may not work all the time, as some search engines are paid to list certain
    websites early in the results set.


    In light of the foregoing information, the reader may ask two questions. How come
    search engines do not always return good hits? the same search using the same
    search string and keywords, produce different hits on different search engines?
    For the first question, search engines should not be the only factor for the failure
    of a search. Other factors include how the authors of Web page design their pages
    and (more importantly) how a surfer formulates a search. If the authors do not
    select the titles and the content of their pages carefully, search engines may
    miss them during a search. In addition, if the surfer is careless or vague in
    defining a search string, search engines will return irrelevant results.


    The answer to the second question stems from the fact that each search engine
    uses its own features to search the Web, and uses the title-frequency method only
    to a degree. First, search engines index more Web pages than other search engines
    and update their index more often. This condition leads to different search engines
    having different databases to search through. A search engine may give preference
    to more popular and heavily visited Web pages over others that are less popular,
    or may prefer Web pages reviewed by its own editors. There are many other features
    that search engines use to make themselves unique. Visit the website http://www.searchengewatch.com
    for more detail.


    # 7.5 Metasearch Engines


    When it comes to building and developing search engines, there are two distinct
    approaches. The typical, straightforward approach is to develop an engine that
    searches the Internet. The other approach, which is less obvious, but very interesting,
    is to build an engine that searches many other search engines at once for every
    search request—that is, performs a multilingual search. Search engines that use
    this latter approach are known as metasearch engines. A metasearch engine, therefore,
    expands an Internet search and makes it more convenient than using multiple search
    engines. If a search engine is down for some reason, the metasearch engine automatically
    skips it. Metasearch engines do not own a database of Web pages; they send strings
    to the databases maintained by other search engines. Examples of metasearch engines
    include http://www.dogpile.com, http://www.metacrawler.com, and http://www.profusion.com.


    # 7.6 Search Techniques


    Most surfers can find satisfactory search results by conducting a basic search
    using any search engine. A basic search implies that a user uses a search string
    in the search field of the search engine. However, most search engines provide
    users with options (search techniques) to refine searches in order to get better
    search results. Users can find these options on the Advanced Search link located
    somewhere on the Web page of the search engine.'
  merge: -1
