    # 1.12 File Compression and Decompression


    Users surfing the Internet find music and video files to download. Multimedia
    files can be very large, making them slow to download. File transfer depends on
    factors such as the speed of the connection transferring the file, the file size,
    and the server traffic. In particular, the file size affects both the transfer
    time and the disk space required to store a file on a computer. File compression
    (encoding) and decompression (decoding) are two techniques that control the size
    of a file. File compression reduces the file size and therefore its downloading
    time. Typically, large files available on server are stored in compressed mode
    in order to speed up their transfer. Users decompress them in order to use them.


    File compression software, such as WinZip, uses complex algorithms to scan a file
    for repeating patterns and redundancy in the data. An algorithm may replace the
    repeating patterns with a code string storing their content and locations more
    efficiently. A repeating pattern could be composed of either characters (in text
    files) or pixels (in image files). For example, consider the following of strings:


    ```

    AAAAAAAAAGGGWZZZZZZ

    ```


    We can compress (encode) this string in a more compact format by writing it


    ```

    10A4G2W5Z

    ```


    where 10A means 10 As, 4G means 4 Gs, and so on.

    As another example, consider the following single-color bit-mapped image:


    ```

    0000000000000000000000000000

    000000000011111111110000000000

    11111111111111110000011111111111

    111111111111111111111111111111

    ```


    This image file can be compressed to 30 0; 10 0, 10 0; 5 1, 13 0, 12

    30 1. Where rows of data are separated by semicolons. The first row of the image
    has 30 0s.

    The second row has 10 0s followed by 10 1s followed by 10 0s, and so on for the
    other rows.


    To view compressed files, a compatible decompression program is required to read
    the

    codes stored and restore the file to its original-state. Typically, the same program
    can perform both

    compression and decompression. For example, we can use the WinZip program tocompress

    (unzip) and compress (zip) files on Windows OS, or we can use a zip command on
    Unix OS.


    Two types of compressed files exist: self-extracting and non-self-extracting.
    A self-extracting zip file has a zip built into it. It has the .exe file extension.
    This file unz'
