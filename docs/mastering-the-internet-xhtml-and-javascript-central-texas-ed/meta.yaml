    #  4.9 Wireless Instant Messaging


    Wireless IMing is available for handheld devices such as mobile phones, PDAs,
    and pocket PCs. AIM, Yahoo! Messenger, and MSN Messenger have versions for handheld
    devices. Another form of messaging on wireless devices is known as short message
    service (SMS). SMS is a service for short messages (between 160 and 224 characters
    long) to mobile phones. SMS is popular in Europe. It is similar to paging, without
    requiring the mobile phone to be on.


    #  4.10 Tutorials


    # 4.10.1 Use Aconyms and Emoticons in AIM (Study Section 4.4)


    This tutorial shows an AIM session that uses acronyms and emoticons.(See the forthcoming
    topmost session capture.) The IMing language illustrated here is quite common
    among buddies. We annotate annotations here that we may follow the session''s
    discussion. The annotations are shown in parentheses on the right. We should mention
    that the annotations are not part of the IMing window. We added them to make it
    easier for the reader to understand the IMing session.


