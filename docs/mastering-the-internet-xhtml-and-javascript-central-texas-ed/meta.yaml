  md: '# 178


    # Chapter 5 • Lists and Newsgroups


    In addition to joining an existing mailing list on a list server, you can create
    a new one. The information required to set up a new list include list name, list
    owner, list description, type of list (moderated or not), type of subscription
    and policy (e.g., open to public), and an initial subscriber list. Once approved
    by the list server, the new list becomes available to people to use.


    Using mailing lists is as simple as using e-mail: You receive messages and you
    respond to them. You can post a reply to a message of an existing thread of a
    discussion on a topic. Or you can start a new topic and a thread. There are etiquette
    rules for using mailing lists, as all responses are posted to all list subscribers.
    Here are some rules: Use a meaningful subject line in your message. Never send
    email without prior permission from the other list subscribers. Use acronyms and
    emoticons lightly. Keep your responses brief. When responding to a message, quote
    part of the message which you are responding to Stick to the discussion thread.
    Be polite in your responses (e.g., don''t write in all uppercase; identify yourself).
    Do not post vague responses such as “Agree”. Avoid flaming people. Finally, do
    not criticize other''s messages and postings.


    # 5.3 Discussion Groups


    A discussion group or forum (also known as a message board) refers to a group
    of people who share a common interest and discuss matters relating to that amongst
    themselves. Discussion groups are either Web or e-mail based. Yahoo! provides
    many Web-based discussion groups. The website to access these groups is http://groups.yahoo.com.
    Figure 5.1 shows the main page for the Yahoo! groups.


