    # 7.3  Open Directory Project


    When users search for information on the Internet using a directory''s search
    engine, the engine ranks its results. Different directories use different techniques
    to develop their ranking systems. For example, Yahoo! and Lycos have made an army
    of paid editors and staff who evaluate websites. Directories are referred to as
    human-powered search engines.


    This approach to ranking systems faces a monumental challenge, dramatically search
    engines should try to do more than just every available page on a given subject.
    One logical solution is to turn the ranking system over users. This is the main
    idea behind a project called the Open Directory Project (http://dmoz.org). The
    project''s website offers its own and many other interesting facts. The project
    started in 1998. The project acknowledges that it is impossible for a search service
    to know about anything. Thus, the project turns to themselves. It'
