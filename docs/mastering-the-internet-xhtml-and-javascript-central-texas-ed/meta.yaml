    ISPs manage and maintain mail servers. An ISP issues each user an email address
    to send mail a username and a password to access or her e-mail account (mailbox).
    Each mail server holds different accounts for different users. ISPs usually provide
    two separate servers in order to handle heavy mail traffic: for one incoming and
