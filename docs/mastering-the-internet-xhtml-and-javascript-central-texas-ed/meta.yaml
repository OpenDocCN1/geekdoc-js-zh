    connect to the server and leave all the messages on it; the user can read them
    online. This type of client must use the IMAP protocol. Clients that use IMAP
    are stand-alone e-mail programs or Web pages. Clients that use POP3 and IMAP are
    stand-alone programs are known as e-mail clients. Clients that are Web pages are
    known as Web-based e-mail. Thus, a user can utilize an e-mail client or Web-based
    e-mail to read and manage e-mail messages. A user can configure an e-mail client
    to use POP3, IMAP, or both.


    There is a difference between using POP3 and using IMAP. POP3 downloads both the
    headers and the bodies of all available messages, at the time that e-mail is checked
    by the incoming mail server. Thus, POP3 is viewed as an e-mail forwarding for
    off-line reading of e-mail. IMAP on the other hand, downloads the headers. The
    bodies of the messages remain on the incoming e-mail server. The user views the
    headers and reads a message body, by clicking the header. Thus, IMAP is viewed
    as an online e-mail reader. Web-based e-mail also requires the user to be online
    in order to read e-mail. E-mail clients that use POP3 can be configured either
    to delete messages or leave them on the incoming e-mail server after downloading
    them. Examples of e-mail clients that use POP3 include Eudora, Outlook, Netscape,
    and Opera. E-mail clients that use IMAP can be configured to download copies of
    messages'' bodies in order to allow off-line reading. Eudora is one example.


    There are pros and cons for each method of reading e-mail. POP3 works best if
    the user always reads e-mail from the same computer and if the user has a dial-up
    connection and pays for connection time. Its con is the unreliability of e-mail
    on other computers. IMAP is the best solution for those who access their e-mail
    via different computers. Web-based e-mail allows a user to read e-mail anytime,
    anywhere. All the user needs a login account (username and password) and a browser.
    It does not require any installation or configuration, as the user accesses the
    account via a Web page. Its con is that the user must be online in order to read
    mail. Moreover, it is not suitable for people who rely on e-mail for business
    and crucial communication that cannot be interrupted by banner ads, advertising,
    and junk mail. To avoid e-mail banners and junk mail, many businesses have Web-based
    e-mail for employees who travel, and a lot of the time, arrangements are made
    that the employees'' access is banned and free. In addition, since the Web-based
    e-mail is just another way of accessing the employees usual business account,
    it doesn''t cause the employee to receive any junk mail.


    Some e-mail programs provide both e-mail clients and Web-based e-mail. Eudora
    is one of them. The page of a Web-based e-mail. Figure 3.4 shows the generic structure
    for each group. In general, an e-mail client provides more menus and buttons for
    performing and managing e-mail activities than Web-based e-mail programs. However,
    the basic functionality is the same. Both groups provide a mailbox structure with
    multiple folders, as well as an address book. An address book is a file or document
    that contains e-mail addresses that can be used in sending e-mail messages. A
    user builds an address book over time by storing e-mail addresses in it. An address
    book saves the time of retyping e-mail addresses.'
