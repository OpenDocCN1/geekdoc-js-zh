  md: '# 1.17.5 Create a PPP Dial-Up Connection in Windows (Study Section 1.14)


    Windows makes creating a dial-up connection transparent to the user. But first
    you need to obtain a PPP account from your service provider. Whether your service
    provider is your employer or an ISP, the provider should set up a PPP account
    for you and furnish you with a phone number, a username, and a password. You need
    this account information to log into the provider''s server and eventually to
    the Internet.


    The actual steps to set up the connection depend on the version of Windows you
    are using. The latest versions require the phone number and the PPP account information
    (name and password). In addition, earlier versions require the user to configure
    the modem (specify its speed) and the server (specify its IP address and enable
    the TCP/IP protocol). Interested readers should check with their service providers.
    Follow this sequence if you use Windows XP: My Computer => Control Panel => Network
    Connections => Create a new connection => Next => Connect to the Internet => Next
    => Set up my connection manually => Next => Using a dial-up modem => Next => Type
    name (this becomes the name of the connection after you create it) => Next =>
    Type the phone number => Next => Type username and password => Finish This procedure
    creates a connection icon and places it under the Dial-up heading in the Network
    Connections folder of the Control Panel. Double-click the icon to connect to the
    Internet.


    # 1.17.6 Create and Use a Screen Capture (Study Section 1.16)


    In this tutorial, we create a screen capture in Windows OS and include it in a
    Word document. Follow these steps:


    +   **Capture the screen.** After you have the desired screen content (e.g., windows
    or an open file), hit the Print key on the keyboard.

    **Paste the screen capture into a Word document.** Open a Word document, Position
    the cursor where you want to paste the screen capture, and select Edit (on the
    Word menu bar) => Paste. You can also paste the screen capture inside a textbox
    to scale it, if required.


    Search the Web for more elaborate screen-capture programs. They allow you to control
    and specify which part of the screen you can capture, such as the active window,
    multiple windows, or a region. These programs also allow elaborate editing such
    as scaling and rotating.


