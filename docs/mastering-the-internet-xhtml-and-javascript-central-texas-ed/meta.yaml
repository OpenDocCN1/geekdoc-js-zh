    via a postal service. The postal service has its network of offices, its hardware
    (mail trucks, cars, sorting machines, etc.), and its distribution system, consisting
    mainly of letter carriers. Similarly, the Internet has its network of computers,
    its hardware (computers, routers, telephone lines, etc.), and its software needed
    to distribute the data (files) from one location to another.'
