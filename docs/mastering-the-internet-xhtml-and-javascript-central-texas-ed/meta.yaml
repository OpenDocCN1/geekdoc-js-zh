  md: 'FAQs


    169


    # FAQs


    # General


    Q:What is ICQ?


    A: ICQ stands for "I seek you." It is an instant messenger, like the others discussed
    in this chapter. It can be used as a client or as a Web-based application. Visit
    http://www.icq.com to learn more.


    Q:What is the difference between a buddy, a friend, and a contact in IM?


    A: Nothing. They all refer to a person with whom you do IMing. Aim, YM, and MSNM
    use the term buddy, friend, and contact, respectively, to refer to that person.


    # AIM (Section 4.4)


    Q:How can I change my chatting profile on AIM?


    A: You need to edit your profile. Click My AIM (menu on the AIM Buddy List Window)
    => Edit Profile => Follow the prompts and fill in the required information.


    Q:Why is my away message not sent though I tried it?


    A: Because it is not enabled. Click this to enable it: My AIM => Edit Options
    => Edit Preferences => Away Message => Select (check) the Auto respond and insert
    in personal profile radio button.


    Q:Can I sign using two different screen names on one computer at the same time?


    A: No, because AIM would not know how to distribute the incoming messages.


    Q:How can I create an away message?


    A: Click this sequence: My AIM (on the Buddy List Window) => Away Message => New
    Message => Type the message in the window that pops up => I''m Away (button on
    the window). This command opens the Default Away message window. This window (see
    screen capture on this page) will show your away message and the messages you
    received while you were away. It also has the I''m Back button, which you should
    click whenever you want to go back.


    ![](bbox=[0.296, 0.753, 0.596, 0.923])'
