    usually referred to as plaintext and its encryption as ciphertext. If we use the
    public key to encrypt it, then we use the private key to decrypt it; that is,
    Pbk(X) produces the encryption and Pvk(Pbk(X)) produces X again. Similarly, Pvk(X)
    is an encryption and Pbk(Pvk(X)) is the corresponding decryption. The following
    insert shows an example, and Figure 2.11 illustrates the process.


