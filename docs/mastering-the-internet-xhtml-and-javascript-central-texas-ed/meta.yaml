    SSL technology uses what is known as the public-and-private key encryption system
    from RSA Data Security, a subsidiary of Security Dynamics. As shown in Figure
    2.11, this system uses two keys. The two keys are generated randomly and in pairs
    that are not interchangeable. The private key is never sent over the Internet;
    the public key. The private key is used to decrypt data that have been encrypted
    by the public key. The private key is known only by its owner. To explain the
    use of these two keys, consider the filling out of a form with a credit card for
    online shopping, as illustrated in Figure 2.12. When the user downloads the Web
    page containing the form from the Web server of the shopping-site, the server
    generates the two keys and sends only the public key with the form. When the user''s
    browser receives the Web page, it checks for a key, finds one, and thereby establishes
    a secure connection. The user fills out the form and sends it. The browser uses
    the public key of the page to encrypt the form''s data and sends it to the server.
    When the server receives the corresponding private key to decrypt the data and
    processes the form.


    Another part of encryption is known as a digital certificate. Digital certificates
    are used for digital signature. A digital certificate is an electronic ID similar
    to a credit card or driver''s license. It is issued by a certification authority
    and identifies the person''s name, the expiration date, public key, and the digital
    signature of the certificate. These certificates are kept in registries, so that
    owners can look up their public keys, like the deed of a house. A digital signature
    is an electronic signature that is needed to sign messages and documents. It is
    not a scan of paper signature.


