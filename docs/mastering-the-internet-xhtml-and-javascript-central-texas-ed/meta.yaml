    # 6.12 Liberty Alliance Project


    The Liberty Alliance Project (LAP) is a collaboration of companies and organizations
    to develop and deploy an open, federated solution to Internet identity. A federated
    identity is a universal for a single sign-on (login). LAP enables consumers and
    businesses to maintain personal information security. It also provides an open
    standard for network identity. It is similar to the .NET Passport service. LAP''s
    website is http://www.projectliberty.org.


    LAP''s specifications focus on interoperability between systems to enable simplified
    sign-on functionality for various services. A user may have multiple accounts,
    for every website offering a service. LAP''s specifications enable the user to
    have sign-on for all these accounts. The functionality outlined in version 1.0
    of the specifications is opt-in linking (users link accounts they have with different
    services), simplified sign-on for linked accounts (signing onto one account provides
    access to all other accounts), authentication context (can limit the access provided
    by one sign-on to a handful of company accounts), global logout (logging out of
    the initial website logs the user out of other websites with live sessions), and
    LAP client feature (users can employ these clients on desktops or wireless devices
    in order to access LAP functionality).


    The specifications define a set of protocols that provides a solution for identity
    federation management, cross-domain authentication, and session management. The
    LAP architecture contains three "actors": principal, identity provider, and service
    provider. This architecture is based on the scenario that a user signs on to buy
    services from a service provider (a website). The principal acts as an agent between
    the identity and service providers. The identity providers supply authentication
    information (username and password) to the principal, who presents the information
    to the service provider. If the service provider accepts the authentication assertion
    from the identity provider, an identity federation is said to exist between the
    two.


    The version 1.1 provides maintenance updates to the 1.0 specifications. Version
    1.1 includes editorial changes to clarify the version 1.0 specifications, as well
    as fixes and enhancements. The version 2.0 specifications will enable organizations
    to share certain personal information of users using the users'' preferences and
    permissions.


    Examples of entities that can benefit from the LAP are plenty. In a business-to-employee
    example, a business can link the various applications employees use to do their
    jobs in order to increase their productivity. It can also link applications on
    its corporate intranet, such as 401K information, health benefits, and travel
    services. This configuration would enable employees to use one username and password
    to access all of the different services. In a business-to-business example, a
    business can access multiple suppliers, partners, and vendors on its extranet
    with the example of a single sign-on. This setup increases operational efficiencies,
    enhances the business'' relationship with suppliers, and reduces IT (information


