    include the body of the message to which you are responding as part of your response.
    This helps the recipient understand your intentions and what you mean when you
    respond for example. "OK, it is fine. I''ll meet you there." If the thread is
    long, the message body will be long, too. E-mail threads are typically several
    exchanges long.


    Files (documents) can be added to e-mail messages. An attachment is some data
    that contains the body of a message, in the form of a file. The MIME protocol
    allows the exchange of any file. When sending it, MIME encodes (converts) the
    file and the message body into a plain-text (only characters and numbers) continuous
    string, so that an e-mail program can send it to its recipient. MIME uses Base64
    to encode messages and their attachments. At the receiving end, MIME decodes the
    plain-text string back into the original file and message body. The recipient
    can save or open the attachment file.


    Attachments pose a security problem. Almost all computer viruses are spread through
    e-mail attachments. Users run malicious programs unintentionally through attachments.
    Thus, users need to be aware of the safety issues associated with attachments.
    The general rule is to be safe rather than sorry. That means that users should
    not open any attachments from unknown sources, no matter how tempting it is.


