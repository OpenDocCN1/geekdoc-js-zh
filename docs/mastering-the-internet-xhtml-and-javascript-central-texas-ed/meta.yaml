- img_proc: false
  md: '# Wireless Browsing


    ![](bbox=[0.287, 0.093, 0.653, 0.335])


    The handheld browsing experience is different from the desktop browsing experience
    because of the small screens and limited memory size of handhelds. Users confined
    to viewing small portion of a Web page often lack the overall context and find
    themselves having to scroll the Web page content extensively. In addition, the
    user has access to only a few Web pages at any given time. Further, the content
    may not be current, depending on when the handheld was last synced. Caching Web
    pages to view them takes up a lot of resources on the handheld.


    There are browsers for off-line and online handheld browsing. Three examples come
    from Microsoft, AvantGo, and Opera. Microsoft offers Pocket IE (PIE). PIE''s a
    compatible version of Microsoft''s desktop IE. PIE runs under Windows CE OS and
    Pocket PC 2002 OS, both from Microsoft. The user employs desktop IE to sync a
    Pocket PC for off-line browsing. Desired Web pages are transferred from IE''s
    favorites to PIE''s favorites during the sync time. PIE has built-in support for
    Microsoft Mobile Channels (popular websites) and AvantGo.


    ![](bbox=[0.313, 0.646, 0.623, 0.917])'
  merge: -1
