  md: '# Web Stalking


    avoid them by routing the traffic through less congested routers. Other sniffers
    can illegitimately capture data being transmitted through the Web.


    Web browsers can sniff out information about their users via JavaScript. For example,
    a website can use JavaScript to find out the user''s browser name and version,
    as well as the OS running it. Sniffing allows websites to send the right version
    of a Web page, depending on whether the user''s browser is IE or Netscape, for
    example.


    Web bugs (beacons) are a form of sniffing. A Web bug is a piece invisible code
    or an invisible file (usually an image file) that is placed on a Web page or in
    an e-message to collect data about Web users (such as the user''s name or IP address)
    and their Web behavior. Web bugs can install files on a user''s computer. An e-mail
    bug sends information back to its source when the user replies to or forwards
    the bugged message. Cookies may be considered a form of Web bugs. However, unlike
    cookies, which a user can decline or accept, as discussed in Section 6.5, Web
    bugs are invisible; their colors are the background colors of the Web pages on
    which they appear. Any tracking and advertising Web companies place bugs in their
    Web pages.


    Security and privacy companies provide Web users with tools to track and find
    Web bugs. They also try to make users aware of these bugs and their potential
    abuse. Some companies equate bugged free to wiretapping.


    Three types of Web bugs can be identified. The simplest bug is an image file that
    uses cookies to send information to third parties about a user. The second is
    an executable that can install a file onto a user''s drive. The third is a script-based
    executable bug that can take a document from a user''s computer or executes a
    file on the server to control the client''s machine.


    Surprisingly, there is a good side of Web bugs. They can be used to track copyright
    violations on the Web and to gather statistics such as the IP address of the computer
    that fetches a Web page. A Web bug can find the URL of the page of another Web
    bug or the URL of a Web bug''s image.


    # 6.7 Web Stalking


    Stalking is harassing. Web stalking takes the form of spamming, flaming, intrusive
    IMing, and trolling people. We covered stalking and flaming in Chapter 3 and intrusive
    IMing in Chapter 4. A troll is someone who posts messages intended to insult and
    provoke. In real stalking, Web stalking comes from unusual people and causes frightening
    psychological problems for the victims.


    Identity plays a key role in Web stalking. Web stalkers usually hide their true
    personalities. For example, a stalker may use an alias-mail address or screen
    name. The disguising of one''s identity on the Web makes it difficult to understand
    and evaluate the interaction with Web stalkers. A stalking victim can identify
    the IP address and the host of the stalker, but it may still take time and effort
    to track the stalker, because stalkers may also be computer hackers hijacking
    IP addresses and hosts.'
