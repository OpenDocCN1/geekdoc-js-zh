  md: '150


    Chapter 4 • Instant Messaging


    ![](bbox=[0.105, 0.103, 0.895, 0.613])


    # # 4.3 Instant Messaging


    Instant messaging (IM or IMing) is a type of chatting and communication service
    that enables one person to create a private chat room with another person. Each
    person creates a list of people (family, friends, colleagues, etc.) with whom
    he or she wishes to interact, known as a contact list or a buddy list. The person
    also maintains this list over time. For two people to communicate, they must include
    each other on their lists and be online at the same time. When a person sends
    a message to a friend, a small window opens up where the person and the friend
    can type messages that both can see. The window is split into two panes. The person
    types the outgoing messages in the bottom pane, and the friend''s (incoming) messages
    are displayed in the top pane. The top pane also displays the outgoing messages.
    Typically, the IM system alerts (via a distinctive sound) whenever someone on
    or her contact list is online, a capability known as presence. Two individuals
    can initiate a chat session by typing (exchanging) messages to (with) each other.'
  merge: -1
  pgno: 191
- img_proc: false
  md: '# Instant Messaging


    # 151


    There is a distinct difference between chat rooms and IM: A chat room typically
    handles two or more people involved in one or more discussions (see the list of
    current users in the screen captures of Example 4.1), while IM almost always involves
    one conversation between two people.


    Like IRC, IM has its networks, clients, and servers. An IM user needs to download
    and install an IM client, create a contacts list on the IM server, and create
    an account on the IM server. The account requires a login identity, including
    a screen name and a password. The contacts list of one user includes the screen
    names of other users. All users are able to communicate and chat because all the
    lists are maintained on the IM server that they use. Several competing systems
    exist, including America Online IM (AIM), Microsoft IM (MSN Messenger), and Yahoo!.
    There are no IM standards that these systems must follow. Thus, two users must
    use the same IM system. One user, for example, cannot utilize AIM and communicate
    with another user who utilizes Yahoo!


    IM allows users to do interesting things while chatting. For example, user can
    record (save) a chat session for future reference. Unlike BBS and IC, users can
    employ graphics, colors, and text formatting in their chat messages. For example,
    the IM emoticons are usually available as facial (smiley) icons that the user
    selects, instead of the text version we covered in Chapter 3. The user can then
    select a facial icon to express his her emotions. The user can also select a color
    and style (bold, underlined, or italic) for a text message. In addition to exchanging
    instant messages, users can perform the following activities on an IM system:


    +   * chat—create their own chat rooms with friends;

    * share Web links—share links to their favorite websites;

    * share images—look at images stored on a friend s computer while IMing;

    * play sounds and music—play music for a friend;

    * share files—exchange files directly with a friend while IMing;

    * talk—use the Internet inside of a phone to talk with friends;

    * receive streaming (real-time) content—receive content such as news and stock
    quotes.


    IM systems are available at two levels: personal and enterprise (corporate). While
    IM is simple, enterprise IM services require control (over which groups should
    use them), management (maintenance, upgrading, and archiving of chat sessions),
    and security (to protect sensitive chats and company secrets). Many IM systems
    are available at both levels. While the personal IM is free, companies pay for
    their IM.


    Enterprise IM is used by many companies. The financial industry is a standout
    example. IM is used routinely by millions of workers to expedite and facilitate
    all kinds of time-sensitive and fast-paced business transactions. These workers
    include employees of securities trading firms, stockbrokers, bank employees, and
    commodity-futures traders.'
  merge: -1
