    # Example 2.9 Understand security levels in Web browsers.


    What are the security levels that browsers can use, and how do we set them up?


    Solution 2.9 SSL provides an encrypted TCP connection between a browser and a
    server. SSL has two versions: SSL 2.0 (developed in 1994) and SSL 3.0 (developed
    in 1996). SSL was succeeded by TLS 1.0 (Transport Layer Security) in 1999. TLS
    1.0 is based on SSL 3.0; it provides improved security because of better cryptographical
    (encryption-decryption) formulas and better methods to generate encryption keys.
    The TLS protocol is the standardization of SSL.


    Major browsers support the three versions SSL 2.0, SSL 3.0, and TLS 1.0. The level
    of security browser depends on the size of the keys used in encryption. The size
    of a key is the number of bits used to represent it. Key sizes range from 40 to
    2048 bits. Commonly used sizes are 40 and 128 bits. The larger the key size, the
    better is the security; and, more bits mean more security. Forty-eight bit is
    known as encryption, while 128-bit is known as strong encryption. It will take
    2^128 to crack a message with as many keys as 40-bit encryption. Most applications
    such as banking are connected with 128-bit encryption.


    Browsers offer their users control over level of security. Just, however, that
    the Web server must support your desired level. You can check the default level
    of security of both IE and Netscape using the Help menu. In IE, click Help =>
    About Internet Explorer. In Netscape, Help => About Communicator. In Opera and
    CB, start with the Help menu and search for “security” or “encryption”. The four
    browsers use a padlock symbol (the Status bar in IE, Netscape, and CB) and the
    URL bar in Opera to indicate the security of Web connections. An open padlock
    means a closed padlock signifies a secure connection. If you double-click on IE''s
    padlock or on Netscape''s padlock, a popup window will display the information
    of the current connection. The four browsers provide you with security options
    shown in the following charts:


    ![](bbox=[0.031, 0.735, 0.908, 0.818])


    Options => Internet Edit => Preferences Options => Security Privacy & Security
    => Preferences => Security Options => Security SSL'
