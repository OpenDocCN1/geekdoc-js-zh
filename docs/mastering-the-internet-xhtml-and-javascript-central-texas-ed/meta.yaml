  md: '# 216


    # Chapter 7 • Searching the Internet


    Keep in mind the following general searching guidelines. Most search engines automatically
    first list Web pages that include all of your search words and then list Web pages
    that include only some of your search words. Search engines are case insensitive.
    Most of the time, a search yields undesirable results because the search string
    is ill formulated. Change the search string, by using different words. Lastly,
    search engines treat your search string as keywords, not as a complete sentence
    as you type (even when you use the exact-phrase search; See Section 7.6.1). Thus,
    you may discard articles such as a, in, the, for, and so forth. For an example,
    the search string travel rome italy is just as good as travel to rome in italy.


    # 7.6.1 Word and Exact-Phrase Searches


    These are the basic searches. Search engines provide various levels to which the
    search can be refined. For example, you can request the search engine to return
    Web pages that match any word in your search string (the widest, but least refined),
    all the words (more refined), or the exact phrase (most refined). The three levels
    of search refinements are usually available on the main Web page of the search
    engine or under its Advanced Search link.


    When you use the exact-phrase search, you are requesting the search engine to
    return only the Web pages that match all the words of your search string, in the
    same order as you type them. You request the exact-phrase search by including
    the search string in quotation marks.


    Usually, the exact-phrase search returns no results (null set), because the odds
    that a Web page has your exact phrase is very slim. For a successful search, we
    recommend starting with a search for any word. Then keep narrowing the search
    down via the all-words search and then the exact-phrase search.


    **Example 7.2** Perform a basic search.


    Find about about sportswear and equipment.


    **Solution 7.2** Let us use the Google search. Open a browser window and type
    http://www.google.com into the URL bar. Type golf sportswear and equipment as
    the search string and hit Enter or click the search button. Google Search | We
    can omit the word and from the search string. As a matter of fact, Google reminds
    you that and is unnecessary. Google returns thousands of hits. It performs a basic
    search using all of words in the search string. It holds all the words of your
    search string in its results. This is Google''s default search technique.


    Let us change the search by looking for any word from the search string. Click
    the Advanced Search link to the next search field where you type a search string.
    Then type golf sportswear and equipment in the third field, as shown in Figure
    7.1, and click the Google Search button.


    As expected, Google returns millions of pages. Note that you must remove and remove
    from the search string, as shown in Figure 7.1; otherwise, Google return no hits
    at all.'
