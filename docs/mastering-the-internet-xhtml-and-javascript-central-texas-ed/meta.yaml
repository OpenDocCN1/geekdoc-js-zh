    # 3.15 Managing E-Mail


    Over time, mailboxes become cluttered with many forgotten messages. As a matter
    of fact, as the size of a mailbox increases, it becomes increasingly slow to access
    e-mail and switch from one e-mail folder to another. In addition, Inbox folders
    usually fill faster than a user can respond to all the messages. Managing e-mail
    is all about dealing with incoming and outgoing messages. Dealing with incoming
    messages includes organizing, responding effectively, deleting, archiving, and
    filtering spam, junk mail, and bulk mail. Dealing with outgoing messages includes
    creating electronic signatures, vCards, signatures (templates), mailing lists,
    aliases, and address books.


    Respond to e-mail. Replying to messages can become hard at busy times. A user
    may label messages according to when to respond to them. We have shown how e-mail
    clients provide label columns for messages.


    Delete e-mail. Highlight a message header and click the Delete button to delete
    the message. To completely remove it, delete the Trash folder, highlight the message
    header again, and click Delete again.


    Archive e-mail. E-mail folders themselves are files with names and extensions.
    Their names we see in e-mail clients and Web e-mail. E-mail programs let users
    import e-mail to from other programs. But generally do not let users export e-mail
    from them. This makes it inconvenient to archive and back up e-mail within an
    e-mail client. The only way to back up e-mail is to manually copy the files of
    e-mail folders to backup media such as CDs or floppy disks, or to another computer.


    Filtering. We are all familiar with junk mail, from either the post office or
    the Internet. We refer to junk mail as spam. Spam is unsolicited e mail on the
    Internet. The sender considers it bulk e-mail to a mailing list. The recipient
    identifies junk mail. Recipients may agree to receive spam when using free Internet
    services. Filtering is a technique that blocks incoming e-mail messages from certain
    domain names. E-mail diverts messages received from these addresses to a special
    Spam folder to avoid cluttering the recipient''s Inbox folder.'
