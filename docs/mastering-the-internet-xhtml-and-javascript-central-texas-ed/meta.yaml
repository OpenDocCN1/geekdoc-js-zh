    # 3.3 Protocols


    Communication between mail clients and servers is accomplished via three protocols:
    SMTP (Simple Mail Transfer Protocol), POP3 (Post Office Protocol version 3), and
    IMAP (Internet Mail Access Protocol).


    SMTP is the protocol used in transferring (sending and receiving) e-mail over
    the Internet. At the sending end, the server uses. However, because of its limited
    ability to queue messages at the receiving end, it is usually used with one of
    the other two protocols: POP3 or IMAP. Either of these two protocols saves the
    user''s e-mail messages in his or her Inbox. Thus, at the receiving end, the incoming
    mail server uses either SMTP and POP3, or SMTP and IMAP.'
  merge: -1
  pgno: 134
- img_proc: false
  md: '# 94


    # Chapter 3 • E-Mail Tools


    The SMTP software collects the user''s mail from the Internet, and POP3 or IMAP
    delivers it to the client to read it. The incoming mail server requires a username
    and a password from the user in order to access the user''s mailbox.


    E-mail clients (also known as mailers or programs) such as Eudora and Outlook
    Express support the three protocols. A user always configures an e-mail client
    to have an SMTP outgoing mail server and a POP3 or IMAP incoming mail server.
    sendmail (http://www.sendmail.org) is the most widely used SMTP server on Unix
    systems. It is free, open-source software. Sendmail.http://www.sendmail.com is
    a commercial version of sendmail that includes SMTP, POP3, and IMAP protocols.
    It has two versions, one for Unix and for Windows.


    What are the POP3 and IMAP protocols? And what is the difference between the two?
    The e-mail client must be configured with the protocol to access as its incoming
    mail server in order to communicate with it. Clients support both the POP3 and
    IMAP protocols. The user may choose one or both during the client configuration
    process. The user may also use multiple incoming mail servers of the same type
    (POP3 or IMAP) or of mixed type (POP3 and IMAP). ISPs control the type of mail
    servers available to the clients, and they set up their users'' mail accounts
    for them.


    The difference between POP3 and IMAP boils down to the ability and desire of the
    user to access e-mail. IMAP allows the user to access e-mail anytime (on any computer),
    POP3 does not. Both IMAP and POP are protocols for receiving and queuing (e-)mail
    on the incoming mail server computer. IMAP allows a user to access e-mail from
    any client computer connected to the Internet. POP3, on the other hand, allows
    the user only to download e-mail messages, from the incoming mail server, to a
    client computer and read them.


    The last e-mail-related protocol is MIME (Multi-Purpose Mail Extensions). In contrast
    to SMTP, POP3, and IMAP protocols, which handle the handling and receive e-mail,
    the MIME protocol is related to plain text. It allows e-mail messages to include
    other types of data than simple text such as colors, formatting (font, style,
    and size), audio, video, graphics, and images. The data can be any type of document
    or file generated by any application program, such as a word-processing file,
    a Powerpoint file, a PDF file, and a database file, to name a few. MIME makes
    an e-mail useful to share files with more than one person wants or needs.


