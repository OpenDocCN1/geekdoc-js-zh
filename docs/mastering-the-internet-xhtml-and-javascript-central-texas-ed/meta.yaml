  md: '# The Pathway to Success in Your College Courses


    # MEMORY TECHNIQUES


    We hope that the information on preparing to study has been helpful, but do you
    feel that your real problem is remembering? Don''t worry. There are ways to help
    you build your memory skills too.


    # Acronym


    +   - An acronym is defined as "a word formed from the initial letters of a name,"
    such as PCS for permanent change of station or SOC for Servicembers Opportunity
    Colleges," or by combining initial letters or parts of a series of words," as
    radar for radio detecting and ranging.

    - Can you think of other acronyms?


    # Mnemonic


    +   - A mnemonic is defined as "a device, such as a formula or rhyme, used as
    an aid in remembering."


    # Examples


    As a child, you might have determined the number of days in a given month


    +   - by reciting the rhyme "Thirty days hath September, April, June, and November
    . . ." or

    - by using your knuckles ("peaks") have 31 days and "valleys" have 30, except
    February, of course.


    If you have studied music, you might have used these techniques for remembering
    the names of the notes:


    +   - FACE represents the names of the notes in the spaces on the staff.

    - The first letters of the words in sentence "Every good boy does fine" represent
    the names of the notes on the lines on the staff.


    A mnemonic used to recall the steps for simplifying algebraic expressions is "Please
    excuse my dear Aunt Sally."


    +   - Perform operations within the innermost parentheses and work outward.'
