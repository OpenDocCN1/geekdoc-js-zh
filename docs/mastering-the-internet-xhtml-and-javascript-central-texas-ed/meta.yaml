    # 2.1 Introduction


    To access the Web, you need an Internet connection and a browser. A Web browser
    is a computer program that displays the content of Web pages. We use browsers
    to view Web pages. A Web page is a document (file) that typically richly formatted
    with fonts, graphics, colors, audio, video, or animation. Browsers originate requests
    that locate and retrieve Web pages from servers every time you click hyperlinks,
    or links for short. A hyperlink is a word or a collection of words that allows
    a user to proceed to, and view the content of, another Web page upon clicking
    the link. A hyperlink in a Web page, acts as a pointer to another Web page. Hyperlinks
    are based on the hypertext context. hypertext is dynamic; it allows a reader of
    a Web page to jump from one page to another, during reading, by clicking on its
    link.


    A Web-page file stores the code (rules) that defines the presentation format of
    the page. A Web browser uses this code to render and display the page. If the
    rendered page is too long to fit in a browser window, the user must scroll it
    up and down in order to view all of its content.'
  merge: -1
