    # 2.12 Plug-Ins


    A plug-in is a program that, after installation, runs within the browser window,
    thus extending the browser''s capabilities. Even though it is a separate program,
    a plug-in appears to be part of the browser. Plug-ins are written by third parties,
    but they are specifically written to an application programming interface (API)
    exposed by the browser software. As such, they can work more transparently with
    the browser and are able to display contents directly inside the browser window.
    Users should be able to install plug-ins easily into their browsers when they
    need them. Adobe Acrobat reader, which displays Portable Document Format (PDF)
    files; Macromedia Shockwave, which plays animation and sound; and Apple Quicktime,
    which also plays text, animation, video, and sound, are among the most popular
    Internet plug-ins.


