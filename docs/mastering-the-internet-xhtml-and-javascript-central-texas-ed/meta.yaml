  md: '# Firewalls


    Firewalls are used to prevent crackers from accessing the computers behind them.
    However, if there is a hole open for a Web server that the public can access,
    crackers will find it and attack the computers. Having a firewall is not an excuse
    to leave the machines behind it insecure.


    Web servers are one of the most dangerous services that a network can offer. A
    Web server gives the entire world access to the inner workings of its file system.
    Many Web administrators are not experienced enough to handle complex security
    issues. Moreover, PC users do not have the knowledge or time to deal with security
    issues. This situation creates a heaven for crackers.


    While system administrators work hard to ensure system security, crackers wait
    for any slip they can find. An administrator''s job should be to create a cracker-resistant
    system, and not a crackerproof one, as the latter renders the system as secure
    as possible, while making provisions such that future crashes cause as little
    damage as possible. An example of such provisions is backing up system data on
    a regular basis, so that if the data is attacked and corrupted, a near-latest
    version can be restored from the backup version. Once a cracker has access to
    a system, he or she can erase data files, sell them to competitors, modify them,
    or use the system''s identity as their own in order to attack other systems.


    # 6.4 Firewalls


    We discussed firewalls in Section 1.13. Firewalls are used for security purposes.
    Firewall software-inspect incoming TCP packets before they are transmitted to
    their final destination. A firewall can implement security rules such as dictating
    which computers can receive files from outside the company. Such computers would
    not have any valuable data files on them, in case crackers break through the firewall.
    Figure 6.1 shows a computer system with a firewall. The firewall keeps the general
    public from accessing the computers behind it.


    Firewalls use at least one of three methods to control traffic flow in and out
    of networks. The packet-filtering method analyzes TCP packets against a set of
    filters, passing only those that pass the filtering criteria. The proxy-server
    method enables the firewall to receive information coming


    ![](bbox=[0.056, 0.737, 0.856, 0.893])


    **Figure 6.1** Secure system with a firewall.'
