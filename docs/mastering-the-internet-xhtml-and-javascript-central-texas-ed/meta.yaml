  md: '# Types of Modems 25


    5. B-ISDN modems. These modems are broadband ISDN modems. (The previously mentioned
    ISDN modems are narrowband ISDN modems.) B-ISDN lines use fiber optics instead
    of twisted-pair copper wires. B-ISDN is much faster than ISDN.


    6. Satellite modems. Satellite-based Internet access uses a satellite to receive
    data at an average speed of 300 Kbps. A satellite Internet connection requires
    a special receiver, a PC adapter card, and special software. Each one of these
    components has a price associated with it, and in addition to a monthly fee. The
    advantage of satellite-based Internet connection is that it allows rural areas
    and the developing world, where phone lines are rare or nonexistent, to access
    the Internet.


    7. Wireless (cellular) modems. Cellular modems are used to connect a laptop computer
    or a cellular phone to the Internet. This capability alleviates the need to plug
    the laptop into a wall socket. Users can check their e-mail while on the road,
    on a boat, in a plane, etc. Wireless modems are slow. While connected, the modem
    may transfer data at a rate of 9600 bits per second over a cellular phone line,
    costing you a lot to check your e-mail, for example. To try to bring the cost,
    the cellular phone companies have developed a replacement for the TCP/IP protocol.
    The new protocol is called CDDP (cellular digital packet). The CDDP packets are
    IP packets encrypted for security purposes. This technique allows cellular phone
    companies to charge customers by packets transferred and not by the number of
    minutes of connection.


