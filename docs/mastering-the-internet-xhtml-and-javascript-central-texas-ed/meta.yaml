  md: '# 80 Chapter 2 \cdot Web Browsers


    Q:How many Web browsers are out there?


    A: There are many Web browsers in existence. This chapter covers the four major
    browsers. Other browsers include ActivatorDesk (http://www.activordesk.com). Beonex
    Communicator (http://www.beonex.com). Nunoby browser (http://www.nuboxy.com).
    Coozilla browser (http://www.coozilla.com). OEM-Browser (http://www.oembrowser.com).
    Phoenix browser (http://www.mozilla.org). PQBrowser (http://www.pqbrowser.com).
    TouchNet Browser (http://www.touchingsoft.com). and Voyager (http://www.qnx.com/products/internet.html).


    Q:How can I copy and paste parts of a Web page''s?


    A: Highlight the text you want to copy. In your browser window, click Edit =>
    Copy (or CTRL + C in Windows). Then click Edit => Paste (or CTRL + V) in the window
    you want to paste. This could be a text editor or word processor.


    Q:How can I copy an image from a Web page?


    A:Right-click somewhere on the image. In the popup menu, click Save Image As or
    its equivalent. You must be aware of the copyright laws when copying images.


    # Finding Web pages (Sections 2.1 and 2.2)


    Q:How can I find people and companies on the Internet?


    A:Use search engines. Try this website: http://www.switchboard.com.


    # Plug-Ins (Section 2.12)


    Q:What is Adobe Reader? When and why do I need it?


    A:Adobe Acrobat Reader is an application written by Adobe that allows you to read
    and display PDF (Portable Document Format) files. The reader displays formats
    with great precision. You can download Acrobat Reader by following the links off
    the main Web page at http://www.adobe.com. The downloaded software is self-extracting
    and installs itself. Whenever the reader is installed, Windows associates the
    PDF file extension to it. Whenever you need to read a PDF file, double-click the
    file, and the reader will open.


    Q:What are the advantages of the PDF format?


    A:The PDF format has two advantages. First, a user can view a PDF file and print
    it out from any computer regardless of the file''s original format (e.g., Word
    document) and regardless of whether the original program that created it (e.g.,
    Word) exists on the computer being used for printing or viewing. Second, PDF documents
    are designed to look and print the same on every combination of computer and printer.
    The Adobe Acrobat software provides powerful features for creating and managing
    PDFs.


    # Internet Explorer (Sections 2.6 and 2.13)


    Q:How can I import or export bookmarks into or from IE?


    A:Follow this sequence: File (menu on menu bar) => Import and Export => Follow
    the prompts.'
