    # ##2.5 Browser Window Structure


    The generic structure of a browser window is shown in Figure 2.5. The structure
    consists of several bars on the top of the window and one bar on the bottom, with
    the display area in between. The **title bar**, at the very top of the window,
    displays the title of the current Web page being viewed. The **menu bar**, located
    directly below the title bar, contains the pull-down menus. Following the menu
    bar are several toolbars, used for navigation, entering URLs, and other activities.
    The bar at the bottom of the window is the **status bar**. This bar displays messages
    to the users informing them about the progress of the current task. For example,
    if the current task is the downloading of a Web page, the browser displays a text
    or other visual message indicating how much of the page has already downloaded
    and how much is remaining.


    The **display area** of the browser window shows the contents of the current Web
    page. If the Web page is too big to fit within the display area, the browser creates
    horizontal or vertical scrollbars automatically, to enable the user to scroll
    its window to view the page.


    ![](bbox=[0.029, 0.796, 0.083, 0.814])


