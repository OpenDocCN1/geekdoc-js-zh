    To open an attachment in any e-mail client or Web e-mail, click on the attachment.
    Some clients,

    as Eudora, ask you if you wish to open the attachment. Once opened, you can save
    it.

    Other clients, such as Netscape, give you the option to open or save the attachment.
    It is rec-

    ommended that you save the attachment locally and check it with a virus scan program
    before

    opening it.'
