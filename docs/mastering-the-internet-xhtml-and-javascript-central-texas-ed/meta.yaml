    # # FAQs


    General


    **Q:**What are the new features of browsers?

    **A:**Browsers'' new features include a faster surfing experience (downloading
    of Web pages as fast as possible), a tabbed interface (to open multiple Web pages
    within one browser window), pop-up filters (to block unwanted pop-ups), skins,
    customized toolbars (to turn them on or off or change their locations within the
    browser window), and the ability to save browsing sessions for future continuation
    and use.


    **Q:**What is Mozilla?

    **A:**Mozilla is an open-source Web browser (the current version is 1.2.1) designed
    for standards compliance, performance, and portability. Open source is a movement
    supported by software engineers and professionals who believe that software should
    be free for all and not sold for profit. Mozilla.org coordinates the development
    and testing of the Mozilla browser by providing discussion forums, software engineering
    tools, releases, and bug tracking. Visit http://www.mozilla.org to learn more.
    Netscape 7.01 is based on Mozilla 1.0.1.'
