  md: '# Blackbox


    # 205


    **Q:** What is data privacy, and how is it different from other privacies?


    **A:** Data privacy relates to information about you such as your name, address,
    age, phone number, bank account, medical records, age, gender, job title, employer,
    income level, social security number, driver''s license number, and habits (eating,
    buying, spending, and others). It is different from other privacy concerns such
    as eavesdropping, wiretapping, snooping, and spying. Data privacy means that a
    website does not share the data with you (that you provide voluntarily) with other
    websites without your permission. Other privacy concerns deal with someone stealing
    information about you secretly and using it without your prior consent.


    **Q:** Is privacy a right, like freedom of speech?


    **A:** Surprisingly no. Privacy is not mentioned in the U.S. Constitution.


    **Q:** How long can a website keep personal data?


    **A:** For as long as it wants. P2P does not set a limit on time. Practically,
    websites should not hold onto the data for too long, as long as the data can become
    obsolete.


    # Sniffing and Web Bugs (Section 6.6)


    **Q:** How do I know if there is a Bug in a Web page I am surfing?


    **A:** Web bugs are usually included in a page as an image file using the `<img>`
    tag. Look at the source code of the web page. If it has an image loaded from a
    different Web server than the rest of the page, then the image is a Web bug.


    # Liberty Alliance Project (Section 6.12)


    **Q:** What is a network identity?


    **A:** It is a set of sign-on information that a user can employ to access different
    accounts with different service providers.


    **Q:** What is a federated network identity?


    **A:** It is a concept that allows consumers and businesses to use separate specialized
    companies to manage different sets of identity information for them.


    # Blackbox


    **Sections 6.1 (Introduction) (Examples 6.1–6.3):** Web security and privacy are
    important for a safe Internet. Damages from security breaches can be substantial.
    Web security includes authentication, authorization, and privacy. Websites usually
    post their privacy policies.


    **Section 6.2 (Fraud):** Credit card fraud and investment scams are popular on
    the Internet. Investment schemes include the pump-and-dump scheme, the pyramid
    scheme, the risk-free fraud, and the offshore fraud. Websites that help and protect
    against fraud include `http://www.ifcfbi.gov`, `http://www.fraud.org`, and `http://www.fraubureau.com`.


    **Sections 6.3 (Crackers):** Crackers usually launch denial-of-service attacks
    on websites, rendering them dysfunctional. Web servers are the most sensitive-service
    service a network can offer. System administrators should focus on making their
    systems cracker resistant, not crackerproof.'
  merge: -1
  pgno: 246
- img_proc: false
  md: 'Section 6.4 (Firewalls): Firewalls implement security rules to protect networks.
    The three methods firewalls use to control traffic flow through them are packet
    filtering, proxy service, and stateful inspection. Firewalls are customizable
    and can protect against unauthorized remote login, crackers, spam, bulk, and viruses.


    Section 6.5 (P3PIExamples 6.4 and 6.5): The P3P protocol simplifies and automates
    users'' acceptances or rejections of cookies in order to help them control their
    privacy over the Internet. Many companies and browsers embraced P3P and cookies
    work together. The current version of P3P is 1.0. P3P uses two types of file policies
    and policy reference files.


    Section 6.6 (Sniffing and Web Bugs): Web-sniffing and web bugs have bad and good
    sides. Cookies may be viewed as a form of Web bugs, executables, and script-based
    bugs.


    Section 6.7 (Web Stalking): Spanning, flaming, and trolling are web stalking.
    Web stalks hide their identities. Be aware of the tips on how to fight web stalking.


    Section 6.8 (Censorship): The Internet is the best medium to fight censorship,
    even though oppressive regimes use many techniques to stop information flow.


    Section 6.9 (TRUSTe): The TRUSTe service (http://www.truste.org) audits and certifies
    websites that meet its strict privacy requirements. Certified websites display
    the TRUSTe-seal on their website. TRUSTe lists its Consumer Protection Guidelines.


    Section 6.10 (EPIC): EPIC performs research and advocacy efforts to promote and
    protect Web and enforce the Freedom of Information Act. It publishes its findings
    in books and reports.


    Section 6.11 (NET Passport): .NET Passport provides one login for use with participating
    Web services. It uses personal information according to its privacy statements.
    The .NET service uses cookies to operate.


    Section 6.12 (Liberty Alliance Project): The LAP concept (http://www.projectliberty.org)
    enables a business or a consumer to define identity with which to sign up and
    use services from multiple websites. The LAP specifications versions 1.0 and 1.1
    define a set of protocols for identity management, cross-domain authentication,
    and session management.


    # Check Your Progress


    At the end of this chapter, you should


    +   - understand Web security and privacy (Section 6.1)

    - know some online resources to protect against Internet fraud (Section 6.2)

    - know what crackers do to networks (Section 6.3)

    - be able to identify the methods that firewalls use (Section 6.4)

    - have mastered the use of P3P and cookies (Section 6.5)

    - understand the concepts of Web sniffing, Web bugs, Web stalking, and censorship
    (Sections 6.6–6.8)'
