  md: '# 6.11 .NET Passport


    Another publication provided by EPIC is Filters and Freedom 2.0: Free Speech Perspectives
    on Internet Content Controls. This book discusses the pros and cons of content
    filtering on the Web. While it is viewed as a technological solution that would
    foster official censorship, content filtering can pose its own significant threats
    to free expression on the Internet. The book also discusses the notion that filtering
    and rating systems can be viewed as a framework that facilitates the suppression
    of speech. The book discusses the recent efforts within the United States and
    the European Union to establish a uniform rating system for online material.


    .NET Passport is a Microsoft service that allows users to make online purchases
    and perform other activities across different participating websites and services,
    with the use of one single login (username and password). The .NET Passport service
    (http://www.passport.net/) also includes .NET wallet and .NET Express purchase.


    The NET recognizes the user''s privacy and the importance of protection of personal
    information. The website publishes the .NET privacy statements for adults and
    children. The statements apply only to the .NET website and its participating
    websites. We describe the collection, use, and disclosure practices by .NET Passport
    of personal information. During registration for a .NET Passport, the user must
    provide personal information in order to create a .NET Passport profile: e-mail
    address, first and last name, country, state or territory, zip code or postal
    code, language, time zone, birth date, and occupation. The .NET Passport and its
    participating websites may require additional personal information during use
    of their websites, such as telephone number for mobile users, and credit number
    and billing and shipping addresses for the .NET Passport wallet.


    Websites associated with .NET Passport require two registrations from the user:
    one for .NET Passport and for the participating website. The website may use two
    registration forms or one. In the latter case, the .NET Passport information is
    identified by a .NET Passport icon, next to each field.


    .NET Passport uses personal information according to its privacy statement. It
    will not sell or rent the information to third parties. It will not share the
    personal information in a manner different from that stipulated by the privacy
    statement without prior consent. However, .NET Passport will use the information
    for maintenance and operation of its accounts. For example, it may send a user
    an e-mail message in order to verify the e-mail address. Or it may send an e-mail
    about periodic services, recommended security updates, or surveys related to the
    .NET Passport service.


    . .NET Passport service uses cookies. If a cookies-disabled browser attempts to
    access the service, an error occurs. .NET Passport uses cookies when a user signs
    into a .NET participating website. A cookie stores a unique identifier, the sign-in
    time, and other file information from participating websites. The cookie is stored
    in an encrypted format on the .NET member''s hard disk. The cookie allows the
    user to move from one page to another within the participating website without
    having to log in again to each page.'
