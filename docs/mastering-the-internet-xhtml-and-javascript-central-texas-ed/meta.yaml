    # 6.1 Introduction


    Web security is a complex, but important, issue encompassing computer and network
    security, authentication services, message validation, cryptography, and personal
    privacy issues. We have already covered some security and privacy issues: firewalls
    (Section 1.13), cryptography (digital keys, SSL, TLS, digital signatures, and
    digital certificates; Section 2.16), e-mail and message validation (s-mail, HTTP,
    and PGP; Section 3.13), and e-viruses (Chapter 3). In this chapter, we focus on
    other security and privacy issues.


    Web security begins at Web servers. There are security risks that affect these
    servers, LANs that host them, and innocent users of Web browsers. Web servers
    continue to be attractive targets for hackers seeking to damage them for a variety
    of reasons, such as personal satisfaction, political motivations, and revenge,
    to name a few. Security damages can range from corrupting and deleting data files
    on Web servers to stealing sensitive and private data, or even performing illegal
    financial transactions. Other damages include denial-of-service attacks, the placement
    of pornographic material, spreading political messages, and the placement of malicious
    software.


    Both users and Web administrators need to worry about the confidentiality of the
    data transmitted across the Web. The TCP/IP protocol was not designed with security
    in mind; hence, it is vulnerable to network sniffing and spying. When confidential
    documents are transmitted from a Web server to a browser, or when a user sends
    private information to a server via a form, someone may be listening in.


    Web privacy is one of three aspects of Web security; the other two are authentication
    of the identity of a person using a system and authorization of the operations
    that the person can do after logging in. Web privacy has to do protecting personal
    information, such as credit card numbers, that are transferred across the Web.
    Many websites use cookies to collect information'
