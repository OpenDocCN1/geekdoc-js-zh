    # ## 2.16 Security


    Security is a major issue in communications, specifically over the Web. Secure
    Web pages and connections prevent unauthorized access to the information passed
    between clients and servers. All e-commerce and online applications that require
    credit card or social security numbers or other personal sensitive information
    must be secure in order to prevent any misuse of the information. Similarly, sensitive
    online discussions of company secrets between departments must be secure.


    Encryption and decryption techniques are commonly used over the Internet to create
    secure connections between Web servers and client computers whenever they are
    needed. Encryption is defined as the process or method (known as a cipher) of
    converting data into a form that is very difficult to understand by hackers if
    they are ever successful in intercepting the data. Decryption is the opposite
    process (known as a decipher); it converts encrypted data back into its original
    form that is understandable by humans. Encryption and decryption can start at
    either the server end or the client end.


    ![](bbox=[0.31, 0.705, 0.735, 0.815])


    Both encryption and decryption use complex computer and mathematical algorithms,
    such as RSA, IDEA, and MD5. Simple encryption algorithms may rotate the letters
    of the data, replace them by numbers, or add frequencies to scramble voice signals.
    More complex encryption algorithms rearrange the bits of the data in digital signals.
    The RSA algorithm uses a key pair: a public key Pbk(k) and a private key Pvk(k).
    Any data encrypted by one key can be'
