    Some of these programs are shareware, while others are freeware. Shareware is
    software that is distributed for free on trial basis for a period of time, usually
    30 days. The user may purchase a copy of the shareware at the end of the trial
    period. Freeware, on the other hand, is software that is offered free, at no cost
    on a permanent basis. Freeware is copyrighted, and you cannot use it in any of
    your software development without permission from its developer.


    The easiest way to generate a screen capture in Windows OS is to use the Print
    Screen key on the keyboard. Simply hit the key. This places the screen capture
