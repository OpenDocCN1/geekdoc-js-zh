    # 1.8 IP Addresses and URLs


    The IP protocol uses a logical scheme to guarantee that a lost or a node in any
    network has a unique address. An IP address is a 32-bit integer composed of four
    8-bit numbers written in base 10 and separated by periods. A bit is a computer
    storage space that holds a binary value of 0 or 1. A byte is an 8-bit storage
    space. Thus, each of the four numbers of an IP address holds a value between 0
    and 255, inclusive (2⁸ = 256 values). An example of an IP address is 155.33.227.141.
    Like a house, an IP address is indexed to one and only one host.


    Names are convenient for machines and computers, but are not for humans. We use
    names to refer to IP addresses. The DNS (domain name system) is a software application
    that converts names to IP addresses, and vice versa, by using a technique called
    reverse lookup. Both Windows and Unix OSs provide the command nslookup, which
    converts a host name to an IP address. Linux uses the dig and host commands, which
    can also do reverse lookup to find the name for an IP address. Tutorial 1.17.2
    provides instruction in use of this command. DNS servers maintain the lookup tables
    of name and address correspondences. For example, if a client request is connected
    to www.neu.edu corresponds to an IP address of 155.33.227.141. For www.neu.edu,
    the DNS server converts this into an IP address, locates the site, and connects
    the client to it. This conversion is sometimes known as DNS resolution. If the
    site is down or there is incorrect, no communication takes place between the client
    and the site, and a communication error is reported.


    The name version of an IP address is a part of what is commonly known as a uniform
    resource locator, or URL. A URL is an address of an accessible file, say a Web
    page, on the Internet. An example of a valid URL is http://www.neu.edu. A URL
    consists of the protocol name to access the file (http for Web pages), the name
    of the server computer that hosts the file (www.neu.edu), and the file name, including
    its directory name (none for www.neu.edu). When no file is specified in the URL,
    a default file name in a default directory is used. The webmaster (the administrator
    in charge of the Web server''s operations) sets the default file name, as index.html
    or index.htm.


    The entire system of assigning and managing IP addresses is managed and controlled
    by national and international organizations. There are companies that sell IP
    addresses around the globe. These companies charge a price and an annual fee to
    maintain an IP address. It is the responsibility of these companies to ensure
    that IP addresses are unique.


