    Send e-mail with priority (importance). As part of sending (replying to or forwarding-)
    message, the user can set its priority to high or low. The default is normal.
    When the user receives an e-mail with a priority, the e-mail tool display its
    priority as low, high, or highest priority.


    Send e-mail with return receipt. The user may request a return receipt, similar
    to return receipts for post office, which acknowledge that the recipient has received
    the message. However, the recipient may refuse to send a return receipt. A return
    receipt is an e-message that is generated and delivered to the sender, stating
