    # 4.2.2 Internet Relay Chat


    An IRC network is a communication system, based on BBS technology, that enables
    forums for discussion and real-time chatting, providing a virtual meeting place
    where people from all over the world can meet and talk. The BBS initially allowed
    users to post only simple text messages. It was limited. IRC began to develop
    in 1988. IRC is very popular today, especially among Unix users. It is also available
    on Windows, MAC, and Linux OSs. The darker side of IRC is that its servers have
    become a heaven for computer hackers with malicious intent.


    There are thousands of IRC servers available for users to connect to. Examples
    include http://www.fenet.org, http://www.undernet.org, and http://irc.org. Any
    search engine will turn up many other IRC servers. A user who wishes to communicate
    with any of these server must download and install an IRC client. mIRC is a simple
    client for Windows and can be downloaded from http://www.mirc.com. Other clients
    include IRCle for MAC (http://www.ircle.com) and irc2 for Unix (http://www.funet.fi/pub/unix/server/).
    The most common default port for IRC servers is 6667. The IRC protocol uses the
    TCP protocol.


    To utilize an IRC network, a user needs an IRC client, an IRC server to connect
    to, and a channel to join. A channel is a chat room. An IRC network typically
    has many users, servers and channels; it is a multiuser multichannel chat system.
    The user can start a new channel or join an existing one. The user also needs
    a login name and password to join a channel, as well as a channel nickname.


    ![](bbox=[0.15, 0.615, 0.865, 0.655])


