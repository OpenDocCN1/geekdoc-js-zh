    # 3.4 Content, Attachments, and Etiquette


    Similar to a paper memorandum (memo), an e-mail message has four parts: a header,
    a body (content), a signature, and attachments. Figure 3.3 shows the structure
    of an e-mail message. The header section includes four headers: From, To, Subject,
    and Date. E-mail programs provide a "compose" window, where the sender can fill
    in the To (recipient''s e-mail address) and Subject (subject line, which usually
    states the reason for sending the message). The program adds the From header (the
    sender''s e-mail address) and the Date header (time stamp, which shows the date
    and time that the message was sent). It also provides a space for the message
    body. After writing the message, the sender sends the message (i.e., his or her
    name after the content) and sends it to the recipient. An email message must have
    at least the TO header filled with the e-mail address of the intended recipient,
    to deliver. If this e-mail is the only information provided, then sending the
    message is equivalent to sending someone a blank piece of paper through the mail.


    An e-mail message is usually short, informal, timely and addresses a single topic.
    It can be a new or a reply to a previous message. It can also be sent to more
    than one recipient. The body of the message can be plain or formatted text. Users
    can insert XHTML to format the body as a Web page. The "compose" window of an
    HTML-enabled program provides formatting menus and buttons similar to those of
    word processors. The program also provides a URL included in a message body. Thus,
    the message''s recipient simply clicks the URL, to view the corresponding Web
    page, instead of copying and pasting it into a browser''s toolbar.


    The body of an e-mail message may contain an e-mail thread. An e-mail thread is
    a sequence of related e-mail messages on a particular topic. The sequence begins
    with a new (first) message. All the other messages in the thread are responses
    to each other. It is recommended to'
