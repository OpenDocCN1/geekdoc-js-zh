  md: '# # The Pathway to Success in / Your College Courses


    Your journey through college can be winding, filled with detours and potholes,
    or it can be relatively straight and smooth. The information below will help you
    have a pleasant experience along the way.


    # ## TIME MANAGEMENT


    > > I am definitely going to take a course on time management ... / just as soon
    as I can work it into my schedule. / Louis E. Boone


    The time you spend preparing to study relates directly to a successful outcome.
    But time, or lack thereof, is a common complaint. How often do you comment that
    you don''t have enough time to accomplish everything you wish to do?


    # ## How Do You Spend Your Time?


    The first step in time management is to see how you currently spend your time.
    Have you ever taken the time to add up all the hours you spend on your regular
    activities? Take a moment to write down everything you do during a seven-day period.
    These questions will help you consider all of the activities you do.


    +   - You may spend 40 hours a week on your job, but what about commute time?

    - You have to fuel your body. How many hours a week do you spend eating?

    - Good grooming is essential. How many hours a week do you spend bathing and dressing?

    - How much time do you give to your friends and family?


    Remember, there are only 168 hours in a week. Is there any time left to sleep?'
  merge: -1
  pgno: 26
- img_proc: false
  md: '# The Pathway to Success in Your College Courses


    # How Can I Make More Time?


    You can''t add hours to the day or days to the week, but if you learn to plan
    your time wisely, you should be able to make better use of the time you have.
    As an added bonus, you should feel less stress. Scheduling your time is a step
    in the right direction.


    # Develop schedules:


    Long term


    +   - Include fixed commitments only

    - Include weekly obligations—job, classes, church, meetings, etc.

    - Plan enough time for study—as a minimum, use two hours for every hour in the
    classroom.

    - Plan for weekly reviews—at least one hour each week for each class.


    Intermediate


    +   - One per week

    - Include major events and amount of work to be accomplished in each subject.

    - Try to study at the same time every day.

    - Make use of free hours between classes.

    - Include non-study activities.


    Short term


    +   - Daily

    - Use small note card you can carry with you.

    - Write specifically what you need to accomplish that day.

    - Mark out each item as it is completed.


    # STUDY ENVIRONMENT


    Where you study and how you study is as important as how often you study.


    +   - Identify a quiet place with a desk or table, a chair, and good lighting.

    - Your bed might be inviting, but remember your goal is to stay awake and concentrate.

    - Although music or some type of background noise might be ok, avoid the TV.

    - It''s too easy to get engrossed in a show rather than your course work.'
  merge: -1
  pgno: 27
- img_proc: false
  md: '# The Pathway to Success in Your College Courses


    +   - Watching CSI can be interesting, but it probably won''t help you with your
    Introduction to Criminal Justice final exam.

    - Make sure you have everything you need: your textbooks, notes, paper and pencil,
    and a clock.

    - Why a clock? To help you manage your time.

    - And, don''t forget to take regular breaks.


    # LEARNING STYLES


    +   - If you are assembling a toy or using a new computer program, do you put
    instructions aside and refer to them only when you run into trouble?

    - Do you have to see a name or address in writing in order to remember it?

    - Do you enjoy audio books, or do you find your mind wandering as you listen?


    Your answers to these questions relate to your preferred learning style, and like
    clothing, one learning style doesn''t fit all. If you have access to the Internet,
    you can take a learning style inventory at http://www.vark-learn.com/english/index.asp
    and then view worksheets at http://www.vark-learn.com/english/page.asp?p=helpsheets
    related to your preferred learning style.


    # Visual Learners


    +   - learn through seeing

    - need to see the teacher''s body language and facial expression to fully understand
    the content of a lesson.

    - tend to prefer sitting at the front of the classroom to avoid visual obstructions
    (e.g. people''s heads).

    - may think in pictures and learn best from visual displays including: diagrams,
    illustrated text books, overhead transparencies, videos, flip charts and hand-outs.

    - During a lecture or classroom discussion, visual learners often prefer to take
    detailed notes to absorb the information.


    If you are a visual learner, here are some suggestions just for you:


    +   - use visual materials such as pictures, charts, maps, graphs, etc.

    - have a clear view of your teachers when they are speaking so you can see their
    body language and facial expression

    - use color to highlight important points in text'
  merge: -1
  pgno: 28
- img_proc: false
  md: '# The Pathway to Success in Your College Courses


    +   * take notes or ask your teacher to provide handouts

    * illustrate your ideas as a picture or brainstorming bubble before writing them
    down

    * write a story and illustrate it

    * use multi-media (e.g. computers, videos, and filmstrips)

    * study in a quiet place away from verbal disturbances

    * read illustrated books

    * visualize information as a picture to aid memorization


    # Aural Learners


    +   * learn through listening

    * learn best through verbal lectures, discussions, talking things through and
    listening to what others have to say.

    * interpret the underlying meanings of speech through listening to tone of voice,
    pitch, speed and other nuances. Written information may have little meaning until
    it is heard.

    * often benefit from reading text aloud and using a tape recorder.


    If you are an aural learner, here are some suggestions just for you:


    +   * participate in class discussions/debates

    * make speeches and presentations

    * use a tape recorder during lectures instead of taking notes

    * read text out aloud

    * create musical jingles to aid memorization

    * create mnemonics to aid memorization

    * discuss your ideas verbally

    * dictate to someone while they write down your thoughts

    * use verbal analogies, and story telling to demonstrate your point


    # Read/Write Learners


    +   * learn through reading and writing

    * learn best by reading and re-reading the textbook and their notes, writing and
    rewriting their notes, and in general, organizing items into lists.'
  merge: -1
  pgno: 29
- img_proc: false
  md: '# The Pathway to Success in Your College Courses


    # Kinesthetic Learners


    +   - learn through moving, doing, and touching

    - learn best through a hands-on approach, actively exploring the physical world
    around them.

    - may find it hard to sit still for long periods and may become distracted by
    their need for activity and exploration.


    If you are a tactile/kinesthetic learner, here are some suggestions just for you:


    +   - take frequent study breaks

    - move around to learn new things (e.g. read while on an exercise bike, mold a
    piece of clay to learn a new concept)

    - work at a standing position

    - chew gum colors to highlight reading material

    - dress up your work space with posters

    - if you wish, listen to music while you study

    - skim through reading material to get a rough idea what it is before settling
    down to read it in detail.


    # Multimodal Learners


    +   - don’t have a single preferred learning style.

    - learn best through combinations.


    If you have multiple preferences, you are in the majority as somewhere between
    fifty and seventy percent of any population seems to fit into that group.


    # READING SKILLS AND STRATEGIES


    Good reading skills are essential to your success in your college-level classes.
    Here are a couple of reasons why:


    +   - In high school, you may have been able to get good grades without reading
    much of the text. Now that you''re in college, professors will expect you to read
    the textbook and they may test you on information not discussed in class but covered
    in the reading. In fact, many professors test on assigned readings as a check
    to make sure students are using their texts.'
  merge: -1
  pgno: 30
- img_proc: false
  md: '# The Pathway to Success in Your College Courses


    +   - The average freshman assigned over 250 pages of reading each week, so clearly
    you''re going to need to keep up with your reading assignments. If you do not
    read during week one, that means that you will need to read 500 pages the next
    week—just to stay caught up! If you choose not to read during the second week
    either... well, you can see how the work can just snowball.


    # Improving Your Reading Skills and Applying Reading Strategies


    A good reader:


    +   - seizures the main ideas.

    - thinks about what the author is saving

    - is active, not passive.

    - concentrates on what is being read.

    - remembers as much as possible.

    - applies what is being read to personal experience.


    Go to http://www.bow-to-study.com/Improving%20Reading%20Skills.htm for more reading
    skills.


    SQ3R is one recommended method for improving your reading comprehension. The letters
    in the name stand for these five steps:


    Survey: Before you read, scan the titles, headings, pictures, and summaries. Consider
    using the heading and subheadings as an outline for notes as you read.


    Question: Ask yourself questions based on Step 1 and look for answers as you complete
    Step 3. For example, if a subheading is titled "Basic Concepts of Reading," change
    it to read, "What are the Basic Concepts of Reading?"


    Read: Read and take notes.


    Recall: Without referring to the book or your notes, think about what you have
    read. If your questions were answered, Could you explain the content to someone
    else? Try putting major concepts in your own words.


    Review: Look at your questions, answers, notes and book to see how well you did
    recall. Observe carefully the points stated incorrectly or omitted. Fix carefully
    in mind the logical sequence of the entire idea, concepts, or problem. Finish
    up with a mental picture of the WHOLE.'
  merge: -1
  pgno: 31
- img_proc: false
  md: '# The Pathway to Success in Your College Courses


    Another method is PQR3, which stands for


    Preview: Preview what you are going to read.


    Question: Question what you are going to learn after the preview.


    Read: Read the assignment.

    ite: Stop every once in a while, look up from the book, and put in your own words
    what you have just read.


    Review: After you have finished, review the main points.


    (Sounds similar to SQ3R, doesn''t it?) Go to http://www.how-to-study.com/pqr.htm
    to learn more about this method.


    There is even a related study method known as M.U.R.D.E.R.


    Mood: Set a positive mood for yourself to study in.

    Understand: Mark any information you don''t understand in a particular unit and
    keep a focus on one unit or a manageable amount of exercise.


    Recall: After studying the unit, stop and put what you have learned into your
    own words.

    Digest: Go back to what you did not understand and reconsider the information.
    Contact external sources (e.g., other books or an instructor) if you still cannot
    understand it.


    Expand: ask three kinds of questions concerning the studied material:


    +   * If I could speak to the author, what questions would I ask or what criticism
    would I offer?

    * How could I apply this material to what I am interested in?

    * How could I make this information interesting and understandable to other students?

    Review: Go over the material you''ve covered. Review what strategies helped you
    understand and/or retain information in the past and apply these to your current
    studies.


    Check this system out at http://www.studysgs.net/murder.htm.


    # NOTE TAKING


    # Why take notes?


    +   * It triggers basic lecturing processes and helps you to remember information.

    * It helps you to concentrate in class.'
  merge: -1
  pgno: 32
- img_proc: false
  md: '# The Pathway to Success in Your College Courses


    +   - It helps you prepare for tests.

    - Your notes are often a source of valuable clues for what information the instructor
    thinks most important (i.e., what will show up on the next test).

    - Your notes often contain information that cannot be found else-where (i.e.,
    in your textbook).


    Evaluate your present note-taking system. Ask yourself:


    +   - Did I use complete phrases or sentences that mean something to me later?

    - Did I use any form at all?

    - Are my notes clear or confusing?

    - Did I capture main points and all subpoints?

    - Did I streamline using abbreviations and shortcuts?


    If you answered “no” to any of these questions, you may need to develop some new
    note-taking skills!


    # Guidelines for Taking Notes


    +   - Concentrate on the lecture or on the reading material.

    - Take notes consistently.

    - Take notes selectively.


    +   - Do NOT try to write down every word.

    - Remember that the average lecturer speaks approximately 125-140 words per minute,
    and the average note-taker writes at a rate of about 25 words per minute.

    - Translate ideas into your own words.

    - Organize notes into some sort of logical form.

    - Be brief. Write down only the major points and important information.

    - Write legibly. Notes are useless if you cannot read them later!

    - Don’t be concerned with spelling and grammar.


    There are many reasons for taking lecture notes.


    +   - Making yourself take notes forces you to listen carefully and thus your
    understanding of the material.

    - When you are reviewing, notes provide a gauge to what is important in the text.

    - Personal notes are usually easier to remember than the text.'
  merge: -1
