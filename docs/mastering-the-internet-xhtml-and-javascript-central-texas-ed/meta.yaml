  md: '# Text-Only Web Chatting


    # 4.2 Text-Only Web Chatting


    Web chatting among multiple users is also known as online keyboard chatting. Chatting
    (talking) is the exchange of typed-in messages among two or more users who are
    all on the Internet at the same time. It requires a chat server, which acts as
    the repository for the messages. While public chatting is common, a private chat
    can be arranged between two parties as well. Secure chatting is also available
    and is used for real-time business communication. Most chats are focused on one
    topic of interest. Famous people are sometimes invited to join chats in order
    to increase their popularity. Chats can be ongoing or scheduled at set times.
    Transcripts of chats may be archived for future use.


    ![](bbox=[0.313, 0.335, 0.633, 0.473])


    Web chatting, like traditional chatting, spans virtually any aspect of human endeavor
    and interest. There exist general, kid, teen, movie, food, life, and religion
    chats, to name a few. Chat servers are organized into chat rooms, with one room
    per topic. A chat room is a chat server or part of a chat server that provides
    a venue for users with a common interest to communicate in real time. Users join
    a chat room by registering. By entering a username and a password, a user logs
    into a chat room. A chat room usually has a list of its current users, and it
    alerts the users if another person enters the room. Any user in the chat room
    can type a message into a text box, and other users can respond. Messages are
    broadcast immediately to every user in the chat room. Chatting has its own etiquette,
    such as introducing oneself when entering a room, being polite, being clear on
    whether one is asking a question or responding to a specific user, and not being
    disruptive.


    ![](bbox=[0.333, 0.765, 0.573, 0.923])'
  merge: -1
  pgno: 188
- img_proc: false
  md: '# 148


    Scrolling and lurking are two issues related to chatting. Scrolling is monopolizing
    and disabling a conversation by repeatedly typing the same message or phrase.
    Scrolling is against chatting protocol. Lurking is a silent participant in a chat,
    by just reading messages. A user who is lurking does not take an active part in
    the discussion. Lurking is an accepted practice. There are often lurkers in any
    chat room, and new people to a particular chat are sometimes advised to lur until
    they become familiar with the discussion.


    # 4.2.1 Bulletin Board System


    Two chatting systems exist: the bulletin board system (BBS; also known as message
    boards) and Internet chat (IRC). We cover IRC in Section 4.2.2. The BBS, the older
    of two, was created in 1978. A BBS is a computer application dedicated to exchanging
    messages and files on a network. The BBS was the primary kind of online communication
    throughout the 1980s. Today''s BBS systems are Web based, replacing the text-based
    user interface of the 1980s. A Web-based BBS is essentially a website that is
    powered by BBS software rather than a Web server.


    In the mid-1990s, membership to BBS began to decrease as the graphics-oriented
    Web burst onto and grabbed users attention. BBS systems are free to use. A user
    needs an account to log in. The screen shown Figure 4.1 show a session of of Web-based
    BBS. You have joined. The system shows a list of the current users on the right.
    It also informs current of users who have joined and who logged off. The system
    messages show that Figure 4.1 shows you. You have joined.


    ***Doomer has joined. ***Deuce has quit (QUIT:brb.). ***Deuce has joined, and
    ***DigitalMan*** is now known as ***DigitalMan*** has food.


    ![](bbox=[0.105, 0.565, 0.895, 0.805])


    Figure 4.1 A Web-based bulletin board system.'
