  md: '# The Browsers


    # 2.4 The Browsers


    Microsoft Internet Explorer (IE) is the major browser that Internet users employ
    to navigate the Web. Netscape Communicator comes in a distant second to IE. Both
    browsers offer similar functionality. Their windows look and feel similar. However,
    there have been debates and studies about the comparative performance, speed,
    and ease of use of these two browsers.


    Downloading and installing a browser software is a straightforward process. Visit
    http://www.microsoft.com to download IE software. Look for the Downloads link
    and then follow the prompts. The version we copy in this chapter is IE 6.0. Double-click
    the downloaded file and follow the prompts to install IE on your computer.


    Visit http://www.netscape.com to download Netscape Communicator. Look for the
    Downloads link and then follow the prompts. Double-click the downloaded file and
    follow to install Communicator on your computer. Netscape is based on the Mozilla
    browser of the Mozilla Foundation (http://www.mozilla.org). Netscape has two distinct
    products: Netscape 4.8 and Netscape 7.1. Netscape 4.8 is the older product. It
    does not support XML (Extensible Markup Language). XML is the metanguage of which
    XHTML is based. Netscape 7.1 is the newer. The newer Netscape product originated
    with version 6.0 and supports multiple. Some of the Netscape browser prefer the
    older Netscape 4 product. We cover both Netscape 4.8 and 7.1. You can download
    Netscape 4.8 from the Netscape FTP servers at ftp://ftp.netscape.com/pub/communicator/english/4.8.
    Netscape''s Downloads link directs the user to Netscape 7.01.


    Figures 2.2–2.4 illustrate the two browsers'' windows. The structure of each window
    and the use of each module are covered in detail throughout this chapter. While
    IE has only one module, Communicator consists of five modules: Navigator, Inbox,
    Newsgroups. Figure 2.3 shows icons for the file modules. The Navigator is the
    browser window, which is shown in Figure 2.3. The Inbox and Newsgroups modules
    enable users to access their e-mail and news messages, respectively. Users may
    employ the Address Book, and Composer. Figure 2.3 shows icons for the file modules.
    The Composer is the Netscape XHTML editor that is used to develop web pages. This
    chapter covers the details of the Navigator module.


    Netscape 4.8 provides a Component that is docked at the bottom right corner of
    the browser window, as shown in Figure 2.3. The bar has five icons for access
    to the five modules. Clicking any of these icons opens the corresponding module.
    If, for example, you use Netscape as your e-mail tool, the Inbox icon will open
    the e-mail window. Moving the mouse over each icon displays the user''s name.
    You can expand the Component by clicking the bars at its left edge (as pointed
    out in Figure 2.3) and can move the bar by dragging its title to the desired location.
    The expanded Component can be dragged "docked" back at the bottom right corner
    by clicking the Close box (x). If the user right-clicks on the title bar, a popup
    menu is displayed, as shown in Figure 2.3. The display of the bar can be changed
    by choosing any of the menu items. The expanded bar can be displayed horizontally
    or vertically.'
