    decrypting its attachments, if any. The two available protocols are S/MIME and
    PGP/MIME. The difference between the two is in the use of different formats and
    algorithms to encrypt and decrypt s-mail''s content and digital certificates.
    S/MIME (secure MIME) was originally developed by RSA Data Security. Each PGP/MIME
    is based on PGP, which was developed by individuals. PGP (Pretty Good Privacy)
    is a protocol used to encrypt and decrypt s-mail over the Internet. It can also
    be used to send digital signatures.


