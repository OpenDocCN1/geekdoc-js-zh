    # 7.6.2 Boolean Search


    A Boolean (also known as math or symbol) search provides users with control over
    how a search uses the engines of a search string. There are four operators: AND,
    OR, NOT, and NEAR. The AND operator requires that all search words be present
    in the search results, similar to the all-words search described in Section 7.6—e.g.,
    *cats AND dogs*. The OR operator requires that at least one search word be present,
    similar to the any-words search described in Section 7.6.2—e.g., *cats OR dogs*.
    The NOT operator is a negation (exclusion) operator. For example, *dogs and breed
    NOT food* returns Web pages that do NOT contain food, but contain both dogs and
    breed. The NEAR (proximity) operator is used to specify that words should appear
    close to each other—e.g., *cats NEAR dogs*. Search engines provide forms that
    users can use for simple Booleansearches.'
