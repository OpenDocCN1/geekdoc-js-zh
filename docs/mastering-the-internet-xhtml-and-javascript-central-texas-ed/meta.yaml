  md: '# Connecting to the Internet


    Organizations, such as companies and universities, and individuals need an Internet
    service provider (ISP) in order to connect to the Internet. Organizations connect
    their networks to one of the ISP networks. Individuals typically connect their
    computers at home to an ISP network. Individuals who own more than one computer
    at home can connect them first before connecting to an ISP network.


