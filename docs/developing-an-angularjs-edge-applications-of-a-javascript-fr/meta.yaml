  md: "# # The Provider\n\nUse a provider if you need to configure a service before\
    \ it runs. This is the only reason you'd ever use a provider, because they are\
    \ the most complex of the three to use. For example, it's common to want to use\
    \ `$httpProvider` to set up default headers before the $http service is instantiated.\n\
    \n![](img/f95c537c2fc9346a21a144b89cfac580_93_0.png)\n\nBut what mainly brings\
    \ us here is the fact that you cannot do this:\n\n```\nsome_module.service('SomeService',\
    \ function() {\n    this.someMethod = function() { … };\n});\n```\n\n```\nsome_module.config(function(SomeService)\
    \ {\n    // do something with SomeService\n});\n```\n\n**SomeService** has not\
    \ yet been instantiated and it simply doesn't exist. But you CAN do this:\n\n\
    ```\nfunction SomeProvider() {\n    // some setup code goes here\n    this.last_name\
    \ = 'Hiller';\n\n    // required method $get; acts as factory or service\n   \
    \ this.$get = function() {\n        var that = this;\n        return {\n     \
    \       someMethod: function() { return that.first_name + ' ' + that.last_name\
    \ }\n        };\n    };\n}\n```\n\n```\nsome_module.provider('SomeProvider', SomeProvider)\n\
    ```\n\n```\n// YES, it tacks \"Provider\" on to the end of any provider you create.\n\
    some_module.config(function(SomeProviderProvider) {\n    SomeProviderProvider.first_name\
    \ = 'Chris';\n});\n```"
  merge: -1
  pgno: 93
- img_proc: true
  md: "```\n// run() just runs arbitrary code immediately after bootstrapping\nsome_module.run(function(SomeProvider)\
    \ {\n    SomeProvider.someMethod(); // returns 'Chris'\n});\n```\n\nAnd some unit\
    \ tests showing this works:\n\n```\ndescribe('SomeProvider', function () {\n \
    \   it('should be injectable', inject(function (SomeProvider) {\n        expect(SomeProvider).not.toBeUndefined();\n\
    \    }));\n    it('should return configured name from someMethod', inject(function\
    \ (SomeProvider) {\n        expect(SomeProvider.someMethod()).toBe('Chris Hiller');\n\
    \    }));\n    it('should provide a provider', function () {\n        module(function\
    \ (SomeProviderProvider) {\n            expect(SomeProviderProvider.last_name).toBe('Hiller');\n\
    \        });\n    });\n});\n```\n\nThe $get() function is required; it is called\
    \ to retrieve the SomeProvider service _after_ config() has been called. When\
    \ using the provider as a provider, if you have a provider named \"Foo\", you\
    \ will inject \"FooProvider\", which is automatically created for you. It's like\
    \ two services in one! Note that you cannot inject SomeProviderProvider into anything\
    \ after bootstrapping has finished. This means you must only use your provider\
    \ (\"FooProvider\") in the config() function, before the services have initialized.\n\
    \nA real-world example of a useful provider would be a generic \"dialog\" or \"\
    pop-up\" provider (\"Dialog\" or \"DialogProvider\"), which you could configure\
    \ during the config() stage to use any number of different implementations. For\
    \ example, you may want to tell \"DialogProvider\" to use jQuery UI, or Bootstrap,\
    \ or some hand-rolled thing. That way, each module or application using the provider\
    \ (living in some common module) will be able to declare what implementation to\
    \ use, and the service (\"Dialog\") will act accordingly. You should probably\
    \ even allow this service to be configurable on-the-fly if, for some reason, you\
    \ need to use a Bootstrap modal here and a jQuery UI dialog there (ew).\n\n![](img/f95c537c2fc9346a21a144b89cfac580_94_0.png)"
