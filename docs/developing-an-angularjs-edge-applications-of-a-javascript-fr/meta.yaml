  md: '# Routing


    It''s often desirable to have the hash portion of a URL direct the user to a particular
    view. AngularJS provides a service for this called `$route`. During the `config()`
    phase, you can configure `$routeProvider` to point to the correct view when coupled
    with the `ngview` directive. Furthermore, you can pass data through the URL and
    retrieve it using the `$routeParams` service.


    Be careful when using named anchor tags and the `$route` service. They both use
    the "hash" portion of the URL to do different things. The `$route` service will
    take precedence over any fragment intended to hit a named anchor—if you have a
    route called "foo" and an anchor named "foo", AngularJS will attempt to execute
    the route when visiting http://your.com/#foo.


    # Can I use more than one ngView directive at once?


    *No. ngView can only be included once per HTML page. If you are switching views
    when using the `$route` service, plan ahead for the best place to use ngView which
    will include the proper templates. Watch for this functionality in the future.*'
