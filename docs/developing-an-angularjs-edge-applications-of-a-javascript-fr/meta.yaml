    expect(resolved).toBeTruthy();\n});\n});\n```\n\nA couple things to note:\n\n\
    We’re using a promise here for one reason only: we might have to reach out over\
    \ HTTP and fetch our template as a partial. If we do that, we need to be able\
    \ to execute code in an asynchronous manner, because of course the fetch is going\
    \ to be asynchronous. So, if we wanted to, we could place this template in a file\
    \ called about.html and specified the path to that file as the second parameter\
    \ to `Modal()`. When we wanted to open the modal, we’d use the `$http` service\
    \ to fetch it and display it when it was received. When the promise resolves,\
    \ we know exactly when that modal got opened.\n\nThe first parameter to `Modal()`\
    \ is a Scope. We’re not really using it here, but we could be. Say we wanted to\
    \ do `$scope.name = ‘John Jacob Jingleheimer Schmidt’;` somewhere in `ContentCtrl`.\
    \ When we compile our modal’s template, that scope is available to us, so we could\
    \ easily plop `{{name}}` in there.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_132_0.png)\n\
    \nThis is just one way to handle The Modal Problem, and you may not like this\
    \ solution as much as simply using markup and programatically flipping a switch\
    \ when you want the modal to be open or shut.\n\n## AngularJS and Other 3rd Party\
    \ Apps\n\nIt's possible to use just about any 3rd party library out there with\
    \ AngularJS — with a little effort. I see D3 (http://d3js.org) and Socket.IO (http://socket.io)\
    \ mentioned often, so let's take a look at how we can use those with AngularJS.\n\
    \n### D3\n\nD3 is a popular data visualization library. While the intricacies\
    \ of D3 and its usage are beyond the scope of this book, we can take a simple\
    \ D3 demo and Angularize it. Note that my D3-fu is weak.\n\nFirst, here's the\
    \ HTML and CSS we're going to use.\n\n```html\n<div ng-controller=\"MyCtrl\">\n\
    \  <div class=\"chart\" bar-chart=\"data\"></div>\n  <button ng-click=\"randomize()\"\
    >randomize!</button>\n</div>\n<script src=\"http://d3js.org/d3.v2.js\"></script>\n\
    ```\n\nHere is the D3 example CSS:\n\n```css\n.chart div {\n  font: 10px sans-serif;\n\
    \  background-color: steelblue;\n  text-align: right;\n  padding: 3px;\n  margin:\
    \ 1px;\n  color: white;\n}\n```\n\nNext, the JavaScript involved:\n\n```javascript\n\
    var myApp = angular.module('myApp', []);\n\n// provides some data and a randomize\
    \ function\nmyApp.controller('MyCtrl', function($scope) {\n  $scope.data = [1,\
    \ 2, 4, 8, 16, 32];\n\n  // randomizes the order of the $scope.data array.\n \
    \ $scope.randomize = function () {\n    var i = $scope.data.length,\n        tempi,\
    \ tempj;\n    while (--i) {\n      var j = Math.floor(Math.random() * (i + 1));\n\
    \      tempi = $scope.data[i];\n      tempj = $scope.data[j];\n      $scope.data[i]\
    \ = tempj;\n      $scope.data[j] = tempi;\n    }\n  };\n});\n\n// puts a D3 div-based\
    \ bar chart on a tag, and updates it\n// as the model changes.\nmyApp.directive('barChart',\
    \ function () {\n  return function (scope, elm, attrs) {\n    var data = scope.$eval(attrs.barChart);\n\
    \n    // handy-dandy width function\n    function width(d) {\n      return d *\
    \ 10 + 'px';\n    }\n\n    // grab our element and put some divs in it of varying\
    \ sizes\n    // depending on the data. yes, there are probably sexier ways to\
    \ do this.\n    d3.select(elm[0])\n      .selectAll('div')\n      .data(data)\n\
    \      .enter()\n      .append('div')\n      .style('width', width)\n      .text(angular.identity);\n\
    \n    // watch the data and update the divs within the element with their\n  \
    \  // new widths.\n    scope.$watch(attrs.barChart, function (new_val, old_val)\
    \ {\n        if (new_val !== old_val) {\n            d3.select(elm[0])\n     \
    \           .selectAll('div')\n                .data(new_val)\n              \
    \  .style('width', width);\n        }\n    }, true);\n  };\n});\n```\n\nThat wasn't\
    \ so bad, was it? Add some transition effects and SVG and you'll be updating your\
