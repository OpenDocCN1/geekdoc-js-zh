  md: "# Unit Testing $http\n\nYou don't want your unit tests making `$http` calls\
    \ unless you are writing functional/E2E tests, which we are not. The authors have\
    \ provided a nice module to help you with this called ngMock. Include the angular-mocks.js\
    \ file in your tests, and everything will get set up automatically.\n\nLet's test\
    \ our Posts service. We need to tell the mock `$httpBackend` service to expect\
    \ a call to `$http`, what the call should return, and finally to flush all the\
    \ requests. It looks like this:\n\n```\ndescribe('Blog Services', function ()\
    \ {\n    var Posts, httpBackend;\n\n    beforeEach(inject(function ($injector,\
    \ $httpBackend) {\n        Posts = $injector.get('Posts');\n        httpBackend\
    \ = $httpBackend;\n    }));\n\n    describe('Posts', function () {\n        it('should\
    \ initiate the http call', function () {\n            var promise;\n         \
    \   httpBackend.expectGET('data.json').respond('foo');\n            promise =\
    \ Posts.getPosts();\n            expect(angular.isFunction(promise.then)).toBeTruthy();\n\
    \            promise.success(function (data) {\n                expect(data).toBe('foo');\n\
    \            });\n            promise.then(function (res) {\n                expect(res.data).toBe('foo');\n\
    \                expect(res.status).toBe(200);\n                expect(res.config).toEqual({\n\
    \                    method: 'GET',\n                    url: 'data.json'\n  \
    \              });\n                expect(angular.isFunction(res.headers)).toBeTruthy();\n\
    \            });\n            httpBackend.flush();\n        });\n    });\n});\n\
    ```\n\nFor fun, we tested the success and then methods of our promise object returned\
    \ by the `$http` call, but we only really care about the data coming out of the\
    \ request (which is \"foo\" in both cases).\n\nThere are expectFOO methods supplied\
    \ for every HTTP request type. Note that these functions are *expectations*; if\
    \ the call does not get made by the code, the expectation will fail, an exception\
    \ will be thrown, and your test will not pass. If, for some reason, a request\
    \ may be made, use the when method: `httpBackend.whenGET('data.json').respond('foo')`.\
    \ If a request is made, this will handle it, but if a request is not made, no\
    \ exception is thrown. Typically you will want to use the expect methods when\
    \ writing unit tests, but if you are writing functional/E2E tests, then you will\
    \ want to use the when methods, since checking if a request completed is beyond\
    \ the scope of a functional test.\n\nBut wait, there's more. You may need to unit\
    \ test code that calls code that uses `$http`! Here's an example unit test that\
    \ asserts the controller calls `Posts.getPosts()`:\n\n```\nit('should call Posts.getPosts()\
    \ and execute a function upon resolving', function() {\n    inject(function(Posts,\
    \ Post, $q) {\n        var dfrd = $q.defer(),\n            success_spy = jasmine.createSpy('success').andReturn([]);\n\
    \        angular.extend(dfrd.promise, {\n            success: success_spy\n  \
    \      });\n        spyOn(Posts, 'getPosts').andReturn(dfrd.promise);\n      \
    \  $controller('ContentCtrl', {$scope: scope, Posts: Posts,\n            Post:\
    \ Post, $routeParams: {}});\n        expect(Posts.getPosts).toHaveBeenCalled();\n\
    \        expect(dfrd.promise.success).toHaveBeenCalled();\n    });\n});\n```"
  merge: -1
  pgno: 106
