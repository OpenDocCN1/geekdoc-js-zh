    \     // assume we have no jQuery.\n      angular.element(elm.children()[0]).bind('click',\
    \ function() {\n        scope.$apply('open = !open');\n      });\n    }\n  };\n\
    });\n```\n\nThe template of this directive has another two directives in it: `ngShow`\
    \ and `ngTransclude`. That's how you include one directive in another. If you\
    \ need to share functionality between directives, you can specify a controller\
    \ that multiple directives can use—and they can even use this controller to talk\
    \ to each other.\n\n# ## Reusable Directives\n\nContinuing our discussion from\
    \ earlier about widgets—if you want to write a reusable directive, there are some\
    \ steps you should take. The first step is making sure you don't pollute any scopes.\
    \ Here's an example of a directive that pollutes the scope:\n\n```\nmyApp.directive('badDirectiveIsBad',\
    \ function() {\n  return function(scope, elm, attrs) {\n    scope.foo = scope.$eval(attrs.badDirectiveIsBad);\n\
    \  };\n});\n```\n\nThis is bad because we took `<div bad-directive-is-bad=\"'bar'\"\
    />` and polluted the current scope with the foo model. If we have some controller\
    \ in play, that controller's scope will now have foo in it, and any scope descending\
    \ from that scope. Furthermore, if foo was a model in the scope, you have just\
    \ blasted it away. Obviously this can be the source of bugs. We can avoid this.\n\
    \nWe avoid this by having our directive create its *own* scope. Well—that solves\
    \ the problem of polluting the current scope, but not the parent scope. To avoid\
    \ that problem, we create an *isolate* scope. An isolate scope differs from a\
    \ normal scope in that it does not prototypically inherit from its parent. You\
    \ can throw anything in an isolate scope without worry of it polluting any other\
    \ scope.\n\nThe salient option is the scope property of the object returned by\
    \ your directive. Set it, and you have an isolate scope. Here's a marginally useful\
    \ example of a directive safely using"
  - "[PAGE 82]\n\nan isolate scope, which we can add to our blog code:\n\n```\n//\
    \ Debug directive helps you debug a little more nicely than normal.\n// This could\
