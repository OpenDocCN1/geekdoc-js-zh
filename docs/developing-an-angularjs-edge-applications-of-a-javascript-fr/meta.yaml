  md: 'are trying to `console.log($posts[0].title)` and you get a `TypeError`.

    You may have put together the connection that anything in your controller assigned
    to `$scope.foo` is available in the view as simply `foo`. This holds true for
    *any* member of the `$scope`, including objects, arrays, primitives and functions.
    You will never have to refer to `$scope` in the view, because it is implied, and
    will correspond to the scope of the nearest controller (as defined by the ng-controller
    directive) or directive if that directive affects the scope.'
