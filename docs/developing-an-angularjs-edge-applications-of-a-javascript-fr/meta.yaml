  md: '# # The View


    What''s a view? It''s the presentation layer. It''s your markup (typically HTML).
    It''s what the user sees. It is declarative—not imperative—it doesn''t have control
    flow, per se. When you are ready to implement an AngularJS application, I recommend
    implementing the view first, and working backwards from there. Write directives
    that don''t work, but use them how you would want—write the *directives* later.
    Call functions in the scope and reference models that don''t exist—then write
    the *controllers* later. Because the view is so descriptive, it can essentially
    provide a blueprint for your actual code.


    You need to set some custom attributes—or more precisely, directives—to get your
    AngularJS application up and running.


    +   - `ng-app` on `<html>` tag: This is AngularJS'' way of automatically *bootstrapping*
    the application. This `ng-app` call in particular initializes the blog module,
    and makes that the main module for the application.


    > **TIP Bootstrapping**


    *If you need to execute some code before AngularJS loads, you can skip putting
    ng-app in your view, and instead use `angular.bootstrap()` when ready.*


    +   - `ng-controller` on `<body>` tag: This directive tells AngularJS to initialize
    the controller named `MainCtrl` and make it responsible for handling the *scope*
    under the `<body>` tag, inclusive.

    - Stuff in `{{curly braces}}`: For now, you want to understand that the stuff
    in double curly braces corresponds to AngularJS expressions, which in this case
    correspond to models, and those models are in the scope of our controller, `MainCtrl`.
    Curly braces mean, "evaluate this expression and output it as a string". If you
    are familiar with client-side templating languages and/or MVC frameworks, it''s
    just some data coming out of a controller.Pipe (|) syntax: The pipe syntax in
    the reference to `posts[0].date` is a *filter*. The filter is the date filter,
    built-in to AngularJS. This filter takes the argument, `posts[0].date`, and applies
    a transformation against it. `posts[0].date`, in this case, is a JavaScript `Date`
    object. The `Date` object is transformed into a string. `short` is a shortcut
    for a "short date", which is a preconfigured format in the filter. This filter
    also allows you to output a Date object in basically any format you choose.


    Next, we''ll need some place to stuff our JavaScript. What follows includes an
    example of a model, controller, service and directive. Create `blog.js`:'
  merge: -1
