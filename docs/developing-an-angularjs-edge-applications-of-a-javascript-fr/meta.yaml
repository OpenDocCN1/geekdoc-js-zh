    \ is `<debug-zone>`.\n\n## Common functionality between directives\n\nIf you have\
    \ similar directives, it may be a good idea to reuse functions. For example, two\
    \ directives with a common link method, or two directives putting the same function\
    \ into their scopes. The best way I've found to deal with this is to simply create\
    \ a service or factory and share the functions by good old dependency injection.\n\
    \nThe purpose of putting `<debug-zone>` around these two is to allow them to both\
    \ use the same instance of a controller. The linking functions in both, obviously\
    \ violating DRY (don't repeat yourself) principles, simply grab some functions\
    \ out of the directive controller and put them into the scope, so the directives'\
    \ templates can use them (we could avoid needing to do this by putting the debug\
    \ and toggle functions into the injected `$scope` and not using isolate scopes,\
    \ but let's keep it this way for sake of example).\n\nSince these two directives\
    \ share one instance of the controller, what happens is any interaction with that\
    \ controller by either template can cause the other to change its behavior. In\
    \ practice, this means when you click the \"toggle\" button on either directive,\
    \ it closes both of the directives, because they share the same \"minimized\"\
    \ flag!\n\nYou could likely simulate this type of behavior by throwing functions\
    \ into parent scopes and calling them from within scope member directives, but\
    \ in large applications it can become crucial to limit the amount of information\
    \ in the scope—especially if you are nesting a lot of controllers. This technique\
    \ allows directives to interact without having to put anything at all in the scope\
    \ hierarchy.\n\n## Compilation vs. Linking\n\nSometimes you will want to specify\
    \ a compile function instead of a link function. You will supply one but not both.\
    \ If you supply a compile function you will be expected to return a linking function\
    \ from this.\n\nWhat's the difference? In simplest terms, compilation does not\
    \ have a scope, and happens before linking does. If you do not need a scope in\
    \ your directive, then use a compile function; this will be faster. If you need\
    \ to modify a template for whatever reason, use a compile function. But, 9 times\
    \ out of 10 you will want to use link, because you probably care about what's\
    \ going on in the scope.\n\n## Conclusion\n\nA detailed explanation of the difference\
    \ between compilation and linking is available in the AngularJS developer's guide.\n\
    \nDue to the godlike power of directives, their use comes at a cost. It's not\
    \ the world's steepest learning curve, but do kick yourself in the face if you\
    \ can't figure it out on the first pass. Read other directives, like those supplied\
    \ by the Angular-UI project (http://angular-ui.github.com); see how they work.\
    \ Play around with them on Plunker (http://plnkr.co) or JSFiddle (http://jsfiddle.net).\
    \ And when you have harnessed the thunder, release your work for other developers.\
    \ Chances are you will have written a directive somebody else could use.\n\nNext\
    \ you will learn about services, factories and providers.\n\n## Chapter 7. Services,\
    \ Factories and Providers\n\nServices, providers, and factories are all just fancy\
    \ ways of saying \"library\". A broad description of a library would be some collection\
    \ of behavior that is reusable across multiple codebases. Services provide this\
    \ by acting as an instantiated, singleton object, likely full of many instance\
    \ methods. Factories can provide a new object every time, perhaps full of functions,\
    \ or perhaps just a single function, or even object. Providers act much like factories,\
    \ but they are configurable before AngularJS hits its \"run\" phase.\n\nControllers,\
    \ filters, directives etc., can all use these via DI (dependency injection). You\
    \ can share functions, models, singleton objects, classes (or just about anything)\
    \ between disparate components. These controllers, filters, and directives can\
    \ be considered the codebases your libraries provide behavior to.\n\nYou must\
    \ understand the differences between services, factories, and providers. You must\
    \ also understand when to use them. Here's a table to oversimplify the situation:\n\
    \n| Component | Instantiated | Needs a $get method | Explicitly returns something\
    \ | Present during config() |\n|-----------|-------------|---------------------|------------------------------|------------------------|\n\
    | Service   | Yes         | No                  | No                         \
    \  | No                     |\n| Factory   | No          | No                \
    \  | Yes                          | No                     |\n| Provider  | Yes\
    \         | Yes                 | No                           | Yes         \
    \           |\n\nOur blog could also use a service, Posts, to handle our data.\
    \ Here it is:\n\n```\n// Define our first service; Posts\n// This service simply\
    \ uses the built-in $http service to retrieve data from\n// a static JSON store.\n\
    blog.service('Posts', function ($http) {\n    this.getPosts = function () {\n\
    \        return $http.get('data.json');\n    };\n});\n```\n\nWithin the Posts\
    \ service, there's a `getPosts()` method which returns a promise from an $http\
    \ call. We could have just put the $http call within the controller itself, but\
    \ it's good practice to put potentially reusable code into a service, since controllers\
    \ cannot talk to one another unless they share the same scope. Now, any controller\
    \ that injects Posts into itself can use the method here; we don't have to write\
    \ separate $http calls.\n\nSo note, $http itself is a service. It's built in to\
    \ AngularJS, and is one of a number of prerolled services for common functionality.\
    \ We will discuss Ajax further in a bit.\n\n## TIP Why Doesn't $http Work With\
    \ My PHP/Ruby/Python/Java/etc. Backend?\n\nI don't know. I can tell you, though,\
    \ that $http does not care about what backend it talks to and treats them all\
    \ the same, so if you are having problems using $http when migrating from say,\
    \ a PHP server to a Python server, the problem is not within AngularJS. The nice\
    \ folks on Freenode's #python can help you. Just don't ask to ask. My first guess\
    \ would be to check your headers and make sure your server is getting what it\
    \ expects.\n\nHere's what the three look like:\n\n```\n// Service\nsome_module.service('SomeService',\
    \ function() {\n  this.someMethod = function() { ... };\n});\n\n// Factory\nsome_module.factory('SomeFactory',\
    \ function() {\n  return {\n    someMethod: function() { ... }\n  };\n});\n\n\
    // Provider\nsome_module.provider('SomeProvider', function() {\n  // some setup\
    \ here\n\n  // required method $get; acts as factory\n  this.$get = function()\
    \ {\n    return {\n      someMethod: function() { ... }\n    };\n  };\n});\n```\n\
    \n## When To Use a Service?\n\nServices are singletons. That is to say, you only\
    \ get one, ever. Every time you inject a service into your controller or wherever,\
    \ you get the same object. In my experience, I try to use a service *first*, then\
    \ consider the other two. The reason being is that a service simply takes up less\
    \ memory and processing power than the others. It is also probably the most dead-simple\
    \ to write since you can stuff everything into the service's this and don't have\
    \ to return anything. Think of the service as a constructor function that gets\
    \ called only once, and the resulting object can be used just about anywhere.\n\
    \n## When To Use a Factory?\n\nWhen what you want to provide is not an object—perhaps\
    \ it's just a function, or a class definition—use a factory. If you want to have\
    \ new objects each time they are injected, you would not use a service. Say you\
    \ had a filter-like function that you wanted to provide to your controllers, but\
    \ you know you'd never use it in a view, and you don't want to murk up some namespace\
    \ by declaring it outside of AngularJS' context. Factories to the rescue!\n\n\
    ```\nvar someFunction = function() { ... };\n// becomes...\n\nsome_module.factory('someFunction',\
    \ function() { // injectable too!\n    return function() { ... };\n});\n```\n\n\
    I find this pattern to be extremely handy, and it keeps my namespaces pristine.\
    \ Don't make that global function!!! Put it in a factory. Here's a simple example\
    \ of creating and using a class, which we'll use in our blog. This class will\
    \ describe a blog post; a Post object. We'll need to define our factory, then\
    \ update our controller to use it:\n\n```\n// returns a class Post which represents\
    \ a blog post\nblog.factory('Post', function () {\n\n    // set date, author,\
    \ and temporary title and body\n    // date can be a Date object or a JS timestamp\
    \ or anything else Date objects accept\n    var Post = function (title, body,\
    \ date, author, autosave) {\n        this.date = new Date(date);\n        this.author\
    \ = author;\n        if (autosave) {\n            this.title = title;\n      \
    \      this.body = body;\n            this.temp = {};\n        } else {\n    \
    \        this.temp = {title: title, body: body};\n        }\n    };\n\n    //\
    \ update the date to NOW\n    Post.prototype.updateDate = function () {\n    \
    \    this.date = new Date(); // js Date object\n    };\n\n    // save the temp\
    \ info to the real info, then update the date to now.\n    Post.prototype.save\
    \ = function () {\n        this.title = this.temp.title;\n        this.body =\
    \ this.temp.body;\n        this.updateDate();\n        this.stopEditing();\n \
    \   };\n\n    // prepares this post for editing\n    Post.prototype.beginEditing\
    \ = function () {\n        this.editing = true;\n        this.temp.title = this.title;\n\
    \        this.temp.body = this.body;\n    };\n\n    // takes the post out of 'editing'\
    \ mode\n    Post.prototype.stopEditing = function () {\n        this.editing =\
    \ false;\n        this.temp = {};\n    };\n\n    // handiness to convert this\
    \ Post to a string, for debugging purposes\n    Post.prototype.toString = function()\
    \ {\n        return angular.toJson(this);\n    };\n    return Post;\n});\n```\n\
    \nIn this Post pseudoclass, we've created a constructor that will set up our object.\
    \ We"
  mdcn: "\n查看父级作用域；这恰好对应于父级标签，即 `<debug-zone>`。\n\n## 指令之间的通用功能\n\n如果你有类似的指令，复用函数可能是一个好主意。例如，两个指令拥有共同的链接方法，或者两个指令将同一个函数放入它们的作用域中。我发现处理这种情况最好的方法就是简单地创建一个服务（service）或工厂（factory），并利用传统的依赖注入来共享这些函数。\n\
    \n将 `<debug-zone>` 包围在这两者之外的目的是为了让它们能够使用同一个控制器的实例。两者中的链接函数显然违反了 DRY（不要重复 yourself）原则，它们只是简单地从指令控制器中抓取一些函数并放入作用域中，以便指令的模板可以使用它们（我们可以通过将\
    \ debug 和 toggle 函数放入注入的 `$scope` 中且不使用隔离作用域来避免这样做，但为了示例起见，我们保持现状）。\n\n由于这两个指令共享同一个控制器实例，结果就是任何一个模板对该控制器的交互都可能导致另一个模板改变其行为。在实践中，这意味着当你点击任何一个指令上的“toggle”按钮时，它会同时关闭这两个指令，因为它们共享同一个“minimized”标志！\n\
    \n你可能可以通过将函数抛入父级作用域并在作用域成员指令内部调用它们来模拟这种行为，但在大型应用程序中，限制作用域中的信息量至关重要——尤其是当你嵌套了大量控制器时。这种技术允许指令在无需在作用域层级中放置任何内容的情况下进行交互。\n\
    \n## 编译（Compilation）与 链接（Linking）\n\n有时你会希望指定一个编译函数而不是链接函数。你只能提供其中之一。如果你提供了编译函数，则需要从中返回一个链接函数。\n\
    \n区别是什么？简单来说，编译没有作用域，并且发生在链接之前。如果你的指令不需要作用域，请使用编译函数；这样速度会更快。如果你因为某种原因需要修改模板，请使用编译函数。但是，在\
    \ 90% 的情况下，你会希望使用链接（link），因为你可能关心作用域中发生的事情。\n\n## 结语\n\n关于编译和链接之间区别的详细解释，可以在 AngularJS\
    \ 开发者指南中找到。\n\n由于指令拥有近乎神一般的力量，其使用是有代价的。虽然它不是世界上最陡的学习曲线，但如果你在第一遍尝试时没能搞明白，也请对自己狠一点。阅读其他指令，例如\
    \ Angular-UI 项目 (http://angular-ui.github.com) 提供的指令；看看它们是如何工作的。在 Plunker (http://plnkr.co)\
    \ 或 JSFiddle (http://jsfiddle.net) 上尝试运行它们。当你掌握了这种力量后，将你的作品分享给其他开发者。很有可能你写了一个别人也能用得上的指令。\n\
    \n接下来你将学习关于服务（services）、工厂（factories）和提供者（providers）的内容。\n\n## 第 7 章 服务、工厂和提供者\n\
    \n服务、提供者和工厂都只是“库”的各种花哨说法。对库的一个宽泛描述是：一组可在多个代码库之间复用的行为集合。服务通过充当一个实例化后的单例对象（通常包含许多实例方法）来提供这种能力。工厂每次可以提供一个新对象，可能充满了函数，或者只是一个单一函数，甚至是一个对象。提供者的行为非常像工厂，但它们在\
    \ AngularJS 进入“run”阶段之前是可配置的。\n\n控制器、过滤器、指令等都可以通过 DI（依赖注入）来使用这些功能。你可以在不同的组件之间共享函数、模型、单例对象、类（或几乎任何东西）。这些控制器、过滤器和指令可以被认为是你的库提供行为的目标代码库。\n\
    \n你必须理解服务、工厂和提供者之间的区别。你还必须理解何时使用它们。下面是一个过度简化情况的表格：\n\n| 组件 | 实例化 | 需要 $get 方法\
    \ | 显式返回内容 | 在 config() 期间存在 |\n|-----------|-------------|---------------------|------------------------------|------------------------|\n\
    | Service   | 是         | 否                  | 否                           | 否\
    \                     |\n| Factory   | 否         | 否                  | 是    \
    \                      | 否                     |\n| Provider  | 是         | 是\
    \                 | 否                           | 是                    |\n\n我们的博客也可以使用一个名为\
    \ `Posts` 的服务来处理数据。它在这里：\n\n```\n// 定义我们的第一个服务：Posts\n// 此服务简单地使用内置的 $http 服务从\n\
    // 静态 JSON 存储中检索数据。\nblog.service('Posts', function ($http) {\n    this.getPosts\
    \ = function () {\n        return $http.get('data.json');\n    };\n});\n```\n\n\
    在 `Posts` 服务中，有一个 `getPosts()` 方法，它返回一个来自 `$http` 调用的 promise。我们本可以直接将 `$http`\
    \ 调用放在控制器本身中，但将潜在可复用的代码放入服务中是良好的实践，因为控制器之间除非共享同一个作用域，否则无法相互通信。现在，任何将 `Posts` 注入自身的控制器都可以使用这里的方法；我们不需要编写单独的\
    \ `$http` 调用。\n\n请注意，`$http` 本身就是一个服务。它是 AngularJS 内置的，是许多用于通用功能的预制服务之一。我们稍后将进一步讨论\
    \ Ajax。\n\n## 提示：为什么 $http 在我的 PHP/Ruby/Python/Java/等后端上不起作用？\n\n我不知道。不过我可以告诉你，`$http`\
    \ 不关心它与哪个后端通信，并将它们一视同仁。因此，如果你在从 PHP 服务器迁移到 Python 服务器时使用 `$http` 遇到问题，问题不在于 AngularJS。Freenode\
    \ 的 #python 频道上的好心人们可以帮你。只要不要用“请求询问是否可以询问”这种方式。我的第一个猜测是检查你的请求头，并确保你的服务器接收到了它期望的内容。\n\
    \n以下是这三者的样子：\n\n```\n// Service\nsome_module.service('SomeService', function()\
    \ {\n  this.someMethod = function() { ... };\n});\n\n// Factory\nsome_module.factory('SomeFactory',\
    \ function() {\n  return {\n    someMethod: function() { ... }\n  };\n});\n\n\
    // Provider\nsome_module.provider('SomeProvider', function() {\n  // some setup\
    \ here\n\n  // required method $get; acts as factory\n  this.$get = function()\
    \ {\n    return {\n      someMethod: function() { ... }\n    };\n  };\n});\n```\n\
    \n## 何时使用服务（Service）？\n\n服务是单例。也就是说，你永远只能得到一个。每次你将服务注入到控制器或任何地方时，你得到的都是同一个对象。根据我的经验，我会尝试*首先*使用服务，然后再考虑另外两种。原因是服务比其他两种占用更少的内存和处理能力。它可能也是最简单易写的一种，因为你可以将所有内容塞进服务的\
    \ `this` 中，而不需要返回任何东西。把服务想象成一个只被调用一次的构造函数，而产生的对象几乎可以在任何地方使用。\n\n## 何时使用工厂（Factory）？\n\
    \n当你想要提供的内容不是一个对象——也许只是一个函数或一个类定义——时，请使用工厂。如果你希望每次注入时都获得新对象，你就不能使用服务。假设你有一个类似过滤器的函数想要提供给控制器，但你知道你永远不会在视图中使用它，而且你不想通过在\
    \ AngularJS 上下文之外声明它而弄脏某个命名空间。工厂来救场了！\n\n```\nvar someFunction = function() {\
    \ ... };\n// 变为...\n\nsome_module.factory('someFunction', function() { // 同样可注入！\n\
    \    return function() { ... };\n});\n```\n\n我发现这种模式极其方便，而且能保持我的命名空间纯净。不要创建那个全局函数！！！把它放在工厂里。这是一个创建和使用类的简单示例，我们将把它用于我们的博客。这个类将描述一篇博客文章：一个\
    \ `Post` 对象。我们需要定义工厂，然后更新控制器来使用它：\n\n```\n// 返回一个表示博客文章的 Post 类\nblog.factory('Post',\
    \ function () {\n\n    // 设置日期、作者以及临时标题和正文\n    // date 可以是一个 Date 对象、JS 时间戳或\
    \ Date 对象接受的任何其他内容\n    var Post = function (title, body, date, author, autosave)\
    \ {\n        this.date = new Date(date);\n        this.author = author;\n    \
    \    if (autosave) {\n            this.title = title;\n            this.body =\
    \ body;\n            this.temp = {};\n        } else {\n            this.temp\
    \ = {title: title, body: body};\n        }\n    };\n\n    // 将日期更新为 “现在”\n   \
    \ Post.prototype.updateDate = function () {\n        this.date = new Date(); //\
    \ js Date 对象\n    };\n\n    // 将临时信息保存到正式信息中，然后将日期更新为现在。\n    Post.prototype.save\
    \ = function () {\n        this.title = this.temp.title;\n        this.body =\
    \ this.temp.body;\n        this.updateDate();\n        this.stopEditing();\n \
    \   };\n\n    // 为此文章准备编辑状态\n    Post.prototype.beginEditing = function () {\n\
    \        this.editing = true;\n        this.temp.title = this.title;\n       \
    \ this.temp.body = this.body;\n    };\n\n    // 将文章从“编辑”模式中移出\n    Post.prototype.stopEditing\
    \ = function () {\n        this.editing = false;\n        this.temp = {};\n  \
    \  };\n\n    // 为了调试目的，方便地将此 Post 转换为字符串\n    Post.prototype.toString = function()\
    \ {\n        return angular.toJson(this);\n    };\n    return Post;\n});\n```\n\
    \n在这个 `Post` 伪类中，我们创建了一个将设置我们对象的构造函数。我们\n"
