  md: '# # Chapter 2. AngularJS Core Concepts


    AngularJS is a framework made of components. Different components are different
    tools for different problems. If you are familiar with MVC (model-view-controller)
    frameworks of any type, the distinction between these components will likely make
    a lot of sense to you. If you are new to MVC, consider it a way to separate an
    application into presentation, logic and data layers. In addition, MVC provides
    loose coupling between these layers that allow layers to be swappable. For example,
    you may have written an entire app in AngularJS, but you want it displayed differently
    for mobile—just provide a new view; there is no need to write an entirely new
    application.


    The core components are as follows:


    +   - Models (this is your data)

    - Controllers (business and some presentation logic)

    - Views (presentation)

    - Services/factories/providers (kind of like libraries)

    - Filters (easy data structure processing in the view)

    - Directives (markup which runs code that modifies the DOM)'
