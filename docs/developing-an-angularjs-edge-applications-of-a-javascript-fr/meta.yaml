    will be writing the blog posts. Comment system? Probably better to not use this
    directive.


    # What''s this bold-click thing?


    It''s a custom directive. We''ll cover that later.'
  - '[PAGE 44]


    # # Other Special Variables


    We also have access to this special object in the view:


    +   - `$event` — Object containing AngularJS event information.


    ## Event Bubbling


    If you have an `ngClick` on a node, and another `ngClick` on the parent node,
    chances are any click on that child node will trigger both events.


    For example:


    ```

    <div ng-click="foo()">foo

    <div ng-click="bar()">bar</div>

    </div>

    ```


    If you don’t want `foo()` to get triggered, try this instead:


    ```

    <div ng-click="foo()">foo

    <div ng-click="bar(); $event.stopPropagation()">bar</div>

    </div>

    ```


    ## $event is just a jQuery/jqLite Event object after all


    You can pass `$event` to any function you are calling on your Scope, and that
    function can inspect the `$event` object for further information. Resist the temptation
    to use this to get at the target DOM node and start fiddling around with it. You
    will want to do DOM manipulation in directives or rarely services/factories. Controllers
    are for business logic. A reasonable use of the `$event` object is to inspect
    keystrokes, for example, and take different actions within the controller based
    on what key was pressed.


    ## Why Can’t I Use JavaScript Function X() In My View?


    AngularJS expressions are *not* JavaScript. They may look and smell like JavaScript,
    but they are not JavaScript. You cannot execute arbitrary JavaScript from an AngularJS
    expression, and you can’t use certain operators such as `===`. Things like `Math.sqrt()`
    are not available. If you want that stuff, put it in the scope: `$scope.sqrt =
    Math.sqrt`; now you can use the `sqrt()` function in your view via the reference
    you just created.'
  - "[PAGE 45]\n\nEvery Scope has a reference to a `$parent` scope (except the root\
    \ scope or `$rootScope`) and a `$root` scope. You can use these in your view.\
    \ But Scope objects prototypically inherit from their parents, so generally you\
    \ will not need to use these unless you have, say, a model with the same name\
    \ as a parent Scope pointing to a different object:\n\n![](img/f95c537c2fc9346a21a144b89cfac580_45_0.png)\n\
    \nHere we have controllers with models in them:\n\n```\nsome_module.controller('MyCtrl',\
    \ ['$scope', function ($scope) {\n    $scope.foo = 'bar';\n}]);\nsome_module.controller('MyOtherCtrl',\
    \ ['$scope', function ($scope) {\n    $scope.foo = 'baz';\n}]);\n```\n\nAnd the\
    \ corresponding view:\n\n```\n<div ng-controller=\"MyCtrl\">\n    <p>{{foo}} (displays\
    \ \"bar\")</p>\n    <div ng-controller=\"MyOtherCtrl\">\n        <p>{{foo}} (displays\
    \ \"baz\")</p>\n        <p>{{$parent.foo}} (displays \"bar\")</p>\n    </div>\n\
    </div>\n```\n\nYou can avoid needing to do this by simply not reusing variable\
    \ names within a Scope hierarchy. Generally speaking, referring to objects using\
    \ `$parent` is not necessary. If you are using primitives, you may have to use\
    \ `$parent` to get what you want. In our example, anything put in the `$scope`\
    \ object of `MyCtrl` will also be in the `$scope` object of `MyOtherCtrl` unless\
    \ you override it.\n\nNext, we'll discuss form controls—widgets in which users\
    \ interact with your application."
- md: "## Controls\n\nLet’s look at the controls.\n\n### Making a Button Click Do\
    \ Something\n\nYou probably have some markup already, and it looks like this:\n\
    \n```\n<button>Alert My Name</button>\n```\n\nTo make a click on this button do\
    \ something, you will use the `ngClick` directive. In order to do something, you\
    \ must supply the `ngClick` directive with an AngularJS expression. Typically\
    \ this will be a function, like so:\n\n```\n<button ng-click=\"myAlert()\">Alert\
    \ My Name</button>\n```\n\nOr you may even be able to get away with assignment\
    \ in the markup, depending on what you wish to do:\n\n```\n<button ng-click=\"\
    name = 'Chris'\">My Name Is Now Chris</button>\n```\n\nBut, of course, this is\
    \ not a complete AngularJS application. This is, however, and will actually work:\n\
    \n### Using Anchor (`<a>`) Tags\n\nYou probably will be using `<a>` tags somewhere\
    \ in your application, and they probably don’t do what the `<a>` tag was originally\
    \ intended to do. Instead, they execute some JavaScript function. My recommendation\
    \ is to write your anchor tags this way:\n\n```\n<a ng-click=\"doSomethingHeinous()\"\
    >Click me</a>\n```\n\nNote the lack of an `href` attribute. You do not need `#`\
    \ or `javascript:` or some such nonsense. This is on purpose; AngularJS has its\
    \ own directive, and this directive will automatically prevent the default action\
    \ an anchor tag is supposed to take if the `href` is missing.\n\nBut, if you did\
    \ want to use the `<a>` tag in the way it was intended, you may want to do something\
    \ like dynamically generate a URL. This will not work:\n\n```\n<a href=\"http://essentialvinegars.com/?id={{id}}\"\
    >Buy Smelly Vinegar</a>\n```\n\nIf the user clicks this link before AngularJS\
    \ has processed the template fully, they will wind up at that URL as you have\
    \ written it verbatim. You should use the `ngHref` directive instead:\n\n```\n\
    <a ng-href=\"http://essentialvinegars.com/?id={{id}}\">Buy Smelly Vinegar</a>\n\
    ```\n\nAngularJS will sit on the `<a>` tag and it will do nothing until the contents\
    \ of `ngHref` are parsed.\n\n## Checkboxes\n\n**TIP** What if I have a table,\
    \ and each row has a checkbox, and we want to know which rows are \"checked\"\
    ?\n\n*KnockoutJS provides behavior like this, but AngularJS is different. If you\
    \ want to do something like this, you will want a custom directive. If it is important\
    \ that the order of the selected rows is preserved, then you will most definitely\
    \ want a custom directive!*\n\nThis example directive should help you:\n\n```javascript\n\
    myApp.directive('checkboxArray', function($parse) {\n    return {\n        require:\
    \ 'ngModel',\n        link: function(scope, elm, attrs, ngModel) {\n         \
    \   var value = scope.$eval(attrs.checkboxArray);\n                // the thing\
    \ we will put in our array specified by ngModel\n                array = $parse(attrs.ngModel);\
    \ // getter/setter for ngModel\n                // if we have not defined the\
    \ ngModel, let's assign an empty array to it\n                // otherwise we\
    \ may run into problems getting the length of an undefined object\n          \
    \  if (angular.isUndefined(array(scope))) {\n                array.assign(scope,\
    \ []);\n            }\n            // when the checkbox is clicked, execute this\n\
    \            elm.bind('change', function() {\n                var arrayValues\
    \ = array(scope),\n                    // get the actual array out of the scope\n\
    \                    i = arrayValues.length;\n                if (elm.attr('checked'))\
    \ {\n                    // if we wound up checked, push the thing onto the array\
    \ specified by ngModel\n                    arrayValues.push(value);\n       \
    \             // need to apply since this is a jQuery event\n                \
    \    scope.$apply(function() {\n                        ngModel.$setViewValue(true);\
    \ // checkbox will want to be true/false\n                        array.assign(scope,\
    \ arrayValues); // update the scope\n                    });\n               \
    \ } else {\n                    // find the object in our array and remove it\n\
    \                    while (i--) {\n                        if (arrayValues[i]\
    \ === value) {\n                            arrayValues.splice(i, 1);\n      \
    \                      scope.$apply(function() {\n                           \
    \     ngModel.$setViewValue(false);\n                                array.assign(scope,\
    \ arrayValues);\n                            });\n                           \
    \ return;\n                        }\n                    }\n                }\n\
    \            });\n            // this little gem will watch the array specified\
    \ in ngModel *by value*\n            // and update when necessary. this way you\
    \ can add/remove\n            // and reorder the array you specified willy-nilly,\
    \ and the checkboxes will be updated.\n            // otherwise, if we specified\
    \ ngModel.$render, it would only be called when the reference updates-\n     \
    \       // reassigning our array to something else.\n            scope.$watch(attrs.ngModel,\
    \ function(arrayValues, oldArrayValues) {\n                var i;\n          \
    \      if (arrayValues !== oldArrayValues) {\n                    i = arrayValues.length;\n\
    \                    while (i--) {\n                        if (arrayValues[i]\
    \ === value) {\n                            elm.attr('checked', true); // check\
    \ the checkbox if we found the obj\n                            return;\n    \
    \                    }\n                    }\n                    elm.attr('checked',\
    \ false); // otherwise uncheck it\n                }\n            }, true);\n\
    \        }\n    };\n});\n```\n\nUsage of the `checkboxArray` directive would look\
    \ like:\n\n```html\n<div ng-controller=\"MyCtrl\">\n    <table>\n        <tr ng-repeat=\"\
    value in values\">\n            <td><input type=\"checkbox\" ng-model=\"$parent.selectedValues\"\
    \ checkbox-array=\"value\"/></td>\n            <td>{{value.name}}</td>\n     \
    \   </tr>\n    </table>\n</div>\n```\n\nIt’s important to note that since `ngRepeat`\
    \ creates its own scope, if you simply set `ngModel` to be `selectedValues`, it\
    \ would not update the model in the `MyCtrl` controller. Thus, use `$parent`.\
    \ If you already have declared `selectedValues` in your parent scope, then nevermind.\n\
    \nIf you want to execute a function (read: not necessarily update a model) when,\
    \ say, clicking a checkbox, this can be achieved one of two ways. The first way\
    \ is using the `ngChange` directive:\n\n```html\n<input type=\"checkbox\" ng-model=\"\
    skub\" ng-change=\"congratulateProSkub()\">I am pro-skub</input>\n```\n\nAnd in\
    \ your controller you would have:\n\n```javascript\n$scope.congratulateProSkub\
    \ = function() {\n  if ($scope.skub) {\n    $window.alert('thanks for being pro-skub');\n\
    \  }\n};\n```\n\nThat’s all well and good, but note that two things actually happen\
    \ when you check (or uncheck) that box. Your function will get executed, of course,\
    \ but also a boolean `model` (skub) will be updated. The value of `$scope.skub`\
    \ in the controller is now true if this checkbox is checked. If we wished to keep\
    \ this bit of logic out of the view, we could do something like this:\n\n```html\n\
    <input type=\"checkbox\" ng-model=\"skub\">I am pro-skub</input>\n```\n\nAnd:\n\
    \n```javascript\n$scope.$watch('skub', function(new_val, old_val) {\n  if (new_val\
    \ !== old_val) {\n    $scope.congratulateProSkub();\n  }\n});\n```\n\nThis accomplishes\
    \ the same thing. Heck, you could even combine the two and *three* things would\
    \ happen when you clicked the checkbox. It’s probably personal preference as to\
    \ which one you *should* be using; I see pros and cons for either, and none of\
    \ those pros or cons are especially compelling.\n\n### Radios\n\nRadios can be\
    \ slightly different than the way you’d normally use a radio:\n\n```html\n<input\
    \ type=\"radio\" name=\"foo\" value=\"bar\"/> Bar<br/>\n<input type=\"radio\"\
    \ name=\"foo\" value=\"baz\"/> Baz\n```\n\nIn AngularJS, you don’t *necessarily*\
    \ need the `name` attribute unless you want to do form validation (more on this\
    \ later). Instead, you may do this:\n\n```html\n<input type=\"radio\" ng-model=\"\
    foo\" value=\"bar\"/> Bar<br/>\n<input type=\"radio\" ng-model=\"foo\" value=\"\
    baz\"/> Baz\n```\n\nAnd it will work exactly like in the first example, with the\
    \ added bonus of assigning the value to `foo` in the scope.\n\n## Selects\n\n\
    Selects may also be a little different. Maybe you have an array of strings (and\
    \ it’s OK if you do):\n\n```html\n<select ng-model=\"foo\">\n    <option ng-repeat=\"\
    thing in ['bar', 'baz']\">{{thing}}</option>\n</select>\n```\n\nThe value of `foo`\
    \ will be “bar” or “baz”, probably just like you wanted. But what if we were iterating\
    \ over an array of objects?\n\n```html\n<select ng-model=\"foo\">\n    <option\
    \ ng-repeat=\"thing in [{name: 'bar'}, {name: 'baz'}]\">{{thing.name}}</option>\n\
    </select>\n```\n\nWhat ends up in `$scope.foo`? Well, the strings “bar” or “baz”\
    \ again. This may not be what you wanted however, as there’s nothing that tells\
    \ you precisely which object was selected! If you wanted to find that out, you’d\
    \ have to create another lookup object, or iterate over the whole array looking\
    \ for the object with the same name as `$scope.foo`. No. There is a better way:\n\
    \n```html\n<select ng-model=\"foo\" ng-options=\"thing.name for thing in [{name:\
    \ 'bar'}, {name: 'baz'}]\"></select>\n```\n\nNow the value of `$scope.foo` is\
    \ actually the object in the array itself. This is incredibly useful. It’s like\
    \ you made an entire object, not just a string, be the value attribute of your\
    \ option tag. Very cool indeed.\n\nBasically you will be iterating over one of\
    \ two kinds of data structures: an array or an object. If you have an array, the\
    \ value of `ngOptions` will be “*label for value in array*”; where “label” is\
    \ what is displayed to the user, “value” is what is stored in the `ngModel`, and\
    \ of course the array itself.\n\nIf you have an object, you don’t care about order.\
    \ Your markup may look like the following:\n\n```html\n<select ng-model=\"foo\"\
    \ ng-options=\"key + ': ' + value.name for (key, value) in {bar: {name: 'barth'},\
    \ baz: {name: 'bazalthar'}}\"></select>\n```\n\nThis displays “bar: barth” and\
    \ “baz: bazalthar” in the select dropdown; when you choose something the value\
    \ of `$scope.foo` becomes the object referred to by the key (“bar” and “baz”).\
    \ In general terms, that’s “*label for (key, value) in object*“.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_50_0.png)\n\
    \nEverybody loves lists and tables and that’s what we’re going to talk about next."
  mdcn: "\n## 控件\n\n让我们来看看控件。\n\n### 让按钮点击执行操作\n\n你可能已经有一些标记，看起来像这样：\n\n```\n<button>Alert\
    \ My Name</button>\n```\n\n为了让点击这个按钮能执行某些操作，你需要使用 `ngClick` 指令。为了执行操作，你必须为 `ngClick`\
    \ 指令提供一个 AngularJS 表达式。通常这是一个函数，如下所示：\n\n```\n<button ng-click=\"myAlert()\">Alert\
    \ My Name</button>\n```\n\n或者，根据你想实现的功能，你甚至可以直接在标记中进行赋值：\n\n```\n<button ng-click=\"\
    name = 'Chris'\">My Name Is Now Chris</button>\n```\n\n当然，这还不是一个完整的 AngularJS\
    \ 应用程序。但上述内容是完整的，并且实际上可以运行。\n\n### 使用锚点 (`<a>`) 标签\n\n你可能会在应用程序的某些地方使用 `<a>` 标签，而且它们的功能可能与\
    \ `<a>` 标签最初的设计意图不同。相反，它们会执行某些 JavaScript 函数。我的建议是以这种方式编写你的锚点标签：\n\n```\n<a ng-click=\"\
    doSomethingHeinous()\">Click me</a>\n```\n\n请注意缺少 `href` 属性。你不需要 `#` 或 `javascript:`\
    \ 或类似之类的废话。这是故意这样设计的；AngularJS 有自己的指令，如果缺失 `href`，该指令会自动阻止锚点标签应执行的默认操作。\n\n但是，如果你确实想按原意使用\
    \ `<a>` 标签，你可能想要实现类似动态生成 URL 的功能。这样做是行不通的：\n\n```\n<a href=\"http://essentialvinegars.com/?id={{id}}\"\
    >Buy Smelly Vinegar</a>\n```\n\n如果在 AngularJS 完全处理模板之前用户点击了这个链接，他们最终会跳转到你原样编写的那个\
    \ URL。你应该使用 `ngHref` 指令：\n\n```\n<a ng-href=\"http://essentialvinegars.com/?id={{id}}\"\
    >Buy Smelly Vinegar</a>\n```\n\nAngularJS 会拦截 `<a>` 标签，直到 `ngHref` 的内容被解析之前，它不会执行任何操作。\n\
    \n## 复选框\n\n**提示** 如果我有一个表格，每一行都有一个复选框，并且我们想知道哪些行被“勾选”了，该怎么办？\n\n*KnockoutJS 提供了类似的行为，但\
    \ AngularJS 不同。如果你想实现这样的功能，你需要一个自定义指令。如果保留所选行的顺序很重要，那么你绝对需要一个自定义指令！*\n\n这个示例指令应该能帮到你：\n\
    \n```javascript\nmyApp.directive('checkboxArray', function($parse) {\n    return\
    \ {\n        require: 'ngModel',\n        link: function(scope, elm, attrs, ngModel)\
    \ {\n            var value = scope.$eval(attrs.checkboxArray);\n             \
    \   // the thing we will put in our array specified by ngModel\n             \
    \   array = $parse(attrs.ngModel); // getter/setter for ngModel\n            \
    \    // if we have not defined the ngModel, let's assign an empty array to it\n\
    \                // otherwise we may run into problems getting the length of an\
    \ undefined object\n            if (angular.isUndefined(array(scope))) {\n   \
    \             array.assign(scope, []);\n            }\n            // when the\
    \ checkbox is clicked, execute this\n            elm.bind('change', function()\
    \ {\n                var arrayValues = array(scope),\n                    // get\
    \ the actual array out of the scope\n                    i = arrayValues.length;\n\
    \                if (elm.attr('checked')) {\n                    // if we wound\
    \ up checked, push the thing onto the array specified by ngModel\n           \
    \         arrayValues.push(value);\n                    // need to apply since\
    \ this is a jQuery event\n                    scope.$apply(function() {\n    \
    \                    ngModel.$setViewValue(true); // checkbox will want to be\
    \ true/false\n                        array.assign(scope, arrayValues); // update\
    \ the scope\n                    });\n                } else {\n             \
    \       // find the object in our array and remove it\n                    while\
    \ (i--) {\n                        if (arrayValues[i] === value) {\n         \
    \                   arrayValues.splice(i, 1);\n                            scope.$apply(function()\
    \ {\n                                ngModel.$setViewValue(false);\n         \
    \                       array.assign(scope, arrayValues);\n                  \
    \          });\n                            return;\n                        }\n\
    \                    }\n                }\n            });\n            // this\
    \ little gem will watch the array specified in ngModel *by value*\n          \
    \  // and update when necessary. this way you can add/remove\n            // and\
    \ reorder the array you specified willy-nilly, and the checkboxes will be updated.\n\
    \            // otherwise, if we specified ngModel.$render, it would only be called\
    \ when the reference updates-\n            // reassigning our array to something\
    \ else.\n            scope.$watch(attrs.ngModel, function(arrayValues, oldArrayValues)\
    \ {\n                var i;\n                if (arrayValues !== oldArrayValues)\
    \ {\n                    i = arrayValues.length;\n                    while (i--)\
    \ {\n                        if (arrayValues[i] === value) {\n               \
    \             elm.attr('checked', true); // check the checkbox if we found the\
    \ obj\n                            return;\n                        }\n      \
    \              }\n                    elm.attr('checked', false); // otherwise\
    \ uncheck it\n                }\n            }, true);\n        }\n    };\n});\n\
    ```\n\n`checkboxArray` 指令的使用方式如下：\n\n```html\n<div ng-controller=\"MyCtrl\">\n\
    \    <table>\n        <tr ng-repeat=\"value in values\">\n            <td><input\
    \ type=\"checkbox\" ng-model=\"$parent.selectedValues\" checkbox-array=\"value\"\
    /></td>\n            <td>{{value.name}}</td>\n        </tr>\n    </table>\n</div>\n\
    ```\n\n重要的一点是，由于 `ngRepeat` 会创建自己的作用域，如果你简单地将 `ngModel` 设置为 `selectedValues`，它将无法更新\
    \ `MyCtrl` 控制器中的模型。因此，请使用 `$parent`。如果你已经在父作用域中声明了 `selectedValues`，则无需担心。\n\n\
    如果你想在点击复选框时执行一个函数（即：不一定要更新模型），可以通过两种方式实现。第一种方式是使用 `ngChange` 指令：\n\n```html\n\
    <input type=\"checkbox\" ng-model=\"skub\" ng-change=\"congratulateProSkub()\"\
    >I am pro-skub</input>\n```\n\n在你的控制器中，你会这样写：\n\n```javascript\n$scope.congratulateProSkub\
    \ = function() {\n  if ($scope.skub) {\n    $window.alert('thanks for being pro-skub');\n\
    \  }\n};\n```\n\n这很好，但请注意，当你勾选（或取消勾选）该框时，实际上发生了两件事。你的函数将被执行，而且一个布尔值 `model` (skub)\
    \ 也会被更新。如果这个复选框被勾选，控制器中 `$scope.skub` 的值现在为 true。如果我们希望将这部分逻辑从视图中分离出来，可以这样做：\n\
    \n```html\n<input type=\"checkbox\" ng-model=\"skub\">I am pro-skub</input>\n\
    ```\n\n以及：\n\n```javascript\n$scope.$watch('skub', function(new_val, old_val)\
    \ {\n  if (new_val !== old_val) {\n    $scope.congratulateProSkub();\n  }\n});\n\
    ```\n\n这实现了同样的效果。天哪，你甚至可以将两者结合起来，这样在点击复选框时就会发生 *三* 件事。至于你 *应该* 使用哪一种，这可能取决于个人偏好；我认为两者各有优缺点，且没有哪个优点或缺点具有绝对的决定性。\n\
    \n### 单选按钮\n\n单选按钮的使用方式可能与你通常使用单选按钮的方式略有不同：\n\n```html\n<input type=\"radio\"\
    \ name=\"foo\" value=\"bar\"/> Bar<br/>\n<input type=\"radio\" name=\"foo\" value=\"\
    baz\"/> Baz\n```\n\n在 AngularJS 中，除非你想进行表单验证（稍后详细讨论），否则你 *不一定* 需要 `name` 属性。相反，你可以这样做：\n\
    \n```html\n<input type=\"radio\" ng-model=\"foo\" value=\"bar\"/> Bar<br/>\n<input\
    \ type=\"radio\" ng-model=\"foo\" value=\"baz\"/> Baz\n```\n\n它的工作方式与第一个示例完全一样，而且还有一个额外的好处，就是将值分配给作用域中的\
    \ `foo`。\n\n## 下拉选择框 (Selects)\n\n下拉选择框也可能有点不同。假设你有一个字符串数组（如果确实如此也没关系）：\n\n```html\n\
    <select ng-model=\"foo\">\n    <option ng-repeat=\"thing in ['bar', 'baz']\">{{thing}}</option>\n\
    </select>\n```\n\n`foo` 的值将是 “bar” 或 “baz”，这可能正是你想要的。但如果我们迭代的是一个对象数组呢？\n\n```html\n\
    <select ng-model=\"foo\">\n    <option ng-repeat=\"thing in [{name: 'bar'}, {name:\
    \ 'baz'}]\">{{thing.name}}</option>\n</select>\n```\n\n`$scope.foo` 中最终会是什么？嗯，依然是字符串\
    \ “bar” 或 “baz”。然而，这可能不是你想要的，因为没有什么能告诉你具体选择了哪个对象！如果你想找出那个对象，你必须创建另一个查找对象，或者遍历整个数组以寻找与\
    \ `$scope.foo` 名称相同的对象。不，有更好的方法：\n\n```html\n<select ng-model=\"foo\" ng-options=\"\
    thing.name for thing in [{name: 'bar'}, {name: 'baz'}]\"></select>\n```\n\n现在\
    \ `$scope.foo` 的值实际上就是数组中的那个对象本身。这极其有用。就好像你让整个对象（而不仅仅是一个字符串）成为了 option 标签的值属性。确实非常酷。\n\
    \n基本上，你会迭代两种数据结构之一：数组或对象。如果你使用的是数组，`ngOptions` 的值将是 “*label for value in array*”；其中\
    \ “label” 是显示给用户的内容，“value” 是存储在 `ngModel` 中的内容，当然还有数组本身。\n\n如果你使用的是对象，你不需要关心顺序。你的标记可能如下所示：\n\
    \n```html\n<select ng-model=\"foo\" ng-options=\"key + ': ' + value.name for (key,\
    \ value) in {bar: {name: 'barth'}, baz: {name: 'bazalthar'}}\"></select>\n```\n\
    \n这会在选择下拉列表中显示 “bar: barth” 和 “baz: bazalthar”；当你选择某个选项时，`$scope.foo` 的值就变成了由键（“bar”\
    \ 和 “baz”）引用的对象。用通用术语来说，就是 “*label for (key, value) in object*”。\n\n![](img/f95c537c2fc9346a21a144b89cfac580_50_0.png)\n\
    \n大家都喜欢列表和表格，这就是我们接下来要讨论的内容。\n"
