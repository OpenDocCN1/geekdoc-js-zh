  - '[PAGE 30]


    # NP DOM Manipulation outside of a directive


    A service, factory, or provider can be used for DOM manipulation, but if it is,
    it should solely serve that function as to make unit testing straightforward and
    avoid spaghetti. A great place to put functionality that creates a modal pop-up
    is in a service. Creating a new “view” could even be construed as business logic.
    It turns out that using a service in this manner may feel more natural than trying
    to shoehorn the same functionality into a directive. For example, I have a case
    in which I provide a `showwarning()` function (via a factory) to display a warning,
    the contents of which sometimes fetched over HTTP, to the user, within a modal
    (note that if we didn’t need to show this in a modal, it would be better to simply
    set the warning text in a model and use `$show` to display it).


    +   - **Filters**: The filter is great for string or array manipulation to be
    done in a view. Outside of a view, you can still use a filter, but you’re probably
    better off providing a factory function instead of a filter if you will use it
    exclusively outside of views.

    - **Directives**: Finally, the directive is for DOM manipulation or otherwise
    controlling the scope or a model from the view. It is never used outside the context
    of a view. You’ll know you need a directive when you find yourself trying to use
    3rd-party DOM manipulation libraries. Don’t be tempted to use that complicated
    library in your controller! It will pay off to write a directive to bridge the
    gap between AngularJS and Library X. Custom validation is best handled in a directive.
    You can overwrite AngularJS’ default directives to change their behavior as well.
    Don’t want the model to update on every `keyDown` event? Overwrite that input
    directive! We’ll have an example of this later. Directives essentially extend
    HTML and can be used to create a domain-specific language for your application
    or applications.


    # Conclusion


    Those are the core components that make up an AngularJS application. Think of
    them as building blocks. You may need many or few components, depending upon your
    requirements.


    In the next chapter we’ll explore the model in detail. It’s just data—and you
    probably have some laying around somewhere.'
  - '[PAGE 31]


    # # Chapter 3. The Model in Detail


    What is a model? Some frameworks make you use a JavaScript class or extend some
    other base class. Part of the beauty (I say that hesitantly) of JavaScript is
    that you do not need classes (traditional-OOP-style-classes) if you do not need
    classes. To JavaScript, what you really have are objects. If you want to write
    a class with prototype methods and all that, by all means do it! But you don’t
    have to. A model can be a simple JS object: `{}`. A model, in fact, can be any
    variable, any object, any data structure; a model *is* your data. Other frameworks
    may have a Model class of some sort you need to extend; not so with AngularJS.'
  - "[PAGE 32]\n\n# AngularJS Models\n\nModels become useful when they are attached\
    \ to a Scope object. A Scope object is a special object that is created by AngularJS,\
    \ and (in addition to other things) provides data to your view. Putting your model\
    \ inside of a Scope object ensures that AngularJS is observing the model and will\
    \ take any actions necessary if that model changes. You can write a controller,\
    \ and in that controller you can have `var foo = 'bar';`, but AngularJS will absolutely\
    \ not care if you change the value to 'baz'. Once you do this, however: `$scope.foo\
    \ = 'bar';`, you now have something AngularJS can work with. If you have `<div>{{foo}}</div>`\
    \ in the view, `<div>` will be updated once `$scope.foo` has a value of `baz`.\
    \ This is, of course, Angular's data-binding.\n\n```\nScope w/ Models\n\n$scope.foo\
    \ = {}; // plain object\n$scope.bar = new Bar(); // instantiated object\n$scope.baz\
    \ = []; //plain array\n$scope.bool = true; // some boolean\n$scope.str = 'string';\
    \ // some string\n$scope.num = 31337; // some number\n```\n\nBut what if you want\
    \ to execute some custom code whenever `$scope.foo` changes? Yes, you can do that\
    \ by using a `$watch`. Observe the observation in this `$watch` example with test:\n\
    \n```\n// note no module here; not necessary for the example\nfunction SomeCtrl($scope,\
    \ $log) {\n    $scope.foo = 'bar';\n    $scope.$watch('foo', function(new_val,\
    \ old_val) {\n        if (new_val !== old_val) {\n            $log.log(\"foo used\
    \ to be '\" + old_val + \"', but is now '\" + new_val + \"'\");\n        }\n \
    \   });\n}\n\ndescribe('SomeCtrl', function () {\n    var scope;\n    beforeEach(inject(function\
    \ ($rootScope) {\n        scope = $rootScope.$new(); // make brand new child scope\
    \ off of root\n    }));\n    describe('the watch on foo', function () {\n    \
    \    it('should fire when foo changes', function () {\n            inject(function\
    \ ($controller, $log) {\n                spyOn($log, 'log');\n               \
    \ scope.$apply(function () {\n                    $controller(SomeCtrl, {\n  \
    \                      $scope: scope,\n                        $log: $log\n  \
    \                  });\n                });\n                expect(scope.foo).toBe('bar');\n\
    \                scope.$apply(\"foo = 'baz'\");\n                expect(scope.foo).toBe('baz');\n\
    \                expect($log.log).toHaveBeenCalled();\n            });\n     \
    \   });\n    });\n});\n```\n\nNow, any time foo changes, the JavaScript console\
    \ will let you know. Note the comparison of `new_val` and `old_val` the `$watch`\
    \ will fire automatically when `foo` is set for the first time, which generally\
    \ isn't the desired behavior (but might be). So we use the conditional.\n\nThe\
    \ first parameter to `$watch` is actually an *AngularJS expression*. We're asking\
    \ our Scope object to observe the value of some expression and execute a callback\
    \ function when it"
  - "[PAGE 33]\n\nCondition. When we attached foo to the `$scope`, we created the\
    \ opportunity to use the foo expression to be evaluated against that Scope. Since\
    \ this can be any expression, we can even `$watch` some arbitrary boolean; `foo\
    \ == 'baz'`; when that conditional is evaluated and the evaluated value changes,\
    \ we will execute our callback function. This is useful if you want some code\
    \ to fire only when a model reaches a certain numeric value, for example.\n\n\
    Now, you can `$watch` entire objects or arrays if you like. Take a look at the\
    \ following nice model:\n\n```\n`$scope.foo = {\n  bar: 'baz'\n};`\n```\n\n`$watch`-ing\
    \ `foo` itself will **not trigger** our callback function if the value of `foo.bar`\
    \ changes. Why? Because, by default, `$watch` works by *reference*, not by value.\
    \ If you are watching `foo` and the reference to foo doesn't change—and if we\
    \ update `foo.bar`, it doesn't—the `$watch` will not fire.\n\nLuckily AngularJS\
    \ provides functionality to accomplish this sort of task. It is expensive, but\
    \ you can `$watch` by value. Simply pass the third parameter to a `$watch` call:\n\
    \n```\ndescribe('watches', function() {\n  var scope;\n  beforeEach(inject(function($BrootScope)\
    \ {\n    $BrootScope = $BrootScope.$new();\n    scope = $BrootScope.$new();\n\
    \    scope.$apply(foo = {bar: \"baz\"});\n  }));\n\n  it('when watching by reference,\
    \ should not fire when object member updated',\n    inject(function($log) {\n\
    \      spyOn($log, 'log');\n      scope.$apply(function() {\n        scope.$watch('foo',\
    \ function(new_val, old_val) {\n          $log.log('foo' was used to be ' + angular.toJson(old_val)\
    \ + ' now it is ' + angular.toJson(new_val));\n        });\n      });\n\n    \
    \  scope.$apply(function() {\n        scope['foo'].bar = 'spam';\n      });\n\
    \      expect($log.log).not.toHaveBeenCalled();\n    }));\n\n  it('when watching\
    \ by value, should fire when object member updated', inject(function($log) {\n\
    \    spyOn($log, 'log');\n    scope.$apply(function() {\n      scope.$watch('foo',\
    \ function(new_val, old_val) {\n        if (new_val !== old_val) {\n         \
    \ $log.log('foo' was used to be ' + angular.toJson(old_val) + ' but is now ' +\
    \ angular.toJson(new_val));\n        }\n      }, true);\n    });\n\n    scope.$apply(function()\
    \ {\n      scope['foo'].bar = 'spam';\n    });\n    expect($log.log).toHaveBeenCalled();\n\
    \  }));\n});\n```\n\nNote, the calls to `angular.toJson()` here; to output the\
    \ contents of `foo` properly we must convert it to a string, or we will get the\
    \ old good `[Object object]`.\n\nAs this is an expensive operation (determining\
    \ how exactly expensive is up to you and http://jsperf.com), it may be a good\
    \ idea not to `$watch` huge objects or arrays. AngularJS was not designed to handle\
    \ this gracefully. This kind of thing is generally best left up to MS Excel. Find\
    \ out what you really need to be displaying and what you really need to edit in-line,\
    \ and you will see increased performance."
- md: " ## Don't want your model to update immediately after a change?\n\nAn example\
    \ of this tangent is a modal dialog in which some model is displayed, and you\
    \ want the user to make changes to the model. However, you only want those changes\
    \ applied when the user clicks \"Save\" and you want to throw away those changes\
    \ if the user clicks \"Cancel.\" There are several solutions to this, but one\
    \ is to simply copy your model using `angular.copy()`, and work with a temp model,\
    \ then copy back over it upon save. You could write a service or factory to take\
    \ care of this in the general case. Or, you could even write a generic directive\
    \ to mark a particular portion of the UI as \"transactional\" which will not \"\
    commit\" until \"Save.\"\n\nTake a look at this \"transactional\" directive w/\
    \ test:\n\n```\nangular.module('app', []).directive('transactional', function($parse)\
    \ {\n  return {\n    restrict: 'E',\n    scope: true,\n    link: function(scope,\
    \ elm, attrs) {\n      // get a \"getter\" fn from the $parse service\n      var\
    \ model = $parse(attrs.model);\n      // use the \"setter\" fn to put a copy of\
    \ what's specified in the \"model\" attribute\n      // into this directive's\
    \ scope, which does NOT inherit from the parent.\n      model.assign(scope, angular.copy(model(scope)));\n\
    \      // upon save, reassign the parent's model to the current value of this\
    \ directive's\n      // model.\n      scope.$save = function() {\n        model.assign(scope.$parent,\
    \ model(scope));\n      };\n    }\n  };\n});\n\n// ...and some unit tests\nbeforeEach(module('app'));\n\
    describe('transactional directive', function () {\n  var scope;\n  beforeEach(inject(function\
    \ ($rootScope) {\n    scope = $rootScope.$new(); // make brand new child scope\
    \ off of root\n  }));\n  describe('the model', function () {\n    it('should propagate\
    \ to the parent only when $saved', inject(function ($compile) {\n      var template,\
    \ compiled, isolateScope;\n      scope.foo = 'bar';\n      template = '<transactional\
    \ model=\"foo\"></transactional>';\n      compiled = $compile(template)(scope);\n\
    \      isolateScope = compiled.scope();\n      isolateScope.$apply('foo = \"baz\"\
    ');\n      expect(scope.foo).toBe('bar');\n      isolateScope.$apply('$save()');\n\
    \      expect(scope.foo).toBe('baz');\n    }));\n  });\n});\n```\n\nTo use this,\
    \ do something like this usage of the \"transactional\" directive:\n\n```\n<div\
    \ ng-controller=\"MyCtrl\">\n  <p>Value of foo: {{protected.foo}}</p>\n  <transactional\
    \ model=\"protected\">\n    <p>Temp value of foo: <input type=\"text\" ng-model=\"\
    protected.foo\"/></p>\n    <button ng-click=\"protected.increment()\">increment</button>\n\
    \    <button ng-click=\"$save()\">save</button>\n  </transactional>\n</div>\n\
    ```\n\nWhere we have a controller:\n\n```\nmyApp.controller('MyCtrl', function($scope)\
    \ {\n  $scope.protected = {\n    foo: 1,\n    increment: function() {\n      this.foo++;\n\
    \    }\n  };\n});\n```\n\nThis directive does something I'm not especially hot\
    \ on—it stuffs something new into the scope. However, given that this is an *isolate*\
    \ scope, it's OK, because it will not pollute any parent scopes with the `$save`\
    \ function. If you are really cross-eyed about it, you can modify this directive\
    \ to supply the `save` function via another attribute. Also, there are a couple\
    \ more limitations to this strategy. You need a \"top-level\" model for this to\
    \ work; you cannot use a model of `foo.bar`. Furthermore, any pseudoclass you\
    \ may have used within your object(s) will *not* be persisted, as `angular.copy()`\
    \ does not do this.\n\n## Conclusion\n\nWhile not very interesting in and of itself,\
    \ the model is nonetheless a core component of AngularJS. Unlike other frameworks,\
    \ you do not need to extend any special class to create a model. With AngularJS,\
    \ you will put your data into a special Scope object instead.\n\nBoth the model\
    \ and the view are good places to start designing web applications. If your application\
    \ has a complex UI; however, you may want to begin with the view, which we'll\
    \ discuss in the next chapter.\n\n## Chapter 4. The View in Detail\n\nWhat's the\
    \ view? It's what the user sees. It's the presentation layer. It's your templates.\
    \ It's your markup; your HTML. The view works closely with the controller, but\
    \ it is decoupled, in that the controller doesn't know anything about the view.\
    \ Also, the view doesn't really know anything about the controller. You may think\
    \ it does, because it can execute functions and touch data within a controller;\
    \ but really what the view has is a Scope object. The view and the controller\
    \ both talk to the Scope object, but not to each other. It's here that a core\
    \ paradigm of the MVC pattern becomes clear: the separation of view and business\
    \ logic. If you are familiar with the MVVM (Model-View-ViewModel) paradigm, think\
    \ of the scope as the ViewModel. The AngularJS creators have stated that AngularJS\
    \ is a MVW (Model-View-Whatever) framework, which means *this* author is not going\
    \ to tread into that discussion.\n\nWe'll discuss what an AngularJS view typically\
    \ looks like, including some typical attributes and some gotchas. This will also\
    \ serve as a better introduction to *directives*, which are special commands executed\
    \ by AngularJS. We will also look at a filter, which you may be seeing for the\
    \ first time.\n\n### Our View\n\nLet's take a closer look at a view by improving\
    \ our index.html. Right now it doesn't do squat. Change it to this:\n\n```\n<!DOCTYPE\
    \ html>\n<html ng-app=\"blog\">\n<head>\n    <meta http-equiv=\"Content-type\"\
    \ content=\"text/html; charset=utf-8\">\n    <title ng-bind-template=\"{{title}}\"\
    ></title>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.5/angular.min.js\"\
    \ type=\"text/javascript\"\n        charset=\"utf-8\"></script>\n    <script src=\"\
    https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\" type=\"text/javascript\"\
    \n       charset=\"utf-8\"></script>\n    <script src=\"blog.js\" type=\"text/javascript\"\
    \ charset=\"utf-8\"></script>\n</head>\n<body>\n<div ng-controller=\"HeadCtrl\"\
    >\n    <h1>{{title}}</h1>\n    <h3>{{description}}</h3>\n</div>\n<div ng-controller=\"\
    ContentCtrl\">\n      <new-post-area post=\"new_post\" cancel-text=\"Cancel\"\
    \ save-text=\"Save\" cancel=\"cancel\" save=\"save\">\n      </new-post-area>\n\
    \      <div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:'-date'\">\n\
    \          <ng-switch on=\"post.editing\">\n              <div ng-switch-when=\"\
    true\">\n                  <div class=\"important-background-color\" color=\"\
    #EEE\">\n                      <input type=\"text\" ng-model=\"post.temp.title\"\
    /><br/>\n                      <textarea ng-model=\"post.temp.body\"></textarea><br/>\n\
    \                      <button ng-click=\"cancel(post)\">Cancel</button>\n   \
    \                   <button ng-click=\"save(post)\">Save Changes</button>\n  \
