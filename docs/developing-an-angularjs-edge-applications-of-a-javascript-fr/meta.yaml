  md: "# # Class-Type Directive\n\nFinally, we have a class-type directive. Basically\
    \ this means you can use a class attribute on any HTML tag, and AngularJS will\
    \ process it accordingly. This may be handy if you have CSS styles associated\
    \ with the directive name, or want to use the directive name in a jQuery selector,\
    \ for some reason.\n\n```\n// This directive is like the \"!important\" CSS value\
    \ on steroids.\n// it will automatically use JavaScript to override whatever CSS\
    \ a node may have on it.\n// I think this is probably a terrible idea.\nblog.directive('importantBackgroundColor',\
    \ function() {\n    return {\n        restrict: 'C',\n        priority: -99999,\
    \ // we want this to be run dead last\n        // we don't use compile because\
    \ we want to do this at the last possible minute\n        link: function(scope,\
    \ element, attribs) {\n            element.css('background-color', attribs.color);\n\
    \        }\n    };\n});\n```\n\nUsage:\n\n```\n<div class=\"important-background-color\"\
    \ color=\"#EEE\">fleas</div>\n```\n\nThis outputs nothing different, but if you\
    \ inspect the element it will have a style attribute equal to background-color:\
    \ #EEE or something similar. This will override any CSS style you may have written,\
    \ or any !important CSS style you may have written, which makes this very important\
    \ indeed. The priority key here is used to tell the directive to compile and link\
    \ *absolutely last* (or close to it) compared to other directives that may be\
    \ on the same node. If there was a competing directive that did the same thing\
    \ as this with an even *lower* priority, it would override the resulting background\
    \ color. Of course, something like this is only useful if you have a lot of legacy\
    \ CSS sitting around, preventing you from getting it quite right. You can use\
    \ this directive and add to the madness.\n\nThese were examples of restricting\
    \ directives to certain usages. Next, let's cover some more directive concepts."
  merge: -1
