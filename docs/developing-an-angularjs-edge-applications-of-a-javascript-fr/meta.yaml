  - "[PAGE 112]\n\n# # Displaying Ajax Errors\n\nIf your server is halfway sane it\
    \ will give you a 404 when you expect a 404. It will give you a 500 when something\
    \ else goes awry. Let's assume it does.\n\nWe can show an error message every\
    \ time we get a non-OK response from the server using a response interceptor.\
    \ Append the following to our `config()` call:\n\n```\n// error messaging upon\
    \ non-OK response from server\n$httpProvider.responseInterceptors.push(function\
    \ ($q, $window) {\n\treturn function (promise) {\n\t\treturn promise.then($angular.identity,\
    \ function(res){\n\t\t\t$window.alert(\"Egad, there was an error!\");\n\t\t\t\
    return $q.reject(res);\n\t\t});\n\t};\n});\n```\n\nThe promise passed into the\
    \ first function is the promise from your `$http` call. The promise would be rejected,\
    \ because `$http` did not make a successful request, thus executing the *second*\
    \ parameter of the call to `then()`, above (the first parameter, `angular.identity`,\
    \ is simply a function that returns its first argument). Next, we pass the rejection\
    \ down the line (with the response information, of course) to be handled by `error()`\
    \ or any second parameter of a `then()` attached to the original promise returned\
    \ by the `$http` call in your code. To test this, simply change the URL in the\
    \ `getPosts()` function of the Posts service to be something non-existent.\n\n\
    ![](img/f95c537c2fc9346a21a144b89cfac580_112_0.png)\n\nIf your server responds\
    \ with JSON objects that have *errors in them*, we can handle that too. Even if\
    \ we are getting a 200 from the server, the request may have thrown an internal\
    \ exception, and we can look for that. For example, there may be an `$error` key\
    \ in the response JSON. Every time we see that, we know something went south on\
    \ the server side. Let's replace our code above with the following:\n\n```\n//\
    \ error messaging upon non-OK response from server\n// or special $error response\n\
    $httpProvider.responseInterceptors.push(function ($q, $window) {\n\treturn function\
    \ (promise) {\n\t\treturn promise.then(function(res) {\n\t\t\tif (res.data.$error)\
    \ {\n\t\t\t\t$window.alert(\"rikes, the server had a problem!!\");\n\t\t\t\treturn\
    \ $q.reject(res);\n\t\t\t}\n\t\t\treturn res;\n\t\t}, function(res) {}));\n\t\
    };\n});\n```"
