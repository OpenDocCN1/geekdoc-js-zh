  md: "# # Adding Our Directive\n\nWe will start with a relatively trivial and useless\
    \ directive, then provide more examples of different directive types, and some\
    \ special directives that you'd use if you wanted certain behaviors; specifically\
    \ custom form validation.\n\nOur blog has a custom directive called `boldClick`,\
    \ which toggles a bold font weight to the HTML element the directive is used on,\
    \ upon click. Here is an example of handling this with a directive:\n\n```\nblog.directive('boldClick',\
    \ function() {\n  return function(scope, element) {\n    var bold = false;\n \
    \   element.click(function() {\n      if (bold) {\n        element.css('font-weight',\
    \ 'normal');\n      } else {\n        element.css('font-weight', 'bold');\n  \
    \    }\n      bold = !bold;\n    });\n  };\n});\n```\n\nAnd in the view, it looks\
    \ like this:\n\n```\nMy pet is a <span bold-click>tortoise</span>.\n```\n\nLet's\
    \ approach this line by line.\n\n+   - First off, we name our directive `boldClick`.\
    \ This is the common name for the directive, but when using it in a view we have\
    \ many different options, as discussed earlier (using any of them, such as bold-click,\
    \ will automatically be camelCased). A directive is a function that returns an\
    \ object (and in some simple cases, just a function).\n- In our object, we have\
    \ two keys: restrict and link. restrict tells AngularJS *how* the directive can\
    \ be used. This value can be nothing, E (element), A (attribute), C (class) or\
    \ M (comment). If omitted, it defaults to A, which means you can remove it from\
    \ your directive definition. If specified, AngularJS will throw an error if you\
    \ try to use your directive in an unintended way.\n- link defines a *linking*\
    \ function. Nine times out of ten, your directive will have a link, as it is the\
    \ most common situation. A linking function is passed a Scope object (likely from\
    \ whatever scope it's within inside your view; think the closest parent controller's\
    \ scope), an element (the directive's element itself; this is a jqLite or jQuery\
    \ object), and an attribute object representing all of the attributes of the element.\
    \ Optionally it is passed a controller instance.\n\n# ## jqLite?\n\n*jqLite is\
    \ what you get to work with when you haven't included jQuery. If you have included*"
  merge: -1
