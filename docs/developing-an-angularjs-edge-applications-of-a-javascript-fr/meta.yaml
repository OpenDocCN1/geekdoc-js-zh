  md: "# Custom Validation\n\nI needed to validate a \"time\" field. This time must\
    \ be some date/time in the future, but not *too* far in the future. Since there's\
    \ no time picker widget (we could write one, I guess) let's just use a text input\
    \ field and run custom validation against it. The user will have to type in a\
    \ parseable date/time. Our markup will look like this:\n\n```\n<form name=\"timeForm\"\
    >\n  <input name=\"time\" type=\"text\" futureTime placeholder=\"enter a time\"\
    \ ng-model=\"time\"/>\n</form>\n```\n\nNote that to use AngularJS' validation\
    \ mechanism, you must use a form. You can nest forms if necessary (using `ngForm`),\
    \ but we won't be doing that here. This is the `futureTime` directive:\n\n```\n\
    // futureTime directive sets validity of text input box if the user types in a\
    \ parsable time that\n// is in the future\nblog.directive('futureTime', function()\
    \ {\n    return {\n        require: '?ngModel',\n        link: function(scope,\
    \ elm, attrs, ngModel) {\n\n            // no 'get()' in jqLite; use elm as array\
    \ to get at the DOM node object\n            if (!ngModel || attrs.type !== 'text'\
    \ || elm[0].tagName.toLowerCase() !== 'input') {\n                return; // do\
    \ nothing if no ngModel specified OR the input field is not of type \"text\"\n\
    \            }\n\n            // we want this to be the first check we do, in\
    \ case there are others.\n            // whatever we return from this function\
    \ ends up as the view value, so if you\n            // want to clear invalid input,\n\
    \            // simply return nothing.\n            ngModel.$parsers.unshift(function(view_value)\
    \ {\n                var ts, nows;\n                // first case: empty field.\
    \ this is OK\n                if (!view_value) {\n                    ngModel.$setValidity('futureTime',\
    \ true);\n                    return;\n                }\n\n                //\
    \ second case: unparsable date\n                ts = Date.parse(view_value);\n\
    \                if (isNaN(ts) || ts < 0) {\n                    ngModel.$setValidity('futureTime',\
    \ false);\n                    return view_value;\n                }\n\n     \
    \           // third case: valid date, but in the past or present\n          \
    \      nows = new Date().getTime();\n                if (ts <= nows) {\n     \
    \               ngModel.$setValidity('futureTime', false);\n                 \
    \   return view_value;\n                }\n\n                // fourth case: future\
    \ date!\n                ngModel.$setValidity('futureTime', true);\n         \
    \       return view_value;\n            });\n        }\n    };\n});\n```\n\nSince\
    \ we have a form, we can use AngularJS' built-in validation. Let's change our\
    \ HTML partial to this:\n\n```\n<form name=\"timeForm\">\n  <input name=\"time\"\
    \ type=\"text\" future-time placeholder=\"enter a time\" ng-model=\"time\"/>\n\
    \  <div style=\"color: red\" ng-show=\"timeForm.time.$error.futureTime\">This\
    \ is not a valid future time.</div>\n</form>\n```\n\nWhen we name a `<form>`,\
    \ it triggers AngularJS' built-in form directive. This will put a"
