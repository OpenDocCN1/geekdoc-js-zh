    \n});\n$scope.$emit('anotherEvent', obj2);\n```\n\n```\n// note that if you want\
    \ sibling controllers to respond to a $broadcast, you will\n// need to do this\
    \ in a parent controller.  if one is not present, it may make\n// sense to use\
    \ $rootScope:\n$rootScope.$broadcast('globalEvent', super_important_stuff);\n\
    ```\n\n# Digest already in progress?\n\nIf you see this JavaScript error, it means\
