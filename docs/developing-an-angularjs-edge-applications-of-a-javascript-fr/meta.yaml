  md: "```\n<p>Value of foo: {{protected.foo}}</p>\n<transactional model=\"protected\"\
    >\n  <p>Temp value of foo: <input type=\"text\" ng-model=\"protected.foo\"/></p>\n\
    \  <button ng-click=\"protected.increment()\">increment</button>\n  <button ng-click=\"\
    $save()\">save</button>\n</transactional>\n</div>\n```\n\nWhere we have a controller:\n\
    \n```\nmyApp.controller('MyCtrl', function($scope) {\n  $scope.protected = {\n\
    \    foo: 1,\n    increment: function() {\n      this.foo++;\n    }\n  };\n});\n\
    ```\n\nThis directive does something I'm not especially hot on—it stuffs something\
    \ new into the scope. However, given that this is an *isolate* scope, it's OK,\
    \ because it will not pollute any parent scopes with the `$save` function. If\
    \ you are really cross-eyed about it, you can modify this directive to supply\
    \ the `save` function via another attribute. Also, there are a couple more limitations\
    \ to this strategy. You need a \"top-level\" model for this to work; you cannot\
    \ use a model of `foo.bar`. Furthermore, any pseudoclass you may have used within\
    \ your object(s) will *not* be persisted, as `angular.copy()` does not do this.\n\
    \n# Conclusion\n\nWhile not very interesting in and of itself, the model is nonetheless\
    \ a core component of AngularJS. Unlike other frameworks, you do not need to extend\
    \ any special class to create a model. With AngularJS, you will put your data\
    \ into a special Scope object instead.\n\nBoth the model and the view are good\
    \ places to start designing web applications. If your application has a complex\
    \ UI; however, you may want to begin with the view, which we'll discuss in the\
    \ next chapter."
