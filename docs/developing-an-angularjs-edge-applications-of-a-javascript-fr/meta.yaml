    \ We can then happily insert this element into the page's DOM, or whatever we\
    \ wish to do with it. Frequently when using the $compile service, you'll be doing\
    \ both phases at once: $compile(template)(scope).\n\nThe same thing happens when\
    \ AngularJS encounters your markup for the first time. It scans all of the markup\
    \ for directives, creates a link function made of all of the directives' link\
    \ functions, then executes that function using the appropriate scope.\n\nThe reason\
    \ for these two phases is simply one of performance. By compiling once and linking\
    \ as the data-binding mechanism executes, we save rerendering a gigantic chunk\
    \ of markup (your raw, unprocessed template) that won't change.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_58_0.png)\n\
    \n## Unit Testing The View\n\n> You will likely want to be writing functional\
    \ tests for your views, not unit tests. A tool like Selenium (http://seleniumhq.org)\
    \ is well-suited for this task, but as I mentioned earlier, we're not going to\
    \ cover functional tests as they are beyond the scope of this book.\n\n## Conclusion\n\
    \nThe view is simply the presentation logic for AngularJS. It integrates models,\
    \ directives, filters and serves as the primary point of interface into your application.\
    \ If someone needs to \"save\", they do so by clicking a button; not typing a\
    \ command into their JS console! Though I suppose you could write a text adven…oh,\
    \ nevermind.\n\nNext we'll cover the controller, where business logic lives.\n\
    \n# Chapter 5. The Controller in Detail\n\nThe controller is where your business\
    \ logic lives. To define business logic, let's say it's the layer between your\
    \ UI and your data store, and any algorithms needed to support that. What a controller\
    \ isn't, is a place to put DOM modification code. The controller doesn't know\
    \ about the DOM, and should be decoupled from the view. Why is it then that other\
    \ JavaScript frameworks want you to do exactly what I'm telling you not to do?\
    \ I think the answer lies along the lines of \"there's nowhere else to put it.\"\
    \ With AngularJS, we DO have a place to put it, and not a controller (it's a directive,\
    \ which we will explore later).\n\n## Adding Functionality to Our Controller\n\
    \nNow that we have a nice view, we need to add some functionality to our controller(s)\
    \ to support our new markup. The new stuff displayed a couple of blog posts and\
    \ gave you a way to create a new one, among other things. Let's see how that works\
    \ behind-the-scenes:\n\n```\n// Header controller presents a description for the\
