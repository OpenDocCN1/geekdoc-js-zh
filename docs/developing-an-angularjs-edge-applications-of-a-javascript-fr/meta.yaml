    >\n  <!-- bunch of stuff eliminated for sake of brevity -->\n</div>\n```\n\nAnd\
    \ back in our controller:\n\n```\nblog.controller('ContentCtrl', function ($scope,\
    \ Posts, Post) {\n```\n\n.. snip ..\n\n```\n$scope.order = 'date';\n$scope.descending\
    \ = true;\n});\n```\n\nNow, we can modify order and descending to sort how we\
    \ wish. Let's make a couple form controls to change this:\n\n```\n<div id=\"posts-form\"\
    >\n    Order By: <select ng-model=\"order\">\n<option value=\"title\">Title</option><option\
    \ value=\"date\">Date</option></select>\n    <input type=\"checkbox\" ng-model=\"\
    descending\"/> Descending\n</div>\n<div id=\"{{post.id}}\" ng-repeat=\"post in\
    \ posts|orderBy:order:descending\">\n    <!-- bunch of stuff eliminated for sake\
    \ of brevity -->\n</div>\n```\n\nIt looks something like this:\n\n![](img/f95c537c2fc9346a21a144b89cfac580_52_0.png)\n\
    \nSwell! Let's take it a step further and add a filter box. We'll use the `filter`\
    \ filter for this:\n\n```\n<div id=\"posts-form\">\n    Order By: <select ng-model=\"\
    order\"><option value=\"title\">Title</option><option value=\"date\">\nDate</option></select>\n\
    \    <input type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n   \
    \ Filter: <input type=\"text\" ng-model=\"filter\"/>\n</div>\n<div id=\"{{post.id}}\"\
    \ ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\">\n    <!--\
    \ bunch of stuff eliminated for sake of brevity -->\n</div>\n```\n\nYes, you may\
    \ combine filters. That's all we need to do a full text filter across all of the\
    \ fields of a Post object. As you type, the filter will be updated and your results\
    \ will show immediately. To accomplish this you'll note we didn't have to modify\
    \ the controller at all. Filters, combined with ngModel, are a lethal combination\
    \ indeed.\n\nBy default, this will filter on all values of an object. If you only\
    \ want to filter on one value, say, the title of an object, you will need a custom\
    \ filtering function. For example:\n\n```\n$scope.myFilteringFunction = function(item)\
    \ {\n    return item.title.match($scope.filter);\n};\n```\n\nNow you can do this:\n\
    \n```\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:myFilteringFunction\"\
    >\n    <!-- bunch of stuff eliminated for sake of brevity -->\n</div>\n```"
  - "[PAGE 53]\n\n# Even/Odd Rows\n\nIt's often highly desirable to change the CSS\
    \ of a row in a table based on whether it's an even or odd row. This is incredibly\
    \ easy to do in AngularJS using the ngClassEven and ngClassOdd directives:\n\n\
    ```\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \n     ng-class-even=\"'even'\" ng-class-odd=\"'odd'\">\n    <!-- bunch of stuff\
    \ eliminated for sake of brevity -->\n</div>\n```\n\nNow, each <div> in our list\
    \ of posts will be tagged with either an even class or an odd class, depending.\
    \ Simply set up your CSS and have one of these alter the background color slightly,\
    \ and you're set. Feel free to use a table instead."
  - "[PAGE 54]\n\n# Temporary Variables\n\nYou are probably not going to need temporary\
    \ variables. You may think you do — what if we have a nested `ngRepeat` loop,\
    \ and we need to access the `$index` property of the outer loop from within the\
    \ inner loop? The inner loop declares `$index` itself, so that's not going to\
    \ work. In other templating languages you might want to declare a temporary variable\
    \ within the outer loop. This is how you'd do it with AngularJS:\n\n```\n<div\
    \ ng-repeat=\"stuff in things\" ng-init=\"outerIndex = $index\">\n  <div ng-repeat=\"\
    bits in stuff\">\n    {{outerIndex}}.{{$index}}\n  </div>\n</div>\n```\n\nBut,\
    \ in AngularJS, you don't need to use `ngInit` for this common case. `ngInit`\
    \ simply executes an AngularJS expression against the current scope. Use it sparingly!\
    \ Remember that every scope has a parent (except the root scope, of course). To\
    \ avoid `ngInit`, do this:\n\n```\n<div ng-repeat=\"stuff in things\">\n  <div\
    \ ng-repeat=\"bits in stuff\">\n    {{$parent.$index}}.{{$index}}\n  </div>\n\
    </div>\n```\n\nIn fact, I'm having a hard time imagining a use case wherein `$parent`\
    \ wouldn't be sufficient in some way. However, I'd suggest using `ngInit` if you\
    \ end up with something like `$parent.$parent.$parent.$parent.$index`. Do whatever\
    \ is simple. Also remember that `ngInit`, unless it's in an `ngRepeat` loop, will\
    \ only execute one time; use this to your advantage or peril, if you must.\n\n\
    What if you have a bunch of JavaScript that you would like injected into the DOM,\
    \ but it doesn't make sense to escape it in JavaScript code? Templates to the\
    \ rescue. We'll discuss them next."
  - "[PAGE 55]\n\n# Templates\n\nGenerally you’ll just be wildly tossing AngularJS\
    \ directives into your raw markup, so you won’t need a template *per se*. However,\
    \ when it comes to lazy loading HTML or otherwise, consider using a template.\
    \ It’s also great to use small templates for reusability. There are two ways to\
    \ define templates. The first is in a <script> tag:\n\n```\n<script type=\"text/ng-template\"\
    \ id=\"foo\">\n    Hi, I'm the template with ID \"foo\".\n</script>\n```\n\nThe\
    \ advantage of having this stuff in a <script> tag like this is that your templates\
    \ stay out of the DOM until you put them there. The second form of a template,\
    \ which shares this advantage, is a partial. A partial is simply an external HTML\
    \ file. These are both templates and can be used exactly the same way, the only\
    \ difference is that one is external and the other is not.\n\n# Including a Template\n\
    \nThe most straightforward way to include a template is the `ngInclude` directive.\
    \ Simply give it a path or ID, and it will first attempt to retrieve it from the\
    \ template cache (see below), and if this misses, an HTTP request will be made\
    \ to the path. If your application is small and you’re not concerned about loading\
    \ times, you should use internal (<script>-style) templates, because they will\
    \ be gathered up by AngularJS. If you prefer lazy-loading or when loading a bunch\
    \ of HTML up front is a bad idea, use the external (partial) style. Let’s break\
    \ out our index.html into some partials:\n\n```\n<!DOCTYPE html>\n<html ng-app=\"\
    blog\">\n<head>\n    <meta http-equiv=\"Content-type\" content=\"text/html; charset=utf-8\"\
    >\n    <title ng-bind-template=\"{{title}}\"></title>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.5/angular.min.js\"\
    \ type=\"text/javascript\"\n            charset=\"utf-8\"></script>\n    <script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\" type=\"\
    text/javascript\"\n            charset=\"utf-8\"></script>\n    <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body>\n\
    <ng-include src=\"'header.html'\"></ng-include>\n<div ng-controller=\"ContentCtrl\"\
    >\n    <new-post-area post=\"new_post\" cancel-text=\"Cancel\" save-text=\"Save\"\
    \ cancel=\"cancel\"\n                   save=\"save\"></new-post-area>\n    <div\
    \ id=\"posts-form\">\n        Order By: <select ng-model=\"order\"><option value=\"\
    title\">Title</option><option value=\"date\">\n        Date</option></select>\n\
    \        <input type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n\
    \        Search: <input type=\"text\" ng-model=\"filter\"/>\n    </div>\n    <div\
    \ id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \ ng-class-even=\"\n    'even'\" ng-class-odd=\"'odd'\">\n        <ng-switch on=\"\
    post.editing\">\n            <div ng-switch-when=\"true\">\n                <div\
    \ class=\"important-background-color\" color=\"#EEE\">\n                    <input\
    \ type=\"text\" ng-model=\"post.temp.title\"/><br/>\n                    <textarea\
    \ ng-model=\"post.temp.body\"></textarea><br/>\n                    <button ng-click=\"\
    cancel(post)\">Cancel</button>\n                    <button ng-click=\"save(post)\"\
    >Save Changes</button>\n                </div>\n            </div>\n         \
    \   <div ng-switch-default>\n                <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n\
    \                <p ng-click=\"edit(post)\" bold-click ng-bind-html-unsafe=\"\
    post.body\"></p>\n                <p><em>posted on {{post.date|date:'short'}}\
    \ by {{post.author}}</em></p>\n            </div>\n        </ng-switch>\n    \
    \    <hr/>\n        <button ng-click=\"newPost()\">New Post</button>\n    </div>\n\
    </div>\n<ng-include src=\"'footer.html'\"></ng-include>\n</body>\n</html>\n```"
- md: " Here is the header.html:\n\n```\n<div ng-controller=\"HeadCtrl\">\n    <h1>{{title}}</h1>\n\
    \    <h3>{{description}}</h3>\n</div>\n```\n\nAnd here is the footer.html:\n\n\
    ```\n<!-- directive: copyright -->\n```\n\nThat's it! As you can see, ngInclude\
    \ expects an AngularJS expression for the src attribute; that way you can dynamically\
    \ change which template ID you are after.\n\nIf you want to include a template\
    \ from within a directive (outside of the context of the template or templateUrl\
    \ arguments), you can mimic what ngInclude does in a manner akin to this:\n\n\
    ```\nmyApp.directive('myInclude', function ($templateCache, $http, $q, $compile)\
    \ {\n    return {\n        restrict: 'E',\n        link: function (scope, elm,\
    \ attrs) {\n            // retrieves a template from the template cache over http\
    \ as necessary.\n            // returns a promise.\n            (function () {\n\
    \                var dfrd, template = $templateCache.get(scope.$eval(attrs.src));\n\
    \                if (template) {\n                    dfrd = $q.defer();\n   \
