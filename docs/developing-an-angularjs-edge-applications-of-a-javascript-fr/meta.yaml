    \texpect(scope.new_post.temp.body).toBe('Enter Body Here');\n\t\texpect(scope.new_post.author).toBe('me');\n\
    \t}));\n\n\tit('should call Post.prototype.beginEditing', inject(function(Post)\
    \ {\n\t\tspyon(Post.prototype, 'beginEditing'); // blasts our data\n\t\tscope.$apply(function()\
    \ {\n\t\t\tscope.newPost();\n\t\t});\n\n\t\texpect(Post.prototype.beginEditing).toHaveBeenCalled();\n\
    \t}));\n});\n```\n\nNine times out of ten, you are going to want to use a service\
    \ or a factory. But what if you have a service and need to configure it before\
    \ it's instantiated? This is when you use a provider."
  - "[PAGE 93]\n\n# # The Provider\n\nUse a provider if you need to configure a service\
    \ before it runs. This is the only reason you'd ever use a provider, because they\
    \ are the most complex of the three to use. For example, it's common to want to\
    \ use `$httpProvider` to set up default headers before the $http service is instantiated.\n\
    \n![](img/f95c537c2fc9346a21a144b89cfac580_93_0.png)\n\nBut what mainly brings\
    \ us here is the fact that you cannot do this:\n\n```\nsome_module.service('SomeService',\
    \ function() {\n    this.someMethod = function() { … };\n});\n```\n\n```\nsome_module.config(function(SomeService)\
    \ {\n    // do something with SomeService\n});\n```\n\n**SomeService** has not\
    \ yet been instantiated and it simply doesn't exist. But you CAN do this:\n\n\
    ```\nfunction SomeProvider() {\n    // some setup code goes here\n    this.last_name\
    \ = 'Hiller';\n\n    // required method $get; acts as factory or service\n   \
    \ this.$get = function() {\n        var that = this;\n        return {\n     \
    \       someMethod: function() { return that.first_name + ' ' + that.last_name\
    \ }\n        };\n    };\n}\n```\n\n```\nsome_module.provider('SomeProvider', SomeProvider)\n\
    ```\n\n```\n// YES, it tacks \"Provider\" on to the end of any provider you create.\n\
    some_module.config(function(SomeProviderProvider) {\n    SomeProviderProvider.first_name\
    \ = 'Chris';\n});\n```"
- md: "## Unit Testing Services\n\nUnit testing factories, services and providers\
    \ is incredibly easy. Let's write tests for our Posts service and our Post factory:\n\
    \n```\ndescribe('Blog Services', function () {\n    var Posts, httpBackend;\n\n\
    \    // I want to use the variable name Posts for my service, but if I use DI\
    \ here to inject it\n    // the variable name will already be taken! A fun way\
    \ around this limitation isto inject the $injector service,\n    // then simply\
    \ ask it for what you want.\n    beforeEach(inject(function ($injector, $httpBackend)\
    \ {\n        Posts = $injector.get('Posts');\n        httpBackend = $httpBackend;\n\
    \    }));\n\n    describe('Posts', function () {\n        it('should initiate\
    \ the http call', function () {\n            var promise;\n            // you\
    \ will need to use expectGET, expectPOST, etc., when unit testing functions\n\
    \            // that use the $http service. They are assertions about what call\
    \ you are making and allow\n            // you to mock a response easily.\n  \
    \          httpBackend.expectGET('data.json').respond('foo');\n            promise\
    \ = Posts.getPosts();\n            // make sure our promise is really a then-able\
    \ object\n            expect(angular.isFunction(promise.then)).toBeTruthy();\n\
    \            promise.then(function (res) {\n                expect(res.data).toBe('foo');\n\
    \            });\n            httpBackend.flush();\n        });\n    });\n});\n\
    ```\n\nNext is a relatively long bit of testing code to assert all of our Post\
    \ class' methods are functioning as expected:\n\n```\ndescribe('Blog Factories',\
    \ function () {\n\n    var Post;\n\n    beforeEach(inject(function ($injector)\
    \ {\n        Post = $injector.get('Post');\n    }));\n\n    describe('Post', function\
    \ () {\n\n        // covers all of the constructor's behavior, which is very little.\n\
    \        describe('the constructor', function () {\n\n            it('should store\
    \ information temporarily when autosave flag is not truthy', function () {\n \
    \               var post = new Post('cashews', 'peanuts', new Date(), 'Mr. Almond');\n\
    \                expect(post.temp.title).toBe('cashews');\n                expect(post.temp.body).toBe('peanuts');\n\
    \                expect(post.title).toBeUndefined();\n                expect(post.body).toBeUndefined();\n\
    \                expect(post.date).not.toBeUndefined();\n                expect(post.author).toBe('Mr.\
    \ Almond');\n            });\n\n            it('should not store information temporarily\
    \ when autosave flag is truthy', function () {\n                var post = new\
    \ Post('cashews', 'peanuts', new Date(), 'Mr. Almond', true);\n              \
    \  expect(post.title).toBe('cashews');\n                expect(post.body).toBe('peanuts');\n\
    \                expect(post.temp.title).toBeUndefined();\n                expect(post.temp.body).toBeUndefined();\n\
    \                expect(post.date).not.toBeUndefined();\n                expect(post.author).toBe('Mr.\
    \ Almond');\n            });\n        });\n\n        describe('the updateDate\
    \ method', function () {\n            it('should reset the date', function ()\
    \ {\n                var old_date, post = new Post();\n                old_date\
    \ = post.toString();\n                post.updateDate();\n                // it\
    \ would be kind of weird/difficult to try to assert it updates the date object\n\
    \                // to NOW; so just assert it changed.\n                expect(old_date).not.toBe(post.date.toString());\n\
    \            });\n        });\n\n        describe('the save method', function\
    \ () {\n            it('should copy information from temp object', function ()\
    \ {\n                var post = new Post('foo', 'bar');\n                post.save();\n\
    \                expect(post.title).toBe('foo');\n                expect(post.body).toBe('bar');\n\
    \            });\n\n            it('should call updateDate method', function()\
    \ {\n                var post = new Post();\n                // we just need to\
    \ assert that save() happens to call the updateDate() method\n               \
    \ spyOn(post, 'updateDate');\n                post.save();\n                expect(post.updateDate).toHaveBeenCalled();\n\
    \            });\n\n            it('should call the stopEditing method', function()\
    \ {\n                var post = new Post();\n                spyOn(post, 'stopEditing');\n\
    \                post.save();\n                expect(post.stopEditing).toHaveBeenCalled();\n\
    \            });\n        });\n\n        describe('the beginEditing method', function()\
    \ {\n            it('should rearrange some data in the post', function() {\n \
    \               var post = new Post('foo', 'bar', new Date(), 'baz', true);\n\
    \                post.beginEditing();\n                // we assert the state\
    \ changes and the information has been copied out of temp\n                expect(post.editing).toBeTruthy();\n\
    \                expect(post.temp.title).toBe(post.title);\n                expect(post.temp.body).toBe(post.body);\n\
    \            });\n        });\n\n        describe('the stopEditing method', function()\
    \ {\n            it('should set editing flag to false and empty temp object',\
    \ function() {\n                var post = new Post('foo', 'bar', new Date(),\
    \ 'baz', true);\n                post.beginEditing();\n                post.stopEditing();\n\
    \                expect(post.editing).toBeFalsy();\n                // note that\
    \ you cannot use \"toBe\" here, because {} !== {}\n                expect(post.temp).toEqual({});\n\
    \            });\n        });\n\n        describe('toString method', function()\
    \ {\n            it('should return a JSON string', function() {\n            \
    \    var post = new Post('foo', 'bar', new Date(), 'baz', true);\n           \
    \     expect(post.toString()).toBe(angular.toJson(post));\n            });\n \
    \       });\n    });\n});\n```\n\n## Conclusion\n\nThese services, providers and\
    \ factories make up the backbone (no pun intended) of your AngularJS app. Do the\
    \ heavy lifting here; make it reusable and testable. You'll end up with less spaghetti\
    \ on your plate. Keep your controller from thinking too hard. Your directive only\
    \ has one function in it—make that function readable by injecting services into\
    \ it.\n\nIn the next chapter, we'll take a look at the runt of the litter, filters.\n\
    \n# Chapter 8. Filters\n\nWhat's a filter? At its most basic it's a function that\
    \ takes multiple inputs and gives you one output. Typically a filter outputs primitives,\
    \ less typically arrays, and rarely objects. I suppose they could output functions\
    \ too (as an exercise to the reader, please ascertain that use case). They're\
    \ a way to execute logic against a model or models that only the view cares about.\
    \ For instance, you may be working with a number as an integer in the controller,\
    \ but when it hits the view, it needs to be displayed formatted (like 9,000).\
    \ This of course is nothing the controller should be concerned with, and for this,\
    \ you would use a filter (the built-in `number` filter, to be precise)."
