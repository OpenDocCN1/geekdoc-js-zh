  - '[PAGE 10]


    # # Chapter 1. Getting Started with AngularJS


    AngularJS is a JavaScript framework that can help you write web applications quickly
    using less code. AngularJS is not a library, and it is not a collection of tools
    to help you achieve a specific goal. Rather, at its core, it is an entirely different
    way of thinking about writing web applications. As such, AngularJS has certain
    opinions about how you should be using it. Whereas in the vanilla JavaScript world,
    you are given a blank canvas on which to paint, AngularJS provides structure,
    organization and patterns. In order to master AngularJS, you must understand how
    to adhere to its guidelines and why the guidelines exist in the first place.


    > **Can I use AngularJS within Node.js?**


    *Not presently. AngularJS is designed for client-side applications instead of
    server-side JavaScript. I can''t think of a reason to even want to do this other
    than perhaps server-side template rendering. Look for this feature in the future.*


    AngularJS is excellent at helping you write CRUD (Create, Read, Update and Delete)
    applications. Its tools, abilities and limitations lend itself to this common
    scenario. For example, the *databinding* ability of AngularJS is specifically
    tailored to allow for the extremely easy modification of models and data sets.


    What AngularJS is not suited for is applications with a strong graphical component:
    ones that do many different heavy DOM modifications or games. Instead of just
    writing your jQuery, you are going to be wrapping it in a lot of code with little
    benefit. Look at what''s available in the AngularJS API. If you find yourself
    outside of those bounds most of the time, you may want to find another framework.
    Of course AngularJS doesn''t provide everything, and you can use 3rd party libraries
    with it, but if *most* of your application is 3rd party libraries, you may not
    want to work with AngularJS.


    Do not attempt to write a general-purpose JavaScript library in AngularJS; it''s
    meant for writing applications, not libraries. You can write modules to be reused
    by other AngularJS applications, but anything intended to be standalone or used
    with another library is not a good candidate.


    Keep in mind that many web crawlers don''t grok single-page web applications,
    and you may need to take extra steps to ensure a good search engine position.
    And it goes without saying, though I am going to say it: if your users don''t
    have JavaScript turned on for some reason, AngularJS is useless.


    > **What if I want to write a CRUD app with a lot of animation?**


    *It''s now pretty easy to do this, assuming you''re not doing some kind of wacko
    graphical demo. AngularJS, with the release of unstable version 1.1.4, now supports
    native animations. You can define animations with CSS3, jQuery, or any other animation
    library.*'
- md: "As this is an unstable version and subject to change (more change than the\
    \ stable version, anyway) I won't be covering the ins and outs of animation in\
    \ this book; it is not in the API documentation yet. However, the blog Year of\
    \ Moo has a great overview of animations here: http://www.yearofmoo.com/2013/04/animation-in-angularjs.html.\n\
    \n## A First Example\n\nOur “Hello World” example will be a single-page weblog\
    \ application. I realize this wheel has been invented countless times, but it\
    \ gives us a great opportunity to highlight AngularJS’ myriad functionalities.\
    \ First, we’ll dive into AngularJS’ basic concepts with some easy examples. Next,\
    \ we’ll cover all of these concepts (and more!) in exhausting detail. Last, we’ll\
    \ look at some recipes for common (and not-so-common) use cases.\n\nLet’s create\
    \ a couple of files on Plunker (http://plnkr.co) for our web-accessible directory.\
    \ The first thing you will want to do is make a fake backend. What we can do is\
    \ create a file called data.json and populate it with a JSON object. This object\
    \ is large and would be rather silly to reprint here, so simply get it from the\
    \ book’s website, listed in the *Preface*. To create the file, if you are using\
    \ Plunker, the “NEW…” link is what you’re looking for.\n\nClick that “NEW…” link\
    \ again. We’ll need an HTML file, index.html, and this is our “view”:\n\n```html\n\
    <!DOCTYPE html>\n<html ng-app=\"blog\">\n<head>\n    <meta http-equiv=\"Content-type\"\
    \ content=\"text/html; charset=utf-8\">\n    <title>My Important Blog</title>\n\
    \    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js\"\
    \n    type=\"text/javascript\" charset=\"utf-8\"></script>\n    <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body\
    \ ng-controller=\"MainCtrl\">\n    <h1>My Important Blog</h1>\n\n    <div id=\"\
    posts\">\n    <h2>{{posts[0].title}}</h2>\n    <p bold-click>{{posts[0].body}}</p>\n\
    \    <p><em>posted on {{posts[0].date|date:'short'}} by {{posts[0].author}}</em></p>\n\
    \    </div>\n</body>\n</html>\n```\n\nThis, as you can see, is visible to your\
    \ application’s user. AngularJS-specific code is highlighted above in blue. Quickly,\
    \ let’s address the six bits:\n\n- `ng-app=\"blog\"`: This tells AngularJS we\
    \ should start an application, and that application is in a module named “blog.”\n\
    - `ng-controller=\"MainCtrl\"`: This gives the controller “MainCtrl” control over\
    \ the entire `<body>` of the application.\n- `{{posts[0].title}}`: For our purposes,\
    \ this displays the title of the first blog post.\n- `bold-click`: This makes\
    \ the paragraph toggle between bold and normal font weight when clicked; more\
    \ on this later.\n- `{{posts[0].body}}`: Displays the body of the first post.\n\
    - `{{posts[0].date|date:'short'}}`: Displays the first post’s date and formats\
    \ it nicely.\n- `{{posts[0].author}}`: Displays the author of the first post.\n\
    \nBehind this view sits one or more controllers, filters, and built-in or custom\
    \ directives. Behind those live services and other components to be used across\
    \ your application. Making up all of these is the module, which defines an application\
    \ (or AngularJS library). We’ll start by discussing the view.\n\n## The View\n\
    \nWhat's a view? It's the presentation layer. It's your markup (typically HTML).\
    \ It's what the user sees. It is declarative—not imperative—it doesn't have control\
    \ flow, per se. When you are ready to implement an AngularJS application, I recommend\
    \ implementing the view first, and working backwards from there. Write directives\
    \ that don't work, but use them how you would want—write the *directives* later.\
    \ Call functions in the scope and reference models that don't exist—then write\
    \ the *controllers* later. Because the view is so descriptive, it can essentially\
    \ provide a blueprint for your actual code.\n\nYou need to set some custom attributes—or\
    \ more precisely, directives—to get your AngularJS application up and running.\n\
    \n- `ng-app` on `<html>` tag: This is AngularJS' way of automatically *bootstrapping*\
    \ the application. This `ng-app` call in particular initializes the blog module,\
    \ and makes that the main module for the application.\n\n> **TIP Bootstrapping**\n\
    > If you need to execute some code before AngularJS loads, you can skip putting\
    \ ng-app in your view, and instead use `angular.bootstrap()` when ready.\n\n-\
    \ `ng-controller` on `<body>` tag: This directive tells AngularJS to initialize\
    \ the controller named `MainCtrl` and make it responsible for handling the *scope*\
    \ under the `<body>` tag, inclusive.\n- Stuff in `{{curly braces}}`: For now,\
    \ you want to understand that the stuff in double curly braces corresponds to\
    \ AngularJS expressions, which in this case correspond to models, and those models\
    \ are in the scope of our controller, `MainCtrl`. Curly braces mean, \"evaluate\
    \ this expression and output it as a string\". If you are familiar with client-side\
    \ templating languages and/or MVC frameworks, it's just some data coming out of\
    \ a controller.\n- Pipe (|) syntax: The pipe syntax in the reference to `posts[0].date`\
    \ is a *filter*. The filter is the date filter, built-in to AngularJS. This filter\
    \ takes the argument, `posts[0].date`, and applies a transformation against it.\
    \ `posts[0].date`, in this case, is a JavaScript `Date` object. The `Date` object\
    \ is transformed into a string. `short` is a shortcut for a \"short date\", which\
    \ is a preconfigured format in the filter. This filter also allows you to output\
    \ a Date object in basically any format you choose.\n\nNext, we'll need some place\
    \ to stuff our JavaScript. What follows includes an example of a model, controller,\
    \ service and directive. Create `blog.js`:\n\nThe model is typically stored within\
    \ the controller's scope object, and the controller communicates with the view.\
    \ The view contains directives, and the services provide functionality to controllers\
    \ and directives, as shown here in blog.js:\n\n```javascript\n(function () {\n\
    \    'use strict';\n    // Define our module. Yes, you need the empty array, or\
    \ the module() function\n    // becomes a \"getter\": angular.module('blog') would\
    \ RETRIEVE the\n    // module instead of DECLARE it.\n    var blog = angular.module('blog',\
    \ []);\n    // Define our main controller.\n    // Our first example of dependency\
    \ injection; $scope and Posts are\n    // automagically injected into the function\
    \ by AngularJS.\n    blog.controller('MainCtrl', function ($scope, Posts) {\n\
    \        // Retrieve the posts from our \"server\". If this succeeds, we'll\n\
    \        // put the posts into our $scope and do some post-processing.\n     \
    \   Posts.getPosts().success(function (data) {\n            $scope.posts = data.posts;\n\
    \            // Let's convert our timestamps to JS Date objects\n            var\
    \ i = $scope.posts.length;\n            while (i--)\n                $scope.posts[i].date\
    \ = new Date($scope.posts[i].date * 1000);\n        });\n    });\n    // Define\
    \ our first service; Posts\n    // This service simply uses the built-in $http\
    \ service to retrieve data from\n    // a static JSON store.\n    blog.service('Posts',\
    \ function ($http) {\n        this.getPosts = function () {\n            return\
    \ $http.get('data.json');\n        };\n    });\n    // Our first directive. Toggles\
    \ boldface on node's contents when clicked.\n    // We'll cover exactly what a\
    \ directive is a little later.\n    blog.directive('boldClick', function() {\n\
    \        return function(scope, element) {\n            var bold = false;\n  \
    \          element.bind('click', function() {\n                if (bold) {\n \
    \                   element.css('font-weight', 'normal');\n                } else\
    \ {\n                    element.css('font-weight', 'bold');\n               \
    \ }\n                bold = !bold;\n            });\n        };\n    });\n})();\n\
    ```\n\nLet's address some of these things in brief before moving on:\n\n- First,\
    \ let's define a module \"blog\". This module, when combined with the `ng-app=\"\
    blog\"` attribute in the markup, functions as our main application.\n- We define\
    \ a controller called \"MainCtrl\", which provides business logic to the view\
    \ under the `<body>` tag inclusive. This uses *dependency injection* (DI) to pass\
    \ in the `$scope` and `Posts` parameters.\n- When `MainCtrl` is run, it grabs\
    \ some post data from the `Posts` service, and does a bit of post-processing on\
    \ the date objects."
  mdcn: "\n由于这是一个不稳定的版本，并且随时可能发生变化（无论如何，它比稳定版本的变化更大），我不会在本书中详细介绍动画的方方面面；API 文档中也尚未包含这部分内容。不过，Year\
    \ of Moo 博客上有一篇关于动画的精彩概述：http://www.yearofmoo.com/2013/04/animation-in-angularjs.html。\n\
    \n## 第一个示例\n\n我们的\"Hello World\"示例将是一个单页博客应用程序。我知道这个轮子已经被发明过无数次了，但它为我们提供了一个绝佳的机会来展示\
    \ AngularJS 的众多功能。首先，我们将通过一些简单的示例深入了解 AngularJS 的基本概念。接下来，我们将详细涵盖所有这些概念（以及更多内容！）。最后，我们将介绍一些针对常见（以及不太常见）用例的实践方案。\n\
    \n让我们在 Plunker (http://plnkr.co) 上创建一些文件作为我们的网络可访问目录。你首先要做的就是创建一个假的后端。我们可以创建一个名为\
    \ `data.json` 的文件，并在其中填充一个 JSON 对象。这个对象很大，重新打印在这里会显得相当愚蠢，所以请从本书网站上获取，网址列在*前言*中。要创建该文件，如果你使用\
    \ Plunker，你需要找的是\"NEW…\"链接。\n\n再次点击\"NEW…\"链接。我们需要一个 HTML 文件 `index.html`，这就是我们的\"\
    视图\"：\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"blog\">\n<head>\n    <meta http-equiv=\"\
    Content-type\" content=\"text/html; charset=utf-8\">\n    <title>My Important\
    \ Blog</title>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js\"\
    \n    type=\"text/javascript\" charset=\"utf-8\"></script>\n    <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body\
    \ ng-controller=\"MainCtrl\">\n    <h1>My Important Blog</h1>\n\n    <div id=\"\
    posts\">\n    <h2>{{posts[0].title}}</h2>\n    <p bold-click>{{posts[0].body}}</p>\n\
    \    <p><em>posted on {{posts[0].date|date:'short'}} by {{posts[0].author}}</em></p>\n\
    \    </div>\n</body>\n</html>\n```\n\n如你所见，这是对应用程序用户可见的部分。AngularJS 特定的代码在上文中以蓝色高亮显示。让我们快速说明这六个部分：\n\
    \n- `ng-app=\"blog\"`：这告诉 AngularJS 我们应该启动一个应用程序，该应用程序位于名为\"blog\"的模块中。\n- `ng-controller=\"\
    MainCtrl\"`：这将控制器\"MainCtrl\"的控制权赋予整个应用程序的 `<body>`。\n- `{{posts[0].title}}`：就我们的目的而言，它显示第一篇博客文章的标题。\n\
    - `bold-click`：这使得段落在点击时在粗体和正常字重之间切换；稍后会详细介绍。\n- `{{posts[0].body}}`：显示第一篇文章的正文。\n\
    - `{{posts[0].date|date:'short'}}`：显示第一篇文章的日期并进行格式化。\n- `{{posts[0].author}}`：显示第一篇文章的作者。\n\
    \n在这个视图背后，有一个或多个控制器、过滤器以及内置或自定义指令。在这些之后，是服务和可在整个应用程序中使用的其他组件。构成所有这些的是模块，它定义了一个应用程序（或\
    \ AngularJS 库）。我们将从讨论视图开始。\n\n## 视图\n\n什么是视图？它就是表示层。它是你的标记（通常是 HTML）。它是用户所看到的。它是声明式的——而非命令式的——它本身没有控制流。当你准备实现一个\
    \ AngularJS 应用程序时，我建议先实现视图，然后从那里反向工作。编写尚不工作的指令，但按你想要的方式使用它们——稍后再编写*指令*。在作用域中调用函数并引用不存在的模型——然后再编写*控制器*。因为视图非常具有描述性，它本质上可以为你的实际代码提供蓝图。\n\
    \n你需要设置一些自定义属性——或者更准确地说，指令——来使你的 AngularJS 应用程序正常运行。\n\n- `<html>` 标签上的 `ng-app`：这是\
    \ AngularJS 自动*引导*应用程序的方式。这个 `ng-app` 调用特别初始化了 blog 模块，并使其成为应用程序的主模块。\n\n> **提示\
    \ 引导**\n> 如果你需要在 AngularJS 加载之前执行某些代码，你可以在视图中省略 ng-app，而是在准备好时使用 `angular.bootstrap()`。\n\
    \n- `<body>` 标签上的 `ng-controller`：此指令告诉 AngularJS 初始化名为 `MainCtrl` 的控制器，并使其负责处理\
    \ `<body>` 标签及其内部的*作用域*。\n- `{{花括号}}` 中的内容：目前，你需要理解双花括号中的内容对应于 AngularJS 表达式，在本例中对应于模型，而这些模型位于我们控制器\
    \ `MainCtrl` 的作用域中。花括号的含义是\"计算此表达式并将其作为字符串输出\"。如果你熟悉客户端模板语言和/或 MVC 框架，这不过是从控制器中提取的一些数据。\n\
    - 管道（|）语法：在引用 `posts[0].date` 时使用的管道语法是一个*过滤器*。该过滤器是 AngularJS 内置的 date 过滤器。此过滤器接收参数\
    \ `posts[0].date`，并对其应用转换。在本例中，`posts[0].date` 是一个 JavaScript `Date` 对象。`Date`\
    \ 对象被转换为字符串。`short` 是\"短日期\"的快捷方式，它是过滤器中预配置的格式。此过滤器还允许你以基本上任何你选择的格式输出 Date 对象。\n\
    \n接下来，我们需要一个地方来存放我们的 JavaScript。以下内容包括一个模型、控制器、服务和指令的示例。创建 `blog.js`：\n\n模型通常存储在控制器的作用域对象中，控制器与视图进行通信。视图包含指令，而服务为控制器和指令提供功能，如下所示的\
    \ blog.js：\n\n```javascript\n(function () {\n    'use strict';\n    // Define\
    \ our module. Yes, you need the empty array, or the module() function\n    //\
    \ becomes a \"getter\": angular.module('blog') would RETRIEVE the\n    // module\
    \ instead of DECLARE it.\n    var blog = angular.module('blog', []);\n    // Define\
    \ our main controller.\n    // Our first example of dependency injection; $scope\
    \ and Posts are\n    // automagically injected into the function by AngularJS.\n\
    \    blog.controller('MainCtrl', function ($scope, Posts) {\n        // Retrieve\
    \ the posts from our \"server\". If this succeeds, we'll\n        // put the posts\
    \ into our $scope and do some post-processing.\n        Posts.getPosts().success(function\
    \ (data) {\n            $scope.posts = data.posts;\n            // Let's convert\
    \ our timestamps to JS Date objects\n            var i = $scope.posts.length;\n\
    \            while (i--)\n                $scope.posts[i].date = new Date($scope.posts[i].date\
    \ * 1000);\n        });\n    });\n    // Define our first service; Posts\n   \
    \ // This service simply uses the built-in $http service to retrieve data from\n\
    \    // a static JSON store.\n    blog.service('Posts', function ($http) {\n \
    \       this.getPosts = function () {\n            return $http.get('data.json');\n\
    \        };\n    });\n    // Our first directive. Toggles boldface on node's contents\
    \ when clicked.\n    // We'll cover exactly what a directive is a little later.\n\
    \    blog.directive('boldClick', function() {\n        return function(scope,\
    \ element) {\n            var bold = false;\n            element.bind('click',\
    \ function() {\n                if (bold) {\n                    element.css('font-weight',\
    \ 'normal');\n                } else {\n                    element.css('font-weight',\
    \ 'bold');\n                }\n                bold = !bold;\n            });\n\
    \        };\n    });\n})();\n```\n\n在继续之前，让我们简要说明其中的一些内容：\n\n- 首先，我们定义了一个名为\"\
    blog\"的模块。这个模块与标记中的 `ng-app=\"blog\"` 属性结合后，充当我们的主应用程序。\n- 我们定义了一个名为\"MainCtrl\"\
    的控制器，它为 `<body>` 标签及其内部的视图提供业务逻辑。它使用*依赖注入*（DI）来传入 `$scope` 和 `Posts` 参数。\n- 当\
    \ `MainCtrl` 运行时，它从 `Posts` 服务获取一些文章数据，并对日期对象进行一些后处理。\n"
