  md: '![](img/f95c537c2fc9346a21a144b89cfac580_66_0.png)


    The assertion is made using AngularJS'' `$controller` service. This service allows
    you to instantiate a controller. When unit testing, you''re going to find that
    you often just call this service, pass it the proper parameters, then test the
    contents of the *scope*. You generally don''t need to save a reference to the
    controller unless you are doing fancy things like controller inheritance, which
    I discouraged earlier.


    # ## Conclusion


    Controllers are for your business logic. Keeping your controllers tidy leads to
    dead-easy unit test writing. Best of all, they are not necessarily dependent on
    any view, so you could reuse their functionality across your application. A controller
    is also a common place to instantiate, declare or define models, since 99% of
    controllers will have a `$scope` object available to them.


    In the next chapter we''ll look at directives; truly the component that sets AngularJS
    apart from other frameworks.'
