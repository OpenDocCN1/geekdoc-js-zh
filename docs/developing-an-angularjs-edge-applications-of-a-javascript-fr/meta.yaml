    \ HTTP 请求来获取模板的部分内容。如果这样做，我们就需要能够以异步的方式执行代码，因为获取请求本身必然是异步的。因此，如果我们愿意，可以将这个模板放在一个名为\
    \ `about.html` 的文件中，并将该文件的路径作为 `Modal()` 的第二个参数来指定。当我们想打开模态框时，可以使用 `$http` 服务来获取模板，并在收到后显示它。当\
    \ Promise 解析完成时，我们就确切地知道模态框何时被打开。\n\n`Modal()` 的第一个参数是一个 Scope。我们在这里其实没有真正用到它，但本可以使用。假设我们想在\
    \ `ContentCtrl` 中的某个地方执行 `$scope.name = 'John Jacob Jingleheimer Schmidt';`。当我们编译模态框的模板时，这个\
    \ scope 对我们是可用的，所以我们可以轻松地在模板中放入 `{{name}}`。\n\n![](img/f95c537c2fc9346a21a144b89cfac580_132_0.png)\n\
    \n这只是处理“模态框问题”的一种方法，你可能不像单纯使用标记（markup）并在需要打开或关闭模态框时通过程序切换开关那样喜欢这个解决方案。\n\n##\
    \ AngularJS 与其他第三方应用\n\n几乎任何第三方库都可以与 AngularJS 一起使用——只需付出一点努力。我经常看到有人提到 D3 (http://d3js.org)\
    \ 和 Socket.IO (http://socket.io)，因此让我们来看看如何将它们与 AngularJS 结合使用。\n\n### D3\n\n\
    D3 是一个流行的数据可视化库。虽然 D3 及其用法的复杂性超出了本书的范围，但我们可以拿一个简单的 D3 示例，并将其“Angular 化”。请注意，我的\
    \ D3 功力并不强。\n\n首先，这是我们将要使用的 HTML 和 CSS。\n\n```html\n<div ng-controller=\"MyCtrl\"\
    >\n  <div class=\"chart\" bar-chart=\"data\"></div>\n  <button ng-click=\"randomize()\"\
    >randomize!</button>\n</div>\n<script src=\"http://d3js.org/d3.v2.js\"></script>\n\
    ```\n\n这是 D3 示例的 CSS：\n\n```css\n.chart div {\n  font: 10px sans-serif;\n  background-color:\
    \ steelblue;\n  text-align: right;\n  padding: 3px;\n  margin: 1px;\n  color:\
    \ white;\n}\n```\n\n接下来，是涉及的 JavaScript 代码：\n\n```javascript\nvar myApp = angular.module('myApp',\
    \ []);\n\n// 提供一些数据和一个随机化函数\nmyApp.controller('MyCtrl', function($scope) {\n \
    \ $scope.data = [1, 2, 4, 8, 16, 32];\n\n  // 随机打乱 $scope.data 数组的顺序。\n  $scope.randomize\
    \ = function () {\n    var i = $scope.data.length,\n        tempi, tempj;\n  \
    \  while (--i) {\n      var j = Math.floor(Math.random() * (i + 1));\n      tempi\
    \ = $scope.data[i];\n      tempj = $scope.data[j];\n      $scope.data[i] = tempj;\n\
    \      $scope.data[j] = tempi;\n    }\n  };\n});\n\n// 在标签上放置一个基于 D3 div 的条形图，并在模型变化时更新它。\n\
    myApp.directive('barChart', function () {\n  return function (scope, elm, attrs)\
    \ {\n    var data = scope.$eval(attrs.barChart);\n\n    // 便捷的宽度计算函数\n    function\
    \ width(d) {\n      return d * 10 + 'px';\n    }\n\n    // 获取我们的元素，并根据数据在其中放置一些不同大小的\
    \ div。\n    // 是的，可能还有更优雅的方式来实现这个。\n    d3.select(elm[0])\n      .selectAll('div')\n\
    \      .data(data)\n      .enter()\n      .append('div')\n      .style('width',\
    \ width)\n      .text(angular.identity);\n\n    // 监视数据变化，并用新的宽度更新元素内的 div。\n\
    \    scope.$watch(attrs.barChart, function (new_val, old_val) {\n        if (new_val\
    \ !== old_val) {\n            d3.select(elm[0])\n                .selectAll('div')\n\
    \                .data(new_val)\n                .style('width', width);\n   \
    \     }\n    }, true);\n  };\n});\n```\n\n这并不那么糟糕，对吧？添加一些过渡效果和 SVG，你就能很快地用 D3\
    \ 和 AngularJS 动态更新你的图表了。如果你感兴趣，Brian Ford 提供了一篇出色的博文，其中包含一个更完整的示例：[http://briantford.com/blog/angular-d3.html](http://briantford.com/blog/angular-d3.html)。\n\
    \n### Socket.IO\n\nSocket.IO 允许你轻松地编写针对 Node.JS 服务器的实时 Web 应用程序。虽然配置服务器超出了本文的范围，但我们可以讨论如何在\
    \ AngularJS 的上下文中最佳地使用 Socket.IO。\n\nSocket.IO 提供了一个全局变量 `io`。你可以调用 `io.connect('http://your-server.com')`\
    \ 来获取一个 socket 对象。现在，你就有了一个到你指定的 Node.JS 服务器的持久 socket 连接。让我们提供一个使用 Socket.IO\
    \ 的工厂（factory）。这将让你远离全局作用域（通过依赖注入），并协助消化循环（digest loop）；请记住，非 AngularJS 代码不知道何时触发监视（watches），所以我们必须告诉它。\n\
    \n让我们构建这个工厂，它与 Brian Ford 在 [http://briantford.com/blog/angular-socket-io.html](http://briantford.com/blog/angular-socket-io.html)\
    \ 中提出的方法非常相似：\n\n```javascript\nangular.module('app').factory('connect', function\
    \ ($window, $q) {\n    return function (scope, url) {\n        var socket = $window.io.socket(url);\n\
    \        return {\n            // 对 socket.on() 的包装\n            on: function\
    \ (event) {\n                var dfrd = $q.defer();\n                socket.on(event,\
    \ function () {\n                    var args = arguments;\n                 \
    \   scope.$apply(function () {\n                        dfrd.resolve.apply(dfrd,\
    \ args);\n                    });\n                });\n                return\
    \ dfrd.promise;\n            },\n            // 对 socket.emit() 的包装\n        \
    \    emit: function (event, data) {\n                var dfrd = $q.defer();\n\
    \                socket.on(event, data, function () {\n                    var\
    \ args = arguments;\n                    scope.$apply(function () {\n        \
    \                dfrd.resolve.apply(dfrd, args);\n                    });\n  \
    \              });\n                return dfrd.promise;\n            }\n    \
    \    };\n    };\n});\n```\n\n以及基本用法：\n\n```javascript\nfunction MyCtrl($scope,\
    \ connect) {\n    // 记住：socket 不是一个真正的 Socket.IO socket 对象；它是我们的包装器\n    var socket\
    \ = connect($scope, 'http://localhost.com');\n    socket.on('some_event').then(function()\
    \ {\n        // 做些事情\n    });\n    socket.emit('some_other_event', {foo: 'bar'}).then(function()\
    \ {\n        // 做其他事情\n    });\n}\n```\n\n所以你会注意到，我们在这里使用的是 Promise 而不是回调函数；Socket.IO\
    \ 使用回调函数，但我们可以完全避免它们。\n\n接下来，我们将讨论另一个流行的单元测试框架——QUnit。\n\n## 使用 QUnit 测试 AngularJS\n\
    \n你并不一定要使用 Jasmine 来对 AngularJS 代码进行单元测试。只需进行一些简单的设置，你就可以同样轻松地使用 QUnit 或其他库（如\
    \ Mocha）。\n\n以下是使用 QUnit 测试每种组件的示例：\n\n```javascript\nvar myApp = angular.module('myApp',\
    \ []);\n\nmyApp.controller('MyCtrl', function($scope) {\n    $scope.addTwo = function(n)\
    \ {\n        return n + 2;\n    };\n});\n\nmyApp.service('MyService', function()\
    \ {\n    this.addThree = function(n) {\n        return n + 3;\n    };\n});\n\n\
    myApp.directive('myDirective', function() {\n    return {\n        link: function(scope,\
    \ elm, attrs) {\n            scope.$watch(attrs.myDirective, function(value) {\n\
    \                elm.text(value + 4);\n            });\n        }\n    }\n});\n\
    \nmyApp.filter('myfilter', function() {\n    return function(s) {\n        return\
    \ s + 5;\n    };\n});\n```\n\n以及测试：\n\n```javascript\nvar injector = angular.injector(['ng',\
    \ 'myApp']);\n\nvar init = {\n    setup: function() {\n        this.$scope = injector.get('$rootScope').$new();\n\
    \    }\n};\n\nmodule('tests', init);\n\ntest('MyCtrl', function() {\n    var $controller\
    \ = injector.get('$controller');\n    $controller('MyCtrl', {\n        $scope:\
    \ this.$scope\n    });\n    equal(3, this.$scope.addTwo(1));\n});\n\ntest('MyService',\
    \ function() {\n    var MyService = injector.get('MyService');\n    equal(4, MyService.addThree(1));\n\
    });\n\ntest('MyDirective', function() {\n    var $compile = injector.get('$compile');\n\
    \    var element = $compile('<div my-directive=\"foo\"></div>')(this.$scope);\n\
    \    this.$scope.foo = 1;\n    this.$scope.$apply();\n    equal(5, element.text());\n\
    \    delete this.$scope.foo;\n});\n\ntest('MyFilter', function() {\n    var $filter\
    \ = injector.get('$filter');\n    equal(6, $filter('myfilter')(1));\n});\n```\n"
