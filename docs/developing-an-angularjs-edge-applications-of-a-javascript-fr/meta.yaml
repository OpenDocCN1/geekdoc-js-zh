  md: "# # Unit Testing\n\nYou can write unit test controllers, and you should. It's\
    \ very easy. Here's an example of testing our controller using Jasmine:\n\n```\n\
    /*Global beforeEach, Describe, afterEach, Describe, module, expect, it, inject*/\n\
    (function () {\n\t'use strict';\n\t// grade the blog module before each test\n\
    \tbeforeModule('blog');\n\tdescribe('Blog Controller', function () {\n\t\tvar\
    \ $controller; // controller needs scope, so here's ours\n\t\t$controller = //\
    \ controller service to instantiate controllers\n\n\t\tbeforeEach(inject(function\
    \ ($injector, $rootScope) {\n\t\t\tscope = $rootScope.scope; // make brand new\
    \ child scope off of root\n\t\t\t$controller = $injector.get('$controller');\n\
    \t\t}));\n\n\t\tafterEach(function () {\n\t\t\tscope.$destroy(); // eliminate\
    \ our scope after each test run\n\t\t});\n\n\t\tdescribe('HeadCtrl', function\
    \ () {\n\t\t\t// all that HeadCtrl does is set a description. That's pretty easy\
    \ to test.\n\t\t\tit('should set the description', function () {\n\t\t\t\t$controller('HeadCtrl',\
    \ {scope: scope});\n\t\t\t\texpect(scope.description).toBe('My Important Blog');\n\
    \t\t\t});\n\t\t});\n\t});\n})();\n```\n\nAgain, to run this you will need a working\
    \ Testacular install with proper configuration file. There is very little interesting\
    \ about this configuration file, on the main, except the files array. Mine looks\
    \ similar to this:\n\n```\n\"files\": [\n\t'JASMINE',\n\t'JASMINE_ADAPTER',\n\t\
    '/path/to/blog/angular-min.js',\n\t'/path/to/blog/angular.mocks.js',\n\t'/path/to/blog/blog.js',\n\
    \t'/path/to/blog/blogSpec.js'\n]\n```\n\nNote that we must explicitly include\
    \ AngularJS and the mocks module. Next, we include the code to be tested, and\
    \ finally the test file itself.\n\nThis file reads a little like a sentence, which\
    \ should help you to understand what's going on even if you are completely new\
    \ to unit testing. In a nutshell, the test (not the configuration file) declares,\
    \ \"The Blog Controllers' HeadCtrl should set the description to an explicit string.\"\
    \ We need to do a little setup before each test we run in order to get the proper\
    \ objects to test. Also, we do some cleanup afterwards. This is typical of constructing\
    \ unit test fixtures."
