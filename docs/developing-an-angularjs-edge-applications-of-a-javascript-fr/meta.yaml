    \ oldval) {\n  if (newval !== oldval) {\n    $scope.someFunction(newval);\n  }\n\
    });\n```\n\n```\n// this watch will fire if the object on the scope is reassigned\
    \ or loses its reference OR\n// if an object member changes. more expensive\n\
    $scope.$watch('some_object', function(newval, oldval) {\n  if (newval !== oldval)\
