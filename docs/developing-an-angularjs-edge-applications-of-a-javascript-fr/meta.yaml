- md: "## Adding Our Filter\n\nLet's add a filter to our blog application. Here's\
    \ something trivial that you can do with CSS, but if you don't want to for some\
    \ reason, you can use a filter:\n\n```\n// capitalizes the first letter of a string\n\
    blog.filter('capitalize', function () {\n  return function (s) {\n    if (!s ||\
    \ !angular.isString(s)) {\n      return s;\n    }\n    return s.charAt(0).toUpperCase()\
    \ + s.substring(1);\n  };\n});\n```\n\nNow if we have something in the view that\
    \ needs capitalizing, just write `{{something|capitalize}}`; problem solved. You'll\
    \ notice that we evaluate the truthiness of `s` and its stringness; if we're passed\
    \ an empty string or a non-string we'll just do nothing and return what we were\
    \ passed. I like this pattern of writing filters, but others may disagree.\n\n\
    A filter is very simple and is *most* useful within the view. You can get at any\
    \ filter via the `$filter` service anywhere you can inject it, but the syntax\
    \ can look a little strange:\n\n```\n// $filter was injected somewhere\nvar filtered_array\
    \ = $filter('filter')(unfiltered_array, function some_function() { ... });\n```\n\
    \nStill, this is a small price to pay for having them all at your fingertips.\
    \ Let's write a trivial filter that takes an extra parameter and returns something\
    \ (that is about as complex as filters get):\n\n```\nsome_module.filter('myFilter',\
    \ function() {\n  return function(a, b, c) {\n    return a + b + c;\n  };\n});\n\
    ```\n\nAnd used in the view:\n\n```\n<h1>Hi, I Like Dinosaurs. I have {{male_dino_count|myFilter:female_dino_count:dino_egg_count}}\
    \ of them in this paper bag.</h1>\n```\n\nThe way it works is that parameter `a`\
    \ is the expression on the left side of the `|`, the filter name is immediately\
    \ after the `|`, and parameter `b` is the expression after the first `:`, and\
    \ parameter `c` is the expression after the second:\n\n![](img/f95c537c2fc9346a21a144b89cfac580_99_0.png)\n\
    \nThe above is obviously a drawing of a bag full of male and female dinosaur eggs.\
    \ Filters can accept any type of parameter, but most commonly they are used on\
    \ strings and arrays. This example above works on strings (numbers, even), but\
    \ we can just as easily modify an array with one:\n\n```\nsome_module.filter('myArrayTakingFilter',\
    \ function() {\n    return function(a) {\n        return a.slice(0, 3) + '...'\
    \ + a.slice(-3);\n    };\n});\n```\n\nThis just takes an array and returns a new\
    \ array with the first and last three items of the original array, separated by\
    \ an ellipsis. This might be handy if you have to display an array and have limited\
    \ on-screen space for it.\n\n## Unit Tests\n\nHere's an example of unit testing\
    \ a filter, using our blog application's filter as an example:\n\n```\ndescribe('Blog\
    \ Filters', function () {\n    var $filter;\n\n    beforeEach(inject(function\
    \ ($$filter) {\n        $filter = $$filter;\n    }));\n\n    describe('the capitalize\
    \ filter', function () {\n        it('should capitalize a string, naturally',\
    \ function () {\n            var capitalize = $filter('capitalize');\n       \
    \     expect(capitalize('foo')).toBe('Foo');\n        });\n    });\n});\n```\n\
    \n## Conclusion\n\nA filter is a (hopefully) simple function that takes a model\
    \ a view has, and makes it a little easier for the view to digest the model, or\
    \ otherwise alters the appearance of the model. Filters are meant to be superficial\
    \ and should probably not have side effects. They can be used outside of the context\
    \ of a view, though this is less typical. You want to write a filter when you\
    \ find you're massaging data in a controller, just for the sake of a view. Keep\
    \ in mind though that filters get executed often, and for performance reasons\
    \ it's best to keep them simple. Also, your filters are meant to simply munge\
    \ data in the view—don't write filters that have side-effects!\n\nSo far during\
    \ the course of this book we've talked AngularJS theory—now let's get on to applied\
    \ science in the next chapter.\n\n# Chapter 9. Practical Applications\n\nFrom\
    \ here on we'll present more examples of AngularJS in the real world. We'll find\
    \ some common problems and present solutions the AngularJS way. Some will be very\
    \ basic and others will be more complex.\n\n## Ajax\n\nAngularJS has two services\
    \ for handling Ajax requests. The first, `$resource`, is highly abstracted and\
    \ tailor-made for RESTful applications. The second, `$http`, is lower-level and\
    \ will do just about anything. The general recommendation is to use `$resource`\
    \ (don't forget to include the `ngResource` module!) if your REST API is simple.\n\
    \n### $resource Service\n\nLet's say we have a REST API. Doing a GET request against\
    \ /donut/foo will return you the Donut object with ID \"foo\". POSTing to this\
    \ URL will \"save\" the Donut object. DELETE-ing to this URL will delete. A GET\
    \ request to /donuts/ will give you all of the Donut objects. Here's an example\
    \ of doing some operations against this backend returning JSON, using the `$resource`\
    \ service from the `ngResource` module:\n\n```\n// $resource returns a Resource\
    \ object. The second parameter describes the parameters to the resource call.\n\
    // Here, specify a :id in the URL and tell AngularJS to insert the value of the\
    \ 'donutId' string in the\n// URL when making a request. This assumes that the\
    \ server will return a collection of donuts at the \"/donut/\" URL,\n// and if\
    \ an ID is specified (\"/donut/foo\") then it will only return that particular\
    \ donut.\nvar Donut = $resource('/donut/:id', {id: '@donutId'});\n// use this\
    \ object to query. Note that powdered_donut is immediately undefined after this\
    \ line executes, because\n// 'get' is an asynchronous operation. Some magic happens,\
    \ however, and when the item is retrieved from the server,\n// the value of powdered_donut\
    \ is populated.\n// Functions named Donut.foo() are \"class\" functions, and the\
    \ returned value of these functions\n// is considered an instance of Donut. Donut.save()\
    \ and donut.$save() do basically the same thing; the former requires\n// more\
    \ parameters.\n// this is an HTTP GET.\nvar powdered_donut = Donut.get({donutId:\
    \ 'powdered'}, function(donut) {\n    // optional success callback stuffed with\
    \ donut. Will have the same value as powdered_donut when this resolves.\n    //\
    \ this\n    powdered_donut.sold_out = donut;\n    powdered_donut.$save(); // HTTP\
    \ POST; note that AngularJS' prefixing with \"$\" is to avoid clobbering your\
    \ namespace\n```\n\n```\n    // or you could just HTTP DELETE the donut\n    //\
    \ powdered_donut.$delete();\n}, function(error) {\n    // optional failure callback\n\
    });\n```\n\n```\n// this is an HTTP DELETE to /donut/glazed.\n// if we had retrieved\
    \ the glazed donut using get(), then we could delete it using the $delete() function.\
    \ Same thing.\nDonut.delete({donutId: 'glazed'}, function(donut) {\n    // optional\
    \ callback if we successfully deleted\n}, function(error) {\n    // optional failure\
    \ callback\n});\n// get all donuts. HTTP GET; query returns a promise that will\
    \ resolve to the same value as the donut parameter.\nvar all_donuts = Donut.query(function(donuts)\
    \ {\n    // optional success callback\n}, function(error) {\n    // optional failure\
    \ callback\n});\n// HTTP POST. can use $save on actual\nDonut.save({donutId: 'pepto'},\
    \ {id: 'pepto', cost: '1.23'}, function(donut) {\n    // successful save\n}, function(error)\
    \ {\n    // unsuccessful save\n});\n```\n\n### But Donut.get() just returns undefined\
    \ and I want to do something with the result! Can I make $resource synchronous?\n\
    \nNo. You cannot make `$resource` synchronous. Use the \"success\" callback function\
    \ to do whatever you want to with the result of `Donut.get()`. If it bothers you\
    \ that much, you don't have to do this:\n\n```\n$scope.foo = Foo.get({bar: 'baz'});\n\
    ```\n\nYou can do this instead:\n\n```\nFoo.get({bar: 'baz'}, function(foo) {\n\
    \    $scope.foo = foo;\n});\n```\n\nThey do the same thing. This is almost always\
    \ confusing to those new to AngularJS. In the end it simply provides you some\
    \ syntactic sugar.\n\n### $http Service\n\nIf you don't have a RESTful server\
    \ you're talking to, you are going to use the $http service. Think of this as\
    \ akin to jQuery's `$.ajax` function. You can initiate a HTTP GET request like\
    \ so:\n\n```\n$http({\n    method: 'GET',\n    url: '/pigs/and/chickens/',\n \
    \   data: {\n        cows: 'horses'\n    },\n    params: {\n        sheepdogs:\
    \ 'mules'\n    },\n    headers: {\n        'X-Farm-Animals': 1.0\n    }\n}).success(function(data)\
    \ {\n    // do stuff with response data; AngularJS will try to give you a JS object\
    \ if it detects JSON\n}).error(function(data) {\n    // handle non-200 response\
    \ codes\n});\n```\n\nThis will make a HTTP GET request to /pigs/and/chickens/?sheepdogs=mules\
    \ with request payload `{\"cows\": \"horses\"}`, with special header X-Farm-Animals.\
    \ After the request has completed, the data will be passed to a success or error\
    \ callback, depending on what the server responded with.\n\nThere is some sugar\
    \ in place to make these calls a *little* less unwieldy; an identical GET request\
    \ can be made this way:\n\n```\n$http.get('/pigs/and/chickens', {cows: 'horses'},\
    \ {\n    params: {\n        sheepdogs: 'mules'\n    },\n    headers: {\n     \
    \   'X-Farm-Animals': 1.0\n    }\n}).success(function(data) {\n    // do stuff\
    \ with response data; AngularJS will try to give you a JS object if it detects\
    \ JSON\n}).error(function(data) {\n    // handle non-200 response codes\n});\n\
    ```\n\nYou can see in the Posts service that we have a function, `getPosts`, which\
    \ calls `$http` like so:\n\n```\nblog.service('Posts', function ($http) {\n  \
    \  this.getPosts = function () {\n        return $http.get('data.json');\n   \
    \ };\n});\n```\n\nCalling `Posts.getPosts()` will make a simple call to the file\
    \ at the data.json URL. The function returns the value of `$http.get()`, which\
    \ is *not* the data it retrieved; it returns a"
  mdcn: "\n## 添加我们的过滤器\n\n让我们为博客应用添加一个过滤器。下面是一个简单的例子，你完全可以用 CSS 实现，但如果出于某种原因你不想这样做，可以使用过滤器：\n\
    \n```\n// capitalizes the first letter of a string\nblog.filter('capitalize',\
    \ function () {\n  return function (s) {\n    if (!s || !angular.isString(s))\
    \ {\n      return s;\n    }\n    return s.charAt(0).toUpperCase() + s.substring(1);\n\
    \  };\n});\n```\n\n现在，如果视图中有需要首字母大写的内容，只需写 `{{something|capitalize}}`；问题就解决了。你会注意到，我们评估了\
    \ `s` 的真值及其字符串类型；如果我们接收到空字符串或非字符串，我们什么也不做，直接返回传入的值。我喜欢这种编写过滤器的模式，但其他人可能不同意。\n\n\
    过滤器非常简单，且*最*适合在视图中使用。你可以在任何可以注入 `$filter` 服务的地方通过它来获取任何过滤器，但语法可能看起来有点奇怪：\n\n```\n\
    // $filter was injected somewhere\nvar filtered_array = $filter('filter')(unfiltered_array,\
    \ function some_function() { ... });\n```\n\n尽管如此，能够随时随地使用它们，这点小代价是值得的。让我们编写一个简单的过滤器，它接受一个额外的参数并返回一些结果（过滤器的复杂度大概也就这样了）：\n\
    \n```\nsome_module.filter('myFilter', function() {\n  return function(a, b, c)\
    \ {\n    return a + b + c;\n  };\n});\n```\n\n在视图中使用：\n\n```\n<h1>Hi, I Like Dinosaurs.\
    \ I have {{male_dino_count|myFilter:female_dino_count:dino_egg_count}} of them\
    \ in this paper bag.</h1>\n```\n\n其工作原理是：参数 `a` 是 `|` 左侧的表达式，过滤器名称紧跟在 `|` 之后，参数\
    \ `b` 是第一个 `:` 之后的表达式，参数 `c` 是第二个 `:` 之后的表达式：\n\n![](img/f95c537c2fc9346a21a144b89cfac580_99_0.png)\n\
    \n上图显然是一个装满雄性和雌性恐龙蛋的袋子。过滤器可以接受任何类型的参数，但最常用于字符串和数组。上面的例子适用于字符串（甚至数字），但我们也可以同样轻松地用过滤器修改数组：\n\
    \n```\nsome_module.filter('myArrayTakingFilter', function() {\n    return function(a)\
    \ {\n        return a.slice(0, 3) + '...' + a.slice(-3);\n    };\n});\n```\n\n\
    这个过滤器接收一个数组，并返回一个新数组，其中包含原数组的前三项和后三项，中间用省略号连接。如果你需要显示一个数组，而屏幕空间有限，这可能会很方便。\n\n\
    ## 单元测试\n\n这是一个使用我们博客应用过滤器进行过滤器单元测试的示例：\n\n```\ndescribe('Blog Filters', function\
    \ () {\n    var $filter;\n\n    beforeEach(inject(function ($$filter) {\n    \
    \    $filter = $$filter;\n    }));\n\n    describe('the capitalize filter', function\
    \ () {\n        it('should capitalize a string, naturally', function () {\n  \
    \          var capitalize = $filter('capitalize');\n            expect(capitalize('foo')).toBe('Foo');\n\
    \        });\n    });\n});\n```\n\n## 结论\n\n过滤器是一个（希望是）简单的函数，它接收视图所拥有的模型，并使视图更容易理解模型，或者以其他方式改变模型的外观。过滤器应该是表面的，不应该有副作用。它们可以在视图上下文之外使用，但这不太常见。当你发现自己在控制器中为了视图而处理数据时，你就应该编写过滤器。但请记住，过滤器会频繁执行，出于性能考虑，最好保持它们简单。另外，你的过滤器旨在简单地在视图中处理数据——不要编写有副作用的过滤器！\n\
    \n到目前为止，在本书中我们讨论了 AngularJS 的理论——现在让我们在下一章进入应用科学。\n\n# 第9章. 实际应用\n\n从这里开始，我们将介绍更多\
    \ AngularJS 在现实世界中的示例。我们将找到一些常见问题，并以 AngularJS 的方式提出解决方案。有些会非常基础，有些则会更复杂。\n\n\
    ## Ajax\n\nAngularJS 有两个处理 Ajax 请求的服务。第一个是 `$resource`，它是高度抽象的，专为 RESTful 应用量身定制。第二个是\
    \ `$http`，它更底层，几乎可以做任何事情。一般建议是，如果你的 REST API 很简单，就使用 `$resource`（别忘了包含 `ngResource`\
    \ 模块！）。\n\n### $resource 服务\n\n假设我们有一个 REST API。对 /donut/foo 发起 GET 请求会返回给你 ID\
    \ 为 \"foo\" 的 Donut 对象。POST 到这个 URL 会“保存”Donut 对象。DELETE 这个 URL 会删除它。GET 请求到 /donuts/\
    \ 会给你所有的 Donut 对象。下面是一个使用 `ngResource` 模块中的 `$resource` 服务对这个返回 JSON 的后端进行一些操作的示例：\n\
    \n```\n// $resource 返回一个 Resource 对象。第二个参数描述了资源调用的参数。\n// 这里，在 URL 中指定 :id，并告诉\
    \ AngularJS 在发出请求时将 'donutId' 字符串的值插入到\n// URL 中。这假定服务器将在 \"/donut/\" URL 返回一个甜甜圈集合，\n\
    // 如果指定了一个 ID（\"/donut/foo\"），则只返回那个特定的甜甜圈。\nvar Donut = $resource('/donut/:id',\
    \ {id: '@donutId'});\n// 使用这个对象进行查询。注意，执行完这行代码后 powdered_donut 会立即变为 undefined，因为\n\
    // 'get' 是一个异步操作。然而，当项目从服务器检索到后，会发生一些魔法，powdered_donut 的值会被填充。\n// 名为 Donut.foo()\
    \ 的函数是“类”函数，这些函数的返回值\n// 被视为 Donut 的一个实例。Donut.save() 和 donut.$save() 基本上做同样的事情；前者需要\n\
    // 更多的参数。\n// 这是一个 HTTP GET。\nvar powdered_donut = Donut.get({donutId: 'powdered'},\
    \ function(donut) {\n    // 可选的成功回调函数，接收甜甜圈。当此操作完成时，它将与 powdered_donut 具有相同的值。\n\
    \    // 这\n    powdered_donut.sold_out = donut;\n    powdered_donut.$save(); //\
    \ HTTP POST；注意 AngularJS 使用 \"$\" 前缀是为了避免与你的命名空间冲突\n```\n\n```\n    // 或者你可以直接\
    \ HTTP DELETE 甜甜圈\n    // powdered_donut.$delete();\n}, function(error) {\n  \
    \  // 可选的失败回调函数\n});\n```\n\n```\n// 这是一个对 /donut/glazed 的 HTTP DELETE 请求。\n//\
    \ 如果我们之前使用 get() 检索了 glazed 甜甜圈，那么我们可以使用 $delete() 函数删除它。效果一样。\nDonut.delete({donutId:\
    \ 'glazed'}, function(donut) {\n    // 如果成功删除，则可选的回调函数\n}, function(error) {\n\
    \    // 可选的失败回调函数\n});\n// 获取所有甜甜圈。HTTP GET；query 返回一个 promise，它将解析为与 donut 参数相同的值。\n\
    var all_donuts = Donut.query(function(donuts) {\n    // 可选的成功回调函数\n}, function(error)\
    \ {\n    // 可选的失败回调函数\n});\n// HTTP POST。可以在实际对象上使用 $save\nDonut.save({donutId:\
    \ 'pepto'}, {id: 'pepto', cost: '1.23'}, function(donut) {\n    // 保存成功\n}, function(error)\
    \ {\n    // 保存失败\n});\n```\n\n### 但是 Donut.get() 只返回 undefined，而我想对结果做点什么！我能让\
    \ $resource 同步吗？\n\n不能。你不能让 `$resource` 同步。使用“成功”回调函数来处理 `Donut.get()` 的结果。如果这真的很困扰你，你不必这样做：\n\
    \n```\n$scope.foo = Foo.get({bar: 'baz'});\n```\n\n你可以这样做：\n\n```\nFoo.get({bar:\
    \ 'baz'}, function(foo) {\n    $scope.foo = foo;\n});\n```\n\n它们做同样的事情。这对于 AngularJS\
    \ 的新手来说几乎总是令人困惑的。最终，它只是为你提供了一些语法糖。\n\n### $http 服务\n\n如果你没有与 RESTful 服务器通信，那么你将使用\
    \ $http 服务。可以把它看作类似于 jQuery 的 `$.ajax` 函数。你可以这样发起一个 HTTP GET 请求：\n\n```\n$http({\n\
    \    method: 'GET',\n    url: '/pigs/and/chickens/',\n    data: {\n        cows:\
    \ 'horses'\n    },\n    params: {\n        sheepdogs: 'mules'\n    },\n    headers:\
    \ {\n        'X-Farm-Animals': 1.0\n    }\n}).success(function(data) {\n    //\
    \ 处理响应数据；如果检测到 JSON，AngularJS 会尝试给你一个 JS 对象\n}).error(function(data) {\n    //\
    \ 处理非 200 的响应码\n});\n```\n\n这将向 /pigs/and/chickens/?sheepdogs=mules 发起一个 HTTP\
    \ GET 请求，请求体为 `{\"cows\": \"horses\"}`，并带有特殊头部 X-Farm-Animals。请求完成后，根据服务器的响应，数据将传递给成功或错误回调函数。\n\
    \n这里有一些语法糖，可以让这些调用看起来*稍微*不那么笨拙；同样的 GET 请求可以这样完成：\n\n```\n$http.get('/pigs/and/chickens',\
    \ {cows: 'horses'}, {\n    params: {\n        sheepdogs: 'mules'\n    },\n   \
    \ headers: {\n        'X-Farm-Animals': 1.0\n    }\n}).success(function(data)\
    \ {\n    // 处理响应数据；如果检测到 JSON，AngularJS 会尝试给你一个 JS 对象\n}).error(function(data)\
    \ {\n    // 处理非 200 的响应码\n});\n```\n\n你可以在 Posts 服务中看到，我们有一个函数 `getPosts`，它这样调用\
    \ `$http`：\n\n```\nblog.service('Posts', function ($http) {\n    this.getPosts\
    \ = function () {\n        return $http.get('data.json');\n    };\n});\n```\n\n\
    调用 `Posts.getPosts()` 将对 data.json URL 的文件进行一个简单的调用。该函数返回 `$http.get()` 的值，这*不是*它检索到的数据；它返回一个\n"
