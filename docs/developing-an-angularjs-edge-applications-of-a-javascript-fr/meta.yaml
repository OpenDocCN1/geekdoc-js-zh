    # What is an AngularJS expression?


    It''s a JavaScript-ish bit of code that AngularJS understands and processes. Anything
    that looks like JavaScript within your view is not JavaScript; it''s an Angular
    expression. As such, not all JavaScript is a valid expression! Expressions are
    evaluated against scopes; if you have an expression `foo = ''bar''`; the string
    `foo` in the current scope will be assigned the value of "bar". Expressions do
    not deal with `undefined` and `null` values as JavaScript does; given something
    like `ng-show="foo.bar"`; if foo is undefined, you will not receive an error.
    The operators `===` and `!==` are not necessary; stop worrying about it. You can
    *not* use any conditionals, loops, or exceptions within AngularJS expressions.
    Finally, you can use filters with the `|` (pipe) operator. AngularJS expression
    language is in development; look for more features in the future.


    Of utmost importance to understand is that there is a root scope from which all
    scopes inherit, and all scopes inherit prototypically from their parent scope
    by default. If you set something on the root scope of the application (you can
    get at this via the `$rootScope` service), it will be available to all non-isolate
    scopes (an *isolate scope* is used in certain directives and does *not* inherit
    from its parent, on purpose, in order to not pollute or otherwise overstep its
    bounds) within the application, no matter where they are. If you need a `debug()`
    function (or something; consider the `$log` service for debugging) available *everywhere*
    in the view, put it on the root scope. If you don''t need it everywhere, please
    do not abuse the root scope.


    Scopes are simply JavaScript objects, but they have special functions. Here are
    overviews of some of the more useful ones:


    +   - `$apply`: Executes an AngularJS expression from outside of the framework,
    and typically used in directives. If you have a 3rd library that needs to set
    a model, you *must* wrap that assignment in a call to `$apply` or AngularJS will
    fail to recognize the change happened, and all sorts of nothing will occur. Watches
    will not fire, promises will not get resolved, etc., etc.

    - `$watch`: Watches/observes an AngularJS expression; if that expression changes,
    the function you pass to `$watch` will fire. The function will receive "new" and
    "old" parameters. There is an optional 3rd argument to a `$watch`; since, by default,
    `$watch` evaluates by reference, certain expressions may not trigger a watch function
    like you think they would. For example, say you had a watch on the expression
    `foo`. If `foo` is reassigned to a new object, the watch will fire. However, if
    there is an object member `bar` and it changes, the watch will not fire. The inner
    object changed, yes, but there was no change in reference. If you want to evaluate
    *by value* (a much more expensive operation; use wisely!), supply `true` as the
    third parameter to the `$watch` call. Note that when you define a `$watch` for
    the first time, its listener function will be called asynchronously, so it''s
    often necessary to do a comparison between the two parameters as the first line
    of your listener function if that value is set asynchronously.

    - `$eval`: Evaluates an expression against the scope and returns its value. Useful
