  - "[PAGE 81]\n\n# # More About Directives\n\nA directive either is some sort of\
    \ HTML element (or comment) or it attaches itself to one. Directives don't make\
    \ sense without HTML elements. If you want to interact with an HTML element, try\
    \ using a directive. If you are doing anything else, don't.\n\nDirectives cannot\
    \ directly \"include\" linking or compilation functions from other directives.\
    \ They are not injectable. If you think you need to inject a directive, you're\
    \ doing it wrong. Instead, you may write some HTML using the directive that actually\
    \ calls another directive. An example of this is the accordion \"widget\" from\
    \ earlier, which I'll repeat here:\n\n```\nblog.directive('accordion', function()\
    \ {\n  return {\n    restrict: 'E',\n    replace: true,\n    template: '<div class=\"\
