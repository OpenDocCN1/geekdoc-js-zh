  md: "# # Adding Functionality to Our Controller\n\nNow that we have a nice view,\
    \ we need to add some functionality to our controller(s) to support our new markup.\
    \ The new stuff displayed a couple of blog posts and gave you a way to create\
    \ a new one, among other things. Let's see how that works behind-the-scenes:\n\
    \n```\n// Header controller presents a description for the blog\nblog.controller('HeadCtrl',\
    \ function ($scope) {\n    $scope.description = 'My important Blog';\n});\n//\
    \ Controls the blog content including all methods related to posts\nblog.controller('ContentCtrl',\
    \ function ($scope, Posts) {\n    // Retrieve the posts from our \"server\". If\
    \ this succeeds, we'll\n    // put the posts into our $scope and do some post-processing.\n\
    \    Posts.getPosts().success(function (data) {\n        var posts;\n        $scope.posts\
    \ = data.posts;\n        posts = $scope.posts;\n        // Convert timestamps\
    \ to JS timestamps (w/ millisecond precision)\n        var i = posts.length;\n\
    \        while (i--) {\n            posts[i].date = posts[i].date * 1000;\n  \
    \      }\n    });\n    // This closes all editors if we happen to click the \"\
    new post\" button\n    $scope.$watch('posts', function (new_val, old_val) {\n\
    \        var i;\n        if (new_val !== old_val) {\n            i = new_val.length;\n\
    \            while (i--) {\n                new_val[i].editing = false;\n    \
    \        }\n        }\n    });\n});\n```\n\nThe controller is continued below,\
    \ but I wanted to stop and point out that the code that's written above is executed\
    \ as soon as the controller is instantiated—that is to say, the HTML that the\
    \ controller is attached to is rendered. Every time this controller is instantiated\
    \ it'll grab the posts and set up a \"watch.\" What follows are simply functions\
    \ to be called later, generally by the view.\n\nAbove, we've defined a new controller\
    \ called `HeadCtrl`, which we referenced in the markup from the previous chapter.\
    \ We renamed `MainCtrl` to `ContentCtrl`, and added something called a **watch**\
    \ to the `$scope` object. Essentially, this observes the state of an AngularJS\
    \ expression, and executes code when that state changes. Specifically, when we\
    \ go to create a new post, we disable the \"editing\" state of all other post\
    \ objects.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_60_0.png)\n\nLet's continue\
    \ looking at the Controllers:\n\n```\n// Begins editing a post by making a temporary\
    \ copy of the title and body,\n// and setting the \"editing\" flag for that post\
    \ to be true.\n$scope.edit = function (post) {\n    post.temp = {\n        title:\
    \ post.title,\n        body: post.body\n```"
