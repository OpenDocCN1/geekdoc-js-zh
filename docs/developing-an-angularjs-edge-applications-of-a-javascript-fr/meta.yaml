  md: '# Under the Hood


    Compilation in AngularJS is a two-step process. Consider the $compile service,
    and a raw, unprocessed AngularJS template named template:


    ```

    var linker = $compile(template);

    ```


    The above represents the first phase of the compilation process; the “compile”
    step (confusing, I know). What happens here is the template is examined for directives.
    AngularJS collects them together and produces a linking function (directives may
    specify a compile function of their own to be specified during this step). At
    this point, no data has been inserted into the template. Then, we execute the
    linker function against a scope, which is the “link” phase:


    ```

    var compiled = linker(scope);

    ```


    This phase passes a scope and its data into the link function of each directive.
    What we get back from linker is an AngularJS element representing our DOM fragment.
    We can then happily insert this element into the page’s DOM, or whatever we wish
    to do with it. Frequently when using the $compile service, you’ll be doing both
    phases at once: $compile(template)(scope).


    The same thing happens when AngularJS encounters your markup for the first time.
    It scans all of the markup for directives, creates a link function made of all
    of the directives’ link functions, then executes that function using the appropriate
    scope.


    The reason for these two phases is simply one of performance. By compiling once
    and linking as the data-binding mechanism executes, we save rerendering a gigantic
    chunk of markup (your raw, unprocessed template) that won’t change.


    ![](img/f95c537c2fc9346a21a144b89cfac580_58_0.png)


    # Unit Testing The View


    > You will likely want to be writing functional tests for your views, not unit
    tests. A tool like Selenium (http://seleniumhq.org) is well-suited for this task,
    but as I mentioned earlier, we’re not going to cover functional tests as they
    are beyond the scope of this book.


    # Conclusion


    The view is simply the presentation logic for AngularJS. It integrates models,
    directives, filters and serves as the primary point of interface into your application.
    If someone needs to “save”, they do so by clicking a button; not typing a command
    into their JS console! Though I suppose you could write a text adven…oh, nevermind.


    Next we’ll cover the controller, where business logic lives.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# # Chapter 5. The Controller in Detail


    The controller is where your business logic lives. To define business logic, let’s
    say it’s the layer between your UI and your data store, and any algorithms needed
    to support that. What a controller isn’t, is a place to put DOM modification code.
    The controller doesn’t know about the DOM, and should be decoupled from the view.
    Why is it then that other JavaScript frameworks want you to do exactly what I’m
    telling you not to do? I think the answer lies along the lines of “there’s nowhere
    else to put it.” With AngularJS, we DO have a place to put it, and not a controller
    (it’s a directive, which we will explore later).'
