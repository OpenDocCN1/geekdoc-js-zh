    \ a request that can be parsed into JSON, it will give you the resulting JavaScript\
    \ object back.\n\nIf you are not working in JSON, simply pass a string as the\
    \ data. Maybe you are working with XML and the server expects it and sends it\
    \ back. For example:\n\n```\n$http.get('/some/xml/service', '<foo><bar>baz</bar></foo>')\n\
    .success(function(data) {\n    // data is now an XML string.\n    // parse your\
    \ XML here and wonder why you are not working with JSON\n});\n```\n\nThis covers\
    \ JSON and XML (or any plain string data). What if your server wants x-www-form-urlencoded\
    \ data? The JSFiddle ([http://jsfiddle.net](http://jsfiddle.net)) /echo service\
