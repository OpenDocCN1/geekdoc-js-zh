  mdcn: "\n创建一个`updateDate()`函数，它将`Post`对象的\"date\"属性设置为`now`。我们有一个`save()`函数，它替代了之前版本`ContentCtrl`中的大部分\"\
    save\"功能。我们的`stopEditing()`函数只是翻转\"editing\"标志并重置临时对象。最后，如果我们想查看`Post`对象的字符串表示（使用`toString()`），简单地输出其JSON表示是非常方便的。\n\
    \n接下来是一个实际使用此服务的控制器。\n\n```javascript\n// Controls the blog content including\
    \ all methods related to posts\nblog.controller('ContentCtrl', function ($scope,\
    \ Posts, Post) {\n\n    // util function to stop editing all of the posts\n  \
    \  $scope._stopEditingAllPosts = function (posts) {\n        var i;\n        if\
    \ (angular.isArray(posts)) {\n            for (i = 0; i < posts.length; i++) {\n\
    \                posts[i].stopEditing();\n            }\n        }\n    };\n\n\
    \    // Retrieve the posts from our “server”. If this succeeds, we’ll\n    //\
    \ put the posts into our $scope and do some post-processing.\n    Posts.getAll().success(function\
    \ (data) {\n        var posts = data.posts, i, post;\n        $scope.posts = posts;\n\
    \n        // Create new Post objects and put them into the list of posts.\n  \
    \      for (i = 0; i < posts.length; i++) {\n            post = posts[i];\n  \
    \          // convert to milliseconds precision\n            $scope.posts[i] =\
    \ new Post(post.title, post.body, post.date * 1000,\n                post.author,\
    \ true);\n        }\n    });\n\n    // This closes all editors if when the user\
    \ clicks the “new post” button\n    $scope.$watch('posts', function (new_val,\
    \ old_val) {\n        if (new_val !== old_val) {\n            $scope._stopEditingAllPosts(old_val);\n\
    \        }\n    });\n\n    // Begins editing a post by making a temporary copy\
    \ of the title and body,\n    // and setting the “editing” flag for that post\
    \ to be true.\n    $scope.edit = function (post) {\n        $scope._stopEditingAllPosts($scope.posts);\n\
    \        post.beginEditing();\n    };\n\n    // Saves a post, sets its editing\
    \ flag to false, puts it in the list of posts\n    // and eliminates the ‘new_post’\
    \ from the scope.\n    $scope.save = function (post) {\n        post.save();\n\
    \        $scope.posts.unshift(post);\n        delete $scope.new_post;\n    };\n\
    \n    // Cancels a post edit. Does not copy temp data, and sets the editing flag\n\
    \    // to false, so the “New Post” button appears.\n    $scope.cancel = function\
    \ (post) {\n        post.stopEditing();\n        delete $scope.new_post;\n   \
    \ };\n\n    // instantiate new Post object provided by Post factory\n    $scope.newPost\
    \ = function () {\n        $scope._stopEditingAllPosts($scope.posts);\n      \
    \  $scope.new_post = new Post('Enter title Here', 'Enter Body Here', 'undefined',\
    \ 'me');\n        $scope.new_post.beginEditing();\n    };\n});\n```\n\n从过程上讲，这个控制器在实例化时向Posts服务请求帖子。当遇到`ngController`指令并进行编译和链接时，控制器被实例化。因此，如果你在标记中有两个`contentCtrls`，对Posts的请求会被执行两次。\n\
    \n我们放入作用域中的函数主要都很简单明了。不过，我们确实有一个`$watch`来检测`posts`对象是否已更改。如果已更改，这意味着我们从服务器获取了新数据。如果我们从服务器获取了新数据，那么我们想停止编辑内容（将其丢弃），因为我们可能有新的东西要编辑。一个智能的系统会检测冲突，但我们是博客上唯一的写作者，所以这没必要。\n\
    \n接下来是`ContentCtrl`的单元测试：\n\n```javascript\ndescribe('ContentCtrl', function ()\
    \ {\n  describe('basic methods', function () {\n```\n\n```javascript\n// all this\
    \ stuff happens whenever we instantiate the controller\nbeforeEach(inject(function\
    \ (Posts, Post, $routeParams, $httpBackend, $http) {\n    $http.defaults.transformRequest\
    \ = []; // remove any fancy request transforms\n    $httpBackend.expectGET('data.json').respond({posts:\
    \ []});\n    $controller('ContentCtrl', {$scope: scope, Posts: Posts,\n      \
    \  Post: Post, $routeParams: $routeParams});\n    $httpBackend.flush();\n}));\n\
    ```\n\n```javascript\ndescribe('_stopEditingAllPosts', function () {\n    it('should\
    \ call stopEditing() on all members of posts array',\n        inject(function\
    \ (Post) {\n            var posts = [\n                new Post(),\n         \
    \       new Post(),\n                new Post()\n            ];\n            spyOn(Post.prototype,\
    \ 'stopEditing');\n            scope._stopEditingAllPosts(posts);\n          \
    \  expect(Post.prototype.stopEditing).toHaveBeenCalled();\n            expect(Post.prototype.stopEditing.calls.length).toBe(3);\n\
    \        }));\n});\n```\n\n```javascript\ndescribe('edit', function () {\n   \
    \ it('should call _stopEditingAllPosts', inject(function (Post) {\n        var\
    \ post = new Post();\n        spyOn(scope, '_stopEditingAllPosts');\n        scope.edit(post);\n\
    \        expect(scope._stopEditingAllPosts).toHaveBeenCalled();\n    }));\n  \
    \  it('should call Post.prototype.beginEditing', inject(function (Post) {\n  \
    \      var post = new Post();\n        spyOn(Post.prototype, 'beginEditing');\n\
    \        scope.edit(post);\n        expect(Post.prototype.beginEditing).toHaveBeenCalled();\n\
    \    }));\n});\n```\n\n```javascript\ndescribe('save', function () {\n    it('should\
    \ call save on the post', inject(function (Post) {\n        var post = new Post();\n\
    \        spyOn(Post.prototype, 'save');\n        scope.save(post);\n        expect(Post.prototype.save).toHaveBeenCalled();\n\
    \    }));\n    it('should prepend to list of posts', inject(function (Post) {\n\
    \        var post = new Post();\n        scope.$apply(function () {\n        \
    \    scope.save(post);\n        });\n        expect(scope.posts.length).toBe(1);\n\
    \        expect(scope.posts[0]).toBe(post);\n    }));\n    it('should delete new_post',\
    \ inject(function (Post) {\n        var post = new Post();\n        spyOn(Post.prototype,\
    \ 'save');\n        scope.$apply('new_post = \"foo\"');\n        scope.$apply(function\
    \ () {\n            scope.save(post);\n        });\n        expect(scope.new_post).toBeUndefined();\n\
    \    }));\n});\n```\n\n```javascript\ndescribe('cancel', function () {\n    it('should\
    \ call Post.prototype.stopEditing', inject(function (Post) {\n        var post\
    \ = new Post();\n        spyOn(Post.prototype, 'stopEditing');\n        scope.$apply(function\
    \ () {\n            scope.cancel(post);\n        });\n        expect(Post.prototype.stopEditing).toHaveBeenCalled();\n\
    \    }));\n});\n```\n\n```javascript\nit('should delete new_post', inject(function\
    \ (Post) {\n    var post = new Post();\n    spyOn(Post.prototype, 'save');\n \
    \   scope.$apply('new_post = \"foo\"');\n    scope.$apply(function () {\n    \
    \    scope.cancel(post);\n    });\n    expect(scope.new_post).toBeUndefined();\n\
    }));\n```\n\n```javascript\ndescribe('newPost', function() {\n    it('should call\
    \ _stopEditingAllPosts', function() {\n        spyOn(scope, '_stopEditingAllPosts');\n\
    \        scope.newPost();\n        expect(scope._stopEditingAllPosts).toHaveBeenCalled();\n\
    \    });\n\n    it('should create a new post', inject(function(Post) {\n     \
    \   spyOn(Post.prototype, 'beginEditing'); // blasts our data\n        scope.$apply(function()\
    \ {\n            scope.newPost();\n        });\n\n        expect(scope.new_post.temp.title).toBe('Enter\
    \ title Here');\n        expect(scope.new_post.temp.body).toBe('Enter Body Here');\n\
    \        expect(scope.new_post.author).toBe('me');\n    }));\n\n    it('should\
    \ call Post.prototype.beginEditing', inject(function(Post) {\n        spyOn(Post.prototype,\
    \ 'beginEditing'); // blasts our data\n        scope.$apply(function() {\n   \
    \         scope.newPost();\n        });\n\n        expect(Post.prototype.beginEditing).toHaveBeenCalled();\n\
    \    }));\n});\n```\n\n十有八九，你会想要使用服务或工厂。但如果你有一个服务，需要在实例化之前进行配置呢？这时就要用到provider。\n\
    \n## Provider\n\n如果你需要在服务运行之前对其进行配置，请使用provider。这是你使用provider的唯一理由，因为它们是三者中最复杂的。例如，通常希望使用`$httpProvider`在`$http`服务实例化之前设置默认请求头。\n\
    \n![](img/f95c537c2fc9346a21a144b89cfac580_93_0.png)\n\n但主要把我们带到这里的，是你不能这样做：\n\
    \n```javascript\nsome_module.service('SomeService', function() {\n    this.someMethod\
    \ = function() { … };\n});\n```\n\n```javascript\nsome_module.config(function(SomeService)\
    \ {\n    // do something with SomeService\n});\n```\n\n**SomeService**尚未实例化，它根本不存在。但你可以这样做：\n\
    \n```javascript\nfunction SomeProvider() {\n    // some setup code goes here\n\
    \    this.last_name = 'Hiller';\n\n    // required method $get; acts as factory\
    \ or service\n    this.$get = function() {\n        var that = this;\n       \
    \ return {\n            someMethod: function() { return that.first_name + ' '\
    \ + that.last_name }\n        };\n    };\n}\n```\n\n```javascript\nsome_module.provider('SomeProvider',\
    \ SomeProvider)\n```\n\n```javascript\n// YES, it tacks \"Provider\" on to the\
