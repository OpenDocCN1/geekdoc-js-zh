    # # What is a Scope?


    A fundamental concept to understand in AngularJS is the *scope*. A scope houses
    the application model. Not only individual models, but functions as well. Every
    controller has its own scope. Some directives have their own scope. It''s important
    to know that you can take a scope and visually map it onto a chunk of markup (if
    you use the AngularJS Batarang, a debugging tool, you can inspect individual HTML
    nodes and see what is contained within their scope). That''s right; it mimics
    the DOM hierarchy of your view. Have a `<p>` somewhere with an ngController on
    it? That `<p>` now has a scope, and whatever you put in the scope, the `<p>` can
    touch. Remove `<p>` and the scope no longer exists. Some directives create their
    own scopes, like ngRepeat, and you can look at your markup and know where that
    new scope lives.


    AngularJS is actually closer to an MVVM (Model-View-ViewModel) framework, if you
    are familiar with that term. Think of the scope object as the ViewModel. But Igor
    Minar, one of the AngularJS authors, has declared AngularJS to be a MVW (Model-View-Whatever)
    framework; it''s a just a framework that separates logic from the presentation.
    His reasoning is that the lines between these framework types are often blurred
    by frameworks, and it''s not really worth arguing about as long as you''re productive
    in your framework of choice:


    ![](img/f95c537c2fc9346a21a144b89cfac580_24_0.png)'
