  md: '# # Preface


    This book is intended for intermediate JavaScript programmers. We make no attempt
    to explain the JavaScript syntax used (except in the cases where AngularJS may
    introduce a peculiarity), nor do we explain concepts such as closures, function
    chaining, callbacks, or other common patterns.


    We do explain basic AngularJS concepts, components, and their applications, and
    we cover more topics in detail where warranted. We provide examples along the
    way, answer questions, and correct common misconceptions. Together, we’ll build
    a working single-page weblog application using AngularJS.


    You’ll need somewhere to run your examples. I choose Plunker ([http://plnkr.co](http://plnkr.co)),
    as it’s a great sandbox for developing JavaScript applications. Plunker’s written
    in AngularJS; however, please note it doesn’t run in IE. You may want to give
    JSFiddle a try if you use IE ([http://jsfiddle.net](http://jsfiddle.net)).'
