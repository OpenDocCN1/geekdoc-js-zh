  - "[PAGE 48]\n\n# Checkboxes\n\n**TIP** What if I have a table, and each row has\
    \ a checkbox, and we want to know which rows are \"checked\"?\n\n*KnockoutJS provides\
    \ behavior like this, but AngularJS is different. If you want to do something\
    \ like this, you will want a custom directive. If it is important that the order\
    \ of the selected rows is preserved, then you will most definitely want a custom\
    \ directive!*\n\nThis example directive should help you:\n\n```\nmyApp.directive('checkboxArray',\
    \ function($parse) {\n    return {\n        require: 'ngModel',\n        link:\
    \ function(scope, elm, attrs, ngModel) {\n            var value = scope.$eval(attrs.checkboxArray);\n\
    \                // the thing we will put in our array specified by ngModel\n\
    \                array = $parse(attrs.ngModel); // getter/setter for ngModel\n\
    \                // if we have not defined the ngModel, let's assign an empty\
    \ array to it\n                // otherwise we may run into problems getting the\
    \ length of an undefined object\n            if (angular.isUndefined(array(scope)))\
    \ {\n                array.assign(scope, []);\n            }\n            // when\
    \ the checkbox is clicked, execute this\n            elm.bind('change', function()\
    \ {\n                var arrayValues = array(scope),\n                    // get\
    \ the actual array out of the scope\n                    i = arrayValues.length;\n\
    \                if (elm.attr('checked')) {\n                    // if we wound\
    \ up checked, push the thing onto the array specified by ngModel\n           \
    \         arrayValues.push(value);\n                    // need to apply since\
    \ this is a jQuery event\n                    scope.$apply(function() {\n    \
    \                    ngModel.$setViewValue(true); // checkbox will want to be\
    \ true/false\n                        array.assign(scope, arrayValues); // update\
    \ the scope\n                    });\n                } else {\n             \
    \       // find the object in our array and remove it\n                    while\
    \ (i--) {\n                        if (arrayValues[i] === value) {\n         \
    \                   arrayValues.splice(i, 1);\n                            scope.$apply(function()\
    \ {\n                                ngModel.$setViewValue(false);\n         \
    \                       array.assign(scope, arrayValues);\n                  \
    \          });\n                            return;\n                        }\n\
    \                    }\n                }\n            });\n            // this\
    \ little gem will watch the array specified in ngModel *by value*\n          \
    \  // and update when necessary. this way you can add/remove\n            // and\
    \ reorder the array you specified willy-nilly, and the checkboxes will be updated.\n\
    \            // otherwise, if we specified ngModel.$render, it would only be called\
    \ when the reference updates-\n            // reassigning our array to something\
    \ else.\n            scope.$watch(attrs.ngModel, function(arrayValues, oldArrayValues)\
    \ {\n                var i;\n                if (arrayValues !== oldArrayValues)\
    \ {\n                    i = arrayValues.length;\n                    while (i--)\
    \ {\n                        if (arrayValues[i] === value) {\n               \
    \             elm.attr('checked', true); // check the checkbox if we found the\
    \ obj\n                            return;\n                        }\n      \
    \              }\n                    elm.attr('checked', false); // otherwise\
    \ uncheck it\n                }\n            }, true);\n        }\n    };\n});\n\
    ```\n\nUsage of the `checkboxArray` directive would look like:\n\n```\n<div ng-controller=\"\
    MyCtrl\">\n    <table>\n        <tr ng-repeat=\"value in values\">\n         \
    \   <td><input type=\"checkbox\" ng-model=\"$parent.selectedValues\" checkbox-array=\"\
    value\"/></td>\n            <td>{{value.name}}</td>\n        </tr>\n    </table>\n\
    </div>\n```"
  - "[PAGE 49]\n\n```\n</table>\n```\n\nIt’s important to note that since `ngRepeat`\
    \ creates its own scope, if you simply set ngModel to be selectedValues, it would\
    \ not update the model in the `MyCtrl` controller. Thus, use `$parent`. If you\
    \ already have declared selectedValues in your parent scope, then nevermind.\n\
    \nIf you want to execute a function (read: not necessarily update a model) when,\
    \ say, clicking a checkbox, this can be achieved one of two ways. The first way\
    \ is using the `ngChange` directive:\n\n```\n<input type=\"checkbox\" ng-model=\"\
    skub\" ng-change=\"congratulateProSkub()\">I am pro-skub</input>\n```\n\nAnd in\
    \ your controller you would have:\n\n```\n$scope.congratulateProSkub = function()\
    \ {\n  if ($scope.skub) {\n    $window.alert('thanks for being pro-skub');\n \
    \ }\n};\n```\n\nThat’s all well and good, but note that two things actually happen\
    \ when you check (or uncheck) that box. Your function will get executed, of course,\
    \ but also a boolean `model` (skub) will be updated. The value of `$scope.skub`\
    \ in the controller is now true if this checkbox is checked. If we wished to keep\
    \ this bit of logic out of the view, we could do something like this:\n\n```\n\
    <input type=\"checkbox\" ng-model=\"skub\">I am pro-skub</input>\n```\n\nAnd:\n\
    \n```\n$scope.$watch('skub', function(new_val, old_val) {\n  if (new_val !== old_val)\
    \ {\n    $scope.congratulateProSkub();\n  }\n});\n```\n\nThis accomplishes the\
    \ same thing. Heck, you could even combine the two and *three* things would happen\
    \ when you clicked the checkbox. It’s probably personal preference as to which\
    \ one you *should* be using; I see pros and cons for either, and none of those\
    \ pros or cons are especially compelling.\n\n# ## Radios\n\nRadios can be slightly\
    \ different than the way you’d normally use a radio:\n\n```\n<input type=\"radio\"\
    \ name=\"foo\" value=\"bar\"/> Bar<br/>\n<input type=\"radio\" name=\"foo\" value=\"\
    baz\"/> Baz\n```\n\nIn AngularJS, you don’t *necessarily* need the name attribute\
    \ unless you want to do form validation (more on this later). Instead, you may\
    \ do this:\n\n```\n<input type=\"radio\" ng-model=\"foo\" value=\"bar\"/> Bar<br/>\n\
    <input type=\"radio\" ng-model=\"foo\" value=\"baz\"/> Baz\n```\n\nAnd it will\
    \ work exactly like in the first example, with the added bonus of assigning the"
  - "[PAGE 50]\n\nvalue to foo in the scope.\n\n# Selects\n\nSelects may also be a\
    \ little different. Maybe you have an array of strings (and it’s OK if you do):\n\
    \n```\n<select ng-model=\"foo\">\n    <option ng-repeat=\"thing in ['bar', 'baz']\"\
    >{{thing}}</option>\n</select>\n```\n\nThe value of foo will the “bar” or “baz”,\
    \ probably just like you wanted. But what if we were iterating over an array of\
    \ objects?\n\n```\n<select ng-model=\"foo\">\n    <option ng-repeat=\"thing in\
    \ [{name: 'bar'}, {name: 'baz'}]\">{{thing.name}}</option>\n</select>\n```\n\n\
    What ends up in `$scope.foo`? Well, the strings “bar” or “baz” again. This may\
    \ not be what you wanted however, as there’s nothing that tells you precisely\
    \ which object was selected! If you wanted to find that out, you’d have to create\
    \ another lookup object, or iterate over the whole array looking for the object\
    \ with the same name as `$scope.foo`. No. There is a better way:\n\n```\n<select\
    \ ng-model=\"foo\" ng-options=\"thing.name for thing in [{name: 'bar'}, {name:\
    \ 'baz'}]\"></select>\n```\n\nNow the value of `$scope.foo` is actually the object\
    \ in the array itself. This is incredibly useful. It’s like you made an entire\
    \ object, not just a string, be the value attribute of your option tag. Very cool\
    \ indeed.\nBasically you will be iterating over one of two kinds of data structures:\
    \ an array or an object. If you have an array, the value of `ngOptions` will be\
    \ “*label for value in array*”; where “label” is what is displayed to the user,\
    \ “value” is what is stored in the `ngModel`, and of course the array itself.\n\
    If you have an object, you don’t care about order. Your markup may look like the\
    \ following:\n\n```\n<select ng-model=\"foo\" ng-options=\"key + ': ' + value.name\
    \ for (key, value) in {bar: {name: 'barth'}, baz: {name: 'bazalthar'}}\"></select>\n\
    ```\n\nThis displays “bar: barth” and “baz: bazalthar” in the select dropdown;\
    \ when you choose something the value of `$scope.foo` becomes the object referred\
    \ to by the key (“bar” and “baz”). In general terms, that’s “*label for (key,\
    \ value) in object*“.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_50_0.png)\n\n\
    Everybody loves lists and tables and that’s what we’re going to talk about next."
- md: "## Lists and Tables\n\nIf you haven’t figured this one out by now, your go-to\
    \ directive for iterating over arrays or objects is the ngRepeat directive. This\
    \ directive is a bit curious as it does two things, which will look like bugs\
    \ if you don’t know what’s going on: it creates a scope for each iteration and\
    \ it iterates over a copy of the data, not the data itself. Thus, you will run\
    \ into problems if you are iterating over an array and giving the user power to\
    \ edit anything in that array. As soon as you edit something, a watch fires and\
    \ redraws. This does not work well:\n\n```html\n<ul>\n  <li ng-repeat=\"item in\
    \ ['foo', 'bar', 'baz']\">\n    <input type=\"text\" ng-model=\"item\"/>\n  </li>\n\
    </ul>\n```\n\nIn fact, as of version 1.0.5, AngularJS enforces an array of this\
    \ type remains read-only. A workaround would be to change the array to look something\
    \ like `[{name: 'foo'}, {name: 'bar'}, {name: 'baz'}]` and set your ngModels to\
    \ be `item.name`, then you may edit your objects with impunity.\n\nngRepeat has\
    \ a handful of special variables it injects into its iteration scopes:\n\n- `$index`:\
    \ The numeric value of the iteration; if array, current array index\n- `$first`:\
    \ Boolean; whether or not we are at the first iteration\n- `$last`: Boolean, whether\
    \ or not we are at the last iteration\n- `$middle`: Boolean, whether or not we\
    \ are neither at the first nor last iteration\n\n> TIP: A quick way to determine\
    \ if an array only has one value: Use the expression `$first && $last`. This will\
    \ only be true if the first value in the array is the last value in the array;\
    \ in other words, an array of length one (1).\n\nThere are many use cases for\
    \ something like this, suffice it to say. Use these variables and you can render\
    \ your HTML differently depending on where you are in the loop.\n\n### Sorting\
    \ and Filtering\n\nAngularJS has built-in sorting and filtering filters that are\
    \ ideal for use with ngRepeat. We use ngRepeat to display our blog posts. Let’s\
    \ take a closer look. What follows is an HTML fragment to display the posts:\n\
    \n```html\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:'-date'\"\
    >\n  <!-- bunch of stuff eliminated for sake of brevity -->\n</div>\n```\n\nThe\
    \ way it’s set up now, we’ll show the newest post first down through the oldest\
    \ post. Let’s make this dynamic:\n\n```html\n<div id=\"{{post.id}}\" ng-repeat=\"\
    post in posts|orderBy:order:descending\">\n  <!-- bunch of stuff eliminated for\
    \ sake of brevity -->\n</div>\n```\n\nAnd back in our controller:\n\n```javascript\n\
    blog.controller('ContentCtrl', function ($scope, Posts, Post) {\n```\n\n.. snip\
    \ ..\n\n```javascript\n$scope.order = 'date';\n$scope.descending = true;\n});\n\
    ```\n\nNow, we can modify `order` and `descending` to sort how we wish. Let's\
    \ make a couple form controls to change this:\n\n```html\n<div id=\"posts-form\"\
    >\n    Order By: <select ng-model=\"order\">\n<option value=\"title\">Title</option><option\
    \ value=\"date\">Date</option></select>\n    <input type=\"checkbox\" ng-model=\"\
    descending\"/> Descending\n</div>\n<div id=\"{{post.id}}\" ng-repeat=\"post in\
    \ posts|orderBy:order:descending\">\n    <!-- bunch of stuff eliminated for sake\
    \ of brevity -->\n</div>\n```\n\nIt looks something like this:\n\n![](img/f95c537c2fc9346a21a144b89cfac580_52_0.png)\n\
    \nSwell! Let's take it a step further and add a filter box. We'll use the `filter`\
    \ filter for this:\n\n```html\n<div id=\"posts-form\">\n    Order By: <select\
    \ ng-model=\"order\"><option value=\"title\">Title</option><option value=\"date\"\
    >\nDate</option></select>\n    <input type=\"checkbox\" ng-model=\"descending\"\
    /> Descending <br/>\n    Filter: <input type=\"text\" ng-model=\"filter\"/>\n\
    </div>\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    >\n    <!-- bunch of stuff eliminated for sake of brevity -->\n</div>\n```\n\n\
    Yes, you may combine filters. That's all we need to do a full text filter across\
    \ all of the fields of a Post object. As you type, the filter will be updated\
    \ and your results will show immediately. To accomplish this you'll note we didn't\
    \ have to modify the controller at all. Filters, combined with ngModel, are a\
    \ lethal combination indeed.\n\nBy default, this will filter on all values of\
    \ an object. If you only want to filter on one value, say, the title of an object,\
    \ you will need a custom filtering function. For example:\n\n```javascript\n$scope.myFilteringFunction\
    \ = function(item) {\n    return item.title.match($scope.filter);\n};\n```\n\n\
    Now you can do this:\n\n```html\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:myFilteringFunction\"\
    >\n    <!-- bunch of stuff eliminated for sake of brevity -->\n</div>\n```\n\n\
    ### Even/Odd Rows\n\nIt's often highly desirable to change the CSS of a row in\
    \ a table based on whether it's an even or odd row. This is incredibly easy to\
    \ do in AngularJS using the `ngClassEven` and `ngClassOdd` directives:\n\n```html\n\
    <div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \n     ng-class-even=\"'even'\" ng-class-odd=\"'odd'\">\n    <!-- bunch of stuff\
    \ eliminated for sake of brevity -->\n</div>\n```\n\nNow, each `<div>` in our\
    \ list of posts will be tagged with either an `even` class or an `odd` class,\
    \ depending. Simply set up your CSS and have one of these alter the background\
    \ color slightly, and you're set. Feel free to use a table instead.\n\n### Temporary\
    \ Variables\n\nYou are probably not going to need temporary variables. You may\
    \ think you do — what if we have a nested `ngRepeat` loop, and we need to access\
    \ the `$index` property of the outer loop from within the inner loop? The inner\
    \ loop declares `$index` itself, so that's not going to work. In other templating\
    \ languages you might want to declare a temporary variable within the outer loop.\
    \ This is how you'd do it with AngularJS:\n\n```html\n<div ng-repeat=\"stuff in\
    \ things\" ng-init=\"outerIndex = $index\">\n  <div ng-repeat=\"bits in stuff\"\
    >\n    {{outerIndex}}.{{$index}}\n  </div>\n</div>\n```\n\nBut, in AngularJS,\
    \ you don't need to use `ngInit` for this common case. `ngInit` simply executes\
    \ an AngularJS expression against the current scope. Use it sparingly! Remember\
    \ that every scope has a parent (except the root scope, of course). To avoid `ngInit`,\
    \ do this:\n\n```html\n<div ng-repeat=\"stuff in things\">\n  <div ng-repeat=\"\
    bits in stuff\">\n    {{$parent.$index}}.{{$index}}\n  </div>\n</div>\n```\n\n\
    In fact, I'm having a hard time imagining a use case wherein `$parent` wouldn't\
    \ be sufficient in some way. However, I'd suggest using `ngInit` if you end up\
    \ with something like `$parent.$parent.$parent.$parent.$index`. Do whatever is\
    \ simple. Also remember that `ngInit`, unless it's in an `ngRepeat` loop, will\
    \ only execute one time; use this to your advantage or peril, if you must.\n\n\
    What if you have a bunch of JavaScript that you would like injected into the DOM,\
    \ but it doesn't make sense to escape it in JavaScript code? Templates to the\
    \ rescue. We'll discuss them next.\n\n### Templates\n\nGenerally you’ll just be\
    \ wildly tossing AngularJS directives into your raw markup, so you won’t need\
    \ a template *per se*. However, when it comes to lazy loading HTML or otherwise,\
    \ consider using a template. It’s also great to use small templates for reusability.\
    \ There are two ways to define templates. The first is in a `<script>` tag:\n\n\
    ```html\n<script type=\"text/ng-template\" id=\"foo\">\n    Hi, I'm the template\
    \ with ID \"foo\".\n</script>\n```\n\nThe advantage of having this stuff in a\
    \ `<script>` tag like this is that your templates stay out of the DOM until you\
    \ put them there. The second form of a template, which shares this advantage,\
    \ is a partial. A partial is simply an external HTML file. These are both templates\
    \ and can be used exactly the same way, the only difference is that one is external\
    \ and the other is not.\n\n### Including a Template\n\nThe most straightforward\
    \ way to include a template is the `ngInclude` directive. Simply give it a path\
    \ or ID, and it will first attempt to retrieve it from the template cache (see\
    \ below), and if this misses, an HTTP request will be made to the path. If your\
    \ application is small and you’re not concerned about loading times, you should\
    \ use internal (`<script>`-style) templates, because they will be gathered up\
    \ by AngularJS. If you prefer lazy-loading or when loading a bunch of HTML up\
    \ front is a bad idea, use the external (partial) style. Let’s break out our `index.html`\
    \ into some partials:\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"blog\">\n<head>\n\
    \    <meta http-equiv=\"Content-type\" content=\"text/html; charset=utf-8\">\n\
    \    <title ng-bind-template=\"{{title}}\"></title>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.5/angular.min.js\"\
    \ type=\"text/javascript\"\n            charset=\"utf-8\"></script>\n    <script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\" type=\"\
    text/javascript\"\n            charset=\"utf-8\"></script>\n    <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body>\n\
    <ng-include src=\"'header.html'\"></ng-include>\n<div ng-controller=\"ContentCtrl\"\
    >\n    <new-post-area post=\"new_post\" cancel-text=\"Cancel\" save-text=\"Save\"\
    \ cancel=\"cancel\"\n                   save=\"save\"></new-post-area>\n    <div\
    \ id=\"posts-form\">\n        Order By: <select ng-model=\"order\"><option value=\"\
    title\">Title</option><option value=\"date\">\n        Date</option></select>\n\
    \        <input type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n\
    \        Search: <input type=\"text\" ng-model=\"filter\"/>\n    </div>\n    <div\
    \ id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \ ng-class-even=\"\n    'even'\" ng-class-odd=\"'odd'\">\n        <ng-switch on=\"\
    post.editing\">\n            <div ng-switch-when=\"true\">\n                <div\
    \ class=\"important-background-color\" color=\"#EEE\">\n                    <input\
    \ type=\"text\" ng-model=\"post.temp.title\"/><br/>\n                    <textarea\
    \ ng-model=\"post.temp.body\"></textarea><br/>\n                    <button ng-click=\"\
    cancel(post)\">Cancel</button>\n                    <button ng-click=\"save(post)\"\
    >Save Changes</button>\n                </div>\n            </div>\n         \
    \   <div ng-switch-default>\n                <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n\
    \                <p ng-click=\"edit(post)\" bold-click ng-bind-html-unsafe=\"\
    post.body\"></p>\n                <p><em>posted on {{post.date|date:'short'}}\
    \ by {{post.author}}</em></p>\n            </div>\n        </ng-switch>\n    \
    \    <hr/>\n        <button ng-click=\"newPost()\">New Post</button>\n    </div>\n\
    </div>\n<ng-include src=\"'footer.html'\"></ng-include>\n</body>\n</html>\n```"
  mdcn: "\n## 列表与表格\n\n如果你到现在还没搞清楚，遍历数组或对象时最常用的指令就是 `ngRepeat` 指令。这个指令有些特别，因为它做了两件事，如果你不了解其运作机制，这两件事看起来就像\
    \ bug：它为每次迭代创建一个作用域，并且它遍历的是数据的副本，而非数据本身。因此，如果你在遍历数组时让用户拥有编辑该数组中任何内容的权限，就会遇到问题。一旦你编辑了某些内容，watch\
    \ 就会触发并重绘界面。这种做法并不奏效：\n\n```html\n<ul>\n  <li ng-repeat=\"item in ['foo', 'bar',\
    \ 'baz']\">\n    <input type=\"text\" ng-model=\"item\"/>\n  </li>\n</ul>\n```\n\
    \n事实上，从 1.0.5 版本开始，AngularJS 强制要求此类数组保持只读。一种变通方案是将数组改为类似 `[{name: 'foo'}, {name:\
    \ 'bar'}, {name: 'baz'}]` 的形式，并将你的 ngModel 设置为 `item.name`，这样你就可以随意编辑你的对象了。\n\n\
    `ngRepeat` 会向每个迭代作用域注入一些特殊变量：\n\n- `$index`：迭代的数值；如果是数组，则为当前数组索引\n- `$first`：布尔值；是否处于第一次迭代\n\
    - `$last`：布尔值；是否处于最后一次迭代\n- `$middle`：布尔值；是否既不处于第一次也不处于最后一次迭代\n\n> **提示**：快速判断数组是否只有一个值的简便方法：使用表达式\
    \ `$first && $last`。这只有在数组的第一个值就是最后一个值时才为真；换句话说，长度为 1 的数组。\n\n诸如此类的应用场景很多，不必细说。善用这些变量，你就能根据在循环中的位置来渲染不同的\
    \ HTML。\n\n### 排序与过滤\n\nAngularJS 内置了排序和过滤的过滤器，非常适合与 `ngRepeat` 配合使用。我们用 `ngRepeat`\
    \ 来展示博客文章。让我们仔细看看。以下是用于显示文章的 HTML 片段：\n\n```html\n<div id=\"{{post.id}}\" ng-repeat=\"\
    post in posts|orderBy:'-date'\">\n  <!-- 为简洁起见，省略了大量内容 -->\n</div>\n```\n\n按现在的设置，我们会从新文章到旧文章依次显示。让我们将其改为动态：\n\
    \n```html\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending\"\
    >\n  <!-- 为简洁起见，省略了大量内容 -->\n</div>\n```\n\n回到控制器中：\n\n```javascript\nblog.controller('ContentCtrl',\
    \ function ($scope, Posts, Post) {\n```\n\n.. 省略 ..\n\n```javascript\n$scope.order\
    \ = 'date';\n$scope.descending = true;\n});\n```\n\n现在，我们可以修改 `order` 和 `descending`\
    \ 来实现任意排序。让我们添加几个表单控件来改变这个设置：\n\n```html\n<div id=\"posts-form\">\n    Order By:\
    \ <select ng-model=\"order\">\n<option value=\"title\">Title</option><option value=\"\
    date\">Date</option></select>\n    <input type=\"checkbox\" ng-model=\"descending\"\
    /> Descending\n</div>\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending\"\
    >\n    <!-- 为简洁起见，省略了大量内容 -->\n</div>\n```\n\n效果大致如下：\n\n![](img/f95c537c2fc9346a21a144b89cfac580_52_0.png)\n\
    \n太棒了！让我们更进一步，添加一个过滤框。我们将使用 `filter` 过滤器来实现：\n\n```html\n<div id=\"posts-form\"\
    >\n    Order By: <select ng-model=\"order\"><option value=\"title\">Title</option><option\
    \ value=\"date\">\nDate</option></select>\n    <input type=\"checkbox\" ng-model=\"\
    descending\"/> Descending <br/>\n    Filter: <input type=\"text\" ng-model=\"\
    filter\"/>\n</div>\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    >\n    <!-- 为简洁起见，省略了大量内容 -->\n</div>\n```\n\n是的，你可以组合使用过滤器。这就是我们实现跨 Post 对象所有字段的全文过滤所需的全部。当你输入时，过滤器会实时更新并立即显示结果。值得注意的是，要做到这一点我们完全不需要修改控制器。过滤器与\
    \ ngModel 的结合确实是威力无穷。\n\n默认情况下，这会在对象的所有值上进行过滤。如果你只想针对某个值过滤，比如对象的标题，就需要一个自定义过滤函数。例如：\n\
    \n```javascript\n$scope.myFilteringFunction = function(item) {\n    return item.title.match($scope.filter);\n\
    };\n```\n\n现在你可以这样使用：\n\n```html\n<div id=\"{{post.id}}\" ng-repeat=\"post in\
    \ posts|orderBy:order:descending|filter:myFilteringFunction\">\n    <!-- 为简洁起见，省略了大量内容\
    \ -->\n</div>\n```\n\n### 偶数/奇数行\n\n根据表格行是偶数行还是奇数行来改变其 CSS 样式，这通常是非常可取的。在 AngularJS\
    \ 中使用 `ngClassEven` 和 `ngClassOdd` 指令可以极其轻松地实现这一点：\n\n```html\n<div id=\"{{post.id}}\"\
    \ ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\n     ng-class-even=\"\
    'even'\" ng-class-odd=\"'odd'\">\n    <!-- 为简洁起见，省略了大量内容 -->\n</div>\n```\n\n\
    现在，我们文章列表中的每个 `<div>` 都会根据情况被标记为 `even` 类或 `odd` 类。只需设置好你的 CSS，让其中一种稍微改变背景色即可。你也可以随意使用表格来实现。\n\
    \n### 临时变量\n\n你可能不太需要临时变量。你可能认为你需要——比如我们有嵌套的 `ngRepeat` 循环，需要从内部循环访问外部循环的 `$index`\
    \ 属性？内部循环本身也声明了 `$index`，所以这样行不通。在其他模板语言中，你可能想要在外部循环中声明一个临时变量。在 AngularJS 中可以这样做：\n\
    \n```html\n<div ng-repeat=\"stuff in things\" ng-init=\"outerIndex = $index\"\
    >\n  <div ng-repeat=\"bits in stuff\">\n    {{outerIndex}}.{{$index}}\n  </div>\n\
    </div>\n```\n\n但是，在 AngularJS 中，你并不需要为这个常见场景使用 `ngInit`。`ngInit` 只是针对当前作用域执行一个\
    \ AngularJS 表达式。请谨慎使用！记住每个作用域都有一个父作用域（当然根作用域除外）。要避免使用 `ngInit`，可以这样做：\n\n```html\n\
    <div ng-repeat=\"stuff in things\">\n  <div ng-repeat=\"bits in stuff\">\n   \
    \ {{$parent.$index}}.{{$index}}\n  </div>\n</div>\n```\n\n事实上，我很难想象有什么场景是 `$parent`\
    \ 无法以某种方式满足需求的。然而，如果你最终写出了类似 `$parent.$parent.$parent.$parent.$index` 的东西，我建议你使用\
    \ `ngInit`。怎么简单怎么来。还要记住，除非在 `ngRepeat` 循环中，`ngInit` 只会执行一次；善加利用吧，如果必须的话。\n\n如果你有一大段\
    \ JavaScript 想注入到 DOM 中，但在 JavaScript 代码中对其进行转义又不太合适，该怎么办？模板来拯救你。我们接下来就来讨论它们。\n\
    \n### 模板\n\n通常你只是随意地将 AngularJS 指令丢进原始标记中，因此严格来说你并不需要模板。但是，当涉及到懒加载 HTML 等情况时，考虑使用模板。对于可重用性而言，使用小型模板也很不错。定义模板有两种方式。第一种是在\
    \ `<script>` 标签中：\n\n```html\n<script type=\"text/ng-template\" id=\"foo\">\n\
    \    Hi, I'm the template with ID \"foo\".\n</script>\n```\n\n将这些东西放在 `<script>`\
    \ 标签中的好处是，你的模板在你把它们放入 DOM 之前都不会进入 DOM。模板的第二种形式也有这个优点，即局部模板（partial）。局部模板就是一个外部的\
    \ HTML 文件。这两种都是模板，使用方式完全相同，唯一的区别是一个是外部的，另一个不是。\n\n### 引入模板\n\n引入模板最直接的方式是使用 `ngInclude`\
    \ 指令。只需给它一个路径或 ID，它会首先尝试从模板缓存中获取（见下文），如果失败，则会向该路径发起 HTTP 请求。如果你的应用规模较小且不担心加载时间，应该使用内部（`<script>`\
    \ 样式）模板，因为它们会被 AngularJS 汇总收集。如果你倾向于懒加载，或者一次性加载大量 HTML 不太好，就使用外部（局部模板）样式。让我们把\
    \ `index.html` 拆分成一些局部模板：\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"blog\">\n\
    <head>\n    <meta http-equiv=\"Content-type\" content=\"text/html; charset=utf-8\"\
    >\n    <title ng-bind-template=\"{{title}}\"></title>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.5/angular.min.js\"\
    \ type=\"text/javascript\"\n            charset=\"utf-8\"></script>\n    <script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\" type=\"\
    text/javascript\"\n            charset=\"utf-8\"></script>\n    <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body>\n\
    <ng-include src=\"'header.html'\"></ng-include>\n<div ng-controller=\"ContentCtrl\"\
    >\n    <new-post-area post=\"new_post\" cancel-text=\"Cancel\" save-text=\"Save\"\
    \ cancel=\"cancel\"\n                   save=\"save\"></new-post-area>\n    <div\
    \ id=\"posts-form\">\n        Order By: <select ng-model=\"order\"><option value=\"\
    title\">Title</option><option value=\"date\">\n        Date</option></select>\n\
    \        <input type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n\
    \        Search: <input type=\"text\" ng-model=\"filter\"/>\n    </div>\n    <div\
    \ id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \ ng-class-even=\"\n    'even'\" ng-class-odd=\"'odd'\">\n        <ng-switch on=\"\
    post.editing\">\n            <div ng-switch-when=\"true\">\n                <div\
    \ class=\"important-background-color\" color=\"#EEE\">\n                    <input\
    \ type=\"text\" ng-model=\"post.temp.title\"/><br/>\n                    <textarea\
    \ ng-model=\"post.temp.body\"></textarea><br/>\n                    <button ng-click=\"\
    cancel(post)\">Cancel</button>\n                    <button ng-click=\"save(post)\"\
    >Save Changes</button>\n                </div>\n            </div>\n         \
    \   <div ng-switch-default>\n                <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n\
    \                <p ng-click=\"edit(post)\" bold-click ng-bind-html-unsafe=\"\
    post.body\"></p>\n                <p><em>posted on {{post.date|date:'short'}}\
    \ by {{post.author}}</em></p>\n            </div>\n        </ng-switch>\n    \
    \    <hr/>\n        <button ng-click=\"newPost()\">New Post</button>\n    </div>\n\
    </div>\n<ng-include src=\"'footer.html'\"></ng-include>\n</body>\n</html>\n```\n"
