    \       });\n        }\n    };\n});\n```\n\nAnd you can use it this way, just\
    \ as you would ngInclude:\n\n```\n<my-include src=\"'foo.html'\"></my-include>\n\
    ```\n\nOf course, since ngInclude already exists, this is a futile exercise, but\
    \ it shows you how you can retrieve templates on-the-fly from within a directive\
