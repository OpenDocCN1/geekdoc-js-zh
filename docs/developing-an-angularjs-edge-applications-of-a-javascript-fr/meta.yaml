  md: "# Promises, Promises\n\nOK, what’s a promise? When you have a promise, you\
    \ know that one of two things will happen: the promise will be *rejected* or *resolved*.\
    \ Think of this as the sad path and the happy path, respectively. It’s important\
    \ to understand that a promise is rejected/resolved once and only once. A promise\
    \ may be rejected/resolved synchronously (such as with unit tests, or in cases\
    \ where the async operation needn’t be made), but typically it is done asynchronously.\n\
    \nWhat do promises buy you? Aside from the guarantees they make, they avoid nasty\
    \ code like this:\n\n```\najaxLib.GET('foo.url', function(response) {\n  ajaxLib.GET('bar.url',\
    \ function(response) {\n    ajaxLib.GET('baz.url', function(response) {\n    \
    \  // .. and so on\n    })\n  })\n})\n```\n\nWhen you chain callbacks like this,\
    \ it’s called stair-stepping, and unless you want to go crazy, you should avoid\
    \ this. Promises help you do that. You can do this:\n\n```\najaxLib.GET('foo.url')\n\
    \  .success(function(response) { return ajaxLib.GET('bar.url') })\n  .success(function(response)\
    \ { return ajaxLib.GET('baz.url') });\n```\n\n> What’s a deferred?\n*It is an\
    \ object responsible for giving you a promise and rejecting/resolving it.*\n\n\
    The return value of each response will be passed to the next success function\
    \ in the chain. Of course this is just hypothetical code; AngularJS and $q (the\
    \ promise/deferred API) have their own syntax which I’ll cover shortly.\n\nIf\
    \ you have asynchronous code, and it executes a callback upon completion, it’s\
    \ a candidate to return a promise instead. The utility and power of promises blows\
    \ a lot of continuation-passing style (CPS) code out of the water.\n\n# Promises\
    \ in AngularJS\n\nAngularJS features two major services out-of-the-box that use\
    \ promises: `$http` and `$timeout`. Both return promises. A promise will have\
    \ a then method, which accepts two parameters: a function accepting data if the\
    \ promise is resolved, and a function accepting data if the promise is rejected.\
    \ In the case of `$http`, the familiar success and error functions are available\
    \ in addition to these. Instead of passing the entire response object, these break\
    \ up the response into parameters. For example:\n\n```\n$http.get('foo.url').success(function(data,\
    \ status, headers, config) { // do stuff })\n  .error(function(data, status, headers,\
    \ config) { // do other stuff });\n```"
  merge: -1
  pgno: 118
- img_proc: true
  md: "```\n$http.get('foo.url').then(function(res) { // data, status, headers, config\
    \ in res obj},\n    function(res) { // data, status, headers, config in res obj\
    \ });\n```\n\nIt should be noted that when attaching a promise to a scope object,\
    \ there is a shortcut available. The scope eats promises! These two statements\
    \ are equivalent:\n\n```\n$scope.foo = $http.get('foo.url');\n$http.get('foo.url').success(function(res)\
    \ {\n    $scope.foo = res;\n});\n```\n\nThis may save you some time, but you must\
    \ understand that since `get()` is an asynchronous function, the value of “foo”\
    \ in the scope will be immediately undefined, then set upon successful resolving\
    \ of the call.\n\nWith `$timeout`, however, you are only afforded the `then()`\
    \ function, which is fine and dandy. `$timeout` allows you to execute arbitrary\
    \ code asynchronously, much like the `setTimeout` function in vanilla JavaScript.\
    \ The difference is that it returns a promise instead of a timeout ID. Here is\
    \ some equivalent code using `setTimeout` and `$timeout`:\n\n```\nvar t = $window.setTimeout(function(successFn,\
    \ errorFn) {\n    if (foo) {\n        successFn();\n    } else {\n        $window.clearTimeout(t);\n\
    \        errorFn();\n    }\n}, 1000);\n\nvar p = $timeout(function() {\n    if\
    \ (!foo) {\n        $timeout.cancel(p);\n    }\n}, 1000).then(successFn, errorFn);\n\
    ```\n\nThe promise is resolved when the timeout function executes successfully\
    \ without being cancelled, and the `successFn` function is executed automatically.\
    \ As you can see this actually saves you a bit of code.\n\nBy default, `$timeout`\
    \ executes inside a digest loop. If you are not modifying the scope within the\
    \ timeout function, you can inhibit this behavior to save some cycles. As a third\
    \ parameter, pass false and the timeout function will not be executed inside an\
    \ `$apply` block.\n\n# Chaining Promises\n\nAs in the first example, you can chain\
    \ promises. The pattern looks like this:\n\n```\n$http.get('foo.url')\n    .then(function\
    \ (res) {\n        // do stuff with res\n        if (something) {\n          \
    \  return $q.reject(first_sad_obj);\n        }\n        return first_happy_obj;\n\
    \    }, function (res) {\n        // do other stuff with res\n        return first_sad_obj;\n\
    \    })\n    .then(function (first_happy_obj) {\n        // do stuff\n       \
    \ if (something_else) {\n            return $q.reject(second_sad_obj);\n     \
    \   }\n        return second_happy_obj;\n    }, function (first_sad_obj) {\n \
    \       // more stuff to do\n        return second_sad_obj;\n    })\n    .then(function\
    \ (second_happy_obj) {\n        // success\n    }, function (second_sad_obj) {\n\
    \        // failure. etc.\n    });\n```"
  merge: -1
  pgno: 119
- img_proc: true
  md: "If we return an object from a promise, it will be passed to the next promise\
    \ in the chain. If we use $q.reject and return that instead, the promise will\
    \ be rejected and the next promise in the chain will have its second (failure)\
    \ function executed. And so on and so forth.\n\nI've used promises to wait until\
    \ a modal dialog's template was fetched and the dialog was opened to execute some\
    \ code (if the template was already fetched, the promise is resolved immediately,\
    \ synchronously; this is perfectly acceptable). I've used promises to wait for\
    \ controller *x* to finish asynchronously processing some data so controller *y*\
    \ could start its processing of the data.\n\nYou can even combine promises!\n\n\
    ```\nvar p1 = asyncCode1();\nvar p2 = asyncCode2();\nvar p3 = $q.all(p1, p2);\n\
    // then, asyncCode1 resolves; p1 is resolved, but p3 is not\n// next, asyncCode2\
    \ resolves; p1 is resolved and p2 is resolved, now p3 becomes resolved\n```\n\n\
    Using the all function, you can resolve one promise when another set of promises\
    \ are all resolved. This can come in handy if you are waiting on two different\
    \ things to asynchronously happen.\n\nIt's easy to propagate errors using promises.\
    \ Here's an example of doing it the old-fashioned, callback-chain way:\n\n```\n\
    ajaxLib.get('url').then(function() {}, {success: function() {\n    ajaxLib.get('anotherUrl',\
    \ {success: function() {\n        ajaxLib.get('yetAnotherUrl', {success: function()\
    \ {\n        }, error: function() { // pop error }};\n    }, error: function()\
    \ { // pop error }};\n}, error: function() { // pop error }};\n```\n\nThis is\
    \ unwieldy. Promises offer a nice alternative, since they know whether or not\
    \ they have been resolved or rejected:\n\n```\najaxLib.get('url').then(function(res)\
    \ {\n}).then(function(res) {\n    return ajaxLib.get('anotherUrl');\n}).then(function(res)\
    \ {\n    return ajaxLib.get('yetAnotherUrl');\n}, function(error) {\n    // pop\
    \ error\n});\n```\n\nIn the above example, the first error along the way will\
    \ trickle down to the final \"rejected\" function.\n\nNote that sometimes promises\
    \ can take the place of a `$watch`, or vice-versa. Here's an example:\n\n```\n\
    // note no module here; not necessary for example.\nfunction ParentCtrl($q, $http)\
    \ {\n    $scope.getFoo = function() {\n        return $http.get('foo.url').success(function(data)\
    \ {\n            $scope.foo = data;\n        });\n    };\n}\nfunction ChildCtrl()\
    \ {\n    $scope.getFoo().then(function() {\n        // do something with $scope.foo\n\
    \    };\n}\n```"
  merge: -1
