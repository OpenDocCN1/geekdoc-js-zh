  md: "promise. We then can take the result of `$http.get()` and use it like we would\
    \ any promise:\n\n```\nPosts.getPosts().success(function (data) {\n    // do stuff\n\
    });\n```\n\nNote that vanilla promises do not supply the success or error methods;\
    \ they only supply a then method, which works similarly. The difference between\
    \ the two is that success and error are both passed response data, while the then\
    \ is passed the entire response object (note that then will accept two functions\
    \ as parameters; the first for success/\"resolved\" and the second for failure/\"\
    rejected\"). This object contains headers and other information that you may or\
    \ may not care about."
