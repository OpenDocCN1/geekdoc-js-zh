  md: "# # Conversing with jQuery\n\nYou may have some jQuery plugin hanging around\
    \ somewhere you want to use with AngularJS, or maybe a simple jQuery function\
    \ not available to jqLite. `animate()` is a good example of this. Keep in mind\
    \ you can achieve the same thing with AngularJS animations, but here goes:\n\n\
    ```\n<p id=\"foo\" style=\"display: none;\">\n  This fades in\n</p>\n```\n\nAnd\
    \ the jQuery to set it up:\n\n```\n$(function() {\n  $('#foo').fadeIn('slow');\n\
    });\n```\n\nTo use `fadeIn`, do this:\n\n```\n<p fade-in=\"true\">\n  This fades\
    \ in\n</p>\n```\n\nAnd of course:\n\n```\nblog.directive('fadeIn', function ()\
    \ {\n  return function (scope, element, attrs) {\n    return function (scope,\
    \ element, attrs) {\n      element.css('opacity', 0); // css available in jqLite\n\
    \      scope.$watch(attrs.fadeIn, function (val) {\n        if (val) {\n     \
    \     element.animate({'opacity': '1.0'}, 1000); // must use jquery proper to\
    \ use animate()\n        } else {\n          element.animate({'opacity': '0'},\
    \ 1000);\n        }\n      });\n    };\n  };\n});\n```\n\nNote that we're not\
    \ fully taking advantage of this directive's watch on a model; we just pass in\
    \ true to immediately animate upon load. If we wanted to, we could specify a boolean\
    \ model, and whenever that model changed, the node would fade in and out.\n\n\
    ![](img/f95c537c2fc9346a21a144b89cfac580_76_0.png)\n\nWhile this implementation\
    \ is a few more lines of code, if you do this all over the place you'll eventually\
    \ save yourself many lines of code. Generally you can expect that if you write\
    \ a reusable directive, even though the up-front cost is higher, you'll eventually\
    \ save"
