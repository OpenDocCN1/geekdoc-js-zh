    \n在下一章中，我们将 살펴看一看最不起眼的成员——过滤器（filters）。\n\n# 第 8 章 过滤器\n\n什么是过滤器？从最基本的定义来看，它是一个接收多个输入并给你一个输出的函数。通常情况下，过滤器输出原语（primitives），较少输出数组，极少输出对象。我想它们也可以输出函数（作为读者的练习，请自行验证此用例）。它们是一种针对模型（或多个模型）执行逻辑的方式，且这种逻辑仅由视图关注。例如，你在控制器中可能将一个数字作为整数处理，但当它到达视图时，需要以格式化后的形式显示（例如\
