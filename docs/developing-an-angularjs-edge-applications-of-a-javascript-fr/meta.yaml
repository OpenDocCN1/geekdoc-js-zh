    \ {\n\n    .. clip ..\n\n    // Retrieve the posts from our \"server\". If this\
    \ succeeds, we'll\n    // put the posts into our $scope and do some post-processing.\n\
    \    Posts.getPosts().success(function (data) {\n        var posts = data.posts,\
    \ i, post;\n        $scope.posts = [];\n        i = posts.length;\n        //\
    \ if an ID is specified, search for it and set it to $scope.post\n        if ($routeParams.id)\
    \ {\n            while (i--) {\n                if (posts[i].id === $routeParams.id)\
    \ {\n                    $scope.post = posts[i];\n                    break;\n\
    \                }\n            }\n        } else {\n            // Create Post\
    \ objects and put them into the list of posts.\n            i = posts.length;\n\
    \            while (i--) {\n                post = posts[i];\n               \
    \ // convert to millisecond precision\n                $scope.posts.push(new Post(post.title,\
    \ post.body, post.date * 1000,\n                    post.author, true));\n   \
    \         }\n        }\n    });\n    .. clip ..\n});\n```\n\nAs you can see that’s\
    \ kind of dumb, but that’s the data we have. We could create another .json file\
