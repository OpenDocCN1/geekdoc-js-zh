    \ a couple of files on Plunker (http://plnkr.co) for our web-accessible directory.\
    \ The first thing you will want to do is make a fake backend. What we can do is\
    \ create a file called data.json and populate it with a JSON object. This object\
    \ is large and would be rather silly to reprint here, so simply get it from the\
    \ book’s website, listed in the *Preface*. To create the file, if you are using\
    \ Plunker, the “NEW…” link is what you’re looking for.\n\nClick that “NEW…” link\
    \ again. We’ll need an HTML file, index.html, and this is our “view”:\n\n```\n\
    <!DOCTYPE html>\n<html ng-app=\"blog\">\n<head>\n    <meta http-equiv=\"Content-type\"\
    \ content=\"text/html; charset=utf-8\">\n    <title>My Important Blog</title>\n\
    \    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js\"\
    \n    type=\"text/javascript\" charset=\"utf-8\"></script>\n    <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body\
    \ ng-controller=\"MainCtrl\">\n    <h1>My Important Blog</h1>\n\n    <div id=\"\
    posts\">\n    <h2>{{posts[0].title}}</h2>\n    <p bold-click>{{posts[0].body}}</p>\n\
    \    <p><em>posted on {{posts[0].date|date:'short'}} by {{posts[0].author}}</em></p>\n\
    \    </div>\n</body>\n</html>\n```\n\nThis, as you can see, is visible to your\
    \ application’s user. AngularJS-specific code is highlighted above in blue. Quickly,\
    \ let’s address the six bits:\n\n+   - `ng-app=\"blog\"`: This tells AngularJS\
    \ we should start an application, and that application is in a module named “blog.”\n\
    - `ng-controller=\"MainCtrl\"`: This gives the controller “MainCtrl” control over\
    \ the entire `<body>` of the application.\n- `{{posts[0].title}}`: For our purposes,\
    \ this displays the title of the first blog post.\n- `bold-click`: This makes\
    \ the paragraph toggle between bold and normal font weight when clicked; more\
    \ on this later.\n- `{{posts[0].body}}`: Displays the body of the first post.\n\
    - `{{posts[0].date|date:'short'}}`: Displays the first post’s date and formats\
    \ it nicely.\n- `{{posts[0].author}}`: Displays the author of the first post.\n\
    \nBehind this view sits one or more controllers, filters, and built-in or custom\
    \ directives. Behind those live services and other components to be used across\
    \ your application. Making up all of these is the module, which defines an application\
    \ (or AngularJS library). We’ll start by discussing the view."
  - '[PAGE 13]


    # # The View


    What''s a view? It''s the presentation layer. It''s your markup (typically HTML).
    It''s what the user sees. It is declarative—not imperative—it doesn''t have control
    flow, per se. When you are ready to implement an AngularJS application, I recommend
    implementing the view first, and working backwards from there. Write directives
    that don''t work, but use them how you would want—write the *directives* later.
    Call functions in the scope and reference models that don''t exist—then write
    the *controllers* later. Because the view is so descriptive, it can essentially
    provide a blueprint for your actual code.


    You need to set some custom attributes—or more precisely, directives—to get your
    AngularJS application up and running.


    +   - `ng-app` on `<html>` tag: This is AngularJS'' way of automatically *bootstrapping*
    the application. This `ng-app` call in particular initializes the blog module,
    and makes that the main module for the application.


    > **TIP Bootstrapping**


    *If you need to execute some code before AngularJS loads, you can skip putting
    ng-app in your view, and instead use `angular.bootstrap()` when ready.*


    +   - `ng-controller` on `<body>` tag: This directive tells AngularJS to initialize
    the controller named `MainCtrl` and make it responsible for handling the *scope*
    under the `<body>` tag, inclusive.

    - Stuff in `{{curly braces}}`: For now, you want to understand that the stuff
    in double curly braces corresponds to AngularJS expressions, which in this case
    correspond to models, and those models are in the scope of our controller, `MainCtrl`.
    Curly braces mean, "evaluate this expression and output it as a string". If you
    are familiar with client-side templating languages and/or MVC frameworks, it''s
    just some data coming out of a controller.Pipe (|) syntax: The pipe syntax in
    the reference to `posts[0].date` is a *filter*. The filter is the date filter,
    built-in to AngularJS. This filter takes the argument, `posts[0].date`, and applies
    a transformation against it. `posts[0].date`, in this case, is a JavaScript `Date`
    object. The `Date` object is transformed into a string. `short` is a shortcut
    for a "short date", which is a preconfigured format in the filter. This filter
    also allows you to output a Date object in basically any format you choose.


    Next, we''ll need some place to stuff our JavaScript. What follows includes an
    example of a model, controller, service and directive. Create `blog.js`:'
  - "[PAGE 14]\n\n![](img/f95c537c2fc9346a21a144b89cfac580_14_0.png)\n\nThe model\
    \ is typically stored within the controller's scope object, and the controller\
    \ communicates with the view. The view contains directives, and the services provide\
    \ functionality to controllers and directives, as shown here in blog.js:\n\n```\n\
    (function () {\n    'use strict';\n    // Define our module. Yes, you need the\
    \ empty array, or the module() function\n    // becomes a \"getter\": angular.module('blog')\
    \ would RETRIEVE the\n    // module instead of DECLARE it.\n    var blog = angular.module('blog',\
    \ []);\n    // Define our main controller.\n    // Our first example of dependency\
    \ injection; $scope and Posts are\n    // automagically injected into the function\
    \ by AngularJS.\n    blog.controller('MainCtrl', function ($scope, Posts) {\n\
    \        // Retrieve the posts from our \"server\". If this succeeds, we'll\n\
    \        // put the posts into our $scope and do some post-processing.\n     \
    \   Posts.getPosts().success(function (data) {\n            $scope.posts = data.posts;\n\
    \            // Let's convert our timestamps to JS Date objects\n            var\
    \ i = $scope.posts.length;\n            while (i--)\n                $scope.posts[i].date\
    \ = new Date($scope.posts[i].date * 1000);\n        });\n    });\n    // Define\
    \ our first service; Posts\n    // This service simply uses the built-in $http\
    \ service to retrieve data from\n    // a static JSON store.\n    blog.service('Posts',\
    \ function ($http) {\n        this.getPosts = function () {\n            return\
    \ $http.get('data.json');\n        };\n    });\n    // Our first directive. Toggles\
    \ boldface on node's contents when clicked.\n    // We'll cover exactly what a\
    \ directive is a little later.\n    blog.directive('boldClick', function() {\n\
    \        return function(scope, element) {\n            var bold = false;\n  \
    \          element.bind('click', function() {\n                if (bold) {\n \
    \                   element.css('font-weight', 'normal');\n                } else\
    \ {\n                    element.css('font-weight', 'bold');\n               \
    \ }\n                bold = !bold;\n            });\n        };\n    });\n})();\n\
    ```\n\nLet's address some of these things in brief before moving on:\n\n+   -\
    \ First, let's define a module \"blog\". This module, when combined with the `ng-app=\"\
    blog\"` attribute in the markup, functions as our main application.\n- We define\
    \ a controller called \"MainCtrl\", which provides business logic to the view\
    \ under the `<body>` tag inclusive. This uses *dependency injection* (DI) to pass\
    \ in the `$scope` and `Posts` parameters.\n- When `MainCtrl` is run, it grabs\
    \ some post data from the `Posts` service, and does a bit of post-processing on\
    \ the date objects."
- md: "- We define a service, `Posts`, also using DI. This provides one function,\
    \ `getPosts()`, which we call from the `MainCtrl` controller. It uses the built-in\
    \ `$http` service to contact a server and return data.\n- Finally, we define a\
    \ *directive* called `boldClick`, which provides some fancy functionality to the\
    \ view; when you click on whatever element it's attached to, it will toggle between\
    \ bold and normal font weight.\n\n## The Module\n\nOur module is called, surprisingly,\
    \ `blog`. Declaring a module is very simple as you will see, but note that you\
    \ must specify an array as the second parameter to the `module()` call. The contents\
    \ of this array will be a list of modules to include. In our case, we are not\
    \ including any other modules, so this is an empty array. Once we have declared\
    \ a module and assigned it to a variable, we can use that variable to define other\
    \ components within the module.\n\nYou must understand the difference between\
    \ the module declaration:\n\n```\nangular.module('foo', []);\n```\n\nAnd the module\
    \ reference:\n\n```\nangular.module('foo');\n```\n\nBoth return a module object,\
    \ but the first defines a module and the other retrieves a module. If you start\
    \ out your code by using the second, your application won't do anything except\
    \ spew some errors at you.\n\nIf you want to include other modules (which run\
    \ all module code and make any injectable components in the included module available\
    \ to your module), specify them by name—as strings—within the array parameter\
    \ of the module definition. You cannot include modules on-the-fly.\n\nSo, if you\
    \ want to use the `ngResource` module supplied by the AngularJS folks, you must\
    \ link to the .js file in a `<script>` tag, then load it like so, including a\
    \ module:\n\n```\nangular.module('myModule', ['ngResource']);\n```\n\nNow you\
    \ can use the `$resource` service, which is not available by default. Some you\
    \ may want include are `ngMock` for testing, `ngCookies` for cookie manipulation,\
    \ and `ngSanitize` for string/HTML sanitization and post-processing, among others.\
    \ None of these are included by default so you must refer to their corresponding\
    \ .js files in some manner.\n\nThere are some perhaps less-known, but very useful,\
    \ module functions that we haven't covered:\n\n- **value()**: Allows you to set\
    \ some \"global\" (injectable) values within an object; good for \"defaults\"\
    .\n- **constant()**: Much like value, except the object you supply is expected\
    \ to not change, and is available to the config function.\n- **config()**: Inject\
    \ providers in here to configure them, or work with constants, or otherwise do\
    \ things during the initialization phase. Configuring default headers for the\
    \ `$http` service or setting up routes is usually done here.\n- **run()**: Run\
    \ an arbitrary function after initialization is complete; if you need to configure\
    \ a service/factory/etc. that is not a provider, or set something using `$rootScope`,\
    \ this is a good place to do it.\n\nHere is an example of **value()** and **run()**:\n\
    \n```\nangular.module('myModule')\n  .value('foo', {bar: 'baz'})\n  .run(function(foo)\
    \ { ... });\n```\n\nAnd here is an example of **constant()** and **config()**:\n\
    \n```\nangular.module('myModule')\n  .constant('foo', {bar: 'baz'})\n  .config(function(foo)\
    \ { ... });\n```\n\nNote that you can inject a constant into a **run()** function,\
    \ but you can't inject a value into a **config()** function.\n\nHow do we know\
    \ when to create a module? In practice, I've found that generally I want one module\
    \ per (HTML) page. If you want to automatically bootstrap your AngularJS application,\
    \ which you generally do, you will use the **ngApp** directive. This directive\
    \ can only be used once per HTML page. Now, that doesn't mean that you shouldn't\
    \ bundle common functionality between the pages in another module—in fact, you\
    \ should. It's simply that each page will require a module to be *the* module\
    \ for that page, and it must require all other modules it needs. Given that you\
    \ may mostly be writing single-page apps in AngularJS, you will typically have\
    \ one module for your \"app\" and others for reusable components.\n\nAnother situation\
    \ in which you should create a module is if you have a collection of like components\
    \ that are reusable across disparate single-or-multi-page applications. For example,\
    \ you may need the **`$http`** service to behave in a particular way across all\
    \ of your system's applications, then it's a great idea to create a module that\
    \ all of those applications can include.\n\nI've found a neat way to use modules\
    \ is to say: overwrite a built-in directive or two within one, then include that\
    \ module only when necessary. Also, supplying test fixture functionality to QUnit\
    \ (or any other non-Jasmine framework) is another good use case, as **ngMock**\
    \ only supplies some fixtures if you are using Jasmine.\n\n## The Controller\n\
    \nMainCtrl is our controller. As discussed in The View chapter, it has control\
    \ of the entire page, since it's attached to the `<body>` tag. OK, that's great,\
    \ but what is $scope, what is Posts, and more importantly, where do they come\
    \ from? The short answer is that $scope is a Scope object and Posts is a service,\
    \ and they arrive in your controller via dependency injection. The long answer\
    \ is that this is dependency injection (DI) at work. Dependency injection is a\
    \ core concept of AngularJS and aids unit testing and code organization. Components\
    \ arriving in a function via DI are either included components of AngularJS, or\
    \ custom components you write yourself.\n\nSo what are we doing here? When the\
    \ controller is initialized, we execute the `getPosts()` function in the Posts\
    \ service, wait for its success, put its response into our $scope object, and\
    \ perform some post-processing on said response. The `getPosts()` function returns\
    \ a promise. If you are familiar with `jQuery.Deferred()` or Kristopher Kowal's\
    \ q, then you understand promises. We'll go into promises in detail later. For\
    \ now, know that `getPosts()` returns a promise, and at some point it will be\
    \ resolved, and when it is, the success callback is executed.\n\nWe can see that\
    \ in this controller we're assigning a value to `$scope.posts`. When we do this,\
    \ the view is alerted and the expressions involving posts are (re-)evaluated.\
    \ This is an example of data binding. A portion of a view is data-bound to a model,\
    \ and when either one changes, they are both synchronized.\n\nNote: Initially\
    \ when AngularJS loads, the value of `$scope.posts` (and thus posts in the view)\
    \ is undefined. It is only set after our call to `getPosts()` succeeds! Remember\
    \ this when you are trying to `console.log($posts[0].title)` and you get a `TypeError`.\n\
    \nYou may have put together the connection that anything in your controller assigned\
    \ to `$scope.foo` is available in the view as simply `foo`. This holds true for\
    \ *any* member of the `$scope`, including objects, arrays, primitives and functions.\
    \ You will never have to refer to `$scope` in the view, because it is implied,\
    \ and will correspond to the scope of the nearest controller (as defined by the\
    \ `ng-controller` directive) or directive if that directive affects the scope.\n\
    \n## The Service\n\nPosts is a service. It’s a simple service and provides one\
    \ function, `getPosts()`. You see that the built-in `$http` service is available\
    \ here, and we use it to request data from our fake server, `data.json`. The `$http`\
    \ service is a wrapper around basic Ajax functionality, and can be used to make\
    \ any type of HTTP request. Consider it analogous to `jQuery.ajax()`. We’re firing\
    \ off a GET request and returning from `getPosts()` the object generated by this\
    \ request. As discussed above, this object is a promise. The promise returned\
    \ by requests made by `$http` are unique in that you may use `success()` and/or\
    \ `error()` when resolving them, as we do in the controller.\n\nIt’s important\
    \ to note that a service is a singleton. That means only one instance of the service\
    \ will be available across your entire application. And I do mean instance; AngularJS\
    \ instantiates the service when it is first requested, and we use `this` to put\
    \ members into it. A factory is also a singleton, but it is not instantiated (no\
    \ new keyword involved). More about the difference between factories and services\
    \ later."
  mdcn: "\n- 我们同样使用 DI 定义了一个名为 `Posts` 的服务。它提供了一个函数 `getPosts()`，我们在 `MainCtrl` 控制器中调用它。它使用内置的\
    \ `$http` 服务来联系服务器并返回数据。\n- 最后，我们定义了一个名为 `boldClick` 的 *指令*（directive），它为视图提供了一些酷炫的功能；当你点击绑定该指令的任何元素时，它会在粗体和常规字体粗细之间切换。\n\
    \n## 模块 (The Module)\n\n我们的模块被命名为 `blog`（令人惊讶地简单）。如你将看到的，声明一个模块非常简单，但请注意，注意你必须在\
    \ `module()` 调用中指定一个数组作为第二个参数。该数组的内容将是要包含的模块列表。在我们的案例中，我们没有包含任何其他模块，所以这是一个空数组。一旦我们声明了一个模块并将其赋值给一个变量，我们就可以使用该变量来定义模块内的其他组件。\n\
    \n你必须理解模块声明与模块引用之间的区别：\n\n```\nangular.module('foo', []);\n```\n\n与模块引用：\n\n```\n\
    angular.module('foo');\n```\n\n两者都返回一个模块对象，但前者是**定义**一个模块，而后者是**检索**一个模块。如果你在代码开始时使用了第二种方式，你的应用程序除了向你喷出一些错误之外，什么都不会做。\n\
    \n如果你想包含其他模块（这将运行所有模块代码，并使被包含模块中任何可注入的组件在你的模块中可用），请在模块定义数组参数中通过字符串指定它们的名称。你不能动态地（on-the-fly）包含模块。\n\
    \n因此，如果你想使用 AngularJS 官方提供的 `ngResource` 模块，你必须在 `<script>` 标签中链接到 .js 文件，然后像这样加载它并包含该模块：\n\
    \n```\nangular.module('myModule', ['ngResource']);\n```\n\n现在你可以使用 `$resource`\
    \ 服务了，该服务默认不可用。你可能想包含的一些模块还包括：用于测试的 `ngMock`、用于 cookie 操作的 `ngCookies`，以及用于字符串/HTML\
    \ 净化和后处理的 `ngSanitize` 等。这些默认都不包含在内，因此你必须以某种方式引用它们相应的 .js 文件。\n\n还有一些可能较少为人知但非常实用的模块函数，我们还没有涵盖：\n\
    \n- **value()**: 允许你在一个对象中设置一些“全局”的（可注入的）值；适用于“默认值”。\n- **constant()**: 与 value\
    \ 非常相似，不同之处在于你提供的对象被预期为不可更改，并且可用于 config 函数。\n- **config()**: 在这里注入 provider 以对其进行配置，或者处理常量，或者在初始化阶段执行其他操作。配置\
    \ `$http` 服务的默认请求头或设置路由通常在这里完成。\n- **run()**: 在初始化完成后运行一个任意函数；如果你需要配置一个不是 provider\
    \ 的服务/工厂等，或者使用 `$rootScope` 设置某些内容，这是一个很好的选择。\n\n这里是 **value()** 和 **run()** 的示例：\n\
    \n```\nangular.module('myModule')\n  .value('foo', {bar: 'baz'})\n  .run(function(foo)\
    \ { ... });\n```\n\n这里是 **constant()** 和 **config()** 的示例：\n\n```\nangular.module('myModule')\n\
    \  .constant('foo', {bar: 'baz'})\n  .config(function(foo) { ... });\n```\n\n\
    请注意，你可以将常量注入到 **run()** 函数中，但你不能将 value 注入到 **config()** 函数中。\n\n我们如何知道何时创建模块？在实践中，我发现通常我希望每个（HTML）页面对应一个模块。如果你想自动引导（bootstrap）你的\
    \ AngularJS 应用程序（通常如此），你会使用 **ngApp** 指令。该指令在每个 HTML 页面中只能使用一次。但这并不意味着你不应该将页面之间的公共功能捆绑在另一个模块中——事实上，你应该这样做。简单来说，每个页面都需要一个模块作为该页面的*主*模块，并且该模块必须请求它需要的所有其他模块。鉴于你在\
    \ AngularJS 中可能主要编写单页应用（SPA），你通常会有一个用于“应用”的模块，以及其他用于可复用组件的模块。\n\n另一种应该创建模块的情况是，如果你有一组可以在不同的单页或多页应用程序中复用的相似组件。例如，你可能需要\
    \ **`$http`** 服务在所有系统应用程序中都以某种特定方式运行，那么创建一个所有这些应用程序都可以包含的模块是一个极好的主意。\n\n我发现一个使用模块的巧妙方法是：在一个模块中覆盖一两个内置指令，然后在必要时才包含该模块。此外，为\
    \ QUnit（或任何其他非 Jasmine 框架）提供测试固定装置（fixture）功能是另一个很好的用例，因为 **ngMock** 仅在你使用 Jasmine\
    \ 时才提供部分固定装置。\n\n## 控制器 (The Controller)\n\nMainCtrl 是我们的控制器。正如在“视图”章节中所讨论的，它控制整个页面，因为它被绑定到了\
    \ `<body>` 标签上。好吧，这很棒，但 `$scope` 是什么，`Posts` 是什么，更重要的是，它们是从哪里来的？简单的回答是：`$scope`\
    \ 是一个 Scope 对象，`Posts` 是一个服务，它们通过依赖注入（Dependency Injection）进入你的控制器。详细的回答是：这就是依赖注入\
    \ (DI) 在起作用。依赖注入是 AngularJS 的核心概念，有助于单元测试和代码组织。通过 DI 进入函数的组件要么是 AngularJS 的内置组件，要么是你自己编写的自定义组件。\n\
    \n那么我们在这里做了什么？当控制器初始化时，我们执行 Posts 服务中的 `getPosts()` 函数，等待其成功，将其响应放入我们的 `$scope`\
    \ 对象中，并对该响应执行一些后处理。`getPosts()` 函数返回一个 promise。如果你熟悉 `jQuery.Deferred()` 或 Kristopher\
    \ Kowal 的 q 库，那么你就理解 promise 了。我们稍后将详细讨论 promise。目前，你只需要知道 `getPosts()` 返回一个 promise，它将在某个时间点被解析（resolved），而当它解析时，成功回调函数将被执行。\n\
    \n我们可以看到，在这个控制器中，我们将一个值赋给了 `$scope.posts`。当我们这样做时，视图会被提醒，涉及 posts 的表达式会被（重新）计算。这是一个数据绑定的例子。视图的一部分与模型数据绑定，当其中任何一个发生变化时，两者都会同步。\n\
    \n注意：最初当 AngularJS 加载时，`$scope.posts` 的值（以及视图中的 posts）是 undefined。它只有在调用 `getPosts()`\
    \ 成功之后才会被设置！当你尝试 `console.log($posts[0].title)` 却得到 `TypeError` 时，请记住这一点。\n\n\
    你可能已经意识到，在控制器中赋值给 `$scope.foo` 的任何内容，在视图中只需简单地使用 `foo` 即可访问。这适用于 `$scope` 的*任何*成员，包括对象、数组、原语和函数。你永远不需要在视图中引用\
    \ `$scope`，因为它是隐含的，并且将对应于最近的控制器（由 `ng-controller` 指令定义）的 scope，或者如果该指令影响 scope，则对应于该指令的\
    \ scope。\n\n## 服务 (The Service)\n\nPosts 是一个服务。它是一个简单的服务，提供一个函数 `getPosts()`。你可以看到内置的\
    \ `$http` 服务在这里可用，我们使用它从虚拟服务器 `data.json` 请求数据。`$http` 服务是对基础 Ajax 功能的封装，可用于发起任何类型的\
    \ HTTP 请求。可以将其类比为 `jQuery.ajax()`。我们发起一个 GET 请求，并从 `getPosts()` 返回该请求生成的对象。如前所述，这个对象是一个\
    \ promise。由 `$http` 发起的请求返回的 promise 非常独特，因为在解析它们时，你可以使用 `success()` 和/或 `error()`，就像我们在控制器中做的那样。\n\
    \n重要的是要注意，服务是一个单例（singleton）。这意味着在整个应用程序中只有一个服务实例可用。我指的确实是“实例”；AngularJS 在服务被首次请求时对其进行实例化，我们使用\
    \ `this` 将成员放入其中。工厂（factory）也是单例，但它不会被实例化（不涉及 new 关键字）。关于工厂和服务之间区别的更多内容将在稍后讨论。\n"
