- md: "If we return an object from a promise, it will be passed to the next promise\
    \ in the chain. If we use `$q.reject` and return that instead, the promise will\
    \ be rejected and the next promise in the chain will have its second (failure)\
    \ function executed. And so on and so forth.\n\nI've used promises to wait until\
    \ a modal dialog's template was fetched and the dialog was opened to execute some\
    \ code (if the template was already fetched, the promise is resolved immediately,\
    \ synchronously; this is perfectly acceptable). I've used promises to wait for\
    \ controller *x* to finish asynchronously processing some data so controller *y*\
    \ could start its processing of the data.\n\nYou can even combine promises!\n\n\
    ```javascript\nvar p1 = asyncCode1();\nvar p2 = asyncCode2();\nvar p3 = $q.all(p1,\
    \ p2);\n// then, asyncCode1 resolves; p1 is resolved, but p3 is not\n// next,\
    \ asyncCode2 resolves; p1 is resolved and p2 is resolved, now p3 becomes resolved\n\
    ```\n\nUsing the `all` function, you can resolve one promise when another set\
    \ of promises are all resolved. This can come in handy if you are waiting on two\
    \ different things to asynchronously happen.\n\nIt's easy to propagate errors\
    \ using promises. Here's an example of doing it the old-fashioned, callback-chain\
    \ way:\n\n```javascript\najaxLib.get('url').then(function() {}, {success: function()\
    \ {\n    ajaxLib.get('anotherUrl', {success: function() {\n        ajaxLib.get('yetAnotherUrl',\
    \ {success: function() {\n        }, error: function() { // pop error }};\n  \
    \  }, error: function() { // pop error }};\n}, error: function() { // pop error\
    \ }};\n```\n\nThis is unwieldy. Promises offer a nice alternative, since they\
    \ know whether or not they have been resolved or rejected:\n\n```javascript\n\
    ajaxLib.get('url').then(function(res) {\n}).then(function(res) {\n    return ajaxLib.get('anotherUrl');\n\
    }).then(function(res) {\n    return ajaxLib.get('yetAnotherUrl');\n}, function(error)\
    \ {\n    // pop error\n});\n```\n\nIn the above example, the first error along\
    \ the way will trickle down to the final \"rejected\" function.\n\nNote that sometimes\
    \ promises can take the place of a `$watch`, or vice-versa. Here's an example:\n\
    \n```javascript\n// note no module here; not necessary for example.\nfunction\
    \ ParentCtrl($q, $http) {\n    $scope.getFoo = function() {\n        return $http.get('foo.url').success(function(data)\
    \ {\n            $scope.foo = data;\n        });\n    };\n}\nfunction ChildCtrl()\
    \ {\n    $scope.getFoo().then(function() {\n        // do something with $scope.foo\n\
    \    });\n}\n```\n\nNow the alternative:\n\n```javascript\nfunction ParentCtrl($http)\
    \ {\n  $scope.getFoo = function() {\n    $http.get('foo.url').success(function(data)\
    \ {\n      $scope.foo = data;\n    });\n  };\n}\n\nfunction ChildCtrl() {\n  var\
    \ foo_watch = $scope.$watch('foo', function(foo, old_foo) {\n    if (foo != old_foo\
    \ && !!foo) {\n      // do something with foo\n      foo_watch(); // stop watching\n\
    \    }\n  });\n  $scope.getFoo();\n}\n```\n\nWhich is better? I'd call the promise\
    \ strategy more elegant. I'd say use the `$watch` strategy only if you need to\
    \ execute some code against foo *more than once*. Don't cancel the `$watch` by\
    \ calling its return function, and you got it. Otherwise, if you did this with\
    \ promises, you'd have to set up a `$watch` anyways!\n\n## Debugging AngularJS\
    \ Apps\n\nWhile, on the main, AngularJS is easy to debug, there is one issue that\
    \ complicates things. If a directive is not recognized for whatever reason, it\
    \ silently fails. That means your directive code can have a syntax error or something,\
    \ but it’ll never get run because the directive won’t register and AngularJS just\
    \ skips any attribute it doesn’t understand. When writing directives then, it’s\
    \ often helpful to have a simple `console.log` (or `$log.log` as you’ll see below)\
    \ in there to assert it even got linked/compiled. If you don’t see the log message,\
    \ AngularJS didn’t recognize your directive.\n\n### Firebug & Chrome Developer\
    \ Tools\n\nThese two tools are indispensible. I don’t know how you can write a\
    \ client-side JavaScript application without them. If you use Firefox you can\
    \ get Firebug at http://getfirebug.com. If you use IE, or at least have to put\
    \ up with IE, you can also get Firebug Lite. Chrome Dev Tools come preinstalled.\
    \ Both do their jobs well enough, but if you use Chrome you have the added bonus\
    \ of access to the AngularJS Batarang!\n\n### The AngularJS Batarang!\n\nIf you\
    \ use Chrome (and you should really try it if you haven’t; the developer tools\
    \ are quite good), you can install a Chrome extension (or whatever they call it)\
    \ called the AngularJS Batarang (https://chrome.google.com/webstore/detail/angularjs-batarang).\
    \ This is a project by Brian Ford (http://briantford.com), an AngularJS whiz.\
    \ With this amazing tool, you can inspect any element on the page and easily view\
    \ its scope within the right-hand panes (where the CSS style information lives).\
    \ This saves you from having to `console.log($scope)` all over the place to see\
    \ what’s in there (note you cannot just dump the scope using {{}}; even if you\
    \ can get to the scope object, it just outputs as “SCOPE”, which is not helpful).\n\
    \nIn addition to that, you can examine the entire scope hierarchy at a glance\
    \ within the Batarang’s own tab. If you have a lot of scopes, this display can\
    \ seem overwhelming, but it’s a great way to visualize your app as a whole. There\
    \ are other tools within the Batarang, but these two are the ones I find most\
    \ useful.\n\n### $log\n\nAngularJS provides `$log`, which is an alias for `window.console`\
    \ by default, unless you redefine it. So `console.log` becomes `$log.log`. Might\
    \ save you some keystrokes, but you still have to inject the thing. The real power\
    \ of `$log` is that you CAN redefine it (or any other service or directive in\
    \ AngularJS for that matter) and make it do whatever you want. Want it to pop\
    \ alerts instead for some bizarre reason? You can do that. You can output errors\
    \ to the HTML if you want. `$log` is a provider, so if you are going to redefine\
    \ it, be sure to use `Module.provider` (an example of this is below).\n\n### $exceptionHandler\n\
    \nBy default, AngularJS traps all exceptions coming out of it. That is important\
    \ information to know if you are wondering why `window.onerror` never gets called.\
    \ What you see when you see AngularJS exceptions (or exceptions in your AngularJS\
    \ code) is simply a call to `$log.error` or something akin to that. Redefine the\
    \ `$exceptionHandler` class to rethrow errors if you wish to attach behavior to\
    \ `window.onerror`, or redefine it to do whatever you want. Here's an example\
    \ that we can use in our blog:\n\n```javascript\nblog.provider('$exceptionHandler',\
    \ function () {\n    this.$get = function() {\n        return function(e) {\n\
    \            throw e;\n        };\n    };\n});\n```\n\nThat's it!\n\n## I18n and\
    \ L10n\n\nAngularJS provides some utility for localizing your apps. As of this\
    \ writing it supports localization for the datetime, number and currency filters.\
    \ Of course, I'm not sure how much sense the currency filter makes when you have\
    \ a currency like 5.00 and you can choose to display it as $5.00 or €5.00. That'd\
    \ be great if the exchange rates were 1:1!\n\nIn addition to this, one of the\
    \ directives, `ngPluralize` (which helps you do stuff like display \"1 sock\"\
    \ or \"2 socks\" depending on certain criteria) is localizable.\n\nThe `$locale`\
    \ service will provide you with the current locale ID of the browser using `$locale.id`.\n\
    \n## Conclusion\n\nYou should now have some ideas about practical applications\
    \ of AngularJS. In the next, and final, chapter, we will look at how Angular plays\
    \ with third party technologies.\n\n## Chapter 10. AngularJS and Third Party Tech\n\
    \nIn a perfect world you’d never have to use jQuery with AngularJS, but since\
    \ AngularJS does not do everything jQuery does, and perhaps most importantly does\
    \ not have a plugin architecture supporting jQuery plugins, you’re probably going\
    \ to want to use it somewhere.\n\nWant to use that charting library? How about\
    \ that carousel widget? What about something simple in a directive, like selecting\
    \ some nodes by class? Not in AngularJS, but there is jQuery to the rescue.\n\n\
    ### jQuery and AngularJS\n\nWhen working with elements within AngularJS, you never\
    \ get a raw Element object. You always get an object with a jqLite (or jQuery,\
    \ depending) wrapper around it. This is very handy since you are given some convenience\
    \ methods, and can always access the underlying Element object anyway:\n\n```javascript\n\
    angular.module('myApp').directive('someInputTagRelatedDirective', function() {\n\
    \    return function(scope, elm, attrs) {\n        // elm.get(0) does not work\
    \ in jqLite\n        console.log(elm[0].getAttribute('type')); // this works\n\
    \    };\n});\n```\n\nAs mentioned previously, if you want to see everything you\
    \ can do with a jqLite object, look here: [http://docs.angularjs.org/api/angular.element](http://docs.angularjs.org/api/angular.element).\
    \ If this happens to be everything you imagine you could possibly want to do with\
    \ your application, great! You don't need jQuery. You are among the lucky few.\n\
    \nFor the rest of us, note that including jQuery will actually *replace* jqLite.\
    \ That means `angular.element()` becomes an alias for jQuery or `$`. As a best\
    \ practice, it may be a good idea to use `$` or jQuery anyway when you want to\
    \ use non-jqLite functions, since if you forget to include jQuery, it will be\
    \ more immediately obvious why your code is not functioning and why your functions\
    \ are undefined."
  mdcn: "\n如果我们从一个 promise 中返回一个对象，它将被传递给链条中的下一个 promise。如果我们使用 `$q.reject` 并返回它，那么该\
    \ promise 将被拒绝，链条中的下一个 promise 将执行其第二个（失败）函数。以此类推。\n\n我曾使用 promise 来等待模态对话框的模板被获取以及对话框打开后再执行某些代码（如果模板已经获取，promise\
    \ 将立即同步地 resolved；这是完全可以接受的）。我还使用 promise 来等待控制器 *x* 完成某些数据的异步处理，以便控制器 *y* 可以开始处理这些数据。\n\
    \n你甚至可以组合 promise！\n\n```javascript\nvar p1 = asyncCode1();\nvar p2 = asyncCode2();\n\
    var p3 = $q.all(p1, p2);\n// 然后，asyncCode1 resolved；p1 已 resolved，但 p3 尚未 resolved\n\
    // 接着，asyncCode2 resolves；p1 和 p2 都已 resolved，此时 p3 变为 resolved\n```\n\n通过使用 `all`\
    \ 函数，你可以在另一组 promise 全部 resolved 时 resolve 一个 promise。如果你在等待两件不同的事情异步发生，这将非常有用。\n\
    \n使用 promise 很容易传播错误。这是一个使用传统的、回调链方式处理的示例：\n\n```javascript\najaxLib.get('url').then(function()\
    \ {}, {success: function() {\n    ajaxLib.get('anotherUrl', {success: function()\
    \ {\n        ajaxLib.get('yetAnotherUrl', {success: function() {\n        }, error:\
    \ function() { // pop error }};\n    }, error: function() { // pop error }};\n\
    }, error: function() { // pop error }};\n```\n\n这种方式非常笨拙。Promise 提供了一个很好的替代方案，因为它们知道自己是否已被\
    \ resolved 或 rejected：\n\n```javascript\najaxLib.get('url').then(function(res)\
    \ {\n}).then(function(res) {\n    return ajaxLib.get('anotherUrl');\n}).then(function(res)\
    \ {\n    return ajaxLib.get('yetAnotherUrl');\n}, function(error) {\n    // pop\
    \ error\n});\n```\n\n在上面的示例中，沿途遇到的第一个错误将下传到最后的“rejected”函数中。\n\n请注意，有时 promise\
    \ 可以取代 `$watch`，反之亦然。这里有一个示例：\n\n```javascript\n// 注意这里没有模块；示例中不需要。\nfunction\
    \ ParentCtrl($q, $http) {\n    $scope.getFoo = function() {\n        return $http.get('foo.url').success(function(data)\
    \ {\n            $scope.foo = data;\n        });\n    };\n}\nfunction ChildCtrl()\
    \ {\n    $scope.getFoo().then(function() {\n        // 对 $scope.foo 执行某些操作\n \
    \   });\n}\n```\n\n现在来看另一种方案：\n\n```javascript\nfunction ParentCtrl($http) {\n\
    \  $scope.getFoo = function() {\n    $http.get('foo.url').success(function(data)\
    \ {\n      $scope.foo = data;\n    });\n  };\n}\n\nfunction ChildCtrl() {\n  var\
    \ foo_watch = $scope.$watch('foo', function(foo, old_foo) {\n    if (foo != old_foo\
    \ && !!foo) {\n      // 对 foo 执行某些操作\n      foo_watch(); // 停止监听\n    }\n  });\n\
    \  $scope.getFoo();\n}\n```\n\n哪种更好？我认为 promise 策略更优雅。我会说，只有当你需要对 foo 执行*多次*代码操作时，才使用\
    \ `$watch` 策略。如果不通过调用其返回函数来取消 `$watch`，你就成功了。否则，如果你用 promise 来做这件事，你最终还是得设置一个\
    \ `$watch`！\n\n## 调试 AngularJS 应用\n\n虽然从主观上讲，AngularJS 很容易调试，但有一个问题会让事情变得复杂。如果出于某种原因指令（directive）未被识别，它会静默失败。这意味着你的指令代码可能存在语法错误或其他问题，但它永远不会被运行，因为指令无法注册，而\
    \ AngularJS 会直接跳过任何它无法理解的属性。因此，在编写指令时，在其中加入一个简单的 `console.log`（或者像下面看到的 `$log.log`）来确认它确实被\
    \ link/compile 了，通常是非常有帮助的。如果你没有看到日志消息，说明 AngularJS 没有识别你的指令。\n\n### Firebug 与\
    \ Chrome 开发者工具\n\n这两个工具是不可或缺的。我不知道在没有它们的情况下如何编写客户端 JavaScript 应用程序。如果你使用 Firefox，可以在\
    \ http://getfirebug.com 获取 Firebug。如果你使用 IE，或者至少不得不忍受 IE，你也可以获取 Firebug Lite。Chrome\
    \ 开发者工具是预装的。两者都能很好地完成工作，但如果你使用 Chrome，你还有一个额外的福利：可以使用 AngularJS Batarang！\n\n\
    ### AngularJS Batarang!\n\n如果你使用 Chrome（如果你还没试过，真的应该试一下；它的开发者工具非常出色），你可以安装一个名为\
    \ AngularJS Batarang (https://chrome.google.com/webstore/detail/angularjs-batarang)\
    \ 的 Chrome 扩展。这是由 AngularJS 高手 Brian Ford (http://briantford.com) 开发的一个项目。使用这个神奇的工具，你可以检查页面上的任何元素，并在右侧面板（CSS\
    \ 样式信息所在位置）中轻松查看其作用域（scope）。这让你不必在到处写 `console.log($scope)` 来查看其中的内容（请注意，你不能直接使用\
    \ {{}} 来 dump 作用域；即使你能访问到 scope 对象，它也只会输出为 “SCOPE”，这毫无帮助）。\n\n除此之外，你还可以在 Batarang\
    \ 自己的标签页中一目了然地检查整个作用域层级。如果你有大量的作用域，这个显示结果可能会让人感到压力，但它是将应用整体可视化的一种绝佳方式。Batarang\
    \ 中还有其他工具，但这两个是我发现最实用的。\n\n### $log\n\nAngularJS 提供了 `$log`，除非你重新定义它，否则它默认是 `window.console`\
    \ 的别名。因此 `console.log` 变成了 `$log.log`。这可能会为你节省一些击键次数，但你仍然需要注入它。`$log` 真正的威力在于你可以重新定义它（或者事实上\
    \ AngularJS 中的任何其他服务或指令），并让它执行任何你想要的操作。出于某些奇怪的原因想让它弹出 alert 吗？你可以这样做。如果你愿意，你也可以将错误输出到\
    \ HTML 中。`$log` 是一个 provider，所以如果你打算重新定义它，请务必使用 `Module.provider`（下面有一个示例）。\n\n\
    ### $exceptionHandler\n\n默认情况下，AngularJS 会捕获从其内部抛出的所有异常。如果你在疑惑为什么 `window.onerror`\
    \ 从未被调用，这就是一条重要的信息。当你看到 AngularJS 异常（或你的 AngularJS 代码中的异常）时，看到的其实只是对 `$log.error`\
    \ 或类似函数的调用。如果你希望将行为绑定到 `window.onerror`，可以重新定义 `$exceptionHandler` 类以重新抛出错误，或者重新定义它以执行任何你想要的操作。这里有一个我们可以在博客中使用的示例：\n\
    \n```javascript\nblog.provider('$exceptionHandler', function () {\n    this.$get\
    \ = function() {\n        return function(e) {\n            throw e;\n       \
    \ };\n    };\n});\n```\n\n就这么简单！\n\n## I18n 与 L10n\n\nAngularJS 提供了一些用于本地化应用的实用工具。在撰写本文时，它支持日期时间（datetime）、数字（number）和货币（currency）过滤器的本地化。当然，我不确定当你有像\
    \ 5.00 这样的金额，且可以选择将其显示为 $5.00 或 €5.00 时，货币过滤器在多大程度上是有意义的。如果汇率是 1:1，那就太棒了！\n\n\
    除此之外，其中一个指令 `ngPluralize`（它可以帮助你根据特定标准显示 “1 sock” 或 “2 socks” 之类的内容）也是可以本地化的。\n\
    \n`$locale` 服务将通过 `$locale.id` 为你提供浏览器当前的本地化 ID。\n\n## 结论\n\n现在你应该对 AngularJS\
    \ 的实际应用有一些想法了。在接下来的最后一章中，我们将探讨 Angular 如何与第三方技术协作。\n\n## 第 10 章. AngularJS 与第三方技术\n\
    \n在一个完美的世界里，你永远不需要在 AngularJS 中使用 jQuery，但由于 AngularJS 并没有实现 jQuery 的所有功能，而且最重要的一点是它没有支持\
    \ jQuery 插件的插件架构，所以你可能在某些地方想要使用它。\n\n想使用那个图表库？或者那个轮播组件？或者在指令中做一些简单的事情，比如通过类选择一些节点？AngularJS\
    \ 做不到，但 jQuery 可以来救援。\n\n### jQuery 与 AngularJS\n\n在 AngularJS 中操作元素时，你永远不会得到一个原始的\
    \ Element 对象。你总是得到一个被 jqLite（或 jQuery，取决于情况）包装的对象。这非常方便，因为你获得了一些便捷方法，并且无论如何都可以访问底层的\
    \ Element 对象：\n\n```javascript\nangular.module('myApp').directive('someInputTagRelatedDirective',\
    \ function() {\n    return function(scope, elm, attrs) {\n        // elm.get(0)\
    \ 在 jqLite 中不起作用\n        console.log(elm[0].getAttribute('type')); // 这个可以工作\n\
    \    };\n});\n```\n\n如前所述，如果你想查看 jqLite 对象能做的所有事情，请参阅这里：[http://docs.angularjs.org/api/angular.element](http://docs.angularjs.org/api/angular.element)。如果这涵盖了你想象中应用可能需要的所有操作，太好了！你不需要\
    \ jQuery。你是少数幸运儿之一。\n\n对于我们其他人，请注意，引入 jQuery 实际上会*替换* jqLite。这意味着 `angular.element()`\
    \ 变成了 jQuery 或 `$` 的别名。作为最佳实践，当你想要使用非 jqLite 函数时，无论如何使用 `$` 或 jQuery 可能是个好主意，因为如果你忘记引入\
    \ jQuery，你的代码无法运行以及函数未定义的原因会更加显而易见。\n"
