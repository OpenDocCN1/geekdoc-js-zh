    \ function(response) {\n      // .. and so on\n    })\n  })\n})\n```\n\nWhen you\
    \ chain callbacks like this, it’s called stair-stepping, and unless you want to\
    \ go crazy, you should avoid this. Promises help you do that. You can do this:\n\
    \n```\najaxLib.GET('foo.url')\n  .success(function(response) { return ajaxLib.GET('bar.url')\
    \ })\n  .success(function(response) { return ajaxLib.GET('baz.url') });\n```\n\
