  md: "# # The Widget\n\nI don't think there's any formal definition for what a widget\
    \ is, but often I've heard it used to reference a UI element, particularly one\
    \ that a user can interact with in some way. Maybe this is a date picker or a\
    \ rich text editor. But these can also be very simple, like this dead-simple example\
    \ of an accordion:\n\n```\nblog.directive('accordion', function() {\n    return\
    \ {\n        restrict: 'E',\n        replace: true,\n        template: '<div class=\"\
    accordion\"><h3>{{title}}</h3>' +\n                  '<div class=\"accordion-content\"\
    \ ng-show=\"open\" ng-transclude></div>',\n        transclude: true,\n       \
    \ scope: {\n            title: '='\n        },\n        link: function(scope,\
    \ elm) {\n            scope.open = false;\n            // assume we have no jQuery.\n\
    \            angular.element(elm.children()[0]).bind('click', function() {\n \
    \               scope.$apply('open = !open');\n            });\n        }\n  \
    \  };\n});\n```\n\nOK, maybe not *dead* simple, but it's definitely maimed. Let's\
    \ go at it one piece at a time.\n\n+   - **restrict**: We've already covered the\
    \ E restriction, which tells AngularJS the directive is to be used as an element;\
    \ `<accordion>...</accordion>`.\n- **replace**: We want the directive to replace\
    \ the `<accordion>...</accordion>` markup in our HTML with the template, which\
    \ is specified by...\n- **template**: Nothing new here except the use of the `ngTransclude`\
    \ directive. If you have this somewhere in your template, and specify...\n- **transclude**:\
    \ ...to be true, then the contents of the original HTML will be placed inside\
    \ the node that has the ngTransclude directive on it. So we can use this directive\
    \ like so: `<accordion>beans</accordion>` and \"beans\" will appear within the\
    \ `<div>` with the class accordion-content. The `ngTransclude` directive basically\
    \ just says \"put the directive's original content here.\"\n- **scope**: This\
    \ loathsome object tells us to create an isolate scope, and within that scope\
    \ create a model called \"title\", and the value of this model will be the value\
    \ of the attribute \"title\" in the directive. So: `<accordion title=\"'pinto'\"\
    >beans</accordion>` will give the directive a title to work with. Note that the\
    \ value of the title attribute here is a string, but it could be the value of\
    \ whatever AngularJS expression you wish.\n\nThe keys of this object are the names\
    \ of members of the new isolate scope, and the values are describing how to get\
    \ these values. A `=` will link directly to a model in the parent scope *with\
    \ the same name*. `=foo` will link to a model in the parent scope of the name\
    \ 'foo'. A `@` will treat your attribute *with the same name* as a string, basically.\
    \ `@foo` will look for an attribute called foo and assign it to whatever the key\
    \ is. `&` allows you to bind an expression and execute it against the parent scope\
    \ with a function. Given `{localFn: '&'}`, the directive will look for a 'local-fn'\
    \ attribute and put its value (say, \"foo + 2\") into a function. When you are\
    \ ready, execute `localFn()`, and the result will be evaluated against"
  merge: -1
  pgno: 74
- img_proc: true
  md: "the parent scope and returned. If the expression contains a function with arguments,\
    \ you can pass arguments as a name/value mapping into the localFn: if the expression\
    \ is “foo(bar)”, you may say `localFn({bar: ‘baz’})` and ‘baz’ will be passed\
    \ in as ‘bar’ to the ‘foo’ function in the expression.\n\n* link: What do we get\
    \ in elm? We get the root element of our template, which is the `<div>` with the\
    \ accordion class. First, we set open to be false to control the visibility of\
    \ the accordion’s content. Then we grab the `<h3>` node (remember, no selectors\
    \ in jQLite) and bind a click event to it, which simply flips the boolean value\
    \ of the open model—which, in turn, hides and shows the content.\n\nThe markup\
    \ for this looks like:\n\n```\n<!-- Usage of our accordion directive\n[source,html]\n\
    ---\n<accordion title=\"I like..\">pinto beans!</accordion>\n---\n-->\n```\n\n\
    Easy and neat. Output looks something like:\n\n```\n<div class=\"accordion\">\n\
    \  <h3>I like..</h3>\n  <div class=\"accordion-content\" ng-show=\"open\" ng-transclude>pinto\
    \ beans!</div>\n</div>\n```\n\nThe `<h3>` node, when clicked, will hide and show\
    \ the its sibling `<div>`. You could also implement a dropdown-type menu this\
    \ way using some CSS and HTML lists."
