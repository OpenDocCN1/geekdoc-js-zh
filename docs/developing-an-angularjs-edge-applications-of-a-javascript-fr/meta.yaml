- img_proc: true
  md: "Here is the header.html:\n\n```\n<div ng-controller=\"HeadCtrl\">\n    <h1>{{title}}</h1>\n\
    \    <h3>{{description}}</h3>\n</div>\n```\n\nAnd here is the footer.html:\n\n\
    ```\n<!-- directive: copyright -->\n```\n\nThat’s it! As you can see, ngInclude\
    \ expects an AngularJS expression for the src attribute; that way you can dynamically\
    \ change which template ID you are after.\nIf you want to include a template from\
    \ within a directive (outside of the context of the template or templateUrl arguments),\
    \ you can mimic what ngInclude does in a manner akin to this:\n\n```\nmyApp.directive('myInclude',\
    \ function ($templateCache, $http, $q, $compile) {\n    return {\n        restrict:\
    \ 'E',\n        link: function (scope, elm, attrs) {\n            // retrieves\
    \ a template from the template cache over http as necessary.\n            // returns\
    \ a promise.\n            (function () {\n                var dfrd, template =\
    \ $templateCache.get(scope.$eval(attrs.src));\n                if (template) {\n\
    \                    dfrd = $q.defer();\n                    dfrd.resolve(template);\n\
    \                    return dfrd.promise;\n                } else {\n        \
    \            return $http.get(scope.$eval(attrs.src), {}, {cache: $templateCache});\n\
    \                }\n            })().then(function (res) {\n                elm.replaceWith($compile(res.data)(scope));\n\
    \            });\n        }\n    };\n});\n```\n\nAnd you can use it this way,\
    \ just as you would ngInclude:\n\n```\n<my-include src=\"'foo.html'\"></my-include>\n\
    ```\n\nOf course, since ngInclude already exists, this is a futile exercise, but\
    \ it shows you how you can retrieve templates on-the-fly from within a directive\
    \ if you need to.\nThere is yet another way to include a template, and that is\
    \ the ngView directive. To use it you must be using the $route service.\n\n# The\
    \ Template Cache\n\nNote that templates are cached within the $templateCache service.\
    \ If you have defined a template in a <script> tag, it will be loaded by AngularJS\
    \ and cached for later. When you go to retrieve it, it has already been cached\
    \ and simply needs to be compiled against the scope at that point. Partials, however,\
    \ are not immediately loaded, so they will not be in the $templateCache until\
    \ after the first time you load them. When a template is put in the template cache,\
    \ it’s indexed by its ID. The ID of our template above is foo, obviously enough.\
    \ However, partials don’t have this attribute, but they do have IDs. The ID of\
    \ a partial is simply the full path it was referenced with. For example, if you\
    \ have a partial living in /static/partials/foo.html, /static/partials/foo.html\
    \ is the ID.\n\nTemplates are cached by default as it’s a rare occurrence in which\
    \ this behavior is undesirable. If you want to remove template with ID id, use\
    \ $templateCache.remove(id)."
