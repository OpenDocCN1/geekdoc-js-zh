    });\n```\n\n```\ndescribe('edit', function () {\n    it('should call _stopEditingAllPosts',\
    \ inject(function (Post) {\n        var post = new Post();\n        spyOn(scope,\
    \ '_stopEditingAllPosts');\n        scope.edit(post);\n        expect(scope._stopEditingAllPosts).toHaveBeenCalled();\n\
