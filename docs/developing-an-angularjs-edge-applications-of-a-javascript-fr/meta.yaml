    yourself a lot of JavaScript.'
  - "[PAGE 78]\n\n# Custom Validation\n\nI needed to validate a \"time\" field. This\
    \ time must be some date/time in the future, but not *too* far in the future.\
    \ Since there's no time picker widget (we could write one, I guess) let's just\
    \ use a text input field and run custom validation against it. The user will have\
    \ to type in a parseable date/time. Our markup will look like this:\n\n```\n<form\
    \ name=\"timeForm\">\n  <input name=\"time\" type=\"text\" futureTime placeholder=\"\
    enter a time\" ng-model=\"time\"/>\n</form>\n```\n\nNote that to use AngularJS'\
    \ validation mechanism, you must use a form. You can nest forms if necessary (using\
    \ `ngForm`), but we won't be doing that here. This is the `futureTime` directive:\n\
    \n```\n// futureTime directive sets validity of text input box if the user types\
    \ in a parsable time that\n// is in the future\nblog.directive('futureTime', function()\
    \ {\n    return {\n        require: '?ngModel',\n        link: function(scope,\
    \ elm, attrs, ngModel) {\n\n            // no 'get()' in jqLite; use elm as array\
    \ to get at the DOM node object\n            if (!ngModel || attrs.type !== 'text'\
    \ || elm[0].tagName.toLowerCase() !== 'input') {\n                return; // do\
    \ nothing if no ngModel specified OR the input field is not of type \"text\"\n\
    \            }\n\n            // we want this to be the first check we do, in\
    \ case there are others.\n            // whatever we return from this function\
    \ ends up as the view value, so if you\n            // want to clear invalid input,\n\
    \            // simply return nothing.\n            ngModel.$parsers.unshift(function(view_value)\
    \ {\n                var ts, nows;\n                // first case: empty field.\
    \ this is OK\n                if (!view_value) {\n                    ngModel.$setValidity('futureTime',\
    \ true);\n                    return;\n                }\n\n                //\
    \ second case: unparsable date\n                ts = Date.parse(view_value);\n\
    \                if (isNaN(ts) || ts < 0) {\n                    ngModel.$setValidity('futureTime',\
    \ false);\n                    return view_value;\n                }\n\n     \
    \           // third case: valid date, but in the past or present\n          \
    \      nows = new Date().getTime();\n                if (ts <= nows) {\n     \
    \               ngModel.$setValidity('futureTime', false);\n                 \
    \   return view_value;\n                }\n\n                // fourth case: future\
    \ date!\n                ngModel.$setValidity('futureTime', true);\n         \
    \       return view_value;\n            });\n        }\n    };\n});\n```\n\nSince\
    \ we have a form, we can use AngularJS' built-in validation. Let's change our\
    \ HTML partial to this:\n\n```\n<form name=\"timeForm\">\n  <input name=\"time\"\
    \ type=\"text\" future-time placeholder=\"enter a time\" ng-model=\"time\"/>\n\
    \  <div style=\"color: red\" ng-show=\"timeForm.time.$error.futureTime\">This\
    \ is not a valid future time.</div>\n</form>\n```\n\nWhen we name a `<form>`,\
    \ it triggers AngularJS' built-in form directive. This will put a"
  - "[PAGE 79]\n\nmodel into the scope representing the form with the same name as\
    \ that form. So since we named our form “timeForm”, it is available on the scope.\
    \ Also, any named form fields within that form are available as objects within\
    \ the form model. Since we have an <input> named “time”, we can refer to it as\
    \ `timedForm.time`. Note that this does NOT represent the actual value of the\
    \ form element; that is reserved for `ngModel`.\n\n```\n<form name=\"foo\">\n\
    \  <input name=\"bar\" required=\"true\"/>\n</form>\n```\n\n![](img/f95c537c2fc9346a21a144b89cfac580_79_0.png)\n\
    \nWhen doing validation in this manner, manner, AngularJS sets some special values\
    \ within the input field model, one of which is `$error`. When we do `ngModel.$setValidity('something',\
    \ false);`, we are telling AngularJS that the model has an error in it, and it\
    \ the error has the validation error key of \"something\". The value will be boolean\
    \ true if there is a problem and false if not. As a bonus, AngularJS will put\
    \ a class on the form element. If you have a validation error key in the form\
    \ someCamelCase, it will slap the ng-valid-some-camel-case or the ng-invalid-some-camel-case\
    \ class on the element, depending. That way you can highlight a bad field in red\
    \ quite easily if you wish.\n\nThis is just one example of how to do custom validation.\
    \ With the classes and data-bound booleans, it accommodates many configurations\
    \ of error reporting. We'll do another \"cookbook\" style example of form validation\
    \ later.\n\nHere are some tests for our `futureTime` directive:\n\n```\ndescribe('Binding\
    \ Directives', function () {\n  var $compile, scope;\n\n  // this is a helper\
    \ function to use when unit testing directives;\n  // you will find yourself doing\
    \ this often\n  function compileAndApply(template) {\n    var compiled = $compile(template)(scope);\n\
    \    scope.$apply();\n    scope.$digest();\n    return compiled;\n  }\n\n  beforeEach(inject(function\
    \ ($injector, $rootScope) {\n    $compile = $injector.get('$compile');\n    scope\
    \ = $rootScope.$new();\n  }));\n\n  describe('the linking function', function\
    \ () {\n\n```"
  - "[PAGE 80]\n\n```\nit('should not throw error if no ngModel supplied', function\
    \ () {\n    var template = '<form name=\"timeForm\">' +\n        '<input name=\"\
    time\" type=\"text\" future-time/>' +\n        '</form>';\n    expect(function\
    \ () {\n        compileAndApply(template);\n    }).not.toThrow();\n});\n```\n\n\
    ```\nit('should be valid on undefined value', function () {\n    var template\
    \ = '<form name=\"timeForm\">' +\n        '<input ng-model=\"time\" name=\"time\"\
    \ type=\"text\" future-time/>' +\n        '</form>';\n    compileAndApply(template);\n\
    \    expect(scope.time).toBeUndefined();\n    expect(scope.timeForm.$valid).toBeTruthy();\n\
    });\n```\n\n```\nit('should be invalid on non-parseable date', function () {\n\
    \    var template = '<form name=\"timeForm\">' +\n        '<input ng-model=\"\
    time\" name=\"time\" type=\"text\" future-time/>' +\n        '</form>';\n    compiled\
    \ = compileAndApply(template);\n\n    // this appears to be how you fake an input\
    \ change.\n    compiled.find('input').val('not a date');\n    compiled.find('input').triggerHandler('input');\n\
    \    expect(scope.timeForm.$valid).toBeFalsy();\n});\n```\n\n```\nit('should be\
    \ invalid on past date', function () {\n    var template = '<form name=\"timeForm\"\
    >' +\n        '<input ng-model=\"time\" name=\"time\" type=\"text\" future-time/>'\
    \ +\n        '</form>';\n    compiled = compileAndApply(template);\n\n    compiled.find('input').val('1998-01-01');\n\
    \    compiled.find('input').triggerHandler('input');\n\n    expect(scope.timeForm.$valid).toBeFalsy();\n\
    });\n```\n\n```\nit('should be valid on future date', function () {\n    var template\
    \ = '<form name=\"timeForm\">' +\n        '<input ng-model=\"time\" name=\"time\"\
    \ type=\"text\" future-time/>' +\n        '</form>';\n    compiled = compileAndApply(template);\n\
    \n    compiled.find('input').val('2050-01-01');\n    compiled.find('input').triggerHandler('input');\n\
    \n    expect(scope.timeForm.$valid).toBeTruthy();\n});\n});\n```\n\nHere we've\
    \ unearthed directives, which are truly powerful. It's of utmost importance to\
    \ write reusable and generic directives—the less reusable they are (say, by polluting\
    \ scopes), the more of a maintenance nightmare you'll incur when revisiting them\
    \ in the future, and you will wake up screaming.\n\nNext we'll learn a bit more\
    \ about directives: when to use them, how to write a reusable directive, how to\
    \ use isolate scopes, and the difference between compilation and linking."
- md: "## More About Directives\n\nA directive either is some sort of HTML element\
    \ (or comment) or it attaches itself to one. Directives don't make sense without\
    \ HTML elements. If you want to interact with an HTML element, try using a directive.\
    \ If you are doing anything else, don't.\n\nDirectives cannot directly \"include\"\
    \ linking or compilation functions from other directives. They are not injectable.\
    \ If you think you need to inject a directive, you're doing it wrong. Instead,\
    \ you may write some HTML using the directive that actually calls another directive.\
    \ An example of this is the accordion \"widget\" from earlier, which I'll repeat\
    \ here:\n\n```javascript\nblog.directive('accordion', function() {\n  return {\n\
    \    restrict: 'E',\n    replace: true,\n    template: '<div class=\"accordion\"\
    ><h3>{{title}}</h3>' +\n      '<div class=\"accordion-content\" ng-show=\"open\"\
    \ ng-transclude></div>',\n    transclude: true,\n    scope: {\n      title: '='\n\
    \    },\n    link: function(scope, elm) {\n      scope.open = false;\n      //\
    \ assume we have no jQuery.\n      angular.element(elm.children()[0]).bind('click',\
    \ function() {\n        scope.$apply('open = !open');\n      });\n    }\n  };\n\
    });\n```\n\nThe template of this directive has another two directives in it: `ngShow`\
    \ and `ngTransclude`. That's how you include one directive in another. If you\
    \ need to share functionality between directives, you can specify a controller\
    \ that multiple directives can use—and they can even use this controller to talk\
    \ to each other.\n\n## Reusable Directives\n\nContinuing our discussion from earlier\
    \ about widgets—if you want to write a reusable directive, there are some steps\
    \ you should take. The first step is making sure you don't pollute any scopes.\
    \ Here's an example of a directive that pollutes the scope:\n\n```javascript\n\
    myApp.directive('badDirectiveIsBad', function() {\n  return function(scope, elm,\
    \ attrs) {\n    scope.foo = scope.$eval(attrs.badDirectiveIsBad);\n  };\n});\n\
    ```\n\nThis is bad because we took `<div bad-directive-is-bad=\"'bar'\"/>` and\
    \ polluted the current scope with the foo model. If we have some controller in\
    \ play, that controller's scope will now have foo in it, and any scope descending\
    \ from that scope. Furthermore, if foo was a model in the scope, you have just\
    \ blasted it away. Obviously this can be the source of bugs. We can avoid this.\n\
    \nWe avoid this by having our directive create its *own* scope. Well—that solves\
    \ the problem of polluting the current scope, but not the parent scope. To avoid\
    \ that problem, we create an *isolate* scope. An isolate scope differs from a\
    \ normal scope in that it does not prototypically inherit from its parent. You\
    \ can throw anything in an isolate scope without worry of it polluting any other\
    \ scope.\n\nThe salient option is the scope property of the object returned by\
    \ your directive. Set it, and you have an isolate scope. Here's a marginally useful\
    \ example of a directive safely using an isolate scope, which we can add to our\
    \ blog code:\n\n```javascript\n// Debug directive helps you debug a little more\
    \ nicely than normal.\n// This could be accomplished with a filter as well.\n\
    // Usage:\n// <debug val=\"foo\"/>\n// Output HTML:\n// <debug val=\"foo\"><pre>{{debug(expression)}}</pre></debug>\n\
    // ... where debug(expression) results in a pretty-printed JSON representation\
    \ of the expression\n// defined in @val.\nblog.directive('debug', function() {\n\
    \    return {\n        restrict: 'E',\n        scope: {\n            expression:\
    \ '=val'\n        },\n        template: '<pre>{{debug(expression)}}</pre>',\n\
    \        link: function(scope) {\n            // pretty-prints\n            scope.debug\
    \ = function(exp) {\n                return angular.toJson(exp, true);\n     \
    \       };\n        }\n    };\n});\n```\n\nToss it somewhere in index.html, within\
    \ the `ContentCtrl` <div>:\n\n```html\n<debug val=\"posts\"></debug>\n```\n\n\
    You’ll see you get a nice, preformatted and pretty-printed output of the value\
    \ of `$scope.posts` from our `ContentCtrl` controller (note this won’t work if\
    \ you aren’t using the default route, because only post is defined).\n\nThe scope\
    \ property says, “put a model on the scope called ‘expression’ and make it whatever\
    \ the evaluated value of the ‘val’ attribute was”. I guess that’s a bit of a mouthful,\
    \ but if you try using this directive for yourself, you’ll see it’s quite simple.\n\
    \nThe second parameter to `angular.toJson()` is a flag to pretty-print the output.\
    \ When using `<pre>{{posts}}</pre>` you will get the value of posts alright, but\
    \ it may be difficult to read.\n\nFinally, we declared this `debug()` function\
    \ on the scope. This function does not appear in the current scope or parent scope.\
    \ Thus, if we had defined a function called debug in `ContentCtrl` somewhere,\
    \ they would not conflict.\n\nNote that if posts changes at any time, because\
    \ we have linked it using the = operator in the isolate scope definition, the\
    \ output of this directive is data-bound and will update.\n\nYou can also declare\
    \ an isolate scope with `scope: true` or `scope: {};` either of these will give\
    \ you an empty scope. This is useful if you don’t need to evaluate any expressions\
    \ or attributes between your parent scope and the directive.\n\n## Directive Controllers\n\
    \nDirectives can have controllers. Directives can reuse one controller between\
    \ them. You can do some interesting things with this; two directives of different\
    \ kinds can essentially “talk” to each other in this manner. Check this out:\n\
    \n```javascript\n// controls formattedDebug and looseDebug directives.\nblog.controller('DebugCtrl',\
    \ function ($scope, $element) {\n    var minimized = false;\n\n    // pretty prints\
    \ a debug\n    this.debug = function (exp) {\n        return angular.toJson(exp,\
    \ true);\n    };\n\n    // toggles hidden/show\n    this.toggle = function ()\
    \ {\n      if (minimized) {\n        $element.find('div>div').show({duration:\
    \ 1000});\n      } else {\n        $element.find('div>div').hide({duration: 1000});\n\
    \      }\n      minimized = !minimized;\n    };\n});\n```\n\nWe'll see `formattedDebug`\
    \ and `looseDebug` defined below. You'll notice this is especially strange because\
    \ of the lack of `$scope`. That's intentional. Using this in a controller puts\
    \ a function or variable on all instances of that controller. However, it's not\
    \ available to the scope, and thus not available to any view or template.\n\n\
    You do see an `$element` injected into this controller. This is special and is\
    \ not injectable elsewhere besides in `directive controllers`. Remember how I\
    \ said to never do DOM manipulation in a controller? That does not apply to directive\
    \ controllers. You can go wild with it in these, as you can see. Some just use\
    \ jQuery to show/hide animations. Let's continue with the directives themselves:\n\
    \n```javascript\n// sets an area in which preformattedDebug and looseDebug may\
    \ talk to each other\nblog.directive('DebugZone', function () {\n  return {\n\
    \    restrict: 'E',\n    controller: 'DebugCtrl'\n  };\n});\n```\n\nThis directive\
    \ uses the `DebugCtrl` controller above. Anything directive within this directive\
    \ can **require the `DebugZone` directive** to get access to the `DebugCtrl` controller.\
    \ As with passing `ngModel` into a linking function, you can now pass in `debugZone`.\n\
    \n```javascript\n// displays a debug in a <pre>\nblog.directive('preformattedDebug',\
    \ function () {\n  return {\n    restrict: 'E',\n    scope: {expression: '@val'},\n\
    \    template: '<div class=\"debug-container\"><button ng-click=\"toggle\">toggle</button>\
    \ <div><pre>{{debug.expression}}</pre></div></div>',\n    require: '^debugZone',\n\
    \    link: function (scope, elm, attrs, debug) {\n      scope.debug = debug.debug;\n\
    \      scope.toggle = debug.toggle;\n    }\n  };\n});\n```\n\n```javascript\n\
    // displays a debug in a <div>\nblog.directive('looseDebug', function () {\n \
    \ return {\n    restrict: 'E',\n    scope: {expression: '@val'},\n    template:\
    \ '<div class=\"debug-container\"><button ng-click=\"toggle\">toggle</button>\
    \ <div>{{debug.expression}}</div></div>',\n    require: '^debugZone',\n    link:\
    \ function (scope, elm, attrs, debug) {\n      scope.debug = debug.debug;\n  \
    \    scope.toggle = debug.toggle;\n    }\n  };\n});\n```\n\nAnd before we get\
    \ any further, the markup looks like this:\n\n```html\n<debug-zone>\n  <preformatted-debug\
    \ val=\"posts\"></preformatted-debug>\n  <loose-debug val=\"posts\"></loose-debug>\n\
    </debug-zone>\n```\n\nNote the caret (^) within the require property. This says\
    \ “you can look in the parent scope for the directive you are requiring.” Since\
    \ these dudes have isolate scopes, they need to"
  mdcn: "\n## 更多关于指令的内容\n\n指令要么是某种HTML元素（或注解），要么附加到某个元素上。没有HTML元素，指令就没有意义。如果你想与HTML元素交互，可以尝试使用指令。如果你在做其他事情，则不应该使用。\n\
    \n指令不能直接“包含”来自其他指令的链接或编译函数。它们不可被注入。如果你认为需要注入一个指令，那么你的做法是错误的。相反，你可以使用该指令编写一些HTML，而这些HTML实际上调用了另一个指令。之前提到的手风琴“组件”就是一个例子，我在这里重复一下：\n\
    \n```javascript\nblog.directive('accordion', function() {\n  return {\n    restrict:\
    \ 'E',\n    replace: true,\n    template: '<div class=\"accordion\"><h3>{{title}}</h3>'\
    \ +\n      '<div class=\"accordion-content\" ng-show=\"open\" ng-transclude></div>',\n\
    \    transclude: true,\n    scope: {\n      title: '='\n    },\n    link: function(scope,\
    \ elm) {\n      scope.open = false;\n      // assume we have no jQuery.\n    \
    \  angular.element(elm.children()[0]).bind('click', function() {\n        scope.$apply('open\
    \ = !open');\n      });\n    }\n  };\n});\n```\n\n这个指令的模板中包含了另外两个指令：`ngShow`和`ngTransclude`。这就是你在一个指令中包含另一个指令的方式。如果你需要在指令之间共享功能，可以指定一个多个指令都可以使用的控制器——它们甚至可以使用这个控制器彼此通信。\n\
    \n## 可复用的指令\n\n继续我们之前关于组件的讨论——如果你想编写一个可复用的指令，你应该采取一些步骤。第一步是确保你不会污染任何作用域。这是一个污染作用域的指令示例：\n\
    \n```javascript\nmyApp.directive('badDirectiveIsBad', function() {\n  return function(scope,\
    \ elm, attrs) {\n    scope.foo = scope.$eval(attrs.badDirectiveIsBad);\n  };\n\
    });\n```\n\n这样不好，因为我们使用了`<div bad-directive-is-bad=\"'bar'\"/>`并用`foo`模型污染了当前作用域。如果我们有一个控制器在运行，该控制器的作用域现在会包含`foo`，并且从该作用域派生出的任何作用域也会如此。此外，如果`foo`是作用域中的一个模型，你就刚刚把它破坏了。显然，这可能是bug的来源。我们可以避免这一点。\n\
    \n我们通过让指令创建其*自身*的作用域来避免这个问题。好吧——这解决了污染当前作用域的问题，但没有解决父作用域的问题。为了避免这个问题，我们创建一个*隔离*作用域。隔离作用域与普通作用域的不同之处在于它不原型继承其父作用域。你可以在隔离作用域中放入任何东西，而不用担心它会污染任何其他作用域。\n\
    \n关键选项是你指令返回对象的`scope`属性。设置它，你就有了一个隔离作用域。这是一个略为有用的指令示例，它安全地使用了隔离作用域，我们可以将其添加到我们的博客代码中：\n\
    \n```javascript\n// 调试指令帮助你比正常方式更好地调试一点。\n// 这也可以用过滤器来实现。\n// 用法：\n// <debug val=\"\
    foo\"/>\n// 输出HTML：\n// <debug val=\"foo\"><pre>{{debug(expression)}}</pre></debug>\n\
    // ... 其中debug(expression)返回@val中定义的表达式的漂亮打印的JSON表示\nblog.directive('debug', function()\
    \ {\n    return {\n        restrict: 'E',\n        scope: {\n            expression:\
    \ '=val'\n        },\n        template: '<pre>{{debug(expression)}}</pre>',\n\
    \        link: function(scope) {\n            // 格式化打印\n            scope.debug\
    \ = function(exp) {\n                return angular.toJson(exp, true);\n     \
    \       };\n        }\n    };\n});\n```\n\n将其放入`index.html`中的某个位置，在`ContentCtrl`\
    \ <div>内：\n\n```html\n<debug val=\"posts\"></debug>\n```\n\n你会看到，你得到了来自我们`ContentCtrl`控制器的`$scope.posts`的漂亮、预格式化且格式优美的输出（注意，如果你不使用默认路由，这将不起作用，因为只有post被定义）。\n\
    \n`scope`属性表示，“在作用域上放置一个名为‘expression’的模型，并使其等于‘val’属性的求值结果”。我猜这有点拗口，但如果你亲自尝试使用这个指令，你会看到它非常简单。\n\
    \n`angular.toJson()`的第二个参数是一个用于漂亮打印输出的标志。使用`<pre>{{posts}}</pre>`时，你当然会得到`posts`的值，但可能难以阅读。\n\
    \n最后，我们在作用域上声明了这个`debug()`函数。这个函数不会出现在当前作用域或父作用域中。因此，如果我们曾在`ContentCtrl`中定义过一个名为`debug`的函数，它们不会冲突。\n\
    \n请注意，如果`posts`在任何时候发生变化，由于我们使用隔离作用域定义中的`=`运算符将其链接起来，这个指令的输出是数据绑定的，并会更新。\n\n你也可以使用`scope:\
    \ true`或`scope: {};`来声明一个隔离作用域，这两者都会给你一个空的作用域。如果你不需要在父作用域和指令之间求值任何表达式或属性，这很有用。\n\
    \n## 指令控制器\n\n指令可以有控制器。指令可以在它们之间复用同一个控制器。你可以用这个做一些有趣的事情；两种不同类型的指令本质上可以以这种方式“对话”。看看这个：\n\
    \n```javascript\n// 控制 formattedDebug 和 looseDebug 指令。\nblog.controller('DebugCtrl',\
