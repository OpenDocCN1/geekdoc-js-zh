    \ update the model in the `MyCtrl` controller. Thus, use `$parent`. If you already\
    \ have declared selectedValues in your parent scope, then nevermind.\n\nIf you\
    \ want to execute a function (read: not necessarily update a model) when, say,\
    \ clicking a checkbox, this can be achieved one of two ways. The first way is\
    \ using the `ngChange` directive:\n\n```\n<input type=\"checkbox\" ng-model=\"\
    skub\" ng-change=\"congratulateProSkub()\">I am pro-skub</input>\n```\n\nAnd in\
    \ your controller you would have:\n\n```\n$scope.congratulateProSkub = function()\
    \ {\n  if ($scope.skub) {\n    $window.alert('thanks for being pro-skub');\n \
    \ }\n};\n```\n\nThat’s all well and good, but note that two things actually happen\
    \ when you check (or uncheck) that box. Your function will get executed, of course,\
    \ but also a boolean `model` (skub) will be updated. The value of `$scope.skub`\
    \ in the controller is now true if this checkbox is checked. If we wished to keep\
    \ this bit of logic out of the view, we could do something like this:\n\n```\n\
    <input type=\"checkbox\" ng-model=\"skub\">I am pro-skub</input>\n```\n\nAnd:\n\
    \n```\n$scope.$watch('skub', function(new_val, old_val) {\n  if (new_val !== old_val)\
    \ {\n    $scope.congratulateProSkub();\n  }\n});\n```\n\nThis accomplishes the\
    \ same thing. Heck, you could even combine the two and *three* things would happen\
    \ when you clicked the checkbox. It’s probably personal preference as to which\
    \ one you *should* be using; I see pros and cons for either, and none of those\
    \ pros or cons are especially compelling.\n\n# ## Radios\n\nRadios can be slightly\
    \ different than the way you’d normally use a radio:\n\n```\n<input type=\"radio\"\
    \ name=\"foo\" value=\"bar\"/> Bar<br/>\n<input type=\"radio\" name=\"foo\" value=\"\
    baz\"/> Baz\n```\n\nIn AngularJS, you don’t *necessarily* need the name attribute\
    \ unless you want to do form validation (more on this later). Instead, you may\
    \ do this:\n\n```\n<input type=\"radio\" ng-model=\"foo\" value=\"bar\"/> Bar<br/>\n\
    <input type=\"radio\" ng-model=\"foo\" value=\"baz\"/> Baz\n```\n\nAnd it will\
    \ work exactly like in the first example, with the added bonus of assigning the"
  merge: -1
  pgno: 49
- img_proc: true
  md: "value to foo in the scope.\n\n# Selects\n\nSelects may also be a little different.\
    \ Maybe you have an array of strings (and it’s OK if you do):\n\n```\n<select\
    \ ng-model=\"foo\">\n    <option ng-repeat=\"thing in ['bar', 'baz']\">{{thing}}</option>\n\
    </select>\n```\n\nThe value of foo will the “bar” or “baz”, probably just like\
    \ you wanted. But what if we were iterating over an array of objects?\n\n```\n\
    <select ng-model=\"foo\">\n    <option ng-repeat=\"thing in [{name: 'bar'}, {name:\
    \ 'baz'}]\">{{thing.name}}</option>\n</select>\n```\n\nWhat ends up in `$scope.foo`?\
    \ Well, the strings “bar” or “baz” again. This may not be what you wanted however,\
    \ as there’s nothing that tells you precisely which object was selected! If you\
    \ wanted to find that out, you’d have to create another lookup object, or iterate\
    \ over the whole array looking for the object with the same name as `$scope.foo`.\
    \ No. There is a better way:\n\n```\n<select ng-model=\"foo\" ng-options=\"thing.name\
    \ for thing in [{name: 'bar'}, {name: 'baz'}]\"></select>\n```\n\nNow the value\
    \ of `$scope.foo` is actually the object in the array itself. This is incredibly\
    \ useful. It’s like you made an entire object, not just a string, be the value\
    \ attribute of your option tag. Very cool indeed.\nBasically you will be iterating\
    \ over one of two kinds of data structures: an array or an object. If you have\
    \ an array, the value of `ngOptions` will be “*label for value in array*”; where\
    \ “label” is what is displayed to the user, “value” is what is stored in the `ngModel`,\
    \ and of course the array itself.\nIf you have an object, you don’t care about\
    \ order. Your markup may look like the following:\n\n```\n<select ng-model=\"\
    foo\" ng-options=\"key + ': ' + value.name for (key, value) in {bar: {name: 'barth'},\
    \ baz: {name: 'bazalthar'}}\"></select>\n```\n\nThis displays “bar: barth” and\
    \ “baz: bazalthar” in the select dropdown; when you choose something the value\
    \ of `$scope.foo` becomes the object referred to by the key (“bar” and “baz”).\
    \ In general terms, that’s “*label for (key, value) in object*“.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_50_0.png)\n\
    \nEverybody loves lists and tables and that’s what we’re going to talk about next."
  merge: -1
