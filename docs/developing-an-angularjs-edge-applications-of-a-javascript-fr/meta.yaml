  md: "# Unit Tests\n\nHere's an example of unit testing a filter, using our blog\
    \ application's filter as an example:\n\n```\ndescribe('Blog Filters', function\
    \ () {\n    var $filter;\n\n    beforeEach(inject(function ($$filter) {\n    \
    \    $filter = $$filter;\n    }));\n\n    describe('the capitalize filter', function\
    \ () {\n        it('should capitalize a string, naturally', function () {\n  \
    \          var capitalize = $filter('capitalize');\n            expect(capitalize('foo')).toBe('Foo');\n\
    \        });\n    });\n});\n```\n\n# Conclusion\n\nA filter is a (hopefully) simple\
    \ function that takes a model a view has, and makes it a little easier for the\
    \ view to digest the model, or otherwise alters the appearance of the model. Filters\
    \ are meant to be superficial and should probably not have side effects. They\
    \ can be used outside of the context of a view, though this is less typical. You\
    \ want to write a filter when you find you're massaging data in a controller,\
    \ just for the sake of a view. Keep in mind though that filters get executed often,\
    \ and for performance reasons it's best to keep them simple. Also, your filters\
    \ are meant to simply munge data in the view—don't write filters that have side-effects!\n\
    \nSo far during the course of this book we've talked AngularJS theory—now let's\
    \ get on to applied science in the next chapter."
