    are trying to `console.log($posts[0].title)` and you get a `TypeError`.

    You may have put together the connection that anything in your controller assigned
    to `$scope.foo` is available in the view as simply `foo`. This holds true for
    *any* member of the `$scope`, including objects, arrays, primitives and functions.
    You will never have to refer to `$scope` in the view, because it is implied, and
    will correspond to the scope of the nearest controller (as defined by the ng-controller
    directive) or directive if that directive affects the scope.'
  - '[PAGE 20]


    # # The Service


    Posts is a service. It’s a simple service and provides one function, `getPosts()`.
    You see that the built-in `$http` service is available here, and we use it to
    request data from our fake server, data.json. The `$http` service is a wrapper
    around basic Ajax functionality, and can be used to make any type of HTTP request.
    Consider it analogous to `jQuery.ajax()`. We’re firing off a GET request and returning
    from `getPosts()` the object generated by this request. As discussed above, this
    object is a promise. The promise returned by requests made by `$http` are unique
    in that you may use `success()` and/or `error()` when resolving them, as we do
    in the controller.


    It’s important to note that a service is a singleton. That means only one instance
    of the service will be available across your entire application. And I do mean
    instance; AngularJS instantiates the service when it is first requested, and we
    use `this` to put members into it. A factory is also a singleton, but it is not
    instantiated (no new keyword involved). More about the difference between factories
    and services later.'
- md: "## The Directive\n\nWhat is a directive? It’s an HTML attribute, tag, or comment\
    \ that can execute any behavior (including modifying the DOM) based on its attributes\
    \ and often times, scope. There are lots of directives included within AngularJS\
    \ to do many common tasks, and they all begin with `ng` (“ng” sounds kind of like\
    \ “Ang” in “AngularJS” so that’s why they chose the prefix). For example, the\
    \ `ngShow` directive will allow you to show or hide (using the CSS `display` property)\
    \ a block of HTML, based on the truthiness of a model or executed function.\n\n\
    The scope, markup, and services all go into a directive, and out comes markup\
    \ with JS functionality (events).\n\n> **TIP ng-show vs. ngShow**\n>\n> `ngShow`\
    \ is the proper name for the directive; these should always be camelCased, and\
    \ you are encouraged to name your own directives this way. `ng-show` is one possibility\
    \ of how you would reference it in a view. Also supported are `ng:show`, `ng_show`,\
    \ `x-ng-show` and `data-ng-show`. Whew!\n\nWhy create a custom directive? There\
    \ are many reasons. Say you had a custom widget—some HTML fragment—that should\
    \ accept some parameters and render itself based upon those parameters. For example,\
    \ a directive that renders a `<ul>` based on a comma-separated list of values.\
    \ Or you could apply some sort of fancy animation effect to an HTML node. Or you\
    \ could take a jQuery plugin (like Twitter Bootstrap's `tooltip()`) and put your\
    \ tooltip contents directly into the HTML instead of having to write another line\
    \ of JavaScript. The possibilities, while perhaps not endless, are many.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_21_0.png)\n\
    \n### Logic? In _my_ markup? It's more common than you think.\n\nThe separation\
    \ of logic from the view is a common, and valid, concern. With AngularJS, you\
    \ are going to be putting logic into your markup, perhaps much more than you would\
    \ with any other JavaScript framework. Some people (maybe you!) find this incredibly\
    \ icky. And that's OK. However, AngularJS is designed with this paradigm in mind.\
    \ The rationale is fairly simple though: if you use a templating language (server-side,\
    \ client-side, it doesn't matter), you are going to have logic in your view. Designers\
    \ are going to see it if they are working with your markup. AngularJS does not\
    \ pretend that this isn't happening—instead, it embraces logic in the view. It's\
    \ just that the logic takes place in a directive, which is written as part of\
    \ the markup itself. It is truly a powerful way of developing for the web, and\
    \ in the end will save you many lines of code. So if you are unsure, take the\
    \ plunge and decide for yourself:\n\n```html\n<html >\n  <!-- Logic expression\
    \ here -->\n</html>\n```\n\nDirectives are what truly sets AngularJS apart from\
    \ other frameworks. It allows you an unparalleled degree of flexibility and power\
    \ when writing your markup. But to be the boss, there is a cost. And that cost\
    \ is a steep learning curve.\n\nI'm not going to pretend it is straightforward\
    \ to write a directive. Even the simplest directives may seem strange or need\
    \ many configuration options. We'll get our hands downright filthy with directives\
    \ later, but for now, let's look at this relatively simple one.\n\nWhen you have\
    \ a HTML fragment like `<span bold-click>bar</span>`, this directive will be processed.\
    \ When someone clicks on \"bar\", it will become boldface; when they click again\
    \ it will become normal weight.\n\nAgain, we'll go into specifics later about\
    \ the syntax and certain techniques that we can use when writing directives. For\
    \ now, just know that it all starts with markup, and that you can make that markup\
    \ do just about anything.\n\n## Conclusion\n\nFrom here we'll discover the components\
    \ and concepts that make up an entire AngularJS application, in more detail. AngularJS\
    \ has a learning curve, as it's a new way of thinking about building web applications,\
    \ and it is important to understand the core tools it provides and how to use\
    \ them.\n\nIn the next chapter we'll be introduced to the six core components,\
    \ or building blocks, that make up AngularJS applications.\n\n## Chapter 2. AngularJS\
    \ Core Concepts\n\nAngularJS is a framework made of components. Different components\
    \ are different tools for different problems. If you are familiar with MVC (model-view-controller)\
    \ frameworks of any type, the distinction between these components will likely\
    \ make a lot of sense to you. If you are new to MVC, consider it a way to separate\
    \ an application into presentation, logic and data layers. In addition, MVC provides\
    \ loose coupling between these layers that allow layers to be swappable. For example,\
    \ you may have written an entire app in AngularJS, but you want it displayed differently\
    \ for mobile—just provide a new view; there is no need to write an entirely new\
    \ application.\n\nThe core components are as follows:\n\n- Models (this is your\
    \ data)\n- Controllers (business and some presentation logic)\n- Views (presentation)\n\
    - Services/factories/providers (kind of like libraries)\n- Filters (easy data\
    \ structure processing in the view)\n- Directives (markup which runs code that\
    \ modifies the DOM)\n\n## What is a Scope?\n\nA fundamental concept to understand\
    \ in AngularJS is the *scope*. A scope houses the application model. Not only\
    \ individual models, but functions as well. Every controller has its own scope.\
    \ Some directives have their own scope. It's important to know that you can take\
    \ a scope and visually map it onto a chunk of markup (if you use the AngularJS\
    \ Batarang, a debugging tool, you can inspect individual HTML nodes and see what\
    \ is contained within their scope). That's right; it mimics the DOM hierarchy\
    \ of your view. Have a `<p>` somewhere with an ngController on it? That `<p>`\
    \ now has a scope, and whatever you put in the scope, the `<p>` can touch. Remove\
    \ `<p>` and the scope no longer exists. Some directives create their own scopes,\
    \ like ngRepeat, and you can look at your markup and know where that new scope\
    \ lives.\n\nAngularJS is actually closer to an MVVM (Model-View-ViewModel) framework,\
    \ if you are familiar with that term. Think of the scope object as the ViewModel.\
    \ But Igor Minar, one of the AngularJS authors, has declared AngularJS to be a\
    \ MVW (Model-View-Whatever) framework; it's a just a framework that separates\
    \ logic from the presentation. His reasoning is that the lines between these framework\
    \ types are often blurred by frameworks, and it's not really worth arguing about\
    \ as long as you're productive in your framework of choice:\n\n![](img/f95c537c2fc9346a21a144b89cfac580_24_0.png)\n\
    \n## What is an AngularJS expression?\n\nIt's a JavaScript-ish bit of code that\
    \ AngularJS understands and processes. Anything that looks like JavaScript within\
    \ your view is not JavaScript; it's an Angular expression. As such, not all JavaScript\
    \ is a valid expression! Expressions are evaluated against scopes; if you have\
    \ an expression `foo = 'bar'`; the string `foo` in the current scope will be assigned\
    \ the value of \"bar\". Expressions do not deal with `undefined` and `null` values\
    \ as JavaScript does; given something like `ng-show=\"foo.bar\"`; if foo is undefined,\
    \ you will not receive an error. The operators `===` and `!==` are not necessary;\
    \ stop worrying about it. You can *not* use any conditionals, loops, or exceptions\
    \ within AngularJS expressions. Finally, you can use filters with the `|` (pipe)\
    \ operator. AngularJS expression language is in development; look for more features\
    \ in the future.\n\nOf utmost importance to understand is that there is a root\
    \ scope from which all scopes inherit, and all scopes inherit prototypically from\
    \ their parent scope by default. If you set something on the root scope of the\
    \ application (you can get at this via the `$rootScope` service), it will be available\
    \ to all non-isolate scopes (an *isolate scope* is used in certain directives\
    \ and does *not* inherit from its parent, on purpose, in order to not pollute\
    \ or otherwise overstep its bounds) within the application, no matter where they\
    \ are. If you need a `debug()` function (or something; consider the `$log` service\
    \ for debugging) available *everywhere* in the view, put it on the root scope.\
    \ If you don't need it everywhere, please do not abuse the root scope.\n\nScopes\
    \ are simply JavaScript objects, but they have special functions. Here are overviews\
    \ of some of the more useful ones:\n\n- `$apply`: Executes an AngularJS expression\
    \ from outside of the framework, and typically used in directives. If you have\
    \ a 3rd library that needs to set a model, you *must* wrap that assignment in\
    \ a call to `$apply` or AngularJS will fail to recognize the change happened,\
    \ and all sorts of nothing will occur. Watches will not fire, promises will not\
    \ get resolved, etc., etc.\n- `$watch`: Watches/observes an AngularJS expression;\
    \ if that expression changes, the function you pass to `$watch` will fire. The\
    \ function will receive \"new\" and \"old\" parameters. There is an optional 3rd\
    \ argument to a `$watch`; since, by default, `$watch` evaluates by reference,\
    \ certain expressions may not trigger a watch function like you think they would.\
    \ For example, say you had a watch on the expression `foo`. If `foo` is reassigned\
    \ to a new object, the watch will fire. However, if there is an object member\
    \ `bar` and it changes, the watch will not fire. The inner object changed, yes,\
    \ but there was no change in reference. If you want to evaluate *by value* (a\
    \ much more expensive operation; use wisely!), supply `true` as the third parameter\
    \ to the `$watch` call. Note that when you define a `$watch` for the first time,\
    \ its listener function will be called asynchronously, so it's often necessary\
    \ to do a comparison between the two parameters as the first line of your listener\
    \ function if that value is set asynchronously.\n- `$eval`: Evaluates an expression\
    \ against the scope and returns its value. Useful in"
  mdcn: "\n## 指令 (The Directive)\n\n什么是指令是什么？它是一个 HTML 属性、标签或注释，可以根据其属性以及（通常包括）作用域来执行任何行为（包括修改\
    \ DOM）。AngularJS 内置了许多指令来完成常见的任务，它们都以 `ng` 开头（“ng”的发音类似于“AngularJS”中的“Ang”，这就是为什么选择这个前缀的原因）。例如，`ngShow`\
    \ 指令允许你根据模型或执行函数的真值（truthiness），来显示或隐藏（使用 CSS 的 `display` 属性）一段 HTML 代码块。\n\n\
    作用域 (scope)、标记 (markup) 和服务 (services) 全部进入指令，输出则是输出带有 JS 功能（事件）的标记。\n\n> **提示：ng-show\
    \ 与 ngShow**\n>\n> `ngShow` 是该指令的正规名称；这些名称应始终使用小驼峰命名法 (camelCased)，并鼓励你用这种方式命名自己的指令。`ng-show`\
    \ 是你在视图中引用它的其中一种可能方式。此外，还支持 `ng:show`、`ng_show`、`x-ng-show` 和 `data-ng-show`。呼！\n\
    \n为什么要创建自定义指令？原因有很多。假设你有一个自定义组件——一段 HTML 片段——它应该接收某些参数并根据这些参数进行渲染。例如，一个根据逗号分隔的值列表来渲染\
    \ `<ul>` 的指令。或者你可以给 HTML 节点添加某种花哨的动画效果。又或者你可以使用一个 jQuery 插件（如 Twitter Bootstrap\
    \ 的 `tooltip()`），将提示内容直接放入 HTML 中，而无需编写另一行 JavaScript。可能性虽然并非无穷无尽，但非常之多。\n\n![](img/f95c537c2fc9346a21a144b89cfac580_21_0.png)\n\
    \n### 逻辑？在 *我的* 标记里？这比你想象的更常见。\n\n将逻辑与视图分离是一个常见且合理的担忧。在 AngularJS 中，你会将逻辑放入标记中，可能比在任何其他\
    \ JavaScript 框架中放入的都要多。有些人（也许包括你！）觉得这非常令人反感。这没关系。然而，AngularJS 在设计时就考虑到了这种范式。其原理相当简单：如果你使用模板语言（无论是服务端还是客户端），你的视图中必然会存在逻辑。如果设计师在处理你的标记，他们也会看到它。AngularJS\
    \ 并不否认这种情况的发生，相反，它拥抱视图中的逻辑。只不过这些逻辑发生在指令中，而指令本身就是作为标记的一部分编写的。这确实是一种强大的 Web 开发方式，最终将为你节省许多行代码。所以，如果你不确定，请大胆尝试并自行判断：\n\
    \n```html\n<html >\n  <!-- 这里是逻辑表达式 -->\n</html>\n```\n\n指令是让 AngularJS 真正区别于其他框架的地方。它在编写标记时为你提供了无与伦比的灵活性和能力。但要成为掌控者，是有代价的。这个代价就是陡峭的学习曲线。\n\
    \n我不会假装编写指令很简单。即使是最简单的指令看起来可能也很奇怪，或者需要许多配置选项。稍后我们将深入研究指令的细节，但现在，让我们先看看这个相对简单的例子。\n\
    \n当你有一个像 `<span bold-click>bar</span>` 这样的 HTML 片段时，该指令将被处理。当有人点击 “bar” 时，它将变为粗体；再次点击时，它将恢复正常字重。\n\
    \n同样，稍后我们将详细讨论在编写指令时可以使用到的语法和特定技术。现在，你只需要知道这一切都始于标记，并且你可以让这些标记完成几乎任何事情。\n\n##\
    \ 结论\n\n从这里开始，我们将更详细地探索构成整个 AngularJS 应用程序的组件和概念。AngularJS 有一定的学习曲线，因为它是一种构建 Web\
    \ 应用程序的新思考方式，因此理解它提供的核心工具以及如何使用它们至关重要。\n\n在下一章中，我们将介绍构成 AngularJS 应用程序的六个核心组件或构建块。\n\
    \n## 第 2 章. AngularJS 核心概念\n\nAngularJS 是一个由组件构成的框架。不同的组件是解决不同问题的不同工具。如果你熟悉任何类型的\
    \ MVC（模型-视图-控制器）框架，这些组件之间的区别对你来说可能会很容易理解。如果你是 MVC 的新手，可以将其视为一种将应用程序分为表示层、逻辑层和数据层的方法。此外，MVC\
    \ 在这些层之间提供了松耦合，允许层之间可互换。例如，你可能用 AngularJS 编写了整个应用，但你希望它在移动端有不同的显示方式——只需提供一个新的视图即可，无需编写一个全新的应用程序。\n\
    \n核心组件如下：\n\n- 模型 Models（这是你的数据）\n- 控制器 Controllers（业务逻辑和部分表示逻辑）\n- 视图 Views（表示层）\n\
    - 服务/工厂/提供者 Services/factories/providers（类似于库）\n- 过滤器 Filters（在视图中轻松处理数据结构）\n\
    - 指令 Directives（运行修改 DOM 代码的标记）\n\n## 什么是作用域 (Scope)？\n\n在 AngularJS 中需要理解的一个基本概念是\
    \ *作用域 (scope)*。作用域承载着应用程序模型。不仅是个体模型，还包括函数。每个控制器都有自己的作用域。某些指令也有自己的作用域。重要的是要意识到，你可以将一个作用域在视觉上映射到一段标记上（如果你使用\
    \ AngularJS Batarang 调试工具，可以检查单个 HTML 节点并查看其作用域中包含的内容）。没错；它模仿了视图的 DOM 层级结构。某个地方有一个带有\
    \ ngController 的 `<p>` 标签？那么这个 `<p>` 现在就有了一个作用域，无论你在这个作用域中放入什么，`<p>` 都可以触达。移除\
