  md: '# NP DOM Manipulation outside of a directive


    A service, factory, or provider can be used for DOM manipulation, but if it is,
    it should solely serve that function as to make unit testing straightforward and
    avoid spaghetti. A great place to put functionality that creates a modal pop-up
    is in a service. Creating a new “view” could even be construed as business logic.
    It turns out that using a service in this manner may feel more natural than trying
    to shoehorn the same functionality into a directive. For example, I have a case
    in which I provide a `showwarning()` function (via a factory) to display a warning,
    the contents of which sometimes fetched over HTTP, to the user, within a modal
    (note that if we didn’t need to show this in a modal, it would be better to simply
    set the warning text in a model and use `$show` to display it).


    +   - **Filters**: The filter is great for string or array manipulation to be
    done in a view. Outside of a view, you can still use a filter, but you’re probably
    better off providing a factory function instead of a filter if you will use it
    exclusively outside of views.

    - **Directives**: Finally, the directive is for DOM manipulation or otherwise
    controlling the scope or a model from the view. It is never used outside the context
    of a view. You’ll know you need a directive when you find yourself trying to use
    3rd-party DOM manipulation libraries. Don’t be tempted to use that complicated
    library in your controller! It will pay off to write a directive to bridge the
    gap between AngularJS and Library X. Custom validation is best handled in a directive.
    You can overwrite AngularJS’ default directives to change their behavior as well.
    Don’t want the model to update on every `keyDown` event? Overwrite that input
    directive! We’ll have an example of this later. Directives essentially extend
    HTML and can be used to create a domain-specific language for your application
    or applications.


    # Conclusion


    Those are the core components that make up an AngularJS application. Think of
    them as building blocks. You may need many or few components, depending upon your
    requirements.


    In the next chapter we’ll explore the model in detail. It’s just data—and you
    probably have some laying around somewhere.'
