  md: "Condition. When we attached foo to the `$scope`, we created the opportunity\
    \ to use the foo expression to be evaluated against that Scope. Since this can\
    \ be any expression, we can even `$watch` some arbitrary boolean; `foo == 'baz'`;\
    \ when that conditional is evaluated and the evaluated value changes, we will\
    \ execute our callback function. This is useful if you want some code to fire\
    \ only when a model reaches a certain numeric value, for example.\n\nNow, you\
    \ can `$watch` entire objects or arrays if you like. Take a look at the following\
    \ nice model:\n\n```\n`$scope.foo = {\n  bar: 'baz'\n};`\n```\n\n`$watch`-ing\
    \ `foo` itself will **not trigger** our callback function if the value of `foo.bar`\
    \ changes. Why? Because, by default, `$watch` works by *reference*, not by value.\
    \ If you are watching `foo` and the reference to foo doesn't change—and if we\
    \ update `foo.bar`, it doesn't—the `$watch` will not fire.\n\nLuckily AngularJS\
    \ provides functionality to accomplish this sort of task. It is expensive, but\
    \ you can `$watch` by value. Simply pass the third parameter to a `$watch` call:\n\
    \n```\ndescribe('watches', function() {\n  var scope;\n  beforeEach(inject(function($BrootScope)\
    \ {\n    $BrootScope = $BrootScope.$new();\n    scope = $BrootScope.$new();\n\
    \    scope.$apply(foo = {bar: \"baz\"});\n  }));\n\n  it('when watching by reference,\
    \ should not fire when object member updated',\n    inject(function($log) {\n\
    \      spyOn($log, 'log');\n      scope.$apply(function() {\n        scope.$watch('foo',\
    \ function(new_val, old_val) {\n          $log.log('foo' was used to be ' + angular.toJson(old_val)\
    \ + ' now it is ' + angular.toJson(new_val));\n        });\n      });\n\n    \
    \  scope.$apply(function() {\n        scope['foo'].bar = 'spam';\n      });\n\
    \      expect($log.log).not.toHaveBeenCalled();\n    }));\n\n  it('when watching\
    \ by value, should fire when object member updated', inject(function($log) {\n\
    \    spyOn($log, 'log');\n    scope.$apply(function() {\n      scope.$watch('foo',\
    \ function(new_val, old_val) {\n        if (new_val !== old_val) {\n         \
    \ $log.log('foo' was used to be ' + angular.toJson(old_val) + ' but is now ' +\
    \ angular.toJson(new_val));\n        }\n      }, true);\n    });\n\n    scope.$apply(function()\
    \ {\n      scope['foo'].bar = 'spam';\n    });\n    expect($log.log).toHaveBeenCalled();\n\
    \  }));\n});\n```\n\nNote, the calls to `angular.toJson()` here; to output the\
    \ contents of `foo` properly we must convert it to a string, or we will get the\
    \ old good `[Object object]`.\n\nAs this is an expensive operation (determining\
    \ how exactly expensive is up to you and http://jsperf.com), it may be a good\
    \ idea not to `$watch` huge objects or arrays. AngularJS was not designed to handle\
    \ this gracefully. This kind of thing is generally best left up to MS Excel. Find\
    \ out what you really need to be displaying and what you really need to edit in-line,\
    \ and you will see increased performance."
