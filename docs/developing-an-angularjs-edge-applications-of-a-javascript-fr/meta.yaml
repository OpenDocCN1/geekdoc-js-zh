    \n当 AngularJS 第一次遇到你的标记时，也会发生同样的事情。它扫描所有标记以查找指令，创建由所有指令的 link 函数组成的链接函数，然后使用相应的\
    \ scope 执行该函数。\n\n这两个阶段的原因纯粹是为了性能。通过编译一次并在数据绑定机制执行时进行链接，我们节省了重新渲染一个不会改变的巨大标记块（你的原始、未处理模板）的开销。\n\
    \n![](img/f95c537c2fc9346a21a144b89cfac580_58_0.png)\n\n## 视图的单元测试\n\n> 你可能更想为你的视图编写功能测试，而不是单元测试。像\
