  mdcn: "\n## 不希望模型在更改后立即更新？\n\n这种情况的一个例子是模态对话框，其中显示了某个模型，且你希望用户对该模型进行修改。然而，你只希望在用户点击“保存”时才应用这些更改，如果用户点击“取消”，则希望丢弃这些更改。解决这个问题有几种方案，其中一种是简单地使用\
    \ `angular.copy()` 复制你的模型，并使用一个临时模型进行操作，然后在保存时将其复制回去。你可以编写一个服务（service）或工厂（factory）来处理这种通用情况。或者，你甚至可以编写一个通用指令，将\
    \ UI 的特定部分标记为“事务性的（transactional）”，直到点击“保存”才执行“提交”。\n\n来看看这个带有测试的“transactional”指令：\n\
    \n```\nangular.module('app', []).directive('transactional', function($parse) {\n\
    \  return {\n    restrict: 'E',\n    scope: true,\n    link: function(scope, elm,\
    \ attrs) {\n      // 从 $parse 服务获取一个 \"getter\" 函数\n      var model = $parse(attrs.model);\n\
    \      // 使用 \"setter\" 函数将 \"model\" 属性中指定内容的副本\n      // 放入此指令的作用域中，该作用域不继承自父级。\n\
    \      model.assign(scope, angular.copy(model(scope)));\n      // 保存时，将父级模型重新赋值为该指令模型的当前值。\n\
    \      scope.$save = function() {\n        model.assign(scope.$parent, model(scope));\n\
    \      };\n    }\n  };\n});\n\n// ...以及一些单元测试\nbeforeEach(module('app'));\ndescribe('transactional\
    \ directive', function () {\n  var scope;\n  beforeEach(inject(function ($rootScope)\
    \ {\n    scope = $rootScope.$new(); // 基于 root 创建一个全新的子作用域\n  }));\n  describe('the\
    \ model', function () {\n    it('should propagate to the parent only when $saved',\
    \ inject(function ($compile) {\n      var template, compiled, isolateScope;\n\
    \      scope.foo = 'bar';\n      template = '<transactional model=\"foo\"></transactional>';\n\
    \      compiled = $compile(template)(scope);\n      isolateScope = compiled.scope();\n\
    \      isolateScope.$apply('foo = \"baz\"');\n      expect(scope.foo).toBe('bar');\n\
    \      isolateScope.$apply('$save()');\n      expect(scope.foo).toBe('baz');\n\
    \    }));\n  });\n});\n```\n\n要使用此指令，可以参考以下用法：\n\n```\n<div ng-controller=\"MyCtrl\"\
    >\n  <p>Value of foo: {{protected.foo}}</p>\n  <transactional model=\"protected\"\
    >\n    <p>Temp value of foo: <input type=\"text\" ng-model=\"protected.foo\"/></p>\n\
    \    <button ng-click=\"protected.increment()\">increment</button>\n    <button\
    \ ng-click=\"$save()\">save</button>\n  </transactional>\n</div>\n```\n\n对应的控制器如下：\n\
    \n```\nmyApp.controller('MyCtrl', function($scope) {\n  $scope.protected = {\n\
    \    foo: 1,\n    increment: function() {\n      this.foo++;\n    }\n  };\n});\n\
    ```\n\n这个指令做了一件我不太热衷的事情——它在作用域中塞入了一个新东西。然而，鉴于这是一个*隔离（isolate）*作用域，所以没问题，因为它不会用\
    \ `$save` 函数污染任何父级作用域。如果你对此非常在意，可以通过另一个属性来修改此指令以提供 `save` 函数。此外，这种策略还有几个限制。你需要一个“顶层”模型才能使其工作；你不能使用\
    \ `foo.bar` 这样的模型。此外，你在对象中使用的任何伪类（pseudoclass）都*不会*被持久化，因为 `angular.copy()` 不支持这样做。\n\
    \n## 结论\n\n虽然模型本身看起来没什么特别有趣的，但它仍然是 AngularJS 的核心组件。与其他框架不同，你不需要继承任何特殊的类来创建模型。在\
    \ AngularJS 中，你会将数据放入一个特殊的 Scope 对象中。\n\n模型和视图都是设计 Web 应用程序的良好起点。然而，如果你的应用程序具有复杂的\
    \ UI，你可能希望从视图开始，我们将在下一章中讨论视图。\n\n## 第 4 章：视图详解\n\n什么是视图？就是用户看到的东西。它是呈现层。它是你的模板。它是你的标记；你的\
    \ HTML。视图与控制器紧密协作，但它是解耦的，也就是说控制器对视图一无所知。同样，视图也并不真正了解控制器。你可能会认为它了解，因为它能执行控制器中的函数并触碰其中的数据；但实际上视图拥有的是一个\
    \ Scope 对象。视图和控制器都与 Scope 对象对话，而不是彼此对话。在这里，MVC 模式的核心范式变得清晰：视图与业务逻辑的分离。如果你熟悉 MVVM（Model-View-ViewModel）范式，可以将\
    \ scope 视为 ViewModel。AngularJS 的创建者表示 AngularJS 是一个 MVW（Model-View-Whatever，模型-视图-随便什么）框架，这意味着*本文*作者将不再深入探讨那个讨论。\n\
    \n我们将讨论 AngularJS 视图通常是什么样子，包括一些典型的属性和一些坑。这也将作为对*指令（directives）*更好的介绍，指令是由 AngularJS\
    \ 执行的特殊命令。我们还将看一个过滤器（filter），这可能是你第一次见到。\n\n### 我们的视图\n\n让我们通过改进 `index.html`\
    \ 来更详细地查看视图。目前它几乎没起作用。将其改为：\n\n```\n<!DOCTYPE html>\n<html ng-app=\"blog\">\n\
    <head>\n    <meta http-equiv=\"Content-type\" content=\"text/html; charset=utf-8\"\
    >\n    <title ng-bind-template=\"{{title}}\"></title>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.5/angular.min.js\"\
    \ type=\"text/javascript\"\n        charset=\"utf-8\"></script>\n    <script src=\"\
    https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\" type=\"text/javascript\"\
    \n       charset=\"utf-8\"></script>\n    <script src=\"blog.js\" type=\"text/javascript\"\
    \ charset=\"utf-8\"></script>\n</head>\n<body>\n<div ng-controller=\"HeadCtrl\"\
    >\n    <h1>{{title}}</h1>\n    <h3>{{description}}</h3>\n</div>\n<div ng-controller=\"\
    ContentCtrl\">\n      <new-post-area post=\"new_post\" cancel-text=\"Cancel\"\
    \ save-text=\"Save\" cancel=\"cancel\" save=\"save\">\n      </new-post-area>\n\
    \      <div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:'-date'\">\n\
    \          <ng-switch on=\"post.editing\">\n              <div ng-switch-when=\"\
    true\">\n                  <div class=\"important-background-color\" color=\"\
    #EEE\">\n                      <input type=\"text\" ng-model=\"post.temp.title\"\
    /><br/>\n                      <textarea ng-model=\"post.temp.body\"></textarea><br/>\n\
    \                      <button ng-click=\"cancel(post)\">Cancel</button>\n   \
    \                   <button ng-click=\"save(post)\">Save Changes</button>\n  \
    \                </div>\n              </div>\n              <div ng-switch-default>\n\
    \                  <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n         \
    \         <p ng-click=\"edit(post)\" bold-click ng-bind-html-unsafe=\"post.body\"\
    ></p>\n                  <p><em>posted on {{post.date|date:'short'}} by {{post.author}}</em></p>\n\
    \              </div>\n          <hr/>\n              <button ng-click=\"newPost()\"\
    >New Post</button>\n          </ng-switch>\n      </div>\n</div>\n<!-- directive:\
    \ copyright -->\n</body>\n</html>\n```\n\n渲染结果如下：\n\n## My Important Blog\n\n\
    ### Scary Post\n\nAenean nec aliquam libero. Suspendisse lorem magna, lobortis\
    \ eu tincidunt vel, faucibus quis erat\n\nposted on 11/11/12 8:50 PM by Michael\
    \ Myers\n\n### First Post!!!!~11\n\nLorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit. Duis lacinia cursus arcu a pellentesque. Curabitur convallis massa faucibus\
    \ tellus tincidunt et tincidunt augue elementum. Curabitur pretium metus gravida\
    \ augue elementum mollis.\n\nposted on 11/11/12 8:50 PM by Chris Hiller\n\n这仍然不多，但这是一个正确的方向。我们添加了标题、描述、更多内置指令、自定义指令和过滤器。稍后我们将检查处理这个大家伙的控制器。\n\
    \n我们做的一些事情包括：\n\n- 动态生成 `<title>` 标签中的文本\n- 引用另一个名为 \"HeadCtrl\" 的控制器\n- 使用自定义指令\
