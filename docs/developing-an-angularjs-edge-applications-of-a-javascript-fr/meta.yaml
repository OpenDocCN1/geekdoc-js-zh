  - "[PAGE 94]\n\n```\n// run() just runs arbitrary code immediately after bootstrapping\n\
    some_module.run(function(SomeProvider) {\n    SomeProvider.someMethod(); // returns\
    \ 'Chris'\n});\n```\n\nAnd some unit tests showing this works:\n\n```\ndescribe('SomeProvider',\
    \ function () {\n    it('should be injectable', inject(function (SomeProvider)\
    \ {\n        expect(SomeProvider).not.toBeUndefined();\n    }));\n    it('should\
    \ return configured name from someMethod', inject(function (SomeProvider) {\n\
    \        expect(SomeProvider.someMethod()).toBe('Chris Hiller');\n    }));\n \
    \   it('should provide a provider', function () {\n        module(function (SomeProviderProvider)\
    \ {\n            expect(SomeProviderProvider.last_name).toBe('Hiller');\n    \
    \    });\n    });\n});\n```\n\nThe $get() function is required; it is called to\
    \ retrieve the SomeProvider service _after_ config() has been called. When using\
    \ the provider as a provider, if you have a provider named \"Foo\", you will inject\
    \ \"FooProvider\", which is automatically created for you. It's like two services\
    \ in one! Note that you cannot inject SomeProviderProvider into anything after\
    \ bootstrapping has finished. This means you must only use your provider (\"FooProvider\"\
    ) in the config() function, before the services have initialized.\n\nA real-world\
    \ example of a useful provider would be a generic \"dialog\" or \"pop-up\" provider\
    \ (\"Dialog\" or \"DialogProvider\"), which you could configure during the config()\
    \ stage to use any number of different implementations. For example, you may want\
    \ to tell \"DialogProvider\" to use jQuery UI, or Bootstrap, or some hand-rolled\
    \ thing. That way, each module or application using the provider (living in some\
    \ common module) will be able to declare what implementation to use, and the service\
    \ (\"Dialog\") will act accordingly. You should probably even allow this service\
    \ to be configurable on-the-fly if, for some reason, you need to use a Bootstrap\
    \ modal here and a jQuery UI dialog there (ew).\n\n![](img/f95c537c2fc9346a21a144b89cfac580_94_0.png)"
