    \    // Retrieve the posts from our \"server\". If this succeeds, we'll\n    //\
    \ put the posts into our $scope and do some post-processing.\n    Posts.getPosts().success(function\
    \ (data) {\n        var posts;\n        $scope.posts = data.posts;\n        posts\
    \ = $scope.posts;\n        // Convert timestamps to JS timestamps (w/ millisecond\
    \ precision)\n        var i = posts.length;\n        while (i--) {\n         \
    \   posts[i].date = posts[i].date * 1000;\n        }\n    });\n    // This closes\
    \ all editors if we happen to click the \"new post\" button\n    $scope.$watch('posts',\
    \ function (new_val, old_val) {\n        var i;\n        if (new_val !== old_val)\
    \ {\n            i = new_val.length;\n            while (i--) {\n            \
    \    new_val[i].editing = false;\n            }\n        }\n    });\n});\n```\n\
    \nThe controller is continued below, but I wanted to stop and point out that the\
    \ code that's written above is executed as soon as the controller is instantiated—that\
    \ is to say, the HTML that the controller is attached to is rendered. Every time\
    \ this controller is instantiated it'll grab the posts and set up a \"watch.\"\
    \ What follows are simply functions to be called later, generally by the view.\n\
    \nAbove, we've defined a new controller called `HeadCtrl`, which we referenced\
    \ in the markup from the previous chapter. We renamed `MainCtrl` to `ContentCtrl`,\
    \ and added something called a **watch** to the `$scope` object. Essentially,\
    \ this observes the state of an AngularJS expression, and executes code when that\
    \ state changes. Specifically, when we go to create a new post, we disable the\
