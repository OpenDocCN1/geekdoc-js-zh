  md: "# Temporary Variables\n\nYou are probably not going to need temporary variables.\
    \ You may think you do — what if we have a nested `ngRepeat` loop, and we need\
    \ to access the `$index` property of the outer loop from within the inner loop?\
    \ The inner loop declares `$index` itself, so that's not going to work. In other\
    \ templating languages you might want to declare a temporary variable within the\
    \ outer loop. This is how you'd do it with AngularJS:\n\n```\n<div ng-repeat=\"\
    stuff in things\" ng-init=\"outerIndex = $index\">\n  <div ng-repeat=\"bits in\
    \ stuff\">\n    {{outerIndex}}.{{$index}}\n  </div>\n</div>\n```\n\nBut, in AngularJS,\
    \ you don't need to use `ngInit` for this common case. `ngInit` simply executes\
    \ an AngularJS expression against the current scope. Use it sparingly! Remember\
    \ that every scope has a parent (except the root scope, of course). To avoid `ngInit`,\
    \ do this:\n\n```\n<div ng-repeat=\"stuff in things\">\n  <div ng-repeat=\"bits\
    \ in stuff\">\n    {{$parent.$index}}.{{$index}}\n  </div>\n</div>\n```\n\nIn\
    \ fact, I'm having a hard time imagining a use case wherein `$parent` wouldn't\
    \ be sufficient in some way. However, I'd suggest using `ngInit` if you end up\
    \ with something like `$parent.$parent.$parent.$parent.$index`. Do whatever is\
    \ simple. Also remember that `ngInit`, unless it's in an `ngRepeat` loop, will\
    \ only execute one time; use this to your advantage or peril, if you must.\n\n\
    What if you have a bunch of JavaScript that you would like injected into the DOM,\
    \ but it doesn't make sense to escape it in JavaScript code? Templates to the\
    \ rescue. We'll discuss them next."
  merge: -1
  pgno: 54
- img_proc: true
  md: "# Templates\n\nGenerally you’ll just be wildly tossing AngularJS directives\
    \ into your raw markup, so you won’t need a template *per se*. However, when it\
    \ comes to lazy loading HTML or otherwise, consider using a template. It’s also\
    \ great to use small templates for reusability. There are two ways to define templates.\
    \ The first is in a <script> tag:\n\n```\n<script type=\"text/ng-template\" id=\"\
    foo\">\n    Hi, I'm the template with ID \"foo\".\n</script>\n```\n\nThe advantage\
    \ of having this stuff in a <script> tag like this is that your templates stay\
    \ out of the DOM until you put them there. The second form of a template, which\
    \ shares this advantage, is a partial. A partial is simply an external HTML file.\
    \ These are both templates and can be used exactly the same way, the only difference\
    \ is that one is external and the other is not.\n\n# Including a Template\n\n\
    The most straightforward way to include a template is the `ngInclude` directive.\
    \ Simply give it a path or ID, and it will first attempt to retrieve it from the\
    \ template cache (see below), and if this misses, an HTTP request will be made\
    \ to the path. If your application is small and you’re not concerned about loading\
    \ times, you should use internal (<script>-style) templates, because they will\
    \ be gathered up by AngularJS. If you prefer lazy-loading or when loading a bunch\
    \ of HTML up front is a bad idea, use the external (partial) style. Let’s break\
    \ out our index.html into some partials:\n\n```\n<!DOCTYPE html>\n<html ng-app=\"\
    blog\">\n<head>\n    <meta http-equiv=\"Content-type\" content=\"text/html; charset=utf-8\"\
    >\n    <title ng-bind-template=\"{{title}}\"></title>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.5/angular.min.js\"\
    \ type=\"text/javascript\"\n            charset=\"utf-8\"></script>\n    <script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\" type=\"\
    text/javascript\"\n            charset=\"utf-8\"></script>\n    <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body>\n\
    <ng-include src=\"'header.html'\"></ng-include>\n<div ng-controller=\"ContentCtrl\"\
    >\n    <new-post-area post=\"new_post\" cancel-text=\"Cancel\" save-text=\"Save\"\
    \ cancel=\"cancel\"\n                   save=\"save\"></new-post-area>\n    <div\
    \ id=\"posts-form\">\n        Order By: <select ng-model=\"order\"><option value=\"\
    title\">Title</option><option value=\"date\">\n        Date</option></select>\n\
    \        <input type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n\
    \        Search: <input type=\"text\" ng-model=\"filter\"/>\n    </div>\n    <div\
    \ id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \ ng-class-even=\"\n    'even'\" ng-class-odd=\"'odd'\">\n        <ng-switch on=\"\
    post.editing\">\n            <div ng-switch-when=\"true\">\n                <div\
    \ class=\"important-background-color\" color=\"#EEE\">\n                    <input\
    \ type=\"text\" ng-model=\"post.temp.title\"/><br/>\n                    <textarea\
    \ ng-model=\"post.temp.body\"></textarea><br/>\n                    <button ng-click=\"\
    cancel(post)\">Cancel</button>\n                    <button ng-click=\"save(post)\"\
    >Save Changes</button>\n                </div>\n            </div>\n         \
    \   <div ng-switch-default>\n                <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n\
    \                <p ng-click=\"edit(post)\" bold-click ng-bind-html-unsafe=\"\
    post.body\"></p>\n                <p><em>posted on {{post.date|date:'short'}}\
    \ by {{post.author}}</em></p>\n            </div>\n        </ng-switch>\n    \
    \    <hr/>\n        <button ng-click=\"newPost()\">New Post</button>\n    </div>\n\
    </div>\n<ng-include src=\"'footer.html'\"></ng-include>\n</body>\n</html>\n```"
  merge: -1
