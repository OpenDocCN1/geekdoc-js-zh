- md: '## Conclusion


    As you can see, it''s about as easy as setting up Jasmine to test AngularJS code,
    just a little different. The lack of support in angular-mocks.js doesn''t impede
    us. We simply use the injector to grab whatever we need. This should be enough
    to get you started with your own QUnit tests.


    This concludes the book. I hope you have learned something along the way. I know
    I certainly did!


