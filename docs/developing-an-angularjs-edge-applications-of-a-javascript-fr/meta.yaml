    \ up watches and events using `$watch`, `$on`, `$broadcast`, and `$emit`(we'll\
    \ get to these last three later)\n- Execute \"on load\" functionality; when the\
    \ view the controller is attached to is rendered by the browser\n\nThat's about\
    \ all your controllers are ever going to do.\n\n# Relationship to the Model\n\n\
    The controller is a place to reference a model in the scope, but it is not *the*\
    \ place to reference a model. A model can be kept in a service, factory, constant,\
    \ value, or even a directive. However, most of the time you are going to be storing\
