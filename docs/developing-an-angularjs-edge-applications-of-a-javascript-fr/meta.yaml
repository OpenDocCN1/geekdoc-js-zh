  md: "create an `updateDate()` function, which sets the “date” property of the `Post`\
    \ object to be `now`. We have a `save()` function that replaces much of the “save”\
    \ functionality from our previous version of `ContentCtrl`. Our `stopEditing()`\
    \ function simply flips the “editing” flag and resets our temporary object. Finally,\
    \ if we want to view a string representation of our `Post` object (using `toString()`),\
    \ it’s pretty handy to simply dump a JSON representation of it.\n\nWhat follows\
    \ is a controller actually using this service.\n\n```\n// Controls the blog content\
    \ including all methods related to posts\nblog.controller('ContentCtrl', function\
    \ ($scope, Posts, Post) {\n\n    // util function to stop editing all of the posts\n\
    \    $scope._stopEditingAllPosts = function (posts) {\n        var i;\n      \
    \  if (angular.isArray(posts)) {\n            for (i = 0; i < posts.length;\n\
    \                while (i--) {\n                    posts[i].stopEditing();\n\
    \                }\n        }\n    };\n\n    // Retrieve the posts from our “server”.\
    \ If this succeeds, we’ll\n    // put the posts into our $scope and do some post-processing.\n\
    \    Posts.getAll().success(function (data) {\n        var posts = data.posts,\
    \ i, post;\n        $scope.posts = posts;\n    });\n\n    // Create new Post objects\
    \ and put them into the list of posts.\n    for (i = 0; i < posts.length;\n  \
    \      while (i--) {\n            post = posts[i];\n            // convert to\
    \ milliseconds precision\n            $scope.posts[i] = new Post(post.title, post.body,\
    \ post.date * 1000,\n                post.author, true);\n        }\n    });\n\
    \n    // This closes all editors if when the user clicks the “new post” button\n\
    \    $scope.Swatch('posts', function (new_val, old_val) {\n        if (new_val\
    \ !== old_val.val) {\n            $scope._stopEditingAllPosts(old_val);\n    \
    \    }\n    });\n\n    // Begins editing a post by making a temporary copy of\
    \ the title and body,\n    // and setting the “editing” flag for that post to\
    \ be true.\n    $scope.edit = function (post) {\n        $scope._stopEditingAllPosts($scope.posts);\n\
    \        post.beginEditing();\n    };\n\n    // Saves a post, sets its editing\
    \ flag to false, puts it in the list of posts\n    // and eliminates the ‘new_post’\
    \ from the scope.\n    $scope.save = function (post) {\n        post.save();\n\
    \        $scope.posts.unshift(post);\n        delete $scope.new_post;\n    };\n\
    \n    // Cancels a post edit. Does not copy temp data, and sets the editing flag\n\
    \    // to false, so the “New Post” button appears.\n    $scope.cancel = function\
    \ (post) {\n        post.stopEditing();\n        delete $scope.new_post;\n   \
    \ };\n\n    // instantiate new Post object provided by Post factory\n    $scope.newPost\
    \ = function () {\n        $scope._stopEditingAllPosts($scope.posts);\n      \
    \  $scope.new_post = new Post('Enter title Here', 'Enter Body Here', 'undefined',\
    \ 'me');\n        $scope.new_post.beginEditing();\n    };\n});\n```\n\nProcedurally,\
    \ what this controller does, is ask the Posts service for postes whenever it is\
    \ instantiated. The controller is instantiated when the `ngController` directive\
    \ is encountered, compiled and linked. So if you had two `contentCtrls` hanging\
    \ out in your markup, the"
