- md: "## Developing an AngularJS Edge\n\n### Applications of a JavaScript Framework\n\
    \nChristopher Hiller\n\n## Developing an AngularJS Edge\n\nBy Christopher Hiller\n\
    © Bleeding Edge Press, 2013\nISBN: 978-1-939902-00-9\nv1.1 0513\n\n## Preface\n\
    \nThis book is intended for intermediate JavaScript programmers. We make no attempt\
    \ to explain the JavaScript syntax used (except in the cases where AngularJS may\
    \ introduce a peculiarity), nor do we explain concepts such as closures, function\
    \ chaining, callbacks, or other common patterns.\n\nWe do explain basic AngularJS\
    \ concepts, components, and their applications, and we cover more topics in detail\
    \ where warranted. We provide examples along the way, answer questions, and correct\
    \ common misconceptions. Together, we’ll build a working single-page weblog application\
    \ using AngularJS.\n\nYou’ll need somewhere to run your examples. I choose Plunker\
    \ (http://plnkr.co), as it’s a great sandbox for developing JavaScript applications.\
    \ Plunker’s written in AngularJS; however, please note it doesn’t run in IE. You\
    \ may want to give JSFiddle a try if you use IE (http://jsfiddle.net).\n\n## Where\
    \ To Get The Code\n\nAll code used in examples in this ebook, including the final\
    \ product, is available for download at https://github.com/angularjsedge. This\
    \ page also includes links to working examples (on Plunker) for much of the code\
    \ in this book.\n\n## Setup\n\nTo get going, you’ll want to get AngularJS from\
    \ http://www.angularjs.org. At the time of this writing, the current stable version\
    \ is 1.0.5. AngularJS comes in stable and unstable branches; the 1.0.x is stable\
    \ and 1.1.x is unstable. Also to help with some examples, you will want to get\
    \ your paws on jQuery (http://www.jquery.com), Jasmine (http://pivotal.github.com/jasmine/),\
    \ and QUnit (http://www.qunitjs.com) if that is how you roll (this is optional).\
    \ Note, that if you are using Plunker, you should probably just use CDN versions\
    \ of these libraries if they are available (instead of uploading the JavaScript\
    \ files).\n\nTo actually run the unit tests we will be writing, you should get\
    \ your hands on Karma (http://karma-runner.github.io/0.8/index.html). This requires\
    \ NodeJS (http://node.js.org) to run. Furthermore, you will need the AngularJS\
    \ Mocks module for Jasmine integration (http://code.angularjs.org/1.0.5/angular-mocks.js).\n\
    \n### Karma setup\n\nKarma doesn’t work out of the box; it needs to know what\
    \ to test. It uses Chrome as its test runner by default, so to keep configuration\
    \ simple, please have it handy.\n\n- Install Node (http://nodejs.org/download).\
    \ Depending on your system, this will be an installer, binary, or source code\
    \ that you’ll need to compile.\n- Create a project directory. I’m using /Volumes/projects/book.\n\
    - Download AngularJS and AngularJS mocks, as noted above, and put them in this\
    \ directory.\n- Download the book.js and bookSpec.js files from the book’s website,\
    \ and put them in this directory.\n\nNavigate to your project directory and execute\
    \ the following:\n\n```\n[chiller@overthruster book] npm install -g karma\n```\n\
    \nNext, you will execute testacular init, a small script to set up your configuration\
    \ file:\n\n```\n[chiller@overthruster ~]$ karma init\n\nWhich testing framework\
    \ do you want to use ?\nPress tab to list possible options. Enter to move to the\
    \ next question.\n> jasmine\n\nDo you want to use Require.js ?\nThis will add\
    \ the Require.js adapter into the files.\nPress tab to list possible options.\
    \ Enter to move to the next question.\n> no\n\nDo you want to capture a browser\
    \ automatically ?\nPress tab to list possible options. Enter empty string to move\
    \ to the next question.\n> Chrome\n>\n\nWhich files do you want to test ?\nYou\
    \ can use glob patterns, eg. \"js/*.js\" or \"test/**/*.Spec.js\".\nEnter empty\
    \ string to move to the next question.\n> /Volumes/projects/book/angular.min.js\n\
    > /Volumes/projects/book/angular-mocks.js\n> /Volumes/projects/book/book.js\n\
    > /Volumes/projects/book/bookSpec.js\n>\n```\n\n```\nAny files you want to exclude\
    \ ?\nYou can use glob patterns, eg. \"**/*.swp\".\nEnter empty string to move\
    \ to the next question.\n> \n```\n\n```\nDo you want Testacular to watch all the\
    \ files and run the tests on change ?\nPress tab to list possible options.\n>\
    \ yes\n```\n\n```\nConfig file generated at \"/Users/chiller/karma.conf.js\".\n\
    ```\n\nFinally, to run the tests, execute:\n\n```\n[chiller@overthruster book]\
    \ karma start\n```\n\nChrome should launch and you should see that tests passed\
    \ in your terminal. Huzzah!\n\n## About the Author\n\nChristopher Hiller is a\
    \ full-stack software engineer living and working in Portland, OR. He has over\
    \ 15 years of web development experience and is a JavaScript zealot. When not\
    \ coding epic masterpieces, he enjoys being a new dad, gaming, craft beers and\
    \ woodworking. Chris can be contacted via GitHub, at: http://github.com/boneskull.\n\
    \n## Acknowledgements\n\nWe would like to thank the following reviewers who offered\
    \ their time to make this book even more valuable:\n\nAshley Fisher, Dean Sofer,\
    \ Greg Goforth, Konstantin Stepanov, Trey Witteried, Dan Doyon, Ken Koontz, Peter\
    \ Bacon Darwin and Mykhailo Kotsur.\n\nAnd special thanks goes to Kim Lokøy who\
    \ not only checked code and provided valuable feedback, but went over everything\
    \ a second time for us and helped clarify comments.\n\n## Resources\n\nHopefully\
    \ this book will help you get comfortable and excited about AngularJS. You're\
    \ going to write some great applications and enjoy doing it.\n\nIf you want further\
    \ information, some great resources include:\n\n- AngularJS itself: http://angularjs.org\n\
    - AngularUI, the companion suite to AngularJS: http://angular-ui.github.com\n\
    - Dean Sofer has lots of tips and tricks: http://deansofer.com/posts/view/14/AngularJs-Tips-and-Tricks-UPDATED\n\
    - Brian Ford has many posts on AngularJS: http://brianford.com/blog/\n- Yeoman\
    \ helps you build AngularJS app skeletons, among other things: http://yeoman.io\n\
    - Year of Moo has some excellent posts on AngularJS: http://www.yearofmoo.com/\n\
    - Karma is probably the ideal test runner for AngularJS apps: http://karma-runner.github.io/0.8/index.html\n\
    - The AngularJS Google Group has lots of activity: http://groups.google.com/group/angular\n\
    - #angularjs on irc.freenode.net can be a good source of information (I'm \"boneskull\"\
    )\n- Jasmine is a BDD-style testing framework: http://pivotal.github.com/jasmine\n\
    - QUnit is a more traditional xUnit framework: http://qunitjs.com\n- AngularJS\
    \ on Google+: https://plus.google.com/+AngularJS\n- Many great tutorials at http://egghead.io/\n\
    - Module library at http://ngmodules.org\n\n## Chapter 1. Getting Started with\
    \ AngularJS\n\nAngularJS is a JavaScript framework that can help you write web\
    \ applications quickly using less code. AngularJS is not a library, and it is\
    \ not a collection of tools to help you achieve a specific goal. Rather, at its\
    \ core, it is an entirely different way of thinking about writing web applications.\
    \ As such, AngularJS has certain opinions about how you should be using it. Whereas\
    \ in the vanilla JavaScript world, you are given a blank canvas on which to paint,\
    \ AngularJS provides structure, organization and patterns. In order to master\
    \ AngularJS, you must understand how to adhere to its guidelines and why the guidelines\
    \ exist in the first place.\n\n> **Can I use AngularJS within Node.js?**\n\n*Not\
    \ presently. AngularJS is designed for client-side applications instead of server-side\
    \ JavaScript. I can't think of a reason to even want to do this other than perhaps\
    \ server-side template rendering. Look for this feature in the future.*\n\nAngularJS\
    \ is excellent at helping you write CRUD (Create, Read, Update and Delete) applications.\
    \ Its tools, abilities and limitations lend itself to this common scenario. For\
    \ example, the *databinding* ability of AngularJS is specifically tailored to\
    \ allow for the extremely easy modification of models and data sets.\n\nWhat AngularJS\
    \ is not suited for is applications with a strong graphical component: ones that\
    \ do many different heavy DOM modifications or games. Instead of just writing\
    \ your jQuery, you are going to be wrapping it in a lot of code with little benefit.\
    \ Look at what's available in the AngularJS API. If you find yourself outside\
    \ of those bounds most of the time, you may want to find another framework. Of\
    \ course AngularJS doesn't provide everything, and you can use 3rd party libraries\
    \ with it, but if *most* of your application is 3rd party libraries, you may not\
    \ want to work with AngularJS.\n\nDo not attempt to write a general-purpose JavaScript\
    \ library in AngularJS; it's meant for writing applications, not libraries. You\
    \ can write modules to be reused by other AngularJS applications, but anything\
    \ intended to be standalone or used with another library is not a good candidate.\n\
    \nKeep in mind that many web crawlers don't grok single-page web applications,\
    \ and you may need to take extra steps to ensure a good search engine position.\
    \ And it goes without saying, though I am going to say it: if your users don't\
    \ have JavaScript turned on for some reason, AngularJS is useless.\n\n> **What\
    \ if I want to write a CRUD app with a lot of animation?**\n\n*It's now pretty\
    \ easy to do this, assuming you're not doing some kind of wacko graphical demo.\
    \ AngularJS, with the release of unstable version 1.1.4, now supports native animations.\
    \ You can define animations with CSS3, jQuery, or any other animation library.*"
  mdcn: "\n## 打造 AngularJS 优势\n\n### JavaScript 框架的应用\n\nChristopher Hiller\n\n##\
    \ 打造 AngularJS 优势\n\n作者：Christopher Hiller\n© Bleeding Edge Press, 2013\nISBN:\
    \ 978-1-939902-00-9\nv1.1 0513\n\n## 前言\n\n本书面向中级 JavaScript 程序员。我们不会尝试解释所使用的\
    \ JavaScript 语法（除非 AngularJS 引入了某些特殊用法），也不会解释诸如闭包、函数链、回调或其他常见模式等概念。\n\n我们会解释 AngularJS\
    \ 的基本概念、组件及其应用，并在必要时详细涵盖更多主题。我们将在过程中提供示例，解答疑问并纠正常见的误区。我们将共同使用 AngularJS 构建一个可运行的单页\
    \ Web 博客应用程序。\n\n你需要一个运行示例的地方。我选择了 Plunker (http://plnkr.co)，因为它是开发 JavaScript\
    \ 应用程序的一个绝佳沙箱。Plunker 是用 AngularJS 编写的；但请注意，它不能在 IE 浏览器中运行。如果你使用 IE，可以尝试 JSFiddle\
    \ (http://jsfiddle.net)。\n\n## 如何获取代码\n\n本电子书中所有示例（包括最终产品）的代码均可在 https://github.com/angularjsedge\
    \ 下载。该页面还包含本书中大部分代码的运行示例（在 Plunker 上）的链接。\n\n## 环境搭建\n\n开始之前，你需要从 http://www.angularjs.org\
    \ 获取 AngularJS。在撰写本书时，当前稳定版本是 1.0.5。AngularJS 分为稳定版和不稳定分支；1.0.x 是稳定版，1.1.x 是不稳定版。此外，为了辅助某些示例，如果你习惯这样操作，你可能还需要获取\
    \ jQuery (http://www.jquery.com)、Jasmine (http://pivotal.github.com/jasmine/)\
    \ 和 QUnit (http://www.qunitjs.com)（这是可选的）。请注意，如果你使用 Plunker，建议直接使用这些库的 CDN 版本（而不是上传\
    \ JavaScript 文件）。\n\n为了实际运行我们将编写的单元测试，你应该获取 Karma (http://karma-runner.github.io/0.8/index.html)。这需要安装\
    \ NodeJS (http://node.js.org) 才能运行。此外，你还需要用于 Jasmine 集成的 AngularJS Mocks 模块 (http://code.angularjs.org/1.0.5/angular-mocks.js)。\n\
    \n### Karma 设置\n\nKarma 不能开箱即用；它需要知道要测试什么。它默认使用 Chrome 作为测试运行器，因此为了保持配置简单，请准备好\
    \ Chrome 浏览器。\n\n- 安装 Node (http://nodejs.org/download)。根据你的系统，这可能是一个安装程序、二进制文件或需要编译的源代码。\n\
    - 创建一个项目目录。我使用的是 `/Volumes/projects/book`。\n- 如上所述，下载 AngularJS 和 AngularJS mocks，并将它们放入该目录。\n\
    - 从本书网站下载 `book.js` 和 `bookSpec.js` 文件，并将它们放入该目录。\n\n导航到你的项目目录并执行以下操作：\n\n```\n\
    [chiller@overthruster book] npm install -g karma\n```\n\n接下来，你将执行 `testacular\
    \ init`，这是一个用于设置配置文件的简单脚本：\n\n```\n[chiller@overthruster ~]$ karma init\n\nWhich\
    \ testing framework do you want to use ?\nPress tab to list possible options.\
    \ Enter to move to the next question.\n> jasmine\n\nDo you want to use Require.js\
    \ ?\nThis will add the Require.js adapter into the files.\nPress tab to list possible\
    \ options. Enter to move to the next question.\n> no\n\nDo you want to capture\
    \ a browser automatically ?\nPress tab to list possible options. Enter empty string\
    \ to move to the next question.\n> Chrome\n>\n\nWhich files do you want to test\
    \ ?\nYou can use glob patterns, eg. \"js/*.js\" or \"test/**/*.Spec.js\".\nEnter\
    \ empty string to move to the next question.\n> /Volumes/projects/book/angular.min.js\n\
    > /Volumes/projects/book/angular-mocks.js\n> /Volumes/projects/book/book.js\n\
    > /Volumes/projects/book/bookSpec.js\n>\n```\n\n```\nAny files you want to exclude\
    \ ?\nYou can use glob patterns, eg. \"**/*.swp\".\nEnter empty string to move\
    \ to the next question.\n> \n```\n\n```\nDo you want Testacular to watch all the\
    \ files and run the tests on change ?\nPress tab to list possible options.\n>\
    \ yes\n```\n\n```\nConfig file generated at \"/Users/chiller/karma.conf.js\".\n\
    ```\n\n最后，运行测试，执行：\n\n```\n[chiller@overthruster book] karma start\n```\n\nChrome\
    \ 应该会启动，并且你应该在终端中看到测试通过。太棒了！\n\n## 关于作者\n\nChristopher Hiller 是一位居住在俄勒冈州波特兰并在此工作的全栈软件工程师。他拥有超过\
    \ 15 年的 Web 开发经验，是一名 JavaScript 狂热者。在不编写史诗级杰作的时候，他享受成为一名新父亲的喜悦，此外还热爱游戏、精酿啤酒和木工。可以通过\
    \ GitHub 联系 Chris：http://github.com/boneskull。\n\n## 致谢\n\n我们要感谢以下审稿人，他们抽出时间让本书变得更有价值：\n\
    \nAshley Fisher, Dean Sofer, Greg Goforth, Konstantin Stepanov, Trey Witteried,\
    \ Dan Doyon, Ken Koontz, Peter Bacon Darwin 以及 Mykhailo Kotsur。\n\n特别感谢 Kim Lokøy，他不仅检查了代码并提供了宝贵的反馈，还为我们重新审视了所有内容并帮助理清了注释。\n\
    \n## 资源\n\n希望本书能帮助你熟悉并热爱 AngularJS。你将编写出一些出色的应用程序并乐在其中。\n\n如果你想获取更多信息，一些优秀的资源包括：\n\
    \n- AngularJS 官网: http://angularjs.org\n- AngularUI，AngularJS 的配套套件: http://angular-ui.github.com\n\
    - Dean Sofer 有很多技巧和心得: http://deansofer.com/posts/view/14/AngularJs-Tips-and-Tricks-UPDATED\n\
    - Brian Ford 有许多关于 AngularJS 的文章: http://brianford.com/blog/\n- Yeoman 可以帮助你构建\
    \ AngularJS 应用骨架等: http://yeoman.io\n- Year of Moo 有一些关于 AngularJS 的优秀文章: http://www.yearofmoo.com/\n\
    - Karma 可能是 AngularJS 应用最理想的测试运行器: http://karma-runner.github.io/0.8/index.html\n\
    - AngularJS Google Group 有非常活跃的讨论: http://groups.google.com/group/angular\n- irc.freenode.net\
    \ 上的 #angularjs 是一个很好的信息来源（我的 ID 是 \"boneskull\"）\n- Jasmine 是一个 BDD 风格的测试框架:\
    \ http://pivotal.github.com/jasmine\n- QUnit 是一个更传统的 xUnit 框架: http://qunitjs.com\n\
    - Google+ 上的 AngularJS: https://plus.google.com/+AngularJS\n- http://egghead.io/\
    \ 有许多优秀的教程\n- 模块库: http://ngmodules.org\n\n## 第 1 章. AngularJS 入门\n\nAngularJS\
    \ 是一个 JavaScript 框架，它可以帮助你使用更少的代码快速编写 Web 应用程序。AngularJS 不是一个库，也不是一组帮助你实现特定目标的工具集。相反，其核心是一种完全不同的编写\
    \ Web 应用程序的思维方式。因此，AngularJS 对于你应当如何使用它有某些特定的“见解”。在原生 JavaScript 世界中，你面对的是一块可以随意绘画的空白画布，而\
    \ AngularJS 则提供了结构、组织和模式。为了精通 AngularJS，你必须理解如何遵守其指南，以及这些指南最初为何而存在。\n\n> **我可以在\
    \ Node.js 中使用 AngularJS 吗？**\n\n*目前不行。AngularJS 是为客户端应用程序设计的，而非服务端 JavaScript。除了可能的服务端模板渲染之外，我想不出为什么要这样做。请关注未来的功能更新。*\n\
    \nAngularJS 非常擅长帮助你编写 CRUD（创建、读取、更新和删除）应用程序。它的工具、能力和局限性都使其非常适合这种常见场景。例如，AngularJS\
    \ 的 *数据绑定 (databinding)* 能力是专门为极其便捷地修改模型和数据集而量身定制的。\n\nAngularJS 不适合的是具有强图形组件的应用：例如那些需要进行大量繁重\
    \ DOM 修改的应用或游戏。在这种情况下，你不能只写 jQuery，而是需要将其包裹在大量代码中却收效甚微。请查看 AngularJS API 提供的功能。如果你发现自己大部分时间都在这些范围之外，你可能需要寻找另一个框架。当然，AngularJS\
    \ 并非提供一切，你可以配合第三方库使用，但如果你的应用程序 *大部分* 都是第三方库，你可能不应该使用 AngularJS。\n\n不要尝试用 AngularJS\
    \ 编写通用 JavaScript 库；它是为了编写应用程序而设计的，而不是为了编写库。你可以编写可被其他 AngularJS 应用程序复用的模块，但任何旨在独立运行或与其他库共同使用的东西都不是合适的人选。\n\
    \n请记住，许多 Web 爬虫无法理解单页 Web 应用程序，你可能需要采取额外措施以确保良好的搜索引擎排名。而且无需多言，但我还是要说：如果你的用户因为某种原因没有开启\
    \ JavaScript，AngularJS 将毫无用处。\n\n> **如果我想编写一个带有大量动画的 CRUD 应用怎么办？**\n\n*现在这很容易实现，只要你不是在做一个疯狂的图形演示。随着不稳定版本\
    \ 1.1.4 的发布，AngularJS 现在支持原生动画。你可以使用 CSS3、jQuery 或任何其他动画库来定义动画。*\n"
