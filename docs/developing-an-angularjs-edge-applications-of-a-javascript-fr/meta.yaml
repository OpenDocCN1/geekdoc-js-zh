  md: '# # AngularUI and uiJq


    The AngularUI project ([http://angular-ui.github.com/](http://angular-ui.github.com/))
    provides many helpful and handy directives, but one in particular is especially
    handy. This is the uiJq directive. It allows you to execute any jQuery function
    that you would execute against a jQuery object by placing that function on the
    DOM node itself. For example:


    ```

    `<div id="foo" ui-jq="hide">I''m hidden</div>`

    ```


    This will hide the div immediately. To use an animation, you can do this:


    ```

    `<div id="foo" ui-jq="hide" ui-options="{duration: 500}">I''m hidden</div>`

    ```


    This will hide the div over a period of 500ms. The equivalent in JS would be:


    ```

    `$(''#foo'').hide({duration: 500});`

    ```


    As stated before, you can use this directive with *any* jQuery function (that
    is applied to a jQuery object; stuff like [$.map](http://api.jquery.com/jQuery.map/)
    is not applicable). That includes any jQuery plugins you may be using. You can
    pass any options to these functions using the uiOptions attribute object.


    That brings us to one of the most popular jQuery plugins out there, Twitter Bootstrap
    ([http://twitter.github.com/bootstrap/](http://twitter.github.com/bootstrap/)).'
