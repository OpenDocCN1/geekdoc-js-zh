  - "[PAGE 110]\n\n# Spinners And The Like\n\nFair warning: there should be a better\
    \ way to do the following. Currently AngularJS supports response interceptors\
    \ (which we'll cover in a minute), but not request interceptors, so while those\
    \ would be a fitter bit for this kind of solution, it's not possible given that\
    \ we could use them to hide a spinner, but not show one—that's where a request\
    \ interceptor would come in.\n\nYou may want to display an animated spinner while\
    \ Ajax requests are processing. This is easy to do across all of your requests\
    \ by using a request transformation. Request transformations are really for actually\
    \ taking some request-data-to-be and modifying it to your liking before it gets\
    \ sent. However, we can just as easily set up any kind of action to be taken before\
    \ any request is made. Let's do this in our blog by modifying our config() call.\n\
    \n```\n// configure $http to always pass this header\n// also, display a spinner\
    \ during any Ajax request\nblog.config(function($httpProvider) {\n  $httpProvider.defaults.common['X-Blog-Version']\
    \ = '1.0';\n  // this is where we do something like starting a spinner\n  $httpProvider.defaults.transformRequest.unshift(function(req)\
    \ {\n    $('body').append(spinner); // spinner is defined elsewhere\n    return\
    \ req; // return request unspooled\n  });\n  // last thing we do when retrieving\
    \ a response (before success() and the like):\n  // hide the spinner\n  $httpProvider.defaults.transformResponse.push(function(res)\
    \ {\n    if (spinner) {\n      spinner.remove();\n    }\n    return res; // return\
    \ response unspooled\n  });\n});\n```\n\nThis is very basic, and you could wind\
    \ up in a situation where two spinners are displayed at once, but, this is likely\
    \ a rare occurrence.\n\nIf you want to disable this behavior for certain requests\
    \ (continuous polling, for example), you can simply override it to do nothing:\n\
    \n```\n$http.get('/some/url', {transformRequest: angular.noop});\n```\n\nMind\
    \ you this is a hack. This is not for what request transforms and response transforms\
    \ were intended to do. Maybe it would be better to decorate the $httpBackend service.\
    \ This service sits between $http and XHR and handles all outgoing requests.\n\
    \n```\nblog.config(function($httpProvider, $routeProvider, $provide) {\n  // snip...\n\
    \  // pop a spinner when any HTTP req is made and remove it when the response\
    \ comes in\n  $provide.decorator('$httpBackend', function($delegate) {\n    //\
    \ do not blast mock $httpBackend if it exists\n    if (typeof angular.mock.angular.mock)\
    \ {\n      return $delegate;\n    }\n    return function(method, url, reqData,\
    \ done, reqHeaders, timeout, withCredentials) {\n      var spinner = angular.element('<div\
    \ class=\"working\"></div>');\n      $('body').append(spinner);\n      $delegate(method,\
    \ url, reqData, function() {\n        spinner.remove();\n        done.apply(this,\
    \ arguments);\n      }, reqHeaders, timeout, withCredentials);\n    };\n  });\n\
    });\n```\n\nNote: we've injected the $provide service—don’t forget that. A decorator\
    \ will be called"
