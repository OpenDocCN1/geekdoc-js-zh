  md: "# # More About Directives\n\nA directive either is some sort of HTML element\
    \ (or comment) or it attaches itself to one. Directives don't make sense without\
    \ HTML elements. If you want to interact with an HTML element, try using a directive.\
    \ If you are doing anything else, don't.\n\nDirectives cannot directly \"include\"\
    \ linking or compilation functions from other directives. They are not injectable.\
    \ If you think you need to inject a directive, you're doing it wrong. Instead,\
    \ you may write some HTML using the directive that actually calls another directive.\
    \ An example of this is the accordion \"widget\" from earlier, which I'll repeat\
    \ here:\n\n```\nblog.directive('accordion', function() {\n  return {\n    restrict:\
    \ 'E',\n    replace: true,\n    template: '<div class=\"accordion\"><h3>{{title}}</h3>'\
    \ +\n      '<div class=\"accordion-content\" ng-show=\"open\" ng-transclude></div>',\n\
    \    transclude: true,\n    scope: {\n      title: '='\n    },\n    link: function(scope,\
    \ elm) {\n      scope.open = false;\n      // assume we have no jQuery.\n    \
    \  angular.element(elm.children()[0]).bind('click', function() {\n        scope.$apply('open\
    \ = !open');\n      });\n    }\n  };\n});\n```\n\nThe template of this directive\
    \ has another two directives in it: `ngShow` and `ngTransclude`. That's how you\
    \ include one directive in another. If you need to share functionality between\
    \ directives, you can specify a controller that multiple directives can use—and\
    \ they can even use this controller to talk to each other.\n\n# ## Reusable Directives\n\
    \nContinuing our discussion from earlier about widgets—if you want to write a\
    \ reusable directive, there are some steps you should take. The first step is\
    \ making sure you don't pollute any scopes. Here's an example of a directive that\
    \ pollutes the scope:\n\n```\nmyApp.directive('badDirectiveIsBad', function()\
    \ {\n  return function(scope, elm, attrs) {\n    scope.foo = scope.$eval(attrs.badDirectiveIsBad);\n\
    \  };\n});\n```\n\nThis is bad because we took `<div bad-directive-is-bad=\"'bar'\"\
    />` and polluted the current scope with the foo model. If we have some controller\
    \ in play, that controller's scope will now have foo in it, and any scope descending\
    \ from that scope. Furthermore, if foo was a model in the scope, you have just\
    \ blasted it away. Obviously this can be the source of bugs. We can avoid this.\n\
    \nWe avoid this by having our directive create its *own* scope. Well—that solves\
    \ the problem of polluting the current scope, but not the parent scope. To avoid\
    \ that problem, we create an *isolate* scope. An isolate scope differs from a\
    \ normal scope in that it does not prototypically inherit from its parent. You\
    \ can throw anything in an isolate scope without worry of it polluting any other\
    \ scope.\n\nThe salient option is the scope property of the object returned by\
    \ your directive. Set it, and you have an isolate scope. Here's a marginally useful\
    \ example of a directive safely using"
  merge: -1
  pgno: 81
- img_proc: true
  md: "an isolate scope, which we can add to our blog code:\n\n```\n// Debug directive\
    \ helps you debug a little more nicely than normal.\n// This could be accomplished\
    \ with a filter as well.\n// Usage:\n// <debug val=\"foo\"/>\n// Output HTML:\n\
    // <debug val=\"foo\"><pre>{{debug(expression)}}</pre></debug>\n// ... where debug(expression)\
    \ results in a pretty-printed JSON representation of the expression\n// defined\
    \ in @val.\nblog.directive('debug', function() {\n    return {\n        restrict:\
    \ 'E',\n        scope: {\n            expression: '=val'\n        },\n       \
    \ template: '<pre>{{debug(expression)}}</pre>',\n        link: function(scope)\
    \ {\n            // pretty-prints\n            scope.debug = function(exp) {\n\
    \                return angular.toJson(exp, true);\n            };\n        }\n\
    \    };\n});\n```\n\nToss it somewhere in index.html, within the `ContentCtrl`\
    \ <div>:\n\n```\n<debug val=\"posts\"></debug>\n```\n\nYou’ll see you get a nice,\
    \ preformatted and pretty-printed output of the value of `$scope.posts` from our\
    \ `ContentCtrl` controller (note this won’t work if you aren’t using the default\
    \ route, because only post is defined).\n\nThe scope property says, “put a model\
    \ on the scope called ‘expression’ and make it whatever the evaluated value of\
    \ the ‘val’ attribute was”. I guess that’s a bit of a mouthful, but if you try\
    \ using this directive for yourself, you’ll see it’s quite simple.\n\nThe second\
    \ parameter to `angular.toJson()` is a flag to pretty-print the output. When using\
    \ `<pre>{{posts}}</pre>` you will get the value of posts alright, but it may be\
    \ difficult to read.\n\nFinally, we declared this `debug()` function on the scope.\
    \ This function does not appear in the current scope or parent scope. Thus, if\
    \ we had defined a function called debug in `ContentCtrl` somewhere, they would\
    \ not conflict.\n\nNote that if posts changes at any time, because we have linked\
    \ it using the = operator in the isolate scope definition, the output of this\
    \ directive is data-bound and will update.\n\nYou can also declare an isolate\
    \ scope with `scope: true` or `scope: {}; either of these will give you an empty\
    \ scope. This is useful if you don’t need to evaluate any expressions or attributes\
    \ between your parent scope and the directive.\n\n# Directive Controllers\n\n\
    Directives can have controllers. Directives can reuse one controller between them.\
    \ You can do some interesting things with this; two directives of different kinds\
    \ can essentially “talk” to each other in this manner. Check this out:\n\n```\n\
    // controls formattedDebug and looseDebug directives.\nblog.controller('DebugCtrl',\
    \ function ($scope, $element) {\n    var minimized = false;\n\n    // pretty prints\
    \ a debug\n    this.debug = function (exp) {\n        return angular.toJson(exp,\
    \ true);\n    };\n});\n```"
