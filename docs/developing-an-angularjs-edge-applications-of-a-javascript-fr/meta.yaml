  md: "Old the alternative:\n\n```\nfunction ParentCtrl($http) {\n  $scope.getFoo\
    \ = function() {\n    $http.get('foo.url').success(function(data) {\n      $scope.foo\
    \ = data;\n    });\n  };\n}\n\nfunction ChildCtrl() {\n  var foo_watch = $scope.$watch('foo',\
    \ function(foo, old_foo) {\n    if (foo != old_foo && !!foo) {\n      // do something\
    \ with foo\n      foo_watch(); // stop watching\n    }\n  });\n  $scope.getFoo();\n\
    }\n```\n\nWhich is better? I'd call the promise strategy more elegant. I'd say\
    \ use the `$watch` strategy only if you need to execute some code against foo\
    \ *more than once*. Don't cancel the `$watch` by calling its return function,\
    \ and you got it. Otherwise, if you did this with promises, you'd have to set\
    \ up a `$watch` anyways!"
