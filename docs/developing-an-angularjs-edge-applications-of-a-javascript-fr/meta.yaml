  md: "# # Ajax\n\nAngularJS has two services for handling Ajax requests. The first,\
    \ `$resource`, is highly abstracted and tailor-made for RESTful applications.\
    \ The second, `$http`, is lower-level and will do just about anything. The general\
    \ recommendation is to use `$resource` (don't forget to include the `ngResource`\
    \ module!) if your REST API is simple.\n\n# ## $resource Service\n\nLet's say\
    \ we have a REST API. Doing a GET request against /donut/foo will return you the\
    \ Donut object with ID \"foo\". POSTing to this URL will \"save\" the Donut object.\
    \ DELETE-ing to this URL will delete. A GET request to /donuts/ will give you\
    \ all of the Donut objects. Here's an example of doing some operations against\
    \ this backend returning JSON, using the `$resource` service from the `ngResource`\
    \ module:\n\n```\n// $resource returns a Resource object. The second parameter\
    \ describes the parameters to the resource call.\n// Here, specify a :id in the\
    \ URL and tell AngularJS to insert the value of the 'donutId' string in the\n\
    // URL when making a request. This assumes that the server will return a collection\
    \ of donuts at the \"/donut/\" URL,\n// and if an ID is specified (\"/donut/foo\"\
    ) then it will only return that particular donut.\nvar Donut = $resource('/donut/:id',\
    \ {id: '@donutId'});\n// use this object to query. Note that powdered_donut is\
    \ immediately undefined after this line executes, because\n// 'get' is an asynchronous\
    \ operation. Some magic happens, however, and when the item is retrieved from\
    \ the server,\n// the value of powdered_donut is populated.\n// Functions named\
    \ Donut.foo() are \"class\" functions, and the returned value of these functions\n\
    // is considered an instance of Donut. Donut.save() and donut.$save() do basically\
    \ the same thing; the former requires\n// more parameters.\n// this is an HTTP\
    \ GET.\nvar powdered_donut = Donut.get({donutId: 'powdered'}, function(donut)\
    \ {\n    // optional success callback stuffed with donut. Will have the same value\
    \ as powdered_donut when this resolves.\n    // this\n    powdered_donut.sold_out\
    \ = donut;\n    powdered_donut.$save(); // HTTP POST; note that AngularJS' prefixing\
    \ with \"$\" is to avoid clobbering your namespace\n```\n\n```\n    // or you\
    \ could just HTTP DELETE the donut\n    // powdered_donut.$delete();\n}, function(error)\
    \ {\n    // optional failure callback\n});\n```\n\n```\n// this is an HTTP DELETE\
    \ to /donut/glazed.\n// if we had retrieved the glazed donut using get(), then\
    \ we could delete it using the $delete() function. Same thing.\nDonut.delete({donutId:\
    \ 'glazed'}, function(donut) {\n    // optional callback if we successfully deleted\n\
    }, function(error) {\n    // optional failure callback\n});\n// get all donuts.\
    \ HTTP GET; query returns a promise that will resolve to the same value as the\
    \ donut parameter.\nvar all_donuts = Donut.query(function(donuts) {\n    // optional\
    \ success callback\n}, function(error) {\n    // optional failure callback\n});\n\
    // HTTP POST. can use $save on actual\nDonut.save({donutId: 'pepto'}, {id: 'pepto',\
    \ cost: '1.23'}, function(donut) {\n    // successful save\n}, function(error)\
    \ {\n    // unsuccessful save\n});\n```\n\n# ## \U0001F43B But Donut.get() just\
    \ returns undefined and I want to do something with the result! Can I make $resource\
    \ synchronous?\n\nNo. You cannot make `$resource` synchronous. Use the \"success\"\
    \ callback function to do whatever you want to with the result of `Donut.get()`.\
    \ If it bothers you that much, you don't have to do this:\n\n```\n$scope.foo =\
    \ Foo.get({bar: 'baz'});\n```"
  merge: -1
