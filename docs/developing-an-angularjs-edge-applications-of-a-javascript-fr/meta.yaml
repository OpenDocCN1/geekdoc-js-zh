  - "[PAGE 116]\n\nin the route config object passed into `when()`) if you wish, but\
    \ often times this is unnecessary if there is a controller already controlling\
    \ your patrial.\n\nIf we had a RESTful backend (which we don’t), we could do this\
    \ a little more easily with the `$resource` service. However, we’ll have to make\
    \ do by modifying the `ContentCtrl` controller to search through an array for\
    \ the specified post if it gets one.\n\nModify the `ContentCtrl` controller to\
    \ inject `$routeParams`, and put the following logic into the `success()` block:\n\
