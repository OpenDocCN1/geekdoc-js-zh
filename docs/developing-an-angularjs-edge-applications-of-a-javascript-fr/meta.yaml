  md: 'jQuery, don''t worry about jqLite, as Angular will use that instead. It is
    a library that is a subset of the jQuery library, so it has limited functionality.
    What it can do is discussed in the documentation for angular.element: http://docs.angularjs.org/api/angular.element.
    Importantly, jqLite does not use jQuery selectors. If you need selectors, you
    will need jQuery proper.


    The linking function gets executed by AngularJS during HTML compilation when scopes
    become available. This is in contrast to the compile function, which is executed
    before scopes become available, which we will touch on later. This linking function
    is where we want to put our directive''s logic.


    ![](img/f95c537c2fc9346a21a144b89cfac580_69_0.png)


    This particular directive simply binds a click event to the element, and changes
    the appearance of that element with the `css()` function. Clicking the post body
    will change the text from normal weight to bold, and vice-versa.


    That''s a simple attribute-based directive. Let''s write trivial examples of the
    other three types of directives. I''d like a directive that I can stick in an
    HTML comment that will insert a copyright for anyone who happens to be browsing
    the code:'
