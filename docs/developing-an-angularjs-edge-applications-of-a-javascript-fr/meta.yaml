  md: "# Creating a Controller\n\nThere are (at least) three different ways to create\
    \ a controller. The first two use the `controller()` method of a Module object:\n\
    \n```\nmy_module.controller('MyCtrl', function($scope, SomeOtherService) {\n \
    \   ...\n});\nmy_module.controller('MyCtrl', ['$scope', 'SomeOtherService', function($scope,\
    \ SomeOtherService) {\n    ...\n}]);\n```\n\nIf you do *not* ever plan on compressing\
    \ (not necessarily *minifying* by simply eliminating whitespace and comments;\
    \ by \"compressing\" I mean strategies like renaming variables to shorter names)\
    \ your JavaScript, the first syntax is perfectly acceptable. The DI matching regular\
    \ expression will run against your function as expected. If you *do* plan on compressing\
    \ your JavaScript, you should use the second syntax. Because the service/constant/whatever\
    \ name is stored in a string, AngularJS will be able to ascertain what you meant\
    \ by looking at the strings, even if the parameters in the function call become\
    \ shortened.\n\nThe third syntax is even more straightforward:\n\n```\nfunction\
    \ MyCtrl($scope, SomeOtherService) {\n    ...\n}\n```\n\nYes, that's really all\
    \ there is to it. The same conditions apply here, of course; if you plan on compressing\
    \ your code this will not work. You must add the following after the function\
    \ definition:\n\n```\nMyCtrl.$inject = ['$scope', 'SomeOtherService'];\n```\n\n\
    This, like above, will store the parameter names as strings and make them available\
    \ to AngularJS upon compression.\n\nWhy would you want to use one or the other?\
    \ The first two syntaxes keep variables out of the local JavaScript scope. The\
    \ third syntax pollutes the scope somewhat. It also makes it a bit more straightforward\
    \ to accomplish controller inheritance.\n\n# Controller Inheritance\n\nYou won't\
    \ need this. Most of what you want to do can be placed inside of a Scope, and\
    \ its prototypical inheritance will serve you just fine. If you have common functionality\
    \ shared between controllers that are, say, siblings, consider putting that functionality\
    \ in a parent controller, or removing the functionality from the controllers altogether\
    \ and using a service or factory."
  merge: -1
