  md: "# # ngRepeat\n\nThe `ngRepeat` directive allows you to loop over an array or\
    \ object. The array syntax differs from the object syntax:\n\n```\nArray: `<div\
    \ ng-repeat=\"number in [1, 2, 3]\">{{number}}</div>` \nObject: `<div ng-repeat=\"\
    (letter, number) in {a: 1, b: 2, c: 3}\">{{letter}}: {{number}}</div>`\n```\n\n\
    This is all fine and dandy until you try to loop over an array and edit it in\
    \ place:\n\n```\n<div ng-repeat=\"number in [1, 2, 3]\">\n  <input type=\"text\"\
    \ ng-model=\"number\"/>\n</div>\n```\n\nYou'd think what would happen here is\
    \ you would simply be able to edit the members of the array. This is not the case.\
    \ `number` is actually a copy of the member of the array. So if you change `number`,\
    \ AngularJS has no idea what just happened other than it knows an array has changed.\
    \ Well, `ngRepeat` is watching that array, and will change its contents if the\
    \ array changes. Well, the array changed! `ngRepeat` now must rerender the template.\
    \ The consequence is that once you type one character into any of the text boxes,\
    \ you will lose focus because the DOM is being rerendered. Yuck!\n\nWhat can we\
    \ do about this? Very little, unfortunately. As it stands, if you want to loop\
    \ over an array in this manner, you can, but the contents of the `ngRepeat` loop\
    \ should be read only. A workaround is to use a different data structure. This,\
    \ for example, works fine:\n\n```\n<div ng-repeat=\"number in [{n: 1}, {n: 2},\
    \ {n: 3}]\">\n  <input type=\"text\" ng-model=\"number.n\"/>\n</div>\n```\n\n\
    You are not modifying an array at this point; you are modifying an object within\
    \ the array. So the array itself has not changed, and `ngRepeat` does not need\
    \ to rerender itself. Good advice is to always look for a “dot” (.) in the `ng-model`.\n\
    \nIt's generally bad news if your templating language is dictating your data structures,\
    \ but this is a price to pay for excellent data-binding functionality.\n\n# ##\
    \ ngRepeat's Special Variables\n\nThe `ngRepeat` directive in particular has some\
    \ tasty special variables. While in the context of the `ngRepeat` directive, you\
    \ have access to the following:\n\n+   - `$index` — The current, 0-based index\
    \ of the `ngRepeat` loop.\n- `$first` — Boolean; whether we are at the first item\
    \ in the loop.\n- `$middle` — Boolean; whether we are not at the first or last\
    \ items in the loop.\n- `$last` — Boolean; whether we are at the last item in\
    \ the loop.\n\n# ## ngBindHtmlUnsafe\n\nThat's a mouthful. What it does is allows\
    \ HTML to pass through AngularJS without getting escaped. By default, AngularJS\
    \ will escape any HTML before it is rendered in the"
