  md: "You can do this instead:\n\n```\nFoo.get({bar: 'baz'}, function(foo) {\n  \
    \  $scope.foo = foo;\n});\n```\n\nThey do the same thing. This is almost always\
    \ confusing to those new to AngularJS. In the end it simply provides you some\
    \ syntactic sugar.\n\n# $http Service\n\nIf you don't have a RESTful server you're\
    \ talking to, you are going to use the $http service. Think of this as akin to\
    \ jQuery's `$.ajax` function. You can initiate a HTTP GET request like so:\n\n\
    ```\n$http({\n    method: 'GET',\n    url: '/pigs/and/chickens/',\n    data: {\n\
    \        cows: 'horses'\n    },\n    params: {\n        sheepdogs: 'mules'\n \
    \   },\n    headers: {\n        'X-Farm-Animals': 1.0\n    }\n}).success(function(data)\
    \ {\n    // do stuff with response data; AngularJS will try to give you a JS object\
    \ if it detects JSON\n}).error(function(data) {\n    // handle non-200 response\
    \ codes\n});\n```\n\nThis will make a HTTP GET request to /pigs/and/chickens/?sheepdogs=mules\
    \ with request payload `{`\"cows\"`: `\"horses\"`}`, with special header X-Farm-Animals.\
    \ After the request has completed, the data will be passed to a success or error\
    \ callback, depending on what the server responded with.\n\nThere is some sugar\
    \ in place to make these calls a *little* less unwieldy; an identical GET request\
    \ can be made this way:\n\n```\n$http.get('/pigs/and/chickens', {cows: 'horses'},\
    \ {\n    params: {\n        sheepdogs: 'mules'\n    },\n    headers: {\n     \
    \   'X-Farm-Animals': 1.0\n    }\n}).success(function(data) {\n    // do stuff\
    \ with response data; AngularJS will try to give you a JS object if it detects\
    \ JSON\n}).error(function(data) {\n    // handle non-200 response codes\n});\n\
    ```\n\nYou can see in the Posts service that we have a function, `getPosts`, which\
    \ calls `$http` like so:\n\n```\nblog.service('Posts', function ($http) {\n  \
    \  this.getPosts = function () {\n        return $http.get('data.json');\n   \
    \ };\n});\n```\n\nCalling `Posts.getPosts()` will make a simple call to the file\
    \ at the data.json URL. The function returns the value of `$http.get()`, which\
    \ is *not* the data it retrieved; it returns a"
  merge: -1
