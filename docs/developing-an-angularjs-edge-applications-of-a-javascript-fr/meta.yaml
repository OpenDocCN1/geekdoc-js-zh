    \ ID 为 id 的模板，请使用 $templateCache.remove(id)。\n\n## 嘿，AngularJS 一直在转义我的 HTML！\n\
    \n默认情况下，AngularJS 会转义所有渲染到模板的 HTML。通常，如果你的数据需要清洗，这能保护你免受干扰。如果你信任你的数据源，可以使用 `ngBindHtmlUnsafe`\
    \ 指令让 AngularJS 原样渲染 HTML：\n\n```\n<div ng-bind-unsafe=\"some_html\"></div>\n\
    ```\n\n## 底层原理 (Under the Hood)\n\nAngularJS 中的编译是一个两步过程。考虑 $compile 服务和一个名为 template\
