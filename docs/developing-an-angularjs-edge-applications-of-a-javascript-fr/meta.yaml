  md: 'a bit of memory.


    # Relationship to the View


    The controller typically sits between factories/services and the view. A view
    cannot access a service or factory directly; it must interact with a controller
    (or a directive). However, the controller knows squat about the view. *Controllers
    are not meant to interact with the DOM*. You can force this to happen if you absolutely
    must, but this is a deliberate design decision on the part of the AngularJS authors
    of AngularJS. This makes controllers easily testable and potentially reusable.
    If you have to switch back between testing logic and DOM manipulation in tests,
    it’s going to be a mess.


    Putting no DOM manipulation into a controller is likely in complete opposition
    to everything you have learned about MVC/MVVM/MVW. If you are coming from Backbone,
    another modern JavaScript framework, even it places the responsibility of template
    processing in the hands of a controller. AngularJS simply takes this schism a
    step further and asserts DOM manipulation is not business logic. It believes markup
    should be managed by markup, most likely in the case of a directive.


    And a directive is where DOM manipulation should go, 9 times out of 10. There
    are cases where it’s easier to put some functionality into a service, and we’ll
    cover that later.


    # Relationship to Services and Factories


    Common functionality shared between controllers is a great candidate for a service
    or factory. The controller can inject the necessary services, and that’s that.'
