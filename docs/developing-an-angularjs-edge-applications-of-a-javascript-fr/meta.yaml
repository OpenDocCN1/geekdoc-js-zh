  md: '# Hey, AngularJS keeps escaping my HTML!


    By default, AngularJS escapes all HTML rendered to a template. Generally, this
    saves you from yourself if your data needs to be scrubbed. If you trust your source,
    you can have AngularJS render HTML verbatim using the `ngBindHtmlUnsafe` directive:


    ```

    `<div ng-bind-unsafe="some_html"></div>`

    ```'
