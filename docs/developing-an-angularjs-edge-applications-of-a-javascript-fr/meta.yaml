    \n### Socket.IO\n\nSocket.IO allows you to easily write real-time web applications\
    \ against a Node.JS server. While configuring a server is beyond the scope of\
    \ this text, we can discuss how to best use Socket.IO from within the context\
    \ of AngularJS.\n\nSocket.IO provides a global variable, io. You can call io.connect('http://your-server.com')\
    \ to get a socket object. You now have a persistent socket connection to the Node.JS\
    \ server you specified. Let's provide a factory to use Socket.IO. This will keep\
    \ you out of the global scope (using dependency injection) and assist with the\
    \ digest loop; remember, non-AngularJS code doesn't know when to trigger watches,\
    \ so we have to tell it to.\n\nLet's build that factory, which is very similar\
    \ to what Brian Ford has come up with at [http://briantford.com/blog/angular-socket-io.html](http://briantford.com/blog/angular-socket-io.html):\n\
    \n```javascript\nangular.module('app').factory('connect', function ($window, $q)\
    \ {\n    return function (scope, url) {\n        var socket = $window.io.socket(url);\n\
    \        return {\n            // wrapper around socket.on()\n            on:\
    \ function (event) {\n                var dfrd = $q.defer();\n               \
    \ socket.on(event, function () {\n                    var args = arguments;\n\
    \                    scope.$apply(function () {\n                        dfrd.resolve.apply(dfrd,\
    \ args);\n                    });\n                });\n                return\
    \ dfrd.promise;\n            },\n            // wrapper around socket.emit()\n\
    \            emit: function (event, data) {\n                var dfrd = $q.defer();\n\
    \                socket.on(event, data, function () {\n                    var\
    \ args = arguments;\n                    scope.$apply(function () {\n        \
    \                dfrd.resolve.apply(dfrd, args);\n                    });\n  \
    \              });\n                return dfrd.promise;\n            }\n    \
    \    };\n    };\n});\n```\n\nAnd basic usage:\n\n```javascript\nfunction MyCtrl($scope,\
    \ connect) {\n    // remember: socket is not a real Socket.IO socket object; it's\
    \ our wrapper\n    var socket = connect($scope, 'http://localhost.com');\n   \
    \ socket.on('some_event').then(function() {\n        // do stuff\n    });\n  \
    \  socket.emit('some_other_event', {foo: 'bar'}).then(function() {\n        //\
    \ do other stuff\n    });\n}\n```\n\nSo you’ll note that we’re using promises\
    \ instead of callbacks here; Socket.IO uses callbacks but we can avoid them altogether.\n\
