  - "[PAGE 86]\n\n# Chapter 7. Services, Factories and Providers\n\nServices, providers,\
    \ and factories are all just fancy ways of saying \"library\". A broad description\
    \ of a library would be some collection of behavior that is reusable across multiple\
    \ codebases. Services provide this by acting as an instantiated, singleton object,\
    \ likely full of many instance methods. Factories can provide a new object every\
    \ time, perhaps full of functions, or perhaps just a single function, or even\
    \ object. Providers act much like factories, but they are configurable before\
    \ AngularJS hits its \"run\" phase.\n\nControllers, filters, directives etc.,\
    \ can all use these via DI (dependency injection). You can share functions, models,\
    \ singleton objects, classes (or just about anything) between disparate components.\
    \ These controllers, filters, and directives can be considered the codebases your\
    \ libraries provide behavior to.\n\nYou must understand the differences between\
    \ services, factories, and providers. You must also understand when to use them.\
    \ Here's a table to oversimplify the situation:\n\n| Component | Instantiated\
    \ | Needs a $get method | Explicitly returns something | Present during config()\
    \ |\n|-----------|-------------|---------------------|------------------------------|------------------------|\n\
    | Service   | Yes         | No                  | No                         \
    \  | No                     |\n| Factory   | No          | No                \
    \  | Yes                          | No                     |\n| Provider  | Yes\
    \         | Yes                 | No                           | Yes         \
    \           |\n\nOur blog could also use a service, Posts, to handle our data.\
    \ Here it is:\n\n```\n// Define our first service; Posts\n// This service simply\
    \ uses the built-in $http service to retrieve data from\n// a static JSON store.\n\
    blog.service('Posts', function ($http) {\n    this.getPosts = function () {\n\
    \        return $http.get('data.json');\n    };\n});\n```\n\nWithin the Posts\
    \ service, there's a `getPosts()` method which returns a promise from an $http\
    \ call. We could have just put the $http call within the controller itself, but\
    \ it's good practice to put potentially reusable code into a service, since controllers\
    \ cannot talk to one another unless they share the same scope. Now, any controller\
    \ that injects Posts into itself can use the method here; we don't have to write\
    \ separate $http calls.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_86_0.png)"
