  md: "# Unit Testing Services\n\nUnit testing factories, services and providers is\
    \ incredibly easy. Let's write tests for our Posts service and our Post factory:\n\
    \n```\ndescribe('Blog Services', function () {\n    var Posts, httpBackend;\n\n\
    \    // I want to use the variable name Posts for my service, but if I use DI\
    \ here to inject it\n    // the variable name will already be taken! A fun way\
    \ around this limitation isto inject the $injector service,\n    // then simply\
    \ ask it for what you want.\n    beforeEach(inject(function ($injector, $httpBackend)\
    \ {\n        Posts = $injector.get('Posts');\n        httpBackend = $httpBackend;\n\
    \    }));\n\n    describe('Posts', function () {\n        it('should initiate\
    \ the http call', function () {\n            var promise;\n            // you\
    \ will need to use expectGET, expectPOST, etc., when unit testing functions\n\
    \            // that use the $http service. They are assertions about what call\
    \ you are making and allow\n            // you to mock a response easily.\n  \
    \          httpBackend.expectGET('data.json').respond('foo');\n            promise\
    \ = Posts.getPosts();\n            // make sure our promise is really a then-able\
    \ object\n            expect(angular.isFunction(promise.then)).toBeTruthy();\n\
    \            promise.then(function (res) {\n                expect(res.data).toBe('foo');\n\
    \            });\n            httpBackend.flush();\n        });\n    });\n});\n\
    ```\n\nNext is a relatively long bit of testing code to assert all of our Post\
    \ class' methods are functioning as expected:\n\n```\ndescribe('Blog Factories',\
    \ function () {\n\n    var Post;\n\n    beforeEach(inject(function ($injector)\
    \ {\n        Post = $injector.get('Post');\n    }));\n\n    describe('Post', function\
    \ () {\n\n        // covers all of the constructor's behavior, which is very little.\n\
    \        describe('the constructor', function () {\n\n            it('should store\
    \ information temporarily when autosave flag is not truthy', function () {\n \
    \               var post = new Post('cashews', 'peanuts', new Date(), 'Mr. Almond');\n\
    \                expect(post.temp.title).toBe('cashews');\n                expect(post.temp.body).toBe('peanuts');\n\
    \                expect(post.title).toBeUndefined();\n                expect(post.body).toBeUndefined();\n\
    \                expect(post.date).not.toBeUndefined();\n                expect(post.author).toBe('Mr.\
    \ Almond');\n            });\n\n            it('should not store information temporarily\
    \ when autosave flag is truthy', function () {\n                var post = new\
    \ Post('cashews', 'peanuts', new Date(), 'Mr. Almond', true);\n              \
    \  expect(post.title).toBe('cashews');\n                expect(post.body).toBe('peanuts');\n\
    \                expect(post.temp.title).toBeUndefined();\n                expect(post.temp.body).toBeUndefined();\n\
    \                expect(post.date).not.toBeUndefined();\n                expect(post.author).toBe('Mr.\
    \ Almond');\n            });\n        });\n\n        describe('the updateDate\
    \ method', function () {\n            it('should reset the date', function ()\
    \ {\n                var old_date, post = new Post();\n                old_date\
    \ = post.toString();\n                post.updateDate();\n                // it\
    \ would be kind of weird/difficult to try to assert it updates the date object\n\
    \                // to NOW; so just assert it changed.\n                expect(old_date).not.toBe(post.date.toString());\n\
    \            });\n        });\n\n        describe('the save method', function\
    \ () {\n```"
