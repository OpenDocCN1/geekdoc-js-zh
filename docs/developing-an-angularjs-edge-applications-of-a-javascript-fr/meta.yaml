  - "[PAGE 34]\n\n# # Don’t want your model to update immediately after a change?\n\
    \nAn example of this tangent is a modal dialog in which some model is displayed,\
    \ and you want the user to make changes to the model. However, you only want those\
    \ changes applied when the user clicks “Save” and you want to throw away those\
    \ changes if the user clicks “Cancel.” There are several solutions to this, but\
    \ one is to simply copy your model using angular.copy(), and work with a temp\
    \ model, then copy back over it upon save. You could write a service or factory\
    \ to take care of this in the general case. Or, you could even write a generic\
    \ directive to mark a particular portion of the UI as “transactional” which will\
    \ not “commit” until “Save.”\n\n![](img/f95c537c2fc9346a21a144b89cfac580_34_0.png)\n\
    \nTake a look at this “transactional” directive w/ test:\n\n```\nangular.module('app',\
    \ []).directive('transactional', function($parse) {\n  return {\n    restrict:\
    \ 'E',\n    scope: true,\n    link: function(scope, elm, attrs) {\n      // get\
    \ a \"getter\" fn from the $parse service\n      var model = $parse(attrs.model);\n\
    \      // use the \"setter\" fn to put a copy of what's specified in the \"model\"\
    \ attribute\n      // into this directive's scope, which does NOT inherit from\
    \ the parent.\n      model.assign(scope, angular.copy(model(scope)));\n      //\
    \ upon save, reassign the parent's model to the current value of this directive's\n\
    \      // model.\n      scope.$save = function() {\n        model.assign(scope.$parent,\
    \ model(scope));\n      };\n    }\n  };\n});\n\n// ...and some unit tests\nbeforeEach(module('app'));\n\
    describe('transactional directive', function () {\n  var scope;\n  beforeEach(inject(function\
    \ ($rootScope) {\n    scope = $rootScope.$new(); // make brand new child scope\
    \ off of root\n  }));\n  describe('the model', function () {\n    it('should propagate\
    \ to the parent only when $saved', inject(function ($compile) {\n      var template,\
    \ compiled, isolateScope;\n      scope.foo = 'bar';\n      template = '<transactional\
    \ model=\"foo\"></transactional>';\n      compiled = $compile(template)(scope);\n\
    \      isolateScope = compiled.scope();\n      isolateScope.$apply('foo = \"baz\"\
    ');\n      expect(scope.foo).toBe('bar');\n      isolateScope.$apply('$save()');\n\
    \      expect(scope.foo).toBe('baz');\n    }));\n  });\n});\n```\n\nTo use this,\
    \ do something like this usage of the “transactional” directive:\n\n```\n<div\
    \ ng-controller=\"MyCtrl\">\n```"
  - "[PAGE 35]\n\n```\n<p>Value of foo: {{protected.foo}}</p>\n<transactional model=\"\
    protected\">\n  <p>Temp value of foo: <input type=\"text\" ng-model=\"protected.foo\"\
    /></p>\n  <button ng-click=\"protected.increment()\">increment</button>\n  <button\
    \ ng-click=\"$save()\">save</button>\n</transactional>\n</div>\n```\n\nWhere we\
    \ have a controller:\n\n```\nmyApp.controller('MyCtrl', function($scope) {\n \
    \ $scope.protected = {\n    foo: 1,\n    increment: function() {\n      this.foo++;\n\
    \    }\n  };\n});\n```\n\nThis directive does something I'm not especially hot\
    \ on—it stuffs something new into the scope. However, given that this is an *isolate*\
    \ scope, it's OK, because it will not pollute any parent scopes with the `$save`\
    \ function. If you are really cross-eyed about it, you can modify this directive\
    \ to supply the `save` function via another attribute. Also, there are a couple\
    \ more limitations to this strategy. You need a \"top-level\" model for this to\
    \ work; you cannot use a model of `foo.bar`. Furthermore, any pseudoclass you\
    \ may have used within your object(s) will *not* be persisted, as `angular.copy()`\
    \ does not do this.\n\n# Conclusion\n\nWhile not very interesting in and of itself,\
    \ the model is nonetheless a core component of AngularJS. Unlike other frameworks,\
    \ you do not need to extend any special class to create a model. With AngularJS,\
    \ you will put your data into a special Scope object instead.\n\nBoth the model\
    \ and the view are good places to start designing web applications. If your application\
    \ has a complex UI; however, you may want to begin with the view, which we'll\
    \ discuss in the next chapter."
  - '[PAGE 36]


    # Chapter 4. The View in Detail


    What''s the view? It''s what the user sees. It''s the presentation layer. It''s
    your templates. It''s your markup; your HTML. The view works closely with the
    controller, but it is decoupled, in that the controller doesn''t know anything
    about the view. Also, the view doesn''t really know anything about the controller.
    You may think it does, because it can execute functions and touch data within
    a controller; but really what the view has is a Scope object. The view and the
    controller both talk to the Scope object, but not to each other. It''s here that
    a core paradigm of the MVC pattern becomes clear: the separation of view and business
    logic. If you are familiar with the MVVM (Model-View-ViewModel) paradigm, think
    of the scope as the ViewModel. The AngularJS creators have stated that AngularJS
    is a MVW (Model-View-Whatever) framework, which means *this* author is not going
    to tread into that discussion.


    We''ll discuss what an AngularJS view typically looks like, including some typical
    attributes and some gotchas. This will also serve as a better introduction to
    *directives*, which are special commands executed by AngularJS. We will also look
    at a filter, which you may be seeing for the first time.'
