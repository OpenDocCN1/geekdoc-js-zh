    # # A Note About Unit Testing


    The following examples in this book will contain unit tests written in Jasmine
    ([http://pivotal.github.com/jasmine/](http://pivotal.github.com/jasmine/)). Jasmine
    is a BDD (Behavior-Driven Development)-style testing framework written in JavaScript
    for testing JavaScript. If you are unfamiliar with BDD, it’s OK—you don’t have
    to know anything about it to start using Jasmine. The syntax will seem a little
    strange, but makes sense pretty quickly.


    ![](img/f95c537c2fc9346a21a144b89cfac580_28_0.png)


    # ## BDD? I was just getting a handle on TDD!


    While TDD (test-driven-development) is simply a practice—in a nutshell, write
    your tests first—BDD is more than this. It is a different way of approaching software
    development. The main difference between the two is that BDD tests can, in their
    essence, be written by testers and even end-users. As you are determining your
    business logic in a specification, you can write down “x should happen when y
    happens” and convert this directly into a test with a BDD-style testing framework.
    I haven’t read any books about BDD, so I cannot recommend one, but you are encouraged
    to find out more if you are interested. Remember, you do not need to “subscribe”
    to BDD to use Jasmine for testing; it works great as a general-purpose unit testing
    framework.


    We’ll also assume that the angular-mocks.js file is included when doing these
    tests, as it provides some convenience methods for Jasmine to work with AngularJS.


    AngularJS provides functional (or E2E) tests within its online tutorial. While
    these tests have a lot of value, our application is small and we can get by with
    manual testing. Once your application grows, it makes more sense to automate functional
    tests, but I don’t find it necessary for our purposes.'
  - '[PAGE 29]


    # # The Components


    We have models, views, controllers, services/factories/providers, filters, and
    directives. All of these components will make up a module. A module may be an
    entire application, a part of an application, or a suite of reusable components.
    In a two-page application, for example, you may have a module that provides common
    functionality between the two pages, and a module for each page itself. You would
    include the "common" module when defining each page''s module. If you had other
    applications, you may want to break out common functionality to yet another module
    which all applications can use.


    +   - **Models**: The most logical place to reference a model will be in a controller,
    most of the time. If you have disparate controllers that do not share a common
    parent scope (except for the root scope, of course), you may want to reference
    your model in a service, because that is a singleton that all components can inject.

    - **Views**: A view is your markup. Anyone who has worked with a JavaScript templating
    language, or even a server-side templating language, will feel comfortable in
    a view. It contains simple logic statements and other bound data (often models),
    and uses directives and filters. When you reference a model in a view, it''s generally
    in some controller''s scope.

    - **Controllers**: A controller will exist somewhere within the application''s
    scope. It will have its own scope, and any child controllers will prototypically
    inherit from that scope. It is extremely useful to declare a function in a parent
    controller which two or more child controllers will use. Controllers are for referencing
    models and business logic. However, DOM manipulation does not belong in the controller.
    This needs to be hammered home and well-defined: "DOM manipulation", in my book,
    would be any code that modifies the existing DOM structure. If you keep your controller
    free of DOM manipulation, you will have cleaner code that is easily testable.
    Believe it.

    - **Services**: A service is an injectable singleton. A collection of functions
    all relating to a common concept, or a static class-like object would be great
    as a service. For example, a service could provide functions to call a handful
    of server-side APIs. You would not need another instance of this service. A service
    returns nothing.

    - **Factories**: A factory is injectable, but can return a function, object, or
    even a primitive (which I''ve yet to see a use case for, but there it is). If
    you have a JavaScript "class" you want to let your controllers use, this would
    be a great place to put it. If you have a utility function but don''t want to
    pollute a namespace, put it in a factory. Maybe you want to return a new instance
    of some object full of whatever—put it in a factory.

    - **Providers**: The provider is like a service that generates a factory, if that
    makes sense. During initialization, you can configure a provider to act a certain
    way after the application has loaded. The `$http` service is really a provider,
    and you can configure its defaults during initialization if you wish. A provider
    returns nothing, but defines `this.$get()`; a function to return a factory-like
    object. When you define provider `Foo`, you''re really defining `FooProvider`;
    the thing returned from `this.$get` is really `Foo`.'
- md: "# NP DOM Manipulation outside of a directive\n\nA service, factory, or provider\
    \ can be used for DOM manipulation, but if it is, it should solely serve that\
    \ function as to make unit testing straightforward and avoid spaghetti. A great\
    \ place to put functionality that creates a modal pop-up is in a service. Creating\
    \ a new \"view\" could even be construed as business logic. It turns out that\
    \ using a service in this manner may feel more natural than trying to shoehorn\
    \ the same functionality into a directive. For example, I have a case in which\
    \ I provide a `showwarning()` function (via a factory) to display a warning, the\
    \ contents of which sometimes fetched over HTTP, to the user, within a modal (note\
    \ that if we didn't need to show this in a modal, it would be better to simply\
    \ set the warning text in a model and use `$show` to display it).\n\n- **Filters**:\
    \ The filter is great for string or array manipulation to be done in a view. Outside\
    \ of a view, you can still use a filter, but you're probably better off providing\
    \ a factory function instead of a filter if you will use it exclusively outside\
    \ of views.\n\n- **Directives**: Finally, the directive is for DOM manipulation\
    \ or otherwise controlling the scope or a model from the view. It is never used\
    \ outside the context of a view. You'll know you need a directive when you find\
    \ yourself trying to use 3rd-party DOM manipulation libraries. Don't be tempted\
    \ to use that complicated library in your controller! It will pay off to write\
    \ a directive to bridge the gap between AngularJS and Library X. Custom validation\
    \ is best handled in a directive. You can overwrite AngularJS' default directives\
    \ to change their behavior as well. Don't want the model to update on every `keyDown`\
    \ event? Overwrite that input directive! We'll have an example of this later.\
    \ Directives essentially extend HTML and can be used to create a domain-specific\
    \ language for your application or applications.\n\n# Conclusion\n\nThose are\
    \ the core components that make up an AngularJS application. Think of them as\
    \ building blocks. You may need many or few components, depending upon your requirements.\n\
    \nIn the next chapter we'll explore the model in detail. It's just data—and you\
    \ probably have some laying around somewhere.\n\n## Chapter 3. The Model in Detail\n\
    \nWhat is a model? Some frameworks make you use a JavaScript class or extend some\
    \ other base class. Part of the beauty (I say that hesitantly) of JavaScript is\
    \ that you do not need classes (traditional-OOP-style-classes) if you do not need\
    \ classes. To JavaScript, what you really have are objects. If you want to write\
    \ a class with prototype methods and all that, by all means do it! But you don't\
    \ have to. A model can be a simple JS object: `{}`. A model, in fact, can be any\
    \ variable, any object, any data structure; a model *is* your data. Other frameworks\
    \ may have a Model class of some sort you need to extend; not so with AngularJS.\n\
    \n# AngularJS Models\n\nModels become useful when they are attached to a Scope\
    \ object. A Scope object is a special object that is created by AngularJS, and\
    \ (in addition to other things) provides data to your view. Putting your model\
    \ inside of a Scope object ensures that AngularJS is observing the model and will\
    \ take any actions necessary if that model changes. You can write a controller,\
    \ and in that controller you can have `var foo = 'bar';`, but AngularJS will absolutely\
    \ not care if you change the value to 'baz'. Once you do this, however: `$scope.foo\
    \ = 'bar';`, you now have something AngularJS can work with. If you have `<div>{{foo}}</div>`\
    \ in the view, `<div>` will be updated once `$scope.foo` has a value of `baz`.\
    \ This is, of course, Angular's data-binding.\n\n```\nScope w/ Models\n\n$scope.foo\
    \ = {}; // plain object\n$scope.bar = new Bar(); // instantiated object\n$scope.baz\
    \ = []; //plain array\n$scope.bool = true; // some boolean\n$scope.str = 'string';\
    \ // some string\n$scope.num = 31337; // some number\n```\n\nBut what if you want\
    \ to execute some custom code whenever `$scope.foo` changes? Yes, you can do that\
    \ by using a `$watch`. Observe the observation in this `$watch` example with test:\n\
    \n```\n// note no module here; not necessary for the example\nfunction SomeCtrl($scope,\
    \ $log) {\n    $scope.foo = 'bar';\n    $scope.$watch('foo', function(new_val,\
    \ old_val) {\n        if (new_val !== old_val) {\n            $log.log(\"foo used\
    \ to be '\" + old_val + \"', but is now '\" + new_val + \"'\");\n        }\n \
    \   });\n}\n\ndescribe('SomeCtrl', function () {\n    var scope;\n    beforeEach(inject(function\
    \ ($rootScope) {\n        scope = $rootScope.$new(); // make brand new child scope\
    \ off of root\n    }));\n    describe('the watch on foo', function () {\n    \
    \    it('should fire when foo changes', function () {\n            inject(function\
    \ ($controller, $log) {\n                spyOn($log, 'log');\n               \
    \ scope.$apply(function () {\n                    $controller(SomeCtrl, {\n  \
    \                      $scope: scope,\n                        $log: $log\n  \
    \                  });\n                });\n                expect(scope.foo).toBe('bar');\n\
    \                scope.$apply(\"foo = 'baz'\");\n                expect(scope.foo).toBe('baz');\n\
    \                expect($log.log).toHaveBeenCalled();\n            });\n     \
    \   });\n    });\n});\n```\n\nNow, any time foo changes, the JavaScript console\
    \ will let you know. Note the comparison of `new_val` and `old_val`—the `$watch`\
    \ will fire automatically when `foo` is set for the first time, which generally\
    \ isn't the desired behavior (but might be). So we use the conditional.\n\nThe\
    \ first parameter to `$watch` is actually an *AngularJS expression*. We're asking\
    \ our Scope object to observe the value of some expression and execute a callback\
    \ function when it changes. When we attached foo to the `$scope`, we created the\
    \ opportunity to use the foo expression to be evaluated against that Scope. Since\
    \ this can be any expression, we can even `$watch` some arbitrary boolean; `foo\
    \ == 'baz'`; when that conditional is evaluated and the evaluated value changes,\
    \ we will execute our callback function. This is useful if you want some code\
    \ to fire only when a model reaches a certain numeric value, for example.\n\n\
    Now, you can `$watch` entire objects or arrays if you like. Take a look at the\
    \ following nice model:\n\n```\n$scope.foo = {\n  bar: 'baz'\n};\n```\n\n`$watch`-ing\
    \ `foo` itself will **not trigger** our callback function if the value of `foo.bar`\
    \ changes. Why? Because, by default, `$watch` works by *reference*, not by value.\
    \ If you are watching `foo` and the reference to foo doesn't change—and if we\
    \ update `foo.bar`, it doesn't—the `$watch` will not fire.\n\nLuckily AngularJS\
    \ provides functionality to accomplish this sort of task. It is expensive, but\
    \ you can `$watch` by value. Simply pass the third parameter to a `$watch` call:\n\
    \n```\ndescribe('watches', function() {\n  var scope;\n  beforeEach(inject(function($rootScope)\
    \ {\n    $rootScope = $rootScope.$new();\n    scope = $rootScope.$new();\n   \
    \ scope.$apply(foo = {bar: \"baz\"});\n  }));\n\n  it('when watching by reference,\
    \ should not fire when object member updated',\n    inject(function($log) {\n\
    \      spyOn($log, 'log');\n      scope.$apply(function() {\n        scope.$watch('foo',\
    \ function(new_val, old_val) {\n          $log.log('foo used to be ' + angular.toJson(old_val)\
    \ + ' now it is ' + angular.toJson(new_val));\n        });\n      });\n\n    \
    \  scope.$apply(function() {\n        scope['foo'].bar = 'spam';\n      });\n\
    \      expect($log.log).not.toHaveBeenCalled();\n    }));\n\n  it('when watching\
    \ by value, should fire when object member updated', inject(function($log) {\n\
    \    spyOn($log, 'log');\n    scope.$apply(function() {\n      scope.$watch('foo',\
    \ function(new_val, old_val) {\n        if (new_val !== old_val) {\n         \
    \ $log.log('foo used to be ' + angular.toJson(old_val) + ' but is now ' + angular.toJson(new_val));\n\
    \        }\n      }, true);\n    });\n\n    scope.$apply(function() {\n      scope['foo'].bar\
    \ = 'spam';\n    });\n    expect($log.log).toHaveBeenCalled();\n  }));\n});\n\
    ```\n\nNote, the calls to `angular.toJson()` here; to output the contents of `foo`\
    \ properly we must convert it to a string, or we will get the old good `[Object\
    \ object]`.\n\nAs this is an expensive operation (determining how exactly expensive\
    \ is up to you and http://jsperf.com), it may be a good idea not to `$watch` huge\
    \ objects or arrays. AngularJS was not designed to handle this gracefully. This\
    \ kind of thing is generally best left up to MS Excel. Find out what you really\
    \ need to be displaying and what you really need to edit in-line, and you will\
    \ see increased performance."
  mdcn: "\n# NP 在指令之外进行 DOM 操作\n\n服务、工厂或提供者可用于 DOM 操作，但如果确实如此，它应该仅承担该功能，以便使单元测试简单明了，并避免代码变得一团糟。创建模态弹出窗口的功能非常适合放在服务中。创建一个新的\"\
    视图\"甚至可以被视为业务逻辑。事实证明，以这种方式使用服务可能比试图将相同的功能强行塞入指令中更为自然。例如，我有一个场景，通过工厂提供一个 `showwarning()`\
    \ 函数来向用户显示警告，警告内容有时通过 HTTP 获取，并在模态窗口中显示（注意，如果不需要在模态窗口中显示，更好的做法是直接在模型中设置警告文本并使用\
    \ `$show` 来显示）。\n\n- **过滤器**：过滤器非常适合在视图中进行字符串或数组操作。在视图之外，你仍然可以使用过滤器，但如果你打算完全在视图之外使用它，最好提供一个工厂函数而非过滤器。\n\
    \n- **指令**：最后，指令用于 DOM 操作或从视图中控制作用域或模型。它永远不会在视图上下文之外使用。当你发现自己试图使用第三方 DOM 操作库时，你就知道需要指令了。不要经不住诱惑在控制器中使用那个复杂的库！编写一个指令来桥接\
    \ AngularJS 和 Library X 之间的差距是值得的。自定义验证最好在指令中处理。你也可以覆盖 AngularJS 的默认指令来改变它们的行为。不想让模型在每次\
    \ `keyDown` 事件时更新？覆盖那个输入指令！我们稍后会给出这方面的示例。指令本质上扩展了 HTML，可以用来为你的一个或多个应用程序创建领域特定语言。\n\
    \n# 总结\n\n以上是构成 AngularJS 应用程序的核心组件。将它们视为构建块。根据你的需求，你可能需要或多或少的组件。\n\n在下一章中，我们将深入探讨模型。它就是数据——而你可能在某处已经有一些了。\n\
    \n## 第 3 章. 深入了解模型\n\n什么是模型？有些框架要求你使用 JavaScript 类或扩展其他基类。JavaScript 的部分美感（我犹豫着说出这个词）在于，如果你不需要类，你就不需要类（传统的面向对象风格的类）。对于\
    \ JavaScript 而言，你真正拥有的是对象。如果你想编写带有原型方法之类内容的类，尽管去做！但你不必这样做。模型可以是一个简单的 JS 对象：`{}`。事实上，模型可以是任何变量、任何对象、任何数据结构；模型*就是*你的数据。其他框架可能有某种你需要扩展的\
    \ Model 类；AngularJS 则不是这样。\n\n# AngularJS 模型\n\n当模型附加到 Scope 对象时就变得有用了。Scope 对象是\
    \ AngularJS 创建的一个特殊对象，它（除了其他功能外）为你的视图提供数据。将模型放入 Scope 对象中可确保 AngularJS 正在观察该模型，并在模型发生变化时采取必要的操作。你可以编写一个控制器，在控制器中你可以有\
    \ `var foo = 'bar';`，但 AngularJS 绝对不会在意你是否将值更改为 'baz'。然而，一旦你这样做：`$scope.foo =\
    \ 'bar';`，你就有了 AngularJS 可以处理的东西。如果你在视图中有 `<div>{{foo}}</div>`，当 `$scope.foo`\
    \ 的值变为 `baz` 时，`<div>` 将会被更新。这当然就是 Angular 的数据绑定。\n\n```\nScope w/ Models\n\n\
    $scope.foo = {}; // plain object\n$scope.bar = new Bar(); // instantiated object\n\
    $scope.baz = []; //plain array\n$scope.bool = true; // some boolean\n$scope.str\
    \ = 'string'; // some string\n$scope.num = 31337; // some number\n```\n\n但如果你想在\
    \ `$scope.foo` 每次变化时执行一些自定义代码呢？是的，你可以通过使用 `$watch` 来实现。在这个 `$watch` 示例中，观察测试中的观测行为：\n\
    \n```\n// note no module here; not necessary for the example\nfunction SomeCtrl($scope,\
    \ $log) {\n    $scope.foo = 'bar';\n    $scope.$watch('foo', function(new_val,\
    \ old_val) {\n        if (new_val !== old_val) {\n            $log.log(\"foo used\
    \ to be '\" + old_val + \"', but is now '\" + new_val + \"'\");\n        }\n \
    \   });\n}\n\ndescribe('SomeCtrl', function () {\n    var scope;\n    beforeEach(inject(function\
    \ ($rootScope) {\n        scope = $rootScope.$new(); // make brand new child scope\
    \ off of root\n    }));\n    describe('the watch on foo', function () {\n    \
    \    it('should fire when foo changes', function () {\n            inject(function\
    \ ($controller, $log) {\n                spyOn($log, 'log');\n               \
    \ scope.$apply(function () {\n                    $controller(SomeCtrl, {\n  \
    \                      $scope: scope,\n                        $log: $log\n  \
    \                  });\n                });\n                expect(scope.foo).toBe('bar');\n\
    \                scope.$apply(\"foo = 'baz'\");\n                expect(scope.foo).toBe('baz');\n\
    \                expect($log.log).toHaveBeenCalled();\n            });\n     \
    \   });\n    });\n});\n```\n\n现在，每当 foo 发生变化，JavaScript 控制台都会通知你。注意 `new_val`\
    \ 和 `old_val` 的比较——当 `foo` 首次被设置时，`$watch` 会自动触发，这通常不是期望的行为（但有时可能是）。因此我们使用了条件判断。\n\
    \n`$watch` 的第一个参数实际上是一个 *AngularJS 表达式*。我们要求 Scope 对象观察某个表达式的值，并在值变化时执行回调函数。当我们将\
    \ foo 附加到 `$scope` 时，我们创造了使用 foo 表达式在该 Scope 上进行求值的机会。由于这可以是任何表达式，我们甚至可以 `$watch`\
    \ 某个任意的布尔值；`foo == 'baz'`；当该条件求值且求值后的值发生变化时，我们将执行回调函数。例如，如果你希望某些代码仅在模型达到特定数值时才触发，这很有用。\n\
    \n现在，你可以 `$watch` 整个对象或数组。看看下面这个不错的模型：\n\n```\n$scope.foo = {\n  bar: 'baz'\n\
    };\n```\n\n即使 `foo.bar` 的值发生变化，`$watch` `foo` 本身也**不会触发**我们的回调函数。为什么？因为默认情况下，`$watch`\
    \ 是按*引用*而非按值工作的。如果你正在观察 `foo`，而 foo 的引用没有改变——当我们更新 `foo.bar` 时引用确实没有改变——`$watch`\
    \ 就不会触发。\n\n幸运的是 AngularJS 提供了实现这类任务的功能。它开销较大，但你可以按值来 `$watch`。只需向 `$watch` 调用传递第三个参数：\n\
    \n```\ndescribe('watches', function() {\n  var scope;\n  beforeEach(inject(function($rootScope)\
    \ {\n    $rootScope = $rootScope.$new();\n    scope = $rootScope.$new();\n   \
    \ scope.$apply(foo = {bar: \"baz\"});\n  }));\n\n  it('when watching by reference,\
    \ should not fire when object member updated',\n    inject(function($log) {\n\
    \      spyOn($log, 'log');\n      scope.$apply(function() {\n        scope.$watch('foo',\
    \ function(new_val, old_val) {\n          $log.log('foo used to be ' + angular.toJson(old_val)\
    \ + ' now it is ' + angular.toJson(new_val));\n        });\n      });\n\n    \
    \  scope.$apply(function() {\n        scope['foo'].bar = 'spam';\n      });\n\
    \      expect($log.log).not.toHaveBeenCalled();\n    }));\n\n  it('when watching\
    \ by value, should fire when object member updated', inject(function($log) {\n\
    \    spyOn($log, 'log');\n    scope.$apply(function() {\n      scope.$watch('foo',\
    \ function(new_val, old_val) {\n        if (new_val !== old_val) {\n         \
    \ $log.log('foo used to be ' + angular.toJson(old_val) + ' but is now ' + angular.toJson(new_val));\n\
    \        }\n      }, true);\n    });\n\n    scope.$apply(function() {\n      scope['foo'].bar\
    \ = 'spam';\n    });\n    expect($log.log).toHaveBeenCalled();\n  }));\n});\n\
    ```\n\n注意这里对 `angular.toJson()` 的调用；要正确输出 `foo` 的内容，我们必须将其转换为字符串，否则会得到那句老话般的 `[Object\
    \ object]`。\n\n由于这是一个开销较大的操作（具体有多大开销取决于你和 http://jsperf.com），不 `$watch` 巨大的对象或数组可能是个好主意。AngularJS\
    \ 并不是为此而优雅设计的。这类事情通常最好交给 MS Excel 来处理。弄清楚你真正需要显示什么、真正需要内联编辑什么，你就能看到性能的提升。\n"
