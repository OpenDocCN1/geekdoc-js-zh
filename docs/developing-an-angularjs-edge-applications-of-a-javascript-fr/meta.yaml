    but it’s a great way to visualize your app as a whole. There are other tools within
    the Batarang, but these two are the ones I find most useful.


    # $log


    AngularJS provides $log, which an alias for window.console by default, unless
    you redefine it. So console.log becomes $log.log. Might save you some keystrokes,
    but you still have to inject the thing. The real power of $log is that you CAN
    redefine it (or any other service or directive in AngularJS for that matter) and
    make it do whatever you want. Want it to pop alerts instead for some bizarre reason?
    You can do that. You can output errors to the HTML if you want. $log is a provider,
    so if you are going to redefine it, be sure to use Module.provider (an example
    of this is below).


    # $exceptionHandler


    By default, AngularJS traps all exceptions coming out of it. That is important
    information to know if you are wondering why window.onerror never gets called.
    What you see when you see AngularJS exceptions (or exceptions in your AngularJS
    code) is simply a call to'
  - "[PAGE 123]\n\n$log.error or something akin to that. Redefine the $exceptionHandler\
    \ class to rethrow errors if you wish to attach behavior to window.onerror, or\
    \ redefine it to do whatever you want. Here's an example that we can use in our\
    \ blog:\n\n```\nblog.provider('$exceptionHandler', function () {\n    this.$get\
    \ = function() {\n        return function(e) {\n            throw e;\n       \
    \ };\n    };\n});\n```\n\nThat's it!"
  - '[PAGE 124]


    # I18n and L10n


    AngularJS provides some utility for localizing your apps. As of this writing it
    supports localization for the datetime, number and currency filters. Of course,
    I''m not sure how much sense the currency filter makes when you have a currency
    like 5.00 and you can choose to display it as $5.00 or €5.00. That''d be great
    if the exchange rates were 1:1!


    In addition to this, one of the directives, ngPluralize (which helps you do stuff
    like display "1 sock" or "2 socks" depending on certain criteria) is localizable.


    The $locale service will provide you with the current locale ID of the browser
    using $locale.id.


    # Conclusion


    You should now have some ideas about practical applications of AngularJS. In the
    next, and final, chapter, we will look at how Angular plays with third party technologies.'
  - '[PAGE 125]


    # # Chapter 10. AngularJS and Third Party Tech


    In a perfect world you’d never have to use jQuery with AngularJS, but since AngularJS
    does not do everything jQuery does, and perhaps most importantly does not have
    a plugin architecture supporting jQuery plugins, you’re probably going to want
    to use it somewhere.


    Want to use that charting library? How about that carousel widget? What about
    something simple in a directive, like selecting some nodes by class? Not in AngularJS,
    but there is jQuery to the rescue.'
  - "[PAGE 126]\n\n# jQuery and AngularJS\n\nWhen working with elements within AngularJS,\
    \ you never get a raw Element object. You always get an object with a jqLite (or\
    \ jQuery, depending) wrapper around it. This is very handy since you are given\
    \ some convenience methods, and can always access the underlying Element object\
    \ anyway:\n\n```\nangular.module('myApp').directive('someInputTagRelatedDirective',\
    \ function() {\n    return function(scope, elm, attrs) {\n        // elm.get(0)\
    \ does not work in jqLite\n        console.log(e[0].getAttribute('type')); //\
    \ this works\n    };\n});\n```\n\nAs mentioned previously, if you want to see\
    \ everything you can do with a jqLite object, look here: [http://docs.angularjs.org/api/angular.element](http://docs.angularjs.org/api/angular.element).\
    \ If this happens to be everything you imagine you could possibly want to do with\
    \ your application, great! You don't need jQuery. You are among the lucky few.\n\
    \nFor the rest of us, note that including jQuery will actually *replace* jqLite.\
    \ That means `angular.element()` becomes an alias for jQuery or `$`. As a best\
    \ practice, it may be a good idea to use `$` or jQuery anyway when you want to\
    \ use non-jqLite functions, since if you forget to include jQuery, it will be\
    \ more immediately obvious why your code is not functioning and why your functions\
    \ are undefined."
- md: " ## AngularUI and uiJq\n\nThe AngularUI project ([http://angular-ui.github.com/](http://angular-ui.github.com/))\
    \ provides many helpful and handy directives, but one in particular is especially\
    \ handy. This is the uiJq directive. It allows you to execute any jQuery function\
    \ that you would execute against a jQuery object by placing that function on the\
    \ DOM node itself. For example:\n\n```\n`<div id=\"foo\" ui-jq=\"hide\">I'm hidden</div>`\n\
    ```\n\nThis will hide the div immediately. To use an animation, you can do this:\n\
    \n```\n`<div id=\"foo\" ui-jq=\"hide\" ui-options=\"{duration: 500}\">I'm hidden</div>`\n\
    ```\n\nThis will hide the div over a period of 500ms. The equivalent in JS would\
    \ be:\n\n```\n`$('#foo').hide({duration: 500});`\n```\n\nAs stated before, you\
    \ can use this directive with *any* jQuery function (that is applied to a jQuery\
    \ object; stuff like [$.map](http://api.jquery.com/jQuery.map/) is not applicable).\
    \ That includes any jQuery plugins you may be using. You can pass any options\
    \ to these functions using the uiOptions attribute object.\n\nThat brings us to\
    \ one of the most popular jQuery plugins out there, Twitter Bootstrap ([http://twitter.github.com/bootstrap/](http://twitter.github.com/bootstrap/)).\n\
    \n## AngularJS and Twitter Bootstrap\n\nBootstrap is a great companion to AngularJS,\
    \ and the two work very well together. It just so happens that you can use virtually\
    \ any Bootstrap function seamlessly with AngularUI and AngularJS. AngularUI has\
    \ a sub-project, called Angular Bootstrap ([https://github.com/angular-ui/bootstrap](https://github.com/angular-ui/bootstrap)),\
    \ that allows you many convenience methods for Bootstrap functionality.\n\nIn\
    \ addition to this, Dean Sofer ([http://deansofer.com/](http://deansofer.com/)),\
    \ one of the architects of AngularUI, has provided many examples of using Bootstrap\
    \ without any extra directives here: [https://gist.github.com/4464334](https://gist.github.com/4464334).\
    \ Either AngularUI's Bootstrap sub-project or Dean's examples will serve you well;\
    \ take a look at both and decide which approach is right for you.\n\nAnother option\
    \ for handling modals is to write a modal *factory*. This allows you to programatically\
    \ launch modal dialogs, return promises, and do all sorts of fun stuff. I find\
    \ this method to be more natural and powerful than using a directive to handle\
    \ these cases. Here's an example, which we'll add to our blog module:\n\n```\n\
    // Modal factory gives you a Modal dialog. Bootstrap required!\nblog.factory('Modal',\
    \ function ($q, $templateCache, $http, $compile) {\n\n\t// sets some properties\
    \ and initializes a deferred to play with.\n\t// scope: Scope object to apply\
    \ to template\n\t// template_id: ID or path of AngularJS template or partial\n\
    \t// options: object full of options to give to Bootstrap's modal() upon open\n\
    \tvar Modal = function (scope, template_id, options) {\n\t\toptions = options\
    \ || {};\n\t\tthis.scope = scope;\n\t\tthis.template_id = template_id;\n\t\tthis.options\
    \ = {};\n\t\tangular.extend(this.options, {show: false}, options);\n\t\tthis.dfrd\
    \ = $q.defer();\n\t};\n\n\t// shows a modal dialog; returns a promise to be resolved\n\
    \t// when the dialog is opened.\n\t// does not check if one is already opened.\n\
    \tModal.prototype.open = function () {\n\t\tvar template, that = this;\n\t\tif\
    \ (this.modal) {\n\t\t\tthis.dfrd = $q.defer();\n\t\t\tthis.modal.modal('show');\n\
    \t\t\tthis.dfrd.resolve();\n\t\t\treturn this.dfrd.promise;\n\t\t}\n\t\ttemplate\
    \ = $templateCache.get(this.template_id);\n\t\t// cache miss\n\t\tif (angular.isUndefined(template))\
    \ {\n\t\t\t$http.get(this.template_id).success(function (data) {\n\t\t\t\ttemplate\
    \ = data;\n\t\t\t\tthat.modal = $compile(template)(that.scope).modal(that.options);\n\
    \t\t\t\tthat.modal.modal('show');\n\t\t\t\tthat.dfrd.resolve();\n\t\t\t}).error(function\
    \ () {\n\t\t\t\tthrow new Error('unable to find template \"' + that.template_id\
    \ + '\" anywhere. maybe template gnomes stole it?');\n\t\t\t});\n\t\t} else {\n\
    \t\t\tthis.modal = $compile(template)(this.scope).modal(this.options);\n\t\t\t\
    this.modal.modal('show');\n\t\t\tthis.dfrd.resolve();\n\t\t}\n\t\treturn that.dfrd.promise;\n\
    \t};\n\n\t// closes a modal dialog. If no dialog exists, tosses an exception.\n\
    \t// does not check to see if the modal is currently open.\n\t Modal.prototype.close\
    \ = function () {\n\t\tif (!this.modal) {\n\t\t\tthrow new Error('unable to close\
    \ an unopened modal');\n\t\t}\n\t\tthis.modal.modal('hide');\n\t};\n\treturn Modal;\n\
    });\n```\n\nLet's work on our markup:\n\n```\n.. snip ..\n<html>\n<meta http-equiv=\"\
    Content-type\" content=\"text/html; charset=utf-8\">\n<title ng-bind-template=\"\
    {{title}}\"></title>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
    \ type=\"text/javascript\"\ncharset=\"utf-8\"></script>\n<script src=\"//netdna.bootstrapcdn.com/twitter-bootstrap/2.2.2/js/bootstrap.min.js\"\
    ></script>\n<link href=\"//netdna.bootstrapcdn.com/twitter-bootstrap/2.2.2/css/bootstrap-combined.min.css\"\
    \ rel=\"stylesheet\">\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.js\"\
    \ type=\"text/javascript\"\ncharset=\"utf-8\"></script>\n<script src=\"blog.js\"\
    \ type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n.. snip ..\n\
    <ng-view></ng-view>\n```\n\n```\n<hr>\n<a ng-click=\"about()\">About</a>\n.. snip\
    \ ..\n<script type=\"text/ng-template\" id=\"about\">\n<div class=\"modal fade\
    \ in\">\n<div class=\"modal-header\">About</div>\n<div class=\"modal-body\">This\
    \ is the blog of John Jacob Jingleheimer Schmidt.</div>\n<div class=\"modal-footer\"\
    >\n<button data-dismiss=\"modal\">Got it</button>\n</div>\n</div>\n</script>\n\
    ..\n```\n\nOK! You can see we've included Bootstrap, its CSS, and made sure jQuery\
    \ was the first thing we grab. You will immediately notice the page no longer\
    \ looks like crap; now it just looks kinda bad. Thanks CSS!\n\n![](img/f95c537c2fc9346a21a144b89cfac580_129_0.png)\n\
    \nNew Post\n\n## Scary Post\n\nAenean nec aliquam libero. Suspendisse lorem magna,\
    \ lobortis eu tincidunt vel, faucibus quis erat\nposted on 11/11/12 8:50 PM by\
    \ Michael Myers\n\nNew Post\n\n## First Post!!!!~11\n\nLorem ipsum dolor sit amet,\
    \ consectetur adipiscing elit. Duis lacinia cursus arcu a pellentesque. Curabitur\
    \ convallis massa faucibus tellus tincidunt et tincidunt augue elementum. Curabitur\
    \ pretium metus gravida augue elementum mollis.\nposted on 11/11/12 8:50 PM by\
    \ Chris Hiller\n\nThe second thing we did was include a `<hr>` at the bottom of\
    \ the page, and a link to call the about() function in ContentCtrl, which is here:\n\
    \n```\nblog.controller('ContentCtrl', function ($scope, Posts, Post, $routeParams,\
    \ Modal, $log) {\n.. snip ..\n// opens an \"About\" modal\n$scope.about = function()\
    \ {\n```\n\n```\nvar modal = new Modal($scope, 'about');\nmodal.open().then(function()\
    \ {\n    $log.log(\"modal opened!\");\n});\n```\n\nAnd the last thing we did was\
    \ create a template called \"about\" which we tell our Modal object to open.\n\
    \n## Unit Testing the Modal Class\n\nLet's show this class works as expected.\n\
    \n```\ndescribe('The Modal Class', function () {\n  var scope, Modal;\n\n  beforeEach(inject(function\
    \ ($rootScope, $injector) {\n    scope = $rootScope.$new();\n    // if you want\
    \ to call something Modal in your local scope,\n    // and the service name happens\
    \ to *be* Modal, you can\n    // just ask the injector service for it.\n    Modal\
    \ = $injector.get('Modal');\n  }));\n\n  describe('the constructor', function\
    \ () {\n    it('should extend the options', function () {\n      var modal = new\
    \ Modal(scope, 'foo', {foo: 'bar'});\n      expect(modal.options).toEqual({show:\
    \ false, foo: 'bar'});\n    });\n    it('should create a deferred', function ()\
    \ {\n      var modal = new Modal(scope, 'foo', {foo: 'bar'});\n      expect(angular.isObject(modal.dfrd.promise)).toBeTruthy();\n\
    \    });\n  });\n\n  describe('the open method', function () {\n    it('should\
    \ throw an error if supplied a bad template id', inject(function ($httpBackend,\
    \ $http, $window) {\n      spyOn($window, 'alert');\n      var modal = new Modal(scope,\
    \ 'foo');\n      $httpBackend.expectGET('foo').respond(404);\n      expect(modal.open()).toThrow();\n\
    \      // apparently you don't need to flush if you respond with an error\n  \
    \  }));\n    it('should get a cached template', inject(function ($templateCache)\
    \ {\n      $templateCache.put('foo', '<div>foo!</div>');\n      var modal = new\
    \ Modal(scope, 'foo');\n      // wasn't sure how to get a spy to return its \"\
    this\"\n      angular.element.prototype.modal = function () {\n        this.called\
    \ = true;\n        return this;\n      };\n      modal.open();\n      expect(modal.modal.called).toBeTruthy();\n\
    \    }));\n    it('should resolve its promise', inject(function ($templateCache)\
    \ {\n      var resolved = false, modal;\n      $templateCache.put('foo', '<div>foo!</div>');\n\
    \      modal = new Modal(scope, 'foo');\n      angular.element.prototype.modal\
    \ = function () {\n        return this;\n      };\n      scope.$apply(function()\
    \ {\n        var promise = modal.open();\n        promise.then(function() {\n\
    \          resolved = true;\n        });\n      });\n      expect(resolved).toBeTruthy();\n\
    \    }));\n    it('should open again if modal exists', inject(function ($templateCache)\
    \ {\n      var modal, resolved = false;\n      $templateCache.put('foo', '<div>foo!</div>');\n\
    \      modal = new Modal(scope, 'foo');\n      angular.element.prototype.modal\
    \ = function () {\n        return this;\n      };\n      scope.$apply(function()\
    \ {\n        modal.open();\n      });\n      scope.$apply(function() {\n     \
    \   modal.open().then(function() {\n          resolved = true;\n        });\n\
    \      });\n      expect(resolved).toBeTruthy();\n    }));\n  });\n\n  describe('the\
    \ close method', function() {\n    it('should throw an error if it cannot find\
    \ a modal', function() {\n      var modal = new Modal();\n      expect(modal.close).toThrow();\n\
    \    });\n    it('should attempt to close the modal', inject(function($templateCache)\
    \ {\n      var modal, resolved = false, command = '';\n      $templateCache.put('foo',\
    \ '<div>foo!</div>');\n      modal = new Modal(scope, 'foo');\n      angular.element.prototype.modal\
    \ = function () {\n        command = arguments[0];\n        return this;\n   \
    \   };\n      scope.$apply(function() {\n        modal.open().then(function()\
