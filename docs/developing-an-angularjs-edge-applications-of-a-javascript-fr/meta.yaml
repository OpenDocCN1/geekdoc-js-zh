    \ once. A promise may be rejected/resolved synchronously (such as with unit tests,\
    \ or in cases where the async operation needn’t be made), but typically it is\
    \ done asynchronously.\n\nWhat do promises buy you? Aside from the guarantees\
    \ they make, they avoid nasty code like this:\n\n```\najaxLib.GET('foo.url', function(response)\
