    \ remove any fancy request transforms\n            // mock $routeParams; assume\
    \ they got set by $route service\n            var $routeParams = {};\n       \
    \     posts = [\n                {id: 1, title: 'foo'},\n                {id:\
    \ 2, title: 'bar'}\n            ];\n            $httpBackend.expectGET('data.json').respond({posts:\
    \ posts});\n            $controller('ContentCtrl', {$scope: scope, Posts: Posts,\n\
    \                Post: Post, $routeParams: $routeParams});\n            $httpBackend.flush();\n\
    \            expect(scope.post).not.toBeDefined();\n            expect(scope.posts[0].title).toBe('bar');\n\
    \            expect(scope.posts[1].title).toBe('foo');\n        });\n    });\n\
    });\n```\n\n在下一章中，我们将更多地讨论在 AngularJS 中使用 jQuery——何时使用，在哪里使用，以及如何使用。这些答案分别是“永远不要”、“任何地方都不要”和“千万别这么做”。遗憾的是，对于除了最简单的\
    \ AngularJS 应用程序之外的所有应用，你可能都会想在某些地方使用它。\n\nAngularJS 提供的另一个极佳的实用功能是 Promise（期约）。我们接下来就讨论这个。\n\
    \n## Promise, Promise\n\n好吧，什么是 Promise？当你拥有一个 Promise 时，你知道会发生两种情况之一：Promise\
    \ 将被 *拒绝（rejected）* 或 *兑现（resolved）*。你可以分别将这两种情况看作“悲剧路径”和“快乐路径”。重要的是要理解，一个 Promise\
    \ 仅且只能被拒绝/兑现一次。Promise 可以同步地被拒绝/兑现（例如在单元测试中，或者在无需异步操作的情况下），但通常它是异步完成的。\n\nPromise\
    \ 能为你带来什么？除了它们提供的保证外，它们还能避免像下面这样糟糕的代码：\n\n```\najaxLib.GET('foo.url', function(response)\
    \ {\n  ajaxLib.GET('bar.url', function(response) {\n    ajaxLib.GET('baz.url',\
    \ function(response) {\n      // .. and so on\n    })\n  })\n})\n```\n\n当你像这样链式调用回调函数时，这被称为“阶梯式”结构，除非你想疯掉，否则你应该避免这样做。Promise\
    \ 可以帮你解决这个问题。你可以这样做：\n\n```\najaxLib.GET('foo.url')\n  .success(function(response)\
    \ { return ajaxLib.GET('bar.url') })\n  .success(function(response) { return ajaxLib.GET('baz.url')\
    \ });\n```\n\n> 什么是 Deferred？\n*它是一个负责向你提供 Promise 并将其拒绝/兑现的对象。*\n\n每个响应的返回值将被传递给链中的下一个\
    \ success 函数。当然，这只是假设性的代码；AngularJS 和 `$q`（Promise/Deferred API）有它们自己的语法，我稍后会介绍。\n\
    \n如果你有异步代码，并且它在完成后执行回调，那么它就是一个适合改为返回 Promise 的候选者。Promise 的实用性和强大之处让许多延续传递风格（CPS）的代码相形见绌。\n\
    \n### AngularJS 中的 Promise\n\nAngularJS 开箱即用地提供了两个使用 Promise 的主要服务：`$http` 和 `$timeout`。两者都返回\
    \ Promise。一个 Promise 将有一个 `then` 方法，它接受两个参数：一个在 Promise 兑现时接收数据的函数，以及一个在 Promise\
    \ 被拒绝时接收数据的函数。在 `$http` 的情况下，除了这些之外，还提供了人们熟悉的 `success` 和 `error` 函数。这些函数不是传递整个响应对象，而是将响应拆分为多个参数。例如：\n\
    \n```\n$http.get('foo.url').success(function(data, status, headers, config) {\
    \ // do stuff })\n  .error(function(data, status, headers, config) { // do other\
    \ stuff });\n```\n\n```\n$http.get('foo.url').then(function(res) { // data, status,\
    \ headers, config in res obj},\n    function(res) { // data, status, headers,\
    \ config in res obj });\n```\n\n需要注意的是，当将 Promise 绑定到作用域（scope）对象时，有一个快捷方式。作用域会“消化”\
    \ Promise！以下这两个语句是等价的：\n\n```\n$scope.foo = $http.get('foo.url');\n$http.get('foo.url').success(function(res)\
    \ {\n    $scope.foo = res;\n});\n```\n\n这可能会为你节省一些时间，但你必须理解，由于 `get()` 是一个异步函数，作用域中\
    \ “foo” 的值会立即变为 `undefined`，然后在调用成功兑现后才被赋值。\n\n然而，对于 `$timeout`，你只能使用 `then()`\
    \ 函数，这已经足够好了。`$timeout` 允许你异步执行任意代码，非常像原生 JavaScript 中的 `setTimeout` 函数。区别在于它返回的是一个\
    \ Promise 而不是一个超时 ID。这里是使用 `setTimeout` 和 `$timeout` 的等效代码：\n\n```\nvar t = $window.setTimeout(function(successFn,\
    \ errorFn) {\n    if (foo) {\n        successFn();\n    } else {\n        $window.clearTimeout(t);\n\
    \        errorFn();\n    }\n}, 1000);\n\nvar p = $timeout(function() {\n    if\
    \ (!foo) {\n        $timeout.cancel(p);\n    }\n}, 1000).then(successFn, errorFn);\n\
    ```\n\n当超时函数在未被取消的情况下成功执行时，Promise 被兑现，且 `successFn` 函数会自动执行。如你所见，这实际上为你节省了一些代码。\n\
    \n默认情况下，`$timeout` 在 digest 循环内部执行。如果你在超时函数中没有修改作用域，可以通过禁用此行为来节省一些 CPU 周期。传递 `false`\
    \ 作为第三个参数，超时函数将不会在 `$apply` 块内部执行。\n\n### Promise 链\n\n正如第一个示例所示，你可以将 Promise\
    \ 链式调用。其模式如下：\n\n```\n$http.get('foo.url')\n    .then(function (res) {\n     \
    \   // do stuff with res\n        if (something) {\n            return $q.reject(first_sad_obj);\n\
    \        }\n        return first_happy_obj;\n    }, function (res) {\n       \
    \ // do other stuff with res\n        return first_sad_obj;\n    })\n    .then(function\
    \ (first_happy_obj) {\n        // do stuff\n        if (something_else) {\n  \
    \          return $q.reject(second_sad_obj);\n        }\n        return second_happy_obj;\n\
    \    }, function (first_sad_obj) {\n        // more stuff to do\n        return\
    \ second_sad_obj;\n    })\n    .then(function (second_happy_obj) {\n        //\
    \ success\n    }, function (second_sad_obj) {\n        // failure. etc.\n    });\n\
    ```\n"
