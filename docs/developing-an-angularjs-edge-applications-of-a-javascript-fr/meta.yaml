    \ {templateUrl: 'post'})\n    .when('/posts', {templateUrl: 'posts'})\n    .otherwise({redirectTo:\
    \ '/posts'});\n});\n```\n\nThe above says when the URL ends with #/posts, load\
    \ all posts. If the URL ends with #/post/1, load the post with ID 1. You can also\
    \ specify a controller (with the `controller` key"
