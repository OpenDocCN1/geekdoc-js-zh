  - '[PAGE 5]


    # Setup


    To get going, you’ll want to get AngularJS from http://www.angularjs.org. At the
    time of this writing, the current stable version is 1.0.5. AngularJS comes in
    stable and unstable branches; the 1.0.x is stable and 1.1.x is unstable. Also
    to help with some examples, you will want to get your paws on jQuery (http://www.jquery.com),
    Jasmine (http://pivotal.github.com/jasmine/), and QUnit (http://www.qunitjs.com)
    if that is how you roll (this is optional). Note, that if you are using Plunker,
    you should probably just use CDN versions of these libraries if they are available
    (instead of uploading the JavaScript files).


    To actually run the unit tests we will be writing, you should get your hands on
    Karma (http://karma-runner.github.io/0.8/index.html). This requires NodeJS (http://node.js.org)
    to run. Furthermore, you will need the AngularJS Mocks module for Jasmine integration
    (http://code.angularjs.org/1.0.5/angular-mocks.js).


    # Karma setup


    Karma doesn’t work out of the box; it needs to know what to test. It uses Chrome
    as its test runner by default, so to keep configuration simple, please have it
    handy.


    +   - Install Node (http://nodejs.org/download). Depending on your system, this
    will be an installer, binary, or source code that you’ll need to compile.

    - Create a project directory. I’m using /Volumes/projects/book.

    - Download AngularJS and AngularJS mocks, as noted above, and put them in this
    directory.

    - Download the book.js and bookSpec.js files from the book’s website, and put
    them in this directory.


    Navigate to your project directory and execute the following:


    ```

    [chiller@overthruster book] npm install -g karma

    ```


    Next, you will execute testacular init, a small script to set up your configuration
    file:


    ```

    [chiller@overthruster ~]$ karma init


    Which testing framework do you want to use ?

    Press tab to list possible options. Enter to move to the next question.

    > jasmine


    Do you want to use Require.js ?

    This will add the Require.js adapter into the files.

    Press tab to list possible options. Enter to move to the next question.

    > no


    Do you want to capture a browser automatically ?

    Press tab to list possible options. Enter empty string to move to the next question.

    > Chrome

    >


