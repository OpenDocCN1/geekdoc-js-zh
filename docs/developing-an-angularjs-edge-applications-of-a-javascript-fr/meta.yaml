    \ functions. Use like you would custom jQuery event handlers, for example.\n\n\
    Here are some examples of Scope functions:\n\n```\n// since \"click\" is actually\
    \ jQuery doing the work, AngularJS doesn't know about it.\n// thus, if we want\
    \ any watchers to fire when we update our scope object, we must\n// use scope.$apply().\n\
    someModule.directive('someDirective', function() {\n  return function(scope, elm)\
    \ {\n    elm.click(function() {\n      scope.$apply(function() {\n        scope.foo\
    \ = 'bar';\n      });\n    });\n  }\n});\n```\n\n```\n// this watch will ONLY\
    \ fire if the object on the scope is reassigned or loses its reference\n$scope.$watch('some_object',\
    \ function(newval, oldval) {\n  if (newval !== oldval) {\n    $scope.someFunction(newval);\n\
    \  }\n});\n```\n\n```\n// this watch will fire if the object on the scope is reassigned\
    \ or loses its reference OR\n// if an object member changes. more expensive\n\
    $scope.$watch('some_object', function(newval, oldval) {\n  if (newval !== oldval)\
    \ {\n    $scope.someFunction(newval);\n  }\n}, true);\n```\n\n```\n// usage: <div\
    \ some-directive=\"bar\"></div>\nsomeModule.directive('someDirective', function()\
    \ {\n  return function(scope, elm, attrs) {\n    // some_object is now the value\
    \ of bar within the current scope\n    var some_object = scope.$eval(attrs.someDirective);\n\
    \  }\n});\n```\n\n```\n// consider this to be in controller Foo; when $broadcast\
    \ is called all subcontrollers\n// will be listening and execute their callback\
    \ functions. it will also listen on all\n// \"anotherEvent\" events coming from\
    \ subcontroller Bar, and any other subcontrollers.\n$scope.$broadcast('someEvent',\
    \ obj1);\n$scope.$on('anotherEvent', function(evt, data) {\n  // do something\
    \ with obj2\n});\n```\n\n```\n// consider this to be in subcontroller Bar\n$scope.$on('someEvent',\
    \ function(evt, data) {\n  // do something with the event object and/or \"obj1\"\
    \n});\n$scope.$emit('anotherEvent', obj2);\n```\n\n```\n// note that if you want\
    \ sibling controllers to respond to a $broadcast, you will\n// need to do this\
    \ in a parent controller.  if one is not present, it may make\n// sense to use\
