- md: "All that the view needs to run a function is for it to be present in the scope.\
    \ If you put it in the root scope, like we have here, that is probably a dumb\
    \ idea (since now basically your entire application will have this `myAlert()`\
    \ function available to it), but for purposes of illustration, there it is. A\
    \ view, a function in a scope, no models, no controllers, no services, no filters,\
    \ and no custom directives.\n\n## Curlies And You\n\nBy now you may be asking\
    \ yourself why some stuff like `{{post.title}}` is wrapped in curlies and post.body\
    \ is not. The general rule is this: any reference to a model or function in your\
    \ view that is *not* part of a directive (custom attribute or tag) will need to\
    \ be wrapped in curly braces, *unless otherwise specified*. For example, `{{post.title}}`\
    \ is in an HTML text node, which is not a directive. The attribute id in the `<div>`\
    \ is also not a directive, though it is an attribute. The call to `ngBindHtmlUnsafe`\
    \ is a directive, and we don't need curly braces there.\n\nA counterexample is\
    \ the `ngHref` directive, which wants curlies. You can read more about the `ngHref`\
    \ directive in the API docs ([http://docs.angularjs.org/api/ng.directive:ngHref](http://docs.angularjs.org/api/ng.directive:ngHref)),\
    \ and why you'd use it, but to insert the value of model bar into our URL, the\
    \ directive looks like:\n\n```\n<a ng-href=\"http://www.foo.{{bar}}.baz\">\n```\n\
    \n## ngBindTemplate\n\nIn the `<title>` tag of our view, we have used the ngBindTemplate\
    \ directive. We could have simply used `<title>{{title}}</title>`, right? Well,\
    \ yes, but. If you did this, you would see, at least temporarily, `{{title}}`\
    \ in your browser’s title bar. We want to avoid that. Using ngBindTemplate, we\
    \ can specify an entire template within the attribute. In this case, our entire\
    \ template is just `{{title}}`. So when AngularJS is done doing its thing, it\
    \ will compile your template and stuff it into the `<title>` tag, and then you\
    \ have a proper title in the title bar without temporary ugliness.\n\nThe temporary\
    \ appearance of double-curlies can be an issue with AngularJS across the board.\
    \ There are ways to avoid it, including the ngCloak directive, which will hide\
    \ the node it’s attached to until after compilation is completed. You can attach\
    \ this to the `<body>` tag if you wish, but if you want to see progressive rendering\
    \ of your page, you are better off assigning it to nodes. Also, the clever use\
    \ of ngShow and ngHide will also prevent these curlies from being briefly seen,\
    \ which is my preferred method.\n\nAnd our `<title>` tag? No ngCloak can be applied\
    \ to a `<head>` tag; it’s just a CSS trick. So our `<title>` tag must use ngBindTemplate\
    \ if it wishes to hide its underwear.\n\n## ngRepeat\n\nThe `ngRepeat` directive\
    \ allows you to loop over an array or object. The array syntax differs from the\
    \ object syntax:\n\n```\nArray: <div ng-repeat=\"number in [1, 2, 3]\">{{number}}</div>\
    \ \nObject: <div ng-repeat=\"(letter, number) in {a: 1, b: 2, c: 3}\">{{letter}}:\
    \ {{number}}</div>\n```\n\nThis is all fine and dandy until you try to loop over\
    \ an array and edit it in place:\n\n```\n<div ng-repeat=\"number in [1, 2, 3]\"\
    >\n  <input type=\"text\" ng-model=\"number\"/>\n</div>\n```\n\nYou'd think what\
    \ would happen here is you would simply be able to edit the members of the array.\
    \ This is not the case. `number` is actually a copy of the member of the array.\
    \ So if you change `number`, AngularJS has no idea what just happened other than\
    \ it knows an array has changed. Well, `ngRepeat` is watching that array, and\
    \ will change its contents if the array changes. Well, the array changed! `ngRepeat`\
    \ now must rerender the template. The consequence is that once you type one character\
    \ into any of the text boxes, you will lose focus because the DOM is being rerendered.\
    \ Yuck!\n\nWhat can we do about this? Very little, unfortunately. As it stands,\
    \ if you want to loop over an array in this manner, you can, but the contents\
    \ of the `ngRepeat` loop should be read only. A workaround is to use a different\
    \ data structure. This, for example, works fine:\n\n```\n<div ng-repeat=\"number\
    \ in [{n: 1}, {n: 2}, {n: 3}]\">\n  <input type=\"text\" ng-model=\"number.n\"\
    />\n</div>\n```\n\nYou are not modifying an array at this point; you are modifying\
    \ an object within the array. So the array itself has not changed, and `ngRepeat`\
    \ does not need to rerender itself. Good advice is to always look for a “dot”\
    \ (.) in the `ng-model`.\n\nIt's generally bad news if your templating language\
    \ is dictating your data structures, but this is a price to pay for excellent\
    \ data-binding functionality.\n\n### ngRepeat's Special Variables\n\nThe `ngRepeat`\
    \ directive in particular has some tasty special variables. While in the context\
    \ of the `ngRepeat` directive, you have access to the following:\n\n- `$index`\
    \ — The current, 0-based index of the `ngRepeat` loop.\n- `$first` — Boolean;\
    \ whether we are at the first item in the loop.\n- `$middle` — Boolean; whether\
    \ we are not at the first or last items in the loop.\n- `$last` — Boolean; whether\
    \ we are at the last item in the loop.\n\n### ngBindHtmlUnsafe\n\nThat's a mouthful.\
    \ What it does is allows HTML to pass through AngularJS without getting escaped.\
    \ By default, AngularJS will escape any HTML before it is rendered in the view.\
    \ If you want to replace the contents of a node with a bunch of actual HTML, then\
    \ use this. But know that it is unsafe unless you either trust your users or have\
    \ otherwise sanitized your data. For our purposes, this is OK, because *we* will\
    \ be writing the blog posts. Comment system? Probably better to not use this directive.\n\
    \n## What's this bold-click thing?\n\nIt's a custom directive. We'll cover that\
    \ later.\n\n## Other Special Variables\n\nWe also have access to this special\
    \ object in the view:\n\n- `$event` — Object containing AngularJS event information.\n\
    \n### Event Bubbling\n\nIf you have an `ngClick` on a node, and another `ngClick`\
    \ on the parent node, chances are any click on that child node will trigger both\
    \ events.\n\nFor example:\n\n```\n<div ng-click=\"foo()\">foo\n  <div ng-click=\"\
    bar()\">bar</div>\n</div>\n```\n\nIf you don’t want `foo()` to get triggered,\
    \ try this instead:\n\n```\n<div ng-click=\"foo()\">foo\n  <div ng-click=\"bar();\
    \ $event.stopPropagation()\">bar</div>\n</div>\n```\n\n### $event is just a jQuery/jqLite\
    \ Event object after all\n\nYou can pass `$event` to any function you are calling\
    \ on your Scope, and that function can inspect the `$event` object for further\
    \ information. Resist the temptation to use this to get at the target DOM node\
    \ and start fiddling around with it. You will want to do DOM manipulation in directives\
    \ or rarely services/factories. Controllers are for business logic. A reasonable\
    \ use of the `$event` object is to inspect keystrokes, for example, and take different\
    \ actions within the controller based on what key was pressed.\n\n### Why Can’t\
    \ I Use JavaScript Function X() In My View?\n\nAngularJS expressions are *not*\
    \ JavaScript. They may look and smell like JavaScript, but they are not JavaScript.\
    \ You cannot execute arbitrary JavaScript from an AngularJS expression, and you\
    \ can’t use certain operators such as `===`. Things like `Math.sqrt()` are not\
    \ available. If you want that stuff, put it in the scope: `$scope.sqrt = Math.sqrt`;\
    \ now you can use the `sqrt()` function in your view via the reference you just\
    \ created.\n\nEvery Scope has a reference to a `$parent` scope (except the root\
    \ scope or `$rootScope`) and a `$root` scope. You can use these in your view.\
    \ But Scope objects prototypically inherit from their parents, so generally you\
    \ will not need to use these unless you have, say, a model with the same name\
    \ as a parent Scope pointing to a different object:\n\n![](img/f95c537c2fc9346a21a144b89cfac580_45_0.png)\n\
    \nHere we have controllers with models in them:\n\n```\nsome_module.controller('MyCtrl',\
    \ ['$scope', function ($scope) {\n    $scope.foo = 'bar';\n}]);\nsome_module.controller('MyOtherCtrl',\
    \ ['$scope', function ($scope) {\n    $scope.foo = 'baz';\n}]);\n```\n\nAnd the\
    \ corresponding view:\n\n```\n<div ng-controller=\"MyCtrl\">\n    <p>{{foo}} (displays\
    \ \"bar\")</p>\n    <div ng-controller=\"MyOtherCtrl\">\n        <p>{{foo}} (displays\
    \ \"baz\")</p>\n        <p>{{$parent.foo}} (displays \"bar\")</p>\n    </div>\n\
    </div>\n```\n\nYou can avoid needing to do this by simply not reusing variable\
    \ names within a Scope hierarchy. Generally speaking, referring to objects using\
    \ `$parent` is not necessary. If you are using primitives, you may have to use\
    \ `$parent` to get what you want. In our example, anything put in the `$scope`\
    \ object of `MyCtrl` will also be in the `$scope` object of `MyOtherCtrl` unless\
    \ you override it.\n\nNext, we'll discuss form controls—widgets in which users\
    \ interact with your application."
  mdcn: "\n视图运行函数所需的唯一条件就是该函数存在于作用域（scope）中。如果我们像这里一样将其放在根作用域中，那可能是一个愚蠢的想法（因为现在基本上你的整个应用程序都可以使用这个\
    \ `myAlert()` 函数），但为了演示目的，我们就这么做了。一个视图，一个作用域中的函数，没有模型，没有控制器，没有服务，没有过滤器，也没有自定义指令。\n\
    \n## 大括号与你\n\n到现在你可能会问自己，为什么像 `{{post.title}}` 这样的内容被包裹在大括号中，而 post.body 则没有。通用规则是：在视图中，任何对模型或函数的引用，只要它*不是*指令（自定义属性或标签）的一部分，就需要用大括号包裹，*除非另有说明*。例如，`{{post.title}}`\
    \ 位于 HTML 文本节点中，它不是一个指令。`<div>` 中的 id 属性虽然是一个属性，但也不是指令。对 `ngBindHtmlUnsafe` 的调用是一个指令，因此那里不需要大括号。\n\
    \n一个反例是 `ngHref` 指令，它需要大括号。你可以在 API 文档 ([http://docs.angularjs.org/api/ng.directive:ngHref](http://docs.angularjs.org/api/ng.directive:ngHref))\
    \ 中阅读更多关于 `ngHref` 指令的信息以及为什么要使用它，但为了将模型 bar 的值插入到我们的 URL 中，该指令如下所示：\n\n```\n\
    <a ng-href=\"http://www.foo.{{bar}}.baz\">\n```\n\n## ngBindTemplate\n\n在视图的 `<title>`\
    \ 标签中，我们使用了 ngBindTemplate 指令。我们本可以直接使用 `<title>{{title}}</title>`，对吧？是的，但是，如果你这样做，你会在浏览器的标题栏中（至少暂时地）看到\
    \ `{{title}}`。我们想要避免这种情况。通过使用 ngBindTemplate，我们可以在属性中指定整个模板。在这种情况下，我们的整个模板就是 `{{title}}`。这样当\
    \ AngularJS 完成其工作后，它会编译你的模板并将其填充到 `<title>` 标签中，然后你在标题栏中就拥有了一个正确的标题，而没有临时出现的丑陋代码。\n\
    \n双大括号的临时出现是 AngularJS 全局性的一个问题。有几种方法可以避免它，包括 ngCloak 指令，它会隐藏所附加的节点，直到编译完成后才显示。如果你愿意，可以将此指令附加到\
    \ `<body>` 标签上，但如果你想看到页面的渐进式渲染，最好将其分配给具体节点。此外，巧妙地使用 ngShow 和 ngHide 也可以防止这些大括号被短暂看到，这是我更倾向的方法。\n\
    \n那么我们的 `<title>` 标签呢？ngCloak 不能应用于 `<head>` 标签；它仅仅是一个 CSS 技巧。所以我们的 `<title>`\
    \ 标签必须使用 ngBindTemplate 才能隐藏其“内衣”。\n\n## ngRepeat\n\n`ngRepeat` 指令允许你循环遍历数组或对象。数组语法与对象语法不同：\n\
    \n```\nArray: <div ng-repeat=\"number in [1, 2, 3]\">{{number}}</div> \nObject:\
    \ <div ng-repeat=\"(letter, number) in {a: 1, b: 2, c: 3}\">{{letter}}: {{number}}</div>\n\
    ```\n\n这一切都很好，直到你尝试循环遍历一个数组并在原处编辑它：\n\n```\n<div ng-repeat=\"number in [1, 2,\
    \ 3]\">\n  <input type=\"text\" ng-model=\"number\"/>\n</div>\n```\n\n你可能会认为这里发生的情况是你能够简单地编辑数组的成员。事实并非如此。`number`\
    \ 实际上是数组成员的一个副本。因此，如果你更改了 `number`，AngularJS 除了知道一个数组发生了变化之外，并不知道具体发生了什么。而 `ngRepeat`\
    \ 正在监视该数组，如果数组发生变化，它将更改其内容。结果就是数组变了！`ngRepeat` 现在必须重新渲染模板。后果是，一旦你在任何文本框中输入一个字符，你就会失去焦点，因为\
    \ DOM 正在被重新渲染。真糟糕！\n\n对此我们能做什么？不幸的是，能做的很少。就目前而言，如果你想以这种方式循环遍历数组，你可以这样做，但 `ngRepeat`\
    \ 循环的内容应该是只读的。一个解决方法是使用不同的数据结构。例如，这样运行良好：\n\n```\n<div ng-repeat=\"number in [{n:\
    \ 1}, {n: 2}, {n: 3}]\">\n  <input type=\"text\" ng-model=\"number.n\"/>\n</div>\n\
    ```\n\n此时你不是在修改数组，而是在修改数组中的一个对象。因此数组本身没有改变，`ngRepeat` 不需要重新渲染自身。一个好的建议是在 `ng-model`\
    \ 中始终寻找一个“点” (.)。\n\n如果你的模板语言在决定你的数据结构，这通常是个坏消息，但为了获得卓越的数据绑定功能，这是必须付出的代价。\n\n\
    ### ngRepeat 的特殊变量\n\n`ngRepeat` 指令特别有一些好用的特殊变量。在 `ngRepeat` 指令的上下文中，你可以访问以下变量：\n\
    \n- `$index` — `ngRepeat` 循环的当前索引（从 0 开始）。\n- `$first` — 布尔值；是否为循环中的第一个项目。\n-\
    \ `$middle` — 布尔值；是否不在循环的第一个或最后一个项目。\n- `$last` — 布尔值；是否为循环中的最后一个项目。\n\n### ngBindHtmlUnsafe\n\
    \n这个名字真绕口。它的作用是允许 HTML 在不被转义的情况下通过 AngularJS。默认情况下，AngularJS 在视图中渲染任何 HTML 之前都会对其进行转义。如果你想用一堆实际的\
    \ HTML 替换一个节点的内容，请使用此指令。但请记住，除非你信任你的用户或已经对数据进行了清理，否则它是不安全的。对于我们的目的，这是没问题的，因为博文将由*我们*来编写。如果是评论系统？最好不要使用这个指令。\n\
    \n## 这个 bold-click 是什么？\n\n这是一个自定义指令。我们稍后会讨论。\n\n## 其他特殊变量\n\n我们还可以访问视图中的这个特殊对象：\n\
    \n- `$event` — 包含 AngularJS 事件信息的对象。\n\n### 事件冒泡\n\n如果你在一个节点上设置了 `ngClick`，并在父节点上设置了另一个\
    \ `ngClick`，那么点击该子节点很有可能会触发这两个事件。\n\n例如：\n\n```\n<div ng-click=\"foo()\">foo\n\
    \  <div ng-click=\"bar()\">bar</div>\n</div>\n```\n\n如果你不希望触发 `foo()`，请尝试这样做：\n\
    \n```\n<div ng-click=\"foo()\">foo\n  <div ng-click=\"bar(); $event.stopPropagation()\"\
    >bar</div>\n</div>\n```\n\n### $event 终究只是一个 jQuery/jqLite 事件对象\n\n你可以将 `$event`\
    \ 传递给 Scope 上调用的任何函数，该函数可以检查 `$event` 对象以获取更多信息。请抵制使用它来获取目标 DOM 节点并开始对其进行摆弄的诱惑。你应该在指令中，或者极少数情况下在服务/工厂中进行\
    \ DOM 操作。控制器是用于业务逻辑的。`$event` 对象的一个合理用途是检查击键（例如），并根据按下的键在控制器中采取不同的操作。\n\n### 为什么我不能在视图中使用\
    \ JavaScript 函数 X()？\n\nAngularJS 表达式*不是* JavaScript。它们看起来和闻起来像 JavaScript，但它们不是。你不能从\
    \ AngularJS 表达式中执行任意的 JavaScript，也不能使用某些运算符，如 `===`。像 `Math.sqrt()` 这样的函数是不可用的。如果你需要这些功能，请将其放入作用域中：`$scope.sqrt\
    \ = Math.sqrt`; 现在你可以通过刚才创建的引用在视图中使用 `sqrt()` 函数。\n\n每个 Scope 都有一个对 `$parent`\
    \ 作用域（根作用域或 `$rootScope` 除外）和一个 `$root` 作用域的引用。你可以在视图中使用它们。但 Scope 对象从其父级原形继承，因此通常你不需要使用这些，除非你有一个与父级\
    \ Scope 同名但指向不同对象的模型：\n\n![](img/f95c537c2fc9346a21a144b89cfac580_45_0.png)\n\n\
    这里我们有包含模型的控制器：\n\n```\nsome_module.controller('MyCtrl', ['$scope', function ($scope)\
    \ {\n    $scope.foo = 'bar';\n}]);\nsome_module.controller('MyOtherCtrl', ['$scope',\
    \ function ($scope) {\n    $scope.foo = 'baz';\n}]);\n```\n\n以及相应的视图：\n\n```\n\
    <div ng-controller=\"MyCtrl\">\n    <p>{{foo}} (显示 \"bar\")</p>\n    <div ng-controller=\"\
    MyOtherCtrl\">\n        <p>{{foo}} (显示 \"baz\")</p>\n        <p>{{$parent.foo}}\
    \ (显示 \"bar\")</p>\n    </div>\n</div>\n```\n\n你只需在 Scope 层级结构中不重复使用变量名，就可以避免这样做。一般来说，使用\
    \ `$parent` 引用对象是不必要的。如果你使用的是原始类型，可能必须使用 `$parent` 来获取你想要的内容。在我们的示例中，除非你覆盖它，否则放入\
    \ `MyCtrl` 的 `$scope` 对象中的任何内容也会出现在 `MyOtherCtrl` 的 `$scope` 对象中。\n\n接下来，我们将讨论表单控件——用户与你的应用程序交互的小部件。\n"
