  mdcn: "\n ## AngularUI 和 uiJq\n\nAngularUI 项目 ([http://angular-ui.github.com/](http://angular-ui.github.com/))\
    \ 提供了许多非常有帮助且便捷的指令，但其中一个格外实用，那就是 uiJq 指令。它允许你通过将 jQuery 函数直接放置在 DOM 节点上，来执行任何原本需要针对\
    \ jQuery 对象执行的 jQuery 函数。例如：\n\n```\n`<div id=\"foo\" ui-jq=\"hide\">I'm hidden</div>`\n\
    ```\n\n这将立即隐藏该 div。若要使用动画，可以这样做：\n\n```\n`<div id=\"foo\" ui-jq=\"hide\" ui-options=\"\
    {duration: 500}\">I'm hidden</div>`\n```\n\n这将使 div 在 500 毫秒内逐渐隐藏。对应的 JS 代码为：\n\
    \n```\n`$('#foo').hide({duration: 500});`\n```\n\n如前所述，你可以将此指令与 *任何* jQuery 函数（只要是应用于\
    \ jQuery 对象的函数；像 [$.map](http://api.jquery.com/jQuery.map/) 这样的函数则不适用）配合使用。这包括你可能正在使用的任何\
    \ jQuery 插件。你可以使用 `uiOptions` 属性对象向这些函数传递任何选项。\n\n这就把我们引向了目前最受欢迎的 jQuery 插件之一：Twitter\
    \ Bootstrap ([http://twitter.github.com/bootstrap/](http://twitter.github.com/bootstrap/))。\n\
    \n## AngularJS 和 Twitter Bootstrap\n\nBootstrap 是 AngularJS 的绝佳伴侣，两者配合得非常好。恰巧的是，你几乎可以将任何\
    \ Bootstrap 函数通过 AngularUI 和 AngularJS 无缝使用。AngularUI 有一个名为 Angular Bootstrap\
    \ ([https://github.com/angular-ui/bootstrap](https://github.com/angular-ui/bootstrap))\
    \ 的子项目，它为 Bootstrap 功能提供了许多便捷方法。\n\n除此之外，AngularUI 的架构师之一 Dean Sofer ([http://deansofer.com/](http://deansofer.com/))\
    \ 在这里提供了许多无需额外指令即可使用 Bootstrap 的示例：[https://gist.github.com/4464334](https://gist.github.com/4464334)。无论是使用\
    \ AngularUI 的 Bootstrap 子项目还是 Dean 的示例，都能很好地满足你的需求；建议两者都看看，然后决定哪种方法适合你。\n\n处理模态框（modals）的另一种选择是编写一个模态框\
    \ *工厂（factory）*。这允许你通过编程方式启动模态对话框、返回 Promise 并实现各种有趣的功能。我发现这种方法比使用指令来处理这些情况更加自然且强大。这是一个示例，我们将把它添加到我们的博客模块中：\n\
    \n```\n// Modal factory gives you a Modal dialog. Bootstrap required!\nblog.factory('Modal',\
    \ function ($q, $templateCache, $http, $compile) {\n\n\t// sets some properties\
    \ and initializes a deferred to play with.\n\t// scope: Scope object to apply\
    \ to template\n\t// template_id: ID or path of AngularJS template or partial\n\
    \t// options: object full of options to give to Bootstrap's modal() upon open\n\
    \tvar Modal = function (scope, template_id, options) {\n\t\toptions = options\
    \ || {};\n\t\tthis.scope = scope;\n\t\tthis.template_id = template_id;\n\t\tthis.options\
    \ = {};\n\t\tangular.extend(this.options, {show: false}, options);\n\t\tthis.dfrd\
    \ = $q.defer();\n\t};\n\n\t// shows a modal dialog; returns a promise to be resolved\n\
