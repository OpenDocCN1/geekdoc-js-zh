  md: "![](img/f95c537c2fc9346a21a144b89cfac580_99_0.png)\n\nThe above is obviously\
    \ a drawing of a bag full of male and female dinosaur eggs.\nFilters can accept\
    \ any type of parameter, but most commonly they are used on strings and\narrays.\
    \ This example above works on strings (numbers, even), but we can just as easily\n\
    modify an array with one:\n\n```\nsome_module.filter('myArrayTakingFilter', function()\
