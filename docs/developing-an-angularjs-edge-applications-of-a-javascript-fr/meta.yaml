  md: "# # Custom Headers\n\nIf you need every HTTP request to send a custom header\
    \ to the server, you do not have to pass the headers object to each call to `$http`;\
    \ instead, we can configure the `$httpBackend` to do this automatically during\
    \ the system’s initialization phase.\",\n.\n\nSay our blog service needs an X-Blog-Version\
    \ header sent with each request, or different things depending if the request\
    \ is a GET or POST. This is how to set that up:\n\n```\n// configure $http to\
    \ always pass these headers\n\nblog.config(function($httpProvider) {\n    $httpProvider.defaults.headers.common['X-Blog-Version']\
    \ = '1.0';\n    $httpProvider.defaults.headers.post['X-I-Am-A-POST-Request'] =\
    \ true;\n    $httpProvider.defaults.headers.get['X-I-Am-A-GET-Request'] = true;\n\
    });\n```\n\nNote that in the `config` function you will inject a `$httpProvider`.\
    \ This essentially allows you to pre-configure the `$http` service before using\
    \ it. For more information, consult the *Services* chapter.\n\nIf you need to\
    \ change the default headers on-the-fly, the `$http` module allows you to monkey\
    \ with them the same way:\n\n```\nblog.run(function($http) {\n    $http.defaults.headers.common['X-Blog-Version']\
    \ = '1.0';\n    // etc\n});\n```\n\nUse the first example if you are sure all\
    \ your HTTP requests will need a particular header; only use the second if you\
    \ absolutely have to."
  merge: -1
