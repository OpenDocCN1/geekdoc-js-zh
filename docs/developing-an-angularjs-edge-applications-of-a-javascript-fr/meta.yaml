    \ and some special directives that you'd use if you wanted certain behaviors;\
    \ specifically custom form validation.\n\nOur blog has a custom directive called\
    \ `boldClick`, which toggles a bold font weight to the HTML element the directive\
    \ is used on, upon click. Here is an example of handling this with a directive:\n\
    \n```\nblog.directive('boldClick', function() {\n  return function(scope, element)\
    \ {\n    var bold = false;\n    element.click(function() {\n      if (bold) {\n\
    \        element.css('font-weight', 'normal');\n      } else {\n        element.css('font-weight',\
    \ 'bold');\n      }\n      bold = !bold;\n    });\n  };\n});\n```\n\nAnd in the\
    \ view, it looks like this:\n\n```\nMy pet is a <span bold-click>tortoise</span>.\n\
    ```\n\nLet's approach this line by line.\n\n+   - First off, we name our directive\
    \ `boldClick`. This is the common name for the directive, but when using it in\
    \ a view we have many different options, as discussed earlier (using any of them,\
    \ such as bold-click, will automatically be camelCased). A directive is a function\
    \ that returns an object (and in some simple cases, just a function).\n- In our\
    \ object, we have two keys: restrict and link. restrict tells AngularJS *how*\
    \ the directive can be used. This value can be nothing, E (element), A (attribute),\
    \ C (class) or M (comment). If omitted, it defaults to A, which means you can\
    \ remove it from your directive definition. If specified, AngularJS will throw\
    \ an error if you try to use your directive in an unintended way.\n- link defines\
    \ a *linking* function. Nine times out of ten, your directive will have a link,\
    \ as it is the most common situation. A linking function is passed a Scope object\
    \ (likely from whatever scope it's within inside your view; think the closest\
    \ parent controller's scope), an element (the directive's element itself; this\
    \ is a jqLite or jQuery object), and an attribute object representing all of the\
    \ attributes of the element. Optionally it is passed a controller instance.\n\n\
    # ## jqLite?\n\n*jqLite is what you get to work with when you haven't included\
    \ jQuery. If you have included*"
  - '[PAGE 69]


    jQuery, don''t worry about jqLite, as Angular will use that instead. It is a library
    that is a subset of the jQuery library, so it has limited functionality. What
    it can do is discussed in the documentation for angular.element: http://docs.angularjs.org/api/angular.element.
    Importantly, jqLite does not use jQuery selectors. If you need selectors, you
    will need jQuery proper.


    The linking function gets executed by AngularJS during HTML compilation when scopes
    become available. This is in contrast to the compile function, which is executed
    before scopes become available, which we will touch on later. This linking function
    is where we want to put our directive''s logic.


    ![](img/f95c537c2fc9346a21a144b89cfac580_69_0.png)


    This particular directive simply binds a click event to the element, and changes
    the appearance of that element with the `css()` function. Clicking the post body
    will change the text from normal weight to bold, and vice-versa.


    That''s a simple attribute-based directive. Let''s write trivial examples of the
