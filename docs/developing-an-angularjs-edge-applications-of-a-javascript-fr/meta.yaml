  md: '# ngBindTemplate


    In the `<title>` tag of our view, we have used the ngBindTemplate directive. We
    could have simply used `<title>{{title}}</title>`, right? Well, yes, but. If you
    did this, you would see, at least temporarily, `{{title}}` in your browser’s title
    bar. We want to avoid that. Using ngBindTemplate, we can specify an entire template
    within the attribute. In this case, our entire template is just `{{title}}`. So
    when AngularJS is done doing its thing, it will compile your template and stuff
    it into the `<title>` tag, and then you have a proper title in the title bar without
    temporary ugliness.


    The temporary appearance of double-curlies can be an issue with AngularJS across
    the board. There are ways to avoid it, including the ngCloak directive, which
    will hide the node it’s attached to until after compilation is completed. You
    can attach this to the `<body>` tag if you wish, but if you want to see progressive
    rendering of your page, you are better off assigning it to nodes. Also, the clever
    use of ngShow and ngHide will also prevent these curlies from being briefly seen,
    which is my preferred method.


    And our `<title>` tag? No ngCloak can be applied to a `<head>` tag; it’s just
    a CSS trick. So our `<title>` tag must use ngBindTemplate if it wishes to hide
    its underwear.'
