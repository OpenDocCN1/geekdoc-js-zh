    ```\n\n## Digest already in progress?\n\n如果你看到这个 JavaScript 错误，这意味着 AngularJS\
    \ 正在尝试求值表达式。最常见的解决方案是移除你对 `$apply` 的调用，因为它可能不是必需的。有时这并不奏效；然而，因为如果你移除了 `$apply`，你的\
    \ watch 并不总是会触发。通常我见过这种情况发生在同一个函数从 AngularJS 上下文中同步执行，同时又在 AngularJS 上下文之外异步执行时（比如使用\
    \ setTimeout 之类的情况）。在这种情况下，你必须确保函数本身不包含 `$apply`，而是在适当时将每个函数调用包装在 `$apply` 中。\n\
    \n## 关于单元测试的说明\n\n本书接下来的示例将包含使用 Jasmine 编写的单元测试（[http://pivotal.github.com/jasmine/](http://pivotal.github.com/jasmine/)）。Jasmine\
    \ 是一个 BDD（行为驱动开发）风格的测试框架，用 JavaScript 编写，用于测试 JavaScript。如果你不熟悉 BDD，没关系——你不需要了解任何关于它的知识就可以开始使用\
    \ Jasmine。语法看起来会有点奇怪，但很快就会理解。\n\n![](img/f95c537c2fc9346a21a144b89cfac580_28_0.png)\n\
    \n### BDD？我才刚刚掌握 TDD！\n\n虽然 TDD（测试驱动开发）只是一种实践——简而言之，先写测试——但 BDD 远不止于此。它是一种不同的软件开发方法。两者之间的主要区别在于，BDD\
    \ 测试本质上可以由测试人员甚至最终用户来编写。当你在规范中确定业务逻辑时，你可以写下\"当 y 发生时，x 应该发生\"，并直接将其转换为 BDD 风格测试框架中的测试。我没有读过任何关于\
    \ BDD 的书籍，因此无法推荐一本，但如果你感兴趣，建议你进一步探索。记住，你不需要\"订阅\"BDD 就能使用 Jasmine 进行测试；它作为一个通用的单元测试框架同样表现出色。\n\
    \n我们还将假设在进行这些测试时包含了 angular-mocks.js 文件，因为它为 Jasmine 与 AngularJS 协作提供了一些便捷的方法。\n\
    \nAngularJS 在其在线教程中提供了功能测试（或 E2E 测试）。虽然这些测试很有价值，但我们的应用规模较小，可以通过手动测试来完成。一旦你的应用成长起来，自动化功能测试会更合理，但对我们来说没有必要。\n\
    \n## 组件\n\n我们有模型、视图、控制器、服务/工厂/提供者、过滤器和指令。所有这些组件将构成一个模块。模块可以是一个完整的应用、应用的一部分，或者一组可复用的组件。例如，在一个两页的应用中，你可能有一个模块提供两个页面之间的通用功能，以及每个页面本身的模块。在定义每个页面的模块时，你会包含\"\
    通用\"模块。如果你有其他应用，你可能希望将通用功能拆分到另一个模块中，供所有应用使用。\n\n- **Models**：引用模型最合理的地方通常是在控制器中。如果你有互不相干且不共享共同父作用域的控制器（当然，除了根作用域），你可能希望在服务中引用你的模型，因为服务是一个单例，所有组件都可以注入它。\n\
    - **Views**：视图是你的标记。任何使用过 JavaScript 模板语言，甚至是服务器端模板语言的人，都会在视图中感到得心应手。它包含简单的逻辑语句和其他绑定的数据（通常是模型），并使用指令和过滤器。当你在视图中引用模型时，通常是在某个控制器的作用域中。\n\
    - **Controllers**：控制器存在于应用作用域的某个位置。它有自己的作用域，任何子控制器都会原型继承该作用域。在父控制器中声明一个两个或更多子控制器都会使用的函数是极为有用的。控制器用于引用模型和业务逻辑。然而，DOM\
    \ 操作不属于控制器。这一点需要反复强调和明确：在我的书中，\"DOM 操作\"是指任何修改现有 DOM 结构的代码。如果你让控制器远离 DOM 操作，你将拥有更干净、易于测试的代码。相信这一点。\n\
    - **Services**：服务是一个可注入的单例。一组与共同概念相关的函数，或者一个静态的类式对象，作为服务都非常合适。例如，一个服务可以提供调用若干服务器端\
    \ API 的函数。你不需要该服务的另一个实例。服务不返回任何东西。\n- **Factories**：工厂是可注入的，但可以返回一个函数、对象，甚至是一个原始值（我还没见过这样做的用例，但它确实存在）。如果你有一个希望让控制器使用的\
    \ JavaScript\"类\"，这里是一个很好的放置位置。如果你有一个工具函数但不想污染命名空间，把它放在工厂里。也许你想返回一个充满各种内容的新对象实例——把它放在工厂里。\n\
    - **Providers**：提供者就像生成工厂的服务，如果这样说能明白的话。在初始化期间，你可以配置一个提供者，使其在应用加载后以某种方式运行。`$http`\
    \ 服务实际上就是一个提供者，如果你愿意，可以在初始化期间配置其默认值。提供者不返回任何东西，但定义了 `this.$get()`；一个返回类似工厂对象的函数。当你定义提供者\
    \ `Foo` 时，你实际上是在定义 `FooProvider`；从 `this.$get` 返回的东西才是真正的 `Foo`。\n\n"
