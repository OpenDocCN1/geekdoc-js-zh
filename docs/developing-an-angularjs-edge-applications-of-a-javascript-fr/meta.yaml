  md: "# Element-Type Directive\n\nHere’s an example of using an element directive:\n\
    \n```\n// This directive replaces <new-post-area> with the template below\n//\
    \ it links the post, cancel and save attribs to the parent scope,\n// but it copies\
    \ cancelText and saveText verbatim.\nblog.directive('newPostArea', function()\
    \ {\n    return {\n        restrict: 'E',\n        scope: {\n            post:\
    \ '=',\n            cancel: '=',\n            save: '=',\n            cancelText:\
    \ '@',\n            saveText: '@'\n        },\n        replace: true,\n      \
    \  template: '<div ng-show=\"post\">' +\n                  '<input type=\"text\"\
    \ ng-model=\"post.temp.title\"/><br/>' +\n                  '<textarea ng-model=\"\
    post.temp.body\"></textarea><br/>' +\n                  '<button ng-click=\"cancel(post)\"\
    >{{cancelText}}</button>' +\n                  '<button ng-click=\"save(post)\"\
    >{{saveText}}</button></div>'\n    };\n});\n```\n\nUsage:\n\n```\n<new-post-area\
    \ post=\"new_post\" cancel-text=\"Cancel\" cancel=\"cancel\" save-text=\"Save\"\
    \ save=\"save\"></new-post-area>\n```\n\nOutput as reported by Chrome, anyway:\n\
    \n```\n<div ng-show=\"post\" post=\"new_post\" cancel=\"cancel\" save=\"save\"\
    \ style=\"\">\n    <input type=\"text\" ng-model=\"post.temp.title\" class=\"\
    ng-valid ng-dirty\"><br>\n    <textarea ng-model=\"post.temp.body\" class=\"ng-valid\
    \ ng-dirty\"></textarea><br>\n    <button ng-click=\"cancel(post)\">Cancel</button><button\
    \ ng-click=\"save(post)\">Save</button>\n</div>\n```\n\nThe resulting HTML works\
    \ by binding scope properties. We have a property in our scope, new_post, where\
    \ we store new post information. We give the directive that, and bind it to the\
    \ directive’s scope using the scope key. Normally directives do not create their\
    \ own scope, but this one does. In fact, it creates something called an isolate\
    \ scope which does not prototypically inherit from its parent. We declare explicitly\
    \ what ends up in the scope via the definition object. The scope definition object\
    \ (the “scope: ..” bit) is completely opaque and requires discussion. Later."
