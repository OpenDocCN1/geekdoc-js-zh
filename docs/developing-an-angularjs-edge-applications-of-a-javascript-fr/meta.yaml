    \    restrict: 'E',\n    scope: {expression: '=>val'},\n    template: '<div class=\"\
    debug-container\"><button ng-click=\"toggle\">toggle</button> <div>{{debug.expression}}</div>/div></div>',\n\
    \    require: 'debugZone',\n    link: function (scope, elm, attrs, debug) {\n\
    \      scope.debug = debug.debug;\n      scope.toggle = debug.toggle;\n    }\n\
    \  };\n});\n```\n\nAnd before we get any further, the markup looks like this:\n\
    \n```\n<debug:zone>\n  <preformatted-debug val=\"posts\"></preformatted-debug>\n\
    \  <loose-debug val=\"posts\"></loose-debug>\n</debug:zone>\n```\n\nNote the caret\
    \ (^) within the require property. This says “you can look in the parent scope\
    \ for the directive you are requiring.” Since these dudes have isolate scopes,\
    \ they need to"
