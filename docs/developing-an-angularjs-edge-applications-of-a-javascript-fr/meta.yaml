    By default, AngularJS escapes all HTML rendered to a template. Generally, this\
    \ saves you from yourself if your data needs to be scrubbed. If you trust your\
    \ source, you can have AngularJS render HTML verbatim using the `ngBindHtmlUnsafe`\
    \ directive:\n\n```\n<div ng-bind-unsafe=\"some_html\"></div>\n```\n\n## Under\
    \ the Hood\n\nCompilation in AngularJS is a two-step process. Consider the $compile\
    \ service, and a raw, unprocessed AngularJS template named template:\n\n```\n\
    var linker = $compile(template);\n```\n\nThe above represents the first phase\
    \ of the compilation process; the \"compile\" step (confusing, I know). What happens\
