  md: '# # The Controller


    MainCtrl is our controller. As discussed in The View chapter, it has control of
    the entire page, since it''s attached to the <body> tag. OK, that''s great, but
    what is $scope, what is Posts, and more importantly, where do they come from?
    The short answer is that $scope is a Scope object and Posts is a service, and
    they arrive in your controller via dependency injection. The long answer is that
    this is dependency injection (DI) at work. Dependency injection is a core concept
    of AngularJS and aids unit testing and code organization. Components arriving
    in a function via DI are either included components of AngularJS, or custom components
    you write yourself.


    So what are we doing here? When the controller is initialized, we execute the
    getPosts() function in the Posts service, wait for its success, put its response
    into our $scope object, and perform some post-processing on said response. The
    getPosts() function returns a promise. If you are familiar with jQuery.Deferred()
    or Kristopher Kowal''s q, then you understand promises. We''ll go into promises
    in detail later. For now, know that getPosts() returns a promise, and at some
    point it will be resolved, and when it is, the success callback is executed:


    ![](img/f95c537c2fc9346a21a144b89cfac580_18_0.png)


    We can see that in this controller we''re assigning a value to $scope.posts. When
    we do this, the view is alerted and the expressions involving posts are (re-)evaluated.
    This is an example of data binding. A portion of a view is data-bound to a model,
    and when either one changes, they are both synchronized.


    Note: Initially when AngularJS loads, the value of $scope.posts (and thus posts
    in the view) is undefined. It is only set after our call to getPosts() succeeds!
    Remember this when you'
  merge: -1
  pgno: 18
