    \     posts = [\n                {id: 1, title: 'foo'},\n                {id:\
    \ 2, title: 'bar'}\n            ];\n            $httpBackend.expectGET('data.json').respond({posts:\
    \ posts});\n            $controller('ContentCtrl', {$scope: scope, Posts: Posts,\n\
    \                Post: Post, $routeParams: $routeParams});\n            $httpBackend.flush();\n\
    \            expect(scope.post).not.toBeDefined();\n            expect(scope.posts[0].title).toBe('bar');\n\
    \            expect(scope.posts[1].title).toBe('foo');\n        });\n    });\n\
    });\n```\n\nIn the next chapter, we’ll talk a bit more about using jQuery with\
    \ AngularJS—when to use it, where to use it, and how to use it. These answers\
    \ are “never”, “nowhere” and “just don’t”, respectively. Unfortunately for everything\
    \ but the simplest application written in AngularJS, you’re probably going to\
    \ want to use it somewhere.\n\nAnother excellent utility AngularJS provides is\
    \ promises. We’ll discuss that next.\n\n## Promises, Promises\n\nOK, what’s a\
    \ promise? When you have a promise, you know that one of two things will happen:\
    \ the promise will be *rejected* or *resolved*. Think of this as the sad path\
    \ and the happy path, respectively. It’s important to understand that a promise\
    \ is rejected/resolved once and only once. A promise may be rejected/resolved\
    \ synchronously (such as with unit tests, or in cases where the async operation\
    \ needn’t be made), but typically it is done asynchronously.\n\nWhat do promises\
    \ buy you? Aside from the guarantees they make, they avoid nasty code like this:\n\
    \n```\najaxLib.GET('foo.url', function(response) {\n  ajaxLib.GET('bar.url', function(response)\
    \ {\n    ajaxLib.GET('baz.url', function(response) {\n      // .. and so on\n\
    \    })\n  })\n})\n```\n\nWhen you chain callbacks like this, it’s called stair-stepping,\
    \ and unless you want to go crazy, you should avoid this. Promises help you do\
    \ that. You can do this:\n\n```\najaxLib.GET('foo.url')\n  .success(function(response)\
    \ { return ajaxLib.GET('bar.url') })\n  .success(function(response) { return ajaxLib.GET('baz.url')\
    \ });\n```\n\n> What’s a deferred?\n*It is an object responsible for giving you\
    \ a promise and rejecting/resolving it.*\n\nThe return value of each response\
    \ will be passed to the next success function in the chain. Of course this is\
    \ just hypothetical code; AngularJS and $q (the promise/deferred API) have their\
    \ own syntax which I’ll cover shortly.\n\nIf you have asynchronous code, and it\
    \ executes a callback upon completion, it’s a candidate to return a promise instead.\
    \ The utility and power of promises blows a lot of continuation-passing style\
    \ (CPS) code out of the water.\n\n### Promises in AngularJS\n\nAngularJS features\
    \ two major services out-of-the-box that use promises: `$http` and `$timeout`.\
    \ Both return promises. A promise will have a then method, which accepts two parameters:\
    \ a function accepting data if the promise is resolved, and a function accepting\
    \ data if the promise is rejected. In the case of `$http`, the familiar success\
    \ and error functions are available in addition to these. Instead of passing the\
    \ entire response object, these break up the response into parameters. For example:\n\
    \n```\n$http.get('foo.url').success(function(data, status, headers, config) {\
    \ // do stuff })\n  .error(function(data, status, headers, config) { // do other\
    \ stuff });\n```\n\n```\n$http.get('foo.url').then(function(res) { // data, status,\
    \ headers, config in res obj},\n    function(res) { // data, status, headers,\
    \ config in res obj });\n```\n\nIt should be noted that when attaching a promise\
    \ to a scope object, there is a shortcut available. The scope eats promises! These\
    \ two statements are equivalent:\n\n```\n$scope.foo = $http.get('foo.url');\n\
    $http.get('foo.url').success(function(res) {\n    $scope.foo = res;\n});\n```\n\
    \nThis may save you some time, but you must understand that since `get()` is an\
    \ asynchronous function, the value of “foo” in the scope will be immediately undefined,\
    \ then set upon successful resolving of the call.\n\nWith `$timeout`, however,\
    \ you are only afforded the `then()` function, which is fine and dandy. `$timeout`\
    \ allows you to execute arbitrary code asynchronously, much like the `setTimeout`\
    \ function in vanilla JavaScript. The difference is that it returns a promise\
    \ instead of a timeout ID. Here is some equivalent code using `setTimeout` and\
