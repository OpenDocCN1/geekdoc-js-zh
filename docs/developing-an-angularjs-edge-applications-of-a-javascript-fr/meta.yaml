  md: '# # Dependency Injection


    We touched on Dependency Injection earlier. Dependency injection, or DI for short,
    is a core concept of AngularJS. Certain components such as services, factories,
    constants, and values are all considered injectable. They are attached to the
    module and any service, controller, or various other components can request them.
    And yes, DI *is* magic. My advice is to stop worrying and simply be amazed.


    ![](img/f95c537c2fc9346a21a144b89cfac580_63_0.png)


    I lied—it’s not really magic. You can take a function and turn it into a string
    with the `toString()` method, available on all JavaScript objects. This is all
    AngularJS is doing; it converts functions to strings, runs string matching against
    them, and determines from the name of the parameter what you want to inject. Since
    JavaScript is pretty light on the introspection, this seems to be the most straightforward
    way to accomplish DI. The code may be a little icky, but what it buys for you
    is more than worth it.


    What can you inject into a controller? You can inject services, factories, providers
    (configurable services; we’ll cover this later), constants (using `module.constant()`),
    and values (using `module.value()`). *Any* of these that you have included, including
    those within submodules, will be available to *every* controller in your module.
    You will find that you can inject any of these constructs into services, factories,
    the `module.run()` command, and directives.'
  merge: -1
