  - '[PAGE 16]


    # The Module


    Our module is called, surprisingly, `blog`. Declaring a module is very simple
    as you will see, but note that you must specify an array as the second parameter
    to the `module()` call. The contents of this array will be a list of modules to
    include. In our case, we are not including any other modules, so this is an empty
    array. Once we have declared a module and assigned it to a variable, we can use
    that variable to define other components within the module.


    You must understand the difference between the module declaration:


    ```

    angular.module(''foo'', []);

    ```


    And the module reference:


    ```

    angular.module(''foo'');

    ```


    Both return a module object, but the first defines a module and the other retrieves
    a module. If you start out your code by using the second, your application won''t
    do anything except spew some errors at you.


    If you want to include other modules (which run all module code and make any injectable
    components in the included module available to your module), specify them by name—as
    strings—within the array parameter of the module definition. You cannot include
    modules on-the-fly.


    So, if you want to use the `ngResource` module supplied by the AngularJS folks,
    you must link to the .js file in a <script> tag, then load it like so, including
    a module:


    ```

    angular.module(''myModule'', [''ngResource'']);

    ```


    Now you can use the `$resource` service, which is not available by default. Some
    you may want include are `ngMock` for testing, `ngCookies` for cookie manipulation,
    and `ngSanitize` for string/HTML sanitization and post-processing, among others.
    None of these are included by default so you must refer to their corresponding
    .js files in some manner.


    There are some perhaps less-known, but very useful, module functions that we haven''t
    covered:


    ![](img/f95c537c2fc9346a21a144b89cfac580_16_0.png)'
  - "[PAGE 17]\n\n+   - **value()**: Allows you to set some \"global\" (injectable)\
    \ values within an object; good for \"defaults\".\n- **constant()**: Much like\
    \ value, except the object you supply is expected to not change, and is available\
    \ to the config function.\n- **config()**: Inject providers in here to configure\
    \ them, or work with constants, or otherwise do things during the initialization\
    \ phase. Configuring default headers for the `$http` service or setting up routes\
    \ is usually done here.\n- **run()**: Run an arbitrary function after initialization\
    \ is complete; if you need to configure a service/factory/etc. that is not a provider,\
    \ or set something using `$rootScope`, this is a good place to do it.\n\nHere\
    \ is an example of **value()** and **run()**:\n\n```\nangular.module('myModule')\n\
    \  .value('foo', {bar: 'baz'})\n  .run(function(foo) { ... });\n```\n\nAnd here\
    \ is an example of **constant()** and **config()**:\n\n```\nangular.module('myModule')\n\
    \  .constant('foo', {bar: 'baz'})\n  .config(function(foo) { ... });\n```\n\n\
    Note that you can inject a constant into a **run()** function, but you can't inject\
    \ a value into a **config()** function.\n\nHow do we know when to create a module?\
    \ In practice, I've found that generally I want one module per (HTML) page. If\
    \ you want to automatically bootstrap your AngularJS application, which you generally\
    \ do, you will use the **ngApp** directive. This directive can only be used once\
    \ per HTML page. Now, that doesn't mean that you shouldn't bundle common functionality\
    \ between the pages in another module—in fact, you should. It's simply that each\
    \ page will require a module to be *the* module for that page, and it must require\
    \ all other modules it needs. Given that you may mostly be writing single-page\
    \ apps in AngularJS, you will typically have one module for your \"app\" and others\
    \ for reusable components.\n\nAnother situation in which you should create a module\
    \ is if you have a collection of like components that are reusable across disparate\
    \ single-or-multi-page applications. For example, you may need the **`$http`**\
    \ service to behave in a particular way across all of your system's applications,\
    \ then it's a great idea to create a module that all of those applications can\
    \ include.\n\nI've found a neat way to use modules is to say: overwrite a built-in\
    \ directive or two within one, then include that module only when necessary. Also,\
    \ supplying test fixture functionality to QUnit (or any other non-Jasmine framework)\
    \ is another good use case, as **ngMock** only supplies some fixtures if you are\
    \ using Jasmine."
  - '[PAGE 18]


    # # The Controller


    MainCtrl is our controller. As discussed in The View chapter, it has control of
    the entire page, since it''s attached to the <body> tag. OK, that''s great, but
    what is $scope, what is Posts, and more importantly, where do they come from?
    The short answer is that $scope is a Scope object and Posts is a service, and
    they arrive in your controller via dependency injection. The long answer is that
    this is dependency injection (DI) at work. Dependency injection is a core concept
    of AngularJS and aids unit testing and code organization. Components arriving
    in a function via DI are either included components of AngularJS, or custom components
    you write yourself.


    So what are we doing here? When the controller is initialized, we execute the
    getPosts() function in the Posts service, wait for its success, put its response
    into our $scope object, and perform some post-processing on said response. The
    getPosts() function returns a promise. If you are familiar with jQuery.Deferred()
    or Kristopher Kowal''s q, then you understand promises. We''ll go into promises
    in detail later. For now, know that getPosts() returns a promise, and at some
    point it will be resolved, and when it is, the success callback is executed:


    ![](img/f95c537c2fc9346a21a144b89cfac580_18_0.png)


    We can see that in this controller we''re assigning a value to $scope.posts. When
    we do this, the view is alerted and the expressions involving posts are (re-)evaluated.
    This is an example of data binding. A portion of a view is data-bound to a model,
    and when either one changes, they are both synchronized.


    Note: Initially when AngularJS loads, the value of $scope.posts (and thus posts
    in the view) is undefined. It is only set after our call to getPosts() succeeds!
    Remember this when you'
