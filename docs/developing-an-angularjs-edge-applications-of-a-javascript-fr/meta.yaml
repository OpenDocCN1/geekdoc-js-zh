  md: "# # Unit Testing AngularJS with QUnit\n\nYou are not required to use Jasmine\
    \ to unit test AngularJS code. With a little bit of setup, you can use QUnit or\
    \ another library (such as Mocha) just as easily.\n\nWhat follows are examples\
    \ of testing each kind of component using QUnit:\n\n```\nvar myApp = angular.module('myApp',\
    \ []);\n```\n\n```\nmyApp.controller('MyCtrl', function($scope) {\n    $scope.addTwo\
    \ = function(n) {\n        return n + 2;\n    };\n});\n```\n\n```\nmyApp.service('MyService',\
    \ function() {\n    this.addThree = function(n) {\n        return n + 3;\n   \
    \ };\n});\n```\n\n```\nmyApp.directive('myDirective', function() {\n    return\
    \ {\n        link: function(scope, elm, attrs) {\n            scope.$watch(attrs.myDirective,\
    \ function(value) {\n                elm.text(value + 4);\n            });\n \
    \       }\n    }\n});\n```\n\n```\nmyApp.filter('myfilter', function() {\n   \
    \ return function(s) {\n        return s + 5;\n    };\n});\n```\n\nAnd the tests:\n\
    \n```\nvar injector = angular.injector(['ng', 'myApp']);\n```\n\n```\nvar init\
    \ = {\n    setup: function() {\n        this.$scope = injector.get('$rootScope').$new踏青();\n\
    \    }\n};\n```\n\n```\nmodule('tests', init);\n```\n\n```\ntest('MyCtrl', function()\
    \ {\n    var $controller = injector.get('$controller');\n    $controller('MyCtrl',\
    \ {\n        $scope: this.$scope\n    });\n    equal(3, this.$scope.addTwo(1));\n\
    });\n```\n\n```\ntest('MyService', function() {\n    var MyService = injector.get('MyService');\n\
    \    equal(4, MyService.addThree(1));\n});\n```\n\n```\ntest('MyDirective', function()\
    \ {\n    var $compile = injector.get('$compile');\n    var element = $compile('<div\
    \ my-directive=\"foo\"></div>')(this.$scope);\n    this.$scope.foo = 1;\n    this.$scope.$apply();\n\
    \    equal(5, element.text());\n    delete this.$scope.foo;\n});\n```\n\n```\n\
    test('MyFilter', function() {\n    var $filter = injector.get('$filter');\n  \
    \  equal(6, $filter('myfilter')(1));\n});\n```"
