  md: "# # Configuration\n\nLet's setup some routing in our blog. Say we want to load\
    \ a particular post based on its ID. First, we must set up our HTML to handle\
    \ routing. Note that this requires an `ngView` directive.\n\n```\n<!DOCTYPE html>\n\
    <html ng-app=\"blog\">\n<head>\n  <meta http-equiv=\"Content-type\" content=\"\
    text/html; charset=utf-8\">\n  <title ng:bind-template=\"{{title}}\"></title>\n\
    \  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js\"\
    \ type=\"text/javascript\"\n  charset=\"utf-8\"></script>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
    \ type=\"text/javascript\"\n    charset=\"utf-8\"></script>\n  <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body>\n\
    <div ng-controller=\"HeadCtrl\">\n  <h1>{{title}}</h1>\n  <h3>{{description}}</h3>\n\
    </div>\n<div ng-controller=\"ContentCtrl\">\n  <new-post-area post=\"new_post\"\
    \ cancel-text=\"Cancel\" save-text=\"Save\" cancel=\"cancel\" save=\"save\"></new-post-area>\n\
    \  <div id=\"posts-form\">\n    Order By: <select ng-model=\"order\"><option value=\"\
    title\">Title</option><option value=\"date\">Date</option></select>\n    <input\
    \ type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n    Search: <input\
    \ type=\"text\" ng-model=\"filter\"/>\n  </div>\n\n  <ng-view></ng-view>\n</div>\n\
    <!-- directive: copyright -->\n--\n```\n\nPast this point, we have AngularJS templates\
    \ defined within `<script>` tags.\n\n```\n<script type=\"text/ng-template\" id=\"\
    posts\">\n  <div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \ ng-class-even=\"'even'\" ng-class-odd=\"'odd'\">\n    <ng-include src=\"'post'\"\
    ></ng-include>\n  </div>\n</script>\n\n<script type=\"text/ng-template\" id=\"\
    post\">\n  <ng-switch on=\"post.editing\">\n    <div ng-switch-when=\"true\">\n\
    \      <div class=\"important-background-color\" color=\"#EEE\">\n      <input\
    \ type=\"text\" ng-model=\"post.temp.title\"/><br/>\n      <textarea ng-model=\"\
    post.temp.body\"></textarea><br/>\n      <button ng-click=\"cancel(post)\">Cancel</button>\n\
    \      <button ng-click=\"save(post)\">Save Changes</button>\n      </div>\n \
    \   </div>\n    <div ng-switch-default>\n      <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n\
    \      <p ng-click=\"edit(post)\" bold-click ng-bind-html-unsafe=\"post.body\"\
    ></p>\n      <p><em>posted on {{post.date|date:'short'}} by {{post.author}}</em></p>\n\
    \    </div>\n    <hr/>\n    <button ng-click=\"newPost()\">New Post</button>\n\
    \  </ng-switch>\n</script>\n\n</body>\n</html>\n```\n\nYou'll see above that we've\
    \ added two templates, posts and post, and put an `ngView` directive in their\
    \ place. This is where the proper template will be inserted. Next, let's work\
    \ on our `config()` call again:\n\n```\nblog.config(function ($httpProvider, $routeProvider)\
    \ {\n  // .. a bunch of $httpProvider configuration\n\n\n  // you will be very\
