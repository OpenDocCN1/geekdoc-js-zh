- md: "not implemented the file type input. So sticking an [ngModel](https://angular.io/api/forms/NgModel)\
    \ on it would not work, whatever you think working might be.\n\n## Spinners And\
    \ The Like\n\nFair warning: there should be a better way to do the following.\
    \ Currently AngularJS supports response interceptors (which we'll cover in a minute),\
    \ but not request interceptors, so while those would be a fitter bit for this\
    \ kind of solution, it's not possible given that we could use them to hide a spinner,\
    \ but not show one—that's where a request interceptor would come in.\n\nYou may\
    \ want to display an animated spinner while Ajax requests are processing. This\
    \ is easy to do across all of your requests by using a request transformation.\
    \ Request transformations are really for actually taking some request-data-to-be\
    \ and modifying it to your liking before it gets sent. However, we can just as\
    \ easily set up any kind of action to be taken before any request is made. Let's\
    \ do this in our blog by modifying our config() call.\n\n```javascript\n// configure\
    \ $http to always pass this header\n// also, display a spinner during any Ajax\
    \ request\nblog.config(function($httpProvider) {\n  $httpProvider.defaults.common['X-Blog-Version']\
    \ = '1.0';\n  // this is where we do something like starting a spinner\n  $httpProvider.defaults.transformRequest.unshift(function(req)\
    \ {\n    $('body').append(spinner); // spinner is defined elsewhere\n    return\
    \ req; // return request unspooled\n  });\n  // last thing we do when retrieving\
    \ a response (before success() and the like):\n  // hide the spinner\n  $httpProvider.defaults.transformResponse.push(function(res)\
    \ {\n    if (spinner) {\n      spinner.remove();\n    }\n    return res; // return\
    \ response unspooled\n  });\n});\n```\n\nThis is very basic, and you could wind\
    \ up in a situation where two spinners are displayed at once, but, this is likely\
    \ a rare occurrence.\n\nIf you want to disable this behavior for certain requests\
    \ (continuous polling, for example), you can simply override it to do nothing:\n\
    \n```javascript\n$http.get('/some/url', {transformRequest: angular.noop});\n```\n\
    \nMind you this is a hack. This is not for what request transforms and response\
    \ transforms were intended to do. Maybe it would be better to decorate the $httpBackend\
    \ service. This service sits between $http and XHR and handles all outgoing requests.\n\
    \n```javascript\nblog.config(function($httpProvider, $routeProvider, $provide)\
    \ {\n  // snip...\n  // pop a spinner when any HTTP req is made and remove it\
    \ when the response comes in\n  $provide.decorator('$httpBackend', function($delegate)\
    \ {\n    // do not blast mock $httpBackend if it exists\n    if (typeof angular.mock.angular.mock)\
    \ {\n      return $delegate;\n    }\n    return function(method, url, reqData,\
    \ done, reqHeaders, timeout, withCredentials) {\n      var spinner = angular.element('<div\
    \ class=\"working\"></div>');\n      $('body').append(spinner);\n      $delegate(method,\
    \ url, reqData, function() {\n        spinner.remove();\n        done.apply(this,\
    \ arguments);\n      }, reqHeaders, timeout, withCredentials);\n    };\n  });\n\
    });\n```\n\nNote: we've injected the $provide service—don’t forget that. A decorator\
    \ will be called any time a particular service (in this case, $httpBackend is\
    \ injected). This decorator simply pops a spinner, intercepts the done method\
    \ passed to $httpBackend, then removes the spinner. The documentation for $httpBackend\
    \ is sparse/non-existent; to figure this out, I had to use the force and read\
    \ the source.\n\n## Displaying Ajax Errors\n\nIf your server is halfway sane it\
    \ will give you a 404 when you expect a 404. It will give you a 500 when something\
    \ else goes awry. Let's assume it does.\n\nWe can show an error message every\
    \ time we get a non-OK response from the server using a response interceptor.\
    \ Append the following to our `config()` call:\n\n```javascript\n// error messaging\
    \ upon non-OK response from server\n$httpProvider.responseInterceptors.push(function\
    \ ($q, $window) {\n\treturn function (promise) {\n\t\treturn promise.then($angular.identity,\
    \ function(res){\n\t\t\t$window.alert(\"Egad, there was an error!\");\n\t\t\t\
    return $q.reject(res);\n\t\t});\n\t};\n});\n```\n\nThe promise passed into the\
    \ first function is the promise from your `$http` call. The promise would be rejected,\
    \ because `$http` did not make a successful request, thus executing the *second*\
    \ parameter of the call to `then()`, above (the first parameter, `angular.identity`,\
    \ is simply a function that returns its first argument). Next, we pass the rejection\
    \ down the line (with the response information, of course) to be handled by `error()`\
    \ or any second parameter of a `then()` attached to the original promise returned\
    \ by the `$http` call in your code. To test this, simply change the URL in the\
    \ `getPosts()` function of the Posts service to be something non-existent.\n\n\
    ![](img/f95c537c2fc9346a21a144b89cfac580_112_0.png)\n\nIf your server responds\
    \ with JSON objects that have *errors in them*, we can handle that too. Even if\
    \ we are getting a 200 from the server, the request may have thrown an internal\
    \ exception, and we can look for that. For example, there may be an `$error` key\
    \ in the response JSON. Every time we see that, we know something went south on\
    \ the server side. Let's replace our code above with the following:\n\n```javascript\n\
    // error messaging upon non-OK response from server\n// or special $error response\n\
    $httpProvider.responseInterceptors.push(function ($q, $window) {\n\treturn function\
    \ (promise) {\n\t\treturn promise.then(function(res) {\n\t\t\tif (res.data.$error)\
    \ {\n\t\t\t\t$window.alert(\"Yikes, the server had a problem!!\");\n\t\t\t\treturn\
    \ $q.reject(res);\n\t\t\t}\n\t\t\treturn res;\n\t\t}, function(res) {\n      \
    \      $window.alert('Egad, there was an error!');\n            return $q.reject(res);\n\
    \        });\n\t};\n});\n```\n\nNow, any time any response from the server has\
    \ $error as a top-level key in its JSON, you'll pop an alert and the `failure()`\
    \ function will be executed, just like any 500 or 404 error.\n\n## Routing\n\n\
    It's often desirable to have the hash portion of a URL direct the user to a particular\
    \ view. AngularJS provides a service for this called `$route`. During the `config()`\
    \ phase, you can configure `$routeProvider` to point to the correct view when\
    \ coupled with the `ngview` directive. Furthermore, you can pass data through\
    \ the URL and retrieve it using the `$routeParams` service.\n\nBe careful when\
    \ using named anchor tags and the `$route` service. They both use the \"hash\"\
    \ portion of the URL to do different things. The `$route` service will take precedence\
    \ over any fragment intended to hit a named anchor—if you have a route called\
    \ \"foo\" and an anchor named \"foo\", AngularJS will attempt to execute the route\
    \ when visiting http://your.com/#foo.\n\n### Can I use more than one ngView directive\
    \ at once?\n\n*No. ngView can only be included once per HTML page. If you are\
    \ switching views when using the `$route` service, plan ahead for the best place\
    \ to use ngView which will include the proper templates. Watch for this functionality\
    \ in the future.*\n\n### Configuration\n\nLet's setup some routing in our blog.\
    \ Say we want to load a particular post based on its ID. First, we must set up\
    \ our HTML to handle routing. Note that this requires an `ngView` directive.\n\
    \n```html\n<!DOCTYPE html>\n<html ng-app=\"blog\">\n<head>\n  <meta http-equiv=\"\
    Content-type\" content=\"text/html; charset=utf-8\">\n  <title ng:bind-template=\"\
    {{title}}\"></title>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js\"\
    \ type=\"text/javascript\"\n  charset=\"utf-8\"></script>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
    \ type=\"text/javascript\"\n    charset=\"utf-8\"></script>\n  <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body>\n\
    <div ng-controller=\"HeadCtrl\">\n  <h1>{{title}}</h1>\n  <h3>{{description}}</h3>\n\
    </div>\n<div ng-controller=\"ContentCtrl\">\n  <new-post-area post=\"new_post\"\
    \ cancel-text=\"Cancel\" save-text=\"Save\" cancel=\"cancel\" save=\"save\"></new-post-area>\n\
    \  <div id=\"posts-form\">\n    Order By: <select ng-model=\"order\"><option value=\"\
    title\">Title</option><option value=\"date\">Date</option></select>\n    <input\
    \ type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n    Search: <input\
    \ type=\"text\" ng-model=\"filter\"/>\n  </div>\n\n  <ng-view></ng-view>\n</div>\n\
    <!-- directive: copyright -->\n```\n\nPast this point, we have AngularJS templates\
    \ defined within `<script>` tags.\n\n```html\n<script type=\"text/ng-template\"\
    \ id=\"posts\">\n  <div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \ ng-class-even=\"'even'\" ng-class-odd=\"'odd'\">\n    <ng-include src=\"'post'\"\
    ></ng-include>\n  </div>\n</script>\n\n<script type=\"text/ng-template\" id=\"\
    post\">\n  <ng-switch on=\"post.editing\">\n    <div ng-switch-when=\"true\">\n\
    \      <div class=\"important-background-color\" color=\"#EEE\">\n      <input\
    \ type=\"text\" ng-model=\"post.temp.title\"/><br/>\n      <textarea ng-model=\"\
    post.temp.body\"></textarea><br/>\n      <button ng-click=\"cancel(post)\">Cancel</button>\n\
    \      <button ng-click=\"save(post)\">Save Changes</button>\n      </div>\n \
    \   </div>\n    <div ng-switch-default>\n      <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n\
    \      <p ng-click=\"edit(post)\" bold-click ng-bind-html-unsafe=\"post.body\"\
    ></p>\n      <p><em>posted on {{post.date|date:'short'}} by {{post.author}}</em></p>\n\
    \    </div>\n    <hr/>\n    <button ng-click=\"newPost()\">New Post</button>\n\
    \  </ng-switch>\n</script>\n\n</body>\n</html>\n```\n\nYou'll see above that we've\
    \ added two templates, posts and post, and put an `ngView` directive in their\
    \ place. This is where the proper template will be inserted. Next, let's work\
    \ on our `config()` call again:\n\n```javascript\nblog.config(function ($httpProvider,\
    \ $routeProvider) {\n  // .. a bunch of $httpProvider configuration\n\n  // you\
    \ will be very sad if you do not start your URLs with \"/\"; this could be a bug\n\
    \  $routeProvider.when('/post/:id', {templateUrl: 'post'})\n    .when('/posts',\
    \ {templateUrl: 'posts'})\n    .otherwise({redirectTo: '/posts'});\n});\n```\n\
    \nThe above says when the URL ends with #/posts, load all posts. If the URL ends\
    \ with #/post/1, load the post with ID 1. You can also specify a controller (with\
    \ the `controller` key"
  mdcn: "\n尚未实现文件类型输入。因此，无论你认为怎样才算能工作，在其上使用 [ngModel](https://angular.io/api/forms/NgModel)\
    \ 都是行不通的。\n\n## 加载指示器及类似组件\n\n公平警告：应该有更好的方法来实现以下内容。目前 AngularJS 支持响应拦截器（我们稍后会讲到），但不支持请求拦截器，所以虽然拦截器更适合这类解决方案，但我们无法使用它们——因为我们可以用它们来隐藏加载指示器，但无法显示它——这正是请求拦截器能派上用场的地方。\n\
    \n你可能希望在处理 Ajax 请求时显示一个动画加载指示器。通过使用请求转换，这很容易在所有请求中实现。请求转换实际上是用于获取待发送的请求数据，并在发送前将其修改为你想要的形式。然而，我们同样可以轻松地设置在任何请求发出之前执行任何操作。让我们通过修改\
    \ config() 调用来在博客中实现这一点。\n\n```javascript\n// 配置 $http 始终传递此请求头\n// 同时，在任何 Ajax\
    \ 请求期间显示加载指示器\nblog.config(function($httpProvider) {\n  $httpProvider.defaults.common['X-Blog-Version']\
    \ = '1.0';\n  // 这里我们做一些类似启动加载指示器的操作\n  $httpProvider.defaults.transformRequest.unshift(function(req)\
    \ {\n    $('body').append(spinner); // spinner 在其他地方定义\n    return req; // 返回未处理的请求\n\
    \  });\n  // 接收响应时最后执行的操作（在 success() 等之前）：\n  // 隐藏加载指示器\n  $httpProvider.defaults.transformResponse.push(function(res)\
    \ {\n    if (spinner) {\n      spinner.remove();\n    }\n    return res; // 返回未处理的响应\n\
    \  });\n});\n```\n\n这是非常基础的，你可能会遇到两个加载指示器同时显示的情况，但这种情况可能很少发生。\n\n如果你想为某些请求禁用此行为（例如持续轮询），你可以简单地覆盖它，使其什么都不做：\n\
    \n```javascript\n$http.get('/some/url', {transformRequest: angular.noop});\n```\n\
    \n请注意这是一种 hack。这不是请求转换和响应转换的原本用途。也许更好的方式是装饰 $httpBackend 服务。该服务位于 $http 和 XHR\
    \ 之间，处理所有外发的请求。\n\n```javascript\nblog.config(function($httpProvider, $routeProvider,\
    \ $provide) {\n  // 省略...\n  // 当有 HTTP 请求时弹出加载指示器，响应返回时移除它\n  $provide.decorator('$httpBackend',\
    \ function($delegate) {\n    // 如果存在模拟的 $httpBackend，不要覆盖它\n    if (typeof angular.mock.angular.mock)\
    \ {\n      return $delegate;\n    }\n    return function(method, url, reqData,\
    \ done, reqHeaders, timeout, withCredentials) {\n      var spinner = angular.element('<div\
    \ class=\"working\"></div>');\n      $('body').append(spinner);\n      $delegate(method,\
    \ url, reqData, function() {\n        spinner.remove();\n        done.apply(this,\
    \ arguments);\n      }, reqHeaders, timeout, withCredentials);\n    };\n  });\n\
    });\n```\n\n注意：我们注入了 $provide 服务——别忘了这一点。装饰器在每次注入特定服务时都会被调用（在本例中是 $httpBackend）。这个装饰器只是弹出一个加载指示器，拦截传递给\
    \ $httpBackend 的 done 方法，然后移除加载指示器。$httpBackend 的文档很少/根本不存在；要弄清楚这个，我不得不使用原力并阅读源码。\n\
    \n## 显示 Ajax 错误\n\n如果你的服务器还算正常，它会在你期望 404 时返回 404，在其他地方出错时返回 500。我们假设它会这样做。\n\n\
    我们可以使用响应拦截器，在每次从服务器收到非 OK 响应时显示错误消息。将以下内容追加到我们的 `config()` 调用中：\n\n```javascript\n\
    // 服务器返回非 OK 响应时的错误提示\n$httpProvider.responseInterceptors.push(function ($q, $window)\
    \ {\n\treturn function (promise) {\n\t\treturn promise.then($angular.identity,\
    \ function(res){\n\t\t\t$window.alert(\"哎呀，出错了！\");\n\t\t\treturn $q.reject(res);\n\
    \t\t});\n\t};\n});\n```\n\n传入第一个函数的 promise 来自你的 `$http` 调用。该 promise 会被拒绝，因为\
    \ `$http` 没有成功发出请求，因此执行上面 `then()` 调用的*第二个*参数（第一个参数 `angular.identity` 只是一个返回其第一个参数的函数）。接下来，我们将拒绝传递下去（当然带着响应信息），以便由你代码中\
    \ `$http` 调用返回的原始 promise 的 `error()` 或任何 `then()` 的第二个参数来处理。要测试这个，只需将 Posts 服务中\
    \ `getPosts()` 函数的 URL 改为某个不存在的地址。\n\n![](img/f95c537c2fc9346a21a144b89cfac580_112_0.png)\n\
    \n如果你的服务器返回的 JSON 对象中*包含错误信息*，我们也能处理。即使我们从服务器得到了 200 响应，请求也可能抛出了内部异常，我们可以查找这种情况。例如，响应\
    \ JSON 中可能有一个 `$error` 键。每次看到它，我们就知道服务器端出了什么问题。让我们用以下代码替换上面的代码：\n\n```javascript\n\
    // 服务器返回非 OK 响应时的错误提示\n// 或特殊的 $error 响应\n$httpProvider.responseInterceptors.push(function\
    \ ($q, $window) {\n\treturn function (promise) {\n\t\treturn promise.then(function(res)\
    \ {\n\t\t\tif (res.data.$error) {\n\t\t\t\t$window.alert(\"哎呀，服务器出问题了！！\");\n\t\
    \t\t\treturn $q.reject(res);\n\t\t\t}\n\t\t\treturn res;\n\t\t}, function(res)\
    \ {\n            $window.alert('哎呀，出错了！');\n            return $q.reject(res);\n\
    \        });\n\t};\n});\n```\n\n现在，任何时候服务器响应的 JSON 中，只要顶层键包含 $error，就会弹出 alert，并且会执行\
    \ `failure()` 函数，就像任何 500 或 404 错误一样。\n\n## 路由\n\n通常希望 URL 的 hash 部分能引导用户到特定视图。AngularJS\
    \ 为此提供了一个名为 `$route` 的服务。在 `config()` 阶段，你可以配置 `$routeProvider`，结合 `ngview` 指令，在\
    \ URL 匹配时指向正确的视图。此外，你可以通过 URL 传递数据，并使用 `$routeParams` 服务检索它。\n\n使用命名锚点标签和 `$route`\
    \ 服务时要小心。它们都使用 URL 的 \"hash\" 部分来做不同的事情。`$route` 服务会优先于任何指向命名锚点的片段——如果你有一个名为 \"\
    foo\" 的路由和一个名为 \"foo\" 的锚点，当访问 http://your.com/#foo 时，AngularJS 会尝试执行该路由。\n\n\
    ### 可以一次使用多个 ngView 指令吗？\n\n*不可以。ngView 在每个 HTML 页面中只能包含一次。如果你在使用 `$route` 服务时切换视图，提前规划好使用\
    \ ngView 的最佳位置，以包含适当的模板。请关注未来的此功能。*\n\n### 配置\n\n让我们在我们的博客中设置一些路由。假设我们想根据 ID 加载特定的文章。首先，我们必须设置\
    \ HTML 以处理路由。注意这需要一个 `ngView` 指令。\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"\
    blog\">\n<head>\n  <meta http-equiv=\"Content-type\" content=\"text/html; charset=utf-8\"\
    >\n  <title ng:bind-template=\"{{title}}\"></title>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.4/angular.min.js\"\
    \ type=\"text/javascript\"\n  charset=\"utf-8\"></script>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
    \ type=\"text/javascript\"\n    charset=\"utf-8\"></script>\n  <script src=\"\
    blog.js\" type=\"text/javascript\" charset=\"utf-8\"></script>\n</head>\n<body>\n\
    <div ng-controller=\"HeadCtrl\">\n  <h1>{{title}}</h1>\n  <h3>{{description}}</h3>\n\
    </div>\n<div ng-controller=\"ContentCtrl\">\n  <new-post-area post=\"new_post\"\
    \ cancel-text=\"Cancel\" save-text=\"Save\" cancel=\"cancel\" save=\"save\"></new-post-area>\n\
    \  <div id=\"posts-form\">\n    Order By: <select ng-model=\"order\"><option value=\"\
    title\">Title</option><option value=\"date\">Date</option></select>\n    <input\
    \ type=\"checkbox\" ng-model=\"descending\"/> Descending <br/>\n    Search: <input\
    \ type=\"text\" ng-model=\"filter\"/>\n  </div>\n\n  <ng-view></ng-view>\n</div>\n\
    <!-- directive: copyright -->\n```\n\n在此之后，我们在 `<script>` 标签中定义了 AngularJS 模板。\n\
    \n```html\n<script type=\"text/ng-template\" id=\"posts\">\n  <div id=\"{{post.id}}\"\
    \ ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\" ng-class-even=\"\
    'even'\" ng-class-odd=\"'odd'\">\n    <ng-include src=\"'post'\"></ng-include>\n\
    \  </div>\n</script>\n\n<script type=\"text/ng-template\" id=\"post\">\n  <ng-switch\
    \ on=\"post.editing\">\n    <div ng-switch-when=\"true\">\n      <div class=\"\
    important-background-color\" color=\"#EEE\">\n      <input type=\"text\" ng-model=\"\
    post.temp.title\"/><br/>\n      <textarea ng-model=\"post.temp.body\"></textarea><br/>\n\
    \      <button ng-click=\"cancel(post)\">Cancel</button>\n      <button ng-click=\"\
    save(post)\">Save Changes</button>\n      </div>\n    </div>\n    <div ng-switch-default>\n\
    \      <h2 ng-click=\"edit(post)\">{{post.title}}</h2>\n      <p ng-click=\"edit(post)\"\
    \ bold-click ng-bind-html-unsafe=\"post.body\"></p>\n      <p><em>posted on {{post.date|date:'short'}}\
    \ by {{post.author}}</em></p>\n    </div>\n    <hr/>\n    <button ng-click=\"\
    newPost()\">New Post</button>\n  </ng-switch>\n</script>\n\n</body>\n</html>\n\
    ```\n\n你会看到上面我们添加了两个模板，posts 和 post，并放置了 `ngView` 指令来代替它们的位置。这是将插入适当模板的位置。接下来，让我们再次处理我们的\
    \ `config()` 调用：\n\n```javascript\nblog.config(function ($httpProvider, $routeProvider)\
    \ {\n  // .. 一堆 $httpProvider 配置\n\n  // 如果你的 URL 不以 \"/\" 开头，你会很伤心的；这可能是个 bug\n\
    \  $routeProvider.when('/post/:id', {templateUrl: 'post'})\n    .when('/posts',\
    \ {templateUrl: 'posts'})\n    .otherwise({redirectTo: '/posts'});\n});\n```\n\
    \n上面表示当 URL 以 #/posts 结尾时，加载所有文章。如果 URL 以 #/post/1 结尾，加载 ID 为 1 的文章。你还可以指定一个控制器（使用\
    \ `controller` 键\n"
