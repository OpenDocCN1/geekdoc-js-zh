    \n## 结论\n\n视图（View）简单来说就是 AngularJS 的呈现逻辑。它集成了模型（models）、指令（directives）、过滤器（filters），并作为进入应用程序的主要接口点。如果有人需要“保存”，他们是通过点击按钮来完成的，而不是在\
    \ JS 控制台中输入命令！虽然我想你可以写一个文字冒险游戏……哦，没什么。\n\n接下来我们将介绍控制器（Controller），那是业务逻辑所在地。\n\
    \n# 第 5 章. 控制器详解\n\n控制器是你的业务逻辑所在地。为了定义业务逻辑，我们可以说它是你的 UI 和数据存储层之间，以及支持该逻辑所需的任何算法所在的层。控制器**不是**放置\
    \ DOM 修改代码的地方。控制器不知道 DOM，并且应该与视图解耦。那么为什么其他 JavaScript 框架希望你做我告诉你不去做的事情呢？我认为答案在于“没有其他地方可以放它”。在\
    \ AngularJS 中，我们**确实**有一个可以放置它的地方，而那不是控制器（它是一个指令，我们稍后将探讨）。\n\n## 为我们的控制器添加功能\n\
    \n现在我们有了一个漂亮的视图，我们需要为我们的控制器添加一些功能来支持新的标记。新显示的内容包括几篇博客文章，并提供了一种创建新文章的方法等。让我们看看后台是如何运作的：\n\
