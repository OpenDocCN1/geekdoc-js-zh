  - "[PAGE 73]\n\n# # Class-Type Directive\n\nFinally, we have a class-type directive.\
    \ Basically this means you can use a class attribute on any HTML tag, and AngularJS\
    \ will process it accordingly. This may be handy if you have CSS styles associated\
    \ with the directive name, or want to use the directive name in a jQuery selector,\
    \ for some reason.\n\n```\n// This directive is like the \"!important\" CSS value\
    \ on steroids.\n// it will automatically use JavaScript to override whatever CSS\
    \ a node may have on it.\n// I think this is probably a terrible idea.\nblog.directive('importantBackgroundColor',\
    \ function() {\n    return {\n        restrict: 'C',\n        priority: -99999,\
    \ // we want this to be run dead last\n        // we don't use compile because\
    \ we want to do this at the last possible minute\n        link: function(scope,\
    \ element, attribs) {\n            element.css('background-color', attribs.color);\n\
    \        }\n    };\n});\n```\n\nUsage:\n\n```\n<div class=\"important-background-color\"\
    \ color=\"#EEE\">fleas</div>\n```\n\nThis outputs nothing different, but if you\
    \ inspect the element it will have a style attribute equal to background-color:\
    \ #EEE or something similar. This will override any CSS style you may have written,\
    \ or any !important CSS style you may have written, which makes this very important\
    \ indeed. The priority key here is used to tell the directive to compile and link\
    \ *absolutely last* (or close to it) compared to other directives that may be\
    \ on the same node. If there was a competing directive that did the same thing\
    \ as this with an even *lower* priority, it would override the resulting background\
    \ color. Of course, something like this is only useful if you have a lot of legacy\
    \ CSS sitting around, preventing you from getting it quite right. You can use\
    \ this directive and add to the madness.\n\nThese were examples of restricting\
    \ directives to certain usages. Next, let's cover some more directive concepts."
  - "[PAGE 74]\n\n# # The Widget\n\nI don't think there's any formal definition for\
    \ what a widget is, but often I've heard it used to reference a UI element, particularly\
    \ one that a user can interact with in some way. Maybe this is a date picker or\
    \ a rich text editor. But these can also be very simple, like this dead-simple\
    \ example of an accordion:\n\n```\nblog.directive('accordion', function() {\n\
    \    return {\n        restrict: 'E',\n        replace: true,\n        template:\
    \ '<div class=\"accordion\"><h3>{{title}}</h3>' +\n                  '<div class=\"\
    accordion-content\" ng-show=\"open\" ng-transclude></div>',\n        transclude:\
    \ true,\n        scope: {\n            title: '='\n        },\n        link: function(scope,\
    \ elm) {\n            scope.open = false;\n            // assume we have no jQuery.\n\
    \            angular.element(elm.children()[0]).bind('click', function() {\n \
    \               scope.$apply('open = !open');\n            });\n        }\n  \
    \  };\n});\n```\n\nOK, maybe not *dead* simple, but it's definitely maimed. Let's\
    \ go at it one piece at a time.\n\n+   - **restrict**: We've already covered the\
    \ E restriction, which tells AngularJS the directive is to be used as an element;\
    \ `<accordion>...</accordion>`.\n- **replace**: We want the directive to replace\
    \ the `<accordion>...</accordion>` markup in our HTML with the template, which\
    \ is specified by...\n- **template**: Nothing new here except the use of the `ngTransclude`\
    \ directive. If you have this somewhere in your template, and specify...\n- **transclude**:\
    \ ...to be true, then the contents of the original HTML will be placed inside\
    \ the node that has the ngTransclude directive on it. So we can use this directive\
    \ like so: `<accordion>beans</accordion>` and \"beans\" will appear within the\
    \ `<div>` with the class accordion-content. The `ngTransclude` directive basically\
    \ just says \"put the directive's original content here.\"\n- **scope**: This\
    \ loathsome object tells us to create an isolate scope, and within that scope\
    \ create a model called \"title\", and the value of this model will be the value\
    \ of the attribute \"title\" in the directive. So: `<accordion title=\"'pinto'\"\
    >beans</accordion>` will give the directive a title to work with. Note that the\
    \ value of the title attribute here is a string, but it could be the value of\
    \ whatever AngularJS expression you wish.\n\nThe keys of this object are the names\
    \ of members of the new isolate scope, and the values are describing how to get\
    \ these values. A `=` will link directly to a model in the parent scope *with\
    \ the same name*. `=foo` will link to a model in the parent scope of the name\
    \ 'foo'. A `@` will treat your attribute *with the same name* as a string, basically.\
    \ `@foo` will look for an attribute called foo and assign it to whatever the key\
    \ is. `&` allows you to bind an expression and execute it against the parent scope\
    \ with a function. Given `{localFn: '&'}`, the directive will look for a 'local-fn'\
    \ attribute and put its value (say, \"foo + 2\") into a function. When you are\
    \ ready, execute `localFn()`, and the result will be evaluated against"
  - "[PAGE 75]\n\nthe parent scope and returned. If the expression contains a function\
    \ with arguments, you can pass arguments as a name/value mapping into the localFn:\
    \ if the expression is “foo(bar)”, you may say `localFn({bar: ‘baz’})` and ‘baz’\
    \ will be passed in as ‘bar’ to the ‘foo’ function in the expression.\n\n* link:\
    \ What do we get in elm? We get the root element of our template, which is the\
    \ `<div>` with the accordion class. First, we set open to be false to control\
    \ the visibility of the accordion’s content. Then we grab the `<h3>` node (remember,\
    \ no selectors in jQLite) and bind a click event to it, which simply flips the\
    \ boolean value of the open model—which, in turn, hides and shows the content.\n\
    \nThe markup for this looks like:\n\n```\n<!-- Usage of our accordion directive\n\
    [source,html]\n---\n<accordion title=\"I like..\">pinto beans!</accordion>\n---\n\
    -->\n```\n\nEasy and neat. Output looks something like:\n\n```\n<div class=\"\
    accordion\">\n  <h3>I like..</h3>\n  <div class=\"accordion-content\" ng-show=\"\
    open\" ng-transclude>pinto beans!</div>\n</div>\n```\n\nThe `<h3>` node, when\
    \ clicked, will hide and show the its sibling `<div>`. You could also implement\
    \ a dropdown-type menu this way using some CSS and HTML lists."
- md: " ## Conversing with jQuery\n\nYou may have some jQuery plugin hanging around\
    \ somewhere you want to use with AngularJS, or maybe a simple jQuery function\
    \ not available to jqLite. `animate()` is a good example of this. Keep in mind\
    \ you can achieve the same thing with AngularJS animations, but here goes:\n\n\
    ```\n<p id=\"foo\" style=\"display: none;\">\n  This fades in\n</p>\n```\n\nAnd\
    \ the jQuery to set it up:\n\n```\n$(function() {\n  $('#foo').fadeIn('slow');\n\
    });\n```\n\nTo use `fadeIn`, do this:\n\n```\n<p fade-in=\"true\">\n  This fades\
    \ in\n</p>\n```\n\nAnd of course:\n\n```\nblog.directive('fadeIn', function ()\
    \ {\n  return function (scope, element, attrs) {\n    return function (scope,\
    \ element, attrs) {\n      element.css('opacity', 0); // css available in jqLite\n\
    \      scope.$watch(attrs.fadeIn, function (val) {\n        if (val) {\n     \
    \     element.animate({'opacity': '1.0'}, 1000); // must use jquery proper to\
    \ use animate()\n        } else {\n          element.animate({'opacity': '0'},\
    \ 1000);\n        }\n      });\n    };\n  };\n});\n```\n\nNote that we're not\
    \ fully taking advantage of this directive's watch on a model; we just pass in\
    \ true to immediately animate upon load. If we wanted to, we could specify a boolean\
    \ model, and whenever that model changed, the node would fade in and out.\n\n\
    ![](img/f95c537c2fc9346a21a144b89cfac580_76_0.png)\n\nWhile this implementation\
    \ is a few more lines of code, if you do this all over the place you'll eventually\
    \ save yourself many lines of code. Generally you can expect that if you write\
    \ a reusable directive, even though the up-front cost is higher, you'll eventually\
    \ save yourself a lot of JavaScript.\n\n## Custom Validation\n\nI needed to validate\
    \ a \"time\" field. This time must be some date/time in the future, but not *too*\
    \ far in the future. Since there's no time picker widget (we could write one,\
    \ I guess) let's just use a text input field and run custom validation against\
    \ it. The user will have to type in a parseable date/time. Our markup will look\
    \ like this:\n\n```\n<form name=\"timeForm\">\n  <input name=\"time\" type=\"\
    text\" futureTime placeholder=\"enter a time\" ng-model=\"time\"/>\n</form>\n\
    ```\n\nNote that to use AngularJS' validation mechanism, you must use a form.\
    \ You can nest forms if necessary (using `ngForm`), but we won't be doing that\
    \ here. This is the `futureTime` directive:\n\n```\n// futureTime directive sets\
    \ validity of text input box if the user types in a parsable time that\n// is\
    \ in the future\nblog.directive('futureTime', function() {\n    return {\n   \
    \     require: '?ngModel',\n        link: function(scope, elm, attrs, ngModel)\
    \ {\n\n            // no 'get()' in jqLite; use elm as array to get at the DOM\
    \ node object\n            if (!ngModel || attrs.type !== 'text' || elm[0].tagName.toLowerCase()\
    \ !== 'input') {\n                return; // do nothing if no ngModel specified\
    \ OR the input field is not of type \"text\"\n            }\n\n            //\
    \ we want this to be the first check we do, in case there are others.\n      \
    \      // whatever we return from this function ends up as the view value, so\
    \ if you\n            // want to clear invalid input,\n            // simply return\
    \ nothing.\n            ngModel.$parsers.unshift(function(view_value) {\n    \
    \            var ts, nows;\n                // first case: empty field. this is\
    \ OK\n                if (!view_value) {\n                    ngModel.$setValidity('futureTime',\
    \ true);\n                    return;\n                }\n\n                //\
    \ second case: unparsable date\n                ts = Date.parse(view_value);\n\
    \                if (isNaN(ts) || ts < 0) {\n                    ngModel.$setValidity('futureTime',\
    \ false);\n                    return view_value;\n                }\n\n     \
    \           // third case: valid date, but in the past or present\n          \
    \      nows = new Date().getTime();\n                if (ts <= nows) {\n     \
    \               ngModel.$setValidity('futureTime', false);\n                 \
    \   return view_value;\n                }\n\n                // fourth case: future\
    \ date!\n                ngModel.$setValidity('futureTime', true);\n         \
    \       return view_value;\n            });\n        }\n    };\n});\n```\n\nSince\
    \ we have a form, we can use AngularJS' built-in validation. Let's change our\
    \ HTML partial to this:\n\n```\n<form name=\"timeForm\">\n  <input name=\"time\"\
    \ type=\"text\" future-time placeholder=\"enter a time\" ng-model=\"time\"/>\n\
    \  <div style=\"color: red\" ng-show=\"timeForm.time.$error.futureTime\">This\
    \ is not a valid future time.</div>\n</form>\n```\n\nWhen we name a `<form>`,\
    \ it triggers AngularJS' built-in form directive. This will put a model into the\
    \ scope representing the form with the same name as that form. So since we named\
    \ our form \"timeForm\", it is available on the scope. Also, any named form fields\
    \ within that form are available as objects within the form model. Since we have\
    \ an <input> named \"time\", we can refer to it as `timeForm.time`. Note that\
    \ this does NOT represent the actual value of the form element; that is reserved\
    \ for `ngModel`.\n\n```\n<form name=\"foo\">\n  <input name=\"bar\" required=\"\
    true\"/>\n</form>\n```\n\n![](img/f95c537c2fc9346a21a144b89cfac580_79_0.png)\n\
    \nWhen doing validation in this manner, AngularJS sets some special values within\
    \ the input field model, one of which is `$error`. When we do ` rigorous. $setValidity('something',\
    \ false);`, we are telling AngularJS that the model has an error in it, and the\
    \ error has the validation error key of \"something\". The value will be boolean\
    \ true if there is a problem and false if not. As a bonus, AngularJS will put\
    \ a class on the form element. If you have a validation error key in the form\
    \ someCamelCase, it will slap the ng-valid-some-camel-case or the ng-invalid-some-camel-case\
    \ class on the element, depending. That way you can highlight a bad field in red\
    \ quite easily if you wish.\n\nThis is just one example of how to do custom validation.\
    \ With the classes and data-bound booleans, it accommodates many configurations\
    \ of error reporting. We'll do another \"cookbook\" style example of form validation\
    \ later.\n\nHere are some tests for our `futureTime` directive:\n\n```\ndescribe('Binding\
    \ Directives', function () {\n  var $compile, scope;\n\n  // this is a helper\
    \ function to use when unit testing directives;\n  // you will find yourself doing\
    \ this often\n  function compileAndApply(template) {\n    var compiled = $compile(template)(scope);\n\
    \    scope.$apply();\n    scope.$digest();\n    return compiled;\n  }\n\n  beforeEach(inject(function\
    \ ($injector, $rootScope) {\n    $compile = $injector.get('$compile');\n    scope\
    \ = $rootScope.$new();\n  }));\n\n  describe('the linking function', function\
    \ () {\n```\n\n```\nit('should not throw error if no ngModel supplied', function\
    \ () {\n    var template = '<form name=\"timeForm\">' +\n        '<input name=\"\
    time\" type=\"text\" future-time/>' +\n        '</form>';\n    expect(function\
    \ () {\n        compileAndApply(template);\n    }).not.toThrow();\n});\n```\n\n\
    ```\nit('should be valid on undefined value', function () {\n    var template\
    \ = '<form name=\"timeForm\">' +\n        '<input ng-model=\"time\" name=\"time\"\
    \ type=\"text\" future-time/>' +\n        '</form>';\n    compileAndApply(template);\n\
    \    expect(scope.time).toBeUndefined();\n    expect(scope.timeForm.$valid).toBeTruthy();\n\
    });\n```\n\n```\nit('should be invalid on non-parseable date', function () {\n\
    \    var template = '<form name=\"timeForm\">' +\n        '<input ng-model=\"\
    time\" name=\"time\" type=\"text\" future-time/>' +\n        '</form>';\n    compiled\
    \ = compileAndApply(template);\n\n    // this appears to be how you fake an input\
    \ change.\n    compiled.find('input').val('not a date');\n    compiled.find('input').triggerHandler('input');\n\
    \    expect(scope.timeForm.$valid).toBeFalsy();\n});\n```\n\n```\nit('should be\
    \ invalid on past date', function () {\n    var template = '<form name=\"timeForm\"\
    >' +\n        '<input ng-model=\"time\" name=\"time\" type=\"text\" future-time/>'\
    \ +\n        '</form>';\n    compiled = compileAndApply(template);\n\n    compiled.find('input').val('1998-01-01');\n\
    \    compiled.find('input').triggerHandler('input');\n\n    expect(scope.timeForm.$valid).toBeFalsy();\n\
    });\n```\n\n```\nit('should be valid on future date', function () {\n    var template\
    \ = '<form name=\"timeForm\">' +\n        '<input ng-model=\"time\" name=\"time\"\
    \ type=\"text\" future-time/>' +\n        '</form>';\n    compiled = compileAndApply(template);\n\
    \n    compiled.find('input').val('2050-01-01');\n    compiled.find('input').triggerHandler('input');\n\
    \n    expect(scope.timeForm.$valid).toBeTruthy();\n});\n});\n```\n\nHere we've\
    \ unearthed directives, which are truly powerful. It's of utmost importance to\
    \ write reusable and generic directives—the less reusable they are (say, by polluting\
    \ scopes), the more of a maintenance nightmare you'll incur when revisiting them\
    \ in the future, and you will wake up screaming.\n\nNext we'll learn a bit more\
    \ about directives: when to use them, how to write a reusable directive, how to\
    \ use isolate scopes, and the difference between compilation and linking."
  mdcn: "\n ## 与 jQuery 交互\n\n你可能在某些地方有一些想要在 AngularJS 中使用的 jQuery 插件，或者某些 jqLite\
    \ 不具备的简单 jQuery 函数。`animate()` 就是一个很好的例子。请记住，你也可以使用 AngularJS 的动画功能来实现同样的效果，但这里我们演示一下如何操作：\n\
    \n```\n<p id=\"foo\" style=\"display: none;\">\n  This fades in\n</p>\n```\n\n\
    以及用于设置它的 jQuery 代码：\n\n```\n$(function() {\n  $('#foo').fadeIn('slow');\n});\n\
    ```\n\n要使用 `fadeIn`，请这样做：\n\n```\n<p fade-in=\"true\">\n  This fades in\n</p>\n\
    ```\n\n当然，还需要对应的指令：\n\n```\nblog.directive('fadeIn', function () {\n  return function\
    \ (scope, element, attrs) {\n    return function (scope, element, attrs) {\n \
    \     element.css('opacity', 0); // css 在 jqLite 中可用\n      scope.$watch(attrs.fadeIn,\
    \ function (val) {\n        if (val) {\n          element.animate({'opacity':\
    \ '1.0'}, 1000); // 必须使用原生的 jquery 才能使用 animate()\n        } else {\n        \
    \  element.animate({'opacity': '0'}, 1000);\n        }\n      });\n    };\n  };\n\
    });\n```\n\n请注意，我们并没有充分利用该指令对模型的监听（watch）；我们只是传入了 true 以便在加载时立即执行动画。如果我们愿意，可以指定一个布尔模型，每当该模型发生变化时，节点就会淡入或淡出。\n\
    \n![](img/f95c537c2fc9346a21a144b89cfac580_76_0.png)\n\n虽然这种实现方式多写了几行代码，但如果你在各处都这么做，最终会为你节省大量代码。通常你可以预期，如果你编写一个可复用的指令，尽管前期成本较高，但最终会为你节省大量的\
    \ JavaScript 代码。\n\n## 自定义验证\n\n我需要验证一个“时间”字段。这个时间必须是未来的某个日期/时间，但不能在未来 *太* 远。由于没有时间选择器组件（我想我们可以写一个），我们直接使用文本输入框并对其运行自定义验证。用户必须输入一个可解析的日期/时间。我们的标记将如下所示：\n\
    \n```\n<form name=\"timeForm\">\n  <input name=\"time\" type=\"text\" futureTime\
    \ placeholder=\"enter a time\" ng-model=\"time\"/>\n</form>\n```\n\n请注意，要使用 AngularJS\
    \ 的验证机制，必须使用表单（form）。如果有必要，你可以嵌套表单（使用 `ngForm`），但我们在这里不这样做。这是 `futureTime` 指令：\n\
    \n```\n// futureTime 指令在用户输入一个可解析的未来时间时，设置文本输入框的有效性\nblog.directive('futureTime',\
    \ function() {\n    return {\n        require: '?ngModel',\n        link: function(scope,\
    \ elm, attrs, ngModel) {\n\n            // jqLite 中没有 'get()'；将 elm 视为数组以获取 DOM\
    \ 节点对象\n            if (!ngModel || attrs.type !== 'text' || elm[0].tagName.toLowerCase()\
    \ !== 'input') {\n                return; // 如果未指定 ngModel 或输入字段类型不是 \"text\"\
    ，则不做任何操作\n            }\n\n            // 我们希望将其作为第一个检查项，以防有其他检查。\n          \
    \  // 从此函数返回的任何内容最终都将作为视图值，因此如果你\n            // 想要清除无效输入，只需不返回任何内容。\n       \
    \     ngModel.$parsers.unshift(function(view_value) {\n                var ts,\
    \ nows;\n                // 第一种情况：字段为空。这是允许的\n                if (!view_value)\
    \ {\n                    ngModel.$setValidity('futureTime', true);\n         \
    \           return;\n                }\n\n                // 第二种情况：不可解析的日期\n \
    \               ts = Date.parse(view_value);\n                if (isNaN(ts) ||\
    \ ts < 0) {\n                    ngModel.$setValidity('futureTime', false);\n\
    \                    return view_value;\n                }\n\n               \
    \ // 第三种情况：日期有效，但处于过去或现在\n                nows = new Date().getTime();\n     \
    \           if (ts <= nows) {\n                    ngModel.$setValidity('futureTime',\
    \ false);\n                    return view_value;\n                }\n\n     \
    \           // 第四种情况：未来日期！\n                ngModel.$setValidity('futureTime',\
    \ true);\n                return view_value;\n            });\n        }\n   \
    \ };\n});\n```\n\n既然有了表单，我们就可以使用 AngularJS 内置的验证。让我们将 HTML 片段修改为：\n\n```\n<form\
    \ name=\"timeForm\">\n  <input name=\"time\" type=\"text\" future-time placeholder=\"\
    enter a time\" ng-model=\"time\"/>\n  <div style=\"color: red\" ng-show=\"timeForm.time.$error.futureTime\"\
    >This is not a valid future time.</div>\n</form>\n```\n\n当我们为 `<form>` 命名时，它会触发\
    \ AngularJS 内置的表单指令。这会在 scope 中放入一个代表该表单的模型，名称与表单名称相同。因此，既然我们将表单命名为 \"timeForm\"\
    ，它就可以在 scope 上使用。此外，该表单内任何命名的表单字段都可以作为表单模型中的对象被访问。由于我们有一个名为 \"time\" 的 `<input>`，我们可以将其引用为\
    \ `timeForm.time`。请注意，这并不代表表单元素的实际值；那是由 `ngModel` 负责的。\n\n```\n<form name=\"foo\"\
    >\n  <input name=\"bar\" required=\"true\"/>\n</form>\n```\n\n![](img/f95c537c2fc9346a21a144b89cfac580_79_0.png)\n\
    \n以这种方式进行验证时，AngularJS 会在输入字段模型中设置一些特殊值，其中之一是 `$error`。当我们执行 ` rigorous. $setValidity('something',\
    \ false);` 时，我们是在告诉 AngularJS 该模型中存在错误，且该错误的验证错误键为 \"something\"。如果存在问题，该值为布尔值\
    \ true，否则为 false。此外，AngularJS 还会给表单元素添加一个类。如果你在表单中有一个驼峰命名（someCamelCase）的验证错误键，它会根据情况在元素上加上\
    \ `ng-valid-some-camel-case` 或 `ng-invalid-some-camel-case` 类。这样，如果你愿意，可以非常轻松地将错误的字段标红。\n\
    \n这只是如何进行自定义验证的一个示例。凭借类名和数据绑定的布尔值，它可以适应多种错误报告配置。稍后我们将进行另一个“食谱”风格的表单验证示例。\n\n以下是我们为\
    \ `futureTime` 指令编写的一些测试：\n\n```\ndescribe('Binding Directives', function () {\n\
    \  var $compile, scope;\n\n  // 这是一个在对指令进行单元测试时使用的辅助函数；\n  // 你会发现自己经常这样做\n  function\
    \ compileAndApply(template) {\n    var compiled = $compile(template)(scope);\n\
    \    scope.$apply();\n    scope.$digest();\n    return compiled;\n  }\n\n  beforeEach(inject(function\
    \ ($injector, $rootScope) {\n    $compile = $injector.get('$compile');\n    scope\
    \ = $rootScope.$new();\n  }));\n\n  describe('the linking function', function\
    \ () {\n```\n\n```\nit('should not throw error if no ngModel supplied', function\
    \ () {\n    var template = '<form name=\"timeForm\">' +\n        '<input name=\"\
    time\" type=\"text\" future-time/>' +\n        '</form>';\n    expect(function\
    \ () {\n        compileAndApply(template);\n    }).not.toThrow();\n});\n```\n\n\
    ```\nit('should be valid on undefined value', function () {\n    var template\
    \ = '<form name=\"timeForm\">' +\n        '<input ng-model=\"time\" name=\"time\"\
    \ type=\"text\" future-time/>' +\n        '</form>';\n    compileAndApply(template);\n\
    \    expect(scope.time).toBeUndefined();\n    expect(scope.timeForm.$valid).toBeTruthy();\n\
    });\n```\n\n```\nit('should be invalid on non-parseable date', function () {\n\
    \    var template = '<form name=\"timeForm\">' +\n        '<input ng-model=\"\
    time\" name=\"time\" type=\"text\" future-time/>' +\n        '</form>';\n    compiled\
    \ = compileAndApply(template);\n\n    // 这似乎是模拟输入更改的方法。\n    compiled.find('input').val('not\
    \ a date');\n    compiled.find('input').triggerHandler('input');\n    expect(scope.timeForm.$valid).toBeFalsy();\n\
    });\n```\n\n```\nit('should be invalid on past date', function () {\n    var template\
    \ = '<form name=\"timeForm\">' +\n        '<input ng-model=\"time\" name=\"time\"\
    \ type=\"text\" future-time/>' +\n        '</form>';\n    compiled = compileAndApply(template);\n\
    \n    compiled.find('input').val('1998-01-01');\n    compiled.find('input').triggerHandler('input');\n\
    \n    expect(scope.timeForm.$valid).toBeFalsy();\n});\n```\n\n```\nit('should\
    \ be valid on future date', function () {\n    var template = '<form name=\"timeForm\"\
    >' +\n        '<input ng-model=\"time\" name=\"time\" type=\"text\" future-time/>'\
    \ +\n        '</form>';\n    compiled = compileAndApply(template);\n\n    compiled.find('input').val('2050-01-01');\n\
    \    compiled.find('input').triggerHandler('input');\n\n    expect(scope.timeForm.$valid).toBeTruthy();\n\
    });\n});\n```\n\n到这里我们揭开了指令的神秘面纱，它们真正功能强大。编写可复用且通用的指令至关重要——它们的可复用性越低（例如，通过污染 scope），当你以后重新审视它们时，就会陷入越深的维护噩梦，甚至让你在噩梦中惊醒。\n\
    \n接下来我们将进一步学习指令：何时使用它们，如何编写可复用指令，如何使用隔离 scope，以及编译（compilation）和链接（linking）之间的区别。\n"
