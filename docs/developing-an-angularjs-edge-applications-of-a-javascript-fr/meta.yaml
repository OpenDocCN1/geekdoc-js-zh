  md: "# Even/Odd Rows\n\nIt's often highly desirable to change the CSS of a row in\
    \ a table based on whether it's an even or odd row. This is incredibly easy to\
    \ do in AngularJS using the ngClassEven and ngClassOdd directives:\n\n```\n<div\
    \ id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:order:descending|filter:filter\"\
    \n     ng-class-even=\"'even'\" ng-class-odd=\"'odd'\">\n    <!-- bunch of stuff\
    \ eliminated for sake of brevity -->\n</div>\n```\n\nNow, each <div> in our list\
    \ of posts will be tagged with either an even class or an odd class, depending.\
    \ Simply set up your CSS and have one of these alter the background color slightly,\
    \ and you're set. Feel free to use a table instead."
  merge: -1
