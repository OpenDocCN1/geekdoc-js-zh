    \    }));\n});\n```\n\n```\ndescribe('cancel', function () {\n    it('should call\
    \ Post.prototype.stopEditing', inject(function (Post) {\n        var post = new\
    \ Post();\n        spyOn(Post.prototype, 'stopEditing');\n        scope.$apply(function\
    \ () {\n            scope.cancel(post);\n        });\n        expect(Post.prototype.stopEditing).toHaveBeenCalled();\n\
