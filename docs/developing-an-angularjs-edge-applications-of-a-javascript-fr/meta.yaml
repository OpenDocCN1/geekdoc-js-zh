  md: '# # Curlies And You


    By now you may be asking yourself why some stuff like `{{post.title}}` is wrapped
    in curlies and post.body is not. The general rule is this: any reference to a
    model or function in your view that is *not* part of a directive (custom attribute
    or tag) will need to be wrapped in curly braces, *unless otherwise specified*.
    For example, `{{post.title}}` is in an HTML text node, which is not a directive.
    The attribute id in the <div> is also not a directive, though it is an attribute.
    The call to `ngBindHtmlUnsafe` is a directive, and we don''t need curly braces
    there.


    A counterexample is the `ngHref` directive, which wants curlies. You can read
    more about the `ngHref` directive in the API docs ([http://docs.angularjs.org/api/ng.directive:ngHref](http://docs.angularjs.org/api/ng.directive:ngHref)),
    and why you''d use it, but to insert the value of model bar into our URL, the
    directive looks like:


    ```

    `<a ng-href="http://www.foo.{{bar}}.baz">`

    ```'
