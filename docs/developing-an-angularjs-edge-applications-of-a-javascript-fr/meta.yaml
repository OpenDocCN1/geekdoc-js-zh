    # Common functionality between directives


    If you have similar directives, it may be a good idea to reuse functions. For
    example, two directives with a common link method, or two directives putting the
    same function into their scopes. The best way I''ve found to deal with this is
    to simply create a service or factory and share the functions by good old dependency
    injection.


    The purpose of putting `<debug-zone>` around these two is to allow them to both
    use the same instance of a controller. The linking functions in both, obviously
    violating DRY (don''t repeat yourself) principles, simply grab some functions
    out of the directive controller and put them into the scope, so the directives''
    templates can use them (we could avoid needing to do this by putting the debug
    and toggle functions into the injected `$scope` and not using isolate scopes,
    but let''s keep it this way for sake of example).


    Since these two directives share one instance of the controller, what happens
    is any interaction with that controller by either template can cause the other
    to change its behavior. In practice, this means when you click the “toggle” button
    on either directive, it closes both of the directives, because they share the
    same “minimized” flag!


    You could likely simulate this type of behavior by throwing functions into parent
    scopes and calling them from within scope member directives, but in large applications
    it can become crucial to limit the amount of information in the scope—especially
    if you are nesting a lot of controllers. This technique allows directives to interact
    without having to put anything at all in the scope hierarchy.


    # Compilation vs. Linking


    Sometimes you will want to specify a compile function instead of a link function.
    You will supply one but not both. If you supply a compile function you will be
    expected to return a linking function from this.


    What''s the difference? In simplest terms, compilation does not have a scope,
    and happens before linking does. If you do not need a scope in your directive,
    then use a compile function; this will be faster. If you need to modify a template
    for whatever reason, use a compile function. But, 9 times out of 10 you will want
    to use link, because you probably care about what''s going on in the scope.


    # Conclusion


    A detailed explanation of the difference between compilation and linking is available
    in the AngularJS developer''s guide.


    Due to the godlike power of directives, their use comes at a cost. It''s not the
    world''s steepest learning curve, but do kick yourself in the face if you can''t
    figure it out on the first pass. Read other directives, like those supplied by
    the Angular-UI project (http://angular-ui.github.com); see how they work. Play
    around with them on Plunker'
