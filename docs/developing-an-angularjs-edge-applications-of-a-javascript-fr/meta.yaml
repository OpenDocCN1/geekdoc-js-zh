  md: '# # Controls


    Let’s look at the controls.


    # ## Making a Button Click Do Something


    You probably have some markup already, and it looks like this:


    ```

    <button>Alert My Name</button>

    ```


    To make a click on this button do something, you will use the `ngClick` directive.
    In order to do something, you must supply the `ngClick` directive with an AngularJS
    expression. Typically this will be a function, like so:


    ```

    <button ng-click="myAlert()">Alert My Name</button>

    ```


    Or you may even be able to get away with assignment in the markup, depending on
    what you wish to do:


    ```

    <button ng-click="name = ''Chris''">My Name Is Now Chris</button>

    ```


    But, of course, this is not a complete AngularJS application. This is, however,
    and will actually work:


    # ## Using Anchor (<a>) Tags


    You probably will be using <a> tags somewhere in your application, and they probably
    don’t do what the <a> tag was originally intended to do. Instead, they execute
    some JavaScript function. My recommendation is to write your anchor tags this
    way:


    ```

    <a ng-click="doSomethingHeinous()">Click me</a>

    ```


    Note the lack of an href attribute. You do not need # or javascript: or some such
    nonsense. This is on purpose; AngularJS has its own directive, and this directive
    will automatically prevent the default action an anchor tag is supposed to take
    if the href is missing.


    But, if you did want to use the <a> tag in the way it was intended, you may want
    to do something like dynamically generate a URL. This will not work:


    ```

    <a href="http://essentialvinegars.com/?id={{id}}">Buy Smelly Vinegar</a>

    ```


    If the user clicks this link before AngularJS has processed the template fully,
    they will wind up at that URL as you have written it verbatim. You should use
    the `ngHref` directive instead:


    ```

    <a ng-href="http://essentialvinegars.com/?id={{id}}">Buy Smelly Vinegar</a>

    ```


    AngularJS will sit on the <a> tag and it will do nothing until the contents of
    `ngHref` are'
