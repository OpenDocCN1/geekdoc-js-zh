  md: "# Comment-Type Directive\n\nThe following is an example of a comment-type directive:\n\
    \n```\nblog.directive('copyright', function () {\n    return {\n        restrict:\
    \ 'M',\n        compile: function (element) {\n            element.text('Copyright\
    \ 2013 Rhoda Bote');\n        }\n    };\n});\n```\n\nAnd the usage of a comment-type\
    \ directive:\n\n```\n<!-- directive: copyright -->\n```\n\nHere is the output\
    \ (what you get when you inspect the markup):\n\n```\n<!-- Copyright 2013 Rhoda\
    \ Bote -->\n```\n\nI've found that creating comment directives is a little different\
    \ than dealing with elements. Typically when replacing elements with a template\
    \ or other elements, you would use the replace and/or transclude options of the\
    \ copyright object. However, those require HTMLElement objects to function properly,\
    \ not Comment objects. So if we want to do something incredibly simple like replace\
    \ some text with other text, we can use the `text()` method.\n\nNote that this\
    \ directive uses compile instead of link. The only reason I made this decision\
    \ was because we did not need a scope. A scope would have variables and functions\
    \ and who-knows-what in it, and all we needed was some static text. To sum up:\
    \ Need a scope? Link. Don't? Compile."
  merge: -1
