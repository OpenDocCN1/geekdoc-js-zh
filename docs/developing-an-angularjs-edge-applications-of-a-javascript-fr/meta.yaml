    \ {\n    if (foo) {\n        successFn();\n    } else {\n        $window.clearTimeout(t);\n\
    \        errorFn();\n    }\n}, 1000);\n\nvar p = $timeout(function() {\n    if\
    \ (!foo) {\n        $timeout.cancel(p);\n    }\n}, 1000).then(successFn, errorFn);\n\
    ```\n\nThe promise is resolved when the timeout function executes successfully\
    \ without being cancelled, and the `successFn` function is executed automatically.\
    \ As you can see this actually saves you a bit of code.\n\nBy default, `$timeout`\
    \ executes inside a digest loop. If you are not modifying the scope within the\
    \ timeout function, you can inhibit this behavior to save some cycles. As a third\
    \ parameter, pass false and the timeout function will not be executed inside an\
    \ `$apply` block.\n\n### Chaining Promises\n\nAs in the first example, you can\
    \ chain promises. The pattern looks like this:\n\n```\n$http.get('foo.url')\n\
    \    .then(function (res) {\n        // do stuff with res\n        if (something)\
    \ {\n            return $q.reject(first_sad_obj);\n        }\n        return first_happy_obj;\n\
    \    }, function (res) {\n        // do other stuff with res\n        return first_sad_obj;\n\
    \    })\n    .then(function (first_happy_obj) {\n        // do stuff\n       \
    \ if (something_else) {\n            return $q.reject(second_sad_obj);\n     \
    \   }\n        return second_happy_obj;\n    }, function (first_sad_obj) {\n \
    \       // more stuff to do\n        return second_sad_obj;\n    })\n    .then(function\
    \ (second_happy_obj) {\n        // success\n    }, function (second_sad_obj) {\n\
    \        // failure. etc.\n    });\n```"
  mdcn: "\n## 路由的单元测试\n\n这在功能测试中可能更有意义。因此在我们的单元测试中，让我们改为模拟 `$routeParams`：\n\n```\n\
    describe('ContentCtrl', function () {\n    it('should put a single post in the\
    \ scope if an ID appears in $routeParams', function () {\n        inject(function\
    \ (Posts, Post, $httpBackend, $http) {\n            $http.defaults.transformRequest\
    \ = []; // remove any fancy request transforms\n            // mock $routeParams;\
    \ assume they got set by $route service\n            var $routeParams = {\n  \
    \              id: 1\n            };\n            posts = [\n                {id:\
    \ 1, title: 'foo'},\n                {id: 2, title: 'bar'}\n            ];\n\n\
    \            $httpBackend.expectGET('data.json').respond({posts: posts});\n  \
    \          $controller('ContentCtrl', {$scope: scope, Posts: Posts,\n        \
    \        Post: Post, $routeParams: $routeParams});\n            $httpBackend.flush();\n\
    \            expect(scope.post).toBe(posts[0]);\n            expect(scope.posts).toEqual([]);\n\
