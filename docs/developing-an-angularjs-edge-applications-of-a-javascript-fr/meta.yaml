    # # The Directive


    What is a directive? It’s an HTML attribute, tag, or comment that can execute
    any behavior (including modifying the DOM) based on its attributes and often times,
    scope. There are lots of directives included within AngularJS to do many common
    tasks, and they all begin with `ng` (“ng” sounds kind of like “Ang” in “AngularJS”
    so that’s why they chose the prefix). For example, the `ngShow` directive will
    allow you to show or hide (using the CSS `display` property) a block of HTML,
    based on the truthiness of a model or executed function.


    The scope, markup, and services all go into a directive, and out comes markup
    with JS functionality (events).


    > > **TIP ng-show vs. ngShow**

    >

    > `ngShow` is the proper name for the directive; these should always be camelCased,
    and you are encouraged to name your own directives this way. `ng-show` is one
    possibility of how you would reference it in a view. Also supported are `ng:show`,
    `ng_show`, `x-ng-show` and `data-ng-show`. Whew!


    Why create a custom directive? There are many reasons. Say you had a custom widget—some
    HTML fragment—that should accept some parameters and render itself based upon
    those parameters. For example, a directive that renders a `<ul>` based on a comma-separated
    list of values. Or you could apply some sort of fancy animation effect to an HTML
    node. Or you could take a jQuery plugin (like Twitter Bootstrap''s `tooltip()`)
    and put your tooltip contents directly into the HTML instead of having to write
    another line of JavaScript. The possibilities, while perhaps not endless, are
    many.


    ![](img/f95c537c2fc9346a21a144b89cfac580_21_0.png)


    # ### Logic? In _my_ markup? It''s more common than you think.


    The separation of logic from the view is a common, and valid, concern. With AngularJS,
    you are going to be putting logic into your markup, perhaps much more than you
    would with any other JavaScript framework. Some people (maybe you!) find this
    incredibly icky. And that''s OK. However, AngularJS is designed with this paradigm
    in mind. The rationale is fairly simple though: if you use a templating language
    (server-side, client-side, it doesn''t matter), you are going to have logic in
    your view. Designers are going to see it if they are working with your markup.
    AngularJS does not pretend that this isn''t happening—instead, it embraces logic
    in the view. It''s just that the logic takes place in a directive, which is written
    as part of the markup itself. It is truly a powerful way of developing for the
    web, and in the end will save you many lines of code. So if you are unsure, take
    the plunge and decide for yourself:'
