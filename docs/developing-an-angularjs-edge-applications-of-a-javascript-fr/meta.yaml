  - "[PAGE 70]\n\n# Comment-Type Directive\n\nThe following is an example of a comment-type\
    \ directive:\n\n```\nblog.directive('copyright', function () {\n    return {\n\
    \        restrict: 'M',\n        compile: function (element) {\n            element.text('Copyright\
    \ 2013 Rhoda Bote');\n        }\n    };\n});\n```\n\nAnd the usage of a comment-type\
    \ directive:\n\n```\n<!-- directive: copyright -->\n```\n\nHere is the output\
    \ (what you get when you inspect the markup):\n\n```\n<!-- Copyright 2013 Rhoda\
    \ Bote -->\n```\n\nI've found that creating comment directives is a little different\
    \ than dealing with elements. Typically when replacing elements with a template\
    \ or other elements, you would use the replace and/or transclude options of the\
    \ copyright object. However, those require HTMLElement objects to function properly,\
    \ not Comment objects. So if we want to do something incredibly simple like replace\
    \ some text with other text, we can use the `text()` method.\n\nNote that this\
    \ directive uses compile instead of link. The only reason I made this decision\
    \ was because we did not need a scope. A scope would have variables and functions\
    \ and who-knows-what in it, and all we needed was some static text. To sum up:\
    \ Need a scope? Link. Don't? Compile."
- md: "## Element-Type Directive\n\nHere’s an example of using an element directive:\n\
    \n```javascript\n// This directive replaces <new-post-area> with the template\
    \ below\n// it links the post, cancel and save attribs to the parent scope,\n\
    // but it copies cancelText and saveText verbatim.\nblog.directive('newPostArea',\
    \ function() {\n    return {\n        restrict: 'E',\n        scope: {\n     \
    \       post: '=',\n            cancel: '=',\n            save: '=',\n       \
    \     cancelText: '@',\n            saveText: '@'\n        },\n        replace:\
    \ true,\n        template: '<div ng-show=\"post\">' +\n                  '<input\
    \ type=\"text\" ng-model=\"post.temp.title\"/><br/>' +\n                  '<textarea\
    \ ng-model=\"post.temp.body\"></textarea><br/>' +\n                  '<button\
    \ ng-click=\"cancel(post)\">{{cancelText}}</button>' +\n                  '<button\
    \ ng-click=\"save(post)\">{{saveText}}</button></div>'\n    };\n});\n```\n\nUsage:\n\
    \n```html\n<new-post-area post=\"new_post\" cancel-text=\"Cancel\" cancel=\"cancel\"\
    \ save-text=\"Save\" save=\"save\"></new-post-area>\n```\n\nOutput as reported\
    \ by Chrome, anyway:\n\n```html\n<div ng-show=\"post\" post=\"new_post\" cancel=\"\
    cancel\" save=\"save\" style=\"\">\n    <input type=\"text\" ng-model=\"post.temp.title\"\
    \ class=\"ng-valid ng-dirty\"><br>\n    <textarea ng-model=\"post.temp.body\"\
    \ class=\"ng-valid ng-dirty\"></textarea><br>\n    <button ng-click=\"cancel(post)\"\
    >Cancel</button><button ng-click=\"save(post)\">Save</button>\n</div>\n```\n\n\
    The resulting HTML works by binding scope properties. We have a property in our\
    \ scope, new_post, where we store new post information. We give the directive\
    \ that, and bind it to the directive’s scope using the scope key. Normally directives\
    \ do not create their own scope, but this one does. In fact, it creates something\
    \ called an isolate scope which does not prototypically inherit from its parent.\
    \ We declare explicitly what ends up in the scope via the definition object. The\
    \ scope definition object (the “scope: ..” bit) is completely opaque and requires\
    \ discussion. Later.\n\n## Class-Type Directive\n\nFinally, we have a class-type\
    \ directive. Basically this means you can use a class attribute on any HTML tag,\
    \ and AngularJS will process it accordingly. This may be handy if you have CSS\
    \ styles associated with the directive name, or want to use the directive name\
    \ in a jQuery selector, for some reason.\n\n```javascript\n// This directive is\
    \ like the \"!important\" CSS value on steroids.\n// it will automatically use\
    \ JavaScript to override whatever CSS a node may have on it.\n// I think this\
    \ is probably a terrible idea.\nblog.directive('importantBackgroundColor', function()\
    \ {\n    return {\n        restrict: 'C',\n        priority: -99999, // we want\
    \ this to be run dead last\n        // we don't use compile because we want to\
    \ do this at the last possible minute\n        link: function(scope, element,\
    \ attribs) {\n            element.css('background-color', attribs.color);\n  \
    \      }\n    };\n});\n```\n\nUsage:\n\n```html\n<div class=\"important-background-color\"\
    \ color=\"#EEE\">fleas</div>\n```\n\nThis outputs nothing different, but if you\
    \ inspect the element it will have a style attribute equal to background-color:\
    \ #EEE or something similar. This will override any CSS style you may have written,\
    \ or any !important CSS style you may have written, which makes this very important\
    \ indeed. The priority key here is used to tell the directive to compile and link\
    \ *absolutely last* (or close to it) compared to other directives that may be\
    \ on the same node. If there was a competing directive that did the same thing\
    \ as this with an even *lower* priority, it would override the resulting background\
    \ color. Of course, something like this is only useful if you have a lot of legacy\
    \ CSS sitting around, preventing you from getting it quite right. You can use\
    \ this directive and add to the madness.\n\nThese were examples of restricting\
    \ directives to certain usages. Next, let's cover some more directive concepts.\n\
    \n## The Widget\n\nI don't think there's any formal definition for what a widget\
    \ is, but often I've heard it used to reference a UI element, particularly one\
    \ that a user can interact with in some way. Maybe this is a date picker or a\
    \ rich text editor. But these can also be very simple, like this dead-simple example\
    \ of an accordion:\n\n```javascript\nblog.directive('accordion', function() {\n\
    \    return {\n        restrict: 'E',\n        replace: true,\n        template:\
    \ '<div class=\"accordion\"><h3>{{title}}</h3>' +\n                  '<div class=\"\
    accordion-content\" ng-show=\"open\" ng-transclude></div>',\n        transclude:\
    \ true,\n        scope: {\n            title: '='\n        },\n        link: function(scope,\
    \ elm) {\n            scope.open = false;\n            // assume we have no jQuery.\n\
    \            angular.element(elm.children()[0]).bind('click', function() {\n \
    \               scope.$apply('open = !open');\n            });\n        }\n  \
    \  };\n});\n```\n\nOK, maybe not *dead* simple, but it's definitely maimed. Let's\
    \ go at it one piece at a time.\n\n- **restrict**: We've already covered the E\
    \ restriction, which tells AngularJS the directive is to be used as an element;\
    \ `<accordion>...</accordion>`.\n- **replace**: We want the directive to replace\
    \ the `<accordion>...</accordion>` markup in our HTML with the template, which\
    \ is specified by...\n- **template**: Nothing new here except the use of the `ngTransclude`\
    \ directive. If you have this somewhere in your template, and specify...\n- **transclude**:\
    \ ...to be true, then the contents of the original HTML will be placed inside\
    \ the node that has the ngTransclude directive on it. So we can use this directive\
    \ like so: `<accordion>beans</accordion>` and \"beans\" will appear within the\
    \ `<div>` with the class accordion-content. The `ngTransclude` directive basically\
    \ just says \"put the directive's original content here.\"\n- **scope**: This\
    \ loathsome object tells us to create an isolate scope, and within that scope\
    \ create a model called \"title\", and the value of this model will be the value\
    \ of the attribute \"title\" in the directive. So: `<accordion title=\"'pinto'\"\
    >beans</accordion>` will give the directive a title to work with. Note that the\
    \ value of the title attribute here is a string, but it could be the value of\
    \ whatever AngularJS expression you wish.\n\nThe keys of this object are the names\
    \ of members of the new isolate scope, and the values are describing how to get\
    \ these values. A `=` will link directly to a model in the parent scope *with\
    \ the same name*. `=foo` will link to a model in the parent scope of the name\
    \ 'foo'. A `@` will treat your attribute *with the same name* as a string, basically.\
    \ `@foo` will look for an attribute called foo and assign it to whatever the key\
    \ is. `&` allows you to bind an expression and execute it against the parent scope\
    \ with a function. Given `{localFn: '&'}`, the directive will look for a 'local-fn'\
    \ attribute and put its value (say, \"foo + 2\") into a function. When you are\
    \ ready, execute `localFn()`, and the result will be evaluated against the parent\
    \ scope and returned. If the expression contains a function with arguments, you\
    \ can pass arguments as a name/value mapping into the localFn: if the expression\
    \ is “foo(bar)”, you may say `localFn({bar: ‘baz’})` and ‘baz’ will be passed\
    \ in as ‘bar’ to the ‘foo’ function in the expression.\n\n- **link**: What do\
    \ we get in elm? We get the root element of our template, which is the `<div>`\
    \ with the accordion class. First, we set open to be false to control the visibility\
    \ of the accordion’s content. Then we grab the `<h3>` node (remember, no selectors\
    \ in jQLite) and bind a click event to it, which simply flips the boolean value\
    \ of the open model—which, in turn, hides and shows the content.\n\nThe markup\
    \ for this looks like:\n\n```html\n<!-- Usage of our accordion directive -->\n\
    <accordion title=\"I like..\">pinto beans!</accordion>\n```\n\nEasy and neat.\
    \ Output looks something like:\n\n```html\n<div class=\"accordion\">\n  <h3>I\
    \ like..</h3>\n  <div class=\"accordion-content\" ng-show=\"open\" ng-transclude>pinto\
    \ beans!</div>\n</div>\n```\n\nThe `<h3>` node, when clicked, will hide and show\
    \ the its sibling `<div>`. You could also implement a dropdown-type menu this\
    \ way using some CSS and HTML lists."
  mdcn: "\n## 元素类型指令\n\n以下是一个使用元素指令的示例：\n\n```javascript\n// This directive replaces\
    \ <new-post-area> with the template below\n// it links the post, cancel and save\
    \ attribs to the parent scope,\n// but it copies cancelText and saveText verbatim.\n\
    blog.directive('newPostArea', function() {\n    return {\n        restrict: 'E',\n\
    \        scope: {\n            post: '=',\n            cancel: '=',\n        \
    \    save: '=',\n            cancelText: '@',\n            saveText: '@'\n   \
    \     },\n        replace: true,\n        template: '<div ng-show=\"post\">' +\n\
    \                  '<input type=\"text\" ng-model=\"post.temp.title\"/><br/>'\
    \ +\n                  '<textarea ng-model=\"post.temp.body\"></textarea><br/>'\
    \ +\n                  '<button ng-click=\"cancel(post)\">{{cancelText}}</button>'\
    \ +\n                  '<button ng-click=\"save(post)\">{{saveText}}</button></div>'\n\
    \    };\n});\n```\n\n用法：\n\n```html\n<new-post-area post=\"new_post\" cancel-text=\"\
    Cancel\" cancel=\"cancel\" save-text=\"Save\" save=\"save\"></new-post-area>\n\
    ```\n\n不管怎样，Chrome 报告的输出如下：\n\n```html\n<div ng-show=\"post\" post=\"new_post\"\
    \ cancel=\"cancel\" save=\"save\" style=\"\">\n    <input type=\"text\" ng-model=\"\
    post.temp.title\" class=\"ng-valid ng-dirty\"><br>\n    <textarea ng-model=\"\
    post.temp.body\" class=\"ng-valid ng-dirty\"></textarea><br>\n    <button ng-click=\"\
    cancel(post)\">Cancel</button><button ng-click=\"save(post)\">Save</button>\n\
    </div>\n```\n\n最终生成的 HTML 通过绑定作用域属性来工作。我们在作用域中有一个名为 `new_post` 的属性，用于存储新文章的信息。我们将该属性传递给指令，并使用\
    \ scope 键将其绑定到指令的作用域。通常指令不会创建自己的作用域，但这个指令确实创建了。实际上，它创建了一种叫做隔离作用域的东西，不会原型继承其父作用域。我们通过定义对象显式声明哪些内容最终进入作用域。作用域定义对象（即\
    \ `scope: ..` 那部分）完全不透明，需要专门讨论。稍后会详细介绍。\n\n## 类类型指令\n\n最后，我们来看类类型指令。基本上这意味着你可以在任何\
    \ HTML 标签上使用 class 属性，AngularJS 会相应地处理它。如果你的 CSS 样式与指令名称关联，或者由于某些原因想在 jQuery 选择器中使用指令名称，这会很方便。\n\
    \n```javascript\n// This directive is like the \"!important\" CSS value on steroids.\n\
    // it will automatically use JavaScript to override whatever CSS a node may have\
    \ on it.\n// I think this is probably a terrible idea.\nblog.directive('importantBackgroundColor',\
    \ function() {\n    return {\n        restrict: 'C',\n        priority: -99999,\
    \ // we want this to be run dead last\n        // we don't use compile because\
    \ we want to do this at the last possible minute\n        link: function(scope,\
    \ element, attribs) {\n            element.css('background-color', attribs.color);\n\
    \        }\n    };\n});\n```\n\n用法：\n\n```html\n<div class=\"important-background-color\"\
    \ color=\"#EEE\">fleas</div>\n```\n\n这不会输出不同的内容，但如果你检查该元素，它会有一个 style 属性，值等于 `background-color:\
    \ #EEE` 或类似的样式。这会覆盖你可能编写的任何 CSS 样式，或者你可能编写的任何 `!important` CSS 样式，这确实使它变得非常重要。这里的\
    \ priority 键用于告诉指令相对于同一节点上可能存在的其他指令，*绝对最后*（或接近最后）进行编译和链接。如果存在一个竞争指令做着同样的事情，但优先级*更低*，它将覆盖最终的背景颜色。当然，像这样的东西只有在你有大量遗留\
    \ CSS 妨碍你正确实现效果时才有用。你可以使用这个指令来增加更多混乱。\n\n以上是指令限制为特定用法的示例。接下来，让我们介绍更多指令概念。\n\n\
    ## Widget（小组件）\n\n我认为 widget 没有正式的定义，但我经常听到它被用来指代 UI 元素，特别是用户可以以某种方式交互的元素。也许是日期选择器或富文本编辑器。但它们也可以非常简单，比如这个极其简单的手风琴组件示例：\n\
    \n```javascript\nblog.directive('accordion', function() {\n    return {\n    \
    \    restrict: 'E',\n        replace: true,\n        template: '<div class=\"\
    accordion\"><h3>{{title}}</h3>' +\n                  '<div class=\"accordion-content\"\
    \ ng-show=\"open\" ng-transclude></div>',\n        transclude: true,\n       \
    \ scope: {\n            title: '='\n        },\n        link: function(scope,\
    \ elm) {\n            scope.open = false;\n            // assume we have no jQuery.\n\
    \            angular.element(elm.children()[0]).bind('click', function() {\n \
    \               scope.$apply('open = !open');\n            });\n        }\n  \
    \  };\n});\n```\n\n好吧，也许不是*极其*简单，但它确实被精简了不少。让我们逐部分讲解。\n\n- **restrict**：我们已经介绍过\
    \ E 限制，它告诉 AngularJS 该指令应作为元素使用；`<accordion>...</accordion>`。\n- **replace**：我们希望指令用模板替换\
    \ HTML 中的 `<accordion>...</accordion>` 标记，该模板通过以下方式指定……\n- **template**：这里没有新内容，只是使用了\
    \ `ngTransclude` 指令。如果你在模板的某处放置了它，并指定……\n- **transclude**：……为 true，那么原始 HTML 的内容将被放置在带有\
    \ ngTransclude 指令的节点内。因此我们可以这样使用该指令：`<accordion>beans</accordion>`，其中 \"beans\"\
    \ 将出现在带有 accordion-content 类的 `<div>` 内。`ngTransclude` 指令基本上就是说\"将指令的原始内容放在这里\"\
    。\n- **scope**：这个令人讨厌的对象告诉我们要创建一个隔离作用域，在该作用域内创建一个名为 \"title\" 的模型，该模型的值将是指令中 \"\
    title\" 属性的值。因此：`<accordion title=\"'pinto'\">beans</accordion>` 将为指令提供一个可用的 title。注意此处\
    \ title 属性的值是一个字符串，但它也可以是任何你想要的 AngularJS 表达式的值。\n\n该对象的键是新隔离作用域的成员名称，值则描述如何获取这些值。`=`\
    \ 将直接链接到父作用域中*同名*的模型。`=foo` 将链接到父作用域中名为 'foo' 的模型。`@` 基本上会将你*同名*的属性作为字符串处理。`@foo`\
    \ 将查找名为 foo 的属性并将其赋值给对应的键。`&` 允许你绑定一个表达式，并通过函数在父作用域中执行它。给定 `{localFn: '&'}`，指令将查找\
    \ `local-fn` 属性，并将其值（例如 \"foo + 2\"）放入一个函数中。当你准备好了，执行 `localFn()`，其结果将在父作用域中求值并返回。如果表达式包含带参数的函数，你可以通过名称/值映射将参数传入\
    \ localFn：如果表达式是 \"foo(bar)\"，你可以说 `localFn({bar: 'baz'})`，然后 'baz' 将作为 'bar'\
    \ 传递给表达式中的 'foo' 函数。\n\n- **link**：elm 中我们得到了什么？我们得到模板的根元素，即带有 accordion 类的 `<div>`。首先，我们将\
    \ open 设置为 false 以控制手风琴内容的可见性。然后我们获取 `<h3>` 节点（记住，在 jQLite 中没有选择器），并为其绑定一个 click\
    \ 事件，该事件只是翻转 open 模型的布尔值——这反过来控制内容的隐藏和显示。\n\n标记如下所示：\n\n```html\n<!-- Usage of\
    \ our accordion directive -->\n<accordion title=\"I like..\">pinto beans!</accordion>\n\
    ```\n\n简单而整洁。输出大致如下：\n\n```html\n<div class=\"accordion\">\n  <h3>I like..</h3>\n\
    \  <div class=\"accordion-content\" ng-show=\"open\" ng-transclude>pinto beans!</div>\n\
    </div>\n```\n\n`<h3>` 节点被点击时，将隐藏和显示其兄弟 `<div>`。你也可以用这种方式结合一些 CSS 和 HTML 列表来实现下拉菜单。\n"
