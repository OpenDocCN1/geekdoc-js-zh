    \ ever plan on compressing (not necessarily *minifying* by simply eliminating\
    \ whitespace and comments; by \"compressing\" I mean strategies like renaming\
    \ variables to shorter names) your JavaScript, the first syntax is perfectly acceptable.\
    \ The DI matching regular expression will run against your function as expected.\
    \ If you *do* plan on compressing your JavaScript, you should use the second syntax.\
    \ Because the service/constant/whatever name is stored in a string, AngularJS\
    \ will be able to ascertain what you meant by looking at the strings, even if\
    \ the parameters in the function call become shortened.\n\nThe third syntax is\
    \ even more straightforward:\n\n```\nfunction MyCtrl($scope, SomeOtherService)\
    \ {\n    ...\n}\n```\n\nYes, that's really all there is to it. The same conditions\
    \ apply here, of course; if you plan on compressing your code this will not work.\
    \ You must add the following after the function definition:\n\n```\nMyCtrl.$inject\
    \ = ['$scope', 'SomeOtherService'];\n```\n\nThis, like above, will store the parameter\
    \ names as strings and make them available to AngularJS upon compression.\n\n\
    Why would you want to use one or the other? The first two syntaxes keep variables\
    \ out of the local JavaScript scope. The third syntax pollutes the scope somewhat.\
    \ It also makes it a bit more straightforward to accomplish controller inheritance.\n\
    \n# Controller Inheritance\n\nYou won't need this. Most of what you want to do\
    \ can be placed inside of a Scope, and its prototypical inheritance will serve\
    \ you just fine. If you have common functionality shared between controllers that\
    \ are, say, siblings, consider putting that functionality in a parent controller,\
    \ or removing the functionality from the controllers altogether and using a service\
    \ or factory."
- md: "## Unit Testing\n\nYou can write unit test controllers, and you should. It's\
    \ very easy. Here's an example of testing our controller using Jasmine:\n\n```javascript\n\
    /*Global beforeEach, Describe, afterEach, Describe, module, expect, it, inject*/\n\
    (function () {\n\t'use strict';\n\t// grade the blog module before each test\n\
    \tbeforeModule('blog');\n\tdescribe('Blog Controller', function () {\n\t\tvar\
    \ $controller; // controller needs scope, so here's ours\n\t\t$controller = //\
    \ controller service to instantiate controllers\n\n\t\tbeforeEach(inject(function\
    \ ($injector, $rootScope) {\n\t\t\tscope = $rootScope.scope; // make brand new\
    \ child scope off of root\n\t\t\t$controller = $injector.get('$controller');\n\
    \t\t}));\n\n\t\tafterEach(function () {\n\t\t\tscope.$destroy(); // eliminate\
    \ our scope after each test run\n\t\t});\n\n\t\tdescribe('HeadCtrl', function\
    \ () {\n\t\t\t// all that HeadCtrl does is set a description. That's pretty easy\
    \ to test.\n\t\t\tit('should set the description', function () {\n\t\t\t\t$controller('HeadCtrl',\
    \ {scope: scope});\n\t\t\t\texpect(scope.description).toBe('My Important Blog');\n\
    \t\t\t});\n\t\t});\n\t});\n})();\n```\n\nAgain, to run this you will need a working\
    \ Testacular install with proper configuration file. There is very little interesting\
    \ about this configuration file, on the main, except the files array. Mine looks\
    \ similar to this:\n\n```json\n\"files\": [\n\t'JASMINE',\n\t'JASMINE_ADAPTER',\n\
    \t'/path/to/blog/angular-min.js',\n\t'/path/to/blog/angular.mocks.js',\n\t'/path/to/blog/blog.js',\n\
    \t'/path/to/blog/blogSpec.js'\n]\n```\n\nNote that we must explicitly include\
    \ AngularJS and the mocks module. Next, we include the code to be tested, and\
    \ finally the test file itself.\n\nThis file reads a little like a sentence, which\
    \ should help you to understand what's going on even if you are completely new\
    \ to unit testing. In a nutshell, the test (not the configuration file) declares,\
    \ \"The Blog Controllers' HeadCtrl should set the description to an explicit string.\"\
    \ We need to do a little setup before each test we run in order to get the proper\
    \ objects to test. Also, we do some cleanup afterwards. This is typical of constructing\
    \ unit test fixtures.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_66_0.png)\n\n\
    The assertion is made using AngularJS' `$controller` service. This service allows\
    \ you to instantiate a controller. When unit testing, you're going to find that\
    \ you often just call this service, pass it the proper parameters, then test the\
    \ contents of the *scope*. You generally don't need to save a reference to the\
    \ controller unless you are doing fancy things like controller inheritance, which\
    \ I discouraged earlier.\n\n## Conclusion\n\nControllers are for your business\
    \ logic. Keeping your controllers tidy leads to dead-easy unit test writing. Best\
    \ of all, they are not necessarily dependent on any view, so you could reuse their\
    \ functionality across your application. A controller is also a common place to\
    \ instantiate, declare or define models, since 99% of controllers will have a\
    \ `$scope` object available to them.\n\nIn the next chapter we'll look at directives;\
    \ truly the component that sets AngularJS apart from other frameworks.\n\n## Chapter\
    \ 6. Directives in Detail\n\nDirectives live in the view. Directives are likely\
    \ the hardest part of AngularJS to grasp, but also likely the most powerful. If\
    \ you can understand how to write a directive, you can save yourself writing a\
    \ lot of markup. Directives essentially extend HTML and you can use them to create\
    \ your own DSL (domain-specific language).\n\nDirectives are not injectable. There\
    \ is no sane way to access the behavior of a directive, and if you feel you need\
    \ to, you’re doing it wrong. They are meant to be put in the view and the view\
    \ only. Unlike filters, which *mainly* live in the view, there is no handy `$directive`\
    \ service to grab one. If you want one, you’ll have to put it in some markup and\
    \ compile and/or link your markup (which you can do programmatically via the `$compile`\
    \ service, but let’s not worry about that yet).\n\n## Adding Our Directive\n\n\
    We will start with a relatively trivial and useless directive, then provide more\
    \ examples of different directive types, and some special directives that you'd\
    \ use if you wanted certain behaviors; specifically custom form validation.\n\n\
    Our blog has a custom directive called `boldClick`, which toggles a bold font\
    \ weight to the HTML element the directive is used on, upon click. Here is an\
    \ example of handling this with a directive:\n\n```javascript\nblog.directive('boldClick',\
    \ function() {\n  return function(scope, element) {\n    var bold = false;\n \
    \   element.click(function() {\n      if (bold) {\n        element.css('font-weight',\
    \ 'normal');\n      } else {\n        element.css('font-weight', 'bold');\n  \
    \    }\n      bold = !bold;\n    });\n  };\n});\n```\n\nAnd in the view, it looks\
    \ like this:\n\n```html\nMy pet is a <span bold-click>tortoise</span>.\n```\n\n\
    Let's approach this line by line.\n\n- First off, we name our directive `boldClick`.\
    \ This is the common name for the directive, but when using it in a view we have\
    \ many different options, as discussed earlier (using any of them, such as bold-click,\
    \ will automatically be camelCased). A directive is a function that returns an\
    \ object (and in some simple cases, just a function).\n- In our object, we have\
    \ two keys: restrict and link. restrict tells AngularJS *how* the directive can\
    \ be used. This value can be nothing, E (element), A (attribute), C (class) or\
    \ M (comment). If omitted, it defaults to A, which means you can remove it from\
    \ your directive definition. If specified, AngularJS will throw an error if you\
    \ try to use your directive in an unintended way.\n- link defines a *linking*\
    \ function. Nine times out of ten, your directive will have a link, as it is the\
    \ most common situation. A linking function is passed a Scope object (likely from\
    \ whatever scope it's within inside your view; think the closest parent controller's\
    \ scope), an element (the directive's element itself; this is a jqLite or jQuery\
    \ object), and an attribute object representing all of the attributes of the element.\
    \ Optionally it is passed a controller instance.\n\n### jqLite?\n\njqLite is what\
    \ you get to work with when you haven't included jQuery. If you have included\
    \ jQuery, don't worry about jqLite, as Angular will use that instead. It is a\
    \ library that is a subset of the jQuery library, so it has limited functionality.\
    \ What it can do is discussed in the documentation for angular.element: http://docs.angularjs.org/api/angular.element.\
    \ Importantly, jqLite does not use jQuery selectors. If you need selectors, you\
    \ will need jQuery proper.\n\nThe linking function gets executed by AngularJS\
    \ during HTML compilation when scopes become available. This is in contrast to\
    \ the compile function, which is executed before scopes become available, which\
    \ we will touch on later. This linking function is where we want to put our directive's\
    \ logic.\n\n![](img/f95c537c2fc9346a21a144b89cfac580_69_0.png)\n\nThis particular\
    \ directive simply binds a click event to the element, and changes the appearance\
    \ of that element with the `css()` function. Clicking the post body will change\
    \ the text from normal weight to bold, and vice-versa.\n\nThat's a simple attribute-based\
    \ directive. Let's write trivial examples of the other three types of directives.\
    \ I'd like a directive that I can stick in an HTML comment that will insert a\
    \ copyright for anyone who happens to be browsing the code:\n\n### Comment-Type\
    \ Directive\n\nThe following is an example of a comment-type directive:\n\n```javascript\n\
    blog.directive('copyright', function () {\n    return {\n        restrict: 'M',\n\
    \        compile: function (element) {\n            element.text('Copyright 2013\
    \ Rhoda Bote');\n        }\n    };\n});\n```\n\nAnd the usage of a comment-type\
    \ directive:\n\n```html\n<!-- directive: copyright -->\n```\n\nHere is the output\
    \ (what you get when you inspect the markup):\n\n```html\n<!-- Copyright 2013\
    \ Rhoda Bote -->\n```\n\nI've found that creating comment directives is a little\
    \ different than dealing with elements. Typically when replacing elements with\
    \ a template or other elements, you would use the replace and/or transclude options\
    \ of the copyright object. However, those require HTMLElement objects to function\
    \ properly, not Comment objects. So if we want to do something incredibly simple\
    \ like replace some text with other text, we can use the `text()` method.\n\n\
    Note that this directive uses compile instead of link. The only reason I made\
    \ this decision was because we did not need a scope. A scope would have variables\
    \ and functions and who-knows-what in it, and all we needed was some static text.\
    \ To sum up: Need a scope? Link. Don't? Compile."
  mdcn: "\n## 单元测试\n\n你可以而且应该为控制器编写单元测试。这非常简单。下面是一个使用 Jasmine 测试控制器的示例：\n\n```javascript\n\
    /*Global beforeEach, Describe, afterEach, Describe, module, expect, it, inject*/\n\
    (function () {\n\t'use strict';\n\t// grade the blog module before each test\n\
    \tbeforeModule('blog');\n\tdescribe('Blog Controller', function () {\n\t\tvar\
    \ $controller; // controller needs scope, so here's ours\n\t\t$controller = //\
    \ controller service to instantiate controllers\n\n\t\tbeforeEach(inject(function\
    \ ($injector, $rootScope) {\n\t\t\tscope = $rootScope.scope; // make brand new\
    \ child scope off of root\n\t\t\t$controller = $injector.get('$controller');\n\
    \t\t}));\n\n\t\tafterEach(function () {\n\t\t\tscope.$destroy(); // eliminate\
    \ our scope after each test run\n\t\t});\n\n\t\tdescribe('HeadCtrl', function\
    \ () {\n\t\t\t// all that HeadCtrl does is set a description. That's pretty easy\
    \ to test.\n\t\t\tit('should set the description', function () {\n\t\t\t\t$controller('HeadCtrl',\
    \ {scope: scope});\n\t\t\t\texpect(scope.description).toBe('My Important Blog');\n\
    \t\t\t});\n\t\t});\n\t});\n})();\n```\n\n同样，运行这些代码需要正确配置的 Testacular 安装。配置文件本身没什么特别之处，主要是文件数组。我的配置看起来类似这样：\n\
    \n```json\n\"files\": [\n\t'JASMINE',\n\t'JASMINE_ADAPTER',\n\t'/path/to/blog/angular-min.js',\n\
    \t'/path/to/blog/angular.mocks.js',\n\t'/path/to/blog/blog.js',\n\t'/path/to/blog/blogSpec.js'\n\
    ]\n```\n\n注意，我们必须显式包含 AngularJS 和模拟模块。接下来包含被测试的代码，最后是测试文件本身。\n\n这个文件读起来有点像句子，即使你是单元测试的新手，也应该能帮助你理解正在发生什么。简而言之，测试（不是配置文件）声明：\"\
    Blog 控制器的 HeadCtrl 应该将描述设置为一个明确的字符串。\" 我们在每次运行测试之前需要做一些设置，以便获得正确的测试对象。此外，我们之后还要做一些清理工作。这是构建单元测试夹具的典型做法。\n\
    \n![](img/f95c537c2fc9346a21a144b89cfac580_66_0.png)\n\n断言是通过 AngularJS 的 `$controller`\
    \ 服务来进行的。这个服务允许你实例化一个控制器。在进行单元测试时，你会发现通常只需调用这个服务，传递正确的参数，然后测试 *scope* 的内容。一般来说，你不需要保存对控制器的引用，除非你在做一些复杂的事情，比如控制器继承——我之前不鼓励这种做法。\n\
    \n## 结论\n\n控制器用于业务逻辑。保持控制器整洁可以使单元测试的编写变得极其简单。最重要的是，它们不一定依赖于任何视图，因此你可以在整个应用程序中重用它们的功能。控制器也是实例化、声明或定义模型的常见场所，因为\
    \ 99% 的控制器都可以使用 `$scope` 对象。\n\n在下一章中，我们将了解指令；这确实是使 AngularJS 有别于其他框架的组件。\n\n\
    ## 第 6 章 指令详解\n\n指令存在于视图中。指令很可能是 AngularJS 中最难理解的部分，但也可能是最强大的。如果你能理解如何编写指令，你就可以省去编写大量标记的工作。指令本质上扩展了\
    \ HTML，你可以用它们来创建自己的 DSL（领域特定语言）。\n\n指令不可注入。没有合理的方法来访问指令的行为，如果你觉得需要这样做，那就是你做错了。它们应该被放在视图中，而且只在视图中。与*主要*存在于视图中的过滤器不同，没有一个方便的\
    \ `$directive` 服务来抓取指令。如果你想要一个，就必须把它放在某个标记中，然后编译和/或链接你的标记（你可以通过 `$compile` 服务以编程方式完成，但我们先不用担心这个）。\n\
    \n## 添加我们的指令\n\n我们将从一个相对简单且无用的指令开始，然后提供更多不同类型指令的示例，以及一些特殊指令的示例，如果你需要某些特定行为时可以使用它们；特别是自定义表单验证。\n\
    \n我们的博客有一个名为 `boldClick` 的自定义指令，点击时会在使用该指令的 HTML 元素上切换粗体字体粗细。下面是一个使用指令处理这种情况的示例：\n\
    \n```javascript\nblog.directive('boldClick', function() {\n  return function(scope,\
    \ element) {\n    var bold = false;\n    element.click(function() {\n      if\
    \ (bold) {\n        element.css('font-weight', 'normal');\n      } else {\n  \
    \      element.css('font-weight', 'bold');\n      }\n      bold = !bold;\n   \
    \ });\n  };\n});\n```\n\n在视图中，它看起来像这样：\n\n```html\nMy pet is a <span bold-click>tortoise</span>.\n\
    ```\n\n让我们逐行分析。\n\n- 首先，我们将指令命名为 `boldClick`。这是指令的通用名称，但在视图中使用它时，我们有多种不同的选择，如前所述（使用其中任何一种，例如\
    \ bold-click，都会自动转换为驼峰式命名）。指令是一个返回对象的函数（在某些简单情况下，仅仅返回一个函数）。\n- 在我们的对象中，有两个键：restrict\
    \ 和 link。restrict 告诉 AngularJS 指令*如何*使用。这个值可以是空、E（元素）、A（属性）、C（类）或 M（注释）。如果省略，默认为\
    \ A，这意味着你可以从指令定义中移除它。如果指定了，当你试图以非预期方式使用指令时，AngularJS 会抛出错误。\n- link 定义了一个*链接*函数。十之八九，你的指令都会有\
    \ link，因为它是最常见的情况。链接函数会传入一个 Scope 对象（可能来自视图中它所在的任何作用域；想想最近父控制器的作用域）、一个 element（指令本身的元素；这是一个\
    \ jqLite 或 jQuery 对象），以及一个代表该元素所有属性的 attribute 对象。可选地，还会传入一个控制器实例。\n\n### jqLite？\n\
    \njqLite 是当你没有包含 jQuery 时使用的工具。如果你已经包含了 jQuery，就不用担心 jqLite，因为 Angular 会使用 jQuery\
    \ 代替。它是一个 jQuery 库的子集，所以功能有限。它能做什么在 angular.element 的文档中有说明：http://docs.angularjs.org/api/angular.element。重要的是，jqLite\
    \ 不能使用 jQuery 选择器。如果你需要选择器，就需要使用完整的 jQuery。\n\n链接函数在 AngularJS 进行 HTML 编译时、作用域可用时执行。这与编译函数形成对比，后者在作用域可用之前执行，我们稍后会提到。这个链接函数是我们放置指令逻辑的地方。\n\
    \n![](img/f95c537c2fc9346a21a144b89cfac580_69_0.png)\n\n这个特定的指令只是将点击事件绑定到元素上，并通过\
    \ `css()` 函数改变该元素的外观。点击帖子正文会将文本从正常粗细变为粗体，反之亦然。\n\n这是一个简单的基于属性的指令。让我们编写其他三种类型指令的简单示例。我想要一个可以放在\
    \ HTML 注释中的指令，为任何碰巧浏览代码的人插入版权声明：\n\n### 注释类型指令\n\n下面是一个注释类型指令的示例：\n\n```javascript\n\
    blog.directive('copyright', function () {\n    return {\n        restrict: 'M',\n\
    \        compile: function (element) {\n            element.text('Copyright 2013\
    \ Rhoda Bote');\n        }\n    };\n});\n```\n\n注释类型指令的使用：\n\n```html\n<!-- directive:\
    \ copyright -->\n```\n\n这是输出（检查标记时得到的内容）：\n\n```html\n<!-- Copyright 2013 Rhoda\
    \ Bote -->\n```\n\n我发现创建注释指令与处理元素有些不同。通常，当用模板或其他元素替换元素时，你会使用 copyright 对象的 replace\
    \ 和/或 transclude 选项。但是，这些需要 HTMLElement 对象才能正常工作，而不是 Comment 对象。所以如果我们想做一些非常简单的事情，比如将一些文本替换为其他文本，我们可以使用\
    \ `text()` 方法。\n\n注意，这个指令使用的是 compile 而不是 link。我做出这个决定的唯一原因是我们不需要作用域。作用域会有变量、函数以及各种东西，而我们只需要一些静态文本。总结来说：需要作用域？用\
    \ link。不需要？用 compile。\n"
