  md: "# # Lists and Tables\n\nIf you haven’t figured this one out by now, your go-to\
    \ directive for iterating over arrays or objects is the ngRepeat directive. This\
    \ directive is a bit curious as it does two things, which will look like bugs\
    \ if you don’t know what’s going on: it creates a scope for each iteration and\
    \ it iterates over a copy of the data, not the data itself. Thus, you will run\
    \ into problems if you are iterating over an array and giving the user power to\
    \ edit anything in that array. As soon as you edit something, a watch fires and\
    \ redraws. This does not work well:\n\n```\n<ul>\n  <li ng-repeat=\"item in ['foo',\
    \ 'bar', 'baz']\">\n    <input type=\"text\" ng-model=\"item\"/>\n  </li>\n</ul>\n\
    ```\n\nIn fact, as of version 1.0.5, AngularJS enforces an array of this type\
    \ remains read-only. A workaround would be to change the array to look something\
    \ like [{name: 'foo'}, {name: 'bar'}, {name: 'baz'}] and set your ngModels to\
    \ be item.name, then you may edit your objects with impunity.\n\nngRepeat has\
    \ a handful of special variables it injects into its iteration scopes:\n\n+  \
    \ - $index: The numeric value of the iteration; if array, current array index\n\
    - $first: Boolean; whether or not we are at the first iteration\n- $last: Boolean,\
    \ whether or not we are at the last iteration\n- $middle: Boolean, whether or\
    \ not we are neither at the first nor last iteration\n\n> TIP A quick way to determine\
    \ if an array only has one value\n\nUse the expression $first && $last. This will\
    \ only be true if the first value in the array is the last value in the array;\
    \ in other words, an array of length one (1).\n\nThere are many use cases for\
    \ something like this, suffice it to say. Use these variables and you can render\
    \ your HTML differently depending on where you are in the loop.\n\n# ## Sorting\
    \ and Filtering\n\nAngularJS has built-in sorting and filtering filters that are\
    \ ideal for use with ngRepeat. We use ngRepeat to display our blog posts. Let’s\
    \ take a closer look. What follows is an HTML fragment to display the posts:\n\
    \n```\n<div id=\"{{post.id}}\" ng-repeat=\"post in posts|orderBy:'-date'\">\n\
    \  <!-- bunch of stuff eliminated for sake of brevity -->\n</div>\n```\n\nThe\
    \ way it’s set up now, we’ll show the newest post first down through the oldest\
    \ post. Let’s make this dynamic:"
  merge: -1
