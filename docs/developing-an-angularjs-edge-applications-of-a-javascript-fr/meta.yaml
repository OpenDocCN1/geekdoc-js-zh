    \ are mainly straightforward. However, we do have a `$watch` that detects if the\
    \ `posts` object has changed. If it has, that means we've gotten new data from\
    \ the server. And if we've got new data from the server, then we want to stop\
    \ editing stuff (throw it away) because we may have new stuff to edit. A smart\
    \ system would detect collisions, but we're the only person writing on the blog\
    \ and this is not necessary.\n\nWhat follows are unit tests for `ContentCtrl`:\n\
    \n```\ndescribe('ContentCtrl', function () {\n  describe('basic methods', function\
    \ () {\n```\n\n```\n// all this stuff happens whenever we instantiate the controller\n\
    beforeEach(inject(function (Posts, Post, $routeParams, $httpBackend, $http) {\n\
    \    $http.defaults.transformRequest = []; // remove any fancy request transforms\n\
    \    $httpBackend.expectGET('data.json').respond({posts: []});\n    $controller('ContentCtrl',\
    \ {$scope: scope, Posts: Posts,\n        Post: Post, $routeParams: $routeParams});\n\
    \    $httpBackend.flush();\n}));\n```\n\n```\ndescribe('_stopEditingAllPosts',\
    \ function () {\n    it('should call stopEditing() on all members of posts array',\n\
    \        inject(function (Post) {\n            var posts = [\n               \
