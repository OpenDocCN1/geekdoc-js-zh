  md: '# Debugging AngularJS Apps


    While, on the main, AngularJS is easy to debug, there is one issue that complicates
    things. If a directive is not recognized for whatever reason, it silently fails.
    That means your directive code can have a syntax error or something, but it’ll
    never get run because the directive won’t register and AngularJS just skips any
    attribute it doesn’t understand. When writing directives then, it’s often helpful
    to have a simple console.log (or $log.log as you’ll see below) in there to assert
    it even got linked/compiled. If you don’t see the log message, AngularJS didn’t
    recognize your directive.


    # Firebug & Chrome Developer Tools


    These two tools are indispensible. I don’t know how you can write a client-side
    JavaScript application without them. If you use Firefox you can get Firebug at
    http://getfirebug.com. If you use IE, or at least have to put up with IE, you
    can also get Firebug Lite. Chrome Dev Tools come preinstalled. Both do their jobs
    well enough, but if you use Chrome you have the added bonus of access to the AngularJS
    Batarang!


    # The AngularJS Batarang!


    If you use Chrome (and you should really try it if you haven’t; the developer
    tools are quite good), you can install a Chrome extension (or whatever they call
    it) called the AngularJS Batarang (https://chrome.google.com/webstore/detail/angularjs-batarang).
    This is a project by Brian Ford (http://briantford.com), an AngularJS whiz. With
    this amazing tool, you can inspect any element on the page and easily view its
    scope within the right-hand panes (where the CSS style information lives). This
    saves you from having to console.log($scope) all over the place to see what’s
    in there (note you cannot just dump the scope using {{}}; even if you can get
    to the scope object, it just outputs as “SCOPE”, which is not helpful).


    In addition to that, you can examine the entire scope hierarchy at a glance within
    the Batarang’s own tab. If you have a lot of scopes, this display can seem overwhelming,
    but it’s a great way to visualize your app as a whole. There are other tools within
    the Batarang, but these two are the ones I find most useful.


    # $log


    AngularJS provides $log, which an alias for window.console by default, unless
    you redefine it. So console.log becomes $log.log. Might save you some keystrokes,
    but you still have to inject the thing. The real power of $log is that you CAN
    redefine it (or any other service or directive in AngularJS for that matter) and
    make it do whatever you want. Want it to pop alerts instead for some bizarre reason?
    You can do that. You can output errors to the HTML if you want. $log is a provider,
    so if you are going to redefine it, be sure to use Module.provider (an example
    of this is below).


    # $exceptionHandler


    By default, AngularJS traps all exceptions coming out of it. That is important
    information to know if you are wondering why window.onerror never gets called.
    What you see when you see AngularJS exceptions (or exceptions in your AngularJS
    code) is simply a call to'
