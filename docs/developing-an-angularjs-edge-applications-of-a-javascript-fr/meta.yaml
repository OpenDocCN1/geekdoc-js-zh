    \ new Date(), 'baz', true);\n        expect(post.toString()).toBe(angular.toJson(post));\n\
    \    });\n});\n```\n\n# Conclusion\n\nThese services, providers and factories\
    \ make up the backbone (no pun intended) of your AngularJS app. Do the heavy lifting\
    \ here; make it reusable and testable. You'll end up with less spaghetti on your\
    \ plate. Keep your controller from thinking too hard. Your directive only has\
    \ one function in it—make that function readable by injecting services into it.\n\
    \nIn the next chapter, we'll take a look at the runt of the litter, filters."
