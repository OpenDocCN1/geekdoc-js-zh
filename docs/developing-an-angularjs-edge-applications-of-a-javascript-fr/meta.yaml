  md: "# # Different Data Types\n\nAngularJS will attempt to convert *to* and *from*\
    \ JSON for you. If it finds you have given it an object to send to the server,\
    \ it will serialize this into JSON and send it away. If it retrieves a request\
    \ that can be parsed into JSON, it will give you the resulting JavaScript object\
    \ back.\n\nIf you are not working in JSON, simply pass a string as the data. Maybe\
    \ you are working with XML and the server expects it and sends it back. For example:\n\
    \n```\n$http.get('/some/xml/service', '<foo><bar>baz</bar></foo>')\n.success(function(data)\
    \ {\n    // data is now an XML string.\n    // parse your XML here and wonder\
    \ why you are not working with JSON\n});\n```\n\nThis covers JSON and XML (or\
    \ any plain string data). What if your server wants x-www-form-urlencoded data?\
    \ The JSFiddle ([http://jsfiddle.net](http://jsfiddle.net)) /echo service is a\
    \ good example of this. Here’s a working example:\n\n```\n$http.post('/echo/json/',\
    \ 'json=' + encodeURIComponent(angular.toJson({foo: 'bar'})), {\n    headers:\
    \ {\n        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'\n\
    \    }\n}).success(function(data) {\n    $scope.data = data; // puts {foo: 'bar'}\
    \ in $scope.data\n});\n```\n\nThat’s a handy trick, but here’s another: you may\
    \ want to fake a form submit. I’ve written a handy little factory that converts\
    \ a (flat!) object to multipart/form-data for you:\n\n```\nmyApp.factory('formDataObject',\
    \ function () {\n    return function (data) {\n        var fd = new FormData(),\
    \ key;\n        for (key in data) {\n            if (data.hasOwnProperty(key))\
    \ {\n                fd.append(key, data[key]);\n            }\n        }\n  \
    \      return fd;\n    };\n});\n```\n\nTo use this factory, just inject `formDataObject`\
    \ into whatever is calling `$http`, and do this:\n\n```\n// note not using \"\
    post\" method here; this one seems to be a bit more relaxed on the headers\n//\
    \ but it may work for you\n$http({\n    method: 'POST',\n    url: '/maybe/accepts/a/file',\n\
    \    data: flat_object,\n    // XXX: this seems to be a bug in AngularJS\n   \
    \ headers: {\n        'Content-type': '',\n        'Content-Type': ''\n    },\n\
    \    transformRequest: formDataObject\n}).success(function(data) {\n    // process\
    \ response\n});\n```\n\nYou can easily grab the information from an `<input type=\"\
    file\"/>` this way and upload via XHR, by accessing the HTMLElement’s `files`\
    \ array, once a file or files has been chosen. Once you have something from the\
    \ `files` array, pass it as the `data` as in the above example. The `formDataObject`\
    \ factory will do the work for you to convert it into something the server would\
    \ expect. Note that AngularJS, while it has implemented many input directives,\
    \ has"
