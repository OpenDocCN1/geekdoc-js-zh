    A couple things to note:


    We’re using a promise here for one reason only: we might have to reach out over
    HTTP and fetch our template as a partial. If we do that, we need to be able to
    execute code in an asynchronous manner, because of course the fetch is going to
    be asynchronous. So, if we wanted to, we could place this template in a file called
    about.html and specified the path to that file as the second parameter to `Modal()`.
    When we wanted to open the modal, we’d use the `$http` service to fetch it and
    display it when it was received. When the promise resolves, we know exactly when
    that modal got opened.


    The first parameter to `Modal()` is a Scope. We’re not really using it here, but
    we could be. Say we wanted to do `$scope.name = ‘John Jacob Jingleheimer Schmidt’;`
    somewhere in `ContentCtrl`. When we compile our modal’s template, that scope is
    available to us, so we could easily plop `{{name}}` in there.


    ![](img/f95c537c2fc9346a21a144b89cfac580_132_0.png)


    This is just one way to handle The Modal Problem, and you may not like this solution
    as much as simply using markup and programatically flipping a switch when you
    want the modal to be open or shut.'
