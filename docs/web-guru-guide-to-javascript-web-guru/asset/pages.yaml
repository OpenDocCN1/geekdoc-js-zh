    property, which allows you to access form elements according to their index position
    in the form. For example, you could use the elements[] array to access the value
    associated with the first form element, as shown in this example:


    ```

    theValue = document.MyForm.elements[0].value;

    ```


    You can also access the value of a field by name. Consider the following example:


    ```

    theValue = document.form.theinput.value;

    ```


