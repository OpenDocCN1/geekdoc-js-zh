  md: '# Exercise 10.1 - Using Event Handlers


    Form Elements Can Be Scripted


    Most scriptable browsers, including Internet Explorer, Netscape, and Mozilla use
    object model to represent the HTML elements of a Web page. Every HTML element
    you use in a Web page has a corresponding object. The object name is the same
    as the HTML element name without the <> characters. For example, the <h1> element
    related is the h1 object.


    Form elements that are manipulated by scripts are often called HTML controls.
    HTML controls check boxes, radio buttons, push buttons, text windows, areas and
    selection menus.


    In this exercise, you will learn how to define an event handler for an HTML object.
    Like other objects discussed, all HTML objects have properties and methods. Generally,
    a property defines the state of an object and a method is a command that a script
    can give to an object. HTML objects can also have handlers. Event handlers specify
    how an object reacts to a user or browser action.


    Generally, you event handler functions as an attribute of a related markup tag,
    such as the <input> tag. Event handlers can call functions or execute statements
    directly. To make an input button that calls a function when clicked, you would
    enter the code shown in Exhibit 10.1.


    # EXHIBIT 10.1


    ```

    <form>

    <input type="button" name="clickit" value="Click Me"

    onclick="doThis()" />

    </form>

    ```


    A Web page containing this form will have a button labeled Click Me. When you
    click the button, the onclick event occurs and the doThis() function is called.


    # STEP 1 - CREATING A BUTTON WITH AN EVENT HANDLER


    You can also execute statements, as shown in Exhibit 10.2. The value assigned
    to the onclick event handler is an actual script that has many elements. A semicolon
    is used to separate successive lines in the script. The script contains the statement
    return true. This statement ensures that you close the alert by clicking on the
    OK button, execution continues properly. Generally, whenever you execute statements—other
    than simple function calls—directly within markup, you need to include a return
    true statement. Finally, you should note the use of the single quotation marks,
    which prevents a syntax error, because quotes can only be one level deep.


    # EXHIBIT 10.2


    ```

    <form>

    <input type="button" name="clickit" value="Click Me"

    onclick="alert(''Click detected!''); return true" />

    </form>

    ```'
  merge: -1
