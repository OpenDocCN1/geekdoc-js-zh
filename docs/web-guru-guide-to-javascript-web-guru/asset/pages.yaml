    JavaScript can add life to your site''s graphics and help you manage the way graphics
    are used. Not only can you use JavaScript to precache images so graphics are displayed
    without delay, you can also use JavaScript to dynamically update graphics. This
    allows you to change graphics on demand, rotate between a set of graphics, and
    configure timed updates of graphics.


    You may be wondering why this is useful. Have you ever wondered how to make buttons
    change when you roll over them with the mouse? Typically, the image swapping is
    handled by JavaScript. When you move the mouse over the graphical button, JavaScript
    is used to swap the image. Or, say your site has several advertisers or you are
    running a series of advertising campaigns, and you want to rotate the banner ads
    on your site. With JavaScript, you can easily script the display of the banners
    so that they change automatically at a timed interval, thereby rotating the ads
    between advertisers or advertising campaigns automatically.


    > For Your Career


    Good design techniques are essential when working with images. To ensure that
    browsers can process and display pages as quickly as possible, you should specify
    the height and width attributes for every graphic in the as- <img> tag. This enables
    a browser to determine how a page should flow without having to load all of the
    images in the page, which, in turn, allows the browser to display the page more
    quickly.'
