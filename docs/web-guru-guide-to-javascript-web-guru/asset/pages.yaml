  md: "# Exercise 5.2 - Variable Scope in Functions\n\nOne problem that you will face\
    \ when you begin splitting an application's functionality into functions is variable\
    \ scope. When all of the variables are declared in a single script, they have\
    \ global scope, meaning that they can be referenced anywhere within the script.\
    \ Global variables also can be referenced inside functions, which is problematic\
    \ if you wish to create local variables of the same name inside a function.\n\n\
    Why would you need to do this? Imagine you have a variable bank balance, and you\
    \ simply want to check what would happen to the balance after a year's worth of\
    \ interest. Increasing the global variable bankBalance by the interest would be\
    \ incorrect, because you are only computing an estimate and not increasing the\
    \ bankBalance by the projected amount. In this case, you can declare a new, local\
    \ copy of bankBalance inside the function, using the var keyword, and then assign\
    \ the value of the global variable bankBalance to this local copy, even if it\
    \ has the same name.\n\nIn this exercise, you will investigate issues associated\
    \ with variable scope to ensure that global and local variables do not conflict.\n\
    \n# STEP 1 - IGNORING GLOBAL VARIABLES\n\nIn your text editor, copy the source\
    \ code shown in Exhibit 5.3. After the assign a value of 1,000,000 to cumInterest.\
    \ Ensure that the local cumInterest variable in the function displayInterest()\
    \ is initialized to zero. When you run the script shown in Exhibit 5.4 and use\
    \ the same test cases as Exhibit 5.3, do you get the same results as shown in\
    \ Figure 5.4? Or, is the global variable cumInterest going to make the customer\
    \ a virtual millionaire?\n\nThe answer is that global variable's value does not\
    \ affect the value of a local variable that happens to have the same name. As\
    \ far as the JavaScript interpreter is concerned, they are different variables,\
    \ even though they look the same to us.\n\n# EXHIBIT 5.4\n\n```\n<html>\n<head>\n\
    <title>Promissory Note Application</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n  var cumInterest=0;\n  function displayInterest() {\n\n  var interest= simpleInterest();\n\
    \  if (document.promissoryNote.time.value==1) {\n    window.alert(\"Interest after\
    \ one year is $\"+interest+\".\");\n  }\n}\n```"
