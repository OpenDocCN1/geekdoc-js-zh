    textarea object. As you can see, the supported features are similar to those of
    password, hidden, and text fields.


    # TABLE 17.10 The textarea object.


    | Properties | Methods | Events |

    | --- | --- | --- |

    | cols | createTextRange() | onafterupdate |

    | defaultValue | blur() | onbeforeupdate |

    | form | focus() | onblur |

    | maxLength | select() | onchange |

    | name | | onerrorupdate |

    | readOnly | | onfocus |

    | rows | | onselect |

    | type | | |

    | value | | |


    Most properties of these objects are used to represent attributes of the form
    elements. Because many of these properties are the same as those of other objects
    discussed in this chapter, we will not detail each property. Of the many properties,
    methods, and events associated with these objects, the value property is the one
    you will use the most. You will use this property to read the input by users or
    otherwise stored in a field. You can set values with these objects as which means
    you can also use the value property to set the values of related form fields at
    any time. The methods of the password, hidden, text, and textarea objects are
    used to select or deselect the related objects in the code rather than a user
    action:'
