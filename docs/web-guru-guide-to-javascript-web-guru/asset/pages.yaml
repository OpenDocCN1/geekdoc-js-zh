  md: '# Exercise 16.1 – Creating Your First Cookie


    The mechanics of how cookies work is fairly straightforward. Cookies are written
    to and read as a file from the user''s computer using the cookie property of the
    document object.


    Mozilla-based browsers store cookies in a file named cookies.txt, which is stored
    in the browser''s folder. On Windows, this folder is found at C:\Windows\Application
    Data\Mozilla\Profiles\ProfileName, where ProfileName is the name of the profile
    for the currently logged user. On Macintosh systems, this folder is found under
    UserName/Library/Mozilla/Profiles/ProfileName, where ProfileName is the name of
    the currently logged user.


    Internet browsers store cookies in a domain-specific text file, which is stored
    in the %UserProfile%Cookies folder on XP. With earlier versions of Windows, the
    cookies folder is typically located in a subdirectory of C:\Windows directory.
    Internet Explorer stores cookies in a domain-specific manner to add the task of
    restricting cookies to a per domain—something that all browsers do.


    Cookies are read and written to cookies as records. Fields in a cookie record
    detail:


    +   - The name of the server that created the cookie

    - The name of the cookie

    - The string of data being stored in the cookie

    - The expiration date for the cookie

    - A Boolean value indicating whether you need a secure HTTP connection to access
    the cookie


    +   - A path indicating the URL(s) that the cookie can access


    The first thing you should notice is that if you visit www.amazon.com, your browser
    will have a related cookie file for the domain amazon.com. When you access www.amazon.com,
    www is the computer name and amazon.com is the domain. If you later access secure.amazon.com
    as part of the purchase process, the Web server has access to any cookies previously
    created in the amazon.com domain. A computer in another domain would not be able
    to access these cookies, however. If a computer in one domain create a cookie,
    a computer in another cannot access it.


    Cookies can also have an expiration date. When an expiration date passes, you
    can read the stored (persistent) cookie. At any time you set a cookie without
    an expiration date, you create a temporary cookie that is only valid for the current
    session. If the user exits the browser window, this temporary cookie is deleted.


    Because security is a major concern when using cookies, there are two additional
    security mechanisms beyond the domain access restriction. The first restriction
    requires that the cookie be accessed with a secure HTTP connection. If you are
    creating-commerce sites, you will find that this is a useful restriction that
    ensures a user''s login or purchase information is protected if you use cookies
    to take orders. You'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# Exercise 16.1 - Creating your first cookie


    also restrict access to a cookie to a specific URL. For example, a cookie set
    for the path www://www.amazon.com/purchase could only be accessed by pages in
    the purchase history.


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_390_0.png)


    You create cookies using a JavaScript assignment operator with the document.cookie
    property. Six parameters can be used, and the general syntax follows, with optional
    parameters shown in brackets:


    ```

    document.cookie = "cookieName=cookieData"

    ; expires=timeString]

    ; path=pathString]

    ; domain=domainString]

    ; secureBoolean];

    ```


    Table 16.1 summarizes the usage of each parameter. As you can see, the mandatory
    parameters are the cookie name and the cookie data. The remaining parameters are
    optional.


    As you work with cookies, keep in mind that you can have a maximum of 20 cookies
