  md: '# Summary


    Knowing how to create and work with cookies is essential for any JavaScript program.
    Cookies are widely used on the Web. They track everything from users'' names to
    their preferences to the items they have selected for purchase. As you have seen
    in this chapter, two types of cookies can be created: temporary or stored. Temporary
    cookies that do not have expiration dates. Stored cookies are cookies that have
    valid future expiration dates. Although temporary cookies are only good for the
    current browser session, stored cookies are valid until their expiration date
    is reached or whichever comes first. In JavaScript, you delete a stored cookie
    by setting its expiration date to an earlier date.


    # Test Your Skills


    Practice Drill 16.1: Setting Cookie Expiration Dates

    A cookie expiration must always be set in proper date format. If it is not, the
    cookie will be invalid and may not be created or set as expected. As you have
    seen in this chapter, it is not easy to set a cookie''s expiration date. You must
    instantiate a Date object, get the current time, add this to the current time,
    and then set the cookie''s expiration date, as shown in this example:


    ```

    function getName(form) {

    var cookieExp = new Date();

    var year = cookieExp.getTime() + (365 * 24 * 60 * 60 * 1000);

    cookieExp.setYear(year);

    var name = escape(form.field1.value);

    document.cookie = "username=" + name + "; expires=" + cookieExp.toGMTString()
    + "; path=/;

    }

    ```


    It would be better if you could set the expiration date to the period of time
    for which the cookie should be valid in terms of hours and days. Think for a moment
    how this could be accomplished using a utility function and then consider the
    following example call:


    ```

    setCount(7, 12);

    ```


    Knowing that the first parameter is the number of days and the second parameter
    is the number of hours for which the cookie should be valid, consider what the
    function would look like and how it would be used and then complete the following
    exercise:


    +   1. In your text editor, open the page created in Exercise 16.4 and save it
    as C16practice.html. Within the header-defined script, add the setCount () function.'
