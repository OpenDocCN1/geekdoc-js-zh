  md: '# Exercise 13.1 - Examining the link Object


    When you load a page into your browser, the browser uses arrays to track all links,
    anchors, forms, images, frames, and embedded objects. Each object has an index
    in the array that is set according to the object''s location in the page. The
    link object ties to all of the hyperlinks in your page. For example, the first
    link on the page are created with a <a href="> tag and stored in the links[] array
    at index 0.


    Table 13.1 provides an overview of the methods, properties, and events of the
    link object. In fact, link objects are a special type of location whose properties
    are, for the most part, extracted from the <a href="> assignment of a specific
    link. This means that link objects support all of the properties of the window.location
    object, which is discussed in Chapter 14, and the target property. Using the target
    property, you can get and set the target of a link, which is useful in frame-enhanced
    pages.


    | Properties | Methods | Event Handlers |

    |---|---|---|

    | links[i].target | (none) | onclick=

    | links[i].hash | | onblclick=

    | links[i].host | | onmousedown

    | links[i].hostname | | onmouseout

    | links[i].href | | onmouseover

    | links[i].pathname | | onmouseup

    | links[i].port | | |

    | links[i].protocol | | |

    | links[i].search | | |


    As shown in Table 13.1, the link object uses several event handlers, including
    onmouseover and onmouseout. These event handlers are inherited from the location
    object. The onmouseover event executes automatically when the mouse is moved over
    a hyperlink; the onmouseout event occurs when you move the mouse away from a link.


    You set a message to display when the mouse is over a link as follows:


    ```

    <a href="home.html" onmouseover="window.status = ''Visit Our Home Page!'';" ></a>

    ```


    You are using a location object to do this. Table 13.2 describes the properties
    of the link object. As you study the table, keep in mind that the properties are
    specific to a particular <a href="> or'
