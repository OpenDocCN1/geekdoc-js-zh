    # Exercise 15.2 – Examining Browser and OS-Related Properties


    Practically every new browser version since Netscape Navigator 2 and Internet
    Explorer 3 has introduced new features for the navigator object. This can introduce
    compatibility problems if you want to work with some of the more advanced properties
    of the navigator object. Table 15.3 provides a description of each property and
    a list of the browsers that support the property.


    As you can see, these properties provide many ways to examine the client browser.
    By using conditional constructs and looping, you can use these properties to customize
    pages based on client type. The properties supported by the most browsers are
    the ones you will most likely to work with. These include appCode, appName, appVersion,
    and userAgent.


    When starting with the navigator properties, you will find that you can narrow
    the properties list quickly. The appCode property, for example, returns the internal
    name of the client browser, and just about every browser has an internal name
    of Mozilla, because most browsers are based on the NCSA browser engine created
    originally for the NCSA Mosaic browser. This means that appCode is not very useful.


    The appName property reports the official name of the browser. The appName reported
    by Netscape Navigator is Netscape. Internet Explorer reports the appName as Microsoft
    Internet Explorer. Knowing the official name is useful


    > TIP Mozilla Was the First-Capable Browser Engine


    The history of Mozilla goes all the way back to the early days of the Web. In
    those days, Mosaic was the only browser available that displayed both text and
    graphics. Because the browser engine was open source, Netscape and Microsoft chose
    to use the browser engine as the basis of their browsers. The only thing that
    we do not know is the appCode as Mozilla is Opera, which identifies itself as
    Opera,'
