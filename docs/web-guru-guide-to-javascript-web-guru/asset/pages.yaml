  md: '# 358 CHAPTER 15 | Accessing browser and operating system version


    In this chapter, you have learned techniques for working with the navigator object.
    Although the object has been expanded with the introduction of various browser
    versions, the most significant features remain those that were introduced with
    Netscape Navigator 2, including the appName, appVersion, and userAgent properties.
    These properties can be used practically with all browsers that are in use today.


    Many important concepts were introduced in this chapter, including the use of
    a single line of code to determine the appName, such as:


    ```

    var isIE = navigator.appName == "Microsoft Internet Explorer";

    ```


    and a single line of code to determine a specific appVersion substring, such as:


    ```

    var isIE4x = navigator.appVersion.indexOf("MSIE 4") != -1;

    ```


    In the first example, you assign a variable equal to the navigator.appName string
    and then compare the string with another string. The second string is "Microsoft
    Internet Explorer", the isIE variable is then set to true; otherwise, it is set
    to false.


    In the second example, you check for a substring in the navigator.appVersion string.
    This value is either the index position of the character in the string (indicating
    a match) or -1 (indicating no match). You then test to determine if the value
    is something other than -1. If it is, the isIE4x variable is set to true; otherwise,
    it is set to false.'
