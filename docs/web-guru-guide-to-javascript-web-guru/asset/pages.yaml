  md: '# CHAPTER 2 Adding client-side scripts to web pages


    # Exercise 2.1 – Identifying JavaScript


    JavaScript has several different versions, and different implementations of the
    same version can have significant differences in functionality. Indeed, other
    scripting languages may used instead of JavaScript within a browser. Therefore,
    it is important as a first step to be able to correctly identify JavaScript as
    the language of choice for specific HTML page.


    In this exercise, you will learn how to specify JavaScript as the scripting language
    to be used within a page and how to read scripts from an external file to HTML
    page. This is good programming practice, because different individuals may fall
    the roles of HTML developer and JavaScript programmer. The former is always responsible
    for the HTML markup, whereas the latter is responsible for scripting.


    According to the W3C, the language attribute of <script> tag is deprecated in
    HTML 4. In addition, it is no longer supported by Internet Explorer or by recent
    versions of other browsers, such as Mozilla 1.6. In the Future, all scripts should
    leave the language attribute, as <script language="JavaScript.1" type="text/javascript">,
    or include the MIME type and the language instead, as <script language="JavaScript.5"
    type="text/javascript"> for JavaScript 1.5.


    In the set of exercises that you follow, you will learn how to create basic JavaScripts
    and insert them into Web pages. This is a relatively easy task, but ensuring that
    servers execute your scripts correctly is more problematic. That is why it is
    important for you to always identify the scripting language being inside your
    <script> blocks and appreciate some of the differences between HTML pages and
    JavaScripts. HTML tags are insensitive, whereas JavaScript elements are mostly
    sensitive. Because there are semantic differences between the interpretations
    of JavaScript in different browsers, sloppy coding that is accepted by one browser
    may not be accepted by another. Don''t be fooled!


    Script design and layout is a very important issue for the maintenance of your
    code. One of the greatest problems with JavaScript is the extent to which novices
    coders “borrow” another developer''s code and insert it into their own. Many pages
    contain the modern day equivalent of “spaghetti code”—unreadable, undebuggable
    code that is possible to maintain. Worse still, students copy and paste this code,
    thereby repeating others'' mistakes. By learning good design and commenting skills,
    you will develop good practices and avoid harmful ones.


    # STEP 1 – SELECTING JAVASCRIPT


    In your text, create a code block by inserting an opening <script> tag and a closing
    </script> tag. All scripts, whether they are JavaScript, VBScript, or any other
    scripting language, must be identified by an attribute in the <script> code block.
    Thus, to identify the code block as JavaScript, you would need to pass the appropriate
    attribute type="text/javascript", as shown in Exhibit 2.1.


    # EXHIBIT 2.1


    ```

    <script type="text/javascript">

    </script>

    ```'
