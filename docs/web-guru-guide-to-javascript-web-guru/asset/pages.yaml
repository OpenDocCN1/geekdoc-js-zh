  md: "# STEP 1 – CREATING A STRING\n\nA string can be created implicitly or explicitly.\
    \ An implicit definition creates a new variable and assigns a string value to\
    \ it. This creates what is known as a string literal. An explicit definition uses\
    \ the new keyword to indicate that a String object is created. Although string\
    \ literals can be used to access all of the normal properties and methods of a\
    \ full String object, string literals and String objects differ in one very important\
    \ way: if you compare the values of two string literals using the equivalence\
    \ operator (=), they will be treated as equivalent. However, if you compare two\
    \ String objects using the equivalence operator, then the match will be false,\
    \ because objects contain both data and methods, and you cannot compare them in\
    \ a simple way.\n\nIn fact, a string literal is associated with a String object,\
    \ but the object is implicitly created when the string literal is declared. As\
    \ a programmer, you do not obtain a reference to this implicit object, but you\
    \ can access its methods and properties using the string literal reference.\n\n\
    Exhibit 7.1 demonstrates the difference between the two approaches. Two window\
    \ alerts will be produced after two surname string literals are compared (yielding\
    \ a positive result). Two surname String objects that have been initialized with\
    \ the same value will return a false result. Note that if we use the toString()\
    \ to access the string literal of the String object in each case, the comparison\
    \ will return true, as shown in Exhibit 7.1.\n\n# EXHIBIT 7.1\n\n```\n<html>\n\
    <head>\n<title>Customers</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\ncustomer1 = new String(\"Eric Kwok\");\ncustomer2 = new String(\"Eric Kwok\"\
