  md: '# Exercise 3.1 – Identifying JavaScript Language Components


    In these exercises, you will learn how to use variables within JavaScript and
    how to select the appropriate variable type. This is a very important task when
    designing scripts, because many variables will be added, subtracted, multiplied,
    or have some more sophisticated operator applied to them. Ensuring that variables
    are honored at run time is sometimes problematic, but explicit typing can avoid
    these problems. That is why it is important to always identify the range and scope
    of expected variables before sitting down to write your script—and before you
    begin creating expressions or using logic operators. Some variables are assigned
    a value at design time that does not change. These special variables are called
    constants. They are used when you are sure that the initial value of a variable
    will never change.


    The " guts" of any JavaScript program is in the expressions that are created to
    operate on variables. For example, a credit card validation system takes a 16-digit
    string from an HTML text box and computes a checksum. The value from the text
    box must be assigned to a variable before it can be operated; otherwise, a validation
    function would have to be written for every possible credit card number! This
    does not mean that the value of a form element cannot be read without assigning
    it to another variable.


    JavaScript has a number of different language components, including variables,
    constants, expressions, operators, and statements, that can be found inside a
    script. It is very important to be able to distinguish between the different language
    components, because variables can have any name (apart from a reserved word) and
    some represent specific members of a system class or instantiated object (such
    as the document object).


    In this exercise, you will learn to recognize JavaScript errors that result from
    the use of reserved words and unacceptable characters for variable names. This
    is good programming practice, because runtime errors are difficult to debug. For
    example, the reserved word "if" as a variable name would raise the exception "Identifier,"
    which does not exactly indicate what has gone wrong! It is useful to review the
    exceptions before getting too into using variables.


    # STEP 1 – DECLARING A VARIABLE


    In your editor, create a code block by inserting an <script></script> tag. To
    declare a variable, you need to choose a name that represents the variable. For
    example, to declare a variable to represent the current temperature, you might
    name it "temperature".


    A variable must be declared inside a statement, which is a single, encapsulated
    unit of work. A statement may contain variable declarations, operations on variables,
    logical expressions, or a combination of these things. Statements should be delimited
    by a semicolon.


    Variable declarations are preceded by the reserved word "var," which is short
    for "variable." Exhibit 3.1 shows the declaration of the variable "temperature"
    using a valid statement.'
  merge: -1
