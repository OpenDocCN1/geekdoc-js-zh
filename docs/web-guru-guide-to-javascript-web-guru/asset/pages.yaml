  md: '# Summary


    In this chapter, you have learned how to control flow within JavaScript using
    iterators and simple variables types and reviewed how to use arrays in the context
    of control flow objects. Flow control allows you to build more sophisticated scripts,
    because you can manage the way in which certain code blocks are executed based
    on various conditional statements. As you will learn in the chapters that follow,
    making use of JavaScript objects, as arrays, gives you access to common features,
    as object iterators, that simplify code development.


    You also learned to use conditional and looping statements to ensure that certain
    blocks of statements are executed only under certain conditions or for a specific
    number of iterations. The number of iterations can be predetermined or evaluated
    on each pass through the loop. Looping and iteration are the corners of implementing
    logical decision making within scripts and are critical for developing flexible
    applications that work equally well with simple scripts and complex objects, as
    arrays.


