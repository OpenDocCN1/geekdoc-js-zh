    When you create complex logical expressions that are evaluated in if . . else
    statement, things can become very complicated quickly, and it is critical to ensure
    that your statement meets the order of operations specified in Chapter 3. One
    way to ensure that your logical expressions are testing what you intend is to
    read them (out of your head) as you construct them. So, while typing annualIncome.value<5000
    || liabilities.value>100000, you might read "if annual income is less than $50000
    or liabilities are greater than $100,000, . . . If you are thinking does not seem
    to match what you are reading, you may need to group comparisons within parentheses
    to ensure the correct order of operations is used.


    > TIP Complex Code Blocks


    So far in this chapter, you have only seen code blocks with one state; however,
    code blocks that are grouped by braces are not limited in the number of statements
    they can execute. Evaluate the same expression to execute two conditional statements,
    just group them together in a single code block and a single conditional statement.


