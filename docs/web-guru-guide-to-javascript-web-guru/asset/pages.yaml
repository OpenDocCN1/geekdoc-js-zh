  md: '# Exercise 9.1 – Getting Started with the Image and <img> Element Objects


    The Image and <img> element objects are used to support images in browsers. Although
    these objects share similar features, they differ fundamentally in the way they
    are used and created.


    In your scripts, you use Image objects to precache images that you will use later
    in a Web page. Image objects are created when you instantiate them in scripts
    using the new keyword (in the same that that Array objects are created using the
    new keyword). In contrast, <img> element objects are created by the browser when
    it loads a page that contains <img> elements. Each <img> element defined in an
    HTML page has a corresponding <img> element object that can be scripted in JavaScript.


    The Image objects you create are completely separate from any <img> elements in
    a page. Typically, a page loads with initial images defined with <img> tags. In
    a script defined in the page, you create instances of the images you want to work
    with using Image objects. This precaches the images by loading them into the browser’s
    cache in memory. These precached images are not displayed by the browser; they
    are just loaded into cache. Because the images are already loaded, when the user
    wants to access them, they can be displayed on demand and without delay. One reason
    to create instances of images in a script is simply to precache them so that they
    can be displayed quickly when a user accesses them.


    Table 9.1 shows the most commonly used properties, methods, and event handlers
    of the Image object. Because Image objects are not displayed, and therefore not-


    # TABLE 9.1 The Image and <img> element objects.


    | Properties | Methods | Events |

    |---|---|---|\| align | (none) | onabort |

    | alt | | onerror |

    | border | | onload |

    | complete | | |

    | height | | |

    | hspace | | |

    | lowsrc | | |

    | name | | |

    | src | | |

    | vspace | | |

    | width | | |

    | border | | |

    | x | | |

    | y | | |'
