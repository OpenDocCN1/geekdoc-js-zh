  md: '# STEP 2 – DISLAYING A WEB PAGE


    Open the HTML file you created in Step 1 in Internet Explorer by using the File,
    Open command. After parsing the HTML file, the browser will display it, as shown
    in Figure 1.2. Note the placement and style of the various header and body elements.
    These can be greatly enhanced through the use of Cascading Style Sheets (CSS),
    which have increased the display and style options available to Web page designers,
    but are beyond the scope of this book.


    # When to Use Dynamic HTML


    A facility that provides dynamic behavior for Web pages is necessary because the
    pages themselves contain very little information about the document''s structure
    or the display of items within the document. In this example, because the stock
    price of Sun Microsystems (and most other stocks changes times a day, it would
    be very inefficient to require someone to manually update the page for each change.
    Indeed, if a read lock on the HTML file was not respected by the Web server, then
    users would not be able to retrieve the stock price for a large percentage of
    the trading day. What is really required is the ability to update the contents
    of Web pages and the ability to control the display of data retrieved from a Web
    server.


    # FIGURE 1.2


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_25_0.png)


    # Stock Quote


    Sun Microsystems: $4.00


    # Exercise 1.2 – Creating a Dynamic Web Page


    Dynamic behavior can be added to Web pages in one of two ways: programming on
    the client side or programming on the server side. Server-side programming can
    generate dynamic Web pages through the use of Common Gateway Interface (CGI),
    Java Server Pages (JSPs), and Java Servlets. In practice, many Web-based applications
    use both server-side and client-side programming to create dynamic Web pages.'
