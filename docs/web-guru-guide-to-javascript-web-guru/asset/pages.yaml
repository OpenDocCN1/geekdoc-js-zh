  md: '# Exercise 11.1 – Accessing Window Properties


    Properties of the window object allow you to script various window settings and
    to check the status of window. Generally speaking, the most common way to refer
    to a property of a window is to reference the property name in the form:


    ```

    window.propertyName

    ```


    Because window is the top-level object and it always exists, you can also omit
    the reference to window any time you are referencing objects in the current window.
    This means another way to reference a property of the current window is


    ```

    propertyName

    ```


    In this exercise, you will learn techniques for accessing window properties by
    working with the status property. You use status to update the status bar at the
    bottom of the browser window. Normally, status messages appear when the browser
    is loading a document, when you move the mouse pointer over a hyperlink, and so
    on. You can also use status to display your own messages. For example, instead
    of displaying the URL of a link, you might want to display a custom message that
    provides more detail about the link.


    # STEP 1 – CREATING THE HTML PAGE


    In your text editor, create a new blank page. You will create a sample HTML page
    as shown in Exhibit 11.1. Use the TITLE and H1 elements as shown.


    # EXHIBIT 11.1


    ```

    <html>

    <head>

    <title>Accessing window properties</title>

    </head>

    <body>

    <h1>Updating the window Status</h1>

    </body>

    </html>

    ```


    # STEP 2 – SETTING THE STATUS MESSAGE


    In your text editor, add a hyperlink link to the page and define the onmouseover
    event handler as shown in Exhibit 11.2. Here, you define the event handler directly,
    which is the most common way to use the window.status property. Examine the script
    statement assigned to the onmouseover event handler. Note that the statement is
    surrounded by double quotes (""). Within the double quotes, you use single quotes
    to surround the string to display in the status area.'
  merge: -1
  pgno: 235
- img_proc: true
