  md: '# # Chapter 13


    # # Scripting Embedded Objects


    In this chapter, you will learn techniques for scripting embedded objects. In
    addition typical text and images, you can embed other kinds of content in Web
    pages. You can use hypertext links to create links between and within pages. You
    can use applets or ActiveX controls to provide additional functionality. Although
    these applets, and other types of embedded content usually require browser extensions
    or plug-ins to load and display, all types of embedded content are accessed in
    scripts which make the same way and typically through one of several types of
    special arrays. You use the links[] array to work with hypertext links between
    pages, and the applets[] array to work with named applets anchors within pages.
    Because the applet element has been deprecated in favor of the object element
    HTML 4.0, this chapter also examines how you can work with the object element.
    The object element can be used to represent any type of embedded content and also
    replaces the rarely used element.


    This chapter’s primary focus is on the special arrays accessible via the document
    object and the object element. It does not cover the embeds [] array, because
    the embed element is rarely used and has been deprecated in favor of the object
    element. The chapter goes into detail on scripting the applets[] array, because
    the applet continues to be used.'
  merge: -1
  pgno: 299
