  md: '# # Chapter 7

    Manipulating Strings


    Strings are some of the most important objects in JavaScript. String data literally
    form the body of dynamically generated HTML. String methods provide the ability
    to process string data and change its format as well as modify a string''s display
    properties.


    Although a string contains a set of characters, String objects have accessible
    properties, such as length, that are extremely useful for checking whether user-entered
    data is valid. For example, in a back-end database, a field size for a surname
    may only permit a maximum of 40 characters to be stored. If you use JavaScript
    to validate form data, you can use the String object''s length property to generate
    a user error without tying up valuable database server by submitting incorrect
    data. You can use JavaScript String objects to address individual characters in
    the string''s data as individual characters that you can sort, replace, and otherwise
    manipulate their values.


    # For Your Career


    In this chapter, you will learn how to use JavaScript String objects and their
    extensive set of methods and properties for manipulating sets of character data.
    String management is one of the most important skills for building complex form
    processing. This chapter will continue developing aspects of the Internet banking
    site with an emphasis on string processing.'
