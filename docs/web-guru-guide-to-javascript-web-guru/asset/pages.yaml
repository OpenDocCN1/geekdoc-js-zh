  md: '# CHAPTER 12 Examining documents


    # Summary


    In this chapter, you have learned techniques for customizing pages using the document
    object using arrays of objects contained in documents, and writing the contents
    of pages using scripts. As you have seen, the document object has many useful
    properties, methods, and handlers. A key thing to remember is that this chapter
    touches only the tip of the iceberg with regard to the document object.


    As learned in this chapter, the document object is the container for all elements
    in a Web page. You can customize pages using the document object, access arrays
    of objects, and change the page contents using the document object. Other chapters
    in this book will continue the discussion of the document object and related objects.


    # Test Your Skills


    # Practice Drill 12.1: Customizing a Frame


    Previously, you learned how to use document object properties to manage user preferences
    and color settings. This was the subject of Exercise 12.1. In this exercise, you
    are going to update this source code to work with frames. To write to a frame,
    you first reference the main frame source page (the parent) and then either the
    name of the frame or the frame index in the frames[], as shown in this example:


    ```

    parent.frames[1].document.open()

    parent.frames[1].document.write(contents)

    parent.frames[1].document.close()

    ```


    Here, you are referencing the second frame in a frameset.

    The following example shows how you can use one window to update the contents
    of another window.


    +   1. In your text editor, create a main frameset page. Use a frameset with a
    side frame and a main frame. Save the page as C12frames.html.


    ```

