    # STEP 3 - LOCAL AND GLOBAL SCOPE


    In your text editor, copy the source code shown in Exhibit 5.3. At the local level,
    function scope ensures that if a local variable has not been defined with the
    same name as a global variable, then the global variable can be referenced within
    a function. The value of that global variable is modified globally when it is
    modified locally. It is poor application design to rely on global variables, because
    they break the rules of encapsulation: You never know which other functions may
    have modified the value of a global variable before you modify it within a function.


    Good design ensures that functions call other functions as required. If operations
    need to be repeated several times, or in different contexts, then it makes sense
    to refactor functions to ensure optimal reuse.


