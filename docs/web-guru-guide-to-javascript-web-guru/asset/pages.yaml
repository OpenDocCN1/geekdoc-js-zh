  md: '# Chapter 14


    # Working with the Browser History List and Locations


    Browsers maintain information about the page you are currently visiting—the browser
    location as well as pages you have visited previously—the browser''s history list.
    In this chapter, you will learn techniques for accessing and working with browser
    locations and history lists. Before you get started though, it is important to
    note that security restrictions in most browsers restrict access to some browser
    history and location information. One workaround with Netscape Navigator 4 or
    later browsers is to use signed scripts. Otherwise, the information simply is
    not accessible to a script.


    > For Your Career\In the Career Builder at the end of the chapter, you will learn
    a technique for working around some of the security restrictions in Netscape Navigator
    4 and later versions of the browser. This technique uses the netscape.security.PrivilegeManager.enablePrivilege()
    method. Note how this method is used to allow the script to be used with both
    Internet Explorer and Netscape Navigator.'
