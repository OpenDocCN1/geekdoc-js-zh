    \ at a timed interval. To do this, you can create a simple image-\napping engine\
    \ that allows you to rotate images on a timed schedule.\n\nGetting the timer to\
    \ work is somewhat tricky. First, you need to start the timer when\nt page is\
    \ loaded. You can do this by adding an onload event handler to the docu-\nment's\
    \ body element, as follows:\n\n```\n<body onload=\"init()\">\n```\n\nHere, when\
    \ the document finishes loading, the onload event is triggered and the\nbrowser\
    \ calls the `init()` function.\n\nThe `init()` function is a basic timer that\
    \ sets a timer and calls another function\nat a specific interval. In this example,\
    \ the timer calls the `rotate()` function once\nevery second (1,000 milliseconds):\n\
    \n```\nfunction init() {\n  setTimeout(rotate()\", 1000);\n}\n```\n\nThe `init()`\
    \ function starts the first automatic rotation. To keep the automatic-\nrotation\
    \ going, you need a similar statement in the `rotate()` function.\n\nIn this project,\
    \ you will create a page that uses a timer to automatically rotate a ban-\ner\
