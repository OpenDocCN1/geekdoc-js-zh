    +   - Access window properties

    - Create and close windows

    - Set the features of new windows

    - Use confirm dialog boxes

    - Use prompt dialog boxes


    By working through the exercises, you will learn many things about windows and
    dialog boxes, such as how to set the window status, size windows, and bring windows
    to the front or put them to the back.


