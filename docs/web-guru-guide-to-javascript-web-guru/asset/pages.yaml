  md: '# Exercise 9.1 - Getting started with the Image and <img> element objects


    affected by elements on the page, the Image object does not have many properties,
    methods, or event handlers as some of the other objects we have looked at. Still,
    the properties of the Image object have are very useful. Additionally, because
    the set of properties, methods, and event handlers for <img> element objects are
    the same as for Image objects, a separate table is not provided.


    As you can see in Table 9.2, most of the Image object''s properties are used to
    identify their attributes that determine how an image is used when it is later
    displayed or to reading the attributes of an image. The exception to this is the
    complete property, which allows you to determine if an image has completely loaded.
    For example, you could use the complete property to make sure that an image is
    completely loaded before to work with it.


    The <img> object is easier to access than the Image object. Each <img> element
    created when a page is loaded can be accessed via the document.images [] array
    according to its index in the array or by the value assigned to the name attribute.
    The first image on the page is at index 0 in the document. images [] array. This
    means that if the image in a page is defined:


    ```

    <img name="cards" src="cards.gif" width="50" height="75" />

    it could be accessed using a reference to its index position:

    ```


    document.images[0]


    or a reference to its name:


    ```

    document.images["cards"]

    ```


    Knowing this, you can easily read a property of this <img> element object. For
    example, you could use the following to check if the associated image has finished
    loading:


    ```

    if (document.images["cards"].complete) {

    //the image has completely loaded so do this.

    }

    ```


    Here, you to see if the image has completely loaded. If it has, the browser executes
    the conditional code.


    In this exercise, you are going to use the document.images [] to display the properties
    of an image loading into a page. By following this exercise, you will learn how
    to access and work with properties of <img> objects. The image file for this and
    other exercises can be found on the Companion Web site for this book (www.prenhall.com/webguru).
    Before you begin, you should copy the necessary images for this chapter to your
