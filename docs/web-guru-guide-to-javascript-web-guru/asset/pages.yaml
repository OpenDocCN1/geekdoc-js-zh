  md: "# # Preface\n\nJavaScript is the most widely used power tool on the World Wide\
    \ Web. Just about every commercial Web site uses JavaScript in some way and so\
    \ many hobbyist Web sites. You can use JavaScript to implement rollers, customize\
    \ pages for users or browsers, and any hundreds of others tasks—if you know JavaScript\
    \ has to offer and when to use it. If you are a current Web designer or Web programmer,\
    \ a clear understanding JavaScript is essential to your long-term success. The\
    \ same applies if you want to be a Web designer or Web programmer.\n\nLike any\
    \ power tool, there's a right way and a wrong way to use JavaScript. The good\
    \ news is that know whether and when JavaScript is the right tool for the job\
    \ and as important you'll know the real-world solutions necessary to achieve your\
    \ desired results. A key focus in this book is the capabilities and limitations\
    \ of JavaScript. The more you know about JavaScript's capabilities and limitations,\
    \ the more likely you will be to use JavaScript when it is the right tool for\
    \ the job.\n\n# # Features\n\n+   - To help you learn the ways of JavaScript,\
    \ this book offers several features:\n- **For Your Career** To discuss real-world\
    \ issues or provide general discussion of the text pertains to actual Web sites\n\
    - **Tips** To offer insights, helpful advice, or additional information\n- **Practice\
    \ Drills** To offer practical exercises that reinforce the text\n- **Multiple-Choice\
    \ Questions** To test what you have learned by focusing on finding the best real-world\
    \ solutions to common design and production challenges\n- **Definitions Questions**\
    \ To test your understanding of key definitions in the text\n **Basic Projects\
    \ and Intermediate Projects** To provide you with additional opportunities to\
    \ work with topics covered in the text\n- **Career Builder** To help expand your\
    \ career portfolio or demonstrate advanced functionality you are likely to use\
    \ whenever you work with JavaScript\n\n# # Overview\n\nBy following the chapters\
    \ and exercises in this book, you'll not only learn JavaScript fundamentals, but\
    \ also the advanced techniques of current designers and programmers. Chapter 1\
    \ serves to introduce JavaScript and the scripting options available. From there,\
    \ the other parts of the book delve into the many features of JavaScript.\n\n\
    Chapter 2 discusses the techniques you can use to add scripts to Web pages. Chapter\
    \ 3 examines the basic programmatic capabilities of JavaScript including"
  merge: -1
