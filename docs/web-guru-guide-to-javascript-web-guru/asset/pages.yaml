    # Exercise 14.6 – Examining URL Components


    You can use the properties of the location object to work with the components
    of a URL. In addition providing access to the complete URL of the current page,
    the properties of the location object allow you to set the URL either in whole
    or in part. Because you can set the individual components of a URL, you can build
    URLs to pages based on user input. You can build queries to search engines.


    Table 14.3 describes the properties of the location object. As you study the table,
    consider the following URL:


    ```

    http://www.robertstenek.com:80/current/books.html#ruinmist

    ```


    In this exercise, you work with the URL components of the current page.


    # TABLE 14.3 Properties of the location object.


    | Property | Value | Type | Description |

    |---|---|---|---|

    | hash | String | Read/Write | Provides access to internal page links, designated
    by the hash (#). By setting the hash property, you can jump to the various internal
    links of a page. An example value is #ruinmist. Supported by NN2, IE3 and later
    as well as Mozilla and Safari. |

    | host | String | Read/Write | Allows you to check or set the current hostname
    and port information. An example value is www.robertstenek.com:80. Supported by
    NN2, IE3 and later as well as Mozilla and Safari. |

    | hostname | String | Read/Write | Allows you to check or set the current hostname.
    An example value is www.robertstenek.com. Supported by NN2, IE3 and later as well
    as Mozilla and Safari. |

    | href | String | Read/Write | Provides the complete URL to the current page;
    can be used to set the URL as well. An example value is http://www.robertstenek.com:80/current/books.html.
    Supported by NN2, IE3 and later as well as Mozilla and Safari. |'
