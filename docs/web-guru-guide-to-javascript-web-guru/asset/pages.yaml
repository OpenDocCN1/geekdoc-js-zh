    method, using the \n special character. Supported by NN2, IE3 and later as Mozilla
    Safari. |

    | writeln() | document.writeln("This line.") | Writes a string to the current
    page that includes a carriage return and line feed. The carriage return and line
    feed will make the text more readable in a text editor, although they may not
    affect the appearance of the page in a browser. Supported by NN2, IE3 and later
    as as Mozilla Safari. |


    Contary to what some people think, you cannot use these methods to update the
    text of existing documents. There is a workaround that allows you to update a
    document after it is written, but the implementation causes problems on most platforms.
    Still, if you need to update a document, try this: Assemble the additional markup
    as a complete object, pass the object to a simple document.write() statement,
    and issue a document.close() instruction as the next line of the script. This
    forces the browser to rewrite the contents of the document. If you do not use
    this technique, the document.write() or document.writeln() method will overwrite
    the contents of the page and there will be no script to execute further. Consider
    the example in Exhibit 12.8 as how you would show:


    # EXHIBIT 12.8


    ```

    var myWeb = "<html><head> + "\n";nmyPage += "<title>Test Page</title>" + "\n";nmyPage
    += "</head>" + "\n";nmyPage += "<body>" + "\n";nmyPage += "<h1>Placeholder</h1>"
    + "\n";nmyPage += "</body>" + "\n";nmyPage += "</html>" + "\n";nparent.side.document.open();

    parent.side.document.write(myPage);

    parent.side.document.close();

    ```'
