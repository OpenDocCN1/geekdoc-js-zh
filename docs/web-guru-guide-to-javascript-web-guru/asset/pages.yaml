    The former is usually responsible for the HTML markup, whereas the latter is responsible
    for the scripting. Indeed, to encourage proper demarcation, the JavaScript developer
    may only allow read-only access to his or her JavaScript code to the HTML developer
    to prevent inadvertent modification of the JavaScript code.


    # STEP 1 – CREATING A WEB PAGE


    In order to introduce some basic concepts, let''s start by creating a HTML document.
    In your text editor, create a new blank page and save it "stockquote.html" You
    will create a sample HTML page for a stock price quote by entering the HTML code
    shown in Exhibit 1.1.


    # EXHIBIT 1.1


    ```

    <html>

    <head>

    <title>Stock Quote</title>

    </head>

    <body>

    <h1>Stock Quote</h1>

    <p>Sun Microsystems: $4.00</p>

    </body>

    </html>

    ```


    In addition to the tags shown here, some tags can accept attributes that modify
    their behavior in some way. For example, on HTML forms that contain an OK button,
    the name of the button and its displayed value must be specified by using an attribute,
    as shown below the address field:


    <input type="button" name="btnOK" value="OK"></p>'
