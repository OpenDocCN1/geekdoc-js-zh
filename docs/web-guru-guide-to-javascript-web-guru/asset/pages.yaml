    | pathname | String | Read/Write | Allows you to check or set the URL path information,
    which is relative to the current directory on the server. An example value is
    /current/books.html. Supported by NN2, IE3 and later as well as Mozilla and Safari.
    |

    | port | String | Read/Write | Allows you to check or set the server port. An
    example value is 80. Supported by NN2, IE3 and later as well as Mozilla and Safari.
    |

    | protocol | String | Read/Write | Allows you to check or set the protocol used
    to access the current page. An example value is http:. Supported by NN2, IE3 and
    later as well as Mozilla and Safari. |

    | search | String | Read/Write | Allows you to check or set the search query/form
    information from the URL. Frankly, this is everything appended after the URL and
    starting with the question mark added for queries. An example value is ?books+ruin+mist.
    Supported by NN2, IE3 and later as well as Mozilla and Safari. |


