  md: "# Exercise 6.1 – Using JavaScript Objects\n\nJavaScript has many different\
    \ types of standard objects. These include objects such as arrays, whereby methods\
    \ operate on the data that you supply, or objects as the window objects, which\
    \ supply of their own data as well as associated objects. In previous chapters,\
    \ you have used some examples of the window object, so it is appropriate to begin\
    \ our explanation of objects with the window object before moving on to self-defined.\n\
    \nEach time a window is produced on the screen, a JavaScript object is instantiated.\
    \ The window object has many properties and methods that allow you to work with\
    \ frames, alerts, or the main window. Complex Web applications, such as Internet\
    \ Banking Websites, make use of multiple windows, frames, and alerts. In this\
    \ exercise, you will explore how to create a more interactive, menu-driven system\
    \ for the Internet banking.\n\nThe properties of window objects are accessed by\
    \ using a reference to the window object and then using the dot (.) operator to\
    \ access the required property. For example, window.name returns the name of the\
    \ current window. Like window object properties, object methods can be invoked\
    \ with the dot operator. For example, window.close() will close a window, and\
    \ window.open() will open a new window. Note some methods, such as window.open(),\
    \ have a number of attributes that can be modified at creation. For example, you\
    \ can set the height and width of a new window and place scrollbars or menus on\
    \ the window or remove them. Dialog boxes allow users to enter information, acknowledge\
    \ alerts, and accept requests that are made to them, providing an ideal set of\
    \ input and output routines. However, routines are limited because window.prompt()\
    \ can only accept one input parameter at a time. In the following example, you\
    \ will use dialog boxes, rather than an HTML form, to obtain input.\n\n# STEP\
    \ 1 – GETTING USER DATA FROM PROMPTS\n\nIn the previous chapter, you used a HTML\
    \ form to obtain username and password parameters. However, JavaScript's window\
    \ object allows users to enter these details into a special prompt window called\
    \ window.prompt(). In the following example, you will extend the login.html page\
