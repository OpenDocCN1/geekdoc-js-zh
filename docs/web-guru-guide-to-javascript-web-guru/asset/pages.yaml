    # Exercise 17.6 – Working with the password, hidden, text, and textarea Objects


    The password, hidden, text, and text area fields in a form are all used to obtain
    input from users or temporarily store information. Input fields are used to create
    a single line of data. Password fields are specialized types of text fields. With
    a **password field**, any text that is entered is masked with asterisks. With
    a **hidden field**, you can store information that you want to pass along to the
    server or use in another page. **Text area fields** are multiple-line input into
    which users can use multiple lines of text.


    The related objects for scripting password, hidden, text, and text area forms
    are `password`, `hidden`, `text`, and `textarea`, respectively. Table 17.9 summarizes
    the properties, methods, and events of the `text`, `password`, and `hidden` objects.'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# TABLE 17.9 The password, hidden, and text objects.


    | Properties | Methods | Events |

    | --- | --- | --- |

    | defaultValue | blur() | onafterupdate |

    | form | focus() | onbeforeupdate |

    | maxLength | select() | onblur |

    | name | | onchange |

