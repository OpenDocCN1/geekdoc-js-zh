    can display a message to the user with OK and Cancel buttons (see Figure 11.5).
    This type of dialog box can be used to ask the user a question.


    Because there are two different buttons, your scripts can test to see which button
    the user clicked and take the appropriate action. Similar to the alert() method,
    the confirm() method of the window object accepts a single parameter. This parameter
    is a string containing the message you want to display, such as:


    ```

    confirm("Do you want to continue?");

    ```


    When the user clicks the OK button, the confirm() method returns true. When the
    user clicks the Cancel button, the confirm() method returns false. This means
    you can check the user''s response with conditional statements, such as if...


    In the following exercise, you will learn techniques for handling output from
    dialog boxes. This is an important skill that you will need to learn so that you
    create scripts that respond appropriately to user selections. For example, if
    a user clicks the Cancel button instead of the OK button, your script should be
    able to handle this. For all, there is no reason to use dialog boxes if you do
    not want to collect information from a user.


