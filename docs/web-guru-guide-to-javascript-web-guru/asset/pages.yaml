  md: "# Web Guru Series Walk-Through\n\nThe Web Guru Series is designed to help you\
    \ understand the “programming” behind basic Web applications and create a Web\
    \ page or program that you can add to your portfolio. This walk-through highlights\
    \ the key elements you'll find in this book created to help you along the way.\n\
    \nChapter Introduction. Introductory material at the beginning of each chapter\
    \ explains why these topics are important and how the chapter fits into the overall\
    \ organization of the book.\n\nChapter Exercises. These objectives give you short-term,\
    \ attainable goals. They mirror the titles of the step-by-step exercises.\n\n\
    # Chapter Exercises\n\n+   This unit's exercises will teach you how:\n- Identify\
    \ JavaScript as the scripting language used in a Web page\n- Add JavaScript to\
    \ Web pages\n- Use comments inside JavaScript\n- Solve compatibility issues between\
    \ browsers and JavaScript versions\n\nVisual Summary. This illustrates the project\
    \ you will complete by the end of the chapter.\n\n![](img/ecbd0b33770c7243bdf70ab10c4515ec_12_0.png)\n\
    \nBy working through the exercises you will identify multiple methods and elements\
    \ to create a stylish Web page that has diverse, and interactive features.\n\n\
    | sourcebank.com |\n|---| \n| Welcome to SourceBank! |\n\nCHAPTER 2 Adding client-side\
    \ scripts to web pages\n\n# Exercise 2.1 - Identifying JavaScript\n\nJavaScript\
    \ has different versions and implementations, of which may have significant differences\
    \ in functionality. Overall, other scripting languages may not be able to correctly\
    \ identify JavaScript as the language chosen for HTML pages.\n\nYou will learn\
    \ several ways to include JavaScript in an HTML document, such as using an inline\
    \ script and how to script from an external file on a web page. These methods\
    \ vary depending on the version of HTML development and JavaScript programmers.\n\
    \nAccording to the W3C, the language attribute is used to identify the HTML language.\
    \ In the future, all tags will have an attribute such as in <script type=\"text/javascript\"\
    > where both the MIME type and the kind stated as in <script type=\"javascript\"\
    > will identify JavaScript for HTML.\n\n# STEP 1 - IDENTIFY JAVASCRIPT\n\nIn this\
    \ exercise, you will learn about opening a script tag using <script> tag. All\
    \ scripts, whether they are JavaScript, or other scripts, are contained within\
    \ the script block. Thus, to include the code for JavaScript, you would need to\
    \ pass the script attribute, such as type=\"text/javascript\", as shown in Exercise\
    \ 2.1.\n\n```\n<script type=\"text/javascript\">\n</script>\n```\n\n# Step-by-Step\
    \ Exercises. Hands-on tutorials you will \"learn\" by and include numbered, step-by-step\
    \ instructions."
  merge: -1
  pgno: 12
