    You can set and get properties of links by referencing the `links[]` array and
    the index of the link you want to work with. For example, if you want to get the
    value of the target for the first link in the page, you would use the following
    code:


    ```

    targetName = document.links[0].target;

    ```


    If you wanted to set the target name, you could do this as well. The following
    example sets the target name to main:


    ```

    document.links[0].target = "main";

