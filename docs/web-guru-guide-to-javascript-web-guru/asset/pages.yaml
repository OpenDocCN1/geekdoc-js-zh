  md: '# Exercise 1.7—When not to use JavaScript


    form is validated on the server side, every mistake require four network operations:
    the original request, the response indicating an error, the modified request,
    and the final response. By using JavaScript, you can process data without going
    back to the Web server, reducing network traffic in a significant way. Particularly
    for users with slow modem/connections computers, this can be really useful.


    The benefit of using JavaScript is that scripts can access the local features
    of a Web browser, which server-side processes cannot. For example, JavaScript
    can be used to create windows with certain dimensions or to obtain the value of
    the status bar. This can be very useful when customizing pages for displaying
    different types of information based on local conditions.


    # Exercise 1.7 – When Not to Use JavaScript


    Although JavaScript is very useful, there are several reasons why you might not
    use it for every Web site. For example, simple web applications request data from
    a server and display the results on the screen. What if you needed to write data
    back to the server directly without requiring the user to press a submit button?
    In this scenario, you''re going to need a "fatter" or "thicker" client that can
    use different protocols and have more general-purpose programming capabilities.
    For example, Java applets support Remote Method Invocation (RMI) to execute method
    calls on remote objects. JavaScript cannot do this directly, although it can act
    as the backplane for a servlet that could directly access these objects. In general,
    if you need applications with such advanced level of functionality, it is timely
    to migrate from a simple Web server to a J2EE application server or to Microsoft
    .NET.


    Another problem with JavaScript is its poor security model. When you create a
    script and include it in a Web page, it is downloaded to the client browsers and
    executed. However, any user can browse the contents of a downloaded page and its
    scripts by selecting "View Source" from the menu bar. Developers have devised
    various tricks and obfuscation methods, such as hiding the menu bar, to avoid
    this problem, but a determined hacker could use HTTP commands directly on the
    Web server to download the scripts without executing them. Thus, you need to accept
    that everyone can see your scripts and download and remove them without your permission.
    If you need a stronger security model on the client side, applets are probably
    your best choice, because they can normally only write data to the server from
    which they were downloaded. However, even applets cannot completely hide the source
    code, because Java bytecode can be inspected and decompiled easily, even if an
    obfuscator is used to randomly assign variable and method names to make it hard
    to follow.


    The final situation when JavaScript is not suitable is you need a more specialized
    programming architecture on the client, such as a component model. Although Web
    pages have a well-defined object model, if you want to create your own, you are
    going to need something like Java Beans. Again, there is nothing stopping you
    from creating JSPs that access beans and have JavaScript, but remember that JavaScript
    can''t do everything!'
