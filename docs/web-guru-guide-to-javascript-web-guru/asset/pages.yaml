  md: '# Glossary


    alert—A dialog box used to present a message to users; includes an OK button users
    can click to close the dialog box.


    assignment operator—Assigns a value to a variable.


    Boolean—An operator that computes basic Boolean logic functions such as AND, OR,
    or NOT.


    borderless frames—A frame of a specific size in which all content is set to zero.
    Borderless frames give your page a more cohesive appearance because they do not
    display scrollbars.


    browser cookie—See cookie.


    browser location—The URL of the current page as referred to by a browser and stored
    in the location object.


    character escaping—A technique that allows special characters to be quoted within
    string text.


    checkbox—A formrelated HTML element that can be toggled between checked and unchecked;
    when you want to make one or more selections from a group of elements.


    child document—A frame created by a parent document. If a script in a child frame
    needs to access the functions, methods, or properties of the parent document,
    the script must follow the hierarchy of the parent document.


    children—See document.


    Common Gateway Interface (CGI)—A technology that allows remote users to execute
    applications on a Web server and see the results returned in the form of a Web
    page. It is a way for the Web server to


    pass the browser''s request to an application and then pass data from the application
    back to the browser.


    confirm—A dialog box with OK and Cancel buttons that is used to display a message
    to users.


    constant—A named value that does not change.


    constructor method—A method of an object, code invoked in the instantiation of
    an object.


    constructor—A method that is called when a new object is instantiated.


    cookie—Used to store information on the client computer that can be retrieved
    in other pages or in other browsers. Many Web sites store information in cookies
    to customize their pages for individuals.


    data dictionary—A document that describes the variables used in a script.


    data structure—A structure that holds private fields of different types, but lacks
    methods.


    document object—A JavaScript object that represents a Web browser and its windows.


    Document Object Model (DOM)—A generic model for working with documents, allowing
    an application to interface with the document.


    Dynamic HTML (HTML)—A combination of JavaScript and Cascading Sheets (CSS) to
    produce dynamic browser behavior.


    encapsulated—An object that is self-contained or inaccessible to other sections
    of code.


    event—A procedure that is executed automatically when a certain condition exists.
    In browsers, there are events for mouse clicks, mouse movements, button clicks,
    and so on.'
  merge: -1
  pgno: 501
- img_proc: true
  md: 'event handler—An object property or method that specifies how an object reacts
    to an event. Events can be triggered by a user action, such as a button click,
    or a browser action, such as the completion of a document load.


    interpreter—A program that reads JavaScript statements and executes them.


    expression—A statement made up of function calls, constants, or operators that
    evaluate a value and can be assigned to a variable.


    # J


    Java Server Pages (JSP)—JSP technology allows Java code to be included in HTML
    Web pages and compiled at runtime to produce dynamic behavior.


    JavaScript—An interpreted, object-based programming language primarily used to
    script dynamic Web pages.


    # F


    form control—A form-related HTML element such as an input field, push button,
    or text area field.


    function—An encapsulated code block that can take arguments and returns a single
    value that can be assigned to a variable.


    # L


    looping statement—A statement that ensures that a code block is executed multiple
    times.


    # H


    hidden—A field included in an HTML form that is not displayed on the page; a special
    HTML form field that is hidden and cannot be modified by the user (unless a user
    were to view the HTML source).


    # M


    method—A function that belongs to an object and can be called by a script to perform
    an action.


    history list—A browser-maintained list of places a user has visited.


    # O


    HTML control—An HTML element that can be manipulated by scripts. HTML controls
    include checkboxes, radio buttons, buttons, textareas, and selection menus.


    object—An abstract entity, modeled from a “real-world” entity, that has both methods
    and data associated with it.


    Hypertext Markup Language (HTML)—A simple language for marking up Web pages for
    display, including document structure and hyperlinks.


    object initializer—A constructor that initializes private members to specific
    values during instantiation.


    Hypertext Transfer Protocol (HTTP)—The standard protocol for transferring documents,
    written in HTML, over the World Wide Web.


    ordered set—A group of related elements that has an ordinal relationship.


    # P


    identifier—An arbitrary element assigned to variables during interpretation.


    parameter—An argument to a method or function call.


    initial value—The value to which a variable is set during initialization.


    parent document—Any document that contains a frameset definition.


    in-line comment—Statements within a script that are ignored by the interpreter
    and are present for explanatory value only.


    password field—A text input in an HTML form in which the characters are marked
    with asterisks or are hidden from view.


    persistent cookie—A stored cookie.


    prompt—A dialog box box that presents a message and allows users to enter information
    in response to the message. Prompt dialog boxes also have OK and Cancel buttons.'
  merge: -1
  pgno: 502
- img_proc: true
  md: '# 484


    # Glossary


    property—Defines a setting of an object.


    protype property—Allows new members to be added to extending JavaScript objects.


    push button—A element in an HTML form that can be clicked.


    radio button—A form-related HTML element that is a small circle that is drawn
    and filled when the user selects; when you want a user to make a single selection
    from a group of selections.

    reserved word—A set of names used by JavaScript constructs that cannot be used
    as variable names; avoids ambiguity during interpretation.


    scripts—Blocks of JavaScript code that are generally embedded inside an HTML document.

    selection menu—A form-related HTML element that creates a menu of choices from
    which a user can choose.

    statement—A syntactically valid code element that is encapsulated.


    stored cookie—A cookie with an expiration date. Such a cookie will be persisted
    and stored on the user''s computer and available until its expiration date as
    long as it is not deleted or the expiration date isn''t reset.

    string—An object that consists of a set of alphanumeric characters and associated
    members.

    string literal—The character values stored as private data of a string object.


    text area field—A HTML form element that provides a large text entry field in
    which users can type information. A text area field is different from a standard
    text input field because it can have multiple lines.


    text input field—A HTML form element that provides a single-line text field in
    which users can type information.


    type declaration—A statement that describes the type of a variable when it is
    defined.


    Uniform Resource Locator (URL)—Represents the physical location of an HTML document
    on the Wide Web.


    variable—A script that can take any value that is consistent with the variable''s
    type. JavaScript variables are not strongly typed.


    Web page—A HTML document designed to be viewed in a web browser.


    window object—The top of the browser object model for all script browsers. As
    such, window is the top-level container for all content you view in a web browser.
    Whenever you start a browser, the window object is defined in memory—even if no
    document is loaded.


    ```

    window.alert()—See alert.

    window.confirm()—See confirm.

    window.prompt()—See prompt.

    ```


    temporary cookie—A cookie without an expiration date. A cookie that is only valid
    for the current session. If the user exits the browser window, the temporary cookie
    is deleted.


    XHTML—The most current form of XML-compatible HTML.'
  merge: -1
  pgno: 503
