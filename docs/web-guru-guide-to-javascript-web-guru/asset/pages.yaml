  md: '# Exercise 12.2 - Accessing Objects within Document


    Many objects within documents can be accessed by special arrays. You can use these
    arrays to access anchors, frames, images, forms, and links as well as any embedded
    elements and objects in your Web pages by their index. For a summary of these
    properties, see Table 12.3.


    # TABLE 12.3 Indexed properties of the document object.


    | Property | Type | Description |

    | --- | --- | --- |

    | anchors[] | Array | Read-only | Allows you to reference named anchors by their
    index. Supported by NN2, IE3 and later as well as Mozilla and Safari. |

    | applets[] | Array | Read-only | Allows you to reference applets on your page
    by their index. Supported by NN2, IE3 and later as well as Mozilla and Safari.
    |

    | embeds[] | Array | Read-only | Allows you to reference embedded objects in your
    page by their index. Supported by NN3, IE4 and later as well as Mozilla and Safari.
    |

    | forms[] | Array | Read-only | Allows you to reference forms in your page by
    their index. Supported by NN2, IE3 and later as well as Mozilla and Safari. |

    | frames[] | Array | Read-only | Allows you to reference the window objects of
    any frame in your page by their index. Only supported by IE4 and later. |

    | images[] | Array | Read-only | Allows you to reference images in your page by
    their index. Supported by NN3, IE4 and later as well as Mozilla and Safari. |

    | links[] | Array | Read-only | Allows you to reference links in your page by
    their index. Supported by NN2, IE3 and later as well as Mozilla and Safari. |


    Use the frames [] Array Carefully

    The document.frames[] property is available only in Internet Explorer 4.0 or later.
    It is used to reference any frame elements of a frame source page or any iframe
    defined in a document. If a script is in a frame source page, the frames[] array
    contains the window objects from the frames you have defined. If a script is in
    a page with iframe elements, the frames[] array contains the window objects from
    the frames you have defined. Being able to distinguish frame and iframe in Internet
    Explorer is sometimes important, because frame and iframe elements have different
    methods and properties from window objects. If a document isn''t a framesource
    page or doesn''t have any iframe elements, the document.frames[] array has a length
    of zero.


    You will learn more about these arrays in later chapters. For now, let''s look
    at basic usage. When you use these properties, keep in mind that index zero always
    points to the first element or object of a particular type. Following this, you
    could refer to elements of the'
