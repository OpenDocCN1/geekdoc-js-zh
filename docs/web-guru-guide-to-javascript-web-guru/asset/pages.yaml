  md: "# Exercise 11.2 – Creating and closing windows\n\nThis creates a new window\
    \ named \"display\" that loads an HTML document from the same server directory\
    \ as the current document. The window is sized so it is 400 pixels wide and 300\
    \ pixels high (400 × 300).\n\nIt is also important to note that you use an assignment\
    \ statement to create the window. open() returns an object reference to the window\
    \ and that object reference is assigned to the variable. Because the variable\
    \ holds a valid object reference to the window, you can use the variable to access\
    \ the properties and methods of the newly created window from a script in the\
    \ main window. For example, if you wanted to move the window to the back and make\
    \ it inactive, you could use this reference to the blur() method for the subwindow.\n\
    \n```\nnewWindow.blur();\n```\n\nHowever, if a window does not open successfully,\
    \ the variable holds a null value, and an error may be generated. Therefore, you\
    \ should test for the null value, by working with a new window, in the following:\n\
    \n```\nnewWindow = open(\"\",\"\");\nif (newWindow) {\n  newWindow.blur();\n}\n\
    ```\n\nYou can close a window as easily as you open it. To close the active window\
    \ from a script in your window, use the following:\n\n```\nself.close();\n```\n\
    \nIf you want to close a window from the main window, you would use this reference\
    \ to the close() method for the subwindow:\n\n```\nnewWindow.close();\n```\n\n\
    When you close the window, the onClose event occurs, and if the associated page\
    \ handles this event, the defined action is executed. Most browsers will not let\
    \ you close the main window unless the user confirms he or she wants to close\
    \ the window. Therefore, if you try to close the main window, users will see a\
    \ confirmation box.\n\nIn this exercise, you will learn techniques for creating\
    \ subwindows. Ideally, each subwindow should be initialized using a global variable\
    \ rather than a new variable within a function. Using a global variable ensures\
    \ that the holding window is valid for as long as the main document is loaded\
    \ in the browser. It also allows you to work with window in multiple functions.\
    \ For example, you have one function that creates the window and another that\
    \ closes the window.\n\n# STEP 1 – CREATING THE SUBWINDOW\n\nIn your editor, create\
    \ a new blank page. You will create a sample HTML page as shown in Exhibit 11.5.\
    \ Use the TITLE and H1 elements as shown.\n\n![](img/ecbd0b33770c7243bdf70ab10c4515ec_240_0.png)\n\
    \nWindows XP with Service 2 or later allow a builtin pop-up blocker that will\
    \ block window open() if disabled. This pop-up blocker is configured as a privacy\
    \ feature. In Control Panel, double-click the Internet Properties tab of the Pop-Up\
    \ panel to configure how windows appear. Keep in mind that some firewall and antivirus\
    \ programs include pop-up blockers. For example, with Norton Personal Firewall,\
    \ pop-up blocking is enabled by turning the Blocking feature off.\n\n![](img/ecbd0b33770c7243bdf70ab10c4515ec_240_1.png)\n\
    \nKeep in mind that you must use a full reference to a subwindow. If you used\
    \ self.close() or window.close(), the browser will close the main browser window\
    \ instead of the subwindow. Because of this, you must reference the subwindow\
    \ you want to work with by its variable."
  merge: -1
