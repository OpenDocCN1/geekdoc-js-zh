  md: '# Test your skills


    To test this script properly, you will have to change the system date. Just remember
    to change it back to the proper date when you are finished.


    # INTERMEDIATE PROJECTS


    The following intermediate projects provide you with the opportunity to work with
    Date objects and their methods in an advanced way.


    # Project 8.1 - Creating a Digital Clock


    Many Web pages display the date and time. In this exercise, you will create a
    simple Web page that displays a digital clock. Use the Date methods that you have
    learned to capture the hours, minutes, and seconds and display them in the format
    "hh:mm:ss". This is easily achieved by assigning the value of to a text box.


    To initiate a function that will create this display, place an onload event in
    the <body> tag (e.g., <body>onload="functionName()"). Also, the last line in your
    function should be setTimeout("functionName",1000); where function is the name
    of your function. The setTimeout() calls your function every 1000 milliseconds
    (each second). In the next chapter, you will see how setTimeout can be used within
    a different function than the one being called.


    Hint: To achieve the two-digit display, you must check every value and add the
    leading zero when there are less than 10 minutes, seconds, or hours.


    Your output should look similar to this—10:05:55—with the value for seconds changing
    every second.


    # Project 8.2 - Determining the Days Remaining Until Special Events


    In Practice Drill 8.2 and Basic Project 8.2, you used the methods of the Date
    object to calculate new dates. In this exercise, you will expand the use of the
    Date object by determining the days remaining until some future date. It is essentially
    the reverse of what was done in the previous exercises.


    Create a Web page that displays the number of days remaining until three special
    days. For this exercise, create a Date object of January 1, 2000: var today =
    new Date("January 1, 2000"). Create three special event Date objects (the dates
    are suggested that you can verify with the solution code:)


    +   - Your birthday: January 2, 2000

    - Fourth of July: July 4, 2000

    - New Year''s day: January 1, 2001


    Calculate and display the number of days until each special event. Output should
    be similar to this: There are 184 days until July 4th.


    Hint: JavaScript does not have a simple subtraction function for dates. Remember
    that when a Date object is created, it counts the number of milliseconds since
    January 1, 1970. Therefore, if you want to compare two dates, you cannot simply
    subtract one from the other; the result would be in milliseconds. Rather, you
    must subtract the dates and then calculate the value by dividing the resulting
    milliseconds. To get seconds, you must divide the result by 1,000. To get minutes,
    you must divide the seconds by 60 (60 seconds/minute). To get hours, you must
    divide the minutes, and so on.


