    </head>\n<body>\n</body>\n</html>\n```\n\n+   2. Insert the JavaScript code block\
    \ after the TITLE element but before the </head> tag.\n\n```\n<script type=\"\
    text/javascript\">\n</script>\n```\n\n+   3. Insert the JavaScript functions into\
