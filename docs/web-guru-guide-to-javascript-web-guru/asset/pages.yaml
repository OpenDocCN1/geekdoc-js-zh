    cycle through the available numbers until the current day of the month is reached.
    When the current day of the month is reached, the first index points to the appropriate
    banner, and you can use the index to assign the image source. The code for the
    scheduledRotate() function follows:


    ```

    function scheduledRotate() {

    var aDate = new Date();

    var today = aDate.getDate();

    var index = 0;

    var currIndex = 0;

    for (x = 0; x < today; x++) {

    if (currIndex < bannerCount + 1) {

    index = currIndex;

    }

    if (currIndex >= bannerCount ) {

    currIndex = 1;

    }

    document.images[bannerName].src = bannerPrefix + index + bannerSuffix;

    }

    ```


    Now that the banner is complete, you need a way to call it in a Web page. The
    onload event handler provides the perfect mechanism for this:


    ```

    <body onload="scheduledRotate()">

    <h1>Rotating Banners According To A Schedule</h1>

    <img alt="banner" src="beguril.jpg" name="banner" height="100" width="300" border="0"/>

    ```


    +   You can then use the scheduledRotate() function in a sample page. Test the
    page by loading it into your browser. You can customize the banner using the variables
    set at the beginning of the script.'
