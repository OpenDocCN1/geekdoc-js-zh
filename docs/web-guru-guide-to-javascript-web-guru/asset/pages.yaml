    <head>

    <title>Checking radio buttons</title>

    </head>

    <body>

    <h1>Scripting and Validating Radio Buttons</h1>

    </body>

    </html>

    ```


    +   2. With the body of the page, add a form that contains a radio button group.
    Because you want to simulate preprocessing of a form, you set a submission method
    and action call a function that returns a Boolean value that can be used to determine
    if the form should be actually submitted or if the submission should be cancelled.
    Note that none of the radio buttons are selected by default in this example.


    ```

    <form name="myform" method="POST" action="http://www.pearson.edu/reg.pl" onsubmit="return
    validradadio(this)">

