    # Exercise 13.3 – Examining the applet Object


    Applet objects are created when you use the <applet> tag in a Web page. As soon
    as an applet is loaded into your page, you can read and write all the properties
    and methods of the applet just as you would read and write properties and methods
    for other JavaScript objects.


    Table 13.3 provides an overview of the properties, methods, and events of the
    applet object.


    Although applet objects have many properties and event handlers, in practice these
    properties and event handlers are rarely used except to set initial values for
    an applet. More commonly, scripts work with the properties and methods defined
    in the code of the applet.


    With the anchor object, you cannot access applet objects directly. Instead, you
    will access applets via the document object, either by name or by index in the
    applets[]. The name you use to reference an applet is the one assigned in the
    name attribute of the <applet> tag. If the following applet definition is in your
    Web page:


    ```

    <applet code="MyApp.class" name="applet1"></applet>

    ```


    you could access this applet using:


    ```

    document.applet1.property

    ```'
