    \ for each. This may sound drastic, but if you are dealing with important applications\
    \ such as Internet banking, you may need to support different browsers. Even if\
    \ one browser holds 10 percent of the market, out of a population of 100 million\
    \ users, that is 10 million that needs to be supported.\n\nYou can specify the\
