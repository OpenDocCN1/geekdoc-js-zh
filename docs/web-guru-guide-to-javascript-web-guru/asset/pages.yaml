    Following the if statements, you will want to create messages to indicate that
    errors have been made and include them in alerts.

    As you see, regular expressions can appear to be very complex, but they are not
    difficult to create once they have been broken down into their individual components.
    They are also very powerful and can be used to check for patterns that would require
    many lines of code to accomplish otherwise. If you want to experiment with regular
    expressions, several common used patterns follow:


    +   - \w—Matches any alphanumeric character (all letters)

    - [a-z]—Matches lowercase letter

    - [A-Z]—Matches any uppercase letter

    - [a-zA-Z]—Matches any letter

    - {n,m}—Matches the previous item(s) at least n times, but more than n times


