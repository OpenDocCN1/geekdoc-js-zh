  md: '# # Summary


    Most scripts you will use work with the browser window in some way. As you have
    learned in this chapter, window is the top-level object, and it always exists.
    This means you can reference properties of the current window without referencing
    the window object. However, for clarity, it is usually a good idea to refer to
    the property you want to work with fully in the window.propertyName.


    You can also create custom windows. These custom windows can have a variety of
    features that you specify when you instantiate the window, including the window
    height, width, toolbars, and buttons. Another type of dialog available in a script
    is a dialog box. JavaScript supports alert, confirm, and prompt dialog boxes,
    all of which have different uses and purposes. Confirm dialog boxes display a
    message, typically a warning, to users. Confirm dialog boxes display a message
    with OK and Cancel buttons that allow users to confirm or cancel an action. Prompt
    dialog boxes display a message and have an input field as well as OK and Cancel
    buttons. This allows users to answer questions or input information.


    # # Test Your Skills


    # ## Practice Drill 10.1: Setting a Default Status


    Previously, you learned how to set a status message. The browser window also has
    a default status message, which is normally set to an empty string (""). After
    a document is loaded into a window, the default status message is displayed any
    time the mouse pointer is not over it. Moving the mouse pointer over a link or
    other object updates the status bar. You can set a default status message at any
    time, the best time to do so is when a document loads into a window.


    The following example shows how you can use a default status along with other
    status messages:


    +   1. In your text editor, create a HTML page with the appropriate HEAD and BODY
    elements. Use a TITLE element with the text "Using status messages."


    ```html

    <html>

    <head>

    <title>Using status messages</title>

    </head>

    <body>

    </body>

    </html>

    ```


    2. Insert the following JavaScript code block before the TITLE element but before
    </head> tag. This script sets the default status of the browser window.


    ```javascript

    <script type="text/javascript">

    window.defaultStatus = "Welcome to my Web site!

    Thank you for visiting."

    </script>

    ```'
