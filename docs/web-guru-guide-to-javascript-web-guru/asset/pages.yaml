  md: '# Exercise 1.3 – Scripting options


    Server-side programming is best suited for situations where all clients perform
    the types of tasks, with little knowledge of how the end result is presented.
    For example, the method used to gather stock prices would be common to many different
    applications—you wouldn''t need each client to write their own! However, the stock
    price information can be used in many different ways, and the server shouldn''t
    dictate how this should be used. This is particularly important when the servers
    and clients run different operating systems and environments—the type of information
    display required for a UNIX server may be different from that required by a Microsoft
    Windows client! Also, different customers may customize information differently
    according to their own needs.


    All other things equal, it is best to use CPU power as much as possible in a distributed
    system, which is exactly what Web servers do as they serve thousands of clients
    every. To ensure that the service provided by a Web server is scalable, clients
    should use as much of their own processing as possible to reduce the burden on
    the server. Thus, although it is possible to do many things on the server side,
    such as validating data entered on a Web Form, this can be performed by a JavaScript
    client. In addition, network traffic can be minimized by using JavaScript to perform
    validation, because there is no need to connect to the server until all the fields
    have been validated on the client.


    Java applets in a similar way, offloading processing tasks to the client the greatest
    extent possible. Both applets and JavaScript enable dynamic behavior to be scripted
    on the client side. However, applets run as separate, sandboxed applications within
    a Web page; they are not an integral part of a Web page. Also, applets can only
    connect to the server when needed. Thus, although its security model reduces the
    chance that untrusted code is malicious, it is a fact that requires a high level
    of technical expertise to work with. In contrast, JavaScript provides a simple,
    object-based model for development that enables developers to build on their knowledge
    of HTML page elements to create Web pages.


    # Exercise 1.3 – Scripting Options


    One of the benefits of a scripting language like JavaScript is that you don''t
    need to "complete" before using it. With a Java applet, you need to design, compile,
    and deploy the class files before using it. With JavaScript, you just write a
    script in a text editor and load it into a Web browser. A browser interpreter
    that will execute commands on the fly, meaning that you can debug and test much
    more quickly than traditional development. In addition, because Web pages have
    a well-defined object structure, the design work is simplified. Writing a Java
    applet requires an in-depth knowledge of the two major libraries (AWT and Swing)
    before any development can be undertaken. With JavaScript, you can reuse your
    knowledge of HTML to develop-client applications more quickly.


    One of the main drawbacks of a quick test cycle is that errors are not picked
    up before they are executed, a compiled language, where syntax errors are detected
    before an executable is created. Another potential problem is that different browsers
    have different interpreters, and there are several versions of JavaScript in existence.
    A JavaScript created and tested in one browser and for one version of the standard
    may not work in another browser honoring the specification or other.


    > TIP HTML before JavaScript This book assumes you have a working knowledge of
    HTML, that you can use a text editor to create JavaScript, and that you know how
    to load HTML pages with embedded JavaScript into a Web browser. You do not need
    to perform any of these tasks, you will need to read a basic book on HTML or visit
    one of the many HTML developer-sites on the Internet [such as www.resource.com/html]
    Same HTML editors have integrated support for JavaScript development and debugging.
    If you use such an editor, check whether it supports JavaScript.'
