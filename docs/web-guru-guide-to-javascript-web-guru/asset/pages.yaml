    # Exercise 14.2 – Navigating the History List


    Because you do not need to worry about signed scripts and permissions, the history
    object''s methods are more useful than its properties. You can use the methods
    to move any item in the history list. The only problem is that you typically cannot
    read the list to see what is in it. Therefore, you should only use these methods
    when you are certain about the path the user has taken to the current page. Otherwise,
    simply set the window.location.object to the URL you want to access.


    The history object''s methods are used as follows:


    +   - `history.back()` goes back one page in the history list. It performs the
    same action as the Back button on the toolbar. This method could be used in a
    page as:

    ```html

    <input type="button" value="Go Back" onclick="history.back()" />

    ```'
