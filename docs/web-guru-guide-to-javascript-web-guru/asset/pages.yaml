  md: '# Exercise 3.3—Using variables


    Note numeric variables do not require quotes around their values when assigned
    to variables. Only strings require a delimiter to enclose the text, especially
    when the string contains spaces (a numeric variable has no spaces). This hint
    helps the interpreter work out variables are numbers and which are strings.


    Most strings contain a series of alphanumeric characters in the ranges through
    z, A Z through 9; however, because many strings represent everyday-language, special
    characters also need to be displayed. Generally, characters such as ''!'', ''@,
    #, $, %, ^ &, *, (), and so on can be included. However, other characters that
    have a special purpose in JavaScript—like ""—need to be denied as part of a string.


    A good example of this is the display of filenames, such as: "C:\My Documents\JavaScript
    Book\". A variable declared as var path="C:\My Documents\JavaScript Book" would
    only display it if using the .write() method. This is because the backslash character
    is used to denote special characters as tabs (\t), backspaces (\b), form feeds
    (\f), new lines (\n), and carriage returns (\r). Thus, to ensure the path string
    is displayed as intended, the variable should be declared as var path="C:\My Documents\\JavaScript
    Book\";


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_68_0.png)


