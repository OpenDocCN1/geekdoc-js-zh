  md: '# Project 6.2 – Associative Arrays


    Associative arrays do not use numbers as indexes for each element; instead, a
    string is “associated” with each element. Associative arrays have the benefit
    of being more descriptive than simple integer indices. Assigning elements to an
    associative array is similar to a normal array, except that a string, rather than
    an index, is specified. Assuming there is one sales representative per state,
    signing up for the Internet banking site. Create an associative array for four
