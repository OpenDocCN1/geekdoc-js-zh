  md: '# Exercise 8.1 – Using the Math Object


    JavaScript Math object has many properties and methods that allow you to compute
    advanced mathematical functions. This is especially important for Web sites, as
    Internet banking online, that need to compute interest rates and investment returns
    for bank clients.


    The most commonly Math object properties are shown in Table 8.1. They are accessed
    by creating a reference to the Math object and then using the dot operator to
    access the required property. For example, Math.E provides the numeric approximation
    to Euler’s constant, which can then be used in more complex expressions.


    TABLE 8.1 Commonly used Math object properties.


    | Property | Description |

    | --- | --- |

    | E | Numeric approximation of Euler''s constant, e, which is approximately 2.71828.
    |

    | LN10 | Numeric approximation of the natural logarithm of 10, which is approximately
    2.302585. |

    | LN2 | Numeric approximation of the natural logarithm of 2, which is approximately
    0.693147. |

    | LOG10E | Numeric approximation of the logarithm of e base-10, which is approximately
    0.43429. |

    | LOG2E | Numeric approximation of the logarithm of e base-2, which is approximately
    1.442695. |

    | PI | Numeric approximation of π, the ratio of a circle''s circumference to its
    diameter, which is approximately 3.14159. |

    | SQRT2 | Numeric approximation of the square root of 2, which is approximately
    1.4142. |

    | SQRT1_2 | Numeric approximation of the square root of one-half, which is approximately
    0.7071. |


    Like other Math object properties, Math object methods can be invoked with the
    dot operator. For example, Math.random() will return a value generated by a pseudorandom
    number generator, which can be very useful in applications that rely on probability.
    For example, if your Internet banking pages support advertising, you might randomly
    select an integer between 1 and 20, each representing a different image, whose
    file name is dynamically inserted into the Web page by using the document.write()
    method.


    In this exercise, you will learn how to use the Math object to randomly select
    an advertising slogan for the top of an Internet banking Web page every time it
    is loaded.'
