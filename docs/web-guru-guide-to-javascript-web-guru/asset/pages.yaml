  md: "# Summary\n\nEvery HTML element you use in a Web page has a corresponding object\
    \ that can be scripted. Most HTML elements have event handlers and event-related\
    \ methods as well. As shown in this chapter, events that are triggered by a user\
    \ or browser action can be handled in many ways. You can handle events directly\
    \ or use function calls(). You can also simulate events when you need to trigger\
    \ an event automatically.\n\nFor the purposes of example in this chapter, you\
    \ have worked primarily with the onclick event handler, the button element, and\
    \ directly handled events. As shown in Tables 10.1 and 10.2 other events can be\
    \ handled or simulated as well. These events can be used with other HTML elements\
    \ and with form controls, as appropriate. Other chapters in this book will make\
    \ use of the essential foundation provided here to show you how to create highly\
    \ interactive and dynamic Web pages. Now that you are familiar with events, you\
    \ can move to more advanced interactive topics, such as using windows and dialog\
    \ boxes, which are covered in the next chapter.\n\n# Test Your Skills\n\nPractice\
    \ Drill 10.1: Using onblur and onclick Event Handlers\n\nStarting with Internet\
    \ Explorer 5, the onblur and onclick events can be triggered for just about any\
    \ HTML element. In this exercise, you will use the onblur and onclick events to\
    \ observe what happens when you change focus from one HTML element to another.\
    \ The onblur event is triggered when a user tabs from one element to the next\
    \ in a form or clicks on another form element. It is supposed to occur when an\
    \ element has focus is about to lose focus and before the onclick event of the\
    \ next element is triggered. browser behavior can sometimes yield unexpected or\
    \ undesirable results.\n\nThe following example shows how this works in practice:\n\
    \n+   1. In your text editor, create a HTML page with the appropriate HEAD and\
    \ BODY elements. Use a TITLE element with the text \"Using the onblur and onclick\
    \ Event Handlers.\"\n\n```\n<html>\n<head>\n  <title>Using the onblur and onclick\
    \ Event Handlers</title>\n</head>\n<body>\n</body>\n</html>\n```"
  merge: -1
  pgno: 226
- img_proc: true
  md: "Insert the JavaScript code block after the TITLE element but before the </head>\
    \ tag.\n\n```\n<script type=\"text/javascript\">\n</script>\n```\n\nInsert the\
    \ following JavaScript functions into the code block. The first function, forBlur(),\
