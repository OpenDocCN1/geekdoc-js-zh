  md: '# Chapter Exercises


    This unit''s exercises will teach you to:


    +   - Examine form objects

    - Script push buttons and form submissions

    - Manipulate checkboxes

    - Work with radio buttons

    - Check the options on a selection menu

    - Validate the contents of text-related form inputs


    By working through the exercises, you will learn how to script form fields. The
    techniques you will learn will help you process and validate form contents in
    a user''s browser without requiring submission to a server for initial processing.
    The preprocessed content can then be stored in cookies or used as otherwise necessary,
    as to set user preferences. You can also pass the validated form contents to a
    server for final processing.


