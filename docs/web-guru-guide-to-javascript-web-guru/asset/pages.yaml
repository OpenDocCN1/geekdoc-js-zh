  md: "# STEP 2 – MULTIPLE INVOCATIONS\n\nIn the previous example, you called parameters\
    \ directly from the form using the object model of the JavaScript document to\
    \ access the values of the variables entered by the user on the form promissoryNote\
    \ (document.promissoryNote.principal.value, etc.). However, functions are most\
    \ useful when they can accept parameters that can be modified within the local\
    \ scope of the function, as shown in the call to the window.alert() method, in\
    \ which the string to be displayed inside the alert window is passed as a parameter.\n\
    \nIn this step, you will modify the script to allow the simpleInterest() function\
    \ to be called multiple times from the displayInterest() function. This demonstrates\
    \ how useful functions can be in terms of saving time and allowing multiple operations\
    \ to be performed by a single encapsulated code block. If you were not able to\
    \ use a function to compute simple interest for an arbitrary number of years,\
    \ then you would have to insert the function code in-line for a fixed number of\
    \ years, which would limit the flexibility of your script.\n\nYou will use a for\
    \ statement to create a loop that iterates for each year and adds the interest\
    \ calculated for that year to the cumulative interest calculated for all years.\
    \ The cumulative interest is then displayed by a call to the window.alert() as\
    \ shown in Exhibit 5.2 and Figure 5.2.\n\n# EXHIBIT 5.2\n\n```\n<html>\n<head>\n\
    <title>Promissory Note Application</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nfunction displayInterest() {\n  var msg=\"Cumulative interest. \";\n  var cumInterest=0;\n\
    \  for (i=0; i<document.promissoryNote.time.value; i++) {\n    var interest= simpleInterest();\n\
    \    cumInterest=cumInterest+interest;\n    msg=msg+\" \"+(i+1)+\": $\"++cumInterest;\n\
    \  }\n  window.alert(msg);\n}\n\nfunction simpleInterest() {\n  return document.promissoryNote.principal.value\
    \ * document.promissoryNote.annualInterestRate.value/100;\n}\n</script>\n</body>\n\
    </html>\n```"
