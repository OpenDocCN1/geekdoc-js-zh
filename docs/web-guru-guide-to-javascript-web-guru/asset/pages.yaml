- img_proc: true
  md: '# STEP 2 - TESTING THE EVENT HANDLER


    In Internet Explorer, open the page you created and then click the button to test
    the event handler. When the button is clicked, the execution of the onclick causes
    an alert box to be displayed, as shown in Figure 10.1.


    Although onclick is one of the most used event handlers, it is not the only handler
    interaction with the user. Commonly used event handlers and their meanings are
    shown in Table 10.1. Keep in mind that not all of these event handlers are appropriate
    or available for all HTML elements.


    # Figure 10.1 Using event handlers in a Web page.


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_220_0.png)


    # Exercise 10.2 - Simulating Events


    Methods are normally used to cause events to occur in the code; they do not require
    interaction with the user. Thus, a method can be thought of as a controlled event.
    Unlike user-driven events, controlled events are not executed automatically. Although
    you can call a method, you must refer it via the object to which it relates. To
    call a method, you use the following syntax:


    ```

    objectName.methodName(parameters), where object is the name of the object you
    are referencing, methodName is the name of the method you want to execute, and
    parameters is an optional comma-separated list of parameters you are passing to
    the method.

    ```


    One use of a method would be to simulate button presses during a proper tutorial.
    Instead of the user driving the event, you would simulate the event to trigger
    identical response. Following this scenario, you could simulate execution of the
    button control shown in Exhibit 10.3.'
