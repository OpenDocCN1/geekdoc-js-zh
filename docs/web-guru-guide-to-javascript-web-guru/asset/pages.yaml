    # STEP 2 - DECLARING A VARIABLE USING RESERVED WORD


    In your text editor, create a code block by inserting an <script> and a closing
    </script> tag. Normally, to declare a variable you need to choose a name that
    represents the variable, but if the variable has the same name as a reserved word?
    In this situation, you should choose an alternative. A Reserved word is part of
    the core JavaScript language, so if you call a variable by the same name as a
    reserved word, the interpreter will not know whether you are referring to the
    variable or the reserved word. If you wanted to create a variable called "var,"
    it might seem obvious to declare "var;" which is syntactically correct, but later
    in the program any other appearance of "var" would be ambiguous. Exhibit 3.4 shows
    an example of this problem.


    # EXHIBIT 3.4


    ```

    <script type="text/javascript">

    var var;

    </script>

    ```


    When this script is executed, the interpreter processes the variable declaration
    and flags an error—probably something like "Expected identifier." This means that
    "var" is not recognized as a variable identifier, and another variable must be
    chosen.


