    # Project 16.1 – Creating Cookies with a Utility Function


    As a JavaScript programmer, you will spend a lot of time working with cookies.
    Be-

    cause of this, you will find it handy to use a utility function for setting cookies.
    This

    project defines a utility function for this purpose called createCookie(), as
    shown

    here:


    ```

    function createCookie(name, data, expires,path, domain,

    secure) {

    document.cookie = name + "=" + escape(data) + +

    ((expires) ? "; expires=" + expires.toGMTString() : "") + +

    ((path) ? "; path=" + "") + +

    ((domain) ? "; domain=" + domain : "") + +

    ((secure) ? "; secure=" + "");

    }

    ```


    When you createCookie(), you must pass the parameters in the order

    listed. The cookie name and the cookie data are the only required parameters.
    This

    means that you can call createCookie() as shown in this example:


    ```

    createCookie("selectedItem", "A55774983");

    ```


    If you use the other parameters, you must specify them in the order listed and
    enter null for

    any parameters you are not setting. Consider the following example:


    ```

    createCookie("selectedItem", "A55774983", "Dec 31, 2009,

    23:59:59", "/", null, true);

    ```


    Here, you set the cookie name, data, expiration date, and transfer pa-

    rameters. Because you do not set the domain parameter, you must enter null as
    the value

    for this parameter.


    For this project, open Exercise 16.4 and save it as C16project1.html. Update the

    file so it uses the createCookie() function rather than setting the cook-

    direct. Next, use comments to add documentation that details how the function

    works and describes each of its parameters. When you finish this and have tested
    the

    page, you can update the other exercises in this chapter if you want more

    practice.'
