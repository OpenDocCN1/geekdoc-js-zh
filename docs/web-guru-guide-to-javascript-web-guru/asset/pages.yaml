    # Project 3.1 - Checking a Credit Limit


    This project will require you to check whether a purchase amount exceeds a credit
    limit. Create a HTML page that has correct <head> and <body> elements and the
    appropriate <script> code block. Define one variable and another that represents
    the purchase amount. Use a logical greater-than operator to determine if the purchase
    price exceeds the credit limit. If it does, raise an exception using the window.alert()
    method, otherwise, print a message saying that the purchase has been approved.


    # Project 3.2 - Adding Up Items for Credit


    Using the HTML page and JavaScript described in Project 1, you should be able
    to add a list of variables that represent five different purchases—such as a shirt,
    pants, and under-items—and see whether that exceeds the credit limit. Define a
    variable that represents the credit limit and five variables that represent the
    purchase amount for each item. Use a compound addition and assignment operator
    to add the amounts for all items and use the logical greater-than operator to
    determine if the total purchase price exceeds the credit limit. If it does, raise
    an exception using the window.alert() method, otherwise, print a message saying
    that the purchase has been approved.


