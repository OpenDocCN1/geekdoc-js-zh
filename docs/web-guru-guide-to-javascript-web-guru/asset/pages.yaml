  md: "# CHAPTER 1 | Introducing JavaScript\n\nJavaScript also has the ability to\
    \ repeat the same action number of times, using various kinds of loops, and can\
    \ make decisions based on this kind of iteration. For example, the maximum number\
    \ of DVDs that could be placed in a shopping basket might be 10. Before an order\
    \ is processed, the number of DVD titles in the array would have to be counted\
    \ using a loop, and if it exceeded 10, then the order would have to be modified.\
    \ Although this procedure would be included as part of the JavaScript body, it\
    \ could also be spun out into a special counting function, allowing it to be reused\
    \ more than once within the same script or called from multiple scripts to support\
    \ modular programming. With modular programming, an effort is made to create code\
    \ that is self-contained and reusable. In object terms, functions are more often\
    \ referred to as methods.\n\nAs previously mentioned, JavaScript is an object-based\
    \ language. The main benefits of JavaScript is that the object model is already\
    \ well defined—Web browsers have document, and button objects that have their\
    \ methods which can be invoked within the script. You have already seen how the\
    \ document object has a write method that can be invoked to print text to the\
    \ screen. The document object has many other methods that we will discuss later\
    \ in the text.\n\nAnother aspect of object orientation that is used heavily in\
    \ JavaScript is event handling. This means that when something happens to an object,\
