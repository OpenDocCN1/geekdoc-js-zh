  md: '# Exercise 10.3 – Using Event-Related Methods


    Technically, the button you have been using is a form control. A form control
    is a form-related HTML element, such as input, button, and textarea. In Chapter
    17, you will learn more about form-related HTML elements and a method called click().


    There is an important difference between simulating the onclick event and invoking
    the click() method. When you simulate an event with a method call, actions related
    to the event occur, such as the display of the alert dialog box. When you use
    an event-related method, such as click(), JavaScript simulates the pressing of
    the button, but it does not necessarily invoke related actions. This means that
    the code would simulate the pressing of the button, but might not display an associated
    alert dialog box as expected:


    ```

    document.myform.mybutton.click();

    ```


    The exact behavior for the click() method depends on the browser version. With
    browser versions prior to Internet Explorer 4 and Netscape Navigator 4, the click()
    method invoked on a button does not trigger the onclick event handler, and if
    there was a related action, it not not invoked. With later browser versions, the
    click() method does trigger the onclick event handler, and any related actions
    are invoked.


    # STEP 1 – USING AN EVENT-RELATED METHOD


    Modify the HTML document shown in Exhibit 10.4 so that it uses the click method
    instead of the onclick event. To do this, you can replace this line of code:


    ```

    document.myform.mybutton.onclick = alert (''Simulated

    click!'');

    ```


    with the following code:


    ```

    document.myform.mybutton.click();

    ```


    # STEP 2 – LOADING THE PAGE AND TESTING IT


    In Internet Explorer, open the page you just modified. Notice that the click()
    method triggers the onclick event immediately after the page is loaded. You do
    have to click the button to test the event handler.


    Most controls have event-related methods that you can invoke. Table 10.2 summarizes
    the most common event-related methods of form controls. Keep in mind that not
    all of these methods are appropriate or available for all HTML elements.


    Keep in mind that you will typically handle events by calling a function in the
    HEAD of an HTML document. Remember the doThis() function call in Exhibit 10.1!
    Exhibit 10.5 extends the original example to show how events would be handled
    with a function call.'
