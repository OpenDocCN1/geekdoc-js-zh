    # EXHIBIT 3.10


    ```

    <script type="text/javascript">

    var x=10;

    var y=5;

    document.write("<br>x + y = "+(x+y));

    document.write("<br>x - y = "+(x-y));

    document.write("<br>x * y = "+(x*y));

    document.write("<br>x / y = "+(x/y));

    document.write("<br>x % y = "+(x%y));

    document.write("<br>x-x = "+(-x));

    document.write("<br>x-- = "+(-x));

    document.write("<br>x++ = "+(++x));\n</script>

    ```


    Note that evaluating an expression does not modify the values of the variables
    used in the expression unless the result is assigned to another variable using
    the assignment operator (=)—except when the increment and decrement operators
    are used. In each of the examples shown in Exhibit 3.10 for addition, subtraction,
    multiplication, division, negation, and the modulus, of x and y are not affected
    by the use of an operator. However, incrementing or decrementing a variable can
    actually change its value: When the operator precedes the variable, the value
    is changed and the statement is executed. When the operator comes after the variable,
    the expression is evaluated using the variable''s current value, and only afterwards
    is the operator applied. Thus, document.write(++x) will give a different result
    than document.write(x++) even though the same operator is used.


    # STEP 2 - USING MATHEMATICAL OPERATORS WITH ASSIGNMENT


    In your text editor, open the HTML file maths.html. In the previous step, you
    used a number of different operators, such as addition, subtraction, multiplication,
    division, negation, and the modulus, which operated without assigning the result
    to a variable. The basic assignment operator (=) takes the result of an expression
    and assigns it to a variable. In addition, compound assignment operators can combine
    an assignment with an operation, such as +=, which adds one to a second variable
    and stores the result in the first variable. This is equivalent to writing the
    expression using both the + = operators. In other words, x+=4 is equivalent to
    x=x+4. The compound operators are shown in Table 3.3.


    You can now modify maths.html with these new operators and observe the different
    results. In each example, you see that the value of y is unchanged, because assignment
    is only performed on x. The result of each subsequent assignment is dependent
    on the previous one, because the value of x keeps changing as a result of the
    previous operation. The code is shown in Exhibit 3.11, and the Web page output
    is shown in Figure 3.3.


