  md: '# Summary


    Most Web pages have text and images links as well as other types of embedded elements.
    These embedded elements can include links, anchors, applets, ActiveX controls,
    and more—all of which can be manipulated in scripts. You can use the links []
    array to examine a document''s links, the anchors [] array to work with a document''s
    anchors, and the applets [] array to work with a document''s applets. Other types
    of objects, such as ActiveX controls, can be manipulated using the object element
    with which they are defined. If you create a superset of documents using a frames
    document, you can create pages with multiple frames. To reference elements from
    one frame to the next, you can use the frames [] array as well as the window hierarchy.


