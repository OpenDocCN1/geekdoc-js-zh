  md: '# # Chapter


    # # Introducing JavaScript


    This book is about JavaScript, the interpreted, object-based, client-side programming
    and language jointly developed by "Netscape Communications and Sun Microsystems.
    It started out as LiveScript, worked alongside Microsoft''s JavaScript, and was
    standardized as ECMAScript (www.ecma-international.org/standards/Ecma-357.htm).
    If you have ever used a Web browser to read a Web page or to access embedded multimedia
    content, the Web page probably contained JavaScript code that enabled dynamic
    behavior within the page. If you do not have a Web browser, Netscape Navigator
    can be downloaded from home.netscape.com/download; Microsoft Internet Explorer
    can be downloaded from www.microsoft.com/ie. Simply, the purpose of JavaScript
    is to add dynamic behavior to client-side browsers, especially when they contain
    forms for processing client-entered data or when some type of presentation or
    layout is required.


    The development of dynamic Web pages has been strongly influenced by the rise
    of "new" architectures for developing Web-based information systems, such as Sun''s
    Java 2 Enterprise (J2EE) architecture, which allows Web pages to be generated
    from data drawn from relational databases, components, message queues and legacy
    systems. We will not discuss these advanced systems in this book, but once you
    have mastered JavaScript and dynamic Web pages, there are many more advanced avenues
    to explore, starting with the simple Common Gateway Interface (CGI) for invoking
    server-side scripts or applications. CGI is an easy way to build dynamic applications
    that are not tied to a higher-level development environment. If you are already
    familiar with J2EE, you could move on to develop Java Server Pages (JSPs), or
    if you are a Microsoft .NET fan, Active Server Pages (ASPs) are the logical choice.


    # For Your Career


    In this chapter, you will examine the high-level issues surrounding Web page design
    and implementation and why you would use JavaScript when creating dynamic Web
    pages. JavaScript is not suitable for solving all Web page problems, and it is
    important to be able to justify why you should use JavaScript on a project rather
    than alternative technologies based on server-side processing, such as VBScript,
    Java, CGI, and so on.'
  merge: -1
