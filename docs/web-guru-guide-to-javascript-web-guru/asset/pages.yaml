    # Exercise 4.3 – Controlling Object Flow


    In Exercises 4.1 and 4.2, you examined how to manage flow through loops, conditional
    statements, and explicit and implicit iterators for simple variables. Recalling
    that JavaScript is an object-based scripting language, you might be wondering
    how objects involve with flow. The answer is that objects have their own flow-control
    statements, which are generally simpler versions of the statements used with simple
    variables. They are easier to use, because the objects have encapsulated properties
    that are shared across all objects of the class.


    For example, arrays are objects that allow you to store related items in a single
    object. For example, you could store one bank''s name in a string variable bank1,
    for example, you would need to enumerate 10 strings to store 10 bank names (bank1,
    bank2, bank3, ... bank10). With an array, you can treat all of the names as a
    single object and leave the enumeration to a designated script. Therefore, bank
    [1], [2] and [3] would refer to the first three bank names, and bank itself would
    have all of the normal characteristics of an array, including methods to sort
    the contents in alphabetic or reverse order. In Chapter 5, you will learn more
    about arrays, but to demonstrate the power of object flow control, they have been
    included in this exercise.


