  md: '# Chapter 16


    # # Creating Client-Side Cookies


    Every browser since Netscape Navigator 2.0 and Internet Explorer 3.0 has supported
    cookies. Cookies are used to store information on the client computer so that
    it can be retrieved in other pages or in other browser sessions. Cookies are commonly
    used to store user names and encrypted passwords for protected Web sites, items
    selected for purchase at online stores, and user preferences. Many Web sites store
    information to customize their pages for individual users. By storing user names
    and passwords, a site does not have to prompt users for login information each
    time they visit and instead read this information from the cookies stored on users''
    computer. By tracking the items a user has looked at, an online store can guess
    the user''s shopping preferences and suggested items.


    With cookies, you can also customize the appearance of the page, including the
    color of text, backgrounds, foregrounds, and links. You can create different levels
    in the help system for novice, intermediate, and advanced users. You can let users
    set their preferred level of graphics and extras with categories such as feature,
    average, and basic. You can allow the user to select a preferred language, such
    as English, Spanish, French, or German. Enabling these options is a matter of
    determining which option the user has selected, setting a cookie with the matching
    value, and creating a page that takes advantage of the preferred option. You can
    use these concepts to make any area of your Web site customizable. If you place
    preference selection menu on your page, you can even make your entire site customizable.


    > For Your Career


    The techniques discussed in this chapter are an essential part of every Web programmer''s
    toolkit. Just about every commercial site on the Internet uses cookies in one
    way or another, as do hobbyist sites. Browsers limit the number of cookies you
    can use to 20 cookies per domain. Netscape adds another limit by setting the total
    number of allowed cookies for all domains to 300.'
