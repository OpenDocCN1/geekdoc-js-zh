  md: "# Exercise 8.3 - Using Regular expressions\n\nIn Chapter 7, you learned how\
    \ to work with the String object to extract substrings with specific starting\
    \ and ending locations or with a specific starting location for a certain length.\
    \ This is very useful if you are processing field-size data that might be extracted\
    \ from a file or database. However, it does not allow you to search for substrings\
    \ within a string or to create a specification to identify strings that match\
    \ a pattern.\n\nJavaScript regular expressions allow you to specify patterns—both\
    \ simple and complex—to determine whether a string matches specific criteria.\
    \ For example, in an Internet banking application, you may want to validate input\
    \ entered into a form, such as a customer's e-mail address, to ensure that it\
    \ is valid. To validate the e-mail address, you would need to ensure that it contains\
    \ an @ symbol and has a recognized toplevel domain, such as .edu, .org, and so\
    \ on\n\nRegular expressions can be specified by a string literal that follows\
    \ a certain format and implemented using the RegExp object. RegExp literal takes\
    \ a similar form as the UNIX Vi Editor (vi) syntax: Forward slashes are used to\
    \ delimit the pattern to search for and the actions are to be performed when a\
    \ match is made.\n\nIn this exercise, you will use regular expressions to verify\
    \ aspects of a customer's data to register an existing bank account for Internet\
    \ banking.\n\n# STEP 1 – SPECIFYING A PATTERN\n\nIn your editor, create a new\
    \ HTML page with the title \"Internet Banking Registration.\" Insert an HTML form\
    \ called registered, with fields for the customer's surname, first name, e-mail\
    \ address, and phone number. When submitted, the form should call a JavaScript\
    \ function called verifyDetails(); this function should have three patterns to\
    \ matched with the customer's e-mail address. These correspond to the three excluded\
    \ e-mail domains (yahoo.com, hotmail.com, and google.com) that customers may not\
    \ use when registering their account. The three patterns are evaluated inside\
    \ an if statement and logically ORed. If any of them return a match, the customer\
    \ is prompted to reenter his or her e-mail address. Exhibit 8.5 shows the code.\
    \ The results are shown in Figure 8.5.\n\n# EXHIBIT 8.5\n\n```\n<html>\n<head>\n\
    <title>Internet Banking Customer Registration</title>\n</head>\n<body>\n<script\
    \ type=\"text/javascript\">\nfunction verifyDetails() {\n  var excludedDomain1=yahoo.com;\n\
    \  var excludedDomain2=hotmail.com;\n  var excludedDomain3=google.com;\n  if (excludedDomain1.test(document.register.\n\
    \  email.value))\n```"
