- img_proc: true
  md: 'If you precisely size the side frames so that all content is showing and set
    the border attribute to zero, most current browsers will create borderless frames.
    Borderless frames give your page more cohesive appearance because they do not
    display scrollbars.


    ```

    <frameset rows="25%,75%" border="0">

    <frame name="Upper" src="banner.htm">

    <frame name="Lower" src="main.htm">

    </frameset>

    ```


    JavaScript''s frame object has all of the properties, and event handlers of the
    window object. When you access the methods, properties, or event handlers, you
    must do so via the object hierarchy. With frames, this hierarchy is slightly different
    from the hierarchy you have followed us far. Thus any document that contains a
    frame definition is a parent document. Frames created by the parent document are
    referred to as children. If a script in a child frame needs to access the functions,
    or properties of the parent document, the script must follow the hierarchy of
    the parent document, such as:


    ```

    parent.displayPage()

    ```


    or this:


    ```

    parent.document.myform.button.click()

    ```


    Beyond references to the parent document, you can also refer to self and top.
    The self reference is used to refer to the current window or frame. The top reference
    is used to refer to the top-most document, which is the document that contains
    the original frames definition. Thus, you use the top reference if your pages
    have multiple framesets.


    When you need to reference from a parent document to a child document you can
    reference the child document according to its index position in the frames []
    array, as:


    ```

    [window].frames[1].myform.address.value

    ```


    according to its name, within the frames [] array, such as:


    ```

    [window].frames["Side"].myform.address.value

    ```


    or directly by name, such as:


    ```

    [window].frames["Side"].myform.address.value

    ```


    When you need to reference from a child document to another child document, you
    must start with a reference to the parent. Once the reference is at the parent
    level, you can continue the reference as you would if starting from the parent
    document. Thus, to access a frame in a child called "Side", you could use any
    of these following references:


    ```

    parent.frames[1].myform.address.value

    parent.frames["Side"].myform.address.value

    parent.Side["Side"].myform.address.value

    ```


    > TIP

    Reference Frames by Index or Name

    The numeric indices for frames are based on the order in which the <frame> tags
    appear in the frames document. You can access the frame as long as it is in the
    ordinal position in the frames [] array. The simplest way, however, to access
    frames is to reference the frame''s name. When your code is important, you should
    reference the frame by its defined name.'
