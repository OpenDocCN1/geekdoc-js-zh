  md: '# Exercise 7.1 – Creating and Using the String Object


    The JavaScript String object encapsulates the data, methods, and properties that
    are associated with strings. String data comprises an ordered set of characters.
    Among many other things, String methods can be used to test the properties of
    a string (such as matching), convert the case of the string, concatenate strings,
    or break them using substring methods.


    Table 7.1 contains a list of just a few of the available string data manipulation
    operations. As you can see, these are method innovations that change the underlying
    form of the string’s data, including extracting the character value of a character
    at a specific position within the string or replacing some characters within the
    string with another set of characters.


    In this exercise, you will learn how to create a String object and access its
    basic data manipulation operations for HTML form validation.


    # TABLE 7.1 String data manipulation operations.


    | Method Name | Description |

    |---|---|

    | charAt (c) | Returns the character at location "c" within the string. |

    | charCodeAt (c) | Returns the character''s value at location "c" within the string
    in Unicode. |

    | concat() | Returns two strings concatenated or merged together. |

    | fromCharCode() | Returns the character''s value from Unicode. |

    | indexOf() | Returns the index of a character when it first occurs in the string.
    |

    | lastIndexOf() | Returns the index of a character when it last occurs in the
    string. |

    | link() | Returns the string as a hyperlink. |

    | match() | Returns a string if it is found in another string. |

    | replace() | Replaces a substring with another substring. |

    | search() | Searches for a substring within a string. |

    | slice() | Removes a substring from string |

    | split() | Turns a string into a set of substrings |

    | substr() | Returns a substring at a specific starting location and with a certain
    number of characters. |

    | substring() | Returns a substring at a specific starting and ending location.
    |

    | toLowerCase() | Returns the string in lowercase. |

    | toUpperCase() | Returns the string in uppercase. |'
  merge: -1
