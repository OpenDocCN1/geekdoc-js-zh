  md: '# Chapter 4


    # Controlling the Flow within Scripts


    A typical JavaScript application needs to make decisions about what to do when
    variables have certain values or when values have changed. Often, the decisions
    are on the basis of comparisons between variable values using the character, numeric,
    and logical operators discussed in Chapter 3. For example, client-side processing
    of forms permits checks and balances to be performed prior to server-side processing.
    Controlling script flow ensures that users follow a certain path through a Web
    page and only proceed if they had satisfied any number of requirements.


    In this chapter, you will learn how to control script flow by making use of conditional
    statements, if, else, and catch, finally. You will also learn how to use looping
    statements, such as for, in, do, while, break, and continue, to ensure that statements
    are repeated a number of times depending on the evaluation of different types
    of expressions.


    The chapter exercises will continue the Internet banking example used throughout
    the book. You will use JavaScript methods and elements to evaluate customer details
    and ensure that data entered on a home loan application is consistent.


    # For Your Career


    In this chapter, you will learn how to use variables to make decisions according
    to business logic or some other aspect of program flow. The order of execution
    of blocks of statements, as determined by the execution of conditional or looping
    statements, makes it very easy to automate tasks.


    The skills you will learn in this chapter will be used to develop a home loan
    application Web page. For example, you could determine if a user may proceed from
    one field to the next by checking that prerequisites from a previous section have
    been fulfilled.'
