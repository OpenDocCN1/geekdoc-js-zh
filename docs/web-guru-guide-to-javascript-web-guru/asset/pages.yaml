    In Internet Explorer, open the page you created and then create the subwindow
    by clicking the appropriate button (see Figure 11.2). Close the window by clicking
    the other button. Now play around with the window. Note what happens when you
    click one of the buttons twice. Examine the script to see what is happening behind
    the scenes. Do you see anything in the coding that could be handled in a better
    way? Hint: Look at the way the window is closed.


    # FIGURE 11.2 Creating a subwindow.


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_242_0.png)


    # STEP 5 – UPDATING THE PAGE


    In your text editor, update the script in the page header to add the if condition
    to the closeWindow() function as shown in Exhibit 11.8. With this addition, you
    test to ensure that the window has been created before you try close it. When
    a variable has been declared but no value assigned to it, its initial value is
    null, which is interpreted by JavaScript to be a false condition. If the variable
    has a nonzero value assigned to it, it is interpreted by JavaScript to be a true
    condition. Because of this, the conditional expression in the closeWindow() function
    tests two conditions. The first condition determines whether the window has been
    created before calling the close() method. The second condition determines whether
    the window was previously created and has been closed. If both conditions evaluate
    to true, the function closes the open window and sets the newWindow variable to
    null. This ensures that if you were to try close the window again, the test conditions
    would not be met and the function would not try to close a nonexistent window.'
  merge: -1
