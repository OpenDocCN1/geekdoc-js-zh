  md: '# Chapter 12


    # Examining Documents


    In this chapter, we begin our look at the document object. The document object
    is a child of the window object and is the key to creating highly interactive
    Web pages. In fact, most communication between users and scripts takes place via
    the document object. The document object is important because it is the container
    for all of the elements in a Web page. With newer Web browsers—those capable of
    dynamic HTML—the document object can be used to update the page on-the-fly, allowing
    you to update or replace elements with ease. Behind the scenes, Internet Explorer
    4.0 or later and Netscape Navigator 6.0 or later automatically redraw the page
    if the size of content changes when you alter the page using a script.


    In older browsers, such as Netscape Navigator 3.0 or Internet Explorer 2.0, you
    are limited to a small set of objects that you can modify, which includes images,
    links, embedded objects, and forms. Because of this, if you are creating scripts
    to have the compatibility, you will be limited to changing only a small number
    of properties after the page loads. A workaround is available. If you need to
    update pages based on user input or make updates to pages, you could design the
    page so that scripts write the contents and let the scripts rewrite the entire
    page with the new settings. Best of all, the updates can be handled completely
    using client-side scripts; this means the browser does not need to go back to
    the Web server to request an updated page.


    # For Your Career


    In this chapter, you will examine issues related to the elements in a page. You
    will learn how to manipulate page elements and how to effectively write and rewrite
    the contents of the page. Because the document object and its capabilities are
    so extensive, we have divided our discussion into several chapters. Many of the
    remaining chapters in this book cover related groups of objects, all of which
    are contained within the document object. Following the exercises in this chapter,
    you will learn more about customizing pages and gain some important utility functions
    for managing content. You should be able to easily modify these functions and
    add them to your JavaScript toolbox.'
  merge: -1
  pgno: 267
