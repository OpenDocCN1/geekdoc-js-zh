    # FIGURE 15.2 Checking the official browser name.


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_372_0.png)


    # Exercise 15.3 – Customizing Content for Browser Compatibility


    Most pages that use client-side scripts to customize content for users based on
    browser type use the appVersion property, the userAgent property, or a combination
    of the two to determine the specific browser being used. The appVersion and userAgent
    properties are similar. The appVersion property reports version information, including
    the version number, platform, and country code. The userAgent property reports
    a combination of the appName and appVersion properties.


    If appVersion reported the information as 4.0 (compatible; MSIE 6.0; Windows NT
    5.1; .NET CL 1.1.4322), the userAgent property would report the browser as Mozilla/4.0
    (compatible; MSIE 6.0; Windows NT 5.1; .NET CL 1.1.4322). In this case, the only
    difference between appVersion and userAgent is that userAgent includes the string
    Mozilla/


    You can learn a lot about a browser by examining the appVersion string given previously:


    +   - 4.0—Indicates engine compatibility. In this case, the browser''s base compatibility
    is that of version 4.0 of this particular browser. This means that the browser
    can use all of the features of the 4.0 browser object model.


    +   - Compatible—Indicates that the browser is running in compatibility mode (meaning
    it is running so it is compatible with the indicated Netscape Navigator version).
    Internet Explorer always runs in compatibility mode.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# 354 CHAPTER 15 Accessing browser and operating system version information


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_373_0.png)


    MSIE 6.0—Indicates the actual version of the browser. In this case, the browser
    is Internet Explorer 6.0.


    Windows NT 5.1—Indicates the operating system on which the browser is running.
    In this case, the browser is running on Windows XP.


    .NET CLR 1.1.4322—Additional information that the computer has the .NET runtime
    version 1.1.


    Many times you will want to use a specific browser property but need to confirm
    the user''s browser by checking the actual browser version. When working with
    Internet Explorer, it is important to note that the actual browser version is
    returned by the string returned userAgent presents a special problem


    Netscape Navigator reports a similar string. However, unlike Internet Explorer,
    the first part of the string contains the only browser compatibility information
    available. For example, Netscape Navigator might return an appVersion string of
    5.0 (Macintosh; PC Mac OS X Mach-0; en-US; rv:1.4).473 (Macintosh; PC); or a similar
    value. In all cases, the browser compatibility level is given.


    On some systems, Netscape provides information that identifies the CPU architecture,
    such as whether the browser is running on a PowerPC or a 68K Mac. The extra field
    is inserted as follows:


    5.0 (Macintosh; U; PPC)


    Many times you want to determine the actual browser version being used, and you''ll
    learn a solution for resolving shortly.


    For international versions of Netscape Navigator, you may also see a field that
    identifies the language version of the browser, such as German. Here is an example
    for a German-language version of Netscape:


    5.0 [Win98; I]


    When you want to customize content, oftentimes you simply want to know the minimum
    browser object supported level, so to speak. The easiest way to do this is to
    perform a comparison using the appVersion property and the parseInt() or parseFloat()
    methods. For example, you might want to know if the browser is at least 4.0 compatible,
    because the features you are using are supported by 4.0 browser versions and later.


    If you want to determine the browser compatibility level, you can use:


    ```

    parseInt(navigator.appVersion);

    ```


    This gives you the number to the left of the decimal, such as 4 or 5, and all
    the other characters after it are ignored. If you want to determine the browser
    compatibility level, including any decimal values, you can use:


    ```

    parseFloat(navigator.appVersion);

    ```


    This gives you the floating-point value, such as 5.0 or 4.74. Again, all the characters
    after this value are ignored.


    Once you have obtained the compatibility level for Internet Explorer, you can
    dig a little deeper and determine the actual browser version being used. The most
    common way to do this is to use the indexOf() to determine if the appVersion contains
    a specific string. Consider the following examples:


    ```

    var IE4x = navigator.appVersion.indexOf("MSIE 4") != -1;

    var IE5x = navigator.appVersion.indexOf("MSIE 5") != -1;

    var IE6x = navigator.appVersion.indexOf("MSIE 6") != -1;

    ```'
  merge: -1
  pgno: 373
