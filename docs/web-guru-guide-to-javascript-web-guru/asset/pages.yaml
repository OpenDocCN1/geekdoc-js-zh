  md: "# Tips. These brief notes offer key insights, helpful advice, and additional\
    \ information that extend what you read in this chapter.\n\n# For Your Career.\
    \ These features show you how to take concepts from the book and apply them on\
    \ your own and in your workplace.\n\nIn JavaScript methods and\n\n![](img/ecbd0b33770c7243bdf70ab10c4515ec_13_0.png)\n\
    \n# For Your Career\n\nIn this chapter, you will learn basics that will enable\
    \ you to create dynamic web pages with JavaScript. JavaScript is an important\
    \ part of web development, the foundation for all of computational work required\
    \ to work with others. All of the skills you learn will be useful when you create,\
    \ signing of scripts, or displaying an understanding of different frameworks,\
    \ building robust JavaScript will help you visit your pages.\n\n# Test Your Skills.\
    \ Extensive exercises\n\nend-of-chapter exercises emphasize on skill development.\
    \ You will find 5 types of evaluation here.\n\n+   * Practice Drills\n* Multiple-Choice\
    \ Questions\n* Fill-in-the-Blank Questions\n* Definitions Questions\n* Basic and\
    \ Intermediate Projects\n\n![](img/ecbd0b33770c7243bdf70ab10c4515ec_13_1.png)\n\
    \nNow that you have learned how to insert simple JavaScripts into Web pages with\
    \ calls to document(), you should know how to create real internet banking sites.\
    \ We will create the home pages of different internet banking sites and examine\
    \ their features, making each one exactly as they provide! View the Source function\
    \ of your web browser to inspect and understand JavaScript. We will use any of\
    \ the features you have learned in this chapter. In this project, we will explore\
    \ JavaScript in the web browser, create a front page for an internet banking site\
    \ that uses JavaScript. We will test the functionality of each page. A line page\
    \ should be created for the login page, which will be examined in the next chapter.\n\
    \n# Career Builder\n\nCareer Builder. This is a running project designed to present\
    \ a real-world business case. It combines the lessons of the entire chapter, and\
    \ builds on concepts taught earlier. By the end of your book, you will have built\
    \ a working project that can provide potential employers.\n\nJavaScript is a versatile\
    \ language that is used in many types of applications. From server-side scripting\
    \ to mobile apps and video games, JavaScript is used to be everywhere today.\n\
    \nIn JavaScript, variables are declared using the var, let, or const keywords.\
    \ Variables can be used to store data that can be changed throughout the program.\
    \ For example, you can use a variable to store numbers.\n\nA simple example of\
    \ using a variable is the following code: \nvar x = 10;\nThis creates a variable\
    \ named x and assigns it the value of 10. You can then change the value of x by\
    \ assigning it a new value.\n\n| Character | Description |\n| --- | --- |\n| T\
    \ | |\n| P | |\n\nThe document object model (DOM) is a programming interface for\
    \ web programs to interact with a web document. The DOM allows you to change the\
    \ document content, style, and structure of a web page.\n\n# 3.3 - Using Variables\n\
    \nVariables are used to store data values that can be used later in your program.\
    \ In JavaScript, you declare variables using the var, let, or const keywords.\
    \ The name of the variable should be descriptive and easy to understand.\n\n#\
    \ STEP 1 - DEFINE THE VARIABLES\n\nTo define a variable, you use the keyword followed\
    \ by the variable name and an initial value. For example, var name = \"John\"\
    ; creates a variable named name and assigns it the string value \"John\".\n\n\
    Variables can be initialized with different types of data, such as strings, numbers,\
    \ booleans, and objects.\n\n# Test Your Skills\n\nPractice Drill 2.1 - String\
    \ Questions\n\nIn this exercise, what happens when you use document.write() to\
    \ write a string that has a variable inside it? What happens if you use document.write()\
    \ with a variable only? What happens if you use document.write() with no variables\
    \ at all?\n\n```\n<script>\nvar title = \"Hello World\";\ndocument.write(\"<h1>\"\
    \ + title + \"</h1>\");\n</script>\n```\n\n2. Insert the variable value between\
    \ the <h1> tags.\n\n```\nvar title = \"Hello World\";\ndocument.write(\"<h1>\"\
    \ + title + \"</h1>\");\n```\n\n3. Insert the variable value inside the <p> tags.\n\
    \n```\nvar title = \"Hello World\";\ndocument.write(\"<p>\" + title + \"</p>\"\
    );\n```\n\n4. Insert the variable value after the <p> tags.\n\n```\nvar title\
    \ = \"Hello World\";\ndocument.write(\"<p>\" + title + \"</p>\");\n```"
  merge: -1
  pgno: 13
