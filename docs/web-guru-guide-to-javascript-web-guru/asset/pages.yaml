  md: '# Exercise 17.1 – Examining the form Object


    A HTML page can contain multiple forms. Each form''s contents are enclosed within
    the <form> and </form> tags, and each has a related form object that can be referenced
    using the document.forms[] array. The first form on a page is referenced using
    document.forms[0], the second document.forms[1], and so on. Forms can also be
    referred to by name. For example, if the name attribute of a form is set as "MyForm",
    you could reference the form using document["MyForm"] or document.MyForm.


    Before you can learn how to use scripts for forms, you must first learn more about
    the form object. The form object is used to access form element objects, which
    are also sometimes referred to as form controls. Table 17.1 summarizes the properties,
