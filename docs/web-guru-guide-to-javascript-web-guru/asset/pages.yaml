  md: '# CHAPTER 10 Introducing events and event handlers


    TABLE 10.1 Common event handlers and their uses.


    | Event Handler | Description |

    |---|---|

    | onabort | The onload event is triggered when an element stops loading because
    a user clicked the Stop button in his or browser. This event can also be triggered
    when a user clicks a link in a page that is loading, which interrupts the page-loading
    process. |

    | onblur | The onblur event is triggered when an element has focus (meaning it
    is selected) is about to lose focus because some other element is about to receive
    focus. The onblur event fires before the onfocus event of the next element. |

    | onchange | The onchange event is triggered when an element is changed, as when
    text is entered into an input field. |

    | onclick | The onclick event is triggered when an element, such as a button,
    is clicked. |

    | onerror | The onerror event is triggered when an unexpected error occurs during
    the transfer or loading of the related element. |

    | onfocus | The onfocus event is triggered when an element receives focus because
    it is currently selected or active. Typically an element receives focus after
    another element loses focus. |

    | onload | The onload event is triggered when an element finishes loading. For
    a Web page or windows, this event is triggered when all of the page or window
    components, including images and other embedded media objects, have loaded into
    the browser. For an image, this event is triggered when the first image source
    is loaded. Thus, if an img element has a lowsrc property defined, the event fires
    when this is loaded. |

    | mouseout | The mouseout event is triggered when the mouse moves over an element
    and then moves away. |

    | mouseover | The mouseover event is triggered when the mouse moves over an element.
    |

    | onreset | The onreset event is triggered when a form is reset. |

    | onselect | The onselect event is triggered when an element is selected. If the
    element did not have focus before, an onfocus event occurs immediately before
    the onselect event. |

    | onsubmit | The onSubmit event is triggered when a form is submitted. |

    | onunload | The onunload event is triggered when an element is unloaded. |'
