    Table 3.3 Assignment operators.


    | Assignment Operation | Function | Symbol |

    |---|---|---|

    | Add/Assign | Adds numbers together and assigns the value to the left-hand variable
    | += |

    | Subtract/Assign | Subtracts numbers from each other and assigns the value to
    the left-hand variable | -= |

    | Multiply/Assign | Multiplies numbers with each other and assigns the value to
    the left-hand variable | *= |

