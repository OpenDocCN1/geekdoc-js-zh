  md: '# Summary


    Images are important parts of Web pages. Using JavaScript, you can precache images\and
    then dynamically update images in your pages. Precaching images loads them

    to the browser''s image cache so that they are ready for use. When you want to
    use a

    cached image, swap its .image source for the existing image source on

    tpage. This causes the browser to update the image on the page. In the case of
    older

    browsers, the image may be scaled up or down to fit the dimensions of the previous

    image. In the case of newer browsers, the page is updated so the content around

    picture is reflow.


    # Test Your Skills


    Practice Drill 9.1: Updating Images Based on User Actions


    Previously, you learned how to swap an image on the page based on a user action.

    The example showed how image swapping could be handled in conjunction with other
    ele-

    ments in an HTML page. In most of the examples, a form was used to allow users

    to make a selection, and this form was also updated as the image was rotated,
    either by the

    user making a selection or moving the mouse pointer over the image. These examples

    highlight the interaction of page elements.


    Often, you will want to update an image without updating other elements. The fol-

    lowing example shows how this can be done.


    +   1. In your text editor, create an HTML page with the elements shown here.
    Use a

    <title> element with the "Rotating Images".


    ```

    <html>

    <head>

    <title>Rotating Images</title>

    </head>

    <body>

    </body>

    </html>

    ```


    +   2. Within the body of the page, add the main text, which includes the image
    you

    want to rotate. The onmouseover event handler is used to call a function

    when you move the mouse pointer over the image.


    ```

    <h1>Rotating Images</h1>

    <a onmouseover="rotate()"><img src="webguru.jpg" name="webguru" height="100"

    width="300" border="0"/></a>

    <hr />

    ```


    ```

    <p>Move the mouse over the image.</p>

    <hr />

    ```'
