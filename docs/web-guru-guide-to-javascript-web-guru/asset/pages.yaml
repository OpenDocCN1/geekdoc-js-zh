  md: '# Appendix


    # # Browser Document Object Model Quick Reference


    Modern browsers support multiple object models, including:


    +   - The browser document object model (DOM), first implemented in Netscape Navigator
    2 and Internet Explorer 3 and supported by all modern browsers.

    - The HTML object model, first implemented in Internet Explorer 4 and supported
    by Internet Explorer 4 and later.

    - The W3C object model, first implemented in Netscape Navigator 6 and Internet
    Explorer 5 and supported by Netscape Navigator 6, Internet Explorer 5, and later
    versions of these browsers.


    The current HTML/XHTML and DOM specifications are available at www.w3c.org/DOM/
    and www.w3c.org/Mark-Up/, respectively.


    For maximum compatibility and to keep this reference from running a hundred pages,
    we focus on the original browser document object model and the most common properties.
    Because it is most important to know that browser X features X, Y, and Z, this
    reference focuses on which browsers support which object model features rather
    than differentiating between the object models.


    # ## anchor Object


    The anchor object is supported by Netscape Navigator 2, Internet Explorer 3, and
    later versions of these browsers except as noted. See Chapter 13 for more information.'
