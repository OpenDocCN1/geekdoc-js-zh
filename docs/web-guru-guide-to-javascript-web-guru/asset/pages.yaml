  md: '# Exercise 15.1 – Getting started with the navigator object


    # 343


    Current browsers from Internet Explorer 4, Netscape Navigator 6, and later allow
    you to access the navigator object via the window object. This means that you
    can access navigator properties and methods in the form:


    ```

    window.navigator.propertyName

    ```


    or


    ```

    window.navigator.methodName

    ```


    Although current browsers treat the navigator object as part of the window object,
    this is not how the navigator object was originally handled. Originally, navigator
    was created as a stand-alone object, and you accessed its properties and methods
    in the form:


    ```

    navigator.propertyName

    ```


    or


    ```

    navigator.methodName

    ```


    Because you can omit a reference to the window object when working with the current
    browser window, you can use this method to access the navigator object in any
    browser. For example, if you wanted to assign the value of the appName property
    to a variable, you could use:


    ```

    var currBrowser = navigator.appName;

    ```


    And this assignment would work in any JavaScript-compatible browser.


    As shown in Table 15.2, methods of the navigator object let you check settings
    in the user''s browser. Generally, the methods return true if the setting is enabled
    and false if it is not enabled.


    In this exercise, you will create a page that checks to see if Java is enabled
    before displaying Java applets. If Java is not enabled, images are displayed instead.


