  md: '# Exercise 1.1 – Creating Web Pages


    When the Wide Web (WWW) was young, Web pages were static. Web sites had to be
    updated manually to change the information displayed to users who accessed them.
    However, it quickly became clear that many Web pages were based on information
    that changed constantly. An individual news story is published the headline news
    changes frequently. A Webmaster or Web programmer should not have to manually
    change the headline news page each time a new story is added to a site.


    Thus, several approaches for creating dynamic Web pages were developed, some of
    which were more successful than others. At this point, it is worth pointing out
    that Java and JavaScript are completely separate and independent languages though
    they share some similarities in name, syntax, and function. For example, Java
    is an object-oriented, platform-independent, compiled language that can be used
    for Web development or general-purpose programming. It runs on many different
    platforms, like JavaScript, and when compiled to an intermediate byte-code format,
    by a Java Virtual Machine (JVM) installed.


    In contrast, JavaScript is a scripting language that has a defined object model
    that is based on the structure of Web pages; Java is a much more general-purpose
    programming language. This is why some people refer to Java as being “object oriented”
    and JavaScript as being “object based.” Many Web developers start with HTML, JavaScript,
    and then go to become Java developers, utilizing Web-related technologies such
    as JSPs, servlets, and apps.


    Before we review JavaScript, let''s explore some basic concepts about Web pages
    and how they are retrieved. Web users run client applications as Netscape Navigator
    or Microsoft Internet Explorer. These applications use the Hypertext Protocol
    (HTTP) to connect with Web servers. The page—referred as a Uniform Resource Locator
    (URL)—and has returned it for interpretation. For example, to access the home
    page of Prentice Hall, the URL is www.prenhall.com. The client-server communication
    is shown in Figure 1.1. Once a page is retrieved from a server, it is interpreted
    and displayed within the browser window, which is known as the *document object*.
    The browser has several other objects, including alert windows, buttons, and a
    status bar. We will discuss how to use each of these in the chapters that follow


    The Hypertext Markup Language (HTML), a variant of the Standard Generalized Markup
    Language (SGML), is used to create Web pages. The markup provided for Web pages
    consists of structural elements, such as `<head>` and `<body>`, as well as directives,
    as `<b>` or `<i>` for bold and italics, respectively. HTML does not provide programming
    capability for clients, and HTML is based on a W3C standard (www.w3.org/), different
    browsers (and different versions of the browsers) may interpret the markup differently.
    This is historical; SGML was a markup language that predated XML, the Extensible
    Markup Language. Languages do not specify display logic. Between SGML and XML,
    HTML wisely combines both display logic and layout logic. Browser differences
    are discussed in detail at www.thebieseye.com/browsers.


    In this exercise, you will learn to specify JavaScript as the scripting language
    to be used within a page and how to pull scripts from an external file into an
    HTML page. Creating modular source code is good programming practice, because
    different individuals usually fill the roles of “HTML developer” and “JavaScript
    developer”.'
