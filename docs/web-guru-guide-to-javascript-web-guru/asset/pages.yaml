  md: '# Exercise 14.1 – Examining the history Object


    Access Restrictions to URLs Are for Security


    As a programmer, you might not like the fact that there are access restrictions
    to the URLs you want to work with. However, as you browse the Web and visit sites,
    you may come to appreciate the need for security precautions.


    With these security precautions, any site access could determine what sites you
    have visited and the exact pages you visited on those sites. Markers could then
    use this information for advertising and crossmarketing of competing products
    and sites. Furthermore, many sites embed cookie information in the URL. Cookies
    offer an easy way to track your account on the site, the products or services
    you are purchasing, and... Would you want every other site on the Web to have
    this information? Not really, which is why browsers have security restrictions.


    When you browse the Web, your browser keeps a list of the places you have visited.
    The list of visited sites, called the history list, is accessible to your scripts
    via the history object. However, unless you use signed scripts and the user grants
    permission, you cannot extract the URLs of sites you have visited. Instead, you
    can move back and forth to different elements in the list.


    The components of the history object are summarized in Table 14.1. Although the
    list is fairly short, you can use these properties and methods to manipulate the
    history in many ways.


    # TABLE 14.1 The history object.


    | Properties | Methods | Event Handlers |

    |---|---|---|

    | current | back() | (none) |

    | length | forward() | |

    | next | go(int("URLTitleSubstring") | |

    | previous | | |


    To safeguard users’ privacy, three of the four properties summarized in Table
    14.1 can only be used with signed scripts and when a user gives permission. These
    properties are current, next, and previous—all of which are read-only strings:


    +   - current—Gets the URL of the current page from the history list.

    - next—Gets the URL of the next page in the history list. This generally assumes
    you have used back or previous first.

    - previous—Gets the URL of the previous page in the history list.


    The final property, length, is accessible in any script and is a read-only value.
    The length property counts the number of items in the history list, which is used
    in conjunction with other properties or methods of the history object.


    The history list itself is useful. The most recently logged document is at the
    top of the history list. A document’s position in the history list does not change
    if user uses the Back button or the Go/View menu to jump to an item in the history
    list. A history length value of 1 indicates that the current document is the first
    one user loaded since starting the browser.


    In this exercise, you will create a page that lets users check how many pages
    they have visited since starting their browser.'
