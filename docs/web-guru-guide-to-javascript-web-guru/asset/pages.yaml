  md: '# CHAPTER 8 Exploring expressions in arithmetic and pattern matching


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_191_0.png)


    Pattern matching using regular expressions allows you to search patterns to validate
    input of any format. In this exercise, you will create regular-expression patterns
    to verify the input of zip codes and phone numbers, adding to what you have already
    learned. To begin to appreciate the strength and versatility of regular expressions,
    you will be introduced to new pattern designations and characters.


    Create a Web page that holds two input text boxes Process and Reset buttons. When
    the user clicks the Process button, a function that checks the zip code and telephone
    number input values accepts patterns. If the input is not acceptable, display
    an alert box that states pattern is wrong. The JavaScript block and function should
    be placed in the <head> section of your HTML page.


    (This is a good point to verify that your HTML and JavaScript are correct. You
    do not want to confuse errors in the basic layout with the script code you will
    writing.)


    To alert the user to errors, simply place an alert message in the function that
    does the evaluation. Then, when you click the Process button, the alert box will
    appear. You may even want to display the content of the text boxes in your alert.
    Now that you have a function that displays properly and a button that calls the
    function, you can proceed.


    To construct a regular expression pattern, you must first examine the field you
    want to match. For the zip code, only consider the basic five-digit code. The
    code must have five numbers, and nothing can appear or after the five numbers—this
    is the pattern you want to create.


    The character set \d" in a pattern indicates that you want to match a digit (number).
    A slash (\) is used to identify the literal "d". Placing a single number inside
    braces (e.g., (3)) indicates that you want to match exactly the number of the
    immediately preceding item. Therefore, to state that your input must have five
    digits, the pattern is \d(5). Finally, it is possible for users to accidentally
    enter spaces and/or letters before or after the five numbers, you must indicate
    that the pattern begins with and ends with the string digit. The caret (^) indicates
    that the string must begin with whatever follows, and the dollar sign ($) indicates
    that the string must end with the preceding item. Therefore, the pattern ^\d(5)$
    can be used to check the zip code. Putting this pattern into words, it states
    that the input string must consist of five digits (no more, no less), the five
    digits must match and end the input string (i.e., there is nothing before or after
    the five numbers).


    As shown in Exercise 8.3, you can construct your regular expression as:


    ```

    var zipCode = /\d(5)$/

    ```


    where the slashes (/ ) surround and designate the content as a regular-expression
    pattern.


    (continued)'
