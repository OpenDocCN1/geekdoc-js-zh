  md: '# CHAPTER 10 Introducing events and event handlers


    TABLE 10.2 Common event-related methods of form controls.


    | Method Name | Description |

    | --- | --- |

    | blur() | The blur() method removes focus from an element. This deselects whatever
    may have been selected in the form field and causes the text insertion point to
    leave the field. |

    | click() | The click() method simulates clicking on an element. Because the behavior
    of the method varies by browser version, you may want to invoke the onclick event
    handler directly instead. |

    | focus() | The focus() method gives focus to an element. An element that has
    focus selected for use. For a text field, this means the insertion point is at
    the beginning of the field. |

    | select() | The select() method selects all text within a text field that has
    focus. If you invoke an element''s select() method and then the element focus,
    you can give the element focus and then its contents. |


    # EXHIBIT 10.5


    ```

    <html>

    <head>

