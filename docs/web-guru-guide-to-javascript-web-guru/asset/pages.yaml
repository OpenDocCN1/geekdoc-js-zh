    \ scrolls. One way to do this is to count the number of characters in the banner\
    \ and set a counter equal to the number of characters in the banner times the\
    \ count of the scroll.\n\nYou will need to track the current character count.\
    \ To handle this, you need variables for the message, the current count, the maximum\
    \ count, and the number of times to scroll. These variables are set by the following\
    \ statements.\n\n```\n//Set the banner message\nvar bText = \" Welcome to our\
    \ site! We hope enjoy your visit . . \";\n//set the number of times to scroll\n\
    var numScroll = 3;\n//initialize count variables\nvar curCount = 1;\nvar maxCount\
    \ = 0;\n```\n\nAfter you determine the variables you need, you can create the\
    \ function to scroll the banner. The scrolling is handled by continuously shifting\
    \ the first character to the end of the banner. The function stops scrolling the\
    \ message when the maximum character count is reached. This function is as follows:\n\
    \n```\nfunction scrollText() {\nif (maxCount == 0) {\n//set maximum characters\
    \ to scroll\nmaxCount = numScroll * bText;\n}\nwindow.status = bText;\n//track\
    \ the number of characters that have\n//been displayed\ncurCount++;\n//shift character\
    \ to end for continuous\n//scroll\nbText = bText.substring(1, bText.length) +\
    \ \nbText.substring(0, 1);\n//test for maximum character count\nif (curCount >=\
    \ maxCount) {\nwindow.status = \"\"; //clear status bar\nreturn;\n} else {\n///if\
    \ not max count continue to scroll\nscrollText();\n}\n}\n```"
