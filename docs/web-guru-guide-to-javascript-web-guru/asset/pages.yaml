  md: '# # Chapter 6


    # # Getting Started with Objects and Arrays


    JavaScript is an object-based language that allows you to program predefined methods
    for your Web browser. You can create your own objects, JavaScript objects to be
    embedded within HTML and interpreted by browsers, so you will obviously want to
    make use of these existing JavaScript objects.


    Objects have variables (known as *properties*), and their values can be initialized
    and/or modified by a script once the object has been instantiated. Early versions
    of JavaScript instantiated objects and initialized their properties by calling
    a *constructor method* from within a `<script>` block. The more modern method
    is to use an explicit *initializer*. In this chapter, you will learn how to use
    both techniques. Object methods can be defined to operate on the values of properties.


    An array is an ordered set of variables or objects. You can use arrays to store
    copies of similar data items inside a single *data structure* so that they can
    be stored and referenced as a set. For example, a set of customer numbers would
    be stored in an array, rather than in individual variables, because they are related
    items of data. Arrays are useful when you need to display a list of customers''
    bank accounts numerically or alphabetically by account name. Functions can also
    be applied to the data contained in arrays, which are sets of related data of
    the same type that can be indexed and iterated through sequentially.


    # For Your Career


    In this chapter, you will learn how to create new functions for data structures
    such as arrays and work with the existing methods defined for browser objects.
    This will enable you to implement sophisticated client-side browser applications
    that make use of data structures for operating on data sets.'
