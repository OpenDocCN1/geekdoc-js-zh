  md: '# Summary


    Forms are widely used on the Web. Anytime you add a form to a Web page, you have
    access to a related form object. Each field in a form also has a related form
    field object. The form object and the form fields objects can be scripted by your
    scripts in a variety of ways to examine and validate your contents. In some cases,
    the processing of the forms will be handled by your scripts. In other cases, you
    will use scripts to preprocess forms before sending the form data to a server
    for final processing. Either way, processing forms first on the client can save
    time and reduce the possibilities for error.


    # Test Your Skills


    **Practice Drill 17.1:** Validating Checkboxes


    Checkboxes, like any other form field, can be validated. However, checkboxes present
    a special problem for your validation routines that are not grouped together;
    each checkbox has a separate name.

    In cases where you want to ensure the user selects at least one checkbox, you
    could use a script to examine each individual checkbox in a form. If none of the
    checkboxes are selected when the form is submitted, a prompt could be displayed
    telling the user to make a selection.

    The following example shows how you can examine the checkboxes in a form and ensure
    that at least one is selected.


    +   1. In your text editor, create a HTML page with the appropriate HEAD and BODY
    elements. Use a TITLE element with the text "Validating Checkboxes."


    ```

    <html>

    <head>

    <title>Validating Checkboxes</title>

    </head>

    <body>

    <h1>Scripting and Validating Checkboxes</h1>

    </body>

    </html>

    ```


    +   2. Within the body of the page, add a form that contains a series of checkboxes.
    Because you want to simulate preprocessing of a form, you should use a submission
    method and action and call a function that returns a Boolean value that can be
    used to determine if the form should actually be submitted or if the submission
    should be cancelled.


    ```

    <form name=myForm method=post onsubmit="http://www.pearson.edu/reg.pl" return
    validcheck(0,4)">

    ```'
