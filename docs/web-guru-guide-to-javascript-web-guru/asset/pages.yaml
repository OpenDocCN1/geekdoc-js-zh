  md: '# STEP 2 – RANDOM SELECTION


    In the previous example, you displayed all of the slogans stored in the slogan
    array on the page. But what you really want to do is select one slogan randomly
    every time the page is loaded so that a customer has an equal chance of seeing
    each slogan in his or her first 20 visits.


    To achieve this goal, you must randomly select the subscript of the array slogan
    every time the script is executed. To do this, call the Math.random() method,
    which returns a floating point value between 0 and 1, which you then multiply
    by 10 to scale the value to lie between 0 and 9, which corresponds to the range
    of subscripts.


    In this step, you will modify the code from the previous step to randomly select
    the subscripts, as shown in Exhibit 8.2. The results are shown in Figure 8.2.


