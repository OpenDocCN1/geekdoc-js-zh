  md: "# EXHIBIT 10.3\n\n```\n<form name=\"myform\">\n<input type=\"button\" name=\"\
    mybutton\" value=\"Click Me\"\nonclick=\"alert ('Button click detected!');\n \
    \     return true;\">\n</form>\n```\n\nThe following code will simulate a button\
    \ click on the form:\n\n```\n<script type=\"text/javascript\">\ndocument.myform.mybutton.onclick();\n\
    </script>\n```\n\nIn reviewing the previous statement, you see that the onclick\
    \ event is simulated by referencing it the object to which it pertains as a method.\
    \ When you simulate events, the event name must always be in lowercase text, as\
    \ shown.\n\nIf you continue to examine this example, you can learn many things\
    \ about JavaScript's object hierarchy. Just as you reference a method via the\
    \ object to which it pertains, you may reference the object by its parents in\
    \ the object hierarchy. In this case, the parent of a button control is the form\
    \ named myform and the parent of the named form is the document object.\n\nIt\
    \ is important to note, however, that window is the top-most object in the JavaScript\
    \ object hierarchy. As long as you are referring to the active window, the document\
    \ object is usually at the top of the object hierarchy in script references. This\
    \ means that the following reference:\n\n```\ndocument.myform.mybutton.onclick();\n\
    ```\n\nis generally assumed to be the following:\n\n```\nwindow.document.myform.mybutton.onclick();\n\
    ```\n\n# STEP 1 – USING AN EVENT-RELATED METHOD\n\nYou can also assign the onclick\
    \ event directly to an action. To do this, you reference the event without the\
    \ open and close parentheses and assign an action, as in the following example:\n\
    \n```\ndocument.myform.mybutton.onclick = alert ('Simulated Click!');\n```\n\n\
    To see simulating events could work in an actual Web page, create a new HTML document\
    \ using the code shown in Exhibit 10.4. Notice that the onclick event is used\
    \ as a method and referenced via the named elements in its object hierarchy: document\
    \ refers to the current instance of the Web page; myform is the current instance\
    \ of the form object; and mybutton is the current instance of the button object.\n\
    \n![](img/ecbd0b33770c7243bdf70ab10c4515ec_222_0.png)"
