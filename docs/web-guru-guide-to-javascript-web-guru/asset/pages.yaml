  md: '# 8 Chapter


    # Exploring Expressions in Arithmetic and Pattern Matching


    So far, you have learned how to use simple arithmetic and logical expressions
    in conjunction with conditional statements to implement program logic in JavaScript.
    However, checking whether simple values are greater than zero or whether a comparison
    operator yields true or false is only the first step in exploring the power of
    JavaScript expressions.


    Going one step further, you can begin to apply arithmetic expressions to JavaScript
    objects as Date and Math. For the Internet banking we have developing, this would
    allow you to use the Date object to check card expiration dates or use the regular
    expression object known as RegExp to search for a set of matches criteria.


    You can use regular expressions to specify certain patterns in string data, allowing
    you to search for items that match specific criteria. In a file system, for example,
    you can specify regular expressions using wildcards such as * to match certain
    parts of a file name or file extension. You can use the RegExp object to create
    similar pattern specifications and apply them to string data.


    # For Your Career


    In this chapter, you will learn how to use JavaScript pattern-matching techniques
    to search in String objects. You will also discover how to form and evaluate expressions
    using sophisticated objects such as Date and Math. This chapter will continue
    developing aspects of the Internet banking site, with an emphasis on pattern matching.'
