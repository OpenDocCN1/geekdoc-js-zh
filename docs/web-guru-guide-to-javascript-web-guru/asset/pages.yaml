  md: '# Exercise 14.5 — Assigning, reloading, and replacing locations


    location.reload(Boolean)—Reloads the page in its initial state without or form
    entries. This has the same effect as choosing Open Location from the File menu
    and entering the URL to the current page.


    location.replace("URL")Loads the page and replaces the current history entry with
    the entry for the new page.


    If you want to explicitly show a URL, you can use the location.assign() to do
    so. Using location.assign() is the same as assigning a URL to the window.location
    object, which was discussed in the previous exercise. In fact, when you assign
    a URL to the window.object, JavaScript calls window.location.assign() for you.
    Using window.location.assign() offers no performance, or other benefit except
    that it explicitly shows the URL and perhaps to a novice switcher.


    You will use reload() whenever you want a page to go back to its original state.
    A reload is more powerful than the browser''s Refresh/Reload location because
    it clears form values that might otherwise remain after a refresh/reload. When
    you use location.reload(), a browser should obtain the original page from cache
    and reload. This is different from using history.go(0), which performs a soft
    reload of the page and should preserve form control.


    The reload() method accepts a single parameter, which by default is set to false.
    If you set this parameter to true, you tell the browser to perform an GET to get
    the cached version of the page.


    You will use replace() to ensure that certain pages do not show up in the user''s
    history. By calling replace() rather than loading the next location through an
    assignment, you replace the current history list entry with that of the referenced
    page. This ensures that the user has no means of using the Back button to go back
    to the previous page.


    Why is this useful? Consider, for example, the case of a user who is registering
    to access your site. You have a specific sequence of pages that must be followed,
    but the pages do not make sense of order or after registration. In this case,
    you may not want a user to be able to go back to a previous page in the registration
    process using the Back button. For this reason, you use the location.replace()
    to navigate to away but not the current page stay in the history list. Thus, the
    page to which the user is always replaces the current page in the history list,
    and the user cannot use the Back button to navigate to a previous page.


    In this exercise, you try different methods of accessing and reloading pages to
    test


    # STEP 1 — CREATING A PAGE


    In your text editor, create a new Web page. You will create a sample HTML page
    as shown in Exercise 14.13. You are going to use the input fields on the page
    to test what happens when you use various methods of reloading the page. You are
    going to use buttons to provide the reload, replace, and assign functionality.


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_342_0.png)


    Use a Relative or Absolute URL


    With location.assign() and replace(), the URL must be relative to the current
