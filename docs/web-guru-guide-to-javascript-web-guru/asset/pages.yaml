    # Exercise 11.3 – Setting the Features of New Windows


    Customizing a new window is more difficult than simply creating a window. To customize
    the window, you must use the parameters of the open () method. The first parameter
    is the URL of the page to load into the new window. When you open a new window,
    supply an URL only if you want to load an existing page into the window. If you
    plan to insert your own markup within your script, do not fill in the first parameter
    and assign an empty string ("") to this parameter.


    The second parameter is the name of the window. Do not confuse the name of the
    window with the title of the document loaded into the window. Giving the window
    a unique name enables you to target it.


    If you omit the third parameter, JavaScript opens a window that looks actually
    like a new browser. When you use the third parameter, specify the features to
    load in a comma-separated list. Features not specified in the list are not displayed—which
    is very important to understand. It means that if you specify any window feature
    in the third parameter, all windows features not specified are turned off.


    features supported by both Internet Explorer and Netscape browsers. By carefully
    selecting the features and size of a new window, you can create custom windows
    that only allow users to perform the actions you want to perform. All the Boolean
    values default to yes if you do not specify the third parameter.


    > TIP

    Exceptions for the Mac

    The menubar and resizable features are not available on Macs. On Mac, the menu
    bar is not in the browser window and all windows are resizable.'
