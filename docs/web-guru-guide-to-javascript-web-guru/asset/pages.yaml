  md: "# Exercise 4.1 – Using if . . . else Statements\n\nIn all of the examples that\
    \ you have worked through thus far, when a JavaScript executes, all of the statements\
    \ are executed once and only once. This is not very useful for general-purpose\
    \ programming. For example, if you wanted to automatically execute the same task\
    \ 100 times, such as when printing a batch of address labels, you would need to\
    \ run the program 100 times. Loops statements, described below, allow you to specify\
    \ that a code block be executed a certain number of times or according to the\
    \ result of some logical, numeric, or character expression.\n\nBy using the if\
    \ . . . else statement, you are asking for a particular expression to be evaluated\
    \ as either true or false. So, if the statement between if and else is true, the\
    \ code block after if will be executed, otherwise, the code block after else will\
    \ be executed. The expression to be evaluated by any valid expression of the kinds\
    \ encountered in Chapter 3. Typically, a logical or numeric comparison will be\
    \ between two variables or a variable and one. The result of comparing two constants\
    \ should be predictable! Note that the same expression does not have to evaluate\
    \ strictly to the Boolean true or false, because zero, null, and non-null values\
    \ have meaning in this context.\n\nIn this exercise, you will learn how to specify\
    \ the most basic conditional statement allows decisions to be made within a script.\
    \ Imagine the scenario where a loan applicant fills in his her income and personal\
    \ details on a Web page before it is processed by the server, and creating human\
    \ work in terms of reviewing loan documents and proof of earnings, it makes sense\
    \ to process some of these basic features on the client side, because some loan\
    \ applicants will be rejected out of hand. In the following exercise, you will\
    \ assign the applicant status of “declined” to an applicant with income less than\
    \ $50,000, and “eligible” otherwise.\n\n# STEP 1 – SIMPLE IF . . . ELSE\n\nIn\
    \ your text editor, create a code block by inserting opening <script></tags, as\
    \ shown in Exhibit 4.1. Define a function called checkEligible() that checks whether\
    \ the value entered in the field annual income in the form homeLoanApplication\
    \ has a value less than $50,000. If homeLoanApplication.annualIncome.value is\
    \ less than $50,000, execute a window.alert() to tell the user that his or her\
    \ application has been rejected, otherwise, execute a window.alert() to tell the\
    \ user that he or she is eligible to apply for a loan.\n\nNext, design the simple\
    \ Web form—homeLoanApplication—with a single field—annualIncome and ensure that\
    \ the form executes the checkEligible() function submitted.\n\n# EXHIBIT 4.1\n\
    \n```\n<html>\n<head>\n  <title>Home Loan Application</title>\n```"
