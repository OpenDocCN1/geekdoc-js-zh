  md: '# Exercise 7.2 – Formatting Strings


    Methods from the string object can be used to format string text. In most cases,
    the methods simply insert some HTML markup around the text of the string. You
    might ask why, if this is just HTML, would you need to use JavaScript to format
    the text in the first place? The answer is that if you embed the formatting inside
    HTML, then HTML does not allow you to reuse the same string later when it may
    need to be formatted in some way. For example, you may define literal strings
    for different heading styles that may be presented in different colors on different
    parts of the page. Alternatively, you may change the color of a customer''s name
    depending on the customer''s bank account status. If the balance after being tallied
    is positive, it should be displayed in red; if the balance is negative, it should
    be displayed in black. Because these items may depend on dynamic data, it is not
    possible to statically code the string-formatting information in HTML.


    A number of different methods can be used to format JavaScript strings, as shown
    in Table 7.2.


    Table 7.2 Methods for formatting strings.


    | Method Name | Description |

    | --- | --- |

    | big() | Increases the size of the string text using <big> |

    | blink() | Makes the string text blink using <blink> |

    | bold() | Turns the string text bold using <b> |

    | color() | Changes the font of the string text using <font color> |

    | fontsize() | Changes the size of a font using <font size> |

    | italics() | Italicizes the string text using <i> |

    | small() | Decreases the size of the text using <small> |

    | strike() | Strikes through the string text using <strike> |

    | sub() | Subscripts the text using <sub> |

    | sup() | Superscripts the text using <sup> |


