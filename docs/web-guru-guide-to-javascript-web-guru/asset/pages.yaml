  md: '# Exercise 17.1 - Examining the form object 405


    directly to a server for processing, or by using a script to preprocess the form''s
    contents before submitting it to a server.


    If you want to preprocess a form before submitting it to a server for final processing,
    you would need to:


    +   - Set the submission method using either method="GET" to set the HTTP GET
    method or method="POST" to set the HTTP POST method.


    +   - Set the submission action as a URL of a server page that will process the
    form''s contents or use the mailto: action to e-mail the form''s contents to a
    specific e-mail address.


    +   - Set the form to allow validation of individual form fields or the form as
    a whole. To validate individual form fields, you can use the change event handler
    of the form field itself. You can use the onsubmit event handler of the form.
    With the onsubmit event handler, be sure to return a Boolean value to true to
    submit the form for processing or false to cancel the submission.


    To see how preprocessing could be handled, consider the example shown in Exhibit
    17.1.


    # EXHIBIT 17.1


    ```

    <form name="myform" method="POST"

    action="http://www.pearson.edu/reg.pl"

    onsubmit="return validateform()">


    <p><input type="submit" value="Submit" /></p>

    </form>

    ```


    In this example, when the form is submitted, the onsubmit event handler is triggered
    and the validateform() function is called. If the function returns true after
    preprocessing the form''s contents, the form is submitted to http://www.pearson.reg.pl
    (a nonexistent URI, for the purposes of demonstration). Otherwise, if the function
    returns false, the form submission is cancelled. Hopefully, you have alerted the
    user to what must be corrected to submit the form. If you do not, the user will
    not know that the form was not submitted or what was entered incorrectly to be
    fixed.


    In this exercise, you are going to script the form reset and submit processes.
    By following this exercise, you will learn techniques for invoking the reset()
    and submit() methods. The image files for this exercise can be found on the Companion
    Web site for this book (www.prenhall.com/webguru). Before you begin, you should
    copy these images to your current working folder (the one in which you will save
    the copy of this exercise).'
