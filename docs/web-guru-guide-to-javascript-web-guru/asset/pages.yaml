  md: '# CHAPTER 11 Working with windows and dialog boxes


    TABLE 11.4 Feature parameters for JavaScript URLs.


    | Feature Name | Type | Description |

    | --- | --- | --- |

    | copyhistory | Boolean | Creates a Go menu using the current history list. |

    | directories | Boolean | Adds the directory buttons to the window. |

    | height | Integer | Sets the height of the window in pixels. |

    | left | Integer | Sets the horizontal (x) position for the top-left corner of
    the window. For Netscape Navigator, must be version 6.0 or later. |

    | location | Boolean | Adds the location field for entering and displaying URLs.
    |

    | menubar | Boolean | Adds the pull-down menus, such as File, Edit, and View.
    |

    | resizable | Boolean | Allows the user to resize the window. |

    | scrollbars | Boolean | Displays scrollbars when necessary. |

    | status | Boolean | Places the status bar at the bottom of the window. |

    | toolbar | Boolean | Adds toolbar buttons, such as Back, Forward, and Home. |

    | top | Integer | Sets the vertical (y) position for the top-left corner of the
    window. For Netscape Navigator, must be version 6.0 or later. |

    | width | Boolean | Sets the width of the window in pixels.


    Although, you can enter the features as a sequence of Boolean values, it is a
    lot easier to simply enter the name of the feature you want to turn on, as in
    the following example:


    ```

