  md: '# Chapter 2


    # Adding Client-Side Scripts to Web Pages


    Browsers and HTML Web pages have a well-defined set of objects associated with
    them. JavaScript operates directly on these objects, such as document objects,
    instantiating them if necessary and invoking their methods as part of a script.
    This chapter introduces you to the document object and its write method, which
    simply prints text to a Web page. Once you include other programming elements,
    such as variables, printing dynamic text becomes more interesting, and as you
    will see in the chapters that follow.


    In this chapter, you will learn how commonly used objects within browsers and
    Web pages, such as the document object, can be employed to create effective scripts
    that work across different browser versions.


    The chapter exercises will introduce an Internet banking example that will be
    featured throughout the rest of this book. In the chapter exercises, you will
    create a welcome Web page using JavaScript methods and elements.


    # For Your Career


    In this chapter, you will learn basic skills that will enable you to create dynamic
    Web pages with many layers. JavaScript is an important part of dynamic HTML; it
    provides the foundation for all of the computational work required to work with
    browser objects.


    All of the skills you learn in this chapter will be helpful to you when you create
    your own Web sites. Whether producing structured layouts, designing of scripts,
    or displaying an understanding of subtleties of different JavaScript versions
    and implementations, building robust JavaScript will impress every user who visits
    your pages.'
