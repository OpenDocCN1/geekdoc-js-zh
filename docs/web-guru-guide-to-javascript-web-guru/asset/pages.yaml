  md: "# Exercise 5.1 – Introduction to Functions\n\nFunctions are the basis of modular\
    \ programming. They promote good design by moving designed chunks of script logic\
    \ into reusable modules. These modules can be called one or more times by a single\
    \ script to realize the higher-level goals of the program. A well-designed, modular\
    \ application composed of many scripts provides a set of reusable building blocks\
    \ for other applications and reduces the amount of time needed to develop new\
    \ applications, because sets of functions will already have been tested.\n\nA\
    \ function should logically perform only one job, and a function may need to call\
    \ many other functions to complete its work. Functions return a result after they\
    \ are finished in the same way that a mathematical expression always returns an\
    \ answer. However, JavaScript functions are more generic than mathematical expressions;\
    \ they are not required to return a result or completion.\n\nFunctions are encapsulated,\
    \ self-contained, and can be identified by their name, which must be unique. For\
    \ example, a function to compute compound interest rates might be called computeCompoundInterestRate().\
    \ When naming variables, functions should be as descriptive as possible.\n\n#\
    \ STEP 1 - CREATING A FUNCTION\n\nTo introduce some basic function concepts, let's\
    \ start by creating a script that forecasts the simple interest on a promissory\
    \ note issued by a corporation. In your text editor, create a new blank page and\
    \ save it as promissory.html. In your text editor, create a code block by inserting\
    \ <script> and closing </script> tags, as shown in Exhibit 5.1.\n\nDefine two\
    \ functions—displayInterest() and simpleInterest()—that compute the simple interest\
    \ on a promissory note after a number of years given a certain principal and interest\
    \ rate, as passed from an HTML form. In this case, the form is called promissoryNote.\
    \ The form allows the user to enter parameters: principal, annualOfInterest, and\
    \ years.\n\nWhen the user clicks the Calculate Interest button, the displayInterest()\
    \ function is called. In turn calls the simpleInterest() which calculates the\
    \ simple interest using the formula principal × annualOfInterest (in decimal terms)\
    \ × years and returns the result to the calling function displayInterest(). This\
    \ function then displays the simple rate using window.alert() after changing the\
