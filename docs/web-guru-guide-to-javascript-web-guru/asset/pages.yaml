    that is 800 × 600 pixels. You will enable the directory, menu, and status bars,
    but disallow resizing of the window. This can be achieved by setting the appropriate
    parameters within a method that calls itself inside a function. If these parameters
    need to be modified—in the situation where the function was called multiple times
    from different entry points—then they could be passed as parameters to the function.


    # INTERMEDIATE PROJECTS


    The following intermediate projects provide you with additional opportunities
    to work with functions.


    # Project 5.1 - Recursion


    A recursive function is one that calls itself many times before finally completing.
    Several mathematical functions act this way, such as the Fibonacci sequence. In
    this project, you will create a recursive function that calls itself to compute
    the factorial of an integer (in this case, fact(10)). You must determine a termination
    condition for the function, otherwise it will continue in a perpetual loop. To
    avoid perpetual looping, you will decrement the variable that keeps track of the
    index once each loop, using a single argument that is passed to the function.
    This argument is itself generated as a result of the function.


    # Project 5.2 - Extending Recursion


    To prove that the recursion from the previous project is actually calling itself
    the same number of times as its argument, display the iteration number for each
    iteration.'
