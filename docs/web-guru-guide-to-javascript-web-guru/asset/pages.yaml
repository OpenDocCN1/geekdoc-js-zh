    Increments and Decrements


    If you find the format of increment and decrement operators confusing, don''t
    worry, you can always write out the long form. For example, ++x is the same as
    x++.


    Dividing a number by zero is mathematically undefined. You cannot divide a pie
    into zeros, otherwise it would not exist! Therefore, before you perform the operation,
    you need to check every variable on the right-hand side of a division operator
    to make sure it is greater than or equal to zero. Otherwise, you will get an unhandled
    error, and your script will fail. If the users enter a zero value into HTML field,
    you can always catch it using an event handler and display a pop-up warning.'
