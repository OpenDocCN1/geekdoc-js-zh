    # Exercise 11.5 – Using Prompts


    In this exercise, you will learn techniques for using prompts and handling responses
    to prompts. A prompt dialog box presents a message and allows users to enter information
    in response to the message. As you can see from Figure 11.7, this dialog box also
    has OK and Cancel buttons. To create a prompt, you will use the prompt() method,
    which has two mandatory parameters. The first parameter is the message to display,
    the second parameter is a default reply. Because the parameters are mandatory,
    you must use an empty string for the second parameter if you do not want to enter
    a default reply. See the following example:


    ```

    prompt("Please enter your name.");

    ```


    You can handle responses from prompt dialog boxes in several different ways. As
    with confirm dialogs, clicking the OK or Cancel button returns true or false,
    respectively. Although checking a true/false condition will work in some respects,
    you also want to see if the user entered information.


    When the user clicks the prompt dialog box'' OK button but does not enter text
    into the input field, the value returned by the prompt() method is an empty string
    (""). When the user clicks Cancel, any variable you set equal to the output of
    the prompt will contain a null value. Because of this, you should always test
    for both the empty string and a null value when trying to determine if a user
    entered information from the prompt.


    ![](img/ecbd0b33770c7243bdf70ab10c4515ec_254_0.png)


