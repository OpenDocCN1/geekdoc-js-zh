  md: '# Exercise 13.2 - Examining the anchor Object


    You use the document.anchors property to access the anchors in your pages according
    to their index. In HTML, you label anchors with the name attribute, in the following
    example:


    ```

    <html><a name="Intro"> Introduction</a></html>

    ```


    If this is the first anchor on the page, you could reference this anchor as follows:
    document.anchors[0]


    The anchor object has no properties, methods, or events you can access directly.
    Like link objects, anchor objects are created when you access a Web page in a
    browser.


    To track the number of entries in the anchors[] array, and thereby the number
    of anchors in a Web page, you can use the length property of the array object.
    You may want to assign the value returned by this property to a variable as:


    ```

    numAnchors = document.length;

    ```


    In this exercise, you will create a Web page with several anchors and then navigate
    to those anchors with a script.


    # STEP 1 - CREATING A PAGE WITH ANCHORS


    In your text editor, create a new Web page. You will create a sample HTML page
    using the source shown in Exhibit 13.3. Your page should contain the anchors as
    shown. Note that each anchor has a unique name. Note that the page has a body-defined
    script that displays the number of anchors in the page.


    # EXHIBIT 13.3


    ```

    <html>

    <head>

    <title>Using the Anchor Object</title>

    </head>

    <body>

    <a id="intro" name="intro">Introduction</a>

    <p>This is the introduction.</p>

    <hr size="2"/>

    <a id="section1" name="section1">Section 1</a>

    <p>This is section 1.</p>

    <hr size="2"/>

    <a id="section2" name="section2">Section 2</a>

    <p>This is section 2.</p>

    <hr size="2"/>

    <a id="section3" name="section3">Section 3</a>

    <p>This is section 3.</p>

    ```'
