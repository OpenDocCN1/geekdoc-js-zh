  md: '# About the Authors


    William R. Stanek has 20 years of hands-on experience with advanced programming
    and development. He is a leading technology expert, an award-winning author, and
    an exceptional instructor who teaches courses in Windows, SQL Server, Exchange
    Server, and IIS administration. Over the years, his practical advice has helped
    millions of programmers, developers, and network engineers all over the world.
    His 50+ books have more than 3 million copies in print. Current or forthcoming
    books include Windows Server 2003 Inside Out, Microsoft Windows XP Professional
    Administrator''s Pocket Consultant, Second Edition; Microsoft Windows Server 2003
    Administrator''s Pocket Consultant; and IIS 6.0 Administrator''s Pocket Consultant.
    To contact William, visit his Web site (www.williamstanek.com) and send him an
    e-mail.


    Dr. Paul Watters is a Senior Lecturer in the Postgraduate Professional Development
    Program and Department of Computing at Macquarie University, Sydney, Australia,
    where he convenes the Web Technologies program. He has developed numerous commercial
    applications and services for clients including the Universities Admissions Centre
    (UAC), and has served on the CeNTIE information brokering panel exploring future
    Internet and Web applications at the CSIRO. Dr. Watters currently teaches ITEC833
    Web Server Technologies and Web Services. He is the author of Web Services in
    Finance, published by Apress.'
