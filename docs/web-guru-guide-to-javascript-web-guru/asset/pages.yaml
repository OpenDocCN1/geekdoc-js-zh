    Status is a very useful property of the window object, you will want to know about
    the other window properties as well. Table 11.1 provides an overview of the most
    commonly used properties of the window object. Using this table, you can tell
    the values properties accept, whether you can set the properties, and whether
    you can get the current settings of the property; you also get a brief description
    of how the property is used.


    # Exercise 11.2 – Creating and Closing Windows


    The browser window is created when the browser is started by a user. When working
    with scripts, you will want to create additional windows to display information
    to users. The way you do this is to create a subwindow with the window.open()
    method.


    The window.open() method has three standard parameters that define window characteristics:


    +   - The URL of the document to be loaded in the new window


    +   - The name for the window, which can be referenced in the target attribute
    of an HTML tag


    +   - An optional parameter string that details the features of the window in
    a comma-separated list


    To see new windows can be created, consider the following example:


    ```

    var newWindow = window.open("display.htm", "display",n"height=300,width=400");

    ```'
