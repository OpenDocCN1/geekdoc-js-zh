  md: '# Exercise 9.2 – Precaching and swapping images


    Here, you create an instance of image and its source, which is a JPG image file
    located in the same directory as the Web page. If the image was in a different
    directory, you would create a relative or absolute path to the image. In this
    example, the JPG image file is located in the images subfolder of the current
    directory:


    ```

    theImage.src = "images/tshirt.jpg";

    ```


    In this example, the JPG image file is located on another server:


    ```

    theImage.src = "http://www.robstenek.com/images/tshirt.jpg";

    ```


    If you want to use this image in your Web page, you would replace the `<img>`
    element object that replaces the page with image in memory. Here is how you would
    do it:


    ```

    document.images[0].src = theImage.src;

    ```


    The browser would then replace the first image on the page. In your Web pages,
    you can use swapping-technique to change images over user selections and actions.
    For example, if a user clicks on a button graphic, you may want to display another
    version of the graphic to appear as it is selected below:


    Again, the steps for precaching and swapping images are shown in Exhibit 9.4.


    # EXHIBIT 9.4


    +   // Create a new instance

    // of the Image object

    theImage = new Image(150, 150);

    // Assign a source image

    theImage.src = "cards.jpg";n// Swap the image on the page

    // typically in response to a

    // user action or selection.

    document.images["display"].src = theImage.src;


    > TIP Different Browsers May Handle Image Updates in Different Ways When you use
    JavaScript to update images, you should keep in mind how different browsers render
    graphics. Browsers prior to Internet Explorer 4.0 and Netscape Navigator 6.0 swap
    images by replacing the original image with a new one in the same space. If the
    image being swapped is a different pixel size it can be scaled up or in size to
    fit the existing space. With Internet Explorer 4.0 and Netscape Navigator 6.0,
    browsers automatically reflow the page to accommodate the image size. This means
    that the image can be displayed in the size it was created and the content may
    change its position when the page is updated (Keep in mind that you must either
    update the height and attributes or omit them in the first place to achieve this
    effect,.)


    In this exercise, you are going to precache and swap images based on a user selection.
    By following this exercise, you will learn these essential image-scripting techniques.
    Once you know how to precache and swap images, you can apply these techniques
    in a variety of ways to your Web pages. By handling events related to the image,
    you can swap images based on user actions. By adding a timer, you will swap images
    on a schedule.


    # CREATING A PAGE


    In your text editor, create a new Web page using the markup shown in Exhibit 9.5
