  md: '# # Chapter 10


    #  Introducing Events and Event Handlers


    As you have seen in previous chapters, JavaScript is a powerful scripting language
    that can be used to perform behind-the-scenes manipulation of Web pages. In this
    chapter, you will look at the more interactive features of the language, starting
    with a look at events and event handlers and continuing with a look at dialog
    boxes.


    An event is a procedure that is executed automatically when a certain condition
    exists. There are events for mouse clicks, mouse movements, button clicks, and
    so on. An event handler is an object property or method that specifies how an
    object reacts to an event. Events can be triggered by a user action, such as a
    button click, or a browser action, such as the completion of a document load.


    In JavaScript, you create windows and dialog boxes using the window object. The
    window object is at the top of the browser object model for all scriptable browsers.
    As such, window is the top-level container for all content you view in a Web browser.
    Whenever you start a Web browser, the window object is defined in memory—even
    if no document is loaded.


    # For Your Career


    In this chapter, you will examine event handling and simulation. A solid understanding
    of these concepts is necessary to create interactive Web pages. Because this chapter
    is an introduction to these concepts, it serves to provide the essential foundation.
    You will build on that foundation in the chapters ahead.'
