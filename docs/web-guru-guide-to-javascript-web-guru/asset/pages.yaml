    # STEP 3 - USING DATA MANIPULATION METHODS


    Many of the String object''s functions are designed to manipulate data, such as
    changing, extracting a substring from a larger string, or breaking a string into
    a number of substrings. Many of these operations rely on the underlying representation
    of data in the string''s literal representation. Imagine that the string''s data
    is an array of characters. Each character in the string is associated with a specific
    location, starting at index 0. Thus, a String object that has 18 characters of
    data will have 18 character addresses from index 0 through index 17. You can use
    these locations to perform the substring methods referred just discussed.

