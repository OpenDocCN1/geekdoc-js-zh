  md: '# Chapter 17


    # Scripting HTML Forms


    Throughout this book, you have seen examples of how scripts can be used to examine
    form fields. You have used scripts to examine many types of form fields. Now it
    is time to take a closer look at how scripts can be used with forms. Forms can
    contain a wide variety of input fields, including push buttons, radio buttons,
    checkboxes, selection menus, and text fields.


    # For Your Career


    This chapter focuses on scripting standard form elements, including push buttons,
    checkboxes, selection menus, and text-related input fields. These are the key
    form elements you will work with. As you read the chapter and follow the exercises,
    pay particular attention to the form elements which are validated. Whenever possible,
    you should try to examine and work with forms on the client—even if later submission
    to a server is required. Preprocessing forms in a user''s browser is much faster
    and much more efficient than having to send a form to a server for validation.'
