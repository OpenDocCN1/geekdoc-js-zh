- img_proc: true
  md: '# Exercise 14.2 – Navigating the history list


    history.forward() goes one page in the history list. It is rarely used unless
    you have previously moved back in the history list. This method could be used
    in a page as follows:


    ```

    <input type="button" value="Go Forward onclick="history.forward()" />

    ```


    history.go() moves to the relative index specified in the history list. Alternately,
    you can specify an exact string for a title or URL in the history list. This method
    could be used in a page as follows:


    ```

    <input type="button" value="Go Back 2 onclick="history.go(-2)" />

    ```


    With the go(), method positive integer moves to the page number of items forward
    in the history list. A negative integer moves to the page number of items back
    in the history list. Following this, history.go(1) is the same as history.forward(),
    history.go(-1) is the same as history.back(). In practice, these are the methods/values
    of the history object that you will use most often.


    It is also useful to use a value of zero for the go() method to perform a soft
    reload of the current window, which allows the window to be reloaded from cache.
    Note, however with Internet Explorer 4.0 and later, the browser may actually reload
    by going back to the server and requesting the page again.


    Using the history properties is a good way to navigate around your site when you
    disable or not show the Back and Forward buttons. In this exercise, you are going
    to work with the history.back() and history.forward() methods. To implement a
    Back or Next page button, you simply assign the back() or forward() methods to
    the onclick event of a button. Whenever you use the back() and forward() methods,
    you want to be sure these options are actually available to the user. The way
    to do this is to track the user''s progress over your Web site.


