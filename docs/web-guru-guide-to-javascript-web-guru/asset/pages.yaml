  md: "Although the function scrolls the banner, there is no mechanism for controlling\
    \ the speed of the banner. The result is that messages scroll by faster than you\
    \ can read them. To control the speed of the banner, you need to build a delay\
    \ mechanism.\n\nThis can be handled by a timer that recursively calls the scroll()\
    \ function only after a specified period of time. The setTimeout() method is perfect\
    \ for this purpose. The method accepts two parameters: a function to call and\
    \ a delay in milliseconds. The timer definition that follows calls the scroll()\
    \ function after waiting 150 milliseconds:\n\n```\ntimerId = setTimeout(\"scrollText\"\
    , 150);\n```\n\nWith a variable initialized at the top of your script, you can\
    \ make it easier to track timers. Here we will replace the numeric value with\
    \ a variable delay:\n\n```\ntimerId = setTimeout(\"scrollText\", delay);\n```\n\
    \nWhen you are finished with a timer, it is always a good idea to zero it out.\
    \ Setting the timer's value to zero frees system resources and prevents the timer\
    \ from running amuck on your system. For this reason, in the scrollText() function,\
    \ the timer is zeroed out when the maximum character count is reached:\n\n```\n\
    function scrollText() {\n  if (maxCount == 0) {\n    //set maximum characters\
    \ to scroll\n    maxCount = numScroll * bText.length;\n    window.status = bText;\n\
    \    //track the number of characters that have\n    //been displayed\n    curCount++;\n\
    \    //shift first character to end for continuous\n    //scroll\n    bText =\
    \ bText.substring(1, bText.length) +\n    bText.substring(0, 1);\n    //test for\
    \ -maximum character count\n    if (curCount >= maxCount) {\n      timerId = 0;\
    \ //zero out timer\n      window.status = \"\"; //clear status bar\n      return;\n\
    \      //break out of function\n    } else {\n      //if not max count continue\
    \ to scroll\n      timerId = setTimeout(\"scrollText()\", delay);\n    }\n}\n\
    ```\n\n(continued)"
