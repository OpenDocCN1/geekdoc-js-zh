  md: "# Practice Drill 10.2: Using unload and onabort Event Handlers\n\nThe unload\
    \ event handler can be used with the <body> tag, image, layer, link, and window\
    \ objects as well as with frames. With images, the behavior depends on which attributes\
    \ the image object are used. With an image that has a lowsrc attribute, the onload\
    \ event is triggered when the src image loads, not when the src is loaded later.\
    \ With an animated GIF image, the event occurs when each frame of the animated\
    \ GIF is displayed.\n\nThe onabort event handler is triggered when a user clicks\
    \ the browser's Stop button before an element loads. If a user clicks Stop, use\
    \ the onabort event handler. The onabort event handler can also be triggered when\
    \ a user clicks a link in a page that is loading because it interrupts the page-loading\
    \ process.\n\nTo see how these events can be used, complete the following exercise:\n\
    \n+   1. In your text editor, create an HTML page with the appropriate HEAD and\
