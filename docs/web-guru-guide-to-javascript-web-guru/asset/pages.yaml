  md: "# CHAPTER 4 Controlling the flow within scripts\n\nThe most common issue arises\
    \ when using the if else statement is that the assignment (= and equivalence (==)\
    \ operators are confused. The assignment sets a variable to have some value, such\
    \ as loanBalance=100. However, if you want to test the value of loanBalance is\
    \ 100 in an if . . else context, you need to use the equivalence operator in the\
    \ following: if (loanBalance==100) . . else. If you used (loanBalance=100), then\
    \ the inner expression loanBalance=100 assigns the value 100 to the variable loanBalance,\
    \ after which the expression is always true.\n\nTIP\nElse? What?\nSometimes, you\
    \ do not need to execute a second block if the evaluation of the expression within\
    \ the if () statement is true. For example, you may submit the loan application\
    \ only if it is greater or equal to $50,000 and simply provide no further condition.\
    \ In this situation, you do not need to supply an else part to the statement,\
    \ and there is no second code block.\n\n# STEP 2 - MULTIPLE COMPARIS\n\nIn your\
    \ editor, create a code block by inserting an <script> and a closing </script>\
    \ tag, as shown in Exhibit 4.2. Once again, define a function called checkEligible()\
    \ that checks whether the value entered into the form annualIncome has a value\
    \ less than $50,000 and also whether the applicant has liabilities greater than\
    \ $100,000.\n\nIf HomeApplication.annualIncome.value is less than $50,000 or if\
    \ the applicant has liabilities greater than $100,000, execute a window.alert()\
    \ to tell the user that his or her application has been rejected, otherwise, execute\
    \ a window.alert() to tell the user that he or she is eligible to apply for a\
    \ loan.\n\nOnce again, design a simple web form—homeApplication—with two fields—annualIncome\
    \ and liabilities—and ensure that the form executes checkEligible() function submitted,\
    \ as shown in Figure 4.2.\n\n# EXHIBIT 4.2\n\n```\n<html>\n<head>\n<title>Home\
    \ Loan Application</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nfunction checkEligible() {\n  if (document.homeApplication.annualIncome.value<50000||document.homeApplication.liabilities.value>100000)\
    \ {\n    window.alert(\"You are not eligible to apply for a home loan.\");\n \
    \ } else {\n    window.alert(\"You are eligible to apply for a home loan.\");\n\
    \  }\n}\n</script>\n```"
