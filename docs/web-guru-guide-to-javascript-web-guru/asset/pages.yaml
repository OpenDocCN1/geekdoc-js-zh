  md: '# Chapter 11


    # Working with Windows and Dialog Boxes


    You can use scripts to manipulate the browser window and to create additional
    windows and various types of dialog boxes. In this chapter, you will learn techniques
    for working with windows and dialog boxes. As you will learn, the window object
    is much more than the base of the object hierarchy. It is the most dynamic object
    available in JavaScript. Using the window object, you can create new windows of
    many types, including:


    +   - New browser windows

    - Alert dialogs

    - Prompt dialogs

    - Confirmation


    In addition to the properties and methods of the window object that help you track
    and update the many windows you can create, events of the window object help you
    interact with the user when windows are activated or deactivated.


    > For Your Career


    In this chapter, you will examine issues related to browser windows and dialog
    boxes. Not only will you learn how to create windows, but you will also learn
    techniques for effectively working with windows as you would in real-world applications.
    It is important to not only be able to create windows, but also to understand
    the conditions that should be tested before opening or close windows. Keep in
    mind that pop-up blockers can interfere with opening additional windows. On the
    Web, this means many users may not see pop-up windows. On an internal intranet,
    however, browsers can be configured with different security to allow pop-ups to
    be used so your intranet applications works properly.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter Exercises


