  md: '# CHAPTER 17 | Scripting HTML forms


    In cases you want to ensure that the user makes a selection, you may not want
    to rely on a default state. To work around this, you could use a script to examine
    the radio buttons in the group. If none of the radio buttons are selected when
    the form is submitted, a prompt could be displayed that tells the user to make
    a selection.


    When you use scripts to examine radio buttons, you have to examine each radio
    button according to its index in the radio group. You report an error only when
    none of the radio buttons are checked.


    To see how this could be handled using the techniques you have learned in this
    chapter, complete the following exercise.


    +   1. In your text editor, create a HTML page with the elements as shown here.
    Use appropriate HEAD and BODY elements. Use a TITLE element with the text "Checking
    radio buttons."


