    # Exercise 9.3 - Rotating Images


    In your Web pages, you will often want to update images based on user selections.
    You have already read about an example of updating images based on user selections
    in a form. Another way to handle user selections is to use the built-in event
    handlers that of JavaScript. Although you will learn more about these event handlers
    in Chapter 10, for now, you will focus on one particular event handler: mouseover.
    This event is triggered when a user moves the mouse over an element or object
    in a Web page.


    Most of the time, handling events is easy. However, handling image-related events
    is a bit tricky. If you refer back to Table 9.1 you will see that mouseover is
    not listed as a standard event handler (i.e., those events supported by the widest
    set of browsers). So the best way to achieve the desired effect is to use another
    object''s event handler, namely the event handler for anchor objects. Consider
    the following example:


    ```

    <a href="C9exercise2.htm" onmouseover="rotate()">

    <img alt="webguru" src="webguru.jpg" name="webguru"

    height="100" width="300" border="0/">

    </a>

    ```'
