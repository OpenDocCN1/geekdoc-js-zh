    Stanek Home Page''; return true">RobertStanek.com</a></p>

    ```


    # STEP 5 - RELOADING THE PAGE


    In Internet Explorer, open the page you updated. You can force Internet Explorer
    to refresh the page by holding Ctrl when you click the Refresh button. Move the
    mouse'
