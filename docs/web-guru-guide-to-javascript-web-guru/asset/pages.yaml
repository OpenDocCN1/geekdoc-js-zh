  md: "variables, expressions, operators, and data types. In Chapter 4, you will learn\
    \ to control\nt we scripts are executed with conditional expressions and looping\
    \ controls.\nChapter 5 discusses functions and how they are used. Chapter 6 explores\
    \ objects and\narays. Chapter 7 details the essentials for working with strings\
    \ and manipulating text input. Chapter 8 shows how to use regular expressions\
    \ and pattern matching.\nChapter 9 shows you how to use, precache, and swap images\
    \ with JavaScript.\nChapter 10 introduces event handlers. Chapter 11 covers working\
    \ with windows and\ndialog boxes. Chapter 12 focuses on examining the elements\
    \ within Web pages. Chapter\n13 details embedded objects, such as applets. Chapter\
    \ 14 examines how you\nwork with the browser history list and locations. Chapter\
    \ 15 explores in accessing\nbrowser and operating system version information.\
    \ Chapter 16 shows you how to create\nclient-side cookies and use them to store\
    \ information. Chapter 17 discusses techniques\ny can use script and validate\
    \ HTML forms. Appendix A and B provide essential\nquick references for working\
    \ with JavaScript. Finally, the Glossary lists common\nJavaScript scripts introduced\
    \ in the chapters, and their definitions.\nThroughout this book you'll see a variety\
    \ of elements to help keep the text clear.\nYou'll find code terms in monospaced\
    \ type, key terms in bold italics, and hypertext\nlinks in underline.\n\n# # Teaching\
    \ and Student Resources\n\nInstructor's Resource Center on CD-ROM\n\nThe Instructor's\
    \ Resource Center on CD-ROM (IRC on CD) is distributed to instructors\nonly and\
    \ is an interactive library of assets and instructs. It includes the tools you\
    \ expect\nfrom a Prentice Hall text:\n\n+   - Instructor's Manual—provides instructional\
    \ tips, an introduction to each chapter, teaching objectives, teaching suggestions,\
    \ and answers to end-of-chapter\nquestions and problems.\n- PowerPoint slide presentations\
    \ for each chapter—provide a convenient means of\n reviewing the content of the\
    \ book in the classroom setting.\n- Data and Solution Files.\n- Complete Test\
    \ Bank.\n- TestGen Software—a test generator that lets you view and easily edit\
    \ test bank\nquestions, transfer them to tests, and print in a variety of formats\
    \ suitable to your\nteaching situation. The program also offers many options for\
    \ organizing and de-laying test banks and tests. A built-in random number and\
    \ test generator makes ideal\nfor creating multiple versions of test questions\
    \ that involve calculations and provides\n possible test items than there are\
    \ test bank questions. Powerful search and sort\nfunctions let you locate locations\
    \ and arrange them in the order you prefer.\n\n# # Companion Web Site (www.prenhall.com/webdevelopment)\n\
    \nThe Companion Web Site is a Pearson learning tool that provides students and\
    \ instructors with online support. Here you will find the Interactive Study Guide,\
    \ a Web-based\ninteractive quiz designed to provide students with a convenient\
    \ online mechanism for\nself-testing their comprehension of the book material."
