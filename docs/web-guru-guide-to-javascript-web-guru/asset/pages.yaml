  md: '# # Chapter 5


    # # Working with Functions


    Functions support modular programming in JavaScript. They provide the capacity
    to encapsulate related parts of an application''s logic into an entity that can
    be reused multiple times by the same script or other scripts. For example, a set
    of functions to calculate various interest payments could be used on an Internet
    banking site to provide estimates for new investors, but it could also be reused
    by the bank to calculate interest for existing investors.


    In object terms, a method is a function that forms part of an object. The object
    often models the behavior and data of a real-world object. JavaScript objects
    are based on the structures in a Web browser—dialog boxes, text fields, and so
    on—and numerous JavaScript methods are available to operate on these objects.
    However, note that programmers can also create objects that are not based on structures
    in the Web browser. These will be discussed in the next chapter.


    > For Your Career

    In this chapter, you will learn how to create new functions for your scripts to
    encapsulate application logic. This will enable you to implement sophisticated
    client-side browser applications that reuse functions.'
