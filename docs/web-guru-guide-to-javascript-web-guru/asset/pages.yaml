    Here, you access an element by its ID, which in this case is "Applet", and set
    the numQuestions property of the object 10. It is important to note that any object
    related to an element with an ID attribute can be obtained using the document.getElementById()
    method. Once you have the associated object, you can work with it as you would
    normally.


    It is possible for an object to have properties with the same name as those of
