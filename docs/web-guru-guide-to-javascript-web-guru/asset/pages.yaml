  md: '# ARE YOU LOOKING TO MASTER


    # THE WAYS OF JAVASCRIPT ?


    # THIS BOOK WILL HELP YOU REACH YOUR GOAL!


    In Guru Guide to JavaScript, William Stanek and Paul Watters have teamed up to
    bring to you combined years of hands-on experience with Web programming and Web
    development. William Stane...

    na consultant and technical trainer of more than 50 best-selling books, including
    Windows Server 2003 Administrator''s Pocket Consultant. Paul Watters, Ph.D., is
    a Senior Lecturer at Macquarie University, Sydney, Australia. While working at
    Whitehead, he developed and managed Web-based information systems for Fuji-Xero,
    Oracle, Sun Microsystems and Hitachi. Whether you are a Web programmer or designer,
    their practical advice will help you find real-world solutions to problems you
    will encounter in your career!


    With Guru Guide to JavaScript, you''ll not only learn JavaScript fundamentals,
    but also the advanced techniques of current designers and programmers. This book
    discusses:


    +   - Programming essentials

    - Functions, objects, and arrays

    - Events and event handlers

    - Client-side cookies

    - Image pre-caching and swapping

    - Form validation

    - And much more!


    This book is filled with tools to help you move beyond learning concepts so you
    can apply them. These tools include:

    - Career Builder: Build a professional portfolio as you work through this book.

    - For Your Career: Learn how to take your textbook exercises and turn them into
    something you can implement for clients and employers.

    n- Chapter Exercises: See immediate results and learn as you build Web sites through
    hands-on exercises.

    - Practice Drills: Apply what you have learned with end-of-chapter practice projects
    that contain new scenarios.


    The companion Web site (www.prenhall.com/webdevelopment) includes:


    +   - Additional teaching materials and projects to reinforce book lessons.

    - Links to downloadable software and used in the book.

    - Links to additional topics and resources to assist you in your professional
    development.


