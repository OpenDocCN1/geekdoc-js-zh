  md: '# Exercise 11.4 – Using dialog boxes


    The first button makes a window by directly calling the window.open() method in
    the onclick event. This window is not named and loads a document called sample.html.
    Each time this button JavaScript will create a new window. If you make the window
    active, the subwindow is usually hidden from view behind the window. In this case,
    the only way to see the subwindow again is to access it from the taskbar or minimize
    the main window.


    The second button calls a function that creates a window. This also loads the
    sample.html document. If you click on a button the second time, the createWindow()
    function invokes the focus() method to bring the window to the front. In this
    way, if the window is hidden from view, you can bring it to the front by clicking
    on the button.


    Note also adding a status bar. Windows created by the first button are resizable
    and have a status bar. Windows created by the second button are resizable, have
    a status bar, and also have a location field.


    # STEP 4 – MODIFYING THE MAIN PAGE


    In your text editor, open the HTML page created in Step 1. Change the features
    parameters to try out some of the other features. While are editing the features,
    give the window created with the first input button name—call it window3. Hint:
    You give the window name by setting the second parameter of the window.open()
    method.


    # STEP 5 – LOADING THE FINAL PAGE


    In Internet Explorer, open the modified page. Use both buttons to create the windows
    and see how the windows'' features affect the browser. Load the subwindows several
    times. Did you notice any different behavior after the features modified? You
    probably did. Now that the first button creates a named window, clicking the button
    will only create the window if it does not already exist.


    # Exercise 11.4 – Using Dialog Boxes


    JavaScript provides three types of dialog boxes that you can use to communicate
    with the user.


    +   * Alert

    * Confirm

    * Prompt


    You will look at alert() and confirm dialog boxes first. You create an alert dialog
    box with the window.alert() method to present a message to users and has an OK
    button users can click on to close the dialog box (see Figure 11.4). While the
    alert is displayed, no other window can be active. The alert() method of the window
    object accepts a single parameter. This parameter is a string containing the message
    you want to display, such as:


    ```

    alert("Input error, please check the data!");

    ```


    You create a confirm dialog box with the window.confirm() method. A confirm dialog
    box is more versatile than an alert box.'
