    # Exercise 5.3 - Encapsulation


    One of the key features of JavaScript functions is that they can be reused or
    kept separate from the main program. In Exercise 5.2, you saw how variable scope
    can be used to implement encapsulation.


    In this exercise, you will learn how to use a function to "wrap" existing statements
    so that their parameters can be used for more general purposes. The example will
    use a window object to set up a login page for an Internet Web site. The login
    page will be spawned from a parent page, with the size and location on creation.
    Other functions could then be enabled, as printing the page or requesting user
    input. A well-designed script will separate all of these activities into separate
    functions.


