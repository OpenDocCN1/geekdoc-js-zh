  md: '# Exercise 13.1 – Examining the link object


    # TABLE 13.2 The link object properties.


    | Property | Value | Type | Description |

    | hash | String Read/Write | Allows you to check or set an internal page link,
    designated with the hash mark (#). An example value is #ruinmist. Supported by
    NN2, IE3 and later as well as Mozilla and Safari. |

    | host | String Read/Write | Allows you to check or set the current hostname and
    port information in the designated link. An example value is www.robertstanek.com:80.
    Supported by NN2, IE3 and later as well as Mozilla and Safari. |

    | hostname | String Read/Write | Allows you to check or set the current hostname
    in the designated link. An example value is www.robertstanek.com. Supported by
    NN2, IE3 and later as well as Mozilla and Safari. |

    | href | String Read/Write | Provides the complete URL of the link; can be used
    to set the URL as well. An example value is http://www.robertstanek.com:80/curr/books.html.
    Supported by NN2, IE3 and later as well as Mozilla and Safari. |

    | pathname | String Read/Write | Allows you to check or set the URL path information
    in the designated link, which is relative to the current directory on the server.
    An example value is /curr/books.html. Supported by NN2, IE3 and later as well
    as Mozilla and Safari. |

    | port | String Read/Write | Allows you to check or set the current server port
    in the designated link. An example value is 80. Supported by NN2, IE3 and later
    as well as Mozilla and Safari. |'
