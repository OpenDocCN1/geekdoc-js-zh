  md: "Because several errors may be present, we want to display them all in one alert\
    \ box, rather than having multiple boxes appear after one the other. Therefore,\
    \ we have created a generic error message that will appear whenever an error occurs.\
    \ This message simply states that there is an error present. Specific errors will\
    \ be listed in the error message. We also declare a variable that will be used\
    \ as a flag, which tells us if an error is present. The code is as follows:\n\n\
    ```\n// The generic start of any error message shown.\nerrorMsg=\"The form has\
    \ the following errors:\";\ninputFlag=false;\n```\n\nTo begin processing, create\
    \ a function called checkURL that is called when the user clicks the Submit button.\
    \ The first step in this function is to ensure that content has been entered into\
    \ the text box. In this case, if there is no input, the error message is set and,\
    \ other than displaying the error message, processing stops. Note how the += operator\
    \ is used to concatenate the message with the generic intro. Also see how the\
    \ \\n sequence is used to place the error on a new line.\n\n```\nfunction checkURL()\
    \ {\n  URL = document.inputForm.txtURL.value;\n  // Is a URL entered? If not display\
    \ error\n  message and stop other checks\n  if(URL==\"\") {\n    errorMsg +=\"\
    \\nURL missing\";n    inputErrorFlag=true;\n  }\n```\n\nIf there is content in\
    \ the text box, processing continues and other checks are made. This code is placed\
    \ within an else block immediately following the block if shown above.\nThe first\
    \ check will be to determine if the proper protocol is used. We have created a\
    \ variable to hold the substring and then test the substring. In this situation,\
    \ the protocol is found in the first seven positions of the URL (starting at index\
    \ 0 and ending at index 6). The substring() method specifies the first character\
    \ to include and the next character to exclude.\n\n```\nelse {\n  // check for\
    \ a proper protocol\n  protocol = URL.substring(0,7);\n  if(protocol != \"http://\"\
    ) {\n    errorMsg += \"\\nincorrect protocol\";\n    inputErrorFlag=true;\n  }\n\
    ```\n\nNote that the inputErrorFlag is set to true if the protocol is incorrect.\
