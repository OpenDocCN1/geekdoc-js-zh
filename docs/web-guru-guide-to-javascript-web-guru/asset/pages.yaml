  md: '# STEP 1 – CREATING THE MAIN PAGE


    In your text editor, create a blank page. You will create a sample HTML page as
    shown in Exhibit 11.9. Take a close look at the script. The script has all the
    elements necessary to create a useful window in your scripts. The new window object
    reference is assigned to a global variable called newWind. The createWindow()
    function has the appropriate logic to handle several important conditions. Before
    it creates a new window, the script checks if the window exists or if it has been
    previously created and then closed. If the window does not exist, it has a null
    value and the !newWind condition evaluates to true. If the window existed previously
    closed (which is a required check for new browsers), the newWind.closed condition
    evaluates to true. If either condition is true, the window is created with the
    open() method. Otherwise, the existing window is brought to the front using the
    focus() method.


