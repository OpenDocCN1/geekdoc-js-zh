    431


    +   - blur() causes the object to lose focus (and deselects the object).


    +   - focus() causes the object to gain focus.


    +   - select() selects the object, making it active; an object gains focus before
    it is selected and active.


    Events related to the password, hidden, text, and textarea objects are driven
    by users. If a user selects a text-related element, an focus event occurs and
    an onselect event for the related object also occurs. If a user selects a different
    object, an onblur event occurs in the previously selected object.


    You can define the password, hidden, text, and area fields in a form as shown
    in Exhibit 17.19.


    # EXHIBIT 17.19


    ```

    <form>

    <p>Text field:

    <input type="text" name="username" size="16" maxlength="16" />

    <p>Password field:

    <input type="password" name="userpassword" size="16" maxlength="16" />

    <p>Hidden field:

    <input type="hidden" name="memberflag" value="current-member" />

    <p>Text area field:

    <textarea name="userdata" rows="5" cols="50"></textarea>

    </form>

    ```


    In this example, you set various attributes of each field, including size and
    maxlength for the text and password fields and cols for the text area field. Additionally,
    the value attribute is used to set a stored value for the hidden field.


    When working with text, password, and text area fields, you often want to validate
    the fields before submitting them to a server for processing. Without validation,
    there is no way to restrict what the user enters. For instance, a user may enter
    a bunch of gibberish or you get a phone number without the area code. With validation,
    you can determine the acceptable range of values, specify type of data you want
    to obtain, and more.


    Using JavaScript, the types of entries can be restricted by character type. Some
    of the restrictions you might want to work with the following:


    +   - Letters—Allow or disallow the use of alphabetic characters.


    +   - Numbers—Allow or disallow the use of numeric characters.


    +   - Spaces—Allow or disallow the use of spaces.'
