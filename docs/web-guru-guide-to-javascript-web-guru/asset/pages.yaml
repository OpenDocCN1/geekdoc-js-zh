    <frame name="main" src="main.html">

    </frameset>

    </html>

    ```


    +   2. In your text editor, open the final page created in Exercise 12.1 and save
    it as side.html.


    +   3. In your text editor, modify side.html so that when you make a color selection,
    the main frame is updated as appropriate for the selection. You can reference
    the main frame by name or by its index in the frames[]'
