  md: '# STEP 1 – USING MATHEMATICAL OPERATORS WITHOUT ASSIGNMENT


    In your editor, create a new HTML file called maths.html. Several different types
    of mathematical operators can be used to perform operations on number variables.
    These are shown in Table 3.2.


    TABLE 3.2 Mathematical operators.


    | Operation | Function | Symbol |

    |---|---|---|

    | Add | Adds numbers together | + |

    | Subtract | Subtracts numbers from each other | - |

    | Multiply | Multiplies numbers with each other | * |

    | Division | Divides numbers by each other | / |

    | Negation | Changes a positive number to a negative one or a negative number
    to a positive one | |

    | Increment | Adds one to a number | ++ |

    | Decrement | Subtracts one from a number | -- |

    | Modulus | Returns only the remainder from a division | % |


    You have already seen how strings can be added (concatenated) together using the
    addition operator. The semantics for multiplying strings, however, are not defined,
    so these operators are usually confined to numbers.


    In this example, you will use each of these operators on two numbers and verify
    that the result meets your expectation. Next, you will need to declare two variables
    (x and y) and initialize their values. Next, you need to construct a set of expressions
    based on each operator and use the document.write() method to display each of
    the results. The code is shown in Exhibit 3.10, and the Web page output is shown
    in Figure 3.2.


    ```

    x + y = 15

    x - y = 5

    x* y = 50

    x/ y = 2

    x% y = 0

    -x = -10

    x-- = 9

    ```


    FIGURE 3.2 x++ = 10'
