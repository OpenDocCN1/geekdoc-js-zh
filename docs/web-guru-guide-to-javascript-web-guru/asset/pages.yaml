    # Exercise 13.5 – Working with the frame Object


    In previous chapters, you learned some basic frame-handling techniques. As you
    have seen, you can use frames to create a document with multiple window frames.
    One frame can contain a media, another frame can hold the main document, and yet
    another frame can showcase the banners of advertisers. When you combine the versatility
    of frames with the power of JavaScript, you have all the ingredients necessary
    for advanced applications.


    In HTML, you use the <frameset> tag to divide the browser window into rows and
    columns of frames. With the <src attribute of the <frame> tag, a source document
    is associated with each frame. Here is a sample frameset that divides window into
    two frames:


    ```

    <frameset cols="20%,80%">

    <frame name="Side" src="menu.htm">

    <frame name="Main" src="main.htm">

    </frameset>

    ```'
