  md: '# Exercise 1.6 – When to Use JavaScript


    JavaScript is most useful for controlling and customizing the display of information
    that requires the decision logic, data structures, functions, and operators not
    provided by HTML. It provides a basic level of programmability for all client-side
    specification. Thus, there is no point in writing expensive server-side scripts
    to run on the server if the script does not process and validate data submitted
    via a form when the burden of that work can be carried locally. Many of us have
    tried to access Web pages and online services that failed because of too many
    client accesses. By making clientside programming through JavaScript and designing
    applications appropriately, problems can be avoided. Of course, if correct, a
    JavaScript syntax error could prevent a user from submitting form data, so it''s
    important to design and test JavaScript code with the same rigor as compiled applications.


    Validation of user-entered form data is the most common use of JavaScript by Web
    applications. In this scenario, a number of checks are performed on the fields
    supplied on a HTML form, according to specifications typically supplied by a business
    analyst. For example, name and address fields on a registration form will be subject
    to a number of checks before submission to the server. Some of these checks can
    be performed using HTML, such as setting the size attribute of a text field to
