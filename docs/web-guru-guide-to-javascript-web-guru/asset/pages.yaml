  md: "# Exercise 16.3 – Extracting Cookie Data\n\nAfter you set a cookie—even a temporary\
    \ cookie—you can retrieve the stored data. Although temporary cookies are retrieved\
    \ from the browser's memory and stored cookies are retrieved from the cookie file\
    \ on the user's file system, the method to retrieve cookie data is:\n\n+   1.\
    \ Call `document.cookie`.\n2. Find where the cookie you want to work with is located\
    \ in the list of stored cookies.\n3. Extract the cookie by name.\n4. Extract and\
    \ decode the associated data for that cookie.\n\nCookie data retrieved using JavaScript\
    \ is returned as a single string, which contains the name/data pairs of all of\
    \ the cookies set for the current domain. Although JavaScript stores additional\
    \ parameters for cookies, you can only get the data associated with a named cookie.\
    \ You cannot examine the other parameters. These parameters are used by and only\
    \ available to the browser.\n\nLike the cookie parameters themselves, name/data\
    \ pairs are separated with a semicolon and a space, as in the following example:\n\
    `userName=WilliamS;currentItems=A557324B5558902`\n\nJavaScript does not have a\
    \ built-in function to parse the cookie data string and break it into name/data\
    \ pairs. This means you will need to perform a complex manipulation of the cookie\
    \ data string to get the actual name/data pair you want to work with. Rather than\
    \ writing code every time you work with cookies, you should create a general-purpose\
    \ cookie retrieval function and then use this function whenever you need to extract\
    \ cookie data.\n\nExhibit 16.7 provides a function `getCookie()`. If you follow\
    \ the logic of this function, you can see how cookie data is extracted. As you\
    \ can see, there are actually two functions. The second function, `cookieValue()`,\
    \ is used by `getCookie()`. These functions are used together to parse the entire\
    \ cookie string; look for an instance of the string you as the cookie name. Once\
    \ the name is found, the function determines where the data for this cookie starts\
    \ and then looks for an instance of the semicolon character to determine where\
    \ the cookie ends. If no semicolon is found, the function considers everything\
    \ after the cookie name and the equal sign to be the cookie data.\n\n# EXHIBIT\
    \ 16.7\n\n```\n//cookieValue() is used with getCookie(); don't\nddirectly\nfunction\
    \ cookieValue(index) {\n  var stringEnd = document.cookie.indexOf(\"\", index);\n\
    \  if (stringEnd == -1)\n    stringEnd = document.cookie.length;\n  return unescape(document.cookie.substring(index,\n\
    \    stringEnd));\n}\n```"
  merge: -1
