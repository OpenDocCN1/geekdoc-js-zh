    # Exercise 9.2 - Precaching and Swapping Images


    Image objects are not as easy to work with as <img> element objects. Before you
    can work with Image objects in scripts, you will need to create instances of the
    images you want to work with in the browser''s memory. Once you have an instance
    of an image in memory, you can then script the image''s properties.


    Like Array, you can create Image objects using the new keyword. The basic syntax
    for creating an Image object is:


    ```

    imageName = new Image(width, height);

    ```


    The two parameters you can pass to the Image object are the pixel width and the
    height of the image. The width and height are optional. They help the browser
    allocate memory for the image.


    Preaching an image is a two-step process. First, you create an instance of an
    Image object, which allocates memory for the image. Second, you tell the browser
    to load the image into the image cache in memory. Consider the following example:


    ```

    theImage = new Image(150,200);

    theImage.src = "tshirt.jpg";

    ```'
