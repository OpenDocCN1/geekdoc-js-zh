  md: "# Exercise 6.3 – Working with arrays\n\none customer's name in a string variable\
    \ called customer1, you would need to enumerate 10 string variables to store customer\
    \ names (customer1,customer2,customer3,...,customer10). With an array, you can\
    \ treat all of customer names as a single object and leave the enumeration to\
    \ a designated subscript. Thus, customer[0], customer[1], and customer[2] would\
    \ refer to the first three customers... Arrays contain a number of different methods:\n\
    \n+   - concat()—Merges two or more arrays into a single array.\n- join()—Takes\
    \ all the elements from one array and inserts them into a string.\n- pop()—Pops\
    \ the last element from an array and returns it to the array.\n- push()—Pushes\
    \ a new element to the end of an array and returns the new length of the array.\n\
    - reverse()—Reverses the order of the array’s.\n- shift()—Pops the first element\
    \ from an array and returns it to the array.\n- unshift()—Pushes a new element\
    \ onto the beginning of array and returns the new length of the array.\n- slice()—Takes\
    \ a range of array members and inserts them into a new array.\n- splice()—Substitutes\
    \ or deletes elements from an array.\n- sort()—Arranges array elements in alphabetical\
    \ order.\n\n# 1 – SORTING AND JOINING ARRAYS\n\nIn your text editor, create a\
