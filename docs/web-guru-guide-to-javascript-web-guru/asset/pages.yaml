    # Exercise 8.2 - Using the Date Object


    In some programming languages, dates are stored as strings in which the day, month,
    and year occupy fixed positions. This makes dates easy to display, but notoriously
    difficult to work with. Typically, date operations might include working out how
    many days are between a start and an end date or converting between different
    time zones. Although you could use the JavaScript substring and pattern-matching
    methods to write your own date-processing classes, these are actually provided
    to you in JavaScript''s Date class. The Date class has methods for getting and
    setting date and time. In addition, it has auxiliary methods for converting dates
    into Greenwich Mean Time (GMT) format and returning the number of milliseconds
    since January 1, 1970, which is used with UNIX systems.


    Instantiating a Date object allows you to access two properties: constructor and
    prototype. You can access the constructor property for a Date object called by
    using the reference date.constructor. Its value will be displayed as function
    Date() { [native code]}. If any public code was involved in the construction of
    the Date object by the constructor function, then it would be displayed. The prototype
    property allows new properties to be inserted into JavaScript objects. For example,
    the statement date.prototype.appName="Internet Banking"; could be used to add
    a property appName to the Date object. Any later instantiation of a Date within
    the local scope would then have the property appName, which could be accessed
    by using the dot operator. For the Date object date, the property appName would
    be accessed by using date.appName. *


    In this exercise, you will create an application that displays the current date
    and time for an account transfer in the browser''s alert window for an Internet
    banking application.


    # STEP 1 - DISPLAYING THE DATE AND TIME


    In this example, you will create a script that displays the current date and time
    in the browser''s status window. First, you need to retrieve the current date
    by instantiating a new Date object and create new variables for the day of the
    week, month, and year for the date and the hours, minutes, and seconds for the
    time. You then need to define two arrays of string literals to store the day and
    month names, respectively, because Date only returns numbers. Note that these
    numbers always start with zero; Sunday represents the zero day and January represents
    the zero month. Finally, the values for the time and date can be assembled and
    displayed using the document.write() method.


    The code for this step is shown in Exhibit 8.3, and the results are shown in Figure
    8.3.'
