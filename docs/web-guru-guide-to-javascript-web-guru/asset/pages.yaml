    # STEP 3 - ADDING THE VALIDATION FUNCTION


    In your text, edit the page you created in the previous step. Add the header-defined
    script shown as Exhibit 17.22. The function is called with an object reference
    to the current form field and a character-type parameter. The object reference
    sets the field you are working with. The character-type parameter is used to set
    a string containing the acceptable characters for the current field. For loops
