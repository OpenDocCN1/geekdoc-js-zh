  md: '# Chapter 15


    # Accessing Browser and Operating System Version Information


    Scripts often need to know more about the browser and computer environment in
    which they are running so that they can tailor content based on that information.
    For example, you may want to display different content to Macintosh users than
    Windows users. Or, you may want to use code that is compatible with one particular
    browser version but incompatible with other browser versions. For example, an
    object property may be compatible with Internet Explorer 4.0 or later but not
    with Netscape Navigator 2 or other browsers. In this case, you would want to ensure
    that the code referencing this object property is only executed when Internet
    Explorer 4.0 or later is being used, and ignored otherwise. JavaScript provides
    objects to help you determine which browser and operating system are being used,
    including navigator and clientInformation.


    The navigator object was first implemented in Netscape Navigator 2. It is supported
    by just about every current browser, including Netscape Navigator 2 and later,
    Internet Explorer 3 and later, Mozilla, and Safari. Internet all support the clientInformation
    object as an alternative to the navigator object. All properties and methods of
    the navigator and clientInformation objects are identical. Although navigator
    is the focus of the discussion in this chapter, all references to the navigator
    object also apply to the clientInformation object.


    # For Your Career


    Because Internet Explorer 3 and later support the navigator object, there is little
    reason to use the clientInformation object. If you are developing JavaScript applications
    strictly for Internet Explorer, you may want to use the Internet Explorer-specific
    clientInformation object. However, only do this when you are certain that all
    users will have Internet Explorer 4.0 or later.'
