    # Directed Graph and Depth-First Search


    **Directed Graph:**

    The data structure is represented by an adjacency matrix (that is, a two-dimensional
    array) and an adjacency list. Each node is called a vertex, and two adjacent nodes
    are called edges.


    **Directed Graph has direction :** A -> B and B -> A are different


    ![](img/4e0bf091f4d81b2977c8fb9210bf9760_202_0.png)


    **1. The adjacency matrix is described above:**

    The total number of vertices is a two-dimensional array size, if have value of
    the edge is **1**, otherwise no value of the edge is **0**.


    | | A | B | C | D | E |

    |---|---|---|---|---|---|

    | A | 0 | 1 | 1 | 1 | 0 |

    | B | 0 | 0 | 1 | 1 | 0 |

    | C | 0 | 0 | 0 | 1 | 0 |

    | D | 0 | 0 | 0 | 0 | 1 |

    | E | 0 | 0 | 0 | 0 | 0 |'
