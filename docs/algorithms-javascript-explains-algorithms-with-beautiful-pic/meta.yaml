  md: "# 1. Create a **TestMaxValue.html** with **Notepad** and open it in your browser.\n\
    \n```\n<script type=\"text/javascript\">\n    function max(arrays) {\n       \
    \ // Maximum initialization value is 0\n        for (var i = 0; i < arrays.length\
    \ - 1; i++) {\n            if (arrays[i] > arrays[i + 1]) { // swap\n        \
    \        var temp = arrays[i];\n                arrays[i] = arrays[i + 1];\n \
    \               arrays[i + 1] = temp;\n            }\n        }\n        var maxValue\
    \ = arrays[arrays.length - 1];\n        return maxValue;\n    }\n\n    ////////////////////testing////////////////////\n\
    \n    var scores = [ 60, 50, 95, 80, 70];\n    var maxValue = max(scores);\n \
    \   document.write(\"maxValue = \" + maxValue);\n\n</script>\n```\n\n# Result:\n\
