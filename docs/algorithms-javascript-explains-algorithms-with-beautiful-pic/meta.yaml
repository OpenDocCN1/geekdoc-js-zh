    \n## Doubly Linked List\n\n### Doubly Linked List:\n\nIt is a chained storage\
    \ structure of a linear table. It is connected by nodes in two directions. Each\
    \ node consists of data, pointing to the previous node and pointing to the next\
    \ node.\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_63_0.png)\n\n### UML Diagram\n\
    \n![](img/4e0bf091f4d81b2977c8fb9210bf9760_63_1.png)\n\n```\nclass Node{\n  constructor(data,\
    \ prev, next){\n    this.data = data;\n    this.prev = prev;\n    this.next =\
    \ next;\n  }\n\n  getData(){\n    return this.data;\n  }\n}\n```\n\n- 1. Doubly\
    \ Linked List **initialization**.\n  Example : Construct a San Francisco subway\
    \ Doubly linked list\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_63_2.png)\n\n\
    ## 2. Create a TestDoubleLink.html with Notepad\n\n```\n<script type=\"text/javascript\"\
