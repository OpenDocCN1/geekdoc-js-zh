  md: '# Dijkstra


    The tricolor flag was originally raised by E.W. Dijkstra, who used the Dutch national
    flag (Dijkstra is Dutch).


    Suppose there is a rope with red, white, and blue flags. At first all the flags
    on the rope are not in order. You need to arrange them in the order of blue ->
    white -> red. How to move them with the least times. you just only do this on
    the rope, and only swap two flags at a time.


    ![](img/4e0bf091f4d81b2977c8fb9210bf9760_239_0.png)


    # Solution:


    Use the char arrays to store the flags. For example, b, w, and r indicate the
    position of blue, white and red flags. The beginning of b and w is 0 of the array,
    and r is at the end of the array.


    +   (1) If the position of w is a blue flag, flags[w] exchange with flags[b].
    And whiteIndex and b is moved backward by 1.


    +   (2) If the position of w is a white flag, w moves backward by 1.


    +   (3) If the position of w is a red flag, flags[w] exchange with flags[r]. r
    moves forward by 1.


    In the end, the flags in front of b are all blue, and the flags behind r are all
    red.'
