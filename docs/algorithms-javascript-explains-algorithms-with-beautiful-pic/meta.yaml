    # Binary Heap Sorting


    **Binary Heap Sorting:**

    The value of the non-terminal node in the binary tree is not greater than the
    value of its left and right child nodes.


    Small top heap : ki <= k2i and ki <= k2i+1

    Big top heap :ki >= k2i and ki >= k2i+1


    Parent node subscript = (i-1)/2

    Left subnode subscript = 2*i+1

    Right subnode subscript = 2*i+2


    **Heap sorting process:**

    1. Build a heap

    2. After outputting the top element of the heap, adjust from top to bottom, compare
    the top element with the root node of its left and right subtrees, and swap the
    smallest element to the top of the heap; then adjust continuously until the leaf
    nodes to get new heap.


