    \ right, rightEndIndex) {\n            var leftEndIndex = right - 1; // End subscript\
    \ on the left\n            var tempIndex = left; // Starting from the left count\n\
    \            var elementNumber = rightEndIndex - left + 1;\n\n            while\
    \ (left <= leftEndIndex && right <= rightEndIndex) {\n                if (array[left]\
