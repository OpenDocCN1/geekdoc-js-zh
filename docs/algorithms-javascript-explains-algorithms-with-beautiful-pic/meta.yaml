  md: '# Maximum Value


    Maximum of Integer Sequences: <img src=''60_50_95_80_70.png''>


    # 1. Algorithmic ideas


    Compare `arrays[i]` with `arrays[i + 1]`, if `arrays[i] > arrays[i + 1]` are exchanged.
    So continue until the last number, `arrays[length - 1]` is the maximum.


    ![](img/4e0bf091f4d81b2977c8fb9210bf9760_5_0.png)'
