    # # Shell Sorting


    **Shell Sorting:** Shell sort is a highly efficient sorting algorithm and is based
    on insertion sort algorithm. This algorithm avoids large shifts as in case of
    insertion sort, if the smaller value is to the far right and has to be moved to
    the far left.


    **Sort the following numbers from small to large by Shell Sorting**


    ![](img/4e0bf091f4d81b2977c8fb9210bf9760_45_0.png)


    **Algorithmic result:** The array is grouped according to a certain increment
    of subscripts, and the insertion of each group is sorted. As the increment decreases
    gradually until the increment is 1, the whole data is grouped and sorted.'
