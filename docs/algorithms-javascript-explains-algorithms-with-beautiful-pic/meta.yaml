  md: "# # Dichotomy Binary Search\n\n**Dichotomy Binary Search:**\nFind the index\
    \ position of a given value from an already ordered array.\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_40_0.png)\n\
    \n+   1. Initialize the lowest index low=0, the highest index high=scores.length-1\n\
    2. Find the searchValue of the middle index mid=(low+high)/2 scores[mid]\n3. Compare\
    \ the scores[mid] with searchValue\n   If the scores[mid]==searchValue print current\
    \ mid index,\n   If scores[mid]>searchValue that the searchValue will be found\
    \ between low and mid-1\n4. And so on. Repeat step 3 until you find searchValue\
    \ or low>=high to terminate the loop."
