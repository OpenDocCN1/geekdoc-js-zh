    \ = 0;\n\n//The mouse moves in four directions: up, left, down, and right. if\
    \ hit the wall go back and select the next forward direction\nfunction visit(i,\
    \ j) {\n    maze[i][j] = 1;\n    if (i == endI && j == endJ) {\n        success\
    \ = 1;\n    }\n    if (success != 1 && maze[i][j + 1] == 0)\n        visit(i,\
