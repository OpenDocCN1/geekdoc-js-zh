    \ j);\n    if (success != 1 && maze[i][j - 1] == 0)\n        visit(i, j - 1);\n\
    \    if (success != 1 && maze[i - 1][j] == 0)\n        visit(i - 1, j);\n    if\
    \ (success != 1)\n        maze[i][j] = 0;\n```"
