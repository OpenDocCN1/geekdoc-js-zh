    \ 70 the index is: 1\n\n## 折半查找（二分查找）\n\n**折半查找（二分查找）：**\n从已排序的数组中找到给定值的索引位置。\n\
    \n![](img/4e0bf091f4d81b2977c8fb9210bf9760_40_0.png)\n\n1.  初始化最低索引 `low=0`，最高索引\
    \ `high=scores.length-1`。\n2.  找到中间索引 `mid=(low+high)/2` 的 `scores[mid]` 作为 `searchValue`。\n\
    3.  将 `scores[mid]` 与 `searchValue` 进行比较。\n    *   如果 `scores[mid]==searchValue`，则打印当前的\
    \ `mid` 索引。\n    *   如果 `scores[mid]>searchValue`，则 `searchValue` 将在 `low` 到 `mid-1`\
    \ 之间被找到。\n4.  依此类推。重复步骤 3，直到找到 `searchValue` 或者 `low>=high` 终止循环。\n\n**示例 1：在以下已排序的数组中查找\
    \ searchValue=40 的索引。**\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_41_0.png)\n\
    \n**示例 2：在以下已排序的数组中查找 searchValue=90 的索引。**\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_42_0.png)\n\
    \n1.  使用**记事本**创建一个 **TestBinarySearch.html** 文件，并在浏览器中打开。\n\n    ```javascript\n\
    \    <script type=\"text/javascript\">\n    class BinarySearch{\n     static search(arrays,\
    \ searchValue) {\n     var low = 0;\n     var high = arrays.length - 1;\n    \
    \ var mid = 0;\n     while (low <= high) {\n     mid = (low + high) / 2;\n   \
    \  if (arrays[mid] == searchValue) {\n     return mid;\n     } else if (arrays[mid]\
    \ < searchValue) {\n     low = mid + 1;\n     } else if (arrays[mid] > searchValue)\
    \ {\n     high = mid - 1;\n     }\n     }\n     return -1;\n     }\n     }\n \
    \    /////////////////testing//////////////\n     var scores = [30, 40, 50, 70,\
    \ 85, 90, 100];\n     var searchValue = 40;\n     var position = BinarySearch.search(scores,\
    \ searchValue);\n     document.write(searchValue + \" position:\" + position);\n\
    \     \n     document.write(\"<br>-----------------------------<br>\");\n    \
    \ \n     searchValue = 90;\n     position = BinarySearch.search(scores, searchValue);\n\
    \     document.write(searchValue + \" position:\" + position);\n     </script>\n\
    \    ```\n\n**结果：**\n\n40 position: 1\n\n90 position: 5\n\n## 希尔排序\n\n**希尔排序：**\
    \ 希尔排序是一种高效的排序算法，基于插入排序算法。该算法避免了插入排序中可能发生的大量数据移动，例如当较小值位于最右侧需要移动到最左侧时的情况。\n\n\
    **通过希尔排序将以下数字从小到大排序**\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_45_0.png)\n\n\
    **算法结果：** 根据下标的特定增量对数组进行分组，并对每组进行插入排序。随着增量逐渐减小直至为1时，整个数据被分组并完成排序。\n\n1.  第一次排序：\n\
