    \n## Binary Heap Sorting\n\n**Binary Heap Sorting:**\nThe value of the non-terminal\
    \ node in the binary tree is not greater than the value of its left and right\
    \ child nodes.\n\nSmall top heap : ki <= k2i and ki <= k2i+1\nBig top heap :ki\
    \ >= k2i and ki >= k2i+2\n\nParent node subscript = (i-1)/2\nLeft subnode subscript\
    \ = 2*i+1\nRight subnode subscript = 2*i+2\n\n**Heap sorting process:**\n1. Build\
    \ a heap\n2. After outputting the top element of the heap, adjust from top to\
    \ bottom, compare the top element with the root node of its left and right subtrees,\
    \ and swap the smallest element to the top of the heap; then adjust continuously\
    \ until the leaf nodes to get new heap.\n\n## 1. {10, 90, 20, 80, 30, 70, 40,\
    \ 60, 50} build heap and then heap sort output.\n\nInitialize the heap and build\
    \ the heap\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_173_0.png)\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_174_0.png)\n\
    \nNot Leaf Node = 80 > left = 60 , 80 > right = 50 No need to move\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_174_1.png)\n\
    \nNot Leaf Node = 20 < left = 70 , 70 > right = 40 , 20 swap with 70\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_175_0.png)\n\
    \nNot Leaf Node = 90 > left = 80 , 80 > right = 30 No need to move\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_175_1.png)\n\
    \nNot Leaf Node = 10 < left = 90 , 90 > right = 70 , 10 swap with 90\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_176_0.png)\n\
    \nStill Not Leaf Node = 10 < left = 80 , 80 > right = 30 , 10 swap with 80\n\n\
    ![](img/4e0bf091f4d81b2977c8fb9210bf9760_176_1.png)\n\nStill Not Leaf Node = 10\
