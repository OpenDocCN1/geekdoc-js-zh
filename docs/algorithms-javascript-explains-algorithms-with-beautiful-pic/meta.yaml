    \ of Hanoi\n\nThe Hanoi Tower that a Frenchman M. Claus (Lucas) from Thailand\
    \ to France in 1883. Hanoi Tower which is supported by three diamond Pillars.\
    \ At the beginning, God placed 64 gold discs from top to bottom on the first Pillar.\
    \ God ordered the monks to move all gold discs from the first Pillar to the third\
    \ Pillar. The principle of large plates under small plates during the handling\
    \ process. If only one plate is moved daily, the tower will be destroyed. when\
    \ all the discs are moved that is the end of the world.\n\n## Let's turn this\
    \ story into an algorithm:\n\n* Mark the three columns as ABC.\n\n- **1**. If\
    \ there is only one disc, move it directly to C (**A->C**).\n- **2**. When there\
    \ are two discs, use B as an auxiliary (**A->B**, **A->C**, **B->C**).\n- **3**.\
    \ If there are more than two discs, use B as an auxiliary(**A->B**, **A->C**,\
    \ **B->C**), and continue to recursive process.\n\n**1. If there is only one disc,\
    \ move it directly to C (A->C).**\n\n![](img/4e0bf091f4d81b2977c8fb9210bf9760_232_0.png)\n\
    \n2. When there are two discs, use B as an auxiliary (**A->B, A->C,B->C**).\n\n\
    ![](img/4e0bf091f4d81b2977c8fb9210bf9760_233_0.png)\n\n**3. If more than two discs,\
    \ use B as an auxiliary, and continue to recursive process.**\n\n## 1. Create\
    \ a TowersofHanoi.html with Notepad and open it in your browser.\n\n```\n<script\
    \ type=\"text/javascript\">\n    function hanoi(n, A, B, C) {\n        if (n ==\
    \ 1) {\n            document.write(\"Move \" + n + \" \"+A + \" to \" + C + \"\
