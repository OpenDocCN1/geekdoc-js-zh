    in technology or computer science.• Apply for jobs.Big Data Jobs• Data scientist.•
    Data analyst.• Data engineer or data architect.• MI or BI analyst.• Machine learning
    or AI engineer.• Quantitative analyst or statistician.Common Data Types• Boolean
    (true or false)• Character (a, b, c...)• Date (03/01/2021...)• Double (1.54343534532e308)•
    Floating-point number (1.234455)• Integer (1234....)Free Database Management Software•
    Microsoft SQL server.• SolarWinds.• Dbvisualizer.• Manageengine applications manager.•
    Oracle rdbms.• Ibm db2.• Teradata.Data StrategyData Strategy, Information, Decisions,
    Growth, Success, Wealth...This is how organisations use data.Data Analytics (Charts
    & Dashboards)Data produced by the data management team helps the analytics teams
    to create dashboards which helps drive the business and ensures that business
    intelligence is one of the key components of competitive advantage for the organisation.
    The analytics teams will receive the dashboards requirement from the business
    units and request the data from the data management team. After a dashboard is
    created, the analytics team will maintain dashboards and the data management team
    will maintain the data feeding the dashboards. The data requirements for dashboard
    creation can be either from internal analytics teams or business units across
    the organisation. The key goal of the data management team is to support the analytics
    team to produce as many dashboards possible depending on resources available (money,
    material, machine, and manpower).AutomationData processes for new dashboards will
    be optimized and automated after the project ends, provided that the output adds
    value to the organisation.Reliability and TrackingThe number of outputs produced
    should be benchmarked across all teams and business units to ensure that the team
    is sustainable, consistent, and reliable.Agile  (Project Management Methodology)The
    data management team will receive 90% of the projects from the analytics team.
    After requirements are received, the team will use the Agile method to complete
    the task as soon as possible. This entails braking down the tasks into smaller
    milestones then completing the milestones in 2-weeks sprints. Both failed and
    successful projects will be counted as part of the 90%.Quality Assurance & ControlThe
    data management team will be responsible of quality monitoring during the project
    implementation phase and after automation. Data quality compliance will be completed
    by the data management team.Components of SuccessEmployment, Business, Resources,
    Information, Growth, Success, Wealth...
