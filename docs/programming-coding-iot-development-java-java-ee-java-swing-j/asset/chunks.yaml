- fmt: "\n# How to influence people\n- Turn on your charm (emphathize).\n- Listen\
    \ to people.\n- Take note of what people want.\n- Add value to people’s lives.\n\
    - Be very good at conflict resolution.\n\n## Rules of Negotiation\n- Listen more\
    \ than you talk.\n- Use the power of silence.\n- Ask questions.\n- Be fair.\n\
    - Know what you want before negotiating.\n- Aim for a Win/Win negotiation.\n-\
    \ Learn conflict resolution strategies.\n- Be prepared.\n- Have a strategy.\n\
    - Keep it simple.\n\n## Critical Thinking\nThink, Plan, Prioritize...\nIf you\
    \ fail to plan, you are planning to fail - Benjamin Franklin.\n\nThinking is a\
    \ mental activity to process information, make connections, decisions, and create\
    \ new ideas. Thinking can also be thought of as a process of making a to-do list\
    \ in your mind. Thinking is the first step towards success. There are too many\
    \ things to do in life but only 20 percent of those things will bring success\
    \ and because of this everyone has to think and prioritize accordingly before\
    \ acting. When taking action, start with those activities that bring success.\
    \ Every thought has to be written down. This helps with manifestation, thought\
    \ analysis and planning.\n\n### Critical Thinking\nCritical thinking is the ability\
    \ to follow logic clearly and rationally about what to do or what to believe.\
    \ It is the ability to engage in reflective thinking, understand the logical connections\
    \ between ideas, and understand the where, how, when, what, and why things are\
    \ the way they are. It is about asking as many questions as possible until you\
    \ get all the information you need. Information leads to growth, growth leads\
    \ to success and success leads to wealth.\n\nCritical thinking helps with good\
    \ decision-making. You must be able to weigh up the pros and cons of solutions\
    \ to problems. You must look at all the data available and make an informed decision\
    \ by weighing the pros and cons based on the data given. Big data is popular because\
    \ of this reason. Managers can make good decisions by using big data.\n\n### Make\
    \ a to-do list\nYou should be able to determine the what, when, why, where and\
    \ how things will happen. This is called scheduling. Failure to do so can lead\
    \ to disaster, plain and simple. Write every single detail down. Have a to-do\
    \ list, a task calendar and a checklist for every milestone. This will help with\
    \ task manifestation, visualization of the implementation process and analysing\
    \ problems.\n\n### Risk Management\nYou must be able to plan for and manage things\
    \ going wrong. Things usually go wrong in life, it is a given. This is because\
    \ unlike plans, life is time-sensitive and a simple thing as late delivery can\
    \ cause a huge disaster. You must anticipate what can go wrong and plan for what\
    \ to do in that case. That’s what risk management involves.\n\n### How to think\
    \ critically\n- Restructure information.\n- Evaluate consequences.\n- Ask questions.\n\
    - Be observant.\n- Read every day.\n- Look at historical data.\n- Research.\n\
    - Look for facts, numbers or science.\n- Be analytical, break down information.\n\
    \n### Critical Thinking Process\n- Observe\n- Investigate\n- Analyze\n- Interpret\n\
    - Evaluate\n- Reflect\n\n## Decision Making & Problem Solving\nProblem, Information,\
    \ Decision, Growth, Success and Wealth...\nFailure is an opportunity to learn.\n\
    \nProblem-solving is the act of defining a problem, determining the root cause\
    \ of the problem and finding a solution. The more problems you solve, the richer\
    \ and more successful you become.\n\n### Problem-solving process\n- Describe the\
    \ problem.\n- Break down the problem.\n- Find the root cause.\n- Research and\
    \ read until you find a solution.\n- Implement the solution.\n- Measure the results.\n\
    \n### Problem-solving skills\n- Active listening.\n- Critical and creative thinking.\n\
    - Research and reading.\n- Communication.\n- Decision-making.\n- Team-work.\n\n\
    ### Decision-making\nDecision-making is the process of gathering information,\
    \ assessing the consequences and choosing an option with fewer negative consequences.\
    \ A good decision-maker chooses actions that give the best outcome for everyone.\
    \ They research, weigh consequences and make rational decisions while keeping\
    \ an open mind.\n\n### Decision making process\n- Identify alternatives.\n- Gather\
    \ relevant information.\n- Weigh the consequences.\n- Choose.\n- Take action.\n\
    - Review your decision.\n\n### Creative thinking\nCreative thinking is the ability\
    \ to consider something in a new way such as having a new approach to a problem\
    \ or a new result from a data set. It is a process in which your mind generates\
    \ a new, unusual and productive solution to a problem.\n\n### How to develop creative\
    \ thinking\n- Brainstorm ideas.\n- Reframe the problem.\n- Be open-minded and\
    \ flexible.\n- Use your imagination.\n\n### Ways to improve your memory\n- Read\
    \ books.\n- Try Fish Oil Supplements (Omega 3).\n- Maintain a Healthy Weight.\n\
    - Drink Less Alcohol.\n- Exercise.\n- Give meditation a try.\n- Drink coffee.\n\
    - Sleep enough.\n- Eat Less Added Sugar.\n\n## Technical Skills\n- Programming/Coding.\n\
    - Software proficiency.\n- Project management.\n- Data analysis.\n- Technology.\n\
    - Writing.\n- Accounting.\n- Engineering.\n- Medicine.\n- Problem-Solving.\n\n\
    ## Interpersonal Skills\n- Teamwork.\n- Communication.\n- Work Ethic.\n- Flexibility\
    \ and Adaptability.\n- Decision-making.\n- Time Management.\n- Conflict resolution.\n\
    - Listening.\n- Negotiation.\n- Empathy.\n- Assertiveness.\n- Coaching, teaching,\
    \ and mentoring.\n\n## Public Speaking\nInformation, Confidence, Public Speaking,\
    \ Money, Growth, Success, Wealth...\nPractice, Practice, Practice.\n\n### Rules\
    \ of public speaking\n- Research and know everything about your topic.\n- Plan\
    \ and prepare your presentation.\n- Practice until you feel confident.\n- Read\
    \ about your specific worries.\n- Visualize your success.\n- Do some deep breathing.\n\
    - Focus on your presentation, not on your audience.\n- Don't fear a moment of\
    \ silence.\n- Pay attention to your body language.\n- Drink a glass on alcohol\
    \ before the speech.\n- Don't drink caffeine on the day of the speech.\n- Think\
    \ positively.\n- Watch recordings of your speeches.\n- Keep it simple.\n- Don’t\
    \ worry about eye contact with your audience.\n- Don’t worry about your weaknesses.\n\
    - You don’t have to tell stories.\n- Organize ideas logically.\n- Practice brings\
    \ confidence.\n- Research the topic until you are passionate.\n- Be yourself.\n\
    - Slow down.\n- Always tell the truth.\n- Forgive yourself for your mistakes.\n\
    - Study your audience.\n- Define the objective of the presentation.\n- Prepare\
    \ the objectives, introduction & conclusion.\n- Keep a conversational tone.\n\n\
    ### Time your speech\n- Practice and research your topic like crazy.\n- Ask people\
    \ for feedback.\n- Move around the stage.\n- Breathe slowly.\n- Use your voice\
    \ aptly.\n- Rehearse, rehearse.\n- Avoid overuse of animations.\n- PowerPoint\
    \ presentation should have 10 slides.\n- Presentation should be 20 minutes.\n\
    - Font should be larger than 30 points.\n- Arrive early.\n- Stretch your body\
    \ before the presentation.\n- Visit the venue before the presentation.\n- Finish\
    \ on time.\n- Use as few words as possible on each slide.\n- Pay attention to\
    \ your body language.\n- If you forget something just skip it.\n- Learn how to\
    \ use the technology you will using.\n- Don’t focus on the audiences.\n- Take\
    \ an online speaking course.\n- Watch other speeches.\n- Use a mantra to boost\
    \ your confidence.\n\n### Types of speeches\n- Informative speech.\n- Entertaining\
    \ speech.\n- Demonstrative speech.\n- Persuasive speech.\n- Special occasion speech.\n\
    - Pitch speech.\n\n### Four speaking skills\n- Fluency.\n- Vocabulary.\n- Pronunciation.\n\
    \n## Negotiation\n- Everything is negotiable.\n- Know what you want before negotiating.\n\
    - Aim for a win/win outcome.\n- Don't take things personally.\n- Use the power\
    \ of silence.\n- Put a fair offer on the table.\n- Walk away if the offer is not\
    \ fair.\n- Don't make assumptions, ask questions.\n- Don't rush, be patient.\n\
    - Don't accept a bad deal.\n- Don't over negotiate.\n- Don't let your emotions\
    \ get the best of you.\n- Don't take shortcuts.\n- Research before negotiating.\n\
    - Do your homework.\n- Negotiate each part separately.\n- Provide fair alternatives.\n\
    - Build a relationship.\n- Think from different perspectives.\n- Draw attention\
    \ to unique features.\n\n### Stages Of The Negotiation Process\n- Identifying\
    \ the purpose of the negotiation.\n- Preparation.\n- Information exchange.\n-\
    \ Bargaining.\n- Conclusion.\n\n### Benefits Of Negotiation Skills\n- Professional\
    \ development and career growth.\n- Conflict resolution.\n- Problem solving.\n\
    - Communication.\n- Persuasion.\n- Selling.\n- Teamwork.\n\n## Communication\n\
    Information, Communication, Growth, Success and Wealth...\nListen... Listen...\n\
    Being able to communicate effectively and efficiently is one of the most important\
    \ skills for success. When you are communicating make sure your message is clear,\
    \ concise, concrete, correct, and courteous. These are called the seven Cs of\
    \ communication. Effective communication is less about talking and more about\
    \ listening. Listening means understanding the words or the information being\
    \ communicated, and also understanding the emotions the speaker is trying to convey.\
    \ Being able to communicate effectively is perhaps the most important of life\
    \ skills because it enables us to pass information to other people and understand\
    \ what is said. Information is the center of success because information leads\
    \ to growth and continuous growth leads to success, therefore, being able to receive\
    \ and communicate information is one of the keys to success.\n\n### Communication\
    \ Failure\nCommunication failure is a message that is misleading, ineffective,\
    \ or offensive. Never communicate to cause harm, communicate to gain growth. If\
    \ you are angry and feel like saying hurtful things to someone, just walk away\
    \ and remember the emotional intelligence you will learn in this book. Remember,\
    \ to be successful, you need all the information you can get and communication\
    \ is one of the key strategies to get information. The dangerous thing about information\
    \ is that information causes emotions and if you are not good at controlling emotions\
    \ then you will be in trouble. The trick is, for you to control your emotions\
    \ you need more information.\n\n### Skills For being a good communicator\n- Listening.\n\
    - Body language.\n- Stress management.\n- Emotion control.\n- Clarity and Concision.\n\
    - Confidence.\n- Empathy.\n- Open-Mindness.\n- Respect.\n\n### How To Deliver\
    \ Bad News\n- Make eye contact.\n- Try to be neutral.\n- Be prepared.\n- Use facts.\n\
    - Don't negotiate.\n\n### Elements of a Report Writing\n- Title page.\n- Table\
    \ of contents.\n- Executive summary.\n- Introduction.\n- Discussion.\n- Conclusion.\n\
    - Recommendations.\n- References.\n\n### Characteristics of a Good Report\n- Simplicity.\n\
    - Clarity\n- Concise.\n- Positive.\n- Punctuation.\n- Approach.\n- Readability.\n\
    - Accuracy.\n\n## Listening\nCommunication, Listening, Information, Growth, Success\
    \ and Wealth...\nDo not interrupt.\nListening is the ability to accurately receive\
    \ and interpret the message being communicated to you. Listening is key to all\
    \ effective and efficient communication. Without the ability to listen effectively,\
    \ messages are easily misunderstood and information is lost. Without information,\
    \ success is not easy to achieve. Listening is one communication skill you should\
    \ master if you want to be successful. Effective listening helps to resolve conflicts,\
    \ build trust, inspire people, increases productivity, and increases growth. Spend\
    \ most of your conversations listening and you'll absorb information, become a\
    \ good communicator and make good decisions.\n\n### How to listen\nPay attention\
    \ to the speaker's verbal and non-verbal language to fully understand what they're\
    \ expressing to you. Paying attention means listening and observing the speaker\
    \ without interrupting. Do not interrupt the speaker for any reason. If you want\
    \ to say something, wait until the speaker is done talking then you can talk.\
    \ Listening effectively means listening to key points of the speaker's message\
    \ and taking notes mentally or otherwise.\n\n### Listening and problem solving\n\
    If someone is asking you a serious question or they want your advice, listen attentively,\
    \ do not rush to respond, try not to respond immediately and think for a day or\
    \ two about what the speaker was saying then respond. Thinking takes time, energy,\
    \ and effort. Don't be quick to respond. Just tell the speaker that you want time\
    \ to process what they said and you will get back to them. This strategy works\
    \ in every situation even if you don't need to think just take time to think.\
    \ You will make wise decisions if you take your time to think.\n\n### Active listening\n\
    Active listening is a technique that requires the listener to fully concentrate,\
    \ understand, and remember what is being said. You have to empathize, reflect\
    \ and take key points of what is being communicated to you. Active listening is\
    \ used in counseling, training, and solving disputes or conflicts. You can solve\
    \ many problems by just listening attentively without even responding. This is\
    \ called the rubber duck effect.\n\n### Barriers to Listening\nListening is a\
    \ very challenging skill because are always distractions that interfere with the\
    \ message being communicated. Distractions to the speaker's message include internal\
    \ thoughts, lack of focus, sounds in the surrounding environment, or biased listening.\
    \ Biased listening or selective listening is one of the biggest problems in communication.\
    \ Biased listening is when someone is just listening for information they want\
    \ to hear.\n\n### Key listening techniques\n- Pay Attention.\n- Paraphrase and\
    \ summarize.\n- Don't judge or jump to conclusions.\n- Show that you're listening\
    \ by nodding.\n- Don't interrupt the speaker no matter what.\n- Ask questions.\n\
    - Look at the body language.\n- Focus.\n\n## Coaching\nGoals, Milestones, Coaching,\
    \ Teaching, Growth, Success...\nGive the right information at the right time.\n\
    Coaching aims to improve performance and focuses on the current challenges rather\
    \ than the distant past or future.\n\n### Key Coaching Skills\n- Goal-setting.\n\
    - Listening.\n- Empathizing.\n- Critical thinking.\n- Giving feedback.\n- Subject\
    \ knowledge and experience.\n- Inspiration.\n- Communication skills.\n- Self-awareness.\n\
    - Open-mindedness & creativity.\n- Flexibility & dependability.\n\n### Leadership\
    \ Styles\n- Transactional leadership.\n- Transformational leadership.\n- Servant\
    \ leadership.\n- Democratic leadership.\n- Autocratic leadership.\n- Laissez-faire\
    \ leadership.\n- Charismatic leadership.\n- Visionary leadership.\n- Affiliative\
    \ leadership.\n- Paces leadership.\n- Coaching leadership.\n\n## Teaching\nTeaching\
    \ is the process of helping people understand and apply knowledge, concepts, and\
    \ processes. Managers have to teach, mentor and coach people how to reach their\
    \ goals.\n\n### Qualities Of A Good Teacher\n- Communication skills.\n- Listening\
    \ skills.\n- Friendly attitude.\n- Strong work ethic.\n- Organizational skills.\n\
    - Patience.\n- Creativity.\n- Enthusiasm.\n- Confidence.\n- Dedication.\n- Empathy.\n\
    - Leadership skills.\n- Knowledge of subject matter.\n\n### Principles Of Teaching\n\
    - Encourage both teamwork and individual work.\n- Active learning.\n- Give feedback.\n\
    - Communicate expectations.\n- Respect diverse talents.\n\n### How To Teach\n\
    - Show people exactly what to do.\n- Help fix mistakes.\n- Provide feedback.\n\
    - Use experiential learning.\n- Recommend books.\n\n### Types Of Learning\n- Learn\
    \ by listening and speaking.\n- Learn by watching.\n- Learn by touching or feeling.\n\
    - Learn by reading.\n\n### How To Memorize Information\n- Memorize keywords.\n\
    - Memorize rhythm or rhyme.\n- Use acronyms.\n- Look at pictures or patterns.\n\
    - Categorize information.\n- Use numbers.\n\n### The Reading Process\n- Finding\
    \ the main idea.\n- Understanding words.\n- Finding similarities and differences..\n\
    \n## Mentoring\nMentoring is the sharing of information between people with the\
    \ goal of professional and personal development. The mentor usually shares information,\
    \ experience, and advice with a less experienced person (mentee).\n\n### Types\
    \ Of Mentoring\n- One-on-one mentoring.\n- Distance mentoring.\n- Group mentoring.\n\
    - Situational mentoring.\n- Developmental and career mentoring.\n- Peer-based\
    \ mentoring.\n\n### Qualities Of A Good Mentor\n- Good listener.\n- Flexible.\n\
    - Values different perspectives.\n- Knowledgeable.\n- Non-judgmental.\n- Able\
    \ to give feedback.\n- Honest.\n- Resourceful.\n- Good leadership and management\
    \ skills.\n\n### Benefits Of Being A Mentor\n- Increased self-confidence.\n- Increased\
    \ self-awareness.\n- Leadership skill development.\n- Strong communication skills.\n\
    - Increased listening skills.\n- Increased patience.\n- Increased people skills.\n\
    \n## Talent\nInformation, Skill, Excellence, Talent, Growth, Success, Wealth...\n\
    Everyone has talent. Talent is a natural aptitude. Your talent is determined by\
    \ the way you think, feel and behave. That’s why it is said talent is a natural\
    \ thing because you already have it, you are already thinking, feeling and behaving\
    \ in a certain way. You were not born with it, but you already have it. Your thoughts,\
    \ feelings and behaviour give you the potential to do and become anything. After\
    \ you tried many things and you find that one thing you excel in then you have\
    \ found your talent. Your talent can grow and change into something good bigger\
    \ or something bad depending on what kind of information you acquire along the\
    \ way. This is because talent is a result of the information you have in your\
    \ mind. Thoughts, feelings and behaviour are a by-product of information you acquire,\
    \ therefore, information gives rise to talent. You process information according\
    \ to what you know to be true about the world at that particular point in time\
    \ and this is why everyone has their own talent. Everyone starts acquiring information\
    \ from the moment they are born, from the sound they hear, the smell, everything\
    \ you can sense gives you information. This is why everyone has talent because\
    \ everyone has information in their head already. No one was born with information,\
    \ but everyone acquired information from the moment they were born, intentionally\
    \ and unintentionally, consciously and unconsciously, directly and indirectly.\
    \ However, some people have not figured out their talent. The easiest way to figure\
