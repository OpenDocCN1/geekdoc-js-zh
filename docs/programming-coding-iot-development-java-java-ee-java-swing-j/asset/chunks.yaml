    # 如何成为一名优秀的领导


    ## 实践个人成长。

    - 成为一名优秀的团队成员。

    - 每天阅读。

    - 提供愿景。

    - 改进组织结构。

    - 设定清晰的沟通协议。

    - 授权。

    - 学习冲突管理策略。

    - 教练、指导和教学。

    - 诚实且开放地沟通。

    - 鼓励人们阅读。

    - 培养积极的态度。

    - 设定明确的目标和预期。

    - 关注结果而非过程。

    - 建立自信。

    - 回答问题。

    - 准确地告诉人们你希望他们做什么。

    - 不要让人们过度工作。

    - 以身作则。

    - 不要生气，只需重复你说过的话。


    ## 如何成为一名优秀的团队成员

    - 分享信息（提问和回答问题）。

    - 关注目标和结果，而不是过程。

    - 公平、积极且支持。

    - 欣赏多样性的益处。

    - 学习领导技能。

    - 保持条理。

    - 设定明确的目标。

    - 拥有强大的核心价值观。

    - 支持承担风险和改变。

    - 为每个团队成员设定清晰、明确的角色。

    - 鼓励多元化思维。

    - 均匀分配工作。

    - 关注正确的事。不要偏袒。


    ## 核心团队技能

    - 沟通。

    - 冲突解决。

    - 解决问题。

    - 倾听。

    - 批判性思维。

    - 协作。

    - 领导力。

    - 谈判。


    ## 如何教学、指导和教练

    - 鼓励积极学习。

    - 给出建设性反馈。

    - 尊重不同的天赋和学习方式。

    - 善倾听并理解。

    - 保持耐心。

    - 多读书。

    - 不做评判。

    - 对不同意见保持开放。

    - 提供示例和观点。

    - 回答问题。

    - 提出开放式问题。

    - 学习情感智能。


    ## 领导与管理风格

    - 专制型领导。

    - 权威型领导。

    - 标杆型领导。

    - 亲和力型领导。

    - 放任型或自由放任型领导。

    - 参与型领导。

    - 授权型领导。

    - 交易型领导。

    - 变革型领导。

    - 官僚型领导。

    - 魅力型领导。

    - 教练型领导。

    - 民主型领导。

    - 协作型领导。

    - 指挥型领导。

    - 愿景型领导。


    ## 核心领导特质

    - 自我。

    - 团队发展。

    - 伦理实践与良好治理。

    - 创新。

    - 沟通。

    - 愿景。

    - 共情心。

    - 责任感。

    - 感恩。

    - 慈悲。

    - 信心。

    - 决策。

    - 诚信。

    - 谦逊。

    - 韧性。

    - 影响力。

    - 积极。

    - 灵感。

    - 战略性与批判性思维。

    - 开放心态与创造力。

    - 灵活性。

    - 可靠。

    - 诚实。

    - 忠诚。

    - 印象管理。

    - 果断。

    - 倾听。

    - 给予反馈。

    - 时间管理。

    - 计划与执行。

    - 组织与授权。

    - 激励。

    - 智力。

    - 相关知识。


    ## 管理

    时间、技术、管理、生产力、增长、成功、财富……


    领导力让人感觉更好，而管理则解决问题。你需要这两项技能。


    成功是在你生活的各个领域持续获得最佳结果的能力。成功带来财富。成功来自持续的增长，而增长由信息带来。为了获取信息，你需要五种主要资源：时间、金、能量、技术和人。每个人都有这五种资源，无论多少。数量并不重要，重要的是你如何利用这些资源来实现成功。


    要成功地使用这五种资源，你需要两种技能：管理和领导力。领导技能帮助你有效高效地处理人际关系，让你从人们那里获得你想要的所有信息。管理技能帮助你有效高效地使用其他四种资源（时间、金、能量和技术），让你从这些其他资源中获得你想要的所有信息。


    ### 管理

    管理你的资源意味着规划、组织、设计和控制你的资源（时间、金、能量和技术）。规划包括设定目标并决定用于实现目标的策略。组织包括安排你的资源（时间、金、能量和技术）以实现目标。


    建立战略意图。战略意图是你为了实现根本目标而计划在未来实现。


    愿景、使命和价值观声明是用于设定战略意图的工具。你的愿景解释了你想变成什么。你的使命声明解释了为了成为未来想要的样子，现在应该是什么，它解释了你将如何为生活带来改变。价值观是你为了支持愿景和使命必须遵循的行为。目标是为了交付使命和愿景而必须采取行动。你必须制定战略愿景，设定目标，设计实现目标的策略，实施并执行所选策略，评估绩效并启动性调整。


    #### 管理的四个核心职责

    - 规划

    - 组织

    - 设计

    - 控制


    ### 管理规则

    - 明确你的目标并分享你的愿景。

    - 为人们制定一份路线图。

    - 教学并以身作则。

    - 教学并授权。

    - 帮助人们解决问题。

    - 花大部分时间在规划上。

    - 保持一致。

    - 保持透明。

    - 认可所有的意见和想法。

    - 对每个人采取不同的对待。


    ## 权力

    影响力、领导力、管理、人、信息和成功……


    权力随着巨大的责任。权力是采取行动并对他产生影响的能力，无论是通过礼貌还是攻击的方式。你可以通过成为优秀的领导者以礼貌的方式影响人们。优秀的领导者每天阅读并成长。糟糕的领导者具有攻击性且强势，通常是因为管理地位。


    影响他人并对他拥有权力是一项非常有挑战性的任务，因为人有情感，如果他们被对待不好，就会报复。真正的权力和来自于学习人们的情感，掌握沟通艺术，并加倍努力人们拥有的不同观点。要影响他人，你必须擅长满足人们的需求。如果人们从你那里获得了价值，他们通常会听你的，因此，如果你帮助人们满足需求，你就为他们的生活增加了价值，从而能够影响他们。


    要影响他人并对他拥有权力，你必须拥有他们需要的东西。某些为他们的生活增加价值的东西。如果人们对你一无要求，你就没有权力。人们生活中需要的一些包括金钱、时间和信息。如果你能为这些人提供资源，你就可以影响他们。这是因为这些资源是成功的要素，而每个人都想成功。


    ### 权力原则

    - 始终留有一笔钱备不时需。

    - 阅读比你认识的所有人都多。

    - 少说多想。

    - 不要表现出情感。

    - 用金钱买时间。

    - 不要信任任何人。

    - 提高你的时间管理技能。

    - 计算一切。

    - 不要试图给他人留下印象，关注正确的事。

    - 每天运动。


