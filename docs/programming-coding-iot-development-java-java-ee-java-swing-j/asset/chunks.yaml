    # 1. 他们想确认关于“你是最佳候选人”的想法。


    请记住，公司团队中有一个他们试图填补的空缺，而且他们已经对想要找的人才有了心理预期。好消息是，如果他们约你参加面试，意味着他们认为你具备他们所寻找的人格，因此他们想通过问你一系列问题来确认他们的想法。


    这些问题构成了面试，根据公司认为对于那个特定的“空缺”什么更重要，它们可能是行为类问题，也可能是胜任类问题。因此，了解他们正在寻找什么样的候选人并据此展示自己至关重要，以便让他们看到你正是他们正在寻找的那个人。


    要做到这一点，请研究公司对该职位的要求，并将其与你的技能、资和经验相匹配；例如，如果公司需要某些 `SQL` 经验，请检查你的简历中是否包含 `SQL`。这将帮助你理解他们正在寻找什么样的人，以及你距离那个目标还有多远。


    如果你觉得自己不具备他们寻找的大部分要求，请记住一点：他们已经知道你不具备他们寻找的素质，但他们仍然认为你是这份工作的最佳人选，所以只需为面试做好充分准备，就不会出错。


    # 2. 他们希望你支持并为你你在简历中所陈的内容提供证据


    '
- fmt: "\nThis is the most important reason for an interview. All your interview answers\
    \ should be about evidence (success stories). Remember, a CV is a very summary\
    \ of your life, so they want you to elaborate on that. For example, if they ask\
    \ you why should we hire you, they already saw from your CV that you have experience\
    \ in that particular field and they know that is why they need to hire you but\
    \ they just want you to support that experience with success stories (evidence)\
    \ and if possible to give hard evidence. Don’t worry if you don’t have written\
    \ proof to support some of the skills and//or experience on your CV, the most\
    \ common way to support your claims is to tell success stories, which is all the\
    \ evidence they need. You will see in the questions below how easy it is to support\
    \ your answers with success stories but first, let us look at the structure of\
    \ interviews. \n\n# Types of Job Interviews\n\n## Telephone interview\nSometimes\
    \ this is used as part of recruitment processes in which if you pass the phone\
    \ interview then you will be invited to meet for another interview. Handle every\
    \ telephone interview in the same professional manner as any other interview.\
    \ Start by answering your phone professionally. Don’t be too fancy, a genuine\
    \ hello will suffice. Just like your email address, your voice mail message/answering\
    \ machine should be professional.\n\n## Face-to-face interview\nThis can also\
    \ be a part of the recruitment processes in which if you pass it then you will\
    \ be invited to meet for another interview, usually a panel interview, or you\
    \ can be called for an assessment test. Be professional and prepare for it thoroughly.\
    \ Some companies do not have a long recruitment process and this may be the only\
    \ interview that you attend after which you get a job offer. Well, hopefully.\n\
    \n# Preparing for an Interview\nLet everything revolve around your skills, qualifications\
    \ and experience\n\n### Researching the company\nWhen you research the company,\
    \ don’t just browse through their website, go deeper than that. This will help\
    \ you answer your questions appropriately and will help you show your interest\
    \ in the company which will make you stand out from other candidates who didn’t\
    \ invest time in their research. Researching the company will also help you prepare\
    \ your questions for the interviewer. \n\n### Matching skills, qualifications\
    \ and experience to the job post\nThis is a very important part of preparing for\
    \ an interview as questions will revolve around the job requirements and duties.\
    \ Interviewers will ask questions to see if you have the required characteristics\
    \ and to see if you will be able to carry out the duties. Matching your skills\
    \ and qualification to the job’s requirements and duties will give you a good\
    \ sense of what characteristics the recruiter is looking for and what duties will\
    \ you be required to do. This will help you know which of the required characteristics\
    \ do you have, and which ones don’t you have so that you can start doing your\
    \ research and studying those characteristics that you don’t have. The trick here\
    \ is, never lie to the interviewer about characteristics you don’t have; be honest\
    \ and tell them that you will do everything in your power to learn.\n\nThere are\
    \ countless books written about these skills, make sure that you read the books\
    \ on a daily basis for self-improvement and development. If you haven’t had time\
    \ to read the books the read at least one article about each of these skills before\
    \ an interview. Remember these are just common skills, there are more specific\
    \ skills that a company will require e.g. advanced excel.\n\n### Research the\
    \ job post\nMake sure you know everything about the job duties written in the\
    \ post. The questions will be centered on the duties and sometimes recruiters\
    \ can ask very specific and challenging questions, e.g., say one of the requirements\
    \ is knowledge of `AWS`, the recruiter might ask, what is the output voltage of\
    \ the `AWS` motherboard. Now that’s deep. Not to worry though, recruiters turn\
    \ to ask more specific questions for senior positions and sometimes recruiters\
    \ just want to see your thought process. Basically, the job requirements are like\
    \ a scope of an exam, it tells you what they will test you on and you must go\
    \ and hit the books hard. If one one of the requirements was to have experience\
    \ in operating the `hplc` machine and you have zero experience with that machine,\
    \ then you need to make sure that when you go to an interview you have read about\
    \ the machine and you have some serious knowledge about that machine. When asked\
    \ about the machine, never lie and say you have experience on the machine, NO!\
    \ Tell them straight that you have no experience with that machine, but you have\
    \ a good understanding of how the machine works then continue showing the knowledge\
    \ that you have gained from reading about the machine. Now you know why it’s very\
    \ important to invest a whole lot of time preparing.\n\n### Prepare success stories\
    \ and know them by heart\nWhen answering interview questions use the `SARS` method\
    \ of answering. `SARS` stands for `Situation`, `Action`, `Results` and `Summary`\
    \ which means try to highlight the `Situation` you were facing, the action you\
    \ took, the results and then summarize your story to show how it is relevant to\
    \ the question and maybe how the lesson learned can be used in the job that you\
    \ are applying for.\n\nStay on topic, rather not talk at all than to be all over\
    \ the place. Don’t just talk about your skills; show them how your skills can\
    \ benefit the company, for example, don’t just say I have a `BSc` degree in meteorology,\
    \ rather say, I have a `BSc` degree in meteorology that can benefit the company\
    \ in so many ways. Look at what the company wants (post duties) and tell them\
    \ how you can do it for them. Match your features to their need. What value are\
    \ you adding (what other values do you have that benefit the company).\n\n# Common\
    \ interview questions and sample answers\n\n## Question: Tell us about yourself\n\
    **Notes**\nInterviewers are not asking you to give them your life story, they\
    \ want you to tell them about your personality traits with regards to the job\
    \ you are applying for. This includes your experience, qualifications and skills.\
    \ Don’t talk about what you like or don’t like. Tell them what experience, skills\
    \ and qualifications you have that are related to the job.\n\nFocus on your skills.\
    \ Remember you want to keep your answer concise and on point so if you have a\
    \ lot of experience or skills, give the ones that are relevant to the job to show\
    \ how they would benefit you for this job thus making you the best candidate.\
    \ Every time you talk about your skills, education or experience, make sure that\
    \ you mention how it’s going to benefit them and how you think that will be good\
    \ for the position.\nGive them a concise summary of your experience, education,\
    \ and skills which is exactly what is in your `CV`. Say it exactly as it is.\n\
    \n**Answer**\nI have a `BSc` degree in `Chemistry` from the `University of Cape\
    \ Town`. I also have a certificate in `Operation and Production management` which\
    \ equipped me with staff management skills to increase productivity. I have two\
    \ years’ experience working as a laboratory analyst. This is where I got extensive\
    \ hands-on experience with modern laboratory instruments such as `HPLC`, `XRF`,\
    \ `IR`, etc.\nIn my previous company, I was in charge of writing the standard\
    \ operation procedures (`SOP`) and managing laboratory equipment, and I was able\
    \ to reduce the number of accidents in the lab by 5% in a year with zero damages\
    \ to the laboratory equipment. I would say that my main strength is my communication\
    \ skills, which is evident in my reference letter. I would like to join an organization\
    \ that provides growth and rewards.\n\n## Question: Why is there a gap in your\
    \ work history?\n**Notes**\nTry not to give an answer that is related to illness\
    \ unless you have documents. If you were let go then you must be honest. Remember\
    \ to stay positive at all times and remember that interviewers saw the gap before\
    \ they invited you for an interview so they do not really care about the gap.\
    \ A good way to answer this is to tell them about positive things you have done\
    \ during gap and try to give proof because it might sound like you are lying.\n\
    \n**Answer**\nThe company was downsizing, and they had to let all part-time people\
    \ go. Before I left, they gave me a recommendation letter. Here is my letter.\
    \ During the gap I wrote a novel, which I published on `kindle`, the name of my\
    \ novel is: Thinking about what.\n\n**Alternate answer**\nI took a gap to take\
    \ care of my sister because of some medical issues. Here is proof from my previous\
    \ employer showing why I left.\n\n**Alternate answer**\nAfter I left my job at\
    \ Ramps Consulting as I had decided to travel abroad. During the gap I took an\
    \ online course with the `University of Pretoria` to increase my knowledge.\n\n\
    ## Question: Do you have experience in … own**Notes**\nThe interviewer will ask\
    \ you if you have experience in a particular skill that they are looking for even\
    \ if they saw in your `CV` that you have the skill or not. They have to ask. If\
    \ you do not have the skill do not hesitate to say `NO`.\nNo, however, that is\
    \ not a problem; I have a high affinity to learn and I adapt quickly. I did not\
    \ have any experience when I started my last job and the job required technical\
    \ experience but within two months I had already taught myself how to operate\
    \ the instruments.\n\n**Answer**\nYes, I have five years’ experience in operating\
    \ `HPLC` machine.\n\n## Question: Do you have a certificate?\n**Notes**\nThe interviewer\
    \ may ask you if you have a particular qualification especially if they know that\
    \ you do not have it. Be honest and say `no` but you are willing to learn. \n\n\
    **Answer**\nNo, but I have a `BSc` degree in `Chemistry` from the `University\
    \ of Cape Town` which covered some aspects of meteorology e.g. air pressure, humidity,\
    \ etc. So even though I do not have a certificate, I am not a stranger to meteorological\
    \ concepts.\n\n## Question: What is your greatest strength?\n**Notes**\nBe specific\
    \ and tell a brief work-related example of showing your strength and pick the\
    \ example that is related to what they are looking for. If you feel like you have\
    \ already mentioned your strength in your `CV` or cover letter do not worry, it\
    \ is fine to mention it again. Keep the job description in mind when answering.\
    \ Make sure that the strength that you give is one of the qualities the company\
    \ is looking for. This should be your true strength, do not make up imaginary\
    \ strength that you think will make you look good. Give your true strength, however,\
    \ make sure that you give a strength that will benefit the company.\n\n**Answer**\n\
    My greatest strength is my ability to communicate effectively. One of my duties\
    \ at my previous company was to mentor new employees. I made sure I communicate\
    \ effectively with them. I listened actively to what they know and they did not\
    \ know so that I can explain to each one of them individually. The key to successful\
    \ communication is to communicate in a way that makes it easier for the other\
    \ person to understand. The results were that the employees learned how to use\
    \ the instruments quickly and adapted to the working environment with ease.\n\n\
    **Alternate answer**\nMy greatest strength is my ability to manage multiple tasks.\
    \ In 2012 I was enrolled in a course at the `University of Pretoria` during vacation\
    \ and a polymer science course at the `University of Stellenbosch` simultaneously\
    \ which I completed with outstanding results. Also I majored with three different\
    \ specializations at the `University of Pretoria` when I was completing my `BSc`\
    \ degree.\n\n## Question: What is your biggest weakness or areas you can improve\
    \ upon?\n**Notes**\nEveryone has a weakness, but this is neither the time nor\
    \ the place to say whatever comes to mind – you are not in a bar. Do not say something\
    \ that is completely out like I am alcoholic or I am a pervert. The interviewers\
    \ just want to see if you have self-awareness or if you just think you are superman.\
    \ Also, they want to see how you react to your weaknesses; are you willing to\
    \ work on your weakness to change them into strengths or you just let them have\
    \ the best of you. Pick a weakness that you had and you managed to change into\
    \ strength. Do not talk about a weakness if you think it might give you a bad\
    \ reputation.\n\n**Answer**\nMy weakness is that I lack a bit of organization\
    \ skills. The disadvantage of this is that it can be time consuming because you\
    \ can spend the whole 10 minutes looking for an eraser on a messy table. I have\
    \ read a lot of articles on this problem and I am no longer struggling with the\
    \ problem. One of the strategies I use is to return everything that I use where\
    \ I found it.\n\n## Question: How much do you want to get paid?\n**Answer**\n\
    Salary is obviously very important; however, I am sure that we can come to a salary\
    \ that will be mutually agreeable for the both of us if we agree that I am a good\
    \ fit for this position.\n\n**Alternate Answer**\nI actually did some research\
    \ on the topic and according to the internet I think the salary range is between\
    \ `100,000` and `200,000` so I think anything in that range will be fair for me.\n\
    \n**Alternate answer**\nI am currently getting `150,000` so I think anything in\
    \ that range will be good for me and the company.\n\n## Question: Where do you\
    \ want to see yourself in 3 years from now?\n**Notes**\nThe interviewers want\
    \ to see that you are a person with direction and goals. They also want to see\
    \ if you are willing to commit to the company or if you just want to leave. Make\
    \ sure you answer with realistic goals and show that you want to see yourself\
    \ promoted within the company. \n\n**Answer**\nI would like to see myself as head\
    \ of department.\n\n## Question: How would you describe yourself?\n**Notes**\n\
    Do not talk about hobbies or interest. This is not a personal environment, it\
    \ is a professional environment. Highlight one of your strengths and talk about\
    \ your skills and talk concisely.\n\n**Answer**\nI am a responsible, dedicated\
    \ and hard-working person. I have a natural ability to learn and I adapt quickly.\
    \ I made sure I work in the department.\n\n## Question: What annoys you?\n**Notes**\n\
    Remember to always stay positive. Do not say anything bad about yourself or anyone.\
    \ The best way to answer this question is to tell them what annoys you about yourself\
    \ and give an example.\n\n**Answer**\nI get annoyed when I sit and do nothing.\
    \ I like keeping myself occupied with something valuable. As you can see from\
    \ my `CV`, I have kept myself busy. In 2012 I published a blog. In 2013 I designed\
    \ a new brand. In 2014 I wrote a book and in 2015 I registered a business and\
    \ wrote a business plan. This is one of the reasons why I applied for this position\
    \ because it is a fast-paced environment.\n\n## Question: How you handle working\
    \ under pressure?\n**Notes**\nThere are people who work very well under pressure,\
    \ in fact they leave everything until the last minute so this is not good. The\
    \ interviewers want somebody who works very well both under pressure and when\
    \ they are not under pressure. Give an example of when you worked under pressure\
    \ to support your answer and structure your answer using `SARS` format.\n\nI most\
    \ definitely can work under pressure. The previous company I worked for was a\
    \ consulting company and I had a lot of clients so about 80% of the time I was\
    \ working under pressure and it was easy for me because I am organized, I like\
    \ planning, I use my time effectively and I do not mind working extra hours.\n\
    \n**Answer**\nYes, I work very well under pressure. In varsity I graduated with\
    \ `BSc` degree specializing with 3 majors simultaneously. These means three times\
    \ the work of an average student because average students specialize with only\
    \ one major. Hard working students who are dedicated to their work specialize\
    \ with two majors. I specialized with three majors. Also, in my previous company\
    \ at Rampsy, our company was required to do comparative dissolution which required\
    \ 30 different profile dissolves in two weeks; this is a lot of work in a short\
    \ period of time. Usually it takes one person a week to do just 5 profile dissolves\
    \ but my manager gave me the task to do 30 comparative dissolution in two weeks.\
    \ This meant that I had to do 30 different dissolves in only two weeks. To do\
    \ this I came up with a solid plan that I come to work early and leave late so\
    \ that I can manage to do at least 3 dissolves per day. I made sure that I organize\
    \ everything nicely so that I will not make any mistakes. In 10 days, I was done\
    \ with all 30 dissolves and on the 12th day I was done with the report. The report\
    \ was 207 pages long and there were no mistakes on it.\n\n## Question: How do\
    \ you make important decisions?\n**Answer**\nI am very good at making important\
    \ decisions. The strategy that I use to make decisions is to weigh pros and cons.\
    \ I make sure that I have as much information as possible that I can make an informed\
    \ decision; this includes taking as much advice as possible from my team members.\
    \ This is very important, in his book `Brilliant decision making and problem-solving\
    \ skills`, Richard Hall emphasizes the importance of enquiring as much information\
    \ as possible about the problem before making a decision.\n\n## Question: Why\
    \ do you want to work our company?\n**Answer**\nI would love to work for your\
    \ company because I believe that my background and skills can contribute to the\
    \ success of the company by making sure that I deliver every single thing that\
    \ is required from me.\n\n## Question: What did you dislike about your previous\
    \ job?\n**Notes**\nDo not talk negatively about anyone at your previous job or\
    \ about the job itself, this includes salary, long hours or the environment. In\
    \ fact, never be negative, not just for the interview; the world reacts negatively\
    \ towards negative people, but this is a story for another time.\n\n## Question:\
    \ Are you willing to work overtime?\n**Notes**\nNotice that the interviewers are\
    \ not saying that you will be working overtime they are just asking if you are\
    \ willing to work overtime. Do not eliminate yourself. Saying no might suggest\
    \ that you are not a hard worker, or you are not willing to make sacrifices for\
    \ the company or you are just lazy. Unless if you give a very good reason.\n\n\
    **Answer**\nI am very flexible. I would not mind coming to work on weekends if\
    \ I am needed. I used to go to work on weekends at my previous. There was this\
    \ one time in particular, when the `UV` machine broke so we could not work. The\
    \ technician fixed the machine Friday and we could not finish all the work that\
    \ has been piling up during the week. To solve this problem, I went to work on\
    \ Saturday and Sunday to try and clear up the work load for the following week.\
    \ Well, I did not finish the job, but I did at least 70% of the job.\n\n## Question:\
    \ Describe a difficult work situation and what did you do?\n**Answer**\nThe most\
    \ difficult time I had at work was when I started working; there was this guy\
    \ who was senior and kept giving me work. That put me in a difficult position\
    \ because I was new in the corporate world, straight of college and I was not\
    \ sure how to handle it. I decided to use the situation to my benefit and I learned\
    \ how to solve the problem.\n"
  raw: 'This is the most important reason for an interview. All your interview answers
    should be about evidence (success stories). Remember, a CV is a very summary of
    your life, so they want you to elaborate on that. For example, If they ask you
    why should we hire you, they already saw from your CV that you have experience
    in that particular field and they know that is why they need to hire you but they
    just want you to support that experience with success stories (evidence) and if
    possible to give hard evidence. Don’t worry if you don’t have written proof to
    support some of the skills and/or experience on your CV, the most common way to
    support your claims is to tell success stories, which is all the evidence they
    need. You will see in the questions below how easy it is to support your answers
    with success stories but first, let us look at the structure of interviews.Types
    of Job InterviewsTelephone interviewSometimes this is used as part of recruitment
    processes in which if you pass the phone interview then you will be invited to
    meet for another interview. Handle every telephone interview in the same professional
    manner as any other interview. Start by answering your phone professionally. Don’t
    be too fancy, a genuine hello will suffice. Just like your email address, your
    voice mail message/answering machine should be professional.Face-to-face interviewThis
    can also be a part of the recruitment processes in which if you pass it then you
    will be invited to meet for another interview, usually a panel interview, or you
    can be called for an assessment test. Be professional and prepare for it thoroughly.
    Some companies do not have a long recruitment process and this may be the only
    interview that you attend after which you get a job offer. Well, hopefully.Preparing
    for an InterviewLet everything revolve around your skills, qualifications and
    experienceResearching the companyWhen you research the company, don’t just browse
    through their website, go deeper than that. This will help you answer your questions
    appropriately and will help you show your interest in the company which will make
    you stand out from other candidates who didn’t invest time in their research.
    Researching the company will also help you prepare your questions for the interviewer.Matching
    skills, qualifications and experience to the job postThis is a very important
    part of preparing for an interview as questions will revolve around the job requirements
    and duties. Interviewers will ask questions to see if you have the required characteristics
    and to see if you will be able to carry out the duties. Matching your skills and
    qualification to the job’s requirements and duties will give you a good sense
    of what characteristics the recruiter is looking for and what duties will you
    be required to do. This will help you know which of the required characteristics
    do you have, and which ones don’t you have so that you can start doing your research
    and studying those characteristics that you don’t have. The trick here is, never
