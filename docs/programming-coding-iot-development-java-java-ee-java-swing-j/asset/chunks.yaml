    # Information Technology (IT)


    Information technology (IT) is at the center of business operations. Businesses
    rely heavily on IT to provide their products and services. Businesses are completely
    dependent on IT to perform their daily operation however this dependence on IT
    is also a source of significant risk because if not used properly, IT systems
    can render the business impotent to provide its product and services and thus
    impacting operational performance of a business. Businesses use IT to provide
    their products and services, to innovate, achieve strategic goals and for the
    overall competitive advantage through operational excellence.


    The is no success without information. You have to be able to collect and analyze
    information to be successful. That is why reading is shockingly important. Analyzing
    information is a form of thinking and human beings need information as much as
    companies need big data. This is why mathematics is so important. Math is analytics,
    analytics is thinking, thinking requires information and information leads to
    success. This is success analytics.


    ## Information Technology examples

    * Telephone and radio.

    * The internet.

    * Video conferencing equipment.

    * Computers.


    ## Careers in Information Technology

    * Technical Support.

    * Web Developers.

    * Computer Systems Analysts.

    * IT Security.

    * Network Engineer.

    * Database Engineer.

    * Software Developers.


    ## 5 Skills Needed For Big Data Analyst

    * Programming.

    * Data Administration.

    * Computational frameworks.

    * Quantitative Analytics and Statistics.

    * Business Knowledge.


    ## High-paying big data Jobs

    * Quantitative analysts.

    * Data scientists.

    * Statisticians.

    * MI and BI specialists.


    ## Skills for Big Data Professionals

    * `Qlik View`, `Tableau`, `Power BI` and `Excel`.

    * `Alteryx`, `Spotfire`, `Scala` and `Presto`.

    * `SAS`, `R`, `Python`, `Java`, `XML` and `HTML`.

    * `VB.NET`, `Azure`, `C`, `C++` and `C#`.

    * `Cldera`, `Cassandra`, `HDFS` and `Teradata`.

    * `Oracle`, `SQL`, `NoSQL` and `Hadoop`.

    * `Informatica`, `IBM`, `AbInitio`, `ERP` and `SAP`.

    * `AWS`, `Talend`, `Spark`, `Reltio` and `DevOps`.


    ## Big Data

    Data Management, Decision Making, Information, Growth, Success, Wealth...

    Data Science, Data Management, Data Architecture, Data Engineer, Data This, Data
    That, Data this and that...


    ## Data management

    Data management is the practice of storing and maintaining data as a valuable
    resource for organizations to unlock their potential. Managing data requires a
    robust data strategy and plans of how to access, integrate, cleanse, govern, store
    and prepare data for analytics. `Data Architects` have to design how IT infrastructure
    can be used effectively and efficiently in order to support and maximize the use
    of data by your organisation.


    ## Data architecture

    Data architecture is an outline or a plan of how IT infrastructure supports your
    data strategy by showing how data is acquired, transported, stored, queried, and
    secured. It is a set of rules, policies, standards, diagrams and models that govern
    and explains how data is used, stored, managed and integrated within an organization
    to ensure efficient use of data. The purpose of data architecture is to show the
    relationship between the data, business objectives and operations strategy.


    ## Data science

    Data science is a multi-disciplinary field that uses scientific methods, processes,
    algorithms and systems to manage data and extract knowledge and insights from
    structured and unstructured data. It focuses on finding solutions to solving big
    data problems by creating a sustainable way to manage data and finding ways to
    make sure the business benefits from data. Data Science includes both data management
    and data analytics. It is a blend of mathematics, statistics, business and technology.


    Data science, Information management, data management, data engineering, data
    warehousing and data analytics are often used interchangeably in the working environment
    which is good because they are almost the same thing, however, some people like
    to invest time trying to differentiate between them. Don''t do that. Don''t waste
    time on purpose. There are more important things that you can spend your time
    on. As you will see in this book, time is one of the key components of success.
    As long as your career is centered around big data, then your job title can be
    anything data related, data this, data that, data this and that. All you have
    do is know `SQL`, `SAS`, `Excel`, `Python` and `R`. At least two of those. That''s
    all you need.


    ## Basic Skills For Data Science Engineers

    * Data analytics (`Microsoft Excel`).

    * Database management (`SQL`).

    * Data quality knowledge (`DMBOK` principles).


    ## Advanced Skills For Data Science Engineers

    * Programming in `Python`, `R` or `SAS`.

    * Solid understanding of probability and statistics.

    * Data visualization tools (`PowerBI`).


    ## Components Of Data Management

    * Business intelligence.

    * Data architecture.

    * Data governance.

    * Data integration.

    * Data modeling.

    * Data quality.

    * Data security.

    * Data warehousing.


    ## Popular Skills For Big Data Jobs

    * `SQL`, `R`, `Python` or `SAS` programming language.

    * `Microsoft Excel`.

    * Critical thinking.

    * Data visualization (dashboards).

    * Presentation skills.

    * Machine learning and AI.

    * Data warehousing.

    * ETL tools (`SSIS`).

    * Data APIs.

    * Coding and programming languages.

    * Knowledge of algorithms and data structures.


    ## Six Stages Of Data Processing

    * Data collection.

    * Data input.

    * Data processing.

    * Data analytics.

    * Data reporting.

    * Data storage.


    ## Developing A Successful Data Architecture

    * Assess how the tools and systems work.

    * Define business goals and objectives.

    * Develop an overall plan for data structure.

    * Select data management and visualization tools.


    ## How To Become A Data Science Engineer

    * Learn basic math and statistics.

    * Learn to code.

    * Understand databases.

    * Learn `microsoft Excel` and `SQL`.

    * Get a degree in technology or computer science.

    * Apply for jobs.


    ## Big Data Jobs

    * Data scientist.

    * Data analyst.

    * Data engineer or data architect.

    * MI or BI analyst.

    * Machine learning or AI engineer.

    * Quantitative analyst or statistician.


    ## Common Data Types

    * Boolean (`true` or `false`)

    * Character (`a, b, c...`)

    * Date (`03/01/2021...`)

    * Double (`1.54343534532e308`)

    * Floating-point number (`1.234455`)

    * Integer (`1234....`)


    ## Free Database Management Software

    * `Microsoft SQL server`.

    * `SolarWinds`.

    * `Dbvisualizer`.

    * `Manageengine applications manager`.

    * `Oracle rdbms`.

    * `Ibm db2`.

    * `Teradata`.


    ## Data Strategy

    Data Strategy, Information, Decisions, Growth, Success, Wealth...

    This is how organisations use data.


    ## Data Analytics (Charts & Dashboards)

    Data produced by the data management team helps the analytics teams to create
    dashboards which helps drive the business and ensures that business intelligence
    is one of the key components of competitive advantage for the organisation. The
    analytics teams will receive the dashboards requirement from the business units
    and request the data from the data management team. After a dashboard is created,
    the analytics team will maintain dashboards and the data management team will
    maintain the data feeding the dashboards. The key goal of the data management
    team is to support the analytics team to produce as many dashboards possible depending
    on resources available (money, material, machine, and manpower).


    ## Automation

    Data processes for new dashboards will be optimized and automated after the project
    ends, provided that the output adds value to the organisation.


    ## Reliability and Tracking

    The number of outputs produced should be benchmarked across all teams and business
    units to ensure that the team is sustainable, consistent, and reliable.


    ## Agile (Project Management Methodology)

    The data management team will receive 90% of the projects from the analytics team.
    After requirements are received, the team will use the Agile method to complete
    the task as soon as possible. This entails breaking down the tasks into smaller
    milestones then completing the milestones in 2-weeks sprints. Both failed and
    successful projects will be counted as part of the 90%.


    ## Quality Assurance & Control

    The data management team will be responsible of quality monitoring during the
    project implementation phase and after automation. Data quality compliance will
    be completed by the data management team.


    ## Components of Success

    Employment, Business, Resources, Information, Growth, Success, Wealth...

