    ## 备选答案

    我在上一家公司面临的问题之一是，溶解过程非常耗时，因为溶解槽中的水加热需要很长时间。为了解决这个问题，我建议早上第一个进行溶解工作的人不要等水槽加热后再放入培养基，而是应该一到上班就放入培养基，让水槽温度与容器温度同步升高。这节省了时间。我的建议非常棒，并立即得到了实施。


    ## 问题：你会给办公室带来什么？

    ### 回答

    我将带上我丰富的知识和气象学方面的专业技能，但最重要的是，我将带来卓越的团队合作和沟通能力。我之所以说这些技能非常重要，是因为每个办公室都有想要实现的目标，如果没有团队合作和有效的沟通，办公室将无法实现其目标。因此，凭借这两项技能，我可以帮助办公室实现目标，并通过对这些技能及其他技能的不断改进，在未来几年里不断取得成就。正如我已经解释过的，我来自前任公司的推荐信证明了我具备良好的沟通能力，并一直取得良好的成果；此外，我的主管在现公司今年的绩效考核中，对我的沟通能力和团队合作能力打了
    `100 %` 的高分。


    ## 问题：请告诉我你在上一份工作中遇到过的冲突

    ### 回答

    到目前为止，我还没有过任何冲突，我只工作了三年。然而，如果我与某人发生冲突，我会同理他们，并尝试从他们的角度来看待问题。俗说，对于每一个冲突，每个人都可以做一些事情来避免冲突。个人的成长源于研究自己可以做些什么来避免冲突，并且不再犯同样的错误。


    ## 问题：但你的资历过高了……

    ### 备注

    并没有所谓的“资历过高”说，但既然你需要一份工作，让我们看看你如何礼貌地回答这个问题。

    ### 回答

    我认真考虑过这个问题，我可以找到一份符合我资历的工作，但我认为成为一名气象技术员会让我更有成就感，因为我很了解这个行业，并且对此充满热情。所以，关键在于找到一份能够实现我理想的工作，而不是一份仅仅符合我资历但我发现我不喜欢的工作。


    ## 问题：你为什么要离开？

    ### 回答

    我真的需要待在一个可以被管理、发展并且可以获得指导和导师培养的地方。

    ### 备选答案

    我需要承担更多的责任；凭借我丰富的实验室经验，我觉得自己正处于承担更多责任的良好位置。


    ## 问题：你如何应对变化？

    ### 回答

    我非常擅长应对变化。我从每天与化学品打道的实验室分析师，转变为与化学品无关的气象技术员，现在又成了一名数据专家。我确保自己在入职培训期间掌握了所有内容，并通过阅读书籍、文章，最重要的是参加课程来付出加倍的努力。

    ### 备选答案

    此外，我曾在马恩岛（Marion Island）工作过，那里是完全不同的环境。马恩岛是印度洋上非洲南方的一个偏远岛屿。岛上没有文明，只有科学家去那里研究。我们与一个`20`人的科学家小组住了一年，这需要卓越的团队合作能力适应变化的能力。因此，我读了沟通技巧类（提及具体书籍）和团队合作类书籍来提升自己的技能。结果，我的主管在半年度绩效考核中给我的评分是
    `24.25`（满分 `25`）。

    ### 备选答案

    我的工作模式从早 8 晚 5 变成了轮班制。轮班具有挑战性，因为你没有每天早 8 晚 5 的固定常规。但由于我出色的规划能力，我喜欢上轮班工作。

    ### 备选答案

    我在开普敦大学（`UCT`）学习过，那里非常多元化，有很多国际留学生，所以你必须学习不同国家和大陆的各种文化，以便每天都能与他们互动。因此，我开始阅读关于如何与每个人成功沟通的书籍。结果，我结到了很多朋友和学习伙伴，这也是我能以三主修学位毕业的原因之一。

    ### 备选答案

    我在斯泰滕博斯大学（`University of Stellenbosch`）参加了一个短期课程。斯泰滕博斯在方方面面与开普敦不同，包括他们的规定、居住区、工作伦理等。因此，我必须快速适应。课程结束时，我获得了证书。不要提供太多信息，也不要提供太少。


    ## 问题：管理和领导，哪个更重要？

    ### 回答

    管理和领导是两个非常不同的概念，容易互相混淆。领导属于管理的范畴。当你进行管理时，你可以计划、组织和设计计划，但要让员工执行你的计划，你需要激励他们，而这就是领导——激励你的员工去工作。

    在我之前工作的公司 `Rampsy`，我们公司被要求进行对比溶解，这需要在两周内完成 `30` 不同的剖面溶解；这在极短的时间内是一项大量工作。通常情况下，一个人一周只能完成
    `5` 个剖面溶解，但我的经理任务要求我在两周内完成对比溶解。这意味着我必须在短短两周内完成 `30` 次不同的溶解。为了做到这一点，我制定了一个周密的计划，即我早来晚走，这样我就能每天至少完成
    `3` 次溶解。我确保妥善地安排好一切，这样就不会出任何错误。在 `10` 天内，我完成了所有 `30` 项任务，并在 `12` 天时完成了报告。


    ## 问题：你有在截止日期之前工作的经验吗？

    ### 回答

    这是关于你的，使用 `SARS` 技术完成。


    ## 问题：你有什么问题想问我们吗？

    ### 备注

    这很有趣，面试官会问这个。是的，你需要在做决定前了解情况。在面试中提问非常重要，它显示了你对公司的兴趣。关注与面试相关的问题，记住保持简短并提出专业的问题；现在不是询问假期、休息时间的时候。只需遵循此书的建议即可，时间会属于你的。如果你没有问题，就不要问。直接告诉他们你没有问题。

    ### 备选答案

    我对这家公司做了大量的调研，事实证明它我所需的一切，所以我没有问题了。我在其他面试中通常问的问题是公司是否支持员工进修，但我已经知道你们支持。不要每次都用这个答案，要提问。

    ### 备选答案

    不，我没有问题了。他们可能会问你确定吗，你回答：是的，我很确定。


    ## 结束面试

    我非常渴望在贵公司工作，希望我能成为贵公司的长期资产，或者你可以说你对在公司工作的机会感到兴奋。这些问题的用处在于，你可以利用这些答案中的逻辑来回答面试官提出的任何其他问题。


    ## 跟进邮件

    面试后，在当天给每位面试官发送感谢信/邮件。用它来重申你的兴趣，并提及讨论过的话题。如果没获得工作，询问未来可以如何改进。这在小公司中最为适用，并非强制。


    ## 研究

    问题、研究、数据、事实、信息、增长、成功、财富……知识就是力量。研究是对材料和来源的系统调查和研究，以建立事实并得出新结论，通过科学理论、概念和理念的发展来促进社会进步。


