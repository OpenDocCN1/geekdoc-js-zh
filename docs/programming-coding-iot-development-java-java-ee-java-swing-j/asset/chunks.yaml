  trans: '


    时间是一个非常敏感的问题。非常敏感。每个人每天都有 24 小时，而取决于你每天如何利用这 24 小时，这决定了你的成功。你在这 24 小时内所做的每件事都应该围绕着尽可能获取信息来展开，因为信息确实是成功的核心。


    当你睡觉时，你应该明确知道自己正在为大脑充电，以便第二天能更有效地使用大脑来获取尽可能多的信息。当你吃饭时，你应该明确知道自己正在为身体补充能量，以便你有足够的能量去获取信息。当你在这任何事情上浪费时间时，你应该知道那是在浪费时间，这会让你远离成功。


    ## 时间管理流程

    - 设定一个明确的目标。

    - 将你的目标分解为更小的里程碑。

    - 编写一份 `To-Do List`。

    - 使用 `80/20 Principle` 来确定优先级。

    - 减少干扰。

    - 阅读关于你正在做的事情的内容。

    - 回顾你的一天。


    ## 时间管理技能

    - 优先级排序。

    - 授权。

    - 决策。

    - 目标设定。

    - 解决问题。

    - 战略性、批判性和分析性思维。

    - 计划安排。


    ## 如何停止拖延

    - 识别你拖延的原因。

    - 将你的目标分解为更小的里程碑。

    - 设定截止日期。

    - 使用正向社交压力。

    - 奖励自己。

    - 每几分钟在两个任务之间切换。

    - 消除干扰。

    - 从小开始以获得动力。

    - 分解最困难的任务。

    - 不要做完美主义者。

    - 不要试图完成每一个任务。

    - 设定可管理的目标。

    - 练习积极的自我对话。

    - 制定行动计划。

    - 关注你的强项。

    - 寻求帮助。

    - 多阅读。


    ## 80/20 生活方式

    信息、行为、生活方式、成长与成功……花 `80%` 的时间在 `20%` 的任务上，这些任务能为你带来 `80%` 的报报。


