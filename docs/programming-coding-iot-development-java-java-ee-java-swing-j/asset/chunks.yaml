    the read at least one article about each of these skills before an interview.
    Remember these are just common skills, there are more specific skills that a company
    will require e.g. advanced excel.Research the job postMake sure you know everything
    about the job duties written in the post. The questions will be centered on the
    duties and sometimes recruiters can ask very specific and challenging questions,
    e.g. say one of the requirements is knowledge of AWS, the recruiter might ask,
