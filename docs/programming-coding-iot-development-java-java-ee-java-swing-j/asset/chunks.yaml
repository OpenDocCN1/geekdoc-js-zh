    # 善管理你的时间


    申请工作非常耗费时间。你需要自律并监控自己，记录下你在特定时间内可以申请多少份工作。不断改进并保持一致性。


    ## 接受拒绝

    你会收到来自许多公司的拒绝邮件。不要被这些拒绝信息所困扰，你可以从获得的积极回复中学习更多。我会教你如何做这一点。


    ## 跟踪你收到的回复

    研究你从公司收到的每一个积极回复。再次查看职位发布，并将其与你的 `CV` 进行对比。寻找你的 `CV` 与职位描述的共同之处。这就是他们给予你积极回复的原因。


    ## 全方位地寻找工作

    找不到工作的人的问题在于，他们每天只申请一份工作，然后在该月的剩余时间里抱怨失业率。尽可能申请尽多的工作。申请、申请、再申请。每天至少申请 50 份工作。


    ## 持续改进你的简历

    尽可能申请工作的要点在于，你可以研究就业市场并据此修改你的简历。不要害怕修改你的 `CV`。每周审查并编辑你的简历。字面意义上的每周。


    ## 从失败的面试中学习

    你申请的工作越多，获得面试的机会就越多。这就是我所说的创造自己的运气。你正在增加获得工作面试的概率。这不是魔法，而是统计学。你会面试失败，这是必然。从失败中学习。你需要
    16 次面试才能获得你的理想工作。


    # 快速找到新工作的方法


    ## 采取策略

    获得理想工作的策略很简单：申请尽可能的工作，监控积极回复，据此修改简历并持续申请。申请得越多，获得的面试就越多。记住，获得你的理想工作需要 16 次面试。


    ## 建立人脉

    不要抱着人脉会给你提供工作的希望去建立人脉。这可能发生，但那不是目标。建立人脉的根本目标是获取改变你求职视角的信息。失败始于心态。建立人脉会解决这个问题。


    ## 筛选职位

    如果你处于失业状态，你电脑上唯一应该打开的应该是职位搜索搜索引擎。搜索、搜索、搜索。关上这本书开始找工作吧。事实如此。


    ## 了解你的技能

    写下你所有的技能并在简历上将它们列成表格。很多人没有这样做。这是一个巨大的错误。现在就去做。这会让你的技能更易于看到。如果你没有技术技能，就写软技能，例如沟通、领导力、团队合作……


    ## 每天花超过 8 小时找工作

    如果你失业了，就让找工作成为你的全职工作。每天投入 8 小时，包括周末。当然，如果你对找工作并不认真，那么你可以在周末休息。


    # 求职技巧


    ## 准备好你的证书和简历

    你的资格证书应该准备就绪以防他们要求，否则只需发送你的 `CV` 来申请工作。如果他们没有要求，就不要发送你的证书，否则你会给雇主增加不必要的工作。


    ## 找到最适合你的搜索引擎

    最好的搜索引擎是那种没有广告、没有无用杂且易于使用的。你希望直接从雇主网站申请工作，因此最好的职位搜索引擎应该有一个过滤招聘板的选项，以便你专注于直接来自雇主网站的职位。


    ## 设定目标

    你的目标很简单。你的目标是找到工作。通常，需要 16 次面试才能获得一份工作。而需要 350 次申请才能获得一次面试。基本上，你需要 350 乘以 16 次申请才能获得一份工作。这就是他们所说的
    SMART 目标。


    ## 在线搜索

    第四次工业革命。互联网。这就是我们的做法。尽可能多地学习计算机知识。在线申请工作。这就是我们现在的办事方式，我会写很多关于技术的书。拿一本来自我自己吧。


    ## 使用社交媒体

    社交媒体是建立人脉的绝佳工具，我上面提到过为什么建立人脉对求职至关重要。利用社交媒体加入有帮助的小组并关注正确的人，尤其是招聘人员。


    ## 申请政府工作

    职位搜索引擎的一个优点是它们将所有工作汇集到一个地方。然而，有时搜索引擎不会显示政府工作。确保你手动查找并申请。全方位地寻找。


    ## 寻求内推

    请任何你认识的人去问问他们的经理，他们的工作场所是否有空缺，以便你可以在那里工作。尝试一下并无坏处。

    如果你急于快速找到工作，可以尝试申请那些不需要经验的工作，这些通常是助理职位和代表职位。


    # 动力

    动力是实现的渴望。无论是在工作、学校、体育还是商业领域，动力都能帮助你实现目标和梦想。


