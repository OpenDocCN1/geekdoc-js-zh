    # 从待办清单开始工作


    自律是一种无论你的生理或情感感受如何，都能迫自己前进并采取行动的能力。你需要动力、意志力、毅性和目标设定技能来保持自律并执行你的计划。


    ## 如何提高你的自律性

    - 明确你的目标。

    - 承诺并言出必行。

    - 避免诱惑。

    - 致力于培养习惯。

    - 阅读。

    - 少去聚会（每月一次）。

    - 用意志力胜过情绪。

    - 原谅自己的不完美。

    - 保持自我激励。

    - 喝黑咖啡。

    - 为一切做好计划（列出待办清单）。

    - 将你的目标放在每天都能看到的地方。

    - 写下你开始的原因。

    - 先设定小目标。

    - 区分轻次顺序。

    - 了解你的优缺点。

    - 让别人监督你。

    - 认识到自律是一个学习过程。

    - 停止拖延，开始行动。

    - 消除干扰。

    - 创建一个让你感到兴奋的常规作息。

    - 承担责任。

    - 照顾好你的身体。

    - 关注必要的事情。


    # 冲突解决策略

    冲突、领导力、团队、生产力、信息、成功、财富……耐心是解决所有问题的关键。


    ### 避免冲突升级

    当两个人发生冲突时，缓解问题的一种方法是让其中一个成员避免纠涉手头的问题。这可以通过关注其他没有问题的问题，以及写下遇到困难的问题来实现。有时冲突是由于信息不足造成的，在获得所有信息之前回避该问题可能是可行的，或者更好的是，将问题委托给拥有相关信息的人，这就是咨询派上用场。


    ### 协作

    在所有冲突解决策略中，我个人最喜欢协作策略。你周围的每个人都有自己的观点，在他们看来，自己的观点是百分之百正确的。技巧在于从他们的角度来看问题，这样你就能看到他们观点的价值，并与他们共同努力利用他们建议的价值。没有什么是知识不是力量。


    ### 接纳不同的观点

    冲突通常是由两个持有不同观点引起的，他们非常相信自己的观点，以至于认为别人的观点是错误的。这是非常危险的。双方都认为自己是对的，而对方是错的。这里的关键是即使你不认同，也要接纳或考虑不同的观点。仅仅承认另一个人的不同观点，就能帮助解决关于谁对谁错的必要冲突。你不需要认同他人的观点，但你要承认你周围的每个人都有权拥有观点，并接纳这种观点。


    ### 妥协

    妥协可以帮助你实现目标。有些冲突并不是建设性的，它们没有为你或你周围的人增加价值，也不会帮助任何人实现目标。这种冲突没有任何价值，应该不惜一切地避免。如果你无法避免，你可以妥协自己的观点，为了大局而让对方拥有他们的自己的观点。


    ### 竞争

    在不陷入冲突的情况下进行竞争具有挑战性。最简单的方法是基于事实而非观点或情绪进行竞争。使用数据来证明你的观点并做出明智的决策。大数据、统计、数学和分析在帮助人类决策方面发挥着巨大的作用。


    ## 冲突管理策略

    - 避免

    - 接纳

    - 妥协

    - 竞争

    - 协作


    # 第二部分：财富


    ## 财务管理

    永远不要寻找增加财富的方法。这是你必须掌握的领域之一。我们没有变得富有的原因之一是因为我们停止了学习，停止了自我提升。这本书包含了你变得富有和完成蓝图（像拼图一样）所需的所有技能和知识。记住，无论你学习了什么，你都可以富有。所有的富人都有一个共同点，他们不断成长。没有哪种职业可以在没有持续增长的情况下让你富有。通常认为薪水高的职业是因为它们被设计为要在学校学习多年。高薪医生在大学要上大约
    10 年。你在大学上了 2 年，然后在接下来的 8 年里抱怨你的职业。停止抱怨，去大学读 10 年然后来告诉我。如果政府能设计所有职业在时间、能量和精力上遵循相同的教育结构，那么我们获得的薪水都是一样的；但政府没有这样做，所以这取决于你。学得比医生多，你的薪水就会比医生高。确保你获得值
    10 年大学学历的资质。现在通过在线课程可以很容易地做到这一点。现在注册并继续成长，这仅仅是开始。


    ### 金钱的规则

    - 还清债务。

    - 为紧急情况和机会储蓄。

    - 了解信息，阅读所有理财书籍。

    - 投资房地产或指数基金。

    - 纳税并更多地使用公共基础设施。

    - 避免生活方式膨胀。

    - 每天跟踪你的支出。

    - 尽量减少由汽车产生的费用。

    - 投资教育。

    - 永远不要申请更高薪的工作。

    - 停止购买垃圾食品，再去付健身房费用。

    - 尽量减少你所有的支出。


    ### 财务管理

    财务管理是每个成功人士应该掌握的关键词技能之一。财务管理在理论上看起来很复杂，但在实践中更容易。目标是入不敷出。这很容易。复杂的部分在于你必须跟踪你的支出并追踪每一件事。追踪每一笔钱并记录下来是一项耗时的任务。如何记录它是另一个问题。确保你知道你的每一分钱去了哪里。


    ### 制定一个致富计划

    记住，生活在你有其他计划时发生的事情。这就是计划的魅力所在。你制定计划并不断改进你的计划，这样永远不会出错。拿出一个笔记本和一支笔，画出你的计划。不要在脑子里想。不要在脑子里想。


    ## 个人财务的七大领域

    - 预算

    - 储蓄

    - 债务

    - 投资

    - 保险

    - 信用

    - 发展你的业务


