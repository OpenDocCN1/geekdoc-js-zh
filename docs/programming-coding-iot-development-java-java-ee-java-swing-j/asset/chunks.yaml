    # 如何使用 80/20 法则。


    对于你生活中想要实现的每一个目标，你都必须选择一种有助于你实现该目标的生活方式。如果你想成功，你每年每年要读 12 本书。如果你想变得富有，你必须花费 `80%`
    的时间在工作，这意味着你所做的一切就是吃饭、睡觉、工作以及每月休息一天来玩乐。这是 `80/20 法则`的实际应用，它将引导你走向成功。


    人们想要成功，但不想花费 `80%` 的时间去工作。这是不会发生的。有些人想要欺骗成功，他们认为自己很聪明，认为他们现在努力工作，等以后富了就会停止努力。事情不是那样的。如果你富有，但工作时间少于
    `80%`，这意味着你正在走下坡路，给一点时间，你很快就会变得贫穷。人类被创造是为了在 `20%` 的时间里娱乐，在 `80%` 的时间里工作。每月休息一天玩乐，其他时间则用于应对生活中的不确定性，前提是你确实计算了每月
    `80%` 的天数。


    ## 富人的生活方式


    每月玩乐一天是富人的生活方式。你会发现，富人享受工作。如果你不喜欢工作，你就需要改变这种态度。你必须喜欢工作才能富有。你不必喜欢你的工作，但你必须喜欢工作这件事。你必须喜欢成长。你必须喜欢高效率。如果你工作时间少于
    `50%`，你将会贫穷。如果你工作 `50%` 的时间，你将过光光生活。如果你工作 `60%` 的时间，你会成为中产阶级。如果你工作 `80%` 的时间，你将会富有。如果你工作
    `90%` 的时间，你将会卓越。


    ## 生活方式、改变与成功。


    “生活方式”这个词定义了人们的行为、感兴趣的事以及信仰的东西。它是你生活的方式，包括对爱好的选择、文化兴趣、穿衣、朋友，最重要的是你把时间花在了什么地方。你在闲暇时间所做的活动定义了你的生活方式。如果你在闲暇时间阅读，可以说你拥有富人的心态。你必须根据想要实现的目标调整你的生活方式。如果你想减肥，就必须减少摄入并选择保持活跃。走楼梯而不是坐电梯，或者把车停在离目的地远一点的地方走路。


    ## 奢华、生活方式与成功。


    奢侈的生活方式是大多数人的动力。有足够的钱花在那些不需要的东西上，这一切都是为了享乐，从上门安保到游泳池、桑拿和昂贵的汽车。奢侈的生活方式让你能够享受金钱。钱是一个很好的动力，被金钱驱动并没有什么错。然而，大多数人害怕被金钱驱动，因为……嗯，我真的不知道为什么。金钱根据惯例是所有资源的代表。这是我们共同达成的共识。全世界同意使用货币作为交换媒介，这意味着你可以用它来购买其他资源。既然如此，为什么人们会害怕被金钱驱动呢？这不合理。对奢侈生活方式的需求提供了动力，而动力催生了成功。


    ## 糟糕的生活方式


    糟糕的生活方式与体育活动不足、饮食不健康和滥用药物（吸烟、喝酒、服用止痛药等）有关。人们面临的大多数健康问题与其生活方式直接或间接地相关。这包括了疾病、残疾甚至死亡。


    你可以通过改变你所控制的事来改变生活方式，例如改变饮食或日常作息。照顾健康在塑造生活方式方面起着巨大作用，这包括注意饮食、休息、运动、阅读以及避免使用酒精、药物和烟草。与糟糕生活方式相关的疾病包括动脉粥样硬化、心脏病、中风、肥胖、糖尿病等。这些疾病与吸烟、饮酒、毒毒以及我们吃的垃圾食品有关。良好的生活方式有助于防止这些不必要的问题。不要因为医生让你这么做，要因为你想成功。健康问题是昂贵的，它们会分散你的注意力并消耗你的精力，让你难以专注于成功。


    ## 健康、生活方式与成功。


    良好的生活方式为你提供能量并帮助你专注于目标。成功与高效的生活方式相关。过上高效的生活意味着你选择参与有助于提高你效率的活动，例如健康饮食、适度饮酒、阅读、每日管理财务等。选择做一个享受高效率的人。选择花费
    `80%` 的时间工作。选择成功。


    ### 使用 80/20 法则优先排序

    * 列出你所有的日常任务。

    * 识别出三个给你带来回报的任务。

    * 完成这三项关键任务，并将其余任务委托出去。


    ## 积极思考


    问题、心态、解决方案、成长、成功、财富……一切都始于思想。


    积极思考是在在任何情况下都关注良好一面的习惯，这对你的身体和心理健康有巨大影响。这简单意味着你面对生活中的好坏时，预期事情最终会向好发展，这种思考通常会导致成功，因为它增强了你的信心并让你保持冷静，使你能够轻松地解决问题。要保持冷静并积极思考，你必须了解生活中的一切是如何相互联系的，以及如何从任何起点获得成功。


    ### 如何建立积极心态

    * 增加你的投入，产出将会是。

    * 寻找导师。

    * 走出舒适区。

    * 执行积极。

    * 关注情绪状态。

    * 写下你的目标。

    * 健康饮食。

    * 运动。

    * 走出舒适区。

    * 寻找新目标。

    * 学习新知识。

    * 主控情绪。

    * 冥想。

    * 与人交流。

    * 看喜剧片。

    * 写下你的成就。

    * 笑声是最好的良药。


    生命能量、情绪、资源、动力、成长、成功……


    ## 自律


    生命是能量，是物理能量也是情绪能量。物理能量和情绪能量受到所有其他能量的影响，包括来自我们所食物的化学能量、来自环境的物理能量、声能等。每个拥有生命的人都有行动能量。要过上完整的生活，必须照顾好自己的情绪和物理能量，为了做到这一点，我们需要食物、住所、水、空气和其他需求和欲望。金钱是世界上同意用于购买生存所需的其他资源之一。个人财务需要知识、技能和经验。


    为了生存并过上舒适的生活方式，你需要尽可能的信息，因此信息是成功的中心。这就是为什么阅读至关重要。你必须不断寻找信息，解决问题的能力就越强，从而带来财富，金钱可以购买你生存、舒适和休闲所需的其他资源。


