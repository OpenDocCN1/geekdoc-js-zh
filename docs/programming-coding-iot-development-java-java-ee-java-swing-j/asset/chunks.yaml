    # 管理与领导力


    管理与领导力是相互依赖的。管理者必须能够领导，而领导者也应该能够具备管理能力。领导者应当领导，这意味着他们应该与人互动，在互动完成后，他们应该处理手头的问题。管理者应该处理问题，然后通过与人的互动来引导他们。


    永远不要管理人。要管理问题并引导人。解决问题被称为管理；让人们感到心安被称为领导力。你两这两项技能，并且应该知道何时扮演管理者的角色，何时扮演领导者的角色。


    教学、指导、辅导和授权。当出现问题时，没有人能随时解决所有问题，因此领导者和经理需要能够对每个人辅导、指导并激励，以便他们在情况变得不妙时准备好介入并控制局面。


    ## 领导力的核心价值观


    这是一份优秀的价值观列表，如诚实、自信、尊重、同理心等。你应该列一份你想要学习的核心价值观清单，并优先学习和掌握这些价值观。强大的核心价值观是成就优秀领导者的关键。


    ## 谈判


    你必须能够用更少的资源（即时间、精力和金）完成所有工作。做到这一点的一种方法是为你的资源争取更好的交易条件。由于领导力涉及人，领导者必须学习如何谈判。


    这包括大批量购买资源并谈判获得更好的折扣。保持道德道德和诚实至关重要。不要滥用你的谈判权力，不要给人们低于公平的回报。生活中的一切事都通过能量连接在一起，如果你行为不道德，你就会释放负能量，这些能量将会反作用在你身上。那是另一个故事的话题，我会专门写一章关于谈判。


    ## 建立关系


    领导者必须能够与他们接触的每个人保持联系。沟通是一切的核心。领导者必须利用所有可用工具与每个人进行有效高效的沟通，而信息技术正在使这一切成为可能。


    ## 领导者的核心价值观


    - 诚信。

    - 授权能力。

    - 沟通。

    - 自我认知。

    - 感激。

    - 敏捷。

    - 影响力。

    - 同理心。

    - 耐心。


    '
