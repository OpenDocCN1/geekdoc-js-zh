    ## Part One: Wisdom

    ### Science, Engineering & Technology.

    Business Operations, Data, Computers, Artificial Intelligence, Profit, Growth,
    Success, Wealth...


    Hey Siri, what is artificial intelligence?


    Artificial intelligence (`AI`) is the simulation of human intelligence processes
    by machines e.g. natural language processing machines, speech recognition machines,
    machine vision, expert systems, etc. It is the ability of computers, robots, or
    machines to do tasks that are usually done by humans because they require human
    intelligence and judgment. The goal of AI is to create computers and machines
    that can think, learn and perform rational tasks such as problem-solving, decision-making,
    perception, and understand human communication.


    **Types Of Artificial Intelligence**

    * Reactive machines

    * Limited memory machines

    * Theory of mind machines

    * Self-awareness machines


    **Artificial Intelligence Examples**

    * Manufacturing robots.

    * Self-driving cars.

    * Smart assistants.

    * Proactive healthcare management.

    * Disease mapping.

    * Automated financial investing (trading).

    * Virtual travel booking agent.

    * Social media monitoring.

    * Chatbots.

    * `Siri`.


    #### Machine learning

    Machine learning is a branch of artificial intelligence which uses data analysis
    methods to automate model building activities. Machine learning algorithms use
    historical data as input to predict new output values. This allows software applications
    to become more accurate at predicting outcomes without being explicitly programmed
    to do so. Machine learning is used in internet search engines to find the best
    search results, email filters to find spam, online stores to make personalized
    recommendations, software to detect unusual transactions, voice recognition, self-driving
    cars, and more.


    **Popular Machine Learning Skills**

    * `Python`.

    * `R` programming language.

    * `Java`.

    * `Scala`.

    * `SQL`.


    #### Mathematics

    Mathematics is the science of numbers and their operations, combinations, generalizations,
    abstractions, space configurations, structure, and transformations. There are
    many branches of mathematics namely algebra, geometry, arithmetic, calculus, etc.
    Mathematics makes our life orderly, prevents chaos, increases reasoning ability,
    creativity, abstract thinking, critical thinking.


    **Branches Of Mathematics**

    * Algebra

    * Geometry

    * Calculus


    #### Statistics

    Statistics is a branch of mathematics that deals with developing methods for collecting,
    interpreting, and presenting data usually to analyze the probability of something
    happening. This is very useful in machine learning and AI. The mathematical theories
    behind statistics rely heavily on calculus, linear algebra, and probability theory.
    Probability plays a key role in statistics help people make intelligent and accurate
    conclusions about a greater population.


    **Statistics In Real Life**

    * Medical study.

    * Weather forecasts.

    * Stock market.

    * Consumer goods.

    * Decision making.


    **Popular Statistics**

    * Mean

    * Standard deviation

    * Regression

    * Hypothesis testing

    * Sample size


    **Types Of Statistical Analysis**

    * Descriptive analysis

    * Diagnostic analysis

    * Predictive analysis

    * Prescriptive analysis


    #### Engineering

    Engineering is the act of using science and technology to solve life problems.
    Engineers develop new technological solutions by inventing, designing, building
    and testing machines, complex systems, gadgets and materials to fulfill functional
    goals while considering practicality, safety and costs.


    **Branches Of Engineering**

    * Mechanical engineering

    * Chemical engineering

    * Civil engineering

    * Computer engineering

    * Aerospace engineering

    * Electrical & electronics engineering

    * Materials engineering


    #### Science

    Science is the pursuit and application of knowledge by following a systematic
    methodology to find evidence. Scientific methodology includes conducting experiments,
    measuring results, and analyzing information (data analysis). Science generates
    solutions for everyday life and helps implement those solutions through technology.


    **Types Of Science**

    * Mathematics and information sciences.

    * Physical science.

    * Environmental sciences.

    * Biological science.


    #### Computer Science

    Computer science is the study of computational machines and computation itself.
    It is the study of a range of topics from algorithms to practical issues of implementing
    computational systems in hardware and software. Computer science majors learn
    how to use computers and computational processes to solve problems, build websites,
    program robots, mine data, and more. Computer science requires an understanding
    of math and programming. Discrete mathematics, linear algebra, number theory,
    and graph theory are the math courses most relevant to the computer science profession.


    #### Computer Engineering

    Computer engineering is a branch of engineering that combines the fields of electrical
    engineering and computer science to create new computer hardware and software.
    Computer Engineers are involved in the design of computer architecture and functions.


    #### Programming

    Programming or coding is the act of communicating with a computer by writing systematic
    lines of instructions that will instruct the computer to perform certain actions.
    Programming languages are used to create websites, apps, and other technologies
    we interact with every day. For example, you can use the `HTML` programming language
    to tell your computer how to design your website. Programming and coding mean
    the same, it is just a way of telling your computer what to do, using the programming
    language your computer understands. Programming can be done using a variety of
    programming languages, such as `JavaScript`, `Python`, `C++`, etc. There are a
    lot of things to learn when it comes to programming or coding. Learn only what
    you need at that moment otherwise you will miss the bigger picture. The bigger
    picture is always to strike a balance and be successful in life. You can learn
    programming by registering for a course or by teaching yourself, many good programmers
    there are self-taught. The easiest way to learn programming is to watch someone
    else do it which you can do through YouTube. Programming skills are very important
    in IT, data analytics, marketing, web design, and many engineering segments.


    **Programming Language Classification**

    * Procedural programming

    * Functional programming

    * Scripting programming

    * Logic programming

    * Object-oriented programming


    **How To Learn Programming**

    * Learn by doing and not just reading.

    * Share, teach, discuss and ask for help.

    * Use online resources.

    * Understand the fundamental concepts.

    * Learn data structures and algorithms.

    * Build projects.

    * Experiment.

    * Start with `SQL`, it is that easy.

    * Use free online courses.

    * Buy a book.


    **Types Of Programming**

    * Data compression

    * Error control

    * Cryptographic coding

    * Line coding


    **Top Programming Languages**

    * `C++`

    * `Javascript`

    * `PHP`

    * `Python`

    * `Go`

    * `Swift`

    * `Scala`

    * `Elm`

    * `Ruby`

    * `C#`

    * `HTML`

    * `SQL`

    * `SAS`

    * `R` programming language


    #### Software Development

    Software development is the process of creating and maintaining computer applications
    (apps), frameworks, or other software components by designing, programming, documenting,
    testing, and debugging code.


    **Types Of Software Development**

    * Frontend development.

    * Backend development.

    * Full-stack development.

    * Desktop development.

    * Web development.

    * Database development.

    * Mobile development.

    * Cloud computing.

    * Application development.

    * API development.


    **Types Of Software**

    * Application software.

    * Freeware.

    * Shareware.

    * Open-source.

    * System software.

    * Utility software.


    #### Networking

    Networking, also known as computer networking, can be defined as the connection
    of two or more computers for the purpose of sharing data electronically. Networking
    helps with everything from telephone calls to text messaging to streaming videos
    on the internet.


    **Types Of Computer Networks**

    * `LAN` (Local Area Network)

    * `PAN` (Personal Area Network)

    * `MAN` (Metropolitan Area Network)

    * `WAN` (Wide Area Network)


    **Careers In Computer Networking**

    * Network administrator.

    * Computer systems specialist.

    * Network architect.


    **Advantages Of Networking**

    * Sharing devices such as printers.

    * Cost reduction on software licenses.

    * Communication.


    #### SQL

    `SQL` stands for `Structured Query Language` and is a highly used programming
    language for working with databases. A database is a systematic collection of
    data structure that stores organized data usually in a form of tables. You can
    think of a database as an electronic filing cabinet. A cabinet is a physical structure
    for storing documents and a database usually stores information in the form of
    tables. A database may include tables for products price, employee names, and
    financial records. Databases can store very large data (`Big Data`) and make it
    easy to search for data, add new data, edit or delete old data. `SQL` statements
    are used to perform tasks such as `insert` data on a database, `retrieve` data
    from a database, modifying rows and columns, etc. A Database Management System
    (`DBMS`) is software that allows users to communicate with the database using
    the `SQL` language.


    #### Database modeling

    Database modeling is a process of producing a diagram showing the logical structure
    and constraints that determine how data can be stored and accessed. It shows how
    data is connected and how it can be processed and stored inside the database.
    It helps us think the four types of data models are Hierarchical model, Network
    model, Entity-relationship model, and Relational model. `SQL` is very easy to
    grasp because of its English-based syntax. It is simpler than most programming
    languages. The amount of different concepts is smaller which is why you can learn
    `SQL` on your own without knowing any programming languages. You can download
    and install free `SQL` software and start practicing by running simple queries
    using data. YouTube offers a visual presentation of `SQL`.


    **The Four Main SQL Keywords**

    * `SELECT` (to get data).

    * `INSERT` (to insert data).

    * `UPDATE` (to update data).

    * `DELETE` (to delete data).


    **Advantages of Databases**

    * Improved data sharing and management.

    * Improved data security.

    * More reliable data integration.

    * Reduced data inconsistency.

    * Improved data access.


    **Types of databases**

    * Centralized database.

    * Distributed database.

    * Personal database.

    * End-user database.

    * Commercial database.

    * `NoSQL` database.

    * Operational database.

    * Relational database.


    **Jobs that required**

    * Data warehousing.

    * ETL development.

    * BI Development.

    * Business Analyst.

    * Data Scientist.

    * Software Engineer.


    **Best websites to learn SQL**

    * YouTube

    * WiseOwl

    * `SQLZOO`

    * Oracle LiveSQL

    * W3resource

    * Stack Overflow

    * GitHub

    * Fiddle

    * Coding Ground

    * khan academy

    * Codeacademy

    * `SQLcourse.com`

    * FreeCodeCamp


    **Four Types of DBMS**

    * Hierarchical database

    * Network database

    * Relational database

    * Object-Oriented database.


    **DBMS examples**

    * `MySQL`

    * `PostgreSQL`

    * Microsoft Access

    * `SQL Server`

    * FileMaker

    * `Oracle`

    * `RDBMS`

    * `dBase`

    * Clipper

    * FoxPro


    #### Data, Information & Technology

    Data, Information, Critical Thinking, Knowledge, Wisdom, Success, Wealth...


    Data can be defined as bits and pieces of information such as facts, numbers,
    words, measurements, or just descriptions of things. Data creates information,
    information creates knowledge, knowledge creates wisdom and wisdom is one of the
    key components of success (Wealth, Health and Wisdom).


    #### Big data

    Information is the center of success. This is why big data is very important for
    business. Big Data is data that is huge in size and it keeps growing exponentially
    with time. Companies are continuously collecting information every second to help
    them make good decisions and become successful in their field. This information
    keeps growing and as a result, it is called Big Data. Companies collect information
    about their customers in a number of ways including social media activity, surveys,
    online behaviour by using cookies that we always accept without reading the terms
    and conditions or by acquiring it from other companies which got your data from
    reward cards.


    Big data is used by companies to provide customer insights by analyzing and predicting
    customer behavior through data derived from the internet or elsewhere. Big Data
    also allows for better customer retention, stock exchange analytics, social media
    growth, engineering designs, etc. Big data is one of the fast-growing fields in
    the year 2021. It has exciting opportunities for professionals in all industries
    and across the globe and the demand for skilled big data professionals continues
    to rise.


    #### Information Technology and Data

    Companies use different types of software to extract information and store it
    in their databases for use or to sell it to other companies. This is made possible
    by Information Technology. Information technology is computer-based technology.
    There are five primary elements of information technology as a whole which are:
    information security, database administration, network management, computer technical
    support, and software development. Information technology helps with faster communication,
    electronic storage, information share and analytics. IT professionals usually
    work with software, hardware, databases, web resources, networks, and enterprise
    systems. The duties of an information technology specialist can include network
    management, software development, database administration and more. Database administrators
    ensure databases run efficiently in order to store and organize data, such as
    financial information, customer shipping records and personal details. The Information
    Technology field that deals with data management is called Information Management.
    Information management helps businesses form strategies and implement processes
    based on decisions derived from data. Information is at the heart of business
    growth, which is why so much effort, money and resources are put into developing
    efficient information technology.

