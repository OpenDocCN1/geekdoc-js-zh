    # 如何影响他人

    - 展现你的魅力（同理心）。

    - 倾听他人。

    - 注意他人想要什么。

    - 为他人的生活增加价值。

    - 非常擅长解决冲突。


    ## 谈判规则

    - 多听少说。

    - 使用沉默的力量。

    - 提问。

    - 保持公平。

    - 在谈判前明确你想要什么。

    - 目标是实现双赢的谈判。

    - 学习冲突解决策略。

    - 做好准备。

    - 制定策略。

    - 保持简单。


    ## 批判性思维

    思考、计划、优先排序……

    如果你不计划，你就是在计划注定会失败 —— 苯杰明·富兰克林。


    思考是一种处理信息、建立联系、做出决策和创造新想法的心理活动。思考也可以被看作在大脑中制定待办事项的过程。思考是通往成功的第一步。生活中有太多要做的事情，但只有
    20% 的事情会带来成功，因此每个人在行动之前都必须思考并据此确定优先级。在采取行动时，从那些能带来成功的活动开始。每一个念头都必须写下来。这有助于显性化、思维分析和计划。


    ### 批判性思维

    批判性思维是清晰、理性地遵循逻辑来决定该做什么或相信什么的能力。它是一种进行反思性思考、理解观点之间的逻辑联系，并理解事物在何地、如何、何时、什么以及为什么是现在这样的能力。它是关于尽可能多提问，直到你获得所需的所有信息。信息引导增长，增长带来成功，成功带来财富。


    批判性思维有助于做出良好的决策。你必须能够权衡问题解决方案的优缺点。你必须查看所有可用数据，并根据提供的数据权衡优劣做出明智决策。大数据之所以流行正是因为此。经理可以通过大数据做出良好的决策。


    ### 制定待办列表

    你应该能够确定事情发生的什么、何时、为何、何地以及如何。这被称为进度安排。不做到这一点会导致灾难，简单而直接。写下每一个细节。为每个里程碑准备一份待办列表、任务日历和检查清单。这将有助于任务显性化、执行过程的可视化以及问题的分析。


    ### 风险管理

    你必须能够计划并管理出错的情况。生活中的事情通常会出错，这是既定的事实。这是因为与计划不同，生活是对时间敏感的，像延迟交付这样的小事就会导致巨大的灾难。你必须预判可能出错的地方，并计划在那种情况下怎么办。这就是风险管理包含的内容。


    ### 如何进行批判性思考

    - 重构信息。

    - 评估后果。

    - 提问。

    - 保持观察力。

    - 每天阅读。

    - 查看历史数据。

    - 研究。

    - 寻找事实、数字或科学。

    - 善于分析，拆解信息。


    ### 批判性思维过程

    - 观察

    - 调查

    - 分析

    - 解释

    - 评估

    - 反思


    ## 决策与问题解决

    问题、信息、决策、增长、成功和财富……

    失败是学习的机会。


    解决问题是定义问题、确定问题根源并寻找解决方案的行为。解决的问题越多，你就变得越富有、越成功。


    ### 解决问题的流程

    - 描述问题。

    - 拆解问题。

    - 找到根源。

    - 研究并阅读直到直到找到解决方案。

    - 实施解决方案。

    - 衡量结果。


    ### 解决问题的技能

    - 积极倾听。

    - 批判性和创造性思维。

    - 研究与阅读。

    - 沟通。

    - 决策。

    - 团队合作。


    ### 决策

    决策是收集信息、评估后果并选择一个负面后果较少的选项的过程。优秀的决策者会选择为所有人带来最佳结果的行动。他们在研究、权衡后果，并在保持开放心态的同时做出理性的决策。


    ### 决策过程

    - 识别方案。

    - 收集相关信息。

    - 权衡后果。

    - 选择。

    - 采取行动。

    - 审查你的决策。


    ### 创造性思维

    创造性思维是以新方式考虑某些事的能力，例如对问题有新方法，或从数据集中获得新结果。这是一个你的大脑为问题产生新的、不寻常且高效的解决方案的过程。


    ### 如何培养创造性思维

    - 脑风暴创意。

    - 重新定义问题。

    - 保持开放灵活。

    - 使用你的想象力。


    ### 提高记忆力的方法

    - 读书。

    - 尝试鱼油补充剂（Omega 3）。

    - 保持健康体重。

    - 少喝酒。-- 运动。

    - 尝试冥想。

    - 喝咖啡。

    - 充足睡眠。

    - 少吃添加糖。


    ## 专业技能

    - 编程/编码。

    - 软件熟练度。

    - 项目管理。

    - 数据分析。

    - 技术。

    - 写作。

    - 会计。

    - 工程。

    - 医学。

    - 解决问题。


    ## 人际交往技能

    - 团队合作。

    - 沟通。

    - 职业道德。

    - 灵活与适应能力。

    - 决策。

    - 时间管理。

    - 冲突解决。

    - 倾听。

    - 谈判。

    - 同理心。

    - 果断。

    - 教练、教学和指导。


    ## 公开演讲

    信息、自信、公开演讲、金、增长、成功、财富……

    练习，练习，练习。


    ### 公开演讲规则

    - 研究并了解关于你主题的一切。

    - 计划并准备你的演讲。

    - 练习直到你感到自信。

    - 阅读你的担忧。

    - 视觉化成功。

    - 深度呼吸。

    - 关注你的演讲，而不是观众。

    - 不要害怕沉默。

    - 关注你的肢体语言。

    - 在演讲前喝杯水。

    - 在演讲当天补充咖啡因。

    - 积极思考。

    - 观看你的演讲录像。

    - 保持简单。

    - 与观众进行眼神交流。

    - 不要担心你的弱点。

    - 必须讲述故事。

    - 逻辑化地组织观点。

    - 练习带来自信。

    - 疯狂地研究你的主题。

    - 在演讲时放慢速度。

    - 你的演讲应该有 10 张幻灯片。

    - 演讲时间应该是 20 分钟。

    - 字体应该大于 30 号。

    - 尽早到达。

    - 在演讲前拉伸身体。

    - 在演讲前访问会场。

    - 准时结束。

    - 每一张幻灯片尽可能少用单词。

    - 明确你的演讲目标。


    ### 演讲类型

    - 信息性演讲。

    - 娱乐性演讲。

    - 演示演讲。

    - 说服性演讲。

    - 特殊场合演讲。

    - 演讲稿演讲。


    ### 演讲技巧

    - 流利度。

    - 词汇。

    - 发音。


    ## 谈判

    - 一切都是可以谈判的。

    - 在谈判前明确你想要什么。

    - 目标是实现双赢结果。

    - 不要个人化。

    - 使用沉默的力量。

    - 将公平的报价放在桌面上。

    - 如果报价不公平，就离开。

    - 不要做假设，提问。

    - 不要匆忙，保持耐心。

    - 不要接受糟糕的交易。

    - 不要过度谈判。

    - 不要让情绪主宰。

    - 不要走捷径。

    - 谈判前做好研究。

    - 完成你的作业。

    - 分别谈判每个部分。

    - 提供公平的方案。

    - 建立关系。

    - 从不同的角度思考。

    - 关注独特特征。


    ### 谈判阶段

    - 确定目的。

    - 准备。

    - 信息交换。

    - 讨价。

    - 结论。


    ### 谈判技能的好处

    - 职业发展和职业增长。

    - 冲突解决。

    - 解决问题。

    - 沟通。

    - 说服。

    - 销售。

    - 团队合作。


    ## 沟通

    信息、沟通、增长、成功和财富……

    倾听……倾听……

    能够有效且高效地沟通是成功最重要的技能之一。当你沟通时，确保你的信息是清晰、简洁、具体、正确且礼貌的。这些被称为沟通的七要素。有效的沟通不在于说而在于听。倾听意味着理解所传递的文字或信息，同时也理解演讲者试图传达的情绪。有效沟通可能是生活中最重要的技能，因为它让我们能够向他人传递信息并理解所说的话。信息是成功的中心，因为信息引导增长，持续增长带来成功，因此，接收和传递信息是成功的关键之一。


    ### 沟通失败

    沟通失败是误导性的、无效的或攻击性的信息。永远为了伤害而沟通，要为了增长而沟通。如果你愤怒并想对某人说伤害的话，请离开，记住你将在书中学到的情商。记住，要成功你需要获取一切信息，沟通是获取信息的关键策略之一。信息的危险之处会导致情绪，如果你不擅长控制情绪，就会遇到麻烦。诀窍在于，为了控制情绪你需要更多信息。


    ### 成为良好沟通者的技能

    - 倾听。

    - 肢体语言。

    - 压力管理。

    - 情绪控制。

    - 清晰与简洁。

    - 自信。

    - 同理心。

    - 开放心态。

    - 尊重。


    ### 如何传达坏消息

    - 眼神交流。

    - 尝试保持中立。

    - 做好准备。

    - 使用事实。

    - 不要谈判。


    ### 报告写作元素

    - 标题页。

    - 目录。

    - 执行摘要。

    - 引言。

    - 讨论。

    - 结论。

    - 建议。

    - 参考文献。


    ### 良好报告的特征

    - 简单。

    - 清晰。

    - 简洁。

    - 积极。

    - 标点符号。

    - 方法。

    - 可读性。

    - 准确性。


    ## 倾听

    沟通、倾听、信息、增长、成功和财富……

    不要打断。

    倾听是准确接收和解释传递给你的信息的能力。倾听是所有有效且高效沟通的关键。如果没有有效倾听的能力，信息很容易被误解，信息就会丢失。没有信息，成功就很容易实现。如果你想成功，倾听是你应该掌握的沟通技能之一。有效倾听有助于解决冲突、建立信任、激励他人、提高生产力并增长。在大多数对话中倾听，成为良好的沟通者并做出良好的决策。


    ### 如何倾听

    注意演讲者的语言和非语言语言，以完全理解他们表达的内容。倾听意味着在演讲者说话时不要打断。如果你想说些什么，请等演讲者说完。有效地倾听需要时间、精力和努力。


    ### 倾听和问题解决

    - 认真倾听。

    - 向人们请求反馈。

    - 疯狂地练习。

    - 不要立即回答。

    -  这需要花时间去思考。

    - 你的演讲应该有 10 分钟。

    - 只需要花时间去思考。


    ### 主动倾听

    主动倾听是一种要求倾听者完全专注、理解并记住所说内容的技术。主动倾听用于咨询、培训和解决纠纷。这被称为“鸭子效应”。


    ### 倾听的障碍

    干扰信息传递的障碍包括：

    - 内部想法。

    - 缺乏专注。

    - 环境噪音。

    - 选择性倾听。

    这是沟通中最大的问题之一。


    ### 倾听技巧

    - 注意。

    - 释义和总结。

    - 不要做判断或跳到结论。

    - 通过点头来倾听。

    - 提问。


    ## 教练

    目标、里程碑、教练、增长、成功……

    在正确的时间提供正确的信息。教练旨在提高表现，而不是关注过去或未来。


    ### 关键教练技能

    - 目标设定。

    - 倾听。

    - 同理。

    - 批判性思维。

    - 给予反馈。

    - 知识和经验。

    - 灵感。

    - 沟通技能。

    - 自我。

    - 开放心态与创造力。

    - 灵活与可靠。


    ### 领导风格

    - 交易型领导。

    - 变革型领导。

    - 服务型领导。

    - 民主型领导。

    - 独裁型领导。

    - 放任型领导。

    - 魅力型领导。

    - 愿景型领导。

    - 亲和型领导。

    - 节奏型领导。

    - 教练型领导。


    ## 教学

    教学是帮助人们理解和应用知识、概念和流程的过程。经理必须教、指导和教练人们如何实现目标。


    ### 良好老师的特质

    - 沟通技能。

    - 倾听技能。

    - 友好的态度。

    - 强烈的职业道德。

    - 组织能力。

    - 耐心。

    - 创造力。

    - 热情。

    - 信心。

    - 奉献。

    - 同理。

    - 领导技能。

    - 领域知识。


    ### 教学原则

    - 鼓励团队合作和个人工作。

    - 积极学习。

    - 给予反馈。

    - 沟通预期。

    - 尊重多元天赋。


    ### 如何教学

    - 告诉人们具体做什么。

    - 帮助修复。

    - 使用经验学习。

    - 推荐书籍。


    ### 学习类型

    - 通过听和说来学习。

    - 通过观察学习。

    - 通过触摸或感受学习。

    - 通过阅读学习。


    ### 如何记忆信息

    - 记住关键词。

    - 记住节奏或韵律。

    - 使用缩写词。

    - 查看图片或模式。

    - 对信息分类。

    - 使用数字。


    ### 阅读过程

    - 寻找主思想。

    - 理解单词。

    - 寻找相似点和差异。


    ## 指导

    指导是人之间分享信息，目标是职业和个人发展。导师通常与经验较少的人（学员）分享信息、经验和建议。


    ### 指导类型

    - 一一对指导。

    - 远程指导。

    - 小组指导。

    - 情境指导。

    - 发展和职业指导。

    - 同伴指导。


    ### 良好导师的特质

    - 良好的倾听者。

    - 灵活。

    - 重视不同观点。

    - 知识渊博。

    - 不评判。

    - 能够给予反馈。

    - 诚实。

    - 有资源。

    - 良好的领导和管理技能。


    ### 成为导师的好处

    - 增加自信。

    - 增加自我意识。

    - 领导技能发展。

    - 强大的沟通技能。

    - 提高倾听技能。

    - 增加耐心。

    - 提高人际技巧。


    ## 天赋

    信息、技能、卓越、天赋、增长、成功、财富……

    每个人都有天赋。天赋是一种自然的天赋。你的天赋取决于你的思考、感受和行为方式。这就是为什么说天赋是一种自然现象，因为你已经拥有了它，你已经在以某种方式思考、感受和行为。你并不是出生就带有它，但你已经拥有了。你的思想、感受和行为赋予了你做和成为任何人的潜力。当你尝试了很多事情并发现你擅长的某件事时，你就找到了你的天赋。你的天赋可以成长并转变成更美好、更大的东西，取决于你沿路获取了什么种信息。天赋是你脑中信息的产物。


    '
- fmt: '

    Time is a very sensitive issue. Very sensitive. Everybody has 24 hours a day and
    depending on what you do with those 24 hours every day is what determines your
    success. Everything that you do in those 24 hours should revolve around you getting
    as much information as possible because information is indeed the center of success.


    When you sleep you should sleep knowing that you are recharging your mind so that
    the following day you will use that mind effectively to get as much information
    as possible. When you eat you should eat knowing that you''re energizing your
    body so that you will be able to have enough energy to inquire information. When
    you are wasting time with anything  you should know that that''s time wasted,
    and it puts you far away from success.


    ## Time Management Process

    - Set a clear goal.

    - Break your goal into smaller milestones.

    - Write A `To-Do List`.

    - Use the `80/20 Principle` to prioritize.

    - Minimize Distraction.

    - Read about what you are doing.

    - Review your day.


    ## Time management skills

    - Prioritizing.

    - Delegation.

    - Decision-making.

    - Goal setting.

    - Problem-solving.

    - Strategic, Critical and Analytical thinking.

    - Scheduling.


    ## How To Stop Procrastinating

    - Identify why you''re procrastinating.

    - Break down your goals into smaller milestones.

    - Set deadlines.

    - Use positive social pressure.

    - Reward yourself.

    - Rotate between two tasks every few minutes.

    - Eliminate distractions.

    - Start small to gain momentum.

    - Break down the hardest task.

    - Don''t be a perfectionist.

    - Don''t try to finish every task.

    - Set manageable goals.

    - Practice positive self-talk.

    - Formulate a plan of action.

    - Focus on your strengths.

    - Ask for help.

    - Read a lot.


    ## The 80/20 Lifestyle

    Information, Behaviour, Lifestyle, Growth and Success... Work `80%` of the time
    on `20%` of the tasks that give you `80%` rewards.

