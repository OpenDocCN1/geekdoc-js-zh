    成功是一种算法。


    ### 成长

    要在生活中取得成功，你必须不断成长。成长意味着不断向你的大脑输入信息。信息可以来自许多资源，如书籍、视频、音频等。这就是为什么大多数成功人士读的书都比任何人都要多。要获取信息，你需要物质材料和人。要从物质中获取信息，你需要具备管理时间、技术和金的能力。要从人那里获取信息，你需要具备激励、鼓励和与他人产生共情的能力。


    ### 信息

    没有什么知识不是力量。信息以不同的形式、形状和风格存在。在特定的时刻，你需要适合你的正确信息。你的大脑每秒都有不同的视角，这是因为你的大脑每秒都在通过所有的感官收集信息，因此你在一秒前收到的信息如果你在一秒后获取，感知会有所不同。这就是为什么你必须不断学习和成长。这也解释了为什么没有什么知识不是力量，因为当你的视角改变后，无关的信息在秒后可能变得相关。


    ### 管理技能

    为了能够处理时间、技术和金，你需要技术性技能，如规划、组织、设计和资源控制。这四项技能是关键的管理技能。如果你拥有卓越的管理技能，你将能够有效高效地利用你的资源，到足以获取使你获得成功的相关信息。


    ### 领导力

    为了能够激励、鼓励并与他人产生共情，你需要软技能，如沟通、倾听、诚信、团队合作等。这被称为领导力技能。如果你能有效运用领导力技能，你就能从人们那里获得你想要且与成功相关的所有信息。领导者必须意识到，人们需要被激励，需要被鼓励，并且通过健康和福祉来获得能量。


    ### 金钱

    生活中的每个人都需要收入来源。我们需要钱来生存。我们需要钱来购买食物、住所以及生活中所有必需品。最重要的是，我们需要钱来直接或间接地购买信息。这就是为什么生活中的大多数人会找工作或创业。关于找工作、赚钱和致富将在下文中详细解释。


    ### 技术

    技术是能够赋予人类获取信息巨大竞争优势的最大物质材料之一。这就是为什么信息技术正在改变世界，这也是为什么第四次工业革命实际上就是信息技术。能够让你更接近信息的技术才是值得保留的技术。


    ### 人

    大脑是人类身上一个非常复杂的器官。大脑存储了人类拥有的所有信息，为了让你能够获取这些信息，那个人必须处于正确的情绪状态。为了一个人处于正确的情绪状态，他们所有的需求都需要得到照顾，包括健康、能量和被激励的需求。


    ### 成功原则

    - 自学。

    - 明智地选择你的职业。

    - 每五年进行一次投资。

    - 还清坏债。

    - 避免生活方式膨胀。

    - 嫁给对的人。

    - 不要思考无用的事。

    - 行事前计划。

    - 失败是学习的机会。

    - 学习理财知识。

    - 管理好自己的事。

    - 利用税收优势。

    - 永远不要停止学习。

    - 机会永远在那里。

    - 思想和行动创造成功。

    - 成长，而不是竞争。

    - 引导你的思维向积极思考。

    - 为机会存钱。

    - 低于能力生活。

    - 每日跟踪支出。

    - 掌管自己的生活。

    - 不要指责，承担责任。

    - 志存。

    - 设置 SMART 目标。

    - 接受改变。

    - 精通时间管理。

    - 多和赢者在一起。

    - 照顾好你的健康。


    ### 领导力

    情商、管理、生产力、信息、成长、成功、财富……


    领导力处理人，管理处理其他资源。领导力是确保每个人都能有效高效地实现目标的能力。生活充满了让人们偏离计划并无法实现目标的问题。当问题出现时，就需要领导力和管理。领导力处理的是人，而不是问题。管理处理的是问题，而不是人。领导力在保持每个人专注、激励和赋予他们以提高生产力方面发挥着巨大作用。领导力的目标是确保每个人都感到平静。领导者应该更多关注人的福祉，而经理应该关注解决技术问题。


    ### 权威

    领导力不是为了解决技术性问题，那是经理的工作。经理的工作是确保他们消除每一个给人们生活带来压力的问题。领导者的工作是确保人们感到平静，因为知道经理正在解决问题并委派任务。这意味着领导者必须传达问题正在解决的信息，他们必须与人们产生共情，建立信任，如果问题没有得到解决，领导者将不得不解决可能出现的冲突。经理应该想出一个计划来解决技术问题并委派任务。这意味着你应该知道何时充当领导者，何时充当经理。如果你混淆了两者，你就完蛋了。领导力和管理都是技能，意味着它们是可以学习的。读读书就行。


    ### 管理与领导力

    事情通常不会按照计划进行，当发生这种情况时，你需要有人介入并确保问题得到解决（经理），并确保人们保持专注而不恐慌（领导者）。领导者必须给人们希望。这可以通过以身作则并设定一个让每个人关注的愿景来实现。设定需要关注的目标可以帮助人们一直坚持下去，因为他们知道有一个明确的目标要实现，即使短期内出现问题，人们也会持续努力直到实现目标。

