- fmt: '

    # Manage your time very well


    Applying for jobs is very time-consuming. You need to discipline and monitor yourself
    and record how many jobs you can apply for at a given time. Keep improving and
    be consistent.


    ## Accept rejection

    You will get many rejection emails from many companies. Don’t entertain rejection
    messages, you can learn more from the positive responses you get. I will show
    you how.


    ## Keep track of the responses you get

    Study every positive response you get from a company. Look at the job post again
    and compare it with your `CV`. Look for what your `CV` has in common with the
    job post. That’s why they gave you a positive response.


    ## Search for jobs left, right and center

    The problem with people who cannot find a job is that they apply for one job per
    day and then complain about the unemployment rate for the rest of the month. Apply
    for as many jobs as possible. Apply, apply and apply. Apply for at least 50 jobs
    per day.


    ## Continuously improve your Resume

    The important thing about applying for as many jobs as possible is that you get
    to study the job market and edit your resume accordingly. Don’t be afraid to modify
    your `CV`. Review and edit your resume every week. Literally every week.


    ## Learn from failed interviews

    The more you apply for jobs the more you will be called for interviews. That’s
    what I call creating your own luck. You are increasing your probability of getting
    job interviews. It is not magic, it’s statistics. You will fail interviews, that’s
    a given. Learn from your failure. It takes 16 job interviews to get your dream
    job.


    # Ways to Find a New Job Quickly


    ## Be strategic

    The strategy to getting your dream job is easy, apply for as many jobs as possible,
    monitor positive responses, edit your resume accordingly and keep applying. The
    more you apply, the more interviews you get. Remember, it takes 16 job interviews
    to get your dream job.


    ## Network

    Don’t network with the hope that the people you network with will give you a job.
    It can happen but that is not the goal. The fundamental goal of networking is
    that you get information that will change your perspective about job hunting.
    Failure starts in your mind. Networking will fix that.


    ## Screen for jobs

    If you are unemployed, then the only thing that should be open on your computer
    should be a job search engine. Search, search, search. Close this book and start
    searching for jobs. That’s how important it is.


    ## Know your skills

    Write down all the skills you have and tabulate them on your resume. Many people
    don’t do this. Huge mistake. Do it now. It makes your skills easier to see. If
    you don’t have technical skills then write soft skills e.g. communication, leadership,
    teamwork…


    ## Spend over 8 hours per day on job hunting

    If you are unemployed then make job hunting your full-time job. Give it 8 hours
    every day, including weekends. Unless of course, you are not serious about getting
    a job then you can take a break on weekends.


    # Job Search Tips


    ## Prepare your qualification certificates and your resume

    Your qualification certificates should be ready in case they ask for them, otherwise,
    just send your `CV` to apply for a job. Do not send your qualification certificates
    if they didn’t ask for them otherwise you are creating unnecessary work for the
    employers.


    ## Find your best job search engine

    The best search engine is the one that does not have advertisements, unnecessary
    clutter, and should be easy to use. You want to apply for jobs directly from employer
    sites so the best job search engine should have an option to filter job boards
    out so that you can focus on jobs directly from employer sites.


    ## Set goals

    Your goal is easy. Your goal is to get a job. Usually, it takes 16 interviews
    to get one job. And it 350 job applications to get one interview. Basically, you
    need 350 multiplied by 16 job applications to get one job. That’s what they call
    a SMART goal.


    ## Search online

    The 4th industrial revolution. The internet. That’s how we do. Learn about computers
    as much as you can. Apply for jobs online. That’s how we do things these days,
    I will write many books on technology. Grab one and educate yourself.


    ## Use social media

    Social media is a great tool for networking, and I mentioned above why networking
    is very important for job hunting. Use social media to join helpful groups and
    follow the right people especially job recruiters.


    ## Apply for government jobs

    A good thing about job search engines is that they bring all the jobs in one place.
    However, sometimes job search engines do not show government jobs. Make sure to
    look for them manually and apply. Left, right, and center.


    ## Ask for referrals

    Ask anybody you know to ask their managers if the is an opening at their workplace
    so that you can work there. It doesn’t hurt to try.

    If you are desperate to get a job fast, try applying for jobs that do not require
    experience these are usually assistant jobs and representatives’ jobs.


    # Motivation

    Motivation is the desire to achieve. Be it at work, in school, in sports, or in
    business, motivation can help you achieve goals and dreams.

