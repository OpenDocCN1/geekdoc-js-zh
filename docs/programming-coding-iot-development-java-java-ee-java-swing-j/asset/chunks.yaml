- fmt: '

    # Marketing Plan


    ## Target Market

    A target market is a group of consumers at which a product or service is aimed.
    Identifying the target market is an essential step for any company in the development
    of a marketing plan. Racpro’s target market will include up middle-class professionals
    who have a stable income, live a busy life and require a convenient and modern
    place to live. This will include small families that can buy the 3 bedroom apartments,
    investors who can buy and rent the apartments and single professionals or couples
    who just want a place to live. Racpro will also target real estate investors that
    buy properties at a discount pre-launch and then sell them at a high price after
    the development is complete to make a profit.


    ## Product

    A product is a tangible item that is put on the market for acquisition, attention,
    or consumption. Racpro’s products are newly built, high-quality, modern apartments
    which offer the following:

    * Prepaid meters for electricity and water.

    * 24-hour security with biometric access.

    * Fiber and DStv ready.

    * A modern lifestyle center.

    * Free eco-friendly appliances.

    * 1, 2 and 3-bedroom apartments.

    * Close to shopping centers, schools, medical...

    * Lifestyle center with free wi-fi.

    * Concierge.

    * Laundromat.

    * Training science gym with a trainer.

    * Outdoor fitness area.

    * Squash court.

    * Littlehill Montessori school.


    ## Price

    Price is defined as the amount of money expected, required, or given in payment
    for something. An appropriate price for the product can be determined through
    market research.


    ### Racpro’s Apartment Prices

    * 1 Bed, 1 Bath From R 939 900

    * 2 Bed, 2 Bath From R 1 419 900

    * 3 Bed, 2 Bath From R 1 838 155

    * No Bond And Transfer Costs


    ## Place

    The apartments will be located in the heart of Johannesburg close to the following:

    * Farmers’ Market

    * Greenstone Mall

    * Stoneridge shopping center

    * Flamingo Shopping Centre (Now Open)

    * Mall of Africa

    * Super seedlings garden center

    * Linbro business park

    * Longmeadow business estate

    * Sandton city

    * Melrose Arch


    ## Promotion

    Promotion is defined as the publicizing of a product or service to increase sales
    or public awareness. An important factor in the development of the business is
    an effective and creative marketing and promotion of the product. To be performed
    effectively the marketing and promotion require a coordinated and structured approach.
    Racpro will embark on a dynamic marketing campaign utilizing social media as an
    effective means of promotion. The Internet will be used as a primary source of
    advertising and promotion.


    ## SWOT Analysis

    A SWOT analysis is a study undertaken by an organization to identify its internal
    strengths and weaknesses, as well as its external opportunities and threats.


    ### Strength

    A strength is a good or beneficial quality or attribute of a person or thing.

    * Urbanization and growing middle-class.

    * Few competitors due to high startup costs.

    * Building modern apartments with lifestyle centers.


    ### Opportunity

    Opportunities refer to favourable external factors that could give an organization
    a competitive advantage.

    * Acquire more land.

    * Huge potential for market share.

    * Expand into another urban metro.

    * Build partnerships with other property companies.

    * Development of government-owned land.

    * Grow black economic empowerment, become diversified and get the benefits.


    ### THREATS

    Threats refer to factors that have the potential to harm an organization.

    * Financial depression due to Covid19.

    * Corrupt government can scare away investors.

    * Loss of key staff due to Covid19 impact.

    * Increase in unemployment decreases demand.

    * Changes in property tax legislation.


    ### WEAKNESSES

    Weakness is defined as a disadvantage or fault.

    * Huge startup cost.

    * Huge risks.

    * Regional business (covering Gauteng only).


    ## Competitive Analysis

    A competitive analysis is an assessment of the strengths and weaknesses of current
    and potential competitors. This analysis provides both an offensive and defensive
    strategic context to identify opportunities and threats (Czinkota & Ronkainen,
    2010). Key differentiators in Racpro’s build-to-sell model comprise the ability
    to deliver a superior offering through economies of scale and create lifestyle
    centers within the complex. Other real estate developers do not offer huge lifestyle
    centers like Racpro where property owners can have family time and have enough
    fun activities to do within the complex. Racpro will build lifestyle centers within
    the complex which will have free wi-fi, concierge service, heated swimming pools,
    playgrounds, spa, restaurant, gym, squash court, action sports fields and running
    tracks. This will ensure that children and parents have fun within the complex
    without the need to go out thus saving money, time, energy and effort. Racpro
    will also develop partnerships with relevant stakeholders and competitive pricing
    of developed units in-line or below market.


    ## Marketing And Sales Plan

    Sales and marketing is performed in-house (no external estate agents). Sales and
    marketing marketing will include the following tasks:

    * Showing unit interior design.

    * Creating brochures, pamphlets and newspaper ads.

    * Racpro provides in-house bond origination services to its customers.

    * The company has agreements with all major South African banks, and acts as a
    broker in the bond origination process.

    * Commissions are earned by the Company through this process.


    ## Corporate Social Responsibility

    Racpro is fully committed to the principles of good corporate and socially responsible
    practice. These principles are reflected in Racpro’s approach and focus on supplier
    development, specifically the development of its sub-contractors and their employees.
    Racpro is committed to the development of its staff through company training programs,
    as well as on-the-job training and it is focused on the development of previously
    disadvantaged individuals within its employment. Racpro participates in various
    initiatives within the communities where Racpro operates, including an annual
    charity event to benefit various foundations and non-government organizations.


    ## Operations Plan


    ### Long Term Objective

    Long-term objectives are specific results that an organization seeks to achieve
    in perusing its basic mission. Long-term objectives represent the results expected
    from perusing certain strategies. Racpro aims to address the need of South Africans
    to get secure, high quality, newly developed, value-for-money, convenient houses
    without the homeowner having to involve themselves in the cumbersome day-to-day
    management of building their dream home. Racpro will cater to the large section
    of South Africa’s population that cannot afford the high-income lifestyle estate
    but desire to achieve the same level of convenience and amenities within the R599,999
    – R699,999 price range by creating sectional title.


    ### Strategic objectives for the next five years

    * Offer pre-launch sales at discount.

    * Launch the development.

    * Acquire land and build.

    * Partner with other property companies.

    * Support and grow black economic empowerment.


    ## Industry Description

    Industry description helps a company to understand its position relative to other
    companies that produce similar products or services which can help identify threats
    and opportunities. Africa''s residential sector is growing due to urbanization
    and strong demand for quality housing by the growing middle-income population.
    Financial institutions are willing to extend mortgage to homeowners to acquire
    property. Properties situated in secure lifestyle estates represent an estimated
    total value of R643 billion. Approximately 12% of South Africa’s registered property
    comprises sectional-title units, with another 3% representing estate developments.
    In the last 20 years, flats and townhouses have made up 26% of newly completed
    buildings and 63% of all residential units by sectional-title. Approximately half
    of all estates are located in Gauteng, with a further 25% in the Western Cape.

    * Growing urbanization.

    * Growing middle-income population.

    * Residential property as an investment.

    * Increasing need for safe housing.

    * Bank''s appetite to extend mortgage.


    ## Key Success Factors

    Key success factors are the competitive emphasis or strategic posture of the organization
    required for a company to compete in its target market and what the company must
    do well to achieve the goals outlined in its strategic plan (Bennett & Blythe,
    2010). Racpro''s key factors:

    * The company will have to secure business loan

    * Acquire land at a discount (10% off).

    * Acquire 30% pre-launch sales.

    * Complete the development within 12 months.


    ## Growth Potential

    Growth potential is an organization’s future ability to generate larger profits,
    expand its workforce and increase production.


    ## Identification Of Potential Strategies

    The Company aims to continue with the roll-out of further large-scale sectional-title
    residential developments in its target nodes and plans on expanding its operations
    into additional new and growing residential nodes within South Africa’s major
    cities. Availability of commercial capital, the pace of commercial property development,
    the city’s transport, improvement plans, the large middle-income population, population
    expansion and urban migration rates.


    ## Evaluation Of Potential Strategies

    Even though these strategies might be costly reaching more people would mean that
    Racpro will grow its brand and become a trusted real estate developer instead
    of a one-time developer. Building a strong brand will attract investors which
    will make expanding to new metros a possibility.


    ## Financial Plan

    Capital can be defined as the money used to start a business or invested in a
    business to make more money. Capital can be used for buildings, machinery, etc.
    which necessary. Racpro will receive development finance from three of South Africa’s
    largest financial institutions, namely: `Investec`, `Nedbank` and `Absa`.


    ### Financial Projections

    A financial projection is a forecast of future revenues and expenses. This is
    an extremely difficult exercise as estimates will have to be done and projections
    have to be made. In total, 100 apartments will be sold.


    15 apartments are to be sold at 10% discount (pre-launch sales):

    * 5 one bedroom apartments x (`R 939 900 * 0.1`)

    * 5 two bedroom apartments x (`R 1 419 900 * 0.1`)

    * 5 three bedroom apartments x (`R 1 838 155 * 0.1`)


    75 apartments are to be sold at normal price:

    * 25 one bedroom apartments (`R 939 900 * 25`)

    * 25 two bedroom apartments (`R 1 419 900 * 25`)

    * 25 three bedroom apartments (`R 1 838 155 * 25`)


    ## Management Plan or structure

    Racpro performs many of the functions related to development design in-house,
    drawing on its many years of experience in this field. Necessary professional
    services are outsourced, including architects, engineers, environmental consultants
    and land surveyors. Racpro’s management team is led by the Company’s CEO and founder,
    `Jay Brookes`. All aspects of the development, sales and management process are
    conducted in-house except for specific services which are outsourced to specialists
    with oversight by Racpro. An experienced and hands-on management team with over
    20 years of experience in the large-scale residential market will be appointed.


    ## Job Interviews

    For every job you find, you will have to ace the interview. An interview is nothing
    else but a conversation between you and the interviewers so that they can get
    to know your personality. In this case, your personality means your skills, qualifications
    and experience. Therefore, it is very important to write down a summary of skills,
    qualification and experience before you go to the interview. This will help you
    organize your thoughts to clearly understand yourself and how you fit the position
    that you are applying for. Also, this will help you be clear and have confidence
    in your answers. Never doubt your skills, qualification and experience, the fact
    that you have been called for an interview means that the company has seen your
    `CV` and they like it just the way it is.

