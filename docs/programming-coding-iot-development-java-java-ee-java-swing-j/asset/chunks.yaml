    # 营销计划


    ## 目标市场

    目标市场是指针对某一产品或服务的消费者群体。识别目标市场是任何公司制定营销计划的至经步骤。Racpro 的目标市场将包括拥有稳定收入、生活忙碌且需要便利现代居住环境的中产阶级专业人士。这包括可以购买三居室公寓的小型家庭、可以购买并租赁公寓的投资者，以及仅需要一个住地的单身专业人士或情侣。Racpro
    还将针对房地产投资者，他们会在开售前以折扣价购买房产，并在开发完成后以高价出售以获利。


    ## 产品

    产品是投放市场以供获取、关注或消费的实物。Racpro 的产品是新建的高质量现代公寓，提供以下功能：

    * 电力和水费预付费水表。

    * 24 小时生物识别访问的安全保障。

    * 预留光纤和 DStv。

    * 现代生活方式中心。

    * 免费的环保电器。

    * 1、2 和 3 卧室公寓。

    * 靠近购物中心、学校、医疗机构……

    * 免费 Wi-Fi 的生活方式中心。

    * 礼宾服务。

    * 洗衣店。

    * 带有教练的科学健身房。

    * 户外健身区。

    * 壁球场。

    * Littlehill 蒙特梭利学校。


    ## 价格

    价格定义为支付某物时预期、要求或给出的金额。可以通过市场研究确定产品的合适价格。


    ### Racpro 公寓价格

    * 1 室 1 卫从 R 939 900 起

    * 2 室 2 卫从 R 1 419 900 起

    * 3 室 2 卫从 R 1 838 155 起

    * 免房贷贷款和转让费用


    ## 地点

    公寓将位于约翰内斯堡市中心，临近以下地点：

    * 农民市场

    * Greenstone 购物中心

    * Stoneridge 购物中心

    * Flamingo 购物中心（现已开放）

    * Africa Mall

    * Super seedlings 苗圃中心

    * Linbro 商务园区

    * Longmeadow 商务园

    * Sandton city

    * Melrose Arch


    ## 推广

    推广定义为通过宣传产品或服务来增加销售或提高公众意识。业务发展的一个重要因素是有效且创新的产品营销和推广。为了有效执行，营销和推广需要协调且结构化的方法。Racpro
    将开展一场动态营销活动，利用社交媒体作为有效的推广手段。互联网将作为广告和推广的主要来源。


    ## SWOT 分析

    SWOT 分析是组织进行的一种研究，旨在识别其内部优势和劣势，以及外部机会和威胁。


    ### 优势

    优势是指人或事良好或有益的品质或属性。

    * 城市化和不断增长的中产阶级。

    * 成本高，竞争者较少。

    * 带有生活方式中心的现代公寓。


    ## 机会

    机会是指可能为组织带来竞争优势的外部因素。

    * 获取更多土地。

    * 巨大的市场份额潜力。

    * 扩展到另一个大都市。

    * 与其他房地产公司建立合作伙伴关系。

    * 政府土地的开发。

    * 扩大黑人经济赋权，实现多元化并获益。


    ## 威胁

    威胁是指可能损害组织的因素。

    * Covid19 导致的经济衰退。

    * 腐败的政府可能会吓跑投资者。

    * Covid19 影响导致关键员工流失。

    * 失业率增加导致需求。

    * 房产税法规的变化。


    ## 劣势

    劣势定义为缺点或缺陷。

    * 巨大的启动成本。

    * 巨大的风险。

    * 区域性业务（仅涵盖豪滕省）。


    ## 竞争分析

    竞争分析是对当前和潜在竞争对手优劣势的评估。这种分析提供了进攻和防御策略背景，以识别机会和威胁（Czinkota & Ronkainen, 2010）。Racpro
    现房模式的核心差异化特征在于通过规模效应提供卓越的产品，并在建筑群内创建生活方式中心。其他房地产开发商没有像 Racpro 那样的大型生活中心，房主可以在小区内享受家庭时光，并有足够的活动可以进行。Racpro
    将小区内建立生活方式中心，那里将有 Wi-Fi、礼宾服务、恒温游泳池、游乐场、水疗、餐厅、健身房、壁球场、运动场和跑步道。这将确保孩子和父母在小区内玩耍无需出门，从而节省金钱、时间、精力和努力。Racpro
    还将与相关利益相关者建立合作伙伴关系，并使开发单元的价格与市场同步或低于市场。


    ## 营销与销售计划

    销售和营销在内部执行（不使用外部房地产代理）。销售和营销将包括以下任务：

    * 展示单元内部设计。

    * 制作手册、小册和报纸广告。

    * Racpro 为客户提供内部贷款贷源服务。

    * 公司与南非所有主要银行均有协议，并在贷款贷源过程中充当经纪人。

    * 公司通过这一过程赚取佣金。


    ## 企业社会责任

    Racpro 全力致力于良好的企业和社会责任实践原则。这些原则反映在 Racpro 的经营方法以及对供应商开发的关注上，特别是对其分包商及其员工的发展。Racpro
    致力于通过公司培训计划以及在职培训发展其员工，并关注其雇中此前处于弱势的人士的发展。Racpro 参与其运营社区内的各种倡议，包括有利于各种基金会的慈善活动。


    ## 运营计划


    ### 长期目标

    长期目标是组织寻求通过其基本使命实现的特定结果。长期目标代表了通过某些策略预期的结果。Racpro 旨在解决南非人对安全、高质量、新开发的、物有所值的住房的需求，而房主无需参与琐碎的管理。在
    R599,999 – R699,999 的价格范围内提供同样的便利设施。


    ### 未来五年的战略目标

    * 折扣价预售。

    * 启动开发。

    * 获取土地并建设。

    * 与其他公司合作。

    * 支持黑人经济赋权。


    ## 行业描述

    行业描述有助于公司了解其相对于生产类似产品或服务的公司的地位，有助于识别威胁和机会。南非住宅部门由于城市化和对住房的强劲需求正在增长。金融机构愿意为房主提供贷款。注册的房产预计总价值为
    643 亿。南非注册的房产约 12% 是分产权单元，另一部分代表开发项目。大约一半的住宅位于豪滕省，另外 25% 在西开省。

    * 城市化。

    * 中产阶级人口增长。

    * 住宅作为投资。

    * 对安全住房的需求。

    * 银行的贷款意愿。


    ## 关键成功因素

    关键成功因素是公司在目标市场竞争所需的组织或姿态，以及公司必须为实现战略中所概述的目标（Bennett & Blythe, 2010）。Racpro 的关键因素：

    * 公司将获得贷款

    * 折扣获取土地（10% off）

    * 30% 的预售

    * 在 12 个月内完成开发


    ## 增长潜力

    增长潜力是组织未来产生更多利润、扩大劳动力和增加生产的能力。


    ## 潜在策略识别

    公司旨在继续在目标区域推出大规模的分产权住宅，并计划将其业务扩展到南非的主要城市。商业资金的可用性、商业地产开发的速度、交通、改进计划、人口增长以及人口迁移率。


    ## 潜在策略评估

    尽管这些策略可能成本很高，但接触更多的人意味着 Racpro 将发展其品牌并成为一个信赖的房地产开发商。建立强大的品牌将吸引投资者，使扩展到新大成为可能。


    ## 财务计划

    资本可以定义为启动业务或投资业务以赚取更多资金的钱。资本可用于建筑、机械等。Racpro 将从南非三大金融机构获得开发资金，即：`Investec`、`Nedbank`
    和 `Absa`。


    ### 财务预测

    财务预测是对未来收入和支出的预测。这是一项极其困难的任务，因为必须进行估计并做出预测。总共将出售 100 套公寓。


    15 套公寓将以 10% 折出售（预售）：

    * 5 套一室公寓（R 939 900 * 0.1）

    * 5 套双室公寓（R 1 419 900 * 0.1）

    * 5 套三室公寓（R 1 838 155 * 0.1）


    75 套公寓将按售价出售：

    * 25 套一室公寓（R 939 900 * 25，*注：此处原文数字逻辑可能有误，翻译按原样保留*）

    * 25 套双室公寓

    * 25 套三室公寓


    ## 管理计划或结构

    Racpro 得益于其在该领域的多年经验，在内部执行许多与开发设计相关的职。必要的专业服务将外包，包括建筑师、工程师、环境顾问和测量师。Racpro 的管理团队由公司
    CEO 兼创始人 `Jay Brookes` 领导。开发、销售和管理过程的所有方面都在内部进行，特定服务外包给在 Racpro 监督下的专家。公司将聘请一个拥有超过
    20 年大型住宅市场经验的丰富实践管理团队。


    ## 工作面试

    对于你找到的每份工作，你都必须通过面试。面试无非你与面试官之间的对话，以便他们了解你的性格。在这种情况下，你的性格意味着你的技能、学历和经验。因此，在参加面试之前写一份技能、学历和经验的总结是非常重要的。这将帮助你组织思路，清晰地了解自己以及你如何适合申请的职位。此外，这将帮助你在回答时清晰且充满自信。永远不要怀疑你的技能、学历和经验，被约意味着公司已经看了你的
    `CV` 并且他们喜欢它现在的样子。

    '
- fmt: "\n# 1. They want to confirm their thoughts about you being the best candidate.\n\
    \nRemember the company has a gap in their team that they are trying to fill, and\
    \ they already have a mental image of the kind of person they are looking for.\
    \ The good news is, if they called you for an interview then that means that they\
    \ think you have the personality they are looking for, so they would like to confirm\
    \ what they think by asking you a series of questions. \n\nThese questions are\
    \ what make up an interview and may either be behavioral or competency type of\
    \ questions depending on what the company thinks is more important for that particular\
    \ “gap”. So, it is very important to know what kind of candidate they are looking\
    \ for and present yourself accordingly so that they see that you are the kind\
    \ of fellow they are looking for. \n\nTo do this, study the company’s requirements\
    \ for that position and match them with your skills, qualification and experience;\
    \ e.g. if the company needs some experience in `SQL` then check if your CV has\
    \ `SQL`. This will help you understand what kind of fellow they are looking for\
    \ and how close are you to be that fellow. \n\nIf you feel like you don’t have\
    \ most of the requirements that they are looking for, just remember one thing:\
    \ they already know that you don’t have the qualities that they are looking for\
    \ and they still think that you are the best person for the job, so just prepare\
    \ thoroughly for the interview and you won’t go wrong.\n\n# 2. They want you to\
    \ support and give evidence of what you were telling them in your CV\n"
