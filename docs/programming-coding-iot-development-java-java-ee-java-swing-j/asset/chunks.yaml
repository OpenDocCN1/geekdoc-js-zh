    Motion.  • Non-utilized talent.Benefits Of Lean Management• Focus.• Improved productivity,
    efficiency & effectiveness.• Smarter processes (pull system).• Efficient and effective
    use of resources.Lean Tools• 5s.• Kaizen.• Kanban.• Value stream mapping.• Visual
    factory.• Smart goals.• Gemba.• Muda.The 3 Pillars Of Kaizen• Housekeeping.• Elimination
    of waste.• Standardization.KanbanProduct Idea, Production, Kanban, Profit, Money,
    Growth, Success, Wealth...Continuous Improvement.Kanban is a framework used to
    optimize production processes which requires work items to be represented visually
    on a Kanban board, allowing team members to see the state of every piece of work
    at any time and allows for real-time communication and full transparency of workflow.
    The workflow can be visualized by using sticky notes on a whiteboard which is
    what the word Kanban stands for in Japanese, "Kan" means "visual" and "ban" means
    "card" meaning visual cards.Kanban methodologies are continuous and more fluid,
    whereas scrum is based on short and structured work sprints. Kanban is aimed at
    optimizing the production flow by regulating the supply of raw material and delivering
    what the process needs exactly when it needs it. It controls inventory by pulling
    supplies to the production floor based on customer demand and limits the number
    of work items that can exist in the production process at any given step at any
    given time. It is usually used in just-in-time (JIT) manufacturing processes.
    One of the first principles of Kanban is to make small incremental changes to
    existing processes instead of drastic changes that might lead to a high risk of
    failure.Kanban is designed to reduce the idle time in a production process by
    visualizing the production process and the actual work passing through that process
    to identify potential bottlenecks in the process and fix them so work can flow
    through it cost-effectively at an optimal speed or throughput.Rules Of Kanban•
    Never pass defective products.• Use only what''s needed.• Produce only the quantity
    that is required.• Improve production process (Optimization).• Limit work in progress
    (WIP).• Manage workflow.• Make process explicit (Visual Boards).• Implement feedback
    loops.• Visualize workflow.• Practice continuous improvement.Benefits Of Kanban•
    Flexibility.• Reduction of time waste.• Increased productivity and efficiency.•
    Increased focus on continuous delivery.• Spot workflow bottlenecks.• Limit work
    in progress and focus.• Save time wasted on unnecessary meetings.• Visualize workflow
    blockers on the Kanban board.• Automate work processes.Organize Your Life with
    Kanban• Create a daily to-do list.• Write down your ideas.• Create a weekly plan.•
    Create a family board.Designing The Kanban Board• Visualize and map the workflow.•
    Set limits on your work in progress (WIP).• Use sticky notes to put your WIP on
    the board.• Inspect, adapt and improve.When To Use Kanban• On repeatable workflow
    that can be visualized.AccountingBusiness, Accounting, Finance, Profit, Growth,
    Success, Wealth...Accounting is the language of business.Accounting is the collection,
    compilation, and systematic recording of financial transactions of a business
    to produce financial statements which are used to give a concise summary of financial
    transactions over a certain period. Financial statements summarize a company''s
    financial position and cash flows. The three main financial statements are a balance
    sheet, an income statement, and a cash flow statement. The balance sheet is a
    report version of the main accounting equation (Assets = Liabilities + Equity).
    The accounting equation is the proposition that a company''s assets must be equal
    to the sum of its liabilities and equity.Accounting is the language of business
    and helps organizations understand their financial health. Accountants are responsible
    for keeping track of expenses, profits, and losses by making use of the accounting
    equation: Assets = Liability + Equity. Accountants prepare financial reports,
    analyze and interpret these reports, and use them for information and guidance
    in managing the business.Accounting doesn’t require hard-core math. Basic addition,
    subtraction, multiplication, division, and business knowledge are enough. You
    don''t need algebra or calculus. However, accounting is a bit more difficult to
    master than finance due to its strict sets of arithmetic rules. Finance requires
    an understanding of economics as well as some accounting. Types Of Accounting•
    Financial accounting.• Cost accounting.• Auditing.• Managerial accounting.• Tax
    accounting.• Forensic accounting.• Fiduciary accounting.• Governmental accounting.•
    Forensic accounting.• Corporate accounting.• Public accounting.• Government accounting.•
    Forensic accounting.Financial AccountingFinancial accounting is a specific branch
    of accounting  that provides information about a firm''s performance to external
    parties such as investors, creditors, and tax authorities.Cost AccountingCost
    accounting is a process of assigning costs to cost objects such as the company''s
    products, services, and any other activities that involve the company which is
    helpful because it can identify where a company is spending its money and where
    money is being lost.Tax AccountingTax accounting deals with the preparation of
    tax returns and tax payments. It is used by individuals, businesses, corporations,
    and other entities focusing on income, qualifying deductions, donations, and any
    investment gains or losses.Managerial AccountingManagerial accounting is responsible
    for creating statements, reports, and documents that help management in making
    better decisions related to their business performance.Fiduciary AccountingFiduciary
    accounting is a report of activities within a trust, estate, or conservatorship
    during a specific time period to show all receipts and expenses managed by the
    executor or trustee.Government AccountingGovernment accounting is the accounting
    system followed by the government for recording, classifying, summarizing, and
    interpreting the financial transactions of the government.Forensic AccountingForensic
    accounting is the use of accounting principles, auditing principles, and investigative
    skills to examine the finances of an individual or business to look for fraud
    and embezzlement to explain the nature of financial crime in court.Corporate AccountingCorporate
    accounting is a special branch of accounting that deals with preparing cash flow
    statements and interpreting financial results for specific events.Private And
    Public AccountingPublic accountants and public accounting firms are not employed
    solely by any one client, and as such, they are not part of the client''s business
    or corporate structure. Private accountants, on the other hand, work for a specific
    company or business entity for which they offer accounting services.Accounting
    Process• Identify transactions.• Record transactions in a journal.• Post journal
    entries to the general ledger.• Adjust journal entries.• Prepare financial statements.•
    Close the books.Main Accounting Keywords• Assets• Liabilities• Equity• Revenue•
    ExpensesGolden Rules Of Accounting• Debit the receiver, credit the giver.• Debit
    what comes in, credit what goes out.• Debit all expenses and losses and credit
    all incomes and gains.Accounting Software• Billing/ Invoicing Software.• Payroll
    management system.• ERP Systems.Accounting EntryAn accounting entry is the formal
    recording of all the transactions in the book of accounts of the company where
    the debit and credit are recorded. The main types of accounting entries are transaction
    entry, adjusting entry, and closing entry. Every transaction has two journal entries:
    a debit and a credit. Debits must always equal credits. This double-entry technique
    (debits equal credits) helps in preventing some common bookkeeping errors.Types
    Of Journal Entries• Simple entry• Compound entry• Opening entry• Transfer entries•
    Closing entries• Adjustment entries• Rectifying entries.Simple EntryA simple journal
    entry is an accounting entry in which just one account is debited and one is credited.Compound
    EntryA compound journal entry is an accounting entry in which the is more than
    one debit and more than one credit.Transfer EntryA transfer is a type of journal
    entry used to move funds from one project account to another or from an operating
    account to a project account.Adjusting EntriesAdjusting entries are made at the
    end of the accounting period after a trial balance has been prepared. Adjusting
    entries enable you to adjust revenues and expenses to the accounting period within
    which they occurred. When an error is committed in the books of accounts the error
    should be corrected to show true numbers in financial statements. If the error
    is immediately identified it may be fixed by striking out the wrong entry and
    replacing it with a correct one.Accounting Principles• Accrual principle.• Conservatism
    principle.• Consistency principle.• Cost principle.• Economic entity principle.•
    Full disclosure principle.• Going concern principle.• Matching principle.Accrual
    Principle.The general concept of accrual accounting is that you record the expense
    at the time when the transaction occurs rather than when payment is made or received
    meaning that you record revenue when you invoice the customer, rather than when
    the customer pays you.Conservatism PrincipleAccounting conservatism is a principle
    that requires company accounts to be prepared with caution and high degrees of
    verification. All probable losses are recorded when they are discovered, while
    gains can only be registered when they are fully realized. It is concerned about
    the reliability of the Financial Statements of an entity.Matching PrincipleThe
    matching principle is part of the Generally Accepted Accounting Principles (GAAP)
    and it requires that any business expenses incurred must be recorded in the same
    period as related revenues to maintain the cause-and-effect relationship between
    spending and earning.Going Concern PrincipleThe going concern principle is the
    assumption that an entity will remain in business for the foreseeable future and
    the value of an entity that is assumed to be a going concern is higher than its
    breakup value since a going concern can potentially continue to earn profits.Full
    Disclosure Principle.The full disclosure principle states that publicly traded
    companies should release and provide all material facts that are relevant to their
    ongoing business operations.Economic Entity PrincipleThe economic entity principle
    states that the recorded activities of a business entity should be kept separate
    from the recorded activities of its owner(s) which will make audit easier and
