    # Kanban

    Product Idea, Production, Kanban, Profit, Money, Growth, Success, Wealth...

    Continuous Improvement.

    Kanban is a framework used to optimize production processes which requires work
    items to be represented visually on a Kanban board, allowing team members to see
    the state of every piece of work at any time and allows for real-time communication
    and full transparency of workflow. The workflow can be visualized by using sticky
    notes on a whiteboard which is what the word Kanban stands for in Japanese, "Kan"
    means "visual" and "ban" means "card" meaning visual cards. Kanban methodologies
    are continuous and more fluid, whereas scrum is based on short and structured
    work sprints. Kanban is aimed at optimizing the production flow by regulating
    the supply of raw material and delivering what the process needs exactly when
    it needs it. It controls inventory by pulling supplies to the production floor
    based on customer demand and limits the number of work items that can exist in
    the production process at any given step at any given time. It is usually used
    in just-in-time (JIT) manufacturing processes. One of the first principles of
    Kanban is to make small incremental changes to existing processes instead of drastic
    changes that might lead to a high risk of failure. Kanban is designed to reduce
    the idle time in a production process by visualizing the production process and
    the actual work passing through that process to identify potential bottlenecks
    in the process and fix them so work can flow through it cost-effectively at an
    optimal speed or throughput.


    ## Rules Of Kanban

    - Never pass defective products.

    - Use only what''s needed.


    ## Benefits Of Kanban

    - Flexibility.

    - Reduction of time.

    - Increased productivity.

    - Visualize workflow.


    ## Organize Your Life with Kanban

    - Create a daily-do list.


    ## Designing The Kanban Board

    - Set limits on work in progress (`WIP`).

    - Use sticky notes to put `WIP` on the board.


    ## When To Use Kanban

    - Repeatable workflow.


