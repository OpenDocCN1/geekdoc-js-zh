- fmt: "\n# Question: Describe a major goal that you have set for yourself.\n\n**Notes**:\
    \ Make sure that you answer with a goal related to the job the you are applying\
    \ for. Clearly state your goal and why you consider it a major goal. Show how\
    \ you achieved this goal.\n\n**Answer**: One of the biggest goals I had set for\
    \ myself this year was to write a blog about the skills and equipment that analytical\
    \ chemists use. The action that I took was that I spent a month researching and\
    \ studying how to write and publish a blog then I spent three more months collecting\
    \ and studying articles about analytical chemist and the equipment they use. Then\
    \ after four long months of research and studying I designed, wrote and published\
    \ my blog. Now my blog is active and helping people around the world. Who wouldn’t\
    \ want to hire this person?\n\n## Question: What motivates you at the workplace?\n\
    \n**Notes**: Everyone has their own source of motivation, either from friends,\
    \ family, books, etc. Motivation is one of the keys to success. The work environment\
    \ can build or destroy your motivation. The interviewers ask this question because\
    \ the want to know if you will be motivated in their environment or not. Answer\
    \ appropriately, do not say that you get motivated by being outdoors while the\
    \ position that you are applying for is for a bank teller. The best way to answer\
    \ this question is to look at what qualities company has and state this as your\
    \ motivators or look at the positive things that the position has to offer and\
    \ state this as motivators.\n\n**Answer**: Getting the job done is what motivates\
    \ me. I am a kind of person who always keeps a list of what to do and every time\
    \ I complete a task, I scratch it off. These makes me feel good and motivated\
    \ and feel like working more. The more tasks I complete, the more I get motivated.\n\
    \n## Question: What did you dislike about your previous colleagues?\n\n**Answer**:\
    \ Nothing, I consider myself lucky to have worked with a team of nice people.\
    \ Everyone tried to be considerate, which is what I appreciated the most about\
    \ them and which is why I am thankful.\n\n## Question: What issues did you have\
    \ with your previous boss?\n\n**Notes**: Hopefully you did not have issues with\
    \ your previous boss so that you do not have to lie. If you did then you have\
    \ to say it in such a positive way that it does not look like an issue. The way\
    \ I see it, you do not have any issues with your previous boss.\n\n**Answer**:\
    \ I never had problems with my previous boss at all; actually, we were in good\
    \ terms with each other. I am extremely good at building rapport with management.\
    \ To be in good terms with your boss you have to do exactly what they tell you,\
    \ work extra hard and communicate well.\n\nWhen I was still a new employee at\
    \ `Rampsy Consulting Company` my manager asked me to do dissolutions and read\
    \ them on the `UV machine`. I did exactly that and I reported the results exactly\
    \ the way they were. The problem was that the results for that product were too\
    \ low and they were failing but I was still new, and I did not know what to do\
    \ so I just reported the results anyways. My boss was angry at me and said I should\
    \ have done the analysis again and if the product still failed, I should have\
    \ written an `out of specification report`. \n\nTo solve this problem, I let my\
    \ boss cool off, and then I stayed at work after everybody had left and did the\
    \ product again exactly as asked. The following day I apologized for my mistake\
    \ and I told him that next time I will make sure that I communicate with him effectively\
    \ and confirm everything with him. After about three months there was no need\
    \ for me to confirm anything with him anymore, I knew everything there is to know,\
    \ and he trusted me.\n\n## Question: Why should we hire you?\n\n**Yes**, this\
    \ is not an easy question to answer.\n\n**Answer**: Because my personal skills\
    \ fit the job perfectly. I have been told by my former supervisor from `Rampsy\
    \ Consulting Company` that I am a good communicator and I always achieve good\
    \ results as you can see on my reference letter (provide the reference letter).\
    \ Also, my current supervisor at the `South African weather Service` has scored\
    \ me 100% on communication, teamwork and problem-solving skills as you see on\
    \ my biannual assessment (provide hard prove). I can use these skills to build\
    \ rapport with students, staff and management. Do not answer this question like\
    \ this if you cannot provide evidence because you will sound generic. If you do\
    \ not have written evidence the you need to give your evidence in a form of success\
    \ story like the in the alternate example below.\n\n**Alternate answer**: Because\
    \ I do whatever it takes to finish the job and get good results. I used to work\
    \ even when I was off at the `South African Weather Service`. I remember in December\
    \ 2015 the rain gauge broke and it was my day off. The person who was on day shift\
    \ was supposed to fix the rain gauge but because I knew that it is almost impossible\
    \ to fix the gauge alone, I went to the office and we spent the whole day fixing\
    \ the rain gauge together. After we were done, the rain gauge was working perfectly.\
    \ When compared to the automatic rain gauge the difference was only `0.003 mm`,\
    \ which is close to zero.\n\n**Alternate answer**: Because I do whatever it takes\
    \ to finish the job and get good results. In 2012 I set myself a goal to publish\
    \ a blog. Before the end of 2012, my blog was up and running. In 2013, my goal\
    \ was to just create something new, so I designed a new brand of shampoo and manufactured\
    \ it. In 2014, I wrote and published a book and in 2015 I registered a business.\n\
    \n**Notes**: To answer this question right you have to be very specific and support\
    \ your claims with examples or hard evidence. Show the interviewers that you can\
    \ do the job and that you can deliver amazing results. Try to talk about skills\
    \ that you haven’t told them about yet. Remember to keep your answer short, it\
    \ is very easy to forget and start rambling when you are answering this kind of\
    \ question. Research the company and the position to make sure that you get a\
    \ feel of what kind candidate they are looking for. Highlight your strength that\
    \ is in line with the company is looking for to show that you would fit perfectly\
    \ to the job. Sometimes researching the company can be tiring and boring but they\
    \ never give you the job. Do not talk bad about other candidates and say that\
    \ you are better than them.\n\n## Question: why did you apply for this post?\n\
    \n**Answer**: I applied for this post because I love working as a meteorological\
    \ technician because it is practical application of the knowledge I gained from\
    \ my degree so this job is actually growing my skills which is what I need. And\
    \ also because I admire my previous company mostly of its values and because I\
    \ believe I share the same values which are: Professionalism, honesty, excellence,\
    \ teamwork, and integrity. Also the company’s vision is to become a world-class\
    \ meteorological organization. I believe that with my education and skills I am\
    \ the best candidate to be part of the team that will make your company achieve\
    \ this vision.\n\n## Question: Are you team player?\n\n**Notes**: As you already\
    \ know, teamwork is very important in a workplace. Well if you don’t know then\
    \ I am not sure where you work but look at this way: can Messi play against the\
    \ team? Yes he can. No! He needs team members to work in order for the company\
    \ to succeed. This is one of the most important questions that can be asked in\
    \ an interview and you should answer it thoroughly. Remember to give a success\
    \ story that shows you are a team player and remember to structure your story\
    \ in `SARS` format. If you say you are not a team player you are not a good team\
    \ player so you can take the easy way out. Being a team player is a skill that\
    \ means that you can learn, practice and master it. That’s right; it is easy as\
    \ that. All you have to do is read articles on teamwork (the more the better),\
    \ then read books or listen to audio books and practice what you have learnt.\
    \ After reading your first article you will have a new perspective on teamwork\
    \ skills. Being a good team player simply means that you can communicate effectively\
    \ with other people and the ability to empathize with other people and see things\
    \ the way they see it which will help you develop rapport with people.\n\n**Answer**:\
    \ I have worked in a team in the past two companies I have been working at and\
    \ also in varsity, although in varsity sometimes you have to work alone. I personally\
    \ prefer working in a team simply because you achieve more and I am a very team\
    \ player. An example of when I have worked in a team is when I was working on\
    \ `Marion Island`. Working on `Marion Island` was all about teamwork and communication.\
    \ We were a team of three meteorologists on an isolated island without any supervisor\
    \ or any management team and we were directly responsible for all meteorological\
    \ data and maintenance of instrumentation which requires effective teamwork.\n\
    \n## Question: Why did you choose this career?\n\n**Answer**: Because I would\
    \ like to be part of product development. I am fascinated by how the whole thing\
    \ starts from an idea, followed by extensive research, then through planning and\
    \ proper execution the ingredients combine to form a finished product that raises\
    \ emotions.\n\n## Question: Tell me a suggestion you have made that was implemented?\n\
    \n**Notes**: The interviewers just want to see if you are a creative person. Sometimes\
    \ they just want to see if you are an active person and if you contribute to the\
    \ team. This shows commitment. Your answer must show that you do take part in\
    \ making suggestions and recommendations when necessary. Give an example of when\
    \ you came up with a unique approach to an issue at work. If you did not have\
    \ any contributions at your workplace then mention the one you made in your own\
    \ personal life. This is a good chance to show the interviewers that the company\
    \ will benefit if they hire you.\n\n**Answer**: I worked at my previous company\
    \ for only two years and the company is well established so coming up with new\
    \ ideas was a challenge because during my two years we didn’t face any major issues.\
    \ However I did come up with an idea that was implemented in varsity. In my last\
    \ year at varsity, the course coordinator for chemistry told us to buy molecular\
    \ kits because we were going to need them for the exam. The kit was very cheap,\
    \ only `R200`. The problem is `R200` is a lot of money to a student, besides you\
    \ can get a nice bottle of Jack Daniels with change, now that is a good deal.\
    \ Anyways most students did not buy the kit and it affected them very badly and\
    \ what is surprising is that this have been happening every year. So I went to\
    \ the course coordinator and suggested that the university should increase the\
    \ course fee by `R200` and then they give us the kit for free. My coordinator\
    \ laughed and said that is the best idea ever and so he implemented it the following\
    \ year. Somebody gives this guy a bell.\n\n**Alternate answer**: I introduced\
    \ electronic logging. The company that I used to work for used hard copy booklets\
    \ to do the analysis. We had a lot of booklets so there were files for every client\
    \ which filled the bookshelf in no particular order. The problem was that we were\
    \ always flooded with a lot of work and sometimes we forget to return the booklets\
    \ where they belong and as a result the next person will not know where to look\
    \ for the booklet when they want to carry out the analysis. So the person has\
    \ to run around the whole day wasting valuable time looking for the booklet. Sometimes\
    \ the situation gets worse you spend the whole day looking for a booklet thinking\
    \ that somebody misplaced it only to find that the company never had that booklet\
    \ in the first place. To fix this problem I came up with a system I would like\
    \ to call electronic logging. My system is very simple, I create an `excel` logging\
    \ template so that every time you use a booklet you write your name, date and\
    \ booklet title. The next person to use the booklet will go to the log and see\
    \ who the last person was to use the booklet. The results were amazing; this method\
    \ saved everybody a lot of time so everyone can focus on more pressing matters.\n"
