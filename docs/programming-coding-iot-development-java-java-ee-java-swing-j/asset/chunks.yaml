    Communication, Growth, Success, Wealth...Listen... Listen... Listen...Being able
    to communicate effectively and efficiently is one of the most important skills
    for success. When you are communicating make sure your message is clear, concise,
    concrete, correct, coherent, complete, and courteous. These are called the seven
    Cs of communication. Effective communication is less about talking and more about
    listening. Listening means understanding the words or the information being communicated,
