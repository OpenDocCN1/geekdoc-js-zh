    about tax. If you are an employee and you sell your skills to a large organisation,
    then you get a million-dollar salary. That’s why growth is the key to being rich.
    Remember the rich keep getting richer. This means if you do it once, you will
    keep growing rich provided you keep growing your IQ.Add value in people’s livesThe
    amount of money you make is equivalent in one way or the other to how many people
    you reach out to. You must sell your product, skill, or services to as many people
    as possible and the easiest way to do that is to create a product, offer a service
    or sell a skill that offers value to people’s lives. If you make a product and
    sell a million units of that product, then you have a million dollars. If you
    have a skill and you sell it to a million people, then you have a million dollars.
    The only way to get a million people to buy what you are selling is if it  adds
    value to their life. Soccer players are selling their skills to millions of fans
    for entertainment. The richest people in the world are using their knowledge to
    make products and they sell them to millions of people because their products
    add value.Be GratefulThe more you work hard and smart the more opportunities will
    come your way. People will help you, you will attract a positive vibe. Be grateful
    and work even harder and smarter. Just remember the darkest hour, is the hour
    before dawn.Rules of Money Management• Track your finances daily.• Don’t spend
    more than you earn.• Generate passive income.• Never stop reading.• Put your employment
    benefits to good use.• Pay your bills on time.• Invest in education.• Stick to
    your budget.TaxTax, Public Infrastructure, Productivity, Growth, Success and Wealth...How
    to pay your tax and become rich.Taxes are the primary source of revenue for most
    governments and allow the government to provide services that can not evolve naturally
    through a free market mechanism. These services include building public infrastructures
    such as public transport, parks, libraries, roads, railways, and more. Public
    infrastructure is essential to the economy, the quality of life of a nation and
    for building wealth.Tax can help you get rich if you use it wisely. Remember,
    tax money is used to fund public infrastructure. Start using public infrastructure
    and save your money. Use public libraries, public transport, public everything.
    At least you will be able to tell your friends that you went public. On a serious
    note though, a lot of people become poor because as soon as they get little money
    then they don’t want to use public infrastructure anymore. This is called lifestyle
    inflation, read about it and avoid it at all cost. Act poor to become rich or
    act rich to become poor. I don’t think I will write a book about lifestyle inflation
    but who knows.Types of Public Infrastructure• Highways, Bridges, and Roads.• Airports.•
    Water Supply.• Waste Management.• Power Generation and Transmission.• Telecommunications.Retirement
    PlanMoney, Retirement Plan, Grow, Success, Legacy...You need nine times your annual
    salary to retire at the age of 65.Retirement is when a person chooses to permanently
    leave the workforce. Most people usually retire around the age of 65 after they
    have accumulated enough money over the years the help them live the rest of their
    lives with the money they have accumulated. If you retire before the age of 60
    then that is considered early retirement. You need 30% of your annual salary multiplied
    by 30 for you to be able to retire at the age of 65 e.g. if you earn 500 000 per
    annum then you need to have saved 4,5 million to retire (500 000 x 0,3 x 30).
    Put simply, you need nine times your annual salary to be able to retire by the
    age of 65\. You can save money for retirement in an individual retirement accout
    such as the 401k or Roth IRA (ask your employer to help you set up this accounts).
    A retirement account allows you to save money for retirement in a tax-advantaged
    way such as  tax-free growth or on a tax-deferred basis.Pension, 401k & Roth IRARoth
    IRA is a retirement account that offers tax-free growth and tax-free withdrawals
    in retirement. A pension fund is a retirement plan whereby your employer makes
    contributions to a pool of funds set aside for when you retire. The pool of funds
    are invested on your behalf by your employer, and the earnings on the investments
    generate income when you retire.A 401(k) is a retirement plan that employees can
    contribute to and employers may also match the contribution made by the employee.
    Ask your HR team about your retirement plan to get more information about the
    401k, Roth IRA and the pension funds available. Pension funds are controlled by
    employers while 401(k) investments are controlled by employees. Pension funds
    provide a guaranteed income for life while 401(k) benefits can be depleted and
    depend on an individual''s investment and withdrawal decisions.Cons Of Retiring
    Early• It could be bad for your mental health.• Your social security benefits
    will be less.• Your retirement savings will have to last longer.• People usually
    get bored and start missing work.Five Stages Of Retirement• Pre-retirement.• Full
    retirement.• Boredom.• Refocus.• Stability.Retirement Planning Tips• Determine
    your retirement goals.• Create a retirement budget.• Sign up for medicare.• Learn
    money management skills.• Live within your means.• Be financially prepared.• Eliminate
    debt.• Budget for emergencies and healthcare.What Retired People Do With Their
    Time• They relax.• Watch tv.• Sleep.• Do chores.• Eat healthily.• Get a part-time
    job.• Shop.• Volunteer.• Socialize.• Travel the world.• Teach.Where To Save Retirement
    Money• 401(k) or Roth IRA (talk to your employer).• Rental or commercial property.•
    Exchange-traded funds.• Long-term savings account.Types Of Retirement• Traditional
    retirement.• Semi-retirement.• Temporary retirement.Three Ways To Retire Without
    Any Savings• Boost your social security benefits.• Get a part-time job.• Rent
    out your house.CreditCredit Score, Credit, Assets, Good Debt, Income, Growth,
    Success, Wealth...Eliminate bad debt and maximize good debt.Credit is the ability
    to borrow money or access goods and services with the agreement that you''ll pay
    later provided that you have a good credit score. A credit score is a representation
    of your creditworthiness. It is a view of your credit history and payment behaviour
    presented numerically to show how you manage your debt. It is based on credit
    report information from credit bureaus. A good credit score means that lenders
    are more likely to lend you money. When you use credit, you create debt. Debt
    is the result of borrowing money and the more responsible you are at handling
    your debt, the more access you may have to credit in the future. Credit approval
    is determined by a borrower''s credit rating, income, collateral, assets, and
    pre-existing debt. Use credit to buy assets only. That is called good credit.
    Assets are things that bring money into your pocket e.g. a rental property. If
    you use credit to buy liabilities, then chances are you will be poor. Liabilities
    are things that take money out of your pocket e.g. luxury cars.Ways to Build A
    Good Credit Score• Pay your bills on time.• Use a secured credit card.• Keep credit
    cards open.• Pay down credit card balances.• Apply for credit only when necessary.•
    Use your credit card and pay it off within a month.• Check your credit score with
    the bureau.• Keep your payments consistent.• Never miss payments.• Dispute all
    errors on your credit reports.• Lower your credit utilization.• Pay outstanding
    bills.• Catch up on past-due accounts.• Limit how often you apply for new accounts.•
    Pay more than the minimum payment due.• Make extra payments when possible.Credit
    riskCredit risk is the risk that lenders face when the borrower cannot pay back
    the money. This is why lenders look at your credit score before lending you the
    money. It is the possibility of lenders losing money from a borrower''s failure
    to repay a loan or meet contractual obligations. It is the risk that a lender
    may not get back the money they lent to the borrower, which results in an interruption
    of cash flows and increased costs for collection for the lender.Types of Credit
    Risk• Credit default risk.• Concentration risk.How to Reduce Credit Risk• Determining
    creditworthiness.• Know your customer.• Conducting due diligence.• Leveraging
    expertise.• Setting accurate credit limits.How To Grow Your CareerJob, Promotion,
    Money Management, Millionaire Mindset, Growth, Success, Wealth...How to get a
    promotion.Do not make your boss obsoleteNo matter how much you want that promotion,
    remember to always respect your senior employees and try not to outshine them
    but instead work together with them effectively and efficiently to show your teamwork
    and people skills which are very critical in a workplace.Give a visual presentation
    of your workCreate a visual presentation of your achievements, write a progress
    report or do a presentation of the value you add to the team. This can be done
    using an excel spreadsheet or PowerPoint presentation. It doesn’t have to be a
    complex task; the aim is just to create a visual presentation of what you have
    been able to achieve throughout a certain period of time.Do your work from start
    to finishTry not to be one of those people who never finish anything. Know your
    work in and out. Do not get into the habit of calling your manager or colleagues
    for every single thing that goes wrong. Be a problem solver, troubleshoot problems,
    and be independent.Keep a positive attitudeNever be negative. Learn to look on
    the positive side of everything. The is always a positive side. The thing is after
    you get a promotion you will have people looking up to you and you will want them
    to have a positive attitude and that starts with you having a positive attitude.
    Start practicing today. If your laptop suddenly stops working then the positive
    side is that you will get a brand-new, faster laptop, if you are complaining about
    the money you are going to spend on buying a new laptop then you are focusing
    on the negative. Be positive.Motivate your colleaguesMotivate your colleagues.
    This is one of the key skills that are crucial in leadership. Do not wait for
    a promotion to start displaying leadership qualities. Start practicing your leadership
    skills now and you will attract that promotion.Talk to your senior about the promotionIf
    you feel ready and confident about a promotion. Talk to your senior about it.
    Do not be arrogant and don’t be a show-off. Just politely mention to your senior
    that you would like to take on more responsibilities then follow up on that.Enjoy
    your workYou don’t have to be passionate about your job. However, be passionate
    about how well you do your work. Be passionate and confident that you can solve
    most of the problems that you come across in your role. Enjoy the challenge because
    you will get more challenges when you get that promotion.Avoid office politicsNever
    ever get involved in office politics. When someone comes to you with office politics,
    excuse yourself politely and runaway. You will be respected for that by everyone.
    There are two kinds of people in a workplace; those who are productive and those
    that enjoy office politics. People who get promotions are the ones who are productive.Show
    commitmentBe committed to your work. It is easy. You don’t even have to love your
    job. Love has nothing to do with it. Passion has nothing to do with it. All you
    have to do is to break your work into small milestones and then reward yourself
    after you reach each milestone. This will make you committed to your job.Be a
    problem solverWhen you get that promotion, everyone will be coming to you with
    their problems. That will be your new job, solving your problems and other people’s
    problems. You need to improve your problem-solving skills. Problem-solving is
    easy. We have already touched on it. For you to be able to solve big problems,
    all you have to do is to break down your problems into smaller problems and solve
    them one at a time. That’s how you eat a turkey.Be exceptionalBeing exceptional
    is very easy, all you have to do is to work hard and smart. Work harder than everyone
    and work smarter than everyone. It is that easy. To work smarter than everyone
    all you have to do is to make sure that you read more books than everyone. To
    work harder than everyone, all you have to do is to make sure that you work more
    hours than everyone. Do that and you will be exceptional. Be exceptional and your
    career grows.Attract peopleYou don’t have to like people, but you have to be able
    to work with them. People are attracted by people who can help them with something.
    People in the workplace will be attracted to you if you can help solve their problems.
    The more people come to you with their problems the more you attract that promotion.Give
    valueAlways remember the big picture. Keep in mind that your team is moving towards
    a certain goal and make sure that you reach the target. Giving value means helping
    the team reach the target. Do not just go to work because you have to. Remember
    that you are part of the bigger team that depends on you directly and indirectly
    to reach a certain goal. Make sure that your team reaches that goal by doing your
    job and helping others do their job.Learn from everyoneLearn from the mistakes
    that gets people in trouble and avoid them. Learn from the good quality of your
    colleagues. Learn from people who have been promoted before. Learn from everyone.
    The is no knowledge that is not power.Value feedbackMost companies have regular
    performance reviews. This is so that your manager can give you feedback on your
    performance. Grow your strength and fix weaknesses. Value your weaknesses more
    than your strength, provided you know how to use your weakness. The great thing
    about our weaknesses is that they force us to learn. We are forced to learn to
    overcome our weaknesses and from that, we gain knowledge. Knowledge is power.Get
    noticedDon’t be noticed for the wrong reasons. Be noticed because you don’t get
    involved in office politics. Be noticed because you work harder and smarter than
    anyone else. Be noticed because you are a good problem solver. You will get noticed
    because you read this book.Show your leadership skillsAll the soft skills that
    you have been learning about since the day you were born, this is where they come
    to play. Good communication skills, sharing, caring, listening, being polite,
    emotional intelligence etc. All those skills that we usually take for granted,
    that’s the stuff that leadership is made of. If you want a promotion. Start practicing
    those.Create a to-do list.A to-do list will help you break down your job into
    smaller milestones. Smaller bites that you can chew. That’s how you eat an elephant.
    This strategy will help you solve even the biggest problems you have in your work
    environment. Reaching your milestones will keep you motivated, and you will enjoy
    your work and have a positive perspective. You can create a to-do list by getting
    requests from colleagues, following your job specifications or by getting ad hoc
    tasks delegated to you. Remember to delegate some of your work when needed, however,
    do not let this make you lazy. Work hard and smart. Yes, two heads are better
    than one. Have regular small breaks. The small breaks will help you avoid office
    politics and help you relax. Design your work station in a way that will make
    you more productive and make you feel pleasant. Plan your day before you leave
    home and review your work before you leave the office. The easiest way to review
    your work is to write everything that you do down on sticky notes then review
    it at the end of your day. Set a routine at work. This will help solve problems
    easily and help you with continuous improvement. Continuous improvement is a cornerstone
    of success.Effective Ways to Grow Professionally• Accept constructive criticism.•
    Learn new skills.• Dedicate time for self-improvement.• Be consistent.• Write
    down your achievements.• Identify your career options.• Set smart goals.• Never
    stop studying.• Be a good listener.• Read.• Improve performance in your field.•
    Network, network, network.• Get a mentor.Manage Your CareerSchool, Employment,
    Side Business, Career Development, Growth, Success...Continuous growth is the
    cornerstone of success.'
