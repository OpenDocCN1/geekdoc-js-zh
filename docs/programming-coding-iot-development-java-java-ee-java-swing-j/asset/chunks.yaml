    # 研究、学习，并确保你对欠缺的技能以及必须任的职责有深入的了解。这些将帮助你回答关于你从未接触过的领域的技术问题。然而，如果你确实不知道某些事，请务必诚实，因为面试官可能已经知道你不知道问题的答案，他们只是想看看你是否诚实。没有人想雇佣一个谎者，即使是政客也是如此。


    ## 雇主寻找的常见技能

    * 沟通能力

    * 团队协作

    * 职业道德

    * 分析和解决问题的能力

    * 人际交往能力

    * 灵活性

    * 计算机技能

    * 注于细节的关注度

    * 领导力

    * 组织能力


    ## 面试技巧

    * 彻底了解该职位的每一个细节。

    * 准备并练习成功案例。

    * 面试官更感兴趣的是你如何回答问题的，他们更看重思维过程，并想了解你是如何思考的。

    * 根据职位描述列出你可能被问到的问题清单，并尝试找到答案。在回答问题时，务必使用 `SARS` 技术，并用成功案例举例。

    * 尝试寻找该特定职位的面试题并进行练习。

    * 寻找与你所面试职位相同的人并向他们请教。可能是你认识的人、同事、工作前辈，甚至是社交媒体（如 `LinkedIn`）上的陌生人。

    * 在网上查询该特定职位常问的问题。


    ## 雇主在候选人中寻找的职业道德特质包括：

    * 纪律

    * 团队意识

    * 诚实

    * 敬业

    * 积极的态度

    * 同理心

    * 尊重

    * 责任感


    ## 回答面试问题

    ![](img/image_rsrc4MW2.jpg)CV Template![](img/image_rsrc4MW3.jpg)![](img/image_rsrc4MW4.jpg)![](img/image_rsrc4MW5.jpg)![](img/image_rsrc4MW6.jpg)


    用故事和例子回答问题

    * 确保你的故事遵循 `SARS` 技术

    * 提前准备并练习成功案例

    * 准备好要问面试官的问题


