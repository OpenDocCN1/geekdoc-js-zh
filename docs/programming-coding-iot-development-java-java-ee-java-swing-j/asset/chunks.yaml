    Accounting is the language of business.

    Accounting is the collection, compilation, and systematic recording of transactions
    of a business to produce financial statements. Financial statements summarize
    a company''s financial position with a balance sheet and an income statement.
    The accounting equation: `Assets = Liabilities + Equity` is the proposition that
    a company''s assets must be equal to the sum of its liabilities and equity. Accountants
    keep track of expenses, profits, and losses. Accounting does not require hard-core
    math. Basic addition, subtraction, multiplication, and division are enough. However,
    accounting is a bit more difficult to master due to its strict sets of rules.


    ## Types Of Accounting

    - Financial accounting.

    - Cost accounting.

    - Managerial accounting.

    - Tax accounting.

