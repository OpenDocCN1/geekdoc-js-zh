    or rhyme.• Form acronyms.• Look at pictures or patterns.• Categorize information.•
    Use numbers.The Reading Process• Finding information.• Identifying the main idea.•
    Understanding words.• Categorizing information.• Finding similarities and differences.•
    Concluding and summarising.MentoringMentoring is the sharing of information between
    people with the goal of professional and personal development. The mentor usually
    shares information, experience, and advice with a less experienced person (the
    mentee).Types Of Mentoring• One-on-one mentoring.• Distance mentoring.• Group
    mentoring.• Situational mentoring.• Developmental and career mentoring.• Peer-based
    mentoring.Qualities Of A Good Mentor• Good listener.• Flexible.• Values different
    perspectives.• Knowledgeable.• Non-judgmental.• Able to give feedback.• Honest.•
    Resourceful.• Good leadership and management skills.Benefits Of Being A Mentor•
    Increased self-confidence.• Increased self-awareness.• Leadership skill development.•
    Strong communication skills.• Increased listening skills.• Increased patience.•
    Increased people skills.TalentInformation, Skill, Excellence, Talent, Growth,
    Success, Wealth...Everyone has talent.Talent is a natural aptitude. Your talent
    is determined by the way you think, feel and behave. That’s why it is said that
    talent is a natural thing because you already have it, you are already thinking,
    feeling and behaving in a certain way. You were not born with it, but you already
    have it. Your thoughts, feelings and behaviour give you the potential to do and
    become anything. After you tried doing many things and you find that one thing
    you excel in then you have found your talent.Your talent can grow and change into
    something good and  bigger or something bad depending on what kind of information
    you acquire along the way.  This is because talent is a result of the information
    you have in your mind. Thoughts, feelings and behaviour are a by-product of information
    you acquire, therefore, information gives rise to talent. You process information
    according to what you know to be true about the world at that particular point
    in time and this is why everyone has their own unique talent. Everyone starts
    acquiring information from the moment they are born, from the sound they hear,
    the smell, everything that you can sense gives you information. This is why everyone
    has talent because everyone has information in their head already. No one was
    born with information, but  everyone acquired information from the moment they
    were born,  intentionally and unintentionally, consciously and unconsciously,
    directly and indirectly. However, some people have not figured out their talent.The
    easiest way to figure out your talent is to acquire as much information as possible
    until your talent pops out. It doesn’t matter how or where you get your information
    as long as you can be able to say you learned something new every hour. The more
    you learn, the faster you realise and grow your talent. Learn something new every  hour.
    Talent cannot be made, you already have it, you can only grow it or modify it.Talent
    VS SkillSkill is an acquired ability. Skill is not talent but a skill that you
    excel in is talent. Talent is something that you do very well because of the way
    you think, feel and behave which is determined by knowledge and knowledge comes
    from information. Talent helps with innovation, adaptability, persuasion, communication,
    and teamwork. The fastest way to absorb information is to break it down into smaller
    components.A few examples of talents:• Public Speaking.• Writing.• Communication
    Skills• Critical Thinking.• Decision Making and Problem Solving.• Math.• Adaptability.•
    Perseverance.• Teamwork.• Selling.PersonalityMindset, Motivation, Action, Information,
    Growth and Success...Keep moving forward.Personality is the way someone behaves,
    how they think, their level of emotional and cognitive intelligence. Personality
    is formed and shaped by both DNA and the surrounding environment. Personality
    plays a key role in achieving success. This is because success requires continuous
    growth and the world is full of problems that work against continuous growth.
    The simplest way to continuously grow is to keep reading and inquiring information
    from people who themselves are successful. Now because the world is working against
    continuous growth one has to be resilient, they have to work smart and hard, they
