    need someone to be around 24/7 for a month or two. Tell them that you know it
    sounds like a bad idea but you need time to heal so that you can get back on your
    feet and focus on what''s important, your future. Yes, your future is more important
    than your partner.You can argue with my strategies, it ‘s your choice. However,
    if your partner cheats and you fail to get back on your feet then blame it on
