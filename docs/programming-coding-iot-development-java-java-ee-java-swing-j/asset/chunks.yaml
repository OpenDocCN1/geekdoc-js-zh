  trans: "\n\n# 面试准备与职业建议\n\n## 应该做的 (Dos)\n- 微笑\n- 保持冷静\n- 眼神交流\n- 如果说话得太快，请放慢速度\n\
    - 准备一份你的故事清单\n- 穿西装（蓝色、灰色或黑色，配白色衬衫）\n- 在眼神交流并微笑的同时，伸出坚定但不至于用力过猛的手握\n- 站起来迎接面试官（很高兴见到你）\n\
    - 准备一个整洁的专业文件夹装好你的 `CV`\n- 关闭手机\n- 尝试用 `SARS` 技巧来组织你的回答\n\n## 不该做的 (What not to\
    \ do)\n- 不要太早。\n- 不要迟到。\n- 不要喷太多香水。\n- 不要害怕重复 `CV` 中有的内容。\n- 回答时不要给出个人意见。要提供证据和成功案例。\n\
    \n记住，这些人已经想雇佣你了，他们信任你，他们已经见过你是什么样的人，他们只是想确认这一点。所以，不要试图表现得与众，遵循基础原则即可。闭嘴，回答他们的问题，然后离开。这些人永远不会面试他们不想雇佣的人。记住，他们是站在你这一边的，而不是反对。\n\
    \n## 遵循基础\n- 做法与禁忌\n- 信心与恐慌\n- 服装规范与礼仪\n- 技巧与流程\n\n![](img/image_rsrc4MW0.jpg)\n\
    ![](img/image_rsrc4MW1.jpg)\n\n## 无需经验的工作\n- 客户服务代表\n- 房产经纪\n- 销售客户代表\n- 医疗助理\n\
    - 行政助理\n- 兽医助理\n- 客户服务专家\n- 法律助理\n- 育儿或照顾宠物\n- 自由职业\n- 在线工作\n\n## 如何快速找到工作\n-\
    \ 研究你收到的反馈\n- 创建一份最出色的简历（通过持续编辑）\n- 在你的 `resume` 上列出你的技能\n- 精通职位面试技巧\n- 确保你的社交媒体上没有负面信息\n\
    - 持续提高你的技能\n- 申请的工作要比市场上任何人都多\n\n## 如何建立成功的职业\n- 设定目标\n- 简历品牌化\n- 了解自己的优缺点\n-\
    \ 承担责任并设定自己的标准\n- 找一个导师\n- 建立人脉并申请工作\n\n### 编写良好职业目标的技巧\n- 大胆梦想\n- 确定你的竞争优势\n\
    - 灵活且适应能力\n- 将职位要求与你的教育背景匹配\n- 评估你目前的技能\n- 记住你的兴趣\n- 考虑工作的增长和需求\n\n以下是根据收入和需求排序的热门工作列表\n\
    - 统计师\n- 医疗领域\n- 技术领域（软件开发和数据科学）\n- 金融\n- 教育\n- 技术性工作（工程等）\n- 商务服务（包括咨询工作、管理和销售）\n\
    \n### 因信息技术导致需求减少的职业列表\n- 旅行社员\n- 收银员和银行柜员\n- 邮递员\n- 体育裁判\n- 电话营销员\n- 秘书\n\n##\
    \ 如何在没有工作经验的情况下找到\n- 筛选职位（这意味着每天申请 50 多份工作）\n- 研究筛选后获得的反馈，研究你在哪些领域最受重视。\n- 专注于这些领域并坚持每天申请\
    \ 50 份工作。\n- 记住，需要 5600 次申请才能获得你的理想工作。每天申请 50 份工作，你需要 4 个月才能获得理想工作。\n\n## 如何享受你的工作\n\
    - 保持积极的观点\n- 拥有与工作无关的个人生活\n- 创建待办事项列表\n- 需要时授权\n- 定期进行短时间休息\n- 让你的工作环境更愉快\n- 计划并回顾你的一\n\
    - 努力且聪明地工作\n- 建立常规\n\n## 电话面试技巧\n- 穿得得体。这可以让你感到很专业并认真对待面试。\n- 确保你在一个有桌子的安静房间里。\n\
    - 准备好你申请的职位描述以及你的笔记（技能、资质和经验）。这就像是开卷考试。记住在收到面试邀请时，要求对方将职位描述发给你。\n- 如果你喜欢，你可以站着。科学表明，站立时说话更清晰。这是因为你的肌膜放松了，胸部打开，所以你呼吸和说话更轻松。如果你害怕，可以走动，这有助于你放松。\n\
    - 确保信号良好，如果信号不好，不要强行继续，而是要求拨打另一个号码。\n- 如果没有听清问题，请询问。\n- 确保声音大到能听见，不要说得太快。\n- 不要漫谈，保持你的回答清晰简洁。\n\
    - 微笑，这有助于你放松并听起来充满自信。\n- 保持冷静放松，不要害怕停顿思考，当他们保持时不要恐慌，他们可能在做笔记。\n\n## 面试技巧\n- 将你的技能、资质和经验与职位要求匹配。职称并不重要。重要的是你的技能、资质或教育与职位规范相似。\n\
    - 练习如何回答面试问题。一种方法是写下你的技能、资质和经验，然后背诵它们，并在机会时写下来。\n- 研究公司。\n- 练习评估测试（如果有的话）。\n-\
    \ 知道面试中该做什么和不该做什么（包括服装规范）。\n- 跟进。\n\n### 你可以在面试中问的问题示例：\n- 员工共同拥有哪些性格？\n- 什么是让我愿意额外付出的？\n\
    - 如果你雇佣我，预期我的首要任务是什么？\n- 你们支持想要进一步学习的员工吗？\n- 你们公司的关注领域是什么？\n- 你认为你的首要特征是什么？\n\
    - 我应该如何以及何时跟进？\n- 根据我的背景和技能，你认为我这个职位的挑战是什么？\n- 你们公司对职位成功的定义是什么？\n\n## 求职工具\n-\
    \ 社交媒体\n- 应用程序\n- 电子邮件\n- 搜索引擎\n\n## 求职步骤\n- 始终更新你的 `Resume`\n- 在公司网站上完善在线资料\n\
    - 有效利用互联网\n- 搜索并申请工作\n- 准备面试\n- 准备评估测试\n- 胜面试\n- 仔细选择推荐人\n\n## 任何员工所需的顶级技能\n-\
    \ 商业敏锐度\n- 良好的沟通能力\n- 团队合作\n- 谈判技巧\n- 问题解决/分析能力\n- 领导力\n- 压力管理\n- 信心\n\n## 获取公司信息来源\n\
    - 公司网站\n- Google\n- 与员工交流\n- 在 `indeed` 等招聘搜索引擎上阅读公司评论\n- 新闻稿\n\n 关于公司需要了解什么？\n\
    - 使命、愿景和价值观（通常在公司网站上）\n- 公司奖励和成就\n- 公司部门和规模\n- 公司声誉\n- 他们的产品和竞争对手\n- 了解行业表现。（通常在股市网站如\
    \ `moneyweb` 上）\n\n## 如何将你的技能、资质和经验与职位描述匹配：\n- 将职位描述总结为技能、经验、知识和职责，并写下使用的关键词。\n\
    - 总结你的技能、资质和经验。写下关键词。\n- 比较这两个摘要并看它们是否匹配。这就是你在面试中讨论的内容——你的技能、资质和经验如何匹配职位描述。记住，面试是你和面试官之间的对话，主题是你的技能、经验和教育；仅此此。\n\
    \n"
