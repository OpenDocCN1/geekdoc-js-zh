    # 问题：描述一个你为自己设定的重大目标。


    **备注**：确保你的回答与你所申请的职位相关。清楚地陈述你的目标以及你为什么认为这是一个重大目标。展示你是如何实现这一目标的。


    **回答**：今年我给自己设定的最大目标之一是写一个关于分析化学家使用的技能和设备的博客。我采取的行动是花了一个月的时间研究和学习如何编写和发布博客，然后又花了三个月的时间收集和学习关于分析化学家及其使用设备的文章。在经历了四个月的研究和学习后，我设计、编写并发布了我的博客。现在我的博客运行良好，并正在帮助世界各地的人。谁不想雇佣这样的人呢？


    ## 问题：什么在工作中激励着你？


    **备注**：每个人都有自己的动力来源，可能来自朋友、家人、书籍等。动力是成功的关键关键之一。工作环境可以建立也可以摧毁你的动力。面试官问这个问题是因为他们想知道你在他们的环境中是否会有动力。回答要得当，不要说你通过在户外活动获得动力，而你申请的职位是银行柜员。回答这个问题最好的方法是观察公司具备什么特质，并将其陈述为你的动力；或者观察该职位提供的积极因素，并将其陈述为动力。


    **回答**：完成工作就是激励我的动力。我属于那种总是列出待办事项的人，每当我完成一项任务，我就会把它划掉。这让我感觉很好、很有动力，并且想做更多工作。我完成的任务越多，我的动力就越大。


    ## 问题：你对以前的同事有什么不喜欢的地方？


    **回答**：没有，我觉得自己很幸运能和一群这么友好的人一起工作。每个人都努力表现得体贴，这是我最欣赏他们的一点，这也是我感激的原因。


    ## 问题：你和之前的上司有过什么矛盾？


    **备注**：希望你和之前的上司没有矛盾，这样你就不需要撒谎了。如果有，你必须以一种非常积极的方式来说，让它看起来不像是一个问题。在我看来，你和之前的上司没有任何矛盾。


    **回答**：我和之前的上司完全没有过过；实际上，我们之间的关系很好。我非常擅长与管理层建立关系。要和上司保持良好关系，你必须完全按照他们的指示去做，加倍努力并保持良好沟通。


    当我还是 `Rampsy Consulting Company` 的新员工时，我的经理要求我做溶解实验并在 `UV machine` 上读取结果。我完全按照要求做了，并如实报告了结果。问题是，那个产品的结果太低了，导致产品不合格，但我当时还是个新员工，不知道该怎么办，所以我还是直接报告了结果。我的上司对我很生气，说我应该重新进行分析，如果产品仍然不合格，我应该写一份
    `out of specification report`（离群规格报告）。


    为了解决这个问题，我让我的老板消消气，然后在大家都离开后我留在公司，完全按照要求重新做了一次产品。第二天，我为自己的错误道歉，并告诉他下次我会确保与他有效沟通，并和他确认一切。大约三个月后，我就不再需要向他确认任何事情了，我了解了所有的细节，他也信任了我。


    ## 问题：我们为什么要雇佣你？


    **是的**，这是一个不回答的问题。


    **回答**：因为我的个人能力与这份工作完美契合。我曾在 `Rampsy Consulting Company` 的前主管告诉我，我是一个良好的沟通者，并且正如你在推荐信中所见的那样（提供推荐信），我总是取得良好的成果。此外，我在
    `South African weather Service` 的现主管在我的半年评估中对沟通、团队合作和问题解决能力给了 me 100% 的评分（提供硬性证明）。我可以利用这些技能与学生、员工和管理层建立联系。如果你无法提供证据，不要这样回答这个问题，否则你的回答听起来会很空洞。如果你没有书面证据，你需要以成功故事的形式提供证据，就像下方的另一种示例所示。


    **另一种回答**：因为我会不顾一切去完成工作并取得良好结果。以前当我在 `South African Weather Service` 休息时，我也会工作。我记得在
    2015 年 12 月，雨计坏了，那天正好是我的休息日。值班的人本该修理雨计，但因为我知道靠一个人几乎不可能修理好，于是我去了办公室，我们一起花了一整天时间修理了雨计。完工后，雨计运行完美。与自动雨计相比，差异仅为
    `0.003 mm`，几乎为零。


    **另一种回答**：因为我会不顾一切去完成工作并取得良好结果。2012 年，我给自己设定了一个发布博客的目标。在 2012 年底之前，我的博客已经上线运行了。2013
    年，我的目标仅仅是创造新事物，所以我设计了一种新的洗发水并生产了它。2014 年，我写并出版了一本书， 2015 年我注册了一家公司。


    **备注**：要正确回答这个问题，你必须非常具体，并用例子或硬性证据支持你的观点。向面试官展示你可以胜任这份工作并能交付惊人的成果。尝试谈谈你还没有提到的技能。回答这类问题时要尽量保持简短，很容易忘记并开始漫漫大论。研究公司和职位，以确保你符合他们寻找的人才。突出你与公司要求匹配的优势。有时研究公司很累且很无聊，但那是为了获得工作。不要评价其他候选人，要说你比他们更好。


    ## 问题：你为什么要申请这个职位？


    **回答**：我申请这个职位是因为我喜欢从事技术员的工作，因为这是对我学位中所学知识的实际应用，这正是我需要的。此外，因为我钦佩这家公司的价值观，并且我认同这些价值观：专业精神、诚实、卓越和诚信。此外，公司的愿景是成为世界级的气象机构。我相信凭借我的教育背景和技能，我是实现这一愿景的最佳人选。


    ## 问题：你有团队精神吗？


    **备注**：如你所知，团队合作在工作中非常重要。如果你不知道在哪里工作，可以看这个方式：团队精神？这是面试中可能被问到的最重要的问题之一，你应该彻底回答。给出一个成功故事来证明你有团队精神，并记住用
    `SARS` 格式组织你的故事。如果你说你没有团队精神，你就不是一个合格的人。团队精神意味着你可以学习并精通它。你所要做的是阅读关于团队合作的文章，然后听书并实践。良好的团队精神仅仅意味着你可以与他人有效沟通并理解人的需求，这有助于你与他人建立联系。


    **回答**：我在过去的几家公司以及大学期间都有团队合作经验。在大学期间有时不得不独自工作，但我更倾向于团队合作，因为这样可以成就更多。我是非常有团队精神的人。我参与团队合作的一个例子是我在
    `Marion Island` 工作期间。在 `Marion Island` 的工作完全关乎团队合作和沟通。我们是由三个气象学家组成的团队，在一个没有主管或管理的孤立岛上，我们直接负责所有的气象数据和维护，这需要有效的团队合作。


    ## 问题：你为什么选择这个职业？


    **回答**：因为我想参与产品开发。我着迷于整个过程如何从一个想法开始，经过广泛的研究，然后通过规划和恰当的执行，最终形成一个产品。


    ## 问题：告诉我一个你提过并被采纳的建议？


    **备注**：面试官只想看你是否是一个有创意的人。有时他们只想看你是否是一个活跃的人以及是否为团队做过贡献。这显示了你的投入。你的回答必须表明你在需要时会参与建议和推荐。举一个你在工作中针对问题提出独特方案的例子。如果你在工作中没有贡献，就提到你在个人生活中提出的建议。这是一个很好的机会，向面试官展示如果他们雇佣了你，公司将受益。


    **回答**：我在我的前公司只工作了两年，那里公司已经非常成熟，所以提出新想法是一个挑战，因为在那两年里我们没有遇到任何重大问题。然而，我在大学期间确实提出了一个被采纳的想法。在大学的最后一年，化学课程员告诉我们要买分子实验盒，因为考试时会用到。实验盒很便宜，只要
    `R200`。问题是对于学生来说，`R200` 是一笔很大的钱，而且这笔钱还能买一瓶不错的杰克·丹士，那才很划算。总之之，大多数学生没有买实验盒，这对他们影响很大，令人惊讶的是这种情况每年都在发生。于是我去找课程员，建议大学将学费增加
    `R200`，然后免费为我们提供实验盒。我的协调员笑了说这是最棒的主意，于是他在第二年就实施了。真该给这个哥们敲铃。


    **另一种回答**：我引入了电子日志。我以前工作的公司使用纸质记录簿进行分析。我们有很多记录簿，所以每个客户都有文件，按没有顺序堆满了书架。问题是我们的工作总是积如山，有时我们会忘记把记录簿放回原处，结果导致下一个人想进行分析时不知道去哪里找记录簿。所以这个人得跑一整天，浪费宝贵的时间找记录簿。有时情况更糟，你花了一整天找一个记录簿，以为是某人弄丢了，结果发现公司根本就没有那个记录簿。为了解决这个问题，我提出了一个我称之为电子日志的系统。我的系统非常简单，我创建了一个
    `excel` 日志模板，这样你每次使用记录簿时都要写下名字、日期和记录簿标题。下一个使用记录簿的人会去日志查看上一个使用的人是谁。结果是惊人的；这种方法为大家节省了大量时间，让大家可以关注更紧迫的事情。


