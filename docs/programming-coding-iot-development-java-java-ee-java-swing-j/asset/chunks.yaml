    # Research components


    - Title

    - Background Information

    - Research Aim

    - Research Objectives

    - Research Problem/Hypothesis

    - Research Questions

    - The Significance of the Study

    - The Literature Review

    - Research Methodology

    - Research Strategy

    - Target Population and Sampling

    - Data/ Collection Gathering

    - Data Analysis

    - Writing the report


    ## Literature Review

    A literature review is the evaluation of books, scholarly articles, and any other
    sources relevant to the research topic to give a critical evaluation of these
    works in relation to the research problem being investigated.


    ## Research Methodology

    Research methodology is the specific procedures or techniques of how the study
    will be conducted which describes the assumptions, principles and process applied
    in the study. It also explains the kind of problem, hypotheses; designs and data
    collection methods used.


    ### Target Population and Sampling

    A population is any complete group of entities that share some common set of characteristics
    for which questions will be asked to gather the required information. The sampling
    method refers to the selection of the participants that comprise a portion of
    the target population in order to make sure that generalisation of the larger
    population is achieve.


    ### Data/ Collection Gathering

    Data collection refers to the process of gathering information to make critical
    evaluation of the research questions. It also explains how the researcher produces
    or collects data for the research study.


    ### Data Analysis

    Data analysis refers to the examining, grouping, tabulating, summarizing, testing
    or recombining of data to address the research problem. The aim of data analysis
    is to make sense of the data.


    ## Types of research

    - Quantitative Research.

    - Qualitative Research.

    - Descriptive Research.

    - Analytical Research.

    - Applied Research.

    - Fundamental Research.

    - Exploratory Research.

    - Conclusive Research.

    - Theoretical Research.

    - Experimental Research.


    ## Most frequently used Research Methods

    - Participant Observation

    - Surveys

    - Interviews

    - Focus Groups

    - Experiments

    - Case Study

    - Secondary Data Analysis

    - Mixed Methods (combination of the above)


    ## Types of surveys

    - Online surveys

    - Paper surveys

    - Telephonic Surveys

    - One-to-One interviews


    ## Perspective

    Let''s review


    ### Job Interview Tips

    #### Don’t panic

    Always remember an interview is just a conversation between you and your interviewer
    to discuss your skills, qualifications, and experience, everything else is a professional
    waste of time. Just stick to talking about your skills, qualifications, and experience
    and you will not go wrong.


    #### Have a copy of your resume

    Have your CV in a nice folder dedicated strictly for interviews. Statistically,
    it takes about 16 interviews to get one job. So, keep that folder safe. You might
    need it a couple more times.


    #### Be positive about everything

    Never say a negative comment about your previous job. When they show you something,
    give a positive comment. Never say anything negative about your day or anything
    else for that matter.


    #### Don’t ramble

    Keep your answers short and concise. Elaborate as much as you need to get your
    point across, however, do not ramble. Do not talk for more than two minutes. I
    know 2 minutes sounds like nothing but write your story down and record yourself,
    you will be surprised how much you can sap in two minutes. Using the `SARS` technique
    will help make your stories short. Stay on topic; rather not talk at all than
    to be all over the place.


    #### Be prepared

    Go through all the six steps explained in this book to help you prepare thoroughly.
    If you are underprepared do not panic otherwise you will not fail the interview
    because you are underprepared but because you are panicking. Read the guidelines
    above about how not to panic.


    #### Success stories

    It’s all about evidence; you must back up anything you say with examples or physical
    evidence. The more evidence you can provide the better, don’t generalize, explain
    in detail.


    #### Checklist

    Make a checklist of everything that you need to do when preparing for an interview
    or use a checklist provided in this book.


    #### Questions… Questions… Questions…

    Make sure you practice at least 40 popular interview questions. Make sure you
    know everything about the job requirements and duties as the questions will be
    centered on this.


    #### Grow

    Personal growth and development are some of the most important skills that a human
    being can learn. List all the mistakes you have done in the past interviews you
    attended and how you can fix them. If you cannot find a way to fix a mistake just
    keep on reading interview books, then you will eventually hit an answer or use
    the internet or ask someone. With all this flood of social networks, you might
    as well use them for a good benefit.


    #### How to boost your confidence

    Find out which skills does your company appreciate the most for that specific
    post that you are applying for. There should not be a lot e.g. for most finance
    posts, the skills required the most are `MS Excel` and data analytics.


    Always remember to remain professional at all times even if the interviewers are
    playful or even a bit unprofessional.


    Know what makes up the company’s perfect candidate and present yourself as that
    person. Check the skills, qualifications and experience required. Job titles do
    not matter.


    Remember to control your breathing; breath slowly to boost your confidence. Also,
    walking around before the interview or drinking cold water during the interview
    can help boost your confidence.


    It is okay to be nervous, this is no surprise to the interviewer. Do your best
    to relax and don’t stress too much over little mistakes.


    Remember to breathe and think about your answers. Usually, people start to panic
    when they get asked questions that they cannot answer. Remember, interviews have
    only a few numbers of questions and the interviewers are not expecting you to
    answer all of them, therefore, if you read this book, you should be able to get
    most of the questions right. Do not worry about the other ones that you got wrong
    and do not hesitate to say if you do not know the answer.


    If you don’t know the answer admit it immediately, think about it out loud and
    let them know that you are thinking, and admit that you do not know it. It shows
    that you are engaged and that you want to answer well.


    Never try to be creative in an interview, answer exactly as prepared. Even when
    they ask you a question that is creative just stick to the basics. Creativity
    will be seen in your basic answer, you do not try to make it.


    What to do

