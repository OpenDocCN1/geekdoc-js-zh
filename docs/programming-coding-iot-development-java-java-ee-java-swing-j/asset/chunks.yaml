    # 尽享生活的方法：


    * 停止抱怨。

    * 积极主动。

    * 创造你自己的机会。

    * 设定目标。

    * 花时间反思。

    * 改变你的内心自我对话。

    * 持续成长。


    ## 规则

    挑战、规则、解决方案、成长、成功、财富……所罗门王提升了这些维度；让我们效仿。


    ### 商业规则

    * 我们出售的是时间。

    * 因果关系，你掌控着一切。

    * 成立公司以避税。

    * 像国王一样一样，消除竞争对手。

    * 对市场做出反应。

    * 你在人身上实现升级。

    * 你是业务，人是项目。

    * 建立一个盈利的系统，然后授权。

    * 低买高卖。

    * 简化一切。

    * 与所有人合作。


    ### 生产力规则

    * 将每项任务拆解到不会产生困惑的程度。

    * 哪里你不懂就跳过并提问。

    * 按照你的待办清单工作。

    * 从有效的方法开始。

    * 定义终点，并从那里开始反推。

    * 忘记昨天，从今天开始规划。

    * 一天从规划开始，并以规划结束。


    ### 成功规则

    * 你选择结婚谁是最重要的决定。

    * 所有人都因为分心而没有执行。

    * 增加你在正确的时间出现在正确地点的概率。

    * 每个人都可以启动项目，但并非每个人都能完成它。

    * 你现在所做的事将让你在未来 3 年受益。

    * 进步的反面是借口。

    * 个人发展吸引成功。


    ### 变革管理规则

    * 不要告诉人们改变却不告诉他们如何做。

    * 你想通过这次变革解决什么问题？

    * 为了改变而改变对任何人都没有帮助。

    * 为了更好的未来状态而改变。

    * 不要做得太多、太快。

    * 准确地告诉人们如何改变。

    * 给人们资源、辅导和指导。

    * 保护人们免受变革的影响。

    * 变革是发生在你身上的，而不是针对你。

    * 不要立即做决定。

    * 寻求建议。

    * 观察类似的历史事件。

    * 拥有多个动力来源。

    * 变革是有趣的。


    ### 管理规则

    * 每天成长。

    * 永远不要针对个人，要针对财务。

    * 停止微观管理。

    * 处理行政事务并授权一切。

    * 管理就是衡量和报告。

    * 给所有人法律，而不是惯例。

    * 花时间规划，你将避免所有问题。

    * 所有的失败都可以通过规划和阅读避免。

    * 不要为了任何事情打破你的规则。

    * 将工作设计到没有争议的程度。

    * 如果你不管理流程，流程就会管理你。

    * CEO 应该是自由的，只负责规划。

    * 管理人员拥有特定信息；基层员工拥有通用信息。

    * 仅关注报告。

    * 修复系统，而不是人。

    * 关注输出。

    * 找到能解决问题的人。


    ### 技术贴士

    * 随时查询你正在做的事情。

    * 视频通话时看着摄像头。

    * 在 Excel 中写下你的待办清单。

    * 始终开启你的待办清单。

    * `CTRL+ALT+TAB`（提高生产力）。

    * `CTRL+SHIT+T`（重新打开最近关闭的网页）。


    ### 权力规则

    * 一个人所做的所有错误都是你的杠杆。

    * 关注你应该做的事。

    * 不要和人一起工作，要和你的计划工作。

    * 遵循规则。

    * 注意细节。

    * 最伟大的领导者是仆人。

    * 每个人在自己的职领域都是领导者。

    * 永远不要偏离你的目标。

    * 力量来自失败，增加你的失败率。

    * 授权领导力。

    * 智力是人类使用的礼物。

    * 只要你坚持下去，一切都会解决。

    * 修复你问题解决者的错误。

    * 每一个问题都是设计问题。

    * 只有在出现问题时才帮助。

    * 为正确的工作找正确的人。

    * 杠杆就是力量。


    ### 信息规则

    * 知识消除了不必要的情绪。

    * 优先阅读你现在应该知道的

    * 使用所有资源（互联网、书籍、视频、图片……）。

    * 通过实践来记忆（写作、背诵、画图、教学……）。

    * 阅读直到智慧变成直觉。

    * 在学校，你为信息付费。

    * 阅读教你如何去做。

    * 阅读是生活的 GPS。

    * 如果你不阅读，世界是一个危险的地方。

    * 阅读创造愿景。

    * 学习、反思、实施并分享。

    * 通过实验回答自己的问题。

    * 花 80% 的时间获取信息。

    * 一切都可以通过阅读改进。

    * 有些事情你可以通过视觉看到，但无法通过数字看到。

    * 愤怒意味着你对该主题阅读不够。

    * 为了未来的情绪和问题解决多读。


    ### 营销规则

    * 创建一个博客。

    * 使用社交媒体进行营销。

    * 避免骚扰人们。

    * 对市场做出反应。

