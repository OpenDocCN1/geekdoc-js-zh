    # Kanban

    Product Idea, Production, Kanban, Profit, Money, Growth, Success, Wealth...

    Continuous Improvement.

    Kanban is a framework used to optimize production processes which requires work
    items to be represented visually on a Kanban board, allowing team members to see
    the state of every piece of work at any time and allows for real-time communication
    and full transparency of workflow. The workflow can be visualized by using sticky
    notes on a whiteboard which is what the word Kanban stands for in Japanese, "Kan"
    means "visual" and "ban" means "card" meaning visual cards.

    Kanban methodologies are continuous and more fluid, whereas scrum is based on
    short and structured work sprints. Kanban is aimed at optimizing the production
    flow by regulating the supply of raw material and delivering what the process
    needs exactly when it needs it. It controls inventory by pulling supplies to the
    production floor based on customer demand and limits the number of work items
    that can exist in the production process at any given step at any given time.
    It is usually used in just-in-time (JIT) manufacturing processes. One of the first
    principles of Kanban is to make small incremental changes to existing processes
    instead of drastic changes that might lead to a high risk of failure. Kanban is
    designed to reduce the idle time in a production process by visualizing the production
    process and the actual work passing through that process to identify potential
    bottlenecks in the process and fix them so work can flow through it cost-effectively
    at an optimal speed or throughput.


    ## Rules Of Kanban

    - Never pass defective products.

    - Use only what''s needed.


    ## Benefits Of Kanban

    - Flexibility.

    - Reduction of time.

    - Increased productivity.

    - Visualize workflow.


    ## Organize Your Life with Kanban

    - Create a daily-do list.


    ## Designing The Kanban Board

    - Set limits on work in progress (`WIP`).

    - Use sticky notes to put `WIP` on the board.


    ## When To Use Kanban

    - Repeatable workflow.


    # Accounting

    Business, Accounting, Profit, Growth, Success, Wealth...

    Accounting is the language of business.

    Accounting is the collection, compilation, and systematic recording of transactions
    of a business to produce financial statements. Financial statements summarize
    a company''s financial position with a balance sheet and an income statement.
    The accounting equation: `Assets = Liabilities + Equity` is the proposition that
    a company''s assets must be equal to the sum of its liabilities and equity. Accountants
    keep track of expenses, profits, and losses. Accounting does not require hard-core
    math. Basic addition, subtraction, multiplication, and division are enough. However,
    accounting is a bit more difficult to master due to its strict sets of rules.


    ## Types Of Accounting

    - Financial accounting.

    - Cost accounting.

    - Managerial accounting.

    - Tax accounting.

    - Fiduciary accounting.

    - Government accounting.

    - Forensic accounting.

    - Corporate accounting.

    - Private and Public accounting.


    ## Accounting Process

    - Identify transactions.

    - Record transactions in a journal.

    - Post journal entries to the general ledger.

    - Adjust journal entries.

    - Prepare financial statements.

    - Close the books.


    ## Main Accounting Keywords

    - Assets.

    - Liabilities.

    - Equity.

    - Revenue.

    - Expenses.


    ## Golden Rules Of Accounting

    - Debit the receiver, credit the giver.

    - Debit what comes in, credit what goes out.

    - Debit all expenses and losses and credit all incomes and gains.


    ## Accounting Software

    - Billing/Invoicing Software.

    - Payroll management system.

    - ERP Systems.


    ## Accounting Entry

    An accounting entry is the formal recording of all the transactions in the book
    of accounts of the company where the debit and credit are recorded. The main types
    of accounting entries are transaction entry, adjusting entry, and closing entry.
    Every transaction has two journal entries: a debit and a credit. Debits must always
    equal credits. This double-entry technique (`debits equal credits`) helps in preventing
    some common bookkeeping errors.


    ## Types Of Journal Entries

    - Simple entry.

    - Compound entry.

    - Opening entry.

    - Transfer entries.

    - Closing entries.

    - Adjustment entries.

    - Rectifying entries.


    ### Simple Entry

    A simple journal entry is an accounting entry in which just one account is debited
    and one is credited.


    ### Compound Entry

    A compound journal entry is an accounting entry in which there is more than one
    debit and more than one credit.


    ### Transfer Entry

    A transfer is a type of journal entry used to move funds from one project account
    to another or from an operating account to a project account.


    ### Adjusting Entries

    Adjusting entries are made at the end of the accounting period after a trial balance
    has been prepared. Adjusting entries enable you to adjust revenues and expenses
    to the accounting period within which they occurred. When an error is committed
    in the books of accounts the error should be corrected to show true numbers in
    financial statements. If the error is immediately identified it may be fixed by
    striking out the wrong entry and replacing it with a correct one.


    ## Accounting Principles

    - Accrual principle.

    - Conservatism principle.

    - Consistency principle.

    - Cost principle.

    - Economic entity principle.

    - Full disclosure principle.

    - Going concern principle.

    - Matching principle.


    ### Accrual Principle

    The general concept of accrual accounting is that you record the expense at the
    time when it occurs rather than when payment is made.


    ### Conservatism Principle

    Accounting conservatism is a principle that requires accounts to be prepared with
    caution. All probable losses are recorded, while gains are only recognized when
    realized.


    ### Matching Principle

    The matching principle is part of Generally Accepted Accounting Principles (`GAAP`)
    and requires that any expenses incurred be recorded in the same period as related
    revenues.


    ## Financial Accounting

    Financial accounting is a specific branch of accounting that provides information
    about a firm''s performance to external parties such as investors and creditors.


    ### Cost Accounting

    Cost accounting is a process of assigning costs to objects such as the company''s
    products, services, and other activities. It identifies where a company is spending.


    ### Tax Accounting

    Tax accounting deals with the preparation of tax returns and payments. It is used
    by individuals, businesses, and other entities.


    ### Managerial Accounting

    Managerial accounting is responsible for creating statements, reports, and documents
    that help management in better decisions related to business performance.


    ### Fiduciary Accounting

    Fiduciary accounting is a report of activities within a trust, estate, or conservatorship
    during a specific time to show all receipts and expenses managed by the executor
    or trustee.


    ### Government Accounting

    Government accounting is the accounting system followed by the government for
    recording, classifying, summarizing, and interpreting the financial transactions.


    ### Forensic Accounting

    Forensic accounting is the use of accounting principles, auditing principles,
    and investigative skills to examine the finances of an individual or business
    to look for fraud and embezzlement to explain the nature of crime in court.


    ### Corporate Accounting

    Corporate accounting is a special branch of accounting that deals with preparing
    cash flow statements and interpreting financial results for specific events.


    ### Private and Public Accounting

    Public accountants and public accounting firms are not employed solely by any
    one client, and as such they are not part of the client''s business or corporate
    structure. Private accountants, on the other hand, work for a specific company
    or business entity for which they offer accounting services.

