    ## 组织使命


    组织使命是机构存在的目的。公司的组织使命反映了此类信息，例如它生产什么类型的产品或服务、客户群体是谁，以及它所持有的价值。


    `Racpro` 将提供安全、负担得起、高质量、环保且位置优越的 1、2、3 室分产权制住宅单元，其面积从 `45m2` 到 `120m2` 不等，价格从每单元
