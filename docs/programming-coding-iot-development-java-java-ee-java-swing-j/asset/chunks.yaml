- fmt: '

    # Interview Preparation and Career Advice


    ## Dos

    - Smile

    - Keep calm

    - Make eye contact

    - Slow down if you turn to talk quickly

    - Prepare a list of your stories

    - Wear a suit (blue, grey, or black with a white shirt)

    - Give firm but not bone-crushing handshake while making eye contact and smiling.

    - Stand up to greet your interviewer (nice to meet you)

    - Bring your `CV` in a neat professional folder

    - Turn your cellphone off

    - Try to frame your answers in a `SARS` technique


    ## What not to do

    - Don’t be too early.

    - Don’t be late.

    - Don’t wear too much cologne.

    - Don’t be afraid to repeat what is already in the `CV`.

    - Don’t give opinions when answering. Give evidence, success stories.


    Remember, these people want to hire you already, they believe in you, they already
    saw what kind of a person you are they just want to confirm it. So, do not try
    to be exceptional, follow the basics. Just shut up, answer what they are asking
    and go out. These people will never interview a person who they do not want to
    hire. Remember, they are for you not against you.


    ## Follow the basics

    - Dos and Don’ts

    - Confidence and panic

    - Dress code and protocol

    - Tips and procedures


    ![](image_rsrc4MW0.jpg)

    ![](image_rsrc4MW1.jpg)


    ## Jobs with No Experience Required

    - Customer Service Representative

    - Real Estate Agent

    - Sales Account Representative

    - Medical Assistant

    - Administrative Assistant

    - Veterinary Assistant

    - Customer Care Specialist

    - Legal Assistant

    - Baby sit or take care of pets

    - Freelance

    - Online jobs


    ## How to get a job fast

    - Study the responses you get

    - Create the best resume ever (by continuously editing it)

    - Tabulate your skills on your `resume`

    - Master the job interview skill

    - Make sure you don’t have dirt on social media

    - Continuously improve your skills

    - Apply for more jobs than anyone in the market


    ## How to build a successful career

    - Set goals

    - Brand your resume

    - Know your Strengths and weaknesses

    - Take responsibility and set your standards

    - Get a mentor

    - Network and apply for jobs


    ### Tips of writing a good career goal

    - Dream big

    - Determine your competitive advantage

    - Be flexible and adaptable

    - Match job requirements to your education

    - Evaluate your current skill

    - Keep in mind your interests

    - Consider job growth and demand


    Below is a list of top jobs with respect to money and demand.

    - Statistician

    - Medical Field

    - Technology field (Software Developer and Data Science)

    - Finance

    - Education

    - Technical Jobs (engineering and the like)

    - Business services (including consulting jobs, management and sales)


    ### A list of jobs that are decreasing in demand due to Information Technology

    - Travel agent

    - Cashiers and bank tellers

    - Mail carrier

    - Sports referees

    - Telemarketer

    - secretaries


    ## How to get a job with no work experience

    - Screen for jobs (This means apply for over 50 jobs per day)

    - Study the response you get from screening, study which fields are you valued
    the most in.

    - Concentrate on these fields and keep applying for 50 jobs per day.

    - Remember it takes 5600 job applications to get your dream job. Applying for
    50 jobs per day, it will take you 4 months to get your dream job.


    ## How to enjoy your work

    - Keep a positive perspective

    - Have a personal life that has nothing to do with your job

    - Create a to-do list

    - Delegate when needed

    - Take regular small breaks

    - Make your workplace more pleasant

    - Plan and review your day

    - Work hard and smart

    - Set a routine


    ## Tips for telephone interview

    - Dress smart. This can help you feel professional and take things seriously.

    - Make sure you are in a quiet room with a table.

    - Have your job post that you applied for and your notes (skills, qualification
    and experience) written down. This is like an open book test. Remember to ask
    for the job post to be sent to you when you get an invitation for an interview.

    - You may stand if you like. Science suggests that you speak more clearly when
    you are standing. This is because your diaphragm relaxes, and your chest opens
    so you breathe and talk with ease. You may walk around, it helps you relax if
    you are scared.

    - Make sure the line is good, don’t force to continue if the line is bad, instead
    ask to be called on a different number.

    - Ask if you did not hear the question properly

    - Make sure you speak loud enough to be heard and don’t speak to fast.

    - Don’t ramble, Keep your answers clear and concise.

    - Smile, this will help you relax and sound confident

    - Keep calm and relax, don’t be afraid to pause and think and don’t panic when
    they keep quiet, they might be making notes.


    ## Job Interview Skills

    - Match your skills, qualification and experience to the job requirements. The
    job title does not matter. The important thing is your skills, qualification or
    education to be similar to the job specifications.

    - Practice how to answer interview questions. One way to do this is to write your
    skills, qualification and experience done then recite them write chance your

    - Research the company.

    - Practice assessment tests (if there is).

    - Know what to do and not to do in interview (Including dress code).

    - Follow up


    ### Sample questions you can ask in interview:

    - What are common personalities employees share?

    - What is it that I want to work extra mile?

    - If you were to hire me, what would be the key priority is expected of me?

    - Do you support employees who are interested in studying further?

    - What are your company’s focus areas?

    - What would you say is your number one characteristic?

    - How and when should I follow up with you?

    - Based on my background and skills, what do you think will be my challenges for
    this position?

    - What does your company represent as success in the current position?


    ## Tools For Job Hunting

    - Social Media

    - Apps

    - Email

    - Search engines


    ## Steps to job hunting

    - Always update your `Resume`

    - Complete online profiles on company websites

    - Use the internet effectively

    - Search and apply for jobs

    - Prepare for interviews

    - Prepare for assessment tests

    - Ace interviews

    - Choose your referees carefully


    ## Top skills necessary for any employee

    - Business acumen

    - Good communication skills

    - Teamwork

    - Negotiation skills

    - Problem solving / Analytical skills

    - Leadership skills

    - Stress management

    - Confidence


    ## Where to find information about the company

    - Company website

    - Google

    - Talk to their employers

    - Read company reviews on jobs search engines like `indeed`

    - Press release


    ### What to know about the company?

    - Their mission, vision and values (usually found on company’s website)

    - Company’s awards and achievements

    - Company’s divisions and size

    - Company’s reputation

    - Their products and competition

    - Know the industry performance. (Usually on stock market websites eg `moneyweb`)


    ## How to match your skills, qualifications and experience to the job post:

    - Summarize the job post into skills, experiences, knowledge and duties and write
    down the keywords used.

    - Summarize your skills, qualification and experience. Write down keywords.

    - Compare the two summaries and see if they match. That is what you will be discussing
    in an interview – how your skills, qualification and experience match the job
    post. Remember, an interview is a conversation between you and the interviewer,
    and the topic is your skills, experience and education; nothing else.

