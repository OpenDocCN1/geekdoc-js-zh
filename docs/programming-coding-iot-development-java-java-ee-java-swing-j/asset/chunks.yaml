    * 在他们自己的游戏中击败他们。


    ## 正念

    意识、自我掌控、信息、成长、成功、财富……意识是第一步。

    正念是一种对你的感受进行强烈觉察的状态，而不进行解释或判断。正念通过学习专注于当下来帮助身心放松并帮助减轻压力。正念有许多生理和心理上的益处；包括自控、灵活性、提高注意力、头脑清醒、情感智商，最重要的是，它为你的成功做准备。


