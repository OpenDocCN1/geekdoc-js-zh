    # 奢侈与成功


    奢侈可以被定义为我们购买但对人类生存并非必不可少的昂贵材料。这包括昂贵的汽车、豪宅、小摆件等。奢侈的生活方式是使人们追求成功并努力挣钱的动力之一。如果使用得当，对奢侈生活的追求可以成为一种很好的动力。如果你想过上奢侈的生活，你就必须努力且聪明地工作，以便能够赚钱并实现目标。


    人们想过上奢侈的生活，是因为人们通常认为，只要有足够的钱，所有问题都会消失。金钱加上其他资源和良好的性格特征可以解决你的所有问题，然而，单金钱无法解决所有问题。因此，必须记住，无论你拥有多少钱，无论你的生活方式多么奢侈，你仍然需要强大的核心价值观和领导力，这样你才能将它们与金钱结合，高效地解决所有问题，从而带来健康、财富和成功。


    ## 如何保持动力

    - 制定 `SMART` 目标。

    - 从失败中学习。

    - 从你的弱点中获益更多。

    - 记录你的成就。

    - 每日回顾目标和进度。

    - 设定新目标。

    - 喝咖啡。

    - 寻找导师。

    - 每天锻炼。

    - 不要期待自己变得完美。

    - 使用积极的自我对话。

    - 创建待办事项。

    - 发挥你的优势并改进你的弱点。

    - 认可你的成就。

    - 不要放弃，休息并寻求帮助。

    - 避免分心。

    - 现在就开始开始——无论大小，这并不重要。

    - 将任务分解为细小的步骤。

    - 建立积极心态。

    - 在每个里程碑后奖励自己。

    - 缩短你的待办清单。

    - 设定让你兴奋的里程碑。

    - 消除压力。

    - 减轻负担。

    - 过健康的生活方式。

    - 保证睡眠。

    - 维持良好的体重。

    - 限制酒精摄入。

    - 休息片刻。

    - 请求反馈。

    - 简化你的日常生活。

    - 迈出小步。

    - 学习新事物。

    - 规划你的一整天。

    - 不要等正确了才行动。

    - 盯紧目标。

    - 散步。

    - 保持专注并记住你的“为什么”。

    - 在你的目标中找到你感兴趣的事。

    - 告诉人们你的目标。

    - 跟踪你的进度。

    - 设定小型的、易化的且可衡量的目标。

    - 关注大局。

    - 开发座口铭。

    - 创建常规。

    - 考虑通过小增量来完成。

    - 不要把任何事情都看作苦差。

    - 每天阅读。

    - 创建时间表。

    - 建立专门的工作空间。

    - 在小时间段内工作。

    - 挑战自己。

    - 练习良好的自我照顾。

    - 关注不一致性。


    ## 什么能激励人们？

    - 金钱。

    - 学习的欲望。

    - 帮助别人的欲望。

    - 对美好事物的渴望。

    - 控制欲。


    ## 动力的类型

    - `Extrinsic`（为了实现或避免某种结果）。

    - `Intrinsic`（追求成功的内在驱动力）。

    - `Family`（为爱的人提供生活的欲望）。


    ## 如何提升心情

    - 微笑。

    - 保持忙碌（看喜剧电视）。

    - 与人聊天。

    - 帮助他人。

    - 活在当下。


    ## 如何过上奢侈的生活

    - 精通技术。

    - 购买奢侈品牌。

    - 保持健康生活。

    - 持续学习新技能。

    - 建立强大的关系。

    - 少工作，定期休息。


    ## 比特币、加密货币与交易

    钱、交易、亏损、信息、增长、成功、财富……每个人都认为自己可以战胜市场。


    加密货币（`crypto`）是一种数字货币，可以使用在线账本记录并保护在线交易，用于购买商品和服务，而无需通过银行。加密货币引起了大量关注，因为它有潜力改变目前世界的交易方式，然而，大多数人将这种关注误认为是交易的机会。


    交易是非常危险的，无论你交易的是什么。如果你想从加密货币中赚钱，你所做的只是注册一个区块链课程，获得证书，在加密领域找份工作，很有可能他们会付给你很多钱，因为这是一个新领域。`Blockchain`
    是交易的数字记录，交易使用稳定的加密签名进行记录，并且为了安全，记录在整个计算机系统网络复制并分布。这简单意味着当你用加密货币（如 `Bitcoin`）买房子时，你不再需要去银行进行交易，你只需要在手机上买房，你的交易将被记录并存储在
    `blockchain` 上，这是一个数字账本/记录。这就是加密货币的好处。加密货币的坏处是每个人都想开始交易加密货币，因为他们感受到了热度，但他们没有意识到加密货币的热不是为了交易，而是为了改变全球经济。这种误解导致许多人赔。


    ### 比特币

    `Bitcoin` 是一个计算机文件（电子货币），存储在智能手机或电脑的数字钱包应用中，你可以通过数字钱包分享比特币，每一笔交易都记录在名为 `blockchain`
    的公共列表中。你可以以极低的费用轻松地将 `bitcoin` 兑换为现金或黄金等资产。你可以像交易股票或外汇一样交易 `Bitcoin`，就像任何其他交易工具一样，大多数人在交易
    `Bitcoin` 时都会亏钱，我建议你不要交易 `Bitcoin`，直接远离交易即可。


    ### 交易

    交易通常涉及股票或外汇的买卖，试图把握时机并获得利润。目标是低价买入，高价卖出。有些交易者是日内交易者，这意味着他们整天都在买卖。大多数人在交易 `Bitcoin`
    时都会亏钱，我建议你不要交易 `Bitcoin`，直接远离交易即可。大多数交易者都会亏钱，没有人通过交易变得富有。这本书将解释如何在不交易的情况下变富有。如果你仍然想尝试交易，请在亏钱后从错误中学习，并且不要再做了。对于那些被雇佣的交易者，我仍然提供交易建议，因为经验是更好的老师。


    ## 如何交易股票、外汇或加密货币

    - 开一个经纪账户。

    - 建立一个健康财务计划。

    - 学习使用 `market orders`（市价单）和 `limit orders`（限价单）。

    - 尽可能多看视频。

    - 衡量你的盈亏 `profit/loss`。

    - 研究市场。


    ## 最佳交易平台

    - `TD Amerit`

    - `Fidelity`

    - `Robinhood`

    - `Merrill Edge`


    ## 购买比特币的步骤

    - 建立账户。

    - 验证你的邮箱。

    - 连接你的手机。

    - 添加支付方法。

    - 购买 `Bitcoin`。


    ## 最佳加密货币

    - `Bitcoin` (`BTC`)

    - `Cosmos` (`ATOM`)

    - `Dogecoin` (`DOGE`)

    - `Ethereum` (`ETH`)

    - `Compound` (`COMP`)

    - `Polkadot` (`DOT`)


    ## 技术分析

    人们认为他们可以在交易中获胜，因为他们花费了太多时间阅读技术分析，但他们没有意识到市场的变化。这意味着技术分析是无用的且危险的。所以，你在交易中获胜的机会更大，如果你不进行技术分析的话。


    ## 成为百万富翁的最好方法

    - 发展你的职业和专业知识。

    - 存下钱。

    - 投资房地产。

    - 寻找机会并扩大规模。

    - 创建一个财务计划。

    - 不要交易（股票、外汇……）。


    ## 赚百万

    职业、增长、资金管理……你学得越多，赚得越多。成为百万翁从设定目标开始。将你的目标分解为更小的框架。将你的目标分解为每月、每周和每年。每天改变并改进你的目标。这被称为规划，这也是大多数人失败的地方。人们害怕修改他们的目标。这被称为增长。你可以在任何地方以任何方式成为百万翁，你只需要保持增长。增长意味着获取尽可能的信息。你拥有的信息越多，你赚的钱就越多。成为百万翁最简单的方法是持续思考如何增加你的钱，把它写下来，执行它并重复。当你这样做时，你正在分析脑子里的信息，开始批判性地思考，成为百万翁不再是幻想，最重要的是开始看到机会。成功是机会遇到准备。这包括资金管理、信息和动力。书中涵盖了所有内容。这本书将为你准备。当机会出现在面前时，你知道该做什么。


    ### 如何成为百万富翁

    - 投资指数基金和房地产。

    - 专利一个想法。

    - 建立一个业务。

    - 跟踪你的支出并减少它们。

    - 为项目和机会存钱。

    - 创建一个让钱增长的计划。

    - 学习新技能。

    - 寻找机会。

    - 避免坏债。

    - 消费低于你的收入。


    ### 高需求业务

    - 税务准备和记账。

    - 餐饮服务。

    - 网站设计。

    - 商业咨询。

    - 洁洁服务。

    - 在线辅导。

    - 咨询。


    ### 容易启动的业务

    - 销售顾问。

    - 草坪维护。

    - 保姆。

    - 清洁服务。

    - 维修杂工。

    - 写作和翻译。


    ## 财富

    钱、投资、财务计划、现金……努力且聪明地工作。财富由于金钱和其他事物的大量积累而的一种平静状态，这种舒适可以提供保险和安心。这种舒适的状态让你的大脑有足够的自由去行使领导力，从而提高你的性格，结果你天生就是一个领导者。要获得成功，你需要持续增长。每个人一生都需要成功。成功是你所做的大多数事情获得积极结果的能力。这意味着你将在财务、社交和个人方面实现目标。在生活的各个领域持续增长的能力带来大量的钱。这是因为钱是所有资源的代表，随着你的成功，你将不断积累比使用的更多的资源。这些资源将以钱本身或物理材料的形式存在。大量的钱和物质导致了财富。


    ### 财富规则

    - 财富取决于你的投入。

    - 购买别人的时间。

    - 寻找初创企业并扩大规模。

    - 为钱解决问题。

    - 少花、多赚并扩大规模。

    - 解决扩展性问题。

    - 财务计划、投资、资产。

    - 停止在无用的爱好上浪费时间。

    - 采取适合你的方法。

    - 根据你的计划或待办事项列表工作。

    - 自动化并委托一切。

    - 衡量并增加你的投入。

    - 将你的技能卖给世界。

    - 延迟满足并在 90% 的时间里工作。

    - 为失业人员创造工作。

    - 90% 的时间里留在室内，阅读并创造工作。

    - 雇佣有能力的人。

    - 按小时支付工资。


    ## 投资

    职业、钱、投资、增长、成功……房地产、指数基金或退休基金。现在你知道如何增长你的职业，你可以增加钱。如果你仍然不知道如何开始和增长，这本书将带你通过。房地产，指数基金或退休基金。你可以尝试，不要担心太多事情。这里（等等，原文中有很多重复的杂乱码/重复/scrambled
    text in the source，e.g., "Invest in property, index funds or retirement funds"
    出现了多次）。


    ### 投资规则

    - 投资你理解的业务。

    - 多元化你的投资组合。

    - 早点开始。

    - 投资好公司。

    - 投资是长期的。

    - 你不需要。


    ## 被动收入

    被动收入、增长、成功、财富……在你睡觉时赚钱。被动收入是在无需投入大量精力的情况下获得的。


    ### 被动收入点子

    - 投资股票。

    - 出租你的房子。

    - 创建 YouTube 频道。

    - 建立一个会员网站。

    - 加入联盟营销计划。


    ### 收入来源

    - 员工收入。

    - 利息收入。

    - 分红收入。

    - 资本利得。

    - 权税或许可收入。


    ### 如何在线赚钱

    - 成为虚拟助理。

    - 成为记账员。

    - 在副业赚钱。

    - 加入 Uber 或 Lyft。

    - 在 Snapwire 上卖。

    - 在 Amazon 上卖。

    - 使用 Instacart 配送杂货。

    - 开启一个在线商店。

    - 使用 Turo。


    ## 电商

    互联网、销售、增长、财富……互联网是为了销售。电子商务（电子商业或互联网商业）是指使用互联网进行交易。


    ### 如何启动电子商务业务

    - 寻找一个分市场。

    - 研究你的目标市场和产品点子。

    - 寻找要卖的产品。

    - 注册你的业务名称。

    - 决定使用哪个网站来卖。

    - 确定业务结构。

    - 理顺你的财务。

    - 营销你的直销商店。


    ### 直销的缺点

    - 竞争激烈。

    - 缺乏控制。


    ### 直销网站

    - `Spocket`

    - `Modalyst`

    - `Productpro`

    - AliExpress Unitres Dropship

    - `Importify`

    - `AliExpress Dropshipping`

