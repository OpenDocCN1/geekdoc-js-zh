  trans: '

    这是面试中最重要的原因。你所有的面试答案都应该围绕证据（成功故事）。请记住，简历是你生活的简要总结，因此他们希望你对此进行详述。例如，如果他们问你为什么要雇佣你，他们已经从你的简历中看到你在特定领域拥有经验，他们知道这就是他们需要雇用你的原因，但他们只是希望你用成功故事（证据）来支持这些经验，并在可能的情况下提供确凿的证据。如果你没有书面证明来支持简历上的某些技能和/或经验，请不要担心，支持你主张的最常见方法是讲述成功故事，这正是他们需要的全部证据。你将在下述的问题中看到，用成功故事支持你的答案是多么简单，但首先，让我们来看看面试的结构。


    # 面试类型


    ## 电话面试

    有时这被用作招聘的一部分，如果你通过了电话面试，将受邀参加另一次面试。请以对待任何其他面试的专业方式处理每一次电话面试。从专业地接听电话开始。不要太花哨，一句真诚的“你好”就足够了。就像你的邮箱地址，你的语音邮件/自动应答信息也应该是专业的。


    ## 面试

    这可能是招聘流程的一部分，如果你通过了它，将受邀参加另一次面试（通常是小组面试），或者你可能会被召回参加评估测试。要表现专业并做好充分准备。有些公司没有冗长的招聘流程，这可能是你参加的唯一面试，之后你就会获得录用通知书。好吧，希望确实如此。


    # 准备面试

    让一切都围绕你的技能、资质和经验展开


    ### 调研公司

    当你调研公司时，不要只是浏览他们的网站，要挖掘得更深一些。这将帮助你恰当地回答问题，并帮助你展示你对公司的兴趣，从而使你从那些没有投入时间研究的候选人中脱颖而出。调研公司还将帮助你为面试官准备问题。


    ### 将技能、资质和经验与职位描述匹配

    这是面试准备中非常重要的一部分，因为问题将围绕职位要求和职责展开。面试官会提问以查看你是否具备所需的特征，以及你是否能够履行这些职责。将你的技能和资质与工作的要求及职责匹配，将让你很好地了解招聘人员寻找什么样的特征，以及你被要求承担哪些职责。这将帮助你了解自己拥有哪些要求的特征，哪些又没有，以便你开始研究和学习那些你不具备的特征。这里的技巧是，千万不要就你不具备的特征对面试官撒谎；要诚实，并告诉他们你将竭尽全力学习。


    关于这些技能的书数完胜，确保你每天阅读这些书籍以自我提高和发展。如果你没有时间看书，至少在面试前读读关于这每项技能的一篇文章。请记住，这些只是常见技能，公司可能还需要更具体的技能，例如高级
    Excel。


    ### 研究职位描述

    确保你了解职位描述中写的工作职责的所有内容。问题将集中在职责上，有时招聘官可能会非常具体且具有挑战性的问题，例如，如果其中一项要求是具备 `AWS` 知识，招聘官可能会问：`AWS`
    主板的输出电压是多少？这确实很深奥。不过不用担心，招聘官在针对高级职位时会转向更具体的问题，有时招聘官只是想看到你的思维过程。基本上，职位要求就像考试大纲，它告诉他们他们将测试你哪些内容，你必须去刻苦钻读。如果要求之一是具有操作
    `hplc` 机器的经验，而你对该机器零经验，那么你必须确保在去面试时已经读过该机器，并且对该机器有深入的知识。当问及该机器时，千万不要撒谎说你有机器操作经验，不！直接告诉他们你没有该机器的经验，但你对机器的工作原理非常了解，然后继续展示你通过阅读该机器所获得的知识。现在你知道为什么投入大量时间准备是非常重要的了。


    ### 准备成功故事并烂记于心

    在回答面试问题时，使用 `SARS` 方法。`SARS` 代表 `Situation`（情境）、`Action`（行动）、`Results`（结果）和 `Summary`（总结），这意味着尝试突出你所面临的`情境`、你采取的行动、结果，然后总结你的故事，以展示它如何与问题相关，也许以及学到的教训如何应用于你所申请的工作中。


    保持主题，与其东散西凑，不如根本什么都不谈。不要只谈论你的技能；要向他们展示你的技能如何造福公司，例如，不要只说我有气象学的 `BSc` 学位，而要说：“我有气象学的
    `BSc` 学位，可以从许多方面造福公司。”看看公司想要什么（职位职责），并告诉他们如何为他们做到。将你的特质与他们的需求匹配。你增加了什么价值（你还有哪些能造福公司的其他价值）。


    # 常见面试问题及示例答案


    ## 问题：请介绍一下你自己

    **备注**

    面试官并不是要求你讲述人生平，他们希望你介绍与你申请的职位相关的性格特征。这包括你的经验、资质和技能。不要谈论你喜欢或不喜欢的什么。告诉他们与工作相关的经验、技能和资质。专注于技能。记住要保持答案简洁，，如果你有很多经验或技能，给出与之相关的。每当你谈论技能、教育或经验时，确保提到它们如何对他们有益，从而使你成为最佳候选人。给他们一个关于经验、教育和技能的简洁总结，如实所说。


    **答案**

    我在开普敦大学毕业了化学专业的 `BSc` 学位。我还有一份关于生产运营的证书，这提高了我的生产力。我有两年的分析师工作经验，非常熟悉操作现代仪器，如 `HPLC`、`XRF`
    等。在我的上一家公司，我负责编写标准操作程序 (`SOP`)，我将实验室的事故减少了 5%。我的主要优势是沟通技巧，这在我的推荐信中显而易见。我想加入一个提供成长和奖励组织。


    ## 问题：你的工作经历中有空白期吗？

    **备注**

    不要给出与疾病相关的答案，除非你被裁了，否则必须诚实。始终保持积极，面试官在邀请你面试之前他们并不在意空白期。回答这个问题的好方法是告诉他们在空白期间做了哪些积极的事情，并尝试提供证据，否则听起来可能像在撒谎。


    **答案**

    公司在缩减，他们不得不辞退员工。在空白期间，我写了一本小说；2012 年我发布了一个博客；2013 年我设计了一个品牌；2014 年我注册了一家公司并写了一份商业计划。这是我申请这个职位的原因之一，因为这是一个快节奏的环境。


    **备选答案**

    离开 Ramps Consulting 是我决定去国外。在空白期间，我在普勒托利亚大学参加了一个在线课程，增加了我的知识。


    ## 问题：你有……的经验吗？

    **备注**

    面试官会问你是否具备某项他们寻找的技能，即使他们在简历中看到了你具备或没有。如果你没有这项技能，不要犹豫地说“不”。然而，这不是问题；我有很强的学习倾向，适应能力很快。当我开始上一份工作时并没有任何经验，但工作需要技术经验，在两个月内我已经学会了如何操作仪器。


    **答案**

    是的，我有五年操作 `HPLC` 机器的经验。


    ## 问题：你有证书吗？

    **备注**

    面试官可能会问你是否拥有某项资质，特别是当他们知道你没有时。诚实地说“没有”，但你愿意学习。


    **答案**

    不，但我在开普敦大学拥有了化学专业的 `BSc` 学位，涵盖了气象学的某些方面，例如气压、湿度等。所以尽管我没有证书，但我对气象概念并不陌生。


    ## 问题：你最大的优势是什么？

    **备注**

    要具体，并举一个简短的工作相关的例子来展示你的优势，选择与他们寻找的内容相关的例子。如果你觉得你已经在简历或求职信中提到过你的优势，不要担心，再次提到也是可以的。回答时要记住职位描述。确保你给出的优势是公司寻找的特质之一。这应该是你真实的优势，不要编造你认为会让你看起来很好的虚假优势。给出你真实的优势，但要确保你给出的是一个能造福公司的优势。


    **答案**

    我最大的优势是我具备有效沟通的能力。我在上一家公司的工作职责之一是指导新员工。我确保与他们进行有效沟通。我积极倾听他们知道和不知道的，以便我可以逐一向他们解释。成功的沟通关键是以对方更容易理解的方式进行沟通。结果是员工很快学会了如何使用仪器并轻松地适应了工作环境。


    **备选答案**

    我最大的优势是我管理多项任务的能力。2012 年，我在假期期间在普勒托利亚大学参加了一个课程，并同时在斯特兰堡大学参加了聚合物科学课程，我以优异的完成了它们。此外，在完成
    `BSc` 学位时，我在普勒托利亚大学修了三个不同的专业。


    ## 问题：你最大的弱点或可以改进的地方是什么？

    **备注**

    每个人都有弱点，但现在不是不是随口所想就说的时候——你不在酒吧。不要说完全离谱的话，比如我是个酒鬼或我是个变态。面试官只是想看你是否具有自我意识，或者你是否认为自己是超人。此外，他们还想看你如何应对弱点；你是否愿意将弱点转化为优势。选择一个你有过的弱点，不要谈论你认为的弱点，这可能会给你带来负面声誉。


    **答案**

    我的弱点是缺乏一些组织能力。这个缺点是它非常消耗时间，因为在这个问题上我读了许多相关文章，我不再在这个问题上感到挣扎。我使用的策略之一是回到那些可以解决问题的地方。


    ## 问题：你期望薪资是多少？

    **备注**

    薪资显然很重要；然而，要确保我们给出一个双方都能接受的薪资，如果我适合这个职位。


    **答案**

    我要求的薪资范围在 `100,000` 到 `200,000` 之间，我认为这个范围对我是公平的。


    **备选答案**

    我目前的薪资是 `150,000`，我认为这个范围对公司来说是好的。


    '
- fmt: '

    ## Job Responsibilities


    1. Operating laboratory equipment such as `HPLC`, `GC`, `UV`, `AA`, `Karl Fischer`,
    `Dissolution baths`, `IR` and more.

    2. Manage the laboratory equipment.

    3. Undertake minor maintenance and cleaning of laboratory equipment and apparatus.

    4. Adhere to all health and safety protocols.

    5. Proficiency in using modern laboratory equipment.

    6. Mentoring and teaching new employees the job.

    7. Computer literacy (spreadsheets, graphics and word processing).

    8. Experience in setting up and running an analytical laboratory.

    9. Staff management.

    10. Write standard operating procedures.


    ## Alternate Answer


    I do not have experience in this field but over the years I have gained skills
    that are relevant to this job such as:


    1. **Computer skills** - I am a proficient computer user with advanced MS Office
    skills including `Word`, `Excel`, `PowerPoint`, `Access`, `Publisher` as well
    as common e-mail programs such as `webmail` and `Outlook`; I completed a short
    computer skills course at the University of Cape Town (`UCT`).

    2. **Ability to manage multiple tasks** - In 2012, I was enrolled in a word power
    course at the University of Cape Town (`UCT`) during winter vacation and a polymer
    science course at the University of Stellenbosch simultaneously which I completed
    with outstanding results. Also, I majored with three different specializations
    simultaneously at `UCT` when I was completing my `BSc` degree.

    3. **Teamwork skills** – I worked on Marion Island where team work is a must,
    this is where I learned extensive team work skills. We were a team of three meteorologists
    on an isolated island and we were directly responsible for all meteorological
    data and maintenance of meteorological instrumentation which requires effective
    teamwork.

