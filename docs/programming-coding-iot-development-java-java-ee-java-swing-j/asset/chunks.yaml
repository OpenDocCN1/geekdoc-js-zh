    # Name, Address And Incorporation


    ## Incorporation


    The Company was incorporated under the name `Racpro Properties Proprietary Limited`
    with registration number `2003/112233/07`. The names and business addresses of
    the Bookrunner, Independent Reporting Accountants, Legal Advisors, Transfer Secretaries,
    Conveyancing Attorney, Independent Valuer and Company Secretary are shown in appendix
    A.


    ## Organisation Mission


    An organizational mission is a purpose for which the organization exists. The
    firm''s organizational mission reflects such information as what type of products
    or services it produces, who its customers tend to be, and what value it holds.


    `Racpro` will offer secure, affordable, high-quality, environmentally friendly,
    and conveniently located 1, 2, and 3 bedroom sectional-title residential units
    which range in size from `45m2` – `120m2` and in price from `R599,999` – `R1,699,000`
    per unit. The price includes modern fitted kitchen appliances.


    The target market is first-time home buyers, active adults, young professionals,
    young families, older families, retirees as well as buy-to-let investors. `Racpro`’s
    headquarters will be located in `Bedfordview, Johannesburg`. `Racpro` properties
    have lifestyle centers fitted with a well-established concierge and other all-inclusive
    value-added services including a spa, restaurant, gym, squash court, action sports
    field, games room, movie theatre, heated swimming pools, playgrounds, and free
    wi-fi within lifestyle centers.

