  trans: '


    ## 岗位职责


    1. 操作实验室设备，如 `HPLC`、`GC`、`UV`、`AA`、`Karl Fischer`、溶出浴、`IR` 等。

    2. 管理实验室设备。

    3. 承担实验室设备和仪器的日常维护与清洁工作。

    4. 遵守所有健康安全协议。

    5. 精练使用现代实验室设备。

    6. 指导并培训新员工工作。

    7. 具备计算机基础（电子表格、图形和文字处理）。

    8. 具有建立和运行分析实验室的经验。

    9. 人员管理。

    10. 编写标准操作程序（SOP）。


    ## 备选答案


    我没有这个领域的经验，但多年来我积累了许多与此工作相关的技能，例如：


    1. **计算机技能** - 我是一名熟练的计算机用户，具备高级 MS Office 技能，包括 `Word`、`Excel`、`PowerPoint`、`Access`、`Publisher`
    以及常用的电子邮件程序如 `webmail` 和 `Outlook`；我在开普敦大学（`UCT`）完成过一个短期的计算机技能课程。

    2. **多任务管理能力** - 2012 年寒假期间，我同时在开普敦大学（`UCT`）参加了词汇力量课程以及在斯特兰堡大学的聚合物科学课程，并以优异的成绩完成。此外，我在
    `UCT` 攻读 `BSc` 学位期间同时主修了三个不同的专业。

    3. **团队协作技能** - 我曾在马里昂岛工作，那里的团队协作是必须的，我在那里学到了丰富的团队协作技能。我们是一个由三名气象学家组成的团队，直接负责所有气象数据和气象仪器的维护，这需要高效团队协作。


