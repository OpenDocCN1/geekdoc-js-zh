- fmt: '

    # How to use the 80/20 rule.


    For every goal you want to achieve in your life you have to choose a lifestyle
    that will help you reach that goal. If you want to be successful, you have to
    read at least 12 books every year. If you want to become rich you have to work
    `80%` of the time which means all you do is eat, sleep, work and take one day
    off per month for fun. This is a practical application of the `80/20 rule` that
    will lead you to success.


    People want success but they don’t want to work `80%` of the time. It is not going
    to happen. Some people want to trick success, they think they are smart, they
    think they will work hard now and when they are rich they will stop working hard.
    It doesn’t work that way. If you are rich and you work less than `80%` of the
    time that means you are on your way down, give it time, you will be poor soon.
    A human being was created to have fun `20%` of the time and work `80%` of the
    time. Have one day off per month for fun and the other days will be for the inconsistencies
    of life, provided you actually calculated `80%` of the days of the month.


    ## lifestyle of the rich


    One fun day per month is the lifestyle of the rich. You see, wealthy people enjoy
    working. If you don’t enjoy working then you need to change that attitude. You
    have to enjoy working for you to be rich. You don’t have to enjoy your job, but
    you have to enjoy working. You have to enjoy growing. You have to enjoy being
    productive. If you work less than `50%` of the time you will be poor. If you work
    `50%` of the time you will live pay-check to pay-check. If you work `60%` of the
    time you will be middle class. If you work `80%` of the time you will be rich.
    If you work `90%` of the time you will be wealthy.


    ## Lifestyle, Change, and Success.


    The word lifestyle defines how people behave, what they are interested in, and
    what they believe in. It is how you live your life including your choice of hobbies,
    cultural interests, how you dress, your friends, and most importantly, what you
    spend your time on. The activities that you do during your leisure-time defines
    your lifestyle. If you read during your leisure time then one can say you have
    the mindset of the rich. You have to adjust your lifestyle according to what you
    want to achieve. If you want to lose weight you have to reduce your eating and
    choose to be active. Take the stairs instead of the elevator or park your car
    further away from your destination and take a walk.


    ## Luxury, Lifestyle, and Success.


    A luxurious lifestyle is what motivates most people. The ability to have enough
    money to spend on things that you don’t need, all in the name of fun, from onsite
    security to pools, saunas, and expensive cars. A luxurious lifestyle enables you
    to enjoy money. Money is a good motivator and the is nothing wrong with being
    motivated by money. However, most people are scared to be motivated by money because…
    Well, I don’t know why really. Money is a representation of all resources by convention.
    That’s what we all agreed on. The whole world agreed to use money as a medium
    of exchange which means you can use it to buy other resources. If that’s the case
    then why are people scared to be motivated by money? It makes no sense. The need
    for a luxurious lifestyle gives motivation and motivation gives rise to success.


    ## A Bad Lifestyle


    A bad lifestyle is associated with not doing enough physical activity, having
    an unhealthy diet, and drug abuse (smoking, drinking, painkillers, etc.). Most
    health issues that people have are directly and/or indirectly linked to their
    lifestyle. This includes illnesses, disabilities, and even death.


    You can change your lifestyle by modifying things you have control over, like
    changing your diet or your daily routine. Taking care of your health plays a big
    role in shaping your lifestyle, this includes taking care of your diet, resting,
    exercising, reading, and avoiding the use of alcohol, drugs, and tobacco. Diseases
    associated with a bad lifestyle include atherosclerosis, heart disease, stroke,
    obesity, diabetes, and more. These diseases are associated with smoking, alcohol,
    drug abuse, and the junk food we eat. Leading a good lifestyle can help prevent
    these unnecessary problems. Don’t do it because your doctor said so, do it because
    you want to be successful. Medical issues are expensive, they distract you and
    they drain your energy, making it difficult to focus on your success.


    ## Health, Lifestyle, and Success.


    A good lifestyle fuels you up and helps you focus on your goals. Success is associated
    with a productive lifestyle. Living a productive lifestyle means that you choose
    to engage in activities that help you increase your productivity like eating healthy,
    drinking responsibly, reading, managing your money daily, etc. Choose to be the
    person who enjoys being productive. Choose to work `80%` of the time. Choose success.


    ### Prioritize using the 80/20 Rule

    * List all your daily tasks.

    * Identify three tasks that give you more return.

    * Do the three key tasks and delegate the rest.


    ## Positive Thinking


