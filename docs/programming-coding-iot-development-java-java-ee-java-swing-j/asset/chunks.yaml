    印刷于美国


    ## 第一部分：智慧

    ### 科学、工程与技术。

    业务运营、数据、计算机、人工智能、利润、增长、成功、财富……


    嘿 Siri，人工智能是什么？


    人工智能（`AI`）是机器对人类智能过程的模拟，例如自然语言处理机器、语音识别机器、机器视觉、专家系统等。它是计算机、机器人或机器执行通常由人类完成的任务的能力，因为这些任务需要人类的智能和判断。人工智能的目标是创建出能够思考、学习和执行理性任务（如解决问题、决策、感知）并理解人类交流（human
    communication）的计算机和机器。


    **人工智能的类型**

    *   反应式机器

    *   有限记忆机器

    *   心灵理论机器

    *   自意识机器


    **人工智能的示例**

    *   制造机器人。

    *   自动驾驶汽车。

    *   智能助手。

    *   主动健康管理。

    *   疾病制图。

    *   自动化金融投资（交易）。

    *   虚拟旅游预代理。

    *   社交媒体监控。

    *   聊天机器人。

    *   `Siri`。


    #### 机器学习

    机器学习是人工智能的一个分支，使用数据分析方法来自动化模型构建活动。机器学习算法使用历史数据作为输入来预测新的输出值。这使得软件应用程序能够在没有被显式编程的情况下更准确地预测结果。机器学习被用于互联网搜索引擎以寻找最佳搜索结果、邮件过滤器以寻找垃圾邮件、在线商店以进行个性化推荐、检测异常交易的软件、语音识别、自动驾驶汽车等。


    **热门的机器学习技能**

    *   `Python`。

    *   `R` 编程语言。

    *   `Java`。

    *   `Scala`。

    *   `SQL`。


    #### 数学

    数学是关于数字及其运算、组合、概括、抽象、空间配置、结构和变换的科学。数学有许多分支，即代数、几何、算术、微积分等。数学让我们的生活变得有序，防止混乱，提高推理能力、创造力、抽象思维和批判性思维。


    **数学的分支**

    *   代数

    *   几何

    *   微积分


    #### 统计学

    统计学是数学的一个分支，涉及开发收集、解释和展示数据的方法，通常用于分析某事发生的概率。这在机器学习和人工智能中非常有用。统计学背后的数学理论高度依赖微积分、线性代数和概率论。概率在统计学中起着关键作用，帮助人们对更大的群体做出智能且准确的结论。


    **生活中的统计学**

    *   医学研究。

    *   天气预报。

    *   股市。

    *   消费品。

    *   决策。


    **热门统计学概念**

    *   平均值

    *   标准差

    *   回归

    *   假设检验

    *   样本量


    **统计分析的类型**

    *   描述性分析

    *   诊断性分析

    *   预测性分析

    *   规范性分析


    #### 工程

    工程是利用科学技术解决生活问题的行为。工程师通过发明、设计、建造和测试机器、复杂系统、小装置和材料来开发新的技术解决方案，在考虑实用性、安全成本的同时实现功能目标。


    **工程的分支**

    *   机械工程

    *   化学工程

    *   土木工程

    *   计算机工程

    *   航空航天工程

    *   电气与电子工程

    *   材料工程


    #### 科学

    科学是通过遵循系统的方法论寻找证据来对知识的追求和应用。科学方法论包括进行实验、测量结果和分析信息（数据分析）。科学为日常生活产生解决方案，并通过技术帮助实施这些解决方案。


    **科学的类型**

    *   数学与信息科学。

    *   物理科学。

    *   环境科学。

    *   生物科学。


    #### 计算机科学

    计算机科学是对计算机器和计算本身的研究。它研究了从算法到在硬件和软件中实现计算系统的实际问题的各种课题。计算机科学专业的学生学习如何使用计算机和计算过程来解决问题、构建网站、编写机器人、挖掘数据等。计算机科学需要理解数学和编程。离散数学、线性代数、数论和图论是与计算机科学专业相关的数学课程。


    #### 计算机工程

    计算机工程是工程的一个分支，它结合了电气工程和计算机科学领域以创建新的计算机硬件和软件。计算机工程师参与计算机架构和功能的设计。


    #### 编程

    编程或编码是通过编写系统的指令行与计算机进行通信的行为，这些指令将指示计算机执行某些操作。编程语言被用于创建网站、应用程序以及我们每天交互的其他技术。例如，你可以使用
    `HTML` 编程语言告诉你的计算机如何设计你的网站。编程和编码的意思相同，它只是使用你的计算机理解的编程语言告诉你的计算机要做什么。编程可以使用多种编程语言进行，如
    `JavaScript`、`Python`、`C++` 等。在编程或编码方面，有很多东西需要学习。只学习你那个时刻需要的内容，否则你将错过大局。大局始终是取得平衡并并在生活中获得成功。你可以通过注册课程或自学来学习编程，有很多优秀的程序员是自学成。学习编程最简单的方法是看别人做，你可以通过
    YouTube 实现这一点。编程技能在 IT、数据分析、营销、网页设计和许多工程领域都非常重要。


    **编程语言分类**

    *   过程化编程

    *   函数式编程

    *   脚本性编程

    *   逻辑编程

    *   面向对象编程


    **如何学习编程**

    *   通过实践来学习，而不只是阅读。

    *   分享、教学、讨论和寻求帮助。

    *   使用在线资源。

    *   理解基本概念。

    *   学习数据结构和算法。

    *   构建项目。

    *   实验。

    *   从 `SQL` 开始，它很简单。

    *   使用免费的在线课程。

    *   买一本书。


    **编程的类型**

    *   数据压缩

    *   错误控制

    *   加密编码

    *   线路编码


    **热门编程语言**

    *   `C++`

    *   `Javascript`

    *   `PHP`

    *   `Python`

    *   `Go`

    *   `Swift`

    *   `Scala`

    *   `Elm`

    *   `Ruby`

    *   `C#`

    *   `HTML`

    *   `SQL`

    *   `SAS`

    *   `R` 编程语言


    #### 软件开发

    软件开发是通过设计、编程、编写文档、测试和调试代码来创建和维护计算机应用程序（App）、框架或其他软件组件的过程。


    **软件开发的类型**

    *   前端开发。

    *   后端开发。

    *   全栈开发。

    *   桌面开发。

    *   Web 开发。

    *   数据库开发。

    *   移动开发。

    *   云计算。

    *   应用开发。

    *   API 开发。


    **软件的类型**

    *   应用软件。

    *   免费软件。

    *   共享软件。

    *   开源软件。

    *   系统软件。

    *   实用软件。


    #### 网络

    网络是通过设计、编程、编写文档、测试和调试代码来创建和维护计算机应用程序（App）、框架或其他软件组件的过程（注：此处原文定义与软件开发重复，已按原意翻译）。网络是通过编写系统的指令行与计算机进行通信的行为（此处原文定义与编程重复）。网络也被定义为多个计算机之间的电子连接。


    **网络类型**

    *   `LAN`（局域网）

    *   `PAN`（个人局域网）

    *   `MAN`（城域网）

    *   `WAN`（广域网）


    **计算机网络职业**

    *   网络管理员。

    *   网络架构师。


    **网络优势**

    *   通过安全卡实现。

    *   电子化集成。

