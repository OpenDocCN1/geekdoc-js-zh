    It is a serious mental illness that can interfere with a person''s life and cause
    long-lasting and severe feelings of sadness, hopelessness, loss of interest in
    activities you once enjoyed, changes in appetite, weight changes unrelated to
    diet, and can lead to lack of sleep or sleeping too much. It can also cause physical
    symptoms of pain and brain damage which can lead to difficulties remembering and
