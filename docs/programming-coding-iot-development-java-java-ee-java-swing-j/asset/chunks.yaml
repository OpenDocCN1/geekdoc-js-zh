    # 信息技术 (IT)


    信息技术（IT）是业务运营的核心。企业高度依赖 IT 来提供其产品和服务。企业完全依赖 IT 来执行其日常运营，然而，这种对 IT 的依赖也是重大风险的来源，因为如果使用不当，IT
    系统可能会导致企业无法提供其产品和服务，从而影响企业的业务绩效。企业利用 IT 来提供产品和服务、进行创新、实现战略目标，并通过卓越的运营获得整体竞争优势。


    没有信息就没有成功。你必须能够收集和分析信息才能成功。这就是为什么阅读重要得惊人。分析信息是思考的形式，人类对信息的需求正如公司对大数据的需求一样大。这就是为什么数学如此重要。数学是分析学，分析是思考，思考需要信息，而信息通向成功。这就是成功的分析学。


    ## 信息技术示例

    * 电话和收音机。

    * 互联网。

    * 视频会议设备。

    * 计算机。


    ## 信息技术职业

    * 技术支持。

    * Web 开发人员。

    * 计算机系统分析师。

    * IT 安全。

    * 网络工程师。

    * 数据库工程师。

    * 软件开发人员。


    ## 大数据分析师所需的 5 种技能

    * 编程。

    * 数据管理。

    * 计算框架。

    * 定量分析与统计。

    * 业务知识。


    ## 高薪大数据工作

    * 量化分析师。

    * 数据科学家。

    * 统计学家。

    * MI 和 BI 专家。


    ## 大数据专业人员技能

    * `Qlik View`、`Tableau`、`Power BI` 和 `Excel`。

    * `Alteryx`、`Spotfire`、`Scala` 和 `Presto`。

    * `SAS`、`R`、`Python`、`Java`、`XML` 和 `HTML`。

    * `VB.NET`、`Azure`、`C`、`C++` 和 `C#`。

    * `Cldera`、`Cassandra`、`HDFS` 和 `Teradata`。

    * `Oracle`、`SQL`、`NoSQL` 和 `Hadoop`。

    * `Informatica`、`IBM`、`AbInitio`、`ERP` 和 `SAP`。

    * `AWS`、`Talend`、`Spark`、`Reltio` 和 `DevOps`。


    ## 大数据

    数据管理、决策、信息、增长、成功、财富……

    数据科学、数据管理、数据架构、数据工程师、这个数据、那个数据、这些数据数据……


    ## 数据管理

    数据管理是将数据存储和维护为组织价值资源的实践，以释放其潜能。管理数据需要稳健的数据策略，以及关于如何访问、集成、清洗、治理、存储和为分析准备数据的计划。`Data
    Architects` 必须设计如何有效高效地使用 IT 基础设施，以支持并最大化组织对数据的利用。


    ## 数据架构

    数据架构是 IT 基础设施如何支持你数据战略的概述或计划，展示了数据如何被获取、传输、存储、查询和保护。它是一套规则、政策、标准、图表和模型，规定并解释了数据如何在组织内部被使用、存储、管理和整合，以确保高效利用。数据架构的目的是展示数据、业务目标与运营战略之间的关系。


    ## 数据科学

    数据科学是一个多学科领域，利用科学方法、流程、算法和系统来管理数据，并从结构化和非结构化数据中提取知识和洞察。它专注于通过创建可持续的数据管理方式来解决大数据问题，并确保业务能够从数据中获益。数据科学包含了数据管理和数据分析。它是数学、统计、业务和技术的融合。


    数据科学、信息管理、数据管理、数据工程、数据仓库和数据分析在工作环境中经常互换使用，这是件好事，因为它们几乎是同一件事，但有些人仍然喜欢花时间尝试区分它们。不要那样。不要故意浪费时间。你有更多更重要的事情可以花时间去做的。正如你将在本书中所看到的，时间是成功的关键要素之一。只要你的职业是围绕大数据展开，那么你的职位名称可以是任何与数据相关的名称，这个数据、那个数据、这些数据数据……。你只需要知道
    `SQL`、`SAS`、`Excel`、`Python` 和 `R`。至少掌握其中两个。这就是你需要的全部。


    ## 数据科学工程师的基础技能

    * 数据分析（`Microsoft Excel`）。

    * 数据库管理（`SQL`）。

    * 数据质量知识（`DMBOK` 原则）。


    ## 数据科学工程师的高技能

    * 使用 `Python`、`R` 或 `SAS` 编程。

    * 对概率和统计学有坚实的理解。

    * 数据可视化工具（`PowerBI`）。


    ## 数据管理的组件

    * 商业智能。

    * 数据架构。

    * 数据治理。

    * 数据集成。

    * 数据建模。

    * 数据质量。

    * 数据安全。

    * 数据仓库。


    ## 大数据工作的热门技能

    * `SQL`、`R`、`Python` 或 `SAS` 编程语言。

    * `Microsoft Excel`。

    * 批判性思维。

    * 数据可视化（仪表板）。

    * 演示技巧。

    * 机器学习和人工智能。

    * 数据仓库。

    * ETL 工具（`SSIS`）。

    * 数据 API。

    * 编码和编程语言。

    * 算法和数据结构知识。


    ## 数据处理的六阶段

    * 数据收集。

    * 数据输入。

    * 数据处理。

    * 数据分析。

    * 数据报告。

    * 数据存储。


    ## 开发成功的数据架构

    * 评估工具和系统的工作原理。

    * 定义业务目标和目的。

    * 为数据结构制定整体计划。

    * 选择数据管理和可视化工具。


    ## 如何成为数据科学工程师

    * 学习基础数学和统计。

    * 学习编码。

    * 理解数据库。

    * 学习 `microsoft Excel` 和 `SQL`。

    * 获得技术或计算机科学学位。

    * 申请工作。


    ## 大数据工作

    * 数据科学家。

    * 数据分析师。

    * 数据工程师或数据架构师。

    * MI 或 BI 分析师。

    * 机器学习或人工智能工程师。

    * 量化分析师或统计学家。


    ## 常见数据类型

    * 布尔（`true` 或 `false`）

    * 字符（`a, b, c`……）

    * 日期（`03/01/2021`……）

    * 浮点数（`1.54345345e308`……）

    * 整数（`1234`……）


    ## 免费数据库管理软件

    * `Microsoft SQL server`。

    * `SolarWinds`。

    * `Dbvisualizer`。

    * `Manageengine applications manager`。

    * `Oracle rdbms`。

    * `Ibm db2`。

    * `Teradata`。


    ## 数据策略

    数据策略、信息、决策、增长、成功、财富……

    这就是组织使用数据的方式


    ## 数据分析（图表与仪表板）

    数据管理团队产生的数据帮助分析团队创建仪表板，从而驱动业务并确保商业智能是竞争优势的关键要素之一。分析团队从业务部门接收仪表板需求，并向数据管理团队请求数据。仪表板创建后，分析团队维护仪表板，数据管理团队维护供给仪表板的数据。数据管理团队的主要目标是根据可用资源（资金、材料、机器和人力）尽可能地生产仪表板。


    ## 自动化

    项目结束后，对新仪表板的数据流程进行优化和自动化，前提是其增加了组织的价值。


    ## 可靠性与追踪

    对所有团队的产出进行基准测试，以确保团队的可持续性和可靠性。


    接收 90% 的项目。接收需求后，团队将使用敏捷方法尽快完成任务。这涉及将任务分解为更小的里程碑，并在两周的冲刺中完成这些里程碑。成功或失败的项目都计入 90%
    之内。


