  md: "# Generating Embeddings with the OpenAI API • 19\n\nBase64 can further compress\
    \ the data if storage is a significant constraint, and many communications protocols\
    \ handle base64 encoded data more easily.\n\n+   **Dimensions:** Here, you get\
    \ to specify how many dimensions you want your output to be. This feature is only\
    \ supported, as of the time of this writing, for the text-embedding-3 model from\
    \ OpenAI. The more dimensionality an embedding has, the more both semantic and\
    \ syntactic—but it also means the more space it takes up. Figuring out the right\
    \ balance for your data involves fine-tuning to achieve the optional dimensionality.\
    \ In many instances, it's safer to use the default provided by the model.\n\n\
    Once you've submitted your request, the API returns the data in the following\
    \ format:\n\n```\nbasics_of_vector_embeddings/embedding_api_example_response.json\n\
    {\n  \"object\": \"list\",\n  \"data\": [\n    \"object\": \"embedding\",\n  \
    \  \"embedding\": [\n      0.0023064255,\n      -0.0093272292,\n      -0.0028842222\n\
    \    ],\n    \"index\": 0\n  ],\n  \"model\": \"text-embedding-ada-002\",\n  \"\
    usage\": {\n    \"prompt_tokens\": 8,\n    \"total_tokens\": 8\n  }\n}\n```\n\n\
    The API returns the actual embedding inside the data array, nested within the\
    \ embedding object. In addition to the embedding, you receive information on the\
    \ model you used and the total number of tokens created to generate the embedding.\
    \ Tokens are how the language model breaks down text into smaller units for processing;\
    \ they represent chunks of text, as we explained earlier, that the model uses\
    \ to compute embeddings. Understanding the number of tokens consumed is important\
    \ because APIs often charge based on token usage, monitoring token counts helps\
    \ you manage costs and optimize your application's performance."
