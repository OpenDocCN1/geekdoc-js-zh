    # Fraud Detection in Financial Services


    Fraud prevention is a top priority for financial institutions, where the stakes
    are high and the window to detect and respond to threats is narrow. Revolut, a
    leading Fintech company, uses vector search to power its fraud detection system,
    Sherlock.¹³


    Sherlock analyzes real-time transaction patterns and identifies anomalies that
    could indicate fraudulent behavior. The system converts each transaction into
    a vector, capturing features like amount, merchant, location, and time. It compares
    these vectors to historical patterns and flags transactions as fraudulent if a
    match suggests suspicious behavior, often within 50 milliseconds.


    Vector search, machine learning, and an optimized database architecture deliver
    this speed. Couchbase stores user and merchant profiles, enabling fast retrieval
    and real-time responses. The team continues with new models to stay ahead of emerging
    threats.


