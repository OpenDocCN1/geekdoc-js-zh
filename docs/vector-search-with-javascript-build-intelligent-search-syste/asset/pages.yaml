  md: '# Chapter 4. Building the Foundation for Vector Search • 28


    So we need a database that can handle diverse types of data, including structured,
    unstructured, and semi-structured data.


    Vector embeddings are unstructured data, and they''re also high-dimensional. As
    we discussed in Chapter 2. Understanding Vector Search, on page 11, high-dimensional
    means that the embedding has many features to describe the data. The OpenAI Ada
    embedding model has 1,536 dimensions, which means each embedding is a list of
    1,536 values. This is a lot of data to store for every blog post and user query;
    especially when you consider that we''ll be storing embeddings for every query.
    As a result, we also need a database that efficiently handles high-dimensional
    data.


    Optimizing for performance translates to also having the ability to properly index
    the vector embedding data. Indexing vector embeddings means creating a data structure
    that allows for fast retrieval of vectors on their similarity to a query. Unlike
    traditional indexing, which might rely on exact matches (like keyword search,
    as we explained in Chapter 3, Generating Vector Embeddings, on page 15), vector
    indexing is focused on similarity search, which is to find vectors that are closest
    to the query in high-dimensional space.


    We will discuss in detail the mechanics of, and setting up, vector search indexes
    in Chapter 7. Creating a Vector Search Service, on page 63, but for now, it''s
    important to understand that the database choose must be able to handle indexing
    vector embeddings efficiently. The database must be able to create and update
    indexes quickly, and it must be able to query the indexes to return results in
    a timely manner.


    Now that we have a better understanding of the requirements for our database,
    let''s take a look at the different types of databases that are available for
    storing and querying vector embeddings:


    +   • Document databases are databases that store data in a document format, such
    as JSON or XML. Document databases are well suited for storing unstructured data,
    such as vector embeddings, as they can be optimized for querying and indexing
    high-dimensional data, making them a good choice for storing vector embeddings.


    +   • Graph databases are databases that store data in a graph format, with nodes
    representing entities and edges representing relationships between entities. Graph
    databases are well suited for storing and querying complex relationships between
    data, such as the relationships between vector embeddings. Graph databases can
    also optimize querying and indexing'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'of high-dimensional data, making them another good choice for storing vector
    embeddings.


    +   - SQL databases are relational databases that store data in tables with rows
    and columns. SQL databases are well suited for storing structured data, such as
    user profiles and blog content, but they can also be used to store vector embeddings.
    While perhaps not the most conventional path to take, they''re nonetheless capable
    of storing and querying vector embeddings.


    # Other Database Options


    +   Many options are available for deploying a database in any one of these three
    categories. What follows a thoroughly non-exhaustive list of databases that you
    could consider for your project, organized by type of database:

    - Document databases: MongoDB, Pinecone

    - Graph databases: Neo4j, TigerGraph

    - SQL databases: Supabase, Neon


    Each option provides multiple deployment methods, pricing structures, and feature
    sets, including managed and self-hosted solutions. A full comparison is beyond
    our scope, I encourage you to explore and select the best fit for your needs and
    budget.


    For the purposes of this book, we''ll be using Couchbase as our database of choice.
    Couchbase optimizes the storage and querying of high-dimensional data, making
    it well suited for storing vector embeddings. It also offers Capella a fully managed
    cloud service with one-click deployment to AWS, Google Cloud, or Azure. In addition
    to its technical capabilities, Capella provides a free tier, which is ideal for
    experimentation and learning in a project like this.


    We''re using a document database, specifically a JSON document database, because
    it allows us to work with flexible, semi-structured data. JSON (JavaScript Object
    Notation) is a lightweight and human-readable format for storing data as key-value
    pairs. It is widely used in web development and works naturally with JavaScript-based
    tools. The document model makes it easy to store and query a variety of data types,
    including vector embeddings, blog posts, and user profiles, all in a format that
    aligns well with the structure of the application we''re building.


    +   https://cloud.couchbase.com'
