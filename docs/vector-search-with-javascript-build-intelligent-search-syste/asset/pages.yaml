    Whether using the SDK or making an API call using cURL, you''ll still need an
    API key to authenticate your requests. You can obtain an API key by signing up
    for an account on the OpenAI platform. Once you have an API key, you can use it
    to authenticate your requests and access the OpenAI APIs. For the cURL request,
    you''ll need to include the API key in the request header. For the Node.js SDK,
    you''ll provide the API key when instantiating a new instance of the OpenAI client.


    Here''s an example request in cURL taken from the official documentation; we''ll
    look at each of the parameters in detail:


    +   1. https://github.com/openai/openai-node

