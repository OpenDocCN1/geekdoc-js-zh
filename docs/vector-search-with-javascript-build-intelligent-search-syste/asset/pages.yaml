- img_proc: true
  md: 'That''s the core idea of vector search: represent things as numbers in a shared
    space and measure how close they are. But it can feel abstract until you see how
    those numbers behave.


    Let''s forget high-dimensional space for a minute. Say we''re comparing colors.
    We describe a color using RGB values of red, green, and blue. These three numbers
    form a vector. Blue is [0, 0, 255], red is [255, 255, 0], yellow is [255, 255,
    0], and if you have a new color, like Slate Blue [[91, 124, 153]], you can compare
    it to known colors to see which it''s closest to.


    That''s exactly what we did with book titles. The only difference is dimension.
    Instead of 3 numbers we used RGB, we worked with 1,536 numbers. The goal was the
    same: represent each item as a vector, then find the closest one.


    You saw this in action when the title Learning Vector Search with JavaScript produced
    top matches like A Common-Sense Guide to Data Structures and Algorithms in JavaScript
    and Machine Learning in Elixir. The system wasn''t matching exact high-dimensional
    vectors and looking for patterns across hundreds of abstract features. Vectors
    that pointed in a similar direction were judged to be alike.


    So what creates these vectors? How do we grow from raw text to numbers that capture
    meaning? That''s where embeddings come in.


    # Unpacking the Concept of Embeddings


    Text is more complex than colors. You need a way to generate vectors for titles
    or paragraphs so that two texts with similar meanings produce points that are
    close together in vector space. One common technique is to create something called
    an embedding.


    An embedding is a long list of numbers. Each number represents a feature extracted
    by a machine learning model. If you use OpenAI''s embedding model, each vector
    has 1,536 dimensions. You can think of these as axes in a massive coordinate space.


    The goal is for texts that similar things to have similar embeddings. For example,
    the phrases "Learning JavaScript" and "Mastering JavaScript" should land near
    each other in vector space, since they share both subject matter and educational
    intent. A phrase like "Exploring Ruby" might be close, as well, because it has
    a similar structure and purpose. But something like "Deploying Kubernetes at Scale"
    would be much farther away, even though it also describes a technical skill, because
    it belongs to a completely different domain.'
