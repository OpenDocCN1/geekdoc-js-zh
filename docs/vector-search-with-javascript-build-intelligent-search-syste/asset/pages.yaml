  md: "```\nconst calculateMagnitude = (vec) =>\nMath.sqrt(vec.reduce((sum, value)\
    \ => sum + value ** 2, 0));\n```\n\n```\n/**\n * Calculate the cosine similarity\
    \ between two vectors.\n * @param {Array<number>} vec1 - First vector.\n * @param\
    \ {Array<number>} vec2 - Second vector.\n * @returns {number} - Cosine similarity.\n\
    \ */\n```\n\n```\nconst calculateSimilarity = (vec1, vec2) => {\n  const dotProduct\
    \ = calculateDotProduct(vec1, vec2);\n  const magnitude1 = calculateMagnitude(vec1);\n\
    \  const magnitude2 = calculateMagnitude(vec2);\n  return dotProduct / (magnitude1\
    \ * magnitude2);\n};\n```\n\n```\n// Example: Calculate cosine similarity between\
    \ \"Apple\" and \"Banana\"\nconst apple = vectors.Apple;\nconst banana = vectors.Banana;\n\
    const similarity = calculateCosineSimilarity(apple, banana);\nconsole.log(`Apple/Banana\
    \ similarity: ${similarity.toFixed(3)}`);\n```\n\nThis code calculates the cosine\
    \ similarity between \"apple\" and \"banana\". Even though the numbers are arbitrary,\
    \ the math shows how closely aligned the vectors are. That alignment becomes the\
    \ basis for comparison in vector search.\n\n# Key Takeaways\n\nIn this chapter,\
    \ you learned that a vector is just a list of numbers and that similarity between\
    \ vectors can be measured with cosine similarity or dot product. You saw how embeddings\
    \ represent complex data as vectors and how systems use these vectors to find\
    \ the most relevant matches.\n\nThese ideas might feel new now, but you've already\
    \ used them. The title-matching script in Chapter 1 embedded and compiled titles\
    \ using these exact principles. With a better understanding of what was going\
    \ on under the hood, you're now ready to go deeper.\n\nIn the next chapter, we'll\
    \ explore how embeddings are generated, what makes a good embedding, and why these\
    \ representations are so powerful for building intelligent systems."
