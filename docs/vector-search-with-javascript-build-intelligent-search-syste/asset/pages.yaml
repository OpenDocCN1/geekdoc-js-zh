  md: "You create an embedding by feeding your text into a pretrained model. That\
    \ model has already learned how language works by training on massive datasets.\
    \ It compresses everything into a set of internal weights. When you pass in new\
    \ text, it produces a vector that captures key aspects of the input. This process\
    \ may feel like a black box for now, but we'll demystify it by step.\n\n# Understanding\
    \ Similarity\n\nOnce you have embeddings, the next question is how to compare\
    \ them. In other words, how can you tell which vectors are close to each other?\n\
    \nTo compare embeddings, we need a way to measure how similar two vectors are.\
    \ The most common methods are cosine similarity, which measures the angle between\
    \ vectors (regardless of their size) and dot product, which measures both direction\
    \ and magnitude. Cosine similarity answers “these vectors pointing in the same\
    \ way?” while dot product adds the question, “how strong is the signal?\n\nTo\
    \ make it more tangible, imagine comparing fruit. Let's say we use up-3D embeddings\
    \ to represent “apple,” “banana,” and “orange.” These numbers reflect how sweet,\
    \ fibrous, or acidic each fruit is. If the vectors are close, we assume the fruits\
    \ are similar.\n\nIn fact, let us calculate it.\n\n```\nunderstanding_vector_search/similarity_applies_bananas_oranges.js\n\
    const vectors = {\n  Apple: [0.9, 0.1, 0.0],\n  Banana: [0.7, 0.3, 0.0],\n  Orange:\
    \ [0.8, 0.2, 0.1]\n};\n\n/**\\ * Calculate the dot product of two vectors.\n *\
    \ @param {Array<number>} vec1 - First vector.\n * @param {Array<number>} vec2\
    \ - Second vector.\n * @returns {number} - Dot product of the vectors.\n */\n\
    const calculatedDotProduct = (vec1, vec2) =>\n  vec1.reduce((sum, value, index)\
    \ => sum + value * vec2[index], 0);\n\n/**\n * Calculate the magnitude of a vector.\n\
    \ * @param {Array<number>} vec - The vector.\n * @returns {number} - Magnitude\
    \ of the vector.\n */\n```"
  merge: -1
