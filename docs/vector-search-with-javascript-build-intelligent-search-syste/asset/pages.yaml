  md: "```\ncurl https://api.openai.com/v1/embeddings \\\n-H \"Content-Type: application/json\"\
    \ \\\n-H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n-d '{\n  \"input\": \"\
    Your text string goes here\",\n  \"model\": \"text-embedding-3-small\"\\n}'\n\
    ```\n\nFirst, we see the API endpoint's URL. https://api.openai.com/v1/embeddings.\
    \ Next, we see the headers in the request. The Content-Type header specifies that\
    \ the request body is JSON. The Authorization header contains the API key used\
    \ to authenticate the request. Finally, we see the request body, which includes\
    \ the input text and the model for generating the embeddings. In this case, the\
    \ input text is \"Your text string goes here\", and the model is \"text-embedding-3-small\"\
    .\n\nThe list of available models can also be found in the documentation, and\
    \ new models are introduced from time to time while existing models are updated.\
    \ In effect, the two parameters we need to provide, whether in a cURL request\
    \ or the SDK, are input and model. That same request would look like the following\
    \ using the SDK:\n\n```\nbasics_of_vector_embeddings/first_api_request.js\nconst\
    \ main = async () => {\n  try {\n    const embedding = await openai.embeddings.create({\n\
    \      model: \"text-embedding-ada-002\",\n      input: \"Your text string goes\
    \ here\",\n      encoding_format: \"float\",\n    });\n\n    console.log(embedding.data[0]);\n\
    \    console.log(\"Model used:\", embedding.model);\n    console.log(\"Tokens\
    \ consumed:\", embedding.usage.total_tokens);\n  } catch (error) {\n    console.error(\"\
    Error generating embedding:\", error);\n  }\n};\n\nmain();\n```\n\nDid you notice\
    \ the additional encoding_format parameter in the request created with the SDK?\
    \ This parameter is one of two you can use to fine-tune your request to fit your\
    \ needs. Let's explore them:\n\n+   * encoding_format: Decide what format you\
    \ want the data returned in, as floating point numbers or base64 encoded. The\
    \ default is float, but base64 offers advantages if you prioritize compatibility\
    \ and portability.\n\n5. https://platform.openai.com/docs/guides/embeddings/embedding-models"
