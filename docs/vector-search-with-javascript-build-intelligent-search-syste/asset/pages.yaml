    introduced clearly, explained in plain language, and backed by working code.

    By the time you''re done, you''ll have both a solid understanding of vector search
    and the skills to apply it in your own projects.


    # # What’s in This Book


    This book provides a hands-on approach to vector search, blending theoretical
    explanations with real-world coding examples. You''ll learn how implement vector
    search step by step, from generating embeddings to optimizing performance. We''ll
    cover key concepts such as vector indexing, querying handling, and hybrid search
    techniques along the way. Each chapter builds on the last, but if you''re already
    familiar with specific topics, feel free to jump to the sections interest you
    most; for example, if you''re already knowledgeable on the foundations of vector
    search, you may want to skip [Chapter 2, Understanding Vector Search, on page
    11].


    Throughout the book, you''ll work on a project based on the RealWorld example
    app that mimics the features of Medium. You''ll enhance this familiar app with
    vector-powered functionality, step by step. By embedding content, enabling semantic
    search, and learning in hybrid techniques, you''ll transform a conventional CRUD
    app into a modern, intelligent search experience. This project grounds each concept
    in practical, real-world implementation and serves as a running example you can
    adapt and expand in your own work.


    This book is structured in two parts. Part 1, Foundations of Vector Search, includes
    Chapters 1 through 3 and focuses on the core ideas: what vector search is, how
    it works, and the building blocks such as embeddings and similarity. Part 2, Building
    a Vector Search Service, spans Chapters 4 through 11 and walks you through designing,
    implementing, and optimizing a fully functional search system using real code
    and data.


    Wondering where to begin? You''ll get your feet wet with a quick hands-on vector
    search project in the first chapter. The second chapter will introduce you to
    the fundamentals of vector search, including how it differs from traditional search
    methods and a high-level overview of commonly used techniques. If you''re already
    familiar with the basics, you can skip ahead to [Chapter 3, Generating Vector
    Embeddings, on page 15], to dive into vector embeddings work and why they''re
    essential. Feeling ready to build? Head straight to [Chapter 4, Building the Foundation
    for Vector Search, on page 25], to set up your environment and start coding your
    own vector search system from the ground up.


