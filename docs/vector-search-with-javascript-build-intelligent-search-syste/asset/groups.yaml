  - "[PAGE 55]\n\nmodels. The full code for each model can be found at the GitHub\
    \ repository for the project.\n\n+   * The User model can author articles, follow\
    \ other users, and favorite articles. These relationships may help personalize\
    \ vector search results if you wish to extend the functionality you've learned\
