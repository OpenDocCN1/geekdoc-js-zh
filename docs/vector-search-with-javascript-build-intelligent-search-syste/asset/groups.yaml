- md: "\nIn that file, add the following code:\n\n```\nimplementing_vector_generation_service/create_db_connection.js\n\
    import {\n  connect as connectOttoman,\n  start as startOttoman\n} from 'ottom';\n\
    import couchbase from 'couchbase';\nconst connectToCouchbase = async () => {\n\
    \  await connectOttoman({\n    connectionString: process.env.COUCHBASE_CONNECTION_STRING,\n\
    \    bucketName: 'default',\n    username: process.env.COUCHBASE_USERNAME,\n \
    \   password: process.env.COUCHBASE_PASSWORD,\n  });\n  await startOttoman();\n\
    };\nconst clusterInstance = await couchbase.connect(\n  process.env.COUCHBASE_CONNECTION_STRING,\n\
    \  {\n    username: process.env.COUCHBASE_USERNAME,\n    password: process.env.COUCHBASE_PASSWORD,\n\
    \    configProfile: 'wanDevelopment',\n  }\n});\nconnectToCouchbase().catch(console.error);\n\
    export const getCluster = () => {\n  if (!clusterInstance) {\n    throw new Error('Couchbase\
    \ cluster not initialized');\n  }\n  return clusterInstance;\n}\nexport * from\
    \ 'ottoman';\n```\n\nOnce connected, Ottoman provides the interface for defining\
    \ models and interacting with them. At the same time, we initialize and start\
    \ a separate clusterInstance using the Couchbase Node.js SDK. This gives us low-level\
    \ access to Couchbase features beyond what Ottoman provides, for example, if we\
    \ later need to work directly with key-value operations, indexes, or run raw data\
    \ queries.\n\nThe module exports everything from Ottoman, so we can use those\
    \ APIs throughout the app, and also provides a getCluster() function for returning\
    \ the Couchbase cluster instance once it's connected. This gives us flexibility\
    \ by can build most of our app using Ottoman but still drop down to the raw Couchbase\
    \ SDK whenever we need full control.\n\nNow that we've configured the data layer,\
    \ our back end is ready to store and retrieve vector data alongside standard document\
    \ like articles and users.\n\n## Key Takeaways\n\nIn this chapter, we focused\
    \ on structuring the back end to support vector search functionality. We introduced\
    \ a dedicated services folder to house vector-related logic, carefully modeled\
    \ the article entity as the primary object for embeddings, and established a flexible\
    \ and maintainable connection to the Couchbase database. This foundation ensures\
    \ that our application is well prepared to generate and store vector embeddings\
    \ in the chapters ahead.\n\nKey takeaways from this chapter include the following:\n\
    \n- We introduced a services/ folder to house embedding and search logic, keeping\
    \ it cleanly separated from the rest of the application architecture.\n- We designed\
    \ the Article model to include a new embedding field, setting the stage for incorporating\
    \ vector search.\n- We briefly reviewed the User, Comment, and Tag models, highlighting\
    \ how they relate to articles.\n- We configured a shared database connection using\
    \ both Ottoman.js and the Couchbase.Node.js SDK, giving us flexibility to work\
    \ at both the model and raw query levels.\n\nWith the back-end structure, database\
    \ connection, and core model in place, we're now ready to build the vector embedding\
    \ generation service that will bring search relevance to life.\n\n## CHAPTER 6\
    \ \n\n### Building the Vector Embedding Generation Service\n\nIn the last chapter,\
    \ we laid the foundation for vector search by structuring the back end and defining\
    \ the core data models. It's time to bring that structure to life with functionality\
    \ that can generate vector embeddings from article content.\n\nThis chapter will\
    \ walk you through building a service that transforms plain text into high-dimensional\
    \ vectors that make vector search possible.\n\n## Structuring the Embedding Service\n\
    \nThe vector embedding generation service will generate embeddings for articles\
    \ and store them in the database. This service will be a critical component of\
    \ the blog platform, as it will be the foundation for enabling users to search\
    \ for articles based on semantic similarity and relevance.\n\nThe services/ folder\
    \ at the project's root will contain all the vector embedding creation and search\
    \ functionality. The contents of this folder are we'll define the logic for generating\
    \ embeddings, storing them in the database, and performing similarity searches.\
    \ Let's start by properly structuring the services/ folder to maintain separation\
    \ of concerns and keep the code organized.\n\nWhen we think about the operations\
    \ of the vector search service in the application, we can break it down into its\
    \ distinct components.\n\n- New article or edit an existing article:\n  - Generate\
    \ a vector embedding for the article.\n  - Save the vector embedding to the database.\n\
    - User search query:\n  - Generate a vector embedding for the search query.\n\
    \  - Perform a similarity search in the database.\n\nWe also introduce a couple\
    \ of utilities to help us with vector operations; namely, we'll wish to help with\
    \ the following:\n\n- Validating text input for generating embeddings.\n- Handling\
    \ errors that may occur during the vector operations.\n\nLastly, we'll need a\
    \ client to interact with the OpenAI API to generate embeddings. You started creating\
    \ services/ folder earlier, but now, let's put it all together. With these components\
    \ in mind, let's structure the services/ folder as:\n\n```\nservices/\n  clients/\n\
    \    couchbaseClient.js\n    openaiClient.js\n  embeddings/\n    createEmbedding.js\n\
    \    saveEmbedding.js\n  search/\n    embedQuery.js\n    performSearch.js\n  utils/\n\
    \    validateText.js\n    errorHandlers.js\n```\n\nIt may be helpful to see the\
    \ interactions between these components, as shown in the diagram below:\n\n![](img/b23b9ef1dda8c73d9b8533aa22_60)\n\
    \nThe flow for a new article begins with validateText.js to ensure it meets quality\
    \ standards. If the input passes validation, createEmbedding.js invokes OpenAIClient\
    \ to generate vector embeddings. The resulting embedding is then stored via saveEmbedding.js.\
    \ Throughout this process, errorHandlers.js handles any issues to ensure smooth\
    \ operation and accurate search results. For a user query, the process starts\
    \ with validateText.js checking the input. If the query passes, embedQuery.js\
    \ uses OpenAI to generate the embedding, which is then used by performSearch.js\
    \ to find relevant results."
