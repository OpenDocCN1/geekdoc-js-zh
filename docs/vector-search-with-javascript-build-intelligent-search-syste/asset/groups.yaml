    \ Doguin\nCouchbase 开发者关系与策略高级总监\n\n- 本在提供构建向量搜索驱动应用的实践经验方面做得非常好。Ben 引导你完成一个真实项目，该项目基于现代\
    \ AI 模型构建向量嵌入，并将其集成到功能应用程序中，同时清晰地解释了余弦相似度算法和向量空间等底层组件。\n\n- Liran Tal\nSnyk 开发者关系总监\n\
    \n- Ben 能够对复杂的向量搜索世界提供通俗易懂且深入的介绍。他循序渐进的指导即使是最令人无从从的内容也变得简单，而他对不同方法的深刻对比也加深了理解。这本书既实用又引人入胜，非常适合任何想要探索这项变革性技术的人。\n\
    \n- Kevin Lewis\n开发者关系专业人士\n\n《使用 JavaScript 进行向量搜索》适合所有想要探索向量搜索世界的人。这本书实现了一个可运行的向量搜索服务，并涵盖了安全和验证。这可能是使用\
    \ Node.js 编写 API 的最好的书籍。\n\n- Santosh Yadav\nGitHub Star 工程师，Microsoft MVP 和 Angular\
    \ GDE\n\n# 使用 JavaScript 进行向量搜索\n\n使用 AI 构建智能搜索系统\n\nBen Greenberg\n\nThe Pragmatic\
