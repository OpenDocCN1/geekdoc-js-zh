- md: "\nBefore installing the required libraries, make sure you have Node.js installed.\n\
    You can download it from the official website.[1] Installing Node.js will also\
    \ install npm, which is the package manager we will use throughout this book.\n\
    \nOnce done installing Node.js, you'll need to install a few libraries:\n\n```\n\
    npm install node-fetch dotenv cheerio\n```\n\nAnd you'll need an API key in a\
    \ local .env file:\n\n```bash\necho \"OPENAI_API_KEY=your-key-here\" > .env\n\
    ```\n\n## Scraping the Titles\n\nWe'll start by scraping all the titles from the\
    \ Pragmatic Bookshelf catalog.\nTheir site uses pagination, we'll loop through\
    \ all pages and extract the title, subtitle, and book URL.\n\nHere's the function\
    \ to do:\n\n```javascript\ngetting_started_with_vector_search_name_this_book.js\n\
    async function scrapeTitles() {\n  const baseURL = 'https://prprog.com';\n  const\
    \ maxPages = 27;\n  const maxTitles = 50;\n  const allBooks = [];\n}\nconsole.log(\n\
    \  `Scraping up to ${maxTitles} book titles from Pragmatic Bookshelf...`\n);\n\
    for (let page = 1; page <= maxPages; page++) {\n  const pageURL = page === 1 ?\
    \ `${baseURL}/titles/` : `${baseURL}/page/${page}/`;\n  console.log(`Fetching\
    \ page ${page}`);\n  const res = await fetch(pageURL);\n  const html = await res.text();\n\
    \  const $ = cheerio.load(html);\n  $('.category-title-container').each((_, el)\
    \ => {\n    if (allBooks.length >= maxTitles) return false;\n    const anchor\
    \ = $(el).find('a').first();\n    const title = $(el).find('.category-title b').text().trim();\n\
    ```\n\n[1] https://www.nodejs.org\n\n```javascript\nconst subtitle = $el\n  .find('.category-title-subtitle')\n\
    \  .text()\n  .trim();\nconst url = anchor.attr('href');\nif (title && url) {\n\
    \  allBooks.push({ title, subtitle, url });\n}\n}\nif (allBooks.length >= maxTitles)\
    \ break;\n}\nconst unique = Array.from(\n  new Map(allBooks.map(b => [b.url, b])).values()\n\
    );\nconsole.log(`\\nFinished scraping. ${unique.length} titles captured.`);\n\
    return unique;\n```\n\nThis function loops through every results page, uses Cheerio,\
    \ a JavaScript library, to parse the titles and subtitles, and returns a list\
    \ of unique book entries.\n\nYou're now faced with real-world HTML scraping which\
    \ is often messy and requires patience. The structure of Pragmatic's catalog is\
    \ structurally clean, but keep in mind that this kind of work is fragile by nature.\
    \ If the site layout or class names change, your scraper could break. That means\
    \ your downstream processes, like generating embeddings or running similarity\
    \ comparisons, might be working with incomplete or outdated data.\n\n## Embedding\
    \ the Titles\n\nNext, we'll use OpenAI's text-embedding-3-small model to generate\
    \ an embedding for each full book title.\n\nLet's define a helper function to\
    \ generate a single embedding:\n\n```javascript\ngetting_started_with_vector_search/name_this_book.js\n\
    async function getEmbedding(text) {\n  console.log(`Generating embedding for:\
    \ ${text}`);\n  const res = await fetch('https://api.openai.com/v1/embeddings',\
    \ {\n    method: 'POST',\n    headers: {\n      'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,\n\
    \      'Content-Type': 'application/json',\n    }\n  });\n```\n\n```javascript\n\
    \  body: JSON.stringify({\n    input: text,\n    model: 'text-embedding-3-small',\n\
    \  });\n  if (!res.ok) {\n    console.error(\n      `API request failed with status\
    \ ${res.status}: ${res.statusText}`\n    );\n    return null;\n  }\n  const data\
    \ = await res.json();\n  if (\n    data ||\n    data.data ||\n    !Array.isArray(data.data)\
    \ ||\n    data.data.length === 0\n  ) {\n    console.error(\n      'Unexpected\
    \ API response:', JSON.stringify(data, null, 2)\n    );\n    return null;\n  }\n\
    \  if (data.data[0].embedding) {\n    console.error(\n      'No embedding found\
    \ in response:',\n      JSON.stringify(data.data[0], null, 2)\n    );\n    return\
    \ null;\n  }\n  return data.data[0].embedding;\n} catch (error) {\n  console.error(\n\
    \    `Error generating embedding for \"${text}\":`,\n    error.message\n  );\n\
    \  return null;\n}\n```\n\nThen, use that function to embed all the titles:\n\n\
    ```javascript\ngetting_started_with_vector_search/name_this_book.js async function\
    \ embedTitles(books) {\n  console.log(`Generating embeddings for all titles...`);\n\
    \  const promises = books.map((book, i) =>\n```\n\n```javascript\nconst fullTitle\
    \ = book.subtitle\n  ? `${book.title}: ${book.subtitle}`\n  : book.title;\nconsole.log(`${i\
    \ + 1}/${books.length} ${fullTitle}`);\n\n  return getEmbedding(fullTitle).then(embedding\
    \ => {\n    book.embedding = embedding;\n    return book;\n  });\n});\n\nconst\
    \ booksWithEmbeddings = await Promise.all(promises);\n// Filter out books that\
    \ failed to get embeddings\nconst validBooks = booksWithEmbeddings.filter(book\
    \ => book.embedding !== null);\nif (validBooks.length < books.length) {\n  console.log(\n\
    \    `Warning: ${books.length} - ${validBooks.length} books failed to get embeddings\
    \ and were excluded.`\n  );\n}\n\nreturn validBooks;\n```\n\nThis combines the\
    \ title and subtitle (if present) and generates an embedding per book. All embedding\
    \ requests are fired off at the same time and processed in parallel. This speeds\
    \ things up; if you're working with large datasets or strict API rate limits,\
    \ you may want to throttle or batch requests instead.\n\nDon't worry if the process\
    \ still feels mysterious. In the next chapter, we'll unpack exactly how embeddings\
    \ work and what makes such a powerful tool for search and recommendation.\n\n\
    ## Comparing to Your Title Idea\n\nNow you'll embed a new title and compare it\
    \ to the catalog using cosine similarity. Here's how we compute similarity between\
    \ vectors:\n\n```javascript\ngetting_started_with_vector_search/name_this_book.js\n\
    function cosineSimilarity(a, b) {\n  const dot = a.reduce(\n    (sum, ai, i) =>\
    \ {\n      return sum + ai * b[i];\n    },\n    0\n  );\n```\n\n```javascript\n\
    \  const magA = Math.sqrt(\n    a.reduce((sum, ai) => {\n      return sum + ai\
    \ * ai;\n    }, 0)\n  );\n  const magB = Math.sqrt(\n    b.reduce((sum, bi) =>\
    \ {\n      return sum + bi * bi;\n    }, 0)\n  );\n  return dot / (magA * magB);\n\
    }\n```\n\nAnd here's how we find and rank the top matches:\n\n```javascript\n\
    getting_started_with_vector_search/name_this_book.js\nfunction compareTitles(queryEmbedding,\
    \ books) {\n  console.log('Comparing against catalog...');\n  return books\n \
    \   .map(book => ({\n      book,\n      similarity: cosineSimilarity(\n      \
    \  book.embedding,\n        queryEmbedding\n      )\n    }))\n    .sort((a, b)\
    \ => b.similarity - a.similarity)\n    .slice(0, 5);\n}\n```\n\n## Putting All\
    \ Together\n\nFinally, let's connect everything. The main() function runs the\
    \ entire flow: scrape, embed, store, and compare.\n\n```javascript\ngetting_started_with_vector_search/name_this_book.js\n\
    async function main() {\n  const DATA_FILE = 'pragmatic_titles.json';\n  let books;\n\
    \  if (fs.existsSync(DATA_FILE)) {\n    console.log(`Loading cached data from\
    \ ${DATA_FILE}...`);\n    books = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));\n\
    \  } else {\n    console.log('No cached data found. Starting fresh.');\n    books\
    \ = await scrapeTitles();\n    books = await embedTitles(books);\n}\n```\n\n```javascript\n\
    \  fs.writeFileSync(\n    DATA_FILE,\n    JSON.stringify(books, null, 2)\n  );\n\
    \n  console.log(`Saved ${books.length} books to ${DATA_FILE}`);\n}\n\nconst query\
    \ = process.argv.slice(2).join(' ');\nif (!query) {\n  console.error(\n    `Please\
    \ pass a proposed title as a command-line argument`\n  );\n  console.error(\n\
    \    `Example: node name_this_book.js \"Mastering Vector Search\"`\n  );\n  process.exit(1);\n\
    }\n\nconsole.log(`\\nFinding matches for: ${query}`);\nconst queryEmbedding =\
    \ await getEmbedding(query);\nconst topMatches = compareTitles(queryEmbedding,\
    \ books);\n\nconsole.log(`\\nTop matches for ${query}:\\n`);\nfor (const match\
    \ of topMatches) {\n  console.log(\n    ` - ${match.title}${match.subtitle ? '\
    \ * ' + match.subtitle : ''}`\n  );\n  console.log(\n    `  ${(match.similarity\
    \ * 100).toFixed(2)}% similar`\n  );\n  console.log(\n    `  ${match.url}\\n`\n\
    \  );\n}\nmain\n```\n\nRun the script like:\n`name_this_book.js \"Vector Search\
    \ for Everyone\"`\nThe script will output the top five most similar titles from\
    \ the catalog along with their similarity scores. A close score to 1 means your\
    \ title idea is very similar in meaning to a published Pragmatic title, while\
    \ lower scores indicate less similarity. You can use these results to evaluate\
    \ whether your idea fits the style and themes of the publisher's catalog. You\
    \ might also use the output to spark new ideas based on titles rank highly in\
    \ similarity.\nWhen you run the script, you'll see the top matches ranked by similarity.\
    \ For example, testing the title idea *Learning Vector Search with JavaScript*\n"
  mdcn: "\n在安装所需的库之前，请确保你已经安装了 Node.js。\n你可以从官方网站下载它[1]。安装 Node.js 也会安装 npm，这是我们在整本书中将使用的包管理器。\n\
    \n完成 Node.js 的安装后，你需要安装几个库：\n\n```\nnpm install node-fetch dotenv cheerio\n```\n\
    \n并且，你需要在本地的 .env 文件中一个 API 密钥：\n\n```bash\necho \"OPENAI_API_KEY=your-key-here\"\
    \ > .env\n```\n\n## 爬取标题\n\n我们将开始从 Pragmatic Bookshelf 目录中爬取所有标题。\n他们的网站使用分页功能，我们将遍历所有页面并提取标题、副标题和书籍\
    \ URL。\n\n以下是实现该功能的函数：\n\n```javascript\ngetting_started_with_vector_search_name_this_book.js\n\
    async function scrapeTitles() {\n  const baseURL = 'https://prprog.com';\n  const\
    \ maxPages = 27;\n  const maxTitles = 50;\n  const allBooks = [];\n}\nconsole.log(\n\
    \  `正在从 Pragmatic Bookshelf 爬取最多 ${maxTitles} 个书籍标题...`\n);\nfor (let page = 1;\
    \ page <= maxPages; page++) {\n  const pageURL = page === 1 ? `${baseURL}/titles/`\
    \ : `${baseURL}/page/${page}/`;\n  console.log(`正在获取页面 ${page}`);\n  const res\
    \ = await fetch(pageURL);\n  const html = await res.text();\n  const $ = cheerio.load(html);\n\
    \  $('.category-title-container').each((_, el) => {\n    if (allBooks.length >=\
    \ maxTitles) return false;\n    const anchor = $(el).find('a').first();\n    const\
    \ title = $(el).find('.category-title b').text().trim();\n```\n\n[1] https://www.nodejs.org\n\
    \n```javascript\nconst subtitle = $el\n  .find('.category-title-subtitle')\n \
    \ .text()\n  .trim();\nconst url = anchor.attr('href');\nif (title && url) {\n\
    \  allBooks.push({ title, subtitle, url });\n}\n}\nif (allBooks.length >= maxTitles)\
    \ break;\n}\nconst unique = Array.from(\n  new Map(allBooks.map(b => [b.url, b])).values()\n\
    );\nconsole.log(`\\n爬取完成。获取了 ${unique.length} 个标题。`);\nreturn unique;\n```\n\n\
    该函数遍历每一个结果页面，使用 JavaScript 库 Cheerio 来解析标题和副标题，并返回一个唯一的书籍条目列表。\n\n你现在面临的是现实世界的\
    \ HTML 爬取工作，这通常非常混乱且需要耐心。Pragmatic 目录的结构在结构上很整洁，但请记住这种工作本质上是脆弱的。如果网站布局或类名发生变化，你的爬虫可能会崩溃。这意味着你的下游流程（例如生成嵌入或运行相似性比较）可能会处理不完整或过时的数据。\n\
    \n## 标题嵌入\n\n接下来，我们将使用 OpenAI 的 `text-embedding-3-small` 模型为每个完整的书籍标题生成嵌入（embedding）。\n\
    \n让我们定义一个辅助函数来生成单个嵌入：\n\n```javascript\ngetting_started_with_vector_search/name_this_book.js\n\
    async function getEmbedding(text) {\n  console.log(`正在为以下内容生成嵌入: ${text}`);\n\
    \  const res = await fetch('https://api.openai.com/v1/embeddings', {\n    method:\
    \ 'POST',\n    headers: {\n      'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,\n\
    \      'Content-Type': 'application/json',\n    }\n  });\n```\n\n```javascript\n\
    \  body: JSON.stringify({\n    input: text,\n    model: 'text-embedding-3-small',\n\
    \  });\n  if (!res.ok) {\n    console.error(\n      `API 请求失败，状态码为 ${res.status}:\
    \ ${res.statusText}`\n    );\n    return null;\n  }\n  const data = await res.json();\n\
    \  if (\n    !data ||\n    !data.data ||\n    !Array.isArray(data.data) ||\n \
    \   data.data.length === 0\n  ) {\n    console.error(\n      '意外的 API 响应:', JSON.stringify(data,\
    \ null, 2)\n    );\n    return null;\n  }\n  if (data.data[0].embedding) {\n \
    \   console.error(\n      '在响应中未找到嵌入:',\n      JSON.stringify(data.data[0], null,\
    \ 2)\n    );\n    return null;\n  }\n  return data.data[0].embedding;\n} catch\
    \ (error) {\n  console.error(\n    `生成嵌入 \"${text}\" 时出错:`,\n    error.message\n\
    \  );\n  return null;\n}\n```\n\n然后，使用该函数为所有标题生成嵌入：\n\n```javascript\ngetting_started_with_vector_search/name_this_book.js\
    \ async function embedTitles(books) {\n  console.log(`正在为标题生成嵌入...`);\n  const\
    \ promises = books.map((book, i) => {\n    const fullTitle = book.subtitle\n \
    \     ? `${book.title}: ${book.subtitle}`\n      : book.title;\n    console.log(`${i\
    \ + 1}/${books.length} ${fullTitle}`);\n\n    return getEmbedding(fullTitle).then(embedding\
    \ => {\n      book.embedding = embedding;\n      return book;\n    });\n  });\n\
    \n  const booksWithEmbeddings = await Promise.all(promises);\n  // 过滤掉未获取嵌入的书\n\
    \  const validBooks = booksWithEmbeddings.filter(book => book.embedding !== null);\n\
    \  if (validBooks.length < books.length) {\n    console.log(\n      `警告：有 ${books.length\
    \ - validBooks.length} 本籍未获取嵌入并被排除。`\n    );\n  }\n\n  return validBooks;\n}\n\
    ```\n\n这结合了标题（如果有）并为每个书籍生成嵌入。所有的嵌入请求都是同时发出并并行处理的。这提高了速度；如果你处理的是大数据或有严格的 API 速率限制，可能需要限流或批量请求。\n\
    \n如果这个过程仍然很神秘，不要担心。在下一章节中，我们将详细解释嵌入的工作原理以及为什么它是搜索的强大工具。\n\n## 与你的标题对比\n\n现在你将嵌入一个新的标题并使用余弦相似度与其进行比较。以下是计算向量之间相似性的方法：\n\
    \n```javascript\ngetting_started_with_vector_search/name_this_book.js\nfunction\
    \ cosineSimilarity(a, b) {\n  const dot = a.reduce(\n    (sum, ai, i) => {\n \
    \     return sum + ai * b[i];\n    },\n    0\n  );\n```\n\n```javascript\n  const\
    \ magA = Math.sqrt(\n    a.reduce((sum, ai) => {\n      return sum + ai * ai;\n\
    \    }, 0)\n  );\n  const magB = Math.sqrt(\n    b.reduce((sum, bi) => {\n   \
    \   return sum + bi * bi;\n    }, 0)\n  );\n  return dot / (magA * magB);\n}\n\
    ```\n\n这是我们寻找并对顶部匹配排名的方法：\n\n```javascript\ngetting_started_with_vector_search/name_this_book.js\n\
    function compareTitles(queryEmbedding, books) {\n  console.log('正在对比目录...');\n\
    \  return books\n    .map(book => ({\n      book,\n      similarity: cosineSimilarity(\n\
    \        book.embedding,\n        queryEmbedding\n      )\n    }))\n    .sort((a,\
    \ b) => b.similarity - a.similarity)\n    .slice(0, 5);\n}\n```\n\n## 整合在一起\n\n\
    最后，让我们连接一切。`main()` 函数运行整个流程：爬取、嵌入、存储和比较。\n\n```javascript\ngetting_started_with_vector_search/name_this_book.js\n\
    async function main() {\n  const DATA_FILE = 'pragmatic_titles.json';\n  let books;\n\
    \  if (fs.existsSync(DATA_FILE)) {\n    console.log(`正在从 ${DATA_FILE} 加载缓存数据...`);\n\
    \    books = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));\n  } else {\n   \
    \ console.log('未找到缓存数据。从头开始。');\n    books = await scrapeTitles();\n    books\
    \ = await embedTitles(books);\n  }\n```\n\n```javascript\n  fs.writeFileSync(\n\
    \    DATA_FILE,\n    JSON.stringify(books, null, 2)\n  );\n\n  console.log(`已将\
    \ ${books.length} 本书籍保存到 ${DATA_FILE}`);\n}\n\nconst query = process.argv.slice(2).join('\
    \ ');\nif (!query) {\n  console.error(\n    `请传递建议的标题作为命令行参数`\n  );\n  console.error(\n\
    \    `示例: node name_this_book.js \"Mastering Vector Search\"`\n  );\n  process.exit(1);\n\
    }\n\nconsole.log(`\\n正在为 ${query} 寻找匹配...`);\nconst queryEmbedding = await getEmbedding(query);\n\
    const topMatches = compareTitles(queryEmbedding, books);\n\nconsole.log(`\\n${query}\
    \ 的顶部匹配项：\\n`);\nfor (const match of topMatches) {\n  console.log(\n    ` - ${match.title}${match.subtitle\
    \ ? ' * ' + match.subtitle : ''}`\n  );\n  console.log(\n    `  ${(match.similarity\
    \ * 100).toFixed(2)}% 相似`\n  );\n  console.log(\n    `  ${match.url}\\n`\n  );\n\
    }\nmain\n```\n\n运行脚本：\n`name_this_book.js \"Vector Search for Everyone\"`\n脚本将输出目录中最相似的前五个书籍及其相似度得分。分数接近\
    \ 1 意味着你的标题想法与 Pragmatic 出版的书籍意义上非常相似，而较低的分数则表示相似性较低。你可以利用这些结果评估你的想法是否符合该出版商的风格和主题。你也可以根据相似性排名靠前的标题激发新的灵感。\n\
    \n"
