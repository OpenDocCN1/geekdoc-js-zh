    \ `saveEmbedding` 将嵌入保存到数据库，而对于查询，它将嵌入返回给调用者。这种灵活性允许我们无缝将嵌入生成过程集成到搜索服务中，而无需重复代码或创建不必要的复杂性。\n\
    \n如果你想在将查询嵌入写入完整搜索流之前急于测试它们是如何生成的，可以运行我们为该目的准备的快速 CLI 工具。在运行它之前，请确保你已经在项目根目录的\
