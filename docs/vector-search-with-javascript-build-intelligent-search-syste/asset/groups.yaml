- md: "\n# The Pragmatic Programmer\n\n# Pragmatic Express\n\n# Vector Search with\
    \ JavaScript\n\nBuild Intelligent Search Systems with AI\n\nBen Greenberg\nForeword\
    \ by Angle Jones\nedited by Susannah Davidson\n\n# Early Praise for Vector Search\
    \ with JavaScript\n\nBen's book offers the approachable explanations and examples\
    \ of vector search I wish had when I was learning the field. It's a must-read\
    \ for anyone joining my team.\n\n- Laurent Doguin\n  Senior Director of Developer\
    \ Relations and Strategy, Couchbase\n\n- The book does a great job at offering\
    \ practical hands-on experience building applications powered by vector search.\
    \ Ben guides you through a real-world project that builds on modern AI models\
    \ for vector embeddings and integrates it into a functional application while\
    \ also clearly communicating the underlying components as cosine similarity algorithm\
    \ and vector space.\n\n- Liran Tal\n  Director of Developer Relations, Snyk\n\n\
    - Ben is able to provide an approachable and thorough introduction to the complex\
    \ world of vector search. His step-by-step guidance makes even the most overwhelming\
    \ accessible, while his insightful comparisons of different approaches deepen\
    \ understanding. This book is practical, engaging, and perfect for anyone looking\
    \ to explore this transformative technology.\n\n- Kevin Lewis\n  Developer Relations\
    \ Professional\n\nVector Search with JavaScript is for everyone who wants to explore\
    \ the world of vector search. The book implements a working vector search service\
    \ and covers security and validation. This could easily be the best book on crafting\
    \ an API using Node.js.\n\n- Santosh Yadav\n  Staff Engineer, GitHub Star, Microsoft\
    \ MVP and Angular GDE\n\n# Vector Search with JavaScript\n\nBuild Intelligent\
    \ Search Systems with AI\n\nBen Greenberg\n\nThe Pragmatic Bookshelf\nDallas,\
    \ Texas\n\n# Pragmatic Bookshelf\n\nSee our complete catalog of hands-on, practical,\n\
