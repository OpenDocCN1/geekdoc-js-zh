    \n在安装依赖项时，我们需要考虑应用程序开发的三个领域。数据库是其中一个，正如我们之前讨论过的，我们需要一个可以存储、索引和查询嵌入的数据库。我们将使用 ORM（对象关系映射）来与数据库交互。ORM\
