    \n# 理解相似性\n\n一旦你有了嵌入，下一个问题就是如何比较它们。换句话说，你如何判断哪些向量是接近的？\n\n为了比较嵌入，我们需要一种衡量两个向量相似程度的方法。最常用的方法是余弦相似度（它衡量向量之间的角度，不考虑其大小）和点积（它同时衡量方向和幅度）。余弦相似度回答了“这些向量的方向是否相同？”，而点积则增加了“信号有多强？”的问题。\n\
