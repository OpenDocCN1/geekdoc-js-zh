    \ OpenAI API 生成嵌入，并给你结果向量的前几个维度。这让你在将其集成到更广泛的搜索系统之前，能够快速直观地看到查询嵌入的样貌。\n\n从命令行生成查询嵌入后，你可以将该功能集成到服务层。构建\
    \ `embedQuery.js` 中的代码，向功能完备的向量搜索服务迈一步。\n\n```javascript\ncreating_vector_search_service/embedQuery.js\n\
