    # Machine Learning in Elixir


    Stable Diffusion, ChatGPT, Whisper—these are just a few examples of incredible
    applications powered by developments in machine learning. Despite the ubiquity
    of machine learning applications running in production, there are only a few viable
    choices for data science and machine learning tasks. Elixir''s Nx project seeks
    to change. With Nx, you can leverage the power of machine learning in your applications,
    using the battle-tested Erlang VM in a pragmatic language like Elixir. In this
    book, you''ll learn how to leverage Elixir and the Nx ecosystem to solve real-world
    problems in computer vision, natural language processing.


    Sean Moriarty


    (372 pages) ISBN: 9798888650349, $ 861.95


