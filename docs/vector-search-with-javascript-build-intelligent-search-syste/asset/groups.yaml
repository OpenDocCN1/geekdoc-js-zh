    # 增强型客户支持


    客户支持软件领域的主要参与者 Zendesk 利用向量搜索来改进其知识库和工单解决系统。15


    当客户提交支持工单或搜索帮助中心时，查询会被转换为向量并与支持内容进行匹配。这种语义相似性方法即使查询使用的语言与存储的内容不同，也能返回相关结果。


