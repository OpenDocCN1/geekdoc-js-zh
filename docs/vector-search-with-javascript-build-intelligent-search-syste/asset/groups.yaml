    \ ORM, like Ottoman, lets you use familiar JavaScript methods and chaining to\
    \ express what you're looking for. This is especially helpful when querying nested\
    \ or hierarchical data common in JSON document databases. For example, finding\
    \ all blog posts with a certain tag or retrieving users based on a similarity\
    \ score can be done using Model.find() with filter conditions, which Ottoman translates\
    \ into optimized queries behind the scenes.\n\nThe second key is transforming\
