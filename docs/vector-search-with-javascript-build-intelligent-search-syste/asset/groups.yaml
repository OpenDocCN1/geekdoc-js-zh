  mdcn: "\n\n# 第 4 章 构建向量搜索的基础\n\n因此，我们需要一个能够处理多种类型数据的数据库，包括结构化、非结构化和半结构化数据。\n\n向量嵌入是非结构化数据，而且它们也是高维的。正如我们在第\
