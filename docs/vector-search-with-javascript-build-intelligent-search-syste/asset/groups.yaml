    even

    calculate it manually.


    > Quick Refresher: Why Use Cosine Similarity and Dot Product?

    Cosine similarity and dot product measure the semantic alignment between vectors.

    Cosine similarity calculates how closely two vectors point in the same direction,
    dis-

    regarding their magnitude. Dot product also focuses on direction, highlighting

    semantic alignment. Both metrics help surface content conceptually related, not
    just

    syntactically matched, to user queries.


    We have embeddings for both the search query and the articles. The

    embeddings, however, are just the starting point! Our task is to compare

    t query vector embedding against the stored article embeddings and

    determine how similar they are. When the vectors are closer, the articles

    align more closely with the user''s query, have higher relevance, and deserve

    a higher rank in the search results. The dot product plays a key role in this

    comparison, though you could also use other similarity metrics, such as

    cosine similarity or Euclidean distance.


    The formula for the dot product involves multiplying corresponding elements

    from the two vectors and summing the results. To help understand the


