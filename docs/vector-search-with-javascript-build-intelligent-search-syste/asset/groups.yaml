    \n提到验证，你可能注意到我们在错误处理中包含了一个 `ValidationError` 类，但我们还没有编写它的代码。这将是一个与我们定义的其他类（EmbeddingServiceError）类似的的新自定义错误类。让我们现在通过重新定义\
