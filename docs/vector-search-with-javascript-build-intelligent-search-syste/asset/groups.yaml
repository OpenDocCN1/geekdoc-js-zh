    \ to generate the query embedding and passes the new embedding to performSearch\
    \ to find the most relevant articles. If an error occurs during the process, the\
    \ system catches and handles it appropriately to remain robust and user-friendly.\n\
    \nSpeaking about validation, you may have noticed we included a ValidationError\
    \ class in the error handling, but we have not yet written the code for it. This\
