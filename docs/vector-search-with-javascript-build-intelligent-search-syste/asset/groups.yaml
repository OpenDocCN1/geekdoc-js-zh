    \n出于本书的需要，我们将使用 Couchbase 作为我们的首选数据库。Couchbase 优化了高维数据的存储和查询，非常适合存储向量嵌入。它还提供了\
    \ Capella，这是一项完全托管的云服务，可以一键部署到 AWS、Google Cloud 或 Azure。除了技术能力外，Capella 还提供免费层级，非常适合此类项目中的实验和学习。\n\
    \n我们正在使用文档数据库，具体来说是 JSON 文档数据库，因为它允许我们处理灵活的半结构化数据。JSON（JavaScript 对象表示法）是一种用于以键值对存储数据的轻量级且人类可读的。它在\
