- md: "\n# Chapter 7. Creating a Vector Search Service • 72\n\n```\ncreating_vector_search_service/MathUtils.js\n\
    import { VectorLength } from './errorHandlers';\n/**\n * Calculate the dot product\
    \ of two vectors.\n * @param {Array} vectorA - The first vector.\n * @param {Array}\
    \ vectorB - The second vector.\n * @returns {number} - The dot product of the\
    \ two vectors.\n */\nconst dotProduct = (vectorA, vectorB) => {\n  if (vectorA.length!==vectorB.length)\
    \ {\n    throw new VectorLength('Vectors must be of the same length');\n  }\n\n\
    \  return vectorA.reduce(\n    (acc, curr, idx) => acc + curr * vectorB[idx],\n\
    \    0\n  );\n};\n\nexport { dotProduct };\n```\n\nThe dotProduct function takes\
    \ two vectors, checks that they have the same length, and then uses the reduce\
    \ method to multiply elements and sum the results. The resulting value is the\
    \ dot product of the two vectors, which helps us measure the similarity between\
    \ the query embedding and the stored article embeddings. Like the previous code\
    \ we implemented, we've introduced a new custom error class, VectorLengthError,\
    \ to handle cases where the vectors are not the same. Once again, open the errorHandlers.js\
    \ file in the utils directory, add the following code after the existing error\
    \ classes, and make sure to add VectorLengthError to the export:\n\n```\ncreating_vector_search_service/errorHandlers.js\n\
    class VectorLengthError extends Error {\n  constructor(message) {\n    this.name\
    \ = 'VectorLengthError';\n    Error.captureStackTrace(this, this.constructor);\n\
    \  }\n}\n```\n\nWith both getAllStoredEmbeddings and dotProduct functions in place,\
    \ the system is now ready to calculate the similarity between user queries and\
    \ stored articles, using the dot product as a measure of relevance.\n\nWe've successfully\
    \ implemented all the back-end functionality needed to perform vector search using\
    \ the dot product as the similarity metric! It's a good moment to take a step\
    \ back and appreciate your progress. You've built a robust system to generate\
    \ embeddings for user queries and articles, compare them using the dot product,\
    \ and return relevant search results.\n\n# Key Takeaways\n\nIn this chapter, you\
    \ transformed the vector embeddings you've been generating into a working search\
    \ feature. By building a modular service for embedding and comparing vectors,\
    \ you took a significant step toward delivering meaningful, context-aware search\
    \ results to users.\n\nThese are the key takeaways from this chapter:\n\n- Using\
    \ the dot product, you implemented a search service that embeds user queries and\
    \ compares them to stored article embeddings.\n- You reused your existing embedding\
    \ logic by designing createEmbedding to support content and query inputs.\n- You\
    \ added input validation and introduced a ValidationError class to ensure reliable\
    \ and secure search handling.\n- You created a utility function to calculate the\
    \ dot product and introduced a custom error for mismatched vector lengths.\n\n\
    Next, we'll focus on building a vector search index to optimize search performance\
    \ and scalability.\n\n# Creating a Vector Search Index\n\nIn Chapter 7, Creating\
    \ a Vector Search Service, on page 63, we implemented vector search manually using\
    \ dot product calculations, which gave us a solid grasp of the fundamentals. In\
    \ this chapter, we'll take the next step by integrating Couchbase's native vector\
    \ indexing and using the Ottoman.js library to simplify query building. This approach\
    \ will replace our manual vector operations, improving our application's performance,\
    \ scalability, and maintainability.\n\n# Understanding Search Indexes\n\nBefore\
    \ we build our search index, let's take a step back and understand what a search\
    \ index is and why it's so important for optimizing search functionality.\n\n\
    A search index can be considered a database's roadmap for quickly finding data.\
    \ Instead of scanning the entire dataset to find relevant information (which can\
    \ be slow and inefficient, especially as the dataset grows), an index helps the\
    \ database jump directly to the appropriate pieces of information. It acts like\
    \ an efficient catalog or table of contents, making it easier for search engines\
    \ or databases to retrieve much faster.\n\nFor traditional databases, indexes\
    \ are often built using keys or specific fields, like titles or tags, to make\
    \ search queries more efficient. However, we're not just searching for exact matches\
    \ in vector search. We're trying to find data conceptually or semantically similar\
    \ to a given query. This is where a vector search index comes in.\n\nUnder the\
    \ hood, vector search indexes use smart shortcuts to avoid comparing every single\
    \ vector by one. Instead of brute force, they use methods to group or organize\
    \ vectors to speed up the search.\n\nSome indexes use tree-like structures that\
    \ split the data into smaller sections, so the search can focus only where it's\
    \ most likely to find a match. Others use a method similar to hashing, where similar\
    \ vectors are grouped into buckets. A third approach connects vectors into a kind\
    \ of roadmap or graph, where the system can quickly move from one nearby vector\
    \ to the next, getting closer to the best match by step.\n\nThese techniques aim\
    \ to reduce the number of comparisons needed. The result is a faster and more\
    \ scalable search. When you run a query, the index uses these shortcuts to quickly\
    \ find a handful of promising candidates, then ranks them by similarity.\n\nA\
    \ vector search index optimizes searches using vector embeddings. Instead of manually\
    \ calculating this similarity between vectors (as we do Chapter 7, Creating a\
    \ Vector Search Service, on page 63), we can offload this task to a specialized\
    \ database service, such as Couchbase, which can handle these operations more\
    \ efficiently.\n\nLet’s take a look at the diagram that illustrates the flow of\
    \ a vector search index, as shown on page 77.\n\nThe key advantage of a search\
    \ index is its speed. Instead of scanning through every piece of data in real\
    \ time, the system compares the vectors against the index. This is where similarity\
    \ metrics, like dot product or cosine similarity, come into play to rank the documents.\n\
    \nNow that we understand what a search index is and how it works, let’s start\
    \ building one using Couchbase and Ottoman.js.\n\n# Creating a Vector Search Index\n\
    \nBefore continuing, make sure you've added a few articles to your platform and\
    \ generated embeddings for them. If you haven't done this yet, you can create\
    \ original articles or use any existing content. Follow the article spec from\
    \ the RealWorld project to ensure compatibility.\n\n- https://realworld-docs.netlify.app/specifications/backend/#create-article\n\
    \n[PAGE 86]\n\nThe vector search index will only work if vector embeddings are\
    \ already saved in Couchbase—refer back to Chapter 7, Creating a Vector Search\
    \ Service, on page 63, for details on how to do this.\n\nThis section will create\
    \ a vector search index in Couchbase using the shell command-line interface. We'll\
    \ set up the index to use the dot product as the similarity metric, allowing us\
    \ to search for similar vectors in our database efficiently.\n\n# Chapter 8. Creating\
    \ a Vector Search Index • 78\n\nFirst of all, what is cshell? It's a command-line\
    \ tool that allows you to interact with your database from the terminal. Other\
    \ ways to work with your data include a web interface or an IDE extension. However,\
    \ when you're already in the terminal, using a CLI tool allows you to conveniently\
    \ perform tasks without switching contexts.\n\nSetting up cshell is relatively\
    \ straightforward. You need to provide it with configuration details pointing\
    \ to your cluster and authentication information. Once you have set that up, you\
    \ can run commands to interact with your database. In this case, the fastest way\
    \ is to log in to your Couchbase Capella account in a browser and follow a few\
    \ steps. Let's make sure it's set up before we proceed.\n\n# Fetching Configuration\
    \ Details for cshell\n\nTo get your configuration details, navigate to your Couchbase\
    \ Capella account and follow these steps:\n\nClick the Connect button from the\
    \ dashboard inside your cluster details. You'll see a page similar to this:\n\n\
