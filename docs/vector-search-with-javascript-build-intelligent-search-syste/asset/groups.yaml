    \ configure your cbshell configuration file, as which cluster credential to use.\
    \ Once you've selected your desired credentials, copy the configuration details\
    \ and paste them into a new file named the .cbsh folder created after installing\
    \ the CLI tool.\n\n![](img/b23bbf9ef1dda8c73f3d9b853358aa22_88_0.png)\n\nFinally,\
    \ in the configuration file, replace the placeholder value for your password with\
    \ your actual password.\n\nNow that your setup is complete, you can use the cshell\
    \ CLI for all your database base interactions.\n\nreport erratum • discuss\n\n\
    # Creating a Vector Search Index\n\nOnce we've created the new vector search index\
    \ using cbshell, we can remove the manual dot product calculation from our codebase.\
    \ Offloading the similarity calculations to the database will make our search\
    \ operations more efficient and scalable.\n\nYou may be asking why we didn't start\
    \ with this approach. One of the best ways to learn how something works is to\
    \ start from the first principles. By building the dot product calculation manually,\
    \ you would hopefully gained a deeper understanding of how it works under the\
    \ hood. Now that we have that understanding, we can leverage Couchbase's built-in\
    \ capabilities to handle this.\n\nLet's go ahead and do it by first opening up\
    \ the CLI:\n\n```\n./cbsh\n```\n\nYou should see a prompt like this:\n\n>\n\n\
    By invoking the buckets command, you can run a quick test to confirm if everything\
    \ is set up and working as expected. The buckets command will return the list\
    \ of buckets in your cluster:\n\n```\n> buckets\n```\n\nIf all is good, you'll\
    \ see your buckets listed in an output similar to the one that follows. If not,\
    \ or you encounter any issues, you may need to revisit your configuration settings.\n\
    \n| | cluster | | type | replicas |\n|---|---|---|---|---|\n| 0 | default | beer-sample\
    \ | couchbase | 1 |\n| 1 | default | default | couchbase | 1 |\n| 2 | default\
    \ | targetBucket | couchbase | 0 |\n| 3 | default | travel-sample | couchbase\
    \ | 1 |\n\nWe can create our vector search index now that we've confirmed that\
    \ cbshell is working as expected. The command to create a new vector index is\
    \ vector create-index. The command itself takes several arguments we will need\
    \ to provide—namely, the name of the bucket where the embeddings are stored, the\
    \ similarity metric to use, the name of the index we wish to create, the name\
    \ of the field containing the embeddings, and the number of dimensions in the\
    \ embeddings.\n\nSince we are creating our application using dot product as the\
    \ similarity metric, we'll use the following command to create the index:\n\n\
    ```\ncreating_vector_search_index/cbshell_command_examples.sh\nvector-search-index\
    \ --name \\\n  --bucket bucket_name \\\n  --similarity-metric dot_product\nvector-search-index\
    \ embedding 1536\n```\n\nIn this command, replace name_of_bucket with the bucket's\
    \ name where your embeddings are stored. The vector-search-index is the name of\
    \ the index we're creating, embedding is the name of the field containing the\
    \ embeddings, and 1536 is the number of dimensions in the embeddings. The number\
    \ of dimensions should match the size of the embeddings you used when you created\
    \ the embeddings for the documents in your database.\n\nYou can perform a quick\
    \ check to ensure the index was created by querying all the indices, and you should\
    \ see the new index in the list:\n\n```\ncreating_vector_search_index/cbshell_command_examples.sh\n\
    query indexes\n```\n\nThat's it! You've successfully created a vector search index\
    \ in Couchbase using cbshell. This index will allow you to perform similarity\
    \ searches more efficiently by offloading the heavy lifting of similarity calculations\
    \ to the database. Let's integrate this index into our application using the Couchbase.js\
    \ SDK and Ottoman.js. This part involves deleting code, which is always fun!\n\
    \n# Integrating the Vector Search Index\n\nWe will continue to use the Couchbase\
    \ Node SDK and Ottoman.js to interact with the database and query the vector search\
    \ index. By leveraging Ottoman.js, we can simplify the process of building and\
    \ executing queries, making it easier to work with our vector search index.\n\n\
    The code we previously created in performSearch implements the similarity search\
    \ logic. It currently uses the manual dot product calculation we built in utils/mathUtils.js\
    \ to compare the query embedding with the embeddings stored in the database. We\
    \ will remove this manual calculation and replace it with a query to the vector\
    \ search index we created in Couchbase.\n\nWe no longer need the utils/mathUtils.js\
    \ file now that Couchbase handles vector similarity calculations for us. You can\
    \ safely delete this file to clean up your codebase.\n\nThe new function will\
    \ take the query search embedding from the user as return the most similar documents\
    \ from the database based on the vector search index. Previously, performSearch\
    \ operated in the following manner:\n\n```\ncreating_vector_search_service/performSearch.js\n\
    import { getAllStoredEmbeddings } from './fetchEmbeddings';\nimport { dotProduct\
    \ } from '../utils/mathUtils';\n/**\n* Perform similarity search by comparing\
    \ query\n* embedding with stored embeddings.\n* @param {Array} queryEmbedding\
    \ - The query vector embedding.\n* @returns {Promise<Array>} - A ranked list of\
    \ relevant articles\n* based on similarity.\n */\nconst performSearch = async\
    \ (queryEmbedding) => {\n  try {\n    // Fetch all stored embeddings from Couchbase\n\
    \    const storedEmbeddings = await getAllStoredEmbeddings();\n    // Perform\
    \ dot product for each article\n    const searchResults = storedEmbeddings.map(\n\
    \      ({ articleId, embedding }) => {\n        const similarityScore = dotProduct(queryEmbedding,\
    \ embedding);\n        return { articleId, similarityScore };\n      });\n\n \
    \   // Rank articles by similarity score\n    searchResults.sort(\n      (a, b)\
    \ => b.similarityScore - a.similarityScore\n    );\n    return searchResults;\
    \ // Return results\n  } catch (error) {\n    console.error('Error search:', error);\n\
    \    throw error;\n  }\n}\nexport { performSearch };\n```\n\nThe primary change\
    \ we need to make is to introduce new functionality that only returns the articles\
    \ similar to the user query. Before, we needed to fetch all of the embeddings\
    \ and calculate the dot product for each one. Now, we can query the vector search\
    \ index in Couchbase to return only the most relevant. This shift provides a considerable\
    \ performance improvement.\n\ncreating_vector_search_index/performSearch.js\n\n\
    ```javascript\nimport { getCluster } from '../clients/couchbase';\nimport couchbase\
    \ from 'couchbase';\n```\n\n```javascript\n/**\n * Perform similarity search by\
    \ comparing query\n * embedding with stored embeddings.\n *\n * @param {Array}\
    \ queryEmbedding - The query vector embedding.\n * @returns {Promise<Array>} -\
    \ A ranked list of relevant articles\n * based on similarity.\n */\n```\n\n```javascript\n\
    const performSearch = async (queryEmbedding) => {\n  try {\n    const cluster\
    \ = await getCluster();\n    const scope = cluster.bucket('default').scope('_default');\n\
    \    const searchIndex = 'vector-search-index';\n\n    const searchReq = couchbase.SearchRequest.create(\n\
    \      couchbase.VectorSearch.fromVectorQuery(\n        \"default.embedding\"\
    , queryEmbedding\n        )).limitCandidates(5));\n    const result = await scope.search(searchIndex,\
    \ searchReq);\n    return result.rows.map(row => ({\n      articleId: row.id.replace('embedding:',\
    \ ''),\n      similarityScore: row.score,\n    }))\n    .sort((a, b) => b.similarityScore\
    \ - a.similarityScore);\n  } catch (error) {\n    console.error('Error performing\
    \ similarity search:', error);\n    throw error;\n  }\n};\nexport { performSearch\
    \ };\n```\n"
  mdcn: "\n\n# 创建向量搜索索引 • 79\n\nCLI 随后会提供选项来配置你的 cbshell 配置文件，例如使用哪个集群凭据。一旦你选择了所需的凭据，请复制配置详情并粘贴到安装\
    \ CLI 工具后创建的 .cbsh 文件夹中的新文件中。\n\n![](img/b23bbf9ef1dda8c73f3d9b853358aa22_88_0.png)\n\
    \n最后，在配置文件中，将密码的占位符值替换为你的实际密码。\n\n现在设置已完成，你可以使用 cshell CLI 进行所有的数据库基础交互。\n\n报告错误\
    \ erratum • 讨论 discuss\n\n# 创建向量搜索索引\n\n一旦我们使用 cbshell 创建了新的向量搜索索引，就可以从代码库中移除手动点积（dot\
    \ product）计算了。将相似性计算交由数据库将使我们的搜索操作更高效、更具扩展性。\n\n你可能会问为什么我们一开始没有采用这种方法。学习某事物如何工作的最好方法是从第一原理开始。通过手动构建点积计算，你可能能够更深入地理解它的底层工作原理。现在我们已经有了这些理解，就可以利用\
    \ Couchbase 的内置功能来处理了。\n\n让我们首先打开 CLI 开始操作：\n\n```\n./cbsh\n```\n\n你应该看到类似所示的提示符：\n\
    \n>\n\n通过调用 buckets 命令，你可以运行快速测试以确认一切已准备就并按预期工作。buckets 命令将返回集群中桶的列表：\n\n```\n\
    > buckets\n```\n\n如果一切正常，你将看到类似下方输出列出的桶。如果没有，或者你遇到了任何问题，你可能需要重新检查你的配置设置。\n\n|\
    \ | cluster | | type | replicas |\n|---|---|---|---|---|\n| 0 | default | beer-sample\
    \ | couchbase | 1 |\n| 1 | default | default | couchbase | 1 |\n| 2 | default\
    \ | targetBucket | couchbase | 0 |\n| 3 | default | travel-sample | couchbase\
    \ | 1 |\n\n既然我们已经确认 cbshell 正常工作，现在就可以创建向量搜索索引了。创建新向量索引的命令是 `vector create-index`。该命令本身接受几个我们需要提供的参数——分别是存储嵌入（embeddings）的桶名称、使用的相似性度量、我们想要创建的索引名称、包含嵌入的字段名称以及嵌入的维度数。\n\
    \n由于我们使用点积作为相似性度量创建应用程序，我们将使用以下命令来创建索引：\n\n```\ncreating_vector_search_index/cbshell_command_examples.sh\n\
    vector-search-index --name \\\n  --bucket bucket_name \\\n  --similarity-metric\
    \ dot_product\nvector-search-index embedding 1536\n```\n\n在此命令中，将 `name_of_bucket`\
    \ 替换为存储你嵌入的桶名称。`vector-search-index` 是我们要创建的索引名称，`embedding` 是包含嵌入的字段名称，而 `1536`\
    \ 是嵌入的维度。维度数应与你在为数据库中的文档创建嵌入时使用的嵌入大小匹配。\n\n你可以通过查询所有索引进行快速检查，以确保索引已创建，你应该会在列表中看到新索引：\n\
    \n```\ncreating_vector_search_index/cbshell_command_examples.sh\nquery indexes\n\
    ```\n\n搞定！你已经使用 cbshell 在 Couchbase 中成功创建了向量搜索索引。该索引将允许通过将相似性计算的沉重工作交给数据库，从而更有效地执行相似性搜索。让我们使用\
    \ Couchbase.js SDK 和 Ottoman.js 将此索引集成到应用程序中。这部分涉及删除代码，这总是很有趣！\n\n# 集成向量搜索索引\n\
    \n我们将继续使用 Couchbase Node SDK 和 Ottoman.js 与数据库交互并查询向量搜索索引。通过利用 Ottoman.js，我们可以简化构建和执行查询的过程，使处理我们的向量搜索索引变得更加容易。\n\
    \n我们之前在 `performSearch` 中创建的代码实现了相似性搜索逻辑。它目前使用我们在 `utils/mathUtils.js` 中构建的手动点积计算来比较查询嵌入与存储在数据库中的嵌入。我们将移除此手动计算，并用对我们在\
    \ Couchbase 中创建的向量搜索索引的查询来替换。\n\n既然 Couchbase 为我们处理向量相似性计算，我们现在不再需要 `utils/mathUtils.js`\
    \ 文件了。你可以安全地删除此文件以清理代码库。\n\n新函数将接收用户的查询搜索嵌入，并根据向量搜索索引返回数据库中最相似的文档。此前，`performSearch`\
    \ 的运行方式如下：\n\n```\ncreating_vector_search_service/performSearch.js\nimport { getAllStoredEmbeddings\
    \ } from './fetchEmbeddings';\nimport { dotProduct } from '../utils/mathUtils';\n\
    /**\n* 通过比较查询嵌入与存储的嵌入来执行相似性搜索。\n* @param {Array} queryEmbedding - 查询嵌入。\n* @returns\
    \ {Promise<Array>} - 基于相似性排序的相关文章列表。\n */\nconst performSearch = async (queryEmbedding)\
    \ => {\n  try {\n    // 从 Couchbase 获取所有存储的嵌入\n    const storedEmbeddings = await\
    \ getAllStoredEmbeddings();\n    // 为每个文章执行点积\n    const searchResults = storedEmbeddings.map(\n\
    \      ({ articleId, embedding }) => {\n        const similarityScore = dotProduct(queryEmbedding,\
    \ embedding);\n        return { articleId, similarityScore };\n      });\n\n \
    \   // 根据相似性评分对结果进行排序\n    searchResults.sort(\n      (a, b) => b.similarityScore\
    \ - a.similarityScore\n    );\n    return searchResults; // 返回结果\n  } catch (error)\
    \ {\n    console.error('search:', error);\n    throw error;\n  }\n}\nexport {\
    \ performSearch };\n```\n\n我们需要进行的的主要更改是引入仅返回与用户查询相似的文章的新功能。以前，我们需要获取所有的嵌入并为每一个计算点积。现在，我们可以查询\
    \ Couchbase 中的向量搜索索引以仅返回最相关的。这种转变带来了显著的性能提升。\n\ncreating_vector_search_index/performSearch.js\n\
    \n```javascript\nimport { getCluster } from '../clients/couchbase';\nimport couchbase\
    \ from 'couchbase';\n```\n\n```javascript\n/**\n * 通过比较查询嵌入与存储的嵌入来执行相似性搜索。\n *\n\
    \ * @param {Array} queryEmbedding - 查询嵌入。\n * @returns {Promise<Array>} - 基于相似性排序的相关文章列表。\n\
    \ */\n```\n\n```javascript\nconst performSearch = async (queryEmbedding) => {\n\
    \  try {\n    const cluster = await getCluster();\n    const scope = cluster.bucket('default').scope('_default');\n\
    \    const searchIndex = 'vector-search-index';\n\n    const searchReq = couchbase.SearchRequest.create(\n\
    \      couchbase.VectorSearch.fromVectorQuery(\n        \"default.embedding\"\
    , queryEmbedding\n        )).limitCandidates(5));\n    const result = await scope.search(searchIndex,\
    \ searchReq);\n    return result.rows.map(row => ({\n      articleId: row.id.replace('embedding:',\
    \ ''),\n      similarityScore: row.score,\n    }))\n    .sort((a, b) => b.similarityScore\
    \ - a.similarityScore);\n  } catch (error) {\n    console.error('Error performing\
    \ similarity search:', error);\n    throw error;\n  }\n};\nexport { performSearch\
    \ };\n```\n\n"
