    \ entity, as each article can have multiple tags.\n\nThe Article model will have\
    \ the following attributes:\n\n- id: A unique identifier for the article.\n- slug:\
    \ A unique slug for the article, derived from the title.\n- title: The title of\
    \ the article.\n- description: A short description or summary of the article.\n\
    - body: The body or content of the article.\n- author: The user ID of the author.\n\
    - taglist: An array of tag IDs for tags associated with the article.\n- comments:\
    \ An array of comment IDs for comments on the article.\n- favoritesCount: The\
    \ number of users who have selected the article as a favorite.\n\nLooking at the\
    \ author attribute, we can see that it's a user ID, establishing a relationship\
    \ between the article entity and the user entity. The comments attribute is an\
    \ array of comment IDs, establishing a relationship between the article entity\
    \ and the comment entity. Similarly, the taglist attribute is an array of tag\
    \ IDs, establishing a relationship between the article entity and the tag entity.\
    \ As we dev when describing the User model, let's visualize the Article model\
    \ and its relationships to further understand the data model:\n\n![](img/b23bbf9ef1dda8c73f3d9b853358aa22_51_0.png)\n\
    \nNow that we have a good understanding of the data model for the article entity,\
    \ let's write the code using Ottoman to define the Article model. Create a new\
    \ file called Article.js in the models/ folder and import the necessary dependencies:\n\
    \n```\nimplementing_vector_generation_service/create_article_model.js\nimport\
    \ { Schema, model, getModel } from 'ottom';\nimport slugify from 'slugify';\n\
    ```\n\nIn the preceding code, we're importing functions and modules from Ottoman.\
    \ A JavaScript library, to help interact with our database from our models, namely\
    \ the Schema, model, and getModel functions. You'll notice that a unique import\
    \ for the Article model, which is the slugify. This library will help generate\
    \ unique slugs for the articles based on the title. All of these imports are part\
    \ of a coursebaseClient that we will create at the end of this chapter.\n\nNext,\
    \ let's define the schema for the Article model using the syntax from Ottoman.js:\n\
    \n```\nimplementing_vector_generation_service/create_article_model.js\nconst articleSchema\
    \ = new Schema({\nslug {\n  type: String,\n  unique: true,\n  lowercase: true,\n\
    \  index: true,\n},\ntitle {\n  type: String,\n  required: true,\n},\ndescription\
    \ {\n  type: String,\n  required: true,\n},\nbody {\n  type: String,\n  required:\
    \ true,\n},\n// Creates an array of tags, defaulting to an empty array\n// ()\
    \ => [] is used instead of [] to avoid shared references\ntagList {\n  type: [{\
    \ type: String, ref: 'Tag' }],\n  default: () => [],\n},\nauthor {\n  type: String,\n\
    \  ref: 'User',\n},\nfavoritesCount {\n  type: Number,\n  default: 0,\n});\n```\n\
    \n- 4. https://www.npmjs.com/package/slugify - discuss\n\n```\n// Comments are\
    \ stored as an array of references to Comment documents\n// Again, default is\
    \ a function to return a fresh array per instance\ncomments: {\n  type: { type:\
    \ String, ref: 'Comment' },\n  default: () => [],\n},\nembed: {\n  type: [Number],\n\
    \  default: () => [],\n},\n{\n  timestamps: true,\n});\n\n// Before saving updates,\
    \ regenerate the slug based on the new title\n// This ensures the slug stays in\
    \ sync when the title changes\narticleSchema.pre('update', function (document)\
    \ {\n  document.slug = slugify(document.title, {\n    lower: true,\n    replacement:\
    \ '-',\n  });\n});\n\n// Converts the instance to a response object for API output,\n\
    // including author profile and filed status\narticleSchema.methods.toArray =\
    \ async function (user) {\n  const User = getModel('User');\n  const authorObj\
    \ = await User.findById(this.author);\n  return {\n    slug: this.slug,\n    articleSlug:\
    \ this.slug,\n    title: this.title,\n    description: this.description,\n   \
    \ body: this.body,\n    createdAt: this.createdAt,\n    updatedAt: this.updatedAt,\n\
    \    tagList: this.tagList,\n    favorite: user ? user.isFavorite(this.id) : false,\n\
    \    favoritesCount: this.favoritesCount,\n    author: authorObj.toJSON(user)\n\
    \  };\n};\n\n// Adds a comment reference to the article's comments array,\n//\
    \ if not already present\narticleSchema.methods.addComment = async function (commentId)\
    \ {\n  if (this.comments.indexOf(commentId) === -1) {\n    this.comments.push(commentId);\n\
    \  }\n}\n```\n\n```\nreturn this.save();\n};\n\n// Removes a comment reference\
    \ from the article's comments array,\n// if present\narticleSchema.methods.removeComment\
    \ = async function (commentID) {\n  const idx = this.comments.indexOf(commentID);\n\
    \  if (idx != -1) {\n    this.comments.splice(idx, 1);\n  }\n  return this.save();\n\
    }\n```\n\n```\nconst scope = process.env.DB_SCOPE || \"default\";\nconst Article\
    \ = model('Article', articleSchema, {scopeName: scope});\nexport { articleSchema,\
    \ Article };\n```\n\nThe model defines the attributes we discussed earlier for\
    \ articles. The slug, title, description, and body attributes are required fields,\
    \ with the slug being unique and indexed for faster search performance. The tag\
    \ is an array of IDs, establishing relationships between the article entity and\
    \ the tag entity. The author field is a user ID, establishing a relationship between\
    \ the article entity and the user entity. The comments field is an array of comment\
    \ IDs, establishing a relationship between the article entity and the comment\
    \ entity. The favoritesCount is a number that tracks the number of users who have\
    \ selected the article as a favorite.\n\nYou'll also notice the embedding field,\
    \ which is an array of numbers. This field will store the vector embedding for\
    \ the article, which we'll generate and store in the database. This field will\
    \ be critical for performing similarity searches based on the vector embeddings.\n\
    \nWe also use a hook to automatically generate a clean slug from the title, using\
    \ the library. Let's take a brief look at the other models and their role in the.\n\
    \n# Defining the Other Models\n\nAs mentioned near the start of this chapter,\
    \ the platform holds models for users, articles, comments and tags. The Article\
    \ model is the centerpiece of the vector search process, as it will hold the vector\
    \ embeddings. The rest of the models are vital to the platform but not as relevant\
    \ to the. Here's a brief overview of each of the\n\n![](img/b23bbf9ef1dda8c73f3d9b853358aa22_54_0.png)\n\
    \nmodels. The full code for each model can be found at the GitHub repository for\
    \ the project.\n\n- The User model can author articles, follow other users, and\
    \ favorite articles. These relationships may help personalize vector search results\
    \ if you wish to extend the functionality you've learned in this book to create\
    \ filters to followed users' articles or favored articles.\n\n- Comments are associated\
    \ with articles and written by users. While they're not directly embedded or indexed\
    \ for vector search, they add contextual richness that could be used in further\
    \ enhancements with hybrid search strategies.\n\n- Tags are used to categorize\
    \ articles and support basic filtering. Since we won't generate or store vector\
    \ embeddings for tags, we don't need to expand upon them here.\n\n# Connecting\
    \ Articles to the Database\n\nTo generate and store embeddings, we need a back\
    \ end that can persist data reliably and respond to embedding services efficiently.\
    \ In our case, we're using Couchbase as the underlying database and Ottoman as\
    \ the ODM (Object Document Mapper) to interact with it.\n\nOttoman makes it easy\
    \ to model data documents in JavaScript and handle relationships between entities\
    \ like users, articles, and tags. But before we can use it in our models or service\
    \ logic, we need to configure a shared connection instance to the Couchbase cluster.\n\
    \nLet's set that up now.\n\nCreate a new file called couchbaseClient.js in a new\
    \ subfolder named services/ directory. This file will hold our shared Couchbase\
    \ connection logic and expose a configured Ottoman instance that other parts of\
    \ the app can reuse.\n\nYour directory should look like this:\n\n```\nvector-blog-platform/\n\
    \  services/\n    clients/\n      couchbaseClient.js\n```\n"
