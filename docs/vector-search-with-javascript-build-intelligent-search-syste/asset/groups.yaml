    \ We'll transform users' queries into vector embeddings to search the content.\
    \ The generation of a new embedding for every query needs to happen quickly, so\
    \ we need to consider performance and make sure that the process takes as little\
    \ time as possible. Recent research into user behavior shows that 40 percent of\
    \ users will leave a website if a response takes more than three seconds. That's\
    \ a lot of pressure, so we need to ensure the platform we choose and the SDK can\
    \ handle the load.\n\n- 5. https://www.forbes.com/advisor/business/software/website-statistics/\n\
    \nThe transformation of the content into embeddings can happen at the time of\
