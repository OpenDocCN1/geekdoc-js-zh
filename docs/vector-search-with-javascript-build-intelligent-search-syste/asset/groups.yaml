    If you''re a developer who wants to go beyond keyword search and start delivering
    smarter, more relevant results, this book is your guide.


    Angie Jones, VP, Developer Relations


    # Acknowledgments


    I''m grateful to the many technical reviewers who offered thoughtful feedback,
    sharp insights, and generous encouragement throughout the writing of this book.
    Their input made the work clearer, more accurate, and far more useful.


    - Aisha Blake

    - Brian King

    - Josh Grossman

    - Kevin Lewis

    - Samhitha Prasad

    - Tanay Pant


    Thanks to Susannah Davidson and the entire Pragmatic Bookshelf production team
    for their guidance, patience, and attention to detail from the first draft to
    the final layout.


    To my family, thank you for your support and encouragement in this project. And
    to my wife in particular, whose patience and support made the many nights and
    weekends spent working on this book possible.


    # Introduction


    Welcome to the world of vector search! By opening this book, you''ve taken the
    first step toward mastering an area of technology that powers modern search experiences.
    Vector search leverages advanced machine learning techniques to deliver relevant,
    precise, and context-aware results across various domains. Whether it''s driving
    the search bar on a website, personalizing content recommendations, or enabling
    cutting-edge anomaly detection, vector search redefines how we access and interact
    with information.


    As user expectations for seamless and intuitive experiences grow, traditional
    keyword-based search systems often fall short of the mark. Users demand accurate
    results even when their queries are imprecise, support for contextual understanding,
    and the ability to surface hidden insights within vast datasets. Vector search
    meets these challenges by embedding data into dense mathematical representations,
    enabling powerful similarity calculations that uncover deeper relationships and
    meaning.


    This book is your guide to understanding and implementing vector search systems.
    We will explore the core concepts, tools, and techniques that underpin vector
    search and provide you with the knowledge and skills to build your search applications.
    By the end of this book, you''ll harness the potential of vector search and create
    intelligent, efficient search systems that deliver value to your users.


    # Who This Book Is For


    This book is written for developers who want to build smarter, more effective
    search experiences. If you''re a back-end engineer looking to go beyond traditional
    search techniques or a full-stack developer curious about integrating AI into
    your applications, you''ll find the concepts and code examples in this book approachable
    and actionable.


    You''ll need some basic familiarity with JavaScript and Node.js, but you don''t
    need a background in machine learning or search theory. Every concept is introduced
    clearly, explained in plain language, and backed by working code. By the time
    you''re done, you''ll have both a solid understanding of vector search and the
    skills to apply it in your own projects.


    # What’s in This Book


    This book provides a hands-on approach to vector search, blending theoretical
    explanations with real-world coding examples. You''ll learn how to implement vector
    search step by step, from generating embeddings to optimizing performance. We''ll
    cover key concepts such as vector indexing, querying handling, and hybrid search
    techniques along the way. Each chapter builds on the last, but if you''re already
    familiar with specific topics, feel free to jump to the sections interest you
    most; for example, if you''re already knowledgeable on the foundations of vector
    search, you may want to skip [Chapter 2, Understanding Vector Search, on page
    11].


    Throughout the book, you''ll work on a project based on the RealWorld example
    app that mimics the features of Medium. You''ll enhance this familiar app with
    vector-powered functionality, step by step. By embedding content, enabling semantic
    search, and learning in hybrid techniques, you''ll transform a conventional CRUD
    app into a modern, intelligent search experience. This project grounds each concept
    in practical, real-world implementation and serves as a running example you can
    adapt and expand in your own work.


    This book is structured in two parts. Part 1, Foundations of Vector Search, includes
    Chapters 1 through 3 and focuses on the core ideas: what vector search is, how
    it works, and the building blocks such as embeddings and similarity. Part 2, Building
    a Vector Search Service, spans Chapters 4 through 11 and walks you through designing,
    implementing, and optimizing a fully functional search system using real code
    and data.


    Wondering where to begin? You''ll get your feet wet with a quick hands-on vector
    search project in the first chapter. The second chapter will introduce you to
    the fundamentals of vector search, including how it differs from traditional search
    methods and a high-level overview of commonly used techniques. If you''re already
    familiar with the basics, you can skip ahead to [Chapter 3, Generating Vector
    Embeddings, on page 15], to dive into vector embeddings work and why they''re
    essential. Feeling ready to build? Head straight to [Chapter 4, Building the Foundation
    for Vector Search, on page 25], to set up your environment and start coding your
    own vector search system from the ground up.


    # Conventions Used in This Book


    This book presents all code snippets in JavaScript and formats for easy readability.
    It highlights essential terms and concepts at first use and pairs practical examples
    with clear explanations. Diagrams and other visualizations support the text, while
    side notes and case studies offer additional insights to deepen your understanding.
    By working through the examples in each chapter, you''ll gain a solid understanding
    of vector search and build a functional search system from scratch.


    # Online Resources


    You''ll find a dedicated page for this book on the Pragmatic Bookshelf website.
    From you, you can download the complete source code.


    Do you have feedback or questions? Follow the links on the book''s web page to
    the DevTalk forum, where you can report a mistake, suggest changes, or just discuss
    what you''ve learned with other readers.


    The author''s GitHub repository is also at https://vectorsearchbook.com/. This
    repository contains the source code for the application built throughout the book
    and will be updated regularly for the latest tooling and library changes. You
    can also find additional resources and sign up for a newsletter to stay informed
    about the newest AI-powered search developments on the website.


    Vector search is a technology that presents an inflection point in user experience.
    It''s a gateway to building more intelligent, intuitive systems that can transform
    how users interact with data. By the end of this book, you''ll have the skills
    to implement robust vector search solutions tailored to your projects. So, let''s
    begin our journey into the world of vector search!


    1. http://prprog.com/titles/bgvector


    # Part I


    # Foundations of Vector Search


    # Getting Started with Vector Search


    Let''s get our feet wet with a quick example project to see how useful vector
    search can be. You''ll learn all about the underlying concepts in the following
    chapters, but for now, we''re just going to have some fun and see vector search
    in action. Later in this book, you''ll build a vector search project from scratch
    based on a widely adapted open source project. This chapter invites you to work
    with real data, run real code, and see meaningful results before we introduce
    any formal definitions or math.


    Imagine you''re writing this book. Sure, writing the text took a while, but you
    managed to finish everything ... when all of a sudden you hit your writer''s block.
    You need a title for the book, and you can''t figure out what would not only be
    a great title but something that fits in your publisher''s style of book titles.
    That was me, and guess what. I used vector search to help me come with just the
    right title for this book.


    You now get to follow that same process. Using the OpenAI API, you''ll generate
    embeddings from real titles, store them locally, and compare them to a title of
    your own. This exercise gives you a practical and approachable way to engage with
    vector search before we unpack the deeper concepts behind it. All you need is
    one file, a small dataset, and a willingness to explore.


    # Setting Up the Project


    Create a new file named name_this_book.js. This file will do everything for you:
    scrape the website, generate embeddings, compare them, and return the top matches.
    Embeddings are numerical representations of text that captures its meaning and
    context. Embeddings are a central concept throughout this book, and we''ll explore
    them in much greater depth as we go.

