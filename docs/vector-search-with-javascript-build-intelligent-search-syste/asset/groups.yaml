    \ 1536 个值的列表。对于每篇博客文章和每个用户查询来说，存储这些数据量巨大；尤其是当我们考虑到将为每个查询存储嵌入时。因此，我们还需要一个能够高效处理高维数据的数据库。\n\
    \n针对性能进行优化意味着还需要具备正确索引向量嵌入数据的能力。索引向量嵌入意味着创建一个数据结构，允许根据向量与查询的相似性快速检索向量。与依赖精确匹配的传统索引（如关键词搜索，正如我们在第\
    \ 3 章“生成向量嵌入”第 15 页中所解释的）不同，向量索引侧重于相似性搜索，即在高维空间中找到距离查询最近的向量。\n\n我们将在第 7 章“创建向量搜索服务”第\
    \ 63 页详细讨论向量搜索索引的机制和设置，但现在重要的是，选择的数据库必须能够高效地处理向量嵌入的索引。数据库必须能够快速创建和更新索引，并且能够查询索引以及时返回结果。\n\
    \n现在我们对数据库的要求有了更好的理解，让我们来看看可用于存储和查询向量嵌入的不同类型数据库：\n\n-   **文档数据库（Document databases）**是以文档格式（如\
