    \ 文件放在项目根目录下的 `services/embeddings/` 文件夹中。如果还没有创建，让我们创建该文件夹并按如下结构进行组织：\n\n- embeddings/\n\
    \  - createEmbedding.js\n  - saveEmbedding.js\n\n在本节中，我们将仅关注 `saveEmbedding.js`\
    \ 的功能，但你可以看到创建了一个 `createEmbedding.js` 文件。我们将在第 55 页的“创建向量嵌入”中构建生成文章嵌入的功能。现在，让我们专注于在数据库中存储嵌入。\n\
    \n`saveEmbedding.js` 的职责是将嵌入及其相关文章存储在数据库中。由于我们在此项目中使用了 Couchbase，该函数将利用 Couchbase\
    \ 的文档数据库功能。以下是我们将采取的步骤概述：\n\n1. 建立数据库连接：使用配置中的凭据连接到 Couchbase 实例。\n2. 准备嵌入数据：确保嵌入和关联文章数据已准备好存储在文档中。\n\
    3. 将嵌入插入数据库：将文章及其嵌入插入到 Couchbase 的特定桶（bucket）中。\n\n下面的图显示了组件之间逐步执行的流，用于为数据库保存嵌入。\n\
    \n![](img/b23bbf9ef1dda8c73f3d9b853358aa22_64_0.png)\n\n现在，让我们在 `saveEmbedding.js`\
    \ 文件中实现这一过程：\n\n```javascript\nimplement_vector_generation_service/saveEmbedding.js\n\
    import Article from '../models/Article';\nimport { ValidationError } from '../utils/errorHandlers';\n\
    \n// 保存嵌入和文章数据的函数\nconst saveEmbedding = async (articleId, articleContent, embedding)\
    \ => {\n  if (!articleId || !articleContent) {\n    throw new ValidationError(\n\
    \      'Article ID, content, and embedding are required to save.'\n    );\n  }\n\
    \n  try {\n    // 查找现有文章或创建新实例\n    let article = await Article.findById(articleId);\n\
    \n    if (!article) {\n      article = new Article({\n        slug: articleContent.slug,\n\
    \        title: articleContent.title,\n        description: articleContent.description,\n\
    \        body: articleContent.body,\n        author: articleContent.author,\n\
    \        tagList: articleContent.tagList, // 与文章相关的标签\n        favoritesCount:\
    \ 0, // 初始化收藏\n        comments: [], // 初始化评论\n        embedding // 保存嵌入\n   \
    \   });\n    } else {\n      // 更新现有文章的嵌入\n      article.embedding = embedding;\n\
    \    }\n    await article.save();\n    console.log('Article and embedding saved\
