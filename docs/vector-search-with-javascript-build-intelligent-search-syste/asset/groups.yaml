    # Breaking Down an Individual Embedding


    Embeddings are dense vector representations of data that capture the relationships
    between different entities. We use embeddings to represent data, making performing
    operations such as similarity calculations easier. The embeddings capture both
    the semantic and syntactic relationships between entities. For example, in the
    case of words, embeddings can capture relationships such as king to queen, which
    is a semantic relationship, and king to kings, which is a syntactic relationship.


    What does that look like in reality? Let''s take the king and queen example and
    how we represent them as embeddings. In the case of embeddings, the word king
    could be represented as a vector embedding that looks like:


