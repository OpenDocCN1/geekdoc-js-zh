    # Programming Machine Learning


    You''ve decided to tackle machine learning — because you''re job hunting, embarking
    on a new project, or just think self-driving cars are cool. But where to start?
    It''s easy to be intimidated, even as a software developer. The good news is that
    it doesn''t have to be hard. Conquer machine learning by writing code one line
    at a time, from simple learning programs all the way to a true deep learning system.
    Tackle the hard topics by breaking them down so they''re easier to understand,
