    \ consumed:\", embedding.usage.total_tokens);\n  } catch (error) {\n    console.error(\"\
    Error generating embedding:\", error);\n  }\n};\n\nmain();\n```\n\n在与该文件相同的根目录下创建一个\
    \ `.env` 文件，并添加环境变量，将 `your-api-key-here` 替换为你真实的 OpenAI API 密钥：\n\nOPENAI_API_KEY=your-api-key-here\n\
    \n请记住，不要将你的环境变量提交到任何公共仓库（如 GitHub）。如果你要将代码添加到 GitHub，请务必使用 `.gitignore` 文件将 `.env`\
    \ 文件包含在忽略列表中。\n\n然后，在命令行中执行以下命令来运行脚本：\n\n```bash\nnode first_api_request.js\n\
    ```\n\n完成操作后，你应该能在终端中看到输出的新向量嵌入结果、所使用的模型信息以及消耗的 token 数量。\n\n就是这样！你刚刚发送了第一个请求，并收到了第一个向量嵌入响应！恭喜你。你现在准备好在应用程序中实现向量搜索了。\n\
    \n## 核心要点\n\n在本章中，我们探索了向量嵌入（vector embeddings）、它们是如何生成的，以及为什么它们对于现代应用（如搜索和推荐系统）至关重要。我们讨论了不同类型的嵌入模型，并将它们与生成模型进行了对比。最后，我们通过使用\
    \ OpenAI Embeddings API 生成嵌入的实战演示作为结束。\n\n以下是本章的核心要点：\n\n- 向量嵌入将数据（如文本）表示为高维空间中的稠密向量，捕捉语义和句法关系。\n\
    - 像 OpenAI 的 Ada 这样的嵌入模型可以使用 API 从纯文本创建这些向量。\n- 嵌入是搜索和推荐引擎等系统的基础。\n- 你现在已经知道如何使用\
    \ OpenAI Embeddings API 生成嵌入。\n\n下一章将重点关注设置开发环境，包括搭建应用程序的脚架（scaffolding）以及配置存储你向量嵌入的向量数据库。\n\
    \n## 第二部分\n\n## 构建向量搜索服务\n\n## 构建向量搜索的基础\n\n在过去的几个章节中，你已经探索了向量搜索的基础知识，从嵌入、嵌入模型到神经网络和\
    \ NLP 概念。在此过程中，你创建了向量嵌入。现在是时候从理论转向实践了。从现在开始，我们将专注于构建一个由向量搜索驱动的真实世界应用程序。\n\n在接下来的章节中，你将获得将向量搜索集成到应用程序中的实际经验。我们将涵盖从零开始构建的所有方面。我们将从设置开发环境开始，学习我们将要使用的不同开发者工具，并配置向量数据库以存储驱动你应用程序搜索的嵌入。\n\
    \n准备好开始了吗？我们出发吧！\n\n## 搭建你的 Node.js 项目脚架\n\n在深入搭建脚架之前，了解你将在整本书中构建的项目将非常有帮助。正如我们在第\
    \ 2 章《理解向量搜索》第 11 页中所讨论的，向量搜索有许多实际案例，从异常检测到内容推荐引擎再到相似性搜索。你将创建一个功能完整的博客平台，该平台使用向量搜索来响应用户查询。搜索框将不再依赖精确的关键词匹配，而是根据查询与博客文章内容的语义对齐程度来返回结果，这将帮助用户即使在不知道关键词的情况下也能发现相关材料。\n\
    \n现在你已经知道要构建什么了，让我们来下基础。\n\n搭建脚架涉及创建必要的目录和文件、安装依赖项以及配置基本设置。\n\n## 第 4 章. 构建向量搜索的基础\n\
    \n不过，我们并不会从零开始构建博客平台！我们将利用 RealWorld Example Apps¹ 项目，该项目旨在尽可能用多种编程语言和框架创建功能完整的示例应用程序。RealWorld\
    \ Example Apps 项目提供了一个功能完整的博客平台，包括用户身份验证、文章创建、文章编辑和文章搜索功能。RealWorld 项目的创建者称为 Conduit，你可以在社区已经创建的所有实现²，它们已按前端、后端和全栈版本进行了排序。\n\
    \n如果你在书的任何阶段遇到困难，都可以在 GitHub 上找到整个项目的代码³。在过程的各个阶段，我们都会回溯代码库，所以你不需要书签此页面。\n\n创建我们\
    \ Node.js 项目脚架的第一步是创建必要的目录和文件。我们将首先为项目创建一个新目录，然后在其中创建必要的子目录。我们需要以下目录，从我们的项目根目录开始（你可以为它命名任何名称，例如\
    \ `vector-blog-platform`）。\n\n我们将开始将博客平台的后端配置为 API 服务。为了实现这一点，我们将项目组织成清晰的结构，将存储和路由等职责分离。这种布局有利于未来扩展应用。\n\
    \n请在根目录下创建以下目录：\n\n- api/: 包含后端的逻辑逻辑和配置，包括安全数据库连接。\n1. https://github.com/gothster/realworld\n\
    2. https://codebase.show/projects/realworld\n3. https://github.com/hummusrails/vector-example-platform\n\
    \n- middleware/: 包含自定义中间件逻辑，如身份验证和 JWT 验证。\n- models/: 包含模型文件，定义数据库中数据的结构。\n-\
    \ routes/: 包含不同端点的路由定义。\n- views/: 通过浏览器访问 API 服务时的默认视图。\n\n当你创建了所有文件夹后，你的目录结构应该如下：\n\
    \n```\nvector-blog-platform/\n  -- api/\n  -- config/\n  -- controllers/\n  --\
    \ middleware/\n  -- models/\n  -- routes/\n  -- views/\n```\n\n你现在已经创建了项目的基本结构。在本书中，我们将随着功能的开发向该结构添加文件和目录。下一步是安装项目所需的依赖项并配置存储嵌入的向量数据库。\n\
    \n在继续安装依赖项之前，是时候讨论向量嵌入数据库化的重要性。\n\n## 选择向量数据库\n\n你可能会看到这个标题并想：“我为什么需要一个专门的向量数据库？我不能直接用任何数据库吗？”在接下来的示例中，我们需要一个处理“普通”数据的数据库——即非向量嵌入的数据，如博客内容、用户配置文件等信息；我们还需要一个高效存储、索引和查询向量嵌入的数据库。我们可以将这些职责分离，但我们的初衷不是引入任何额外的复杂性，并减少数据库基础设施的扩张。在下一节中，我们将讨论在为项目选择数据库时应该考虑的因素。\n\
    \n"
