  mdcn: "\n既然我们已经学习了如何使用 Node.js SDK 调用 API，并探索了 API 的响应，为什么不现在尝试发送你的第一个请求呢？\n\n创建一个名为\
    \ `request.js` 的新文件并添加以下内容，将输入参数中的 `\"Your text string goes here in the input\
    \ parameter\"` 替换为你任何想要转换为向量嵌入的文本：\n\n```javascript\nbasics_of_vector_embeddings/first_api_request.js\n\
    import OpenAI from \"openai\";\nimport dotenv from \"dotenv\";\n\ndotenv.config();\n\
    \nconst openai = new OpenAI({\n  apiKey: process.env.OPENAI_API_KEY,\n});\n\n\
    const main = async () => {\n  try {\n    const embedding = await openai.embeddings.create({\n\
