- md: "\n# CHAPTER 3\n\n## Generating Vector Embeddings\n\nYou now understand how\
    \ embeddings represent meaning in vector form and how they're used in similarity\
    \ calculations. In this chapter, you'll learn to generate those embeddings using\
    \ the OpenAI API. We'll walk through what the API offers, how to use it in code,\
    \ and how to interpret the results.\n\n## Breaking Down an Individual Embedding\n\
    \nEmbeddings are dense vector representations of data that capture the relationships\
    \ between different entities. We use embeddings to represent data, making performing\
    \ operations such as similarity calculations easier. The embeddings capture both\
    \ the semantic and syntactic relationships between entities. For example, in the\
    \ case of words, embeddings can capture relationships such as king to queen, which\
    \ is a semantic relationship, and king to kings, which is a syntactic relationship.\n\
    \nWhat does that look like in reality? Let's take the king and queen example and\
