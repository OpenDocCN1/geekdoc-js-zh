    - 通过设置 Couchbase 集群连接并访问目标桶（bucket）和范围（scope）来初始化搜索。


    - 使用 VectorQuery 构建并搜索向量查询，然后通过向量搜索索引在“embeddings”字段上执行该查询。


    - 根据相似性得分检索并映射前五个匹配项，提取文章（article）和相似性得分（similarityScore）。


    - 在将结果返回给调用者之前，按相似性降序排序并返回结果。


    这一精简流程展示了基于嵌入的搜索如何为用户查询带来更多意义。向量搜索不再依赖于精确术语，而是通过比较存储文档的嵌入来实现语义相关性。`VectorQuery`
    接口隐藏了大部分操作的复杂性，让开发者能够关注他们想要检索的内容，而不是如何检索。


    将查询限制在特定的桶内，可以保持查询的高效，并确保其仅在预期的数据集上运行。这种设计避免了不必要的开销，并与 NoSQL JSON 数据库组织数据的方式高度契合。


    由于结果包含内容标识符和相似性评分，可以根据相关性进行排序和过滤。这使得向量搜索非常适用于个性化推荐、语义过滤和自然语言搜索等用例，且都在一致且可扩展的接口内运行。


    ## 核心要点


    本章从手动相似性计算转向了更可持续、更高效且先进的方法：在像 Couchbase 这样的数据平台上创建向量搜索。虽然上一章介绍了向量搜索的基础知识，但本章通过利用
    NoSQL 数据库高效处理这些操作的能力，更进了一步。通过将搜索计算交给数据库，我们简化了后端并优化了搜索服务的性能，将其转变为一个准备好投入生产的可扩展解决方案。


    以下是核心要点：


    - 通过在数据库级别管理相似性计算，设置向量搜索降低了后端的复杂性。


    - 与 Couchbase 的集成允许我们无缝处理大型数据集，使服务更快速、更可靠。


    - 利用 Ottoman.js 进行查询管理保持代码库的整洁和模块化，支持未来的增长和可扩展性。


    展望未来，我们将在此基础上，将面向用户的功能集成到我们的后端中，例如完成搜索 API，以便在我们的应用程序中使用向量搜索功能。到最后结束时，我们的搜索服务将是健壮、易用且达到生产就绪的。


    ## 整合向量搜索功能


    你已经取得了显著进展。在学习旅程的现在，你已经在一个健壮的 Node.js 后端中构建了一个功能完整的向量搜索工具，探索了向量搜索背后的理论，并学习了驱动它的数学和算法。为你所取得的成就感到自豪吧。


    在剩下的章节中，我们将专注于集成并优化你的向量搜索功能以供实际使用。本章将从向你的后端添加搜索 API 开始。我们将涵盖速率限制、错误处理以及请求和响应的结构化，以确保顺畅高效的搜索体验。结束时，你将拥有一个基于你创建的向量搜索服务构建的完整搜索
    API。


    ## 理解当前的 API 服务层


    我们应用程序的 API 服务层是客户端界面与后端功能之间的桥梁。它的设计用于管理用户请求、执行安全策略并高效处理数据事务。当我们准备将向量搜索 API 集成到此架构时，你必须理解当前
    API 结构是如何工作的。


    每个路由使用 Express Router 来定义和分组端点。例如，在 `articleRoutes.js` 中，我们看到了针对 /feed 和 /slug
    等端点的路由。每个路由将端点与 `articlesController.js` 文件中的特定控制器函数关联，该函数封装了每个操作所需的业务逻辑。


    安全性是 API 服务层至关重要的方面，特别是在涉及用户身份验证和授权的应用程序中。为了此，应用程序使用如 `verifyJWT` 等中间件函数对特定路由执行访问控制。位于
    `middleware/` 文件夹下的 `verifyJWT` 中间件检查每个传入请求的授权头中是否存在有效的 JSON Web Token (JWT)。如果令牌有效，则验证用户身份，并在随后的控制器函数中开放其详细信息。


    当我们继续本章设计并实现用于向量搜索功能的搜索 API 时，这种模块化结构将非常有帮助。我们将为搜索功能创建一个专用的路由文件，并定义允许用户执行向量搜索的端点。通过保持路由器、控制器和中间件之间的分离，我们可以在不破坏现有架构的情况下集成此新功能。


    如果这些文本内容很多，那么查看路由器、控制器和中间件如何交互将是一个很好的设计参考。


    ![diagram](https://example.com/images/api-flow.png)


    ## 设计搜索端点


    API 端点将作为用户搜索的网关。设计此端点不仅仅是返回结果，更是为了构建一个用户友好、高效的搜索体验。我们将对搜索端点使用 POST 方法，在正文中传递查询、限制和偏移等参数。


    我们搜索端点的主要参数是 `query`，即用户的搜索字符串。系统将此字符串转换为向量嵌入，并与存储的嵌入进行比较。可选参数（如 `limit` 和 `offset`）支持分页并控制结果大小。


    响应将是一个结构化的 JSON 对象，包含一个按相似性排序的文章数组。每个结果将包含元数据，如标题、摘要和相似性得分，帮助前端展示有用且相关的结果。


    用户并不完美，我们为他们构建的系统也是如此。我们的 API 必须优雅地处理错误，无论是由于意外输入还是恶意行为。它将返回有意义的错误信息和适当的状态码以提供清晰反馈。例如，如果查询参数缺失或格式错误，系统返回
    400 Bad Request。如果发生服务器错误，API 将响应 500 Internal Server Error 并在后端记录详细信息以便分析。


    正如我们讨论的，生成嵌入和计算相似性评分是非常消耗资源的。为了防止滥用并保护性能，我们将在搜索 API 上实现速率限制。这限制了用户在给定时间范围内可以提出的请求次数，确保了公平使用。通过实施合理的限制，我们保持了
    API 的响应能力，减轻了后端压力，并更有效地管理了资源消耗。


