    # Transfer Page from Safari to Google Chrome


    ```javascript

    Safari = Application(''Safari'')


    Chrome = Application(''Google Chrome'')


    myUrl = Safari.windows[0].currentTab.url()


    Chrome.activate()


    newWindow = Chrome.Window().make();


    newWindow.tabs.push(Chrome.Tab({url: myUrl }));

    ```


    This script is designed to interact with both Safari and Google Chrome web browsers
    on a Mac using JavaScript for Automation (JXA). Here''s a step-by-step breakdown
    of what it does:


    1. **Initialize Application Objects for Safari and Chrome**: The script starts
    by creating application objects for both Safari (`Application(''Safari'')`) and
    Google Chrome (`Application(''Google Chrome'')`). These objects allow the script
    to control and interact with each browser.

    2. **Retrieve the Current URL from Safari**: It then retrieves the URL of the
    current tab in the frontmost window of Safari using `Safari.windows[0].currentTab.url()`.
    This assumes Safari is running and has at least one window open with an active
    tab.

