    \n# Create a Playlist Image with AI\n\nA recent update to Apple Music contained\
    \ an odd surprise. In the past, when a new playlist as created, the cover art\
    \ for the first four albums is used to create the \"cover\" for the playlist.\
    \ One could control the cover art used by putting the four songs that featured\
    \ the desired cover art at the first of the list. But the update completely took\
    \ this away and offered some particularly ugly pre-made images as choices, except\
    \ for the option of adding an image from a file or the phot library. To do this\
    \ after making a new playlist was cumbersome, so I used shortcuts to streamline\
    \ it in two ways. First using the website OpenArt.ai to create an image\n\nto\
    \ use:\n\n![](OEBPS/image_rsrc17A.jpg)\n\n# ![](OEBPS/image_rsrc17B.jpg)\n\nThe\
    \ images show parts of a macOS Shortcut named \"Use AI To Get Playlist Art\".\
    \ This shortcut is designed to help you create artwork for a music playlist with\
    \ a specific style in mind. Here's how it works:\n\n1. The shortcut begins with\
    \ an action to continue receiving input if there is no direct input from the Share\
    \ Sheet.\n2. A `Dictionary` action is used to define a list of styles that can\
    \ be chosen to determine the type of artwork you want to create. The options provided\
    \ include \"Comic\" for Comic Book style, \"Art Nouveau,\" \"Gothic,\" \"Picasso\"\
    \ (likely substituting for a more abstract style), \"California,\" \"Sixties,\"\
    \ and \"Movie\". You can also add more styles to this dictionary.\n3. The `'Choose\
    \ from Dictionary` action allows you to pick one of these styles.\n4. Then, the\
    \ shortcut asks for text input with a prompt, presumably to receive more specific\
    \ details or preferences for the artwork.\n5. The selected item from the dictionary\
    \ (the chosen style) and the provided input text are combined into a single text\
    \ block.\n6. This text block is copied to the clipboard.\n7. A URL is created,\
    \ pointing to `https://www.openart.ai/create`.\n8. The shortcut opens this URL,\
    \ where the combined text block, which contains the style and any additional input,\
    \ could be used to generate playlist art using AI.\n\nTo use the shortcut:\n-\
    \ Run the shortcut and choose a style from the predefined list.\n- Input any additional\
    \ details when prompted.\n- The shortcut will copy the combined text to your clipboard\
    \ and navigate to the openart.ai website, where you can use the copied text to\
    \ instruct an AI to generate playlist artwork in the chosen style.\n\n# Find a\
    \ Playlist Image with Google\n\nSecond, to use Google to search for an image suitable\
    \ for use as a playlist cover. At the playlist, touch the three dots to get the\
    \ share sheet. Select the name of the Shortcut. If a song is playing, the Shortcut\
    \ will immediately use the `Album name`, `Song Title`, and `Artist` of the `Current\
    \ Song` as search terms, otherwise it will present an audio input to give the\
    \ search terms by voice:\n\n![](OEBPS/image_rsrc17C.jpg)\n![](OEBPS/image_rsrc17D.jpg)\n\
    \nHere's the breakdown and description of each step as shown:\n\n1. The shortcut\
    \ begins with receiving images and other input from the Share Sheet. If there's\
    \ no input, it will continue.\n2. It retrieves the `'Current Song'` details from\
    \ Apple Music.\n3. Using the details of the `'Current Song'`, it gets the `'Album'`,\
    \ `'Artist'`, `'Lyrics'`, and `'Title'`.\n4. An `'If'` condition checks if the\
    \ `'Title'` of the song has any value.\n   - If the `'Title'` has a value, it\
    \ constructs a text command to find an image related to the song's `'Artist'`,\
    \ `'Album'`, and `'Title'`.\n   - The text is then URL encoded, and this URL-encoded\
    \ text is saved into a variable named `'Choice'`.\n5. If the `'Title'` does not\
    \ have a value, the shortcut allows you to dictate text, which is then URL encoded\
    \ and saved into the `'Choice'` variable.\n6. After the `'If'` condition ends,\
    \ the shortcut constructs a Google search URL with the `'Choice'` variable to\
    \ look for images related to the input or dictated information.\n7. Finally, it\
    \ opens the constructed URL.\n\nTo use this shortcut, you would select a song\
    \ in Apple Music, share it to this shortcut, and it would then help you find related\
    \ images online, presumably to create playlist artwork or for similar purposes.\n\
    \n![](OEBPS/image_rsrc17E.jpg)\n"
