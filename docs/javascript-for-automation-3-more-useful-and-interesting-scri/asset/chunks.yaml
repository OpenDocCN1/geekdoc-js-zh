    \ The script switches focus to the Safari web app version of ChatGPT, preparing\
    \ to input the copied text.\n8. **Keyboard Strokes for Input**: It simulates keyboard\
    \ shortcuts to ensure the text input area is focused and then pastes the clipboard\
