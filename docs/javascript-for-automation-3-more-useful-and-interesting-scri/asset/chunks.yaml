  trans: "\n\n/ 一旦 ChatGPT 返回索引，可以使用 Shift-command-down 进行复制。在此系统中，不同的部分将以不同的格式返回。这是聊天回复具有不确定性的一部分。文本将需要被编译和重新格式化。\
    \ /\n\n此脚本集成了用于自动化的 JavaScript (JXA)，用于 Mac 上的不同应用程序之间执行一系列任务，特别针对 Pages、运行 ChatGPT\
    \ 网页版版本的 Safari，并利用系统事件（System Events）进行自动化。\n\n以下是该脚本执行内容的逐步说明：\n\n1. **访问 Pages\
    \ 应用程序**：脚本通过创建一个对象来与 Pages 应用程序交互，允许其对 Pages 文档进行操作并检索数据。\n2. **作为 Safari 网页应用访问\
    \ ChatGPT**：随后，它设置一个对象，通过在 Safari 中打开的网页应用版本与 ChatGPT 交互，表示有意将数据发送到 ChatGPT 进行处理。\n\
    3. **用于按键模拟的系统事件**：通过创建 `System Events` 对象，脚本可以模拟键盘输入，这种方法通常用于自动化处理脚本环境中没有直接 API\
    \ 支持的交互。\n4. **剪贴板访问**：它准备让当前应用程序（脚本本身）包含标准添加项，这对于与系统剪贴板交互以复制和粘贴数据是必要的。\n5. **从\
    \ Pages 文档检索内容**：脚本访问 Pages 中打开的第一个文档，并开始循环从指定的起始页读取正文文本，此处假设起始页为第三页（`startingPage\
    \ = 3`），并持续两页。它将这些内容与递增的页码合并成单个字符串，并在前面加上自定义消息（`\"使用提供的页码对文本进行索引：\"`）。\n6. **将数据复制到剪贴板**：编译后的字符串（现在包含了指定页面的文本及其相应的页码）被复制到剪贴板。\n\
    7. **激活 ChatGPT 网页应用**：脚本切换焦点到 Safari 网页应用版本的 ChatGPT，准备输入复制的文本。\n8. **用于输入的按键**：它模拟快捷键以确保输入区域获得焦点，然后通过模拟\
    \ `CMD+V`（粘贴）操作将剪贴板内容粘贴到 ChatGPT 输入字段。\n9. **提交查询**：最后，脚本模拟按下回车键将查询提交给 ChatGPT。\n\
    \n一旦 ChatGPT 处理了提交的文本，用户将手动处理响应。“Index Master”是一个专为文档索引设计的自定义 ChatGPT 模型。\n\n\
    这种自动化可以是大型文档管理工作流的一部分，通过 ChatGPT 的处理能力实现 Pages 文档文本索引的自动化。该脚本巧妙地使用 JXA 弥了了应用程序与网络服务之间的差距，展示了\
    \ macOS 上自动化的多功能性。\n\n# ￼![DALL·E 2024-03-03 17.07.04 - 一幅有趣的黑白线条卡通画，捕捉了一个正在走动和说话的\
    \ Macintosh iMac，具有俏皮且夸张的角色设计。jpeg](img/image_rsrc16W.jpg)\n\n# 从 JXA 调用 Python\
    \ 脚本以接口 OpenAI API\n\n此脚本由两个部分组成：用于 macOS 的 JXA（用于自动化的 JavaScript）代码段和一个 Python\
    \ 脚本。让我们对每个部分进行注释以便说明。\n\n### JXA 代码说明\n\n1. **初始化**：\n```\napp = Application.currentApplication()\n\
    app.includeStandardAdditions = true\n```\n- `Application.currentApplication()`\
    \ 初始化当前脚本以使用 macOS 的脚本功能。\n- `app.includeStandardAdditions = true` 启用使用显示对话框、运行\
    \ shell 脚本等标准命令。\n\n2. **显示对话框**：\n```\nresponse = app.displayDialog(\"Prompt?\"\
    , {defaultAnswer: 'a cat in shades of blue'})\n```\n- `app.displayDialog` 向用户显示一个对话框。在这里，它问了一个问题（“Prompt?”）并提供了一个默认答案（“蓝色调的猫”）。\n\
    \n3. **获取用户输入**：\n```\nparameter = response.textReturned\n```\n- `response.textReturned`\
    \ 从对话框获取用户输入的文本。\n\n4. **准备 Shell 命令**：\n```\ncommand = \"/usr/local/bin/python\
    \ ~/openaiapi/inp.py '\" + parameter + \"'\"\n```\n- 构建一个运行位于 `~/openaiapi/inp.py`\
    \ 的 Python 脚本的命令。用户的输入（`parameter`）将作为参数传递给该脚本。\n\n5. **执行 Shell 命令**：\n```\n\
    theTry = app.doShellScript(command)\n```\n- `app.doShellScript` 在 shell 中执行构建的命令。\n\
    \n6. **打开 URL**：\n```\napp.openLocation(theTry)\n```\n- `app.openLocation` 打开一个\
    \ URL。在这里，预计 Python 脚本返回一个 URL 作为输出，然后将其打开。\n\n### Python 代码说明\n\n1. **导入**：\n\
    ```python\nfrom openai import OpenAI\nimport webbrowser\nimport sys\n```\n- 导入必要的模块：用于与\
    \ OpenAI API 交互的 `openai`，用于打开 URL 的 `webbrowser` 以及用于处理命令行参数的 `sys`。\n\n2. **初始化\
    \ OpenAI 客户端**：\n```python\nclient = OpenAI(api_key='OPEN-AI KEY)\n```\n- 使用特定的\
    \ API key 初始化 OpenAI 。\n\n3. **命令行参数处理**：\n```python\nif len(sys.argv) > 1:\n\
    \    parameter = sys.argv[1]\nelse:\n    parameter = \"A cat in a hat\"  # 如果未提供参数的默认值\n\
    - 检查是否提供了命令行参数（来自 JXA 脚本）。如果没有，则使用默认值。\n\n4. **图像生成请求**：\n```python\nresponse\
    \ = client.images.generate(\n    model=\"dall-e-3\",\n    prompt=parameter,\n\
    \    size=\"1024x1024\",\n    quality=\"standard\",\n    n=1,\n)\n```\n- 调用 OpenAI\
    \ 的 DALL-E 3 模型，根据提供的提示词（`parameter`）生成图像。指定图像大小、质量和图像数量（在此情况下为 1）。\n\n5. **检索图像\
    \ URL**：\n```python\nimage_url = response.data[0].url\n```\n- 从响应中提取生成图像的 URL。\n\
    \n6. **在网页浏览器中打开图像**：\n```python\nwebbrowser.open(image_url)\n```\n- 在默认网页浏览器中打开图像\
    \ URL。\n\n### 整体流程\n\n- JXA 脚本提示用户输入，带输入作为参数运行 Python 脚本，并期望返回 URL。\n- Python\
    \ 脚本使用 OpenAI API 根据输入生成图像，并在网页浏览器中打开生成的图像。\n\n使用名为 \"JXA Helper\" 的自定义 GPT\n\n\
    ￼![](img/image_rsrc16X.jpg)\n\n# 查询 Google Gemini API\n\n```javascript\napp =\
    \ Application.currentApplication()\napp.includeStandardAdditions = true\nbebe\
    \ = Library('bebe')\nprompt = \"make list of ways to research javescript language\"\
    \ncommand = `curl -H 'Content-Type: application/json' -d '{\"contents\":[{\"parts\"\
    :[{\"text\":\"${prompt}\"}]}]}' -X POST https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=API-KEY`\n\
    \ntry {\n    jsonObj = app.doShellScript(command)\n    obj = JSON.parse(jsonObj)\n\
    \    geminiText = obj.candidates[0].content.parts[0].text\n} catch (error) {\n\
    \    response = app.displayAlert(error.message, {\n        message: error.message,\n\
    \        as: 'critical'\n    })\n}\n\nbebe.newBBDocWithText ('JSON',geminiText)\n\
    ```\n\n脚本与外部 API 交互，解析响应，然后使用库创建一个新文档。以下是该脚本执行内容的逐步说明：\n\n1. **初始化应用程序对象**：它通过创建当前应用程序的实例（`Application.currentApplication()`）并启用标准\
    \ OS 添加项，如显示警报或运行 shell 脚本（`app.includeStandardAdditions = true`）。\n2. **导入库**：导入一个名为\
    \ 'bebe' 的库（`Library('bebe')`）。该库在脚本后部分用于创建新文档，表明它提供了某些文档管理功能。\n3. **准备 API 调用**：设置变量\
    \ `prompt`，文本为“make list of ways to research javascript language”（列出研究 javascript\
    \ 语言的方法）。这是将发送到外部服务的数据。\n"
