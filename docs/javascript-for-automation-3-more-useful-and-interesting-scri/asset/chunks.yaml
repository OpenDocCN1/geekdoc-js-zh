    # 从长播放列表中提取 AI 选取的较短播放列表


    Apple Music 允许创建包含数千首歌曲的超级播放列表。当你拥有一个包含数千首歌曲的播放列表时，能够生成多少个特定长度的独特播放列表是非常惊的。最棒的部分是将超级播放列表设置为随机播放，每次都能获得独特的列表。但较大的脚本可以作为歌曲池。此脚本使用
    AI 根据预设标准挑选歌曲。


    此脚本是一个复杂的自动化工具，旨在简化 macOS 上 Music 应用程序中的播放列表管理。利用 JavaScript 自动化（JXA）的力量，脚本集成了多个
    macOS 应用程序和功能，通过自动化与播放列表策划相关的重复任务来提高用户效率。


    脚本首先初始化关键 macOS 应用程序：Music、ChatGPT、System Events 和当前应用程序。这种设置确保了脚本能够与这些应用程序无缝交互，利用它们的全部功能。标准组件的引入进一步扩展了脚本的功能，允许进行更复杂的操作。


    脚本的一个主要功能是能够验证 Music 应用程序中是否存在指定的播放列表。此初始检查确保脚本在正确的数据集上运行，防止错误并提高可靠性。如果未找到指定的播放列表，脚本将记录相应的错误消息并停止后续执行，为用户提供清晰的反馈。


    一旦确认了播放列表，脚本将继续提取轨道信息。它系统地收集播放列表中的歌曲名称，并将这些数据格式化为 CSV 字符串。这一步为后续处理准备了轨道信息，确保数据结构化以便于操作和分析。


    然后，脚本为 ChatGPT 构建了一个详细的提示词，要求它从提供的列表中选择 25 首最有趣的歌曲。该提示词被复制到剪贴板，并激活 ChatGPT 处理请求。通过一系列模拟按键操作，脚本与
    ChatGPT 交互，粘贴提示词、发送请求并检索响应。这种对 ChatGPT 的创新用法凸显了脚本将高级 AI 工具纳入决策过程的能力。


    收到 ChatGPT 的响应后，脚本将处理歌曲列表，精炼数据以移除任何不必要的元素。它记录最终的歌曲列表，为被选中的项目提供透明视图。随后，脚本会在 Music
    应用程序中创建一个新的播放列表，并进行命名以反映其来源，并将选中的歌曲复制到此新播放列表中。此功能展示了脚本不仅能够策划，还能有效地组织和管理音乐收藏。


    本质上，此脚本体现了 JavaScript 自动化与 macOS 应用程序之间强大的协同作用。通过自动化复杂的播放列表管理过程，它节省了精力，让用户能够专注于享受音乐，而不是被行政任务所困。ChatGPT
    的集成进一步增强了它的实用性，展示了利用 AI 进行实际日常应用的前瞻性方法。


