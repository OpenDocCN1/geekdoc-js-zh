    \n- 前言\n- 在脚本编辑器中使用 OpenAI API 生成 JXA 代码\n- 通过 GPT 进行 Mp4 音频转文字记录\n- 使用自定义 GPT\
    \ 为 Pages 文档创建索引的脚本\n- 从 JXA 调用 Python 脚本以接口 OpenAI API\n- 查询 Google Gemini API\n\
    - 为照片库中的选中图像添加关键词\n- 显示文件的 Spotlight 信息\n- 将 Numbers 表格数据转换为 JSON\n- 使用名为 \"JXA\
    \ Helper\" 的自定义 GPT\n- 在 Filemaker 中调用 Google API 进行研究\n- 将页面从 Safari 传输到 Google\
    \ Chrome\n- 从较长的播放列表提取 AI 挑选的较短播放列表\n- 客户支持\n- 快捷指令\n- 生成二维码\n- 选择照片并将提取提取到笔记中\n\
    - 创建一个带有可更改题目的测验\n- 使用 AI 创建播放列表图像\n- 通过 Google 查找播放列表图像\n\n# 前言\n\n在本书系列的第一本回顾计算机“脚本化”历史时，我对\
    \ Python 的提及寥寥无几，我希望在本系列的第三作中弥补这一遗憾。\n\n## Python 作为一种脚本语言\n\nPython 是一种高级解释型编程语言，以其简单、可读性和多功能性著称。作为一种脚本语言，Python\
    \ 在自动化任务、处理系统管理和集成软件组件方面表现出色。以下是 Python 成为脚本理想选择的概述：\n\n### Python 的核心特性\n\n1.\
    \ **易于学习和使用**：\n   - Python 的语法清晰直观，初学者也能上手。它的代码易于阅读和编写，降低了学习曲线并提高了生产力。\n2. **解释型语言**：\n\
    \   - Python 是一种解释型语言，意味着代码按行执行，允许即时反馈和快速开发周期。这一特性使得调试和测试脚本更加高效。\n3. **跨平台兼容性**：\n\
    \   - Python 脚本可以在包括 Windows、macOS 和 Linux 在各种操作系统上运行，无需修改。这种跨平台的特性确保了 Python\
    \ 脚本具有高度的可移植性。\n4. **丰富的标准库**：\n   - Python 拥有全面的标准库，为各种任务（如文件处理、系统操作、互联网协议和数据处理）提供了许多模块和函数。这一丰富的库减少了从零开始编写代码的需求。\n\
    5. **庞大且活跃的社区**：\n   - Python 拥有庞大且活跃的用户社区，贡献了大量的第三方模块和包。这个生态系统支持从 Web 开发、数据分析到机器学习和自动化的各种应用。\n\
    6. **集成能力**：\n   - Python 可以轻松与其他语言和工具集成，使其成为多环境中脚本编写的通用功能选择。它可以与 `C/C++`、`Java`\
    \ 以及其他编程语言交互，以及各种 API 和 Web 服务。\n7. **自动化与脚本**：\n   - Python 广泛用于自动化重复任务，如文件操作、数据提取和批量处理。它用极少代码编写复杂工作流的能力使其成为系统管理员和开发者的强大工具。\n\
    8. **面向对象与函数式编程**：\n   - Python 支持面向对象和函数式编程范式。这种灵活性允许开发者根据特定需求选择最佳方法，增强了代码的可重用性和维护性。\n\
    \n### Python 脚本的应用\n\n- **系统管理**：自动化例行任务、管理系统配置和监控系统健康。\n- **网络爬虫**：从网站提取数据以进行分析或与其他系统集成。\n\
    - **数据分析**：使用 `pandas` 和 `NumPy` 等库处理和分析大型数据集。\n- **Web 开发**：使用 `Django` 和 `Flask`\
    \ 等框架构建 Web 应用。\n- **软件测试自动化**：编写测试脚本以自动化应用程序的测试。\n- **任务自动化**：自动化工作流，例如文件的批量处理、发送电子邮件和与\
    \ API 交互。\n\nPython 简单性、多功能性和强大库的结合使其成为脚本的极佳选择。无论你是寻求自动化小任务的初学者，还是构建复杂自动化脚本的资深开发者，Python\
    \ 都能提供高效完成工作所需的工具和支持。\n\n## SwiftUI - 未来之？\n\n这并不是科学的论断，更像是一种思考。我花了一些时间研究 `SwiftUI`，在某些方面我认为它可能主宰一切。\n\
    \n# 在脚本编辑器中使用 OpenAI API 生成 JXA 代码\n\n在本章中，我们将探索将 JavaScript for Automation (JXA)\
    \ 与 OpenAI API 集成的实用示例。目标是创建一个与 OpenAI 强大的 `GPT-3.5` 模型交互的自动化脚本，通过先进的 AI 洞察增强\
    \ Mac 用户的脚本能力。\n\n### 准备工作\n\n我们首先初始化 JXA 环境并设置必要的应用程序。脚本利用 `Script Editor` (`se`)\
    \ 应用程序进行脚本的执行和操作，并结合当前应用上下文（`app`）利用标准脚本插件。\n\n```javascript\nconst se = Application(\"\
    Script Editor\");\n\nconst app = Application.currentApplication();\n\napp.includeStandardAdditions\
    \ = true;\n```\n\n### 定义用户交互\n\n我们脚本的核心在于 `getPresetsText` 函数，该函数旨在向用户显示包含预设选项的对话框。这些预设从代码重写到注释生成，反映了用户可能想要自动化的典型脚本任务。\n\
    \n```javascript\nfunction getPresetsText() {\n\n// 预设选项数组\n\nconst presets = [\"\
    1 - Rewrite this code to be more efficient\",\n```\n\n"
- fmt: "\n```javascript\n\"2 - Continue this code\",\n\"3 - Write a function with\
    \ this code\",\n\"4 - Write comments for this code\"];\n\n// Displaying the dialog\
    \ and capturing user input\n\nconst response = app.displayDialog(presets.join('\\\
    n'), {\n  defaultAnswer: '4'\n});\n\n// Parsing the user's choice and returning\
    \ the corresponding preset text\n\nconst inputNumber = parseInt(response.textReturned);\n\
    \nreturn presets[inputNumber - 1] || \"Invalid input\";\n\n}\n```\n\n## Preparing\
    \ the Code for Submission\n\nTo ensure the code is suitable for processing by\
    \ the OpenAI API, a `cleanString` function is implemented. This function tidies\
    \ up the string by replacing newline and tab characters with spaces, making it\
    \ more suitable for API transmission.\n\n```javascript\nfunction cleanString(inputString)\
    \ {\n  return inputString.replace(/[\\n\\t]/g, ' ');\n}\n```\n\n## Handling User\
    \ Selection\n\nThe script then checks if the user has selected any text in the\
    \ Script Editor. If not, it prompts the user to input the type of code they wish\
    \ to generate. If there is a selection, it uses the `getPresetsText` function\
    \ to determine the user's intention and prepares the selected text for API interaction.\n\
    \n## Crafting the API Request\n\nThe prepared text is then encoded for safe transmission\
    \ and incorporated into a `curl` command, formatted as a JSON payload. This command\
    \ is designed to interact with OpenAI's GPT-3.5 model, sending a request that\
    \ includes the user's intent and the selected or inputted code.\n\n```javascript\n\
    const command = `curl https://api.openai.com/v1/chat/completions ...`;\n```\n\n\
    ## Error Handling and Response Processing\n\nThe script executes the `curl` command\
    \ and parses the JSON response from the OpenAI API. It handles potential errors\
    \ gracefully, ensuring robust script performance. The received response, potentially\
    \ containing AI-generated code or comments, is then inserted back into the Script\
    \ Editor, completing the integration loop.\n\n```javascript\ntry {\n  // Execution\
    \ and parsing of the API response\n  const jsonObj = app.doShellScript(command);\n\
    \  const obj = JSON.parse(jsonObj);\n\n  // Inserting the AI-generated content\
    \ back into the Script Editor\n  const thisMessage = obj.choices[0].message.content\
    \ + '\\n\\n';\n\n  se.documents[1].selection.contents = thisMessage;\n} catch\
    \ (error) {\n  // Error handling\n  console.error(\"An error occurred: \", error);\n\
    }\n```\n\nThis example showcases the seamless integration of JXA with OpenAI's\
    \ API, demonstrating how Mac automation scripts can be elevated with AI-driven\
    \ capabilities. Through this integration, users can harness the power of GPT-3.5\
    \ to automate, enhance, and even generate new JavaScript code, right from their\
    \ Mac.\n\n# Mp4 Audio Transcription via GPT\n\nThis script is designed to automate\
