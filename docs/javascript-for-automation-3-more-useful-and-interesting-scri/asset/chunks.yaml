    # 将页面从 Safari 传输到 Google Chrome


    ```javascript

    Safari = Application(''Safari'')


    Chrome = Application(''Google Chrome'')


    myUrl = Safari.windows[0].currentTab.url()


    Chrome.activate()


    newWindow = Chrome.Window().make();


    newWindow.tabs.push(Chrome.Tab({url: myUrl }));

    ```


    此脚本旨在使用 JavaScript 自动化（JXA）与 Mac 上的 Safari 和 Google Chrome 浏览器交互。以下是其操作的逐步拆解：


    1. **初始化 Safari 和 Chrome 的应用对象**：脚本首先为 Safari (`Application(''Safari'')`）和 Google
    Chrome (`Application(''Google Chrome'')`）创建应用对象。这些对象允许脚本控制并与每个浏览器交互。

    2. **从 Safari 获取当前 URL**：然后使用 `Safari.windows[0].currentTab.url()` 获取 Safari 前台窗口当前标签页的
    URL。这假设 Safari 正在运行并且至少有一个打开的活动标签页。

    3. **激活 Google Chrome**：脚本激活 Google Chrome 将将其置于顶，使其成为屏幕上的活动应用程序。

    4. **在 Chrome 中创建新窗口**：使用 `Chrome.Window().make();` 在 Google Chrome 中创建一个新窗口。此命令有效地打开了一个新的
    Chrome 窗口。

    5. **在 Chrome 中打开 Safari 的 URL**：最后，脚本在新创建的 Chrome 窗口中创建一个标签页，将其 URL 设置为之前从 Safari
    当前标签页获取的 URL。这是通过 `newWindow.tabs.push(Chrome.Tab({url: myUrl }));` 实现的。


    此脚本将 Safari 当前活动标签页的 URL 传输到 Google Chrome 新窗口的新标签页中，有效地跨浏览器复制标签。这对于需要使用多个浏览器并在它们之间移动会话或特定页面的用户特别有用。


    对于那些大部分时间使用 Safari，但偶尔使用 Google Chrome 访问整个 Safari 生态系统之外网站的人来说，这非常方便。我设置了可以在
    Microsoft Edge 之间发送 URL 的脚本，以便在我出于某种原因使用该浏览器时。


