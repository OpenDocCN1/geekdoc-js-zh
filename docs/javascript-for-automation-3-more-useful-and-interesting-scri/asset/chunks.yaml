    # Customer Support


    I wanted to make a JXA (JavaScript for Automation) script for find and replace
    in BBEdit. I have a decent amount of success at figuring the right translation
    and the more you do it, the better you get. But somehow, I could not get the find
    method or the replace method to work in a JXA script. No matter how I tweaked
    the syntax, I only was able to get errors and unusual results. As is usually the
    case, there are other possible ways to do the task.


    First, I could just stick with the AppleScripts I have that do the job very well.
    Here is one that cleans up some text scraped from a web page:


    tell application "BBEdit"


    replace "\\." using "" searching in selection of text 1 of text document 1 options
    {search mode:grep, starting at top:true}


    replace "\\-" using "" searching in selection of text 1 of text document 1 options
    {search mode:grep, starting at top:true}


    replace "''" using "" searching in selection of text 1 of text document 1 options
    {search mode:grep, starting at top:true}


    replace "é" using "e" searching in selection of text 1 of text document 1 options
    {search mode:grep, starting at top:true}


    replace "ú" using "u" searching in selection of text 1 of text document 1 options
    {starting at top:true, case sensitive:true}


    replace "\\n" using "," searching in selection of text 1 of text document 1 options
    {starting at top:true, case sensitive:true}


    replace " " using "" searching in selection of text 1 of text document 1 options
    {starting at top:true, case sensitive:true}


    end tell


    Second, I can call this script from within a JXA script using "doShellScript"
    to do the replace:


    app = Application.currentApplication();


    app.includeStandardAdditions = true;


    result = app.doShellScript("osascript /users/scripts/removecaret.scpt")'
