  trans: "\n2. 随后，快捷指令从此 JSON 格式的文本中提取出一个字典。\n3. 它进入一个重复循环，遍历字典中的每个项目。\n4. 对于每个项目（每对问题和回答对），它会从当前重复项中获取键\
    \ `'category'` 的值（尽管这一步在后续操作中似乎没有进一步的用途）。\n5. 然后，它从重复项中获取键 `'question'` 的值。\n\
    6. 随后，通过 `'Show alert'` 动作向用户显示问题。\n7. 之后，它从重复项中获取键 `'answer'` 的值。\n8. 该答案也会通过\
    \ `'Show alert'` 动作显示给用户。\n9. 在处理字典中的所有项目后，循环结束。\n\n如何使用该快捷指令：\n- 运行“Monarchy\
    \ Quiz”快捷指令。\n- 阅读弹窗中显示的问题并思考你的答案。\n- 忽略问题弹窗，在下一个弹窗中查看正确答案。\n- 对测验中的每个问题重复此过程，直到所有问题都回答完毕。\n\
    \n此快捷指令是一种向用户展示一系列问题和答案的简单方法，可能用于教育或娱乐目的。\n\n# 使用 AI 创建播放歌列表图像\n\nApple Music\
    \ 最近的一次更新包含了一个意想不到的惊喜。过去，当创建一个新的播放歌列表时，使用前四张专辑的封面图来创建播放歌列表的“封面”。用户可以通过包含所需封面的四首歌曲放在列表开头来控制所使用的封面图。但这次更新完全取消了这个功能，并提供了一些特别难看的预制图像作为选择，除非选择从文件或照片库中添加图像。在创建新播放歌列表后这样做非常麻烦，因此我使用了快捷指令通过两种方式来简化它。首先是使用\
    \ OpenArt.ai 网站创建图像\n\n用法：\n\n![](img/image_rsrc17A.jpg)\n\n# ![](img/image_rsrc17B.jpg)\n\
    \n图片显示了一个名为“Use AI To Get Playlist Art”的 macOS 快捷指令。该快捷指令旨在帮助你为特定风格的音乐播放歌列表创建艺术。其工作原理如下：\n\
    \n1. 快捷指令开始，如果没有来自共享表的直接输入，则继续接收输入。\n2. 使用 `Dictionary` 动作定义一个样式列表，可以通过选择这些样式来确定你想创建的艺术类型。提供的选项包括用于漫画风格的“Comic”、“新艺术（Art\
    \ Nouveau）”、“哥特（Gothic）”、“Picasso（毕加，可能是替代更抽象的风格）”、“California”、“Sixties（六十年代）和“Movie”。你也可以向此字典中添加更多样式。\n\
    3. `'Choose from Dictionary` 动作允许你选择这些样式中的一种。\n4. 随后，快捷指令会提示输入文本，可能是为了接收关于艺术更具体的细节或偏好。\n\
    5. 从字典中选定的项目（所选样式）和提供的输入文本合并成单个文本块。\n6. 该文本块被复制到剪贴板。\n7. 创建一个指向 `https://www.openart.ai/create`\
    \ 的 URL。\n8. 快捷指令打开此 URL，包含样式和任何额外输入的合并文本块可以在此处使用 AI 生成播放歌列表封面。\n\n如何使用该快捷指令：\n\
    - 运行快捷指令并从预定义列表中选择样式。\n- 在提示时输入任何额外细节。\n- 快捷指令将合并后的文本复制到你的剪贴板，并导航到 openart.ai\
    \ 网站，你可以在那里使用复制的文本指示 AI 生成所选风格的播放歌列表封面。\n\n# 使用 Google 查找播放歌列表图像\n\n其次，使用 Google\
    \ 搜索适合作为播放歌列表封面的图像。在播放歌列表界面，点击三个点获取共享表。选择快捷指令名称。如果正在播放歌曲，快捷指令将立即使用 `Current Song`\
    \ 的 `Album name`、`Song Title` 和 `Artist` 作为搜索词，否则它将提供音频输入以语音提供搜索词：\n\n![](img/image_rsrc17C.jpg)\n\
    ![](img/image_rsrc17D.jpg)\n\n以下是所示每个步骤的分解和描述：\n\n1. 快捷指令开始从共享表接收图像和其他输入。如果没有输入，它将继续。\n\
    2. 它从 Apple Music 获取 `'Current Song'` 详情。\n3. 使用 `'Current Song'` 的详情获取 `'Album'`、`'Artist'`、`'Lyrics'`\
    \ 和 `'Title'`。\n4. `'If'` 条件检查歌曲的 `'Title'` 是否有效。\n   - 如果 `'Title'` 有值，构建一个文本命令来寻找与歌曲的\
    \ `'Artist'`、`'Album'` 和 `'Title'` 相关的图像。\n   - 然后对文本进行 URL 编码，并将此 URL 编码文本保存到名为\
    \ `'Choice'` 的变量。\n5. 如果 `'Title'` 没有值，快捷指令允许你口述文本，然后进行 URL 编码并保存到 `'Choice'`\
    \ 变量中。\n6. `'If'` 条件结束后，快捷指令使用 `'Choice'` 变量构建 Google 搜索 URL，以寻找与输入或口述信息相关的图像。\n\
    7. 最后，打开构建的 URL。\n\n要使用此快捷指令，你可以在 Apple Music 中选择一首歌，将其共享到此快捷指令，然后它将帮助你在在线寻找相关图像，可能用于创建播放歌列表封面或类似的目的。\n\
    \n![](img/image_rsrc17E.jpg)\n\n"
