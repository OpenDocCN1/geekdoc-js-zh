- "# JavaScript 自动化：更多实用且有趣的脚本\n\n\n\n![](img/cover.jpeg)\n\n\n\n# 前言\n\n在本书系列的第一本回顾计算机“脚本化”历史时，我对\
  \ Python 的提及寥寥无几，我希望在本系列的第三作中弥补这一遗憾。\n\n## Python 作为一种脚本语言\n\nPython 是一种高级解释型编程语言，以其简单、可读性和多功能性著称。作为一种脚本语言，Python\
  \ 在自动化任务、处理系统管理和集成软件组件方面表现出色。以下是 Python 成为脚本理想选择的概述：\n\n### Python 的核心特性\n\n1. **易于学习和使用**：\n\
  \   - Python 的语法清晰直观，初学者也能上手。它的代码易于阅读和编写，降低了学习曲线并提高了生产力。\n2. **解释型语言**：\n   - Python\
  \ 是一种解释型语言，意味着代码按行执行，允许即时反馈和快速开发周期。这一特性使得调试和测试脚本更加高效。\n3. **跨平台兼容性**：\n   - Python\
  \ 脚本可以在包括 Windows、macOS 和 Linux 在各种操作系统上运行，无需修改。这种跨平台的特性确保了 Python 脚本具有高度的可移植性。\n\
  4. **丰富的标准库**：\n   - Python 拥有全面的标准库，为各种任务（如文件处理、系统操作、互联网协议和数据处理）提供了许多模块和函数。这一丰富的库减少了从零开始编写代码的需求。\n\
  5. **庞大且活跃的社区**：\n   - Python 拥有庞大且活跃的用户社区，贡献了大量的第三方模块和包。这个生态系统支持从 Web 开发、数据分析到机器学习和自动化的各种应用。\n\
  6. **集成能力**：\n   - Python 可以轻松与其他语言和工具集成，使其成为多环境中脚本编写的通用功能选择。它可以与 `C/C++`、`Java`\
  \ 以及其他编程语言交互，以及各种 API 和 Web 服务。\n7. **自动化与脚本**：\n   - Python 广泛用于自动化重复任务，如文件操作、数据提取和批量处理。它用极少代码编写复杂工作流的能力使其成为系统管理员和开发者的强大工具。\n\
  8. **面向对象与函数式编程**：\n   - Python 支持面向对象和函数式编程范式。这种灵活性允许开发者根据特定需求选择最佳方法，增强了代码的可重用性和维护性。\n\
  \n### Python 脚本的应用\n\n- **系统管理**：自动化例行任务、管理系统配置和监控系统健康。\n- **网络爬虫**：从网站提取数据以进行分析或与其他系统集成。\n\
  - **数据分析**：使用 `pandas` 和 `NumPy` 等库处理和分析大型数据集。\n- **Web 开发**：使用 `Django` 和 `Flask`\
  \ 等框架构建 Web 应用。\n- **软件测试自动化**：编写测试脚本以自动化应用程序的测试。\n- **任务自动化**：自动化工作流，例如文件的批量处理、发送电子邮件和与\
  \ API 交互。\n\nPython 简单性、多功能性和强大库的结合使其成为脚本的极佳选择。无论你是寻求自动化小任务的初学者，还是构建复杂自动化脚本的资深开发者，Python\
  \ 都能提供高效完成工作所需的工具和支持。\n\n## SwiftUI - 未来之？\n\n这并不是科学的论断，更像是一种思考。我花了一些时间研究 `SwiftUI`，在某些方面我认为它可能主宰一切。\n\
  \n# 在脚本编辑器中使用 OpenAI API 生成 JXA 代码\n\n在本章中，我们将探索将 JavaScript for Automation (JXA)\
  \ 与 OpenAI API 集成的实用示例。目标是创建一个与 OpenAI 强大的 `GPT-3.5` 模型交互的自动化脚本，通过先进的 AI 洞察增强 Mac\
  \ 用户的脚本能力。\n\n## 准备工作\n\n我们首先初始化 JXA 环境并设置必要的应用程序。脚本利用 `Script Editor` (`se`) 应用程序进行脚本的执行和操作，并结合当前应用上下文（`app`）利用标准脚本插件。\n\
  \n```javascript\nconst se = Application(\"Script Editor\");\n\nconst app = Application.currentApplication();\n\
  \napp.includeStandardAdditions = true;\n```\n\n## 定义用户交互\n\n我们脚本的核心在于 `getPresetsText`\
  \ 函数，该函数旨在向用户显示包含预设选项的对话框。这些预设从代码重写到注释生成，反映了用户可能想要自动化的典型脚本任务。\n\n```javascript\n\
  function getPresetsText() {\n\n// 预设选项数组\n\nconst presets = [\"1 - Rewrite this\
  \ code to be more efficient\",\n```\n\n\n\n\n\n```javascript\n\"2 - Continue this\
  \ code\",\n\"3 - Write a function with this code\",\n\"4 - Write comments for this\
  \ code\"];\n\n// 显示对话框并捕用户输入\n\nconst response = app.displayDialog(presets.join('\\\
  n'), {\n  defaultAnswer: '4'\n});\n\n// 解析用户的选择并返回对应的预设文本\n\nconst inputNumber =\
  \ parseInt(response.textReturned);\n\nreturn presets[inputNumber - 1] || \"Invalid\
  \ input\";\n\n}\n```\n\n## 准备用于提交的代码\n\n为了确保代码适用于 OpenAI API 处理，我们实现了一个 `cleanString`\
  \ 函数。该函数通过将换行符和制表符替换为空格来整理字符串，使其更适合 API 传输。\n\n```javascript\nfunction cleanString(inputString)\
  \ {\n  return inputString.replace(/[\\n\\t]/g, ' ');\n}\n```\n\n## 处理用户选择\n\n脚本随后检查用户是否在脚本编辑器（Script\
  \ Editor）中选择了任何文本。如果没有，它会提示用户输入想要生成的代码类型。如果有选中，它将使用 `getPresetsText` 函数确定用户的意图，并为\
  \ API 交互准备选中的文本。\n\n## 构建 API 请求\n\n准备好的文本将进行编码以确保安全传输，并整合到 `curl` 命令中，格式化为 JSON\
  \ 负载。该命令旨在与 OpenAI 的 GPT-3.5 模型交互，发送一个包含用户意图以及选中或输入代码的。\n\n```javascript\nconst\
  \ command = `curl https://api.openai.com/v1/chat/completions ...`;\n```\n\n## 错误处理与响应处理\n\
  \n脚本执行 `curl` 命令并解析来自 OpenAI API 的 JSON 响应。它能够优雅地处理潜在错误，确保脚本运行的健壮性。收到的响应（可能包含 AI\
  \ 生成的代码或注释）将被插入脚本编辑器，完成集成循环。\n\n```javascript\ntry {\n  // 执行并解析 API 响应\n  const\
  \ jsonObj = app.doShellScript(command);\n  const obj = JSON.parse(jsonObj);\n\n\
  \  // 将 AI 生成的内容插入脚本编辑器\n  const thisMessage = obj.choices[0].message.content +\
  \ '\\n\\n';\n\n  se.documents[1].selection.contents = thisMessage;\n} catch (error)\
  \ {\n  // 错误处理\n  console.error(\"An error occurred: \", error);\n}\n```\n\n此示例展示了\
  \ JXA 与 OpenAI API 的无缝集成，演示了 Mac 自动化脚本如何通过 AI 驱动的能力得到提升。通过这种集成，用户可以直接在 Mac 上利用 GPT-3.5\
  \ 的力量来自动化、增强甚至生成新的 JavaScript 代码。\n\n# 通过 GPT 进行 Mp4 音频转录\n\n该脚本旨在自动化涉及视频文件转换和音频转录的任务序列，使用了\
  \ Apple 的 JavaScript 自动化（JXA）以及 FFmpeg 和 OpenAI API 等外部工具。以下是脚本的逐步说明，并带有解释每个部分的注释：\n\
  \n### 1. 初始化 JXA 对象\n```javascript\napp = Application.currentApplication()\napp.includeStandardAdditions\
  \ = true\n```\n- 初始化当前脚本的 `Application` 对象并包含标准脚本扩展，允许使用对话框、文件选择对话框等。\n\n### 2.\
  \ 转义特殊字符的函数\n```javascript\nfunction escapeCharacters(str) {\n  return str.replace(/~/g,\
  \ '\\\\~').replace(/&/g, '\\\\&');\n}\n```\n- 定义函数 `escapeCharacters` 用于转义字符串中的特殊字符（`~`\
  \ 和 `&`）。这对于清理将用于 shell 命令的文件路径或字符串非常有用。\n\n### 3. 文件选择对话框\n```javascript\nfilePath\
  \ = app.chooseFile({withPrompt:\"Choose an MP4 or M4v Movie file\"})\ninFile = filePath.toString()\n\
  ```\n- 打开文件对话框，要求用户选择一个 MP4 或 M4v 电影文件。选的文件路径被转换为字符串。\n\n### 4. 提取文件名并准备输出路径\n```javascript\n\
  filePathParts = inFile.split('/')\nfileName = filePathParts[filePathParts.length-1].split('.')\n\
  outFile = `/users/homefolder/${fileName[0]}.mp3`\n```\n- 将选中的文件路径拆分（以 `/` 分隔），提取文件名，并在用户目录下准备一个带有\
  \ `.mp3` 扩展名的输出文件路径。\n\n### 5. 用于提取音频的 FFmpeg 命令\n```javascript\ncommand = `/usr/local/bin/ffmpeg\
  \ -i ${inFile} ${outFile}`\nresponse = app.doShellScript(command)\n```\n- 构建命令使用\
  \ FFmpeg 从选定的视频文件中提取音频并将其保存为 MP3 文件。使用 `doShellScript` 执行该命令。\n\n### 6. 显示对话框并等待用户\n\
  ```javascript\nholder = app.displayDialog(\"Wait\")\n```\n- 显示带有“Wait”消息的对话框。这可能是为了在继续之前等待用户确认的占位符。这里可以根据典型的处理速度设计一个计时，推延迟转录直到\
  \ ffmpeg 完成其工作。\n\n### 7. 检查用户响应并继续\n```javascript\nif (holder.buttonReturned ===\
  \ \"OK\"){\n  // API 调用和转录逻辑\n} else {\n  app.displayAlert(\"No\")\n}\n```\n- 检查用户是否在对话框中点击了“OK”。如果没有，则显示带有“No”消息的警告。\n\
  \n### 8. 用于转录的 API 调用\n```javascript\ncommand = \"curl --request POST --url https://api.openai.com/v1/audio/transcriptions\
  \ \" +\n\"--header 'Authorization: Bearer $OPEN-API-KEY' \" +\n\"--header 'Content-Type:\
  \ multipart/form-data' \" +\n\"--form file=@\" + outFile + \" --form model=whisper-1\"\
  ;\n\ntry {\n  jsonObj = app.doShellScript(command);\n  obj = JSON.parse(jsonObj);\n\
  \  console.log(obj.text)\n} catch (error) {\n  console.log(\"An error occurred:\
  \ \" + error);\n}\n\napp.setTheClipboardTo(obj.text)\n```\n- 构建 `curl` 命令向 OpenAI\
  \ 音频转录 API 发送 POST 请求，使用生成的 MP3 文件。\n- 脚本尝试执行命令、解析 JSON 响应并将转录打印到控制台。\n- 如果成功，转录将被复制到剪贴板。如果发生错误，则记录错误信息。\n\
  \n此脚本要求用户已安装 FFmpeg 可以在 `/usr/local/bin/ffmpeg` 访问，并假设 OpenAI API 令牌直接在脚本中或通过其他方式提供。脚本未对文件选择或\
  \ FFmpeg 命令执行进行错误检查，因此假设这些操作是成功的。此外，API 令牌必须包含在脚本中，以便转录 API 调用能够正常工作。\n\n# ￼![DALL·E\
  \ 2024-03-03 17.17.29 - A playful and imaginative black and white line cartoon drawing\
  \ that features a walking and talking Macintosh iMac, personified with arms and\
  \ legs, sit.jpeg](img/image_rsrc16V.jpg)\n\n# 使用自定义 GPT 为 Pages 文档创建索引的脚本\n\n```javascript\n\
  // 来自 Pages 的源文本\npages = Application(\"Pages\")\n\n// 转换为 Safari Web 应用\ngpt =\
  \ Application(\"ChatGPT\")\n\n// 用于按键的系统事件\nvar se = Application('System Events')\n\
  \n// 提供剪贴板访问\napp = Application.currentApplication()\napp.includeStandardAdditions\
  \ = true\n\n// 前台 Pages 文档\ndoc = pages.documents[0]\n\n// 预提示 (Pre-prompt)\npageContent\
  \ = \"Index the following text using the page number provided: \"\n\n// 起页\nstartingPage\
  \ = 3\n\n// 将十页循环到索引内容中\nfor (i=startingPage;i<startingPage+2;i++){\n  pageNum =\
  \ i+1 // 获取页码\n  currentPage = doc.pages[i].bodyText() // 获取每页的正文\n  // 编译预提示、页面内容、页码\n\
  \  pageContent = pageContent + currentPage + \" \" + pageNum\n}\n\n// 将数据放入剪贴板\n\
  app.setTheClipboardTo(pageContent)\n\n// 激活 GPT 应用\ngpt.activate()\ndelay(1)\n\n\
  // 确保输入文本框获得焦点\nse.keyCode(53, { using: [\"shift down\"] });\ndelay(1)\n\n// 粘贴到\
  \ ChatGPT 你可以使用位于 https://chat.openai.com/g/g-Fv9AmeZvV-index-master 的自定义 GPT \"\
  Index Master\" /\nse.keystroke(\"v\", { using: [\"command down\"] })\ndelay(1)\n\
  \n// 按回车键\nse.keyCode(76)\n```\n\n\n\n\n\n/ 一旦 ChatGPT 返回索引，可以使用 Shift-command-down\
  \ 进行复制。在此系统中，不同的部分将以不同的格式返回。这是聊天回复具有不确定性的一部分。文本将需要被编译和重新格式化。 /\n\n此脚本集成了用于自动化的 JavaScript\
  \ (JXA)，用于 Mac 上的不同应用程序之间执行一系列任务，特别针对 Pages、运行 ChatGPT 网页版版本的 Safari，并利用系统事件（System\
  \ Events）进行自动化。\n\n以下是该脚本执行内容的逐步说明：\n\n1. **访问 Pages 应用程序**：脚本通过创建一个对象来与 Pages 应用程序交互，允许其对\
  \ Pages 文档进行操作并检索数据。\n2. **作为 Safari 网页应用访问 ChatGPT**：随后，它设置一个对象，通过在 Safari 中打开的网页应用版本与\
  \ ChatGPT 交互，表示有意将数据发送到 ChatGPT 进行处理。\n3. **用于按键模拟的系统事件**：通过创建 `System Events` 对象，脚本可以模拟键盘输入，这种方法通常用于自动化处理脚本环境中没有直接\
  \ API 支持的交互。\n4. **剪贴板访问**：它准备让当前应用程序（脚本本身）包含标准添加项，这对于与系统剪贴板交互以复制和粘贴数据是必要的。\n5.\
  \ **从 Pages 文档检索内容**：脚本访问 Pages 中打开的第一个文档，并开始循环从指定的起始页读取正文文本，此处假设起始页为第三页（`startingPage\
  \ = 3`），并持续两页。它将这些内容与递增的页码合并成单个字符串，并在前面加上自定义消息（`\"使用提供的页码对文本进行索引：\"`）。\n6. **将数据复制到剪贴板**：编译后的字符串（现在包含了指定页面的文本及其相应的页码）被复制到剪贴板。\n\
  7. **激活 ChatGPT 网页应用**：脚本切换焦点到 Safari 网页应用版本的 ChatGPT，准备输入复制的文本。\n8. **用于输入的按键**：它模拟快捷键以确保输入区域获得焦点，然后通过模拟\
  \ `CMD+V`（粘贴）操作将剪贴板内容粘贴到 ChatGPT 输入字段。\n9. **提交查询**：最后，脚本模拟按下回车键将查询提交给 ChatGPT。\n\
  \n一旦 ChatGPT 处理了提交的文本，用户将手动处理响应。“Index Master”是一个专为文档索引设计的自定义 ChatGPT 模型。\n\n这种自动化可以是大型文档管理工作流的一部分，通过\
  \ ChatGPT 的处理能力实现 Pages 文档文本索引的自动化。该脚本巧妙地使用 JXA 弥了了应用程序与网络服务之间的差距，展示了 macOS 上自动化的多功能性。\n\
  \n# ￼![DALL·E 2024-03-03 17.07.04 - 一幅有趣的黑白线条卡通画，捕捉了一个正在走动和说话的 Macintosh iMac，具有俏皮且夸张的角色设计。jpeg](img/image_rsrc16W.jpg)\n\
  \n# 从 JXA 调用 Python 脚本以接口 OpenAI API\n\n此脚本由两个部分组成：用于 macOS 的 JXA（用于自动化的 JavaScript）代码段和一个\
  \ Python 脚本。让我们对每个部分进行注释以便说明。\n\n### JXA 代码说明\n\n1. **初始化**：\n```\napp = Application.currentApplication()\n\
  app.includeStandardAdditions = true\n```\n- `Application.currentApplication()` 初始化当前脚本以使用\
  \ macOS 的脚本功能。\n- `app.includeStandardAdditions = true` 启用使用显示对话框、运行 shell 脚本等标准命令。\n\
  \n2. **显示对话框**：\n```\nresponse = app.displayDialog(\"Prompt?\", {defaultAnswer:\
  \ 'a cat in shades of blue'})\n```\n- `app.displayDialog` 向用户显示一个对话框。在这里，它问了一个问题（“Prompt?”）并提供了一个默认答案（“蓝色调的猫”）。\n\
  \n3. **获取用户输入**：\n```\nparameter = response.textReturned\n```\n- `response.textReturned`\
  \ 从对话框获取用户输入的文本。\n\n4. **准备 Shell 命令**：\n```\ncommand = \"/usr/local/bin/python\
  \ ~/openaiapi/inp.py '\" + parameter + \"'\"\n```\n- 构建一个运行位于 `~/openaiapi/inp.py`\
  \ 的 Python 脚本的命令。用户的输入（`parameter`）将作为参数传递给该脚本。\n\n5. **执行 Shell 命令**：\n```\ntheTry\
  \ = app.doShellScript(command)\n```\n- `app.doShellScript` 在 shell 中执行构建的命令。\n\n\
  6. **打开 URL**：\n```\napp.openLocation(theTry)\n```\n- `app.openLocation` 打开一个 URL。在这里，预计\
  \ Python 脚本返回一个 URL 作为输出，然后将其打开。\n\n### Python 代码说明\n\n1. **导入**：\n```python\nfrom\
  \ openai import OpenAI\nimport webbrowser\nimport sys\n```\n- 导入必要的模块：用于与 OpenAI\
  \ API 交互的 `openai`，用于打开 URL 的 `webbrowser` 以及用于处理命令行参数的 `sys`。\n\n2. **初始化 OpenAI\
  \ 客户端**：\n```python\nclient = OpenAI(api_key='OPEN-AI KEY)\n```\n- 使用特定的 API key\
  \ 初始化 OpenAI 。\n\n3. **命令行参数处理**：\n```python\nif len(sys.argv) > 1:\n    parameter\
  \ = sys.argv[1]\nelse:\n    parameter = \"A cat in a hat\"  # 如果未提供参数的默认值\n- 检查是否提供了命令行参数（来自\
  \ JXA 脚本）。如果没有，则使用默认值。\n\n4. **图像生成请求**：\n```python\nresponse = client.images.generate(\n\
  \    model=\"dall-e-3\",\n    prompt=parameter,\n    size=\"1024x1024\",\n    quality=\"\
  standard\",\n    n=1,\n)\n```\n- 调用 OpenAI 的 DALL-E 3 模型，根据提供的提示词（`parameter`）生成图像。指定图像大小、质量和图像数量（在此情况下为\
  \ 1）。\n\n5. **检索图像 URL**：\n```python\nimage_url = response.data[0].url\n```\n- 从响应中提取生成图像的\
  \ URL。\n\n6. **在网页浏览器中打开图像**：\n```python\nwebbrowser.open(image_url)\n```\n- 在默认网页浏览器中打开图像\
  \ URL。\n\n### 整体流程\n\n- JXA 脚本提示用户输入，带输入作为参数运行 Python 脚本，并期望返回 URL。\n- Python 脚本使用\
  \ OpenAI API 根据输入生成图像，并在网页浏览器中打开生成的图像。\n\n使用名为 \"JXA Helper\" 的自定义 GPT\n\n￼![](img/image_rsrc16X.jpg)\n\
