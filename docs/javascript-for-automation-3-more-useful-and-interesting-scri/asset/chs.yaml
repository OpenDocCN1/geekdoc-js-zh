  \ name: songName })[0]\n  delay(2)\n  music.duplicate(song, { to: newPlaylist })\n\
  }\n\nfunction getName(tr){\n  trackNames.push(tr.name() + '\\n')\n}\n\nfunction\
  \ makeCsv(item){\n  csvText += item\n}\n```\n\n## 脚本逐步说明\n\n1. **初始化应用程序**：\n  \
  \ - 脚本首先初始化 `Music` 应用程序、`ChatGPT` 应用程序、`System Events` 以及当前应用程序。它还这些这些应用程序的标准添加以扩展其功能。\n\
  2. **验证播放列表是否存在**：\n   - 脚本检查 `Music` 应用中是否存在指定的播放列表。如果未找到播放列表，它将记录错误消息并停止后续执行。\n\
  3. **提取轨道信息**：\n   - 脚本从指定的播放列表中检索所有曲目的名称。它将这些歌曲名称存储在列表中并将其格式化为 CSV 字符串，为后续处理准备数据。\n\
  4. **准备 ChatGPT 提示词 (Prompt)**：\n   - 创建了一个详细的提示词，要求 `ChatGPT` 从提供的列表中选出 25 首最有趣的歌曲。该提示词被复制到剪贴板。\n\
  5. **激活 ChatGPT**：\n   - 脚本激活 `ChatGPT` 并模拟按键粘贴提示词，发送请求。\n6. **处理 ChatGPT 响应**：\n\
  \   - 脚本处理来自 `ChatGPT` 的响应，提取轨道列表并清理不元素。\n7. **创建新播放列表**：\n   - 在 `Music` 应用中创建一个新的播放列表，其名称反映了来源。\n\
  8. **复制所选轨道**：\n   - 脚本将 `ChatGPT` 选择的轨道复制到新创建的播放列表中。它遍历所选轨道列表，在现有的播放列表中查找每个曲目。\n\
  9. **记录并显示信息**：\n   - 在整个过程中，脚本会记录相关信息并在需要显示对话框，以让用户了解其进度以及任何需要确认的操作。\n\n通过遵循这些步骤，该脚本自动化了策划和组织音乐播放列表的任务，结合了\
  \ macOS 自动化工具和通过 `ChatGPT` 进行 AI 驱动选择的力量。\n\n# 客户支持\n\n我想为 `BBEdit` 编写一个用于查找和替换的\
  \ JXA (JavaScript for Automation) 脚本。我在构思翻译方面有相当的经验，做得越多就越好。但不知为何，我无法在 JXA 脚本中让查找或替换方法工作。无论我如何调整语法，只能得到错误和异常结果。正如往常一样，还有其他方法。\n\
  \n首先，我可以使用效果良好的 AppleScript。这是一个清理网页抓取文本的脚本：\n\n```\ntell application \"BBEdit\"\
  \n  replace \"\\\\.\" using \"\" searching in selection of text 1 of text document\
  \ 1 options {search mode:grep, starting at top:true}\n  replace \"\\\\-\" using\
  \ \"\" searching in selection of text 1 of text document 1 options {search mode:grep,\
  \ starting at top:true}\n  replace \"'\" using \"\" searching in selection of text\
  \ 1 of text document 1 options {search mode:grep, starting at top:true}\n  replace\
  \ \"é\" using \"e\" searching in selection of text 1 of text document 1 options\
  \ {search mode:grep, starting at top:true}\n  replace \"ú\" using \"u\" searching\
  \ in selection of text 1 of text document 1 options {search mode:grep, starting\
  \ at top:true}\n  replace \"\\\\n\" using \",\" searching in selection of text 1\
  \ of text document 1 options {starting at top:true, case sensitive:true}\n  replace\
  \ \" \" using \"\" searching in selection of text 1 of text document 1 options {starting\
  \ at top:true, case sensitive:true}\nend tell\n```\n\n其次，我可以在 JXA 脚本中使用 `doShellScript`\
  \ 来调用此脚本以执行替换：\n\n```javascript\napp = Application.currentApplication();\napp.includeStandardAdditions\
  \ = true;\nresult = app.doShellScript(\"osascript /users/scripts/removecaret.scpt\"\
  )\n```\n\n\n\n\n第三，我可以使用一个 JavaScript 函数来替换文本。这虽然行得通，但 BBEdit 一直是我使用 grep 时的首选：\n\
  \n```\napp = Application.currentApplication();\napp.includeStandardAdditions = true;\n\
  se = Application('System Events')\nbb = Application('BBEdit')\nbodyText = bb.documents[0].text()\n\
  changedText = grepFindAndReplace(bodyText, 'Read.+\\n', '')\n\nfunction grepFindAndReplace(inputString,\
  \ searchPattern, replaceWith) {\n  const regex = new RegExp(searchPattern, 'g');\n\
  \  const outputString = inputString.replace(regex, replaceWith);\n  return outputString;\n\
  }\nbb.documents[0].text = changedText\n```\n\n我的答案是第三点。因为 BBEdit Applescript 将其处理的各种文本组识别为\
  \ JavaScript 可以很好地处理的结构化文本类型，从而能够读取、处理并写入到多个可能的位置。\n\n正则表达式是用于匹配字符串中字符组合的模式。在 JavaScript\
  \ 中，正则表达式也是对象。这些模式用于 `RegExp` 的 `exec()` 和 `test()` 方法，以及 `String` 的 `match()`、`matchAll()`、`replace()`、`replaceAll()`、`search()`\
  \ 和 `split()` 方法。\n\n# 在 JXA 中使用 JavaScript 正正则实现的威力\n\nJavaScript for Automation\
  \ (JXA)将 JavaScript 强大且多功能的特性引入了 macOS 任务的自动化中。在其许多强大的功能中，JavaScript 的正则表达式（regex）实现是文本处理和操作中一个特别有力的工具。在\
  \ JXA 中利用 JavaScript 的正则能力可以显著增强你自动化复杂工作流的能力。具体方法如下：\n\n## 高效的文本解析与匹配\n\n正则表达式提供了一种简洁且强大的手段来搜索、匹配和操作文本。通过\
  \ JXA 中的 JavaScript 正则实现，你可以快速识别字符串中的模式、提取特定数据并用最少的代码转换文本。这对于处理日志文件、从结构化文本中提取数据或验证输入格式等任务特别有用。\n\
  \n## 2. 高级字符串操作\n\nJavaScript 的正则函数（如 `match()`、`replace()`、`search()` 和 `split()`）能够实现复杂的字符串操作。例如，你可以：\n\
  \n- 从文本块中提取电子邮件地址。\n- 将电话号码格式化为统一样式。\n- 根据复杂的分隔符将文本拆分为数组。\n- 查找并替换模式，例如纠正拼写错误或更新文件内容的路径。\n\
  \n## 3. 动态且灵活的自动化\n\nJavaScript 中的正则表达式高度动态，可以在运行时构建或修改。这允许创建灵活的自动化脚本以适应不同的输入格式或不断变化的需求。通过编程构建正则模式，你的\
  \ JXA 脚本可以处理更广泛的任务，而无需不断更新。\n\n## 4. 与 macOS 应用程序集成\n\nJXA 与 macOS 应用程序和系统组件交互的能力意味着你可以直接在自动化工作流中使用正则驱动的文本操作。例如，你可以：\n\
  \n- 根据正则匹配在 Mail 中自动过滤电子邮件。\n- 处理并重新格式 Numbers 或 Excel 表格中的数据。\n- 从 Safari 中的网页或文档中提取并转换内容。\n\
  \n## 5. 无缝错误处理与验证\n\n正则表达式在验证输入和确保数据完整性方面非常出色。在 JXA 中，你可以使用正则在进一步处理数据之前强制模式（如有效的电子邮件格式或\
  \ URL 结构）。这减少了错误并确保你的自动化脚本一致且正确地处理数据。\n\n## 实用示例：\n\n这是一个简单的 JXA 脚本，使用正则从给定文本中提取所有电子邮件地址：\n\
  \n```javascript\nfunction extractEmails(text) {\n  // 定义匹配电子邮件地址的正则模式\n  var emailPattern\
  \ = /\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,7}\\b/g;\n  // 使用 match()\
  \ 找到所有匹配项\n  var matches = text.match(emailPattern);\n  // 返回电子邮件地址数组\n  return\
  \ matches || [];\n}\n\n// 示例\nvar sampleText = \"Please contact us at support@example.com\
  \ or sales@example.org for more information.\";\nvar emails = extractEmails(sampleText);\n\
  console.log(emails); // 输出: [\"support@example.com\", \"sales@example.org\"]\n```\n\
  \n在 JXA 中利用 JavaScript 的正则实现使你能够创建极高效、灵活且强大的自动化脚本。无论你是处理文本文件、爬取网页内容还是验证输入数据，正则都提供了所需的工具来轻松处理复杂的文本操作任务。通过将这些能力集成到你的\
  \ JXA 工作流中，你可以简化 macOS 自动化流程，并开启生产力和精确度的新境界。\n\n# 快捷指令\n\n![](img/image_rsrc175.jpg)\n\
  \n# 生成 QR 代码\n\n1. **从共享表接收更多输入**：此操作被设置为接收来自共享表的输入。如果没有提供输入，它将继续执行下一个操作。这可能是快捷指令接收要转换为\
  \ QR 代码 URL 的起点。\n2. **从快捷指令输入获取 URL**：此操作从快捷指令接收的输入中提取 URL。如果用户选择了包含 URL 的文本或文件并分享到快捷指令，此操作可确保仅取\
  \ URL 作为下一步的输入。\n\n![](img/image_rsrc176.jpg)\n3. **从 URL 生成 QR 代码**：此操作获取上一步提取的\
  \ URL 并生成对应的 QR 代码图像。这是快捷指令的核心功能。\n4. **将 QR 代码保存到最近**：最后，此操作将生成的 QR 代码图像保存到用户照片应用中的“最近”专辑。\n\
  \n### 快捷指令描述：\n\n此快捷指令旨在通过共享表接收用户的 URL 并将其转换为 QR 代码。然后，该 QR 代码会被保存到照片应用的“最近”相中中方便访问。这个快捷指令可以以视觉化格式共享\
  \ URL，这种格式可以被手机或其他带有相机和 QR 代码扫描功能的设备扫描。这是一种无需专用应用即可生成 QR 代码的简单高效的方法。\n\n# 选择照片提取文本到备录\n\
  \n![](img/image_rsrc177.jpg)\n\n1. **请求文本**：快捷指令提示用户输入文本作为笔记的名称。给用户的提示信息是“Make a\
  \ name for note”（为笔记命名）。\n2. **创建笔记**：快捷指令在名为“Biz”的文件夹或账户中，使用提供的输入（上一步输入的名称）创建一个新笔记。\n\
  3. **选择照片**：提示用户选择照片。\n4. **从照片中提取文本**：快捷指令使用 OCR（光学字符识别）技术从选照片中提取文本。\n5. **追加**：将提取的文本追加到之前创建的笔记中。\n\
  \n### 快捷指令描述：\n\n此快捷指令旨在从一个或多个选定的照片中提取文本并将文本保存到笔记中。用户首先为笔记，然后选择照片。文本将从这些图像中识别并编译到“Biz”文件夹或账户内新建的笔记中。这对于快速将物理文档或图像中的文本捕获并整理成数字格式，以便日后访问和参考非常有用。\n\
  \n# 创建带有更改问题的测验\n\n图片概述了一个名为“Monarchy Quiz”的 macOS 快捷指令。该快捷指令似乎是一个简单的测验应用程序，询问关于君主（特别是爱华一世）的问题并显示答案。\n\
  \n![](img/image_rsrc178.jpg)\n![](img/image_rsrc179.jpg)\n\n以下是该快捷指令工作原理的逐步说明：\n\
  \n1. 快捷指令包含一个格式化的 JSON 数组文本块，数组中的每个对象包含一个类别（“Edward I”）、一个子类别（如“Biography”或“Reign”）、一个问题和一个答案。\n\
  \n\n\n2. 随后，快捷指令从此 JSON 格式的文本中提取出一个字典。\n3. 它进入一个重复循环，遍历字典中的每个项目。\n4. 对于每个项目（每对问题和回答对），它会从当前重复项中获取键\
  \ `'category'` 的值（尽管这一步在后续操作中似乎没有进一步的用途）。\n5. 然后，它从重复项中获取键 `'question'` 的值。\n6.\
  \ 随后，通过 `'Show alert'` 动作向用户显示问题。\n7. 之后，它从重复项中获取键 `'answer'` 的值。\n8. 该答案也会通过 `'Show\
  \ alert'` 动作显示给用户。\n9. 在处理字典中的所有项目后，循环结束。\n\n如何使用该快捷指令：\n- 运行“Monarchy Quiz”快捷指令。\n\
  - 阅读弹窗中显示的问题并思考你的答案。\n- 忽略问题弹窗，在下一个弹窗中查看正确答案。\n- 对测验中的每个问题重复此过程，直到所有问题都回答完毕。\n\n\
  此快捷指令是一种向用户展示一系列问题和答案的简单方法，可能用于教育或娱乐目的。\n\n# 使用 AI 创建播放歌列表图像\n\nApple Music 最近的一次更新包含了一个意想不到的惊喜。过去，当创建一个新的播放歌列表时，使用前四张专辑的封面图来创建播放歌列表的“封面”。用户可以通过包含所需封面的四首歌曲放在列表开头来控制所使用的封面图。但这次更新完全取消了这个功能，并提供了一些特别难看的预制图像作为选择，除非选择从文件或照片库中添加图像。在创建新播放歌列表后这样做非常麻烦，因此我使用了快捷指令通过两种方式来简化它。首先是使用\
  \ OpenArt.ai 网站创建图像\n\n用法：\n\n![](img/image_rsrc17A.jpg)\n\n# ![](img/image_rsrc17B.jpg)\n\
  \n图片显示了一个名为“Use AI To Get Playlist Art”的 macOS 快捷指令。该快捷指令旨在帮助你为特定风格的音乐播放歌列表创建艺术。其工作原理如下：\n\
  \n1. 快捷指令开始，如果没有来自共享表的直接输入，则继续接收输入。\n2. 使用 `Dictionary` 动作定义一个样式列表，可以通过选择这些样式来确定你想创建的艺术类型。提供的选项包括用于漫画风格的“Comic”、“新艺术（Art\
  \ Nouveau）”、“哥特（Gothic）”、“Picasso（毕加，可能是替代更抽象的风格）”、“California”、“Sixties（六十年代）和“Movie”。你也可以向此字典中添加更多样式。\n\
  3. `'Choose from Dictionary` 动作允许你选择这些样式中的一种。\n4. 随后，快捷指令会提示输入文本，可能是为了接收关于艺术更具体的细节或偏好。\n\
  5. 从字典中选定的项目（所选样式）和提供的输入文本合并成单个文本块。\n6. 该文本块被复制到剪贴板。\n7. 创建一个指向 `https://www.openart.ai/create`\
  \ 的 URL。\n8. 快捷指令打开此 URL，包含样式和任何额外输入的合并文本块可以在此处使用 AI 生成播放歌列表封面。\n\n如何使用该快捷指令：\n\
  - 运行快捷指令并从预定义列表中选择样式。\n- 在提示时输入任何额外细节。\n- 快捷指令将合并后的文本复制到你的剪贴板，并导航到 openart.ai 网站，你可以在那里使用复制的文本指示\
  \ AI 生成所选风格的播放歌列表封面。\n\n# 使用 Google 查找播放歌列表图像\n\n其次，使用 Google 搜索适合作为播放歌列表封面的图像。在播放歌列表界面，点击三个点获取共享表。选择快捷指令名称。如果正在播放歌曲，快捷指令将立即使用\
  \ `Current Song` 的 `Album name`、`Song Title` 和 `Artist` 作为搜索词，否则它将提供音频输入以语音提供搜索词：\n\
  \n![](img/image_rsrc17C.jpg)\n![](img/image_rsrc17D.jpg)\n\n以下是所示每个步骤的分解和描述：\n\n\
  1. 快捷指令开始从共享表接收图像和其他输入。如果没有输入，它将继续。\n2. 它从 Apple Music 获取 `'Current Song'` 详情。\n\
  3. 使用 `'Current Song'` 的详情获取 `'Album'`、`'Artist'`、`'Lyrics'` 和 `'Title'`。\n4. `'If'`\
  \ 条件检查歌曲的 `'Title'` 是否有效。\n   - 如果 `'Title'` 有值，构建一个文本命令来寻找与歌曲的 `'Artist'`、`'Album'`\
  \ 和 `'Title'` 相关的图像。\n   - 然后对文本进行 URL 编码，并将此 URL 编码文本保存到名为 `'Choice'` 的变量。\n5.\
  \ 如果 `'Title'` 没有值，快捷指令允许你口述文本，然后进行 URL 编码并保存到 `'Choice'` 变量中。\n6. `'If'` 条件结束后，快捷指令使用\
  \ `'Choice'` 变量构建 Google 搜索 URL，以寻找与输入或口述信息相关的图像。\n7. 最后，打开构建的 URL。\n\n要使用此快捷指令，你可以在\
  \ Apple Music 中选择一首歌，将其共享到此快捷指令，然后它将帮助你在在线寻找相关图像，可能用于创建播放歌列表封面或类似的目的。\n\n![](img/image_rsrc17E.jpg)\n\
  \n"
