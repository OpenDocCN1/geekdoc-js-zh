  \ Chrome 窗口中创建一个标签页，将其 URL 设置为之前从 Safari 当前标签页获取的 URL。这是通过 `newWindow.tabs.push(Chrome.Tab({url:\
  \ myUrl }));` 实现的。\n\n此脚本将 Safari 当前活动标签页的 URL 传输到 Google Chrome 新窗口的新标签页中，有效地跨浏览器复制标签。这对于需要使用多个浏览器并在它们之间移动会话或特定页面的用户特别有用。\n\
  \n对于那些大部分时间使用 Safari，但偶尔使用 Google Chrome 访问整个 Safari 生态系统之外网站的人来说，这非常方便。我设置了可以在\
  \ Microsoft Edge 之间发送 URL 的脚本，以便在我出于某种原因使用该浏览器时。\n\n![](img/image_rsrc173.jpg)\n\
  \n# 从长播放列表中提取 AI 选取的较短播放列表\n\nApple Music 允许创建包含数千首歌曲的超级播放列表。当你拥有一个包含数千首歌曲的播放列表时，能够生成多少个特定长度的独特播放列表是非常惊的。最棒的部分是将超级播放列表设置为随机播放，每次都能获得独特的列表。但较大的脚本可以作为歌曲池。此脚本使用\
  \ AI 根据预设标准挑选歌曲。\n\n此脚本是一个复杂的自动化工具，旨在简化 macOS 上 Music 应用程序中的播放列表管理。利用 JavaScript\
  \ 自动化（JXA）的力量，脚本集成了多个 macOS 应用程序和功能，通过自动化与播放列表策划相关的重复任务来提高用户效率。\n\n脚本首先初始化关键 macOS\
  \ 应用程序：Music、ChatGPT、System Events 和当前应用程序。这种设置确保了脚本能够与这些应用程序无缝交互，利用它们的全部功能。标准组件的引入进一步扩展了脚本的功能，允许进行更复杂的操作。\n\
  \n脚本的一个主要功能是能够验证 Music 应用程序中是否存在指定的播放列表。此初始检查确保脚本在正确的数据集上运行，防止错误并提高可靠性。如果未找到指定的播放列表，脚本将记录相应的错误消息并停止后续执行，为用户提供清晰的反馈。\n\
  \n一旦确认了播放列表，脚本将继续提取轨道信息。它系统地收集播放列表中的歌曲名称，并将这些数据格式化为 CSV 字符串。这一步为后续处理准备了轨道信息，确保数据结构化以便于操作和分析。\n\
  \n然后，脚本为 ChatGPT 构建了一个详细的提示词，要求它从提供的列表中选择 25 首最有趣的歌曲。该提示词被复制到剪贴板，并激活 ChatGPT 处理请求。通过一系列模拟按键操作，脚本与\
  \ ChatGPT 交互，粘贴提示词、发送请求并检索响应。这种对 ChatGPT 的创新用法凸显了脚本将高级 AI 工具纳入决策过程的能力。\n\n收到 ChatGPT\
  \ 的响应后，脚本将处理歌曲列表，精炼数据以移除任何不必要的元素。它记录最终的歌曲列表，为被选中的项目提供透明视图。随后，脚本会在 Music 应用程序中创建一个新的播放列表，并进行命名以反映其来源，并将选中的歌曲复制到此新播放列表中。此功能展示了脚本不仅能够策划，还能有效地组织和管理音乐收藏。\n\
  \n本质上，此脚本体现了 JavaScript 自动化与 macOS 应用程序之间强大的协同作用。通过自动化复杂的播放列表管理过程，它节省了精力，让用户能够专注于享受音乐，而不是被行政任务所困。ChatGPT\
  \ 的集成进一步增强了它的实用性，展示了利用 AI 进行实际日常应用的前瞻性方法。\n\n## 如何在 macOS 上为 ChatGPT 网站创建 Web 应用以供脚本使用\n\
  \n### 使用 Web 应用的好处\n\n\n\n\n\n# Web App 功能\n\n- **独立功能**：Web App 的功能与 Safari 独立运行。它不会与\
  \ Safari 共享浏览历史、Cookies、网站数据或设置，确保你在 Web App 中的活动仅在该内部进行。\n- **简洁界面**：Web App 具有极简主义风格的工具栏，仅包含后退、前进和分享按钮。这提供了一个干净且专注的用户界面。\n\
  - **可自定义**：你可以为 Web App 分配任何名称或图标，使其易于从 `Dock` 中被识别和访问。\n- **通知**：如果网站支持通知，Web App\
  \ 在 `Dock` 中的图标可以显示未读通知的数字。\n- **类 App 行为**：Web App 的运行方式与其他任何其他 macOS 应用程序相同。你可以将其添加为登录项，这样它就会在你登录时自动打开。\n\
  \n## 创建 Web App 的步骤\n\n1. **确保兼容性**：\n   - 确保你的 macOS 版本为 `Sonoma` 或更高版本。\n2. **在\
  \ Safari 中打开网页**：\n   - 启动 `Safari` 并导航到 `ChatGPT` 网站。\n3. **添加到 Dock**：\n   - 从\
  \ `Safari` 菜单栏中，选择`文件` > `添加到 Dock`。\n   - 或者，点击 `Safari` 工具栏中的`分享` 按钮，然后选择`添加到\
  \ Dock`。\n4. **命名 Web App**：\n   - 为你的 Web App 输入所需的名称（例如，“ChatGPT”）。\n   - 点击`添加`。Web\
  \ App 将保存到你用户目录下的 `应用程序` 文件夹中。\n5. **访问 Web App**：\n   - 现在你可以像打开其他应用程序一样，从 `Dock`、`启动台`\
  \ 或 `Spotlight` 打开 Web App。\n\n通过遵循这些步骤，你为 `ChatGPT` 网站创建了一个专用的 Web App。该 Web App\
  \ 随后可以在你的自动化脚本中使用，确保为与 `ChatGPT` 的交互提供专门定制的流畅且隔离的浏览体验。\n\n```javascript\nmusic =\
  \ Application('Music')\n\ngpt = Application('ChatGPT')\n\ngpt.includeStandardAdditions\
  \ = true\n\nse = Application('System Events')\n\napp = Application.currentApplication()\n\
  \napp.includeStandardAdditions = true\n\nprePrompt = \"\"\n\ntheLists = [\"Ultimate\
  \ Blues Collection Collection\"]\n\nexistingPlaylist = music.playlists.whose({ name:\
  \ theLists[0] })[0]\n\n// Ensure the playlist exists\n\nif (!existingPlaylist) {\n\
  console.log(\"Playlist not found: \" + existingPlaylistName);\nthrow new Error(\"\
  Playlist not found: \" + existingPlaylistName);\n}\n\nfor(i=0;i<theLists.length;i++){\n\
  \  currentPlaylist = theLists[i]\n  trackNames = []\n  csvText = ''\n  // Data\n\
  \  theTracks = music.userPlaylists[currentPlaylist].tracks()\n  len = theTracks.length\n\
  \  theTracks.forEach(getName)\n  tlen = trackNames.length\n  trackNames.forEach(makeCsv)\n\
  }\n\nprePrompt = \"Pick out the 25 most interesting sogs from the provided list\
  \ and produce a list in the format of a return-delimited list as code using \\r:\
  \ \"\n\nprompt = prePrompt + csvText\n\napp.setTheClipboardTo(prompt)\n\ngpt.activate()\n\
  \n// se.keystroke(\"o\", { using: [\"shift down\",\"command down\"] })\n\ndelay(2)\n\
