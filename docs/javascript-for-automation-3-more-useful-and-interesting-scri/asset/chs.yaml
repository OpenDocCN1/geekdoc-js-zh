  \ of ways to research javescript language\"\ncommand = `curl -H 'Content-Type: application/json'\
  \ -d '{\"contents\":[{\"parts\":[{\"text\":\"${prompt}\"}]}]}' -X POST https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=API-KEY`\n\
  \ntry {\n    jsonObj = app.doShellScript(command)\n    obj = JSON.parse(jsonObj)\n\
