  \ {buttons: [\"Cancel\", \"Proceed\"], defaultButton: \"Proceed\", withTitle: \"\
  Playlist Process\", withIcon: \"note\", givingUpAfter: 60 })\ndelay(2)\nse.keystroke(\"\
  c\", { using: [\"shift down\",\"command down\"] })\ncontent = app.theClipboard()\n\
  finalTracks = content.split(\"\\r\")\n\n// Remove the first item: the apostrophes\
