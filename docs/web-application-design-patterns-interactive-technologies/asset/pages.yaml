  md: 'To help users understand data, relationships, trends, and diagnose problems,
    report summarized and abstracted data on dashboards using approaches such as pie
    charts, bar charts, line charts, tables or lists, and so forth. To ensure that
    data are understood correctly, employ data visualization or charting methods that
    are suitable for the type of data and their intended use (Figures 4.7 and 4.8).


    # MATCH EXCEPTION CONDITIONS TO USERS'' TASKS


    Match exception icons and indicate to users’ monitoring tasks (Figure 4.9). For
    example, use indicators, such as alert or traffic light icons, if users need to
    know only the current state of a metric. However, if users need to know trends,
    use icons, such as up and down arrows, with appropriate colors may be more appropriate;
    they may be supplemented with spark lines to show a quick snapshot of the historical
    trend.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_85_0.png)


    **FIGURE 4.8** Google Analytics’ dashboard uses a variety of charting methods
    to convey web performance metrics. It uses a chart to show "Visitors Overview,"
    and spark lines to show "Site Usage," and tabular data to show "Content Overview."'
