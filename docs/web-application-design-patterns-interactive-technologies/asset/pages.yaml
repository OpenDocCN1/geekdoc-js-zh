  md: '# Click-to-Chat


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_430_0.png)


    FIGURE WEB.26 TurboTax online integrates "Live Community" as part of the application.
    This allows users to access relevant discussions and to ask questions. Such integration
    also helps users to think as part of the application and not a stand-alone module.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_430_1.png)


    FIGURE WEB.27 Owest offers users a click-to-chat option to make it easy for users
    to get answers to their questions rather than calling the agent on the phone.


    # CLICK-TO-CHAT


    # Problem


    When users are in a rush and/or working on urgent and important tasks, they may
    want immediate support. Even when necessary help information is found in the available
    help, users may not have the time or inclination to explore help information and
    may prefer to talk to a knowledgeable person so they can get answers to their
    questions quickly.


    # Solution


    Offer users an option to chat in real time with a customer service person (or
    a sales or technical support person) so they can get their questions answered
    quickly (Figure Web.27).'
  merge: -1
  pgno: 430
- img_proc: true
  md: '# Why


    When users are trying to research options failing to find the desired information,
    or facing a complex task, they often prefer to receive assistance from someone
    with experience. Even when help help information is available and easily accessible,
    it may not be able to answer all users'' questions; they may not know where to
    find the desired information. In such cases, offering an option to chat with a
    knowledgeable customer support person (i.e., an agent) can be very useful. In
    addition, on e-commerce applications, talking to a knowledgeable person can assist
    users in their purchasing decisions. A study by Forrester Research found that
    almost half of the users who tried click-to-chat features valued the ability to
    immediately chat with a live person (Sage, 2008).


    # How


    Before users can initiate a chat, they must know that it''s available. Therefore,
    make the click-to-chat option accessible from the pages where users are likely
    to expect the most. For many web applications, the option to chat live is available
    as part of the utility navigation (Figure Web.28).


    Although most applications click-to-chat is initiated by the users, many e-commerce
    applications offer a proactive chat option to users based on their behavior, as
    frequently visiting the same product page or spending time on a page. Here, users
    are prompted to initiate a chat with a sales agent in getting their questions
    answered.


    # LET USERS KNOW IF THE AGENT IS AN AUTOMATED AGENT


    It''s important for users to know whether they are chatting with a live agent
    or an automated agent. If an automated agent is the default option, offer users
    an easy way to chat with a live agent (Figure Web.29).


    # COMMUNICATE AVAILABILITY AND WAIT TIME


    Clearly indicate to users when the live-chat option is unavailable. In addition,
    let users know what other help options they have (Figure Web.30). Similarly, if


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_431_0.png)


    FIGURE WEB.28 eBay offers the "Live help" link in the top-right section of the
    page.'
