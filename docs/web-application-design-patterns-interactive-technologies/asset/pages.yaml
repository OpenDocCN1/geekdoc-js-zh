    ![](img/4da2afa2580415d3d4ff98025db0a2c3_290_1.png)


    FIGURE 9.49 Facebook allows users to create their own groups.


    # How


    Groups or online communities are virtual places where users with like interests
    share and connect with each other. Therefore, a community can be in the form of
    discussion groups around a topic (e.g., Usenet); groups created within a social
    networking application (e.g., Facebook); discussions around social objects such
    as photos, music, movies, books, and so forth (e.g., Flickr); comments in response
    to a blog entry (e.g., blogger); or communities created by companies to support
    their customers (e.g., Dell Support Forums).


    Groups can be derived dynamically using shared tags (Figure 9.48), or others (Figure
    9.49). Creating groups dynamically is a good way to discover people who share
    interests. However, implicitly created groups may not be sustainable because users
    have not chosen to be part of that group. Explicitly formed groups, on the other
    hand, require users to join them and may have better chances of surviving.


    Groups may also be created around specific events by people attending, or those
    wishing to attend, an event. Events are just a type of group with location'
