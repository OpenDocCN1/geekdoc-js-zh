  md: '# Unobtrusive Style Sheets


    Screen readers and other assistive technologies rely on structural markup to communicate
    page structure to users. Just because an looks like a first-level heading, if
    it''s not using <h1>, it will be presented as regular text to users of assistive
    technology. Therefore.


    +   - Do this: <h1>Heading 1</h1>

    - Not this: <div class="heading">Heading 1</div>


    Although both of these techniques use and achieve the same presentation results,
    the meaning of the first-level heading is lost without the <h1> tag.


    # Related design patterns


    Once a page is made using structural tags, style sheets can be attached to make
    pages visually appealing. However, follow the UNOBTRUSIVE STYLE SHEETS pattern
    to ensure that pages remain accessible.


    # UNOBTRUSIVE STYLE SHEETS


    # Problem


    Pages using structural markup do not look visually pleasing. Most designers rely
    on style sheets (e.g., CSS) to improve the appearance of pages by laying them
    out multiple columns, using appropriate fonts and colors, and adding images. Although
    style sheets can significantly improve the appearance of pages, if used inappropriately,
    they could render the pages inaccessible to some users.


    # Solution


    Add style sheets so that they can adapt to different usage and browser contexts—that
    is, CSS disabled, CSS unavailable, poor CSS support, user CSS, and so—that they
    can satisfy the needs of the widest audience. In addition, develop style sheets
    that have the necessary flexibility to adjust the presentation to improve page
    readability.


    # Why


    As discussed (see the PROGRESSIVE ENHANCEMENT pattern earlier in this chapter),
    style sheets are for authors to describe page presentation. However, the designer''s
    preferred presentation may render a page inaccessible to people who have vision
    deficiencies, for example, the page doesn''t allow enlarging text size or changing
    colors. Allowing users to "layer" their own presentation over the page more usable,
    but also improves its reach to text-only browsers, screen readers, screen magnifiers,
    Braille readers, and other assistive devices.


    # How


    Following the principle of PROGRESSIVE ENHANCEMENT, structure the page first so
    that the page order makes sense (see the SEMANTIC MARKUP pattern'
