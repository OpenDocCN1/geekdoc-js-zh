    to have them included with other examples for pattern (Figure 13.15). In addition,
    participation from users should be acknowledged not only to recognize their contributions,
    but also to serve as an incentive for others to contribute.


    To ensure that interested users keep themselves informed of the changes, offer
    them the option to subscribe to RSS feeds (Figure 13.16).


    # ESTABLISH A PROCESS FOR MANAGING PATTERN LIBRARIES


    Finally, and most important, pattern libraries should be managed just like any
    other software application. In particular, they should have a clear process around
    adding, updating, and archiving (or deprecating) patterns. It is also important
    to determine the process around the approval of patterns before publishing them.
    The process should indicate how patterns move from a draft or proposed stage to
    the approved stage, how participants provide feedback, how disagreements are resolved,
    how each proposal will be voted on, and so forth (Figure 13.17; Crumshill, 2008;
    Malone et al., 2005). If software components are included in the pattern, it''s
    important that the processes around code review and testing are included as well.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# CHAPTER 13 Pattern Libraries


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_398_0.png)


    FIGURE 13.17 Pattern Library Workflow used by Yahoo! (Source: Malone et al., 2005.)


    To ensure that the pattern library stays relevant and useful, it is important
    to monitor and refine or extend the patterns to ensure their continued efficacy
    and applicability. Some patterns may become obsolete because of improved design
    approaches. For example, the design pattern CAPTCHA (see Chapter 3), although
    appropriate now, may become obsolete as other technological approaches emerge
    to distinguish humans and automated agents.


    Alternatively, some patterns may not change in how they work but have to be updated
    because of improved implementations. For example, forms that were once laid out
    using tables may now positioned using cascading style sheets (CSS). Such changes
    to the patterns must be marked as “updated” to inform designers and developers
    of the changes; the changes may be sent out via RSS feeds as well. To ensure that
    patterns are not made in an arbitrary fashion, it''s important to define and adopt
    some form of change control.


    # CONSIDER USING A WIKI FOR DEVELOPING PATTERN LIBRARIES


    A wiki should be considered for developing pattern libraries, since they make
    collaboration easier by allowing several people to add, change, and remove content
    (Figure 13.18). A wiki also maintains a history of changes and makes it possible
    to revert to a previous version, if necessary; with built-in version control makes
    a wiki useful for single-author pattern libraries as well. With features such
    as easy linking among web pages, a wiki also makes it easy to link related patterns.
    Finally, by supporting a discussion among its participants, a wiki makes participation
    easier.'
