  md: '# CHAPTER 9 Social Applications


    FIGURE 9.59

    Meebo, an online IM aggregator, shows users contacts and online statuses. Like
    other desktop-based instant messaging aggregators, it groups users separately
    and distinguishes contacts'' IM account types with icons.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_296_0.png)


    # Solution


    Show users an indication of whether another user is online (Figure 9.59). However,
    respect each users'' privacy preferences and indicate their online status accordingly.


    # Why


    An important purpose of community-based applications is to promote interaction
    and communication among its members. Although this can be achieved by offline
    messaging approaches as email, allowing real-time communication promotes a better
    sense of community. Therefore, knowing whether a user is online is important because
    it can suggest to others that they can initiate a conversation.


    # How


    Like instant messaging (IM) programs (e.g., AOL Instant Messenger, Yahoo! Messenger,
    MSN Messenger), use a status image or some other marker to indicate whether a
    user is online.


    ALLOW USERS TO INDICATE THEIR ACTIVITY STATUS


    A recent trend is to allow users to indicate their activity status along with
