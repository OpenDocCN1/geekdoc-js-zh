  md: '# CHAPTER 9 Social Applications


    experience with the product or service after they have purchased or experienced
    it. Popularity and quality are not the same. For example, a best-selling author
    may sell many copies of a newly published or to-be-published book before anyone
    has had an opportunity to read and review it. In addition, the ratings and reviews
    obtained from other users of a product have been found to be useful and trustworthy
    to help users make purchase decisions. Gauri et al. (2008) concluded:


    > It is interesting that all of the attributes, positive customer reviews have
    the greatest impact on repurchase intention. This is consistent across all categories
    (i.e., books and magazines; DVDs and videos; flou and food). Even more impressive
    is the finding that number of years on the Web has the least impact on repurchase
    intention. It suggests that stores would attract more customers by having positive
    customer reviews. Another interesting finding is that it is not the total number
    of reviews that influences customer repurchase intention, but the percentage of
    positive reviews.


    # How


    Web applications that attempt to capture users’ feedback quickly employ a star-rating
    approach with one star representing the lowest rating and five stars representing
    the highest rating; some applications allow increments of half stars, increasing
    the range of the scale.


    Two types of interaction approaches are commonly used when using star ratings:


    +   Separating the user’s ratings from the average rating. With this approach,
    users are shown an item’s average rating separately from their own rating. To
    rate an item, users are shown a set of five “empty” stars. As users hover over
    the stars, stars reflecting the corresponding rating highlight. Users are then
    shown their ratings in a different color from the average rating (Figure 9.12);
    they are also offered an option to remove their ratings or change previously assigned
    ratings.


    +   Combining the average rating with the users’s ratings. By default, users are
    shown stars in red to indicate the current average item rating. As users hover
    over the stars, the red stars are replaced by yellow stars (or another color).
    As users click to assign and save a rating, the stars are shown in the yellow
    state to indicate that the item has been rated by the user (Figure 9.13).


    Although it seems intuitive to separate the current rating from the users’ ratings,
    both of these approaches are widely used. In some instances, approaches are used
    within the same application. For example, Blockbuster separates the aggregated
    average rating from the users’ rating on the movie'
