    # Related design patterns


    An alternative to PAGINATION is CONTINUOUS SCROLLING, which allows users to view
    all items in the search results as a scrolling list.


    # CONTINUOUS SCROLLING


    # Problem


    Although pagination is a commonly used technique to navigate a large number of
    search results, users'' interaction experience is not continuous since users have
    to wait for the page to refresh before seeing the next set of results.


    # Solution


    Allow users to scroll through results in a large scrolling list. Like pagination,
    show users only a subset of data at a time. Request additional data in real time
    from the server using Rich Internet Application (RIA) technologies such as Ajax
    and show users the next set of search results as they reach the bottom of the
    current list without page refreshes (Figure 6.37).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_167_0.png)


    FIGURE 6.37 Rutland Tool & Supply uses continuous scrolling to show users items
    in a product list.'
