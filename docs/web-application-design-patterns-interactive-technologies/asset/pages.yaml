  md: 'Most users are not designers, however. When offered a wide selection of colors,
    their choices may not be visually pleasing and make pages difficult to. Therefore,
    consider offering preset color schemes to choose from. However, this is not to
    suggest that customization options should be restricted to an existing set. Allow
    users to choose their own colors as well (Figure 4.30).


    # APPLICATION CUSTOMIZATION


    For enterprise-level web applications, it may be impossible to anticipate and
    accommodate diverse user needs without compromising usability. For such applications,
    offer customization options at the application level such as allowing creation
    of custom reports or even custom fields. Users can then tune the application to
    conform to their current way of working (Figure 4.31). It is important to remember
    that customization at the application level may not be used frequently, so offer
    users necessary assistance, as step-by-step guidance using wizards (see the WIZARDS
    pattern in Chapter 5).


    # MINIMIZE CUSTOMIZATION CHOICES DURING REGISTRATION


    Without interacting with the web application, users may not know whether they
    would like to customize it and, if so, to what extent. Therefore, limit the customization
    options to a minimum during the registration process.


