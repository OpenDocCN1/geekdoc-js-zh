    allow users to restrict search to a category by letting them specify the scope
    of their search. Using radio buttons, a dropdown list, images, or tabs (Figure
    6.3). However, it''s important that the page does not refresh when users choose
    a scoping option.


    Do not scope search by default or require users to select a scoping category.
    Users may not know the category to which an item belongs, which may be the'
