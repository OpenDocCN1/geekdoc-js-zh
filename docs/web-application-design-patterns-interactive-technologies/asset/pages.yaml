    # USE CULTURE-NEUTRAL IMAGES


    When using images and icons, use universally recognized objects and avoid using
    images that are ethnocentric and/or be considered offensive in other cultures.
    For example, to represent email, use an image of an envelope instead of a mailbox,
    which is readily understood only in the United States. In addition, avoid using
    gestures in icons and images, as they may be considered offensive in some cultures.
    For example, using an “okay” sign (index finger and thumb forming a circle) is
    considered obscure in Brazil,³ while the thumbs-gesture (a sign of “all good”
    or “okay” in North America) is considered highly offensive in Iraq and other Islamic
    cultures (Koerner, 2003).


    Even symbols commonly considered to be “neutral” may not be. The check (cross
    in a square) means “correct” or “okay” in many countries. But in Japan and Korea,
    a circle is used instead of a check to mean “yes”; in fact, the check indicates
    “no good” or “fail.” Finally, avoiding maps that contain regional or national
    boundaries (e.g., showing national boundaries of India and Pakistan)


    > ³In Turkey it is a sign for something offensive. In China, it can mean “zero”
    or the number three; in Japan and Korea, it can refer to the sign of a coin and
    mean “money.” For more information, The OK Hand Gesture Around the World—Learning
    the Meaning of Hand Gestures (2008); www.articlesbase.com/travel-tips-articles/the-ok-hand-gesture-around-the-world-learn-the-meaning-of-hand-gestures-624739.html.'
