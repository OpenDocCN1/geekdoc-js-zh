    # Related design patterns


    When tags are used for labeling items, TAG CLOUDS are usually offered as a way
    to navigate and explore content (see Chapter 5).


    # RATINGS


    # Problem


    With an abundance of content accessible on the Web, users are faced with the problem
    of identifying relevant and useful content; this is made even difficult with user-contributed
    content that has not been reviewed or edited for quality. Applications also place
    a similar problem because their personalization and recommendation algorithms
    often rely on user interests that are the same when they try suggesting content
    to users.


    # Solution


    Allow users to indicate their likes and dislikes by rating items (e.g., movies,
    music, videos, restaurants, hotels, and so forth: Figure 9.11). Ensure that rating
    an item is quick and does not take too long or interrupt users'' main task.


    # Why


    It is impossible for users to weed through all the available content to separate
    useful and relevant content. In addition, when buying products and services, deciding
    among the available options can be paralyzing (Schwartz, 2004). Therefore, to
    help make decisions, users typically depend on others'' experiences, which are
    conveyed through ratings and reviews (the REVIEWS pattern follows).


    Ratings in the form of star are straightforward for two reasons: (1) providing
    ratings is relatively straightforward, and (2) they provide quick, at-glance information
    about the usability or quality of products, services, content, and other items
    as judged by other users. Ratings makes it easy for users to least filter out
    content at a gross level. Ratings can be used in a variety of ways. For example,


    +   - eBay, a marketplace for buying and selling products, uses ratings to create
    a detailed feedback profile of sellers.

    - Amazon, an online retailer and marketplace, uses ratings for its products as
    well as its sellers.

    - NexTag, a comparison-shopping application, uses ratings to show the quality
    of products as well as the reliability of sellers.


    An indirect measure used to judge items is its popularity based on the number
    of purchases, downloads, additions, and so forth. However, this method indicates
    users'' actions and behaviors, but not their satisfaction'
