  md: 'page content occupying different amounts of vertical space. If the layout has
    to adapt to varying amounts of page content, maintain relative positions of elements
    within the page. A trivial example is the page footer, which could always appear
    after the page content no matter how vertical space is needed by the page content.


    # CONSIDER USING THE GOLDEN RATIO


    The golden ratio, also known as divine proportion, is the ratio between two segments
    that the smaller (bc) segment is to the larger (ab) as the larger segment is to
    the sum of the segments (ac), or bc/ab = 0.618 (Figure 12.10; Lidwell, 2003).


    In general, layouts based on the golden ratio are considered to aesthetically
    pleasing. Although the superiority of designs based on grid layouts limited evidence
    (Markowsky, 1992), most designers consider them superior and design grid layouts
    accordingly. Although designs shouldn''t be forced to fit the golden ratio, it
    is considered whenever possible (Lidwell et al., 2003).


    To use the ratio for a two-column, 770-pixel, fixed-width design—for example,
    multiply 770 pixels × 0.618. The result is approximately 475 pixels, which can
    be the main column''s width. The remaining 295 pixels (i.e., 770–475) can be used
    for the second column, which can be used for navigation or other secondary content
    (Baird, 2007; Clarke, 2007). The same approach also can be used for larger widths
    (Figure 12.11).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_371_0.png)


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_371_1.png)'
