    # KEEP HIGHLIGHTING APPROACHES CONSISTENT


    Keep highlighting approaches consistent throughout application for similar interactions.
    Although the design may have different highlighting approaches for different contexts,
    such as selected items, messages (e.g., error, feedback, acknowledgment, and alert),
    selected navigation items, and so forth, they should remain consistent throughout
    the application. In Figure 12.21, Gmail uses a yellow background for selected
    emails, a blue background for the selected item (in this case, "Inbox\ and a green
    icon for users who are currently online (in this case, Pawan Rova) for chatting.


    # Related design patterns


    Animations and transitions are also useful ways to call users'' attention to the
    changed elements (see the ANIMATIONS/TRANSITIONS and SPOTLIGHT/YELLOW-FADE patterns
    in Chapter 8).


    # ICONS


    # Problem


    Designers want to make different page objects and actions easily recognizable
    without requiring excessive space and, at the same time, want to make the interface
    visually pleasing and inviting to users.'
