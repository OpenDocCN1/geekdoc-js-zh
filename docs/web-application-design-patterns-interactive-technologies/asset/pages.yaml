    # Why


    Allowing users to customize an application to match their content needs, color
    and layout preferences, and its components afford necessary flexibility to users.
    In addition, it reduces the burden on designers, as they can defer some of these
    decisions to users. For example, designers can focus on one application look-and-feel'
