    # KEYBOARD NAVIGATION


    # Problem


    When filling forms, users often move between fields using the Tab key or use the
    keyboard keys to select an option from a dropdown. Requiring users to switch between
    the mouse and keyboard to fill out parts of forms can not only become frustrating
    but also making the form inaccessible to users with assistive technologies.


    # Solution


    Allow users to use the Tab key to move from one element to another. In addition,
    ensure that users can press the Enter key to submit the form; and, if it improves
    interaction efficiency, allow them to navigate using keyboard shortcuts (Figure
    2.26). Also make sure the dropdown lists are accessible using the keyboard keys,
    especially those implemented using JavaScript.'
