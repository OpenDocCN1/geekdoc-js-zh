  md: '# CHAPTER 9

    Social Applications


    # INTRODUCTION


    Increasing, web applications are designed to encourage user participation and
    sharing. User participation is typically in the form of user-contributed content,
    where users add their own content to the community (ADD/UPLOAD CONTENT) and describe
    it using tags (TAGGING). Other ways for users to participate is by providing RATINGS
    and REVIEWS of content offered by the application. Many applications also involve
    users in promoting them by letting them vote for their usefulness and relevance
    (VOTE TO PROMOTE).


    To ensure that user participation leads to a trusted online community, users have
    to establish an account with the application and create a USER PROFILE. Although
    for products and services, trust may be established through RATINGS and REVIEWS,
    for users it is important that they achieve a high REPUTATION, especially if they
    want to transact online or gain respect of other online members. Social applications,
    therefore, facilitate users to connect with others with shared interests, backgrounds,
    and experiences (DISCOVER NETWORK MEMBERS). Once discovered, not only can they
    “friend” them (FRIEND LIST) and/or “follow” their activities online, but they
    can also create groups to discuss and share common interests (GROUPS/SPECIAL-INTEREST
    COMMUNITIES). Social applications also facilitate interaction among friends by
    allowing them to chat in real time, send messages to each other, and write comments
    in shared areas (MESSAGING); for encouraging real-time messaging it''s also important
    to convey users'' online status (PRESENCE INDICATOR).


    Participation and interaction are further enhanced when users can share photos,
    news stories, videos, bookmarks, and other content—commonly referred to as social
    objects—with their friends and trusted colleagues (SHARING) or work together to
    coordinate activities and events or co-create content (COLLABORATION).'
  merge: -1
