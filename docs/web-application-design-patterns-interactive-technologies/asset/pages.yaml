  md: '# Related design patterns


    Despite its comprehensiveness, APPLICATION HELP may not be able to answer all
    users'' questions. Therefore, consider complementing it with HELP COMMUNITY, where
    users can post their questions and get them answered by customer support staff
    or by other users of the application. In addition, consider CLICK-TO-CHAT to allow
    users to get answers to their questions quickly and directly from qualified customer
    support personnel.


    # GUIDED TOURS


    # Problem


    When starting to use a new application or exploring unfamiliar functionality of
    an existing application, users may want to know how to accomplish certain goals
    and/or tasks.


    # Solution


    Offer users how-to guided tours, demos, or step-by-step explanations of how certain
    tasks can be accomplished or how certain functions works (Figure Web.17).


    # Why


    No matter how easy it is to use an application, at least few users are going to
    find functions difficult to understand and use. This may be because of their limited
    domain knowledge or exposure to modes of interaction. Providing guided tours with
    explanations can help instill confidence in new users, not only in terms of how
    to accomplish certain tasks but also something that they can return to and review
    every. Even users who are familiar with the domain and application may want to
    familiarize themselves when attempting not-so-frequent tasks or tasks that may
    be difficult or impossible to understand. Offering guided tours, how-to, or demos
    can help users


    FIGURE WEB.17

    Microsoft Office Communicator shows users how to add communication modes by offering
    guided tours for each communication mode.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_423_0.png)'
  merge: -1
  pgno: 423
- img_proc: true
  md: 'understand an application''s functions and interaction and make it possible
    for them to fully utilize the application set.


    # How


    The main purpose of how-to guides or guided tours is to explain to users how an
    application or certain functionality works. This can be accomplished on one screen
    (Figure Web.18) or may require a guided tour to walk users through each step in
    the task sequence (Figure Web.19). They may also be implemented as video demos
    (Figure Web.20). How-to guides can be implemented either in self-paced mode, demo
    mode, or a combination of both.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_424_0.png)


    Figure WEB.18

    Yahoo! Answers shows how it works on just one screen.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_424_1.png)


    Figure WEB.19 Adobe ConnectNow Quick Start Guide walks users through each step
    for tasks such as “Sharing Your Screen,” “Broadcasting Video,” and so forth.'
