  md: '# GEOLOCATION


    To present appropriate formats for date, time, number, and currency by default,
    many applications use the geolocation approach. Geolocation refers to identifying
    the geographic location of the computer on the Internet. Knowing the geographic
    location of the computer, and the location of its user, web applications can direct
    users to an appropriate region-specific version of the application. For example,
    users from India type www.google.com can be directed to www.google.co.in, and
    those from Japan can be directed to www.google.co.jp. Geolocation can also be
    used to make a reasonable guess about users'' date, time, number, and currency
    preferences. For example, usersaccessing the application from the United States
    can be shown prices in U.S. dollars ($), and for those accessing the application
    from Japan, they can be shown prices in yen (¥).


    Although this chapter addresses a few of the important patterns, internationalization
    and localization are very rich topics. Readers are encouraged to consider the
    resources listed in the References at the end of the book, most specifically del
    Galdo et al. (1996), Aykin (2004, 2006), Yunkers (2002), and Ishida (2008).


    # EXTENSIBLE DESIGN


    # Problem


    Although web applications are designed primarily for users in a region and for
    a language, designers may want to make them available in other regions and languages
    in the future.


    # Solution


    Design web applications so that they do not favor any particular country and,
    when localized, they do not require a complete overhaul of the user interface
    or content, for translation. This requires identifying and separating country-
    and language-specific application elements and the user interface and ensuring
    that none of the localizable elements are “hard-coded” in it.


    # Why


    EXTENSIBLE DESIGN is the core of internationalization. It prepares web applications
    for localization and eliminates the need to create country- or language-specific
    versions. By having only one core version, not only does maintaining code become
    easier, but so does ensuring consistency in the user interface among'
