    # ADVANCED SEARCH


    # Problem


    An important problem faced by users when searching is a large number of search
    results, many of which are neither relevant nor useful to them. Narrowing and
    filtering options are useful, they address the problem after users have been presented
    with search results (the FILTERING pattern later in this chapter). In addition,
    because filtering options typically allow users to refine search results iteratively,
    it may take users several refinement steps before they can get to a meaningful
    search result.


    # Solution


    Offer an advanced search option so that they can precisely formulate their search
    query (Figure 6.11).'
