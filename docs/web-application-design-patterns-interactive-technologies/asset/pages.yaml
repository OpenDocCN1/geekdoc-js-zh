  md: '# CHAPTER 3

    User Authentication


    # INTRODUCTION


    When web applications enable one-to-one interaction and store user-specific information,
    they require users to create an account (REGISTRATION) and choose unique credentials
    to access the web applications. Registering may require users to enter a set of
    alphanumeric characters from a distorted image to prevent spam and ensure that
    registering users are human and not-automated computer programs (CAPTCHA). Completely
    Automated Public Turing test to tell Computers and Humans Apart.


    Once unique credentials are established, users can identify themselves (LOGIN)
    and store access their personal information. After logging in and accomplishing
    desired tasks, users often need a way to exit the application to ensure that unauthorized
    users cannot access and modify their account information (LOG OUT). Many applications
    also have provisions for automatically logging users out after a period of inactivity
    (AUTOMATIC LOGOUT).


    Because many web applications are used occasionally, users often forget their
    login information and need way to retrieve it. Depending on the security level
    of the applications, users may be asked to provide one or more pieces of unique
    information about their account. It can be as simple as providing the email address
    associated with the account or answering one or more security questions that were
    established during registration (FORGOT USERNAME/PASSWORD).


    # REGISTRATION


    Problem


    Web applications often need to uniquely identify users. The reasons include preventing
    unauthorized access to personal and sensitive information (e.g., financial or
    health records), increasing convenience (e.g., storing billing and shipping addresses),
    and enabling sharing (e.g., photos). Despite such benefits, users often hesitate
    when providing personal information and often shy away from applications that
    require them to set up an account.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Choose a plan that fits your needs


    Plans can be changed at any time, feel free to start using Crazy Egg with a free
    plan.


    | | Basic | Grab an account now |

    | --- | --- | --- |

    | | $9/ month | Email |

    | Visits you can track per month | 10,000 | 10 | |

    | Pages you can track at once | ✓ | Re-type password |

    | Advanced Features | ✓ | |

    | Live Reporting | ✓ | [ ] I have read and agree to the Terms of Use and the Privacy
    Policy [CANCEL] [SUBMIT] |


    FIGURE 3.1

    Crazy Egg has one of the shortest and simplest registration forms. To register,
    users only need to provide their email address and password and agree to the terms
    of use and privacy policy.


    # Solution


    Delay registration for as long as possible and allow users to explore the application
    so that they fully understand the benefits of setting up an account. In addition,
    if users are willing to forego some convenience, it is possible for them to transact
    without registering. Topixnet found a significant increase in the number of posts
    and a substantial improvement in their quality when they removed the registration
    requirement from their discussion forums (Blake, 2006). When registration is unavoidable,
    clearly indicate the benefits of registration and ask users only for the information
    necessary to set up an account (Figure 3.1).


    # Why


    For most applications, setting up an account or registering is not one of the
    users'' goals. Their goals typically include purchasing an item, sharing information,
    paying bills, and so forth. Asking users to register is usually an interruption
    in their interaction experience, since it distracts them from their primary goals.
    Therefore, registration should be delayed as long as possible. This is common
    in e-commerce applications (e.g., Amazon, Buy.com), content portals (e.g., Yahoo!,
    MSN, Morningstar!), and content-sharing applications (e.g., Flickr, Tumblr, SlideShare),
    which allow users to explore content without a user account. Only when users want
    to make a purchase, add content, make comments, or customize an application''s
    look and feel do these well applications require users to register. Thus, delaying
    registration also allows users to experience the application''s benefits and better
    understand the need and value of setting up an account.


    # How


    First and foremost, keep registration forms as short as possible and ask only
    for essential information (Figure 3.2). For most applications, this includes a
    unique username (or user ID or email address) and associated password.'
