    # USE CULTURALLY RELEVANT METAPHORS


    In North America, using a shopping cart is a valid metaphor for purchasing items
    because it easily translates to users'' real-world experience. In Europe and Asia,
    however, a shopping cart icon could cause confusion because users are more familiar
    with shopping baskets than with carts. E-commerce sites should change labels and/or
    images when serving customers in those countries (Figure 10.9).


    # USE PLAIN LANGUAGE


    Avoid confusing native speakers by using plain language and refraining from slang
    and colloquialisms in text. In addition, be sensitive when using greetings such
    as "Welcome, <first name>" for applications that may be used by non-American users.
    North American culture is very informal compared to other cultures, as evidenced
    by low Power Distance Index in Hofstede''s cultural dimensions (see www.greet-hofstede.com/hofstede_united_states.html).
    In Asia, informality would be considered inappropriate, as people are usually
    addressed by their last name. Greetings used by Amazon or Flickr are more appropriate
    for applications with international audiences (Figure 10.10).


    In general, to make localization easier, avoid the following when developing web
    content (Hurst, 2007):


    +   * Words with multiple meanings

    * Abbreviations

    * Mnemonics

    * Acronyms

    * Slang or jargon

    * Gender notation

    * Creation of new words

    * Shortened plurals or word combinations

    * Anything that portrays a way of life or culture specific to one country'
