  md: '# Action Buttons


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_42_0.png)


    ```

    ## Please log in first and then we''ll send you right along.

    Username: [ ]

    Password: [ ] I forgot my password/username

    [ ] Remember me on this computer

    [Sign in]

    ```


    # ALIGN PRIMARY ACTION BUTTONS WITH INPUT ELEMENTS


    Align primary action buttons with input elements (Figure 2.33). In an eye-tracking
    study conducted by Wrolebleski and Etre (2007), aligning command buttons with
    input elements lead to faster completion times, as it provided a clear path to
    completion for users.


    # ENABLE PRIMARY ACTION WHEN USERS PRESS “ENTER"


    The primary action for a form should be the default action when users press the
    “Return” or “Enter” key. This is particularly important for forms with only one
    input field, as “Search.” This can be accomplished in HTML by setting the primary
    action button type to “Submit,” as shown in the following examples:


    ```

    <input type="submit" value="Save Changes" />

    <button type="submit">Save Changes</button>

    ```


    # BE CAREFUL DISABLING THE PRIMARY ACTION


    On short forms, it may be acceptable to disable the primary action until users
    have filled in the required fields (Figure 2.34). Such a practice can avoid errors
    caused by inadvertent submission of forms without all the required information.
    However, such practice may be inappropriate for longer and complex forms because
    users may not know why the primary action is unavailable. They may then incorrectly
    conclude that the form is not working and abandon the form.


    # DISABLE THE ACTION BUTTON AFTER THE FIRST CLICK


    Performing the same action multiple times (by repeatedly clicking the action button)
    could have undesirable consequences. For example, repeatedly clicking the action
    button may place an order multiple times or buy/sell orders on stocks multiple.
    In such instances, disable the action button or remove the action button and replace
    it with text as “Processing...” or “Please Wait.... This will acknowledge users’
    actions and indicate that the web application is waiting for a response (Figure
    2.35).'
