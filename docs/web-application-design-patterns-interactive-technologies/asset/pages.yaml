    # ENSURE THAT CUSTOMIZATION IS OPTIONAL


    As mentioned, users are not likely to customize the interface often, and many
    users won''t customize at all (Mackay, 2011). Therefore, it''s important that
    the web application be useful and useable without any customization.


    # Related design patterns


    Because PORTALS usually have to support a large amount of content, they typically
    allow users to customize content and appearance. However,'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# CHAPTER 4 Application Main Page


    requires effort on the users'' part. Therefore, if it''s possible to infer their
    needs and content can be personalized—for example, based on information provided
    by them—consider complementing customization with PERSONALIZATION approaches.


    # BLANK SLATE


    # Problem


    Many web applications start out empty because they rely on provide data (e.g.,
    a defect-tracking application, online calendar, to-do list, etc.). Although the
    application pages will fill up eventually, the first users access the application
    (or a new functionality within the application) they will see an empty page—a
    “blank slate.” They may be confused as to what to do next and get an impression
    that the application is not working as desired when they see a page without content.


    # Solution


    On the blank-slate page, answer questions that first-time users would have such
    as to get started, what to do next, and what will the page look like when filled
    in with data (37signals, 2006). This can be accomplished by explaining to users
    the best ways to get started via tutorials and help texts and/or show a typical
    screenshot of the page filled with content (Figure 4.32).


    # Why


    Any guidance that can be offered to users during their initial interaction with
    a web application makes them feel comfortable with the application and helps them
    started quickly. In addition, when faced with an empty page, users may find it
    difficult to determine scope and the extent of functionality offered by the web
    application, thus limiting the degree to which they are able to interact with
    the application.


    Having a blank-slate page serves several purposes for users: it sets appropriate
    expectations, encourages taking action, familiarizes them with what the page will
    eventually look like, and creates a positive first impression of the application
    (Hoekman, 2008; 37signals, 2006).


    # How


    An important design feature of an effective blank-slate page is one or more prominently
    displayed action(s) that would remove the blank slate and get users familiar with
    the application (Figure 4.33).


    The actions may be accompanied by messages informing users why they are not seeing
    any content. For example, Basecamp uses messages such as “Create the first whiteboard
    for this project” with “first” implying that users have not created a whiteboard
    (Figure 4.34).'
