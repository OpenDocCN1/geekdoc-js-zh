    was used and comments on the evidence of successful use or contexts in which its
    use was found to be inappropriate.


    A good example is UI Pattern Factory. It allows users to contribute examples using
    Flickr. Users can join the Flickr group (UIPatternFactory.com), upload screenshots,
    tag them with the pattern name, and submit them


    +   * With'
