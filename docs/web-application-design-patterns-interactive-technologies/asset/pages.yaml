  md: '# Highlight


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_377_0.png)


    **Figure 12.18** Dell uses several highlighting strategies on this page: use several
    highlighting strategies on this page: items are highlighted with a green background,
    and changed and upgraded configuration items are highlighted in the "My Components"
    section with a yellow background.


    +   - Showing which elements are selected.

    - Indicating if an element is particularly important.

    - Indicating an element is undergoing change.

    - Prompting users to act on an element.


    Highlighting is particularly important for pages communicating different states
    for a wide variety of elements, since it not only directs users'' attention but
    also invites appropriate action.


    # How


    There are several ways to highlight a page''s elements to make them stand out:
    change the background color, change the text color, make the text bold or a larger
    size, change borders, use animation (the patterns ANIMATIONS/TRANSITIONS and SPOTLIGHT/YELLOW-FADE
    in Chapter 8), dim some elements, or use icons. Ideally, a combination of these
    styles (Figures 12.19 and 12.20).


    # HIGHLIGHTED SELECTED ITEMS IN A LIST


    Clearly identify items with which users are working or will be taking action by
    highlighting each selected item. Even when checkboxes are used for selection,
    highlighting is a better visual usual of distinguishing selected items from unselected
    items (Figure 12.21).


    # USE TRANSIENT HIGHLIGHTING TO INFORM USERS OF PAGE CHANGES


    Highlighting an item momentarily (typically by fading the highlight in and then
    fading it out) creates an animated effect and focuses users'' attention on the
    changed area on the page (see the ANIMATIONS/TRANSITIONS and SPOTLIGHT/YELLOW-FADE
    patterns in Chapter 8).'
