    # NUMBER FORMAT


    # Problem


    Conventions around the world for representing numbers vary in terms of group and
    decimal (i.e., fractional) separators, precision required, units of measure, and
    so forth.


    # Solution


    Follow the conventions, formats, and regulations of the country from which users
    are accessing the application.


    # Why


    There are no universally accepted conventions for representing numbers. They differ
    widely among countries. Since users cannot be expected to be familiar with conventions
    of other countries, the usable option is to present numbers in formats they are
    most accustomed to seeing.


    # How


    When showing numbers, the whole (or integer) portion of a number is usually split
    into groups by a separator. The way number groups are created and the separator
    is used around the world (Figure 10.18). In the United States, numbers are shown
    in groups of three, separated by commas (e.g., 1,000,000); in India, numbers are
    shown in one group of three and then in groups of two, separated by commas (e.g.,
    10,00,000); and in Japan, large numbers are created by grouping digits in 10000s
    separated by ideographic characters that represent powers of 10000 (e.g., 1亿0000万).'
