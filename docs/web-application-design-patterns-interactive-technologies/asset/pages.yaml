    # INDEXES


    Indexes are alphabetical or alphanumeric lists of items in an application or its
    high-level categories. When users know a specific item that they are looking for,
    using an alphabetical index may be a more efficient way to get to it when compared
    with navigating the application hierarchy.³


    For large applications, the alphabetical index may be divided over multiple pages
    with one or more pages representing a letter of the alphabet or a number (Figure
    5.21). Because most people are familiar with alphabetical indexes in other information
    sources, their use would not require any instructions.


    Another way to quickly get to a known item is by searching (see Chapter 6 for
    patterns related to searching).'
