  md: '# CHAPTER 6 Searching and Filtering


    # FACETED SEARCH


    # Problem


    When presented with a large number of search results, users may find it difficult
    to locate the desired item(s). Although they can apply filters to their search
    result set, the possibility of an empty list of results with certain filtering
    options cannot be avoided.


    # Solution


    Allow users to narrow down the items in the search results based on the relevant
    item attributes (i.e., facets) (Figure 6.42). Narrowing search results by selecting
    a facet essentially makes search criteria more precise, which is used to search
    within refine them. With each refinement to the result set, facets are updated
    to reflect attributes that are available in the updated search result set. Users
    can then use the updated facets to further narrow down results to a manageable,
    browsable set.


    # Why


    Faceted search allows users to reduce the number of search results quickly to
    get to the desired item(s). Showing narrowing options (facets) is easier for users
    because they don''t have to know the syntax to specify their search precisely.
    Because narrowing attributes are derived from the search result set, users are
    never left with an empty result set. In addition, by seeing all available options,
    users can better understand how data are structured and use that information to
    find better searches in the future.


