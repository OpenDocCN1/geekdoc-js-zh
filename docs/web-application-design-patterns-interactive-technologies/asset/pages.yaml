    ### What''s a Pattern?

    A pattern is an established solution to a recurring problem.


    Recent Patterns: Calendar Picker


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_386_1.png)


    | Calendar Picker | Carousel | Collective Achievements |

    | --- | --- | --- |

    | Users need to find a particular piece of information before or after a date
    range. | Carousel needs to show a set of objects represented predictably. | Some
    patterns encourage communities to collect and display awards |


    FIGURE 13.1 Yahoo! Developer Network''s Design Pattern Library is available as
    an open-source pattern library. It offers interaction designs a stencil kit to
    facilitate development of frameworks and maps patterns to code snippets in the
    YUI library to help with its development.


    # Solution


    Develop a repository of design patterns (i.e., a pattern library), documenting
    the knowledge of design problems, solutions, rationale, and best practices for
    implementing the patterns (**Figure 13.1**). In addition, share the pattern library
    with other designers and developers, promote use and reuse of patterns by incorporating
    implementation code snippets (i., components), and encourage designer and developer
    productivity.


    # Why


    For large and/or distributed design teams within a corporation, it is common to
    find different user interface designs and interaction approaches for the same
    problem across different product lines; they often have different visual treatments
    as well. This results in inconsistent contexts, which can lower usability and
    weaken the corporate brand (Malone et al., 2005). By facilitating reuse of design
    solutions, pattern libraries offer an effective way of documenting and sharing
    solutions for recurring design problems and help make the design process even
    more efficient and increase the productivity of designers by reducing duplicate
    research and minimizing "reinventing the wheel" (Malone et al., 2005).


    Although patterns are design solutions independent of implementation issues, design
    and development teams can further reduce the time spent on user interface development
    by building software components to support'
