    By default, they offer the groups "best friends," "family," "school," and "work";
    users can create their own groups and put the same friend in more than one group.


    # ALLOW US TO GROUP THEIR FRIENDS


    Users may want to group their friends to make finding them easier—for exams, they
    may want to group them based on the nature of their relationship or the frequency
    of their interaction with them. To afford flexibility in how they want to organize
    their friends, allow them to create their own groups. If users have created groups,
    assigning friends to a group part of the accept (or "request to add") process
    (Figure 9.45).


    # MAKE THE FRIEND LIST EASILY ACCSIBLE


    Among the common reasons users visit social applications is to interact with their
    friends or see their status and history. To enable quick access to such information,
    make it easy for them to access their friend list. Most social applications allow
    users to see a list of friends on their home pages.


    # ALLOW US TO VIEW THEIR FRIENDS'' ONLINE STATUS


    An important reason to maintain a friend list is to enable messaging between friends
    (both synchronously and asynchronously). To initiate synchronous messaging (i.g.,
    chats), it''s important to know if a friend is online (Figure 9.46); see the MESSAGING
    and PRESENCE INDICATOR patterns later in this chapter.


    # Related design patterns


    To promote communication with friends, both the MESSAGING and PRESENCE INDICATOR
    patterns usually accompany FRIEND LIST. In addition, to make it easy to find people,
    a friend list is often shown as an IMAGE GRID (see Chapter 7).'
