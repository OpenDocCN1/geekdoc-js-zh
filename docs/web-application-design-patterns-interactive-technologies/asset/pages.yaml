  md: '# Why


    In contrast to hierarchical navigation based on only one attribute, faceted navigation
    offers users the ability to navigate to desired items based on several attributes.
    In addition, users can select any available attribute to start their navigation.
    Another important benefit is that an empty result set is not possible with faceted
    navigation. Because faceted navigation itself is generated from "facets" (or attributes)
    of the remaining items, users select at least one at the end of the navigation.
    In fact, this is one important difference between faceted navigation (or faceted
    searching) from filtering (see the FILTERING and FACETED SEARCH patterns in Chapter
    6).


    # How


    Show users all available facets to start their navigation (Figure 5.17). After
    users have selected the initial facet, show items belonging to the selected facet
    along the updated navigation choices derived from remaining items’ facets. Additional
    facets may be placed vertically to the left or horizontally above the items depending
    on the total number of facets available and the overall application design: horizontal
    placement may be limiting for items with several facets (Figure 5.18).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_121_0.png)


    FIGURE 5.17 Ephemeral users offer several facets to choose from recipes.


    # KEEP USERS INFORMED OF THEIR SELECTIONS


    Avoid disorientation by showing their users with mechanisms such as BREADCRUMBS
    above the item list (Figure 5.19). (See the BREADCRUMBS pattern later in this
    chapter.)'
