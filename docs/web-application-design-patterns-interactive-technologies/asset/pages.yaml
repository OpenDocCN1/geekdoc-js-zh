  md: '# CHAPTER 8


    # Rich Internet Applications


    # INTRODUCTION


    As discussed in Chapter 1, Rich Internet Applications (RIAs) can deliver responsiveness
    and interactivity comparable to desktop applications. With RIAs, the interaction
    seems continuous and dynamic because users do not have to wait for pages to refresh
    for basic data and layout updates and can immediately see the results of their
    actions.


    Perhaps the earliest rich interaction in web applications was a RICH-TEXT EDITOR,
    which enabled users to outline formatted text on pages without knowing the underlying
    HTML (HyperText Markup Language). With the advent of technologies such as Flash
    and Ajax (Asynchronous JavaScript and XML), richer interactions have become possible
    because they allow communications with web servers without explicit "submit" actions.
    Their initial use, therefore, has to be replaced by interactions that require
    users to wait for results by page refresh. By validating user input and providing
    necessary feedback to users when filling out forms (RICH FORM); (AUTOSUGGEST/AUTOCOMPLETION);
    allowing users to edit information in the same location it''s being viewed (EDIT-IN-PLACE);
    panning and zooming around the information space (OVERDRAW-PLUS-DETAIL); sorting
    and filtering information in real time (DYNAMIC QUERYING); and previewing the
    effects of user changes (LIVE PREVIEW). Enabling such richer interactions requires
    use of direct manipulation techniques common in desktop applications such as DRAG-AND-DROP
    and interactive controls such as SLIDERS.


    In addition, communicate changed effects on the page and help users maintain their
    visual content, designers have started relying on visual effects (ANIMATIONS/TRANSITIONS).
    Popular techniques include showing delays and progress in retrieving data (DELAY/PROGRESS
    INDICATOR); briefly highlighting changed information on a page (SPOTLIGHT/YELLOW-FADE);
    and allowing users to browse through a large set of items in a limited space'
  merge: -1
