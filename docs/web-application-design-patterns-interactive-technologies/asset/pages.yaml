    For lists that support both dedicated and shared actions (see Figure 7.50), if
    not separated, clearly indicating which actions apply to individual items and
    which apply to multiple items would be a design challenge.


    # How


    Place dedicated actions in the same row as the list item and repeat them for each
    item in the list, and place shared actions outside the list. If users may select
    one or more items, like in many web-based email applications, placing both dedicated
    and shared actions outside the list is acceptable when it helps reduce visual
    clutter (Figure 7.51). However, consider disabling dedicated actions when users
    have selected more than one item in the list.


    # HIGHLIGHT THE ROW CORRESPONDING TO THE SELECTED ITEM


    Showing items with only checkboxes often doesn''t give enough visual indication
    about their selected states. A common approach to make selected items salient
    to highlight corresponding rows by changing their background colors (Figure 7.52);
    also see the HIGHLIGHT pattern in Chapter 12.


