  md: 'Although it could be argued that peer recommendations are based on past interactions,
    transactions, or services provided, and there are other similar forms of reputation
    systems, an important difference is that the recommendation is phrased directly
    toward the person rather than the services offered or products sold by him or
    her—that is, “recommend this,” instead of “recommend services offered by this
    person.”


    # Related design patterns


    Both RATINGS and REVIEWS patterns may accompany REPUTATION because gaining reputation
    requires users to rate and review the transactions and activities they are involved
    with.


    # DISCOVER NETWORK MEMBERS


    # Problem


    Users new to a social application may not know how to connect with others with
    similar interests or whom they have lost. In addition, users who are part of other
    community-based applications may want to find out anyone on their current “friends”
    list is already a member of the community they are joining.


    # Solution


    Make it easy for users to discover network members based on common interests,
    past workplaces, other online communities, and contacts (i.e., email address books)
    (Figure 3.99). In addition, recommend friends based on users'' profiles and interests
    to make it easy for users to find new “friends.”


    # Why


    Social networking or community-based applications revolve around connecting users
    with current, past, and potentially future friends and colleagues. Without an
    easy way to connect with them, the community aspect of the application disappears.


    # How


    Social networking applications can help users discover friends in a myriad of
    ways: by email address books, messenger (IM) buddy lists, users'' existing networks,
    recommendations, and searches. Having multiple ways to discover connections is
    important, since users may not have filled out their profiles completely and may
    use email addresses differently than those in their address books.


    # ALLOW DISCOVERY OF FRIENDS BY EMAIL ADDRESS BOOKS


    Enable users to import their existing address books from popular email applications
    such as Outlook, Gmail, Yahoo! Mail, and so forth (Figure 9.40).'
