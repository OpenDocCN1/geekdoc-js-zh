  md: '# AVOID GRATITOUS ANIMATIONS


    Animation is an effective tool only when it serves a specific purpose such as
    communicating state changes and/or improving interaction.


    Because animated elements of a page draw users'', frivolous animations divert
    users'' focus from valuable page information. Therefore, do not use animation
    gratuitously—all it does is distract. Gratuitous animations that do not communicate
    visual effects such as using a marquee (of course, it is acceptable when showing
    a stock ticker tape).


    # Related design patterns


    Another way to keep users informed of changes in the interface is to use the DELAY/PROGRESS
    INDICATORS and SPOTLIGHT/YELLOW-FADE patterns.


    # DELAY/PROGRESS INDICATORS


    # Problem


    Even though RIAs strive to provide real-time feedback, users often face noticeable
    server or processing delays before processing is complete and new information
    is presented.


    # Solution


    Show users either a delay indicator to suggest the system is busy processing the
    request (Figure 8.39) or a progress indicator not to indicate that the system
    is busy but also indicate progress in terms of percentage complete, stage of processing,
    time remaining, or a combination thereof (Figure 8.40).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_247_0.png)


    FIGURE 8.39 Amazon''s progress indicator for diamond search (short delay).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_247_1.png)


    FIGURE 8.40 Kayak uses a progress bar when retrieving matching flight information
    (long delay).'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# CHAPTER 8 Rich Internet Applications


    # Why


    Showing wait/progress indicators serves two purposes:


    +   1. They let users know the application has received their request and is working
    on it.

    2. They keep users informed about where the application is in terms of processing
    the request.


    Users can use this information to anticipate the amount of time they have to wait
    and can cancel the operation. Like the ANIMATIONS/TRANSITIONS pattern, progress
    indicators provide necessary feedback to users and keep them informed of their
    system status (Galitz, 2002; Nielsen and Molich, 1990).


    # How


    Different approaches may be used to indicate progress depending on the length
    of the delay. For shorter delays (less than 10–15 seconds), progress indicators
    may take the form of:


    +   - A text message such as “loading” or “please wait...” (Figure 8.41).

    - An animated icon (e.g., an hour-glass) (see Figure 8.36).


    For longer delays (more than 10–15 seconds), use a progress bar that shows the
    extent of progress and indicates the status and/or an estimate of time. If completing
    an action is going to take a long time, let users cancel the operation at any
    time (Figure 8.42).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_248_0.png)


    FIGURE 8.41 Kayak uses an “Updating results” message for shorter-durations.


    FIGURE 8.42 When loading a photo, Picnic shows a progress bar that shows the extent
    of progress. Users are also offered the option to cancel the upload process at
    any time.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_248_1.png)'
  merge: -1
  pgno: 248
- img_proc: true
  md: '![](img/4da2afa2580415d3d4ff98025db0a2c3_249_0.png)


    For really long delays, show status information or other engaging content to

    shorten the perception of the delay (Figure 8.43).


    # Related design patterns


    Processing delays, usually shorter ones, are quite common in DYNAMIC QUER-

    ING and EDIT-IN-PLACE implementations. If users need to be informed about

    page changes when processing is complete, the SPOTLIGHT/YELLOW-FADE

    pattern may be useful.


    # SPOTLIGHT/YELLOW-FADE


    # Problem


    Often it is important to direct user attention to a specific page change either

    cused by a user action initiated by the system. Because the change is not

    significant enough to keep the updated information highlighted (see the

    HIGHLIGHT pattern in Chapter 12) and several elements on the page

    over a period of time, permanently highlighting may make the

    interface appear cluttered. Offering messages that inform users of changes

    for monitoring-applications that show live data, such as stock quotes or

    sscores, may make the interface jump and distracting, as values on such

    changes change frequently.


    # Solution


    Highlight the changed area for a very brief period—like a spotlight—to create

    an animation-effect that draws user attention. This approach is a generic

    version of the yellow-fade technique proposed by Linderman (2004) to subtly

    spotlight a recently changed area on a page (Figure 8.44).


    # Why


    This brief highlighting approach helps provide animated effect to get

    users to quickly catch the change when relatively small changes are hap-

    pening on the page. Additionally, because the effect is transient, users not

    are distracted by the highlight and can return to the task at hand, but the

    interface remains uncluttered as well.


    # How


    Highlight changed content briefly (no more than a few seconds) to create

    animation-like effect. Choose an unsaturated highlight color that provides a

    oticeable contrast from the rest of the background (Figure 8.45).'
  merge: -1
