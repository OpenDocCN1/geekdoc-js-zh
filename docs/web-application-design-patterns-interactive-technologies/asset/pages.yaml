    # ALLOW DISCOVERY OF FRIENDS BASED ON USERS'' PROFILES


    Another option is to allow users to discover friends on their profiles. Once users
    have completed at least part of their profiles with information about their workplace
    or educational institutions, inform them about users who match their information
    (Figure 9.41).


    # ALLOW DISCOVERY OF FRIENDS BASED ON EXISTING CONNECTIONS


    Allow users to explore their friends'' profiles and view friends'' friends to
    make possible for them to discover common friends they didn''t know were part
    of the community. In addition, rather than making users browse friends'' profiles
    to discover common friends, the application can periodically discover friends
    from users'' connections who they may know.


    # ALLOW USERS TO SEARCH OTHER COMMUNITY MEMBERS


    Allow users to search for people (Figure 9.42) in addition to allowing them to
    discover members based on their profiles, address books, and buddy lists (see
    SAMPLE SEARCH AND PARAMETRIC SEARCH in Chapter 6).


    # REQUIRE CONFIRMATION OF “FRIEND” REQUESTS


    While it''s easy to find network members with whom users want to connect (i.e,
    a “friend”), it should not be an automatic process. It''s important that requests
    to “friend” someone are acknowledged and confirmed before adding them to their
    friends. In addition, when accepting a request to become a friend, it helps them
    to indicate the nature of their relationship. This information can be used to
    update profiles (and make them more complete) and further discover network members
    with whom users can connect.


    # SUPPORT THIRD-PARTY INTRODUCTIONS


    Users may want to “friend” with users they do not know. Although users should
    be permitted to send direct requests to add them to their network, if there’s
    a mutual friend that both users know, allow them to be introduced. This may help
    reduce hesitation on the part of both users in becoming friends.


    # ALLOW USERS TO “FOLLOW” OTHERS


    Offer recently popular “following” approach called “following,” users can visit
    other users’ profile pages and choose to “follow” their activities (or “status”
    in Twitter’s case) (Figure 9.43).'
