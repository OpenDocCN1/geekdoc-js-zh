    consider using the GLOBAL GATEWAY pattern to capture users'' country and language
    preferences.


    # TIME FORMAT


    # Problem


    Like date format, time formats vary from one region to another. Although each
    time format shows hours, minutes, and seconds, their presentation order and separators
    often vary in terms of a 12- or 24-hour format; the character used to separate
    hours, minutes, and seconds; leading zeros; the display of time zones; and the
    use of daylight savings times.


    # Solution


    Whenever possible, show time in users'' local time zones and use local conventions
    for showing time—that is, either the 12-hour AM/PM system or 24-hour system (Figure
    10.14).


    If time cannot be represented in users'' native format, use ISO 8601 recommendations,
    which use the 24-hour system with either hh:mmss extended format, where:


    +   * hh represents hours between 00 and 24.

    * mm represents minutes between 00 and 59.

    * ss represents seconds between 00 and 59 (or 60 in the exceptional case of an
    added leap second).


    # Why


    Users are likely to be most familiar with the local convention for their time
    zone and may be uncertain about the time when presented with other conventions.
    In addition, when time is presented in a different country''s time zone, users
    may not know how to convert it to their local time zone or may make errors when
    converting it.


    # How


    Whenever possible, show time based on users'' local time zones or stated preferences.
    In cases where the event or activity occurs in a different time zone,


