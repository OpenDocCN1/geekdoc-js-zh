    # Related design patterns


    PROGRESSIVE LAYOUTs provide a graceful solution to counter arguments against designs
    using fixed- or liquid-width layouts. However, depending on the nature of the
    content presented by the application, either FIXED-WIDTH LAYOUT or LIQUID-WIDTH
    LAYOUT may be more appropriate and should be considered during design.


    # GRID STRUCTURE


    # Problem


    Users need to clearly see and understand relationships between different page
    elements. Not using a systematic approach to lay the page and its elements may
    lead to a cluttered design and make it unnecessarily complex.


    # Solution


    Using a grid-based system for placing and aligning web page elements, giving web
    pages a visual structure and coherence and making it easy for users to understand
    the content''s organization(Figure 12.8).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_369_0.png)


    FIGURE 12.8 Using GRID STRUCTURE for positioning and aligning components on this
    page is quite obvious. Not only does this make the page pleasing to the eye, but
    it also makes it easy to discern the visual hierarchy of page components (see
    the VISUAL HIERARCHY pattern next).'
  merge: -1
