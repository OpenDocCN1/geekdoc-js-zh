    For your convenience, these documents will be emailed to your Yahoo! Mail account.


    FIGURE 3.13 CAPTCHA on Yahoo''s registration page.


    Decoding distorted images is used as a validation that a user is human and not
    an automated agent, since automatically decoding a distorted image is computationally
    intensive. This method is referred to as CAPTCHA, which stands for Completely
    Automated Public Turing test to tell Computers and Humans Apart (Ahn, Blum, and
    Langford, 2004).


    # Why


    An increasing number of automated crawlers on the Web have made it difficult to
    distinguish from legitimate users. By asking users to do something that is relatively
    easy for humans but difficult for automated crawlers, the use of CAPTCHA makes
    it difficult, if not impossible, for bots and crawlers to interact with the application
    and submit forms.


    # How


    CAPTCHA images typically have four to five distorted alphanumeric characters;
    the alphabetical characters in the image may include both uppercase and lowercase
    cases. In addition, they may have lines through them, more than one distorted
    word, noisy backgrounds, and so forth (Figure 3.14). Users are asked to decode
    the image and enter the alphanumeric characters in the correct order (may or may
    not be sensitive) before submitting the form. Upon submission, the response is
    verified, and users are either taken to the next step or presented with an error.


    Recently, some sites have included math problems in CAPTCHA images such as 2 +
    4 or 4 × 2 that users must answer (Figure 3.15).


