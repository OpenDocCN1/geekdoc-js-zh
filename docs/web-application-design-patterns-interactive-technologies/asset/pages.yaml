    In addition, consider a matrix view when data can be filtered by row and columns
    individually or combined (Figure 7.15).


    # ALLOW USERS TO SEE ALTERNATE VIEWS OF TABULAR DATA


    Offer alternative views of tabular data when they help users understand data better/or
    make it easier for them to find desired items. For example, when viewing reports
    on e-commerce applications, it is common to allow users to switch between textual
    and graphical views (Figures 7.16 and 7.17).


    # IMPROVE THE ACCESSIBILITY OF TABULAR DATA


    Improve the accessibility of tabular information by including the following in
    the HTML markup (see also the ACCESSIBLE TABLES pattern in Chapter 11):


    +   1. Describe the table''s content using the <CAPTION> tag and the <SUMMARY>
    attribute. Include a short text describing the table''s content. Unlike the <CAPTION>
    tag, the content of which is visible to users, the content within the SUMMARY
    attribute is not rendered on the page but provides a more detailed description
    of the table''s content to those using alternate browsers.

    2. Describe the relationship between column or row headings and the responding
    data by using the SCOPE attribute in the <TH> tag, which helps users establish
    context for the table''s data.


    # Related design patterns


    Most lists need to be filtered; the FILTERING pattern in Chapter 6 and the DYNAMIC
    QUERYING pattern in Chapter 8 for the choices available to designers for narrowing
    large lists. Large lists typically cannot show all items on the same page, so
    PAGINATION is often an integral part of tabular lists; consider CONTINUOUS SCROLLING
    as an option as well (see Chapter 6).'
