    # MESSAGING


    # Problem


    One of the reasons users participate in an online social community is to be able
    to communicate with one another. This may be in the conversation (i.e., chat)
    or as a message that can be responded to later. Also, in instances, users may
    want to send a broadcast message—that is, send a message to several people at
    once—and they may not necessarily need a response.


    # Solution


    Enable users to communicate with each other synchronously (e.g., chat) or asynchronously
    (e.g., messages, poks, scraps, etc.) (Figure 9.53).


    # Why


    An important aspect of being in an online community and sustaining it is to encourage
    communication among its members. The easier it is for users to communicate with
    each other, the more likely that the community will thrive and be able to sustain
    itself.


    # How


    Allow users to communicate with each other synchronously in real time using Instant
    Messaging (IM) features (e.g., chat), as well as asynchronously via messaging
    to one another or posting messages on a shared public area. The most common asynchronous
    messaging options are to allow users to send private messages to an individual
    (e.g., “walls”) (Figure 9.54) or posting comments on shared areas


    # TO FACILITATE CHAT, SHOW FRIENDS'' ONLINE STATUS


    Because synchronous messaging requires users to be online simultaneously to initiate
    conversation (Figure 9.55); see also the PRESENCE INDICATOR pattern next for additional
    details.'
