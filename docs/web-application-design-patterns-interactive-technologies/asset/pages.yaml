    # **CONSIDER OPTIONS OTHER THAN CLICK-TO-CHAT**


    With online tools like chat, users do not expect or like to wait for a few minutes.
    In the event the wait may be too long or if live chat is unavailable, consider
    offering other options such as an email address, phone number, or a click-to-call
    feature (Figure Web.35). The click-to-call option allows users to ask the customer
    service agent to call during a specific timeframe.


    # **Related design patterns**


    CLICK-TO-CHAT information is extremely useful as an input to all types of help
    available to users. Knowing users'' questions can be used to improve CONTEXTUAL
    HELP, FREQUENT ASKED QUESTIONS, AND APPLICATION HELP.'
