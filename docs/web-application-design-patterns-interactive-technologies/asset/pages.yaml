  md: '# CONSIDER OFFERING NOTIFICATION OPTIONS


    Asking users to save their searches may not be enough, because users may not remember
    to check their saved searches regularly and review updates. Even when they rerun
    their searches, they may find it difficult to identify changed items. Make saved
    searches more useful by offering users the option to create alerts and set up
    notification so they can be informed of changes (Figure 6.49).


    A more recent trend is to allow users to save their searches as email alerts or
    subscribe to Really Simple Syndication (RSS) feeds (Figure 6.50). Once subscribed,
    users can use an RSS reader software to monitor the feeds for updates. This eliminates
    the need for users to sign in to the application to access their saved searches.


    # Related design patterns


    If two or more users have the need to perform the same search, allow users to
    share their saved searches with other members in their group (see the SHARING
    pattern in Chapter 9).'
  merge: -1
