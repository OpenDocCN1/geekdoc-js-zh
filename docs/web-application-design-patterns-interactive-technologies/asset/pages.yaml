    # ALLOW USERS TO FILTER LARGE LISTS


    Filters help users navigate a large number of items in a list to a manageable
    set (see the FILTERING pattern in Chapter 6). If narrowing options are attributes
    contained in the list and users are likely to narrow down by only one of them
    at a time, filters may be embedded in the tabular list itself (Figure 7.13).


    On the other hand, if not all of the filtering options are available in the list
    and users are likely to filter by more than one option at a time, show filtering
    options separately above the list (Figure 7.14).


