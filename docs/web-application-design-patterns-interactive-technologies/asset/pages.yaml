  md: '# Help Community


    17


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_428_0.png)


    FIGURE WEB.23 Dell Forums for Notebooks.


    # Why


    Providing users with an open venue to discuss and share problems, solutions and
    experiences makes it easier for them to have their questions answered and solved.
    Often, the most active users on forums are expert users who may have encountered
    unusual problems and may come up with innovative solutions and workarounds that
    can provide useful insights into application designers. Such information may then
    be used to improve help as well as the application''s functionality and usability.


    In addition, allowing users to share and share problems and solutions makes it
    easy for them to find any answer, and they do not have to wait on the phone for
    a customer support person to solve their problems.


    # How


    Make it easy for users to share their experiences in either a forum (i.e., discussions)
    or a blog format and enable them to find answers to their questions. This self-service
    approach becoming common for both large corporations and start-ups (Figures Web.24
    and Web.25).


    INTEGRATE COMMUNITY HELP WITH THE APPLICATION

    Instead of treating help community as a standalone application, as is often the
    case, integrate it with the application contextual help. This allows users to
    access relevant discussions and post or answer questions (Figure Web.26).


    MONITOR HELP COMMUNITY VENUES TO CONTROL SPAM, SLANDER, AND ACCURATE INFORMATION


    Help communities are a double-edged sword. On the one hand, they afford a self-service
    channel and make it easier for application users to get desired help?'
