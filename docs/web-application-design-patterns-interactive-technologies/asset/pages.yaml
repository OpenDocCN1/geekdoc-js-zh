    # ASK USERS INTRODUCTORY OR QUALIFYING QUESTIONS


    Before starting a chat session, ask users to provide basic introductory information
    such as their name and question. This information can be used to direct users
    to the most qualified customer support person. In addition, when the chat option
    is available only to subscribers or customers, ask users to provide appropriate
    identifying information such as their account number (Figure Web.33).


    In addition, for potentially lengthy chat sessions (e.g., for technical support)
    where it may be necessary for the agent to follow up (or make it easy to reconnect
    after a dropped session), ask users to provide their email address and/or phone
    number as well; an email address is useful if users are sent a transcript of the
    chat session.


    # ALLOW USERS TO KEEP A COPY OF THE CHAT DIALOGUE


    Offer users an option to print, or receive via email, a copy of the chat dialogue
    (Figure Web.34). A copy of the chat dialogue can be especially useful if the support
    agent described the steps must to fix a problem or provided links for references
    that users intend to access later. If users were not asked for'
