    # Related design patterns


    On the SEARCH RESULTS page, users may want to reorder results using criteria other
    than relevance (SORTING). In addition, when presented with a large number of results,
    they may want to narrow them down to a manageable set (FILTERING, FACET SEARCH).
    PAGINATION or CONTINUOUS SCROLLING usually accompanies search results because
    in most applications they cannot be accommodated on one page.


    # SORTING


    # Problem


    The order in which search results are presented to users may not match their preferences
    or expectations. For example, search results are typically ordered by relevance
    based on users'' search criteria. However, users may want to order them based
    on other criteria such as popularity, dates, price, and so forth.


    # Solution


    Allow users to sort search results on criteria other than relevance. For example,
    comparison-shopping sites may allow users to sort by popularity, product rating,
    and price (Figure 6.29).


