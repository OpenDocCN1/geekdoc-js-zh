    However, there are situations where the last page is both appropriate and necessary.
    If the resulting dataset is sorted in multiple ways (e.g., alphabetically, chronologically,
    by price, and so forth), the last page becomes relevant, as it allows users to
    quickly see the last page of items with a predictable search results—for example,
    items starting with Z, the most- least-expensive item, and so forth.


    # REPEAT THE PAGINATION CONTROLS AT THE TOP OF THE PAGE


    For short lists, pagination controls may be provided only at the bottom of the
    list. In pages where search results require users to scroll extensively (e.g.,
    when users are permitted to change the page size), repeat the pagination controls
    at the top of the page as well.


    This technique can also be beneficial for search results accompanied by an alphabetical
    index. For example, users looking for an item beginning with the word "summit"
    might jump to the beginning of the "I" and then use pagination controls at the
    top of the page to go backward until they get to the first result of which is
    closest to the word "summit".


    # DO NOT LINK PAGINATION CONTROLS THAT ARE NOT RELEVANT


    Like navigation mechanisms, provide a clear indication to users as where they
    are in the search set and where they can go. Prevent unnecessary navigation actions
    by disabling pagination controls do not navigate to other search pages (Figure
    6.35):


    +   - On the first page, disable links to "first" and/or "previous" pages.

    - On the last page, disable links to "next" and "last" pages.

    - Instead of choosing the current page as a link, make it plain text or highlight
    it in some fashion.


    # LABEL PAGINATION CONTROLS APPROPRIATELY


    For pagination controls, their labels and order are "first," "previous," "next,"
    and "last." In applications where items are ordered chronologically, a recent
    trend is to label them to reflect their chronological order—"newest," "newer,"
    "older," and "oldest"—where "newest" is equivalent to "first" (Figure 6.36).'
