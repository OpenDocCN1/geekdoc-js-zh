    FIGURE 4.3 Remember The Milk offers users the option of setting reminders daily
    as well as a preset of minutes before the task is due. It also allows users to
    be reminded via email, instant messengers, and mobile text messages.


    # Solution


    Show users a page with all available application functions, any one which they
    can quickly access (Figure 4.4).


    # Why


    For many web applications, users need a place that serves as a launch pad for
    accessing its functions (i.e., mini-applications) that are rather independent
    of each other. Although users need access to all functions, they do not need to
    navigate from one function to another. However, they need a place to return to
    when they feel lost or disoriented (similar to a "home page" on web sites).


    # How


    Provide a "launch" page from which users can access all application functions
    or mini-applications. Control panels are designed using a hub-and-spoke user-interface
    approach (Basley, 2003; Tidwell, 2006), where users can reach the self-contained
    mini-applications (i.e., "spokes") from one central "hub" such that users can
    access a mini-application, accomplish desired tasks, and return to the hub page
    to perform another task using another mini-application.'
