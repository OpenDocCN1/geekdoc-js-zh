  md: '# Related design patterns


    RICH-TEXT EDITORS are comparable to LIVE PREVIEW—both are WYSIWYG tools. While
    RICH-TEXT EDITORS reflect the effects of the changes, LIVE PREVIEW allows users
    to view the effects of their configuration choices on an item or the interface
    itself.


    # RICH FORM


    # Problem


    Some of the inefficiencies in filling out forms are caused by the need for users
    to wait after submitting the form for it to be validated. Fixing errors requires
    the form to be resubmitted and revalidated. In some instances, users have to be
    asked to fill out forms in short chunks because the dependencies in user choices
    can only be determined after the submitted form has been subjected to necessary
    business rules—for example, offering users a choice for a purchase order or credit
    card information based on their choice of billing.


    # Solution


    In patterns discussed in Chapter 2, such as FORGIVING FORMAT, INPUT HINTS/PROMPTS,
    SMART DEFAULTS, and REQUIRED FIELD INDICATORS, use input as it is entered, preventing
    errors by offering users only valid choices. In addition, wherever possible, show
    dependent or subordinate choices closer to the parent selection (Figure 8.6).


    # Why


    A non-rich form requires users to enter data and send bits of selections to the
    server for validation to show dependent choices. The user is presented with either
    "success" page or errors to be corrected with an accompanying page refresh. Using
    a rich form not only eliminates page refreshes but also possibly prevent them
    altogether by identifying errors at the source. Users also feel in control as
    errors and prompts are well integrated with the form.


    # How


    Design the form so that user input is validated as it is being entered or when
    the user moves to the new element (or the focus is removed from the current form
    element). If the data input or selection is invalid, present appropriate prompts
    or messages that users can correct errors immediately (Figure 8.7).


    # DESIGN THE FORM TO MINIMIZE ERRORS


    Not only can rich forms validate user input as users are filling out the form,
    they can also help minimize errors in the first place. For example, as shown in
    Figure 8.6, the AUTOSGEST/AUTOCOMPLETION pattern can offer users valid options
    while entering data; effective calendar controls can ensure valid'
