  md: '# CHAPTER 8 Rich Internet Applications


    (CAROUSEL). By combining real-time aspects of data update with relevant visual
    effects, RIAs tend to make web application interactions efficient, effective,
    and pleasurable.


    # RICH-TEXT EDITOR


    # Problem


    Information entered by users may benefit from richer formatting, such as bold,
    underline, italic, and bulleted list. In addition, the information may be better
    presented using colors, tables, images, and hyperlinks. Although this can be achieved
    with HTML, users cannot be expected to know HTML, and even if they do, cannot
    be expected to provide valid HTML. In some instances, allowing users to directly
    enter HTML (or JavaScript) may lead to security breaches as well.


    # Solution


    Allow users to enter information using rich-text editors with necessary controls
    for formatting and inserting images and hypertext links (Figure 8.1).


    # Why


    Plain text can go only so far. In applications where information is targeted to
    be used by others, such as email and blogs, it is important for users to emphasize
    certain by making it bold, underlined, italicized, or presented with a different
    color. In some instances (e.g., blogs, job sites), it may also be important to
    provide supporting information such as tables, images, and links to other pages.
    Although this is possible by allowing users to enter their information in snippets
    of HTML, they cannot be expected to be familiar with it. Allowing users to enter
    HTML may take more development effort to ensure that user-entered HTML is valid
    and that it doesn''t break the presentation of the page.


    Rich-text editors, because of their WYSIWYG (What You See Is What You Get) nature,
    are easier ways to format text and can be converted to HTML for both storage and
    allow users to see the effects of their selections immediately. Moreover, rich-text
    editors are easy for users who are likely to be familiar with similar interactions
    in office-productivity applications such as Microsoft Office, Corel WordPerfect
    Suite, OpenOffice, and so forth.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_222_0.png)


    > FIGURE 8.1 Yahoo! Mail offers users a rich-text editor for composing emails.
    Note that it offers the option of inserting emoticons (i.e., "smileys”).'
