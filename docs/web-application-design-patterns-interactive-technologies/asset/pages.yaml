  md: '# Overview-Plus-Detail


    By allowing users to view details of the areas of interest while simultaneously
    seeing the overview (albeit in a much coarser resolution), the need to zoom out
    to access other areas of the information space is eliminated. Allowing users to
    move or manipulate viewports also makes it easy to quickly navigate the information
    space without losing context. Moreover, showing viewports in the overview pane
    provides a sense of where the user is in the information space; in essence, it
    answers the common orientation-related question: Where am I?


    This pattern is based on one of the basic principles of information visualization:
    focus context.


    +   First, the user needs both overview (context) and detail information (focus)
    simultaneously. Second, information needed in the overview may be different from
    what is needed in detail. Third, these two types of information can be combined
    within a single (dynamic) display, such as in human vision (Card et al., 1999,
    p. 307)


    The main implication of this principle is to show selected regions of interest
    in greater detail (i.e., focus) and to preserve a global view at reduced detail
    (i.e., context) in such a way that all information is visible simultaneously.


    # How


    Make the overview pane available to users at all times. It can be positioned as
    an inset pane within the detail pane (Figure 8.16) or positioned next to the detail
    pane (Figure 8.17).


    Show the viewport in the overview, highlighting the currently zoomed-in portion
    of the detail pane. Allow users to draw the viewport within the overview pane
    to zoom in different areas of the overview. If users can pan in the detail pane,
    move the viewport in the overview pane along with it. If feasible, allow users
    to adjust the viewport size to match the dataset''s


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_233_0.png)


    > FIGURE 8.17 Google Finance positions the overview and detail panes, one over
    the other, and allows users to see detailed price trends for a stock by letting
    them adjust the viewport size in the overview pane.'
  merge: -1
