  md: '# Control Panel


    access to other functionalities within the application—it''s just that they are
    secondary in nature. For example, email applications allow users to manage lists
    even though managing contacts is not its primary purpose. Therefore, when users
    log in, they are first shown a list of emails, both past and new. The term inbox
    is appropriate, since these are typically items that users need to attend to when
    they log in the application.


    # How


    Show users a list of items for which the application was primarily designed—emails,
    defects, accounts, to-dos, and so on—highlighting the items that users need to
    immediately attend to or be reminded of, such as new emails, new files, new defects,
    and so forth (Figure 4.2).


    # ALLOW USERS TO SET REMINDERS


    If the application is not being accessed frequently and if users prefer to be
    reminded of changes in the state of one or more items (e.g., payment due or a
    new to-do item), allow them to set up reminders (Figure 4.3).


    # Related design patterns


    The INBOX pattern typically uses lists, either TABULAR LISTS or IMAGE GRIDS. In
    addition, lists, they often need SORTING and FILTERING to make it easy for users
    to find relevant information (Chapter 7 for further discussion on lists).


    # CONTROL PANEL


    # Problem


    After users log in, they may want to access different account functions to perform
    a variety of tasks. However, when they want to access access cannot be reliably
    predicted.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_79_0.png)


