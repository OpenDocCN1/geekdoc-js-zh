  md: '# Why


    With keyword searches, the most common rule for ordering search results is by
    relevance. When viewing results, users may believe that changing the order in
    items which are presented will make it easier to get to the desired item(s) as
    the least expensive item or the items with the highest user rating. Offering users
    the ability to reorder the search results by other criteria makes it easy for
    to view the search results in their preferred order.


    # How


    Show users various sorting options near the search results either in the form
    of links, radio buttons, or dropdown lists (Figure 6.30). Links and radio buttons
    are usually better for showing options as they make it easy for users to see all
    available sorting options. On the other hand, dropdown lists are useful when there
    are several sorting options and showing them all would require considerable screen
    real estate. However, make sorting with dropdown lists as accessible by clicking
    a “Go” or the similar “action” button, and refrain from sorting the list as soon
    as an option is selected (see theOBTRUSIVE JAVASCRIPT pattern in Chapter 11).


    For web applications offering ADVANCED SEARCH, ensure that sorting options information
    presented on the SEARCH results makes it possible for users to understand the
    results quickly, since they will be able to match them with the content presented
    in search results.


    # Related design patterns


    If search results are presented as tabular lists, consider allowing users to sort
    by column headings (see the TABULAR LISTS pattern in Chapter 7).


    # PAGINATION


    # Problem


    The number of search results presented to users is too large to be displayed on
    a page. Even when it''s feasible to display all results on one page, response
    time could be several seconds or minutes, resulting in a suboptimal user experience.


    # Solution


    Divide search results so that each page shows a number of items (typically 10–20
    items per page), and allow users to navigate the pages of search results using
    controls as “previous,” “next,” and “first,” and “last.” Pagination controls may
    use numbered page links to allow users to navigate directly to individual pages
    within the search results (Figure 6.31).


