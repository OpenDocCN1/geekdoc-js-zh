- img_proc: true
  md: 'design patterns. After a design pattern is chosen, development teams can reuse
    and adapt software components and code snippets for implementing selected patterns
    (Sinnig et al., 2004). Reuse and efficiencies are also achieved since software
    components typically incorporate related design patterns. For example, a software
    component for the TABULAR LIST pattern can incorporate the SORTING and PAGINATION
    patterns and make it easy for developers to implement all three patterns in their
    designs.


    Even when design teams are small and colocated, pattern libraries are beneficial
    because they provide a way to capture design best practices and promote reuse.
    Because of the limited design and usability resources available to smaller teams,
    minimizing rework by reusing known successful design solutions is of even greater
    importance than for larger design teams.


    # How


    The first task when developing a pattern library is to determine how to document
    each pattern. As indicated in Chapter 1, pattern authors have used different approaches
    (including this) to document patterns, and a consensus on the most effective way
    of documenting patterns does not currently exist. However, they all contain the
    following core sections.


    Pattern name. The name of the design solution to clearly communicate what the
    pattern stands for. An unambiguous (preferably familiar) name is important to
    make it easy for designers to recognize, select, and remember patterns.


    Problem. A brief description of the design problem and the trade-offs faced by
    the designers, any.


    Solution. A brief summary and an exemplar image that shows the successful design
    solution or an actual screenshot; the latter is preferred because it shows the
    design solution in use and helps improve the strength of the pattern.


    Reasons the design solution is effective (why). Some form of design ratio is essential
    to make the case for the pattern. This may be based on empirical research, user
    interface design principles (or heuristics), and/or user familiarity because of
    established conventions. This section may also include specific contexts in which
    the pattern is most appropriate.


    Best practices for applying the design solution (how). In most instances, applying
    a design solution requires attending to additional considerations. For example,
    when using the DELAY/PROGRESS INDICATOR pattern (see Chapter 8), designers may
    need to know whether to show time elapsed or time remaining and in what contexts.
    Identifying best practices is essential to ensure the correct use of the selected
    pattern.


    Related design patterns. Most patterns do not stand alone. They are related to
    other patterns either because their use incorporating other patterns or they complete
    other patterns. For example, when creating a form, designers have to consider
    several patterns such as SHORT FORMS, REQUIRED FIELD INDICATORS, ERROR MESSAGES,'
