    # COMPLEMENT MAP VIEWS WITH A LIST, OR TABULAR VIEW, OF ITEMS


    Although a map view is useful for showing location information, the location itself
    may have attributes that are better represented in a list format. In addition,
    when users are interested in comparing attributes of items other than their location,
    tabular lists are more useful—for example, when comparing prices of homes on a
    map. Figure 7.46; see also TABULAR LISTS earlier in this chapter).


    For data with a few attributes, it may help to show the list and map views side
    by side to make it easy for users to select a location from the list and see it
    on a location on the map and see it on the list with all attributes Figure 7.47.


