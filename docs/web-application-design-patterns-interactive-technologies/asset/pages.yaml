  md: '# Organization of the Patterns In This Book


    +   - Problem. A brief description of the design problem(s) the pattern solves
    and accompanying design challenges and trade-offs (referred to as "forces") by
    Alexander et al., 1977) by user interface designers.

    - Solution. The core design solution to the problem. This is a brief about the
    solution (i.e., the pattern) accompanied by an example (i.e., a sensitizing image)
    illustrating its use in a web application.

    - Why. Rationale for the design solution''s effectiveness.

    - How. List of best practices describing the application of the solution and possible
    variations. One or more illustrative examples are included for each variation
    to demonstrate how the pattern can be applied effectively in a variety of situations.

    - Related design patterns. Because it''s often the case that several patterns
    are used together to create a usable design solution, this section identifies
    related patterns that designers may want to consider either when are used together
    or are relevant for the given pattern.


    # # ORGANIZATION OF THE PATTERNS IN THIS BOOK


    The patterns in this book are organized by chapter, as follows.

    Chapter 2: Forms. Forms are a distinguishing characteristic of web applications.
    It through form elements such as text, dropdown menus, radio buttons, checkboxes,
    and others that users provide information and interact with web applications.
    This chapter discusses patterns related to designing for web applications, to
    ensure that filling forms is not bothersome and that they help users accomplish
    their goals, including CLEAR BENEFITS, SHORT FORMS, LOGICAL GROUPING, LABEL ALIGNMENT,
    REQUIRED FIELD INDICATORS, SMART DEFAULTS, FORGIVING FORMAT, KEYBOARD NAVIGATION,
    INPUT HINTS/PROMPTS, ACTION BUTTONS, AND ERROR MESSAGES.


    Chapter 3: User Authentication. Web applications enable one-to-one interaction
    with users and store user-specific information. This requires that users create
    an account and access it using a unique set of credentials. This chapter describes
    design patterns related to accessing and exiting web applications, including REGISTRATION,
    CAPTCHA, LOG IN, LOG OUT, AUTOMATIC LOGOUT, AND FORGOT USERNAME/PASSWORD.


    Chapter 4: Application Main Page. Once users have logged in to the application,
    an important question for designers is what users should see or which page they
    should be taken to. This chapter discusses design patterns designers should consider
    as they take users to "main" application page, including INBOX, CONTROL PANEL,
    DASHBOARD, PORTAL, PERSONALIZATION, CUSTOMIZATION, AND BLANK SLATE.


    Chapter 5: Navigation. Navigation is how users experience web applications. When
    designed effectively, navigation becomes transparent and users are able to accomplish
    goals quickly and without unnecessary backtracking.'
