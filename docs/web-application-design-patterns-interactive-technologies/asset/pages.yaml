  md: 'The most common export/download formats include Adobe PDF, Excel, CSV

    (comma-separated values), TSV (tab-separated values), and XML (extensible

    Markup Language), because they allow users to import data to a preferred

    spreadsheet or database application and manipulate or view the data as neces-

    sary. The XML data format is also useful when data is used as input to

    other applications and/or converted to other formats as HTML (HyperText

    Markup Language) or SVG (Scalable Vector Graphics) for presentation pur-\poses.
    Adobe PDF is useful when it''s important to maintain the visual look

    of data being exported.


