  md: '# Problem Summary


    User needs to browse among a set of objects represented pictorially.


    EXAMPLE:


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_393_0.png)


    FIGURE 13.8 Yahoo Pattern Library uses animation to illustrate relevant interactions.


    # Use


    Use when the user''s mental model of a topic or a set of objects is costly to
    convey imagery, such as a visual representation of the object, and the available
    screen estate is too small to accommodate the items at once.


    # Accessibility


    Specific types related to error from validation:


    +   * **Color perception**: Avoid using only colour to convey information. That
    is, use colour in addition to labelled errors and success messages. Red means
    "bad" but no one can distinguish red from green – so include the "bad" text as
    well.

    * **Navigation**: Clear moving focus focus attention to the area where an error
    occurred or providing a quick way for users to jump down to the problem.

    * **Workload**: If multiple errors occur, provide users with a summary or indication
    of the number of errors.


    General techniques for accessibility:


    +   * **Labels**: Clearly label form elements. Use the <label> tag to explicitly
    associate labels with controls and be easily controlled with keyboard and other
    input devices. Ensure elements are laid out in a logical order and have consistent
    tab order when tabbing through form elements.

    * **Sections**: Group related form elements using the <fieldset> tag.


    FIGURE 13.9 Fluid Open Source Design Pattern Library lists accessibility considerations
    for the LIST BUILDER pattern with its patterns. This example shows the accessibility
    considerations for LIST (https://uidespatterns.org/content/list-builder).


    # CONSIDER INCLUDING ANTIPATTERNS


    Antipatterns are inappropriate solutions that appear to be good solutions to a
    given problem; they are also referred to as pitfalls (Gamma et al., 1995). Although
    not mentioned by Christopher Alexander (Alexander et al., 1977), who proposed
    the notion of patterns, there may also be benefit to including antipatterns in
    the pattern library if the use of inappropriate design solutions seems to be a
    common practice.


    A good example is the HOVER & COVER antipattern noted by Scott (2008), who described
    it as when the hover hides important contextual information around the object
    or gets in the way of other actions (Figure 13.10). Antipatterns observed by Scott
    also include MEANDERING WAY, TINY'
