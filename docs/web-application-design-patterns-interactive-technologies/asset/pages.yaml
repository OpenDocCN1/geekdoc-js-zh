    # CONSIDER USE OF ICONS AND ACTION LIST FOR

    DEDICATED ACTIONS


    Dedicated actions can be shown as a set of links, buttons, or icons (Figure 7.53).
    However, because dedicated actions are repeated for each list item, having several
    actions in the same row as links or buttons may require additional screen estate
    and add to the visual clutter. In such situations, consider using menus (Figure
    7.54).


    Another design option to allow dedicated actions in a limited space is to move
    less-common actions to the item’s “details” page or show them on hover (Figure
    7.55). Although this approach hides some actions, it may help simplify the user
    interface.


    # FOR LONG LISTS, REPEAT SHARED ACTIONS


    For long lists requiring scrolling, repeat shared actions above and below the
    list. This will either eliminate the need for scrolling, as users will have one
    of shared actions always visible or at least scrolling to initiate an action after
    they have selected items.'
