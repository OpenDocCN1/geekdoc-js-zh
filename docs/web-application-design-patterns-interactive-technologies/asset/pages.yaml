- img_proc: true
  md: '# Fixed-Width Layout


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_365_0.png)


    FIGURE 12.4 Blinksale uses a fixed-width centered layout. The background is filled
    with a gradient if users are viewing the page in larger browser window sizes.


    window size. Users cannot change the width by resizing the window or changing
    the text size.


    # Why


    For web applications that do not demand excessive horizontal space (i.e., mainly
    textual content and tables with a few columns), a fixed-width layout is the most
    suitable, as information readability and scalability can be maintained even for
    larger browser window sizes. In addition, with fixed-width layouts, designers
    have complete control over the placement of page elements, which allows them to
    ensure the layout looks almost identical in all browsers.


    # How


    Fixed-width layouts are typically designed by specifying the width in pixels—an
    absolute unit of measure for text sizes. A downside of an approach is that it
    doesn''t scale well for users who have set text sizes larger or smaller than those
    specified by the designer. A common alternative is to use measurement relative
    to the text size—that is, in em or ex. This layout is commonly referred to as
    an elastic layout because it changes its size based on the text size users. However,
    designing using elastic layouts are still unaffected by browser width and thus
    fixed-width designs.


    Optimal screen resolution for specifying the width of the layout is important
    consideration when designing fixed-width layouts. Design for 800 × 600 resolutions
    to accommodate the largest number of users without introducing horizontal scrollbars.
    The width of the layout is then typically set to 750 to 770 pixels for the browser
    container. In situations where the design is targeted for 1024 × 768 screen resolutions,
    the fixed-width container is set at 960 by 800 pixels. The goal of, is to prevent
    horizontal scrolling for the vast majority of the web application''s users. Baekdal''s
    (2006) research suggests that fixed-width designs for lower (i.e., 800 × 600)
    resolutions would support about 95 percent of users, whereas those designed for
    larger (i.e., 1024 × 768) resolutions would support only 80 to 85 percent of users.


    # CENTER THE LAYOUT ON THE PAGE


    Reduce the perception of empty space for users with larger screen resolutions
    by centering the layout so that the empty space is equally divided as the'
