    # How


    Divide search results into a sequence of pages and allows users to navigate through
    them, at a minimum, "next" and "previous" links.


    # MINIMIZE PAGING AS SCROLLING


    Deciding the number of items to show on a search results page is a trade-off between
    scrolling and paging. Typically, for all text results with a minimal description
    for each item, a search results page shows 20 items at a time, whereas for results
    that include images, users are typically no more than 10 to 15 items. However,
    considering that users limit their exploration of search results to just a few
    pages at a time and do not mind scrolling, a case can be made for showing more
    search results on a page (Spool, 2008b). Showing 50 search results per page appears
    to be optimal as reported by Bernard et al. (2002), who found the fastest search
    times and preference for 50 search results at a time when compared with 10 or
    100 search results.


    # MAKE PAGINATION CONTROLS EASILY CLICKABLE


    When numbers are linked in pagination controls to allow users to jump directly
    to a specific search results page, they often present a very small target for
    users to click. To ensure pagination controls are easily clickable, use a larger
    target size and provide sufficient space between them (Figure 6.32). Doing so
    also distinguishes one pagination link from another and minimizes inadvertent
    navigation to the wrong page.


    > Interestingly, the study found slower search times and lower preference for
    100 search results at a time. This may be a case against showing an arbitrarily
    large number of search results.'
