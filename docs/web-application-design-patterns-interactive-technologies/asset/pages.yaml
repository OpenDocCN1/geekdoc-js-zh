    # SMART DEFAULTS


    # Problem


    With every additional form element, both the total time it takes users to fill
    out the form and chances of potential errors increase. In addition, for multipart
    forms, if users have to reenter the same information, not only would it increase
    the time required to complete the form, but also require the application to check
    that the information was entered identically each time.


    # Solution


    Use appropriate default values based on what users are most likely to choose or
    enter; this may be based on their previous input or selections (Figure 2.21).
    However, do not prepopulate form elements required for confirmation (e.g., reentering
    password, or users agreeing to read terms and conditions of use) or related to
    security (e.g., resetting password).


    # Why


    Providing good default values minimizes the need for users to enter or select
    data. This decreases the total time to complete the task and reduces data entry.
    In some instances, using defaults may completely eliminate the need to fill out
    and reduce users'' task to verifying information. For example, on e-commerce applications,
    users who have previously provided shipping and billing information (consented
    to saving the information) need not go through the entire checkout process. Instead,
    they can be presented with a review/confirmation page with a “Place Order” button.
    Because most users are not likely to change shipping and billing information'
