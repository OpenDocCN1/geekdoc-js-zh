    # ALLOW USERS TO CHANGE THE NUMBER OF SEARCH RESULTS PER PAGE


    It is important to show results as quickly as possible and allow users to reframe
    their search query if they are not satisfied with their search results. One way
    to reduce delays in showing search results is to reduce the number of items on
    each results page. An added benefit of showing fewer search results is that users
    scroll to see more items on a page because they have larger monitors, good connection
    speeds, or they find pagination cumbersome. To support such preferences, allow
    users to set the number of results on the page (Figure 6.27); see also the CONTINUOUS
    SCROLLING pattern later in this chapter.


    # SUGGEST ALTERNATIVES WHEN A SEARCH YELDS NO RESULTS


    There are two reasons why a search may not yield any results:


    +   1. The content that the user is interested in is not available.

    2. The search criteria formulated by the user is incorrect (e.g., misspellings
    or too specific criteria).


    Suggest alternatives as next steps when a search does not yield any results to
    account for the preceding possibilities. Suggestions may be in the form of alternate
    spellings, especially if users have likely misspelled the search term. If it is
    possible to make a reasonable guess as to what users are looking for, show search
    results that match keywords while indicating that matches were not found for the
    user-entered keywords (Figure 6.28). Other options are to show advanced search
    options (the ADVANCED SEARCH pattern earlier in this chapter), suggesting browsing
    the application using high-level categories within the application, and offer
    suggestions to improve search results.'
