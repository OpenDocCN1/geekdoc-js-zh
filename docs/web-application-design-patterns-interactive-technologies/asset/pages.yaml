  md: '# Hierarchical List


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_190_0.png)


    **Figure 7.19** Rally shows a "Release Task Status" list in a hierarchical order
    by indenting subtasks below parent tasks. It does so in the "State" column as
    well.


    # How


    Make the list items'' clear by depicting the relationship between items at the
    parent and child levels. In addition, expand and collapse controls for items at
    the parent level in the first column (Figure 7.19).


    Indentation is the preferred method to identify parent–child relationships among
    items in a multilevel hierarchical list. However, for single-level hierarchical
    lists—mainly used for grouping of information—some form of visual indication that
    emphasizes the item at the parent level is usually sufficient to show the hierarchical
    relationship (Figure 7.20).


    # WHERE APPROPRIATE, OFFER A NONHIERARCHICAL VIEW


    For hierarchical lists, the default organization (sorting method) is the tree
    structure that shows parent–child relationships. For multicolumn (i.e., multi-attribute)
    lists, users may want to sort data by another attribute. For example, in discussion
    groups, users may want to view messages in a order rather than the default hierarchical
    order of threaded discussions. When users can sort the columns, it may become
    necessary to switch to a non-hierarchical list; ensure that users are able to
    return to the original hierarchical view (Figure 7.21).


    # BE CAREFUL WHEN ALLOWING US TO DELETE PARENT ITEMS


    Deleting an item at the parent level would cause all the child items, including
    other parent items within it, to be deleted. Therefore, when offering the “delete”
    option, make users aware of the action’s consequences. If the “delete” action
    could inadvertently cause substantial data loss, restrict users to deletion'
