    # DIVIDE LONG FORMS INTO MULTIPLE PAGES

    WITH SHORT FORMS


    Group information in a long form so that each group is focused on a sub-task,
    and present form elements related to each group on a separate page (Figure 2.11).
    In addition, order groups that the most important and required information is
    presented first and optional information later. Splitting forms makes filling
    out each page faster, and the users are more likely to perceive them to be shorter
    as compared to the form presented on one page.


    # Related design patterns


    Once forms are as short as possible, make them appear even more manageable by
    indicating to users the required information (REQUIRED FIELD INDICATORS), grouping
    and ordering form elements logically (LOGICAL GROUPING), and ensuring that users
    are aware of the benefits of filling out the form (CLEAR BENEFITS). In addition,
    consider using the WIZARDS for forms that are split into multiple pages (see Chapter
    5).'
