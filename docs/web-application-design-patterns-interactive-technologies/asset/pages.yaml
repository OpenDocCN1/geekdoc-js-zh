    # Related design patterns


    The patterns discussed in Chapter 2, such as LOGICAL GROUPING, REQUIRED FIELD
    INDICATORS, SMART DEFAULTS, FORGIVING FORMAT, KEYBOARD NAVIGATION, INPUT HINTS/PROMPTS,
    and ACTION BUTTONS, are all essential for designing usable and accessible.


    # ACCESSIBLE IMAGES


    # Problem


    Images are not available to users with visual impairments.


    # Solution


    Provide necessary text alternatives for images and minimize the use of superfluous
    graphics. There is a common misconception that to make a page accessible, all
    images must be removed. This is not true. Illustrations, graphics, and other images
    (including animated images) not only help improve comprehension for users without
    vision impairments but also help those with some forms of cognitive/learning disabilities
    (Biewer, 2005). By incorporating text alternatives for images, designers can easily
    avoid building an alternative version of the web application.


    # Why


    Making images accessible by providing a text alternative allows both reader users
    and those who have disabled images in their browsers understand the purpose and
    function of the images. An added benefit is that it can be read by search engines
    to improve searchability of pages. When used appropriately, images can make a
    page look visually pleasing and incorporated into the page without impacting its
    accessibility.


    # How


    Provide a text alternative for images describing the image''s purpose. This is
    accomplished using the **alt** attribute for all image-related markup: `<img>`
    tags, `<area>` tags for hotspots on image maps, and `input` tags of `type="image"`
    (Figure 11.11).'
