    Often, users’ search criteria are too broad, resulting in a very large number
    of results for them to wade through and identify results that match their needs.
    Although users can redo searches by making search criteria more specific, they
    may still end up with a large number of results.


    # Solution


    Allow users to narrow down their list of search results by applying filters on
    one or more data attributes (Figure 6.40).


    # Why


    When faced with a large number of search results, filtering is an effective method
    to narrow them down to a manageable set. It also permits users to


