  md: '# Keyboard Navigation


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_34_0.png)


    **Figure 2.26** In this example, users can navigate the form using the “Tab” key
    and navigate to tabs using keyboard shortcuts. For example, users can navigate
    to the “Billing Address” by pressing “Alt + 3” (on Windows) or “Ctrl + 3” (on
    a Mac).


    # Why


    Allowing users to interact with forms with a keyboard is a good practice, not
    just for improving accessibility of forms, but also for making form filling faster,
    since users do not need to switch between the keyboard and mouse to fill out a
    form.


    # How


    Enable keyboard navigation for all forms; that is, users should be able to use
    forms using either the keyboard or mouse. Pay particular attention to navigating
    fields. By default, browsers provide a default tab sequence among page elements
    (tabs, form elements, and links) based on their order of appearance in the HTML
    code. In well-structured pages, designers do not have to specify the tab sequence.
    But in cases where the HTML code does not match the users'' task flow (that is,
    how users are going to fill out the form), override the default tab sequence using
    the tabindex attribute, as in this example:


    ```

    <input type="text" name="fieldname" id="fieldname" tabindex="110" />

    ```


    This is often necessary when forms are presented using multicolumn layouts, where
    it is important that the “Tab” key moves the cursor to the next logical form element,
    not simply from left to right or top to bottom in the order of occurrence of form
    elements in the HTML code.


    > NOTE


    The tabindex attribute can take a value between 1 and 32,767. When coding forms
    and using the tabindex attribute, increment the tabindex value by 10. If the need
    arises to change the form and insert or more form elements between existing elements,
    it''s possible to use numbers between existing tabindex values without affecting
    the rest of the form.'
