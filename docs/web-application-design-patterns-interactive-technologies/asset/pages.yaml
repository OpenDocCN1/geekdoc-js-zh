  md: '# WEB APPENDIX

    Help


    # INTRODUCTION


    Despite adherence to basic design principles, processes, and patterns to create
    an interface that users can learn easily and use efficiently, it is necessary
    to provide help and make it available at all levels of user interaction. At its
    most basic level, help should be provided to answer users'' questions within their
    task and application context (CONTEXTUAL HELP). This can be in the form of hover
    tips and prompts to inform users about the type and format of data to enter or
    more detailed instructions to help users decide among the available options. The
    next level of help, to support frequent and important tasks, is to provide answers
    to users FREQUENTLY ASKED QUESTIONS.


    Embedding various forms of assistance does not eliminate the need for comprehensive
    help. For a complex application, users may not even know whether functions and
    tasks are supported by the application and how to accomplish them. This application-level
    help (APPLICATION HELP) should be available both as a standalone module and integrated
    with the application, so when users access help, they are directed to the section
    of application-help relevant to their page or task context.


    For moderately sized web applications, users may have to visit several tasks and
    access several functions to accomplish tasks successfully. For such tasks, especially
    those that are likely to be infrequently, it''s important to provide users asked
    step-by-step instructions (GUIDED TOURS). For tasks that require diagnoses or
    consideration of several alternatives, it helps to ask users to describe their
    task scenario one step at a time and lead to possible solutions (HELP WIZARDS).
    The wizard-based approach is effective because users can try solutions at their
    own pace and are not


    Even providing multiple ways of assisting users and providing comprehensive help,
    it is not possible to address all user questions and usage scenarios. Therefore,
    it''s important to consider community discussion forums where support staff and
    other users of the application can help'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'another (HELP COMMUNITY). Offering such self-service options helps increase
    trust between application users and providers.


    Finally, when all else fails, nothing is more important than offering the ability
    to talk to a knowledgeable person to get the problem solved. Although increasing
    a customer phone number is an obvious choice, increasingly users are increasingly
    offered CLICK-TO-CHAT options to help them get in touch with support personnel.


    # CONTEXTUAL HELP


    # Problem


    While trying to fill out a form or accomplish a task, users may have a question
    about one or more items on a page. Although application-level help includes such
    information (see the APPLICATION HELP in this chapter), requiring users to navigate
    to a different part of the application may be undesirable doing so may cause users
    to lose their task context or, worse, information.


    # Solution


    Offer help within the context of users'' information needs and to make it easy
    for users and save time looking for appropriate sections within the standalone
    help module (Figure Web.1). This may be in the form of hover tips or tool tips,
    a “What’s this?” link for information, and in-line prompts.


    # Why


    Offering help within the context of users'' tasks and locating it closer to the
    problem area increase the likelihood of getting users'' questions answered and
    avoiding the feeling of needing help. In addition, by allowing users to maintain
    their task context and not having to navigate to a different page,


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_413_0.png)'
  merge: -1
  pgno: 413
- img_proc: true
  md: 'potential for them losing their place within the web application or their data
    is avoided, increasing their chances of completing tasks.


    # How


    As the name suggests, contextual help provides immediate assistance to users without
    requiring them to leave their task or operation context. There are several ways
    of providing contextual help:


    +   - Hovertips or tool tips

    - “What’s this?” link for information

    - In-line prompts


    # HOVERTIPS


    Hovertips are typically used to provide a short description or explanation for
    a form or interaction element. The help is hidden and is not shown until users
    hovers the cursor over the interaction element, its label, or an icon next to
    it (Figure Web.2). They are also known as tool tips, because they were originally
    used for labeling icons in toolbars for user interface applications.


    # WHAT’S THIS?


    Unlike other, “What’s this?” information is shown when users click on a “What’s
    this?” link, a “Learn more” link, or an icon representing this style of help.
    The “What’s this?” type of help is more detailed and useful for longer descriptions
    and could even include images. Help information may be shown to users as pop-up
    windows (either separate browser windows or dynamic HTML overlays on the page
    content) or the “What’s this?” link or icon (Figure Web.3). Because the help is
    detailed and may take up considerable screen real estate, it’s important that
    users are offered an option to remove it (e.g., by clicking a “Close” link or
    button).


    # IN-LINE PROMPTS


    Unlike other and “What’s this?” types of contextual help, in-line prompts stay
    visible while users interact with a form element or a section of the form. Prompts
    can be either static or dynamic. Static prompts always remain visible and provide
    necessary instructions (e.g., formatting or syntax information) for all or a selected
    set of elements (Figure Web.4). Dynamic prompts, on the other hand, appear only
    when users focus on a particular form element, and then they are removed as soon
    as users have removed the focus from that form


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_414_0.png)


    FIGURE WEB.2 When users hovers the cursor over an image title, Flickr offers the
    “Click to edit.”'
