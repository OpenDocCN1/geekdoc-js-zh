  md: '# CHAPTER 5 Navigation


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_115_0.png)


    **FIGURE 5.8** Gap uses an inverted-L layout by placing primary navigation horizontally
    at the top of the page and secondary navigation vertically on the left.


    Placing secondary navigation vertically on the left or right is usually preferred
    when the total number of secondary navigation options cannot be accommodated horizontally
    or when the navigation choices are available at even deeper levels. Vertical placement
    of secondary navigation allows for necessary scalability as users navigate down
    the hierarchy. Although an inverted-L layout—that is, placing secondary navigation
    on the left and primary horizontally—is quite common, Kalbach and Bosenick (2003)
    did not find any evidence of its benefits when compared to its placement on the
    right. When showing deep hierarchies, it''s common to show navigation in an indented
    list in a treelike structure (Figure 5.9).


    The use of menus similar to desktop applications is becoming popular for web applications
    (Figure 5.10); they are also referred to as dynamic menus, fly-out menus, pop-up
    menus, and dropdown menus.


    Menus have the benefit of not taking up additional space and allowing users to
    explore navigation hierarchy without requiring them to select a primary navigation
    option. However, menus have several downsides as well. Most important, users prefer
    to have all choices visible hidden in dropdown menus. Bernard and Hamlin (2003)
    found a strong dislike as well search times for horizontal placement of menus
    when compared with vertical placement. In addition, they may be difficult for
    users who use assistive technologies (e.g., screen readers) if they are activated
    by mouse hovers. For improving accessibility, they should be activated by the
    click of the mouse, and navigation options should be accessible via keyboard.
    They also may be disorienting to users, since the context of the selected option
    would be missing; this concern'
