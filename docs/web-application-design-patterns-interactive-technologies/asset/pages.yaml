    \ item and then click an adjacent button to go to the page corresponding to the\
    \ item they have selected.\n\nIf a dropdown list is used to submit a form or to\
    \ navigate to a different page, it will be extremely difficult, if not impossible,\
    \ for keyboard users to select an appropriate option. For example, if a dropdown\
    \ list is used to navigate to a different page as users select an element in this\
