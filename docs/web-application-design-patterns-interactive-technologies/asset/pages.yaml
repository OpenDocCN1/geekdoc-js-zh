    may be employed to allow users to maintain the visual continuity between states.


    # DYNAMIC QUERYING


    # Problem


    When presented with a large number of items, users may want to "tune" their criteria
    to reduce the number of items to a manageable set. Although traditional filtering
    mechanisms address the problem (see the FILTERING pattern in Chapter 6), user
    interaction can become cumbersome, since with every filtering user needs to "submit"
    their criteria and wait for the page to refresh to see an updated item list.


    # Solution


    Allow users to filter items using a set of interactive controls (i.e., sliders,
    checkboxes, radio buttons, and so forth) that with each selection, they can see
    updated results without having to wait for the page to refresh (Figure 8.18).


    # Why


    In traditional web applications, filtering requires users to make narrowing selections,
    submit them to the server, and view the updated result set after a refresh. With
    every filtering choice, users go through the same process, leading to an interrupted
    experience. RIAs eliminate the explicit "submit" action and accompanying page
    refreshes, providing a more fluid and interactive experience.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_234_0.png)


    **FIGURE 8.18** Blue Nile allows users to narrow diamonds by allowing them to
    filter by price, color, cut, and clarity. The range for each is selected using
    sliders.'
