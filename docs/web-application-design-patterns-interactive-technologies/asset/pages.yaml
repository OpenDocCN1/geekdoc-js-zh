    # Related design patterns


    CONTEXTUAL HELP options such as hovers and in-line prompts are commonly used with
    forms. Therefore, design practices listed for INPUT HINTS/PROMPTS (see Chapter
    2) should be considered when offering contextual help.


    # FREQUENTLY ASKED QUESTIONS


    # Problem


    Many users are likely to have the same or similar questions when using a application.
    The questions may relate to how to get started with the application or for information
    on specific sections of the application. Trying to respond to such questions as
    they arise using a dedicated customer support line or having customers email their
    questions is not only time consuming and expensive, but it is also inefficient
    and ineffective for users because they have to wait to receive a response to their
    questions before using the application.'
