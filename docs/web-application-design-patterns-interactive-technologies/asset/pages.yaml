    tied to column headings (<th scope="col">), row headings (<th scope="row">), or
    both (Figure 11.19).


    # USE THE HEADERS ATTRIBUTE ON CELLS OF COMPLEX DATA TABLES


    Use the **headers** attribute to specify the relationship between the headings
    for a given cell in more complex tables. This is accomplished by attaching an
    **id** attribute to any cell that you want to be a header cell and then adding
    the ids of those cells to the headers attribute of the cells (Figure 11.20).


    # Related design patterns


    Data table presentation can be improved using style sheets so that the relationship
    between values and headings are close to those without vision impairments as well
    (See Christie, 2008, for how CSS can be used to effectively present tabular data).
    This important for sighted users because attributes as summary, scope, and headers
    are not displayed in web browsers. However, UNOBTRUSIVE STYLE SHEETS should be
    used to ensure that markup and presentation are layered independently as advocated
    in the PROGRESSIVE ENHANCEMENT pattern.'
