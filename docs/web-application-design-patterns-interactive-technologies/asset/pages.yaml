  md: '# FIGURE 12.23 Yahoo! Mail uses icons for both objects (e.g., "inbox", "Drafts",
    "Spam", etc.) and actions (e.g., "Reply", "Forward", etc.).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_380_0.png)


    # Solution


    Use icons to represent commonly used objects and actions (Figure 12.23).


    # Why


    +   - For many common objects and tasks, icons are more readily recognized and
    remembered.

    - They take less space than representing textual links.

    - Icons typically have more universal recognition than text; thus, when localizing
    a web application, icons when appropriately used, have minimal layout impact.
    However, if icons are used with labels, label translation should account for text
    expansion when translating to other languages (see the EXTENSIBLE DESIGN pattern
    in Chapter 10).


    # How


    Most important, use familiar icons (Nolan, 1989)—that is, use concrete (rather
    than abstract) icons that remind users of things already known. Icons that clearly
    show the objects or actions they represent represent. Ideally, users should be
    able to recognize icons without any accompanying text labels.


    SUPPLEMENT ICONS WITH LABELS


    Undoubtedly, there will be objects and actions that are unfamiliar to users. Therefore,
    supplement icons with labels to make actions easier to identify. During users''
    initial interaction with an application, users are more likely to rely on labels,
    but as their use continues, their interaction will become more efficient as the
    icons become familiar.


    When adding labels may take additional space, use tool tips for the icons. However,
    when dynamically changing the status of an icon, update the tool tip dynamically
    to indicate the changed state.'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# AVOID USING TEXT IN ICONS


    Avoid using text as part of an icon''s image, since it makes it more difficult
    to localize it (i.e., translate to other languages; see Chapter 10). Because of
    the smaller sizes of icons, text may also be difficult to read, and when used
    with a label, it may not be clear which label or text to consider for deciphering
    the icon''s. In addition, for users with vision deficiencies, the text may be
    difficult to read when zoomed in (see the ACCESSIBLE IMAGES patterns in Chapter
    11).


    # USE MODIFIERS TO INDICATE OR CHANGE AN OBJECT''S STATUS


    The base icon can be used for multiple object states—for example, new email, read
    email, and responded-email (Figure 12.24).


    For monitoring applications, similar modifiers—referred to as “health badges”—are
    used to indicate alarms or the status of objects. They are either placed side
    by side or to the bottom right or bottom of the main icon (Figure 12.25). The
    modifier icon may be used over the main icon as long as the main icon is still
    recognizable and not masked by the modifier icon (e.g., putting a “X” over an
    icon).


    # USE TOGGLE ICONS TO INDICATE ALTERNATE STATES


    Toggle icons are used to indicate the presence or absence of an attribute or to
    assign a state. For example, Figure 12.26 shows the star icon as a toggle by Gmail
    to indicate the “starred” or “normal” states of an email. This is very similar
    to the “flagging” approach offered by desktop-based email systems


