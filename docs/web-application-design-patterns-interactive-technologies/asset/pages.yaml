  md: '# CHAPTER 12


    # Visual Design


    # INTRODUCTION


    Although web applications are designed to facilitate task completion, visual design
    of them shouldn''t be ignored. Not only does visual design play an important role
    in how usable an application is perceived (Kurosusu and Kashimura, 1995; Tractinsky,
    1997), but it also affects how credible it is considered by users (Fogg et al.,
    2002).


    Among the first decisions that web application designers make is whether application
    content should adjust to the browser window width (LIQUID-WIDTH LAYOUT) or remain
    the same regardless of width (FIXED-WIDTH LAYOUT). Although usability and accessibility
    generally favor liquid-width layouts, page aesthetics are often compromised with
    excessively large or small browser windows. Using a PROGRESSIVE LAYOUT with defined
    minimum and maximum widths is a reasonable compromise because not only can it
    maintain the aesthetic integrity but also better accommodate users who have high-
    or low-resolution monitors.


    The next step is related to the placement and alignment of page elements to aid
    users by providing a clear visual page structure (GRID STRUCTURE, VISUAL HIERARCHY).
    Designers also may make certain page elements stand out (HIGHLIGHT) or use images
    that indicate important states and actions (ICONS) to further assist users in
    navigating pages and accessing features.


    Visual design involves balancing distinct components: layout, colors, graphics,
    font, contrast, and so. Several books have been written on both the theory and
    practice of these components for web design (e.g., Baird, 2007; Lidwell et al.,
    2003; Mcintyre, 2008; Wroblewski, 2002). This chapter, however, emphasizes visual
    design patterns that are relevant for web application. practices for effectively
    incorporating other elements to create an effective design (e.g., colors, size
    and proportion, gestalt, typefaces), though not discussed, are important and must
    be considered for all designs.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# LIQUID-WIDTH LAYOUT


    Problem

    Web page content (e.g., tabular data with many columns, image editors, portal
    applications with multicolumn layouts, etc.) requires considerable horizontal
    space. If using a preset width (FIXED-WIDTH LAYOUT), content would either appear
    too cramped to users with large monitors or require users to scroll horizontally,
    which is typically preferred (Nielsen, 2005).


    Solution

    Design pages using a liquid-width layout that as users widen or narrow the browser
    window, page content and data adjust to its width; this approach is also referred
    to as a fluid or flexible layout (Figure 12.1).


    Why

    It is very difficult to know or predict users'' screen resolutions and browser
    window preferences. Thus, designing for a specific width takes control away from
    users; instead of the design adapting to user preferences, users are forced to
    adjust to the design. Furthermore, with fixed-width layouts, much of the


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_362_0.png)'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'available screen space remains unused for users with high-resolution monitors.

    On other hand, those using lower-resolution monitors may need to scroll pages
    horizontally to view the entire page.


    Using a liquid-width design allows different pages to adjust browser window sizes
    and minimizes unnecessary horizontal scrolling. It also allows users to open sidebars
    for browser history and bookmarks without affecting their ability to view page
    content. In addition, users with vision deficiencies may prefer to use larger
    text sizes, which can be easily accommodated with liquid-width designs.


    Although this study by Bernard and Larsen (2001) found no significant differences
    in user performance with liquid- or fixed-width layouts for reading and searching
    tasks, most users preferred a liquid layout. It could be argued that Bernard and
    Larsen’s conclusion is dated because they used a monitor of 1024 × 768, and almost
    40 percent of users on the Web use screen resolutions higher than 1024 × 768 and
    may have a different preference (see wschools, www.wschools.com/browsers/browsers_display.asp).
    However, using larger-resolution monitors does not imply that users maximize their
    browser window to their maximum screen resolutions, and 60 percent of users use
    screen resolutions of 1024 × 768 or lower.


    # How


    Designing a liquid-width or fluid-width layout requires page components—at least
    occupying the main content area—to have a specific width relative to the browser’s
    window, which is usually accomplished by designing pages using percentage values.
    For example, overall content can be set to 100 percent, main content to 62 percent,
    and sidebar content to 38 percent (Clarke, 2007).


    IT’S OK TO KEEP NAVIGATIONAL AREAS AS FIXED WIDTH


    It’s not necessary for all layouts to expand proportionally for large windows.
    Elements such as navigation, sidebars, and calls, may be kept to a certain width,
    while keeping areas occupied by main content flexible (Figure 1.2). This minimizes
    jumping and readjusting of page components when users resize their browser’s.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_363_0.png)


    FIGURE 1.2 Gmail keeps left navigation fixed while expanding content areas.'
  merge: -1
  pgno: 363
