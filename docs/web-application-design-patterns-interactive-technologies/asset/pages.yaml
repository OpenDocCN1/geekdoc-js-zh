  md: '# REPUTATION


    # Problem


    In many community-based web applications, it''s important that users feel comfortable
    interacting or transacting with others with indicators whom they have no prior
    experience. In addition, users may need some indicators to identify the trustworthiness
    or expertise of people who are offering suggestions, solutions, or products. Some
    common scenarios are choosing a seller from whom to purchase an item (e.g., eBay,
    Amazon Marketplace, Nextf), choosing a book to buy (e.g., Amazon, Yelp), choosing
    a movie to rent (e.g., Netflix), choosing a restaurant to visit (e.g., choosing
    a suggestion or an answer offered by a person (e.g., Yahoo!) Answers, and so forth.
    (Porter, 2008).


    # Solution


    Enable some form of reputation system help users identify with high reputations.
    The reputation system must not only make easy to identify and compare reputations,
    but it should also have a consistent and reliable way for building reputations
    (Figure 9.33).


    # Why


    Online interactions and transactions (money or otherwise) involve two types of
    users: providers (sellers) or receivers (consumers) of services, and information.
    In the absence of a face-to-face interaction, providers need to establish trust
    or a positive reputation for users. Designing a reputation system is then a to
    establish criteria for determining trustworthiness of providers and receivers
    within the community. Having a reputation system in place, helps users better
    anticipate the likelihood of outcome when transacting with other community users.


    Further, not all community users are equal—some are more experienced, reliable,
    and credible than others. Distinguishing them helps in determining how much weight
    to give their opinions and recommendations. Finally, using a reputation system
    to build reputations is not just a way of establishing trust, but also an important
    motivation for users to participate in community-based applications (Porter, 2008).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_279_0.png)


    FIGURE 9.33 eBay allows buyers to rate sellers on several criteria. Once sellers
    receive 98 percent positive feedback, they receive a Power Seller badge.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# CHAPTER 9 Social Applications


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_280_0.png)


    FIGURE 9.34 Yelp offers several ways for users to gain reputation: total number
    of friends, number of reviews, number of first reviews, number of fans, number
    of compliments, and soft.


    # How


    Users’ reputation is typically based on two criteria (Figure 9.34):


    +   1. A user’s connections, actions, and history within the community. This includes
    how long a user has been as an active community member, the total number of connections
    (or friends), the number of followers (or fans), the number of recommendations,
    the number of reviews, and so forth.

    2. The feedback from other community members. In other words, what others who
    have no apparent interest in a user''s reputation say about him or her (Crumsh,
    2004; Porter, 2008). Therefore, a reputation system must include a feedback mechanism
    to judge the quality, timeliness, and accuracy of claims made about the products,
    services, and information. In addition, a reputation system should be robust enough
    to prevent abuse and manipulation by its users.


    Having multiple ways to achieve a reputation is important because it allows users
    to gain reputations in ways that match their behaviors and personalities. Like
    *connectors* and *mavens* in Malcolm Gladwell''s *The Tipping Point* (2000), some
    can achieve a reputation by having a large network and by writing useful and extensive
    reviews.


    # OFFERS US A QUICK WAY TO JUDGE A REVIEW’S USEFULNESS


    Web applications that allow users to submit reviews also allow readers of reviews
    to judge their usefulness. Allowing all to see the usefulness of submitted reviews
    reduces the chances of bias and abuse and encourages reviewers to submit detailed
    and relevant information. In addition, the usefulness ratings can be used by other
    users to judge the reputation of the reviewer.


    To make it easy to rate usefulness, ask users to simply indicate whether a review
    was helpful or useful without accompanying comments or ratings (Figure 9.35).'
