    # USER PROFILE


    # Problem


    Web applications require users to log in typically store user information so they
    can manage (i.e., add, update, and remove) it and keep up to date. In most applications,
    information is private and accessible only to the account owner. Social applications,
    however allow users to make some or all information public. Typically labeled
    User Profile, user account information on such applications is quite detailed
    and may be completely filled out.


    # Solution


    Allow users to manage their profiles and keep all or part of them private. In
    addition, for social networking applications, extend the User Profile to include
    users'' connections and interactions with their online community (Figure 9.26).


    # Why


    For online community–based applications and social networking applications, users''
    identities are revealed through their profiles. The more detailed a user''s profile,
    the easier it is for other users (and the application) to decide whether they
    share similar interests and whether they can trust him or her before connecting
    ("friending\).


    This is not to downplay the fact that users'' profiles may contain "made-up" information
    when they believe it will improve their appeal to other users—for example, in
    matchmaking applications and online marketplaces. However, users'' identities
    are also established by what others say about them—their ratings, recommendations,
    testimonials, and so forth—and can help, at least to a certain extent, to mitigate
    fraud and misrepresentation.'
