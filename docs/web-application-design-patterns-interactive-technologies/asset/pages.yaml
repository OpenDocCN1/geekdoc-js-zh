    SHOW THE PRESENCE OF MORE SEARCH RESULTS, IF APPLICABLE


    In instances where the number of search results is excessive and cannot be enumerated
    as pagination controls, indicate the presence of additional results using either
    a “more” link or other indicators such as an ellipsis (Figure 6.33).


    SHOW TOTAL NUMBER OF RESULTS AND RANGE USERS ARE VIEWING


    Because pagination controls serve as both navigation and orientation mechanisms,
    they should clearly indicate the pages they are viewing, the pages they have already
    viewed or skipped, and the pages they have yet to view. The page that users are
    on should be clearly distinguished from the rest of the pages, and it should not
    be clickable so that users can keep track of where they are (Figure 6.34).


    ALLOW USERS TO NAVIGATE DIRECTLY TO THE FIRST PAGE OF SEARCH RESULTS


    For really large datasets (more than 10–15 pages), allow users to jump to the
    first page, since it usually contains the most relevant results. Typically, users
    are also shown a link to the last page in the search results, however, when showing
    a large number of search results, the link to the “last” page is disappearing.
    This is justified for two reasons: The first page contains the least-relevant
    results, and users are unlikely to jump to the results on the last page need.
    Second, users typically do not go beyond a first few pages to find the items they
    need. According to Nielsen (2001), “Users almost never look beyond the second
    page of search results.


