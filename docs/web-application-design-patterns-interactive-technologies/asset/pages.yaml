    # ALLOW USERS TO CHANGE THEIR INITIAL LANGUAGE SELECTION


    Regardless of users'' initial language selection, allow them to change their language
    selection in case they are capable of comprehending multiple languages and prefer
    to view the page content in a different language. Language choice can be made
    using either a set of links or a dropdown menu depending on the available screen
    (Figures 10.34 and Figure 10.35).


    # KEEP USERS ON THE SAME PAGE


    Once a user changes the language, designers can show the users where they are
    currently in the selected language or take them to the “home” page of the application.
    Taking the user to the home page is appropriate for applications where a page
    may not be available in another language (e.g., Wikipedia) or if an application
    needs to serve the user using a different server and moving the session''s data
    might be problematic. However, showing users the same page after selecting a different
    language is preferred, since users can easily switch the language on any page
    within the application and not to worry about losing their page (Figure 10.36).


    # REMEMBER USERS'' LANGUAGE CHOICE


    Make users'' language selection persist—that is, do not require them to make the
    choice again when they navigate to a different page within the application during
    the same visit or a return visit to the application in the future.'
