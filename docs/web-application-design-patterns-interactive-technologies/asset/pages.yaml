    To address these design challenges and accompanying usability problems, many corporations
    develop user interface design guidelines and style guides to manage the web application’s
    “look and feel.”


    Applying design guidelines to develop usable web applications is not easy, however.
    Design guidelines are limited in their effectiveness, they often advocate high-level
    principles (e.g., make system visible; recognition better than recall; prevent
    errors) or offer very specific guidance (e.g., align table headings to match the
    alignment of column data). On the other hand, style guides focus on branding and
    visual design aspects and are specific to a platform (e.g., Macintosh OS X and
    Windows Vista) or to applications developed by a specific corporation (e.g., “Oracle
    Browser Look and Feel [BLAF] Guidelines,” 2004), and do not provide detailed guidance
    for developing usable interactions.


    Design guidelines and style guides are also quite lengthy and difficult to follow,
    because implementing one interaction requires user designers to be familiar with
    several sections within the document. For example, Apple’s “Human Interface Guidelines”
    document is about 400 pages, and to create a dialog with controls, a designer
    would have to be familiar with several sections within “Part III: The Aqua Interface”(Figure
    1.8), which has about 250 pages allocated to it.


    Finally, design guidelines and style guides can also become too esoteric to those
    not familiar with human-computer interaction. This can limit their effectiveness
    as a means of communication among web application development team members, including
    customers, subject matter experts, clients, requirement analysts, software developers,
    product managers, and marketers who are unlikely to be well-versed in human-computer
    interaction and usability.


    +   - Part III: The Aqua Interface

    + User Input

    + Drag and Drop

    + Text

    + Icons

    + Cursors

    + Menus

    + Windows

    + Controls

    + Layout Guidelines


    **Figure 1.8** “Part III: The Aqua Interface” section of Apple’s “Human Interface
    Guidelines” comprises about 250 out of the document’s 400 pages.'
