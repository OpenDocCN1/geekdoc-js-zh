    # ERROR MESSAGES


    # Problem


    Errors are inevitable, even with the most usable form design. Despite appropri-ate
    labels and instructions, not all users will submit the form with accurate and

    complete information every time. The following types of errors are particularly
    common:


    +   - Missing information. This is when users fail to provide one or more

    required information.

    - Formating errors. This is when users’ input does not match the desired

    format—for example, mismatched data types (numerical alpha-betical), length shorter
    or longer input than desired), date

    format errors, decimal errors, and so forth.

    - Invalid information. This is information provided is incorrect—for

    example, incorrect user ID and password, “to” date before the “from"

    ate in a date range, and so forth.


    # Solution


    Show an error message and clearly indicate the reasons for the error(s)\and appropriate
    instructions for fixing them. Additionally, show error messages

    ton the same page as the form and retain the user-entered data (Figure 2.36).

    This approach has two important benefits:


    +   1. Users can refer to the error message while correcting the error(s).

    2. Users don’t have to reenter correct data.


    # Why


    When errors are managed gracefully, users can quickly fix problems and are not

    distracted from their main task (or goal).


    # How


    Most important, ensure that users know that an error occurred right away. Grab

    users’ attention to the error by showing messages in a salient color (either the

    background color or the text color). In addition to color, consider using an alert'
