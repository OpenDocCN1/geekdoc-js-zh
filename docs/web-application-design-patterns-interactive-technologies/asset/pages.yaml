    and to. A good example is SlideShare (www.slideshare.net), where users can create
    event-based groups. The advantage of event-based groups is that they can allow
    users to join groups for specific dates and locations.


    # ALLOW USERS TO MAKE GROUPS PUBLIC OR PRIVATE


    Groups created by users can be either public or private (Figure 9.50). Public
    groups are helpful for general-interest subjects, such as cooking, hiking, politics,
    and so forth, that are likely to have participation from many users. These groups
    may spawn subcommunities as users'' interests demand. Private groups are typically
    created by users who have very specific goals or are dealing with topics that
    are sensitive in nature.


    Public groups can be joined by anyone and may not require acceptance by the creator
    of the group. Private groups, on the other hand, are restricted to those invited
    by the creator. Joining public groups is usually easy as clicking “Join this group”
    and confirming the intent.


    # ENCOURAGE USERS TO JOIN AND PARTICIPATE


    Users generally prefer to join groups or communities that are active. Therefore,
    it is important to show indicators of group activity such as number of users,
    number of posts, reply of posts, and so forth (Figure 9.51).


    It also helps to show a gallery of active groups. This may be done by showing
    users'' avatars as part of the discussion and/or showing a gallery of new or active
    community members.


    # SHOW THEIR FRIENDS'' GROUPS


    Because users share some commonality with their friends, they are more likely
    to join the groups to which their friends belong. Therefore, it’s important for
    users to see the groups their friends have joined.'
