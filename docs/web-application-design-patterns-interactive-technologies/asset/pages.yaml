  md: '# CHAPTER 7 Lists


    # Events


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_193_0.png)


    FIGURE 7.23 When users click "Calendar," Clemson University''s web site shows
    a monthly events view by (a) and allows them to switch to a weekly or daily view
    by (b). In all views, users may navigate to another month or day using the calendar
    control or "previous" and "next" pagination controls.


    # Solution


    Use a calendar-like format to present items. Additionally, considering items in
    a list view as well as allows users to switch between them (Figure 7.23).


    # Why


    Users generally know how to interact with calendars because of their familiarity
    with desktop applications such as Outlook, Entourage, iCal, and so forth. In addition,
    a calendar view makes it easy for users to scheduled events and helps them by
    planning because they can clearly see and busy time slots.


    # How


    Show a calendar with an appropriate default view—for example, calendars for personal
    or business use typically show a weekly view by default. However, allow them to
    change it to a different view per their preference (Figure 7.24).'
