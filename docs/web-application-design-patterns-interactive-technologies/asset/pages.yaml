    # Related design patterns


    HELP WIZARDS may follow the design practices for navigational WIZARDS (Chapter
    5). In addition, we use the design practices for RATINGS for collecting user feedback
    on the usefulness of help wizards (Chapter 9).


    # HELP COMMUNITY


    # Problem


    Even when incorporating all the help approaches so far, it''s almost impossible
    to anticipate all usage scenarios and user questions. This is true especially
    for expert users, who stretch the boundaries of the application and test its limits.


    # Solution


    Allow application users a venue such as discussion forums and blogs to facilitate
    sharing problems, solutions, and experiences (Figure Web.23).'
