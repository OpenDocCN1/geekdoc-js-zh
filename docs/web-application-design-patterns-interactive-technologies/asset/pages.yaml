  md: 'content paragraphs is not created using markup as <p>&nbsp;</p>, and markup
    doesn''t include <ul> or <blockquote> tags to achieve indentation.


    # Why


    With semantic markup, users accessing a web application using browsers with limited
    or no support for style sheets or scripting languages will be able to understand
    the content structure, the relationship among pages, and the nature of content
    inside an element. This is extremely important for users with screen readers,
    who ignore style sheets and allow users to navigate using structural markup—for
    example, JAWS for Windows, a screen reader, allows users to navigate page headings
    and accessing appropriate sections within the page can become extremely difficult
    (Canneron, 2008).


    Using semantic markup along UNOTRUSIVE CSS facilitates a clear separation of structure
    and presentation and affords the largest reach by supporting a variety of browsers
    and devices. In addition, separating page structure from presentation simplifies
    the page design and makes it possible to easily adapt and optimize the presentation
    for different devices and technologies.


    # How


    In markup, semantics is concerned with the meaning of an element and how that
    element describes the content it contains.


    > Molly E. Holzagal (2005)


    At its most basic level, using semantic markup requires selecting and using HTML
    tags that match the desired intent of elements and do not rely on their presentational
    effect as interpreted by browsers. For example, the <blockquote> is intended to
    quote text from an external source and not to indent text contained within the
    <blockquote>. Similarly, to emphasize text, the <em> tag should be used instead
    of <i>, and the <strong> tag should be used instead of <b>. Although <b> and <i>
    are not deprecated, even in recent versions of HTML or XHTML, even of <em> and
    <strong> are more appropriate for emphasizing certain words or phrases. Screen
    readers can use a different inflection when encountering them in text and convey
    the emphasis.


    Similarly, headings, paragraphs, and lists within a page should be marked with
    available HTML markup tags as <h1>, <h2>, <p>, <ul>, <ol>, and so forth, not with
    tags as <div> or <span>, which do not have any inherent meaning.


    # STRUCTURE DOCUMENTS USING HEADINGS AND LISTS


    Organize web pages using heading-related tags such as <h1>, <h2>, <h3>, and so
    on. Headings establish page information structure and help users identify hierarchy.
    Users interacting with the page using screen readers or other assistive technology
    can use the page structure to navigate (see the ACCESSIBLE NAVIGATION pattern
    later in this chapter). They can jump from'
  merge: -1
