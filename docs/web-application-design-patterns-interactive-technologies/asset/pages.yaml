  md: '# Utility Navigation


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_118_0.png)


    **FIGURE 5.12** Buy.com uses an icon for the cart and oranges to visually distinguish
    "View Cart" from other navigation options.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_118_1.png)


    **FIGURE 5.13** Rally Agile Pro allows users to switch workspaces by selecting
    a different workspace from a dropdown in the utility navigation.


    # How


    Place utility navigation in the header region (preferably in the top-right corner
    of the page) of all web applications. In addition, give it less prominence over
    the primary navigation.


    # EMPHASIZE COMMONLY ACCESSED FUNCTIONS


    For utility functions accessed more frequently than others (e.g., shopping carts
    for e-commerce applications), make them salient by supplementing their labels
    with icons and/or by a visual treatment that clearly distinguishes them from other
    utility navigation options (Figure 5.12).


    # USE UTILITY NAVIGATION TO ALLOW SWITCHING AMONG WORKSPACES OR APPLICATIONS


    Web applications that allow users to create and access multiple workspaces—for
    example, multiple projects—often use a utility navigation to allow them to switch
    between workspaces (Figure 5.13).


    Similarly, application suites, as those offered by Google and Zoho, allow users
    to switch among applications using utility navigation (Figure 5.14).


    # INCLUDE A LANGUAGE SELECTOR IN UTILITY NAVIGATION


    Web applications supporting multiple languages usually include options to change
    the language (or the country) as a utility navigation option (Figure 5.15); see
    also the LANGUAGE SELECTOR pattern in Chapter 10.


    # Related design patterns


    Utility navigation options discussed here are "global" in nature (e.g., apply
    to the entire page) and are placed in the header region. there'
