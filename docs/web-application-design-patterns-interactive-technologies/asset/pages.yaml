    # ALLOW USERS TO CUSTOMIZE DASHBOARDS


    Although dashboards are often personalized to meet the needs of specific user
    roles, it''s possible that the same layout and design may not satisfy all users
    in a given role. For example, some users may use the default chart format, others
    prefer a tabular view. In addition, some users may want to reorganize the information
    presented to better match their needs. Accommodate such individual differences
    by allowing users to customize their dashboard layouts (see the CUSTOMIZATION
    pattern later in this chapter).


    # ALLOW USERS TO "DRILL" TO VIEW DETAILED INFORMATION


    When viewing dashboards, users may need additional information to better understand
    the summary views or before decisions on corrective actions. Therefore, from the
    dashboard, allow users to "drill" down to the detailed information that formed
    the base of the summary view (Figure 4.11).


    # ALLOW USERS TO TRANSFER OR SHARE DATA


    Users may want to download dashboard data locally to further analysis and/or share
    them with others. This can be accomplished by enabling actions such as downloading
    a detailed report in formats as PDF, Excel, or XML, or sending emails to other
    users from the dashboard (Figure 4.12; see also the LIST UTILITY FUNCTIONS pattern
    in Chapter 7).'
