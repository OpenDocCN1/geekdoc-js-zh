    # The bookmarking problem


    Because the browser''s location/address bar stays exactly the same when users
    select functions and change the application''s state, turning bookmarking into
    specific application views is impossible. Although some clever approaches are
    available to address the bookmarking problem by rewriting URLs, it is typically
    not a big issue for web applications because users do not need to bookmark specific
    states. For more information on URL rewriting, see AJAX: How to Handle Bookmarks
    and Back Buttons, Brad Neuber (2005) at http://www.onjava.com/pub/a/onajava/2005/10/26/ajax-handling-bookmarks-and-back-buttons.html'
