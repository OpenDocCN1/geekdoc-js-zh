    # Related design patterns


    Because uploaded files may be large, especially when adding media files, users
    of the DELAY/PROGRESS INDICATORS (see Chapter 8) pattern is relevant and should
    be considered. In addition, most applications that support user-generative content
    require that users describe them using tags (TAGGING).


    # TAGGING


    # Problem


    Web applications allow users to add content (e.g., bookmarks, photos, music, videos,
    and so forth) may also want to allow them to categorize or label their uploaded
    content to it easier to find later. However, with all the different ways users
    may want to label content, it may be impossible to anticipate and make all potential
    labels and variations (or categories and subcategories). For example, users may
    want to label personal photos with labels such as names of people, occasions,
    locations, ages, emotions, and so forth.


    # Solution


    Allow users to label (i.e., tag*) content with any descriptive information they
    desire so as to make it easy for them to find later (Figure 9.6). The labels used
    for tagging content should not be restrictive except when might be offensive to
    the users of the application; for example, an application might not want to include
    profanity in labels.


    # Why


    The use of open-ended tags encourages a personally meaningful and natural vocabulary.
    This makes it easy for users to find items later and allows them


