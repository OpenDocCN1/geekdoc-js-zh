  md: 'can be alleviated to a certain extent by the use of location breadcrumbs (see
    the BREADCRUMBS pattern later in this chapter).


    # HIGHLIGHT SELECTED PRIMARY AND SECONDARY NAVIGATION OPTIONS


    To orient users with the application, highlight the currently selected navigation
    option, both primary and secondary, in some way, such as by a combination of font
    size and weight, foreground and background colors, and border size colors (see
    Figure 5.10).


    # Related design patterns


    Because an application''s hierarchical structure is made accessible through its
    navigation system, SECONDARY NAVIGATION cannot be considered without the PRIMARY
    NAVIGATION. Use of BREADCRUMBS is recommended, as they not only make an item''s
    placement in the hierarchy visible, but they also allow an efficient way to backtrack
    to a higher level in the hierarchy.


    # UTILITY NAVIGATION


    # Problem


    Users need access to certain functions and tools, such as their shopping cart,
    help, log in, log out account information, preferences, language selections, country
    selections, text-size selections, and so forth, on all application pages. Although
    they are key functions and need to be accessed from anywhere in the application,
    they are typically not used frequently.


    # Solution


    Group such functions and tools (i.e., utilities) allow users access to them from
    all pages within the application. Because they need to be accessible from anywhere
    in the application, place them in the header region (Figure 5.11).


    # Why


    Utility navigation allows users access to important and key application functions.
    By placing them in a consistent, expected location throughout the application,
    users can find them easily. However, they are not the primary mechanism for navigating
    the application and should be given visual prominence when compared with the primary
    navigation.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_117_0.png)


    FIGURE 5.11 Snapfish separates utility navigation functions—“log out,” “help,”
    “your cart,” and “your account”—in the top-right area of the page.'
