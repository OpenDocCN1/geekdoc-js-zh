    # Solution


    Show list items as a "tree" of items, which clearly illustrates the relationship
    between parent and child item(s) (Figure 7.18). List items at the parent level
    (i.e., a group node or parent item) may contain other groups (i.e., parents) and/or
    individual items (i.e., a leaf node or a child item) and can be expanded and collapsed
    to view its contents.


    # Why


    For lists, especially in emails and forums that have several participants and
    topics, it''s important to show how items relate to each other. Showing items
    in a hierarchical list makes it easier for users to follow the thread of a discussion
    or conversation. In addition, it makes it easier to trace the discussion''s history.'
