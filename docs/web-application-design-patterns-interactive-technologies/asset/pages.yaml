    # DESIGN TO PREVENT SELECTION ERRORS


    In instances where users'' selections are constrained by the number of items they
    can select the specific items they can select, design the interface to prevent
    errors. For example, if users cannot select more than 4 items from a list of 10
    items, and as soon as users have selected 4 items, disable the checkboxes for
    other items. Or if there are dependencies on what users may select, enable or
    disable options based on their selections (Figure 7.57).


    # SHOW CONFIRMATION AND ACKNOWLEDGMENT MESSAGES AS APPROPRIATE


    List actions affect the list items in one of the following ways:


    +   1. They immediately apply the action to selected items and show users the
    result. The result may be shown on the same page or on a separate page. For example,
    such as "update cart," take users on the same page, whereas actions, such as "compare,"
    take users to a separate page.

    2. They ask users for additional information by showing a dialog or taking them
    to a separate page. Once users provided additional information and submitted the
    request, they are returned to the list page, where they can see the results of
    the selected action. The actions in this category include "new," "edit," "copy,"
    "email to a friend," and so forth.

    3. They confirm their intent by requiring them to respond affirmatively to the
    selected action—example, "Are sure you want to delete... ?" (Figure 7.58). Requiring
    users to confirm their intent is important for actions that lead to unrecoverable
    data loss (e.g., "delete”).

    It''s important to remember that not all "delete" actions require a confirmation
    message; only those with irreversible outcomes should require user confirmation.
    For example, deleting an item from a shopping cart should not require confirmation,
    as it''s relatively easy to add it back.'
