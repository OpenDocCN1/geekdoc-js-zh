    # SINGLE SIGN-ON (SINGLE LOGIN)


    Many web applications, especially business-to-business (that is, extranet) and
    business-to-employee (that is, intranet) applications, allow users to access one
    or more related applications based on their access rights. Such additional applications
    should be enabled for single sign-on (commonly referred to as SSO) so that once
    users have logged in, the same credentials are used to verify their identity with
    other applications. Users'' transition from one application to another should
    be seamless, and thus feel they are using the same application. For instance,
    once users have logged in their Google Mail account, they do not have to log in
    again for accessing related applications such as Google Calendar and Google Documents.


    # CONSIDER ALLOWING THE USE OF “UNIVERSAL LOGIN” SERVICES


    As mentioned earlier, allow users to log using “universal login” services such
    as OpenAPI and Windows CardSpace (Figure 3.23). Such services allow users to create
    a digital identifier and use it to log in any application supporting its use.
    This is similar to the SSO approach, except that users'' credentials are maintained
    by a third-party identity provider rather than the web application provider.'
