  md: '# Personalization


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_93_0.png)


    ### 4.18

    Netflix, an online movie rental web application, recommends movies based on users''
    ''rental'' history and their ratings of movies they have watched. Netflix also
    personalizes recommendations based on users'' age and gender.


    # # Pawan, welcome back to Netflix!


    Based on your genre ratings and past activity, we''ve created a homepage for you.
    Over time, it will change as we learn more about what you like. By adding at least
    5 movies to your Queue!


    # ### TV Cinema Dreams


    Based on your interests:

    - Season 3

    - Season 4


    Netflix recommends movies based on users'' rental history and ratings.


    # # Why


    Personalization is becoming increasingly common in helping users manage access
    to an unlimited amount of information. Rather than presenting “all” information,
    users are only offered information that meets their needs and interests (Anand
    and Mobasher, 2005; Koch and Rossi, 2002; Rossi et al., 2001). Thus, personalization
    helps in two ways: It reduces “clutter” by eliminating items that users are unlikely
    to be interested in or sought out on their own. Furthermore, because the personalized
    (or recommended) list of items is based on users'' interests and behaviors, users
    would have less anxiety in considering them for purchase or engaging in other
    transactions.


    # # How


    Personalized experiences can be offered at two levels:


    +   - Based on known facts about users such as their demographic information or
    stated interests (explicit personalization).

    - Based on inferred interests from users'' past interaction and transaction history
    (implicit personalization).


    # # EXPLICIT PERSONALIZATION


    At its most basic level, an application can offer personalization simply by welcoming
    users with their name (Figure 4.19).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_93_1.png)


    FIGURE 4.19 Morningstar greets users with a “Welcome [first name]” message log
    in.'
