  md: 'The only way for assistive technology users to select the last item in the
    drop-down list would be to repeatedly go back after selecting an option from the
    dropdown list, navigating to the page, and then select the next option in the
    list and so forth, until the last item is reached.


    # Related design patterns


    Using JavaScript unobtrusively requires that pages be built using the principle
    of PROGRESSIVE ENHANCEMENT and that the "behavior" layer provided by JavaScript
    be completely separated from the structure and presentation layers (provided by
    SEMANTIC MARKUP and UNOBTRUSIVE STYLE SHEETS, respectively), such that its unavailability
    does not make the web application inaccessible.


    # ACCESSIBLE FORMS


    # Problem


    Forms may become difficult to use if they are designed without regard to their
    use with keyboards and assistive technology as screen readers or Braille readers.


    # Solution


    Lay out form elements and incorporate appropriate accessibility tags in the markup
    to make forms accessible to assistive technology users. At a minimum, associate
    forms with labels using `<label>` tags, group form elements using `<fieldset>`
    and set appropriate sequences for tabbing through elements using `tabindex` attributes.


    # Why


    Forms are the foundation of web applications. Making them accessible is essential
    to ensure the widest reach. Using `<label>` tags and grouping forms using `<fieldset>`
    also means adding to elements and helps create a semantic structure in the markup
    (see the SEMANTIC MARKUP forms earlier in this chapter). These techniques not
    only make forms accessible for assistive technology, but they also make them more
    usable and readable for users with disabilities.


    # How


    First and foremost, follow the patterns in Chapter 2 to make forms usable and
    accessible. Ensure that forms are organized in a logical order and that it is
    easy for users to associate a form element with its label.


    # USE <LABEL> TAGS TO IDENTIFY CORRESPONDING FORM ELEMENTS


    Use `<label>` tags to associate fields with their corresponding form elements
    as follows:


    ```

    <label for="firstName">First Name:</label>

    <input type="text" id="firstName" name="firstName" />

    ```'
