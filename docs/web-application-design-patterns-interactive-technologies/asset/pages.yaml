    To ensure that users don''t waste time rerating an item, let them know if they
    have already rated (Figure 9.15). Although users should be allowed to change their
    mind and remove ratings, to prevent abuse, they should not be allowed to rate
    the same item more than once.


    # SHOW USERS A BREAKDOWN OF THE RATINGS


    Average ratings are typically used to show an item''s rating. However, when an
    item has received fewer ratings, the average rating is not very reliable. For
    example, if an item has received a rating of five stars, four stars, and one star,
    showing the rating, it will display the average rating—not a true reflection of
    user preference. To ensure that the item''s quality is judged more accurately,
    show users a breakdown of the ratings (Figure 9.16).


    # ALLOW USERS TO RATE AN ITEM USING MULTIPLE CRITERIA


    When an item may be judged on several criteria (e.g., ambience, quality of service),
    offer users additional evaluation criteria to encourage more precise evaluations
    (Figure 9.17). Providing additional rating criteria may also identify specific
    aspects of an item that users favored (or did not favor).'
