  md: '# Registration


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_50_0.png)


    FIGURE 3.2

    Wufoo, an online form-builder application, uses a simple registration form that
    asks only for the essential information for creating an account.


    Because users cannot see the password they entered, ask them to confirm the password
    by re-entering it. In addition, if required for legal reasons, ask them to agree
    to the usage terms and conditions.


    When users need to set up an account, it''s important that forms are as short
    as possible and ask only for relevant information so users are distracted only
    for a short period of time and can continue to accomplish their goals. Asking
    for nonsensical information increases the time it takes to register and increases
    the chances of user error. This may cause a user to abandon registration or provide
    incorrect or nonsensical data.


    When asking users for any personally sensitive information, such as birth date,
    gender, race, and so, forth, clearly indicate why the information is needed and
    how it will be used (Figure 3.3).


    # CONSIDER USING AN EMAIL ADDRESS FOR A USERNAME


    When registering, users are often required to choose a unique identifier for their
    account such as a username or email address. Email addresses are often a better
    choice because they are always unique and easier to remember when users have multiple
    accounts. In addition, when users have to be reminded of their login credentials,
    it''s easier to send the reminder information to their registered email address
    (see FORGOT USERNAME/PASSWORD pattern later in this chapter).


    # USE CAPTCHA TO ENSURE REGISTRATION BY HUMANS


    An increasing number of automated crawlers have made it difficult to distinguish
    them from legitimate human users. Use CAPTCHA as part of the registration form
    to minimize registration by such automated agents (Figure 3.4).'
