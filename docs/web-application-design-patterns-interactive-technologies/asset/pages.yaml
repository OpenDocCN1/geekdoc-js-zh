    # ALLOW TAILORING OF CONTENT BASED ON USERS'' ROLES AND NEEDS


    Portals typically allow access to a large amount of content, only a small portion
    of which typical user would be interested in. For example, a system administrator
    in the information technology (IT) group would be interested in completely different
    types of content and applications on an intranet than a recruiting specialist
    in human resources (HR). Similarly, for many extranet portals, users (customers)
    would need access to completely different content than partners and resellers.
    Therefore, portals should allow personalization and customization of content based
    on users’ roles and needs (see the PERSONALIZATION AND CUSTOMIZATION patterns
    in this chapter). For public portals (e.g., Google, My Yahoo!, and My MSN), users
    are typically offered a default page to which they may add pages as necessary
    (Figure 4.16).


    # MAINTAIN A CONSISTENT APPEARANCE


    Although portals allow access to a variety of applications, they should strive
    to provide a consistent user experience. This can be achieved by maintaining a
    “look and feel” throughout the portal.


    # AUTOMATICALLY SIGN-IN US TO APPLICATIONS


    A portal should not only look unified on its appearance. It should behave in a
    unified manner, once logged in to the portal, unless necessary security is required,
    allow users to access different applications seamlessly without requiring them
    to log in separately; that is, the portal should support single sign-on (SSO)
    (Figure 4.17; see also the LOG IN pattern in Chapter 3).


    Although SSO is feasible for enterprise portals, many web portals allow the incorporation
    of other applications using web services to which users may have to log in separately.
    For example, Google allows users to view their Jott (www.jott.com) reminders in
    its own portal, which requires them to log in separately. In such instances, offer
    a “remember me” option so that users do not have to log in every time they access
    the portal.


    # ALLOW USERS TO CUSTOMIZE PORTAL’S APPEARANCE


    Unlike many web applications, portals are designed for regular and frequent use.
    To ensure that users are as productive as possible with the portal, and to'
