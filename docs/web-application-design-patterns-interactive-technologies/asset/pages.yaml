  md: '# TYPES OF BREADCRUMBS


    Instone (2002) identified the following types of breadcrumbs.


    Location breadcrumbs. Location breadcrumbs is perhaps the most commonly used type
    of breadcrumbs. They indicate a page''s position within the application irrespective
    of the path—by browsing, searching, or deep linking from any page within the application—users
    take to reach it.


    A variation of location breadcrumbs is the look-ahead breadcrumbs (LAB) developed
    by Teng (2003). For each page in a location crumbs trail (except the current page),
    a dropdown list of links to pages at that level in the hierarchy is included.


    Path breadcrumbs. Unlike location breadcrumbs, path breadcrumbs are dynamic trails.
    They show the path taken by users within the application to reach the current
    page. Because users can take different routes (e.g., browsing, searching, etc.)
    to reach a page, several breadcrumbs exist for the same page.


    Nielsen (2007) refers to path breadcrumbs as history trails and advocates against
    their use because they duplicate the functionality of the browser''s "back" button,
    which may be confusing if users have made unnecessary digamos along the way to
    the current page. Additionally, they do not help users visualize the current page''s
    location within the application structure.


    Attribute breadcrumbs. Many large sites, where the same page can be accessed through
    multiple paths (e.g., Amazon), employ breadcrumb features describing metainformation
    about the current page within the site hierarchy (Figure 5.30).


    +   Popular in these categories: (What''s this?)

    #19 in Electronics > MP3 Players

    #19 in Electronics > Portable Audio & Video


    > FIGURE 5.30 Amazon uses breadcrumb features to indicate product information.
    In essence, they indicate the current item''s location from all places within
    the application structure.


    page. In addition, allow users a quick way to jump to any page within the hierarchy
    by linking each page in the breadcrumb (except the one referring to the current
    page). Many location breadcrumbs do not show the current page in the breadcrumbs
    trail. However, several usability experts have recommended its inclusion (Instone,
    2002; Krug, 2006; Nielsen, 2007).


    # SEPARATE EACH ITEM IN THE BREADCRUMBS BY A SYMBOL


    Separate each item in the breadcrumbs trail with a symbol to suggest a navigation
    path. The most commonly used symbol is the right arrow (>). Colter et al. (2002)
    found that among the applications using breadcrumbs,47.10 percent used the > separator;
    Aery (2007) states that the use'
