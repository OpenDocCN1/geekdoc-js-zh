    interface is changing, and it is quite likely users will be unaware of these changes
    because they are focusing on other interface areas. In addition, when users are
    interacting with the application causing the page to state—for example, showing
    the next set of photos when the CAROUSEL pattern or zooming in and out of an image—showing
    users just the final state without showing intermediate states can be abrupt and
    disorienting, they may find it difficult to understand the relationship between
    the initial and final stages.


    # Solution


    Use appropriate visual effects (i.e., transitions and animations) to direct users’
    attention to page changes (Figure 8.34).


    # Why


    Because our peripheral vision is attuned to detect movement (Faraday and Suttlecliffe
    1997; Peterson and Dugas 1972), using animation to direct users’ attention to
    changes on the page is a useful and effective technique, especially for RIAs,
    where the page does not refresh with changes in the page’s content.


    Animations and transitions also have an aesthetic value that cannot be ignored.
    They make web applications appear interactive and contribute to the characterization
    of RIAs as “cool,” an attribute commonly lacking in traditional web applications,
    which are limited to relatively static images and layouts in their visual designs.


    # How


    For RIAs, use animation when page elements change appearance but not position
    (Figure 8.35; see also Figure 8.46 later in the chapter) or when they move from
    one position to another but not necessarily change appearance (see Figure 8.34).'
