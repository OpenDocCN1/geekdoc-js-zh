    # How


    Ask users to enter search criteria in a form with clearly identified search parameters.
    Where appropriate, segment the form into multiple sections so that only appropriate
    search fields are shown to users (Figure 6.9).


    # HIDE NOT-SO-COMMON SEARCH PARAMETERS


    Even when using a parametric search, it''s important to keep the search simple
    and not overwhelm users by offering search parameters they are unlikely to use.
    Hide infrequently used options under "advanced options" or "more options" and
    make them available only when users request them (Figure 6.10).


    # Related design patterns


    Although a PARAMET SEARCH can capture precise search criteria, it does not eliminate
    the possibility of large numbers of search results. Allow users to narrow down
    their search results by using either FILTERING or FACETED SEARCH.'
