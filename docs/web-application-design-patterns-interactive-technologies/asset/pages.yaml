  md: '# CHAPTER 4 Application Main Page


    # How


    Portals organize individual pieces of content and/or functions into their own
    windowlike areas, commonly referred to as portlets. Portlets behave as smaller
    windows within a web page; often support functionalities as mini-minimize, maximize,
    close, and so forth (Figure 4.14).


    When supporting several functional areas, portals usually organize them by grouping
    related content and application and then present them as pages, allowing users
    to navigate among them (see Figure 4.15).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_90_0.png)


