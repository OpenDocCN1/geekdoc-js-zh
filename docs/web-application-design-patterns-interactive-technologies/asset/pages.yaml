  md: '# CHAPTER 9 Social Applications


    to explore and interact with content in a myriad ways (Marlow et al., 2006). For
    example, by allowing users label emails (and add multiple labels to the same email),
    Gmail permits users to not use tags that describe the content of the email but
    also to describe actions and priorities (e.g., “to do,” “important,” “urgent,”
    and so forth). In addition, users do not have to force-fit items into a category/subcategory
    combination; they can place them in many virtual categories at once.


    Application developers also benefit from tagging because they do not have to address
    the whole categorization scheme (i.e., taxonomy) in advantage. By relying on users''
    tags to continually create a dynamic, evolving taxonomy (also referred to as *folksonomy*)¹
    and use it to supplement the high-level taxonomy to facilitate navigation.


    Finally, tagging can encourage user participation and sharing since it can create
    communities with shared interests and allow users to explore content that is tagged
    similar to theirs.


    # How


    Adding tags to a content item should be straightforward. To tag item, users enter
    keywords separated by a space or a comma (or another delimiter) in a text field.
    Using space as a delimiter may be problematic when users want to enter multiword
    tags. Therefore, consider of commas, semicolons, or other special characters as
    delimiters. In addition, allow users to tag both the content they are adding and
    the content that already exists (Figure 9.7).


