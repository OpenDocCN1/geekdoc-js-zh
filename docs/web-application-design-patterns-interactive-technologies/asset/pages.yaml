- img_proc: true
  md: 'users to specify and use their own style sheet over the designer’s/publisher’s
    style sheet.


    Browsers give preference to users’ style sheets unless a style declaration is
    marked important in the style sheets. Not able to override the other styles can,
    in some instances, make pages unreadable for some users. Therefore, avoid using
    important declaration in the style sheets.


    # Related design patterns


    Even when using CSS unobtrusively, it’s important to use structural tags to mark
    up pages to ensure that pages are accessible without style sheets (SEMANTIC MARKUP).
    In addition, style sheets should be embedded only after the page structure has
    been created (PROGRESSIVE ENHANCEMENT).


    # UNOBTRUSIVE JAVASCRIPT


    # Problem


    Using JavaScript on pages can offer rich interactivity and make interaction more
    pleasant. However, not all browsers support JavaScript, and users or system administrators
    may disable JavaScript because of their workplace policy or personal preference.
    Therefore, web applications may become inaccessible to at least some users.


    # Solution


    Use JavaScript “unobtrusively”—that is, incorporate JavaScript within web pages
    in such a way that not having it does not affect users’ ability to use the web
    application.


    # Why


    Using JavaScript unobtrusively and redundantly allows web applications to be functional
    without being dependent on it. When JavaScript is supported and enabled, the web
    application can offer enhanced interactivity.


    # How


    Following the principle of PROGRESSIVE ENHANCEMENT, structure the page first (SEMANTIC
    MARKUP), add necessary presentation enhancements (UNOBTRUSIVE STYLE SHEETS), and
    then enhance browser interaction using JavaScript such that not having it available
    does not affect structural and presentation layers and the use of the web application.


    # KEEP PAGE MARKUP AND JAVASCRIPT SEPARATE


    Keep all JavaScript for the web application in external JS files rather than the
    page itself or embedded in the HTML markup, and reference them using the <script>
    tag as follows:


    ```

    <script type="text/javascript" src="javascriptfile.js"></script>

    ```'
