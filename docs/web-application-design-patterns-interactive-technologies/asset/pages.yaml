  md: '# CHAPTER 11 Accessibility


    AVOID USING TEXT IN GRAPHICS

    Graphic formats (e.g., GIF, JPEG, and PNG) appear pixelated when zoomed in.

    When text is used in graphics, users who have magnified the screen to improve
    readability would end up reducing the page’s readability (Figure 11.16).

    Readability is further compromised when text is overlaid on another image or a
    patterned background. Therefore, as much as possible, avoid using text in graphics;
    it also helps with internationalization (the EXTENSIBLE DESIGN pattern in Chapter
    10).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_352_0.png)


    FIGURE 11.16 Text used in graphics appears pixelated and thus is difficult to
    read when magnified.


    # Related design patterns


    Using images should not compromise the SEMANTIC MARKUP. Therefore, use decorative
    images as background images using CSS so that they are not included in the page
    structure (see also the UNOBTRUSIVE STYLE SHEETS patterns earlier in this chapter).


    # ACCESSIBLE TABLES


    # Problem


    Reading and understanding data presented in tables can be confusing to assistive
    technology users if they are unable to establish the relationship between the
    data elements. For example, if users are not able to associate data in table cells
    to corresponding headings, they may not know exactly what the data represent and
    how they relate to data in other cells.


    # Solution


    Reserve the use of <table> tags for presenting tabular data and use style sheets
    for page layout (see the TABULAR LIST in Chapter 7). Map tabular data such that
    table captions, column headings, and row headings are clearly identified. This
    helps screen readers understand and communicate the relationship between data
    presented in tables.


    This is not to suggest that pages formatted using <table> tags are inaccessible.
    It is possible to build accessible pages using tables so that content is “linearized”—that
    is, when all table-related tags are removed and content is presented in the order
    it appears in the markup—the resulting content order matches what users would
    expect and the page is accessible to assistive technology users. However, the
    same visual and structural result can be achieved'
