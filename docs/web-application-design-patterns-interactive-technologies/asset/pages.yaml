  md: '![](img/4da2afa2580415d3d4ff98025db0a2c3_357_0.png)


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_357_1.png)


    **FIGURE 11.22** By default, Molly doesn’t show the "Skip to the Content" link
    (a). However, when users navigate to the link using the keyboard (or over it using
    a mouse), the link becomes visible (b).


    Another approach is to make the link visible when it receives focus (Figure 11.22).
    This makes the link available to those who are navigating the page using the keyboard.


    # USE HEADINGS IN THE MARKUP TO IDENTIFY PAGE STRUCTURE


    Identify sections within the page using headings markup—that is, using <h1> through
    <h6>. This allows users with screen readers and browsers to navigate using a keyboard
    (e.g., JAWS for Windows users can use the “h” key to navigate the page content).


    # Related design patterns


    It’s also important that primary, secondary, and/or utility navigation features
    are marked up using appropriate SEMANTIC MARKUP. With the availability of working-draft
    versions of ARIA, consider marking up navigation elements using appropriate “role”
    attributes (see the Accessibility and Rich Internet Applications section later
    in this chapter).


    # ACCESSIBLE ALTERNATIVE


    # Problem


    Sometimes it is not possible to make a web application accessible either because
    the technology used (e.g. RIAs) or the way it is programmed.'
