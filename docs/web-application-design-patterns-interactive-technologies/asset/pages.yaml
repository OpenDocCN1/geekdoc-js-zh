    # SEARCH RESULTS


    # Problem


    Once users have specified and submitted their search criteria, search results
    should be presented in a meaningful manner so that users can quickly get to the
    most useful results without having to “pogo-stick”—that is, need-ing to the search
    results page to find a more suitable search result (Spool, 2008a).


