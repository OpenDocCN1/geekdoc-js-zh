- img_proc: true
  md: '# CHAPTER 7


    # Lists


    # INTRODUCTION


    Lists are common in web applications for displaying a collection of items. However,
    the approach used to show lists depends on the nature of items in the collection.
    A SIMPLE LIST is typically used to present a collection of items with only one
    or two attributes. It may be used for multiattribute items, if additional attributes
    are not going to be referenced by users for comparing or sorting. Presenting multiattribute
    items for which sorting and comparing are important best accomplished using a
    TABULAR LIST.


    When list items need to show a parent-child relationship, a HIERARCHICAL LIST
    is most appropriate. In a hierarchical list may often revert to a TABULAR LIST
    when resorted as parent-child relationships may no longer be appropriate with
    the changed order of the list items.


    An EVENTS LIST and TIMELINES are used for lists containing items with time-based
    information. An EVENT LIST is appropriate when showing future events and TIMELINES
    are suitable for showing historical events.


    With increasing multimedia content, textual lists are giving way to IMAGE LISTS/GRIDS,
    where items are shown as image thumbnails. Images are now being considered for
    items that have traditionally been shown as textual lists—especially for searches.
    With geographical map information being easily accessible through open application
    programming interfaces (APIs), map-based interaction is also becoming commonplace
    and item lists with geographical (or spatial) attributes are often complemented
    by MAPS.


    In web applications, users do not simply view lists but take actions on individual
    items (e.g., edit, remove, copy, etc.) or on multiple items (e.g., compare, delete,
    etc.). These ACTIONS affect items in one or more ways. There are a set of actions,
    which do not change the items and, instead, facilitate sharing, printing, and
    analysis by exporting data in other formats (LIST UTILITY FUNCTIONS).'
  merge: -1
  pgno: 178
