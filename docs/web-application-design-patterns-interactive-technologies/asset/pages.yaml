  md: "# Extensible Design\n\nlanguage-specific instances of the application. Furthermore,\
    \ by making applications locale-independent and culture-neutral, extensible design\
    \ elements that may be misinterpreted or offensive to other cultures.\n\nAn extensible\
    \ design also helps make applications more accessible to people with disabilities.\
    \ For example, by designing the application such that it can accommodate expansion\
    \ in text size when translated to other languages, it enables users with poor\
    \ eyesight to enlarge text without affecting the page layout (see Chapter 11).\n\
    \n# How\n\nExtensible design encompasses all aspects of user interface design:\
    \ markup, images, messaging, terminology, and so forth. Following are some of\
    \ the best practices for developing an extensible design.\n\n# USE THE UTF-8 ENCODING\
    \ FORMAT FOR WEB PAGES\n\nCharacter encoding refers to mapping the characters\
    \ (alphabets, numbers, punctuation marks, etc.) to a unique number (e.g., A is\
    \ mapped to 65 in ASCII encoding format). It helps web browsers determine the\
    \ characters to display on a web page. Selecting the character-encoding method,\
    \ determines the languages a web application may be able to support. Appropriate\
    \ selection is also important for web applications that are designed to support\
    \ users who prefer languages other than English for inputting data.\n\nThe original\
    \ encoding method, ASCII, is based on the English alphabet and supports 94 characters.\
    \ ISO 8859-1, an extension of the ASCII encoding from the Latin script. It supports\
    \ English and several European languages, Japanese, Indian, and several others.\
    \ UTF-8 encoding encodes all $1,114,112$ characters in the Unicode standard and\
    \ supports the characters of most languages in the world. Therefore, to allow\
    \ maximum coverage in terms of language support, use the UTF-8 encoding format.\n\
    \nSpecifying the encoding method for web pages is pretty straightforward. Here\
    \ are examples:\n\n+   - HTML:\n  <meta http=\"content-type\" content=\"text/html;\
    \ charset=utf-8\" />\n- JSP (Java Server Pages):\n  <%@ page contentType=\"text/html;\
    \ charset=\"utf-8\" pageEncoding=\"utf-8\" %>\n\n> ASCII stands for Standard Code\
    \ for Information Interchange and is pronounced 'ascii.'\nUTF-8 refers to Unicode\
    \ Transformation Format-8 bit version."
