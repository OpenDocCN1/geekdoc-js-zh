  md: '# CHAPTER 12 Visual Design


    # ALIGN PAGE ELEMENTS ALONG GRID LINES


    Align page elements along grid lines with each other vertically or horizontally.
    The objective is not only to create a minimal number of “invisible” grids on the
    page but also to do it in a way that reveals the structure of the page visually
    and makes it easy for users to understand and find different page elements. Creating
    effective alignment also helps lead a person through the design by associating
    related elements on the page (see the VISUAL HIERARCHY pattern that follows).
    Using alignment consistently on all pages within the web application improves
    the predictability of page elements within the design.


    # CREATE REUSABLE TEMPLATES


    Once pages are laid out, they should be sliced into one or more page templates
    (depending on the number of page types) and used throughout the application. This
    ensures designs work for the entire application and therefore prevents any guesswork
    on the developer’s part as to how individual pages within the application should
    be designed.


    # Related design patterns


    One of the important reasons for using the GRID STRUCTURE pattern is to ensure
    that the resulting design leads to a logical and predictable organization, improves
    comprehension, and makes it easy for users to find desired information (VISUAL
    HIERARCHY).


    # VISUAL HIERARCHY


    # Problem


    Users need to make sense of information presented on web pages so that they can
    attend to the most important information first before moving to information of
    less importance.


    # Solution


    Design pages such that the visual hierarchy is obvious to users. That is, use
    visual cues so to clearly indicate grouping and the order of elements on a web
    page, and guide users through the page so that they understand the page’s purpose,
    comprehend its organization, and correctly assign importance to various page elements
    (Figure 12.12). As Lynch and Horton (1999) stated: “Graphic design is visual information
    management, using the tools of page layout, typography, and illustration to lead
    the reader’s eye through the page.”


    # Why


    Establishing a visual hierarchy serves several important functions (Wroblewski,
    2002):


    +   - It creates a center of interest to attract users’ attention.

    - It creates a sense of order and balance.

    - It establishes a pattern of movement to guide users through various page elements.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Visual Hierarchy


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_373_0.png)


    **FIGURE 12.12** Google Analytics’ Dashboard clearly identifies groupings of page
    elements and leads users through it with an appropriate use of images, colors,
    and font sizes and their relative weights.


    An appropriate visual hierarchy, therefore, makes users more efficient and effective
    when interacting with web applications.


    # How


    Because designers are attempting to correctly convey the importance of page elements
    through visual hierarchy, the obvious first step is to list page elements on a
    page in terms of their importance. The next step is to use one or more of the
    following visual components to order, position, and design those elements that
    reflected the desired visual hierarchy: contrast, chunking, images, alignment,
    white space, font sizes, shapes, colors, and others. For example, to elevate a
    page element to the top of an element—it could be made larger, bolder, or in a
    high-contrast color, separated from other elements using additional white space,
    wrapped into a bright-colored border, included with an image, and/or placed closer
    to the top left or top center of the page (Figure 12.13).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_373_1.png)


    **FIGURE 12.13** On Google’s home page, the logo has the most prominence (at the
    top of the visual hierarchy) because it is larger, bolder, and more colorful;
    has a high contrast with the background; is surrounded by lots of white space;
    and is placed at the center.'
  merge: -1
