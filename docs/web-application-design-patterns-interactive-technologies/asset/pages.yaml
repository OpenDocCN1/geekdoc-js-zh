    # ALLOW USERS TO REMOVE NARROW FACETS


    Show users their chosen narrowing facets and allow them to remove them as necessary,
    make it possible for them to backtrack and choose other facets to narrow down
    results (Figure 6.44).


    # Related design patterns


    Like FILTERING, faceted search assumes page refreshes with user selection of a
    narrowing option. Using DYNAMIC QUERYING is another option available when using
    rich Internet applications when selecting a facet updates the result without page
    refreshes. FACETED NAVIGATION also accompanies faceted search. The main difference
    between them is that the former focuses strictly on users browsing the information
    space, whereas the latter is initiated by a user search.


    # SAVED SEARCHES


    # Problem


    Users may want to rerun one or more of their searches in the future. Specifying
    the same search criteria over and over again is inefficient and error-prone, as
    users may forget to include one or more criteria for complex searches.


    # Solution


    Allow users to save their ad hot search queries and resubmit them as needed. In
    addition, consider allowing users to set alerts so they can be informed of new
    items that match their search criteria (Figure 6.45).'
