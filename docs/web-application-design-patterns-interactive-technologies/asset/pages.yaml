  md: '# Solution


    Provide a central application that aggregates content and functionality from different
    sources and not only presents users a unified look and feel, but also serves as
    a single launch pad or access point for those applications. In addition, enable
    users to select content and customize their presentation, and if security and
    privacy concern, restrict access to certain content and functions based on their
    roles and access rights.


    # Why


    Portals aggregate a disparate set of applications and offer a unified interface
    to users to access relevant content and applications that otherwise would have
    to be discovered and accessed independently. Portals also improve user experience
    by providing a consistent appearance and navigation (and single sign-on, SSO)
    when accessing a range of applications (the LOG IN pattern in Chapter 3). For
    many companies, a single launch point can help improve information sharing and
    collaboration among its users, which may include employees, customers, and partners.
    In addition, portals designed for self-service benefit both companies and users
    (employees or customers), as they help reduce costs for the former and increase
    convenience for the latter.


    employees need to access a wide variety of information to accomplish tasks such
    as enrolling for benefits, managing personal information, reporting and expenses,
    completing performance reviews, and so forth, each of which require them to access
    a separate application.


