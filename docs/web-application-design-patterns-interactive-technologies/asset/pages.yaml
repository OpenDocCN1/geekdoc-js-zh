    # Frequently Asked Questions


    ### WEB APPENDIX.7 FAQs on Digg. Clicking on a question causes the area below
    it to expand, revealing the answer.


    Using Digg

    How do I see all saved Diggs, submitted, or commented on?

    Whenever you save a bookmark, Digg, or comment on a submission, the article is
    bookmarked in your profile. To see these, click on the "Activity" tab in you to
    see your friend subscriptions, Diggs, and more. To visit the profile of a person
    friend, click on them anywhere on the site or enter the address manually: digg.com/",


    +   1. How do I remove the status sort algorithm from Digg?

    2. Why can I not see comments from different help?

    3. Can I change the way Diggs sort external links?

    4. After an edit, why does it say "Permalink" where the body used to be?

    5. What is a hot story?

    6. Why do some pelets get hidden when I log out of Digg?


    # Solution


    Create a page for users'' frequently asked questions (FAQs). It''s important that
    questions listed in this section really are "frequently asked" questions and organized
    so that basic questions are answered before the advanced ones (Figure-Web.7).


    # Why


    An FAQ page is where users are likely to go before going to more detailed application-level
    help to see if their questions can be answered; many users assume their questions
    are common and likely asked by others. Furthermore, compared with other forms
    of help, FAQs are usually "How do I ..." type questions. Users can more readily
    relate them to their own task and narrow down their choices to a few appropriate
    questions or determine that their question is not answered and consider other
    forms of help. Companies also benefit because they can reduce the calls to customer
    support (Jarrett, 2007).'
