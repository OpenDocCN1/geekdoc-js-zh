  md: '# FRIEND LIST


    # Problem


    Users are likely to communicate with the same core group of people—friends—colleagues,
    family, and acquaintances. Requiring them to remember information every time they
    want to contact someone would make the interaction inefficient.


    # Solution


    Allow users to create and maintain a friend list (Figure 9.44); friend list is
    also referred to as a “buddy list.” In addition, allow users to group their friends
    to make it easier for them to find and communicate as a group.


    # Why


    A friend list is similar to an address book and enables users to find their friends
    and profile information quickly. In addition, like address books, many users of
    social networking applications have tens to hundreds of friends. If presented
    just as a simple list or posted list, finding friends can become difficult. It’s
    important for users to be able to group their friends based on their relationship,
    how frequently they interact, how they were introduced, and so on. In essence,
    this helps users maintain, if they desire, an accurate “social graph” of their
    friend list. Furthermore, this feature also allows them to tailor their privacy
    controls and send messages to them as a group individually.


    # How


    Update users’ friend lists whenever they accept a request to become a friend or
    when their request to “friend” someone is accepted.


    FIGURE 9.44 MySpace allows users to view and manage their friend lists on the
    My page. In addition, it allows users to group friends into separate categories.
    They can also indicate privacy settings in terms of who can view the categories
    they.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_287_0.png)'
  merge: -1
  pgno: 287
