  md: '# CHAPTER 4 Application Main Page


    # Why


    Requiring users to navigate several application pages or run reports to monitor
    items'' status and determine actions to take is not only inefficient but also
    may cause users to overlook important information. In addition, integrating information
    from several places for every visit can become cumbersome for users.


    Dashboards, when properly designed, are “presented in a way that allows them [users]
    to monitor what''s going on in an instant (Few, 2006). By using appropriate visualizations
    for important measures (often referred to as key indicators or KPIs) all with
    exception conditions and alerts, dashboards provide at-a-glance information about
    current status and facilitate identification of necessary corrective and preventive
    actions.


    # How


    Dashboards typically serve three important functions for users:


    +   1. They monitor and track important metrics.

    2. They provide analysis to determine trends and exception conditions.

    3. They report information to facilitate diagnosis and identify corrective actions
    as necessary.


    FIGURE 4.7 Data display methods.


    Pie Charts: use pie charts to represent relationships for a few categories with
    potentially large value differences. When there are many categories that have
    smaller value differences, it may be difficult to discern the differences in this
    format.


    Bar Charts: Use bar charts for showing the relationship among data elements within
    a share common measure, or multiple series. Because data bars can be easily compared
    with one another. Bar charts may not be appropriate when a data series has few
    values with a large outlier value, which could compress the scale for the remaining
    data making discrimination among the bars difficult.


    Line Charts: Use line charts to see trends in one or more metrics.


    Tables and Lists: Use tables or lists for nonnumeric data or when a graphical
    presentation of numeric data may not be easily understood by intended users. Tables
    or lists may also serve as an alternate view for graphical data (see also Chapter
    7).


