  md: '# CHAPTER 9 Social Applications


    9.61nSlideShare offers several sharing options. When someone uploads a slideshow,
    it is automatically shared with others. In addition, you can click “Share this
    slideshow” to invite people to view it, or they can share it with the general
    population by adding the link to applications such as Digg, Reddit, and MySpace.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_298_0.png)


    An interest-by-interest of sharing is that it helps users increase their reputation
    within the community—by recognizing them as experts in some fields (see the REPUTATION
    pattern earlier in this chapter). In addition, sharing is the foundation of social
    interaction. For a community to thrive (and survive), whether online or offline,
    it’s essential that it supports sharing and improving participation and interaction
    among its community members.


    # How


    Porter (2008) identified two types of sharing: implicit and explicit. Implicit
    sharing occurs when content is shared by virtue of users’ participation in a community.
    For example, when users bookmark a page on Delicious, upload photos to Flickr,
    or put videos on YouTube, they are implicitly shared with the rest of the community,
    unless they are marked as public. Implicit sharing does not require any specific
    action from other users. Items are shared with community users as they are posted
    or made available to the application (Figure 9.62). Explicit sharing, on the other
    hand, requires users to send an explicit message, usually via an email, to access
    content on applications such as Google Docs, Zoho, and others.


    # ALLOW USERS TO SHARE CONTENT VIA EMAIL


    The most basic sharing feature is to allow users to send interesting content (e.g.,
    news stories, recipes, photos, videos, travel plans, etc.) via email. Allow users
    to share content by entering one or more recipient names and their email addresses
    (and their own information to let recipients know who is sending the information).
    The shared content may be part of the email or sent as a link'
