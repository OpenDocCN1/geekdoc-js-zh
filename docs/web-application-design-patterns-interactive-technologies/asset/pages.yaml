  md: '# CHAPTER 11 Accessibility


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_346_0.png)


    **Figure 11.6** In this from Orbitz, users can click either the highlighted areas
    or the radio controls instead of just clicking the radio button to select an option.


    In this example, the `<label>` tag for first name is as "firstName" that is referenced
    in the `<label>` tag using the `for` attribute to associate the label *First Name*
    to the corresponding text field.


    Not only does the `<label>` tag make it for screen readers to correctly associate
    labels to form control irrespective of where the form is positioned but it also
    helps users when they interact with radio buttons and checkboxes. When used with
    radio buttons the `<label>` allows users to click to select the corresponding
    radio button or checkbox. Thus, users have a larger clickable area and are not
    restricted to the smaller radio button controls or checkboxes (Figure 11.6).


    In addition, to ensure that screen readers present information to users in the
    correct order, place labels that relate to text fields or dropdown lists before
    the form element in the markup. This does not apply to radio buttons and checkboxes,
    where labels come after the corresponding controls.


    # GROUP FORM CONTROLS USING `<FIELDSET>` TAGS


    Use the `<fieldset>` tag to group related form controls and the `<legend>` tag
    to provide a heading to the form controls identify and communicate groups to users.
    The `<fieldset>` and `<legend>` can also be styled using style sheets to make
    them visually appealing (Adams, 2008).


    # MAKE FORMS KEYBOARD ACCESSIBLE


    Most browsers allow users to navigate among links, frames, and form elements on
    a page using the `Tab` key, when pressed, moves the focus from one element to
    another in order of their presence in the markup. In most cases, when the page
    is marked up correctly, the sequence in which users would move from one element
    to another would be correct. In cases, to provide a better form-filling experience,
    use the `tabindex` attribute for form elements (Figure 11.8; see the KEYBOARD
    NAVIGATION pattern in Chapter 2).


    Another way to make forms keyboard accessible and efficient to use is by using
    the `accesskey` attribute, which allows users keyboard access to frequently used'
