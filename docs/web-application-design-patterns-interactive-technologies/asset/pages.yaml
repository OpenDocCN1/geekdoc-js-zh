  md: '# 14 WEB APPENDIX Help


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_425_0.png)


    **WEB.20** Basecamp uses videos to introduce users to functions that they have
    not explored. To help contextual, it offers the videos within the context of the
    functions so that users don''t have to search for answers in Help.


    # RELATED PATTERNS


    Guided tours are useful when users are faced with a BLANK SLATE (see Chapter 4).


    # HELP WIZARDS


    # Problem


    Users who are unfamiliar with an application domain typically find it difficult
    to articulate their problem accurately or don''t know the appropriate trigger
    words to get to the relevant help information in APPLICATION HELP or HELP COMMUNITY.
    In addition, when diagnosing a problem, which may have multiple causes and multiple
    solutions, they may not know the best way to extract the appropriate solution.


    # Solution


    Guide users through a series of questions to arrive at a solution (or a set of
    solutions) (Figure Web.21). This is not different from recommend systems that
    suggest solutions based on a series of questions aimed at capturing users'' goals
    or requirements.


    # Why


    When troubleshooting, guided approaches are typically better at narrowing down
    the causes and getting users to the solution(s) quickly. In addition, although
    users find describing their problem difficult because of their lack of domain
    expertise, they are more likely to respond appropriately to targeted questions
    and narrow down their solution choices.'
  merge: -1
