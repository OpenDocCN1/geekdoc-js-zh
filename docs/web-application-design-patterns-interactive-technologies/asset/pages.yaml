  md: '# CHAPTER 11 Accessibility


    first-level headings (i.e., `<h1>`) to second-, third-, or lower-level headings
    (i.e., `<h2>`, `<h3>`, and so forth). They can also use assistive devices to “listen”
    to the page''s outline in order to understand the page''s structure (Cannon, 2008).
    For sighted users, using HTML-based headings helps determine the page''s visual
    hierarchy because web browsers show headings larger and bolder fonts than the
    rest of the text, when style sheets are disabled.


    Similarly, navigation menus, submenus, and lists within pages should be marked
    up using lists (`<ol>`, `<ul>`, `<dl>`, etc.). A general rule of thumb is to use
    ordered lists (`<ol>`) for lists that suggest some form of sequence or priority
    ordering, unordered lists (`<ul>`) for lists that have items without any suggested
    sequence or ordering, and definition lists (`<dl>`) for the items in the list
    consist of a term (marked using `<dt>`) and its description (marked using `<dd>`).


    # USE STYLE SHEETS FOR LAYOUT AND PRESENTATION


    Use CSS to control the presentation and layout of a page. Put all declarations
    in a separate file to enable easy updates (see also the UNTRUSIVE STYLE SHEETS
    pattern).


    Do not embed style-related markup in a page using tags such as `<font>`, `<i>`,
    and so forth. In addition, do not use deprecated tags—that is, HTML tags that
    are no longer part of the HTML specification. *The Ultimate HTML Reference* (Lloyd,
    2008) lists the following elements as deprecated: `<apple>`, `<basefont>`, `<center>`,
    `<font>`, `<frame>`, `<frameset>`, `<iframe>`, `<isindex>`, `<menu>`, `<noframes>`,
    `<s>`, `<strike>`, `<u>`, and `<xml>` (see well www.w3.org/TR/REC-html40/index.html
    for deprecated HTML 4.0 elements).


    # DO NOT USE STYLE SHEETS TO SIMULATE STRUCTURAL MARKUP


    Do not use CSS to give visual appearance of structural elements such as headings,
    paragraphs, and lists using `<span>` and `<div>` tags (Figure 11.1).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_340_0.png)


    **FIGURE 11.1** The page title in YouTube is marked up the `<div>` element instead
    of the `<h1>Rihanna - Disturbia</h1>` or `<h2>Rihanna - Disturbia</h2>` element,
    making it difficult for screen reader users to navigate the page.'
