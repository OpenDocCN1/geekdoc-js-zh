    # ADJUST PAGE ELEMENTS TO BROWSER''S WINDOW SIZE


    When using liquid-width layouts, page elements using background colors or images
    should fill up appropriately with expanding or narrowing browser window widths.
    The relative position of page elements—left and right-aligned components such
    as headers, navigation bars, footers, and so—should also maintain their alignment
    with varying window widths (Figure 12.3).


    # Related design patterns


    As already mentioned, large screen resolutions are becoming common, and designers
    have started considering PROGRESSIVE LAYOUTS to ensure that pages'' content readability
    does not suffer when users maximize browser window sizes.


    # FIXED-WIDTH LAYOUT


    # Problem


    Liquid-width design can create excessive empty spaces between elements for pages
    with fewer elements. This not only makes pages appear sparse, disorganized, and
    disconnected but also less readable and unappealing.


    # Solution


    Use a design that has a fixed width to ensure that page components remain together
    and coherent (Figure 12.4). Fixed-width layout means that the width of the page
    content is set to a certain pixel width irrespective of browser'
  merge: -1
