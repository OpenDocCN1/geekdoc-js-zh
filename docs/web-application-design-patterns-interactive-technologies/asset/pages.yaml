  md: '# CONSIDER USE OF SYMBOLS FOR SHOWING LOCATION TYPES


    Maps may have to show more than one type of location—for example, a map may show
    restaurants, gas stations, lodging facilities, and so forth. Use one or more of
    the following approaches to indicate different location types:


    Colors and shapes. Use distinct colors and shapes is helpful when showing to two
    location types on the map. Include a legend so that users can associate colors
    and shapes to location types. In addition, to not disadvantage users with color
    vision deficiencies, used colored markers in combination with unique shapes.


    Pictographic symbols. Use recognizable pictorial symbols to identify locations
    such as restaurants, restrooms, gas stations, trail symbols, and so forth (Figure
    7.44).


    Although not used to indicate a location type per se, using thumbnails of actual
    photographs to identify a location becoming a popular way to indicate a location
