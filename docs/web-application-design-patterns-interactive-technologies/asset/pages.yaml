  md: 'Applying a star-rating system difficult because it requires a judgment of the
    part of the pattern authors or the design team (one of the reasons for its absence
    in this book). In addition, applying a star-rating system in a corporate setting
    may be counterproductive, as it may appear to offer design leeway when they consider
    patterns with lower star ratings. Including several examples of usage is more
