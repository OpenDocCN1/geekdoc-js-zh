    # LABEL BUTTONS CLEARLY AND CONCISELY


    Use labels to clearly convey actions to minimize confusion as come. Because buttons
    are used to perform a task or accomplish a goal, use a verb in the label to represent
    that task or goal. Avoid using labels as “Submit,” which only signify the act
    of submitting the data rate; rather, use labels as “Save Changes,” “Search for
    Flights,” or “Find Users” (Figure 2.32).


    Following are two additional guidelines for labeling buttons:


    “Removing” and “Delete.” Use “Delete” when elements are permanently deleted and
    will not be available without having to create a new data element. Whereas, use
    “Remove” when data elements are removed only from context but are still available
    in other contexts. For example, in email applications, to remove a document from
    a list of attachments, use “Remove attachment” or “Remove.” To delete a message
    from a list of messages, use “Delete message” or “Delete.”


    Using “Add” and “New.” Use “New” when creating a completely new record (or data
    element). Use “Add” when selecting or relating existing elements to another data
    element. For example, to create a new user account, use “New user” or “New,” but
    to add another user’s calendar, use “Add calendar” or “Add.”'
