    A simple search may also benefit users in quickly determining if an item exists
    in an application. For example, users may want to know if an e-commerce application
    offers X. Searching for item X to determine whether it is offered by the application
    can be far more efficient than navigating through the information hierarchy.


    # How


    Allow users to search by entering one or more keywords into a search text field.
    In addition, let users search for key phrases by enclosing keywords within quotes;
    when searching for key phrases, users are shown results containing the exact phrase.
    In addition avoid forcing users to click the "Search" or tab to the "Search" button;
    let users submit their search using the "Enter" or "Return" key.


    # PLACE SEARCH IN A CONSISTENT LOCATION


    Place the search feature in a consistent location throughout the application to
    make it easier to find. Typically, it is placed or near the page header (Figure
    6.2) in one of the following locations:


    +   - The top-right of the page.

    - The center of the page in the header area or just below it (this is quite common
    in portals as Yahoo!, MSN, and Google).

    - The top-left above browsing options (e.g., above product categories in e-commerce
    applications).


    The top-right and top-left regions are preferred locations for placing search,
    since they closely match users'' expectations of its placement on a page (Shaikh
    and Lenz, 2006).


    With search on all pages, users do not have to return to the home page or a dedicated
    search page to conduct their search. This allows users to begin new searches and
    reach specific content quickly from anywhere in the application.


    # SET THE SEARCH SCOPE


