    # LOGICAL GROUPING


    # Problem


    To complete a task, users have to fill out a rather long form. However, designers
    want to give users an impression that the form is easy to fill out so that they
    are not reluctant to complete it.


    # Solution


    Group form elements such that it is clear to see the type of information required
    by each group (e.g., shipping information, payment information, and so forth;
    see Figure 2.12).


    # Why


    Grouping information such that users can clearly see what is expected from each
    group and how form elements relate to their corresponding group can make forms
    appear easy to fill out and manageable. Users are more likely to think of the
    form in terms of the smaller collection of groups instead of a larger collection
    of individual form elements.


