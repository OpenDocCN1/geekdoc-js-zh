  md: '![](img/4da2afa2580415d3d4ff98025db0a2c3_261_0.png)


    Figure 9.8 Flickr allows users to apply tags in a "batch" mode. Users can batch
    photos that they want to tag and then click "Add Tags" to add descriptions to
    all the items in the batch.


    # KEEP TAGGING OPTIONAL


    The main purpose of tagging is to allow users to provide some descriptive information
    about content to facilitate finding it in the future. Because the primary user
    task is to add content, tagging (or providing other descriptive information) should
    be optional. However, users should be permitted to add tags later.


    # ALLOW USERS TO TAG SEVERAL ITEMS TOGETHER


    For content such as photos, users may want to add the same tags to several items.
    Allow them to select items that share the same tags and apply tags to them in
    "bulk" or "batch" mode (Figure 9.8).


    # SUGGEST TAGS TO MINIMIZE VARIABILITY


    One of the problems with tagging is that items may be tagged with seemingly similar
    labels caused by typos, plurals, or minor differences in spellings (e.g., colour
    colour). For example, one user may label an item as "web site," another as "website,"
    and yet another as "web_site" or websites. By suggesting tags and letting users
    pick from them, the application can minimize redundancy and unnecessary distinctions
    in tags.


    In addition, suggesting tags may also make users consider alternative ways to
    describe content and avoid conservative labels from users when tagging. Suggestions
    may be in the form of the following (Smith, 2007):


    +   - Previously used tags. Tags that the user has already entered.

    - Popular tags. Tags that have been used frequently by others.

    - Recommended tags. Tags the user should consider based on popular tags, recently
    used tags, and other factors.


    To make it easy to add suggested tags, allow users to select from a list (Figure
    9.9). In addition, while entering tags, suggest tags using the AUTOSUGGEST/rich-interaction
    pattern (see Chapter 8).'
