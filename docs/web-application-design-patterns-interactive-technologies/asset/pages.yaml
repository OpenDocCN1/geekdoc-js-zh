  md: '# SHOW THE TOTAL NUMBER OF SEARCH RESULTS


    On the search results page, few clearly indicate the total number of search results
    and the number of results shown on the current page (Figure 6.21); see also the
    PAGINATION and CONTINUOUS SCROLLING patterns later in this chapter. Showing the
    total number of search results helps users decide if they want to change their
    query, make it more specific (or broad), or simply browse the search results.


    # SHOW DESCRIPTIVE INFORMATION WITH EACH SEARCH RESULT


    It may not be of use whether a search result is relevant to their task based solely
    on its. Users may need additional information about a search result to decide
    if navigating to it is worth the effort. For example, books, users may want to
    know the author, the date published, a preview of the content, and a brief summary
    (Figure 6.22). For products, they may want to know the price, ratings (if available),
    manufacturer, supplier, product determine the type of supplementary information
    to accompany each search result so as to improve users'' tasks or improve its
    "information scent" (Prillardi and Card, 1999).


    # SHOW IMAGES OF ITEMS TO FACILITATE SCANNING


    Include images in search results (Figure 6.23(a)) if they would help users recognize
    and differentiate items better than their textual descriptions (e.g., e-commerce
    and mobile applications). However, offer an alternate text-only version for the
    search results as well (Figure 6.23(b)); users may not be interested in images
    because of slower connection speeds (e.g., when accessing the information from
    remote areas on mobile devices) or if they prefer a text-only view.


    # CONSIDER ALTERNATE VIEWS FOR PRESENTING SEARCH RESULTS


    In addition using text and image views for search results, there may be other
    appropriate views for search results. When users are


