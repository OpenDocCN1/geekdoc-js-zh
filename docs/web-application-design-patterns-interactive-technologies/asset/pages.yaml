  md: '# LIMIT THE NUMBER OF STEPS IN THE WIZARD


    When developing wizards, the number of steps needed must be balanced with the
    amount of information asked from users on each step. Users should feel that they
    are making good progress through the wizard and that each page logically grouped
    information. At the same time, they shouldn''t feel that most of their time is
    waiting for pages to refresh to go to the next step. Nor should they feel have
    to backtrack to change information provided in previous steps. Typically, wizards
    shouldn''t require more than five to seven steps to accomplish a task (Wickham
    al., 2002).


    # CLEARLY SHOW WIZARD STEPS


    Show each step in the wizard either as a set of horizontal steps or tabs (Figure
    5.35) or vertically as a list of contents. The latter is preferred when one or
    more steps have substeps. Usability tests for desktop-application wizards have
    shown vertical placement of steps to be more effective than horizontal placement
    (Wickham al., 2002). However, vertical placement may require additional space
    and may have to be traded off against to be presented for each step.


    # BEGIN WITH AN OVERVIEW PAGE FOR VERY INFQUENTLY USED WIZARDS


    For wizards used very infrequently (perhaps only once), such as initial configuration
    or application setup, use an overview page to explain and introduce the process
    and its steps (Figure 5.36).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_136_0.png)


    **Figure 5.35** Washington Mutual shows the steps for opening an account horizontally
    above the form.


