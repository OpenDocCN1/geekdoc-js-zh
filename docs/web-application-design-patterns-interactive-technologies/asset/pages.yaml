  md: '# Related design patterns


    Most web applications support hierarchical navigation, requiring both primary
    navigation and SECONDARY NAVIGATION. For deeper navigation hierarchies, consider
    using BREADCRUMBS to orient users and show them where they are in the application.


    # SECONDARY NAVIGATION


    # Problem


    Users need a way to access navigation options in the application''s hierarchy
    at levels below the primary navigation.


    # Solution


    Show secondary navigation that corresponds to the selected primary navigation.
    In addition, clearly show the hierarchical relationship between the primary and
    secondary level of navigation (Figure 5.7).


    # Why


    Navigation in most web applications is designed to support its hierarchical structure
    which is typically up to three levels deep. Secondary navigation complements primary
    and makes it easy for users to navigate the application''s structure at levels
    below the primary navigation. Although secondary navigation options change based
    on the selected primary navigation, their placement within the application should
    be consistent to encourage exploration.


    # How


    Clearly indicate the primary navigation option to encourage the secondary (and
    deeper) levels of navigation below. When primary navigation is placed horizontally,
    secondary navigation options are either placed nested below the primary navigation
    (see Figure 5.6) or vertically as either left or right navigation bars (Figure
    5.8).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_114_0.png)


    **FIGURE 5.7** shows secondary navigation nested below the primary navigation
    option. Although not common, Rally allows users to add their own secondary navigation
    option.


    > *This does not exclude other navigation approaches such quick links to related
    items, alphabetical indexes, breadcrumbs, and so forth (see the SUPPLEMENTAL NAVIGATION
    pattern later in this chapter). However, they are simpler to understand and offer
    a familiar way to organize information. they are the preferred approach for structuring
    information (Morville and Rosenfeld, 2006).'
  merge: -1
