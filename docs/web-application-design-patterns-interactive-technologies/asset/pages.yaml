    # SUPPLEMENTARY NAVIGATION


    # Problem


    Although PRIMARY and SECONDARY NAVIGATION provide an effective way to navigate
    the application''s hierarchy, they do not provide adequate means for users to
    discover new content or encourage exploration. This may result in that poor utilization
    of a web application''s functionality and fewer transactions (e.g., purchases,
    downloads, quotes, and so forth).


    # Solution


    Offer supplementary navigation mechanisms such as alphabetical or alphanumeric
    indexes, recommendations, related items, and so to facilitate discovery of new
    information and direct access to relevant information (Figure 5.20).


    # Why


    Supplementary navigation can allow users direct access to content as well as encourage
    discovery of new content. However, it''s important to remember that they neither
    replace an application''s navigation structure as instantiated by primary and
    secondary navigation nor minimize the impact of poorly designed information architecture
    (Morville and Rosenfeld, 2006).


    # How


    Following are a few ways to incorporate supplemental navigation in web applications
    and provide direct access to application content or functionality.'
  merge: -1
  pgno: 123
