    \ providing users an explicit way to resize text (Figure 11.3).\n\n# ALLOW USER\
    \ STYLE SHEETS TO OVERRIDE AUTHOR STYLE SHEETS\n\nUser style sheets are CSS files\
    \ created by users and are used to override author style sheets to make pages\
    \ easier to read. For example, a user might change the background color to black\
    \ and the text color to yellow and set the font size larger to make the page easier\
