  md: "# Accessibility and Rich Internet Applications\n\n# Related design patterns\n\
    \nIf Ajax or the use of JavaScript is making the inaccessible, use approaches\
    \ outlined in the UNOBTRUSIVE JAVASCRIPT and PROGRESSIVE ENHANCEMENT patterns\
    \ to make the application as accessible as possible.\n\n# ACCESSIBILITY AND RICH\
    \ INTERNET APPLICATIONS\n\nApproaches used in developing RIAs (see Chapter 8)\
    \ make extensive use of dynamic HTML and Ajax to offer a richer and more interactive\
    \ experience. However, they pose significant accessibility challenges. For example,\
    \ if page content changes without a refresh, new content may not be available\
    \ to people who rely on screen magnifiers or screen readers. RIAs also use complex\
    \ interface controls like sliders, progress bars, tabs, and so forth, which are\
    \ not natively supported in current versions of HTML/XHTML markup.\n\nThe W3-WAI\
    \ group is addressing these challenges through their ARIA suite (WAI-ARIA: see\
    \ www.w3.org/WAI/intro/aria). The purpose of WAI-ARIA is to use a role to associate\
    \ behavior and structure to interactive controls on web pages with markup to make\
    \ RIAs accessible to people with disabilities. It does so by incorporating roles\
    \ and properties within markup.\n\nRoles allow an RIA designer to provide proper\
    \ type semantics on custom controls to make them accessible. For example, as indicated\
    \ in the SEMANTIC MARK pattern, page navigation should be marked using lists.\
    \ However, if a page has several other types of lists, it's not easy for users\
    \ to distinguish between navigation-based lists and other lists. ARIA specification\
    \ provides help by using the notion of roles, which provide information about\
    \ what the control is of the HTML markup was used to create it. For example, an\
    \ unordered list used for navigation can be marked as:\n\n```\n<ul role=\"navigation\"\
    >\n  <li>Navigation Item 1</li>\n</ul>\n```\n\nRoles are divided into widget roles\
    \ and structural roles. Widget roles include widgets in RIAs as progress, slider,\
    \ combobox, tree, alert, dialog, and others. Structural roles include such as\
    \ menubar, toolbar, breadcrumbs, search, liveregion (in which content is changed\
    \ without page refresh), tab, navigation, and so forth. Of particular importance\
    \ allows text in the live region to be spoken without focusing it. Users can then\
    \ be informed of any updates within the area tagged as liveregion without losing\
    \ their place within the content.\n\nWhile roles provide information about the\
    \ type of control being used, the states and properties module of ARIA adds semantics\
    \ about relationships and"
