    **FIGURE 10.19** Examples of decimal separators in different countries. Multilingual
    countries such as Switzerland use decimal separators for different languages.
    A comma is used as the decimal separator, except when the amount is in Swiss Franc,
    in which case a period is used, and either an apostrophe or space is used for
    the thousands separator.


    Like grouping, the separator between the whole and the fractional part of a number—known
    as a decimal point, decimal separator, and other terms—also varies from one country
    to another. It can be a decimal point (i.e., a period), comma, or another character
    (Figure 10.19).


    # USE UNITS OF MEASURE FAMILIAR TO USERS


    Use units for weights and measurements to suit the target country’s conventions.
    For example, using pounds, feet, and inches (English or British system) will not
    be effective in countries that use the Metric system, where corresponding units
    are kilograms, meters, and centimeters, respectively. Similarly, showing temperature
    in Fahrenheit will be confusing to users who are familiar with the Centigrade
    system. Therefore, if an application is likely to be accessed by those with different
    conventions, show units of temperature in Metric and English systems or allow
    users to switch from one measurement to another (Figure 10.20).


    Because users may be unfamiliar with the terms “English” and “Metric” systems,
    when feasible, use explicit and familiar units of measurement such as °F and °C.
    Similarly, it is better to ask users to choose units of measurement, such as centimeters,
    meters, feet, yards, and so forth, instead of asking them to choose English and
    Metric systems.


    # SHOW PHONE NUMBERS IN FAMILIAR FORMATS


    Phone number formats also vary from one country to another in the total number
    of digits in the phone number and separators (Figure 10.21). Therefore, when possible,
    follow local conventions for showing phone numbers.'
