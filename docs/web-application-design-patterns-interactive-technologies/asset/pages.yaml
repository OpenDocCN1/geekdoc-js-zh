    # CURRENCY AND CURRENCY FORMAT


    # Problem


    Web applications (e.g., e-commerce applications) show that the value of products
    and services to users around the world need to present prices in local currencies.
    However, not only are currencies different around the world, but their formatting
    in terms of the symbol and placement are different as well.


    # Solution


    Show users currency in their native formats. In addition, where users may encounter
    prices in a currency other than in which they wish to translate, allow them to
    change it by specifying either country or desired currency (Figure 10.24).


