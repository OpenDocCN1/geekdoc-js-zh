    # MAKE ICONS VISUALLY DISTINCT FROM ONE ANOTHER


    It''s important that icons are easily distinguishable from each other to help
    users find appropriate icons (theirs, actions) and minimize confusion. This is
    usually accomplished by making shapes visually distinct from one another (Figure
    12.28) and is particularly important when icons are used to suggest "status" information.
    For example, avoid using the same-shaped icons with different colors (e.g., red,
    yellow, and green) to indicate status. Instead, use different shapes in addition
    to colors such as, red, yellow triangle, and green circle. Using multiple coding
    methods also helps users with color-vision deficiencies, as they can use the icon''s
    shape to determine status.


    # USE THE SAME VISUAL STYLE FOR ICONS


    Make sure that icons appear professionally designed and follow the same set of
    stylistic conventions—that is, the same base color set (matched to the site''s
    brand) and the same visual styles and effects (Figure 12.29).


    > Test icons for your visual distinctness, fill nontparent areas of icons with
    the same color and put them next to each other. The more distinguishable they
    are from another by their shape, the better their discriminability.


