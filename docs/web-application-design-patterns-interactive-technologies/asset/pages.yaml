  md: '# CHAPTER 4


    # Application Main Page


    # INTRODUCTION


    An important decision for designers is what users should see or which page they
    should be taken to after they log in to the application.


    For web applications that allow access without logging in (e.g., consumer e-commerce
    applications), users remain on the same page or are taken to the next page in
    the sequence. For example, if users decide to log in on a product details page,
    they remain on the same page. However, if they log in the checkout process, they
    are taken to the next page in the sequence—the shipping information page.


    On the other hand, applications that require users to log in before accessing
    their functionality show one of the following, depending on the nature of the
    application:


    +   - INBOX, where users can see a list of items to view or act on.

    - A CONTROL PANEL, which serves as a launch page to access application functionality.

    - DASHBOARD, with an at-glance view of the most important performance indicators.

    - A PORTAL, which aggregates information from several sources and uses as a launching
    place for information and applications users may access. PORTAL pages often incorporate
    aspects of CONTROL PANEL and DASHBOARD in order to enable users to quickly access
    functionality and content supported by one or more applications.


    Application pages are typically personalized based on user profiles, interests,
    and information needs with the intention of presenting the most relevant content
    and filtering out the not-so-relevant information. PERSONALIZATION driven by business
    rules or form of social filtering may not be to accurately predict the information
    users may need. Thus, applications often offer users CUSTOMIZATION options to
    allow them to'
