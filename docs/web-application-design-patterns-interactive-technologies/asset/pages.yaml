  md: '# # CHAPTER 13

    # Pattern Libraries


    # ## INTRODUCTION


    As indicated in Chapter 1, design patterns have the potential to offer benefits
    such as proven design solutions and guidance for their use, improved design process,
    re, and consistent interfaces, and so forth. To realize these benefits, it''s
    important that design patterns be documented and made available in a format that
    promotes reuse. Several documented collections of patterns, commonly referred
    to as *pattern libraries*, currently exist. Some notable ones includes Jenifer
    Tidwell''s collection of interaction design patterns (Tidwell, 2006), Martin van
    Weiele''s web site about design patterns (www.welie.com), Van Dunye''s *Design
    of Sites* (2006), and Yahoo! Design Pattern Library (developer.yahoo.com/patterns/).


    Despite the popularity of patterns and pattern libraries, currently there is no
    consensus on how patterns should be documented, maintained, and shared with others.
    Nor has been any empirical research that evaluates the efficiency of existing
    pattern languages, libraries, and collections designed for user interfaces. Rather
    than analyze and discuss the pros and cons of different approaches (Dearden and
    Finlay, 2006); Dennis and Snow, 2006), this chapter presents a pattern library
    as a pattern and identifies its core elements, as well as offers best practices
    for its development.


    # ## PATTERN LIBRARY


    # Problem


    In the absence of a formal process for reusing successful design solutions, the
    design process can be quite inefficient, because designers and developers spend
    time trying solve user interface design problems for which design solutions have
    already been identified and implemented. This is often exacerbated when the rationale
    and context for previously used design solutions is not documented, making it
    difficult to justify their use.'
  merge: -1
  pgno: 385
