  md: '# CHAPTER 5


    # Navigation


    # INTRODUCTION


    Designing navigation is about establishing relationships between various application
    parts (i.e., content and functionality) and conveying their importance and hierarchy
    to efficiently and facilitate completion of user tasks. This includes organization,
    labeling, and presentation of content and functionality. This chapter focuses
    on patterns related to the types of navigation systems and their presentation;
    to learn about the organization and labeling of navigation systems, see Morville
    and Rosenfeld (2006), Kalbach (2007), and Fleming (1998).


    Most web applications are organized hierarchically and thus allow users access
    to its content and functionality using levels of navigation. At the highest level,
    PRIMARY NAVIGATION, or global navigation, shows top-level categories or groupings
    that users can access from anywhere within the application. By making it available
    throughout the application, it also orients users within the application. SECONDARY
    NAVIGATION, or local navigation, shows users concerned and subsequent levels of
    navigation options for the primary navigation option. In addition to primary and
    secondary navigations, users also need a quick way to access a few functions (e.g.,
    login, logout, language selector) and content (e.g., help, cart, account, etc.).
    Like primary navigation, these functions and content areas need to be made available
    throughout the application (UTILITY NAVIGATION).


    Although primary and secondary navigation are useful in supporting an application''s
    hierarchical structure, content in multidimensional applications does not afford
    a unique hierarchical navigation scheme. FACETED NAVIGATION has emerged as an
    effective approach to allow maximum flexibility and support a variety of tasks
    by offering the ability to navigate using multiple attributes and not restricting
    users to only one (e.g., a facet) with which to start navigation.


    In addition to the hierarchical navigation approaches, users also benefit from
    nonhierarchical ways to access information using indexes, related items lists,
    recommendations, and so forth (SUPPLEMENTAL NAVIGATION).'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# CHAPTER 5 Navigation


    navigation systems are intended not only as alternative ways of accessing content
    but also to encourage exploration. More recent applications, especially those
    that rely on user-generated and user-contributed content, allow users to discover
    new content by offering a navigation approach based on *folksonomies*—a structure
    derived from user-provided labels describing application content (TAG CLOUDS).


    Another important function of navigation is that orienting users and letting them
    know where they are within the application. Support for orientation is usually
    provided by location trails, commonly referred to as BREADCRUMBS.


    While most application navigation is intended to get users to their desired content
    or function, there are instances where navigation is used to help users accomplish
    tasks by guiding them one step at a time (WIZARDS). This is particularly the case
    for infrequent, yet very important, multistep tasks that have dependencies that
    users may be unfamiliar with.


    # PRIMARY NAVIGATION


    # Problem


    The most common functionality and high-level categories (or objects) within web
    applications need to be readily available and understood by users. Additionally,
    users should be able to navigate quickly among many sections from anywhere within
    the web application.


    # Solution


    Offer users a consistent way to navigate to main application functions and place
    them in a consistent and salient manner on all application pages (Figure 5.1).


    # Why


    For web applications


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_109_0.png)


    FIGURE 5.1 LinkedIn uses a tab-based approach that allows users access to important
    application features and functionalities.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Primary Navigation


    # Heading


    Place primary navigation horizontally across the page, at the top of the page
    or vertically running down the page, either on the left or right side. Web applications
    have typically favored placing primary navigation horizontally (Figure 5.2); Adkinson
    (2002) found that 87 percent (65 of 73 sites) of e-commerce applications placed
    the primary navigation horizontally at the top of the page. This is understandable,
    since placing primary navigation typically reduces available horizontal space.
    vertical placement of primary navigation could result in horizontal scrolling
    or make tabular data cluttered.


    Placing primary navigation horizontally, however, limits the number of navigation
    options it can offer users before requiring them to scroll horizontally. To avoid
    scrolling, web applications often resort to having a “more” option (usually depicted
    as an arrow icon) to allow users to see additional navigation choices (Figure
    5.3); this is similar to toolbars in desktop applications


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_110_0.png)


    FIGURE 5.2 Rally places primary navigation horizontally to accommodate tabular
    data that has several columns.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_110_1.png)


    FIGURE 5.3 Salesforce uses an arrow tab to allow users access to primary navigation
    options that could not be accommodated horizontally.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# CHAPTER 5 Navigation


    | Table 5.1 Benefits and Limitations of Horizontal and Vertical Placement of Primary
    Navigation |

    | Horizontal Placement | Vertical Placement |

    |---|---||

    | Benefits | Allows more horizontal space for content. Beneficial if the web application
    requires showing tabular data with several columns. | Is easier to scale. Can
    easily accommodate 10–15 menu options without requiring users to scroll on monitors
    with 1024 × 768 resolution.<br>Allows multiple levels of navigation options as
    a hierarchical structure. |

    | Limitations | Difficult to scale. Cannot typically accommodate more than 8–10
    navigation options on monitors with 1024 × 768 resolution.<br>If multiple navigation
    levels are desired and shown as cascading levels, horizontal navigation breaks
    down beyond two to three levels. Also, with cascading levels, content gets pushed
    down. | Requires horizontal space limiting the space available for application
    content. |


    such as Microsoft Word, Firefox, and others. Table 5.1 summarizes the benefits
    and limitations of horizontal and vertical placement of primary navigation.


    Regardless of the placement of primary navigation, it is important that it be
    positioned consistently and made available throughout the application.


    # MAKE PRIMARY NAVIGATION VISUALLY SALIENT


    Because users rely on primary navigation to access the main functionality of the
    web application, make it salient and clearly differentiated from the page content
    (Figure 5.4).


    # HIGHLIGHT THE SELECTED NAVIGATION OPTION


    Highlight the selected navigation option to let users know where they are within
    the application. This can be accomplished by visually distinguishing the selected
    navigation option from others by varying its font, background, color, and/or border
    (Figure 5.5).'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Primary Navigation


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_112_0.png)


    **Figure5.4** Plaxo uses global navigation that is clearly distinguishable from
    the rest of the page.


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_112_1.png)


    **Figure5.5** Backpack makes the selected option appear like a tab to visually
    distinguish it from other navigation options.


    # REMOVE PRIMARY NAVIGATION FOR TASKS WITH SELF-CONTAINED NAVIGATION


    Typically, primary navigation should be placed in and made available throughout
    the application. However, for multistep tasks with their self-contained navigation
    (e.g., wizard-based), to minimize distractions or to prevent data loss (e.g.,
    checkout, initial setup, or registration) primary navigation may be removed Figure
    5.6. Because wizardlike tasks are often supported by their own navigation, removing
    primary navigation also avoids potential confusion among multiple navigation mechanisms
    (see the WIZARDS pattern later in this chapter).


    # ESTABLISH A CORRECT INFORMATION ''SCENT'' THROUGH EFFECTIVE LABELING


    Primary navigation labels are very important for establishing a correct information
    "scent" for the application. The notion of an information "scent" is based on
    the information foraging theory, which explains mechanisms used by people when
    searching for information (Chi et al., 2000; Pirolli and Card, 1999).'
