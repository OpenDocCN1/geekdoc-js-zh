  md: '# CHAPTER 1 Introduction


    # Limited set of controls, or widgets, to support application design


    In the current version of HTML (version 4.01), native support for controls is
    limited to text boxes, radio buttons, dropdown lists, and command buttons. It
    does not offer sophisticated interactions common in desktop applications as spin
    controls, calendars, wizards, tabs, toolbars, drag-and-drop, floating palettes,
    dialog boxes, context-sensitive menus, and so forth, which are available in basic
    desktop applications. Although such controls can be developed using JavaScript
    and Cascading Style Sheets (CSS), a lack of inherent support for them led to a
    variety of implementations with inconsistent presentations.


    # Inconsistent interaction approaches


    Both the underlying technological architecture of the Web and the limited set
    of controls available make it difficult to create interactions for web applications
    comparable to desktop applications. Additionally, because most web applications
    are designed to be browser-agnostic, interactions and appearance cannot be simulated
    to match all operating systems; for example, tabs in the Macintosh OS X Aqua interface
    are visually different than the tabs in the Windows interface (Figure 1.6).


    Although the Web''s largely unrestricted development environment offers considerable
    creativity and flexibility to designers, the resulting diversity and inconsistency
    in user interfaces and interaction approaches in web applications is often challenging
    for users. This is due to the fact that users are faced with a variety of styles
    of interfaces and interactions, each with its own vocabulary of objects, actions,
    and visuals mixed together in the same application (Tidwell, 2006). Figure 1.7
    shows an example of changing the tab name in Zoho Notes (a web application like
    Microsoft OneNote) and Zoho Sheet (a worksheet application like Microsoft Excel).
    To change the tab name and Rename dialog pops up. In order to change the tab name
    in Zoho Sheet, users must right-click the


    > NOTE

    The next version of HTML (version 5) will support additional form elements that
    are currently part of the World Wide Web Consortium''s (W3C) (https://www.w3.org/TR/web-forms-2/).
    This new version offers additional form controls (e.g., the <datalist> element
    to create combo-boxes and the <output> element to show values derived from other
