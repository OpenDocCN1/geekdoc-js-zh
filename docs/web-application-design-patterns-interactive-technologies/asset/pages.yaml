    ability to notify you when the price drops). You get access to ways to save more!
    Just a completely ad-free experience, all the effects, and special discounts,
    coupons, premium support, and advanced editing tools like Curated Lists!


    # How


    There are several options for presenting FAQs (Figure Web.8). The most common
    approach is to use FAQ lists and link them to corresponding answers. When users
    click a question, they are taken to the answer on the same page (with a "back
    to top" link) or on a separate page (with a "return" link). Another option is
    to show the answer just below the question by expanding the space below a different
    location to find location, and answers. This approach is beneficial, because it
    eliminates navigation back to the list of questions or other questions. If the
    list is relatively short, it is sufficiently to show all questions and answers
    without requiring users to navigate the page.


    # CATEGORIZE A LONG LIST OF FAQS


    If the list of FAQs is long (e.g., more than 30), organize them by task categories,
    sections of the web application, or by. Categorizing a set of questions allows
    users to quickly focus on one or more categories of interest and get their questions
    answered (Figure Web.9).


    # Related design patterns


    FAQs should be linked from the pages within where users are likely to help make
    them contextual (CONTEXTUAL HELP).'
