  md: '# Challenges to Designing Interfaces for Web Applications


    # Maturity and reliability of network connectivity and web technologies


    An important roadblock for earlier web applications was unreliable network connectivity
    significantly inconsistent web standards—that is, HTML, CSS, and JavaScript—in
    web browsers. This is no longer the case. Adherence to web standards is improving,
    and browser inconsistencies used to cause frustration for web developers are decreasing.
    In addition, network connectivity and broadband access is becoming more reliable,
    more ubiquitous, and cheaper to use. Using Website Optimization the use of broadband
    Internet access grew to 57 percent in US homes in March 2008 and 90 percent among
    active users (www.websiteoptimization.com/bw/0807/). This stable platform has
    also spawned the availability of visual development tools and frameworks to facilitate
    web application development.


    # CHALLENGES TO DESIGNING INTERFACES FOR WEB APPLICATIONS


    Despite these benefits and increasing use, designing interfaces for web applications
    remains difficult. Challenges in creating usable interactions are mainly related
    to the underlying "loosely coupled" web architecture, a limited set of interactive
    controls natively supported in web browsers, and the lack of design guidance as
    to how user interactions should be implemented.


    # “Loosely coupled” web architecture


    An important challenge faced by web application designers is caused by the "loosely
    coupled" or "stateless" nature of the web. The interaction paradigm is very simple:
    Users request web pages with web browsers, and serve by responding the requested
    pages to browsers or informing users if there are problems retrieving those. However,
    once a user''s request is satisfied by the web server, sending the web page to
    the browser, the connection between the web server and the web browser is severed.
    When a user makes a subsequent request, the connection is established again with
    the server until the new page is "reloaded" in the user''s browser.


    Each page reload, or page refresh, is marked by perceptible delays caused by the
    need to establish the connection, the server to respond to the request, and the
    browser to reload the page. This creates a jumpy and discontinuous experience
    for web application users. For example, a user browsing a hierarchical tree of
    items may have to wait after every click to expand, or collapse, a data node for
    page reload and the expanded, collapsed view. Although this problem is addressed
    to great extent by the use of scripting technologies such as JavaScript and Rich
    Internet Applications (see Chapter 8), it''s an important user experience issue
    faced by most web applications.'
  merge: -1
