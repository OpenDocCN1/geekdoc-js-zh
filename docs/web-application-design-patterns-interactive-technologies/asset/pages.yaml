    login, etc.), it''s universally acceptable to place the cursor in the form when
    the page loads so that they can start filling from the right away.


    However, for forms with navigational elements allowing users to access other areas
    of the application, or with content users may need to read (e.g., instructions
    for filling out the form or error messages), avoiding placing the cursor in a
    form field. Automatic placement of the cursor in such instances would render the
    page unusable to screen readers who are likely to miss the information about the
    form field.


    # CONSIDER OFFERING KEYBOARD SHORTCUTS


    Offer keyboard shortcuts for applications that are going to be used regularly
    and the primary focus is on interaction efficiency (e.g., applications for customer
    support centers). Keyboard shortcuts can be implemented in HTML using the accessibility
    attribute, as in this example:


    ```

    <input type="button" value="buttonName" accessibility="k/">

    ```


    By specifying the accessibility attribute, users can navigate directly to that
    form element by pressing the "Alt" key (or the "Ctrl" key on a Mac) plus the letter
    or number specified in the accessibility attribute.


    When assigning keyboard shortcuts, it''s important to not implement and redefine
    commonly used browser shortcuts. See Table 2.1 for a list of these shortcuts.


