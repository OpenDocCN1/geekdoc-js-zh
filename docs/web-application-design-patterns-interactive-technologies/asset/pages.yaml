  md: '# Related design patterns


    The patterns identified in Chapter 11—SEMANTIC MARKUP, UNOBTRUSIVE STYLE SHEETS,
    UNOBTRUSIVE JAVCRIPT, and so forth—are relevant for internationalization, as they
    help web applications easy to localize.


    # DATE FORMAT


    # Problem


    Using a date format common in one region can be confusing to users from other
    regions. For example, the date format used in the United States (mm/dd or mm/dd/yyyy)
    would be confusing to European users because they are familiar with dd/mm/yy or
    dd/mm/yyyy formats and to Japanese users who use yy/mm/dd format.


    # Solution


    Use the ISO 8601 recommended yyyy-mm-dd date format when showing dates, or use
    a format that eliminates confusion between the month and the year in a date (Figures
    10.11 and 10.12).


    # Why


    Although web applications designed to be used exclusively by a country or a region
    can depend on its native date formatting standards, users from other


