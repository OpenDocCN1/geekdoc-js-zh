  md: '# CHAPTER 11


    # Accessibility


    # INTRODUCTION


    In the context of web applications, the term *accessibility* refers to designing
    web pages such that they are available to all users, including those with visual,
    physical, auditory, cognitive, or other disabilities.


    When designing accessible web applications, it''s important to follow the principle
    of PROGRESSIVE ENHANCEMENT—that is, design web pages in layers so that the content
    and interaction are available to all, and the more interactive (i.e., enhanced)
    options are available as capabilities of browsers and/or devices that can access
    the application increase. To allow for progressive enhancement, it''s essential
    that application pages use SEMANTIC MARKUP, UNOOBTRUSIVE STYLE SHEETS, and UNOBOTRUSIVE
    JAVASCRIPT. Because user interaction with web applications is through forms, it''s
    important they are designed to be accessible (ACCESSIBLE FORMS). In addition,
    other content presented on pages are made as accessible as well (ACCESSIBLE IMAGES,
    ACCESSIBLE TABLES, ACCESSIBLE NAVIGATION).


    Although not a preferred option, there are situations where applications cannot
    be made completely accessible in their current form and an alternative design
    may need to be built to ensure accessibility (ACCESSIBLE ALTERNATIVE). This is
    particularly the case with Rich Internet Applications (RIAs), which pose significant
    challenges to accessibility. To address this, World Web Consortium''s Web Accessibility
    Initiative (W3C-WAI) has proposed a road map and working-draft versions for Accessible
    Rich Internet Applications (WAI-ARIA). While assistive technologies are catching
    up to W3C-WAI''s recommendations, designers may want to start incorporating proposed
    markup in their designs.


    Patterns in this chapter help in making web applications accessible and supporting
    the standards and regulations for web accessibility (see Standards and Regulations
    for Web Accessibility sidebar).'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# STANDARDS AND REGULATIONS

    WEB ACCESSIBILITY


    Several countries have adopted different laws and standards to ensure web accessibility.
    In the United States, the applicable standards and regulations include the Americans
    with Disabilities Act (ADA), Individuals with Disabilities Education Act (IDEA),
    and Section 508 of the Rehabilitation Act of 1973.


    Perhaps the most important and comprehensive guidelines are the Web Accessibility
    Initiative''s (WAI!) Web Content Accessibility Guidelines 1.0 (WCAG 1.0) and WCAG
    2.0 in meeting the needs of the Web and complying with the regulations just noted.
    These guidelines detail how web developers can make their sites and web applications
    usable for people with disabilities and are based on the following four principles:


    +   1. Perceivable. Information and user interface components must be presentable
    to users in ways they can perceive.

    2. Operable. User interface components and navigation must be operable.

    3. Understandable. Information and the operation of a user interface must be understandable.

    4. Robust. Content must be robust enough that it can be interpreted reliably by
    wide variety of user agents, including assistive technologies.


    For additional information on standards and regulations, see resources for Government
    Laws, Regulations, Policies, Standards, and Support at www.uiaccessibility.com/access_links.html#government_laws_regs_policies.


    > *The WAI is an organization within the W3C, the standards-making body for the
    World Wide Web. www.w3c.org/WAI for more information.


    This chapter focuses on accessibility using core web technologies (i.e., HTML,
    CSS, and JavaScript) and does not address accessibility issues related to Flash
    and PDF Readers interested in learning more about Flash and PDF accessibility
    should consider the following resources:


    +   - Adobe Flash Accessibility Design Guidelines, www.adobe.com/accessibility/products/flash/best_practices.html

    - Adobe Acrobat Accessibility, www.adobe.com/products/acrobat/solutionsacc.html


    NOTE Because incorporating accessibility into web pages requires adapting HTML,
    CSS, and JavaScript, this chapter requires some familiarity with their basic concepts
    and syntax.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# PROGRESSIVE ENHANCEMENT


    # Problem


    Not knowing the browser and its version, platform, and assistive technology that
    users utilize makes it difficult to predict how web applications will be used.
    As a result, exclusively relying on certain implementation approaches—even the
    recommended style sheets and JavaScript—may make a web application unusable or
    inaccessible to certain user populations.


    # Solution


    Design web applications that they support progressive enhancement. In other words,
    support users who have older browsers or assistive technologies to access the
    web application for content and functionality, while also offering users with
    newer browsers and more advanced technology to experience enhanced (i.e., more
    interactive) features in the web application (Champion, 2003a, 2003b).


    # Why


    Using progressive enhancement allow web applications the widest reach in terms
    of devices, browsers, and assistive technologies. In addition, by layering enhancements
    independent of each other, designers can avoid creating a separate version (the
    ACCESSIBLE ALTERNATIVE pattern later in this chapter), because regardless of the
    technology supported by the browser and/or assistive technology, users will be
    able to accomplish their tasks.


    # How


    First and foremost, make web application accessible by using web standards to
    mark up and structure page content and functionality without requiring client-side
    scripting technologies such as JavaScript (see the SEMANTIC MARKUP and ACCESSIBLE
    FORMS patterns later in this chapter).


    Once content and functionality of a web application are made available to the
    widest audience, the next step is to improve its visual presentation using style
    sheets. However, make every effort to ensure that the incorporation of style sheets
    does not compromise its usability and accessibility for users who do not support
    them (see the UNOBTRUSIVE STYLE pattern later in this chapter).


    The final layer is to interactivity using client-side approaches (e.g., JavaScript),
    which can make the application more responsive and efficient by supporting drag-and-drop,
    performing basic form validation without sending data to the server, sorting content,
    and for style sheets, added interactivity should not affect users'' ability to
    access web application content or functionality (see the UNOBTRUSIVE JAVASCRIPT
    pattern later in this chapter).'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# CHAPTER 11 Accessibility


    Finally, ensure that web applications using Ajax work when JavaScript is unavailable.
    This can be accomplished using the HIJAX approach as follows (Keith, 2007):


    +   1. Begin by building a regular web application where users can request information
    from and send information to the server using links and forms. The server returns
    an updated version of the same page. Every time users click on a link or submit
    a form, the page is refreshed.

    2. Use the Document Object Model (DOM) scripting approach (or UNOTRUSIVE JASCRIPT
    pattern later in this) to intercept (or "hijack," the term HIJAX) links and forms
    requesting information from and sending information to the server. Reroute these
    requests using Ajax such that the server sends back only the changed part of the
    page instead of returning the entire page.


    # Related design patterns


    Incorporating PROGRESSIVE ENHANCEMENT requires web pages to be marked using SEMANTIC
    MARKUP and then enhanced using UNOTRUSIVE STYLE SHEETS and UNOTRUSIVE JASCRIPT.


    # SEMANTIC MARKUP


    # Problem


    It''s difficult to ensure consistent presentation of web pages to all users without
    knowing the browser, platform, or assistive technology they use to access the
    web application. In addition, a page''s information hierarchy established using
    images, style sheets and layouts cannot be communicated visually because users’
    browsers and assistive devices may render visual unusable.


    # Solution


    Convey the document’s meaning using structural markup that it clearly conveys
    the relationship between page elements and maintains the reading order irrespective
    of the browser’s ability to use CSS and/or render images. In addition, delegate
    page presentation aspects to style sheets that the page structure remains meaningful
    regardless of the browser, platform, or assistive device.


    This means that web designers must ensure that the order of page elements is communicated
    via headings and lists (i.e., <h1>, <h2>, <h3>, <h4>, <ul>, <li>, and so forth).
    <table> tags are not used for layout, and presentation aspects are absent from
    the markup. For example, additional space between


    > Ajax stands for Asynchronous JavaScript and XML, and is a combination of technologies
    such as JavaScript, cascading style sheets (CSS), document object model, and XMLHttpRequest
    which allow the creation of richer user experiences that are comparable to desktop
    applications (see Chapter 8 for additional details).'
