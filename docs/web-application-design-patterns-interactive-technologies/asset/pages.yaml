    # RECONIZE ACHIEVEMENTS OF COMMUNITY MEMBERS


    Like merit badges, recognizing achievement in communities helps distinguish, activity,
    and expertise among members. This may be as simple as achieving a Power Seller
    badge on eBay by maintaining a 98 percent positive feedback score and providing
    a high level of service to buyers. Achieving the Power Seller badge helps buyers
    know that they are working with an experienced eBay seller. It also helps sellers
    get more (and higher) as buyers feel comfortable transacting with them.


    Alternatively, the achievement may be in the form of ranked levels on Amazon Web
    Services forum, where community members earn points by providing correct and helpful
    answers. By accumulating points, members achieve different score levels and receive
    associated merit icons (Figure 9.36).


    # ON COMPETITIVE SITES, SHOW USERS'' RANKS


    In web applications where users are competing with each other (e.g., Gaming),
    show their relative performance to help them understand their rank relative to
    others. This may be in the form of a leaderboard, which lets users see the leading
    users (e.g., top players) (Figure 9.37).


    Use leaderboards if they could lead to a perception of cheating. For example,
    Digg abandoned their Top Contributors page because it led to the perception of
    manipulation of the top stories (see blog.digg.com/?p=60). On Amazon, there is
