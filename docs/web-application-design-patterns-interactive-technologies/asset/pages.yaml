    FIGURE 8.31 Kaiak uses two handles for "Flight Times" slider and "Return" times
    to allow users to set a range for "Flight" and "Return".


    buttons, or dropdown lists specify one or more values within a range. sliders
    provide an easier and more direct method of selecting a value within a range (Galitz,
    2002). In addition, they prevent user errors when compared with entering values
    in text fields. Another important advantage of sliders is that the data range
    can be continuous as well as discrete, and the design of the slider can convey
    the appropriate precision of user input. It is also faster to select values using
    sliders compared to a selection over a text-input field or radio buttons.


    # How


    Allow users to set one value or a range of values by dragging and dropping the
    slider(s) in the slider control. In addition to drag-and-drop, enable users to
    click directly on the arm to move the slider to the clicked location. Allow users
    to control the slider using the left, right, up, and down arrow keys on the keyboard.
    It is important that the arrow keys match the orientation of the slider—that is,
    left and right arrow keys work for horizontal sliders, and up and down arrow keys
    work for vertical sliders. However, it is good practice to have the other set
    of arrow keys as well. Finally, wherever feasible, allow users to simply enter
    the value in a text field (Figure 8.32).


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_242_1.png)


