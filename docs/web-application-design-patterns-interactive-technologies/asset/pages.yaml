  md: '# CHAPTER 6 Searching and Filtering


    # How


    Make search tips easily accessible and visible by placing the corresponding link
    close to the search area (Figure 6.17).


    Search tips may be presented to users in any of the following ways:


    +   - They can be shown on a separate page if they are too elaborate to be included
    near the search feature. In most instances, this is appropriate considering that
    users can use the information provided in search tips and formulate their search
    queries in the persistent search box at the top of the page.

    - They can be shown in a pop-up if users are likely to access tips from a search
    results page or losing their current page (and search query) is of concern.

    - They can be shown on the same page using an "expand-in-place" approach. For
    example, Nabble expands the search sections and shows them between the search
    bar and the search results (Figure 6.18).


    # INCLUDE EXAMPLES OF APPROPRIATE SEARCH QUERIES


