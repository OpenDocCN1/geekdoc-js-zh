    # MAKE TABULAR DATA READABLE BOTH BY ROWS AND COLUMNS


    The readability of tabular data is affected by the readability of rows as well
    as columns. Improve the readability of rows by adding a separator line for each
    row or using a different shade of color for alternate rows, known as row striping
    or zebra striping (Figure 7.8). Both approaches help create a visual grouping
    of items for rows and are particularly important for tables with many columns
    (wide columns), where users may find tracing data in row difficulty. A study by
    Enders (2008) concluded that zebra stripled compared with other styles had better
    task performance (at least not worse) and had a higher preference over other styles
    such as plain, lined, two-color row striping, double striped, and triple striped.


    In addition, improve the readability of columns by aligning attribute values in
    columns based on cell contents (Figure 7.9). Follow these rules to align data
    (Galitz, 2002; Mayhew, 1992):


    +   - Use right alignment for columns containing whole numbers (not “text” numbers
    as a person’s identifier).

    - Use a decimal point and right alignment for numbers with decimal fractions;
    negative numbers may be shown in red and enclosed within parentheses.'
