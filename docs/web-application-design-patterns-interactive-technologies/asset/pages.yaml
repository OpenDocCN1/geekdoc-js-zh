  md: '# CHAPTER 7 Lists


    # MAPS


    # Problem


    Items to be presented to users contain spatial information that refers to either
    geographical (e.g., location of restaurants on a map) or physical locations (e.g.,
    seating in an aircraft, a concert hall, or a stadium). In addition, for users,
    it''s important to know the item''s location in a geographical or physical space
    as well as its relation to other items in the same space.


    # Solution


    Show items on the map of a region or space in question (Figure 7.40). Hybrid


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_203_0.png)


    (a)


    ![](img/4da2afa2580415d3d4ff98025db0a2c3_203_1.png)


    (b)


    **FIGURE 7.40** Roast shows location of homes on a map (a), and United Airlines
    allows users to choose their seat by showing a seating map (b).'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Why


    Because users are presented with spatial information, showing them on a map of
    the physical space eliminates the need for users to visualize its location. It
    also makes information more meaningful and relevant to user goals, such as finding
    a location, navigating to and from a location, and relating data to the targeted
    region.


    # How


    Maps are typically used as a background image on which geographical, physical,
    and statistical information are superimposed. Depending on users'' needs, maps
    may be represented as illustrations (using points, lines, and polygons), photographic
    or satellite images, text, or a combination (Figure 7.41).


    # SHOW DETAILED INFORMATION ON DEMAND


    When showing several locations on a map, providing details of all of them at the
    same time could clutter the map and make it difficult for users to parse relevant
    information. In addition, users may be interested in seeing details of only a
    few locations. To minimize complexity, a common approach is to provide necessary
    details when they hover over or click on map markers. Detailed information can
    then be presented as hovertips or pop-ups.


    Hovertips are typically used when details are not extensive, purely informational
    in nature, and do not require users to take an action on the presented information,
    whereas pop-ups are used when users can take actions such as find directions (Figure
    7.42). Another alternative is to show the pop-up after a few seconds to support
    relating users who may not know what actions are available on the map markers
    (e.g., Microsoft''s Live Maps).


    # FOR LARGE MAPS, PROVIDE USER CONTEXT BY SHOWING OVERVIEWS


    When panning and zooming large maps, it is important that users do not lose lost
    and maintain their sense of location. Overviews within the map provide such context
    (Figure 7.43). Most map overviews support panning within them, allowing users
    to move the "region" box inside the overview, affecting the map being viewed.


    Some map overviews support zooming as well. However, using overviews for panning
    and zooming is generally not as efficient as panning and zooming on the main map
    (Hornbæk et al., 2002) (see also the OVERVIEW-PLUS-DETAIL pattern in Chapter 8).'
  merge: -1
  pgno: 204
