    # ALLOW USERS TO SET THEIR STATUS PREFERENCES


    For privacy, or other reasons, some users may choose not to display their online
    presence indicator and status to others. They may want (or not want) only certain
    users to see their online status. To accommodate such preferences, allowing users
    to identify who can (and cannot) view their status.


    # Related design patterns


    Online presence indicators are useful not just for knowing if other users are
    online but also in deciding whether to initiate a conversation with them. Therefore,
    the PRESENCE INDICATOR pattern is usually accompanied by the MESSAGING pattern.


    # SHARING


    # Problem


    Users may want to share content—photos, videos, news articles, and so forth with
    others; the content being shared may or may not belong to the person sharing it.


    # Solution


    Enable users to share content with others (Figure 9.61).


    # Why


    There are several reasons why users may want to share information, including (Porter,
    2008):


    +   - To keep family and friends informed

    - To share unique and enjoyable experiences

    - To reciprocate

    - To help answer others’ questions or do research

    - To introduce people to one another

    - To share laughs'
