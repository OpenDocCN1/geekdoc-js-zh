  md: '# CHAPTER 12 Visual Design


    and right margins. For example, viewing a design optimized for 800 × 600 resolutions
    (i.e., 770-pixel width) on a 1024 × 768 resolution screen would show an empty
    space of about 100 to 110 pixels on each side of the centered layout and 200 to
    220 pixels of empty space on the right side for left-aligned layouts (Figure 12.5).


    # FILL THE PAGE BACKGROUND FOR LARGER BROWSER WINDOWS


    Like centering the layout, filling the page background with an appropriate color,
    image, or texture makes empty space more acceptable and the page more visually
    appealing (Figure 12.6).


    # MAKE PAGES PRINTER-FRIENDLY


    When pages are designed with fixed-width layouts are printed in a portrait or
    vertical (as opposed to landscape) orientation, information on the right usually
    gets clipped. This is because printers cannot support more-than-600 pixels horizontally.
