  \ ;\n```\n\n### Code\n```java\nSystem.out.print (\" Enter your middle name: \" )\
  \ ;\n\nmiddle_name = client_input.next() ;\n```\n\n\n\n\n```java\nSystem.out.print\
  \ (“Enter your family name: “);\ninherited_name = client_input.next() ;\n```\n\n\
  这段代码是完全相同的，但 Java 会将客户端提供的任何输入保存在一个新变量中。如果你想打印获取到的输入，可以这样做：\n\n```java\nString complete_name;\n\
  complete_name = middle_name + “” + family_name ;\nSystem.out.println (“You are”\
  \ + complete_name);\n```\n\n当运行此程序时，Java 将停顿，以便客户端输入数据。一旦输入了所有所需的数据，屏幕上将显示正确的输出。\n\
  \n最终，`Scanner` 类将用于从客户端获取输入。客户端键的任何内容都将被存储在相应的变量中。\n\n## 选项面板 (Option Panes)\n\n\
  与 `Scanner` 类一样，还有一个 `JOptionPane` 类，在你尝试从客户端获取输入时非常有用。该类会弹出一个输入窗口，让客户端输入正确的数据，并弹出显示类似“Hello”等内容的窗口。\n\
  \n### Code\n\n```java\nimport javax.swing.JOptionPane;\n```\n\n Java 将被告知你想使用 `JOptionPane`\
  \ 类，并且它位于 `javax.swing` 库中。\n\n如果你不想更改之前的任何代码，可以再次启动一个新项目来练习这个。当你输入代码时，可能会发现 `import\
  \ javax.swing.JOptionPane;` 下有下划线。这是因为这段代码尚未被使用。一旦使用了它，下划线就会消失。\n\n为了获得一个允许客户端输入某些类型数据的框，你将从\
  \ `JOptionPane` 中选择 `showInputDialog` 方法。这将导致输入的数据直接存储到相应的变量中。\n\n### Code\n\n```java\n\
  String middle_name;\nmiddle_name = JOptionPane.showInputDialog (“ Middle Name “)\
  \ ;\n```\n\n在你使用 `JOptionPane` 输入完一个句号后，会弹出一个列表。在这里，你可以双击 `showInputDialog`，这样你就可以在括号之间输入你想显示的消息。像其他任何内容一样，它应该位于双引号之间。\n\
  \n### Code\n\n```java\nString inherited_name;\ninherited_name = JOptionPane.showInputDialog\
  \ (“Family Name”) ;\nString complete_name;\ncomplete_name = “You are” + middle_name\
  \ +”” + inherited_name;\nJOptionPane.showMessageDialog (null, complete_name );\n\
  ```\n\n此时，你将想要选项列表中的 `showMessageDialog`。单词 `null` 现在将出现在你的括号之间，这个关键字让 Java 知道对话框与程序的关系不大。符号将出现在你想在消息框内显示的文本中。\n\
  \n在你代码的底部，你可能会发现有一段新代码。`system.exit(0);` 使程序能够退出并从内存中移除任何对象。\n\n当运行你的代码时，你将得到弹出框，询问你指定的希望客户端输入的数据。一旦点击“确定”按钮，你的输入就会显示出来。再次点击“确定”将程序结束。\n\
  \n# 第三章：\n\n## Java 的控制流 (Control Flow for Java)\n\n在此之前你所做的任何编程都将被称为顺序编程（sequential\
  \ programming），这基本上意味着你输入的代码是从上到下读取的，每一行都按照其书写的方式读取。然而，并不是所有程序都是这样工作的。\n\n某些代码必须在满足特定条件的情况下运行。对于代码来说，你可能希望客户端处于某个年龄。这就是你通过条件逻辑控制程序运行流的地方。\n\
  \n条件语句大多将使用 `if` 单词，但也可以其他单词来创建条件语句。\n\n### If 语句\n\n代码每当事情发生时就会执行，而不是等待其他事情，这在编程中是最常见的，因此创建了\
  \ `if` 语句。\n\n一个 `if` 语句看起来如下：\n\n```\nif ( statement ) {\n}\n```\n\n在将你的条件放在一组括号中之前，`if`\
  \ 单词将写为小写。大括号将用于划分代码块。这段代码只有在满足条件的情况下才会执行。\n\n```java\nif( client < 18) {\n}\n```\n\
  \n这个条件表示如果客户端小于 18 岁。为了不把全部写出来，将使用一种简写方法，使代码块更短且更易读。\n\n```java\nif( client < 18)\
  \ {\n// display message\n}\n```\n\n因此，如果客户端大于 18 岁，两组大括号中设置的代码将被跳过，Java 将按照预期方式继续。大括号中间的任何内容只有在满足条件时才会执行。\n\
  \n另一个简写概念是将三角形指向右侧，表示大于。\n\n```\nif( client > 18) {\n//display message\n}\n```\n\
  \n代码完全相同，只是条件适用于那些 18 岁以上的人。\n\n### If ... else\n\n与其使用 `if` 语句，可以使用 `if else` 语句。\n\
  \n```\nif( condition_to_test) {\n}\nelse {\n}\n```\n\n第一行仍然以 `if` 开头，后面跟着条件。大括号将划分不同的部分。第二种选择将位于\
  \ `else` 之后，并带有自己的大括号。你只有两个选择，客户端要么小于 18 岁要么大于 18 岁。\n\n### If ... else if\n\n可以同时测试多个两个条件。如果你想测试某个年龄范围，将使用\
  \ `if else if` 语句。语法如下：\n\n```\nif(condition_one) {\n}\nelse if ( condition_ two\
  \ ) {\n}\nelse {\n}\n```\n\n当发送 `if` 语句时，紧随其后的是圆括号。第二个条件位于新的括号之间，但它不会被第一个条件捕获。\n\
  \n你需要使用的条件运算符有：\n- 大于 `>`\n- 小于 `<`\n- 大于等于 `>=`\n- 小于等于 `<=`\n- 与 `&&`\n- 或 `||`\n\
  - 等于 `==`\n- 非 `!`\n\n两个与符号 符号将用于同时测试多个条件。\n\n```java\nelse if ( client > 18 &&\
  \ client < 40)\n```\n\n通过这段代码，你将想要知道客户端的年龄并查看他们是否大于 18 岁但小于 40 岁。你只是试图查看客户端输入的变量内容。客户端必须大于\
  \ 18 岁且小于 40 岁。由于使用了 `&&` 运算符，客户端必须满足这两个条件。\n\n### 嵌套 if (Nested if)\n\n`if` 语句可以像\
  \ `if else` 和 `if else if` 语句一样嵌套。嵌套的 `if` 语句是将一个 `if` 语句与另一个放在一起。\n\n```java\n\
  if( client < 19) {\n    System.out.println ( “ 18 or younger”) ;\n}\n```\n\n为了检查客户端是否大于十六岁，必须在你已创建的\
  \ `if` 语句内部另一个 `if` 语句。\n\n```java\nif( client < 20) {\n    if( client > 20 && client\
  \ < 23 ) {\n        System.out.println (“ You are 21 or 22”) ;\n    }\n}\n```\n\n\
  第一个 `if` 语句是客户端小于 19 岁时捕获他们的地方，第二个将缩小范围直到他们大于 16 岁。当你想打印不同的消息时，可以使用 `if else` 语句。\n\
  \n```java\nif( client < 20) {\n```\n\n\n\n\n```java\nif( client > 20 && client <\
  \ 23 ) {\n    System.out.println( “You are 21 or 22”) ;\n} else {\n    System.out.println\
  \ (“22 or younger”) ;\n}\n```\n\n代码中放置的花括号必须准确，否则程序将无法运行。嵌套 `if` 语句很难学习，但可以对其进行简化。\n\
  \n### 布尔值\n\n布尔值只有 `true` 或 `false`、`1` 或 `0`，甚至是 `yes` 或 `no`。Java 有一个专门用于布尔值的变量：\n\
  \n```java\nBoolean client = true;\n```\n\n你不需要输入 `int`、`string` 或 `double`，你需要使用小写的\
  \ b 来输入 `Boolean`。变量名将在赋值为 `true` 或 `false` 之后出现。赋值使用一个等号。但是，如果你要评估该变量且它有值，那么你需要使用两个等号。\n\
  \n### 代码\n\n```java\nBoolean client = true;\nif ( client == true) {\n    System.out.println\
  \ (“it’s true”) ;\n} else {\n    System.out.println(“it’s false”) ;\n}\n```\n\n\
  `if` 语句将检查客户端输入的变量是否为 `true`。`else` 将检查它是否为 `false`。你不需要说 `else if ( client == false)`。当某结果不是\
  \ `true` 时，它显然是 `false`。你会使用 `else`，因为在涉及布尔值时只有两种选择。\n\n另一个用于条件的运算符是 `NOT` 运算符，它用于布尔值。\n\
  \n### 代码\n\n```java\nBoolean client = true ;\nif( !client) {\n    System.out.println\
  \ (“it’s false”) ;\n} else {\n    System.out.println (“it’s true”) ;\n}\n```\n\n\
  `NOT` 运算符将位于 `client` 变量之前。该运算符使用单个感叹号，但它将位于需要测试的变量之前。代码将对否定进行测试，这意味着它不是它实际的样子。\n\
  \n由于 `client` 变量已设置为 `true`，`!client` 最终将测试 `false` 值。如果条件被设置为 `false`，那么 `NOT`\
  \ 运算符将测试值为 `true`。\n\n### Switch 语句\n\n为了管理脚本的运行，开发者可以使用 `switch` 语句。`switch` 语句将为你提供变量设置的值范围内的选项。本质上，这些是长且复杂的\
  \ `if else if` 语句。\n\n因此，它的语法如下：\n\n```java\nSwitch ( variable_to_test) {\n    Case\
  \ value:\n        //Code_here;\n        Break;\n    Case value:\n        //Code_here;\n\
  \        Break;\n    Default:\n        // The values_that_were_not_caught_from_the\
  \ _conditions_above;\n}\n```\n\n此代码将以关键字 `switch` 开始，后面跟着一组括号。任何你想评估的变量都将放在 `switch`\
  \ 括号的中间。花括号将包含 switch 语句的所有其他部分。对于你需要检查的每个情况，开发者将使用一个名为 `case` 的关键字，以便他们检查 case\
  \ 的值。\n\n`case` 值后面将跟有一个冒号。任何你想发生的事情都会发生，但仅在值正确对应的情况下。你想要执行的代码将被执行。在 switch 语句的每种情况下，每当需要\
  \ `break` 的地方都会使用 `break` 单词。\n\n将使用 `default` 值，但它是完全可选的。如果你没有在 switch 语句的其他地方检查它，你可以在变量中包含其他值。\n\
  \n### 代码\n\n```java\npublic static void main(String[] args) {\n    int client =\
  \ 17;\n    switch ( client ) {\n        case 19:\n            System.out.println(“\
  \ You are 19”) ;\n            break ;\n        case 20:\n            System.out.println\
  \ (“ You are 20”) ;\n            break ;\n        case 21: \n            System.out.println\
  \ (“ You are 21”) ;\n            break ;\n        default:\n            System.out.println\
  \ (“ You are  not 19, 20, or 21”) ;\n    }\n}\n```\n\n代码将设置一个必须测试的值。一个整数变量将被称为 `client`。在这段代码中，值被设置为\
  \ `18`。通过 `switch` 语句，将检查变量以查看其内容。\n\n（注：由于原文中存在大量重复和逻辑混乱的描述，此处翻译已根据 Java 语法逻辑进行了修正，以确保技术可读性。）\n\
  \n### 循环\n\n由于流程是顺序的且向下运行的，如果你不希望是这样，你需要告诉 Java 以不同的方式执行。因此，为了中断这种流程，你可以创建一个循环。通过这种，循环将强制程序返回并重复执行代码行。\n\
  \n### 代码\n\n```java\nint addition = 1 + 1;\n```\n\n### For 循环\n\nFor 循环是最常用的循环之一。`for`\
  \ 循环的语法为：\n\n```java\nfor ( beginning_value; last_value ; increment_amount) {\n\
  \    //this where code will appear\n}\n```\n\n在圆括号中，你有三个不同的项目：循环的起始值、结束值以及它将遵循的路径。\n\
  \n### 代码\n\n```java\npackage loops ;\n\npublic class ForLoops {\n    public static\
  \ void main (String[] args) {\n        int loopVal;\n        int last_value = 15;\n\
  \        for (loopVal = 0; loopVal < last_value; loopVal++) {\n            System.out.println\
  \ (“Loop Value = “ + loopVal) ;\n        }\n    }\n}\n```\n\n每当设置一个整数值，它将被称为 `loopVal`。下一行需要设置的是另一个整数变量。该变量将用作循环结束的值。\n\
  \n在括号内部，你有：\n\n`loopVal = 0; loopVal < last_value ; loopVal++`\n\nJava 将告知哪个值开始循环。这也是将值从零分配给\
  \ `loopVal` 变量的地方。第二部分是条件逻辑：\n\n`loopVal < last_value`\n\n`loopVal` 比 `last_value`\
  \ 小。`for` 循环将一直持续到值小于结尾变量。只要值保持为 `true`，Java 就会继续循环花括号之间的代码。\n\n循环的最后部分 `loopVal++`\
  \ 表示值每次增加。\n\n### While 循环\n\nWhile 循环比 for 循环更容易理解。`while` 循环的语法为：\n\n```java\n\
  while ( condition) {\n}\n```\n\n`while` 单词将是小写，你的条件将放在括号之间。\n\n### 代码\n\n```java\n\
  int loopVal = 0;\nwhile (loopVal < 5) {\n    System.out.println (“Printing some\
  \ text”);\n    loopVal++;\n}\n```\n\n括号中的条件将是正常的，花括号中的代码将是必须打印的代码。循环将永远进行下去，因为没有值为\
  \ 0 的情况。\n\n\n\n计数器 `loopVal` 将到达条件的末尾。当你不需要计算一个值而是在检查一个值时，`while` 循环非常好用。对于代码来说，当键盘上没有按下按键时，它可以保持循环。但是，字母\
  \ `x` 将退出循环。\n\n### do while\n\n`do while` 循环与 `while` 循环一样，但它看起来不同。\n\n```java\n\
  int loopVal = 0;\ndo {\n    System.out.println(\"Printing some text\");\n    loopVal++;\n\
  } while (loopVal < 5);\n```\n\n循环将一直持续到条件满足为止。这两个循环之间最大的区别在于你放在括号中的代码。`do while`\
  \ 循环的代码至少会被检查一次，而在 `while` 循环中，它将一直执行直到满足条件。\n\nJava 将跳出循环而不执行括号内的代码。当你想要测试这一点时，你需要先使用\
  \ `while` 循环。在运行代码之前，必须更改 `loopVal` 变量的值。文本将不会被打印。\n\n# 第 4 章：数组\n\n数组一次可以持有多个值；它更像是一个项目列表。当你考虑到数组时，你应该考虑到电子表格以及它的列。你可以有一列，也可以有很多列。\n\
  \n位于单列的数组看起来像这样：\n\n0 – 10\n1 – 14\n2 – 36\n3 – 27\n4 – 43\n5 – 18\n\n就像电子表格一样，每一行都有一个位置索引。位置从零开始，每次增加一。每个位置将像上面的代码一样持有一个值。\n\
  \n当你想要设置数组时，你需要让 Java 知道你正在向数组中放入什么类型的数据。你还需要准确说明数组将有多少个位置。\n\n语法为：`int [] aryNums;`\n\
  \n区别在于，一旦设置了数据类型，普通的整数变量将位于方括号中。括号会让 Java 知道你已经设置了一个数组。数组的名字是 `aryNums`。但像任何普通变量一样，你可以使用你喜欢的任何名称。\n\
  \n当你告诉 Java 数组有多少个位置时，你必须为数组创建一个新对象。\n\n```java\naryNums = new int[6];\n```\n\n\
  起初你从数组名称开始，然后是一个等号。在进入数据类型之前，等号前面有一个 `new` 关键字。所使用的数据类型后面是数组的大小。大小会让 Java 知道数组需要多少个位置。\n\
  \n如果你更喜欢代码看起来那样，你也可以将所有内容写在一行。\n\n```java\nint [] aryNums = new int[6];\n```\n\n\
  Java 将知道你正在使用一个包含六个位置的数组，数据类型是整数。因此，默认值是从零到六。\n\n当你想要给不同数量的位置赋值时，你可以像往常一样操作。\n\n\
  ```java\naryNum[0] = 10;\n```\n\n十这个值将被赋值给数组中的零。\n\n记住，数组始终从零开始，第三个位置是索引为二的位置。\n\
  \n为了方便设置数组，你可以这样做：\n\n```java\nint [] aryNums = { 1, 2, 3, 4 };\n```\n\n通过这种方法，你将数组的值放在花括号中。第一个值始终是零。`int`\
  \ 后面会有方括号，但没有 `new` 关键字，也不会重复任何数据类型。你只能对 `int`、`char` 和 `string` 值使用这种方法，除非你想使用\
  \ `new` 关键字。\n\n```java\nString[] aryStrings = {\"Autumn\", \"Spring\", \"Summer\"\
  , \"Winter\"};\n```\n\n这是可以的：\n\n```java\nBoolean[] aryBools = {false, true, false,\
  \ true};\n```\n\n这是不对的！在设置 `Boolean` 数组时，你必须使用 `new` 关键字：\n\n```java\nBoolean[]\
  \ aryBools = new Boolean[] {false, true, false, true};\n```\n\n## 循环与数组\n\n数组有自己的循环。当一个值被赋值给数组时，你将使用上一节中看到的语法。虽然这并不完全实际，但在有大量数量需要赋值给数组时，它是可以的。\n\
  \n```java\npackage prjarrays;\n\npublic class ArrayTest {\n    public static void\
  \ main(String[] args) {\n        int [] lottery_amounts = new int [49];\n      \
  \  int I;\n        for (I = 0; I < lottery_amounts.length ; i++) {\n           \
  \ lottery_amounts[I] = I +1;\n            System.out.println(lottery_amounts[1]);\n\
  \        }\n    }\n}\n```\n\n这个数组将包含 49 个不同的整数。循环末尾有一个 `length`，它会记录数组将有多少个位置。为了给位置分配数量，你将使用：`lottery_amounts[I]\
  \ = I +1;`\n\n循环将一直持续到 `lottery_amounts.length` 大于 `I`。数组中的每个位置每次循环都会增加一。\n\n\n\n\
  \n\n## 字符串与数组\n\n数组像整数一样放入字符串中。\n\n```java\nString[ ] aryString = new String[ 5\
  \ ] ;\naryString[ 0 ] = “this” ;\naryString[ 1 ] = “is” ;\naryString[ 2 ] = “a”\
  \ ;\naryString[ 3 ] = “string” ;\naryString[ 4 ] = “array” ;\n```\n\n这段代码有五个不同的位置，每一段文本都被放置在它所属的数组中。\n\
  \n这是一个循环将使用数组的所有位置，但它会打印出每一个位置。\n\n```java\nint I ;\nfor ( I = 0 ; I < aryString.length\
  \ ; i++ ) {\nSystem.out.println( aryString[ I ] ) ;\n}\n```\n\n该循环将一直重复，直到值小于数组范围调用的值。\n\
  \n数组也可以按字母顺序进行排序，因此 `aa` 会在 `ab` 之前。但是，由于 Java 使用了被称为 `Unicode` 的字符集，为了将字符串中的字母与其他字母对比，大写字母会出现在小写字母之前。\n\
  \n```java\npackage strings1 ;\nimport java.util.Arrays ;\n\npublic class StringArrays\
  \ {\npublic static void main(String[] args) {\nString[ ] aryString= new String[\
  \ 5 ] ;\naryString[ 0 ] = “This” ;\naryString[ 1 ] = “is” ;\naryString[ 2 ] = “a”\
  \ ;\naryString[ 3 ] = “string” ;\naryString[ 4 ] = “array” ;\nArrays.sort( aryString\
  \ ) ;\nint I ;\nfor ( I = 0; I < aryString.length ; i++) {\nSystem.out.println (\
  \ aryString[ I ] ) ;\n}\n}\n}\n```\n\n### 多维数组\n\n在本章之前讨论的数组只有单列数据，但你可以设置具有多列的数组。这些数组被称为多维数组。\n\
  \n```\n0 – 10 – 12 -43 – 11 - 22\n1 – 20 – 45 -56 – 1 – 33\n2 – 30 – 67 – 32 – 14\
  \ – 44\n3 – 40 – 12 – 87 – 14 - 55\n4 – 50 – 86 – 66 – 13 – 66\n5- 60 – 53 – 44\
  \ – 12 – 11\n```\n\n多维数组按照这种方式排列：\n\n```java\nint[ ] [ ] aryAmounts = new int[ 6\
  \ ] [ 5 ] ;\n```\n\n该数组的设置与普通数组完全一样，但会有组方括号。第一组括号告诉 Java 有多少行，而第二组括号告诉有多少列。\n\n\
  ```java\naryAmounts[0][0] = 10;\naryAmounts[0][1] = 12;\naryAmounts[0][2] = 43;\n\
  aryAmounts[0][3] = 11;\naryAmounts[0][4] = 22;\n```\n\n第一行像往一样从零开始，然后列将到四，这将导致数组上放置五个项目。\n\
  \n你的第二行是：\n\n```java\naryAmounts[1][0] = 20;\naryAmounts[1][1] = 45;\naryAmounts[1][2]\
  \ = 56;\naryAmounts[1][3] = 1;\naryAmounts[1][4] = 33;\n```\n\n第一个 for 循环将使用行中金额的位置，而第二个循环根据列使用位置。第一个循环的\
  \ `I` 的值将是零。嵌套在循环内部的代码将用于用于另一个循环。下一个循环只要变量 `I` 为零，就会继续评估。\n\n### 用于数组的列表\n\n很难确定数组内确切有多少个项目，因此使用\
  \ `ArrayList` 对你来说会更容易。`ArrayList` 是一种动态数据结构。因此，你可以添加和删除项目。普通数组的数据是静态的，因为你无法更改已创建数组的原始大小。\n\
  \n设置 `ArrayList` 时，你必须确保使用以下语法从库中提取包。\n\n```java\nimport java.util.ArrayList;\n\
  ```\n\n一旦导入，你就可以使用此语法在列表中创建新对象：\n\n```java\nArrayList listTest = new ArrayList(\
  \ );\n```\n\n在使用 Array List 时，你不需要方括号。\n\n```java\nlistTest.add( \"first item\"\
  \ );\nlistTest.add( \"second item\" );\nlistTest.add( \"third item\" );\nlistTest.add(\
  \ 7 );\n```\n\n落在括号中间的内容将被添加到列表中。你只能添加对象。此列表中的前三个项目将作为字符串对象添加。最后一个项目是一个金额，因为有整数金额对象。\n\
  \n\n\n\n当这段代码按字母顺序排序时，`a` 不会排在第一位，因为它是小写的。因此，`a` 的值为 `u\\0061`。大写的字母 `T` 的值为 `u\\\
  0054`。\n\n在操作具有不同文本的字符串时，你可以使用以下一些方法：\n\n- `toUpperCasse`\n- `toLowerCase`\n- `compareTo`\n\
  - `IndexOf`\n- `endWith`, `startsWith`\n- `Substring`\n- `Equals`\n- `charAt`\n\
  - `trim`\n- `valueOf`\n\n关于大小写字母，Java 将以一种直观的方式将文本转换为小写或大写，并将使用内置的 `toUpperCase`\
  \ 和 `toLowerCase` 方法来实现。\n\n### 代码\n```java\npackage prjstrings;\n\npublic class\
  \ StringManipulation {\n\n    public static void main (String[] args) {\n      \
  \  String changeCase = \"text to change\";\n        String result;\n        result\
  \ = changeCase.toUpperCase();\n        System.out.println(result);\n    }\n}\n```\n\
  \n开头几行告诉了字符串变量设置在哪里，同时保留了在打印之前需要更改的文本。第三行调用了变量的结果。最后，在第四行中进行了转换。\n\n```java\nresult\
  \ = changeCase.toUpperCase();\n```\n\n该字符串方法将适用于任何字符串。你只需要在变量后输入一个点，就可以看到你可以对你的\
  \ `changeCase` 字符串进行操作。如果你想让它变成大写，那么就选择它，但请记住，大写后面应该有一组空括号。\n\n一旦结果完成转换，它将作为存储为新结果。如果你不想存储结果，可以使用以下代码：\n\
  \n```java\nSystem.out.println(changeCase.toUpperCase())\n```\n\n当你想要执行 `toLowerCase`\
  \ 时，将使用相同的方法。\n\n### 字符串比较\n可以通过十六进制值对字符串进行比较。你只需要使用 `compareTo` 方法即可。\n\n### 代码\n\
  ```java\npackage prjstrings;\n\npublic class StringManipulation {\n\n    public\
  \ static void main (String[] args) {\n        int result;\n        String Word1\
  \ = \"Ape\";\n        String Word2 = \"App\";\n        result = Word1.compareTo(Word2);\n\
  \        if (result < 1) {\n            System.out.println(\"Word1 is less than\
  \ word2\");\n        } else if (result > 0) {\n            System.out.println(\"\
  Word 1 is more than word 2\");\n        } else if (result == 0) {\n            System.out.println(\"\
  the same word\");\n        }\n    }\n}\n```\n\n当这两个单词进行比较时，使用了带有此语法的 `compareTo`\
  \ 方法：\n\n```java\nresult = Word1.compareTo(Word2);\n```\n\n返回的值将是一个大于零、小于零或等于零的值。你需要确保分配了正确的值，以便将\
  \ `compareTo` 的结果返回给变量。代码中将包含 `if` 语句来测试并查看结果是什么。\n\n但是，当比较两个字符串时，Java 将比较十六进制值而不是单词的字母。由于由于两者都包含大写字母，`App`\
  \ 的 `A` 将排在 `ape` 之前。\n\n### indexOf\n`indexOf` 将定位当前字符串或任何其他字符串中的字符。\n\n### 代码\n\
  ```java\npackage prjstrings;\n\npublic class StringManipulation {\n\n    public\
  \ static void main (String[] args) {\n        char ampersand = '@';\n        String\
  \ email_address = \"meme@me.com\";\n        int result;\n        result = email_address.indexOf(ampersand);\n\
  \        System.out.println(result);\n    }\n}\n```\n\n这段代码正在检查提供的电子邮件地址中是否存在 `@`\
  \ 符号。由于使用了单引号，它是一个 `char` 变量。一旦设置好电子邮件，你将得到结果，结果是一个 `int` 变量。因此，得益于 `indexOf` 方法，你的结果是一个整数。\n\
  \n由于这一行的存在，你的 符号位置将是这段代码的结果：\n\n```java\nresult = email_address.indexOf(ampersand);\n\
  ```\n\n当你指定要使用 `indexOf` 方法时，你想要搜索的字符串将出现在点之后。括号内是你提供多个选项的地方。首先，你可以输入单个字符。通过此操作，Java\
  \ 在存储变量结果的值之前，会告诉你该字符在字符串中的位置。\n\n当运行代码时，输出将是四。由于 `indexOf` 和其他所有内容一样从零开始，因此 `&`\
  \ 是电子邮件字符串中的第四个字符。\n\n如果你要找的字符不存在，那么 `indexOf` 将给你返回负一的结果。\n\n### 代码\n```java\n\
  package prjstrings;\n\npublic class StringManipulation {\n\n    public static void\
  \ main (String[] args) {\n        char ampersand = '@';\n        String email_address\
  \ = \"mememe.com\";\n        int result;\n        result = email_address.indexOf(ampersand);\n\
  \        if (result == -1) {\n            System.out.println(\"invalid email address\"\
  );\n        } else {\n            System.out.println(\"email address is ok\");\n\
  \        }\n    }\n```\n\n虽然代码看起来完全一样，但你现在将使用字符串变量来包含你想要检查的文本。再次返回负一的结果表示未找到搜索的文本。`IndexOf`\
  \ 也可以用于测试多个字符。\n\n```java\npublic static void main (String[] args) {\n    String\
  \ dotcom = \".com\";\n    String email_address = \"meme@me.com\";\n    int result;\n\
  \    result = email_address.indexOf(dotcom);\n    if (result == -1) {\n        System.out.println(\"\
  invalid email address\");\n    } else {\n        System.out.println(\"email address\
  \ is ok\");\n    }\n}\n```\n"
