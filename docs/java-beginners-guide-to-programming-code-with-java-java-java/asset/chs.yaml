  \ \" \")\n```\n\n### Code\n```java\nmiddle_name = \"W\"\n```\n\n### Code\n```java\n\
  middle_name = \"W\";\n```\n\n### 客户端输入\n\n当你对变量进行数学运算时，你将使用基本符号进行计算。\n\n### Code\n\
  ```java\nimport java.util.Scanner ;\n```\n\n### Code\n```java\npublic class StringVariables\
  \ {\n\n}\n```\n\n### Code\n```java\nScanner client_input = new Scanner(System.in)\n\
