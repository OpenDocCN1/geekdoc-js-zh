- "# Java 编程入门指南\n\n\n\n![image-I0354B7T.jpg](img/image-I0354B7T.jpg)![image-I0354B7T.jpg](img/image-I0354B7T.jpg)\n\
  \n\n### 目录\n- 介绍\n- 第 1 章：Java\n- 第 2 章：变量\n- 第 3 章：Java 的控制流\n- 第 4 章：数组\n- 第 5\
  \ 章：字符串\n- 结论\n\n\n\n\n\n\n\n## 介绍\n\n恭喜下载《Java：Java 编程代码入门指南》，感谢你的支持。\n\n接下来的章节将讨论\
  \ Java 是什么以及它的用途。\n\n读完这本书后，你应该能够像使用任何其他编程语言一样使用 Java。\n\n请记住，Java 和 JavaScript\
  \ 不是同一个。它们是两种完全不同的语言。\n\n市场上有很多关于这个主题的书，再次感谢你选择这一本！我们已尽全力确保它包含尽可能多的有用信息，请尽享！\n\n\
  ## 第 1 章：Java\n\n开始学习 Java 时最困难的事情是确保你已经安装了所有要在 Java 中使用的内容。在能够编写代码之前，你必须拥有所有这些程序，否则你将给自己带来头恼。\n\
  \n### 虚拟机\nJava 平台将独立于任何其他程序。因此，它可以在你可能工作的任何操作系统上运行。得益于 Java 虚拟机，它可以在任何系统上运行。这台机器将为编程提供帮助，以确保你的代码被正确处理。在运行任何\
  \ Java 代码之前，必须安装虚拟机程序。\n\n一家名为 Oracle 的公司拥有 Java，在他们的网站上，你可以找到虚拟机的下载链接，它也被称为 Java\
  \ 运行环境或 `JRE`。\n\n当你检查电脑是否已安装了 `JRE` 时，可以点击 Oracle 页面上写有“我有 Java ？”的链接。该链接位于页面顶部下载按钮下方。点击此链接后，电脑将进行扫描，然后你将得到是否已安装的结果。如果没有，你就可以从该页面下载。\n\
  \n一旦下载了虚拟机，你需要重启系统以便程序能够正常运行。\n\n### 软件开发工具包\n现在软件已经安装，Java 就能在你的电脑上运行了。但在你编写代码之前，你还需要从\
  \ Oracle 网站安装软件开发工具包。\n\n这套工具包被称为标准版，你想要使用的被称为 `NetBeans`。下载文件相当大，但一旦完成，你就可以编写 Java\
  \ 代码了。\n\n### Java 的工作原理\nJava 代码将在文本编辑器中编写，这些代码被称为源代码。你编写的任何代码都将保存在扩展名为 `.java`\
  \ 的文件中。`javac` 程序能够将你编写的任何源代码转换为 Java 字节码，这被称为编译。一旦文件编译完成，就会创建一个扩展名为 `.class` 的新文件。\n\
  \n在类文件创建时，虚拟机就可以运行该文件。`NetBeans` 是一个可以为你处理文件创建和编译的程序。但在幕后观察，你会注意到你的源代码会被创建为 Java\
  \ 文件，然后启动 `javac` 来创建你的类文件。\n\n### NetBeans\n第一次进入 `NetBeans` 时，你需要等待一会儿，因为这个程序并不快。但当它终于加载后，你需要点击\
  \ `file`（文件）和 `new project`（新建项目）来创建一个应用程序。\n\n在点击 `Java Application`（Java 应用程序）后，点击\
  \ `next`（下一步）按钮进入下一部分。显然你需要为项目命名，这将更改窗口底部的文本使其与你命的项目名称一致。\n\n将根据你的文件名创建一个类。如果你将其命名为\
  \ `firstproject.FirstProject`，类名将大写 `F` 和 `P`，而包名将小写。\n\n`NetBeans` 会自动设置保存，但你可以根据需要进行更改以便更好地查找。系统还会创建一个包含你项目名称的文件夹。点击\
  \ `finish`（完成）按钮后，你就创建了所需的所有文件。\n\n在返回 IDE（集成开发环境）后，你可以查看你的项目，看看是否有正在处理的项目。当你点击项目名称旁加加符号，你会看到与该项目相关的所有文件夹。每个文件夹都会进一步展开，让你看到存储源代码的文件。\n\
  \n你的源代码应该显示在右侧的文本区域内。万你没有看到代码窗口，你需要双击你的项目，以便代码出现并让你开始工作。\n\n你的文件名和类名必须匹配，否则 Java\
  \ 将不允许其正常工作，并且在编译时你会遇到错误。\n\n\n\n\n\n在你创建了一个新项目后，你会发现文本窗口中有些文字是灰色的，并且包含星号或斜杠。这些区域将成为你的注释，当程序运行时，这些注释将被程序忽略。你可以在注释中输入任何你想输入的内容，但大多数情况下，注释会解释你正在对代码进行的操作。单行注释通过在前面输入两个斜杠来输入。\n\
  \n### Code\n```\n// this is a comment\n```\n\n当你需要多行注释时，你有两个选择：\n\n```java\n// your\
  \ comment\n//and it is going to continue here\n```\n\n或者\n\n```java\n/*\nyour comment\n\
  And it is going to continue here\n*/\n```\n\n你也可以选择使用所谓的 Javadoc 注释，在那种注释中，你会看到一个正斜杠带有两个星号，并以一个单星号和一个斜杠结束。但是，每一行的前面都会有一个星号。Javadoc\
  \ 注释通常用于文档代码。这些代码将被转换为一个 HTML 页面，以帮助他人。\n\n如果你点击 NetBeans 顶部菜单上的“运行（run）”，你可以选择“生成\
  \ Javadoc”。然而，由于你还没有编写任何代码，你什么也看不见。你可以删除 NetBeans 生成的注释。\n\n## Java 结构\n\n包名将出现在你的代码开头。该行将以分号结尾，如果你不小心漏掉了那个分号，程序将无法编译。在你的包名之后，将列出类名。\n\
  \n将你的类名视为一段代码。必须使用大括号来告诉 Java 代码从哪里开始到哪里结束。代码将以左括号开始，以右括号结束。每当这些括号中放置了任何内容时，你就有了一个代码段。\n\
  \n当你编写代码时，你需要包含 `main` 单词，以便 Java 知道它从哪里开始。这个方法将是一段代码，但它将帮助执行 `main` 大括号内部的任何代码。如果你忘记在编写的程序中放入\
  \ `main` 入口点，就会发生错误消息。\n\n## 运行 Java 程序\n\n每当程序运行时，它将在屏幕底部可见的输出窗口中运行。你不需要启动任何终端或控制台窗口，因为输出窗口就是你的控制台。\n\
  \n在 NetBeans 中，你有多种方法可以运行你的程序。但对你来说最简单的方法是直接按 F6。如果你不想这样做，也可以进入菜单并选择“运行项目（run project）”按钮。\n\
  \n在工具栏上还可以找到一个绿色按钮，它可以运行你的程序。运行你程序的另一种方法是进入“项目（projects）”窗口。你可以通过右键点击你想要运行的项目并选择“运行文件（run\
  \ file）”来确保正确的代码将运行。这种方法也可以在实际文本窗口内通过点击代码所在的地方来实现。\n\n只要你正确编写了代码，你选择任何方式都会在输出窗口中运行你的程序。\n\
  \n## 第 2 章：变量\n\n大多数程序将通过操作放在程序内存中的数据来工作。这些数据将是对象、金额、文本以及内存区域中的任何其他指针。当你给数据命名时，你可以在需要时对其重命名，但该名称和值被视为变量。\n\
  \n### 金额\n\n当 Java 中需要存储一个金额时，你有几种可以使用的。有像 8 或 12 这样的整数，可以存储在 `int` 变量中。`int` 代表整数（integer）。\n\
  \n然后是像 8.4 或 10.5 这样的浮点数，它们存储在 `double` 变量中。当你存储这些时，你需要使用等号。\n\n```java\npublic\
  \ static void main(String[] args) {\n    int last_amount;\n    System.out.println(\"\
  My Last Project\");\n}\n```\n\n程序要求开发者与其通信，告知想要保存一个整数，因此你需要输入 `int` 并在后面加一个空格。然后你将被允许输入你想要命名的变量名称。变量可以命名为你想要的任何名称，但有一组你必须遵守的特定规则：\n\
  \n- 变量名可以有不同的含义。由于名称对大小写敏感，像 `firstname` 或 `FirstName` 这样的名称是两个不同的名称。\n- 变量名不能以金额作为第一个字符。使用单词拼写金额是可以的，但使用实际金额会导致\
  \ Java 抛出错误消息。金额将用于 Java 的其他地方。\n- 变量名不允许有空格。`int first amount` 的变量声明将向你抛出错误。你可以使用下划线或随后的大写字母。\n\
  - 不允许使用关键字作为变量名。Java 中有几个关键字，NetBeans 会你的编码中将这些单词显示为蓝色。\n\n当你想要存储一个名为 `last_amount`\
