  \ Double 变量\n\n`Double` 变量可以存储从极大到极小的各种数值。你能够达到的最高和最低数值将是 17 后面跟着大约三百零七个零。`double`\
  \ 变量将用于存储浮点数。如果你尝试将浮点值存储到任何 `int` 变量中，程序将标出代码错误所在的地方，以便你可以在运行之前进行修改并接收错误消息。\n\n\
  ### Code\n```java\nint last_amount, third_amount, result;\n\ndouble last_amount,\
  \ third_amount, result;\n\nlast_amount = 11.5;\n\nthird_amount = 22.8;\n\nresult\
  \ = last_amount + third_amount ;\n```\n\n现在可以运行程序来向你展示它的样子。\n\n### Short 和 float\n\
  \n`Short` 变量将保存存储在 `-32768` 和 `32767` 之间的较小数值。你将不再像以前那样使用它，而是将使用 `short`。当你使用 `short`\
  \ 时，你需要确保你使用的数值落这两个数值之间。\n\n`Double` 值将用于存储较大的浮点数数值。你将不再使用 `double` 而是使用 `float`。当你存储一个\
  \ `float` 变量时，数值末尾需要加上字母 `f`。\n\n### Code\n```java\nfloat last_amount, third_amount,\
  \ result ;\n\nlast_amount = 10.5f;\n\nsecond_number = 20.8f;\n```\n\n### 简单算术\n\n\
  当你对变量进行数学运算时，你将使用基本符号进行计算。\n\n* 加法 (`+`)\n* 减法 (`-`)\n* 乘法 (`*`)\n* 除法 (`/`)\n\n\
  ### 运算符优先级\n\n在 Java 中可以计算两个以上的数值，但在涉及计算内容时你必须小心。\n\n### Code\n```java\nlast_amount\
  \ = 200;\n\nthird_amount = 85;\n\nfourth_amount = 45;\n\nresult = last_amount –\
  \ third_amount + fourth_amount;\n```\n\n计算将按照它们出现的顺序进行。所以你需要做的是从 `200` 中减去 `85`\
  \ 得到 `115`。然后你加上第三个数值得到 `160`。\n\n为了确保 Java 按你想要的方式运行，可以使用括号。\n\n### Code\n```java\n\
  result = (last_amount – third_amount) + fourth_amount\n\nresult = last_amount –\
  \ (third_amount + fourth_amount)\n```\n\n在乘法中，乘法将优先于任何加法或其他操作。优先级的顺序是乘法和除法高于加法或减法。\n\
  \n### String 变量\n\n数值并不是唯一可以存储的内容，变量也可以存储文本。当你想要存储一个字符时，你需要使用 `char` 关键字，以便 Java\
  \ 知道你使用的是字符而不是数值。当你存储多个一个字符时，你将使用 `string` 变量。\n\n像第一章那样开始一个新项目，将项目命名为类似 `StringVars`\
  \ 的名称。需要勾选方框以创建一个主类。你可以删除 `stringvars` 之后的 `main`，并输入 `StringVariables` 代替。\n\n\
  删除所有注释后，你将拥有一个与之前类似的代码窗口。为了创建一个字符串，你将使用单词 `string` 作为你的关键字，后面紧跟变量名。分号仍然会被使用。\n\n\
  ### Code\n```java\nString last_amount;\n\nmiddle_name = \"William\";\n```\n\n###\
  \ Code\n```java\nString inherited_name\n```\n\n### Code\n```java\ninherited_name\
