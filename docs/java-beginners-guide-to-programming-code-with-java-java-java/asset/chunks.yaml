    Large amounts can be stored in the `int` variable, but the limit is going to be
    `2147483647`. You can also do negative amounts, the lowest you will be able to
    go is `-2147483648`. Larger or smaller amounts are going to use a `double` variable
    type.


    ## Double variables


    `Double` variables can be extremely large amounts to extremely small amounts.
    The highest and lowest amount you can reach is going to be 17 followed by about
    three hundred and seven zeros. A `double` variable is going to be used in holding
    floating point amounts. Should you be trying to store floating point values into
    any `int` variable, the program is going underline where the code is faulty so
    that you can change it before you run it and receive an error message.


    ### Code

    ```java

    int last_amount, third_amount, result;


    double last_amount, third_amount, result;


    last_amount = 11.5;


    third_amount = 22.8;


    result = last_amount + third_amount ;

    ```


    The program can now be run to show you what it is going to look like.


    ## Short and float


    `Short` variables will save smaller amounts that are going to be between `-32768`
    and `32767`. You are not going to use in for the code like you have been, instead
    you are going to use `short`. When you use `short`, you need to ensure that the
    amounts that you are using are going to fall between the two amounts.


    `Double` values are going to be used in storing the bigger amounts from floating
    points. You are not going to use a `double` but a `float` instead. When you go
    to store a `float` variable, the letter `f` is going to need to be at the end
    of your amount.


    ### Code

    ```java

    float last_amount, third_amount, result ;


    last_amount = 10.5f;


    second_number = 20.8f;

    ```


    ## Simple arithmetic


    When you are doing math with the variables you are going to use basic symbols
    to do your calculations.


    * Addition (`+`)

    * Subtraction (`-`)

    * Multiplication (`*`)

    * Division (`/`)


    ### Operation Precedence


    More than two amounts can be calculated in Java, but you have to be sure to be
    careful when it comes to what is being calculated.


    ### Code

    ```java

    last_amount = 200;


    third_amount = 85;


    fourth_amount = 45;


    result = last_amount – third_amount + fourth_amount;

    ```


    The calculation is going to need to be done in the order that it appears. So what
    you are going to do is subtract `85` from `200` to get `115`. Then you are going
    to add the third amount to get `160`.


    To make sure that Java does what you want to do, you can use brackets.


    ### Code

    ```java

    result = (last_amount – third_amount) + fourth_amount


    result = last_amount – (third_amount + fourth_amount)

    ```


    With multiplication, you are going to do the multiplication will come over doing
    any addition or any other operation. The order of precedence is going to be that
    multiplication and division are going to cover over addition or subtraction.


    ## String variables


    Amounts are not the only things that can be stored, variables can also store text.
    When you want to store a character, you are going to need to use the `char` keyword
    so that Java knows you are using a character instead of a amount. As you are storing
    more than one character, you are going to use a `string` variable.


    Start a new project like you did with the first chapter, label the project something
    like `StringVars`. The box needs to be ticked so that a main class is created.
    You can delete `main` that comes after `stringvars` and enter `StringVariables`
    instead.


    Deleting all of the comments, you are going to have a code window that is going
    to look similar to the one earlier. In order to create a string you are going
    to use the word `string` for your keyword which will then be followed by the variable
    name. semicolons are still going to be used.


    ### Code

    ```java

    String last_amount;


    middle_name = "William";

    ```


    ### Code

    ```java

    String inherited_name

    ```


    ### Code

    ```java

    inherited_name = "Shakespeare";

    ```


    ### Code

    ```java

    System.out.println(middle_name + " ")

    ```


    ### Code

    ```java

    middle_name = "W"

    ```


    ### Code

    ```java

    middle_name = "W";

    ```


    ## Client input


    When you are doing math with the variables you are going to use basic symbols
    to do your calculations.


    ### Code

    ```java

    import java.util.Scanner ;

    ```


    ### Code

    ```java

    public class StringVariables {


    }

    ```


    ### Code

    ```java

    Scanner client_input = new Scanner(System.in)

    ```


    ### Code

    ```java

    String middle_name;


    middle_name = client_input.next() ;

    ```


    ### Code

    ```java

    System.out.print (" Enter your middle name: " ) ;


    middle_name = client_input.next() ;

    ```

