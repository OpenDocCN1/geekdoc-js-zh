  trans: "\n\n在你创建了一个新项目后，你会发现文本窗口中有些文字是灰色的，并且包含星号或斜杠。这些区域将成为你的注释，当程序运行时，这些注释将被程序忽略。你可以在注释中输入任何你想输入的内容，但大多数情况下，注释会解释你正在对代码进行的操作。单行注释通过在前面输入两个斜杠来输入。\n\
    \n### Code\n```\n// this is a comment\n```\n\n当你需要多行注释时，你有两个选择：\n\n```java\n//\
