    your comment\nAnd it is going to continue here\n*/\n```\n\n你也可以选择使用所谓的 Javadoc\
    \ 注释，在那种注释中，你会看到一个正斜杠带有两个星号，并以一个单星号和一个斜杠结束。但是，每一行的前面都会有一个星号。Javadoc 注释通常用于文档代码。这些代码将被转换为一个\
    \ HTML 页面，以帮助他人。\n\n如果你点击 NetBeans 顶部菜单上的“运行（run）”，你可以选择“生成 Javadoc”。然而，由于你还没有编写任何代码，你什么也看不见。你可以删除\
    \ NetBeans 生成的注释。\n\n## Java 结构\n\n包名将出现在你的代码开头。该行将以分号结尾，如果你不小心漏掉了那个分号，程序将无法编译。在你的包名之后，将列出类名。\n\
