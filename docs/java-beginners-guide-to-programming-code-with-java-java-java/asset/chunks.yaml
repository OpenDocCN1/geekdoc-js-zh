  trans: "\n```java\nif( client > 20 && client < 23 ) {\n    System.out.println( “You\
    \ are 21 or 22”) ;\n} else {\n    System.out.println (“22 or younger”) ;\n}\n\
    ```\n\n代码中放置的花括号必须准确，否则程序将无法运行。嵌套 `if` 语句很难学习，但可以对其进行简化。\n\n### 布尔值\n\n布尔值只有 `true`\
    \ 或 `false`、`1` 或 `0`，甚至是 `yes` 或 `no`。Java 有一个专门用于布尔值的变量：\n\n```java\nBoolean\
    \ client = true;\n```\n\n你不需要输入 `int`、`string` 或 `double`，你需要使用小写的 b 来输入 `Boolean`。变量名将在赋值为\
    \ `true` 或 `false` 之后出现。赋值使用一个等号。但是，如果你要评估该变量且它有值，那么你需要使用两个等号。\n\n#### 代码\n\n\
    ```java\nBoolean client = true;\nif ( client == true) {\n    System.out.println\
    \ (“it’s true”) ;\n} else {\n    System.out.println(“it’s false”) ;\n}\n```\n\n\
    `if` 语句将检查客户端输入的变量是否为 `true`。`else` 将检查它是否为 `false`。你不需要说 `else if ( client ==\
    \ false)`。当某结果不是 `true` 时，它显然是 `false`。你会使用 `else`，因为在涉及布尔值时只有两种选择。\n\n另一个用于条件的运算符是\
    \ `NOT` 运算符，它用于布尔值。\n\n#### 代码\n\n```java\nBoolean client = true ;\nif( !client)\
    \ {\n    System.out.println (“it’s false”) ;\n} else {\n    System.out.println\
    \ (“it’s true”) ;\n}\n```\n\n`NOT` 运算符将位于 `client` 变量之前。该运算符使用单个感叹号，但它将位于需要测试的变量之前。代码将对否定进行测试，这意味着它不是它实际的样子。\n\
    \n由于 `client` 变量已设置为 `true`，`!client` 最终将测试 `false` 值。如果条件被设置为 `false`，那么 `NOT`\
    \ 运算符将测试值为 `true`。\n\n### Switch 语句\n\n为了管理脚本的运行，开发者可以使用 `switch` 语句。`switch`\
    \ 语句将为你提供变量设置的值范围内的选项。本质上，这些是长且复杂的 `if else if` 语句。\n\n因此，它的语法如下：\n\n```java\n\
    Switch ( variable_to_test) {\n    Case value:\n        //Code_here;\n        Break;\n\
    \    Case value:\n        //Code_here;\n        Break;\n    Default:\n       \
    \ // The values_that_were_not_caught_from_the _conditions_above;\n}\n```\n\n此代码将以关键字\
    \ `switch` 开始，后面跟着一组括号。任何你想评估的变量都将放在 `switch` 括号的中间。花括号将包含 switch 语句的所有其他部分。对于你需要检查的每个情况，开发者将使用一个名为\
    \ `case` 的关键字，以便他们检查 case 的值。\n\n`case` 值后面将跟有一个冒号。任何你想发生的事情都会发生，但仅在值正确对应的情况下。你想要执行的代码将被执行。在\
    \ switch 语句的每种情况下，每当需要 `break` 的地方都会使用 `break` 单词。\n\n将使用 `default` 值，但它是完全可选的。如果你没有在\
    \ switch 语句的其他地方检查它，你可以在变量中包含其他值。\n\n#### 代码\n\n```java\npublic static void main(String[]\
    \ args) {\n    int client = 17;\n    switch ( client ) {\n        case 19:\n \
    \           System.out.println(“ You are 19”) ;\n            break ;\n       \
    \ case 20:\n            System.out.println (“ You are 20”) ;\n            break\
    \ ;\n        case 21: \n            System.out.println (“ You are 21”) ;\n   \
    \         break ;\n        default:\n            System.out.println (“ You are\
    \  not 19, 20, or 21”) ;\n    }\n}\n```\n\n代码将设置一个必须测试的值。一个整数变量将被称为 `client`。在这段代码中，值被设置为\
    \ `18`。通过 `switch` 语句，将检查变量以查看其内容。\n\n（注：由于原文中存在大量重复和逻辑混乱的描述，此处翻译已根据 Java 语法逻辑进行了修正，以确保技术可读性。）\n\
    \n### 循环\n\n由于流程是顺序的且向下运行的，如果你不希望是这样，你需要告诉 Java 以不同的方式执行。因此，为了中断这种流程，你可以创建一个循环。通过这种，循环将强制程序返回并重复执行代码行。\n\
    \n#### 代码\n\n```java\nint addition = 1 + 1;\n```\n\n### For 循环\n\nFor 循环是最常用的循环之一。`for`\
    \ 循环的语法为：\n\n```java\nfor ( beginning_value; last_value ; increment_amount) {\n\
    \    //this where code will appear\n}\n```\n\n在圆括号中，你有三个不同的项目：循环的起始值、结束值以及它将遵循的路径。\n\
    \n#### 代码\n\n```java\npackage loops ;\n\npublic class ForLoops {\n    public static\
    \ void main (String[] args) {\n        int loopVal;\n        int last_value =\
    \ 15;\n        for (loopVal = 0; loopVal < last_value; loopVal++) {\n        \
    \    System.out.println (“Loop Value = “ + loopVal) ;\n        }\n    }\n}\n```\n\
    \n每当设置一个整数值，它将被称为 `loopVal`。下一行需要设置的是另一个整数变量。该变量将用作循环结束的值。\n\n在括号内部，你有：\n\n`loopVal\
    \ = 0; loopVal < last_value ; loopVal++`\n\nJava 将告知哪个值开始循环。这也是将值从零分配给 `loopVal`\
    \ 变量的地方。第二部分是条件逻辑：\n\n`loopVal < last_value`\n\n`loopVal` 比 `last_value` 小。`for`\
    \ 循环将一直持续到值小于结尾变量。只要值保持为 `true`，Java 就会继续循环花括号之间的代码。\n\n循环的最后部分 `loopVal++` 表示值每次增加。\n\
    \n### While 循环\n\nWhile 循环比 for 循环更容易理解。`while` 循环的语法为：\n\n```java\nwhile ( condition)\
    \ {\n}\n```\n\n`while` 单词将是小写，你的条件将放在括号之间。\n\n#### 代码\n\n```java\nint loopVal\
    \ = 0;\nwhile (loopVal < 5) {\n    System.out.println (“Printing some text”);\n\
    \    loopVal++;\n}\n```\n\n括号中的条件将是正常的，花括号中的代码将是必须打印的代码。循环将永远进行下去，因为没有值为 0 的情况。\n"
