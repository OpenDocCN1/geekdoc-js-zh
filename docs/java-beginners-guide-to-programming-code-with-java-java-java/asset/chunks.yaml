  trans: "\n当这段代码按字母顺序排序时，`a` 不会排在第一位，因为它是小写的。因此，`a` 的值为 `u\\0061`。大写的字母 `T` 的值为 `u\\\
    0054`。\n\n在操作具有不同文本的字符串时，你可以使用以下一些方法：\n\n- `toUpperCasse`\n- `toLowerCase`\n-\
    \ `compareTo`\n- `IndexOf`\n- `endWith`, `startsWith`\n- `Substring`\n- `Equals`\n\
    - `charAt`\n- `trim`\n- `valueOf`\n\n关于大小写字母，Java 将以一种直观的方式将文本转换为小写或大写，并将使用内置的\
    \ `toUpperCase` 和 `toLowerCase` 方法来实现。\n\n### 代码\n```java\npackage prjstrings;\n\
    \npublic class StringManipulation {\n\n    public static void main (String[] args)\
    \ {\n        String changeCase = \"text to change\";\n        String result;\n\
    \        result = changeCase.toUpperCase();\n        System.out.println(result);\n\
    \    }\n}\n```\n\n开头几行告诉了字符串变量设置在哪里，同时保留了在打印之前需要更改的文本。第三行调用了变量的结果。最后，在第四行中进行了转换。\n\
    \n```java\nresult = changeCase.toUpperCase();\n```\n\n该字符串方法将适用于任何字符串。你只需要在变量后输入一个点，就可以看到你可以对你的\
    \ `changeCase` 字符串进行操作。如果你想让它变成大写，那么就选择它，但请记住，大写后面应该有一组空括号。\n\n一旦结果完成转换，它将作为存储为新结果。如果你不想存储结果，可以使用以下代码：\n\
    \n```java\nSystem.out.println(changeCase.toUpperCase())\n```\n\n当你想要执行 `toLowerCase`\
    \ 时，将使用相同的方法。\n\n### 字符串比较\n可以通过十六进制值对字符串进行比较。你只需要使用 `compareTo` 方法即可。\n\n###\
    \ 代码\n```java\npackage prjstrings;\n\npublic class StringManipulation {\n\n  \
    \  public static void main (String[] args) {\n        int result;\n        String\
    \ Word1 = \"Ape\";\n        String Word2 = \"App\";\n        result = Word1.compareTo(Word2);\n\
    \        if (result < 1) {\n            System.out.println(\"Word1 is less than\
    \ word2\");\n        } else if (result > 0) {\n            System.out.println(\"\
    Word 1 is more than word 2\");\n        } else if (result == 0) {\n          \
    \  System.out.println(\"the same word\");\n        }\n    }\n}\n```\n\n当这两个单词进行比较时，使用了带有此语法的\
    \ `compareTo` 方法：\n\n```java\nresult = Word1.compareTo(Word2);\n```\n\n返回的值将是一个大于零、小于零或等于零的值。你需要确保分配了正确的值，以便将\
    \ `compareTo` 的结果返回给变量。代码中将包含 `if` 语句来测试并查看结果是什么。\n\n但是，当比较两个字符串时，Java 将比较十六进制值而不是单词的字母。由于由于两者都包含大写字母，`App`\
    \ 的 `A` 将排在 `ape` 之前。\n\n### indexOf\n`indexOf` 将定位当前字符串或任何其他字符串中的字符。\n\n### 代码\n\
    ```java\npackage prjstrings;\n\npublic class StringManipulation {\n\n    public\
    \ static void main (String[] args) {\n        char ampersand = '@';\n        String\
    \ email_address = \"meme@me.com\";\n        int result;\n        result = email_address.indexOf(ampersand);\n\
    \        System.out.println(result);\n    }\n}\n```\n\n这段代码正在检查提供的电子邮件地址中是否存在\
    \ `@` 符号。由于使用了单引号，它是一个 `char` 变量。一旦设置好电子邮件，你将得到结果，结果是一个 `int` 变量。因此，得益于 `indexOf`\
    \ 方法，你的结果是一个整数。\n\n由于这一行的存在，你的 符号位置将是这段代码的结果：\n\n```java\nresult = email_address.indexOf(ampersand);\n\
    ```\n\n当你指定要使用 `indexOf` 方法时，你想要搜索的字符串将出现在点之后。括号内是你提供多个选项的地方。首先，你可以输入单个字符。通过此操作，Java\
    \ 在存储变量结果的值之前，会告诉你该字符在字符串中的位置。\n\n当运行代码时，输出将是四。由于 `indexOf` 和其他所有内容一样从零开始，因此 `&`\
    \ 是电子邮件字符串中的第四个字符。\n\n如果你要找的字符不存在，那么 `indexOf` 将给你返回负一的结果。\n\n### 代码\n```java\n\
    package prjstrings;\n\npublic class StringManipulation {\n\n    public static\
    \ void main (String[] args) {\n        char ampersand = '@';\n        String email_address\
    \ = \"mememe.com\";\n        int result;\n        result = email_address.indexOf(ampersand);\n\
    \        if (result == -1) {\n            System.out.println(\"invalid email address\"\
    );\n        } else {\n            System.out.println(\"email address is ok\");\n\
    \        }\n    }\n```\n\n虽然代码看起来完全一样，但你现在将使用字符串变量来包含你想要检查的文本。再次返回负一的结果表示未找到搜索的文本。`IndexOf`\
    \ 也可以用于测试多个字符。\n\n```java\npublic static void main (String[] args) {\n    String\
    \ dotcom = \".com\";\n    String email_address = \"meme@me.com\";\n    int result;\n\
    \    result = email_address.indexOf(dotcom);\n    if (result == -1) {\n      \
    \  System.out.println(\"invalid email address\");\n    } else {\n        System.out.println(\"\
    email address is ok\");\n    }\n}\n```\n"
