    equals sign. The equals sign is going to have a new keyword before you get to
    your data type. The type of data that is being used is going to be followed by
    the array’s size. The size will let Java know how many positions the array needs
    to have.


    You can also put it all in one line if that is how you prefer your code to look.


    Code


    int[ ] aryNums = new int[ 6 ] ;


    Java is going to know that you are using an array that has six positions in it
    and that the data type is integers. Therefore, the default values are going to
    be zero to six.


    When you want to assign the values to a various amount of positions, you are going
    to do it like normal.


