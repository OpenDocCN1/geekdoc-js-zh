    int[ ] lottery_amounts = new int [ 49 ] ;


    int I ;


    for ( I = 0; I < lottery_amounts.length ; i++) {


    lottery_amounts[ I ] = I +1;


    System.out.println ( lottery_amounts[ 1 ] ) ;


    }


    }


