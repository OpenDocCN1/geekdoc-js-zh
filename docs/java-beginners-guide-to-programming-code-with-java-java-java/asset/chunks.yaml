    \n当你编写代码时，你需要包含 `main` 单词，以便 Java 知道它从哪里开始。这个方法将是一段代码，但它将帮助执行 `main` 大括号内部的任何代码。如果你忘记在编写的程序中放入\
    \ `main` 入口点，就会发生错误消息。\n\n## 运行 Java 程序\n\n每当程序运行时，它将在屏幕底部可见的输出窗口中运行。你不需要启动任何终端或控制台窗口，因为输出窗口就是你的控制台。\n\
