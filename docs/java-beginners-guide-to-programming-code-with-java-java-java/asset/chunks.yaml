  raw: 'After you have created a new project, you are going to realize that there
    is some text in your text window that is grayed out and contains asterisks or
    slashes. These areas are going to be your comments and when the program is run,
    the comments are going to be ignored. You are going to be able to type anything
    that you want to in the comments but most of the time a comment is going to explain
    what you are doing with your code. A single line of comment is going to be typed
    by having two slashes in front of it


    Code


    // this is a comment


    When you want more than one line of comments you have two options


    Code


    // your comment


    //and it is going to continue here


    Or


    /*


    your comment


    And it is going to continue here


    */


    You can also choose to use something known as a Javadoc comment where you will
    see a forward slash with two asterisks while it ends with a single asterisk and
    one slash. But, every line is going to have an asterisk in front of it. Javadoc
    comments are typically used in the document code. This code is going to be turned
    into an HTML page that will help others.


    If you click on run at the menu found at the top of NetBeans, you can choose Generate
    Javadoc. However, you are not going to see anything since you have not written
    any code yet. You can delete comments that NetBean generates


    Java structure


    The package name is going to come first in your code. The line will end with a
    semicolon, and if you happen to miss that semicolon, the program is not going
    to be compiled. After your package name, the class name is going to be listed.


    Think of your class name as a segment of code. Java has to be told where the code
    starts and where it ends with the use of curly brackets. The code is going to
    start with a left bracket and end with a right one. Whenever something is placed
    in these brackets, you are going to have a code segment.


    When you are writing code, you will need to include the word main so that Java
    knows where it needs to start. This method is going to be a chunk of code but
    it is going to assist in executed any code that is inside of the curly brackets
    for your main. An error message is going to occur if you forget to put a main
    entry point into the programs that you write.


    ––––––––


    Running a Java program


    Whenever a program is run, it is going to be run in an output window that will
    be seen at the bottom of your screen. You are not going to need to start any terminals
    or console windows because the output window is your console.


    You will have a multitude of ways that you can run your program when it comes
    to NetBeans. But, the easiest way for you to do it is to just press F6\. If you
    do not want to do that, you can also go to the menu and select the run project
    button.


    There is also a green button that you will find on your tool bar that is going
    to run your program. Yet another way that you can run your program is to go to
    the projects window. You are going to be able to make sure that the proper code
    is going run by right clicking on the project that you want to be run and selecting
    run file.  This method can also be used inside of the actual text window by clicking
    somewhere that there is code.


    Any way that you choose is going to run your program in the output window if you
    have written your code properly.


    ### Chapter 2:


    ## Variables


    Most programs are going to work through the manipulation of data that has been
    placed into the program’s memory. This data is going to be objects, amounts, text,
    and any other pointers that are in the memory area. When you give the data a name,
    it can be renamed when you need to, but the name and value are going to be considered
    to be variables.


    Amounts


    When an amount needs to be stored in Java, there are going to be several options
    that you can use. There are whole amounts like 8 or 12 that can be stored as int
    variables. Int is going to stand for integer.


    Then there are floating point amounts such as 8.4 or 10.5 that are stored as double
    variables. When you are storing these ones, you are going to need to use an equals
    sign.


    Code


    public static void main(String [ ] args) {


    int last_amount;


    System.out.println (“My Last Project”);


    }


    The program will require the developer communicate with it what the developer
    want to save an integer, so you are going to need to type int with a space following
    it. You will then be allowed to enter whatever you want the variable to be named.
    Variables can be named anything that you desire them to be named, however, there
    are a specific set of rules that you must abide by.


    -  The name of the variables can mean different things. Being that the name will
    be case sensitive, names like firstname or FirstName are going to be two different
    names.  


    -  A variables name cannot have a amount as the first character. Using the words
    to spell out the amount is going to be fine, but using the actual amount is going
    to cause Java to throw out an error message. The amounts are going to be used
    in other places of Java.


    -  Variable names are not allowed to have spaces. The variables declaration of
    int first amount is going to throw an error message at you. You can use underscores
    or subsequent uppercases.


    -  No keywords are allowed to be used as variable names. There are several keywords
    that are used in Java and NetBeans is going to turn these words blue in your coding.


    At the point that you want to store a variable with the name of last_amount, you
    are going to enter an equals sign before you put the value that you want to store.


    ––––––––


    Code


    public static void main(String[] args) {


    int last_amount;


    last_amount = 10;


    System.out.println (“My First Project”);


    }


    The program has to understand that the amount 10 needs to be stored as the Last_amount.
    You can also do all of this coding in a single line if you prefer to.


    Code


    public static void main(String[] args) {


    int last_amount = 10;


    System.out.println(“My Last Project”) ;


    }


    In order for the code to be put into action, the developer will need to manipulate
    the last line of the script to something similar to this:


    System.out.printIn( “Last amount =” + last_amount) ;


    The information that is between the round brackets is going to be direct text
    that has to be placed inside of double quotes. A plus sign is going to join the
    two halves of the expression together so that the text for the expression and
    the variable’s name are concatenated.


    Once you have gotten all this code written out, you are going to be able to run
    it so that you can see it in the window at the bottom where your output is going
    to be displayed.


    The integer that has been saved will be known as the last_amount.


    When you are adding two integers together, one will store the amount for the two
    that you are adding together while a different one is going to store the result.
    Every variable will be separated by commas.


    Code


    last_amount = 30 ;


    third_amount = 60 ;


    result = last_amount + third_amount;


    Your result is going to be the last and third amounts added together. The addition
    is going to be done with the use of a plus sign. When you have finished with the
    equation, your amount is going to be stored on the side of the equals that has
    the result variable. The first and third amounts being assigned, the amount is
    not going to be assigned until it has been added up.


    Code


    result = 30 + 60 ;


    Java understands that there are two variables and you are not going to need to
    use the names. Your print in method is going to change too


    System.out.println( “Addition Total =” + result) ;


    Once more, the plain text is going to be combined and there are going to be double
    quotes around the variable’s name. You are going to be able to run the program
    and get it in the output window to see how it performs. 


    Amounts can also be used directly so that the result is changed.


    Code


    result = last_amount + third_amount + 12 ;


    When the program is run again, the result is going to going to be different as
    is your print in.'
