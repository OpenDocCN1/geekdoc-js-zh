    \ `JOptionPane` 中选择 `showInputDialog` 方法。这将导致输入的数据直接存储到相应的变量中。\n\n## Code\n\n\
    ```java\nString middle_name;\nmiddle_name = JOptionPane.showInputDialog (“ Middle\
    \ Name “) ;\n```\n\n在你使用 `JOptionPane` 输入完一个句号后，会弹出一个列表。在这里，你可以双击 `showInputDialog`，这样你就可以在括号之间输入你想显示的消息。像其他任何内容一样，它应该位于双引号之间。\n\
    \n## Code\n\n```java\nString inherited_name;\ninherited_name = JOptionPane.showInputDialog\
