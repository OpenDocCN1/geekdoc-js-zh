    it stores the value for the result of the variable.


    When the code is run, the output is going to be four. Since indexOf starts at
    zero like everything else, the ampersand is going to be the fourth character in
    the email string.


    Should the character that you are looking for not exist, then indexOf will give
    you a result of negative one.


    Code


    package prjstrings ;


    public class StringManipulation {


    public static void main(String[] args) {


    char ampersand = ‘ @ ‘ ;


    String email_address = “mememe.com” ;


    int result ;


    result = email_address.indexOf( ampersand ) ;


    if ( result == -1 ) {


    System.out.println( “invalid email address” ) ;


    }


    else {


    System.out.println( “email address is okay” ) ;


    }


    }


    }


    Your result of negative one is going to allow the client to continue.


    IndexOf can also be used to test for multiple characters.


    public static void main (String[] args) {


    String dotcom = “ .com “ ;


    String email_address = “ meme@me.com “ ;


    int result ;


    result = email_address.indexOf( dotcom ) ;


    if (result == -1( {


    System.out.println( “invalid email address” ) ;


    }


    else {


    System.out.println(“email address is okay”) ; 


    }


    }


    While this code looks exactly the same, you are now going to be using the variable
    from the string in order to hold the text that you want to check for instead of
    the char variable.


    With another result of negative one being returned, the text that was searched
    for could not be found in the string that comes before the dot for the indexOf
    method. If it had, then the indexOf would have returned the character that first
    matched what you were searching for.


    In the code listed above, the dot is going to be the seventh character inside
    of the email address whenever you start counting from zero.


    ## Conclusion


    Thank for making it through to the end of Java: Beginner’s Guide to Programming
    Code with Java, let’s hope it was informative and able to provide you with all
