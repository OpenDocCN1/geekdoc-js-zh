    # Strings and arrays


    Arrays can be put into strings just like integers.


    ```java

    String[ ] aryString = new String[ 5 ] ;

    aryString[ 0 ] = “this” ;

    aryString[ 1 ] = “is” ;

    aryString[ 2 ] = “a” ;

    aryString[ 3 ] = “string” ;

    aryString[ 4 ] = “array” ;

    ```


    This code has five different positions and every bit of text has been placed into
    the array where it belongs.


    Here is a loop that is going to use all the positions of the array, but it is
    going to print out every position.


    ```java

    int I ;

    for ( I = 0 ; I < aryString.length ; i++ ) {

    System.out.println( aryString[ I ] ) ;

    }

    ```


    This loop will repeat until the value is of lesser value than what the range of
    the array has been called for.


    Arrays can also be sorted alphabetically therefore `aa` is going to be before
    `ab`. But, since Java uses a set of characters known as `Unicode`, in order to
    contrast the letters in the string to other letters, the uppercase letters are
    going to come before the lower cased ones.


    ```java

    package strings1 ;

    import java.util.Arrays ;


    public class StringArrays {

    public static void main(String[] args) {

    String[ ] aryString= new String[ 5 ] ;

    aryString[ 0 ] = “This” ;

    aryString[ 1 ] = “is” ;

    aryString[ 2 ] = “a” ;

    aryString[ 3 ] = “string” ;

    aryString[ 4 ] = “array” ;

    Arrays.sort( aryString ) ;

    int I ;

    for ( I = 0; I < aryString.length ; i++) {

    System.out.println ( aryString[ I ] ) ;

    }

    }

    }

    ```


    ## Arrays that are Multi-Dimensional


    The arrays that were talked about previously in the chapter have only been single
    columns of data, but, you are able to set up arrays that have multiple columns.
    These arrays are known as multi-dimensional arrays.


    ```

    0 – 10 – 12 -43 – 11 - 22

    1 – 20 – 45 -56 – 1 – 33

    2 – 30 – 67 – 32 – 14 – 44

    3 – 40 – 12 – 87 – 14 - 55

    4 – 50 – 86 – 66 – 13 – 66

    5- 60 – 53 – 44 – 12 – 11

    ```


    A multi-dimensional array is arranged in this fashion:


    ```java

    int[ ] [ ] aryAmounts = new int[ 6 ] [ 5 ] ;

    ```


    The array is going to be set up exactly like a normal array, but there are going
    to be two square bracket sets. The first set is going to tell Java how many rows
    there are going to be while the second set tells how many columns.


    ```java

    aryAmounts[0][0] = 10;

    aryAmounts[0][1] = 12;

    aryAmounts[0][2] = 43;

    aryAmounts[0][3] = 11;

    aryAmounts[0][4] = 22;

    ```


    The first row is going to be zero like always, then the columns are going to go
    to four which is going to result in five items being placed on the array.


    Your second row is:


    ```java

    aryAmounts[1][0] = 20;

    aryAmounts[1][1] = 45;

    aryAmounts[1][2] = 56;

    aryAmounts[1][3] = 1;

    aryAmounts[1][4] = 33;

    ```


    The first for loop is going to use the position of the amounts in rows while the
    second loop uses the position based on columns. The first loop is going to be
    the value of `I` which is zero. The code that is nested inside of the loop will
    be used for a different loop. The next loop is going to be evaluated as long as
    the variable of `I` is zero.


    ## Lists for Arrays


    It is hard to tell the exact amount of items that are going to be inside of an
    array, so it is going to be easier for you to use an `ArrayList`. The `ArrayList`
    is a data structure that is going to be dynamic. Therefore, your items can be
    added and removed. Normal arrays have data that is static since you are not going
    to be able to change the original size of the array that you have created.


    When you are setting up `ArrayList`, you are going to have to make sure that you
    pull the package from the library with the following syntax.


    ```java

    import java.util.ArrayList;

    ```


    Once it has been imported, you are going to be able to create new objects on the
    list with this syntax:


    ```java

    ArrayList listTest = new ArrayList( );

    ```


    You are not going to need to have square brackets when you are using an Array
    List.


    ```java

    listTest.add( "first item" );

    listTest.add( "second item" );

    listTest.add( "third item" );

    listTest.add( 7 );

    ```


    What falls in the middle of the parentheses is going to be added to the list.
    You are only going to be able to add objects. The first three items on this list
