  7. 创建一个创建按钮的函数，在页面上添加 3 个按钮。\n8. 为第一个按钮添加事件监听器，点击时它应该选择主表格中的所有页面 `td` 单元格。在循环元素时将背景更新为随机颜色。\n\
  9. 创建第二个页面按钮，该按钮将具有颜色向下移动一行的效果。选择主表中所有的 `td` 单元格。创建一个临时数组，在循环单元格时，第一行生成随机值。将这些值添加到数组中。当移动到第二行时，从\
  \ `td` 元素的 `ind` 值中减去列数。这将给你位于上方行中元素的值。获取上方元素的背景颜色并将其添加到数组中。\n10. 一旦完成临时数组的构建，它应包含所有颜色值且有一行向下平移，现在循环该数组，并将背景颜色应用到节点列表中匹配的\
  \ `td` 元素上。\n11. 创建第三个按钮。当点击此按钮时，循环主表格中所有的 `td` 元素。将当前元素的背景更新为其右侧一个索引值的元素背景颜色。对于最后一个\
