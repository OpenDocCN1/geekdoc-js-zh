  \ < (game.x2 + game.w2) && (game.x1 + game.w1) > game.x2;\n const o4 = game.y1 <\
  \ (game.y2 + game.h2) && (game.y1 + game.h1) > game.y2;\n output3.style.color =\
  \ (o3 ? 'green' : 'black');\n output4.style.color = (o3 ? 'green' : 'black');\n\
