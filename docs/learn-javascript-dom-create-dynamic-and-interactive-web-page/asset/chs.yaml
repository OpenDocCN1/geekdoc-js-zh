  \ (${game.x1} < ${game.x2 + game.w2}) && ((game.x1 + game.w1) > game.x2)`;\n output5.innerHTML\
  \ = `V ${o4}:${game.y1} < (${game.y2 + game.h2}) && ((game.y1 + game.h1) > game.y2})`;\n\
  \ output6.innerHTML = `V ${o4}: ${game.y1} < (${game.y2 + game.h2}) && (${game.y1\
