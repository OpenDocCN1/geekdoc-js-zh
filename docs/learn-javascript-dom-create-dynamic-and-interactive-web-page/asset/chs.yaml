  \ t, html, c) {\n const ele = document.createElement(t);\n  ele.innerHTML = html;\n\
  \  ele.classList.add(c);\n return parent.appendChild(ele);\n}\n```\n\n\n\n\n游戏的目标是在元素掉落时点击它们，尝试让它们落在移动的平台上以得分。第一节课是设置基础游戏板，以及与元素和移动的简单交互。此练习将演示如何创建元素、如何通过更新样式值来移动元素，以及如何创建响应用户交互的交互元素。\n\
  \n![](img/image00488.jpeg)\n\n使用 `requestAnimationFrame()` 方法创建页面上元素之间的平滑移动。\n\n\
  ### 创建移动的基础交互式元素练习：\n\n1. 创建一个可以设置新页面元素的函数。使用父元素作为参数，新元素将被添加到该元素中。元素标签类型的字符串名称。元素的内部\
  \ HTML 内容，以及添加到新创建元素中的类名。\n\n```javascript\nfunction maker(parent,t,html,c){\n \
  \ const ele = document.createElement(t);\n  ele.innerHTML = html;\n  ele.classList.add(c);\n\
  \  return parent.appendChild(ele);\n}\n```\n\n2. 添加一个事件监听器，等待 `DOMContentLoaded`\
  \ 触发并调用 `init` 函数来创建游戏板内容。\n\n3. 为新元素添加点击事件。\n\n4. 为创建的新元素框创建随机背景颜色。`Math.random().toString(16).slice(2,8)`\n\
  \n5. 当元素框被点击时，为元素添加 `active` 类。\n\n6. 创建一个新函数来处理元素的动画。该函数应在点击“开始游戏”时被调用，并在内部运行 `requestAnimationFrame()`\
  \ 调用该函数。\n\n7. 在 `mover()` 函数中，获取所有激活的元素，获取元素的 `offsetTop` 值，并将其增加游戏速度值。将新的 `top`\
  \ 样式位置值应用到元素上使其移动。\n\n8. 添加一个条件，当元素到达游戏容器底部时，通过移除元素的 `active` 类来停止其移动。\n\n```html\n\
  <!DOCTYPE  html>\n<html>\n<head>\n <title>JavaScript Course</title>\n <style>\n\
  \ * {\nbox-sizing: border-box;\n}\n .container {\nposition: relative;\nwidth: 90vw;\n\
