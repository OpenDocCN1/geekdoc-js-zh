  \ DOM 动态元素练习\n\n你想了解更多关于 JavaScript 以及元素是如何运作的吗？元素是对象，可以像 JavaScript 中的其他对象一样存储值。以下三个练习将演示如何使用\
  \ JavaScript 创建页面元素、如何向元素对象添加值以及如何更新页面元素。此外，还有一个关于它们如何与页面元素对象交互，以及函数表达式与函数声明之间区别的练习。\n\
  \n## DOM 创建页面元素并添加样式\n\n![](img/image00481.jpeg)\n\n创建交互式元素，将当前的颜色值输入存储在数组中以供日后使用。同时创建按钮，将\
  \ body 的背景颜色更新为按钮文本的值。\n\n## 动态元素 DOM 中的颜色样式与事件\n\n当需要创建多个元素时，最佳实践是创建一个处理元素创建函数，这可以避免代码重复。此练习将演示如何创建元素、如何将值存储元素对象、如何更新元素的样式属性以及从页面中移除元素。存储元素的值、获取元素的值，并将这些元素值用于创建新的页面元素。使用\
  \ `appendChild()` 与 `append()` 的区别允许代码返回被添加到父元素的元素。这可以节省了一行代码，因为可以将函数的返回值与将新创建的元素添加到页面合并。\n\
  \n### 页面元素事件与样式练习：\n\n1. 使用 JavaScript 在页面上创建两个按钮。\n2. 为第一个按钮添加点击事件，按下时应列出存储数组中所有存储的颜色值。按下时，创建具有存储数组中颜色值且是可点击的页面元素。一旦点击，该元素应从页面上被移除。\n\
  3. 第二个按钮应将输入框中的颜色值存储到存储数组中。\n4. 第二个按钮还应创建一个页面元素按钮，其文本内容为输入框颜色值的值。\n5. 当输入值改变时，更新背景颜色以匹配输入值。\n\
  \n\n\n\n\n在轮播图中显示的内容并不包含在 JavaScript 文件中。此示例将帮助演示如何分离数据，从而可以在不更新代码的情况下进行更新。代码中的代码逻辑应该独立于数据运行。更改\
