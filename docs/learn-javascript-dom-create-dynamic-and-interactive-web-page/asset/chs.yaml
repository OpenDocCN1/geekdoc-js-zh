  4. 创建一个高度和宽度均为 100% 的空滚动指示器。这可以作为用户向下滚动页面时，内部滚动条填充的空白区域。\n5. 添加内部滚动条，将宽度设置为 0，并设置一个与其父元素不同的背景颜色。\n\
  6. 使用 `window.onscroll` 事件计算滚动器的位置。获取浏览器中当前文档的顶部值。使用 `document.documentElement.scrollTop`，它会在滚动时发生变化，并在顶部时为\
  \ 0。如果你的 `body` 位于页面顶部，`document.body.scrollTop` 将为 0。\n7. `document.documentElement.scrollHeight`\
  \ 始终是所有 `body` 内容的总高度。`document.documentElement.clientHeight` 是页面在浏览器中的可见区域。\n8.\
  \ 减去 `document.documentElement.scrollHeight - document.documentElement.clientHeight`，这将得到滚动可用总高度的值。减去\
  \ `clientHeight` 后，一旦到达页面底部，高度将设为 0。\n9. 将顶部的 `document.documentElement.scrollTop`（用户向下滚动时该值会增加）除以总可用主体高度。这将返回一个百分比，然后可以乘以\
