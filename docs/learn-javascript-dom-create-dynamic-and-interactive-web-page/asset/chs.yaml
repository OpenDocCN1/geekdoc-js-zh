  \ `num` 的循环次数执行一个代码块。\n5. 创建一个 `while` 循环，根据输入值的次数输出 `html`。\n6. 创建一个 `do while`\
  \ 循环，根据输入值的次数创建 `html` 输出。\n7. 使用新内容更新 `html`。\n\n```html\n<!doctype html>\n<html\n\
