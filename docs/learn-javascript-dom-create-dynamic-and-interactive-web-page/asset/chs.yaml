- "# 学习 JavaScript DOM：创建动态交互式网页\n\n\n\n![](img/cover0049.jpeg)\n\n\nJavaScript 代码可用于通过浏览器选择并与\
  \ HTML 页面元素交互。网页的内容不必是静态的，通常用户更喜欢并更愿意参与到能够响应的内容中。在网页中添加 JavaScript 可以提升用户体验，创造出一种有趣且现代的内容呈现方式。大多数网页都包含\
  \ JavaScript，学习 `DOM` 以及如何将 `JavaScript` 与网页元素结合使用是现代 Web 开发的一项基本技能。\n\n本书的内容基于练习，旨在开发和提高使用\
  \ `JavaScript` 以及与网页元素交互的技能。练习以分步就进的形式呈现，并配有供尝试的挑战。学习编程最好的方法是尝试代码并观察它的运行效果。编写代码应该是乐趣的，这些练习设计得有趣且富有启发性。有大量的编码示例和源代码引导你开始编码。在学习课程的过程中，请打开你的编辑器并亲自尝试代码。这些项目是入门项目，可以在此基础上进行构建，添加更多功能并让它们变得更好。让你的想象力引导你将它们带下一个阶段。\n\
