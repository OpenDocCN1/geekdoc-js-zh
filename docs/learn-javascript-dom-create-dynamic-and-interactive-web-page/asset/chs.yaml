  ```\n\n# JavaScript 循环代码块\n\n\n\n\n\nJavaScript `For`、`While`、`Do While` 循环多次执行代码块，直到满足条件为止。\n\
  \n循环允许我们多次执行代码块，它们还允许我们遍历项目列表（例如数组中的项），直到数组项的长度条件不再为真，或者满足其他跳出循环的条件。\n\n循环始终需要几个参数，例如起始值、停止循环的条件以及在循环中移动到下一个项目的方法。我们可以通过设置一个带有起始值的变量来建立一个简单的\
  \ `for` 循环，然后应用一个条件，如果该条件为真则继续执行循环，并增加变量的值，使得条件最终不再为真。\n\n![](img/image00448.jpeg)\n\
