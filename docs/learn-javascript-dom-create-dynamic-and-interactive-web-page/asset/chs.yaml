  8. 创建一个打乱短语中单词的函数，名为 `maker()`。\n\n\n\n\n9. 在 `maker()` 函数中，将字符串转换为每个单词的数组。创建一个\
  \ `holder` 数组，在创建单词的打乱版本时使用。\n\n10. 遍历字符串中的所有单词，将单词转换为 `toLowerCase()`。\n\n11. 将单词的字母拆分为单独的数组。使用\
  \ `sort()` 随机化数组中的字母。使用 `join()` 将数组转换回由单词中随机排序字母组成的字符串。将其添加到 `holder` 数组中。\n\n\
  12. 返回 `holder` 数组，将单词合并回字符串。\n\n13. 将打乱的单词赋值给游戏的隐藏值。将短语的打乱版本输出到 HTML 页面。\n\n14.\
  \ 点击按钮时，检查按钮文本，如果是 `new game`，则启动 `starter()` 函数重新启动游戏。\n\n15. 将输入转换为 `lowerCase()`。将该值与数组中选中字符串的隐藏值进行比较。如果匹配，则玩家解决了问题。将按钮文本更新为\
  \ `new game`。\n\n16. 如果错误，向玩家提供反馈，让他们尝试新的字母组合。将继续游戏，直到找到正确答案。\n\n```html\n<!doctype\
