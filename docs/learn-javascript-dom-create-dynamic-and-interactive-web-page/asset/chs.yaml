  \n}\n```\n\n### JSON #3\n```json\n{\n \"first\" : \"Kim\",\n \"last\" : \"Smith\"\
  \n}\n```\n\n# JavaScript DOM 元素碰撞检测\n\n元素的重叠可以被称为碰撞检测。这是大多数游戏中的标准部分，在移动页面元素时，能够检测其位置并计算它们是否重叠。\n\
  \n此练习旨在测试并让你深入学习如何检查在页面上移动元素的重叠。它将演示如何设置页面元素的移动，并输出计算两个页面元素之间碰撞所需的数值。\n\n![](img/image00484.jpeg)\n\
  \n移动页面上的元素可以通过跟踪用户的按键输入来实现。创建一个对象来存储特定按键的 `keydown` 和 `keyup` 布尔值，然后可以在动画帧中使用该对象，根据按键对象中的布尔值来移动元素。如果按键被按下，该对象将具有\
  \ `true` 值，这可以用来判断哪些键被按下，并相应地应用移动。\n\n通过创建一个可以移动元素的交互界面，跟踪以像素为单位的 `X` 和 `Y` 轴值以及元素的高度\
  \ `Height` 和宽度 `Width`，我们就可以看到重叠发生时的数值。这还允许我们直观地看到水平轴或垂直轴上的连接点。通过元素的实时数字和值，查看计算和碰撞公式的运行情况。\n\
  \n### 设置页面元素移动并跟踪位置的练习：\n\n1. 创建一个允许创建页面元素的函数，这样我们就可以根据需要动态向页面添加元素。给函数命名为 `adder()`\
  \ 以获取新元素将要追加的父元素。使用元素标签的字符串值创建元素。为元素添加内部 HTML 内容，并使用字符串值添加类。\n```javascript\nfunction\
  \ adder(parent,t,html,c){ const ele = document.createElement(t);  ele.innerHTML\
  \ = html;    ele.classList.add(c);  return parent.appendChild(ele); }\n```\n\n2.\
  \ 创建四个页面元素：2 个将移动的框和 2 个输出框坐标和尺寸的区域。\n\n3. 创建一个全局游戏对象，用于跟踪动画帧，包含每个框的 `x,y`（水平、垂直）位置，以及每个框的\
  \ `h,w`（高度和宽度）。这些值随后可以更新位置。\n\n4. 设置一个名为 `keyz` 的对象来跟踪哪些键盘键将用于元素移动。添加 8 个键码名称作为属性名，并将值设置为\
  \ `false`。一旦按下按键，这些值将被更新。\n\n5. ```javascript\nconst keyz = {   ArrowLeft:false,\
  \ ArrowRight:false, ArrowUp:false, ArrowDown:false,   KeyA:false, KeyW:false, KeyS:false,\
  \ KeyZ:false, };\n```\n\n6. 在 `document` 上添加事件监听器，监听 `keydown` 和 `keyup` 事件。如果 `keyz`\
  \ 对象中的按键与对象属性名匹配，则在按下时将设置为 `true`，释放时设置为 `false`。现在这可以用于元素移动了。\n\n7. 创建并启动 `mover()`\
  \ 函数，它将处理按键时的页面移动。\n\n8. 在 `mover()` 函数内部添加条件来检查哪些键为 `true`，相应地更新 `game` 对象的 `x,y`。还要应用一个条件，在允许移动之前检查元素是否在\
  \ `main` 容器对象的边界内。\n\n9. 使用每个框的新 `game` `x,y` 值更新其 `style` 中的 `left` 和 `top`。\n\n\
  10. 在元素移动时，将每个元素的 `x,y,h,w` 输出到页面；这些值应随着新的 `x,y` 坐标而变化。这些值将用于计算元素之间的碰撞。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>JavaScript Course</title>\n<style>\n .container\
  \ {\n position: relative;\n width: 90vw;\n height: 300px;\n border: 1px solid #ddd;\n\
  \ }\n .box {\n position: absolute;\n width: 50px;\n height: 50px;\n color: white;\n\
  \ }\n .info {\n position: absolute;\n width: 50px;\n height: 50px;\n text-align:\
  \ center;\n }\n</style>\n</head>\n<body>\n<div class=\"container\">\n <div class=\"\
  box\" id=\"box1\"></div>\n <div class=\"box\" id=\"box2\"></div>\n</div>\n<div id=\"\
  output1\"></div>\n<div id=\"output2\"></div>\n<script src=\"app.js\"></script>\n\
  </body>\n</html>\n```\n\n\n\n\n\n页面元素是可以移动的；通过这个对 DOM 页面元素的实时检测器，可以帮助你更直观地看到碰撞检测公式的运行效果。此练习还将演示如何使用\
  \ `getBoundingClientRect()` 方法在检测函数内部获取元素的边界和尺寸，从而简化碰撞检测。使用 `getBoundingClientRect()`\
  \ 方法可以消除在对象中跟踪元素位置的需要，并在需要时返回所需的 `X`、`Y`、`height`、`width` 值。使用之前相同的重叠公式并放置元素返回的对象值，可以提供一个用于任何元素碰撞检测的快速检查函数。在函数参数中，只需要元素对象，这些对象也可以通过选择或从预定义的元素变量中使用。\n\
  \n![](img/image00485.jpeg)\n\n要检查任何两个元素是否重叠，你需要两个元素的 `x,y`、`height` 和 `width` 值。然后可以使用这些值来计算角，以检查水平轴上的重叠和垂直轴上的重叠。如果水平和垂直方向重叠，则页面上的两个元素之间发生了碰撞。\n\
  \n使用 `getBoundingClientRect()` 将返回元素的尺寸。该方法返回一个值对象，其属性包括 `bottom`、`height`、`left`、`right`、`top`、`width`、`x`、`y`。\n\
  \n![](img/image00486.jpeg)\n\n这些元素值可以用于碰撞公式以检查重叠。\n\n![](img/image00487.jpeg)\n\n\
  ### X-水平检测公式\n```\n(a.x < (b.x + b.width)) && ((a.x + a.width) > b.x);\n```\n\n\
  ### y-垂直检测公式\n```\n(a.y < (b.y+b.height)) && ((a.y + a.height) > b.y);\n```\n\n\
  ### 检查元素重叠移动练习：\n1. 创建移动输出区域以显示元素的当前状态和碰撞值。如果发生重叠，则更新元素的样式。\n2. 在中心创建一个新元素，用于碰撞检查函数。\n\
  3. 创建一个需要两个参数的新函数，每个参数对应一个待检查的元素。获取元素的边界。\n4. 创建函数 `col()`，它可以检查边界并在两个元素重叠时返回一个布尔值。使用此公式检查屏幕上不同框之间的元素重叠。\n\
  5. 根据碰撞检测的结果更新元素样式和输出信息样式。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript\
  \ Course</title>\n <style>\n .container {\n position: relative;\n background-color:\
  \ #ddd;\n width: 90vw;\n margin: auto;\n }\n .box {\n position: absolute;\n width:\
  \ 50px;\n height: 50px;\n left: 0;\n top: 0px;\n line-height: 50px;\n text-align:\
  \ center;\n color: white;\n }\n .info {\n background-color: white;\n padding: 5px;\n\
  \ text-align: center;\n font-size: 1.4em;\n color: white;\n }\n .output1{\n color:black;\n\
  \ font-size: 0.9em;\n padding:0px;\n }\n .blocker{\n width:200px;\n left:100px;\n\
  \ top:100px;\n position:absolute;\n height:100px;\n background-color:yellow;\n text-align:center;\n\
  \ line-height:100px;\n font-size:4em;\n }\n .output2{\n color:black;\n font-size:2em;\n\
  \ }\n .info  div {\n padding: 10px;\n }\n .game {\n position: relative;\n min-height:\
  \ 300px;\n }\n </style>\n</head>\n<body>\n <div  class=\"container\"></</div>\n\
  \ <script  src=\"app8.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst\
  \ main = document.querySelector('.container');\nconst message = adder(main, 'div',\
  \ '', 'info');\nconst output1 = adder(message, 'div', 'Content 1', 'output');\n\
