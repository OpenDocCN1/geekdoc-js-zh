  \ 告诉浏览器正在执行动画，并请求浏览器在下一次重绘之前调用特定的函数来更新页面。作为参数的 `callback` 是在下一次重绘之前应该调用的函数。在这个示例中，代码被用于在页面上创建一个平滑移动的小球元素。它在页面上的位置样式值通过\
  \ `top` 和 `left` 值进行更新。`requestAnimationFrame()` 方法可以用于在 元素内部创建平滑动画。浏览器随后调用指定的函数，在下一次重绘之前更新动画。该方法接收一个回调函数\
  \ 45.jpeg\n\n## 练习\n\n1. 选择一个元素作为容器。\n2. 创建一个 `div` 来显示小球。\n3. 更新元素的样式，使其变为 `absolute`（绝对定位）。\n\
  4. 创建一个对象来存储 `x`、`y`、`direction` 和 `speed`。\n5. 使用 `requestAnimationFrame()` 在下一次重绘之前运行函数。\n\
  6. 给 `pos` 赋值 `left` 和 `top` 属性值。\n7. 在 `animation` 函数中，检查 `pos` 是否超出边界。\n8. 在 `animation`\
  \ 函数中更新 `pos` 位置。\n9. 如果按了 `enter` 键，则启动或停止动画。\n10. 添加一个点击事件来重置小球的颜色。\n11. 创建一个\
  \ `score` 元素显示分数。\n\n```javascript\nconst div = document.querySelector('div');\n\
  const score = document.createElement('div');\nscore.style.textAlign = 'center';\n\
  document.body.prepend(score);\nconst ball = document.createElement('div');\nball.style.border\
  \ = '3px solid white';\nball.style.width = '50px';\nball.style.height = '50px';\n\
  ball.style.backgroundColor = 'red';\nball.style.borderRadius = '50%';\nball.style.position\
  \ = 'relative';\ndiv.append(ball);\nlet pos = {\n  x: 100,\n  y: 100,\n  dx: 1,\n\
  \  dy: 1,\n  speed: 5,\n  move: true,\n  score: 0\n};\nfunction adderScore(){\n\
  \  score.innerHTML = `<div>Score :${pos.score}</div>`;\n}\nfunction gameHit(){\n\
  \  pos.score++;\n  ball.style.backgroundColor = `#${Math.random().toString(16).slice(2,8)}`;\n\
  \  adderScore();\n  pos.x = Math.floor(Math.random()*450);\n  pos.y = Math.floor(Math.random()*350);\n\
  \  ball.style.left = `${pos.x}px`;\n  ball.style.top = `${pos.y}px`;\n}\nlet mover;\n\
  function ani(){\n  pos.move = true;\n  if(pos.move){\n    if(pos.x > 450 || pos.x\
  \ < 0){\n      pos.dx *= -1;\n    }\n    if(pos.y > 350 || pos.y < 0){\n      pos.dy\
  \ *= -1;\n    }\n    pos.x += pos.speed * pos.dx;\n    pos.y += pos.speed * pos.dy;\n\
  \    ball.style.left = `${pos.x}px`;\n    ball.style.top = `${pos.y}px`;\n  }\n\
  \  mover = requestAnimationFrame(ani);\n}\nball.onclick = gameHit;\ndocument.addEventListener('keydown',e)\
  \ => {\n  if(e.key === 'Enter') {\n    if(pos.move){\n      pos.move = false;\n\
  \      cancelAnimationFrame(mover);\n    }else{\n      pos.move = true;\n      mover\
  \ = requestAnimationFrame(ani);\n    }\n  }\n});\n```\n\n\n\n\n\n# JavaScript DOM\
  \ 编码练习与挑战\n\n通过 JavaScript DOM 编码项目学习交互式和动态网页。这些现代化的编码练习将帮助你通过最常见的 JavaScript 问题来提升你的\
  \ JavaScript 编码技能。\n\n以下编码练习旨在帮助你开发使用 JavaScript 在网页页面上创建交互式和动态内容的技能。\n\n## 网页动态欢迎消息\n\
  \n该网页练习是一个简单的示例，展示了如何从用户处获取输入，然后在 JavaScript 中应用该输入值来创建动态网页响应。输入字段为用户与网页的交互提供了方式。要获取输入值，需要选择页面元素，然后在该元素的属性值中，有一个属性名值存储了输入字段的值。将该值返回到一个变量，然后在字符串响应中使用该值，最后作为自定义消息输出到网页中给网络用户。\n\
  \n代码示例展示了：选择页面元素 `document.querySelector()`、更新元素的样式属性（通过给属性 `userVal.style.borderColor`\
  \ 赋值新值）、以及为元素 `btn.onclick` 添加事件监听器。\n\n![](img/image00458.jpeg)\n![](img/image00459.jpeg)\n\
  \n询问网页用户其姓名，并将输入值连同欢迎消息一起返回给用户。\n\n创建一个页面欢迎消息：\n\n1. 在输入框中获取用户名\n2. 当按下按钮时，添加一个事件来获取用户名并在页面上创建欢迎消息\n\
  3. 添加一个检查以确保输入长度大于 3 个字符\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript\
  \ Course</title>\n</head>\n<body>\n<div class=\"output\">What is you name?</div>\n\
  <input type=\"text\"  name=\"userName\">\n<button>Submit</button>\n<script src=\"\
  app.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst output = document.querySelector('.output');\n\
  const userVal = document.querySelector('input[name=\"userName\"]');\nconst btn =\
  \ document.querySelector('button');\n\nuserVal.style.borderColor = '#333';\nbtn.onclick\
  \ = ()=>{\n if(userVal.value.length > 3){\n const message = `Welcome to the site\
  \ ${userVal.value}`;\n      output.textContent =  message;\n      userVal.style.display\
  \ = 'none';\n      btn.style.display = 'none';\n  }\n else{\n      output.textContent\
  \ = 'Name length must be 3+ characters';\n      userVal.style.borderColor = 'red';\n\
  \  }\n}\n```\n\n## 函数表达式 vs 声明 vs 箭头函数\n\n最常被问的问题之一关于函数以及应该使用哪种函数。创建函数有多种方法，此练习旨在强调如何使用它们。同时也包含了函数的箭头格式，以及使用\
  \ `this` 关键字来引用函数作用域内的当前对象。\n\n![Graphical user interface, application Description\
  \ automatically generated](img/image00460.jpeg)\n\n当对象被创建时，即使使用了相同的函数来创建它们，它们也会独立地持有值。由于是独立的实例，此示例将演示函数代码如何创建独立的对象，因为函数内部的代码块会将函数中创建的值应用到父对象上。这些值随后会被绑定到父对象上，在本例中即绑定到调用点击事件的元素上。\n\
  \n此练习的目标是创建函数，可以通过函数表达式、函数声明以及使用匿名函数的箭头格式来实现。文中提供了使用不同语法的示例。还展示了 `this` 关键字如何应用于父对象元素，并能够分别跟踪点击值。\n\
