  - JavaScript\n- JavaScript\n- JavaScript\n\n# 认识 JavaScript\n\nJavaScript 广泛用于 Web，是最受欢迎的编程语言之一。它允许\
  \ Web 开发人员和设计师通过代码赋予网页生命。除了 HTML 和 CSS，JavaScript 是互联网上使用的代码技术之一。它直接在浏览器中运行，你可以在计算机上使用文本编辑器创建\
  \ html 文件并在浏览器选择 html 文件并用任何浏览器打开，然后引入 JavaScript 代码让事情发生。\n\n# 开始编码\n\n代码是你希望发生的事情的指令集。示例：当新用户访问你的网站时，询问他们的姓名。显示带有他们姓名的欢迎消息，是你可能要求\
  \ JavaScript 执行的操作示例。要编写代码，你需要将完成此任务的步骤分解开。从获取姓名开始，因为在第二步将姓名返回给网站用户时将需要它。\n\n##\
  \ 第一步 - 获取用户姓名\n\n![](img/image00435.jpeg)\n\n## 第二步 - 使用用户的输入值显示欢迎消息。\n\n![](img/image00436.jpeg)\n\
  \n代码指令将是：\n\n1.  为用户提供一个输入区域\n2.  从输入获取用户姓名的输入值\n3.  使用该值向用户返回响应\n\n\n\n\n\n## 4.\
  \ 概述 (Overview)\n\n然后代码将能够选择页面元素，用包含欢迎消息更新元素更新，其中包含了用户输入的姓名值。\n\n下面的代码将是后续课程中将涵盖内容的示例，并将为实现上述结果创建步骤。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript Course</title>\n\
  </head>\n<body>\n<div class=\"output\">What is you name?</</div>\n<input type=\"\
  text\" name=\"userName\">\n  <button>Submit</button>\n  <script>\n    const btn\
  \ = document.querySelector('button');\n    const output = document.querySelector('.output');\n\
  \    const userVal = document.querySelector('input');\n    btn.onclick = () => output.innerHTML\
  \ = `Welcome ${userVal.value}`;\n  </script>\n</body>\n</html>\n```\n\n这是一个为网页访问者创建自定义交互式\
  \ Web 体验的步骤的简单示例。该代码将为该用户创建一个独特的体验，并根据用户在输入区域提供的内容进行定制。\n\n你越能为 Web 用户定制化 Web 体验，用户就越倾向于享受并留在网页上。创建出色的网页体验正是\
  \ JavaScript 的核心所在。在你的网页元素中执行操作并让事情发生，运行在用户的浏览器中。这就是 JavaScript 可以做到的，创建 Web 用户寻找的这种一对一体验。Web\
  \ 用户对网站有更多期待，JavaScript 可以帮助你实现它。\n\n你需要一些工具，你可能已经在计算机上拥有它们。当然，需要一个 Web 浏览器来运行代码，所有的\
  \ Web 浏览器都能运行 JavaScript，但请注意它们对新版本的代码兼容性可能不相同。像 `Chrome` 这样的浏览器自带了开发者工具仪表板，这在创建网页时非常有用。`DevTools`\
  \ 仪表板有助于调试，并能够看到代码后台发生了什么。\n\n![网站上打开的 Web 工具示例。](img/image00437.jpeg)\n网站上打开的 Web\
  \ 工具示例。\n\n开发者控制台向你显示有关当前加载网页的信息，并包含一个你可以在当前网页内执行 JavaScript 表达式的控制台。打开你的浏览器，选择开发者工具并尝试一下，我们将在本课程中使用它。在大多数现代浏览器中，你可以直接从浏览器编写并执行\
  \ JavaScript。在 `Chrome` 浏览器中，当你想要处理 `DOM` 或 `CSS` 时，可以打开 `DevTools`，右键点击页面上的元素并选择\
  \ `Inspect`（检查）跳转到 `Elements`面板。或者按下 `Command+Option+C` (Mac) 或 `Control+Shift+C`\
  \ (Windows, Linux, Chrome OS)。当你想查看日志消息或运行 JavaScript 时，按下 `Command+Option+J` (Mac)\
  \ 或 `Control+Shift+J` (Windows, Linux, Chrome OS) 直接跳转到 `Console`面板。\n\n你还需要一个编辑器来编写代码。所谓的\
  \ `IDE`（集成开发环境）是用于构建应用程序的软件。`IDE` 可创建代码文件、将其保存到计算机并编辑文件。使用 `IDE` 的优点之一是代码更具读性，而且通常有插件、样式选项和多个内置工具帮助编写代码。一旦创建了文件，你可以使用\
  \ FTP 将代码文件传输到你的 Web 服务器。如果你还没有编辑器，可以使用 `Visual Studio code`。第一节课将帮助你在计算机上进行设置并开始编码。\n\
  \n![Web 编辑器打开并在名为 code11.js 的文件中创建 JavaScript 代码的示例](img/image00438.jpeg)\nWeb 编辑器打开并在名为\
  \ `code11.js` 的文件中创建 JavaScript 代码的示例\n\n开始学习 JavaScript 很容易：你只需要一个现代 Web 浏览器和一个编写代码的编辑器。开始之前，创建一个名为\
  \ `index.html` 的文件并在浏览器中打开它。这就是在浏览器中运行计算机上文件所需的所有内容。要向 html 中添加 JavaScript，你可以通过链接到扩展名为\
  \ `JS` 的脚本文件，或者直接在 HTML 的 `script` 标签之间编写 JavaScript 代码来实现。\n\n在第一节课结束时，你应该已经设置好了编辑器和浏览器，并准备好编码。你可以通过\
  \ Google 找到代码编辑器列表，几乎所有的编辑器都支持前端代码。如有需要，可以在 `https://code.visualstudio.com/` 下载编辑器。\n\
  \n# JavaScript 简介 (Introduction to JavaScript)\n\n探索 JavaScript，了解它是如何工作的以及你如何编写代码\n\
  \nJavaScript 是 Web 上的核心技术，与 `HTML` 和 `CSS`。`HTML` 元素可以作为对象访问，对象具有属性、方法和事件。在学习本书的过程中，我们将更详细地探讨这一点。\n\
  \n`HTML` 是用于结构化和为 Web 内容提供意义的标记语言。`CSS` 是用于包含 `HTML` 内容样式规则的语言。JavaScript 是允许你在网页内创建交互式和动态内容的脚本语言。\n\
  \n你可以用 JavaScript 做很多事情，例如存储值、运行代码块、使用条件应用逻辑以及为你的页面添加事件。使用 JavaScript 可以做很多事情，可能性是无限的。JavaScript\
  \ 直接在浏览器中运行并由浏览器渲染。你可以使用 `DOM` 连接到 HTML 元素，`DOM` 是 JavaScript 用于添加、更新和删除 HTML 的编程接口。\n\
  \nJavaScript 代码是单线程的，这意味着线程上一次只能发生一件事。其他请求在操作完成之前会被阻塞，然后这些请求才会运行。JavaScript 代码是逐行执行的，这很重要因为你在尝试使用变量之前需要声明它们，还有许多其他方面将在后续页面中探讨。\n\
  \nAPI 是预构建的组件集，允许开发者连接并访问这些对象。把它想象成一个控制面板，JavaScript 让你与之交互。浏览器也有 API，JavaScript\
  \ 代码可以访问，这正是允许代码与可见 Web 内容交互的原因。浏览器 API 允许访问网页元素和其他数据。你可以访问 API 并进行实用的编程。`DOM`（文档对象模型）API\
  \ 允许你操作 `HTML` 和 `CSS`。本书将详细介绍 `DOM`，以及你使用 JavaScript 选择和操作元素的方法和方式。\n\n![通过浏览器与网页交互。HTML\
  \ CSS 和 JavaScript](img/image00439.jpeg)\n通过浏览器与网页交互。`HTML` `CSS` 和 JavaScript\n\
  \n服务端(Server-side) 与客户端(Client side)的区别是指代码运行的位置。服务端代码在服务器上运行，而不是在用户的计算机或浏览器中。客户端代码直接运行在用户的计算机中，当涉及到\
  \ JavaScript 时如此。当用户在浏览器中查看网页时，代码被下载、运行并由浏览器显示。\n\n\n\n\nJavaScript 可用于动态网页内容，因为它可以更新网页的显示内容并生成内容。JavaScript\
  \ 在客户端或用户计算机的浏览器中运行。因此，我们机可以在没有互联网连接的情况下运行代码，因为我们需要的所有内容都已经在计算机的浏览器应用程序中了。一个没有更新内容且始终显示相同内容的网页被称为静态页面。通常情况下，静态页面已成为过去式，在互联网刚创建时，HTML\
  \ 并不具有交互性，且页面输出对所有用户都是一样的。\n\n## 课程 JavaScript 编码练习\n\n1. 打开你的代码编辑器并创建一个基础的 `html`\
  \ 文件。\n2. 保存该 `html` 文件并在浏览器中打开它。\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  \ <title>JavaScript</title>\n</head>\n<body>\n  Hello World\n</body>\n</html>\n\
  ```\n\n搭建你的 Web 开发环境，从开始开始编写代码。使用编辑器 `visual studio code`。使用 `Chrome` 浏览器和 `Chrome\
  \ DevTools` 查看控制台消息。\n\n# 开始编程\n\n探索如何开始编写 JavaScript 代码以及如何将 JavaScript 添加到你的 HTML\
  \ 文件中以便在浏览器中运行代码。\n\n在本节中，我们将探索如何向 HTML 文件中添加 JavaScript。JavaScript `JS` 文件不会在浏览器中独立运行，它们将作为文本文件输出并显示\
  \ JavaScript 代码。要运行 JavaScript，它必须位于 HTML 文件中，要么在 HTML 代码内部，要么在 HTML 代码中链接到一个带有\
  \ JavaScript 代码的 `JS` 文件。将 JavaScript 整合到网页中有多种方法。下面我们将探索这 3 种方法，包括作为元素内的属性、在 HTML\
  \ 的 script 标签之间，以及作为从 HTML 代码链接的 `JS` 文件。\n\n你可以将 JavaScript 作为内联属性添加到 HTML 元素中，尽管不建议使用这种格式。它们很难识别，且不是良好的做法。\n\
  \n```html\n<div onclick=\"alert('hello')\">Hello World 1</div>\n```\n\nHTML `script`\
  \ 标签内部的内部 JavaScript。如果你将与页面元素进行交互，应将其添加到 `body` 标签结束标签之前。代码从上到下加载到浏览器，如果 HTML 尚未完全加载而你尝试使用\
  \ JavaScript 访问元素，你将会遇到错误。\n\n```html\n<script>\n  document.write('<div>Hello World\
  \ 2</div>');\n</script>\n```\n\n最佳实践是使用外部文件，使用 `js` 扩展从 HTML 文件创建一个单独的文件。放置 `script`\
  \ 标签并使用 `src` 属性链接到你文件所在的路径。它可以是相对于 `html` 文件的相对路径，也可以是使用完整路径的文件地址绝对路径来加载它。如果你使用绝对路径，你应该可以将路径粘贴到你的网络浏览器并看到该文件。\n\
  \n```html\n<script src=\"app.js\"></script>\n<script src=\"http://www.example.com/app.js\"\
  ></script>\n```\n\n使用 `document.write()` 方法向网页输出文本的示例代码。你可以使用 `document` 对象，它是由浏览器创建的代表网页元素的对象。`document`\
  \ 对象有几个方法可以应用于编码逻辑。使用 `document.write()` 将在遇到代码时直接将圆括号内的任何字符串值写入网页中。我们将在接接的课程中更详细地介绍\
  \ `document` 对象。这仅仅是 `document` 对象的许多功能之一，以及它如何被通过 JavaScript 代码直接在浏览器中与 HTML 页面元素进行交互。\n\
  \n```javascript\ndocument.write('<div>Hello World 3</div>');\ndocument.write('<div>Hello\
  \ World 4</div>');\ndocument.write('<div>Hello World 5</div>');\n```\n\n## 课程 JavaScript\
  \ 编码练习\n\n1. 创建一个 `HTML` 文件和一个 `JS` 文件。\n2. 使用 `script` 标签链接 `JS` 文件作为源文件。\n3. 使用\
  \ `document.write()` 向网页添加文本。\n4. 使用 `document.write()` 向你的网页添加 HTML 格式的内容。\n\n\
  # JavaScript 编码技巧\n\n学习如何开始使用 JavaScript 并创建你的第一段 JavaScript 代码。\n\n本节将介绍如何使用注释对语句和代码进行文档说明。尽可能使用注释为编码语法提供上下文，你可以在\
  \ JavaScript 中使用单行注释或多行注释。使代码更具人类可读性的最佳实践是使用缩进并利用空白提高代码的可读性。浏览器会忽略空白，可以使用它来结构化代码以便于查看。在单独的\
  \ `JS` 文件中创建代码并从 HTML 文件链接到它，是将你的 HTML 文件连接到 JavaScript 代码的最佳方法。你可以使用 `console`\
  \ 进行调试并查看值。\n\n为了确保你的代码按预期工作，你可以利用某些语法来向浏览器输出值和信息。使用 `console.log()` 向浏览器输出调试数据。\n\
  \n代码中的空白会被忽略，使用空白和缩进使代码更具人类可读性。注意不要在语句之间添加空格，因为这会在代码被渲染时导致错误。可以使用大括号来指示代码块，这将在接下来的课程中的各种代码语法中使用。代码周围的大括号表示一个旨在一起运行的代码块。代码块的缩进允许编辑器更容易读取代码。\n\
  \n```javascript\n{\n  document.write('<br>Output Message');\n  document.write('<br>Output\
  \ Message');\n}\n```\n\n使用单行或多行注释为代码提供更多上下文。你可以通过 `//` 注释语句来调试应用程序。注释会被忽略且不会输出到页面。\n\
  \n```javascript\n/*\n这是我的代码！\nLaurence Svek\n*/\n//alert('Hello');\n```\n\n使用 `console`\
  \ 方法允许你从 JavaScript 代码向浏览器进行调试和通信。这可以在 JavaScript 代码运行时提供额外的信息。控制台消息仅输出到浏览器的控制台中，对用户不可见。\n\
  \n![控制台输出示例及其在 Chrome 浏览器中的显示方式](img/image0440.jpeg)\n\n控制台输出示例及其在 Chrome 浏览器中的显示方式。\n\
  \n```javascript\nconsole.log('Hello');\nconsole.error('Hello');\nconsole.info('Hello');\n\
  console.warn('Hello');\n//console.clear();\nconsole.log('New line');\n```\n\n`Window`\
  \ 对象是 `document` 对象的父级。`window` 对象是顶层父级，包含了可以使用的方法。`alert()` 和 `prompt()` 都是 `windows`\
  \ 对象的一部分。你可以使用这些与用户创建交互。两者都会在浏览器中显示标准的弹出消息，用户必须进行操作后才能与窗口的其他部分进行交互。尽管它们提供了与用户交互的简单方法，但这些并不常用，因为用户体验较差，且现在\
  \ JavaScript 和 DOM 中有更多交互选项。警报和提示旨在与网络用户进行交互。从创建 `index.html` 和 `app.js` 文件开始。然后编写一些\
  \ JavaScript 代码并尝试。在浏览器中打开并运行 HTML 文件。你可以使用课程中的函数如 `alert()` 或 `document.write('Hello');`；Alert\
  \ 会停止代码执行，如果在顶部，则在点击按钮之前不会输出内容。将 JavaScript 放在底部以便其余代码可以渲染。\n\n```javascript\nwindow.alert('Hello\
  \ World');\n```\n\n\n\n\nWindow prompt（窗口提示）与 alert（警告）略有不同，因为 prompt 有一个回调函数，这意味着输入值会被返回到\
  \ JavaScript 代码中并作为值在代码中使用。这两者都可以在代码中使用不包含 `window` 对象的情况下编写。代码会自动默认指向顶层对象，如果代码中没有指定，它将查找顶层对象，默认情况下就是\
  \ `window` 对象。\n\n```javascript\nprompt('How are you?');\n```\n\n![带有问题和响应回调的 window\
  \ prompt()示例](img/image00442.jpeg)\n\n带有问题和响应回调的 window `prompt()` 示例\n\n```javascript\n\
  alert('Hello');\n\nconst res = prompt('What is your name?');\n\nalert(res);\n```\n\
  \n### JavaScript 课程练习：\n\n1. 在你的 JavaScript 文件中注释掉一行代码。\n2. 使用多行注释注释掉一个代码块。\n3.\
  \ 尝试使用不同的消息测试各种 `console` 输出方法。\n4. 创建一个以你的名字为消息 `alert`。\n5. 创建一个返回网页用户名的 `prompt`。设置一个变量来捕获\
  \ `prompt` 的响应值，并使用 `document.write()` 方法将值输出到文档。\n\n# 在 JavaScript 中使用变量\n\n● 变量是编程的基础概念之一\n\
  ● 使用 `const` 或 `let` 避免使用 `var`\n● `const` 和 `let` 是基于作用域的\n● 父级作用域 vs 局部作用域\n●\
  \ 给变量赋值并重新赋值更新后的新值\n● 使用字符串和数字作为变量的值\n● JavaScript 改变数据类型时的动态类型\n● `Math` 以及 JavaScript\
  \ 的直接输出\n\n变量允许开发者存储值，这些值可以在代码中根据需要进行更新。通常，变量在代码开头声明，并在整个代码中使用它们存储应用程序的值。当你声明变量时可以使用“let”改变值。如果你希望值在整个代码中保持不变，请使用“const”。这可以避免代码中错误重新赋值导致的错误和问题。\n\
  \n双引号、单引号或反引号可包含字符串内容。如果语句单独写一行，则不需要分号（`;`）。但如果希望在一行中编写多个语句，则必须用分号分隔。然而，最佳实践是即使在严格不需要的情况下也始终在语句后写分号。JavaScript\
  \ 代码忽略空白符；你可以利用它来编写更易读、更易理解的代码。\n\n## 创建变量\n\n- `var` - 声明变量，可选地初始化为一个值。\n- `let`\
  \ - 声明一个块作用域的局部变量，可选地初始化为一个值。代码块由 `{}` 表示。\n- `const` - 声明一个块作用域的、只读的常量。不可更改。\n\n\
  在使用变量之前必须声明它们。用逗号分隔来声明多个变量。如下所示，驼峰命名（CamelCase）更具读性。\n\n```javascript\nlet a,b,c,d;\n\
  \nlet userfirstname = “Laurence”;\n\nlet userFirstName = “Laurence”;\n```\n\n###\
  \ JavaScript 课程练习：\n\n1. 使用 `let` 和 `const` 声明数字和字符串变量。\n2. 使用使用单引号、双引号和反引号创建字符串的不同格式。\n\
  3. 将结果输出到 `console` 和文档中。\n4. 给变量分配新值并输出结果。\n5. 尝试使用 JavaScript 包裹在 `${}` 中的模板字量字符串，并检查控制台和网页中的输出。\n\
  \n```javascript\nlet a = 'Laurence Svekis';\n\nlet b = 10;\n\nlet e = 5;\n\nlet\
  \ f = 20;\n\nlet myStr1 = 'Hello\\'s \"world\"';\n\nlet myStr2 = \"\\\"Hello\\\"\
  \ 'world'\";\n\nlet myStr3 = `Hello'      s    \n\n\"world\"`;\n\nlet tempLit =\
  \ `Math ${b  +  e  +  f} Hello`;\n\nconst myName = 'Laurence Svekis';\n//myName\
  \ = 'Svekis';\n\n{\n const b = 1000;\n  console.log(b);\n //var c = 100;\n //let\
  \ d = 100;\n}\n\n//console.log(c);\nconsole.log(b);\n\nconsole.log(myName);\n\n\
  a = 'Hello World';\n\nlet val = b + e + f;\n\nval = myStr1 + ' ' + myStr2 + ' '\
  \ + myStr3;\n\nval = tempLit;\n\nval = `${myStr1} ${myStr2} ${myStr3}`;\n\nconsole.clear();\n\
  \nconsole.log(val);\n\ndocument.write(val);\n```\n\n# JavaScript 动态类型转换\n\n● JavaScript\
  \ 数据类型\n● 数据类型 `string`, `number`, `boolean` - `typeof` 类型转换\n● 数据类型 `Booleans`,\
  \ `Null`, `Undefined`\n● `number.toString()` `Number(string)`\n● `typeof` 运算符\n\
  ● 数据类型包括数字、字符串、布尔、对象\n\nJavaScript 动态类型转换及其工作原理。JavaScript 变量可以转换为不同的数据类型，它们并不是设置为声明时的数据类型。JavaScript\
  \ 使用不同的数据类型，JavaScript 会动态地分配它认为所需的类型，如果有需要你也可以更改变量的数据类型。\n\n### JavaScript 课程练习：\n\
  \n1. 声明多个变量但不给它们赋值。\n2. 获取变量的数据类型并将其输出到页面。\n3. 将数字和字符串相加。\n4. 将字符串转换为数字。\n5. 将字符串转换为数字。\n\
  6. 创建布尔值。\n\n```javascript\nlet myStr = 'Laurence';\n\nlet myNum = 0;\n\nlet a;\n\
  \nlet b,c,d;\n\nlet val;\n\nmyStr = 5;\n\nmyNum = 'test';\n\nb = 5;\n\nc = 10;\n\
  \nd = '20';\n\nd = null;\n\nd = true;\n\nd = false;\n\nd = c.toString();\n\na =\
  \ '100X';\n\nd = parseInt(a);\n\nval = b + c;\n\nval = d;\n\nval = typeof(d);\n\
  ```\n\n# JavaScript 变量\n\n变量命名规则提供了可以使用名称以及如何在代码中声明 JavaScript。\n\n● 变量标识符必须使用唯一名称\n\
  ● 变量标识符应具有意义\n● 标识符可以包含字母、数字、下划线和美元符号\n● 变量名必须以字母、下划线或美元符号开头\n● 名称大小敏感\n● 名称不能与\
  \ JavaScript 单词重复\n● 变量名中不能有空格\n\n命名规则必须以字母、下划线 (_) 或美元符号 ($) 开始。后续可以是字母或数字。大写或小写。变量名长度没有限制。\n\
  \n### JavaScript 课程练习：\n\n1. 创建一些字符串值。\n2. 为变量名赋予有意义的名字。\n3. 使用驼峰命名变量名。\n\n```javascript\n\
  let _test5 = 'Laurence';\n\nlet $test_ = 'Svekis';\n\nlet test$ = 'hello';\n\nlet\
  \ TESTtest = 'hello';\n\nlet myFirstName = 'Laurence';\n//let let = 'Not a good\
  \ idea';\n\nlet myLastName = $test_;\n\nlet output = myFirstName;\n\nlet fullName\
  \ = `${myFirstName} ${myLastName}`;\n\noutput = fullName;\n\nconsole.log(output);\n\
  \ndocument.write(output);\n```\n\n\n\n\n数组是具有预设项目顺序的对象，通过元素的索引来选择和标识列表中的元素。数组还具有内置方法，这些方法使其成为数据以及操作和选择数组中包含项目的强大方式。对象也可以在同一个变量中包含多个项目，它们通过属性名进行标识，该属性名用于从对象中选择项目。每个属性名在对象中只能使用一次，且是唯一的。属性名可以使用引号设置或作为单个单词在对象中设置。它们与属性名成对赋值值，使用冒号分配值，并用逗号分隔多个命名的对值。\n\
  \n### JavaScript 编码练习\n\n1. 创建一个包含各种数据类型的数组。\n2. 创建一个包含各种数据类型的对象。\n3. 从数组和对象中检索一个值并将其输出到控制台。\n\
  4. 尝试同时使用点符号表示（dot notation）和方括号表示（bracket notation）获取对象内部的值。\n5. 使用数组的索引值和对象的属性名更新数组和对象的值。\n\
  6. 声明一个新变量并将现有数组赋值给新变量。修改新变量的内容并观察第一个数组是否也随之更新。\n\n```javascript\nconst arr1 = ['one',100,false,null,[1,2,3]];\n\
  \nconst obj1 = {\n  first:'Laurence',\n  'full Name':'Laurence Svekis',\n  id :\
  \ 100,\n  status : true,\n  arr : [1,2,3,'Hello World']\n};\n\nconst arr2 = arr1;\n\
  \nconst obj2 = obj1;\n\nobj2.id = 5000;\narr2[0] = 'Hello World';\narr1[3] = `Laurence\
  \ Svekis`;\nobj1.first = `Linda Jones`;\n\nlet val = arr1[4][0];\nval = obj1['full\
  \ Name'];\nval = obj1.first;\nval = obj2.arr[3];\nconsole.log(val);\ndocument.write(val);\n\
  ```\n\n# JavaScript 函数\n\n探索如何在代码中使用函数来运行代码块。尝试避免重复代码，函数提供了一种运行代码块的极佳方式。\n\n- 函数可用于运行代码块\n\
  - 两种类型的函数：函数表达式（Function Expression）和函数声明（Function declaration）\n- 函数可以接收\n- 函数命名规则与变量相同\n\
  - 你可以在括号内向函数传递值，参数名可以用逗号分隔以添加多个值\n- 当函数被调用时，参数被称为函数参数（arguments），它们是函数在参数中接收的值\n\
  - 函数可以返回；`return` 语句将结束函数执行并返回值\n- 函数在花括号内具有作用域。函数作用域内的局部值只能在函数内部访问\n- 函数的益处是你可以编写一次代码并根据需要重复使用。你可以通过不同的参数值和返回值获得不同的结果。\n\
  \n函数允许开发者运行代码块，当函数运行时，是在定义函数并调用函数时执行代码的。函数在代码中提供了一种运行代码块的强大方式，它们还包含自己的作用域，因此在函数内部设置的变量只在该函数内存在。在代码中创建函数来完成重复的任务并处理特定的编码目标。你可以向函数传递值，然后在函数代码中使用这些值，并从函数代码返回结果。函数可以在参数中使用参数，尽管这不是强制的。函数也可以使用\
  \ `return`，尽管不是强制从函数返回响应。你可以向函数传递值以便在代码中使用。\n\n函数有两种类型：使用 `function` 关键字分配函数代码的函数声明，或者类似于给变量赋值的函数表达式（但在这种情况下赋值的是函数代码）。\n\
  \n```javascript\n// Function declaration\nfunction test(num) {\n  return num;\n\
  }\n\n// Function expression\nvar test = function (num) {\n  return num;\n};\n```\n\
  \n### JavaScript 编码练习\n\n1. 创建一个全局值，每执行一次函数时都会递增。在每个函数中添加该值的增量。`counter++`。\n2.\
  \ 创建一个函数表达式，在其代码内部可以将一个值输出到控制台。\n3. 调用函数。为函数更新一个参数，让函数使用该参数值并将该值输出到控制台。\n4. 创建一个函数声明。添加\
  \ 3 个参数，它们将接收值并将它们全部相加。使用 `return` 返回传入函数的值的总和。\n5. 将函数的返回值赋值给变量，并将变量输出到网页上。\n\n\
  ```javascript\nconst fun1 = function (val) {\n  counter=counter+val;\n  const output\
  \ = `<div>Hello ${counter}</div>`;\n  document.write(output);\n}\n\nlet counter\
  \ = 0;\nlet word = '';\n\nfun1(21);\nfun1(2);\nfun1(3);\nfun2('h');\nfun2('e');\n\
  fun2('l');\nfun2('l');\nfun2('o');\n//fun1 = 100;\n\nconsole.log(fun1);\nconst fun5\
  \ = fun1;\nfun5(1000);\n\nfunction fun2(val){\n  word = word + val;\n  counter++;\n\
  \  let output = `<div>Hello ${counter}</div>`;\n  document.write(output);\n}\n\n\
  let valTotal = 0;\nvalTotal += fun3(10,44,55);\n\nfunction fun3(num1,num2,num3){\n\
  \  let total = num1 + num2 + num3;\n  console.log(total);\n  return total;\n}\n\n\
  const temp = 5000;\nfun4(100);\n\nfunction fun4(val){\n  const temp = 9;\n  const\
  \ myVal = val + temp;\n  console.clear();\n  console.log(myVal);\n}\n```\n\n# 用于交互页面的\
  \ DOM\n\nJavaScript 可以通过事件监听器创建交互内容。事件监听器等待用户执行操作，从而触发事件的发生。DOM 可以表示页面元素。文档模型（DOM）是页面的数据表示。DOM\
  \ 以树状结构组织，作为构成网页和 HTML 文档的对象。DOM 是 HTML 文档的编程接口，即如何访问和页面内容。使用 JavaScript 让你的网页活跃起来。DOM\
  \ 和 JavaScript 允许你在不刷新网页的情况下创建向用户展示新元素和更新的内容。\n\n### JavaScript 编码练习\n\n1. 创建你的\
  \ HTML 文件并添加页面元素\n2. 将 `document.body.children` 数组赋值给变量，它将代表 body 内的所有子元素。\n3. 选择第一个元素使用索引值\
  \ `0`，就像数组一样基于索引。使用 `console.dir()` 输出对象。\n4. 从元素中选择一些属性并将其输出到控制台。\n5. 将元素的 `textContent`\
  \ 更新为你的名字。\n6. 打开喜欢的网站并打开开发者工具，输入 `document.body.textContent = \"Laurence Svekis\"\
  `。\n\n```html\n<!doctype html>\n<html>\n<head>\n <title>JavaScript</title>\n</head>\n\
  <body>\n<div id=\"one\" class=\"red\">Hello World 1</div>\n<div>Hello World 2</div>\n\
  <script src=\"dom1.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst\
  \ ele = document.body.children[0];\nconsole.dir(ele);\n\nlet val = 'Laurence Svekis';\n\
  document.body.children[0].textContent = val;\n\nele.textContent = 'UPDATED';\n```\n\
  \n\n\n\n# 使用 JavaScript 选择页面元素\n\n使用 JavaScript 的 DOM 方法可以选择 HTML 页面元素。一旦选中了元素，就可以使用代码对其属性进行操作。\n\
  \n`Document` 对象中存在一些方法，允许我们更好地选择想要用代码操作的元素。`querySelector()` 和 `querySelectorAll()`\
  \ 允许 JavaScript 从文档对象的内容中选择页面元素。\n\nJavaScript `querySelectorAll` 获取页面元素全部。使用 `querySelector`\
  \ 和 `querySelectorAll` 选择匹配的页面元素。不同的选择器包括标签、id 和类（class）。选择页面元素，遍历节点列表（node list）的内容输出并更新页面元素。\n\
  \n## JavaScript 编程练习：\n\n1. 更新你的 HTML 以包含 2 个 `div` 和一个 `input` 元素。\n2. 使用 `querySelector()`\
  \ 和 `querySelectorAll()` 选择所有页面元素并将页面元素对象赋值给变量。\n3. 更新第一个元素的文本内容。\n4. 给 `input`\
  \ 元素赋值一个值 `myInput.value`。\n5. 更新第二个 `div` 的某些样式属性，使其看起来更像一个按钮。\n6. 为按钮添加事件监听器，将一个函数分配给元素的点击事件\
  \ `onclick`。\n7. 在 `click` 函数内部获取输入框的值，将第一个 `div` 的 `textContent` 更新为输入字段的值。给输入字段的值赋值一个空字符串。\n\
  \n```html\n<div id=\"one\" class=\"red\">Hello World 1</div>\n<input type=\"text\"\
  >\n<div>Hello World 2</div>\n```\n\n```javascript\nconst ele1 = document.querySelector('div');\n\
  const ele2 = document.querySelector('#one');\nconst ele3 = document.querySelector('.red');\n\
  \nele1.textContent = 'Laurence Svekis';\n\nconst eles = document.querySelectorAll('div');\n\
  \nconsole.log(ele1);\nconsole.log(ele2);\nconsole.log(ele3);\nconsole.dir(eles);\n\
  \neles[0].textContent = 'Hello World';\nconsole.log(ele1.textContent);\n\nconst\
  \ myInput = document.querySelector('input');\nconsole.log(myInput.value);\nmyInput.value\
  \ = 'Laurence';\n\neles[1].textContent = 'Click Me';\neles[1].style.border = '1px\
  \ solid black';\neles[1].style.width = '200px';\neles[1].style.textAlign = 'center';\n\
  eles[1].onclick = clicker;\n\nfunction clicker(){\n  let temp = myInput.value;\n\
  \  ele2.textContent = temp;\n  myInput.value = '';\n}\n```\n\n# 使用条件应用逻辑\n\n逻辑条件可以根据条件当前返回的布尔（Boolean）结果来创建不同的响应。根据语句中条件的数量，可以使用各种\
  \ JavaScript 语法，如 `if` 语句、`Switch` 语句或三元运算符。所有这些都可以用于返回依赖于所检查结果的响应。\n\n条件可以在代码中使用，以应用逻辑，并根据条件的结果运行不同的操作。根据\
  \ `True`（真）或 `False`（假）的值，可以运行不同的代码块。\n\n`if` 语句将检查条件，如果为真则运行指定的代码。如果为假则不运行代码。`Else`\
  \ 在条件不成立时提供另一种选择，那么 `else` 语句允许我们在之前的所有条件都不真的情况下，在假时运行代码块。你还可以使用 `else if` 语句来检查另一个条件，如果之前的条件返回假，则运行另一个独立的代码块。\n\
  \n使用 `switch` 语句允许我们指定多个替代方案，检查是否有任何条件匹配，并允许执行相应的代码。\n\nJavaScript 代码可以使用比较运算符（Comparison\
  \ Operators）来检查语句是真是假。要检查多个条件，你可以应用逻辑运算符（Logical Operators）来检查条件之间的逻辑关系。下面的示例将展示如何使用逻辑运算符以及在真或假的各种组合下可以预期的结果。\n\
  \n## JavaScript 编程练习：\n\n1. 选择你想要使用的页面元素并为它们分配变量。\n2. 为 `counter` 创建一个全局值 `0`。\n\
  3. 一旦按钮被点击，将 `counter` 加 1。\n4. 检查 `counter` 的值是否小于 2，如果是，则将样式颜色更新为红色。\n5. 在条件中添加一个\
  \ `else if`，检查 `counter` 的值是否小于 4，如果是，则将输出元素的颜色更新为绿色。\n6. 在条件中添加一个 `else if`，检查\
  \ `counter` 的值是否小于 6，如果是，则将输出元素的颜色更新为紫色。\n7. 使用 `else if` 在所有条件都不真时，将元素的样式更新为蓝色。\n\
  8. 创建一个 `switch` 来检查 `counter` 的值。为你想要跟踪的值创建 `cases`，根据不同的 `case` 使用不同的字符串值更新输出区域文本。尝试带有\
  \ `break` 关键字和不带 `break` 关键字的 `switch`。\n9. 在 `switch` 语句中添加一个 `default`。\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n  <title>JavaScript</title>\n</head>\n<body>\n\
  <div>Hello World 1</div>\n<input type=\"text\">\n<button type=\"button\">Click</button>\n\
  <script src=\"dom3.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst\
  \ output = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
  const btn = document.querySelector('button');\nmyInput.value = 'Laurence';\nlet\
  \ counter = 0;\n\nbtn.onclick = () => {\n  counter++;\n  if (counter < 2) {\n  \
  \  output.style.color = 'red';\n  } else if (counter < 4) {\n    output.style.color\
  \ = 'green';\n  } else if (counter < 6) {\n    output.style.color = 'purple';\n\
  \  } else {\n    output.style.color = 'blue';\n  }\n\n  switch (counter) {\n   \
  \ case 1:\n      output.innerText = 'Case 1';\n      break;\n    case 2:\n     \
  \ output.innerText = 'Case 2';\n      break;\n    case 3:\n      output.innerText\
  \ = 'Case 3';\n      break;\n    default:\n      output.innerText = 'Default';\n\
  \  }\n};\n```\n\n# JavaScript 运算符\n\nJavaScript 运算符可以进行算术运算、给变量赋值、拼接字符串以及对值进行比较。JavaScript\
  \ 还有方法可以转换数据类型以确保预期结果。当字符串相加时，结果是字符串。JavaScript 有多种方法可以帮助这些操作顺利进行。\n\n## JavaScript\
  \ 编程练习：\n\n1. 获取输入字段的值。使用 `Number()` 方法将值转换为数字。\n2. 使用 `isNaN()` 检查输入的结果是否为数字。\n\
  3. 使用模（modulus）检查输入是奇数还是偶数。如果有余数，则为奇数，否则为偶数。\n4. 对输入值进行数学计算，并将结果返回给用户的输出字段。\n\n\
  ```javascript\nconst output = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
  const btn = document.querySelector('button');\nlet a, b = 100;\nlet c = a * b /\
  \ 100;\nlet d = 504 % 50;\n\na = a + 1;\na++;\na--;\nconsole.log(a);\nconsole.log(d);\n\
  \nlet e = 10;\ne *= a;\nconsole.log(e);\n\nconsole.clear();\nconsole.log('5' ==\
  \ 5);\nconsole.log('5' === 5);\nconsole.log('5' != 6);\nconsole.log('5' !== 5);\n\
