  \ `insertBefore` 将原始元素插入到父元素中新选中的元素之前。\n\n\n\n5. 如果持有元素（holding element）不存在，则选择事件目标元素并将其作为持有元素。为元素添加一些样式和\
  \ `active` 类。这将使其需要时更容易被选中，并在视觉上告知用户，以便让他们知道哪个元素是激活状态。\n\n6. 添加一个条件来检查元素上是否存在 `active`\
  \ 类，如果找到，则从元素中移除它。\n\n```javascript\nconst output = document.querySelector('div');\n\
  \nconsole.log(output);\n\noutput.innerHTML = '';\n\nconst holder = {\n  ele : null\n\
  }\n\nfor(let i=0;i<20;i++){\n  const ele = document.createElement('span');\n  output.append(ele);\n\
  \  ele.textContent = `${i+1} - Cell`;\n  ele.style.border = '1px solid #ddd';\n\
