  \ JavaScript 获取随机数。随机值非常适合游戏，因为为用户提供了更具挑战性的体验。\n\n`Math` 对象包含了多种可以用于数学功能的方法，此外，它还包含\
  \ `random` 方法，用于在 JavaScript 中创建随机值。`Math.random()` 方法返回一个从 0（包含 0）到小于 1（不包含 1）之间的浮点数。然后可以将随机值进行相乘并四舍入到最近的整数，以包含开发者所需的随机范围值。\n\
  \n随机值是游戏以及为网络用户创建独特自定义体验的理想选择。\n\n## 使用 JavaScript 和 DOM 的随机数交互猜数字游戏编码练习\n\n在此练习中，创建一个随机猜数字游戏，该游戏将提供一个随机范围，用户必须从中猜数字数字。应用程序将向用户提供反馈，说明猜测太高还是太低，允许用户缩小隐藏数字的范围。一旦找到输入值与隐藏数字匹配的解决方案，游戏将重新生成随机数和新的猜数字范围。反馈通过\
  \ HTML 元素提供给用户，这样玩游戏的玩家就知道结果以及下一步该做什么。这是一个使用 JavaScript 和与 DOM 页面元素交互创建简单游戏的完美示例。\n\
  \n玩家在游戏中猜出正确数字的步骤示例。正确数字需要通过应用程序返回给用户的反馈来确定。\n\n从询问一个范围内的数字开始。\n\n![](img/image00444.jpeg)\n\
  \n向玩家提供关于隐藏值的反馈，以便玩家可以使用这些信息在下一轮进行更好的猜测。\n\n![](img/image00445.jpeg)\n\n再次向用户提供反馈，以保持参与度并让玩家进入下一轮。\n\
  \n![](img/image00446.jpeg)\n\n一旦玩家猜中了隐藏数字的正确值，为玩家提供结束反馈。\n\n![](img/image00447.jpeg)\n\
  \n## 课程 JavaScript 编码练习：\n\n1. 在 JavaScript 代码中将 HTML 页面元素选择为变量。\n2. 全局声明变量 `lowValue`、`highValue`\
