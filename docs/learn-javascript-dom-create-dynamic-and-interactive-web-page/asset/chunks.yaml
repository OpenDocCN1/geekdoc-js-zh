  trans: "\n5. 如果持有元素（holding element）不存在，则选择事件目标元素并将其作为持有元素。为元素添加一些样式和 `active` 类。这将使其需要时更容易被选中，并在视觉上告知用户，以便让他们知道哪个元素是激活状态。\n\
    \n6. 添加一个条件来检查元素上是否存在 `active` 类，如果找到，则从元素中移除它。\n\n```javascript\nconst output\
    \ = document.querySelector('div');\n\nconsole.log(output);\n\noutput.innerHTML\
    \ = '';\n\nconst holder = {\n  ele : null\n}\n\nfor(let i=0;i<20;i++){\n  const\
    \ ele = document.createElement('span');\n  output.append(ele);\n  ele.textContent\
    \ = `${i+1} - Cell`;\n  ele.style.border = '1px solid #ddd';\n  ele.style.padding\
    \ = '10px';\n  ele.style.display = 'inline-block';\n  ele.addEventListener('click',mover);\n\
    }\n\nfunction mover(e){\n  const ele = e.target;\n  if(holder.ele){\n    const\
    \ parent = ele.parentNode;\n    parent.insertBefore(holder.ele,ele);\n    holder.ele.style.color\
    \ = 'black';\n    holder.ele.borderColor = '#ddd';\n    holder.ele = null;\n \
    \ }else{\n    const withActive = document.querySelector('.active');\n    if(withActive){\n\
    \      withActive.classList.remove('active');\n    }\n    holder.ele = ele;\n\
    \    holder.ele.classList.add('active');\n    holder.ele.style.color = 'red';\n\
    \    holder.ele.borderColor = 'red';\n  }\n}\n```\n\n# 网页模态弹框元素\n\n探索如何从一个数据对象创建一个\
    \ JavaScript 动态模态框（Modal）。模态框是有用的信息组件，提供了一种交互方式来显示额外内容。用户与页面上显示模态的元素进行交互，模态通常会高亮新元素，并呈现出悬浮在页面其他内容之上的外观。用户随后可以关闭模态框将其从视图中隐藏。\n\
    \n此练习将演示如何从数据创建模态框，并动态将按钮和模态框添加到你的网页中。每个模态框都可以拥有自己的数据，用于创建和自定义它们。它们的行为是相同的，因此使用的代码可以为数据对象中的每个项目动态创建动作。\n\
    \n![](img/image00466.jpeg)\n\n## 练习：\n\n1. 使用 HTML 代码作为此项目的启动代码。\n2. 选择页面上的主 `div`。\n\
    3. 创建一个包含多个项的数据对象，每项都包含标题（title）、正文（body）、颜色（color）和字体颜色（font color）。\n4. 遍历数组中的项，为每一项创建一个页面按钮。在页面上为每个项添加一个可以打开模态的按钮，点击按钮后应该切换模态的显示设置，从\
    \ `none` 切换到 `block`。这将在点击按钮时隐藏和显示模态框。\n5. 创建一个生成模态框的函数命名为 `genModal`。在该函数中返回主模态，以便该元素可以被使用。为元素添加一个事件监听器，检查目标事件元素是否与父模态相同，如果是，则使用模态对象调用\
    \ `closer` 函数。\n6. 在 `genModal` 函数内部将数据作为参数传递给函数。这些数据随后可以用于设置模态元素的 `textContent`\
    \ 和 `style`。\n7. 创建一个主父元素作为遮层（overlay）。在主模态元素上添加 `overlay` 类。\n8. 在模态遮层父元素内，添加一个主模态容器，该容器将包含标题和正文。\n\
    9. 在标题中创建一个文本区域元素（text area）和一个关闭按钮元素。\n10. 为关闭按钮元素添加一个 `addEventListener`。\n\
    11. 在模态标题中添加一个 `x`，当该元素被点击时，也会关闭模态框。\n12. 为模态元素创建并应用样式属性，为模态框创建样式和结构。\n\n```html\n\
    <!doctype html>\n<html\n<head>\n  <title>JavaScript</title>\n  <style>\n .overlay{\n\
    \  display:none;\n  left:0;\n  top:0;\n  width:100%;\n  height:100%;\n  background-color:rgb(0,0,0);\n\
    \  background-color:rgba(0,0,0,0.5);\n  position:fixed;\n  z-index:1;\n     }\n\
    \ .main{\n  width:70%;\n  border:1px solid black;\n  margin:auto;\n  padding:10px;\n\
    \  margin-top:100px;\n     }\n .close{\n  color:red;\n  float:right;\n  font-size:1em;\n\
    \     }\n .close:hover, .close:focus{\n  cursor:pointer;\n     }\n  </style>\n\
    </head>\n<body>\n<div></div>\n<script src=\"code.js\"></script>\n</body>\n</html>\n\
    ```\n\n```javascript\nconst output = document.querySelector('div');\n\nconst data\
    \ = [\n  {\n    title: 'Modal 1',\n    body: 'This is content 1',\n    color:\
    \ 'ddd',\n    font: 'black'\n  },\n  {\n    title: 'Modal 2',\n    body: 'This\
    \ is content 2',\n    color: 'yellow',\n    font: 'black'\n  },\n  {\n    title:\
    \ 'Modal 3',\n    body: 'This is content 3',\n    color: 'purple',\n    font:\
    \ 'white'\n  }\n];\n\ndata.forEach((mod, ind) => {\n  const btn = document.createElement('button');\n\
    \  btn.textContent = `Modal ${ind+1}`;\n  output.append(btn);\n\n  const modal\
    \ = genModal(mod, ind);\n  output.append(modal);\n\n  btn.addEventListener('click',\
    \ (e) => {\n    const temp = modal.style.display;\n    if (temp === 'block') {\n\
    \      modal.style.display = 'none';\n    } else {\n      modal.style.display\
    \ = 'block';\n    }\n  });\n});\n\nfunction closer(ele) {\n  ele.style.display\
    \ = 'none';\n}\n\nfunction genModal(mData, id) {\n  const overlay = document.createElement('div');\n\
    \  const main = document.createElement('div');\n  const mTitle = document.createElement('h2');\n\
    \  const mBody = document.createElement('div');\n  const closeX = document.createElement('span');\n\
    \  const innerTitle = document.createElement('div');\n\n  closeX.classList.add('close');\n\
    \  closeX.onclick = () => {\n    closer(overlay);\n  };\n  closeX.innerHTML =\
    \ '&times;';\n\n  mTitle.style.fontSize = '1.5em';\n  mBody.style.border = '1px\
    \ solid #111';\n  mBody.style.padding = '10px';\n\n  mTitle.append(closeX);\n\
    \  mTitle.style.backgroundColor = 'black';\n  mTitle.style.color = 'white';\n\
    \  mTitle.style.padding = '4px';\n\n  innerTitle.textContent = mData.title;\n\
    \  mTitle.append(innerTitle);\n\n  overlay.classList.add('overlay');\n  main.classList.add('main');\n\
    \  main.append(mTitle);\n  main.append(mBody);\n  overlay.append(main);\n\n  main.style.color\
    \ = mData.font;\n  main.style.backgroundColor = mData.color;\n  mBody.textContent\
    \ = mData.body;\n\n  console.log(main);\n  return overlay;\n}\n```\n\n# 页面计数器编码挑战\n\
    \n探索如何使用 JavaScript 创建动态计数器，使它们独立工作，并将计数值存储在元素对象中。\n\n## 练习：\n\n1. 选择将更新的主页面元素。\n\
    2. 创建一个输入框和一个按钮。为输入框设置属性，使其成为数字类型，并设置最小值为 1，最大值为 20。为输入框设置默认值为 5。\n3. 创建一个创建元素的函数，参数为元素标签名称以及该元素将追加的父元素。\n\
    4. 创建一个空数组来存储主计数器元素以及点击值。\n"
- fmt: "\n### 5. Add a button to generate a report of the clicker values. When the\
    \ button is clicked, loop through the `holding` array, and add to the report the\
    \ value of the `clicker` element with how many times it's been clicked.\n\n###\
    \ 6. On the button beside the input field, get the input value and create the\
    \ number of clickers in the input value. Create a separate function to generate\
    \ the `clicker`.\n\n### 7. In the `clicker` maker function, create a main element\
    \ container. Add a `trackingValue` property to the element, setting the value\
    \ to `0`. Add the new element into the `holder` array.\n\n### 8. Create a `div`\
    \ to hold the clicked value, a button to decrease, a button to increase and an\
    \ `input` with a button to save the value from the `input` to the element clicked\
    \ value.\n\n### 9. Apply styling to the elements, create a function to add the\
    \ attributes to each `input` field.\n\n### 10. Create a function that will update\
    \ the click values, using arguments for the `input` element, the text output element,\
    \ and the value of the `clicker`. Call it `updater()`.\n\n### 11. Add the event\
    \ listeners to the `clicker` buttons, to increase and decrease. Send the values\
    \ to the `updater()` function.\n\n### 12. The 3rd button should take the value\
    \ from the `input` and apply that value to the click value when pressed.\n\n```javascript\n\
    const main = document.querySelector('div');\n\nconsole.log(main);\n\nmain.customValues\
    \ = 1000;\n\nconst myInput = makeElement(document.body,'input');\n\nconst btn\
    \ = makeElement(document.body,'button')\n\nbtn.textContent = 'Make Clickers';\n\
    \nmyInput.setAttribute('type','number');\n\nmyInput.setAttribute('min',1);\n\n\
    myInput.setAttribute('max',20);\n\nmyInput.value = 5;\n\nconst holder = [];\n\n\
    const main2 = makeElement(document.body,'div');\n\nconst btnReport = makeElement(main2,'button');\n\
    \nbtnReport.textContent = 'Generate Report';\n\nbtnReport.onclick = ()=>{\n\n\
    \  console.log(holder);\n\n const report = makeElement(main2,'div');\n\n  main2.prepend(report);\n\
    \n let html = 'New Report';\n\n  holder.forEach((ele,ind)=>{\n\nhtml += `<div>${ind+1}.\
    \ = ${ele.trackingVal}</div>`;\n\n  })\n\nhtml += '<hr>';\n\n  report.innerHTML\
    \ = html\n\n}\n\nbtn.onclick = ()=>{\n\n for(let i=0;i<myInput.value;i++){\n\n\
    \      maker(main);\n\n  }\n\n}\n\nfunction  maker(parent){\n\n const div = makeElement(parent,'div');\n\
    \n  div.trackingVal = 0;\n\n  holder.push(div);\n\n const div1 = makeElement(div,'div');\n\
    \n const btn1 = makeElement(div,'button');\n\n const btn2 = makeElement(div,'button');\n\
    \n const inField = makeElement(div,'input');\n\n const btn3 = makeElement(div,'button');\n\
    \n  div1.style.fontSize = '2em';\n\n  inputToNum(inField);\n\n  div1.style.display\
    \ = 'inline-block';\n\n  btn1.textContent = '-';\n\n  btn2.textContent = '+';\n\
    \n  btn3.textContent = 'Update';\n\n  btn1.style.backgroundColor = 'red';\n\n\
    \  btn2.style.backgroundColor = 'green';\n\n  btn1.style.color = 'white';\n\n\
    \  btn2.style.color = 'white';\n\n  updater(inField,div1,div.trackingVal);\n\n\
    \  btn1.onclick = ()=>{\n\n      div.trackingVal--;\n\n if(div.trackingVal <=\
    \ 0) div.trackingVal =0;\n\n      updater(inField,div1,div.trackingVal);\n\n \
    \ }\n\n  btn2.onclick = ()=>{\n\n      div.trackingVal++;\n\n      updater(inField,div1,div.trackingVal);\n\
    \n  }\n\n  btn3.onclick = ()=>{\n\n      div.trackingVal = inField.value;\n\n\
    \ if(div.trackingVal <= 0) div.trackingVal =0;\n\n      updater(inField,div1,div.trackingVal);\n\
    \n  }\n}\n\nfunction  updater(inputEle,txtEle,num){\n\n  inputEle.value = num;\n\
    \n  txtEle.innerHTML = ` ${num} : `;\n\n}\n\nfunction  inputToNum(ele){\n\n  ele.setAttribute('type','number');\n\
    \n  ele.setAttribute('min',0);\n\n  ele.setAttribute('max',10000);\n\n  ele.value\
    \ = 0;\n\n}\n\nfunction  makeElement(parent,eleType){\n\n const ele = document.createElement(eleType);\n\
    \n return parent.appendChild(ele);\n\n}\n```\n\n# Random Words Maker with JavaScript\
    \ String Methods\n\nThis exercise will create a placeholder random word generator.\
    \ There will be an input for the number of words to create and a button to add\
    \ them to the page. The coding will focus on JavaScript String methods and how\
    \ we can update strings, get a random letter from a string and how we can use\
    \ `random` to randomize the content that is being output. Also, will be using\
    \ `Math` in order to add random.\n\nString methods used in this: `toUpperCase()`,\
    \ `slice()`, `substring()`, `trim()`.\n\nExercise:\n\n1. Select the `main`, `input`,\
    \ and `button`.\n2. Add an `onclick` event to the `button`.\n3. Call a function\
    \ `makeWords()` that passes the `input` value.\n4. Use a loop to create the specified\
    \ number of words.\n5. Inside the loop, determine a random word length.\n6. Use\
    \ `random` to decide if a letter is a vowel or a consonant.\n7. If it's the first\
    \ word, capitalize it.\n8. Add a period at the end of the sentence.\n9. Display\
    \ the completed string in the `output` element.\n"
  raw: "5.  Add a button to generate a report of the clicker values.  When the button\
    \ is clicked, loop through the holding array, and add to the report the value\
    \ of the clicker element with how many times it's been clicked.\n\n6.  On the\
    \ button beside the input field, get the input value and create the number of\
    \ clickers in the input value.  Create a separate function to generate the clicker.\n\
    \n7.  In the clicker maker function, create a main element container.  Add a trackingValue\
    \ property to the element, setting the value to 0.  Add the new element into the\
    \ holder array.\n\n8.  Create a div to hold the clicked value, a button to decrease,\
    \ a button to increase and an input with a button to save the value from the input\
    \ to the element clicked value.\n\n9.  Apply styling to the elements, create a\
    \ function to add the attributes to each input field.\n\n10.  Create a function\
    \ that will update the click values, using arguments for the input element, the\
    \ text output element, and the value of the clicker.  Call it updater().\n\n11.\
    \  Add the event listeners to the clicker buttons, to increase and decrease. \
    \ Send the values to the updater() function.\n\n12.  The 3rd button should take\
    \ the value from the input and apply that value to the click value when pressed.\n\
    \nconst main = document.querySelector('div');\n\nconsole.log(main);\n\nmain.customValues\
    \ = 1000;\n\nconst myInput = makeElement(document.body,'input');\n\nconst btn\
    \ = makeElement(document.body,'button')\n\nbtn.textContent = 'Make Clickers';\n\
    \nmyInput.setAttribute('type','number');\n\nmyInput.setAttribute('min',1);\n\n\
    myInput.setAttribute('max',20);\n\nmyInput.value = 5;\n\nconst holder = [];\n\n\
    const main2 = makeElement(document.body,'div');\n\nconst btnReport = makeElement(main2,'button');\n\
    \nbtnReport.textContent = 'Generate Report';\n\nbtnReport.onclick = ()=>{\n\n\
      console.log(holder);\n\n const report = makeElement(main2,'div');\n\n  main2.prepend(report);\n\
    \n let html = 'New Report';\n\n  holder.forEach((ele,ind)=>{\n\nhtml += `<div>${ind+1}.\
    \ = ${ele.trackingVal}</div>`;\n\n  })\n\nhtml += '<hr>';\n\n  report.innerHTML\
    \ = html\n\n}\n\nbtn.onclick = ()=>{\n\n for(let i=0;i<myInput.value;i++){\n\n\
          maker(main);\n\n  }\n\n}\n\nfunction  maker(parent){\n\n const div = makeElement(parent,'div');\n\
    \n  div.trackingVal = 0;\n\n  holder.push(div);\n\n const div1 = makeElement(div,'div');\n\
    \n const btn1 = makeElement(div,'button');\n\n const btn2 = makeElement(div,'button');\n\
    \n const inField = makeElement(div,'input');\n\n const btn3 = makeElement(div,'button');\n\
    \n  div1.style.fontSize = '2em';\n\n  inputToNum(inField);\n\n  div1.style.display\
    \ = 'inline-block';\n\n  btn1.textContent = '-';\n\n  btn2.textContent = '+';\n\
    \n  btn3.textContent = 'Update';\n\n  btn1.style.backgroundColor = 'red';\n\n\
      btn2.style.backgroundColor = 'green';\n\n  btn1.style.color = 'white';\n\n \
    \ btn2.style.color = 'white';\n\n  updater(inField,div1,div.trackingVal);\n\n\
      btn1.onclick = ()=>{\n\n      div.trackingVal--;\n\n if(div.trackingVal <= 0)\
    \ div.trackingVal =0;\n\n      updater(inField,div1,div.trackingVal);\n\n  }\n\
    \n  btn2.onclick = ()=>{\n\n      div.trackingVal++;\n\n      updater(inField,div1,div.trackingVal);\n\
    \n  }\n\n  btn3.onclick = ()=>{\n\n      div.trackingVal = inField.value;\n\n\
    \ if(div.trackingVal <= 0) div.trackingVal =0;\n\n      updater(inField,div1,div.trackingVal);\n\
    \n  }\n\n}\n\nfunction  updater(inputEle,txtEle,num){\n\n  inputEle.value = num;\n\
    \n  txtEle.innerHTML = ` ${num} : `;\n\n}\n\nfunction  inputToNum(ele){\n\n  ele.setAttribute('type','number');\n\
    \n  ele.setAttribute('min',0);\n\n  ele.setAttribute('max',10000);\n\n  ele.value\
    \ = 0;\n\n}\n\nfunction  makeElement(parent,eleType){\n\n const ele = document.createElement(eleType);\n\
    \n return parent.appendChild(ele);\n\n}\n\n# Random Words Maker with JavaScript\
    \ String Methods\n\nThis exercise will create a placeholder random word generator. \
    \ There will be an input for the number of words to create and a button to add\
    \ them to the page.  The coding will focus on JavaScript String methods and how\
    \ we can update strings, get a random letter from a string and how we can use\
    \ random to randomize the content that is being output.  Also, will be using Math\
    \ in order to add random content and structure the output to look like proper\
    \ sentences.\n\nString methods used in this lesson include, toUpperCase(), slice(),\
    \ trim(), substring()\n\nDOM elements will be created with JavaScript code, including\
    \ how to create and select elements.  How to add event listeners to the element.\
    \ document.createElement() document.querySelector(). Update the page elements\
    \ with append() and prepend()\n\n![](Images/image00468.jpeg)\n\nExercise:\n\n\
    1.  Select a main page element, create an input and button element.  Add the new\
    \ elements into the HTML page.\n\n2.  Add two strings, one containing a vowel\
    \ and the other common letters to use.\n\n3.  Add an onclick event to the button,\
    \ once clicked invokes a function called makeWords() that passes the number of\
    \ words to create using the input value.  Also, as one of the parameters include\
    \ the element where the new text will be placed.\n\n4.  Create a main loop, that\
    \ will loop the code for the number of words needed.  Each iteration will create\
    \ a new word to the string.\n\n5.  Create a random number for the letters of the\
    \ word to be created.  Then nest a new loop within the main loop, iterating the\
    \ number of times randomly selected.\n\n6.  Create a random value that will randomize\
    \ if a vowel is needed, or if a letter.  Depending on the random result use either\
    \ the letters or the vowel strings to select the next letter.  Select the next\
    \ letter randomly and add it to the word.\n\n7.  Add a condition to check if the\
    \ word is the first one, if it is then capitalizing the first letter in the word.\n\
    \n8.  Randomize adding an end of the sentence, to capitalize the letter and add\
    \ a period.\n\n9.  Using the complete words string, create a new page element\
    \ and add the textContent value to the string of the generated words.  Prepend\
    \ the new element in the container.\n\nconst main = document.querySelector('div');\n\
    \nconst btn = document.createElement('button');\n\nconst myInput = document.createElement('input');\n\
    \nmyInput.value = 40;\n\nmyInput.style.display = 'block';\n\nbtn.textContent =\
    \ 'Add words';\n\nmain.append(myInput);\n\nmain.append(btn);\n\nconsole.log(main);\n\
    \nconst output = document.createElement('div');\n\nmain.append(output);\n\nbtn.onclick\
    \ = ()=>{\n\n  makeWords(output,myInput.value);\n\n}\n\nconst vowels = 'aeiou';\n\
    \nconst letters = 'abcdefghijssttnnmmmpppowcertuiyuiosdfjkkljklsfdxcvmblkjlsdjds';\n\
    \nfunction  makeWords(parent,num){\n\n let temp = '';\n\n for(let x=0;x<num;x++){\n\
    \n const wordLen = Math.floor(Math.random()*7)+2;\n\n let tempWord = '';\n\n for(let\
    \ i=0;i<wordLen;i++){\n\n const ranVowPos = Math.floor(Math.random()*4)+1;\n\n\
    \ let str =(i%ranVowPos)==0 ? vowels : letters;\n\n const val = Math.floor(Math.random()*str.length);\n\
    \n          tempWord += str.substring(val,val+1);\n\n      }\n\n if(x == 0 ){\n\
    \n          tempWord = tempWord[0].toUpperCase() + tempWord.slice(1);\n\n     \
    \ }\n\n if(Math.random() > .8){\n\n          temp = temp.trim();\n\n const capWord\
    \ = tempWord[0].toUpperCase() + tempWord.slice(1);\n\ntemp += `. ${capWord}`;\n\
    \n      }else{\n\ntemp += tempWord + ' ';\n\n      }\n\n  }\n\n const containerEle\
    \ = document.createElement('div');\n\n  containerEle.textContent = `${temp.trim()}.`;\n\
    \n  containerEle.style.padding = '10px';\n\n  containerEle.style.border = '1px\
    \ solid #ddd';\n\n  output.prepend(containerEle);\n\n}\n\n# Get Page Scroll Values\
    \ Scrollbar Exercise\n\nUse the scroll position of the scrollbar to calculate\
    \ how much of the page is above and below the current position.  The scroll tracker\
    \ will display the percentage of the page that has been scrolled and calculate\
    \ the scroll position on the view area."
