  trans: "\n\n# 使用 JavaScript 选择页面元素\n\n使用 JavaScript 的 DOM 方法可以选择 HTML 页面元素。一旦选中了元素，就可以使用代码对其属性进行操作。\n\
    \n`Document` 对象中存在一些方法，允许我们更好地选择想要用代码操作的元素。`querySelector()` 和 `querySelectorAll()`\
    \ 允许 JavaScript 从文档对象的内容中选择页面元素。\n\nJavaScript `querySelectorAll` 获取页面元素全部。使用\
    \ `querySelector` 和 `querySelectorAll` 选择匹配的页面元素。不同的选择器包括标签、id 和类（class）。选择页面元素，遍历节点列表（node\
    \ list）的内容输出并更新页面元素。\n\n##  JavaScript 编程练习：\n\n1. 更新你的 HTML 以包含 2 个 `div` 和一个\
    \ `input` 元素。\n2. 使用 `querySelector()` 和 `querySelectorAll()` 选择所有页面元素并将页面元素对象赋值给变量。\n\
    3. 更新第一个元素的文本内容。\n4. 给 `input` 元素赋值一个值 `myInput.value`。\n5. 更新第二个 `div` 的某些样式属性，使其看起来更像一个按钮。\n\
    6. 为按钮添加事件监听器，将一个函数分配给元素的点击事件 `onclick`。\n7. 在 `click` 函数内部获取输入框的值，将第一个 `div`\
    \ 的 `textContent` 更新为输入字段的值。给输入字段的值赋值一个空字符串。\n\n```html\n<div id=\"one\" class=\"\
    red\">Hello World 1</div>\n<input type=\"text\">\n<div>Hello World 2</div>\n```\n\
    \n```javascript\nconst ele1 = document.querySelector('div');\nconst ele2 = document.querySelector('#one');\n\
    const ele3 = document.querySelector('.red');\n\nele1.textContent = 'Laurence Svekis';\n\
    \nconst eles = document.querySelectorAll('div');\n\nconsole.log(ele1);\nconsole.log(ele2);\n\
    console.log(ele3);\nconsole.dir(eles);\n\neles[0].textContent = 'Hello World';\n\
    console.log(ele1.textContent);\n\nconst myInput = document.querySelector('input');\n\
    console.log(myInput.value);\nmyInput.value = 'Laurence';\n\neles[1].textContent\
    \ = 'Click Me';\neles[1].style.border = '1px solid black';\neles[1].style.width\
    \ = '200px';\neles[1].style.textAlign = 'center';\neles[1].onclick = clicker;\n\
    \nfunction clicker(){\n  let temp = myInput.value;\n  ele2.textContent = temp;\n\
    \  myInput.value = '';\n}\n```\n\n# 使用条件应用逻辑\n\n逻辑条件可以根据条件当前返回的布尔（Boolean）结果来创建不同的响应。根据语句中条件的数量，可以使用各种\
    \ JavaScript 语法，如 `if` 语句、`Switch` 语句或三元运算符。所有这些都可以用于返回依赖于所检查结果的响应。\n\n条件可以在代码中使用，以应用逻辑，并根据条件的结果运行不同的操作。根据\
    \ `True`（真）或 `False`（假）的值，可以运行不同的代码块。\n\n`if` 语句将检查条件，如果为真则运行指定的代码。如果为假则不运行代码。`Else`\
    \ 在条件不成立时提供另一种选择，那么 `else` 语句允许我们在之前的所有条件都不真的情况下，在假时运行代码块。你还可以使用 `else if` 语句来检查另一个条件，如果之前的条件返回假，则运行另一个独立的代码块。\n\
    \n使用 `switch` 语句允许我们指定多个替代方案，检查是否有任何条件匹配，并允许执行相应的代码。\n\nJavaScript 代码可以使用比较运算符（Comparison\
    \ Operators）来检查语句是真是假。要检查多个条件，你可以应用逻辑运算符（Logical Operators）来检查条件之间的逻辑关系。下面的示例将展示如何使用逻辑运算符以及在真或假的各种组合下可以预期的结果。\n\
    \n##  JavaScript 编程练习：\n\n1. 选择你想要使用的页面元素并为它们分配变量。\n2. 为 `counter` 创建一个全局值 `0`。\n\
    3. 一旦按钮被点击，将 `counter` 加 1。\n4. 检查 `counter` 的值是否小于 2，如果是，则将样式颜色更新为红色。\n5. 在条件中添加一个\
    \ `else if`，检查 `counter` 的值是否小于 4，如果是，则将输出元素的颜色更新为绿色。\n6. 在条件中添加一个 `else if`，检查\
    \ `counter` 的值是否小于 6，如果是，则将输出元素的颜色更新为紫色。\n7. 使用 `else if` 在所有条件都不真时，将元素的样式更新为蓝色。\n\
    8. 创建一个 `switch` 来检查 `counter` 的值。为你想要跟踪的值创建 `cases`，根据不同的 `case` 使用不同的字符串值更新输出区域文本。尝试带有\
    \ `break` 关键字和不带 `break` 关键字的 `switch`。\n9. 在 `switch` 语句中添加一个 `default`。\n\n\
    ```html\n<!doctype html>\n<html>\n<head>\n  <title>JavaScript</title>\n</head>\n\
    <body>\n<div>Hello World 1</div>\n<input type=\"text\">\n<button type=\"button\"\
    >Click</button>\n<script src=\"dom3.js\"></script>\n</body>\n</html>\n```\n\n\
    ```javascript\nconst output = document.querySelector('div');\nconst myInput =\
    \ document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    myInput.value = 'Laurence';\nlet counter = 0;\n\nbtn.onclick = () => {\n  counter++;\n\
    \  if (counter < 2) {\n    output.style.color = 'red';\n  } else if (counter <\
    \ 4) {\n    output.style.color = 'green';\n  } else if (counter < 6) {\n    output.style.color\
    \ = 'purple';\n  } else {\n    output.style.color = 'blue';\n  }\n\n  switch (counter)\
    \ {\n    case 1:\n      output.innerText = 'Case 1';\n      break;\n    case 2:\n\
    \      output.innerText = 'Case 2';\n      break;\n    case 3:\n      output.innerText\
    \ = 'Case 3';\n      break;\n    default:\n      output.innerText = 'Default';\n\
    \  }\n};\n```\n\n# JavaScript 运算符\n\nJavaScript 运算符可以进行算术运算、给变量赋值、拼接字符串以及对值进行比较。JavaScript\
    \ 还有方法可以转换数据类型以确保预期结果。当字符串相加时，结果是字符串。JavaScript 有多种方法可以帮助这些操作顺利进行。\n\n## JavaScript\
    \ 编程练习：\n\n1. 获取输入字段的值。使用 `Number()` 方法将值转换为数字。\n2. 使用 `isNaN()` 检查输入的结果是否为数字。\n\
    3. 使用模（modulus）检查输入是奇数还是偶数。如果有余数，则为奇数，否则为偶数。\n4. 对输入值进行数学计算，并将结果返回给用户的输出字段。\n\n\
    ```javascript\nconst output = document.querySelector('div');\nconst myInput =\
    \ document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    let a, b = 100;\nlet c = a * b / 100;\nlet d = 504 % 50;\n\na = a + 1;\na++;\n\
    a--;\nconsole.log(a);\nconsole.log(d);\n\nlet e = 10;\ne *= a;\nconsole.log(e);\n\
    \nconsole.clear();\nconsole.log('5' == 5);\nconsole.log('5' === 5);\nconsole.log('5'\
    \ != 6);\nconsole.log('5' !== 5);\nconsole.log(10 <= 10);\nconsole.log(('5' ==\
    \ 5) && true);\nconsole.log(('5' == 5) && false);\nconsole.log(('5' != 5) || true);\n\
    console.log(('5' == 5) || false);\n\nbtn.onclick = () => {\n  let val = Number(myInput.value);\n\
    \  console.log(typeof val);\n  console.log(isNaN(val));\n  let html = `<div>Results\
    \ ${val}</div>`;\n  if (!isNaN(val)) {\n    html += `<div>Was a number</div>`;\n\
    \  } else {\n    html += `<div>NOT a number</div>`;\n  }\n  if (val % 2) {\n \
    \   html += `<div>Odd number</div>`;\n  } else {\n    html += `<div>Even number</div>`;\n\
    \  }\n  html += `<div>${val * 50} = ${val} X 50</div>`;\n  html += `<div>${val\
    \ / 10} = ${val} / 10</div>`;\n  output.innerHTML = html;\n};\n```\n\n"
- fmt: "\n```javascript\nhtml += `<div>${val **val} = ${val} X ${val}</div>`;\n\n\
    output.innerHTML = html;\n\n}\n```\n\n# Conditions with the Ternary operator\n\
    \nTernary Operator JavaScript provides a way to create a short one statement conditions\
    \ with the response back of values dependent on the Boolean result of the condition.\n\
    \n## Lesson JavaScript Coding Exercise:\n\n1. Get the value entered in the input\
    \ field, check if it's a number. If it is not a number, then in the condition\
    \ update the output text with a message for the user. Change the style background\
    \ and color of the output element.\n2. If it is a number using the ternary operator\
    \ create a output message to the user depending on the value that was entered\
    \ into the input field.\n3. Check if the number entered is larger than 19 or equal\
    \ to 19, and if it is then showing a message that the person is allowed in. Otherwise\
    \ deny entry for the person.\n\n```javascript\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = clickedMe;\n\nlet val = (true) ? 'true' : 'false';\n\nval = (true\
    \ && false) ? 'true' : 'false';\n\nval = (10 > 5) ? 'true' : 'false';\n\nval =\
    \ (isNaN('test')) ? 'true' : 'false';\n\noutput.textContent = 'How old are you?';\n\
    \nbtn.textContent = 'Entry Checker';\n\nconsole.log(val);\n\nfunction clickedMe(){\n\
    \n  const myAge = myInput.value;\n\n  if(!isNaN(myAge)){\n\n      console.log('ready');\n\
    \      output.style.backgroundColor = 'white';\n      output.style.color = 'black';\n\
    \      output.textContent = 'Please enter your Age?';\n\n     const message =\
    \ myAge >= 19 ? `${myAge} is allowed to enter.` : `${myAge} is not old enough!`;\n\
    \n      output.innerHTML += `<div>${message}</div>`;\n\n      myInput.value =\
    \ '';\n\n  }else{\n      myInput.value = '';\n      output.style.backgroundColor\
    \ = 'red';\n      output.style.color = 'white';\n      output.textContent = 'Please\
    \ enter a number for your Age!';\n  }\n}\n```\n\n# JavaScript Math Random\n\n\
    Random values can be used to generate more engaging interactions, use JavaScript\
    \ to get Random Numbers. Random values are excellent for games, as the user is\
    \ provided a more challenging experience.\n\nThe `Math` object contains various\
    \ methods that can be used for math functionality, in addition it also contains\
    \ the `random` method that creates random values in JavaScript. The `Math.random()`\
    \ method returns a floating-point number in the range 0 (inclusive of 0) to less\
    \ than 1 (not including 1). The random value can then be multiplied and rounded\
    \ to the nearest whole number to include the randomized range of values desired\
    \ by the developer.\n\nRandom values are ideal for games and to create unique\
    \ custom experiences for web users.\n\n## Random Number Interactive Guessing Game\
    \ with JavaScript and the DOM coding exercise\n\nIn this exercise create a random\
    \ number guessing game that will provide a random range of numbers that the user\
    \ has to guess the correct number from. The application will provide the user\
    \ feedback whether the guess was too high or too low, allowing for the user to\
    \ narrow the range of the hidden number. Once the solution is found matching the\
    \ input value to the hidden number, the game starts again generating the random\
    \ number and a new range to guess. Feedback is provided to the user in the HTML\
    \ element, so that the user playing the game knows the results and what to do\
    \ next. This is a perfect example of a simple game that can be created with JavaScript\
    \ and interacting with the DOM page elements.\n\nExample of steps within the gameplay\
    \ for the player to guess the correct number. The correct number needs to be determined\
    \ by using the feedback presented by the application back to the user.\n\nStart\
    \ by asking for a number within a range.\n\n![](Images/image00444.jpeg)\n\nProvide\
    \ feedback to the player as to the hidden value, so the player can use the information\
    \ for a better guess the following round.\n\n![](Images/image00445.jpeg)\n\nProvide\
    \ feedback once again to the user, to keep engagement and move the player to the\
    \ next round.\n\n![](Images/image00446.jpeg)\n\nOnce the player guesses the correct\
    \ value of the hidden number provide the ending feedback to the player.\n\n![](Images/image00447.jpeg)\n\
    \n## Lesson JavaScript Coding Exercise:\n\n1. Select the HTML page elements as\
    \ variables within your JavaScript code.\n2. Create declare variables globally\
    \ for a `lowValue`, `highValue`, and `hiddenNumber`.\n3. Create a function to\
    \ start the game called `starter()`.\n4. Create a function to generate random\
    \ numbers using `min` and `max` values are parameters within the function. Wrap\
    \ the `Math.random()` within the `Math.floor()` to round down to the nearest whole\
    \ number. `Math.floor(Math.random())`. Multiply the random value by the max minus\
    \ the minimum, to include the max value add plus 1 to the multiplied number. Within\
    \ the result add 1 to increment from 0 to 1.\n5. Within the `starter()` function,\
    \ generate random numbers.\n6. Update the HTML to provide instructions.\n7. For\
    \ the input element, set attributes to `min` and `max`.\n8. Add an event listener\
    \ for `onclick` to the button.\n9. Within `clickedMe()` function, get the input\
    \ value.\n10. Check if the number matches the input value.\n11. If the guess is\
    \ incorrect, update the value.\n12. The game should continue until the correct\
    \ number is guessed.\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript</title>\n\
    </head>\n<body>\n<div>Hello World</div>\n<input type=\"text\">\n<button type=\"\
    button\">Click</button>\n<script src=\"app.js\"></script>\n</body>\n</html>\n\
    ```\n\n```javascript\nconst output = document.querySelector('div');\nconst myInput\
    \ = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nlet lowValue = 1;\nlet highValue = 10;\nlet hiddenNumber = 0;\n\noutput.innerHTML\
    \ = '';\n\nfunction starter(){\n  myInput.value = '';\n  lowValue = getRan(0,5);\n\
    \  highValue = getRan(lowValue,50);\n  hiddenNumber = getRan(lowValue,highValue);\n\
    \  output.innerHTML += `<div>Guess a number between ${lowValue} and ${highValue}</div>`;\n\
    \  btn.onclick = clickedMe;\n  myInput.setAttribute('type','number');\n  myInput.setAttribute('min',lowValue);\n\
    \  myInput.setAttribute('max',highValue);\n  btn.textContent = 'Enter Guess';\n\
    }\n\nfunction clickedMe(){\n  const valInput = myInput.value;\n  if(valInput ==\
    \ hiddenNumber){\n    console.log('correct');\n    output.innerHTML = `<div>Correct\
    \ it was ${hiddenNumber}</div>`;\n    starter();\n  } else {\n    let message;\n\
    \    if(valInput < hiddenNumber){\n      message = `${valInput} was wrong Higher!`;\n\
    \      lowValue = valInput;\n    } else {\n      message = `${valInput} was wrong\
    \ Lower!`;\n      highValue = valInput;\n    }\n    output.innerHTML = `<div>${message}</div>`;\n\
    \    console.log(hiddenNumber);\n    myInput.value = '';\n    output.innerHTML\
    \ += `<div>Guess Again between ${lowValue} and ${highValue}!</div>`;\n  }\n}\n\
    \nfunction getRan(min,max){\n  return Math.floor(Math.random() * (max-min+1) +\
    \ min);\n}\n```\n\n# JavaScript Looping Blocks of Code\n"
