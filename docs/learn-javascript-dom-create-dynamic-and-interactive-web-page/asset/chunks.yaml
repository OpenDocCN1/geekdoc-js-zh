    \n if(index==0) slide.classList.add('active');\n\n const div  = document.createElement('div');\n\
    \n       div.innerHTML = item.html;\n\n       slide.append(title);\n\n       slide.append(div);\n\
    \n       slide.style.backgroundColor = item.back;\n\n       slide.style.color\
