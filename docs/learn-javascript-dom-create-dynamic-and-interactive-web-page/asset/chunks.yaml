  trans: "\n\n在轮播图中显示的内容并不包含在 JavaScript 文件中。此示例将帮助演示如何分离数据，从而可以在不更新代码的情况下进行更新。代码中的代码逻辑应该独立于数据运行。更改\
    \ JSON 文件数据将改变 HTML 网页上的输出，而不会破坏 JavaScript 代码。JSON 文件数据具有四个属性（`\"title\": \"\
    slide 1\", \"html\": \"<h1>Laurence</h1>\", \"back\": \"purple\", \"color\": \"\
    white\"`），添加或删除属性将需要更新 JavaScript 代码。数组中的 JSON 数据项应都具有相同的属性名称和值；JSON 内部结构非常重要，以便能够正确使用\
    \ JSON 数据包含的内容。\n\n使用 JSON 数据，在 DOM 内容加载时加载 json 文件。使用 JavaScript 代码动态创建页面幻灯片。添加交互功能，通过监听按钮点击在幻灯片之间导航。\n\
    \n# JSON 幻灯片：使用 JavaScript 导航练习\n\n1. 在 JavaScript 中将主滑器元素选择为名为 `slider` 的变量。\n\
    2. 创建一个在 DOM 内容加载后被调用的函数。将函数命名为 `adder()`。\n3. 在 `adder()` 中，使用来自 JSON 文件的数据创建幻灯片，为幻灯片元素应用文本标题、`html`\
    \ 内容和样式。将它们添加到页面。\n4. 如果是数据中的第一项，则仅为第一个项添加 `active` 类。\n5. 为按钮添加事件监听器，点击点击时检查它是否包含\
    \ `next` 类，创建一个名为 `mover()` 的函数来处理结果。\n6. 获取带有 `active` 类的当前元素。通过遍历获取当前元素的下一个兄弟元素，如果不存在下一个元素，则选择父元素\
    \ `slider` 的第一个子元素。\n7. 获取上一个元素，如果为 `null` 则选择父元素 `slider` 的最后一个子元素。\n8. 移除当前元素的\
    \ `active` 类，为新元素（上一个或下一个）添加 `active` 类。\n\n## HTML 和 CSS\n\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n <title>JavaScript Course</title>\n <style>\n * {\n  box-sizing:\
    \ border-box;\n }\n .main {\n  width: 90vw;\n  margin: auto;\n  background-color:\
    \ black;\n  position: relative;\n  height: 300px;\n  overflow: hidden;\n  color:white;\n\
    \ }\n .slide {\n  text-align:center;\n  position: absolute;\n  top: 0;\n  left:\
    \ 0;\n  width: 100%;\n  height: 100%;\n  background-color: blue;\n  opacity: 0;\n\
    \ }\n .slide.active {\n  opacity: 1;\n }\n .btn {\n  position: absolute;\n  bottom:\
    \ 2rem;\n  padding: 10px;\n  background-color: rgba(0, 0, 0, 0.5);\n  border-radius:\
    \ 10px;\n  font-size: 0.9em;\n  color: white;\n  cursor:pointer;\n }\n .btn:hover{\n\
    \  background-color: rgb(0, 0, 0);\n }\n .next {\n  right: 3rem;\n }\n .prev {\n\
    \  left: 3rem;\n }\n </style>\n</head>\n<body>\n <div class=\"main\">\n  <div>\n\
    \   <div class=\"slider\">\n   </div>\n   <div class=\"prev btn\">< Prev</</div>\n\
    \   <div class=\"next btn\">Next ></</div>\n  </div>\n</div>\n <script src=\"\
    app5.js\"></script>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n\n```javascript\n\
    const slider = document.querySelector('.slider');\nconst btns = document.querySelectorAll('.btn');\n\
    \nwindow.addEventListener('DOMContentLoaded',init);\n\nbtns.forEach(btn =>{\n\
    \  btn.onclick = ()=>{\n      console.log('clicked');\n      mover(btn.classList.contains('next'));\n\
    \  }\n})\n\nfunction mover(dir){\n const cur = document.querySelector('.active');\n\
    \  cur.classList.remove('active');\n const nex = cur.nextElementSibling || slider.firstElementChild;\n\
    \ const pre = cur.previousElementSibling || slider.lastElementChild;\n const newActive\
    \ = (dir) ? nex : pre;\n\n  newActive.classList.add('active');\n}\n\nfunction\
    \ init(){\n  fetch('app5.json')\n      .then(response => response.json())\n  \
    \    .then(data =>{\n          adder(data);\n      })\n}\n\nfunction adder(data){\n\
    \  data.forEach((item,index)=>{\n    const slide = document.createElement('div');\n\
    \    slide.classList.add('slide');\n    if(index === 0) slide.classList.add('active');\n\
    \    slide.innerHTML = item.html;\n    slide.style.backgroundColor = item.back;\n\
    \    slide.style.color = item.color;\n    slider.appendChild(slide);\n  })\n}\n\
    ```\n\n## JSON 数据\n\n```json\n[\n  {\n    \"title\": \"slide 1\",\n    \"html\"\
    : \"<h1>Laurence</h1>\",\n    \"back\": \"purple\",\n    \"color\": \"white\"\n\
    \  },\n  {\n    \"title\": \"slide 2\",\n    \"html\": \"<h1>Sis</h1>\",\n   \
    \ \"back\": \"blue\",\n    \"color\": \"white\"\n  },\n  {\n    \"title\": \"\
    slide 3\",\n    \"html\": \"<h1>Exercise</h1>\",\n    \"back\": \"yellow\",\n\
    \    \"color\": \"black\"\n  },\n  {\n    \"title\": \"slide 4\",\n    \"html\"\
    : \"<h1>Sis</h1>\",\n    \"back\": \"blue\",\n    \"color\": \"white\"\n  }\n\
    ]\n```\n\n## 使用 fetch 的 JSON 数据\n\n### AJAX 请求示例\n\n1. 创建按钮以发送请求。在页面上设置一个元素来显示输出。\n\
    2. 点击第一个按钮时，连接到 json 文件并使用 fetch 返回内容。将文件的结果输出到页面。\n\n### 以下是 JavaScript 代码：\n\
    \n```javascript\nconst slider = document.querySelector('.slider');\nconst btns\
    \ = document.querySelectorAll('.btn');\n\nwindow.addEventListener('DOMContentLoaded',init);\n\
    \nbtns.forEach(btn =>{\n  btn.onclick = ()=>{\n      console.log('clicked');\n\
    \      mover(btn.classList.contains('next'));\n  }\n})\n\nfunction mover(dir){\n\
    \ const cur = document.querySelector('.active');\n  cur.classList.remove('active');\n\
    \ const nex = cur.nextElementSibling || slider.firstElementChild;\n const pre\
    \ = cur.previousElementSibling || slider.lastElementChild;\n const newActive =\
    \ (dir) ? nex : pre;\n\n  newActive.classList.add('active');\n}\n\nfunction init(){\n\
    \  fetch('app5.json')\n      .then(response => response.json())\n      .then(data\
    \ =>{\n          adder(data);\n      })\n}\n\nfunction adder(data){\n  data.forEach((item,index)=>{\n\
    \    const slide = document.createElement('div');\n    slide.classList.add('slide');\n\
    \    if(index === 0) slide.classList.add('active');\n    slide.innerHTML = item.html;\n\
    \    slide.style.backgroundColor = item.back;\n    slide.style.color = item.color;\n\
    \    slider.appendChild(slide);\n  })\n}\n```\n\n"
- fmt: "\n```javascript\nPromise.all(urls.map(url =>\n    fetch(url).then(res => res.json())\n\
    \  )).then((data) => {\n    let html = '';\n    data.forEach((val, ind) => {\n\
    \      console.log(val);\n      html += `<div>${ind+1}. ${val.first} ${val.last}</div>`;\n\
    \    })\n    output.innerHTML = html;\n  });\n}\n```\n\n```javascript\nfunction\
    \  fetchAllUrls2() {\n  Promise.all([\n      fetch(urls[0]).then(resp => resp.json()),\n\
    \      fetch(urls[1]).then(resp => resp.json()),\n      fetch(urls[2]).then(resp\
    \ => resp.json()),\n  ]).then(console.log);\n}\n```\n\n```javascript\nfunction\
    \  fetchNow() {\n  fetch(urls[1])\n    .then(response => response.json())\n  \
    \  .then(data => {\n      console.log(data);\n      output.textContent = `${data.first}\
    \ ${data.last}`;\n    })\n    .catch(error => console.log(error));\n}\n```\n\n\
    ```javascript\nasync function  fetchData() {\n  let rep = await fetch(urls[0]);\n\
    \  let data = await rep.json();\n  output.textContent = `${data.first} ${data.last}`;\n\
    }\n```\n\n### JSON #1\n```json\n{\n \"first\" : \"Laurence\",\n \"last\" : \"\
    svekis\"\n}\n```\n\n### JSON #2\n```json\n{\n \"first\" : \"Jack\",\n \"last\"\
    \ : \"Doe\"\n}\n```\n\n### JSON #3\n```json\n{\n \"first\" : \"Kim\",\n \"last\"\
    \ : \"Smith\"\n}\n```\n\n# JavaScript DOM element Collision detection\n\nThe overlap\
    \ of elements is what can be referred to as collision detection. This is a standard\
    \ part of most games, when moving page elements to be able to detect the position\
    \ and calculate if they are overlapping.\n\nThis exercise is designed to test\
    \ and learn more about how to check for overlap of elements that move on the page.\
    \ It will demonstrate how to set up movement of page elements, and output the\
    \ values needed to calculate the collision between two-page elements.\n\n![](Images/image00484.jpeg)\n\
    \nMoving elements on the page can be done by tracking the key presses from the\
    \ user. Creating an object that will store the `keydown` and `keyup` Boolean values\
    \ of specific keys, can then be used within the animation frame to move the elements\
    \ depending on the Boolean values within the key object. If the key is pressed\
    \ down the object will have a `true` value, which can then be used to determine\
    \ which keys are being pressed down and apply the movement accordingly.\n\nBy\
    \ creating an interactive interface that can move elements, track the current\
    \ `X` and `Y` axis value in pixels and the element `Height` and `Width` we can\
    \ then see the values when the overlap occurs. This will also allow us to visually\
    \ see the point of connection on either the Horizonal axis or the Vertical axis.\
    \ See the calculation and collision formula in action with real-time numbers and\
    \ values of the elements.\n\n### Set up movement of page elements and track the\
    \ position exercise:\n\n1. Create a function that allows for the creation of page\
    \ elements as we can then dynamically add elements to the page as needed. Give\
    \ the function a name of `adder()` to get the parent element that the new element\
    \ will be appended to. Create the element using the string value of the element\
    \ tag. Add the inner HTML content for the element and add a class using the string\
    \ value.\n```javascript\nfunction adder(parent,t,html,c){ const ele = document.createElement(t);\
    \  ele.innerHTML = html;    ele.classList.add(c);  return parent.appendChild(ele);\
    \ }\n```\n\n2. Create four-page elements, 2 boxes that will be moved, and 2 areas\
    \ to output the box coordinates and dimensions.\n\n3. Create a global game object\
    \ that can track the animation frame, contains the `x,y` (horizontal,vertical)\
    \ position of each box, and that contains the `h,w` (height and width) of each\
    \ box. These values then can be used to update the position.\n\n4. Set up an object\
    \ named `keyz` to track which keyboard keys will be used for element movement.\
    \ Add 8 key code names as property names and set the values to `false`. This will\
    \ be updated once the key is pressed.\n\n5. ```javascript\nconst keyz = {   ArrowLeft:false,\
    \ ArrowRight:false, ArrowUp:false, ArrowDown:false,   KeyA:false, KeyW:false,\
    \ KeyS:false, KeyZ:false, };\n```\n\n6. Add event listeners on the `document`\
    \ that listen for `keydown` and `keyup` events. If the keys from the `keyz` object\
    \ pressed match the object property name, set the value to `true` on press down\
    \ and `false` on up. This can now be used for the element movement.\n\n7. Create\
    \ and Launch the `mover()` function which will handle page movement on key presses.\n\
    \n8. Within `mover()` function add conditions to check which keys are `true`,\
    \ update `game` object `x,y` for box accordingly. Also apply a condition to check\
    \ before the movement is allowed that the element is within the boundaries of\
    \ `main` container object.\n\n9. Update `style` values of `left` and `top` for\
    \ each box with the new `game` `x,y` values for each.\n\n10. Output the `x,y,h,w`\
    \ of each element to the page as they move; these values should change with the\
    \ new `x,y` coordinates of the element. This will be used to calculate the collision\
    \ of the elements.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript\
    \ Course</title>\n <style>\n .container {\n position: relative;\n background-color:\
    \ #ddd;\n width: 90vw;\n margin: auto;\n }\n .box {\n position: absolute;\n width:\
    \ 50px;\n height: 50px;\n left: 0;\n top: 0px;\n line-align: center;\n color:\
    \ white;\n }\n .info {\n background-color: white;\n padding: 5px;\n text-align:\
    \ center;\n font-size:1.4em;\n color: white;\n }\n .info div {\n padding: 10px;\n\
    \ }\n .game {\n position: relative;\n min-height: 300px;\n }\n </style>\n</head>\n\
    <body>\n <div class=\"container\"></div>\n <script src=\"app.js\"></script>\n\
    </body>\n</html>\n```\n\n```javascript\nconst main = document.querySelector('.container');\n\
    const message = adder(main, 'div', '', 'info');\nconst output1 = adder(message,\
    \ 'div', 'Content 1', 'output');\nconst output2 = adder(message, 'div', 'Content\
    \ 2', 'output');\nconst gameBoard = adder(main, 'div', '', 'game');\nconst box1\
    \ = adder(gameBoard, 'div', 'Box 1', 'box');\nbox1.style.backgroundColor = 'red';\n\
    output1.style.backgroundColor = 'red';\nconst box2 = adder(gameBoard, 'div', 'Box\
    \ 2', 'box');\nbox2.style.backgroundColor = 'blue';\noutput2.style.backgroundColor\
    \ = 'blue';\nbox2.style.left = '100px';\nconst game = {\n x1: box1.offsetLeft,\n\
    \ y1: box1.offsetTop,\n x2: box2.offsetLeft,\n y2: box2.offsetTop,\n speed: 5,\n\
    \ w1: box1.offsetWidth,\n h1: box1.offsetHeight,\n w2: box2.offsetWidth,\n h2:\
    \ box2.offsetHeight\n};\nconst keyz = {\n ArrowLeft: false,\n ArrowRight: false,\n\
    \ ArrowUp: false,\n ArrowDown: false,\n KeyA: false,\n KeyW: false,\n KeyS: false,\n\
    \ KeyZ: false,\n};\ndocument.addEventListener('keydown', (e) => {\n  if (e.code\
    \ in keyz) {\n    keyz[e.code] = true;\n  }\n})\ndocument.addEventListener('keyup',\
    \ (e) => {\n  if (e.code in keyz) {\n    keyz[e.code] = false;\n  }\n})\nwindow.addEventListener('DOMContentLoaded',\
    \ mover);\nfunction mover() {\n  const dim = [gameBoard.offsetWidth - box1.offsetWidth,\
    \ gameBoard.offsetHeight - box1.offsetHeight];\n  // Box 1\n  if (keyz.ArrowRight\
    \ && game.x1 < dim[0]) game.x1 += game.speed;\n  if (keyz.ArrowLeft && game.x1\
    \ > 0) game.x1 -= game.speed;\n  if (keyz.ArrowDown && game.y1 < dim[1]) game.y1\
    \ += game.speed;\n  if (keyz.ArrowUp && game.y1 > 0) game.y1 -= game.speed;\n\
    \  box1.style.left = `${game.x1}px`;\n  box1.style.top = `${game.y1}px`;\n  //\
    \ Box 2\n  if (keyz.KeyS && game.x2 < dim[0]) game.x2 += game.speed;\n  if (keyz.KeyA\
    \ && game.x2 > 0) game.x2 -= game.speed;\n  if (keyz.KeyZ && game.y2 < dim[1])\
    \ game.y2 += game.speed;\n  if (keyz.KeyW && game.y2 > 0) game.y2 -= game.speed;\n\
    \  box2.style.left = `${game.x2}px`;\n  box2.style.top = `${game.y2}px`;\n  output1.innerHTML\
    \ = `Box #1 X:${game.x1} Y:${game.y1} W:${game.w1} H:${game.h1}`;\n  output2.innerHTML\
    \ = `Box #2 X:${game.x2} Y:${game.y2} W:${game.w2} H:${game.h2}`;\n  game.move\
    \ = window.requestAnimationFrame(mover);\n}\n```\n"
