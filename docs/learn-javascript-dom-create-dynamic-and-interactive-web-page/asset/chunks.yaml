    \n      ele.val = boo;\n\n      ele.style.backgroundColor = 'gold';\n\n      btn.disabled\
    \ = false;\n\n      checker(ele.val, btns[ind].val, ind);\n\n  })\n\n}\n\nfunction\
    \  checker(coinVal, btnVal, ind) {\n\n if (btnVal == coinVal) {\n\n      console.log(`${ind}\
    \ was correct`);\n\n      game.players[ind]++;\n\n} else {\n\n      console.log(`${ind}\
    \ was wrong`);\n\n  }\n\n  scoreDiv.innerHTML = `${game.players[0]} vs ${game.players[1]}\
    \ in total ${game.total} `;\n\n}\n\nThe coin game is static to 2 players, and\
    \ 2 coins.  To make it more interesting update the above code to run with a dynamic\
    \ value for the number of players.  The coins and players should be the same number\
    \ and can be tied together with the index value.  The functions in the code should\
    \ already be flexible on the number of players, you will need to update the static\
    \ element objects to add them according to the value of players desired.\n\n![](Images/image00475.jpeg)\n\
    \nExercise:\n\n1.  Create a variable for the number of players to generate, this\
    \ will also create a corresponding number of coins all with clickable buttons\
    \ to select either heads or tails.\n\n2.  Update the CSS grid and styling to accommodate\
    \ more coins on the screen.  Clear the coins and btns arrays\n\n3.  Create a function\
    \ that will make the players, looping through the number of selected players.\n\
    \n4.  Create a player element, add a coin and button in each.  Set the values\
    \ of the coin and btn to the corresponding elements.\n\n5.  Update the style properties\
    \ and push the new elements into the coins and btns arrays.\n\n6.  Add a click\
    \ event running the flipselection function\n\n7.  update the checker function\
    \ to generate and check a report for all the coin players\n\n8.  Play through\
    \ the game and debug as needed to ensure the game play still works as before. \
    \ Use the console.log as needed to output the resulting values where they were\
    \ changed.\n\nconst main = document.querySelector('.game');\n\nconst vals = ['��','��'];\n\
    \nconst numPlayers = 9;\n\nconst numsA = numPlayers > 3 ? 3 : numPlayers;\n\n\
    const game = {players : [],total:0};\n\nconst scoreDiv = maker('div',main,'score','Score');\n\
    \nconst gameArea = maker('div',main,'gameArea','');\n\ngameArea.style.setProperty(`grid-template-columns`,\
    \ `repeat(${numsA },1fr)`);\n\nconst coins = [];\n\nconst btns = [];\n\nconst\
    \ dashboard = maker('div',main,'dash','');\n\nmakerPlayers();\n\nconst btn = maker('button',dashboard,'btn','Flip\
    \ Coin');\n\nfunction  makerPlayers(){\n\n for(let i=0;i<numPlayers;i++){\n\n\
    \ const player = maker('div',gameArea,'gamer',`Coin ${i+1}`);\n\n const coin =\
    \ maker('div',player,'coin','��');\n\n      coin.val = 1;\n\n      coins.push(coin);\n\
    \n const btn1 = maker('button',player,'btn',`Heads ${vals[1]}`);\n\n      btn1.val\
    \ = 1;\n\n      btn1.style.backgroundColor = 'white';\n\n      btn1.style.color\
    \ = 'black';\n\n      btn1.onclick = flipSelection;\n\n      btns.push(btn1);\n\
    \n      game.players.push(0);\n\n  }\n\n}\n\nbtn.onclick = (e)=>{\n\n  btn.disabled\
    \ = true;\n\n  coins.forEach(ele =>{\n\n      ele.style.backgroundColor = 'black';\n\
    \n      ele.textContent = ' ';\n\n  })\n\n  setTimeout(flipper,500);\n\n}\n\n\
    function  flipSelection(e){\n\n const ele = e.target;\n\n  console.log(ele.val);\n\
    \n if(ele.val == 1){\n\n      ele.innerHTML = `Tails ${vals[0]}`;\n\n      ele.style.backgroundColor\
    \ = 'black';\n\n      ele.style.color = 'white';\n\n      ele.val = 0;\n\n  }else{\n\
    \n      ele.innerHTML = `Heads ${vals[1]}`;\n\n      ele.style.backgroundColor\
    \ = 'white';\n\n      ele.style.color = 'black';\n\n      ele.val = 1;\n\n  }\n\
    \n}\n\nfunction  maker(t,p,c,h){\n\n const el = document.createElement(t);\n\n\
      el.classList.add(c);\n\n  el.innerHTML = h;\n\n return p.appendChild(el);\n\n\
    }\n\nfunction  flipper(){\n\n  game.total++;\n\n  coins.forEach((ele,ind)=>{\n\
    \n const boo =  Math.floor(Math.random() + 0.5);\n\n      ele.innerHTML = vals[boo];\n\
    \n      console.log(btns[ind].val);\n\n      console.log(ele.val);\n\n      ele.val\
    \ = boo;\n\n      ele.style.backgroundColor = 'gold';\n\n      btn.disabled =\
    \ false;\n\n      checker(ele.val,btns[ind].val,ind);\n\n  })\n\n let html = `Total\
    \ ${game.total}<br>| `;\n\n  game.players.forEach((pla,i)=>{\n\nhtml += `P${i+1}\
    \ (${game.players[i]}) | `;\n\n  })\n\n  scoreDiv.innerHTML = html;\n\n}\n\nfunction\
    \  checker(coinVal,btnVal,ind){\n\n if( btnVal == coinVal){\n\n      console.log(`${ind}\
    \ was correct`);\n\n      game.players[ind]++;\n\n  }else{\n\n      console.log(`${ind}\
    \ was wrong`);\n\n  }\n\n}\n\n# Battle Cards Game with Arrays\n\nUsing JavaScript\
    \ to create an interactive game, this exercise will demonstrate how to build a\
    \ deck of cards.  How to track players and create the output for the game play. \
    \ Applying logic to determine which player wins and how many cards are left for\
    \ each.\n\nBy using various array methods this will enable the application to\
    \ track player status and provide output for the game. \n\n![](Images/image00476.jpeg)\n\
    \nObjective of the game is to draw the highest card in the round, the player that\
    \ draws the highest card from their deck wins.  The winner of the round collects\
    \ all the cards that were played in that round.  Ties will happen, this results\
    \ in a run-off between the winners for the pot of cards in play.  The players\
    \ who tied, will go additional rounds drawing the next card in their deck until\
    \ one player wins the round.   That player will win and collect all the cards\
    \ played in the round including the tie game cards.\n\n![](Images/image00477.jpeg)\n\
    \nThe game will be dynamic, where the number of players will be set in the game\
    \ values, and the game will work the same regardless of how many players are in\
    \ the game.  You can use the HTML and CSS as starting code or customize the CSS\
    \ and page styling as desired.  The CSS will enhance the appearance of the game,\
    \ and not designed to change the actual game play.   JavaScript will be used to\
    \ create page elements and add the various classes to those elements.  Within\
    \ the HTML we only have the one container element with a class of game.\n\nIn\
    \ this coding example we will be adding array values into other arrays and selecting\
    \ the highest value from an array of numbers.  Using the 3 dots or spread operator\
    \ will give us a way to pass the array into the argument and have the results\
    \ be treated as the array was a set of values not contained in an array.  When\
    \ three dots (…) is used it expands an array into a list.  This allows a function\
    \ to accept an indefinite number of arguments as an array providing a way to use\
    \ an array like a set of values.   The example below will outline the different\
    \ outputs in function a and function b for the arguments with and without the\
    \ 3 dots.\n\nconst arr = [1,2,4,5];\n\nfunction  a(...vals){\n\n  console.log(vals);\n\
    \n};\n\na(...arr);\n\nfunction  b(vals){\n\n  console.log(vals);\n\n};"
