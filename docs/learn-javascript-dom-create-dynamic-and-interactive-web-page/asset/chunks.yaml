- fmt: "\n## 4. Overview\n\nThen the code would be able to select a page element,\
    \ update the contents of the element with the welcome message including the value\
    \ of the input for the user's name.\n\nThe code below would be an example of what\
    \ will be covered in the upcoming lessons and will create the steps for the above\
    \ result.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript Course</title>\n\
    </head>\n<body>\n<div class=\"output\">What is you name?</div>\n<input type=\"\
    text\" name=\"userName\">\n  <button>Submit</button>\n  <script>\n    const btn\
    \ = document.querySelector('button');\n    const output = document.querySelector('.output');\n\
    \    const userVal = document.querySelector('input');\n    btn.onclick = () =>\
    \ output.innerHTML = `Welcome ${userVal.value}`;\n  </script>\n</body>\n</html>\n\
    ```\n\nThis is a simple example of steps taken to create a custom interactive\
    \ web experience for the web visitor. The code would be creating a unique experience\
    \ just for that user to enjoy and customized to the user depending on what they\
    \ provided in the input area.\n\nThe more you can customize the user's experience\
    \ on the web the more users tend to enjoy and stay on the web page. Creating great\
    \ web page experiences is what JavaScript is all about. Doing things and making\
    \ things happen within your web page elements, running in the user browser. This\
    \ is what JavaScript can do, create that one-to-one experience that web users\
    \ are looking for. Web users expect more from websites and JavaScript can help\
    \ you deliver it.\n\nYou will need a couple of tools, which you probably already\
    \ have on your computer. Of course, with a web browser to run the code, all web\
    \ browsers will be able to run JavaScript, although be aware that they might not\
    \ have all the same compatibility with newer versions of the code. Web browsers\
    \ like `Chrome` come with a built-in developer tools dashboard which is really\
    \ helpful when creating web pages. The `DevTools` dashboard helps with debugging\
    \ and being able to see what is happening behind the scenes within the code.\n\
    \n![Example of web tools open on a website.](Images/image00437.jpeg)\nExample\
    \ of web tools open on a website.\n\nThe developer console shows you information\
    \ about the currently loaded Web page and includes a console that you can use\
    \ to execute JavaScript expressions within the current webpage. Open your browser,\
    \ select the devtools and try it out, we will be using it in the lessons of this\
    \ course. With most modern browsers you can write and execute JavaScript directly\
    \ from your browser. Within the `Chrome` browser you can open `DevTools` when\
    \ you want to work with the `DOM` or `CSS`, right-click an element on the page\
    \ and select `Inspect` to jump into the `Elements` panel. Or press `Command+Option+C`\
    \ (Mac) or `Control+Shift+C` (Windows, Linux, Chrome OS). When you want to see\
    \ logged messages or run JavaScript, press `Command+Option+J` (Mac) or `Control+Shift+J`\
    \ (Windows, Linux, Chrome OS) to jump straight into the `Console` panel.\n\nYou\
    \ will also need an editor to write code. The editor which is referred to as the\
    \ `IDE` (integrated development environment) is software for building applications.\
    \ The `IDE` can be used to create coding files, save them to your computer and\
    \ edit files. One of the benefits of using an `IDE` is that the code is more readable,\
    \ and there are typically addons, styling options and several built-in tools to\
    \ help write code. Once the files are created, you can use an FTP application\
    \ to transfer the code files to your web server. You can use `Visual Studio code`\
    \ if you don’t already have an editor. First lesson will help you set up and start\
    \ coding on your computer.\n\n![Example of web editor open and creating JavaScript\
    \ code in a file named code11.js](Images/image00438.jpeg)\nExample of web editor\
    \ open and creating JavaScript code in a file named `code11.js`\n\nGetting started\
    \ with JavaScript is easy: all you need is a modern Web browser and an editor\
    \ to write the code. To start, create a file named `index.html` and open it in\
    \ a browser. This is all you need to run a file from your computer in your browser.\
    \ To add JavaScript to the html, you can either do this by either linking to a\
    \ script file with the `JS` extension or by writing the JavaScript code directly\
    \ between the `script` tags in the HTML.\n\nBy the end of the first lesson, you\
    \ should have your editor and browser setup and ready to code. You can Google\
    \ to find a list of Code editors, almost all will support frontend code. You can\
    \ download an editor at `https://code.visualstudio.com/` if needed.\n\n# Introduction\
    \ to JavaScript\n\nExplore JavaScript, see how it works and how you can write\
    \ code\n\nJavaScript is a core technology on the web alongside `HTML` `CSS`. `HTML`\
    \ elements can be accessed as objects that have properties, methods, and events.\
    \ We will be exploring this in more detail as we go through the lessons of this\
    \ book.\n\n`HTML` is the markup language used to structure and provide meaning\
    \ to the web content. `CSS` is the language used that contains the rules for styling\
    \ the `HTML` content. JavaScript is the scripting language that allows you to\
    \ create interactive and dynamic content within the web page.\n\nYou can do a\
    \ lot with JavaScript such as store values, run blocks of code, apply logic with\
    \ conditions and add events to your page. There is a lot you can do with JavaScript\
    \ and the possibilities are endless. JavaScript runs directly in the browser and\
    \ gets rendered by the browser. You can connect to HTML elements, using the `DOM`\
    \ which is a programming interface for JavaScript to add, update and remove HTML.\n\
    \nJavaScript code is single threaded, which means that only one thing can happen\
    \ at a time on the thread. Other requests get blocked until an operation completes\
    \ and then those requests will run. JavaScript code runs line by line, which is\
    \ important as you need to have declared variables before trying to use them,\
    \ and there are many other aspects which will be explored in the upcoming pages.\n\
    \nAPIs are sets of prebuilt building blocks that allow developers to connect into\
    \ and access these objects. Think of it like a control panel which JavaScript\
    \ lets you interact with. The browser also has an API, which can be accessed by\
    \ JavaScript code, and this is what allows for the interactions between the code\
    \ and the visible web content. Browser APIs allow access to the web page elements,\
    \ and other data. You can access the API and do useful programming things. The\
    \ `DOM` (Document Object Model) API allows you to manipulate the `HTML` and `CSS`.\
    \ This book will cover the `DOM` in detail, as well as methods and ways that you\
    \ can use JavaScript to select and manipulate page elements.\n\n![Code interacting\
    \ with the web page, via the browser. HTML CSS and JavaScript](Images/image00439.jpeg)\n\
    Code interacting with the web page, via the browser. `HTML` `CSS` and JavaScript\n\
    \nServer-side vs Client side means where the code is run. The Server-side code\
    \ runs on the server and not within the user's computer, or browser. Client-side\
    \ code runs directly within the user’s computer, as when it comes to JavaScript.\
    \ When the user views a web page in a browser the code is downloaded, run, and\
    \ displayed by the browser.\n"
  raw: '4.  Then the code would be able to select a page element, update the contents
    of the element with the welcome message including the value of the input for the
    user''s name.


    The code below would be an example of what will be covered in the upcoming lessons
    and will create the steps for the above result.


    <!DOCTYPE html>


    <html>


    <head>


       <title>JavaScript Course</title>


    </head>


    <body>


    <div class="output">What is you name?</div>


    <input type="text"  name="userName">


       <button>Submit</button>


       <script>


           const btn = document.querySelector(''button'');


           const output = document.querySelector(''.output'');


           const userVal = document.querySelector(''input'');


           btn.onclick = () => output.innerHTML = `Welcome ${userVal.value}`;


       </script>


    </body>


    </html>


    This is a simple example of steps taken to create a custom interactive web experience
    for the web visitor.  The code would be creating a unique experience just for
    that user to enjoy and customized to the user depending on what they provided
    in the input area.


    The more you can customize the user''s experience on the web the more users tend
    to enjoy and stay on the web page.  Creating great web page experiences is what
    JavaScript is all about.  Doing things and making things happen within your web
    page elements, running in the user browser.  This is what JavaScript can do, create
    that one-to-one experience that web users are looking for.   Web users expect
    more from websites and JavaScript can help you deliver it.


    You will need a couple of tools, which you probably already have on your computer. 
    Of course, with a web browser to run the code, all web browsers will be able to
    run JavaScript, although be aware that they might not have all the same compatibility
    with newer versions of the code.   Web browsers like Chrome come with a built-in
    developer tools dashboard which is really helpful when creating web pages. The
    DevTools dashboard helps with debugging and being able to see what is happening
    behind the scenes within the code.


    ![Example of web tools open on a website.](Images/image00437.jpeg)


    Example of web tools open on a website.


    The developer console shows you information about the currently loaded Web page
    and includes a console that you can use to execute JavaScript expressions within
    the current webpage.  Open your browser, select the devtools and try it out, we
    will be using it in the lessons of this course.  With most modern browsers you
    can write and execute JavaScript directly from your browser.  Within the Chrome
    browser you can open DevTools when you want to work with the DOM or CSS, right-click
    an element on the page and select Inspect to jump into the Elements panel. Or
    press Command+Option+C (Mac) or Control+Shift+C (Windows, Linux, Chrome OS). 
    When you want to see logged messages or run JavaScript, press Command+Option+J
    (Mac) or Control+Shift+J (Windows, Linux, Chrome OS) to jump straight into the
    Console panel.


    You will also need an editor to write code. The editor which is referred to as
    the IDE (integrated development environment) is software for building applications. 
    The IDE can be used to create coding files, save them to your computer and edit
    files.  One of the benefits of using an IDE is that the code is more readable,
    and there are typically addons, styling options and several built-in tools to
    help write code.  Once the files are created, you can use an FTP application to
    transfer the code files to your web server.  You can use Visual Studio code if
    you don’t already have an editor.  First lesson will help you set up and start
    coding on your computer.


    ![Example of web editor open and creating JavaScript code in a file named code11.js](Images/image00438.jpeg)


    Example of web editor open and creating JavaScript code in a file named code11.js


    Getting started with JavaScript is easy: all you need is a modern Web browser
    and an editor to write the code.  To start, create a file named index.html and
    open it in a browser.   This is all you need to run a file from your computer
    in your browser.  To add JavaScript to the html, you can either do this by either
    linking to a script file with the JS extension or by writing the JavaScript code
    directly between the script tags in the HTML.


    By the end of the first lesson, you should have your editor and browser setup
    and ready to code.  You can Google to find a list of Code editors, almost all
    will support frontend code.  You can download an editor at [https://code.visualstudio.com/](https://code.visualstudio.com/)
    if needed.


    # Introduction to JavaScript


    Explore JavaScript, see how it works and how you can write code


    JavaScript is a core technology on the web alongside HTML CSS.   HTML elements
    can be accessed as objects that have properties, methods, and events.  We will
    be exploring this in more detail as we go through the lessons of this book.


    HTML is the markup language used to structure and provide meaning to the web content. 
    CSS is the language used that contains the rules for styling the HTML content. 
    JavaScript is the scripting language that allows you to create interactive and
    dynamic content within the web page.


    You can do a lot with JavaScript such as store values, run blocks of code, apply
    logic with conditions and add events to your page elements.  There is a lot you
    can do with JavaScript and the possibilities are endless.  JavaScript runs directly
    in the browser and gets rendered by the browser within the HTML page.  You can
    connect to HTML elements, using the HTML DOM which is a programming interface
    for JavaScript to add, update and remove HTML elements.


    JavaScript code is single threaded, which means that only one thing can happen
    at a time on the thread.  Other requests get blocked until an operation completes
    and then those requests will run.  JavaScript code runs line by line, which is
    important as you need to have declared variables before trying to use them, and
    there are many other aspects which will be explored in the upcoming pages.


    APIs- are sets of prebuilt building blocks that allow developers to connect into
    and access these objects.   Think of it like a control panel which JavaScript
    language lets you interact with.  The browser also has an API, which can be accessed
    by JavaScript code, and this is what allows for the interactions between the code
    and the visible web content.   Browser APIs allow access to the web page elements,
    and other data.  You can access the API and do useful programming things.   The
    DOM (Document Object Model) API allows you to manipulate the HTML and CSS of the
    page.  This book will cover the DOM in detail, as well as methods and ways that
    you can use JavaScript to select and manipulate page elements.


    ![Code interacting with the web page, via the browser. HTML CSS and JavaScript](Images/image00439.jpeg)


    Code interacting with the web page, via the browser.  HTML CSS and JavaScript


    JavaScript is a lightweight interpreted programming language.  As with interpreted
    languages this means that the code is run from top to bottom and returned immediately. 
    The browser runs the code directly from the original file without having to compile
    the code.  Therefore, we can write JavaScript, HTML and CSS into an HTML file
    and have the results visible when it''s opened in a browser.


    Server-side vs Client side means where the code is run.  The Server-side code
    runs on the server and not within the user''s computer, or browser.  Client-side
    code runs directly within the user’s computer, as when it comes to JavaScript. 
    When the user views a web page in a browser the code is downloaded, run, and displayed
    by the browser.'
