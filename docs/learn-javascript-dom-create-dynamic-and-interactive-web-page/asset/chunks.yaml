  trans: "\n\n### 5. 添加一个按钮来生成点击器数值的报告。当点击该按钮时，遍历 `holding` 数组，并在报告中添加 `clicker` 元素的值及其被点击的次数。\n\
    \n### 6. 点击输入框旁的按钮，获取输入值并根据该值创建相应数量的点击器。创建一个独立的函数来生成 `clicker`。\n\n### 7. 在 `clicker`\
    \ 生成器函数中，创建一个主元素容器。为该元素添加一个 `trackingValue` 属性，并将其设置为 `0`。将新元素添加到 `holder` 数组中。\n\
    \n### 8. 创建一个 `div` 用于存储点击值，一个用于减少的按钮，一个用于增加的按钮，以及一个带有按钮的 `input`，该按钮用于将 `input`\
    \ 中的值保存到点击元素的点击值中。\n\n### 9. 为元素应用样式，并创建一个函数为每个 `input` 字段添加属性。\n\n### 10. 创建一个用于更新点击值的函数，使用\
    \ `input` 元素、文本输出元素和 `clicker` 的值作为参数。将其命名为 `updater()`。\n\n### 11. 为 `clicker`\
    \ 按钮添加点击监听器以进行增加和减少。将值发送给 `updater()` 函数。\n\n### 12. 第 3 个按钮应该从 `input` 获取值并在按下时将该值应用到点击值上。\n\
    \n```javascript\nconst main = document.querySelector('div');\n\nconsole.log(main);\n\
    \nmain.customValues = 1000;\n\nconst myInput = makeElement(document.body,'input');\n\
    \nconst btn = makeElement(document.body,'button')\n\nbtn.textContent = 'Make Clickers';\n\
    \nmyInput.setAttribute('type','number');\n\nmyInput.setAttribute('min',1);\n\n\
    myInput.setAttribute('max',20);\n\nmyInput.value = 5;\n\nconst holder = [];\n\n\
    const main2 = makeElement(document.body,'div');\n\nconst btnReport = makeElement(main2,'button');\n\
    \nbtnReport.textContent = 'Generate Report';\n\nbtnReport.onclick = ()=>{\n\n\
    \  console.log(holder);\n\n const report = makeElement(main2,'div');\n\n  main2.prepend(report);\n\
    \n let html = 'New Report';\n\n  holder.forEach((ele,ind)=>{\n\nhtml += `<div>${ind+1}.\
    \ = ${ele.trackingVal}</div>`;\n\n  })\n\nhtml += '<hr>';\n\n  report.innerHTML\
    \ = html\n\n}\n\nbtn.onclick = ()=>{\n\n for(let i=0;i<myInput.value;i++){\n\n\
    \      maker(main);\n\n  }\n\n}\n\nfunction  maker(parent){\n\n const div = makeElement(parent,'div');\n\
    \n  div.trackingVal = 0;\n\n  holder.push(div);\n\n const div1 = makeElement(div,'div');\n\
    \n const btn1 = makeElement(div,'button');\n\n const btn2 = makeElement(div,'button');\n\
    \n const inField = makeElement(div,'input');\n\n const btn3 = makeElement(div,'button');\n\
    \n  div1.style.fontSize = '2em';\n\n  inputToNum(inField);\n\n  div1.style.display\
    \ = 'inline-block';\n\n  btn1.textContent = '-';\n\n  btn2.textContent = '+';\n\
    \n  btn3.textContent = 'Update';\n\n  btn1.style.backgroundColor = 'red';\n\n\
    \  btn2.style.backgroundColor = 'green';\n\n  btn1.style.color = 'white';\n\n\
    \  btn2.style.color = 'white';\n\n  updater(inField,div1,div.trackingVal);\n\n\
    \  btn1.onclick = ()=>{\n\n      div.trackingVal--;\n\n if(div.trackingVal <=\
    \ 0) div.trackingVal =0;\n\n      updater(inField,div1,div.trackingVal);\n\n \
    \ }\n\n  btn2.onclick = ()=>{\n\n      div.trackingVal++;\n\n      updater(inField,div1,div.trackingVal);\n\
    \n  }\n\n  btn3.onclick = ()=>{\n\n      div.trackingVal = inField.value;\n\n\
    \ if(div.trackingVal <= 0) div.trackingVal =0;\n\n      updater(inField,div1,div.trackingVal);\n\
    \n  }\n}\n\nfunction  updater(inputEle,txtEle,num){\n\n  inputEle.value = num;\n\
    \n  txtEle.innerHTML = ` ${num} : `;\n\n}\n\nfunction  inputToNum(ele){\n\n  ele.setAttribute('type','number');\n\
    \n  ele.setAttribute('min',0);\n\n  ele.setAttribute('max',10000);\n\n  ele.value\
    \ = 0;\n\n}\n\nfunction  makeElement(parent,eleType){\n\n const ele = document.createElement(eleType);\n\
    \n return parent.appendChild(ele);\n\n}\n```\n\n# 使用 JavaScript 字符串方法的随机单词生成器\n\
    \n此练习将创建一个占位符随机单词生成器。将有一个用于创建单词数量的输入框和一个用于将它们添加到页面的按钮。编码将关注 JavaScript 字符串方法以及我们如何更新字符串、如何从字符串获取随机字母以及我们如何使用\
    \ `random` 使输出内容随机化。此外，还将使用 `Math` 来添加随机性。\n\n此处使用的字符串方法：`toUpperCase()`、`slice()`、`substring()`、`trim()`。\n\
    \n练习：\n\n1. 选择 `main`、`input` 和 `button`。\n2. 为 `button` 添加一个 `onclick` 事件。\n\
    3. 调用函数 `makeWords()` 并传递 `input` 的值。\n4. 使用循环创建指定数量的单词。\n5. 在循环内部，确定一个随机单词长度。\n\
    6. 使用 `random` 决定字母是元音还是辅音。\n7. 如果是第一个单词，将其字母大写。\n8. 在句末添加一个句号。\n9. 将完成的字符串显示在\
    \ `output` 元素中。\n\n"
- fmt: "\nThis exercise is going to provide practice with updating style properties\
    \ of page elements. Including style of `textAlign`, `border`, `padding`, `position`,\
    \ `width`, `backgroundColor`, `height`, `color`, `top`, `left`, `zIndex`. We are\
    \ also going to use values from the main HTML element, which is in the document\
    \ as an object with the property name `document.documentElement`. The `document.documentElement`\
    \ will return the root element of the document which is the HTML element. The\
    \ `scrollHeight`, `scrollTop`, and `clientHeight` of `document.documentElement`\
    \ can be used to calculate the position of the current scroll on the document,\
    \ and how much of the document is remaining. This can be used to get a percentage\
    \ of the document that is currently scrolled to.\n\n![](Images/image00469.jpeg)\n\
    \n### Exercise\n\n1. Select the main page element, add new divs into it. Create\
    \ random heights of the divs so that you can use the scroll bar and the page content\
    \ is larger than the area within the browser.\n2. Create a main scrollbar container,\
    \ and two divs, each nested within the parent.\n3. Apply styling to the main scroll\
    \ bar container, set a fixed position, and width of 100%. Add styling as needed.\n\
    4. Create the empty scroll indicator with a height and width of 100% This can\
    \ be used as the blank area that the inner scroll bar will fill as the user scrolls\
    \ down the page.\n5. Add the inner scroll bar, set width to 0 and set a background\
    \ color different from its parent.\n6. Using the `window.onscroll` event, calculate\
    \ the position of the scroller. Get the top value of the current document in the\
    \ browser. Using `document.documentElement.scrollTop` which will change and be\
    \ 0 if at the top. `document.body.scrollTop` will be 0 as it's the document top\
    \ if your body is at the top of the web page.\n7. The `document.documentElement.scrollHeight`\
    \ will always be the total height of all the body contents. The `document.documentElement.clientHeight`\
    \ is the visible area in the browser of the page.\n8. Subtract `document.documentElement.scrollHeight\
    \ - document.documentElement.clientHeight` which will give a value of the total\
    \ available height of the scrolling. Subtracting the `clientHeight` will set the\
    \ height to 0 once the bottom of the page is reached.\n9. Divide the total value\
    \ off the top `document.documentElement.scrollTop` which will increase once the\
    \ user scrolls down, with the total available body height. This will return a\
    \ percentage, which then can be multiplied by 100 for a %.\n10. Use the percentage\
    \ of page scrolled value to set the width of the scroll bar.\n\n```javascript\n\
    const main = document.querySelector('div');\n\nconst scrollInd = document.createElement('div');\n\
    \nconst scrBarP = document.createElement('div');\n\nconst scrBarC = document.createElement('div');\n\
    \ndocument.body.prepend(scrollInd);\n\nscrollInd.textContent = 'Scroll Bar';\n\
    \nscrollInd.append(scrBarP);\n\nscrBarP.append(scrBarC);\n\nscrollInd.style.textAlign\
    \ = 'center';\n\nscrollInd.style.border = '1px solid black';\nscrollInd.style.padding\
    \ = '0px';\nscrollInd.style.position = 'fixed';\n\nscrollInd.style.width = '100%';\n\
    scrollInd.style.backgroundColor = 'black';\nscrollInd.style.color = 'white';\n\
    scrollInd.style.top = '0';\nscrollInd.style.left = '0';\nscrollInd.style.zIndex\
    \ = '1';\n\nscrBarP.style.width = '100%';\nscrBarP.style.height = '21px';\nscrBarP.style.padding\
    \ = '3px';\nscrBarP.style.backgroundColor = 'white';\n\nscrBarC.style.width =\
    \ '0%';\nscrBarC.style.height = '15px';\nscrBarC.style.backgroundColor = 'green';\n\
    \nwindow.onscroll = (e)=>{\n  const sTop = document.body.scrollTop || document.documentElement.scrollTop;\n\
    \  const pos = document.documentElement.scrollHeight - document.documentElement.clientHeight;\n\
    \  const scrolMeter = (sTop / pos)*100;\n  console.log(scrolMeter);\n  const bgColor\
    \ = scrolMeter > 50 ? 'red' : 'green';\n  scrBarC.style.width = `${scrolMeter}%`;\n\
    \  scrBarC.style.backgroundColor = bgColor;\n}\n\nfor(let i=0;i<10;i++){\n  const\
    \ div = document.createElement('div');\n  main.append(div);\n  div.style.border\
    \ = '1px solid #ddd';\n  div.style.height = `${ranV(300)+150}px`;\n  div.innerHTML\
    \ = `<h<h1>${i+1} Header</h1><div>Laurence Svekis</div>`;\n  div.style.backgroundColor\
    \ = ranC();\n  div.style.color = 'white';\n}\n\nfunction ranC(){\n  return `#${Math.random().toString(16).slice(2,8)}`;\n\
    }\n\nfunction ranV(max){\n  return Math.floor(Math.random()*max)+1;\n}\n```\n\n\
    # Math Quiz with timer\n\nHow to track time, using intervals. Create a start and\
    \ stop counter with JavaScript that can pause the counter time. This coding exercise\
    \ will include a simple math quiz that presents math questions to the user, tracks\
    \ the response. This exercise will use `setInterval()` and `setTimeout()` methods\
    \ to show questions to the user.\n\n![](Images/image0470.jpeg)\n\n### Exercise\n\
    \n1. Create the page elements for the game.\n2. Set the number of questions and\
    \ track the counter in a global object.\n3. Create the questions, storing them\
    \ into an empty array.\n4. Once the questions are ready, start the timer and show\
    \ them to the player.\n5. Create a function to show the question.\n6. Populate\
    \ the text area string value.\n7. Add an event listener of `keydown` on the input\
    \ field, if the pressed key is `Enter` then submit the answer and check if correct.\n\
    8. If the answer is not correct, provide feedback to the player.\n9. If the input\
    \ value is correct and matches the correct answer, then move to the next question.\
    \ Provide feedback to the user.\n10. Add and set the focus on the input field\
    \ of the question.\n11. In the next question, check if the player is on the last\
    \ question, if they are then end the game. Show all the answers. Stop the timer.\n\
    \n```javascript\nconst main = document.querySelector('div');\nconst btn = document.createElement('button');\n\
    const btn1 = document.createElement('button');\nconst div1 = document.createElement('div');\n\
    const div2 = document.createElement('div');\nconst questions = 3;\nconst ques\
    \ = [];\nconst timerVal = {cur:0,counter:0,running:false,int:{}};\n\nmain.innerHTML\
    \ = '';\nmain.append(div1);\nmain.append(btn);\nmain.append(btn1);\nmain.append(div2);\n\
    div1.textContent = 0;\nbtn.textContent = 'Start';\nbtn1.textContent = 'Create\
    \ Questions';\n\nbtn1.onclick = ()=>{\n  btn1.style.display = 'none';\n  createQuestions();\n\
    }\n\nfunction createQuestions(){\n  for(let i=0;i<questions;i++){\n    const first\
    \ = ranNum(1,5);\n    const sec = ranNum(1,5);\n    const que = `${first} + ${sec}`;\n\
    \    const ans = first + sec;\n    const myObj = {que:que,ans:ans}\n    ques.push(myObj);\n\
    \  }\n}\n```\n"
