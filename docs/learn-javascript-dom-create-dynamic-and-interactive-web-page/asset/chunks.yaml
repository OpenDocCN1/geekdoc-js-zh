    const arr = [1,2,4,5];\n\nconsole.log(Math.max(1,2,4,5));\n\nconsole.log(Math.max(...arr));\n\
    \nconsole.log(Math.max(arr));\n```\n\n![](img/image00479.jpeg)\n\n```html\n<!doctype\
    \ html>\n<html\n<head>\n <title>JavaScript</title>\n <style>\n * {\n box-sizing:\
