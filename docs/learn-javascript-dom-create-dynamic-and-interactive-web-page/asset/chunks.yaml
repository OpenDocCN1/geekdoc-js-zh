    \ > div');\nconst ele4 = document.getElementById('one');\nconst eles1 = document.querySelectorAll('div');\n\
    const eles2 = document.getElementsByTagName('div');\nconst eles3 = document.getElementsByClassName('one');\n\
    \nconsole.log(ele1);\nconsole.log(ele2);\nconsole.log(ele3);\nconsole.log(ele4);\n\
    console.log(eles2['one']);\nconsole.clear();\nconsole.log(eles1);\nconsole.log(eles2);\n\
    console.log(eles3);\n\neles1.forEach((ele,ind,arr)=>{\n  console.log(ele.textContent);\n\
    \  ele.innerHTML = `<div>JavaScript List ${ind+1} </</div>>`;\n  //console.log(arr);\n\
    })\n\nconsole.log(eles1);\nconsole.log(eles2);\nfor(let i=0;i<eles2.length;i++){\n\
    \  console.log(eles2[i].innerHTML);\n}\n```\n\n# Create and remove page elements\
    \ with code\n\nIn this exercise JavaScript will be used for Creating and Deleting\
    \ Elements on the dynamically with code. \n\n## Lesson Coding Exercise:\n\n1.\
    \ Select HTML elements to be used as parent elements for elements that will be\
    \ created using `document.createElement()`.\n2. Create a function that can be\
    \ used to generate new page elements. In the parameters add the element tag type,\
    \ the parent and the html or contents of the element.\n3. Using the function create\
    \ an input element and a button element.\n4. Set the attribute of the input to\
    \ text and value of a string.\n5. Add an `onclick` event to the button, when clicked\
    \ it will add a new item to the list.\n6. Create a list appended to the page.\
    \ Using a `for` loop create several list items.\n7. Create a function that will\
    \ add a list item to the unordered list. Update the inner text with a value and\
    \ add a style color for the text.\n8. Within the function to create the list items,\
    \ add an `onclick` event to the list items, that will select the list item and\
    \ remove it from the parent. `removeChild()`.\n9. When the button is clicked add\
    \ a function that will add a new list item, count the current number of list items.\
    \ Add to the text of the new list item, the current input field value, and the\
    \ count of current list items in the DOM. Set a red font color in the new list\
    \ item.\n10. Check out the difference between `append()`, `prepend()`, `appendChild()`\
    \ methods.\n\n```html\n<!doctype html>\n<html>\n<head>\n <title>JavaScript</title>\n\
    </head>\n<body>\n<div class=\"one\" id=\"one\">JavaScript 1</div>\n<div class=\"\
    one\" id=\"two\">JavaScript 2</div>\n<div class=\"two\" id=\"three\"><div class=\"\
    one\">JavaScript 3</div></div>\n<script src=\"apps2.js\"></script>\n</body>\n\
    </html>\n```\n\n```javascript\nconst div1 = document.querySelector('div');\nconst\
    \ div5 = document.querySelector('#three');\nconst div6 = document.querySelector('div\
    \ .one');\nconst ul1 = document.createElement('ul');\nconst myInput = maker('input',div1,'');\n\
    myInput.setAttribute('type','text');\nmyInput.value = 'Laurence Svekis';\nconst\
    \ btn = maker('button',div1,'Add to List');\nbtn.onclick = ()=>{\n  const lis\
    \ = document.querySelectorAll('li');\n  let temp = `${myInput.value} ${lis.length+1}`;\n\
    \  addListItem(temp,'red');\n}\ndiv6.style.color = 'purple';\ndiv6.textContent\
    \ = 'Hello WOrld 2';\nconsole.log(div6.parentNode);\ndiv6.parentNode.removeChild(div6);\n\
    console.log(div1);\ndiv1.append(ul1);\nconsole.log(ul1);\nfor(let i=0;i<10;i++){\n\
    \  addListItem(`List item ${i+1}`,'blue');\n}\n\nfunction addListItem(val,col){\n\
    \  const li = document.createElement('li');\n  li.innerText = val;\n  li.style.color\
    \ = col;\n  li.onclick = (e)=>{\n    li.parentNode.removeChild(li);\n  }\n  return\
    \ ul1.appendChild(li);\n}\nconst div2 = document.createElement('div');\ndiv1.prepend(div2);\n\
    div2.innerHTML = `Hello World`;\nconst div3 = maker('div',div1,'Laurence Svekis');\n\
    div3.style.color = 'red';\ndiv5.append(div3);\ndiv5.prepend(ul1);\ndiv5.append(div6);\n\
    \nfunction maker(eleT,parent,html){\n  const ele = document.createElement(eleT);\n\
    \  ele.innerHTML = html;\n  return parent.appendChild(ele);\n}\n```\n\n# Moving\
    \ Page elements\n\nThis coding exercise will provide an excellent way to practice\
    \ creating and removing elements. Within the code, the object can only be in one\
    \ spot at a time. `Images/image045.jpeg`\n\n## Lesson Exercise:\n\n1. `document.body.style.display\
    \ = 'grid'`, `document.body.style.gridTemplateColumns = '1fr 1fr'`\n2. Create\
    \ an array with values.\n3. Create `ul` from the array.\n4. Select `divs`, loop\
    \ through `div`.\n5. Create `ul` and update `div`.\n6. Append `ul` to the parent.\n\
    7. `ul` items the list.\n8. `setAttribute('contenteditable', true)`.\n9. Add `sel`\
    \ class to the element.\n10. Add a button to each list.\n11. When the button is\
    \ clicked, run a function `mover`.\n12. In the `mover` function, select the parent\
    \ of the button.\n13. Select all elements with `sel`.\n14. Using `replaceChildren(...eles,\
    \ ...parentEle.children)`, remove the `sel` class from all elements.\n15. Remove\
    \ the `sel` class from the parent.\n\n```html\n<!doctype html>\n<html>\n<head>\n\
