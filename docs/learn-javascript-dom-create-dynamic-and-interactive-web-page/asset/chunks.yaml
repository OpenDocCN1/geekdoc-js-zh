    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n\n15.\
    \ Loop through the total number of items to be placed on the grid, add an event\
    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n\n16.\
    \ Loop through the total number of items to be placed on the grid, add an event\
    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n\n17.\
    \ Loop through the total number of items to be placed on the grid, add an event\
    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n"
