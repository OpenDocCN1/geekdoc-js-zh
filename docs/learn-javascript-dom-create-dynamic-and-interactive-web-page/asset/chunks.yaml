    \ = val;\n  ul.append(li);\n}\n\nfunction tracker(e) {\n  console.log(e.key);\n\
    }\n\nfunction logger(val) {\n  console.log(val);\n  output.innerHTML = val;\n\
    }\n\nfunction updateColor() {\n  document.body.style.backgroundColor = ranColor();\n\
    }\n\nfunction ranColor() {\n  return `#${Math.random().toString(16).slice(2,8)}`;\n\
    }\n```\n\n# Page Element Animations\n\nJavaScript `requestAnimationFrame()` method\
    \ provides smooth Animation for page elements. `requestAnimationFrame()` tells\
    \ the browser an animation is being performed, and requests the browser call a\
    \ specific function to update the page before the next repaint. The `callback`\
    \ as an argument is the function that should be invoked before the next repaint.\
    \ In this example the code is used to create a bouncing ball element on the page\
    \ that moves smoothly. The style values of its position on the page are updated\
    \ with the top and left values. The `requestAnimationFrame()` method can be used\
    \ to create smooth animations within web elements. The browser then calls a specified\
    \ function that can update animation before the next repaint. The method takes\
    \ a callback as an argument to be invoked before the repaint so you can continue\
    \ the animation.\n\n![](Images/image0457.jpeg)\n\n### Lesson Exercise\n\n1. Select\
    \ the HTML element that will be used as the container.\n2. Create a `div` for\
    \ displaying the score to the user, create a `div` that will be the ball.\n3.\
    \ Update the style properties for the elements, the ball needs to be `relative`\
    \ or `absolute` to be able to move the element on the screen.\n4. Create a global\
    \ object to hold `x`, `y`, `x direction`, and `y direction`. Include `speed` and\
    \ other values needed for the game.\n5. Assign to a variable the `requestAnimationFrame()`\
    \ then create a function that will run the movement.\n6. In the `animation` function,\
    \ check `pos` of `x` and `y` to ensure values are within the boundaries, if not\
    \ change the direction by -1.\n7. Update the ball positions and apply the new\
    \ position to `left` and `top` values.\n8. Within the `animation` function, `requestAnimationFrame`\
    \ to keep the animation going.\n9. Add an event for `keydown` values, if `enter`\
    \ is pressed cancel the animation or restart the animation.\n10. Add an event\
    \ listener on the ball, if clicked update the score and reset the position and\
    \ color of the ball.\n11. Create a `score update` function that will be invoked\
    \ every time there is a score update.\n\n```javascript\nconst div = document.querySelector('div');\n\
    const score = document.createElement('div');\nscore.style.textAlign = 'center';\n\
    document.body.prepend(score);\nconst ball = document.createElement('div');\nball.style.border\
    \ = '3px solid white';\ndiv.innerHTML = '';\ndiv.style.width = '500px';\ndiv.style.height\
    \ = '400px';\ndiv.style.backgroundColor = 'black';\ndiv.style.margin = 'auto';\n\
    div.style.overflow = 'hidden';\nconst pos = {\n  x:100,\n  y:100,\n  dx:1,\n \
    \ dy:1,\n  speed:5,\n  move:true,\n  score:0\n}\nadderScore();\ndiv.append(ball);\n\
    ball.style.backgroundColor = 'red';\nball.style.height = '50px';\nball.style.width\
    \ = '50px';\nball.style.borderRadius = '50%';\nball.style.position = 'relative';\n\
    ball.onclick = gameHit;\nlet mover = requestAnimationFrame(ani);\ndocument.addEventListener('keydown',(e)=>{\n\
    \  console.log(e.key);\n  if(e.key === 'Enter') {\n    if(pos.move){\n      pos.move\
    \ = false;\n      cancelAnimationFrame(mover);\n    }else{\n      pos.move = true;\n\
    \      mover = requestAnimationFrame(ani);\n    }\n  }\n})\nfunction gameHit(){\n\
    \  pos.score++;\n  ball.style.backgroundColor = `#${Math.random().toString(16).slice(2,8)}`;\n\
    \  adderScore();\n  pos.x = Math.floor(Math.random()*450);\n  pos.y = Math.floor(Math.random()*350);\n\
    \  ball.style.left = `${pos.x}px`;\n  ball.style.top = `${pos.y}px`;\n}\nfunction\
    \ adderScore(){\n  score.innerHTML = `<div>Score :${pos.score}</div>`;\n}\nfunction\
    \ ani(){\n  pos.move = true;\n  if(pos.move){\n    if(pos.x > 450 || pos.x < 0){\n\
    \      pos.dx *= -1;\n    }\n    if(pos.y > 350 || pos.y < 0){\n      pos.dy *=\
    \ -1;\n    }\n    pos.x += pos.speed * pos.dx;\n    pos.y += pos.speed * pos.dy;\n\
    \    ball.style.left = `${pos.x}px`;\n    ball.style.top = `${pos.y}px`;\n  }\n\
    \  mover = requestAnimationFrame(ani);\n}\n```\n"
