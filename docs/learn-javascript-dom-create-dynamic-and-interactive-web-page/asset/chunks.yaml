    \ 'div', '', 'paddle');\n\npaddle.val = 5;\ngameboard.style.display = 'none';\n\
    \nconst game = {\n  box: [],\n  num: 15,\n  ani: {},\n  pspeed: 1,\n  speed: 2,\n\
    \  width: main.offsetWidth,\n  play: false,\n  score: 0\n};\n\nbtn1.onclick =\
    \ startGame;\n// window.addEventListener('DOMContentLoaded', init);\n\nfunction\
    \ init() {\n  for (let i = 0; i < game.num; i++) {\n    const ele = maker(gameboard,\
    \ 'div', i + 1, 'box');\n    ele.style.backgroundColor = '#' + Math.random().toString(16).slice(2,\
    \ 8);\n    ele.onclick = dropper;\n    ele.speedVal = Math.floor(Math.random()\
    \ * 1) + 1;\n    ele.style.left = Math.floor(Math.random() * (game.width - 50))\
    \ + 'px';\n  }\n}\n\nfunction mover() {\n  const actives = document.querySelectorAll('.active');\n\
    \  actives.forEach((ele) => {\n    let y = ele.offsetTop + game.speed;\n    ele.style.top\
    \ = y + 'px';\n    if (y > 400) {\n      ele.classList.remove('active');\n   \
    \   ele.style.left = Math.floor(Math.random() * (game.width - 50)) + 'px';\n \
    \     ele.style.top = '0px';\n    }\n    const poff = paddle.offsetTop;\n    if\
    \ (y + 50 > poff && y < poff + 20) {\n      const x = ele.offsetLeft;\n      const\
    \ xend = x + 50;\n      const px = paddle.offsetLeft;\n      const pxend = px\
    \ + 100;\n      let valHit = 'miss 中';\n      if ((xend > px) && (xend < pxend))\
    \ {\n        valHit = '命中';\n        message.style.color = 'green';\n        ele.remove();\n\
    \        game.score++;\n      } else {\n        message.style.color = 'red';\n\
    \      }\n      message.textContent = `${valHit}!) 得分 : ${game.score}`;\n    \
    \  if (game.score >= game.num) {\n        // 游戏结束\n        game.play = false;\n\
    \        btn1.style.display = 'block';\n        btn1.textContent = '重新开始';\n \
    \       message.style.color = 'black';\n        message.innerHTML += '<<div>游戏结束</div>';\n\
    \      }\n    }\n  })\n  let paddleY = paddle.offsetLeft + (game.pspeed * paddle.val);\n\
    \  if (paddleY > game.width - 100 || paddleY < 0) {\n    paddle.val *= -1;\n \
