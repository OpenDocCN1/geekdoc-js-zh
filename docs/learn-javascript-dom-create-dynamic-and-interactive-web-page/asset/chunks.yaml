    # 认识 JavaScript


    JavaScript 广泛用于 Web，是最受欢迎的编程语言之一。它允许 Web 开发人员和设计师通过代码赋予网页生命。除了 HTML 和 CSS，JavaScript
    是互联网上使用的代码技术之一。它直接在浏览器中运行，你可以在计算机上使用文本编辑器创建 html 文件并在浏览器选择 html 文件并用任何浏览器打开，然后引入
    JavaScript 代码让事情发生。


    # 开始编码


    代码是你希望发生的事情的指令集。示例：当新用户访问你的网站时，询问他们的姓名。显示带有他们姓名的欢迎消息，是你可能要求 JavaScript 执行的操作示例。要编写代码，你需要将完成此任务的步骤分解开。从获取姓名开始，因为在第二步将姓名返回给网站用户时将需要它。


    ## 第一步 - 获取用户姓名


    ![](img/image00435.jpeg)


    ## 第二步 - 使用用户的输入值显示欢迎消息。


    ![](img/image00436.jpeg)


    代码指令将是：


    1.  为用户提供一个输入区域

    2.  从输入获取用户姓名的输入值

    3.  使用该值向用户返回响应


