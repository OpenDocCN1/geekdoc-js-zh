    \n```javascript\nconst main = document.querySelector('.container');\nconst info\
    \ = maker(main, 'div', '', 'info');\nconst gameboard = maker(main, 'div', '',\
    \ 'gameboard');\nconst message = maker(info, 'div', 'Click Start Button', 'message');\n\
    const btn1 = maker(info, 'button', 'Start Game', 'btn');\nconst paddle = maker(gameboard,\
    \ 'div', '', 'paddle');\n\npaddle.val = 5;\ngameboard.style.display = 'none';\n\
    \nconst game = {\n  box: [],\n  num: 15,\n  ani: {},\n  pspeed: 1,\n  speed: 2,\n\
    \  width: main.offsetWidth,\n  play: false,\n  score: 0\n};\n\nbtn1.onclick =\
    \ startGame;\n// window.addEventListener('DOMContentLoaded', init);\n\nfunction\
    \ init() {\n  for (let i = 0; i < game.num; i++) {\n    const ele = maker(gameboard,\
    \ 'div', i + 1, 'box');\n    ele.style.backgroundColor = '#' + Math.random().toString(16).slice(2,\
    \ 8);\n    ele.onclick = dropper;\n    ele.speedVal = Math.floor(Math.random()\
    \ * 1) + 1;\n    ele.style.left = Math.floor(Math.random() * (game.width - 50))\
    \ + 'px';\n  }\n}\n\nfunction mover() {\n  const actives = document.querySelectorAll('.active');\n\
    \  actives.forEach((ele) => {\n    let y = ele.offsetTop + game.speed;\n    ele.style.top\
    \ = y + 'px';\n    if (y > 400) {\n      ele.classList.remove('active');\n   \
    \   ele.style.left = Math.floor(Math.random() * (game.width - 50)) + 'px';\n \
    \     ele.style.top = '0px';\n    }\n    const poff = paddle.offsetTop;\n    if\
    \ (y + 50 > poff && y < poff + 20) {\n      const x = ele.offsetLeft;\n      const\
    \ xend = x + 50;\n      const px = paddle.offsetLeft;\n      const pxend = px\
    \ + 100;\n      let valHit = 'miss';\n      if ((xend > px) && (xend < pxend))\
    \ {\n        valHit = 'hit';\n        message.style.color = 'green';\n       \
    \ ele.remove();\n        game.score++;\n      } else {\n        message.style.color\
    \ = 'red';\n      }\n      message.textContent = `${valHit}!) SCORE : ${game.score}`;\n\
    \      if (game.score >= game.num) {\n        // GAME OVER\n        game.play\
    \ = false;\n        btn1.style.display = 'block';\n        btn1.textContent =\
    \ 'ReStart';\n        message.style.color = 'black';\n        message.innerHTML\
    \ += '<<div>Game Over</div>';\n      }\n    }\n  })\n  let paddleY = paddle.offsetLeft\
    \ + (game.pspeed * paddle.val);\n  if (paddleY > game.width - 100 || paddleY <\
    \ 0) {\n    paddle.val *= -1;\n  }\n  paddle.style.left = paddleY + 'px';\n  if\
    \ (game.play) {\n    game.ani = requestAnimationFrame(mover);\n  } else {\n  \
    \  cancelAnimationFrame(game.ani);\n  }\n}\n\nfunction dropper(e) {\n  console.log(this);\n\
    \  this.classList.add('active');\n}\n\nfunction startGame() {\n  game.play = true;\n\
    \  btn1.style.display = 'none';\n  gameboard.style.display = 'block';\n  message.textContent\
    \ = 'Game in Play';\n  mover();\n}\n\nfunction maker(parent, t, html, c) {\n \
    \ const ele = document.createElement(t);\n  ele.innerHTML = html;\n  ele.classList.add(c);\n\
    \  return parent.appendChild(ele);\n}\n```\n"
