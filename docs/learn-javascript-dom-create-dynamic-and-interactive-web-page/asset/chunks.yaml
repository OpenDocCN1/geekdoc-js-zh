    # Getting to Know JavaScript


    JavaScript is used across the web and is one of the most popular programming languages
    ever. It allows web developers and designers to bring their web pages to life
    with code. Used in all browsers it can update page elements and a whole lot more.
    Alongside HTML and CSS JavaScript is one of the code technologies used on the
    internet. It runs directly in your browser, and you can create html files with
    a text editor directly on your computer to run in your browser. Select the html
    file and open it with any browser and then bring in the JavaScript code to make
    things happen.


    # Introduction to JavaScript


    JavaScript allows for interaction with content and makes things happen. JavaScript
    is the dynamic programming language that, when applied to an HTML document, can
    provide dynamic interactivity on websites. Used in all browsers it''s the most
    popular language ever. Websites and web apps everywhere are using JavaScript.


    # Getting started with coding


    Code is a set of instructions for what you want to happen. Example: When a new
    person comes to your website, ask their name. Showing a welcome message with their
    name, this would be an example of something you might ask JavaScript to do. To
    code it you would need to break down the steps in the process of completing this
    task. Start by getting the name as this will be needed in the second step as the
    name gets output back to the user of the website.


    ## Step 1 - Get the user’s name


    ![](Images/image00435.jpeg)


    ## Step 2 - Display the welcome message using the input value of the user''s name.


    ![](Images/image00436.jpeg)


    The instructions for the code would be:


    1.  Provide the user an input area

    2.  Get the input value of their name from the input

    3.  Use that value to return a response back to the user

