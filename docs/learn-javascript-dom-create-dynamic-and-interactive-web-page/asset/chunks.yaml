  trans: "\n\n# JavaScript DOM 编码练习与挑战\n\n通过 JavaScript DOM 编码项目学习交互式和动态网页。这些现代化的编码练习将帮助你通过最常见的\
    \ JavaScript 问题来提升你的 JavaScript 编码技能。\n\n以下编码练习旨在帮助你开发使用 JavaScript 在网页页面上创建交互式和动态内容的技能。\n\
    \n## 网页动态欢迎消息\n\n该网页练习是一个简单的示例，展示了如何从用户处获取输入，然后在 JavaScript 中应用该输入值来创建动态网页响应。输入字段为用户与网页的交互提供了方式。要获取输入值，需要选择页面元素，然后在该元素的属性值中，有一个属性名值存储了输入字段的值。将该值返回到一个变量，然后在字符串响应中使用该值，最后作为自定义消息输出到网页中给网络用户。\n\
    \n代码示例展示了：选择页面元素 `document.querySelector()`、更新元素的样式属性（通过给属性 `userVal.style.borderColor`\
    \ 赋值新值）、以及为元素 `btn.onclick` 添加事件监听器。\n\n![](img/image00458.jpeg)\n![](img/image00459.jpeg)\n\
    \n询问网页用户其姓名，并将输入值连同欢迎消息一起返回给用户。\n\n创建一个页面欢迎消息：\n\n1. 在输入框中获取用户名\n2. 当按下按钮时，添加一个事件来获取用户名并在页面上创建欢迎消息\n\
    3. 添加一个检查以确保输入长度大于 3 个字符\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript\
    \ Course</title>\n</head>\n<body>\n<div class=\"output\">What is you name?</div>\n\
    <input type=\"text\"  name=\"userName\">\n<button>Submit</button>\n<script src=\"\
    app.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst output = document.querySelector('.output');\n\
    const userVal = document.querySelector('input[name=\"userName\"]');\nconst btn\
    \ = document.querySelector('button');\n\nuserVal.style.borderColor = '#333';\n\
    btn.onclick = ()=>{\n if(userVal.value.length > 3){\n const message = `Welcome\
    \ to the site ${userVal.value}`;\n      output.textContent =  message;\n     \
    \ userVal.style.display = 'none';\n      btn.style.display = 'none';\n  }\n else{\n\
    \      output.textContent = 'Name length must be 3+ characters';\n      userVal.style.borderColor\
    \ = 'red';\n  }\n}\n```\n\n## 函数表达式 vs 声明 vs 箭头函数\n\n最常被问的问题之一关于函数以及应该使用哪种函数。创建函数有多种方法，此练习旨在强调如何使用它们。同时也包含了函数的箭头格式，以及使用\
    \ `this` 关键字来引用函数作用域内的当前对象。\n\n![Graphical user interface, application Description\
    \ automatically generated](img/image00460.jpeg)\n\n当对象被创建时，即使使用了相同的函数来创建它们，它们也会独立地持有值。由于是独立的实例，此示例将演示函数代码如何创建独立的对象，因为函数内部的代码块会将函数中创建的值应用到父对象上。这些值随后会被绑定到父对象上，在本例中即绑定到调用点击事件的元素上。\n\
    \n此练习的目标是创建函数，可以通过函数表达式、函数声明以及使用匿名函数的箭头格式来实现。文中提供了使用不同语法的示例。还展示了 `this` 关键字如何应用于父对象元素，并能够分别跟踪点击值。\n\
    \n练习涵盖了函数的使用及其工作原理。使用 `querySelector()` 选择元素并通过 `onclick` 添加点击事件。\n\n使用不同的函数、表达式、声明和箭头格式创建\
    \ 3 个页面的计数器。所有计数器都将独立工作，因为总值包含在使用 `this` 的函数对象实例中。\n\n使用函数的页面计数器：\n\n1. 选择所有页面按钮\n\
    2. 创建一个函数表达式，在按下按钮时增加计数器\n3. 创建一个箭头格式的函数表达式，用于跟踪并增加页面上的计数\n4. 创建一个函数声明，用于跟踪并增加页面上的计数。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript Course</title>\n\
    </head>\n<body>\n<div  class=\"output\"></div>\n<button  class=\"btn1\">Adder\
    \ 1</button>\n<button  class=\"btn2\">Adder 2</button>\n<button  class=\"btn3\"\
    >Adder 3</button>\n<script  src=\"app1.js\"></script>\n</body>\n</html>\n```\n\
    \n```javascript\nconst btn1 = document.querySelector('.btn1');\nconst btn2 = document.querySelector('.btn2');\n\
    const btn3 = document.querySelector('.btn3');\nconst output = document.querySelector('.output');\n\
    \n//Function Expression\nconst  adder2 = function(){\n if(!this.total) {\n this.total\
    \ = 1;\n  }else{\n this.total++;\n  }\n  output.textContent = `Total #2 : (${this.total})`;\n\
    }\n\nconst adder3 = ()=>{\n if(!this.total) {\n this.total = 1;\n  }else{\n this.total++;\n\
    \  }\n  output.textContent = `Total #3 : (${this.total})`;\n}\n\nbtn1.onclick\
    \ = adder1;\nbtn2.onclick = adder2;\nbtn3.onclick = adder3;\n\n///Function Declaration\n\
    functionadder1(){\n if(!this.total) {\n this.total = 1;\n  }else{\n this.total++;\n\
    \  }\n  output.textContent = `Total #1 : (${this.total})`;\n```\n\n## 动态 DOM 元素\n\
    \n元素是对象，可以像其他对象一样持有值。扩展了每个元素如何在共享同一个点击事件的同时跟踪值。此练习将演示如何从元素获取值并将其应用于其他元素。\n\n![](img/image00461.jpeg)\n\
    \n此练习将演示如何创建元素以及如何使用全局值来更新内容。使用 `document.createElement()` 创建页面元素并通过 `appendChild()`\
    \ 将它们添加到网页中。\n\n![](img/image00462.jpeg)\n\n动态创建可以独立计数的页面按钮。创建一个按钮来输出总计。仅使用 JavaScript。存储元素的值，获取值并输出到网页。\n\
    \nJavaScript 动态计数器：\n\n1. 创建一个全局对象来设置要创建的按钮数量\n2. 创建一个包含所有新元素的页面元素\n3. 创建一个元素的函数，将元素类型添加到父对象。在函数中包含一个参数用于元素的内部内容。\n\
    4. 循环创建所有按钮，为每个按钮设置默认值为 0。点击时，创建一个函数来更新并输出当前元素的总值。你可以为按钮添加样式。\n5. 为每个新按钮添加 `btn`\
    \ 类，以便它们与主总计按钮区分开来。创建一个按钮来输出所有按钮计数的结果。\n6. 当总计按钮被点击时，创建一个函数来选择所有带有 `btn` 类的元素并遍历它们。\n\
    7. 对于每个带有 `btn` 类的元素，创建一个新的列表项，将其输出到主页面的无列表中。列表项内容应显示元素的元素和元素的 `textContent`。你也可以选择样式以匹配按钮的样式属性值。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript Course</title>\n\
    </head>\n<body>\n<script src=\"app2.js\"></script>\n</body>\n</html>\n```\n\n\
    ```javascript\nconst val = {\n num : 2\n};\n\nconst main =  elemaker('div',document.body,'');\n\
    const output =  elemaker('div',main,'');\n\nfor(let i=0;i<val.num;i++){\n```\n\
    \n"
- fmt: "\n```javascript\nconst btn = elemaker('button',main,`Button #${i+1}`);\nbtn.total\
    \ = 0;\nbtn.style.backgroundColor = '#'+Math.random().toString(16).slice(2,8);\n\
    btn.style.color = 'white';\nbtn.classList.add('btn');\nbtn.onclick = adder;\n\
    }\n\nconst output1 = elemaker('div',main,'');\nconst btnMain = elemaker('button',main,`All\
    \ Totals`);\nbtnMain.onclick =()=> {\n  const btns = document.querySelectorAll('.btn');\n\
    \  output1.innerHTML = '';\n  const ul = elemaker('ul',output1,'');\n  btns.forEach((ele,index)=>\n\
    \    const li = elemaker('li',ul,`${ele.textContent} = ${ele.total}`);\n    li.style.backgroundColor\
    \ = ele.style.backgroundColor;\n    li.style.color = ele.style.color;\n  })\n\
    }\n\nfunction elemaker(eleT,parent,html) {\n  const ele = document.createElement(eleT);\n\
    \  ele.innerHTML = html;\n  return parent.appendChild(ele);\n}\n\nfunction adder(e)\
    \ {\n  this.total++;\n  output.style.backgroundColor= this.style.backgroundColor;\n\
    \  output.innerHTML = `${this.textContent} :(${this.total})`;\n}\n```\n\nJavaScript\
    \ DOM coding exercises and games\n\n![](Images/image00463.jpeg)\n\nInteractive\
    \ and Dynamic Web projects with JavaScript code DOM examples. Select and update\
    \ page elements using common DOM methods and add event listeners using JavaScript\
    \ code. Coding examples and exercise to learn more about JavaScript and the DOM.\n\
    \n# Background Color Table: Create Table with JavaScript\n\nThis exercise will\
    \ build an interactive table of colored cells that can be clicked to apply the\
    \ cell background color to the page. In Addition, several buttons to update the\
    \ background colors of the table cells. The table will be dynamically generated\
    \ using values for columns and rows. The application will also include 3 interactive\
    \ buttons to update the page elements.\n\n## How to create a responsive table\
    \ with JavaScript code.\n\nButton actions when clicked:\n\n1. Add random background\
    \ colors to all the `td` elements in the table.\n2. Get the color values from\
    \ the elements in the row above, apply them to the following row creating a shifting\
    \ down of the row colors to the below row. First row gets new random colors.\n\
    3. `MoveLeft` effect, when clicked will get the background color of the next element\
    \ and apply it to the element. The last element in the table will get a new background\
    \ color randomly created.\n\n![](Images/image00464.jpeg)\n\n## Exercise:\n\n1.\
    \ Create a variable object for the number of rows and columns in the table.\n\
    2. Create a function to add the table to the page. The table function should create\
    \ the main table element, loop through the rows and cols adding the `tr` and `td`\
    \ page elements.\n3. Generate and set the style of the cell width using the `cols`\
    \ value, so that the cells take up the full width of the page.\n4. As you add\
    \ the `td` cells to the table, `document.createElement('td')` then add a text\
    \ value of the number, then add some styling like border and text align.\n5. Add\
    \ an event listener to the `td` element, when clicked update the `document.body`\
    \ background to the same as the table cell background color.\n6. Create a function\
    \ to generate random colors, `Math.random().toString(16).slice(2,8)`.\n7. Create\
    \ a function to create buttons, add 3 buttons to the page.\n8. Add an event listener\
    \ to the first button, when clicked it should select all the page `td` cells from\
    \ the main table. As it loops through the elements update the background to a\
    \ random color.\n9. Create a second page button, this one will have an effect\
    \ of moving the colors down one row. Select all the `td` cells from the main table.\
    \ Create a holding array, as you loop through the cells, for the first row generates\
    \ random values. Add these to the holding array. As you move through the second\
    \ row, subtract the number of columns from the `ind` value of the `td` element.\
    \ This will give you the value of the element that is in the row above. Get the\
    \ background Color of the element above and add it to the holding array.\n10.\
    \ Once you complete the holding array it should have all the color values with\
    \ one row shifted down, now loop through the holding array and apply the background\
    \ colors to the matching `td` elements from the node list.\n11. Create a third\
    \ button. Once this button is clicked, loop through all the `td` elements in the\
    \ main table. Update the background of the current element to the color of the\
    \ element background to the right by one index value. For the last element `td`\
    \ cell add a random background color.\n\n```javascript\nconst output = document.querySelector('div');\n\
    console.log(output);\noutput.innerHTML = '';\n\nconst tabValue = {\n  rows: 5,\n\
    \  cols: 9\n}\n\nconst main = addTable(output, tabValue.rows, tabValue.cols);\n\
    const btn1 = btnMaker(output, 'Random', 'blue', 'white');\nconst btn2 = btnMaker(output,\
    \ 'MoveDown', 'red', 'white');\nconst btn3 = btnMaker(output, 'MoveLeft', 'purple',\
    \ 'white');\n\nbtn3.addEventListener('click', (e) => {\n  const tds = main.querySelectorAll('td');\n\
    \  for (let i = 0; i < tds.length; i++) {\n    console.log(tds.length, i);\n \
    \   const bgColor = (i + 1 == tds.length) ? ranColor() : tds[i + 1].style.backgroundColor;\n\
    \    console.log(bgColor);\n    tds[i].style.backgroundColor = bgColor;\n  }\n\
    })\n\nbtn1.addEventListener('click', (e) => {\n  const tds = main.querySelectorAll('td');\n\
    \  console.log(tds);\n  tds.forEach(ele => {\n    console.log(ele);\n    ele.style.backgroundColor\
    \ = ranColor();\n  })\n})\n\nbtn2.addEventListener('click', (e) => {\n  const\
    \ tds = main.querySelectorAll('td');\n  let holder = [];\n  tds.forEach((ele,\
    \ ind) => {\n    let temp = ind - tabValue.cols;\n    let tempColor = '';\n  \
    \  console.log(temp);\n    if (temp >= 0) {\n      const el = tds[temp];\n   \
    \   console.log(el);\n      tempColor = el.style.backgroundColor;\n    } else\
    \ {\n      tempColor = ranColor();\n    }\n    holder.push(tempColor);\n  })\n\
    \  console.log(holder);\n  holder.forEach((val) => {\n    tds[ind].style.backgroundColor\
    \ = val;\n  })\n})\n\nfunction ranColor() {\n  return `#Math.random().toString(16).slice(2,8)}`;\n\
    }\n\nfunction btnMaker(parent, html, clr, fntColor) {\n  const btn = document.createElement('button');\n\
    \  btn.innerHTML = html;\n  btn.style.backgroundColor = clr;\n  btn.style.color\
    \ = fntColor;\n  return parent.appendChild(btn);\n}\n\nfunction addTable(parent,\
    \ rows, cols) {\n  const tbl = document.createElement('table');\n  tbl.style.border\
    \ = '1px solid black';\n  const tbody = document.createElement('tbody');\n  tbl.append(tbody);\n\
    \  let counter = 0;\n  let wid = (100 / cols) * 100;\n  for (let y = 0; y < rows;\
    \ y++) {\n    const tr = document.createElement('tr');\n    for (let x = 0; x\
    \ < cols; x++) {\n      const td = document.createElement('td');\n      counter++;\n\
    \      td.textContent = counter;\n      td.style.width = `${wid}px`;\n      td.style.border\
    \ = '1px solid #ddd';\n      td.style.textAlign = 'center';\n      tr.append(td);\n\
    \      td.addEventListener('click', () => {\n        document.body.style.backgroundColor\
    \ = td.style.backgroundColor;\n      })\n    }\n    tbody.append(tr);\n  }\n \
    \ return parent.appendChild(tbl);\n}\n```\n\n# Element Selector Exercise\n\n1.\
