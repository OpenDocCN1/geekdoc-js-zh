    \n  holder.push(ele);\n\n  ele.style.width = '50px';\n\n  ele.style.height = '50px';\n\
    \n  ele.style.border = '1px solid #ddd';\n\n  ele.style.display = 'inline-block';\n\
    \n  ele.style.backgroundColor = ranColor();\n\n  ele.style.lineHeight = '50px';\n\
    \n  ele.style.textAlign = 'center';\n\n  ele.textContent = `${i+1}`;\n\n  ele.addEventListener('click',\
    \ () => {\n\n      document.body.style.backgroundColor = ele.style.backgroundColor;\n\
    \n  });\n\n  ele.onmouseover = (e) => {\n\n  }\n\n  ele.addEventListener('mouseover',\
    \ () => {\n\n      logger(`mouseOver ${i+1}`);\n\n  })\n\n  ele.addEventListener('mouseleave',\
    \ () => {\n\n      logger(`mouseLeave ${i+1}`);\n\n  })\n\n  ele.addEventListener('mouseout',\
    \ () => {\n\n      logger(`mouseOut ${i+1}`);\n\n  })\n\n  ele.addEventListener('mousedown',\
    \ () => {\n\n      logger(`mouseDown ${i+1}`);\n\n  })\n\n  ele.addEventListener('mouseup',\
    \ () => {\n\n      logger(`mouseUp ${i+1}`);\n\n  })\n\n  ele.addEventListener('mouseenter',\
    \ () => {\n\n      logger(`mouseEnter ${i+1}`);\n\n  })\n\n  div.append(ele);\n\
    \n}\n\nfor (let i = 0; i < 10; i++) {\n\n const ele = document.createElement('input');\n\
    \n  ele.style.display = 'block';\n\n  ele.setAttribute('type', 'text');\n\n  ele.value\
    \ = `${i+1} Input value`;\n\n  div.append(ele);\n\n  ele.onfocus = () => {\n\n\
          ele.style.color = 'red';\n\n  }\n\n  ele.addEventListener('focusout', ()\
    \ => {\n\n      ele.style.color = 'black';\n\n  });\n\n  ele.onchange = () =>\
    \ {\n\n      ele.style.backgroundColor = 'blue';\n\n  }\n\n  ele.onkeydown = (e)\
    \ => {\n\n if (e.key === 'Enter') {\n\n          adder(ele.value);\n\n         \
    \ console.log(ele.value);\n\n      }\n\n  }\n\n}\n\ndocument.addEventListener('keydown',\
    \ tracker);\n\ndocument.addEventListener('keyup', tracker);\n\nfunction  adder(val)\
    \ {\n\n  console.log(val);\n\n const li = document.createElement('li');\n\n  li.textContent\
    \ = val;\n\n  ul.append(li);\n\n}\n\nfunction  tracker(e) {\n\n  console.log(e.key);\n\
    \n}\n\nfunction  logger(val) {\n\n  console.log(val);\n\n  output.innerHTML =\
    \ val;\n\n}\n\nfunction  updateColor() {\n\n  document.body.style.backgroundColor\
    \ = ranColor();\n\n}\n\nfunction  ranColor() {\n\n return  `#${Math.random().toString(16).slice(2,8)}`;\n\
    \n}\n\n# Page Element Smooth Animations\n\nJavaScript RequestAnimationFrame()\
    \ method provides a smooth Animation for page elements.  RequestAnimationFrame()\
    \ tells the browser the an animation is being performed, and reuqests the browser\
    \ call a specific function to update the page with the new animation before the\
    \ next repaint.  The callback as an argument is the function that should be invoked\
    \ before the next repaint occurs. In this example the code is used to create a\
    \ bouncing ball the is an element on the page the moves smoothly across the page. \
    \ The style values of its position on the page are updated with code setting the\
    \ top and left values.\n\nThe requestAnimationFrame() method can be used to create\
    \ smooth animations within your web page elements.  The browser then calls a specified\
    \ function that can update an animation before the next repaint. The method takes\
    \ a callback as an argument to be invoked before the repaint so that you can continue\
    \ the animation function.\n\n![](Images/image00457.jpeg)\n\nLesson Coding Exercise:\n\
    \n1.  Select the HTML element that will be used as the parent container\n\n2.\
    \  Create an element div for displaying the score to the user, create a div that\
    \ will be the ball in the Lesson Coding Exercise .\n\n3.  Update the style properties\
    \ for the elements, round the ball, position needs to be relative or absolute\
    \ to be able to move the element on the screen.\n\n4.  Create a global object\
    \ to hold the x,y and the x direction and y direction.  Include the speed and\
    \ other values needed for the game.\n\n5.  Assign to a variable the requestAnimationFrame()\
    \ then create a function that will run the movement.\n\n6.  In the animation frame\
    \ function, check the pos of x and y ensure the values are within the boundaries\
    \ of the parent, if not change the direction by multiplying the direction value\
    \ by -1\n\n7.  Update the ball positions and apply the new position to the style\
    \ left and top values.\n\n8.  Within the animation function, request the animation\
    \ frame to keep the animation going.\n\n9.  Add an event for keydown values, if\
    \ enter is pressed cancel the animation, or restart the animation.\n\n10.  Add\
    \ an event listener on the ball, if clicked update the score and reset the position\
    \ and color of the ball.\n\n11.  Create a score update function that will be invoked\
    \ every time there is a score update.\n\nconst div = document.querySelector('div');\n\
    \nconst score = document.createElement('div');\n\nscore.style.textAlign = 'center';\n\
    \ndocument.body.prepend(score);\n\nconst ball = document.createElement('div');\n\
    \nball.style.border = '3px solid white';\n\ndiv.innerHTML = '';\n\ndiv.style.width\
    \ = '500px';\n\ndiv.style.height = '400px';\n\ndiv.style.backgroundColor = 'black';\n\
    \ndiv.style.margin = 'auto';\n\ndiv.style.overflow = 'hidden';\n\nconst pos =\
    \ {\n\n x:100,\n\n y:100,\n\n dx:1,\n\n dy:1,\n\n speed:5,\n\n move:true,\n\n\
    \ score:0\n\n}\n\nadderScore();\n\ndiv.append(ball);\n\nball.style.backgroundColor\
    \ = 'red';\n\nball.style.height = '50px';\n\nball.style.width = '50px';\n\nball.style.borderRadius\
    \ = '50%';\n\nball.style.position = 'relative';\n\nball.onclick = gameHit;\n\n\
    let mover = requestAnimationFrame(ani);\n\ndocument.addEventListener('keydown',(e)=>{\n\
    \n  console.log(e.key);\n\n if(e.key === 'Enter') {\n\n if(pos.move){\n\n         \
    \ pos.move = false;\n\n          cancelAnimationFrame(mover);\n\n      }else{\n\
    \n          pos.move = true;\n\n          mover = requestAnimationFrame(ani);\n\
    \n      }\n\n  }\n\n})\n\nfunction  gameHit(){\n\n  pos.score++;\n\n  ball.style.backgroundColor\
    \ = `#${Math.random().toString(16).slice(2,8)}`;\n\n  adderScore();\n\n  pos.x\
    \ = Math.floor(Math.random()*450);\n\n  pos.y = Math.floor(Math.random()*350);\n\
    \n  ball.style.left = `${pos.x}px`;\n\n  ball.style.top = `${pos.y}px`;\n\n}\n\
    \nfunction  adderScore(){\n\n  score.innerHTML = `<div>Score :${pos.score}</div>`;\n\
    \n}\n\nfunction  ani(){\n\n  pos.move = true;\n\n if(pos.move){\n\n if(pos.x >\
    \ 450 || pos.x < 0){\n\n          pos.dx *= -1;\n\n      }\n\n if(pos.y > 350\
    \ || pos.y < 0){\n\n          pos.dy *= -1;\n\n      }\n\n      pos.x += pos.speed\
    \ * pos.dx;\n\n      pos.y += pos.speed * pos.dy;\n\n      ball.style.left = `${pos.x}px`;\n\
    \n      ball.style.top = `${pos.y}px`;\n\n  }\n\n  mover = requestAnimationFrame(ani);\n\
    \n}"
