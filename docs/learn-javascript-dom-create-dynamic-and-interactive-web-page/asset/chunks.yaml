  trans: "\n数组是具有预设项目顺序的对象，通过元素的索引来选择和标识列表中的元素。数组还具有内置方法，这些方法使其成为数据以及操作和选择数组中包含项目的强大方式。对象也可以在同一个变量中包含多个项目，它们通过属性名进行标识，该属性名用于从对象中选择项目。每个属性名在对象中只能使用一次，且是唯一的。属性名可以使用引号设置或作为单个单词在对象中设置。它们与属性名成对赋值值，使用冒号分配值，并用逗号分隔多个命名的对值。\n\
    \n### JavaScript 编码练习\n\n1. 创建一个包含各种数据类型的数组。\n2. 创建一个包含各种数据类型的对象。\n3. 从数组和对象中检索一个值并将其输出到控制台。\n\
    4. 尝试同时使用点符号表示（dot notation）和方括号表示（bracket notation）获取对象内部的值。\n5. 使用数组的索引值和对象的属性名更新数组和对象的值。\n\
    6. 声明一个新变量并将现有数组赋值给新变量。修改新变量的内容并观察第一个数组是否也随之更新。\n\n```javascript\nconst arr1 =\
    \ ['one',100,false,null,[1,2,3]];\n\nconst obj1 = {\n  first:'Laurence',\n  'full\
    \ Name':'Laurence Svekis',\n  id : 100,\n  status : true,\n  arr : [1,2,3,'Hello\
    \ World']\n};\n\nconst arr2 = arr1;\n\nconst obj2 = obj1;\n\nobj2.id = 5000;\n\
    arr2[0] = 'Hello World';\narr1[3] = `Laurence Svekis`;\nobj1.first = `Linda Jones`;\n\
    \nlet val = arr1[4][0];\nval = obj1['full Name'];\nval = obj1.first;\nval = obj2.arr[3];\n\
    console.log(val);\ndocument.write(val);\n```\n\n# JavaScript 函数\n\n探索如何在代码中使用函数来运行代码块。尝试避免重复代码，函数提供了一种运行代码块的极佳方式。\n\
    \n- 函数可用于运行代码块\n- 两种类型的函数：函数表达式（Function Expression）和函数声明（Function declaration）\n\
    - 函数可以接收\n- 函数命名规则与变量相同\n- 你可以在括号内向函数传递值，参数名可以用逗号分隔以添加多个值\n- 当函数被调用时，参数被称为函数参数（arguments），它们是函数在参数中接收的值\n\
    - 函数可以返回；`return` 语句将结束函数执行并返回值\n- 函数在花括号内具有作用域。函数作用域内的局部值只能在函数内部访问\n- 函数的益处是你可以编写一次代码并根据需要重复使用。你可以通过不同的参数值和返回值获得不同的结果。\n\
    \n函数允许开发者运行代码块，当函数运行时，是在定义函数并调用函数时执行代码的。函数在代码中提供了一种运行代码块的强大方式，它们还包含自己的作用域，因此在函数内部设置的变量只在该函数内存在。在代码中创建函数来完成重复的任务并处理特定的编码目标。你可以向函数传递值，然后在函数代码中使用这些值，并从函数代码返回结果。函数可以在参数中使用参数，尽管这不是强制的。函数也可以使用\
    \ `return`，尽管不是强制从函数返回响应。你可以向函数传递值以便在代码中使用。\n\n函数有两种类型：使用 `function` 关键字分配函数代码的函数声明，或者类似于给变量赋值的函数表达式（但在这种情况下赋值的是函数代码）。\n\
    \n```javascript\n// Function declaration\nfunction test(num) {\n  return num;\n\
    }\n\n// Function expression\nvar test = function (num) {\n  return num;\n};\n\
    ```\n\n### JavaScript 编码练习\n\n1. 创建一个全局值，每执行一次函数时都会递增。在每个函数中添加该值的增量。`counter++`。\n\
    2. 创建一个函数表达式，在其代码内部可以将一个值输出到控制台。\n3. 调用函数。为函数更新一个参数，让函数使用该参数值并将该值输出到控制台。\n4. 创建一个函数声明。添加\
    \ 3 个参数，它们将接收值并将它们全部相加。使用 `return` 返回传入函数的值的总和。\n5. 将函数的返回值赋值给变量，并将变量输出到网页上。\n\
    \n```javascript\nconst fun1 = function (val) {\n  counter=counter+val;\n  const\
    \ output = `<div>Hello ${counter}</div>`;\n  document.write(output);\n}\n\nlet\
    \ counter = 0;\nlet word = '';\n\nfun1(21);\nfun1(2);\nfun1(3);\nfun2('h');\n\
    fun2('e');\nfun2('l');\nfun2('l');\nfun2('o');\n//fun1 = 100;\n\nconsole.log(fun1);\n\
    const fun5 = fun1;\nfun5(1000);\n\nfunction fun2(val){\n  word = word + val;\n\
    \  counter++;\n  let output = `<div>Hello ${counter}</div>`;\n  document.write(output);\n\
    }\n\nlet valTotal = 0;\nvalTotal += fun3(10,44,55);\n\nfunction fun3(num1,num2,num3){\n\
    \  let total = num1 + num2 + num3;\n  console.log(total);\n  return total;\n}\n\
    \nconst temp = 5000;\nfun4(100);\n\nfunction fun4(val){\n  const temp = 9;\n \
    \ const myVal = val + temp;\n  console.clear();\n  console.log(myVal);\n}\n```\n\
    \n# 用于交互页面的 DOM\n\nJavaScript 可以通过事件监听器创建交互内容。事件监听器等待用户执行操作，从而触发事件的发生。DOM 可以表示页面元素。文档模型（DOM）是页面的数据表示。DOM\
    \ 以树状结构组织，作为构成网页和 HTML 文档的对象。DOM 是 HTML 文档的编程接口，即如何访问和页面内容。使用 JavaScript 让你的网页活跃起来。DOM\
    \ 和 JavaScript 允许你在不刷新网页的情况下创建向用户展示新元素和更新的内容。\n\n### JavaScript 编码练习\n\n1. 创建你的\
    \ HTML 文件并添加页面元素\n2. 将 `document.body.children` 数组赋值给变量，它将代表 body 内的所有子元素。\n3.\
    \ 选择第一个元素使用索引值 `0`，就像数组一样基于索引。使用 `console.dir()` 输出对象。\n4. 从元素中选择一些属性并将其输出到控制台。\n\
    5. 将元素的 `textContent` 更新为你的名字。\n6. 打开喜欢的网站并打开开发者工具，输入 `document.body.textContent\
    \ = \"Laurence Svekis\"`。\n\n```html\n<!doctype html>\n<html>\n<head>\n <title>JavaScript</title>\n\
    </head>\n<body>\n<div id=\"one\" class=\"red\">Hello World 1</div>\n<div>Hello\
    \ World 2</div>\n<script src=\"dom1.js\"></script>\n</body>\n</html>\n```\n\n\
    ```javascript\nconst ele = document.body.children[0];\nconsole.dir(ele);\n\nlet\
    \ val = 'Laurence Svekis';\ndocument.body.children[0].textContent = val;\n\nele.textContent\
    \ = 'UPDATED';\n```\n"
- fmt: "\n# JavaScript to select Page Elements\n\nDOM methods with JavaScript can\
    \ be used to select HTML page elements. Once the element has been selected, the\
    \ properties can then be manipulated using code.\n\nThere are methods in the `Document`\
    \ object that allow us to better select elements we want to manipulate with code.\
    \ `querySelector()` and `querySelectorAll()` allow JavaScript to select page elements\
    \ from the content within the document object.\n\nJavaScript `querySelectorAll`\
    \ Get Page Elements Select ALL. Use of `querySelector` and `querySelectorAll`\
    \ to select matching page elements. Different selectors including tag, id, and\
    \ class. Select page element, iterate contents of node list output and update\
    \ page elements.\n\n## Lesson JavaScript Coding Exercise:\n\n1. Update your HTML\
    \ to include 2 `div`s and an `input` element.\n2. Using `querySelector()` and\
    \ `querySelectorAll()` select all the page elements and assign variables to the\
    \ page element objects.\n3. Update the text content of the first element.\n4.\
    \ Assign a value to the input element `myInput.value`.\n5. Update some of the\
    \ style properties of the second `div` to make it look more like a button.\n6.\
    \ Add an event listener to the button, that assigns a function to the element\
    \ click event `onclick`.\n7. Within the `click` function get the value of the\
    \ input, update the `textContent` of the first `div` to be the value of the input\
    \ field. Assign a black string to the input field value.\n\n```html\n<div id=\"\
    one\" class=\"red\">Hello World 1</div>\n<input type=\"text\">\n<div>Hello World\
    \ 2</div>\n```\n\n```javascript\nconst ele1 = document.querySelector('div');\n\
    const ele2 = document.querySelector('#one');\nconst ele3 = document.querySelector('.red');\n\
    \nele1.textContent = 'Laurence Svekis';\n\nconst eles = document.querySelectorAll('div');\n\
    \nconsole.log(ele1);\nconsole.log(ele2);\nconsole.log(ele3);\nconsole.dir(eles);\n\
    \neles[0].textContent = 'Hello World';\nconsole.log(ele1.textContent);\n\nconst\
    \ myInput = document.querySelector('input');\nconsole.log(myInput.value);\nmyInput.value\
    \ = 'Laurence';\n\neles[1].textContent = 'Click Me';\neles[1].style.border = '1px\
    \ solid black';\neles[1].style.width = '200px';\neles[1].style.textAlign = 'center';\n\
    eles[1].onclick = clicker;\n\nfunction clicker(){\n  let temp = myInput.value;\n\
    \  ele2.textContent = temp;\n  myInput.value = '';\n}\n```\n\n# Apply Logic with\
    \ Conditions\n\nLogic Conditions can be used to create different responses depending\
    \ on the current Boolean response from a condition. Depending on the number of\
    \ conditions in the statement various JavaScript syntax can be used such as `if`\
    \ statement, `Switch` statement or the ternary operator. All can be used to return\
    \ a response dependent on the condition that is being checked.\n\nConditions can\
    \ be used within code to apply logic, and run different actions based on the result\
    \ of the condition. Depending on the value either `True` or `False` the code can\
    \ run different blocks of code.\n\nThe `if` statement will check a condition,\
    \ if true it runs the specified code. If false it does not run the code. `Else`\
    \ provides an alternative if the condition is not true then `else` statement allows\
    \ us to run a block of code on false if none of the previous conditions are true.\
    \ You can also use the `else if` statement to check another condition with a separate\
    \ block of code to be run if the previous condition came back as false.\n\nUsing\
    \ the `switch` statement allows us to specify several alternatives checking to\
    \ see if any of the conditions match and allow the corresponding code to be executed.\n\
    \nJavaScript code can use Comparison Operators to check if a statement is true\
    \ or false. To check multiple conditions, you can apply Logical Operators to check\
    \ logic between conditions. The example below will show how to use the Logical\
    \ operators and the results that can be expected with the various combinations\
    \ of true or false.\n\n## Lesson JavaScript Coding Exercise:\n\n1. Select the\
    \ page elements you want to use assign variables to them.\n2. Create a global\
    \ value for `counter` of 0.\n3. Once the button is clicked increment the `counter`\
    \ by 1.\n4. Check to see if the `counter` value is less than 2, if that's true\
    \ then update the style color to red.\n5. Add an `else if` to the condition, checking\
    \ if the value of `counter` is less than 4, if it is then updating the style color\
    \ to green for the output element.\n6. Add an `else if` to the condition, checking\
    \ if the value of `counter` is less than 6, if it is then updating the style color\
    \ to purple for the output element.\n7. Using `else if` none of the conditions\
    \ are true update the style of the element to be blue.\n8. Create a `switch` to\
    \ check for values of the `counter`. Create `cases` for the values you want to\
    \ track, update the output area text with different string values depending on\
    \ the case. Try the `switch` with and then without the `break` keyword.\n9. Add\
    \ in a `default` within the `switch` statement.\n\n```html\n<!doctype html>\n\
    <html>\n<head>\n  <title>JavaScript</title>\n</head>\n<body>\n<div>Hello World\
    \ 1</div>\n<input type=\"text\">\n<button type=\"button\">Click</button>\n<script\
    \ src=\"dom3.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst output\
    \ = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\nmyInput.value = 'Laurence';\nlet\
    \ counter = 0;\n\nbtn.onclick = () => {\n  counter++;\n  if (counter < 2) {\n\
    \    output.style.color = 'red';\n  } else if (counter < 4) {\n    output.style.color\
    \ = 'green';\n  } else if (counter < 6) {\n    output.style.color = 'purple';\n\
    \  } else {\n    output.style.color = 'blue';\n  }\n};\n\nfunction updater() {\n\
    \  let val = '';\n  switch (counter) {\n    case 0:\n      val = `Case #1 ${counter}`;\n\
    \      break;\n    case 1:\n      val = `Case #2 ${counter}`;\n      break;\n\
    \    case 3:\n      val = `Case #3 ${counter}`;\n      break;\n    default:\n\
    \      val = `DEFAULT ${counter}`;\n  }\n  output.innerText = val;\n}\n```\n\n\
    # JavaScript Operators\n\nOperators in JavaScript can be used to perform arithmetic\
    \ on numbers, assign values to variables, concatenate string values and do comparisons\
    \ between values. JavaScript also has methods that can convert different data\
    \ types to ensure the expected result. When strings are added to numbers the result\
    \ is a string. There are several methods in JavaScript that can help ensure the\
    \ code will work smoothly for these operations.\n\n## Lesson JavaScript Coding\
    \ Exercise:\n\n1. Get the value of the input field. Convert the value to a number\
    \ using `Number()` method.\n2. In the condition check if the result of the input\
    \ is an actual number using `isNaN()`.\n3. Using the modulus check if the value\
    \ of the input is odd or even. If it has a remainder, it will be odd otherwise\
    \ it is even.\n4. Perform math calculations on the input value and output the\
    \ results back to the user in the output field.\n\n```javascript\nconst output\
    \ = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\nlet a = b = 100;\nlet c = a * b\
    \ / 100;\nlet d = 504 % 50;\n\na = a + 1;\na++;\na--;\nconsole.log(a);\nconsole.log(d);\n\
    \nlet e = 10;\ne *= a;\nconsole.log(e);\n\nconsole.clear();\nconsole.log('5' ==\
    \ 5);\nconsole.log('5' === 5);\nconsole.log('5' != 6);\nconsole.log('5' !== 5);\n\
    console.log(10 <= 10);\nconsole.log(('5' == 5) && true);\nconsole.log(('5' ==\
    \ 5) && false);\nconsole.log(('5' != 5) || true);\nconsole.log(('5' == 5) || false);\n\
    \nbtn.onclick = () => {\n  let val = Number(myInput.value);\n  console.log(typeof\
    \ val);\n  console.log(isNaN(val));\n  let html = `<div>Results ${val}</div>`;\n\
    \  if (!isNaN(val)) {\n    html += `<div>Was a number</div>`;\n  } else {\n  \
    \  html += `<div>NOT a number</div>`;\n  }\n  if (val % 2) {\n    html += `<div>Odd\
    \ number</div>`;\n  } else {\n    html += `<div>Even number</div>`;\n  }\n  html\
    \ += `<div>${val * 50} = ${val} X 50</div>`;\n  html += `<div>${val / 10} = ${val}\
    \ / 10</div>`;\n  output.innerHTML = html;\n};\n```\n"
