    \ Math.floor(deck.length / game.players);\n\n let end = start + num;\n\n for (let\
    \ i = 0; i < game.players; i++) {\n\n const el = maker(gameArea, 'div', 'player',\
    \ ``);\n\n const ele = maker(el, 'div', 'info', `${i+1} Player`);\n\n const card\
    \ = maker(el, 'div', 'card', ``);\n\n      game.view.push(card);\n\n      game.cards[i]\
    \ = deck.slice(start, end);\n\n const score = maker(el, 'div', 'score', ``);\n\
    \n const cardLeft = maker(score, 'div', 'box', `${game.cards[i].length} left`);\n\
    \n const cardPlayed = maker(score, 'div', 'box', '');\n\n      game.s.push(score);\n\
    \n      start = end;\n\n      end = end + num;\n\n  }\n\n  console.log(game.cards);\n\
    \n}\n\nfunction  buildDeck() {\n\n  cardData.suits.forEach((suit) => {\n\n     \
    \ cardData.val.forEach((v, ind) => {\n\n const bgC = (suit == 'hearts') || (suit\
    \ == 'diams') ? 'red' : 'black';\n\n const card = {\n\n suit: suit,\n\n icon:\
    \ `&${suit};`,\n\n clr: bgC,\n\n cardNum: v,\n\n cardValue: ind + 1\n\n         \
    \ }\n\n          deck.push(card);\n\n      })\n\n  })\n\n  deck.sort(() => {\n\
    \n return Math.random() - 0.5;\n\n  })\n\n}\n\nfunction  maker(par, eleType, cla,\
    \ html) {\n\n const ele = document.createElement(eleType);\n\n  ele.classList.add(cla);\n\
    \n  ele.innerHTML = html;\n\n return par.appendChild(ele);\n\n}\n\nJavaScript\
    \ DOM Dynamic Page Elements Exercises\n\nDo you want to learn more about JavaScript\
    \ and how elements work?  They are objects which can hold values just like any\
    \ other objects in JavaScript.   The three exercises below will demonstrate creating\
    \ page elements with JavaScript, how to add values to the element objects, and\
    \ how to update page elements.   There is also an exercise on how they work with\
    \ the page element objects, and the difference between function expressions and\
    \ function declarations.\n\n# DOM create Page elements adding style\n\n![](Images/image00481.jpeg)\n\
    \nCreate interactive elements that can store the current color value input an\
    \ array, for later use.  Also creates buttons to update the body background color\
    \ to the value of the button text.  Color style and events with Dynamic Elements\
    \ DOM.\n\nWhen multiple elements need to be created, best practice is to create\
    \ a function to handle the element creation, this will avoid repetition of code.\
    \ This exercise will demonstrate how to create elements, how to store values into\
    \ element objects, how to update style properties of elements, and how to remove\
    \ elements from the page.   Storing the values of the elements and retrieving\
    \ value of elements and using those element values as new page elements are created. \
    \ Use of appendChild() vs append() allows the code to return the element that\
    \ was appended to the parent.   This saves a line of code where the return of\
    \ the function can be combined with adding the element that was just created into\
    \ the page.\n\nPage elements Events and Style Exercise:\n\n1.  Using JavaScript,\
    \ create two buttons on the page.\n\n2.  Add a click event to the first button,\
    \ that when pressed should list out all the stored color values from the holding\
    \ array.  When pressed create page elements that have the color value from the\
    \ holding array and are clickable elements.  Once clicked the element should be\
    \ removed from the page.\n\n3.  The second button should store the color value\
    \ from the input field into a holding array.\n\n4.  The second button should also\
    \ create a page element button, that has the text content of the input field color\
    \ value.\n\n5.  On change of the input value update the background color to match\
    \ the input field value.\n\n<!DOCTYPE  html>\n\n<html>\n\n<head>\n\n <title>JavaScript\
    \ Course</title>\n\n</head>\n\n<body>\n\n <input  type=\"color\">\n\n <script\
    \  src=\"app4.js\"></script>\n\n</body>\n\n</html>\n\nconst myInput = document.querySelector('input[type=\"\
    color\"]');\n\nconsole.log(myInput);\n\nconst holder = [];\n\nconst main = document.createElement('div');\n\
    \nconst btn = document.createElement('button');\n\nconst btn2 = document.createElement('button');\n\
    \nbtn.textContent = \"Save Color\";\n\nbtn2.textContent = \"List Saved Colors\"\
    ;\n\ndocument.body.prepend(btn);\n\ndocument.body.prepend(btn2);\n\ndocument.body.prepend(main);\n\
    \nconsole.log(main);\n\nbtn2.onclick = ()=>{\n\n  holder.forEach((ele)=>{\n\n\
          const span = document.createElement('span');\n\n      main.append(span);\n\
    \n      span.style.width = '50px';\n\n      span.style.height = '50px';\n\n     \
    \ span.style.display = 'inline-block';\n\n      span.style.backgroundColor = ele;\n\
    \n      span.onclick = ()=>{\n\n          span.remove();}\n\n  })\n\n}\n\nbtn.onclick\
    \ = ()=>{\n\n  holder.push(myInput.value);\n\n  const btn1 = document.createElement('button');\n\
    \n  main.append(btn1);\n\n  btn1.textContent = myInput.value;\n\n  btn1.style.backgroundColor\
    \ = myInput.value;\n\n  btn1.style.color = 'white';\n\n  btn1.onclick = ()=>{\n\
    \n      document.body.style.backgroundColor = btn1.textContent;\n\n  }\n\n}\n\n\
    myInput.onchange = (e)=>{\n\n  console.log(e.target.value);\n\n  console.log(myInput.value);\n\
    \n  document.body.style.backgroundColor = myInput.value;\n\n}\n\n# Dynamic Carousel\
    \ Slider from JSON data\n\nSliders are a commonly used component within web pages. \
    \ They provide a way to display content and create interaction for the user. \
    \ When the web page user is engaged in the page element, they are more likely\
    \ to read and remember the content being presented.  Sliders, slideshow, Carousel\
    \ are various ways this component is referred to on the web.  The functionality\
    \ of the component allows for cycling through elements, which can be images text\
    \ or others.  The carousel or slider is a slideshow for cycling through a series\
    \ of content that the user can control.  They can move through the content with\
    \ the previous or next item buttons.\n\n![](Images/image00482.jpeg)"
