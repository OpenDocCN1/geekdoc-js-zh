    \n      arr.reverse();\n\n  }\n\nhtml += `<div>${arr.toString()}</div>`;\n\n for(let\
    \ i=0;i<10;i++){\n\n      arr.sort(()=>{\n\n return Math.random() - 0.5;\n\n     \
    \ });\n\nhtml += `<div>${arr.toString()}</div>`;\n\n  }\n\n  arr.forEach((ele,ind)=>{\n\
