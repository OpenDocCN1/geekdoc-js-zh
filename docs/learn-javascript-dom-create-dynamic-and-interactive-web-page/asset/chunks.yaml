  trans: "\n```javascript\naddPlayers();\n\nbtn.addEventListener('click', (e) => {\n\
    \  const temp = [];\n  for (let i = 0; i < game.players; i++) {\n    game.s[i].lastChild.innerHTML\
    \ = '';\n    if (game.cards[i].length > 0) {\n      temp.push(i);\n    } else\
    \ {\n      const ele = game.view[i];\n      ele.innerHTML = 'X';\n      game.s[i].firstChild.innerHTML\
    \ = 'OUT';\n      ele.style.backgroundColor = '#bbb';\n    }\n  }\n  mes.innerHTML\
    \ = 'Battle has begun...';\n  gamer(temp, []);\n})\n\nfunction gamer(inPlay, holder)\
    \ {\n  const vals = [];\n  console.log(inPlay);\n  inPlay.forEach((i) => {\n \
    \   if (game.cards[i].length > 0) {\n      const ele = game.view[i];\n      const\
    \ first = game.cards[i].shift();\n      showCard(first, ele);\n      vals.push(first.cardValue);\n\
    \      holder.push(first);\n      game.s[i].lastChild.innerHTML += `${first.cardNum}${first.icon}\
    \ `;\n    }\n  })\n  const winners = [];\n  const highValue = Math.max(...vals);\n\
    \  console.log(highValue);\n  vals.forEach((e, i) => {\n    if (e >= highValue)\
    \ winners.push(inPlay[i]);\n  })\n  console.log(winners);\n  if (winners.length\
    \ > 1) {\n    mes.innerHTML += `Tie:`;\n    winners.forEach(v => {\n      mes.innerHTML\
    \ += `P${v+1} `;\n    })\n    mes.innerHTML += `...`;\n    return gamer(winners,\
    \ holder);\n  } else if (winners.length == 0) {\n    mes.innerHTML += 'No winner';\n\
    \  } else {\n    const temp = winners[0];\n    game.cards[temp].push(...holder);\n\
    \    mes.innerHTML += `Winner is Player ${temp+1}!`;\n  }\n  updateScores();\n\
    }\n\nfunction updateScores() {\n  let tempPlay = [];\n  game.s.forEach((el, i)\
    \ => {\n    const cardCount = game.cards[i].length;\n    if (cardCount) {\n  \
    \    el.firstChild.innerHTML = `${cardCount} left`;\n      tempPlay.push(i);\n\
    \    } else {\n      el.parentNode.style.opacity = 0.4;\n    }\n  })\n  if (tempPlay.length\
    \ <= 1) {\n    mes.innerHTML = `Game Over! Player ${tempPlay[0]+1} Wins`;\n  \
    \  btn.disabled = true;\n    btn.textContent = 'GAME OVER';\n  }\n}\n\nfunction\
    \ showCard(cc, ele) {\n  ele.innerHTML = `<div>${cc.cardNum}${cc.icon}</div>`;\n\
    \  ele.style.color = cc.clr;\n}\n\nfunction addPlayers() {\n  let start = 0;\n\
    \  let num = Math.floor(deck.length / game.players);\n  let end = start + num;\n\
    \  for (let i = 0; i < game.players; i++) {\n  const el = maker(gameArea, 'div',\
    \ 'player');\n    const ele = maker(el, 'div', `${i+1} Player`);\n    const card\
    \ = maker(el, 'div', 'card');\n    game.view.push(card);\n    game.cards[i] =\
    \ deck.slice(start, end);\n    const score = maker(el, 'div', 'score');\n    const\
    \ cardLeft = maker(score, 'div', `${game.cards[i].length} left`);\n    const cardPlayed\
    \ = maker(score, 'div', '');\n    game.s.push(score);\n    start = end;\n    end\
    \ = end + num;\n  }\n  console.log(game.cards);\n}\n\nfunction buildDeck() {\n\
    \  cardData.suits.forEach((suit) => {\n    cardData.val.forEach((v, ind) => {\n\
    \      const bgC = (suit == 'hearts') || (suit == 'diams') ? 'red' : 'black';\n\
    \      const card = {\n        suit: suit,\n        icon: `&suit};`,\n       \
    \ clr: bgC,\n        cardNum: v,\n        cardValue: ind + 1\n      };\n     \
    \ deck.push(card);\n    })\n  })\n  deck.sort(() => {\n    return Math.random()\
    \ - 0.5;\n  })\n}\n\nfunction maker(par, eleType, cla, html) {\n  const ele =\
    \ document.createElement(eleType);\n  ele.classList.add(cla);\n  ele.innerHTML\
    \ = html;\n  return par.appendChild(ele);\n}\n```\n\n# JavaScript DOM 动态元素练习\n\
    \n你想了解更多关于 JavaScript 以及元素是如何运作的吗？元素是对象，可以像 JavaScript 中的其他对象一样存储值。以下三个练习将演示如何使用\
    \ JavaScript 创建页面元素、如何向元素对象添加值以及如何更新页面元素。此外，还有一个关于它们如何与页面元素对象交互，以及函数表达式与函数声明之间区别的练习。\n\
    \n## DOM 创建页面元素并添加样式\n\n![](img/image00481.jpeg)\n\n创建交互式元素，将当前的颜色值输入存储在数组中以供日后使用。同时创建按钮，将\
    \ body 的背景颜色更新为按钮文本的值。\n\n## 动态元素 DOM 中的颜色样式与事件\n\n当需要创建多个元素时，最佳实践是创建一个处理元素创建函数，这可以避免代码重复。此练习将演示如何创建元素、如何将值存储元素对象、如何更新元素的样式属性以及从页面中移除元素。存储元素的值、获取元素的值，并将这些元素值用于创建新的页面元素。使用\
    \ `appendChild()` 与 `append()` 的区别允许代码返回被添加到父元素的元素。这可以节省了一行代码，因为可以将函数的返回值与将新创建的元素添加到页面合并。\n\
    \n### 页面元素事件与样式练习：\n\n1. 使用 JavaScript 在页面上创建两个按钮。\n2. 为第一个按钮添加点击事件，按下时应列出存储数组中所有存储的颜色值。按下时，创建具有存储数组中颜色值且是可点击的页面元素。一旦点击，该元素应从页面上被移除。\n\
    3. 第二个按钮应将输入框中的颜色值存储到存储数组中。\n4. 第二个按钮还应创建一个页面元素按钮，其文本内容为输入框颜色值的值。\n5. 当输入值改变时，更新背景颜色以匹配输入值。\n\
    \n"
- fmt: "\nThe content that gets displayed in the carousel is not contained in the\
    \ JavaScript file. This example will help demonstrate how to separate data, which\
    \ then can be updated without having to update the code. The code and logic within\
    \ the code should work independently of the data. Change the JSON file data and\
    \ should change the output in the HTML web page without breaking the JavaScript\
    \ code. The JSON file data has four properties (`\"title\": \"slide 1\", \"html\"\
    : \"<h1>Laurence</h1>\", \"back\": \"purple\", \"color\": \"white\"`) to add more\
    \ or remove properties will require an update to the JavaScript code. JSON data\
    \ items in the array should all have the same properties names and values attached\
    \ to them; structure is important within JSON to be able to properly use the data\
    \ contained with the JSON data.\n\nUsing JSON data, load the json file when the\
    \ DOM content is loaded. Create the page slides dynamically with JavaScript code.\
    \ Add interaction to navigate between slides listening for clicks on the buttons.\n\
    \n# JSON slides navigate slides with JavaScript Exercise\n\n1. Select the main\
    \ slider element as a variable named `slider` in JavaScript.\n2. Create a function\
    \ that gets invoked once the DOM content loads. Give the function a name of `adder()`.\n\
    3. Within `adder()`, create the slides, using the data from the JSON file, apply\
    \ the text title, `html` content, and styling to the slide elements. Add them\
    \ to the page.\n4. If it's the first item in the data then add the class of `active`\
    \ to the first one only.\n5. Add an event listener to the buttons, when clicked\
    \ check if it contains the `next` class, create a function named `mover()` to\
    \ handle the result.\n6. Get the current element with the `active` class. Using\
    \ traversing, get the next sibling to the current element, if no next element\
    \ exists then select the first child of the parent `slider` element.\n7. Get the\
    \ previous element if it's null then select the last child of the parent slider.\n\
    8. Remove the `active` class for the current element, add the `active` class to\
    \ the new element either previous or next.\n\n## HTML and CSS\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n <title>JavaScript Course</title>\n <style>\n * {\n \
    \ box-sizing: border-box;\n }\n .main {\n  width: 90vw;\n  margin: auto;\n  background-color:\
    \ black;\n  position: relative;\n  height: 300px;\n  overflow: hidden;\n  color:white;\n\
    \ }\n .slide {\n  text-align:center;\n  position: absolute;\n  top: 0;\n  left:\
    \ 0;\n  width: 100%;\n  height: 100%;\n  background-color: blue;\n  opacity: 0;\n\
    \ }\n .slide.active {\n  opacity: 1;\n }\n .btn {\n  position: absolute;\n  bottom:\
    \ 2rem;\n  padding: 10px;\n  background-color: rgba(0, 0, 0, 0.5);\n  border-radius:\
    \ 10px;\n  font-size: 0.9em;\n  color: white;\n  cursor:pointer;\n }\n .btn:hover{\n\
    \  background-color: rgb(0, 0, 0);\n }\n .next {\n  right: 3rem;\n }\n .prev {\n\
    \  left: 3rem;\n }\n </style>\n</head>\n<body>\n <div class=\"main\">\n  <div>\n\
    \   <div class=\"slider\">\n   </div>\n   <div class=\"prev btn\">< Prev</div>\n\
    \   <div class=\"next btn\">Next ></div>\n  </div>\n</div>\n <script src=\"app5.js\"\
    ></script>\n</body>\n</html>\n```\n\n## JAVASCRIPT CODE\n\n```javascript\nconst\
    \ slider = document.querySelector('.slider');\nconst btns = document.querySelectorAll('.btn');\n\
    \nwindow.addEventListener('DOMContentLoaded',init);\n\nbtns.forEach(btn =>{\n\
    \  btn.onclick = ()=>{\n      console.log('clicked');\n      mover(btn.classList.contains('next'));\n\
    \  }\n})\n\nfunction mover(dir){\n const cur = document.querySelector('.active');\n\
    \  cur.classList.remove('active');\n const nex = cur.nextElementSibling || slider.firstElementChild;\n\
    \ const pre = cur.previousElementSibling || slider.lastElementChild;\n const newActive\
    \ = (dir) ? nex : pre;\n\n  newActive.classList.add('active');\n}\n\nfunction\
    \ init(){\n  fetch('app5.json')\n      .then(response => response.json())\n  \
    \    .then(data =>{\n          adder(data);\n      })\n}\n\nfunction adder(data){\n\
    \  data.forEach((item,index)=>{\n    const slide = document.createElement('div');\n\
    \    slide.classList.add('slide');\n    if(index === 0) slide.classList.add('active');\n\
    \    slide.innerHTML = item.html;\n    slide.style.backgroundColor = item.back;\n\
    \    slide.style.color = item.color;\n    slider.appendChild(slide);\n  })\n}\n\
    ```\n\n## JSON data\n\n```json\n[\n  {\n    \"title\": \"slide 1\",\n    \"html\"\
    : \"<h1>Laurence</h1>\",\n    \"back\": \"purple\",\n    \"color\": \"white\"\n\
    \  },\n  {\n    \"title\": \"slide 2\",\n    \"html\": \"<h1>Sis</h1>\",\n   \
    \ \"back\": \"blue\",\n    \"color\": \"white\"\n  },\n  {\n    \"title\": \"\
    slide 3\",\n    \"html\": \"<h1>Exercise</h1>\",\n    \"back\": \"yellow\",\n\
    \    \"color\": \"black\"\n  },\n  {\n    \"title\": \"slide 4\",\n    \"html\"\
    : \"<h1>Sis</h1>\",\n    \"back\": \"blue\",\n    \"color\": \"white\"\n  }\n\
    ]\n```\n\n## JSON data with fetch\n\n### AJAX request example\n\n1. Create 3-page\
    \ buttons to make requests. Set up an element on the page to show the output.\n\
    2. Using the first button on click, connect to a json file, and return the contents\
    \ back using fetch. Output the results of the file onto the page.\n\n### The following\
    \ JAVASCRIPT CODE:\n\n```javascript\nconst slider = document.querySelector('.slider');\n\
    const btns = document.querySelectorAll('.btn');\n\nwindow.addEventListener('DOMContentLoaded',init);\n\
    \nbtns.forEach(btn =>{\n  btn.onclick = ()=>{\n      console.log('clicked');\n\
    \      mover(btn.classList.contains('next'));\n  }\n})\n\nfunction mover(dir){\n\
    \ const cur = document.querySelector('.active');\n  cur.classList.remove('active');\n\
    \ const nex = cur.nextElementSibling || slider.firstElementChild;\n const pre\
    \ = cur.previousElementSibling || slider.lastElementChild;\n const newActive =\
    \ (dir) ? nex : pre;\n\n  newActive.classList.add('active');\n}\n\nfunction init(){\n\
    \  fetch('app5.json')\n      .then(response => response.json())\n      .then(data\
    \ =>{\n          adder(data);\n      })\n}\n\nfunction adder(data){\n  data.forEach((item,index)=>{\n\
    \    const slide = document.createElement('div');\n    slide.classList.add('slide');\n\
    \    if(index === 0) slide.classList.add('active');\n    slide.innerHTML = item.html;\n\
    \    slide.style.backgroundColor = item.back;\n    slide.style.color = item.color;\n\
    \    slider.appendChild(slide);\n  })\n}\n```\n"
