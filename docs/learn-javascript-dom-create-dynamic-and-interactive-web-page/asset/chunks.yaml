    \n# Web page dynamic welcome message\n\nThe web page exercise is a simple example\
    \ of how you can get input from a user, and then apply that input value within\
    \ JavaScript to create a dynamic web response.  Input field provides a way for\
    \ the user to interact with the web page.  To get the input value, select the\
    \ page element, then from within that element property values there is a property\
    \ name value which is holding the input field value.  Return the value in a variable\
    \ then use that value within a string response which then gets output into the\
    \ web page as a customized message to the web user.\n\nCode example of selecting\
    \ a page element, document.querySelector(), updating style property of an element\
    \ assigning a new value to the property userVal.style.borderColor, adding an event\
    \ listener to an element btn.onclick.\n\n![](Images/image00458.jpeg)\n\n![](Images/image00459.jpeg)\n\
    \nAsk the web user for their name and provide the input value back to the user\
    \ along with a welcome message.\n\nCreate a page welcome message:\n\n1.  Get the\
    \ username in the input field\n\n2.  When the button is pressed add an event that\
    \ get the username and creates a welcome message on the page\n\n3.  Add a check\
    \ to ensure the length of the input is larger than 3 characters long\n\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<head>\n\n   <title>JavaScript Course</title>\n\n</head>\n\
    \n<body>\n\n<div class=\"output\">What is you name?</div>\n\n<input type=\"text\"\
    \  name=\"userName\">\n\n<button>Submit</button>\n\n<script src=\"app.js\"></script>\n\
    \n</body>\n\n</html>\n\nconst output = document.querySelector('.output');\n\n\
    const userVal = document.querySelector('input[name=\"userName\"]');\n\nconst btn\
    \ = document.querySelector('button');\n\nuserVal.style.borderColor = '#333';\n\
    \nbtn.onclick = ()=>{\n\n if(userVal.value.length > 3){\n\n const message = `Welcome\
    \ to the site ${userVal.value}`;\n\n       output.textContent =  message;\n\n\
           userVal.style.display = 'none';\n\n       btn.style.display = 'none';\n\
    \n   }\n\n else{\n\n       output.textContent = 'Name length must be 3+ characters';\n\
    \n       userVal.style.borderColor = 'red';\n\n   }\n\n}\n\n# Function Expression\
    \ vs Declaration vs Arrow\n\nOne of the most asked questions is about functions,\
    \ and which ones to use.  There are different ways to create function and this\
    \ exercise is designed to highlight how to use them.  Along with the arrow format\
    \ for functions and use of the “this” keyword to reference the current object\
    \ within the function scope. \n\n![Graphical user interface, application Description\
    \ automatically generated](Images/image00460.jpeg)\n\nWhen objects are created,\
    \ they hold values independently as they are separate instances even if the same\
    \ function is used to create them.  As separate instances this example will demonstrate\
    \ how the function code can create independent objects, as the block of code within\
    \ the function applies the value created in the function to the parent object. \
    \ These values are then tied to the parent object and in this case to the element\
    \ that invoked the click event.\n\nObjective of this exercise is to create functions,\
    \ which can be done with as function expressions, function declarations, and using\
    \ the arrow format for the anonymous functions. There are examples of using the\
    \ different syntax.  Also, how the keyword “this” applies to the parent object\
    \ element and can track the values of the clicks separately. \n\nExercise covers\
    \ using functions and how they work.  Selecting elements using querySelector()\
    \ and adding click events with onclick.\n\nCreate 3-page counters using different\
    \ functions, expression, declaration, and arrow format.  Counters will all work\
    \ independently as the value of the total is contained within the instance of\
    \ the function object using this.\n\nPage counters with functions:\n\n1.  Select\
    \ all the page buttons\n\n2.  Create a function expression that will increment\
    \ the counter on button press\n\n3.  Create a function expression with the arrow\
    \ format that will track and increment the count on the page\n\n4.  Create a function\
    \ declaration that will track and increment the count on the page.\n\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<head>\n\n  <title>JavaScript Course</title>\n\n</head>\n\
    \n<body>\n\n<div  class=\"output\"></div>\n\n<button  class=\"btn1\">Adder 1</button>\n\
    \n<button  class=\"btn2\">Adder 2</button>\n\n<button  class=\"btn3\">Adder 3</button>\n\
    \n<script  src=\"app1.js\"></script>\n\n</body>\n\n</html>\n\nconst btn1 = document.querySelector('.btn1');\n\
    \nconst btn2 = document.querySelector('.btn2');\n\nconst btn3 = document.querySelector('.btn3');\n\
    \nconst output = document.querySelector('.output');\n\n//Function Expression\n\
    \nconst  adder2 = function(){\n\n if(!this.total) {\n\n this.total = 1;\n\n  }else{\n\
    \n this.total++;\n\n  }\n\n  output.textContent = `Total #2 : (${this.total})`;\n\
    \n}\n\nconst  adder3 = ()=>{\n\n if(!this.total) {\n\n this.total = 1;\n\n  }else{\n\
    \n this.total++;\n\n  }\n\n  output.textContent = `Total #3 : (${this.total})`;\n\
    \n}\n\nbtn1.onclick = adder1;\n\nbtn2.onclick = adder2;\n\nbtn3.onclick = adder3;\n\
    \n///Function Declaration\n\nfunction  adder1(){\n\n if(!this.total) {\n\n this.total\
    \ = 1;\n\n  }else{\n\n this.total++;\n\n  }\n\n  output.textContent = `Total #1\
    \ : (${this.total})`;\n\n}\n\n# Dynamic DOM page counters Element Objects\n\n\
    Elements are objects and can hold values just like any other object.  Expanding\
    \ on how each element can track values as separate object property values while\
    \ sharing the same function for the click event.   This exercise will demonstrate\
    \ how to get values from elements, and how to use values from elements to get\
    \ property values and apply them to other page elements.\n\n![](Images/image00461.jpeg)\n\
    \nThis exercise will demonstrate how to create page elements dynamically and how\
    \ to use a global value to easily be able to update the page contents. Use of\
    \ document.createElement() to dynamically create page elements and how to append\
    \ them to the web page with appendChild().\n\n![](Images/image00462.jpeg)\n\n\
    Dynamically create page buttons that can be used to count totals separately. \
    \ Create a button to output all the result totals.  Only using JavaScript NO HTML\
    \ elements.   Store values of the page elements, get the values from the page\
    \ elements and output the results to the web page.\n\nDynamic Page counters with\
    \ JavaScript:\n\n1.  Create a global object to set the number of buttons to be\
    \ created\n\n2.  Create a main page element that will contain all the new elements\n\
    \n3.  Create a function to create page elements, adding the element type to a\
    \ parent object.  Include a parameter in the function for the inner content of\
    \ the element.\n\n4.  Loop through and create all the buttons, set a default total\
    \ of 0 for each one.  On click create a function that will update and output the\
    \ current value of this element total.  You can add styling to the buttons\n\n\
    5.  Add a class of “btn” to each new button so that they can be distinguished\
    \ from the main total tally button.   Create a button that will output all the\
    \ current button total results.\n\n6.  When the tally button is clicked create\
    \ a function that will select all the elements with a class of “btn” and loop\
    \ through them.\n\n7.  For each element with the class of “btn” create a new list\
    \ item element, output that into an unordered list on the main page.  The list\
    \ item contents should show the element total and the element textContent.  You\
    \ can also select the style to match the button style property values.\n\n<!DOCTYPE\
    \  html>\n\n<html>\n\n<head>\n\n <title>JavaScript Course</title>\n\n</head>\n\
    \n<body>\n\n<script  src=\"app2.js\"></script>\n\n</body>\n\n</html>\n\nconst\
    \ val = {\n\n num : 2\n\n};\n\nconst main =  elemaker('div',document.body,'');\n\
    \nconst output =  elemaker('div',main,'');\n\nfor(let i=0;i<val.num;i++){"
