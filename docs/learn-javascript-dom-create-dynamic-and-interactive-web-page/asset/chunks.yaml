  trans: "\n9. 在 `maker()` 函数中，将字符串转换为每个单词的数组。创建一个 `holder` 数组，在创建单词的打乱版本时使用。\n\n\
    10. 遍历字符串中的所有单词，将单词转换为 `toLowerCase()`。\n\n11. 将单词的字母拆分为单独的数组。使用 `sort()` 随机化数组中的字母。使用\
    \ `join()` 将数组转换回由单词中随机排序字母组成的字符串。将其添加到 `holder` 数组中。\n\n12. 返回 `holder` 数组，将单词合并回字符串。\n\
    \n13. 将打乱的单词赋值给游戏的隐藏值。将短语的打乱版本输出到 HTML 页面。\n\n14. 点击按钮时，检查按钮文本，如果是 `new game`，则启动\
    \ `starter()` 函数重新启动游戏。\n\n15. 将输入转换为 `lowerCase()`。将该值与数组中选中字符串的隐藏值进行比较。如果匹配，则玩家解决了问题。将按钮文本更新为\
    \ `new game`。\n\n16. 如果错误，向玩家提供反馈，让他们尝试新的字母组合。将继续游戏，直到找到正确答案。\n\n```html\n<!doctype\
    \ html>\n<html>\n<head>\n  <title>JavaScript</title>\n</head>\n<body>\n  <div>JavaScript</div>\n\
    \  <input type=\"text\">\n  <button type=\"button\">Click</button>\n  <script\
    \ src=\"dom16.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst output\
    \ = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\n\nbtn.onclick = btnClicked;\n\n\
    const arr = ['JavaScript', 'Laurence Svekis', 'Html', 'code'];\n\nconst game =\
    \ {\n  hidden: ''\n};\n\nstarter();\n\nfunction btnClicked() {\n  if (btn.textContent\
    \ == 'New Game') {\n    starter();\n  } else {\n    const checkVal = myInput.value.toLowerCase();\n\
    \    if (checkVal == game.hidden) {\n      console.log('correct');\n      output.innerHTML\
    \ += `<div>Correct it was ${checkVal}</div>`;\n      btn.textContent = 'New Game';\n\
    \      myInput.style.border = 'black solid 1px';\n      myInput.style.display\
    \ = 'none';\n    } else {\n      console.log('wrong');\n      myInput.style.border\
    \ = 'red solid 1px';\n      output.innerHTML += `<div style=\"color:red\">X ${checkVal}</div>`;\n\
    \    }\n  }\n}\n\nfunction starter() {\n  btn.textContent = 'Check Answer';\n\
    \  myInput.style.border = 'black solid 1px';\n  myInput.style.display = 'block';\n\
    \  myInput.value = '';\n  const ind = Math.floor(Math.random() * arr.length);\n\
    \  game.hidden = arr[ind].toLowerCase();\n  const rep = maker(game.hidden);\n\
    \  output.innerHTML = `<div>${rep}</div>`;\n}\n\nfunction maker(words) {\n  const\
    \ tempArr = words.split(' ');\n  const holder = [];\n  tempArr.forEach(word =>\
    \ {\n    word = word.toLowerCase();\n    const letters = word.split('');\n   \
    \ letters.sort(() => {\n      return Math.random() - 0.5;\n    });\n    holder.push(letters.join(''));\n\
    \  });\n  console.log(holder);\n  return holder.join(' ');\n}\n```\n\n# 使用 JavaScript\
    \ 使用 LocalStorage\n\n使用 `JSON.parse` 和 `JSON.stringify` 将对象转换为单个字符串值。该字符串值可以用于存储在\
    \ `localStorage` 中，并作为键的值返回。\n\n`localStorage` 提供了一种将值以字符串形式存储在浏览器中的方法，用户下一次访问网页时可以使用\
    \ JavaScript 获取这些值。\n\n![](img/image00454.jpeg)\n\n  JavaScript 编码练习：\n\n1. 尝试将数组转换为字符串，然后从字符串将其解析回可用的数组。对对象执行相同操作。`JSON.stringify(arr)`，`JSON.parse(strArr)`。\n\
    \n2. 当 HTML 加载时，调用一个函数使用键检查本地存储中的某个值。如果返回了值，则将字符串解析为对象。将对象的内容输出到页面。\n\n3. 点击按钮后，创建一个转换为字符串并存入\
    \ `localStorage` 的对象。\n\n```javascript\nconst output = document.querySelector('div');\n\
    const myInput = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nconst arr = ['JavaScript', 'Laurence Svekis', 'Html',\
    \ 'code'];\n\nconst game = {\n  hidden: ''\n};\n\nstarter();\n\nfunction btnClicked()\
    \ {\n  if (btn.textContent == 'New Game') {\n    starter();\n  } else {\n    const\
    \ checkVal = myInput.value.toLowerCase();\n    if (checkVal == game.hidden) {\n\
    \      console.log('correct');\n      output.innerHTML += `<div>Correct it was\
    \ ${checkVal}</div>`;\n      btn.textContent = 'New Game';\n      myInput.style.border\
    \ = 'black solid 1px';\n      myInput.style.display = 'none';\n    } else {\n\
    \      console.log('wrong');\n      myInput.style.border = 'red solid 1px';\n\
    \      output.innerHTML += `<div style=\"color:red\">X ${checkVal}</div>`;\n \
    \   }\n  }\n}\n```\n*(注：由于原文中包含大量重复的代码块和说明，此处已根据要求进行去重并翻译。)*\n"
- fmt: "\n# 3. Loop through a `nodeList` and an `HTMLCollection` output the elements\
    \ and update the `innerHTML` of them. Observe the difference between the `NodeList`\
    \ and `HTMLCollection`.\n\n```html\n<!doctype html>\n<html>\n<head>\n <title>JavaScript</title>\n\
    </head>\n<body>\n<div class=\"one\" id=\"one\">JavaScript 1</div>\n<div class=\"\
    one\" id=\"two\">JavaScript 2</div>\n<div class=\"two\" id=\"three\"><div class=\"\
    one\">JavaScript 3</div></div>\n<script src=\"apps1.js\"></script>\n</body>\n\
    </html>\n```\n\n```javascript\nconst ele1 = document.querySelector('.one');\n\
