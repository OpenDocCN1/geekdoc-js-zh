    \ object, which is the object created by the browser that represents the web page\
    \ elements.  The document object has several methods that can be used to apply\
    \ coding logic.   Using the document.write() will write whatever string value\
    \ is within the rounded brackets, directly within the webpage when the code is\
    \ encountered.  We are going to cover the document object in much more detail\
    \ in the upcoming lessons.  This is just one of the many capabilities of the document\
    \ object, and how it can be used to interact with the HTML page elements directly\
    \ within the browser by JavaScript code.\n\ndocument.write('<div>Hello World 3</div>');\n\
    \ndocument.write('<div>Hello World 4</div>');\n\ndocument.write('<div>Hello World\
    \ 5</div>');\n\nLesson JavaScript Coding Exercise:\n\n1.  Create an HTML file\
    \ and a JS file.\n\n2.  Use the script tags to link to the JS file as the source\
    \ file.\n\n3.  Using the document.write() add text to the webpage.\n\n4.  Using\
    \ the document.write() add html formatted content to your webpage.\n\n# JavaScript\
    \ coding tips\n\nLearn about how to start with JavaScript and create your first\
    \ JavaScript code.\n\nThis lesson will cover how to use comments for documenting\
    \ statements and code.  Comment, when possible, to provide context to the coding\
    \ syntax, you can use either single or multiple line comments in JavaScript. \
    \ Best practice to make the code more human readable is to use indents and make\
    \ use of the whitespace to make the code readable.  Whitespace is ignored by the\
    \ browser and can be used to structure the code to make it easier to view.  Creating\
    \ code in a separate JS file and linking to it from the HTML file is the best\
    \ way to connect your HTML file to your JavaScript code.  You can use the console\
    \ for debugging and to see values.\n\nTo ensure your code works as expected, there\
    \ is syntax that you can utilize to output values and information into the browser. \
    \ Use of console.log() to output debugging data to the browser.\n\nWhitespace\
    \ is ignored in the code, use whitespace and indentation to make the code more\
    \ human readable.  Be careful not to add spacing between the syntax statements,\
    \ as this can cause errors when the code is being rendered.   Blocks of code can\
    \ be indicated using the curly brackets, this will be used within the various\
    \ code syntax in the upcoming lessons.  The curly brackets around the code, represents\
    \ a block of code meant to run together.  The indentation of the block of code\
    \ allows editors to read the code easier. \n\n{\n\n   document.write('<br>Output\
    \ Message');\n\n   document.write('<br>Output Message');\n\n}\n\nUse commenting\
    \ of single line or multiple line to provide more context of the code.   You can\
    \ debug your application by commenting statements out with the // .  Comments\
    \ are ignored by the browser and will not output into the page. \n\n/*\n\nThis\
    \ is my code!\n\nLaurence Svekis\n\n*/\n\n//alert('Hello');\n\nUse of console\
    \ methods allows you to debug and communicate from the JavaScript code into the\
    \ browser console.  This can be used to provide additional information from the\
    \ JavaScript code as it runs.  Console messages are only output into the console\
    \ of the browser and not visible by web users.\n\n![Example of console method\
    \ outputs and how they will look within a Chrome browser console.](Images/image00440.jpeg)\n\
    \nExample of console method outputs and how they will look within a Chrome browser\
    \ console.\n\nconsole.log('Hello');\n\nconsole.error('Hello');\n\nconsole.info('Hello');\n\
    \nconsole.warn('Hello');\n\n//console.clear();\n\nconsole.log('New line');\n\n\
    Window object is the parent of the document object.   The window object is the\
    \ top parent and contains various methods that can be used.  The alert() and the\
    \ prompt() are both part of the windows object.   You can use these to create\
    \ an interaction with the user.  Both will show a standard popup message in the\
    \ browser, which must be actioned before the user can interact with the rest of\
    \ the browser window.  Although they provide a simple way to interact with the\
    \ user, these are not commonly used, since the user experience is poor and there\
    \ are more interactive options now in JavaScript and the DOM.  Alerts and prompts\
    \ are meant for interaction with the web user.\n\nStart by creating an index.html\
    \ and app.js file.  Then write some JavaScript code and try it out.  Open and\
    \ run the HTML file in your browser.   You can use the functions from the lesson\
    \ such as alert() or document.write(‘Hello’);  Alert stops the code execution,\
    \ if on top it does not output the content until the button is clicked.  Place\
    \ JavaScript at the bottom so the rest of the code can render.\n\nAlert window.\n\
    \n![window alert() popup in the browser from JavaScript Code](Images/image00441.jpeg)\n\
    \nwindow alert() popup in the browser from JavaScript Code\n\nWithin your JavaScript\
    \ code you can access and run window methods, like the alert and prompt.  Both\
    \ can take in parameters for the visible output to the user.\n\nwindow.alert('Hello\
    \ World');"
