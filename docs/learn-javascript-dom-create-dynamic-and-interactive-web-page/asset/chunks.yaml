    \n此练习旨在探索 JavaScript 的更多功能，以及如何应用游戏逻辑通过代码实现所需目标。该项目还将演示如何使用代码和 CSS Grid 创建一个动态网格。无论方块的大小和数量如何，游戏都应该能够工作。\n\
