    }\n\nfunction  startGame() {\n\n   game.play = true;\n\n   btn1.style.display\
    \ = 'none';\n\n   gameboard.style.display = 'block';\n\n   message.textContent\
    \ = 'Game in Play';\n\n   mover();\n\n}\n\nfunction  maker(parent, t, html, c)\
    \ {\n\n const ele = document.createElement(t);\n\n   ele.innerHTML = html;\n\n\
       ele.classList.add(c);\n\n return parent.appendChild(ele);\n\n}\n\n# DOM element\
    \ catching Game Final Code\n\nCreate and update the code with game logic, the\
    \ allows a player to get information and have information on what is expected. \
    \ There should also be a way to end the game and provide the player a way to restart\
    \ and play again.\n\nBest way to achieve smooth game play is to play through the\
    \ game and apply any changes that help smooth the player experience.  Test and\
    \ debug any issues that might occur.\n\n![Chart, waterfall chart Description automatically\
    \ generated](Images/image00491.jpeg)\n\nOnce the game is playable and the game\
    \ can achieve the desired gameplay, it needs testing.  This is when the game should\
    \ be played through multiple times to ensure there are no issues.  Get others\
    \ to play the game and provide feedback.  Instructions for the player should be\
    \ clear as to the objective of the player and how to score and play the game.\n\
    \nGame play debugging and final adjustment exercise\n\n1.  Play through the game\
    \ to ensure the proper messaging for the player\n\n2.  Add an end game for the\
    \ game over once all the elements have been landed on the paddle.\n\n3.  Provide\
    \ a way for the player to restart the game, reset the scoring and all the game\
    \ play to start again.\n\n4.  Change the elements to have their own drop speeds,\
    \ apply various updates to make the game more challenging.\n\n<!DOCTYPE  html>\n\
    \n<html>\n\n<head>\n\n <title>JavaScript Course</title>\n\n <style>\n\n * {\n\n\
    \ box-sizing: border-box;\n\n       }\n\n .container {\n\n position: relative;\n\
    \n width: 90vw;\n\n margin: auto;\n\n border: 1px solid #ddd;\n\n text-align:\
    \ center;\n\n       }\n\n .gameboard {\n\n position: relative;\n\n background-color:\
    \ #ddd;\n\n min-height: 400px;\n\n       }\n\n .message {\n\n padding: 10px;\n\
    \n background-color: white;\n\n font-size: 1.5em;\n\n       }\n\n .btn {\n\n min-width:\
    \ 50%;\n\n height: 40px;\n\n font-size: 1.4em;\n\n border-radius: 10px;\n\n display:\
    \ block;\n\n margin: auto;\n\n       }\n\n .paddle {\n\n position: absolute;\n\
    \n left: 0;\n\n top: 380px;\n\n height: 20px;\n\n width: 100px;\n\n background-color:\
    \ black;\n\n       }\n\n .box {\n\n position: absolute;\n\n left: 0;\n\n top:\
    \ 0px;\n\n height: 50px;\n\n width: 50px;\n\n line-height: 30px;\n\n text-align:\
    \ center;\n\n border: 1px solid white;\n\n font-size: 1.5em;\n\n color: white;\n\
    \n opacity: 0.5;\n\n       }\n\n .box:hover {\n\n cursor: pointer;\n\n border-color:\
    \ red;\n\n       }\n\n .active {\n\n border-color: black;\n\n opacity: 1;\n\n\
           }\n\n </style>\n\n</head>\n\n<body>\n\n <div  class=\"container\">\n\n\
    \ </div>\n\n <script  src=\"app7.js\"></script>\n\n</body>\n\n</html>\n\nconst\
    \ main = document.querySelector('.container');\n\nconst info = maker(main, 'div',\
    \ '', 'info');\n\nconst gameboard = maker(main, 'div', '', 'gameboard');\n\nconst\
    \ message = maker(info, 'div', 'Click Start Button', 'message');\n\nconst btn1\
    \ = maker(info, 'button', 'Start Game', 'btn');\n\nconst paddle = maker(gameboard,\
    \ 'div', '', 'paddle');\n\npaddle.val = 5;\n\ngameboard.style.display = 'none';\n\
    \nconst game = {\n\n box: [],\n\n num: 15,\n\n ani: {},\n\n pspeed: 1,\n\n speed:\
    \ 2,\n\n width: main.offsetWidth,\n\n play: false,\n\n score: 0\n\n};\n\nbtn1.onclick\
    \ = startGame;\n\n//window.addEventListener('DOMContentLoaded', init);\n\nfunction\
    \  init() {\n\n for (let i = 0; i < game.num; i++) {\n\n const ele = maker(gameboard,\
    \ 'div', i + 1, 'box');\n\n       ele.style.backgroundColor = '#' + Math.random().toString(16).slice(2,\
    \ 8);\n\n       ele.onclick = dropper;\n\n       ele.speedVal = Math.floor(Math.random()\
    \ * 1) + 1;\n\n       ele.style.left = Math.floor(Math.random() * (game.width\
    \ - 50)) + 'px';\n\n   }\n\n}\n\nfunction  mover() {\n\n const actives = document.querySelectorAll('.active');\n\
    \n   actives.forEach((ele) => {\n\n let y = ele.offsetTop + ele.speedVal;\n\n\
           ele.style.top = y + 'px';\n\n if (y > 400) {\n\n           ele.classList.remove('active');\n\
    \n           ele.style.left = Math.floor(Math.random() * (game.width - 50)) +\
    \ 'px';\n\n           ele.style.top = '0px';\n\n       }\n\n const poff = paddle.offsetTop;\n\
    \n if (y + 50 > poff && y < poff + 20) {\n\n const x = ele.offsetLeft;\n\n const\
    \ xend = x + 50;\n\n const px = paddle.offsetLeft;\n\n const pxend = px + 100;\n\
    \n let valHit = 'MISS';\n\n if ((xend > px) && (xend < pxend)) {\n\nvalHit = 'HIT';\n\
    \n               message.style.color = 'green';\n\n               ele.remove();\n\
    \n               game.score++;\n\n} else {\n\n               message.style.color\
    \ = 'red';\n\n           }\n\n           message.textContent = `(${valHit}!) SCORE\
    \ : ${game.score} `;\n\n if (game.score >= game.num) {\n\n //GAME OVER\n\n              \
    \ game.play = false;\n\n               btn1.style.display = 'block';\n\n              \
    \ btn1.textContent = 'ReStart';\n\n               message.style.color = 'black';\n\
    \n               message.innerHTML += '<div>Game Over</div>';\n\n           }\n\
    \n //game.play =false;\n\n       }\n\n   })\n\n let paddleY = paddle.offsetLeft\
    \ + (game.pspeed * paddle.val);\n\n if (paddleY > game.width - 100 || paddleY\
    \ < 0) {\n\n       paddle.val *= -1;\n\n   }\n\n   paddle.style.left = paddleY\
    \ + 'px';\n\n if (game.play) {\n\n       game.ani = requestAnimationFrame(mover);\n\
    \n} else {\n\n       cancelAnimationFrame(game.ani);\n\n   }\n\n}\n\nfunction\
    \  dropper(e) {\n\n   console.log(this);"
