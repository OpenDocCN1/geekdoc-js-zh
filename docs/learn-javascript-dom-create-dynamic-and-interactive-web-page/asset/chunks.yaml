    # JavaScript 创建动态和交互式网页


    JavaScript 代码可用于通过浏览器选择并与 HTML 页面元素交互。网页的内容不必是静态的，通常用户更喜欢并更愿意参与到能够响应的内容中。在网页中添加
    JavaScript 可以提升用户体验，创造出一种有趣且现代的内容呈现方式。大多数网页都包含 JavaScript，学习 `DOM` 以及如何将 `JavaScript`
    与网页元素结合使用是现代 Web 开发的一项基本技能。


    本书的内容基于练习，旨在开发和提高使用 `JavaScript` 以及与网页元素交互的技能。练习以分步就进的形式呈现，并配有供尝试的挑战。学习编程最好的方法是尝试代码并观察它的运行效果。编写代码应该是乐趣的，这些练习设计得有趣且富有启发性。有大量的编码示例和源代码引导你开始编码。在学习课程的过程中，请打开你的编辑器并亲自尝试代码。这些项目是入门项目，可以在此基础上进行构建，添加更多功能并让它们变得更好。让你的想象力引导你将它们带下一个阶段。


    ![](img/image00433.jpeg)


    ![一个穿黑色衬衫的人 自动生成的描述置信度中等](img/image00434.jpeg)


    ## 关于作者


    Laurence Svekis 是一位课程作者和创作者，拥有 20 年的应用开发经验。曾在全球通过在线和线下教过超过 100 万学生。专长 `JavaScript`
    编码、Web 以及多种编程语言。Laurence 有机会为许多学生提供畅销的视频和书面内容。2019 年，Laurence Svekis 被 Google
    为 `Google Workspace` 的 `GDE`（`Google 开发者专家`）。由于对代码实现的各种功能充满热情，创建这本基于项目的书籍是一件真正快乐的事以便让他学习并尝试
    `JavaScript`。本书的内容包含许多编码练习，以实践并更多地了解如何应用 `JavaScript` 代码。请注意，虽然不需要之前的 `HTML` 和
    `CSS` 编码经验，但强烈建议具备，因为本书的内容侧重于应用 `JavaScript` 创建交互式和动态网页内容。


