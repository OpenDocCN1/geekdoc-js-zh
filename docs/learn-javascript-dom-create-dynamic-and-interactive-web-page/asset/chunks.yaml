    8. 在创建列表项的函数内部，为列表项添加 `onclick` 事件，选中该列表项并从父元素中移除它。`removeChild()`。\n9. 点击按钮时，添加一个函数来添加新的列表项，计算当前列表项的数量。在新列表项的文本中添加当前输入框的值以及\
