    ,\n\n \"back\": \"yellow\",\n\n \"color\": \"black\"\n\n   }\n\n]\n\n# AJAX JSON\
    \ data with fetch using promises\n\nExercise to demonstrate using, AJAX in JavaScript\
    \ with the Fetch method and how to get multiple JSON data files content with the\
    \ PromiseAll Method connecting to multiple URLs within one block of code.  Exercise\
    \ lesson to practice making fetch requests, using async and await with fetch and\
    \ how you can connect to multiple endpoints using promiseAll and return the results\
    \ as one object value.  This example will use three separate JSON files, all with\
    \ the same data structure, which will make it possible to combine the data into\
    \ one object once all the responses complete separately.  PromiseAll provides\
    \ a way to use promises and join the results as one chaining them together.\n\n\
    ![](Images/image00483.jpeg)\n\nFetch can be used to connect to external files,\
    \ like JSON and return the results of those data files into JavaScript code. \
    \ The data needs time to load, that is why promises are used to handle the data\
    \ once it's ready and returned from the endpoint.   Using async and await in the\
    \ function can set up the promise to wait until a response is returned.  Fetch\
    \ can do the same with the chaining of then promises to handle the data once its\
    \ arrived.  You can also use promiseAll if there are multiple files that need\
    \ to load data into one object.  Once all the data is ready then the file contents\
    \ can be used in the code and output on the page. \n\nAJAX request example code\
    \ exercise:\n\n1.  Create 3-page buttons to make requests.  Set up an element\
