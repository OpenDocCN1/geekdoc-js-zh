    \ DOM methods and add event listeners using JavaScript code. Coding examples and\
    \ exercise to learn more about JavaScript and the DOM\n\n# Background Color Table\
    \ Create Table with JavaScript\n\nThis exercise will build an interactive table\
    \ of colored cells that can be clicked to apply the cell background color to the\
