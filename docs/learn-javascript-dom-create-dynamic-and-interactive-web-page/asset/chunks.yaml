    \ will output html the number of times from the input value.\n\n6.  Create a do\
    \ while loop which will create the html output the number of times from the input.\n\
    \n7.  Update the html with the new content.\n\n<!doctype  html>\n\n<html>\n\n\
    <head>\n\n <title>JavaScript</title>\n\n</head>\n\n<body>\n\n<div>JavaScript</div>\n\
    \n<input  type=\"text\"  >\n\n<button  type=\"button\">Click</button>\n\n<script\
    \  src=\"dom7.js\"></script>\n\n</body>\n\n</html>\n\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nmyInput.setAttribute('type','number');\n\nmyInput.setAttribute('max',20);\n\n\
    myInput.setAttribute('min',0);\n\nmyInput.value = 5;\n\nbtn.onclick = btnClicked;\n\
    \nfunction  btnClicked(){\n\n  console.clear();\n\n let num = myInput.value;\n\
    \n let html = '';\n\n for(let i=0;i<num;i++){\n\n      console.log(i);\n\nhtml\
    \ += `<div>${i+1} For</div>`;\n\n  }\n\n let i = 10;\n\n while(i<num){\n\n     \
    \ i++;\n\nhtml += `<div>${i} While</div>`;\n\n  }\n\n do{\n\n      i++;\n\nhtml\
    \ += `<div>${i} Do</div>`;\n\n  }\n\n while(i<num);\n\n  output.innerHTML = html;\n\
    \n  console.log('ready');\n\n}\n\n# JavaScript Objects\n\nJavaScript objects can\
    \ be used to contain a lot of related data, this example will demonstrate how\
    \ to use Objects in code.\n\nOne of JavaScript's data types is an object.  These\
    \ can be used to store various key value pair collections and even more complex\
    \ entities. The document is a giant object that contains a lot of entities.  Learning\
    \ more about objects will help better define what can be done with the DOM entities,\
    \ how they behave and why as well as how they can be used.\n\n![](Images/image00449.jpeg)\n\
    \nLesson JavaScript Coding Exercise:\n\n1.  Select the page elements from the\
    \ HTML file as JavaScript objects.\n\n2.  Create a global object that has a value\
    \ for first, last, id and create several methods in the object.\n\n3.  Create\
    \ a method in the object that uses the first and last name values from the object\
    \ and combines them into a string, including the id and any value the is sent\
    \ to the function as an argument.\n\n4.  Create a method within the object that\
    \ can update the objects first and last name.  Generate a random value for the\
    \ object id.  Return the combined current object property values\n\n5.  When the\
    \ button is clicked update the value of the object first property\n\n6.  Output\
    \ on the page and in the console the new string invoking the methods for the fullName\
    \ from the object\n\n7.  Get the object entries as nested array values and create\
    \ a new array using the Object.entries()\n\n8.  Get and create an array with the\
    \ object keys Object.keys()\n\n9.  Get and create an array with the object values\
    \ Object.values()\n\n10.  Using the in or condition check if a key is contained\
    \ within the object\n\n11.  Loop through the properties names from an object and\
    \ output them in the console\n\n12.  Check to see the datatype of the property\
    \ value, if it's a string or number output it into the console otherwise output\
    \ a warning into the console.\n\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nmyInput.value = 'Laurence';\n\nconst myObj = {\n\
    \n first : 'Laurence',\n\n last : 'Svekis',\n\n ele : output,\n\n id : 0,\n\n\
    \ fullName  : function(val){\n\n return  `${this.first} ${this.last} ${this.id}\
    \ ${val}`\n\n  },\n\n zName(val){\n\n return  `${this.first} ${this.last} ${this.id}\
    \ ${val}`\n\n  },\n\n adder(first,last){\n\n this.first = first;\n\n this.last\
    \ = last;\n\n this.id = Math.floor(Math.random()*100)\n\n return  `${this.first}\
    \ ${this.last} ${this.id}`;\n\n  }\n\n};\n\nfunction  btnClicked(){\n\n const\
    \ newFirst = 'Laurence';\n\n const ranNum = Math.floor(Math.random()*100);\n\n\
    \ const newLast = `Svekis${ranNum}`;\n\n  console.log(myObj.adder(newFirst,newLast));\n\
    \n  output.innerHTML = `<div>${myObj.fullName('test')}</div>`;\n\n  console.log(myObj.zName('test'));\n\
    \n  console.clear();\n\n const arr1 = Object.entries(myObj);\n\n  console.log(arr1);\n\
    \n const arr2 = Object.keys(myObj);\n\n  console.log(arr2);\n\n const arr3 = Object.values(myObj);\n\
    \n  console.log(arr3);\n\n const key = myInput.value;\n\nconsole.log(myObj[key]\
    \ !== undefined);\n\n  console.log(key in myObj);\n\n for(const prop in myObj){\n\
    \n const val = myObj[prop];\n\n      console.log(typeof(val));\n\n if(typeof(val)\
    \ == 'string' || typeof(val) == 'number'){\n\n          console.log(`${prop} :\
    \ ${myObj[prop]}`);\n\n      }else{\n\n          console.warn(`Other type ${typeof(val)}`)\n\
    \n      }\n\n  }\n\n  console.log(typeof(arr1));\n\n}\n\n# Object Construction\
    \ with JavaScript coding\n\nYou can use functions to construct objects, using\
    \ the arguments within the function.  Functions can be used to construct objects,\
    \ as the function block of code will relate to the current object.  This creates\
    \ a separate instance of the block of code related to the object.\n\nLesson JavaScript\
    \ Coding Exercise:\n\n1.  Get the value from the input field, using it to create\
    \ a new object for a person.  This should set the first, last and using both of\
    \ those create a full name for the object key values.\n\n2.  Add to the function\
    \ default values in case the arguments do not have values.\n\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nmyInput.value = 'Laurence';\n\nfunction  FullName(first='Laurence',last='Svekis'){\n\
    \n //first = first || 'Laurence';\n\n this.firstName = first,\n\n this.lastName\
    \ = last,\n\n this.full = `${first} ${last}`;\n\n}\n\nfunction  btnClicked(){\n\
    \n const person = new FullName(myInput.value,'Smith');\n\n  console.log(person.full);\n\
    \n}\n\n# JavaScript Array values\n\nCommon JavaScript Array Methods to Update\
    \ Array values can be used to make use of the data in the array.  Array methods\
    \ provide a powerful way to interact with the data and use the data contained\
    \ within the array.\n\nArrays are also objects as a data type but they contain\
    \ specific properties that allow the developer to interact with the contents of\
    \ the array and its data.\n\narr.push(val); // add to array return the array length\n\
    \narr.pop(); //remove last\n\narr.shift(); //remove first item\n\narr.unshift(val);\
    \ //add to the front of array array length returned\n\narr.splice(1);  // return\
    \ array with all items after the index of 1\n\nsplice(start, deleteCount, val);\
    \ //changes the contents of an array\n\nslice(start, end);  // returns a copy\
    \ of a portion of an array into a new array\n\narr.slice(); //duplicate array\
    \ as new array\n\narr.slice(5); // return array items from index 5\n\narr.slice(1,4);\
    \ // return portion of array using slice\n\narr.toString(); // returns a string\
    \ representation of the array items"
