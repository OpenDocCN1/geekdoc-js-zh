    \ in the array, output the results to the HTML\n\n8.  Using find() return the\
    \ first match for the condition checking for a == to the input value and the array\
    \ item value.  If none is found it will return undefined.  Output the response\
    \ result into the HTML\n\n9.  Using find() return the first matching result from\
