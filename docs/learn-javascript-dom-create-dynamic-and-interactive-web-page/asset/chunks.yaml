- fmt: "\n```javascript\ntotal = arr.length * 2 < total ? arr.length * 2 : total;\n\
    \ngame.total = total / 2;\n\ndocument.addEventListener('DOMContentLoaded', makeGrid);\n\
    \nfunction makeGrid() {\n  for (let i = 0; i < total; i++) {\n    const el = maker('div',\
    \ main, '', 'box');\n    el.onclick = flipBox;\n  }\n  main.style.setProperty(`grid-template-columns`,\
    \ `repeat(${grid.y},1fr)`);\n  addBoxes();\n}\n\nfunction toggleFlip(parent, boo)\
    \ {\n  const bEle = parent.querySelector('.back');\n  const fEle = parent.querySelector('.front');\n\
    \  if (boo) {\n    bEle.style.display = 'none';\n    fEle.style.display = 'block';\n\
    \  } else {\n    bEle.style.display = 'block';\n    fEle.style.display = 'none';\n\
    \  }\n}\n\nfunction checkCards() {\n  game.pause = true;\n  let match = null;\n\
    \  let found = false;\n  game.flip.forEach((ele) => {\n    if (ele.val == match)\
    \ {\n      console.log('match found');\n      found = true;\n    } else {\n  \
    \    match = ele.val;\n    }\n    console.log(ele.val);\n  });\n  if (!found)\
    \ {\n    game.timer = setTimeout(flipback, 500);\n  } else {\n    game.score++;\n\
    \    game.flip.forEach((ele) => {\n      ele.found = true;\n    });\n    game.pause\
    \ = false;\n    game.flip.length = 0;\n    if (game.score >= game.total) {\n \
    \     message.textContent = 'Game Over';\n    }\n  }\n}\n\nfunction flipback()\
    \ {\n  game.flip.forEach((ele) => {\n    toggleFlip(ele, false);\n    ele.classList.remove('active');\n\
    \  });\n  game.pause = false;\n  game.flip.length = 0;\n}\n\nfunction flipBox(e)\
    \ {\n  const parent = e.target.parentNode;\n  const tempv = parent.classList.contains('active');\n\
    \  console.log(tempv);\n  if (!game.pause && !tempv) {\n    console.log(parent.found);\n\
    \    if (parent.found) {\n      message.textContent = 'Already Found';\n    }\
    \ else {\n      parent.classList.add('active');\n      if (game.flip.length >=\
    \ 2) {\n        toggleFlip(parent, false);\n      } else {\n        toggleFlip(parent,\
    \ true);\n      }\n      game.flip.push(parent);\n      message.textContent =\
    \ `Cards Flipped : ${game.flip.length}`;\n      if (game.flip.length >= 2) {\n\
    \        checkCards();\n      }\n    }\n  } else {\n    message.textContent =\
    \ `Can't Click Right now`;\n  }\n}\n\nfunction addBoxes() {\n  let gameItems =\
    \ total / 2;\n  const temp = [];\n  arr.sort(() => {\n    return Math.random()\
    \ - 0.5;\n  });\n  for (let i = 0; i < gameItems; i++) {\n    temp.push(arr[i]);\n\
    \  }\n  game.game = temp.concat(temp);\n  game.game.sort(() => {\n    return Math.random()\
    \ - 0.5;\n  });\n  const boxes = main.querySelectorAll('.box');\n  boxes.forEach((ele,\
    \ ind) => {\n    ele.val = game.game[ind];\n    ele.found = false;\n    const\
    \ front = maker('div', ele, game.game[ind], 'front');\n    front.style.backgroundColor\
    \ = game.game[ind];\n    front.style.display = 'none';\n    const back = maker('div',\
    \ ele, ind + 1, 'back');\n    back.style.display = 'block';\n  });\n}\n\nfunction\
    \ maker(eleType, parent, html, cla) {\n  const ele = document.createElement('div');\n\
    \  ele.classList.add(cla);\n  ele.innerHTML = html;\n  return parent.appendChild(ele);\n\
    }\n```\n\n# Dynamic Coin Flipping\n\nThe coding challenge is to create an interactive\
    \ game which loads several coins and allows the player to select what the coin\
    \ flip will return. If they are correct the score will increase by one for that\
    \ player. The code is designed to be dynamic making it easy to update new players.\
    \ This exercise is based on two parts: one will create a static number of players\
    \ and the second part will update the code to create a dynamic number of coins.\
    \ You can use JavaScript for styling or use the default HTML and CSS below. The\
    \ object is to practice and learn more about JavaScript and how JavaScript can\
    \ be used to create interactive page elements. This exercise will also provide\
    \ practice in applying game logic to make the desired outcomes within the code\
    \ using scoring.\n\n## HTML and CSS source code to create the coins and styling\
    \ for the game area\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>JavaScript</title>\n\
    \  <style>\n    .game {\n      width: 90vw;\n      margin: auto;\n      background-color:\
    \ black;\n      color: white;\n    }\n    .gameArea {\n      display: grid;\n\
    \      grid-template-columns: repeat(2, 1fr);\n    }\n    .gamer {\n      height:\
    \ 140px;\n      text-align: center;\n      background-color: white;\n      color:\
    \ black;\n      border: 1px solid black;\n      text-align: center;\n    }\n \
    \   .coin {\n      width: 70px;\n      height: 70px;\n      line-height: 80px;\n\
    \      font-size: 4em;\n      border-radius: 50%;\n      background-color: gold;\n\
    \      margin: auto;\n      border: 1px solid black;\n      text-shadow: 1px 1px;\n\
    \    }\n    .dash {\n      text-align: center;\n      padding: 10px;\n    }\n\
    \    .btn {\n      margin: 10px;\n    }\n    .score {\n      text-align: center;\n\
    \    }\n  </style>\n</head>\n<body>\n  <div class=\"game\"></div>\n  <script src=\"\
    code10.js\"></script>\n</body>\n</html>\n```\n\n## Exercise\n\nThe objective of\
    \ the game is to select the correct value in the button below the image, then\
    \ press the Flip Coin button to run the game. The correct results are scored and\
    \ the incorrect guesses are not. There are variations of this code that can be\
    \ used to create different games as different logic can be applied. Creating the\
    \ game logic and having it work independently of the number of coins provides\
    \ flexibility to update the game play. Please note that you can use different\
    \ character icons for the images, these are just an example. The character icons\
    \ can be selected and used from common web icons.\n\n1. Select the page elements\
    \ from the HTML.\n2. Create an array that contains the values `vals`, heads and\
    \ tails icons.\n3. Create a main game object with player scoring in an array `players`\
    \ and a counter for the total number of rounds that have been played.\n4. Create\
    \ the interactive page elements for the game play: Score area, game area, player\
    \ 1 and player 2 divs. Add a coin to each of the player divs. Set the default\
    \ starting values to heads, add to the coin element object a `val` to track the\
    \ current value of either 0 or 1. Add the coins into an array named `coins`.\n\
    5. Setup the dashboard for the flip coins button.\n6. Add event listeners to the\
    \ click of the buttons for the coins, these should toggle the two values of either\
    \ heads or tails (0 or 1). Create a function to update the styling accordingly.\n\
    7. Attach an event to the main coin flip button, disable the button when clicked.\
    \ Loop through the `coins` and remove the current image from the `textContent`.\
    \ Using a `setTimeout` invokes a function named `flipper`. This timeout is used\
    \ for a delay effect which will show the player the action is in play.\n8. Within\
    \ the `flipper()` function update the game rounds total counter by 1. Loop through\
    \ the `coins` array, generate a random value 0 or 1. Set the `innerHTML` to match\
    \ the boolean using the items either heads or tails. Set the coin value to 0 or\
    \ 1. Update the button setting `disabled` to `false` so the button to flip can\
    \ be clicked again. Create a function to check the results of the flip.\n9. Within\
    \ the `checker()` function parameters, pass in the coin value, the button `val`\
    \ and the `ind` value of the coin. If the coin value matches the corresponding\
    \ button value then that player will score a point. Output the results into the\
    \ message area for the player to be able to see the score.\n10. The flipping should\
    \ now be able to be clicked again resulting in another round of the game play.\n\
    \n```javascript\nconst main = document.querySelector('.game');\nconst vals = ['��',\
    \ '��'];\nconst game = {\n  players: [0, 0],\n  total: 0\n};\nconst scoreDiv =\
    \ maker('div', main, 'score', 'Score');\nconst gameArea = maker('div', main, 'gameArea',\
    \ '');\nconst player1 = maker('div', gameArea, 'gamer', 'Coin 1');\nconst player2\
    \ = maker('div', gameArea, 'gamer', 'Coin 2');\nconst coin1 = maker('div', player1,\
    \ 'coin', '��');\nconst coin2 = maker('div', player2, 'coin', '��');\ncoin1.val\
    \ = 1;\ncoin2.val = 1;\nconst coins = [coin1, coin2];\nconst dashboard = maker('div',\
    \ main, 'dash', '');\n```\n"
