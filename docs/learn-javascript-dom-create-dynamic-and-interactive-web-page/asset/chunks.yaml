  trans: "\n\n```javascript\nPromise.all(urls.map(url =>\n    fetch(url).then(res\
    \ => res.json())\n  )).then((data) => {\n    let html = '';\n    data.forEach((val,\
    \ ind) => {\n      console.log(val);\n      html += `<div>${ind+1}. ${val.first}\
    \ ${val.last}</div>`;\n    })\n    output.innerHTML = html;\n  });\n}\n```\n\n\
    ```javascript\nfunction  fetchAllUrls2() {\n  Promise.all([\n      fetch(urls[0]).then(resp\
    \ => resp.json()),\n      fetch(urls[1]).then(resp => resp.json()),\n      fetch(urls[2]).then(resp\
    \ => resp.json()),\n  ]).then(console.log);\n}\n```\n\n```javascript\nfunction\
    \  fetchNow() {\n  fetch(urls[1])\n    .then(response => response.json())\n  \
    \  .then(data => {\n      console.log(data);\n      output.textContent = `${data.first}\
    \ ${data.last}`;\n    })\n    .catch(error => console.log(error));\n}\n```\n\n\
    ```javascript\nasync function  fetchData() {\n  let rep = await fetch(urls[0]);\n\
    \  let data = await rep.json();\n  output.textContent = `${data.first} ${data.last}`;\n\
    }\n```\n\n### JSON #1\n```json\n{\n \"first\" : \"Laurence\",\n \"last\" : \"\
    svekis\"\n}\n```\n\n### JSON #2\n```json\n{\n \"first\" : \"Jack\",\n \"last\"\
    \ : \"Doe\"\n}\n```\n\n### JSON #3\n```json\n{\n \"first\" : \"Kim\",\n \"last\"\
    \ : \"Smith\"\n}\n```\n\n# JavaScript DOM 元素碰撞检测\n\n元素的重叠可以被称为碰撞检测。这是大多数游戏中的标准部分，在移动页面元素时，能够检测其位置并计算它们是否重叠。\n\
    \n此练习旨在测试并让你深入学习如何检查在页面上移动元素的重叠。它将演示如何设置页面元素的移动，并输出计算两个页面元素之间碰撞所需的数值。\n\n![](img/image00484.jpeg)\n\
    \n移动页面上的元素可以通过跟踪用户的按键输入来实现。创建一个对象来存储特定按键的 `keydown` 和 `keyup` 布尔值，然后可以在动画帧中使用该对象，根据按键对象中的布尔值来移动元素。如果按键被按下，该对象将具有\
    \ `true` 值，这可以用来判断哪些键被按下，并相应地应用移动。\n\n通过创建一个可以移动元素的交互界面，跟踪以像素为单位的 `X` 和 `Y` 轴值以及元素的高度\
    \ `Height` 和宽度 `Width`，我们就可以看到重叠发生时的数值。这还允许我们直观地看到水平轴或垂直轴上的连接点。通过元素的实时数字和值，查看计算和碰撞公式的运行情况。\n\
    \n### 设置页面元素移动并跟踪位置的练习：\n\n1. 创建一个允许创建页面元素的函数，这样我们就可以根据需要动态向页面添加元素。给函数命名为 `adder()`\
    \ 以获取新元素将要追加的父元素。使用元素标签的字符串值创建元素。为元素添加内部 HTML 内容，并使用字符串值添加类。\n```javascript\n\
    function adder(parent,t,html,c){ const ele = document.createElement(t);  ele.innerHTML\
    \ = html;    ele.classList.add(c);  return parent.appendChild(ele); }\n```\n\n\
    2. 创建四个页面元素：2 个将移动的框和 2 个输出框坐标和尺寸的区域。\n\n3. 创建一个全局游戏对象，用于跟踪动画帧，包含每个框的 `x,y`（水平、垂直）位置，以及每个框的\
    \ `h,w`（高度和宽度）。这些值随后可以更新位置。\n\n4. 设置一个名为 `keyz` 的对象来跟踪哪些键盘键将用于元素移动。添加 8 个键码名称作为属性名，并将值设置为\
    \ `false`。一旦按下按键，这些值将被更新。\n\n5. ```javascript\nconst keyz = {   ArrowLeft:false,\
    \ ArrowRight:false, ArrowUp:false, ArrowDown:false,   KeyA:false, KeyW:false,\
    \ KeyS:false, KeyZ:false, };\n```\n\n6. 在 `document` 上添加事件监听器，监听 `keydown` 和 `keyup`\
    \ 事件。如果 `keyz` 对象中的按键与对象属性名匹配，则在按下时将设置为 `true`，释放时设置为 `false`。现在这可以用于元素移动了。\n\n\
    7. 创建并启动 `mover()` 函数，它将处理按键时的页面移动。\n\n8. 在 `mover()` 函数内部添加条件来检查哪些键为 `true`，相应地更新\
    \ `game` 对象的 `x,y`。还要应用一个条件，在允许移动之前检查元素是否在 `main` 容器对象的边界内。\n\n9. 使用每个框的新 `game`\
    \ `x,y` 值更新其 `style` 中的 `left` 和 `top`。\n\n10. 在元素移动时，将每个元素的 `x,y,h,w` 输出到页面；这些值应随着新的\
    \ `x,y` 坐标而变化。这些值将用于计算元素之间的碰撞。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>JavaScript\
    \ Course</title>\n<style>\n .container {\n position: relative;\n width: 90vw;\n\
    \ height: 300px;\n border: 1px solid #ddd;\n }\n .box {\n position: absolute;\n\
    \ width: 50px;\n height: 50px;\n color: white;\n }\n .info {\n position: absolute;\n\
    \ width: 50px;\n height: 50px;\n text-align: center;\n }\n</style>\n</head>\n\
    <body>\n<div class=\"container\">\n <div class=\"box\" id=\"box1\"></div>\n <div\
    \ class=\"box\" id=\"box2\"></div>\n</div>\n<div id=\"output1\"></div>\n<div id=\"\
    output2\"></div>\n<script src=\"app.js\"></script>\n</body>\n</html>\n```\n\n"
- fmt: "\nPage elements can be moved; with this real time checker of DOM page elements,\
    \ it will help better see the collision detection formula in action. This exercise\
    \ will also demonstrate how to simplify the collision detection using the `getBoundingClientRect()`\
    \ method to get the element boundaries and dimensions within the checking function.\
    \ Using `getBoundingClientRect()` method can eliminate the need to track element\
    \ positions in an object and return back the needed `X`, `Y`, `height`, `width`\
    \ values when needed. Using the same overlap formula as before and placing the\
    \ returned object values of the element provides a quick checking function that\
    \ can be used for collision detection on any element. Within the function arguments\
    \ it only requires the elements objects which can also be selected or used from\
    \ preselect element variables.\n\n![](Images/image00485.jpeg)\n\nTo check if any\
    \ two elements are overlapping you need both element, `x,y` `height` and `width`\
    \ values. These can then be used to calculate the corners to see overlap on the\
    \ horizontal axis and overlap on the vertical axis. If both horizontal and vertical\
    \ are overlapping, then there is a collision occurring between the two elements\
    \ on the page.\n\nUsing `getBoundingClientRect()` will return the dimension of\
    \ an element. This method returns an object of values which properties include\
    \ `bottom`, `height`, `left`, `right`, `top`, `width`, `x`, `y`.\n\n![](Images/image00486.jpeg)\n\
    \nThese values for the element can then be used in the collision formula to check\
    \ for overlap.\n\n![](Images/image00487.jpeg)\n\n### X-Horizontal check formula\n\
    ```\n(a.x < (b.x + b.width)) && ((a.x + a.width) > b.x);\n```\n\n### y-Vertical\
    \ check formula\n```\n(a.y < (b.y+b.height)) && ((a.y + a.height) > b.y);\n```\n\
    \n### Moving exercise to check for element overlap:\n1. create move output areas\
    \ to show the current stats of the element and the collision values. Update the\
    \ style of the element if an overlap occurs.\n2. Create a new element in the center\
    \ to use within the collision check function.\n3. Create a new function that requires\
    \ two parameters, one for each element to check. Get the boundaries of the element.\n\
    4. Create a function `col()` which can check the boundaries and return a Boolean\
    \ value if the two elements are overlapping. Use this formula to check for overlap\
    \ of the elements between the various boxes on the screen.\n5. Update element\
    \ styling and output info styling depending on the result of the collision detection.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript Course</title>\n\
    \ <style>\n .container {\n position: relative;\n background-color: #ddd;\n width:\
    \ 90vw;\n margin: auto;\n }\n .box {\n position: absolute;\n width: 50px;\n height:\
    \ 50px;\n left: 0;\n top: 0px;\n line-height: 50px;\n text-align: center;\n color:\
    \ white;\n }\n .info {\n background-color: white;\n padding: 5px;\n text-align:\
    \ center;\n font-size: 1.4em;\n color: white;\n }\n .output1{\n color:black;\n\
    \ font-size: 0.9em;\n padding:0px;\n }\n .blocker{\n width:200px;\n left:100px;\n\
    \ top:100px;\n position:absolute;\n height:100px;\n background-color:yellow;\n\
    \ text-align:center;\n line-height:100px;\n font-size:4em;\n }\n .output2{\n color:black;\n\
    \ font-size:2em;\n }\n .info  div {\n padding: 10px;\n }\n .game {\n position:\
    \ relative;\n min-height: 300px;\n }\n </style>\n</head>\n<body>\n <div  class=\"\
    container\"></div>\n <script  src=\"app8.js\"></script>\n</body>\n</html>\n```\n\
    \n```javascript\nconst main = document.querySelector('.container');\nconst message\
    \ = adder(main, 'div', '', 'info');\nconst output1 = adder(message, 'div', 'Content\
    \ 1', 'output');\nconst output2 = adder(message, 'div', 'Content 2', 'output');\n\
    const output3 = adder(message, 'div', 'Content 3', 'output1');\nconst output4\
    \ = adder(message, 'div', 'Content 4', 'output1');\nconst output5 = adder(message,\
    \ 'div', 'Content 5', 'output1');\nconst output6 = adder(message, 'div', 'Content\
    \ 6', 'output1');\nconst output7 = adder(message, 'div', 'Content 7', 'output2');\n\
    const output8 = adder(message, 'div', 'Content 8', 'output1');\nconst gameBoard\
    \ = adder(main, 'div', '', 'game');\nconst box3 = adder(gameBoard,'div','AVOID','blocker');\n\
    const box1 = adder(gameBoard, 'div', 'Box 1', 'box');\nbox1.style.backgroundColor\
    \ = 'red';\noutput1.style.backgroundColor = 'red';\nconst box2 = adder(gameBoard,\
    \ 'div', 'Box 2', 'box');\nbox2.style.backgroundColor = 'blue';\noutput2.style.backgroundColor\
    \ = 'blue';\nbox2.style.left = '100px';\nconst game = {\n move: {},\n x1: box1.offsetLeft,\n\
    \ y1: box1.offsetTop,\n x2: box2.offsetLeft,\n y2: box2.offsetTop,\n speed: 5,\n\
    \ w1: box1.offsetWidth,\n h1: box1.offsetHeight,\n w2: box2.offsetWidth,\n h2:\
    \ box2.offsetHeight\n};\nconst keyz = {\n ArrowLeft: false,\n ArrowRight: false,\n\
    \ ArrowUp: false,\n ArrowDown: false,\n KeyA: false,\n KeyS: false,\n KeyZ: false,\n\
    };\ndocument.addEventListener('keydown', (e) => {\n if (e.code in keyz) {\n  keyz[e.code]\
    \ = true;\n }\n});\ndocument.addEventListener('keyup', (e) => {\n if (e.code in\
    \ keyz) {\n  keyz[e.code] = false;\n }\n});\nwindow.addEventListener('DOMContentLoaded',\
    \ mover);\n\nfunction mover() {\n const dim = [gameBoard.offsetWidth - box1.offsetWidth,\
    \ gameBoard.offsetHeight - box1.offsetHeight];\n // Box 1\n if (keyz.ArrowRight\
    \ && game.x1 < dim[0]) game.x1 += game.speed;\n if (keyz.ArrowLeft && game.x1\
    \ > 0) game.x1 -= game.speed;\n if (keyz.ArrowDown && game.y1 < dim[1]) game.y1\
    \ += game.speed;\n if (keyz.ArrowUp && game.y1 > 0) game.y1 -= game.speed;\n box1.style.left\
    \ = `${game.x1}px`;\n box1.style.top = `${game.y1}px`;\n // Box 2\n if (keyz.KeyS\
    \ && game.x2 < dim[0]) game.x2 += game.speed;\n if (keyz.KeyA && game.x2 > 0)\
    \ game.x2 -= game.speed;\n if (keyz.KeyZ && game.y2 < dim[1]) game.y2 += game.speed;\n\
    \ if (keyz.KeyW && game.y2 > 0) game.y2 -= game.speed;\n box2.style.left = `${game.x2}px`;\n\
    \ box2.style.top = `${game.y2}px`;\n output1.innerHTML = `Box #1 X:${game.x1}\
    \ Y:${game.y1} W:${game.w1} H:${game.h1}`;\n output2.innerHTML = `Box #2 X:${game.x2}\
    \ Y:${game.y2} W:${game.w2} H:${game.h2}`;\n const o3 = game.x1 < (game.x2 + game.w2)\
    \ && (game.x1 + game.w1) > game.x2;\n const o4 = game.y1 < (game.y2 + game.h2)\
    \ && (game.y1 + game.h1) > game.y2;\n output3.style.color = (o3 ? 'green' : 'black');\n\
    \ output4.style.color = (o3 ? 'green' : 'black');\n output5.style.color = (o4\
    \ ? 'green' : 'black');\n output6.style.color = (o4 ? 'green' : 'black');\n output3.innerHTML\
    \ = `H ${o3}: (${game.x1} < ${game.x2} + ${game.x2} + game.w2}) && ((game.x1}\
    \ + game.w1) > ${game.x2})`;\n output4.innerHTML = `H ${o3}: (${game.x1} < ${game.x2}\
    \ + ${game.x2} + game.w2}) && ((game.x1 + game.w1) > ${game.x2})`;\n output5.innerHTML\
    \ = `V ${o4}:${game.y1} < (${game.y2} + game.h2}) && (${game.y1} + game.h1) >\
    \ ${game.y2}`;\n output6.innerHTML = `V ${o4}: ${game.y1} < (${game.y2} + game.h2})\
    \ && (${game.y1} + game.h1}) > ${game.y2}`;\n const val1 = col(box1, box2);\n\
    \ output7.style.color = val1 ? 'red' : 'black';\n output7.innerHTML = `HIT ${val1}`;\n\
    \ const val2 = col(box1, box3);\n const val3 = col(box2, box3);\n box3.style.backgroundColor\
    \ = val2 ? 'red' : '';\n if (!val2) {\n  box3.style.backgroundColor = val3 ? 'blue'\
    \ : '';\n }\n output8.innerHTML = `Center Box1 ${val2} Box2 ${val3}`;\n}\n\nfunction\
    \ col(el1, el2) {\n const a = el1.getBoundingClientRect();\n const b = el2.getBoundingClientRect();\n\
    \ //console.log(a);\n return (a.x < (b.x + b.width)) && ((a.x + a.width) > b.x)\
    \ && (a.y < (b.y+b.height)) && ((a.y + a.height) > b.y);\n}\n\nfunction adder(parent,\
    \ t, html, c) {\n const ele = document.createElement(t);\n  ele.innerHTML = html;\n\
      ele.classList.add(c);\n return parent.appendChild(ele);\n}\n```\n"
