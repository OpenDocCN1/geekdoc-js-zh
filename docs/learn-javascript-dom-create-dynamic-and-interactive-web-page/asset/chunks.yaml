    \ code.   Else provides an alternative if the condition is not true then else\
    \ statement allows us to run a block of code on false if none of the previous\
    \ conditions are true.  You can also use the else if statement to check another\
    \ condition with a separate block of code to be run if the previous condition\
    \ came back as false.  \n\nUsing the switch statement allows us to specify several\
    \ alternatives checking to see if any of the conditions match and allow the corresponding\
    \ code to be executed.\n\nJavaScript code can use Comparison Operators to check\
    \ if a statement is true or false.  To check multiple conditions, you can apply\
    \ Logical Operators to check logic between conditions.  The example below will\
    \ show how to use the Logical operators and the results that can be expected with\
    \ the various combinations of true or false.\n\nLesson JavaScript Coding Exercise:\n\
    \n1.  Select the page elements you want to use assign variables to them\n\n2.\
    \  Create a global value for counter of 0\n\n3.  Once the button is clicked increment\
    \ the counter by 1\n\n4.  Check to see if the counter value is less than 2, if\
    \ that's true then update the style color to red\n\n5.  Add an else if to the\
    \ condition, checking if the value of counter is less than 4, if it is then updating\
    \ the style color to green for the output element.\n\n6.  Add an else if to the\
    \ condition, checking if the value of counter is less than 6, if it is then updating\
    \ the style color to purple for the output element.\n\n7.  Using else if none\
    \ of the conditions are true update the style of the element to be blue\n\n8.\
    \  Create a switch to check for values of the counter.  Create cases for the values\
    \ you want to track, update the output area text with different string values\
    \ depending on the case.  Try the switch with and then without the break keyword.\n\
    \n9.  Add in a default within the switch statement\n\n<!doctype  html>\n\n<html>\n\
    \n<head>\n\n <title>JavaScript</title>\n\n</head>\n\n<body>\n\n<div>Hello World\
    \ 1</div>\n\n<input  type=\"text\"  >\n\n<button  type=\"button\">Click</button>\n\
    \n<script  src=\"dom3.js\"></script>\n\n</body>\n\n</html>\n\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nmyInput.value = 'Laurence';\n\nlet counter = 0;\n\nbtn.onclick = ()=>{\n\n \
    \ counter++;\n\n let boo = (counter < 3);\n\n if(counter < 2){\n\n      output.style.color\
    \ = 'red';\n\n  }else  if(counter < 4){\n\n      output.style.color = 'green';\n\
    \n  }else  if(counter < 6){\n\n      output.style.color = 'purple';\n\n  }else{\n\
    \n      output.style.color = 'blue';\n\n  }\n\n  output.textContent = `Counter\
    \ : ${counter} ${boo}`;\n\n  console.log(counter);\n\n  updater();\n\n}\n\nlet\
    \ val = '';\n\nfunction  updater(){\n\n switch (counter) {\n\n case 0:\n\nval\
    \ = `Case #1 ${counter}`;\n\n break;\n\n case 1:\n\nval = `Case #2 ${counter}`;\n\
    \n break;\n\n case 3:\n\nval = `Case #3 ${counter}`;\n\n break;\n\n default:\n\
    \nval = `DEFAULT ${counter}`;\n\n  }\n\n  output.innerText = val;\n\n}\n\n# JavaScript\
    \ Operators\n\nOperators in JavaScript can be used to perform arithmetic on numbers,\
    \ assign values to variables, concatenate string values and do comparisons between\
    \ two values.  JavaScript also has methods that can be used to convert different\
    \ data types to ensure the expected result from the operator.  When strings are\
    \ added to numbers the result is a string.  This can create unexpected results\
    \ in calculations, there are several methods in JavaScript that can help ensure\
    \ the code will work smoothly for these operations.\n\nLesson JavaScript Coding\
    \ Exercise:\n\n1.  Get the value of the input field.  Convert the value to a number\
    \ using the Number() method.\n\n2.  In the condition check if the result of the\
    \ input is an actual number of NaN using the isNaN() method\n\n3.  Using the modulus\
    \ check if the value of the input is odd or even.  If it has a remainder, then\
    \ it will be odd otherwise it is even.\n\n4.  Perform math calculations on the\
    \ input value and output the results back to the user in the output field.\n\n\
    const output = document.querySelector('div');\n\nconst myInput = document.querySelector('input');\n\
    \nconst btn = document.querySelector('button');\n\nlet a=val=b = 100;\n\n//let\
    \ val = 10 = a;\n\nlet c = a*b/100;\n\nlet d = 504 % 50;\n\na = a +1;\n\na++;\n\
    \na--;\n\nconsole.log(a);\n\nconsole.log(d);\n\nlet e =10;\n\ne *= a;\n\nconsole.log(e);\n\
    \nconsole.clear();\n\nconsole.log('5' == 5);\n\nconsole.log('5' === 5);\n\nconsole.log('5'\
    \ != 6);\n\nconsole.log('5' !== 5);\n\nconsole.log( 10 <= 10);\n\nconsole.log(('5'\
    \ == 5) && true);\n\nconsole.log(('5' == 5) && false);\n\nconsole.log(('5' !=\
    \ 5) || true);\n\nconsole.log(('5' == 5) || false);\n\nbtn.onclick = ()=>{\n\n\
    \ let val = Number(myInput.value);\n\n  console.log(typeof(val));\n\n  console.log(isNaN(val));\n\
    \n let html = `<div>Results ${val}</div>`;\n\n if(!isNaN(val)){\n\nhtml += `<div>Was\
    \ a number</div>`;\n\n  }else{\n\nhtml += `<div>NOT a number</div>`;\n\n  }\n\n\
    \ if(val % 2){\n\nhtml += `<div>Odd number</div>`;\n\n  }else{\n\nhtml += `<div>Even\
    \ number</div>`;\n\n  }\n\nhtml += `<div>${val  * 50} = ${val} X 50</div>`;\n\n\
    html += `<div>${val  / 10} = ${val} / 10</div>`;"
