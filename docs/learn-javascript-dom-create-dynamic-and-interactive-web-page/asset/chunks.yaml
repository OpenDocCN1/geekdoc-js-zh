  trans: "\nJavaScript 可用于动态网页内容，因为它可以更新网页的显示内容并生成内容。JavaScript 在客户端或用户计算机的浏览器中运行。因此，我们机可以在没有互联网连接的情况下运行代码，因为我们需要的所有内容都已经在计算机的浏览器应用程序中了。一个没有更新内容且始终显示相同内容的网页被称为静态页面。通常情况下，静态页面已成为过去式，在互联网刚创建时，HTML\
    \ 并不具有交互性，且页面输出对所有用户都是一样的。\n\n## 课程 JavaScript 编码练习\n\n1. 打开你的代码编辑器并创建一个基础的 `html`\
    \ 文件。\n2. 保存该 `html` 文件并在浏览器中打开它。\n\n```html\n<!doctype html>\n<html>\n<head>\n\
    \ <title>JavaScript</title>\n</head>\n<body>\n  Hello World\n</body>\n</html>\n\
    ```\n\n搭建你的 Web 开发环境，从开始开始编写代码。使用编辑器 `visual studio code`。使用 `Chrome` 浏览器和 `Chrome\
    \ DevTools` 查看控制台消息。\n\n# 开始编程\n\n探索如何开始编写 JavaScript 代码以及如何将 JavaScript 添加到你的\
    \ HTML 文件中以便在浏览器中运行代码。\n\n在本节中，我们将探索如何向 HTML 文件中添加 JavaScript。JavaScript `JS`\
    \ 文件不会在浏览器中独立运行，它们将作为文本文件输出并显示 JavaScript 代码。要运行 JavaScript，它必须位于 HTML 文件中，要么在\
    \ HTML 代码内部，要么在 HTML 代码中链接到一个带有 JavaScript 代码的 `JS` 文件。将 JavaScript 整合到网页中有多种方法。下面我们将探索这\
    \ 3 种方法，包括作为元素内的属性、在 HTML 的 script 标签之间，以及作为从 HTML 代码链接的 `JS` 文件。\n\n你可以将 JavaScript\
    \ 作为内联属性添加到 HTML 元素中，尽管不建议使用这种格式。它们很难识别，且不是良好的做法。\n\n```html\n<div onclick=\"\
    alert('hello')\">Hello World 1</div>\n```\n\nHTML `script` 标签内部的内部 JavaScript。如果你将与页面元素进行交互，应将其添加到\
    \ `body` 标签结束标签之前。代码从上到下加载到浏览器，如果 HTML 尚未完全加载而你尝试使用 JavaScript 访问元素，你将会遇到错误。\n\
    \n```html\n<script>\n  document.write('<div>Hello World 2</div>');\n</script>\n\
    ```\n\n最佳实践是使用外部文件，使用 `js` 扩展从 HTML 文件创建一个单独的文件。放置 `script` 标签并使用 `src` 属性链接到你文件所在的路径。它可以是相对于\
    \ `html` 文件的相对路径，也可以是使用完整路径的文件地址绝对路径来加载它。如果你使用绝对路径，你应该可以将路径粘贴到你的网络浏览器并看到该文件。\n\
    \n```html\n<script src=\"app.js\"></script>\n<script src=\"http://www.example.com/app.js\"\
    ></script>\n```\n\n使用 `document.write()` 方法向网页输出文本的示例代码。你可以使用 `document` 对象，它是由浏览器创建的代表网页元素的对象。`document`\
    \ 对象有几个方法可以应用于编码逻辑。使用 `document.write()` 将在遇到代码时直接将圆括号内的任何字符串值写入网页中。我们将在接接的课程中更详细地介绍\
    \ `document` 对象。这仅仅是 `document` 对象的许多功能之一，以及它如何被通过 JavaScript 代码直接在浏览器中与 HTML\
    \ 页面元素进行交互。\n\n```javascript\ndocument.write('<div>Hello World 3</div>');\ndocument.write('<div>Hello\
    \ World 4</div>');\ndocument.write('<div>Hello World 5</div>');\n```\n\n## 课程\
    \ JavaScript 编码练习\n\n1. 创建一个 `HTML` 文件和一个 `JS` 文件。\n2. 使用 `script` 标签链接 `JS` 文件作为源文件。\n\
    3. 使用 `document.write()` 向网页添加文本。\n4. 使用 `document.write()` 向你的网页添加 HTML 格式的内容。\n\
    \n# JavaScript 编码技巧\n\n学习如何开始使用 JavaScript 并创建你的第一段 JavaScript 代码。\n\n本节将介绍如何使用注释对语句和代码进行文档说明。尽可能使用注释为编码语法提供上下文，你可以在\
    \ JavaScript 中使用单行注释或多行注释。使代码更具人类可读性的最佳实践是使用缩进并利用空白提高代码的可读性。浏览器会忽略空白，可以使用它来结构化代码以便于查看。在单独的\
    \ `JS` 文件中创建代码并从 HTML 文件链接到它，是将你的 HTML 文件连接到 JavaScript 代码的最佳方法。你可以使用 `console`\
    \ 进行调试并查看值。\n\n为了确保你的代码按预期工作，你可以利用某些语法来向浏览器输出值和信息。使用 `console.log()` 向浏览器输出调试数据。\n\
    \n代码中的空白会被忽略，使用空白和缩进使代码更具人类可读性。注意不要在语句之间添加空格，因为这会在代码被渲染时导致错误。可以使用大括号来指示代码块，这将在接下来的课程中的各种代码语法中使用。代码周围的大括号表示一个旨在一起运行的代码块。代码块的缩进允许编辑器更容易读取代码。\n\
    \n```javascript\n{\n  document.write('<br>Output Message');\n  document.write('<br>Output\
    \ Message');\n}\n```\n\n使用单行或多行注释为代码提供更多上下文。你可以通过 `//` 注释语句来调试应用程序。注释会被忽略且不会输出到页面。\n\
    \n```javascript\n/*\n这是我的代码！\nLaurence Svek\n*/\n//alert('Hello');\n```\n\n使用\
    \ `console` 方法允许你从 JavaScript 代码向浏览器进行调试和通信。这可以在 JavaScript 代码运行时提供额外的信息。控制台消息仅输出到浏览器的控制台中，对用户不可见。\n\
    \n![控制台输出示例及其在 Chrome 浏览器中的显示方式](img/image0440.jpeg)\n\n控制台输出示例及其在 Chrome 浏览器中的显示方式。\n\
    \n```javascript\nconsole.log('Hello');\nconsole.error('Hello');\nconsole.info('Hello');\n\
    console.warn('Hello');\n//console.clear();\nconsole.log('New line');\n```\n\n\
    `Window` 对象是 `document` 对象的父级。`window` 对象是顶层父级，包含了可以使用的方法。`alert()` 和 `prompt()`\
    \ 都是 `windows` 对象的一部分。你可以使用这些与用户创建交互。两者都会在浏览器中显示标准的弹出消息，用户必须进行操作后才能与窗口的其他部分进行交互。尽管它们提供了与用户交互的简单方法，但这些并不常用，因为用户体验较差，且现在\
    \ JavaScript 和 DOM 中有更多交互选项。警报和提示旨在与网络用户进行交互。从创建 `index.html` 和 `app.js` 文件开始。然后编写一些\
    \ JavaScript 代码并尝试。在浏览器中打开并运行 HTML 文件。你可以使用课程中的函数如 `alert()` 或 `document.write('Hello');`；Alert\
    \ 会停止代码执行，如果在顶部，则在点击按钮之前不会输出内容。将 JavaScript 放在底部以便其余代码可以渲染。\n\n```javascript\n\
    window.alert('Hello World');\n```\n"
- fmt: "\nWindow prompt is slightly different than the alert, as the prompt has a\
    \ callback which means the input value gets returned into the JavaScript code\
    \ and then can be used within the code as a value. Both can be written with or\
    \ without the `window` object in the code. The code automatically defaults to\
    \ the top object and if not in the code it will look to the top object which is\
    \ the `window` object by default.\n\n```javascript\nprompt('How are you?');\n\
    ```\n\n![Example of a window prompt() with a question and callback of the response](Images/image00442.jpeg)\n\
    \nExample of a window `prompt()` with a question and callback of the response\n\
    \n```javascript\nalert('Hello');\n\nconst res = prompt('What is your name?');\n\
    \nalert(res);\n```\n\n### Lesson JavaScript Coding Exercise:\n\n1. Comment out\
    \ a line of code in your JavaScript file.\n2. Comment out a block of code with\
    \ a multiline comment.\n3. Try the various `console` output methods with different\
    \ messages.\n4. Create an `alert` with your name as the message.\n5. Create a\
    \ `prompt` that returns the name of the web user. Set a variable to capture the\
    \ response value of the `prompt` and output the value into the document using\
    \ `document.write()` method.\n\n# How to use variables in JavaScript\n\n● Variables\
    \ are one of the basic concepts of coding\n● Using `const` or `let` avoid using\
    \ `var`\n● `const` and `let` are scope based\n● Parent scope vs local scope\n\
    ● Assign values to variables and reassign new updated values\n● Use of strings\
    \ and numbers as values for variables\n● Dynamic type with JavaScript changing\
    \ data type\n● `Math` and output from JavaScript directly\n\nVariables allow developers\
    \ to hold values, these values can be updated as needed within the code. Typically,\
    \ variables are declared at the start of your code, and used throughout the code\
    \ to hold application values. The values can change using “`let` when you declare\
    \ a variable. Use “`const` when you want the value to stay the same throughout\
    \ the code. This can save errors and issues with reassigning values mistakenly\
    \ in the code.\n\nDouble quotes and single quotes or backticks can be used to\
    \ contain string content. A semicolon (`;`) is not necessary after a statement\
    \ if it is written on its own line. But if more than one statement on a line is\
    \ desired, then they must be separated by semicolons. It is considered best practice,\
    \ however, to always write a semicolon after a statement, even when it is not\
    \ strictly needed. Whitespace is ignored in JavaScript code; you can use it for\
    \ writing code that is more readable and understandable.\n\n## Creating variables\n\
    \n- `var` - Declares a variable, optionally initializing it to a value.\n- `let`\
    \ - Declares a block-scoped, local variable, optionally initializing it to a value.\
    \ Blocks of code are indicated by `{}`.\n- `const` - Declares a block-scoped,\
    \ read-only named constant. Cannot be changed.\n\nVariables must be declared before\
    \ you use them. Comma separate to declare multiple variables. CamelCase is more\
    \ readable as in the example below.\n\n```javascript\nlet a,b,c,d;\n\nlet userfirstname\
    \ = “Laurence”;\n\nlet userFirstName = “Laurence”;\n```\n\n### Lesson JavaScript\
    \ Coding Exercise:\n\n1. Declare variables both numbers and strings using both\
    \ `let` and `const`.\n2. Try the various formats to create strings using the single,\
    \ double quotes and backticks.\n3. Output the results into the `console` and to\
    \ the document.\n4. Assign new values to the variables and output the results.\n\
    5. Try the template literal strings with JavaScript wrapped in the `${}` and check\
    \ the output in both the console and webpage.\n\n```javascript\nlet a = 'Laurence\
    \ Svekis';\n\nlet b = 10;\n\nlet e = 5;\n\nlet f = 20;\n\nlet myStr1 = 'Hello\\\
    's \"world\"';\n\nlet myStr2 = \"\\\"Hello\\\" 'world'\";\n\nlet myStr3 = `Hello'\
    \      s    \n\n\"world\"`;\n\nlet tempLit = `Math ${b  +  e  +  f} Hello`;\n\n\
    const myName = 'Laurence Svekis';\n//myName = 'Svekis';\n\n{\n const b = 1000;\n\
    \  console.log(b);\n //var c = 100;\n //let d = 100;\n}\n\n//console.log(c);\n\
    console.log(b);\n\nconsole.log(myName);\n\na = 'Hello World';\n\nlet val = b +\
    \ e + f;\n\nval = myStr1 + ' ' + myStr2 + ' ' + myStr3;\n\nval = tempLit;\n\n\
    val = `${myStr1} ${myStr2} ${myStr3}`;\n\nconsole.clear();\n\nconsole.log(val);\n\
    \ndocument.write(val);\n```\n\n# JavaScript Dynamic Type Conversion\n\n● JavaScript\
    \ DataType\n● Data Types `string`, `number`, `boolean` - `typeof` type conversion\n\
    ● Data Types `Booleans`, `Null`, `Undefined`\n● `number.toString()` `Number(string)`\n\
    ● `typeof` operator\n● Data types include numbers, strings, booleans, objects\n\
    \nJavaScript Dynamic Type Conversion and how it works. JavaScript variables can\
    \ be converted in different data types, they are not set to the data type that\
    \ they are declared with. JavaScript uses different data types, JavaScript dynamically\
    \ assigns the data type that it presumes is desired, you can also change data\
    \ types of the variable if needed.\n\n### Lesson JavaScript Coding Exercise:\n\
    \n1. Declare multiple variables without assigning values to them.\n2. Get the\
    \ data type of a variable and output it to the page.\n3. Add numbers and strings\
    \ together.\n4. Convert a string to a number.\n5. Convert a string to a number.\n\
    6. Create Boolean values.\n\n```javascript\nlet myStr = 'Laurence';\n\nlet myNum\
    \ = 0;\n\nlet a;\n\nlet b,c,d;\n\nlet val;\n\nmyStr = 5;\n\nmyNum = 'test';\n\n\
    b = 5;\n\nc = 10;\n\nd = '20';\n\nd = null;\n\nd = true;\n\nd = false;\n\nd =\
    \ c.toString();\n\na = '100X';\n\nd = parseInt(a);\n\nval = b + c;\n\nval = d;\n\
    \nval = typeof(d);\n\n# JavaScript Variables\n\nVariable naming Rules provide\
    \ the parameters as which names can be used and how to declare JavaScript within\
    \ the code.\n\n● Variable identifier names must use unique names\n● Variable identifier\
    \ names should be meaningful and possible\n● Identifiers can contain letters,\
    \ digits, underscores, and the dollar sign\n● Variables names must begin with\
    \ a letter, underscore, or dollar sign\n● Names are case sensitive\n● Names cannot\
    \ be the same as JavaScript words\n● No spaces in the variable name\n\nRules for\
    \ naming variables must start with a letter, underscore (_), or dollar sign ($).\
    \ Subsequent can be letters of digits. Upper or lower case. No spaces. No limit\
    \ to the length of the variable name. Variable names are case sensitive. Cannot\
    \ use reserved words.\n\n### Lesson JavaScript Coding Exercise:\n\n1. Create some\
    \ string values.\n2. Assign meaning names to the variable names.\n3. Use camelCase\
    \ for a variable name.\n\n```javascript\nlet _test5 = 'Laurence';\n\nlet $test_\
    \ = 'Svekis';\n\nlet test$ = 'hello';\n\nlet TESTtest = 'hello';\n\nlet myFirstName\
    \ = 'Laurence';\n//let let = 'Not a good idea';\n\nlet myLastName = $test_;\n\n\
    let output = myFirstName;\n\nlet fullName = `${myFirstName} ${myLastName}`;\n\n\
    output = fullName;\n\nconsole.log(output);\n\ndocument.write(output);\n```\n\n\
    # JavaScript Arrays and Objects\n\nBoth arrays and objects provide a powerful\
    \ way to store and use data within JavaScript. Both arrays and objects in JavaScript\
    \ provide a powerful way to hold content and use data within code. With one variable\
    \ you can hold multiple values within both arrays and objects, in addition you\
    \ can use combinations of these as they hold all data types, allowing the data\
    \ contained within them to go multiple levels deep as needed. Arrays and objects\
    \ can be declared using `const` as the variable points to a location within the\
    \ memory and not value that it is assigned to, which makes it possible to update\
    \ the objects and arrays contents without having to reassign the value to the\
    \ variable.\n"
