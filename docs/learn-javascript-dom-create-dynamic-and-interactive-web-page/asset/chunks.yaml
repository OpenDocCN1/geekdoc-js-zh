  trans: "\n\n```javascript\nli.classList.toggle('sel');\n}\n\nuls[0].append(li);\n\
    })\n}\n```\n\n# 使用事件进行页面交互\n\nDOM 元素可以拥有各种事件，这些事件可以在页面上发生时后用于运行代码块。还可以通过 `AddEventListener()`\
    \ 方法或各种元素事件将事件添加到 `Window` 对象以及 `Document` 对象中。`window` 和 `document` 对象可以在选定的事件发生时运行函数，例如\
    \ JavaScript 中的 `onLoad` 和 `DOMContentLoaded` 事件。此练习练习将提供一个如何使用这些事件的示例。\n\n##\
    \ 课程编码练习：\n\n1. 添加一个在 DOM 内容加载时触发的事件。尝试 `window.onload`、`document.body.onload`\
    \ 和 `document.addEventListener('DOMContentLoaded',(){})`。\n2. 使用 `addEventListener()`\
    \ 为同一个元素添加多个事件，也尝试对 `onclick` 使用。\n3. 将一个元素嵌套在其父元素中，使用 `useCapture` 将布尔值设置为 `true`\
    \ 并观察顺序上的差异。\n4. 为事件添加选项使其仅运行一次。`{once: true}`。\n5. 从元素中移除事件监听器 `removeEventListener`。\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n <title>JavaScript</title>\n <script\
    \ src=\"apps4.js\"></script>\n</head>\n<body>\n<div>JavaScript 1</div>\n</body>\n\
    </html>\n```\n\n```javascript\nwindow.onload = init;\n\ndocument.addEventListener('DOMContentLoaded',\
    \ init3);\n\nfunction init3() {\n  const div = document.querySelector('div');\n\
    \  div.style.backgroundColor = '#ddd';\n  const h1 = document.createElement('h1');\n\
    \  h1.textContent = 'Laurence Svekis';\n  div.append(h1);\n  div.addEventListener('click',\
    \ click1, {\n    once: true\n  });\n  h1.addEventListener('click', click2);\n\
    \  h1.addEventListener('click', click3);\n}\n\nfunction init2() {\n  const div\
    \ = document.querySelector('div');\n  div.style.backgroundColor = '#ddd';\n  const\
    \ h1 = document.createElement('h1');\n  h1.textContent = 'Laurence Svekis';\n\
    \  div.append(h1);\n  h1.onclick = click1;\n  h1.onclick = click2;\n}\n\nfunction\
    \ click1(e) {\n  console.log('DIV');\n}\n\nfunction click2(e) {\n  console.log('H1');\n\
    }\n\nfunction click3(e) {\n  e.target.removeEventListener('click', click2);\n\
    \  console.log('Event #3');\n}\n\nfunction init1() {\n  console.log('doc');\n\
    \  const div = document.querySelector('div');\n  const h1 = document.createElement('h1');\n\
    \  h1.textContent = 'Laurence Svekis';\n  h1.onclick = () => {\n    console.log('h1\
    \ #2');\n  };\n  h1.addEventListener('click', (e) => {\n    console.log('h1 #1');\n\
    \  });\n  h1.onclick = () => {\n    console.log('h1 #3');\n  };\n  h1.addEventListener('click',\
    \ (e) => {\n    console.log('h1 #4');\n  });\n  h1.addEventListener('click', (e)\
    \ => {\n    console.log('h1 #5');\n  });\n  div.append(h1);\n  console.log(div);\n\
    }\n\nfunction init() {\n  console.log('window');\n}\n```\n\n# JavaScript 表单字段元素\n\
    \n表单值和交互选择可以通过从 HTML 页面中选择元素然后使用 JavaScript 获取属性值来实现。不同的元素可以包含不同的默认属性，此示例将演示如何交互表单元素（如输入字段和表单提交事件）。使用\
    \ JavaScript 代码获取输入字段值并在代码中动态创建元素。\n\n## 课程编码练习：\n\n1. 为主页面元素添加几个文本节点（Text Nodes）。选择它们并更新文本节点的节点。\n\
    2. 创建一个文本输入框，为该输入字段设置一些常用属性。\n3. 创建一个数字类型的输入字段，设置 `min` 和 `max` 属性。\n4. 创建一个设置为日期类型的输入字段。\n\
    5. 创建一个设置为颜色类型的输入字段。\n6. 在页面上创建并添加 `label` 和 `select` 元素。为 `select` 字段添加属性以允许选择多个项目。\n\
    7. 为 `select` 字段创建多个选项。\n8. 添加一个按钮，将 `select` 字段中所有选中的选项列到无序列表中。\n9. 在页面上添加单选按钮，并为其值添加标签。\n\
    10. 添加一个按钮以获取所选单选按钮的值。\n11. 列出除单选按钮以外的所有输入值。\n\n```javascript\nconst output =\
    \ document.querySelector('div');\nconsole.log(output);\noutput.innerHTML = '';\n\
    const out1 = document.createTextNode('Hello');\nconst out2 = document.createTextNode('World');\n\
    output.append(out1);\noutput.append(out2);\nout1.textContent = 'Laurence';\nout2.textContent\
    \ = 'Svekis';\nconst myInput1 = document.createElement('input');\noutput.append(myInput1);\n\
    myInput1.setAttribute('type', 'text');\nmyInput1.setAttribute('name', 'first');\n\
    const myInput2 = document.createElement('input');\noutput.append(myInput2);\n\
    myInput2.setAttribute('type', 'number');\nmyInput2.setAttribute('min', '1');\n\
    myInput2.setAttribute('max', '10');\nconst myInput3 = document.createElement('input');\n\
    output.append(myInput3);\nmyInput3.setAttribute('type', 'date');\nconst myInput4\
    \ = document.createElement('input');\noutput.append(myInput4);\nmyInput4.setAttribute('type',\
    \ 'color');\nconst label1 = document.createElement('label');\noutput.append(label1);\n\
    const sel1 = document.createElement('select');\noutput.append(sel1);\nsel1.setAttribute('multiple',\
    \ '');\nfor (let i = 0; i < 5; i++) {\n  const opt = document.createElement('option');\n\
    \  opt.textContent = `Option ${i + 1}`;\n  sel1.append(opt);\n}\nconst btn = document.createElement('button');\n\
    output.append(btn);\nbtn.textContent = 'List Selected Options';\nconst ul = document.createElement('ul');\n\
    output.append(ul);\nfor (let i = 0; i < 3; i++) {\n  const radio = document.createElement('input');\n\
    \  output.append(radio);\n  radio.setAttribute('type', 'radio');\n  radio.setAttribute('name',\
    \ 'group');\n  radio.value = `Value ${i + 1}`;\n  const label2 = document.createElement('label');\n\
    \  output.append(label2);\n  label2.textContent = `Value ${i + 1}`;\n  label2.setAttribute('for',\
    \ `radio${i}`);\n}\nconst btn2 = document.createElement('button');\noutput.append(btn2);\n\
    btn2.textContent = 'Get Selected Value';\nconst output2 = document.createElement('div');\n\
    output.append(output2);\nconst inputs = document.querySelectorAll('input');\n\
    inputs.forEach((input) => {\n  if (input.type !== 'radio') {\n    console.log(input.value);\n\
    \  }\n});\n```\n\n# 鼠标和键盘事件\n\n元素拥有各种可以在元素上进行监听的事件。一旦事件在元素上发生，就可以用于运行代码块。用户交互可以通过鼠标或键盘进行。此示例将探索它们可以用于元素这些类型用户交互的事件。\n\
    \n## 课程编码练习：\n\n1. 创建一个 `div` 和一个无序列表，用于添加内容。\n\n"
- fmt: "\n2. Add a button that will update the style background colors.\n3. Create\
    \ an empty array to use as a holding array for page elements you want to update\
    \ later.\n4. Create a function that can return a random hex value for the background\
    \ colors.\n5. Create 10 `divs`, set the style properties of the elements, and\
    \ include a random background color.\n6. Add a click event that will set the body\
    \ background color to match the background of the clicked element.\n7. Add `mouseover`,\
    \ `mouseleave`, `mouseout`, `mousedown`, `mouseup`, and `mouseenter` events to\
    \ all the `divs`. Create a function that will log the event trigger and a custom\
    \ message into the output element and into the console.\n8. Create 10 `input`\
    \ elements, add event listeners `onfocus`, `focusout`, `onchange` to the elements.\
    \ Update the style properties on the different events.\n9. Add a keyboard event\
    \ to track the document. track the keys pressed.\n10. Add a keyboard event `onkeydown`\
    \ to the element `input`, if the `enter` key is pressed add the input field value\
    \ to the unordered list as a list item.\n11. Create supporting functions to change\
    \ the background of the body, random color generator, and a logging function that\
    \ can output values into the console and into the output element on the page.\n\
    \n```javascript\nconst div = document.querySelector('div');\n\ndiv.innerHTML =\
    \ '';\n\nconsole.log(div);\n\nconst output = document.createElement('div');\n\n\
    div.append(output);\n\nconst ul = document.createElement('ul');\ndiv.append(ul);\n\
    \nconst btn = document.createElement('button');\n\nbtn.textContent = 'Reset Colors';\n\
    \nbtn.style.display = 'block';\ndiv.append(btn);\n\nconst holder = [];\n\nbtn.onclick\
    \ = (e) => {\n  holder.forEach(ele => {\n    ele.style.backgroundColor = ranColor();\n\
    \  })\n}\n\nfor (let i = 0; i < 10; i++) {\n  const ele = document.createElement('div');\n\
    \  holder.push(ele);\n  ele.style.width = '50px';\n  ele.style.height = '50px';\n\
    \  ele.style.border = '1px solid #ddd';\n  ele.style.display = 'inline-block';\n\
    \  ele.style.backgroundColor = ranColor();\n  ele.style.lineHeight = '50px';\n\
