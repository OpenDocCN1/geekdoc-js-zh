    \        setTimeout('movetoNextQuestion()',500);\n      }\n      ele2.textContent\
    \ = `${mes} ${ques[ind].que} = ${val1}`;\n    }\n  })\n  ele.append(ele1);\n \
    \ ele.append(inEle);\n  ele.append(ele2);\n  div2.append(ele);\n  inEle.focus();\n\
    }\n\nfunction movetoNextQuestion(){\n  timerVal.cur++;\n  if(timerVal.cur >= ques.length){\n\
