    \ = function (num) {\n\nreturn num;\n\n};\n\nLesson JavaScript Coding Exercise:\n\
    \n1.  Create a global value that will be incremented every time the function is\
    \ executed.  Add this increment of the value to each function.  counter++;\n\n\
    2.  Create a function expression that within its code can output a value into\
    \ the console\n\n3.  Invoke the function.  Update the function with a parameter,\
    \ where the function uses that argument value and outputs that value into the\
    \ console\n\n4.  Create a function declaration.   Add 3 parameters, that will\
    \ take the value and add them all together.  Use return to return the resulting\
    \ total of the values that were passed into the function.\n\n5.  Assign the returned\
    \ value of the function to a variable that is output into the web page.\n\nconst\
    \  fun1 = function (val) {\n\n  counter=counter+val;\n\n const output = `<div>Hello\
    \ ${counter}</div>`;\n\n  document.write(output);\n\n}\n\nlet counter = 0;\n\n\
    let word = '';\n\nfun1(21);\n\nfun1(2);\n\nfun1(3);\n\nfun2('h');\n\nfun2('e');\n\
    \nfun2('l');\n\nfun2('l');\n\nfun2('o');\n\n//fun1 = 100;\n\nconsole.log(fun1);\n\
    \nconst fun5 = fun1;\n\nfun5(1000);\n\nfunction  fun2(val){\n\n  word = word +\
    \ val;\n\n  counter++;\n\n let output = `<div>Hello ${counter}</div>`;\n\noutput\
    \ += `<div>Hello ${word}</div>`;\n\n  document.write(output);\n\n}\n\nlet valTotal\
    \ = 0;\n\nvalTotal += fun3(10,44,55);\n\nvalTotal += fun3(4,66);\n\nvalTotal +=\
    \ fun3(5);\n\nconsole.log(valTotal);\n\nfunction  fun3(num1=0,num2=0,num3=0){\n\
    \n const total = num1 + num2 + num3;\n\n  console.log(valTotal);\n\n return total;\n\
    \n}\n\nconst temp = 5000;\n\nfun4(100);\n\nfunction  fun4(val){\n\n const temp\
    \ = 9;\n\n const myVal = val + temp;\n\n //console.clear();\n\n  console.log(myVal);\n\
    \n}\n\n# DOM for Interactive web pages\n\nJavaScript can create interactive web\
    \ content with the use of event listeners.  Event listeners wait for the user\
    \ to perform an action, which then triggers and event to occur.  The event can\
    \ be then used to run a block of code completing the response to the web users\
    \ action all done within Document Object Model.\n\nJavaScript connecting to the\
    \ page elements within Document Object Model is how interactive web pages can\
    \ be created with code.\n\nThe Document Object Model (DOM) is an object that contains\
    \ a data representation of the page elements.  The DOM is structured in a tree\
    \ like format, as objects that comprise the web page and content of the HTML web\
    \ document.  Document Object Model (DOM) is a programming interface for HTML documents,\
    \ that is the logical structure of a page and how the page content can be accessed\
    \ and manipulated.  Bring your web pages to life with JavaScript and connect to\
    \ the web page elements.  Accessing the DOM, you can create fully interactive\
    \ content that responds to the user.  DOM and JavaScript let you create Dynamic\
    \ web page content that can change without page refresh and present new elements\
    \ and updated content to the user.  Improve your web users experience with JavaScript\
    \ and the DOM.\n\n![](Images/image00443.jpeg)\n\nLesson JavaScript Coding Exercise:\n\
    \n1.  Create your HTML file add some page elements\n\n2.  Assign to a variable\
    \ the document.body.children array which will represent all the child elements\
    \ within the body.\n\n3.  To select the first, one use the index value of 0, as\
    \ just like arrays these are zero based.  Output the object to the console with\
    \ console.dir()\n\n4.  Select some properties from the element, output them into\
    \ the console.\n\n5.  Update the textContent of the element to a value of your\
    \ name.\n\n6.  Go to your favorite website and open the devTools, type the document.body.textContent\
    \ = \"Laurence Svekis\"\n\n<!doctype  html>\n\n<html>\n\n<head>\n\n <title>JavaScript</title>\n\
    \n</head>\n\n<body>\n\n<div  id=\"one\"  class=\"red\">Hello World 1</div>\n\n\
    <div>Hello World 2</div>\n\n<script  src=\"dom1.js\"></script>\n\n</body>\n\n\
    </html>\n\nconst ele = document.body.children[0];\n\nconsole.dir(ele);\n\nlet\
    \ val = 'Laurence Svekis';\n\ndocument.body.children[0].textContent = val;\n\n\
    ele.textContent = 'UPDATED';\n\nconsole.log(ele.className);\n\nconsole.log(ele.innerHTML);\n\
    \nele.innerHTML += '<h1>Hello</h1>';"
