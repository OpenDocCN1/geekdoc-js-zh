    \ makeGrid);`，它会在页面加载时被调用。它应该调用函数 `makeGrid()`。\n\n7. 循环处理放置在网格上的项目总数，添加一个事件监听器\
    \ `document.addEventListener('DOMContentLoaded', makeGrid);`，它会在页面加载时被调用。它应该调用函数\
    \ `makeGrid()`。\n\n```javascript\nshowQuestion(0);\n\nstartTimer();\n\n}\n\nfunction\
    \ showQuestion(ind){\n  div2.innerHTML = '';\n  const ele = document.createElement('div');\n\
