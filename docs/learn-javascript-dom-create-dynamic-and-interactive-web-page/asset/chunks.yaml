    \ cells.  The table will be dynamically generated using values for columns and\
    \ rows.  The application will also include 3 interactive buttons to update the\
    \ page elements. \n\nHow to create a responsive table with JavaScript code.\n\n\
    Button actions when clicked:\n\n1.  Add random background colors to all the td\
    \ elements in the table\n\n2.  Get the color values from the elements in the row\
    \ above, apply them to the following row creating a shifting down of the row colors\
    \ to the below row.  First row gets new random colors.\n\n3.  MoveLeft effect,\
    \ when clicked will get the background color of the next element and apply it\
    \ to the element.  The last element in the table will get a new background color\
    \ randomly created.\n\n![](Images/image00464.jpeg)\n\nExercise:\n\n1.  Create\
    \ a variable object for the number of rows and columns in the table.\n\n2.  Create\
    \ a function to add the table to the page.  The table function should create the\
    \ main table element, loop through the rows and cols adding the tr and td page\
    \ elements.  \n\n3.  Generate and set the style of the cell width using the cols\
    \ value, so that the cells take up the full width of the page.\n\n4.  As you add\
    \ the td cells to the table, document.createElement('td') then add a text value\
    \ of the number, then add some styling like border and text align. \n\n5.  Add\
    \ an event listener to the td element, when clicked update the document.body background\
    \ to the same as the table cell background color.\n\n6.  Create a function to\
    \ generate random colors, Math.random().toString(16).slice(2,8)\n\n7.  Create\
    \ a function to create buttons, add 3 buttons to the page.\n\n8.  Add an event\
    \ listener to the first button, when clicked it should select all the page td\
    \ cells from the main table.  As it loops through the elements update the background\
    \ to a random color\n\n9.  Create a second page button, this one will have an\
    \ effect of moving the colors down one row.  Select all the td cells from the\
    \ main table.  Create a holding array, as you loop through the cells, for the\
    \ first row generates random values.  Add these to the holding array.  As you\
    \ move through the second row, subtract the number of columns from the ind value\
    \ of the td element.   This will give you the value of the element that is in\
    \ the row above.   Get the background Color of the element above and add it to\
    \ the holding array.\n\n10.  Once you complete the holding array it should have\
    \ all the color values with one row shifted down, now loop through the holding\
    \ array and apply the background colors to the matching td elements from the node\
    \ list.\n\n11.  Create a third button.  Once this button is clicked, loop through\
    \ all the td elements in the main table.  Update the background of the current\
    \ element to the color of the element background to the right by one index value.  \
    \ For the last element td cell add a random background color.\n\nconst output\
    \ = document.querySelector('div');\n\nconsole.log(output);\n\noutput.innerHTML\
    \ = '';\n\nconst tabValue = {\n\n rows: 5,\n\n cols: 9\n\n}\n\nconst main = addTable(output,\
    \ tabValue.rows, tabValue.cols);\n\nconst btn1 = btnMaker(output, 'Random', 'blue',\
    \ 'white');\n\nconst btn2 = btnMaker(output, 'MoveDown', 'red', 'white');\n\n\
    const btn3 = btnMaker(output, 'MoveLeft', 'purple', 'white');\n\nbtn3.addEventListener('click',\
    \ (e) => {\n\n const tds = main.querySelectorAll('td');\n\n for (let i = 0; i\
    \ < tds.length; i++) {\n\n      console.log(tds.length, i);\n\n const bgColor\
    \ = (i + 1 == tds.length) ? ranColor() : tds[i + 1].style.backgroundColor;\n\n\
          console.log(bgColor);\n\n      tds[i].style.backgroundColor = bgColor;\n\
    \n  }\n\n})\n\nbtn1.addEventListener('click', (e) => {\n\n const tds = main.querySelectorAll('td');\n\
    \n  console.log(tds);\n\n  tds.forEach(ele => {\n\n      console.log(ele);\n\n\
          ele.style.backgroundColor = ranColor();\n\n  })\n\n})\n\nbtn2.addEventListener('click',\
    \ (e) => {\n\n const tds = main.querySelectorAll('td');\n\n let holder = [];\n\
    \n  tds.forEach((ele, ind) => {\n\n let temp = ind - tabValue.cols;\n\n let tempColor\
    \ = '';\n\n //console.log(temp);\n\n if (temp >= 0) {\n\n const el = tds[temp];\n\
    \n          tempColor = el.style.backgroundColor;\n\n //ele.style.backgroundColor\
    \ =\n\n} else {\n\n          tempColor = ranColor();\n\n      }\n\n      holder.push(tempColor);\n\
    \n  })\n\n  console.log(holder);\n\n  holder.forEach((val, ind) => {\n\n     \
    \ tds[ind].style.backgroundColor = val;\n\n  })\n\n})\n\nfunction  ranColor()\
    \ {\n\n return  `#${Math.random().toString(16).slice(2,8)}`;\n\n}\n\nfunction\
    \  btnMaker(parent, html, clr, fntColor) {\n\n const btn = document.createElement('button');\n\
    \n  btn.innerHTML = html;\n\n  btn.style.backgroundColor = clr;\n\n  btn.style.color\
    \ = fntColor;\n\n return parent.appendChild(btn);\n\n}\n\nfunction  addTable(parent,\
    \ rows, cols) {\n\n const tbl = document.createElement('table');\n\n  tbl.style.border\
    \ = '1px solid black';\n\n const tblby = document.createElement('tbody');\n\n\
      tbl.append(tblby);\n\n let counter = 0;\n\n let wid = (100 / cols) * 100;\n\n\
    \ for (let y = 0; y < rows; y++) {\n\n const tr = document.createElement('tr');\n\
    \n for (let x = 0; x < cols; x++) {\n\n const td = document.createElement('td');\n\
    \n          counter++;\n\n          td.textContent = `${counter}`;\n\n         \
    \ td.style.width = `${wid}px`;\n\n          td.style.border = '1px solid #ddd';\n\
    \n          td.style.textAlign = 'center';\n\n          tr.append(td);\n\n         \
    \ td.addEventListener('click', () => {\n\n              document.body.style.backgroundColor\
    \ = td.style.backgroundColor;\n\n          })\n\n      }\n\n      tblby.append(tr);\n\
    \n  }\n\n return parent.appendChild(tbl);\n\n}\n\n# Element Selector Coding Exercise\n\
    \nSelect page elements and Swap of web page Elements within the DOM using JavaScript\
    \ Code.\n\nThis exercise is going to demonstrate how to select an element, and\
    \ then move the element to a new part of the page.   The elements can only exist\
    \ in one place on the page, so when you have the element object selected you can\
    \ then place it and move it to other parts of the webpage.\n\n![](Images/image00465.jpeg)\n\
    \nExercise:\n\n1.  Select the main container element from the HTML\n\n2.  Using\
    \ a loop create 20 spans within the main element\n\n3.  Apply and add styling\
    \ to the spans.  Add an event listener to the element.\n\n4.  On click run a function\
    \ to get the event target element.  Create a global object to hold the selected\
    \ elements. Add a condition that checks if there is a value within the holding\
    \ element.   If there is then using insertBefore add the original element into\
    \ the parent before the new selected element."
