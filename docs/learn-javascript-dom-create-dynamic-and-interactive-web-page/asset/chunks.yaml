  trans: "\n\n页面元素是可以移动的；通过这个对 DOM 页面元素的实时检测器，可以帮助你更直观地看到碰撞检测公式的运行效果。此练习还将演示如何使用 `getBoundingClientRect()`\
    \ 方法在检测函数内部获取元素的边界和尺寸，从而简化碰撞检测。使用 `getBoundingClientRect()` 方法可以消除在对象中跟踪元素位置的需要，并在需要时返回所需的\
    \ `X`、`Y`、`height`、`width` 值。使用之前相同的重叠公式并放置元素返回的对象值，可以提供一个用于任何元素碰撞检测的快速检查函数。在函数参数中，只需要元素对象，这些对象也可以通过选择或从预定义的元素变量中使用。\n\
    \n![](img/image00485.jpeg)\n\n要检查任何两个元素是否重叠，你需要两个元素的 `x,y`、`height` 和 `width`\
    \ 值。然后可以使用这些值来计算角，以检查水平轴上的重叠和垂直轴上的重叠。如果水平和垂直方向重叠，则页面上的两个元素之间发生了碰撞。\n\n使用 `getBoundingClientRect()`\
    \ 将返回元素的尺寸。该方法返回一个值对象，其属性包括 `bottom`、`height`、`left`、`right`、`top`、`width`、`x`、`y`。\n\
    \n![](img/image00486.jpeg)\n\n这些元素值可以用于碰撞公式以检查重叠。\n\n![](img/image00487.jpeg)\n\
    \n### X-水平检测公式\n```\n(a.x < (b.x + b.width)) && ((a.x + a.width) > b.x);\n```\n\
    \n### y-垂直检测公式\n```\n(a.y < (b.y+b.height)) && ((a.y + a.height) > b.y);\n```\n\
    \n### 检查元素重叠移动练习：\n1. 创建移动输出区域以显示元素的当前状态和碰撞值。如果发生重叠，则更新元素的样式。\n2. 在中心创建一个新元素，用于碰撞检查函数。\n\
    3. 创建一个需要两个参数的新函数，每个参数对应一个待检查的元素。获取元素的边界。\n4. 创建函数 `col()`，它可以检查边界并在两个元素重叠时返回一个布尔值。使用此公式检查屏幕上不同框之间的元素重叠。\n\
    5. 根据碰撞检测的结果更新元素样式和输出信息样式。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript\
    \ Course</title>\n <style>\n .container {\n position: relative;\n background-color:\
    \ #ddd;\n width: 90vw;\n margin: auto;\n }\n .box {\n position: absolute;\n width:\
    \ 50px;\n height: 50px;\n left: 0;\n top: 0px;\n line-height: 50px;\n text-align:\
    \ center;\n color: white;\n }\n .info {\n background-color: white;\n padding:\
    \ 5px;\n text-align: center;\n font-size: 1.4em;\n color: white;\n }\n .output1{\n\
    \ color:black;\n font-size: 0.9em;\n padding:0px;\n }\n .blocker{\n width:200px;\n\
    \ left:100px;\n top:100px;\n position:absolute;\n height:100px;\n background-color:yellow;\n\
    \ text-align:center;\n line-height:100px;\n font-size:4em;\n }\n .output2{\n color:black;\n\
    \ font-size:2em;\n }\n .info  div {\n padding: 10px;\n }\n .game {\n position:\
    \ relative;\n min-height: 300px;\n }\n </style>\n</head>\n<body>\n <div  class=\"\
    container\"></</div>\n <script  src=\"app8.js\"></script>\n</body>\n</html>\n\
    ```\n\n```javascript\nconst main = document.querySelector('.container');\nconst\
    \ message = adder(main, 'div', '', 'info');\nconst output1 = adder(message, 'div',\
    \ 'Content 1', 'output');\nconst output2 = adder(message, 'div', 'Content 2',\
    \ 'output');\nconst output3 = adder(message, 'div', 'Content 3', 'output1');\n\
    const output4 = adder(message, 'div', 'Content 4', 'output1');\nconst output5\
    \ = adder(message, 'div', 'Content 5', 'output1');\nconst output6 = adder(message,\
    \ 'div', 'Content 6', 'output1');\nconst output7 = adder(message, 'div', 'Content\
    \ 7', 'output2');\nconst output8 = adder(message, 'div', 'Content 8', 'output1');\n\
    const gameBoard = adder(main, 'div', '', 'game');\nconst box3 = adder(gameBoard,'div','AVOID','blocker');\n\
    const box1 = adder(gameBoard, 'div', 'Box 1', 'box');\nbox1.style.backgroundColor\
    \ = 'red';\noutput1.style.backgroundColor = 'red';\nconst box2 = adder(gameBoard,\
    \ 'div', 'Box 2', 'box');\nbox2.style.backgroundColor = 'blue';\noutput2.style.backgroundColor\
    \ = 'blue';\nbox2.style.left = '100px';\nconst game = {\n x1: box1.offsetLeft,\n\
    \ y1: box1.offsetTop,\n x2: box2.offsetLeft,\n y2: box2.offsetTop,\n speed: 5,\n\
    \ w1: box1.offsetWidth,\n h1: box1.offsetHeight,\n w2: box2.offsetWidth,\n h2:\
    \ box2.offsetHeight\n};\nconst keyz = {\n ArrowLeft: false,\n ArrowRight: false,\n\
    \ ArrowUp: false,\n ArrowDown: false,\n KeyA: false,\n KeyS: false,\n KeyZ: false,\n\
    };\ndocument.addEventListener('keydown', (e) => {\n if (e.code in keyz) {\n  keyz[e.code]\
    \ = true;\n }\n});\ndocument.addEventListener('keyup', (e) => {\n if (e.code in\
    \ keyz) {\n  keyz[e.code] = false;\n }\n});\nwindow.addEventListener('DOMContentLoaded',\
    \ mover)\n\nfunction mover() {\n const dim = [gameBoard.offsetWidth, gameBoard.offsetHeight];\n\
    \ // Box 1\n if (keyz.ArrowRight && game.x1 < dim[0]) game.x1 += game.speed;\n\
    \ if (keyz.ArrowLeft && game.x1 > 0) game.x1 -= game.speed;\n if (keyz.ArrowDown\
    \ && game.y1 < dim[1]) game.y1 += game.speed;\n if (keyz.ArrowUp && game.y1 >\
    \ 0) game.y1 -= game.speed;\n box1.style.left = game.x1 + 'px';\n box1.style.top\
    \ = game.y1 + 'px';\n // Box 2\n if (keyz.KeyS && game.x2 < dim[0]) game.x2 +=\
    \ game.speed;\n if (keyz.KeyA && game.x2 > 0) game.x2 -= game.speed;\n if (keyz.KeyZ\
    \ && game.y2 < dim[1]) game.y2 += game.speed;\n if (keyz.KeyW && game.y2 > 0)\
    \ game.y2 -= game.speed;\n box2.style.left = game.x2 + 'px';\n box2.style.top\
    \ = game.y2 + 'px';\n output1.innerHTML = `Box #1 X:${game.x1} Y:${game.y1} W:${game.w1}\
    \ H:${game.h1}`;\n output2.innerHTML = `Box #2 X:${game.x2} Y:${game.y2} W:${game.w2}\
    \ H:${game.h2}`;\n const o3 = game.x1 < (game.x2 + game.w2) && (game.x1 + game.w1)\
    \ > game.x2;\n const o4 = game.y1 < (game.y2 + game.h2) && (game.y1 + game.h1)\
    \ > game.y2;\n output3.style.color = (o3 ? 'green' : 'black');\n output4.style.color\
    \ = (o3 ? 'green' : 'black');\n output5.style.color = (o4 ? 'green' : 'black');\n\
    \ output6.style.color = (o4 ? 'green' : 'black');\n output3.innerHTML = `H ${o3}:\
    \ (${game.x1} < ${game.x2 + game.w2}) && ((game.x1 + game.w1) > game.x2)`;\n output4.innerHTML\
    \ = `H ${o3}: (${game.x1} < ${game.x2 + game.w2}) && ((game.x1 + game.w1) > game.x2)`;\n\
    \ output5.innerHTML = `V ${o4}:${game.y1} < (${game.y2 + game.h2}) && ((game.y1\
    \ + game.h1) > game.y2})`;\n output6.innerHTML = `V ${o4}: ${game.y1} < (${game.y2\
    \ + game.h2}) && (${game.y1 + game.h1}) > game.y2}`;\n const val1 = col(box1,\
    \ box2);\n output7.style.color = val1 ? 'red' : 'black';\n output7.innerHTML =\
    \ `HIT ${val1}`;\n const val2 = col(box1, box3);\n const val3 = col(box2, box3);\n\
    \ box3.style.backgroundColor = val2 ? 'red' : '';\n if (!val2) {\n  box3.style.backgroundColor\
    \ = val3 ? 'blue' : '';\n }\n output8.innerHTML = `Center Box1 ${val2} Box2 ${val3}`;\n\
    }\n\nfunction col(el1, el2) {\n const a = el1.getBoundingClientRect();\n const\
    \ b = el2.getBoundingClientRect();\n //console.log(a);\n return (a.x < (b.x +\
    \ b.width)) && ((a.x + a.width) > b.x) && (a.y < (b.y+b.height)) && ((a.y + a.height)\
    \ > b.y);\n}\n\nfunction adder(parent, t, html, c) {\n const ele = document.createElement(t);\n\
    \  ele.innerHTML = html;\n  ele.classList.add(c);\n return parent.appendChild(ele);\n\
    }\n```\n"
- fmt: "\nObjective of the game is to click the elements, as they drop, try to land\
    \ them on the moving platform to score. First lesson is to set up the basic game\
    \ board and simple interaction with elements and movement. This exercise will\
    \ demonstrate how to create elements, how to move elements by updating style values,\
    \ and how to create interactive elements that respond to a user’s interaction.\n\
    \n![](Images/image00488.jpeg)\n\nUse the `requestAnimationFrame()` method to create\
    \ smooth movement between elements on the page.\n\n### Create basic interactive\
    \ elements that move exercise:\n\n1. Create a function that can set up new page\
    \ elements. Using parameters of the parent element the new element should be added\
    \ too. The element tag type string name. The inner html content of the element\
    \ and a class that gets added to the new elements that are created.\n\n```javascript\n\
    function maker(parent,t,html,c){\n  const ele = document.createElement(t);\n \
    \ ele.innerHTML = html;\n  ele.classList.add(c);\n  return parent.appendChild(ele);\n\
    }\n```\n\n2. Add an event listener that waits for the `DOMContentLoaded` to invoke\
    \ an `init` function that creates the game board content.\n\n3. Add click events\
    \ to the new elements.\n\n4. Create random background colors for the new element\
    \ boxes that are created. `Math.random().toString(16).slice(2,8)`\n\n5. When the\
    \ element box is clicked add the `active` class to the element.\n\n6. Create a\
    \ new function that will handle the animation of elements. This function should\
    \ be invoked once the start game is pressed, and within itself run the `requestAnimationFrame()`\
    \ to the function.\n\n7. Within the `mover()` function get all the active elements,\
    \ get the `offsetTop` value of the element, and increment it by the game speed\
    \ value. Apply the new `top` style position value to the element to make it move.\n\
    \n8. Add a condition to stop the element from moving by removing the `active`\
    \ class from the element once it reaches the bottom of the game container.\n\n\
    ```html\n<!DOCTYPE  html>\n<html>\n<head>\n <title>JavaScript Course</title>\n\
    \ <style>\n * {\nbox-sizing: border-box;\n}\n .container {\nposition: relative;\n\
    width: 90vw;\nmargin: auto;\nbackground-color: #ddd;\nmin-height: 400px;\ntext-align:\
    \ center;\noverflow: hidden;\n}\n .message {\npadding: 10px;\nbackground-color:\
    \ white;\n}\n .btn {\nmin-width: 50%;\nheight: 40px;\nfont-size: 1.4em;\nborder-radius:\
    \ 10px;\n}\n .box {\nposition: absolute;\nleft: 0;\ntop: 0;\nheight: 50px;\nwidth:\
    \ 50px;\nline-height: 30px;\ntext-align: center;\nborder: 1px solid white;\nfont-size:\
    \ 1.5em;\ncolor: white;\nopacity: 0.5;\n}\n .box:hover {\ncursor: pointer;\nborder-color:\
    \ red;\n}\n .active {\nborder-color: black;\nopacity: 1;\n}\n </style>\n</head>\n\
    <body>\n <div  class=\"container\">\n</div>\n <script  src=\"app7.js\"></script>\n\
    </body>\n</html>\n```\n\n```javascript\nconst main = document.querySelector('.container');\n\
    const message = maker(main,'div','Click Start Button','message');\nconst btn1\
    \ = maker(main,'button','Start Game','btn');\nconsole.log(message);\nconst game\
    \ = {box:[],num:15,ani:{},speed:1};\n\nbtn1.onclick = startGame;\n\nwindow.addEventListener('DOMContentLoaded',init);\n\
    \nfunction  init(){\n for(let i=0;i<game.num;i++){\nconst ele = maker(main,'div',i+1,'box');\n\
    \      ele.style.backgroundColor = '#'+Math.random().toString(16).slice(2,8);\n\
    \      ele.onclick = dropper;\n}\n}\nfunction  mover(){\nconst actives = document.querySelectorAll('.active');\n\
    \  actives.forEach((ele)=>{\n      console.log(ele.offsetTop);\nlet y = ele.offsetTop\
    \ + game.speed;\nif(y > 400){\n          ele.classList.remove('active');\n   \
    \   }\n      ele.style.top = y + 'px';\n  })\n  game.ani = requestAnimationFrame(mover);\n\
    }\nfunction  dropper(e){\n  console.log(this);\nthis.classList.add('active');\n\
    }\nfunction  startGame(){\n  btn1.style.display = 'none';\n  message.textContent\
    \ = 'Game';\n  mover();\n}\nfunction  maker(parent,t,html,c){\nconst ele = document.createElement(t);\n\
    \  ele.innerHTML = html;\n  ele.classList.add(c);\nreturn parent.appendChild(ele);\n\
    }\n```\n\n### Element Movement and Collision\n\nUse `requestAnimationFrame()`\
    \ to handle the animation of the falling elements. The position of the box is\
    \ updated based on its `offsetTop` and `game.speed`. If the box reaches the bottom\
    \ of the container, the `active` class is removed.\n\nCollision detection is implemented\
    \ by checking if the box overlaps with the paddle. The logic checks the following:\n\
    - Horizontal overlap: `o1.x < o2.x + o2.w` and `o1.x + o1.w > o2.x`\n- Vertical\
    \ overlap: `o1.y < o2.y + o2.h` and `o1.y + o1.h > o2.y`\n\nWhen a collision occurs,\
    \ the element is removed and the score is updated.\n\n![Chart](Images/image0488.jpeg)\n\
    ![Chart](Images/image0489.jpeg)\n![Chart](Images/image0490.jpeg)\n"
  raw: "Objective of the game is to click the elements, as they drop, try to land\
    \ them on the moving platform to score.  First lesson is to set up the basic game\
    \ board and simple interaction with elements and movement.  This exercise will\
    \ demonstrate how to create elements, how to move elements by updating style values,\
    \ and how to create interactive elements that respond to a user’s interaction.\n\
    \n![](Images/image00488.jpeg)\n\nUse the requestAnimationFrame() method to create\
    \ smooth movement between elements on the page.\n\nCreate basic interactive elements\
    \ that move exercise:\n\n1.  Create a function that can set up new page elements. \
    \ Using parameters of the parent element the new element should be added too. \
    \ The element tag type string name.  The inner html content of the element and\
    \ a class that gets added to the new elements that are created.\n\nfunction maker(parent,t,html,c){  \
    \ const ele = document.createElement(t);   ele.innerHTML = html;   ele.classList.add(c);  \
    \ return parent.appendChild(ele);}\n\n2.  Add an event listener that waits for\
    \ the DOMContentLoaded to invoke an init function that creates the game board\
    \ content.\n\n3.  Add click events to the new elements\n\n4.  Create random background\
    \ colors for the new element boxes that are created.  Math.random().toString(16).slice(2,8)\n\
    \n5.  When the element box is clicked add the active class to the element.\n\n\
    6.  Create a new function that will handle the animation of elements. This function\
    \ should be invoked once the start game is pressed, and within itself run the\
    \ requestAnimationFrame() to the function.\n\n7.  Within the mover() function\
    \ get all the active elements, get the offset top value of the element, and increment\
    \ it by the game speed value.  Apply the new top style position value to the element\
    \ to make it move.\n\n8.  Add a condition to stop the element from moving by removing\
    \ the active class from the element once it reaches the bottom of the game container.\n\
    \n<!DOCTYPE  html>\n\n<html>\n\n<head>\n\n <title>JavaScript Course</title>\n\n\
    \ <style>\n\n * {\n\n box-sizing: border-box;\n\n       }\n\n .container {\n\n\
    \ position: relative;\n\n width: 90vw;\n\n margin: auto;\n\n background-color:\
    \ #ddd;\n\n min-height: 400px;\n\n text-align: center;\n\n overflow: hidden;\n\
    \n       }\n\n .message {\n\n padding: 10px;\n\n background-color: white;\n\n\
           }\n\n .btn {\n\n min-width: 50%;\n\n height: 40px;\n\n font-size: 1.4em;\n\
    \n border-radius: 10px;\n\n       }\n\n .box {\n\n position: absolute;\n\n left:\
    \ 0;\n\n top: 0;\n\n height: 50px;\n\n width: 50px;\n\n line-height: 30px;\n\n\
    \ text-align: center;\n\n border: 1px solid white;\n\n font-size: 1.5em;\n\n color:\
    \ white;\n\n opacity: 0.5;\n\n       }\n\n .box:hover {\n\n cursor: pointer;\n\
    \n border-color: red;\n\n       }\n\n .active {\n\n border-color: black;\n\n opacity:\
    \ 1;\n\n       }\n\n </style>\n\n</head>\n\n<body>\n\n <div  class=\"container\"\
    >\n\n </div>\n\n <script  src=\"app7.js\"></script>\n\n</body>\n\n</html>\n\n\
    const main = document.querySelector('.container');\n\nconst message = maker(main,'div','Click\
    \ Start Button','message');\n\nconst btn1 = maker(main,'button','Start Game','btn');\n\
    \nconsole.log(message);\n\nconst game = {box:[],num:15,ani:{},speed:1};\n\nbtn1.onclick\
    \ = startGame;\n\nwindow.addEventListener('DOMContentLoaded',init);\n\nfunction\
    \  init(){\n\n for(let i=0;i<game.num;i++){\n\n const ele = maker(main,'div',i+1,'box');\n\
    \n       ele.style.backgroundColor = '#'+Math.random().toString(16).slice(2,8);\n\
    \n       ele.onclick = dropper;\n\n   }\n\n}\n\nfunction  mover(){\n\n const actives\
    \ = document.querySelectorAll('.active');\n\n   actives.forEach((ele)=>{\n\n      \
    \ console.log(ele.offsetTop);\n\n let y = ele.offsetTop + game.speed;\n\n if(y\
    \ > 400){\n\n           ele.classList.remove('active');\n\n       }\n\n      \
    \ ele.style.top = y + 'px';\n\n   })\n\n   game.ani = requestAnimationFrame(mover);\n\
    \n}\n\nfunction  dropper(e){\n\n   console.log(this);\n\n this.classList.add('active');\n\
    \n}\n\nfunction  startGame(){\n\n   btn1.style.display = 'none';\n\n   message.textContent\
    \ = 'Game in Play';\n\n   mover();\n\n}\n\nfunction  maker(parent,t,html,c){\n\
    \n const ele = document.createElement(t);\n\n   ele.innerHTML = html;\n\n   ele.classList.add(c);\n\
    \n return parent.appendChild(ele);\n\n}\n\n# Element Movement and Collision Detection\n\
    \nExplore how to apply game logic and create animation within the game.  Moving\
    \ the elements on the page once the user clicks them.  This is the action that\
    \ the game is waiting for from the user, and it initiates the sequence of the\
    \ game.  The use of JavaScript Math random method allows for the creation of more\
    \ engaging content.  Random positions create non repetitive game interactions\
    \ that make the game more engaging. \n\nAutomatic movement of the paddle will\
    \ create the challenge in the game play, as the play must now be able to anticipate\
    \ the position and plan for an intersection of the two elements.  This is the\
    \ challenge of the game that the player accomplishing.  For gameplay to be effective\
    \ the interactions must be possible but not always certain.\n\nAdding collision\
    \ detection between the two elements will allow the code to create the necessary\
    \ logic to check for a successful outcome from the user action.\n\n![](Images/image00489.jpeg)\n\
    \nTo calculate overlap of elements you can use the below logic.  If there is overlap\
    \ of the element corners and calculating the width of the element, we can detect\
    \ the overlap.  This needs to be applied separately for both axis’s, horizontal\
    \ has a check and vertical has a check.  If both are true, then there is overlap. \n\
    \nOn the horizontal axis - (o1.x < o2.x+o2.w && o1.x+o1.w > o2.x) – where o1 is\
    \ the first object, and o2 is the second object.\n\nOn the vertical axis - (o1.y\
    \ < o2.y+o2.h && o1.y+o1.h > o2.y)\n\n![Chart, waterfall chart Description automatically\
    \ generated](Images/image00490.jpeg)\n\nUpdate the game object and detect collision\
    \ of page elements exercise:\n\n1.  Create a paddle element that can move from\
    \ side to side.\n\n2.  Add values in the game object, to be able to stop the game\
    \ play, and keep track of a score.  Create different speeds for the paddle and\
    \ the falling box elements.  Track the main page width so that elements can be\
    \ randomly placed within the game screen width.\n\n3.  Randomly set the x axis\
    \ values for the box elements so they are spread out randomly across the top of\
    \ the screen.\n\n4.  Once the paddle goes off the container then set it to move\
    \ the opposite direction.\n\n5.  Add the paddle movement within the animation\
    \ frame. \n\n6.  Within the animation frame check the position of the active elements,\
    \ checking for both x and y axis overlaps of corners of the elements.\n\n7.  If\
    \ the position of the box plus its height is greater than the paddle y position,\
    \ and the box y position is less than the paddle plus its height then there is\
    \ an overlap on the y axis.\n\n8.  If there is overlap of the values of the 2\
    \ objects, and box x position is less than paddle x plus the width, and also the\
    \ box plus its width is greater than the paddle x position then there is a hit\
    \ on the x axis.\n\n9.  If a hit occurs, then remove the element.\n\n10.  If the\
    \ element ends up having a y position off screen, then reset the random x position\
    \ and update the y to the top of the screen again. \n\n11.  The gameplay will\
    \ continue removing only the elements that hit the paddle and resetting the misses\
    \ back to the top.\n\n12.  Add tracking of the hits and misses, add the element\
    \ x,y and the paddle x,y to the message area for debugging if needed.\n\n13. \
    \ Adjust the position of the page elements to enhance the game screen area.\n\n\
    <!DOCTYPE  html>\n\n<html>\n\n<head>\n\n <title>JavaScript Course</title>\n\n\
    \ <style>\n\n * {\n\n box-sizing: border-box;\n\n       }\n\n .container {\n\n\
    \ position: relative;\n\n width: 90vw;\n\n margin: auto;\n\n border:1px solid\
    \ #ddd;\n\n text-align: center;\n\n       }\n\n .gameboard {\n\n position: relative;\n\
    \n background-color: #ddd;\n\n min-height: 400px;\n\n       }\n\n .message {\n\
    \n padding: 10px;\n\n background-color: white;\n\n       }\n\n .btn {\n\n min-width:\
