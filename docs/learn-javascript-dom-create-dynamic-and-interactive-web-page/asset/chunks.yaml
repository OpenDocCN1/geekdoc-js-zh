    \ enough!`;\n\n      output.innerHTML += `<div>${message}</div>`;\n\n      myInput.value\
    \ = '';\n\n  }else{\n\n      myInput.value = '';\n\n      output.style.backgroundColor\
    \ = 'red';\n\n      output.style.color = 'white';\n\n      output.textContent\
    \ = 'Please enter a number for your Age!';\n\n  }\n\n}\n\n# JavaScript Math Random\n\
    \nRandom values can be used to generate more engaging interactions, use JavaScript\
    \ to get Random Numbers.  Random values are excellent for games, as the user is\
    \ provided a more challenging experience.\n\nJavaScript Math object contains various\
    \ methods that can be used for math functionality, in addition it also contains\
    \ the random method that creates random values in JavaScript.  The Math.random()\
    \ method returns a floating-point number in the range 0 (inclusive of 0) to less\
    \ than 1 (not including 1). The random value can then be multiplied and rounded\
    \ to the nearest whole number to include the randomized range of values desired\
    \ by the developer.\n\nRandom values are ideal for games and to create unique\
    \ custom experiences for web users.\n\nRandom Number Interactive Guessing Game\
    \ with JavaScript and the DOM coding exercise\n\nIn this exercise create a random\
    \ number guessing game that will provide a random range of numbers that the user\
    \ has to guess the correct number from.  The application will provide the user\
    \ feedback whether the guess was too high or too low, allowing for the user to\
    \ narrow the range of the hidden number.   Once the solution is found matching\
    \ the input value to the hidden number, the game starts again generating the random\
    \ number and a new range to guess.   Feedback is provided to the user in the HTML\
    \ element, so that the user playing the game knows the results and what to do\
    \ next.  This is a perfect example of a simple game that can be created with JavaScript\
    \ and interacting with the DOM page elements.\n\nExample of steps within the gameplay\
    \ for the player to guess the correct number.  The correct number needs to be\
    \ determined by using the feedback presented by the application back to the user.\n\
    \nStart by asking for a number within a range.\n\n![](Images/image00444.jpeg)\n\
    \nProvide feedback to the player as to the hidden value, so the player can use\
    \ the information for a better guess the following round.\n\n![](Images/image00445.jpeg)\n\
    \nProvide feedback once again to the user, to keep engagement and move the player\
    \ to the next round.\n\n![](Images/image00446.jpeg)\n\nOnce the player guesses\
    \ the correct value of the hidden number provide the ending feedback to the player.\n\
    \n![](Images/image00447.jpeg)\n\nLesson JavaScript Coding Exercise:\n\n1.  Select\
    \ the HTML page elements as variables within your JavaScript code.\n\n2.  Create\
    \ declare variables globally for a lowValue, highValue, and hiddenNumber\n\n3.\
    \  Create a function to start the game called starter(). \n\n4.  Create a function\
    \ to generate random numbers using min and max values are parameters within the\
    \ function.  Wrap the Math.random() within the Math.floor() to round down to the\
    \ nearest whole number.  Math.floor(Math.random()).   Multiply the random value\
    \ by the max minus the minimum, to include the max value add plus 1 to the multiplied\
    \ number.  Within the result add 1 to increment from 0 to the starting value of\
    \ the minimum number.\n\n5.  Within the starter() function, generate a low value,\
    \ a high value and a hidden number value with random numbers. \n\n6.  Update the\
    \ HTML output div to provide instructions for the user to guess a number between\
    \ the random range.\n\n7.  For the input element, change the type to number, and\
    \ set attributes to min and max from the random values.\n\n8.  Add an event listener\
    \ for onclick to the button page element, once clicked the button should invoke\
    \ a function called clickedMe()\n\n9.  Within the clickerMe() function get the\
    \ input value.  \n\n10.  Check if the hidden number matches the value of the input\
    \ value.  If it does, then output is correct and run the starter function again.\n\
    \n11.  If the guess is incorrect, check whether the guess is lower or higher than\
    \ the hidden number value.  If it's lower, update the lowValue with the input\
    \ value, and provide feedback to the user to guess higher.  If the guess is high,\
    \ provide feedback to the user, and update the high value with the input value.\n\
    \n12.  The game should continue until the correct number is guessed, once the\
    \ correct number is found then the game will reset and run again with new random\
    \ numbers.\n\n<!doctype  html>\n\n<html>\n\n<head>\n\n <title>JavaScript</title>\n\
    \n</head>\n\n<body>\n\n<div>Hello World 1</div>\n\n<input  type=\"text\"  >\n\n\
    <button  type=\"button\">Click</button>\n\n<script  src=\"app.js\"></script>\n\
    \n</body>\n\n</html>\n\nconst output = document.querySelector('div');\n\nconst\
    \ myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nlet lowValue = 1;\n\nlet highValue = 10;\n\nlet hiddenNumber = 0;\n\noutput.innerHTML\
    \ = '';\n\nstarter();\n\nfunction  starter(){\n\n  myInput.value = '';\n\n  lowValue\
    \ = getRan(0,5);\n\n  highValue = getRan(lowValue +1,50);\n\n  hiddenNumber =\
    \ getRan(lowValue,highValue);\n\n  output.innerHTML += `<div>Guess a number between\
    \ ${lowValue} and ${highValue}</div>`;\n\n  btn.onclick = clickedMe;\n\n  myInput.setAttribute('type','number');\n\
    \n  myInput.setAttribute('min',lowValue);\n\n  myInput.setAttribute('max',highValue);\n\
    \n  btn.textContent = 'Enter Guess';\n\n}\n\nfunction  clickedMe(){\n\n const\
    \ valInput = myInput.value;\n\n if(valInput == hiddenNumber){\n\n      console.log('correct');\n\
    \n      output.innerHTML = `<div>Correct it was ${ hiddenNumber}</div>`;\n\n     \
    \ starter();\n\n  }else{\n\n //let message = (valInput < hiddenNumber) ? 'Go Higher!'\
    \ : 'Go Lower';\n\n let message ;\n\n if(valInput < hiddenNumber){\n\nmessage\
    \ = `${valInput} was wrong Go Higher!`;\n\n          lowValue = valInput;\n\n\
          }else{\n\nmessage = `${valInput} was wrong Go Lower!`;\n\n          highValue\
    \ = valInput;\n\n      }\n\n      output.innerHTML = `<div>${message}</div>`;\n\
    \n      console.log(hiddenNumber);\n\n      myInput.value = '';\n\n      output.innerHTML\
    \ += `<div>Guess Again between ${lowValue} and ${highValue}!</div>`;\n\n  }\n\n\
     //let temp = Math.random()*10+1;\n\n //console.log(temp);\n\n //temp = Math.floor(temp);\n\
    \n //output.textContent += `${temp}, `;\n\n}\n\nfunction  getRan(min,max){\n\n\
    \ return Math.floor(Math.random() * (max-min+1) + min);\n\n}\n\n# JavaScript Looping\
    \ Blocks of Code"
