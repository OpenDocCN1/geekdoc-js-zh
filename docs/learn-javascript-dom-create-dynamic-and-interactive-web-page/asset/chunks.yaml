  trans: "\n\n```javascript\nhtml += `<div>${val **val} = ${val} X ${val}</div>`;\n\
    \noutput.innerHTML = html;\n\n}\n```\n\n# 使用三元运算符的条件\n\nJavaScript 三元运算符提供了一种创建短单语句条件的方法，其返回的值取决于条件的布尔值结果。\n\
    \n## 课程 JavaScript 编码练习：\n\n1. 获取输入框中输入的值，检查它是否为数字。如果不是数字，则在条件中更新输出文本，向用户显示消息。更改输出元素的背景样式和颜色。\n\
    2. 如果是数字，使用三元运算符根据输入框中输入的值，为用户创建一个输出消息。\n3. 检查输入的数字是否大于 19 或等于 19，如果是，则显示允许该人员进入的消息；否则拒绝该人员进入。\n\
    \n```javascript\nconst output = document.querySelector('div');\n\nconst myInput\
    \ = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = clickedMe;\n\nlet val = (true) ? 'true' : 'false';\n\nval = (true\
    \ && false) ? 'true' : 'false';\n\nval = (10 > 5) ? 'true' : 'false';\n\nval =\
    \ (isNaN('test')) ? 'true' : 'false';\n\noutput.textContent = 'How old are you?';\n\
    \nbtn.textContent = 'Entry Checker';\n\nconsole.log(val);\n\nfunction clickedMe(){\n\
    \n  const myAge = myInput.value;\n\n  if(!isNaN(myAge)){\n\n      console.log('ready');\n\
    \      output.style.backgroundColor = 'white';\n      output.style.color = 'black';\n\
    \      output.textContent = 'Please enter your Age?';\n\n     const message =\
    \ myAge >= 19 ? `${myAge} is allowed to enter.` : `${myAge} is not old enough!`;\n\
    \n      output.innerHTML += `<div>${message}</div>`;\n\n      myInput.value =\
    \ '';\n\n  }else{\n      myInput.value = '';\n      output.style.backgroundColor\
    \ = 'red';\n      output.style.color = 'white';\n      output.textContent = 'Please\
    \ enter a number for your Age!';\n  }\n}\n```\n\n# JavaScript 数学随机\n\n随机值可以用于生成更具吸引性的交互，使用\
    \ JavaScript 获取随机数。随机值非常适合游戏，因为为用户提供了更具挑战性的体验。\n\n`Math` 对象包含了多种可以用于数学功能的方法，此外，它还包含\
    \ `random` 方法，用于在 JavaScript 中创建随机值。`Math.random()` 方法返回一个从 0（包含 0）到小于 1（不包含 1）之间的浮点数。然后可以将随机值进行相乘并四舍入到最近的整数，以包含开发者所需的随机范围值。\n\
    \n随机值是游戏以及为网络用户创建独特自定义体验的理想选择。\n\n## 使用 JavaScript 和 DOM 的随机数交互猜数字游戏编码练习\n\n在此练习中，创建一个随机猜数字游戏，该游戏将提供一个随机范围，用户必须从中猜数字数字。应用程序将向用户提供反馈，说明猜测太高还是太低，允许用户缩小隐藏数字的范围。一旦找到输入值与隐藏数字匹配的解决方案，游戏将重新生成随机数和新的猜数字范围。反馈通过\
    \ HTML 元素提供给用户，这样玩游戏的玩家就知道结果以及下一步该做什么。这是一个使用 JavaScript 和与 DOM 页面元素交互创建简单游戏的完美示例。\n\
    \n玩家在游戏中猜出正确数字的步骤示例。正确数字需要通过应用程序返回给用户的反馈来确定。\n\n从询问一个范围内的数字开始。\n\n![](img/image00444.jpeg)\n\
    \n向玩家提供关于隐藏值的反馈，以便玩家可以使用这些信息在下一轮进行更好的猜测。\n\n![](img/image00445.jpeg)\n\n再次向用户提供反馈，以保持参与度并让玩家进入下一轮。\n\
    \n![](img/image00446.jpeg)\n\n一旦玩家猜中了隐藏数字的正确值，为玩家提供结束反馈。\n\n![](img/image00447.jpeg)\n\
    \n## 课程 JavaScript 编码练习：\n\n1. 在 JavaScript 代码中将 HTML 页面元素选择为变量。\n2. 全局声明变量 `lowValue`、`highValue`\
    \ 和 `hiddenNumber`。\n3. 创建一个名为 `starter()` 的函数来启动游戏。\n4. 创建一个使用 `min` 和 `max`\
    \ 值作为参数生成随机数的函数。将 `Math.random()` 封装在 `Math.floor()` 中以向下取整到最近的整数。`Math.floor(Math.random())`。将随机值乘以最大值减去最小值，为了包含最大值，在乘积上加\
    \ 1。在结果中加 1 以从 0 增加到 1。\n5. 在 `starter()` 函数内部生成随机数。\n6. 更新 HTML 以提供指令。\n7. 对于输入元素，设置属性\
    \ `min` 和 `max`。\n8. 为按钮添加 `onclick` 事件监听器。\n9. 在 `clickedMe()` 函数中，获取输入值。\n10.\
    \ 检查数字是否与输入值匹配。\n11. 如果猜错了，则更新值。\n12. 游戏应一直持续，直到猜出正确数字。\n\n```html\n<!doctype\
    \ html>\n<html>\n<head>\n<title>JavaScript</title>\n</head>\n<body>\n<div>Hello\
    \ World</div>\n<input type=\"text\">\n<button type=\"button\">Click</button>\n\
    <script src=\"app.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst\
    \ output = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\n\nlet lowValue = 1;\nlet highValue\
    \ = 10;\nlet hiddenNumber = 0;\n\noutput.innerHTML = '';\n\nfunction starter(){\n\
    \  myInput.value = '';\n  lowValue = getRan(0,5);\n  highValue = getRan(lowValue,50);\n\
    \  hiddenNumber = getRan(lowValue,highValue);\n  output.innerHTML += `<div>Guess\
    \ a number between ${lowValue} and ${highValue}</div>`;\n  btn.onclick = clickedMe;\n\
    \  myInput.setAttribute('type','number');\n  myInput.setAttribute('min',lowValue);\n\
    \  myInput.setAttribute('max',highValue);\n  btn.textContent = 'Enter Guess';\n\
    }\n\nfunction clickedMe(){\n  const valInput = myInput.value;\n  if(valInput ==\
    \ hiddenNumber){\n    console.log('correct');\n    output.innerHTML = `<div>Correct\
    \ it was ${hiddenNumber}</div>`;\n    starter();\n  } else {\n    let message;\n\
    \    if(valInput < hiddenNumber){\n      message = `${valInput} was wrong Higher!`;\n\
    \      lowValue = valInput;\n    } else {\n      message = `${valInput} was wrong\
    \ Lower!`;\n      highValue = valInput;\n    }\n    output.innerHTML = `<div>${message}</div>`;\n\
    \    console.log(hiddenNumber);\n    myInput.value = '';\n    output.innerHTML\
    \ += `<div>Guess Again between ${lowValue} and ${highValue}!</div>`;\n  }\n}\n\
    \nfunction getRan(min,max){\n  return Math.floor(Math.random() * (max-min+1) +\
    \ min);\n}\n```\n\n# JavaScript 循环代码块\n\n"
- fmt: "\nJavaScript `For`, `While`, `Do While` Loops Run blocks of code multiple\
    \ times over until the condition is met.\n\nLoops allow us to execute blocks of\
    \ code several times, they also allow us to iterate through a list of items such\
    \ as items in an array until the length of the array items condition is no longer\
    \ true, or other condition to break out of the looping.\n\nLoops will always require\
    \ several parameters, such as a starting value, a condition to stop the loop and\
    \ a way to move through the items to the next item in the loop. We can set up\
    \ a simple `for` loop by setting a variable to use with a starting value, then\
    \ applying a condition to continue the loop if the condition is true and incrementing\
    \ the value of the variable so that eventually the condition is no longer true.\n\
    \n![](Images/image00448.jpeg)\n\n### Lesson JavaScript Coding Exercise:\n\n1.\
    \ Select the page elements as JavaScript variables.\n2. Update the input field\
    \ attributes to be a number input type, with a `min` and `max` value.\n3. Add\
    \ a click event listener to the button element.\n4. When the button is clicked,\
    \ get the input value as a variable called `num`. Create a `for` loop to iterate\
    \ a block of code the number of times from the input `num` value.\n5. Create a\
    \ `while` loop that will output `html` the number of times from the input value.\n\
    6. Create a `do while` loop which will create the `html` output the number of\
    \ times from the input.\n7. Update the `html` with the new content.\n\n```html\n\
    <!doctype html>\n<html>\n<head>\n <title>JavaScript</title>\n</head>\n<body>\n\
    <div>JavaScript</div>\n<input type=\"text\" >\n<button type=\"button\">Click</button>\n\
    <script src=\"dom7.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst\
    \ output = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\n\nmyInput.setAttribute('type','number');\n\
    myInput.setAttribute('max',20);\nmyInput.setAttribute('min',0);\nmyInput.value\
    \ = 5;\nbtn.onclick = btnClicked;\n\nfunction btnClicked(){\n  console.clear();\n\
    \  let num = myInput.value;\n  let html = '';\n  for(let i=0;i<num;i++){\n   \
    \ console.log(i);\n    html += `<div>${i+1} For</div>`;\n  }\n  let i = 10;\n\
    \  while(i<num){\n    i++;\n    html += `<div>${i} While</div>`;\n  }\n  do{\n\
    \    i++;\n    html += `<div>${i} Do</div>`;\n  } while(i<num);\n  output.innerHTML\
    \ = html;\n  console.log('ready');\n}\n```\n\n# JavaScript Objects\n\nJavaScript\
    \ objects can be used to contain a lot of related data, this example will demonstrate\
    \ how to use `Objects` in code.\n\nOne of JavaScript's data types is an `object`.\
    \ These can be used to store various key value pair collections and even more\
    \ complex entities. The document is a giant `object` that contains a lot of entities.\
    \ Learning more about objects will help better define what can be done with the\
    \ `DOM` entities, how they behave and why as well as how they can be used.\n\n\
    ![](Images/image00449.jpeg)\n\n### Lesson JavaScript Coding Exercise:\n\n1. Select\
    \ the page elements from the HTML file as JavaScript `objects`.\n2. Create a global\
    \ object that has a value for `first`, `last`, `id` and create several methods\
    \ in the object.\n3. Create a method in the object that uses the `first` and `last`\
    \ name values from the object and combines them into a string, including the `id`\
    \ and any value the is sent to the function as an argument.\n4. Create a method\
    \ within the object that can update the object's `first` and `last` name. Generate\
    \ a random value for the object `id`. Return the combined current object property\
    \ values.\n5. When the button is clicked update the value of the object `first`\
    \ property.\n6. Output on the page and in the console the new string invoking\
    \ the methods for the `fullName` from the object.\n7. Get the object entries as\
    \ nested array values and create a new array using `Object.entries()`.\n8. Get\
    \ and create an array with the object keys `Object.keys()`.\n9. Get and create\
    \ an array with the object values `Object.values()`.\n10. Using the `in` or `condition`\
    \ check if a key is contained within the object.\n11. Loop through the properties\
    \ names from an object and output them in the console.\n12. Check to see the datatype\
    \ of the property value, if it's a `string` or `number` output it into the console\
    \ otherwise output a warning into the console.\n\n```javascript\nconst output\
    \ = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\nbtn.onclick = btnClicked;\nmyInput.value\
    \ = 'Laurence';\n\nconst myObj = {\n  first : 'Laurence',\n  last : 'Svekis',\n\
    \  ele : output,\n  id : 0,\n  fullName : function(val){\n    return `${this.first}\
    \ ${this.last} ${this.id} ${val}`\n  },\n  zName(val){\n    return `${this.first}\
    \ ${this.last} ${this.id} ${val}`\n  },\n  adder(first,last){\n    this.first\
    \ = first;\n    this.last = last;\n    this.id = Math.floor(Math.random()*100);\n\
    \    return `${this.first} ${this.last} ${this.id}`;\n  }\n};\n\nfunction btnClicked(){\n\
    \  const newFirst = 'Laurence';\n  const ranNum = Math.floor(Math.random()*100);\n\
    \  const newLast = 'Svekis';\n  myObj.adder(newFirst, newLast);\n  output.innerHTML\
    \ = `<div>${myObj.fullName('test')}</div>`;\n  console.log(myObj.fullName('test'));\n\
    \  const arr1 = Object.entries(myObj);\n  const arr2 = Object.keys(myObj);\n \
    \ const arr3 = Object.values(myObj);\n  const key = myInput.value;\n  if (key\
    \ in myObj){\n    for(const prop in myObj){\n      console.log(prop);\n      const\
    \ val = myObj[prop];\n      if(typeof val === 'string' || typeof val === 'number'){\n\
    \        console.log(val);\n      } else {\n        console.warn(val);\n     \
    \ }\n    }\n  }\n}\n```\n\n# Object Construction with JavaScript\n\nYou can use\
    \ functions to construct objects, using the arguments. This creates a separate\
    \ instance of the object. The function block of code will relate to the object.\n\
    \n### Lesson JavaScript Coding Exercise:\n\n1. Get the value from the input field,\
    \ using it to create a new object for a person. This should set the `first`, `last`\
    \ and using both of those create a `full` name for the object.\n2. Add to the\
    \ function default values in case the `arguments` do not have values.\n\n```javascript\n\
    const output = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\nbtn.onclick = btnClicked;\nmyInput.value\
    \ = 'Laurence';\n\nfunction FullName(first='Laurence',last='Svekis'){\n  this.firstName\
    \ = first;\n  this.lastName = last;\n  this.full = `${first} ${last}`;\n}\n\n\
    function btnClicked(){\n  const person = new FullName(myInput.value, 'Smith');\n\
    \  output.innerHTML = `<div>${person.full}</div>`;\n  console.log(person.full);\n\
    }\n```\n\n# JavaScript Array values\n\nCommon JavaScript Array Methods to Update\
    \ Array values can be used to make use of the data in the array. Array methods\
    \ provide a powerful way to interact with the data and use the data contained\
    \ within the array.\n\n`arr.push(val)` // add to array return the array length\n\
    `arr.pop()` // remove last\n`arr.shift()` // remove first item\n`arr.unshift(val)`\
    \ // add to the front of array array length returned\n`arr.splice(1)` // return\
    \ array with all items after the index of 1\n`splice(start, deleteCount, val)`\
    \ // changes the contents of an array\n`arr.slice(start, end)` // returns a copy\
    \ of a portion of an array into a new array\n`arr.slice()` // duplicate array\
    \ as new array\n`arr.slice(5)` // return array items from index 5\n`arr.slice(1,4)`\
    \ // return portion of array using slice\n`arr.toString()` // returns a string\
    \ representation of the array items\n"
