  trans: "\n\n# 如何对数组进行反序和字母顺序排序。\n\n## JavaScript 编码练习：\n\n1. 一个一个包含某些值的数组，并向数组中添加随机数。\n\
    2. 当按钮被点击时，从现有数组创建一个新数组，过滤出数据类型为数字或字符串的数据。\n3. 使用 `array.length` 和 `Math.random()`\
    \ 为数组项选择一个随机的索引值。\n4. 点击时，切换 `sort()` 或 `reverse()` 方法对数组进行就地排序（in-place）。\n5.\
    \ 将数组作为字符串输出到页面的 HTML 中。\n6. 使用 `sort()` 添加一个 `Math.random()` 的返回值，结果为正数或负数，这将使数组在就地的情况下进行随机化。\n\
    7. 将数组的随机化操作封装在一个循环中，测试 10 次以查看随机的数组顺序，将其输出到页面的 HTML 中。\n8. 使用 `forEach()` 循环遍历所有数组项并将它们添加到\
    \ HTML 中。\n\n```javascript\nconst output = document.querySelector('div');\n\n\
    const myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nmyInput.value = 10;\n\nmyInput.setAttribute('type','number');\n\
    \nconst arr = ['one','two','three','four','five'];\n\nlet boo = true;\n\nfor(let\
    \ i=0;i<10;i++){\n  const ranValue = Math.floor(Math.random()*100);\n  arr.push(ranValue);\n\
    }\n\nconsole.log(arr);\n\nfunction btnClicked(){\n  const arr1 = arr.filter((ele)=>{\n\
    \    return typeof(ele) == 'string';\n  })\n  const ind = Math.floor(Math.random()*arr.length);\n\
    \  output.innerHTML = `Random Array Item with index of ${ind} value ${arr[ind]}`;\n\
    \  let html = '';\n  if(boo){\n    arr.sort();\n    boo = false;\n  }else{\n \
    \   arr.reverse();\n  }\n  html += `<div>${arr.toString()}</div>`;\n  for(let\
    \ i=0;i<10;i++){\n    arr.sort(()=>{\n      return Math.random() - 0.5;\n    });\n\
    \    html += `<div>${arr.toString()}</div>`;\n  }\n  arr.forEach((ele,ind)=>{\n\
    \    html += `<div>${ind} - ${ele}</div>`;\n  })\n  output.innerHTML += html;\n\
    \  console.log(arr1);\n}\n```\n\n## 查找数组值\n\nJavaScript 数组拥有在数组中查找项的方法，此练习提供了如何查找数组项的示例。JavaScript\
    \ 有几种方法可以检查数组中包含的值。\n\n## JavaScript 编码练习：\n\n1. 创建一个包含一些字符串和数字数值的数组。\n2. 使用 `arr.includes()`\
    \ 检查输入框中的值是否在数组中。\n3. 创建一个名为 `html` 的变量，用于构建并返回数组方法响应的字符串。使用三元运算符，根据输入中的术语是否在数组中创建一个响应消息。\n\
    4. 在 html 中添加 `includes` 的响应。\n5. 创建一个 `arr.indexOf()` 检查，数组中的某个值，它将返回索引值，如果未找到则返回\
    \ -1。将结果输出到 HTML 中。\n6. 找到匹配的最后一个项的索引值 `arr.lastIndexOf()`，将结果输出到 HTML 中。\n7.\
    \ 使用 `find()` 返回数组中数字的第一个匹配项，将结果输出到 HTML 中。\n8. 使用 `find()` 返回满足条件（`==` 输入值和数组项值）的第一个匹配项。如果没有找到，它将返回\
    \ `undefined`。将响应结果输出到 HTML 中。\n9. 使用 `find()` 返回数组中大于 10 的值的第一个匹配结果。注意，它也应该包含并返回字符串。\n\
    \n```javascript\nconst output = document.querySelector('div');\n\nconst myInput\
    \ = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nconst arr = ['Svekis','Laurence','100',50,10];\n\
    \nfunction btnClicked(){\n  const val = myInput.value;\n  const res = arr.includes(val);\n\
    \  const message = (res) ? `was found` : `Not Found`;\n  let html = `<h2>Search\
    \ Results for ${val}</h2>`;\n  html += `<div>${val} - ${message}</div>`;\n  html\
    \ += `<div>Includes ${res}</div>`;\n  const indexPos = arr.indexOf(val);\n  html\
    \ += `<div>IndexOf ${indexPos}</div>`;\n  const indexPosLast = arr.lastIndexOf(val);\n\
    \  html += `<div>IndexLast ${indexPosLast}</div>`;\n  const finderVal = arr.find((v)=>{\n\
    \    return typeof(v) == 'number';\n  });\n  html += `<div>Find 1 ${finderVal}</div>`;\n\
    \  const finderValP = arr.find((v)=>{\n    return v == val;\n  });\n  html +=\
    \ `<div>Find 2 ${finderValP}</div>`;\n  const finderValNum = arr.find((v)=>{\n\
    \    return v > 10;\n  });\n  html += `<div>Find 3 ${finderValNum}</div>`;\n \
    \ output.innerHTML = html;\n  console.log(res);\n  console.log(indexPos);\n  console.log(indexPosLast);\n\
    \  console.log(finderVal);\n  console.log(finderValP);\n  console.log(finderValNum);\n\
    }\n```\n\n## String 方法\n\n字符串方法提供了与字符串交互的方式。\n\n![](img/image452.jpeg)\n\n## JavaScript\
    \ 编码练习：\n\n1. 使用 `trim()` 移除输入中的空白。\n2. 当按钮被点击时，输出字符串的长度。\n3. `slice()` 切取字符串部分。\n\
    4. 检查它是否 `includes` 某个值\n5. `replace()` 输出字符串值。\n6. `toLowerCase()` 和 `toUpperCase()`\
    \ 处理相同的。\n7. `indexOf` 获取字符串值。\n8. `lastIndexOf()` 处理相同的字符串值。\n9. `search()` 获取字符串索引。\n\
    10. 创建一个可以对单词进行大写的函数。\n\n```javascript\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nmyInput.value = 'Laurence Svekis';\n\nfunction\
    \ btnClicked(){\n  const val = myInput.value.trim();\n  let html = `<div>${val}</div>`;\n\
    \  html += `<div>Length : ${val.length}</div>`;\n  const key = 'Svekis';\n  const\
    \ inChecker = val.includes(key);\n  const mes1 = inChecker ? ` was There` : `\
    \ was NOT`;\n  html += `<div>'${key}' ${mes1}</div>`;\n  const index1 = val.indexOf('re');\n\
    \  html += `<div>IndexOf ${index1}</div>`;\n  const index2 = val.lastIndexOf('e');\n\
    \  html += `<div>LastIndexOf ${index2}</div>`;\n  const sea1 = val.search('e');\n\
    \  html += `<div>Search ${sea1}</div>`;\n  html += `<div>Capitals ${makeCap(val)}</div>`;\n\
    \  output.innerHTML = html;\n}\n\nfunction makeCap(words){\n  const arr = words.split('\
    \ ');\n  const temp = [];\n  arr.forEach((word)=>{\n    const f = word.charAt(0).toUpperCase();\n\
    \    const remainLetters = word.slice(1);\n    temp.push(f+remainLetters);\n \
    \ })\n  return temp.join(' ');\n}\n```\n\n# 如何打乱字符串字符\n\n此 JavaScript 交互式单词乱序游戏演示了如何使用字符串方法打乱字符串中的字母。\n\
    \n![](img/image453.jpeg)\n\n## JavaScript 编码练习：\n\n1. 创建一个你想要在游戏使用的单词和短语数组。\n\
    2. 创建一个全局游戏对象，用于存储已乱序的单词。\n3. 创建一个启动游戏的函数，名为 `starter`。调用 `starter` 函数。\n4. 更新按钮文本为“检查答案”。\n\
    5. 更新输入框的边框和显示属性为实黑色，并显示为块级。\n6. 清空输入框的当前值。\n7. 使用 `Math.random()` 从单词数组中随机选择一个项。\n\
    8. 创建一个打乱短语中单词的函数，名为 `maker()`。\n\n"
- fmt: "\n9. Within the `maker()` function, convert the string into an array of each\
    \ word. Create a `holder` array to use when you create the scrambled version of\
    \ the words.\n\n10. Loop through all the words in the string, change the words\
    \ to `toLowerCase()`.\n\n11. Split the letters of the word into a separate array.\
    \ Using `sort()`, randomize the letters in the array. Using `join()`, convert\
    \ the array back into a string of randomly sorted letters from the word. Add it\
    \ to the holding array.\n\n12. Return the `holder` array, join the words back\
    \ into a string.\n\n13. Assign the scrambled words to the game's hidden value.\
    \ Output the scrambled version of the phrase into the HTML page.\n\n14. When the\
    \ button is clicked, check for the button text, if its `new game` then launch\
    \ the `starter()` function to relaunch the game.\n\n15. Convert the input to `lowerCase()`.\
    \ Compare the value with the hidden value of the selected string from the array.\
    \ If there is a match, the player solves it. Update the button text to the new\
    \ game.\n\n16. If it's incorrect, provide feedback to the player, asking them\
    \ to try a new letter combination. It will continue to play until the correct\
    \ solution is found.\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>JavaScript</title>\n\
    </head>\n<body>\n  <div>JavaScript</div>\n  <input type=\"text\">\n  <button type=\"\
    button\">Click</button>\n  <script src=\"dom16.js\"></script>\n</body>\n</html>\n\
    ```\n\n```javascript\nconst output = document.querySelector('div');\nconst myInput\
    \ = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nconst arr = ['JavaScript', 'Laurence Svekis', 'Html',\
    \ 'code'];\n\nconst game = {\n  hidden: ''\n};\n\nstarter();\n\nfunction btnClicked()\
    \ {\n  if (btn.textContent == 'New Game') {\n    starter();\n  } else {\n    const\
    \ checkVal = myInput.value.toLowerCase();\n    if (checkVal == game.hidden) {\n\
    \      console.log('correct');\n      output.innerHTML += `<div>Correct it was\
    \ ${checkVal}</div>`;\n      btn.textContent = 'New Game';\n      myInput.style.border\
    \ = 'black solid 1px';\n      myInput.style.display = 'none';\n    } else {\n\
