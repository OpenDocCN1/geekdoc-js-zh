    \ elements on the page.\n\nUsing getBoundingClientRect() will return the dimension\
    \ of an element.  This method returns an object of values which properties include,\
    \ bottom, height, left, right, top, width, x, y\n\n![](Images/image00486.jpeg)\n\
    \nThese values for the element can then be used in the collision formula to check\
    \ for overlap.\n\n![](Images/image00487.jpeg)\n\nX-Horizontal check formula:\n\
    \n(a.x < (b.x + b.width)) && ((a.x + a.width) > b.x);\n\ny-Vertical check formula:\n\
    \n(a.y < (b.y+b.height)) && ((a.y + a.height) > b.y);\n\nMoving exercise to check\
    \ for element overlap:\n\n1.  create move output areas to show the current stats\
    \ of the element and the collision values.  Update the style of the element if\
    \ an overlap occurs.\n\n2.  Create a new element in the center to use within the\
    \ collision check function.\n\n3.  Create a new function that requires two parameters,\
    \ one for each element to check.  Get the boundaries of the element.\n\n4.  Create\
    \ a function col() which can check the boundaries and return a Boolean value if\
    \ the two elements are overlapping.  Use this formula to check for overlap of\
    \ the elements between the various boxes on the screen.\n\n5.  Update element\
    \ styling and output info styling depending on the result of the collision detection.\n\
    \n<!DOCTYPE  html>\n\n<html>\n\n<head>\n\n <title>JavaScript Course</title>\n\n\
    \ <style>\n\n .container {\n\n position: relative;\n\n background-color: #ddd;\n\
    \n width: 90vw;\n\n margin: auto;\n\n       }\n\n .box {\n\n position: absolute;\n\
    \n width: 50px;\n\n height: 50px;\n\n left: 0;\n\n top: 0px;\n\n line-height:\
    \ 50px;\n\n text-align: center;\n\n color: white;\n\n       }\n\n .info {\n\n\
    \ background-color: white;\n\n padding: 5px;\n\n text-align: center;\n\n font-size:\
    \ 1.4em;\n\n color: white;\n\n       }\n\n .output1{\n\n color:black;\n\n font-size:\
    \ 0.9em;\n\n padding:0px;\n\n       }\n\n .blocker{\n\n width:200px;\n\n left:100px;\n\
    \n top:100px;\n\n position:absolute;\n\n height:100px;\n\n background-color:yellow;\n\
    \n text-align:center;\n\n line-height:100px;\n\n font-size:4em;\n\n       }\n\n\
    \ .output2{\n\n color:black;\n\n font-size:2em;\n\n       }\n\n .info  div {\n\
    \n padding: 10px;\n\n       }\n\n .game {\n\n position: relative;\n\n min-height:\
    \ 300px;\n\n       }\n\n </style>\n\n</head>\n\n<body>\n\n <div  class=\"container\"\
    ></div>\n\n <script  src=\"app8.js\"></script>\n\n</body>\n\n</html>\n\nconst\
    \ main = document.querySelector('.container');\n\nconst message = adder(main,\
    \ 'div', '', 'info');\n\nconst output1 = adder(message, 'div', 'Content 1', 'output');\n\
    \nconst output2 = adder(message, 'div', 'Content 2', 'output');\n\nconst output3\
    \ = adder(message, 'div', 'Content 3', 'output1');\n\nconst output4 = adder(message,\
    \ 'div', 'Content 4', 'output1');\n\nconst output5 = adder(message, 'div', 'Content\
    \ 5', 'output1');\n\nconst output6 = adder(message, 'div', 'Content 6', 'output1');\n\
    \nconst output7 = adder(message, 'div', 'Content 7', 'output2');\n\nconst output8\
    \ = adder(message, 'div', 'Content 8', 'output1');\n\nconst gameBoard = adder(main,\
    \ 'div', '', 'game');\n\nconst box3 = adder(gameBoard,'div','AVOID','blocker');\n\
    \nconst box1 = adder(gameBoard, 'div', 'Box 1', 'box');\n\nbox1.style.backgroundColor\
    \ = 'red';\n\noutput1.style.backgroundColor = 'red';\n\nconst box2 = adder(gameBoard,\
    \ 'div', 'Box 2', 'box');\n\nbox2.style.backgroundColor = 'blue';\n\noutput2.style.backgroundColor\
    \ = 'blue';\n\nbox2.style.left = '100px';\n\nconst game = {\n\n move: {},\n\n\
    \ x1: box1.offsetLeft,\n\n y1: box1.offsetTop,\n\n x2: box2.offsetLeft,\n\n y2:\
    \ box2.offsetTop,\n\n speed: 5,\n\n w1: box1.offsetWidth,\n\n h1: box1.offsetHeight,\n\
    \n w2: box2.offsetWidth,\n\n h2: box2.offsetHeight\n\n};\n\nconst keyz = {\n\n\
    \ ArrowLeft: false,\n\n ArrowRight: false,\n\n ArrowUp: false,\n\n ArrowDown:\
    \ false,\n\n KeyA: false,\n\n KeyW: false,\n\n KeyS: false,\n\n KeyZ: false,\n\
    \n};\n\ndocument.addEventListener('keydown', (e) => {\n\n if (e.code in keyz)\
    \ {\n\n       keyz[e.code] = true;\n\n   }\n\n})\n\ndocument.addEventListener('keyup',\
    \ (e) => {\n\n if (e.code in keyz) {\n\n       keyz[e.code] = false;\n\n   }\n\
    \n})\n\nwindow.addEventListener('DOMContentLoaded', mover);\n\nfunction  mover()\
    \ {\n\n const dim = [gameBoard.offsetWidth - box1.offsetWidth, gameBoard.offsetHeight\
    \ - box1.offsetHeight];\n\n //Box 1\n\n if (keyz.ArrowRight && game.x1 < dim[0])\
    \ game.x1 += game.speed;\n\n if (keyz.ArrowLeft && game.x1 > 0) game.x1 -= game.speed;\n\
    \n if (keyz.ArrowDown && game.y1 < dim[1]) game.y1 += game.speed;\n\n if (keyz.ArrowUp\
    \ && game.y1 > 0) game.y1 -= game.speed;\n\n   box1.style.left = `${game.x1}px`;\n\
    \n   box1.style.top = `${game.y1}px`;\n\n //Box 2\n\n if (keyz.KeyS && game.x2\
    \ < dim[0]) game.x2 += game.speed;\n\n if (keyz.KeyA && game.x2 > 0) game.x2 -=\
    \ game.speed;\n\n if (keyz.KeyZ && game.y2 < dim[1]) game.y2 += game.speed;\n\n\
    \ if (keyz.KeyW && game.y2 > 0) game.y2 -= game.speed;\n\n   box2.style.left =\
    \ `${game.x2}px`;\n\n   box2.style.top = `${game.y2}px`;\n\n   output1.innerHTML\
    \ = `Box #1 X:${game.x1} Y:${game.y1} W:${game.w1} H:${game.h1}`;\n\n   output2.innerHTML\
    \ = `Box #2 X:${game.x2} Y:${game.y2} W:${game.w2} H:${game.h2}`;\n\n const o3\
    \ = game.x1 < (game.x2 + game.w2) && (game.x1+ game.w1) > game.x2;\n\n const o4\
    \ = game.y1 < (game.y2 + game.h2) && (game.y1+ game.h1) > game.y2;\n\n   output3.style.color\
    \ = (o3) ? 'green' : 'black';\n\n   output4.style.color = (o3) ? 'green' : 'black';\n\
    \n   output5.style.color = (o4) ? 'green' : 'black';\n\n   output6.style.color\
    \ = (o4) ? 'green' : 'black';\n\n   output3.innerHTML = `H ${o3}: (${game.x1}\
    \ < ${game.x2} + ${game.x2  +  game.w2}) && ((${game.x1} + ${game.w1}) > ${game.x2})`;\n\
    \n   output4.innerHTML = `H ${o3}: (${game.x1} < ${game.x2  +  game.x2  +  game.w2})\
    \ && ((${game.x1+  game.w1}) > ${game.x2})`;\n\n   output5.innerHTML = `V ${o4}:${game.y1}\
    \ < (${game.y2} + ${game.h2}) && (${game.y1} + ${game.h1}) > ${game.y2}`;\n\n\
       output6.innerHTML = `V ${o4}: ${game.y1} < (${game.y2  +  game.h2}) && (${game.y1\
    \  +  game.h1}) > ${game.y2}`;\n\n const val1 = col(box1,box2);\n\n   output7.style.color\
    \ = val1 ? 'red' : 'black';\n\n   output7.innerHTML = `HIT ${val1}`;\n\n const\
    \ val2 = col(box1,box3);\n\n const val3 = col(box2,box3);\n\n   box3.style.backgroundColor\
    \ = val2 ? 'red' : '';\n\n if(!val2){\n\n       box3.style.backgroundColor = val3\
    \ ? 'blue' : '';\n\n   }\n\n   output8.innerHTML = `CenterHIT Box1 ${val2} Box2\
    \ ${val3}`;\n\n   game.move = window.requestAnimationFrame(mover);\n\n}\n\nfunction\
    \  col(el1,el2){\n\n const a = el1.getBoundingClientRect();\n\n const b = el2.getBoundingClientRect();\n\
    \n //console.log(a);\n\n //const tempX = (a.x < (b.x + b.width)) && ((a.x + a.width)\
    \ > b.x);\n\n //const tempY = (a.y < (b.y+b.height)) && ((a.y + a.height) > b.y);\n\
    \n return (a.x < (b.x + b.width)) && ((a.x + a.width) > b.x) && (a.y < (b.y+b.height))\
    \ && ((a.y + a.height) > b.y);\n\n}\n\nfunction  adder(parent, t, html, c) {\n\
    \n const ele = document.createElement(t);\n\n   ele.innerHTML = html;\n\n   ele.classList.add(c);\n\
    \n return parent.appendChild(ele);\n\n}\n\n# DOM Element Catcher Game Set Up"
