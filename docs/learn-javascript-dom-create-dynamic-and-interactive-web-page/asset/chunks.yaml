  trans: "\n\n## 4. 概述 (Overview)\n\n然后代码将能够选择页面元素，用包含欢迎消息更新元素更新，其中包含了用户输入的姓名值。\n\n\
    下面的代码将是后续课程中将涵盖内容的示例，并将为实现上述结果创建步骤。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>JavaScript Course</title>\n</head>\n<body>\n<div class=\"output\">What\
    \ is you name?</</div>\n<input type=\"text\" name=\"userName\">\n  <button>Submit</button>\n\
    \  <script>\n    const btn = document.querySelector('button');\n    const output\
    \ = document.querySelector('.output');\n    const userVal = document.querySelector('input');\n\
    \    btn.onclick = () => output.innerHTML = `Welcome ${userVal.value}`;\n  </script>\n\
    </body>\n</html>\n```\n\n这是一个为网页访问者创建自定义交互式 Web 体验的步骤的简单示例。该代码将为该用户创建一个独特的体验，并根据用户在输入区域提供的内容进行定制。\n\
    \n你越能为 Web 用户定制化 Web 体验，用户就越倾向于享受并留在网页上。创建出色的网页体验正是 JavaScript 的核心所在。在你的网页元素中执行操作并让事情发生，运行在用户的浏览器中。这就是\
    \ JavaScript 可以做到的，创建 Web 用户寻找的这种一对一体验。Web 用户对网站有更多期待，JavaScript 可以帮助你实现它。\n\n\
    你需要一些工具，你可能已经在计算机上拥有它们。当然，需要一个 Web 浏览器来运行代码，所有的 Web 浏览器都能运行 JavaScript，但请注意它们对新版本的代码兼容性可能不相同。像\
    \ `Chrome` 这样的浏览器自带了开发者工具仪表板，这在创建网页时非常有用。`DevTools` 仪表板有助于调试，并能够看到代码后台发生了什么。\n\
    \n![网站上打开的 Web 工具示例。](img/image00437.jpeg)\n网站上打开的 Web 工具示例。\n\n开发者控制台向你显示有关当前加载网页的信息，并包含一个你可以在当前网页内执行\
    \ JavaScript 表达式的控制台。打开你的浏览器，选择开发者工具并尝试一下，我们将在本课程中使用它。在大多数现代浏览器中，你可以直接从浏览器编写并执行\
    \ JavaScript。在 `Chrome` 浏览器中，当你想要处理 `DOM` 或 `CSS` 时，可以打开 `DevTools`，右键点击页面上的元素并选择\
    \ `Inspect`（检查）跳转到 `Elements`面板。或者按下 `Command+Option+C` (Mac) 或 `Control+Shift+C`\
    \ (Windows, Linux, Chrome OS)。当你想查看日志消息或运行 JavaScript 时，按下 `Command+Option+J`\
    \ (Mac) 或 `Control+Shift+J` (Windows, Linux, Chrome OS) 直接跳转到 `Console`面板。\n\n\
    你还需要一个编辑器来编写代码。所谓的 `IDE`（集成开发环境）是用于构建应用程序的软件。`IDE` 可创建代码文件、将其保存到计算机并编辑文件。使用 `IDE`\
    \ 的优点之一是代码更具读性，而且通常有插件、样式选项和多个内置工具帮助编写代码。一旦创建了文件，你可以使用 FTP 将代码文件传输到你的 Web 服务器。如果你还没有编辑器，可以使用\
    \ `Visual Studio code`。第一节课将帮助你在计算机上进行设置并开始编码。\n\n![Web 编辑器打开并在名为 code11.js 的文件中创建\
    \ JavaScript 代码的示例](img/image00438.jpeg)\nWeb 编辑器打开并在名为 `code11.js` 的文件中创建 JavaScript\
    \ 代码的示例\n\n开始学习 JavaScript 很容易：你只需要一个现代 Web 浏览器和一个编写代码的编辑器。开始之前，创建一个名为 `index.html`\
    \ 的文件并在浏览器中打开它。这就是在浏览器中运行计算机上文件所需的所有内容。要向 html 中添加 JavaScript，你可以通过链接到扩展名为 `JS`\
    \ 的脚本文件，或者直接在 HTML 的 `script` 标签之间编写 JavaScript 代码来实现。\n\n在第一节课结束时，你应该已经设置好了编辑器和浏览器，并准备好编码。你可以通过\
    \ Google 找到代码编辑器列表，几乎所有的编辑器都支持前端代码。如有需要，可以在 `https://code.visualstudio.com/` 下载编辑器。\n\
    \n# JavaScript 简介 (Introduction to JavaScript)\n\n探索 JavaScript，了解它是如何工作的以及你如何编写代码\n\
    \nJavaScript 是 Web 上的核心技术，与 `HTML` 和 `CSS`。`HTML` 元素可以作为对象访问，对象具有属性、方法和事件。在学习本书的过程中，我们将更详细地探讨这一点。\n\
    \n`HTML` 是用于结构化和为 Web 内容提供意义的标记语言。`CSS` 是用于包含 `HTML` 内容样式规则的语言。JavaScript 是允许你在网页内创建交互式和动态内容的脚本语言。\n\
    \n你可以用 JavaScript 做很多事情，例如存储值、运行代码块、使用条件应用逻辑以及为你的页面添加事件。使用 JavaScript 可以做很多事情，可能性是无限的。JavaScript\
    \ 直接在浏览器中运行并由浏览器渲染。你可以使用 `DOM` 连接到 HTML 元素，`DOM` 是 JavaScript 用于添加、更新和删除 HTML\
    \ 的编程接口。\n\nJavaScript 代码是单线程的，这意味着线程上一次只能发生一件事。其他请求在操作完成之前会被阻塞，然后这些请求才会运行。JavaScript\
    \ 代码是逐行执行的，这很重要因为你在尝试使用变量之前需要声明它们，还有许多其他方面将在后续页面中探讨。\n\nAPI 是预构建的组件集，允许开发者连接并访问这些对象。把它想象成一个控制面板，JavaScript\
    \ 让你与之交互。浏览器也有 API，JavaScript 代码可以访问，这正是允许代码与可见 Web 内容交互的原因。浏览器 API 允许访问网页元素和其他数据。你可以访问\
    \ API 并进行实用的编程。`DOM`（文档对象模型）API 允许你操作 `HTML` 和 `CSS`。本书将详细介绍 `DOM`，以及你使用 JavaScript\
    \ 选择和操作元素的方法和方式。\n\n![通过浏览器与网页交互。HTML CSS 和 JavaScript](img/image00439.jpeg)\n\
    通过浏览器与网页交互。`HTML` `CSS` 和 JavaScript\n\n服务端(Server-side) 与客户端(Client side)的区别是指代码运行的位置。服务端代码在服务器上运行，而不是在用户的计算机或浏览器中。客户端代码直接运行在用户的计算机中，当涉及到\
    \ JavaScript 时如此。当用户在浏览器中查看网页时，代码被下载、运行并由浏览器显示。\n\n"
- fmt: "\nJavaScript can be used for dynamic web pages content, as it can update the\
    \ display contents of the web page, and generate content. JavaScript works within\
    \ the browser on the client or user's computer. Therefore, we can run the code\
    \ without an internet connection, as everything we need is already on the computer\
    \ in the browser application. A web page that has no updating content and shows\
    \ up the same all the time, is referred to as static. Generally static pages are\
    \ a thing of the past, when the internet was first created HTML was not interactive\
    \ and the page output was for all users.\n\n## Lesson JavaScript Coding Exercise\n\
    \n1. Open your code editor and create a basic `html` file.\n2. Save the `html`\
    \ file and open it within a browser.\n\n```html\n<!doctype html>\n<html>\n<head>\n\
    \ <title>JavaScript</title>\n</head>\n<body>\n  Hello World\n</body>\n</html>\n\
    ```\n\nSetup of your web development environment, getting started writing code.\
    \ Use of editor `visual studio code`. Use of `Chrome` browser and `Chrome DevTools`\
    \ to see console messages.\n\n# Getting started with coding\n\nExplore how to\
    \ start coding JavaScript and adding JavaScript to your HTML File to run the code\
    \ in your browser.\n\nIn this lesson we explore how to Add JavaScript to HTML\
    \ files. JavaScript `JS` files won’t run by themselves in the browser, they output\
    \ as text files showing the JavaScript code. To run JavaScript, it needs to be\
    \ within an HTML file, either within the HTML code or in the HTML code and linking\
    \ to a `JS` file with JavaScript code. There are several ways to incorporate JavaScript\
    \ into your web page. Below we explore the 3 ways, which include as an attribute\
    \ within the element, between the script tags in HTML, and as a linked `JS` file\
    \ from HTML code.\n\nYou can add JavaScript as an attribute inline to an HTML\
    \ element although this format is not suggested. They are hard to identify and\
    \ not good practice.\n\n```html\n<div onclick=\"alert('hello')\">Hello World 1</div>\n\
    ```\n\nInternal JavaScript within the HTML `script` tags. Should be added just\
    \ before closing the `body` tags if you are going to be interacting with the page\
    \ elements. The code loads into the browser from the top down, and if the HTML\
    \ hasn’t fully loaded and you try to access the element using JavaScript you will\
    \ encounter an error.\n\n```html\n<script>\n  document.write('<div>Hello World\
    \ 2</div>');\n</script>\n```\n\nBest practice is with an external file, using\
    \ the `js` extension creating a separate fiel from the HTML file. Place the `script`\
    \ tags and use the `src` attribute link to the path of where your file is located.\
    \ It can either be relative to where the `html` file is or absolute using a file\
    \ address including the full path to load it. If you use absolute, then you should\
    \ be able to paste the path into your web browser and see the file.\n\n```html\n\
    <script src=\"app.js\"></script>\n<script src=\"http://www.example.com/app.js\"\
    ></script>\n```\n\nExample code to output text into a web page, using the `document.write()`\
    \ method. You can use the `document` object, which is the object created by the\
    \ browser that represents the web page elements. The `document` object has several\
    \ methods that can be used to apply coding logic. Using the `document.write()`\
    \ will write whatever string value is within the rounded brackets, directly within\
    \ the webpage when the code is encountered. We are going to cover the `document`\
    \ object in much more detail in the upcoming lessons. This is just one of the\
    \ many capabilities of the `document` object, and how it can be used to interact\
    \ with the HTML page elements directly within the browser by JavaScript code.\n\
    \n```javascript\ndocument.write('<div>Hello World 3</div>');\ndocument.write('<div>Hello\
    \ World 4</div>');\ndocument.write('<div>Hello World 5</div>');\n```\n\n## Lesson\
    \ JavaScript Coding Exercise\n\n1. Create an `HTML` file and a `JS` file.\n2.\
    \ Use the `script` tags to link to the `JS` file as the source file.\n3. Using\
    \ the `document.write()` add text to the webpage.\n4. Using the `document.write()`\
    \ add html formatted content to your webpage.\n\n# JavaScript coding tips\n\n\
    Learn about how to start with JavaScript and create your first JavaScript code.\n\
    \nThis lesson will cover how to use comments for documenting statements and code.\
    \ Comment, when possible, to provide context to the coding syntax, you can use\
    \ either single or multiple line comments in JavaScript. Best practice to make\
    \ the code more human readable is to use indents and make use of the whitespace\
    \ to make the code readable. Whitespace is ignored by the browser and can be used\
    \ to structure the code to make it easier to view. Creating code in a separate\
    \ `JS` file and linking to it from the HTML file is the best way to connect your\
    \ HTML file to your JavaScript code. You can use the `console` for debugging and\
    \ to see values.\n\nTo ensure your code works as expected, there is syntax that\
    \ you can utilize to output values and information into the browser. Use of `console.log()`\
    \ to output debugging data to the browser.\n\nWhitespace is ignored in the code,\
    \ use whitespace and indentation to make the code more human readable. Be careful\
    \ not to add spacing between the syntax statements, as this can cause errors when\
    \ the code is being rendered. Blocks of code can be indicated using the curly\
    \ brackets, this will be used within the various code syntax in the upcoming lessons.\
    \ The curly brackets around the code, represents a block of code meant to run\
    \ together. The indentation of the block of code allows editors to read the code\
    \ easier.\n\n```javascript\n{\n  document.write('<br>Output Message');\n  document.write('<br>Output\
    \ Message');\n}\n```\n\nUse commenting of single line or multiple line to provide\
    \ more context of the code. You can debug your application by commenting statements\
    \ out with the `//`. Comments are ignored by the browser and will not output into\
    \ the page.\n\n```javascript\n/*\nThis is my code!\nLaurence Svekis\n*/\n//alert('Hello');\n\
    ```\n\nUse of `console` methods allows you to debug and communicate from the JavaScript\
    \ code into the browser console. This can be used to provide additional information\
    \ from the JavaScript code as it runs. Console messages are only output into the\
    \ console of the browser and not visible by web users.\n\n![Example of console\
    \ method outputs and how they will look within a Chrome browser console.](Images/image00440.jpeg)\n\
    \nExample of console method outputs and how they will look within a Chrome browser\
    \ console.\n\n```javascript\nconsole.log('Hello');\nconsole.error('Hello');\n\
    console.info('Hello');\nconsole.warn('Hello');\n//console.clear();\nconsole.log('New\
    \ line');\n```\n\n`Window` object is the parent of the `document` object. The\
    \ `window` object is the top parent and contains various methods that can be used.\
    \ The `alert()` and the `prompt()` are both part of the `windows` object. You\
    \ can use these to create an interaction with the user. Both will show a standard\
    \ popup message in the browser, which must be actioned before the user can interact\
    \ with the rest of the browser window. Although they provide a simple way to interact\
    \ with the user, these are not commonly used, since the user experience is poor\
    \ and there are more interactive options now in JavaScript and the DOM. Alerts\
    \ and prompts are meant for interaction with the web user. Start by creating an\
    \ `index.html` and `app.js` file. Then write some JavaScript code and try it out.\
    \ Open and run the HTML file in your browser. You can use the functions from the\
    \ lesson such as `alert()` or `document.write('Hello');`; Alert stops the code\
    \ execution, if on top it does not output the content until the button is clicked.\
    \ Place JavaScript at the bottom so the rest of the code can render.\n\n```javascript\n\
    window.alert('Hello World');\n```\n"
