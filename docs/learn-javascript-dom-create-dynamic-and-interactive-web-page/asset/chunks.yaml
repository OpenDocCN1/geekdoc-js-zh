  trans: "\n\n2. 添加一个按钮，用于更新样式的背景颜色。\n3. 创建一个空数组，用作稍后更新页面元素的元素的数组。\n4. 创建一个函数，可以为背景颜色返回随机的十六进制值。\n\
    5. 创建 10 个 `divs`，设置元素的样式属性，并包含一个随机背景颜色。\n6. 添加一个点击事件，将主体（body）的背景颜色设置为与点击元素的背景颜色一致。\n\
    7. 为所有 `divs` 添加 `mouseover`、`mouseleave`、`mouseout`、`mousedown`、`mouseup` 和 `mouseenter`\
    \ 事件。创建一个函数，将事件触发和自定义消息输出到输出元素以及控制台中。\n8. 创建 10 个 `input` 元素，为这些元素添加 `onfocus`、`focusout`、`onchange`\
    \ 事件监听器。在不同事件上更新样式属性。\n9. 添加一个键盘事件来跟踪文档。跟踪按下的键位。\n10. 为 `input` 元素添加键盘事件 `onkeydown`，如果按了\
    \ `enter` 键，则将输入框的值作为列表项添加到无序列表中。\n11. 创建辅助函数来更改主体的背景、随机颜色生成器，以及一个可以将值输出到控制台和页面输出元素的日志函数。\n\
    \n```javascript\nconst div = document.querySelector('div');\n\ndiv.innerHTML =\
    \ '';\n\nconsole.log(div);\n\nconst output = document.createElement('div');\n\n\
    div.append(output);\n\nconst ul = document.createElement('ul');\ndiv.append(ul);\n\
    \nconst btn = document.createElement('button');\n\nbtn.textContent = 'Reset Colors';\n\
    \nbtn.style.display = 'block';\ndiv.append(btn);\n\nconst holder = [];\n\nbtn.onclick\
    \ = (e) => {\n  holder.forEach(ele => {\n    ele.style.backgroundColor = ranColor();\n\
    \  })\n}\n\nfor (let i = 0; i < 10; i++) {\n  const ele = document.createElement('div');\n\
    \  holder.push(ele);\n  ele.style.width = '50px';\n  ele.style.height = '50px';\n\
    \  ele.style.border = '1px solid #ddd';\n  ele.style.display = 'inline-block';\n\
    \  ele.style.backgroundColor = ranColor();\n  ele.style.lineHeight = '50px';\n\
    \  ele.style.textAlign = 'center';\n  ele.textContent = `${i+1}`;\n  ele.addEventListener('click',\
    \ () => {\n    document.body.style.backgroundColor = ele.style.backgroundColor;\n\
    \  });\n  ele.onmouseover = (e) => {\n  }\n  ele.addEventListener('mouseover',\
    \ () => {\n    logger(`mouseOver ${i+1}`);\n  })\n  ele.addEventListener('mouseleave',\
    \ () => {\n    logger(`mouseLeave ${i+1}`);\n  })\n  ele.addEventListener('mouseout',\
    \ () => {\n    logger(`mouseOut ${i+1}`);\n  })\n  ele.addEventListener('mousedown',\
    \ () => {\n    logger(`mouseDown ${i+1}`);\n  })\n  ele.addEventListener('mouseup',\
    \ () => {\n    logger(`mouseUp ${i+1}`);\n  })\n  ele.addEventListener('mouseenter',\
    \ () => {\n    logger(`mouseEnter ${i+1}`);\n  })\n  div.append(ele);\n}\n\nfor\
    \ (let i = 0; i < 10; i++) {\n  const ele = document.createElement('input');\n\
    \  ele.style.display = 'block';\n  ele.setAttribute('type', 'text');\n  ele.value\
    \ = `${i+1} Input value`;\n  div.append(ele);\n  ele.onfocus = () => {\n    ele.style.color\
    \ = 'red';\n  }\n  ele.addEventListener('focusout', () => {\n    ele.style.color\
    \ = 'black';\n  });\n  ele.onchange = () => {\n    ele.style.backgroundColor =\
    \ 'blue';\n  }\n  ele.onkeydown = (e) => {\n    if (e.key === 'Enter') {\n   \
    \   adder(ele.value);\n      console.log(ele.value);\n    }\n  }\n}\n\ndocument.addEventListener('keydown',\
    \ tracker);\ndocument.addEventListener('keyup', tracker);\n\nfunction adder(val)\
    \ {\n  console.log(val);\n  const li = document.createElement('li');\n  li.textContent\
    \ = val;\n  ul.append(li);\n}\n\nfunction tracker(e) {\n  console.log(e.key);\n\
    }\n\nfunction logger(val) {\n  console.log(val);\n  output.innerHTML = val;\n\
    }\n\nfunction updateColor() {\n  document.body.style.backgroundColor = ranColor();\n\
    }\n\nfunction ranColor() {\n  return `#${Math.random().toString(16).slice(2,8)}`;\n\
    }\n```\n\n# 页面元素动画\n\nJavaScript `requestAnimationFrame()` 方法为页面元素提供了平滑的动画。`requestAnimationFrame()`\
    \ 告诉浏览器正在执行动画，并请求浏览器在下一次重绘之前调用特定的函数来更新页面。作为参数的 `callback` 是在下一次重绘之前应该调用的函数。在这个示例中，代码被用于在页面上创建一个平滑移动的小球元素。它在页面上的位置样式值通过\
    \ `top` 和 `left` 值进行更新。`requestAnimationFrame()` 方法可以用于在 元素内部创建平滑动画。浏览器随后调用指定的函数，在下一次重绘之前更新动画。该方法接收一个回调函数\
    \ 45.jpeg\n\n### 练习\n\n1. 选择一个元素作为容器。\n2. 创建一个 `div` 来显示小球。\n3. 更新元素的样式，使其变为 `absolute`（绝对定位）。\n\
    4. 创建一个对象来存储 `x`、`y`、`direction` 和 `speed`。\n5. 使用 `requestAnimationFrame()` 在下一次重绘之前运行函数。\n\
    6. 给 `pos` 赋值 `left` 和 `top` 属性值。\n7. 在 `animation` 函数中，检查 `pos` 是否超出边界。\n8. 在\
    \ `animation` 函数中更新 `pos` 位置。\n9. 如果按了 `enter` 键，则启动或停止动画。\n10. 添加一个点击事件来重置小球的颜色。\n\
    11. 创建一个 `score` 元素显示分数。\n\n```javascript\nconst div = document.querySelector('div');\n\
    const score = document.createElement('div');\nscore.style.textAlign = 'center';\n\
    document.body.prepend(score);\nconst ball = document.createElement('div');\nball.style.border\
    \ = '3px solid white';\nball.style.width = '50px';\nball.style.height = '50px';\n\
    ball.style.backgroundColor = 'red';\nball.style.borderRadius = '50%';\nball.style.position\
    \ = 'relative';\ndiv.append(ball);\nlet pos = {\n  x: 100,\n  y: 100,\n  dx: 1,\n\
    \  dy: 1,\n  speed: 5,\n  move: true,\n  score: 0\n};\nfunction adderScore(){\n\
    \  score.innerHTML = `<div>Score :${pos.score}</div>`;\n}\nfunction gameHit(){\n\
    \  pos.score++;\n  ball.style.backgroundColor = `#${Math.random().toString(16).slice(2,8)}`;\n\
    \  adderScore();\n  pos.x = Math.floor(Math.random()*450);\n  pos.y = Math.floor(Math.random()*350);\n\
    \  ball.style.left = `${pos.x}px`;\n  ball.style.top = `${pos.y}px`;\n}\nlet mover;\n\
    function ani(){\n  pos.move = true;\n  if(pos.move){\n    if(pos.x > 450 || pos.x\
    \ < 0){\n      pos.dx *= -1;\n    }\n    if(pos.y > 350 || pos.y < 0){\n     \
    \ pos.dy *= -1;\n    }\n    pos.x += pos.speed * pos.dx;\n    pos.y += pos.speed\
    \ * pos.dy;\n    ball.style.left = `${pos.x}px`;\n    ball.style.top = `${pos.y}px`;\n\
    \  }\n  mover = requestAnimationFrame(ani);\n}\nball.onclick = gameHit;\ndocument.addEventListener('keydown',e)\
    \ => {\n  if(e.key === 'Enter') {\n    if(pos.move){\n      pos.move = false;\n\
    \      cancelAnimationFrame(mover);\n    }else{\n      pos.move = true;\n    \
    \  mover = requestAnimationFrame(ani);\n    }\n  }\n});\n```\n\n"
- fmt: "\n# JavaScript DOM coding Exercises and Challenges\n\nLearn JavaScript DOM\
    \ Coding Projects Interactive and Dynamic Web Pages. Modern coding exercises to\
    \ develop your JavaScript coding skills from the most asked for questions about\
    \ JavaScript.\n\nFollowing coding exercises are designed to help develop your\
    \ JavaScript skills on applying JavaScript to create interactive and dynamic content\
    \ on web pages.\n\n## Web page dynamic welcome message\n\nThe web page exercise\
    \ is a simple example of how you can get input from a user, and then apply that\
    \ input value within JavaScript to create a dynamic web response. Input field\
    \ provides a way for the user to interact with the web page. To get the input\
    \ value, select the page element, then from within that element property values\
    \ there is a property name value which is holding the input field value. Return\
    \ the value in a variable then use that value within a string response which then\
    \ gets output into the web page as a customized message to the web user.\n\nCode\
    \ example of selecting a page element, `document.querySelector()`, updating style\
    \ property of an element assigning a new value to the property `userVal.style.borderColor`,\
    \ adding an event listener to an element `btn.onclick`.\n\n![](Images/image00458.jpeg)\n\
    ![](Images/image00459.jpeg)\n\nAsk the web user for their name and provide the\
    \ input value back to the user along with a welcome message.\n\nCreate a page\
    \ welcome message:\n\n1. Get the username in the input field\n2. When the button\
    \ is pressed add an event that get the username and creates a welcome message\
    \ on the page\n3. Add a check to ensure the length of the input is larger than\
    \ 3 characters long\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript\
    \ Course</title>\n</head>\n<body>\n<div class=\"output\">What is you name?</div>\n\
    <input type=\"text\"  name=\"userName\">\n<button>Submit</button>\n<script src=\"\
    app.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst output = document.querySelector('.output');\n\
    const userVal = document.querySelector('input[name=\"userName\"]');\nconst btn\
    \ = document.querySelector('button');\n\nuserVal.style.borderColor = '#333';\n\
    btn.onclick = ()=>{\n if(userVal.value.length > 3){\n const message = `Welcome\
    \ to the site ${userVal.value}`;\n      output.textContent =  message;\n     \
    \ userVal.style.display = 'none';\n      btn.style.display = 'none';\n  }\n else{\n\
    \      output.textContent = 'Name length must be 3+ characters';\n      userVal.style.borderColor\
    \ = 'red';\n  }\n}\n```\n\n## Function Expression vs Declaration vs Arrow\n\n\
    One of the most asked questions is about functions, and which ones to use. There\
    \ are different ways to create function and this exercise is designed to highlight\
    \ how to use them. Along with the arrow format for functions and use of the `this`\
    \ keyword to reference the current object within the function scope.\n\n![Graphical\
    \ user interface, application Description automatically generated](Images/image00460.jpeg)\n\
    \nWhen objects are created, they hold values independently as they are separate\
    \ instances even if the same function is used to create them. As separate instances\
    \ this example will demonstrate how the function code can create independent objects,\
    \ as the block of code within the function applies the value created in the function\
    \ to the parent object. These values are then tied to the parent object and in\
    \ this case to the element that invoked the click event.\n\nObjective of this\
    \ exercise is to create functions, which can be done with as function expressions,\
    \ function declarations, and using the arrow format for the anonymous functions.\
    \ There are examples of using the different syntax. Also, how the keyword `this`\
    \ applies to the parent object element and can track the values of the clicks\
    \ separately.\n\nExercise covers using functions and how they work. Selecting\
    \ elements using `querySelector()` and adding click events with `onclick`.\n\n\
    Create 3-page counters using different functions, expression, declaration, and\
    \ arrow format. Counters will all work independently as the value of the total\
    \ is contained within the instance of the function object using `this`.\n\nPage\
    \ counters with functions:\n\n1. Select all the page buttons\n2. Create a function\
    \ expression that will increment the counter on button press\n3. Create a function\
    \ expression with the arrow format that will track and increment the count on\
    \ the page\n4. Create a function declaration that will track and increment the\
    \ count on the page.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript\
    \ Course</title>\n</head>\n<body>\n<div  class=\"output\"></div>\n<button  class=\"\
    btn1\">Adder 1</button>\n<button  class=\"btn2\">Adder 2</button>\n<button  class=\"\
    btn3\">Adder 3</button>\n<script  src=\"app1.js\"></script>\n</body>\n</html>\n\
    ```\n\n```javascript\nconst btn1 = document.querySelector('.btn1');\nconst btn2\
    \ = document.querySelector('.btn2');\nconst btn3 = document.querySelector('.btn3');\n\
    const output = document.querySelector('.output');\n\n//Function Expression\nconst\
    \  adder2 = function(){\n if(!this.total) {\n this.total = 1;\n  }else{\n this.total++;\n\
    \  }\n  output.textContent = `Total #2 : (${this.total})`;\n}\n\nconst adder3\
    \ = ()=>{\n if(!this.total) {\n this.total = 1;\n  }else{\n this.total++;\n  }\n\
    \  output.textContent = `Total #3 : (${this.total})`;\n}\n\nbtn1.onclick = adder1;\n\
    btn2.onclick = adder2;\nbtn3.onclick = adder3;\n\n///Function Declaration\nfunctionadder1(){\n\
    \ if(!this.total) {\n this.total = 1;\n  }else{\n this.total++;\n  }\n  output.textContent\
    \ = `Total #1 : (${this.total})`;\n}\n```\n\n## Dynamic DOM counters Element Objects\n\
    \nElements are objects and can hold values like any other object. Expanding on\
    \ how each element can track values while sharing the same function for the click\
    \ event. This exercise will demonstrate how to get values from elements, and apply\
    \ them to other elements.\n\n![](Images/image00461.jpeg)\n\nThis exercise will\
    \ demonstrate how to create page elements and how to use a global value to be\
    \ able to update the page contents. Use of `document.createElement()` to dynamically\
    \ create page elements and how to append them to the web page with `appendChild()`.\n\
    \n![](Images/image00462.jpeg)\n\nDynamically create page buttons that can be used\
    \ to count separately. Create a button to output all the result totals. Only using\
    \ JavaScript NO HTML elements. Store values of the page elements, get the values\
    \ and output the results to the web page.\n\nDynamic Page counters with JavaScript:\n\
    \n1. Create a global object to set the number of buttons to be created\n2. Create\
    \ a main page element that will contain all the new elements\n3. Create a function\
    \ to create page elements, adding the element type to a parent object. Include\
    \ a parameter in the function for the inner content of the element.\n4. Loop through\
    \ and create all the buttons, set a default total of 0 for each one. On click\
    \ create a function that will update and output the current value of this element\
    \ total. You can add styling to the buttons\n5. Add a class of `btn` to each new\
    \ button so that they can be distinguished from the main total tally button. Create\
    \ a button that will output all the button total results.\n6. When the tally button\
    \ is clicked create a function that will select all the elements with a class\
    \ of `btn` and loop through them.\n7. For each element with the class of `btn`\
    \ create a new list item element, output that into an unordered list on the main\
    \ page. The list item contents should show the element total and the element `textContent`.\
    \ You can also select the style to match the button style property values.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript Course</title>\n\
    </head>\n<body>\n<script src=\"app2.js\"></script>\n</body>\n</html>\n```\n\n\
    ```javascript\nconst val = {\n num : 2\n};\n\nconst main =  elemaker('div',document.body,'');\n\
    const output =  elemaker('div',main,'');\n\nfor(let i=0;i<val.num;i++){\n```\n"
