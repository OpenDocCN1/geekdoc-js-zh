  trans: "\n\nWindow prompt（窗口提示）与 alert（警告）略有不同，因为 prompt 有一个回调函数，这意味着输入值会被返回到 JavaScript\
    \ 代码中并作为值在代码中使用。这两者都可以在代码中使用不包含 `window` 对象的情况下编写。代码会自动默认指向顶层对象，如果代码中没有指定，它将查找顶层对象，默认情况下就是\
    \ `window` 对象。\n\n```javascript\nprompt('How are you?');\n```\n\n![带有问题和响应回调的\
    \ window prompt()示例](img/image00442.jpeg)\n\n带有问题和响应回调的 window `prompt()` 示例\n\
    \n```javascript\nalert('Hello');\n\nconst res = prompt('What is your name?');\n\
    \nalert(res);\n```\n\n### JavaScript 课程练习：\n\n1. 在你的 JavaScript 文件中注释掉一行代码。\n\
    2. 使用多行注释注释掉一个代码块。\n3. 尝试使用不同的消息测试各种 `console` 输出方法。\n4. 创建一个以你的名字为消息 `alert`。\n\
    5. 创建一个返回网页用户名的 `prompt`。设置一个变量来捕获 `prompt` 的响应值，并使用 `document.write()` 方法将值输出到文档。\n\
    \n# 在 JavaScript 中使用变量\n\n● 变量是编程的基础概念之一\n● 使用 `const` 或 `let` 避免使用 `var`\n● `const`\
    \ 和 `let` 是基于作用域的\n● 父级作用域 vs 局部作用域\n● 给变量赋值并重新赋值更新后的新值\n● 使用字符串和数字作为变量的值\n● JavaScript\
    \ 改变数据类型时的动态类型\n● `Math` 以及 JavaScript 的直接输出\n\n变量允许开发者存储值，这些值可以在代码中根据需要进行更新。通常，变量在代码开头声明，并在整个代码中使用它们存储应用程序的值。当你声明变量时可以使用“let”改变值。如果你希望值在整个代码中保持不变，请使用“const”。这可以避免代码中错误重新赋值导致的错误和问题。\n\
    \n双引号、单引号或反引号可包含字符串内容。如果语句单独写一行，则不需要分号（`;`）。但如果希望在一行中编写多个语句，则必须用分号分隔。然而，最佳实践是即使在严格不需要的情况下也始终在语句后写分号。JavaScript\
    \ 代码忽略空白符；你可以利用它来编写更易读、更易理解的代码。\n\n## 创建变量\n\n- `var` - 声明变量，可选地初始化为一个值。\n- `let`\
    \ - 声明一个块作用域的局部变量，可选地初始化为一个值。代码块由 `{}` 表示。\n- `const` - 声明一个块作用域的、只读的常量。不可更改。\n\
    \n在使用变量之前必须声明它们。用逗号分隔来声明多个变量。如下所示，驼峰命名（CamelCase）更具读性。\n\n```javascript\nlet a,b,c,d;\n\
    \nlet userfirstname = “Laurence”;\n\nlet userFirstName = “Laurence”;\n```\n\n\
    ### JavaScript 课程练习：\n\n1. 使用 `let` 和 `const` 声明数字和字符串变量。\n2. 使用使用单引号、双引号和反引号创建字符串的不同格式。\n\
    3. 将结果输出到 `console` 和文档中。\n4. 给变量分配新值并输出结果。\n5. 尝试使用 JavaScript 包裹在 `${}` 中的模板字量字符串，并检查控制台和网页中的输出。\n\
    \n```javascript\nlet a = 'Laurence Svekis';\n\nlet b = 10;\n\nlet e = 5;\n\nlet\
    \ f = 20;\n\nlet myStr1 = 'Hello\\'s \"world\"';\n\nlet myStr2 = \"\\\"Hello\\\
    \" 'world'\";\n\nlet myStr3 = `Hello'      s    \n\n\"world\"`;\n\nlet tempLit\
    \ = `Math ${b  +  e  +  f} Hello`;\n\nconst myName = 'Laurence Svekis';\n//myName\
    \ = 'Svekis';\n\n{\n const b = 1000;\n  console.log(b);\n //var c = 100;\n //let\
    \ d = 100;\n}\n\n//console.log(c);\nconsole.log(b);\n\nconsole.log(myName);\n\n\
    a = 'Hello World';\n\nlet val = b + e + f;\n\nval = myStr1 + ' ' + myStr2 + '\
    \ ' + myStr3;\n\nval = tempLit;\n\nval = `${myStr1} ${myStr2} ${myStr3}`;\n\n\
    console.clear();\n\nconsole.log(val);\n\ndocument.write(val);\n```\n\n# JavaScript\
    \ 动态类型转换\n\n● JavaScript 数据类型\n● 数据类型 `string`, `number`, `boolean` - `typeof`\
    \ 类型转换\n● 数据类型 `Booleans`, `Null`, `Undefined`\n● `number.toString()` `Number(string)`\n\
    ● `typeof` 运算符\n● 数据类型包括数字、字符串、布尔、对象\n\nJavaScript 动态类型转换及其工作原理。JavaScript 变量可以转换为不同的数据类型，它们并不是设置为声明时的数据类型。JavaScript\
    \ 使用不同的数据类型，JavaScript 会动态地分配它认为所需的类型，如果有需要你也可以更改变量的数据类型。\n\n### JavaScript 课程练习：\n\
    \n1. 声明多个变量但不给它们赋值。\n2. 获取变量的数据类型并将其输出到页面。\n3. 将数字和字符串相加。\n4. 将字符串转换为数字。\n5. 将字符串转换为数字。\n\
    6. 创建布尔值。\n\n```javascript\nlet myStr = 'Laurence';\n\nlet myNum = 0;\n\nlet a;\n\
    \nlet b,c,d;\n\nlet val;\n\nmyStr = 5;\n\nmyNum = 'test';\n\nb = 5;\n\nc = 10;\n\
    \nd = '20';\n\nd = null;\n\nd = true;\n\nd = false;\n\nd = c.toString();\n\na\
    \ = '100X';\n\nd = parseInt(a);\n\nval = b + c;\n\nval = d;\n\nval = typeof(d);\n\
    ```\n\n# JavaScript 变量\n\n变量命名规则提供了可以使用名称以及如何在代码中声明 JavaScript。\n\n● 变量标识符必须使用唯一名称\n\
    ● 变量标识符应具有意义\n● 标识符可以包含字母、数字、下划线和美元符号\n● 变量名必须以字母、下划线或美元符号开头\n● 名称大小敏感\n● 名称不能与\
    \ JavaScript 单词重复\n● 变量名中不能有空格\n\n命名规则必须以字母、下划线 (_) 或美元符号 ($) 开始。后续可以是字母或数字。大写或小写。变量名长度没有限制。\n\
    \n### JavaScript 课程练习：\n\n1. 创建一些字符串值。\n2. 为变量名赋予有意义的名字。\n3. 使用驼峰命名变量名。\n\n```javascript\n\
    let _test5 = 'Laurence';\n\nlet $test_ = 'Svekis';\n\nlet test$ = 'hello';\n\n\
    let TESTtest = 'hello';\n\nlet myFirstName = 'Laurence';\n//let let = 'Not a good\
    \ idea';\n\nlet myLastName = $test_;\n\nlet output = myFirstName;\n\nlet fullName\
    \ = `${myFirstName} ${myLastName}`;\n\noutput = fullName;\n\nconsole.log(output);\n\
    \ndocument.write(output);\n```\n\n"
- fmt: "\nArrays are objects that have a preset order of items, using the index of\
    \ the item to select and identify the item within the array list. Arrays also\
    \ have built in methods which make them a powerful way to use the data and manipulate\
    \ and select items contained in the array. Objects also can contain multiple items\
    \ in the same variable, they are identified by a property name which is used to\
    \ select the item from the object. Each property name can only be used once and\
    \ is unique within the object. Property names can be set with quotes or as single\
    \ words within the objects. They get assigned values as a pair with the property\
    \ name, using the colon to assign the value and comma separate multiple named\
    \ pair values.\n\n### Lesson JavaScript Coding Exercise\n\n1. Create an array\
    \ with various data types.\n2. Create an object with various data types.\n3. Retrieve\
    \ a value from both the array and object and output it into the console.\n4. Try\
    \ using both dot notation and bracket notation to retrieve values within an object.\n\
    5. Update the values of the array and object using the index value for the array\
    \ and property name for the object.\n6. Declare a new variable and assign the\
    \ existing array to the new variable. Make updates to the contents of the new\
    \ variable and see how it also updates the first array.\n\n```javascript\nconst\
    \ arr1 = ['one',100,false,null,[1,2,3]];\n\nconst obj1 = {\n  first:'Laurence',\n\
    \  'full Name':'Laurence Svekis',\n  id : 100,\n  status : true,\n  arr : [1,2,3,'Hello\
    \ World']\n};\n\nconst arr2 = arr1;\n\nconst obj2 = obj1;\n\nobj2.id = 5000;\n\
    arr2[0] = 'Hello World';\narr1[3] = `Laurence Svekis`;\nobj1.first = `Linda Jones`;\n\
    \nlet val = arr1[4][0];\nval = obj1['full Name'];\nval = obj1.first;\nval = obj2.arr[3];\n\
    console.log(val);\ndocument.write(val);\n```\n\n# JavaScript Functions\n\nExplore\
    \ how functions can be used in code to run blocks of code. Try to avoid repeating\
    \ code, and functions provide an excellent way to run blocks of code.\n\n- functions\
    \ can be used to run blocks of code\n- two types of functions Function Expression\
    \ and Function declaration\n- Functions can take\n- Function naming are the same\
    \ rules as variables\n- You can pass in values into the function within the parentheses,\
    \ parameter names can be separated by commas to add multiple values\n- When the\
    \ function is invoked, the parameters are known as function arguments which are\
    \ the values received by the function in the parameters\n- Functions can return\
    \ values; the return statement will end the function execution and return the\
    \ value.\n- Functions have scope within the curly brackets. Local values within\
    \ the function scope can only be accessed within the function\n- Benefit of functions\
    \ is that you can write the code once and reuse it as many times as needed. You\
    \ can get different results with different argument values and return values.\n\
    \nFunctions allow developers to run a block of code, when the function is run\
    \ it's defined invoking the function when it's executing the code. Functions provide\
    \ a powerful way within code to run blocks of code, also they contain their own\
    \ scope so variables set within the function can live only within that function.\
    \ Create functions in code to do repeat code tasks and handle specific coding\
    \ objectives. You can pass values into a function then use those values within\
    \ the function code and return a result back from the function code. Functions\
    \ can use arguments within the parameters, although they are not mandatory. Function\
    \ also can use return although not mandatory to return a response from the function.\
    \ You can pass values into function to be used within the code.\n\nThere are two\
    \ types of functions, function declaration which uses the keyword `function` to\
    \ assign the function code, or a function expression which is like assigning a\
    \ variable a value, but in this case it's the function code.\n\n```javascript\n\
    // Function declaration\nfunction test(num) {\n  return num;\n}\n\n// Function\
    \ expression\nvar test = function (num) {\n  return num;\n};\n```\n\n### Lesson\
    \ JavaScript Coding Exercise\n\n1. Create a global value that will be incremented\
    \ every time the function is executed. Add this increment of the value to each\
    \ function. `counter++`.\n2. Create a function expression that within its code\
    \ can output a value into the console.\n3. Invoke the function. Update the function\
    \ with a parameter, where the function uses that argument value and outputs that\
    \ value into the console.\n4. Create a function declaration. Add 3 parameters,\
    \ that will take the value and add them all together. Use `return` to return the\
    \ resulting total of the values that were passed into the function.\n5. Assign\
    \ the returned value of the function to a variable that is output into the web\
    \ page.\n\n```javascript\nconst fun1 = function (val) {\n  counter=counter+val;\n\
    \  const output = `<div>Hello ${counter}</div>`;\n  document.write(output);\n\
    }\n\nlet counter = 0;\nlet word = '';\n\nfun1(21);\nfun1(2);\nfun1(3);\nfun2('h');\n\
    fun2('e');\nfun2('l');\nfun2('l');\nfun2('o');\n//fun1 = 100;\n\nconsole.log(fun1);\n\
    const fun5 = fun1;\nfun5(1000);\n\nfunction fun2(val){\n  word = word + val;\n\
    \  counter++;\n  let output = `<div>Hello ${counter}</div>`;\n  document.write(output);\n\
    }\n\nlet valTotal = 0;\nvalTotal += fun3(10,44,55);\nvalTotal += fun3(5);\n\n\
    function fun3(num1,num2,num3){\n  let total = num1 + num2 + num3;\n  console.log(total);\n\
    \  return total;\n}\n\nconst temp = 5000;\nfun4(100);\n\nfunction fun4(val){\n\
    \  const temp = 9;\n  const myVal = val + temp;\n  console.clear();\n  console.log(myVal);\n\
    }\n```\n\n# DOM for Interactive web pages\n\nJavaScript can create interactive\
    \ content with the use of event listeners. Event listeners wait for the user to\
    \ perform an action, which then triggers an event to occur. The DOM can represent\
    \ the page elements. Document Object Model (DOM) is an object that contains a\
    \ data representation of the page. The DOM is structured in a tree like format,\
    \ as objects that comprise the web page and content of the HTML document. Document\
    \ Object Model (DOM) is a programming interface for HTML documents, that is the\
    \ logical structure of a page and how the page content can be accessed and manipulated.\
    \ Bring your web pages to life with JavaScript. DOM and JavaScript let you create\
    \ Dynamic web page content that can change without page refresh and present new\
    \ elements and updated content to the user.\n\n### Lesson JavaScript Coding Exercise\n\
    \n1. Create your HTML file add some page elements\n2. Assign to a variable the\
    \ `document.body.children` array which will represent all the child elements within\
    \ the body.\n3. To select the first, one use the index value of `0`, as just like\
    \ arrays these are zero based. Output the object to the console with `console.dir()`.\n\
    4. Select some properties from the element, output them into the console.\n5.\
    \ Update the `textContent` of the element to a value of your name.\n6. Go to your\
    \ favorite website and open the devTools, type `document.body.textContent = \"\
    Laurence Svekis\"`.\n\n```html\n<!doctype html>\n<html>\n<head>\n <title>JavaScript</title>\n\
    </head>\n<body>\n<div id=\"one\" class=\"red\">Hello World 1</div>\n<div>Hello\
    \ World 2</div>\n<script src=\"dom1.js\"></script>\n</body>\n</html>\n```\n\n\
    ```javascript\nconst ele = document.body.children[0];\nconsole.dir(ele);\n\nlet\
    \ val = 'Laurence Svekis';\ndocument.body.children[0].textContent = val;\n\nele.textContent\
    \ = 'UPDATED';\n```\n"
