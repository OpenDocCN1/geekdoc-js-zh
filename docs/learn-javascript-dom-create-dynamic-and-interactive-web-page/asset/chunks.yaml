  trans: "\n本次练习将练习更新页面元素的样式属性。包括 `textAlign`、`border`、`padding`、`position`、`width`、`backgroundColor`、`height`、`color`、`top`、`left`、zIndex。还将使用主\
    \ HTML 元素的值，它在文档中以属性名为 `document.documentElement` 的对象存在。`document.documentElement`\
    \ 将返回文档的根元素，即 HTML 元素。`document.documentElement` 的 `scrollHeight`、`scrollTop`\
    \ 和 `clientHeight` 可用于计算文档当前的滚动位置以及文档的剩余部分。这可以获取当前滚动到的文档百分比。\n\n![](img/image00469.jpeg)\n\
    \n### 练习\n\n1. 选择主页面元素，向其中添加新的 `div`。为 `div` 创建随机高度，以便你可以使用滚动条，且页面内容大于浏览器区域。\n\
    2. 创建一个主滚动条容器，以及两个嵌套在父元素中的 `div`。\n3. 为主滚动条容器应用样式，设置固定位置（fixed）和 100% 的宽度。根据需要添加样式。\n\
    4. 创建一个高度和宽度均为 100% 的空滚动指示器。这可以作为用户向下滚动页面时，内部滚动条填充的空白区域。\n5. 添加内部滚动条，将宽度设置为 0，并设置一个与其父元素不同的背景颜色。\n\
    6. 使用 `window.onscroll` 事件计算滚动器的位置。获取浏览器中当前文档的顶部值。使用 `document.documentElement.scrollTop`，它会在滚动时发生变化，并在顶部时为\
    \ 0。如果你的 `body` 位于页面顶部，`document.body.scrollTop` 将为 0。\n7. `document.documentElement.scrollHeight`\
    \ 始终是所有 `body` 内容的总高度。`document.documentElement.clientHeight` 是页面在浏览器中的可见区域。\n\
    8. 减去 `document.documentElement.scrollHeight - document.documentElement.clientHeight`，这将得到滚动可用总高度的值。减去\
    \ `clientHeight` 后，一旦到达页面底部，高度将设为 0。\n9. 将顶部的 `document.documentElement.scrollTop`（用户向下滚动时该值会增加）除以总可用主体高度。这将返回一个百分比，然后可以乘以\
    \ 100 得到百分比值（%）。\n10. 使用页面滚动百分比值设置滚动条的宽度。\n\n```javascript\nconst main = document.querySelector('div');\n\
    \nconst scrollInd = document.createElement('div');\n\nconst scrBarP = document.createElement('div');\n\
    \nconst scrBarC = document.createElement('div');\n\ndocument.body.prepend(scrollInd);\n\
    \nscrollInd.textContent = 'Scroll Bar';\n\nscrollInd.append(scrBarP);\n\nscrBarP.append(scrBarC);\n\
    \nscrollInd.style.textAlign = 'center';\n\nscrollInd.style.border = '1px solid\
    \ black';\nscrollInd.style.padding = '0px';\nscrollInd.style.position = 'fixed';\n\
    \nscrollInd.style.width = '100%';\nscrollInd.style.backgroundColor = 'black';\n\
    scrollInd.style.color = 'white';\nscrollInd.style.top = '0';\nscrollInd.style.left\
    \ = '0';\nscrollInd.style.zIndex = '1';\n\nscrBarP.style.width = '100%';\nscrBarP.style.height\
    \ = '21px';\nscrBarP.style.padding = '3px';\nscrBarP.style.backgroundColor = 'white';\n\
    \nscrBarC.style.width = '0%';\nscrBarC.style.height = '15px';\nscrBarC.style.backgroundColor\
    \ = 'green';\n\nwindow.onscroll = (e)=>{\n  const sTop = document.body.scrollTop\
    \ || document.documentElement.scrollTop;\n  const pos = document.documentElement.scrollHeight\
    \ - document.documentElement.clientHeight;\n  const scrolMeter = (sTop / pos)*100;\n\
    \  console.log(scrolMeter);\n  const bgColor = scrolMeter > 50 ? 'red' : 'green';\n\
    \  scrBarC.style.width = `${scrolMeter}%`;\n  scrBarC.style.backgroundColor =\
    \ bgColor;\n}\n\nfor(let i=0;i<10;i++){\n  const div = document.createElement('div');\n\
    \  main.append(div);\n  div.style.border = '1px solid #ddd';\n  div.style.height\
    \ = `${ranV(300)+150}px`;\n  div.innerHTML = `<h<h1>${i+1} Header</h1><div>Laurence\
    \ Svekis</div>`;\n  div.style.backgroundColor = ranC();\n  div.style.color = 'white';\n\
    }\n\nfunction ranC(){\n  return `#${Math.random().toString(16).slice(2,8)}`;\n\
    }\n\nfunction ranV(max){\n  return Math.floor(Math.random()*max)+1;\n}\n```\n\n\
    # 带计时器的数学测验\n\n如何使用间隔器（intervals）跟踪时间。使用 JavaScript 创建一个可以暂停计数的计数开始和停止计数器。此编码练习将包含一个简单的数学测验，向用户展示数学问题并跟踪响应。此练习将使用\
    \ `setInterval()` 和 `setTimeout()` 方法向用户显示问题。\n\n![](img/image0470.jpeg)\n\n###\
    \ 练习\n\n1. 为游戏创建页面元素。\n2. 在全局对象中设置问题数量并跟踪计数器。\n3. 创建问题并将它们存储在一个空数组中。\n4. 问题准备就绪后，启动计时器并向玩家展示。\n\
    5. 创建一个显示问题的函数。\n6. 填充文本区域的字符串值。\n7. 在输入字段上添加 `keydown` 事件监听器，如果按键是 `Enter`，则提交答案并检查是否正确。\n\
    8. 如果答案不正确，为玩家提供反馈。\n9. 如果输入值正确并匹配正确答案，则移动到下一个问题。向用户提供反馈。\n10. 添加并为问题的输入字段设置获取焦点。\n\
    11. 在下一个问题中，检查玩家是否处于最后一个问题，如果是，则结束游戏。显示所有答案。停止计时器。\n\n```javascript\nconst main\
    \ = document.querySelector('div');\nconst btn = document.createElement('button');\n\
    const btn1 = document.createElement('button');\nconst div1 = document.createElement('div');\n\
    const div2 = document.createElement('div');\nconst questions = 3;\nconst ques\
    \ = [];\nconst timerVal = {cur:0,counter:0,running:false,int:{}};\n\nmain.innerHTML\
    \ = '';\nmain.append(div1);\nmain.append(btn);\nmain.append(btn1);\nmain.append(div2);\n\
    div1.textContent = 0;\nbtn.textContent = 'Start';\nbtn1.textContent = 'Create\
    \ Questions';\n\nbtn1.onclick = ()=>{\n  btn1.style.display = 'none';\n  createQuestions();\n\
    }\n\nfunction createQuestions(){\n  for(let i=0;i<questions;i++){\n    const first\
    \ = ranNum(1,5);\n    const sec = ranNum(1,5);\n    const que = `${first} + ${sec}`;\n\
    \    const ans = first + sec;\n    const myObj = {que:que,ans:ans}\n    ques.push(myObj);\n\
    \  }\n}\n```\n"
- fmt: "\n# Dynamic Interactive DOM memory Game\n\nThe objective of the memory game\
    \ is to find a matching square. Turn over one set of squares on each turn. If\
    \ a match is found the square will stay turned over, the game continues until\
    \ all the matches are found.\n\nThis exercise is designed to explore more of what\
    \ can be done with JavaScript, and how to apply game logic to achieve desired\
    \ goals with the code. The project will also demonstrate how to create a dynamic\
    \ grid using code, and CSS grid. The game should work the same regardless of the\
    \ size and number of squares.\n\n![](Images/image00471.jpeg)\n\nThe game is designed\
    \ to work with different values, making it easy to adjust the number of squares\
    \ within the game. The code is dynamic and will work with different values. This\
    \ makes the code more flexible and self-contained as the instructions for the\
    \ code and what should happen within the code are not dependent on any static\
    \ values. This is also good practice so that the code is more flexible and less\
    \ prone to bugs if values change, the logic remains the same.\n\n![](Images/image00472.jpeg)\n\
    \n## Exercise\n\n1. Setup the HTML to create several classes that can be applied\
    \ to the page elements that will be created with JavaScript. Set the main game\
    \ board to use the display property of the grid and be able to apply CSS Grid\
    \ to this element. You can use the below HTML as a starting file to skip the creation\
    \ of the HTML and CSS and adjust and customize as needed.\n\n2. Setup the default\
    \ game values, grid size, the `arr` for the possible contents, and a global game\
    \ object that can hold score, total, game and flip array, timer, and the game\
    \ pause action.\n\n3. Calculate the total of squares needed, add a condition to\
    \ ensure that there is enough content in the `arr` to build the page elements\
    \ with values.\n\n4. Add an event listener `document.addEventListener('DOMContentLoaded',\
    \ makeGrid);` that gets invoked once the page loads. It should invoke a function\
    \ `makeGrid()`.\n\n5. Loop through the total number of items to be placed on the\
    \ grid, add an event listener `document.addEventListener('DOMContentLoaded', makeGrid);`\
    \ that gets invoked once the page loads. It should invoke a function `makeGrid()`.\n\
    \n6. Loop through the total number of items to be placed on the grid, add an event\
    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n\n7.\
    \ Loop through the total number of items to be placed on the grid, add an event\
    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n\n```javascript\n\
    showQuestion(0);\n\nstartTimer();\n\n}\n\nfunction showQuestion(ind){\n  div2.innerHTML\
    \ = '';\n  const ele = document.createElement('div');\n  const ele1 = document.createElement('div');\n\
    \  const inEle = document.createElement('input');\n  const ele2 = document.createElement('div');\n\
    \  inEle.setAttribute('type','number');\n  inEle.style.width = '100px';\n  ele1.style.display\
    \ = 'inline-block';\n  ele1.textContent = ques[ind].que + ' = ';\n  inEle.addEventListener('keydown',(e)=>{\n\
    \    if(e.code == 'Enter'){\n      const val1 = inEle.value;\n      let mes =\
    \ 'wrong';\n      inEle.value = '';\n      if(val1 == ques[ind].ans){\n      \
    \  mes = 'correct';\n        setTimeout('movetoNextQuestion()',500);\n      }\n\
    \      ele2.textContent = `${mes} ${ques[ind].que} = ${val1}`;\n    }\n  })\n\
    \  ele.append(ele1);\n  ele.append(inEle);\n  ele.append(ele2);\n  div2.append(ele);\n\
    \  inEle.focus();\n}\n\nfunction movetoNextQuestion(){\n  timerVal.cur++;\n  if(timerVal.cur\
    \ >= ques.length){\n    console.log('end');\n    div2.innerHTML = '';\n    ques.forEach((q)\
    \ =>{\n      div2.innerHTML += `<div>${q.que} = ${q.ans}</div>`;\n    })\n   \
    \ stopTimer();\n  }else{\n    showQuestion(timerVal.cur);\n  }\n}\n\nfunction\
    \ startTimer(){\n  timerVal.running = true;\n  timerVal.int = setInterval('updater()',1000);\n\
    \  btn.textContent = 'Stop';\n}\n\nfunction stopTimer(){\n  timerVal.running =\
    \ false;\n  clearInterval(timerVal.int);\n  btn.textContent = 'Start';\n}\n\n\
    function ranNum(min,max){\n  return Math.floor(Math.random()*(max-min+1)+min);\n\
    }\n\nbtn.onclick = ()=>{\n  if(timerVal.running){\n    stopTimer();\n  }else{\n\
    \    startTimer();\n  }\n}\n\nfunction updater(){\n  if(timerVal.running){\n \
    \   timerVal.counter++;\n    div1.textContent =timerVal.counter;\n  }\n}\n```\n\
    \n8. Loop through the total number of items to be placed on the grid, add an event\
    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n\n9.\
    \ Loop through the total number of items to be placed on the grid, add an event\
    \ listener `document.addEventListener('DOMContentLoaded', makeGrid);` that gets\
    \ invoked once the page loads. It should invoke a function `makeGrid()`.\n\n10.\
