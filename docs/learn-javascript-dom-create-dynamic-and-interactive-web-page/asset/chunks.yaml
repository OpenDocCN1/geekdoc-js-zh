    \ 100% This can be used as the blank area that the inner scroll bar will fill\
    \ as the user scrolls down the page.\n\n5.  Add the inner scroll bar, set width\
    \ to 0 and set a background color different from its parent\n\n6.  Using the window.onscroll\
    \ event, calculate the position of the scroller.  Get the top value of the current\
    \ document in the browser.  Using the document.documentElement.scrollTop which\
    \ will change and be 0 if at the top.  document.body.scrollTop will be 0 as it's\
    \ the document top if your body is at the top of the web page.\n\n7.  The document.documentElement.scrollHeight\
    \ will always be the total height of all the body contents.   The document.documentElement.clientHeight\
    \ is the visible area in the browser of the page.  \n\n8.  Subtract the document.documentElement.scrollHeight\
    \ - document.documentElement.clientHeight which will give a value of the total\
    \ available height of the scrolling.   Subtracting the clientHeight will set the\
    \ height to 0 once the bottom of the page is reached. \n\n9.  Divide the total\
    \ value off the top document.documentElement.scrollTop which will increase once\
    \ the user scrolls down, with the total available body height.  This will return\
    \ a percentage, which then can be multiplied by 100 for a %\n\n10.  Use the percentage\
    \ of page scrolled value to set the width of the scroll bar.  \n\nconst main =\
    \ document.querySelector('div');\n\nconst scrollInd = document.createElement('div');\n\
    \nconst scrBarP = document.createElement('div');\n\nconst scrBarC = document.createElement('div');\n\
    \ndocument.body.prepend(scrollInd);\n\nscrollInd.textContent = 'Scroll Bar';\n\
    \nscrollInd.append(scrBarP);\n\nscrBarP.append(scrBarC);\n\nscrollInd.style.textAlign\
    \ = 'center';\n\nscrollInd.style.border = '1px solid black';\n\nscrollInd.style.padding\
    \ = '0px';\n\nscrollInd.style.position = 'fixed';\n\nscrollInd.style.width = '100%';\n\
    \nscrollInd.style.backgroundColor = 'black';\n\nscrollInd.style.color = 'white';\n\
    \nscrollInd.style.top = '0';\n\nscrollInd.style.left = '0';\n\nscrollInd.style.zIndex\
    \ = '1';\n\nscrBarP.style.width = '100%';\n\nscrBarP.style.height = '21px';\n\n\
    scrBarP.style.padding = '3px';\n\nscrBarP.style.backgroundColor = 'white';\n\n\
    scrBarC.style.width = '0%';\n\nscrBarC.style.height = '15px';\n\nscrBarC.style.backgroundColor\
    \ = 'green';\n\nwindow.onscroll = (e)=>{\n\n const sTop = document.body.scrollTop\
    \ || document.documentElement.scrollTop;\n\n const pos = document.documentElement.scrollHeight\
    \ - document.documentElement.clientHeight;\n\n const scrolMeter = (sTop / pos)*100;\n\
    \n  console.log(scrolMeter);\n\n const bgColor = scrolMeter > 50 ? 'red' : 'green';\n\
    \n  scrBarC.style.width = `${scrolMeter}%`;\n\n  scrBarC.style.backgroundColor\
    \ = bgColor;\n\n}\n\nfor(let i=0;i<10;i++){\n\n const div = document.createElement('div');\n\
    \n  main.append(div);\n\n  div.style.border = '1px solid #ddd';\n\n  div.style.height\
    \ = `${ranV(300)+150}px`;\n\n  div.innerHTML = `<h1>${i+1} Header</h1><div>Laurence\
    \ Svekis</div>`;\n\n  div.style.backgroundColor = ranC();\n\n  div.style.color\
    \ = 'white';\n\n}\n\nfunction  ranC(){\n\n return  `#${Math.random().toString(16).slice(2,8)}`;\n\
    \n}\n\nfunction  ranV(max){\n\n return Math.floor(Math.random()*max)+1;\n\n}\n\
    \n# Math Quiz with timer\n\nHow to track time, using intervals. Create a start\
    \ and stop counter with JavaScript that can pause the counter time.  This coding\
    \ exercise will include a simple math quiz that presents math questions to the\
    \ user, tracks the response, and checks if the answer is correct.  The quiz will\
    \ also start the counter for gamification of the quiz providing a challenging\
    \ way to answer the questions.\n\nThis exercise is going to use the setInterval()\
    \ and setTimeout() methods, and how we can use them within a mini quiz application. \
    \ The questions are going to get generated by JavaScript code, randomly creating\
    \ the values, and storing all the answers in an array which can be used to show\
    \ the questions to the user.  The code will move through the questions in sequence\
    \ showing the question and waiting for the user to submit an answer.  If the input\
    \ value is correct then it will move to the next question, if it's incorrect then\
    \ the question stays on screen until the correct answer is provided.  Once the\
    \ quiz is complete and all the questions are answered correctly, the counter timer\
    \ stops and all the questions/answers will be displayed on the screen.\n\n![](Images/image00470.jpeg)\n\
    \nExercise:\n\n1.  Create the page elements for the game. \n\n2.  Set the starting\
    \ values for the number of questions and track the counter in a global object. \
    \ Create an empty array to store questions.  This can be used as well if you have\
    \ a prebuilt array of questions instead of having the code create the questions.\n\
    \n3.  Create the questions, storing them into the empty holding array, as objects\
    \ in the array.  Set the property for the question as a string and the answer\
    \ to the question.\n\n4.  Once the questions are created create a function and\
    \ invoke it so that the question can be created and shown to the player.  Start\
    \ the time within this function so that the timer starts once the questions are\
    \ ready and shown.\n\n5.  Create a function to create elements to show the question. \
    \ Add a text area element for the question, and an input for the answer.  Create\
    \ a third element to show feedback to the player.\n\n6.  In the text area populate\
    \ the question string value. \n\n7.  Add an event listener of keydown on the input\
    \ field, if the pressed key is Enter then submit the answer and check if its correct.\n\
    \n8.  If the answer is not correct, provide the feedback to the player.\n\n9.\
    \  If the input value is correct and matches the correct answer, then move to\
    \ the next question.  Provide feedback to the user.  For the player to see the\
    \ feedback load the next question using setTimeout\n\n10.  Add and set the focus\
    \ on the input field of the question\n\n11.  In the next question, check if the\
    \ player is on the last question, if they are then end the game.  Show all the\
    \ questions and answers.  Stop the timer.\n\nconst main = document.querySelector('div');\n\
    \nconst btn = document.createElement('button');\n\nconst btn1 = document.createElement('button');\n\
    \nconst div1 = document.createElement('div');\n\nconst div2 = document.createElement('div');\n\
    \nconst questions = 3;\n\nconst ques = [];\n\nconst timerVal = {cur:0,counter:0,running:false,int:{}};\n\
    \nmain.innerHTML = '';\n\nmain.append(div1);\n\nmain.append(btn);\n\nmain.append(btn1);\n\
    \nmain.append(div2);\n\ndiv1.textContent = 0;\n\nbtn.textContent = 'Start';\n\n\
    btn1.textContent = 'Create Questions';\n\nbtn1.onclick = ()=>{\n\n  btn1.style.display\
    \ = 'none';\n\n  createQuestions();\n\n}\n\nfunction  createQuestions(){\n\n for(let\
    \ i=0;i<questions;i++){\n\n const first = ranNum(1,5);\n\n const sec = ranNum(1,5);\n\
    \n const que = `${first} + ${sec}`;\n\n const ans = first + sec;\n\n const myObj\
    \ = {que:que,ans:ans}\n\n      ques.push(myObj);\n\n  }"
