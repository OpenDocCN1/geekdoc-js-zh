    \nlet e = 5;\n\nlet f = 20;\n\nlet myStr1 = 'Hello\\'s \"world\"';\n\nlet myStr2\
    \ = \"\\\"Hello\\\" 'world'\";\n\nlet myStr3 = `Hello'      s   \n\n\"world\"\
    `;\n\nlet tempLit = `Math ${b  +  e  +  f} Hello`;\n\nconst myName = 'Laurence\
    \ Svekis';\n\n//myName = 'Svekis';\n\n{\n\n const b = 1000;\n\n  console.log(b);\n\
    \n //var c = 100;\n\n //let d = 100;\n\n}\n\n//console.log(c);\n\nconsole.log(b);\n\
    \nconsole.log(myName);\n\na = 'Hello World';\n\nlet val = b + e + f;\n\nval =\
    \ myStr1 + ' ' + myStr2 + ' ' + myStr3;\n\nval = tempLit;\n\nval = `${myStr1}\
    \ ${myStr2} ${myStr3}`;\n\nconsole.clear();\n\nconsole.log(val);\n\ndocument.write(val);\n\
    \n# JavaScript Dynamic Type Conversion\n\n● JavaScript DataType\n\n● Data Types\
    \ string, number, boolean - typeof type conversion\n\n● Data Types Booleans Null\
    \ Undefined\n\n● number.toString() Number(string)\n\n● typeof operator\n\n● Data\
    \ types include numbers, strings, booleans, objects\n\nJavaScript Dynamic Type\
    \ Conversion and how it works. JavaScript variables can be converted in different\
    \ data types, they are not set to the data type that they are declared with.  \
    \ JavaScript uses different data types, JavaScript dynamically assigns the data\
    \ type that it presumes is desired, you can also change data types of the variable\
    \ if needed. \n\nLesson JavaScript Coding Exercise:\n\n1.  Declare multiple variables\
    \ without assigning values to them\n\n2.  Get the data type of a variable and\
    \ output it to the page\n\n3.  Add numbers and strings together\n\n4.  Convert\
    \ a string to a number\n\n5.  Convert a number to a string\n\n6.  Create Boolean\
    \ values\n\nlet myStr = 'Laurence';\n\nlet myNum = 0;\n\nlet a;\n\nlet b,c,d;\n\
    \nlet val;\n\nmyStr = 5;\n\nmyNum = 'test';\n\nb = 5;\n\nc = 10;\n\nd = Number('20');\n\
    \nd = null;\n\nd = true;\n\nd = false;\n\nd = c.toString();\n\na = '10a00X';\n\
    \nd = parseInt(a);\n\nval = d + b + c ;\n\nval = 100 + d;\n\nval = typeof(d);\n\
    \nconsole.log(val);\n\ndocument.write(val);\n\n# JavaScript Variables\n\nVariable\
    \ naming Rules provide the parameters as which names can be used and how to declare\
    \ JavaScript Variables within the code.\n\n● Variable identifier names must use\
    \ unique names\n\n● Variable identifier names should be meaningful and semantic\
    \ if possible\n\n● Identifiers can contain letters, digits, underscores, and the\
    \ dollar sign\n\n● Variables names must begin with a letter, underscore, or dollar\
    \ sign\n\n● Names are case sensitive\n\n● Names cannot be the same as JavaScript\
    \ reserved words\n\n● No spaces in the variable name\n\nRules for naming variables\
    \ must start with a letter, underscore (_), or dollar sign ($).  Subsequent can\
    \ be letters of digits.  Upper or lower case.  No spaces. No limit to the length\
    \ of the variable name. Variable names are case sensitive. Cannot use reserved\
    \ words.\n\nLesson JavaScript Coding Exercise:\n\n1.  Create some string values\n\
    \n2.  Assign meaning names to the variable identifier names\n\n3.  Use camelCase\
    \ for a variable name\n\nlet _test5 = 'Laurence';\n\nlet $test_ = 'Svekis';\n\n\
    let test$ = 'hello';\n\nlet TESTtest = 'hello';\n\nlet myFirstName = 'Laurence';\n\
    \n//let let = 'Not a good idea';\n\nlet myLastName = $test_;\n\nlet output = myFirstName;\n\
    \nlet fullName = `${myFirstName} ${myLastName}`;\n\noutput = fullName;\n\nconsole.log(output);\n\
    \ndocument.write(output);\n\n# JavaScript Arrays and Objects\n\nBoth arrays and\
    \ objects provide a powerful way to store and use data within JavaScript.\n\n\
    Both arrays and objects in JavaScript provide a powerful way to hold content and\
    \ use data within code.  With one variable you can hold multiple values within\
    \ both arrays and objects, in addition you can use combinations of these as they\
    \ hold all data types, allowing the data contained within them to go multiple\
    \ levels deep as needed.    Arrays and objects can be declared using const as\
    \ the variable points to a location within the memory and not value that it is\
    \ assigned to, which makes it possible to update the objects and arrays contents\
    \ without having to reassign the value to the variable.  Typically, if you do\
    \ use an array or object then you won’t want to change it, as when you assign\
    \ the variable a new value it would remove all the items contained within these."
