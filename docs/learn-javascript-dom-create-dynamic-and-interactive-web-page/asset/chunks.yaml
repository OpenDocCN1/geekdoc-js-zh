  raw: "5.  If the holding element does not exist, then select the event target element\
    \ and add it as the holding element.  Add some styling and an active class to\
    \ the element.  This will make it easier to select if needed and visual to the\
    \ user so they know which element is the active one.\n\n6.  Add a condition that\
    \ will check for the active class on elements, if found remove it from the element.\n\
    \nconst output = document.querySelector('div');\n\nconsole.log(output);\n\noutput.innerHTML\
    \ = '';\n\nconst holder = {\n\n ele : null\n\n}\n\nfor(let i=0;i<20;i++){\n\n\
    \ const ele = document.createElement('span');\n\n  output.append(ele);\n\n  ele.textContent\
    \ = `${i+1} - Cell`;\n\n  ele.style.border = '1px solid #ddd';\n\n  ele.style.padding\
    \ = '10px';\n\n  ele.style.display = 'inline-block';\n\n  ele.addEventListener('click',mover);\n\
    \n}\n\nfunction  mover(e){\n\n const ele = e.target;\n\n if(holder.ele){\n\n const\
    \ parent = ele.parentNode;\n\n      parent.insertBefore(holder.ele,ele);\n\n     \
    \ holder.ele.style.color = 'black';\n\n      holder.ele.style.borderColor = '#ddd';\n\
    \n      holder.ele = null;\n\n  }else{\n\n const withActive = document.querySelector('.active');\n\
    \n if(withActive){\n\n          withActive.classList.remove('active');\n\n     \
    \ }\n\n      holder.ele = ele;\n\n      holder.ele.classList.add('active');\n\n\
          holder.ele.style.color = 'red';\n\n      holder.ele.style.borderColor =\
    \ 'red';\n\n  }\n\n}\n\n# Web Page Modal Popup Element\n\nExplore how to create\
    \ a JavaScript dynamic modal from a data object.  Modal’s are useful information\
    \ components that provide an interactive way to show additional content.  The\
    \ user interacts with an element that shows the modal on the page, the modal typically\
    \ will highlight the new element and give the appearance that it is a popup above\
    \ the rest of the page content.  The user can then close the modal to hide it\
    \ from view.\n\nThis exercise will demonstrate how to create a modal from data,\
    \ and dynamically add the buttons and the modals into your webpages.  Each modal\
    \ can have its own data that can create and customize them.  The behaviors are\
    \ the same so the code used can create the actions dynamically for each item in\
    \ the data object.\n\n![](Images/image00466.jpeg)\n\nExercise:\n\n1.  Use the\
    \ HTML code as the starter code for this project.\n\n2.  Select the main div from\
    \ the page.\n\n3.  Create a data object that contains multiple items, each with\
    \ a title, body, color and font color.\n\n4.  Loop through the items in the array,\
    \ create page buttons for each.  To each add a button on the page that can open\
    \ the modal, once clicked the button should toggle the modal display settings,\
    \ from none to block.  This will hide and show the modal when the button is clicked.\n\
    \n5.  Create a function to generate the modal called genModal.  Return the main\
    \ modal in that function, so that the element can be used.  Add an event listener\
    \ to the element that checks if the target event element is the same as the parent\
    \ modal, then invoke the closer function with the modal object.\n\n6.  Within\
    \ the genModal function pass the data into the function as an argument.  This\
    \ data can then be used to set the textContent and style of the modal elements.\n\
    \n7.  Create a main parent that will be the overlay.   Add the overlay class to\
    \ the parent modal element.\n\n8.  Within the modal overlay parent, add a main\
    \ modal container which will have the title, body.\n\n9.  Within the title create\
    \ a text area element and a close button element. \n\n10.  Add an eventlistener\
    \ to the close button element.\n\n11.  Add an x in the modal title, that will\
    \ also close the modal when the element is clicked.\n\n12.  Create and apply style\
    \ properties to the modal elements to create styling and structure for the modals.\n\
    \n<!doctype  html>\n\n<html>\n\n<head>\n\n <title>JavaScript</title>\n\n <style>\n\
    \n .overlay{\n\n display:none;\n\n left:0;\n\n top:0;\n\n width:100%;\n\n height:100%;\n\
    \n background-color:rgb(0,0,0);\n\n background-color:rgba(0,0,0,0.5);\n\n position:fixed;\n\
    \n z-index:1;\n\n     }\n\n .main{\n\n width:70%;\n\n border:1px solid black;\n\
    \n margin:auto;\n\n padding:10px;\n\n margin-top:100px;\n\n     }\n\n .close{\n\
    \n color:red;\n\n float:right;\n\n font-size:1em;\n\n     }\n\n .close:hover,\
    \ .close:focus{\n\n cursor:pointer;\n\n     }\n\n </style>\n\n</head>\n\n<body>\n\
    \n<div  ></div>\n\n<script  src=\"code3.js\"></script>\n\n</body>\n\n</html>\n\
    \nconst output = document.querySelector('div');\n\nconst data = [{\n\n title :\
    \ 'My Modal 1',\n\n body : 'This is the modal content 1',\n\n color : '#ddd',\n\
    \n font : 'black'\n\n},{\n\n title : 'My Modal 2',\n\n body : 'This is the modal\
    \ content 2',\n\n color : 'yellow',\n\n font : 'black'\n\n},{\n\n title : 'My\
    \ Modal 3',\n\n body : 'This is the modal content 3',\n\n color : 'purple',\n\n\
    \ font : 'white'\n\n}]\n\ndata.forEach((mod,ind) =>{\n\n const btn = document.createElement('button');\n\
    \n  btn.textContent = `Open Modal #${ind+1}`;\n\n  output.append(btn);\n\n const\
    \ modal = genModal(`modal #${ind+1}`,mod);\n\n  output.append(modal);\n\n  modal.addEventListener('click',(e)=>{\n\
    \n if(e.target == modal){\n\n          closer(modal);\n\n      }\n\n  });\n\n\
      btn.addEventListener('click',(e)=>{\n\n const temp = modal.style.display;\n\n\
    \ if(temp === 'block') {\n\n          modal.style.display= 'none'\n\n      }else{\n\
    \n          modal.style.display = 'block';\n\n      }\n\n  })\n\n})\n\nfunction\
    \  closer(ele){\n\nconsole.log(ele);\n\nele.style.display = 'none';\n\n}\n\nfunction\
    \  genModal(id,mData){\n\n const overlay = document.createElement('div');\n\n\
    \ const main = document.createElement('div');\n\n const mTitle = document.createElement('div');\n\
    \n const mBody = document.createElement('div');\n\n const closeX = document.createElement('span');\n\
    \n const innerTitle = document.createElement('div');\n\n  closeX.classList.add('close');\n\
    \n  closeX.onclick = ()=>{\n\n      closer(overlay);\n\n  };\n\n  closeX.innerHTML\
    \ = '&times;';\n\n  mTitle.style.fontSize = '1.5em';\n\n  mBody.style.border =\
    \ '1px solid #111';\n\n  mBody.style.padding = '10px';\n\n  mTitle.append(closeX);\n\
    \n  mTitle.style.backgroundColor = 'black';\n\n  mTitle.style.color = 'white';\n\
    \n  mTitle.style.padding = '4px';\n\n  innerTitle.textContent = mData.title;\n\
    \n  mTitle.append(innerTitle);\n\n  overlay.classList.add('overlay');\n\n  main.classList.add('main');\n\
    \n  main.append(mTitle);\n\n  main.append(mBody);\n\n  overlay.append(main);\n\
    \n  main.style.color = mData.font;\n\n  main.style.backgroundColor = mData.color;\n\
    \n  mBody.textContent = mData.body;\n\n  console.log(main);\n\n return overlay;\n\
    \n}\n\n# Page Clickers coding Challenge\n\nExplore how to Create Dynamic Interactive\
    \ Click Counters with JavaScript that all work independently and have separate\
    \ count values tracked within the element object.\n\nThis exercise will demonstrate\
    \ how to attach custom property values into the element object.  You can set a\
    \ value just like within any object, and then access that value using its property\
    \ name.  This is ideal for tracking clickers that need to hold their own values\
    \ and work independently of the other page elements and the other click values.\n\
    \nCoding to practice applying code to add event listeners on dynamic page elements. \
    \ Create functions to clean up the code and avoid repeat statements.  Set element\
    \ attributes, like type min and max.  Create page elements with document.createElement()\
    \ and then append it to the parent with append() prepend() or appendChild()  Set\
    \ element style properties with color, fontSize, backgroundColor, and content\
    \ values textContent, innerHTML.  Use forEach to loop through an array or nodeList.\n\
    \n![](Images/image00467.jpeg)\n\nExercise:\n\n1.  Select the main page element\
    \ that will be updated.\n\n2.  Create an input field and a button.  Set the attributes\
    \ to the input field so that it is a number type and has a min of 1 and max of\
    \ 20.  Set a default value of 5 to the input.\n\n3.  Create a function to create\
    \ elements, with parameters of the element tag name, and the parent that the element\
    \ will be appended to.\n\n4.  Create an empty array to hold the main clicker elements,\
    \ and the values of the clicks."
