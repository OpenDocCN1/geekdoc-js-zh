    \ that can move elements, track the current X and Y axis value in pixels and the\
    \ element Height and Width we can then see the values when the overlap occurs. \
    \ This will also allow us to visually see the point of connection on either the\
    \ Horizonal axis or the Vertical axis. See the calculation and collision formula\
    \ in action with real-time numbers and values of the elements.\n\nSet up movement\
    \ of page elements and track the position exercise:\n\n1.  Create a function that\
    \ allows for the creation of page elements as we can then dynamically add elements\
    \ to the page as needed.  Give the function a name of adder() to get the parent\
    \ element that the new element will be appended to.  Create the element using\
    \ the string value of the element tag.  Add the inner HTML content for the element\
    \ and add a class using the string value. function adder(parent,t,html,c){ const\
    \ ele = document.createElement(t);  ele.innerHTML = html;    ele.classList.add(c); \
    \ return parent.appendChild(ele); }\n\n2.  Create four-page elements, 2 boxes\
    \ that will be moved, and 2 areas to output the box coordinates and dimensions.\n\
    \n3.  Create a global game object that can track the animation frame, contains\
    \ the x,y (horizontal,vertical) position of each box, and that contains the h,w\
    \ (height and width) of each box.  These values then can be used to update the\
    \ position.\n\n4.  Set up an object named keyz to track which keyboard keys will\
    \ be used for element movement.  Add 8 key code names as property names and set\
    \ the values to false.  This will be updated once the key is pressed.\n\n5.  const\
    \ keyz = {    ArrowLeft:false, ArrowRight:false, ArrowUp:false, ArrowDown:false,\
    \    KeyA:false, KeyW:false, KeyS:false, KeyZ:false, };\n\n6.  Add event listeners\
    \ on the document that listen for keydown and keyup events.  If the keys from\
    \ the keyz object pressed match the object property name, set the value to true\
    \ on press down and false on up.   This can now be used for the element movement.\n\
    \n7.  Create and Launch the mover() function which will handle page element movement\
    \ on key presses.\n\n8.  Within the mover() function add conditions to check which\
    \ keys are true, update the game object x,y for each box accordingly.  Also apply\
    \ a condition to check to ensure that before the movement is allowed that the\
    \ element is within the boundaries of the main container object element.\n\n9.\
    \  Update the style values of properties left and top for each box with the new\
    \ game x,y values for each.\n\n10.  Output the x,y,h,w of each element to the\
    \ page as they move; these values should change with the new x,y coordinates of\
    \ the element.  These will be used to calculate the collision of the elements.\n\
    \n<!DOCTYPE  html>\n\n<html>\n\n<head>\n\n <title>JavaScript Course</title>\n\n\
    \ <style>\n\n .container {\n\n position: relative;\n\n background-color: #ddd;\n\
    \n width: 90vw;\n\n margin: auto;\n\n       }\n\n .box {\n\n position: absolute;\n\
    \n width: 50px;\n\n height: 50px;\n\n left: 0;\n\n top: 0px;\n\n line-height:\
    \ 50px;\n\n text-align: center;\n\n color: white;\n\n       }\n\n .info {\n\n\
    \ background-color: white;\n\n padding: 5px;\n\n text-align: center;\n\n font-size:\
    \ 1.4em;\n\n color: white;\n\n       }\n\n .info  div {\n\n padding: 10px;\n\n\
           }\n\n .game {\n\n position: relative;\n\n min-height: 300px;\n\n      \
    \ }\n\n </style>\n\n</head>\n\n<body>\n\n <div  class=\"container\"></div>\n\n\
    \ <script  src=\"app8.js\"></script>\n\n</body>\n\n</html>\n\nconst main = document.querySelector('.container');\n\
    \nconst message = adder(main, 'div', '', 'info');\n\nconst output1 = adder(message,\
    \ 'div', 'Content 1', 'output');\n\nconst output2 = adder(message, 'div', 'Content\
    \ 2', 'output');\n\nconst gameBoard = adder(main, 'div', '', 'game');\n\nconst\
    \ box1 = adder(gameBoard, 'div', 'Box 1', 'box');\n\nbox1.style.backgroundColor\
    \ = 'red';\n\noutput1.style.backgroundColor = 'red';\n\nconst box2 = adder(gameBoard,\
    \ 'div', 'Box 2', 'box');\n\nbox2.style.backgroundColor = 'blue';\n\noutput2.style.backgroundColor\
    \ = 'blue';\n\nbox2.style.left = '100px';\n\nconst game = {\n\n move: {},\n\n\
    \ x1: box1.offsetLeft,\n\n y1: box1.offsetTop,\n\n x2: box2.offsetLeft,\n\n y2:\
    \ box2.offsetTop,\n\n speed: 5,\n\n w1: box1.offsetWidth,\n\n h1: box1.offsetHeight,\n\
    \n w2: box2.offsetWidth,\n\n h2: box2.offsetHeight\n\n};\n\nconst keyz = {\n\n\
    \ ArrowLeft: false,\n\n ArrowRight: false,\n\n ArrowUp: false,\n\n ArrowDown:\
    \ false,\n\n KeyA: false,\n\n KeyW: false,\n\n KeyS: false,\n\n KeyZ: false,\n\
    \n};\n\ndocument.addEventListener('keydown', (e) => {\n\n if (e.code in keyz)\
    \ {\n\n       keyz[e.code] = true;\n\n   }\n\n})\n\ndocument.addEventListener('keyup',\
    \ (e) => {\n\n if (e.code in keyz) {\n\n       keyz[e.code] = false;\n\n   }\n\
    \n})\n\nwindow.addEventListener('DOMContentLoaded', mover);\n\nfunction  mover()\
    \ {\n\n const dim = [gameBoard.offsetWidth - box1.offsetWidth, gameBoard.offsetHeight\
    \ - box1.offsetHeight];\n\n //Box 1\n\n if (keyz.ArrowRight && game.x1 < dim[0])\
    \ game.x1 += game.speed;\n\n if (keyz.ArrowLeft && game.x1 > 0) game.x1 -= game.speed;\n\
    \n if (keyz.ArrowDown && game.y1 < dim[1]) game.y1 += game.speed;\n\n if (keyz.ArrowUp\
    \ && game.y1 > 0) game.y1 -= game.speed;\n\n   box1.style.left = `${game.x1}px`;\n\
    \n   box1.style.top = `${game.y1}px`;\n\n //Box 2\n\n if (keyz.KeyS && game.x2\
    \ < dim[0]) game.x2 += game.speed;\n\n if (keyz.KeyA && game.x2 > 0) game.x2 -=\
    \ game.speed;\n\n if (keyz.KeyZ && game.y2 < dim[1]) game.y2 += game.speed;\n\n\
    \ if (keyz.KeyW && game.y2 > 0) game.y2 -= game.speed;\n\n   box2.style.left =\
    \ `${game.x2}px`;\n\n   box2.style.top = `${game.y2}px`;\n\n   output1.innerHTML\
    \ = `Box #1 X:${game.x1} Y:${game.y1} W:${game.w1} H:${game.h1}`;\n\n   output2.innerHTML\
    \ = `Box #2 X:${game.x2} Y:${game.y2} W:${game.w2} H:${game.h2}`;\n\n   game.move\
    \ = window.requestAnimationFrame(mover);\n\n}\n\nfunction  adder(parent, t, html,\
    \ c) {\n\n const ele = document.createElement(t);\n\n   ele.innerHTML = html;\n\
    \n   ele.classList.add(c);\n\n return parent.appendChild(ele);\n\n}\n\n# Page\
    \ Element Collision detection part 2"
