      ele.innerHTML = html;\n\n return parent.appendChild(ele);\n\n}\n\n# Dynamic\
    \ Coin Flipping DOM game\n\nThe coding challenge is to create an interactive game,\
    \ which loads several coins and allows the player to select what they think the\
    \ coin flip will return on the coin.  If they are correct the score will increase\
    \ by one for that player.  The code is designed to be dynamic making it easy to\
    \ update and add new players.   This exercise is based on 2 parts, one will create\
    \ a static number of players 2 and the second part will update the code to create\
    \ a dynamic number of coins and players.\n\nYou can use JavaScript for styling\
    \ or use the default HTML and CSS in the source code below.  The object is to\
    \ practice and learn more about JavaScript and how JavaScript can be used to create\
    \ interactive web page elements.  This exercise will also provide practice in\
    \ applying game play logic to make the desired outcomes within the code, using\
    \ logic and scoring.\n\n![](Images/image00473.jpeg)\n\nHTML and CSS source code\
    \ to create the coins and styling for the game play area.\n\n<!doctype  html>\n\
    \n<html>\n\n<head>\n\n <title>JavaScript</title>\n\n <style>\n\n .game{\n\n width:90vw;\n\
    \n margin:auto;\n\n background-color:black;\n\n color:white;\n\n    }\n\n .gameArea{\n\
    \n display:grid;\n\n grid-template-columns: repeat(2, 1fr);\n\n    }\n\n .gamer{\n\
    \n height:140px;\n\n text-align:center;\n\n background-color:white;\n\n color:black;\n\
    \n border:1px solid black;\n\n text-align:center;\n\n    }\n\n .coin{\n\n width:70px;\n\
    \n height:70px;\n\n line-height:80px;\n\n font-size:4em;\n\n border-radius:50%;\n\
    \n background-color:gold;\n\n margin:auto;\n\n border:1px solid black;\n\n text-shadow:\
    \ 1px 1px;\n\n    }\n\n .dash{\n\n text-align:center;\n\n padding:10px;\n\n   \
    \ }\n\n .btn{\n\n margin:10px;\n\n    }\n\n .score{\n\n text-align:center;\n\n\
        }\n\n </style>\n\n </head>\n\n<body>\n\n<div  class=\"game\"></div>\n\n<script\
    \  src=\"code10.js\"></script>\n\n</body>\n\n</html>\n\n![](Images/image00474.jpeg)\n\
    \nObjective of the game is to select the correct value in the button below the\
    \ image, then press the Flip Coin button to run the game.  The correct results\
    \ are a scored and the incorrect guesses are not.  There are variations of this\
    \ code that can be used to create different games as different logic can be applied. \
    \ Creating the game logic and having it work independently of the number of coins\
    \ provide added flexibility to update the game play.\n\nPlease note that you can\
    \ use different character icons for the images, these are just an example.  The\
    \ character icons can be selected and used from common web icons.\n\nExercise:\n\
    \n1.  Select the page elements from the HTML\n\n2.  Create an array that contains\
    \ the values called “vals”, heads and tails icons.\n\n3.  Create a main game object\
    \ with player scoring in an array called players and a counter for the total number\
    \ of rounds that have been played.\n\n4.  Create the interactive page elements\
    \ for the game play.  Score area, game area, player 1 and player 2 divs.  Add\
    \ a coin to each of the player divs.  Set the default starting values to heads,\
    \ add to the coin element object a val to track the current value of either 0\
    \ or 1.  Add the coins into an array named coins.\n\n5.  Setup the dashboard for\
    \ the flip coins button\n\n6.  Add event listeners to the click of the buttons\
    \ for the coins, these should toggle the two values of either heads or tails (0 \
    \ or 1).  Create a function to update the styling accordingly.\n\n7.  Attach an\
    \ event to the main coin flip button, disabled the button when clicked.  Loop\
    \ through the coins and remove the current image from the textContent.  Using\
    \ a setTimeout invokes a function named flipper.  This timeout is used for a delay\
    \ effect which will show the player the action is in play.\n\n8.  Within the flipper()\
    \ function update the game rounds total counter by 1.  Loop through the coins\
    \ array, generate a random value 0 or 1.  Set the innerHTML to match the boolean\
    \ using the items either heads or tails.  Set the coin value to 0 or 1.  Update\
    \ the button setting dsiabled to false so the button to flip can be clicked again. \
    \ Create a function to check the results of the flip.\n\n9.  Within the checker()\
    \ function parameters, pass in the coin value, the button val and the ind value\
    \ of the coin.  If the coin value matches the corresponding button value then\
    \ that player will score a point.  Output the results into the message area for\
    \ the player to be able to see the score.\n\n10.  The flipping should now be able\
    \ to be clicked again resulting in another round of the game play.\n\nconst main\
    \ = document.querySelector('.game');\n\nconst vals = ['��', '��'];\n\nconst game\
    \ = {\n\n players: [0, 0],\n\n total: 0\n\n};\n\nconst scoreDiv = maker('div',\
    \ main, 'score', 'Score');\n\nconst gameArea = maker('div', main, 'gameArea',\
    \ '');\n\nconst player1 = maker('div', gameArea, 'gamer', 'Coin 1');\n\nconst\
    \ player2 = maker('div', gameArea, 'gamer', 'Coin 2');\n\nconst coin1 = maker('div',\
    \ player1, 'coin', '��');\n\nconst coin2 = maker('div', player2, 'coin', '��');\n\
    \ncoin1.val = 1;\n\ncoin2.val = 1;\n\nconst coins = [coin1, coin2];\n\nconst dashboard\
    \ = maker('div', main, 'dash', '');"
