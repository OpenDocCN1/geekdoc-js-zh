  trans: "\n\nJavaScript `For`、`While`、`Do While` 循环多次执行代码块，直到满足条件为止。\n\n循环允许我们多次执行代码块，它们还允许我们遍历项目列表（例如数组中的项），直到数组项的长度条件不再为真，或者满足其他跳出循环的条件。\n\
    \n循环始终需要几个参数，例如起始值、停止循环的条件以及在循环中移动到下一个项目的方法。我们可以通过设置一个带有起始值的变量来建立一个简单的 `for` 循环，然后应用一个条件，如果该条件为真则继续执行循环，并增加变量的值，使得条件最终不再为真。\n\
    \n![](img/image00448.jpeg)\n\n### 课程 JavaScript 编程练习：\n\n1. 将页面元素选择为 JavaScript\
    \ 变量。\n2. 更新输入字段属性，设置为数字输入类型，并带有 `min` 和 `max` 值。\n3. 为按钮元素添加点击事件监听器。\n4. 当点击按钮时，获取输入值并赋值给变量\
    \ `num`。创建一个 `for` 循环，根据输入值 `num` 的循环次数执行一个代码块。\n5. 创建一个 `while` 循环，根据输入值的次数输出\
    \ `html`。\n6. 创建一个 `do while` 循环，根据输入值的次数创建 `html` 输出。\n7. 使用新内容更新 `html`。\n\n\
    ```html\n<!doctype html>\n<html\n<head>\n <title>JavaScript</title>\n</head>\n\
    <body>\n<div>JavaScriptJavaScript</div>\n<input type=\"text\" >\n<button type=\"\
    button\">Click</button>\n<script src=\"dom7.js\"></script>\n</body>\n</html>\n\
    ```\n\n```javascript\nconst output = document.querySelector('div');\nconst myInput\
    \ = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nmyInput.setAttribute('type','number');\nmyInput.setAttribute('max',20);\nmyInput.setAttribute('min',0);\n\
    myInput.value = 5;\nbtn.onclick = btnClicked;\n\nfunction btnClicked(){\n  console.clear();\n\
    \  let num = myInput.value;\n  let html = '';\n  for(let i=0;i<num;i++){\n   \
    \ console.log(i);\n    html += `<div>${i+1} For</div>`;\n  }\n  let i = 10;\n\
    \  while(i<num){\n    i++;\n    html += `<div>${i} While</div>`;\n  }\n  do{\n\
    \    i++;\n    html += `<div>${i} Do</div>`;\n  } while(i<num);\n  output.innerHTML\
    \ = html;\n  console.log('ready');\n}\n```\n\n# JavaScript 对象\n\nJavaScript 对象可以用于包含许多相关数据，此示例将演示如何在代码中使用\
    \ `Objects`。\n\nJavaScript 的数据类型之一是 `object`。这些可以用于存储各种键值对集合甚至更复杂的实体。文档是一个包含许多实体的巨大\
    \ `object`。学习更多关于对象的知识将有助于更好地定义 `DOM` 实体可以做什么、它们的行为及其原因，以及如何使用它们。\n\n![](img/image00449.jpeg)\n\
    \n### 课程 JavaScript 编程练习：\n\n1. 从 HTML 文件选择页面元素作为 JavaScript `objects`。\n2. 创建一个全局对象，其具有\
    \ `first`、`last`、`id` 的值，并在对象中创建几个方法。\n3. 在对象中创建一个方法，使用对象中的 `first` 和 `last` 名称值并将它们组合成字符串，包括\
    \ `id` 和作为参数发送给函数的任何值。\n4. 在对象内部创建一个方法，可以更新对象的 `first` 和 `last` 姓名。为对象 `id` 生成随机值。返回组合后的当前对象属性值。\n\
    5. 当点击按钮时，更新对象 `first` 属性的值。\n6. 在页面和控制台上输出调用对象中的 `fullName` 方法生成的新字符串。\n7. 获取对象项（entries）作为嵌套数组值并使用\
    \ `Object.entries()` 创建新数组。\n8. 使用 `Object.keys()` 获取并创建一个包含对象键的数组。\n9. 使用 `Object.values()`\
    \ 获取并创建一个包含对象值的数组。\n10. 使用 `in` 或 `condition` 检查键是否包含在对象中。\n11. 遍历对象的属性名并在控制台中输出它们。\n\
    12. 检查属性值的数据类型，如果是 `string` 或 `number`，则将其输出到控制台，否则在控制台输出警告。\n\n```javascript\n\
    const output = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\nbtn.onclick = btnClicked;\nmyInput.value\
    \ = 'Laurence';\n\nconst myObj = {\n  first : 'Laurence',\n  last : 'Svekis',\n\
    \  ele : output,\n  id : 0,\n  fullName : function(val){\n    return `${this.first}\
    \ ${this.last} ${this.id} ${val}`\n  },\n  zName(val){\n    return `${this.first}\
    \ ${this.last} ${this.id} ${val}`\n  },\n  adder(first,last){\n    this.first\
    \ = first;\n    this.last = last;\n    this.id = Math.floor(Math.random()*100);\n\
    \    return `${this.first} ${this.last} ${this.id}`;\n  }\n};\n\nfunction btnClicked(){\n\
    \  const newFirst = 'Laurence';\n  const ranNum = Math.floor(Math.random()*100);\n\
    \  const newLast = 'Svekis';\n  myObj.adder(newFirst, newLast);\n  output.innerHTML\
    \ = `<div>${myObj.fullName('test')}</div>`;\n  console.log(myObj.fullName('test'));\n\
    \  const arr1 = Object.entries(myObj);\n  const arr2 = Object.keys(myObj);\n \
    \ const arr3 = Object.values(myObj);\n  const key = myInput.value;\n  if (key\
    \ in myObj){\n    for(const prop in myObj){\n      console.log(prop);\n      const\
    \ val = myObj[prop];\n      if(typeof val === 'string' || typeof val === 'number'){\n\
    \        console.log(val);\n      } else {\n        console.warn(val);\n     \
    \ }\n    }\n  }\n}\n```\n\n# 使用 JavaScript 构建对象\n\n你可以使用函数来构建对象，这创建了对象的实例。代码块将与对象相关。\n\
    \n### 课程 JavaScript 编程练习：\n\n1. 从输入字段获取值，用于创建一个人的对象。这应该设置 `first`、`last` 并使用这两者创建对象的\
    \ `full` 姓名。\n2. 在 `arguments` 没有值的情况下为函数添加默认值。\n\n```javascript\nconst output\
    \ = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\nbtn.onclick = btnClicked;\nmyInput.value\
    \ = 'Laurence';\n\nfunction FullName(first='Laurence',last='Svekis'){\n  this.firstName\
    \ = first;\n  this.lastName = last;\n  this.full = `${first} ${last}`;\n}\n\n\
    function btnClicked(){\n  const person = new FullName(myInput.value, 'Smith');\n\
    \  output.innerHTML = `<div>${person.full}</div>`;\n  console.log(person.full);\n\
    }\n```\n\n# JavaScript 数组值\n\n更新数组值的常用 JavaScript 数组方法用于利用数据。数组方法提供了一种强大的方法来交互和使用数组包含的数据。\n\
    \n`arr.push(val)` // 添加到数组返回数组长度\n`arr.pop()` // 删除最后一个\n`arr.shift()` // 删除第一个\n\
    `arr.unshift(val)` // 添加到数组开头返回数组长度\n`arr.splice(1)` // 返回索引 1 之后的所有项\n`splice(start,\
    \ deleteCount, val)` // 修改数组内容\n`arr.slice(start, end)` // 将数组的一部分拷贝到新数组中\n`arr.slice()`\
    \ // 复制数组为新数组\n`arr.slice(5)` // 从索引 5 开始返回数组项\n`arr.slice(1,4)` // 使用 slice 返回数组部分\n\
    `arr.toString()` // 返回数组项的字符串表示\n\n"
- fmt: "\n```javascript\narr.join(' - '); // returns a string representation of the\
    \ array items using the argument value as a separator for the items in the array.\n\
    ```\n\n## Lesson JavaScript Coding Exercise:\n\n1. Setup HTML elements as JavaScript\
    \ objects, add an `onclick` event to the button.\n2. Create 2 arrays, using `concat`\
    \ and `join` them to create a 3rd array, add one of the original arrays twice\
    \ into the new array.\n3. Try the different array methods `push()`, `pop()`, `shift()`,\
    \ and `unshift()` to update the data in the array.\n4. Using `splice()` update\
    \ the original array, create a new array from the array items that were spliced.\n\
    5. Using `slice()` to create a new array from portions of the existing array.\n\
    6. Convert an array into a string, also convert an array into a string using a\
    \ dash as a separator.\n7. Output the results into the console and on the web\
    \ page.\n\n```javascript\nconst output = document.querySelector('div');\nconst\
    \ myInput = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\nmyInput.value = 'Laurence';\n\nconst arr1 = ['One'];\n\
    const tempArr = ['onex','twox','threex'];\nconst arr = arr1.concat(tempArr,tempArr);\n\
    \nfunction btnClicked() {\n  const val = myInput.value;\n  let temp = arr.push(val,'LAST');\
    \ // add to array return the array length\n  console.log(temp);\n\n  temp = arr.pop();\
    \ //remove last\n  console.log(temp);\n\n  temp = arr.shift(); //remove first\
    \ item\n  console.log(temp);\n\n  temp = arr.unshift('First'); //add to the front\
    \ of array array length returned\n  console.log(temp);\n\n  console.log(arr.length);\n\
    \n  arr[arr.length - 1] = 'LAST';\n  //delete arr[0];\n  //console.log(arr);\n\
    \n  arr.push('one1','two2','three3');\n  //temp = arr.splice(1);  return array\
    \ with all items after the index of 1\n  //temp = arr.splice(1,3);\n  temp = arr.splice(1,3,'Add1','Add2','Add3');\n\
    \  console.log(temp);\n\n  temp = arr.splice(3,0,'New1','New2','New3');\n  console.log(temp);\n\
    \n  temp = arr.slice(); //duplicate array as new array\n  temp[0] = 'TEST';\n\
    \  temp = arr.slice(5); // return array items from index 5\n  temp = arr.slice(1,4);\
    \ // return portion of array using slice\n\n  console.clear();\n  console.log(temp);\n\
    \  console.log(arr);\n\n  const myStr = arr.toString();\n  const myStr1 = arr.join('\
    \ - ');\n\n  output.innerHTML = `<div>${myStr}</div>`;\n  console.log(arr);\n\
    \  console.log(myStr);\n  console.log(myStr1);\n}\n```\n\n## Looping through the\
    \ Array items\n\nLooping through an Array to get the contents, there are methods\
    \ like the `forEach` Method which are ideal for looping the content and interacting\
    \ with the array data.\n\nIterate through all the items in an array, selecting\
    \ the items and their values. You can use the array `length` property in a `for`\
    \ loop, or the array method of `forEach(item,index,array)` and return back the\
    \ item values of the array.\n\n![](Images/image00450.jpeg)\n\n## Lesson JavaScript\
    \ Coding Exercise:\n\n1. Select all the HTML elements into the JavaScript code.\n\
    2. Using a `for` loop update the output element with new `divs`.\n3. Using `document.querySelectorAll()`\
    \ select all the matching results for `divs` within a `div`.\n4. Using `forEach`\
    \ loop through all the new `divs`, add a new property value of `val`, with a value\
    \ of 0 to each new `div`.\n5. Add a click event to each new `div`, that will output\
    \ the element, the index value and the `event.target` element into the console.\
    \ Update the `val` value of the element increment by 1. Check if the `style.color`\
    \ is red, if not set to red otherwise set to black. Output the number of times\
    \ each `div` was clicked into the element text.\n6. On the main button click,\
    \ add a loop through all the `arr` items, using the `for` loop and output the\
    \ array item value into the console.\n7. Using `forEach` get all the array items\
    \ and output them as a `div` into the page, listing the index plus one and the\
    \ item value in the new element.\n\n```javascript\nconst output = document.querySelector('div');\n\
    const myInput = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\nmyInput.value = 'Laurence';\n\nconst arr = [];\n\n\
    for(let i=0;i<10;i++){\n  output.innerHTML += `<div>${i} Test Div</div>`;\n}\n\
    \nconst eles = document.querySelectorAll('div div');\nconsole.log(eles);\n\neles.forEach((ele)=>{\n\
    \  console.log(ele);\n  ele.val = 0;\n  ele.onclick = (e)=>{\n    console.clear();\n\
    \    console.log(ele);\n    console.log(e.target);\n    ele.val++;\n    ele.innerText\
    \ = `${ele.val} was clicked`;\n\n    if(ele.style.color == 'red'){\n      ele.style.color\
    \ = 'black';\n    }else{\n      ele.style.color = 'red';\n    }\n  }\n})\n\nfunction\
    \ btnClicked() {\n  arr.push(myInput.value);\n  console.log(arr.length);\n\n \
    \ for(let i=0;i<arr.length;i++){\n    console.log(`${i} ${arr[i]}`);\n  }\n\n\
    \  let html = '';\n  arr.forEach((item,index,arr1)=>{\n    html += `<div>${index+1}.\
    \ ${item}</div>`;\n    console.log(item);\n    console.log(index);\n    console.log(arr1);\n\
    \    console.clear();\n    arr1[0] = 'TEST';\n  })\n  output.innerHTML = html;\n\
    }\n```\n\n# Array Methods\n\nJavaScript has several Array Methods for the contents\
    \ of the array to make it easy to loop through the items.\n\n![](Images/image00451.jpeg)\n\
    \n## JavaScript Coding Exercise:\n\n1. Create an array with strings.\n2. Create\
    \ an array with random numbers 0-100.\n3. Using `map()` create a new array with\
    \ the items.\n4. Using `map()` method update the numeric values multiplied by\
    \ 2.\n5. Using `filter()` return only the values larger than 50.\n6. Using `reduce()`\
    \ add all values together return the total.\n7. Using `every()` check if all values\
    \ are less than 150.\n8. Using `some()` check if any values are less than 50.\n\
    9. Output the results into the console.\n10. Using `map()` method the array items\
    \ into the input field.\n11. Using `forEach()` loop through the items and output\
    \ the results into the page.\n\n```javascript\nconst output = document.querySelector('div');\n\
    const myInput = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\nmyInput.value = 10;\nmyInput.setAttribute('type','number');\n\
    \nconst arr = ['one','two','three','four','five'];\nconst temp1 = [];\n\nfor(let\
    \ i=0;i<10;i++){\n  const ranValue = Math.floor(Math.random()*100);\n  temp1.push(ranValue);\n\
    }\n\nfunction btnClicked() {\n  const arr1 = arr.map((item,ind,array)=>{\n   \
    \ console.log(item);\n    return `${item} ${ind}`;\n  })\n\n  const arr2 = temp1.map(val=>\
    \ val*2);\n\n  const arr3 = temp1.filter((val)=>{\n    return val > 50;\n  });\n\
    \n  const arr4 = temp1.reduce((previous,current,index)=>{\n    console.log(previous);\n\
    \    console.log(current);\n    return previous + current;\n  });\n\n  const arr5\
    \ = temp1.every((val)=>{\n    console.log(val);\n    return val < 150;\n  })\n\
    \n  const arr6 = temp1.some((val)=>{\n    console.log(val);\n    return val <\
    \ 50;\n  })\n\n  console.log(arr1);\n  console.log(arr2);\n  console.log(arr3);\n\
    \  console.log(arr4);\n  console.log(arr5);\n  console.log(arr6);\n\n  const arr7\
    \ = temp1.map((val)=>{\n    console.log(val);\n    return val * myInput.value;\n\
    \  })\n\n  let html = '';\n  arr7.forEach((ele,ind) => {\n    html += `<div>${temp1[ind]}\
    \ x ${myInput.value} = ${ele}</div>`;\n  })\n  output.innerHTML = html;\n}\n```\n"
  raw: "arr.join(' - '); // returns a string representation of the array items using\
    \ the argument value as a separator for the items in the array.\n\nLesson JavaScript\
    \ Coding Exercise:\n\n1.  Setup HTML elements as JavaScript objects, add an onclick\
    \ event to the button\n\n2.  Create 2 arrays, using concat join them to create\
    \ a 3rd array, add one of the original arrays twice into the new array.\n\n3.\
    \  Try the different array methods push() pop() shift() and unshift() to update\
    \ the data in the array.\n\n4.  Using splice() update the original array, create\
    \ a new array from the array items that were spliced.\n\n5.  Using slice() create\
    \ a new array from portions of the existing array\n\n6.  Convert an array into\
    \ a string, also convert an array into a string using a dash as a separator.\n\
    \n7.  Output the results into the console and on the web page.\n\nconst output\
    \ = document.querySelector('div');\n\nconst myInput = document.querySelector('input');\n\
    \nconst btn = document.querySelector('button');\n\nbtn.onclick = btnClicked;\n\
    \nmyInput.value = 'Laurence';\n\nconst arr1 = ['One'];\n\nconst tempArr = ['onex','twox','threex'];\n\
    \nconst arr = arr1.concat(tempArr,tempArr);\n\nfunction  btnClicked(){\n\n const\
    \ val =  myInput.value;\n\n let temp = arr.push(val,'LAST'); // add to array return\
    \ the array length\n\n  console.log(temp);\n\ntemp = arr.pop(); //remove last\n\
    \n  console.log(temp);\n\ntemp = arr.shift(); //remove first item\n\n  console.log(temp);\n\
    \n  temp = arr.unshift('First'); //add to the front of array array length returned\n\
    \n  console.log(temp);\n\n  console.log(arr.length);\n\narr[arr.length - 1] =\
    \ 'LAST';\n\n //delete arr[0];\n\n //console.log(arr);\n\n  arr.push('one1','two2','three3');\n\
    \n //temp = arr.splice(1);  return array with all items after the index of 1\n\
    \n //temp = arr.splice(1,3);\n\n  temp = arr.splice(1,3,'Add1','Add2','Add3');\n\
    \n  console.log(temp);\n\n  temp = arr.splice(3,0,'New1','New2','New3');\n\n \
    \ console.log(temp);\n\ntemp = arr.slice(); //duplicate array as new array\n\n\
    temp[0] = 'TEST';\n\ntemp = arr.slice(5); // return array items from index 5\n\
    \ntemp = arr.slice(1,4); // return portion of array using slice\n\n  console.clear();\n\
    \n  console.log(temp);\n\n  console.log(arr);\n\n const myStr = arr.toString();\n\
    \n const myStr1 = arr.join(' - ');\n\n  output.innerHTML = `<div>${myStr}</div>`;\n\
    \n  console.log(arr);\n\n  console.log(myStr);\n\n  console.log(myStr1);\n\n}\n\
    \n# Looping through the Array items\n\nLooping through an Array to get the contents,\
    \ there are methods like the forEach Method which area ideal for looping the content\
    \ and interacting with the array data.\n\nIterate through all the items in an\
    \ array, selecting the items and their values.  You can use the array length property\
    \ in a for loop, or the array method of forEach(item,index,array) and return back\
    \ the item values of the array.\n\n![](Images/image00450.jpeg)\n\nLesson JavaScript\
    \ Coding Exercise:\n\n1.  Select all the HTML elements into the JavaScript code. \n\
    \n2.  Using a for loop update the output element with new divs\n\n3.  Using document.querySelectorAll()\
    \ select all the matching results for divs within a div\n\n4.  Using forEach loop\
    \ through all the new divs, add a new property value of val, with a value of 0\
    \ to each new div.  \n\n5.  Add a click event to each new div, that will output\
    \ the element, the index value and the event.target element into the console. \
    \ Update the val value of the element increment by 1.  Check if the style color\
    \ is red, if not set to red otherwise set to black.  Output the number of times\
    \ each div was clicked into the element text.\n\n6.  On the main button click,\
    \ add a loop through all the arr items, using the for loop and output the array\
    \ item value into the console.\n\n7.  Using forEach get all the array items and\
    \ output them as a div into the page, listing the index plus one and the item\
    \ value in the new element.\n\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nmyInput.value = 'Laurence';\n\nconst arr = [];\n\
    \nfor(let i=0;i<10;i++){\n\n  output.innerHTML += `<div>${i} Test Div</div>`;\n\
    \n}\n\nconst eles = document.querySelectorAll('div div');\n\nconsole.log(eles);\n\
    \neles.forEach((ele)=>{\n\n  console.log(ele);\n\n  ele.val = 0;\n\n  ele.onclick\
    \ = (e)=>{\n\n      console.clear();\n\n      console.log(ele);\n\n      console.log(e.target);\n\
    \n      ele.val++;\n\n      ele.innerText = `${ele.val} was clicked`;\n\n if(ele.style.color\
    \ == 'red'){\n\n          ele.style.color = 'black';\n\n      }else{\n\n         \
    \ ele.style.color = 'red';\n\n      }\n\n  }\n\n})\n\nfunction  btnClicked(){\n\
    \n  arr.push(myInput.value);\n\n  console.log(arr.length);\n\n for(let i=0;i<arr.length;i++){\n\
    \n      console.log(`${i} ${arr[i]}`);\n\n  }\n\n let html = '';\n\n  arr.forEach((item,index,arr1)=>{\n\
    \nhtml += `<div>${index+1}. ${item}</div>`;\n\n      console.log(item);\n\n     \
    \ console.log(index);\n\n      console.log(arr1);\n\n //console.clear();\n\n //arr1[0]\
    \ = 'TEST';\n\n  })\n\n  output.innerHTML = html;\n\n}\n\n# Array Data Update\
    \ Methods\n\nJavaScript has several Array Methods for the items contained in the\
    \ array the make it easy to use the contents of the array.\n\n![](Images/image00451.jpeg)\n\
    \nLesson JavaScript Coding Exercise:\n\n1.  Create an array with strings\n\n2.\
    \  Create an array populated with random numeric values 0-100\n\n3.  Using the\
    \ array map() method create a new array with the value of the string array, and\
    \ its index value as the new items\n\n4.  Using the map() method create a new\
    \ array with all the numeric values from the numeric array multiplied by 2\n\n\
    5.  Using filter() return only the results that have a value of larger than 50\
    \ from the numeric array values\n\n6.  Using reduce() add all the value together\
    \ as a total return value from the numeric array values\n\n7.  Using every() check\
    \ to see if all the values are less than 150\n\n8.  Using some() check to see\
    \ if any of the values are less than 50\n\n9.  Output the new arrays into the\
    \ console to inspect them\n\n10.  Using map intake the value of the input field,\
    \ then multiply that by the number value of the items in the numeric array.  \n\
    \n11.  Using forEach() loop through all the contents of the new array from the\
    \ previous step, output the results into the html of the page.\n\nconst output\
    \ = document.querySelector('div');\n\nconst myInput = document.querySelector('input');\n\
    \nconst btn = document.querySelector('button');\n\nbtn.onclick = btnClicked;\n\
    \nmyInput.value = 10;\n\nmyInput.setAttribute('type','number');\n\nconst arr =\
    \ ['one','two','three','four','five'];\n\nconst temp1 = [];\n\nfor(let i=0;i<10;i++){\n\
    \n const ranValue = Math.floor(Math.random()*100);\n\n  temp1.push(ranValue);\n\
    \n}\n\nfunction  btnClicked(){\n\n const arr1 = arr.map((item,ind,array)=>{\n\n\
          console.log(item);\n\n return  `${item} ${ind} `;\n\n  })\n\n const arr2\
    \ = temp1.map(val=> val*2);\n\n const arr3 = temp1.filter((val)=>{\n\n return\
    \ val > 50;\n\n  });\n\n const arr4 = temp1.reduce((previous,current,index)=>{\n\
    \n      console.log(previous);\n\n      console.log(current);\n\n return previous\
    \ + current;\n\n}); // total of all the items in the array\n\n const arr5 = temp1.every((val)=>{\n\
    \n      console.log(val);\n\n return val < 150;\n\n}) //boolean on the condition\
    \ all have to be true\n\n const arr6 = temp1.some((val)=>{\n\n      console.log(val);\n\
    \n return val < 50;\n\n}) //boolean on the condition all have to be true\n\n \
    \ console.log(arr1);\n\n  console.log(arr2);\n\n  console.log(arr3);\n\n  console.log(arr4);\n\
    \n  console.log(arr5);\n\n  console.log(arr6);\n\n const arr7 = temp1.map((val)=>{\n\
    \n      console.log(val);\n\n return val * myInput.value;\n\n  })\n\n let html\
    \ = '';\n\n  arr7.forEach((ele,ind) => {\n\nhtml += `<div>${temp1[ind]} x ${myInput.value}\
    \ = ${ele}</div>`;\n\n  })\n\n  output.innerHTML = html;\n\n}\n\n# Update Array\
    \ data with Sort\n\nArray Methods for Sorting Array items can be used to update\
    \ the array items in place and change the order of those item.  Sort can also\
    \ provide a way to randomize the order or the items in the array and select random\
    \ items from the array.\n\nGet the random index value of the item from the array\
    \ and return the random item from the array."
