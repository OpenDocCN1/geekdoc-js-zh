    btn.total = 0;\nbtn.style.backgroundColor = '#'+Math.random().toString(16).slice(2,8);\n\
    btn.style.color = 'white';\nbtn.classList.add('btn');\nbtn.onclick = adder;\n\
    }\n\nconst output1 = elemaker('div',main,'');\nconst btnMain = elemaker('button',main,`All\
    \ Totals`);\nbtnMain.onclick =()=> {\n  const btns = document.querySelectorAll('.btn');\n\
    \  output1.innerHTML = '';\n  const ul = elemaker('ul',output1,'');\n  btns.forEach((ele,index)=>\n\
    \    const li = elemaker('li',ul,`${ele.textContent} = ${ele.total}`);\n    li.style.backgroundColor\
    \ = ele.style.backgroundColor;\n    li.style.color = ele.style.color;\n  })\n\
    }\n\nfunction elemaker(eleT,parent,html) {\n  const ele = document.createElement(eleT);\n\
    \  ele.innerHTML = html;\n  return parent.appendChild(ele);\n}\n\nfunction adder(e)\
    \ {\n  this.total++;\n  output.style.backgroundColor= this.style.backgroundColor;\n\
    \  output.innerHTML = `${this.textContent} :(${this.total})`;\n}\n```\n\nJavaScript\
    \ DOM 代码练习与游戏\n\n![](img/image00463.jpeg)\n\n带有 JavaScript 代码 DOM 示例的交互式动态 Web\
    \ 项目。使用常用的 DOM 方法选择并更新页面元素，并使用 JavaScript 代码添加事件监听。通过代码示例和练习学习更多 JavaScript 和\
    \ DOM。\n\n# 背景颜色表格：使用 JavaScript 创建表格\n\n此练习将构建一个交互式彩色单元格表格，点击单元格即可将其背景颜色应用到页面。此外，还有几个按钮可以更新表格单元格的背景颜色。表格将根据列和行的值进行动态生成。应用程序还将包含\
    \ 3 个交互式按钮来更新页面元素。\n\n## 如何使用 JavaScript 代码创建响应式表格。\n\n按钮点击时的动作：\n\n1. 为表格中所有的\
    \ `td` 元素添加随机背景颜色。\n2. 从上一行的元素中获取颜色值，将其应用到下一行，形成行色的向下移动。第一行将获得新的随机颜色。\n3. `MoveLeft`\
    \ 效果，点击时将获取下一个元素的背景颜色并将其应用到当前元素。表格中的最后一个元素将获得随机生成的背景颜色。\n\n![](img/image00464.jpeg)\n\
    \n## 练习：\n\n1. 为表格的行数和列数创建一个变量对象。\n2. 创建一个函数将表格添加到页面中。该函数应创建主表格元素，循环行和列并添加 `tr`\
    \ 和 `td` 页面元素。\n3. 使用 `cols` 值生成并设置单元格宽度样式，使单元格占据页面的全宽。\n4. 在向表格添加 `td` 单元格时，使用\
    \ `document.createElement('td')`，添加数字文本值，然后添加如边框和文本对齐等样式。\n5. 为 `td` 元素添加事件监听器，点击时将\
    \ `document.body` 的背景更新为与表格单元格相同的背景颜色。\n6. 创建一个生成随机颜色的函数 `Math.random().toString(16).slice(2,8)`。\n\
    7. 创建一个创建按钮的函数，在页面上添加 3 个按钮。\n8. 为第一个按钮添加事件监听器，点击时它应该选择主表格中的所有页面 `td` 单元格。在循环元素时将背景更新为随机颜色。\n\
    9. 创建第二个页面按钮，该按钮将具有颜色向下移动一行的效果。选择主表中所有的 `td` 单元格。创建一个临时数组，在循环单元格时，第一行生成随机值。将这些值添加到数组中。当移动到第二行时，从\
    \ `td` 元素的 `ind` 值中减去列数。这将给你位于上方行中元素的值。获取上方元素的背景颜色并将其添加到数组中。\n10. 一旦完成临时数组的构建，它应包含所有颜色值且有一行向下平移，现在循环该数组，并将背景颜色应用到节点列表中匹配的\
    \ `td` 元素上。\n11. 创建第三个按钮。当点击此按钮时，循环主表格中所有的 `td` 元素。将当前元素的背景更新为其右侧一个索引值的元素背景颜色。对于最后一个\
    \ `td` 单元格，添加随机背景颜色。\n\n```javascript\nconst output = document.querySelector('div');\n\
    console.log(output);\noutput.innerHTML = '';\n\nconst tabValue = {\n  rows: 5,\n\
    \  cols: 9\n}\n\nconst main = addTable(output, tabValue.rows, tabValue.cols);\n\
    const btn1 = btnMaker(output, 'Random', 'blue', 'white');\nconst btn2 = btnMaker(output,\
    \ 'MoveDown', 'red', 'white');\nconst btn3 = btnMaker(output, 'MoveLeft', 'purple',\
    \ 'white');\n\nbtn3.addEventListener('click', (e) => {\n  const tds = main.querySelectorAll('td');\n\
    \  for (let i = 0; i < tds.length; i++) {\n    console.log(tds.length, i);\n \
    \   const bgColor = (i + 1 == tds.length) ? ranColor() : tds[i + 1].style.backgroundColor;\n\
    \    console.log(bgColor);\n    tds[i].style.backgroundColor = bgColor;\n  }\n\
    })\n\nbtn1.addEventListener('click', (e) => {\n  const tds = main.querySelectorAll('td');\n\
    \  console.log(tds);\n  tds.forEach(ele => {\n    console.log(ele);\n    ele.style.backgroundColor\
    \ = ranColor();\n  })\n})\n\nbtn2.addEventListener('click', (e) => {\n  const\
    \ tds = main.querySelectorAll('td');\n  let holder = [];\n  tds.forEach((ele,\
    \ ind) => {\n    let temp = ind - tabValue.cols;\n    let tempColor = '';\n  \
    \  console.log(temp);\n    if (temp >= 0) {\n      const el = tds[temp];\n   \
    \   console.log(el);\n      tempColor = el.style.backgroundColor;\n    } else\
    \ {\n      tempColor = ranColor();\n    }\n    holder.push(tempColor);\n  })\n\
    \  console.log(holder);\n  holder.forEach((val) => {\n    tds[ind].style.backgroundColor\
    \ = val;\n  })\n})\n\nfunction ranColor() {\n  return `#Math.random().toString(16).slice(2,8)}`;\n\
    }\n\nfunction btnMaker(parent, html, clr, fntColor) {\n  const btn = document.createElement('button');\n\
    \  btn.innerHTML = html;\n  btn.style.backgroundColor = clr;\n  btn.style.color\
    \ = fntColor;\n  return parent.appendChild(btn);\n}\n\nfunction addTable(parent,\
    \ rows, cols) {\n  const tbl = document.createElement('table');\n  tbl.style.border\
    \ = '1px solid black';\n  const tbody = document.createElement('tbody');\n  tbl.append(tbody);\n\
    \  let counter = 0;\n  let wid = (100 / cols) * 100;\n  for (let y = 0; y < rows;\
    \ y++) {\n    const tr = document.createElement('tr');\n    for (let x = 0; x\
    \ < cols; x++) {\n      const td = document.createElement('td');\n      counter++;\n\
    \      td.textContent = counter;\n      td.style.width = `${wid}px`;\n      td.style.border\
    \ = '1px solid #ddd';\n      td.style.textAlign = 'center';\n      tr.append(td);\n\
    \      td.addEventListener('click', () => {\n        document.body.style.backgroundColor\
    \ = td.style.backgroundColor;\n      })\n    }\n    tbody.append(tr);\n  }\n \
    \ return parent.appendChild(tbl);\n}\n```\n\n# 元素选择练习\n\n1. 从 HTML 中选择主容器元素。\n\
    2. 使用循环在主元素中创建 20 个 `span`。\n3. 为 `span` 应用并添加样式。为元素添加事件监听器。\n4. 点击时运行一个函数获取事件目标元素。创建一个全局对象来存储选中的元素。添加一个条件检查持有元素中是否存在值。如果有，则使用\
    \ `insertBefore` 将原始元素插入到父元素中新选中的元素之前。\n"
- fmt: "\n5. If the holding element does not exist, then select the event target element\
    \ and add it as the holding element. Add some styling and an active class to the\
    \ element. This will make it easier to select if needed and visual to the user\
    \ so they know which element is the active one.\n\n6. Add a condition that will\
    \ check for the active class on elements, if found remove it from the element.\n\
    \n```javascript\nconst output = document.querySelector('div');\n\nconsole.log(output);\n\
    \noutput.innerHTML = '';\n\nconst holder = {\n  ele : null\n}\n\nfor(let i=0;i<20;i++){\n\
    \  const ele = document.createElement('span');\n  output.append(ele);\n  ele.textContent\
    \ = `${i+1} - Cell`;\n  ele.style.border = '1px solid #ddd';\n  ele.style.padding\
    \ = '10px';\n  ele.style.display = 'inline-block';\n  ele.addEventListener('click',mover);\n\
    }\n\nfunction mover(e){\n  const ele = e.target;\n  if(holder.ele){\n    const\
    \ parent = ele.parentNode;\n    parent.insertBefore(holder.ele,ele);\n    holder.ele.style.color\
    \ = 'black';\n    holder.ele.style.borderColor = '#ddd';\n    holder.ele = null;\n\
    \  }else{\n    const withActive = document.querySelector('.active');\n    if(withActive){\n\
    \      withActive.classList.remove('active');\n    }\n    holder.ele = ele;\n\
    \    holder.ele.classList.add('active');\n    holder.ele.style.color = 'red';\n\
    \    holder.ele.style.borderColor = 'red';\n  }\n}\n```\n\n# Web Page Modal Popup\
    \ Element\n\nExplore how to create a JavaScript dynamic modal from a data object.\
    \ Modals are useful information components that provide an interactive way to\
    \ show additional content. The user interacts with an element that shows the modal\
    \ on the page, the modal typically will highlight the new element and give the\
    \ appearance that it is a popup above the rest of the page content. The user can\
    \ then close the modal to hide it from view.\n\nThis exercise will demonstrate\
    \ how to create a modal from data, and dynamically add the buttons and the modals\
    \ into your webpages. Each modal can have its own data that can create and customize\
    \ them. The behaviors are the same so the code used can create the actions dynamically\
    \ for each item in the data object.\n\n![](Images/image00466.jpeg)\n\n## Exercise:\n\
    \n1. Use the HTML code as the starter code for this project.\n2. Select the main\
    \ `div` from the page.\n3. Create a data object that contains multiple items,\
    \ each with a title, body, color and font color.\n4. Loop through the items in\
    \ the array, create page buttons for each. To each add a button on the page that\
    \ can open the modal, once clicked the button should toggle the modal display\
    \ settings, from `none` to `block`. This will hide and show the modal when the\
    \ button is clicked.\n5. Create a function to generate the modal called `genModal`.\
    \ Return the main modal in that function, so that the element can be used. Add\
    \ an event listener to the element that checks if the target event element is\
    \ the same as the parent modal, then invoke the `closer` function with the modal\
    \ object.\n6. Within the `genModal` function pass the data into the function as\
    \ an argument. This data can then be used to set the `textContent` and `style`\
    \ of the modal elements.\n7. Create a main parent that will be the overlay. Add\
    \ the `overlay` class to the parent modal element.\n8. Within the modal overlay\
    \ parent, add a main modal container which will have the title, body.\n9. Within\
    \ the title create a text area element and a close button element.\n10. Add an\
    \ `addEventListener` to the close button element.\n11. Add an `x` in the modal\
    \ title, that will also close the modal when the element is clicked.\n12. Create\
    \ and apply style properties to the modal elements to create styling and structure\
    \ for the modals.\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>JavaScript</title>\n\
    \  <style>\n .overlay{\n  display:none;\n  left:0;\n  top:0;\n  width:100%;\n\
    \  height:100%;\n  background-color:rgb(0,0,0);\n  background-color:rgba(0,0,0,0.5);\n\
    \  position:fixed;\n  z-index:1;\n     }\n .main{\n  width:70%;\n  border:1px\
    \ solid black;\n  margin:auto;\n  padding:10px;\n  margin-top:100px;\n     }\n\
    \ .close{\n  color:red;\n  float:right;\n  font-size:1em;\n     }\n .close:hover,\
    \ .close:focus{\n  cursor:pointer;\n     }\n  </style>\n</head>\n<body>\n<div></div>\n\
    <script src=\"code.js\"></script>\n</body>\n</html>\n```\n\n```javascript\nconst\
    \ output = document.querySelector('div');\n\nconst data = [\n  {\n    title: 'Modal\
    \ 1',\n    body: 'This is content 1',\n    color: 'ddd',\n    font: 'black'\n\
    \  },\n  {\n    title: 'Modal 2',\n    body: 'This is content 2',\n    color:\
    \ 'yellow',\n    font: 'black'\n  },\n  {\n    title: 'Modal 3',\n    body: 'This\
    \ is content 3',\n    color: 'purple',\n    font: 'white'\n  }\n];\n\ndata.forEach((mod,\
    \ ind) => {\n  const btn = document.createElement('button');\n  btn.textContent\
    \ = `Modal ${ind+1}`;\n  output.append(btn);\n\n  const modal = genModal(mod,\
    \ ind);\n  output.append(modal);\n\n  btn.addEventListener('click', (e) => {\n\
    \    const temp = modal.style.display;\n    if (temp === 'block') {\n      modal.style.display\
    \ = 'none';\n    } else {\n      modal.style.display = 'block';\n    }\n  });\n\
    });\n\nfunction closer(ele) {\n  ele.style.display = 'none';\n}\n\nfunction genModal(mData,\
    \ id) {\n  const overlay = document.createElement('div');\n  const main = document.createElement('div');\n\
    \  const mTitle = document.createElement('h2');\n  const mBody = document.createElement('div');\n\
    \  const closeX = document.createElement('span');\n  const innerTitle = document.createElement('div');\n\
