  trans: "\n\n```javascript\narr.join(' - '); // 返回数组项的字符串表示，使用参数值作为数组项之间的分隔符。\n```\n\
    \n## 课程 JavaScript 编码练习：\n\n1. 将 HTML 元素设置为 JavaScript 对象，并为按钮添加一个 `onclick` 事件。\n\
    2. 创建 2 个数组，使用 `concat` 和 `join` 将它们合并创建第 3 个数组，将原始数组其中一个添加两次到新数组中。\n3. 尝试不同的数组方法\
    \ `push()`、`pop()`、`shift()` 和 `unshift()` 来更新数组中的数据。\n4. 使用 `splice()` 更新原始数组，并从被切出的数组项创建一个新数组。\n\
    5. 使用 `slice()` 从现有数组的片段创建一个新数组。\n6. 将数组转换为字符串，同时使用破折号作为分隔符将数组转换为字符串。\n7. 将结果输出到控制台和网页上。\n\
    \n```javascript\nconst output = document.querySelector('div');\nconst myInput\
    \ = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\nmyInput.value = 'Laurence';\n\nconst arr1 = ['One'];\n\
    const tempArr = ['onex','twox','threex'];\nconst arr = arr1.concat(tempArr,tempArr);\n\
    \nfunction btnClicked() {\n  const val = myInput.value;\n  let temp = arr.push(val,'LAST');\
    \ // 添加到数组并返回数组长度\n  console.log(temp);\n\n  temp = arr.pop(); // 移除最后一个\n  console.log(temp);\n\
    \n  temp = arr.shift(); //移除第一个项\n  console.log(temp);\n\n  temp = arr.unshift('First');\
    \ // 添加到数组开头，返回数组长度\n  console.log(temp);\n\n  console.log(arr.length);\n\n  arr[arr.length\
    \ - 1] = 'LAST';\n  //delete arr[0];\n  //console.log(arr);\n\n  arr.push('one1','two2','three3');\n\
    \  //temp = arr.splice(1);  返回从索引 1 之后的所有项组成的数组\n  //temp = arr.splice(1,3);\n\
    \  temp = arr.splice(1,3,'Add1','Add2','Add3');\n  console.log(temp);\n\n  temp\
    \ = arr.splice(3,0,'New1','New2','New3');\n  console.log(temp);\n\n  temp = arr.slice();\
    \ //复制数组为新数组\n  temp[0] = 'TEST';\n  temp = arr.slice(5); // 返回从索引 5 开始的数组项\n\
    \  temp = arr.slice(1,4); // 使用 slice 返回数组的一部分\n\n  console.clear();\n  console.log(temp);\n\
    \  console.log(arr);\n\n  const myStr = arr.toString();\n  const myStr1 = arr.join('\
    \ - ');\n\n  output.innerHTML = `<div>${myStr}</div>`;\n  console.log(arr);\n\
    \  console.log(myStr);\n  console.log(myStr1);\n}\n```\n\n## 遍历数组项\n\n遍历数组以获取内容，有一些方法如\
    \ `forEach` 方法，它们非常适合循环内容并与数组数据进行交互。\n\n遍历数组中的所有项，选择项及其值。你可以在 `for` 循环中使用数组的 `length`\
    \ 属性，或者使用数组方法 `forEach(item,index,array)` 并返回数组项的值。\n\n![](img/image00450.jpeg)\n\
    \n## 课程 JavaScript 编码练习：\n\n1. 将所有 HTML 元素引入 JavaScript 代码中。\n2. 使用 `for` 循环用新的\
    \ `divs` 更新输出元素。\n3. 使用 `document.querySelectorAll()` 选择 `div` 内部所有匹配 `divs` 的结果。\n\
    4. 使用 `forEach` 循环遍历所有新的 `div`，为每个新 `div` 添加一个值为 0 的新属性值 `val`。\n5. 为每个新 `div`\
    \ 添加点击事件，该事件将在控制台中输出该元素、索引值和 `event.target` 元素。将元素的 `val` 值递加 1。检查 `style.color`\
    \ 是否为红色，如果不是则设置为红色，否则设置为黑色。在元素文本中输出每个 `div` 被点击的次数。\n6. 在主按钮点击时，添加一个遍历所有 `arr`\
    \ 项的循环，使用 `for` 循环并将数组项的值输出到控制台。\n7. 使用 `forEach` 获取所有数组项，并将它们作为 `div` 输出到页面，在新元素中列出索引加一以及项的值。\n\
    \n```javascript\nconst output = document.querySelector('div');\nconst myInput\
    \ = document.querySelector('input');\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\nmyInput.value = 'Laurence';\n\nconst arr = [];\n\n\
    for(let i=0;i<10;i++){\n  output.innerHTML += `<div>${i} Test Div</div>`;\n}\n\
    \nconst eles = document.querySelectorAll('div div');\nconsole.log(eles);\n\neles.forEach((ele)=>{\n\
    \  console.log(ele);\n  ele.val = 0;\n  ele.onclick = (e)=>{\n    console.clear();\n\
    \    console.log(ele);\n    console.log(e.target);\n    ele.val++;\n    ele.innerText\
    \ = `${ele.val} clicked`;\n\n    if(ele.style.color == 'red'){\n      ele.style.color\
    \ = 'black';\n    }else{\n      ele.style.color = 'red';\n    }\n  }\n})\n\nbtn.onclick\
    \ = () => {\n  for(let i=0;i<arr.length;i++){\n    console.log(arr[i]);\n  }\n\
    \  arr.forEach((item,index)=>{\n    output.innerHTML += `<div>${index+1}. ${item}</div>`;\n\
    \  })\n};\n```\n\n# 数组方法\n\nJavaScript 有多种数组方法用于处理内容。\n\n![](img/image0451.jpeg)\n\
    \n## JavaScript 编码练习：\n\n1. 创建一个字符串数组。\n2. 创建一个包含随机数字的数字数组。\n3. 使用 `map()` 创建一个新的数组。\n\
    4. 使用 `map()` 方法将数值乘以 2。\n5. 使用 `filter()` 返回大于 50 的值。\n6. 使用 `reduce()` 将所有值相加得到总和。\n\
    7. 使用 `every()` 检查所有值是否小于 150。\n8. 使用 `some()` 检查是否有任何值小于 50。\n9. 将结果输出到控制台。\n\
    10. 使用 `map()` 方法将数组项到输入框。\n11. 使用 `forEach()` 遍历项并将结果输出到页面。\n\n```javascript\n\
    const output = document.querySelector('div');\nconst myInput = document.querySelector('input');\n\
    const btn = document.querySelector('button');\n\nbtn.onclick = btnClicked;\nmyInput.value\
    \ = 10;\nmyInput.setAttribute('type','number');\n\nconst arr = ['one','two','three','four','five'];\n\
    const temp1 = [];\n\nfor(let i=0;i<10;i++){\n  const ranValue = Math.floor(Math.random()*100);\n\
    \  temp1.push(ranValue);\n}\n\nfunction btnClicked() {\n  const arr1 = arr.map((item,ind,array)=>{\n\
    \    console.log(item);\n    return `${item} ${ind}`;\n  })\n\n  const arr2 =\
    \ temp1.map(val=> val*2);\n\n  const arr3 = temp1.filter((val)=>{\n    return\
    \ val > 50;\n  });\n\n  const arr4 = temp1.reduce((previous,current,index)=>{\n\
    \    console.log(previous);\n    console.log(current);\n    return previous +\
    \ current;\n  });\n\n  const arr5 = temp1.every((val)=>{\n    console.log(val);\n\
    \    return val < 150;\n  })\n\n  const arr6 = temp1.some((val)=>{\n    console.log(val);\n\
    \    return val < 50;\n  })\n\n  console.log(arr1);\n  console.log(arr2);\n  console.log(arr3);\n\
    \  console.log(arr4);\n  console.log(arr5);\n  console.log(arr6);\n\n  const arr7\
    \ = temp1.map((val)=>{\n    console.log(val);\n    return val * myInput.value;\n\
    \  })\n\n  let html = '';\n  arr7.forEach((ele,ind) => {\n    html += `<div>${temp1[ind]}\
    \ x ${myInput.value} = ${ele}</div>`;\n  })\n  output.innerHTML = html;\n}\n```\n\
    \n"
- fmt: "\n# How you can sort the arrays both in reverse and alphabetically. \n\n##\
    \ Lesson JavaScript Coding Exercise:\n\n1. Create an array with values, add to\
    \ the array random numbers.\n2. When the button is clicked create a new array\
    \ from the existing array filtering the data types with either numbers or strings.\n\
    3. Using the `array.length`, and `Math.random()` select a random index value for\
    \ an array item.\n4. When clicked, toggle either the `sort()` or `reverse()` methods\
    \ to the array sorting in place.\n5. Output the array as a string into the html\
    \ of the page.\n6. Using `sort()` add a `Math.random()` return of either positive\
    \ or negative, which will randomize the array in place.\n7. Wrap the randomizing\
    \ of the array in a loop, testing 10 iterations to see the random array orders,\
    \ output them to the html of the page.\n8. Using `forEach()` loop through all\
    \ the array items and add them to the HTML.\n\n```javascript\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nmyInput.value = 10;\n\nmyInput.setAttribute('type','number');\n\
    \nconst arr = ['one','two','three','four','five'];\n\nlet boo = true;\n\nfor(let\
    \ i=0;i<10;i++){\n  const ranValue = Math.floor(Math.random()*100);\n  arr.push(ranValue);\n\
    }\n\nconsole.log(arr);\n\nfunction btnClicked(){\n  const arr1 = arr.filter((ele)=>{\n\
    \    return typeof(ele) == 'string';\n  })\n  const ind = Math.floor(Math.random()*arr.length);\n\
    \  output.innerHTML = `Random Array Item with index of ${ind} value ${arr[ind]}`;\n\
    \  let html = '';\n  if(boo){\n    arr.sort();\n    boo = false;\n  }else{\n \
    \   arr.reverse();\n  }\n  html += `<div>${arr.toString()}</div>`;\n  for(let\
    \ i=0;i<10;i++){\n    arr.sort(()=>{\n      return Math.random() - 0.5;\n    });\n\
    \    html += `<div>${arr.toString()}</div>`;\n  }\n  arr.forEach((ele,ind)=>{\n\
    \    html += `<div>${ind} - ${ele}</div>`;\n  })\n  output.innerHTML += html;\n\
    \  console.log(arr1);\n}\n```\n\n## Find Array values\n\nJavaScript Arrays have\
    \ method to find items in the array, this exercise provides examples of how to\
    \ find array items. JavaScript has several methods that can check for values contained\
    \ within an array.\n\n## Lesson JavaScript Coding Exercise:\n\n1. Create an array\
    \ with some string and number values.\n2. Using the `arr.includes()` check if\
    \ a value from the input field is in the array.\n3. Create a variable called `html`\
    \ that can be built to return a string of the responses on the array methods.\
    \ Using a ternary operator, create a response message if the term from the input\
    \ is in the array or not.\n4. Add to the html the response for `includes`.\n5.\
    \ Create a check for the `arr.indexOf()` a value in the array, will return the\
    \ index value or -1 if it's not found. Output the result to the HTML.\n6. Find\
    \ the index value of the last item that matches, `arr.lastIndexOf()`, output the\
    \ results into the HTML.\n7. Using `find()` return the first match for a number\
    \ in the array, output the results to the HTML.\n8. Using `find()` return the\
    \ first match for the condition checking for `==` to the input value and the array\
    \ item value. If none is found it will return `undefined`. Output the response\
    \ result into the HTML.\n9. Using `find()` return the first matching result from\
    \ the array of a value larger than 10. Notice it should also include and return\
    \ the string.\n\n```javascript\nconst output = document.querySelector('div');\n\
    \nconst myInput = document.querySelector('input');\n\nconst btn = document.querySelector('button');\n\
    \nbtn.onclick = btnClicked;\n\nconst arr = ['Svekis','Laurence','100',50,10];\n\
    \nfunction btnClicked(){\n  const val = myInput.value;\n  const res = arr.includes(val);\n\
    \  const message = (res) ? `was found` : `Not Found`;\n  let html = `<h2>Search\
    \ Results for ${val}</h2>`;\n  html += `<div>${val} - ${message}</div>`;\n  html\
    \ += `<div>Includes ${res}</div>`;\n  const indexPos = arr.indexOf(val);\n  html\
    \ += `<div>IndexOf ${indexPos}</div>`;\n  const indexPosLast = arr.lastIndexOf(val);\n\
    \  html += `<div>IndexLast ${indexPosLast}</div>`;\n  const finderVal = arr.find((v)=>{\n\
    \    return typeof(v) == 'number';\n  });\n  html += `<div>Find 1 ${finderVal}</div>`;\n\
    \  const finderValP = arr.find((v)=>{\n    return v == val;\n  });\n  html +=\
    \ `<div>Find 2 ${finderValP}</div>`;\n  const finderValNum = arr.find((v)=>{\n\
    \    return v > 10;\n  });\n  html += `<div>Find 3 ${finderValNum}</div>`;\n \
    \ output.innerHTML = html;\n  console.log(res);\n  console.log(indexPos);\n  console.log(indexPosLast);\n\
    \  console.log(finderVal);\n  console.log(finderValP);\n  console.log(finderValNum);\n\
    }\n```\n\n## String Methods\n\nString methods provide way to interact with strings.\n\
    \n![](Images/image0452.jpeg)\n\n## Lesson JavaScript Coding Exercise:\n\n1. Use\
