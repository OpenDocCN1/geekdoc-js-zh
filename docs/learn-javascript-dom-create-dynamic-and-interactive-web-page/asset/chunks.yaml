    \ = temp.user;\n\n      output.innerHTML += `<div>${JSON.stringify(temp)}</div>`;\n\
    \n      myInput.value = temp.v;\n\n  }else{\n\n      output.textContent = 'Not\
    \ found';\n\n  }\n\n}\n\nfunction  btnClicked() {\n\n const valInput = myInput.value;\n\
    \n  holder.user = valInput;\n\n  holder.v = valInput;\n\n const temp = JSON.stringify(holder);\n\
    \n  localStorage.setItem('val',temp);\n\n  output.textContent = valInput;\n\n\
      output.innerHTML += `<div>${JSON.stringify(holder)}</div>`;\n\n}\n\nDynamic\
    \ Interactive Web Pages with JavaScript\n\n# JavaScript for interactive web pages\n\
    \nIntroduction to JavaScript and the DOM how to create interactive web pages with\
    \ code.  Web pages don’t need to be static, and JavaScript provides a way to update\
    \ and manipulate page elements.  Adding event listeners for web users, creates\
    \ more engagement with the content that is being presented.\n\nThe Document Object\
    \ Model (DOM) is a programming interface that can be accessed with JavaScript\
    \ to connect to web document contents. Web documents are based on HTML structure\
    \ and can be viewed in a browser that renders the HTML or as HTML code.  The HTML\
    \ code is used to construct the DOM, which will represent the HTML source that\
    \ the browser will use to construct the page.  The DOM is used to create the web\
    \ page and selecting and updating the DOM representation of the HTML code allows\
    \ JavaScript to make changes to the HTML without changing the HTML source code. \
    \ The DOM is a standard object that has the HTML elements as objects, each with\
    \ properties, methods, and events. \n\nUsing JavaScript to connect to the DOM\
    \ Object by selecting Page elements allows you to interact with them.  Explore\
    \ how to access page elements, manipulate content and properties of the page element. \
    \ With JavaScript select and update contents of the element. DOM is a tree structure\
    \ representing all the page elements and properties of those elements.\n\n![](Images/image00443.jpeg)\n\
    \nUsing JavaScript you can change HTML elements, update attributes, remove and\
    \ add HTML elements, add events. \n\nIntroduction to console.dir() document.querySelector()\
    \ document.querySelectorAll() document.getElementtextContent() property value\
    \ assignment.\n\ndocument.querySelectorAll() returns a NodeList\n\ndocument.getElementsByTagName()\
    \ and document.getElementsByClassName() returns an HTMLCollection\n\nNodes in\
    \ the DOM are referred to as all items, so everything is a node, and every node\
    \ is an object.\n\nNodeList\n\n● Items can be selected by the index value that\
    \ look like an array but are not\n\n● NodeList items can only be accessed with\
    \ their index value\n\n● returns a static NodeList\n\n● You can access the childNodes\
    \ of the list which is live\n\n● list with a length property which can be looped\
    \ through\n\n● can contain any node type\n\nHTMLCollection\n\n● Returns elements\
    \ with ID in the collection, which can be selected using the ID from the list\
    \ as well as index value.\n\n● HTMLCollection items can be accessed with a name,\
    \ index or id value.\n\n● Live collection, does not include text nodes\n\n● item\
    \ method can be used to access the elements from the list.  eles.item(0)\n\n●\
    \ list with a length property which can be looped through\n\n● contain any node\
    \ Element\n\n![](Images/image00455.jpeg)\n\nLesson Coding Exercise:\n\n1.  Create\
    \ an HTML file with page elements, include classes, and ids in the elements.\n\
    \n2.  Select the elements using various methods."
