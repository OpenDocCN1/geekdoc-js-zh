  \  margin: 0;\n    padding: 0;\n    color: rgb(128, 128, 128);\n}\ntable.calendarMonth\
  \ {\n    table-layout: fixed;\n    width: 100%;\n    height: 100%;\n    border-collapse:\
  \ collapse;\n    empty-cells: show;\n}\ntable.calendarMonth tbody {\n    user-select:\
