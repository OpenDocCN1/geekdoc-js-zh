  [content]\n在附加到提交按钮 `click` 事件的函数中，你所做的第一件事是创建一个名为 `input` 的变量，通过调用 `jQuery` 并将特殊的\
  \ `this` 关键字作为其第一个也是唯一的参数。正如本章前面提到的，当事件被触发时，`this` 指向发生事件的元素，但 `this` 并不具备 jQuery\
  \ 增强型功能。要让它具备 jQuery 功能，你只需要将 `this` 作为参数传递给 `jQuery` 即可。这就是如何让 JavaScript DOM 中的任何元素都启用\
  \ jQuery 功能的，而不仅仅是事件语境下特殊的 `this` 关键字。\n\n```\nvar input = $(this);\n```\n\n接下来，你禁用了提交按钮，这样用户就不会因为不耐烦而反复点击它，从而向你的服务器发送多次加入时事通讯的请求。\n\
  \n```\ninput.attr('disabled', true);\n```\n\n设置 `disabled` 属性的另一种方法是像这样调用 `attr()`\
  \ 方法：\n\n```\ninput.attr('disabled', 'disabled');\n```\n\n你可能更倾向于这种方法，因为从技术上讲，这也是\
  \ XHTML 规定布尔 HTML 属性的处理方式。但 jQuery 支持这两种方式：通过传递布尔值 `true` 或 `false`，或者通过传递值 `disabled`。同样，要取消\
  \ `disabled` 属性，你可以在调用时传递 `false`，例如 `attr('disabled', false)`，也可以通过调用 `removeAttr('disabled')`\
  \ 彻底移除该属性。\n\n在下一行中，你调用 `contactNewsletterForm.validate()` 来检查表单是否有效。\n\n（后续文本重复及不完整部分已按要求处理）\n\
  \n\n\n\n与事件类似，元素是以 JavaScript 关键字 `this` 的形式传递给 `each()` 的。除了 `this` 关键字外，还有另一种方法可以在传递给\
  \ `each()` 的函数内部访问元素，即通过为函数指定两个参数。第一个参数告诉你在集合中所处的位置；它是一个从零开始的计数偏移量。第二个参数是你正在处理的值或对象，它提供与\
  \ `this` 提供的数据相同的数据。下面的代码段修改了 *Example 2-2*，使其指定了这两个可选参数：\n\n```\n $('form#contactNewsletterForm').find('input,\
  \ select, textarea').each(\n            function(counter, element)\n           \
  \ {\n```\n\n同样与事件类似，以 `this` 形式传递给 `each()` 的元素默认并不是启用了 jQuery 功能的。因此，在通过 `each()`\
  \ 方法匹配的每个元素执行的匿名函数内部，你所做的第一件事就是创建一个引用该元素的变量，并让该元素启用 jQuery 功能。在这种情况下，你创建了一个名为 `node`\
  \ 的变量，这是一个易于使用的通用名称。你完全可以同样地将变量命名为 `input` 或其他更具体的名称。\n\n```\n var node = $(this);\n\
  ```\n\n现在你已经有了一个启用了 jQuery 功能的元素引用，你可以查找 HTML5 `required` 属性是否存在以检查该字段是否为必填，你通过调用\
  \ jQuery 方法 `is()` 来实现。在任何 jQuery 选择器的上下文中，`is()` 告诉你选择中的任何元素是否匹配你提供的 `is()` 的选择器。在此选择的上下文中，得益于\
  \ `each()`，该选择中只有一个元素，且该选择被赋值给变量 `node`。该选择将是四个匹配的 `<input>` 元素之一，从上到下排列。因此，`each()`\
  \ 遇到的第一个元素是 id 名为 `contactFirstName` 的 `<input>`，第二个元素将是 id 名为 `contactLastName`\
  \ 的 `<input>`，第三个是复选框，`each()` 将操作的最后一个元素是提交按钮。`is()` 的调用包含一个属性选择器：`[required]`。使用\
  \ `is()`，你是在提问：该元素是否匹配此选择器？提问问题的另一种方式是该元素是否匹配选择器：`input[required=”required”]`（当然，如果该元素是一个\
  \ `<input>` 元素的话）。`is()` 将返回一个布尔值，告诉你元素是否匹配你提供的选择器。\n\n```\n if (node.is('[required]'))\n\
  \                {\n```\n\n在这个示例的上下文中，你只需要知道元素是否为必填，这是通过使用 `is()` 询问元素是否具有 `required`\
  \ 属性来实现的。因为 `required` 是一个布尔属性，其唯一可能的值是 `required` 或者完全不存在，因此询问元素是否必填的最简单方法是使用属性选择器\
  \ `[required]`。\n\n`is()` 可用于向元素或元素集合提出任何可以用选择器表示的问题。当选择中存在多个元素时，使用 `is()` 提问的问题，如果它匹配选择中的任何元素，则结果为\
  \ `true`。如果选择器仅匹配单个元素而不匹配其他元素，结果仍然是 `true`。只有当它不匹配选择中存在的任何元素时，结果才为 `false`。\n\n\
  如果元素具有 `required` 属性，表达式 `node.is(‘[required'])` 将返回 `true`，然后程序将检查输入的值。通过调用 `val()`\
  \ 获取输入的值，这是另一个 jQuery 方法，它在后台进行一些工作，使得获取字段值变得简单得多，并根据你处理的输入字段类型自动调整其逻辑。对于 `<input>`\
  \ 元素，它返回 `value` 属性的值（无论类型如何）；对于 `<select>` 元素，它检索选中的 `<option>` 的 `value` 属性；对于\
  \ `<textarea>` 元素，它检索文本内容。\n\n```\n if (node.is('[required]'))\n               \
  \ {\n                    var value = node.val();\n                    if (!value)\n\
  \                    {\n                        hasRequiredValues = false;\n   \
  \                     return false;\n                    }\n                }\n\
  ```\n\n接下来，你对值进行一个简单的布尔表达式判断判断是否存在值。如果表达式求值为 `false`，则没有值，你用于跟踪所有提供的值是否已提供的变量 `hasRequiredValues`\
  \ 被赋值为 `false`，然后你返回 `false` 以退出后续的 `each()` 迭代。\n\n在传递给 `each()` 的函数内部，返回 `true`\
  \ 等同于编写关键字 `continue`；迭代将继续到下一个元素或项目，所以如果你处于第一个元素上，迭代将立即进入第二个元素。从函数中返回 `false` 等同于在\
  \ `for`、`while` 或 `switch` 循环中编写 `break` 关键字，迭代将完全停止。在示例的上下文中，如果这种情况发生在你第一个 `<input>`\
  \ 元素上，那么函数将不会为第二、第三或第四个元素执行。\n\n最后，在检查每个 `<input>` 元素之后，函数 `validate()` 返回 `hasRequiredValues`\
  \ 变量的值，让你的 `click` 事件明确知道所有必填值是否已提供。\n\n```\n return hasRequiredValues;\n```\n\n\
  在本节中，你通过对 `find()`、`each()`、`is()` 和 `val()` 方法的深入解释和示例，进一步地了解了 jQuery。下一节将继续介绍如何使用\
  \ jQuery 遍历 DOM 的示例，并介绍允许你在 DOM 中移动的 jQuery 方法。\n\n#### 处理元素的相对元素\n\njQuery 为你提供了一个全面的\
  \ DOM 遍历包。你可以轻松地从一个元素移动到它的兄弟元素、父元素或祖先、子元素和后代。在本节中，你将看到一个示例，介绍了如何执行所有这些操作，以及如何根据元素在选择中的数字偏移位置来限制选择，以及通过提供一个根据你不需要的内容过滤选择的选择器来限制选择的范围。本节的讨论涵盖了\
  \ jQuery API 的以下方法：\n\n- `parent()` 和 `parents()` 用于选择元素的父元素或祖先。\n- `children()`\
  \ 用于选择元素的直接子元素。\n- `siblings()` 用于选择元素周围的所有兄弟元素。\n- `prev()` 用于选择元素的直接前一个兄弟元素。\n\
  - `next()` 用于选择元素的直接后一个兄弟元素。\n- `prevAll()` 用于选择元素之前的所有兄弟元素。\n- `nextAll()` 用于选择元素之后的所有兄弟元素。\n\
  - `not()` 用于使用选择器从选择中移除元素。\n- `eq()` 用于通过提供在选择中从零开始的偏移位置，精确定位选择中的单个元素。\n\n\n\n\n\
  你也可以向上 DOM 树并选择父元素或祖先元素。在编程时，向上 DOM 树的需求通常是因为你处于一种应用程序中存在多个相同对象的情况。例如，假设你的应用程序中有多个日历。这可能是因为你提供了在月份之间切换的导航功能，而不是删除每个月份并构建新的月份，你是在应用程序中保留每个月份并在需要时在它们之间移动。如果你点击了某个月中的某一天，你可能也需要知道该点击发生在哪个月份，因此你需要从选定的日期向上遍历\
  \ DOM 树，以发现点击发生在哪个月份。这并不是你想要选择父元素或祖先元素的唯一场景。当你在一个模糊或通用元素上接收到事件，并且想要获取提供更多元数据、类名（class）、ID\
  \ 名称或其他数据的元素时，也可能会遇到这种情况。\n\n选择 `children()`的需求通常与使用本章前面介绍的 `find()` 方法的需求相似。使用哪种方法的取决于你是否知道某个元素是子元素，还是在\
  \ DOM 树的更深处。如果元素是子元素，使用 `children()` 可以为你带来一些性能优势。如果浏览器知道你只想在直接子元素池中查找，那么查找该元素就会非常快。然而，使用\
  \ `find()`，你可能是在要求浏览器检查每一个后代元素。\n\njQuery 提供了不少于五个方法来发现和处理元素的兄弟元素。无论你是需要移动到下一个兄弟元素、上一个兄弟元素、查找所有之前的兄弟元素或所有之后的兄弟元素，还是一起查找所有的兄弟元素，都有对应的情况的方法。\n\
  \n所有的 jQuery 遍历方法都具有一个特点，即向遍历方法提供一个选择器，以将遍历限制在匹配提供的选择器的元素上。\n\n这里介绍的每个方法都在下面的示例中展示。如果你下载了书的辅助材料，将在\
  \ `Chapter 2` 文件夹中找到名为 `Example 2-3` 的示例。\n\n```\n<!DOCTYPE HTML>\n<html xmlns=\"\
