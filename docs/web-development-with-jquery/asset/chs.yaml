  你通过定义一个新的匿名函数来启动此项目，该函数被赋值给 sortable 插件的自定义 `update` 事件。自定义的 sortable update 事件在每次完成排序时都会触发，因此它是会在排序发生时保存状态的最有效的方法。在匿名函数内部，你通过再次调用\
  \ `sortable()` 方法从每个 `<li>` 元素检索数据，但这次在第一个参数中指定了 `serialize` 选项。然后，在传递给 `sortable()`\
  \ 方法的第二个参数选项中，你使用 `attribute` 选项更改 jQuery UI 序列化数据的属性，并将该选项的值设置为 `data-path`。其余部分都是相同的：你使用\
  \ `expression` 选项从头到尾检索 `data-path` 属性的完整值，而不仅仅是该值中的一个子字符串。（你可以在这里使用任何正则表达式。） `key`\
  \ 选项被设置为 `categoryFiles[]`，它用于命名序列化字符串中的数据。这导致向服务器端发送了类似下面的查询字符串：\n\n```\ncategoryFiles[]=/Blog/apple/CoreImage.html\n\
  &categoryFiles[]=/Blog/php/Polymorphism.html\n&categoryFiles[]=/Blog/web/ie8_beta2.html\n\
  &category=1\n```\n\n在服务器端，你有两个 GET 参数。第一个是名为 `categoryFiles` 的数组；第二个是名为 `category`\
  \ 的整数。创建数组的语法使用的是 PHP 的语法，当然，你可能根据实际使用的服务器端语言来调整这种语法。\n\n## 总结\n\n在本章中，你学习了如何使用\
  \ jQuery UI Sortable 插件创建可排序列表。使用 Sortable 插件，你可以轻松地提供拖放排序 API。jQuery UI 提供了许多选项，供你进行精粒度的控制。\n\
  \n你学习了如何使用 `placeholder`、`cursor` 和 `opacity` 等选项来控制可排序列表的外观和感受。`placeholder` 选项接受一个类名，这允许你使用\
  \ CSS 来自定义定义排序过程中为可排序元素预留空间的外观。你还看到 `opacity` 和 `cursor` 选项都接受与 CSS `opacity` 和\
  \ `cursor` 属性相同的值。\n\n你看到了如何使用 `connectWith` 选项将多个列表连接在一起，你提供一个选择器，用指定你想让该可排序列表与哪个列表交换项目。`connectWith`\
  \ 选项创建了一个到另一个列表的单向链接，这意味着你只能将项目拖到另一个列表，而不能拖回原始列表。要创建双向链接，你可以在另一个列表中也添加 `connectWith`\
  \ 选项，并带有引用第一个列表的选择器。\n\n你还学习了如何保存排序列表的状态，这也是通过 `sortable()` 方法完成的。在第一个参数中，你提供字符串\
  \ `'serialize'`。在在第二个参数中，你可以提供决定序列化如何工作的选项。例如，如果你想获取 `id` 属性以外的任何属性的值，则提供 `attribute`\
  \ 选项。你可以使用的另一个选项是 `expression` 选项，它接受一个 JavaScript 正则表达式表达式作为值。然后，key` 选项用于命名序列化的数据。\n\
  \n你还学习了如何为可排序列表提供 `update` 选项，它接受一个在排序完成后执行的回调函数。\n\n## 练习\n\n1. 你使用什么方法来让列表变得可排序？\n\
  2. 你为 `placeholder` 选项提供什么类型的值？\n3. `placeholder` 选项的目的是什么？\n4. 如果你想更改在排序过程中显示的光标，你会使用哪个选项？\n\
  5. `helper` 选项的目的是什么？\n6. 你使用哪个选项将多个可排序列表连接在一起？\n7. 你为 `connectWith` 选项提供什么类型的值？\n\
  8. 如何在每次排序发生后保存可排序列表的状态？\n\n# 第 14 章：可选性 (Selectable)\n\n本章介绍了 jQuery UI Selectable\
  \ 插件。Selectable 插件填充了 UI 功能中的一个空白，这个空白就是你需要通过画框来做出选择的场合。之所以说这是一个空白，是因为你可能在应用程序中不会频繁使用此功能。通过画框进行选择可能是你可能在操作系统的文件管理器或像\
  \ Photoshop 这样的图形编辑器中执行过的几次。\n\n尽管如此，当需要出现时，Selectable 插件仍然很有用的，在本章中你将看到该插件的至少一个实际应用：你在第\
  \ 10 章“滚动条”中开始的 Mac OS X Finder 克隆程序的后续工作。\n\n## 介绍 Selectable 插件\n\nSelectable\
  \ 插件的工作原理与第 13 章“Sortable”介绍的 Sortable 插件以及所有 jQuery UI 插件类似，正如你现在已经熟悉的，它们共享一个清晰且一致的\
  \ API，且在插件之间的实现方式非常相似。\n\n要将元素变为 Selectable 元素，你可以在任何元素上调用 `selectable()` 方法。以下文档出现在\
  \ `www.wrox.com/go/webdevwithjquery`(http://www.wrox.com/go/webdevwithjquery) 的源材料中的示例\
  \ 14-1 中，演示了该插件：\n\n\n\n\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
