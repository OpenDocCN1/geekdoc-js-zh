  \        }\n    },\n```\n\n在 `openProgressDialogue()` 方法中，你将 `path` 参数（指示你想将文件上传到的路径）复制给\
  \ `this.path`。你通过对类名为 `finderDragAndDropDialogue` 的 `<div>` 元素调用 `fadeIn('fast')`\
