  \n## 总结\n\n本章介绍了与遍历和处理数组相关的方法。\n\n你学习了 `each()` 方法在遍历数组、对象或集合时，相比 `for` 结构或 `for/in`\
  \ 结构更简洁、更易用。你学习了如何通过返回布尔值在 `each()` 方法中模拟 `break` 和 `continue` 关键字。你学习了 `each()`\
  \ 可以直接调用，也可以链式用于集合。\n\n你学习了如何使用 `filter()` 方法通过选择器或回调函数来过滤集合。数组可以使用 jQuery 的 `grep()`\
  \ 方法进行过滤，该方法必须直接调用。\n\n你学习了如何将一个数组映射到另一个数组，以及如何使用 `map()` 方法将集合映射到数组。最后，你学习了 jQuery\
  \ 的多种数组工具方法。`$.makeArray()`可以将任何数据转换为真正的数组。$.inArray()` 可以查找值在数组中的位置（从零开始偏移），其工作方式与\
  \ JavaScript 的 `indexOf()` 方法相同，如果值不存在，则返回 `–1`（负一）。$.merge()` 将两个独立的数组合并成一个数组。\n\
  \n## 练习题\n\n1. 如果你想使用 jQuery 的 `each()` 方法遍历以下元素集合，JavaScript 代码应该是什么样的？\n\n```javascript\n\
  nodes = document.getElementsByTagName('div');\n```\n\n2. 在传递给 jQuery 的 `each()`\
  \ 方法的回调函数内部，你会编写什么语句来模拟 `break` 语句？\n\n3. 使用 `filter()` 过滤集合时，向 `filter()` 方法提供选择器会发生什么？\n\
  \n4. 使用回调函数通过 `filter()` 过滤集合时，返回 `true` 会怎样？\n\n5. 给 jQuery 的 `grep()` 方法的回调函数必须返回什么值才能将项目保留在数组中？\n\
  \n6 传递给 `map()` 方法的回调函数所返回的值会发生什么？\n\n\n\n\n\n7. 当 jQuery 的 `$.inArray()` 方法返回 `–1`（负一）时意味着什么？\n\
  \n# 第 6 章：CSS\n\n在 JavaScript 中处理 CSS 时，存在一些细微的冗余和不一致之处，此时 jQuery 可以提供帮助。jQuery\
  \ 让从 JavaScript 操作 CSS 变得更加简单。jQuery 的方法允许你一次性定义多个 CSS 属性的样式，或者一次定义一个 CSS 属性。但你不需要一个元素一个地设置\
  \ CSS 属性，而是一次性为一个或多个元素设置样式。\n\n正如第 4 章“操作内容和属性”以及第 1 章“jQuery 简介”中提到的，避免将样式（CSS）与行为（JavaScript）以及结构（HTML）混合通常是一种良好的做法。你希望将\
  \ CSS、JavaScript 和 HTML 尽可能清晰地划分到各自的文档中。\n\n然而，在某些情况下，将表现引入 JavaScript 编程中是不可避免的；例如，在你到达之前，这些工作可能已经以错误或更难以维护的方式完成了。在这些情况下，样式是动态变化的，以至于将\
  \ CSS 仅保留在样式表中而不直接通过 JavaScript 编程修改样式是不切实际且不合理的。本章介绍了 jQuery 提供的这些，它们让你能够处理样式表属性和值。\n\
  \n## 使用 CSS 属性\n\n你不需要像可能习惯于使用传统 JavaScript 那样去折腾 `style` 属性，当你想要使用 jQuery 访问或修改样式信息时，你应该使用\
  \ jQuery 的 `css()` 方法。你可以通过三种不同的方式使用 `css()` 方法：\n\n*   返回选择器匹配到的第一个元素的属性值\n*  \
  \ 在一个或多个元素上设置属性的值\n*   在一个或多个元素上设置多个属性\n\n当你仅仅想要获取某个元素的属性值时，可以这样做：\n\n```javascript\n\
  var backgroundColor = $('div').css('backgroundColor');\n```\n\n请注意，由于你是通过 JavaScript\
  \ 字符串访问属性的，因此你可以选择使用驼峰法（camelCase）或像样式表中那样指定带连字符的属性名。这种写法也是有效的：\n\n```javascript\n\
  var backgroundColor = $('div').css('background-color');\n```\n\n在进行选择后，你通过链式调用选择器上的\
  \ `css()` 方法，并传入你想要获取值的属性。此处的代码段返回选择器中第一个 `<div>` 元素的 `backgroundColor`，因此如果文档中存在五个\
  \ `<div>` 元素，前面的代码将返回第一个元素的 `background-color`。\n\n如果你想检索多个属性，可以指定一个包含要检索属性的数组，并从元素中获取一个属性/值对的对象。\n\
  \n```javascript\nvar properties = $('div').css([\n    'background-color',\n    'color',\n\
  \    'padding',\n    'box-shadow'\n]);\n```\n\n上例示例返回了一个包含指定属性的对象。记住，如果你想知道变量包含什么值，可以使用\
  \ `console.log()` 方法将变量的内容打印到 JavaScript 控制台。\n\n如果你想设置单个属性的值，可以这样做：\n\n```javascript\n\
  $('div').css('background-color', 'lightblue');\n```\n\n在在上的示例中，文档中所有 `<div>` 元素的\
  \ `background-color` 都被设置为 `lightblue`。\n\n为多个元素设置多个属性可以这样做：\n\n```javascript\n\
  $('div').css({\n    backgroundColor : 'lightblue',\n    border : '1px solid lightgrey',\n\
  \    padding : '5px'\n});\n```\n\n或者这样：\n\n```javascript\n$('div').css({\n    'background-color'\
  \ : 'lightblue',\n    border : '1px solid lightgrey',\n    padding : '5px'\n});\n\
  ```\n\n将一个带有键值对的字面量对象传递给 `css()` 方法。在上例中，文档中所有 `<div>` 元素的 `background-color` 被设置为\
  \ `lightblue`，`border` 被设置为 `1px solid lightgrey`，`padding` 被设置为 `5px`。你也可以这样使用带连字符的属性名，但必须对任何包含连字符的属性名加上引号。\n\
  \n## jQuery 伪类\n\n在 CSS 中，伪类标记了一种条件或状态。例如，`:hover` 伪类用于在鼠标光标悬停在元素上时进行样式设置。你为 `:hover`\
  \ 状态指定的样式仅在鼠标光留在元素上方时生效。jQuery 添加了一些在 JavaScript 世界比在 CSS 世界更有意义的伪类。\n\njQuery 提供的某些伪类在\
  \ CSS 中是不行的。例如，jQuery 的 `:parent` 伪类将选择器从一个或多个元素移动到这些元素的父元素。由于增量渲染规则，这在 CSS 中是无法实现的。样式表必须在下载到正在创建的\
  \ DOM 时被应用，因为 DOM 可能也在下载中。由于增量渲染规则（这是浏览器加载页面看起来极快的原因之一），在 DOM 中向后移动构成了技术上的挑战，类似于逆转河流的方向。如果一切的构建都是为了向一个方向（从下到上）流动的，那么从顶部到移动就会引入障碍、阻碍和潜在的故障。因此，W3C\
  \ 的 CSS 工作组对引入任何类型的父级或祖先选择器一直持保留态度。\n\n然而，在 JavaScript 中没有这种限制。在你对文档操作之前，你可能已经在等待\
  \ DOM 以及相关的样式表的加载了。\n\n## 获取外部尺寸\n\n在传统 JavaScript 中，当你想要获取元素的宽度（包括 CSS 宽度以及边框宽度和内边距宽度）时，你使用\
  \ `offsetWidth` 属性。使用 jQuery 时，调用 `outerWidth()` 方法即可获取这些信息，它提供了选择器中第一个元素的 `offsetWidth`。这为你提供了包含宽度、边框和内边角的像素测量。同样，`outerHeight()`\
  \ 方法对高度执行相同的操作；它包含了 CSS 高度、内边距和边框高度。\n\n为了演示如何使用 `css()`、`outerWidth()` 和 `outerHeight()`\
  \ 方法，下面的示例——*示例 6-1*，向你展示如何创建一个自定义上下文菜单，利用这些方法设置自定义上下文菜单在文档中的位置。*上下文菜单*（*context\
  \ menu*）是你点击三键鼠标的右键、在 Mac 上使用双指轻点手势、或在 Mac 上按住 `Ctrl` 键并点击时浏览器提供的菜单。由于不同操作系统产生上下文菜单的差异，后文将产生上下文菜单的行为称为*上下文点击*（*contextual\
  \ click*）。该菜单会在你鼠标光标所在弹出。你从以下 XHTML 开始：\n\n```html\n<!DOCTYPE HTML>\n<html lang='en'>\n\
  \    <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge' />\n \
  \       <meta charset='utf-8' />\n        <title>Context Menu Example</title>\n\
  \        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 6-1.js'></script>\n        <link href='Example 6-1.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <h4>Context Menu Example</h4>\n\
  \        <div id='contextMenu'>\n        </div>\n    </body>\n</html>\n```\n\n上标记标记使用以下样式表进行样式化：\n\
  \n```css\nbody {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color:\
  \ rgb(50, 50, 50);\n    margin: 0;\n    padding: 0 10px;\n}\ndiv#contextMenu {\n\
  \    width: 150px;\n    height: 150px;\n    background: yellowgreen;\n    border:\
  \ 1px solid gold;\n    padding: 10px;\n    position: absolute;\n    left: 0;\n \
  \   right: 0;\n    display: none;\n}\n```\n\n\n\n\n以下 JavaScript 定义了启用右键菜单功能的行为：\n\
  \n```javascript\n$(document).ready(\n    function()\n    {\n        var contextMenuOn\
  \ = false;\n        $(document).on(\n            'contextmenu',\n            function(event)\n\
  \            {\n                event.preventDefault();\n                var contextMenu\
  \ = $('div#contextMenu');\n                contextMenu.show();\n               \
  \ // The following bit gets the dimensions of the viewport \n                //\
  \ Thanks to quirksmode.org\n                var vpx, vpy;\n                if (self.innerHeight)\n\
  \                {\n                    // all except Explorer\n               \
  \     vpx = self.innerWidth;\n                    vpy = self.innerHeight;\n    \
  \            }\n                else if (document.documentElement &&\n         \
  \                document.documentElement.clientHeight)\n                {\n   \
  \                 // Explorer 6 Strict Mode\n                    vpx = document.documentElement.clientWidth;\n\
  \                    vpy = document.documentElement.clientHeight;\n            \
  \    }\n                else if (document.body)\n                {\n           \
  \        // other Explorers\n                   vpx = document.body.clientWidth;\n\
  \                   vpy = document.body.clientHeight;\n                }\n     \
  \           // Reset offset values to their defaults\n                contextMenu.css({\n\
  \                    top : 'auto',\n                    right : 'auto',\n      \
  \              bottom : 'auto',\n                    left : 'auto'\n           \
  \     });\n                // If the height or width of the context menu is greater\
  \ than\n                // the amount of pixels from the point of click to the right\
  \ or\n                // bottom edge of the viewport adjust the offset accordingly\n\
  \                if (contextMenu.outerHeight() > (vpy - event.pageY))\n        \
  \        {\n                    contextMenu.css('bottom', (vpy - event.pageY) +\
  \ 'px');\n                }\n                else\n                {\n         \
  \           contextMenu.css('top', event.pageY + 'px');\n                }\n   \
  \             if (contextMenu.outerWidth() > (vpx - event.pageX))\n            \
  \    {\n                    contextMenu.css('right',  (vpx - event.pageX) + 'px');\n\
  \                }\n                else\n                {\n                  \
  \  contextMenu.css('left', event.pageX + 'px');\n                }\n           \
  \ }\n        );\n        $('div#contextMenu').hover(\n            function()\n \
  \           {\n                contextMenuOn = true;\n            },\n         \
  \   function()\n            {\n                contextMenuOn = false;\n        \
  \    }\n        );\n        $(document).mousedown(\n            function()\n   \
  \         {\n                if (!contextMenuOn)\n                {\n          \
  \          $('div#contextMenu').hide();\n                }\n            }\n    \
  \    );\n    }\n);\n```\n\n上述示例产生了类似于图 6.1 的输出。\n\n![image](img/c06f001.jpg)\n\n\
  图 6.1\n\n在我们解释此示例中的概念之前，请考虑这一点：虽然替换浏览器提供的右键菜单可以提供有用的功能，让你的 Web 应用程序看起来和感觉更像桌面应用程序，但对于选择调用自定义右键菜单功能的场景应该保持谨慎。浏览器用户也频繁使用右键菜单来执行简单操作，例如从当前位置前进或后退、刷新当前页面或执行与其他使用浏览器相关的有用任务。但如果你的\
  \ Web 应用程序肆莽地接管了右键菜单，你就有疏远或骚扰用户群风险，因为你的应用程序阻止了用户以其正常方式访问和操作浏览器。此外，禁用浏览器的右键菜单并不能阻止用户查看应用程序的源代码，因为他们仍然可以进入浏览器的主菜单并点击“查看源代码”选项。\n\
  \n更老练的用户可以通过禁用 JavaScript 来绕过它，甚至通过其他手段直接访问你的源代码，例如通过浏览器缓存，或者直接从命令行或脚本从你的网站访问源代码。如果你出于此考虑禁用右键菜单，你可能需要重新考虑向公众发布你的\
  \ Web 应用程序，因为这种防止访问网站源代码的方法是无效的，并且有许多绕过方法。请记住，你放在 Web 上的内容在设计上就是为了供公众消费并传输到位于各种平台上的各种浏览器。需要记住的关键点是，渲染你的标记和执行你的\
  \ JavaScript 是完全可选的。\n\n尽管如此，上述示例使用了一个具有完美正方形尺寸的 `<div>` 来代替浏览器的默认右键菜单。当你对文档进行上下文点击（浏览器窗口内的任何位置）时，作为替代右键菜单的\
  \ `<div>` 就会出现，并根据点击的位置进行定位。\n\n首先，你设置了当用户访问右键菜单时触发的事件。这是使用 jQuery 的 `on()` 方法完成的，因为\
  \ jQuery 没有提供 `contextmenu()` 方法。还应该注意，`contextmenu` 事件在 Firefox 中是可以禁用的；而在那里是默认开启的。\n\
  \n因此，到目前为止的代码在用户尝试用鼠标光标在文档窗口内访问右键菜单时禁用了浏览器的默认右键菜单：\n\n```javascript\n $(document).on(\n\
  \            'contextmenu',\n            function(event)\n            {\n      \
  \          event.preventDefault();\n```\n\n接下来，选择作为右键菜单的 `<div>` 元素并将其给变量 `contextMenu`，然后使用\
  \ jQuery 的 `show()` 方法使该 `<div>` 元素可见。\n\n```javascript\n var contextMenu = $('div#contextMenu');\n\
  \                contextMenu.show();\n```\n\n当你创建自己的右键菜单时，你希望右键菜单的位置根据其在浏览器窗口中访问的位置而改变。如果用户在窗口的左侧和顶部访问右键菜单，你希望右键菜单从左侧和上方定位。如果用户从窗口的右侧和底部访问右键菜单，那么你希望右键菜单智能地从右侧和底部重新定位，并且在不遮挡右键菜单任何部分的情况下完成。\n\
  \n为了让右键菜单能够根据访问的位置动态重新定位，你需要进行一些数学计算。进行该计算你需要的第一部分数据是视口的尺寸。使用视口尺寸来帮助确定右键菜单相对于用户访问的位置应该如何定位。遗憾的是，获取视口尺寸是边缘领域之一，不同浏览器实现实现相同功能的方法不同，且\
  \ jQuery 并没有提供一个整洁、统一的方法来解决这种特定的差异。今天这不再是一个困扰了，因为最近版本的 Internet Explorer 已经更加符合定义的标准。以下代码根据浏览器的实现智能地获取视口尺寸：\n\
  \n\n\n\n\n```\n // The following bit gets the dimensions of the viewport\n     \
  \           // Thanks to quirksmode.org\n                var vpx, vpy;\n       \
  \         if (self.innerHeight)\n                {\n                    // all except\
  \ Explorer\n                    vpx = self.innerWidth;\n                    vpy\
  \ = self.innerHeight;\n                }\n                else if (document.documentElement\
  \ &&\n                         document.documentElement.clientHeight)\n        \
  \        {\n                    // Explorer 6 Strict Mode\n                    vpx\
  \ = document.documentElement.clientWidth;\n                    vpy = document.documentElement.clientHeight;\n\
  \                }\n                else if (document.body)\n                {\n\
  \                   // other Explorers\n                   vpx = document.body.clientWidth;\n\
  \                   vpy = document.body.clientHeight;\n                }\n     \
  \           // Reset offset values to their defaults\n                contextMenu.css({\n\
  \                    top : 'auto',\n                    right : 'auto',\n      \
  \              bottom : 'auto',\n                    left : 'auto'\n           \
  \     });\n```\n\n在实际定位右键菜单之前，你需要将右键菜单的偏移位置重置为默认值。四个偏移都必须重置，因为接下来的代码部分将至少两个偏移属性设置为正确值，而设置的那两个属性取决于用户访问右键菜单的位置。例如，你不希望用户上一次访问右键菜单时设置的位置一直持续到这次，因为那可能会导致冲突。要重置每个偏移位置，你使用\
  \ jQuery 的 `css()` 方法将 `top`、`right`、`bottom` 和 `left` 偏移属性设置回每个属性的默认值 `auto`。\n\
  \n```\n // Reset offset values to their defaults\n                contextMenu.css({\n\
  \                    top : 'auto',\n                    right : 'auto',\n      \
  \              bottom : 'auto',\n                    left : 'auto'\n           \
  \     });\n```\n\n现在你已经准备好通过数学方法确定右键菜单的正确位置了。为了获得正确的位置，你需要知道用于菜单的 `<div>` 元素的 `outerHeight()`\
  \ 是否超过了浏览器视口高度（由变量 `vpy` 指定）减去相对于文档的鼠标光标位置垂直坐标（由 `event.pageY` 提供）。如果 `outerHeight()`\
  \ 大于此计算结果，意味着菜单应该从 `bottom` 定位，而不是从 `top` 定位；否则菜单会被裁剪。\n\n```\n // If the height\
  \ or width of the context menu is greater than\n                // the amount of\
  \ pixels from the point of click to the right\n                // or bottom edge\
  \ of the viewport adjust the offset accordingly\n                if (contextMenu.outerHeight()\
  \ > (vpy - event.pageY))\n                {\n                    contextMenu.css('bottom',\
  \ (vpy - event.pageY) + 'px');\n                }\n                else\n      \
  \          {\n                    contextMenu.css('top', event.pageY + 'px');\n\
  \                }\n```\n\n水平部分也进行相同的计算。如果菜单的 `outerWidth()` 大于视口宽度（由变量 `vpx` 指定）减去相对于文档的鼠标光标位置水平坐标（由\
  \ `event.pageX` 提供），菜单应该从 `right` 定位，而不是从 `left` 定位；否则菜单会被水平裁剪。\n\n```\n if (contextMenu.outerWidth()\
  \ > (vpx - event.pageX))\n                {\n                    contextMenu.css('right',\
  \  (vpx - event.pageX) + 'px');\n                }\n                else\n     \
  \           {\n                    contextMenu.css('left', event.pageX + 'px');\n\
  \                }\n```\n\n以上就是根据用户在文档中点击的位置正确定位右键菜单的所有操作。额外的代码处理了在正确时机显示和隐藏右键菜单。在文档开头，你声明了以下变量：\n\
  \n```\n var contextMenuOn = false;\n```\n\n前面的变量用于跟踪当右键菜单激活时，用户的鼠标光标是否位于菜单上方。当用户的鼠标光标离开右键菜单时，该变量被设置为\
  \ `false`；当用户的鼠标光标进入菜单时，该变量被设置为 `true`。这个布尔值随后被用于在用户点击菜单以外的区域时关闭菜单，并在用户点击菜单本身时保持菜单激活。\n\
  \n以下代码通过向 jQuery 的 `hover()` 方法传递两个事件处理器，处理了将 `contextMenuOn` 变量设置为 `true` 或 `false`\
  \ 的部分：\n\n```\n $('div#contextMenu').hover(\n            function()\n          \
  \  {\n                contextMenuOn = true;\n            },\n            function()\n\
  \            {\n                contextMenuOn = false;\n            }\n        );\n\
  ```\n\n然后，下面的代码在用户点击菜单外任何地方时隐藏菜单（因为此时变量为 `false`），并在用户实际点击菜单时保持开启。\n\n```\n $(document).mousedown(\n\
  \            function()\n            {\n                if (!contextMenuOn)\n  \
  \              {\n                    $('div#contextMenu').hide();\n           \
  \     }\n            }\n        );\n```\n\njQuery 与 CSS 相关的 API 文档见 附录 B 和 附录 H。\n\
  \n## 总结\n\n在本章中，你学习了如何使用 jQuery 的 `css()` 方法获取元素的 CSS 属性值。你还学习了如何使用相同的 `css()` 方法操作元素的样式，这可以通过传递属性和值来实现。\n\
  \n## 练习题\n\n1. 如果你想使用 jQuery 获取 `<div>` 元素的 `color` 属性值，你会使用什么脚本？\n\n2. 如果你想使用 jQuery\
  \ 设置网页的背景颜色，你会使用什么代码？\n\n3. 如果你需要使用 jQuery 为一组 `<div>` 元素设置内边距、外边距和边框，你的代码应该是怎样的样的？\n\
  \n4. 返回元素包含边框和内边距像素宽度的 jQuery 方法称为什么？\n\n5. 如果你想使用 jQuery 获取 `<div>` 元素包含边框、内边距和外边距的像素高度，你的代码应该是怎样的？\n\
  \n AJAX\n\n`AJAX` 是一种允许你通过 JavaScript 发起任意 HTTP 请求以获取新数据而无需重新加载文档的技术。AJAX 代表“异步\
  \ JavaScript 和 XML”。不过，这个名称具有误导性，因为你并不一定要使用 XML，你的请求也不一定是异步的。你可以使用同步请求（一种会导致代码暂停执行直到从服务器接收答案的请求），且数据格式可以是\
  \ JSON。XML 只是你用于从服务器传输数据到客户端 JavaScript 的多种可能格式之一。\n\n\n\n\n通过 AJAX，你可以让 Web 文档的行为不再像文档，而更像是完全自包含的桌面应用程序。对于基于\
  \ Web 的应用程序，更新要容易传播得多，因为每个人在下次访问网站时都会立即进行升级。公司不再需要担心维护遗留软件和用户——对于基于 Web 的应用程序，所有人都会被推送到最新版本。用户访问这些应用程序也变得更加容易。因为不需要在每个需要使用程序的电脑上进行单独安装，只需要在性能中等偏硬件上运行一个功能良好的浏览器即可。浏览器正努力进一步模糊桌面应用程序与基于\
  \ Web 的应用程序之间的界限，因为像 Firefox 和 Google 的 Chrome 这样的浏览器使得通过在用户的桌面、程序坞（dock）、开始菜单或快速启动栏上放置图标，让基于\
  \ Web 的应用程序作为桌面应用程序变得更加简单。在 Firefox 中，此功能是实验性的，但在 Chrome 中，该功能已经成为现实。此外还有 Adobe\
  \ 的 AIR 运行时，它允许你使用 Web 标准开发桌面应用程序。由于 AIR 构建在 WebKit 之上——WebKit 是 Safari、iOS 等使用的渲染引擎——因此\
  \ AIR 可以使用健壮且符合标准的渲染引擎创建复杂的、高级桌面应用程序。所以，如果这些公司对此有何见解，基于 Web 的应用程序将变得越来越流行，并日益接管曾经由桌面应用程序提供的任务。\n\
  \n基于 Web 的应用程序开发的另一个优势（某些人可能认为这并不光）是，基于 Web 的应用程序对盗版免疫，至少在传统意义上如此。你无法在不付费的情况下获得\
  \ Web 应用的服务，因为如果不付费，可以简单将用户锁定在之外，并且应用程序的使用可以限制为单登录会话。尽管到为止，这方面还没有太大问题，因为基于 Web 的应用程序通常由广告支持以实现免费。\n\
  \n另一个优势仍然是，与自包含的桌面应用程序相比，你可以让基于 Web 的应用程序支持得多的操作系统和浏览器。你可以针对 Safari、Chrome、Firefox、Internet\
  \ Explorer 和 Opera，轻松触达超过 99% 的浏览受众。像 jQuery 这样的框架使得这一切变得更加简单，因为它们消除了许多浏览器不一致和令人头疼的问题，这些问题本可能成为跨浏览器开发的障碍。\n\
  \n然而，基于 Web 的应用程序也有一些缺点，公平的讨论应该包含这些缺点。由于基于 Web 的应用程序可以很容易被更改，某些用户会抱怨，有些人甚至可能拒绝适应。此外，基于\
  \ Web 的应用程序的速度远未达到原生编程提供的速度。速度是一个问题，因为 JavaScript 是一种解释型语言，即使大多数浏览器都能快速将 JavaScript\
  \ 转换为机器码并进行缓存（这极大提高了速度），JavaScript（连同 (X)HTML 和 CSS）仍然面临网络延迟问题，并且作为一种即时处理的解释型语言（与你每天使用的大多数桌面应用程序那样经过编译相比）仍然存在劣势。在移动端，速度问题仍然足以阻碍大多数人转向基于\
  \ Web 的语言和浏览器的开发；相反，大多数移动开发是使用原生编译语言，如 Objective-C、Swift、Java 或 .NET 完成的。最后，作为一种\
  \ Web 技术，网络或服务器问题可能会完全中断用户对应用程序的访问，尽管在某些开发场景中，网络中断是可以规避的。\n\n尽管如此，AJAX 已成为 Web 开发中一个强大且日益本质的组件；本章涵盖了\
  \ jQuery 用于发送 AJAX 请求的内置方法。正如你所预期的，jQuery 将一些中等繁琐且复杂的内容简化为更简单、更易理解的 API，以便你可以更快地开始编写具备\
  \ AJAX 能力的 Web 应用。\n\n## 发起服务器请求\n\n你可能已经知道，Web 是通过名为 HTTP 的协议工作的。当你导航到一个 Web 页面时，你的浏览器会使用\
  \ HTTP 通信协议向运行 Apache、nginx、Microsoft IIS 或其他 HTTP 服务器软件的远程 HTTP 服务器发送请求。AJAX 让你能够程序化地发出这些\
  \ HTTP 请求，而无需重新加载整个 Web 页面。当 JavaScript 发起请求并接收响应后，你就可以获取数据，并根据收到的响应操纵用户面前的内容。使用\
  \ HTTP 协议，有很多方法可以从服务器请求数据。HTTP 服务器和客户端之间传输信息的常用方式是 GET 和 POST 方法，尽管还有许多方法可以作为 RESTful\
  \ 服务的一部分实现。如果你的服务器或应用程序配置为支持 RESTful 调用，你还将拥有如 PUT 和 DELETE 等方法，我将在“发送 REST 请求”章节中讨论它们。在查看\
  \ REST 之前，你应该先熟悉使用简单的 GET 或 POST 请求传输 HTTP 请求的最常用方法。\n\n### GET 和 POST 之间有什么区别？\n\
  \n从表面上看，GET 和 POST 方法看起来是相同的：两者都允许你请求 Web 页面并随请求发送数据。在大多数情况下，对于 AJAX 请求，你想使用 GET\
  \ 方法，因为从 AJAX 相关的性能角度来看它稍微快一点，但还有其他你应该注意的差异，这些差异涉及这两种方法之间的语义差异，以及技术和安全差异。以下概述了这些差异：\n\
  \n- GET 方法旨在对任何状态都不产生实质性、持久影响的请求。（HTTP 规范将此类请求称为 `safe`（安全的）。）例如，当你发起请求并仅仅是从数据库中检索数据时，GET\
  \ 非常适合此类请求。如果请求通过插入、更新或删除导致数据库发生变化——例如，在管理内容、下单或上传数据时——则 POST 方法最为合适。然而，这种差异仅仅是语义上的。\n\
  \n- 使用 POST 方法会导致，当用户使用浏览器的“后退”按钮返回已提交的表单时，浏览器会自动防止重新提交表单，因为 `POST` 方法旨在用于发生数据操作的情况。这是一个为了防止重复提交表单而设置的技术差异。但这种自动防止是无效的，因为你仍然需要设计服务器端程序来考虑可能的重复提交……任何可能发生的错误都会发生！用户可能会不耐烦多次点击提交按钮或刷新已提交的表单，忽略器的警告。然而，GET\
  \ 方法不提供防止重复提交的自动保护。这种差异在 AJAX 编程中大多无关紧要，因为你不专门在程序中设计该功能，否则用户无法重新提交 POST 请求。\n\n\n\
  \n\n*   `GET` 方法对请求长度的限制远少于 `POST` 方法。这种差异是技术层面的，可能会对你的应用程序产生影响。`GET` 请求允许的长度限制在浏览器之间有所不同，但\
  \ `RFC 2068` 规定，服务器对于依赖大于 255 字节的 URI 长度应当谨慎。由于 `GET` 请求的数据是作为 URI（网页地址）的一部分包含的，因此\
  \ `GET` 请求实际上受到浏览器支持的 URI 长度限制。Internet Explorer 可以支持长达 2,083 个字符的 URL，这已经长得离谱了。然而，`POST`\
  \ 方法在理论上除了你的服务器配置允许接受的限制外，对长度没有任何限制。例如，`PHP`（一种服务器端语言）默认配置为接受大小为 8 MB 或更小的 `POST`\
  \ 请求。此设置以及其他设置（例如脚本可以执行多长时间以及它可以消耗多少内存）共同决定了在该服务器端语言的语境下，你的 `POST` 请求可以有多大。无疑其他服务器端语言也有类似的配置设置；但在客户端，除了客户端硬件、网络和服务器能力的限制外，`POST`\
  \ 请求没有硬性限制。\n\n*   `POST` 和 `GET` 方法可以使用不同的方式编码，这同样是技术上的差异。我不会详细介绍这种差异，因为它超出了本书的范围。当你想要通过\
  \ `POST` 方法上传文件时，这种差异就会适用；我在第 11 章“HTML5 拖放与”中讨论了如何通过 `POST` 执行文件上传。然而，正如你在第 11\
  \ 章中所看到的，当通过浏览器提供的 `AJAX` API 进行文件上传时，浏览器会为你处理编码。\n\n对于源自 `AJAX` 脚本发起的请求，`POST`\
  \ 和 `GET` 方法之间的区别大多是无关紧要。因为用户不参与请求，自动保护部分变得不再必要，只留下了语义差异和长度限制。在大多数情况下，你可以对所有操作都使用\
  \ `GET` 请求，这被认为比 `POST` 方法具有轻微的性能优势。就个人而言，出于多年在客户端编程中处理表单的简单习惯，我倾向于遵循这些语义差异。\n\n\
  ### RESTful 请求\n\n*REST*（或 *Representational State Transfer*，表述状态转移）使得根据指定的 HTTP\
  \ 传输方法区分不同的操作成为可能。到为止你已经学习了 `GET` 和 `POST` HTTP 传输方法。正如上一节所述，区分 `GET` 和 `POST` 大多是语义上的，因为每个\
  \ HTTP 服务器都可以处理 `GET` 和 `POST`。`REST` 是关于你如何选择实现 Web 服务的架构决策。`GET` 和 `POST` 不仅仅是在语义上不同，你还可以选择实施技术约束，例如，根据你使用\
  \ `GET` 还是 `POST` 方法以不同的方式并处理数据的服务器端应用程序。除了 `GET` 和 `POST`，`REST` 架构还可以实现 `PUT`\
  \ 和 `DELETE` 方法。最后，除了这四种方法外，某些实现可能会通过定义额外的方法更进一步，例如 `PATCH`。\n\n你所指定的 HTTP 传输方法（`GET`、`POST`、`PUT`\
  \ 或 `DELETE`）之间的差异可以在服务器端强制执行。例如，你可以向同一个 URI 位置发送 `GET`、`POST`、`PUT` 或 `DELETE`\
  \ 请求，并在请求体中使用 `JSON` 指定信息，然后服务器端应用程序根据指定的类型路由请求并执行不同的代码。许多开发者只需使用 URL 来完成相同的事情，并且仅限于\
  \ `GET` 或 `POST`。然而，使用 HTTP 明确定义请求目的以及使用 HTTP 错误码对请求进行响应已变得日益流行。使用 `REST` 方法通过利用\
  \ HTTP 协议中大部分被忽略的特性，使你的 `AJAX` 应用程序更符合定义标准的范畴。\n\n在“发送 REST 请求”章节中，我展示了一个如何使用 `jQuery`\
  \ 结合 `REST` 方法来发送和接收数据的示例。\n\n### 用于通过 AJAX 请求传输数据的格式\n\n尽管名称暗示你使用 `XML` 来通过 `AJAX`\
  \ 请求传输数据，但这完全是可选的。除了 `XML` 之外，数据从服务器传输到客户端 JavaScript 应用程序还有另外两种常用方式：`JSON`（或 JavaScript\
  \ 对象表示法）和 `HTML`。然而，你并不限于这些格式，因为理论上你可以从服务器获取任何你喜欢的数据并将其传输到客户端。这些格式最受欢迎，因为 `JavaScript`\
  \ 为你提供了处理此类数据的工具。`XML` 可以很容易地使用 `DOM` 工具和方法查询，还可以使用 `jQuery` 的各种遍历、过滤和检索方法进行查询。`HTML`\
  \ 可以以不完整的片段形式发送，并可以使用 `jQuery` 的 `html()` 方法轻松地插入到文档中。\n\n你也可以从服务器传输 JavaScript，该\
  \ JavaScript 将客户端应用程序中进行求值，执行它并使任何变量、函数、对象等可用。\n\n`JSON` 格式是允许创建 JavaScript 对象字面量语法的子集，因此它是\
  \ JavaScript 的子集。然而，它被认为是一种独立的数据传输格式。许多流行语言都具有读取和发送 `JSON` 格式数据的能力。\n\n`JSON` 存在一些潜在的安全问题，在使用\
  \ `eval()` 执行 JavaScript 代码时需要考虑。只有当你确定被评估的数据不会被篡改且不包含恶意代码时，才使用 `eval()`。对于你的 Web\
  \ 应用程序，在使用 `eval()` 方法执行任何用户提供的内容之前应该采取措施，因为用户可能有恶意。由于代码的一部分在客户端是可见的，任何用户都可以发现你传输和接收数据的方法。如果你使用\
  \ `JSON` 传输来自表单的用户提供的数据，用户可以恶意构造提交的表单数据并与你的 `JSON` 格式代码一起执行。恶意用户利用这种方式的一种攻击手段是执行\
  \ JavaScript 来获取其他用户的会话数据并将这些数据传回恶意用户的服务器。这种类型的攻击被称为 *XSS*（*跨站脚本*）*漏洞*，也称为*跨站脚本伪造*。由于会话数据没有绑定到用户的计算机，而是依赖于数学上难以复制的长字符串数字和字母，当恶意用户获取另一个用户的会话\
  \ ID 时，该恶意用户就可以充充其他用户并窃他们的敏感数据，或者登录你的服务器获取特权信息。因此，对于哪些代码可以安全地 `eval()` 哪些不能，必须经过仔细思考。\n\
  \n### 使用 jQuery 发送 GET 请求\n\n在讨论了 `AJAX` 请求的一些内部工作原理后，下一个讨论话题是使用 `jQuery` 通过 `AJAX`\
  \ 发送你的第一个 `GET` 请求。\n\n\n\n\n当然，AJAX 通常用于创建动态 Web 应用程序，这些应用程序包含使用 PHP、Java、.NET、Ruby\
  \ 或你喜欢的任何语言编写的服务端。这部分的服务端内容不在本书的涵盖范围内，因此，我没有将 AJAX 请求链接到服务端应用程序，而是将这些请求链接到本地文档，这些文档每次提供相同的响应。如果你想了解更多关于涉及的服务端组件，Wrox\
  \ 有许多非常优秀的书籍，涵盖了几乎每种语言。\n\n尽管如此，jQuery 提供了几个方法来从服务器发起 GET 请求；你所使用的方法取决于你要获取的数据类型。可以用于发送任何类型\
  \ GET 请求的通用方法，显而易懂地叫做 `get()`。每个方法都是 `jQuery` 对象的成员，因此你可以像这样调用 `get()` 方法：`$.get()`。\n\
  \n## 请求 XML 格式的数据\n\n我演示的第一个示例向你展示了如何从将响应格式化为 XML 的服务器请求。以下源代码演示了一个地址输入表单，当国家选择发生变化时，“国家”字段会导致“州”字段被动态更新，同时国旗也会随之改变。每个州列表都是通过\
  \ AJAX 请求从服务器动态获取的。然而，这只发生在三个国家选择中——美国、加拿大和英国——因为信息是从静态 XML 文件提供的，而不是由数据库驱动的服务器。如果我为所有\
  \ 239 个国家选项都创建一个 XML 文件，那么即使该国家没有类似于州的行政区划分，我至少也会更改该国的旗帜。以下是 `Example 7-1` 的 HTML\
  \ 部分：\n\n```\n<!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>右键菜单示例</title>\n\
