  \               {\n                            animating = false;\n            \
  \            }\n                    );\n                }\n            }\n     \
  \   );\n        $('input#exampleAnimationHide').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                if (!animating)\n\
  \                {\n                    animating = true;\n                    var\
  \ easing = $('select#exampleAnimationEasing').val();\n                    var duration\
  \ = parseInt($('input#exampleAnimationDuration').val());\n                    $('div#exampleDialog').fadeOut(\n\
  \                        duration,\n                        easing,\n          \
  \              function()\n                        {\n                         \
