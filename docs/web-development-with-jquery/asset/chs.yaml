  \        <script src='Example 7-1.js'></script>\n        <link href='Example 7-1.css'\
  \ rel='stylesheet' />\n    </head>\n    <body><body>\n        <form action='javascript:void(0);'\
  \ method='post'>\n            <fieldset>\n                <legend>地址</legend>\n\
  <div id='addressCountryWrapper'>\n    <label for='addressCountry'>\n        <img\
  \ src='flags/us.png' alt='Country' />\n    </label>\n    <select id='addressCountry'\
