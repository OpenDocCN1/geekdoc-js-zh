  \ 执行文件上传。如果 `this.files` 的长度为零，则调用 `this.closeProgressDialogue()` 关闭进度对话框。从逻辑上讲，考虑到除非有一个或多个文件需要上传，否则对话框不会打开，因此\
  \ `this.closeProgressDialogue()` 路径是不可能的。该路径是为了在实现可重用的文件上传 API 时涵盖所有情况。\n\n`dragAndDrop`\
  \ 对象中实现的下一个方法是 `closeProgressDialogue()` 方法。\n\n```\n closeProgressDialogue : function()\n\
