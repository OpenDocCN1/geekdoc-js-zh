  \ jQuery 允许你遍历 DOM 以及更改和操作选择的各种方法。\n\n\n\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        var today = $('td.calendarToday');\n        var\
  \ setUpThisWeek = function()\n        {\n            $('table.calendarMonth td').removeClass(\n\
