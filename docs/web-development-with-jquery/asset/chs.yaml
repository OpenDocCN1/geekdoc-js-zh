  \        {\n```\n\n接下来，你为 `upload` 对象上的 `progress` 事件设置一个事件监听器。该事件最终会告诉你文件上传的总体进度，无论上传的是单个文件还是多个文件。\n\
  \n```\n this.http.upload.addEventListener(\n                'progress',\n      \
  \          function(event)\n                {\n```\n\n`event.lengthComputable` 属性告诉你是否有任何进度可以报告。\n\
  \n```\n if (event.lengthComputable)\n                    {\n```\n\nID 为 `finderDragAndDropDialogueProgressMeter`\
  \ 的 `<div` 将显示，其内部的 `<div` 元素也是如此。\n\n```\n $('div#finderDragAndDropDialogueProgressMeter')\n\
  \                            .show();\n                        $('div#finderDragAndDropDialogueProgressMeter\
  \ div')\n                            .show();\n```\n\n文件上传进度是通过 `event` 对象中提供的 `event.loaded`\
  \ 和 `event.total` 属性计算出的四舍五入百分比。\n\n```\n var progress = Math.round(\n         \
  \                   (event.loaded * 100) / event.total\n                       \
