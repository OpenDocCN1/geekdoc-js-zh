  \ a {\n    color: lightblue;\n}\n```\n\n最后，这段 JavaScript 实现了可排序功能。\n\n```javascript\n\
  $(document).ready(\n    function()\n    {\n        $('li.finderCategoryFile').mousedown(\n\
  \            function()\n            {\n                $(this).removeClass('finderCategoryFile');\n\
  \                $(this).addClass('finderCategoryFileSelected');\n            }\n\
  \        );\n        $('ul#finderCategoryFiles').sortable();\n    }\n);\n```\n\n\
  \n\n\n\n```html\nhtml,\nbody {\n    width: 100%;\n    height: 100%;\n}\nbody {\n\
  \    font: 12px 'Lucida Grande', Arial, sans-serif;\n    background: rgb(189, 189,\
  \ 189)\n                url('images/Bottom.png') \n                repeat-x \n \
  \               bottom;\n    color: rgb(50, 50, 50);\n    margin: 0;\n    padding:\
  \ 0;\n}\n```\n\n在下一个样式表规则中，你通过对 id 为 `finderCategoryFiles` 的 `<ul>` 元素进行样式设置创建左列，使其跨越文档左侧的高度。`top:\
  \ 0;` 声明结合 `bottom: 22px;` 声明使得 `<ul>` 元素跨越整个口的高度，除了底部 22 像素（该区域应用了渐变背景）。`<ul>`\
  \ 元素被赋予了 300 像素的固定宽度；否则由于 `<ul>` 元素是绝对定位的，它将产生收缩宽度。\n\n```css\nul#finderCategoryFiles\
  \ {\n    position: absolute;\n    top: 0;\n    bottom: 22px;\n    left: 0;\n   \
  \ width: 300px;\n    border-bottom: 1px solid rgb(64, 64, 64);\n    border-right:\
  \ 1px solid rgb(64, 64, 64);\n    background: #fff;\n    list-style: none;\n   \
  \ margin: 0;\n    padding: 0;\n}\n```\n\n每个 `<li>` 元素首先应用了 `clear: both` 声明，这对于清除每个文件图标（类名为\
  \ `finderCategoryFileIcon` 的 `<div>` 元素）的左浮是所需的。如果没有这个声明，你将得到一个混乱且无法理解的局面，因为每个 `<li>`\
  \ 元素都会尝试浮动到前一个 `<li>` 元素图标的右侧，而前一个 `<li>` 元素又会浮到再前一个 `<li>` 元素图标的右侧，以此类推。`clear:\
  \ both` 声明消除了浮动，使图标向左浮动，只有 `<li>` 元素内的文本内容浮动到图标的右侧。\n\n每个 `<li>` 元素被赋予了 290 像素的固定\
  \ `width`。这样做是因为当你拖动 `<li>` 元素时，元素会丢失宽度并缩小。这是因为在没有明确宽度的情况下，每个 `<li>` 元素的宽度是基于父元素\
  \ `<ul>` 宽度的。当你拖动 `<li>` 元素时，它的父元素不再是 `<ul>` 元素而是 `<body>` 元素。`<li>` 元素通过 CSS 随鼠标指针移动。它是相对于视口绝对定位的，并根据\
  \ jQuery UI Sortable 插件根据鼠标指针所在的位置不断更新其位置。否则，作为一个绝对定位的元素，`<li>` 元素将具有收缩宽度，因此通过赋予\
  \ `<li>` 元素固定宽度，你允许它在从一个点拖到另一个点时保持尺寸。`min-height` 属性保持了 `<li>` 元素内部间距的一致，同时也允许每个\
  \ `<li>` 元素垂直扩展以容纳额外的文本内容。\n\n```css\nli.finderCategoryFile {\n    clear: both;\n\
  \    padding: 5px 5px 10px 5px;\n    min-height: 48px;\n    width: 290px;\n}\n```\n\
  \n样式表中的下一个关注点是图标，它由以下规则定义：\n\n```css\ndiv.finderCategoryFileIcon {\n    float: left;\n\
  \    width: 48px;\n    height: 48px;\n    background: url('images/Safari Document.png')\n\
  \                no-repeat;\n}\n```\n\n在上一个规则中，`<div>` 元素通过 `float: left;` 声明向左浮动。如前所述，该声明使得文本内容浮动到图标的右侧。上一个规则的\
  \ `clear: both;` 声明消除了每个 `<li>` 元素上的该声明，使得只有文本内容受到影响。图标使用 `background` 属性设置为背景，并为\
  \ `<div>` 赋予了 48 像素的宽度和高度，与背景图像的尺寸匹配。\n\n样式表中最后两个关注点定义了被选中文件的外观。这通过以下两个规则实现：\n\n\
  ```css\nli.finderCategoryFileSelected {\n    background: rgb(24, 67, 243)\n    \
  \            url('images/Selected Item.png') \n                repeat-x \n     \
  \           bottom;\n    color: white;\n}\nli.finderCategoryFileSelected a {\n \
  \   color: lightblue;\n}\n```\n\n之前的两个规则用于类名为 `finderCategoryFileSelected` 的 `<li>`\
  \ 元素。该类名由 jQuery 动态地从 `<li>` 元素中添加和移除。添加此类名让你的用户看到哪个文件当前被选中。除了提供选择的视觉提示外，这还允许你实现添加删除按钮的功能，按下后可以移除所选项目，或实现某些依赖于元素选择的其他功能。\n\
  \n此示例的 JavaScript 非常简洁且直接。JavaScript 基本上做了两件事：它提供了选择元素的能力，并让 `<li>` 元素变得可排序。\n\n\
  当 DOM 准备就时，第一个任务是为每个 `<li>` 元素附加一个 `mousedown` 事件。你可以使用此事件来实现哪个元素被选中的指示。\n\n```javascript\n\
  $('li.finderCategoryFile').mousedown(\n    function()\n    {\n        $('li.finderCategoryFile').not(this).removeClass('finderCategorySelected');\n\
  \        $(this).addClass('finderCategorySelected');\n    }\n);\n```\n\n脚本选择了所有类名为\
  \ `finderCategoryFile` 的 `<li>` 元素。类名被添加到选择器中，尽管目前你完全可以直接选择所有没有类名的 `<li>` 元素并获得相同的结果，这样你的应用程序就可以被扩展。在选择器中添加类名使得选择更加具体，并让你能够费力地扩展功能。因此，每个类名为\
  \ `finderCategoryFile` 的 `<li>` 元素都被选中；然后使用 `.not(this)` 过滤掉发生 `mousedown` 事件的 `<li>`\
  \ 元素，并从除了发生事件事件的 `<li>` 元素之外的每个 `<li>` 元素中移除 `finderCategorySelected` 类名。\n\n这实际上不是实现选择最高的方法，特别是当列表很长时。选择每个\
  \ `<li>` 元素是低效的，如果列表中有很多项目，可能会让脚本变慢。在向你展示了错误的选择方法后，更好的方法是创建一个变量，并在每次选择时将当前选中的元素存储在该变量中。以下代码在\
  \ *示例 13-1* 的上下文中是这种写法：\n\n```javascript\n$(document).ready(\n    function()\n \
  \   {\n        var selectedFile;\n        $('li.finderCategoryFile').mousedown(\n\
  \            function()\n            {\n                if (selectedFile && selectedFile.length)\n\
  \                {\n                    selectedFile.removeClass('finderCategorySelected');\n\
  \                }\n                selectedFile = $(this);\n                selectedFile.addClass('finderCategorySelected');\n\
  \            }\n        );\n        $('ul#finderCategoryFiles').sortable();\n  \
  \  }\n);\n```\n\n选中的项目存储在变量 `selectedFile` 中。当 `mousedown` 事件触发时，脚本首先检查 `selectedFile`\
  \ 变量中是否存储了元素。如果有，则从该元素移除 `finderCategorySelected` 类名，因为该元素是上一个选中的元素。\n\n\n\n\n随后，通过\
  \ `this` 关键字引用的触发 `mousedown` 事件的元素，通过在美元符号函数 `()` 的调用中包装 `this` 被转换为一个 jQuery 对象，并且类名\
  \ `finderCategoryFileSelected` 被添加到触发 `mousedown` 事件的元素上。这为你为你提供了一个更精简、更高效的选择器 API。\n\
  \n脚本中发生的最后一个操作（也是本示例的重点）是调用 `sortable()` 方法使每个 `<li>` 元素变为可排序：\n\n```javascript\n\
  $('ul#finderCategoryFiles').sortable();\n```\n\n下一节将介绍 Sortable 插件讨论中的一些自定义内容。\n\
  \n## 自定义 Sortable\n\n本节将介绍你可以对可排序列表进行的一些视觉调整，以及如何将一个列表链接到另一个列表，以便在多个独立列表之间进行排序。jQuery\
  \ UI 的 `sortable()` 方法类似于 `draggable()` 和 `droppable()`，允许你指定一个对象字面量作为第一个参数，从而让你调整排序的工作方式，并可以在排序过程中发生的特定事件期间执行回调函数。\n\
  \n提供的第一个选项是 `placeholder`，它让你能够对可排序列表中拖拽过程中出现的占位符进行样式设置，以指示如果释放鼠标，项目将掉落的位置。默认情况下（参见图\
  \ 13.1），你可以看到 `placeholder` 仅仅是空白区域，大小相对于被拖拽的元素。`placeholder` 选项接受类名作为其值，该值随后会被应用到\
  \ `placeholder` 元素上。\n\n第二个选项描述了你如何自定义被拖拽的元素；此过程也可以应用于 jQuery UI 的 `draggable()`\
  \ 方法。默认情况下，jQuery UI 将用户选择用于排序的元素显示为用户拖拽的元素，这在大多数场景下都是合理的。然而，如果你愿意，也可以选择一个完全不同的元素作为拖拽元素进行显示。自定义拖拽期间显示的元素是通过\
  \ `helper` 选项完成的。在 jQuery UI 中，`helper`（无论应用于 Sortable 插件、Draggable 插件或其他插件的拖放操作中）都是用于指在拖拽进行期间显示的元素的术语。`helper`\
  \ 选项接受两个参数：第一个参数是事件对象，第二个参数引用用户选择用于排序的元素。除了完全替换 `drag` 事件期间显示的元素外，你还可以使用此选项来微调用户选择元素的显示效果。\n\
  \n在下面的示例中，你扩展了在*示例 13-1* 中创建的文件排序应用程序，增加了一些选项，例如在本节中学习的 `placeholder` 和 `helper`\
  \ 选项。你还添加了另一个选项，让你能够在多个列表之间对元素排序。\n\n以 *示例 13-1.html* 为基础，创建以下标记文档作为 *Example 13-2.html*：\n\
