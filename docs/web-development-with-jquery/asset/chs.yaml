  \n图 12.2\n\n在前面的示例中，你为 Finder 克隆版本添加了 jQuery UI `droppable()` 方法，这允许你指定可以放置可移动元素的区域。jQuery\
  \ UI 的 Draggable 和 Droppable 插件在所有现代浏览器中均可用。\n\n为了为 Droppable 库设置文档，你向样式表添加了几条规则，这些规则定义了当你将一个元素拖到另一个元素上方时的外观。从现在开始，将一个元素拖过另一个元素的操作被称为\
  \ `dragover` 事件。jQuery UI 简单地将此事件称为 `over`，但来自 第 11 章 的原生拖放 API 将此事件称为 `dragover`。\n\
  \n本质上，你用于 `dragover` 的样式与你已经用于高亮文件夹以指示其选中的样式相同，唯一的区别在于：你将默认文件夹图标替换为打开的文件夹图标。在 JavaScript\
  \ 部分，在样式表中更改 `dragover` 样式是通过添加类名 `finderDirectoryDrop` 实现的的。该类名被添加到类名为 `finderDirectory`\
  \ 的 `<div>` 元素中。jQuery 动态地向该 `<div>` 元素添加或移除 `finderDirectoryDrop` 类名，从而允许你在 `dragover`\
  \ 发生时定义不同的样式。\n\n因此，你正在对正在发生 `dragover` 事件的文件夹复用“已选文件夹样式”，唯一的区别是使用了打开的文件夹图标。复用该样式非常简单，只需通过向样式表添加引用带有\
  \ `dragover` 类名 `finderDirectoryDrop` 的 `<div>` 元素的额外选择器即可。\n\n```css\ndiv.finderIconSelected,\n\
  div.finderDirectoryDrop div.finderIcon  {\n    background-color: rgb(204, 204, 204);\n\
  \    border-radius: 5px;\n}\ndiv.finderDirectoryDrop div.finderIcon {\n    background-image:\
  \ url('images/Open Folder 48x48.png');\n}\ndiv.finderDirectoryName {\n    text-align:\
  \ center;\n}\nspan.finderDirectoryNameSelected,\ndiv.finderDirectoryDrop span.finderDirectoryNameSelected\
  \ {\n    background: rgb(56, 117, 215);\n    border-radius: 8px;\n    color: white;\n\
  \    padding: 1px 7px;\n}\n```\n\n前面的代码复用了用于 dragover 元素的已选文件夹样式。为了将默认文件夹图标替换为打开的文件夹图标，你使用了更具体的选择器。使用以下选择器来添加默认文件夹图标：\n\
  \n```css\ndiv.finderIcon\n```\n\n以下选择器在 `dragover` 事件发生时会覆盖之前的选择器，提供打开的文件夹图标而不是默认文件夹图标：\n\
  \n```css\ndiv.finderDirectoryDrop .finderIcon\n```\n\n接下来，你向 `draggable()` 方法传递了几个自定义配置以完成两件事。第一是当用户开始拖动文件夹图标时，你想使用该图标的副本来表示被拖动的项目。第二是让该副本半透明。这种效果被称为\
  \ *ghosting*（虚影），它创建了一种界面：当元素在屏幕上拖动时，一个半透明的副本代表被拖动的内容，看起来像一个幽影。\n\n```javascript\n\
  \ .draggable({\n                helper : 'clone',\n                opacity : 0.5\n\
  \            })\n```\n\n\n\n\n\n```javascript\n drop: function(event, ui)\n    \
  \            {\n                    var path = ui.draggable.data('path');\n    \
  \                // Do something with the path\n                    // For example,\
  \ make an AJAX call to the server\n                    // where the logic for actually\
  \ moving the file or folder\n                    // to the new folder would take\
  \ place\n                    // Remove the element that was dropped.\n         \
  \           ui.draggable.remove();\n                }\n            });\n```\n\n\
  在上述的 `drop` 事件中，你可以通过在提供的回调函数中指定第二个参数，来访问与拖放操作相关的属性。第二个参数命名为 `ui`；那么 `ui.draggable`\
  \ 对象可以让你访问在该元素上被拖拽并释放的元素。如果你想完整地检查 `ui` 对象，可以在代码中添加 `console.log(ui);`，这样 `ui` 对象将输出到浏览器的调试控制台中，你可以在那里检查它包含的所有内容。\n\
  \n在分配给 `drop` 选项的回调函数中，你访问被拖拽元素的 `data-path` 属性，该属性包含文件夹的绝对路径。然后你可以将该路径发送到服务器，连同被拖拽文件夹所落的目标文件夹路径，并以程序方式将该文件夹移动到新位置。该函数以调用\
  \ `remove()` 删除被拖拽元素而结束，这将是你在实现拖放文件夹 UI 时所执行的最后操作。\n\n在前面的示例中，你通过一个面向真实场景的拖放实现演示，学习了\
  \ jQuery UI 的 `draggable()` 和 `droppable()` 方法是如何工作的。这些方法结合你从第 11 章 学习的关于浏览器原生拖放\
  \ API 的知识，为在浏览器或利用浏览器组件的应用程序中实现拖放提供了强大且灵活的方法。\n\n## 总结\n\n在本章中，你学习了如何使用 jQuery UI\
  \ 的 Draggable 和 Droppable 插件，你可以从 [`www.jquery.com`](http://www.jquery.com) 按需下载这些插件。jQuery\
  \ 网站为 UI 组件提供了按需下载，这样你就可以只包含所需的插件，这反过来有助于保持你的应用程序轻量级且高效。\n\n在整个章节中，你一直在构建一个与 Mac\
  \ OS X 的 Finder 类似的文件组件，并看到了如何将文件夹变为可拖拽元素，以及作为可拖拽元素的投放区域。你还看到了如何通过 jQuery UI 允许传递给\
  \ `draggable()` 和 `droppable()` 方法的选项来控制拖放实现中的各种干扰，这些选项可以帮助你控制想要哪种拖拽操作、`drag` 元素的外观、`drop`\
  \ 元素的外观，以及你可以指定的在拖放操作期间发生的特定事件期间执行代码的事件处理程序。\n\n下一章将介绍 jQuery 提供的另一个拖放 UI 概念，称为\
  \ `Sortable`。\n\n## 练习\n\n1. 如果你想拥有一个允许用户在文档中拖拽元素并将这些元素放置在他们喜欢的任何地方的 UI，你会使用什么？（提示：使用哪个函数调用？）\n\
  \n2. 如果你想创建与你操作系统文件管理器工作类似的可拖拽元素（即原始元素留在原地，但在拖放操作开始时，你拖拽的是该元素的克隆），你会如何使用 jQuery\
  \ UI 实现它？请编写一个实现此功能的示例程序。\n\n3. 如果你想让一个元素成为可拖拽元素的投放区域，你会使用哪个函数调用？\n\n4. 写出相应的函数调用，用于在元素拖拽到投放区域上方时为该区域添加类名。\n\
  \n5. 如果你想限制可以投放到 `drop` 元素上的拖拽元素，你会为 `droppable()` 方法提供什么选项？你还会为该选项提供什么类型的值？\n\n\
  ## 第 13 章\n\n## Sortable\n\n第 12 章，“Draggable and Droppable”介绍了 jQuery UI 如何提供插件使实现拖放\
  \ UI 变得简单。本章介绍了另一个 jQuery UI 插件 Sortable，它允许让列表中的项目变为可排序的或“可重排”。\n\n在网站开发中，你可能经常需要对项目排序，并且可能想要更改项目的顺序。例如，产品在导航栏或侧边菜单中出现的顺序。\n\
  \n如果没有拖放，仍然可以让用户调整项目的顺序。例如，你可以提供向上或向箭头来移动列表中的项目，但拖放排序是实现此类用户界面最快、最直观的方式。\n\n## 让列表变为可排序\n\
  \n正如你在整本书中看到的，jQuery 让更复杂的编程任务变得更简单。有时，你只需要添加一行代码，甚至在选择器上链式一个额外的函数调用，就能完成很多工作。当你体验到\
  \ jQuery 如何让常见的编程任务变得如此简单时，几乎无法回到没有像 jQuery 等框架提供的便利性的 JavaScript 编程。在第 12 章中，你看到让元素变为可拖拽等同于进行选择然后调用单个函数。通过拖放让项目列表变为可排序同样简单——你选择一组元素，然后进行单个函数调用。在这种情况下，你调用的函数被称为\
  \ `sortable()`。就像在第 12 章中介绍的拖放示例一样，你有能力通过使用 JavaScript 对象字量量传递给 `sortable()` 方法的细粒度选项来微调元素的排序功能。jQuery\
  \ UI 为 Sortable 插件提供的每个选项在附录 K“Sortable”中都有详细的定义。\n\n要实现这一点，你只需要包含相关的 jQuery UI\
  \ 插件 Sortable，使用 jQuery 进行选择，然后对该选择器链式调用 `sortable()` 函数。Sortable 插件要求你选择一个容器元素，其直接子元素将可以通过拖放进行排序。容器的一个示例是\
  \ `<ul>` 元素，而可排序的子元素是在该元素内的 `<li>` 元素。Sortable 插件提供的排序功能在所有现代浏览器中均可用：IE、Firefox、Safari\
  \ 和 Opera。\n\n接下来的示例将排序概念置于面向真实世界的应用中，在该应用中，你通过 GUI 界面对文件排序，这可能用于内容管理系统 (CMS)，以控制侧边栏或下拉菜单中链接的排序，或者产品在目录中出现的顺序。你将在整个章节中返回此示例，以检查\
  \ jQuery UI 通过其 Sortable 插件提供的文件排序的其他方面。你从以下 HTML 开始，它在 [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
