  \ none;\n    -webkit-user-select: none;\n    -moz-user-select: none;\n    -ms-user-select:\
  \ none;\n}\ndiv.finderDirectory {\n    float: left;\n    width: 150px;\n    height:\
  \ 100px;\n    overflow: hidden;\n}\ndiv.finderIcon {\n    background: url('images/Folder\
  \ 48x48.png') no-repeat center;\n    background-size: 48px 48px;\n    height: 56px;\n\
  \    width: 54px;\n    margin: 10px auto 3px auto;\n}\ndiv.finderIconSelected {\n\
