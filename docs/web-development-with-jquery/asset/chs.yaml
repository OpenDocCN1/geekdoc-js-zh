  \                           value='Groucho' />\n                    <label for='documentAttributeGrouchoMarx'>\n\
  \                        Groucho\n                    </label>\n               \
  \ </li>\n                <li>\n                    <input type='radio' \n      \
  \                     name='documentAttributeMarx'\n                           id='documentAttributeChicoMarx'\n\
  \                           value='Chico' />\n                    <label for='documentAttributeChicoMarx'>\n\
  \                        Chico\n                    </label>\n                </li>\n\
  \                <li>\n                    <input type='radio' \n              \
  \             name='documentAttributeMarx'\n                           id='documentAttributeHarpoMarx'\
  \ \n                           value='Harpo' />\n                    <label for='documentAttributeHarpoMarx'>\n\
  \                        Harpo\n                    </label>\n                </li>\n\
  \                <li>\n                    <input type='radio' \n              \
