  \                    var duration = parseInt($('input#exampleAnimationDuration').val());\n\
  \                    $('div#exampleDialog').fadeToggle(\n                      \
  \  duration,\n                        easing,\n                        function()\n\
  \                        {\n                            animating = false;\n   \
