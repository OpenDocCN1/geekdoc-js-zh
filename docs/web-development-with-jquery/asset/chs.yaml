  \                    var duration = parseInt($('input#exampleAnimationDuration').val());\n\
  \                    $('div#exampleDialog').slideUp(\n                        duration,\n\
  \                        easing,\n                        function()\n         \
  \               {\n                            animating = false;\n            \
  \            }\n                    );\n                }\n            }\n     \
  \   );\n        $('input#exampleAnimationToggle').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                if (!animating)\n\
  \                {\n                    animating = true;\n                    var\
  \ easing = $('select#exampleAnimationEasing').val();\n                    var duration\
  \ = parseInt($('input#exampleAnimationDuration').val());\n                    $('div#exampleDialog').slideToggle(\n\
  \                        duration,\n                        easing,\n          \
  \              function()\n                        {\n                         \
