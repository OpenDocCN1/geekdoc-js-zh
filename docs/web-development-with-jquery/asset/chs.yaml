  \                </div>\n            </div>\n            <div class='finderDirectory'\
  \ data-path='/System'>\n                <div class='finderIcon'><div></div></div>\n\
  \                <div class='finderDirectoryName'>\n                    <span>System</span>\n\
  \                </div>\n            </div>\n            <div class='finderDirectory'\
  \ data-path='/Users'>\n                <div class='finderIcon'><div></div></div>\n\
  \                <div class='finderDirectoryName'>\n                    <span>Users</span>\n\
  \                </div>\n            </div>\n        </div>\n    </body>\n</html>\n\
  ```\n\n以下 CSS 为 Finder 示例和 jQuery UI Selectable 示例提供了了一些样式。\n\n```css\nhtml,\nbody\
  \ {\n    width: 100%;\n    height: 100%;\n    overflow: hidden;\n}\nbody {\n   \
  \ font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background: rgb(189, 189,\
  \ 189) url('images/Bottom.png') repeat-x bottom;\n    color: rgb(50, 50, 50);\n\
  \    margin: 0;\n    padding: 0;\n}\ndiv#finderFiles {\n    border-bottom: 1px solid\
  \ rgb(64, 64, 64);\n    background: #fff;\n    position: absolute;\n    top: 0;\n\
  \    right: 0;\n    bottom: 23px;\n    left: 0;\n    overflow: auto;\n}\ndiv.finderDirectory\
  \ {\n    float: left;\n    width: 150px;\n    height: 100px;\n    overflow: hidden;\n\
  }\ndiv.finderIcon {\n    height: 56px;\n    width: 54px;\n    margin: 10px auto\
  \ 3px auto;\n}\ndiv.finderIcon div {\n    background: url('images/Folder 48x48.png')\
  \ no-repeat center;\n    width: 48px;\n    height: 48px;\n    margin: auto;\n}\n\
  div.finderSelected div.finderIcon,\ndiv.finderDirectoryDrop div.finderIcon {\n \
  \   background-color: rgb(196, 196, 196);\n    border-radius: 5px;\n}\ndiv.finderDirectoryDrop\
  \ div.finderIcon div {\n    background-image: url('images/Open Folder 48x48.png');\n\
  }\ndiv.finderDirectoryName {\n    text-align: center;\n}\ndiv.finderSelected div.finderDirectoryName\
  \ span,\ndiv.finderDirectoryDrop div.finderDirectoryName span {\n    background:\
  \ rgb(56, 117, 215);\n    border-radius: 8px;\n    color: white;\n    padding: 1px\
  \ 7px;\n}\ndiv.ui-selectable-helper {\n    position: absolute;\n    background:\
  \ rgb(128, 128, 128);\n    border: 1px solid black;\n    opacity: 0.25;\n    -ms-filter:\"\
  progid:DXImageTransform.Microsoft.Alpha(Opacity=25)\";\n    filter: alpha(opacity=25);\n\
  }\n```\n\n以下 JavaScript 使得通过画框可以同时选择多个文件。\n\n```javascript\n$.fn.extend({\n    selectFile\
  \ : function()\n    {\n        this.addClass('finderSelected');\n        this.each(\n\
  \            function()\n            {\n                if ($.inArray($(this), finder.selectedFiles)\
  \ == -1)\n                {\n                    finder.selectedFiles.push($(this));\n\
  \                }\n            }\n        );\n        return this;\n    },\n  \
  \  unselectFile : function()\n    {\n        this.removeClass('finderSelected');\n\
  \        var files = this;\n        if (finder.selectedFiles instanceof Array &&\
  \ finder.selectedFiles.length)\n        {\n            finder.selectedFiles = $.grep(\n\
  \                finder.selectedFiles,\n                function(file, index)\n\
  \                {\n                    return $.inArray(file, files) == -1;\n \
  \               }\n            );\n        }\n        return this;\n    }\n});\n\
  var finder = {\n    selectingFiles : false,\n    selectedFiles : [],\n    unselectSelected\
  \ : function()\n    {\n        if (this.selectedFiles instanceof Array && this.selectedFiles.length)\n\
  \        {\n            $(this.selectedFiles).each(\n                function()\n\
  \                {\n                    $(this).unselectFile();\n              \
  \  }\n            );\n        }\n        this.selectedFiles = [];\n    },\n    ready\
  \ : function()\n    {\n        $('div.finderDirectory, div.finderFile')\n      \
  \      .mousedown(\n                function()\n                {\n            \
  \        if (!finder.selectingFiles)\n                    {\n                  \
  \      finder.unselectSelected();\n                        $(this).selectFile();\n\
  \                    }\n                }\n            )\n            .draggable({\n\
  \                helper : 'clone',\n                opacity : 0.5\n            });\n\
  \        $('div.finderDirectory').droppable({\n            accept : 'div.finderDirectory,\
  \ div.finderFile',\n            hoverClass : 'finderDirectoryDrop',\n          \
  \  drop : function(event, ui)\n            {\n                var path = ui.draggable.data('path');\n\
  \                ui.draggable.remove();\n            }\n        });\n        $('div#finderFiles').selectable({\n\
  \            appendTo : 'div#finderFiles',\n            filter : 'div.finderDirectory,\
  \ div.finderFile',\n            start : function(event, ui)\n            {\n   \
  \             finder.selectingFiles = true;\n                finder.unselectSelected();\n\
  \            },\n            stop : function(event, ui)\n            {\n       \
  \         finder.selectingFiles = false;\n            },\n            selecting\
  \ : function(event, ui)\n            {\n                $(ui.selecting).selectFile();\n\
  \            },\n            unselecting : function(event, ui)\n            {\n\
  \                $(ui.unselecting).unselectFile();\n            }\n        });\n\
  \    }\n};\n$(document).ready(\n    function()\n    {\n        finder.ready();\n\
  \    }\n);\n```\n\n\n\n你对第 12 章中创建的样式表进行了几处修改。你添加了一条额外的规则，使你能够自定义选择内容时绘制的框。文档所示，jQuery\
  \ UI 的默认选择框看起来像旧版操作系统（如 Windows 98）中的那种，它只提供一个虚线框来指示框绘制的位置。在 Photoshop 这样的应用程序中，选择框通常带有动画效果，这种选择被称为*蚂蚁线*（marching\
  \ ants），因为选择框的外看起来像蚂蚁在排行进。在这个示例中，你更改了该框的样式，使其看起来更像 Mac OS X 中的选择框。\n\n```\ndiv.ui-selectable-helper\
  \ {\n    position: absolute;\n    background: rgb(128, 128, 128);\n    border: 1px\
  \ solid black;\n    opacity: 0.25;\n    -ms-filter:\"progid:DXImageTransform.Microsoft.Alpha(Opacity=25)\"\
  ;\n    filter: alpha(opacity=25);\n}\n```\n\n可以使用此处看到的相同选择器来定制选择框。jQuery UI 并没有提供通过\
  \ JavaScript API 选项来定制选择框样式的机制。这是设计如此的，因为将样式与行为分离是最佳实践。要定制样式，你必须使用 CSS。类名 `ui-selectable-helper`\
  \ 是 jQuery UI 应用于选择框的类名，它在内部也是一个 `<div>` 元素，因此你看到的定制仅仅利用了这一事实。Selectable 插件提供的样式仅限于随着鼠标光标移动而实际改变的必要\
  \ CSS 属性。这些属性是 `top`、`left`、`width` 和 `height`。其余部分必须由你自己提供，事实上，在你应用样式之前，选择框将没有任何样式，这意味着在你提供某些样式之前，它将是完全不可见的。你必须首先使用\
  \ `position: absolute` 为选择框定位，然后应用 `border` 或 `background`，这样当在你创建选择内容时就能看到它。在这个示例中，我选择简单地模仿\
  \ OS X，这使得样式选择变得简单。\n\n该样式提供了灰色背景和黑色边框；然后通过 Safari、Chrome、Firefox 和 IE9 支持的标准 `opacity`\
  \ 属性使整个框变为半透明；微软专有的 `filter` 属性受 IE6 和 IE7 支持；微软专有的 `-ms-filter` 属性受 IE8 在标准模式下的支持。IE8\
  \ 中 `-ms-filter` 属性的语法与之前的版本相同；只是在属性值周围加上引号并添加特定特定的 `-ms-` 前缀。IE9 进一步消除了对 filter\
  \ 或 `-ms-filter` 属性的需求，因为 IE9 原生支持 `opacity` 属性。\n\n除了这些修改外，样式表与你在第 12 章中创建的样式表基本保持一致。这个示例中的大部分工作工作发生在\
  \ JavaScript 中。\n\n在这个示例中，你使用几个 jQuery 插件重写了在第 12 章中看到的示例，并添加了一些处理跟踪已选文件夹的功能。你首先创建了两个插件方法：`selectFile()`\
  \ 和 `unselectFile()`。正如你在第 9 章“插件”中所学习到的那样，你使用 `$.fn` 来创建 jQuery 插件。利用 `$.fn` 创建\
  \ jQuery 插件的方法不止一种。我最常用的方法是 jQuery 的 `extend()` 方法，它允许你获取一个对象并对其添加内容。对于这个示例，你添加了两个新方法，每个方法都变成一个新的\
  \ jQuery 插件。\n\n```\n$.fn.extend({\n```\n\n在 `selectFile()` 方法内部，你首先为调用 `selectFile()`\
  \ 的每个元素添加了类名 `finderSelected`，这可以是单个文件也可以是多个文件。该类名为你提供了视觉提示，通过触发以下 CSS 让你看到某个文件已被选中：\n\
  \n```\ndiv.finderSelected div.finderIcon,\ndiv.finderDirectoryDrop div.finderIcon\
  \ {\n    background-color: rgb(196, 196, 196);\n    border-radius: 5px;\n}\n```\n\
  \n除了设置文件夹图标样式外，以下样式还应用于文件或文件夹名称：\n\n```\ndiv.finderSelected div.finderDirectoryName\
  \ span,\ndiv.finderDirectoryDrop div.finderDirectoryName span {\n    background:\
  \ rgb(56, 117, 215);\n    border-radius: 8px;\n    color: white;\n    padding: 1px\
  \ 7px;\n}\n```\n\n然后，对于每个调用 `selectFile()` 的文件对象，你检查该文件对象是否已添加到 `finder.selectedFiles`\
  \ 数组。该数组通过存储引用来跟踪特定时刻选中的每个文件。jQuery 的 `inArray()` 方法的设计类似于 JavaScript 的 `indexOf()`\
  \ 方法。`indexOf()` 用于判断一个字符串是否包含另一个字符串。如果找到了字符串，`indexOf()` 将返回该字符串第一次出现的位置偏移量（从零开始计数，你正在搜索的字符串中的第一个字符为零）。如果\
  \ `indexOf()` 返回一个大于等于零的整数，则在第二个字符串中找到了该字符串，该数字可以标识它在其中的位置。\n\n\n\n`finder.selectedFiles`\
  \ 属性默认包含一个空数组。正如你在 jQuery 插件 `selectFile()` 和 `unselectFile()` 中看到的那样，当选择一个或多个文件时，`selectedFiles`\
  \ 属性会存储每个被选定节点的引用。\n\n```\n selectingFiles : false,\n    selectedFiles : [],\n```\n\
  \n`unselectSelected()` 方法会取消当前选中的所有文件节点，然后将该属性重置为空数组。此方法只是取消所有文件的一种快速简便的方法。\n\n\
  ```\n unselectSelected : function()\n    {\n        if (this.selectedFiles instanceof\
  \ Array && this.selectedFiles.length)\n        {\n            $(this.selectedFiles).each(\n\
  \                function()\n                {\n                    $(this).unselectFile();\n\
  \                }\n            );\n        }\n        this.selectedFiles = [];\n\
  \    },\n```\n\n正如你所看到的，`ready()` 方法在 `DOMContentLoaded` 事件发生时执行。\n\n```\n ready\
  \ : function()\n    {\n```\n\n每个目录和每个文件都会接收一个 `mousedown` 事件，并使用 jQuery UI 的 Draggable\
  \ 插件设置为可拖拽。每个目录还通过 Droppable 插件被设置为放置目标。\n\n```\n$('div.finderDirectory, div.finderFile')\n\
  ```\n\n在 `mousedown` 事件中，如果当前没有正在进行选择（这通过 `finder.selectingFiles` 属性跟踪），则所有文件将会被取消选中，然后接收到\
  \ `mousedown` 事件的任何文件元素将被选中。\n\n```\n .mousedown(\n                function()\n\
  \                {\n                    if (!finder.selectingFiles)\n          \
  \          {\n                        finder.unselectSelected();\n             \
  \           $(this).selectFile();\n                    }\n                }\n  \
  \          )\n```\n\n通过调用 `draggable()` 方法启用 Draggable 插件；被拖拽的元素被设置为拖拽源处文件的克隆，从而创建一个正在被拖拽元素的“幻影”。幻影元素还被设置为\
  \ 50% 的透明度，使其呈现为半透明（取决于你的视角，也可能是半不透明）。\n\n```\n .draggable({\n                helper\
  \ : 'clone',\n                opacity : 0.5\n            });\n```\n\n尽管这个示例只包含目录对象，但你设置的示例已准备好处理目录和普通文件对象。每个目录通过分配的类名与普通文件区分来。`finderDirectory`\
  \ 类名被赋予目录，而 `finderFile` 类名被赋予普通文件。\n\n使用 jQuery UI 的 Droppable 插件将目录对象设置为可放置的；调用\
  \ `droppable()` 方法可以使一个目录成为放置目标。正如你在第 12 章中学到的，jQuery UI 只是实现拖放的一种方式。更复杂的 HTML5\
  \ 拖放 API 是另一种选择，如果你需要在多个浏览器窗口之间进行拖放，我建议使用该选项。为了保持示例的简单性，我坚持使用较简单的 jQuery UI Draggable\
  \ 和 Droppable 插件。\n\n```\n $('div.finderDirectory').droppable({\n            accept\
  \ : 'div.finderDirectory, div.finderFile',\n            hoverClass : 'finderDirectoryDrop',\n\
  \            drop : function(event, ui)\n            {\n                var path\
  \ = ui.draggable.data('path');\n                ui.draggable.remove();\n       \
  \     }\n        });\n```\n\n接下来是 Selectable jQuery UI 插件的示例。id 为 `finderFiles`\
  \ 的 `<div>` 内容被设置为可选择的。`appendTo` 选项提供了一个选择器，告诉 `selectable()` 插件将代表选择框的 `<div>`\
  \ 元素放在哪里。选择框被添加到 id 为 `finderFiles` 的 `<div>` 元素中。\n\n`filter` 选项用于告诉 `selectable()`\
  \ 插件包含哪些元素是可选择的，你通过向它提供一个选择器来描述这些可选择的元素。选择器 `div.finderDirectory, div.finderFile`\
  \ 使类名为 `finderDirectory` 或 `finderFile` 的 `<div>` 元素变为可选择。\n\n```\n $('div#finderFiles').selectable({\n\
  \            appendTo : 'div#finderFiles',\n            filter : 'div.finderDirectory,\
  \ div.finderFile',\n```\n\n`start` 选项提供了一个回调函数，每次开始新选择时触发。正如你在第 12 章中学到的，每个指定自定义\
  \ UI 插件事件的选项都接受两个参数，一个用于事件，另一个用于传递额外的 UI 插件数据。在此示例中，当选择开始时，属性 `finder.selectingFiles`\
  \ 被设置为 `true`，这被用于防止你之前创建的 `mousedown` 事件也选中文件，因为那将与使用 `selectable()` 插件进行的选择发生冲突。此外，任何已存在的选择都会通过调用\
  \ `finder.unselectSelected()` 被完全清除。\n\n```\n start : function(event, ui)\n    \
  \        {\n                finder.selectingFiles = true;\n                finder.unselectSelected();\n\
  \            },\n```\n\n当选择结束时，提供给 `stop` 选项的回调函数会被触发。该回调函数将属性 `finder.selectingFiles`\
  \ 设置为 `false`，以便再次通过你之前设置的 `mousedown` 事件对单个文件或目录进行选择。\n\n```\n stop : function(event,\
  \ ui)\n            {\n                finder.selectingFiles = false;\n         \
  \   },\n```\n\n在选择进行期间，提供给 `selecting` 选项的回调函数会持续被触发。正在经历选择的对象将被提供给你，并在 `ui.selecting`\
  \ 属性中进行描述。这些项目随后通过调用 `selectFile()` 被选中。\n\n```\n selecting : function(event, ui)\n\
  \            {\n                $(ui.selecting).selectFile();\n            },\n\
  ```\n\n在选择进行期间，当项目被包含在选择中时，有时项目也会被排除在选择之外。当项目从正在进行的选择中排除时，分配给 `unselecting` 选项的自定义事件回调函数会被触发。与\
  \ `selecting` 选项一样，`unselecting` 选项也通过 `ui` 参数接收数据。`ui.unselecting` 属性提供了一个选择器，其中包含了应该取消选中的文件节点；每个应该取消选中的文件都会通过调用\
  \ `selectFile()` 被取消。\n\n```\n unselecting : function(event, ui)\n            {\n\
  \                $(ui.unselecting).selectFile();\n            }\n        });\n```\n\
  [/content]\n\n## **总结**\n\n在本章中，你学习了 jQuery UI Selectable 插件，它提供了通过鼠标光标绘制一个框来实现选择的功能。你看到了\
  \ Selectable 插件如何应用到你在第 12 章中制作的 Finder 克隆中。\n\nSelectable 插件就像 jQuery UI 的其他插件一样，接受以键值对形式指定的选项字面量。Selectable\
  \ 插件允许你为可选择事件指定回调函数。提供给 `start` 和 `stop` 选项的回调函数分别在选择开始和结束时执行。提供给 `selecting` 和\
  \ `unselecting` 选项的回调函数在选择进行期间项目被添加到或从选择中移除时执行。\n\n## **练习题**\n\n1. 你使用哪个选项在选择开始时执行回调函数？\n\
  \n2. 你使用哪些选项在项目被添加到或从选择中移除时（选择进行期间）执行回调函数？\n\n\n\n\n3. 当使用 `selecting` 和 `unselecting`\
  \ 选项时，你如何访问每个添加到选择中并移除的元素？\n\n4. 你会向样式表中添加什么选择器来自定义选择框的外观和感受？\n\n# 第 15 章：手风琴 (Accordion)\n\
  \n到目前为止，你已经学习了 jQuery 如何让拖放变得易于实现，并学习了 jQuery 如何让你通过画框来轻松地选择项目。你还看到了使用 jQuery 实现拖放排序是多么的异常简单。本章介绍了另一个酷炫的\
  \ jQuery UI 插件：Accordion（手风琴）。\n\njQuery UI Accordion 插件可以轻松实现像你最喜爱的手风琴一样展开和折叠的内容。Accordion\
  \ UI 组件在流行网站上随处可见。如果你想查看 Accordion UI 的快速演示，请访问 [`www.jqueryui.com/accordion/](http://www.jqueryui.com/accordion/)。jQuery\
  \ UI Accordion 插件的缺点是它一次只能打开一个项目。很容易编写一些代码来绕过这个限制。\n\n在本章中，你将了解到如何使用 jQuery UI Accordion\
  \ 插件创建你自己的 Accordion 组件并自定义它的外观。\n\n## 构建一个 Accordion UI\n\n本节讨论了如何制作一个 Accordion\
  \ UI，它是一个内容面板的集合，每个面板都有自己的标题，且其中一次只有一个内容面板是可见的。当你点击其他内容面板时，一个平滑的动画会通过改变面板的高度将可见面板切换到关闭状态（只留标题可见），同时通过改变其他元素的高度来扩展该元素直到其完全可见。\n\
  \n现在我们已经简要解释了什么是 Accordion UI，接下来的文档可以从 [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 获取为 `Example 15-1`，它从 jQuery UI Accordion 插件的基本实现开始的：\n\n```html\n<!DOCTYPE HTML>\n\
  <html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n        <meta http-equiv='content-type'\n\
  \            content='application/xhtml+xml; charset=utf-8' />\n        <meta http-equiv='content-language'\
  \ content='en-us' />\n        <title>Accordion Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 15-1.js'></script>\n\
  \        <link href='Example 15-1.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <h4>The Beatles</h4>\n        <ul>\n            <li>\n                <a\
  \ href='#'>John Lennon</a>\n                <p>\n                    Lorem ipsum\
  \ dolor sit amet, consectetuer adipiscing elit.\n                    Vestibulum\
  \ luctus rutrum orci. Praesent faucibus tellus\n                    faucibus quam.\
  \ Aliquam erat volutpat. Nam posuere.\n                </p>\n            </li>\n\
  \            <li>\n                <a href='#'>Paul McCartney</a>\n            \
  \    <p>\n                    Lorem ipsum dolor sit amet, consectetuer adipiscing\
  \ elit.\n                    Vestibulum luctus rutrum orci. Praesent faucibus tellus\n\
  \                    faucibus quam. Aliquam erat volutpat. Nam posuere.\n      \
  \          </p>\n            </li>\n            <li>\n                <a href='#'>George\
  \ Harrison</a>\n                <p>\n                    Lorem ipsum dolor sit amet,\
  \ consectetuer adipiscing elit.\n                    Vestibulum luctus rutrum orci.\
  \ Praesent faucibus tellus\n                    faucibus quam. Aliquam erat volutpat.\
  \ Nam posuere.\n                </p>\n            </li>\n            <li>\n    \
  \            <a href='#'>Ringo Starr</a>\n                <p>\n                \
  \    Lorem ipsum dolor sit amet, consectetuer adipiscing elit.\n               \
  \     Vestibulum luctus rutrum orci. Praesent faucibus tellus\n                \
  \    faucibus quam. Aliquam erat volutpat. Nam posuere.\n                </p>\n\
  \            </li>\n        </ul>\n    </body>\n</html>\n```\n\n以下样式表被应用于的标记语言文档：\n\
  \n```css\nbody {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background:\
  \ #fff;\n    color: rgb(50, 50, 50);\n    margin: 0;\n    padding: 0;\n}\nh4 {\n\
  \    margin: 5px;\n}\nul {\n    list-style: none;\n    margin: 0;\n    padding:\
  \ 15px 5px;\n}\nli {\n    background: gold;\n    padding: 3px;\n    width: 244px;\n\
  \    margin: 1px;\n}\n```\n\n以下脚本通过简单的函数调用，将标记文档中的 `<ul>` 元素转换为手风琴：\n\n```javascript\n\
  $(document).ready(\n    function()\n    {\n        $('ul').accordion();\n    }\n\
  );\n```\n\n图 15.1 显示，尽管手风琴已经创建，但你的工作尚未完成。\n\n![image](img/c15f001.jpg)\n\n图 15.1\n\
  \n你看到了 Accordion 插件最基础的功能示例。通过在 `<ul>` 元素上调用 `accordion()` 方法，该元素被转换为 Accordion\
  \ UI。\n\n## 更改默认面板\n\n此时，你已经拥有了一个功能性的 Accordion UI。本节将向如何更改默认显示的内容面板。Accordion 插件显示第一个内容面板，但使用\
  \ `active` 选项，你可以强制显示不同的内容面板。以下标记演示了这一概念：\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>Accordion Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 15-2.js'></script>\n\
  \        <link href='Example 15-2.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <h4>The Beatles</h4>\n        <ul>\n            <li>\n                <a\
  \ href='#'>John Lennon</a>\n                <p>\n                    Lorem ipsum\
  \ dolor sit amet, consectetuer adipiscing elit.\n                    Vestibulum\
  \ luctus rutrum orci. Praesent faucibus tellus\n                    faucibus quam.\
  \ Aliquam erat volutpat. Nam posuere.\n                </p>\n            </li>\n\
  \            <li>\n                <a href='#'>Paul McCartney</a>\n            \
  \    <p>\n                    Lorem ipsum dolor sit amet, consectetuer adipiscing\
  \ elit.\n                    Vestibulum luctus rutrum orci. Praesent faucibus tellus\n\
  \                    faucibus quam. Aliquam erat volutpat. Nam posuere.\n      \
  \          </p>\n            </li>\n            <li>\n                <a href='#'>George\
  \ Harrison</a>\n                <p>\n                    Lorem ipsum dolor sit amet,\
  \ consectetuer adipiscing elit.\n                    Vestibulum luctus rutrum orci.\
  \ Praesent faucibus tellus\n                    faucibus quam. Aliquam erat volutpat.\
  \ Nam posuere.\n                </p>\n            </li>\n            <li>\n    \
  \            <a href='#'>Ringo Starr</a>\n                <p>\n                \
  \    Lorem ipsum dolor sit amet, consectetuer adipiscing elit.\n               \
  \     Vestibulum luctus rutrum orci. Praesent faucibus tellus\n                \
  \    faucibus quam. Aliquam erat volutpat. Nam posuere.\n                </p>\n\
  \            </li>\n        </ul>\n    </body>\n</html>\n```\n\n\n\n\n```\nbody\
  \ {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background: #fff;\n\
  \    color: rgb(50, 50, 50);\n    margin: 0;\n    padding: 0;\n}\nh4 {\n    margin:\
  \ 5px;\n}\nul {\n    list-style: none;\n    margin: 0;\n    padding: 15px 5px;\n\
  }\nli {\n    background: gold;\n    padding: 3px;\n    width: 244px;\n    margin:\
  \ 1px;\n}\n```\n\n在接下来的脚本中，你看到整数 1 被传递给 `active` 选项，这导致标记文档中的第二个 `<li>` 元素被用默认内容面板：\n\
  \n```\n$(document).ready(\n    function()\n    {\n        $('ul').accordion({\n\
  \            active : 1\n        });\n    }\n);\n```\n\n图 15.2 显示 Paul McCartney\
  \ 下方的内容现在是默认内容。当你提供一个零偏移整数（其中 0 是第一项，1 是第二项，以此此类推）来表示你想要默认选择的集合中的项目时，`active` 选项会选择默认内容。在这种情况下，*Paul\
  \ McCartney*（保罗·麦卡特尼）是第二项，因此将 1 作为值传递给 `active` 选项，以选择该面板。\n\n![image](img/c15f002.jpg)\n\
  \n**图 15.2**\n\n你也可以将 `active` 选项设置为 `false`，这使得默认情况下没有内容打开。如果你将 `active` 选项设置为\
  \ `false`，你还必须将 `collapsible` 选项设置为 `true`。这在接下来的脚本中得到了演示：\n\n```\n$(document).ready(\n\
  \    function()\n    {\n        $('ul').accordion({\n            collapsible : true,\n\
  \            active : false\n        });\n    }\n);\n```\n\n前面的脚本给出了没有默认打开面板的结果。此示例在源材料中对应*示例\
  \ 15-3*。\n\n当你默认没有选择任何面板时，当你打开一个面板，你可能会注意到每个面板的内容会重叠手风琴的其他部分，如 图 15.3 所示。\n\n![image](img/c15f003.jpg)\n\
  \n**图 15.3**\n\n这个问题可以通过指定 `heightStyle` 选项来纠正。`heightStyle` 选项接受三个可能的值：`auto`、`fill`\
  \ 和 `content`。`auto` 选项将每个面板的高度设置为最高面板的高度。这样做的缺陷在于，因为在页面渲染时所有面板都是隐藏的，这使得每个面板的高度变为标题的高度，而没有包含额外的隐藏内容的高度。`fill`\
  \ 选项使用手风琴元素的父元素作为高度的基准。在本例的上下文中，这将根据 `<body>` 元素的高度设置每个项目的高度。`content` 选项根据每个面板包含的内容的高度设置每个面板的高度。下面的示例反映了通过更改脚本指定值为\
  \ `content` 的 `heightStyle` 选项：\n\n```\n$(document).ready(\n    function()\n   \
  \ {\n        $('ul').accordion({\n            collapsible : true,\n            active\
  \ : false,\n            heightStyle : \"content\"\n        });\n    }\n);\n```\n\
  \n前一个示例在源材料中对应*示例 15-4*。随着前面脚本的更改，每个项目在打开时其内容都不会重叠其他标题，如 图 15.4 所示。\n\n![image](img/c15f004.jpg)\n\
  \n**图 15.4**\n\n在下一节中，你将学习如何更改触发手风琴集合中每个内容面板打开的事件。\n\n## 修改手风琴事件\n\n在设置完成后，当点击标题时，手风琴内容面板会进行过渡。你可以使用\
  \ `event` 选项来更改触发过渡的事件。接下来的脚本向你展示了如何将事件从 `click` 事件更改为 `mouseover` 事件：\n\n```\n\
  $(document).ready(\n    function()\n    {\n        $('ul').accordion({\n       \
  \     active : 1,\n            event : 'mouseover'\n        });\n    }\n);\n```\n\
  \n前面的修改没有产生可见的变化，因此你看到的文档看起来与 图 15.2 中提到的文档相似。然而，当你在浏览器中加载它时，你可以使用 `mouseover` 事件而不是\
  \ `click` 事件在内容面板之间切换。\n\n前一个示例在源材料中对应*示例 15-5*，但此处未列出。\n\n## 设置标题元素\n\n默认情况下，手风琴在每个\
  \ `<li>` 元素中使用 `<a>` 元素作为标题。然而，你不必非使用 `<a>` 元素作为标题；下面的示例在源材料中对应*示例 15-6*，说明了如何使用\
  \ `<h4>` 元素代替 `<a>` 元素：\n\n```\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type' content='text/html; charset=utf-8'\
  \ />\n        <title>Accordion Plugin</title>\n        <link rel='stylesheet' href='Example\
  \ 15-6.css' />\n        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \    </head>\n    <body>\n        <h4>The Beatles</h4>\n        <ul>\n         \
  \   <li>\n                <h4>John Lennon</h4>\n                <p>\n          \
  \          Lorem ipsum dolor sit amet, consectetur adipiscing elit.\n          \
  \          Sed do eiusmod tempor incididunt, ut labore et dolore magna aliqua.\n\
  \                </p>\n            </li>\n            <li>\n                <h4>Paul\
  \ McCartney</h4>\n                <p>\n                    Lorem ipsum dolor sit\
  \ amet, consectetur adipiscing elit.\n                    Sed do eiusmod tempor\
  \ incididunt, ut labore et dolore magna aliqua.\n                </p>\n        \
  \    </li>\n            <li>\n                <h4>George Harrison</h4>\n       \
  \         <p>\n                    Lorem ipsum dolor sit amet, consectetur adipiscing\
  \ elit.\n                    Sed do eiusmod tempor incididunt, ut labore et dolore\
  \ magna aliqua.\n                </p>\n            </li>\n            <li>\n   \
  \             <h4>Ringo Starr</h4>\n                <p>\n                    Lorem\
  \ ipsum dolor sit amet, consectetur adipiscing elit.\n                    Sed do\
  \ eiusmod tempor incididunt, ut labore et dolore magna aliqua.\n               \
  \ </p>\n            </li>\n        </ul>\n    </body>\n</html>\n```\n\n将下面的样式表应用于前面的文档：\n\
  \n```\nbody {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background:\
  \ #fff;\n    color: rgb(50, 50, 50);\n    margin: 0;\n    padding: 0;\n}\nul {\n\
  \    list-style: none;\n    margin: 0;\n    padding: 15px 5px;\n}\nh4,\nul h4,\n\
  ul p {\n    margin: 5px;\n}\nli {\n    background: gold;\n    padding: 3px;\n  \
  \  width: 244px;\n    margin: 1px;\n}\n```\n\n在接下来的脚本中，你通过向 `header` 选项提供选择器（在此例中为\
  \ `h4`）来更改用作每个面板标题的元素，这导致每个 `<li>` 元素的 `<h4>` 元素被用作标题而不是 `<a>` 元素：\n\n```\n$(document).ready(\n\
  \    function()\n    {\n        $('ul').accordion({\n            active : 1,\n \
  \           event : 'mouseover',\n            header : 'h4'\n        });\n    }\n\
  );\n```\n\n在前面的脚本中，注意你还需要更改传递给 `header` 选项的选择器，因为你现在希望让使用 `<h4>` 标题的内容面板默认打开。\n\n\
  图 15.4 展示了使用 `<h4>` 元素代替 `<a>` 元素。\n\n## **总结**\n\n\n\n在本章中，你学习了如何创建一个折叠面板（Accordion）UI，以及你可以用来微调折叠面板\
  \ UI 实现的各种选项。你了解到折叠面板插件接收一个元素列表（例如 `<ul>` 元素），并将列表中的项目转换为平滑动画的内容面板，通过动画化列表中每个项目的高度来实各个面板之间的切换。默认情况下，每个内容面板的标题以\
  \ `<a>` 元素的形式提供，但你可以通过向 `header` 选项提供选择器将标题元素更改为其他内容。\n\n`active` 选项可用于更改页面首次加载时显示的默认内容面板。你也可以通过将\
  \ `active` 选项设置为 `false` 并将 `collapsible` 选项设置为 `true` 来实现不显示默认内容面板。如果未指定默认内容面板，将使用列表中的第一个元素。\n\
  \n`heightStyle` 选项可分别用于微调折叠面板插件定义每个内容面板高度的方式。`auto` 值会获取最高的内容，并将该高度作为所有其他内容面板的高度，这可能并不总是能提供正确的视觉效果。\n\
  \n最后，`event` 选项用于更改触发内容面板切换的事件；`click` 是默认事件。\n\n## 练习\n\n1. 你会向 `accordion()` 方法提供哪个选项来更改默认内容面板？\n\
  2. 你会考虑使用哪个选项及其值来更改 `accordion()` 方法处理高度的方式？\n3. 你会使用哪个选项让 `accordion()` 方法使用 `mouseover`\
  \ 事件而不是 `click` 事件触发内容切换？\n4. 你会使用哪个选项将标题元素更改为 `<h3>` 元素？\n\n# 第 16 章：日期选择器 (Datepicker)\n\
  \njQuery UI 的 Datepicker 插件提供了一个复杂且功能丰富的 UI 组件，用于在表单字段中输入日期。jQuery UI Datepicker\
  \ 插件提供了一个图形日历，可以设置为在任何需要在表单中输入日期的位置弹出。日历的外观和感觉可以自定义。它生成的日期格式可以设置以匹配本地习惯。它标记字段的文本可以替换为任何你文本或翻译成外语，使得该插件完全具备本地化能力。\n\
  \n本章描述了如何使用和自定义 Datepicker 插件。\n\n## 实现日期选择器\n\nDatepicker 插件的最简实现看起来并不理想；它没有样式，但从功能角度来看，它基本上可以工作。\n\
  \n以下文档可以从 [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 下载作为 *示例 16-1*，展示了 jQuery UI Datepicker 插件的基本实现：\n\n```html\n<!DOCTYPE HTML>\n\
  <html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n        <meta http-equiv='content-type'\n\
  \            content='application/xhtml+xml; charset=utf-8' />\n        <meta http-equiv='content-language'\
  \ content='en-us' />\n        <title>Datepicker Plugin</title>\n        <script\
  \ src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 16-1.js'></script>\n        <link href='Example 16-1.css'\
  \ rel='stylesheet' />\n    </head>\n    <body\n        <form action='javascript:void(0);'\
  \ method='post'>\n            <fieldset>\n                <legend>Appointment Form</legend>\n\
  \                <div class=\"exampleDate\">\n                    <label for=\"\
  exampleDate\">Date:</label>\n                    <input type=\"text\" name=\"exampleDate\"\
  \ id=\"exampleDate\" />\n                    <img src=\"images/Calendar.png\" alt=\"\
  Calendar Icon\" />\n                </div\n            </fieldset>\n        </form>\n\
  \    </body>\n</html>\n```\n\n接下来的样式表为前面的标记文档提供了少量的样式：\n\n```css\nbody {\n    font:\
  \ 12px 'Lucida Grande', Arial, sans-serif;\n    background: #fff;\n    color: rgb(50,\
  \ 50, 50);\n}\nfieldset {\n    border: none;\n}\ninput {\n    background: lightblue;\n\
  }\ndiv.exampleDate img {\n    vertical-align: -5px;\n}\n```\n\n在接下来的脚本中，对标记文档中的\
  \ `<input>` 元素调用了 `datepicker()` 方法，这会导致每当 `<input>` 元素获得焦点时动态弹出一个日历进行日期选择：\n\n\
  ```javascript\n$(document).ready(\n    function()\n    {\n        $('input#exampleDate').datepicker();\n\
  \    }\n);\n```\n\n正如你在图 16.1 中所示，Datepicker 插件在每次关联的 `<input>` 字段被激活时都会提供一个未样式的日历。\n\
  \n![image](img/c16f001.jpg)\n\n图 16.1\n\n## 自定义日期选择器样式\n\n默认情况下，Datepicker 插件不提供样式。要设置\
