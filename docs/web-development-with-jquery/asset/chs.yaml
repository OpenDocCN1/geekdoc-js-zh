  \ > 0)\n                        {\n                            alert('Data added\
  \ successfully.');\n                        }\n                    },\n        \
  \            error : function(request, status)\n                    {\n        \
  \            }\n                });\n            }\n        );\n    }\n); \n```\n\
  \n如果你在配置适当的服务器上使用此示例，你会注意到请求连同 JSON 格式的数据负载发送到服务器，这些数据可以在服务器端被解码为对象。截图显示了通过 `ADD`\
  \ 方法向我自己的服务器提交数据，该服务器配置了 `Access-Control-Allow-Methods` HTTP 头部，使得提交 REST 请求成为可能。图\
  \ 7.7 显示了地址表单。\n\n![image](img/c07f007.jpg)\n\n图 7.7\n\n图 7.8 显示了 Safari 的 Web 检查器，它显示了发送到服务器的请求数据。\n\
  \n![image](img/c07f008.jpg)\n\n图 7.8\n\n图 7.9 详细查看了 Web 检查器对 HTTP 请求和服务器响应的详细视图。\n\
  \n此示例向你展示了在客户端设置 REST 请求是很容易的，但你需要正确的服务器端配置来完成实现。实现一个 REST 服务调用就像将你的客户端应用指向一个配置为可以处理\
  \ REST 提供的额外请求方法的服务器一样简单。你需要设置请求以指定正确的方法，例如 `GET`、`POST`、`DELETE` 或 `ADD`，这是通过 jQuery\
  \ 的 `$.ajax()` 方法使用 `type` 属性完成的。然后如果你打算在服务器和客户端之间传递 JSON 数据，你还需要设置 `contentType`、`dataType`\
  \ 和 `data` 属性。`contentType` 告诉服务器请求体中期望的内容。`dataType` 属性告诉 jQuery 在服务器响应中期望什么类型的数据，而\
  \ `data` 属性则传递要放在放入服务器 HTTP 请求中的数据。分配给 `data` 属性的数据随后可以在服务器端被访问。在此示例中，数据是以 JSON\
  \ 格式传递的。在服务器端，你将需要把 JSON 格式的数据解码为对象。\n\n![image](img/c07f009.jpg)\n\n图 7.9\n\n##\
  \ 总结\n\n本章带你游了 jQuery 内置的 AJAX 能力。你看到了 `GET` 和 `POST` HTTP 请求之间的区别，并学到 `GET` 请求有长度限制，而且它在语义上适用于不会对服务器产生持久性修改或影响的请求。相比之下，`POST`\
  \ 请求应该保留给那些不应被任意重复且会对服务器产生某种持久性影响的请求。在 AJAX 方面，`GET` 请求具有轻微的性能优势。此外，你可以利用 REST 让你的请求更具语义化，在现有的\
  \ `GET` 和 `POST` 上添加 `ADD` 或 `DELETE` 等方法动词。\n\njQuery 提供了 `$.get()` 方法来发送 `GET`\
  \ 请求，提供了 `$.post()` 方法来发送 `POST` 请求。\n\n## 练习\n\n1. 对于 AJAX 请求，`GET` 和 `POST` HTTP\
  \ 请求有什么区别？\n2. REST 服务提供什么？\n3. 如何使用 jQuery 的 `$.get()` 方法为请求提供额外数据？\n4. 如何在提供的\
  \ `$.getJSON()` 方法的回调函数中访问 JSON 对象？\n5. 给定定的 XML，假设你使用了 jQuery 的 `$.get()` 方法请求\
  \ XML 文档，如何访问 `<response>` 元素的内容？\n\n   ```xml\n   <?xml version=\"1.0\" encoding=\"\
  UTF-8\" standalone=\"yes\"?>\n   <response>Yes!</response>\n   ```\n6. 如果你想将从服务器请求的\
  \ HTML 段插入元素中，你会使用哪种 jQuery 方法？\n7. 在以下 JavaScript 中，描述每个属性回调函数的作用：\n\n   ```javascript\n\
  \   $.ajaxSetup({\n       beforeSend : function()\n       {\n       },\n       success\
  \ : function()\n       {\n       },\n       error : function()\n       {\n     \
  \  },\n       complete : function()\n       {\n       }\n   });\n   ```\n\n\n\n\n\
  \n8. 如果你想绑定 AJAX 事件以使其仅在单个 AJAX 请求的上下文中生效，而不是全局，jQuery 提供了哪些方法来以这种方式绑定事件？\n\n9.\
  \ 如果你想获取表单内每个输入元素的值，你会使用哪种 jQuery 方法？\n\n10. 你将如何实现对提供 DELETE 方法的 REST 服务的客户端请求，并在请求中向服务器传递一个\
  \ JSON 对象？请描述实现此目标所需的配置，并提供示例代码。\n\n# 第 8 章：动画与缓动效果\n\njQuery 通过许多功能让开发者的生活变得更容易，但\
  \ jQuery 的作用并不仅于让 DOM 遍历、操作、迭代或你在前面章节中中学到的所有其他酷功能变得简单。它还为你提供了工具，通过动画和大量的特效，让你的文档看起来更加精美、专业且高级。本章将介绍如何使用\
  \ jQuery 提供的处理效果的 API。\n\n正如你在之前章节示例中所所示，jQuery 可以通过其 `show()` 和 `hide()` 方法在元素的隐藏和显示状态之间切换显示。你可能还没有学到的是，这些方法还具有通过短时间动画在隐藏和显示状态之间进行动画的能力。\n\
  \njQuery 还允许你通过动画元素的高度，在元素的隐藏和显示状态之间进行动画；此外还可以通过元素不透明度的动画来使元素淡入淡出，而这一切只需通过简单易懂的函数调用即可。\n\
  \n最后，jQuery 还具有在文档中对象在任意数值样式之间进行动画的能力，这让你能够创建属于自己的自定义动画。\n\n## 显示和隐藏元素\n\njQuery\
  \ 提供了三种显示和隐藏元素的方法：`show()`、`hide()` 和 `toggle()`。你在之前的章节中见过 `show()` 和 `hide()`\
  \ 的示例。默认情况下，这三个方法通过切换元素的 CSS `display` 属性来简单使对象可见或不可见。这些方法让开启或关闭元素变得更容易。你尚未学习这些这些属性是，你还可以向这些方法提供参数，通过缓动（easings）自定义从可见到不可见（或反之）过渡动画。缓动是控制动画随时间进展的算法。例如，动画可能开始得很快，随着时间的推移，变换可能会变慢或变快。算法决定了如何将时间应用于动画。缓动可以被可视化为图表上的单线，代表时间在整个动画持续期间是如何被改变和应用的。缓动还可以改变动画。例如，包含弹跳的缓动可以产生一种过渡，其中对象的变换看起来在弹跳。当对对象的宽度进行动画时，弹跳缓动是明显的：宽度变小，然后突然变大，再次突然变小，产生弹跳的外。在这种情况下，缓动应用了一种控制宽度随时间动画的算法，在某些时间点动画临时向后再次向前，直到达到持续时间以产生弹跳的效果。\n\
  \n这些缓动效果都预封装在预设中，你可以通过调用 jQuery 方法并传入引用缓动预设名称的参数或选项在脚本中使用。并不是所有的缓动预设都包含在默认的下载 中；只包含了\
  \ `'linear'` 和 `'swing'`。额外的缓动必须从 jQuery UI 网站 [`www.jqueryui.com/download/`](http://www.jqueryui.com/download/)\
  \ 单独下载。本章中的示例包含了包含所有可选缓动和 UI 组件的 jQuery UI。jQuery UI 文件包含在本书的源码材料下载中，可以从 [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 免费获取，并名为 `jQueryUI.js`。\n\n潜在的动画包括淡入、滑动、摇动以及全系列额外的效果。除了 jQuery 内置并包含的动画外，你还可以使用\
  \ jQuery 的 `animate()` 方法创建自己完全自定义的动画，这在“自定义动画”节中会有讨论。\n\n你还可以向 jQuery 的任何动画方法提供一个回调函数，该函数会在动画完成时执行。如果这不能提供足够的灵活性，你还可以提供一个配置对象，该对象支持一个全面的选项列表，涵盖了额外的回调函数场景，以及调整动画的所有方面。\n\
  \n接下来的示例演示了如何使用 jQuery 的 `show()`、`hide()` 和 `toggle()` 方法对显示和隐藏元素的过渡进行动画处理。`toggle()`\
  \ 方法顾名思义，在一个方法中涵盖了 `show()` 和 `hide()` 功能，根据动画开始时元素是否可见来来回切换。\n\n\n\n\n\n```html\n\
