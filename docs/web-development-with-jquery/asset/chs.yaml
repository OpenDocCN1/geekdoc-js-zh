  **图 20.1**\n\n此示例中的 HTML 设计允许作者尽可能少地指定关于幻灯片的信息。幻灯片的数量由插件自动计算，并按照它们在文档中出现的顺序进行切换。由于每个幻灯片都是\
  \ `div` 元素，你可以在每个幻灯片中包含任何喜欢的 HTML，包括营销信息的文本。幻灯片控件也由插件自动生成。\n\n本章剩余部分将详细检查此示例中的 JavaScript，解释每个部分如何组合成更大的插件。\n\
  \n\n\n\n\n你从一个简单的全局变量声明开始。\n\n```\nvar slideshows = [];\n```\n\n这个变量 `slideshows`\
  \ 包含了每个已创建的幻灯片对象实例，这使得在同一个 DOM 中拥有任意数量的幻灯片成为可能。\n\n下一段代码创建了一个名为 `$.slideshow()`\
  \ 的 jQuery 插件。与你目前看到的大多数 jQuery 插件不同，这个插件没有选项参数。你可以添加用于暂停幻灯片、销毁幻灯片等选项——即任何你想要添加的可配置参数。这样做只需为\
  \ jQuery 的 `$.slideshow()` 方法添加可选参数，然后决定这些参数如何作用于页面上为每个幻灯片实例实例化的、正确对应的 `slideshow()`\
  \ 对象即可。\n\n```\n$.fn.extend({\n    slideshow : function()\n    {\n        return\
  \ this.each(\n            function()\n            {\n                var node =\
  \ $(this);\n                if (typeof node.data('slideshow') === 'undefined')\n\
  \                {\n                    var slideCollection = slideshows.length\
  \ + 1;\n                    slideshows[slideCollection] =\n                    \
  \    new slideshow(node, slideCollection);\n                    node.data('slideshow',\
  \ slideCollection);\n                }\n            }\n        );\n    }\n});\n\
  ```\n\n目前，`$.slideshow()` 方法是在每个类名为 `slideshow` 的 HTML 元素上被调用的，这会在 DOM 准备就绪时自动发生。当调用\
  \ `$.slideshow()` 时，会根据已创建的幻灯片数量创建一个名为 `slideCollection` 的变量。该变量跟踪每个集合，并使得返回并引用已有的集合成为可能。文档中的每个幻灯片都从\
  \ 1 开始偏移编号，这些数据通过 jQuery data API 存储在每个幻灯片实例中。如果一个实例没有关联的 `slideshow` 数据，则说明它尚未被插件处理。这使得可以在文档或应用程序的生命周期内根据需要多次调用\
  \ `$.slideshow()` 插件方法来创建幻灯片。根据需要，新的幻灯片会被创建并添加到现有的幻灯片集合中。\n\n下一段代码摘自 John Resig（jQuery\
  \ 的作者）的网站。它提供了一个易于引用的工厂方法来创建原型对象，也就是说，一个可以反复实例化的单一对象，创建多个副本，每个副本都有自己独立的属性、定时器和设置。\n\
  \n```\n// 来自 John Resig 强大的类实例化代码。\n// http://ejohn.org/blog/simple-class-instantiation/\n\
  var hot = {\n    factory : function()\n    {\n        return function(args)\n  \
  \      {\n            if (this instanceof arguments.callee)\n            {\n   \
  \             if (typeof this.init == 'function')\n                {\n         \
  \           this.init.apply(this, args && args.callee? args : arguments);\n    \
  \            }\n            }\n            else\n            {\n               \
  \ return new arguments.callee(arguments);\n            }\n        }\n    }\n};\n\
  var slideshow = hot.factory();\n```\n\n下一段代码开始定义 `slideshow.prototype.init` 函数。当使用\
  \ `new slideshow(node, slideCollection)` 实例化幻灯片时，会执行 `slideshow.prototype.init`\
  \ 函数来创建一个新的 `slideshow` 对象副本。\n\n参数名称相同，以便你可以轻松将 `new slideshow(node, slideCollection)`\
  \ 与 `slideshow.prototype.init = function(node, slideCollection)` 关联起来。当创建一个新的 `slideshow`\
  \ 对象时，会创建一些变量来跟踪不同的状态。\n\n`this.counter` 属性跟踪当前正在显示的幻灯片。`this.isInterrupted` 属性跟踪幻灯片是否被用户点击幻灯片控制控件所中断。当幻灯片被中断时，幻灯将在用户点击查看的幻灯片上暂停\
  \ 5 秒，然后幻灯片会自动恢复播放。\n\n`this.transitioning` 属性跟踪是否正在发生动画过渡。该属性通过在当前动画完成之前忽略任何额外的动画请求，从而防止多个动画堆叠。\n\
  \n`this.resumeTimer` 属性保留了当用户中断幻灯片时创建的定时器引用。根据用户的操作，该定时器有时需要被清除或创建。\n\n```\nslideshow.prototype.init\
  \ = function(node, slideCollection)\n{\n    this.counter = 1;\n    this.isInterrupted\
  \ = false;\n    this.transitioning = false;\n    this.resumeTimer = null;\n```\n\
  \n下一行代码创建幻灯片控件。此时，创建的元素是一个类名为 `slideshowControls` 的 `<ul>` 元素；它还没有任何子元素。\n\n```\n\
  \ if (!node.find('ul.slideshowControls').length)\n    {\n        node.prepend(\n\
  \            $('<ul/>').addClass('slideshowControls')\n        );\n    }\n```\n\n\
