  \             .click();\n    }\n);\n```\n\n构成 `Example 3-1` 的文件集合在文件被加载到 Safari\
  \ 时，呈现出你在图 3.1 中看到的内容。\n\n![image](img/c03f001.jpg)\n\n图 3.1\n\n示例 3-1 展示了 `click()`\
  \ 方法的简单用法，既用于绑定回调方法，也用于触发事件。jQuery 的多数事件封装方法的工作方式与此完全相同，只有极少数例外，例如 `hover()` 这样的事件，它接受多个回调方法：一个用于\
  \ `mouseover` 事件，另一个用于 `mouseout` 事件。\n\n文档 `ready()` 事件方法也是封装事件方法的一个示例，它是 jQuery\
  \ 为 `DOMContentLoaded` 事件创建的。\n\n在示例中，你绑定了回调函数。你首先选择文档中所有类名为 `finderDirectory` 和\
  \ `finderFile` 的 `<div>` 元素。\n\n```javascript\n $('div.finderDirectory, div.finderFile').click(\n\
  \            function(event)\n            {\n                $('div.finderIconSelected')\n\
  \                    .removeClass('finderIconSelected');\n                $('span.finderDirectoryNameSelected')\n\
  \                    .removeClass('finderDirectoryNameSelected');\n            \
  \    $(this).find('div.finderIcon')\n                    .addClass('finderIconSelected');\n\
  \                $(this).find('div.finderDirectoryName span')\n                \
  \    .addClass('finderDirectoryNameSelected');\n            }\n```\n\n当 `click`\
  \ 事件触发且回调函数执行时，有一段逻辑用于处理视觉上的文件或文件夹选择。你首先取消选择，即选择类名为 `finderIconSelected` 的 `<div>`\
  \ 元素并移除它的 `finderIconSelected` 类。然后你对类名为 `finderDirectoryNameSelected` 的 `<span>`\
  \ 元素执行相同的操作。最后，函数会选择并为事件触发元素内部元素添加这些类名。\n\n## 绑定其他事件\n\njQuery 的事件 API 为大多数事件提供了封装方法，但某些事件并没有提供对应的方法。你可能会问是哪些事件？例如位于\
  \ HTML5 拖放 API 中的事件。jQuery 并没有像提供 `click()` 或 `mouseover()` 方法那样提供对应的 `dragstart()`\
  \ 或 `drop()` 方法。\n\n对于这些事件，你需要使用 `on()` 和 `off()` 方法，它们可以为任何命名的事件绑定事件处理程序。以下示例采用了\
  \ `Example 3-1` 中的脚本并将其重写，使用 `on()`、`off()` 和 `trigger()` 方法来代替每个事件相应的内置方法。\n\n\
  ```javascript\n$(document).on(\n    'DOMContentLoaded',\n    function()\n    {\n\
  \        $('div.finderDirectory, div.finderFile').on(\n            'click',\n  \
  \          function(event)\n            {\n                $('div.finderIconSelected')\n\
  \                    .removeClass('finderIconSelected');\n                $('span.finderDirectoryNameSelected')\n\
  \                    .removeClass('finderDirectoryNameSelected');\n            \
  \    $(this).find('div.finderIcon')\n                    .addClass('finderIconSelected');\n\
  \                $(this).find('div.finderDirectoryName span')\n                \
  \    .addClass('finderDirectoryNameSelected');\n            }\n        );\n    \
  \    $('div.finderDirectory, div.finderFile)\n            .filter(':first')\n  \
  \          .trigger('click');\n    }\n);\n```\n\n此示例的功能与 `Example 3-1` 完全相同；你可以在源代码材料中找到\
  \ `Example 3-2`。\n\n\n\n\n\n与其`$(document).ready()`，`$(document).on('DOMContentLoaded')`\
  \ 提供了相同的功能。你可以将 jQuery 的 `on()` 方法认为是接近标准的 `addEventListener()` 方法，如果你不使用 JavaScript\
  \ 框架，你会在 JavaScript 中使用该方法。它仅仅是内置了更多功能，使得处理事件变得变得简单得多。\n\n与其使用 `$('div.finderDirectory,\
  \ div.finderFile').click()`，你应该使用 `$('div.finderDirectory, div.finderFile').on('click')`。最后，为了触发一个事件的发生，与其直接调用事件方法（如\
  \ `click()`），不如调用 `trigger()` 方法并将事件名称作为参数传递，例如 `trigger('click')`。\n\n## 绑定持久化事件处理器\n\
  \njQuery 的 `on()` 和 `off()` 方法的一个方便且酷炫的特性是：它们允许将事件绑定到在创建事件处理器时可能还不存在的 DOM 节点上。在内部，该功能通过将事件绑定到\
  \ DOM 树中位置更高的节点来实现的，因此在事件处理器被处理和绑定时，这些较高的节点是已经存在的。\n\n例如，你可能会向 `document` 对象绑定一个\
  \ `click` 事件。然后，通过向 `on()` 方法的第二个参数提供选择器，你创建了一个持久化事件处理器，它仅适用于选择器描述的节点。这些由选择器描述的节点在创建事件处理器时可能存在也可能不存在；唯一的限制是这些节点必须存在于事件处理器所绑定的对象内部。\n\
  \n然后利用事件传播，事件会发生并沿着 DOM 树向上泡到事件处理器绑定的元素上。jQuery 会持续检查 `event.target` 属性，查看接收事件的节点是否由你提供的选择器描述。如果是，它就会应用该事件处理器。\n\
  \n以下示例可以在源材料中找到 `Example 3-3`，它结合了前两个示例并实现了持久化事件的概念。（jQuery 的文档也曾将此概念称为 `live` 事件。）我们开始修改\
  \ HTML，以便在创建事件处理器之后可以添加一些文件。\n\n```\n<!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n\
