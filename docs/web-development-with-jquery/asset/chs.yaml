  ```\n\n之前的 HTML 使用以下 CSS 进行样式设置：\n\n```css\nbody {\n    font: 16px sans-serif;\n\
  }\nfieldset {\n    background: #93cdf9;\n    border: 1px solid rgb(200, 200, 200);\n\
  }\nfieldset div {\n    padding: 10px;\n    margin: 5px 0;\n}\nfieldset label {\n\
  \    float: left;\n    width: 200px;\n}\ndiv#addressCountryWrapper img {\n    position:\
  \ relative;\n    top: -4px;\n}\ndiv#addressCountryWrapper {\n    text-align: right;\n\
  }\n```\n\n然后，文档包含了以下 JavaScript：\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n        $('select#addressCountry').click(\n            function()\n    \
  \        {\n                $.get(\n                    'Example 7-1/' + this.value\
  \ + '.xml',\n                    function(xml)\n                    {\n        \
  \                // 使用 jQuery 查询 XML\n                        xml = $(xml);\n  \
  \                      // 获取 ISO2 值，用于旗帜的文件\n                        var iso2 =\
  \ xml.find('iso2').text();\n                        // 切换旗帜图像\n                \
  \        $('div#addressCountryWrapper img').attr({\n                           \
  \ alt: xml.find('name'),\n                            src: 'flags/' + iso2.toLowerCase()\
  \ + '.png'\n                        });\n                        // 移除所有选项\n   \
  \                     $('select#addressState').empty();\n                      \
  \  // 设置州/省...\n                        xml.find('state').each(\n              \
  \              function()\n                            {\n                     \
  \           $('select#addressState').append(\n                                 \
  \   $('<option/>')\n                                        .attr('value', $(this).attr('id'))\n\
  \                                        .text($(this).text())\n               \
  \                 );\n                            }\n                        );\n\
  \                        // 修改标签\n                        $('label[for=\"addressState\"\
  ]').text(\n                            xml.find('label').text() + ':'\n        \
  \                );\n                    },\n                    'xml'\n       \
  \         );\n            }\n        );\n        $('select#addressCountry').click();\n\
  \    }\n);\n```\n\n然后，为了让 AJAX 请求成功，你需要为响应内容创建一些 XML 文件。当你更改 `<select>` 元素中的国家时，会通过\
  \ GET 方法发送针对 *Example 7-1/<addressCountry>.xml* 文件的请求，其中 `<addressCountry>` 是从下拉列表中选择的国家数字\
  \ ID。我为 ID 分别为 38、222 和 223 的国家准备了 XML 文件，它们分别是加拿大、英国和美国的 ID。每个 XML 文件看起来如下，这是加拿大的：\n\
  \n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n\
  <country>\n    <name>Canada</name>\n    <iso2>CA</iso2>\n    <iso3>CAN</iso3>\n\
  \    <label>Province</label>\n    <state id='0'> </state>\n    <state id=\"66\"\
  >Alberta</state>\n    <state id=\"67\">British Columbia</state>\n    <state id=\"\
  68\">Manitoba</state>\n    <state id=\"69\">Newfoundland</state>\n    <state id=\"\
  70\">New Brunswick</state>\n    <state id=\"71\">Nova Scotia</state>\n    <state\
  \ id=\"72\">Northwest Territories</state>\n    <state id=\"73\">Nunavut</state>\n\
  \    <state id=\"74\">Ontario</state>\n    <state id=\"75\">Prince Edward Island</state>\n\
  \    <state id=\"76\">Quebec</state>\n    <state id=\"77\">Saskatchewan</state>\n\
  \    <state id=\"78\">Yukon Territory</state>\n</country>\n```\n\n每个 XML 文件的结构完全相同，提供了国家名称、ISO2\
  \ 和 ISO3 国家代码、一个标签以及行政区划列表。我简单地将它们称为 `states`（州），尽管这在技术上并不总是准确；加拿大的这些区域被称为“省”（provinces），而英国的被称为“郡”（counties）。\n\
  \n上一个示例看起来就像你在图 7.1 中看到的内容，当你从国家下拉列表中选择英国时。\n\n![image](img/c07f001.jpg)\n\n**图\
  \ 7.1**\n\n在 JavaScript 文件中，通过为 id 名称为 `addressCountry` 的 `<select>` 元素添加 `click`\
  \ 事件来开始执行。在 `click` 事件的处理器函数内部，你使用 jQuery 的 `$.get()` 方法开始 AJAX 请求。第一个参数指定了你想要请求的路径，即\
  \ XML 文件，并动态替换文件名中的国家 ID。第二个参数是一个回调函数，当你的脚本接收到服务器响应时执行它；第三个参数是你想要进行的 AJAX 请求类型。有关需\
  \ `$.get()` 方法 API 的完整概述，请参阅附录 G“AJAX 方法”。\n\n你指定的回调方法有一个参数，`xml`。该变量包含了服务器返回的 XML\
  \ 数据。然后，这些数据被转换为一个 jQuery 对象，这使得从其中提取数据变得简单得多：\n\n```javascript\n // 使用 jQuery 使\
  \ XML 变为可查询\n                        xml = $(xml); \n```\n\n接下来的任务是从 XML 文档中获取 ISO2\
  \ 代码，它被用于获取所选国家更新后的旗帜：\n\n```javascript\n // 获取 ISO2 值，它被用于\n                  \
  \       // 旗帜的文件名。\n                        var iso2 = xml.find('iso2').text();\n\
  ```\n\n就像你在普通 HTML 文档中做的那样，你可以使用 jQuery 的 `find()` 方法定位 XML 元素 `<iso2>`，并通过 jQuery\
  \ 的 `text()` 方法检索其文本内容。在我创建了 XML 文件的这三个国家语境下，`iso2` 变量将包含加拿大的 CA、英国的 GB 或美国的 US。下一步是设置引用国家旗帜的\
  \ `<img>` 元素的 `alt` 和 `src` 属性：\n\n```javascript\n // 切换旗帜图像\n                 \
  \       $('div#addressCountryWrapper img').attr({\n                            alt\
  \ : xml.find('name'),\n                            src : 'flags/' + iso2.toLowerCase()\
  \ + '.png'\n                        });\n```\n\n通过查询 DOM 找到一个 `id` 属性值为 `addressCountryWrapper`\
  \ 的 `<div>` 元素，然后在其中找到 `<img>` 元素，从而定位了该元素。然后，使用 jQuery 的 `attr()` 方法设置 `<img>`\
  \ 元素的 `src` 和 `alt` 属性，并根据本书源码下载材料中的文件结构定义旗帜的路径。接着追加文件名，并将 ISO2 代码转换为小写，因为每幅旗帜图像都使用小写字母命名。这对于某些服务器（如\
  \ Windows 或某些不区分大小写的 Mac 服务器）可能不是问题，但 UNIX 和 Linux 服务器（包括某些 Mac 服务器，取决于 Mac 的格式化方式）对大小写敏感，文件名的大小写错误会导致图像无法加载。\n\
  \n下一步是移除所有的州选项。首先，查询 id 名称为 `addressState` 的 `<select>` 元素，然后调用 jQuery 的 `empty()`\
  \ 方法移除所有选项。\n\n```javascript\n // 移除所有选项\n                        $('select#addressState').empty();\
  \ \n```\n\n下一步是将 XML 文件中的行政区划作为选项添加。jQuery 的 `find()` 方法定位 XML 文件中所有的 `<state>`\
  \ 元素。然后使用 `each()` 方法遍历每个 `<state>` 元素。\n\n```javascript\n // 设置各个州... \n      \
  \                  xml.find('state').each(\n                            function()\n\
  \                            { \n```\n\n现在，你创建每个 `<option>` 元素并将每个元素追加到 `<select>`\
  \ 元素中：\n\n```javascript\n $('select#addressState').append(\n                   \
  \                 $('<option>')\n                                        .attr('value',\
  \ $(this).attr('id'))\n                                        .text($(this).text())\n\
  \                                );\n```\n\n因为你在回调函数内部工作，`this` 被封装在了一个 jQuery 对象\
  \ `$(this)` 中。你为每个 `<option>` 设置了值，该值是每个 `<state>` 元素中的唯一 ID。剩下的工作就是设置“州”的标签。\n\n\
  由于加拿人使用“省”，英国人使用“郡”，而美国人使用“州”，你需要使用正确的标签，它位于 XML 文件中。为了找到想要修改的 `<label>` 元素，你需要查询\
  \ DOM 中 `for` 属性值为 `addressState` 的 `<label>` 元素。\n\n```javascript\n // 修改标签\n \
  \                       $('label[for=\"addressState\"]').text(\n               \
  \             xml.find('label').text() + ':'\n                        );\n```\n\n\
  正如前面的示例所示，jQuery 在 AJAX 处理能力方面表现出色。使用传统的 JavaScript 和 DOM 方法，上述操作将变得冗长且难以实现。jQuery\
  \ 绑定响应的能力使得解析和处理 XML 文档像处理 HTML 文档一样简单。\n\n#### 在请求时发送数据\n\n假设在上一个示例中，你实际上是在与数据库驱动的服务器交互；在这种情况下，构建请求的方式与前面的示例略有不同。你不再使用国家\
  \ ID 动态创建要检索的 XML 文件名，而是需要单独传递该信息。jQuery 在 `$.get()` 方法中支持传递数据。在上一个示例的语境下，你发起的 `$.get()`\
  \ 方法调用如下（为了便于理解，删减了额外的代码）：\n\n```javascript\n $.get(\n                    'Example\
  \ 7-1/38.xml',\n                    function(xml)\n                    {\n     \
  \                   // snip\n                    },\n                    'xml'\n\
  \                );\n```\n\n\n\n\n第一个参数是你要请求的文件路径——这可以是任何 URL 值。通常，你可能希望引用某个服务器端脚本，该脚本可以为你输出数据。第二个参数是服务器响应\
  \ XML 将传递到的回调函数，第三个参数是所执行的请求类型，它是以下字符串之一：`'xml'`、`'html'`、`'script'`、`'json'`、`'jsonp'`\
  \ 或 `'text'`。该参数根据你期望从服务器返回的数据类型进行设置。\n\n当你想要在请求中发送额外数据时，会添加另一个参数：\n\n```javascript\n\
  \ $.get(\n                    'Example 7-1/38.xml', {\n                        countryId\
  \ : 223,\n                        iso2 : 'US',\n                        iso3 : 'USA',\n\
  \                        label : 'State'\n                    },\n             \
  \       function(xml)\n                    {\n                        // snip\n\
  \                    },\n                    'xml'\n                );\n```\n\n\
  新参数位于文件名之后、函数引用之前，这是一个对象字面量，包含了你想通过 GET 请求传递给服务器的数据。在前面的的示例中，我将文件名修改为简单的 `Example\
  \ 7-1/38.xml`，并创建了一个具有四个属性 `countryId`、`iso2`、`iso3` 和 `label` 的对象字面量。因此，在后台，此修改会导致向服务器的请求如下：\n\
  \n```\nExample%207-1/38.xml?countryId=223&iso2=US&iso3=USA&label=State\n```\n\n\
  jQuery 获取对象字面量中的项并据此构建 GET 请求。由于 GET 请求将数据作为你所调用的 URL 的一部分，数据会被附加到 URL 的末尾。URL 中的问号表示后面是\
  \ GET 请求数据；然后值以名称/值对的形式传递，其中每个名称和值之间用等号分隔。如果有多个值，则会通过在上一个名称/值对之后添加 `&` 字符来后续添加额外的值。然后，这些数据会被编码以传输到\
  \ HTTP 服务器。当到达 HTTP 服务器后后，如何访问这些数据取决于你用于读取它的服务器端语言。\n\n### 请求 JSON 格式的数据\n\n本节重新回顾了上一节的示例，但这次使用\
  \ JSON 作为数据传输的格式而不是 XML。我可以使用相同的 jQuery 方法 `$.get()` 来实现这一点，并将最后一个参数从 `'xml'` 改为\
  \ `'json'`，但 jQuery 提供了另一个名为 `$.getJSON()` 方法用于获取 JSON 格式的数据。该方法与 `$.get()` 方法相似，不同之处服务器返回的数据格式显然预期为\
  \ JSON。\n\n使用 JSON 作为数据传输格式使得代码比 XML 更加精简且易处理，同时显著减少了服务器响应的大小。接下来的示例与你在上一节看到的示例相同，当你从下拉菜单中选择加拿大、美国或英国时，旗帜、行政区划和行政划分标签都会切换，显示与你正在查看的国家相关的数据。HTML\
  \ 部分保持不变，仅对 JavaScript 部分进行了少量修改。此示例在源码材料中名为 `Example 7-2`。\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        $('select#addressCountry').click(\n            function()\n\
  \            {\n                $.getJSON(\n                    'Example 7-2/' +\
  \ this.value + '.json',\n                    function(json)\n                  \
  \  {\n                        // 切换旗帜图像\n                        $('div#addressCountryWrapper\
  \ img').attr({\n                            alt : json.name,\n                 \
  \           src : 'flags/' + json.iso2.toLowerCase() + '.png'\n                \
  \        });\n                        // 移除所有选项\n                        $('select#addressState').empty();\n\
  \                        // 设置州... \n                        $.each(\n         \
  \                   json.states,\n                            function(id, state)\n\
  \                            {\n                                $('select#addressState').append(\n\
  \                                    $('<option/>')\n                          \
  \              .attr('value', id)\n                                        .text(state)\n\
  \                                );\n                            }\n           \
  \             );\n                        // 修改标签\n                        $('label[for=\"\
  addressState\"]').text(\n                            json.label + ':'\n        \
  \                );\n                    }\n                );\n            }\n\
  \        );\n        $('select#addressCountry').click();\n    }\n);\n```\n\n在前面的\
  \ JavaScript 中，其功能与你在上一节看到的服务器响应格式为 XML 的示例类似。然而，这次你使用 `$.getJSON()` 方法而不是 `$.get()`\
  \ 方法来发起 AJAX 请求。图 7.2 显示了结果。\n\n这两个方法非常相似，不同之处在于使用 `$.getJSON()` 方法不需要指定最后一个参数来指定服务器响应的格式。另一个区别是你请求的是带有\
  \ `.json` 扩展的文件而不是 `.xml` 文件。此外，与上一个示例一样，请求的文件取决于从下拉菜单中选择了哪个国家。在请求的文件中，JSON 格式化如下：\n\
  \n```json\n{\n    \"name\" : \"Canada\",\n    \"iso2\" : \"CA\",\n    \"iso3\" :\
  \ \"CAN\",\n    \"label\" : \"Province\",\n    \"states\" : {\n        \"0\" : \"\
  Alberta\",\n        \"1\" : \"British Columbia\",\n        \"2\" : \"Manitoba\"\
  ,\n        \"3\" : \"Newfoundland\",\n        \"4\" : \"New Brunswick\",\n     \
  \   \"5\" : \"Nova Scotia\",\n        \"6\" : \"Northwest Territories\",\n     \
  \   \"7\" : \"Nunavut\",\n        \"8\" : \"Ontario\",\n        \"9\" : \"Prince\
  \ Edward Island\",\n        \"10\" : \"Quebec\",\n        \"11\" : \"Saskatchewan\"\
  ,\n        \"12\" : \"Yukon Territory\"\n    }\n}\n```\n\n![image](img/c07f002.jpg)\n\
  \n**图 7.2**\n\n如你所见，JSON 格式使用了你已经熟悉的对象字面量语法。整个对象封装在大括号中，但没有命名，这使得像 jQuery 这样的框架能够获取\
  \ JSON 格式的数据并将其直接赋值给对象。在 JavaScript 中，前面的 JSON 作为 `json` 参数传递给 `$.getJSON()` 方法事件处理器。你在\
  \ JSON 格式文档中看到的所有数据都可以通过 `json` 变量访问。你通过 `json.iso2` 获取 ISO2 信息，通过 `json.label`\
  \ 获取标签，通过 `json.states` 获取状态数组。使用 JSON，你删除了在处理 XML 数据时可能需要的步骤，即对响应中的数据进行查询；对于 JSON，数据被直接馈给对象并立即可用。此外，注意\
  \ JSON 文件比冗长的 XML 文档精简得多。\n\n与 `$.get()` 方法一样，如果你想向服务器传递数据，可以在相同的可选数据参数中提供该数据。\n\
  \n\n\n\n\n在 jQuery 中的 POST 请求与 GET 请求是相同的，区别在于方法的名称。你不是使用 `$.get()`，而是使用 `$.post()`。由于\
  \ POST 方法请求留用于以某种方式修改数据状态，因此你可能在大多数情况下都想随 POST 请求一起传递一些数据，而这些数据可能来自某种表单。jQuery 能够轻松获取表单数据并将其传递给服务器。jQuery\
  \ 为此提供的方法是 `serialize()`。`serialize()` 方法获取你指定的输入元素（包括 `<input>`、`<textarea>` 和\
  \ `<select>` 元素）的数据，并将这些字段中的值处理为查询字符串。如果你没有选择任何元素进行序列化，而是选择一个 `<form>` 元素，jQuery\
  \ 会自动序列化在该 `<form>` 元素找到的所有 `<input>`、`<textarea>` 和 `<select>` 元素。示例 7-3 显示更新后的\
  \ JavaScript 代码：\n\n```javascript\n$(document).ready(\n    function()\n    {\n \
  \       $('select#addressCountry').click(\n            function()\n            {\n\
  \                $.getJSON(\n                    'Example 7-3/' + this.value + '.json',\n\
  \                    function(json)\n                    {\n                   \
  \     // 切换旗帜图片\n                        $('div#addressCountryWrapper img').attr({\n\
  \                            alt : json.name,\n                            src :\
  \ 'flags/' + json.iso2.toLowerCase() + '.png'\n                        });\n   \
  \                     // 移除所有选项\n                        $('select#addressState').empty();\n\
  \                        // 设置州... \n                        $.each(\n         \
  \                   json.states,\n                            function(id, state)\n\
  \                            {\n                                $('select#addressState').append(\n\
  \                                    $('<option/>')\n                          \
  \              .attr('value', id)\n                                        .text(state)\n\
  \                                );\n                            }\n           \
  \             );\n                        // 修改标签\n                        $('label[for=\"\
  addressState\"]').text(\n                            json.label + ':'\n        \
  \                );\n                    }\n                );\n            }\n\
  \        );\n        $('select#addressCountry').click();\n        $('input#addressButton').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                $.post(\n                    'Example 7-3/POST.json',\n       \
  \             $('form').serialize(),\n                    function(json)\n     \
  \               {\n                        if (parseInt(json) > 0)\n           \
  \             {\n                            alert('Data posted successfully.');\n\
  \                        }\n                    },\n                    'json'\n\
  \                );\n            }\n        );\n    }\n);\n```\n\n进行上述修改，加载新文档并点击保存按钮。你应该看到类似图\
  \ 7.3 的内容。\n\n![image](img/c07f003.jpg)\n\n图 7.3\n\n为你名为 `addressButton` 的 `<input>`\
  \ 元素添加了一个新事件。当你点击 `<input>` 元素时，将使用 jQuery 的 `$.post()` 方法发起 POST 请求。当然，你没有设置 HTTP\
  \ 服务器来传输这些数据，因此，你只需引用一个静态 JSON 文件，它可以让你知道至少在请求指定文档方面 POST 请求成功了。在 `$.post()` 方法的第二个参数中，你提供了要传输到服务器的数据，就像你在前两个节中看到的\
  \ `$.get()` 和 `$.getJSON()` 方法可以做的那样。然而，除了支持对象字面量外，你还可以提供一个经过 URL 编码的键值对的序列化字符串。这就是\
  \ `serialize()` 方法提供的；它对键值对进行编码并从它们创建 URL 编码字符串。当你选择 `<form>` 元素时，它会自动在 `<form>`\
  \ 元素内搜索所有的 `<input>`、`<textarea>` 和 `<select>` 元素。你也可以通过显式选择这些元素来具体告诉你想序列化的 `<input>`、`<textarea>`\
  \ 或 `<select>` 元素。该选择会被传递给 jQuery 的 `serialize()` 方法，该方法从各种输入元素中找到正确的名称和值，并按如下格式格式数据：\n\
  \n```\naddressCountry=223\n&addressStreet=123+Main+Street\n&addressCity=Springfield\n\
  &addressState=23\n&addressPostalCode=12345\n```\n\n这些数据在传递给 `serialize()` 时是以连续行的形式出现的；这里添加了一些换行符以便字符串更具读性。这些数据现在准备好发送到服务器，因此你只需要在\
  \ `$.post()` 方法的 data 参数中传递这些格式化数据即可。这对于 jQuery 的其他 AJAX 请求方法同样有效，而且 jQuery 足够智能，能够识别你是在传递对象字面量（正如我之前演示的那样），还是在像这里这样传递一个格式化的查询字符串。然后，在服务器端，你只需要像往常处理\
  \ POST 请求数据一样访问提交的数据即可。\n\n## 从服务器加载 HTML 片段\n\n在之前的几个节中，你已经学习了如何使用 XML 和 JSON 数据传输格式从服务器请求数据。从服务器到客户端异步传输数据的另一种流行方法是通过\
  \ HTML 片段（HTML snippets）。使用这种方法，你可以根据需要请求小块的 HTML，而不需要包含 `<html>`、`<head>` 和 `<body>`\
  \ 标签。\n\n接下来的示例 7-4 演示了如何使用 jQuery 的 `load()` 方法加载 HTML 片段：\n\n\n\n\n\n# 模块概述\n\n\
  ## 1. 初始化配置\n\n在项目启动时，首先需要进入 `/etc/config` 目录并找到 `config.json` 文件。你可以通过 `cat config.json`\
  \ 命令查看其内容。\n\n在表达式 `result = process(data, timeout)` 中，函数 `process()` 接收 `data`\
  \ 和 `timeout` 参数，并返回处理结果 `result`。\n\n## 2. 接口调用\n\n在 `UserManager.connect(\"user123\"\
  )` 中，`UserManager` 类的实例方法 `connect()` 接收一个用户 ID，并返回一个连接状态对象。\n\n之后我们这样调用 `npm start`\
  \ 命令：\n\n```bash\nnpm start --production\n```\n\n## 3. 逻辑处理\n\n```javascript\nif\
  \ (statusVar > 200) {\n    console.log(\"Request successful\");\n}\n```\n\n\n\n\n\
  `load()` 方法的其他工作原理与 jQuery 提供的其他 AJAX 请求方法类似：你可以在第一个参数中指定想要请求的文档的 `URL`。你可以包含一个可选的第二个参数，其中包含你想要通过\
  \ `GET` 请求发送到服务器的数据，而第三个参数是一个回调函数，会在请求成功后执行。提供发送到服务器的数据以及指定回调函数都是可选的——如果你愿意，也可以只带一个\
  \ `URL` 调用 `load()` 方法，这同样可以工作。\n\n服务器返回一个 HTML 片段，该片段被直接加载到文档中。以下是加载的 HTML 片段的示例：\n\
  \n```\n<ul data-id=\"31490s\">\n    <li class=\"folderTreeDirectoryBranch\">\n \
  \       <div class=\"folderTreeDirectory\" data-id=\"31491s\" title=\"/Users/Shared\"\
  >\n            <div class=\"folderTreeIcon\"></div>\n            <span>Shared</span>\n\
  \        </div>\n        <img src=\"tree/right.png\"\n             class=\"folderTreeHasChildren\"\
  \ data-id=\"31491s\" alt=\"+\"\n             title=\"Click to expand.\" />\n   \
  \     <div class=\"folderTreeBranchWrapper\"></div>\n    </li>\n    <li class=\"\
  folderTreeDirectoryBranch folderTreeServer\">\n        <div class=\"folderTreeDirectory\"\
  \ data-id=\"698482s\" title=\"/Users/johnappleseed\">\n            <div class=\"\
  folderTreeIcon\"></div>\n            <span>johnappleseed</span>\n        </div>\n\
  \        <img src=\"tree/right.png\"\n             class=\"folderTreeHasChildren\"\
  \ data-id=\"698482s\" alt=\"+\"\n             title=\"Click to expand.\" />\n  \
  \      <div class=\"folderTreeBranchWrapper\"></div>\n    </li>\n</ul>\n```\n\n\
  上述是点击 `/Users` 文件夹的箭头时加载的 HTML 片段。我为每个顶层文件夹准备了 HTML 片段。在本书的源码下载中，这些每一个片段都使用数字目录\
  \ id 命名。例如，`/Applications` 的 id 为 `5175`，`/Library` 的 id 为 `5198`，依此类推。这些数字 id 都嵌入在每个文件夹结构中类名为\
  \ `folderTreeDirectory` 的 `<div>` 元素的 `data-id` 属性中。在请求文件夹内容时，通过以下代码提取嵌入的数字 id：\n\
  \n```\n$(this).prev().data('id')\n```\n\n上述代码从 `<<img>` 元素开始，这是点击发生的地方，也是代码中的 `$(this)`\
  \ 部分。然后你使用 `prev()` 方法导航到上一个兄弟元素，并使用 `data('id')` 访问其 `id` 属性。这用于构造要加载的 HTML 片段的文件名，这通常不会作为静态\
  \ HTML 文件被请求——对于此类操作，你希望服务器端脚本来处理这些工作。每个 HTML 片段都位于名为 `Example 7-4` 的子文件夹中。\n\n\
  请求完成后，将执行以下回调函数：\n\n```\n function()\n                        {\n              \
  \              $(this)\n                                .show()\n              \
  \                  .prev()\n                                .attr('src', arrow);\n\
  \                        }\n```\n\n回调函数在类名为 `folderTreeBranchWrapper` 的 `<div>`\
  \ 元素的上下文中执行；`this` 指该 `<div>` 元素。默认情况下，所有类名为 `folderTreeBranchWrapper` 的 `<div>`\
  \ 元素通过样式表中的 `display: none` 被隐藏；调用 jQuery 的 `show()` 方法可以使 `<div>` 可见。现在剩下的唯一工作是将箭头的方向从向右指改为向下，以指示文件夹已打开，这就是回调函数中第二部分代码的作用。它更改了\
  \ `<div>` 元素的前一个兄弟元素中 `src` 属性引用的图像，即承载箭头的 `<img>` 元素。\n\n接下来是如果文件夹已经加载的情况处理：\n\n\
  ```\n }\n                else\n                {\n                    $(this).next().toggle();\n\
  \                    if ($(this).attr('src').indexOf('down') != -1)\n          \
  \          {\n                        arrow = 'tree/right.png';\n              \
  \      }\n                    $(this).attr('src', arrow);\n                }\n```\n\
  \n如果文件夹已经存在，你希望在每次点击箭头时切换文件夹的显示状态。`$(this).next().toggle()` 调用正是这一点：如果 `<div>` 元素是可见的，它就会变为不可见，反之亦然。第二部分代码通过在\
  \ `right.png` 和 `down.png` 图像之间切换切换箭头的方向。\n\n## 动态加载 JavaScript\n\njQuery 的另一个有用且创新的特性是可以使用其\
  \ AJAX API 动态且异步地加载 JavaScript 文档。正如第 1 章 “jQuery 简介”中所提到的，将 JavaScript 开发拆分为更小、更易理解且任务集中的模块是一项推荐的最佳实践。另一种与模块化\
  \ JavaScript 开发相辅的技术是：在初始页面加载时加载最少需要的 JavaScript，并在需要时通过 AJAX 动态加载额外的 JavaScript，以节省页面加载时间并提高应用程序的响应速度。\n\
  \n除了模块化 JavaScript 开发，你可能想通过 AJAX 加载 JavaScript 的另一个原因是让 JavaScript 根据用户操作发生动态变化，或者当你需要加载根据用户输入或上下文变化的更复杂的应用程序时。\n\
  \n无论你发现此功能有什么用途，在本节中，我将带你介绍 jQuery 提供的通过 `$.getScript()` 方法通过 AJAX 接口加载 JavaScript\
  \ 的 API。以下示例演示了如何异步加载整个 jQuery UI API，然后使用该 API 产生一个在两种颜色之间过渡的动画。这将在后续文档 *Example\
  \ 7-5* 中演示：\n\n\n\n\n\n```html\n<!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n\
  \        <meta charset='utf-8' />\n        <title>2013 年 11 月</title>\n        <script\
