  \ = file.fileSize;\n        }\n```\n\n第一部分归一化了 `file` 对象，在那些制造商偏好较长属性名的浏览器中，将 `file.fileName`\
  \ 属性移动到 `file.name`，将 `file.fileSize` 属性移动到 `file.size`。然后通过调用 `push()` 将文件对象添加到\
  \ `this.files` 数组中。\n\n```\n this.files.push(file);\n```\n\n下一行代码通过调用 `clone(true)`\
  \ 克隆类名为 `finderDragAndDropDialogueTemplate` 的 `<tr>` 元素，该元素最终会被包含每个上传文件摘要数据的 `<table>`\
