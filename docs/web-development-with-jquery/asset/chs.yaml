  \ 中较于 `Example 11-1` 新部分的分析。\n\n## 添加文件信息数据对象\n\n第一个新部分是创建一个名为 `dragAndDrop` 的新\
  \ JavaScript 对象。这个新对象包含了实现拖放文件上传的大部分逻辑。你定义了两个新属性 `path` 和 `files`，它们用于跟踪你正在上传的文件路径以及你上传到该位置的文件。你创建的\
  \ `dragAndDrop` 对象的第一个方法是 `openProgressDialogue()`。（Dialogue 采用了英式拼写，而不是美式拼写，这仅仅是个人的习惯。）\n\
  \n```\ndragAndDrop = {\n    path : null,\n    files : [],\n    openProgressDialogue\
