  }\nth.headerSortUp span.tableSorterAscending {\n    display: inline;\n}\n```\n\n\
  最后，使用以下 JavaScript 启用表格排序：\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n        $('table').tablesorter();\n    }\n);\n```\n\n上述示例创建了你在 图 19.1 中看到的屏幕截图。\n\
  \n![image](img/c19f001.jpg)\n\n**图 19.1**](#c19.xhtml_c19-fig-anc-0001)\n\n图 19.2\
  \ 显示了如何按多个列进行排序。要此操作，点击列标题对第一列排序；然后按住 Shift 键点击第二个列标题。\n\n![image](img/c19f002.jpg)\n\
  \n**图 19.2**](#c19.xhtml_c19-fig-anc-0002)\n\n\n\n\n\n此示例主要关于如何设置正确的 HTML，然后使用 CSS\
  \ 对其进行样式处理。一旦应用 `$.tablesorter()` 插件，它的默认功能将提供其余部分。\n\n你可以使用附录 T 中记录的选项来自定义 `$.tablesorter()`\
  \ 的多个方面。例如，你可以使用 `sortMultiSortKey` 选项来更改选择第二列进行排序时需要按的键盘按键。默认值为 `'shiftKey'`；若要将其更改为\
  \ Option 键（Mac 上）或 Alt 键（Windows 上），你需要将值更改为 `'altKey'`。\n\n```javascript\n $('table').tablesorter({\n\
  \            sortMultiSortKey : 'altKey'\n        });\n```\n\n你还可以使用 `cssHeader`、`cssAsc`\
  \ 和 `cssDesc` 选项更改应用到 `<th>` 元素的类名。`cssHeader` 的默认值是 `header`。`cssAsc` 的默认值是 `headerSortUp`，`cssDesc`\
  \ 的默认值是 `headerSortDown`。\n\n```javascript\n $('table').tablesorter({\n        \
  \    sortMultiSortKey : 'altKey',\n            cssHeader : 'tableSorterHeader',\n\
  \            cssAsc : 'tableSorterAscending',\n            cssDesc : 'tableSorterDescending'\n\
  \        });\n```\n\n最后，如果你的表格单元格中包含额外的标记，你需要使用 `textExtraction` 选项来考虑这些标记。`textExtraction`\
  \ 选项可以是字符串 `'simple'`，也可以是一个回调函数。无论你使用哪种方法，它都应该尽可能快速且经过优化。提供的默认方法会很慢，因为它使用了 jQuery\
  \ 以及随之而来的大量函数调用链。\n\n```javascript\n $('table').tablesorter({\n            sortMultiSortKey\
  \ : 'altKey',\n            cssHeader : 'tableSorterHeader',\n            cssAsc\
  \ : 'tableSorterAscending',\n            cssDesc : 'tableSorterDescending',\n  \
  \          textExtraction : function(node)\n            {\n                return\
  \ $(node).text();\n            }\n        });\n```\n\n表格的初始排序由 `sortList` 选项控制。该选项允许你提供一个数组，描述在应用\
  \ `$.tablesorter()` 插件后如何对表格排序。默认行为是在用户显式点击表头进行排序之前，不更改表格的排序。以下示例默认对表格进行排序，方式与图\
  \ 19.2 中的相同，即先按“专辑名称”升序排序，再按“名称”升序排序。\n\n```javascript\n $('table').tablesorter({\n\
  \            sortList : [\n                [2, 0],\n                [1, 0]\n   \
  \         ]\n        });\n```\n\n每一列都通过数字引用，从零开始偏移。第一个排序的列是第三列。然后你通过指定 `0` 表示升序、`1`\
  \ 表示降序来指定排序方向。因此，`[2, 0]` 对第三列进行升序排序，`[1, 0]` 然后对第二列进行升序排序。\n\n自定义 `$.tablesorter()`\
  \ 插件实现的其他选项可以在附录 T 中找到。\n\n## 总结\n\n使用 `$.tablesorter()` 插件是一个简单直观的体验，只需将插件代码添加到文档中，然后在任何你想要可排序的\
  \ `<table>` 元素上启用 `$.tablesorter()`。\n\n在本章中，你学习了表格排序的开箱即用体验包含了对一或多列进行排序的能力。要实现这一点，只需要正确的\
  \ HTML 结构和一些 CSS。\n\n你学习了可以使用 `sortMultiSortKey` 选项轻松地自定义选择多列的快捷键。\n\n你还学习了 `$.tablesorter()`\
  \ 用于 `<th>` 元素的各种类名可以通过 `cssHeader`、`cssAsc` 和 `cssDesc` 选项进行自定义。\n\n如果你有一个更复杂的表格并在表格单元格中使用了标记，你可以使用\
  \ `textExtraction` 选项控制如何从每个单元格中提取文本进行排序。你可以使用 `'simple'` 方法，它会直接获取单元格的内容，无论其中是否包含标记。你也可以使用回调函数，显式地指定你希望如何提取文本。例如，你可以自己遍历\
  \ DOM 并直接使用 JavaScript API 获取文本节点，而不是使用 jQuery。\n\n最后，`sortList` 选项定义了在应用 `$.tablesorter()`\
  \ 插件时，默认情况下如何对表格进行排序。\n\n## 练习\n\n1. 表格默认是如何排序的？\n\n2. 你将如何使用 Mac 或 Windows 键盘上的\
  \ Control 键作为选择第二列进行排序时的按键？\n\n3. 你将如何自定义 `$.tablesorter()` 插件用于 `<th>` 元素的类名？\n\
  \n## 第 20 章\n\n创建一个交互式幻灯片\n\n幻灯片在今天的首页上非常常见。通常情况下，你有三个或多个面板设置为在幻灯片之间自动切换，一个接一个。当幻灯片结束时，它会重新。这些幻灯片通常用于营销，展示多个\
  \ banner。\n\n在本章中，你将学习如何使用我为开源 PHP 框架 Hot Toddy 编写幻灯片插件。它没有选项，但演示了如何创建一个可重用的 jQuery\
  \ 插件，该插件可以适应单个页面上插件的多个实例。\n\n## 创建幻灯片\n\n在本节中，你将同时学习如何使用插件创建幻灯片，以及如何编写插件本身。我创建的插件仅提供幻灯片之间的淡入淡出过渡。你的目标是理解插件的工作原理，以便根据你的需求对其进行修改，使其包含不同的动画。\n\
  \n幻灯片的原理很简单：提供两个或多个相互切换的帧。幻灯片的数量是可变的；你可以包含任意数量的内容，插件会自动对它们进行编号并在它们之间切换。\n\n该插件的设计考虑了在同一页面上存在多个幻灯片的情况；每个幻灯片称为一个集合（collection）。代码设计为每个集合实例化一个新的幻灯片对象，以便它们可以独立运行。\n\
