  \n![image](img/c13f003.jpg)\n\n**图 13.3**\n\n在 `Example 13-3` 中，你添加了一些从每个 `<li>`\
  \ 元素获取数据的代码。但是，并不是从 jQuery UI 默认使用的 `id` 属性获取数据，而是从自定义的 `data-path` 属性获取数据。\n\n\n\
  \n\n\n```javascript\n $('ul#finderCategoryFiles').sortable({\n            connectWith\
