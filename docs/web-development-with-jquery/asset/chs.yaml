  \        <option value='1'>阿富汗</option>\n        <option value='2'>阿尔巴尼亚</option>\n\
  \        <option value='3'>阿尔及利亚</option>\n        <option value='4'>美属萨摩亚</option>\n\
  \        <option value='5'>安道尔</option> \n```\n\n很长的国家列表被删除了。完整文件可作为本书免费源代码下载材料的一部分，可通过\
  \ [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 获取。\n\n```\n <option value='222'>英国</option>\n        <option value='223' selected='selected'>美国</option>\n\
  \        <option value='224'>美国属远离岛屿</option>\n        <option value='225'>乌拉圭</option>\n\
  \        <option value='226'>乌兹别克斯斯坦</option>\n        <option value='227'>瓦努阿图</option>\n\
  \        <option value='228'>梵蒂冈（圣座）</option>\n        <option value='229'>委内瑞拉</option>\n\
  \        <option value='230'>越南</option>\n        <option value='231'>英属维尔群岛</option>\n\
  \        <option value='232'>美属维尔群岛</option>\n        <option value='233'>瓦利斯和富图纳群岛</option>\n\
  \        <option value='234'>西撒哈拉</option>\n        <option value='235'>也门</option>\n\
  \        <option value='236'>南斯拉夫夫</option>\n        <option value='237'>扎伊尔</option>\n\
  \        <option value='238'>赞比亚</option>\n        <option value='239'>津巴韦</option>\n\
  \    </select>\n</div>\n<div>\n    <label for='addressStreet'>街道地址：</label>\n  \
  \  <textarea name='addressStreet'\n                id='addressStreet'\n        \
  \        rows='2'\n                cols='50'></textarea>\n</div>\n<div>\n    <label\
  \ for='addressCity'>城市：</label>\n    <input type='text' name='addressCity' id='addressCity'\
  \ size='25' />\n</div>\n<div>\n    <label for='addressState'>州/省：</label>\n    <select\
  \ name='addressState' id='addressState'>\n    </select>\n</div>\n<div>\n    <label\
  \ for='addressPostalCode'>邮编：</label>\n    <input type='text'\n           name='addressPostalCode'\n\
  \           id='addressPostalCode'\n           size='10' />\n</div>\n<div id='addressCountryWrapper'>\n\
  \    <input type='submit'\n           id='addressButton'\n           name='addressButton'\n\
