  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 3-3.js'></script>\n\
  \        <link href='Example 3-3.css' rel='stylesheet' />\n    </head>\n    <body><body>\n\
  \        <div id='finderFiles'>\n            <div class='finderDirectory finderNode'\
  \ data-path='/Applications'>\n                <div class='finderIcon'></div>\n \
