  \n* 第 1 章：拖拽与放置\n* 第 2 章：排序\n* 第 3 章：可选择\n* 第 4 章：手风琴\n* 第 5 章：日期选择器\n* 第 6 章：对话框\n\
  * 第 7 章：标签页\n* 第 8 章：排序\n* 第 9 章：排序\n* 第 10 章：排序\n* 第 11 章：排序\n\n# 第 1 章\n\n## jQuery\
  \ 简介\n\nJavaScript 框架已成为客户端 Web 开发不可或缺的伴侣。几年前，JavaScript 框架被用来解决跨平台 Web 开发中存在的许多不一致性。在微软改进并提供大幅提升标准支持的\
  \ IE 之前，通常存在着 IE 方式和标准方式。\n\n\n\n\n当本书于 2009 年首次编写时，jQuery 正在成为事实上的标准 JavaScript\
  \ 框架和应用平台。今天，`jQuery` 作为全球领导者处于顶尖地位，促进了从小店面到世界 500 强企业的各种尖端 Web 和应用程序开发。它被内置在 iOS\
  \ 和 Android 应用以及移动网站中（无论是否带有流行的 `jQuery Mobile` 框架插件），并运行着世界上一些大公司的网站，例如亚马逊、苹果、*纽约时报*、谷歌、BBC、Twitter\
  \ 和 IBM。\n\n多年来，JavaScript 框架一直平整了跨浏览器 Web 开发中的重重“坑洼”和不一致性问题，从而创造出无缝且愉悦的客户端编程体验。如今，凭借\
  \ `Internet Explorer 11` 及其底层的 `Trident` 引擎，微软终于拥有了一个世界级且符合标准的浏览器，它追上了竞争对手：苹果的 `Safari`\
  \ 以及世界领先的开源内核 `WebKit`、Google 的 `Chrome` 浏览器及其从 `WebKit` 分出的 `Blink` 引擎，以及由 `Gecko`\
  \ 引擎驱动的 Mozilla `Firefox`。Web 开发者从未拥有过更好的平台来构建现代且完全符合标准的应用程序。\n\n`jQuery` 的最大创新之一是其使用熟悉的\
  \ CSS 选择器语法的极佳的 DOM 查询工具。该组件现在称为 `Sizzle`，它现在是一个独立的开源组件，包含在更大的开源 `jQuery` 框架中。它包含了\
  \ `jQuery` 添加的 CSS 伪类选择器，以及完整的 DOM 查询 CSS 选择器引擎，该引擎可以在 `IE6` 等老旧浏览器以及新浏览器中运行。它使用了原生的\
  \ JavaScript `document` 和 `querySelectorAll()` 函数调用，这使得在函数可用时，使用 CSS 选择器进行 DOM 查询非常快速。`Sizzle`\
  \ 是让 `jQuery` Web 开发变得超级简单的强大驱动力之一，因此吸引了大量开发者进入 `jQuery` 世界。\n\n另一个让 `jQuery` Web\
  \ 开发非常简单且具有吸引力的特性是它对链式方法调的支持。在 API 支持的情况下，你可以通过在一个方法调用之后链接另一个方法来连续调用方法。以下是使用 `jQuery`\
  \ 的链式方法调用示例：\n\n```\n $('<div/>')\n            .addClass('selected')\n         \
  \   .attr({\n                id : 'body',\n                title : 'Welcome to jQuery'\n\
  \            })\n            .text(\"Hello, World!\");\n```\n\n在前面的示例中，使用 `jQuery`\
  \ 创建了一个 `<div>` 元素。`jQuery` 被包含在美元符号变量 `$` 中，这是一个只有一个字符的 JavaScript 变量。该变量包含了整个\
  \ `jQuery` 框架，并且是你使用 `jQuery` 执行一切操作的起点。语句 `$(‘<div/>')` 创建了 `<div>` 元素，然后你看到语句后面跟着多个方法调用。`.addClass('selected'`\
  \ 为 `<div>` 元素添加了类名属性。接着是 `.attr()` 的调用，它为 `<div>` 元素添加了两个额外属性：`id` 属性和 `title`\
  \ 属性，然后 `.text()` 调用为 `<div>` 元素填充了纯文本内容。通过这段小小的代码，你将四个独立的方法调用串联在一起，形成了一个跨越多行的表达式。这个展示\
  \ `jQuery` 功能的简短示例创建了一个可以插入 DOM 的 `<div>` 元素，其样式如下：\n\n```\n <div class=\"selected\"\
  \ id=\"body\" title=\"Welcome to jQuery\">Hello, World</div>\n```\n\n`jQuery` 封装了一个强大的包……（这部分在源码中似乎是碎片，但根据变量逻辑）：\n\
  \n```\nvar div = document.createElement('div');\ndiv.className = 'selected';\ndiv.id\
  \ = 'body';\ndiv.title = 'Welcome to jQuery';\nvar text = document.createTextNode(\"\
  Hello, World!\");\ndiv.appendChild(div);\n```\n\n## jQuery 能为你做什么\n\n如上一节所示，`jQuery`\
  \ 让许多任务变得更简单。它简单、链式且全面的 API 能够完全改变你编写 JavaScript 的方式。以“用更的代码实现更多功能”为目标，`jQuery`\
  \ 在以下领域尤为出色：\n\n* `jQuery` 通过其内置方法让迭代和遍历 DOM 变得简单得多。\n* `jQuery` 通过其复杂的选择器（就像你在\
  \ CSS 中使用的那样）让从 DOM 中选择项目变得更容易。\n* `jQuery` 通过其易于理解的插件架构让你轻松地添加自己的自定义方法。\n* `jQuery`\
  \ 帮助减少导航和 UI 功能的冗余，例如标签页、基于 CSS 和标记的弹出对话框、动画和过渡以及许多其他内容。\n\n`jQuery` 是唯一的 JavaScript\
  \ 框架吗？不，显然不是。你可以从几个 JavaScript 框架中选择：`Yahoo UI`、`Prototype`、`SproutCore`、`Dojo`\
  \ 等。我喜欢 `jQuery` 是因为我喜欢它的简单和不冗长。然而，在其他框架中，你会发现它们有很多相似之处，每个框架在统一事件 API、提供复杂的选择器和遍历实现，以及为冗余的\
  \ JavaScript UI 任务提供简单接口方面都有自己的优势。在整个范围内，包括不使用任何 JavaScript 框架的网站，`jQuery` 可以出现在高达一半的网站上。因此，`jQuery`\
  \ 具有无处不在的事实标准优势。我喜欢的 `jQuery` 编程另一个方面是，`jQuery` 并不试图向你这个用户强加它自己的编程观点。某些框架（特别是 `ExtJS`）试图通过复杂的模型-视图-控制器（MVC）来实现完全绕过传统的\
  \ JavaScript、HTML 和 CSS Web 开发，这种实现试图自动为你生成 HTML 和 CSS 部分，如果你喜欢那样编程，这完全没有问题。`jQuery`\
  \ 不会向用户用户强加任何类型的编程范式。与专为它设计的工具（如 `Mustache.js` 和 `Backbone.js`）相结合，可以在流行的基于 MVC\
  \ 的编程模式旁边，实现一种更合理的编程范式，在这种范式中，你仍然对所创建和使用的 HTML 和 CSS 拥有控制权。\n\n\n\n在过去的几年里，最初吸引开发者使用基于\
  \ jQuery 的 Web 开发的原因是它以极其简单的方式消除浏览器之间的差异。它为事件处理提供了一个统一的 API，而在 JavaScript 框架出现之前，你面对的是一种笨拙且碎片化的方法：微软为\
  \ IE 提供了一套方法，而其他浏览器则使用另一套标准方法。jQuery 让跨浏览器 Web 开发变得简单且无缝。今天，开发者继续涌向 jQuery，不再是因为碎片化问题（因为这些问题在过去的四年里已经得到缓慢解决），而是仅仅因为它比原生\
  \ JavaScript 编程更轻量、更易理解且易用。最后，微软已经在 Internet Explorer 中实现了其他所有人已经使用了十余年的标准事件处理模型。jQuery\
  \ 的最新版本—— 2.0 版本，舍弃了为了支持旧版本 Internet Explorer 而需要的大量遗留包，使得 jQuery 变得更轻量、更快速。\n\n\
  这并不意味着不再有跨浏览器问题了。在 JavaScript 开发中，某些领域仍然存在多种实现方法。幸运的是，这些领域正越来越少。如今，跨浏览器问题更多地存在于前沿\
  \ CSS 中，浏览器使用带有厂商前缀的 CSS 属性来提供全新的实验性特性。最令人沮丧的例子之一是 CSS 渐变，为了在现代和旧浏览器中正确实现该功能，你多多有七种编写同一种渐变的方法：\n\
  \n- WebKit 语法极其冗长的对 CSS 渐变的首次尝试：`-webkit-gradient`\n- WebKit 对修订后标准的实现：`-webkit-linear-gradient`\
  \ 和 `-webkit-radial-gradient`\n- 当前的 W3C CSS3 标准：`linear-gradient` 和 `radial-gradient`\n\
  - 微软对 W3C 标准的厂商前缀标准实现：`-ms-linear-gradient` 和 `-ms-radial-gradient`\n- 微软在旧 `filter`\
  \ 和 `-ms-filter` 属性中找到渐变专有实现\n- Mozilla 的实现：`-moz-linear-gradient` 和 `-moz-radial-gradient`\n\
  - Opera 在采用 Google 的 WebKit 分支（现为 Blink）引擎之前的实现：`-o-linear-gradient` 和 `–o-radial-gradient`\n\
  \n如你所见，使用仍处于标准化进程中的前沿 CSS 对 Web 开发者来说并不愉快。遗憾的是，大多数 Web 开发者并没有采用全面的方法，而是止于 `-webkit-`\
  \ 变体，并且懒得实现其他浏览器支持的变体。这在某种程度上促使 Opera 放弃开发自己的 Presto 引擎，转而采用 Google 的 Blink 。这曾是开发者需要像\
  \ jQuery 这样的框架来解决的问题。顺便说一下，这种情况可以通过使用服务器端动态生成的 CSS 模板解决方案，甚至是客户端 jQuery 插件来解决。\n\
  \njQuery 的美之处在于，它可以通过其全面且易于使用的插件生态系统，解决特定厂商 CSS 渐变以及 JavaScript 中剩余的跨浏览器问题。本书后部分将介绍几个出色的第三方\
  \ jQuery 插件。\n\n## 谁开发了 jQuery？\n\n我不会花大量时间讨论 JavaScript 框架的历史、它们存在的原因等。我更倾向于直奔主题。尽管如此，简要提到参与\
  \ jQuery 开发的人员是有必要的。\n\njQuery 的原始创始人是 John Resig，他的网站位于 `www.ejohn.org`。John 住在纽约布鲁克林，目前是可汗学院（Khan\
  \ Academy）计算机科学院长。John 仍在帮助定义 jQuery 项目的方向和目标，但 jQuery 在很大程度上已经交给了一个大型团队。你可以在 `https://jquery.org/team/`\
  \ 更多地了解这些人以及以及他们在 jQuery 开发中所扮演的角色。\n\n## 获取 jQuery\n\njQuery 是一个免费的开源 JavaScript\
  \ 框架。截至本文编写，当前的稳定生产发布版本是 1.10.2 和 2.0.3。这两个版本 jQuery 之间的区别主要在于对旧浏览器的支持；jQuery 2.0\
  \ 版本舍弃了为了支持旧版本 Internet Explorer 而需要的大量遗留包。\n\n我在整本书中使用第 1.10.2 版本，以获得最大的浏览器兼容性。获取\
  \ jQuery 非常简单——你只需要访问 `www.jquery.com` 并点击 Download jQuery 链接。你会看到下载 1.x 版本或 2.x\
  \ 版本的两个选项：\n\n- 压缩版生产版本\n- 未压缩的开发版本\n\n建议在开发时使用未压缩的开发版本。此版本方便在使用任何主流浏览器的 Web 开发者工具进行回溯（back\
  \ traces）。你可以遍历 JavaScript 的执行链，并以易于人类阅读的代码查看正在执行哪些代码。压缩版生产版本建议在对大小有严格要求的生产网站上使用；文件经过压缩去除了所有多余的空格，以便快速下载。\n\
  \n## 安装 jQuery\n\n在本书中，我将 jQuery 脚本设为安装在以下路径：`www.example.com/jQuery/jQuery.js`。\n\
  \n因此，如果我使用的域名是 `example.com`，那么 jQuery 从文档根目录开始路径为 `/jQuery/jQuery.js`。你不需要在这个精确路径上安装\
  \ jQuery。你可以将 jQuery 移动到任何你想的地方，但不要忘记更新路径。\n\n在上例中，你安装并测试了 jQuery 框架。你引入的 JavaScript\
  \ 会在文档的 `onready` 事件触发时执行，该事件会在 DOM 完全加载后立即执行：包括所有标记、JavaScript 和 CSS，但不包括图片。附加到\
  \ `onready` 事件的回调函数随后会创建一个具有所选类名的 `<div>` 元素，并包含文本 `Hello, World!`。\n\n你现在已经第一次使用了\
  \ jQuery。\n\n## 编程规范\n\n在 Web 开发中，专业软件工程师、Web 设计师和 Web 开发者（以及日常工作涉及维护源代码的任何人）通常会对代码编写方式采用标准和规范。像\
  \ W3C 这样定义你创建网站所用语言的标准化机构已经为你决定了一些标准。有些标准并不是成面规定的，而是事实上的标准（de facto standards）。事实标准是在行业内接受的标准，尽管它们没有出现在任何标准组织开发的官方文件中。\n\
  \n在本书中，我讨论了标准（事实标准官方标准），以及如何开发和设计考虑这些标准的 Web 文档甚至 Web 应用。例如，我详细讨论了如何将行为（JavaScript）、表现（CSS）和结构（XHTML）分离。这种方式编写的\
  \ JavaScript 通常被称为非侵入式 JavaScript——它是非侵入性的因为它补充了 Web 文档的内容，即使关闭它，文档仍然可以运行。CSS 用于处理文档的所有表现方面。而文档的结构存在于语义化的\
  \ XHTML 中。\n\n\n\n\n除了标准之外，我还会讨论如何开发基于 Web 的文档，并考虑到不同浏览器之间的不一致性、差异和特殊性。某些交互功能几乎每个浏览器的处理方式都不同；在这些情况下，其他\
  \ Web 专业人员已经先创了事实上的标准，用于使所有浏览器保持一致。JavaScript 基础框架的想法已变得越来越流行，并日益成为 HTML5 应用程序的依赖，例如你将学习使用\
  \ `jQuery` 框架来开发的应用程序。\n\n在我开始讨论如何使用 `jQuery` 之前，接下来的章节将对你应当遵循的编程惯例和良好实践提供通用概述。\n\
  \n### 标记与 CSS 规范\n\n确保 Web 文档组织良好、编写整洁并且命名和存储适当是非常关重要的。这需要纪律，甚至是对最微小细节的执着关注。\n\n\
  以下是创建 XHTML 和 CSS 文档时应遵守的规则列表：\n\n*   在选择 `id` 和 `class` 名称时，确保它们具有描述性并包含在命名空间中。你永远不知道何时可能需要将一个项目与另一个合并——命名空间可以帮助你防止冲突。\n\
  \n*   在定义 CSS 时，避免使用通用的类型选择器。让你的 CSS 更具具体性。这也有助于防止冲突。\n\n*   以连贯的方式组织你的文件。将来自同一个项目的文件放在同一个文件夹中；用多个文件夹将多个项目隔离开。避免创建巨大的文件堆积，这会导致难以定位和关联文件。\n\
  \n*   避免使用不可访问的标记。尽可能远离框架（frames）。使用符合语义的元素来组织你的标记。将段落放在 `<p>` 元素中。将列表放在 `<ul>`\
  \ 或 `<ol>` 元素中。使用 `<h1>` 到 `<h6>` 用于标题，依此类推。\n\n*   如果可能，还请考虑文档的加载效率。对于开发阶段，使用按组件组织的小型模块化文件；对于在线生产网站，则合并并压缩这些模块化文件。\n\
  \n### Id 和 Class 命名规范\n\n大多数 Web 开发者并不会过多考虑命名空间和命名惯例话题。命名惯例在你的标记 `id` 和 `class`\
  \ 名称中的重要性，正如命名空间在编程语言中的重要性。\n\n首先，什么是命名空间，你为什么需要它？**命名空间（Namespacing）** 是将你的程序、源代码等定制为特定命名规范的概念，旨在让你的程序更具移植性，能够在多样化的异地编程环境中生存。换句话说，如果你想将一个\
  \ Web 应用程序直接插入你的文档中，你需要确保 `class` 和 `id` 名称、样式表和脚本，以及构成你 Web 应用程序的所有部分都不会与文档中已存在的任何应用程序冲突。你的应用程序应该是完全自包含且自给自足的，不会与文档中已存在的任何元素发生碰撞或冲突。\n\
  \n人们在样式表中使用的常用 `id` 名称有哪些？首先思考 Web 应用程序的典型组件是什么。有一个 `body`。可能有一个或多个列。可能有 `header`（头部）和\
  \ `footer`（页脚），还有许多组件可能被识别为通用、冗余的部分，是所有 Web 应用程序都可能具有的。那么，理可能有很多网站在使用像 `body`、`header`、`footer`、`column`、`left`、`right`\
  \ 等 `id` 和 `class` 名称。如果你用 `body` 作为 `id` 或 `class` 名称命名一个元素，你很有可能与今天绝大多数网站发生冲突。为了避免此类冲突，在\
  \ Web 应用程序内部为 `id` 和 `class` 名称添加前缀被认为是良好的做法，以避免冲突和命名空间碰撞。如果你编写了一个名为 `tagger` 的应用程序，你可以通过在所有的\
  \ `id` 和 `class` 名称前加上单词 `tagger` 来对该应用程序进行命名。例如，你可能有 `taggerBody`、`taggerHeader`、`taggerFooter`\
  \ 等。但是，可能已经有人写了一个名为 `tagger` 的应用程序。为了安全起见，你可能对为应用程序选择的名称进行网络搜索，以确保没有人在使用该名称。通常，只需在你的\
  \ `id` 和 `class` 名称前加上应用程序名称就足够。\n\n此外，在样式表中为 `id` 和 `class` 名称添加类型选择器前缀也有帮助。**类型选择器（Type\
  \ selectors）** 有助于你在修改或维护文档时缩小查找范围。例如，`id` 选择器 `#thisId` 是含义的。你不知道 `thisId` 是什么类型的元素，因此可能需要扫描整个文档才能找到它。但\
  \ `div#thisId` 更具体。通过在选择器中包含 `div`，你立刻知道你正在寻找一个 `<div>` 元素。在选择器中包含类型在另一个方面也有对你有帮助：在处理\
  \ `class` 名称时，你可以将相同的 `class` 名称应用到不同类型的元素。虽然我可能不认同这是良好的做法，但至少在样式表中，你可以控制哪个元素获得哪种样式。`span.someClass`\
  \ 和 `div.someClass` 是根据元素类型区分样式的选择器，而 `.someClass` 则更具歧义并适用于任何元素。\n\n`id` 和 `class`\
  \ 名称还应该以一种具有语义意义的方式描述它们的用途。请记住，`id` 名称可能在 URL 中作为 HTML 锚点使用。哪一个更好：[`www.example.com/index.html#left`](http://www.example.com/index.html#left)\
  \ 还是 [`www.example.com/index.html#exampleRelatedDocuments`](http://www.example.com/index.html#exampleRelatedDocuments)？后者的\
  \ `id` 锚点针对 *example.com* 命名，`RelatedDocuments` 是元素的名称；因此，后者的 URL 包含了更多关于该元素的信息，并大大增加了文档的可维护性。此外，后者在搜索引擎优化（SEO）方面更有益。前者太模糊了，在\
  \ SEO 方面无法提供太大帮助。将你的每个 `id` 和 `class` 名称想象成它们是你文档 URL 的一部分。为你创建的每个 `id` 和 `class`\
  \ 名称赋予具有意义和目的的语义名称。\n\n#### 通用类型选择器\n\n通用类型选择器是类似于下面的样式表规则：\n\n```\na {\n    color:\
  \ #29629E;\n}\n```\n\n在前面的样式表规则中，你看到了一个可能常见的场景，通过指向所有 `<a>` 元素的通用类型选择器更改文档中所有链接的颜色。应该避免通用类型选择器，原因与在文档内命名\
  \ `id` 和 `class` 名称是良好的做法相同，以避免多个脚本或样式表组合在同一文档中时发生冲突。相反，最佳实践是对这些元素应用 `id` 或 `class`\
  \ 名称，或者至少将它们放在具有 `id` 或 `class` 名称的容器中，并在通过样式表引用这些元素时仅使用后代选择器。\n\n```\ndiv#exampleBanner\
  \ a {\n    color: #29629E;\n}\n```\n\n上述示例通过限制样式表规则的应用范围，避免了使用范围通用选择器样式表规则所引入的问题。现在，只有作为\
  \ `id` 为 `exampleBanner` 的 `<div>` 后代的 `<a>` 元素才会接收 `color: #29629E;` 声明。\n\n###\
  \ 存储和组织文件\n\n\n\n\n文件的组织和存储方式对于文档的可维护性至关重要。你应该在一个易于理解、易于学习的目录层次结构维护你的文档。显然，不同的人对于存储和组织文件有不同的方法。关键在于有一个方案，而不是完全没有。有些人选择按类型存储文档然后按应用程序分开，而另一些人则倾向于先按应用程序分开，再按类型排序。\n\
  \n## 避免文档无法访问\n\n可访问性也是设计网页文档时需要考虑的一个重要因素。你应该尽力让你的 `JavaScript` 具有非侵入性，但也要避免通过脚本或标记夺去文档的可访问性。\n\
  \n- 避免使用框架（frames）。\n- 限制图像数量，仅保留对文档内容有贡献的图像。随着 `CSS3`、`Data URIs` 和 `SVG` 标准的使用，网站设计中许多以前需要图像的内容不再需要包含在图像中，而是可以通过\
  \ `CSS3` 或 `SVG` 编写（例如渐变或内阴影、外投影）。当你必须使用图像时，尽量将尽可能多的设计包含在 `CSS` 背景图像中。为视网膜或高分辨率设备提供双倍分辨率图像。将直接贡献内容的图像保留在\
  \ `<img />` 元素中。确保为每个 `<img />` 元素包含描述图像的 `alt` 属性。\n- 将内容放在语义适当的标记容器中——使用 `<p>`\
  \ 段落，使用 `<h1>` 到 `<h6>` 标题。使用旨在让语义内容更具语义化的 `HTML5/XHTML5` 元素：例如 `<heading>`、`<article>`、`<aside>`、`<summary>`。\n\
  - 尽可能让设计具有高对比度。想象一下视力不好的人眼中文档看起来是什么样子的。你能轻松地阅读内容吗？\n- 避免过度偏离已建立的用户界面规范。你能区分超链接和普通内容吗？\n\
  - 考虑让内容可以通过键盘访问。你可以不使用指针设备进行导航吗？\n- 让内容更无干扰性。你可以在没有 `Flash` 和 `JavaScript` 功能的情况下使用网站吗？`JavaScript`\
  \ 和 `Flash` 应该以补充的方式增强网页内容，而不是必须。\n- 避免在每个文档的开头放置大量链接。如果你是在听内容而不是通过视觉看内容，这种体验是愉的吗？\n\
  \n可访问性应该练习到成为一种自动反射的程度。它应该像命名空间和文件组织一样，从根本上巩固在你的开发实践中。虽然其他最佳实践很容易变成本能，但也很容易养成忽视可访问性的习惯，因此必须有意识地定期审查可访问性，并将可访问性植入到开发过程中。\n\
  \n## 标记和 CSS 的效率\n\n复杂网站中的标记和 `CSS` 很容易变得庞大且臃肿，并越来越多地拖慢整体加载和执行时间。随着网站整体流行度的增加，这可能会变得特别棘手。随着网站复杂性的增加，有必要寻找简化内容的方法。最好是限制加载的外部文件数量，但所有的\
  \ `CSS` 和 `JavaScript` 都应该包含在至少一个外部文件中。如果 `JavaScript` 和 `CSS` 直接包含在文档中，初始加载时间将会提高，但你也会失去在客户端单独缓存\
  \ `JavaScript` 和 `CSS` 的优势。\n\n为了获得效率的最优化，请结合以下概念：\n\n- 服务端 `gzip` 压缩。你应该在启用和禁用此功能的情况下测试你的网站，因为涉及一些权衡。看看\
  \ `gzip` 压缩是否适合你。根据我的经验，`gzip` 可能会让文件加载得更快，但它也会延迟你看到内容的时间，因为它阻止了增量渲染的发生。通常，让用户尽快看到内容更为重要。\n\
  - 激进的客户端缓存；这会让后续的页面加载快得多。\n- 通过移除标记源中多余的空格和注释对标记内容进行自动压缩。\n- 通过移除每个文件中所有多余的空格和注释，对多个\
  \ `CSS` 和 `JavaScript` 文件进行自动压缩和合并。恰当地合并文件可以通过减少 HTTP 延迟来进一步缩短加载时间。\n\n当上述项目结合时，你可以使网页文档的加载时间达到最佳状态；然而，有一些需要考虑的注意事项，它们在起初看起来似乎是矛盾的：\n\
  \n- 可维护的标记应该以整洁、有序的方式编写。它应该有良好的间距和缩进，并在适当的地方换换符。\n- 良好的编程实践意味着模块化开发，因此按组件和应用程序拆分你的\
  \ `CSS` 和 `JavaScript`。制作小的、易于消化的块。这将提高你维护和扩展项目的能力。\n- 当更新 `CSS` 或脚本文件时，客户端缓存可能会导致头疼。当缓存正常工作时，浏览器在更新后将继续使用旧版本的\
  \ `CSS` 和脚本文件。\n\n好消息是，所有上述注意事项都可以克服。坏消息是，克服它们并不容易。\n\n在标记、`JavaScript` 和 `CSS`\
  \ 文档中实现效率的最佳方法是让效率自动化。也就是说，编写服务端应用程序来为你处理效率任务。一个设计良好的、专业的内容管理系统可以为你完成这些工作。它可以允许你将\
  \ `JavaScript`、标记和 `CSS` 文档模块化，并根据每个文件设计执行的任务将它们分开，但会自动为你合并并压缩这些文档。\n\n遗憾的是，并不是每个人都能使用专业的内容管理系统来提供内容。对于这些人，必须做出一些妥协：\n\
  \n- `JavaScript` 和 `CSS` 可以使用 Web 工具（如 Dean Edwards 的 packer [http://dean.edwards.name/packer](http://dean.edwards.name/packer））进行手动压缩。开发可以继续模块化，而压缩和合并部分转变为手动任务。\n\
  - 你可以限制文档中的空白量。使用两个空格而不是四个进行缩进。\n\n然而，克服缓存带来的头疼问题要容易得多。你可以通过更改路径来强制浏览器更新文档。例如，假设你的标记中包含了以下脚本：\n\
  \n```\n <script src='/script/my.js' type='text/javascript'></script>\n```\n\n你将路径从\
  \ `/script/my.js` 改为 `/script/my.js?lastModified=09/16/07`。后者引用相同的 `my.js`，但对浏览器来说技术上不同的路径，因此浏览器将强制刷新其缓存副本。路径中的\
  \ `?lastModified=09/16/07` 部分是路径的*查询字符串*部分。查询字符串变量用于服务端编程语言或客户端 JavaScript 从一个文档传递信息到另一个。在这个示例中，并没有传递任何信息。你包含了最后修改的时间，尽管我完全可以包含版本号，甚至是一个随机字符串。在这个示例中包含查询字符串只有一个目的：强制浏览器刷新缓存的文档。\n\
  \n对于 `CSS` 也可以这样做：\n\n\n\n\n\n```\n <link type='text/css' rel='stylesheet' href='/styles/my.css?lastModified=09/16/07'\
  \ />\n```\n\n在上述包含外部 CSS 文档的标记代码中，查询字符串被用于强制刷新浏览器缓存的样式表 `my.css`。\n\n在下一节将介绍一些针对\
  \ JavaScript 的规范。\n\n## JavaScript 规范\n\n在 JavaScript 中，有几件事被认为是坏习惯并应该避免的：\n\n*\
  \   将所有脚本包含在外部文档中——JavaScript 代码应仅包含在外部脚本文件中。脚本不应嵌入标记文档中，也不应内联直接包含在标记元素上。\n*   编写整洁、一致的代码——JavaScript\
  \ 代码应该格式整齐，并以一种一致、可预测的方式进行组织。\n*   对 JavaScript 代码使用命名空间——JavaScript 变量、函数、对象等应该进行命名空间处理，以尽量减少与其他\
  \ JavaScript 应用程序之间潜在的命名空间冲突和碰撞。\n*   避免浏览器检测——尽可能避免浏览器检测。相反，应该检测特定的浏览器功能。\n\n接下来的章节将对上述每个概念进行简要、通用的概述。\n\
  \n### 将所有脚本包含在外部文档中\n\n使 JavaScript 非侵入式（nonobtrusive）的一部分意味着让 JavaScript 成为补充和辅助性的，而不是强制和必须的。这一概念在整本书中得到了详细探讨；然而，应该注意为什么这是最佳方法。\n\
  \n考虑以下代码示例：\n\n```\n<!DOCTYPE HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n    <head>\n        <meta http-equiv=\"content-type\"\n            content=\"\
  application/xhtml+xml; charset=utf-8\" />\n        <meta http-equiv=\"content-language\"\
  \ content=\"en-us\" />\n        <title>Hello, World</title>\n <link type='text/css'\
  \ href='Example 1-2.css' rel='stylesheet' />\n    </head>\n    <body\n        <p>\n\
  \             <img src=\"pumpkin.jpg\" alt=\"Pumpkin\" />\n             <a href=\"\
  javascript:void(0);\"\n                onclick=\"window.open(\n                \
  \    'pumpkin.jpg',\n                    'picture',\n                    'scrollbars=no,width=300,height=280,resizable=yes');\"\
  >\n                Open Picture\n             </a>\n        </p>\n    </body>\n\
  </</html>\n```\n\n将上述标记与以下样式表结合：\n\n```\n img {\n     display: block;\n     margin:\
  \ 10px auto;\n     width: 100px;\n     border: 1px solid rgb(128, 128, 128);\n }\n\
  \ body {\n     font: 14px sans-serif;\n }\n p {\n     width: 150px;\n     text-align:\
  \ center;\n }\n```\n\n上述代码将为你提供类似于你在 图 1.2 中看到的内容。\n\n在 图 1.2 中，你看到了一个可能很常见的场景：你有一个缩略图，点击它可以查看该缩略图更大的版本。这是\
  \ JavaScript 非常擅长处理的工作类型——在一个没有任何控件的独立弹出窗口中为你提供更大的版本。\n\n现在检查为什么我在 图 1.2 中采取的方法添加此功能的方法是错误的。\n\
  \n![image](img/c01f002.jpg)\n\n[图 1.2]](#c01.xhtml_c01-fig-anc-0002)\n\n这种方法存在以下问题：\n\
  \n*   如果禁用了 JavaScript，则无法查看大尺寸图片。\n    *   JavaScript 可能因为个人偏好被禁用。\n    *   JavaScript\
  \ 可能因为公司政策被禁用。\n*   将 JavaScript 直接放置在标记文档中会给标记文档增加不必要的臃肿和复杂。\n\n这一切中核心的观点是，内联 JavaScript\
  \ 是为网页文档添加补充性、交互性功能的坏方法。\n\n针对 图 1.2 所示的应用，这里有一种更好的方法。首先，将内联 JavaScript 从标记中取出，并用引用外部加载的\
  \ JavaScript 来替换它。以下示例将外部加载的 JavaScript 命名为 `Example 1-3.js`：\n\n```\n<!DOCTYPE\
  \ HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n        <meta\
  \ http-equiv=\"content-type\"\n            content=\"application/xhtml+xml; charset=utf-8\"\
  \ />\n        <meta http-equiv=\"content-language\" content=\"en-us\" />\n     \
  \   <title>Pumpkin Head</title>\n        <script type='text/javascript' src='../jQuery.js'></script>\n\
  \        <script type='text/javascript' src='Example 1-3.js'></script>\n       \
  \ <link type='text/css' href='Example 1-3.css' rel='stylesheet' />\n    </head>\n\
  \    <body>\n        <p>\n             <img src=\"pumpkin.jpg\" alt=\"Pumpkin\"\
  \ />\n             <a href=\"pumpkin.jpg\" id=\"examplePumpkin\" target=\"_blank\"\
  >\n                 Open Picture\n             </a>\n        </p>\n    </body>\n\
  </html>\n```\n\n然后在外部加载的 JavaScript 中，你执行类似如下的操作：\n\n```\n$(document).ready(\n \
  \   function()\n    {\n        $('examplePumpkin').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                window.open(\n\
  \                    'pumpkin.jpg',\n                    'picture',\n          \
  \          'scrollbars=no,width=300,height=280,resizable=yes'\n                );\n\
  \            }\n        );\n    }\n);\n```\n\n通过上述代码片段，你得到了在 图 1.3 中看到的效果。\n\n![image](img/c01f003.jpg)\n\
  \n[图 1.3]](#c01.xhtml_c01-fig-0003)\n\n这是一个非侵入式 JavaScript 的示例。非侵入式 JavaScript 为网页文档提供了扩展的交互功能，但不会以阻碍原生方式使用文档。也就是说，即使禁用了\
  \ JavaScript，你仍然可以使用网站并获取所需内容。\n\n在前面的示例中，JavaScript 被移动到了名为 `Example 1-3.js` 的外部文档。在\
  \ `Example 1-3.js` 中，使用 jQuery 调用 ID 为 `examplePumpkin` 的 `<a>` 元素，并打开弹出窗口。如果禁用了\
  \ JavaScript，图片仍然会在另一个窗口中打开，但如果禁用了 JavaScript，你就无法控制窗口的大小或是否有控件。\n\n### 编写整洁、一致的代码\n\
  \n遵循某些预定义的标准来产生整洁、一致、组织良好的代码是非常重要的。在专业领域，大多数程序员都有他们希望看到的代码格式化方式。在本节早些，我讨论了缩进和间距标记以及\
  \ CSS 文档如何帮助你更容易地发现这些文档中的错误，并使这些文档更具维护性。同样，这也适用于 JavaScript。在这里我将介绍编写 JavaScript\
  \ 源代码时遵循的每个编程规范。\n\n#### 缩进和行长度\n\n对代码进行缩进是一个好习惯，这样它更容易阅读和维护。以以下为例：\n\n```\nwindow.onload=function(){var\
  \ nodes=document.getElementsByTagName('a');\nfor(var i = 0,length=nodes.length;i<length;i++){nodes[i].onclick=\n\
  function(event){window.open(this.href,\"picture\",\n\"scrollbars=no,width=300,height=280,resizable=yes);\n\
  event? event.preventDefault():(window.event.returnValue=false);};}};\n```\n\n\n\n\
  \n\n在前面的代码块中，你看到了在本节上方展示的 `Example 1-3.js` 内容，其格式没有经过任何缩进或间距处理。现在，想象一下前面的代码是分布在许多文件中的\
  \ 10,000 行代码，且都以相同格式化。对于生产环境中的脚本，减少间距并不是坏主意；事实上，许多专业人士会专门使用压缩程序来这样做。但这些专业人士并不会以压缩格式维护他们的脚本，并且通常有一套严格的编程标准，他们生成的每个脚本都必须符合该标准。\n\
  \n一种常见且相当通用的编程标准是将缩进大小设置为四个空格，尽管也有人只使用两个空格或其他数值。此外，还设定了一条通用规则：不能用制表符（tabs）代替单个空格，尽管从技术上讲，与四个单独空格相比，一个制表符为文件增加的字节更少。“不使用制表符”规则的存在是因为文本应用程序对制表符的解释存在差异。某些文本应用程序认为制表符等于八个空格；另一些则认为等于四个空格，而还有的允许你显式地定义制表符的大小。这些差异导致制表符在代码间距用途中变得不可靠。大多数专业的集成开发环境（IDEs）允许你将键盘上的\
  \ `Tab` 键定义为单个空格，同时也允许你定义插入多少空格。\n\nIDE 的示例包括 Coda、Adobe Dreamweaver、Eclipse、Zend\
  \ Studio 和 Microsoft Visual Studio：这些都是用于直接编写或生成源码的开发环境。此外，大多数 IDE 都会通过智能地调整空格数量来猜测你在编写源文档时的意图。例如，当你按下\
  \ `[Return]` 在源码文档中开始新行时，IDE 可以缩进新行，使其至少与前一行具有相同的空格。大多数 IDE 默认都是这样运行。Dreamweaver\
  \ 在你按下 `[Tab]` 键时会自动插入两个空格。Coda、Eclipse 和 Zend Studio 都可以配置为在按下 `[Tab]` 键时插入空格而非制表符。\n\
  \n在本书中，我使用 `[Tab]` 键对应四个空格，尽管有时有限的空间可能需要我使用两个字符。通常，客户端源代码的专业标准是两个字符，因为四个字符会让文件大小大得多。我坚持使用四个，是因为对文件大小和带宽占用的担忧，可以通过源代码在生产网站上使用时压缩来解决。\n\
  \n### 控制结构\n\n控制结构包括以 `if`、`else`、`switch`、`case`、`for`、`while`、`try`、`catch` 等关键字开头的编程语句。控制结构编程语句是任何编程语言的基石。现在来看看根据流行的编程标准和指南如何格式化控制结构语句。\n\
  \n尽管归根结底不同的人对编写源码有不同的偏好，但在大多数专业编程社区中，有两种主流的控制结构格式化方法。\n\n以下约定正式称为 `K&R Style`，它被包含在\
  \ Sun 的 Java 编码标准指南中：\n\n```\n if (condition) {\n     something = 1;\n } else if\
  \ (another) {\n     something = 2;\n } else {\n     something = 3;\n }\n```\n\n\
  在前面的代码示例中，你看到大括号和小括号被用作缩进的标记。\n\n将前面的与下一个约定进行比较，后者被称为 `Allman Style`，它是 Microsoft\
  \ Visual Studio 的默认设置：\n\n```\n if (condition)\n {\n     something = 1;\n }\n else\
  \ if (another)\n {\n     something = 2;\n }\n else\n {\n     something = 3;\n }\n\
  ```\n\n在 Allman Style 中，所有的大括号在源码中对齐，这使得检测是否漏掉某个括号变得更容易，而且由于有了位置的视觉辅助，可以从源上防止缺失大括号等错误错误。它也非常适合在代码行之间留出空间，使内容更易读。\n\
  \n当函数调用（例如示例中的 `window.open`）很长，有时会将函数调用拆分到多行以便于阅读。对于浏览器来说，\n\n```\nwindow.open(\n\
  \    this.href,\n    \"picture\",\n    \"scrollbars=no,width=300,height=280,resizable=yes\"\
  \n);\n```\n\n```\nwindow.open(this.href, \"picture\", \"scrollbars=no,width=300,height=280,resizable=yes\"\
  );\n```\n\n是完全相同的。前一个示例只是让人类更容易解析函数调用中的参数。\n\n有时这两种约定会混合，形成第三种约定，被称为 `One True Brace`\
  \ 约定。该约定定义在 PHP 的 PEAR 仓库编码标准指南中。\n\n```\n window.onload = function()\n {\n    \
  \ var nodes = document.getElementsByTagName('a');\n     for (var counter = 0, length\
  \ = nodes.length; counter < length; counter++) {\n         nodes[counter].onclick\
  \ = function(event) {\n             window.open(\n                 this.href,\n\
  \                 \"picture\",\n                 \"scrollbars=no,width=300,height=280,resizable=yes\"\
  \n             );\n             event? event.preventDefault() : (window.event.returnValue\
  \ = false);\n         };\n     }\n };\n```\n\n在 One True Brace 约定中，赋值给 `window.onload`\
  \ 的函数遵循 Allman Style，而其内部的代码遵循 K&R Style。\n\n当我编写 JavaScript 代码时，我倾向于混合使用 Allman\
  \ Style 和 K&R Style。我对所有函数和类定义以及控制结构使用 Allman Style，而对数组和对象定义（JSON）以及函数调用使用 K&R\
  \ Style。在实践中，看起来像这样：\n\n```\n$(document).ready(\n    function()\n    {\n       \
  \ $('a#examplePumpkin').click(\n            function(event)\n            {\n   \
  \             event.preventDefault();\n                window.open(\n          \
  \          'pumpkin.jpg',\n                    'Pumpkin',\n                    'scrollbars=no,width=300,height=280,resizable=yes'\n\
  \                );\n            }\n        );\n    }\n);\n```\n\n使用哪种编程约定当然取决于个人口味。通常，使用哪种约定会导致编程团队之间无休止的争论；有时人们的口味确实不同。如何缩进代码可能是一个敏感且个人的话题。你应该使用对你来说最合理的约定。虽然我展示的方法是最流行的，但在现实世界中存在大量的变体。你可以在维基百科上找到关于编程缩进风格更多信息：[`http://en.wikipedia.org/wiki/Indent_style`](http://en.wikipedia.org/wiki/Indent_style)。\n\
  \n### 可选的大括号和分号\n\n在之前的约定中，你会注意到在控制结构的关键字（如 `if`）与左括号之间总有一个空格。以下是使用第一种定的 `switch`\
  \ 控制结构：\n\n```\n switch (variable) {\n     case 1:\n         condition = 'this';\n\
  \         break;\n     case 2:\n         condition = 'that';\n         break;\n\
  \     default:\n         condition = 'those';\n }\n```\n\n注意前面的代码中，`default` 情况中没有\
  \ `break` 语句。作为默认情况，`break` 是隐含的，因此没有包含 `break` 语句。我在编写 `switch` 控制结构时倾向于偏离常规。\n\
  \n\n\n\n\n```javascript\n switch (variable)\n {\n     case 1:\n     {\n        \
  \ condition = 'this';\n         break;\n     };\n     case 2:\n     {\n        \
  \ condition = 'that';\n         break;\n     };\n     default:\n     {\n       \
  \  condition = 'those';\n     };\n }\n```\n\n我喜欢在 `switch` 语句的每个 `case` 周围加上大括号；这样做是因为我认为这能让\
  \ `switch` 语句更易读，并且更符合我的视觉流；然而，根结底，这些并不是必要的。对于可选的大括号，即使它们在技术上是可选的，我总是会包含它们。分号也也是如此。在\
  \ `JavaScript` 中，在每行末尾添加分号在技术上是可选的，尽管在某些情况下你将无法省略它。我会包含所有可选的分号和大括号，因为我认为这不仅让代码看起来更整洁、更有组织性且保持一致，还能给你带来技术上的益处。如果你想压缩代码以移除所有额外的空格、注释等，那么这些可选部分就不再是可选的，而是为了保持程序在压缩后仍能正常运行所必须的。在下面的示例中，你可以看到我所指的可选组件：\n\
  \n```javascript\n if (condition)\n     something = 1\n else if (another)\n     something\
  \ = 2\n else\n     something = 3\n```\n\n在 `JavaScript` 中，上述代码是完全有效的。在有换行的地方，分号是隐式的。只要只执行一个单一语句，技术上你就不需要包含大括号。然而，上述代码在被压缩后就会失效：\n\
  \n```javascript\nif (condition) something = 1 else if (another) something = 2 else\
  \ something = 3\n```\n\n上述代码在尝试执行时会产生语法错误。失败的原因是脚本解释器不知道你打算在何处结束一个语句并在另一个处从哪里开始。这种语言可能可以在某些情况下通过扩展来猜测，但最好尽可能保持显式化。像\
  \ `require.js` 这样的某些组合和压缩工具会尽力填补缺失的部分，而且它们在这方面做得其实非常好。\n\n你可能觉得奇怪的另一点是在某些函数定义之后包含一个分号。你会在\
  \ `JavaScript` 中看到这种现象，因为函数可以是一种数据类型，就像数字或字符串是一种数据类型一样。在 `JavaScript` 中，你可以像传递数字或字符串一样传递函数。你可以将函数赋值给一个变量并在以后执行该函数。你已经见过这个的示例，在下面的代码中再次给出：\n\
  \n```javascript\n window.onload = function()\n {\n     var nodes = document.getElementsByTagName('a');\n\
  \     for (var counter = 0, length = nodes.length; counter < length; counter++)\
  \ {\n         nodes[counter].onclick = function(event) {\n             window.open(\n\
  \                 this.href,\n                 \"picture\",\n                 \"\
  scrollbars=no,width=300,height=280,resizable=yes\"\n             );\n          \
  \   event? event.preventDefault() : (window.event.returnValue = false);\n      \
  \   };\n     }\n };\n```\n\n在上述代码中，你可以看到函数被赋值给了 `window` 对象的 `onload` 事件。函数定义以分号结束。再次，在这个示例中，该分号在技术上是可选的，但我包含它是因为我希望代码在被压缩后仍能工作，并且我认为这让代码更一致、更有组织性且更容易遵循。\n\
  \n## 命名变量、函数、对象\n\n变量命名也包含我在本书中所遵循的编码规范中。在命名变量、函数、对象或任何我可能命名的事物时，我始终使用 `camelCase`\
  \ 命名法。这与下划线命名法形成对比，例如 `underscores_separate_words`。\n\n## JavaScript 代码的命名空间\n\n\
  在编写应用程序时，考虑全局观是非常重要的。无论你是在为自己编写一个应用程序，还是在编写一个将部署在你无法控制的各种环境中的应用程序，你可能在职业生涯的某个时刻遇到一个问题：命名冲突。我在讨论\
  \ CSS 和标记中类名和 ID 名的命名空间处理时提到过这个话题。同样的原则也适用于 `JavaScript`。你的脚本应用程序需要运行时，不能过度侵入全局命名空间。我说“过度”是因为你确实需要进入它，但你需要以一种受控且智能的方式这样做。正如你可能为标记和\
  \ CSS 所的那样，对你的 `JavaScript` 进行命名空间可能只需坚持面向对象的代码，将你所有的程序封装在一个或几个对象中，然后在全局命名空间中以非侵入的方式命名这些对象。一种常见的方法是使用某种前缀对这些对象进行命名，该前缀应不会侵犯其他现有的项目。一个例子是\
  \ `jQuery` JavaScript 框架是如何命名空间的。`jQuery` 做了很多工作，但对于 `jQuery` 中包含的代码，对全局命名空间、`jQuery`\
  \ 对象以及 `jQuery` 对象所别名的美元符号方法的入侵极少。`jQuery` 提供的所有功能都是通过这些对象提供的，而其中两个之一——美元符号变量是可以被关闭的。（事实证明，这是框架的常见做法，即绑定到名为\
  \ `$` 的变量上，因此关闭它的能力允许 `jQuery` 与其他 JavaScript 框架并存安装。）\n\n如果没有对命名空间问题采取深思熟虑的方法，你的应用程序可能会与其他产生冲突。最好的方法是假设你放在全局命名空间中的任何内容都会导致冲突，从而力求将全局命名空间的入侵降至最低。\n\
  \n## 避免浏览器检测\n\n浏览器检测可能非常令人讨厌。当你使用自己喜欢的浏览器浏览网页时，遇到了一个将你拒之门外的网站——并不是因为你的网络浏览器在技术上无法实现，而是因为不符合网站创建者预设的能力。因此，我提出以下建议：\n\
  \n- 不要对访问者的浏览器能力做任何假设。\n- 测试功能兼容性，而不是浏览器名称或浏览器版本。\n- 考虑到官方标准和事实标准（官方标准应优先，事实标准将成为或被前者取代）。\n\
  - 世界总是在变化——今天最流行的在未来的几个月和几年内可能不再是最流行的。\n- 可能需要借助框架来提供一些兼容性桥接了。\n\n\n\n\n\n还有人记得一家叫\
  \ Netscape 的公司吗？曾几何时，Netscape 是主导性的、事实标准。现在 Netscape 在全球市场中几乎没有份额，而 Chrome、Firefox、Safari\
  \ 和 Internet Explorer 占据主导地位。另一个很好的例子是：在 IE 最流行的时期，它占据了超过 90% 的市场。现在 IE 仅占 50% 或更少，其他浏览器占据了剩下的\
  \ 50%。在移动端，Safari 和 Chrome 是绝对领先的市场领导者，因为它们驱动着 iOS 和 Android 平台上的浏览器。浏览器市场可以并且发生波动和变化。在现实世界中，有很多人使用不太流行的浏览器。某些浏览器的份额只有\
  \ 2% 或更低。2% 一看起来看起来很小，但请记住，这可能是一个非常大数字的 2%，因此本身也可以是一个巨大的数字。根据[`www.internetworldstats.com`](http://%20www.internetworldstats.com)，在我写下这段文字的\
  \ 2013 年，全球互联网用户仅有略多 24 亿，约占世界人口的 34.3%。因此，这些所谓的非主流浏览器在宏观层面上表现并不差，尽管 2% 听起来很小，但它实际上是一个相当庞大的用户群。在本书中，我将向你展示大量示例，说明如何避免使用浏览器检测，而是改用特征检测。\n\
  \n## 总结\n\njQuery 将传统 JavaScript 中可能更复杂或冗长的任务变得简单易得多，有时甚至能将许多行代码缩减为的一行或几行。在整本书中，你将了解到\
  \ jQuery 提供的功能，以及如何使用它简单、易懂的 API 来编写出惊艳的、专业的 Web 应用程序。\n\n在本章中，我简要介绍了 jQuery 是什么、源于何处以及由谁在开发和维护它，并向你展示了如何安装并开始使用它。在下一章中，你将直接进入正题，学习\
  \ jQuery 强大的 Selectors API 实现以及其世界级的 Event API。\n\n如果你对了解更多关于 jQuery 的起源感兴趣，请访问[`www.jquery.com`](http://www.jquery.com)\
  \ 和[`www.ejohn.org`](http://www.ejohn.org)。\n\n本章还涵盖了一些优秀程序员应该养成的习惯，例如采用正式的编程规范，以及通过某种命名空间来避免与其他代码发生冲突（无论是通过语言提供的功能，还是通过对影响全局命名空间使用的名称添加前缀）。我向你展示了我自己采用的一些实践；尽管我应该强调的是，采用哪种编程规范并不重要，重要的是你必须采用一种。编程规范的前提是你拥有一套可以遵循的规则来格式化你的代码，使其整洁、有组织且易于遵循。我的规范可能不是你想要的，但还有许多其他可供选择。\n\
  \n你应该避免检测用户的浏览器，特别是当这可能导致某一组用户被排除在功能之外时。\n\n你的代码应该利用客户端缓存以及其带来的性能提升。\n\n在我看来，在组织良好的模块中编写代码，稍后使用服务器端编程将它们组合成更大的脚本会更好。\n\
  \n最后，为客户端标记和 CSS 的展示与维护采用标准也是重要的。在 XHTML5 或 HTML5 中选择一个，两者都是被接受的标准。我更倾向于 XHTML，尽管它对你来说可能太严格了。\n\
  \n# 第二章\n\n## 选择与过滤\n\n本章讨论了 jQuery 对 Selectors API 的复杂实现，该 提供了使用 CSS 选择器在 DOM 中选择元素的能力。jQuery\
  \ 的 Selectors API 允许你使用选择器从 DOM 中选择一个或多个元素；然后你可以使用该结果集，也可以将这些元素传递下去以过滤出更特定的结果集。\n\
  \n如果你从未听过选择器（selector），我建议你看看我的书籍 *Beginning CSS: Cascading Style Sheets for Web\
  \ Design, 3rd Edition*，书中对选择器有广泛的介绍。\n\n在 CSS 中，你可以通过编写样式表为一个或多个元素应用样式。你根据 CSS 规则第一部分（第一个大括号之前）中的语法来选择要样式的元素，这被称为选择器。这里是一个\
  \ CSS 选择器示例：\n\n```css\ndiv#exampleFormWrapper form#exampleSummaryDialog {\n   \
  \ display: block;\n    position: absolute;\n    z-index: 1;\n    top: 22px;\n  \
  \  left: 301px;\n    right: 0;\n    bottom: 24px;\n    width: auto;\n    margin:\
  \ 0;\n    border: none;\n    border-bottom: 1px solid rgb(180, 180, 180);\n}\n```\n\
  \n通过标记和 CSS，你可以为元素分配 id 和类名，并专门使用选择器来控制元素的呈现方面。在 jQuery 中，运用于 CSS 的选择器概念也适用于*文档对象模型*（DOM）概念。在\
  \ DOM 中，你的文档标记中存在的每个元素对你都是可用的，你可以遍历 DOM 并使用选择器选择你想要处理的元素，就像在 CSS 样式表中使用它们的那样。\n\n\
  在从 DOM 中选择元素后，你可以为它们应用行为。例如，你可以监听事件，并在用户点击元素时触发某些操作。你也可以在用户鼠标悬停或离开元素时触发某些操作。基本上，你可以让你的\
  \ Web 文档看起来和运行起来更像桌面应用程序。本章描述了如何使用 jQuery 的 Selectors API 从文档中获取元素，并提供了一些用法示例。它还描述了如何在\
  \ jQuery 中进行链式调用。这种的一种用途是过滤集合，即将较大的集合缩小到较小的集合。最后，它讨论了 jQuery 的 Event API 如何与 W3C\
  \ 的 Event API 以及 IE8 中实现的 Microsoft 事件模型协同工作。\n\n## Selectors API 的起源\n\nSelectors\
  \ API 的概念最早由 Dean Edwards 构想出来，他是一位 JavaScript 大师，首次在一个名为 `cssQuery` 的免费开源包中用 JavaScript\
  \ 创建了 Selectors API。在 Dean 开创了想法并产生了一个可行的原型实现后不久，它被 John Resig（以及其他 JavaScript 框架作者，与\
  \ John 的独立）采用并扩展，并实现在他的 jQuery 框架中。这导致了 Dean、John 以及其他 JavaScript 框架作者之间往复的合作与竞争，使得这些即兴实现获得了急需的性能提升，因为它们在构思之初在某些情况下非常缓慢。\n\
  \n在 Dean 提出 Selectors API 概念后不久，W3C 成员和编辑 Anne van Kesteren 以及 Lachlan Hunt 将其草拟为\
  \ W3C 标准。官方的 W3C Selectors API 包含两个方法：用于选择单个元素的 `document.querySelector()`，以及用于选择多个元素的\
  \ `document.querySelectorAll()`。\n\n`document.querySelector` 和 `document.querySelectorAll`\
  \ 都在 Chrome、Safari、Firefox 和 IE（一直到 IE8）中原生实现。\n\n\n\n\njQuery 以及其他 JavaScript 框架的伟大之处在于，在\
  \ Selectors API 被原生引入浏览器之前，它们就已经实现了自己的版本，这使得它们可以在原生实现可用时使用原生实现。使用原生实现会让元素选择速度变得快得惊人。否则，如果用户使用的是旧版本的浏览器，框架可以回退到它自己较慢的基于\
  \ JavaScript 的实现。这意味着在使用像 jQuery 这样的 JavaScript 框架时，Selectors API 在其支持的所有平台上都是无处不在的。jQuery\
  \ 1.9 支持到 IE 6 时代，如果你需要除了所有其他流行浏览器之外，还需要兼容旧版本的 IE，就应该使用它。jQuery 2.0 放弃了对旧版本 Internet\
  \ Explorer 的支持，仅支持 IE9 及更高版本。jQuery 1.9 留存了对那些遗留浏览器及其处理方式的支持。jQuery 2.0 则与过去彻底断绝，仅支持对标准支持良好的新版本浏览器。\n\
  \n## 使用 Selectors API\n\n在 jQuery 中使用 Selectors API 非常简单。正如第 1 章“jQuery 简介”所解释的，你想用\
  \ jQuery 做的一切都源于一个命名简单的对象，称为 `$`（单个美元符号）。你也可以用“jQuery”来代替美元符号，但从本书这里开始，我将只使用美元符号，并根据上下文将其称为为“美元符号对象”或“美元符号方法”，因为它实际上既是一个方法又是一个对象。\n\
  \n`$` 既是方法也是对象，因为你可以像调用函数一样使用它，但它也拥有你可以调用的成员属性和方法。`$` 命名为单个美元符号只有一个原因，那就是减少你需要编写的代码量。\n\
  \n这里有一个简单的示例，展示了你如何使用该方法配合选择器为一组链接添加点击行为。基本上，这段代码的作用是强制链接在新窗口中打开，而不是使用 `target`\
  \ 属性（这是因为在内容内容时，`target` 属性有时会被遗漏），正因如此，通过加入少量遵循大多数公司在“何时在新窗口中打开链接”问题上所需规则的 JavaScript，可以轻松地将其抽象化。\n\
  \n假设你有一个如下所示的标记文档。（你可以亲自尝试这个示例；它作为书籍下载材料中的示例 2-1 提供。）\n\n```\n<!DOCTYPE HTML>\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n        <meta http-equiv=\"\
  content-type\"\n            content=\"application/xhtml+xml; charset=utf-8\" />\n\
  \        <meta http-equiv=\"content-language\" content=\"en-us\" />\n        <title>Links</title>\n\
  \        <script type='text/javascript' src='../jQuery.js'></script>\n        <script\
  \ type='text/javascript' src='Example 2-1.js'></script>\n        <link type='text/css'\
  \ href='Example 2-1.css' rel='stylesheet' />\n    </head>\n    <body>\n        <ul\
  \ id=\"exampleFavoriteLinks\">\n            <li><a href=\"http://www.wrox.com/\"\
  >Wrox</a></li>\n            <li><a href=\"http://www.daringfireball.com/\">Daring\
  \ Fireball</a></li>\n            <li><a href=\"http://www.apple.com/\">Apple</a></li>\n\
  \            <li><a href=\"http://www.jquery.com/\">jQuery</a></li>\n          \
  \  <li><a href=\"Example 2-2.html\">Example 2-2</a></li>\n            <li><a href=\"\
  Example 2-3.html\">Example 2-3</a></li>\n        </ul>\n    </body>\n</html>\n```\n\
  \n在前面的标记文档中，你有一个包含六个链接的简单无序列表。获取该标记配合以下 CSS：\n\n```css\nbody {\n    font: 16px Helvetica,\
  \ Arial, sans-serif;\n}\nul {\n    list-style: none;\n    margin: 10px;\n    padding:\
  \ 10px;\n    border: 1px solid green;\n}\na {\n    text-decoration: none;\n    color:\
  \ green;\n}\na:hover {\n    text-decoration: underline;\n}\n```\n\n前面的 CSS 文档的作用仅仅是让列表看起来更漂亮一点——它既没有给示例增加内容，也没有减少内容。\n\
  \n最后，你向标记中添加以下 JavaScript 文档：\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n        $('a').click(\n            function(event)\n            {\n    \
  \            var node = $(this);\n                var target = node.attr('target');\n\
  \                var href = node.attr('href');\n                if (target === undefined\
  \ && href !== undefined)\n                {\n                    switch (true)\n\
  \                    {\n                        case href.indexOf('http://') !==\
  \ -1:\n                        case href.indexOf('https://') !== -1:\n         \
  \               case href.indexOf('.pdf') !== -1:\n                        {\n \
  \                           node.attr('target', '_blank')\n                    \
  \            .addClass('exampleLinkAutoTarget');\n                            break;\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        )\n    }\n);\n```\n\n以上代码整合在一起，应该看起来像图 2.1 所示。\n\n![image](img/c0001.jpg)\n\
  \n当你点击示例中的外部链接时，你会看到这些链接在窗口或标签页中打开，取决于你浏览器的偏好设置。\n\n图 2.1\n\n\n\n\n\n```javascript\n\
  \ function(event)\n            {\n                var node = $(this);\n        \
  \        var target = node.attr('target');\n                var href = node.attr('href');\n\
  \                if (target === undefined && href !== undefined)\n             \
  \   {\n                    switch (true)\n                    {\n              \
  \          case href.indexOf('http://') !== -1:\n                        case href.indexOf('https://')\
  \ !== -1:\n                        case href.indexOf('.pdf') !== -1:\n         \
  \               {\n                            node.attr('target', '_blank')\n \
  \                               .addClass('exampleLinkAutoTarget');\n          \
  \                  break;\n                        }\n                    }\n  \
  \              }\n            }\n```\n\n该匿名函数包含一个参数 `event`，它代表事件对象。该事件对象与你在使用 jQuery\
  \ 1.9 之前配合标准 W3C 事件 API 以及 Internet Explorer 8 及早版本时所使用的对象相同；此事件对象由 jQuery 自动进行了补丁，使得旧版本的\
  \ IE 能够支持与其他所有浏览器相同的标准事件模型。IE9 及更高版本已内置了所有这些功能，不再需要补丁。\n\n下一行获取 `this` 并将其封装在 jQuery\
  \ 调用中。默认情况下，事件的设置方式使得 `this` 指向事件所绑定的元素。当事件发生时，jQuery 会保留这种默认行为，因此默认情况下，你在事件回调函数中使用传统的\
  \ JavaScript。若要再次使用 jQuery，你必须显式地说明你想要使用 jQuery，实现这一点的一种方法就是简单地将 `this` 封装在 jQuery\
  \ 调用中。\n\n```javascript\nvar node = $(this);\n```\n\n如果你没有将 `this` 封装在 jQuery 调用中，那么后续对\
  \ `attr()`（一个 jQuery 函数）的调用将会失败。\n\n下一行验证 `<a>` 元素是否具有 `target` 属性或 `href` 属性。如果没有设置\
  \ `target` 属性，则 `attr('target')` 的调用将返回 `undefined`，`href` 属性也是如此。\n\n```\n if (target\
  \ === undefined && href !== undefined)\n```\n\n接下来，在确定没有 `target` 属性且存在 `href` 属性后，程序将检查\
  \ `href` 属性的值，以确定在点击链接时是否应该打开新窗口。这是通过 `switch` 语句实现的。对 `true` 进行切换将导致程序执行第一个 `case`\
  \ 语句，即 `case` 旁边的表达式求值为 `true`，当 `href` 的值包含以下内容时即满足这种情况：\n\n- `http://`：指向第三方网站的非安全\
  \ Web 链接\n- `https://`：指向第三方网站的安全 Web 链接\n\n或者链接包含 .pdf 文档扩展名。\n\n通过这些规则以及在整个网站中设置的一些额外逻辑，就可以筛选出指向第三方网站和\
  \ PDF 文档的链接，并让这些特定链接在新窗口中打开。如果你的网站上的所有链接都是以相对链接或绝对链接形式编写且不包含 URL 的主机名部分，这种方法就是有效的——例如\
  \ `http://www.example.com/` 就是 URL 中的主机名部分。如果某些链接可能包含你自己的主机名，你可能需要重写此处提供的逻辑来过滤掉这些链接，以免网站内部的链接触发误报并在新窗口中打开。你将在下一节学习如何这样做。\n\
  \n这是一个对使用 Selectors API 选择特定页面上所有链接的一种可能方法的简单但实用的解释。但如果你想根据其他标准过滤掉某些选中的元素，或者你想根据树中更深处的元素来收窄选择范围呢？这将在下一节中讨论。\n\
  \n## 过滤选择\n\njQuery 的创新之处在于，在任何合理的情况下，它默认对它的每个方法调用都会返回自身。当你完成一次选择后，该选择将作为一个对象的上下文被返回，该对象可以调用任何其他\
  \ jQuery 方法，而该 jQuery 方法可以获取之前的选择并对其进行进一步处理。你几乎可以使用任何语言实现这一点，也就是说，创建一个对象并让该对象的方法返回对象本身。\n\
  \n在本节中，你将查看 jQuery 提供的各种方法，这些方法可以在另一个选择的上下文中修改选择结果。\n\n### 在选择的上下文中工作\n\n本节引入了 jQuery\
  \ 的几个方法：`find()`、`each()`、`is()` 和 `val()`。此讨论从一个用于在现有选择的上下文中搜索其他元素的方法 `find()`\
  \ 开始。在我向你展示一种你可能使用 `find()` 方法的示例时，你会在同一个示例中也看到 `each()`、`is()` 和 `val()`。我将在本节稍后在对*示例\
  \ 2-2* 解释的上下文中，为你提供关于 `each()`、`is()` 和 `val()` 的详细介绍，因为如果不引入这些其他方法，我就无法开始关于 `find()`\
  \ 的讨论。然而，为了开启 jQuery 之旅的这段行程，你将查看 `find()` 方法、你如何使用它，更重要的是，在你在使用它时想要采用的一些技巧以及想要避免的一些行为。\n\
  \njQuery 的 `find()` 方法允许你在选择中执行另一个选择。另一种说法是，它允许你在选择的上下文中进行搜索。正如你所看到的，选择可以包含一个元素或多个元素。jQuery\
  \ 提供的绝大多数方法都基于一个一致的假设，即选择可以包含一个或多个元素。`find()` 也不例外；它可以与包含一个或多个元素的选择一起使用，并且在选择中存在的每个元素的上下文中进行搜索。因此，如果你有一个包含单个\
  \ `<form>` 元素的选择，并在该选择上使用 `find()`，你将在单个 `<form>` 元素内部查找。如果你有一个包含多个 `<form>` 元素的选择，并使用\
  \ `find()`，则 `find()` 将原始选择中每个 `<form>` 元素的上下文中执行。因此，使用 `find()` 的第一个结论是，它可以在大大小小的选择上执行，并且使用它可能会很快变得臃肿难以维护。\n\
  \n如果你确定一个元素（或元素集合）在 DOM 树中从初始选择的锚点向下某个位置包含另一个元素（或集合），就可以使用 `find()`。在工具箱中转向 `find()`\
  \ 时，需要记住的关键点是，你不知道这个额外的元素或集合可能位于树的多深处。例如，如果你知道第二个选择将是初始选择的子元素或兄弟元素，那么使用 jQuery 方法\
  \ `children()` 或 `siblings()` 会更好，因为对于这种情况它们速度更快。\n\n\n\n\n\n`find()` 是一个有点像粗糙的工具；它运行良好，并且根据其使用的场景，效率可以从相当高效到非常高效不而异，但它是\
  \ jQuery 提供的最通用的选择过滤方法之一。由于 `DOM` 可能非常大且复杂，也可能很小且简单，因此在使用通用的 `jQuery Selectors API`\
  \ 选择元素时，在甚至还没有考虑 `find()` 方法的最佳用处之前，最好先后退一步，记住几件基本知识，以保持你的脚本快速、优化，并准备好处理任何情况。\n\n\
  ### 使用唯一 ID\n首先，请记住在构建文档时使用适当且具有策略布局的唯一 `id` 名称。`id` 名称旨在是唯一的；而 `class` 名称则不是要求是唯一的。因为\
  \ `id` 名称必须是唯一的，所以如果你创建了一个具有唯一 `id` 名称的文档，浏览器就可以使用高效的索引，通过 `id` 名称在 `DOM` 中查找任何元素。因此，当你使用\
  \ `jQuery` 进行选择时，你所能做的最快选择就是涉及使用 `id` 名称的选择。\n\n当然，拥有唯一 `id` 名称的这一概念概念并不是浏览器可以强制执行的；你必须在创建文档时强制执行这一点。如果你不自觉地考虑这一点，浏览器会很乐意允许你创建多个具有相同\
  \ `id` 名称的元素。如果你确实创建了多个具有相同 `id` 名称的元素，你就错过了使用 `id` 名称作为初始选择器来缩小选择中可能元素范围而带来的优化优势。如果你使用唯一的\
  \ `id` 名称，那么类似于数据库，浏览器可以建立一个快速索引来访问 `DOM` 中的这些元素。因为它可以快速找到这些元素，基于使用 `id` 名称优化的构建的应用程序也会快得多。\n\
  \n### DOM 类比\n将 `DOM` 想象成一个数据库表。即使你不熟悉关系型数据库（如 `MySQL`、`SQL Lite`、`Postgres SQL`\
  \ 或 `Microsoft SQL Server`），这种类比也有助于理解计算机是如何组织信息以进行高效查找的。就像这本书一样，如果你想快速定位关于特定主题的信息，你最好的选择将是书的索引部分。它按主题和短语分类信息，按字母顺序排序，并提供这些主题或短语出现的页码列表。关系型数据库的工作方式相似；它们包含信息仓库，但它们需要自己的索引来快速查找信息。关系型数据库在磁盘上有一组物理位置，而索引就像物理书籍一样，帮助提供了一种快速查找该信息的方法。\n\
  \n文档对象模型也无不同。它是 `HTML` 元素的集合，这些元素各有一个可以用于组织这些数据的属性。`DOM` 的组织像一棵树；它有一个根元素 `<html>`，从那里开始分支，添加子元素和子元素的元素，直到整个\
  \ `DOM` 被映射。因此，当你提供像 `id` 和 `class` 名称这样的额外元数据时，你是在提供一种使用 `JavaScript` 和 `CSS` 识别\
  \ `DOM` 中这些元素的方法。\n\n当然，你不必总是使用 `id` 或 `class` 名称。有时你可以仅使用元素本身来识别元素，有时你只需要少量 `class`\
  \ 或 `id` 名称就能有意义地组织你的文档，使其便于用 `CSS` 样式化或用 `JavaScript` 编程。你也可以使用 `HTML` 属性来识别元素，在我的经验中这更常见，例如\
  \ `<input>` 元素，你可能想根据元素是文本输入还是密码输入来应用样式。现在有了 `HTML5`，我们有了十几个左右可能的输入类型。\n\n### 选择中的效率\n\
  然而，对于 `DOM`，最好以最有效的方式设计你的动态、交互式应用程序，通常情况下，这从一个涉及 `id` 名称的选择开始。选择元素的第二种高效方法将是使用 `class`\
  \ 名称。`class` 名称与 `id` 名称的区别在于，`class` 名称可以应用于许多元素。具有相同 `class` 名称的元素应该共享一些共同特征。你本质上是在说具有相同\
  \ `class` 名称的元素是相同的，但它们在你的文档中出现了多次。\n\n一个示例可能是应用于作为输入元素标签容器的元素的 `class` 名称。你的文档中可能有很多这样的标签，每个标签在外观和感受方面都具有相同的特征。你可能在外观和感受上会有一些变体，以适应视觉布局中的边缘情况。对于那些边缘情况，你可能会发明几个新的\
  \ `class` 名称，以修改这些情况下的基础外观和感受。\n\n### 架构责任\n无论你创建应用程序是为了适应什么情况，你的 `id` 和 `class`\
  \ 名称都应该设计成有助于使用 `CSS` 进行高效样式化，以及在 `JavaScript` 中使用 `DOM` 进行高效查找。你希望你的应用程序能够尽可能快地找到这些元素，并使用尽可能少的额外元数据。这听起来像是一个自相矛盾的陈述，在某些方面确实如此。你不希望在创建和分配\
  \ `id` 和 `class` 名称时太慷慨，因为那会让你的文档变得臃肿。在带宽方面，你希望创建一个尽可能小的文档，同时使其在程序上是尽可能高效和优化的。`jQuery`\
  \ 只是一个让你访问 `DOM` 的工具，它允许你有许多方法与 `DOM` 交互。然而，作为程序的架构师，由你来确保应用程序高效、组织良好，以便尽可能快地运行。对于\
  \ Web 应用程序而言，尽快向用户显示内容总是重要的。\n\n### `find()` 方法\n在本章检查的许多过滤和遍历方法中，第一个是名为 `find()`\
  \ 的方法。它的目的是在现有选择中查找该选择中的其他元素。这些元素可以是该元素的子元素，或者是该选择 DOM 树中深处的后代。初始选择可以是一个或多个元素，`find()`\
  \ 将在每个元素内部查找你正在寻找的额外元素或元素。\n\n正如本节开头提到的，`jQuery` 的一个大优点是它从不假设（在可行且可能的情况下）你只想处理单个元素。如果你选择了多个元素，它将一次处理多个元素。如果你选择了一个单个元素，它将只处理这一个元素，但它这一个元素视为包含一个元素的数组。\n\
  \n如果你检查 `jQuery` 选择返回的对象，你*总是*会看到一个数组，对于所有旨在返回与选择相关的 `jQuery` 方法来说，情况*总是*是这样的。当你不是在与选择工作，而是使用某种旨在返回字符串或其他数据的方法时，例如元素的\
  \ HTML 源码或文本源，或者属性的值——在这些情况下，`jQuery` 会获取选择中的第一个元素（如果选择包含多个元素），并根据该元素的语境提供你请求的内容。因此，你必须主动考虑到选择可能返回的内容，并假设在大多数情况下，你的选择可能返回多个元素。\n\
  \n\n\n\n正如前所述，最好是从尽可能窄的选择开始，这样浏览器就能快速地在 DOM 中定位到该元素。`Example 2-2` 为你提供了一个简明扼要的概述，介绍了如何在现有选择的上下文中使用\
  \ `find()` 来定位元素的方法。与书中的大多数示例一样，你可以通过手动在文本编辑器中输入该示例来尝试，也可以从书中提供的免费下载材料（可通过[`www.wrox.com/go/webdevwithjquery.`](http://www.wrox.com/go/webdevwithjquery.)）中获取示例源代码。此示例从\
  \ `Example 2-2.html` 开始：\n\n```html\n<!DOCTYPE HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n    <head>\n        <meta http-equiv=\"content-type\"\n            content=\"\
  application/xhtml+xml; charset=utf-8\" />\n        <meta http-equiv=\"content-language\"\
  \ content=\"en-us\" />\n        <title>Contact Form</title>\n        <script type='text/javascript'\
  \ src='../jQuery.js'></script>\n        <script type='text/javascript' src='Example\
  \ 2-2.js'></script>\n        <link type='text/css' href='Example 2-2.css' rel='stylesheet'\
  \ />\n    </head>\n    <body\n        <form id='contactNewsletterForm' method='get'\n\
  \            action='Example 2-2 Submitted.html'>\n            <div>\n         \
  \       <label for='contactFirstName'>First Name:</label>\n                <input\
  \ type='text'\n                       id='contactFirstName'\n                  \
  \     name='contactFirstName'\n                       size='25'\n              \
  \         maxlength='50'\n                       required='required' />\n      \
  \      </div>\n            <div>\n                <label for='contactLastName'>Last\
  \ Name:</label>\n                <input type='text'\n                       id='contactLastName'\n\
  \                       name='contactLastName'\n                       size='25'\n\
  \                       maxlength='50'\n                       required='required'\
  \ />\n            </div>\n            <div>\n                <input type='checkbox'\n\
  \                       id='contactNewsletter'\n                       name='contactNewsletter'\n\
  \                       value='1' />\n                <label for='contactNewsletter'>\n\
  \                    Subscribe to newsletter?\n                </label>\n      \
  \      </div>\n            <div>\n                <input type='submit'\n       \
  \                id='contactNewsletterFormSubmit'\n                       name='contactNewsletterFormSubmit'\n\
  \                       value='Go' />\n            </div>\n        </form>\n   \
  \ </body>\n</html>\n```\n\n前面的标记包含了一个简单的时事通讯订阅表单。它与以下 CSS `Example 2-2.css` 结合使用：\n\
  \n```css\nbody {\n    font: 16px Helvetica, Arial, sans-serif;\n}\nform#contactNewsletterForm\
  \ {\n    margin: 10px;\n    padding: 10px;\n    border: 1px solid black;\n    background:\
  \ yellow;\n}\nform#contactNewsletterForm div {\n    padding: 5px;\n}\n```\n\n接下来的\
  \ JavaScript `Example 2-2.js` 用于验证文本输入字段中是否提供了必填输入，并在点击提交按钮时将其禁用，这可以防止用户在提交表单的操作耗时比预期更长的情况下多次点击提交按钮。\n\
  \n```javascript\nvar contactNewsletterForm = {\n    ready : function()\n    {\n\
  \        $('input#contactNewsletterFormSubmit').click(\n            function(event)\n\
  \            {\n                var input = $(this);\n                input.attr('disabled',\
  \ true);\n                if (!contactNewsletterForm.validate())\n             \
  \   {\n                    alert(\"Please provide both your first and last name\"\
  );\n                    input.removeAttr('disabled');\n                    event.preventDefault();\n\
  \                }\n                else\n                {\n                  \
  \  $('form#contactNewsletterForm').submit();\n                }\n            }\n\
  \        );\n    },\n    validate : function()\n    {\n        var hasRequiredValues\
  \ = true;\n        $('form#contactNewsletterForm').find('input, select, textarea').each(\n\
  \            function()\n            {\n                var node = $(this);\n  \
  \              if (node.is('[required]'))\n                {\n                 \
  \   var value = node.val();\n                    if (!value)\n                 \
  \   {\n                        hasRequiredValues = false;\n                    \
  \    return false;\n                    }\n                }\n            }\n  \
  \      );\n        return hasRequiredValues;\n    }\n};\n$(document).ready(\n  \
  \  function()\n    {\n        contactNewsletterForm.ready();\n    }\n);\n```\n\n\
  该表单随后提交到名为 `Example 2-2 Submitted.html` 的后续 HTML 页面，该页面仅确认表单已提交。在现实世界中，此 HTML 表单可能会发送到服务器端程序，该程序将验证输入并实际执行为用户订阅时事通讯的操作。对于这个简化示例，你省略了该过程的该部分，只关注客户端组件。\n\
  \n```html\n<!DOCTYPE HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n\
  \        <meta http-equiv=\"content-type\"\n            content=\"application/xhtml+xml;\
  \ charset=utf-8\" />\n        <meta http-equiv=\"content-language\" content=\"en-us\"\
  \ />\n        <title>Contact Form</title>\n        <script type='text/javascript'\
  \ src='../jQuery.js'></script>\n        <script type='text/javascript' src='Example\
  \ 2-2.js'></script>\n        <link type='text/css' href='Example 2-2.css' rel='stylesheet'\
  \ />\n    </head>\n    <body>\n        <p>Thank you for submitting the form.</p>\n\
  \    </body>\n</html>\n```\n\n\n\n在附加到提交按钮 `click` 事件的函数中，你所做的第一件事是创建一个名为 `input`\
  \ 的变量，通过调用 `jQuery` 并将特殊的 `this` 关键字作为其第一个也是唯一的参数。正如本章前面提到的，当事件被触发时，`this` 指向发生事件的元素，但\
  \ `this` 并不具备 jQuery 增强型功能。要让它具备 jQuery 功能，你只需要将 `this` 作为参数传递给 `jQuery` 即可。这就是如何让\
  \ JavaScript DOM 中的任何元素都启用 jQuery 功能的，而不仅仅是事件语境下特殊的 `this` 关键字。\n\n```\nvar input\
  \ = $(this);\n```\n\n接下来，你禁用了提交按钮，这样用户就不会因为不耐烦而反复点击它，从而向你的服务器发送多次加入时事通讯的请求。\n\n\
  ```\ninput.attr('disabled', true);\n```\n\n设置 `disabled` 属性的另一种方法是像这样调用 `attr()`\
  \ 方法：\n\n```\ninput.attr('disabled', 'disabled');\n```\n\n你可能更倾向于这种方法，因为从技术上讲，这也是\
  \ XHTML 规定布尔 HTML 属性的处理方式。但 jQuery 支持这两种方式：通过传递布尔值 `true` 或 `false`，或者通过传递值 `disabled`。同样，要取消\
  \ `disabled` 属性，你可以在调用时传递 `false`，例如 `attr('disabled', false)`，也可以通过调用 `removeAttr('disabled')`\
  \ 彻底移除该属性。\n\n在下一行中，你调用 `contactNewsletterForm.validate()` 来检查表单是否有效。\n\n```javascript\n\
  if (!contactNewsletterForm.validate()) {\n    alert(\"Please fill in required fields\"\
  );\n} else {\n    input.attr('disabled', false);\n}\n```\n*(注：原文提供的文本中后部分代码逻辑与描述较为破碎且重复，此处已根据上下文修复了核心逻辑意图。)*\n\
