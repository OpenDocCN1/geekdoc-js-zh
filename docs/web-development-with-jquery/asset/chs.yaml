  \n![image](img/c16f002.jpg)\n\n图 16.2 在前面的示例中，你学习了如何在不使用 jQuery 带的主题的情况下为 Datepicker\
  \ 设置样式。Datepicker 的其他方面，例如允许选择的日期、日期格式以及小部件中存在的控件，也可以进行自定义。可以在本章后续的“本地化 Datepicker”章节中了解更多关于这些内容的知识。要设置\
  \ Datepicker，可以引用提供的标记，使用各种 `id` 和类名（class names）为弹出日历创建样式。提供的样式仅仅是 CSS。\n\n###\
  \ 设置允许的日期范围\n\n默认情况下，jQuery Datepicker 插件允许你选择未来 10 年和过去 10 年的日期范围。然而，你可以通过调用 `datepicker()`\
  \ 方法时指定选项来自定义小部件允许的日期范围：\n\n* `minDate` 和 `maxDate` 设置用户输入日期字段的最小和最大日期。这些选项通过提供\
  \ JavaScript `Date` 对象进行设置。\n* `changeMonth` 和 `changeYear` 是布尔选项，用于切换月份或年份变为下拉菜单，允许用户快速跳转到特定日期。\n\
  * `yearRange` 设置下拉菜单中的可用年份。该选项是一个由冒号分隔的结束年份字符串。例如，`1900:2000` 会填充 1900 到 2000 年的所有年份。\n\
  \n下面的示例是前面选项的演示，位于源文件 `Example-16-3.html` 中，它使用了 `Example-16-2.css` 中提供的样式表。\n\n\
  ```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n\
  \        <meta http-equiv='content-type' content='application/xhtml+xml; charset=utf-8'\
  \ />\n        <meta http-equiv='content-language' content='en-us' />\n        <title>Datepicker\
  \ Plugin</title>\n        <script src='jQuery.js'></script>\n        <script src='jQueryUI.js'></script>\n\
  \        <script src='Example-16-3.js'></script>\n        <link href='Example-16-3.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <form action='javascript:void(0);'\
  \ method='post'>\n            <fieldset>\n                <legend>预约表</legend>\n\
  \                <div class=\"exampleDate\">\n                    <label for=\"\
  exampleDate\">日期:</label>\n                    <input type=\"text\" name=\"exampleDate\"\
  \ id=\"exampleDate\" />\n                    <img src=\"images/Calendar.png\" alt=\"\
  Calendar Icon\" />\n                </div>\n            </fieldset>\n        </form>\n\
  \    </body>\n</html>\n```\n\n前面的标记中的日期字段通过以下 JavaScript 被转换成了 Datepicker：\n\n```javascript\n\
  $(document).ready(\n    function() {\n        $('input#exampleDate').datepicker({\n\
  \            changeMonth : true,\n            changeYear : true,\n            minDate\
  \ : new Date(1900, 1, 1),\n            maxDate : new Date(2020, 12, 31),\n     \
  \       yearRange : \"1900:2020\"\n        });\n        $('div.exampleDate img').click(\n\
  \            function() {\n                $(this)\n                    .prev('input')\n\
  \                    .focus();\n            }\n        );\n    }\n);\n```\n\n前面的结果显示在\
  \ 图 16.3。\n\n前面的脚本为 Datepicker 设置了五个选项。前两个选项 `changeMonth` 和 `changeYear` 分别切换弹出\
  \ Datepicker 中的月份或年份是否为 `<select>` 输入。如果这些选项设置为 `false`（如下下面的脚本，位于源文件 `Example-16-4`\
  \ 中），月份和年份将变为静态：\n\n```javascript\n$('input#exampleDate').datepicker({\n    changeMonth\
  \ : false,\n    changeYear : false,\n    minDate : new Date(1900, 1, 1),\n    maxDate\
  \ : new Date(2020, 12, 31),\n    yearRange : \"1900:2020\"\n});\n```\n\n![image](img/c16f003.jpg)\n\
  \n**图 16.3** 显示了提供 `changeMonth` 时使用 `false` 值与 `true` 值的区别。\n\n图 16.4\n\n![image](img/c16f004.jpg)\n\
  \n**图 16.4**\n\n\n\n\n也可以仅将月份设置为 `<select>` 输入框或仅设置为年份。在下一节中，你将学习如何对 Datepicker\
  \ 进行本地化。\n\n## 本地化 Datepicker\n\nDatepicker 插件具有许多本地化选项，允许你完全更改日历的外观、使用的文本、日期格式以及日历开始的星期。以下章节描述了如何对\
  \ Datepicker 实现进行本地化。\n\n### 设置日期格式\n\n你可以将 `<input>` 元素的值的日期格式更改为你喜欢的任何格式。以下脚本\
  \ `Example-16-5` 演示了如何更改日期格式，将日期放在月份之前，这是世界上许多国家的日期表示方式：\n\n```\n$(document).ready(\n\
  \    function()\n    {\n        $('input#exampleDate').datepicker({\n          \
  \  changeMonth : true,\n            changeYear : true,\n            minDate : new\
  \ Date(1900, 1, 1),\n            maxDate : new Date(2020, 12, 31),\n           \
  \ yearRange : \"1900:2020\",\n            dateFormat : \"dd/mm/yy\"\n        });\n\
  \        $('div.exampleDate img').click(\n            function()\n            {\n\
  \                $(this)\n                    .prev('input')\n                 \
  \   .focus();\n            }\n        );\n    }\n);\n```\n\n在前面的脚本中，日期格式是通过 `dateFormat`\
  \ 选项设置的；在这种情况下，它指定了日、月、年——日和月带有前导零，年份为四位格式。完整的选项列表可以在 附录 O 中的“格式选项”部分找到。图 16.5 显示日期首先出现，然后是月份，最后是年份。\n\
  \n## 本地化 Datepicker 文本\n\n你可以使用以下选项对 Datepicker 的实现进行本地化、自定义或翻译：\n\n*   `appendText`——在每个日期字段后显示的文本。\n\
  *   `buttonText`——在触发 Datepicker 的按钮元素上显示的文本。\n*   `closeText`——用于关闭链接的文本。默认值为 `“Close”`。\n\
  *   `currentText`——用于当前日期链接的文本。默认值为 `“Today”`。\n*   `dayNames`——从星期日开始的长星期名称列表，用于通过\
  \ `dateFormat` 设置请求。当悬停在相应的列标题上时，星期名称也会作为弹出提示出现。默认值为 `[“Sunday”, “Monday”, “Tuesday”,\
  \ “Wednesday”, “Thursday”, “Friday”, “Saturday”]`。\n*   `dayNamesMin`——从星期日开始的简写星期名称列表，用于\
  \ Datepicker 内部的列标题。默认值为 `[“Su”, “Mo”, “Tu”, “We”, “Th”, “Fr”, “Sa”]`。\n*   `dayNamesShort`——从星期日开始的缩写星期名称列表，用于通过\
  \ `dateFormat` 设置请求。默认值为 `[“Sun”, “Mon”, “Tue”, “Wed”, “Thu”, “Fri”, “Sat”]`。\n\
  *   `monthNames`——全月份列表，用于每个 Datepicker 上的月份标题以及通过 `dateFormat` 设置请求。默认值为 `[“January”,\
  \ “February”, “March”, “April”, “May”, “June”, “July”, “August”, “September”, “October”,\
  \ “November”, “December”]`。\n*   `monthNamesShort`——缩写月份名称列表，用于通过 `dateFormat` 设置请求。默认值为\
  \ `[“Jan”, “Feb”, “Mar”, “Apr”, “May”, “Jun”, “Jul”, “Aug”, “Sep”, “Oct”, “Nov”,\
  \ “Dec”]`。\n*   `nextText`——用于下个月链接的文本。默认值为 `“Next”`。\n*   `prevText`——用于上个月链接的文本。默认值为\
  \ `“Prev”`。\n*   `weekHeader`——一年中的周列标题（参见 `showWeeks`）。默认值为 `“wk”`。\n\n![image](img/c16f005.jpg)\n\
  \n**图 16.5**\n\n### 更改起始星期\n\n在世界某些地方，日历从星期一开始到星期日结束。你想要使用的任何起始星期都可以通过 `firstDay`\
  \ 选项进行自定义。以下脚本 `Example 16-6` 演示了如何更改起始星期：\n\n```\n$(document).ready(\n    function()\n\
  \    {\n        $('input#exampleDate').datepicker({\n            changeMonth : true,\n\
  \            changeYear : true,\n            minDate : new Date(1900, 1, 1),\n \
  \           maxDate : new Date(2020, 12, 31),\n            yearRange : \"1900:2020\"\
  ,\n            dateFormat : \"dd/mm/yy\",\n            firstDay : 1\n        });\n\
  \        $('div.exampleDate img').click(\n            function()\n            {\n\
  \                $(this)\n                    .prev('input')\n                 \
  \   .focus();\n            }\n        );\n    }\n);\n```\n\n在前面的脚本中，`firstDay` 选项将起始日从星期日（0）更改为星期一（1）。图\
  \ 16.5 显示了更改的结果。\n\n![image](img/c16f005.jpg)\n\n## 总结\n\n在本章中，你了解了一些关于 Datepicker\
  \ 插件提供的功能。本章仅涵盖了允许的部分选项、文本标签和起始星期；然而，包含所有你可以配合 `datepicker()` 方法使用的选项的完整参考出现在 附录\
  \ O 中。\n\n## 练习\n\n1. 列出你可能用于限制用户输入日期的两个选项。\n2. 哪个选项设置了年份下拉菜单中填充的年份？示例值是什么？\n3.\
  \ 哪些选项提供了月份和年份的下拉菜单？\n4. 你会使用哪个选项来更改日期格式？\n5. Datepicker 插件是否允许你将其文本翻译成西班牙语？你将如何将星期标签翻译成西班牙语？\n\
  6. 你会使用哪个选项来更改起始星期？\n\n# 第 17 章：对话（Dialog）\n\n本章介绍了如何使用 jQuery UI Dialog 插件，该插件提供了使用标记、CSS\
  \ 和 JavaScript 创建的弹出窗口。\n\n与弹出窗口不同（弹出窗口需要在单独的浏览器窗口中打开新文档，而新窗口日益受到安全限制的束缚，例如无法隐藏文档\
  \ URL 和无法隐藏窗口底部的状态栏），使用标记、CSS 和 JavaScript 创建的对话框可以按你喜欢的任何方式进行样式，并施加你想要的任何限制。例如，你有能力创建一个模态对话框，它提供一个对话框并防止用户在对话框关闭之前继续与文档交互。\n\
  \n弹出窗口和对话框之间的另一个区别（在本章的剩余部分，我将继续称此组件为对话框——不再重复它们是由标记、CSS 和 JavaScript 生成的事实）是对话框无法离开它们所在的浏览器窗口。因此，对话框无法最小化到你操作系统的任务栏中，尽管你可能可以创建自己的最小化脚本，以便对话框在浏览器窗口内最小化。\n\
  \n\n\n\n\n正如你在书中学到的许多内容一样，jQuery UI 在对话框（dialogs）方面的实现同样几乎无可挑剔。\n\n## 实现对话框\n\n\
  与其他每一个 jQuery UI 插件一样，对 Dialog 插件的讨论始于演示该插件在默认状态下的作用。`Example 17-1` 展示了其开箱即用的实现：\n\
  \n```\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n\
  \        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>Dialog Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 17-1.js'></script>\n\
  \        <link href='Example 17-1.css' rel='stylesheet' />\n    </head>\n    <<body>\n\
  \        <div id='exampleDialog' title='Lorem Ipsum'>\n            <p>\n       \
  \         Lorem ipsum dolor sit amet, consectetuer adipiscing elit. In\n       \
  \         sagittis commodo ipsum. Donec est. Mauris eget arcu. Suspendisse\n   \
  \             tincidunt aliquam velit. Maecenas libero. Aliquam dapibus\n      \
  \          tincidunt eros. Donec suscipit tincidunt odio. Maecenas congue\n    \
  \            tortor non ligula. Phasellus vel elit. Suspendisse potenti. Nunc\n\
  \                odio quam, hendrerit ac, imperdiet sit amet, venenatis sed, enim.\n\
  \            </p>\n        </div>\n    </body>\n</html>\n```\n\n接下来的样式表应用于上述标记标记中：\n\
  \n```\nbody {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background:\
  \ #fff;\n    color: rgb(50, 50, 50);\n}\n```\n\n在接下来的脚本中，你将看到如何通过选择 id 为 `exampleDialog`\
  \ 的 `<div>` 元素并调用 `dialog()` 方法，将其转换为对话框：\n\n```\n$(document).ready(\n    function()\n\
  \    {\n        $('div#exampleDialog').dialog();\n    }\n);\n```\n\n在图 17.1 中，你可以看到对话框在开箱即用的情况下并不好看。对话框的标题通过将标题放在要转换为对话框的元素的\
  \ `title` 属性中设置。对话框标题也可以通过向 `dialog()` 方法传递 `title` 选项来设置；两种设置标题的方法均可以使用。如果使用了两种方法，则将使用\
  \ `dialog()` 方法的 `title` 选项。\n\n![image](img/c17f001.jpg)\n\n图 17.1\n\n## 设置对话框样式\n\
  \n在学习如何为对话框设置样式之前，你需要了解它如何在标记中被构建和组装。以下标记是 `dialog()` 方法完成文档修改后，典型的 jQuery UI 对话框使用的基本结构：\n\
  \n```\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n\
  \        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>Dialog Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <link href='Example 17-2.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <div class=\"ui-dialog\n\
  \                    ui-widget\n                    ui-widget-content\n        \
  \            ui-corner-all\n                    ui-front\n                    ui-draggable\n\
  \                    ui-resizable\"\n             tabindex=\"-1\"\n            \
  \ role=\"dialog\"\n             aria-describedby=\"exampleDialog\"\n           \
  \  aria-labelledby=\"ui-id-1\">\n            <div class=\"ui-dialog-titlebar\n \
  \                       ui-widget-header\n                        ui-corner-all\n\
  \                        ui-helper-clearfix\">\n                <span id=\"ui-id-1\"\
  \ class=\"ui-dialog-title\">\n                    Lorem Ipsum\n                </span>\n\
  \                <button type=\"button\"\n                        class=\"ui-button\n\
  \                               ui-widget\n                               ui-state-default\n\
  \                               ui-corner-all\n                               ui-button-icon-only\n\
  \                               ui-dialog-titlebar-close\"\n                   \
  \     role=\"button\"\n                        aria-disabled=\"false\"\n       \
  \                 title=\"close\">\n                    <span class=\"ui-button-icon-primary\n\
  \                                 ui-icon\n                                 ui-icon-closethick\"\
  ></span>\n                    <span class=\"ui-button-text\">close</span>\n    \
  \            </button>\n            </div>\n            <div id=\"exampleDialog\"\
  \ class=\"ui-dialog-content ui-widget-content\">\n                <p>\n        \
  \            Lorem ipsum dolor sit amet, consectetuer adipiscing elit. In\n    \
  \                sagittis commodo ipsum. Donec est. Mauris eget arcu.\n        \
  \            Suspendisse tincidunt aliquam velit. Maecenas libero.\n           \
  \         Aliquam dapibus tincidunt eros. Donec suscipit tincidunt odio. Maecenas\
  \ congue\n                    tortor non ligula. Phasellus vel elit. Suspendisse\
  \ potenti. Nunc\n                    odio quam, hendrerit ac, imperdiet sit amet,\
  \ venenatis sed, enim.\n                </p>\n            </div>\n            <div\
  \ class=\"ui-resizable-n\"></div>\n            <div class=\"ui-resizable-e\"></div>\n\
  \            <div class=\"ui-resizable-s\"></div>\n            <div class=\"ui-resizable-w\"\
  ></div>\n            <div class=\"ui-resizable-se\n                        ui-icon\n\
  \                        ui-icon-diagonal\"></div>\n            <div class=\"ui-resizable-sw\"\
  ></div>\n            <div class=\"ui-resizable-ne\"></div>\n             <div class=\"\
  ui-resizable-nw\"></div>\n        </div>\n    </body>\n</html>\n```\n\n上述标记可以在本书的源码材料的\
  \ *Example 17-2.html* 文件中找到。\n\n如上述标记所示，`dialog()` 方法添加了标题栏、调整大小手柄和一个用于关闭对话框的 `<button>`\
  \ 元素。可以通过拖动标题栏来移动对话框，也可以从边缘进行缩放（在缩放手柄到位后）。\n\n就像第 16 章中的“Datepicker”一样，你可以通过应用 jQuery\
  \ UI 网站的 jQuery UI 主样式表或手动为对话框标记设置样式来设置 jQuery UI 对话框的样式。在 *Example 17-3* 中，你正是这样做的：\n\
  \n```\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n\
  \        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>Dialog Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 17-3.js'></script>\n\
