  \            </p>\n        </div>\n    </body>\n</html>\n```\n\n\n\n\n\n之前的标记文档保存为\
  \ `Example 17-3.html`，并使用以下样式表 `Example 17-3.css` 进行样式设置：\n\n```css\nbody {\n  \
  \  font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background: #fff;\n   \
  \ color: rgb(50, 50, 50);\n}\ndiv.ui-dialog {\n    box-shadow: 0 7px 100px rgba(0,\
  \ 0, 0, 0.6);\n    border-radius: 4px;\n    outline: none;\n    position: fixed;\n\
  \    z-index: 1000;\n    background: #fff;\n}\ndiv.ui-dialog-titlebar {\n    height:\
  \ 23px;\n    background: url('images/Titlebar Right.png')\n                no-repeat\
  \ \n                top right,\n                url('images/Titlebar Left.png')\n\
  \                no-repeat\n                top left;\n    position: relative;\n\
  \    z-index: 10;\n}\nspan.ui-dialog-title {\n    display: block;\n    font-size:\
  \ 13px;\n    text-align: center;\n    margin: 0 9px;\n    padding: 4px 0 0 0;\n\
  \    height: 19px;\n    background: url('images/Titlebar.png')\n               \
  \ repeat-x \n                top;\n    position: relative;\n    z-index: 10;\n}\n\
  div.ui-dialog-container {\n    background: #fff\n                url('images/Titlebar\
  \ Left.png') \n                no-repeat \n                top left;\n}\nbutton.ui-dialog-titlebar-close\
  \ {\n    position: absolute;\n    width: 14px;\n    height: 15px;\n    top: 5px;\n\
  \    left: 10px;\n    border: none;\n    background: url('images/Close Off.png')\n\
  \                no-repeat \n                top left;\n    z-index: 10;\n}\nbutton.ui-dialog-titlebar-close:hover\
  \ {\n    background: url('images/Close On.png')\n                no-repeat \n  \
  \              top left;\n}\nbutton.ui-dialog-titlebar-close span {\n    display:\
  \ none;\n}\nbutton.ui-dialog-titlebar-close:focus {\n    border: none;\n    outline:\
  \ none;\n}\ndiv.ui-dialog-content  {\n    padding: 10px;\n}\ndiv.ui-resizable-handle\
  \ {\n    border: none;\n    position: absolute;\n    z-index: 1;\n}\ndiv.ui-resizable-nw\
  \ {\n    width: 10px;\n    height: 10px;\n    top: -10px;\n    left: -10px;\n  \
  \  cursor: nw-resize;\n}\ndiv.ui-resizable-n {\n    height: 10px;\n    top: -10px;\n\
  \    left: 0;\n    right: 0;\n    cursor: n-resize;\n}\ndiv.ui-resizable-ne {\n\
  \    width: 10px;\n    height: 10px;\n    top: -10px;\n    right: -10px;\n    cursor:\
  \ ne-resize;\n}\ndiv.ui-resizable-w {\n    width: 10px;\n    left: -10px;\n    top:\
  \ 0;\n    bottom: 0;\n    cursor: w-resize;\n}\ndiv.ui-resizable-e{\n    width:\
  \ 10px;\n    right: -10px;\n    top: 0;\n    bottom: 0;\n    cursor: e-resize;\n\
  }\ndiv.ui-resizable-sw {\n    width: 10px;\n    height: 10px;\n    bottom: -10px;\n\
  \    left: -10px;\n    cursor: sw-resize;\n}\ndiv.ui-resizable-s {\n    height:\
  \ 10px;\n    bottom: -10px;\n    left: 0;\n    right: 0;\n    cursor: s-resize;\n\
  }\ndiv.ui-resizable-se {\n    width: 10px;\n    height: 10px;\n    bottom: -10px;\n\
  \    right: -10px;\n    cursor: se-resize;\n}\n```\n\n之前的样式表和 XHTML 通过以下 JavaScript\
  \ `Example 17-3.js` 结合：\n\n```javascript\n$(document).ready(\n    function()\n \
  \   {\n        $('div#exampleDialog').dialog({\n            title : \"Example Dialog\"\
  \n        });\n    }\n);\n```\n\n之前的样式使 jQuery UI Dialog 看起来类似于 Mac OS X 应用程序窗口，如\
  \ 图 17.2 所示。\n\n在之前的示例中，你学习了如何为 jQuery UI Dialog 插件应用样式，该插件的样式灵感源于 Mac OS X 上应用程序窗口的外观。\n\
  \n图 17.2 中提到的示例在每个现代浏览器中都能运行良好，但在旧版本的 IE 中没有阴影，因为它们无法渲染 `box-shadow` 属性。\n\n## 创建模态框\n\
  \n模态对话框（modal dialog）是一种在关闭之前阻止与文档进行交互的对话框。当你将 `modal` 选项设置为 `true` 并应用 `ui.widget-overlay`\
  \ CSS 规则时，可以在对话框打开期间禁用与背景内容的交互。与背景内容的交互之所以被禁用，是因为当启用 `modal` 选项时，带有 `ui-widget-overlay`\
  \ 类名的 `<div>` 元素会被动态添加到文档中。该元素由于占据了整个窗口并位于背景内容之前、打开的对话框之后，从而阻止了对背景内容的访问。\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Modal\
  \ Dialog</title>\n    <link rel=\"stylesheet\" href=\"Example 17-3.css\">\n</head>\n\
  <body>\n    <div id=\"exampleDialog\">\n        <p>This is a modal dialog.</p>\n\
  \    </div>\n    <script src=\"Example 17-3.js\"></script>\n</body>\n</html>\n```\n\
  \n在之前的脚本中，你通过将 `modal` 选项设置为 `true` 来开启它：\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        $('div#exampleDialog').dialog({\n            title\
  \ : \"Example Dialog\",\n            modal : true\n        });\n    }\n);\n```\n\
  \n\n\n\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>Dialog Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 17-5.js'></script>\n\
  \        <link href='Example 17-5.css' rel='stylesheet' />\n    </head>\n    <body><body>\n\
  \        <p>\n            Lorem ipsum dolor sit amet, consectetuer adipiscing elit.\
  \ In\n            sagittis commodo ipsum. Donec est. Mauris eget arcu. Suspendisse\n\
  \            tincidunt aliquam velit. Maecenas libero. Aliquam dapibus\n       \
  \     tincidunt eros. Donec suscipit tincidunt odio. Maecenas congue\n         \
  \   tortor non ligula. Phasellus vel elit. Suspendisse potenti. Nunc\n         \
  \   odio quam, hendrerit ac, imperdiet sit amet, venenatis sed, enim.\n        </p>\n\
  \        <input type='submit' id='exampleDialogOpen' value='Open Dialog' />\n  \
  \      <div id='exampleDialog' title='Lorem Ipsum'>\n            <p>\n         \
  \       Lorem ipsum dolor sit amet, consectetuer adipiscing elit. In\n         \
  \       sagittis commodo ipsum. Donec est. Mauris eget arcu. Suspendisse\n     \
  \           tincidunt aliquam velit. Maecenas libero. Aliquam dapibus\n        \
  \        tincidunt eros. Donec suscipit tincidunt odio. Maecenas congue\n      \
  \          tortor non ligula. Phasellus vel elit. Suspendisse potenti. Nunc\n  \
  \              odio quam, hendrerit ac, imperdiet sit amet, venenatis sed, enim.\n\
  \            </p>\n        </div>\n    </body>\n</html>\n```\n\n来自 `Example 17-4`\
  \ 的 CSS 文档被应用于上述标记文档，并带有以下脚本：\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n        $('div#exampleDialog').dialog({\n            title : 'Example Dialog',\n\
  \            modal : true,\n            autoOpen : false\n        });\n        $('input#exampleDialogOpen').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                $('div#exampleDialog')\n                    .dialog('open');\n\
  \            }\n        );\n    }\n);\n```\n\n在前面的脚本中，你通过将 `autoOpen` 选项设置为 `false`\
  \ 来防止对话框自动打开。要打开对话框，你向 `<input>` 元素附加一个 `click` 事件，当该事件发生时，你调用 `$('div#exampleDialogOpen').dialog('open')`\
  \ 来程序化地打开对话框。图 17.4 显示了上述示例。\n\n![image](img/c17f004.jpg)\n\n**图 17.4**\n\n## 控制动态交互\n\
  \n默认情况下，jQuery UI Dialog 插件允许你调整对话框的大小并拖动。通过向 `dialog()` 方法传递选项，可以禁用与对话框的两种动态交互。例如，可以将\
  \ `draggable` 选项设置为 `false` 以禁用拖动对话框，也可以将 `resizable` 选项设置为 `false` 以禁用调整对话框大小。禁用这些选项在下面的脚本\
  \ *示例 17-6* 中均有演示：\n\n```javascript\n$(document).ready(\n    function()\n    {\n\
  \        $('div#exampleDialog').dialog({\n            title : 'Example Dialog',\n\
  \            modal : true,\n            autoOpen : false,\n            resizable\
  \ : false,\n            draggable : false\n        });\n        $('input#exampleDialogOpen').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                $('div#exampleDialog')\n                    .dialog('open');\n\
  \            }\n        );\n    }\n);\n```\n\n## 对话框动画\n\n打开或关闭对话框也可以使用 附录 M，“效果”中列出的效果之一来实现。通过向\
  \ `show` 选项提供效果，可以引入动画。\n\n下面的脚本 *示例 17-7* 演示了如何这样做：\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        $('div#exampleDialog').dialog({\n            title\
  \ : 'Example Dialog',\n            modal : true,\n            autoOpen : false,\n\
  \            resizable : true,\n            draggable : true,\n            show\
  \ : 'explode'\n        });\n        $('input#exampleDialogOpen').click(\n      \
  \      function(event)\n            {\n                event.preventDefault();\n\
  \                $('div#exampleDialog')\n                    .dialog('open');\n\
  \            }\n        );\n    }\n);\n```\n\n前面的脚本在打开对话框时使用 jQuery 的 `explode`\
  \ 效果应用了动画。图 17.5 捕捉了动画中的 explode 效果。\n\n![image](img/c17f005.jpg)\n\n**图 17.5**\n\
  \n## 处理对话框事件\n\nDialog 插件支持多种事件。下面的文档 *示例 17-8* 演示了如何为对话框附加 `close` 和 `open` 事件：\n\
  \n```javascript\n$(document).ready(\n    function()\n    {\n        $('div#exampleDialog').dialog({\n\
  \            title : 'Example Dialog',\n            modal : true,\n            autoOpen\
  \ : false,\n            resizable : true,\n            draggable : true,\n     \
  \       show : 'explode',\n            close : function(event, ui)\n           \
  \ {\n                alert('Dialog Closed');\n            },\n            open :\
  \ function(event, ui)\n            {\n                alert('Dialog Opened');\n\
  \            }\n        });\n        $('input#exampleDialogOpen').click(\n     \
  \       function(event)\n            {\n                event.preventDefault();\n\
  \                $('div#exampleDialog')\n                    .dialog('open');\n\
  \            }\n        );\n    }\n);\n```\n\n回调函数在它附加的对话框元素的上下文中执行，使得可以通过 `this`\
  \ 关键字访问该元素，如 图 17.6 所示。\n\n![image](img/c17f006.jpg)\n\n## 总结\n\n在本章中，你学习了如何使用 jQuery\
  \ UI Dialog 插件实现对话框。Dialog 插件自带多少样式，因此你学习了标记的结构并为对话框实现了自定义样式。对话框样式的另一种更简单的方法是从 [`www.jqueryui.com`](http://www.jqueryui.com)\
  \ 网站下载并应用 jQuery UI 主题。\n\n你学习了使用 `modal` 选项创建模态对话框：通过向样式表中添加必要的 CSS，它可以防止与文档的交互。\n\
  \n你学习了如何通过 `autoOpen` 选项禁用自动打开对话框。在禁用自动打开后，你可以调用 `dialog('open')` 来程序化地打开对话框，或调用\
  \ `dialog('close')` 关闭对话框。\n\n你可以通过 `resizable` 和 `draggable` 选项禁用调整对话框大小或拖动对话框。\n\
  \n通过向 `show` 选项提供效果（在 附录 P 中记录），你可以实现打开和关闭对话框的动画。\n\n最后，对话框有多种事件，你可以附加回调函数。你看到了\
  \ `close` 事件的示例，但完整的选项列表在附录 P](#bapp16.xhtml) 中。\n\n## 练习题\n\n1. 对话框打开时使用哪个选项可以禁用与文档的交互？\n\
  \n2. 如何禁用自动打开对话框？\n\n\n\n\n\n### 3. 当禁用了自动打开对话框时，如何打开对话框？\n### 4. 如何关闭对话框？\n###\
  \ 5. 如何禁用对话框的缩放和拖拽？\n### 6. 使用哪个选项可以动画打开或关闭对话框？\n\n## 第 18 章\n\n## 标签页 (Tabs)\n\n\
  在本 jQuery 和 jQuery UI 介绍中，我们将介绍如何使用 jQuery UI Tabs 插件。该插件可以更容易实现标签页功能，即点击一系列标签来切换内容的显示，这些内容可能已经存在于文档中，或者通过\
  \ AJAX 请求动态加载。\n\njQuery UI 提供了实现标签页用户界面所需的所有功能方面。对于界面的样式设置（例如 `Dialog` 和 `Datepicker`），你可以使用\
  \ jQuery UI 主题，也可以创建自己的样式表。\n\n实现标签页用户界面与 jQuery UI 提供的许多插件功能一样，是既简单又直观的。你只需要学习少数基础知识，例如如何构建将成为标签的标记结构，以及\
  \ `Tabs` 插件提供的各种选项，这些选项允许你调整实现以覆盖不同的使用场景以及回调事件。\n\n本章涵盖了如何实现和样式化标签页用户界面，并涵盖了 `Tabs`\
  \ 插件中你可能感兴趣的几个选项。与其他 jQuery UI 插件一样，关于选项、回调事件和参数的全面参考可以在附录 Q，“Tabs”找到。\n\n## 实现标签页\n\
