  \n**图 8.3**\n\n## 自定义动画\n\njQuery 还提供了一个通过 `animate()` 方法来辅助自定义动画的 API。jQuery 的\
  \ `animate()` 方法可以在指定的 `duration` 内对任何具有数值的 CSS 属性进行过渡。这使得能够任意动画化 `width`、`height`、`margin`、`padding`、`border-width`\
  \ 或任何具有数值属性的属性。`animate()` 方法会自动从动画开始时存在的样式属性中提取初始值，并使用指定的 `easing` 算法在指定的 `duration`\
  \ 内对这些属性过渡。\n\n下面的示例 `示例 8-4` 展示了如何使用与你前三个示例相同的示例来调用 `animate()` 方法。与 `示例 8-3` 和\
  \ `示例 8-2` 一样，仅提供了 HTML 文档中相对于其他示例变化的部分。\n\n```html\n <label for='exampleAnimationDuration'>\n\
  \                        时长:\n                    </label>\n                   \
  \ <input type='range'\n                           value='5000'\n               \
  \            min='100'\n                           max='10000'\n               \
  \            step='100'\n                           name='exampleAnimationDuration'\n\
  \                           id='exampleAnimationDuration' />\n                 \
  \   <input type='submit'\n                           name='exampleAnimationGrow'\n\
  \                           id='exampleAnimationGrow'\n                        \
  \   value='放大' />\n                    <input type='submit'\n                  \
  \         name='exampleAnimationShrink'\n                           id='exampleAnimationShrink'\n\
  \                           value='收缩' />\n                </div>\n            </fieldset>\n\
  ```\n\n下面的 CSS 仅显示了 `示例 8-3` 中变化的部分。\n\n```css\ndiv#exampleDialog h4 {\n    border:\
  \ 1px solid rgb(50, 50, 50);\n    background: pink;\n    border-radius: 4px;\n \
  \   padding: 5px;\n    margin: 0 0 10px 0;\n}\n```\n\n下面的脚本演示了 `animate()` 方法。\n\
  \n```javascript\n$(document).ready(\n    function()\n    {\n        var animating\
  \ = false;\n        $('input#exampleAnimationGrow').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                if (!animating)\n\
  \                {\n                    animating = true;\n                    var\
  \ easing = $('select#exampleAnimationEasing').val();\n                    var duration\
  \ = parseInt($('input#exampleAnimationDuration').val());\n                    $('div#exampleDialog').animate(\n\
  \                        {\n                            width : '400px',\n     \
  \                       height : '350px',\n                            marginLeft\
  \ : '-210px',\n                            marginTop : '-185px'\n              \
  \          },\n                        duration,\n                        easing,\n\
  \                        function()\n                        {\n               \
  \             animating = false;\n                        }\n                  \
  \  );\n                }\n            }\n        );\n        $('input#exampleAnimationShrink').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                if (!animating)\n                {\n                    animating\
  \ = true;\n                    var easing = $('select#exampleAnimationEasing').val();\n\
  \                    var duration = parseInt($('input#exampleAnimationDuration').val());\n\
  \                    $('div#exampleDialog').animate(\n                        {\n\
  \                            width : '300px',\n                            height\
  \ : '200px',\n                            marginLeft : '-160px',\n             \
  \               marginTop : '-110px'\n                        },\n             \
  \           duration,\n                        easing,\n                       \
  \ function()\n                        {\n                            animating =\
  \ false;\n                        }\n                    );\n                }\n\
  \            }\n        );\n\n\n\n\n`width` 从 `300px` 变化到 `400px`，`height` 从 `200px`\
  \ 变化到 `350px`，`margin-left` 从 `-160px` 变化到 `-210px`，`margin-top` 从 `-110px` 变化到\
  \ `-185px`。这四个属性同时进行动画，采用由 `duration` 和 `easing` 选择决定的相同速率。除了指定要动画的自定义 CSS 属性外，`animate()`\
  \ 方法与本章早些章节介绍的方法相似。\n\n尽管 `animate()` 方法仅限于数值型 CSS 属性的动画，但 jQuery UI 作为一个整体，提供了一个\
  \ jQuery Color 插件，用于颜色之间以及数值之间的过渡动画。\n\n下一节将介绍你可以提供给任何 jQuery 动画方法的选项，以便对 jQuery\
  \ 动画进行更精细粒度的控制。\n\n## **动画选项**\n\n所有的 jQuery 动画方法——`animate()` 方法以及 `show()`、`hide()`、`toggle()`、`slideIn()`、`slideDown()`、`slideToggle()`、`fadeIn()`、`fadeOut()`\
  \ 和 `fadeToggle()`——都支持提供一个键值对的简单 JavaScript 对象来代替 `duration`、`easing` 和 `callback\
  \ function` 参数，这允许你精调动画的所有方面。\n\n以下内容描述了当使用 `options` 参数代替 `duration`、`easing` 和\
  \ `callback function` 参数时，所有这些方法的签名看起来是什么样。\n\n*   `animate(properties, options)`\n\
  *   `show(options)`, `hide(options)`, `toggle(options)`\n*   `slideDown(options)`,\
  \ `slideUp(options)`, `slideToggle(options)`\n*   `fadeIn(options)`, `fadeOut(options)`,\
  \ `fadeToggle(options)`\n\n在备选的 `options` 参数中可以提供的选项如下：\n\n*   `duration`——动画的长度。值可以是表示毫秒的整数，也可以以下字符串之一：`'slow'`、`'normal'`\
  \ 或 `'fast'`。\n\n*   `easing`——过渡随时间如何动画化。该值将是引用 jQuery 内置缓动函数的一个字符串。\n\n*   `queue`——一个布尔值，指示动画是否应该被放入\
  \ jQuery 的动画队列中。如果提供的 `queue` 值为 `false`，则动画不会入队并立即开始。如果提供的是字符串值，则动画被放入以该字符串命名的队列中。如果使用了自定义队列名称，动画将不会自动启动；要启动自定义队列，请调用\
  \ `dequeue(queueName)` 方法。\n\n*   `specialEasing`——仅适用于 `animate()` 方法。一个对象，将 `properties`\
  \ 参数中提供的 CSS 属性映射到缓动（easing）。这使得不同的属性使用不同的缓动进行动画成为可能。\n\n*   `step function((number)\
  \ now, (tween) tween)`——一个回调函数，在动画的每一步中，为每个动画元素的每个动画化属性执行一次。\n\n*   `progress function((promise)\
  \ animation, (number) progress, (number) remainingMilliseconds)`——一个回调函数，在动画的每一步之后执行，但无论动画属性如何，每个动画元素仅执行一次。\n\
  \n*   `complete function()`——当动画完成时执行一个执行的回调函数。\n\n*   `start function((promise)\
  \ animation)`——在动画开始时执行的回调函数。\n\n*   `done function((promise) animation, (Boolean)\
  \ jumpedToTheEnd)`——在动画完成且其 Promise 对象已解析（resolved）时执行的回调函数。\n\n*   `fail function((promise)\
  \ animation, (Boolean) jumpedToTheEnd)`——当动画未完成且其 Promise 对象被拒绝（rejected）时执行的回调函数。\n\
  \n*   `always function((promise) animation, (Boolean) jumpedToTheEnd)`——当动画完成或在未完成的情况下停止，且其\
  \ Promise 对象被解析或被拒绝时执行的回调函数。\n\n## **总结**\n\n在本章中，你学习了 jQuery 的动画方法如何用于隐藏、显示或过渡元素，可以通过使用\
  \ jQuery 的各种内置动画或通过制作自定义动画来实现。\n\n你学习了 jQuery 的 `hide()`、`show()` 和 `toggle()`，以及所有七个额外的动画相关方法都可以提供一个\
  \ `duration` 参数，该参数可以是字符串 `'slow'`、`'normal'` 或 `'fast'`，也可以是指定毫秒的整数。在不指定任何参数的情况下，jQuery\
  \ 的 `show()`、`hide()` 和 `toggle()` 方法仅通过切换 CSS `display` 属性来显示和隐藏元素，而不产生任何动画。指定至少一个参数会使这些方法使用动画在隐藏和显示状态之间进行过渡。\n\
  \njQuery 提供了一些替代动画，它们本质上提供了与 `show()`、`hide()` 和 `toggle()` 方法相同的功能。`slideDown()`、`slideUp()`\
  \ 和 `slideToggle()` 方法通过动画元素的高度来隐藏和显示元素。`fadeIn()`、`fadeOut()` 和 `fadeToggle()`\
  \ 方法通过动画元素的透明度。\n\n最后，你学习了如何使用 `animate()` 方法，它在元素已有的样式与你在第一个参数中指定的样式之间进行过渡。所有的数值属性都可以被动画化。\n\
  \n1. 在指定动画持续时间时，允许哪些值？\n2. jQuery 的 `slideDown()` 作用是什么？\n3. 你会使用哪种方法通过元素自身的动画来显示或隐藏元素？\n\
  4. 你使用哪种方法创建自定义动画？\n5. jQuery 提供了哪些缓动（easings）？\n\n# 第 9 章：插件\n\n除了让许多脚本任务变得简单得多之外，jQuery\
  \ 还通过新功能使其易扩展。这是通过一个简单易懂的插件 API 实现的。使用 jQuery 的插件 API，你可以创建自己的链式调用 jQuery 方法，甚至完全作为\
  \ jQuery 插件编写整个客户端应用程序。\n\n使用插件可以做很多事情。jQuery 插件的一些比较有用且著名的示例可以在 jQuery UI 库中找到，我在[第\
  \ 12 章]“可拖拽和可放置”中详细讨论。jQuery UI 库中的插件帮助你实现如拖放或选择元素以及各种其他功能。jQuery 还有一个蓬勃的第三方开发社区，他们能为几乎你能想象到的任何事情制作插件。你将检查几个第三方\
  \ jQuery 插件，并在本书的[第二部分]“jQuery UI”中编写一个。\n\n## **编写插件**\n\njQuery 插件很容易实现。你只需要将一个包含你想要扩展\
  \ jQuery 的方法的对象字面量传递给 `$.fn.extend()` 方法即可。\n\n### ** 编写一个简单的 jQuery 插件**\n\n\n\n\
  \n\n`Example 9-1` 展示了如何编写一个简单的 jQuery 插件。如果你想亲自尝试这个示例，可以在 第 9 章 文件夹中找到它以及书中的其他示例，你可以从\
  \ [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 下载。\n\n```\n<!DOCTYPE HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n \
  \   <head>\n        <meta http-equiv=\"content-type\"\n            content=\"application/xhtml+xml;\
  \ charset=utf-8\" />\n        <meta http-equiv=\"content-language\" content=\"en-us\"\
  \ />\n        <title>John Candy Movies</title>\n        <script type='text/javascript'\
  \ src='../jQuery.js'></script>\n        <script type='text/javascript' src='Example\
  \ 9-1.js'></script>\n        <link type='text/css' href='Example 9-1.css' rel='stylesheet'\
  \ />\n    </head>\n    <body>\n        <h2>John Candy Movies</h2>\n        <ul class='movieList'>\n\
  \            <li>The Great Outdoors</li>\n            <li>Uncle Buck</li>\n    \
  \        <li>Who’s Harry Crumb?</li>\n            <li>Canadian Bacon</li>\n    \
  \        <li>Home Alone</li>\n            <li>Spaceballs</li>\n            <li>Planes,\
  \ Trains, and Automobiles</li>\n        </ul>\n        <p>\n            <a href='javascript:void(0);'\
  \ id='movieSelectAll'>Select All</a>\n        </p>\n    </body>\n</html>\n```\n\n\
  以下 CSS 为你启用了 jQuery 插件的 XHTML 5 文档设置了基础基础样式，这样你就可以直观地看到点击电影列表中的项目时发生了什么：\n\n```\n\
  body {\n    font: 200 16px Helvetica, Arial, sans-serif;\n}\nh2 {\n    font: 200\
  \ 18px Helvetica, Arial, sans-serif;\n    text-decoration: underline;\n}\nul.movieList\
  \ {\n    list-style: none;\n    margin: 10px;\n    padding: 0;\n}\nul.movieList\
  \ li {\n    padding: 3px;\n}\nul.movieList li.movieSelected {\n    background: forestgreen;\n\
  \    color: white;\n}\na {\n    text-decoration: none;\n    color: green;\n}\na:hover\
  \ {\n    text-decoration: underline;\n}\n```\n\n以下 JavaScript 提供了一个简单、直观的演示，说明了如何使用\
  \ jQuery 插件 API 为 jQuery 编写自定义插件：\n\n```\n$.fn.extend({\n    select : function()\n\
  \    {\n        // 在 jQuery 插件中；'this' 已经是一个 jQuery ready 对象\n        // 执行像 addClass()\
  \ 的操作可以作用于一个\n        // 或多个项目，取决于选择。\n        return this.addClass('movieSelected');\n\
  \    },\n    unselect : function()\n    {\n        return this.removeClass('movieSelected');\n\
  \    }\n});\nvar movies = {\n    ready : function()\n    {\n        $('a#movieSelectAll').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                $('ul.movieList li').select();\n            }\n        );\n   \
  \     $(document).on(\n             'click.movieList',\n             'ul.movieList\
  \ li',\n            function()\n            {\n                if ($(this).hasClass('movieSelected'))\n\
  \                {\n                    $(this).unselect();\n                }\n\
  \                else\n                {\n                    $(this).select();\n\
  \                }\n            }\n        );\n    }\n};\n$(document).ready(\n \
  \   function()\n    {\n        movies.ready();\n    }\n);\n```\n\n上述代码生成了当你点击单个电影标题时，你会在\
  \ 图 9.1 中看到的截图。\n\n![image](img/c09f001.jpg)\n\n**图 9.1**\n\n在前面的示例中，你将了如何使用 `$.fn.extend()`\
  \ 方法编写 jQuery 插件。从本质上说，jQuery 插件扩展了对代表 HTML 元素的对象可以可以的操作。在这种情况下，你创建了两个 jQuery 插件，一个用于选择元素，另一个用于取消选择元素。选择本身是通过给其中一个\
  \ `<li>` 元素应用类来实现的。如果 `<li>` 元素被选中，则会应用 `movieSelected` 类名。如果 `<li>` 元素未被选中，则移除\
  \ `movieSelected` 类名。为了让你直观地看到某个项目被选中，`movieSelected` 类名应用了 `forestgreen` 背景并将文本设置为\
  \ `white`。这是一个关于使用 jQuery 插件可以实现什么的非常简单的示例；你获取一个或多个 HTML 元素并直接对这些元素进行操作。在这个示例中，你正在进行选择，但你可以使用\
  \ jQuery 插件做更复杂的事情。你可以编写一个为输入元素添加日历的插件；你可以编写一个让元素成为拖放操作投放区域的插件。你将在本书中看到更多 jQuery\
  \ 插件的示例；有些是由 jQuery Foundation 开发的，另一些是很优秀的第三方插件，你将在 第 20 章 “创建交互式幻灯片”中查看它们。\n\n\
  \n\n\n在传统的 JavaScript 中，HTML 元素对象一直有一些内置属性和方法。这些属性和方法使得与 DOM 的交互和操作成为可能。jQuery 居于传统\
  \ JavaScript 内置 DOM 与其提供的用于与 DOM 交互的 API 之间。正如你已经学到的，jQuery 简化了查询和操作 DOM 所需编写的代码量。jQuery\
  \ 提供的大多数方法在传统的 JavaScript DOM API 中都有对应物。你可能在传统 DOM 中找到的一些方法如 `appendChild()` 这样的方法，它在最后一个元素或文本节点之后添加一个新的子元素或文本节点。另一个是\
  \ `getAttribute()`，它返回属性的值。在这两个示例的语境下，jQuery 提供了类似的方法。你不再使用 `appendChild()`，而是获得了一系列用于元素放置和\
  \ DOM 操作的方法，例如 `after()`、`insertAfter()`、`before()`、`insertBefore()`，以及我在第 4 章“操作内容和属性”中向你介绍的所有其他方法。\n\
  \n与其使用 `getAttribute()`、`setAttribute()` 或 `hasAttributes()`，你现在有了 `attr()` 和一系列\
  \ CSS 属性选择器。然而，你会注意到，jQuery 插件的概念是建立在 DOM 以及它暴露的用于操作元素的属性和方法基础之上的。jQuery 插件扩展了对元素的操作的操作，并使得定义完全自定义的方法成为可能。\n\
  \n在*示例 9-2* 中，你使用传统的 JavaScript 对*示例 9-1*中看到的内容进行了微调。你检查了 HTML 文档中 `<a>` 元素附加了哪些属性和方法。\n\
  \n你从这个 XHTML 5 文档开始：\n\n```\n<!DOCTYPE HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
