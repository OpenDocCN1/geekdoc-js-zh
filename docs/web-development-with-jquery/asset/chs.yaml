  \  $('#container').focus();\n    });\n});\n```\n\n\n\n\n对于这个简单的编辑器而言，每个列表顶部的空白项目会被选中。虽然这会带来无法看到上一次选中项目的不便，但它防止了某些可能的混淆。如果没有这一行，用户可能会认为，当你在可编辑元素中选择文本时，程序能够检测到字体名称和大小。\n\
  \n## 创建选区\n\n在处理之前的示例时，你可能已经注意到可以通过在可编辑元素中选择内容来更改现有内容。JavaScript 提供了处理选区的能力，包括通过程序化创建选区、存储当前选区的信息以及恢复已取消的选区等选项。接下来的组示例代码相当多，以涵盖这些情况，但我们将逐一进行讨论。\n\
  \n先从示例标记语言（`Example 21-3.html`）开始：\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <meta charset='utf-8' />\n        <title>WYSIWYG Editor 3</title>\n\
  \        <link href='Example 22-3.css' rel='stylesheet' />\n        <script type='text/javascript'\
  \ src='../jQuery.js'></script>\n        <script type='text/javascript' src='Example\
  \ 22-3.js'></script>\n    </head>\n    <body\n        <div id='toolbar'>\n     \
  \       <button class='toolbar-btn bold' data-format='bold'>B</button>\n       \
  \     <button class='toolbar-btn italic' data-format='italic'>I</button>\n     \
  \       <button class='toolbar-btn underline'                      data-format='underline'>U</button>\n\
  \            <select class='toolbar-ddl fontname' data-format='fontname'>\n    \
  \            <option value=\"></option>\n                <option value='Arial'>Arial</option>\n\
  \                <option value='Courier New'>Courier New</option>\n            \
  \    <option value='Times New Roman'>Times New Roman</option>\n            </select>\n\
  \            <select class='toolbar-ddl fontsize' data-format='fontsize'>\n    \
  \            <option value=\"></option>\n                <option value='2'>Small</option>\n\
  \                <option value='3'>Normal</option>\n                <option value='4'>Big</option>\n\
  \                <option value='5'>Bigger</option>\n            </select>\n    \
  \        <button id='btnCreateSelection'>Create Selection</button>\n           \
  \ <button id='btnStoreSelection'>Store Selection</button>\n            <button id='btnRestoreSelection'>Restore\
  \ Selection</button>\n        </div\n        <div id='container' contenteditable='true'>\n\
  \        </div>\n    </body>\n</html>\n```\n\nCSS 部分保持与之前的示例不变，如果需要，请参考它。然而，更新后的标记通过更新的\
  \ JavaScript（`Example 22-3.js`）进行了增强：\n\n```javascript\n$(document).ready(\n   \
  \ function()\n    {\n        $('div#container').focus();\n        $('button.toolbar-btn').click(\n\
  \            function()\n            {\n                var data = this && $(this).data\
  \ && $(this).data();\n                if (data && data.format && document.execCommand)\n\
  \                {\n                    document.execCommand(data.format, false,\
  \ null);\n                    $('div#container').focus();\n                }\n \
  \           }\n        );\n        $('select.toolbar-ddl').change(\n           \
  \ function()\n            {\n                var data = this && $(this).data &&\
  \ $(this).data();\n                if (data && data.format && document.execCommand)\n\
  \                {\n                    document.execCommand(data.format, false,\n\
  \                        this[this.selectedIndex].value);\n                    this.selectedIndex\
  \ = 0;\n                    $('div#container').focus();\n                }\n   \
  \         }\n        );\n        $('button#btnCreateSelection').click(\n       \
  \     function()\n            {\n                var container = document.getElementById('container');\n\
  \                container.innerHTML = 'Here is some sample text for selection';\n\
  \                var range = document.createRange();\n                range.setStart(container.firstChild,\
  \ 5);\n                range.setEnd(container.firstChild, 17);\n               \
  \ setSelectionRange(range);\n            }\n        );\n        $('button#btnStoreSelection').click(\n\
  \            function()\n            {\n                window.selectedRange = getSelectionRange();\n\
  \            }\n        );\n        $('button#btnRestoreSelection').click(\n   \
  \         function()\n            {\n                if (window.selectedRange)\n\
  \                {\n                    setSelectionRange(window.selectedRange);\n\
  \                }\n            }\n        );\n    }\n);\nfunction getSelectionRange()\
  \ \n{\n    if (window.getSelection)\n    {\n        var sel = window.getSelection();\n\
  \        if (sel.getRangeAt && sel.rangeCount)\n        {\n            return sel.getRangeAt(0);\n\
  \        }\n        else // Safari\n        {\n            var range = document.createRange();\n\
  \            range.setStart(sel.anchorNode, sel.anchorOffset);\n            range.setEnd(sel.focusNode,\
  \ sel.focusOffset);\n            return range;\n        }\n    } \n    return null;\n\
  }\nfunction setSelectionRange(range) \n{\n    if (range && window.getSelection)\n\
  \    {\n        var sel = window.getSelection();\n        sel.removeAllRanges();\n\
  \        sel.addRange(range);\n    }\n}\n```\n\n\n\n\n\n```javascript\n var sel\
  \ = window.getSelection();\n```\n\n`Selection` 对象可能包含零个到多个选择范围（selection ranges）。通常情况下，在点击页面之前，它包含零个范围，在点击之后，它会包含一个范围。你首先从移除任何现有的选择范围开始：\n\
  \n```javascript\n sel.removeAllRanges();\n```\n\n最后，你将程序化创建的范围添加到 `Selection` 对象中，最终在可编辑元素内选中“is\
  \ some samp”文本。\n\n## 存储选择（Storing a Selection）\n\n在之前的示例代码中，更新了标记语言以在工具栏上添加一个按钮，用于存储当前选择范围的位置：\n\
  \n```html\n <button id='btnStoreSelection'>Store Selection</button>\n```\n\n你更新了\
  \ JavaScript 代码，为该按钮添加了点击事件处理器。该处理器执行了一项极其简单的任务：设置一个窗口级变量来存储有关当前选中内容的信息：\n\n```javascript\n\
  \ $('button#btnStoreSelection').click(\n            function()\n            {\n\
  \                window.selectedRange = getSelectionRange();\n            }\n  \
  \      );\n```\n\n注意，你使用了第二个辅助函数：\n\n```javascript\nfunction getSelectionRange()\
  \ \n{\n    if (window.getSelection)\n    {\n        var sel = window.getSelection();\n\
  \        if (sel.getRangeAt && sel.rangeCount)\n        {\n            return sel.getRangeAt(0);\n\
  \        }\n        else // Safari\n        {\n            var range = document.createRange();\n\
  \            range.setStart(sel.anchorNode, sel.anchorOffset);\n            range.setEnd(sel.focusNode,\
  \ sel.focusOffset);\n            return range;\n        }\n    } \n    return null;\n\
  }\n```\n\n在省去 `window.getSelection` 完整性检查（特性检测）后，你像其他辅助函数一样获取当前的 `Selection` 对象。这次，你访问了关于该对象的额外信息。大多数情况下，`Selection`\
  \ 对象支持 `getRangeAt` 方法；你检查了支持情况以及选择范围是否存在。如果测试通过，返回 `Selection` 对象中的第一个 `Range`\
  \ 对象：\n\n```javascript\n if (sel.getRangeAt && sel.rangeCount)\n        {\n    \
  \        return sel.getRangeAt(0);\n        }\n```\n\n如果逻辑测试失败（如 Safari，它不支持 `getRangeAt`），则使用熟悉的代码创建一个\
  \ `Range` 对象，这次使用来自 `Selection` 对象的绑定信息来指定起始和结束容器以及偏移量：\n\n```javascript\n else\
  \ // Safari\n        {\n            var range = document.createRange();\n      \
  \      range.setStart(sel.anchorNode, sel.anchorOffset);\n            range.setEnd(sel.focusNode,\
  \ sel.focusOffset);\n            return range;\n        }\n```\n\n最后，如果基础特性检测不支持现代\
  \ `Selection` 对象，只需返回 `null` 并继续即可。在这些情况下，提示用户使用较新的浏览器可以获得更好的体验可能是一个好主意。\n\n```javascript\n\
  return null;\n```\n\n除非你遇到了 `Selection` 对象不可用的最后一种情况，否则你应该已经存储了足够的选中内容信息供以后使用。\n\
  \n## 恢复选择（Restoring a Selection）\n\n在之前的代码示例标记中添加的最后一个按钮允许在可编辑元素内恢复之前的选择。\n\n```html\n\
  <button id='btnRestoreSelection'>Restore Selection</button>\n```\n\n你为该按钮的点击添加了最后一个\
  \ JavaScript 事件处理器。首先，你测试之前存储的选择是否存在。如果存在，则将其传递给之前讨论过的辅助函数，该函数会取消任何当前选择并恢复保存的选择。\n\
  \n```javascript\n $('button#btnRestoreSelection').click(\n            function()\n\
  \            {\n                if (window.selectedRange)\n                {\n \
  \                   setSelectionRange(window.selectedRange);\n                }\n\
  \            }\n        );\n```\n\n存储和恢复选择信息的一个警告是，该过程可能有点脆弱；特别是存储了绑定节点信息。如果元素内容发生变化，即使内容被重置为完全的状态，该信息可能会失效。\n\
  \n## 总结（Summary）\n\n在本章中，你在浏览器中创建了一个简单的 WYSIWYG 编辑器。在此过程中，你学习了强大的 HTML5 `contenteditable`\
  \ 属性，它可以让几乎任何 DOM 元素变得可编辑。你学习了使用 `document.execCommand` 函数来处理编辑器内的格式选项。\n\n你学习了当前浏览器选择模型的部分结构，并程序化地创建了\
  \ `Range` 对象。虽然你可能没有创建下一个文字处理软件巨头，但你为额外的探索创建了一个稳定的代码库。\n\n## 练习题（Exercises）\n\n\
