  \n```css\nhtml,\nbody {\n    width: 100%;\n    height: 100%;\n}\nbody {\n    font:\
  \ 12px \"Lucida Grande\", Arial, sans-serif;\n    background: rgb(189, 189, 189)\
  \ url('images/Bottom.png') repeat-x bottom;\n    color: rgb(50, 50, 50);\n    margin:\
  \ 0;\n    padding: 0;\n}\ndiv#finderFiles {\n    border-bottom: 1px solid rgb(64,\
  \ 64, 64);\n    background: #fff;\n    position: absolute;\n    top: 0;\n    right:\
  \ 0;\n    bottom: 23px;\n    left: 0;\n    overflow: auto;\n    user-select: none;\n\
  \    -webkit-user-select: none;\n    -moz-user-select: none;\n    -ms-user-select:\
  \ none;\n}\ndiv#finderAdditionalFiles {\n    display: none;\n}\ndiv.finderDirectory,\n\
  div.finderFile {\n    float: left;\n    width: 150px;\n    height: 100px;\n    overflow:\
  \ hidden;\n}\ndiv.finderIcon {\n    background: url('images/Folder 48x48.png') no-repeat\
  \ center;\n    background-size: 48px 48px;\n    height: 56px;\n    width: 54px;\n\
  \    margin: 10px auto 3px auto;\n}\ndiv.finderFile div.finderIcon {\n    background-image:\
  \ url('images/Safari Document.png');\n}\ndiv.finderIconSelected {\n    background-color:\
  \ rgb(204, 204, 204);\n    border-radius: 5px;\n}\ndiv.finderDirectoryName,\ndiv.finderFileName\
  \ {\n    text-align: center;\n}\nspan.finderDirectoryNameSelected,\nspan.finderFileNameSelected\
  \ {\n    background: rgb(56, 117, 215);\n    border-radius: 8px;\n    color: white;\n\
  \    padding: 1px 7px;\n}\n```\n\n最后，修改 JavaScript 以使用持久化事件，并在当双击文档的任意位置时添加一些新文件，以测试持久化事件处理器的概念。\n\
  \n\n\n\n\n```javascript\n$(document).on(\n    'DOMContentLoaded',\n    function()\n\
  \    {\n        $('div#finderFiles').on(\n            'click',\n            'div.finderDirectory,\
  \ div.finderFile',\n            function(event)\n            {\n               \
  \ $('div.finderIconSelected')\n                    .removeClass('finderIconSelected');\n\
  \                $('span.finderDirectoryNameSelected')\n                    .removeClass('finderDirectoryNameSelected');\n\
  \                $('span.finderFileNameSelected')\n                    .removeClass('finderFileNameSelected');\n\
  \                $(this).find('div.finderIcon')\n                    .addClass('finderIconSelected');\n\
  \                $(this).find('div.finderDirectoryName span')\n                \
  \    .addClass('finderDirectoryNameSelected');\n                $(this).find('div.finderFileName\
  \ span')\n                    .addClass('finderFileNameSelected');\n           \
  \ }\n        );\n        $('div#finderFiles div.finderNode:first')\n           \
  \ .trigger('click');\n        var addedAdditionalFiles = false;\n        $('body').dblclick(\n\
  \            function()\n            {\n                if (addedAdditionalFiles)\n\
  \                {\n                    return;\n                }\n           \
  \     $('div#finderAdditionalFiles > div.finderFile').each(\n                  \
  \   function()\n                     {\n                         $('div#finderFiles').append(\n\
  \                             $(this).clone()\n                         );\n   \
  \                  }\n                );\n                addedAdditionalFiles =\
  \ true;\n            }\n        );\n    }\n);\n```\n\n当代码加载到浏览器并分发 `dblclick` 事件时，你可以看到类似于图\
  \ 3.2 所示的结果。\n\n![image](img/c03f002.jpg)\n\n图 3.2\n\n此示例重写了*示例 3-2*，以包含一个持久事件处理器和一些额外的\
  \ HTML，用于测试该持久化事件处理器。`click` 事件处理器被绑定到 id 为 `finderFiles` 的 `<div>` 元素上。这样做是因为该\
  \ `<div>` 元素始终存在。第二个参数选择器 `'div.finderDirectory, div.finderFile'` 设置了持久化事件处理器。该事件绑定到\
  \ id 为 `finderFiles` 的 `<div>` 上，但选择器参数阻止了事件处理器在事件源自于匹配选择器的元素之前被执行。\n\n```javascript\n\
  \ $('div#finderFiles').on(\n            'click',\n            'div.finderDirectory,\
  \ div.finderFile',\n            function(event)\n            {\n               \
  \ $('div.finderIconSelected')\n                    .removeClass('finderIconSelected');\n\
  \                $('span.finderDirectoryNameSelected')\n                    .removeClass('finderDirectoryNameSelected');\n\
  \                $('span.finderFileNameSelected')\n                    .removeClass('finderFileNameSelected');\n\
  \                $(this).find('div.finderIcon')\n                    .addClass('finderIconSelected');\n\
  \                $(this).find('div.finderDirectoryName span')\n                \
  \    .addClass('finderDirectoryNameSelected');\n                $(this).find('div.finderFileName\
  \ span')\n                    .addClass('finderFileNameSelected');\n           \
  \ }\n        );\n```\n\n事件处理器被赋予了一些新代码以处理除了目录外还有文件的语义。\n\n```javascript\n $('div#finderFiles\
  \ div.finderNode:first')\n            .trigger('click');\n```\n\n该事件在类名为 `finderNode`\
  \ 的第一个 `<div>` 元素上触发。\n\n接下来，你设置了一个变量来跟踪额外的文件是否已添加到整个文件和文件夹集合中，这测试了为了使持久化事件处理器生效，元素是否必须存在。\n\
  \n```javascript\n var addedAdditionalFiles = false;\n```\n\n从技术上说，这些新元素确实存在于 DOM\
  \ 中，但它们不存在于作为目录和文件节点容器的 `<div>` 元素内部，因此文件和目录节点相关的事件尚未应用。\n\n```javascript\n $('body').dblclick(\n\
  \            function()\n            {\n                if (addedAdditionalFiles)\n\
  \                {\n                    return;\n                }\n           \
  \     $('div#finderAdditionalFiles > div.finderFile').each(\n                  \
  \   function()\n                     {\n                         $('div#finderFiles').append(\n\
  \                             $(this).clone()\n                         );\n   \
  \                  }\n                );\n                addedAdditionalFiles =\
  \ true;\n            }\n        );\n```\n\n首先，你检查变量 `addedAdditionalFiles`；如果该变量为\
  \ `true`，则返回 `dblclick` 处理执行。如果 `addedAdditionalFiles` 为 `false`，则在 id 为 `finderAdditionalFiles`\
  \ 的 `<div>` 内部查找类名为 `finderFile` 的一些额外 `<div>` 元素，并将每一个元素添加到另一个 id 为 `finderFiles`\
  \ 的 `<div>` 元素中。\n\n当你点击其中一个新的 `<div>` 元素时，你会发现不需要任何额外操作就发生了选取。这就是使用持久化事件处理器的含义；当添加匹配选择器参数的新元素时，事件将继续工作。继续使用文件管理器的比喻，这使得为许多文件或文件夹附加一个事件处理器，而不是为每个文件和文件夹都创建一个事件处理器。如果你在\
  \ DOM 中有很多文件和文件夹，这具有显著提高性能的优势。因此，持久化事件处理器在两个关键方面让你获益：\n\n1. 在创建事件处理器时，元素不需要存在。元素可以稍后创建；它只需要匹配你提供给\
  \ `on()` 方法的选择器即可。\n2. 客户端浏览器性能可以大幅提升，因为你可以将特定事件所需的事件处理器数量减少到只有一个。\n\n## 移除事件处理器\n\
  \n`on()` 方法有一个配套方法称为 `off()`，它可以从文档中移除事件处理器。jQuery 还通过其命名空间事件处理器的能力，提供了一种实用的方法来识别哪些事件应该被移除。\n\
  \n在更复杂的客户端应用程序中，你可能会很快忘记哪些脚本创建了事件处理器。通过 jQuery 引入命名事件可以轻松解决这个问题。\n\n用于命名事件的语法非常简单：在命名事件的参数中，添加一个点（.）然后跟上你想使用的名称。这种语法的工作原理与类类似。和类名一样，使用多个点允许你引用多个名称。而引用任何一个名称都会引用到使用该名称的任何事件（即使该事件绑定了多个名称）。\n\
  \n下面的示例可以在源材料中找到（*示例 3-4*），它演示了如何处理命名事件，以及如何动态地应用和移除事件处理器。你从与之前示例中使用的相同的 HTML 开始；添加两个新按钮来动态地应用和移除事件。\n\
  \n\n\n\n\n```\n<!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>Finder</title>\n\
  \        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 3-4.js'></script>\n        <link href='Example 3-4.css'\
  \ rel='stylesheet' />\n    </head>\n    <body\n        <div id='finderFiles'>\n\
  \            <div class='finderDirectory finderNode' data-path='/Applications'>\n\
