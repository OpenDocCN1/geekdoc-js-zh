  \ underline;\n}\n```\n\n### 示例 9-2 JavaScript\n\n最后，我们得到了 JavaScript 文档，*示例 9-2.js*：\n\
  \n```\ndocument.addEventListener(\n    'DOMContentLoaded',\n    function()\n   \
  \ {\n        var a = document.getElementById('movieSelectAll');\n        for (var\
  \ property in a)\n        {\n            console.log(property);\n        }\n   \
  \ }\n);\n```\n\n在*示例 9-2* 中，你暂时放下了 jQuery，使用了传统的 JavaScript 文档对象模型。你从文档中获取一个 `<a>`\
  \ 元素，然后将其放入 `for/in` 循环中，以检查附加到 `<a>` 元素的方法和属性。\n\n你可以通过在 JavaScript 文件中放入类似的内容（*示例\
  \ 9-3*）来查看 jQuery 自身的结构：\n\n```\n$.fn.extend({\n    select : function()\n    {\n\
