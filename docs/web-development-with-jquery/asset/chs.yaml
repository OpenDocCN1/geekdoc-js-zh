  \n\n\n| `slider('disable')` | 禁用滑块。 | jQuery |\n| `slider('enable')` | 启用滑块。 | jQuery\
  \ |\n| `slider('option')` | 返回一个包含键值对的对象，代表该滑块插件实例当前设置的所有选项。 | Object |\n| `slider('option',\
  \ `optionName`)` | 返回指定选项的值。 | Mixed |\n| `slider('option', `optionName`, `value`)`\
  \ | 将指定选项的值设置为指定的值。 | jQuery |\n| `slider('option', `optionObject`)` | 使用键值对对象设置多个选项。\
  \ | jQuery |\n| `slider('value')` | 返回滑块的值。 | Number |\n| `slider('value', `value`)`\
  \ | 设置滑块的值。 | jQuery |\n| `slider('values')` | 返回所有滑柄的值。 | Array |\n| `slider('values',\
  \ `index`)` | 返回指定滑柄的值。 | Number |\n| `slider('values', `index`, `value`)` | 设置指定滑柄的值。\
  \ | jQuery |\n| `slider('values', `valuesArray`)` | 使用数组设置指定滑柄的值。 | jQuery |\n|\
  \ `slider('widget')` | 返回一个包含滑块的 jQuery 对象。 | jQuery |\n\n### Slider Options\n\n\
  | 选项 | 描述 | 类型 |\n| :--- | :--- | :--- |\n| `animate` | 用户点击滑条上滑柄以外时，滑柄是否平滑移动。默认值：`false`\
  \ | Boolean |\n| `disabled` | 如果设置为 `true`，则禁用滑块。默认值：`false` | Boolean |\n| `max`\
  \ | 滑块的最大值。用于通过回调函数跟踪值以及设置步长。默认值：`100` | Number |\n| `min` | 滑块的最小值。默认值：`0` | Number\
  \ |\n| `orientation` | 决定滑块是水平移动还是垂直移动。可能的值有 `horizontal` 和 `vertical`。默认值：`horizontal`\
  \ | String |\n| `range` | 如果提供的布尔值设为 `true`，滑块将检测是否存在两个滑柄，并在这两个滑柄之间创建一个可样化的范围元素。你现在还可以在回调函数中访问\
  \ `ui.range` 以获取范围的大小。如果提供字符串，可能的值为 `min` 和 `max`。默认值：`false` | Boolean, String\
  \ |\n| `step` | 决定滑块在 min 和 max 之间每一步所跨越的间隔。整个范围应易于被步长整除。默认值：`1` | Number |\n| `value`\
  \ | 滑块的值。如果存在多个滑柄，此值将用于第一个滑柄。默认值：`0` | Number |\n| `values` | 如果需要多个滑柄，可以在此选项中提供一个包含每个滑柄值的数组。默认值：`null`\
  \ | Array |\n\n### Slider Events\n\n| 选项 | 描述 | 值 |\n| :--- | :--- | :--- |\n| `change`\
  \ | 当滑块的值或多个值发生变化时执行的函数。 | `function(event, ui)` |\n| `create` | 滑块创建时执行的函数。 | `function(event,\
  \ ui)` |\n| `slide` | 在拖动滑块时，每次鼠标移动时执行的函数。 | `function(event, ui)` |\n| `start`\
  \ | 当用户开始滑动时调用的函数。 | `function(event, ui)` |\n| `stop` | 当用户停止滑动时调用的函数。 | `function(event,\
  \ ui)` |\n\n### UI Object\n\n| 选项 | 描述 | 类型 |\n| :--- | :--- | :--- |\n| `ui.handle`\
  \ | 代表正在移动的滑柄的 jQuery 对象。 | jQuery |\n| `ui.value` | 如果事件未取消，滑柄将移动到的值。 | Number\
  \ |\n| `ui.values` | 多滑柄滑块当前值的数组。 | Array |\n\n# Appendix 附录 T\n\n### Tablesorter\n\
  \n| 选项 | 描述 | 类型 |\n| :--- | :--- | :--- |\n| `cancelSelection` | 决定表头 `<th>` 元素中的文本是否可以被选择。默认值：`true`\
  \ | Boolean |\n| `cssAsc` | 应用到代表升序排序列的表头 `<th>` 的类名。默认值：`'headerSortUp'` | String\
  \ |\n| `cssDesc` | 应用到代表降序排序列的表头 `<th>` 的类名。默认值：`'headerSortDown'` | String |\n\
  | `cssHeader` | 应用到代表未排序状态列的表头 `<th>` 的类名。默认值：`'header'` | String |\n| `debug` |\
  \ 决定是否显示额外的调试信息，这对于开发很有用。默认值：`false` | Boolean |\n| `headers` | 代表可以为每列提供的选项的对象。该对象根据每列相对于零的偏移进行定义。在编写期间，允许的唯一选项是指示列是否可排序。一个禁用第一列排序的示例对象：\n\
  ```javascript\nheaders : {\n0 : {\nsorter : false\n}\n}\n```\n默认值：`null` | Object\
  \ |\n| `sortForce` | 此选项用于多列排序。它遵循与 `sortList` 相同的模式。默认值：`null` | Array |\n| `sortList`\
  \ | 此选项定义列的初始排序。例如：\n```javascript\n[0, 0],\n[2, 1]\n```\n按顺序定义每一列。默认值：`null` |\
  \ Array |\n| `sortMultiKey` | 此选项指示使用哪个键盘修饰键来选择多个列进行排序。默认值：`'shiftKey'` | String\
  \ |\n| `textExtraction` | 定义使用何种方法从表格单元格中提取文本进行排序。字符串选项包括 `'simple'` 和 `'complex'`。`'simple'`\
  \ 不考虑可能存在的任何标记。`'complex'` 考虑标记，但在处理大数据集时可能会缓慢。另一个选项是编写你自己的函数进行文本提取。该函数的签名如下：\n\
  ```javascript\nfunction(node) {\nreturn $(node).text();\n}\n```\n请记住，直接使用 jQuery\
  \ 将影响大表格的性能。默认值：`'simple'` | String, Function |\n| `widthFixed` | 决定是否应对列使用固定宽度。注意这也可以通过应用于\
  \ `<table>` 元素的 CSS `table-layout: fixed;` 声明来实现。默认值：`false` | Boolean |\n\n# Appendix\
  \ 附录 U\n\n### MediaElement\n\n| 选项 | 描述 | 类型 |\n| :--- | :--- | :--- |\n| `alwaysShowControls`\
  \ | 决定当鼠标指针离开视频时控制控件是否隐藏。默认值：`false` | Boolean |\n| `alwaysShowHours` | 决定视频时间中是否存在小时标记，例如\
  \ HH:MM:SS。此选项显示 HH: 部分。默认值：`false` | Boolean |\n| `AndroidUseNativeControls` |\
  \ 决定在 Android 设备上是否使用原生控件。默认值：`false` | Boolean |\n| `audioWidth` | 如果提供了值，它将覆盖\
  \ `<audio>` 元素的 `width`。默认值：`-1` | Integer |\n| `audioHeight` | 如果提供了值，它将覆盖 `<audio>`\
  \ 元素的 `height`。默认值：`-1` | Integer |\n| `autosizeProgress` | 决定进度条的大小是否根据其他元素的大小自动计算。默认值：`true`\
  \ | Boolean |\n| `autoRewind` | 媒体结束时返回开头。默认值：`true` | Boolean |\n| `clickToPlayPause`\
  \ | 决定点击 `<video>` 元素是否切换播放/暂停。默认值：`true` | Boolean |\n\n\n\n\n\n| `defaultAudioHeight`\
  \ | `<audio>` 播放器的默认高度（像素）。如果元素上未指定 `height`，则使用此值。默认值：`30` | 整数 |\n| `defaultAudioWidth`\
  \ | `<audio>` 播放器的默认宽度（像素）。如果元素上未指定 `width`，则使用此值。默认值：`400` | 整数 |\n| `defaultSeekBackwardInterval`\
  \ | 按下按键时向后移动的默认时间。默认值为：\n```javascript\nfunction(media)\n{\n  return (media.duration\
  \ * 0.5);\n}\n``` | Function |\n| `defaultSeekForwardInterval` | 按下按键时向前移动的默认时间。默认值为：\n\
  ```javascript\nfunction(media)\n{\n  return (media.duration * 0.5);\n}\n``` | Function\
  \ |\n| `defaultVideoHeight` | `<video>` 播放器的默认高度（像素）。如果元素上未指定 `height`，则使用此值。默认值：`270`\
  \ | 整数 |\n| `defaultVideoWidth` | `<video>` 播放器的默认宽度（像素）。如果元素上未指定 `width`，则使用此值。默认值：`480`\
  \ | 整数 |\n| `enableAutosize` | 允许 Flash 和 Silverlight 播放器调整为内容大小。默认值：`true` | 布尔值\
  \ |\n| `enableKeyboard` | 启用或禁用键盘支持。默认值：`true` | 布尔值 |\n| `features` | 控制栏上控件或插件的顺序。默认值：`['playpause',\
  \ 'current', 'progress', 'duration', 'tracks', 'volume', 'fullscreen']` | 数组 |\n\
  | `framesPerSecond` | 当 `showTimecodeFrameCount` 设置为 true 时使用此选项。表示每秒帧数。默认值：`25`\
  \ | 整数 |\n| `hideVideoControlsOnLoad` | 决定视频加载时是否隐藏视频控件。默认值：`false` | 布尔值 |\n| `iPadUseNativeControls`\
  \ | 决定在 iPad 上是否使用原生控件。默认值：`false` | 布尔值 |\n| `iPhoneUseNativeControls` | 决定在 iPhone\
  \ 上是否使用原生控件。默认值：`false` | 布尔值 |\n| `keyActions` | 键盘命令数组。默认值是一个初始化以下按键动作的数组：空格键播放或暂停媒体；上、下箭头增加或减小音量；左右箭头向后或向前快进；F\
  \ 键进入或退出全屏模式，M 键静音或取消静音。 | 数组 |\n| `loop` | 决定是否循环音频轨道。默认值：`false` | 布尔值 |\n| `pauseOtherPlayers`\
  \ | 决定当播放器启动时暂停页面上的其他播放器。默认值：`true` | 布尔值 |\n| `poster` | 海报图像的 URL。默认值：`\"` | 字符串\
  \ |\n| `showPosterWhenEnded` | 决定视频结束时是否显示海报。默认值：`false` | 布尔值 |\n| `showTimecodeFrameCount`\
  \ | 在时间码中显示帧率。FF:HH:MM:SS。此选项添加 FF: 部分。`framesPerSecond` 选项决定该值。默认值：`false` | 布尔值\
  \ |\n| `startVolume` | 播放器启动时的音量。默认值：`0.8` | 浮点 |\n| `videoWidth` | 如果提供了值，它将覆盖\
