  样式表和 XHTML 与以下 JavaScript 结合在一起：\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n        $('div#exampleTabs').tabs({\n            active : 1\n        });\n\
  \    }\n);\n```\n\n\n\n\n\n```html\n <ul>\n    <li>\n        <a href='#exampleTabFirst'>\n\
  \            <span>第一个标签页</span>\n        </a>\n    </li>\n    <li>\n        <a\
  \ href='#exampleTabSecond'>\n            <span>第二个标签页</span>\n        </a>\n   \
  \ </li>\n    <li>\n        <a href='#exampleTabThird'>\n            <span>第三个标签页</span>\n\
  \        </a>\n    </li>\n </ul>\n```\n\n在上述标记标记代码段中，每个超链接都通过包含一个井号（#）并其后紧跟该元素的\
  \ `id` 名称，链接到文档中其他地方的锚点。以这种方式结构化文档，可以使你的脚本不具有侵入性。如果禁用了脚本，用户仍然可以通过点击锚点链接来导航标签页，而不是通过切换内容面板的显示。\n\
  \n在列表之后，你有三个 `<div>` 元素，每个元素都有一个与锚点链接对应的 `id` 名称，这使得这些元素成为了锚点。\n\n```html\n <div\
  \ id='exampleTabFirst'>\n    <p>\n        Lorem ipsum dolor sit amet, consectetuer\
  \ adipiscing elit.\n        Suspendisse id sapien. Suspendisse rutrum libero sit\
  \ amet dui.\n        Praesent pede elit, tincidunt pellentesque, condimentum nec,\n\
  \        mollis et, lacus. Donec nulla ligula, tempor vel, eleifend ut.\n    </p>\n\
  \ </div>\n```\n\n当你调用 `tabs()` 方法时，jQuery 会查看列表并自动从超链接中提取 `id` 名称。\n\n## 通过 AJAX\
  \ 加载远程内容\n\n加载远程内容而非本地内容是很容易实现的。下面的文档展示了一个示例（即源代码下载材料中的 `Example 8-3`），演示了如何设置使用\
  \ AJAX 加载远程内容的标签页，而不是让内容已经加载到你的文档中。\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>Tabs Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 18-3.js'></script>\n\
  \        <link href='Example 18-3.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <div id='exampleTabs'>\n            <ul>\n                <li>\n      \
  \              <a href='#exampleTabFirst'>\n                        <span>第一个标签页</span>\n\
  \                    </a>\n                </li>\n                <li>\n       \
  \             <a href='#exampleTabSecond'>\n                        <span>第二个标签页</span>\n\
  \                    </a>\n                </li>\n                <li>\n       \
  \             <a href='#exampleTabThird'>\n                        <span>第三个标签页</span>\n\
  \                    </a>\n                </li>\n                <li>\n       \
  \             <a href='Fourth Tab.html'>\n                        <span>第四个标签页</span>\n\
  \                    </a>\n                </li>\n            </ul>\n          \
  \  <div id='exampleTabFirst'>\n                <p>\n                    Lorem ipsum\
  \ dolor sit amet, consectetuer adipiscing elit.\n                    Suspendisse\
  \ id sapien. Suspendisse rutrum libero sit amet dui.\n                    Praesent\
  \ pede elit, tincidunt pellentesque, condimentum nec,\n                    mollis\
  \ et, lacus. Donec nulla ligula, tempor vel, eleifend ut.\n                </p>\n\
  \            </div>\n            <div id='exampleTabSecond'>\n                <p>\n\
  \                    Cras eu metus orci. Nam pretium neque ante. In eu mattis sem,\n\
  \                    Ut euismod nulla. Curabitur a diam eget risus vestibulum\n\
  \                    mattis et at turpis. Etiam semper, orci sit amet semper\n \
  \                   molestie, nibh sem hendrerit est, auctor varius arcu purus ut\n\
  \                    enim. Curabitur nisi nunc, ullamcorper a placerat a, faucibus\n\
  \                    imperdiet urna. Maecenas cursus ullamcorper dolor, ac viverra\n\
  \                    nibh consectetur eget.\n                </p>\n            </div>\n\
  \            <div id='exampleTabThird'>\n                <p>\n                 \
  \   Mauris sollicitudin, sem non tempor molestie, quam nunc\n                  \
  \  blandit lectus, quis molestie dui arcu in lectus. In id\n                   \
  \ fringilla elit. Ut auctor lectus eget orci malesuada, et\n                   \
  \ lacinia ligula interdum. Pellentesque bibendum, orci eget\n                  \
  \  euismod scelerisque, nibh nulla posuere mi, quis commodo\n                  \
  \  purus sem et arcu.\n                </p>\n            </div>\n        </div>\n\
  \    </body>\n</html>\n```\n\n创建了一个新的标记文档来包含第四个标签页的内容，并命名为 `Fourth Tab.html`，它在上述标记文档中新标签页的\
  \ `<a>` 元素的 `href` 属性中也被引用了。\n\n```html\n<p>\n    Quisque tempus euismod justo vitae\
  \ ultrices. Nam in\n    ligula sit amet mi molestie luctus. Aenean et\n    egestas\
  \ arcu. Mauris dictum tortor sit amet purus\n    aliquam condimentum. Integer fermentum\
  \ at odio vitae\n    sollicitudin.\n</p>\n```\n\n以下样式表被应用于启用 AJAX 的示例。该样式表为 `id`\
  \ 名称为 `ui-tabs-1` 的 `<div>` 元素添加了新规则。\n\n```css\nbody {\n    font: 'Lucida Grande',\
  \ Arial, sans-serif;\n    background: #fff;\n    color: rgb(50, 50, 50);\n}\ndiv#exampleTabs\
  \ {\n    background: lightblue;\n    padding: 5px;\n}\ndiv#exampleTabFirst {\n \
  \   background: lightgreen;\n    padding: 5px;\n}\ndiv#exampleTabSecond {\n    background:\
  \ yellow;\n    padding: 5px;\n}\ndiv#exampleTabThird {\n    background: pink;\n\
  \    padding: 5px;\n}\ndiv.ui-tabs-1 {\n    display: none;\n}\nul.tabs-nav {\n \
  \   list-style: none;\n    padding: 0;\n    height: 22px;\n    border-bottom: 1px\
  \ solid rgb(200, 200, 200);\n}\nul.tabs-nav li {\n    float: left;\n    height:\
  \ 17px;\n    padding: 4px 10px 0 10px;\n    margin-right: 5px;\n    border-bottom:\
  \ 1px solid darkgreen;\n    position: relative;\n    background: yellowgreen;\n\
  }\nul.tabs-nav li a {\n    text-decoration: none;\n    color: black;\n}\nul.tabs-nav\
  \ li.tabs-active {\n    background: darkgreen;\n    border-bottom: 1px solid darkgreen;\n\
  }\nul.tabs-nav li.tabs-active a {\n    color: white;\n    outline: none;\n}\ndiv.tabs-panel\
  \ {\n    display: none;\n}\n```\n\nJavaScript 部分与 `Example 18-2` 没有变化，因为启用 AJAX\
  \ 加载的部分完全发生在标记标记和 Tabs 插件中。\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n        $('div#exampleTabs').tabs({\n            active : 1\n        });\n\
  \    }\n);\n```\n\n图 18.3 显示了结果。\n\n![image](img/c18f003.jpg)\n\n图 18.3\n\n\n\n\n\
  最后，在内容从服务器加载到 Tabs 插件加载并显示内容期间，`<li>` 元素会被应用 `ui-tabs-loading` 类名。\n\n## 动画化标签页切换\n\
  \njQuery UI 中的大多数内容可以使用 jQuery 提供的任何动画效果进行自定义，Tabs 插件也不例外。像 Dialog 插件一样， 插件也接受 `show`\
  \ 和 `hide` 选项，它们分别指定标签页打开和关闭时的效果。\n\n以下脚本演示了如何实现标签页切换动画：\n\n```\n$(document).ready(\n\
  \    function()\n    {\n        $('div#exampleTabs').tabs({\n            active\
  \ : 1,\n            show : 'explode',\n            hide : 'fade'\n        });\n\
  \    }\n);\n```\n\n上述脚本在标签页打开时添加爆炸（explode）效果，在标签页关闭时淡出（fade）效果。此示例可以在本书源代码材料 `Example\
  \ 18-4.html` 中找到。关于动画选项的全面文档请参阅附录 Q。\n\n## 总结\n\nTabs 实现还可以使用几个额外的选项。在本章中，我涵盖了一些更有用的选项，你可以在附录\
  \ Q 中找到 Tabs 插件所有可用选项的完整引用。\n\n在本章中，你学习了如何使用 jQuery UI Tabs 插件实现标签页式用户界面。默认情况下，Tabs\
  \ 插件不提供任何演示样式。你学习了如何处理标签页式用户界面的样式，以便应用你自己的自定义样式。另一个选项是使用 jQueryUI 主题，你可以从 jQuery\
  \ UI 网站 [`www.jqueryui.com`](http://www.jqueryui.com) 下载。\n\n你学习了 Tabs 插件支持使用 AJAX\
  \ 远程加载内容；你只需要添加少量的 HTML 标记即可实现这一点。\n\n最后，你还学习了 Tabs 插件通过 `show` 和 `hide` 选项支持标签页之间的动画切换。\n\
  \n## 练习\n\n1. 在应用 `tabs()` 方法后，你会使用哪个选项来更改默认显示的标签页？\n2. 使用了哪些类名来对活动标签页和悬停标签页进行样式设置？\n\
  3. 通过 AJAX 调用加载内容需要做什么？\n4. 你可以使用哪些选项来为标签页切换动画？\n\n# 第三部分\n\n流行的第三方 jQuery 插件\n\n\
