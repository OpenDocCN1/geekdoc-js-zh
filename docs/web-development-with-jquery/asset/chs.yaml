  \ },\n    unselect : function()\n    {\n        return this.removeClass('movieSelected');\n\
  \    }\n});\nconsole.log($.fn);\n```\n\n调用 `console.log()` 允许你检查 jQuery 自身的结构，包括内置插件和自定义第三方插件。在\
  \ Firefox 的 Web 控制台中，当你点击代表 `console.log($.fn)` 的控制台条时，你会看到右侧展开了一个列表，其中充满了 jQuery\
  \ 插件的名称，包括内置插件和通过 `$.fn` 添加的自定义插件。\n\n### 编写右键菜单插件\n\n在*示例 9-4* 中，你编写了一个更复杂的 jQuery\
  \ 插件，它包含了一些你在 jQuery 插件中常见的特性，例如自包含性，以及对元素应用行为的能力。要开始，请下载或输入以下 XHTML 5 文档：\n\n```\n\
  <!DOCTYPE HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n   \
  \     <meta http-equiv=\"content-type\"\n              content=\"application/xhtml+xml;\
  \ charset=utf-8\" />\n        <meta http-equiv=\"content-language\" content=\"en-us\"\
  \ />\n        <title>Context Menu Plugin</title>\n        <script type='text/javascript'\
  \ src='../jQuery.js'></script>\n        <script type='text/javascript' src='Example\
  \ 9-4.js'></script>\n        <link type='text/css' href='Example 9-4.css' rel='stylesheet'\
  \ />\n    </head>\n    <body class='contextMenuContainer'>\n        <div id='applicationContainer'>\n\
  \            <p>\n                jQuery 插件让你能够快速且无缝地扩展 jQuery\n               \
  \ 功能。在本示例中，你学习了如何制作一个菜单\n                插件。它展示了制作自包含 jQuery 插件的上下文\n          \
  \      时可能需要的内容。\n            </p>\n            <p class='applicationContextMenuToggles'>\n\
  \                <span id='applicationContextMenuDisable'>Disable Context Menu</span>\
  \ |\n                <span id='applicationContextMenuEnable'>Enable Context Menu</span>\n\
  \            </p>\n            <div id='applicationContextMenu'>\n             \
  \   <ul>\n                    <li><span>Open</span></li>\n                    <li\
  \ class='contextMenuSeparator'><div></div></li>\n                    <li><span>Save</span></li>\n\
  \                    <li><span>Save As...</span></li>\n                    <li class='contextMenuSeparator'><div></div></li>\n\
  \                    <li class='contextMenuDisabled'><span>Edit</span></li>\n  \
  \              </ul>\n            </div>\n        </div>\n    </body>\n</html>\n\
  ```\n\n前面的 XHTML 5 文档为编写上下文菜单插件准备了必要的标记结构。它包含了一些文本、一些可以切换上下文菜单是否启用的 `<span>` 元素，以及上下文菜单本身的结构。这些标记与随后的\
  \ CSS 结合，将上下文菜单样式化，使其非常像 Mac OS X 系统右键菜单——我这样做是因为我能做到。\n\n\n\n```html\nhtml,\nbody\
  \ {\n    padding: 0;\n    margin: 0;\n    width: 100%;\n    height: 100%;\n}\nbody\
  \ {\n    font: 12px 'Lucida Grande', Helvetica, Arial, sans-serif;\n    background:\
  \ #fff;\n    color: rgb(50, 50, 50);\n    line-height: 1.5em;\n    -webkit-user-select:\
  \ none;\n    -moz-user-select: none;\n    -ms-user-select: none;\n    user-select:\
  \ none;\n}\ndiv#applicationContainer {\n    width: 400px;\n    padding: 20px;\n\
  }\ndiv.contextMenu {\n    display: none;\n    position: absolute;\n    z-index:\
  \ 10;\n    top: 0;\n    left: 0;\n    width: 200px;\n    font-size: 14px;\n    background:\
  \ #fff;\n    background: rgba(255, 255, 255, 0.95);\n    border: 1px solid rgb(150,\
  \ 150, 150);\n    border: 1px solid rgba(150, 150, 150, 0.95);\n    padding: 4px\
  \ 0;\n    box-shadow: 0 5px 25px rgba(100, 100, 100, 0.9);\n    border-radius: 5px;\n\
  \    border-radius: 5px;\n    color: #000;\n}\ndiv.contextMenu ul {\n    list-style:\
  \ none;\n    margin: 0;\n    padding: 0;\n}\ndiv.contextMenu ul li {\n    padding:\
  \ 2px 0 2px 21px;\n    margin: 0;\n    height: 15px;\n    overflow: hidden;\n}\n\
  div.contextMenu ul li span {\n    position: relative;\n    top: -2px;\n}\ndiv.contextMenu\
  \ ul li.contextMenuSeparator {\n    padding: 5px 0 8px 0;\n    font-size: 0;\n \
  \   line-height: 0;\n    height: auto;\n}\nli.contextMenuSeparator div {\n    font-size:\
  \ 0;\n    line-height: 0;\n    padding-top: 1px;\n    background: rgb(200, 200,\
  \ 200);\n    margin: 0 1px;\n}\nbody div.contextMenu ul li.contextMenuHover {\n\
  \    /* Old browsers */\n    background: rgb(82, 117, 243);\n    /* FF3.6+ */\n\
  \    background: -moz-linear-gradient(top,  rgb(82, 117, 243) 0%, rgb(3, 57, 242)\
  \ 100%);\n     /* Chrome,Safari4+ */\n    background: -webkit-gradient(\n      \
  \  linear, left top, left bottom,\n        color-stop(0%, rgb(82, 117, 243)),\n\
  \        color-stop(100%, rgb(3, 57, 242))\n    );\n    /* Chrome10+,Safari5.1+\
  \ */\n    background: -webkit-linear-gradient(top, rgb(82,117,243) 0%, rgb(3, 57,\
  \ 242) 100%);\n    background: -o-linear-gradient(top, rgb(82, 117, 243) 0%, rgb(3,\
  \ 57, 242) 100%);\n    /* IE10+ */\n    background: -ms-linear-gradient(top,  rgb(82,\
  \ 117, 243) 0%, rgb(3, 57, 242) 100%);\n    /* W3C */\n    background: linear-gradient(to\
  \ bottom, rgb(82, 117, 243) 0%, rgb(3, 57, 242) 100%);\n    color: white;\n}\nli.contextMenuDisabled\
  \ {\n    opacity: 0.5;\n}\np.applicationContextMenuToggles {\n    color: green;\n\
  }\np.applicationContextMenuToggles span:hover {\n    text-decoration: underline;\n\
  \    cursor: pointer;\n}\n```\n\n最后，接下来的 JavaScript 将这一切联系在一起，并为这个曾经静态、无生命的 HTML\
  \ 文档注入了生命。\n\n\n\n\n\n```javascript\n$.fn.extend({\n    contextMenu : function()\n\
  \    {\n        var options = arguments[0] !== undefined ? arguments[0] : {};\n\
  \        var contextMenuIsEnabled = true;\n        var contextMenu = this;\n   \
  \     if (typeof options == 'string')\n        {\n            switch (options)\n\
  \            {\n                case 'disable':\n                {\n           \
  \         contextMenuIsEnabled = false;\n                    break;\n          \
  \      }\n            }\n        }\n        else if (typeof options == 'object')\n\
  \        {\n            // 你可以传递一个包含选项的对象来\n            // 进一步自定义你的上下文菜单。\n    \
  \    }\n        function getViewportDimensions()\n        {\n            var x,\
  \ y;\n            if (self.innerHeight)\n            {\n                x = self.innerWidth;\n\
  \                y = self.innerHeight;\n            }\n            else if (document.documentElement\
  \ &&\n                     document.documentElement.clientHeight)\n            {\n\
  \                x = document.documentElement.clientWidth;\n                y =\
  \ document.documentElement.clientHeight;\n            }\n            else if (document.body)\n\
  \            {\n                x = document.body.clientWidth;\n               \
  \ y = document.body.clientHeight;\n            }\n            return {\n       \
  \         x : x,\n                y : y\n            };\n        }\n        if (contextMenuIsEnabled)\n\
  \        {\n            // 如果这是将上下文菜单附加到多个元素，\n            // 则遍历其中的每一个元素。\n   \
  \         this.find('li')\n                .not('li.contextMenuDisabled, li.contextMenuSeparator')\n\
  \                .bind(\n                    'mouseover.contextMenu',\n        \
  \            function()\n                    {\n                        $(this).addClass('contextMenuHover');\n\
  \                    }\n                )\n                .bind(\n            \
  \        'mouseout.contextMenu',\n                    function()\n             \
  \       {\n                        $(this).removeClass('contextMenuHover');\n  \
  \                  }\n                );\n            if (!this.data('contextMenu'))\n\
  \            {\n                this.data('contextMenu', true)\n               \
  \     .addClass('contextMenu')\n                    .bind(\n                   \
  \     'mouseover.contextMenu',\n                        function()\n           \
  \             {\n                            $(this).data('contextMenu', true);\n\
  \                        }\n                    )\n                    .bind(\n\
  \                        'mouseout.contextMenu',\n                    function()\n\
  \                        {\n                            $(this).data('contextMenu',\
  \ false);\n                        }\n                    );\n                this.parents('.contextMenuContainer:first')\n\
  \                    .bind(\n                        'contextmenu.contextMenu',\n\
  \                        function(event)\n                        {\n          \
  \                  event.preventDefault();\n                            var viewport\
  \ = getViewportDimensions();\n                            contextMenu.show();\n\
  \                            contextMenu.css({\n                               \
  \ top : 'auto',\n                                right : 'auto',\n             \
  \                   bottom : 'auto',\n                                left : 'auto'\n\
  \                            });\n                            if (contextMenu.outerHeight()\
  \ >\n                                (viewport.y - event.pageY))\n             \
  \               {\n                                contextMenu.css(\n          \
  \                          'bottom',\n                                    (viewport.y\
  \ - event.pageY) + 'px'\n                                );\n                  \
  \          }\n                            else\n                            {\n\
  \                                contextMenu.css(\n                            \
  \        'top',\n                                    event.pageY + 'px'\n      \
  \                          );\n                            }\n                 \
  \           if (contextMenu.outerWidth() >\n                                (viewport.x\
  \ - event.pageX))\n                            {\n                             \
  \   contextMenu.css(\n                                    'right',\n           \
  \                         (viewport.x - event.pageX) + 'px'\n                  \
  \              );\n                            }\n                            else\n\
  \                            {\n                                contextMenu.css(\n\
  \                                    'left',\n                                 \
  \   event.pageX + 'px'\n                                );\n                   \
  \         }\n                        }\n                    );\n            }\n\
  \            if (!$('body').data('contextMenu'))\n            {\n              \
  \  $('body').data('contextMenu', true);\n                $(document).bind(\n   \
  \                 'mousedown.contextMenu',\n                    function()\n   \
  \                 {\n                        $('div.contextMenu').each(\n      \
  \                      function()\n                            {\n             \
  \                   if (!$(this).data('contextMenu'))\n                        \
  \        {\n                                    $(this).hide();\n              \
  \                  }\n                            }\n                        );\n\
  \                    }\n                );\n            }\n        }\n        else\n\
  \        {\n            this.find('li')\n                .not('li.contextMenuDisabled,\
  \ li.contextMenuSeparator')\n                .unbind('mouseover.contextMenu')\n\
  \                .unbind('mouseout.contextMenu');\n            this.data('contextMenu',\
  \ false)\n                .removeClass('contextMenu')\n                .unbind('mouseover.contextMenu')\n\
  \                .unbind('mouseout.contextMenu');\n            this.parents('.contextMenuContainer:first')\n\
  \                .unbind('contextmenu.contextMenu');\n            $('body').data('contextMenu',\
  \ false);\n            $(document).unbind('mousedown.contextMenu');\n        }\n\
  \        return this;\n    }\n});\n$(document).ready(\n    function()\n    {\n \
  \       $('span#applicationContextMenuDisable').click(\n            function(event)\n\
  \            {\n                $('div#applicationContextMenu').contextMenu('disable');\n\
  \                $('div#applicationContextMenu').hide();\n            }\n      \
  \  );\n        $('span#applicationContextMenuEnable').click(\n            function()\n\
  \            {\n                $('div#applicationContextMenu').contextMenu();\n\
  \            }\n        );\n        $('div#applicationContextMenu').contextMenu();\n\
  \    }\n);\n```\n\n当这三个文档都就绪后，当你将此文档加载到支持并启用了 `contextmenu` 事件的浏览器时，你将获得一个启用 jQuery\
  \ 交互的良好示例。（默认情况下，除了基于旧版 Presto 引擎的 Opera 外都支持，尽管可以在 Firefox 的高级首选项中禁用此事件。）正如你可能猜到的，`contextMenu`\
  \ 事件取代了在此网页中通过鼠标右键或上下文菜单手势右点击时弹出的菜单。在 Mac 上，当 Apple 无线触控板或 MacBook 触控板上双指点击时，上下文菜单手势会弹出上下文菜单（假设你已经在系统偏好设置的触控板中启用了该手势）。结果看起来就像[图\
  \ 9.2]所示。\n\n如果你点击“禁用上下文菜单”，你应该看到默认上下文菜单。我的默认上下文菜单显示在[图 9.3]中。\n\n本节其余将将逐解析*示例 9-4*\
  \ 中的 JavaScript，并解释它是如何以及为什么这样工作的。\n\n\n\n\n\n```javascript\n var options = arguments[0]\
  \ !== undefined ? arguments[0] : {};\n        var contextMenuIsEnabled = true;\n\
  \        var contextMenu = this;\n        if (typeof options == 'string')\n    \
  \    {\n            switch (options)\n            {\n                case 'disable':\n\
  \                {\n                    contextMenuIsEnabled = false;\n        \
  \            break;\n                }\n            }\n        }\n        else if\
  \ (typeof options == 'object')\n        {\n            // You can pass in an object\
  \ containing options to\n            // further customize your context menu.\n \
  \       }\n```\n\n第一段代码（在此句子之前）提供了传入某些选项的支持。要禁用右键菜单，你可以传入字符串 `'disabled'`，例如 `contextMenu('disabled')`。要启用右键菜单，可以在不带参数的情况下调用\
  \ `contextMenu()`。\n\n如果你愿意，可以扩展这个示例并添加你自己的选项。以下是启动一切的函数调用：\n\n```javascript\n$('div#applicationContextMenu').contextMenu();\n\
  ```\n\n在 HTML 中，你设置并结构化了一个包含 `<ul>` 元素的 `<div>` 元素，这就成为了右键菜单：\n\n```html\n <div\
  \ id='applicationContextMenu'>\n                <ul>\n                    <li><span>Open</span></li>\n\
  \                    <li class='contextMenuSeparator'><div></div></li>\n       \
  \             <li><span>Save</span></li>\n                    <li><span>Save As...</span></li>\n\
  \                    <li class='contextMenuSeparator'><div></div></li>\n       \
  \             <li class='contextMenuDisabled'><span>Edit</span></li>\n         \
  \       </ul>\n            </div>\n```\n\n配合一些 CSS，这个右键菜单变得与真实的 Mac OS X 系统上下文菜单几乎无异。在\
  \ HTML 文档中，还为这个右键菜单定义了一个边界。右键菜单只在该元素的范围内出现。在我们的文档中，该容器变成了 `<body>` 元素，因为它被分配了 `contextMenuContainer`\
  \ 类名。为了让此插件工作，右键菜单可以放在任何容器中，只要它的父元素或祖先元素具有 `contextMenuContainer` 类名。从 HTML 结构的角度来看，你只需要这些：一个带有\
  \ `contextMenuContainer` 类名的容器元素，以及一个包含 `<ul>` 元素的 `<div>` 元素。每个 `<li>` 元素代表一个右键菜单选项。\n\
  \nJavaScript 中的下一块代码是一个可复用的函数，用于获取视口的尺寸。这使得它与旧版本的 Internet Explorer 兼容，旧版本使用不同的方法获取视口尺寸。大多数现代符合标准的浏览器使用的方法出现在第一块代码中：\n\
  \n```javascript\n function getViewportDimensions()\n        {\n            var x,\
  \ y;\n            if (self.innerHeight)\n            {\n                x = self.innerWidth;\n\
  \                y = self.innerHeight;\n            }\n            else if (document.documentElement\
  \ &&\n                     document.documentElement.clientHeight)\n            {\n\
  \                x = document.documentElement.clientWidth;\n                y =\
  \ document.documentElement.clientHeight;\n            }\n            else if (document.body)\n\
  \            {\n                x = document.body.clientWidth;\n               \
  \ y = document.body.clientHeight;\n            }\n            return {\n       \
  \         x : x,\n                y : y\n            };\n        }\n```\n\n需要视口的尺寸来根据用户在视口内部点击的位置来重新定位右键菜单。如果用户点击视口的左侧，右键菜单将从左侧定位。如果用户点击视口的顶部附近，右键菜单将从顶部定位；如果用户点击底部附近，右键菜单将从底部定位。通过少量的计算，你可以尝试避免用于右键菜单的元素可能出现在屏幕之外的情况。相反，通过分析用户点击的位置以及与视口边缘的距离程度，你可以根据这些数据重新定位。\n\
  \n```javascript\n if (contextMenuIsEnabled)\n                   {\n```\n\n上一个代码块检测调用\
  \ `contextMenu()` 时是否没有带任何参数，换句话说，即当右键菜单被启用时。\n\n首先，你为 `<li>` 元素设置了一些 `mouseover`\
  \ 和 `mouseout` 事件，但仅针对未被禁用或不是分割符的元素。\n\n```javascript\n this.find('li')\n      \
  \          .not('li.contextMenuDisabled, li.contextMenuSeparator')\n           \
  \     .bind(\n                    'mouseover.contextMenu',\n                   \
  \ function()\n                    {\n                        $(this).addClass('contextMenuHover');\n\
  \                    }\n                )\n                .bind(\n            \
  \        'mouseout.contextMenu',\n                    function()\n             \
  \       {\n                        $(this).removeClass('contextMenuHover');\n  \
  \                  }\n  );\n```\n\n对 `find('li')` 的调用会在作为右键菜单的元素内部查找 `<li>` 元素。这些元素接收\
  \ `mouseover` 和 `mouseout` 事件，并为我们的 `contextMenu` 插件设置了命名空间。整个事件是 `mouseover.contextMenu`。`mouseover`\
  \ 部分是你正在绑定的标准事件，而 `contextMenu` 部分是此 `mouseover` 事件应用的名称。正如你在本章之前的所有章节中所学到的，为你的事件命名是一个良好的习惯，因为可以将你所应用的事件隔离到命名空间中，并使得选择性地启用和禁用事件变得简单得多，就像你在这里看到的，你根据事件和事件名称来绑定和解绑事件。因此，每个\
  \ `<li>` 元素（那些带有 `contextMenuDisabled` 和 `contextMenuSeparator` 类名并被 `not()` 过滤掉的元素除外）在用户悬停时都会获得一个\
  \ `contextMenuHover` 类名。\n\n\n\n\n接下来，应用了 `contextmenu` 事件，该事件通过我们的 `<div>` 元素向上遍历\
  \ DOM 树，直到第一个类名为 `contextMenuContainer` 的元素。\n\n```javascript\n this.parents('.contextMenuContainer:first')\n\
  \                    .bind(\n                        'contextmenu.contextMenu',\n\
  \                        function(event)\n            {\n```\n\n上述代码使用我们插件的名称 `contextMenu,`\
  \ 对命名空间的 `contextmenu` 事件名称绑定到具有 `contextMenuContainer` 类名的元素上。当然，提供的 `function`\
  \ 会在 `contextmenu` 事件触发时执行。在该函数的第一行中，取消了默认操作（即显示系统默认的右键菜单）。视口的的尺寸从我们之前定义的函数中获取。通过调用\
  \ `show()` 将 `contextMenu` 设置为显示；然后将四个 CSS 的位置属性 `top`、`right`、`bottom` 和 `left`\
  \ 全部重置为默认值 `auto`。这非常重要，因为你的代码会成对设置这四个属性中的两个，但永远不会同时设置四个。\n\n```javascript\n event.preventDefault();\n\
  \                            var viewport = getViewportDimensions();\n         \
  \                   contextMenu.show();\n                            contextMenu.css({\n\
  \                                top : 'auto',\n                               \
  \ right : 'auto',\n                                bottom : 'auto',\n          \
  \                      left : 'auto'\n                 });\n```\n\n`contextmenu`\
  \ 事件回调函数的剩余部分根据用户在视口内部点击的位置，定义了右键菜单相对于视口的位置。\n\n```javascript\n if (contextMenu.outerHeight()\
  \ >\n                                (viewport.y - event.pageY))\n             \
  \               {\n                                contextMenu.css(\n          \
  \                          'bottom',\n                                    (viewport.y\
  \ - event.pageY) + 'px'\n                                );\n                  \
  \          }\n                            else\n                            {\n\
  \                                contextMenu.css(\n                            \
  \        'top',\n                                    event.pageY + 'px'\n      \
  \                          );\n                            }\n                 \
  \           if (contextMenu.outerWidth() >\n                                (viewport.x\
  \ - event.pageX))\n                            {\n                             \
  \   contextMenu.css(\n                                    'right',\n           \
  \                         (viewport.x - event.pageX) + 'px'\n                  \
  \              );\n                            }\n                            else\n\
  \                            {\n                                contextMenu.css(\n\
  \                                    'left',\n                                 \
  \   event.pageX + 'px'\n                                );\n               }\n```\n\
  \n通过少量的数学计算和比较，可以决定是从左侧还是右侧放置右键菜单更好，以及从顶部还是底部更好。这考虑了右键菜单的大小，以及鼠标点击相对于视口边缘的位置。属性\
  \ `event.pageX` 和 `event.pageY` 显然提供了所有其他事件数据，即鼠标点击相对于文档的 x、y 坐标。属性 `viewport.x`\
  \ 和 `viewport.y` 包含视口的宽度和高度。最后，`outerHeight()` 是 jQuery 方法，用于获取右键菜单的高度，包含了以下 CSS\
  \ 属性：`height`、`padding`、`border-width` 和 `margin`。同样，`outerWidth()` 提供了宽度尺寸。\n\n\
  接下来在 `document` 上附加了一个事件来跟踪发生在右键菜单之外的点击。\n\n```javascript\n if (!('body').data('contextMenu'))\n\
  \            {\n                $('body').data('contextMenu', true);\n         \
  \       $(document).bind(\n                    'mousedown.contextMenu',\n      \
  \              function()\n                    {\n                        $('div.contextMenu').each(\n\
  \                            function()\n                            {\n       \
  \                         if (!$(this).data('contextMenu'))\n                  \
  \              {\n                                    $(this).hide();\n        \
  \                        }\n                            }\n                    \
  \    );\n                    }\n                );\n            }\n```\n\n如果 `<body>`\
  \ 元素没有 `data` `contextMenu`，或者 `contextMenu` 被设置为 `false`，则会附加事件。为了防止事件被多次附加，会将\
  \ `<body>` 元素上的 `contextMenu` 数据设置为 `true`，以指示事件已附加。\n\n```javascript\n $('body').data('contextMenu',\
  \ true);\n```\n\n在 `document` 上再次附加了同样命名为 `contextMenu` 的 `mousedown` 事件。每当发生 `mousedown`\
  \ 事件时，都会遍历每一个类名为 `contextMenu` 的 `<div>` 元素。\n\n```javascript\n $(document).bind(\n\
  \                    'mousedown.contextMenu',\n                    function()\n\
  \                    {\n                        $('div.contextMenu').each(\n   \
  \                         function()\n                            {\n          \
  \                      if (!$(this).data('contextMenu'))\n                     \
  \           {\n                                    $(this).hide();\n           \
  \                     }\n                            }\n                       \
  \ );\n                    }\n                );\n```\n\n如果这些 `<div>` 元素中任何一个的 `contextMenu`\
  \ 数据未设置为 `true`，那么该 `<div>` 元素就会隐藏。记得在脚本早些时候，你为右键菜单附加了 `mouseover` 和 `mouseout`\
  \ 事件来跟踪右键菜单是否处于状态，这是通过将数据 `contextMenu` 设置为布尔值来实现的。这段代码完成了该实现，使得只需点击右键菜单以外的任何地方即可关闭右键菜单。\n\
  \n最后一段代码在右键菜单被禁用时执行，这是在你点击 *Disable Context Menu*（禁用右键菜单）选项时完成。\n\n```javascript\n\
  \ $('span#applicationContextMenuDisable').click(\n            function(event)\n\
  \            {\n                $('div#applicationContextMenu').contextMenu('disable');\n\
  \                $('div#applicationContextMenu').hide();\n            }\n      \
  \  );\n```\n\n上述代码导致了禁用右键菜单的最后一段代码执行。\n\n```javascript\n }\n        else\n     \
  \   {\n            this.find('li')\n                .not('li.contextMenuDisabled,\
  \ li.contextMenuSeparator')\n                .unbind('mouseover.contextMenu')\n\
  \                .unbind('mouseout.contextMenu');\n            this.data('contextMenu',\
  \ false)\n                .removeClass('contextMenu')\n                .unbind('mouseover.contextMenu')\n\
  \                .unbind('mouseout.contextMenu');\n            this.parents('.contextMenuContainer:first')\n\
  \                .unbind('contextmenu.contextMenu');\n            $('body').data('contextMenu',\
  \ false);\n            $(document).unbind('mousedown.contextMenu');\n        }\n\
  ```\n\n在此段代码中，移除了事件并将数据设置为 `false`，从而撤销了你为了启用右键菜单而进行的所有文档更改。由于你的事件使用 `contextMenu`\
  \ 名称进行了命名，所以只有你显式附加的事件会被移除。如果其他人在其他脚本中使用其他名称附加了 `click` 或 `mouseover` 或其他事件，他们的事件将保持不受影响且正常运行。\n\
  \n## **jQuery 插件开发的良好实践**\n\n在开发自己的插件时，你应该记住以下几点：\n\n\n\n\n-   一种良好的做法是始终预期向你的插件传递一个或多个项目（在调用你的插件之前的\
  \ jQuery 选择器中），并且在逻辑合理且可行的情况下，始终返回 jQuery 对象，这样就可以将多个方法调用链式组合。\n\n-   如果你计划使用第三方\
  \ jQuery 插件，你可能需要以某种方式对自己的插件进行命名空间划分（name-spacing），以确保你的命名不会与第三方插件冲突。这通常通过在你的插件名称前加上某种前缀来实现，例如你的公司或组织名称。在你的右键菜单插件的上下文中，如果该插件是由你的公司\
  \ Example 开发的，你可能会将你的插件命名为 `exampleContextMenu()`。\n\n-   避免污染全局命名空间。将所有的函数调用和变量放在你的\
  \ jQuery 插件内部。作为一个额外的益处，这还可以让你的 API 变成私有的，且仅供你调用。防止他人使用你的私有 API 让你在需要时拥有更改它们的自由，因为你不需要担心支持那些这些\
  \ API 的人员。\n\n-   如果你兴趣开发遵循 jQuery 开发者发布的所有推荐最佳实践官方第三方 jQuery 插件，请参阅位于 [`http://docs.jquery.com/Plugins/Authoring`](http://docs.jquery.com/Plugins/Authoring)\
  \ 的文档。\n\n## 总结\n\n在本章中，你学习了编写自己的 jQuery 插件所需的 Basic 概念。你学习了如何通过向 jQuery 的 `$.fn.extend()`\
  \ 方法传递对象字面量来创建 jQuery 插件。\n\n你学习了 jQuery 插件期望接收一个或多个项目，这些项目始终存在于 `this` 关键字中。\n\n\
  当你编写 jQuery 插件时，你应该返回 jQuery 对象（在逻辑合理且可行的情况下），因为这保留了 jQuery 将方法调用链式连接的能力。\n\n你学习了如何通过创建一个右键菜单插件来编写一个更复杂、更真实的\
  \ jQuery 插件示例。\n\n## 练习题\n\n1. 你使用什么方法向 jQuery 添加插件？\n2. 你如何列出 jQuery 中使用的所有插件？\n\
  3. 你如何在你的 jQuery 插件中创建一个仅供自己使用的私有 API？\n4. 你用 jQuery 选择的项目在你的自定义插件中是如何访问的？\n5. 你的插件应该返回什么值？\n\
  6. 为什么为事件名称命名空间是一个好主意？\n7. 自定义 jQuery contextMenu 插件示例以提供一个或多个选项：\n    1. 让你的 contextMenu\
  \ 插件在菜单打开并定位时执行回调函数。\n    2. 让你的 contextMenu 插件为右键菜单本身使用的项目列表提供选项。\n\n# 第 10 章：滚动条\n\
  \njQuery 提供了与可滚动 DOM 元素交互的功能。正如在前章中所讨论的，插件可以扩展 jQuery 以具有更多功能。即使是快速的网页搜索也会得到一大堆推销其滚动优点的插件。虽然这些插件对于特定用途可能有用，但\
  \ jQuery 处理了大多数常见需求。\n\n本章侧重于 jQuery 核心框架提供的交互。这些交互包括确定可滚动元素的当前滚动条位置，以及设置滚动条位置。正如预期的，你可以使用\
  \ JavaScript 和 DOM 属性组合来完成这些任务；但像往常一样，jQuery 简化并标准化了这些项目。\n\n## 获取滚动条的位置\n\n与 jQuery\
  \ 的大多数功能一样，获取滚动条的位置非常简单：\n\n```javascript\n$('div#aScrollableElement').scrollTop();\n\
  $('div#aScrollableElement').scrollLeft();\n```\n\n如前面的代码行所示，滚动位置涉及两个维度：垂直和水平。垂直滚动位置是从顶部开始计算的像素值，水平滚动位置是从左侧开始计算的像素值。\n\
  \n为了展示这些函数的输出，接下来的示例附加了一个滚动事件处理程序，在滚动期间显示滚动位置。你从 XHTML5 基础开始，该基础在以下从 [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 下载的代码标记中（*示例 10-1*）：\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>Scrollbar Position</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='Example 10-1.js'></script>\n        <link href='Example 10-1.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <div id='container'>\n \
  \           <div class='filler'>\n                Lorem ipsum dolor sit amet, consectetur\
  \ adipisicing elit,\n                sed do eiusmod tempor incididunt ut labore\
  \ et dolore magna aliqua.\n                Ut enim ad minim veniam, quis nostrud\
  \ exercitation ullamco laboris\n                nisi ut aliquip ex ea commodo consequat.\
  \ Duis aute irure dolor in\n                reprehenderit in voluptate velit esse\
  \ cillum dolore eu fugiat nulla\n                pariatur. Excepteur sint occaecat\
  \ cupidatat non proident, sunt in\n                culpa qui officia deserunt mollit\
  \ anim id est laborum.\n            </div>\n        </div>\n        <div class='status-bar'>\n\
  \            <span id='vertical-scroll-label'>\n                Current Vertical\
  \ Scrollbar Position:\n            </span>\n            <span id='vertical-scroll-label'>\n\
  \        </div>\n    </body>\n</html>\n```\n\n接下来的 CSS 设置了滚动条的样式：\n\n```css\nhtml,\n\
  body {\n    width: 100%;\n    height: 100%;\n}\nbody {\n    font: 12px \"Lucida\
  \ Grande\", Arial, sans-serif;\n    background: rgb(189, 189, 189);\n    color:\
  \ rgb(50, 50, 50);\n    margin: 0;\n}\ndiv#container {\n    border: 1px solid rgb(64,\
  \ 64, 64);\n    background: #fff;\n    padding: 5px;\n    margin: 0;\n    width:\
  \ 200px;\n    height: 100px;\n    overflow: auto;\n}\ndiv.filler {\n    margin:\
  \ 10px;\n    padding: 5px;\n    width: 400px;\n    height: 150px;\n    background:\
  \ rgb(200, 200, 255);\n}\ndiv.status-bar {\n    margin: 5px 20px 5px 20px;\n}\n\
  ```\n\n前面的 XHTML 和 CSS 与以下 JavaScript 结合：\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        $('div#container')\n            .scroll(\n     \
  \           function()\n                {\n                    $('span#vertical-scroll-label')\n\
  \                        .text($(this).scrollTop());\n                    $('span#horizontal-scroll-label')\n\
  \                        .text($(this).scrollLeft());\n                }\n     \
  \       );\n    }\n);\n```\n\n前面的源代码生成了你在 图 10.1 中看到的文档。\n\n![image](img/c10f001.jpg)\n\
  \n**图 10.1**\n\n在前面的示例中，你创建了一个内容大于容器的可滚动 `<div>` 元素。当你滚动该容器以查看内容时，滚动条位置将被获取并显示在页面上。\n\
  \n示例中的标记非常简单。可滚动内容包含在 id 为 `container` 的 `<div>` 元素中；需要这个容器元素以便内容超过容器的大小，从而允许滚动。\n\
  \n```html\n<div id='container'>\n```\n\n\n\n\n\n```html\n <div class='filler'>\n\
  \                Lorem ipsum dolor sit amet, consectetur adipisicing elit,\n   \
  \             sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\n\
  \                Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris\n\
  \                nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor\
  \ in\n                reprehenderit in voluptate velit esse cillum dolore eu fugiat\
  \ nulla\n                pariatur. Excepteur sint occaecat cupidatat non proident,\
  \ sunt in\n                culpa qui officia deserunt mollit anim id est laborum.\n\
  \            </div>\n```\n\n除了可滚动内容外，标记还包含了两个类名为 `status-bar` 的 `<div>` 元素，用于显示滚动条的位置值。\n\
  \n```html\n <div class='status-bar'>\n            <span id='vertical-scroll-label'>\n\
  \                Current Vertical Scrollbar Position:\n            </span>\n   \
  \         <span id='vertical-scroll-value'>0</span>\n        </div>\n        <div\
  \ class='status-bar'>\n            <span id='horizontal-scroll-label'>\n       \
  \         Current Horizontal Scrollbar Position:\n            </span>\n        \
  \    <span id='horizontal-scroll-value'>0</span>\n        </div>\n```\n\n样式表以这种方式呈现这些标记，使得容器的内容所需的空间大于容器本身，这样浏览器就能为容器提供有用的滚动条。下文将审查样式表中的每条规则，并解释为什么每条规则都是必要的。\n\
  \n`<html>` 和 `<body>` 元素分别被赋予了 100% 的宽度和高度，以便它们都能自动占据整个视口。\n\n```css\nhtml,\nbody\
  \ {\n    width: 100%;\n    height: 100%;\n}\n```\n\n在下一条规则中，你为文档指定了 Lucida Grande\
  \ 字体，这是一种 Mac 应用中常用的 Mac 字体。如果没有该字体，你可以回退到 Windows 中有的 Arial；否则，如果该字体不存在，则回退到通用无衬线字体。`background`（背景）设置为灰色。字体\
  \ `color`（颜色）设置为深灰色，最后删除了 `<body>` 元素的默认 `padding`（内边距）和 `margin`（外边距），这是为了避免由于之前的样式表规则应用了\
  \ 100% 宽度和高度而在视口上出现滚动条。\n\n```css\nbody {\n    font: 12px \"Lucida Grande\", Arial,\
  \ sans-serif;\n    background: rgb(189, 189, 189);\n    color: rgb(50, 50, 50);\n\
  \    margin: 0;\n    padding: 0;\n}\n```\n\n下一条规则定位了 id 为 `container` 的 `<div>`\
  \ 元素，该元素包含可滚动的内容。这个 `<div>` 元素的大小设置为较小的 200 像素乘以 100 像素，并应用了少量的内边距和水平外边距。`background`\
  \ 设置为白色；容器周围有一个深灰色边框；最后添加了 `overflow: auto;` 声明，当该元素的内容超过其指定的尺寸时就会出现滚动条。\n\n```css\n\
  div#container {\n    border: 1px solid rgb(64, 64, 64);\n    background: #fff;\n\
  \    padding: 5px;\n    margin: 0 20px 0 20px;\n    width: 200px;\n    height: 100px;\n\
  \    overflow: auto;\n}\n```\n\n下一条规则设置了类名为 `filler` 的 `<div>` 元素的呈现方式，设置了少量的外边距和内边距以及浅蓝色背景。更重要的是，元素的大小设置为\
  \ 400 像素乘以 150 像素，使其比其容器大。\n\n```css\ndiv.filler {\n    margin: 10px;\n    padding:\
  \ 5px;\n    width: 400px;\n    height: 150px;\n    background: rgb(200, 200, 255);\n\
  }\n```\n\n下一条规则简单地为类名为 `status-bar` 的 `<div>` 元素添加了少量的外边距，以便在元素之间留空并与可滚动容器对齐。\n\n\
  ```css\ndiv.status-bar {\n    margin: 5px 20px 5px 20px;\n}\n```\n\n此示例的 JavaScript\
  \ 一如既往一样非常精简。你首先为 `scroll` 事件添加一个处理函数。\n\n```javascript\n $('div#container')\n \
  \           .scroll(\n```\n\n在 `scroll` 事件内部，你编写了一些逻辑，通过获取滚动条位置来更新状态栏。首先，你从滚动元素获取\
  \ `scrollTop()` 值，并使用该值设置 `span#vertical-scroll-value` 元素的 `innerText`。然后，你同样地从滚动元素获取\
  \ `scrollLeft()` 值，并使用该值设置 `span#horizontal-scroll-value` 元素的 `innerText`。\n\n```javascript\n\
  \ function()\n                {\n                    $('span#vertical-scroll-value')\n\
  \                        .text($(this).scrollTop());\n                    $('span#horizontal-scroll-value')\n\
  \                        .text($(this).scrollLeft());\n                }\n```\n\n\
  通过这少量的 jQuery 代码，你获取了 DOM 元素在滚动过程时的滚动条位置值，并更新了额外的 DOM 元素来显示这些值。本章中的其他示例将基于你创建的这个结构进行构建。\n\
  \n\n\n\n\n```html\nhtml,\nbody {\n    width: 100%;\n    height: 100%;\n}\nbody {\
  \ \n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background: rgb(189,\
  \ 189, 189);\n    color: rgb(50, 50, 50);\n    margin: 0;\n    padding: 0;\n}\n\
  div#container {\n    border: 1px solid rgb(64, 64, 64);\n    background: #fff;\n\
  \    padding: 5px;\n    margin: 0 20px 0 20px;\n    width: 200px;\n    height: 100px;\n\
  \    overflow: auto;\n}\ndiv.filler {\n    margin: 10px;\n    padding: 5px;\n  \
  \  width: 400px;\n    height: 150px;\n    background: rgb(200, 200, 255);\n}\ndiv.status-bar,\n\
  div.button-bar {\n    margin: 5px 20px 5px 20px;\n}\ndiv.block {\n    margin: 10px;\n\
  \    padding: 5px;\n    width: 400px;\n    height: 70px;\n    background-color:\
  \ rgb(255, 140, 0);\n}\n```\n\n最后，你应用了以下 JavaScript，它通过新代码对示例 10-1 扩展，使得 `click`\
  \ 事件处理程序能够设置滚动条位置。\n\n```javascript\n$(document).ready(\n    function()\n    {\n\
  \        $('div#container')\n            .scroll(\n                function()\n\
  \                {\n                    $('span#vertical-scroll-value')\n      \
  \                  .text($(this).scrollTop());\n                    $('span#horizontal-scroll-value')\n\
  \                        .text($(this).scrollLeft());\n                }\n     \
  \       );\n        $('button.block-button')\n            .click(\n            \
  \    function()\n                {\n                    $('div#container')\n   \
  \                     .scrollTop($('div#' + $(this).data().block).offset().top\n\
  \                            - $('div#container').offset().top\n               \
  \             + $('div#container').scrollTop())\n                        .scrollLeft($('div#'\
  \ + $(this).data().block).offset().left\n                            - $('div#container').offset().left\n\
  \                            + $('div#container').scrollLeft());\n             \
  \   }\n            );\n    }\n);\n```\n\n前面的源代码为你提供了输出，如在 Mac OS X 的 Safari 中的图\
  \ 10.2 所示。\n\n![image](img/c10f002.jpg)\n\n图 10.2\n\n在前面的示例中，你在可滚动容器内添加了两个元素，添加了按钮来引用这些新元素，并将这些按钮的\
  \ `click` 事件连接到设置可滚动容器的滚动条位置。\n\n两个新的 `<div>` 元素被添加到可滚动容器内，即 id 为 `container` 的\
  \ `<div>` 元素。\n\n```html\n<div id='block1' class='block'>Block 1</div>\n<div id='block2'\
  \ class='block'>Block 2</div>\n```\n\n按钮及其包含的 `<div>` 元素被添加在状态栏之前的可滚动容器之外。这些按钮的\
  \ `data-block` 属性在 `click` 事件处理程序内部被用于引用被点击按钮对应的代码块。\n\n```html\n<div class='button-bar'>\n\
  \    <button class='block-button' data-block='block1'>Go to Block 1</button>\n \
  \   <button class='block-button' data-block='block2'>Go to Block 2</button>\n</div>\n\
  ```\n\n\n\n# HTML5 拖放\n\n在本章中，你将学习如何结合 `jQuery` 使用 HTML5 拖放规范。HTML5 拖放规范提供的实现比 `jQuery\
  \ UI` 的 `Draggables` 和 `Droppables` 插件中的实现更强大，在后者中你将在第 12 章“可拖放与可放置”中学习到这些插件。HTML5\
  \ 拖放规范允许你在多个浏览器窗口之间进行拖放，甚至可以在完全不同浏览器的多个窗口之间进行拖放。例如，你可以在 Safari 中启动拖放并在 Chrome 或\
  \ Firefox 中完成。你还可以使用 HTML5 拖放从桌面或文件管理器上传文档。你可以将文件从桌面、`Finder`、`Windows Explorer`\
  \ 等拖入浏览器窗口，并在那里通过 `JavaScript` 访问上传的一个或多个文档，并显示缩略图和上传进度条。\n\n`jQuery` 本身并没有内置任何辅助使用\
  \ HTML5 拖放规范的功能，但你可以在 HTML5 拖放 API 的实现中使用 `jQuery` 来绑定事件并操纵 HTML 属性或 CSS 以实现拖放。在接下来的章节中，你将学习更多关于拖放\
  \ API 如何产生的知识，并看到一个实现它的示例。\n\n## 实现拖放\n\nHTML5 拖放可以被总结为主要是 `JavaScript` 事件的集合。根据浏览的不同，还有一些额外的\
  \ CSS/HTML 属性启用拖放。这些额外的 CSS/HTML 部分经常受到批评，因为浏览器厂商为了实现启动拖放而选择了非常诡异且不一致的方法。其中一个批评意见是\
  \ Peter-Paul Koch 在他的 [`quirksmode.org`](http://quirksmode.org) 网站上发表的一篇充斥脏话的博客文章：[`http://www.quirksmode.org/blog/archives/2009/09/the_html5_drag.html`](http://www.quirksmode.org/blog/archives/2009/09/the_html5_drag.html)。\n\
  \n他的控诉很好地总结了 HTML5 拖放 API 存在的问题；基本上，它是一个拼凑的方案，因为它是逆向工程的并基于 `IE` 的遗留实现。此外，Safari\
  \ 浏览器团队还曾通过添加 CSS 来触发拖放行为而偏离了规范。然而，Safari 团队随后更改了其实现以匹配官方的 HTML 5 规范。\n\nKoch 控诉的价值可能待争议，但他他在学习如何使用拖放\
  \ API 时表达出的挫败感是一种共同的。希望你在本章中学习到的知识可以显著缓解第一次使用拖放 API 时通常会挫败感。\n\n拖放 API 在所有现代浏览器中都可以工作，甚至通过添加一两行启用旧功能的代码，在某些旧浏览器中也能工作。拖放\
  \ API 起于 `IE5`。现代 API 是原始 `IE5` API 的轻微修改。该 API 由 Web 超文本应用技术工作组 (`WHATWG`) 规范化，随后在\
  \ `W3C` 从 `WHATWG` 接手 HTML5 时，被采用作为正式 `W3C` HTML5 规范的一部分。`IE` API 经过一些调整后被采用，以便现有的代码可以在无需太大困难的情况下直接使用。\n\
  \n以下是拖放 `JavaScript` 事件：\n\n*   `dragstart`——当拖放开始时，在启动拖放的元素上触发此事件。\n*   `dragend`——当拖放结束时，在启动拖放的元素上触发此事件。\n\
  *   `dragenter`——当元素进入绑定此事件的元素上方的空间时触发此事件；它用于为拖放元素识别合适的放置区域。\n*   `dragleave`——当元素离开绑定此事件的元素上方的空间时触发此事件；它也用于为拖放元素识别合适的放置区域。\n\
  *   `dragover`——当可拖放元素位于绑定此事件的元素上方空间内时连续触发此事件；此事件也用于放置端。\n*   `drag`——当元素被拖动时，在被拖动的元素上连续触发此事件。\n\
  *   `drop`——当可拖放元素释放在绑定此事件的元素上时触发此事件。\n\n你需要在文档中为这些大多数事件实现事件监听器以实现拖放。以下示例在一个基于浏览器的\
  \ Mac OS `Finder` 启文件管理器中实现了拖放 API。记住，你可以从 [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 免费下载这本书的源代码。此示例为 `Example 11-1.html`。\n\n```\n<!DOCTYPE HTML>\n<html lang='en'>\n\
  \    <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge' />\n \
  \       <meta charset='utf-8' />\n        <title>Finder</title>\n        <script\
  \ src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 11-1.js'></script>\n        <link href='Example 11-1.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <div id='finderFiles'>\n\
  \            <div class='finderDirectory' data-path='/Applications'>\n         \
  \       <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Applications</span>\n                </div>\n       \
  \     </div>\n            <div class='finderDirectory' data-path='/Library'>\n \
  \               <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Library</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Network'>\n              \
  \  <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Network</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Sites'>\n                <div\
  \ class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Sites</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/System'>\n               \
  \ <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>System</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Users'>\n                <div\
  \ class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Users</span>\n                </div>\n            </div>\n\
  \        </div>\n    </body>\n</html>\n```\n\n上述 HTML 使用以下样式表进行样式：\n\n\n\n\n\n```css\n\
  html,\nbody {\n    width: 100%;\n    height: 100%;\n}\nbody {\n    font: 12px \"\
  Lucida Grande\", Arial, sans-serif;\n    background: rgb(189, 189, 189) url('images/Bottom.png')\
  \ repeat-x bottom;\n    color: rgb(50, 50, 50);\n    margin: 0;\n    padding: 0;\n\
  }\ndiv#finderFiles {\n    border-bottom: 1px solid rgb(64, 64, 64);\n    background:\
  \ #fff;\n    position: absolute;\n    top: 0;\n    right: 0;\n    bottom: 23px;\n\
  \    left: 0;\n    overflow: auto;\n    user-select: none;\n    -webkit-user-select:\
  \ none;\n    -moz-user-select: none;\n    -ms-user-select: none;\n}\ndiv.finderDirectory\
  \ {\n    float: left;\n    width: 150px;\n    height: 100px;\n    overflow: hidden;\n\
  }\ndiv.finderDirectory:-webkit-drag {\n    opacity: 0.5;\n}\ndiv.finderIcon {\n\
  \    background: url('images/Folder 48x48.png') no-repeat center;\n    background-size:\
  \ 48px 48px;\n    height: 56px;\n    width: 54px;\n    margin: 10px auto 3px auto;\n\
  }\ndiv.finderIconSelected,\ndiv.finderDirectoryDrop div.finderIcon  {\n    background-color:\
  \ rgb(204, 204, 204);\n    border-radius: 5px;\n}\ndiv.finderDirectoryDrop div.finderIcon\
  \ {\n    background-image: url('images/Open Folder 48x48.png');\n}\ndiv.finderDirectoryName\
  \ {\n    text-align: center;\n}\nspan.finderDirectoryNameSelected,\ndiv.finderDirectoryDrop\
  \ div.finderDirectoryName span {\n    background: rgb(56, 117, 215);\n    border-radius:\
  \ 8px;\n    color: white;\n    padding: 1px 7px;\n}\n```\n\n最后，以下 JavaScript 让这一切都生了了：\n\
  \n```javascript\n$.fn.extend({\n    outerHTML : function()\n    {\n        var temporary\
  \ = $(\"<div/>\").append($(this).clone());\n        var html = temporary.html();\n\
  \        temporary.remove();\n        return html;\n    },\n    enableDragAndDrop\
  \ : function()\n    {\n        return this.each(\n            function()\n     \
  \       {\n                if (typeof this.style.WebkitUserDrag != 'undefined')\n\
  \                {\n                    this.style.WebkitUserDrag = 'element';\n\
  \                }\n                if (typeof this.draggable != 'undefined')\n\
  \                {\n                    this.draggable = true;\n               \
  \ }\n                if (typeof this.dragDrop == 'function')\n                {\n\
  \                    this.dragDrop();\n                }\n            }\n      \
  \  );\n    }\n});\n$(document).ready(\n    function()\n    {\n        $(document).on(\n\
  \            'mousedown.finder',\n            'div.finderDirectory, div.finderFile',\n\
  \            function(event)\n            {\n                $(this).enableDragAndDrop();\n\
  \                $('div.finderIconSelected')\n                    .removeClass('finderIconSelected');\n\
  \                $('span.finderDirectoryNameSelected')\n                    .removeClass('finderDirectoryNameSelected');\n\
  \                $(this).find('div.finderIcon')\n                    .addClass('finderIconSelected');\n\
  \                $(this).find('div.finderDirectoryName span')\n                \
  \    .addClass('finderDirectoryNameSelected');\n            }\n        );\n    \
  \    $('div.finderDirectory, div.finderFile')\n            .on(\n              \
  \  'dragstart.finder',\n                function(event)\n                {\n   \
  \                 event.stopPropagation();\n                    var html = $(this).outerHTML();\n\
  \                    var dataTransfer = event.originalEvent.dataTransfer;\n    \
  \                dataTransfer.effectAllowed = 'copyMove';\n                    try\n\
  \                    {\n                        dataTransfer.setData('text/html',\
  \ html);\n                        dataTransfer.setData('text/plain', html);\n  \
  \                  }\n                    catch (error)\n                    {\n\
  \                        dataTransfer.setData('Text', html);\n                 \
  \   }\n                }\n            )\n            .on(\n                'dragend.finder',\n\
  \                function(event)\n                {\n                    if ($('div.finderDirectoryDrop').length)\n\
  \                    {\n                        $(this).removeClass('finderDirectoryDrop');\n\
  \                        $(this).remove();\n                    }\n            \
  \    }\n            )\n            .on(\n                'dragenter.finder',\n \
  \               function(event)\n                {\n                    event.preventDefault();\n\
  \                    event.stopPropagation();\n                }\n            )\n\
  \            .on(\n                'dragover.finder',\n                function(event)\n\
  \                {\n                    event.preventDefault();\n              \
  \      event.stopPropagation();\n                    if ($(this).is('div.finderDirectory'))\n\
  \                    {\n                        $(this).addClass('finderDirectoryDrop');\n\
  \                    }\n                }\n            )\n            .on(\n   \
  \             'dragleave.finder',\n                function(event)\n           \
  \     {\n                    event.preventDefault();\n                    event.stopPropagation();\n\
  \                    $(this).removeClass('finderDirectoryDrop');\n             \
  \   }\n            )\n            .on(\n                'drop.finder',\n       \
  \         function(event)\n                {\n                    event.preventDefault();\n\
  \                    event.stopPropagation();\n                    var dataTransfer\
  \ = event.originalEvent.dataTransfer;\n                    try\n               \
  \     {\n                        var html = dataTransfer.getData('text/html');\n\
  \                    }\n                    catch (error)\n                    {\n\
  \                        var html = dataTransfer.getData('Text');\n            \
  \        }\n                    html = $(html);\n                    var drop =\
  \ $(this);\n                    var dontAcceptTheDrop = (\n                    \
  \    drop.data('path') == html.data('path') ||\n                        drop.is('div.finderFile')\n\
  \                    );\n                    if (dontAcceptTheDrop)\n          \
  \          {\n                        // 防止文件被拖入到自身\n                        drop.removeClass('finderDirectoryDrop');\n\
  \                        return;\n                    }\n                    if\
  \ (html.hasClass('finderDirectory finderFile'))\n                    {\n       \
  \                 // 对拖入的文件进行处理\n                        console.log(html);\n  \
  \                  }\n                }\n            );\n    }\n);\n```\n\n\n\n\n\
  代码块以 `$.fn.extend()` 开始，正如你在第 9 章“插件”中所学习过的，它被用于创建 jQuery 插件。`outerHTML : function()`\
  \ 开始了第一个插件，它实现了 `outerHTML` 功能。你想要获取 `outerHTML` 的标记块将通过 `$(this).clone()` 进行克隆，并插入到临时的\
  \ `<div>` 元素中。该临时 `<div>` 是使用字符串 `“<div/>”` 创建的，jQuery 在内部将其转换为 `<div>` 元素对象。使用\
  \ `append()` 方法将克隆的对象插入 `<div>` 元素中。然后，使用 `html()` 方法从新创建的 `<div>` 元素中获取新插入的对象，并将其赋值给名为\
  \ `html` 的变量。`html()` 方法内部使用了 `innerHTML` 属性，该属性在所有浏览器中都是通用实现的。然后，通过调用 `remove()`\
  \ 从内存中清理临时 `<div>` 元素（将其删除），并将 html 源码作为字符串返回。返回的 HTML 代码段现在是可移植的，可以传输到任何支持渲染 HTML\
  \ 的地方，或者使用你操作系统的拖放剪板作为纯文本。你将在本节稍后学习更多关于拖放剪板的知识。\n\n你创建的第二个插件通过三种不同的方法启用拖放功能，这些方法自微软在发布\
  \ IE5 时首次创建拖放 API 以来就存在了。\n\n```javascript\n enableDragAndDrop : function()\n  \
  \  {\n        return this.each(\n            function()\n            {\n       \
  \         if (typeof this.style.WebkitUserDrag != 'undefined')\n               \
  \ {\n                    this.style.WebkitUserDrag = 'element';\n              \
  \  }\n                if (typeof this.draggable != 'undefined')\n              \
  \  {\n                    this.draggable = true;\n                }\n          \
  \      if (typeof this.dragDrop == 'function')\n                {\n            \
  \        this.dragDrop();\n                }\n            }\n        );\n    }\n\
  ```\n\n此插件并不假设你只在一个元素上工作。由于你可能希望在许多元素上同时启用拖放，因此它使用 `each()` 遍历 `this` 中存在的潜在元素集合。jQuery\
  \ 总是将元素作为数组传递给插件，而永远作为单个元素，以便使与 jQuery 操作以及为 jQuery 编写插件变得更简单。\n\n拖放功能首先在旧的基于 WebKit\
  \ 的浏览器（如 Safari 和 Chrome）中启用。（值得注意的是，这些方法使用的顺序并不重要。）为了在旧的基于 WebKit 的浏览器中启用拖放，会将专有的\
  \ CSS 属性 `-webkit-user-drag` 设置为值 `element`。但在设置该值之前，你首先测试该 CSS 属性是否存在是否存在，通过查看\
  \ `typeof` 是否为 `undefined` 来判断。如果该属性存在，`typeof` 将不会是 `undefined`，而是 `string`。\n\n\
  ```javascript\n if (typeof this.style.WebkitUserDrag != 'undefined')\n         \
  \       {\n                    this.style.WebkitUserDrag = 'element';\n        \
  \        }\n```\n\n当你在 JavaScript 中设置专有的 CSS 属性时，连字符会被省略，且第一个字母会大写，因此 `–webkit-user-drag`\
  \ 变成了 `WebkitUserDrag`。如果它是在 Firefox 中实现的属性，那么你将对应的是 `–moz-user-drag` 和 `MozUserDrag`。\n\
  \n接下来，你检查 `draggable` 属性是否存在。W3C HTML 5 拖放规范建议使用 `draggable` 属性作为启用拖放的官方方式。该属性在\
  \ Safari、Chrome、Firefox 和 Internet Explorer 的最新版本都支持。像 CSS 属性一样，你必须检查 `typeof` 是否不是\
  \ `undefined` 以判断该属性是否在浏览器中实现。\n\n```javascript\n if (typeof this.draggable != 'undefined')\n\
  \                {\n                    this.draggable = true;\n               \
  \ }\n```\n\n`draggable` 属性是一个布尔属性。将其设置为 `true` 可启用元素的拖放功能，将其设置为 `false` 则禁用拖放。通过设置\
  \ `WebkitUserDrag` CSS 属性或 `draggable` 属性获得的行为是默认行为。通常情况下，你可以移动元素，但当你放开它时什么都不会发生，因为该行为必须用\
  \ JavaScript 来定义。\n\n启用拖放的最后方法用于较旧版本的 Internet Explorer。Internet Explorer 9 及更高版本实现了新的\
  \ HTML 5 拖放规范，并要求使用 `draggable` 属性而不是这里使用的旧方法。若要在 IE8 及更早版本中启用拖放，首先测试 `dragDrop`\
  \ 方法是否存在。测试 `dragDrop` 方法的 `typeof` 是否为 `function` 以确定你是否可以使用它。（如果你喜欢，也可以像检查 CSS\
  \ 属性和 HTML 属性一样检查 `typeof` 是否不是 `undefined`。）\n\n```javascript\n if (typeof this.dragDrop\
  \ == 'function')\n                {\n                    this.dragDrop();\n    \
  \            }\n```\n\n如果 `dragDrop` 方法存在，只需在元素上调用它即可在 IE8 及更早版本中启用该元素的拖放。\n\n###\
  \ 事件设置\n\n现在你已经定义了这两个 jQuery 插件，你需要设置实现拖放 API 所需的事件。\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        $(document).on(\n            'mousedown.finder',\n\
  \            'div.finderDirectory, div.finderFile',\n            function(event)\n\
  \            {\n                $(this).enableDragAndDrop();\n                $('div.finderSelected')\n\
  \                    .removeClass('finderSelected');\n                $('span.finderDirectorySelected')\n\
  \                    .removeClass('finderDirectorySelected');\n                $(this).find('div.finderIcon')\n\
  \                    .addClass('finderSelected');\n                $(this).find('div.finderDirectory\
  \ span')\n                    .addClass('finderDirectorySelected');\n          \
  \  }\n        );\n```\n\n你创建第一个事件是 `mousedown` 事件，它为类名为 `finderDirectory` 和 `finderFile`\
  \ 的每个 `<div>` 元素启用拖放功能。因为它使用了 `on()` 方法，所以当具有这些类的新 `<div>` 元素添加到 DOM 时，它会自动应用。你将在本章稍后的示例\
  \ 11-2 中深入学习动态应用事件以处理所添加的文件或文件夹的概念。`mousedown` 事件通过事件命名空间 *finder* 应用，这是你在第 3 章“事件”中所学习过的。jQuery\
  \ 的事件命名空间允许对绑定和取消事件处理程序进行更多控制。如果需要，可以使用命名空间仅取消 *finder* 命名空间的事件，而不影响其他命名空间的事件。\n\
  \n接下来的工作是开始为每个文件和文件夹 `<div>` 元素应用拖放事件。除了 CSS 属性 `WebkitUserDrag`、HTML 属性 `draggable`\
  \ 和 `dragDrop()` 方法外，事件的应用控制了用户拖放元素时发生的情况。拖放事件在拖拽元素上的触发顺序如下：\n\n1.  `dragstart`\n\
  2.  `drag`\n3.  `dragend`\n\n拖放事件在放置目标元素上的触发顺序如下：\n\n1.  `dragenter`\n2.  `dragover`\n\
  3.  `drop` 或 `dragleave`\n\n大多数拖放事件都需要 `event.preventDefault()` 或 `event.stopPropagation()`\
  \ 或两者兼有，以阻止默认操作或防止事件在 DOM 树中传播。\n\n\n\n\n\n`dragstart` 事件设置了操作系统的拖放剪贴板内容。它还提供了一个设置\
  \ `effectAllowed` 属性的机会。`effectAllowed` 属性的作用仅仅是更改鼠标光标，向用户指示拖放元素时可以进行的操作。由于你正在处理文件和文件夹，最有意义的\
  \ `effectAllowed` 值是 `'copyMove'`。\n\n```\n $('div.finderDirectory, div.finderFile')\n\
  \            .on(\n                'dragstart.finder',\n                function(event)\n\
  \                {\n                    event.stopPropagation();\n             \
  \       var html = $(this).outerHTML();\n                    var dataTransfer =\
  \ event.originalEvent.dataTransfer;\n                    dataTransfer.effectAllowed\
  \ = 'copyMove';\n                    try\n                    {\n              \
  \          dataTransfer.setData('text/html', html);\n                        dataTransfer.setData('text/plain',\
  \ html);\n                    }\n                    catch (error)\n           \
  \         {\n                        dataTransfer.setData('Text', html);\n     \
  \               }\n                }\n            )\n```\n\n`effectAllowed` 属性的可能值如下：\n\
  \n- `none`—不允许任何拖放操作。\n- `copy`—允许仅通过拖放复制。\n- `move`—允许仅通过拖放移动。\n- `link`—允许仅通过拖放创建链接。\n\
  - `copyMove`—允许复制和移动。\n- `copyLink`—允许复制和创建链接。\n- `linkMove`—允许创建链接和移动。\n- `all`—允许复制、创建链接和移动。\n\
  \n当 `effectAllowed` 属性支持两种或多种操作时，通常通过按住键盘上的某个键调用第二个或第三种操作。\n\n系统拖放剪贴板也在 `dragstart`\
  \ 事件中设置。剪贴板的设置首先是获取元素的 `outerHTML()`。然后将 HTML 复制到剪贴板，并通过 MIME 类型在剪贴板上标识。在这种情况下，设置了\
  \ `text/plain` 和 `text/html` 两种 MIME 类型。设置 MIME 类型允许你计算机上的其他应用程序处理你复制到系统剪贴板的数据。例如，在\
  \ `dragstart` 事件中将 HTML 复制到剪贴板后，你现在可以将元素从浏览器窗口拖放到其他应用程序。任何支持 `text/html` 或 `text/plain`\
  \ 的应用程序都可以处理复制到剪贴板的数据。你可以将内容从浏览器拖放到文本编辑器，包括仅支持 `text/plain` MIME 类型的编辑器。你可以在完全不同的浏览器之间进行拖放。\n\
  \n`try` / `catch` 异常区分了使用 Internet Explorer 方法的 `setData()` 方法和 HTML5 标准方法。IE 仅支持两个选项：`'Text'`\
  \ 和 `'URL'`。所有其他浏览器都使用 MIME 类型。当使用 MIME 类型失败并抛出错误时，异常会自动切换到 IE 方法。\n\n你绑定的下一个事件是\
  \ `dragend` 事件。\n\n```\n .on(\n                'dragend.finder',\n             \
  \   function(event)\n                {\n                    if ($('div.finderDirectoryDrop').length)\n\
  \                    {\n                        $(this).removeClass('finderDirectoryDrop');\n\
  \                        $(this).remove();\n                    }\n            \
  \    }\n            )\n```\n\n`dragend` 事件在拖放完成时触发，并且在被拖拽的元素上触发。`dragend` 事件存在一个难以处理或完全无法处理的问题：当从浏览器窗口向另一个浏览器窗口或外部应用程序执行拖放时，无法知道拖放何时完成于可接受的放置区域。一种潜在的解决方法是从接收放置操作的一侧向服务器发送\
  \ AJAX 请求，然后使用 web sockets 监听拖放源侧何时发生了放置操作。但对于这个简单的拖放 API 演示来说，那种方法实在过于复杂了。\n\n\
  对于源于并终止同一个浏览器窗口的拖放，`dragend` 事件会查找是否存在类名为 `finderDirectoryDrop` 的 `<div>` 元素。如果检测到该\
  \ `<div>` 元素，则说明拖放已在接受的放置区域完成，这意味着被拖拽的元素可以从 DOM 中移除。由于元素已从 DOM 中移除，这使得拖放的默认操作变为\
  \ `move`。如果你实现的是 `copy` 操作，那么自然希望保留原始元素是符合理想的。这种操作可以通过在执行拖放时按住 Option (Mac) 或 Ctrl\
  \ (Windows) 键来实现。你可以通过检查 `dragstart` 事件监听器中 `event.altKey` 是否结果为 `true` 来查找 Option/Alt\
  \ 键。其他选项还有 Control 键 `event.ctrlKey`、Shift 键 `event.shiftKey` 或 Command/Windows\
  \ 键 `event.metaKey`。\n\n接接绑定的事件是 `dragenter` 事件：\n\n```\n .on(\n               \
  \ 'dragenter.finder',\n                function(event)\n                {\n    \
  \                event.preventDefault();\n                    event.stopPropagation();\n\
  \                }\n            )\n```\n\n对 `dragenter` 事件采取的操作仅仅是防止默认行为并停止事件传播。`dragover`\
  \ 事件采取的操作类似：\n\n```\n .on(\n                'dragover.finder',\n               \
  \ function(event)\n                {\n                    event.preventDefault();\n\
  \                    event.stopPropagation();\n                    if ($(this).is('div.finderDirectory'))\n\
  \                    {\n                        $(this).addClass('finderDirectoryDrop');\n\
  \                    }\n                }\n            ) \n```\n\n`dragover` 事件同样需要取消默认行为并停止事件传播。此外，如果元素是类名为\
  \ `finderDirectory` 的 `<div>` 元素，则添加类名 `finderDirectoryDrop`，这会将目录使用的图标从闭合文件夹变为打开文件夹。\n\
  \n同样，`dragleave` 事件也会取消默认行为并停止事件传播：\n\n```\n .on(\n                'dragleave.finder',\n\
  \                function(event)\n                {\n                    event.preventDefault();\n\
  \                    event.stopPropagation();\n                    $(this).removeClass('finderDirectoryDrop');\n\
  \                }\n            )\n```\n\n然后从 `<div>` 元素中移除类名 `finderDirectoryDrop`，这表示拖拽元素不再位于该元素之上。\n\
  \n最后，应用 `drop` 事件，它同样从防止默认行为和停止事件传播开始。\n\n\n\n\n\n```\n .on(\n                'drop.finder',\n\
  \                function(event)\n                {\n                    event.preventDefault();\n\
  \                    event.stopPropagation();\n                    var dataTransfer\
  \ = event.originalEvent.dataTransfer;\n                    try\n               \
  \     {\n                        var html = dataTransfer.getData('text/html');\n\
  \                    }\n                    catch (error)\n                    {\n\
  \                        var html = dataTransfer.getData('Text');\n            \
  \        }\n                    html = $(html);\n                    var drop =\
  \ $(this);\n                    var dontAcceptTheDrop = (\n                    \
  \    drop.data('path') == html.data('path') ||\n                        drop.is('div.finderFile')\n\
  \                    );\n                    if (dontAcceptTheDrop)\n          \
  \          {\n                        // Prevent file from being dragged onto itself\n\
  \                        drop.removeClass('finderDirectoryDrop');\n            \
  \            return;\n                    }\n                    if (html.hasClass('finderDirectory\
  \ finderFile'))\n                    {\n                        // Do something\
  \ with the dropped file\n                        console.log(html);\n          \
  \          }\n                }\n            );\n```\n\n`drop` 事件监听器继续将来自 `event.originalEvent.dataTransfer`\
  \ 的 `dataTransfer` 对象赋值给 `dataTransfer`，这样做是为了防止代码行过宽。在 `dragstart` 事件期间，以 `text/html`\
  \ MIME 类型复制到系统剪贴板的 HTML 通过 `getData()` 方法和相同的 MIME 类型 `text/html` 从系统剪贴板中检索。该 HTML\
  \ 以纯文本形式从剪贴板获取并赋值给变量 `html`。通过将 HTML 片段传递给 jQuery 方法 `$(html)`，将 `html` 变量转换为 jQuery\
  \ 可以处理的 DOM 对象。这使得可以使用 jQuery 方法对从系统剪贴板获取的 `<div>` 元素进行操作。\n\n在 `getData()` 方法上使用了另一个\
  \ `try` / `catch` 异常处理，以区分 Internet Explorer 从剪贴板获取数据的方法与标准获取剪贴板数据的方法。正如在使用 `setData()`\
  \ 时所的那样，IE 只需要 `'Text'` 而不是 MIME 类型来获取数据，在这里使用异常处理会自动从 MIME 类型方法切换到 IE 方法。\n\n接下来，将拖落元素通过\
  \ jQuery `$(this),` 处理，并赋值给名为 `drop` 的变量。\n\n变量 `dontAcceptTheDrop` 用于检查元素是否没有被拖到自身上，以及拖放目标是一个目录而非文件。如果\
  \ `dontAcceptTheDrop` 为 `true`，则移除 `finderDirectoryDrop` 类名，并通过调用 `return` 终止事件监听器的执行。\n\
  \n最后，检查从 HTML 片段创建的 `<div>` 对象，确认它是否具有 `finderDirectory` 或 `finderFile` 类名，这作为最终验证，确保该\
  \ HTML 片段是你想要处理的 HTML。\n\n在下一节中，你将学习如何进一步扩展此示例，以便在实现文件夹窗口拖放功能的同时，还能接受拖放文件上传。你将扩展该示例，以对被拖动和释放的文件或文件夹动态地重新应用事件。\n\
  \n## 实现拖放文件上传\n\n拖放文件上传在过去几年中已经不断演变——最初仅允许通过拖放上传一个或多个文件，然后扩展到允许拖放下载。随后，文件上传再次扩展，允许通过拖放同时上传文件和文件夹。目前，所有主流浏览器的最新版本都支持通过拖放进行文件上传。Chrome\
  \ 支持文件和文件夹的上传，以及拖放下载。\n\n在接下来的示例中，你将在 `Example 11-1` 的基础上进行构建，为其添加拖放上传支持，以及其他改进拖放体验的微调。拖放上传伴随着图像文件的缩略图预览以及一个上传进度条。为了真实地测试以下示例，你需要添加一个服务器端脚本来接收上传的文件。此示例未涵盖服务器端部分，但我提供了一个补救性的\
  \ PHP 脚本，可以使用它来检查上传的文件元数据。该示例可以在书籍源代码下载材料中以 `Example 11-2` 的形式提供。\n\n\n\n\n\n```html\n\
