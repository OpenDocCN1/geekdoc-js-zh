  \ 第 4 章：操作内容和属性\n\njQuery 是非常详尽的；它提供了你想象到的所有用于处理 DOM 内容的方法。在第 2 章“选择与过滤”中，你看到了 jQuery\
  \ 如何通过其对选择和过滤的精细化支持，轻松地从 DOM 获取元素。接着在第 3 章“事件”中，你看到了 jQuery 如何封装并扩展 W3C 事件模型，使其变得更加简洁，同时提供了多得的功能。本章将继续对\
  \ jQuery API 组件的讨论，深入探讨 jQuery 提供的用于操作内容和属性的方法。你不再需要担心浏览器是否支持 `innerText` 或 `textContent`\
  \ 属性，或者 `outerHTML` 属性，或者从文档中移除元素的标准 DOM 方法是什么（无论如何你本应该知道做这些事情）。jQuery 用一个稳如磐石的\
  \ API 直接覆盖了这些冗长且有时碎片的方法。\n\n本章涵盖了你如何移动 DOM 内容，例如用一个元素替换另一个元素、插入新的文本或 HTML、追加或前置内容、克隆内容以及移除内容。\n\
  \n它还涵盖了如何使用 jQuery 操作属性，这是另一个 jQuery 通过提供你在库中需要的所有方法而变得平滑且易用的领域。或者你可能曾有过想为元素保存自定义数据的时刻；jQuery\
  \ 也提供了这种功能。\n\n## 设置、获取和移除属性\n\n使用 jQuery 处理属性是非常简单的。就像你使用 jQuery 执行的任何操作一样，首先进行选择，在完成选择后，你就可以对该选择集进行某些操作，例如设置或访问属性。在选择集上设置属性会在你所选的每个元素上设置这些属性。你可以同时为一个或多个元素设置一个或多个属性的值。获取一个属性的值也非常容易；在完成选择后，访问属性的值可以让你获得选择集中第一个元素的属性值。最后，移除属性的操作也同样直观：当你移除一个属性时，它会从选择集中的每个元素中移除该属性。如果你在移除后尝试获取属性，它将返回\
  \ `undefined`。\n\n以下文档出现在从[`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 下载的源码包中，作为*示例 4-1*，演示了这些概念：\n\n\n\n\n\n```html\n<!DOCTYPE HTML>\n<html lang='en'>\n\
  \    <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge' />\n \
  \       <meta charset='utf-8' />\n        <title>The Marx Brothers</title>\n   \
