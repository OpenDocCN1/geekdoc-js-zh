  \ = today.prev('td');\n            // 如果今天位于周的开头，则在上一行\n            // 行中寻找昨天。 \n\
  \            if (!yesterday.length)\n            {\n                var lastWeek\
  \ = today.parent('tr').prev('tr');\n                if (lastWeek.length)\n     \
  \           {\n                    yesterday = lastWeek.children('td').eq(6);\n\
  \                }\n            }\n            // 如果今天出现在日历第一行的第一个\n           \
  \ // 单元格中，那么昨天就不会出现在本月中。\n            if (yesterday.length)\n            {\n   \
  \             yesterday.addClass('calendarYesterday');\n            }\n        \
  \    var tomorrow = today.next('td');\n            // 如果今天位于周的末，则在下一\n         \
  \   // 行中寻找明天。\n            if (!tomorrow.length)\n            {\n             \
  \   var nextWeek = today.parent('tr').next('tr');\n                if (nextWeek.length)\n\
  \                {\n                    tomorrow = nextWeek.children('td').eq(0);\n\
  \                }\n            }\n            // 如果今天出现在日历最后一行的最后一个\n         \
  \   // 单元格中，那么明天就不会出现在本月中。\n            if (tomorrow.length)\n            {\n  \
  \              tomorrow.addClass('calendarTommorow');\n            }\n         \
  \   var laterThisWeek = today.nextAll('td');\n            if (laterThisWeek.length)\n\
  \            {\n                laterThisWeek.addClass('calendarLaterThisWeek');\n\
  \            }\n            var earlierThisWeek = today.prevAll('td');\n       \
  \     if (earlierThisWeek.length)\n            {\n                earlierThisWeek.addClass('calendarEarlierThisWeek');\n\
  \            }\n            today.siblings('td')\n                 .addClass('calendarThisWeek');\n\
  \        };\n        var selectedDay = null;\n        $('table.calendarMonth td')\n\
  \            .not('td.calendarLastMonth, td.calendarNextMonth')\n            .click(\n\
  \                function()\n                {\n                    if (selectedDay\
  \ && selectedDay.length)\n                    {\n                        selectedDay\n\
  \                            .removeClass('calendarDaySelected')\n             \
  \               .parent('tr')\n                                .removeClass('calendarWeekSelected');\n\
  \                    }\n                    var day = $(this);\n               \
  \     selectedDay = day;\n                    selectedDay\n                    \
  \    .addClass('calendarDaySelected')\n                        .parent('tr')\n \
  \                           .addClass('calendarWeekSelected');\n               \
  \     day.parents('table.calendarMonth')\n                       .find('span.calendarDay')\n\
  \                       .text(day.text() + ', ');\n                }\n         \
  \   )\n            .dblclick(\n                function()\n                {\n \
  \                   today.removeClass('calendarToday');\n                    today\
  \ = $(this);\n                    today.addClass('calendarToday');\n           \
  \         setUpThisWeek();\n                }\n            );\n        setUpThisWeek();\n\
  \    }\n);\n```\n\n当你将`示例 2-3` 中创建的日历加载到浏览器中时，你将看到图 2.3 中所示的结果。\n\n![image](img/c02f003.jpg)\n\
  \n**图 2.3\n\n`示例 2-3` 将几个概念整合在一起，为你提供了一个更真实的示例，展示了如何使用 jQuery 的遍历方法。与之前的所有示例一样，你从\
  \ `DOMContentReady` 事件开始。\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n```\n\n当文档就绪时，你做的第一件事是设置一个变量来包含对今天的引用，该变量包含具有类名为 `calendarToday` 的 `<<td>>`\
  \ 元素。\n\n```javascript\nvar today = $('td.calendarToday');\n```\n\n此示例使用了所有的类名，因为日历概念是一个你可能预期在同一个文档中同时加载多个月份的概念。\n\
  \n接下来，你创建了一个可重用的函数来设置一些元数据，主要是作为一种智力练习。你创建的元数据演示了 jQuery 处理兄弟元素以及子元素的各种方法，以及 `eq()`\
  \ 方法，该方法允许你根据元素相对于零的位置偏移量将选择缩小到单个元素。由于该方法是在文档就绪时执行的函数内部创建的，因此该方法在 `ready()` 函数内部创建的所有其他函数内部都是用的。你在此之前创建的名为\
  \ `today` 的变量也是如此。\n\n```javascript\nvar setUpThisWeek = function()\n        {\n\
  ```\n\n在 `setUpThisWeek` 函数中，你做的第一件事是移除稍后在同一个函数中应用的所有类名。你通过选择类名为 `calendarMonth`\
  \ 的 `<table>` 内部的 `<td>` 元素，然后调用 jQuery 的 `removeClass()` 方法来实现这一点。`removeClass()`\
  \ 可以接受一个类名或多个类名。如果你提供了多个类名，只需用单个空格分隔每个单独的类名，就像你在使用 HTML 的 `class` 属性指定类名时一样。这反过来会移除任何已指定的类名。\n\
  \n```javascript\n$('table.calendarMonth td').removeClass(\n                'calendarYesterday\
  \ ' +\n                'calendarTomorrow ' +\n                'calendarEarlierThisWeek\
  \ ' +\n                'calendarLaterThisWeek ' +\n                'calendarThisWeek'\n\
  \            );\n```\n\n接下来，你创建一个包含昨天引用的变量，该变量名为 `yesterday`。为了捕获哪一天被认为是昨天，你从之前捕获的今天开始。然后使用\
  \ jQuery 的 `prev()` 方法向后移动一个表格单元格到达前一天，该方法选择紧接在当前选择之前的元素（或元素）。在这种情况下，你只与单个元素进行操作，但正如\
  \ jQuery 能做的一切事情一样，它会乐意允许你同时处理多个元素。如果选择包含多个元素，`prev()` 将对它们全部起作用，并为你提供一个包含所有先驱元素的新选择。你还为\
  \ `prev()` 提供了一个选择器，这会将相邻的先驱元素限制为 `<td>` 元素。在示例的语境下，你可以很容易地省略该选择器，而得到相同的结果。我包含它有两个原因：第一是为了提供一个关于向这些方法提供选择器的含义的示例，其次是为了让代码更直观、更于理解。\n\
  \n```javascript\nvar yesterday = today.prev('td');\n```\n\n如果你正在编写一个真实的日历应用程序，你需要考虑今天可能出现的任何情况。它可能出现在一行的开头，也可能出现在一行的末尾。如果今天出现在一行的开头，那么在代表今天的\
  \ `<td>` 元素之前就没有相邻的 `<td>` 元素。在这种情况下，之前赋值给 `yesterday` 将是一个空数组，它没有 `length`。这就是在\
  \ jQuery 中检查选择是否存在。如果选择结果为空，jQuery 将返回一个空数组，然后你可以检查 `length` 属性来查看是否有元素被选中。\n\n\n\
  \n\n\n```javascript\n if (!yesterday.length)\n            {\n```\n\n如果没有相邻的前一个元素，你需要移动到上的一行。为了做到这一点，你从代表今天的\
  \ `<td>` 开始，然后使用 jQuery 的 `parent()` 方法从该处向上移动 DOM 移动到该元素的父元素，该父元素是一个 `<tr>` 元素。当你到达\
  \ `<tr>` 元素时，在 DOM 中向后移动到前一个 `<tr>` 元素。然后，你使用 jQuery 的 `children()` 方法查看该 `<tr>`\
  \ 元素的子元素，这些元素显然都是 `<td>` 元素。接着，你使用 `eq()` 方法将 `<td>` 元素的选择限制为最后一个。因为我们从 0 开始计数，而且一周有\
  \ 7 天，这将使得最后一个 `<td>` 元素成为选择中的第 6 个。和上一次一样，你向 `parent()`、`children()` 和 `prev()`\
  \ 方法提供选择器，仅仅是为了在编程中提供更多的上下文和信息。\n\n```javascript\n var lastWeek = today.parent('tr').prev('tr');\n\
  \                if (lastWeek.length)\n                {\n                    yesterday\
  \ = lastWeek.children('td').eq(6);\n                }\n            }\n```\n\n可能不存在代表昨天的\
  \ `<td>` 元素，因为今天可能是月份的第一天，因此可能作为第一个 `<tr>` 元素的第一个孩子出现。所以，另一个对长度的检查确保选择了一个 `<td>`\
  \ 元素来代表昨天。当确定存在昨天的 `<td>` 元素时，它会被赋予类名 `calendarYesterday`。\n\n```javascript\n if\
  \ (yesterday.length)\n            {\n                yesterday.addClass('calendarYesterday');\n\
  \            }\n```\n\n现在你已经确定了哪一个（如果有的话）`<td>` 元素代表昨天，下一步是确定哪一个 `<td>` 元素代表明天。这次你通过对代表今天的选择使用\
  \ jQuery 的 `next()` 方法向前移动一个 `<td>` 元素，这将引用相邻的后续 `<td>` 元素。任何选择都被赋值给名为 `tomorrow`\
  \ 的变量。\n\n```javascript\n var tomorrow = today.next('td');\n```\n\n与 `yesterday`\
  \ 一样，你不能确定是否存在与代表今天的 `<td>` 相邻且后续的，所以再次检查 `length` 属性以查看是否进行了选择。\n\n```javascript\n\
  \ if (!tomorrow.length)\n            {\n```\n\n如果没有 `<td>` 元素，你再次从代表今天的 `<td>` 元素向上移动到父元素\
  \ `<tr>` 元素，并使用 `next()` 继续到下一个 `<tr>` 元素。然后你通过 `children()` 查看该 `<tr>` 元素的子元素（如果确实有下一行的话），并通过调用\
  \ `eq(0)` 将选择限制到该行的第一个 `<td>` 元素。这次，0 代表第一个孩子 `<td>` 元素。\n\n```javascript\n var\
  \ nextWeek = today.parent('tr').next('tr');\n                if (nextWeek.length)\n\
  \                {\n                    tomorrow = nextWeek.children('td').eq(0);\n\
  \                }\n            }\n```\n\n当你确定了哪一个元素（如果有的话）代表明天时，你检查是否有选择，如果有，就给该\
  \ `<td>` 元素添加类名 `calendarTomorrow`。\n\n```javascript\n if (tomorrow.length)\n  \
  \          {\n                tomorrow.addClass('calendarTommorow');\n         \
  \   }\n```\n\n下一个练习是识别今天之后的所有日期，这些日期将代表*本周稍晚些时候*。这是通过对代表今天的选择调用 `nextAll()` 完成的，它会返回一个\
  \ `<td>` 元素的选择，所有这些元素都是代表今天的 `<td>` 的兄弟，但都发生在今天之后。\n\n```javascript\n var laterThisWeek\
  \ = today.nextAll('td');\n            if (laterThisWeek.length)\n            {\n\
  ```\n\n如果有 `<td>` 元素的选择，这些 `<td>` 元素都将获得类名 `calendarLaterThisWeek`。\n\n```javascript\n\
  \ laterThisWeek.addClass('calendarLaterThisWeek');\n            }\n```\n\n然后，你执行同样的操作来识别符合*本周早些时候*描述的\
  \ `<td>` 元素。为了识别这些元素，你对今天调用 `prevAll()` 来选择代表今天的 `<td>` 之前的所有 `<td>` 元素。\n\n```javascript\n\
  \ var earlierThisWeek = today.prevAll('td');\n            if (earlierThisWeek.length)\n\
  \            {\n```\n\n如果变量 `earlierThisWeek` 分配了 `<td>` 元素，这些 `<td>` 元素每一个将获得类名\
  \ `calendarEarlierThisWeek`。\n\n```javascript\n earlierThisWeek.addClass('calendarEarlierThisWeek');\n\
  \            }\n```\n\n最后，你使用 jQuery 的 `siblings()` 方法识别代表今天的 `<td>` 的所有兄弟元素，这些元素都被赋予类名\
  \ `calendarThisWeek`。\n\n```javascript\n today.siblings('td')\n                \
  \ .addClass('calendarThisWeek');\n        };\n```\n\n你通过 `setUpThisWeek()` 方法经历的兄弟元素发现练习，可以使用\
  \ Safari 或 Chrome 中的 Web Inspector、Firefox 中的 Firebug 以及 IE 中的开发工具等工具进行探索。图 2.4\
  \ 所示的是 Safari 中的 Web Inspector，它显示了你为代表今天的 `<td>` 周围代表每周每一天或一组日的 `<td>` 分配的类名。\n\
  \n![image](img/c02f004.jpg)\n\n**图 2.4**\n\n下一段代码定义了与日历的一些交互性：\n\n*   选择日历中的某一天\n\
  *   选择该一天所在的周\n*   在日历标题中设置所选日期的格式\n*   更改代表今天的日期\n\n你做的第一件事是创建一个新变量来跟踪所选的。这个变量创建在你每天点击的函数之外，因此它可以在点击事件之间持续。该变量被称为\
  \ `selectedDay`。\n\n```javascript\n var selectedDay = null;\n```\n\n然后你进行一次选择，从代表月份的\
  \ `<table>` 中存在的所有 `<td>` 元素开始。\n\n```javascript\n $('table.calendar td')\n```\n\
  \n该选择随后被缩小，以排除代表上个月剩余日期或下个月起始日的 `<td>` 元素，尽管这个特定示例没有包含下个月的任何日期，因为它恰好结束，填满了最后一个 `<tr>`\
  \ 元素内的所有七个子位置。通过使用 jQuery 的 `not()` 方法从选择中排除这些 `<td>` 元素。`not()` 方法获取一个现有的选择并使用选择器对其进行减法。\n\
  \n```javascript\n.not('td.calendarLastMonth, td.calendarNextMonth')\n```\n\n`not()`\
  \ 方法还可以接受另一个 jQuery 选择的结果，例如\n\n```javascript\n.not($('td.calendarLastMonth, td.calendarNextMonth'))\n\
  ```\n\n它还可以使用直接 DOM 对象，例如从 JavaScript 方法 `getElementById()` 返回的对象。最后，你还可以使用一个回调函数，它将返回前一个的、一个\
  \ jQuery 选择或一个直接 DOM 元素引用。同样的情况也适用于许多 jQuery API 方法；在合理且可行的情况下，你通常可以使用 jQuery 选择（即从\
  \ jQuery 返回的元素数组）、直接 DOM 对象引用或回调函数。\n\n```javascript\n .not('td.calendarLastMonth,\
  \ td.calendarNextMonth')\n```\n\n在排除了你不希望在当前月份可选择的元素后，剩余的 `<td>` 元素每个通过 `click()`\
  \ 和 jQuery 的事件 API 接收一个 `onclick` 事件，我将在第 3 章“事件”中详细详细介绍。\n\n```javascript\n .click(\n\
  \                function()\n                {\n```\n\n\n\n\n当发生点击事件时，你做的第一件事是使用你创建的\
  \ `selectedDay` 变量来跟踪被选中的日期。你首先通过检查 `length` 属性来查看在该变量中是否存储了选择。如果你存储了选择，则使用该选择从上一个具有该类名的\
  \ `<td>` 元素中移除 `calendarDaySelected` 类名，并从最后一个接收该类名的 `<tr>` 元素中移除 `calendarWeekSelected`\
  \ 类名。这确保了在任何给定的点击中，只有一个 `<td>` 元素具有该类名并是唯一的被选中日期，且该元素的父级 `<tr>` 元素是唯一的被选中的周。如果没有这段逻辑，你可能会将多个\
  \ `<td>` 和多个 `<tr>` 元素分别选为指定的日期和周。\n\n```\n if (selectedDay && selectedDay.length)\n\
  \                    {\n                        selectedDay\n                  \
  \          .removeClass('calendarDaySelected')\n                            .parent('tr')\n\
  \                                .removeClass('calendarWeekSelected');\n       \
  \             }\n```\n\n遵循选中日期逻辑，你将一个名为 `day` 的变量赋值为 `$(this)`，这是当前触发点击事件的元素，并使其变为\
  \ jQuery 可操作。\n\n```\n var day = $(this);\n```\n\n然后将 `day` 赋值给 `selectedDay`，它将一直持续直到下一次点击事件发生。\n\
  \n```\n selectedDay = day;\n```\n\n接着，被选中的日期接收 `calendarDaySelected` 类名，然后其父级 `<tr>`\
  \ 元素也接收 `calendarWeekSelected` 类名。\n\n```\n selectedDay\n                      \
  \  .addClass('calendarDaySelected')\n                        .parent('tr')\n   \
  \                         .addClass('calendarWeekSelected');\n```\n\n然后你从被选中的日期向上遍历\
  \ DOM 直到 `<td>` 元素的祖先 `<table>` 元素。从那里你找到类名为 `calendarDay` 的 `<span>` 元素，并为其分配文本内容。这会将被选中的日期以日期格式放置在日历头部，例如\
  \ `November 23, 2013`。调用 `day.text()` 返回被选中日期的文本内容；在这种情况下，这是代表月份几的数字，它会被追加到一个包含逗号和空格的字符串中。`parents()`\
  \ 方法用于从一个元素到该元素的父元素或祖先，允许你一直向上到 DOM 树的根元素 `<html>`。你提供给 `parents()` 的选择器告诉 `parents()`\
  \ 方法在你向上遍历 DOM 树时想要包含的元素或多个元素。如果你在选择器中也包含 jQuery 特有的 `:first` 伪类，例如 `table.calendarMonth:first`，这也会触发\
  \ `parents()` 方法在遇到匹配提供选择器的第一个元素时停止搜索，因此它将比我使用的选择器提供更好的性能，因为后者会导致 jQuery 检查整个 DOM\
  \ 祖先，以确保匹配了每一个可能的元素。\n\n```\n day.parents('table.calendarMonth')\n             \
  \          .find('span.calendarDay')\n                       .text(day.text() +\
  \ ', ');\n                }\n            )\n```\n\n你创建的下一个事件是使用 jQuery 的 `dblclick()`\
  \ 方法创建的双击点击事件。创建此事件允许你更改被视为“今天”的日期。\n\n```\n .dblclick(\n                function()\n\
  \                {\n```\n\n要更改被视为今天的元素，你首先从当前带有该别名的 `<td>` 元素中移除 `calendarToday`\
  \ 类名。你将双击点击的 `<td>` 元素赋值给 `today`。你为新元素添加 `calendarToday` 类名。\n\n```\n today.removeClass('calendarToday');\n\
  \                    today = $(this);\n                    today.addClass('calendarToday');\n\
  ```\n\n然后你再次调用 `setUpThisWeek()` 来重新计算哪些天被视为昨天、明天、本周早、本周晚以及本周。\n\n```\n setUpThisWeek();\n\
  \                }\n            );\n```\n\n最后，你在分配给 `ready()` 事件的匿名函数中所做的目的是调用 `setUpThisWeek()`，它会在文档最初加载时设置相对于视为今天的元素的周。\n\
  \n```\n setUpThisWeek();\n```\n\n本章介绍的最后概念只是关于 jQuery 提供的两个额外方法的笔记。根据我个人的经验，我没有经常使用这些方法，但它们可能对你很有用。这两个方法是\
  \ `slice()` 和 `add()`。\n\n## 切片选择\n\n`slice()` 方法与 `eq()` 方法类似；它根据选择中元素的偏移位置来选择选择的一个子集。它使用一个或两个参数来实现。如果你只提供一个参数，则提供切片的起始点。参考以下关于中地球地点的示例：\n\
  \n```html\n<!DOCTYPE HTML>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n\
  \        <meta http-equiv=\"content-type\"\n            content=\"application/xhtml+xml;\
  \ charset=utf-8\" />\n        <meta http-equiv=\"content-language\" content=\"en-us\"\
  \ />\n        <title>Places in Middle-Earth</title>\n    </head>\n    <body>\n \
  \       <ul>\n            <li>The Shire</li>\n            <li>Fangorn Forest</li>\n\
  \            <li>Rohan</li>\n            <li>Gondor</li>\n            <li>Mordor</li>\n\
  \        </ul>\n    </body>\n</html>\n```\n\n使用 `$('li').slice(1)`，参数 `1` 指明了切片开始的位置，因此\
  \ `slice(1)` 将包含从 `Fangorn Forest` 到 `Mordor` 的所有元素。因此，从 0 开始计数，使用单个参数时，你的选择包含了从该元素开始及之后的所有内容。\n\
  \n当提供两个参数时，第一个参数是你想要包含在结果选择中的第一个元素的偏移位置（从 0 开始），第二个参数是你想要包含在结果选择中的最后一个元素的偏移位置（同样从\
  \ 0 开始）。这创建了一个新的选择，其元素从第一个元素开始到最后一个元素结束。因此，`slice(0, 2)` 将从元素 0 开始到元素 1 结束。它不包含\
  \ #2。因此，此选择将包含 `The Shire` 和 `Fangorn Forest`。\n\n## 添加选择\n\n最后，我向你介绍 `add()` 方法。`add()`\
  \ 方法是 `not()` 方法的反相反，用于向现有选择添加内容。以下 HTML 再次代表了中地球的地方：\n\n```html\n<!DOCTYPE HTML>\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\">\n    <head>\n        <meta http-equiv=\"\
  content-type\"\n            content=\"application/xhtml+xml; charset=utf-8\" />\n\
  \        <meta http-equiv=\"content-language\" content=\"en-us\" />\n        <title>Places\
  \ in Middle-Earth</title>\n    </head>\n    <body>\n        <ul id='middleEarthPlaces'>\n\
  \            <li>The Shire</li>\n            <li>Fangorn Forest</li>\n         \
  \   <li>Rohan</li>\n            <li>Gondor</li>\n            <li>Mordor</li>\n \
  \       </ul>\n        <ul id='middleEarthMorePlaces'>\n            <li>Osgiliath</li>\n\
  \            <li>Minas Tirith</li>\n            <li>Mirkwood Forest</li>\n     \
  \   </ul>\n    </body>\n</html>\n```\n\n`add()` 方法的一个简单演示是制作一个初始选择，例如 `$('ul#middleEarthPlaces\
  \ li')`，它选择了第一个 `<ul>` 元素中所有的 `<li>` 元素。然后你可以这样使用类名向该选择添加内容：\n\n```javascript\n\
  $('ul#middleEarthPlaces li').add('ul#middleEarthMorePlaces li');\n```\n\n\n\n\n\
  生成的集合现在包含了文档中存在的所有 `<li>` 元素，因为你首先选择了第一个 `<ul>` 元素中的 `<li>` 元素，然后向该集合添加了第二个 `<ul>`\
  \ 元素中的 `<li>` 元素。\n\n就像 `not()` 方法一样，你可以使用 jQuery 选择器的结果向集合中添加元素，如下所示：\n\n```\n\
  $('ul#middleEarthPlaces li').add($('ul#middleEarthMorePlaces li'));\n```\n\n你也可以直接使用\
  \ DOM 对象引用，如下所示：\n\n```javascript\n$('ul#middleEarthPlaces li').add(\n    document.getElementById('middleEarthMorePlaces').childNodes\n\
  );\n```\n\n你还可以使用返回 jQuery 选择器或直接的 DOM 对象引用的回调函数：\n\n```javascript\n$('ul#middleEarthPlaces\
  \ li').add(\n    function()\n    {\n        return document.getElementById('middleEarthMorePlaces').childNodes;\n\
  \    }\n);\n```\n\n`add()` 方法允许你使用这些方法中的任何一种向集合中添加元素。在第 4 章“操纵内容和属性”中，你将学习如何甚至可以使用包含\
  \ HTML 的字符串来向集合添加元素。\n\n## 总结\n\n在本章中，你看到了一些示例，让你对 jQuery 的选择和过滤能力有了全面的了解。你学习了 jQuery\
  \ 如何对从 DOM 中选择元素提供极其细粒度的控制，这种细粒度之，以至于你经常会发现有多种方法可以实现相同的结果。\n\njQuery 的选择和过滤方法远比仅用\
  \ JavaScript 提供的功能得多，在 JavaScript 中，通常需要几行代码才能对选择实现同等的控制水平。\n\njQuery 利用选择器的强大功能、易用性、熟悉度和便利性，帮助你到达\
  \ DOM 中任何你想去的地方。你会发现，选择器的语法与你所使用的 CSS 语法是相同的；jQuery 甚至支持自己的一些扩展。请参阅附录 B“jQuery 选择器”获取\
  \ jQuery 支持的选择器语法的完整列表。\n\njQuery 的过滤方法允许你使用 `find()` 方法选择后代，使用 `parents()` 方法选择祖先，以及使用\
  \ `siblings()`、`prev()`、`prevAll()`、`next()` 和 `nextAll()` 方法选择兄弟元素。你可以使用 `add()`\
  \ 方法添加元素，或使用 `not()` 方法排除元素。你还可以使用 `slice()` 和 `eq()` 方法进行更具体的选择。请参阅附录 C 获取与选择和过滤相关的方法完整列表。\n\
  \n## 练习\n\n1. 在对标记源中元素选择的细粒度控制方面，jQuery 与其他哪种客户端技术有许多共同点？\n2. 如果你想根据祖先关系使用 jQuery\
  \ 从 DOM 中选择一个元素，你会使用哪种方法？\n3. 如果你想将一个元素在 DOM 中的位置与其之前的兄弟元素交换，哪种 jQuery 方法可以帮助该应用？\n\
  4. 如果你已经选择了一个元素，并想从 DOM 中选择该元素的某个后代，jQuery 提供了哪些方法可以给你所需的结果？\n5. 如果你进行了一个选择，但后来想从该选择中移除一个或多个元素，你会使用哪种\
  \ jQuery 方法？\n6. 如果你只想从较广泛的选择中选择单个元素，你会使用哪种 jQuery 方法？\n7. 列出 jQuery 提供的所有处理兄弟元素的方法。\n\
  8. 你如何使用 jQuery 向集合中添加元素？\n\n## 第 3 章\n\n## 事件\n\njQuery 提供了一个强大且全面的事件 API。jQuery\
  \ 的事件 API 提供了封装方法，可以适应 JavaScript 中的大多数事件。jQuery 的事件 API 还提供了通过其事件方法附加它未显式支持的事件的能力。jQuery\
  \ 的事件 API 甚至能够将事件应用于可能在文档中尚不存在的元素。事件可以在 jQuery 中整齐地组织并命名，这是它在 JavaScript 提供的基础之上提供的额外功能。你的事件可以被整齐地组织到命名分类中，使得管理事件变得容易得多。命名事件还使得能够轻松地移除它们。\n\
  \n在本章中，你将学习使用 jQuery 事件 API 所需的所有知识。你学习了如何使用 jQuery 的事件封装方法，如 `click()` 或 `hover()`。你还学习了如何使用\
  \ `on()` 和 `off()` 等方法。你可以使用 `on()` 和 `off()` 方法为任何事件附加事件处理函数，无论是原生 JavaScript 事件还是你创建的自定义事件。`on()`\
  \ 和 `off()` 方法还可以将事件附加到文档中可能尚不存在的元素。此外，`on()` 和 `off()` 可以命名并组织事件，如果你需要像创建它们一样容易管理或移除事件，这非常有用。你还学习了如何通过\
  \ `trigger()` 方法以及 `on()` 和 `off()` 方法为你的应用程序创建完全自定义的事件。自定义事件可以让你的应用程序具有高度的可扩展性和活性。\n\
  \n## 各种事件封装方法\n\njQuery 事件 API 的初目标是为不同浏览器之间处理事件附加的异构方法提供一个桥梁。在不遥远的过去，曾经有微软处理事件的方式，然后是标准化的处理事件方式。由于微软在\
  \ Internet Explorer 上的工作，这不再是一个问题了，只有当你需要支持那些不支持标准附加事件方法的旧版本 Internet Explorer 时，你才需要担心。幸运的是，jQuery\
  \ 已经为你处理了浏览器差异。jQuery 1.x 分支为不支持标准方式的 Internet Explorer 版本提供遗留支持。jQuery 2.x 分支取消了对旧版本\
  \ Internet Explorer 等遗留支持，因此 2.x 分支将不再提供通用事件支持。\n\n\n\n\n```html\n<!DOCTYPE HTML>\n\
  <html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge'\
  \ />\n        <meta charset='utf-8' />\n        <title>Finder</title>\n        <script\
  \ src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 3-1.js'></script>\n        <link href='Example 3-1.css'\
  \ rel='stylesheet' />\n    </head>\n    <body><body>\n        <div id='finderFiles'>\n\
  \            <div class='finderDirectory' data-path='/Applications'>\n         \
  \       <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Applications</span>\n                </div>\n       \
  \     </div>\n            <div class='finderDirectory' data-path='/Library'>\n \
  \               <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Library</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Network'>\n              \
  \  <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Network</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Sites'>\n                <div\
  \ class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Sites</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/System'>\n               \
  \ <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>System</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Users'>\n                <div\
  \ class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Users</span>\n                </div>\n            </div>\n\
  \        </div>\n    </body>\n</html>\n```\n\n之前的 HTML 使用以下样式表 `Example 3-1.css`\
  \ 进行样式化。\n\n```css\nhtml,\nbody {\n    width: 100%;\n    height: 100%;\n}\nbody\
  \ {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    background: rgb(189,\
  \ 189, 189) url('images/Bottom.png') repeat-x bottom;\n    color: rgb(50, 50, 50);\n\
  \    margin: 0;\n    padding: 0;\n}\ndiv#finderFiles {\n    border-bottom: 1px solid\
