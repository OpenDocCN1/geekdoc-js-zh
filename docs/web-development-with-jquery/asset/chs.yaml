  \ 7px;\n}\n```\n\n最后，`Example 3-1.js` 中的 JavaScript 为你创建的文件夹添加了一些选择功能。\n\n```javascript\n\
  $(document).ready(\n    function()\n    {\n        $('div.finderDirectory, div.finderFile').click(\n\
  \            function(event)\n            {\n                $('div.finderIconSelected')\n\
