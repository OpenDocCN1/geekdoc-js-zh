  94. 图 22.2\n95. 图 22.3\n\n# 简介\n\n**JQUERY 已经成为 Web 开发领域不可或缺的**。作为一个 JavaScript\
  \ 库，jQuery 的使命非常简单：通过让许多任务变得简单得多，让 Web 开发者的生活更加轻松。jQuery 起初是一个用于修复跨浏览器不一致问题的库，旨在让\
  \ JavaScript 开发变得更容易，同时仍然提供了大量的跨浏览器归一化处理。随着浏览器的进步填补了兼容性方面的漏洞，jQuery 变得更加精简、高效，并能更好地完成提供一个让开发变得简单的\
  \ `API` 的任务。\n\n\n\n\njQuery UI 库还让你能够使用鼠标光标使任何元素可拖拽；通过点击、按住并移动鼠标，你可以将元素移动到页面上的任何任意位置。它还让创建拖放式用户界面变得简单。你可以使用\
  \ jQuery UI 创建可放置区域（droppable zones），你可以从页面的其他部分获取元素并将其放置在另一个地方，类似于你在操作系统的文件管理器中将文件夹从一个地方移动到另一个地方时的操作。你还可以创建可以通过拖放进行排序的列表，根据你放置的位置重新排列元素。你还可以创建一个用户界面，通过拖动鼠标光标来进行选择，就像你在操作系统的文件管理器中想要选择多个文件或文件夹时所做。jQuery\
  \ UI 暴露了使用鼠标调整页面元素大小的能力。你想象在计算机桌面或应用程序中可以完成的任何事情，都可以通过 jQuery UI 在 浏览器中实现。\n\njQuery\
  \ UI 还提供了一个组件，可以使用一个美观、易用的由 JavaScript 驱动的日历在字段中输入日期，该日历会在点击输入字段时弹出。\n\n你可以创建自定义的弹出对话框，它们类似于虚拟的弹出窗口，但它们不会打开独立的浏览器窗口——而是使用标记、CSS\
  \ 和 JavaScript 进行显示。\n\njQuery UI 提供的另一个组件是图形滑动条，类似于你媒体播放器的音量控制。\n\n正如 jQuery 对通用\
  \ JavaScript 编程所做的那样，jQuery UI 致力于处理冗余的图形用户界面（GUI）任务。jQuery UI 让你能够以更少的开发工作量创建专业的用户界面组件。\n\
  \n如果你对阅读有关 jQuery 的新闻、它的演变以及与 Web 开发相关的话感兴趣，你可能会对阅读 jQuery 官方博客 [`blog.jquery.com`](http://blog.jquery.com)\
  \ 或 jQuery 创始人 John Resig 的博客 [`www.ejohn.org`](http://www.ejohn.org) 感。\n\n如果你需要帮助，可以在\
  \ [`p2p.wrox.com`](http://p2p.wrox.com) 编程讨论，你可以免费加入该网站并在受监管的论坛中提问编程问题。jQuery 社区还提供了编程论坛，你可以在\
  \ [`http://docs.jquery.com/Discussion`](http://docs.jquery.com/Discussion) 了解更多信息。\n\
  \n## 本书的结构\n\n本书分为四个部分：第一部分涵盖 jQuery 库暴露的基础 API；第二部分涵盖 jQuery UI 库；第三部分涵盖了一些流行的\
  \ jQuery 插件，以及如何制作更高级的 jQuery 插件。最后，附录包含了有参考材料。\n\n## 第一部分: jQuery API\n\n*   **第\
  \ 1 章: jQuery 简介**——本章讨论了 jQuery 的来源以及为什么需要它。它包含良好的编程实践以及本书使用的特定编程规范。本章以演示如何下载你的第一个启用\
  \ jQuery 的 JavaScript 文件结束。\n*   **第 2 章: 选择与过滤**——本章介绍了 jQuery 的选择器引擎，它使用像你使用 CSS\
  \ 一样的选择器来从 DOM 中进行选择。它讨论了 jQuery 暴露的用于处理选择的方法，让你对 DOM 中处理的元素进行细粒度的控制。它将介绍允许你选择祖先元素、父元素、兄弟元素和后代元素的方法；如何从选择中删除元素，如何向选择添加元素，如何将选择缩小为特定的子集。\n\
  *   **第 3 章: 事件**——本章讨论了 jQuery 的事件封装方法、如何附加没有内置封装方法的事件处理程序、如何移除事件处理程序、如何附加持久事件处理程序、如何创建自定义事件以及如何为你的事件命名以便于引用。\n\
  *   **第 4 章: 操作内容与属性**——你将学习如何使用 jQuery 暴露的处理内容、文本、HTML 以及元素属性的方法。jQuery 提供了几乎你想要对元素执行的任何操作的方法。\n\
  *   **第 5 章: 数组和对象的迭代**——这部分关于你如何使用 jQuery 遍历元素选择或数组。与其他所有事情一样，jQuery 提供了一了一种更简单的方法，只需较少的代码即可遍历数组内容或\
  \ DOM 中的元素选择。\n*   **第 6 章: CSS**——你将学习 jQuery 暴露的用于处理 CSS 属性和声明的方法。jQuery 提供了直观且多功能的方法，让你能够各种方式操作\
  \ CSS。\n*   **第 7 章: AJAX**——详细阐述了 jQuery 暴露的从服务器发送 AJAX 请求的方法，这让你能够在不直接操作 `XMLHttpRequest`\
  \ 对象的情况下请求服务器内容，并支持处理各种格式的服务器响应。\n*   **第 8 章: 动画与缓动效果**——这涵盖了 jQuery 提供的动画元素的方法，包括通过简单的动画显示和隐藏、淡入和淡出、向上滑动和向下滑动、使用完全自定义的动画，以及你可以用于控制动画时间流的各种缓动效果。\n\
  *   **第 9 章: 插件**——如何制作你自己的 jQuery 插件。\n*   **第 10 章: 滚动条**——解释如何让容器变得可滚动，包括获取和设置滚动位置。\n\
  *   **第 11 章: HTML5 拖放**——用于在浏览器窗口内拖放放置元素的官方 W3C 拖放 API。此 API 与 Draggable 和 Droppable\
  \ jQuery UI 插件显著不同，因为它允许在完全不同的浏览器之间进行拖放。此外还介绍了 W3C 放置文件规范。\n\n## 第二部分: jQuery UI\n\
  \n*   **第 12 章: 可拖拽与可放置**——你将学习实现 Draggable 和 Droppable jQuery UI 插件以创建拖放 API，作为\
  \ 第 11 章 中引入的 HTML5 拖放 API 的替代方案。\n*   **第 13 章: 可排序**——如何通过拖放让列表可排序。\n*   **第 14\
  \ 章: 可选择**——学习 jQuery UI 库的一个部分，它允许你通过鼠标画框来完成选择，就像你在操作系统的文件管理应用程序中所的那样。\n*   **第\
  \ 15 章: 折叠面板**——查看如何制作一个外观精美的侧边栏，其面板像手风琴一样过渡。当你的鼠标悬停在元素上时，一个面板通过动画折叠，另一个面板也通过动画展开。\n\
  *   **第 16 章: 日期选择器**——你使用 jQuery 的 Datepicker 组件将标准的表单输入字段变为日期选择器。\n*   **第 17\
  \ 章: 对话框**——你使用 jQuery UI 库创建虚拟弹出窗口，它们看起来和操作起来像真实的弹出窗口，但完全包含在启动它们的同一个网页中，并使用纯标记、CSS\
  \ 和 JavaScript 构建。\n*   **第 18 章: 标签页**——jQuery UI 标签组件，允许你将一个文档分成几个标签页并在这些标签之间导航，无需加载另一个页面。\n\
  \n## 第三部分: 流行的第三方 jQuery 插件\n\n*   **第 19 章: Tablesorter**——介绍一种用于一列或多列对 HTML 表格排序的第三方\
  \ jQuery 插件。\n\n\n\n* 第 20 章: 创建交互式幻灯片——你将设置一个幻灯片插件，这是一个创建 jQuery 插件更复杂的示例，你可以对其进行扩展。\n\
  * 第 21 章: 使用 HTML5 音频和视频——涵盖 MediaElement 插件，该插件为跨越桌面和移动平台的各种流行媒体格式（如 H.264 和 MP3\
  \ 音频）提供了音频视频支持。\n* 第 22 章: 创建简单的 WYSIWYG 编辑器——讨论了 `contenteditable` 属性以及在浏览器内创建文本编辑器所需的各种组件。\n\
  \n## 第四部分 (#p04.xhtml): 附录\n\n* 附录 A—本附录包含章节练习题的答案。\n* 附录 B–U—这些附录包含了 jQuery 和 jQuery\
  \ UI 的参考材料。\n\n## 使用本书所需的条件\n\n为了使用书中的示例，你需要以下工具：\n\n* 多个用于测试网页的互联网浏览器\n* 文本编辑软件或你喜爱的\
  \ IDE\n\n为网站设计内容需要接触多种类型的受众。你的部分受众可能使用不同的操作系统，或使用与你电脑上安装的不同的浏览器。本书关注编写时最流行的浏览器：\n\
  \n* 用于 Windows 的 Microsoft Internet Explorer 10 或更高版本\n* 用于 Mac OS X 的 Safari 7\
  \ 或更高版本\n* 用于 Mac OS X、Windows 或 Linux 的 Firefox 30 或更高版本\n* 用于 Mac OS X、Windows\
  \ 或 Linux 的 Google Chrome 36 或更高版本\n\n部分或大部分示例可能可以在这些浏览器的旧版本中运行，但尚未经过测试。\n\n## 约定\n\
  \n为了帮助你从书中获得最大的收益并跟踪内容进展，你可以在书中发现许多约定。\n\n关于文中的样式：\n\n* 当我们引入新术语和重要词汇时，会使用*斜体*对其进行高亮显示。\n\
