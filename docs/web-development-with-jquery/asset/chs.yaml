  \n### 在数组中查找值\n\njQuery 的 `inArray()` 方法的工作方式与 JavaScript 的 `indexOf()` 方法完全相同。它返回项目在数组中的位置。如果存在，则返回从零开始的偏移量；如果项目不存在，该函数返回\
  \ `–1`（负一）。下面的示例，*示例 5-10* 展示了 jQuery 的 `inArray()` 方法是如何运作的：\n\n```html\n<!DOCTYPE\
