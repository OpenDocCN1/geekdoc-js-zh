  \n```\n this.http.addEventListener(\n            'load',\n            function(event)\n\
  \            {\n                // 此事件在上传完成且 \n                // 服务器端脚本 /file/upload.json\
  \ 返回 \n                // 响应时触发。\n```\n\n当上传请求完成后，通过调用 `dragAndDrop.closeProgressDialogue()`\
  \ 关闭进度对话框。\n\n```\n dragAndDrop.closeProgressDialogue();\n                // 如果服务器端脚本返回了\
  \ JSON 响应， \n                // 这就是你访问并对其进行处理的方法。\n```\n\n如果服务器端返回了 JSON 响应，可以从\
  \ `http.responseText` 属性进行读取和解析，应用程序可以对 JSON 响应中的数据做出适当响应。\n\n```\n var json = $.parseJSON(dragAndDrop.http.responseText);\n\
  \            },\n            false\n        );\n```\n\n检查 `FormData` 对象是否存在，以查看你的浏览器是否支持更新版本的拖放上传功能。`FormData`\
  \ 对象由浏览器提供，并有助于创建 HTTP 请求，该请求最终将通过互联网传输上传的文件数据。在示例中，`FormData` 对象创建了一个编码为 `multipart/form-data`\
  \ 的 POST 请求。在传统的文件上传中，你必须在 `<form` 元素的 `enctype` 属性中添加 `multipart/form-data`。`FormData`\
  \ 对象会自动为你处理好这一点。\n\n```\n if (typeof FormData !== 'undefined')\n        {\n    \
  \        var form = new FormData();\n            // 此处调用的 form 对象是浏览器提供的\n     \
  \       // 内置对象；它允许你在文件上传的\n            // 请求中指定 POST 变量。\n```\n\n你可以使用 `append()`\
  \ 方法向 `FormData` 对象添加参数。第一个添加的参数是 `path` 参数。这会在服务器端创建一个名为 `path` 的 POST 变量，并向服务器端脚本指示你想要上传文件的位置。\n\
  \n```\n form.append('path', this.path);\n```\n\n通过将 `this.files` 数组传递给 `each()`\
  \ 方法来对每个文件进行迭代。文件以 `file[]` 数组的形式传递到服务器端。PHP 使用方括号来指示创建数组。你选择的服务器端语言用于此操作的语法可能会不同。一些额外的信息通过\
  \ `name[]` 变量和 `replaceFile[]` 变量传递给服务器。你可以创建所需的任意变量。\n\n```\n $(this.files).each(\n\
  \                function(key, file)\n                {\n                    form.append('file[]',\
  \ file);\n                    form.append('name[]', file.name);\n              \
  \      form.append('replaceFile[]', 1);\n                }\n            );\n```\n\
  \n最后，包括上传文件在内的整个 POST 请求被发送到服务器端脚本。`file/upload.php` 处理文件上传。\n\n```\n          \
  \  this.http.open('POST', 'file/upload.json');\n            this.http.send(form);\n\
  ```\n\n如果你的浏览器不支持 `FormData` 对象，向 JavaScript 控制台打印消息并关闭进度对话框。\n\n```\n else\n  \
  \      {\n            console.log(\n                '此浏览器不支持 HTML 5 ' +\n      \
  \          '拖放上传。'\n            );\n            this.closeProgressDialogue();\n\
  \        }\n    },\n```\n\n### 附加工具函数\n\nJavaScript 中的其余方法作为工具函数，用于简化大小计算、字符串处理和事件应用的剩余操作。\n\
  \n`getFileSize()` 方法返回文件大小的可读表示。以字节为单位的文件大小被输入该方法，并返回代表字节、千字节（KB）、兆字节（MB）或吉字节（GB）大小的数字。该方法使用了\
  \ `Math.pow()` 方法，其中 `Math.pow(2,10)` = 1 KB，`Math.pow(2,20)` = 1 MB，而 `Math.pow(2,30)`\
  \ = 1 GB。\n\n```\n getFileSize : function(bytes)\n    {\n        switch (true)\n\
  \        {\n            case (bytes < Math.pow(2,10)):\n            {\n        \
  \        return bytes + ' Bytes';\n            }\n            case (bytes >= Math.pow(2,10)\
  \ && bytes < Math.pow(2,20)):\n            {\n                return Math.round(\n\
  \                    bytes / Math.pow(2,10)\n                ) +' KB';\n       \
  \     }\n            case (bytes >= Math.pow(2,20) && bytes < Math.pow(2,30)):\n\
  \            {\n                return Math.round(\n                    (bytes /\
  \ Math.pow(2,20)) * 10\n                ) / 10 + ' MB';\n            }\n       \
  \     case (bytes > Math.pow(2,30)):\n            {\n                return Math.round(\n\
  \                    (bytes / Math.pow(2,30)) * 100\n                ) / 100 + '\
  \ GB';\n            }\n        }\n    },\n```\n\n\n\n\n\n`applyEvents()` 方法应用了你在\
  \ `Example 11-1` 中首次实现的所有拖放事件。你通过创建一个 `context` 变量来启动该方法，该变量决定了如何应用这些事件。如果你将事件应用到从浏览器窗口外部拖放的文件或文件夹对象上，则该方法会将每个拖放事件应用到该新移动的文件或文件夹对象上。否则，每个事件将应用到存在的每一个文件和文件夹对象。\n\
  \n```\n applyEvents : function()\n    {\n        var context = null;\n        if\
  \ (arguments[0])\n        {\n            context = arguments[0];\n        }\n  \
  \      else\n        {\n            context = $('div.finderDirectory, div.finderFile');\n\
  \        }\n        context\n```\n\n`dragstart`、`dragend`、`dragenter`、`dragover`\
  \ 和 `dragleave` 事件与 `Example 11-1` 不变。`drop` 事件已经过修改，以适应拖放文件上传以及移动现有文件或文件夹。\n\n\
  ```\n .on(\n                'drop.finder',\n                function(event)\n  \
  \              {\n                    event.preventDefault();\n                \
  \    event.stopPropagation();\n                    var dataTransfer = event.originalEvent.dataTransfer;\n\
  \                    var drop = $(this);\n                    if (drop.hasClass('finderDirectory'))\n\
  \                    {\n```\n\n如果用户已拖放文件上传到浏览器窗口，则这些文件存在于 `dataTransfer.files` 属性中，且\
  \ `files` 属性的长度大于零。文件以及文件被拖放到的文件夹路径将传递给 `openProgressDialogue()` 方法进行处理和上传。\n\n\
  ```\n if (dataTransfer.files && dataTransfer.files.length)\n                   \
  \     {\n                            // Files dropped from outside the browser\n\
  \                            dragAndDrop.openProgressDialogue(\n               \
  \                 dataTransfer.files,\n                                node.data('path')\n\
  \                            );\n                        }\n                   \
  \     else \n                        {\n                            try\n      \
  \                      {\n                                var html = dataTransfer.getData('text/html');\n\
  \                            }\n                            catch (error)\n    \
  \                        {\n                                var html = dataTransfer.getData('Text');\n\
  \                            }\n                            html = $(html);\n```\n\
  \n除了拖放文件上传外，`drop` 事件监听器的工作方式与 `Example 11-1` 中相同。\n\n除了应用到每个文件和文件夹对象的拖放事件外，一组新的拖放事件也被应用到\
  \ ID 为 `finderFiles` 的 `<div>` 元素，该元素是占据几乎整个浏览器窗口的文件夹视图，包含了所有的文件和文件夹元素。该 `<div>`\
  \ 元素接收的 `dragenter`、`dragover` 和 `dragleave` 事件与已放置在类名为 `finderFile` 或 `finderDirectory`\
  \ 的 `<div>` 元素上的事件相同。这留下了略有不同的 `drop` 事件。\n\n```\n .on(\n                'drop.finder',\n\
  \                function(event)\n                {\n                    event.preventDefault();\n\
  \                    event.stopPropagation();\n                    var dataTransfer\
  \ = event.originalEvent.dataTransfer;\n                    var drop = $(this);\n\
  ```\n\n就像你处理其他 drop 事件时一样，检查 `files` 属性的 `length` 是否大于零，这让你的应用程序知道用户已将文件拖放到浏览器窗口。\n\
  \n```\n if (dataTransfer.files && dataTransfer.files.length)\n                 \
  \   {\n                        dragAndDrop.openProgressDialogue(\n             \
  \               dataTransfer.files,\n                            drop.data('path')\n\
  \                        );\n                    }\n                    else\n \
  \                   {\n                        try\n                        {\n\
  \                            var html = dataTransfer.getData('text/html');\n   \
  \                     }\n                        catch (error)\n               \
  \         {\n                            var html = dataTransfer.getData('Text');\n\
  \                        }\n                        html = $(html);\n```\n\n你还确保文件夹没有被拖放到它自身：\n\
  \n```\n if (drop.data('path') == html.data('path'))\n                        {\n\
  \                            // Prevent file from being dragged onto itself\n  \
  \                          drop.removeClass('finderDirectoryDrop');\n          \
  \                  return;\n                        }\n```\n\n你确保拖放的 HTML 具有 `finderDirectory`\
  \ 和 `finderFile` 类名：\n\n```\n if (!html.hasClass('finderDirectory finderFile'))\n\
  \                        {\n                            return;\n              \
  \          }\n```\n\n最后，通过检查本地该目录中的每个文件名，检查拖放到目录的任何文件或文件夹是否已存在于目录中。在本示例中，应用程序在检测到本地重复文件时简单地停止。另一种方法是在检测到重复文件时，询问用户是否想要替换重复文件；然后将该选择传递给服务器端，服务器也应该对现有的文件或文件夹进行验证。此外，对于拖放文件上传也应进行相同的重复文件名检查。为了保持脚本更短更直接，我删除了额外的验证。\n\
  \n```\n var fileExists = false;\n                        $('div.finderFile, div.finderDirectory').each(\n\
  \                            function()\n                            {\n       \
  \                         if ($(this).data('path') == html.data('path'))\n     \
  \                           {\n                                    fileExists =\
  \ true;\n                                    return false;\n                   \
  \             }\n                            }\n                        );\n```\n\
  \n如果文件或文件夹尚不存在，你可以在此处对拖放的 HTML 进行处理。\n\n```\n if (!fileExists)\n               \
  \         {\n                            dragAndDrop.applyEvents(html);\n      \
  \                      drop.append(html);\n                        }\n         \
  \           }\n                }\n            ); \n```\n\n## 总结\n\n在本章中，你学习了如何使用\
  \ jQuery 来利用 HTML5 拖放 API。你使用 CSS 属性 `-webkit-user-drag`、`draggable` HTML 属性以及遗留的\
  \ `dragDrop()` 方法实现了拖放 API。你还学习了如何通过为以下事件绑定监听器在 JavaScript 中实现拖放 API：`dragstart`、`drag`、`dragend`、`dragenter`、`dragover`、`drop`\
  \ 和 `dragleave`。\n\n你还学习了如何使用拖放 API 实现拖放文件上传，这包括在 `dataTransfer` 对象上查找 `files` 属性。你学习了如何使用\
  \ `FileReader` 对象预览上传图像文件的缩略图。你学习了如何通过向 `XMLHttpRequest` 对象的 `upload` 属性绑定 `progress`\
  \ 和 `load` 事件来监控上传进度。最后，你学习了如何使用 `XMLHttpRequest` 和 `FormData` 对象自定义 HTTP POST 请求并将文件上传提交到服务器端。\n\
  \n## 练习\n\n1. 描述你如何在元素上启用拖放功能。哪些方法是遗留方法？这些遗留方法是为了哪些浏览器而存在的？\n\n2. 列出用于拖动元素的事件的触发顺序。\n\
  \n3. 列出用于丢放元素的事件的触发顺序。\n\n\n\n\n4. 当你实现拖拽文件上传时，你会查找哪个属性，并使用哪个事件来检测拖拽文件上传的已发生？作为加分题，如果你不使用\
  \ jQuery，你会使用哪种属性？\n\n5. 在实现图像文件的缩略预览时，使用什么种格式来查看预览图像？\n\n6. 在创建拖拽文件上传时，哪些事件可以监控文件上传进度？你将这些事件挂载到哪个对象上？\n\
  \n7. 哪些事件属性可以计算文件上传的百分比？\n\n8. 描述你如何在为拖拽文件上传生成的 HTTP 请求中创建自定义 POST 变量。\n\n9. 你如何知道文件上传成功了？\n\
  \n# 第二部分\n\n## jQuery UI\n\n- 第 12 章：可拖拽与可放置\n- 第 13 章：可排序\n- 第 14 章：可选择\n- 第 15\
  \ 章：手风琴\n- 第 16 章：日期选择器\n- 第 17 章：对话框\n- 第 18 章：标签页\n\n## 第 12 章\n\n## 可拖拽与可放置\n\
  \n从本章开始，讨论将转向 jQuery UI 库。jQuery UI 库是一个可重用组件的集合，能够让你快速创建用户界面功能。jQuery UI 库处理各种任务，例如使文档中的元素变为可拖拽的，或者创建一个可以通过拖拽和放置来重新排列顺序的项目列表，以及你在本书后续章节中将学到的许多\
  \ UI 任务。\n\njQuery UI 库的功能存在于你在本书前面的章节一直在使用和学习的 jQuery 核心框架之外。jQuery UI 库是一系列处理这些不同\
  \ UI 任务的 jQuery 插件。秉承 jQuery API 的设计精神，该库使得某些 UI 任务的实现变得简单得多。\n\n你可以从 `http://ui.jquery.com/download`\
  \ 下载 jQuery UI 库组件。该网站允许你根据想要使用的 UI 组件来自定义下载，并提供这种自定义是为了让你尽可能少地添加 JavaScript，从而减少文件大小和带宽等开销。本书的源代码可以从\
  \ `www.wrox.com/go/webdevwithjquery` 获取，包含了整个 jQuery UI 包，其中包含所有 jQuery UI 库插件。对于测试和学习目的来说这是可以；但如果你想在真实的生产网站中使用\
  \ UI 库组件，你应该自定义 jQuery UI 库下载，仅包含你在应用程序中使用的组件，因为整个库是一个大文件，压缩后（删除所有空格、注释和换行符）为 229.56\
  \ KB，完全解压未压缩为 347.82 KB——这是一个相当大的文件下载。\n\n本章从 `Draggable and Droppable` 库开始介绍 jQuery\
  \ UI 库。这与 第 11 章“HTML5 拖放”中介绍的内容形成对比，后者展示了如何使用 HTML5 原生的拖放 API。HTML5 拖放 API 与 jQuery\
  \ UI 的 Draggable and Droppable API 之间的关键区别在于，HTML5 API 可以在多个独立的浏览器窗口之间（即使是完全不同浏览器的窗口）使用，甚至可以在不同的应用程序之间使用，前提是这些应用程序使用了如\
  \ WebKit（Apple 等）、Blink（Google 等）、Gecko（Mozilla）或 Trident（Microsoft）等浏览器组件。HTML5\
  \ 的拖放 API 还提供了通过拖放上传一个或多个文件的功能。\n\nDraggable 和 Droppable jQuery UI 库提供了类似的功能，但这种功能局限于在一个浏览器窗口内工作。它的功能不允许被拖拽的内容离开浏览器窗口的边界。你选择哪一个取决于你的项目目标对功能的要求。\n\
  \nDraggable 库让你能够使页面上的任何元素都变得可拖拽。在最基础的意义上，这意味着你可以用鼠标在文档中移动元素，并按照你喜欢的方式排列这些元素。下一节介绍了\
  \ Draggable jQuery UI API。\n\n## 使元素变为可拖拽\n\n使一个元素变为可拖拽非常简单：首先，你需要包含包含 Draggable\
  \ 插件的 UI 库；然后，在使用 jQuery 进行选择后，你只需要将 `draggable()` 方法链式调用到选择器上，如下：\n\n```\n$('div#anElementIdLikeToDrag').draggable();\n\
  ```\n\n前面的代码将 id 名为 `anElementIdLikeToDrag` 的 `div` 元素变为可拖拽元素，这意味着你可以用鼠标在文档的任何位置移动该元素。使元素变为可拖拽的能力为你的应用程序功能提供了更多选项，让你拥有许多与开发桌面应用程序时相似的选项。\n\
  \n启用拖拽操作的实际代码并不复杂，但它是 jQuery 允许你将几行代码压缩成少量代码的又一个例子。在这种情况下，这是一个简单的函数调用。\n\n为了向你展示使元素变为可拖拽有多简单，下面提供了一个示例，在其中你创建一个看起来类似于\
  \ Mac OS X Finder 的文件管理器。你从 XHTML5 基础开始，其标记如下所示（*示例 12-1*）：\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n        <meta\
  \ http-equiv='content-type'\n            content='application/xhtml+xml; charset=utf-8'\
  \ />\n        <meta http-equiv='content-language' content='en-us' />\n        <title>Finder</title>\n\
  \        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 12-1.js'></script>\n        <link href='Example 12-1.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <div id='finderFiles'>\n\
  \            <div class='finderDirectory' data-path='/Applications'>\n         \
  \       <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Applications</span>\n                </div>\n       \
  \     </div>\n            <div class='finderDirectory' data-path='/Library'>\n \
  \               <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Library</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Network'>\n              \
  \  <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Network</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Sites'>\n                <div\
  \ class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Sites</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/System'>\n               \
  \ <div class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>System</span>\n                </div>\n            </div>\n\
  \            <div class='finderDirectory' data-path='/Users'>\n                <div\
  \ class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Users</span>\n                </div>\n            </div>\n\
  \        </div>\n    </body>\n</html>\n```\n\n接下来的 CSS 为 Finder 示例设置样式：\n\n\n\n\n\
  \n```\nhtml,\nbody {\n    width: 100%;\n    height: 100%;\n}\nbody {\n    font:\
  \ 12px \"Lucida Grande\", Arial, sans-serif;\n    background: rgb(189, 189, 189)\
  \ url('images/Bottom.png') repeat-x bottom;\n    color: rgb(50, 50, 50);\n    margin:\
  \ 0;\n    padding: 0;\n}\ndiv#finderFiles {\n    border-bottom: 1px solid rgb(64,\
  \ 64, 64);\n    background: #fff;\n    position: absolute;\n    top: 0;\n    right:\
  \ 0;\n    bottom: 23px;\n    left: 0;\n    overflow: auto;\n}\ndiv.finderDirectory\
  \ {\n    float: left;\n    width: 150px;\n    height: 100px;\n    overflow: hidden;\n\
  }\ndiv.finderIcon {\n    background: url('images/Folder 48x48.png') no-repeat center;\n\
  \    background-size: 48px 48px;\n    height: 56px;\n    width: 54px;\n    margin:\
  \ 10px auto 3px auto;\n}\ndiv.finderIconSelected {\n    background-color: rgb(196,\
  \ 196, 196);\n    border-radius: 5px;\n}\ndiv.finderDirectoryName {\n    text-align:\
  \ center;\n}\nspan.finderDirectoryNameSelected {\n    background: rgb(56, 117, 215);\n\
  \    border-radius: 8px;\n    color: white;\n    padding: 1px 7px;\n}\n```\n\n上述\
  \ XHTML 和 CSS 与以下 JavaScript 结合：\n\n```\n$(document).ready(\n    function()\n  \
  \  {\n        $('div.finderDirectory')\n            .mousedown(\n              \
  \  function()\n                {\n                    $('div.finderIconSelected')\n\
  \                        .removeClass('finderIconSelected');\n                 \
  \   $('span.finderDirectoryNameSelected')\n                        .removeClass('finderDirectoryNameSelected');\n\
  \                    $(this).find('div.finderIcon')\n                        .addClass('finderIconSelected');\n\
  \                    $(this).find('div.finderDirectoryName span')\n            \
  \            .addClass('finderDirectoryNameSelected');\n                }\n    \
  \        )\n            .draggable();\n    }\n);\n```\n\n上述源代码生成了你在图 12.1 中看到的文档。\n\
  \n![image](img/c12f001.jpg)\n\n图 12.1\n\n在之前的示例中，你创建了一个类似于 Mac OS X Finder 的文件夹布局。你会在不同浏览器之间注意唯一区别是：选中文件夹上的圆角效果仅在较新的浏览器中生效，而旧版本的\
  \ IE 和 Opera 则显示为直角。\n\n基本上，这个示例的核心功能允许你一次选择一个文件夹，并将这些文件夹拖到窗口中的任何位置。\n\n为了让元素变得可拖拽，你包含了\
  \ jQuery UI 库，它包含了所有的 jQuery UI 插件，包括 Draggable 插件。\n\n```\n <script src='../jQueryUI.js'></script>\n\
  ```\n\n此示例中的标记非常直观。每个文件夹都包含在 id 为 `finderFiles` 的 `<div>` 元素中；这个容器元素用于辅助控制文件夹的显示方式。\n\
  \n```\n <div id='finderFiles'>\n```\n\n每个文件夹都位于一个类名为 `finderDirectory` 的容器 `<div>`\
  \ 元素中，目录路径包含在 `data-path` 属性中，该属性可以用于实现 AJAX 功能，即将文件夹路径异步提交到服务器，然后由服务器响应该文件夹的内容。每个文件夹都有图标和名称，因此为这些每项都准备了标记。这种特定结构背后的原理在你检查了样式表后会变得更加合理：你为图标创建了一个\
  \ `<div>` 元素，它控制图标的位置并设置了高亮样式的尺寸。然后，文件夹名称包含在另一个 `<div>` 元素中，该文件夹名称嵌套在一个 `<span>`\
  \ 元素中。使用 `<span>` 元素是为了当文件夹被高亮时，背景将应用于内联元素上，且背景会紧贴文本，即使文本占据了多行（参见图 12.1）。\n\n```\n\
  \ <div class='finderDirectory' data-path='/Applications'>\n                <div\
  \ class='finderIcon'></div>\n                <div class='finderDirectoryName'>\n\
  \                    <span>Applications</span>\n                </div>\n       \
  \     </div>\n```\n\n样式表完成了将这块原始结构化标记转换为模拟 Finder 文档的工作。下文将审查样式表中的每条规则，并解释为什么需要这些规则。`<html>`\
  \ 和 `<body>` 元素分别被赋予了 100% 的宽度和高度，以便它们都能自动占据整个视口。\n\n```\nhtml,\nbody {\n    width:\
  \ 100%;\n    height: 100%;\n}\n```\n\n在下一条规则中，你为 Finder 指定了 Lucida Grande 字体。\n\n\
  \n\n\n\n以下规则定义了选中文件夹的样式。使用 jQuery 动态将 `finderIconSelected` 类名应用到类名为 `finderIcon`\
  \ 的 `<div>` 元素。\n\n```\ndiv.finderIconSelected {\n    background-color: rgb(196,\
  \ 196, 196);\n    border-radius: 5px;\n}\n```\n\n下一个规则让文件夹名称居中。\n\n```\ndiv.finderDirectoryName\
  \ {\n    text-align: center;\n}\n```\n\n最后，最后一条规则设置了选中文件夹名称的样式。添加了蓝色背景、少量内边距、白色文字和圆角，使文件夹名称看起来更像真实的\
  \ Finder（访达）。\n\n```\nspan.finderDirectoryNameSelected {\n    background: rgb(56,\
  \ 117, 215);\n    border-radius: 8px;\n    color: white;\n    padding: 1px 7px;\n\
  }\n```\n\n正如你所意料到的，这个示例的 JavaScript 部分非常简单。你首先从使文件夹可以选择的代码开始，这是通过添加 `mousedown`\
  \ 事件来实现的。使用 `mousedown` 事件而不是 `click` 事件，是因为你希望即使户在按下鼠标按钮时将光标移动到文件夹边界之外，也能发生选择。如果用户在按下按钮时移动光标，会导致元素被拖动。因此，你希望文件夹被选中，以便向用户显示他们正在拖拽的文件夹已被选中。\n\
  \n```\n $('div.finderDirectory')\n            .mousedown(\n```\n\n在 `mousedown`\
  \ 事件内部，你编写了一些选择文件夹的逻辑。首先，你从 `div.finderIconSelect` 元素中移除 `finderIconSelected` 类名。\n\
  \n然后你重复选择操作；从 `span.finderDirectoryNameSelected` 元素中移除 `finderDirectoryNameSelected`\
  \ 类名。\n\n这一系列动作在进行新选择时会清除任何之前的选择。\n\n现在，将你移除的类名添加到选中的 `div.finderIcon` 和 `span`\
  \ 元素上。\n\n```\n function()\n                {\n                    $('div.finderIconSelected')\n\
  \                        .removeClass('finderIconSelected');\n                 \
  \   $('span.finderDirectoryNameSelected')\n                        .removeClass('finderDirectoryNameSelected');\n\
  \                    $(this).find('div.finderIcon')\n                        .addClass('finderIconSelected');\n\
  \                    $(this).find('div.finderDirectory span')\n                \
  \        .addClass('finderDirectoryNameSelected');\n                }\n```\n\n最后，通过在调用\
  \ `mousedown()` 时链调用 `draggable()` 方法，让每个文件夹变得可拖拽。\n\n```\n .draggable();\n```\n\
  \njQuery UI 的 `draggable()` 方法允许你将文档中的文件夹移动到你喜欢的任何位置，类似于 Mac OS X Finder 的默认工作方式，让你能够随心意欲安排文件夹。但\
  \ jQuery UI 的 `draggable()` 方法允许你做更多。在下一节中，你将学习如何实现虚影效果（ghosting）以及如何将 Droppable\
  \ API 引入其中。\n\n## 为可拖拽元素指定放置区域\n\n通常当你在文档元素上实现拖拽功能时，你希望为被拖动的元素指定一个放置的地方。jQuery UI\
  \ 提供了另一个处理放置部分的插件；它被称为 Droppable。jQuery UI Droppable 插件允许你创建和处理与将一个元素放置在另一个元素上的各种操作，包括当拖拽一个元素经过放置区域时发生什么，以及发生放置时发生什么。jQuery\
  \ 允许你对拖放进行精确控制，这让你能够创建一个基础的拖放实现或一个精细的拖放实现。\n\n正如你已经在 Draggable API 中看到的那样，jQuery\
  \ UI 为处理放置端提供了一个简洁、易用的 API。要使一个元素变成可放置元素，你只需要进行选择并带有适当的选项调用 `droppable()` 方法，就像你使用\
  \ `draggable()` 方法时一样。选项通过由键值对组成的字面量对象提供。以下示例展示了在整个本章节中构建的 Finder 克隆项目背景下，放置实现应该是样子的：\n\
  \n```\n$('div.finderDirectory')\n    .draggable({\n        helper: 'clone',\n  \
  \      opacity: 0.5\n    })\n    .droppable({\n        accept: 'div.finderDirectory',\n\
  \        hoverClass: 'finderDirectoryDrop'\n    });\n```\n\n在前面的代码中，你有一个 Droppable\
  \ API 的基础实现示例。每个类名为 `finderDirectory` 的 `<div>` 元素都变成了一个放置区域，以便任何目录都可以拖拽放置到任何其他目录上。为了让放置部分正常运行，你向\
  \ `droppable()` 方法传递了一些选项。`accept` 选项允许你指定一个选择器，用于匹配你想要允许放置在放置区域上的元素。在这种情况下，你只想允许类名为\
  \ `finderDirectory` 的 `<div>` 元素被放置。使用此过滤器，你可以在同一份文档中添加其他拖放功能，而不会在不同的拖放实现之间产生冲突。\n\
  \n`hoverClass` 选项允许当可拖拽元素经过可放置元素时，更改放置区域的样式。你只需要指定一个类名作为值，然后在样式表中设置相应的样式即可。\n\n\
