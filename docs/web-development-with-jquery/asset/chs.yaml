  当 `appendFile.finder` 事件被触发时，你可以通过向第二个参数传递一个对象字面量来向事件传递传递数据。这些数据随后将作为第二个参数传回给事件处理程序。第二个参数的内容和\
  \ `this` 会被打印到 JavaScript 控制台，这样你就可以观察到自定义事件的工作方式与原生事件类似，并且允许将自定义数据传回给处理程序。\n\n\
  ## 总结\n\njQuery 事件是使用 JavaScript 事件的一种灵活且简单的方法。jQuery 的 API 既提供了常用 JavaScript 事件的封装方法，又在\
  \ `on()`、`off()` 和 `trigger()` 方法中提供了更详细的 API。\n\n如果你想使用 jQuery 未提供封装方法的浏览器事件，你必须使用\
  \ `on()`、`off()` 或 `trigger()` 来使用其中任一事件，例如 HTML5 拖放 API（这在第 11 章“HTML5 拖放”中讨论过）。\n\
  \n如果你向 `on()` 方法提供一个选择器，就可以创建持久或存活的事件处理程序。这使得为不存在的元素应用事件处理程序变得可能。它还可以极大减少应用程序内应用的事件处理程序数量，因为通过存活或持久事件，事件可以仅应用于\
  \ DOM 树中更靠上的单个元素。\n\n通过在事件名称后添加点和名称，可以对事件处理程序进行命名空间划分。你可以可以给事件赋予多个名称，这与 CSS 选择器中类名的工作方式类似。\n\
  \n事件处理程序可以根据需要进行绝对控制、添加和移除。`off()` 方法提供了移除事件的机制。移除事件需要调用带有事件名称或事件命名空间（或两者）的 `off()`\
  \ 方法。\n\n调用不带参数的事件封装方法（例如调用 `click()` 以及调用 `trigger()`）可以触发事件处理程序。\n\n可以使用标准的 jQuery\
  \ 事件 API 创建和使用自定义事件。`on()`、`off()` 和 `trigger()` 方法都可以创建自定义事件。你在本章中还看到了一些可能应用到文件管理器应用程序的自定义事件示例。\n\
