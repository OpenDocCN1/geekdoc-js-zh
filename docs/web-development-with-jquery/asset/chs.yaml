  \n# 录 E\n\n## 操作内容、属性和自定义数据\n\n### 属性\n\n| Method/Property | Description | Return\
  \ Value |\n| :--- | :--- | :--- |\n| `attr(name)` | 返回选择中第一个元素的指定属性的属性。如果元素不存在，该方法返回\
  \ `undefined`。 | String |\n| `attr(object)` | 通过指定的键值对来设置属性。例如：`attr({id: 'idName',\
  \ href: '/example.html', title: 'Tooltip text.'});` | jQuery |\n| `attr(key, function)`\
  \ | 根据回调函数的返回值设置属性值。回调函数在每个选定元素的上下文中执行。 | jQuery |\n| `removeAttr(name)` | 从元素移除指定的属性。\
  \ | jQuery |\n\n### 类名\n\n| Method/Property | Description | Return Value |\n| :---\
  \ | :--- | :--- |\n| `addClass(className)` | 为每个选定元素添加指定的类名。元素可以拥有多个类。 | jQuery\
  \ |\n| `addClass(function())` | 通过回调函数添加多个用空格分隔的类名。 | jQuery |\n| `hasClass(className)`\
  \ | 如果选定元素中存在指定的类名，则返回 `true`。 | Boolean |\n| `removeClass(className)` | 从每个选定元素移除指定的类名。如果提供了多个类名，每个之间用空格分隔。\
  \ | jQuery |\n| `removeClass(function())` | 通过执行回调函数来确定要移除的类，并从每个选定元素移除。函数应返回一个或多个要删除的类名。如果删除了多个类名，它们应该用空格分隔。\
  \ | jQuery |\n| `toggleClass(className, switch)` | 如果指定的类名不存在，则添加；如果存在则移除。如果提供了\
  \ `switch` 参数，它会明确告诉 `toggleClass()` 应该添加还是移除该类名。`true` 添加，`false` 移除。 | jQuery\
  \ |\n| `toggleClass(switch)` | `switch` 参数告诉 `toggleClass()` 应该添加还是移除该类名。`true`\
  \ 添加，`false` 移除。 | jQuery |\n| `toggleClass(function(), switch)` | 如果提供了函数，它将返回一个或多个用空格分隔的待切换的类名。如果提供了\
  \ `switch` 参数，它会明确告诉 `toggleClass()` 应该添加还是移除该类名。`true` 添加，`false` 移除。 | jQuery\
  \ |\n\n### HTML\n\n| Method/Property | Description | Return Value |\n| :--- | :---\
  \ | :--- |\n| `html()` | 返回选择中第一个元素的 HTML 内容，或 `innerHTML`。此方法不适用于 XML 文档，但在 XHTML\
  \ 文档中有效。 | String |\n| `html(htmlString)` | 设置每个选定元素的 HTML 内容。 | jQuery |\n\n\n\n\
  \n\n| `html(function())` | 如果提供了函数，它将返回用于为每个选中元素设置的 HTML 内容。与大多数 jQuery 回调函数一样，`this`\
  \ 指向回调函数中的当前元素，并且回调函数会提供参数列表：`offset, oldHTML` | jQuery |\n| **文本 (Text)** | | |\
  \ |\n| `text()` | 返回每个选中元素的文本内容。 | String |\n| `text(value)` | 设置每个选中元素的文本内容。HTML\
  \ 源代码不会被渲染。 | jQuery |\n| `text(function())` | 如果提供了函数，它将返回用于为每个选中元素设置的文本内容。与大多数\
  \ jQuery 回调函数一样，`this` 指向回调函数中的当前元素，并且回调函数会提供参数列表：`offset, oldText` | jQuery |\n\
  | **值 (Value)** | | | |\n| `val()` | 返回选择器第一个元素的 `value` 属性的内容。对于具有 `multiple=\"\
  multiple\"` 属性的 `<select>` 元素将返回选中值的数组。 | String, Number, Array |\n| `val(value)`\
  \ | 当提供单个值时，此方法将设置每个选中元素的 `value` 属性的内容。 | jQuery |\n| `val(valuesArray)` | 当提供多个值时，此方法将检查或选中与值集匹配的单选框、复选框或选项。\
  \ | jQuery |\n| `val(function())` | 如果提供了函数，它将返回用于设置每个选中元素的值的内容。与大多数 jQuery 回调函数一样，`this`\
  \ 指向回调函数中的当前元素，并且回调函数会提供参数列表：`offset, oldValue` | jQuery |\n| **自定义数据属性 (Custom\
  \ Data Attributes)** | | | |\n| `data()` | 将设置在所选元素上的所有自定义数据属性作为一个简单对象返回。 | Object\
  \ |\n| `data(object)` | 在所有选中元素上设置自定义数据，其中键部分用于命名数据，对应的值设置该属性的值。 | jQuery |\n| `data(key)`\
  \ | 返回所选元素中通过指定名称存储元素的数据。 | Mixed |\n| `data(key, value)` | 为每个选中元素存储指定名称和值的数据。\
  \ | jQuery |\n| `$.data(element, key, value)` | 通过指定的 DOM 元素对象引用，将指定名称的数据与指定值关联。\
  \ | Object |\n| `removeData([name])` | 从所选元素中移除指定名称的数据。如果未指定名称，则移除所有数据。 | jQuery\
  \ |\n| `removeData([list])` | 通过指定要移除的数据名称数组或用空格分隔的数据名称列表来移除数据。如果未提供列表，则移除所有数据。\
  \ | jQuery |\n| `$.removeData(element[, name])` | 根据指定的名称从指定的 DOM 元素对象引用移除数据。 |\
