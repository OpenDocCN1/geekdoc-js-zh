  \                    );\n                }\n                else\n             \
  \   {\n                    $(this).next().toggle();\n                    if ($(this).attr('src').indexOf('down')\
  \ != -1)\n                    {\n                        arrow = 'tree/right.png';\n\
  \                    }\n                    $(this).attr('src', arrow);\n      \
  \          }\n            }\n        );\n    }\n);\n```\n\n这种修改看起来就像你在发送 AJAX 请求时在图\
  \ 7.6 中所示。因为你是从自己的本地计算机请求文件，活动指示器几乎会瞬间显示并隐藏。因此，这种技术显然更适用于从可能存在延迟的远程服务器请求内容。\n\n\n\
  \n\n在 JavaScript 中，你通过调用 `$.ajaxSetup()` 来定义名为 `beforeSend`、`success` 和 `error`\
  \ 的事件。这些事件中的每一个都定义在一个 JavaScript 对象字面量内部，该对象被传递给 `$.ajaxSetup()` 方法。通过向 `beforeSend`\
  \ 属性附加一个回调函数，你是在告诉 jQuery 在每次 AJAX 请求之前执行指定的函数。在这种情况下，你通过调用 jQuery 的 `show()` 方法显示活动指示器。然后，在请求成功完成后，你通过向\
  \ `success` 和 `error` 事件附加一个回调函数来隐藏活动指示器，而这些函数反过来会在请求成功或失败时执行。（另一种方法是附加到 AJAX 的\
  \ `complete` 事件上，该事件在请求完成时（无论成功或失败）都会执行。）这些仅仅是你可以使用该方法全局为 jQuery 定义 AJAX 默认设置的属性之一。在这里可以指定的所有选项已在\
  \ 附录 G 中进行了详细说明。\n\n当然，你并不局限于这种对 jQuery AJAX 事件的使用方式。jQuery 的 AJAX 事件还可以修改将会在请求中使用的\
  \ HTTP 请求头，或者使用 jQuery 的 AJAX API 进行其他低级操作。\n\n### 使用 AJAX 事件方法\n\n上一个示例使用 `$.ajaxSetup()`\
  \ 方法全局定义了事件。在接下来的示例 *示例 7-7* 中，我将演示如何使用单个 jQuery AJAX 事件方法来实现相同的功能。仅对上一个示例 *示例 7-6*\
  \ 的脚本脚本进行了修改：\n\n```\n$(document).ready(\n    function()\n    {\n        $(document)\n\
  \            .ajaxSend(\n                function(event, request, options)\n   \
  \             {\n                    if (decodeURI(options.url).indexOf('Example\
  \ 7-7') != -1)\n                    {\n                        $('div#folderActivity').show();\n\
  \                    }\n                }\n            )\n            .ajaxSuccess(\n\
  \                function(response, status, request)\n                {\n      \
  \              if (decodeURI(options.url).indexOf('Example 7-7') != -1)\n      \
  \              {\n                        $('div#folderActivity').hide();\n    \
  \                }\n                }\n            )\n            .ajaxError(\n\
  \                function(request, status, error)\n                {\n         \
  \           if (decodeURI(options.url).indexOf('Example 7-7') != -1)\n         \
  \           {\n                        $('div#folderActivity').hide();\n       \
  \             }\n                }\n            );\n        $('img.folderTreeHasChildren').click(\n\
  \            function()\n            {\n                var arrow = 'tree/down.png';\n\
  \                if (!$(this).next().children('ul').length)\n                {\n\
  \                    $(this).next()\n                        .load(\n          \
  \                  'Example%207-7/' +\n                                $(this)\n\
  \                                    .prev()\n                                 \
  \   .data('id') + '.html',\n                            function()\n           \
  \                 {\n                                $(this)\n                 \
  \                   .show()\n                                    .prev()\n     \
  \                               .attr('src', arrow);\n                         \
  \   }\n                        );\n                }\n                else\n   \
  \             {\n                    $(this).next().toggle();\n                \
  \    if ($(this).attr('src').indexOf('down') != -1)\n                    {\n   \
  \                     arrow = 'tree/right.png';\n                    }\n       \
  \             $(this).attr('src', arrow);\n                }\n            }\n  \
  \      );\n    }\n);\n```\n\n上述修改带给你你与 *示例 7-6* 相同的结果，只是这一次显示和隐藏活动指示器的函数是通过使用 jQuery\
  \ 的 AJAX 事件方法附加的，而不是使用 `$.ajaxSetup()` 方法。这个示例更进了一，查看了 `options.url` 属性，通过调用 `decodeURI()`\
  \ 解析 URI 编码字符，然后根据 AJAX 请求的 URI 限制活动指示器的应用。设置方法与 *示例 7-6* 类似；除此之外，你将 `beforeSend`\
  \ 属性的回调函数移动到了 `ajaxSend()` 方法调用内部，将 `success` 属性的回调函数移动到了 `ajaxSuccess()` 方法调用内部，最后将\
  \ `error` 属性的调用移动到了 `ajaxError()` 方法调用内部。当然，这些方法像 jQuery 其他大多数方法一样可以链式调用，但这些方法必须应用于\
  \ `document` 对象，而不能附加到任意 HTML 元素对象上。\n\n### 为单个请求附加 AJAX 事件\n\n你附加事件的最后方法是通过调用 jQuery\
  \ 更底层的 `ajax()` 方法。`ajax()` 方法在 jQuery 内部使用，用于为 jQuery 其他 AJAX 请求方法（如 `$.get()`、`$getJSON()`、`$.post()`\
  \ 等）构建 AJAX 请求。jQuery 的 `$.ajax()` 方法让你能够根据需要设置尽可能多的低级 AJAX 请求选项。*示例 7-8* 展示了如何使用\
  \ `$.ajax()` 来模拟与前两个示例相同的结果：\n\n```\n$(document).ready(\n    function()\n    {\n\
  \        $('img.folderTreeHasChildren').click(\n            function()\n       \
  \     {\n                var arrow = 'tree/down.png';\n                if (!$(this).next().children('ul').length)\n\
  \                {\n                    var tree = $(this);\n                  \
  \  var file = (\n                        $(this)\n                            .prev()\n\
  \                            .data('id') + '.html'\n                    );\n   \
  \                 $.ajax({\n                        beforeSend : function(event,\
  \ request, options)\n                        {\n                            $('div#folderActivity').show();\n\
  \                        },\n                        success : function(response,\
  \ status, request)\n                        {\n                            $('div#folderActivity').hide();\n\
  \                            tree.attr('src', arrow)\n                         \
  \       .next()\n                                .html(response)\n             \
  \                   .show();\n                        },\n                     \
  \   error : function(request, status, error)\n                        {\n      \
  \                      $('div#folderActivity').hide();\n                       \
  \ },\n                        url : 'Example%207-8/' + file,\n                 \
  \       dataType : 'html'\n                    });\n                }\n        \
  \        else\n                {\n                    $(this).next().toggle();\n\
  \                    if ($(this).attr('src').indexOf('down') != -1)\n          \
  \          {\n                        arrow = 'tree/right.png';\n              \
  \      }\n                    $(this).attr('src', arrow);\n                }\n \
  \           }\n        );\n    }\n); \n```\n\n上述示例在功能上与你在本节中看到的最后两个示例完全相同。与那些其他示例一样，你每次通过\
  \ AJAX 请求都请求文件夹的内容，并在 AJAX 请求执行期间显示活动指示器，在请求完成后隐藏它。由于 `$.ajax()` 方法是通过直接调用该 jQuery\
  \ 对象的方法来工作的，因此你必须改变使用 `load()` 方法的方法。首先，因为你想加载 HTML，你需要记住要把这些 HTML 加载到哪个元素中。\n\n\
  ```\n var tree = $(this);\n```\n\n\n\n\n`$(this)` 被赋值给一个名为 `tree` 的变量，这样你就可以在赋值给\
  \ `$.ajax()` 方法各种选项的回调函数内部引用变量 `tree`。如果你还记得 `示例 7-4`，`this` 指向包含出现在每个文件夹旁箭头的 `<<img>>`\
  \ 元素。`$.ajax()` 方法接受以对象字面量形式定义的各种选项，这些选项在附录 G 中有记录。你再次定义了 `beforeSend`、`success`\
  \ 和 `error` 选项，它们包含了显示和隐藏活动状态指示器的函数，但这次是在你正在发起的 AJAX 请求的上下文中定义的，而不是在全局范围内。\n\n如果你的请求成功了，其余代码将按照\
  \ `示例 7-4` 中的代码继续执行。`<<img>>` 元素包含在变量 `tree` 中。`<<img>>` 元素的 `src` 被更改为 `'tree/down.png'`。`success`\
  \ 方法中的 `response` 变量包含了包含子文件夹的 HTML 文本内容。如果这是一个 XML 请求，你将处理一个 XML 对象；如果是 JSON，你将处理一个\
  \ JSON 对象。HTML 片段被加载到 `<<img>>` 元素之后的下一个相邻 `<div>` 元素中；然后使用 `show()` 方法使该 `<div>`\
  \ 元素变为可见。\n\n```\n success : function(response, status, request)\n             \
  \           {\n                            $('div#folderActivity').hide();\n   \
  \                         tree.attr('src', arrow)\n                            \
  \    .next()\n                                .html(response)\n                \
  \                .show();\n                        },\n```\n\njQuery 的 `$.ajax()`\
  \ 方法允许大量的请求自定义，当其他 AJAX 方法无法无法提供你所需的选项时，就应该使用它。\n\n### 发送 REST 请求\n\n我展示的使用 `$.ajax()`\
  \ 方法的最后一个示例是如何创建并发送 REST 请求。使用 jQuery 发送 REST 请求是非常直接的；你必须配置 `type`、`contentType`、`dataType`\
  \ 和 `data` 属性来设置 REST 调用。否则，你的服务器也必须正确配置以接收对 REST 服务的调用。这包括在你的服务器上设置 `Access-Control-Allow-Methods`\
  \ HTTP 头部，这将允许除 GET 和 POST 以外的 HTTP 方法。正确设置和配置 Web 服务器以提供 REST 服务超出了本书的范围。不过，你可以利用\
  \ jQuery 的 `$.ajax()` 方法来检查此类请求在客户端所需的的内容。这在下面的文档 `示例 7-9` 中得到了：\n\n```html\n<!DOCTYPE\
