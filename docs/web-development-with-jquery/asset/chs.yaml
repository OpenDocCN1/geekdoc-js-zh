  \n## 第 19 章\n\n Tablesorter\n\nTablesorter 插件是一个可以在 [`http://www.tablesorter.com`](http://www.tablesorter.com)\
  \ 获取的流行第三方 jQuery 插件。该插件的功能顾如其名；插件可以附加到你喜欢的任何 `<table>` 元素上，然后可以一次对该表格的一列或多列进行排序。例如，你可以仅按名称排序，先按名称再按年龄排序，或者按名称、年龄再按日期排序。排序多少列完全由你决定。\n\
  \n$.tablesorter()` 插件允许进行一些配置和自定义；本章中未明确涵盖的内容，在 Tablesorter 网站 [`http://www.tablesorter.com`](http://www.tablesorter.com)\
  \ 以及附录 T“Tablesorter”中均有记录。\n\n## 排序表格\n\n$.tablesorter()` 插件非常直观。它在文档中直接插入即可用且运行良好；只需调用插件的方法并进行样式设置，你就能很快开始对表格排序。\n\
