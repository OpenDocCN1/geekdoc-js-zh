  \ \n                           value='Zeppo' />\n                    <label for='documentAttributeZeppoMarx'>\n\
  \                        Zeppo\n                    </label>\n                </li>\n\
  \            </ul>\n            <p>\n                <button id='documentSetAttribute'>\n\
  \                    Set Attribute\n                </button>\n                <button\
  \ id='documentRetrieveAttribute'>\n                    Retrieve Attribute\n    \
  \            </button>\n                <button id='documentRemoveAttribute'>\n\
  \                    Remove Attribute\n                </button>\n            </p>\n\
  \        </form>\n    </body>\n</html>\n```\n\n以下样式表链接到前面的文档：\n\n```css\n body {\n\
  \    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50, 50, 50);\n\
  \    margin: 0;\n    padding: 15px;\n}\nbody#documentAttributes ul {\n    list-style:\
  \ none;\n    margin: 0;\n    padding: 0;\n}\nbody#documentAttributes ul li.disabled\
  \ label {\n    opacity: 0.5;\n}\n```\n\n以下 JavaScript 同样链接到前面的文档：\n\n```javascript\n\
  \ $(document).ready(\n    function()\n    {\n        var getCheckbox = function()\n\
  \        {\n            var input = $('input[name=\"documentAttributeMarx\"]:checked');\n\
  \            if (input && input.length)\n            {\n                return input;\n\
  \            }\n            $('input[name=\"documentAttributeMarx\"]:first\")\n\
  \                .attr('checked', true);\n            return getCheckbox();\n  \
  \      };\n\n        $('button#documentSetAttribute').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n\n                var input\
  \ = getCheckbox();\n                input\n                    .attr('disabled',\
  \ true)\n                    .parent('li')\n                    .addClass('disabled');\n\
  \            }\n        );\n\n        $('button#documentRetrieveAttribute').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                var input = getCheckbox();\n                alert('Disabled: '\
  \ + input.attr('disabled'));\n            }\n        );\n\n        $('button#documentRemoveAttribute').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                var input = getCheckbox();\n                input\n          \
  \          .removeAttr('disabled')\n                    .parent('li')\n        \
  \            .removeClass('disabled');\n            }\n        );\n    }\n);\n```\n\
  \n前面的示例演示了你如何使用 jQuery 的 `attr()` 和 `removeAttr()` 方法在选定的 radio `<input>` 元素上设置\
  \ `disabled` 属性。点击 Set Attribute 按钮后，前面的示例会产生类似于 图 4.1 所示的内容。\n\n![image](img/c04f001.jpg)\n\
  \n图 4.1\n\n在 JavaScript 源代码中，你第一的事情是设置一个可重用的方法来获取正确的复选框元素。该方法命名得非常恰当：`getCheckbox()`。\n\
  \n```javascript\n var getCheckbox = function()\n        {\n            var input\
  \ = $('input[name=\"documentAttributeMarx\"]:checked');\n            if (input &&\
  \ input.length)\n            {\n                return input;\n            }\n \
  \           return $('input[name=\"documentAttributeMarx\"]:first')\n          \
  \      .attr('checked', true);\n        };\n```\n\n首先，你使用选择器找到正确的复选框组，这是通过属性选择器\
  \ `input[name=\"documentAttributeMarx\"]` 完成的，然后使用 jQuery 的 `:checked` 伪类进一步缩小范围。属性选择器选择了所有四个\
  \ radio `<input>` 元素，然后选择范围立即缩小到仅包含带有 `checked=\"checked\"` 属性的元素。该函数通过 `input &&\
  \ input.length` 确保找到了元素；如果存在 `<input>` 元素，则返回。如果没有，则再次选择复选框集合，这次使用 `:first` 伪类缩小到第一个项目。通过\
  \ `attr('checked', true)` 显式地将第一个项目选中。如果你喜欢，也可以使用 `attr('checked', 'checked')`；两种方法的结果都是复选框被选中。\n\
  \n接下来的代码块处理点击 Set Attribute 按钮时发生的情况：\n\n```javascript\n $('button#documentSetAttribute').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                var input = getCheckbox();\n                input\n          \
  \          .attr('disabled', true)\n                    .parent('li')\n        \
  \            .addClass('disabled');\n            }\n        );\n```\n\nSet Attribute\
  \ 按钮通过 `disabled=\"disabled\"` 属性禁用选定的单选框，然后为其父 `<li>` 元素添加 `disabled` 类名。为父 `<li>`\
  \ 元素添加类名可以操作 `<label>` 的透明度，从而进一步提供项目被禁用的视觉反馈。\n\n第二个按钮 Retrieve Attribute 获取了 `disabled`\
  \ 属性的当前值。因为这是一个布尔属性，其可能值为 `\"disabled\"` 或 `undefined`。图 4.2 显示了应用了 `disabled` 属性后的获取情况。\n\
  \n获取属性仅需在选择结果上调用 `attr('disabled')`。\n\n```javascript\n $('button#documentRetrieveAttribute').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                var input = getCheckbox();\n                alert('Disabled: '\
  \ + input.attr('disabled'));\n            }\n        );\n```\n\n第三个代码块使用 `removeAttr()`\
  \ 方法移除禁用属性。\n\n\n\n\n\n```javascript\n $('button#documentRemoveAttribute').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                var input = getCheckbox();\n                input\n          \
  \          .removeAttr('disabled')\n                    .parent('li')\n        \
  \            .removeClass('disabled');\n            }\n        );\n```\n\n`removeAttr('disabled')`\
  \ 方法会完全从 DOM 中移除 `disabled` 属性。在处理布尔 HTML 属性时，jQuery 还允许使用 `attr()` 方法设置布尔值，因此 `attr('disabled',\
  \ false)` 的功能与 `removeAttr('disabled')` 相同。在移除禁用属性后，你可以在图 4.3 中看到结果。\n\n![image](img/c04f003.jpg)\n\
  \n图 4.3\n\n当你在使用完 `removeAttr('disabled')` 或 `attr('disabled', false)` 后尝试获取 `disabled`\
  \ 属性的值时，你将得到 `undefined` 结果，如图图 4.4 所示。\n\n![image](img/c04f004.jpg)\n\n图 4.4\n\n\
  ## 设置多个属性\n\n设置多个属性是通过向 `attr()` 方法提供 JavaScript 对象字面量来实现的，如下例所示：\n\n```javascript\n\
  \ var input = $('<input/>').attr({\n            type : 'radio', \n            name\
  \ : 'documentAttributeMarx',\n            id : 'documentAttributeGrouchoMarx',\n\
  \            value : 'Groucho'\n        });\n```\n\n上述示例使用 jQuery 创建了一个新的 `<input>`\
  \ 元素，其与 HTML 中的此内容相同：\n\n```html\n <input type='radio' \n                      \
  \     name='documentAttributeMarx'\n                           id='documentAttributeGrouchoMarx'\n\
  \                           value='Groucho' />\n```\n\n传递类似 `'<input/>'` 的字符串会告诉\
  \ jQuery 通过解析你传递的 HTML 片段来创建一个新元素。在这个示例中，你创建了一个单一的新元素，然后可以使用 jQuery 的各种 API 方法对其进行操作：你调用\
  \ `attr()` 方法并传递一个包含 `type`、`name`、`id` 和 `value` 属性及其对应值的对象。\n\n赋值给变量 `input` 的结果元素可以通过其他\
  \ API 方法进一步操作，或者使用在本章稍后学习的各种方法（如 `html()`、`prepend()`、`append()` 等）插入文档中。\n\n##\
  \ 操作类名\n\n在前面的章节中，你已经见过 jQuery 用于操作类名的 `addClass()`、`hasClass()`、`removeClass()`\
  \ 和 `toggleClass()` 方法的示例。\n\n在客户端 Web 开发中，最佳实践是避免在 JavaScript 代码中直接编写样式声明，而是通过将样式放在\
  \ CSS 中，并在需要动态更改样式的情况下操作元素的类名，来维护行为与呈现的分离。这被视为最佳实践是有原因的：它保持了结构的整洁和一目了然；你不需要在 JavaScript\
  \ 或 HTML 中搜索样式更改，只需要在样式表中查找即可。由于所有的呈现内容都整齐地包含在 CSS 中，行为在 JavaScript 中，而结构在 HTML\
  \ 中，你的文档变得更容易管理，因为知道去哪里进行修改更具预测性。如果你的样式散布在 HTML、JavaScript 和样式表中，那么更改文档的呈现将变得困难一个数量级，因为现在你必须追踪哪个文档包含了该更改。对于小型网页来说这没什么问题，但当你扩展到大型网站或应用程序时，这些规范就会发挥作用了。\n\
  \n下面的示例演示了 jQuery 提供的操作和检查一个或多个类名的四个方法。该示例出现在 [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 的源码下载材料中的示例 4-2。\n\n```html\n<!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n \
  \       <meta http-equiv='X-UA-Compatible' content='IE=Edge' />\n        <meta charset='utf-8'\
  \ />\n        <title>John Lennon Albums</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 4-2.js'></script>\n\
  \        <link href='Example 4-2.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <form action='javascript:void(0);' method='get'>\n            <h4>John\
  \ Lennon Albums</h4>\n            <table>\n                <thead>\n           \
  \         <tr>\n                        <th>Title</th>\n                       \
  \ <th>Year</th>        \n                    </tr>\n                </thead>\n \
  \               <tbody>\n                    <tr>\n                        <td>John\
  \ Lennon/Plastic Ono Band</td>\n                        <td>1970</td>\n        \
  \            </tr>\n                    <tr>\n                        <td>Imagine</td>\n\
  \                        <td>1971</td>\n                    </tr>\n            \
  \        <tr>\n                        <td>Some Time in New York City</td>\n   \
  \                     <td>1972</td>\n                    </tr>\n               \
  \     <tr>\n                        <td>Mind Games</td>\n                      \
  \  <td>1973</td>\n                    </tr>\n                    <tr>\n        \
  \                <td>Walls and Bridges</td>\n                        <td>1974</td>\n\
  \                    </tr>\n                    <tr>\n                        <td>Rock\
  \ 'n Roll</td>\n                        <td>1975</td>\n                    </tr>\n\
  \                    <tr>\n                        <td>Double Fantasy</td>\n   \
  \                     <td>1980</td>\n                    </tr>\n               \
  \ </tbody>\n            </table>\n            <p>\n                <button id='documentAddClass'>Add\
  \ Class</button>\n                <button id='documentHasClass'>Has Class</button>\n\
  \                <button id='documentRemoveClass'>Remove Class</button>\n      \
  \          <button id='documentToggleClass'>Toggle Class</button>\n            </p>\n\
  \        </form>\n    </body>\n</html>\n```\n\n上述 HTML 使用以下样式表样式：\n\n```css\nbody\
  \ {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50, 50,\
  \ 50);\n    margin: 0;\n    padding: 15px;\n}\ntable.johnLennonAlbums {\n    table-layout:\
  \ fixed;\n    width: 500px;\n    border: 1px solid black;\n    border-collapse:\
  \ collapse;\n}\ntable.johnLennonAlbums th,\ntable.johnLennonAlbums td {\n    padding:\
  \ 3px;\n    border: 1px solid black;\n}\ntable.johnLennonAlbums th {\n    text-align:\
  \ left;\n    background: lightgreen;\n}\ntable.johnLennonAlbums tbody tr:hover {\n\
  \    background: lightblue;\n}\n```\n\n用于处理类名的各种 jQuery 方法在以下脚本中演示：\n\n\n\n\n```javascript\n\
  \ $(document).ready(\n    function()\n    {        \n        $('button#documentAddClass').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                $('table').addClass('johnLennonAlbums');\n            }\n    \
  \    );\n        $('button#documentHasClass').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                if ($('table').hasClass('johnLennonAlbums'))\n\
  \                {\n                    alert('The <table> has the class johnLennonAlbums');\n\
  \                }\n                else\n                {\n                  \
  \  alert('The <table> does not have the class johnLennonAlbums');\n            \
  \    }\n            }\n        );\n        $('button#documentRemoveClass').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                $('table').removeClass('johnLennonAlbums');\n            }\n  \
  \      );\n        $('button#documentToggleClass').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                $('table').toggleClass('johnLennonAlbums');\n\
  \            }\n        );\n    }\n);\n```\n\n图 4.5 显示了 Mac 上 Safari 浏览器之前的示例。\n\
  \n![image](img/c04f005.jpg)\n\n图 4.5\n\n点击“添加类（Add Class）”按钮会提供一个样式化的表格，如图 4.6\n\
  \n图 4.6\n\n在示例 4-2 创建的 JavaScript 中，你为 HTML 文档中存在的四个 `<button>` 元素每一个都绑定了四个事件。第一个事件为\
  \ `<table>` 元素添加类名 `johnLennonAlbums`。jQuery 只会添加一次该类名；如果它已经存在，则什么都不会发生。`addClass()`\
  \ 方法可以接受一个或多个类名。如果你想添加多个类名，应该用空格分隔每个类名。\n\n```javascript\n $('button#documentAddClass').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                $('table').addClass('johnLennonAlbums');\n            }\n    \
  \    );\n```\n\n`hasClass()` 方法通过绑定在第二个 `<button>` 元素上的事件进行演示，检查一个或多个类名是否存在。如果类存在，该方法返回\
  \ `true`。如果类缺失，该方法返回 `false`。在示例 4-2 中，每个布尔条件都会显示一个 `alert()` 消息。`hasClass()` 是\
  \ jQuery 提供的唯一不接受多个类名的类方法。\n\n```javascript\n $('button#documentHasClass').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                if ($('table').hasClass('johnLennonAlbums'))\n                {\n\
  \                    alert('The <table> has the class johnLennonAlbums');\n    \
  \            }\n                else\n                {\n                    alert('The\
  \ <table> does not have the class johnLennonAlbums');\n                }\n     \
  \       }\n        );\n```\n\n图 4.7 显示了类存在时显示的警报消息。\n\n`removeClass()` 方法通过按下第三个\
  \ `<button>` 元素进行演示；如果类已被添加，则将其移除。如果类不存在，则什么都不会发生。与 `addClass()` 方法一样，`removeClass()`\
  \ 方法可以接受多个类名，并且像 `addClass()` 方法一样，用空格分隔多个类名。当类被移除时，你会看到与图 4.5 中相同的表格。\n\n```javascript\n\
  \ $('button#documentRemoveClass').click(\n            function(event)\n        \
  \    {\n                event.preventDefault();\n                $('table').removeClass('johnLennonAlbums');\n\
  \            }\n        );\n```\n\n![image](img/c04f007.jpg)\n\n图 4.7\n\n`toggleClass()`\
  \ 方法通过按下第四个也是最后一个 `<button>` 元素进行演示。如果类存在，则将其移除；如果类缺失，则将其添加。与 `addClass()` 和 `removeClass()`\
  \ 方法一样，`toggleClass()` 方法可以接受一个或多个类名；用空格分隔多个类名。\n\n```javascript\n $('button#documentToggleClass').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                $('table').toggleClass('johnLennonAlbums');\n            }\n  \
  \      );\n```\n\n## **操作 HTML 和文本内容**\n\njQuery 为几乎所有操作都提供了方法。它对 JavaScript 独特且创新的方法重构了你编写\
  \ JavaScript 的方式。这种重构是必要的，因为 jQuery 方法定义了一些基本规则，这些规则被认为在所有方法中是通用的。例如，随着你深入了解 jQuery\
  \ 的工作原理，一个变得显而易见的规则规则是：在任何可能的地方，它的方法都作用于一个或多个元素。你永远不需要区分是想操作一个元素还是多个元素，因为 jQuery\
  \ 总是假设数组的存在。\n\n因为 jQuery 总是假设数组的存在，所以它消除了历史上为了遍历数组或多个元素的列表而一直需要的冗余代码。你可以将方法链式调用，并且可以同时对一个或多个元素执行复杂操作。在使用\
  \ jQuery 时，你可能会问自己：我如何访问标准或事实标准的方法和属性？在许多情况下，你不需要直接访问 DOM 属性，因为 jQuery 提供了等效且在大多数情况下更简洁的方法。\n\
  \njQuery 替换的其中一个属性就是事实标准的 `innerHTML`。`innerHTML` 以及微软对 DOM 的许多扩展正在向 HTML5 规范的标准化。`innerHTML`\
  \ 属性是少数几个被浏览器厂商广泛采纳的微软 DOM 扩展之一。\n\njQuery 并不完全完全依赖于微软事实标准 `innerHTML` 属性的实现，它提供了多种方法来帮助你操作\
  \ HTML 和文本内容。本节讨论了 jQuery API 提供的以下方法：\n\n*   `html()` 方法设置或获取一个或多个元素的 HTML 内容。\n\
  *   `text()` 方法获取或设置一个或多个元素的文本内容。\n*   `append()` 和 `prepend()` 方法允许你后追加或前置内容。你将了解到这些方法实际上比原生事实标准替代方案\
  \ `innerHTML` 更好。\n*   `after()` 和 `before()` 方法允许你在其他元素旁边放置内容（而不是在这些元素内部追加或前置内容）。\n\
  *   `insertAfter()` 和 `insertBefore()` 方法允许你通过获取一组元素并将这些元素插入另一组元素旁边来修改文档。\n*   `wrap()`、`wrapAll()`\
  \ 和 `wrapInner()` 方法赋予了你用其他元素包裹一个或多个元素的能力。\n*   `unwrap()` 方法移除父元素，将其后代元素保留在父元素所在的位置。\n\
  \n接下来的章节将描述并演示上述方法的工作原理，以增强你对 jQuery 内容操作工作原理的专业知识。\n\n### **获取、设置和删除内容**\n\n\n\n\
  \n\njQuery 提供的处理内容的简单方法是 `html()` 和 `text()` 方法。如果你进行了选择并在不传递任何参数的情况下调用其中一个方法，jQuery\
  \ 将仅简单地返回 jQuery 选择中第一个匹配元素的文本或 HTML 内容。接下来的示例 `Example 4-3` 展示了该方法的的工作原理：\n\n```html\n\
  \ <!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>Groucho\
  \ Marx Quote</title>\n        <script src='../jQuery.js'></script> own        <script\
  \ src='../jQueryUI.js'></script>\n        <script src='Example 4-3.js'></script>\n\
  \        <link href='Example 4-3.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <p>\n            Before I speak, I have something important to say. <i>-\
  \ Groucho Marx</i>\n        </p>\n    </body>\n</html>\n```\n\n上述文档链接到以下样式表：\n\n\
  ```css\n body {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color:\
  \ rgb(50, 50, 50);\n    margin: 0;\n    padding: 15px;\n}\n```\n\n接下来的脚本演示了你如何使用\
  \ `html()` 和 `text()` 方法，以及返回输出中可以预期什么：\n\n```javascript\n $(document).ready(\n\
  \    function()\n    {        \n        console.log('HTML: ' + $('p').html());\n\
  \        console.log('Text: ' + $('p').text());\n    }\n);\n```\n\n图 4.8 显示 `html()`\
  \ 方法在结果中返回了 `<i>` 元素，但 `text()` 方法却将其排除了。从这个意义上说，你会发现 `html()` 方法类似于 `innerHTML`\
  \ 属性，而 `text()` 方法类似于 `innerText` 或 `textContent` 属性。\n\n### 设置文本或 HTML 内容\n\n设置内容的工作原理类似：你只需要在\
  \ `text()` 或 `html()` 方法的第一个参数中提供你想要设置为元素（或多个元素）的值的内容。当然，使用哪种方法取决于你是否希望 HTML 标签被解析为\
  \ HTML。接下来的示例 `Example 4-4` 演示了如何设置文本或 HTML 内容：\n\n```html\n<!DOCTYPE HTML>\n<html\
  \ lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge'\
  \ />\n        <meta charset='utf-8' />\n        <title>Groucho Marx Quotes</title>\n\
  \        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 4-4.js'></script>\n        <link href='Example 4-4.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <p>\n            Before\
  \ I speak, I have something important to say. <i>- Groucho Marx</i>\n        </p>\n\
  \        <p id='grouchoQuote1'></p>\n        <p id='grouchoQuote2'></p>\n    </body>\n\
  </html>\n```\n\n![image](img/c04f008.jpg)\n\n图 4.8\n\n接下来的样式表应用于上述 HTML 文档：\n\n\
  ```css\n body {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color:\
  \ rgb(50, 50, 50);\n    margin: 0;\n    padding: 15px;\n}\n```\n\n接下来的脚本演示了如何通过\
  \ jQuery 的 `text()` 和 `html()` 方法设置元素内容：\n\n```javascript\n $(document).ready(\n\
  \    function()\n    {        \n        $('p#grouchoQuote1').text(\n           \
  \ 'Getting older is no problem. You just have to ' + \n            'live long enough.\
  \ <i>- Groucho Marx</i>'\n        );\n        $('p#grouchoQuote2').html(\n     \
  \       'I have had a perfectly wonderful evening, but ' + \n            'this wasn&rsquo;t\
  \ it. <i>- Groucho Marx</i>'\n        );\n    }\n);\n```\n\n图 4.9 显示了通过 `text()`\
  \ 方法应用的内容导致 HTML 标签被忽略，并在 id 为 `grouchoQuote1` 的 `<p>` 元素的渲染输出中显示。它还展示了 HTML 标签如何在\
  \ id 为 `grouchoQuote2` 的 `<p>` 元素内容被展开，该内容是通过使用 jQuery 的 `html()` 方法应用的。\n\n![image](img/c04f009.jpg)\n\
  \n图 4.9\n\n### 为多个项目设置文本或 HTML 内容\n\n虽然你可能认为文本或 HTML 内容一次只应用于单个元素，但 jQuery 的 `text()`\
  \ 和 `html()` 方法会将该文本应用于多个元素。接下来的示例 `Example 4-5` 演示了发生了什么：\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>Groucho\
  \ Marx Quotes</title>\n        <script src='../jQuery.js'></script>\n        <script\
  \ src='../jQueryUI.js'></script>\n        <script src='Example 4-5.js'></script>\n\
  \        <link href='Example 4-5.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <p>\n            Before I speak, I have something important to say. <i>-\
  \ Groucho Marx</i>\n        </p>\n        <p id='grouchoQuote1'></p>\n        <p\
  \ id='grouchoQuote2'></p>\n    </body>\n</html>\n```\n\n上述文档链接到以下样式表：\n\n```css\n\
  \ body {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50,\
  \ 50, 50);\n    margin: 0;\n    padding: 15px;\n}\n```\n\n接下来的脚本演示了通过 jQuery 的 `text()`\
  \ 和 `html()` 方法设置元素内容：\n\n```javascript\n $(document).ready(\n    function()\n \
  \   {        \n        $('p#grouchoQuote1').text(\n            'Getting older is\
  \ no problem. You just have to ' + \n            'live long enough. <i>- Groucho\
  \ Marx</i>'\n        );\n        $('p#grouchoQuote2').html(\n            'I have\
  \ had a perfectly wonderful evening, but ' + \n            'this wasn&rsquo;t it.\
  \ <i>- Groucho Marx</i>'\n        );\n    }\n);\n```\n\n## 移除内容\n\n移除内容也可以通过 jQuery\
  \ 的 `text()` 和 `html()` 方法完成。移除一个元素只需要调用任一方法并传递空字符串，即 `text(\"\")` 或 `html(\"\"\
  )`。然而，并不是移除文档内容的唯一方法，我们将在本章之后看到替代方法。\n\n## 追加内容和前置内容\n\n*prepend* 这个词在很大程度上是技术编程世界创造的术语。（它在那个世界之外也有使用。）它的意思是放在某些内容的前面或添加某些内容。事实上，你会在许多字典中找不到\
  \ *prepend* 这个词，即使你找到了，也会发现其定义是：“（及物）预先考虑；心理权衡。”这与它在技术编程社区中的用法不符，在那个社区中，这个词被认为是\
  \ *append* 的相反词，而 *append* 的意思是“附加到某物的末尾”。\n\n\n\n\n以下示例 `Example 4-6` 演示了 jQuery\
  \ 的 `append()` 和 `prepend()` 方法：\n\n```html\n <!DOCTYPE HTML>\n<html lang='en'>\n\
  \    <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge' />\n \
  \       <meta charset='utf-8' />\n        <title>John Lennon Albums</title>\n  \
  \      <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 4-6.js'></script>\n        <link href='Example 4-6.css'\
  \ rel='stylesheet' />\n    </head>\n    <<body>\n        <form action='javascript:void(0);'\
  \ method='get'>\n            <h4>John Lennon Albums</h4>\n            <table class='johnLennonAlbums'>\n\
  \                <thead>\n                    <tr>\n                        <th>Title</th>\n\
  \                        <th>Year</th>        \n                    </tr>\n    \
  \            </thead>\n                <tbody>\n                    <tr>\n     \
  \                   <td>Imagine</td>\n                        <td>1971</td>\n  \
  \                  </tr>\n                    <tr>\n                        <td>Some\
  \ Time in New York City</td>\n                        <td>1972</td>\n          \
  \          </tr>\n                    <tr>\n                        <td>Mind Games</td>\n\
  \                        <td>1973</td>\n                    </tr>\n            \
  \        <tr>\n                        <td>Walls and Bridges</td>\n            \
  \            <td>1974</td>\n                    </tr>\n                    <tr>\n\
  \                        <td>Rock 'n Roll</td>\n                        <td>1975</td>\n\
  \                    </tr>\n                </tbody>\n            </table>\n   \
  \         <p>\n                <button id='documentAppend'>\n                  \
  \  Append\n                </button>\n                <button id='documentPrepend'>\n\
  \                    Prepend\n                </button>\n            </p>\n    \
  \    </form>\n    </body>\n</html>\n```\n\n前面的代码链接到以下样式表：\n\n```css\n body {\n \
  \   font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50, 50, 50);\n\
  \    margin: 0;\n    padding: 15px;\n}\ntable.johnLennonAlbums {\n    table-layout:\
  \ fixed;\n    width: 500px;\n    border: 1px solid black;\n    border-collapse:\
  \ collapse;\n}\ntable.johnLennonAlbums th,\ntable.johnLennonAlbums td {\n    padding:\
  \ 3px;\n    border: 1px solid black;\n}\ntable.johnLennonAlbums th {\n    text-align:\
  \ left;\n    background: lightgreen;\n}\ntable.johnLennonAlbums tbody tr:hover {\n\
  \    background: lightblue;\n}\n```\n\n接下来的脚本演示了 `prepend()` 和 `append()` 方法：\n\n\
  ```javascript\n $(document).ready(\n    function()\n    {        \n        $('button#documentAppend').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \n                if (!$('tr#johnLennonDoubleFantasy').length)\n               \
  \ {\n                    $('table tbody').append(\n                        \"<tr\
  \ id='johnLennonDoubleFantasy'>\\n\" + \n                            \"<td>Double\
  \ Fantasy</td>\\n\" +\n                            \"<td>1980</td>\\n\" + \n   \
  \                     \"</tr>\\n\"\n                    );\n                }\n\
  \            }\n        );\n        $('button#documentPrepend').click(\n       \
  \     function(event)\n            {\n                event.preventDefault();\n\
  \                if (!$('tr#johnLennonPlasticOnoBand').length)\n               \
  \ {\n                    $('table tbody').prepend(\n                        \"<tr\
  \ id='johnLennonPlasticOnoBand'>\\n\" + \n                            \"<td>John\
  \ Lennon/Plastic Ono Band</td>\\n\" +\n                            \"<td>1970</td>\\\
  n\" + \n                        \"</tr>\\n\"\n                    );\n         \
  \       }\n            }\n        );\n    }\n);\n```\n\n在前面的示例中，要向 `<tbody>` 元素添加\
  \ HTML 内容，可以使用 jQuery 的 `append()` 方法，当你点击 Append 按钮时，该方法会将 `Double Fantasy` 专辑条目添加到\
  \ `<tbody>` 元素中。此外，当你点击 Prepend 按钮时，John Lennon/Plastic Ono Band 条目会被添加到 `<tbody>`\
  \ 元素的开头。图 4.11 显示了页面加载时的示例情况（不包含额外的条目）。\n\n![image](img/c04f011.jpg)\n\n**图 4.11**\n\
  \n## 在内容旁边插入\n\n通过 `append()` 和 `prepend()` 方法，你是在向元素*内部*添加内容。而通过 `before()` 和 `after()`\
  \ 方法，你是在向元素*旁边*插入内容。接下来的文档（*Example 4-7*）演示了 `before()` 和 `after()` 方法的用法：\n\n```html\n\
  \ <!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>Groucho\
  \ Quote</title>\n        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 4-7.js'></script>\n        <link href='Example 4-7.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <p>\n            Why, I'd\
  \ horse-whip you, if I had a horse.\n        </p>\n    </body>\n</html>\n```\n\n\
  ```css\n body {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color:\
  \ rgb(50, 50, 50);\n    margin: 0;\n    padding: 15px;\n}\np.quoteattribution {\n\
  \    font-style: italic;\n}\n```\n\n接下来的脚本演示了如何通过相应的 `before()` 和 `after()` 方法在\
  \ `<p>` 元素前后插入内容：\n\n```javascript\n $(document).ready(\n    function()\n    { \
  \       \n        $('p').before(\n            '<h4>Quote</h4>'\n        );\n\n \
  \       $('p').after(\n            \"<p class='quoteattribution'>\\n\" + \n    \
  \        \" - Groucho Marx\\n\" + \n            \"</p>\\n\"\n        );        \n\
  \    }\n);\n```\n\n图 4.12 显示了在浏览器中加载前面的文档时发生的情况。\n\n![image](img/c04f012.jpg)\n\n\
  传递给 `before()` 方法的内容被插入到 `<p>` 元素之前，传递给 `after()` 方法的内容被插入到 `<p>` 元素之后。\n\n### 通过选择在旁边插入\n\
  \n`before()` 和 `after()` 方法用于在元素旁边插入内容。`insertBefore()` 和 `insertAfter()` 方法具有相同的功能，但不是直接将内容传递给这些方法（如你使用\
  \ `before()` 和 `after()` 方法所做），而是使用选择器来引用文档中你想插入到另一个元素旁边的元素。此外，在编写执行插入操作的脚本时，逻辑是反的。接下来的文档（可以在源材料中找到\
  \ *Example 4-8*）演示了你可以如何使用 `insertBefore()` 和 `insertAfter()` 方法。\n\n\n\n\n\n```html\n\
  <!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>约翰·列侬与保罗·麦卡特尼专辑</title>\n\
  \        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 4-8.js'></script>\n        <link href='Example 4-8.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <!-- 模板项目 -->\n        <table\
  \ id='seventiesAlbumsTemplate'>\n            <thead>\n                <tr>\n   \
  \                 <th>标题</th>\n                    <th>年份</th>        \n       \
  \         </tr>\n            </thead>\n            <footer>\n                <tr>\n\
  \                    <th>标题</th>\n                    <th>年份</th>        \n    \
  \            </tr>\n            </tfoot> <!-- 注意：此处原文误为 tfoot，保持原样 -->\n       \
  \ </table>\n        <!-- 主内容 -->\n        <h4>约翰·列侬 &lsquo;70 年代专辑</h4>\n      \
  \  <table class='seventiesAlbums'>\n            <tbody>\n                <tr>\n\
  \                    <td>John Lennon/Plastic Ono Band</td>\n                   \
  \ <td>1970</td>\n                </tr>\n                <tr>\n                 \
  \   <td>Imagine</td>\n                    <td>1971</td>\n                </tr>\n\
  \                <tr>\n                    <td>Some Time in New York City</td>\n\
  \                    <td>1972</td>\n                </tr>\n                <tr>\n\
  \                    <td>Mind Games</td>             \n                    <td>1973</td>\n\
  \                </tr>\n                <tr>\n                    <td>Walls and\
  \ Bridges</td>\n                    <td>1974</td>\n                </tr>\n     \
  \           <tr>\n                    <td>Rock &#039;n Roll</td>\n             \
  \       <td>1975</td>\n                </tr>\n            </tbody>\n        </table>\n\
  \        <h4>保罗·麦卡特尼 &lsquo;70 年代专辑</h4>\n        <table class='seventiesAlbums'>\n\
  \            <tbody>\n                <tr>\n                    <td>McCartney</td>\n\
  \                    <td>1970</td>\n                </tr>\n                <tr>\n\
  \                    <td>RAM</td>\n                    <td>1971</td>\n         \
  \       </tr>\n                <tr>\n                    <td>Wild Life</td>\n  \
  \                  <td>1971</td>\n                </tr>\n                <tr>\n\
  \                    <td>Red Rose Speedway</td>\n                    <td>1973</td>\n\
  \                </tr>\n                <tr>\n                    <td>Band on the\
  \ Run</td>\n                    <td>1973</td>\n                </tr>\n         \
  \       <tr>\n                    <td>Venus and Mars</td>\n                    <td>1975</td>\n\
  \                </tr>\n                <tr>\n                    <td>At the Speed\
  \ of Sound</td>\n                    <td>1976</td>\n                </tr>\n    \
  \            <tr>\n                    <td>Thrillington (As Percy Thrillington)</td>\n\
  \                    <td>1977</td>\n                </tr>\n                <tr>\n\
  \                    <td>Londontown</td>\n                    <td>1978</td>\n  \
  \              </tr>\n                <tr>\n                    <td>Wings Greatest</td>\n\
  \                    <td>1978</td>\n                </tr>\n                <tr>\n\
  \                    <td>Back To The Egg</td>\n                    <td>1979</td>\n\
  \                </tr>\n            </tbody>\n        </table>\n    </body>\n</html>\n\
  ```\n\n以下样式表被应用于上述标记标记文档：\n\n```css\n body {\n    font: 12px \"Lucida Grande\",\
  \ Arial, sans-serif;\n    color: rgb(50, 50, 50);\n    margin: 0;\n    padding:\
  \ 15px;\n}\ntable.seventiesAlbums {\n    table-layout: fixed;\n    width: 500px;\n\
  \    border: 1px solid black;\n    border-collapse: collapse;\n}\ntable.seventiesAlbums\
  \ th,\ntable.seventiesAlbums td {\n    padding: 3px;\n    border: 1px solid black;\n\
  }\ntable.seventiesAlbums th {\n    text-align: left;\n    background: lightgreen;\n\
  }\ntable.seventiesAlbums tbody tr:hover {\n    background: lightblue;\n}\ntable#seventiesAlbumsTemplate\
  \ {\n    display: none;\n}\n```\n\n以下脚本演示了你如何结合选择器使用 `insertBefore()` 和 `insertAfter()`\
  \ 方法来复隆文档中的内容：\n\n```javascript\n $(document).ready(\n    function()\n    {    \
  \    \n        $('table#seventiesAlbumsTemplate thead')\n            .insertBefore('table.seventiesAlbums\
  \ tbody');\n\n        $('table#seventiesAlbumsTemplate tfoot')\n            .insertAfter('table.seventiesAlbums\
  \ tbody');\n    }\n);\n```\n\n以下脚本演示了你如何结合选择器使用 `insertBefore()` 和 `insertAfter()`\
  \ 方法来复隆文档中的内容。\n\n### **包裹内容 (Wrapping Content)**\n\n在 jQuery 中，*包裹*一个元素意味着创建一个新元素，并将文档中的现有元素放置在该新元素内部。\n\
  \njQuery 提供了几种包裹内容的方法，即获取一个或多个元素并将这些元素放入容器元素中，以更改文档的结构层次。jQuery 提供的用于封装内容的方法有 `wrap()`、`wrapAll()`\
  \ 和 `wrapInner()`。jQuery 提供了一个单一方法来执行反向操作解包裹元素，该方法就是 `unwrap()`。接下来的章节将演示如何使用这些方法。\n\
  \n#### **单独包装选择中的元素**\n\njQuery 的 `wrap()` 方法会单独对选择中的每个元素进行包装。也就是说，如果你的选择匹配了五个不同的元素，jQuery\
  \ 的 `wrap()` 方法会创建五个独立的包装器。为了更好地说明其工作原理，以下代码 *Example 4-9* 演示了 `wrap()` 方法如何将三个\
  \ `<p>` 元素封装在 `<div>` 元素中：\n\n\n\n\n\n```\n<!DOCTYPE HTML>\n<html lang='en'>\n \
  \   <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge' />\n  \
  \      <meta charset='utf-8' />\n        <title>Mitch Hedberg Quotes</title>\n \
  \       <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 4-9.js'></script>\n        <link href='Example 4-9.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <h4>Mitch Hedberg Quotes</h4>\n\
  \        <p>\n            Dogs are forever in the push up position.\n        </p>\n\
  \        <p>\n            I haven&rsquo;t slept for ten days, because that would\
  \ be too long. \n        </p>\n        <p>\n            I once saw a forklift lift\
  \ a crate of forks. And it was way \n            too literal for me. \n        </p>\n\
  \    </body>\n</html>\n```\n\n以下样式表作用于前面的标记标记文档：\n\n```\n body {\n    font: 12px\
  \ \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50, 50, 50);\n    margin:\
  \ 0;\n    padding: 15px;\n}\ndiv {\n    padding: 5px;\n    border: 1px dashed black;\n\
  \    background: orange;\n    margin: 5px 0;\n}\ndiv p {\n    margin: 5px;\n}\n\
  ```\n\n以下脚本演示了 jQuery 的 `wrap` 方法：\n\n```\n $(document).ready(\n    function()\n\
  \    {        \n        $('p').wrap('<div/>');\n    }\n);\n```\n\n在 图 4.14 中，你可以看到每个\
  \ `<p>` 元素都被包裹在一个 `<div>` 元素中，这通过样式表中应用的样式变得非常明显。每个 `<div>` 都应用了不同的边框、外边距和背景颜色，以便一眼就能看出\
  \ `<div>` 的存在。\n\n![image](img/c04f014.jpg)\n\n图 4.14\n\n前面的示例清楚地表明，jQuery 的 `wrap()`\
  \ 方法用于单独包装选择集中的每个元素。\n\n### 包装一组元素\n\n虽然 `wrap()` 方法是单独包装选择集中的每个项目，但 jQuery 的 `wrapAll()`\
  \ 方法会将选择集中的所有项目包装在单个包装器内。接下来的文档展示了与你在上一节中看到的 `wrap()` 方法演示时相同的标记和样式表。其唯一改变的条目是使用了\
  \ `wrapAll()` 方法代替了 `wrap()` 方法。\n\n在接下来的脚本 `Example 4-10` 中（它使用了与 `Example 4-9`\
  \ 相同的标记和样式表），你看到 `wrap()` 方法被替换成了 `wrapAll()` 方法：\n\n```\n $(document).ready(\n\
  \    function()\n    {        \n        $('p').wrapAll('<div/>');\n    }\n);\n```\n\
  \n图 4.15 显示，并不是每个 `<p>` 元素被单独包装在 `<div>` 元素中，而是发现三个 `<p>` 元素都被包装在单个 `<div>` 元素中，这通过你样式表中使用的样式再次变得明显。\n\
  \n![image](img/c04f015.jpg)\n\n图 4.15\n\n正如你在前面的示例所示，`wrapAll()` 方法获取一个元素选择，并用单个包装器元素整体地包装整个选择集。\n\
  \n### 包装元素的内容\n\n最后一个包装器方法演示了 `wrapInner()` 方法，它用于包装元素的内容。该方法的工作原理与 `wrap()` 方法类似，即对选择集中的每个项目应用包装器，但不是将被选元素放置在包装器中，而是将其内容放置在包装器中。\n\
  \n接下来的文档 `Example 4-11` 与你在上两个示例中看到的文档相同，演示了 `wrapInner()` 方法如何与 `wrap()` 和 `wrapAll()`\
  \ 方法进行对比和区别：\n\n```\n<!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta\
  \ http-equiv='X-UA-Compatible' content='IE=Edge' />\n        <meta charset='utf-8'\
  \ />\n        <title>Mitch Hedberg Quotes</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 4-11.js'></script>\n\
  \        <link href='Example 4-11.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <h4>Mitch Hedberg Quotes</h4>\n        <p>\n            Dogs are forever\
  \ in the push up position.\n        </p>\n        <p>\n            I haven&rsquo;t\
  \ slept for ten days, because that would be too long. \n        </p>\n        <p>\n\
  \            I once saw a forklift lift a crate of forks. And it was way \n    \
  \        too literal for me. \n        </p>\n    </body>\n</html>\n```\n\n（注：后续内容因输入不完整未翻译）\n\
  \n\n\n\n\n本节讨论了两种方法：jQuery 的 `replaceWith()` 和 `replaceAll()`。jQuery 的 `replaceWith()`\
  \ 方法可以将选定的内容替换为你指定的任何 HTML 内容。这与 jQuery 的 `html()` 方法作用类似，但 `html()` 方法是设置元素的内部内容，而\
  \ jQuery 的 `replaceWith()` 方法则是替换整个元素及其内容。这可以被认为类似于微软（现已成为事实上的标准）的 `outerHTML` 属性，特别是指在\
  \ `outerHTML` 属性中可以设置或替换内容的部分。\n\n`replaceAll()` 方法与你在本章较早观察到的 `insertBefore()`\
  \ 和 `insertAfter()` 方法相似；它的逻辑是反的，旨在用于已经存在于文档中的 HTML 内容，例如你可能用作模板复用的 HTML。\n\n接下来的文档\
  \ `Example 4-13` 演示了 jQuery 的 `replaceWith()` 和 `replaceAll()` 方法是如何工作的：\n\n```\n\
  \ <!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>Mitch Hedberg\
  \ Quotes</title>\n        <script src='../jQuery.js'></script>\n        <script\
  \ src='../jQueryUI.js'></script>\n        <script src='Example 4-13.js'></script>\n\
  \        <link href='Example 4-13.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <div id='mitchHedbergQuoteTemplate'>\n            <p id='mitchHedbergQuote3'>\n\
  \                I&rsquo;m sick of following my dreams. I&rsquo;m just going\n \
  \               to ask them where they&rsquo;re goin&rsquo;, and hook up with \n\
  \                them later.\n            </p>\n            <p id='mitchHedbergQuote4'>\n\
  \                My fake plants died because I did not pretend to water them.\n\
  \            </p>\n        </div>\n        <h4>Mitch Hedberg Quotes</h4>\n     \
  \   <p>\n            <input type='submit' id='mitchHedbergQuoteReveal1' value='View\
  \ Quote' />\n        </p>\n        <p>\n            <input type='submit' id='mitchHedbergQuoteReveal2'\
  \ value='View Quote' />\n        </p>\n        <p>\n            <input type='submit'\
  \ id='mitchHedbergQuoteReveal3' value='View Quote' />\n        </p>\n        <p>\n\
  \            <input type='submit' id='mitchHedbergQuoteReveal4' value='View Quote'\
  \ />\n        </p>\n    </body>\n</html\n```\n\n接下来的样式表应用于上述 HTML：\n\n```\n body\
  \ {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50, 50,\
  \ 50);\n    margin: 0;\n    padding: 15px;\n}\ndiv#mitchHedbergQuoteTemplate {\n\
  \    display: none;\n}\np {\n    margin: 5px;\n}\n```\n\n接下来的脚本演示了如何使用 jQuery 的\
  \ `replaceWith()` 和 `replaceAll()` 方法来替换元素：\n\n```\n $(document).ready(\n    function()\n\
  \    {        \n        $('input#mitchHedbergQuoteReveal1').click(\n           \
  \ function(event)\n            {\n                event.preventDefault();\n\n  \
  \              $(this).replaceWith(\n                    \"<p>\\n\" +\n        \
  \            \"    I would imagine that if you could understand \\n\" + \n     \
  \               \"    Morse code, a tap dancer would drive you crazy.\\n\" +\n \
  \                   \"</p>\\n\"\n                );\n            }\n        );\n\
  \        $('input#mitchHedbergQuoteReveal2').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n\n                $(this).replaceWith(\n\
  \                    \"<p>\\n\" +\n                    \"  I&rsquo;d like to get\
  \ four people who do cart wheels \\n\" +\n                    \"  very good, and\
  \ make a cart.\\n\" +\n                    \"</p>\\n\"\n                );\n   \
  \         }\n        );\n\n        $('input#mitchHedbergQuoteReveal3').click(\n\
  \            function(event)\n            {\n                $('p#mitchHedbergQuote3').replaceAll(this);\n\
  \            }\n        );\n\n        $('input#mitchHedbergQuoteReveal4').click(\n\
  \            function(event)\n            {\n                $('p#mitchHedbergQuote4').replaceAll(this);\n\
  \            }\n        );\n    }\n);\n```\n\n图 4.18 显示了上一个示例的结果。当你点击任何一个按钮时，你会看到该按钮被替换了一句名言。\n\
  \n![image](img/c04f018.jpg)\n\n图 4.18\n\n在上述示例中，你看到每个按钮都绑定了一个 `click` 事件，点击任何按钮时，按钮都会被替换为一句名言。对于前两个按钮，你调用了\
  \ `$(this).replaceWith()`，这导致 `<input>` 元素被替换为给 `replaceWith()` 方法的 HTML 内容。\n\n\
  对于后两个按钮，你想要用于替换的内容是通过选择的，而不是直接提供的；例如 `p#mitchHedbergQuote3`，然后调用了 `replaceAll()`\
  \ 方法，并将你想要替换的项作为参数提供。\n\n##移除内容\n\n移除内容有多种方法。例如，你可以结合 `replaceWith()` 或 `html()`\
  \ 方法使用空字符串。但 jQuery 还提供了专门用于移除内容的方法：`empty()` 和 `remove()` 方法。接下来的文档演示了这两种方法的用法：\n\
  \n\n\n\n```css\n body {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n\
  \    color: rgb(50, 50, 50);\n    margin: 0;\n    padding: 15px;\n}\ntable.johnLennonAlbums\
  \ {\n    table-layout: fixed;\n    width: 500px;\n    border: 1px solid black;\n\
  \    border-collapse: collapse;\n}\ntable.johnLennonAlbums th,\ntable.johnLennonAlbums\
  \ td {\n    padding: 3px;\n    border: 1px solid black;\n}\ntable.johnLennonAlbums\
  \ th {\n    text-align: left;\n    background: lightgreen;\n}\ntable.johnLennonAlbums\
  \ tbody tr:hover {\n    background: lightblue;\n}\n```\n\n\n\n你已经学习了各种用于操作文本和 HTML\
  \ 内容的 jQuery 方法。你可以使用 jQuery 的 `text()` 和 `html()` 方法为元素获取或设置文本或 HTML 内容。你可以使用 jQuery\
  \ 的 `append()` 或 `prepend()` 方法向其他元素追加或前置 HTML 内容。jQuery 的 `after()`、`before()`、`insertAfter()`\
  \ 和 `insertBefore()` 方法都可以在其他内容旁边插入内容。此外，jQuery 的 `wrap()`、`wrapAll()` 和 `wrapInner()`\
  \ 方法可以使用包装元素对元素进行包裹。此外，`unwrap()` 方法可以移除父元素。\n\njQuery 的 `replaceWith()` 和 `replaceAll\
  \ 方法可以将一个或多个元素完全替换为其他内容。其 `empty()` 方法可以完全移除元素的子元素和后代。其 `remove()` 方法可以从文档中移除元素及其所有内容。而其\
  \ `clone()` 方法可以复制内容，并可选地复制内容中存在的事件处理程序。\n\n## 练习\n\n1. 编写示例代码，可能用于同时设置 `<input>`\
  \ 元素的值（value）和类（class）属性。\n2. 如果你想用 jQuery 为 `<a>` 元素的 `href` 属性设置 [`www.example.com`](http://www.example.com)，那么\
  \ JavaScript 代码可能是什么样的？\n3. 使用什么 jQuery 方法可以完全移除元素的属性？\n4. 你使用哪种 jQuery 方法来判断元素是否存在某个类名？\n\
  5. 如果一个元素包含 HTML 内容，而你使用 jQuery 的 `text()` 方法获取该元素的内容，HTML 标签会出现在返回值中吗？\n6. 如果你使用\
  \ jQuery 的 `text()` 方法设置元素的内容，且该内容包含 HTML 标签，这些 HTML 标签会在浏览器视口显示的渲染输出中可见吗？\n7. 描述一个\
  \ jQuery 的 `append()` 和 `prepend()` 方法在 IE 中与 `innerHTML` 相比时解决的 bug。\n8. 描述一个 jQuery\
  \ 的 `append()` 和 `prepend()` 方法在 Firefox 中与 `innerHTML` 相比时解决的 bug。\n9. 如果你想在文档中其他现有内容之前插入现有的内容，哪种\
  \ jQuery 方法最适合这项任务？\n10. 如果你需要用一个单一元素将文档中的多个项目包裹起来，你可能会使用哪种 jQuery 方法？\n11. jQuery\
  \ 的 `replaceWith()` 方法与哪种事实标准的 JavaScript 属性最相似？\n12. 如果你想从文档中完全移除一个项目及其所有子元素，你会使用哪种\
  \ jQuery 方法？\n13. 如果你想复制一个元素及其事件处理程序，并将复制的元素插入到文档的另一个地方，你会调用哪种 jQuery 函数？\n\n# 第\
  \ 5 章：数组和对象的迭代\n\n本章讨论了 jQuery 提供的帮助你处理和查看数组及对象内容的方法。在历史上，在 JavaScript 中处理数组或对象通常需要你编写自己的辅助方法，并且每当你想枚举数组内容时，都要编写枯燥且重复的代码——例如，每次想枚举数组内容时都创建一个计数器变量。\n\
  \n正如你在第 4 章“操作内容和属性”中所看到的，jQuery 为与操作文档内容相关的各种任务提供了丰富、健壮且实用的 API。在本章中，你会发现 jQuery\
  \ 在处理数组或对象方面提供的功能也同样尽如人意。\n\n## 枚举数组\n\n在本节中，你将学习如何使用 jQuery 的 `$.each()` 方法（通过通过\
  \ jQuery 调用 `each()` 或直接调用 `each()`）来处理枚举或迭代值数组的任务。`enumerate`（枚举）一词意味着逐一检查项目，而\
  \ `iterate`（迭代）一词意味着重复执行操作。这些术语通常互用，描述查看数组、列表或对象内容的过程。到目前为止，在查看数组中的每个单独值时，你可能习惯于处理这样的循环，这是在\
  \ jQuery 等框架普及之前在 JavaScript 中的常用方法：\n\n```\nvar divs = document.getElementsByTagName('div');\n\
  for (var counter = 0; counter < divs.length; counter++)\n{\n    // 对每个项目执行某些操作\n\
  \    console.log(divs[counter].innerHTML);\n}\n```\n\n你有一个项目数组、一个静态节点列表、一个动态节点列表，可能是一个对象。（顺便说一下，在\
  \ JavaScript 中，所有数组都是对象，但并非所有对象都是数组。）然后创建一个 `for` 循环，定义一个计数器，并迭代你的数组或列表的内容。如果你想迭代一个对象，则应使用\
  \ `for/in` 结构来查看对象的属性。\n\njQuery 通过提供一种使用函数调用而不是 `for` 循环的方法，并结合为数组或对象中的每个单独项目调用的回调函数，使得创建\
  \ `for` 结构变得不再必要。在那个回调函数内部，你可以对数组、对象或列表中的每个单独项目执行某些操作。\n\njQuery 提供了多个用于枚举的函数，本章将涵盖这些内容。jQuery\
  \ 提供的基础枚举函数称为 `each()`，并在下面的示例 5-1 中通过两种可能的应用方式进行了演示：\n\n```html\n<!DOCTYPE HTML>\n\
  <html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible' content='IE=Edge'\
  \ />\n        <meta charset='utf-8' />\n        <title>披头士乐队唱片</title>\n       \
  \ <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <link href='Example 5-1.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <h4>披头士</h4>\n        <ul id='beatles'></ul>\n        <h4>唱片</h4>\n   \
  \     <ul id='beatlesAlbums'></ul>\n    </body>\n</html>\n```\n\n上述标记文档链接了以下样式表：\n\
  \n```css\nbody {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color:\
  \ rgb(50, 50, 50);\n    margin: 0;\n    padding: 10px;\n}\nbody ul {\n    list-style:\
  \ none;\n    margin: 0 0 10px 0;\n    padding: 10px;\n    background: yellow;\n\
  \    width: 250px;\n}\nh4 {\n    margin: 10px 0;\n}\n```\n\n接下来的脚本演示了通过 jQuery 和直接调用的\
  \ jQuery `each()` 方法。\n\n```javascript\n$(document).ready(\n    function()\n   \
  \ {\n        var beatles = [\n            'John Lennon',\n            'Paul McCartney',\n\
  \            'George Harrison',\n            'Ringo Starr'\n        ];\n       \
  \ var ul = $('ul#beatles');\n        // 通过 jQuery 调用 each()\n        $(beatles).each(\n\
  \            function()\n            {\n                ul.append('<li>' + this\
  \ + '</li>');\n            }\n        );\n        var albums = [\n            'Please\
  \ Please Me',\n            'With the Beatles',\n            'A Hard Day\\'s Night',\n\
  \            'Beatles for Sale',\n            'Help!',\n            'Rubber Soul',\n\
  \            'Revolver',\n            'Sgt. Pepper\\'s Lonely Hearts Club Band',\n\
  \            'Magical Mystery Tour',\n            'The Beatles',\n            'Yellow\
  \ Submarine',\n            'Abbey Road',\n            'Let It Be'\n        ];\n\
  \        ul = $('ul#beatlesAlbums');\n        // 直接调用 each()\n        $.each(\n\
  \            albums,\n            function()\n            {\n                ul.append('<li>'\
  \ + this + '</li>');\n            }\n        );\n    }\n);\n```\n\n\n\n在前面的脚本中，你创建了两个数组，一个用于\
  \ `beatles`，另一个用于 `albums`。在第一次迭代中，变量 `beatles` 被传递给 jQuery 的美元符号方法，然后在其后链式调用了 jQuery\
  \ 的 `each()` 方法。你向 jQuery 的 `each()` 方法传递了一个回调函数，该函数会为数组中的每个项执行一次；在每次执行时，当前项都会被传递给回调函数；且该值被赋值给\
  \ `this`。你也可以在回调函数中定义参数，以获取当前键（对于数组或列表，它是一个数字偏移量）或当前值，如下所示：\n\n```javascript\n $(beatles).each(\n\
  \            function(key, value)\n            {\n                ul.append('<li>'\
  \ + value + '</li>');\n            }\n        );\n```\n\n对于这两个数组，数字偏移量通过第一个参数 `key`\
  \ 提供，而值通过第二个参数 `value` 提供。相同的值被赋值给特殊的上下文关键字：`this`，它仅在回调函数内部可用。\n\n图 5.1 显示两个 `<ul>`\
  \ 元素都通过脚本填充了新的 `<li>` 元素。\n\n![image](img/c05f001.jpg)\n\n图 5.1\n\n在前面的示例中，你将看到\
  \ jQuery 如何消除你通常用于遍历数组或列表内容的传统 `for` 结构。相反，你将一个数组传递给 jQuery 的美元符号方法，这样你就可以利用 jQuery\
  \ 的完整功能来处理该数组。然后，你使用 `each()` 方法链式调用 jQuery，该方法接受回调函数作为其唯一参数。随后，该回调函数会为数组中的每个项执行一次，从而消除了对计数器的需求，因为当前项在每次迭代时都会通过\
  \ `this` 关键字传递给函数。可以通过通过向回调函数提供两个参数来可选地访问当前索引和值。或者，你也可以直接调用 `each()`。直接调用 `each()`会将数组作为第一个参数，并将回调函数作为第二个参数。\n\
  \n遗憾的是，枚举对象并不像枚举数组那样灵活，数组将在下一节中介绍。\n\n### 枚举对象\n\n使用 jQuery 枚举对象是通过直接调用 `each()`\
  \ 完成的；当通过 jQuery 调用 `each()` 时，jQuery 对该如何处理对象感到困惑，因为 jQuery 对以这种方式传递给它的对象执行其他操作。下面的脚本重新查看了示例\
  \ 5-1 中所示例子，但这次两个数组都被重写为普通对象，因此你可以观察枚举数组和枚举对象之间的区别。使用的 HTML 和 CSS 与示例 5-1 相同；你可以从\
  \ [`www.wrox.com/go/webdevwithjquery`](http://www.wrox.com/go/webdevwithjquery)\
  \ 的免费下载材料中获取此示例。该示例名为示例 5-2。\n\n```javascript\n$(document).ready(\n    function()\n\
  \    {\n        var beatles = {\n            john : 'John Lennon',\n           \
  \ paul : 'Paul McCartney',\n            george : 'George Harrison',\n          \
  \  ringo : 'Ringo Starr'\n        };\n        var ul = $('ul#beatles');\n      \
  \  // 通过 jQuery 调用 each()\n        $(beatles).each(\n            function()\n  \
  \          {\n                ul.append('<li>' + this + '</li>');\n            }\n\
  \        );\n        var albums = {\n            1 : 'Please Please Me',\n     \
  \       2 : 'With the Beatles',\n            3 : 'A Hard Day\\'s Night',\n     \
  \       4 : 'Beatles for Sale',\n            5 : 'Help!',\n            6 : 'Rubber\
  \ Soul',\n            7 : 'Revolver',\n            8 : 'Sgt. Pepper\\'s Lonely Hearts\
  \ Club Band',\n            9 : 'Magical Mystery Tour',\n            10 : 'The Beatles',\n\
  \            11 : 'Yellow Submarine',\n            12 : 'Abbey Road',\n        \
  \    13 : 'Let It Be'\n        };\n        ul = $('ul#beatlesAlbums');\n       \
  \ if (albums instanceof Array)\n        {\n            console.log(\"Albums is an\
  \ array.\");\n        }\n        else\n        {\n            console.log(\"Albums\
  \ is a plain object.\");\n        }\n        // 直接调用 each()\n        $.each(\n \
  \           albums,\n            function()\n            {\n                ul.append('<li>'\
  \ + this + '</li>');\n            }\n        );\n    }\n);\n```\n\n在前面的示例中，你直接将一个对象传递给\
  \ jQuery，然后尝试通过调用 `each()` 来枚举该对象。在图 5.2 中，你可以看到枚举并没有成功。你发现只有一个名为 `[object Object]`\
  \ 的项。这意味着 jQuery 将整个对象传递给了 `each()`，而不是查看附加到对象上的四个属性每一个。\n\n![image](img/c05f002.jpg)\n\
  \n图 5.2\n\n然而，jQuery 可以枚举对象，正如你看到的，当对象直接作为第一个参数传递给 `each()` 方法时，第二个对象被成功枚举了。如果对象是一个数组，你会发现表达式\
  \ `instanceof Array` 的结果为 `true`。在这种情况下，该对象不是普通对象，因此控制台上会写入 `Albums is a plain object.`。\n\
  \n### 遍历选择器\n\n然而，jQuery 的 `each()` 方法并不适用于数组或对象；它也可以应用于选择器（selection）。下面的文档示例 5-3\
  \ 展示了如何使用 `each()` 遍历选择器：\n\n```html\n<!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n\
  \        <meta http-equiv='X-UA-Compatible' content='Edge' />\n        <meta charset='utf-8'\
  \ />\n        <title>Rubber Soul</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../jQueryUI.js'></script>\n        <script src='Example 5-3.js'></script>\n\
  \        <link href='Example 5-3.css' rel='stylesheet' />\n    </head>\n    <body><body>\n\
  \        <h4>Rubber Soul</h4>\n        <ul id='rubberSoul'>\n            <li>Drive\
  \ My Car</li>\n            <li>Norwegian Wood (This Bird Has Flown)</li>\n     \
  \       <li>You Won't See Me</li>\n            <li>Nowhere Man</li>\n          \
  \  <li>Think for Yourself</li>\n            <li>The Word</li>\n            <li>Michelle</li>\n\
  \            <li>What Goes On</li>\n            <li>Girl</li>\n            <li>I'm\
  \ Looking Through You</li>\n            <li>In My Life</li>\n            <li>Wait</li>\n\
  \            <li>If I Needed Someone</li>\n            <li>Run for Your Life</li>\n\
  \        </ul>\n    </body>\n</html>\n```\n\n接下来的样式表应用于前面的标记文档：\n\n```css\nbody\
  \ {\n    font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50, 50,\
  \ 50);\n    margin: 0;\n    padding: 0 10px;\n}\nul {\n    list-style: none;\n \
  \   margin: 0 0 10px 0;\n    padding: 10px;\n    background: yellow;\n    width:\
  \ 250px;\n}\nul li {\n    padding: 3px;\n}\nh4 {\n    margin: 10px 0;\n}\nli.rubberSoulEven\
  \ {\n    background: lightyellow;\n}\n```\n\n在下面的脚本中，你看到 jQuery 的 `each()` 方法可以像其他任何方法一样链式作用于选择器，并且你可以遍历选择器中的项：\n\
  \n```javascript\n$(document).ready(\n    function()\n    {\n        $('ul#rubberSoul\
  \ li').each(\n            function(key)\n            {\n                if (key\
  \ & 1)\n                {\n                    $(this).addClass('rubberSoulEven');\n\
  \                }\n            }\n        );\n    }\n);\n```\n\n\n\n\n遍历集合（selection）本质上与遍历数组相同，不同之处在于当你处理回调函数时，`this`\
  \ 关键字包含集合中的某个单个元素。如果你想在回调函数中使用 `jQuery` 方法，则必须通过调用 `$` 方法来对 `this` 关键字进行包装。在示例中，每个\
  \ `<li>` 元素都被选中，并使用 `each()` 方法进行遍历，然后为偶数编号的元素赋予了类名 `rubberSoulEven`。[图 5.3\n\n\
  图 5.3\n\n## 过滤集合与数组\n\n在 `jQuery` 的 API 中，有两种方法可以用于过滤数组或集合。一种方法称为 `filter()`，专门用于过滤集合中的项；另一种方法称为\
  \ `grep()`，专门用于过滤数组中的项。\n\n### 过滤集合\n\n`filter()` 方法使用选择器或回调函数从集合中移除项。接下来的文档——*示例\
  \ 5-4*，演示了 `filter()` 如何使用选择器来减少集合中的项，以及 `end()` 方法如何移除之前使用的过滤器：\n\n```\n<!DOCTYPE\
  \ HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
  \ content='IE=Edge' />\n        <meta charset='utf-8' />\n        <title>Rubber\
  \ Soul</title>\n        <script src='../jQuery.js'></script>\n        <script src='../jQueryUI.js'></script>\n\
  \        <script src='Example 5-4.js'></script>\n        <link href='Example 5-4.css'\
  \ rel='stylesheet' />\n    </head>\n    <body>\n        <h4>Rubber Soul</h4>\n \
  \       <ul id='rubberSoul'>\n            <li class='Paul'>Drive My Car</li>\n \
  \           <li class='John'>Norwegian Wood (This Bird Has Flown)</li>\n       \
  \     <li class='Paul'>You Won't See Me</li>\n            <li class='John'>Nowhere\
  \ Man</li>\n            <li class='George'>Think for Yourself</li>\n           \
  \ <li class='John'>The Word</li>\n            <li class='Paul'>Michelle</li>\n \
  \           <li class='John'>What Goes On</li>\n            <li class='John'>Girl</li>\n\
  \            <li class='Paul'>I'm Looking Through You</li>\n            <li class='John'>In\
  \ My Life</li>\n            <li class='John'>Wait</li>\n            <li class='George'>If\
  \ I Needed Someone</li>\n            <li class='John'>Run for Your Life</li>\n \
  \       </ul>\n    </body>\n</html>\n```\n\n前面的标记文档包含了以下样式表：\n\n```\nbody {\n  \
  \  font: 12px \"Lucida Grande\", Arial, sans-serif;\n    color: rgb(50, 50, 50);\n\
  \    margin: 0;\n    padding: 0 10px;\n}\nul {\n    list-style: none;\n    margin:\
  \ 0 0 10px 0;\n    padding: 10px;\n    background: yellow;\n    width: 250px;\n\
  }\nul li {\n    padding: 3px;\n}\nh4 {\n    margin: 10px 0;\n}\nli.rubberSoulJohn\
  \ {\n    background: lightblue;\n}\nli.rubberSoulPaul {\n    background: lightgreen;\n\
  }\nli.rubberSoulGeorge {\n    background: lightyellow;\n}\n```\n\n接下来的脚本演示了 `filter()`\
  \ 方法如何使用选择器指示哪些项应该在集合中：\n\n```\n$(document).ready(\n    function()\n    {\n    \
  \    $('ul#rubberSoul li')\n            .filter('li.George')\n                .addClass('rubberSoulGeorge')\n\
  \                .end()\n            .filter('li.John')\n                .addClass('rubberSoulJohn')\n\
  \                .end()\n            .filter('li.Paul')\n                .addClass('rubberSoulPaul')\n\
  \                .end();\n    }\n);\n```\n\n在前面的脚本中，选择器 `li.George` 将集合缩小为仅包含具有类名\
  \ `George` 的 `<li>` 元素；然后为这些 `<li>` 元素中的每一个添加类名 `rubberSoulGeorge`，Paul 和 John 也是如此。在尝试尝试新的\
  \ `filter()` 之前，调用 `end()` 会移除应用到集合上的最后一个过滤器。[图 5.4\n\n图 5.4\n\n### 使用回调函数过滤集合\n\
  \n与 `each()` 类似，`filter()` 方法也可以配合回调函数使用。当这样使用它时，`filter()` 与 `each()` 相似，因为它允许指定一个回调函数，该函数随后会对集合中存在的每个项执行一次。从回调函数中返回\
  \ `true` 将将该项保留在集合中，而返回 `false` 则将其移除。\n\n\n\n\n如前所述，数组是通过一种名为 `grep()` 的方法进行过滤的，该方法只能被直接调用，也就是说你只能通过\
  \ `$.grep()` 或 `jQuery.grep()` 调用它。对于此工具方法，将数组封装在美元符号方法中调用 `grep()` 是不起作用的。`grep()`\
  \ 方法通常用于在代码中直接过滤某些任意项目数组，而不是用于 DOM 选择集，因为 `filter()` 方法已经显式地存在用于过滤选择集。接接的示例 `Example\
  \ 5-6` 展示了如何通过从选择集中创建一个项目数组来使用 `grep()` 过滤数组；这样做仅仅是为了演示 `grep()` 的工作原理：\n\n```\n\
  <!DOCTYPE HTML>\n<html lang='en'>\n    <head>\n        <meta http-equiv='X-UA-Compatible'\
