  \ {\n    float: left;\n    width: 48px;\n    height: 48px;\n    background: url('images/Safari\
  \ Document.png')\n                no-repeat;\n}\nh5.finderCategoryFileTitle,\ndiv.finderCategoryFilePath\
  \ {\n    padding-left: 55px;\n}\nli.finderCategoryFileSelected {\n    background:\
  \ rgb(24, 67, 243)\n                url('images/Selected Item.png') \n         \
  \       repeat-x \n                bottom;\n    color: white;\n}\nli.finderCategoryFileSelected\
  \ a {\n    color: lightblue;\n}\n.finderCategoryFilePlaceholder {\n    background:\
  \ rgb(230, 230, 230);\n    height: 58px;\n}\n```\n\n从您在 `Example 13-1.js` 中创建的 JavaScript\
  \ 文件开始，进行以下修改并将新的 JavaScript 文件保存为 `Example 13-2.js`：\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        var selectedFile;\n        $('li.finderCategoryFile').mousedown(\n\
  \            function()\n            {\n                if (selectedFile && selectedFile.length)\n\
  \                {\n                    selectedFile.removeClass('finderCategoryFileSelected');\n\
  \                }\n                selectedFile = $(this);\n                selectedFile.addClass('finderCategoryFileSelected');\n\
  \            }\n        );\n        $('ul#finderCategoryFiles').sortable({\n   \
  \         connectWith : 'ul#finderOtherCategoryFiles',\n            placeholder\
  \ : 'finderCategoryFilePlaceholder',\n            opacity : 0.8,\n            cursor\
  \ : 'move'\n        });\n        $('ul#finderOtherCategoryFiles').sortable({\n \
  \           connectWith : 'ul#finderCategoryFiles',\n            placeholder : 'finderCategoryFilePlaceholder',\n\
  \            opacity : 0.8,\n            cursor : 'move'\n        });\n    }\n);\n\
  ```\n\n上述内容让您得到了类似于在 Figure 13.2 中看到的内容。\n\n![image](img/c13f002.jpg)\n\nFigure\
  \ 13.2 在 `Example 13-2` 中，您为 `sortable()` 方法添加了一些选项，并调整了文档的呈现以适应多个列表。\n\n```html\n\
  \ <div id='finderCategoryFileWrapper'>\n            <ul id='finderCategoryFiles'>\n\
  ```\n\n`div` 元素包含两个 `ul` 元素；每个 `ul` 元素又是一个可排序列表。每个 `ul` 元素也被制成一个跨越 `div` 元素高度的列。使用以下\
  \ CSS 来准备 `div` 元素，使其内部的 `ul` 元素能够变成列。\n\n```css\ndiv#finderCategoryFileWrapper\
  \ {\n    position: absolute;\n    top: 0;\n    right: 0;\n    bottom: 23px;\n  \
  \  left: 0;\n}\n```\n\n`div` 元素是绝对定位的，并使用四个偏移属性来暗示宽度和高度，导致 `div` 元素占据整个视口（底部 23\
  \ 像素除外）。然后，对每个 `ul` 元素应用样式。每个 `ul` 元素都向左浮动并赋予了固定尺寸。这种样式成功地将两个 `ul` 元素都转换为列，这与您在\
  \ `Example 13-1` 中看到的视觉效果相匹配，同时也解决了旧版本 IE 中一个恼人的 z-index 异常。\n\n```css\nul#finderCategoryFiles,\n\
  ul#finderOtherCategoryFiles {\n    float: left;\n    height: 100%;\n    width: 300px;\n\
  \    border-bottom: 1px solid rgb(64, 64, 64);\n    border-right: 1px solid rgb(64,\
  \ 64, 64);\n    background: #fff;\n    list-style: none;\n    margin: 0;\n    padding:\
  \ 0;\n}\n```\n\n回到 JavaScript，脚本部分非常直观。文件的第一部分处理选择；正如您稍后在 `Example 13-1` 的解释中看到的，使用了一个名为\
  \ `selectedFile` 的变量来跟踪哪个文件被选中。脚本的其余部分设置了两个可排序列表，每个列一个。\n\n```javascript\n $('ul#finderCategoryFiles').sortable({\n\
  \            connectWith : 'ul#finderOtherCategoryFiles',\n            placeholder\
  \ : 'finderCategoryFilePlaceholder',\n            opacity : 0.8,\n            cursor\
  \ : 'move'\n        });\n        $('ul#finderOtherCategoryFiles').sortable({\n \
  \           connectWith : 'ul#finderCategoryFiles',\n            placeholder : 'finderCategoryFilePlaceholder',\n\
  \            opacity : 0.8,\n            cursor : 'move'\n        });\n```\n\n`connectWith`\
  \ 选项接受一个选择器作为其值，并允许将一个列表连接到另一个列表，以便您能够在多个列表之间排序项目。\n\n然后，其他选项——`placeholder`、`opacity`\
  \ 和 `cursor`——分别用于调整每个可排序列表的呈现。正如您已经学的，`placeholder` 选项允许您在排序期间作为占位符的元素上添加自定义类名。`opacity`\
  \ 选项用于控制 `helper` 元素的透明度，它接受标准的 CSS 3 `opacity` 属性值（这在 IE 中同样有效）。`cursor` 选项用于在拖动辅助元素时更改光标。\n\
  \n在之前的代码段中，ID 为 `finderCategoryFiles` 的 `ul` 列表连接到 ID 为 `finderOtherCategoryFiles`\
  \ 的 `ul` 列表。该列表指定的 `connectWith` 选项建立了从第一个列表到第二个列表的单向连接，允许您从第一个列表拖动到第二个列表，但反之不然。要实现双向排序，您还需要在第二个\
  \ `ul` 列表上设置 `connectWith` 选项，如在之前的代码段中所示。除了 `connectWith` 选项外，第二个 `ul` 元素与第一个 `ul`\
  \ 元素具有相同的选项。\n\n如前所述，本仅讨论了 Sortable 的几个选项。Sortable 的所有选项均记录在附录 K 中。\n\n## 保存排序的状态\n\
  \njQuery UI 的 Sortable API 还缺少最后一个细节：保存排序列表的状态。这同样由 Sortable 插件涵盖。在第 7 章“AJAX”中，您学习了\
  \ jQuery 的 `serialize()` 方法，它可以自动获取表单的输入元素选择并将这些输入元素的数据序列化为数据字符串，然后通过 AJAX 请求将其提交到服务器端脚本。Sortable\
  \ 插件提供了一个类似的机制来从可排序列表中获取数据。但不是获取表单值，Sortable 插件是从每个可排序元素中获取特定的属性。默认情况下，Sortable\
  \ 插件获取 `id` 属性的值。在在本章完成的示例背景下，您会为每个 `li` 元素添加 `id` 属性，然后使用 Sortable 插件的机制将每个 `id`\
  \ 属性中存在的数据序列化为字符串，然后将其传递给指向服务器端脚本的 AJAX 请求，以便保存排序。以下代码片段显示了您在 JavaScript 端使用的代码：\n\
  \n```javascript\nvar data = $('ul').sortable(\n    'serialize', {\n        key:\
  \ 'listItem[]'\n    }\n);\n```\n\n\n\n\n在前面的代码中，为了序列化存在每个 `<li>` 元素 `id` 属性中的数据，你调用了\
  \ `sortable()` 方法，并将第一个参数设置为 `'serialize'`。对于第二个参数，你指定了一个选项字面量对象，它决定了序列化的执行方式。`key`\
  \ 选项指定了你想要为每个查询字符串参数使用的名称。这里使用了名称 `listItem[]`，在 PHP 和一些其他服务器端脚本中，这会将排序后的项目查询字符串转换为数组或哈希表。\n\
  \n在接下来的示例中，你将刚刚学到的概念应用于本章节中一直在操作的可排序文件示例中。以 `Example 13-2.html` 为基础，将该文件的内容复制到新文档中，并将其保存为\
