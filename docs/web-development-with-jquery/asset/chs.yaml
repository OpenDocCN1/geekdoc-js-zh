  ```\n\n上述 HTML 使用以下 CSS 进行样式设置：\n\n```css\nbody {\n    font: 12px 'Lucida Grande',\
  \ Arial, sans-serif;\n    background: #fff;\n    color: rgb(50, 50, 50);\n    padding:\
  \ 20px;\n    margin: 0;\n}\ntable {\n    table-layout: fixed;\n    border: 1px solid\
  \ rgb(200, 200, 200);\n    border-collapse: collapse;\n    padding: 0;\n    margin:\
