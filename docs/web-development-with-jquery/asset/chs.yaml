  \ 中的样式表，进行以下修改并将结果保存到新文件中，作为 *Example 13-2.css*：\n\n\n\n\n```css\nhtml,\nbody {\n\
  \    width: 100%;\n    height: 100%;\n}\nbody {\n    font: normal 12px 'Lucida Grande',\
  \ Arial, sans-serif;\n    background: rgb(189, 189, 189)\n                url('images/Bottom.png')\
