  \                            $('<span/>').text(slideInCollection)\n            \
  \            )\n                );\n            slideInCollection++;\n        }\n\
  \    );\n```\n\n首先，每个类名为 `slide` 的元素被赋予一个 id，标识集合的偏移和幻灯片的偏移。类为 `slideshowControls`\
  \ 的 `<ul>` 为每个幻灯片提供一个新的 `<li>` 元素。每个 `<li>` 元素填充了一个 `<span>` 元素，该元素包含幻灯片的编号。\n\n\
  你可以通过以下代码找到 `slideshowControls` `<ul>` 中的第一个 `<li>` 元素，并赋予它类名 `slideshowControlActive`。\n\
  \n```\n node.find('ul.slideshowControls li:first')\n                     .addClass('slideshowControlActive');\n\
  ```\n\n接下来，`slideshowControls` `<ul>` 中的每个 `<li>` 元素提供了 `hover` 和 `click` 事件。`hover`\
  \ 事件简单地切换 `slideshowControlOn` 类名的存在性。\n\n```\n node.find('ul.slideshowControls\
  \ li')\n        .hover(\n            function()\n            {\n               \
  \ $(this).addClass('slideshowControlOn');\n            },\n            function()\n\
  \            {\n                $(this).removeClass('slideshowControlOn');\n   \
  \         }\n        )\n```\n\n`click` 事件控制当用户点击幻灯片控件时会发生什么，表示用户想要再次查看特定的幻灯片。\n\n\
  在 `click` 事件的回调函数中，你可以使用现有的 `slideshows` 全局变量来引用正确的幻灯片对象实例。你可以通过许多方法来实现——这种方法最能说明正在发生什么。\n\
  \n此代码块中的第一条语句使用 `transitioning` 属性检查是否正在进行动画。如果正在进行动画，则什么都不会发生，且 `click` 事件会被忽略。\n\
  \n\n\n\n\n```javascript\n .click(\n            function()\n            {\n     \
  \           if (!slideshows[slideCollection].transitioning)\n                {\n\
  ```\n\n接下来，你检查是否存在活跃状态的 `resumeTimer`；`resumeTimer` 控制幻灯片切换之间的间隔时间。如果定时器正在运行，则通过调用原生\
  \ `clearTimeout()` 方法将其清除。\n\n```javascript\n if (slideshows[slideCollection].resumeTimer)\n\
  \                    {\n                        clearTimeout(slideshows[slideCollection].resumeTimer);\n\
  \                    }\n```\n\n将 `transitioning` 属性设置为 `true`，以表示正在进行幻灯片动画。然后，将\
  \ `isInterrupted` 属性设置为 `true`，表示用户点击了幻灯片控件并中断了幻灯片。\n\n```javascript\n slideshows[slideCollection].transitioning\
  \ = true;\n                    slideshows[slideCollection].isInterrupted = true;\n\
  ```\n\n`<li>` 元素的 jQuery 对象引用存储在名为 `li` 的变量中。\n\n```javascript\n var li = $(this);\n\
  ```\n\n当前幻灯片中所有带有 `slideshowControlActive` 类的 `<li>` 元素都移除了该类。\n\n```javascript\n\
  \ node.find('ul.slideshowControls li')\n                        .removeClass('slideshowControlActive');\n\
  ```\n\n通过类名 `slide` 和 `:visible` 伪类（jQuery 特有）标识的当前可见幻灯片将通过动画淡出。\n\n```javascript\n\
  \ node.find('.slide:visible')\n                        .fadeOut('slow');\n```\n\n\
  从当前 `<li>` 元素内部的文本获取当前幻灯片的偏移量数字。\n\n```javascript\n var slideInCollection = parseInt($(this).text());\n\
  ```\n\n创建一个 `counter` 变量，以便当幻灯片恢复时，`counter` 属性包含指向正确幻灯片的正确引用。\n\n```javascript\n\
  \ var counter = slideInCollection + 1;\n```\n\n如果 `slideInCollection` 中的数字加 1 超过了集合中幻灯片的长度，则将计数器重置为\
  \ 1。这使得幻灯片能够循环从最后一张幻灯片回到第一张幻灯片。\n\n```javascript\n var resetCounter = (\n      \
  \                   (slideInCollection + 1) >\n                         node.find('ul.slideshowControls\
  \ li').length\n                    );\n                    if (resetCounter)\n \
  \                   {\n                        counter = 1;\n                  \
  \  }\n```\n\n将 `counter` 变量的值移动到 `counter` 属性中，以便幻灯片在自动恢复时能够继续正常工作。\n\n```javascript\n\
  \ slideshows[slideCollection].counter = counter;\n```\n\n然后，用户点击的幻灯片通过动画淡入。该幻灯片通过其集合编号和幻灯片编号进行引用。\n\
  \n```javascript\n $('#slide-' + slideCollection + '-' + slideInCollection)\n   \
  \                     .fadeIn(\n                        'slow',\n              \
  \          function()\n                        {\n```\n\n将 `slideshowControlActive`\
  \ 类名添加到 `li` 变量中，该变量持有当前 `<li>` 元素 jQuery 对象的引用。\n\n```javascript\n li.addClass('slideshowControlActive');\n\
  ```\n\n现在动画已完成，将 `transitioning` 属性设置为 `false`，表示目前没有正在进行的动画。\n\n```javascript\n\
  \ slideshows[slideCollection].transitioning = false;\n```\n\n由于动画已完成，下一步是恢复定时器。调用\
  \ `setTimeout()` 将触发幻灯片在 5 秒后自动发生切换，就好像幻灯片从未被中断过一样。下一次幻灯片切换将在额外的 5 秒后发生。\n\n```javascript\n\
  \ slideshows[slideCollection].resumeTimer = setTimeout(\n                      \
  \          'slideshows[' + slideCollection + '].resume();',\n                  \
  \              5000\n                            );\n                        }\n\
  \                    );\n                }\n            }\n        );\n```\n\n下一块代码是一个\
  \ API 方法。如果幻灯片被中断，它将恢复幻灯片。\n\n```javascript\n this.resume = function()\n    {\n\
  \        this.isInterrupted = false;\n        this.transition();\n    };\n```\n\n\
  此方法仅在用户点击控件手动翻到幻灯片时使用。它将 `isInterrupted` 属性重置为 `false`，然后通过调用 `transition()` 方法触发下一次切换。\n\
  \n`transition()` 方法用于一张幻灯片到下一一张的正常切换，循环不断地显示所有幻灯片。\n\n```javascript\n this.transition\
  \ = function()\n    {\n```\n\n如果 `isInterrupted` 属性为 `true`，则方法返回，且什么都不会发生。这意味着中断幻灯片的过程尚未完成，不应受到干扰。\n\
  \n```javascript\n if (this.isInterrupted)\n        {\n            return;\n    \
  \    }\n```\n\n与处理点击幻灯片控件的代码块一样，你第一要做的是调用 `fadeOut()` 隐藏当前可见的幻灯片。你可以通过类名 `slide`\
  \ 和 `:visible` 伪类在当前幻灯片找到该幻灯片。\n\n```javascript\n node.find('.slide:visible')\n\
  \            .fadeOut('slow');\n```\n\n然后，当前幻灯片中所有的 `<li> slideshowControls` 失去类名\
  \ `slideshowControlActive`。\n\n```javascript\n node.find('ul.slideshowControls li')\n\
  \            .removeClass('slideshowControlActive');\n```\n\n最后，新幻灯片通过调用 `fadeIn()`\
  \ 进行动画；它通过其集合编号（`slideCollection`）和幻灯片编号（`this.counter`）进行引用。\n\n```javascript\n\
  \ $('#slide-' + slideCollection + '-' + this.counter).fadeIn(\n            'slow',\n\
  \            function()\n            {\n```\n\n当新幻灯片完成 `fadeIn()` 动画时，`ul slideshowControls`\
  \ 中对应的 `li` 控件接收 `slideshowControlActive` 类。你可以通过比较每个 `<li>` 元素的文本与 `counter` 属性的当前值来找到当前控件。\n\
  \n```javascript\n node.find('ul.slideshowControls li').each(\n                 \
  \   function()\n                    {\n                        if (parseInt($(this).text())\
  \ ==\n                            slideshows[slideCollection].counter)\n       \
  \                 {\n                            $(this).addClass('slideshowControlActive');\n\
  \                        }\n                    }\n                );\n```\n\n`counter`\
  \ 属性加 1 以准备下一张幻灯片。\n\n```javascript\n slideshows[slideCollection].counter++;\n```\n\
  \n如果 `counter` 属性的新值大于幻灯片的总数，则将其重置为 1，这样当显示最后一张幻灯片时，`counter` 属性就会从最后一张幻灯片回到第一张幻灯片。\n\
  \n```javascript\n var resetCounter = (\n                    slideshows[slideCollection].counter\
  \ >\n                    node.find('ul.slideshowControls li').length\n         \
  \       );\n                if (resetCounter)\n                {\n             \
  \       slideshows[slideCollection].counter = 1;\n                }\n```\n\n创建一个新的定时器，从这次切换运行到下一次切换。\n\
  \n```javascript\nsetTimeout(\n                    'slideshows[' + slideCollection\
  \ + '].transition();',\n                    5000\n                );\n         \
  \   }\n        );\n    };\n```\n\n调用 `this.transition()` 启动幻灯片运行：\n\n```javascript\n\
  \ this.transition();\n```\n\n最后，在脚本末尾，当 DOM 准备就同时会触发 `ready` 事件。它检查是否存在带有类名 `slideshow`\
  \ 的元素；如果有，则对这些元素调用 `$.slideshow()` jQuery 插件方法。\n\n```javascript\n$(document).ready(\n\
  \    function()\n    {\n        if ($('.slideshow').length)\n        {\n       \
  \     $('.slideshow').slideshow();\n        }\n    }\n);\n```\n\n\n\n\n在本章中，你学习了如何创建和使用插件来制作交互式幻灯片，例如那些用于许多网站首页显示广告的幻灯片。你创建的插件可以处理文档中的一个或多个不同的幻灯片，每个幻灯片包含两个或更多幻灯片。通过使用原型编程风格，你可以为每个幻灯片创建不同的对象，每个对象都有自己的属性和状态。\n\
  \n## 练习题\n\n1. 使用 `isInterrupted` 属性跟踪幻灯片是否被用户中断的目的是什么？\n\n2. 使用 `transitioning`\
  \ 属性跟踪切换动画是否正在运行的目的是什么？\n\n3. 描述该插件如何自动创建用于点击特定幻灯片的控件。每个控件的 `id` 名称中包含哪些信息？每个控件的文本中包含哪些可用信息？\n\
  \n额外加分：创建一个你自己的版本的幻灯片插件，并包含以下选项：\n\n* 启动、暂停或恢复幻灯片。\n* 销毁幻灯片。\n* 设置幻灯片切换之间的自定义时间。\n\
  * 设置自定义动画。\n\n# 第 21 章\n\n### 配合 HTML5 音频和视频\n\n从万维网早期开始，万维网真正的兴起是因为文本信息可以在与图形等媒体元素相同的页面上以格式化方式显示。延续这一传统，HTML5\
  \ 引入了简单且标准的 `<video>` 和 `<audio>` 元素用于使用这些类型的媒体。遗憾的是，浏览器的支持是一项持续的斗争。\n\n在本章中，你将学习如何使用\
  \ `MediaElement` 插件，它利用了当今浏览器中提供的媒体功能，并包含了几个自定义插件以为旧浏览器提供支持。\n\n## 下载 MediaElement\
  \ 插件\n\n`MediaElement` 插件方便地位于 `http://www.mediaelementjs.com/`。所有所需的材料都可以一次性下载。从下载包的\
  \ build 目录中获取 `mediaelement-and-player.min.js` 和 `mediaelement.min.css` 文件供项目使用。这些文件是功能所需的最少文件；你的用例可能需要的额外文件将在章后的“实现\
  \ h.264 视频内容”部分进行说明。\n\n## 配置 MediaElement 插件\n\n`MediaElement` 插件提供了近二十种配置选项。在这里你关注其中几个选项；完整列表可以在\
  \ 附录 U，“MediaElement”中找到。开始之前，请根据 `www.wrox.com/go/webdevwithjquery` 源材料中的 `Example\
  \ 21-1.html` 创建以下标记：\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>MediaElement Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../MediaElement/mediaelement-and-player.min.js'></script>\n\
  \        <script src='Example 21-1.js'></script>\n        <link href='../MediaElement/mediaelementplayer.min.css'\
  \ rel='stylesheet' />\n        <link href='Example 21-1.css' rel='stylesheet' />\n\
  \    </head>\n    <body>\n        <div id='container'>\n            <video src='testvideo1.mp4'\
  \ width='320' height='240'></video>\n        </div>\n    </body>\n</html>\n```\n\
  \n虽然引用了 CSS，但规则并未影响此示例的呈现。以下 JavaScript（在 `Example 21-1.js` 中）用于配置和激活 `MediaElement`\
  \ 插件：\n\n```javascript\n$(document).ready(\n    function()\n    {\n        $('video,audio').mediaplayerelement(\n\
  \            {\n                clickToPlayPause: true,\n                features:\
  \ ['playpause', 'current', 'progress', 'volume'],\n                poster: 'images/FilmMarker.jpg'\n\
  \            }\n        );\n    }\n);\n```\n\n代码结果显示在 图 21.1 中。\n\n![image](img/c21f001.jpg)\n\
  \n图 21.1\n\n首先使用 HTML5 `<video>` 元素指定媒体文件和尺寸。\n\n```html\n<video src='testvideo1.mp4'\
  \ width='320' height='240'></video>\n```\n\n然后使用 jQuery 选择页面上所有的 `<video>` 和 `<audio>`\
  \ 元素，通过 `clickToPlayPause`、`features` 和 `poster` 配置选项在它们上激活 `MediaElement` 插件。\n\
  \n```javascript\n $('video,audio').mediaplayerelement(\n            {\n        \
  \        clickToPlayPause: true,\n                features: ['playpause', 'current',\
  \ 'progress', 'volume'],\n                poster: 'images/FilmMarker.jpg'\n    \
  \        }\n               ); \n```\n\n`features` 选项将在“自定义播放控件”部分进行讨论。`clickToPlayPause`\
  \ 选项是不言自明的的；就像著名的 YouTube 功能一样，你可以点击视频的任何位置来播放或暂停。`poster` 选项允许你在视频开始之前显示图像。如果没有此选项，`MediaElement`\
  \ 插件将默认显示视频的第一帧。\n\n## 创建支持旧浏览器视频/音频的 HTML 结构\n\n你可能注意到上一个示例使用了 h.264 (MP4) 视频文件。下一节将讨论这种格式，它是\
  \ HTML5 视频规范支持的三格式之一（h264、Ogg 和 WebM）。在本节中，你将看到使用 `MediaElement` 插件的最佳理由之一：它的能力。查看以下标记（来自\
  \ `Example 21-2.html`）：\n\n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
  \    <head>\n        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <title>MediaElement Plugin</title>\n        <script src='../jQuery.js'></script>\n\
  \        <script src='../MediaElement/mediaelement-and-player.min.js'></script>\n\
  \        <script src='Example 21-2.js'></script>\n        <link href='../MediaElement/mediaelementplayer.min.css'\
  \ rel='stylesheet' />\n        <link href='Example 21-2.css' rel='stylesheet' />\n\
  \    </head>\n    <body>\n        <div id='container'>\n            <video width='320'\
  \ height='240'>\n               <source type='video/mp4' src='testvideo1.mp4'></source>\n\
  \               <source type='video/wmv' src='testvideo1.wmv'></source>\n      \
  \         <object width='320' height='240' type='application/x-shockwave-flash'\n\
  \                   data='flashmediaelement.swf'>\n                   <param name='movie'\
  \ value='flashmediaelement.swf' />\n                   <param name='flashvars' value='controls=true&file=testvideo1.mp4'\
  \ />\n               </object>\n            </video>\n        </div>\n    </body>\n\
  </html>\n```\n\n注意，源不再在 `<video>` 元素中指定；现在你有了多个 `<source>` 元素。`MediaElement` 插件首先尝试加载原生支持的格式，然后是受\
  \ Silverlight 插件支持的格式。此外，此示例标记包含了在没有任何 `<source>` 元素被支持时回退到 Flash 插件的备选方案。\n\n\n\
  \n\n`h.264` 视频格式已成为数字视频新的事实上的标准。它被 YouTube、Apple 以及空中电视 HDTV 供应商所使用。它也是蓝光光片的编码标准之一。在本节中，你将学习如何以这种格式转换并分发你的视频内容。\n\
  \n## 使用 Handbrake 或 QuickTime 进行编码\n\n你的视频内容的格式取决于你是获取还是生成了视频内容（以及内容是从哪个设备设备新的）。如果你想使用\
  \ `h.264` 格式并需要从其他视频格式转换，你需要获取一个视频转换工具。推荐的工具有 Handbrake（[`https://handbrake.fr/`](https://handbrake.fr/))）和\
  \ QuickTime (`https://www.apple.com/quicktime/`）。如果你没有使用 Mac，明确推荐使用 Handbrake。此外，Mac\
  \ 上的 `QuickTime Player`（v. 10+）允许你从 `File` 菜单`Export`，但 Apple 最近（自 10.3 版本以来）减少了可用功能。每个工具都包含设备预设，以便在针对各种能力的桌面电脑和移动设备用户时产生预期的视频尺寸和质量。\n\
  \n## 使用 HTML5 <video> 元素\n\nHTML5 `<video>` 元素规范允许多个 `<source>` 元素，如节所示。通过这种方式，你可以为三个支持的格式（`h.264`、`Ogg`\
  \ 和 `WebM`）中的每一个添加一个元素，并确保在所有现代浏览器上播放内容。\n\n## 使用 Flash Player 插件\n\n为了避免以多种格式编码视频内容，你可以添加备用标记，指定\
  \ `MediaElement` 插件应使用 Flash 播放你的 `h.264` 视频文件：\n\n```\n <object width='320' height='240'\
  \                          type='application/x-shockwave-flash'\n              \
  \         data='flashmediaelement.swf'>\n                   <param name='movie'\
  \ value='flashmediaelement.swf' />\n                   <param name='flashvars'\n\
  \                          value='controls=true&file=testvideo1.mp4' />\n      \
  \         </object>\n```\n\n此插件利用 `flashmediaelement.swf` Flash 视频来播放你的内容，你的文件名通过\
  \ `flashvars` 参数传递。\n\n## 使用微软的 Silverlight 插件\n\n虽然你可以类似于 Flash 插件的方式包含 Silverlight\
  \ 插件的 `<object>` 元素标记，但 Silverlight 需要许多额外的参数，这些参数通常最好由 `MediaElement` 插件创建。Silverlight\
  \ 在不支持此类格式的浏览器中提供对 Windows Media Video 等格式的支持。\n\n## 自定义播放器控件\n\n如前所述，`MediaElement`\
  \ 插件提供了许多配置选项。`features` 选项自定义了显示给用户的哪些控件。\n\n```\nfeatures: ['playpause', 'current',\
  \ 'progress', 'duration', 'volume', 'fullscreen']\n```\n\n大多数可用控件或功能都是一言自足的，前面的代码分别表示播放/暂停按钮并显示当前位置、进度条、视频长度、音量控制和全屏按钮。\n\
  \n以下是可以在 `features` 数组中提供的常用选项：\n\n* `playpause`——一个用于播放或暂停媒体的控制按钮，根据媒体的状态切换其图标到相应的操作。\n\
  * `current`——显示媒体的当前位置，采用典型的 HH:MM:SS 格式。\n* `progressbar`——一个填充条控件，用于根据其持续时间显示媒体的当前位置。\n\
  * `duration`——显示媒体的长度，采用典型的 HH:MM:SS 格式。\n* `volume`——一个带有集成滑块的控制按钮，用于设置音量。\n* `tracks`——一个用于切换\
  \ `<video>` 元素内部 `<track>` 元素指定的说明或字幕显示的控制按钮。需要注意的是，浏览器对本地文本轨道文件有不同的安全策略。\n* `speed`——一个带有选项菜单的速度控制按钮，用于设置播放速度。\n\
  \n## 控制媒体下载的开始时间\n\n在决定媒体内容何时应该用户浏览器中下载（或缓冲）时，应该考虑一些因素；其中包括视频的大小和用户播放媒体的预期概率。实际的控制由\
  \ `<video>` 或 `<audio>` 元素的可选 `preload` 属性的值来指示。\n\n```\n <video src='testvideo1.mp4'\
  \ width='320' height='240'\n                 preload='metadata'></video>\n```\n\n\
  以下是可能的值：\n\n* `(未指定 preload 属性)`允许浏览器决定是否应该预加载媒体数据。\n* `none`——不应预加载任何媒体数据。建议为视频内容提供\
  \ `poster` 属性或选项，除非你希望用户在内容播放激活之前看到一个纯黑色帧。\n* `metadata`——应该下载内容的元数据，但不应预加载媒体数据。此值允许元素显示内容的第一帧、持续时间和轨道信息，是一个推荐的最小值。\n\
  * `auto`（也称为空值或无值的属性）——应该下载完整的媒体数据。\n\n你可能注意到了每个值定义中的“应该”一词。HTML 规范规定，浏览器应该将这些值视为提示而非要求。例如，移动设备浏览器无论取值值如何，通常都会避免预加载数据。\n\
  \n## 总结\n\n在本章中，你学习了 `MediaElement` 插件以及如何使用它在浏览器中启用一致的音频视频内容。你学习了 HTML5 `<video>`\
  \ 和 `<audio>` 元素。\n\n你学习了各种浏览器中 HTML5 `<video>` 元素支持的三种视频格式。你更多地了解了其中一种格式 `h.264`，并编写了显示这种视频格式的代码。\n\
  \n你学习了额外的 `MediaElement` 插件以支持 Flash 和 Silverlight 内容，并看到了多个 `<source>` 元素如何使浏览器回退到支持的格式。\n\
  \n最后，你学习了 `MediaElement` 插件的常用配置选项，以及通过 `preload` 属性请求控制内容下载时间的能力。\n\n## 练习\n\n\
  1. `MediaElement` 插件规范了浏览器对哪两个 HTML5 元素支持？\n2. 哪种 HTML5 元素可以在媒体元素内部重复，允许浏览器渲染支持的格式？\n\
  3. HTML5 规范中支持哪三种视频格式？\n4. 举出启用说明或字幕的 `MediaElement` 配置选项。\n5. 哪种 HTML5 属性指定媒体内容何时应该下载到浏览器中？\n\
  \n# 第 22 章\n\n创建一个简单的 WYSIWYG 编辑器\n\n许多基于 Web 的 WYSIWYG（所见即所得）编辑器一度流行，但随后被界面更好或功能更多的编辑器取代。这些编辑器中的某些使用了\
  \ `<textarea>` 元素，或者在使用格式功能时修改 DOM 元素的 `innerHTML`。\n\n在本章中，你将学习一个改变编辑器面貌的属性，以及你如何结合\
  \ jQuery 使用它创建一个简单的 WYSIWYG 编辑器。\n\n\n\n\n从属性的 HTML 示例开始（`Example 22-1.html`）：\n\
  \n```html\n<!DOCTYPE HTML>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n    <head>\n\
  \        <meta http-equiv='content-type'\n            content='application/xhtml+xml;\
  \ charset=utf-8' />\n        <meta http-equiv='content-language' content='en-us'\
  \ />\n        <meta charset='utf-8' />\n        <title>WYSIWYG Editor 1</title>\n\
  \        <link href='Example 22-1.css' rel='stylesheet' />\n    </head>\n    <body>\n\
  \        <div id='container' contenteditable='true'>\n        </div>\n    </body>\n\
  </html>\n```\n\n添加以下用于样式呈现的 CSS（`Example 22-1.css`）：\n\n```css\nbody {\n    font:\
  \ 12px Arial, sans-serif;\n    background: #fff;\n    color: rgb(50, 50, 50);\n\
  }\ndiv#container {\n    position: absolute;\n    top: 10%;\n    left: 10%;\n   \
  \ height: 80%;\n    width: 80%;\n    padding: 5px;\n    border: 1px solid black;\n\
  \    border-radius: 3px;\n}\n```\n\n该示例的代码编写到此完成。虽然你可以使用 JavaScript 动态切换元素是否可编辑，但对于\
  \ `contenteditable` 属性的最简单示例，你不需要任何 JavaScript。你只需将该属性添加到 `<div>` 元素中。\n\n```html\n\
  \ <div id='container' contenteditable='true'>\n```\n\nCSS 为 `<body>` 设置了一些默认样式，然后将可编辑元素置在页面中央，并带有细的、圆角的（在大多数浏览器中）边框和一些内边距，以防止文字贴紧边界。\n\
  \n前面的代码生成了图 22.1 所示的文档。\n\n![image](img/c22f001.jpg)\n\n**图 22.1**\n\n## 创建用于加粗、斜体、下划线、字体和字号的按钮\n\
