  \ 的 `<div` 之中的 `<div` 被赋予百分比宽度，这同样指示了进度。\n\n```\n $('div#finderDragAndDropDialogueProgressMeter\
  \ div')\n                            .css('width', progress + '%');\n          \
  \          }\n                },\n                false\n            );\n```\n\n\
  接下来，`upload` 对象上绑定了 `load` 事件，用于处理上传进度达到 100% 时发生的情况。\n\n```\n this.http.upload.addEventListener(\n\
  \                'load',\n                function(event)\n                {\n \
