  \ jQuery 方法：`fadeIn()`、`fadeOut()` 和 `fadeToggle()` 方法。\n\n## 渐变元素\n\n渐变元素是 `jQuery`\
  \ 提供的另一种显示和隐藏元素的变体，它通过动画让元素从完全不透明变为完全透明。在淡入（fade in）开始或淡出（fade out）完成后，`display`\
  \ 属性会进行切换，因此淡出的元素不再占据文档空间，而正在淡入的元素在文档中是可见的。\n\n该 API 与之前节的方法相同；只是这些方法的名称以及这些方法使用的动画不同。`jQuery`\
  \ 提供了三种渐变元素的方法：`fadeIn()`、`fadeOut()` 和 `fadeToggle()`。\n\n下面的示例演示了 `jQuery` 提供的三个渐变方法。再次，该示例的概念与\
  \ `Example 8-1` 和 `Example 8-2` 相同，仅进行了一些微调，以便你可以观察使用 `jQuery` 渐变动画可以实现。下面的示例是源码中的\
  \ `Example 8-3`。为了节省空间，仅引用了每个文档更改的部分。\n\n```\n <input type='submit'\n          \
  \                 name='exampleAnimationShow'\n                           id='exampleAnimationShow'\n\
  \                           value='Fade In' />\n                    <input type='submit'\n\
  \                           name='exampleAnimationHide'\n                      \
  \     id='exampleAnimationHide'\n                           value='Fade Out' />\n\
  \                    <input type='submit'\n                           name='exampleAnimationToggle'\n\
  \                           id='exampleAnimationToggle'\n                      \
  \     value='Toggle Fade' />\n                </div>\n            </fieldset>\n\
  ```\n\n在 `Example 8-3.html` 中，只有 `submit` `<input>` 元素的 `value` 属性被修改了。这些属性被赋予了标签，反映了按下\
  \ `submit` `<input>` 元素时发生的渐变动作。\n\nCSS 文档中唯一的修改再次是对话框中 `<h4>` 元素的背景颜色；这次 `background`\
  \ 被设置为 `yellow`。\n\n```\ndiv#exampleDialog h4 {\n    border: 1px solid rgb(50, 50,\
  \ 50);\n    background: yellow;\n    border-radius: 4px;\n    padding: 5px;\n  \
  \  margin: 0 0 10px 0;\n}\n```\n\n\n` 标签中似乎不完整（在开头处中断了），我根据您提供的结构为您翻译了已给出的部分：\n\n\
  [content]\n```javascript\n$(document).ready(\n    function()\n    {\n        var\
