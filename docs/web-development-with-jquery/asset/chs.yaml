  \                        <option value='easeInOutBack'>回弹缓缓冲</option>\n        \
  \                <option value='easeInBounce'>弹跳缓入</option>\n                  \
  \      <option value='easeOutBounce'>弹跳缓出</option>\n                        <option\
  \ value='easeInOutBounce'>弹跳缓缓冲</option>\n                    </select>\n      \
  \              <label for='exampleAnimationDuration'>\n                        时长：\n\
  \                    </label>\n                    <input type='range'\n       \
  \                    value='5000'\n                           min='100'\n      \
  \                     max='10000'\n                           step='100'\n     \
  \                      name='exampleAnimationDuration'\n                       \
  \    id='exampleAnimationDuration' />\n                    <input type='submit'\n\
  \                           name='exampleAnimationShow'\n                      \
  \     id='exampleAnimationShow'\n                           value='显示' />\n    \
  \                <input type='submit'\n                           name='exampleAnimationHide'\n\
  \                           id='exampleAnimationHide'\n                        \
  \   value='隐藏' />\n                    <input type='submit'\n                  \
  \         name='exampleAnimationToggle'\n                           id='exampleAnimationToggle'\n\
  \                           value='切换' />\n                </div>\n            </fieldset>\n\
  \        </form>\n    </body>\n</html>\n```\n\n以下样式表应用于上述标记标记文档：\n\n```css\nbody\
  \ {\n    font: 12px 'Lucida Grande', Arial, sans-serif;\n    background: #fff;\n\
  \    color: rgb(50, 50, 50);\n}\ndiv#exampleDialogCanvas {\n    height: 400px;\n\
  \    position: relative;\n    overflow: hidden;\n}\ndiv#exampleDialog {\n    box-shadow:\
  \ 0 7px 100px rgba(0, 0, 0, 0.7);\n    border-radius: 4px;\n    width: 300px;\n\
  \    height: 200px;\n    position: absolute;\n    padding: 10px;\n    top: 50%;\n\
  \    left: 50%;\n    z-index: 1;\n    margin: -110px 0 0 -160px;\n    background:\
  \ #fff;\n}\ndiv#exampleDialog h4 {\n    border: 1px solid rgb(50, 50, 50);\n   \
  \ background: lightblue;\n    border-radius: 4px;\n    padding: 5px;\n    margin:\
  \ 0 0 10px 0;\n}\ndiv#exampleDialog p {\n    margin: 10px 0;\n}\ninput#exampleAnimationDuration\
  \ {\n    vertical-align: middle;\n}\n```\n\n以下脚本演示了 jQuery 的 `show()`、`hide()` 和\
  \ `toggle()` 方法提供的动画：\n\n\n\n\n\n```\n$(document).ready(\n    function()\n    {\n\
  \        var animating = false;\n        $('input#exampleAnimationShow').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                if (!animating)\n                {\n                    animating\
  \ = true;\n                    var easing = $('select#exampleAnimationEasing').val();\n\
  \                    var duration = parseInt($('input#exampleAnimationDuration').val());\n\
  \                    $('div#exampleDialog').show(\n                        duration,\n\
  \                        easing,\n                        function()\n         \
  \               {\n                            animating = false;\n            \
  \            }\n                    );\n                }\n            }\n     \
  \   );\n        $('input#exampleAnimationHide').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                if (!animating)\n\
  \                {\n                    animating = true;\n                    var\
  \ easing = $('select#exampleAnimationEasing').val();\n                    var duration\
  \ = parseInt($('input#exampleAnimationDuration').val());\n                    $('div#exampleDialog').hide(\n\
  \                        duration,\n                        easing,\n          \
  \              function()\n                        {\n                         \
  \   animating = false;\n                        }\n                    );\n    \
  \            }\n            }\n        );\n        $('input#exampleAnimationToggle').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                if (!animating)\n                {\n                    animating\
  \ = true;\n                    var easing = $('select#exampleAnimationEasing').val();\n\
  \                    var duration = parseInt($('input#exampleAnimationDuration').val());\n\
  \                    $('div#exampleDialog').toggle(\n                        duration,\n\
  \                        easing,\n                        function()\n         \
  \               {\n                            animating = false;\n            \
  \            }\n                    );\n                }\n            }\n     \
  \   );\n        $('input#exampleAnimationDuration').change(\n            function()\n\
  \            {\n                $(this).attr('title', $(this).val());\n        \
  \    }\n        );\n    }\n);\n```\n\n上述示例是源代码下载材料中的`Example 8-1`。图 8.1 显示了在浏览器中加载\
  \ `Example 8-1.html` 的结果。\n\n在 `Example 8-1` 中，你创建了一个应用程序，允许你测试 `show()`、`hide()`\
  \ 和 `toggle()` 方法中最常用的各个方面。这包括测试默认 jQuery 以及作为 jQuery UI 部分提供的各种缓动扩展所提供的各种可能的缓动类型（easing）。jQuery\
  \ 提供的所有缓动效果都指定在你创建的 `<select>` 元素中，以便测试每种缓动效果。\n\n除了缓动之外，你还通过 `<input>` 范围元素为每个方法提供持续时间。持续时间参数以毫秒为单位；1,000\
  \ 毫秒等于 1 秒。除了提供一个表示毫秒数的整数值外，你还可以提供持续时间预设字符串。jQuery 提供了三个持续时间预设字符串：`'slow'`、`'normal'`\
  \ 和 `'fast'`。如果没有指定持续时间，默认持续时间为预设 `'normal'`。\n\n你创建的脚本首先设置了一个变量来跟踪动画是否正在进行。该变量的作用是防止在动画进行期间通过反复点击任何按钮导致多个动画堆积并一个接一个地发生。当动画启动时，`animating`\
  \ 变量被设置为 `true`，这防止了初始动画进行期间发生额外的动画。当动画完成时，将执行给每个方法的回调函数，并将 `animating` 变量重置为 `false`，从而允许新动画发生。\n\
  \n```\n$(document).ready(\n    function()\n    {\n        var animating = false;\n\
  ```\n\n![image](img/c08f001.jpg)\n\n**图 8.1**\n\n接下来，你在 id 名为 `exampleAnimationShow`\
  \ 的 `<input>` 元素上设置了 `click()` 事件。\n\n```\n $('input#exampleAnimationShow').click(\n\
  \            function(event)\n            {\n                event.preventDefault();\n\
  \                if (!animating)\n                {\n                    animating\
  \ = true;\n                    var easing = $('select#exampleAnimationEasing').val();\n\
  \                    var duration = parseInt($('input#exampleAnimationDuration').val());\n\
  \                    $('div#exampleDialog').show(\n                        duration,\n\
  \                        easing,\n                        function()\n         \
  \               {\n                            animating = false;\n            \
  \            }\n                    );\n                }\n            }\n     \
  \   );\n```\n\n当 `click` 发生的第一件事是执行 `event.preventDefault()` 方法。这防止了 `<form>` 提交到\
  \ `action` 属性指定的 URL。\n\n```\n animating = true;\n```\n\n然后你检查 `animating` 变量以确保动画没有进行。如果\
  \ `animating` 变量的值为 `false`，则执行依赖于该条件的后续语句。如果 `animating` 变量的值为 `true`，则什么都不会发生，提供\
  \ `click()` 方法的回调函数结束执行。\n\n```\n var easing = $('select#exampleAnimationEasing').val();\n\
  ```\n\nid 名为 `exampleAnimationEasing` 的 `<select>` 元素的值赋值给 `easing` 变量，该变量随后提供给\
  \ `show()` 方法的缓动参数。\n\n```\n var duration = parseInt($('input#exampleAnimationDuration').val());\n\
  ```\n\n同样，id 名为 `exampleAnimationDuration` 的 `<input>` 元素的值通过 `parseInt()` 转换为整数数据类型并赋值给\
  \ `duration` 变量。`duration` 变量随后作为 `show()` 方法的持续时间参数。\n\n```\n $('div#exampleDialog').show(\n\
  \                        duration,\n                        easing,\n          \
  \              function()\n                        {\n                         \
  \   animating = false;\n                        }\n                    );\n```\n\
  \n`show()` 方法被应用于 id 名为 `exampleDialog` 的 `<div>`。\n\n提供给 `show()` 方法的所有参数都是可选的。如果没有参数调用\
  \ `show()` 方法，则不会发生动画，仅设置 CSS `display` 属性来显示元素；对于 `<div>` 元素 `display` 属性将设置为 `block`。如果只指定了持续时间参数，显示元素的动作将通过提供的持续时间和默认缓动\
  \ `'swing'` 进行动画。\n\n提供给 `show()` 方法的回调函数在动画完成后执行。在这种情况下，回调函数将 `animating` 变量的值重置为\
  \ `false`，以便发生额外的动画。\n\n脚本的其余部分在两个额外的 `<input>` 元素上重复了分配给 `exampleAnimationShow`\
  \ 的 `<input>` 元素的 `click()` 事件逻辑。id 名为 `exampleAnimationHide` 的 `<input>` 接收类似的\
  \ `click()` 事件，将 `show()` 方法替换为 `hide()` 方法。同样，id 名为 `exampleAnimationToggle` 的\
  \ `<input>` 元素接收 `click()` 事件，将 `show()` 方法替换为 `toggle()` 方法，这完成了对 `show()`、`hide()`\
  \ 和 `toggle()` 方法的演示。\n\n## **滑动元素**\n\n\n\n\njQuery 还提供了通过滑动来动画元素的能力。`jQuery` 中的\
  \ `Sliding`（滑动）是对元素的高度。`Sliding down`（向下滑动）将元素的高度从无变为正常高度。`Sliding up`（向上滑动）将元素的高度从正常高度变为无。这两个动作通过\
  \ `slideDown()`、`slideUp()` 和 `slideToggle()` 方法实现。\n\n滑动是显示和隐藏元素的另一种方式——你只需要使用不同的动画来完成任务。下面的示例演示了\
  \ `slideDown()`、`slideUp()` 和 `slideToggle()` 方法，该示例修改了 `Example 8-1` 中创建的文档。该文档在源码下载材料中名为\
  \ `Example 8-2` 出现。为了节省空间，以下示例仅显示了 `Example 8-1` 和 `Example 8-2` 之间的差异。\n\n```\n\
  \ <input type='submit'\n                           name='exampleAnimationShow'\n\
  \                           id='exampleAnimationShow'\n                        \
  \   value='Slide Down' />\n                    <input type='submit'\n          \
  \                 name='exampleAnimationHide'\n                           id='exampleAnimationHide'\n\
  \                           value='Slide Up' />\n                    <input type='submit'\n\
  \                           name='exampleAnimationToggle'\n                    \
  \       id='exampleAnimationToggle'\n                           value='Toggle Slide'\
  \ />\n                </div>\n            </fieldset>\n```\n\n在 HTML 文档中，只有 `submit`\
  \ `<input>` 元素的 `value` 属性被修改，以反映更新后的动作。\n\n样式表中唯一的修改是对话框中 `<h4>` 元素的背景颜色。这样做是为了让你在浏览器中测试脚本时，能够更容易看到\
  \ `Example 8-1` 和 `Example 8-2` 之间的差异。\n\n```\ndiv#exampleDialog h4 {\n    border:\
  \ 1px solid rgb(50, 50, 50);\n    background: lightgreen;\n    border-radius: 4px;\n\
  \    padding: 5px;\n    margin: 0 0 10px 0;\n}\n```\n\n接下来的脚本将 `Example 8-1` 中的\
  \ `show()`、`hide()` 和 `toggle()` 方法替换为 `slideDown()`、`slideUp()` 和 `slideToggle()`\
  \ 方法。\n\n```\n$(document).ready(\n    function()\n    {\n        var animating =\
  \ false;\n        $('input#exampleAnimationShow').click(\n            function(event)\n\
  \            {\n                event.preventDefault();\n                if (!animating)\n\
