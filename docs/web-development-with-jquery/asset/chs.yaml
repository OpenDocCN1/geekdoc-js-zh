  \n5. `outerHeight(true)`\n\n## 第 7 章\n\n1. 在 AJAX 请求的上下文中，GET 请求和 POST 请求的唯一区别是\
  \ GET 请求对传递的数据量有具体限制；实际限制因浏览器而异。GET 请求的效率也可能略高。\n\n2. REST 服务通过提供描述数据操作的其他方法（如 ADD\
  \ 或 DELETE），在 HTTP 请求中体现了更丰富的语义。此外，REST 服务还可能被实现以标准化服务器响应，使其使用适当的 HTTP 错误代码。\n\n\
  3. `$.get()` 方法的可选第二个参数允许你随请求传递数据，形式可以是查询字符串，也可以是 JavaScript 对象字面量。\n\n4. 你通过赋值给\
  \ `$.getJSON()` 方法指定的回调函数的第一个参数的变量来访问 JSON 对象。该变量可以取任何你喜欢的名称。\n\n5. 访问 `<response>`\
  \ 元素的内容看起来如下：\n\n```javascript\n$.get(\n    '/url/to/request.xml',\n    function(xml)\n\
  \    {\n        alert($(xml).text());\n    }\n);\n```\n\n6. `load()` 方法。\n\n7. 在\
  \ JavaScript 中，jQuery 通过调用 `$.ajaxSetup()` 方法全局设置 AJAX 事件，该方法接受一个格式化为 JavaScript\
  \ 对象字面量的选项列表。`beforeSend` 属性指定了一个并在 AJAX 请求之前执行的回调函数。`success` 属性指定了一个在每次成功的 AJAX\
  \ 请求后执行的回调函数。`error` 属性指定了一个在遇到 HTTP 错误时调用的回调函数。最后，`complete` 回调函数在请求完成后执行，在 `success`\
  \ 或 `error` 回调执行之后执行，取决于请求是否成功。\n\n8. 一种方法是使用 jQuery 的 AJAX 事件方法，如 `ajaxStart()`\
  \ 和 `ajaxSuccess()`；另一种方法是通过 jQuery 的 `$.ajax()` 方法。\n\n9. 选择你想要获取值的表单元素；然后调用 `serialize()`\
