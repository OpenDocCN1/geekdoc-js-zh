  \n接下来的方法 `addFileToQueue()` 设置了进度对话框中的 `<table>`，并列出了每个上传文件的摘要，以便用户可以看到有关其上传尝试的视觉反馈。它为任何上传的图像创建缩略图并将文件添加到\
  \ `this.files` 数组中。\n\n```\n addFileToQueue : function(file)\n    {\n        if\
