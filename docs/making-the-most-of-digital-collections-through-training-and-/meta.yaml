  md: "# CHAPTER 2 TOOLING UP\n\nYou have just considered what goes into the target\
    \ function; what about the return value comes out of it? You want an advice to\
    \ be able to pass that value back to the outside world if appropriate.\n\nFor\
    \ that purpose, you can add a return statement to your targetObj.targetFn. You\
    \ can also make the argPassingAdvice return the value from call to the target.\
    \ None of the tests so far have counted anything about return values, so they\
