  md: '# ACKNOWLEDGMENTS


    Thank you to my wife, Bethany, for her love and support while we wrote this book,
    and for enduring (or enjoying?) many husband-less nights and weekends while I
    worked to meet a deadline.


    -SETH RICHARDS


    Thanks to my family for encouraging me to pursue my dreams. My dreams may include
    writing a book, but they begin and end with you.


    -LARRY SPENCER


    This book would not have been possible without the willingness of others to share
    their knowledge and expertise with us and the community at large in book, blog,
    and source-code format. Together, we''d like to acknowledge and thank:


    +   - Douglas Crockford, for his exposure of good parts of JavaScript and his
    work on jsInt.


    +   - Nicolas Zakas, for the numerous books and blog posts he wrote that acted
    as guides through JavaScript''s sometimes-treacherous waters, and also his maintenance
    and contributions to ESLint.


    +   - Stoyan Stefanov, for his instruction on applying pattern-based development
    to JavaScript.


    +   - Robert C. Martin, for instilling in us the desire to write clean code.


    +   - Fredrik Appelberg, for his creation of, and Dave Clayton for his contributions
    to, the AOP.js aspect-oriented programming framework.


    +   - Mike Bostock, for inspiring us with the D3 library for SVG graphics.


    +   - The folks at Pivotal Labs, for the creation of the open-source JavaScript
    framework Jasmine, and members of the community that contributed to the framework.


    +   - The Angular team, for showing a great way to build single-page applications.

    - The vast and growing network of generous people on sites like Stack Overflow
    and GitHub. Without you, we''d be thumbing through manuals.


    We would also like to express our appreciation to our project editor, Chris Havel,
    who deftly maneuvered us through the writing process from beginning to end. Our
    copy editor, Nicholas Rapoport, has read our book carefully, and more times, than
    anyone ever will. For her dedication and suggestions we offer heartfelt thanks.
    We would also like to express our sincerest thanks to our technical editors, Keith
    Pepin and John Peloquin. Their JavaScript prowess helped us avoid more than a
    few technical errors. Should any errors still exist, it''s likely because we didn''t
    follow some of their advice. Our hats are off to you, gentlemen.'
  merge: -1
  pgno: 10
- img_proc: false
  md: 'Finally, we''d like to thank Carol Long, the Executive Acquisitions Editor
    at Wiley, who gave us the opportunity to write this book. Without her, we''d still
    just be a couple of guys that write software for a living. We''re still that,
    but now we''re authors, too. Carol announced her retirement from the publishing
    industry just before we finished the book. We sure hope we weren''t the straw
    that broke the camel''s back! Thank you you, Carol, and we wish you nothing but
    sunny days and margaritas in your retirement.


    —LARRY AND SETH'
