  md: "# Creating Objects with New | 93\n\n```\nvar slider = new Marsupial('Slider',\
    \ false);\n\nvar isNightTime = true;\n\nconsole.log(maverick.isAwake(isNightTime));\
    \ // true\nconsole.log(slider.isAwake(isNightTime)); // false\n\n// each each\
    \ object has its own isAwake function\nconsole.log(maverick.isAwake === slider.isAwake);\
    \ // false\n```\n\nFunction properties may also be added to the constructor function's\
    \ prototype. Defining functions on the prototype of the constructor function has\
    \ the added benefit of limiting the number of copies of the function to one, reducing\
    \ the memory footprint, and increasing performance when creating a large number\
    \ of object instances.\n\nListing 3-7 shows how to add a function property to\
    \ the constructor function's prototype. The list also illustrates that each object\
    \ instance shares the implementation of the function.\n\nLISTING 3-7. Adding a\
    \ function to the constructor function's prototype (code filename: NewPatternpattern.05.js)\n\
    \n```\nfunction Marsupial(name, nocturnal) {\n  if (!(this instanceof Marsupial))\
    \ {\n    throw new Error(\"This object must be created with new\");\n  }\n  this.name\
    \ = name;\n  this.isNocturnal = nocturnal;\n}\n// Each object instance shares\
    \ one copy of isAwake\nMarsupial.prototype.isAwake = function(isNight) {\n  return\
    \ isNight == this.isNocturnal;\n}\n\nvar maverick = new Marsupial('Maverick',\
    \ true);\nvar slider = new Marsupial('Slider', false);\n```\n\n```\nvar isNightTime\
    \ = true;\nconsole.log(maverick.isAwake(isNightTime)); // true\nconsole.log(slider.isAwake(isNightTime));\
    \ // false\n```\n\n```\n// the objects share a single instance of isAwake\nconsole.log(maverick.isAwake\
    \ === slider.isAwake); // true\n```\n\nTo illustrate the performance gains that\
    \ can be realized by utilizing the constructor's prototype, we've created a sample\
    \ at http://jsperf.com which pits the version of Marsupial that doesn't use the\
