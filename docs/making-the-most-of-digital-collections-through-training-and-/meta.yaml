  md: "JavaScript has exactly five primitive data types: String, Number, Null, and\
    \ Undefined. The language will coerce one type to another as needed, in famously\
    \ surprising ways, but those five are, at least in ECMAScript 5 (ECMAScript 6\
    \ adds the Symbol type). The Object type is not a primitive.\n\nA primitive has\
    \ a value, but no properties, but the following code will run without error.\n\
    \n```\nvar str = \"abc\";\nconsole.log(str.length); // Output: 5\n```\n\nIf str\
    \ does not have a length property, how can this work? When the interpreter encounters\
    \ str.length, it says, \"Hmm... Looks like he's trying to work with an object.\
    \ Let me make one for him.\" A String object is constructed from str and its length\
    \ is reported. As quickly as the String was constructed, it is garbage-collected.\n\
    \nString, Boolean, and Number all have object wrappers, String (value), Boolean\
    \ (value).\n\nWET (Write Everything Twice or We Enjoying Type) can find its way\
    \ into your code without your notice. Suppose you have a variable that represents\
    \ the mass of an animal, in kilograms. You collect a value from the user and then\
    \ do this:\n\n```\nif (inputMass < 0) {\n  // Give an error that may not be negative\n\
    } else if (inputMass > 150000) {\n  // Error: Even a blue whale is not massive.\n\
    }\n```\n\nThen, in another part of your application, you do the same thing. Your\
    \ code is no longer DRY, but what could you do? You can't install range validation\
    \ on a primitive. One way to solve this problem is to promote primitive to object.\
    \ The object could have range validation and other features not available in primitives.\
    \ We are not suggesting that every primitive should be an object, but it's something\
    \ to consider on a case-by-case basis.\n\nAnother common problem is the repeated\
    \ primitive. It's so much easier to type the value second time than to put it\
    \ in a variable and reference the everywhere. Turn away from the easy path! With\
    \ exceptions, every constant referenced more than once should be put in a variable,\
    \ and the variable referenced instead. Another approach is to inject it as a dependency.\
    \ In addition to keeping your code DRY, either approach will make it easier to\
    \ find all the places that you use the value.\n\nTable 3-1 summarizes how primitives\
    \ fare with SOLID and DRY principles.\n\n# TABLE 3-1: SOLID and DRY Summary for\
    \ Primitives\n\n| PRINCIPLE | RESULT |\n|---|---|\n| Single Responsibility | You\
    \ can't be more single-minded than a primitive |\n| Open/Closed | Open for extension?\
    \ Not really. Closed for modification? Definitely. In fact, primitives are immutable\
    \ |\n| Liskov Substitution | Not applicable |"
