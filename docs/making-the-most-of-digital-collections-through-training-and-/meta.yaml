  md: "# DISTINGUISHING BETWEEN PARTIAL FUNCTION APPLICATION AND CURRYING\n\nYou soon\
    \ discover that there is a concept closely related to partial function application\
    \ called currying. In fact, they are so closely related as to be often conflated.\n\
    \n# Currying\n\nCurrying is the decomposition of a function that takes several\
    \ arguments into several functions that take one argument each. The upshot is\
    \ instead of doing this:\n\n```\ngetRestaurantsWithinRadius(address, radius, cuisine)\n\
    \ngetRestaurantsCurried(address)(radius)(cuisine)\n```\n\nThe first call, getRestaurantsCurried(address),\
    \ returns a function that takes a radius argument and returns another function,\
    \ this time taking a cuisine argument in the nesting is finally equipped to yield\
    \ the answer.\n\nWhat prestidigitation makes this possible? The simplest, most\
    \ concrete form for this is:\n\n```\nfunction restaurantsCurried(address) {\n\
    \  var self = this;\n  return function(radius) {\n    return function(cuisine)\
    \ {\n      return self.getRestaurantsWithinRadius(address, radius, cuisine);\n\
    \    }\n  }\n}\n```\n\nMore abstract forms on the Internet, the foregoing conveys\
    \ the spirit of currying best. (You will also notice that those abundant implementations\
    \ of curry are invariably nothing more than a partial function application of\
    \ one or more parameters—not magic wands that you can wave over any time to turn\
    \ into a sequence of functions, returning a function, except for the last, which\
    \ is smart enough to know it the answer.)\n\nSome programming languages make curried\
    \ functions a way of life; In Haskell and ML, all functions take just one argument.\
    \ Certain patterns and possibilities emerge that are beyond the scope of this\
    \ book, such as the study of lambda calculus (http://plato.stanford.edu/entries/lambda-calculus/).\n\
    \n# Partial Function Application\n\nPartial function application looks like currying\
    \ at first glance, consisting it of turning a function that takes several arguments\
    \ into one that takes fewer. In reality, it is the reverse, as the following implementation\
    \ of getRestaurantsNearConference demonstrates. It builds back up from the curved\
    \ parts created previously to a function that is functionally identical to the\
    \ partial-function-application version from earlier in the chapter."
