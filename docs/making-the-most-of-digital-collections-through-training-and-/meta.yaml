    \ Decorator_attendeeWebApiDecorator_02.js)\n\n```\nvar Conference = {};\nConference.attendeeWebApiDecorator\
    \ = function(baseWebApi) {\n  'use strict';\n  var self = this;\n  // The records\
    \ passed to the post calls, function,\n  // whose calls are not yet resolved.\n\
    \  pendingPosts = {\n    postPending: 'It appears that a post is pending for this\
    \ attendee'\n  };\n  // Return the element of 'posts' that is for the attendee,\n\
    \  // or -1 if there is no such element.\n  function indexOfPostForSameAttendee(posts,\
    \ attendee) {\n    var ix;\n    for (ix=0; ix<posts.length; ++ix) {\n      if\
    \ (posts[ix].isSamePersonAs(attendee)) {\n        return ix;\n      }\n    }\n\
    \    return -1;\n  }\n\n  post: function post(attendee) {\n    if (indexOfPostForSameAttendee(pendingPosts,\
