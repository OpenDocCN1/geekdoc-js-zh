    # The Interface Segregation Principle


    This principle arose in a milieu of interface-based languages such as C++ and
    Java. In those languages, an interface is a piece of code that describes functions
    in a class (names, parameters, and return types) without implementing those functions.


    The idea is that an interface with many functions should be broken up into smaller,
    cohesive parts. Consumers should rely on only one of the mini-interfaces, not
    the "fat".


    Of course, this is in the service of minimizing the width of the connections between
    modules. As stated previously, trimming the channels of communication is critical
    to making large JavaScript systems manageable.


    But a wait! In JavaScript, are there no classes or interfaces. Does that mean
    JavaScript programmers cannot experience the benefits of this principle?


    Not all in fact, we will devote all of Chapter 16 to how to implement this principle
    in JavaScript. In the meantime, here''s a preview: To follow the spirit of the
    Interface Segregation Principle, a function can make clear what it expects of
    its arguments, and those expectations should be minimized. As stated earlier,
    duck typing is your friend here. Rather than expecting an argument of a certain
    type, just expect it to have the few properties of that type that you actually
    need. The ContractRegistry will be developed in Chapters 16 through 21 provides
    a formal way to make the expectations clear and to enforce them with event contracts.
    If the ContractRegistry is not to your taste, you can always write argument-validation
    code


    # The Dependency Inversion Principle


    This principle, too, was developed with interfaces in mind. Robert Martin states
    it thus: "High-level modules should not depend upon low-level modules. Both should
    depend upon abstractions" (http://www.objectmentor.com/resources/articles/dip.pdf).


    In an interface-based language, this principle usually finds its expression in
    the related idea of dependency injection. If class A needs the services of B,
    it does not depend on B. Instead, one parameter to A is an interface that depends
    B. A not depends on B, but on its interface. When A is constructed, a concrete
    B is passed in. B, too depends on its interface.


    The benefit is that a derived version of B, which also fulfills the interface,
    can be supplied thanks to the Liskov Substitution Principle. Furthermore, if B
    needs to change (in spite of the'
