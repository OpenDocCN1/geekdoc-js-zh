  md: "# USING A DEPENDENCY-INJECTION FRAMEWORK\n\nYou may remember from Chapter 1\
    \ that dependency inversion is one of the five pillars of SOLID development, and\
    \ that dependency injection is part of the mechanism of bringing it about. In\
    \ this section, you will develop a framework that brings both flexibility and\
    \ discipline to dependency injection.\n\n# What Is Dependency Injection?\n\nThere's\
    \ a JavaScript conference coming up, and you've volunteered to help construct\
    \ its website. This will be the biggest JavaScript conference ever, with every\
    \ session jam-packed with attendees reserve their seats. Your job is to write\
    \ the client-side code to make reservations possible.\n\nYou'll need to call the\
    \ conference's service with the database. Being well-versed in the principles\
    \ of object-oriented programming, your first step was to encapsulate that service\
    \ in a ConferenceWebSvc object. You have also created a JavaScript object, Messenger,\
    \ which shows fancy pop messages. We pick up the story from there.\n\nEach attendee\
    \ is allowed to register for 10 sessions. Your next task is to write a function\
    \ that lets the attendee attend register for one session, and then display a success\
    \ message or a failure message. (We apologize for the synchronous nature of the\
    \ calls to ConferenceWebSvc. Listing 2-9. Better ideas are in Chapters 5 and 6.\
    \ Also, we are using the \"new\" key to create objects which some authorities\
    \ don't like it, so we cover the worst case.)\n\n> LISTING 2-9: Basic Attendee\
    \ object (code filename: DI\\Attendee_01.js)\n\n```\nAttendee = function(attendeeId)\
    \ {\n  // Ensure created with 'new'\n  if (this.instanceof Attendee) {\n    return\
    \ new Attendee(attendeeId);\n  }\n  this.attendeeId = attendeeId;\n\n  this.service\
    \ = new ConferenceWebSvc();\n  this.messenger = new Messenger();\n\n  // Attempt\
    \ to reserve a seat at the given session.\n  // Give a message about success or\
    \ failure.\n  Attendee.prototype.reserve = function(sessionId) {\n    if (this.service.reserve(this.attendeeId,\
    \ sessionId)) {\n      this.messenger.success('Your seat has been reserved!' +\
    \ \n        ' You may make up to ' + this.service.getRemainingReservations() +\
    \ \n        ' additional reservations.');\n    }\n  } else {\n```\n\ncontinues"
  merge: -1
