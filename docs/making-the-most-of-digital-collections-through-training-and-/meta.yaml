    to close his design. This takes a certain amount of presience derived from experience.”


    When Mike Bostock designed d3.svg.line function, the anticipated changes in the
    way might be plucked from data and the points might be joined (interpolated),
    and he wisely abstracted those features out of his function.


    What he did not would change (at least not in a backward-compatible way) was the
    SVG path specification. He dared to hard-code that a path could always start with
    “m” and continue with the points in order, as a text string.


    Short of a breaking change to the SVG spec, it is hard to imagine how d3.svg.line
    would ever have to change.


