    \ can cause poor performance, so we recommend keeping them as shallow as possible.\n\
    \n# CREATING OBJECTS WITH NEW\n\nIn this section, you will learn about the new\
    \ object creation pattern in JavaScript and examine some of the pattern's benefits\
    \ and pitfalls. You also see how use of the pattern will help keep your code SOLID\
    \ and DRY.\n\n# The new Object Creation Pattern\n\nThe new object creation pattern's\
    \ syntax in JavaScript is similar to the syntax used by the same pattern in classical\
    \ languages C#, C++, or Java.\n\n> NOTE We use the term \"classical\" in the sense\
    \ that the languages make use of classes, constructs that allow for the definition\
    \ of custom types. Classical does not imply age as it does when referring to ancient\
    \ Greek or Latin (though C++ is older than one of the authors of this book!).\n\
    \nListing 3-3 shows the Marsupial function, and it also shows the creation of\
