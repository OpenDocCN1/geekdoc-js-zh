    Another way of saying this is that when you derive one object from another, the
    base-level semantics should not change.


    If you find writing branching logic so that your function does one thing if provided
    with a base class, but something else for a derived class, you have violated this
    principle.


    This does not apply to types that do not derive from each other. For example,
