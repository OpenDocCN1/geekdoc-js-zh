  md: '“AngularJS 2.0 will revamp this somewhat,” Charlotte concluded. (See Promises
    in Angular 2.0 at https://docs.google.com/document/d/1ksBjyCgcCwiEUSgn9h2NYQTeGMkP5NYHebMBgaxTwfs/edit.)


    # UNDERSTANDING AND FATES


    “When manipulating Promises, either real or fake ones through Deferred, you have
    to understand the difference between resolving a Promise and fulfilling it,” Charlotte
    continues.


    “The function for creating a fulfilled Promise was not called Promise.fulfill
    but .resolve. That’s because a Promise doesn’t have to be resolved by fulfilling
    it with a value. It can be resolved to another Promise—which might be rejected,
    or rejected later! ‘Resolved’ just means that the fate of the Promise is sealed
    in one way or another—locked into a value or to the ultimate fate of Promise.


    “I found a web page on GitHub that has unwrapping, called States and Fates.” (See
    https://github.com/domenic/promises--unwrapping/blob/master/docs/states-and-fates.md.)


    “Basically, a Promise always has one of three states: fulfilled, rejected, or
    pending. They mean pretty like what you’d expect, although the technical definition
    has some fine shading.”


    “And there are two fates: resolved and unresolved. An unresolved Promise always
    has a pending state, though a resolved Promise might be in any of the three states,
    although fulfilled is the most typical.”


    “It is a little counter-intuitive that returning the Promise from a then rejection
    branch is followed could land you in the resolved branch of a unit test, but if
    rejection callback returns a resolved Promise, or a bare value (which converts
    to a resolved Promise), that is what will happen.”


    “As you said, that’s probably a common mistake,” you volunteer.


    # DISTINGUISHING STANDARD PROMISES FROM JQUERY PROMISES


    One more thing,” Charlotte said. “It turns out that jQuery Promises are not exactly
    Promises in the sense that we know. Kris Kow, who wrote the Q library adapted
    by AngularJS, has a GitHub page that spells out the differences.” (See https://github.com/kriskowal/q/wiki/Coming-from-jquery.)


    Okay, then,” you reply, hoping she’ll stop.


    # SUMMARY


    In this chapter, you learned how to construct and use Promises:


    +   - A Promise encapsulates a future event and callbacks to execute upon success
    or failure of that event.'
