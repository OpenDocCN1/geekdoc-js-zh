  md: "You created a target object, targetObj, that has a bare function, targetFn.\
    \ You also have an advice function that just sets a flag, executedAdvice, when\
    \ it executes. If you tie it all together with Aop.around('targetFn', advice,\
    \ targetObj), you would expect a call to the target that will cause the advice\
    \ to execute. Of course, this test fails (Figure 2-7) because Aop.around still\
    \ does nothing.\n\n![](bbox=[0.079, 0.235, 0.86, 0.613])\n\nNext, you'd add just\
    \ enough code to make it pass (Listing 2-28).\n\n# Listing 2-28: Aop.around now\
    \ executes the advice (code filename: Aop\\Aop_01.js)\n\n```\nAop = {\n  around:\
    \ function(fnName, advice, fnObj) {\n    fnObj[fnName] = advice;\n  }\n};\n```\n\
    \nNext, you want to allow your advice to wrap a call to the target. This means\
    \ that you must pass some information about the target to the advice. You can\
    \ do so by passing an object to the advice, in which store the original target\
    \ function. In the Listing 2-29 tests, this object is called targetInfo and the\
    \ function is in its fn property."
