  md: 'JavaScript''s reputation should not automatically exclude her for consideration
    for projects that could benefit from her strengths. Node.js, a server-side JavaScript
    engine, is lightweight and highly scalable; perfect for real-time and data-intensive
    applications. JavaScript may be used to create rich user interfaces in the browser.
    Client-side frameworks such as Ember and AngularJS may be used to build complete
    browser-based applications that can help reduce the load on the web server by
    offloading presentation logic to the client.


    While we cannot guarantee it will succeed, the upcoming chapters will show ways
    to mitigate the risk of choosing JavaScript for your next project by applying
    the lessons we learned while working on our projects.


    Success will not happen by accident, especially with JavaScript. It requires a
    firm grasp of engineering principles, which are the subject of the first chapter.


    # HOW THIS BOOK IS STRUCTURED


    We''ve organized the book into five parts.


    Part I, "Laying a Solid Foundation," covers key concepts of software engineering
    such as the SOLID and DRY principles. It also discusses the benefits of unit-testing
    and test-driven development. Part I also introduces the tools and JavaScript libraries
    that will be used throughout the book. Finally, it discusses objects in JavaScript
    and their testability.


    In Part II, "Testing Pattern-Based Code," we describe and use test-driven development
    to create useful code patterns. Some of the patterns, such as the Singleton, may
    be familiar from other languages you are familiar with. Others, such as Promises,
    are associated primarily with JavaScript.


    Part III, "Testing and Writing with Advanced JavaScript Features," describes how
    to leverage and test more advanced features of the JavaScript language. It also
    covers creation and testing of applications that use advanced program architectures,
    such as the Mediator and Observer Patterns.


    Part IV, "Special Subjects in Testing," provides examples of testing DOM manipulation,
    and it also illustrates the use of static analysis tools to enforce coding standards.


    Finally, Part V, "Summary," reviews the concepts of test-driven development, and
    also presents a collection of JavaScript idioms that you will have encountered
    in the book.


    # WHAT YOU NEED TO USE THIS BOOK


    To run the samples in the book, you need the following:


    +   * A text editor

    * A web browser


    The source code for the samples is available for download from the Wrox website
