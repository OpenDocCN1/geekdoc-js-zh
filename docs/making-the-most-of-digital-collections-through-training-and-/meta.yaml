    \ to be part of this (that is, part of the object that useSignLanguage is \"dotted\"\
    ). Although useSignLanguage originated in Human, calling it with koko before the\
    \ dot (koko.useSignLanguage) causes Koko's hands to move, not the human's. In\
    \ more detail:\n\n+   1. koko.useSignLanguage('Hello!') is called.\n2. Because\
    \ of the monkey patch, execution ends up in MyApp.Human.prototype\n.useSignLanguage.\n\
    3. That function accesses this.hands.\n4. At that point, this is a MyApp.Gorilla\
