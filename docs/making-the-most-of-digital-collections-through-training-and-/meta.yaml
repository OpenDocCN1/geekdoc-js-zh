    \ the Promise—checkInNumber in this case. Creating an already fulfilled Promise\
    \ is obviously a shortcut; you will see how to create more realistic Promises\
    \ in the next section.\n\nNow you expect the following to happen:\n\n+   1. checkInService.checkIn\
    \ is called in the unit test.\n2. That method enables a call to recorder.recordCheckIn\
    \ (see Listing 6-1).\n3. The spy on recordCheckIn will cause it to return a resolved\
    \ Promise with a value of checkInNumber.\n4. The success callback of recordCheckIn(attendee),\
    \ then be followed (see Listing 6-1 again).\n5. That success callback, attendee.setCheckInNumber,\
    \ gets checkInNumber as a parameter.\n6. So, the expectation at the end of the\
    \ unit test is met!\n\nEvery step of that sequence was true, but Figure 6-1 shows\
