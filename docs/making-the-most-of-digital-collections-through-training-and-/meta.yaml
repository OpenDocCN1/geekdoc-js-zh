  md: '# Generalizing the Decorator


    The next logical step, which is beyond the scope of this chapter, would be to
    generalize the decorator. In a real-world application, there may be many objects
    that encapsulate related HTTP POSTs and GETs—not to mention PUTs and DELETEs.
    How might you generalize the decorator so you could use it in all cases? That
    is left as an exercise for you to do on your own. We mention it here to point
    out a final benefit of the Decorator Pattern: It can eliminate duplicate code.


    # SUMMARY


    In this chapter, you used the Decorator Pattern to address a real-world limitation
    of an HTTP-based object, without modifying it. The decorated object maintains
    focus on its Single Responsibility, while the decorator isolates the complicated
    new feature and, if generalized, can reduce code duplication.


    You developed a decorator using a test-driven approach, with the following steps.


    +   1. Code a fake for the decorated object (optional).

    2. Write unit tests to verify that errors are passed up the call stack from the
    decorated object, through the decorator, and to the caller.

    3. Write a do-nothing decorator and watch the tests fail.

    4. Add pass-through functionality to the decorator so the tests pass.

    5. Write tests to verify that the decorator will also pass signs of success to
    its caller.

    6. Make those tests pass, if they do not already.

    7. Add the decorator''s special features, writing the unit tests first.

    8. Consider generalizing the decorator.


    The next chapter takes up another classic design element: the Strategy Pattern.'
