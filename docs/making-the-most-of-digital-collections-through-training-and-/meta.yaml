    \ Unit tests for creating a Presentation with the factory (code filename: presentationFactory_tests.js\
    \ [excerpt])\n\n```\ndescribe('presentationFactory', function() {\n  'use strict';\n\
    \  var factory = Conference.presentationFactory(),\n  baseParameter = {\n    title:\
    \ 'How to Write Wonderful JavaScript',\n    presenter: 'Rock Star'\n  };\n});\n\
    describe('create(objectLiteral)',function() {\n  /** Previously discussed test\
    \ omitted for clarity. *//\n});\ndescribe('with only base properties',function()\
    \ {\n  var fakePresentation = { title: 'How to Fake a Presentation' },\n  spyOnConstructor,\n\
    \  returnedPresentation;\n\n  beforeEach(function() {\n    spyOnConstructor =\
    \ spyOn(Conference, 'Presentation')\n    .and.returnValue(fakePresentation);\n\
    \    returnedPresentation = factory.create(baseParameter);\n  });\n\n  it('passes\
    \ all values to Presentation's constructor', function() {\n    expect(spyOnConstructor).toHaveCalledWith(\n\
    \      baseParameter.title, baseParameter.presenter);\n  });\n\n  it('calls the\
    \ Presentation's constructor exactly once', function() {\n    expect(spyOnConstructor.calls.count()).toBe(1);\n\
    \  });\n\n  it('returns the Presentation constructed', function() {\n    expect(factory.create(baseParameter)).toBe(fakePresentation);\n\
    \  });\n});\n```\n\nThe new tests are merely expectations on the effect of the\
    \ factory.create in the beforeEach. The expectations are separated into their\
    \ respective tests, but the beforeEach keeps the tests DRY.\n\nNote that only\
    \ a spy on Presentation's constructor was called. The Factory's responsibility\
    \ is to call the correct constructor and return the result. It should not care\
    \ about what the constructor does, and neither the factory's unit tests.\n\nThat's\
    \ all there is to test the factory's ability to create base Presentations. The\
