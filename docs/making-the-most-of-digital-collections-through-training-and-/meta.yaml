  md: '# CHAPTER 3 CONSTRUCTING RELIABLE OBJECTS


    In Chapter 19, you will read much more about monkey patching, although under its
    other respectable name, *method borrowing*.


    Table 3-7 summarizes how monkey-patching stacks up to the classic criteria for
    reliability and testability.


    TABLE 3-7: SOLID AND DRY Summary for Monkey-Patching


    | PRINCIPLE | RESULT |

    | --- | --- |

    | Single Responsibility | Although the donated cluster of functions comprises
    one responsibility, it might be argued that the donation adds a responsibility
    to the receiving object. However, this is only true in the same sense that an
    aspect adds a responsibility, which is to say it''s not true at all. |

    | Open/Closed | To the extent that monkey-patching is used responsibly, it does
    not violate the open/closed principle. |

    | Liskov Substitution | As long as the donated functions have the same semantics
    in their new home as the old, there''s no problem here. |

    | Interface Segregation | Upholding the Interface Segregation principle is what
    monkey-patching is all about! |

    | Dependency Inversion | Dependencies may be injected into either the donating
    or receiving object as usual. |

    | Don''t Repeat Yourself | In the hands of a creative but responsible developer,
    monkey-patching can be one more tool for maintaining DRY code. |


    # SUMMARY


    In this chapter, you saw several ways to create objects in JavaScript, and how
    well each way met the SOLID and DRY criteria from Chapter 1.


    Primitives and object literals are simple to use, but tend to make your code repeat
    itself.


    The Module Patterns are a deft step up. Not only does it encapsulate your data
    in ways that primitives and object literals do not, but it is more amenable to
    unit-testing and extension using aspect-oriented programming.


    According to some members of the JavaScript community, the *new* object pattern
    should be avoided, but we''re not so quick to dismiss it. Constructor functions,
    by the pattern, allow for shared initialization code, and it isn''t difficult
    to ensure *new* is used when it is required.


    All JavaScript functions have a *prototype* property which may be used to efficiently
    share code and data between object instances. The prototype property also provides
    the mechanism by which JavaScript facilitates prototypical inheritance.'
