  md: "# Providing Tools to the Widget via the Sandbox\n\nWhile the WidgetSandbox\
    \ is designed to isolate the dashboard widgets so they're loosely coupled, the\
    \ widgets won't be useful if they can't somehow interact with the DOM or retrieve\
    \ information from web services. Like shovels and rakes that can be used in a\
    \ physical sandbox, the WidgetSandbox should provide a set of tools that the widget\
    \ can use to interact with its environment.\n\nAfter conferring with Charlotte,\
    \ you determine that you have an idea what some of the tools available to widgets\
    \ should be, but not all. Rather than providing a fixed set of tools, it should\
    \ be possible to extend the capabilities of the WidgetSandbox by adding new tools\
    \ to it. Also, it should be possible to restrict which tools are available to\
    \ each widget. If a widget doesn't need to interact with a web service, for example,\
    \ it doesn't need access to the tool that allows for AJAX.\n\nBefore beginning\
    \ to implement the features that achieve these goals, some decisions need to be\
    \ made:\n\n+   1. Will the tools be defined?\n\n+   2. How will the tools be added\
    \ to an instance of the WidgetSandbox?\n\n+   3. How will the tools available\
    \ to a widget be specified?\n\nWith Charlotte's input, you arrive at the following\
    \ answers:\n\n+   1. It makes sense to define the tools within the Conference.WidgetTools\
    \ namespace.\n\n+   2. Tools will be defined as modules, and a tool's module function\
    \ will accept an instance of WidgetSandbox. The tool will add itself to the WidgetSandbox\
    \ as a property in the following manner:\n\n```\nConference.WidgetTools.toolA\
    \ = function(sandbox) {\n  // Add toolA to sandbox\n  sandbox.toolA = {\n    function1:\
    \ function() {\n      // function1 implementation\n    },\n    function2: function()\
    \ {\n      // function2 implementation\n    }\n  };\n}\n```\n\n+   3. The WidgetSandbox\
    \ constructor will accept either:\n\n+   a. An array of the names of the tools\
    \ that should be made available to the widget as its first argument, and the widget's\
    \ function as its second argument—example:\n\n```\nvar weatherSandbox = new Conference.WidgetSandbox(['toolA',\
    \ 'toolB'],\nConference.widgets.weatherWidget);\n```\n\n+   b. Any number of individual\
    \ tool name arguments, and the widget's function as its last argument—example:\n\
    \n```\nvar weatherSandbox = new Conference.WidgetSandbox(['toolA', 'toolB'],\n\
    Conference.widgets.weatherWidget);\n```"
