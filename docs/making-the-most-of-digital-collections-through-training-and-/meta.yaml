    # JavaScript Is Single-Threaded


    Just one more thing to close out this language features: JavaScript is single-threaded.
    That doesn''t mean it uses a blocking model—far from it. It means that you can
    do asynchronous programming differently.


    Where a multi-threaded language would allow you to start a task that runs in parallel
    to the code that spawned it, in JavaScript you merely enqueue a function to execute
    as soon after a certain event as possible. The triggering event may be the passage
    of a certain amount of time (in the case of setTimeout), the arrival of data from
    a website (in the case of XMLHttpRequest.send), or the click of a mouse, among
    many possibilities. JavaScript has an event loop that consumes the functions youqueued
    one at a time.


    From a design point of view, this makes your life easier than it would be in a
    true multi-threaded environment. You never have to worry about getting interrupted,
    or about other objects accessing your variables when you think you have control.'
