  md: "# CHAPTER 3 CONSTRUCTING RELIABLE OBJECTS\n\n# LISTING 3-3 (continued)\n\n\
    ```\nvar maverick = new Marsupial('Maverick', true);\nvar slider = new Marsupial('Slider',\
    \ false);\n\nconsole.log(maverick.isNocturnal); // true\nconsole.log(maverick.name);\
    \      // \"Maverick\"\n\nconsole.log(slider.isNocturnal);  // false\nconsole.log(slider.name);\
    \        // \"Slider\"\n```\n\nWithin the Marsupial function, the arguments are\
    \ assigned to properties of the instance being created. The lines that follow\
    \ the definition of the Marsupial function show that the two instances of Marsupial\
    \ created, maverick and slider, have unique properties.\n\n# Potential for Bad\
    \ Things to Happen\n\nYou should notice that there's nothing provided by the language\
    \ that indicates the Marsupial function should be used as a constructor function,\
    \ (a function that has been written for use with the new keyword). Nor does JavaScript\
    \ provide built-in protection if constructor functions are not executed with the\
    \ new keyword. For this reason, many developers distinguish constructor functions\
    \ by using PascalCase.\n\nThe potential for “bad things” to happen because of\
    \ the omission of the new keyword when invoking a constructor function led Douglas\
    \ Crockford to recommend that constructor functions not be used. (See JavaScript:\
    \ The Good Parts by Douglas Crockford, O'Reilly Media, 2008.)\n\nWe're not so\
    \ quick to dismiss use of constructor functions because they allow for shared\
    \ initialization code, and it's not difficult to ensure new is used when it is\
    \ required.\n\n# Enforcing the Use of new\n\nWhile JavaScript doesn't do anything\
    \ to enforce the use of new with constructor functions, adding such enforcement\
    \ is an easy exercise in leveraging the instanceof operator. Listing 3-4 shows\
    \ how to rewrite the Marsupial constructor function from Listing 3-3 to ensure\
    \ that the function is executed with the new keyword.\n\n# LISTING 3-4: Enforcing\
    \ use of new with instanceof (code filename: Pattern\\newpattern_02.js)\n\n```\n\
    function Marsupial(name) {\n  if (!(this instanceof Marsupial)) {\n    throw new\
    \ Error(\"This object must be created with new\");\n  }\n  this.name = name;\n\
    \  this.isNocturnal = nocturnal;\n}\n\nvar slider = Marsupial('Slider', true);\n\
    ```"
