  md: '# If You Don''t Run It, Bugs Will Come


    Ideally, JSHint should be executed automatically any time you''ve made changes
    to your JavaScript code. Any manual mechanism could result in forgetting to run,
    or purposely not running, the linting tool. Linting is not something to be left
    to the end of a project, or even to the next build (your project has a repeatable,
    automated build process, right?). Your linter should provide continuous feedback
    as you''re developing so that the code issues it identifies are addressed as early
    as possible.


    JSHint is distributed in multiple ways, including an npm module for use with the
    server-side JavaScript engine node.js. There are also plugins to automatically
    execute JSHint natively or via node.js on your JavaScript files for popular text
    editors and integrated development environments (IDEs), such as VIM, Emacs, Sublime
    Text, TextMate, and Visual Studio.


    If your favorite editor or IDE doesn''t have a JSHint plugin available, node.js
    task-execution packages such as Grunt and Gulp may be configured to watch for
    changes in your JavaScript files and automatically execute JSHint when a change
    is detected.


    TESTS ARE CODE, TOO

    It''s important to note that JSHint should be executed against your unit tests
    as well as your application code. The linter is your first line of defense against
    potential errors in your unit tests that may lead to false results.


    # Alternatives to JSHint


    JSHint is not the only JavaScript linting tool; it just happens to be the tool
    that provides the functionality that we require. Here are some alternatives to
    JSHint that you might want to consider or choosing a linting tool for your project.


    # JSLint


    JSLint is a mature JavaScript linting tool that was created and is maintained
    by Douglas Crockford. Mr. Crockford is a key figure in the JavaScript community,
    known for both his work on JSLint and his work to personalize JSON.


    JSLint is available as an npm module for node.js, as well as a JavaScript file
    for use in browser-like environments.


    The JSLint homepage can be found at http://www.jslint.com.


    # ESLint


    ESLint is a relatively new open source linting tool created by Nicholas Zakas
    in 2013. Even though it is a young project, it is full-featured and very capable.
    A feature of ESLint is its modularity. You may define your own custom linting
    rules and load them into the linter at run. This is very useful if you would like
    to enforce a coding standard unique to your organization.'
