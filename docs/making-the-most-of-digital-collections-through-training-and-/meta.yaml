  md: "# 86 | CHAPTER 3 CONSTRUCTING RELIABLE OBJECTS\n\nLISTING 3-2 (continued)\n\
    \n```\nvar animals = [];\n```\n\n```\nreturn\n  addAnimal: function(animalMaker,species,\
    \ sex) {\n    animals.push(animalMaker.make(species,sex));\n  },\n  getAnimalCount:\
    \ function() {\n    return animals.length;\n  }\n}(); // <-Immediate execution\n\
    ```\n\nThe singleton can be used in code like this:\n\nMyApp.WildLifePreserveSimulator.addAnimal(realAnimalMaker,\
    \ gorilla, female)\nThe outer function executes right where you see it, not when\
    \ invoked by the application's startup code. for this dependencies cannot be injected\
    \ into the outer function unless they happen to be available as the function (immediately)\
    \ executes. This is a little inconvenient. If you want a singleton, a more dependency-injection-free\
    \ approach is to code with the module-at-pattern and let the dependency-injection\
    \ framework furnish the same instance each time it is requested. Here is how AngularJS\
    \ provides \"service\" injections, for example.\n\n# Creating Reliable Modules\n\
    \nWhether your module is the at-will or immediate type, there are a few principles\
    \ you'll want to keep in mind.\n\nFirst, remember the Single Responsibility principle:\
    \ Each module should have just one job. This will keep your APIs small, cohesive\
    \ and manageable.\n\nSecond, if your module creates objects for its own use, yourself\
    \ whether those objects ought to be provided by dependency injection—either directly\
    \ or by injecting a factory.\n\nFinally, if your module extends the behavior of\
    \ another object, be sure not to change what the behavior means (its semantics).\
    \ This is the Liskov Substitution principle\n\nTable 3-3: SOLID and DRY Summary\
    \ for Modules\n\n| PRINCIPLE | RESULT |\n|---|---|\n| Single Responsibility |\
    \ Because they are friendly to dependency injection and aspect-oriented decoration,\
    \ it is easy to keep modules to a single responsibility. |\n| Open/Closed | Modules\
    \ are open to extension by being injected into other modules. Modules can be kept\
    \ closed for modification if you are disciplined. |\n| Liskov Substitution | As\
    \ long as you don't change the semantics of any dependencies, you'll be. |\n|\
    \ Interface Segregation | A module with a cohesive API is JavaScript's equivalent\
    \ of a segregated interface. |"
