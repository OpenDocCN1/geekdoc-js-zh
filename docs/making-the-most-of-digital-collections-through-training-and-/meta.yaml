  md: 'Creating small, simple modules that isolate separate concerns leads to code
    that is easy to write, test, and understand. Code with those properties is more
    likely to remain correct in the long term.


    You might think that test-driven development would slow you down. If you write
    the tests after the code and the code does not properly separate its concerns,
    that will be true. You will have baked in many mistakes, and writing unit tests
    will be just the slowest possible way to find them.


    However, if you follow the red-green-refactor cycle to produce small increments
    of code, you will actually go faster, just as the musician who practices slowly
    and carefully at first masters the piece more quickly. First of all, because each
    increment is simple, you will be less likely to make a mistake, so you will save
    a lot of debugging time. Second, because your code will be completely covered
    by tests, you will be able to refactor without. That will enable you to keep your
    DRY, which generally means your code base is smaller, preventing fewer places
    where things go wrong. DRY also means reusable, and we all know that reusable
    code saves time.


    # SUMMARY


    JavaScript presents unique design opportunities to the developer. In this chapter,
    you will see many of these via an abridged version of a function in D3. Although
    the r3.svg line function was simple, it showcased JavaScript''s nested functions,
    functions-as-objects, function overloading, typing, closures, and power of this.


    As JavaScript moves into larger systems, it becomes increasingly important to
    control this somewhat wild language. You will saw that segregating code into separate
    script files, while a good idea for other reasons, does not truly modularize your
    code. Instead, rely on the design principles exemplified by the D3 case study,
    well as the tried-and true principles of software engineering. Those include the
    SOLID principles and the DRY principle: Don''t Repeat Yourself.


    Unit tests are the best investment you can make in long-term application reliability.
    Without them, the only thing you have to ensure your application functions properly
    is hope.


    Practicing test-driven development provides multiple benefits. First, it builds
    the unit test that ensures long-term reliability. Second, if you design the correct
    interfaces for your application''s objects. This book is chock of examples of
    test-driven development, and Chapter 24 is dedicated to TDD. Third and surprisingly,
    it helps you produce working code faster.


    One of the key actions you can take to improve testability is to pay close attention
    to separation of concerns and make use of software engineering concepts such as
    the Single Responsibility Principle and dependency injection.


    With these ideas in hand, you are ready to meet the challenges of software craftsmanship.
    It''s time to pick up some tools.'
