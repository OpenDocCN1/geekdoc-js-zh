  md: '# Expectations and Matchers


    Each of the tests contains an expect statement. Here''s the expect from the first
    createReservation unit test:

    expect(testReservation.passengerInformation).toBe(testPassenger);

    The expect function takes the actual value generated by the code under, in this
    case testReservation.passengerInformation, and compares it with the value that
    is expected. The expected value in the first unit test is testPassenger.

    The comparison between the actual value and the expected value is performed using
    a matcher function. Matchers return either true to indicate that the comparison
    was successful, or false to indicate the comparison was not successful. A spec
    that contains one or more expectations with an unsuccessful matcher is considered
    failing. Conversely, a spec that contains only expectations with successful matchers
    is considered passing.

    The example above used the toBe matcher, you guessed it—you expect testReservation.passengerInformation
    to be the same object as testPassenger.

    asmine has many built-in matchers, but if it doesn''t have the exact matcher you
    need, Jasmine supports creating custom matchers. Creating custom matchers can
    be an excellent way to DRY out the test code.


    > NOTE There are also matcher libraries, such as jasmine-jquery (https://github.com/velesin/jasmine-jquery)
    that can increase your matching capabilities.


    # Spies


    Jasmine''s spies are JavaScript functions that act as test doubles. A test double
    replaces the default implementation of a function or object with another, usually
    simpler, implementation during a test. Test doubles commonly reduce the complexity
    of unit-testing by removing dependency on external resources, such as web services.

    Earlier in this, we contemplated extending the capabilities of the createReservation
    function to include direct communication with a web service to save the reservation
    in a database. At the time, it was decided that web service communication did
    not fall within the responsibility of the function.

    Charlotte, one of the other members on your team, has a ReservationSaver object
    encapsulating the ability to submit a reservation to a web service via a call
    to its saveReservation function. You''d like to extend the createReservation function
    to accept an instance of ReservationSaver as an argument and ensure the ReservationSaver''s
    saveReservation function is executed.

    Because the saveReservation function communicates with a web service, your test
    needs to save the reservation and then ensure that the reservation was added,
    right? Thankfully, no; you don''t have to do that, nor would you want to. Doing
    so would make your unit tests depend on the presence and correctness of external
    systems: the web service and the database.'
