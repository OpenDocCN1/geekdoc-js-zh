  md: "# LISTING 3-1: An example of the module-at-will pattern\n\n```\n// A global\
    \ object serves as a namespace, collecting\n// all the objects (modules) that\
    \ are to be available\n// throughout the application.\nvar MyApp = MyApp || {};\n\
    \n// A module under the application's namespace.\n// The function depends on another\
    \ function, animalMaker, which can\n// be injected.\nMyApp.wildlifePreserveSimulator\
    \ = function(animalMaker) {\n  // Private variables\n  var animals = [];\n  //\
    \ Return the API\n  return {\n    addAnimal: function(species, sex) {\n      animals.push(animalMaker.make(species,\
    \ sex));\n    },\n    getAnimalCount: function() {\n      return animals.length;\n\
    \    }\n  };\n};\n```\n\nYou would use the module like this:\nvar preserve = MyApp.wildlifePreserveSimulator(realAnimalMaker);\n\
    preserve.addAnimal(gorilla, female);\n\nAlthough the module returns an object\
    \ literal, dependencies such as animalMaker can be injected into the outer function\
    \ and find their way to the literal.\n\nBecause modules can be injected into other\
    \ modules, they are easy to extend. You inject the old version into the new, which\
    \ wraps, exposes, and extends it as required. If the open/closed principle from\
    \ Chapter 1 appeals to you, modules are ideal.\n\nAspects (see Chapter 2) may\
    \ be applied to the returned object by first installing an \"after\" advice on\
    \ MyApp.wildlifePreserveSimulator. This advice will get held of the returned literal\
    \ and modify it with further aspects as required.\n\n# Creating Immediate-Execution\
    \ Modules\n\nOften, the outer function is executed as soon as it is declared,\
    \ returning the API just as the module-at-will. The returned API is assigned to\
    \ a namespaced global variable, which then becomes the singleton instance of the\
    \ module. Listing 3-2 modifies Listing 3-1 in that way.\n\n# LISTING 3-2: A singleton\
    \ module\n\n```\nvar MyApp = MyApp || {};\nMyApp.wildlifePreserveSimulator = (function()\
    \ {\n```"
