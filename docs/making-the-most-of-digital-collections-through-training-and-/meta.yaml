    If anonymous (and named) functions defined and provided directly as callbacks
    lead to difficult-to-test code, what is a better—testable—way to implement the
    callback that checks in an attendee?


    We suggest that checking in an attendee is a significant responsibility, one that
    should be encapsulated into its own module, called checkService. Doing so provides
    a testable unit and promotes code reuse by decoupling the act of checking in an
    attendee from the attendeeCollection.


    > NOTE Many people fear that test-driven development will lead to improvised,
    haphazard code. On the contrary, careful attention to the details of testing will
    improve the structure of your programs.


    Additionally, as the section “Using the Module Pattern” illustrated in Chapter
    3, dependencies may be injected into checkService. It is reasonable to consider
    registration of a check-in with an external system as a separate responsibility,
    so it is appropriate to inject an object that has the registration responsibility
    into checkService. That object is an instance of checkInRecorder, a module you
    will develop later. (See Chapter 6.)


    Listing 5-4 provides a test suite that exercises the basic functionality of the
    checkService.checkIn function.'
