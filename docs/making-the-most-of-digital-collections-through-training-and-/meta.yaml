  md: "“Absolutely. We can isolate each one in its own sandbox,” Charlotte responds\
    \ confidently, and provide the tools the widget needs, and only the tools the\
    \ widget needs, via the sandbox.”\n\n# Creating a Widget Sandbox\n\nAs Charlotte\
    \ stated, the goal of the widget sandbox is to isolate each of the widgets to\
    \ ensure that it can function on its own. The Sandbox Pattern will also allow\
    \ a controlled set of dependencies to be provided to each widget, giving it the\
    \ tools that it needs to do its job.\n\n# Instantiating a Widget Sandbox\n\nThe\
    \ WidgetSandbox constructor function will be designed to be used with the new\
    \ keyword. Also, it will expect to be called with at least one argument: the function\
    \ to create the widget that will be isolated within the sandbox. The unit tests\
    \ that verify this behavior are shown in Listing 11-1.\n\nLISTING 11-1: Initial\
    \ WidgetSandbox constructor function unit tests (code filename: Sandbox\\WidgetSandbox_01_tests.js)\n\
    \n```\ndescribe(\"Conference.WidgetSandbox\", function() {\n  'use strict';\n\n\
    \  describe(\"Constructor function\", function() {\n    it(\"throws if it has\
    \ not been invoked with the 'new' keyword\", function() {\n      expect(function\
    \ shouldThrow() {\n        var sandbox = Conference.WidgetSandbox();\n      }).toError(Conference.WidgetSandbox.messages.mustCalledWithNew());\n\
    \    });\n  });\n\n  it(\"throws if a widget function is not provided\", function()\
    \ {\n    [null, undefined, 1, \"String\", false]\n      .forEach(function testInvalid(notAFCN)\
    \ {\n        expect(function shouldThrow() {\n          var sandbox = new Conference.WidgetSandbox(notAFCN);\n\
    \        }).toError(Conference.WidgetSandbox.messages.fcnMustBeProvided());\n\
    \      });\n    });\n  });\n\n  it(\"invokes the widget function with the sandbox\
    \ as an arg\", function() {\n    var moduleFCN = jasmine.createSpy();\n    var\
    \ sandbox = new Conference.WidgetSandbox(moduleFCN);\n    expect(moduleFCN).toHaveBeenCalledWith(sandbox);\n\
    \  });\n});\n```\n\nThe first test, ensures that the WidgetSandbox is executed\
    \ using the new keyword, will be familiar from Chapter 3.\n\nThe second test verifies\
    \ the expectation that the sandbox will be provided with a function it may execute\
    \ to create an instance of the widget to be isolated. Notice that the test provides\
    \ undefined as an argument, simulating executing WidgetSandbox with no arguments.\
    \ It also goes step further"
