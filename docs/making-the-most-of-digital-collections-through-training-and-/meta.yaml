    \ objects with a constructor function, which looks completely different but has\
    \ the same result:\n\n```\nfunction XYPair(x,y) {\n  this.x = x;\n  this.y = y;\n\
    }\n```\n\n```\nvar objectData = [\n  new XYPair(10, 130),\n  new XYPair(100, 60),\n\
    \  new XYPair(190, 160),\n  new XYPair(280, 10)\n];\n```\n\nThis is called duck\
    \ typing, after the saying \"If it looks like a duck, walks like a duck and quacks\
    \ like a duck, it is a duck.\" In JavaScript, ducks are some of your best friends.\
    \ It is possible to distinguish the cases:\n\n```\nif (something instanceof XYPair)\n\
    ```\n\nHowever, there is almost never a reason to do so. A C# or Java programmer\
    \ might attempt to learn whether an object is up to snuff through such inspections,\
    \ the JavaScript way is to simply check for the existence of the properties:\n\
    \n```\nif ('x' in something) // something has or inherits a property x.\n```\n\
    \nor\n\n```\nif (something.hasOwnProperty('x')) // something has x without inheriting\
    \ it\n```\n\nDuck typing is not sloppiness. It is an important way to give a component\
    \ more reach.\n\n> NOTE duck typing. It allows a little code to accommodate a\
    \ wide range of objects.\n\nIf you read Listing 1-1 you might have wondered how\
    \ the inner line function manages to access the private variables of the outer\
    \ r3.svg.line after the function has returned. Programmers from other languages\
    \ might expect the variables getX, getY, and interpolate to pop off the stack\
    \ once exit the function that declared them. And so they would, for one thing:\
    \ JavaScript's code of closures.\n\nWe said earlier when you call r3.svg.line(),\
    \ it returns a closure, which you can think of as an object that the outside looks\
    \ like the function (inner line), but on the inside remembers the environment\
    \ that prevailed when the function was created (the variables getX, getY and interpolate).\
    \ You call line's functions as you normally would, but they are aware of line's\
    \ original environment.\n\n> NOTE Closures are a very powerful design element\
    \ in JavaScript. Every function is a closure."
