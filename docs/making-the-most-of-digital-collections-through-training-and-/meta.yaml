  md: 'A good use of object literals is to pass a bundle of data from one place to
    another. For example, in JavaScript: The Good Parts (O''Reilly Media, 2008), Douglas
    Crockford suggests using an object literal rather than a long list of function
    arguments whose order might be difficult to get right. Furthermore, he points
    out, the absence of a property in the literal can be the signal to use a default
    value.


    This can be wary, but beware: You are putting a large burden on yourself if your
    function must be prepared for any combination of properties. You might consider
    using an object that has well-controlled and well-tested ways of construction,
    and maybe even an isValid()


    Table 3-2 summarizes the SOLID and DRY aspects of object literals.


    # TABLE 3-2: SOLID AND DRY Summary for Object Literals


    | PRINCIPLE | RESULT |

    |---|---|

    | Single Responsibility | In practice, bare object literals tend to be small enough
    that they don''t get into trouble on this score. Larger ones that comprise the
    APIs of modules (see the next section) beware whatever responsibilities the module
    takes on |

    | Open/Closed | The ethos of object literals seems to invite unmanaged extensions.
    Beware! |

    | Liskov Substitution | Not applicable |

    | Interface Segregation | See the Module Pattern in the next section and monkey-patching
    in the final section of this chapter. |

    | Dependency Inversion | Bare object literals fail here because they have no constructor
    in which inject dependencies. |

    | Don''t Repeat Yourself | Unless they are singletons, bare object literals will
    cause WET code. A big warning here |


    # USING THE MODULE PATTERN


    The Module Pattern is one of the most venerable in JavaScript. It employs a function
    whose main purpose is data-hiding, and which returns an object that comprises
    the module''s API. Modules come in two flavors: those you can construct by calling
    a function, and those that are based on a function that executes as soon as it
    is declared.


    # Creating Modules-at-Will


    Listing 3-1 is an example of a module that you can create whenever you want. Just
    call the module''s function and get your API back.'
