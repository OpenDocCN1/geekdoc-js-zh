    \ MyApp.Gorilla better has hands!\n\nBecause of possible (even future!) the borrowed\
    \ function might have, the most reliable way to manage is the donor object manage\
    \ the patch. It can ask the object whether it meets the requirements.\n\n```\n\
    MyApp.Human.prototype.endSigning = function(receivingObject) {\nif (typeof receivingObject.getHandCount\
    \ === 'function'\n&& receivingObject.getHandCount() >= 2) {\n  receivingObject.useSignLanguage\
    \ = this.useSignLanguage;\n} else {\n  throw new Error(\"Error. Sorry. I can't\
