  md: "# Making Your Code More Reliable with AOP\n\nIt's easy to see how AOP produces\
    \ more reliable code. First, it keeps your functions simple. They execute their\
    \ Single Responsibility, and that is all. Simplicity begets reliability.\n\nSecond,\
    \ it keeps your code DRY. The obvious point here is that multiple occurrences\
    \ of the code represent multiple places that someone could break later, and multiple\
    \ opportunities to get out of sync. There's more subtle point: You also don't\
    \ want to repeat the code that connects the new functionality (caching) to the\
    \ old (getting a ticket).\n\nConsider all the logic in Listing 2-24 that was devoted\
    \ to weaving the aspect into the code. Every time a developer follows this pattern,\
    \ there is a chance he will make a mistake. Because of this, if you're serious\
    \ about test-driven development, each time will require the full complement of\
    \ unit tests. Those tests will look a lot like each other—more repetition!\n\n\
    > NOTE It is just as important not to repeat the way a block of code connects\
    \ to other code, as it is not to repeat the block itself.\n\nThird, it allows\
    \ you to centralize the configuration of your application. If you create one function\
    \ whose Single Responsibility is configuring your aspects, you have only one place\
    \ to consult when you want an overview of your bells and whistles. More importantly,\
    \ if you are hunting a bug and want to deflate its habitat, you can easily turn\
    \ off features such as caching. You can also turn on features as argument checking.\
    \ There may be an aspect that you want to turn on and off according to an end-user's\
    \ preferences.\n\n# Case Study: Building the Aop.js Module\n\nAspect-oriented\
    \ programming consists of sticking functions in new ways. What could be better-suited\
    \ for an enterprise than JavaScript? We would like to showcase a particularly\
    \ elegant framework from Fredrik Appelberg and Dave Clayton, for free at https://github.com/davedx/aop.\
    \ Simply named Aop.js is a marvel of concision, compressed to an minimum with\
    \ every tool of JavaScript's art.\n\nTake a few minutes to look over Listing 2-25.\
    \ Don't worry if it's impenetrable at first. That is exactly our hope. You will\
    \ use test-driven development (TDD) to make it all clearly short.\n\n+   LISTING\
    \ 2-25: Aop.js\n\n```\n// Created by Fredrik Appelberg:\n// http://fredrik.appelberg.me/2010/05/07/aop-js.html\n\
    // Modified to support prototypes by Dave Clayton\nAop = {\n  // Apply advice\
    \ to all matching functions in the given namespaces\n  around: function(pointcut,\
    \ advice, namespaces) {\n    // if no namespaces are supplied, use a trick to\
    \ determine the global ns\n    if (namespaces == undefined || namespaces.length\
    \ == \n```"
