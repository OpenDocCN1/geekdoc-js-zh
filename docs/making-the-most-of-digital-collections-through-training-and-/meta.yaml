  md: '# ABOUT THE AUTHORS


    **LARRY SPENCER** is Vice President of Application Development at ScerIS, a software
    and ser-vices company in Sudbury, Massachusetts. He and his team create browser-based
    applications in AngularJS, with a C#/Web API/SQL Server back end. Larry''s 35-year
    career has included stints programming in COBOL, C, C++,#, and every mainframe
    assembly language, but he says JavaScript is the most fun. A frequent speaker
    at Code Camps and other gatherings, Larry enjoys sharing his life of software
    with the development community. You can find his blog at http://FascinatedWithSoftware.com.


    Larry''s outside interests include philosophy, chess, and classical guitar. He
    lives in Marlborough, Massachusetts.


    **SETH RICHARDS** has been crafting software professionally since 2002. He got
    his start program-ming embedded devices for the bar and nightclub industry and
    transitioned to web application development in 2007. He has worked on numerous
    web-based applications ranging from an enterprise-class geographic information
    system-centric physical asset management system to a social network for product
    discovery and recommendation.


    Seth graduated from Plymouth State College (now University) in Plymouth, New Hampshire,
    where he studied computer science and mathematics. He is currently pursuing his
    M.S. in Computer Science from the Georgia Institute of Technology. Seth''s blog
    can be found at http://blogshrichards.com, and he can be followed on Twitter at
    @shrichards.'
  merge: -1
  pgno: 8
- img_proc: false
  md: '# ABOUT THE TECHNICAL EDITORS


    KEITH PEPIN has been developing sites and applications on the web for over 17
    years. Early in his career, he fell in love with JavaScript and has been passionately
    building dynamic user experiences ever since. He is currently a Senior Software
    Engineer at Meltwater, and is using HTML5, CSS3, JavaScript, AngularJS, Node.js,
    and MongoDB to build the next generation of their online marketing intelligence
    platform. When not coding or spending time with his family, he enjoys other geeky
    pursuits, including all forms of games, comic books, painting, and sketching.


    JOHN PELOQUIN is a software engineer with over 10 years of JavaScript experience
    ranging across applications of all sizes. John earned his B.A. in Mathematics
    from U.C. Berkeley and is currently a lead engineer at Spreemo, a healthcare technology
    startup in NYC. Prior to editing this volume, John edited Professional Website
    Performance by Peter Smith (Wiley 2012) and Professional JavaScript for Web Developers,
    3rd ed. by Nicholas Zakas (Wiley 2012). When he is not coding or collecting errata,
    John can occasionally be found doing stand-up comedy at an open mic.'
