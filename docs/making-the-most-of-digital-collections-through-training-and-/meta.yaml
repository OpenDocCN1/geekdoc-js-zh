    There''s quite a bit of code to digest in Listing 5-2, but it isn''t particularly
    complicated once understand the primary goals of testing code that uses the Callback
    Pattern. The tests specific to callback functionality to ensure that:


    +   - The callback was executed the correct number of times.

    - The callback was executed with the correct arguments each time.


    The first step in achieving the testing goals is to create some sort of callback
    function that can keep a record of each time it is executed, including the arguments
    that were provided when it was executed. Jasmine spies, introduced in Chapter
    2, provide this functionality (and more).

    The tests for the iterate function in Listing 5-2 use the callbackSpy Jasmine
    spy instance, which is initialized in the beforeEach block prior to the execution
    of each test via `callbackSpy = jasmine.createSpy();`


    > NOTE A spy created with createSpy is a bare spy. Unlike spies created with a
    call to spy(someObject, someFunction), bare spies don''t require a preexisting
    object and function to spy on.

    Bare spies have no functionality beyond "spy stuff" such as tracking invocations;
    you can''t set them up to call through to the implementation of the spied function
    (because there is none), nor can you configure them to call some other function
    when invoked.

    Even with these limitations, a bare spy is perfect to ensure that a callback function
    is executed appropriately.


    Each of the tests sets up the collection object, also created in the beforeEach
    block, to contain the number of attendee objects appropriate for the test.

    The tests execute `collection.iterate(callbackSpy);` which, once iterate is implemented,
    should cause callbackSpy to be executed once per attendee in the collection.

    The helper function `verifyCallbackWasExecutedForEachAttendee` performs the heavy
    lifting in each test; it''s responsible for ensuring that the goals for testing
    code using the Callback Pattern have been satisfied.

    The callbackSpy automatically collects information about each time it is executed
    into an object that is added to its calls property. Comparing the number of times
    the spy was called—by counting the number of elements that were added to the collection
    with the


    ```

    expect(callbackSpy.calls.count()).toBe(attendeeArray.length);

    ```'
