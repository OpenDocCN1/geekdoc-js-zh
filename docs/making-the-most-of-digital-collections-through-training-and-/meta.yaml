    # Introducing JSHint


    JSHint is an open-source static analysis tool that describes itself in the following
    way:


    > JSHint is a community-driven tool to detect errors and potential problems in
    JavaScript code and to ensure your team''s coding conventions.


    http://www.jshint.com/about


    JSHint is a fork of the JSLint project. JSLint was created and maintained by Douglas
    Crockford. At the time they forked from JSLint, JSHint''s creators felt that JSLint
    had become “opinionated” and that a lint tool driven by the JavaScript community
    was needed.


    # Using JSHint


    You can copy-paste your JavaScript code into the JSHint homepage at http://www.jshint.com
    and the linter will execute automatically. While perhaps convenient for identifying
    a problem in a piece of code for a blog post (or book), using this mechanism to
    execute the linter is not suitable for development of a JavaScript solution with
    limited complexity.


    Because the calculateUpgradeMileages function is a piece of sample code for a
    book, you can use the online tool at http://www.jshint.com to find the questionable
    construct in the function.


    Figure 2-12 shows what JSHint says about calculateUpgradeMileages.


    As you can see, JSHint provides the following warning:


    > Don''t make functions within a loop.'
