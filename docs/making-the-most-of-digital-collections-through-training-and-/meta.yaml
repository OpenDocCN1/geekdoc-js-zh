  md: 'Using a Testing Framework | 39


    > **NOTE** Unlike the Jasmine framework, neither QUnit nor D.O.H place library
    functions in the global scope; they''re accessed via the QUnit and doh objects,
    respectively.


    # # Introducing Jasmine


    Jasmine is a library for creating JavaScript unit tests in a behavior-driven development
    (BDD) style.


    > **NOTE** BDD? Aren''t we TDD? Behavior-driven development and test-driven development
    are not mutually exclusive. Behavior-driven development uses natural-language
    descriptions to define the functionality, or behavior, that a particular unit
    unit test is exercising. We think that defining tests in this way helps us write
    tests that describe the code we''re writing should, rather than how it does we
    do. Also, as we noted previously, tests that are defined and organized in a behavior-driven
    manner have the benefit of generating a specification of functionality that is
    described in plain terms.


    In this section, we describe the basics of the framework, but we highly recommend
    you visit the Jasmine homepage at http://jasmine.github.io where you can find
    the library''s documentation—which is a runnable Jasmine test suite—for in-depth
    exposure.


    # # Suites and Specs


    Jasmine test suites are defined using the global describe function. The describe
    function accepts two arguments:


    +   * A string, usually one that describes what is being tested

    * A function, containing the implementation of the test suite


    Test suites are implemented using specs, or individual tests. Each spec is defined
    using the global function. Like the describe function, it takes two arguments:


    +   * A string, usually one that describes the behavior being tested

    * A function containing at least one expectation: an assertion that a state of
    the code is either true or false


    Test suite implementations may also use of the global beforeEach and afterEach
    functions. When included within a suite implementation, the beforeEach is executed
    before each of the tests in the suite. Conversely, the afterEach and afterEach
    functions are useful for performing common setup and teardown, reducing duplication
    within a test suite.'
