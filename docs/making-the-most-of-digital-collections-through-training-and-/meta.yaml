  md: '# INTRODUCTION


    let sHaveFun(me);


    JavaScript will let the call proceed with the variable undefined, just for the
    fun of watching you try to play with someone who isn''t there.


    We could go on and on. There are surprising scoping rules, a unique “prototypal”
    inheritance mechanism, automatic and sometimes incorrect semicolon insertion,
    the ability of one object to borrow a function from a totally unrelated object,
    et cetera, et cetera.


    With globals popping into existence unbounded, an almost total lack of architectural
    tradition, a questionable relationship to the truth, and more quirkiness than
    you''d find at a cosplay convention, it''s a wonder that JavaScript has done as
    well as she has in the world.


    Believe it or not, it gets worse before it gets better. Even if you get it right,
    it can go wrong so easily.


    # THE EASIE OF UNINTENTIONALLY BREAKING JAVASCRIPT CODE


    JavaScript has a perverse sense of humor. In a staid, compiled language, if you
    have a line of perfectly, debugged code running flawlessly in production like
    this


    ```

    myVariable = myWeb.myProperty;

    ```


    and then accidentally bump the x key on your keyboard so that you now have


    ```

    myVariable = myWeb.myPropperty;

    ```


    the compiler will emit a stern message that you should be more careful next time.
    JavaScript will happily run the code and give the value of undefined to myVariable.
    “Let’s have fun and see what happens!” she says.


    When you want to change the name of a property, JavaScript likes to play hide-and-seek.
    You might think searching your entire source tree for


    .myProperty


    would turn up all the places to change. “No, no, no!” JavaScript says with a grin.
    “You forgot to search for {‘myProperty’}.


    Actually, you should search with a regular expression that allows spaces between
    the brackets and the quotes. Have you ever done that? Neither have we.


    And then, depending on the mood, she or may not let it come to your mind that
    you should also search for constructs like this:


    ```

    var prop = ''myProperty'';

    // . . /

    myObject[prop] = something;

    ```


    When it is so hard to accomplish even such a trivial refactoring, you can imagine
    how easily tasks find their way into your code. Code that is not amenable to refactoring
    almost defines the word “brittle.”


    xxiii'
