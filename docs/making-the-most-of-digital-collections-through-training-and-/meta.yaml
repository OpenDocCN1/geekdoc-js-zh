  md: 'There is another, more subtle benefit to DI. You typically have more control
    over injected spies or fakes over real objects. Thus, it is easier to produce
    error conditions and other evita. What’s easier is more likely to get done, so
    you’ll find that things work more consistently.


    Finally, DI promotes code reuse. Modules that have hard-coded dependencies tend
    not to be reused because they drag in too much baggage. The original Attend module
    could never have been reused on the server side of its hard-coded use of Messenger.
    The DI version allows you to use any messenger that has success and failure methods.


    # Mastering Dependency Injection


    Dependency injection is not difficult. In fact, it makes life much easier. To
    become a DI Jedi, just keep these things in mind.


    Whenever you’re coding an object, and it creates a new object, ask yourself the
    following questions. If the answer to any of them is “Yes,” then considering injecting
    instead of instantiating it.


    +   - Does the object or any of its dependencies rely on an external resource
    such as a database, configuration file, HTTP, or other infrastructure?

    - Should my tests account for possible errors in the object?

    - Will some of my tests want the object to behave in particular ways?

    - Is the object one of mine, as opposed to one from a third-party library?


    Choose a good dependency-injection framework to help you and become intimately
    familiar with its API. The next section will help you get started.


    # Case Study: Writing a Lightweight Dependency-Injection Framework


    The dependency injection you’ve seen so far is hard-coded. It’s an improvement
    on the Big Ball of Mud style of programming, but not still ideal. Professional
    dependency-injection frameworks work like this:


    +   - After application startup, you register your injectables in a DI container,
    identifying each one by name and naming the dependencies it has, in turn.

    - When you need an object, ask the container to supply it.

    - The container instantiates the object you requested, but first it recursively
    instantiates all its dependencies, injecting them into the objects as.


    In frameworks that use dependency injection heavily, as AngularJS, the process
    can seem almost magic and too good to be true. In fact, it’s so magic that it
    can be hard to understand. To learn how these frameworks function, let’s build
    a DI container.


    This will also serve as a case study for development. You will see how building
    the code bit by bit, in response to tests, makes for reliable JavaScript.'
