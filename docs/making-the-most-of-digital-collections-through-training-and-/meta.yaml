  md: "then JavaScript will immediately find chimp's toString implementation and execute\
    \ it, yielding\n'I am the chimpanzee'; chimp's prototype will not be examined.\n\
    \n# Prototypical Inheritance\n\nEven though Object.prototype has some useful properties,\
    \ the power of JavaScript's prototypal inheri-\\comes from being alias to replace\
    \ default prototype with a custom one. That in addi-\nto the chimp object, you\
    \ would also like to create a bonobo object. Because they are related in\nthe\
    \ animal kingdom, you would know the chimp object and the bonobo object will have\
    \ many common properties.\n\nTo reduce the repetition of properties between the\
    \ objects, you can create an object, named ape,\nwhich holds these common properties.\
    \ You can create chimp and bonobo objects that are\nlinked to ape; this makes\
    \ an ape shared prototype.\n\nECMAScript 5 provides the Object.create method,\
    \ which handles creation of a new object linked\nto a provided prototype. The\
    \ following snippet illustrates the use of Object.create to construct\nchimp and\
    \ bonobo objects that have ape as a shared prototype:\n\n```\nvar ape = {\n  hasThumbs:\
    \ true,\n  hasTail: false,\n  swing: function() {\n    return 'swinging';\n  }\n\
    };\n```\n\n```\nvar chimp = Object.create(ape);\nvar bonobo.habitat = Object.create('Central\
    \ Africa');\n```\n\n```\nconsole.log(bonobo.habitat); // 'Central Africa' (from\
    \ bonobo)\nconsole.log(bonobo.hasTail); // false (from ape prototype)\n```\n\n\
    ```\nconsole.log(chimp.swing()); // 'swinging' (from ape prototype)\n```\n\nAs\
    \ you can see, both bonobo and chimp inherit properties from ape. You would also\
    \ note that bonobo\nhad the habitat property added directly to it; this property\
    \ is shared with neither ape nor chimp.\n\nBecause ape is a shared prototype,\
    \ any change to it will be reflected in both chimp and bonobo:\n\n```\nape.hasThumbs\
    \ = false;\nconsole.log(chimp.hasThumbs); // false\nconsole.log(bonobo.hasThumbs);\
    \ // false\n```\n\n# Prototype Chains\n\nYou may use multiple levels of prototypes,\
    \ called prototype chains, to create multiple levels of\ninitance. For example,\
    \ suppose ape has a prototype of primate, and then ape is used as the\nprototype\
    \ of chimp =\n\n```\nvar primate = {\n  stereoscopicVision: true\n```"
