  md: "You want your container to do just two things: accept registrations for injectables\
    \ and their dependencies, and supply objects on request. Suppose you code the\
    \ register function first. It will take three arguments:\n\n+   - The name of\
    \ the injectable.\n- An array of the names of its dependencies.\n- A function\
    \ whose return value is the injectable object. In other words, when you ask the\
    \ container for an instance of the injectable, it will call this function and\
    \ return whatever the function returns. The container will also pass instances\
    \ of the requested object's dependencies to this function, but you can hold off\
    \ on using this until later dates.\n\nTDD works best when you code the absolute\
    \ minimum at every stage, you might start by coding only an empty version of register.\
    \ Because this function is an asset that can be shared by all instances of DiContainer,\
    \ you would make it part of DiContainer's prototype. (See Listing 2-11)\n\n# LISTING\
    \ 2-11: Empty DiContainer.register function (code filename: D\\DiContainer_00.js)\n\
    \n```\nDiContainer = function() {\n};\nDiContainer.prototype.register = function(name,\
    \ dependencies, func) {\n};\n```\n\nTo make the code as reliable as possible,\
    \ you'd want to verify that these arguments were passed and of the right types.\
    \ Laying solid foundation is often a good first test, then for your subsequent\
    \ tests can rely on. Listing 2-12 shows such a test.\n\n# LISTING 2-12: Test for\
    \ verifying arguments (code filename: D\\DiContainer_01_tests.js)\n\n```\ndescribe('DiContainer',\
    \ function() {\n  var container;\n  beforeEach(function() {\n    container = new\
    \ DiContainer();\n  });\n  describe('register(name, dependencies, func)', function()\
    \ {\n    it('throws if any argument is missing or the wrong type', function()\
    \ {\n      var badArgs = {\n        // No args at all\n        [],\n        //\
    \ Just the name\n        ['Name'],\n        // Just name and dependencies\n  \
    \      ['Name', ['Dependency1', 'Dependency2']],\n        // Missing the dependencies.\n\
    \        // (Commercial frameworks support this, but DiContainer does not.)\n\
    \        ['Name', function() {}],\n        // Various examples of wrong types\n\
    \      };\n```"
