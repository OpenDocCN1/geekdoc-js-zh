  md: "the tiny variety, but illustrates how patterns accumulate and improve through\
    \ experience and how code becomes cleaner and more reliable through their use.\n\
    \nThe first version of looping through an array is so old-fashioned that it is\
    \ not even valid JavaScript (containing, as it does, a goto), that is how programming\
    \ was done before better patterns emerged.\n\n```\nix=0;\nthe_test:\nif (ix >=\
    \ myArray.length) {\n  goto the_end;\ndoSomething(myArray[ix]);\nix = ix+1;\n\
    goto the_test; // Prend JavaScript has a goto statement.\nthe_end;\n```\n\nThe\
    \ goto statement led to code that was so hard to follow that its became shunned.\
    \ Shunning turned to banishment and now JavaScript doesn't even have a goto statement.\
    \ A better pattern, the for loop was incorporated into the language:\n\n```\n\
    for (ix=0; ix<myArray.length; ++ix) {\n  doSomething(myArray[ix]);\n}\n```\n\n\
    The version is better because it is more concise and clear. Isn't it easier to\
    \ tell at a glance what code is attempting to do? Doesn't it seem like much room\
    \ for error than the goto version?\n\nYet for was not the last word. The accumulation\
    \ of experience and patterns was not complete. Looping through arrays is so common\
    \ that the designers of ECMAScript 5 have provided an even more concise formulation:\n\
    \n```\nmyArray.forEach(doSomething);\n```\n\nThis is even clearer because the\
    \ entire for statement, with its initialization, test, and increment, has been\
    \ replaced by the simple and obvious myArray.forEach.\n\nNot only is it more clear,\
    \ but it's more reliable. It is impossible to commit an off-by-one error in the\
    \ condition because there is no condition. You can't reference the wrong element\
    \ in the array because there are no subscriptions.\n\nOf course, myArray.forEach\
    \ is only clear if you know what a forEach statement is and you are comfortable\
    \ with callbacks. That brings us to the first main point of this chapter: how\
    \ a broader vocabulary can help you produce more elegant code.\n\n# PRODUCING\
    \ MORE ELEGANT CODE BY USING A nBROADER VOCABULARY\n\nIt is a common misconception\
    \ that code is simplest and easiest to understand when it employs only the most\
    \ elementary concepts. On the contrary, an impoverished vocabulary results in\
    \ longer, more tortuous programs."
