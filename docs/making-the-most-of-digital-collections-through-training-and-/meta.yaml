    Second, and far less significant than the testing difficulty just mentioned, is
    that anonymous functions can make debugging more difficult. Because the anonymous
    function—by definition—does not have a name, there''s nothing for a debugger to
    display in the call stack. Figure 5-2 is a screenshot of the Chrome Developer
    Tools used when a breakpoint was set inside the anonymous function in the example.


    ![](bbox=[0.068, 0.355, 0.932, 0.565])


    FIGURE 5-2


    When waiting at the breakpoint, outlined on the left, Chrome displays (anonymous
    function) in the call stack, outlined on the right. When you don''t have a function
    name to refer to, you don''t have an inkling of the context in which the function
    is being executed. This complicates the debugging task.


    This is worse if you''re debugging code reached through a series of anonymous
    callbacks. Each (anonymous function) entry in the call stack would represent a
    mystery you have to investigate to get a full picture of the context in which
    the code is being executed.


