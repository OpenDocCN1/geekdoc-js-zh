    The what?? you ask!


    Coined by Barbara Liskov in a formal way in Data Abstraction and Hierarchy (SIGPLAN
    Notices 23, 5 [May, 1988]), this principle might be stated more colloquially in
    a JavaScript context as follows:


    ```

    Code to use an object of a certain type should not have to change if provided
    with an object of a derived type.

    ```'
