  md: "# Dependency Inversion\n\nModules-at-will can be injected with dependencies\
    \ very easily. Either type of module can be injected into others.\n\n# Don’t Repeat\
    \ Yourself\n\nDo right, modules are a very good way to keep your code DRY.\n\n\
    # USING OBJECT PROTOTYPES AND PROTOTYPAL INHERITANCE\n\nEach every object in JavaScript,\
    \ regardless of the mechanism used to create it, has a linked prototype object\
    \ from which it inherits properties. In this section, you learn about object prototypes\
    \ and the basics of prototypal inheritance.\n\n# The Default Object Prototype\n\
    \nObject literals, familiar from a previous section, are automatically linked\
    \ to the built-in .prototype object. Consider the chimp object defined thus:\n\
    \n```\nvar chimp = {\n  hasThumbs: true,\n  swing: function(){\n    return 'swinging\
    \ through the tree tops';\n  }\n};\n```\n\nThe chimp object doesn’t define a toString\
    \ function, but executing chimp.toString(); does not result in an undefined function\
    \ error. In fact, it outputs a string representation of the chimp object ('object\
    \ Object]', which isn't very descriptive).\n\nWhen chimp() is invoked, JavaScript\
    \ examines the chimp object and determines that it doesn’t directly define a toString\
    \ property. Next, it looks at chimp’s prototype, Object.prototype, which does\
    \ define a toString function is then executed and its value returned.\n\n> NOTE\
    \ Object.prototype defines many useful functions. A complete list is available\
    \ at https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/prototype.\n\
    \nIf chimp defines its own toString function:\n\n```\nvar chimp = {\n  hasThumbs:\
    \ true,\n  swing: function(){\n    return 'swinging';\n  },\n  toString: function(){\n\
    \    return 'I am the chimpanzee';\n  }\n};\n```"
