  md: "```\nnamespaces = { (function(){return this;}).call() };\n// loop over all\
    \ namespaces\nfor(var i in namespaces) {\n  var ns = namespaces[i];\n  for(var\
    \ member in ns) {\n    if(typeof member == 'function' && member.match(pointcut))\
    \ {\n      (function(fn, fnName, ns) {\n        // replace the member fn slot\
    \ with a wrapper which calls\n        // the 'advice' Function\n        ns[fnName]\
    \ = function(fn: fnName, {\n          return fn.call(this, fnName, arguments:\
    \ arguments });\n        };\n      }(ns[member], member, ns);\n    }\n  }\n}\n\
    \nnext: function(f) {\n  return f.fn.apply(this, f.arguments);\n};\n\nAop.before\
    \ = function(pointcut, advice, namespaces) {\nAop.around(pointcut, \n  function(f)\
    \ {\n    advice.apply(this, f.arguments);\n    return Aop.next.call(this, f);\n\
    \  },\n  namespaces);\n\nAop.after = function(pointcut, advice, namespaces) {\n\
    Aop.around(pointcut, \n  function(f) {\n    var ret = Aop.next.call(this, f);\n\
    \    advice.apply(this, f.arguments);\n    return ret;\n  },\n  namespaces);\n\
    ```\n\nAmazing, right? Perhaps a little to digest all at once\nIn the \"Using\
    \ a Dependency-Injection Framework\" section of this chapter, you used TDD to\
    \ build a reliable component from scratch. In this section, you will use TDD as\
    \ an aid to understand existing code. In fact, when we discovered Aop.js, this\
    \ is exactly what we did. We re-built most of it using TDD, gaining intimate knowledge\
    \ of each line as we went.\nOne characteristic of TDD is that you do not code\
    \ all the features of the application in one go. You add a test, code enough to\
    \ pass that test, possibly refactor, and repeat. Many developers wonder how such\
    \ an incremental approach can possibly produce elegant code. We hope the following"
