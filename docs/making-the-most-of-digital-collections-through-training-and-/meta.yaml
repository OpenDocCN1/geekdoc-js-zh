    \ the injected checkInRecorder\nvar recorder = checkInRecorder;\n\nreturn {\n\
    \  checkIn: function(attendee) {\n    attendee.checkIn();\n    return recorder.checkIn(attendee).then(\n\
    \      function onCheckInSucceeded(checkNumber) {\n        attendee.setCheckIn(checkNumber);\n\
    \        return Promise.resolve(checkNumber);\n      },\n      function onCheckInFailed(reason)\
    \ {\n        attendee.undoCheckIn();\n        return Promise.reject(reason);\n\
    \      })\n    );\n  }\n};\n```\n\nSecond, you cause the unit test not to issue\
    \ its expectation until the Promise from then is settled (a term meaning either\
    \ resolved or rejected). You do this by executing your expectation within a time,\
    \ as in Listing 6-4.\n\n# LISTING 6-4: A better unit test of checkInService.checkIn\
    \ (code filename: Promises\\checkInService_tests.js)\n\n```\nit(\"sets attendee's\
    \ checkInNumber\", function(done) {\n  checkInService.checkIn(attendee).then(\n\
    \    function onPromiseResolved() {\n      expect(attendee.checkInNumber()).toBe(checkInNumber);\n\
    \      done();\n    },\n    function onPromiseRejected() {\n      expect('This\
    \ failure branch was executed').toBe(false);\n      done();\n    }\n  });\n});\n\
    ```\n\nBecause a Promise can be either resolved or rejected, it is a good idea\
    \ to code both branches in your test. The rejection branch has an awkward-looking\
    \ expectation:\n\n```\nexpect('This failure branch was executed').toBe(false);\n\
    ```\n\nAs of writing, Jasmine does not have a better way to force a failure in\
    \ asynchronous code. An enterprising person has added an explicit fail function\
    \ to Jasmine (https://github.com/pivotal/jasmine/commit/b1344d5c73c5e01a07e445be3980f6db9de),\
    \ it is not yet part of the"
