  md: "demonstration will put those fears to rest. Along the way, you'll encounter\
    \ some features of JavaScript that make gems like Aop.js possible.\n\n> NOTE Test-driven\
    \ development produces elegant code just as reliably as older methods.\n\nAt its\
    \ heart, AOP intercepts the execution of a function (the target), causing it to\
    \ be preceded, followed, or surrounded by another function (the advice). You might\
    \ concentrate on the \"surround\" case, for the others are just special cases\
    \ of it. Following Fredrik's and Dave's lead, you will create a function, around,\
    \ in an Aop object. The source is in the AOP directory of this chapter's download.\
    \ See the remarks at the beginning of the chapter for details.\n\nYou could start\
    \ with a bare version of this function, as you see in Listing 2-26.\n\n# LISTING\
    \ 2-26: Empty Aop.around function (code filename: Aop\\Aop_00.js)\n\n```\nAop\
    \ = {\n  around: function(fnName, advice, fnObj) {\n    // Initial version does\
    \ nothing.\n  }\n};\n```\n\nYour first test, in Listing 2-27, is that Aop.around\
    \ causes the original function to be replaced by the advice.\n\n# LISTING 2-27:\
    \ Test that Aop.around causes the advice to execute (code filename: Aop\\Aop_01_tests.js)\n\
    \n```\ndescribe('Aop', function() {\n  describe('Aop.around(fnName, advice, targetObj)',\
    \ function() {\n    it('causes a call to the target to execute the advice',function()\
    \ {\n      var targetFn = {\n        targetFn: function () {}\n      };\n    \
    \  var executedAdvice = false;\n      var advice = function() {\n        executedAdvice\
    \ = true;\n      };\n      Aop.around('targetFn', advice, targetObj);\n      targetObj.targetFn();\n\
    \      expect(executedAdvice).toBe(true);\n    });\n  });\n});\n```"
