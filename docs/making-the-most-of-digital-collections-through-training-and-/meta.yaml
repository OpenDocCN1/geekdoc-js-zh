  md: "```\nfnObj[fnName] = function () {\n  var targetContext = {}; // We know this\
    \ is wrong; return to it later.\n  advice.call(targetContext, {fn:originalFn});\n\
    };\n```\n\nThere are two things worth noting here, the first call method. It is\
    \ similar to Invoke in C# or Java. It calls the function (advice in this case)\
    \ with the arguments starting in the second parameter (just fn:originalFn), but\
    \ more could have been added. Its first parameter is the context in which the\
    \ function is called (should be \"this\"). The context is important, but you have\
    \ not yet written any test about it so you just use an empty object as a placeholder.\n\
    \nCall has a sister, which applies the arguments to be in an array. If you want\
    \ to write elegant JavaScript, you'll want to make call and apply secure nature.\n\
    \nSecond, notice how the original function is captured in a variable, originalFn.\
    \ Its value is set when Aop.around is called. And no surprise, the marvel is still\
    \ available after fnObj[fnName] after Aop.around has returned. (A C# or Java programmer\
    \ might think that because originalFn is a local variable whose scope has exited,\
    \ too, would have exited the stage.) This is an example of closure, another JavaScript\
    \ function to know and if you want to follow in the footsteps of Fredrik Appel\
    \ and Dave Clayton.\n\n> NOTE Plodding, code with a limited vocabulary of ideas,\
    \ tends to be longer. Longer code presents a larger attack surface for errors.\
    \ To write reliable, elegant code, to know every corner of the language.\n\nThe\
    \ Aop object is beginning to take shape.\n\nYou might suggest that Aop.around\
    \ can wrap a target in multiple layers, but in true TDD fashion you want to be\
    \ sure, so you add the test in Listing 2-31. Rather than creating two aspects\
    \ that are nearly identical, you create a factory to produce them. It's a relatively\
    \ unimportant DRY method, but these small points of beauty are what make a programmer's\
    \ day worthwhile, right?\n\nLISTING 2-31: Verifying that aspects can be in multiple\
    \ layers (code filename: AOP/Aop_02_tests.js)\n\n```\nit('can') can change, with\
    \ the last set up being executed around the others,\nfunction() {\n  var adviceFactory\
    \ = function(adviceID) {\n    return (function(targetInfo) {\n      executionPoints.push('wrappingAdvice\
    \ - begin ' + adviceID);\n      targetInfo.fn(this);\n      executionPoints.push('wrappingAdvice\
    \ - end ' + adviceID);\n    });\n  });\nAop.around('targetFn', adviceFactory('inner'),\
    \ targetObj);\nn\n```\n\ncontinues"
