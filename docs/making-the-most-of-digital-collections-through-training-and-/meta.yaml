  md: "```\nfunction getRestaurantsNearConference(cuisine) {\n  return getRestaurantsCurried(\n\
    \    ('415 Summer St, Boston, MA 02210') (2.0) (cuisine);\n  );\n}\n```\n\n# #\
    \ SUMMARY\n\nIf you have code that calls a function with some arguments never\
    \ varying, consider creating a new function that encapsulates the constancy. This\
    \ is the technique of partial function application.\n\nThe unit tests of the new\
    \ function become the correct and DRY place to verify that you are using the constants\
    \ you expect. Happily, the unit tests don't have to (and should not) make any\
    \ other assumptions about the original function, not even its return type.\n\n\
    Partial function application is often confused with currying. True currying does\
    \ not apply any arguments, partially or otherwise. Rather, it breaks a multi-argument\
    \ function down into a series of steps that each take a single argument. If you\
    \ like the way partial function application helps you to avoid using arguments,\
    \ you'll love the way memoization avoids executing the entire body of a function.\
    \ That is the subject of the next chapter."
