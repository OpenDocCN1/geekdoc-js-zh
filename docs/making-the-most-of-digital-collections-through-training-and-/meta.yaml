- img_proc: false
  md: "# LISTING 2-9 (continued)\nthis.messenger.failure('Sorry; your seat could not\
    \ be reserved.');\n};\n\nThis code appears to be beautifully modular, with ConferenceWebSvc,\
    \ Messenger, and Attendee each having a single responsibility. Attendee.reserve\
    \ is so simple that it hardly needs to be unit-tested, which is a good thing it\
    \ can't be unit-tested! Behind ConferenceWebSvc sit HTTP calls. You can unit-test\
    \ things that are supposed to be fast and stand on their own. Also, Messenger\
    \ will require the OK button on each message to be pressed. That is not supposed\
    \ to be the burden of a unit test on your code-module. Unit-testing is one of\
    \ the keys to creating reliable JavaScript, and you don't want to drift into system\
    \ testing until the units are ready.\n\nThe problem is not with the Attendee object,\
    \ but with the code it depends on. The solution is dependency injection. Instead\
    \ of ConferenceWebSvc and Messenger, you can inject them into Attendee. In production,\
    \ you will inject the real objects, but for unit-testing you can inject substitutes,\
    \ which could be fakes (objects with the appropriate methods but fake processing)\
    \ or Jasmine spies.\n\n```\n// Production\nvar attendee = new Attendee(new ConferenceWebSvc(),\
    \ new Messenger(), id);\n\n// Testing\nvar attendee = new Attendee(fakeSvc, fakeMessenger,\
    \ id);\n```\n\nThis style of dependency injection (DI), which does not use a DI\
    \ framework, is called \"poor man's dependency injection,\" which is ironic because\
    \ the best professional DI frameworks are actually free. Listing 2-10 shows the\
    \ Attendee object with poor man's dependency injection.\n\n# LISTING 2-10: Attendee\
    \ object with poor man's dependency injection (code filename: Attendee_02.js)\n\
    \n```\nAttendee = function(service, messenger, attendeeId) {\n  // Ensure created\
    \ with 'new'\n  if (!(this instanceof Attendee)) {\n    return new Attendee(attendeeId);\n\
    \  }\n\n  this.attendeeId = attendeeId;\n  this.service = service;\n  this.messenger\
    \ = messenger;\n};\n```\n\n# Making Your Code More Reliable with Dependency Injection\n\
    \nYou have just seen how dependency injection allows unit-testing that would otherwise\
    \ be impossible. Code that has been tested, and can continue to be tested in an\
    \ automated test suite, will obviously be more reliable."
