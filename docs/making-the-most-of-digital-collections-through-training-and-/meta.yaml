  md: "These types of tools are generally referred to as linters to reflect their\
    \ relation to the C programming language static analysis tool, lint, which was\
    \ developed in the late 1970s.\n\nThroughout this section, we will refer to static\
    \ analysis tools as linters, and the process of performing static analysis as\
    \ linting.\n\n# Making Your Code More Reliable with Linting Tools\n\nLinting serves\
    \ an important purpose when programming in JavaScript. If you're a developer coming\
    \ from a compiled language like C# or Java, you're accustomed to the compiler\
    \ informing you of grievous syntax errors such as omitting a statement-terminating\
    \ semicolon or forgetting a closing brace. As an interpreted language, JavaScript\
    \ doesn't have a compiler that complains when you've made a mistake. You won't\
    \ be aware of any syntax errors until the code is executed.\n\nSince you have\
    \ used TDD, you will have a test exercise every bit of production code before\
    \ you even write it, right? When practicing TDD, it may be enticing to skip the\
    \ configuration and use a linter because the unit tests guarantee your code is\
    \ functioning as it should.\n\nLinters do not verify that your code is correct.\
    \ Your linter can't tell you the function you've written return the correct value.\
    \ Within your function that has a questionable format and may cause it to return\
    \ an incorrect value.\n\nSuppose you've been tasked with building an airline reservation\
    \ system. The customer has requested that you implement functionality that will\
