  md: '# Using a Testing Framework


    ```

    createReservation: 2.0


    createReservation(passenger, flight)

    assign the provided passenger to the passengerinformationproperty

    ```


    FIGURE 2-3


    You can then follow the same process for assignment of the flightInformation attribute,
    yielding a createReservation function that is verified correct again via unit
    tests.


    The error of incorrectly naming an attribute in the returned object once made
    its way into the implementation of the createReservation function. This time,
    however, you wrote your test first and based the test on the specification. This
    allowed you to immediately identify and address the error rather than waiting
    hours (days, or weeks) for another running integration tests


    For a trivial function such as createReservation, this piecewise creation of tests
    and addition of functionality feels like a bit of overkill. It is easy to imagine
    other cases, where the iterative process of TDD could end up saving a significant
    amount of debugging time.


    Suppose that you have to write a function that performs a multitude of computations
    on an array of data. You attempt to implement a large portion of the function
    at once, and that portion contains an off-by-one error that you omit the last
    piece of data from computations.


    When you verify the output of your function, the computed value will be incorrect,
    but you won''t know why it''s incorrect. It could be a mathematical error in one
    of the computations, or perhaps you''re not handling a case of numeric overflow.
    Had you written a simple test early on to verify that each and every element of
    the array is involved in the computation, you would have immediately caught the
    off-by-one error and likely would have had a working solution much sooner.


    # Designing for Testability


    Writing tests first makes the testability of your code a primary concern rather
    than an afterthought. In our experience working with developers at all skill levels,
    there is a direct correlation between how easy code is to test and how well it
    is. Additionally, we''ve found that code that is easy to maintain and extend.
    As we proposed in the first chapter, code that follows the principles of SOLID
    development lends itself well to test. If you make testability a goal of yours
    you will intend to write SOLID code.


    For example, suppose every reservation created with the createReservation function
    should be submitted to a web service to be stored in a database.


    If you''re not practicing TDD, you may simply extend createReservation by adding
    a call to jQuery.ajax(...) which sends the reservation to a web service endpoint
    as asynchronous JavaScript and XML (AJAX). The addition of this simple function
    call, though, has increased the number of responsibilities the humble createReservation
    function has, and has increased the effort required to properly test it.'
