    those patterns will be employed.


    However, song lyrics, when translated into a different language, often change
    their literal meaning in order to express the same emotion. If the beauty, rhythm,
    and rhyme are to be preserved, one must sing different words. The distinction
    in Design Patterns between concrete and abstract classes has no literal translation
    to JavaScript, where everything is concrete and no classes exist. In the coming
    chapters, you will see how some of the classic patterns can find their expression
    in JavaScript.


    You will also learn new patterns that are idiomatic to JavaScript and might not
    have such a prominent place in a classical language.


    The patterns themselves are only half the story, and the second half is the testing
    story. (Remember: Test first!) Embarrassing experiences have taught all of us
    that we can mess up the simplest pattern. The only way to verify that a pattern
    is properly coded is to test it.


    We have found that developers generally have a harder time knowing how to rigorously
    test code based on some of these patterns than learning how to code with the patterns
    themselves. Most of the rest of this book is therefore devoted to a test-first
    approach to learning various patterns, and an explication of how to proceed with
    a test-first approach to using them.


    As you employ proven, elegant design patterns, and use best practices for testing
    your work, you will produce reliable code that gives you great satisfaction—both
    functionally and creatively. What more could a software developer want from his
    day job?


    # SUMMARY


    In software development, there are small-scale patterns in the syntax and idioms
    of the language, and large-scale patterns for constructing entire systems. Like
    a top-notch chess player who can see familiar patterns in every new position,
    a good software developer has a broad vocabulary of patterns at his or her disposal.
    The developer can use these patterns as guides for thought and as well-tested
    building blocks to construct reliable systems.


    The next chapter covers one of the most frequent patterns in JavaScript: the callback.'
