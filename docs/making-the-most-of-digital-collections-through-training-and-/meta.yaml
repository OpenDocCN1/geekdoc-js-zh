    });\n```\n\nThe monkey-patching takes this place in this line towards the end:\n\
    \n```\nkoko.useSignLanguage = trainer.useSignLanguage;\n```\n\nThe capability\
    \ to use sign language is patched from the trainer to Koko. This only works because\
