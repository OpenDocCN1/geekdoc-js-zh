  md: "# LISTING 2-21 (continued)\n\n```\n[],\nfunction() {\n  return new Messenger();\n\
    }\n\nMyApp.diContainer.register(\n  'AttendeeFactory',\n  {'Service', 'Messenger'},\
    \ // Attendee depends on service and messenger.\\n  function(service, messenger)\
    \ {\n    return function(attendeeId) {\n      return new Attendee(service, messenger,\
    \ attendeeId);\n    }\n  }\n);\n```\n\nThere is an advanced but important point\
    \ in the way Attendee is placed in DiContainer. The registration is not for a\
    \ function to produce an Attendee, but for a function to produce a factory that\
    \ produces an Attendee. This is because Attendee requires a addition to its dependencies,\
    \ namely the attendeeId. It would be possible to code the DI container so that\
    \ you could do this:\nvar attendee = MyApp.diContainer.get('Attendee', attendeeId);\n\
    but then Attendee could not be supplied as recursive dependencies of other objects.\
    \ (Those other objects could not, in general, be expected to pass an attendee\
    \ all the way from the top of the chain, which is where it would have to originate.)\n\
    \nWith that factory, you can, deep in the application, get an Attendee from the\
    \ DI container, as you see in Listing 2-22.\n\n# LISTING 2-22: Instantiating an\
    \ Attendee from the factory\n\n```\nvar attendeeId = 123;\nvar sessionId = 1;\n\
    \n// Instantiate an Attendee from the DI container, passing the attendee ID.\n\
    var attendee = MyApp.diContainer.get('AttendeeFactory') (attendeeId);\n\nattendee.reserve(sessionId);\n\
    ```\n\n# Current Dependency-Injection Frameworks\n\nThere are two dependency-injection\
    \ frameworks that enjoy widespread adoption and are kept current: AngularJS and\
    \ RequireJS. Each is free and open source, and each has its unique strengths.\n\
    \n# RequireJS\n\nRequireJS uses a syntax much like the DiContainer in this chapter.\
    \ (Yes, we cheated.) Where DiContainer has a register function, RequireJS defines,\
    \ which it supplies as a global. DiContainer get (moduleName) becomes RequireJS's\
