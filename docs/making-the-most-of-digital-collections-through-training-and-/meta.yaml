  md: "# Interface Segregation\nSorry; you can't implement an interface on a primitive,\
    \ even though you might like to sometimes.\n\n# Dependency Inversion\nPrimitives\
    \ have no dependencies.\n\n# Don't Repeat Yourself\nExtreme temptation here!\n\
    \n# USING OBJECT LITERALS\n\nNext up the ladder from primitives are object literals—objects\
    \ that are declared thus:\n  { name: 'Koko', genus: 'gorilla', genus: 'sign language'\
    \ }\n\nIt's helpful to distinguish between two ways of creating object literals.\
    \ There are bare object literals:\nvar koko = { name: 'Koko', genus: 'gorilla',\
    \ genus: 'sign language' };\nand there are literals that return values from functions:\n\
    \n```\nvar amazeTheWorld = function() {\n  //\n  return { name: 'Koko', genus:\
    \ 'gorilla', genus: 'sign language' };\n}\n```\n\n```\nvar koko = amazeTheWorld();\n\
    ```\n\nThe distinction is important because one is DRY than the other. If you\
    \ create multiple object literals that are supposed to have the same properties,\
    \ you must repeat the property names. It's easy to get one wrong. Test-driven\
    \ development can ensure that we return an object with the expected properties\
    \ from a function, but there is no way to directly distinguish a bare object literal\
    \ that is buried in code.\n\nObject literals also have properties that are functions.\
    \ Once again, if the literal is not created in a controlled manner, such as being\
    \ returned from a function, there is no way to test these functions.\nUnless an\
    \ object literal is assigned to a variable (such as the object you met in Chapter\
    \ 2), it is problematic to use with aspect-oriented programming. An aspect needs\
    \ a pointcut to which it applies (e.g, the name of a variable), but an object\
    \ literal has no name. However, if an object literal is produced by a factory\
    \ function, then function could be wrapped in an \"after\" aspect that would tinker\
    \ with the returned literal.\n\nAs for dependency injection, the opportunity simply\
    \ does not arise in the case of bare object literals.\nA function that creates\
    \ and returns a literal, however, may be perfectly applicable to the dependency\
    \ injection procedure that, as suggested in Chapter 2, should be in the startup\
    \ code of the application.\n\nA weakness of bare object literals is that there\
    \ is no validation in their construction. Formal constructors can do all sort\
    \ validation on their arguments and guarantee a valid result. There are no checks\
    \ unless you're slipping together a bare object literal.\n\nFor these reasons,\
    \ we suggest that object literals not comprise important parts of the application,\
    \ unless they are singletons or are created by well-tested code."
