    # SUMMARY


    In this chapter, you saw how and how to implement the Callback Pattern in a test-first
    fashion. You saw how to write tests for, and then implement, multiple callback
    functions, and learned how *this* isn''t always what one might think. Also, you
    saw how anonymous callback functions are difficult to test, and that *nested*
    anonymous callbacks create a problematic—but fixable—callback arrow.


    The next chapter introduces *Promises*, JavaScript objects that provide an alternative
    to callbacks when working with the results of asynchronous function calls, such
