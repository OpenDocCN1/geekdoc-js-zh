  md: "# Using an Aspect Toolkit | 59\n\n```\n};\n))();\n// To get the info for your\
    \ ad:\n\nTravelService.getSuggestedTicket(attendee.homeAirport);\n```\n\nNow you\
    \ want to add caching. You could do so as in in Listing 2-24 (without AOP).\n\n\
    # LISTING 2-24: Caching without AOP\n\n```\nTravelService = (function(rawWebService)\
    \ {\n  var conferenceAirport = 'BOS';\n  var maxArrival = new Date(/* some date\
    \ **/);\n  var minDeparture = new Date(/* some date **/);\n\n  // Simple caching.\
    \ The index is the airport and the object is the ticket.\n  var cache = [];\n\n\
    \  return\n    getSuggestedTicket: function(homeAirport) {\n      var ticket;\n\
    \      if (cache[homeAirport]) {\n        return cache[homeAirport];\n      }\n\
    \n      ticket = rawWebService.getCheapestRoundTrip(\n        homeAirport, conferenceAirport,\n\
    \        maxArrival, minDeparture);\n      cache[homeAirport] = ticket;\n\n  \
    \    return ticket;\n    }\n  });\n```\n\nThat works, but you have more than doubled\
    \ the lines of code in getSuggestedTicket. What's more, the new code has nothing\
    \ to do with the function's core responsibility.\n\nWouldn't it be nice if you\
    \ add the feature without modifying getSuggestedTicket at all? And change the\
    \ caching strategy later—expiring the cached result after 10 minutes, for example?\
    \ Wouldn't it be even better if you chain additional features (storing the user's\
    \ preferences in a cookie, for example) just unobtrusively?\n\nThat is aspect-oriented\
    \ programming does for you. With the AOP framework you'll see shortly, could you\
    \ have kept the original code and just added this in the application's startup\
    \ logic:\n\n```\nAop.around('getSuggestedTicket', cacheAspectFactory());\n```\n\
    \nIn this line of code, cacheAspectFactory() returns a completely reusable caching\
    \ function that can intercept any call, and if any have been seen before, return\
    \ the same result."
