  md: '144 | CHAPTER 6 ENSURING CORRECT USE OF THE PROMISE PATTERN


    +   - The argument to its constructor is a function that wraps the asynchronous
    work. The function has two parameters: `resolve` and `reject`. Call one of them
    when you are ready to resolve or reject the Promise.


    +   - The key method of a Promise object is `then`. It takes two parameters, each
    one callback function.


    +   - The first callback is followed when the Promise "resolves." It receives
    the resolved value as a parameter.


    +   - The second callback executes when the Promise is "rejected." Its parameter
    is the reason for rejection. It is a good idea to make that an Error` object,
    but a simple string works, too.


    You also dealt with some of the pitfalls of testing Promise-based code, including:


    +   - Because Promises are asynchronous, if you are not careful they will still
    be unresolved when the expectations of your test execute. This can cause your
    tests to pass when they shouldn''t. Jasmine provides special support for testing
    asynchronous code in the form of the `done()` mechanism.


    +   - When unit-test code uses `XMLHttpRequest`, you don''t want to call the server,
    but you do to simulate the asynchronous nature of HTTP. Jasmine provides an Ajax
    mocking library for this purpose.


    +   - Promises are designed to be chained. Be sure your tests verify that execution
    flows into the expected `then` callback in all cases.


    +   - Promise wrappers such as AngularJS''s `$q` or Kris Koval''s `$q` are available
    to give you more control over the resolution and rejection of Promises in unit
    tests.'
