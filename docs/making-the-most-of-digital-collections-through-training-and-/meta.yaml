  md: 'unit test behaves as if it should be given a specific set of conditions. More
    often than not, the unit

    under test will be a function, but that''s not the case.


    The code in the body of a unit test generally follows the pattern arrange, act,
    assert.


    First, the test arranges: It establishes the conditions under which it will exercise
    the unit, perhaps

    configuring dependencies or setting up inputs to a function.


    Next, the test acts: It exercises the unit test. If the unit is a function, for
    instance, the test will

    execute the function with the inputs configured for the arrange stage.


    Finally, the test verifies that the unit behaves as expected when exercised under
    the estab-

    lished conditions. If the unit test is a function, the assert phase may verify
    that the function

    returned the expected value.


    Investing in the creation of a full suite of unit tests is insurance against future
    breaking changes

    your program, and it is the best investment that you can make to ensure that your
    application remains

    reliable. A failing unit test is a red flag that has altered the functionality
    of your program

    and that the change caused the failure warrants close inspection.


    The Section Using a Testing Framework in Chapter 2 covers, in detail, how to use
    the Jasmine unit

    t framework to create a JavaScript unit test suite.


    # # Practicing Test-Driven Development


    Test-driven development (TDD) helps ensure the program you write is perfect in
    the first place.

    TDD is the practice of writing a unit test before you write the code that allows
    the test

    to pass. Along with creating a full suite of unit tests as you develop your application,
    TDD helps you

    design the interfaces to the units as you create them.


    The following sections describe the practice of TDD, and what to keep in mind
    while writing

    code in order to make the code testable.


    A developer practicing test-driven development performs the following steps for
    each and every

    s he moves to an application. The change may be a completely new feature,

    tweaking an existing one, or fixing a bug.


    +   1. Write a unit test that will succeed if the change is made correctly, but
    fails until then.

    2. Write the minimum amount of application code that allows the test to pass.

    3. Refactor the application code to remove any duplication.


    The preceding steps are commonly summarized as red, green, refactor, where red
    and green signify

    t failing and passing state of the new unit test.


    The most important aspect of TDD is that the test is written before the code that
    satisfies it. It is

    also one of the most difficult aspects to adjust to when starting out with TDD.
    Writing the test first

    feels just a bit uncomfortable, especially if the change you are testing minor.


    Before the practice of TDD is etched into your programmer-brain, it''s all tempting
    to just

    slightly tweak the application code and move on to the next task on your never-ending
    list of tasks

    do do.'
