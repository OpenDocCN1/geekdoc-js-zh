  md: 'How can you avoid these problems? If there is one concept that we hope to preach
    *and* practice in this book, it is test-driven development. In the absence of
    a compiler, tests are your best defense against error.


    JavaScript is also more amenable to playing by the rules of software engineering.
    In fact, because of its extremely... .um... .creative nature, JavaScript may need
    them more than most languages.


    We have met many developers who are open to this message and would like to learn
    more about how to proceed. We hope you are one of them.


    # THIS BOOK’S INTENDED AUDIENCE


    Because this book isn''t a JavaScript primer, we assume you have some JavaScript
    experience. The following sections outline the attributes of the book''s ideal
    audience.


    # Developers Who Come to JavaScript from Other Languages


    Neither of us started her career as a JavaScript developer, and it''s likely you
    didn''t either: JavaScript is a relatively new kid on the block when it comes
    to large-scale application development.


    JavaScript is also quite different from any of the languages that we had experience
    in. We come from the comfortable world of the compiled, statically typed language
    C#.


    Our JavaScript got a lot better when we embraced its dynamic nature while maintaining
    a C# programmer''s sense of architecture and discipline.


    If you''re like us and have a background thinking and programming in a language
    other than JavaScript, such as C# or Java, this book is for you. Your knowledge
    of data structures and architecture provide a solid base on which to master JavaScript
    for large-scale development.


    Many of the sections illustrate how language features in C# and Java, as their
    inheritance and interfaces, correspond to the capabilities in JavaScript. We also
    highlight the major differences between JavaScript and other languages, such as
    scoping rules and type-coercing equality comparisons. Knowledge of its capabilities
    and features will improve your ability to think in JavaScript.


    Another focus of this book is how software engineering concepts and practices
    more commonly associated with C# and Java development, such as design patterns,
    unit-testing, and test-driven development, may be applied to JavaScript. Sound
    engineering will temper JavaScript''s wild nature, creating reliable and maintainable
    code.


    # Developers with Small-Scale JavaScript Experience


    In our endeavor to add developers with JavaScript experience to our team, we''ve
    encountered many candidates who feel small-scale JavaScript experience, such as
    input field validation or jQuery element transitions, warrants “JavaScript” prominently
    on a résumé.'
