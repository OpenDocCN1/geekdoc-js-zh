  md: "\"ModuleUrl??\" you say.—what RequireJS is special is that you use the locations\
    \ of your scripts as module names. For example, you could put your AttendeeFactory\
    \ in the RequireJS container like this:\n\n```\ndefine(['/Service', './Messenger'],\
    \ function (service, messenger) {\n  return function (attendeeId) {\n    return\
    \ new Attendee(service, messenger, attendeeId);\n  }\n});\n```\n\nInstead of depending\
    \ on the module names ('/Service', 'Messenger'), AttendeeFactory depends on the\
    \ relative URLs ('./Service', './Messenger').\n\nSo how about the name of the\
    \ thing you're defining ('AttendeeFactory')? There's no need for it because the\
    \ URL of the file in which this code appears (possibly ../Factory.js) doubles\
    \ as the module name. This feature of RequireJS has the added benefit of automatically\
    \ avoiding collisions. It also implies that “one module per file” is the normal\
    \ way of doing things in RequireJS.\n\nIt is possible to explicitly name your\
    \ modules (using the same syntax as DiContainer.register), but to do so is not\
    \ in the full spirit of this library.\n\nRequireJS di modules to URLs to optimize\
    \ how it loads your scripts. In fact, RequireJS started out as one of several\
    \ proposals from the CommonJS committee to solve the problem of how to get modules\
    \ from the server to the browser (Transport C at http://commonjs.org/wiki/Modules/Transport).\
    \ Their proposal was never formally accepted by CommonJS, but it seems to be the\
    \ only one standing and used widely.\n\nYou can check out its many additional\
    \ features at http://requirejs.org.\n\n# AngularJS\n\nCompared to RequireJS, Google's\
    \ AngularJS is the new kid on the block, although DI is at the very center of\
    \ AngularJS, AngularJS is much more than a DI container. It is a complete, “opinionated”\
    \ framework for building single-page applications (SPAs).\n\nDependency injection\
    \ appears in AngularJS in a variety of ways. There are many functions along the\
    \ lines of DIContainer.register, each suitable for different types of objects.\
    \ For example, AngularJS objects, called services, are by nature singletons, and\
    \ the AngularJS framework ensures this with a service registration function that\
    \ causes the same identical object to be injected each time one is requested.\
    \ If that's not the behavior you want, there's a factory function that does what\
    \ the names imply. You can even register constants for dependency injection with\
    \ the constant function.\n\nAlthough AngularJS is an opinionated framework, many\
    \ of its important features are under your control. In fact, if you don't like\
    \ the dependency injector, you can inject one of your own.\n\nNot that you'll\
    \ have any time to learn how to do that! Compared to RequireJS, Knockout, jQuery,\
    \ or other JavaScript libraries, AngularJS has a very long learning curve. However,\
    \ once you've ascended most of it, everything will make sense and you will wonder\
    \ what took you so long. AngularJS is very well designed, and if you're looking\
    \ for a total solution for your SPA, you couldn't do much better."
