  md: "The single test in Listing 9-6 verifies the behavior of getInstance.\n\n# LISTING\
    \ 9-6: Unit test for RestaurantsWithinRadiusCache.getInstance (code filename:\
    \ SingletonRestaurantsWithinRadiusCache_01_tests.js)\n\n```\ndescribe('Conference.caches.RestaurantsWithinRadiusCache',\
    \ function() {\n  'use strict';\n\n  describe('getInstance', function() {\n  \
    \  it('always returns the same instance', function() {\n      // ensure that .getInstance\
    \ returns the same object\n      // // (toBe use reference equality)\n      expect(Conference.caches.RestaurantsWithinRadiusCache.getInstance())\n\
    \        .toBe(Conference.caches.RestaurantsWithinRadiusCache.getInstance());\n\
    \    });\n  });\n});\n```\n\nAnd the implementation of RestaurantsWithinRadiusCache\
    \ follows in Listing 9-7.\n\n# LISTING 9-7: Implementation of RestaurantsWithinRadiusCache\
    \ (code filename: SingletonRestaurantsWithinRadiusCache_01.js)\n\n```\nvar Conference\
    \ = Conference || {};\nConference.caches = Conference.caches || {};\n\n// Create\
    \ a simpleCache (singleton) to use as a cache\n// for the restaurantApi.getRestaurantsWithinRadius\
    \ function\nConference.caches.RestaurantsWithinRadiusCache = (function() {\n \
    \ 'use strict';\n\n  var instance = null;\n  return {\n    getInstance: function()\
    \ {\n      if (!instance) {\n        instance = Conference.simpleCache();\n  \
    \    }\n      return instance;\n    }\n  };\n});\n```\n\nIn Listing 9-7, RestaurantsWithinRadiusCache\
    \ is assigned the value returned from the immediately executed function, establishing\
    \ it as a singleton object exposing the getInstance function. The first time getInstance\
    \ is invoked, the hidden instance variable is populated with a simple-Cache. Each\
    \ additional call to getInstance returns that same instance.\n\n> NOTE An additional\
    \ benefit of this implementation of the Singleton Pattern is that the instance\
    \ object is instantiated lazily; it isn't created until the first time it's needed.\
    \ This can be important if the creation of the instance object is costly in terms\
    \ of time and/or memory."
