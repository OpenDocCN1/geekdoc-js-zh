  md: "The goodness is at https://angularjs.org.\n\n# USING AN ASPECT TOOLKIT\n\n\
    Aspect-oriented programming (AOP) is a way of gathering code that will be useful\
    \ to more than one object (although it is not within the Single Responsibility\
    \ of any of them) and distributing code to the objects in a non-obstructive way.\n\
    \nIn the lingo of AOP, the pieces of code thus distributed are called advices,\
    \ and the issues the advices address are called aspects or cross-cutting concerns.\
    \ For an example, let's return to the JavaScript conference from the last section.\n\
    \n# Case Study: Caching with and without AOP\n\nYou'll recall that you had volunteered\
    \ to help write the conference's website. To help defer costs, the organizers\
    \ of the conference have partnered with a travel-services company to sell airplane\
    \ tickets. Your job is to call their web service to obtain a bargain affair based\
    \ on the logged-in attendee's preferred home airport. The ticket will be featured\
    \ in an ad on the website.\n\nYou want the ad to appear without delay, but it\
    \ involves a relatively time-consuming call to the web service. You decide to\
    \ cache the featured ticket as the user does not change his preferred airport.\n\
    \nIn fact, there are a lot of things you want to cache on this website. Caching\
    \ has become a cross cutting concern—a prime candidate for aspect-oriented programming.\
    \ Let's see how it plays out.\n\n# Implementing Caching without AOP\n\nFirst,\
    \ List 2-23 shows the function without caching. To increase the happiness of readers\
    \ who prefer not to use the \"new\" keyword, we have used a different module-creation\
    \ pattern than in the previous section.\n\n> LISTING 2-23: TravelService module\
    \ without caching\n\n```\n// Wraps the travel services company's raw web service,\n\
    // supplying parameters relevant to the conference.\nTravelService = (function(rawWebService)\
    \ {\n  var conferenceAirport = 'BOS';\n  var maxArrival = new Date(/* some date\
    \ **/);\n  var minDeparture = new Date(/* some date **/);\n\n  return {\n    getSuggestedTicket:\
    \ function(homeAirport) {\n      // Gets the cheapest ticket from the home airport\
    \ that\n      // will allow the user to attend the entire conference.\n      return\
    \ rawWebService.getCheapestRoundTrip(\n        homeAirport, conferenceAirport,\n\
    \        maxArrival, minDeparture);\n    }\n  };\n});\n```"
