  md: 'ESLint is available as an npm module for node.js. The ESLint homepage can be
    found at http://www.eslint.org.


    # Strict Mode


    One code-checking tool merits attention. Actually, it''s not an external tool,
    but a JavaScript setting that was introduced with ECMAScript 5. If you include
    the following in a scope (either the global scope or a function), the JavaScript
    interpreter will process certain features differently.


    ```

    ''use strict'';

    ```


    With this directive in place, JavaScript will throw an error if you commit some
    common mistakes. These include using a variable without declaring it first, attempting
    to modify a read-only property, naming a variable with the reserved word arguments,
    and more.


    When running on versions of JavaScript that do not support strict mode, the ''use
    strict'' string will have no effect.


    You will see an example of where strict mode can make a crucial difference in
    the "Default Binding and Strict Mode" section of Chapter 18. In the meantime,
    the listings in this book will use it just to get you in the habit.


    # SUMMARY


    In this chapter, we introduced some of our favorite techniques and tools for JavaScript
    development.


    A unit-testing framework is absolutely essential for reliable software development.
    In this text, we will use Jasmine, which we have found easy to learn and very
    robust, but popular alternatives include QUnit and D.O.H.


    JavaScript applications become more complex, it becomes more important to keep
    your components clean and separate. Dependency injection is an important technique
    for doing that. In this chapter, you worked through the test-driven development
    of a dependency-injection framework that will reappear in future chapters and
    may be useful in your projects.


    As another case study in TDD, you developed a toolkit for aspect-oriented programming.
    AOP allows you to enhance components with common functionality such as caching,
    without changing those components at all. It''s another way to simultaneously
    keep your code DRY, fulfill the Single Responsibility Principle, and adhere to
    the Open/Closed Principle.


    Code-checking tools, known as linters, promote reliability at the micro level
    by alerting you to syntax mistakes or violations of standards. JSHint, ESLint,
    and ESLint are some of the most popular. Strict mode is another good way to avoid
    mistakes at the syntax level.


    In the next chapter, you will explore the rich variety of ways in which JavaScript
    can construct objects. It sounds like a simple topic, but you will see that it
    is anything but.'
