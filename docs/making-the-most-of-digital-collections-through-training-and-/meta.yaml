  md: "# Understanding Promises Through Unit Tests\n\nThe error message indicates\
    \ that at the time of the expectation, checkNumber was not set. What could have\
    \ gone wrong? It will become clear once you know two things:\n\n+   - Promises\
    \ are asynchronous.\n- JavaScript is single-threaded, mimicking multi-threading\
    \ with an event loop.\n\nThese facts imply that control does not flow into the\
    \ success callback of the Promise's then method until the next turn of JavaScript's\
    \ event loop. (See JavaScript is Single-Threaded in Chapter 1.) The unit test\
    \ does not give up until it finishes—that is, until the expectation has already\
    \ been stated. By the time the Promise is resolved, it is too late!\n\nYou can\
    \ prove this by downloading the code for this chapter and setting breakpoints.\
    \ Running checkInService_01.html with breakpoints in checkInService_01.js and\
    \ checkInService_01_tests.js, you will see the code execute in this order:\n\n\
    +   1. The first line of the unit test:\n   checkInService.checkIn(attendee);\n\
    2. The return of the Promise from the spy:\n   Promise.resolve(checkNumber);\n\
    3. The expectation on the second line of the unit test:\n   expect(attendee.getCheckInNumber()).toBe(checkNumber);\n\
    4. The success callback in attendee.js (too late!):\n\n```\nsetCheckNumber: function(number)\
    \ {\n  checkNumber = number;\n}\n```\n\nSo how can you ensure the reliability\
    \ of Promise-based code through unit tests? The key is not to check the result\
    \ of the code until the Promise has been \"followed.\" This involves two things.\n\
    First, you would change checkInService.checkIn to return the value from the call\
    \ to then. In-happens that this is a Promise! Recall that it has two callbacks.\
    \ You probably want to return a resolved Promise if you end up in the resolved/success\
    \ callback, and a rejected Promise if you get the rejected/failure callback. You\
    \ can do this by making the checkIn function construct and return a Promise (directly\
    \ using using so), but after a little research, you learn that there is a short-cut,\
    \ shown in Listing 6-3: You can make each callback return a Promise, and that\
    \ Promise will become the resolved value of the Promise returned by then. In general,\
    \ if a callback returns a Promise-like object (basically one with a then function),\
    \ that flows out to be the resolved value of then. Otherwise, then wrap the return\
    \ value of the callback in a resolved Promise, which returns.\n\n> LISTING 6-3:\
    \ Returning the result of then (code filename: Promises/checkInService.js)\n\n\
    ```\nvar Conference = {};\n\nConference.checkInService = function(checkInRecorder)\
    \ {\n\ncontinues\n```"
