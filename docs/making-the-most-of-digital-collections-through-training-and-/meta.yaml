    \  done();\n});\n```\n\nThe beforeEach sets up a spy on checkInRecorder.recordCheckIn\
    \ to return a Promise. In this case, it is a Promise that is fulfilled. Confusingly\
    \ at first, the method that creates a fulfilled Promise is not Promise.fulfill,\
    \ but Promise.resolve. You will see why later in this chapter.\n\nBecause the\
    \ Promise is fulfilled (resolved), it causes the first callback of the method\
