  md: "Understanding Promises Through Unit Tests | 135\n\nofficial release. As silly\
    \ looking as the expectation in the onPromiseRejected branch of the test is, it\
    \ will display a perfectly informative error message in Jasmine's output.\n\n\
    You probably noticed something else: the calls to done() in both the resolve and\
    \ reject branches. This is how Jasmine supports the testing of asynchronous code.\
    \ You can see that the argument to the function on the first line of Listing 6-4.\
    \ It is just the name you give to an argument and it could have been anything,\
    \ but whatever you name, you must call it when all of your asynchronous processing\
    \ is complete. If you do not, Jasmine will issue a timeout failure.\n\nIf you\
    \ omit the done() mechanism (the parameter and both calls), Jasmine will let your\
    \ test finish before the asynchronous work is complete. Your test will seem to\
    \ pass, but only because neither the resolve nor reject branches will execute\
    \ in time to affect the outcome! This means that if you were to remove all traces\
    \ of done from Listing 6-4, the first expectation could be anything, at all, and\
    \ the test would pass! This highlights the importance of writing unit tests that\
    \ fail before writing the code to make them succeed. There is also no harm in\
    \ using your debugger to verify that your tests are executing as you expect.\n\
    \n> NOTE Always use Jasmine's done() mechanism when testing asynchronous code.\n\
    \nThis snippet, from checkInService_tests.js in this chapter's dollars, illustrates\
    \ the following of a failure branch.\n\n```\ndescribe('when checkInRecorder fails',\
    \ function() {\n  var recorderError = 'Check-in recording failed!';\n  beforeEach(function()\
    \ {\n    spyOn(checkInRecorder, 'recordCheck').andreturnValue(\n      Promise.reject(new\
    \ Error(recorderError)));\n    );\n    spyOn(attendee, 'undoCheck');\n  });\n\n\
    \  it('returns a Promise rejected with the expected reason', function(done) {\n\
    \    checkInService.checkIn().then(\n      function promiseResolved() {\n    \
    \    expect(This function to execute()).toBe(false);\n        done();\n      },\n\
    \      function promiseRejected(reason) {\n        expect(reason.message).toBe(recorderError);\n\
    \        done();\n      }\n    );\n  });\n});\n```\n\n# Constructing and Returning\
    \ a Promise\n\nThe code far spies on checkInRecorder.recordCheck, faking its return\
    \ with a Promise .resolve. An actual checkInRecorder would make an HTTP request\
    \ through an XMLHttpRequest object. HTTP requests are one of the most common asynchronous\
    \ operations you will use, and wrapping them in a Promise is very natural. (In\
    \ fact, some forward-thinking architects have done exactly that. See, for example,\
    \ the AngularJS $ object)"
