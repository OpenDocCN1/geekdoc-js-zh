    \ shows a test that finds out. (Not shown: targetObj.targetFn has been changed\
    \ to return a new variable, targetFnReturn.)\n\n# LISTING 2-34: Testing the return\
    \ value (code filename: AOP\\Aop_04_tests.js)\n\n```\nit(\\makes the target's\
    \ return value available to the advice\", function {\nAop.around('targetFn', argPassingAdvice,\
    \ targetObj);\n  var returnedValue = targetObj.targetFn();\n  expect(returnedValue).toBe(targetFnReturn);\n\
    }\n```\n\nAnother failure (Figure 2-9).\n\nJasmine\n\n+   * X\n\n![](bbox=[0.92,\
    \ 0.483, 0.853, 0.597])\n\nFIGURE 2-9\n\nBecause you have expected such a increment\
    \ of functionality, it is easy to add: just a return\nkeyword in Aop.around, as\
    \ in Listing 2-35.\n\n# LISTING 2-35: The aspect returns the value from its target\
    \ (code filename: AOP\\Aop_04.js)\n\n```\nAop = {\n  around: function(fnName,\
    \ advice, fnObj) {\n    var originalFn = fnObj[fnName];\n    fnObj[fnName] = function\
    \ () {\n      var targetContext = {}; // Wrong; return to it later.\n      return\
    \ advice.call(targetContext, {fn:originalFn, args:arguments});\n    };\n  }\n\
