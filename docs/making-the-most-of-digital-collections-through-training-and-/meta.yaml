  md: '# Summary | 203


    ![](bbox=[0.078, 0.085, 0.843, 0.219])


    FIGURE 11-9


    # # SUMMARY


    This chapter presented the Sandbox Pattern as a mechanism to create loosely coupled
    modules with strictly controlled dependencies. Using test-driven development,
    you developed an implementation of the Sandbox Pattern (based on the pattern presented
    by Stoyan Stefanov in his book JavaScript Patterns).


    The chapter covered the creation and testing of tools that add functionality to
    the sandbox. The chapter also described the benefit of using the tools as façades
    to restrict and control isolated modules access to resources and functionality.


    Additionally, the chapter demonstrated how to develop and unit-test a function
    for use within a sandbox.


    To make your implementation of the Sandbox Pattern reliable, you should write
    unit tests to ensure that:


    +   - A widget module function is provided to the sandbox''s constructor function.

    - Tools may be provided to the sandbox''s constructor function either as an array
    or individual arguments.

    - The tools specified for use in the sandbox are valid.

    - The tools requested by a widget running within the sandbox are provided by the
    sandbox.


    In Chapter 12, we discuss the Decorator Pattern, how it can be used to solve real-world
    problems, and how it can be implemented in a test-driven fashion.'
