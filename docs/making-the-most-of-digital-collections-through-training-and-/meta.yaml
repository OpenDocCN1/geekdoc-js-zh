  md: "The test that you wrote to ensure an Error is generated still passes, but the\
    \ function is now significantly broken. These additional tests do not seem so\
    \ irrelevant now, do they? Admitted, that change is not likely someone would make\
    \ intentionally, but accidents do happen.\n\nMake no mistake, this code is testable,\
    \ it's just not easy to test. There are so many permutations of conditions that\
    \ must be tested, both valid and invalid, it's unlikely that they will all be\
    \ covered. If all of the code in an application is written in this manner, we\
    \ can all guarantee that application won't have proper unit coverage.\n\nSuppose,\
    \ however, instead of working with the three separate concerns in the validateAndRegisterUser\
    \ function, each of those was extracted into a separate object with that concern\
    \ as its single responsibility. For the purpose of this example, assume that each\
    \ of the new objects has its own, complete test. The code for validateAndRegisterUser\
    \ may then look something like this:\n\n```\nvar Users = {};\nUsers.registration\
    \ = function (userValidator, userRegistrar, userDisplay) {\n  validateAndRegisterUser:\
    \ function validateAndDisplay(user) {\n    if (!userValidator.isValid(user)) {\n\
    \      throw new Error(\"The user is not valid*\");\n    }\n    userRegistrar.registerUser(user);\n\
    \    userDisplay.showRegistrationThankYou(user);\n  }\n};\n```\n\nThe new version\
    \ of the registration module leverages dependency injection to provide instances\
    \ of the objects that are responsible for user validation, registration, and display.\
    \ In turn, validateAndRegisterUser uses the injected objects in place of the code\
    \ that directly interacted with the different concerns.\n\nIn essence, validateAndRegisterUser\
    \ has transformed from a function that does work to a function that coordinates\
    \ work done by others. The transformation has made the function much easier to\
    \ test. In fact, the following six conditions are the only ones that must be tested\
    \ in order to completely test the function:\n\n+   * An Error is thrown if user\
    \ is invalid.\n* An invalid user is not registered.\n* An invalid user is not\
    \ displayed.\n* The userRegistrar.registerUser function is invoked with user if\
    \ user is valid.\n* The userDisplay.showRegistrationThankYou function is not executed\
    \ if userRegistrar.registerUser throws an Error.\n* The userDisplay.showRegistrationThankYou\
    \ function is executed with user as an argument if user has been successfully\
    \ registered.\n\nSix tests. That's it. We listed nine tests for the original version\
    \ of the function, and we didn't even finish all of the error conditions."
