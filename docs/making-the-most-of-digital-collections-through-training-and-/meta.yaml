    \ must be prepared to answer the question:\n\n```\nMyApp.Gorilla.getHandCount\
    \ = function() {\n  return this.hands.length;\n};\n```\n\nFinally, the human can\
    \ endow the gorilla:\n\n```\ntrainer.endSigning(koko);\n```\n\nUsing this technique,\
    \ you can patch a cluster of functionality from one interface to another. Classical\
