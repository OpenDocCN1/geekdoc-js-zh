  md: '# INTRODUCTION


    WHEN WE SHARED THE TITLE OF THIS BOOK. Reliable JavaScript, with fellow developers,
    we received feedback such as:


    “Now there’s the juxtaposition!”


    “It must be a very short book.”


    “Will I find it next to the latest John Grisham thriller in the fiction section
    of the bookstore?”


    No, this book is not a work of fiction.


    The feedback we received about the title of the book illustrates a broader perception
    about JavaScript that some developers with experience with classical, compiled
    languages have: JavaScript is used to create flashy portfolio websites or simple
    to to-do apps; it has no business in my mission-critical enterprise application.


    In the past that was true, but no more.


    # THE RISE OF JAVASCRIPT AS A FIRST-CLASS LANGUAGE


    JavaScript’s reputation as a wild child is well-deserved, and we hope to amuse
    you with some of its exploits in the next two sections. However, like a spoiled
    heiress who inherits the family business and surprises everyone by rising to the
    challenge, she has turned serious and responsible, lately showing herself capable
    of true greatness.


    Her early life as a dilettante, rarely entrusted with anything more than “scripting”
    tasks. The decisions she made were simple: If a required field was not filled
    in, she should color it red; if a button was clicked, she should bring another
    page into view. Although her responsibilities were limited, she was easy to get
    along with and make many friends. To this day, most programmers’ experience of
    her is primarily of this sort.


    Then, in the shift that to redefine her life, the world turned to the web. This
    had been her playground, her little place to amuse herself while of The Old Boys
    Club did the real work on the server.


    The wave started to break in the late 1990s when Microsoft introduced first iframes
    and XML Ajax part of his Gmail application in 2004 and Google Maps in 2005, the
    wave came crashing down. The world was suddenly aware of just how much richer
    the web experience could be when the browser was entrusted with more than just
    displaying whatever the server dispensed.


    So it was that our princess was given more responsibility than anyone had ever
    intended. She would need help.'
