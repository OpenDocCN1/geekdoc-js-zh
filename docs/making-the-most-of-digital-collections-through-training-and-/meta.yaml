  md: "# CHAPTER 5 ENSURING CORRECT USE OF THE CALLBACK PATTERN\n\nThe value of *this*\
    \ is generally the object on which the function is called (most commonly the object\
    \ that is \"dotted with\" the function). However, when you specify a callback\
    \ function, you have no direct control over which object this will be. For this\
    \ reason, many callback functions are designed to let you specify *this* explicitly.\n\
    \nThe `forEach` function used by attendeeCollection.iterate allows *this* to be\
    \ specified explicitly by providing a second argument: the object that *this*\
    \ should refer to within the callback. Because you are the author of attendeeCollection.iterate,\
    \ one solution to the problem would be to update attendeeCollection.iterate to\
    \ also accept the object that *this* should refer to as a second argument and\
    \ pass it along to forEach. Doing so would allow *this* to be bound to the instance\
    \ of checkedInAttendeeCounter that countIfCheckedIn function expects.\n\nSuppose,\
    \ that attendeeCollection is part of a third-party library and you cannot modify\
    \ it. Is it possible to reliably reference the current instance in your callbacks?\
    \ Frankly, the answer is yes.\n\nFirst, you should create a unit test that recreates\
    \ the scenario of checkedInAttendeeCounter.countIfCheckedIn being invoked with\
    \ *this* referencing any object other than the checkedInAttendeeCounter instance,\
    \ as demonstrated in Listing 5-10.\n\n> NOTE When you find a bug, it shows your\
    \ test suite was not sufficient. Always write a failing test before fixing the\
    \ bug.\n\nLISTING 5-10: Additional unit test to ensure \"this\" need not to be\
    \ the instance of checkedInAttendeeCounter (code filename: Callbacks\\checkedInAttendeeCounter_tests.js)\n\
    \n```\ndescribe('Conference.checkedInAttendeeCounter', function() {\n  var counter;\n\
    \n  // Existing tests omitted\n  describe('countIfCheckedIn(attendee)', function()\
    \ {\n    var attendee;\n\n    forEach(function() {\n      attendee = Conference.attendees('Mike',\
    \ 'Metcalf');\n    });\n  });\n\n  // Existing tests omitted\n  it('doesn\\'t\
    \ need this to be the checkedInAttendeeCounter instance', function() {\n    attendee.checkedIn();\n\
    \    // executes counter.countIfCheckedIn with this assigned to\n    // an empty\
    \ object\n    counter.countIfCheckedIn.call({}, attendee);\n    expect(counter.getCount()).toBe(1);\n\
    \  });\n});});\n```"
