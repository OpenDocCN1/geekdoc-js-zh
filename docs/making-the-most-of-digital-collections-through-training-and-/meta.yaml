  md: "Understanding Promises Through Unit Tests | 13\n\n```\nattendee.checkIn();\n\
    recorder.recordCheckIn(attendee).then(\n  // Success\n  attendee.setCheckInNumber,\n\
    \  // Failure\n  attendee.undoCheckIn\n);\n\n```\n\nThe idea, of course, is that\
    \ recordCheckIn does its work asynchronously and when it is done (note the call\
    \ to then), either the success or failure callback is called. In this case, the\
    \ callbacks are functions in the attendee object. You can guess what they do based\
    \ on their names; the trivial details are in this chapter's downloads.\n\nFor\
    \ all this work, recordCheckIn must return an object with a then method, which\
    \ takes two parameters: a function to call on success and one to call on failure.\
    \ That happens to be the heart of a Promise.\n\nListing 6-2 expresses what is\
    \ required, in the form of a unit test. It is a slight reworking of Listing 5-4,\
    \ with the one additional.\n\nLISTING 6-2: Naïve unit test of checkInService.checkIn\
    \ (code filename: Promises\\checkInService_01_tests.js)\n\n```\ndescribe('Conference.checkInService',\
    \ function() {\n  'use strict';\n  var checkInService,\n  checkInRecorder,\n \
    \ attendee;\n\n  beforeEach(function() {\n    checkInRecorder = Conference.checkInRecorder();\n\
    \    checkInService = Conference.checkInService(checkInRecorder);\n    attendee\
    \ = Conference.attendee('Sam', 'Wells');\n  });\n\n  describe('checkInService.checkIn(attendee)',\
    \ function() {\n\n    describe('when checkInRecorder succeeds ', function() {\n\
    \      var checkInNumber = 1234;\n      beforeEach(function() {\n        spyOn(checkInRecorder,'recordCheckIn').and.callFake(function()\
    \ {\n          return Promise.resolve(checkInNumber);\n        });\n      });\n\
    \    });\n\n    // Same tests as in Chapter 5\n  it('marks the attendee checked\
    \ in', function() {\n    checkInService.checkIn(attendee);\n    expect(attendee.isChecked()).toBe(true);\n\
    \  });\n});});\n```\n\ncontinues"
