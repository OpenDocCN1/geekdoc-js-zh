  md: 'If you have experience in a language that supports multi-threading, such as
    C# or Java, you may notice that there is a topic not covered in this chapter:
    thread safety. Because JavaScript is a singlethreaded language, complications
    that arise when an object is accessed from multiple threads may not be considered
    when creating JavaScript singletons.


    # UNDERSTANDING THE PATTERN THROUGH UNIT TESTS


    In Chapter 8, the restaurantApi.getRestaurantsWithinRadius function was memoized
    in order to reduce the number of calls to the third-party API used by the JavaScript
    conference website. The memoization functionality was neatly encapsulated in an
    aspect that may be applied to any other function in the website.


    What happens, however, if two instances of the restaurantApi are created and the
    getRestaurantsWithinRadius of each is called with the same arguments? Does the
    second object use the results that were cached when the first object''s function
    was made?


    In this example, and many other cases when memoization has been applied to a function,
    the desired answer to the second question is: "Yes, it makes use of the results
    cached by the call to the first object''s function." The next question, of course,
    is: "Do functions decorated with the returnValueCache behave that"


    Unfortunately, the answer is no. Instances of returnValueCache each have their
    own internal cache. This means that when an instance of the restaurantApi is created
    and has its getRestaurantsWithinRadius function created with the returnValueCache,
    that instance of restaurantApi has only access to results of previous calls and
    will not benefit from values cached within other instances of restaurantApi.


    It would be nice if instances of returnValueCache could share a single cache rather
    than having its own. If the returnValueCache had this capability, instances of
    restaurantApi could share the saved results of all getRestaurantsWithinRadius
    calls, regardless of the restaurantApi instance that the function was called.


    Dependency injection, covered in Chapter 2, is a great mechanism to facilitate
    sharing cache objects between returnValueCache instances. Modifying the returnValueCache
    module''s function to optionally accept a cache object will move the code in the
    desired direction.


    # Implementing a Singleton Cached with an Object Literal


    The object literal is the simplest implementation of the Singleton Pattern in
    JavaScript. Unlike the other object creation patterns, there''s no function to
    create another one, nor may the new keyword be used to create.


    The current implementation of the returnValueCache already uses an object literal
    as a cache, injecting an optional object literal as the shared cache is the easiest
    way to achieve the desired functionality.


    The unit tests shown in Listing 9-1 build upon Listing 8-3 in Chapter 8. By making
    the injected cache optional, the tests don''t require any modification (beyond
    updates to account for some test refactoring). By extension, any code that utilizes
    the returnValueCache in its current state—without providing a shared cache—also
    doesn''t require anything.'
