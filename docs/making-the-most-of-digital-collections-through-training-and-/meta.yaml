  md: "the programmer calling the function not worry about whether Marsupial should\
    \ be invoked with the new keyword; new is automatically used if it has been omitted.\n\
    \nOn the surface, the automatic use of the new keyword seems helpful, but really\
    \ all it does allow the programmer to get away with mistakes. Consider the following:\n\
    \n```\nvar jester = Marsupial('Jester', false);\nvar merlin = new Marsupial('Merlin',\
    \ false);\n```\n\nBoth invocations of new produce an object as if they had been\
    \ preceded by new even though only one of them is. If your team has adopted the\
    \ convention of naming constructor functions with an uppercase first letter, the\
    \ creation of the jester instance appears to be incorrect.\n\nConsistency begs\
    \ reliability, and as we prefer the protection mechanism presented in Listing\
    \ 3-4. Throwing an exception when new is omitted ensures that all Marsupial objects\
    \ will be instantiated in a way, contributing to a more consistent and reliable\
    \ codebase. Additionally, when coupled with test-driven development, any exception\
    \ generated via the omission of new will be immediately identified.\n\n> NOTE\
    \ Automatic semicolon insertion, a JavaScript feature that also lets programmers\
    \ get away with mistakes and allows for codebases to become inconsistent, is considered\
    \ by Douglas Crockford to be one of the awful parts of JavaScript that shouldn't\
    \ be relied upon (JavaScript: The Good Parts by Douglas Crockford, O'Reilly Media,\
    \ 2008). Automatic new insertion, while perhaps awful, should be avoided for the\
    \ same reasons.\n\nThe new object creation pattern allows you to create function\
    \ properties that are defined once available to all instances. Listing 3-6 shows\
    \ how properties can be added to each instance of object by defining them directly\
    \ on the new object in the constructor function. The listing also illustrates\
    \ that each object instance has its own copy of the function.\n\n+   LISTING 3-6:\
    \ Adding a function directly to the new object (code filename: New\\pattern_04.js)\n\
    \n```\nfunction Marsupial(name, nocturnal) {\n  if (!(this instanceof Marsupial))\
    \ {\n    throw new Error(\"This object must be created with new\");\n  }\n  this.name\
    \ = name;\n  this.isNocturnal = nocturnal;\n\n  // Each object instance gets its\
    \ own copy of isAwake\n  this.isAwake = function(isNight) {\n    return isNight\
    \ === this.isNocturnal;\n  };\nn}\n```\n\n```\nvar maverick = new Marsupial('Maverick',\
    \ true);\n```"
