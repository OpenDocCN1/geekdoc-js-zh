    \ factory will try to give you that. It does this by looping through all the possible\
    \ vendor-related parameters and creating a parameter for the factory that is a\
    \ base parameter plus the vendor property:\n\n```\n['vendor', 'product']).forEach(function(propName)\
    \ {\n```\n\nA lazier much less reliable test would be to try just one vendor-related\
    \ parameter. Why not test them all while you're at?\n\nIf you have been reading\
    \ exceptionally closely, you might now wonder why this test does not consider\
    \ the Error that will be thrown when the parameter to the VendorPresentation constructor\
    \ has a product but no vendor. The answer is that the constructor is never actually\
    \ executed! The spy is not up with .andCallThrough(), so the constructor's code\
    \ is never reached. All this test cares about is the unit tests of VendorPresentation\
    \ consider the error conditions; the present test stays DRY by not considering\
    \ them all over again. This is similar to what happened in Chapter 6 when testing\
    \ Promise-based code: By keeping the tests on-topic, you make them more robust.\n\
    \n# IMPLEMENTING THE FACTORY PATTERN\n\nSatisfied that your tests do what they\
    \ should and pleased that they do not do more, you are ready to code the factory\
