  md: '# Summary | 181


    +   - You can just toss whatever you have in the parameter, and the factory will
    figure out what you want.


    +   - You are well-positioned to accommodate new types of presentations in the
    future.


    +   - As an added bonus, the factory remembers for you that the objects must be
    created with new.


    # CONSIDERING OTHER FACTORY TYPES


    Factories can be simpler or more complex than what you have seen here.


    Sometimes, a factory creates only one type of object. For example, the object
    literals you saw in this chapter could have been produced by a `presentationParameterFactory`.
    As you read in Chapter 3, object literals have several disadvantages. A factory
    would address all of them.


    The factory in this chapter had just one function: create. A variation is to have
    several create-type methods specialized for different purposes. JavaScript does
    not have the function overloading of languages as C# or Java, so the methods would
    have to have different names. Alternatively, as described following Listing 1-4
    in Chapter 1, a single method could do different things according to what it finds
    in arguments.


    A factory can be a convenient place to set up an environment that all of its products
    will need. Sometimes, the environment will differ for unit-testing, functional
    testing, and production. You can use dependency injection to employ the factory
    fitted to the situation.


    Finally, a factory is a natural candidate for a singleton, so the varieties of
    singletons you encountered in the last chapter apply.


    # SUMMARY


    In this chapter, you created a factory that could produce any of a family of related
    objects. Typically, a factory has a method named something like `create` that
    takes one or more parameters. The `create` method inspects these parameters and
    produces an object according to what it finds.


    A factory gives increased control over the creation of objects and provides an
    extra layer of abstraction.


    Thorough unit tests for a factory should cover these concerns:


    +   - The create function will reject incorrect parameters.


    +   - The correct, underlying object-creation function is called with the expected
    parameters.


    +   - The object returned from that call is the one returned from `create`.


    In the next chapter, you will read about the Sandbox Pattern, which provides an
    even more abstract way to instantiate objects.'
