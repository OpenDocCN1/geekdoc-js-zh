    principles of object-oriented design that Robert Martin set forth in the late
    1990s (summarized at http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf).
    They are:


    +   - The Single Responsibility Principle


    +   - The Open/Closed Principle


    +   - The Liskov Substitution Principle


    +   - The Interface Segregation Principle


    +   - The Dependency Inversion Principle


