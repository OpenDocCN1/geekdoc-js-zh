  md: "\"Not at all,\" you tell them. \"We can create a façade\n\nWith the bottom\
    \ line again looking safe and sound, the conference organizers direct you to get\
    \ started on the façade without delay.\n\nThe pattern that Charlotte described,\
    \ and that you have to implement, is the Memoization Pattern. Memoization saves\
    \ the results of the function each time it is invoked, usually in a structure\
    \ that is keyed by the arguments that were provided to the function. When the\
    \ function is invoked with arguments it the saved value is looked up and returned\
    \ immediately; the logic in the body of the function is not performed.\n\nIn cases\
    \ repeated calls are made to a function that performs a time- or resource-intensive\
    \ calculation, the retrieval of the value will be significantly less costly than\
    \ repeating the whole operation.\n\nAs far as patterns go, the Memoization Pattern\
    \ is a simple one; it can be implemented in just a few lines of code. Its simplicity\
    \ has lulled many developers into complacency: just copy a here and paste that\
    \ and voilà, another memoized function . and duplicate code!\n\nThis chapter covers\
    \ how to implement and test the Memoization Pattern. Also, you learn how the pattern\
    \ can be applied using AOP, keeping your code DRY.\n\n# UNDERSTANDING THE PATTERN\
    \ THROUGH TESTS\n\nAs Charlotte pointed out, it's unlikely that the set of restaurants\
