    \ fullName(attendee) {\n  names.push(attendee.getFullName());\n  return names;\n\
    });\n};\n```\n\n# Creating Functions for Use with a Sandbox\n\nCreating and testing\
    \ modules designed to be isolated within a sandbox is relatively simple. The Sandbox\
    \ Pattern dictates that isolated modules are all dependent upon an instance of\
    \ the sandbox, and the sandbox instance must be injected into the module. As discussed\
    \ in Chapter 2, dependency injection increases the testability and reliability\
    \ of your JavaScript code.\n\nWhile we were working on creating the attendeeNames\
    \ tool, Charlotte was creating a dom tool that interacts with the browser's Document\
    \ Object Model (DOM).\n\n> A tool for interacting with the DOM? Why not use jQuery?\
    \ While it's tempting, remember that when correctly using the Sandbox Pattern,\
    \ modules isolated by the sandbox should only interact with the sandbox. A sandbox\
    \ can't prevent you from creating instances of objects that you shouldn't, or\
    \ keep you accessing global objects, such as window or jQuery. Doing so violates\
    \ the spirit of the pattern, however, and introduces dependencies you're trying\
    \ to avoid them.\n\nBetween your attendeeNames tool and Charlotte's dom tool,\
    \ you now have enough to create a widget for displaying attendee names. A portion\
    \ of the unit tests for the widget is provided in List 11-11.\n\nLISTING 11-11:\
    \ Unit tests related to the attendeeNamesWidget's participation in the Sandbox\
    \ Pattern (code filename: Sandbox/attendeeNamesWidget_tests.js)\n\n```\ndescribe(\"\
    Conference.Widgets.attendeeNamesWidget(sandbox)\", function() {\n  'use strict';\n\
