  md: "# Understanding the Pattern Through Unit Tests\n\nBased on the convention that\
    \ you and Charlotte agreed upon, each tool name provided should correspond to\
    \ a property of Conference.WidgetTools. If a tool name is specified that does\
    \ not have a corresponding property in that namespace, a descriptive Error should\
    \ be thrown. This will allow developers using the WidgetSandbox to quickly identify\
    \ that they've asked for an unknown tool (or made a typo).\n\nAssuming that a\
    \ tool name corresponds to a valid tool, the tool's module function should be\
    \ invoked with the instance of the WidgetSandbox as its only argument.\n\nListing\
