    # Avoiding JavaScript’s Pitfalls in Larger Systems


    Why is a system that contains 50 classes (or objects, in JavaScript) more than
    ten times as challenging to write and maintain as a system that contains five?
    With five objects, if each one draws on of all the others, there are at most 20
    channels of communication (of 5 objects calling 4 others—allowing yourself to
    count A calling B as well as B calling A). With 50, there are 2450 (50 times 49)—more
    than 100 times as many.


    With the advent of Single-Page Applications, node.js, and other ways of making
    JavaScript shoulders of larger and larger systems on both client and server, the
    best JavaScript developers should get serious about trimming those channels of
    communication to a bare minimum.


    Where an object must interface with others to do its job, the connections are
    managed assiduously to ensure that they function properly in all circumstances.


    This section will discuss ways to meet these goals.


    # Scripts Are Not Modules


    Just last week, we were on the website of a company that makes a certain specialized
    device for user input. They had helped provided sample JavaScript code for using
    their device.


    Argh! Their JavaScript library, suggested for all programmers to use, was over
    1900 lines of global variable or function after another—over 200 global functions
    in all. Most of the functions were at least so that collisions with other libraries
    were unlikely, but some, such as makeUri or toHex, were not.


    This is the "scripting" heritage of JavaScript at work. In the old days, when
    your script was global, there was little harm to adding to the global namespace.
    With today’s JavaScript applications, that is never the case.


    Your script is no longer isolated as it is in its .js file. If your file starts
    with


    ```

    var myVariable = makeValue();

    ```


    as one does (the names have been changed to the guilty), then myVariable is visible
    to all the other scripts in your application, and the makeValue function exists
    is, too.


    JavaScript presents an unusually diverse menu of choices for creating modules
    that properly encapsulate data and functions. Script files are not one of them!
    (You will read more about data encapsulation in Chapter 3.)


