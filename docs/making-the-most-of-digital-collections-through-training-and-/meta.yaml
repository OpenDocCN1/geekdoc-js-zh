    \ web service?\n});});\n```\n\nThe answer to the question is: No, most likely.\
    \ If one doesn't exist already, you would benefit from creating (and testing!)\
    \ with the sole responsibility of web service communication.\n\nBy maximizing\
    \ the testability of your code, you are able to identify violations of the SOLID\
    \ principles. Many times, as in the example above, you can avoid violating them\
    \ altogether.\n\n# Writing the Minimum Required Code\n\nTo review the basic TDD\
    \ workflow, you write a test that will fail in order to verify a small piece of\
    \ functionality, and then you write the minimum amount of code possible to make\
    \ that new test pass. You change the internal implementation details of the code\
    \ under development, known as refactoring, to remove duplication.\n\nBetween only\
    \ adding the minimum lines of code, and refactoring to remove duplicate code,\
    \ you can be certain that at the end of the process you have added the fewest\
    \ lines of code possible. This is perfect, because there can be no defects in\
    \ the code you write!\n\n# Safe Maintenance and Refactoring\n\nPracticing TDD\
    \ guarantees that you have a robust unit test suite for the production code in\
    \ your project. Up-to-date unit tests are an insurance policy against future regression\
    \ defects. A regression defect is a defect that appears in code that worked correctly\
    \ at some time in the past, but is no longer working properly; the quality and\
    \ reliability of the code has regressed."
