  md: "# HOW DOES instance 3-5 WORK?\n\nListings 3-4 and 3-5 rely on this instanceof\
    \ Marsupial returning false. The JavaScript instanceof operator inspects the prototype\
    \ of the left-side operand, seeking the prototype of the right-side operand. If\
    \ the right-side operand's prototype is found, the left-side operand is considered\
    \ to be an instance of the right-side operand.\n\nWhen a constructor function\
    \ is executed with the new keyword, JavaScript creates a empty object, links the\
    \ new object's prototype to the prototype of the constructor function, and executes\
    \ the constructor function with this being the new object.\n\nWhen new is omitted,\
    \ none of those automatic steps occur. The constructor function is not bound to\
    \ a new object when executed; in Listings 3-4 and 3-5 it is bound to the global\
    \ object. Additionally, the prototype assignment doesn't occur, and thus instanceof\
    \ returns false.\n\n![](bbox=[0.095, 0.495, 0.904, 0.6])\n\nFigure 3-1 shows the\
    \ error that is output to the console when\nvar slider = Marsupial('Slider', true)\
    \ is executed.\n\nFIGURE 3-1\n\nAn alternative to throwing an error when new is\
    \ not used is to automatically create an instance of an an object using new and\
    \ return that instead, as shown in Listing 3-5.\n\nLISTING 3-5: Automatically\
    \ create an instance with new (code filename: New Pattern\\nnewpattern_03.js)\n\
    \n```\nfunction Marsupial(name, nocturnal){\n  if(!this instanceof Marsupial)){\n\
    \    return new Marsupial(name, nocturnal);\n  }\n  this.name = name;\n  this.isNocturnal\
    \ = nocturnal;\n}\n\nvar slider = Marsupial('Slider', true);\n\nconsole.log(slider.name);\
    \ // 'Slider'\n```\n\nListing 3-5 executes the Marsupial function without using\
    \ new, but instead of throwing an error as in Listing 3-4, a Marsupial is created\
    \ with the new keyword and returned. Using this mechanism,"
