- img_proc: false
  md: 'In an interview, it doesn''t take much time to determine such a candidate has
    no problem hooking up a button handler, perhaps in the context of an ASP.NET Web
    Forms application, but would be hard-pressed to create a JavaScript module that
    has variables that are protected from external manipulation.


    As our organization''s use of JavaScript has evolved, our definition of what it
    means to have JavaScript experience has evolved as well. A few years ago, if a
    developer had a bit of experience with jQuery, we would check "JavaScript" box
    with satisfaction.


    Now, however, we''re looking for a lot more. And we''re not alone. It''s no longer
    uncommon for entire applications to be written in JavaScript. In so-called single-page
    applications (SPAs), the JavaScript code organizes the entire application, bearing
    more responsibility than the ephemeral click-handlers of the past. In order to
    participate in the development of a large-scale JavaScript application, developers
    must know how to use the language in a structured and disciplined way while simultaneously
    taking advantage of its many unique capabilities and quirks.


    Through the examples in this book, we hope to help you, the small-scale JavaScript
    developer, make it big.


    # Developers Responsible for Choosing Programming Languages for a New Project


    Perhaps you''ve heard the adage "No one ever gets fired for buying IBM." The statement
    reflects the feeling that, when facing with a technology partner for an IT project,
    it''s unlikely that the decision to pick an established, reputable company such
    as IBM will be second-guessed. The statement implies that IBM is the safe choice.
    Even if the project experiences cost over-runs, missed deadlines, or complete
    failure, the choice of IBM is above reproach.


    If you''re in a position to choose the language or languages used for the development
    of a new application, you''re in the same position as the IT manager choosing
    a technology partner. We have many tried-and-true programming languages with long
    histories. For instance, C# and Java, each backed by a large, established technology
    company, have been used to build both web and desktop applications for over a
    decade. No one will be fired for choosing C#.


    In terms of being a safe choice for a new programming project, especially in the
    enterprise, JavaScript is decidedly not C#. JavaScript is not a mature, dated,
    starched-wearing programming language. It is young, daring, and free-spirited.


    She doesn''t have the same track record of success for large-scale software projects
    as C# and Java have. That''s not to say that projects using C# and Java are guaranteed
    to succeed. If a project using one of those languages isn''t successful, however,
    language choice probably wouldn''t be included as a factor contributing to failure.


    As mentioned in the previous section, JavaScript makes it all easy to write disastrous
    code. This has given her a bit of a reputation, reducing the likelihood you''d
    want to bring her home to meet mom and dad.'
