    Fortunately, the instructor knew this would happen and had positioned his racket
    in front of his face to defend himself.


    The student''s racket crashed against the instructor''s, making a lot of noise
    and causing the student some embarrassment, but no harm was done.


    The instructor pointed out that in tennis, you generally hit with topspin so the
    ball dives and bounces with a kick toward your opponent. However, that stroke
    in squash does the opposite. If you hit with topspin, the ball will kick off the
    wall, making an easy, looping arc, and then bounce in a lazy manner off the floor,
    whereas your opponent will crush it. In squash, you want to hit with backspin.
    The ball will then kick down the wall, and kick off the floor toward your opponent
    with increased velocity.


    The normal stroke in squash has basic features in common (two players, rackets,
    and a ball) as well as common demands (good hand-eye coordination, good anticipation
    and movement on your feet), you won''t play squash if you try to hit the ball
    as you would in tennis.


