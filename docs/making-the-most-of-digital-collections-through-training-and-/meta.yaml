    # AVOIDING PROBLEMS


    The preceding section illustrated how to use the Callback Pattern to create flexible,
    testable code. Along the way, you saw how anonymous callback functions can prevent
    your code from being decoupled, easy to test, and reliable.


    Unfortunately, using anonymous callback functions isn''t the only way to arrive
    at an unreliable implementation of the Callback Pattern. This section introduces
    two situations that may lead to unreliable code: the presence of a “callback arrow”
    and unexpected values of this in callback functions. This section also covers
    ways to avoid such problems.


