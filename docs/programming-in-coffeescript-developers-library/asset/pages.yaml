  md: "each of our variables, including the variable pointing to our myFunc function,\
    \ is declared with\nthe var keyword. CoffeeScript has our back to ensure we do\
    \ the right thing in terms of\nvariable declaration.\n\nOne other interesting\
    \ thing to think about this code is that although CoffeeScript helps us\\with\
    \ proper variable declaration, it still doesn't prevent us from clobbering our\
    \ original vari-\nable reason for this is that when CoffeeScript is compiling\
    \ the JavaScript, it sees that there\nwas a previously defined variable named\
    \ a and assumes that you intended to use that variable\ninside of your function.\n\
    \n# The Anonymous Wrapper Function\n\nAs you've seen, and should have noticed,\
    \ all of our compiled JavaScript has been wrapped in\nan anonymous, self-executing\
    \ function. I know by now that you are wondering what func-\ntion doing there.\
    \ Let me tell you.\n\nAs we saw with our JavaScript scope examples, we were able\
    \ to easily access variables\nt were defined without the var keyword. When we\
    \ defined those variables, they ended up\na global namespace that is easily accessible\
    \ by everyone.\n\nWhen we defined our variable, even using the var keyword, we\
    \ were still defining it in the\nglobal namespace. Why is that, you? The reason\
    \ is quite simple—we defined it outside of\nan functions. Because the variable\
    \ was defined outside of a function scope, it is available to\nmeans that if another\
    \ library you are using also defines a, then one\nof the two variables will be\
    \ clobbered by the one that was last to be defined. This, of course,\ntrue of\
    \ any namespace, not just the global one.\n\nSo how do you define variables, and\
    \ functions, outside of the global namespace so they are\naccessible to your program\
    \ and no one else's? You do that by wrapping your code in an ano-\nmymous function.\
    \ This is exactly what CoffeeScript is doing for you when it compiles\nyour code\
    \ to JavaScript.\n\nNow, this is the point where you should be thinking two things.\
    \ The first is, \"That's clever, I\ncan do what I want in and not have to worry\
    \ about polluting the global namespace.\nThe second thing you should be asking\
    \ yourself is, \"Wait, how do I expose the variables and\nfunctions I want to\
    \ the global namespace so I and others can access them?\" Those are two\nimportant\
    \ thoughts. Let's address the second, because it's the one that needs to be addressed.\n\
    \nIf you were to write your entire program or library within the confines of an\
    \ anonymous func-\tion, as CoffeeScript forces you to, no other libraries or code\
    \ in your application could\naccess your code. That might be just what you want\
    \ to happen. However, if it is not what you\nwant, there are a few ways we can\
