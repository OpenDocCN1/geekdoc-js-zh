  md: "# Interpolation\n\nIn this section we talk about string interpolation, heredocs,\
    \ and comments in CoffeeScript. String interpolation will let us easily build\
    \ dynamic strings without having to worry about annoying and error-prone concatenation\
    \ syntax. Heredocs allow us to easily build nicely multiline string comments.\
    \ Comments, well, should be self-explanatory.\n\n# String Interpolation\n\nOne\
    \ of my personal pet pee in JavaScript is trying to build a dynamic string. Let\
    \ me give you an example. Let's build an HTML text field in JavaScript that is\
    \ using few dynamic attributes:\n\nExample: (source: javascript_concatenation.js)\n\
    \n```\nvar field, someId, some, someValue;\nsome = 'user[firstName]';\nsomeId\
    \ = 'firstName';\nsomeValue = 'Bob Example';\nfield = '<input type='text' name='\
    \ + some + ' id=' + someId + ' value=' + \n-> (escape(someValue)) + '>';\nconsole.log(field);\n\
    ```\n\nOutput: (source: javascript_concatenation.js)\n\n```\n<input type='text'\
    \ name='user[firstName]' id='firstName' value='Bob%20Example'>\n```\n\nSee how\
    \ ugly, confusing, and potentially buggy that code is? Did I remember to properly\
    \ close all the around my tag attributes? Did I add the correct number of \"?\
    \ I think so, but it is certainly not easy to see at a glance.\n\nCoffeeScript\
    \ has followed the lead of some the more modern languages, like Ruby, and gives\
    \ us two different types of strings, interpolated and literal. Let's look at them.\n\
    \n# Interpolated Strings\n\nTo get rid of all the nasty concatenation in our HTML\
    \ text field example, CoffeeScript lets us, instead, use string interpolation\
    \ to solve the problem.\n\nWhat is string interpolation? String interpolation\
    \ is a way for us to inject arbitrary CoffeeScript code inside a string and it\
    \ is executed at runtime. In our example, we want to stick a few variables into\
    \ our HTML string, and CoffeeScript lets us do that. Here is how you could write\
    \ the same example, this time using CoffeeScript's string interpolation:"
  merge: -1
  pgno: 48
- img_proc: true
  md: "# Example: (source: html_string_interpolation.coffee)\n\n```\nsomeName = 'user[firstName]'\n\
    someId = 'firstName'\nsomeValue = 'Bob Example'\n```\n\n```\nfield = \"input type='text'\
    \ name='#{someName}' id='#{someId}' value='#{someValue}'>\n```\n\n```\nconsole.log\
    \ field\n```\n\n# Example: (source: html_string_interpolation.js)\n\n```\nfunction()\
    \ {\n  var field, someId, someName, someValue;\n\n  someName = 'user[firstName]';\n\
    \  someId = 'firstName';\n  someValue = 'Bob Example';\n\n  field = \"<input type='text'\
    \ name='\" + someName + \"' id='\" + someId + \"' value='\" + (escape(someValue))\
    \ + \"''>\";\n\n  console.log(field);\n}.call(this);\n```\n\n# Output: (source:\
    \ html_string_interpolation.coffee)\n\n```\n<input type='text' name='user[firstName]'\
    \ id='firstName' value='Bob%20Example'>\n```\n\nDoesn't that look better? That\
    \ code is easier to read, write, and maintain.\n\nIn JavaScript, as you know,\
    \ there is no such thing as interpolated strings. All strings are considered equal.\
    \ In CoffeeScript, all strings are not created equal. Double-quoted strings, such\
    \ as the one we just used, tell the CoffeeScript compiler to process the string\
    \ and turn it into a concatenated JavaScript string, if necessary. Single-quoted\
    \ strings are called literals in CoffeeScript, and we'll look at them in just\
    \ a minute.\n\nWhen we want to inject some CoffeeScript into a double-quoted string,\
    \ we use the #{} syntax. Everything between the two braces will be separated by\
    \ the compiler and then concatenated to the string we are building. The code we\
    \ put inside the curly braces can be any valid CoffeeScript we would like:"
  merge: -1
  pgno: 49
