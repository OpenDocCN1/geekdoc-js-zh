  md: "# Chapter 10 Example: Todo List Part 1 (Server-side)\n\nFinally, for the action\
    \ where we want to destroy the todo, we simply need to call the remove\nfunction\
    \ on the todo to destroy it in the database.\n\n# Cleaning Up the Controller\n\
    \nIn case you haven't noticed, our controller is rife with duplicated code. Because\
    \ this is an\nexample application, we could just leave it, but why not clean it\
    \ up a bit? It will give us a\nchance to play with classes a bit more.\n\n> Tip\n\
    In reality, the clean-up code I'm about to show you might be overkill or could\
    \ even further\nrefactored, but I think it's still fine to see how we could refactor\
    \ it if we desired.\n\nTo clean up our controller, we are going to create a few\
    \ classes that will handle each of the\nactions we have mapped. We'll also use\
    \ some inheritance to cut down on duplicated code,\nspecially around the error-handling\
    \ part of our actions where most of the code duplication is\nhappening.\n\nLet's\
    \ start by building a base class, Responder, from which all our other classes\
    \ will inherit.\nThis class will handle our default and common functionality.\n\
    \nExample: (source: app.8/src/controllers/responders/responder.coffee)\n\n```\n\
    class global.Responder\n\nrespond: (@req, @res) =>\n  complete(null, {})\n\ncomplete:\
    \ (err, result = {}) =>\n  if err?\n    @res.json(err, 500)\n  else\n    @res.json\
    \ result\n```\n\nThe first thing you should notice is that we are defining the\
    \ Responder class on the global\nobject. This will allow us to easily access it\
    \ throughout the rest of our application.\n\nNext up, we will add a default function\
    \ called responder. This function will be what is passed\nto the mappings we define\
    \ in our todos_controller.coffee file. The respond function will\ntake two arguments,\
    \ the request object and the response object. We automatically assign\nthose to\
    \ the scope of the class, by prefixing them with @, so that we can have access\
    \ to them in\nour functions.\n\nThe respond function will most likely be overridden\
    \ by our subclasses, but just in case we will\nprovide a default behavior. The\
    \ default behavior we give it is to call the complete function."
