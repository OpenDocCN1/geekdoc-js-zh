  md: '# Chapter 10 Example: Todo List Part 1 (Server-side)


    > > Tip: We could just use GET and POST requests, but to me that makes our API
    more confusing. The REST approach lets us better, and more clearly, define our
    intent in the API.


    We are going to need to perform five actions on our todos.


    The first action is getting a list of all the todos in our database. That is what
    the first route we will be for.


    The second action is to create a new todo. We will use the post function to do
    this.


    The third action we will need is the capability to retrieve a specific todo from
    the database. Our third route mapping will be where we do this. Because we need
    to know which todo we want to pull from the database, we need to know the ID of
    that todo. Express lets us create mappings with placeholders in them. We can then
    retrieve these placeholders inside the callback function. Here we are doing that
    with the :id part of the path we mapped. We will be able to retrieve the value
    of :id later by using the param function off the req object to which we have access.
    We will use this same technique again when we need to update or delete a todo.


    The fourth action we need to handle is the updating of a todo. This will use the
    put function, which maps to the PUT http verb.


    Our last mapping and action is to delete a specific todo.


    All the mappings and actions are going to render JSON as the response. Conveniently,
    Express offers a json method on the response to help us with that. Without the
    json method we would have to write our responses something like this:


    ```

    res.send JSON.stringify({})

    ```


    With stubs in place, you can test that things are working as expected by starting
    the application and going to http://localhost:3000/api/todos. You should see the
    following printed to the screen:


    ```

    {}",{}

    ```


    That means it is hitting our API for listing the todos successfully.


    # Querying with Mongoose


    All that is left to do for this chapter, and before we move on to putting a nice
    front end on this bad boy, is flesh out each of the actions we''ve mapped for
    our API.'
