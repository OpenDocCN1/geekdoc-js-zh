  md: "# Setting Up Jasmine 173\n\nJasmine throws a few example files in there to\
    \ give us a feeling for how Jasmine works and\nhelp us make sure that it has been\
    \ set up and configured correctly. Let's test that now:\n> jasmine-headless-webkit\
    \ -c\n\nWith any luck you should see output similar to the following:\nRunning\
    \ Jasmine specs...\n....\nPASS: 5 tests, 0 failures, 0.009 secs.\n\nGreat! We\
    \ now have Jasmine up and running. Things look good. Well, everything except\n\
    a awful command we have to execute on the command line when we want to run our\
    \ tests.\nLet's use what we learned in Chapter 7, \"Cake and Cakefiles,\" and\
    \ write up a quick Cake task to\nkeep things simple.\n\nFirst, I'll show you the\
    \ Cakefile and then I'll explain it.\n\n```\nExample: (source: calc.1/Cakefile)\n\
    exec = require('child_process').exec\ntask \"test\", (options) =>\n  exec \"jasmine-headless-webkit\
    \ -c\", (error, stdout, stderr)->\n  console.log stdout\n```\n\n```\nExample:\
    \ (source: calc.1/Cakefile.js)\nfunction() {\n  var exec,\n      this = this;\n\
    \  exec = require('child_process').exec;\ntask(\"test\", function(options) {\n\
    \  return exec(\"jasmine-headless-webkit -c\", function(error, stdout, stderr))\
    \ {\n    return console.log(stdout);\n  }\n});\n}.call(this);\n```\n\nOutput:\
    \ (source: calc.1/Cakefile)\nCakefile defines the following tasks:\n\n```\ncake\
    \ test\n```"
