    \ me to push it aside. The first was that it was still not ready for prime time.\
    \ There were too many bugs and missing features.\n\nSo what made me come back\
    \ to CoffeeScript? Six months after I had tried CoffeeScript for the first time,\
    \ it was announced that Rails 3.1 would ship it with CoffeeScript as the default\
    \ JavaScript engine. Like most developers I was taken aback by this. I had tried\
    \ CoffeeScript and didn't think it was great. What were they thinking?\n\nUnlike\
    \ lot of my fellow developers, I took the time to have another look at CoffeeScript.\
    \ Six months is a very long time in the development of any project. CoffeeScript\
    \ had come along, long way. I decided to try it again, on an application that\
    \ had some pretty heavy JavaScript. Within a few days of using CoffeeScript again\
    \ I became not just a convert but an advocate of the language.\n\nI'm not going\
    \ to tell you exactly how it was converted, or try to tell you why I love it.\
    \ I want you to form your own opinion. Over the course of this book I hope to\
    \ convert you and make you an advocate of this wonderful little language reasons\
    \ that are all your own. But I will give you a little sneak peek at what's to\
