    \ a custom matcher to test whether the calculator in question is in scientific\
    \ mode. Jasmine provides a nice, simple way of letting us define our own matches.\n\
    \nIn our spec/javascripts/helpers directory, let's create a file called to_be_scientific.coffee.\n\
    \n> Tip\nThe names of the files in the spec/javascripts/helpers directory don't\
    \ really matter, but I like to make sure they're fairly descriptive. Using the\
