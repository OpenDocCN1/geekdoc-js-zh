  md: 'Inside our callback function, we are expecting two arguments. The first argument
    represents the request and the last argument is the response we are going to send
    back. The response object, our req argument, is filled with a tremendous amount
    of useful data—the page requested, the browser type, the query string, and so
    on.


    # Tip


    I recommend that you put a console.log statement in the callback function to print
    the request out to the screen and see exactly what data is in there. It''s a quick
    and easy way to know what you have access to each request.


    When a request comes to our server, our callback will be called with the corresponding
    request and an object we can use to handle the response. The first thing we want
    to do is define a variable name data to hold our response. In this case our response
    will be a simple "Hello World!


    Now that we know what we want to say, we can start writing back to the client.
    To do so we must first write our headers and our response code; for that we will
    use the WriteHead function in the response. The first argument writeHead takes
    an HTTP status code. In this code 200 is appropriate because everything went well.
    The second argument is an object representing any HTTP headers the client just
    wants to send back. In our case we want to send two headers. The first header
    is Content-Type, which for this example is text/plain because the second we need
    to send is Content-Length. This header tells the client how big is, in bytes,
    our response will be. Node provides a nice utility to do this: buffer.byteLength.
    Simply pass in the data we want to know the length of, and it will take care of
    the rest.


    With our status code and headers written out to the client, we can actually write
    our data back to the client using the write function.


    With our data written to the client, we can finally call the end function, which
    does exactly what its name implies—it ends the response. With that we have built
    our first very simple Node server. Congratulations.


    # Streaming Responses


    When writing a Node application, it''s important to note that you are not limited
    to the write function only once in your response. You can call it as many times
    as you want before you call the end function. This is a great way to write streaming
    APIs for your application. Let''s take a quick look at what this would look like.


    We''ll write a server that prints out the classic line from The Shining, 7 "All
    work and no play makes Jack a dull boy." Let''s print that line out to the browser
    for 30 seconds and then stop.'
