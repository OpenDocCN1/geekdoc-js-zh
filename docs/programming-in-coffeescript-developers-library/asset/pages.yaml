    \ and relax!\")\nelse\n  console.log(\"Get to work you lazy bum!\")\n```\n\nExample:\
    \ (source: switch1.js)\n\n```\n(function() {\n  var today;\n\n  today = \"Monday\"\
    ;\n\n  switch (today) {\n    case \"Saturday\":\n      console.log(\"Here are\
    \ your todos for the day...\");\n      break;\n    case \"Sunday\":\n      console.log(\"\
    Go watch football and relax!\");\n      break;\n    default:\n      console.log(\"\
    Get to work you lazy bum!\");\n  }\n}).call(this);\n```\n\nOutput: (source: switch1.coffee)\n\
    \nGet to work you lazy bum!\n\nAs you can see, our today variable is checked against\
    \ the defined case statements. Because neither of the case statements matched\
    \ the today variable we passed in, the program fell through to the else statement\
    \ we defined at the end of the switch statement. It’s worth pointing out that\
    \ we don’t need to define an else block at the end. If we didn’t define the else\
    \ in our example, nothing would have been printed out."
