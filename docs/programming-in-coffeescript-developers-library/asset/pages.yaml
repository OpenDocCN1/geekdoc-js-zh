  md: '# Writing our Todo Model and Collection


    The first part of this application that we''ll look at is the Todo model. This
    model will represent an individual todo that we get back from our API.


    In the assets directory, let''s create a new folder called models. In that folder
    we will put the Todo model as well as the Todos collection.


    Example: (source: app/2/assets/models/todo.coffee)


    ```

    # The Todo model for the Backbone client:

    class @Todo extends Backbone.Model

    # namespace under ''todo'' see backbone_sync.js

    paramRoot: ''todo''

    ```


    ```

    # Build the url, appending _id if it exists:

    url: =

    u = "/api/todos"

    u += "/#${get("_id")}" unless isNew

    return u

    ```


    ```

    # The default Backbone isNew function looks for ''id'',

    # Mongoose returns "_id", so we need to update it accordingly:

    isNew: ->

    !@get("_id")

    ```


    When writing a Backbone model, it is important that we extend the Backbone.Model
    class; otherwise, we won''t get any of the functionality we expect from a Backbone-based
    model.


    Because we are using backbone_sync.js, we need to set the name we want our data
    to be nested when it is sent back to the server. We do that by setting paramRoot
    to todo.


    Next, we need to tell Backbone which URL this will use to talk to the API. We
    do this by creating an API function. Backbone will automatically look for this
    function and tell it where our API is located. When we have a new Todo object,
    it won''t have an ID associated with it, so we want to append it only if the object
    isn''t new. The isNew function built in Backbone will return true or false based
    on whether the object is "new" or not.


    > Tip

    If you want to retrieve an attribute on a Backbone object, such as the title or
    _id attribute, you have to use the function to do that. That is because all attributes
    on a Backbone model are stored in a variable called attributes to prevent any
    sort of clashing between the Backbone attributes and functions and your attributes.


    The isNew function in Backbone does its magic by looking to see if the object
    has an id attribute. If it does, it considers the object not to be new. Unfortunately,
    MongoDB8 does not'
  merge: -1
