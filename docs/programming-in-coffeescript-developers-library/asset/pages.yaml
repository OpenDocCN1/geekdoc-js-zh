  md: "# Hooking Up the New Todo Form\n\nIn addition adding jQuery into our app, I\
    \ used the js function provided by connect-assets to include an application file,\
    \ where we can place into assets/application.\n\n```\nExample: (source: app.3/assets/application.coffee)\n\
    # require_tree \"jquery\"\n```\n\nThe application.coffee file is pretty small,\
    \ and we're going to keep it that way. Let's help us do that, we are going to\
    \ use a feature of connect-assets that lets us require other CoffeeScript or JavaScript\
    \ files. In this case, we are requiring a directory called jquery. This means\
    \ that every file we create this directory will be required automatically for\
    \ us.\n\nIn the assets folder, create a new folder called jquery, and then in\
    \ the new_todo_form.coffee file that we will place all the code that handles the\
    \ new todo form we have in our HTML. Let's take a quick run at that code now.\n\
    \nBefore we start writing the code to handle the new todo form, let's talk about\
    \ what we want to happen. When a person types into the todo form and presses the\
    \ Enter key, we want to test to make sure the todo is valid, in that it has at\
    \ least one-whitespace character. If it's invalid, we want to raise an error to\
    \ let the user know the problem was. If the todo is valid, we want to post data\
    \ back to our API. If the response from the API is a success, we want to add the\
    \ new todo to list of todos on the page and reset the form. If the response from\
    \ the server is an error, we want to show message back to the user. Here's the\
    \ code:\n\n```\nExample: (source: app.3/assets/jquery/new_todo_form.coffee)\n\
    $ ->n# Focus the new todo form when the page loads:\n$('#new_todo.todo_title').focus()\n\
    \n# Handle the keypress in the new todo form:\n$('#new_todo.todo_title').keypress\
    \ (e) ->\n# we're only interested in the 'enter' key:\nif e.keyCode is 13\ntodo\
    \ = {title: $(e.target).val()}\nif !todo.title or todo.title.trim() is \"\"\n\
    \  alert \"Title can't be blank\"\nelse\n  request = $.post('/api/todos\", todo:\
    \ todo)\n  request.fail(response) =>\n    message = JSON.parse(response.responseText).message\n\
    \    alert message\n```"
  merge: -1
  pgno: 267
- img_proc: true
  md: "```\nrequest.done(todo) =>\n  ('#new_todo').after(\"<li>${JSON.stringify(todo)}</li>\"\
    );\n  $(e.target).val(\"\");\n```\n\nThe first thing we do after the page has\
    \ loaded is focus the new todo form. This is a nice thing to do because it allows\
    \ the user to start typing todos right away, without having to manually navigate\
    \ to the form.\n\n# Tip\n\nIn jQuery you can pass a function into the $ variable\
    \ that aliases to jQuery, and everything in that function will be executed after\
    \ the page is fully loaded. You can do this as many times as you need. Handy.\n\
    \nNext, we attach a function to the form that will get every time someone presses\
    \ a key (event) in this form. This can get a little noisy, especially if we are\
    \ looking for only one particular key, the Enter key. The Enter key is a numeric\
    \ code of 13, so that we can look at the keyCode attribute of the event we receive\
    \ from jQuery. If the key is 13 we continue on; if we get something other than\
    \ 13 we simply ignore the event.\n\nKnowing that we are looking at the right event,\
    \ we can continue. Next, we want to capture the value of the form. That will be\
    \ the title of the todo we are hoping to create. We then create an object that\
    \ will represent all the data we want to send back to the server.\n\nWith proposed\
    \ title of the todo, we can now proceed to do local validation of it. This is\
    \ nice because it is faster, and therefore a nicer user experience, posting it\
    \ back to the server, waiting for the validations there to execute, and then coming\
    \ back to the client with any errors.\n\n# Tip\n\nThere are a lot of ways to share\
    \ validations both the server and client side so you don't have to write them\
    \ twice. If you find one that works for you, that's great. It's not always possible,\
    \ to have validations that work on both the client and server side the same way.\
    \ A great example of this is username validation, which usually needs to hit a\
    \ server to check for uniqueness. You can do that by using AJAX and hitting an\
    \ API call, or you can validate that the username is not blank in the form and\
    \ let the server side do the validation.\n\nAssuming the validations pass locally,\
    \ we can proceed to posting the data back to the API. We create a new AJAX request\
    \ using the post function that jQuery provides. We provide the url, /api/todos,\
    \ and an object that represents the data we want to send. We assign the return\
    \ value of the post function to a variable called request, which we can use in\
    \ a minute to hang callbacks on when the request does certain things."
