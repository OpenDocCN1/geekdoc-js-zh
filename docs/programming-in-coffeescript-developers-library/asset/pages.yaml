  md: "# Chapter 11 Example: Todo List 2 (Client-side w/ jQuery)\n\nThe updateTodo\
    \ function is similar to the code we wrote for creating a new todo. There are,\
    \ a few important differences. First, we get the value of the title text field\
    \ and do a simple validation on it to make sure it's blank. If it passes the validation,\
    \ we need to build the rest of the data we want to send to the server. In this\
    \ case we need to update the state attribute of the todo based on whether the\
    \ check box is checked.\n\nNext we create the request to the API. Because we want\
    \ to update a specific todo, we have to make sure to include the ID of the todo\
    \ as part of the API URL. Now, the more observant of you might have noticed that\
    \ we are actually using POST to send this data to the server, in our API requires\
    \ that it be sent via PUT. There are a couple of reasons for this. The first is\
    \ that historically not all browsers support HTTP GET and POST; the same holds\
    \ true of jQuery. To get around this limitation, a lot of frameworks, such as\
    \ Express and Ruby on Rails, have taken to looking for a specifically named parameter,\
    \ .method. The frameworks then consider the request to be whatever type is set\
    \ on parameter. In our case we are sending along the value of PUT for the .method\
    \ parameter, so Express will consider this not as a POST request, but rather a\
    \ PUT request.\n\nFinally we will look to see if there are error messages from\
    \ the server because of our update. If there are errors, we display them; however,\
    \ we just let the users on with their todo activities.\n\nWe have a small problem\
    \ here, however, if we were to mark a todo as completed and refresh the page,\
    \ it would appear as though it was still pending the check box wouldn't be checked\
    \ and none of the completed styles would be applied to the todo to let the users\
    \ know they've completed the task. Let's write a function that will update these\
    \ styles as appropriate:\n\nExample: (source: app.7/assets/jquery/style_by_state.coffee)\n\
    \n```\n#TodoApp ||= {}\n\n# Update the style based on the state:\nTodoApp.styleState\
    \ = (li, todo) ->\n  if todo.state == \"completed\"\n    $('.todo_state', li).attr('checked',\
    \ true)\n    $('.label.active', li).removeClass('active')\n    $('.todo_title',\
    \ li).addClass('completed').attr('disabled', true)\n  else\n    $('.todo_state',\
    \ li).attr('checked', false)\n    $('.label', li).addClass('active')\n    $('.todo_title',\
    \ li).removeClass('completed').attr('disabled', false)\n```\n\nThis function is\
    \ very simple. When it is called, it will check the state of the todo, and if\
    \ it's marked as completed it will apply the necessary CSS classes to the elements.\
    \ If it is not, it will remove those styles. One of the nice things about jQuery\
    \ is that it lets us write code like this, without having to first check if the\
    \ element in question already has the CSS class."
