  md: '# Wrapping Up


    There you it. We have used jQuery to write an interactive web client for our todo
    list application. It was pretty simple, and you can see how CoffeeScript can help
    us write some very nice looking jQuery.


    The approach we take in this chapter, from a code “architecture” perspective,
    is that of what a lot of jQuery developers probably would write. With a bunch
    of functions, pass around objects, and do what is necessary. We could have taken
    another approach to this application, which would have involved writing classes
    that managed each of the todos and wrapped the HTML elements and their events
    to the todo itself.


    So why didn''t I show you the second approach? I did this for two reasons. The
    first I have already stated; the approach we have shown here is that of someone
    writing plain old JavaScript and jQuery, so I wanted to give you a feel for what
    that would look like in CoffeeScript. The second reason I didn''t write code in
    the “class” style is because doing so would mean we have reinvented the wheel
    that is Backbone.js.


    Backbone.js is a simple framework that lets you write code that binds elements
    of a page and associate those views with models, such as our todos, and then they
    easily listen to each other and respond to events accordingly. As a matter of
    fact, thinking about it, why don''t we see Backbone in action? Turn the page to
    Chapter 12, “Example: Todo List Part 3 (Client-side w/ Backbone.js)” and let''s
    get started!


    By the way, if you are curious to see what the jQuery example would look like
    if we had written it using classes instead of the approach we took here, I happen
    to have it already written for you. Enjoy!!


    # Notes


