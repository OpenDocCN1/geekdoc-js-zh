  md: "The Responder.Create class is very similar to the Responder.Index class we\
    \ just built. In the respond function, we are creating our new todo and passing\
    \ the complete function as the call-back function to the save call we are making.\n\
    \nExample: (source: app.8/src/controllers/responders/show_responder.coffee)\n\
    require \"#{dirname}/responder\",\n\n```\nclass Responder.Show extends Responder\n\
    ```\n\n```\nrespond: (@req, @res) =>\nTodo.findById(@req.param('id'), @complete\n\
    ```\n\nAgain, the Responder.Show class is like the first two classes; we're just\
    \ changing out the innards of the respond function. We use the Responder.Show\
    \ class as the super class for our final two classes that we will write. Let's\
    \ take a look.\n\nExample: (source: app.8/src/controllers/responders/update_responder.coffee)\n\
    require \"#{dirname}/show_responder\",\n\n```\nclass Responder.Update extends\
    \ Responder.Show\n```\n\n```\ncomplete: (err, result = {}) =>\nif err?\n  super\n\
    else\n  result.set(@req.param('todo'))\n  result.save(super)\n```\n\nBecause the\
    \ action to update a todo also needs to find the todo in question, we can extend\
    \ the Responder.Show class itself since the Responder.Show class has all the functionality\
    \ we need to find the todo.\n\nIn the Responder.Update class we are not going\
    \ to write a new respond function, because we want to use the one we inherited\
    \ from Responder.Show. Instead, we are going to write a custom complete function.\n\
    \nThe first thing we need to do in our new complete function is to check the existence\
    \ of an error. If there is an error, we call super, which will call the original\
    \ complete function from the Responder class, and that will handle the error appropriately\
    \ for us.\n\nIf there is no error, we proceed with setting the attributes to update\
    \ and calling the save function. When we call the save function, we are going\
    \ to pass in super, again the original complete function from the Responder class.\
    \ This will handle any errors and respond with the appropriate JSON.\n\nThe class\
    \ we need to build for the action to destroy a todo is very similar to the one\
    \ we just built for updating the todo."
