- img_proc: true
  md: 'The only other step in getting our inline CoffeeScript to compile in the browser
    is to make sure we set the appropriate type on our script tags, like so:

    <script type=''text/coffeescript''></script>


    When the page loads, the CoffeeScript compiler in coffee-script.js will search
    your HTML document for any script tags with a type of text/coffeescript, compile
    them into the equivalent JavaScript form, and then execute the compiled JavaScript
    code.


    # Caveats


    Now that you know how to compile CoffeeScript inline in your HTML document, I
    would like to point out a few things. Everything that we discuss in this book,
    in terms of scope, anonymous function wrappers and so on, all holds true when
    compiling CoffeeScript in this fashion. It''s important to keep this in mind when
    writing your code like this.


    Second, and this is probably the best one to take away here, is this is not a
    particularly fast way of compiling your CoffeeScript. When deploying to this production,
    it means all your users will have to download an extra 12.26KB file to compile
    your CoffeeScript. After the page loads, the compiler has to go through the page
    looking for the text/coffeescript tags, compile them, and then execute them. That''s
    not a very good user experience.


    Armed with this knowledge, I''m hoping you choose the right path and compile your
    CoffeeScript offline before deploying to production.


    # Command-Line Compilation


    Although being able to execute CoffeeScript in the browser is useful and fairly
    easy, it really is not the best compilation option available to us. We should
    be compiling CoffeeScript before we set it up on the Web. However, it is entirely
    possible that you are writing a Node application or some other server-side application
    that won''t be in a browser, so browser compilation won''t work.


    So how best we compile our CoffeeScript? Great question. You will find a lot of
    third-party libraries that will compile your Script files for you (in different
    languages and on various platforms), but it is important to understand how to
    do it yourself, so you can write your own compilation scripts, you should need
    to.


    # The compile Flag


    Let''s start with the most important flag to the coffee command, -c. The -c flag
    will take the CoffeeScript file you pass to it and compile out to a JavaScript
    file for you in the same location. This is how I compiled the source code examples
    in this book.'
