    index = 0\nuntil index++ >= number_of_times\ncallback(index)\nreturn null\n```\n\
    \n```\ntimes 5, (index)->\nconsole.log index\n```\n\n# Example: (source: until_loop.js)\n\
    \n```\n(function() {\n  var times;\n\n  times = function(number_of_times, callback)\
    \ {\n    var index;\n    index = 0;\n    while (!(index++ >= number_of_times))\
    \ {\n      callback(index);\n    }\n    return null;\n  };\n\n  times(5, function(index)\
    \ {\n    return console.log(index);\n  });\n}).call(this);\n```\n\n# Output: (source:\
    \ until_loop.coffee)\n\n+   1\n2\n3\n4\n5\n\n# Tip\n\nTo help you remember which\
    \ loop is which, think of it like this: A while loop runs while the condition\
    \ is true. An until loop runs until the condition is true. It may sound silly\
    \ to some of you, but a lot of people have trouble remembering which is which."
