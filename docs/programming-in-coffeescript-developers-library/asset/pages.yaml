  md: "# Chapter 8 Testing with Jasmine\n\nThis is definitely not the most complex\
    \ Cakefile or Cake you'll ever see\n\nWhat we get with the child_process module,\
    \ in particular, is the exec function. The exec function lets us send commands\
    \ to the console and capture the output of that command when it finishes, which\
    \ is exactly what we're doing with our Cake task.\n\nWe've created a Cake task\
    \ test that sends our command, jasmine-headless-webkit -c, to the command line,\
    \ where the tests are run. When the tests have finished, our callback function\
    \ is executed, and the results of the tests print out to the console.\n\nNow if\
    \ you follow this in the console:\n\n+   > cake test\n\nyou should see the results\
    \ of the tests, just like we did earlier.\n\nWith the command cleaned up by a\
    \ bit, let's do some final configuration of our project we dive into writing some\
    \ tests.\n\nFirst, we'll clean up the project and get rid of all those example\
    \ files that were generated for us that we don't want. You should delete files\
    \ and directories until your project directory looks like this:\n\n```\nsrc/\n\
    Rakefile\nspec/\n  javascripts/\n  helpers/\n  support/\n    jasmine.yml\n   \
    \ jasmine_config.rb\n    jasmine_runner.rb\n```\n\nOkay, we are almost there.\
    \ The last thing we need to do is configure the spec/javascripts/support/jasmine.yml\
    \ file to give it the specifics of our project:\n\nExample: (source: calc.2/spec/javascripts/support/jasmine.yml)\n\
    \n```\nsrc_files:\n  - /**/*.coffee\"\n\nhelpers:\n  - \"helpers/**/*.coffee\"\
    \n\nspec_files:\n  - /**/_spec.coffee\n```"
