    # Splats...


    Sometimes when developing a function, we are not sure just how many arguments
    we are going to need. Sometimes we get one argument; other times we might get
    a hundred. To help us easily solve this problem, CoffeeScript gives us the option
    of using splats when defining the argument list for a function. Splatted arguments
    are denoted by placing an ellipsis (...) after the method definition.


    # Tip


    A great way to remember how to use splats is to treat the ... suffix as if you
    were saying etc... Not only is that easy to remember, but if you use etc... in
    your code, you''ll look cool.


    When would you use splats? Splats can be used whenever your function will be taking
    a variable number of arguments. Before we take a look at a detailed example, let''s
    look quickly at a simple function that takes a splatted argument:


    Example: (source: splats.coffee)


    ```

    splatter = (etc..) ->

    console.log("Length: #{etc.length}, Values: #{etc.join('','', '' '')}")


    splatter()

    splatter("a", "b", "c")

    ```'
