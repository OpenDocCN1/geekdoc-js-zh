  md: "# Chapter 8 Testing with Jasmine\n\nAll tests are now failing, and they're\
    \ failing for a very good reason—we haven't written our Calculator class yet!\
    \ So let's do that; it's a pretty simple class:\n\nExample: (source: calc.6/src/calculator.coffee)\n\
    \n```\nclass @Calculator\n\nadd: (a, b) ->\n  a + b\n\nsubtract: (a, b) ->\n \
    \ a - b\n\nmult: (a, b) ->\n  a * b\n\ndivide: (a, b) ->\n  a / b\n```\n\nExample:\
    \ (source: calc.6/src/calculator.js)\n\n```\nfunction() {\n\nthis.Calculator =\
    \ (function() {\n\nfunction Calculator() {\n\nCalculator.prototype.add = function(a,\
    \ b) {\n  return a + b;\n};\n\nCalculator.prototype.subtract = function(a, b)\
    \ {\n  return a - b;\n};\n\nCalculator.prototype.multiply = function(a, b) {\n\
    \  return a * b;\n};\n\nCalculator.prototype.divide = function(a, b) {\n  return\
    \ a / b;\n};\n\nreturn Calculator;\n\n}})();\n}).call(this);\n```"
