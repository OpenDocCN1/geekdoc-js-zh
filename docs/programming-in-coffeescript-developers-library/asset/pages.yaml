  md: '# Example: Todo List Part 3 (Client-side w/ Backbone.js)


    In Chapter 11, "Example: Todo List Part 2 (Client-side w/ jQuery)" we wrote a
    client-side front for a todo list application using the jQuery library. At the
    end of that chapter I talked about how we could have written code somewhat differently,
    but doing so would have meant that we basically rewrote Backbone.js framework.
    Because I''m not typically in favor of reinventing the wheel, I thought we could,
    see what our application would look like if we used Backbone instead of jQuery
    to write our client-side code.


    # What Is Backbone.js?


    Backbone is a client-side MVC framework in JavaScript by Jeremy Ashkenas,3 creator
    of a little language known as CoffeeScript.4 Backbone helps us write highly responsive
    client-side applications using JavaScript, or in our case, CoffeeScript.


    Backbone has three separate parts. The first is the View layer. Views let us wrap
    the rendering of elements on the screen and then watch these elements for changes
    and respond accordingly. Views can also listen for events on other objects and
    update themselves based on those events.


    The second part of Backbone is models and collections. A model maps to a single
    instance of an object. In our case it would be a Todo. Model object can communicate
    with a data store to persist itself. It can also contain other functions that
    could be helpful when dealing with an object, as a function to concatenate a first
    and last name into a single string. A collection is what its name suggests. It
    is a collection of models, so in this application it would be a collection of
    Todo models. A collection in Backbone also has the capability to talk to a data
    store, such as our API.


    Models and collections also emit all sorts of events when different actions happen
    to those objects. For example, when a new model is added to a collection the collection
    triggers an add event. These events can be listened to by other objects, such
    as views. In the case'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Chapter 12 Example: Todo List Part 3 (Client-side w/ Backbone.js)


    of a view object, it might listen to a collection for an add event and when one
    is triggered, it will render the model to the screen in the appropriate way. We
    will see how this works in just a little bit.


    The final part of Backbone is the router. Routers in Backbone let us to listen
    and respond to changes in the URL of the browser. When URL changes and there is
    an appropriate mapping to the router, the code associated with that mapping will
    be executed. This is similar to what we did in our Express application when we
    built our API. We won''t be using routers at all in this chapter, but that doesn''t
    mean they aren''t useful. Our particular application doesn''t have any need for
    them.


    All that, of course, is a very quick overview of what Backbone is. We will go
    into a bit more detail throughout this chapter, but this chapter is not going
    to be a full tutorial on Backbone. We are just going to look into the parts of
    Backbone that are appropriate for our application.


    # Cleaning Up


    Before we move on to rebuilding our application, we need to first do a bit of
    house cleaning in our application to make sure it is ready for us to start incorporating
    Backbone into.


    The first thing we can do to clean up our application is to delete the assets/jquery
    folder. Second, we need to remove the reference to that directory from the assets/application.coffee
    file:


    > Example: (source: app.1/assets/application.coffee)

    # require "templates"


    And we''re done! If we were to restart our application now, we would be left with
    just the new todo form, and it would do nothing. Let''s start to rebuild the application.


    # Setting Up Backbone.js


    Getting Backbone installed into our application is fairly painless. it has only
    one dependency: underscore.js.5 Despite being only one "hard" dependency, Backbone
    is not very useful unless we give it a library to DOM manipulation or AJAX persistence;
    this is where jQuery (or Zepto) come in. Frankly, we already have both jQuery
    and underscore.js in our index.ejs file, so all we need to do is add Backbone
    itself and we are basically done:


    Example: (source: app.1/src/views/index.ejs)


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Todos</title>

    ```'
