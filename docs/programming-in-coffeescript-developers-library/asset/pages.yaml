  md: "Example: (source: calc.10/spec/javascripts/helpers/to_be_scientific.js)\n\n\
    ```\nbeforeEach(function() {\n  return this.addMatchers({\n    toBeScientific:\
    \ function() {\n      return this.actual.scientific === true;\n    }\n  });\n\
    });\ncall(this);\n```\n\n> > TipnCustom matchers don't need to be placed into\
    \ their own files. You could define them cleaner all in one helper file. I like\
    \ to write one per file. I find it makes my code base a little cleaner and saner.\
    \ You can also write one-off matchers in a “describe” block for a particular test\
    \ should the whim strike you.\n\nTo write our matcher, the first thing we need\
    \ to do is a beforeEach that will get called before every test in our test suite.\
    \ Inside of beforeEach we want to call the built-in Jasmine function, addMatchers,\
    \ that does just what its name says. It takes an object that contains the names\
    \ of the matchers you want to add and the function that represents each of those\
    \ custom matchers. It is important that the custom matcher returns true or false\
    \ as the result. Remember earlier in the chapter when I said that in Jasmine if\
    \ an assertion returns the test passes; otherwise, the test fails? This is where\
    \ you define your behavior.\n\nIn our matcher, toBeScientific, we are going to\
    \ assert whether the Calculator instance we are testing has the scientific flag\
    \ set on and return true or false based on that flag.\nWith our custom matcher\
    \ in place, we can update our tests to use it like so:\n\nExample: (source: calc.10/spec/javascripts/calculator_spec.coffee)\n\
    \n```\ndescribe \"Calculator\", ->\n\nbeforeEach ->\n  @calculator = new Calculator()\n\
    \nit \"is not in scientific mode by default\", ->\n  expect(@calculator).not.toBeScientific()\n\
    \ndescribe \"scientific mode\", ->\n```"
