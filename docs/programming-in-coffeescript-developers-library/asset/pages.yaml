  md: "> **Tip**nBeing able to get a list of available tasks is incredibly useful\
    \ if you start requiring libraries may have their own built-in Cake tasks.\n\n\
    # # Running Cake Tasks\n\nNow that we've created our first task, how do we run\
    \ it? Easy. When I run the cake command against our example, it told us to run\
    \ our task. Simply type in cake followed by the name of the task you would like\
    \ to run, like this:\n\n+   > cake greet\n\nThat will run our greet Cake task.\n\
    \nOutput:\nHello, World!\n\n# # Using Options\n\nWe have our first task written,\
    \ and we know how to execute it, but what if we want to pass some arguments into\
    \ it? For example, what if we want our greet task to accept an option so we can\
    \ customize who we greet? Let's look at how Cake lets us do that.\n\nThe first\
    \ step in being able to pass options to our tasks is to define the option. We\
    \ do this using the special option function that Cake gives us. This function\
    \ takes three arguments. The first argument is the \"short\" form of the option,\
    \ the second argument is the \"long\" form of the option, and the final argument\
    \ is a simple description of what the option does. Let's take a look at our greet\
    \ task again, and this time let's define an option so we can customize the greeting.\n\
    \n> **Tip**nWhen I talk about the \"long\" or \"short\" form of an, I really am\
    \ talking about how much typing the user has to do. For example, -n is a short\
    \ option and --name is a long option.\n\nExample: (source: example2/Cakefile)\n\
    \n```\noption '-n', '--name [NAME]', 'name you want to greet'\ntask \"greet\"\
    , \"Say hi to someone\", (options)->\nmessage = \"Hello,\"\nif options.name?\n\
    \    message += options.name\n```"
