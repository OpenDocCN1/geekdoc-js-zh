  md: '# Installing and Setting Up Express


    The first order of business on the road to building the best todo list application
    ever is getting a web server/framework in place to handle our backend requests.
    To do this we are going to use the most popular Node framework out there, Express.2
    is easy to install and get running quickly, and it has a vibrant developer community,
    which makes it a great choice for the task at hand.


    In a nice, fresh directory, let''s create a new file, app.coffee, that will be
    the starting point for our Express backend. Right now, let''s leave that file
    blank while we install.


    Express ships as an NPM,3 Node Package Manager, module. We briefly mentioned NPM
    in Chapter 9, "Intro to Node.js." NPM modules are bundles of code that are packaged
    up and can be distributed when installed, included, and right inside Node applications.
    If you have Node installed, you should already have NPM installed.


    Installing Express is a simple one:


    +   - npm install express


    You should see output similar to this:


    ```

    express@2.5.2 ./node_modules/express

    - mime@1.2.4

    - mkdirp@0.0.7

    - qs@0.4.0

    - con nect@1.8.3

    ```


    You should also create a new folder node_modules in the application directory.
    This is where NPM stores the modules we install. We will be installing more modules
    in this directory later.


    > NPM modules can be installed globally as well using the -g flag: npm install
    -g express. I prefer to install the modules into the project so I can check them
    in SCM. It makes deployment a lot easier and cuts down on potential version conflicts.


    With Express now fully installed, let''s add some meat to the bones of that app.coffee
    file we created earlier.


    Example: (source: app.1/app.coffee):


    ```

    # Setup Express.js:

    global.express = require(''express'')

    global.app = app = express.createServer(

    require("{__dirname__}/src/configuration")

    ```


    # Set up a routing for our homepage:'
