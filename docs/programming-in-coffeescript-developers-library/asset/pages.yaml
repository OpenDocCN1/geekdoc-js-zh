  md: '# Chapter 8 Testing with Jasmine


    now. In this short example we want to test that the "Calculator" "does something."
    The second argument is a function that contains the assertions to prove what it
    is testing.


    In our "does something" test, we are asserting that 1 + 1 equals 2. We are also
    rather triumphantly asserting that 1 + 1 does not equal 3. We do these tests using
    called call matchers; in this case we used the equal matcher. Matchers have one
    simple rule: if the matcher returns true the test passes; otherwise, the test
    fails.


    So what does the expect function do and why do we need it? The expect function
    takes as its argument the statement we want to test, so for us it would be 1 +1,
    and returns a special object that has the matcher functions on it. In a nutshell,
    it''s there to make Jasmine''s life a little easier. It also helps the readability
    of your tests a bit.


    > Tip

    Jasmine ships with a handful of matchers that you can use to test almost anything.
    You can find a list of these matchers on the documentation¹¹ site for Jasmine.


    # Unit Testing


    Now that we have a basic understanding of how to write a Jasmine test, let''s
    flesh out what the tests are going to look like for our Calculator class. We''ll
    start by removing our example test and adding four blocks to test addition, subtraction,
    multiplication, and division:


    ```

    describe (source: calc.4/spec/javascripts/calculator_spec.coffee)

    describe "Calculator", ->


    it "#add", ->


    it "adds two numbers", ->


    describe "#subtract", ->


    it "subtracts two numbers", ->


    describe "#multiply", ->


    it "multiplies two numbers", ->


    describe "#divide", ->


    it "divides two numbers", ->

    ```'
