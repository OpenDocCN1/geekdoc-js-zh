  md: "# Introduction to Jasmine\n\n```\nsrc_dir: \"src\"\nspec_dir: spec/javascripts\n\
    ```\n\nNow we are finally ready to start looking at Jasmine code!\n\nSo what does\
    \ a Jasmine test look like? Let's build a simple one and you'll see.\nIn our spec\
    \ directory, let's create a new file called calculator_spec.coffee. This file\
    \ is where we will build all the tests, or specs as they're sometimes known, for\
    \ our calculator. Let's first see what our simple test will look at, and then\
    \ we will dissect it to understand better what it's doing.\n\n```\nExample: (source:\
    \ calc.3/spec/javascripts/calculator_spec.coffee)\ndescribe \"calculator\", ->\n\
    it \"does something\", ->\nexpect(1 + 1).toEqual(2)\nexpect(1 + 1).not.toEqual(3)\n\
    ```\n\n```\nExample: (source: calc.3/spec/javascripts/calculator_spec.js)\nfunction()\
    \ {\n\ndescribe(\"Calculator\", function() {\n\treturn it(\"does something\",\
    \ function() {\n\t\texpect(1 + 1).toEqual(2);\n\t\treturn expect(1 + 1).not.toEqual(3);\n\
    \t});\n}\n}).call(this);\n```\n\nFirst, we need to create what is called a \"\
    describe\" block. This is where we tell Jasmine what the \"noun\" is that we are\
    \ going to be testing. We usually describe classes or functions. In this case\
    \ we want to describe the calculator class we're going to build. The first argument\
    \ to the describe function is a string that represents the noun \"Calculator.\"\
    \ The second argument is a function that will contain all the tests associated\
    \ with that noun.\n\nInside the callback function we give to the describe function\
    \ we can define \"it\" blocks. An \"it\" block, which is just a function, similar\
    \ to the \"describe\" function, or block, in that it takes two arguments. The\
    \ first argument is a string that represents what we plan on testing"
