    In that file we are first requiring Mongoose and then setting a few of its properties
    to the global object so that we can easily access them later from other parts
    of our code.


    Last, in that file we are telling Mongoose where to find our Mongo server and
    which database it should use. This line may change where on your system depending
    on how you have things set up.


    All that is left to get Mongoose set up in our system is to require the src/models/database.coffee
    file we just created in our app.coffee-file, like so:


