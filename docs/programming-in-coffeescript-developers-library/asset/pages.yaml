  md: '# Chapter 11 Example: Todo List Part 2 (Client-side w/ jQuery)


    > **Tip**nIn jQuery 1.5 deferred objects were introduced. Before deferred objects,
    you would have to include any callbacks inside the original call to the post,
    or ajax, function when you originally call it. That was quite limiting. With deferred
    objects you can attach callbacks anytime, even after the request has finished
    processing. This makes it easier to write more isolated code that hangs on a request.


    In our case, we want to add two callbacks to our request for any reason. The first
    callback function will be called if the request fails or that response object,
    we will need to get the response?text, which is JSON, parse it, extract the error
    message, and display it to the screen.


    The second callback will be executed on successful completion of the request,
    in our case the creation of a new todo in the database. Because we haven''t yet
    written a new template for printing our todos nicely, we''ll print out the JSON
    representation of the todo inside of a list and append it to our list of todos
    after the new todo form, so that the newest todos are always at the top.


    If you fire the application and try to create a new todo, you should see something
    similar to the following example appear below the form:


    ```

    {"title":"My New Todo","id":"4efa82bdf654900000001a","created_at":"2011-12-28T02:45:17.9922Z","state":"pending"}

    ```


    # Cleaning Up the Todo List with Underscore.js Templates


    There are quite a few templating systems out there for JavaScript applications,
    and choosing the right one for your application is really a matter of taste. Because
    our needs here are quite simple, I''m going to make our choice of templating systems
    just as simple. We will use the templating system that ships with the library
    underscore.js Why did I choose this templating system over all the others out
    there? Simple, underscore.js is a dependency of the Backbone.js library we will
    be using later, so because we have to include it as a dependency, we may as well
    use it now.


    > **Tip**nMy personal favorite templating system is eco,7 which lets you embed
    CoffeeScript in your templates. A couple of other popular templating systems include
    Handlebars, Mustache,9 and Jade.10 The template-plugin11 for jQuery was quite
    a popular choice for a while, but has been deprecated and is no longer under active
    development, so if you were planning on using that, I would strongly suggest you
    look elsewhere for your templating needs.'
