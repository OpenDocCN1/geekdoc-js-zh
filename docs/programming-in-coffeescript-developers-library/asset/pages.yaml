  md: '# # Functions and Arguments


    In this chapter we are going to look at one of the most essential parts of any
    language, the function. Functions allow us to encapsulate reusable and discrete
    code blocks. Without functions our code requires the use of even, unreadable,
    and unmaintainable mess.


    I wanted to give you an example of how JavaScript would look like if we were not
    able to use or write functions, but I was unable to. The simplest example of taking
    a string and making it lowercase requires use of functions in JavaScript.


    Because I can''t show you an example devoid of functions, I''ll show you an example
    of some CoffeeScript code that could use the help of a function or two, so you
    can see how important functions are to helping you keep your code manageable.


