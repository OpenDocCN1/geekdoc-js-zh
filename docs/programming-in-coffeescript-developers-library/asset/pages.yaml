  md: '# Chapter 12 Example: Todo List Part 3 (Client-side w/ Backbone.js)


    > Tip

    In the NewTodo class, we are passing success and error callbacks to the save-Model
    function, but in the TodoListItemView class we are not. The reason is that we
    are listening for events on the @model object that are going to, essentially,
    for us. We don''t use this approach in the NewView class because we are constantly
    creating Todo instances, so we would have to keep binding the events. It''s just
    easier there to add the callbacks.


    With all this, we should be able to update the title and the state of the todo
    and have them persist back to the server and render appropriately when they''ve
    been updated.


    # Validation


    Before we move off updating the todos, let''s add some simple, client-side validation
    to the Todo class so we don''t have to keep going back to the server to validate
    the object. In particular, we are concerned with whether the title attribute is
    blank.


    Because our Todo class inherits from Backbone.Model, we have access to a very
    simple validation system. The way it works: When the save function is called on
    a Backbone.Model, it checks to see if there is a function called validate. If
    the validate function returns a value other than null, the save function stops
    immediately and returns whatever value the validate function returned.


    Let''s add a validate function to the Todo model:


    Example: (source: app.7/assets/models/todo.coffee)


    ```

    # The Todo model for the Backbone client:

    class @Todo extends Backbone.Model

    # namespace JSON under ''todo'' see backbone_sync.js

    paramroot: ''todo''


    # Build the url, appending _id if it exists:

    url: ->

    u = "/api/todos"

    u += "/#{@get("_id")}" unless @isNew()

    return u


    # The default Backbone isNew function looks for ''id'',

    Mongoose returns "_id", so we need to update it accordingly:

    isNew: ->

    !@get("_id")",

    ```'
