- img_proc: true
  md: "# The CoffeeScript CLI\n\n-n, --nodes print the parse tree that Jison produces\n\
    --nodejs pass options through the \"node\" binary\n-v, --version display CoffeeScript\
    \ version\n-h, --help display this help message\n\nLet's take a look at some of\
    \ these options now.\n\n# The output Flag\n\nAlthough compiling the JavaScript\
    \ file in the same directory as the CoffeeScript is all right when you are just\
    \ playing around, chances are you probably want to keep the files in separate\
    \ directories. So how do we compile our hello_world.coffee file into, for instance,\
    \ public/javascripts?\n\nThe answer is simple: we need to add the -o to our terminal\
    \ command:\n\n```\n> coffee -o public/javascripts hello_world.coffee\n```\n\n\
    If you check your public/javascripts directory, you'll find your newly compiled\
    \ hello_world.js file waiting for you.\n\nOne thing that the -o flag does not\
    \ let you change the name of the file. The compiled JavaScript file will have\
    \ the same name as the original CoffeeScript file, except with the .js extension\
    \ instead of the .coffee extension. Because you cannot rename the file using the\
    \ coffee command, you'll either want to rename your original file or write a script\
    \ that does both the compilation of your CoffeeScript file and then renames them\
    \ to something more to your liking.\n\n# The bare Flag\n\nAs you'll see later\
    \ in the book, when CoffeeScript compiles, it wraps the generated JavaScript in\
    \ an anonymous function. Because we'll cover this topic in more detail in Chapter\
    \ 2, I won't go into it here. What follows is an example of anonymous function\
    \ being wrapped in the generated JavaScript code:\n\nExample: (source: hello_world.js)\n\
    \n```\n(function() {\n  var greeting;\n\n  greeting = \"Hello, World!\";\n\n \
    \ console.log(greeting);\n}).call(this);\n```"
