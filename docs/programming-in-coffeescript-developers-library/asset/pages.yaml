  md: '# # Cake and Cakefiles


    CoffeeScript offers a simple build tool, called Cake, that is very similar in
    nature to Ruby''s Rake tool. Cake enables you to define simple tasks to help with
    your CoffeeScript projects. Perhaps you need a task to run your tests or a task
    to build your files. Cake lets you define those tasks easily in a file called
    Cakefile.


    In this chapter you''ll learn how to define and execute Cake tasks, and of course,
    we''ll be doing all using CoffeeScript.


    > **Tip**

    "Wait a minute, how do we install Cake?" You don''t have to! When you installed
    CoffeeScript, the installer also installed Cake and its command-line tool, aptly
    named cake. You don''t have to do anything extra to get access to this tool.


    # ## Getting Started


    Before we write our first Cake task, it''s important that we understand a few
    things about how Cake works. The first thing we need to know about Cake is that
    all tasks must live in a file named Cakefile and that this file must live in the
    directory in which you want to run your Cake tasks. Typically, this is the root
    directory of your project.


    The only other thing you need to know about Cake and Cakefiles is that the Cakefile
    must be written in CoffeeScript. Cakefiles also have a few special functions already
    available to help you write your tasks. We''ll see those in action as we build
    some Cake tasks.'
