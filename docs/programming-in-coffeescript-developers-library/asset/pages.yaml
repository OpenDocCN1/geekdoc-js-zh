  md: '# Acknowledgments


    I hope that should ever write another book, Debra will be right there with me.
    I can''t imagine writing a book without her. Thank you, Debra.


    When writing a technical book, there are people who are very important to the
    process; they are the technical reviewers. A technical reviewer''s job is to read
    each chapter and critique from a technical standpoint, as well as answer the question,
    "Does it make sense to learn this here?" These reviewers are there to act as your
    audience. They are technically minded and know their subject. Therefore, the feedback
    that you get from them is incredibly important. On this book there have been a
    few technical reviewers. But the two I really want to call out are Stuart Garner
    and Dan Pickett. Stuart and Dan went away the call of this book and by no means
    telling me when I did or said something boneheaded. They received frantic phone
    calls and emails from me at all hours of the day and night and responding with
    feedback. If I didn''t want all those royalty checks to myself I might''ve been
    tempted to clean them. (Don''t worry, they got paid for their work.) They each
    received a coupon for one free hour of "Mark time." Thank Dan and Stuart, and
    the rest of the technical reviewers, for all of your hard work.


    There are people who contribute to this book in many different ways. Someone has
    to design the cover, index the book, write the language (CoffeeScript), or any
    of the countless jobs involved in something like this. Here is a list of some
    of those people (that I know about), in no particular order: Jeremy Ashkenas,
    Trevor Burnham, Dan Fishman, Chris Zahn, Greg Pollack, Gary Adair, Sandra Schroeder,
    Obie Fernandez, Kristy Hart, Andy Beaster, Barbara Hacha, Tim Wright, Debbie Williams,
    Brian France, Vanessa Evans, Dan Scherf, Gary Adair, Nonie Ratcliff, and Kim Boedheimer.


    I would also like to thank everyone I have seen since I first writing this book
    who have heard me blather on hours about it. I know it''s not interesting to most
    people, but damn, do I love to hear the sound of my voice. Thank you all for not
    punching me in the mouth, like I probably deserve.


    Finally, I would like to say thank you to the reader. Thank you for purchasing
    this book and helping to support people such as myself, at the end of the day,
    really just want to help out our fellow developers by sharing the knowledge we
    have with the rest of the world. It''s for you that I have put the countless hours
    of work and toil into this book. I hope that by the time you close the cover,
    you will have gained a better understanding of CoffeeScript and how it can impact
    your development.


    Good luck.'
