    If you navigate your browser to http://127.0.0.1:3000, you should see our creepy
    message being printed to the screen and then stopping after 30 seconds. If this
    was a nonstreaming application, we would be looking at a blank screen for 30 seconds
    wondering whether our application was working before we got hit a huge response
    all of a sudden.


    In our callback function we set up a setInterval loop to write our message to
    the response every 10 milliseconds. We wrote a setTimeout block out of our response
    after 30 seconds.


    All in all, it is pretty easy to set up a streaming server using Node. If you
    want to see something really cool, open up multiple browser windows and navigate
    to our server. You''ll see that Node easily serves up the streaming request to
    each of the browsers with no extra-special code handling.


    # Building a CoffeeScript Server


    Let''s build something that might be useful to us—an app server. Our spec for
    our server is going to be pretty simple. It''s going to look at the requests that
    come in and do one of three things. If the file requested is a JavaScript file,
    it is going to look in the src directory for the corresponding CoffeeScript file,
    compile that file into JavaScript, and return that. The requested file or path
    is not JavaScript, the server will find the corresponding file in the public directory
    and serve up that file. Finally, if there is no matching CoffeeScript in the src
    directory or no matching file in the public directory, the server should respond
    with a simple 404 page.


    We know what we want to build, but before we build, you should know that the code
    we will build in this section is going to get a big bit, and we''re going to iterate
    over it. Because of this, I am not going to show you the compiled JavaScript until
    we have finished writing our server. Trust me, you will thank me for it. Now,
    let''s get building.


    Thinking ahead, I know that this is going to be too much to do in a simple callback
    function. So let''s put it all into a class and go from there. We''ll write our
    callback function for our server as we''ve coded the class that''s going to do
    all the work, so we can get a feel for what we want class to look like.


    Example: (source: server.2/server.coffee)


    ```

    http = require(''http'')


    port = 3000

    ip = "127.0.0.1"

    ```'
