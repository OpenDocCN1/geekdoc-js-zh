  md: 'Output: (source: example4/Cakefile)


    Cakefile defines the following tasks:


    ```

    cake clean       # Clean up build directories

    cake build         # Build the project files

    cake package      # Clean, build, and package the project

    ```


    Now we can call the package task and see that both the clean and build tasks are
    also being executed:


    +   > cake package


    Output: (source: example4/Cakefile)

    cleaning up...

    building...

    packaging...


    > It''s important to note that when invoking other tasks, they will run asynchronously.
    In our example, there is no guarantee that the clean task will be finished before
    the build task is run. This could potentially cause issues, so be careful. The
    same is true of executing them by chaining them to a single cake command on the
    command line. Caveat emptor.


    # Wrapping Up


    In this chapter we dug through the build tool that ships with CoffeeScript, called
    Cake. You learned how to define new tasks and see what tasks are available. You
    saw how to execute tasks, give them options, and run multiple tasks at once. You
    might feel as though you didn''t really learn about writing useful Cake tasks.
    The reason is this is all Cake offers. It is up to you to fill those tasks with
    what you need. The Node.js project, which I talk about in Chapter 9, "Intro to
    Node.js," is a great place to start when looking for useful modules you can use
    to read and write files and directories, compile CoffeeScript files, make HTTP
    requests, and more. Other chapters will include Cakefiles to do things such as
    run tests, but be on the lookout for those examples.


    Although Cake is a good tool, and it''s nice to have it automatically installed
    with CoffeeScript, I find it a bit too weak with many awkward idiosyncrasies for
    it to be useful for most tasks I want to write. When combined with modules from
    Node and other available modules, it can be quite powerful, but I still find myself
    falling back to my Ruby roots and using Rake because it''s much more polished
    than Cake.'
