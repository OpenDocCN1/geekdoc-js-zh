  md: '# # Preface


    I started my professional development career in 1999, when I first was paid a
    salary to be a developer. (I don''t count the few years before that when I was
    just having fun playing around on the Web.) In 1999 the Web was a scary place.
    HTML files were loaded without font and tags. CSS was just coming onto the scene.
    JavaScript was only a few years old, and a battlefield of various implementations
    existed across the major browsers. Sure, you could write some JavaScript to do
    something in one browser, but would it work in another browser? Probably not.
    Because of that, JavaScript got a bad name in the early 2000s.


    In the middle of the 2000s two important things happened that helped improve JavaScript
    in the eyes of web developers. The first was AJAX. AJAX enabled developers to
    make web pages more interactive, and faster, by making calls to the server in
    the background without end users refreshing their browsers.


    The second was the popularity of JavaScript libraries, such as Prototype, that
    made writing cross-browser JavaScript much simpler. You could use AJAX to make
    your applications more responsive and easier to use and a library like Prototype
    to make sure it worked across major browsers.


    In 2010, and certainly in 2011, the Web started evolving into "single page" applications.
    These applications were driven by the use of JavaScript frameworks, such as Backbone.js.
    These frameworks allowed the use of an MVC design pattern using JavaScript. Whole
    applications would be built in JavaScript and then downloaded and executed in
    the end user''s browser. This is all made for incredibly responsive and client-side
    applications.


    On the developer''s side, however, things weren''t all easy. Although the frameworks
    and tools made these sorts of applications easier, JavaScript itself proved to
    be the pain point. JavaScript is at times both an incredibly powerful language
    and an incredibly frustrating one. It is full of paradoxes and design traps that
    can quickly make your code unmanageable and bug ridden.


    So what were developers to do? They wanted to build these great new applications,
    but the only universally accepted browser language is JavaScript. They could certainly
    write these applications in Flash, but that would require plug-ins, and it won''t
    work on some platforms, such as iOS devices.


    I first discovered CoffeeScript in October 2010. CoffeeScript promised to help
    JavaScript and expose the best parts of the quirky language that is JavaScript.
    It presented a cleaner syntax, like foregoing punctuation in favor of significant
    whitespace and protection from those design traps that awaited JavaScript developers
    at every turn, such as scouring and misery of the comparison operators. Best of
    all, it did all while compiling to standard JavaScript that could be executed
    in any browser or other JavaScript runtime environment.


    When I first used CoffeeScript, the language was still very rough around the edges,
    at version 0.9.4. I used it on a project for a client to try it out whether it
    was worth the'
