  md: "Tip\n running a Cake task with options, it is important to note that all options\
    \ must be placed before the name of the task. If the options are placed after\
    \ the task, you will be greeted with a rather unfamiliar error. To me this seems\
    \ backward. I would prefer cake greet -n Mark, but, unfortunately, at the time\
    \ of writing that's not possible.\n\n# Invoking Other Tasks\n\nThere will come\
    \ a time when you want to execute other tasks from inside another task. Here's\
    \ an example: Two common tasks you might have in a project would be a task to\
    \ clean up your build directories and another task to compile and build your project.\
    \ Let's write these two tasks:\n\nExample: (source: example3/Cakefile)\n\n```\n\
    task\"clean\", \"Clean up build directories\", ->\nconsole.log(\"cleaning up...\"\
    )\n\ntask\"build\", \"Build the project files\", ->\nconsole.log(\"building...\"\
    )\n```\n\nExample: (source: example3/Cakefile.js)\n\n```\nfunction() {\n\task\"\
    clean\", \"Clean up build directories\", function() {\n\treturn console.log(\"\
    cleaning up...\")\n}\n\ntask\"build\", \"Build the project files\", function()\
    \ {\n\treturn console.log(\"building...\")\n}\n}.call(this);\n```\n\nOutput: (source:\
    \ example3/Cakefile)\nCakefile defines the following tasks:\n\ncake clean | #\
    \ Clean up build directories\ncake build | # Build the project files\n\nAfter\
    \ using these tasks for a while, you realize that you are always running the clean\
    \ task and then the build task. You can run both tasks with one command, like\
    \ this:\n> cake clean build"
