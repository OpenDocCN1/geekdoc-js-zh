    \ method gets a little more confusing because we want to be able to handle HTML\
    \ files as well as a few file types. First, we have to use a regular expression\
    \ to get the extension of the path being requested. We then use a switch statement,\
    \ shown in Chapter 3, to map the extensions to the appropriate file type.\n\n\
    > Tip\nI want to point out this in juncture, in case it's not clear, that this\
    \ is not meant for production applications, but merely for educational purposes.\
    \ There are a lot of holes in it and things I kind of just swept aside, as proper\
    \ error handling and detection of content types. Please don't send messy letters\
    \ after this failing for you in production.\n\nThat leaves us with implementing\
    \ the pathname function. Strangely, this is probably the most complex function\
    \ in this example because we have three cases to deal with. The first case is\
    \ handling fully formed paths, such as index.html or '/images/foo.png'. These\
    \ paths are fine and should remain unchanged\n\nThe second case is that of paths\
    \ without extensions, such as users/1. We want to add a default extension, .html,\
    \ to each of them. These paths will be transformed into index.html and users/1.html.\n\
    \nThe last case is the default path of /. This path to be transformed into index.html\
    \ so we can find it in the public directory.\n\nYou should note that I am caching\
    \ the results of all this into a variable, _pathname, so that I need to do this\
    \ work only once, the first time the function is called."
