  md: 'We first looked at arrays and what makes them tick in CoffeeScript. We looked
    at a few tricks CoffeeScript makes possible when dealing with arrays: testing
    to see if a value is in an array, swapping assignment of variables, and, finally,
    capturing the elements of an array easily into variables.


    Next we looked at ranges. We saw how to construct arrays of numbers using the
    range syntax. We also looked at how ranges can be used to manipulate existing
    arrays by grabbing sections of the array and replacing sections of an array with
    other values.


    After ranges, we moved on to objects in CoffeeScript. We looked at the different
    rules around constructing objects. We looked at how to set and get attributes
    on the objects we create. Using a modified object syntax, we saw how we could
    pull out deeply nested attributes in an object and assign them to variables.


    Next came iterations. We looked at how to iterate over the elements of an array
    and how to iterate over the key/value pairs of an object. We looked at the by
    and when keywords to help us write cleaner loops. Then we examined how while and
    until loops worked and how they differ from each other.


    We looked at the comprehensions syntax for helping us write single line loops
    and code blocks.

    Finally, we looked at how the do keyword can help us keep track of the scope of
    our variables while doing things such as looping through a collection.


    With collections now behind us, we can next look at a different type of collection,
    the class.


    # Notes


