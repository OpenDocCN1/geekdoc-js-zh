  md: '# Chapter 12 Example: Todo List Part 3 (Client-side w/ Backbone.js)


    potentially override the rich chocolaty goodness that Backbone is trying to create
    for you. If you need to have things happen when the is instantiated, the initialize
    function is definitely the way to go.


    As it happens, we have a few things to do when the TodoListView class is instantiated.
    In particular, we have a few things to do with the @@collection object. Your first
    question should be, Where did that variable come from? Backbone has a few "magic"
    variables and attributes like @collection and @model are two of them. In a minute
    we will see that we create an instance of the TodoListView class, we are going
    to pass it an object that contains a collection key that has a value of new Todos().
    Then will get assigned to @collection object, in the TodoListView, giving us access
    to the Todos collection. When we look at the necessary changes to the application.coffee
    file, this will all become a bit clearer.


    What do we need to do with the @collection object, also known as a Todos collection?
    First, we are going to call the bind function and tell it whenever the collection
    triggers a reset event, we want to call the render function in the TodoListView
    instance we have.


    How does a collection object trigger a reset event? One of the ways, and probably
    the most common in Backbone, is through the fetch function. When called, the fetch
    function will get the full list of todos from the API, as we saw earlier. Because
    we need todos, we will call the fetch as the last line of the initialize function.
    The calling of the fetch function in, trigger a reset event, which will then call
    the render function.


    The render function is where we will print out the list of todos to the collection
    to the page. The render function shouldn''t look too different from the original
    code we had in application.coffee to render each todo on the screen. The big differences
    are that we are calling the foreach function directly on the collection object,
    instead of a success callback. The other difference is that we no longer have
    to refer to the @todos element directly; instead, we can use @el which will point
    for us. Using @el instead of the name of the element directly is great we should
    ever have to refactor our code. We change the value of @el and don''t have to
    change the rest of the code base.


    > Tip The render function is declared using the => syntax of the -> so that when
    it is called after the reset event has been triggered, the render function knows
    its context and has access to the rest of the class. If a -> was used, this code
    would result in an error similar to TypeError: ''undefined'' is not an object
    (evaluating ''this.collection'') because render would not have access to @collection
    object. If we really wanted to use the -> syntax, we would have to manually bound
    the function ourselves in the initialize function by using the bindAll function
    in the Underscore library. _.bindAll(@, render). I would rather use the => syntax.


    All that is left now to clean up the application.coffee file to use the new TodoListView
    class instead of our old code:'
