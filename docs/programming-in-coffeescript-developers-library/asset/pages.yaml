    Let''s move on to the next step, setting up a database.


    # Setting Up MongoDB Using Mongoose


    We need to be able to persist our todos for our application somewhere, and where
    we are going to use MongoDB.⁶ Mongoose, also known simply as Mongoose, is a popular
    NoSQL document store. It''s similar to a relational database in that you can store
    and retrieve data, but it''s more fluid in that it doesn''t require a traditional
    schema, meaning we can just start using without writing a bunch of table creation
    scripts. That makes it a great choice for us because we don''t have to jump through
    a loop of hoops building tables and the like. We can simply start throwing todos
    into the store.


    I''m going to make the assumption that you have MongoDB installed. If you don''t,
    feel free to go⁷ do that and come back when you''re done.


    So what do we need to do to get Mongo up and running with our application? First,
    we need to install Mongoose,⁸ a popular object relational mapping (ORM) framework
    for Node that works with Mongo. Mongoose is conveniently available as an NPM:


    ```

    > mongoose@2.4.7 /node_modules/mongoose

    --- hooks@0.1.9

    --- colors@0.5.1

    --- mongodb@0.9.7-2

    ```


    > Tip

    Technically, Mongoose isn''t an ORM, because MongoDB isn''t a relational database
    but rather a document store. However, the term ORM has become a bit overloaded
    these days to include tools such as Mongoose, I''m going to run with it.


    With Mongoose installed, we need to set it up for the application. This is incredibly
    easy to do. First create a file, src/models/database.coffee. The src/models directory
    is where we will put all the code that deals with our database.'
