  md: "# Scope and Variables\n\nIn this section we talk about how scope and variables\
    \ work and are defined in CoffeeScript. In JavaScript can be a tricky subject,\
    \ often the source of confusion and bugs. In this section we see how CoffeeScript\
    \ tries to make bugs related to scope a thing of the past.\n\n# Variable Scope\
    \ in JavaScript\n\nWhen declaring variables in JavaScript, a lot of people, both\
    \ experienced and beginner, do not realize that there are two ways to declare\
    \ variables. If they know the ways to declare variables, they may not know the\
    \ difference between the two. Because of that, let's take a brief look second\
    \ to the two ways and understand, at least on a basic level, what they do.\n\n\
    Look at the following code snippet:\n\n```\njs_variable_scope.js\na = 'A';\nmyFunc\
    \ = function() {\n a = 'AAA';\n var b = 'B';\n}\n```\n\nIf we were to run that\
    \ code in a browser or another JavaScript engine, we would get the following:\n\
    \nOutput:\n\n+   > console.log(a)\nA\n> myFunc();\n> console.log(a)\nAAA\n> console.log(b)\n\
    ReferenceError: b is not defined\n\nChances you were probably expecting that when\
    \ trying to reference variable b it would raise an error. However, you were probably\
    \ not expecting variable a to return the value defined in the myFunc function,\
    \ were you? So why is that?\n\nThe answer is simple and goes to the heart of the\
    \ difference between the way those two variables defined.\n\nWhen we defined variable\
    \ without using the var keyword, we were telling JavaScript to create that variable\
    \ in the global namespace. Because a variable called a already existed in the"
