  md: 'Preface xiii


    In Chapter 10, “Example: Todo List Part 1 (Server-side),” we will be building
    the server-side part of a todo list application. Building on Chapter 9, we will
    build an API using the Express.js web framework and the Mongoose ORM for MongoDB.


    In Chapter 11, “Example: Todo List Part 2 (Client-side w/ jQuery),” we will build
    a client for the todo list API we built in Chapter 10 using the popular jQuery
    library.


    Finally, in Chapter 12, “Example: Todo List Part 3 (Client-side w/ Backbone.js),”
    we will rebuild the client for the todo list application, this time forsaking
    jQuery in favor of the client-side framework, Backbone.js.


    # Installing CoffeeScript


    I am not a big fan of having installation instructions in books, mostly because
    by the time the book hits the shelf, the installation instructions are out of
    date. However, people—and by people, I mean those who publish books—believe there
    should be an installation section for books. This is mine.


    Installing CoffeeScript is pretty easy. The easiest way to install it is to go
    http://www.coffeescript.org and look at the installation instructions there.


    I believe the maintainers of projects like CoffeeScript and Node are the best
    to keep the installation instructions up to date for their projects, and their
    websites are a great place to find those instructions.


    At the time of writing, CoffeeScript was at version: 1.2.0. All examples in this
    book should be on that version.


    # How to Run the Examples


    You will be able to find and download all the original source code for this book
    at https:// github.com/markbates/Programming-In-CoffeeScript. As you''ll see,
    all the examples tell you which example file to look to. The example files will
    be in a folder relevant to their respective chapter.


    Unless otherwise indicated, you should be able to run the examples in your terminal,
    like so: coffee example.coffee


    So now that you know how to run the examples in this book, as soon as you have
    CoffeeScript installed, why don''t you meet me at Chapter 1 and we can get started?
    See you there.'
