  md: '# NAPERVILLE PUBLIC LIBRARY

    Use CoffeeScript to Write

    avaScript Code Than

    fore!


    # Programming in CoffeeScript


    If you can do it in JavaScript, you can do better in CoffeeScript. And, since
    CoffeeScript "compiles down" to JavaScript, your code will fit neatly into virtually
    any web environment. In Programming in CoffeeScript, Mark Bates shows developers
    why CoffeeScript is so useful and how it avoids the problems that often make JavaScript
    code buggy or unmanageable. It guides you through every feature and technique
    you need to write quality CoffeeScript code and shows how to take advantage of
    CoffeeScript and introduces syntax, control structures, functions, and collections.
    Through same page code comparisons, you''ll discover exactly how CoffeeScript
    improves JavaScript. Next, you''ll put it to work in building applications that
    are powerful, flexible, maintainable, concise, reliable, and secure. Bates shares
    valuable tips for better development, illuminating CoffeeScript''s hidden gems
    and warning you about its remaining "rough edges." The book concludes with a start-to-finish
    case study showing how to code back-ends and front-ends and integrate powerful
    frameworks and libraries. Coverage includes


    +   * Understanding the right to compile and execute CoffeeScript

    * Using CoffeeScript''s clean syntax to focus on your code, not JavaScript''s
    distractions

    * Working with CoffeeScript''s control structures, functions, and arguments

    * Taking full advantage of CoffeeScript''s implementation of collections and iterators

    * Leveraging CoffeeScript''s full class support to create complex data models


    +   * Automating common application development tasks with Cake and Cakefiles

    * Configuring Jasmine with CoffeeScript support, and using it to systematically
    test your code

    * Writing Node.js server-side applications in CoffeeScript

    * Using CoffeeScript to write jQuery and Backbone applications

    * Integrating framework code to avoid "reinventing the wheel"


    Want a better way to create your JavaScript code for web applications? CoffeeScript
    is the solution—and this book will help you master it!


    > Mark Bates is founder and chief architect of the Boston-based development and
    consulting company, Meta4 Labs. He has developed web applications since 1996.
    Since discovering CoffeeScript, he has become a leader in its programming community,
    presenting to user groups and speaking at high conferences around the world, such
    as RubyConf, RailsConf, and jQueryConf. He is the author of Distributed Programming
    with Ruby.


    Programming/Scripting Languages


    www.markbates.com


