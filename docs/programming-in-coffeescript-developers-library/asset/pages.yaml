  md: "# Comprehensions\n\nIn a lot of our iterating examples, we've had very simple\
    \ code blocks we wanted to execute, like this one:\n\nExample: (source: iterating_arrays.coffee)\n\
    \n```\nmyLetters = [\"a\", \"b\", \"c\", \"d\"]\n\nfor letter in myLetters\n \
    \ console.log letter.toUpperCase()\n```\n\nBecause we are using a single line\
    \ code block with our loop, we are able to take advantage of CoffeeScript calls\
    \ comprehensions. Comprehensions are, essentially, loops and their code blocks\
    \ on one line.\n\nHere's what that same example would look like using comprehensions:\n\
    \nExample: (source: iterating_arrays_comprehension.coffee)\n\n```\nmyLetters =\
    \ [\"a\", \"b\", \"c\", \"d\"]\n\nconsole.log letter.toUpperCase() for letter\
    \ in myLetters\n```\n\nExample: (source: iterating_arrays_comprehension.js)\n\n\
    ```\nfunction() {\n  var letter, myLetters, _i, _len;\n\n  myLetters = [\"a\"\
    , \"b\", \"c\", \"d\\];\n\n  for (_i = 0, _len = myLetters.length; _i < _len;\
    \ _i++) {\n    letter = myLetters[_i];\n    console.log(letter.toUpperCase());\n\
    \  }\n}.call(this);\n```\n\nOutput: (source: iterating_arrays_comprehension.coffee)\n\
    \nA\nB\nC\nD"
  merge: -1
  pgno: 141
- img_proc: true
  md: "As you can see, we took the code block off of its own line and placed it before\
    \ the for loop on\nthe same line.\n\nWe can also use comprehensions to help capture\
    \ the results of a for loop. Using our same\nample let's capture the results of\
    \ the uppercased letters into a new array:\n\nExample: (source: iterating_arrays_comprehension_capture.coffee)\n\
    \n```\nmyLetters = [\"a\", \"b\", \"c\", \"d\"]\n```\n\n```\nupLetters = (letter.toUpperCase()\
    \ for letter in myLetters)\n```\n\n```\nconsole.log upLetters\n```\n\nExample:\
    \ (source: iterating_arrays_comprehension_capture.js)\n\n```\n(function() {\n\
    \  var letter, myLetters, upLetters;\n\nmyLetters = [\"a\", \"b\", \"c\", \"d\"\
    ];\n\n  upLetters = (function() {\n    var _i = 0, _len, _results;\n    _results\
    \ = [];\n    for (_i = 0, _len = myLetters.length; _i < _len; _i++) {\n      letter\
    \ = myLetters[_i];\n      _results.push(letter.toUpperCase());\n    }\n    return\
    \ _results;\n  });\n\n  console.log(upLetters);\nn).call(this);\n```\n\nOutput:\
    \ (source: iterating_arrays_comprehension_capture.coffee)\n\n```\n[ 'A', 'B',\
    \ 'C', 'D' ]\n```\n\nBy wrapping our comprehension statement in parentheses, we\
    \ can capture the results of the\niteration into another variable. It should be\
    \ noted that we can also capture the results of a for\nloop even if you are using\
    \ the multiline version:"
