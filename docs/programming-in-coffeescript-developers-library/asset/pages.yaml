  md: "# Testing with Jasmine\n\nTo me there is no greater sin than writing code that\
    \ doesn't have tests. It is my belief that testing is not an option. Testing is\
    \ required. I feel so strongly in that that I practice what is known as TDD, or\
    \ test-driven development, is a philosophy of writing code that states you should\
    \ always write your tests first and your code last. By practicing TDD you can\
    \ sleep well at night, knowing that your code is well tested and that should anything\
    \ crop up, you can quickly and easily fix it with the comfort and knowledge that\
    \ you haven't broken anything else.\n\nThe art of TDD is daunting; a lot of people\
    \ don't know where to begin. If you need some guidance on how to become a test-driven\
    \ developer, I might recommend a little blog post written by yours truly, titled\
    \ \"How to Become a Test-driven Developer.\" \n\nIn this chapter I want to take\
    \ a quick look at what I consider to be one of the best testing tools out there\
    \ for testing JavaScript applications—Jasmine.\n\n+   Tip\nJasmine isn't the only\
    \ testing tool for JavaScript; in fact, there are quite a few. I think Jasmine\
    \ is one of the novices around because it emulates my favorite Ruby testing framework,\
    \ RSpec. Other JavaScript testing frameworks to check out QUnit, JsTestDriver,\
    \ and YUI Test.\n\nI won't be covering Jasmine in great detail here. You can find\
    \ a number of great articles and videos on the Internet covering Jasmine in more\
    \ detail. Instead, I want to show you how to use Jasmine with CoffeeScript and\
    \ to give you a feel for what it can do."
