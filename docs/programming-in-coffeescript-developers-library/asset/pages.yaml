    (function() {\n  var myArray,\n  indexOf = Array.prototype.indexOf || function(item)\
    \ { for (var i = 0, l = \n  this.length; i < l; i++) { if (i in this && this[i]\
    \ === item) return i; }\n  return -1;\n});\n\nmyArray = [\"a\", \"b\", \"c\"];\n\
    \nif (_indexOf.call(myArray, \"b\") >= 0) console.log(\"I found 'b'.\")\n\nif\
