  md: "# Defining Functions\n\nWhen defining functions on our classes we follow the\
    \ same rules, and syntax, that we would if we were defining a function on a simple\
    \ object—because that is exactly what we are doing.\n\nExample: (source: simple_class_with_function.coffee)\n\
    \n```\nclass Employee {\n  dob: (year = 1976, month = 7, day = 24)->n    new Date(year,\
    \ month, day)\n}\n\nempl = new Employee()\nconsole.log(empl.dob)\nemp2 = new Employee()\n\
    console.log(emp2.dob(1979, 3, 28))\n```\n\nExample: (source: simple_class_with_function.js)\n\
    \n```\nfunction() {\n  var Employee, empl, emp2;\n\n  Employee = (function() {\n\
    \    function Employee() {\n      Employee.prototype.dob = function(year, month,\
    \ day) {\n        if (year == null) year = 1976;\n        if (month == null) month\
    \ = 7;\n        if (day == null) day = 24;\n        return new Date(year, month,\
    \ day);\n      }\n    return Employee;\n  });\n\n  empl = new Employee();\n  console.log(empl.dob());\n\
    \n  emp2 = new Employee();\n  console.log(emp2.dob(1979, 3, 28));\n}\\call(this);\n\
    ```"
