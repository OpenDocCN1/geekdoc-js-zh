  md: '# Chapter 10 Example: Todo List Part 1 (Server-side)


    > Tip

    We could have just written out the require statements for each file, because there
    are only a few of them, but I like to create an array and loop through it to build
    the require statements. It''s cleaner, and to add another require just means typing
    a few characters into our array instead of copying and pasting a line of code.


    With the classes required, we can pull out the original callback functions we
    had mapped for all the actions and replace them with a new instance of the appropriate
    class and the respond function for that.


    Now our todos_controller.coffee file is much cleaner, and we have extracted all
    the common functionality for all our actions. This should mean that if we want
    to change the way we handle errors, or add other common functionality, we can
    do it all in one file.


    # Wrapping Up


    In this chapter we built the server-side portion of an application to manage todos.
    We set up an Express application, added MongoDB support using Mongoose, and refactored
    all into a nice clean backend.


    In the next chapter we will take what we''ve built here and put a sexy¹⁴ front
    end on it. We''re going to play with jQuery to enable us to interact with our
    beautiful server-side code.


