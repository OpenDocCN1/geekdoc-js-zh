  md: '# Wrapping Up


    In this chapter we ripped out the jQuery we wrote in Chapter 11, “Example: Todo
    List Part 2 (Client-side w/ jQuery),” and replaced it with the Backbone.js framework.
    This seems like a great place to remind you that you should download the code
    from this chapter, as well as the code from Chapter 11 to see how they compare,
    you can find all the code from this book on Github.com.⁹


    We learned about Backbone''s models and collections. Then we learned how to use
    views and events to manage the elements on our page and how they interact with
    each other.


    This chapter just scratches the surface of Backbone.js has to offer in terms of
    writing highly responsive, well-organized front ends for your applications. I
    encourage you to seek out some of the great tutorials, blog posts, and screencasts
    on Backbone to learn more about it.


