  md: "# Listing Todos Using a View\n\nThe previous code we wrote, but it can definitely\
    \ be made a lot cleaner and more flexible. That's where Backbone.View classes\
    \ come in. Let's replace what we've already written with a Backbone.View class\
    \ to clean it up.\n\nFirst create a views folder under the assets folder. That\
    \ is where all the view files will live. In that file, let's create todo_list_view.coffee\
    \ and fill it with the following:\n\nExample: (source: app/4/assets/views/todo_list_view.coffee)\n\
    \n```\n# The 'main' Backbone view of the application\nclass #TodoListView extends\
    \ Backbone.View\n\nel: '#todos'\n\ninitialize: =>\n  @template = _.template(Templates.list_item_template)\n\
    \  @collection.bind(\"reset\", render)\n  @collection.fetch()\n\nrender: =>\n\
    \  @collection.each((el, el) =>\n    $(el).append(\"<li>#\" + @template(el.toJSON())\
    \ + \"</li>\")\n```\n\nSo what is going on with this code? Great question. The\
    \ first thing we do is create a new class, TodoListView, and have it extend Backbone.View.\
    \ By extending the Backbone.View class we get access to some helpful functions\
    \ and features that we'll be using throughout the rest of this chapter.\n\n> Notice\
    \ that, like the Todo and Todos classes, we are defining the TodoListView class\
    \ with a prefixed symbol. This will make sure the classes are available outside\
    \ of the automatic wrapper function CoffeeScript wraps around .coffee file. If\
    \ we didn't, we wouldn't have access to these classes outside of their respective\
    \ .coffee files.\n\nNext, we tell the view that the element on the page we want\
    \ to associate this view with is the #todos element. We do this by setting the\
    \ el attribute. If we didn't, Backbone would be creating a new div object for\
    \ the el attribute, and you would be responsible for placing that element on the\
    \ page yourself. We will see this in action in a little bit.\n\nWe move on next\
    \ to the initialize function. The initialize function is a special function that\
    \ will be called by Backbone after an instance of the view object has been initialized.\
    \ You definitely do not want to write a constructor function in your view classes.\
    \ This can"
