  md: "# In-Browser Compilation\n\nWhen developing web applications, a time will come\
    \ when you want to write some CoffeeScript directly inline in your HTML² file.\
    \ CoffeeScript allows you to do this, and I will show you how. However, I want\
    \ to caution you against doing such a thing. First, there is a very good reason\
    \ why practices such as Untrusive JavaScript³ have become popular recently. Although\
    \ being able to execute CoffeeScript in the browser is nifty, it really is not\
    \ the best compilation option available to you. By keeping your JavaScript in\
    \ separate files and out of the HTML layer, you are able to keep your code cleaner\
    \ and deg more gracefully in environments that don't support JavaScript.\n\nAt\
    \ first, Untrusive JavaScript can be a bit confusing and difficult, but after\
    \ a while it becomes easier to write, more readable, and more logical to do so.\
    \ Using tools like jQuery, you can wait for the page to load and attach all the\
    \ appropriate JavaScript to the correct objects on the page. However, sometimes\
    \ you have to prime the pump, so to speak. This usually means calling an init\
    \ method, perhaps passing in JSON⁴ to do so. I would encourage you to write this\
    \ tiny amount of code using JavaScript. However, you should really want to write\
    \ it in CoffeeScript, there is a way to let the browser compile it for.\n\nLet's\
    \ take a look at an HTML file with a bit of CoffeeScript embedded in it.\n\nExample:\
    \ (source: hello_world.html)\n\n```\n<html>\n<head>\n  <title>Hello World</title>\n\
    \  <script src='http://jashenas.github.com/coffee-script/extras/coffee-script.js'\
    \ type='text/javascript'></script>\n</head>\n<body>\n  <script type='text/coffeescript'\
    \ name = prompt \"What is your name?\"\n    alert \"Hello, #{name}\")\n  </script>\n\
    </body>\n</html>\n```\n\nBecause browsers, at least at the time of this writing,\
    \ don't contain native support for CoffeeScript compilation, you will need to\
    \ include a compiler in your page to use. Frankly, the CoffeeScript team has one\
    \ ready and waiting. To include it in your HTML file, add the following line to\
    \ the head of your HTML file:\n\n```\n<script src='http://jashenas.github.com/coffee-script/extras/coffee-script.js'\
    \ type='text/javascript'></script>\n```\n\nYou can of, pull down the contents\
    \ of the coffee-script.js file and store it locally in your project, should you\
    \ wish."
  merge: -1
