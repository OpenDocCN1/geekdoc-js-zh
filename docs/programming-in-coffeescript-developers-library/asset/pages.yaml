  md: "# Chapter 12 Example: Todo List Part 3 (Client-side w/ Backbone.js)\n\n```\n\
    render: =>\n  collection.forEach(todo =>\n    $(el).append(`<li>${template(todo.toJSON())}</li>`)\n\
    \nrenderAdded: (todo) =>\n  $(`#new-todo`).after(`<li>${template(todo.toJSON())}</li>`)\n\
    ```\n\nIn the initialize function of the TodoListView class we added two lines.\
    \ The first new line adds another listener for the event on the @collection object,\
    \ this telling it to trigger the renderAdded function in the TodoListView class.\n\
    \nThe second line we added in the initialize function of the TodoListView class\
    \ creates a new instance of the NewTodoView and passes it the @collection object.\n\
    \nThe renderAdded function in the TodoListView class will be called when a new\
    \ todo is added to the @collection object, being the newly minted todo. With that\
    \ new todo in hand, we can easily add it to the list of todos displayed on the\
    \ page.\n\n> We could have written this code so that the render did did all the\
    \ heavy lifting, and we wouldn't have needed a renderAdded function. There are\
    \ a few reasons why I didn't do that. First, if we rerender the whole list of\
    \ todos, that's a lot more time consuming than adding one more todo to the page.\
    \ Second, we would have had to write a bit more logic in the render function to\
    \ first clear the list of todos already on the page, so we don't end up with duplicates.\n\
    \n# A View per Todo\n\nOur application has come a long way since we threw out\
    \ the jQuery code we wrote in Chapter 11, \"Example: Todo List Part 2 (Client-side\
    \ w/ jQuery),\" but we're not there yet. We can create new todos and display them,\
    \ along with todos on the page, but we can't edit or delete existing todos. Before\
    \ we get to, we need to do a little bit of clean up the code we have already written.\
    \ We are going to need a view to manage each of the todos on the page so we can\
    \ watch them for changes, as someone editing the title, marking it as \"complete,\"\
    \ or wanting to delete the todo.\n\nFor right now, let's update our code to use\
    \ a new view, TodoListItemView, for each of the todos on the page. So let's create\
    \ that class:\n\n```\n// Example: (source: app.6/assets/views/todo_list_item_view.coffee)\n\
    # The view for each todo in the list:\nclass @TodoListItemView extends Backbone.View\n\
    \nttagName: 'li'\n```"
