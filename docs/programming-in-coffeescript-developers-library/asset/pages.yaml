    optional -w parameter to the coffee command. compiled. With this parameter you
    can tell the coffee command to keep watching your CoffeeScript files and if they
    change to recompile them. Here is an example:


    ```

    > coffee -w -c app/assets/coffeescript

    ```


    With this command, anytime a .coffee file is touched⁵ in the app/assets/coffeescript
    directory, or any subdirectories, it is automatically compiled.


    As of CoffeeScript 1.2.0, the -w will watch for new files that have been added
    to a watched directory. In my experience, however it can be quite buggy of some
    underlying Node issues. Hopefully, these issues will be worked out by the time
    you read this. However, plenty of third-party tools exist that are designed to
    listen to system events, as files being added and removed. My personal favorite,
    as the time of writing, is Guard⁶ It is a Ruby gem that lets you listen for these
    types of events and execute some custom code, as compiling CoffeeScript files,
    when these events occur.


    > Tip

    in addition to Guard, you might also want to check out Jitter⁷ by Trevor Burham.
    It accomplishes a similar goal of watching and compiling all your CoffeeScript
    files. It is also written using CoffeeScript, so that''s not a bad thing.


    # Executing CoffeeScript Files


    We''ve covered various ways to compile CoffeeScript and have discussed some of
    the options we can pass in the coffee command when compiling CoffeeScript, but
    what about just executing the CoffeeScript file in question? Perhaps you are writing
    a web server using CoffeeScript or even a simple script that does some basic number
    crunching. You could compile your scripts using the tools you''ve already learned
    about, then link them in an HTML file, and finally, run them in a browser. That
    would work for a simple script, but not for something more complex like a web
    server. Nor is it a practical idea.


    To help with this situation, the coffee command lets us execute our CoffeeScript
    files like this:


    ```

    > coffee hello_world.coffee

    ```


    Most of the examples that we look throughout this book can be run in just this
    fashion (unless otherwise noted).


    # Other Options


    There are a few other options such as -n and -t. Although these options can give
    you really interesting output and insight into how CoffeeScript compiles your
    code, they won''t really be of helping us during the course of this book so I
    won''t be covering them here. I do, however, encourage you to take some time to
    run the extra options to see what they produce. You can find out more about these
    options by reading the annotated source⁸ for CoffeeScript online.'
