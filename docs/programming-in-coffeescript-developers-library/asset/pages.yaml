  md: '# Intro to Node.js


    Over the past year or so, a platform written by Joyent^1 has been taking the web
    development world by storm. This platform is called Node.js,2 commonly referred
    to as Node (and will be from here on).


    > > Tip\If you don''t believe Node is taking the web development world by storm,
    just ask companies like LinkedIn,3 who announced in 2011 that it had rewritten
    its API from Ruby on Rails^4 to Node. That''s a pretty big endorsement.


    So what is Node exactly, and why are we talking about it in a CoffeeScript book?
    In this chapter, you''ll find out.


    # What Is Node.js?


    Node is an implementation of server-side JavaScript that sits atop Google''s V8^5
    JavaScript engine. Node is part framework, runtime, and language. Because of that,
    people are sometimes confused about what exactly Node is and when and why they
    should use it.


    Node''s main goal in life is to help developers write evented, asynchronous applications.
    In Node every request is handled asynchronously, and almost all I/O is nonblocking.
    Because of this, Node application is very efficient in terms of memory and can
    handle very large numbers of "concurrent" connections.


    There are three reasons why we are covering Node.js in a book CoffeeScript. First,
    because Node applications are written using JavaScript, we can write those same
    applications using CoffeeScript instead and enjoy all that CoffeeScript has to
    offer. Second, the coffee command we''ve been using throughout this book uses
    Node under the covers for some of its magic, so CoffeeScript and Node already
    enjoy a kinship. Third Node ships with a package management system, NPM.^6 NPM
    lets developers package up and distribute bundles of code that can later be imported
    into other Node applications. These NPM modules are incredibly helpful even when'
