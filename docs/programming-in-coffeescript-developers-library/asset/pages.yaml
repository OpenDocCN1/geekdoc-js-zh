  md: "global namespace, clobbered our original variable and replaced it with the\
    \ new one we defined inside of myFunc. Oops.\n\nThe variable b was defined inside\
    \ the myFunc function using the keyword var, which told JavaScript to create a\
    \ variable named b and scope it inside the function myFunc. Because the variable\
    \ b is scoped inside the function when we tried to access the variable outside\
    \ of the function, we got an error because JavaScript couldn't find a variable\
    \ named b defined in the global namespace.\n\n> Tip\nThe example shown in the\
    \ section \"Variable Scope in JavaScript\" demonstrates why you should always\
    \ use the keyword var when defining variables. This is definitely a best practice,\
    \ and CoffeeScript wants to help make sure you always do that.\n\n# Variable Scope\
    \ in CoffeeScript\n\nNow that we understand a little something about variable\
    \ scoping works in JavaScript, let's take a quick look at our example again, this\
    \ time written in CoffeeScript:\n\nExample: (source: coffeescript_variable_scope.coffee)\n\
    \n```\na = 'A'\nmyFunc = ->\n  a = 'AAA'\nb = 'B'\n```\n\nExample: (source: coffeescript_variable_scope.js)\n\
    \n```\n(function() {\n  var a, myFunc;\n\n  a = 'A';\n\n  myFunc = function()\
    \ {\n    var b;\n    a = 'AAA';\n    return b = 'B';\n  }\n}).call(this);\n```\n\
    \nIgnoring for a moment the anonymous wrapper function around our code (we will\
    \ be talking about that shortly), let's look at the way CoffeeScript has declared\
    \ our variables. Notice that"
