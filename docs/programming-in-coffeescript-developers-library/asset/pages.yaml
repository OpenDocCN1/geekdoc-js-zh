  md: 'are already in the database when we load the page. Right now, if you were to
    add few todos using our application and you reloaded the page, those todos would
    seem to have disappeared. In reality, they are safe and sound in our database,
    but because we haven''t written any code to fetch them from our API and then we
    don''t see them. Fortunately, this is a relatively simple piece of code.


    Example: (source: app.5/assets/jquery/retrieve_existing_todos.coffee)


    ```

    $ $ ->

    request = $.(''/api/todos'')

    request.done (todos) ->

    for todo in todos.reverse()

    TodoApp.appendTodo(todo)

    ```


    First we need to wait until the page has been fully loaded before we retrieve
    the todos from the API. We create a new request that points to our API for retrieving
    the todos, and add a callback that will be executed when the response comes back
    with our todos. In callback we are reversing the order of the todos and passing
    them individually into the appendTodo function we wrote. Why are we reversing
    the order of the todos? The answer is as simple as it is: Todos are actually coming
    back from the server in the order, however the way appendTodo function is to append
    each todo to the top of the list, which would place the todos in the wrong order
    on the page. We could change the way the API works, but it''s behaving correctly;
    it''s our client that isn''t. We could write another function that places them
    in the right order, or add some conditional in the appendTodo function, but at
    the end of the day this is probably the cleanest solution, and the least likely
    to cause issues.


    If we reload our application now we should see all the existing todos that we
    created in the database.


