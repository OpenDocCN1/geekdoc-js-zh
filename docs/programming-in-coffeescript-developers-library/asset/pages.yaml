    ```


    As you can see, the REPL can be a fun way to to play around and experiment with
    different ideas. However, not everything is roses in the land of the CoffeeScript
    REPL. CoffeeScript, as you''ll see, is designed around the concept of whitespace
    being significant. That leaves us with a bit of problem when trying to write multiline
    CoffeeScript in the REPL. The answer comes to us in the form of the \ character.


    Let''s try to write a simple function, that takes two numbers and returns the
    sum of those numbers. Enter the following code into the REPL line by line:


    Example: (source: repl2.coffee)


    ```

    add = (x, y)->\

    x + y

    console.log add(1, 2)

    ```


    Output: (source: repl2.coffee)


    3


    Notice how at the end of the first line we added a \. That tells the REPL that
    we want to add more lines to that expression. It''s important that you keep adding
    the \ for every line you want to add to the expression. The first line that doesn''t
    end with \ will be considered the end of the expression, and the REPL will attempt
    to execute that expression.


    It is also important to notice that we still had to indent the line after the
    \ so that CoffeeScript was able to properly interpret the line and put it into
    its proper place.


    Finally, to quit the REPL, simply press ctrl-C and the process will end.


    The REPL is a powerful and quick way to try out a few ideas, but we''ve seen it
    get a bit hard to use when dealing with more complex code. Later in this chapter,
    in the section “Executing CoffeeScript Files,” we''ll discuss how to execute files
    containing CoffeeScript, which is a more appropriate way of running complex code.'
