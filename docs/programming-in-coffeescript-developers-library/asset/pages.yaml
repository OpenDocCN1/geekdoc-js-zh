  md: '# Installing Jasmine


    Typically, you may remember from the beginning of this book, I don''t like to
    cover installation of tools in a book. The reason is pretty obvious—the instructions
    tend to be out of date by the time I finish typing, alone by the time the book
    goes to print. The same is true here.


    With out of that, I will point out what I consider to be the best way to install
    and set up Jasmine with CoffeeScript support. That would be to use the jasmine-headless-webkit?
    Ruby gem. This is a Ruby gem it requires Ruby to be installed. It also features
    a few other dependencies. The link in the footnote has detailed instructions on
    how to get it set up.


    There are ways of setting up Jasmine that aren''t tricky. However, they don''t
    have native CoffeeScript support and require all sorts of precompilation of both
    your source files and tests, and let''s be honest, who wants to deal with all
    of that?


    If you don''t want to use Jasmine-headless-webkit and instead use another version
    of Jasmine, that''s fine. For this chapter we will be using jasmine-headless-webkit,
    so I would recommend using that if you plan to follow along.


    # Setting Up Jasmine


    I''m going to assume that you have installed Jasmine and are ready to go so. So
    let''s get started.


    In this chapter we are going to build a simple calculator project. It will do
    the basic stuff that calculators do: add, subtract, multiply, and divide. Create
    a new folder for the project. Inside the project folder run the following command
    to set up Jasmine:


    > jasmine init


    When you do that, Jasmine should create a bunch of new files and folders in the
    project directory that look something like this:


    ```

    public/

    javascript/

    Player.js

    Song.js

    Rakefile

    spec/

    javascript/

    helpers/

    SpecHelper.js

    PlayerSpec.js

    support/

    jasmine.yml

    jasmine_config.rb

    jasmine_runner.rb

    ```'
