  md: '# Chapter 4 Functions and Arguments


    > Tip

    Although you can write function definitions on one line, I prefer not to. Personally,
    I don''t find it much cleaner or easier to read. Also, by keeping the body of
    the function on a separate line, you make it easier to later augment your function
    with more code.

    You should also notice that the last line of each function contains a return keyword.
    CoffeeScript adds this automatically for you. Whatever the last line of your function
    is, that will be the function''s return value. This is similar to languages such
    as Ruby. Because CoffeeScript will automatically add the return for you in the
    compiled JavaScript, the use of the return keyword in your CoffeeScript is optional.


    > Tip

    I find that adding the return keyword can sometimes help make the meaning of your
    code a bit clearer. Use it where you find it will help make your code easier to
    read and understand.


    > Tip

    If you want your functions to not return the last line of the function, you''ll
    have to explicitly give it a new line to return. Something like return null or
    return undefined will do the trick nicely.


    # Arguments


    Just like JavaScript, functions in CoffeeScript can also take arguments. Arguments
    let us pass objects into the function so that the function can then perform calculations,
    data manipulation, or whatever our little hearts desire.


    In CoffeeScript, defining a function that takes arguments is not much different
    than in JavaScript. Inside our parentheses we define a comma-separated list of
    the names of the arguments we want the function to accept.


    Example: (source: function_with_args.coffee)


    ```

    calculateTotal = (sub_total, rate) ->

    tax = sub_total * rate

    sub_total + tax

    console.log calculateTotal(100, 0.0625)

    ```'
