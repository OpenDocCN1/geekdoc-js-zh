    So how did we create these class-level functions? By prepending the function name
    with @ we are telling CoffeeScript that we want function to be at the class level.
    In the JavaScript world this works when we replace @ with this. the this context
    is that of the Employee class, not an instance of that class.


    > Tip

    i routinely create class definitions that are nothing but a bunch of class-level
    methods. This is great for building utility packages and to make sure that I have
    nicely scoped functions. And, if I ever want to, or need to, I can inherit from
    these classes and override certain functions for a particular need.


    The use of super is limited, however, when dealing with class-level functions
    and attributes. You can use super when you want to call the original function
    that you have overridden in the subclass. However, and this is big, if the function
    you are calling using super tries to make reference to any class-level attributes,
    you''ll get a big fat error.


