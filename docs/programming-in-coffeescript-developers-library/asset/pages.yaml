  md: '# Chapter 10 Example: Todo List Part 1 (Server-side)


    a query as we go and executing that query, or we can do what we have here, which
    is in a few empty arguments before we pass in the argument containing the details
    of the store. The first object would represent any clauses you would want to put
    on the query. In our case, we don''t want to limit our results using a specific
    query. The second array is where you would specify any fields you want to retrieve.
    We want all the fields, so we''ll leave this blank.


    > Tip

    Why the nested arrays when defining the sort in our find call? That is actually
    a MongoDB-ish at work. If we wanted to sort by multiple fields, we would do something
    like this: ["created_at", -1], ["updated_at", 1]]. The inner arrays are a group
    representing each sort we want to add. The first element of the array is the attribute,
    and the second is the direction, -1 for descending and 1 for ascending. in my
    opinion it could have been done a little nicer and cleaner, but it is what it
    is.


    As I already mentioned, the callback function we pass into the find function will
    get executed regardless whether the query was successful. This means that we must
    do our error handling.


    The callback function will be called with two arguments. The first argument will
    be an Error object, if there is an error, or null if there was no error. The second
    argument will represent the result of the query, in this case an array of todo
    objects. If the query fails and there is an error, the second will be null.


    Inside our callback function we should first check to see if there was an error.
    We can do so using the existential operator that CoffeeScript provides, aka ?.
    Using the existential operator, we are checking to see if the err object is undefined
    or null. If there was an error, we call the json function, passing the error and
    the status code of 500. We will let our front end respond appropriately to the
    error that occurred.


    If there is no error, we can pass the list of todos we received from our query,
    @todos, into the json function, and Express will take care of the rest.


    > You might have noticed that we are using => when defining our callback function.
    We are doing that because we need to make sure that we have access to the req
    and res objects. All Mongoose calls are asynchronous, which means the program
    could have moved on execution before the callback function gets called, and it
    may no longer have access to the scope with the req and res objects.


    # Creating New Todos


    Moving on, let''s flesh out the creating of a new todo.'
