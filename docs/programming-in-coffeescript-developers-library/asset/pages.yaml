- img_proc: true
  md: "That will run both tasks for you. But what if you want to have a third task,\
    \ package, that will package up your project for you? Before you neatly package\
    \ up your project, you want to make sure you build it—and before you build it,\
    \ you want to make sure that the build directories are clean. You could do it\
    \ like this:\n\n+   > clean build package\n\nThe problem with this approach is\
    \ error prone. What if you forget to call the build or clean tasks first? What\
    \ happens? Fortunately, Cake lets invoke other tasks from inside a task. To do\
    \ that, we can call the invoke function that Cake provides for us and give it\
    \ the name of the task we want to call:\n\n```\nExample: (source: example4/Cakefile)\n\
    task\"clean\", \"Clean up build directories\", ->\nconsole.log(\"cleaning up...\"\
    )\n\ntask\"build\", \"Build the project files\", ->\nconsole.log(\"building...\"\
    )\n\ntask\"package\", \"Clean, build, and package the project\", ->\ninvoke(\"\
    clean\")\ninvoke(\"build\")\nconsole.log(\"packaging...\")\n```\n\n```\nExample:\
    \ (source: example4/Cakefile.js)\nfunction() {\n\ntask(\"clean\", \"Clean up build\
    \ directories\", function() {\n\treturn console.log(\"cleaning up...\")\n});\n\
    \nntask(\"build\", \"Build the project files\", function() {\n\treturn console.log(\"\
    building...\")\n});\n\nntask(\"package\", \"Clean, build, and package the project\"\
    , function() {\n\tinvoke(\"clean\")\n\tinvoke(\"build\")\n\treturn console.log(\"\
    packaging...\")\n});\n\n}).call(this);\n```"
