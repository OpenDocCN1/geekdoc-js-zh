  md: '# Collections and Iterations


    Collections form an important part of almost any object-oriented programming language.
    They let us store multiple values either in a list, such as an array, or using
    a key/value pair, like objects in JavaScript. With objects we can represent an
    item, such as a book, and give it values as a title, author, and publication date.
    Using an array we can then store a list of the book we create.


    Along with collections come iterators. Iterators let us our stored values, such
    as that list of books, and loop through them one at a time, allowing us to print
    each one to the screen, update some information on each book, or whatever our
    application needs to do.


    In the first half of this chapter we learn about arrays and objects in CoffeeScript.
    We''ll see how they map to their JavaScript counterparts. Because this is CoffeeScript,
    we''ll also look at some of the fun little hidden gems that are available to us
    with arrays and objects.


    The second half of this chapter will focus on iterators. We''ll take what we''ve
    learned about collections and learn how to loop through them and manipulate them.


    # Arrays


    Without getting all geeky about how arrays are implemented in memory and such,
    let''s agree that, for the premise of this book, arrays are simple data structures
    designed to store data in a sequential list. New items, unless otherwise stated,
    are added to the last slot in that list. In CoffeeScript, arrays don''t look any
    different from JavaScript. Arrays in CoffeeScript use a zero index and are constructed
    in the same way as their JavaScript counterparts.'
