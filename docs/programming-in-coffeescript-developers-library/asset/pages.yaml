  md: "At the bottom of the output we can see the list of available options for the\
    \ tasks.\n\n> > Tip\nI want to point out what I feel is a shortcoming of Cake\
    \ options. Options are not defined for a specific task; instead, they are available\
    \ for all tasks. If, in addition to our greet task, we were to have a second task,\
    \ both tasks would accept the name option we defined. Although this isn't the\
    \ end of the world, it means that some care needs to be taken when naming the\
    \ options and providing their descriptions.\n\nWhen we look at our greet task\
    \ again, we can see that we are passing an object, options, into the function\
    \ that will be executed when the task is executed:\n\n```\nExample: (source: example2/Cakefile)\n\
    option '-n', '--name [NAME]', 'name you want to greet'\ntask \"greet\", \"Say\
    \ hi to someone\", (options)->n  message = \"Hello, \"\n if options.name?\n  \
    \  message += options.name\n else\n    message += \"World\"\n  console.log message\n\
    ```\n\n```\nExample: (source: example2/Cakefile.js)\nfunction() {\n  option('-n',\
    \ '--name [NAME]', 'name you want to greet');\ntask(\"greet\", \"Say hi to someone\"\
    , function(options) {\n  var message;\n  message = \"Hello, \"\n  if (options.name\
    \ != null) {\n    message += options.name;\n  } else {\n    message += \"World\"\
    ;\n  }\n  return console.log(message);\n}).call(this);\n```\n\nWith the options\
    \ object, we can determine if someone has called the task with the name option.\
    \ If the task is run with the name option, we will greet that name; if not, we\
    \ will use a generic greeting."
