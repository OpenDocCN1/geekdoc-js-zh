  md: "# Querying with Mongoose\n\n```\n# Get a specific todo:\napp.get '/api/todos/:id',\
    \ (req, res) ->\nTodo.findById req.param('id'), (err, @todo) =>\nif err ?\n  res.json(err,\
    \ 500)\nelse\n  res.json @todo\n```\n\n```\n# Update a specific todo:\napp.put\
    \ '/api/todos/:id', (req, res) ->\nTodo.findById req.param('id'), (err, @todo)\
    \ =>\nif err ?\n  res.json(err, 500)\nelse\n  @todo.set(req.param('todo'))\n \
    \ @todo.save(err) =>\n    if err ?\n      res.json(err, 500)\n    else\n     \
    \ res.json @todo\n```\n\n```\n# Destroy a specific todo:\napp.delete '/api/todos/:id',\
    \ (req, res) ->\nTodo.findById req.param('id'), (err, @todo) =>\nif err ?\n  res.json(err,\
    \ 500)\nelse\n  @todo.remove()\nres.json @todo\n```\n\nThe first thing we need\
    \ to do with each of these actions is to find the :id keyword we're looking for\
    \ using the id parameter in the paths. We can do this in Mongoose by using the\
    \ findById class-level function and passing the id parameter.\n\nThe findById\
    \ function takes a callback which receives two arguments. As always, the first\
    \ argument is an error if one exists, and the second argument is the todo if one\
    \ was found.\n\nWhat do we do with our found todo depends on which of the three\
    \ actions we are looking at. For the action where we just want to show the todo,\
    \ all we have to do is return the JSON of the todo.\n\nFor the action where we\
    \ want to update the action, we can use the set function, passing it any attributes\
    \ we want to update. This is not too dissimilar from when we created a new todo\
    \ earlier."
