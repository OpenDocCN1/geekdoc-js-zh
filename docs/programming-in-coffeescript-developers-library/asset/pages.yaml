  md: "# 6\n\n# Classes\n\nClasses are essentially a blueprint for creating new instances\
    \ of an object with predefined functions and variables. These instances can then\
    \ store state related to that individual instance. Over the years, JavaScript\
    \ has constantly come under attack for its lack of any real support for classes.\n\
    \nIn Chapter 5, “Collections and Iterations,” we looked at objects in JavaScript.\
    \ In each example we rolled a brand new object and gave that new object a set\
    \ of functions and values. This works great for the occasional simple object,\
    \ but what if we wanted to have a more complex data model? More importantly, what\
    \ if we wanted to have more than one of those complex data models? Where that\
    \ classes come in.\n\nFortunately, CoffeeScript steps up to the plate with full\
    \ class support. So if JavaScript does not have any real support for classes,\
    \ how does CoffeeScript solve the problem? The short answer is through the use\
    \ of some clever scoping and the use of functions and objects. The long answer\
    \ is, read the rest of this chapter.\n\n# Defining Classes\n\nDefining classes\
    \ in CoffeeScript can be as simple and as straightforward as one line:\n\nExample:\
    \ (source: simple_class1.coffee)\n\n```\nclass Employee\n```\n\nExample: (source:\
    \ simple_class1.js)\n\n```\nfunction() {\n  var Employee;\n\nEmployee = (function()\
    \ {\n```"
