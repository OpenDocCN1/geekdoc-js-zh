  md: '```

    require("{_dirname}/src/controllers/home_controller")


    # Start server:

    app.listen(3000)

    console.log("Express server listening on port %d in %s mode", app.address().port,
    app.settings.env);

    ```


    So what is going on? Let''s take a quick look. First we require the express module.
    Then we call the createFunction. It will do what its name suggests. We then assign
    newly created server to two variables: a local variable, app, and a global variable,
    also called app.


    > Tip

    In Node, the global object references the global scope of the application, similar
    to the window object in a browser. By setting objects on the global object, we
    are able to reference them everywhere in our application.


    Next we need to configure Express. We are going to do that in a separate file,
    src/configuration.coffee


    ```

    Example: (source: app.1/src/configuration.js):

    # Configure Express ->

    app.use(express.bodyParser())

    app.use(express.methodOverride())

    app.use(express.cookieParser())

    app.use(express.session(secret: ''d19e1fd62f62a21eccf7d7bde4344ad''))

    app.use(app.router)

    app.use(express.static(__dirname + ''../public''))

    app.use(express.errorHandler(dumpExceptions: true, showStack: true))

    ```


    We use our app to some pretty basic things, such as sessions, cookies, routing,
    error handling, and parsing of HTTP bodies. We also tell the app where it can
    find any static assets we might have, such as images and HTML files.


    > Tip

    In Node the _dirname variable will return the directory from which the calling
    file resides. This variable is great for building paths to other files.


    Next, we need to set up a route for handling our home page. We will do that in
    a file called src/controllers/home_controller.coffee. The home_controller.coffee
    file will get pulled into app.coffee using Node''s require function, which will
    let us other files into our application.'
