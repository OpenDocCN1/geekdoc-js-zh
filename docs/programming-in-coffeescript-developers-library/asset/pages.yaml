  md: "Let's go ahead and create a simple file called hello_world.coffee and make\
    \ it look like this:\ngreeting = \"Hello, World!\"\nconsole.log greeting\n\nNow\
    \ we can compile that file like so:\n> coffee -c hello_world.coffee\n\nThat should\
    \ compile our CoffeeScript file into a new JavaScript file in the same directory\
    \ called hello_world.js. The contents of hello_world.js should look like this:\n\
    \n```\n(function() {\n  var greeting;\n  greeting = \"Hello, World!\";n\n  console.log(greeting);\n\
    }).call(this);\n```\n\nOur hello_world.js JavaScript file is ready for production!\
    \ Time for a cup of tea.\n\n# The CoffeeScript CLI\n\nWe've played with the REPL\
    \ and have learned how to compile our CoffeeScript using the command line coffee\
    \ tool, but the coffee command offers few interesting options that we should quickly\
    \ look at. To see a full list of what the coffee command has to offer, enter the\
    \ following into your terminal:\n\n> coffee --help\n\nYou should see output similar\
    \ to the following:\nUsage: coffee [options] path/to/script.coffee\n\n```\n-c,\
    \ --compile compile to JavaScript and save as .js files\n-i, --interactive run\
    \ an interactive CoffeeScript REPL\n-o, --output set the directory for compiled\
    \ JavaScript\n-j, --join concatenate the scripts before compiling\n-w, --watch\
    \ watch scripts for changes, recompile\n-p, --print print the compiled JavaScript\
    \ to stdout\n-l, --lint pipe the compiled JavaScript through JavaScript Lint\n\
    -s, --stdio listen for and compile scripts over stdio\n-e, --eval compile a string\
    \ from the command line\n-r, --require require a library before executing your\
    \ script\n-b, --bare compile without the top-level function wrapper\n-t, --tokens\
    \ print the tokens that the lexer produces\n```"
  merge: -1
