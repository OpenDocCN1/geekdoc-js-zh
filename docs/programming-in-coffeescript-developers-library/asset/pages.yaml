  md: '# Acknowledgments¹


    I said it in my first book, and I''ll say it again here: Writing a book is incredibly
    hard work! Please make sure no one ever tells you differently. If they do, they
    are either an incredible liar or Stephen King. Fortunately for me I fell somewhere
    in the middle.


    Writing a book is simultaneously a very independent and solitary activity, as
    well as a team effort. After I put the kids to bed, I head down to my office,
    crack open a few Guiness (is the plural Guinese?), crank up the tunes, and send
    it out, by myself, into the wee hours of the morning. When I finish a chapter,
    I send it to my editor, who then sends it to a bunch of people who take what I
    have written and improve it in ways that I didn''t know possible. Whether it''s
    as simple as correcting grammar or spelling mistakes, to something more complex
    as helping to improve the flow of the book, or point out where example code could
    be improved to further clarify a point. So, while writing may be done alone in
    a dark room by yours the final product is the culmination of many people''s hard
    work.


    In this section of the book, I get the chance to thank you those who help shape,
    define, and otherwise ensure that the book you are currently holding (or downloading)
    is of the highest quality it can be. So without further adieu I''m going to thank
    people Academy Awards style, knowing that I''m sure I''ve left some off the list,
    for which I am incredibly sorry.


    First and foremost I have to thank my beautiful wife, Rachel. is one of the most
    supportive and strong people I have ever met. Each night I crawl into bed beside
    her and each morning I get the joy of waking up to her. I have the pleasure of
    seeing into her eyes and seeing unconditional love. I also get the encouragement
    to write books, my own business, and to do whatever it will make me happiest in
    life. She gave me two handsome sons and in return I gave her bad jokes and my
    used old cell phones. I clearly got the better end of the bargain in this marriage,
    and for that I am eternally grateful.


    Next, I would like to thank my sons, Dylan and Leo. While neither of them directly
    contributed to this book, they do make life worth living and give me an energy
    and excitement that only children can. I love you both so very much.


    Next I have to thank Debra Williams Cauley. Debra is my editor, handler, and psychiatrist
    with my first book, Distributed Programming with Ruby. I can only hope that other
    authors have the fortune to work with an editor as as Debra. She truly has the
    patience of a saint.


    > ¹ May at my publishing house thought that my acknowledgments section, as well
    as other parts of this book, were a bit risque, so the original has been edited
    down to what you see here here. I apologize if you are offended by anything I
    wrote, that was never my intention. Apparently, I''ve been told, my sense of humor
    is not appreciated by all. If you do like bad fart jokes, please follow me on
    Twitter @mkbates.'
