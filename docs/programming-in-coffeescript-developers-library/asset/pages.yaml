  md: "```\n}\n  return _results;\n};\n)).call(this);\n```\n\n# What Is CoffeeScript?\n\
    \nCoffeeScript is a language that compiles down to JavaScript. Not very informative,\
    \ I know, but it's what it does. CoffeeScript was developed to closely resemble\
    \ languages such as Ruby¹¹ and Python,¹² It was designed to help developers write\
    \ their JavaScript more efficiently. by removing unnecessary punctuation like\
    \ braces, semicolons, and so on, and by using significant whitespace to replace\
    \ those characters, you can quickly focus on the code at hand—and not on making\
    \ sure you have all your braces closed.\n\nChances are you would write the following\
    \ JavaScript like this:\n\nExample: (source: punctuation.js)\n\n```\n(function()\
    \ {\n  if (something === something_else) {\n    console.log('do something');\n\
    \  } else {\n    console.log('do something else');\n  }\n})).call(this);\n```\n\
    \nSo why not write it like this:\n\nExample: (source: punctuation.coffee)\n\n\
    ```\nif something is something else\n  console.log 'do something'\nelse\n  console.log\
    \ 'do something else'\n```\n\nCoffeeScript also gives you several shortcuts to\
    \ write rather complicated sections of JavaScript with just a short code snippet.\
    \ Take, for example, this code that lets you loop through the values in an array,\
    \ without worrying about their indices:"
  merge: -1
  pgno: 18
- img_proc: true
  md: "# Programming in CoffeeScript\n\n```\nExample: (source: array.coffee)\nfor\
    \ name in array\nconsole.log name\n```\n\n```\nExample: (source: array.js)\nfunction()\
    \ {\n  var name, _i, _len;\n\n  for (_i = 0, _len = array.length; _i < _len; _i++)\
    \ {\n    name = array[_];\n    console.log(name);\n  }\n}.call(this);\n```\n\n\
    In addition to the sugary sweet improvements CoffeeScript gives you too, it also\
    \ helps you write better JavaScript code by doing things such as helping you scope\
    \ your variables and classes appropriately, making sure you use the appropriate\
    \ comparison operators, and much more, as you'll see during the the course of\
    \ reading this book.\n\nCoffeeScript, Ruby, and Python often get mentioned together\
    \ in the same breath, but for good reason. CoffeeScript was directly modeled on\
    \ the terseness and the simple syntax that these languages have to offer. Because\
    \ of this, CoffeeScript has a much more modern \"feel\" than JavaScript does,\
    \ which was modeled on languages such as Java¹³ and C++¹⁴. Like JavaScript, CoffeeScript\
    \ can be used in any programming environment. Whether you are writing your application\
    \ using Ruby, Python, PHP,¹⁵ Java, or .Net,¹⁶ it doesn't matter. The compiled\
    \ CoffeeScript will work with them all.\n\nBecause CoffeeScript compiles down\
    \ to JavaScript, you can still use any and all of the JavaScript libraries you\
    \ currently use. You can use jQuery¹⁷ Zepto,¹⁸ Backbone,¹⁹ Jasmine²⁰ and the like,\
    \ and they'll all just work. You don't have to worry too often when talking about\
    \ new languages.\n\nThis all sounds great, I am hearing you, but what are the\
    \ downsides of using CoffeeScript over just plain JavaScript? This is a great\
    \ question. The answer is, not much. First, although CoffeeScript is a really\
    \ nice way to write your JavaScript, it does not let you do anything you couldn't\
    \ already do with JavaScript. I can still, for example, create a JavaScript version\
    \ of Ruby's famous method_missing.²²¹ The biggest downside would be that it's\
    \ another language for you or the members of your team to learn. Fortunately,\
    \ this is easily rectified—you'll see, CoffeeScript is incredibly easy to learn.\n\
    \nFinally, should CoffeeScript, whatever reason, not be right for you or your\
    \ project, you have nothing to lose by giving CoffeeScript a try in your next\
    \ project, or even in your current project (CoffeeScript and JavaScript play very\
    \ well with each other)."
  merge: -1
