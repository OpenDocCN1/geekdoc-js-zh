  md: "# Chapter 3 Control Structures\n\nThe more observant of you will have noticed\
    \ the break keyword in the compiled JavaScript output at the end of each of the\
    \ case statements. In JavaScript it is possible to let the switch statement keep\
    \ falling through and keeping more case statements. This is almost never wanted,\
    \ and is often the source of many bugs. The most common bug is that it matches\
    \ a case, executes the appropriate code, and ends up executing the default code\
    \ block at the bottom. The break keyword will tell the switch to stop executing\
    \ and stop trying to make other cases. This is another example of CoffeeScript\
    \ trying to cover your back and help you write code with fewer bugs.\n\nThe switch\
    \ statement also enables us to use a comma-separated list of values to match the\
    \ case keyword. This makes it possible for us to execute the case block for multiple\
    \ matches. Suppose we wanted a program that would check to see if today was a\
    \ weekend day. If it was indeed a weekend day, it would tell us to relax; otherwise,\
    \ it would tell us to work. We could do like this:\n\n```\nExample: (source: switch2.coffee)\n\
    today = \"Sunday\"\nswitch today\nwhen \"Saturday\", \"Sunday\"\nconsole.log \"\
    Enjoy your #{today}\"\nelse\nconsole.log \"Off to work you go. :(\"\n```\n\n```\n\
    Example: (source: switch2.js)\nfunction() {\n  var today = \"Sunday\";\n\n  switch\
    \ (today) {\n    case \"Saturday\":\n    case \"Sunday\":\n      console.log(\"\
    Enjoy your \" + today + \"!\");\n      break;\n    default:\n      console.log(\"\
    Off to work you go. :(\");\n  }\n}.call(this);\n```\n\nOutput: (source: switch2.coffee)\n\
    \nEnjoy your Sunday!"
