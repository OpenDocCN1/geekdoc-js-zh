    To do this we are going to use the connect-assets NPM module by Trevor Burnham.^3
    This will provide a couple of hooks which we automatically find our CSS and CoffeeScript
    files and add them into the HTML. In the case of CoffeeScript, it automatically
    converts them to JavaScript for, saving us a step of compiling the files manually
    ourselves.


    > **Tip**nFor those of you familiar with the asset-pipeline in Ruby on Rails,
    the connect-assets module attempts to mimic that in an Express application.


    For connect-assets to find our assets, we need to place them in a folder called
    assets at the root of our application. So let''s do that, and while we''re at
    it, let''s place a little bit of CSS in there to help pretty up the HTML we''re
