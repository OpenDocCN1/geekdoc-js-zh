  md: "Querying with Mongoose 227\n\n# # Finding All Todos\n\nLet's start with getting\
    \ all of the todos in the database:\n\nExample: (source: app.5/src/controllers/todos_controller.coffee)\n\
    \n```\n# This 'controller' will handle the server requests\n# for the Todo resource\n\
    ```\n\n```\n# Get a list of the todos:\napp.get('/api/todos', [], (req, res) ->\n\
    Todo.find({}), {sort: [\"created_at\", -1]]}, (err, @todos) =>\n  if err\n   \
    \ res.json(err, 500)\n  else\n    res.json @todos\n```\n\n```\n# Create a new\
    \ todo:\napp.post('/api/todos/', (req, res) ->\nres.json {}\",\n```\n\n```\n#\
    \ Get a specific todo:\napp.get('/api/todos/:id', (req, res) ->\nres.json {}\"\
    ,\n```\n\n```\n# Update a specific todo:\napp.put('/api/todos/:id', (req, res)\
    \ ->\nres.json {}\",\n```\n\n```\n# Destroy a specific todo:\napp.delete('/api/todos/:id',\
    \ (req, res) ->\nres.json {}\n```\n\nMongoose provides a bunch of helpful and\
    \ easy-to-use class-level functions for helping us find the exact records we want\
    \ in the database. In our case, we want all the records in the database.\n\n>\
    \ \nMongoose has some incredible documentation. I highly recommend that you check\
    \ out the Mongoose pages on finding documents¹² and on building complicated queries.¹³\n\
    \nTo find all records, we could simply call the find function and pass it to a\
    \ callback function that will be executed when the query returns or fails. For\
    \ our application, we would like to add a sort so that all todos come with the\
    \ latest todo first and the oldest last. To do that, we must first pass in an\
    \ object that contains the details of that sort. This is where it gets a little\
    \ tricky. We can do this one of two ways: we can either break this into several\
    \ lines, building up"
