  md: "# Chapter 7 Cake and Cakefiles\n\n```\nelse\nmessage += \"World\"\nconsole.log\
    \ message\n```\n\nExample: (source: example2/Cakefile.js)\n\n```\n(function()\
    \ {\n\n  option('-n', '--name [NAME]', 'name you want to greet');\n\n  task('greet',\
    \ \"Say hi to someone\", function(options) {\n    var message;\n    message =\
    \ \"Hello, \";\n    if (options.name != null) {\n      message += options.name;\n\
    \    } else\n      message += \"World\";\n    }\n    return console.log(message);\n\
    \  });\n}).call(this);\n```\n\nAs you can see, before our task definition we called\
    \ the option function and passed it three arguments. The first argument is -n,\
    \ the short form of the option. The second is --name, the long form of the option.\
    \ Notice that in the example, as part of the long form option, I have also put\
    \ [NAME], which tells Cake that you are expecting a value there. If you do not\
    \ put something like [NAME], Cake will raise an error if you try to pass in a\
    \ value with the option, the last argument being the description.\n\n> Tip\nAlthough\
    \ all three arguments are required for the option function, only the last two\
    \ arguments are truly necessary. You have to provide both the long form option\
    \ as well as the description, but the short form of the option is not required.\
    \ If you don't want to have a short form for the option, either pass in an empty\
    \ string or null as the first parameter.\n\nNow when we run the cake command to\
    \ see the list of available tasks, we should see this:\n\nOutput: (source: example2/Cakefile)\n\
    \nCakefile defines the following tasks:\n\n```\ncake greet      # Say hi to someone\n\
    \n-n, --name name you want to greet\n```"
