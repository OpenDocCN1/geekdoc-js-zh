  md: "# Creating Cake Tasks\n\nLet's build our first Cake task—a simple \"hello world\"\
    \ task:\n\n```\nExample: (source: example1/Cakefile)\ntask \"greet\", \"Say hi\
    \ to the nice people\", ->\nconsole.log \"Hello, World!\"\n```\n\n```\nExample:\
    \ (source: example1/Cakefile.js)\nfunction() {\ntask(\"greet\", \"Say hi to the\
    \ nice people\", function() {\n  return console.log(\"Hello, World!\");\n});\n\
    }.call(this);\n```\n\n> Tip Although you will never see the JavaScript that is\
    \ generated under the covers for Cakefiles, I decided to still include its output\
    \ in this chapter to better help you further grasp what CoffeeScript is doing.\n\
    \nTo define our Cake, we have to call the task function that gets automatically\
    \ added to every Cakefile. The first argument is the name of the task; this is\
    \ what we will use on the command line to execute the task. The second argument,\
    \ which is optional, is a description of the task. If supplied, the description\
    \ will appear when we print out a list of tasks that are available to us. The\
    \ last argument we pass into the task function is a function that will be executed\
    \ when we execute the task. This function is where the heavy lifting of our task\
    \ is done.\n\nTo print out which tasks are available, we can use the Cake command-line\
    \ tool:\n> cake\n\nIf we were to run against our Cakefile, we would get the following\
    \ output:\n\n```\nOutput: (source: example1/Cakefile)\nCakefile defines the following\
    \ tasks:\n```\n\n```\ncake greet      # Say hi to the nice people\n```\n\nAs you\
    \ can see in the output, we see the name of the task we defined, preceded by the\
    \ cake command, as well as the description we gave to the task."
