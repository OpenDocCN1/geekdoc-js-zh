  md: '# Chapter 6 Classes


    We could write a couple of class-level functions on the Employee class. Since
    we don''t have a full database at our disposal, we''ll just keep track of how
    many employees instances we create and report that number. To keep track of which
    employees we hire, we create a class-level called hire that will take the newly
    hired employees and add them to an array that will act as our impromptu database.
    We''ll also add a class-level function that will return the total number of employees
    we have in our faux database.


    Example: (source: class_level.coffee)


    ```

    constructor: ->

    Employee.hire(@)


    @hire(employee) ->

    @allEmployees |= []

    allEmployees.push employee


    @total: ->

    console.log("There are ${allEmployees.length} employees.")

    @allEmployees.length


    new Employee()

    new Employee()

    new Employee()

    nEmployee.total()

    ```


    Example: (source: class_level.js)


    ```

    function() {

    var Employee;


    Employee = (function() {


    function Employee() {

    Employee.hire(this);

    }


    Employee.hire = function(employee) {

    this.allEmployees ||= [];

    return this.allEmployees.push(employee);

    };


    Employee.total = function() {

    console.log("There are " + this.allEmployees.length + " employees.");})

    ```'
