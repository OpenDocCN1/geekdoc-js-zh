  md: '# Querying with Mongoose


    The complete function is where we are wrapping up all duplicated error handling
    and

    response logic we''ve been writing.


    With our super class written, let''s start writing our child classes that will
    handle each of the

    actions. Let''s start with the class to handle the action where we get all of
    the todos.


    Example: (source: app.8/src/controllers/responders/index_responder.coffee)


    ```

    require "${__dirname}/responder"


    class Responder.Index extends Responder


    respond: (@req, @res) =>

    Todo.find([], {sort: ["created_at", -1]]}, @complete)

    ```


    First, we need to require the Responder class we just wrote using the require
    function Node

    provides us.


    When we define our class we could assign it to the global object, like we did
    with Responder,

    but it''s good practice to use namespaces and not put everything directly on the
    global

    object, so that''s what we''ll do. We also need to make sure our Responder.Index
    class

    extends Responder using CoffeeScript''s extend keyword.


    > we want to namespace the classes we build better so that it is

    clear they are dealing with the Todo resource. If we have multiple resources,
    it could prove

    problematic or confusing.


    All that is left is to write a custom respond method. In that method we''ll have
    the query

    we saw earlier for finding all of the todos. The big difference, compared to what
    we had already

    written, is that for our callback function we will pass in a reference to the
    complete function

    we write in the Responder super class.


    Now let''s build a class to handle the new todos action.


    Example: (source: app.8/src/controllers/responders/create_responder.coffee)


    ```

    require "${__dirname}/responder"


    class Responder.Create extends Responder


    respond: (@req, @res) =>

    todo = new Todo(@req.param(''todo''))

    todo.save(@complete)

    ```'
