  md: "# Example: (source: app.8/src/controllers/responders/destroy_responder.coffee)\n\
    \nrequire \"${__dirname__}/show_responder\"\n\nclass Responder.Destroy extends\
    \ Responder.Show\n\n```\ncomplete: (err, result = {}) =>\nunless err?\n  result.remove()\n\
    super\n```\n\nAgain we are extending the Responder.Show class, and like the Responder.Update\
    \ class, we are going to write a new complete function.\n\nFirst, in the complete\
    \ function, we need to check for any errors that may have arisen trying to find\
    \ the todo. If there are no errors, we call the remove function on the todo, which\
    \ will destroy it in the database.\n\nFinally, we call the super function to handle\
    \ any errors and respond.\n\nAll that is left now to update our todos_controller.coffee\
    \ to use the new classes we have built:\n\n# Example: (source: app.8/src/controllers/todos_controller.coffee)\n\
    \n```\n# require all of our responders\nfor name in [\"index\", \"create\", \"\
    show\", \"update\", \"destroy\"]\n  require(\"${__dirname__}/responders/\\#{name}_responder\"\
    )\n```\n\n```\n# This 'controller' will handle the server requests\n# for the\
    \ Todo resource\n```\n\n```\n# Get a list of the todos:\napp.get '/api/todos',\
    \ new Responder.Index().respond\n```\n\n```\n# Create a new todo:\napp.post '/api/todos',\
    \ new Responder.Create().respond\n```\n\n```\n# Get a specific todo:\napp.get\
    \ '/api/todos/:id', new Responder.Show().respond\n```\n\n```\n# Update a specific\
    \ todo:\napp.put '/api/todos/:id', new Responder.Update().respond\n```\n\n```\n\
    # Destroy a specific todo:\napp.delete '/api/todos/:id', new Responder.Destroy().respond\n\
    ```\n\nAt the top of the file, we need to require all the classes we have built."
