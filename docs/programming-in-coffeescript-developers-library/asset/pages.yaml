  md: "# Chapter 6 Classes\n\ncase. It is common for the return to continue executing\
    \ after calling a function, even though the function has yet to return. If it\
    \ helps, think of this style of programming as “fire and forget;” program fires\
    \ off a call to a function and then forgets all about it. Let’s look at a quick\
    \ example of how an asynchronous program runs.\n\n```\nExample (source: fire_and_forget.coffee)\n\
    fire = (msg, wait)->n  setTimeout ->\n  console.log msg\n  wait\n```\n\n```\n\
    fire(\"Hello\", 3000)\nfire(\"World\", 1000)\n```\n\n```\nExample (source: fire_and_forget.js)\n\
    function() {\n  var fire;\n\n  fire = function(msg, wait) {\n    return setTimeout(function()\
    \ {\n      return console.log(msg);\n    }, wait);\n  }\n```\n\n```\nfire(\"Hello\"\
    , 3000);\nfire(\"World\", 1000);\n).call(this);\n```\n\nOutput: (source: fire_and_forget.coffee)\n\
    World\nHello\n\nAs you can see, our program first said “World” and then “Hello.”\
    \ In non-asynchronous programming we would have first seen the word “Hello” followed\
    \ a few seconds later by the “World.” Asynchronous programming can be incredibly\
    \ powerful but can also be a bit cumbersome and confusing. Let’s look at how things\
    \ start to get a bit muddled up.\n\nLet’s write a log method. This method will\
    \ log to the console that we are about to execute a callback function; then it\
    \ will execute the callback; and finally, it will log to the console that we have\
    \ executed the function."
