  md: '# Chapter 10 Example: Todo List Part 1 (Server-side)


    Example: (source: app.1/src/controllers/home_controller.coffee)

    # Set up a routing for our homepage:

    app.get(''/'', (req, res) ->

    res.send("Hello, World!")


    On our app object, which was assigned to the global scope of the application,
    to do that, we need to map a routing for when someone comes to the home page of
    our application. To do that, we can use the get function on the app object. There
    are functions that map to each of the four HTTP verbs, get, post, put, delete.
    Because we expect people to make a GET request when they hit the home page, that''s
    where we are going to map our route to/


    In addition to the URL we want to match /, the get function is also expecting
    a callback function that will be executed when that URL is requested. That callback
    function will be passed the request, req, and the response, res, for us to do
    with as we please. In this case, we want to send the string Hello, World! back
    on the response.


    With our default route in place for the home page, all that is left to do in app.coffee
    is to tell the server which port to bind to and to have it start the server we
    execute our app.coffee.


    Now let''s start ''er up!

    > coffee app.coffee


    Next, navigate to http://localhost:3000 and you should be greeted with the familiar
    greeting of "Hello, World!"


    Congratulations, you now have an Express application up and running!


    With our application now up and running, let''s add a proper template engine to
    so we don''t have to put all our HTML in the home_controller.coffee file. We can
    have it in one file to all. To do this we need to install the ej NPM module so
