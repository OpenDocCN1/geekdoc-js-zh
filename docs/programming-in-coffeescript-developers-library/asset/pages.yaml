  md: '# Part II


    # CoffeeScript in Practice


    In this half of the book, we''re going to take all that great CoffeeScript knowledge
    you''ve learned and put it into practical use. This will help reinforce what you''ve
    learned, and hope-fully you''ll pick up a few tips and tricks along the way. We''ll
    be doing using some of the more popular tools that are commonly used with CoffeeScript.


    We''ll build Cakefiles so we can run common tasks in our applications. We''ll
    see how easy it is to test our CoffeeScript using CoffeeScript with the Jasmine
    test framework. Then we''ll take a quick tour of Node.js and build a small application
    server to compile CoffeeScript as it''s requested.


    Finally, we''re going to build a full application, the canonical "todo" application.
    We''ll build the todo application over three chapters. First, we''ll build the
    backend application needed to serve our todos and persist them. Second, we''ll
    replace the front end of the application using the popular library jQuery. Third,
    we''ll replace our handcrafted jQuery¹ code with the Backbone js² framework. We''re
    going to use some fun libraries with this application: jQuery, Backbone.js, Mongoose³,
    Express⁴, and of course, CoffeeScript.


    As we look at these different technologies and build our application and examples,
    we''re not going to do a deep dive into these libraries. Instead, we''ll touch
    on the highlights and those parts that are necessary to the job at hand. So, with
    all that said, this is the fun part of the book! Let''s go!


