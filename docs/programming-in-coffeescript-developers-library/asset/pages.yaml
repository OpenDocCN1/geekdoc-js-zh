  md: "# Example: (source: string_interpolation_extra.coffee)\n\n```\ntext = \"Add\
    \ numbers: #{1 + 1}\"\nconsole.log text\n```\n\n```\ntext = \"Call a function:\
    \ #{escape \"Hello, World!\"}\"\nconsole.log text\n```\n\n```\nday = 'Sunday'\n\
