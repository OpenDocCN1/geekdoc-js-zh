  md: '# Part I: Core CoffeeScript


    The first part of this book is designed to cover the entire CoffeeScript language
    from top to bottom. By the end of this part of the book, you should be fully armed
    to attack any Coffee-Script project that comes your way, including those in the
    second part of this book.


    Chapter 1, "Getting Started," introduces the various ways CoffeeScript can be
    compiled and run. It also introduces the powerful coffee command-line utility
    and REPL that shift with CoffeeScript.


    In Chapter 2, "The Basics," we start to explore what makes CoffeeScript different
    from JavaScript. Talk of syntax, variables, scope, and more will lay a strong
    foundation for the rest of the book.


    Chapter 3, "Control Structures," focuses on an important part of any language,
    control structures such as if and else. You will also learn the differences between
    operators in CoffeeScript and those in JavaScript.


    Chapter 4, "Functions and Arguments," covers the ins and outs of functions in
    CoffeeScript. We''ll talk about defining functions, calling functions, and a few
    extras such as default arguments and splats.


    From arrays to objects, Chapter 5, "Collections and Iterations," shows you how
    to use, manipulate, and iterate over collection objects in CoffeeScript.


    Chapter 6, "Classes," ends the first part of the book by covering classes in CoffeeScript.
    Define new classes, extend existing classes, override functions in super classes,
    and more.


    # Part II: CoffeeScript in Practice


    The second part of this book focuses on using CoffeeScript in practical examples.
    Through learning about some the ecosystem that surrounds CoffeeScript, as well
    as building a full application, by the end of Part II your CoffeeScript skills
    will be well honed.


    Chapter 7, "Cake and Cakefiles," covers the Cake that ships with CoffeeScript.
    You can use this tool for building scripts, tests, and more. We''ll cover all
    that it has to offer.


    Testing is a very important part of software development, and Chapter 8, "Testing
    with Jasmine," gives a quick tour through one of the more popular CoffeeScript/JavaScript
    testing libraries, Jasmine. This chapter will exercise the popular of test-driven
    development by writing tests first for a calculator class.


    Chapter 9, "Intro to Node.js," is a quick introduction to the event-driven server-side
    framework, Node.js. In this chapter we will use CoffeeScript to build a simple
    HTTP server that will automatically compile CoffeeScript files into JavaScript
    files as they are requested by the web browser.'
