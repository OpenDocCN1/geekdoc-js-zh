  md: '# Chapter 3 Control Structures


    Great! Our examples didn''t blow up this time, but you should''ve noticed something
    very interesting. Did you see how our == and != examples converted when compiled
    in JavaScript? CoffeeScript compiled those examples into === and !== respectively.
    Why did CoffeeScript do that? Let''s look at what happens in JavaScript when you
    use == and !=:


    Example: (source: javascript_comparison.js)


    ```

    x = 1;

    y = ''1'';

    console.log(x == y); // true

    ```


    In the JavaScript example, 1 is equal to "1" despite the fact that they are different
    objects. The reason is that when using the == comparison operator in JavaScript
    it will automatically coerce the two objects to the same type of object and then
    do the comparison on it. The same holds true for the != operator. This is the
    source of many JavaScript bugs. To get a true comparison of two objects you must
    use the === operator.


    If we look at the same example again, only this time using the === operator, you
    see that we get false for our comparison instead of true:


    Example: (source: javascript_comparison2.js)


    ```

    x = 1;

    y = ''1'';

    console.log(x === y); // false

    ```


    To make sure you don''t run into these sorts of bugs, CoffeeScript automatically
    converts any == and != operators into === and !== for you. Isn''t that nice? CoffeeScript
    is helping you keep your bugs to a minimum. You should send it a thank you. There
    is another way to use the === and !== operators, which we will look at in a minute
    when we discuss aliases.


