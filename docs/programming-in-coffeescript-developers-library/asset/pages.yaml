  md: "# Updating Todos 25\n\nIf it already has it ignores the request. The same goes\
    \ for removing the class; if the element doesn't have the class in question applied\
    \ to it, then it fails silently—just the behavior we were looking for.\n\nAll\
    \ that is left to do is call the styleByState function in the few places we need\
    \ to make sure that we apply the correct styles. The first place we need to do\
    \ is in the appendTodo function. If an existing todo is passed into the appendTodo\
    \ function, we want to make sure it gets styled properly.\n\nExample: (source:\
    \ app.7/assets/jquery/todo_item.coffee)\n\n```\n@TodoApp || = {}\nTodoApp.appendTodo\
    \ = (todo) ->\nli = `<${${.template(Templates.list_item_template)}(todo)}</li>`\n\
    $('#new todo').after(li)\nTodoApp.watchChanges(li, todo)\nTodoApp.styleByState(li,\
    \ todo)\n```\n\nThe other place we need to make sure we update the classes associated\
    \ with the todo is when a todo is updated. We can do that by adding a callback\
    \ to the request object in the updateTodo function:\n\nExample: (source: app.7/assets/jquery/update_todo.coffee)\n\
    \n```\n@TodoApp || = {}\n```\n\n```\n# Update the todo:\nTodoApp.updateTodo =\
    \ (li, todo) ->\ntodo.title = `<${todo.title}>`, li.val()\nif !todo.title? or\
    \ todo.title.trim() is \"\"\n  alert \"Title can't be blank\"\nelse\n  if $('.todo_state',\
    \ li).attr('checked')\n    todo.state = 'completed'\n  else\n    todo.state =\
    \ 'pending'\n  request = $.post \"/api/todos/#{todo.id}\",\n    todo: todo,\n\
    \    method: 'put'\n  request.fail((response) => =\n    message = JSON.parse(response.responseText)\n\
    \    alert message\n  request.done(todo) ->\n    TodoApp.styleByState(li, todo)\n\
    ```"
