    # Writing the Todo API


    All that is left on the server side of our todo application is to write an API
    to access our todo resources from the client side code we''ll write in the next
    chapter. Let''s start by adding a file to handle all the requests we expect for
    our API:


    Example: (source: app.4/src/controllers/todos_controller.coffee)


    ```

    # This ''controller'' will handle the server requests

    # for the Todo resource


    # Get a list of the todos:

    app.get(''/api/todos'', (req, res) ->

    res.json([])


    # Create a new todo:

    app.post(''/api/todos'', (req, res) ->

    res.json({})


    # Get a specific todo:

    app.get(''/api/todos/:id'', (req, res) ->

    res.json({})


    # Update a specific todo:

    app.put(''/api/todos/:id'', (req, res) ->

    res.json({})


    # Destroy a specific todo:

    app.delete(''/api/todos/:id'', (req, res) ->

    res.json({})

    ```


    The first thing you should note is that for now, we have stubbed out all the responses
    to API by rendering empty JSON objects. We will add some substance to those responses
    in just a minute, but I would like to first talk a little about what we have so
    far and what it''s doing.

    Enter in this chapter I mentioned that Express provides a function to map requests
    using each of the four HTTP verbs: get, post, put, and delete. In the todos_controller.coffee
    file we are using all those functions so that our API conforms to the REST¹ approach.'
