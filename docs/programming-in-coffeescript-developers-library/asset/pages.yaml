    # Aliases


    In an effort to make your code a little more user friendly, CoffeeScript has added
    a few aliases for some of the more common operators. Some of these aliases make
    wonderful additions to the language, but others are a little confusing. Table
    3.1 shows the CoffeeScript aliases and their JavaScript counterparts.


    | CoffeeScript | JavaScript |

    | --- | --- |

    | is | == |

    | isnt | != |

    | not | ! |

    | and | && |

    | or | || |

    | true, yes, on | true |

    | false, no, off | false |

    | ø, this | this |

    | of | in |

    | in | N/A |'
