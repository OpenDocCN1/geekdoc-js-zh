    \ to help us perform tasks.\n\nIn this chapter we build a simple web server that\
    \ will serve static files out of a directory. It will also compile any CoffeeScript\
    \ assets in real-time and return the compiled JavaScript to the browser. Of course,\
    \ we are going to write this server using CoffeeScript.\n\n# # Installing Node\n\
    \nI think by now you probably know that I have a penchant for pushing you off\
    \ to a vendor's site for installation instructions. So, to learn how to install\
    \ Node on your platform of choice, I recommend that you check out Node's installation\
    \ page, http://nodejs.org/#download. I will let you in on a little secret, if\
    \ you've been following along with the code in this book and trying it out for\
    \ yourself; there a good chance you already have Node installed. Even if you do,\
    \ this is a great chance to upgrade to the latest and greatest version.\n\nWith\
    \ Node installed, let's give it a little spin. We can fire up a Node REPL like\
    \ so:\n\n```\n> node\n```\n\nThen, inside the Node REPL, we can execute any JavaScript\
    \ we'd like:\n\n```\n> 1 + 1\n```\n\nIn addition to the Node REPL we can also\
    \ execute JavaScript files, the same way we did CoffeeScript files. Take this\
    \ JavaScript file for example:\n\nExample: (source: example.js)\n\n```\n(function()\
    \ {\n  sayHi = function(name) {\n    if (name == null) name = 'World';\n    return\
    \ console.log(\"Hello, \" + name);\n  }\n\n  sayHi('Mark');\n}).call(this);\n\
    ```\n\nWe would run that file like this:\n\n```\n> node example.js\n```"
