    : Buffer.byteLength(data, \"utf-8\")\n);\nres.write(data, \"utf-8\");\nreturn\
    \ res.end();\n);\n```\n\n```\nserver.listen(port, ip);\n\nconsole.log(\"Server\
    \ running at http://\" + ip + \":\" + port + \"/\");\");\n\n).call(this);\n```\n\
    \nBefore I explain our little server, let's first fire up the server to see what\
    \ happens:\n> coffee server.1/server.coffee\n\nNow, if you navigate to http://127.0.0.1:3000\
    \ you should be greeted.\n\nSo, let's start with the obvious question: Why did\
    \ we run our file with the coffee command and not the node command we just learned?\
    \ The reason is that the node command does not know how to compile or execute\
    \ CoffeeScript. If we were to try run our CoffeeScript using the node command,\
    \ it would blow up in a most extraordinary fashion. Fortunately, the coffee command\
    \ sits on top of Node, so we can achieve the desired result that way.\n\n> Tip\n\
    If we really wanted to, we could precompile CoffeeScript file in JavaScript and\
    \ then execute using the node command, but go through that extra step when we\
    \ can use the coffee command?\n\nLet's dissect our server and find out what exactly\
    \ is making it tick.\n\nThe first thing we need to do is import the http Node\
    \ module. That will give us everything we need to receive and handle HTTP requests.\
    \ To do that we can use the require function that Node provides. Next, we create\
    \ some variables to represent the port and the IP address we want to bind our\
    \ server.\n\nThen we define the actual bulk of our server using the aptly named\
    \ createServer function in the http module. We pass the createServer function\
    \ a callback function that we pass in only resources when a request comes in;\
    \ the rest of the time the server sits idle and uses very little resources. Let's\
    \ skip over the callback function for just a minute and finish looking at the\
    \ rest of the file. All that is left to do is to tell the server which port and\
    \ IP address to listen on requests.\n\n![](img/0fbffc7214e7932d701570d7ebe5c3fe_221_0.png)"
