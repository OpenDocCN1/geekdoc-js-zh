    # Wrapping Up


    Well, wasn''t that fun? Classes in CoffeeScript are, for me at least, one of the
    biggest selling points of the language. I hope this chapter helped you sell them
    on.


    We covered a lot in this chapter. We looked at what a class is in CoffeeScript
    and how to define the most basic class possible.


    Next, we looked at the “special” constructor function and talked a lot about scope
    in our classes.


    We talked about how to extend classes in CoffeeScript using the extends keyword.
    We also learned how super can extend the original functionality of a super class''s
    function in a subclass.


    After that, we talked in depth about class-level functions and prototype functions.
    We also learned about the trouble super can cause at the class level if we''re
    not careful.


    We ended the chapter by looking at the rather complex, but insanely powerful,
    concept of bound functions using =>, also known as the fat arrow.


    At this point you have learned pretty much all there is to learn about CoffeeScript.
    Congratulations! You are ready to leave the template. This ends Part I of this
    book, “Core CoffeeScript.” Part II, “CoffeeScript in Practice,” will take all
    that we’ve learned from Part I and put it into practice using a few popular JavaScript
    libraries.


