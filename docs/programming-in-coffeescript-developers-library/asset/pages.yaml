  md: "# Swapping Assignment\n\nAt some point in your coding career, you will have\
    \ two or more variables that need their values swapped. This can be more cumbersome\
    \ in some languages than in others, but fortunately, CoffeeScript is not cumbersome.\n\
    \nLet's take a look at how this works by swapping the value of two variables:\n\
    \nExample: (source: swap_assignment.coffee)\n\n```\nx = \"x\"\ny = \"y\"\n\nconsole.log(\"\
    x is #{x}\")\nconsole.log(\"y is #{y}\")\n\n[x, y] = [y, x]\n\nconsole.log(\"\
    x is #{x}\")\nconsole.log(\"y is #{y}\")\n```\n\nExample: (source: swap_assignment.js)\n\
    \n```\nfunction() {\n  var x, y, _ref;\n\n  x = \"x\"\n\n  y = \"y\"\n\n  console.log(\"\
    x is \" + x);\n\n  console.log(\"y is \" + y);\n\n  _ref = [y, x], x = _ref[0],\
    \ y = _ref[1];\n\n  console.log(\"x is \" + x);\n\n  console.log(\"y is \" + y);\n\
    }).call(this);\n```"
