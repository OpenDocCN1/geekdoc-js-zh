    , function() {});\n    });\n  });\n}).call(this);\n```\n\nAfter looking at that\
    \ code, you are probably wondering why there are multiple \"describe\" blocks\
    \ under our initial \"describe.\" We do that because we are going to be writing\
    \ tests for each of the four functions we're going to have on our Calculator class.\
    \ Each of these functions is a noun that we are going to be testing. Below each\
