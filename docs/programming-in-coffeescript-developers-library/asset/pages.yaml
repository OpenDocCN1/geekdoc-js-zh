    \ class had a GUI, we could test in our toScientific matcher that the scientific\
    \ flag was set and the GUI keyboard had switched to a scientific keyboard instead\
    \ of the standard one.\n\n# Wrapping Up\n\nThere have it—a very quick and dirty\
    \ whirlwind tour of the Jasmine test framework. In this chapter we talked about\
    \ why testing is important and how test-driven development can make your life\
    \ a little bit nicer. I hope that I was able to show you that TDD is easy to do\
    \ and can be worthwhile.\n\nWe talked briefly a few of the ways to work, in particular\
    \ using Jasmine with CoffeeScript, as well as how to configure it for the way\
    \ we want. After Jasmine set up and running, we looked at what makes up a Jasmine\
