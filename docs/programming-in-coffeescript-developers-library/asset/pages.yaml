    TodoApp.appendTodo = (todo) ->\n  li = \"<li='#{Templates.list_item_template}(todo)}</li>\"\
    \n  $('#new_todo').after(li)\n```\n\nFirst, we create a variable that is outside\
    \ of this file TodoApp. By prepending the declaration of TodoApp with @, we are\
    \ telling CoffeeScript we want to"
