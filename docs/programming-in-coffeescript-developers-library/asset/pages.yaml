    # Objects/Hashes


    In JavaScript, objects are pretty simple. They are basically a holder of key/value
    pair information. The values of these objects can be other objects, functions,
    numbers, strings, and so on.


    > Tip

    What JavaScript and CoffeeScript call objects are typically given names such as
    hash tables, hash maps, or, simply, hashes. Their title of ''object,'' I think,
    is a bit of a misnomer because there are other types of objects in JavaScript.
    I tend to think of them purely as a key/value pair collection.


    To create the most basic object possible in CoffeeScript, it would look like this:


    Example: (source: basic_object.coffee)


    ```

    obj = {};


