  md: "Now when we run our tests again we should see them all passing:\nRunning Jasmine\
    \ specs...\n...\nPASS: 4 tests, 0 failures, 0.021 secs.\n\n# Before and After\n\
    \nOur tests look pretty good now, but a lot of duplication occurs in each test.\
    \ In each test we are creating a new instance of a Calculator class. Jasmine will\
    \ help us clean that a bit using the beforeEach function.\n\n> Tip As you might\
    \ guess, there is also an afterEach function. The afterEach is great for resetting\
    \ databases, files, or other fixture data back to where it was before the test\
    \ run.\n\nLet's move the creation of an instance of the Calculator class to a\
    \ beforeEach call. We do that by passing a function to the beforeEach function\
    \ that will be called before each \"it\" block in the current \"describe\" block,\
    \ as any subsequent \"describe\" blocks.\n\nExample: (source: calc.7/spec/javascripts/calculator_spec.coffee)\n\
    describe \"Calculator\", ->\n\nbeforeEach ->\n  @calculator = new Calculator\n\
    \ndescribe \"add\", ->\n  it \"adds two numbers\", ->\n    expect(@calculator.add(1,\
    \ 1)).toEqual(2)\n\ndescribe \"subtract\", ->\n  it \"substracts two numbers\"\
    , ->\n    expect(@calculator.subtract(10, 1)).toEqual(9)\n\ndescribe \"multiply\"\
    , ->\n  it \"multiplies two numbers\", ->\n    expect(@calculator.multiply(5,\
    \ 4)).toEqual(20)\n\ndescribe \"divide\", ->\n  it \"divides two numbers\", ->\n\
    \    expect(@calculator.divide(20, 5)).toEqual(4)"
