  md: "# Creating New Todos\n\nThe handleKeyPress function should look pretty familiar\
    \ to you. We are going to check that the key the user presses is the Enter key;\
    \ if it is, we will call the @saveModel function to do the heavy lifting of saving\
    \ the model back to the API.\n\n> Tip\nic could have saved the model directly\
    \ in the handleKeyPress function, but down the line if we ever wanted to add a\
    \ save button, we can wire that up directly to the saveModel function, using the\
    \ events attribute, without having to duplicate any code.\n\nThe saveModel should\
    \ mostly look like the other functions we've written that do something similar.\
    \ First, we create a new instance of the Todo class. Then we collect a list of\
    \ attributes, in this case just pass the title, and pass it to the same class\
    \ with a success callback and an error callback.\n\n> Tip\nWhy did I write e?.preventDefault()\
    \ instead of e.preventDefault()? The reason is that sometimes there might be reasons\
    \ why we would call this and not pass in an event object. By using the existential\
    \ operator in CoffeeScript, we can guarantee that the preventdefault function\
    \ will be called only if there is an event passed into the function. It's a nice\
    \ habit to get into.\n\nThe real magic, for us, happens in the success callback\
    \ when the todo has been successfully saved to the database via the API. At that\
    \ point we are going to call the add function on the collection object and pass\
    \ in the newly created todo. When we do so, resetForm function will be called\
    \ because the @collection call when the add event is triggered.\n\nIf we were\
    \ to run the application right now and try this, nothing would happen because\
    \ we haven't created a new instance of the NewTodoView class yet. To do this,\
    \ let's modify the TodoListView a little bit to not only create the new NewTodoView,\
    \ but also to handle when new todos are added to the @collection and display them\
    \ properly to the user.\n\nExample: (source: app/5/assets/todos/todo_list_view.coffee)\n\
    \n```\n# The 'main' Backbone view of the application\nclass TodoListView extends\
    \ Backbone.View\n\n#: 'todos'\n\ninitialize: ->\n  @template = _.template(Templates.list_item_template)\n\
    \  @collection.bind(\"set\", @render)\n  @collection.fetch())\n  @collection.bind(\"\
    add\", @renderAdded)\nnew NewTodoView(collection: @collection)\n```"
