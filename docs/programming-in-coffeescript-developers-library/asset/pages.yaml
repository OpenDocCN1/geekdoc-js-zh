    \ either. We can use a regular expression to strip off the javascript/ and .js\
    \ parts of the requested path, leaving us with what's in the middle. For example,\
    \ if the path requested was/foo.js, our regular expression would leave us with\
    \ just foo. With that, all we need to return the captured path along with .coffee\
    \ and we are good to go.\n\nFinally, we needed to implement the process function.\
    \ In some ways I think this is more self-explanatory and straightforward for the\
    \ pathname function we implemented. Using the readFile function from the fs module,\
    \ we attempt to read the CoffeeScript from the src directory. The readFile function\
    \ will execute our callback function we pass in.\n\nThe callback function we pass\
    \ has two arguments. The first is an object that represents any errors that may\
    \ have occurred while trying to read the file, as the file is not existing. The\
    \ second argument is the actual data from the file that was read.\n\nIn the callback\
    \ function, if there is an error, we check for this using the ? existential operator\
    \ we learned about in Chapter 3, \"Control Structures,\" and then we call the\
