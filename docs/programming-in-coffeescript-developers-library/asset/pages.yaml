  md: "# 11\nExample: Todo List Part 2 (Client-side w/ jQuery)\n\nIn Chapter 10, \"\
    Example: Todo List Part 1 (Server-side),\" we had just finished writing the server-side\
    \ components needed for us to write a todo list application. In this chapter we\
    \ will write a front end for that application that will run in a browser. We're\
    \ going to do this using some pretty fun technology, such as Bootstrap1 from Twitter\
    \ and jQuery.\n\n# Priming the HTML with Twitter Bootstrap\n\nLet's start by setting\
    \ up some basic styles and HTML for our application. To help get our CSS and styling\
    \ up to a good start, we are going to use the Bootstrap project from Twitter.\
    \ Bootstrap is a simple set of CSS and JavaScript files to help you, well, bootstrap\
    \ your application. It gives you a simple grid to help align the elements on the\
    \ page. It also provides some nice styling for forms, buttons, lists, and much\
    \ more. I highly recommend that you check out the project for full details about\
    \ what it can offer, because we are using only a tiny portion of it for this application.\n\
    \nThe first thing we need to do is update our src/views/index.ejs to use Bootstrap,\
    \ as well as our own CSS, so we can make the few tweaks necessary for our application.\n\
    \nExample: (source: app/1/src/views/index.ejs)\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Todos</title>\n  <link rel=\"stylesheet\" href=\"http://twitter.github.com/bootstrap/1.4.0/bootstrap.min.css\"\
    >\n  %- css('/application') %>\n```"
