  md: "# The do Keyword\n\nScope, as we discussed in Chapter 2, \"The Basics,\" in\
    \ JavaScript can be a real pain to deal with sometimes—no more than in loops.\
    \ Because of the asynchronous nature of JavaScript, it is possible that we have\
    \ lost the scope of a variable while we're doing something as simple as looping\
    \ through a few numbers.\n\nLet's look at an example. In this example we want\
    \ to loop through a few numbers and print them out. However, before we print them\
    \ out we want to wait one second.\n\nExample: (source: do.coffee)\n\n```\nfor\
    \ x in [1..5]\n  setTimeout ->\n    console.log x\n  , 1\n```\n\nExample: (source:\
    \ do.js)\n\n```\nfunction() {\n  var x;\n\n  for (x = 1; x <= 5; x++) {\n    setTimeout(function()\
    \ {\n      return console.log(x);\n    }, 1);\n  }\n}\\call(this);\n```\n\nOutput:\
    \ (source: do.coffee)\n\n```\n6\n6\n6\n6\n6\n```\n\nWow! That wasn't at all what\
    \ we wanted! We were hoping to print out the numbers 1 through 5. Instead we got\
    \ the number 6 printed out 5 times. What happened? The answer is that we lost\
    \ track of the scope of the variable x.\n\nWhile we waited the second to print\
    \ out the number, the variable was incremented in the loop. The reason we saw\
    \ the number 6 is because the last time through the loop it incremented it up\
    \ to 6, which is greater than 5, so the loop didn't execute."
  merge: -1
  pgno: 144
- img_proc: true
  md: "How so do we prevent this from happening and keep track of the variable's value\
    \ that we actually want? We can do this using the do keyword:\n\nExample: (source:\
    \ do2.coffee)\n\n```\nfor x in [1..]\n  do (x) ->\n    setTimeout ->\n      console.log\
    \ x\n  \n```\n\nExample: (source: do2.js)\n\n```\n(function() {\n  var x, _fn;\n\
    \n  _fn = function(x) {\n    return setTimeout(function() {\n      return console.log(x);\n\
    \    }, 1);\n  };\n  for (x = 1; x <= 5; x++) {\n    _fn(x);\n  }\n}).call(this);\n\
    ```\n\nOutput: (source: do2.coffee)\n\n```\n1\n2\n3\n4\n5\n```\n\nThe do keyword\
    \ will create a wrapper function around the code we want to execute, and it will\
    \ take in, and hold onto, the variable at the time we called it. Very useful,\
    \ indeed!\n\n# Wrapping Up\n\nWell, there we have it—everything you've always\
    \ wanted to know about collections and iterating in CoffeeScript."
