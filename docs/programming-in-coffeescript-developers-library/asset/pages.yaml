    \ for, for click, submit, keypress, and so on, that is then followed by the CSS\
    \ selector to watch for the event. The value of the mapping is the function you\
    \ want to call when that event on CSS selector happens. In our case, we are watching\
    \ for a keypress event on the .todo_title, and when that happens, we want to call\
    \ the handleKeyPress function.\n\n# Tip\n\nThere are two important things to note\
    \ about the events mapping in Backbone. The first is that the CSS selector is\
    \ scoped to the el attribute you set. The second is that we pass in a string with\
    \ function name, not a reference to the function, like we do when binding to collections,\
    \ we saw earlier. I’m not sure about the reason for this mismatch, but that’s\
    \ just the way it is. This is something to look for if things aren’t working quite\
    \ as expected.\n\nIn the initialize function we bind the resetForm function to\
    \ the add event on the @collection object, which we pass in when we create the\
    \ instance of the NewTodo class. Later in the saveModel function, when we get\
    \ an acknowledgement from the API that we have successfully created the new todo,\
    \ we will add it to the @collection. That will trigger the add event, which will\
    \ call the resetForm function. The resetForm function, as you can see, cleans\
    \ up the form to its original state before the user typed in it.\n\nAlso in the\
    \ initialize function, we want to set the .todo_title element in the form to have\
    \ focus when the page loads. Here we use a special function on the Backbone.View\
    \ class, $. The $ function uses jQuery CSS selectors that are already scoped to\
    \ the #el element we are watching so we would have to write something like $('#new_todo\
    \ .todo_title') to access the same element."
