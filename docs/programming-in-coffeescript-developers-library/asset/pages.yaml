  md: "# Deleting Todos\n\nOur application is almost complete. All that is left is\
    \ to hook up the delete button so users can delete their unwanted todos. At this\
    \ point, this code should be pretty simple for you to write, but let's quickly\
    \ look at it.\n\nWe will start by writing a deleteTodo function:\n\n```\nExample:\
    \ (source: final/assets/jquery/delete_todo.coffee)\n@TodoApp ||= {}\n```\n\n```\n\
    # Delete the todo:\nTodoApp.deleteTodo = (li, todo) ->\nif confirm \"Are you sure?\"\
    \n  request = $.post(\"/api/todos/#$(todo.id)\", method: 'delete')\n  request.remove()\n\
    ```\n\nThe deleteTodo function makes a request back to the API using the DELETE\
    \ HTTP verb, via the special _method parameter we discussed earlier. If the request\
    \ to destroy the todo is successful, we remove the todo from the page—nice, clean,\
    \ and simple.\n\nNow we need to hook up the delete button and we are done. We\
    \ can do this in the watch-ForChanges function we wrote earlier:\n\n```\nExample:\
    \ (source: final/assets/jquery/watch_todo_for_changes.coffee)\n@TodoApp ||= {}\n\
    ```\n\n```\n# Watch the todo for changes:\nTodoApp.watchForChanges = (li, todo)\
    \ ->\n# If the checkbox is checked/unchecked:\n  $('.state', li).click(e) =>\n\
    \    TodoApp.updateTodo(li, todo)\n# If someone hits \"enter\" in the title field:\n\
    \  $('.title', li).keypress(e) =>\n    TodoApp.updateTodo(li, todo)\n  $('.button.danger',\
