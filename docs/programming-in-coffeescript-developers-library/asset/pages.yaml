  md: "Example: (source: calc.7/spec/javascripts/calculator_spec.js)\n\n```\ndescribe(\"\
    Calculator\", function() {\n  beforeEach(function() {\n    return this.calculator\
    \ = new Calculator();\n  });\n  describe(\"#add\", function() {\n    return it(\"\
    adds two numbers\", function() {\n      expect(this.calculator.add(1, 1)).toEqual(2);\n\
    \    });\n  });\n  describe(\"#subtract\", function() {\n    return it(\"subtracts\
    \ two numbers\", function() {\n      expect(this.calculator.subtract(10, 1)).toEqual(9);\n\
    \    });\n  });\n  describe(\"#multiply\", function() {\n    return it(\"multiplies\
    \ two numbers\", function() {\n      expect(this.calculator.multiply(5, 4)).toEqual(20);\n\
    \    });\n  });\n  return describe(\"#divide\", function() {\n    return it(\"\
    divides two numbers\", function() {\n      expect(this.calculator.divide(20, 5)).toEqual(4);\n\
    \    });\n  });\n}).call(this);\n```\n\nTip\nThe scope of beforeEach and afterEach\
    \ calls can be a bit confusing. It helps to think of it a bit like a waterfall.\
    \ The calls trickle down from the current \"describe\" block to all of \"describe\"\
    \ blocks that are nested below. It does this for many levels of \"describe\" blocks\
    \ there are.\n\nWhen writing beforeEach functions, it's important to know that\
    \ you can have as many as you want, and they can be at any level of tests as you\
    \ need. Let's see this in action with our Calculator class.\n\nLet's add a flag\
    \ to our Calculator that tells the calculator whether it should operate in scientific\
    \ mode."
