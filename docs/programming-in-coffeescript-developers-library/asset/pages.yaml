  md: '# Example: Todo List Part 1 (Server-side)


    In the first part of this book you learned the ins and outs of CoffeeScript. We
    covered every detail of how the language works, how it maps to JavaScript, and
    how it can help make writing your applications cleaner and more secure. In the
    last few chapters hopefully we looked at a few of the projects that surround the
    CoffeeScript ecosystem. Now, for the final three chapters of this book, I''d like
    us to put what we''ve learned into actual use.


    Personally, I learn from seeing things work. Seeing continued examples of some
    feature or library goes so far in actually teaching me what that library is supposed
    to be doing, but when I see it in action, that''s another story. I can start to
    see how it fits into my development life. In short, it comes alive for me. Thats
    what we''re, going to do in hopefully these last few chapters.


    The application we are going to build in these last few chapters is the canonical
    todo list application. We''ve all written them, and we''ve all seen them in action
    as demo applications. The reason for this is everyone knows what a todo list is
    and how it works. It''s big enough in scope to let us exercise the libraries and
    tools we are talking about, but not too big that it becomes an overwhelming project
    we can''t tackle in a relatively short span of time.


    In this chapter, we are going to build the back end of our application. We need
    a server that can serve up the todo list, our assets, and, most importantly, serve
    the todos themselves and provide a way for us to persist those todos to a data
    store.


    In the two subsequent chapters, we will pick up where we leave off and build the
    end of our application. We will need a way to display the todos on our page, create
    new todos, update existing todos, and destroy todos.


    Finally, at this point think you''ve seen enough JavaScript, so from on out, we
    aren''t going to be looking at the generated JavaScript that CoffeeScript produces.
    If you really want to see the JavaScript, I recommend either that you compile
    it yourself or visit the GitHub project for this book.¹'
