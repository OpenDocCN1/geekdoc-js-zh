  md: '# Class-Level Functions


    Output: (source: manager3.coffee)

    Name: Mark

    DOB: Tue Aug 24 1976 00:00:00 GMT-0400 (EDT)

    Salary: 50000

    Name: Rachel

    DOB: Sat Apr 28 1979 00:00:00 GMT-0500 (EST)

    Salary: 100000

    Bonus: 10000


    In the printInfo function we defined in the Manager class, we first called super.
    When we call super, that will call the original printInfo function from the Employee
    class with any arguments that might have come into the function. After we call
    super we then print out the bonus information for the manager.


    > Tip

    The call to the super can be called at any point in the function that is overriding
    it; it doesn''t have to be first (as in some languages). Subsequently, you don''t
    have to call the super method at all.


    > Tip

    When calling super we do not need to explicitly pass in arguments. By default,
    any arguments that come into the function that is overriding super will be passed
    to super when calling. You can, however, explicitly pass any arguments you want
    when calling super. This can be useful if you want to augment or mutate the arguments
    before they go to the super method.


    # Class-Level Functions


    Class-level functions are functions that don''t require an instance of the class
    in order to be called. These functions can be incredibly useful. One of the best
    uses is to provide a sort of namesacing for your functions. An example of this
    in JavaScript is Math.random(). You don''t need to instantiate a new Math object
    to get a random number. But by hanging the random function off of the Math class,
    you avoid the risk that there is another function called random that might override
    your function.


    > Tip

    In reality, Math isn''t a class; it''s just a plain object that is used for namesacing.
    Occasionally I twist the thread a little bit to get my point across.


    You can also use class-level functions to do things that might affect multiple
    instances of a class, like search for them in a database.'
