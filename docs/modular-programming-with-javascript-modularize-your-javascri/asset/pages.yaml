  md: '# Chapter 2


    If you are familiar with the prototype property, you know that every function
    has this property by default. The value of this property is an object that is
    shared with all the instances that are created using the constructor function.


    The advantage of creating methods (properties) on prototype object as opposed
    to the constructor function is that by doing so, all the instances that are created
    using the constructor share these methods. Therefore, these instances do not have
    to have their own copy of these properties, optimizing our code''s performance
    and memory usage.


    In the preceding code, in the case of BaseType, we simply augmented the prototype
    object of this constructor with a method called getBaseValue, but for ChildType,
    we did something a little different.


    We created an instance of BaseType and then assigned it to ChildType using the
    following experiment:


    ```

    ChildType.prototype = new BaseType();

    ```


    After the above assignment, the ChildType.prototype value becomes an instance
    of BaseType. This means that this prototype object has access to two properties,
    baseValue and getBaseValue.


    The end result is that there are two properties instances of ChildType have access
    to but not need to create them.


    When we run the following line of code:


    ```

    console.log(childInstance.getBaseValue()); //displays 2

    ```


    The childInstance variable can return the value of the baseValue variable, using
    getBaseValue method.


    Of course, childInstance also has access to its own childTypeValue. If we run
    the following line, 50 will be displayed.


    ```

    console.log(childInstance.getChildTypeValue()); // displays 50

    ```


    # Property look up in prototype chaining


    Let''s examine how ChildInstance gets access to the properties of BaseType in
    a little more depth.


    When we try to access a property on ChildInstance, behind the scenes, a search
    is conducted on the instance to see if that is available. If the property is not
    found, the search continues to the prototype object of the ChildInstance object.
    Since an instance of BaseType is the value of the prototype object belonging to
    ChildInstance, the search is continued in BaseType.


    [ 29 ]'
