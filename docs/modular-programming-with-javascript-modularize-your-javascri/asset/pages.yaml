  md: '# Summary


    In this chapter, we talked about various types of tests and why continuous testing
    of our code is important to the integrity of our application as a whole. One of
    the ways to implement continuous testing is using unit tests.


    We explored how we can write some unit tests using plain JavaScript and saw that
    using third-party testing frameworks enables us to have more capable and robust
    tests in our application, with much less effort.


    Using a modular architecture, allows us to easily test our modules in isolation
    and to quickly find and fix possible issues in our code.


    We also glanced over very popular open source testing frameworks, Jasmine and
    Mocha. However, we barely scratched the surface of the capabilities that these
    frameworks offer, and I encourage you to explore them further on your own.


    All the tests shown in this chapter are included in the source code accompanying
    this book, and I highly recommend that you have a look at the test suites and
    spend some time to become familiar with them.


    In the next chapter, we will look at different approaches for loading modules
    into our application and see how we can manage module dependencies using industry’s
    best practices.'
