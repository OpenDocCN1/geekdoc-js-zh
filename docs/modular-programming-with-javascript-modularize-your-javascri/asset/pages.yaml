    \ most likely either rewrite the same functions in that application from scratch\
    \ or we would copy/paste the code from this application into the other one.\n\n\
    What if we decided to also do multiplication, division, and other related calculations\
    \ in our application using the same approach?\n\nWell, one way would be to continue\
    \ writing independent functions as above and add them to our application. This\
    \ approach could work and would get the job done, but probably not in the best\
    \ way, since the code grows it will become more disorganized and chaotic.\n\n\
    By using this approach, not only would we be polluting the global namespace with\
    \ a bunch of global functions that could possibly collide with other global functions\
    \ of the same name. We would also end up with scattered pieces of code that had\
    \ not been packaged together based on their functionality and specialization."
