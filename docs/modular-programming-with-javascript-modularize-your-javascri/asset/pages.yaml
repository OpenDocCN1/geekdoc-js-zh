    \ on\nthe back and forward buttons of the browser. The second is to broadcast\
    \ the message\nim-Clicked to the application.\n\nThe interesting point to consider\
    \ is that our content component itself listens to\nthis event and acts on this\
    \ to update the page view, using the following event\nregistration method:\n\n\
    ```\nregisterForCustomEvents : function() {\n  sandBox.registerForCustomEvents({\n\
    \    'img-Clicked': this.updateContentPage,\n    'page-Changed': this.updateContentPage,\n\
    \    'favourites-Clicked': this.updateContentPage\n  });\nn}\n```\n\nAs you can\
    \ see, when img-Clicked event is received by content component (which\nitself\
    \ generated), then updateContentPage method of this component is called.\n\nOf\
    \ course, we could have directly updated the view of the page in\nhandImageClick\
    \ method, but by broadcasting the event at the application level,\nwe can be sure\
    \ that all the pieces of the application, including content component\nitself,\
    \ can take action upon the broadcast of this event."
