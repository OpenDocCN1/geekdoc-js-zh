  md: "# Application Implementation – Putting It Together\n\nHowever, if the widget\
    \ has been previously loaded in the application (if the user had clicked on the\
    \ **Support** link we will simply re-render it on the page. This is because the\
    \ first time this component is loaded, it will be kept in cache, after the user\
    \ closes the dialogue box by clicking on its **Close** button.\n\nNotificationHandler\
