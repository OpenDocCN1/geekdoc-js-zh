    As you can see, the value of the singleton object is displayed

    regardless of whether we directly access the property or use our singleton''s
    method

    to return the value of the property.


    On the other hand, as expected, no changes have taken place in the value of the

    property contained in the container function''s context, even though our singleton

    object does have access to this context.


    Remember, when we use the module pattern in JavaScript and return a singleton

    object from it (as an interface to the containing object/function), there are
    two

    contexts are at play.


    First, the internal private scope of the container function, which our singleton
    object

    has access to closure.


    The second is the context of the singleton object itself as with any other object
    in

    JavaScript. It is important to understand the distinction between the two contexts

    when you design your modules using the module pattern in JavaScript.


    Another important point to keep in mind is that the code structure (pattern) shown

    viously allows us to have object encapsulation and access control on the

    properties defined in a private namespace. In this case, the anonymous function

    creates a namespace that returns an anonymous object, or more accurately, a

    reference to the anonymous object (the singleton object) as an interface.


    This approach becomes very valuable since now we are sure that no external code

    is able to either intentionally or accidentally change the values of the properties
    in

    nour namespace. This structure provides control over what properties are accessible

    by the outside code and what properties are hidden away and protected in the

    private scope.


