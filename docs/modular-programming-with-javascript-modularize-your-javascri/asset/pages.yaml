  md: '# Base, Sandbox, and Core Modules


    So far in this book, we have mostly looked at different techniques for creating
    and enhancing modules. However, our focus has been on the smaller pieces of the
    application.


    In this chapter, we are going to take a holistic view of our application as a
    complete functioning body. We will see how its various pieces can be put together
    to create a robust and flexible ecosystem to deliver our ultimate goal, which
    is a working Single-Page Application (SPA).


    As you read through different sections of this chapter, keep in mind that all
    the pieces of the application are designed to work together in concert, while
    still adhering to the principles of maintainability and extensibility of a modular
    design.


    In this chapter, we will cover:


    +   - Base module and its design

    - Sandbox and the principles behind sandboxing of our components

    - Core and its related modules

    - Components and how they are added to the application

    - Plug-and-play, progressive enhancement, and graceful degradation in our application


    Note that we will not get too deep into the coding aspect of things here, since
    I would really like you to focus on the architecture of the application, as opposed
    to being distracted with the details of the implementation. As such, there is
    no project code associated with this chapter of the book.'
  merge: -1
