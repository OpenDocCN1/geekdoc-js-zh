  md: '# Cloning, Inheritance, and Submodules


    This implementation of our Shape module accepts one parameter, which can be either
    an empty object or a reference to an already existing Shape module. This means
    that, even if our Shape module was already created in our previous IIFE, which
    was responsible for adding our Polygon_Module to our Shape module, we are still
    able to re-define it.


    To test this, we can run the following:


    ```

    console.log(Shape.getType()); // displays "any 2D and 3D shape"

    ```


    ```

    console.log(Shape.Polygon.description()); // displays "submodule has

    added to shape module"

    ```


    The result confirms that we are able to access properties of the Shape module
    as well as our submodule, no matter which one is loaded first in our application.


    You might also notice that the implementation above is very similar to our loose
    augmentation pattern that we discussed previously. The only real difference is
    that we are adding our submodule as a completely independent module to our main
    module, as opposed to just augmenting the main module with new properties.


    # Summary


    In this chapter, we looked at a few more techniques which enable us to extend
    and modify our modules.


    We considered how we can use various cloning approaches to create replicas of
    our modules and talked about the pros and cons of each approach. We also examined
    how we can use inheritance among modules so that a child module can utilize the
    functionality of its parent module as well as override its parent module''s functionality,
    as needed.


    In the last section of this chapter, we talked about submodules and looked at
    a couple of different techniques for adding them to our main (hosting) modules.


    The next chapter will be more focused on the design of our application as a whole.
    We''ll see how a flexible ecosystem can be created for our modules, which allows
    them to interact and work together, without being dependent on each other.'
