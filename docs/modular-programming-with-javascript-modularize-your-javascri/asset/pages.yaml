    references BaseType

    ```


    As seen above, we need to reset the constructor property of the prototype object
    as shown:


    ```

    ChildType.prototype.constructor = ChildType;

    ```


    Keep in mind that resetting the constructor property needs to happen after the
    prototype object has been re-written and not before. Otherwise, the re-write will
    completely remove the constructor property.'
