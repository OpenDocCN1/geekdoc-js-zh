  md: '# Application functionality


    As you may recall, our application was intended to be an image gallery-type application
    that displays a list of images. Users are able to interact with the application
    in a variety of different ways. While the application might seem very simple from
    a user''s point of view, it is designed from the ground up, to be easily extensible,
    so more functionality can be added to it as needed.


    Let''s consider the various aspects of our application''s functionality.


    # Index page


    The main page of the application (index.html) consists of three main components:
    header, footer, and content.


    These components build the header, footer, and content sections (page fragments)
    of the main page respectively, as shown in the previous screenshot.


    Since we designed our application as a Single Page Application (SPA), navigation
    to different pages of the application only updates the view of the content area.


    The footer and header sections of the application are rendered only once, and
    that is at the initial load time of index.html. The main advantage of our SPA
    design is that there is no need to fully re-render the page every time different
    pages are viewed. Therefore, there is no flickering of the page in the browser.


    In the main page, users are able to see the full catalog of all the images available.
    By clicking on an image, the user can see its full-size. Images can also be added
    to, or removed from, the list of favorite images when the user clicks on the related
    link below each image.


    Users are able to interact with the header and footer of the application too,
    even though, for our POC, not all links in the footer and header are activated.


    # Image page


    When a user clicks on an image, the view of the content area of the application
    is changed to show the image in full view, as shown:'
