  md: "# Cloning modules\n\nCloning objects in general, and cloning modules in particular,\
    \ is about creating an exact replica of the original object or module.\n\nBut\
    \ before we talk cloning, let's consider some of the ways that we can create new\
    \ objects based on other objects.\n\n# Creating instances of a constructor function\n\
    \nOne way of creating objects based on another object is by creating instances\
    \ of a constructor function.\n\nAs you know, when we create an instance of an\
    \ object using a constructor function in JavaScript, we use the new keyword. The\
    \ created instance resides in a different memory address than the constructor\
    \ function. When we assign properties to the `prototype` property of the constructor\
    \ function, all the instances of the constructor function will share these properties\
    \ of the `prototype` object.\n\nLet's have a look at a simple example and review\
    \ creating objects based on constructor functions.\n\nConsider the following code\
