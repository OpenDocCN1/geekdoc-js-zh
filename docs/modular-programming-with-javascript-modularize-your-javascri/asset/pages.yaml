  md: "# Review of Important JavaScript OOP Concepts\n\nThe most important point is\
    \ that Closures allow for inner functions to have access to the execution context\
    \ of their parent functions (objects) as part of their scope chain. As values\
    \ in scope of the outer function change, the inner function can have access to\
    \ the most recent values.\n\nOne advantage of creating and using Closures can\
    \ be shown in the following example:\n\n```\nfunction myClosedObject() {\n  var\
    \ privateValue = 5;\n\n  function privateFunc() {\n    privateValue *= 2;\n  \
    \  return privateValue;\n  }\n\n  // privileged method\n  this.publicFunc = function()\
    \ {\n    return privateFunc();\n  }\n}\n```\n\n```\nvar firstObj = new myClosedObject\
    \ ();\nconsole.log(firstObj.publicFunc()); // displays 10\nconsole.log(firstObj.publicFunc());\
    \ // displays 20\n```\n\nIn the preceding code, we first create an instance of\
    \ myClosedObject and then we execute the publicFunc of this instance. This call\
    \ changes the value of privateValue from 5 to 10.\n\nWhen we call this method\
    \ one more time, the value of privateValue will change to 20. This is because\
    \ after the first call to publicFunc the value of privateValue has been preserved\
    \ (thanks to the created Closure). The second call to publicFunc, uses the most\
    \ up to date privateValue (which is 10) to do its calculation, resulting in the\
    \ value 20 being returned.\n\n# Encapsulation and scoping\n\nAs you may know,\
    \ in JavaScript the idea of encapsulation is handled a little differently from\
    \ most classical object oriented languages, since we really don't have a formal\
    \ definition for classes (ECMAScript introduces formal class definition)."
