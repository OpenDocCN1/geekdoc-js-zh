    ![](img/7ce8facf2661aaaf5010fe7a99cadff7_144_0.png)


    # # Sandbox module


    When we talk about a sandbox in our daily lives, we usually have a picture of
    a box full of sand in our minds, we allow the kids to play and make all the mess
    they like - and hopefully in that box.


    In our modular architecture, we capitalize on the same concept and create spaces
    for our components to play in and be isolated from other pieces of the application.


    Byboxing our modules in such a way, we eliminate tight coupling among our application
    components and the core module.


    The sandbox is essentially a layer of abstraction as well as a thin interface
    between our components and the other pieces of our application.


    As the sandbox module is designed to be an interface and provide communication
    among our components and the rest of the application, it is considered a contract
    and, as such, it should never change. This is so that our components can be sure
    that they can always count on a consistent level of communication with the application
    as well as a certain level of functionality provided by the core module.


    That is not to say, we cannot add new methods or functionality to the sandbox;
    it is only that we cannot change what is already there and that our components
    come to rely on.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Sandbox module functionality


    When our components are loaded in the application, either at application start-up
    time or dynamically any time after, they are all given an instance of the sandbox
    module.


    The sandbox module provides the following for our components:


    +   - A consistent interface

    - Security

    - Communication

    - Filtering


    Each one of the services provided by the sandbox module is crucial to the modular
    aspect of our implementation.


    Let''s explore each aspect in more detail.


    # Sandbox as a consistent interface


    As mentioned, when every registered component is given an instance of the sandbox
    module by the core module.


    This instance of the sandbox then acts as an interface to the rest of the application,
    which provides application-level functionality for the component.


    When a component needs a particular functionality, it does not necessarily need
    to implement it itself. This is true when the implementation of that functionality
    is already available in the application.


    For instance, to bind event handlers to elements, each component does not need
    to provide its own implementation. Components can simply ask the sandbox module,
    which in turn, asks the core module to bind a event handler to a particular element
    on the page.


    Of course, the components also do not to worry about browser compatibility issues
    related to event binding, as is the job of the core module to take care of such
    issues.


    Since the sandbox is identical for every registered component, we can be sure
    that any changes in the sandbox code is provided to all the components at the
    same time. This means that the addition of new functionality, bug fixes, and modifications
    in the sandbox module are done once and propagated to all the components that
    use the sandbox module, in a uniform and cohesive manner.'
  merge: -1
