- img_proc: true
  md: 'At the same time, each main piece may consist of other smaller pieces which
    are packaged together to create the main piece.


    Let''s start by exploring each main piece of the application and looking at the
    specific functionality that each piece provides.


    For our purposes in this book, from this point forward, when I talk about components,
    I''ll be referring to modules that use user interface pieces (views) which the
    user is able to interact with, such as the header component. However, when I refer
    to modules I will be referring to functional modules that each main piece may
    consist of, which do not have any values associated with them directly.


    The definitions will become clearer as we move along but when you may decide to
    refer to such pieces differently in your own projects. This is fine, as long as
    the architectural concepts behind them remain the same.


    Also, from time to time, I will be referring to our modular design architecture
    as a framework, which should be interpreted as all the pieces of the application
    together as one.


    > About the term framework

    While I will use the term framework at times, our application is not meant to
    create what is generally known as a framework. At least not in the same capacity
    that the term is used to refer to frameworks in the likes of AngularJS or React

    Generally speaking, I think sometimes third-party frameworks are overused and
    while they provide some sorts, there are also associated with using any type of
    third party framework.

    The purpose of this book is to show you how you can create your own architectural
    design which allows you to easily create, organize and maintain your application''s
    code base without the need for a third party framework.

    asuch, I would like you to look at our implementation as an architectural design
    concept opposed to a framework. But if you insist, you can call what we design
    and create here an ironic framework. I say ironic, it is not really a framework
    in the traditional sense, as it does not impose a special syntax or rules of regulations

    The best way to describe our implementation is perhaps by using the term Client-side
    Modular Design (CMD), since the goal of this architectural approach is to create
    a solid foundation and flexible ecosystem for our applications, as opposed to
    it being a framework.'
