- img_proc: true
  md: '# 9 Modular Application Design and Testing


    Now that we have completed the implementation of our application, it is time for
    us to talk about testing it. Of course, we test our application to make sure things
    works as expected and the future changes to our code-base do not break our application''s
    functionality.


    One thing to keep in mind here, is that we are writing our tests after we have
    completed our implementation. However, there are times when we write our tests
    before our application''s code.


    The idea is that we write our tests first and expect them to fail since there
    is no implementation of the code. Then, as we implement our application, our tests
    start passing and we can be sure that the implemented code behaves as expected.


    You may choose this approach over implementation first and testing later for your
    projects, but I would like to emphasize the point that, regardless of the approach,
    you need to write some automated tests!


    With in mind, in this chapter we are going to have a look at how we can write
    some unit tests, and how our modular approach in our application design makes
    writing automated tests easier and more maintainable. For brevity, we will only
    write unit tests for two of our modules but the principles discussed can be used
    to test our other modules too.'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'Modular Application Design and Testing


    In this chapter we will cover:


    +   * How our modules can be tested individually

    * Writing tests without the need for third-party frameworks

    * Improving and streamlining our unit tests using third party tools

    * Using Jasmine as a testing framework

    * Using Mocha and its related assertion libraries as a testing framework


    # Advantages of writing automated tests


    As developers, our primary concern is to write code that can produce the expected
    functionality and results. While principle holds true, the way we achieve our
    final implementation goal is very important.


    A properly designed application is not just about achieving the final goal of
    the application but it should be about implementing an easily extensible and maintainable
    code-base.


    Using a modular approach helps us in achieving such objectives but as we make
    changes to our code-base, and as our application goes through its life cycle,
    we need to make sure all the pieces of the application still work properly.


    When we make a change to one part of the application, we need to make sure that
    the change does not adversely affect the other parts of our code base. Of course,
    one way of assuring this, is to test everything manually and check every aspect
    of our application under all the circumstance that it was designed for.. But such
    an approach is not only time-consuming, it is also very tedious as we need to
    go through the same process for every single change in our application.


    Also, especially in big projects, other developers could be working on various
    pieces of the application. How can we be sure that their changes would not have
    undesired effects on the parts of the application that we are responsible for?


    Automated tests enable us to check the functionality that we expect from our code,
    either in a targeted manner for a particular piece of code or for the entire application
    as a whole. We write the tests once, and then run them many times as we will,
    either when there is a change in the code-base or on a continuous basis as part
    of our regular and testing process.


    The other advantage of automated tests is that, as we are implementing our code,
    we get into the habit of considering how we can test the particular functionality
    using automated tests. This mindset results in writing better, more targeted and
    modular code.


    [ 204 ]'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Different types of automated tests


    There are many different types of automated tests, but we will consider and talk
    about only three categories of such tests as listed here:


    +   - Unit testing

    - Integration testing

    - End to end testing


    # Unit testing


    Unit tests are usually designed to test the functionality of individual pieces
    of our code in isolation. This usually means testing our functions and methods,
    one at a time, to make sure they do exactly what is expected of them.


    We usually write such tests in a manner that can verify the functionality of our
    methods and individual pieces of our code in various scenarios.


    There are two main styles of writing unit tests: Test Driven Development (TDD)
    and Behavioral Driven Development (BDD).


    Let''s have a simple overview of what they are and how they are different.


    # TDD unit tests


    TDD unit testing is mostly used to test the implementation of our code. This is
    by testing the actual result that a method produces against what is expected.


    The TDD process can be thought of as the following loop, if we write our tests
    before the code implementation:


    +   - Write a unit test

    - Run the test and expect it to fail

    - Write the code required to make the test pass

    - Run the test again to make sure the test passes

    - Re-factor the code if needed

    - Start from the first step again


    As you can see, TDD is meant to be implemented from the beginning of the project
    and to continue through the project''s life cycle.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# BDD unit tests


    This style of testing is focused on the expected behavior of our code and not
    necessarily the implementation of it.


    When we use BDD style of writing unit tests, we write our assertions in a way
    that can be read like a natural sentence.


    For instance a test should read as, "returns a value that is incremented by 1
    from the previous value".


    BDD can also follow the same process shown in the TDD section.


    # TDD versus BDD


    Imagine that a function which is a counter, and when it is called for the first
    time, it will return the value 1 and every time after that, it will return the
    previous counter value plus 1.


    In TDD style of writing unit tests, we test that our function is initialized with
    the default value (start value) of zero, since that it is tied with the very first
    time that the function is called.


    This detail (that the start value is 0) is an implementation aspect, and TDD style
    of writing tests for such implementation details. It also means that if we decide
    the default value (start value) in our counter function should change to 2, our
    test case needs to change accordingly.


    In BDD style of writing unit tests, we don''t check to see what the returned value
    is when the function is called for the very first time. We only check to see that
    every time the function is called the counter has been incremented by 1. This
    means that if we change the start value of the function at some later time, it
    has no effect on the expected behavior of the function. Function should always
    increment the previous value by 1, regardless of the starting value.


    The difference between TDD and BDD is very subtle but important to keep in mind.


    In this chapter we will focus on writing unit tests in BDD style.


    # Test coverage


    It is ideal to write enough unit tests to achieve 100 percent coverage of our
    code. However, in reality, it is not always possible to write unit tests for every
    aspect of the code.'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'Of course, the tests we write, the better code quality we can expect, time
    lines also need to be kept in mind for every project. In reality, we do not always
    have sufficient time to achieve the full coverage of our code unit with tests.
    However, we should keep in mind that in the long, we save more time on finding
    and fixing bugs when we have more code coverage with our tests.


    In the absence of sufficient time, my recommendation is to make sure that you
    at least write unit tests for the core pieces of your application and cover them
    100 percent. If time permits, turn your focus to other non-critical pieces of
    your application and as many unit tests as you can for those.


    This way, you can make sure of the quality and integrity of the application core
    and isolate possible issues in non-core and non-critical modules.


    # Integration testing


    This type of testing is mainly focused on making sure that different pieces of
    the application can work properly.


    When different methods and modules are involved to provide a certain functionality,
    we want to test and see if the desired functionality has been achieved by the
    sum of collaboration among such pieces.


    An example could be that one function reads a string from a file and passes it
    to another function, which creates an array based on the comma delimiter in the
    string. Our integration test will make sure that the correct array was produced
    based on these two functions working together to read and process the string.


    # End to end testing


    These tests usually checks the flow of the application''s functionality from the
    start to finish to make that the application as a whole is working properly and
    as intended.


    For instance, to test the correct behavior of the application based on the form
    submission on a page, we can submit the form values to the server using an AJAX
    call, get the results from the server, and then refresh the content area of the
    application based on the returned values. By examining the final result, we can
    be sure that our application behaves as expected.


    End to end (also known as E2E) testing is usually done after your unit tests and
    integration tests have passed.'
