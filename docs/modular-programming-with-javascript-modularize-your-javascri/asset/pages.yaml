  md: "I previously mentioned that our components are loosely coupled with the other\
    \ pieces of the application by custom events using the mediator pattern. Let's\
    \ have a quick look at that.\n\nConsider the following code snippet:\n\n```\n\
    handleSupportClick : function(e) {\n  sandBox.publishCustomEvent({\n    type:\
    \ 'support-Clicked',\n    data: 'support'\n  });\n  e.preventDefault();\n  e.stopPropagation();\n\
    }\n```\n\nAs you see, the footer component publishes a custom event when the Support\
    \ link is clicked. Then, all the other pieces of the application that have registered\
    \ for this custom event will be notified by the core module that this event has\
    \ occurred. We will talk about this mechanism more in the next chapter.\n\n# Component\
    \ design considerations\n\nIn this chapter, we did not examine the implementation\
    \ details of the components too closely, as we will have a more in-depth look\
    \ at them in the next chapter. However, I would like you to consider a few conceptual\
    \ aspects of the components.\n\nFirst of all, all the components are loosely coupled\
    \ with the application. The only connection between them and the rest of the application\
    \ is through an instance of the Sandbox, which was passed to them during the registration\
    \ phase.\n\nSecond, all the components are responsible for implementing their\
    \ own controllers. The other application pieces do not get involved with the functionality,\
    \ which is specific to an individual component.\n\nThe job of the application\
    \ as a whole, and the core module in particular, is to create a robust ecosystem\
    \ in which the components can leverage the application-level functionality that\
    \ has been implemented. Therefore, the components do not need to implement such\
    \ functionality themselves. This approach allows us to create a cohesive and loosely\
    \ coupled application that can be easily maintained and extended as the need arises."
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Note that each Component is a self-contained piece of the application and the
    core or any other pieces of the application are not aware of nor dependent on
    the internal implementation of the Component. This means components are free to
    decide on their own implementation.


    In this manner, we can create a good level of separation of concerns and responsibilities
    throughout all the application pieces.


    When a component needs to modify the DOM, it should do so by leveraging the functionality
    that the core module provides. Therefore the component does not have to implement
    this functionality itself. Also, by using the core module, we are able to prevent
    other pieces of the application from accidentally causing any conflicts at the
    same DOM element level, preventing collisions and application-level issues.


    The proper approach in most cases is that components only modify the DOM elements
    (through the core module) in their own container and not beyond that.


    # Application architectural considerations


    Let''s review the important points that we have discussed about modular architecture
    in this chapter and see how they relate to various pieces of our application,
    as follows:


    +   * All third party libraries are imported into the application through the
    base module

    * The core module and the base module are the only pieces of the application that
    know about the loaded third party libraries

    * All browser compatibility issues are dealt with in the core module by leveraging
    the functionality of the third party libraries

    * Every component in the application gets an instance of the sandbox module

    * The sandbox only knows about the core and no other pieces of the application

    * No pieces of the application know about the internal implementation of other
    pieces

    * Components can be added, modified, or removed from the application without affecting
    the application as a whole

    * Components can only call their own methods and the methods provided to them
    through their instance of the sandbox module'
  merge: -1
  pgno: 170
- img_proc: true
  md: '+   - Components cannot access DOM elements outside of their own container


    +   - Components should not create global objects


    +   - Each module and component only does limited tasks and only things which
    are directly related to its own functionality


    +   - All the components in the application are loosely coupled with the rest
    of the application


    +   - Components can only communicate with other components and other pieces of
    the application using a publish-subscribe model (the mediator pattern) and their
    sandbox instance, preserving the loose coupling architecture


    +   - Each component has a very limited understanding of the application, and
    that through the instance of the sandbox module which was assigned to it during
    the registration phase of the component with the application


    The following can be considered the advantages that modular architecture provides
    for us:


    +   - Once the modular architecture ecosystem has been developed, it can be used
    for many applications; therefore, we can code once and use many times


    +   - Each piece of the application can be tested separately


    +   - Each piece of the application can be implemented by different people in
    a modularized fashion


    +   - Third party external dependencies can be controlled and managed by the core
    module


    +   - Modules and components can be replaced, modified, or removed without affecting
    the application as a whole


    +   - Components and modules can be loaded dynamically and as needed after the
    application start-up phase


    I hope you view the points above as important takeaways from this chapter and
    will keep them in mind as we move forward to a more in-depth look at the application''s
    implementation in the next chapter.'
