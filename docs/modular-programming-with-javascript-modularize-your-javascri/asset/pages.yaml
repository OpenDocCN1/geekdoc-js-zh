  md: "# Publish-subscribe implementation in MainCore\n\nAs previously mentioned,\
    \ the goals of our application design has been to create loose coupling among\
    \ the application modules.\n\nWe have also talked about the fact that our application\
    \ modules are not aware of each other, they need to be able to communicate with\
    \ one another in an indirect manner.\n\nThese goals can be achieved by leveraging\
    \ the Mediator design pattern and implementing a publish-subscribe mechanism around\
    \ that pattern.\n\nAs we saw in the previous chapter, in Mediator patterns pieces\
    \ of the application do not directly register with each other for custom events.\
    \ Instead, they register for these events and are notified of the broadcast of\
    \ such events through an intermediary piece. In our application, the intermediary\
    \ piece is MainCore module.\n\n> If you are not familiar with mediator or publish-subscribe\
    \ patterns, I highly recommend JavaScript Design Patterns by Simon Timm, which\
    \ discusses many popular patterns as well as mediator pattern. You can find this\
    \ book at the following link: https://www.packpub.com/application-development/mastering-javascript-design-patterns\n\
    \n# Registering components for custom events\n\nThe following method in MainCore\
    \ module is used for registering components to receive custom events:\n\n```\n\
    var registerForCustomEvents = function (componentID,eventsObj) {\n  if (typeof\
    \ componentID === 'string' &&\n  typeof eventsObj === 'object') {\n    for(var\
    \ i=0; i< Core.registeredComponents.length; i++){\n      if(Core.registeredComponents[i].id\
    \ === componentID {\n        Core.registeredComponents[i].events = eventsObj;\n\
    \      }\n    }\n  } else {\n    Core.log(3,'Incorrect parameters passed in,\n\
    \    from registerForCustomEvents');\n  }\n}\n```\n\nAs you can see, this method\
    \ registers the custom event object passed to it with the component, which needs\
    \ to be notified when the event is published."
  merge: -1
  pgno: 201
- img_proc: true
  md: "For instance, content component registers for the following events:\n\n```\n\
    registerForCustomEvents : function() {\n  sandBox.registerForCustomEvents({\n\
    \    'img-Clicked': this.updateContentPage,\n    // handles image click\n    'page-Changed':\
    \ this.updateContentPage,\n    // handles back and forward buttons\n    'favorites-clicked':\
    \ this.updateContentPage\n  });\n};\n```\n\nWhen any one of the preceding events\
    \ is published, the bound event handler method for that event is called\n\nNotice\
    \ that in the code above, no component ID is passed to the Sandbox module by the\
    \ component. The Sandbox module instance associated with this component sends\
    \ the required component ID to MainCore as follows:\n\n```\nregisterForCustomEvents\
    \ : function(eventObj) {\n  if (eventObj && typeof eventObj === \"object\") {\n\
    \    Core.registerForCustomEvents(componentID, eventObj);\n  } else {\n    Core.log(3,\
    \ \"incorrect parameter passed in; from Sandbox.registerForCustomEvents\");\n\
    \  }\n};\n```\n\nWe will talk about how the Sandbox instance is aware of the component\
    \ ID, when we talk about Sandbox module later in this chapter.\n\n# Broadcasting\
    \ custom events by components\n\nWhen components need to publish custom events\
    \ in the application, they do so by using publishCustom method in MainCore module.\n\
    \nConsider the following code for this method:\n\n```\nvar publishCustomEvent\
    \ = function(eventObj) {\n  for(var i=0; i<Core.registeredComponents.length; i++)\
    \ {\n    if (Core.registeredComponents[i].events && Core.registeredComponents[i].events[eventObj.type])\
    \ {\n      Core.registeredComponents[i].events[eventObj.type](eventObj.data);\n\
    \    }\n  }\n};\n```"
