  md: '# Designing Simple Modules


    The overall architecture of our application is based on Single Page Application
    (SPA) design concepts. If you are not familiar with this term, the idea is that
    as we navigate through our application pages (views), we won''t need to load or
    build the parts of the page that don''t change from one view to the next. We simply
    update the changed pieces of the view dynamically on the client while keeping
    the rest of the view untouched.


    Since we only targeted changes in our application''s initial load, the rendering
    of our views will be more robust and optimized.


    This also means that after the application''s initial load, the client will only
    be requesting the changed parts of the application from the server. Therefore,
    we will only transferring the page fragments over the bandwidth as opposed to
    the full page. Generally speaking, this can be a great advantage when we design
    applications that need to operate in limited bandwidth scenarios, such as mobile
    applications.


    For our application in this book, our page fragments are transferred as object
    definitions to the client side and our view-generating specialized modules will
    render the views based on such object definitions.


    You will see how we can achieve this in the future as we move forward.


    # Designing our SPA main pieces


    When designing SPA applications, I create a core application code base which is
    loaded in the browser at the application''s initial load phase. This code base
    provides application-level functionality that is independent of the application''s
    views. The view architecture consists of many modules that are loaded together.
    If you are familiar with Model-View-Controller (MVC) or Model-View-Wildcard (MV*)
    application design patterns, this code is essentially the controller of the application.


    > MVC and MV* design patterns

    These patterns create a good degree of specialization and separation of concerns
    in the code. Understanding these patterns is important in creating a good application
    architecture. While I will referring to these patterns from time to time, covering
    them in depth is beyond the scope of this book.

    I recommend the following resources for more information:

    https://www.packpub.com/application-development/mastering-javascript-design-patterns/

    https://addysmani.com/blog/understanding-mvc-and-mvp-for-javascript-and-backbone-developers/'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'The model and views of the application also have their own specialized modules,
    some of which are loaded at the initial application load time and some as needed,
    dynamically, at a later time. This type of approach enables the application to
    have a small footprint in the browser and only load what it needs.


    I usually try to have every page of my application as a separate module (component)
    on both the server and the client side. This provides the capability to create,
    modify, or remove pages (components) and their related code affecting other pieces
    of the application.


    Note that I''m using the term "module" here as a general term and it does not
    necessarily mean modules that are built using the module pattern. My intent is
    to convey the idea that each page is a separate piece in the application, within
    which one or many modules can be used to do the work related to that page and
    that page. If you are not sure exactly what this means, rest assured it will become
    more clear to shortly.


    The following figure depicts the main pieces of our application for this book,
    categorized by their special functionality and design:


    ![](img/7ce8facf2661aaaf5010fe7a99cadff7_79_0.png)


    As the figure shows, our overall design is based on three main pieces: **Controller**,
    **View**, and **Model**. In the rest of this chapter, we will talk about each
    piece and start building them based on our modular architecture.


    # # Application controller


    The controller is the piece that contains the main functionality of the application.
    Essentially, the controller module is the brain of the application. It will consist
    of application-level modules that provide application-level functionality. This
    piece will also be responsible for initializing all the other modules and components
    in the application as well as gluing them together using a loose coupling approach.'
