  md: "# Chapter 2\n\n```\nChildType.prototype = new BaseType();\n\nChildType.prototype.getChildValue\
    \ = function() {\n  return this.childValue;\n};\n\nChildType.prototype.getBaseValue\
    \ = function() {\n  return this.childValue;\n};\nvar childInstance = new ChildType();\n\
    console.log(childInstance.getBaseValue()); // displays 50\n```\n\nThe call to\
    \ childInstance.getBaseValue will now return the value 50 instead of 2. This is\
