  md: '# Cloning, Inheritance, and Submodules


    If we consider cloning as copying all the properties of an object to another object,
    we can categorize cloning into two types:


    +   - Shallow cloning

    - Deep cloning


    # Shallow cloning and deep cloning


    Shallow cloning copies all the top-level properties of the original object, but
    if this object contains other reference types, only the references of these reference
    types are copied to the newly created clone, as opposed to the actual reference
    types. This type of cloning is used when we want to have separate copies of the
    primitive types in the new object but we want the original object, and the newly
    cloned object, to share the same reference types.


    Deep Cloning on the other hand, copies all the primitive type properties of the
    original object into the new object as well making copies of all the reference
    types of the original object in the new object.


    The important distinction is that true copies of the reference types are created
    in the new object and not just the references (the memory addresses) of the reference
    types. This type of cloning is desirable if we want to have two distinct objects
    with no ties between them of any kind. Deep cloning is generally considered slower
    than shallow cloning and consumes more resources.


    To implement either of the cloning types, we can leverage one of the following
    approaches:


    +   - Use a third-party library such as jQuery or lodash

    - Use the JSON exploit hack

    - Create our own custom clone method


    # Using external libraries for cloning


    jQuery provides the extend method which enables us to create both shallow and
    deep cloning of objects.


    The general format for the extend method is as follows:


    ```

    jQuery.extend( target [, object1 ] [, objectN ] );

    ```'
