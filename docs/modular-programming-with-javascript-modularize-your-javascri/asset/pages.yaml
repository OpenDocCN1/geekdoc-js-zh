    # Writing unit tests using third party frameworks


    While it is possible to write our unit tests using only JavaScript and no third-party

    frameworks, it is a lot of manual work, even when writing a few simple tests.


    Our approach in the previous section for writing unit tests was a good exercise

    but I think we can do much better by leveraging third-party frameworks designed

    sspecifically for this task. These frameworks enable us to write more sophisticated
    tests

    with less effort.


    In this section, I will introduce you to two very popular third-party frameworks,
    which

    allow us to write clean, clean, and professional-grade unit tests.


    The goal is to give you a good starting point and provide you with a general

    overview of each library, but we will not explore any of them in great depth.

    Nevertheless, I''m hoping to get you excited about using third-party unit

    testing libraries (frameworks) that you will spend some time getting to know them

    better on your own and use them in your future projects.


    # Introduction to Jasmine


    Jasmine defines itself as "a behavior-driven development framework for testing

    JavaScript code."


    Jasmine does not require a DOM and can be used for writing and running JavaScript

    unit tests both on the server and client side.


    Setting up Jasmine is especially on the client side, and is created in a way that

    provides all the functionality that you may require from a professional-grade
    testing

    framework in one package. I think you will find the syntax quite intuitive and
    easy

    to follow.


    I personally like Jasmine quite a bit and am very grateful to its creators for
    providing

    uus with such a great tool.


    > In this section, I''ll be using Jasmine 2.4 and encourage you to

    visit the related site at: http://jasmine.github.io/.


    ![](img/7ce8facf2661aaaf5010fe7a99cadff7_233_0.png)


    — 215 —'
