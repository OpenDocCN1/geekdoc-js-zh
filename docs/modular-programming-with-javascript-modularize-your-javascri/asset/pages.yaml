  md: "This call is shown as follows:\n\n```\nImagesInc_Core.loadComponent(ImagesInc_GlobalData\n\
    .getNotificationWidgetID(), self.renderWidget());\n```\n\nNow the control is given\
    \ to MainCore module to load the component (widget) dynamically. This is done\
    \ by by first finding the object definition for the component in the browser's\
    \ local storage.\n\nLet's first have a look at how the local storage is populated\
    \ with the components' object definitions.\n\n# Storing object definitions in\
    \ local storage\n\nThe application has been designed to find the object definitions\
    \ for all the dynamically loaded components, in the browser's local storage.\n\
    \nHowever, these definitions are in fact implemented in PageDefinitions.js file.\n\
    \nWhen PageDefinitions.js file is loaded, it uses an IIFE to store object definitions\
    \ in the browser's local storage, as follows:\n\n```\nfunction() {\n\nvar NotificationWidgetDefinition\
    \ = {\n  componentID: \"notificationWidget\",\n  scriptFile: \"NotificationWidget.js\"\
    ,\n  cssPath: \"/js/widgets/*\",\n  cssFile: \"NotificationWidget.css\",\n  cssPath:\
    \ \"css/\"\n};\n\n...\nImagesInc_Core.saveValueToLocalStorage(ImagesInc_GlobalData\n\
    .getNotificationWidgetID(),NotificationWidgetDefinition);\n\n...\n}();\n```\n\n\
    After the browser's local storage is populated with the object definitions, the\
    \ file is removed from the browser's cache as it can potentially be large and\
    \ consume a significant amount of memory. This design allows us to minimize the\
    \ use of the browser's cache, which could be of particular interest on mobile\
    \ devices, where resources are limited."
