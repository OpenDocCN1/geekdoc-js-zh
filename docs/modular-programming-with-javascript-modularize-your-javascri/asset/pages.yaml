  md: "# Dynamically loading component's resources from the server\n\nOnce a component's\
    \ object definition has been extracted from the local storage, its required .js\
    \ and .css files are loaded from the storage using the following method:\n\n```\n\
    mainCore.loadComponentFilesAndInitializeWithCallback =\n  function(pageDefinitionObj,\
