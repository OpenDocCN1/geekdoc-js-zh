  md: "# Handling the Add To Favorite link click event\n\nIn `handleFavLinkClick`\
    \ we check the state of the **Add to Favorites** link and change its text to **Remove\
    \ from Favorites**. If the link has already been clicked, and it contains the\
    \ **Remove from Favorites**, we re-set the text to its default value of **Add\
    \ to Favorites.**\n\nWe also add or remove the ID of the favorite image in the\
    \ browser's cookie, when the user navigates to the **Favorites** page, the correct\
    \ favorite images are rendered in the content area.\n\nConsider the implementation\
    \ of this method:\n\n```\nhandleFavLinkClick: function (elem) {\n    var anchorState,\
    \ parentNode, anchorID;\n    anchorState = elem.getAttribute('data-state');\n\
    \    anchorID = elem.getAttribute('id');\n    parentNode = sandbox.getParentNode(elem);\n\
    \n    if (anchorState) {\n        sandbox.removeFromCookie(favCookieName, anchorID);\n\
    \        sandbox.updateElement(parentNode);\n        sandbox.contextObj.getAnchorHTMLStr(anchorID);\n\
    \    } else {\n        sandbox.populateCookie(favCookieName, anchorID);\n    \
    \    sandbox.updateElement(parentNode);\n        sandbox.contextObj.getAnchorHTMLStr(anchorID,\
    \ true);\n    }\n    sandbox.publishCustomEvent({\n        type: 'FavLink-Clicked',\n\
    \        data: anchorID\n    });\n}\n```\n\nAs you can see, there is also one\
    \ other thing that we do in this method, which is to broadcast the related custom\
    \ event to the application. This allows all the other pieces of the application\
    \ which are registered for this event to be informed of the event taking place\
    \ in this component."
