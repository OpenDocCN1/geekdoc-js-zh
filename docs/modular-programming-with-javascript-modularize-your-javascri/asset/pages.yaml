  md: "# Chapter 2\n\nWhen we create a variable inside a function using the keyword\
    \ var, we are creating a private variable inside of function, thus the scope of\
    \ the variable is contained within the function. This also means that, if we use\
    \ the function as a constructor function, variables are not copied to the instances\
    \ created using this constructor function.\n\nAlso, JavaScript does not have the\
    \ concept of block scopes; instead it has function scope, so all the variables\
    \ declared inside a function are accessible throughout the function block (ECMAScript\
    \ 6 introduced block scopes).\n\nLet's consider the following function declaration:\n\
    \n```\nfunction simpleFunc() {\n  var firstValue = 1;\n  var secondValue = 2;\n\
    \  this.instanceValue = 100;\n\n  for(var i=0; i<5; i++) {\n    var thirdValue\
    \ = firstValue + secondValue + i;\n  }\n\n  // displays \"The final value of thirdValue\
    \ is:52\"\n  console.log(\"The final value of thirdValue is:\" + thirdValue);\n\
    }\n\nsimpleFunc();\n```\n\nAs you can see, the thirdValue variable has been defined\
    \ within the for loop block, but we can access it after the end of the for loop,\
    \ since in JavaScript the scope of variables is bound to the scope of the container\
    \ function and not the container block.\n\nOf course, code external to this function\
    \ cannot access such variables, as shown:\n\n```\nconsole.log(simpleFunc.firstValue);\
    \ // displays undefined\n```\n\nAs expected, the above code will produce undefined\
    \ in the console.\n\nWe also cannot get access to this.instanceValue since inside\
    \ a function this references the window object, as shown:\n\n```\nconsole.log(simpleFunc.instanceValue);\
    \ // displays undefined\n```\n\nWhat happens if we use the preceding function\
    \ as a constructor function and create an instance of we simpleFunc object?\n\n\
