  md: "# Review of Important JavaScript OOP Concepts\n\nSince the innermost function\
    \ is an anonymous function inside another anonymous function, the context of the\
    \ innermost function is different from the object that is hosting it. Therefore,\
    \ this in this context is referencing the global context.\n\nIn order to preserve\
    \ the context of myOwnObject, we can create a context in the first inner function\
    \ and let the innermost function access this context. So we can rewrite our object\
    \ definition as:\n\n```\nvar name = \"The window global\";\nvar myOwnObject =\
    \ {\n  name: \"My Own Object\",\n  getName: function() {\n    var that = this;\n\
    \    return function() {\n      return that.name;\n    }\n  }\n};\n```\n\n```\n\
    console.log(myOwnObject.getName()); // displays \"My Own Object\"\n```\n\nUsing\
    \ this approach, we create a context inside the first inner function which references\
    \ our object and the innermost function can access this context, which is defined\
    \ in its container (the first anonymous function). This results in the innermost\
    \ anonymous function accessing the context of myOwnObject object.\n\nAs shown,\
    \ it can be a little challenging to figure out what context refers to at times\
    \ with practice and more experience you will feel better at it. However, till\
    \ don't take the context of this for granted and make sure that the context which\
    \ you think refers to is in fact the context that has been set for this in the\
    \ code.\n\n# Closures\n\nNow that we have a brief discussion regarding execution\
    \ context as it relates to this, it is time to talk about Closures. If you don't\
    \ have a lot of experience with JavaScript, or if you are coming from more classical\
    \ object oriented languages as C++, you might find the concept of Closures a bit\
    \ confusing in the beginning. In this section, I will try to tackle the mystery\
    \ of this concept and explain why Closures can be very useful in our code.\n\n\
    The main idea behind Closures is about preserving context and (mostly) how an\
    \ inner function can keep the context of its containing parent."
