  md: '# Summary


    In this chapter, we looked at one of the most popular design patterns in JavaScript:
    module pattern.


    By creating simple modules, we explored various aspects of internal private scope
    in module pattern and saw how modules can interact with each other, without having
    access to the protected properties of each other''s private scope.


    This pattern allows us to create encapsulation and access control in our objects
    and modules, while providing an interface for the external code to leverage the
    implemented functionality for external use.


    One of the most important aspect of module pattern is how it can be used to create
    a modular design for our application as a whole. This enables us to create loose
    coupling among our modules, which are essentially the building blocks of our application.


    In later chapters, we will utilize this approach and slowly build more complex
    modules to create a robust and easily maintainable code base for our application.
    These modules can also be easily reused as needed, in all of our future applications.'
