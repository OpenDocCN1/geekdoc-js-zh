  md: "# Tight augmentation of modules\n\nSo far in this chapter, we have talked about\
    \ what module augmentation is in general and have also covered the loose augmentation\
    \ technique. It is time to explore a different technique used in augmenting modules,\
    \ known as tight augmentation.\n\nYou might wonder if tight augmentation is the\
    \ opposite of loose augmentation, and you are correct to think that, but with\
    \ a couple of considerations which we will tell you a little later.\n\nTight augmentation\
    \ is used for adding properties (functionality) to our modules when we do to enforce\
    \ a set order of file loading and code execution, and therefore it is less flexible.\
    \ This type of augmentation is usually used when we need to make sure that a certain\
    \ property from the original module is available for our augmenting code.\n\n\
    # Tight augmentation of ImagesInc_GlobalData\n\nConsider our augmenting code for\
    \ ImagesInc_GlobalData from the previous section, where loose augmentation was\
    \ being used. As mentioned previously, since we are passing a reference to ImagesInc_GlobalData\
    \ or an empty anonymous object into the IIFE, we can load our original module\
    \ and our augmenting code in any order that we would like.\n\nThis was shown as\
    \ follows:\n\n```\nvar ImagesInc_GlobalData = (function(coreModule {\n  coreModule.someText\
    \ = \"this is a test for\\nloose module augmentation\";\n  coreModule.getExtendedModuleMsg\
    \ = function(){\n    ImagesInc_LoggingHandler.logInfo(coreModule.someText);\n\
    \  };\n\n  return coreModule;\n}\n)(ImagesInc_GlobalData || {}));\n```\n\nHowever,\
    \ this means that if we wanted to override one of the original module's properties,\
    \ depending on what code gets loaded and executed first (the original module or\
    \ the augmenting code), our 'override' might be overridden by another piece of\
    \ code, unintentionally and unexpectedly."
  merge: -1
  pgno: 107
- img_proc: true
