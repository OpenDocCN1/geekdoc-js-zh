    \ no way of making sure that our original module is loaded before the augmentation\
    \ code enhances the module.\n\nOne of the beautiful and powerful aspects of JavaScript\
    \ is its ability to add properties dynamically, at any time code execution. This\
    \ allows us to add functionality or modify our original module's implementation\
    \ even before the module is loaded, as long as we provide a temporary object in\
    \ the absence of the module. This temporary object will be added to the original\
    \ module after the module is loaded (or more accurately, it becomes one with the\
    \ original module).\n\nIf it sounds complicated, it is really simpler than you\
    \ think. Let's revisit our previous augmentation code and examine it little closer:\n\
    \n```\n(function(coreModule) {\n  coreModule.someText = \"this is a test for module\
