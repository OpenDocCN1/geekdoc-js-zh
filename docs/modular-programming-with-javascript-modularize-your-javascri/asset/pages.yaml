  md: '# Chapter 7


    The preceding method has been provided to our components through the sandbox module.
    This method does a simple parameter check to make sure that the parameter, as
    well as the correct type of the parameter, has been passed to it by the component
    before the sandbox module asks the core to do the work.


    While the core module might have its own error checking, it is always a good idea
    to do some error checking at the sandbox level before getting the core module
    involved.


    # Implementing multiple instances of the sandbox module


    You may be wondering at this point, why it is a better idea to use multiple instances
    of the sandbox module (one for each component) as opposed to having all the components
    use the same sandbox object as a singleton?


    The short answer is: better isolation and performance. We need to explore that
    answer a little further in the upcoming sections.


    # Advantages of multiple instances of the sandbox


    Usually, a module provides its exposed functionality to the outside world through
    a single common interface.


    However, our implementation of the sandbox module is different. As mentioned previously,
    we create multiple instances of the sandbox module and, to be more precise, one
    instance per component.


    The following summarizes the goals behind this design:


    +   - Isolating sandbox instances from each other

    - Creating a code execution context for each component

    - Performance improvements


    # Isolating the sandbox instances from each other


    In our analysis of a kid playing in a sandbox, I mentioned that this type of isolation
    contains the possible mess created in the box. In the same way, we would like
    any possible damage to a sandbox module instance to be contained and isolated.


    This would mean that, if one of our components does something undesirable which
    could cause issues in its sandbox instance, such a mess would be contained within
    that sandbox module instance. The adverse effects will only impact the functionality
    of that component but no other sandbox instances, or any other components for
    that matter.'
