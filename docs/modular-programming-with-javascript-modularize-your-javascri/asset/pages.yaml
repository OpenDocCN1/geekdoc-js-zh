    ease of demonstration).


    # # Loading ImagesInc_GlobalData augmenting code


    To examine how augmentation enforces a set of script loading and code execution,
    we can change our index.html as follows:


    ```

    <script type="text/javascript" src="/js/Modules_3.js"></script>

    <script type="text/javascript" src="/js/Modules_2.js"></script>

    <script type="text/javascript" src="/js/Modules_js"></script>

    ```


    As you can see, we are no longer loading the Modules_3_js file asynchronously
    and it will be the first module-related file that gets loaded. Considering that
    we have modified the augmenting code in this file to only augment the module when
    the module [ImagesInc_GlobalData] is already present in the global scope, an error
    message will be logged and an alert box in the browser when we load the page.


    Because we are using the tight augmentation technique now, we need to load this
    augmenting code after either Modules.js or Modules_2.js. This is necessary so
    we can be sure that the ImagesInc_GlobalData module (object) is already present
    in the global scope.


    Also, in order to override the value of someText by using the code in Modules_3_js,
    this property is added in Modules_2_js, we need to load both Modules.js and Modules_2.js
    first. This is the only way we can guarantee that an override of the value of
    someText is taking place intended. Therefore, to achieve the override, we need
    to modify the loading order of our scripts as follows:


    ```

    <script type="text/javascript" src="/js/Modules.js"></script>

    <script type="text/javascript" src="/js/Modules_2.js"></script>

    <script type="text/javascript" src="/js/Modules_3.js"></script>

    ```


