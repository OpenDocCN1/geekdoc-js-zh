  md: '# Chapter 7


    For instance, imagine that we like all the error messages in the application to
    be logged on the server. This could mean that for each error, an AJAX call needs
    to be made from the client to the related information.


    If each module wanted to do that task itself, we would have to implement functionality
    for each module separately. Of course, it makes more sense to implement this functionality
    once and then provide it to all of the modules in a coherent manner.


    Have a look at the following screenshot, which displays the application messages
    being logged in the Chrome debugger tool when the application is in the debug
    mode:


    ```

    Core Module has been initialized... Logger, s:25

    LoggingModule has been initialized... Logger, s:27

    UtilitiesModule has been initialized... Logger, s:27

    ComponentModule has been initialized... Logger, s:27

