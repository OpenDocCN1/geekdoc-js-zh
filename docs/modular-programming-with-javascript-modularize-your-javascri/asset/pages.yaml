- img_proc: true
  md: 'Base, Sandbox, and Core Modules


    I should also mention that the architectural design concepts discussed in this
    chapter, and the next, are based on the design principles that I was originally
    introduced to by Nicholas C. Zakas, after watching one of his talks on the subject.
    He is one of my favorite authors and speakers. While our implementation will slightly
    deviate from his, the essence of our architecture will remain similar to his proposed
    architectural design.


    # # Application architecture overview


    To create a truly modular design for our application, we need to break it down
    into smaller functions, in such a way that each piece will specialize in and be
    responsible for very specific tasks. This enables us to achieve the principle
    of separation of concerns and responsibilities.


    The following diagram provides a depiction of our overall application design:


    ![](img/7ce8facf2661aaaf5010fe7a99cadff7_140_0.png)


    As you can see, our application consists of four main pieces:


    +   - Base

    - Sandbox

    - Core

    - Component'
