  md: '# Components


    The main piece of our application design is related to components. In this section,
    we will cover how components are built and plugged into our application.


    Remember that we considered components as pieces of the application that have
    views. By views, I am referring to the pieces that have HTML elements associated
    with them which are rendered in the browser and the users can interact with them
    directly.


    Components can be as simple as a layover box. Such simple components can be rendered
    as part of another component or as a stand-alone component on their own.


    Most of the time, our components are independent modules with their own MVC or
    MV* architecture, which are attached to the application and use the facilities
    and functionality that the rest of the application provides for them.


    In our design, we created three main components and a named NotificationWidget.
    This widget is also a component but it is loaded and viewed based on the user''s
    interaction with another component. In our application, NotificationWidget is
    launched when the user clicks on the Support link in the footer component. Since
    this widget can potentially be launched by other components too, I am tagging
    it as a widget for all practical intents and purposes, it is also a component
    with its own MV* implementation.


    Components can have very sophisticated business logic implemented in their controller,
    or have a very simple controller with very little functionality.


    In our application, the content component is an example of a component with a
    fairly involved controller logic, and the footer stands as a component with a
    relatively simple controller.


    Also remember that the only bridge or point of connection between a component
    and the rest of the application is an instance of the sandbox which was passed
    to it when the component registered itself with the core.


    We previously talked about how, in our architecture, components can be loaded
    either at the start-up phase of the application or dynamically at any time after
    that. In our implementation, header, footer, and the content components are loaded
    at the start-up phase and NotificationWidget is loaded dynamically, when required.


    Let''s have a look at one of our simpler components, the footer, and see how it
    is implemented.'
  merge: -1
  pgno: 166
- img_proc: true
  md: "# Components required methods\n\nIn our design, there are two required methods\
    \ that every component needs to implement in order to register and connect with\
    \ the core module and the rest of the application.\n\nThese two required methods\
    \ are called init and the destroy methods. The init method is called by the core\
    \ module to start the initialization of the component. On the other hand, the\
    \ destroy method is called by the core module to disable or completely remove\
    \ the component from the application.\n\nConsider the implementation below:\n\n\
    ```\ninit: function() {\n  try{\n    sandbox.updateElement(\"footerContainer\"\
    ,\n    ImagesIncGlobalData.getFooterHTMLTxt());\n    this.registerForEvents();\n\
    \    sandbox.contextObj = this;\n    sandbox.logMessage(1,'Footer component has\
    \ been initialized..', 'blue');\n  } catch(e) {\n    sandbox.logMessage(3,'Footer\
    \ component has NOT been initialized correctly --> ' + e.message);\n  }\n},\n\
    ,\n\ndestroy: function(removeComponent) {\n  sandbox.contextObj.unregisterFromEvents();\n\
    \  sandbox.unregisterAllCustomEvents();\n\n  if(removeComponent) {\n    sandbox.removeComponent(\"\
    footerContainer\");\n  }\n  sandbox.logMessage(1,'Footer component has been destroyed..',\
    \ 'blue');\n}\n```\n\nAs you can see, in the init method of the footer component,\
    \ the required HTML string is fetched from the GlobalData object. This object\
    \ is an application-level object (the application model) which holds application-level\
    \ data. The HTML string is then passed to the core module via the sandbox module\
    \ instance."
  merge: -1
  pgno: 167
- img_proc: true
  md: "# Base, Sandbox, and Core Modules\n\nNote that the core module is responsible\
    \ for rendering HTML elements, in this case\ntfooter's view, on the page.\n\n\
    This is done in the following lines of code in the init method:\n\n```\nsandbox.updateElement(\"\
    footerContainer\", ImagesInc_GlobalData.\ngetFooterHTMLText()());\n```\n\nFor\
    \ this particular component, we call for the rendering of the view in this method.\n\
    However, the rendering does not always have to be done in the init method of a\n\
    component. For instance, for NotificationWidget component, the rendering is\n\
    done in a different method which is called at some later time by the application.\n\
    Consequently, the init method of NotificationWidget is kept very simple, as\n\
    follows:\n\n```\ninit: function() {\n  try{\n    sandbox.contextObj = this;\n\
