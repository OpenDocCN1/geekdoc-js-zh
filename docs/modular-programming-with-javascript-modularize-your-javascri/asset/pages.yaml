  md: "# Creating our Mocha spec file\n\nThe setup for a Mocha spec file is very similar\
    \ to Jasmine's spec file. We create our test suites using the global describe\
    \ function and pass it a callback function that contains the code for assertions.\n\
    \nJust as Jasmine, we use strings to identify our tests and use it function to\
    \ write our assertions. Also, similar to Jasmine, we can use nested describe blocks,\
    \ and any variable defined in a describe block is available to all the assertions\
    \ in that block.\n\nHave a look at the following code snippet from our storageHandlersSpec.js\
    \ file as follows:\n\n```\nvar expect = chai.expect;\ndescribe(\"TestingHandler\
    \ Sub-module\", function() {\n  var storageHandler = ImagesInc_Core.StorageHandler;\n\
    \n  describe(\"saveValueLocalStorage Method\", function() {\n    it(\"should exit\"\
    , function() {\n      expect(storageHandler.saveValueLocalStorage).to.exit;\n\
    \    });\n  });\n});\n```\n\nNote that we have set the variable expect on chai.expect\
    \ global object, and then this variable is used in assertions.\n\nChai provides\
    \ a great set of matches which we can use in writing our unit tests. However,\
    \ the set of matches provided by Chai is not as complete as Jasmine.\n\nFor instance,\
    \ to use spies, stubs, and mocks, which are considered more advanced testing features,\
    \ we need to use a different library such as Sinon.\n\nSince such features are\
