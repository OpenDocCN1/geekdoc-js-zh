    Of course, this type of augmentation can just as easily be done when the original
    module and the augmenting code are in the same file. It is good to have the flexibility
    to pick and choose which approach we would like to take: to either the original
    module and its augmenting code in separate files or in the same file.


    We will soon talk about this type of augmentation in greater depth, and will even
    give it a technical name.


    # The order of things in module augmentation


    When we added Modules_2.js file to our index.html, I mentioned that we need to
    load this file after we load Modules.js file for things to work properly.


    The reason for this is not to discover. If the order of loading these files is
    reversed, and subsequently the order of the code execution, we will be trying
    to add properties to an object (ImagesInc_GlobalData) that does not exist yet,
    which will result in a code execution error.


    There are ways we can work around this, which brings us to our next topic, loose
    augmentation.


    # Loose augmentation of modules


    When we try to enhance a module using the augmentation technique previously discussed,
    we pass a reference of the module to another part of our code which is responsible
    for doing the augmentation work.


