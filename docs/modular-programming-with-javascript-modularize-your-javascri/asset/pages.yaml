  md: "# Module Design Pattern\n\nWhen we call the `initializeAllModules` method in\
    \ our application (on the core module), a `for` loop is used to call the `initialize`\
    \ method on all the registered modules. This is done as follows:\n\n```\ninitializeAllModules:\
    \ function() {\n\n  for(var module in registeredModules) {\n\n    registeredModules[module].initialize();\n\
    \  }\n};\n```\n\nAs you can see, `initializeAllModules` has no idea what each\
    \ registered module's `initialize` method does when it is called. All it knows\
    \ is to call the `initialize` method on the registered module and let the module\
    \ take care of its own initialization tasks.\n\nThis is a very important point\
    \ when we modularize our code. Each module only deals with tasks that are specific\
    \ to the module's design and none of the other modules have any knowledge of how\
    \ such tasks are done in module.\n\nThis means, while our core module calls the\
    \ `initialize` method on one or many modules, it does not directly get involved\
    \ with the initialization tasks of each module.\n\nIt is time to run a test and\
    \ see how application initialization takes place. Consider the following:\n\n\
    ```\n// displays\n// testmodule has been initialized\"\n// module name is: Module\
    \ 1\n// testmodule2 has been initialized\"\nApplicationInitModule.initializeAllModules();\n\
    ```\n\nWhen we are running the code, we can see that both of our modules report\
    \ that they have been successfully initialized.\n\nOf course, we have designed\
    \ our application in such a way that all the registered modules have an accessible\
    \ method called `initialize`. This allows us to use an array and a `for` loop\
    \ to initialize them all in sequence."
