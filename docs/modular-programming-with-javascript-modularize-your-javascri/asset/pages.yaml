- img_proc: true
  md: "# Setting paths in the config object\n\nThe next property set in the configuration\
    \ object passed to require.config method is paths property. This property itself\
    \ is an object and it's where we define the paths to our dependencies. For instance,\
    \ see the following snippet:\n\n```\n'person2': 'modules/person2'\n```\n\nHere\
    \ we tell RequireJS that when it needs to load person2, it can find it in modules/person2.js\
    \ file. Remember that we do not provide the file extension for the file in this\
    \ property.\n\n# Creating shims for non-AMD modules\n\nThe next property that\
    \ we define in object passed to require.config method is shim property.\n\nshim\
    \ property is an object too and is used to provide configuration settings for\
    \ non-AMD modules.\n\nFor instance, see how we are configuring person3 module\
    \ in the following code snippet:\n\n```\n\"person3\": {\n  deps: ['person4'],\n\
    \  // none AMD module, depending on another\n  non AMD module\n  \"exports\":\
    \ \"person3\"\n}\n```\n\nWe tell RequireJS that, when you want to load person3\
    \ module as a dependency, first you need to load person4 (using deps property),\
    \ and then the consuming modules declare this module as a dependency using the\
    \ keyword person3.\n\nConsider how stuff module declares and consumes person3\
    \ as a dependency in the following code snippet:\n\n```\ndefine(['person3'], function(person3)\
    \ {\n  console.log(person3.first\n    --> Accessing person3.first from stuff*);\n\
    \  return {\n    likes: ['Car', 'Bike', 'Scooter']\n  };\n});\n```\n\nIn this\
    \ way, we can load and consume non-AMD modules asynchronously, thanks to RequireJS."
