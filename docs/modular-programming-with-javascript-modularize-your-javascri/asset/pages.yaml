  md: '# Generating the Header fragment dynamically


    As you saw previously, our application''s controller has a module that specializes
    in generating page fragments on the page and it is called PageUpdater.


    Consider the following code snippet:


    ```

    PageUpdater.updateElement("headerContainer",

    headerContainerDef.sectionHTML);

    ```


    As you can see, we have used our application''s PageUpdater module and have passed
    the id of the Header fragment as the first parameter to its updateElement method.
    The second parameter to this method is the object definition for the Header fragment.
    This implementation allows us to leverage the functionality of our application''s
    controller to render the Header fragment.


    Of course, we can use the same approach to create other parts (fragments) of our
    page, such as the footer, as follows:


    ```

    PageUpdater.updateElement("footerContainer",

    footerContainerDef.sectionHTML);

    ```


    The following screenshot shows how the index.html page for our application is
    displayed when the page fragments have been rendered on the page:


