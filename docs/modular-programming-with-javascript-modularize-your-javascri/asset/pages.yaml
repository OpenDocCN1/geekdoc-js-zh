  md: "# Chapter 10\n\nIt would be nice if we could eliminate the need for having\
    \ all <script> tags and our boot-sequence in index.html. Also, it would be very\
    \ useful to implement a mechanism which could indicate and manage our modules'\
    \ dependencies.\n\nWell, we are going to achieve all that very soon!\n\nThe following\
