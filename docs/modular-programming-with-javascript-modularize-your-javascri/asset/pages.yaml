    # Design patterns in JavaScript


    > If you are not familiar with design patterns in general or would like to become
    more familiar with design patterns in JavaScript, I highly recommend the following
    resource:

    Mastering JavaScript Design Patterns, Simon Timms.


    ![](img/7ce8facf2661aaaf5010fe7a99cadff7_35_0.png)


    Notice that the call to the CreatePerson function takes place before the function
    definition. This will not generate an error when it is run because of function
    hoisting. Behind the scenes, the function CreatePerson has been hoisted to the
    top of the script when the call is made to this function, the declaration has
    already been encountered by the interpreter.


    Because of this mechanism, you don''t have to worry if the call to the function
    takes place before the function declaration or not.


    This does not apply to object literals since there are no function declarations,
    and thus, no hoisting involved. Therefore, all the calls to such objects need
    to happen AFTER the object definition.


