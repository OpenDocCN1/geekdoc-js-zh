  md: "Consider how ImagesInc_Core.LoggingHandler submodule is implemented in our\
    \ application:\n\n```\nImagesInc_Core.LoggingHandler = (function() {\n...\n  return\
    \ {\n    logMessage: self.logMessage,\n    initialize: self.initialize\n  };\n\
    })()\n```\n\nWe were using an IIFE to return an object as a property on ImagesInc_Core\
    \ global object (which is our MainCore module). This returned object is the interface\
    \ to the code inside of our IIFE namespace.\n\nTo convert this submodule to the\
    \ AMD module, we simply need to transfer the code which was originally inside\
    \ the IIFE to define method provided to us by RequireJS.\n\nConsider the following\
    \ code snippet:\n\n```\ndefine(['MainCore'], function(ImagesInc_Core) {\n...\n\
    \  return ImagesInc_Core.LoggingHandler = {\n    logMessage: self.logMessage,\n\
    \    initialize: self.initialize\n});\n```\n\nNotice that we are still returning\
    \ an object from the callback function and we are also assigning it to LoggingHandler\
    \ property of ImagesInc_Core object.\n\nThis approach allows us to easily convert\
    \ our non-AMD submodules into AMD modules, with very little modification. This\
    \ is mostly because, from the beginning, our architecture was designed to be a\
    \ modular-based architecture. Now, thanks to RequireJS we are able to load our\
    \ submodule files asynchronously, without the need to add them as <script> tags\
    \ to our index.html file."
