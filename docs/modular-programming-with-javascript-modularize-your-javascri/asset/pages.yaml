  md: '# Summary


    In this chapter, we tried to get an overview of the concepts behind modular programming
    in general and how such concepts can be used in JavaScript applications in particular.


    We saw that this approach is essentially based on creating packages of specialized
    code that do very very specific tasks.


    We also made parallels between how modules are designed in real life and our application
    modules, so that we can translate the similarities into our own application design
    approach.


    While the term ''module'' can be used to refer to different things in the code,
    we will take this terminology to refer to a certain style of programming and architecture
    in our JavaScript application design approach in later chapters.


    However, before we completely dive into the more technical aspects of JavaScript
    modular programming, it is a good idea to review the fundamentals of object-oriented
    programming in JavaScript in the next chapter. This will allow us to establish
    a solid foundation for more technical chapters as we move forward.'
