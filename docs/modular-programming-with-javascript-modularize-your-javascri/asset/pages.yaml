- img_proc: true
  md: '# Prelude to modular programming


    Many years ago, when I was taking my first computer programming course at college,
    I found myself having difficulty organizing organizing my code into functions
    and classes. I always wondered what kind of criteria I needed to qualify a chunk
    of code belong to a function or to a class or a subclass. When should I break
    down one function into multiple functions or a class into multiple?


    Of course, there were some rules and guidelines that I was familiar with such
    as "a function should not be too long or not do too many things; a class should
    be a blueprint of a data type" and so on. However, such rules and guidelines seemed
    abstract to me and I wanted to find a rule that was precise and applicable in
    all situations.


    As I became more knowledgeable in programming concepts and gained more experience
    in application design, I was able to write more sophisticated code and organize
    my code better into functions and classes.


    However, while my code was organized into well-defined functions and classes,
    such functions and still seemed scattered in different parts of the application.
    When I needed to make modifications to one piece of the application, I would be
    concerned about the impact that the change would have on other pieces and the
    functionality of the application as a whole.


    As my applications grew larger and became more complex, the impact of the changes
    and enhancements became even more pronounced. There were more things that could
    adversely affect the application if the application pieces were not designed properly.


    Browser-based applications were particularly vulnerable to such impacts as different
    parts of the application could be manipulating the same element in the browser,
    which would produce unexpected behaviors and effects in other parts of the application.


    On the other hand, making small changes to the application was a challenge on
    its own, finding the best place to make such small changes was not always obvious.
    Each piece of the application could be performing many different activities from
    manipulation DOM to writing to cookie to making AJAX calls.


    What if I could make one part of the application responsible for only one type
    of functionality? What if only one part of the application was responsible for
    all related functionality? What if only one piece made AJAX calls to the server
    and provide the other pieces of the application with the returned data?'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'As we design functions and classes to specialize in doing very specific tasks,
    we can also bundle functions and classes together to act as a specialized piece
    of the application responsible for providing one particular functionality. The
    key point here is to create specialized code packages.


    This would mean that changes in how we read and write to cookies would only take
    place in the package that is responsible for cookie operations and such changes
    would have no impact on AJAX calls to the server.


    If we organize our code into specialized packages, (or modules as we will call
    them) we can easily achieve this goal of separation of concerns and responsibilities
    among our application pieces.


    But before we organize our code into modules, we need to see how we decide that
    chunk of code should be a module.


    # The simple rule for creating modules


    I need to emphasize on the fact that modular programming is not some magical and
    mystical design concept and pattern that is hard to grasp and even harder to implement.
    It is really just a practical approach to organizing our code in such a way that
    each chunk of code only does a very specific and specialized task.


    The idea is that each module is a loosely coupled piece of the application, a
    building block, that with other pieces (and other modules), creates an ecosystem,
    that is your application.


    So here is the simple rule for creating modules: "If a piece of your application
    provides a specialized functionality, it can be made into a module that can also
    be reused in other applications."


    I previously mentioned that I was looking for a "precise" rule to help me organize
    my application code but as my experience has shown, there is no such precise rule
    other what I mentioned above, which is in fact no rule but a guideline. As a guideline,
    there is flexibility in what can be considered a module or not. This can be best
    decided at the design time and as the application evolves since the application
    needs change over time.


    # A real-life example of modules


    Let''s consider a familiar modular system. You are most likely reading this book
    in a place that has electricity and there are many electric outlets in the walls
    surrounding you. This system enables you to plug in various electrical devices
    into the outlets and each one of these devices is designed to do a very specific
    task.'
