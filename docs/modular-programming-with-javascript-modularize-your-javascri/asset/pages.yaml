  md: '# Constructor property


    Every object in JavaScript has a constructor property that references the constructor
    object that was used to create the instance of that object.


    For instance, in all functions, the constructor property has a reference to the
    Function type constructor. We could verify this by executing the following statement:


    ```

    console.log(ChildType.constructor); // references

    Function type constructor

    ```


    Since prototype property''s value is an object too, it also has a constructor
    property. However, this constructor property references the object (function)
    itself. If we examine this property before we assign the BaseType.prototype object
    to ChildType..prototype,


    ```

    console.log(ChildType.prototype.constructor); //

    references ChildType

    ```


    We can see that this property is referencing the object that prototype belongs
    to, in which in this case is ChildType.


    As mentioned previously, if we completely replace the prototype object, as in
    the case of the following statement, which was used in implementing our previous
    inheritance:


    ```

