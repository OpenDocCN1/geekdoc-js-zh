  md: "# Modular Application Design and Testing\n\nA test suite is constructed using\
    \ describe function of Jasmine framework. This function takes two parameters,\
    \ a string which describe the test suite and a callback function used to implement\
    \ the test suite itself. This is shown below:\n\n```\ndescribe(\"TestingHandler\
    \ Sub-module\", function() {\n  \n}\n```\n\nInside the callback function is where\
    \ we write our test specs. Keep in mind that we can nest describe functions too.\
    \ This means that we can use one describe function to create a test suite for\
    \ the whole module and nested describe functions inside to create test specs for\
    \ each individual method of the module. Also, any variables that we declare inside\
    \ a describe function is available to all the specs which reside inside describe\
    \ block.\n\nLet's have a look at our first spec for CookieHandler sub-module:\n\
    \n```\nvar cookieHandler = ImagesInc_Core.CookieHandler;\ndescribe(\"createCookie\
    \ Method\", function() {\n  it(\"should exist\", function() {\n    expect(cookieHandler.createCookie).toBeDefined();\n\
    \  });\n});\n```\n\nAs you can see, we have used the outer describe function to\
    \ encapsulate all the unit tests related to CookieHandler sub-module. Inside that,\
    \ we are using another describe function to write the related specs for createCookie\
    \ method of this sub-module. The it is where we write our expectations, which\
    \ are our assertions about the method we are testing.\n\nThe expectations use\
    \ matchers to implement a comparison between the actual value and the expected\
    \ value. Jasmine has a slew of built-in matches but it also provides us with the\
    \ ability to write our own custom matches.\n\nIn the code snippet above, we are\
    \ telling Jasmine to check if use cookieHandler.createCookie has been defined.\n\
    \nNotice how we are describing our tests using strings passed to describe and\
    \ it methods. When the tests are run, these strings should read like sentences,\
    \ describing what our tests are, and what kind of results we should be expecting\
    \ from running such tests.\n\n— 218 ]"
