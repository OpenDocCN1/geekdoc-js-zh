  md: "# Application Implementation – Putting It All Together\n\nThis callback function\
    \ is called when the user clicks on the **Close** button of the dialogue box which\
    \ is the view for `notificationWidget` component. You might wonder why we are\
    \ not calling the component's internal method from the callback function as:\n\
    \n```\nthis.unregisterFromEvents();\n```\n\nFor the above function call to succeed,\
    \ the callback function needs to run in the context of this `this` is set at the\
    \ time of code execution to the object that calls this callback function, and\
    \ not the component, we are not able to call the component's internal methods\
    \ using `this`.\n\nThus, by setting the property `contextObj` on the `SandBox`\
    \ instance, we are able to easily access the original context of the component\
    \ and call the required internal method as:\n\n```\nsandbox.contextObj.bind(this).unregisterFromEvents();\n\
    ```\n\nOf course, we could also use JavaScript's `bind` method to achieve the\
    \ same context preservation but I have used this approach, so you can see a different\
    \ way of resolving this issue.\n\nThe `destroy` method of the component is used\
    \ to make inactive (no events on the component will be processed) or to completely\
    \ remove the component from the DOM.\n\nConsider destroy method implementation\
    \ of `notificationWidget`, as follows:\n\n```\ndestroy: function(removeComponent)\
    \ {\n  sandbox.contextObj.unregisterFromEvents();\n\n  if (removeComponent) {\n\
    \    sandbox.removeComponentDom(\"widgetContainer\");\n  }\n\n  sandbox.logMessage(1,\
    \ 'Notification Widget has\nbeen destroyed...', 'blue');\n}\n```\n\nDepending\
    \ on the value of `removeComponent flag(true or false)`, which is passed to this\
    \ method, the component is either disabled or completely removed from the DOM."
