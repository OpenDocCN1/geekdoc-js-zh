  md: "Base, Sandbox, and Core Modules\n\nWe use a similar approach to destroy (remove)\
    \ all the registered components from the application, as shown:\n\n```\nfor(var\
    \ i=lastIndex; i >= 0; i--){\n    registeredComponents[i].destroy(removeFromDom);\n\
    }\n```\n\nWe will look at the details of these operations in the next chapter\
    \ and examine the code more closely then. The takeaway here is that the core module\
    \ handles the initialization and destruction of all components in the application,\
    \ either as or on individual basis.\n\n# Providing plug-and-play capability\n\n\
    As mentioned previously, components can be loaded and added to the application\
    \ at any time the application is loaded in the browser.\n\nLet's have a look at\
    \ how a component is loaded dynamically and how it becomes part of the application.\n\
    \nDynamic loading of the components is done by leveraging a mechanism which first\
    \ checks to see if the component is already loaded in the cache, and if not, finding\
    \ its object definition in either the local storage or in the PageDefinitions.js\
    \ file and subsequently loading it.\n\nThe PageDefinitions.js is the file that\
    \ holds object definitions (as JavaScript objects) for all the components that\
    \ can be loaded dynamically in the application, at any time other than the start-up\
    \ phase.\n\nWe can also keep resource (asset) information related to any component\
    \ in this file if we desire to do so. Generally speaking, this file is mostly\
    \ used to find the location of our dynamic assets.\n\nFor instance, in our application,\
    \ we will be keeping information related to the Favorites page and the location\
    \ of its CSS file in PageDefinitions.js. This information will be consumed by\
    \ the content component when the user navigates to this page."
