  md: 'As you can see, modular architecture can help us greatly to manage our application
    pieces and their related dependencies with ease. I recommend that you spend some
    time exploring how to leverage the full functionality of AMD modules in your own
    applications.


    # # CommonJS


    With AMD format, CommonJS (also known as CJS) is another format which defines
    JavaScript modules as objects that can be made available to any dependent code.
    CJS modules can only define objects, as opposed to AMD modules, which can define
    constructors and functions too.


    Unlike AMD format, which takes a browser-first approach, CommonJS takes a server-first
    approach. It also covers a broader set of concerns which are related, such as
    io, file system, and alike.


    Many developers (I''m one of them) use AMD format for browser-targeted modules
    and Common for server-side targeted modules. However, you could use CJS format
    for browser modules as well.


    Some of the tools that support CJS for the browsers are:


    +   - curlJS: http://github.com/unscriptable/curl

    - SproutCore: http://sproutcore.com


    Let''s have a look at a simple example to see how we can implement a CJS format
    module.


    # # Implementing a CommonJS module


    Imagine we have a file called moduleOne.js. From this file, we can export a CJS
    module like so:


    ```

    exports.someFunc = function() {


    return console.log("I am some function");

    }

    ```


    Here, exports is a global variable and contains the object which the module is
    making available to other modules that wish to consume it.


    On the other hand, imagine that we have another module in moduleTwo.js file, which
    resides in the same directory as moduleOne.js.'
  merge: -1
  pgno: 261
- img_proc: true
  md: "Enterprise Grade Module Design, AMD, CommonJS, and ES6 Modules\n\nmoduleTwo\
    \ can import moduleOne and consume it so:\n\n```\nvar firstModule = require('./moduleOne');\n\
    firstModule.someFunc();\n\nexports.someApp = function() {\n  return firstModule.someFunc();\n\
    }\nexports.otherOther = function() {\n  return console.log(\"I am some other app\"\
    );\n}\n```\n\nAs you can see, in module we use CJS require to import the first\
    \ module (someFunc), and we can use it as firstModule.someFunc().\n\nIn moduleTwo.js,\
    \ we are also exporting another module called someApp, which can be consumed by\
    \ other modules in the application. Note that in the preceding example, we are\
    \ in fact exporting more than one module from the same file.\n\nNotice also that\
    \ there is no define method to wrap our modules and return an object from the\
    \ callback function, as opposed to what we saw in AMD format.\n\nCJS syntax is\
    \ similar to how ECMAScript 6 defines modules, and we will have a look at that\
    \ in the next section.\n\nFor more information regarding CJS modules, please refer\
    \ to the following resource online: http://www.commonjs.org/\n\n# ECMAScript 6\
    \ modules\n\nIn the new version of JavaScript, ECMAScript 6 (also known as ES6),\
    \ native modules have been introduced. The following points are some of the most\
    \ important aspects of these modules:\n\n+   - Module code automatically runs\
    \ in strict mode\n- Variables that are created in the top level of a module are\
    \ not added to the global scope\n- A module must export anything that should be\
    \ available to the outside code\n- A module can import bindings (things that are\
    \ exported from other modules)"
  merge: -1
  pgno: 262
- img_proc: true
  md: "The main idea behind modules in ES6 is to give complete control over what is\
    \ accessible to the outside code from inside the module, as well as when the code\
    \ inside of the module is executed.\n\nLet's have a look at a simple example of\
    \ an ES6 module.\n\n# Defining an ES6 module\n\nWe can define an ES6 module either\
    \ inside of a .js file, or inside a <script> tag in our.html page.\n\nConsider\
    \ the following code snippet, from an imaginary simpleModule.js file:\n\n```\n\
    var name = \"Tom\";\n// export function\nexport function sayHello(name) {\n  alert(\"\
    Hello \" + name);\n}\nfunction sayName() {\n  alert('My name is: ' + name);\n\
    }\nfunction sayBye(name) {\n  alert(\"Bye \" + name);\n}\nexport sayBye;\n```\n\
    \nIn the preceding module, we have defined three functions as well as a module\
    \ variable. Note that while the variable name is not inside of a function, its\
    \ scope is still limited to the module. This means that no external code to the\
    \ module can access it.\n\nWe have also used the keyword export to make two of\
    \ our functions available to the potential consumers of the module. As you can\
    \ see, we can use export either on the function declaration, as in the case of\
    \ sayHello function, or as a reference, in the case of sayBye function.\n\nTo\
    \ create a module as an embedded module in an .html file, we can use the following\
    \ syntax:\n\n```\n<script type=\"module\">\nvar modulePrivateVar = 2\nalert(\"\
    The value in the module is: \" + modulePrivateVar);\n</script>\n```"
  merge: -1
  pgno: 263
- img_proc: true
  md: "Enterprise Grade Modular Design, AMD, CommonJS, and ES6 Modules\n\nNote that\
    \ we have specified type of the script to module, which causes the browser to\
    \ treat the code inside the `<script>` tag as an ES6 module.\n\n# # Consuming\
    \ an ES6 module\n\nWhen the external code to an ES6 module needs to access to\
    \ what has been exposed by the module, binding needs to be used.\n\nConsider how\
    \ we can access the two functions that were exposed by our first module, `simpleModule`,\
    \ as shown here:\n\n```\nimport {sayHello, sayBye} from \"simpleModule.js\";\n\
    sayHello();\nsayBye();\nsayName(); // error, sayName was not exported\n```\n\n\
    As shown, we need to use the keyword `import` to create binding between the external\
    \ code to the module and the functions that the module exports. Also, notice since\
    \ `sayName` was not exported by the module, we have no access to it.\n\n# # Module\
    \ loading sequence in the browsers for ES6 modules\n\nES6 modules in the browsers\
    \ are always loaded as soon as the browsers encounter the following tag:\n\n```\n\
    <script type=\"module\" src=\"simpleModule.js\">\n```\n\nHowever, the code in\
    \ the module is not executed until the document has been completely parsed. Modules\
    \ are also executed in the order in which they appear. This means that in our\
    \ examples, if we listed our modules as:\n\n```\n<script type=\"module\" src=\"\
    simpleModule.js\">\n<script type=\"module\">\n  var modulePrivateVar = 2\n  alert(\"\
    The value in the module is: \" + modulePrivateVar);\n</script>\n```"
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Chapter 10


    The code in simpleModule.js would be executed before the code for our embedded
    module would.


    Since a module can also have its own dependencies, which it defines using the
    import statements (bindings), each module is parsed completely before its code
    is executed. This is so the dependencies can be resolved correctly.


    This means, if the browser encounters an import statement in an already downloaded
    module, it will download the dependency first before executing the code in that
    module. This ensures that all the modules and their dependencies are loaded before
    any code-execution in modules.


    There is a lot more to ES6 than what we covered here, as this was meant to be
    a brief introduction. I encourage you to research the subject further on your
    own. There are many good resources online which you can refer to and I highly
    recommend the following sites for more information:


    +   - https://leanpub.com/understandings6

    - https://hacks.mozilla.org/2015/08/es6-in-depth-modules/

    - https://developer.mozilla.org/en/docs/javascript/reference/statements/import


