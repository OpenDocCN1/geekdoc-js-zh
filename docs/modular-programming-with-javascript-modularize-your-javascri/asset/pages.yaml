    Here, we are assigning testObj1 to testObj2 using the assignment operator, which
    might appear as creating a new object after another.


    However, as you can see, when we create a new property for testObj1, even after
    the assignment of testObj1 to testObj2 has taken place, the new property is available
    to testObj2 as well.


    The reason is when we use the assignment operator to assign the value of a variable
    that holds a reference to another variable, we are in fact assigning the memory
    address of the object to another variable. This results in both variables referencing
    the same object. So, in the code above, both testObj1 and testObj2 are referencing
    the same object.


    While this result might desirable at times, there are occasions when we need to
    create an object that is an exact copy (replica) of another object, but we want
    the new object to be a completely independent object from the original one. So
    how do we do that?


    One way to achieve that is to create a clone of the original object.


    # Creating a clone of an object


    When we create a clone of an object, our objective is to create an exact replica
    of the original object, without the newly created object having any ties to the
    original object.


    Cloning objects in JavaScript (as with some other languages) is not as straightforward
    as you might think. While there are different ways of implementing cloning, each
    approach has its own pros and cons.'
