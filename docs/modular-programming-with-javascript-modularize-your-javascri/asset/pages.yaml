  md: 'For instance, after the header of our application is created, all the header-related
    DOM elements reside inside a main div element container that hosts them. The header
    component''s sandbox instance holds a reference to this div container.


    When the header component needs access to any DOM elements related to its view,
    it will only need to look for the desired element inside of its container div
    as opposed to traversing the whole DOM tree to find the element.


    This makes finding the desired element much quicker as we don''t need to search
    the entire DOM looking for it.


    If you are not completely clear on how this works, we will cover it again in the
    next chapter when we examine the code in more depth.


    For now, just be mindful of the fact that the sandbox instance allows us to have
    quick direct access to the DOM element that the component renders in, which in
    turn allows for much optimized DOM manipulation tasks related to the component.


    # Core module


    The core module is really the brain of our application. It is where the application''s
    heavy lifting is done and the real magic happens.


    The core module is responsible for implementing application-level business logic
    as well as providing bridges among components when there is a need for components
    to communicate with each other. Of course, while still preserving the loose coupling
    nature of the application.


    The core module also leverages the functionality provided by the third party libraries,
    which are loaded by the base module, to create a cohesive functional application.


    If you are familiar with the architectural design pattern known as Module-View-Controller
    (MVC), the core module is the controller piece of this design pattern in our application.


    We summarize the role of core module as the following:


    +   * Acting as the controller for the application

    * Providing communication bridges among modularized components

    * Initializing and destroying components

    * Implementing plug-and-play capability for the components

    * Providing a centralized method of handling errors'
