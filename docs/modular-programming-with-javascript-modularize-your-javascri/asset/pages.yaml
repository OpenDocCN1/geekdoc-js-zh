  md: "# Review of Important JavaScript Concepts\n\nJavaScript however, only supports\
    \ implementation inheritance, as there is no concept of function signature which\
    \ is required for interface inheritance.\n\nThere are various ways of implanting\
    \ inheritance in JavaScript and they all have their pros and cons. In this section,\
    \ I will cover a few ways of implementing such relationship among objects and\
    \ will briefly explain the advantages and disadvantages of each approach.\n\n\
    # Prototype chaining\n\nLet's start by creating two different constructor functions\
    \ and an inheritance relationship between them.\n\nConsider the following two\
    \ functions:\n\n```\nfunction BaseType() {\n  this.baseValue = 2;\n}\n\nBaseType.prototype.getBaseValue\
    \ = function() {\n  return this.baseValue;\n};\n\nfunction ChildType() {\n  this.childTypeValue\
    \ = 50;\n}\n// creating inheritance relationship\nChildType.prototype = new BaseType();\n\
    \nChildType.prototype.getChildTypeValue = function() {\n  return this.childTypeValue;\n\
    };\n\nvar childInstance = new ChildType();\n\nconsole.log(childInstance.getBaseValue());\
    \ // displays 2\nconsole.log(childInstance.getChildTypeValue()); // displays 50\n\
    ```\n\nIn the preceding code, we have created two extremely simple constructor\
    \ functions. As you can see, we have defined a simple property for each one of\
    \ them which are methods related to each object. However, we have created these\
    \ simple methods as properties of the prototype object for each function as opposed\
    \ to directly creating them on the constructor functions."
