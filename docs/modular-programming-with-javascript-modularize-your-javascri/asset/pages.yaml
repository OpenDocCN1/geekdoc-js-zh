  md: '# JavaScript objects


    If you have programmed in JavaScript before (as I''m sure you have, since this
    book is intended for intermediate to advanced JavaScript programmers), you will
    certainly have used objects, if you have not been aware of their inner workings.


    If you are familiar with other classical object oriented languages (such as C++,
    C#, or Java), you will be surprised to find that there is no formal syntax for
    defining classes in JavaScript (at least ECMAScript 6). I think you''ll be more
    surprised to find out that, without having a formal syntax, you are still able
    to create classes in JavaScript and harness the full power of object oriented
    design and architecture (and one could even argue in a more flexible way).


    > Formal class definition in JavaScript

    in the newer version of JavaScript (ES6), new syntax allows you to define classes
    in a more formal and structured way.

    For more information visit the link:

    http://es6-features.org/


    You can create objects in JavaScript in many ways but we will focus on three of
    these approaches for creating objects in this chapter. These approaches are:


    +   - Using object type constructors

    - Using object literal notation

    - Using constructor functions


    # Object type constructors


    Probably the easiest way to create objects in JavaScript is to create an instance
    of the Object type and augment it with properties we need.


    As you might know, the Object type is the top level object (the root object) in
    JavaScript that all other objects are created from behind the scenes. This object
    has many properties which have been defined for it by default. Every object created
    based on this type will inherit its default properties such as toString, hasOwnProperty,
    and so on.


    Have a look at the following syntax as it shows the creation of objects using
    the Object constructor and augmenting it with custom properties:


    ```

    var myObj = new Object();


    myObj.value = "my first value";

    myObj.method = function() {

    ```'
