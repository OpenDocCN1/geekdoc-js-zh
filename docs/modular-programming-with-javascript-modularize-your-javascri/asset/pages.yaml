- img_proc: true
  md: "In the above code, we are using the call method to execute BaseType in the\
    \ context of ChildType. This results in ChildType instances getting a copy of\
    \ all the properties of BaseType. Since each instance of ChildType now has its\
    \ own copy of the properties, modifying the properties of BaseType is not reflected\
    \ in the child instances.\n\nThis approach, however, has its own issues. Since\
    \ we are not assigning an instance of BaseType to the prototype object of ChildType,\
    \ the properties defined on the prototype object of BaseType are not shared among\
    \ the instances of ChildType. This will no result in the most efficient approach\
    \ in implementing inheritance and does not allow for code sharing of the parent's\
    \ prototype object properties among child instances.\n\n# Parasitic combination\
    \ inheritance\n\nAnother way to create inheritance relationships among reference\
    \ types is to use a combination of the techniques that we have already discussed,\
    \ while eliminating their inefficiencies. This is also my favorite technique for\
    \ creating inheritance.\n\nLet's modify the code that we have already seen, so\
    \ we can implement this approach:\n\n```\nfunction BaseType() {\n  this.baseValue\
    \ = 2;\n  this.secondBaseValue = 99;\n}\n\nBaseType.prototype.getBaseValue = function()\
    \ {\n  return this.baseValue;\n};\n\nfunction ChildType() {\n  BaseType.call(this);\n\
    \  this.childTypeValue = 50;\n}\n\n// creating inheritance relationship\nChildType.prototype\
    \ = BaseType.prototype;\n\nChildType.prototype.getChildTypeValue = function()\
    \ {\n  return this.childTypeValue;\n};\n```"
