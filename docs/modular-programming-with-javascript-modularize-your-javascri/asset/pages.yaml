  md: "# Review of Important JavaScript OOP Concepts\n\nBut there is more, the instance\
    \ of BaseType (which is the value of the prototype object belonging to ChildType)\
    \ itself has a prototype object and its ChildType prototype has a link to this\
    \ prototype object. That prototype object has a property getTypeValue. Since this\
    \ method has access to the BaseType properties, it can return the value of baseValue.\n\
    \nYou can think of how this lookup is conducted as here:\n\n![](img/7ce8facf2661aaaf5010fe7a99cadff7_48_0.png)\n\
    \nAs you can see, this is a bit of searching chain in order to find the instance\
    \ property. Also, keep in mind that if the property was not found in the prototype\
    \ of BaseType, the search would continue to the prototype of all objects in JavaScript,\
    \ the Object type. Let's talk about how that works.\n\nRemember that every function\
    \ has a prototype property which its value is an object. This prototype object\
    \ itself has a prototype property which its value is the prototype object of the\
    \ Object type.\n\nThat is why, when we call the BaseType.toString method, even\
    \ though we have not defined this method on BaseType or its prototype object,\
    \ the call succeeds and produces the string value of it. The toString method is\
    \ defined on the prototype object of Object type, and thus is available to all\
    \ the children of Object type.\n\nIt is very important to keep in mind that the\
    \ search is ceased and will not continue any further in the chain of prototypes,\
    \ as soon as the property that is ceased is conducted for found.\n\nTo make a\
    \ little more clear, let's modify our ChildType to have a property (method) called\
    \ getTypeValue. Doing so will result in what is known as shadowing (or masking)\
    \ of this property on BaseType.\n\nSo, if we modify the code for ChildType as\
    \ below:\n\n```\nfunction ChildType() {\n  this.childTypeValue = 50;\n}\n// creating\
    \ inheritance relationship\n```"
