  md: "# Introducing Asynchronous Module Definition\n\nAsynchronous Module Definition\
    \ (AMD) format for creating modules in JavaScript, is targeted for use in browsers.\
    \ This format proposes a particular way for defining modules so that modules and\
    \ their dependencies can be loaded into the browser asynchronously.\n\nThere are\
    \ two key methods that you need to use when creating and consuming AMD modules,\
    \ these are define and require methods.\n\nThe idea is that we create a module\
    \ using the global define method and then we can import that module in other parts\
    \ of the code (other modules) using the global require method.\n\n# Defining modules\
    \ using AMD format\n\nHere is how a module can be defined in AMD format:\n\n```\n\
    define('moduleId', ['dependency'], function(dependency) {\n  return {\n    sayHi:\
    \ function() {\n      console.log('Hi there!');\n    }\n  };\n});\n```\n\nIn the\
    \ preceding code, we are passing three arguments to the global define method,\
    \ which has been provided to us by an AMD-compatible module loader.\n\nThe first\
    \ argument, moduleOneId, is an optional parameter which assigns an ID to the module.\
    \ Most of the time, we do not use this argument and other than some edge cases\
    \ or when a non-AMD concatenation tool is being used to bundle our code, we leave\
    \ it empty.\n\nThe second argument to define function is an array of dependencies,\
    \ which tells the AMD module loader what modules (files) need to be loaded before\
    \ executing the callback function. Of course, the third argument passed to define\
    \ method is the callback function."
  merge: -1
  pgno: 248
- img_proc: true
  md: "# Chapter 10\n\nNotice that we are returning an object from this callback function.\
    \ This object is the module that we are defining. In AMD format, the callback\
    \ function can also return constructors and functions.\n\n# Importing AMD modules\n\
    \nTo use the module that we have defined in the preceding code, we can import\
    \ it by using the global `require` function.\n\nConsider the following:\n\n```\n\
    require(['moduleOneId'], function(moduleOne) {\n  moduleOne.sayHi();\n});\n```\n\
    \nHere, we are asking the AMD loader to load the dependency moduleOneId before\
    \ executing the callback function.\n\nNote that we could also use the path to\
    \ our module instead of using the related ID. For instance, we could write the\
    \ preceding code snippet as follows:\n\n```\nrequire(['folderPath/moduleOne.js'],\
    \ function(moduleOne) {\n  moduleOne.sayHi();\n});\n```\n\nAMD format provides\
    \ great flexibility in defining and loading our modules. It also eliminates the\
    \ need for creating global variables to define the modules. AMD-compatible script\
    \ loaders also often provide the capability to lazy-load our modules, if needed.\n\
    \nThere are many web development tools (libraries) that support AMD format, but\
    \ the most popular ones are RequireJS and `curl.js`.\n\nIn our application in\
    \ this chapter, we will be using RequireJS to create our AMD modules and load\
    \ their dependencies.\n\n> For an in-depth discussion on JavaScript modules and\
    \ their related formats, I encourage you to visit a great post by Addy Osmani\
    \ at https://addyosmani.com/writing-modular-js/\n\n[ 231 ]"
  merge: -1
  pgno: 249
- img_proc: true
  md: 'Enterprise Grade Modular Design, AMD, CommonJS, and ES6 Modules


    # # Introducing RequireJS


    As mentioned previously, one of the most popular AMD module loaders for the browsers
    is **RequireJS**. In this section, we will learn how to create and load modules
    using this tool.


    You can also run RequireJS on the server side using its related optimizer, `r.js`.
    The optimizer can package all of our AMD modules into one file and then the browser
    will only have to make one request to the server to load all the necessary modules.
    In this scenario, AMD format is used to manage dependencies among modules when
    they are bound on the server.


    Alternatively, if you are using a server build setup for your client files, you
    might want to consider `almond.js` for packaging your AMD modules. This is a much
    smaller library, but does not have the dynamic loading capabilities of RequireJS.
    For more information regarding `almond.js`, visit the following URL: `https://github.com/requirejs/almond/`


    Since we are not using a build system for our project, I will only cover using
    **RequireJS** for the browsers in this chapter.


    # # Downloading RequireJS


    We can download this library from the following location: `http://requirejs.org/docs/download.html#requirejs`


    You can simple copy the minimized version of the tool and save it in your selected
    file location.


    # # A test project for creating and loading AMD modules


    To help you become more familiar with RequireJS, I have included an additional
    project called **requireJsLearning** in the source code related to this chapter.
    I encourage you to download this project and follow along as we continue our talk
    regarding AMD and RequireJS.'
  merge: -1
