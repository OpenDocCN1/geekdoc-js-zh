    \ {\n        message = severity;\n        severity = 2;\n    }\n}\n\nreturn {\n\
    \    logMessage: self.logMessage,\n    initialize: self.initialize\n};\n})()\n\
    ```\n\nAs you can see, we are augmenting the core module by attaching a self-contained\
    \ sub-module, which is added as a new property to the core module object.\n\n\
    Augmenting the core module using sub-modules, is similar to building a play house\
    \ using Lego blocks as separate pieces are attached together to create the whole\
    \ structure.\n\nThis would mean that not only the application main pieces (such\
    \ as components and sandbox) are built as modules, but also the core module itself\
    \ is built based on smaller modules.\n\nThis allows us to easily extend our core\
    \ module while providing us with the ability to remove or replace each sub-module\
    \ without affecting the other pieces of the core module."
