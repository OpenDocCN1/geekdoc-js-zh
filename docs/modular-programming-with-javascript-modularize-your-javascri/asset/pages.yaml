    function doAddition(num1, num2) {\n    return num1 + num2;\n}\n\nfunction doSubtraction(num1,\
    \ num2) {\n    var result = null;\n    if (num1 > num2) {\n        result = num1;\n\
    \    } else {\n        result = num2 - num1;\n    }\n    return result;\n}\n\n\
    console.log(doAddition(3,2)); // displays 5\n\nconsole.log(doSubtraction(3,2));\
    \ // displays 1\n```\n\nAs you can see in the above code, we have two independent\
    \ functions for doing simple additions and subtractions and have no relation between\
    \ the two, other than the fact that they both operate on the two passed-in-numbers\
