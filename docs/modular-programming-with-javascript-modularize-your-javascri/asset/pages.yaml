  md: '# Module Design Pattern


    There is a notable advantage to this design. As you might have noticed, we can
    modify the code inside our module and add additional functionality to the module
    without affecting how other parts of our application interact with our module.


    This is true, as long as we don''t change the name or the functionality of the
    privileged methods that provide access for the external code to utilize the module''s
    functionality.


    At the same time, we can add new privileged methods to the interface of the module
    or modify the internals of our current privileged methods in the singleton object
    without affecting the internal code of the module itself.


    This allows us to have a good separation of concerns and responsibilities between
    the exposed part of our module (the module''s interface) and the private internals
    of the module.


    # Creating loose coupling among modules


    In a modular design, an application is often created using many modules. In order
    these modules to work together, we need to create coupling among them, without
    the modules being tightly dependent on each other.


    Let''s create an application based on a simple modules and have the modules interact
    with each other in a loosely coupled manner. Of course, we will keep this application
    very simple for now. In later chapters, we will take the concepts utilized in
    this application and build upon them to create our fully modularized ecosystem.


    I''m making the safe assumption here that our future application will consist
    of many separate modules, with each one of them being responsible for doing a
    very specific task.


    We will start by creating our core application module and calling it ApplicationInitModule.
    Usually, the first step in running an application is to take care of the application''s
    initialization tasks. Our ApplicationInitModule will be designed to do just that.


    In the following code snippet, when ApplicationInitModule is started, it will
    in turn start all the registered modules and their initialization routines. This
    process will take care of the application''s initialization routine as a whole.'
