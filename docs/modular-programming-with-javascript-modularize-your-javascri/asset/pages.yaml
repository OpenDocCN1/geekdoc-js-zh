  md: "# Base module\n\nWe will start our exploration of the design with the base\
    \ module. As the name implies, the base module provides the lowest level of functionality\
    \ for our application.\n\nThis is where we import and leverage the functionality\
    \ of third party libraries and utilities. These libraries consist of jQuery, Dojo,\
    \ MooTools, and so on.\n\nThe main idea is that we can easily use the functionality\
    \ provided by such libraries without the need to create a tight dependency between\
    \ our application and the libraries used.\n\nFor instance, we could need how to\
    \ detect browser compatibility to attach events to our elements on the page, as\
    \ follows:\n\n```\nif (elem.addEventListener) {\n  elem.addEventListener(event,\
    \ callbackFunc);\n} else if (elem.attachEvent) // For IE 8 and earlier versions\n\
    \  elem.attachEvent(\"on\" + event, callbackFunc);\n}\n```\n\nWhereas we could\
    \ easily jquery take care of such intricacies by doing the following:\n$(elem).on(event,\
    \ callbackFunc);\n\nHere, we are letting jQuery take care of the browser compatibility\
    \ issues and we can focus on other, more important things in our application.\
    \ Another example is adding animations to our elements only when jQuery is present.\
    \ This approach allows us to implement **progressive enhancement** and **graceful\
    \ degradation** techniques in our code.\n\nWe also have both of such implementations\
    \ in our code. This allows us to have a fallback if jQuery has not loaded properly.\n\
    \nTherefore, the preceding code can be written as follows:\n\n```\nif ($) {\n\
    \  $(elem).on(event, callbackFunc);\n} else {\n  if (elem.addEventListener) {\n\
    \    elem.addEventListener(event, callbackFunc);\n  } else if (elem.attachEvent)\
    \ // For IE 8\n    and earlier versions\n    elem.attachEvent(\"on\" + event,\
    \ callbackFunc);\n  }\n}\n```"
