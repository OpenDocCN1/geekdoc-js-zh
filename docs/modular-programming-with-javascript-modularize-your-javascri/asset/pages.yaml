  md: "# SandBox module implementation\n\nAs mentioned previously, the components\
    \ in our application do not directly communicate with each other nor they communicate\
    \ directly with any other parts of the application. The only connection between\
    \ the components and the rest of the application is through an instance of SandBox\
    \ module assigned to them.\n\n# SandBox module's constructor\n\nConsider the following\
    \ code snippet:\n\n```\nvar SandBox = function(core,contextElem, componentSelector{\n\
    \  var Core = Core, containerElemContext =\n  contextElem, componentID = componentSelector;\n\
    \n  return{\n    getElement : function (elementID {\n      if(elementID && typeof\
    \ elementID === \"string\"){\n        return Core.getElement(elementID);\n   \
    \   }else{\n        Core.log(3,\"incorrect parameters passed in;from SandBox.getElement(\"\
    \");\n      }\n    },\n  };\n};\n```\n\nAs the preceding code shows, SandBox module\
    \ is created as a global object SandBox, and three parameters are passed to its\
    \ constructor by MainCore module. Core parameter, which is a reference to MainCore;\
    \ contextElem parameter, which is a reference to the container element for the\
    \ component's view that the SandBox instance belongs to; and componentSelector,\
    \ which is the ID of the sandbox's component.\n\nFor instance, the SandBox instance\
    \ of header module receives the following parameters when it is instantiated:\
    \ A reference to the core module as the first parameter, headerContainer which\
    \ is the ID of header component's view container on the page as the second parameter,\
    \ and header which is the ID of header component as the third parameter.\n\nThe\
    \ reference to Core module is used by the SandBox module instance to get access\
    \ to the functionality that Core module provides."
  merge: -1
  pgno: 204
- img_proc: true
  md: "# Setting a component's container context in the SandBox instance\n\nA reference\
    \ to the container element of the component's view is used by the SandBox module\
    \ to set the DOM context of the component's HTML elements. This is so when an\
    \ HTML element within this container needs to be accessed, the search for this\
    \ element can start from the container element, as opposed to the document element\
    \ of the page.\n\nHave a look at the following code:\n\n```\ngetElementInContext\
    \ : function(elementID) {\nif (elementID && typeof elementID === \"string\") {\n\
    \    return Core.getChildOfParentById(\n    containerElemContext,elementID);\n\
    }else{\n    Core.log(3,\"incorrect parameters passed in;\n    from SandBox.getElementInContext());\n\
    }\n}\n```\n\nHere the SandBox module is calling the core module's getChildOfParentById\
    \ method. This method takes two parameters, containerElemContext, and elementID.\
    \ objective is to search the DOM tree for the element whose ID has been passed\
    \ in.\n\nUsing the container element's DOM Context, we can start the search in\
    \ the container of the component as opposed to the top-level element of the DOM\
    \ tree. This approach allows us to have a much more optimized search for finding\
    \ our component's elements.\n\n# Identifying the SandBox module's instance\n\n\
    The component ID, which is passed in as the third parameter to SandBox module's\
    \ constructor, identifies the instance of SandBox module. This is used by the\
    \ core module, to identify which component the SandBox instance belongs to."
  merge: -1
  pgno: 205
- img_proc: true
  md: "# Application Implementation - Putting It Together\n\nFor instance, the component's\
    \ ID is used in the following method of SandBox module:\n\n```\nunregisterCustomEvent\
    \ : function(eventType) {\n  if (eventType && typeof eventType === \"string\"\
    ) {\n    Core.unregisterCustomEvent(componentID, eventType);\n  } else {\n   \
    \ Core.log(3,\"incorrect parameter passed in;\nfrom SandBox.unregisterCustomEvent\"\
    );\n  }\\}\n```\n\nIn the code snippet, we are calling unregisterCustomEvent method\
    \ of Core module and passing in the parameter componentID. This is so core module\
    \ knows which instance of SandBox is making this call and in turn, which component\
    \ wishes to unsubscribe from the custom event.\n\n# SandBox module considerations\n\
    \nThere are also a couple of things that you need to keep in mind about SandBox\
    \ module. First, SandBox module can be designed to only provide a subset of Core\
    \ module's functionality to the components. This enables us to control what application\
    \ functionality can have access to. Second, all the methods of SandBox module\
    \ are designed to do a very basic error checking. This filter calls which have\
    \ passed the basic level of validation to propagate to Core module.\n\nKeep in\
    \ mind that SandBox module is supposed to be only a thin layer that sits between\
    \ the components and the rest of the application. Thus, it is best to not do extensive\
    \ validation at SandBox module level.\n\nWhat constitutes a thin layer is open\
    \ to interpretations, but since there could potentially many instances of SandBox\
    \ module in the application, it is best to keep it as thin as possible.\n\n# Application\
    \ components\n\nConsidering that our application is a proof of concept type application,\
    \ we have only implemented four components: header, footer, content, and notificationWidget\
    \ (I'm using the component IDs used in the application)."
