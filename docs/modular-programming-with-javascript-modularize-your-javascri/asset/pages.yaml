  md: "# Module Design Pattern\n\nA singleton is an object there will ever be one\
    \ instance of it in the application. Singleton objects can be created using object\
    \ literal notation, which we saw examples of in the previous chapter.\n\nConsider\
    \ the following object definition:\n\n```\nvar mySingletonObj = {};\n```\n\nWhile\
    \ the singleton object does not do anything, it is in fact a valid object and\
    \ there can be only one instance of this object as we cannot create other objects\
    \ based on mySingletonObj.\n\nLet's add some value properties and methods (method\
    \ properties) to this object and see how we can access properties outside of the\
    \ object definition:\n\n```\nvar mySingletonObj = {\n  name: \"Sasan\",\n  title:\
    \ \"Software Developer\",\n  getName: function() {\n    return this.name;\n  },\n\
    \  getTitle: function() {\n    return this.title;\n  }\n};\n// displays \"Sasan\"\
    \nconsole.log(mySingletonObj.getName());\n\n// displays \"Software Developer\"\
    \nconsole.log(mySingletonObj.getTitle());\n```\n\nIn the above definition, we\
    \ have created a singleton object with four properties. Two of them are value\
    \ properties and two are method properties.\n\nOur method have access to our value\
    \ properties and return their values. However, we can directly access the object's\
    \ properties and even override their values from outside of the object."
