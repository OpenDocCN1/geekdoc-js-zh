  md: "# Consider the following simple example:\n\n```\nfunction setTempValue(value)\
    \ {\n\n  var firstNum = value || 2;\n\n  return function(secondNum) {\n    if(firstNum\
    \ > secondNum) {\n      return firstNum;\n    }else if (firstNum < secondNum)\
    \ {\n      return secondNum;\n    }else{\n      return \"=\";\n    }\n  }\n}\n\
    nvar theNumberExaminer = setTempValue(6);\nvar result = theNumberExaminer(2);\n\
    console.log(result); // displays 6\n```\n\nAs you see, innermost function setTempValue\
    \ takes a number as a parameter and sets it as the starting value to be used for\
    \ comparison later.\n\nWhen this function is executed, it also returns an anonymous\
    \ function whose reference will be stored in theNumberExaminer variable. This\
    \ anonymous function is then used to compare a value passed to it with the value\
    \ that was set as the starting value (firstNum) in the setTempValue function.\n\
    \nNote that we only pass one value (2) to theNumberExaminer to be compared against\
    \ the starting number.\n\nThe question is: how theNumberExaminer have access to\
    \ the previous value passed to the setTempValue function?\n\nNormally, when a\
    \ function is returned, its execution context is removed and all the values related\
    \ to that function's execution context are destroyed. However, with Closures,\
    \ this work a little differently.\n\nHere, inner anonymous function is returned\
    \ from the setTempValue(6) and, with it, the execution context of its parent function.\
    \ allows the anonymous function to access the value of firstNum.\n\nThis relationship\
    \ will hold as long as the inner function (the anonymous function) is not destroyed.\
    \ The context of the parent object remains in memory because there is still a\
    \ reference to the inner function."
