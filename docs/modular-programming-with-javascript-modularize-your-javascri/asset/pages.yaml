  md: '# The big picture


    Before we start any coding at all, we need to have a good understanding of what
    our application is all about, what the requirements are, and what possible functional
    pieces are needed to satisfy our requirements.


    While in the beginning of an application''s design phase, we try to answer as
    many questions regarding our application''s requirements, we should always try
    not to get tied down by the details.


    The idea is to get the big picture, understand what it is that we want to deliver,
    the timelines involved, and the resources available. Based on such analyses, we
    can start creating a scalable, flexible, and extensible architectural design for
    our application.


    I''d like to draw your attention to a very important word that I used here, extensible.
    The ability of an application to be easily extended is very important in a proper
    design. Keep in mind that how much we try to finalize all of the requirements
    for an application ahead of time, we won''t be able to foresee them all in the
    beginning.


    Requirements change over time, new requirements are added, and old requirements
    get modified or even removed altogether from the final draft of the application.
    The key is to design our application in a way that can accommodate all such changes
    without a big impact on the overall architecture. This is where the advantages
    of a modular architecture shine and help to mitigate the adverse effects that
    such changes might have on the application as a whole.


    As we keep these points in mind, let''s talk about the application that we are
    going to build together in this book.


    # Our application requirements


    Our application is a simple yet fully functional image gallery application. The
    goal is to present the users with a catalog of beautiful images on our site. Our
    site visitors can click each of the images to see a full view of the image and
    add the images to their favorite list of images, if they wish to do.


    The application will have a header, a navigation bar at the top, a main content
    area in the middle, a footer, and of course a logo.


    As you can tell, there are not many complicated pieces at play here, but I assure
    you that under the hood there are many modules that can be easily ported from
    this application to many other complex applications.'
