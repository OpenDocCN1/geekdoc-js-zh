    # Object literal notion versus function objects


    While both object literal notation and function object syntax can be used to create
    objects, there are situations when one approach is better suited than the other.


    In JavaScript, after the script is parsed, all function declarations in the program
    are hoisted to the beginning of the script. That is why you can call a function
    before its actual definition in the code, as shown in the following example:


    ```

    var firstPerson = CreatePerson("Tom", "Software Developer");

    ```


    ```

    function CreatePerson(personName, personJob) {

    // creating an object instance, using object type

    var person = new Object();

    // we can also use an object literal instead as below

    // var person = {};

    person.name = personName;

    person.job = personJob;

    ```'
