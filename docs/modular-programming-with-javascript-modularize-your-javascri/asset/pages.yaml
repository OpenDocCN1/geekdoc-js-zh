  md: '# Chapter 9


    Important point to keep in mind when writing unit tests

    Ideally, we want each unit test to test only one functionality, and not have any
    dependency on another functionality in the code. For instance, if we want to test
    a method that can read from a cookie, we should only test that and not if we can
    write to the cookie first, and then read the value, all in one test spec. In some
    of specs we have not followed such a rule. To eliminate these types of dependencies,
    we need to use spies, stubs, and mocks which require more in-depth knowledge of
    our testing frameworks as they are considered more advanced features. Since, this
    is only an introduction to unit testing, advanced functionality of the frameworks
    are beyond the scope of this book, I highly recommend that you research them further
    on your own as such features are very useful in writing unit tests.


