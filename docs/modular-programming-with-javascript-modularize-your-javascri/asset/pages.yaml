- img_proc: true
  md: 'Have a look at the following diagram to see an overview of the dynamic component-loading
    mechanism in our application:


    ![](img/7ce8facf2661aaaf5010fe7a99cadff7_159_0.png)


    As the flow diagram shows, when there is a need for a component to be rendered
    dynamically in the application, the core module checks to see if the component
    object is already present in the cache.


    If the component object is already present in the cache, then there is no need
    to do anything else but to render its view.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'On the other hand, if the component object is not present, the core module
    looks for the component''s object definition in the local storage first. This
    object definition has a property that holds the location (path) of the component''s
    JavaScript file on the server.


    Note that we are using the local storage as the primary storage facility for such
    object definitions as opposed to keeping them in the cache. This is purely to
    keep the footprint of the application as small as possible in the browser. Usage
    of the local storage is especially important if we have a few object definitions
    for the components, such, definitions could get quite large and consume a considerable
    amount of memory.


    Admitted, in our application there is no real need to use local storage, since
    we have only one application. I''m using the local storage to show you how it
    can be leveraged if you decide to use this mechanism in your future applications.


    The important point is when the core finds the location of the component''s file,
    it will make a request to the server for the .js (and possibly .css) file(s) of
    the component.


    Once the .js file for the component is loaded and parsed, then the component registers
    itself with the core and, with any other component in the application, it is an
    instance of the sandbox module.


    As you imagine, this approach provides us a very robust way to dynamically load
    and activate our application''s components, which essentially encompasses the
    plug-and-play capabilities of the application.


    The mechanism is a bit involved than what is explained here, but this brief description
    should provide a good overview of how things work behind the scenes. In the next
    chapter, we will have a closer look at the implementation of this mechanism and
    I''m sure all the details will become more clear to you in that chapter.


    # Providing a centralized approach to handling errors


    The core module implements a centralized approach to logging all types of messages.
    This frees the application modules and components from implementing such functionality
    themselves. It also provides enhanced capabilities for the logging mechanism that
    all components can leverage in a uniform way.


    Note that any future enhancements that we may make to our logging mechanism will
    be done in one place and will be available to all the modules at the same time.'
