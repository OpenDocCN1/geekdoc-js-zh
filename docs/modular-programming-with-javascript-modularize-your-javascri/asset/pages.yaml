    # Module name conventions


    > As we are getting involved with module implementation in our application, it
    is best to use more specific naming for our modules. Generally speaking, it is
    a good idea to use names that are as specific as possible for our modules. This
    minimizes the chance of naming conflicts between our application modules and third-party
    modules that we might be loading in our application. For this reason, as we move
    forward, we will use ImagesInc_ prefix to all of our module names, to make the
    names more specific to our application.


    > It is also worth mentioning that some developers choose to use all capital lettering
    for the name of their modules in the code, as a convention. We will not be using
    this convention in our application. In your own coding practices, whether to use
    all capital lettering for your module names or not is something that you should
    decide on with your team. This is so you can establish a set of standards which
    all the members of the team would be required to follow.'
