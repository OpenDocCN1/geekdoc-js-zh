  md: "Have a look at the following code snippet:\n\n```\nmySingletonObj.name = \"\
    John\";\nconsole.log(mySingletonObj.name); // displays \"John\"\n```\n\nThis shows\
    \ that, while we have encapsulation (I am using the term loosely here) in our\
    \ code, we do not have access control and the external code can change the values\
    \ of properties in our object. At this times, it is undesirable.\n\nLet's re-factor\
    \ our code and create a simple module, using the module pattern. This will help\
    \ us implement encapsulations as well as access control in our singleton object.\n\
    \nConsider the following:\n\n```\nvar singletonObj = {function() {\n\n  //private\
    \ variables\nvar name = \"Sasan\";\nvar title = \"Software Developer\";\n\n  //returning\
    \ a Singleton\n  return {\n\n    // privileged method\n    getName : function()\
    \ {\n\n      return name;\n    },\n    // privileged method\n    getTitle: function(){\n\
    \n      return title;\n    }\n  };\n}\n})();\n```\n\nIn the preceding code, we\
    \ have created an Immediately Invoked Function Expression (IIFE) and assigned\
    \ its return value (which is a singleton object) to the variable mySingletonObj.\n\
    \nThe returned singleton object has two methods that have access to the private\
    \ variables of the container function and return their related values."
