  md: "In requireJsLearning project, I have saved the RequireJS library (require.js)\
    \ in the libs folder, as shown here:\n\n![](img/7ce8facf2661aaaf5010fe7a99cadff7_251_0.png)\n\
    \nLet's create some simple modules in this project and see how we can use RequireJS\
    \ to load and manage them.\n\n# Creating a simple AMD module\n\nWe start by creating\
    \ a simple AMD module in person.js file, under modules folder.\n\nConsider the\
    \ following:\n\n```\ndefine(['modules/stuff', 'jquery'], function(stuff, jq) {\n\
    \  console.log(jq + \" --> Accessing jQuery from person\");\n  return {\n    first:\
    \ \"Sam\",\n    last: \"SamLastName\",\n    favorites: stuff.likes.join(' ')\n\
    \  };\n});\",\n```\n\nIn the preceding code, we are using the global define method\
    \ that RequireJS has provided for us passing two parameters to it. The first parameter\
    \ is an array with two values. The first value in this array is a path to another\
    \ module, which is a dependency for our person module.\n\nNotice that we are using\
    \ the name of the file but without the .js extension. This is because RequireJS\
    \ assumes the extension to be .js by default."
