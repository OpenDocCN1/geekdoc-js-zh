  md: '# Application Mediator module


    Our GlobalApp also uses an IIFE to return a singleton object as the interface
    to the module. The only purpose of this module is to act as a mediator (abstraction
    layer) between testModule1, testModule2, and our core module, ApplicationInitModule.


    We have designed the application this so we can create a loose coupling between
    our core module and the other registered modules. As you can see, GlobalApp has
    been designed as a thin layer.


    This layer allows us to change our core module (ApplicationInitModule) as we please
    and change its interface to the outside world, without affecting the other modules
    that rely on this module''s functionality.


    In our design, the only module which relies on the ApplicationInitModule interface
    is our GlobalApp. This means that, if there are any changes to the interface of
    ApplicationInitModule, we only need to make modifications to our thin mediator
    layer GlobalApp. All the other modules in the application will be unaffected,
    as they use the same thin layer interface by GlobalApp.


    You will see in the future chapters of this book that this thin layer is called
    the sandbox and we will be using this concept of sandboxing to isolate our modules/components
