    \ role=\"main\" class=\"mainPageContainer\">\n        <div id=\"FooterParentContainer\"\
    \ class=\"footerContainer\">\n            <div id=\"FooterContainer\" class=\"\
    footerLinksContainer\">\n                </div>\n        </div>\n    </main>\n\
    \    <!--loading all the pieces of the architecture and booting it up --\n   \
    \ <script src=\"/lib/require.js\" data-main=\"js/config\"></script>\n</body>\n\
    </html>\n```\n\nAs you can see, the page has been shortened considerably and there\
    \ is only one JavaScript file that is loaded in index.html now. This file is require.js,\
    \ with its data-main attribute set to js/config, as shown here:\n\n```\n<script\
    \ src=\"js/libs/require.js\" data-main=\"js/config\"></script>\n```\n\nLoading\
    \ this is all we need to do in order to load all of our modules and components,\
    \ and to start the application.\n\nWe will have a look at how this magic has taken\
    \ place shortly, before doing so, we need to talk about AMD modules."
