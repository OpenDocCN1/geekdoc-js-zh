  md: "# Chapter 8\n\nAs you can see, an event object is passed to this method. The\
    \ method loops through all the components which have registered for this event\
    \ and then calls the associated event handler for the components for the event.\n\
    \nComponents can publish their events using their instance of SandBox module.\
    \ For example, the header component of the application broadcasts that the Favorites\
    \ in the application has been clicked, as follows:\n\n```\nhandleFavouritesClick:\
    \ function (e) {\n\n  e.preventDefault();\n  e.stopPropagation();\n\n  sandBox.publishCustomEvent({\n\
    \    type: 'favourite-Clicked',\n    data: 'favourite'\n  });\n  sandBox.addToHistory({\n\
    \    url: 'favourite' //update url in the browser\n  });\n\n}\n```\n\nSince the\
