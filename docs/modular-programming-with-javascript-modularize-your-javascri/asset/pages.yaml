    chapter can be found in the js/Modules.js file in the accompanying code.


    # Application view


    Another piece of our application is the view piece. As the name implies, this
    piece deals with the view of all the pages and page fragments of the application.
    The view is what the user actually sees in the browser.


    Since our application is based on a MV* type architecture (in conjunction with
    modular architecture), our views interact with the controller as well as the model
    pieces.


    However, the way we will build our application views is a little different than
    traditional MV* applications. Our application views will be designed as modules
    and because these modules specialize in creating views, we will be calling them
    Components to make the distinction between modules that have views and those that
    only provide functionality but have no direct relations to our application''s
    views.


    One thing to keep in mind all components is that they can implement their own
    MV* architecture. This type of implementation might not be very clear to you at
    this time, but it will make more sense in the following chapters.


    In this section, we will only focus on how index.html is built and how it is populated
    using a few object definitions and the controller methods that we saw in the previous
    section.


    To create our index.html page, we will start by building a skeleton for this page
    and then we will dynamically modify this skeleton to produce its main fragments.'
