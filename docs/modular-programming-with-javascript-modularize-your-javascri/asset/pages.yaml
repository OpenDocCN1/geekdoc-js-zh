  md: "Application Implement – Putting It All Together\n\n# # Routing functionality\
    \ in MainCore module\n\nAs our application is a single page application, and its\
    \ view needs to change based on the user's interaction, we need to implement the\
    \ client-side routing functionality. This also means that we need to incorporate\
    \ page view changes based on the user clicking on the back and forward buttons\
    \ of the browser.\n\nIn our application, I have used the HTML5 History API as\
    \ the basis for our client-side routing, but we could have also used open source\
    \ libraries such as History.js instead.\n\nLet's see how routing functionality\
    \ has been implemented in MainCore.\n\n# # Adding a URL to the history object\
    \ of the browser\n\nConsider the following method:\n\n```\nvar addToHistory =\
    \ function(dataObj) {\n  // if history object is supported\n  if(!window.history\
    \ && history.pushState){\\n    history.pushState(dataObj,dataObj.url, dataObj);\n\
    \  }else{\n    alert('Your browser needs to be upgraded\nto the latest version');\n\
    \    Core.log(3, \"History API is not supported\";\nfrom addToHistory()');\n \
    \ }\n};\n```\n\nThis method is called when the application needs to create an\
    \ entry in the history object of the browser. For instance, when the Home link\
    \ of the entry section is clicked, the followingClick function is called in the\
    \ header component:\n\n```\nhandleHomeClick: function(e) {\n  sandBox.loadPage(\"\
    index.html\");\n  e.preventDefault();\n  e.stopPropagation();\n  sandBox.addToHistory({\n\
    \    url: \"index.html\"\n  });\n}\n```"
