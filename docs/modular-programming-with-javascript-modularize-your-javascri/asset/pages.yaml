    This is implemented in the core module and all components in the application call
    method (through their instance of the sandbox module) to bind an event handler
    to an element.


    Another example can be when a component would make an AJAX call to the server.
    It is the core module that would make the call instead of the server and would
    return the result to the component and would take an action based on the result
    returned, such as logging an error when the AJAX call fails.


    We can also monitor cookie and local storage-related functionality as some of
    the other application-level functionality the core provides to all the registered
    components.


    Keep in mind that the implementation should be designed in a way that component-specific
    functionality that only the components cares about should happen at the component
    level and that the application-level functionality should take place at the core
    module.


    Each component, in a sense, implements its own MVC or MV* design at the component
    level, which is separate from the application-level implementation. This point
    will become more clear to you when we look at implementation code in the next
    chapter.


    # Providing communication bridges


    As you may recall, one of the main goals of our modular architecture was to provide
    loose coupling among components. This means that none of the components in our
    application knows about any other component, nor are they dependent on any other
    component.


    However, there are times when components need to communicate with each other,
    or an event or action in one component should cause a change in another component,
    while the components have no knowledge of each other.


    To provide such functionality the core implements a variation to the observer
    pattern called the mediator pattern.


    Using the mediator pattern, our application''s components can register for and
    publish events. However, this is done through an abstraction layer.'
  merge: -1
