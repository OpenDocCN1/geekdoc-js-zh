  md: '# Summary


    In this chapter, we had a closer look at our application''s implementation and
    saw how all the pieces fit and work together to create our modular ecosystem,
    at the code level.


    We examined Core module (our application''s controller) was created by leveraging
    different augmentation techniques and adding sub-modules to MainCore module. This
    approach allowed us to extend our application''s capabilities with ease and in
    a modular way.


    By creating instances of SandBox module, we established communication bridges
    among the components and the rest of the application while preserving the loose
    coupling principle of our design.


    One important aspect of our application, is the ability to load components dynamically
    and we discussed how such functionality has been implemented in our Core module.


    Using the publish-subscribe and mediator patterns, we created an event handling
    mechanism which all the pieces of the application can communicate with each other.
    This mechanism was also used in our client side router to change the views of
    the application.


    At the end of the chapter, we created a global module to store our application
    level data and act as the model piece of our MV* design.


    In the next chapter, we will discuss testing of our application''s modules and
    will see how unit testing can help maintain the integrity of our application during
    its development and operational phases.'
