- img_proc: true
  md: 'Most of the time, it is best to leave low-level functionality as browser compatibility
    issues to third party libraries and focus on providing customized functionality
    for our application in our own code.


    Keep in mind that we are talking about third party libraries and utility packages
    here and not third party frameworks, as one of the goals of our architecture is
    to eliminate, or at least minimize, the need for third party frameworks.


    # Adding general-purpose libraries to the base module


    As mentioned, our base module loads and provides general-purpose libraries to
    the core module of our application. This means that only the core is aware of
    what base libraries are used in the code, as well as which particular functionality
    of such libraries is being leveraged.


    Depending on the design of our base module, the libraries are either loaded at
    application start-up time or dynamically at a later time. The base module passes
    a reference for each loaded and initialized library to the core module.


    Since it is only the core module that is aware of what libraries are used in the
    application and to what extend, if we ever decide to change our third party libraries
    or how they are used in the application, it is only the core module that is affected
    and no other pieces.


    This means that all the other pieces and components of our application will continue
    to work as they did before, regardless of the change in the third party libraries.
    Implementing our application as such minimizes the impact of replacing or removing
    the third party libraries on the application as a whole.


    This also holds true when we import and use new libraries in order to add more
    functionality to our application.


    In the next chapter, we will have a closer look at how the base module is used
    to add jQuery to our application''s core module.'
