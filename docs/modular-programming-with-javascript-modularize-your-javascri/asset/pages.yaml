- img_proc: true
  md: "RequireJS in turn, will make asynchronous calls to the server (one call per\
    \ module) to download all of the dependencies. \n\n# Loading dependencies of dependencies\n\
    \nNotice that our main module has listed person module as a dependency. However,\
    \ person module itself has also listed stuff module as a dependency:\n\n```\n\
    define(['modules/stuff', 'jquery'], function(stuff, jq) {\n  ...\n})\n```\n\n\
    Therefore, there is a dependency chain that needs to be resolved. When RequireJS\
    \ looks for the dependency list of main module and sees person as a dependency,\
    \ it looks to see if person has any dependencies. If so, it will load those dependencies\
    \ first. After that person module is loaded and passed to main module.\n\nWe can\
    \ think of this chain as follows:\n\nLoad stuff module | pass it to person module\
    \ | load person module | then pass person module to main module.\n\nThis is a\
    \ very simplified view of how RequireJS manages dependencies and loads modules\
    \ in the correct order, based on the dependency list.\n\n> A small but important\
    \ pointnIn the preceding explanation, I mentioned the order of how modules get\
    \ loaded based on the dependency list. The fact is that these modules can be physically\
    \ loaded in a different order, but the important point to keep in mind is that\
    \ all of the modules listed in the dependency list are loaded and in them is executed\
    \ before the callback function is called.\n\n![](img/7ce8facf2661aaaf5010fe7a99cadff7_253_0.png)\n\
    \n# Loading and consuming non-AMD modules\n\nWe also need a way to load non-AMD\
    \ modules or non-modular files in our projects, and RequireJS provides hooks to\
    \ do that.\n\nIt also has plugins which enable us to load CSS and text files,\
    \ as well as providing many other capabilities."
  merge: -1
  pgno: 253
- img_proc: true
  md: "# Enterprise Grade Modular Design, AMD, CommonJS, and ES6 Modules\n\nIn our\
    \ **requireJS** project, we have three modules (files) which are not using AMD\
    \ module format. These are person2, person3, and person4. In order for Require\
    \ to load these modules and make them available for usage by other modules, we\
    \ need to provide some configuration settings.\n\nIf you look at `config.js` file\
    \ in our project, you see the following code:\n\n```\nrequire.config({\n  deps:\
    \ ['main'],\n  paths: {\n    'jquery': 'libs/jquery' // if loading\n    from local\
    \ directory\n    person2': 'modules/person2', // location to\n    none AMD modules\n\
    \    'person3': 'modules/person3',\n    'person4': 'modules/person4',\n    'jquery':\
    \ 'https://code.jquery.com/jquery-1.12.3.min' // loading from CDN\n  },\n  shim:\
    \ {\n    'person2': {\n      'exports': 'person2',\n      // use this alias in\
    \ the global scope and\n      pass it to modules as dependency\n    },\n    'person3':\
    \ {\n      deps: ['person4'],\n      // none AMD module, depending on another\n\
    \      non AMD module\n      'exports': 'person3'\n    }\n  }\n});\n```\n\nHere,\
    \ we are passing a configuration object to require.config method of RequireJS.\
    \ The first property of this object defines main as a dependency (deps: ['main']).\
    \ Remember that main module is the module that boots up our application, in index.html\
    \ file, we use RequireJS to load config.js using data-attribute, as shown here:\n\
    \n```\n<script src=\"libs/require.js\" data-main=\"js/config/main\"></script>\n\
    ```\n\nWhen RequireJS loads config.js file, the configuration object is passed\
    \ to require.config method. Then, RequireJS figures out that it needs to load\
    \ main.js (by looking at the deps: ['main'] property on this object). Of course,\
    \ turn by looking at the dependency list of main module, RequireJS loads all the\
    \ dependencies for main module as well."
  merge: -1
