  md: "As you can see, while JavaScript may not have the same form of encapsulation\
    \ as classic object oriented languages, we can still create private scopes, and\
    \ define variables and methods inside that scope that are not accessible from\
    \ the outside code.\n\nWe will be re-visiting this concept and its usages a lot\
    \ more when we design our application modules in future chapters.\n\nYou may also\
    \ be asking yourself, \"What if I want to create a constructor function which\
    \ provides public methods, so I can access private members of constructor function\
    \ using these public methods?\n\nLet's consider the following constructorFunc\
    \ (\n\n```\nfunction simpleFunc {\n  var privateValue = 1;\n  this.readPrivateValue\
    \ = function(){\n    return privateValue;\n  }\n}\n\ntestObj = new simpleFunc();\n\
    console.log(testObj.readPrivateValue());// displays 1\n```\n\nIn this constructor,\
    \ we have created a private member privateValue that is not accessible from the\
    \ outside world. However, we have created a public method this.readPrivateValue,\
    \ which can be accessed by the external code and can access the value of this\
    \ private member.\n\nSo here, we have achieved two goals. First, we have kept\
    \ our private member protected, and second, we have provided read access to such\
    \ private member through our public method.\n\nThe method this.readPrivateValue\
    \ can be considered a privileged method, which means this public member has access\
    \ to private members of the object.\n\n# Inheritance\n\nIf you have a background\
    \ in classic object oriented languages such as C++, C#, or Java, you will be quite\
    \ familiar with the concept of inheritance. In such languages, there are two types\
    \ of inheritance: interface inheritance and implementation inheritance."
