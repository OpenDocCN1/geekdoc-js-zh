  md: "# Review of Important JavaScript OOP Concepts\n\nWhich displays:\n\n```\nfunction\
    \ BaseType() {\n  this.baseValue = 2;\n}\n```\n\nIt is always a good idea to reset\
    \ the constructor property of the prototype object after it has been completely\
    \ replaced, as follows:\n\n```\nChildType.prototype.constructor = ChildType;\n\
    ```\n\nThis is so the prototype object can correctly point back to the correct\
    \ constructor object.\n\nThe reset allows us to correctly find the constructor\
    \ object of the instance as shown:\n\n```\nconsole.log(childInstance.constructor);\n\
    ```\n\nWhich now correctly reports the following:\n\n```\nfunction ChildType()\
    \ {\n  this.childTypeValue = 50;\n}\n```\n\nWe will discuss the constructor property\
    \ some more, later in this chapter.\n\n# Constructor stealing\n\nAnother approach\
    \ to creating inheritance in JavaScript is using a technique known as constructor\
    \ stealing, which is similar to classical inheritance in other object oriented\
    \ languages.\n\nConsider the following:\n\n```\nfunction BaseType() {\n  this.baseValue\
    \ = 2;\n}\nfunction ChildType() {\n  BaseType.call(this);\n}\nChildType.prototype.getBaseTypeValue\
    \ = function() {\n  return this.baseValue;\n};\nvar instanceObj = new ChildType();\n\
    \nconsole.log(instanceObj.getBaseTypeValue()); // displays 2\n```"
