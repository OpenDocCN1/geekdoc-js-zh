  md: "# Content component\n\nThis component can be considered as the main component\
    \ of our application and it is responsible for changing the views of the content\
    \ area. It registers itself with Core module with the ID of content.\n\nThe content\
    \ component implements the required init and destroy methods as well as other\
    \ methods.\n\nWe are going to have a look at some of the important ones here.\n\
    \n# Handling content area click events\n\nWhen a user clicks on the Add to Favorites\
    \ link in the application or when an image is clicked in the content area, the\
    \ parent container of the content component's view captures the event and processes\
    \ it.\n\nThe binding for the event handling of the parent container takes place\
    \ in init method of content component as follows:\n\n```\nsandbox.addEventHandlerToParent(\"\
    click\",nthis.handleMainContainerClicked());\n```\n\nAs you can see, handleMainContainerClicked\
    \ is the callback method that processes this event.\n\nConsider how this method\
    \ has been implemented:\n\n```\nhandleMainContainerClicked: function (e) {\n \
    \ if (e.target != e.currentTarget) {\n    e.preventDefault();\n    e.stopPropagation();\n\
    \n    if (e.target.tagName.toUpperCase() === 'IMG') {\n      sandbox.contextObj.handleImageClick(e.target);\n\
    \    } else if (e.target.tagName.toUpperCase() === 'A') {\n      sandbox.contextObj.handleFavLinkClick(e.target);\n\
    \    }\n  }\n}\n```\n\nAs shown, we check to see if the click is taking place\
    \ on an image or on an anchor tag, and based on this determination, we delegate\
    \ the rest of the event processing to the associated methods."
