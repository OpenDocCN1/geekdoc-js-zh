    # Refactoring Images Inc. application to use AMD format


    To leverage the functionality that RequireJS provides for us, we are going to
    take two different approaches here. First, we are going to convert all of the
    submodules in the Core module into AMD modules.


    Second, we are going to load all of our other files in the application, including
    our application''s components, as non-AMD modules. These two approaches will provide
    us with a practical exercise to put our knowledge of RequireJS and AMD modules
    to good use.


    # Modifying Core modules into AMD modules


    In this section, we are going to look at ImagesInc_Core.LoggingHandler submodule
