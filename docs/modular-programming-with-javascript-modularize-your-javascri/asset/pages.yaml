  md: '# Chapter 5


    However, in our new augmenting implementation we are adding our module interface
    methods directly to the module object that is passed into the anonymous function.
    Also, the module object passed into our anonymous function is either a reference
    to ImagesInc_GlobalData or a reference to an empty object.


    There is one other subtle point to notice here. Both the augmenting code and our
    original module code are returning an object reference to the ImagesInc_GlobalData
    variable, which is very important.


    To explain this, we need to dig a little deeper. There are times in our applications
    that the code we is augmenting are loaded asynchronously. This means that we cannot
    be sure of which code is executed first. When we return a reference to our object
    from the original module and the augmenting code, we can be sure that regardless
    of the code execution order, our module is augmented properly.


    In our example, if there is an ImagesInc_GlobalData that already exists in the
    global namespace, we augment it with the new properties, and add new properties
    to it. That is why in both instances (the original module code and the augmenting
    code) we execute our IIFE with the following call:


    ```

    (ImagesInc_GlobalData || {})()

    ```


    This provides us with the ability to create or augment our module in a non-strict
    order, hence the use loose augmentation.


    On course, the main advantage of this technique is that we don''t have to worry
    about which file is loaded first; either way, our module is created and augmented
    as intended.


    Keep in mind that in both cases, we need to make sure that we create the same
    global variable, ImagesInc_GlobalData, so that when we check for the existence
    of this object in the global namespace, the correct reference is passed.


    It is time to put our code to the test. After the modifications mentioned previously,
    we can run the following line of code:


    ```

    // displays "this is a test for module augmentation"

    ImagesInc_GlobalData.getExtendedModuleMsg();

    ```


    As you can see, the correct message is shown in the console. Now, let''s see what
    happens if we change the order in which our JavaScript module files are loaded
