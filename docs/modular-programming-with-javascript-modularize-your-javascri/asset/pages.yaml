- img_proc: true
  md: '# Module Augmentation


    In the previous chapter, we started creating simple modules for our fictitious
    Images Inc. web application. In this chapter, we will take one of the modules
    that we have already built and add more functionality to it using an approach
    known as module augmentation.


    This approach allows us to extend our modules without the need to change the original
    implementation. There are different techniques which can be used to implement
    module augmentation, and we will cover a couple of them in this chapter.


    Module augmentation can be very useful when working on projects that have many
    contributors to the code base. This type of projects usually require us to extend
    our modules by adding new code and functionality to what has been already developed
    by other developers.


    The concepts that we will cover in this chapter:


    +   - The idea behind module augmentation

    - Loose augmentation

    - Tight augmentation

    - Generating our application''s content area

    - Module augmentation and script loading order

    - Advantages and disadvantage of different augmentation techniques


    # Principles of module augmentation


    As you saw in the previous chapter, we created specialized modules to do some
    specific tasks for us. However, as we move forward and develop our application
    further, we are going to require more functionality from our modules, and we will
    also require additional specialized modules.'
  merge: -1
  pgno: 97
- img_proc: true
  md: "# Module Augmentation\n\nWhen you are working on a large project, it is quite\
    \ normal to have many developers working on various pieces of the application.\
    \ It is also possible to have many developers working on the same part of the\
    \ application together which requires a seamless approach for combining efforts\
    \ and the functionality that they add to the application.\n\nLet's consider our\
    \ GlobalData module from the previous chapter as an example. This module was responsible\
    \ for storing and caching application-level data. However, in its current state,\
    \ it holds a very limited amount of application-level data. It is quite feasible\
    \ to assume that different developers are working on other pieces of the application,\
    \ they need to store specific application-level data in the same module.\n\nOne\
    \ way to do this, is by modifying the GlobalData module manually and adding more\
    \ data and interfaces to it. But we need to keep in mind that the more people\
    \ who modify the module, the higher possibility of something breaking in the module's\
    \ code and for accidental modification to the important application-level data\
    \ in an undesirable way.\n\nOn the other hand, the original module file may not\
    \ be accessible to some developers for various reasons, which may hinder the cooperative\
    \ development of our application.\n\nWhat if we could come up with a way which\
    \ would enable each developer to add the required functionality to the original\
    \ module without the need to modify or require the original module's code?\n\n\
    Module augmentation allows us to do that in a very robust way. As the name implies,\
    \ this concept is about adding functionality (properties) to the original module,\
    \ without changing the original module's code directly. The general idea is that\
    \ we can create a namespace which imports the original module at runtime and adds\
    \ new functionality to it as required.\n\n# Implementing module augmentation\n\
    \nImagine that we have a module called ModuleA and, as a developer, you want to\
    \ add more functionality to this module. However, for some reason, you decide\
    \ to implement this new functionality in a completely separate module and then\
    \ augment the original module with all the data and capabilities of this new.\
    \ You can achieve this as follows:\n\n```\nvar ModuleA = (function(coreModule)\
    \ {\n  var someData = \"this is some data to be used later\";\n  coreModule.someMethod\
    \ = function() {\n    return someData;\n```\n\n> [ 80 ]"
