  md: '# # 6

    # Cloning, Inheritance, and Submodules


    In the previous chapter, we looked at how we can extend modules using loose and
    tight augmentation.


    In this chapter, we are going to explore some other techniques that may come handy
    when we are working with modules, which can help us extend and modify the functionality
    of our modules. Depending on the requirements of your applications, as well as
    your personal preferences, some or all of these techniques may be of use to you.


    The beginning of the chapter will provide an overview of some of the approaches
    for creating object based on other objects which you may already be familiar with.
    Then, we will look at how object cloning can be used to create objects that are
    replicas of other objects.


    We will also create one of the core modules for our application, which will be
    utilized to clone objects as needed.


    In this chapter we will cover:


    +   - Module cloning and when to use it

    - Different methods for cloning objects

    - Using inheritance to extend modules

    - Adding functionality to already created modules using submodules

    - Internal private state and how it is affected when extending modules'
