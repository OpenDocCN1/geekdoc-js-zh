  md: "The following is a depiction of how the mediator pattern is implemented:\n\n\
    ![](img/7ce8facf2661aaaf5010fe7a99cadff7_155_0.png)\n\nThe core module in our\
    \ application acts as the mediator, which enables the components (modules) to\
    \ subscribe to and publish events without knowing about each other, still adhering\
    \ to the principle of loose coupling among our components and modules.\n\nConsider\
    \ the following code snippet:\n\n```\nsandBox.publishCustomEvent({\n  type: 'support-Clicked',\n\
    \  data: 'support'\n});\n```\n\nHere, the footer component in our application\
