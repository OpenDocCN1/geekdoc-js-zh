  md: '# Designing Simple Modules


    The main content area of the page (colored red in the middle of the page), is
    the area that will be updated as the user navigates through the pages in our application.
    The header and footer of the page will not be re-rendered for any of the application''s
    pages, as our application is built on SPA principles.


    As you can see, I have used some interesting background colors to depict each
    fragment of the page. I like to call this color-coding of the page fragments.


    The reason for this coloring scheme is to easily distinguish each specific region
    of the page in our visual design. When we are finished with our application implementation,
    this page will look a lot better, but for now, this is a good starting point.


    Of course, if you are reading this book in a black and white medium, you only
    see light and dark shades in the preceding image.


    # Generating client application''s view dynamically


    One of the techniques that I use in my applications is what I call Dynamic Page
    Generation (DPG).


    The idea is that each main fragment of the page is associated with an object definition,
    and in this definition the characteristics of the page fragment are defined. For
    instance, in our design for this application, I have considered three distinct
    fragments on the page: the header fragment, the content fragment, and the footer
    fragment.


    Each main fragment, in turn, could further be divided into sub-fragments and each
    sub-fragment may or may not have its own distinct object definition.


    On the other hand, we could have only one object definition for the entire page,
    which would be used to dynamically generate the page as a whole.


    Generally speaking, the decision on how to associate an object definition to a
    page fragment or a sub-fragment is in the hands of the user interface developer.
    The developer makes these decisions by considering factors such as the frequency
    at which a fragment or sub-fragment needs to be updated, or whether a page fragment
    needs to be updated independently of other fragments of the page. Of course, performance
    also plays a major role in such decisions.


    There are also instances when building certain page fragments on the server side
    is more robust than building them on the client.'
