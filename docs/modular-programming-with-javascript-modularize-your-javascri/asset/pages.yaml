    # # Dynamic loading of components by MainCore


    As you may recall, I mentioned previously that application components can be loaded
    at a later time than the application''s start-up. MainCore module provides the
    hooks and implements the functionality to achieve this.


    I think it might be a good idea to go back to the previous chapter and have a
    look at the flow diagram which depicts this mechanism before continuing with the
    explanations to follow, just so you can refresh your memory.


    In our application, when the user clicks the Support link provided in the footer
    section, a dialogue box is displayed. This dialogue box provides information regarding
    the images of our application have been taken from and when the user would like
    to visit that site.


    This widget component (notificationWidget) is not loaded in index.html page when
