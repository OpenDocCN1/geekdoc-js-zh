  md: '# Review of Important JavaScript OOP Concepts


    ```

    var childInstance1 = new ChildType();

    var childInstance2 = new ChildType();

    childInstance1.baseValue = 100;

    childInstance2.baseValue = 55;


    console.log(childInstance1.getBaseValue()); //displays 100

    console.log(childInstance1.getChildType()); //displays 50

    console.log(childInstance1.secondBaseValue()); //displays 99


    console.log(childInstance2.getBaseValue()); //displays 55

    console.log(childInstance2.getChildType()); //displays 50

    console.log(childInstance2.secondBaseValue()); //displays 99

    ```


    In this latest implementation, we are using the call method in the ChildType constructor
    to copy all the properties of BaseType. This provides the child object with the
    ability to modify the properties of BaseType, which only affects that particular
    instance of ChildType and does not get reflected in other instances of ChildType.


    In our example, this type of inheritance is initiated in the following statement
    in the ChildType constructor:


    ```

    BaseType.call(this);

    ```


    We have also assigned the prototype of BaseType to ChildType, as shown:


    ```

    ChildType.prototype = BaseType.prototype;

    ```


    Note that we have assigned only the prototype object of BaseType to the prototype
    object of ChildType, thus eliminating the call to the BaseType constructor, resulting
    in more efficient code.


    This approach also has the advantage of allowing us to share all the properties
    that have been defined on the prototype object of BaseType among all the instances
    of the child object. Therefore, every child instance will have its own copy of
    properties, which leads to better code efficiency and memory management.


    Once we create an instance of ChildType, this instance has to copied properties
    from BaseType as well as all the shared properties defined on the prototype object
    of BaseType. Of course, each instance also has access to all of its properties
    defined on the ChildType constructor and on the ChildType prototype object.


    Parasitic combination inheritance provides us with the best of both previously
    discussed techniques (prototype chaining and constructor stealing) and it is widely
    used by many experienced JavaScript developers.'
