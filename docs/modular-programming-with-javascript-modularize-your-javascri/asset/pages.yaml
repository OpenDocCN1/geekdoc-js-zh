    # Providing application-level extensibility


    From the beginning, we designed our application on modular architecture. One of
    the advantages of our modular architecture provides the ability to easily extend
    our application''s functionality and capabilities when needed.


    As you saw, the functionality of our application was enhanced using various techniques,
    such as loose augmentation, tight augmentation, and sub-modules.


    While our application might provide quite a bit of functionality, it is a reasonable
    to assume that more features and capabilities will be needed in the future.


    For instance, imagine that one or more of our future components need to form field
    validation. This functionality can be easily added to our application by extending
    the core module and providing the functionality to our components.


    [144]'
