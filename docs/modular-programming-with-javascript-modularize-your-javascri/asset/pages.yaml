    # The look and feel of our application


    Please note that the aim of this application is to help you

    understand the concepts of modular design as it relates to

    JavaScript applications, and as such the focus has not been on the

    look and feel.


    While we will improve the appearance of the application as we

    move forward, I''m sure you can improve its appearance quite a

    burther on your own. Our application is somewhat responsive

    based on the browser view-port but can certainly use more CSS

    pol to make it fully responsive.


    However, I do consider this application as a Minimum Viable

    Product (MVP) for our purposes. Please feel free to download

    t code from the site that accompanies this book and improve it

    as you desire. Also, I have only tested this application in Chrome

    46.0, but a production-quality application needs to be tested in a

    variety of different browser types and versions.


    # Application model


    The last main piece of our MV implantation is the model. The main role of this
    piece

    is to store application-level data. In a client application, such data can be
    stored in

    cache, cookies, or in local or session storage.


    In the main application for this book, we will be using most of such mechanisms

    to store our application''s data. Also, as a general point, depending on the

    plementation of the MV architecture, changes in the model''s data can trigger

    changes in the application''s view.


    It is very important to shield application-level data from accidental overwrites
    and

    modifications. In our implementation, we are going to use the module pattern once

    again to create a module which will act as our application''s model and will provide
    a

    good level of protection for the stored data.'
