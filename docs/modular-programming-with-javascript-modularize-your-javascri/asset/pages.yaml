  md: '# Designing Simple Modules


    If you are wondering how PageUpdater object can call the method inside of our
    container function and how the link is established between the two, you need to
    think of one word: closure!


    We talk about closures in Chapter 2, Review of Important JavaScript OOP Concepts.
    If you recall, the anonymous object returned from the IIFE was defined inside
    the container function, it has access to the internal private scope of our container
    function. This means PageUpdater has access to all the private variables and methods
    defined inside of that. This is why the methods that are returned as part of the
    interface from the module are called, privileged methods.


    Having problems understanding the module pattern?

