  md: 'Module Design Pattern


    If we try to access the function variables directory from the returned object
    such as:


    ```

    console.log(mySingletonObj.name); // displays undefined

    ```


    We are unable to do this. This is because the name property is a private property
    of the container function and it does not exist on the returned anonymous object.


    However, we can access this property through the privileged method getName, which
    is defined on the singleton object returned by our IIFE.


    As mySingletonObj variable has a reference to this singleton object, if we execute
    the following code:


    ```

    console.log(mySingletonObj.getName()); // displays "Sasan"

    ```


    We are able to access the value assigned to the name property of the function.
    Note that the singleton object returned from the IIFE still has access to the
    context of the anonymous function that contains it. This is possible because we
    have created a closure. Of course, the same applies to the title property of the
    function we have seen here:


    ```

    // displays "Software Developer"

    console.log(mySingletonObj.getTitle());

    ```


    This approach of structuring our code in such a way that a returned singleton
    from inside a function provides access to the private members (internal private
    scope) of the container function object) is what forms the basis of module pattern
    in JavaScript.


    # Internal private scope in module pattern


    Module pattern enables us to create a private scope for our code inside a function
    while providing controlled access to such a private scope through an interface.
    This interface can be in the form of a returned singleton object.


    In the example in the previous section, mySingletonObj is the interface to the
    private scope of our IIFE.


    What happens if we add another property to mySingletonObj that has the same identifier
    as one of the properties of the containing function?


    Well, mySingletonObj is like any other object in the sense that we can add properties
    to it regardless of it containing the object''s properties. However, the important
    thing to remember is that assigning or modifying such properties on the returned
    interface has no effect on the private variables encapsulated in the function
    that contains the returned object.'
