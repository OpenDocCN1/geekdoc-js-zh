    \      scriptFile, pageDefinitionObj.scriptPath, function() {\n      mainCore.initializeComponent(pageDefinitionObj)\n\
    \      loadedComponentCallback());\n    });\n\n    mainCore.loadCSSFromObjDef(pageDefinitionObj.cssFile,\n\
    \      pageDefinitionObj.cssPath);\n\n}\n```\n\nAs you can see, this method can\
    \ call other methods that specialize in loading .js or .css files, as the mechanism\
    \ for loading the files in the application is different, based on the type of\
    \ use. Of course the .js file is where the code for the component resides and\
    \ the .css file has the styling-related information for the component.\n\nKeep\
