    ```


    ```

    var myTotalCars = myFactoryModule.getCarCount()

    console.log(myTotalCars); // displays 1

    ```


    As you can see, the outside code can call our module''s interface to create cars
    and also get a count on the number of cars created. It can also remove a car,
    if it is desired to do so.


    There are three privileged methods in this module: createCarCount, and removeCar.
    You can think of these methods as bridges between the internals of the module,
    which are hidden away from the outside world, and the external code, which relies
    on the internals of the module to do some specific tasks.


    The privileged methods (which are members of the singleton interface object) are
    exposed to the external code to provide the module''s functionality to whoever
    needs its services.'
