  md: '# Module initialization and design considerations


    At the application design time, you decide on how the modules should be initialized
    and how the initialization method in each module should be called. The important
    point is that the initialization routine of each module should not cause a tight
    coupling.


    For consistency reasons, as well as of maintainability, I usually name the methods
    that are responsible for initialization tasks in all of my application modules:
    `initialize` or `init`. This allows me to use a for loop to call all the the registered
    modules in sequence and ask the modules to initialize themselves accordingly.


    Keep in mind that creating loose coupling among modules is only possible as long
    as the interfaces (public method hooks) in our modules do not change their names
    and their accessibility for the external code.


    This means that, for example, if `testModule` calls the `GlobalApp.registerModule`
    to register itself, this should always be possible to call that method for registration.
    This should hold true even if the mechanism of this registration takes places
    internally in the `GlobalApp` object.


    The architecture and design that you saw in our simple application creates a foundation
    for creating loose coupling among our application modules. This in turn leads
    to a more extensible and maintainable implementation for both small and large
    applications.


    You can look at module interfaces as contracts among modules, which enables them
    to interact with each other regardless of how the internals of such contracts
    are implemented. Note, while there are contracts among modules in the application,
    there is no direct dependency among them. Each module is free to decide on how
    to implement its specific functionality to accomplish the tasks that it was designed
    to.


    This is so, as long as the module provides the functionality and the service which
    is expected from it.


    This approach will provide a great deal of flexibility and extensibility for our
    application. It allows us to add, remove, and modify various parts of our application
    in a very targeted and manageable manner without such changes having an impact
    on other pieces of the application.


    The fundamental architectural concepts that we discussed here are the concepts
    that will form the building blocks of the final application that we will build
    in this book.'
  merge: -1
