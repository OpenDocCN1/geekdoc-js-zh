  md: '# Enterprise Grade Modular Design, CommonJS, AMD, and ES6 Modules


    The second value in our dependency array is **jQuery**. We are not specifying
    a path for jQuery here, as it is being used as a global variable.


    # jQuery and AMD format


    > As of version 1.7, jQuery supports AMD format. However, for it to be loaded
    properly as an AMD module, we can only place it in the same location as our config.js
    file. Since we would like to have all of our third-party libraries under libs
    folder in our project, we need to do a little bit of configuration. We will talk
    about this shortly.


    The second parameter passed to `define` method is the callback function that gets
    executed after our `person` module''s dependencies are loaded.


    As the preceding code shows, this callback function receives two parameters, which
    are matched one-to-one to the dependency list defined for the `person` module.


    We also return an object from this callback function which is our `person` module
    that can be consumed by other modules.


    # Consuming our person AMD module


    Since `person` module is created as an AMD module, we can consume it as a dependency
    in other modules by only specifying its path.


    Have a look at how our main module (`in.js`) requires and uses `person` module,
    as shown in the following:


    ```

    // bootstrap file

    require([''modules/person'', ''jquery'', ''person2''],

    function(person, $$, person2) {

    ```


    ```

    console.log("Accessing Person " + person.first + " + " + person.last;");

    from main -> " * " + person.first + " + " + person.last);

    console.log("$$ " + $ + " --> jquery from main");

    console.log("Accessing person2 " + person2.first;");

    from main -> " * " + person2.first)

    }

    ```


    The preceding syntax should be a lot more familiar to you. We are telling RequireJS
    (using `require` method) to load all the dependencies listed in the dependency
