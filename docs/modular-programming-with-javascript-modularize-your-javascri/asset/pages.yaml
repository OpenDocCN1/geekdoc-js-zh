  md: "# Handling an image click event\n\nWhen an image is clicked in the content\
    \ area of the application, the following\nmethod is called:\n\n```\nhandleImageClick:\
    \ function (elem) {\n  var imgName;\n\n  imgName = elem.getAttribute('data-name');\n\
    \  sandBox.publishCustomEvent({\n    type: 'img-Clicked',\n    data: imgName\n\
    \  });\n  sandBox.addToHistory({\n    url: imgName\n  });\n\n}\n```\n\nNotice\
    \ that this method does two things. One is to update the history object of\nthe\
