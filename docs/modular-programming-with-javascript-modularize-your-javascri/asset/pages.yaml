  md: '# Designing Simple Modules


    In this chapter, we are going to focus on applying the concepts that we have learned
    in the previous chapters to design some simple modules for our application.


    We will start by analyzing our application''s functionality as a whole and then
    we will break it down into smaller functional pieces. Once we have decided on
    our application''s functional pieces, we will start creating simple modules to
    implement the required functionality.


    This chapter is meant to demonstrate the possible steps in the beginning of our
    application''s life cycle, based on our requirements. The goal is to see how using
    modules can help us design a better architecture and get a feel for the practical
    advantages of a modular design.


    The simple modules that we create in this chapter will provide the foundation
    for our final application in this book, which will be a working client-side single
    page application.


    In this chapter we will cover:


    +   - Reflecting the overall application requirements in our design

    - Designing the application''s main pieces

    - Creating specialized modules for our application''s main pieces

    - Collaboration among modules

    - Using object definitions to describe page fragments

    - Dynamically generating pages and page fragments'
