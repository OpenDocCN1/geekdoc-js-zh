  md: "# Augmenting MainCore using tight augmentation\n\nConsider the following augmentation:\n\
    \n```\n// event related functionality augmentation\nvar ImagesInc_Core = (function(Core)\
    \ {\n  var $ = Core.Query;\n  var addEventHandlerToElem = function(elem, event,\
    \ callbackFunc) {\n\n  if(elem) {\n    Core.log(3, 'elem is not passed in,\n \
    \     from addEventHandlerToElem);\n    throw new Error('Element not found');\n\
    \  }\n\n  Core.addEventHandlerToElement = addEventHandlerToElem;\n  Core.removeEventHandlerFromElem\
    \ = removeEventHandlerFromElem;\n  Core.registerForCustomEvents = registerForCustomEvents;\n\
    \n  return Core;\n}) (ImagesInc_Core); // using tight augmentation\n```\n\nHere,\
    \ we have made a logical separation between the code that deals with event-related\
    \ functionality in MainCore module and the rest of the code related to this module.\n\
    \nNotice that we have passed a reference of MainCore module (known to the application\
    \ as ImagesInc_Core) to the JIFE that implements this augmentation (using tight\
    \ augmentation technique) and then we have added new properties to MainCore module\
    \ as needed. At the end, the reference to the newly augmented MainCore module\
    \ is returned to ImagesInc_Core, which is the global variable that provides access\
    \ to MainCore module.\n\nWe use the same technique in another part of the code\
    \ to augment the module with more functionality. Please have a look at the related\
    \ code in MainCore.js file of the application.\n\n# Augmenting MainCore using\
    \ sub-modules\n\nLet's look at an example of how we add sub-modules to MainCore.\
    \ To add enhanced logging functionality to the application, we have augmented\
    \ MainCore module with a sub-module which specializes in logging messages for\
    \ the application."
