  md: '# Storage handler module


    This module has the specific responsibility of storing application-related data.
    Data can be stored in cookies or in other storage facilities provided by the browser,
    such as HTML 5 local storage.


    # Communication handler module


    All application-related communication is done through this module. This module
    is mainly designed to use AJAX calls to communicate with the back-end server.
    However, the method of communication that this module might not be limited by
    AJAX calls at some point in the future.


    # Utilities module


    This module is for providing utility type functionality to the application. For
    instance, it can do string manipulation, object cloning, or page resize calculations.


    # Message handler module


    As events take place in the application, we need a way to communicate such events
    with the users and display messages on the application''s pages. This module specializes
    in this task.


    # Logging handler module


    This module provides all functionality related to the logging mechanism of the
    application. The logging can take place on the client side, the server side, or
    both.


