  md: '# Application controller modules


    Considering the role of the controller in our application as mentioned, we are
    going to design this piece based on specialized modules. These modules together
    create what we are referring to as the **core** module.


    Keep in mind that since we are using specialized modules for our core, each module
    can easily be modified or replaced without affecting the other parts of the application,
    that is, with the exception of the functionality that is related to that module
    and that module only.


    Of course, we can add more modules to the core, if we decide that additional functionality
    is needed at some point in the future.


    It is the collective functionality of the controller modules that provides the
    core functionality of the application.


    Based on our application''s requirements, I anticipate that we will be needing
    the following modules in our application controller:


    +   - Page updater module

    - Storage handler module

    - Communication handler module

    - Utilities module

    - Message handler module

    - Logging handler module


    Keep in mind that we are making our best guess as to what modules are required.
    The list can change over time as we proceed further in our implementation. The
    idea is to design and implement the modules that we think we will be needing at
    this time, to have a starting baseline. However, the list of the modules, their
    functionality as well as the names that we choose for each can change over time.


    Let''s start by exploring how the functionality of each module in our application''s
    core will be.


    # Page updater module


    This module is responsible for building HTML pieces in our application. It does
    this task by injecting a string to it into a container. This string corresponds
    to the HTML elements that need to be rendered into the predefined container.


    We will be building various pieces of our application pages and updating them
    dynamically as required, using this module.'
