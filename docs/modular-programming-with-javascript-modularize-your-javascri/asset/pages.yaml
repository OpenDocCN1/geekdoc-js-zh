  md: "# Application implementation\n\nFrom the beginning, our intent in the design\
    \ of our application was to create a modularized ecosystem in which different\
    \ pieces of the code (modules) would be joined together to create a fully functional\
    \ application. To that end, our code have been structured as displayed in the\
    \ following screenshot:\n\n```\nImages/\n  css\n  Images\n  js/\n    Components\n\
    \    Modules/\n      Base\n      Core\n      GlobalData\n      PageDefinitions\n\
    \    Widgets\nindex.html\n```\n\nAs you can see, our application has been organized\
    \ into three main folders: css which hosts all of our styling files, Images which\
    \ stores all the images in the application's category; and js, which contains\
    \ all the JavaScript code for our application. This structure is only one approach\
    \ to organizing the application's code, you may decide to organize the code differently.\n\
    \nUnder js we have organized our JavaScript files further into three main folders:\
    \ Components which contains the files related to modules that have views associated\
    \ with them, Modules which contains our modules for the controller and Model of\
    \ the application, and Widgets which hosts files related to components that are\
    \ loaded and rendered dynamically in our application.\n\nOur Modules is further\
    \ broken down into five sub-folders: Base which contains our third-party dependencies\
    \ and the base module, Core which hosts the controller's code (modules) for our\
    \ application, GlobalData which holds our application's model files."
  merge: -1
  pgno: 180
- img_proc: true
  md: "The other two sub-folders, SandBox and PageDefinitions contain the sandbox\
    \ module and object definitions file for our dynamically loading components, respectively.\n\
    \nWe will examine the code in most of the files of our sub-folders in the following\
    \ sections.\n\n# Loading our module files in index.html\n\nBefore we start looking\
    \ at our JavaScript code and modules, let's have a closer look at index.html file\
    \ and see how the application modules are loaded in the browser.\n\nOur index.html\
    \ page is designed in such a way that it provides the bare minimum skeleton for\
    \ our application's main page, and all the other pieces (header, footer, and content)\
    \ are built dynamically when the page is loaded.\n\nGenerally speaking, there\
    \ are instances when it makes more sense to build of the pieces of the application's\
    \ pages on the server before sending them to the client, since this implementation\
    \ could provide better performance at times.\n\nIn our approach, we are building\
    \ all the pieces of our application's pages on the client. This is so we can examine\
    \ and apply different contents of our application's design a little easier.\n\n\
    The skeleton of our index.html file contains three main containers, as follows:\n\
    \n```\n<header id=\"headerContainer\" role=\"banner\" itemscope\nitemtype=\"https://schema.org/WPHeader\"\
    \nclass=\"headerContainerClass\">\n</header>\n\n<main id=\"mainPageContainer\"\
    \ role=\"main\" class=\"clearfix\nmainPageContainerClass\">\n</main>\n\n<div id=\"\
    footerParentContainer\" class=\"FooterContainer \" \n<div id=\"footerContainer\"\
    \nclass=\"footerlinksContainerClass\">\n</div>\n</div>\n```\n\nAs you can see,\
    \ we have our header container, which hosts the header component of our application,\
    \ the main container, which hosts the content component of our application and\
    \ a div, which is the container for our footer component."
