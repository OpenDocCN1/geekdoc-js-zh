    Page has changed /index.html Logger, s:28

    ```


    As you can see, when the application is loaded, all the modules as well as the
    components in the application are initialized and the related messages are displayed.


    All that the components need to do is call the sandbox module with the message,
    and the sandbox module will turn the message to the core module. In case of other
    core modules, they can directly use the core module''s logging mechanism.


    Here is a code snippet which shows how the footer component logs its initialization
    using the core module''s logging mechanism:


    ```

    sandbox.logMessage(1, ''Footer component has been initialized.'', ''blue'');

    ```


    To log an error message, the footer component only needs to do the following:


    ```

    sandbox.logMessage(3, ''Footer component has NOT been initialized correctly --''
    '' + e.message);

    ```


    This is a much simpler and better approach than the footer component implementing
    its own error-handling mechanism.


    — 143 —'
