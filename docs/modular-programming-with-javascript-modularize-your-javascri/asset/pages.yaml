  md: "# Initializing and destroying components\n\nIn our architectural design, we\
    \ can load and unload components (modules) both at the start-up phase of the application\
    \ as well as any time after.\n\nThis is pretty robust, since it allows us to load\
    \ what we need when we need it, which helps to keep the consumption of the resources\
    \ on the device to a minimum, as well keeping the application very light and responsive.\
    \ This could be particularly important for mobile devices.\n\nWhen a component\
    \ is loaded (either at application start-up or any other time), it first registers\
    \ itself with the core module and then the core module calls the init method of\
    \ the component when it needs to be initialized.\n\nConsider the following code\
    \ snippet and see how this is done:\n\n```\nImagesInc_Core.registerComponent(\"\
    footerContainer\", \"footer\", function(sandbox) {\n  return {\n    init: function()\
    \ {\n      try{\n        sandbox.updateElement(\"footerContainer\",\n        ImagesIncGlobalData.getFooterHTMLTxt());\n\
    \        this.registerForEvents();\n        sandbox.contextObj = =\n        sandbox.logMessage(1,\
    \ 'Footer component\nhas been initialized...', 'blue');\n      } catch(e) {\n\
    \        sandbox.logMessage(3, 'Footer component has NOT\nbeen initialized correctly\
    \ --> ' + e.message);\n      }\n    }\n  }\n```\n\nAs you can see that each component,\
    \ upon loading calls the registerComponent method of the core module. Note that\
    \ the core module is known as ImagesInc_Core to other application pieces.\n\n\
    The component sends the ID of its container (footerContainer for instance) as\
    \ well as its own ID (shown as footer in the preceding code) as parameters to\
    \ the registerComponent method of the core module."
  merge: -1
  pgno: 156
- img_proc: true
  md: "It also sends a reference to the function that the core module needs to call\
    \ to create an instance of the component. This function is then called by the\
    \ core module with an instance of the sandbox module, which is an interface for\
    \ the component to use for interacting with the application from this point forward.\n\
    \nHere is registration of the component is in the core module:\n\n```\nmainCore.registerComponent\
    \ = function(containerID,\n    componentID, createFunc) {\n\n    if(createFunc\
    \ && typeof createFunc === 'function') {\n        componentObj = createFunc(new\n\
    \            SandBox(this, containerElem, componentID));\n        if (componentObj.init\
    \ && typeof componentObj.init ===\n            'function' && componentObj.destroy\
    \ && typeof\n            componentObj.destroy === 'function') {\n            componentObj.id\
    \ = componentID;\n            registeredComponents.push(componentObj);\n     \
    \   }\n    }\n}\n```\n\nAs you can see, the core module first checks to see if\
    \ the component has the required methods, init and destroy, and if so, the creator\
    \ function (createFunc) on the component is called to create an instance of the\
    \ component.\n\nYou can think of this phase as the hand-shake phase between the\
    \ component and the core module specifically, as well as the hand-shake of the\
    \ component with the application as a whole.\n\nAs mentioned, the component is\
    \ also required to have a destroy method, which allows the core module to either\
    \ disable the component for event handling and/or to completely remove the component\
    \ from the application.\n\nAt the start-up phase of application, the core module\
    \ goes through all the registered components and calls the init method on all\
    \ of them, as shown:\n\n```\nfor(var i=0; i < registeredComponents.length; i++)\
    \ {\n    registeredComponents[i].init();\n}\n```"
