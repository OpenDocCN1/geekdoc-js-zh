    As you can see, we have created a GlobalData module to keep our application-level
    data.


    I''m sure you are pretty familiar with how the mechanism works by now. We have
    created an IIFE to return an object to our private namespace(module). This object
    provides two methods: getHeaderHTMLTxt and getFooterHTMLTxt.


    These methods return the property values of two private variables headerContainerDef
    and footerContainerDef respectively.


    Note that we have not provided methods to set the values for these variables,
    and since they are private variables in our module, we have created a degree of
    encapsulation. Thus, shielding our data from outside influence.


    The property value of headerContainerDef is a string representation of the HTML
    elements in the Header fragment.


    This string is used to populate the Header fragment of our application''s view,
    as shown:


    ```

    PageUpdater.updateElement("headerContainer",

    GlobalData.getHeaderHTMLTxt());

    ```


    Just the same, the property value of footerContainerDef is a string representation
    of the HTML elements in the Footer fragment.


    This string is used to populate the footer fragment of our application''s view,
    as shown:


    ```

    PageUpdater.updateElement("footerContainer",

    GlobalData.getFooterHTMLTxt());

    ```


    Note that when we rendered our header and footer fragments previously, we used
    global variables (such as headerContainerDef) to get the required strings for
    the page fragments.


    However, in our new implementation, we access these strings using the GlobalData
    interface methods.


    An important point to keep in mind here is that we have implemented two independent
    modules (PageUpdater and GlobalData) that work together to create the building
    blocks of our application. We will leverage the collaboration among our application
    modules further as we advance through the next chapters, and will implement the
    full functionality of our application on such basis.


    # [ 75 ]'
