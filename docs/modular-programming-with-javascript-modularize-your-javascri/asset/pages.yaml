    As shown, we have added a property to ImagesInc_Core object (MainCore module).
    An IIFE returns an object to this property (LoggingHandler) when it is executed.
    This object consists of two methods which provide all functionality related to
    the logging mechanism of the application.


    While the implementation of these two methods is hidden away from the rest of
    the application, other pieces of the application can interact with this sub-module
    through MainCore module and the related interface.


    Notice that this sub-module can easily be swapped for a different one or modified
    internally in. However, as long as the exposed interface does not change, all
    the external code would still be able to use this sub-module for its logging functionality.


    In fact, we can remove this sub-module completely and it will not affect the application
    at all, except for that the advanced logging mechanism for the application would
    be absent. This highlights the advantages of modular design in our application,
    such as **plug-and-play, progressive enhancement**, and **graceful degradation**.


    In the same way, we can also add sub-modules to MainCore module to provide functionality
    without the need to make many changes in the application. This allows us to have
    a flexible and maintainable code base.


    In our application, there are also other sub-modules, which attach themselves
    to MainCore module, and provide added functionality to the application. We talked
    about these sub-modules in the previous chapter but I will mention them again
    here:


    +   - AjaxEngine: This module is responsible for making AJAX calls to the server,
    using jQuery functionality.

    - CookieHandler: This module looks after all the cookie-related operations in
    the application, such as writing, reading, and deleting cookies in the browser.

    - NotificationHandler: This module is responsible for displaying notifications
    to the users by leveraging a dialog box.

    - StorageHandler: All the functionality related to the browser''s local storage
    that is implemented in this sub-module, such as storing, reading, and deleting
    objects in local storage.

    - Utilities: This module provides helper methods to the application, such as methods
    to combine two objects, to see if an object is an array, to load files from the
    server, and so on.'
