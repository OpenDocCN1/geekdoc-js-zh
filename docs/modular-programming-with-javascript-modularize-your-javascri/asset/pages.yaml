  md: '# Summary


    In this chapter, we moved from the conceptual design of modules to the practical
    aspects of implementing them. We started by looking at the high-level requirements
    of our intended application, and then considered the kind of modules that we might
    possibly need to fulfill these requirements.


    We briefly discussed the MV* design pattern and structured our application to
    follow this pattern. Then, based on the functionality and the role that our modules
    play in our design, we categorized them to be part of the controller, view or
    model pieces of our application.


    The view for our application was generated by first creating an index.html page
    skeleton and then populating its main fragments based on object definitions, using
    a core module.


    We also created a safe global data repository for our application to act as the
    model piece of our architecture.


    Example of how modules can collaborate together to complete tasks and provide
    application level functionality was also presented.


    In the next chapter we will extend our application modules and work further on
    the building blocks of our application in a modular design approach.'
