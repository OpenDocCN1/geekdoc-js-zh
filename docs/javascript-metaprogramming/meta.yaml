    \n- JavaScript 虽然很小，但完全灵活\n- 掌握少数技巧就能提供你所需的一切\n- 核心在于对象、属性和函数\n- 如果还没有完全理解，不要担心。试着玩一下。稍后提供幻灯片。\n\
