- md: "\n# Self optimising code\n\n```\nfunction addEvent(element, type, func) {\n\
    \  if (document.addEventListener)\n    element.addEventListener(type, func);\n\
    \  else\n    element.attachEvent(type, func);\n}\n```\n\n```javascript\nfunction\
    \ addEvent(element, type, func) {\n  if (document.addEventListener) {\n    addEvent\
    \ = function(element, type, func) {\n      element.addEventListener(type, func);\n\
    \    };\n  } else {\n    addEvent = function(element, type, func) {\n      element.attachEvent(type,\
    \ func);\n    };\n  }\n  addEvent(element, type, func);\n}\n```\n\n# Pretty APIs\n\
    \n```\nEvent.observe(window, 'load', function() {\n  Event.observe($('country'),\
    \ 'change', function() {\n    if ($F('country') == 'United States') {\n      return\
    \ $('state').show();\n    }\n    $('state').hide()\n  });\n});\n```\n\n```javascript\n\
    // see: http://www.adamlogic.com/\n\nshow('state').when('country').is('United\
    \ States');\n```\n\n# Domain Specific Languages\n\n### DOMBuilder\n\nhttp://danwebbb.net/lowpro\n\
    \n```javascript\nvar ul = document.createElement('ul');\nul.setAttribute('id',\
    \ 'my_list');\nvar li = document.createElement('li');\nvar text = document.createTextNodeNode('Some\
    \ text');\nli.appendChild(text);\nul.appendChild(li);\n```\n\n```javascript\n\
    var ul = DOMBuilder.create('ul', { id : 'my_list' }, [\n  DOMBuilder.create('li',\
    \ null, 'Some text')\n]);\n```\n\n```javascript\nvar ul = $ul({ id : 'my_list'\
    \ },\n  $li('Some text')\n);\n```\n\n# DIY language features\n\n### John Resig's\
    \ method-overloading\n\nhttp://ejohn.org/blog/javascript-method-overloading/\n\
    \n```javascript\nvar users = new Users();\nusers.find(); // Finds all\nusers.find(\"\
    John\"); // Finds by name\nusers.find(\"John\", \"Resig\"); // Finds by first\
    \ and last name\n```\n\n```javascript\nfunction Users() {\n\n  addMethod(Users.prototype,\
    \ \"find\", function(){\n    // Find all users...\n  });\n\n  addMethod(Users.prototype,\
    \ \"find\", function(name){\n    // Find a user by name\n  });\n\n  addMethod(Users.prototype,\
    \ \"find\", function(first, last){\n    // Find a user by first and last name\n\
    \  });\n}\n\n```javascript\nfunction addMethod(object, name, fn){\n  var old =\
    \ object[ name ];\n  object[ name ] = function(){\n    if ( fn.length == arguments.length\
    \ ) {\n      return fn.apply( this, arguments );\n    } else if ( typeof old ==\
    \ 'function' ) {\n      return old.apply( this, arguments );\n    }\n  };\n}\n\
    ```\n\n# Prototype 1.6 Classes\n\nhttp://prototypejs.org/learn/class-inheritance\n\
    \n```javascript\nvar Person = Class.create({\n  initialize: function(name) {\n\
    \    this.name = name;\n  },\n  say: function(message) {\n    return this.name\
    \ + ': ' + message;\n  }\n});\n```\n\n```javascript\nvar Pirate = Class.create(Person,\
    \ {\n  // redefine the speak method\n  say: function($super, message) {\n    return\
    \ $super(message) + ' , yarr!';\n  }\n});\n\nvar john = new Pirate('Long John');\n\
    john.say('ahoy matey');\n// => \"Long John: ahoy matey, yarr!\"\n```\n\n# and\
    \ a lot more...\n\n# Looking back...\n\n- JavaScript is small but totally flexible\n\
    - A handful of techniques provide everything you need\n- It's all about objects,\
    \ properties and functions\n- Don't worry if its not all sunk in. Have a play\
    \ around. Slides will be available.\n\n# Coming Soon...\n"
