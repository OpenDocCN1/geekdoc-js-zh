- md: "\n# Metaprogramming JavaScript\n\nDan Webb (dan@danwebb.net)\n\n# What?\n\n\
    > the writing of computer programs that write or manipulate other programs (or\
    \ themselves) as their data”\n\n# With JavaScript?!\n\n- Small and feisty but\
    \ widely misunderstood\n- Relies on few but powerful constructs\n- You can work\
    \ with functions, arguments, built-ins types and mechanisms like inheritance at\
    \ runtime\n- Techniques underpin many JS libraries\n\n# JavaScript Exposed: Objects\
    \ Out Of Control!\n\n# Play along!\n\n```javascript\n>>> var add = function(a,\
    \ b) { return a + b }\n>>> add(2,3)\n5\n>>> typeof add\n\"function\"\n>>> function\
    \ adder(a) { return function(b) { return add(a, b) } }\n>>> addS = adder(5)\n\
    function()\n>>> addS(10)\n15\n>>> typeof addS\n\"function\"\n```\n\n# 4 building\
    \ blocks\n\n# (Nearly) everything is a hash\n\nnumber\nstring\nboolean\nundefined\n\
    \n# everything else is an Object\n\n```javascript\nvar myObj = new Object;\nmyObj['myProperty']\
    \ = 454;\nmyObj[45435] = true;\nmyObj[true] = 'hello';\n```\n\n# This works with\
    \ any object\n\n```javascript\nvar now = new Date;\nnow[5] = 'hello!';\n\nconsole.log(now[5]);\
    \ //=> 'hello!'\n```\n\n# Accessors: a special case\n\n```javascript\nlocation['thing']\
    \ = 'a';\n// is the same as...\nlocation.thing = 'a';\n\nconsole.log(location['thing']);\n\
    console.log(location.thing);\n// => 'a'\n```\n\n```javascript\n// bad!\neval(\"\
    window.forms.\" + form + \".reset()\");\n\n// good!\nwindow.forms[form].reset();\n\
    ```\n\n```javascript\nvar tags = ['a', 'div', 'span', 'p'];\n\nfor (var i, l =\
    \ tags.length; i < l; i++)\n    find[tags[i] + 'Elements'] = createFinder(tags[i]);\n\
    \nfind.aElements();\nfind.pElements();\n// and so on...\n```\n\n# Inspecting objects\n\
    \n```javascript\nvar person = {\n  name: 'Bob',\n  email: 'bob@bob.com',\n  tel:\
    \ '0258305964'\n};\n\nfor (var key in person) {\n  console.log(key);\n} //=> 'name',\
    \ 'email', 'tel'\n```\n\n```javascript\n// using the person object\n// from the\
    \ previous example...\nif (\"tel\" in person) {\n  alert(person.tel);\n}\n```\n\
    \n# Inspecting types\n\n```javascript\nvar a = 5;\ntypeof a //=> 'number'\nvar\
    \ name = 'Sam';\ntypeof name //=> 'string'\ntypeof doesntExist //=> 'undefined'\n\
    ```\n\n```javascript\nfunction doSomething() {\n  console.log('yay!');\n}\n\n\
    typeof doSomething //=> 'function'\n```\n\n```javascript\nvar anObject = {};\n\
    typeof anObject //=> 'object'\nvar anArray = [1,2,3,4,5,6];\ntypeof anArray //=>\
    \ 'object'\n```\n\n# Wha?!\n\n```javascript\nanArray instanceof Array //=> true\n\
    an0 instanceof Array //=> false\n```\n\n# First typeof\nthen instanceof\n\n# Functions\
    \ are Objects\n\n```javascript\nvar sum = function(n1, n2) {\n  return n1 + n2;\n\
    }\n\nvar a = {};\na.sum = sum;\n\na.sum(1, 2); // => 3\n```\n\n# 'Methods' are\
    \ just functions that are assigned to a property of an object\n\n```javascript\n\
    var a = { counter : 5 };\nvar b = { counter : 10 };\n\na.increment = function(amount)\
    \ {\n  this.counter += amount;\n};\n\na.increment(1)\na.counter; // => 6\n```\n\
    \n```javascript\nb.increment = a.increment;\nb.increment(1);\nconsole.log(b.counter);\
    \ // => 11\n```\n\n```javascript\nfunction (amount) {\n  this.counter += amount;\n\
    }\n\na.increment(5); // => 10\n```\n\n```javascript\nfunction (amount) {\n  this.counter\
    \ += amount;\n}\n\nb.increment(5); // => 15\n```\n\n```javascript\nvar slideshow\
    \ = {\n  init: function() {\n    this.start();\n  },\n  start: function() {\n\
    \  }\n}\n\nwindow.onload = slideshow.init;\n```\n\n```javascript\nwindow.onload();\n\
    ```\n\n```javascript\nwindow.onload = function() {\n  start();\n}\n```\n\n```javascript\n\
    a.increment.call(b, 1); // => 6\na.increment.apply(b, [1]); // => 7\n```\n\n#\
    \ arguments\n\n```javascript\n// add all the arguments sent to\n// function matter\
    \ how many there are\nfunction sum() {\n  var total = 0;\n  for (var i = 0, l\
    \ = arguments.length; i < l; i++) {\n    total += arguments[i];\n  }\n  return\
    \ total;\n}\n\nconsole.log(sum(2, 5)); //=> 7\nconsole.log(sum(10, 20, 30)); //=>\
    \ 60\n```\n\n```javascript\nvalidate('name');\nvalidate('email', { min: 4, max:\
    \ 10 });\n```\n\n```javascript\nfunction validate() {\n  var options = {};\n \
    \ // steal from Array.prototype\n  var slice = Array.prototype.slice;\n\n  if\
    \ (typeof arguments === 'object') {\n    options = slice.call(arguments, 1);\n\
    \  }\n  // code to execute here...\n}\n```\n\n# Functions can return other functions\n\
    \n```javascript\nfunction add(a, b) { return a + b }\n\nfunction adder(a) {\n\
    \  return function(b) {\n    return add(a, b);\n  }\n}\n\nadd(5, 5); //=> 10\n\
    \nvar add5 = adder(5);\nadd5(10); //=> 15\n```\n\n```javascript\nfunction add(a,\
    \ b) { return a + b }\n\nfunction adder(a) {\n  return function(b) {\n    return\
    \ add(a, b);\n  }\n}\n\nadd(5, 5); //=> 10\n\nvar add5 = adder(5);\nadd5(10);\
    \ //=> 15\n```\n\n# Closure\n\n# Back to wikipedia...\n\nA closure occurs when\
    \ a function is defined within another function, and the inner function refers\
    \ to local variables of the outer function.\n\n```javascript\nfunction attachHelpEvents()\
    \ {\n  var windowRef = null;\n  var openLink = document.getElementById('open_help');\n\
    \  var closeLink = document.getElementById('close_help');\n\n  var openWindow\
    \ = function() {\n    windowRef = this.href;\n  };\n\n  var closeWindow = function()\
    \ {\n    if (windowRef) windowRef.close();\n  };\n\n  openLink.onclick = openWindow;\n\
    \  closeLink.onclick = closeWindow;\n}\n\nwindow.onload = attachHelpEvents;\n\
    ```\n\n```javascript\nfunction attachHelpEvents() {\n  var windowRef = null;\n\
    \  var openLink = document.getElementById('open_help');\n  var closeLink = document.getElementById('close_help');\n\
    \n  var openWindow = function() {\n    windowRef = this.href;\n  };\n\n  var onClose\
    \ = function() {\n    if (windowRef) windowRef.close();\n  };\n\n  openLink.onclick\
    \ = openWindow;\n  closeLink.onclick = onClose;\n}\n\nwindow.onload = attachHelpEvents;\n\
    ```\n\n# Why is that useful?\n\n```javascript\nvar slideshow = {\n  init: function()\
    \ {\n    this.start();\n  },\n  start: function() {\n  }\n}\n\nwindow.onload =\
    \ slideshow.init;\n```\n\n```javascript\nfunction bind(func, context) {\n  return\
    \ function() {\n    return func.apply(context, arguments);\n  }\n}\n```\n\n```javascript\n\
    var slideshow = {\n  init: function() {\n    this.start();\n  },\n  start: function()\
    \ {\n  }\n}\n\nwindow.onload = bind(slideshow.init, slideshow);\n```\n\n# Functions\
    \ can be used to make objects\n\n```javascript\nfunction Coord(x, y) {\n  this.x\
    \ = x;\n  this.y = y;\n}\nvar home = new Coord(132, 223);\nconsole.log(home.x);\
    \ //=> 132\nconsole.log(home.y); //=> 223\nconsole.log(home.constructor); //=>\
    \ Coord\n```\n\n# Constructor functions are just functions\n\n# The magic is in\
    \ the new operator\n\n```javascript\nvar london = new Coord(32, 13);\n```\n\n\
    ```javascript\nvar london = {};\nCoord.call(london, 32, 13);\n```\n\n```javascript\n\
    var london = {};\n\nCoord.call(london, 32, 13);\nlondon.__proto__ = Coord.prototype;\n\
    ```\n\n# inheritance\n\n```javascript\nCoord.prototype = {\n  toString: function()\
    \ {\n    return [this.x, this.y].join(', ');\n  }\n};\n\nhome.toString(); // 132,\
    \ 223\n```\n\n```javascript\nhome.toString? // no...keep looking\nhome.__proto__.toString?\
    \ // got it!\n```\n\n```javascript\nhome.__proto__ == Coord\n```\n\n```javascript\n\
    function Marker(name, x, y) {\n  this.name = name;\n  this.x = x;\n  this.y =\
    \ y;\n}\n\nMarker.prototype = new Coord;\n\nvar pub = new Marker('Party!', 12,\
    \ 54);\npub.toString(); //=> 12, 54\n```\n\n```javascript\npub.toString //=> no...\n\
    pub.__proto__.toString //=> no...\npub.__proto____proto__.toString //=> found!\n\
    ```\n\n```javascript\npub.__proto__ == Marker.prototype\npub.__proto__.__proto__\
    \ == Coord\n```\n\n# The point is:\nits all just functions,\nobjects and properties\n\
    \n# We can hack it all.\n\n# So what can you do with this stuff?\n\n# Patch holes\
    \ in bad implementations\n\n```javascript\n// Patch Array#push for IE 5\nif (!Array.prototype.push)\
    \ {\n  Array.prototype.push = function(item) {\n    return this[this.length] =\
    \ item;\n  }\n}\n```\n\n```javascript\n// add 1.6 style Array#forEach to older\
    \ browsers\nif (!Array.prototype.forEach) {\n  Array.prototype.forEach = function(func,\
    \ scope) {\n    scope = scope || this;\n    for (var i = 0, l = this.length; i\
    \ < l; i++) {\n      func.call(scope, this[i], i, this);\n    }\n  }\n}\n```\n"
  mdcn: "\n\n# JavaScript 元编程\n\nDan Webb (dan@danwebb.net)\n\n# 这是什么？\n\n> “编写那些编写或操纵其他程序（或自身）作为其数据的计算机程序”\n\
    \n# 用 JavaScript 实现？！\n\n- 体小而精悍但被广泛误解\n- 依赖于少数但强大的构造结构\n- 你可以在运行时与函数、参数、内置类型以及继承等机制进行操作\n\
    - 这些技术支撑了许多 JS 库\n\n# 揭秘 JavaScript：失控的对象！\n\n# 一来尝试吧！\n\n```javascript\n>>> var\
    \ add = function(a, b) { return a + b }\n>>> add(2,3)\n5\n>>> typeof add\n\"function\"\
    \n>>> function adder(a) { return function(b) { return add(a, b) } }\n>>> addS\
    \ = adder(5)\nfunction()\n>>> addS(10)\n15\n>>> typeof addS\n\"function\"\n```\n\
    \n# 4 个构建块\n\n# （几乎）一切都是哈希表 (hash)\n\n数字 (number)\n字符串 (string)\n布尔值 (boolean)\n\
    未定义 (undefined)\n\n# 其他所有都是对象 (Object)\n\n```javascript\nvar myObj = new Object;\n\
    myObj['myProperty'] = 454;\nmyObj[45435] = true;\nmyObj[true] = 'hello';\n```\n\
    \n# 这对任何对象有效\n\n```javascript\nvar now = new Date;\nnow[5] = 'hello!';\n\nconsole.log(now[5]);\
    \ //=> 'hello!'\n```\n\n# 访问器 (Accessors)：一种特殊情况\n\n```javascript\nlocation['thing']\
    \ = 'a';\n// 等同于...\nlocation.thing = 'a';\n\nconsole.log(location['thing']);\n\
    console.log(location.thing);\n// => 'a'\n```\n\n```javascript\n// 坏做法！\neval(\"\
    window.forms.\" + form + \".reset()\");\n\n// 好做法！\nwindow.forms[form].reset();\n\
    ```\n\n```javascript\nvar tags = ['a', 'div', 'span', 'p'];\n\nfor (var i, l =\
    \ tags.length; i < l; i++)\n    find[tags[i] + 'Elements'] = createFinder(tags[i]);\n\
    \nfind.aElements();\nfind.pElements();\n// 等此类推...\n```\n\n# 检查对象\n\n```javascript\n\
    var person = {\n  name: 'Bob',\n  email: 'bob@bob.com',\n  tel: '0258305964'\n\
    };\n\nfor (var key in person) {\n  console.log(key);\n} //=> 'name', 'email',\
    \ 'tel'\n```\n\n```javascript\n// 使用上一个示例中的 \n// person 对象...\nif (\"tel\" in\
    \ person) {\n  alert(person.tel);\n}\n```\n\n# 检查类型\n\n```javascript\nvar a =\
    \ 5;\ntypeof a //=> 'number'\nvar name = 'Sam';\ntypeof name //=> 'string'\ntypeof\
    \ doesntExist //=> 'undefined'\n```\n\n```javascript\nfunction doSomething() {\n\
    \  console.log('yay!');\n}\n\ntypeof doSomething //=> 'function'\n```\n\n```javascript\n\
    var anObject = {};\ntypeof anObject //=> 'object'\nvar anArray = [1,2,3,4,5,6];\n\
    typeof anArray //=> 'object'\n```\n\n# 啥？！\n\n```javascript\nanArray instanceof\
    \ Array //=> true\nan0 instanceof Array //=> false\n```\n\n# 第一个 typeof\n然后 instanceof\n\
    \n# 函数也是对象\n\n```javascript\nvar sum = function(n1, n2) {\n  return n1 + n2;\n\
    }\n\nvar a = {};\na.sum = sum;\n\na.sum(1, 2); // => 3\n```\n\n# ‘方法’只是赋值给对象属性的函数\n\
    \n```javascript\nvar a = { counter : 5 };\nvar b = { counter : 10 };\n\na.increment\
    \ = function(amount) {\n  this.counter += amount;\n};\n\na.increment(1)\na.counter;\
    \ // => 6\n```\n\n```javascript\nb.increment = a.increment;\nb.increment(1);\n\
    console.log(b.counter); // => 11\n```\n\n```javascript\nfunction (amount) {\n\
    \  this.counter += amount;\n}\n\na.increment(5); // => 10\n```\n\n```javascript\n\
    function (amount) {\n  this.counter += amount;\n}\n\nb.increment(5); // => 15\n\
    ```\n\n```javascript\nvar slideshow = {\n  init: function() {\n    this.start();\n\
    \  },\n  start: function() {\n  }\n}\n\nwindow.onload = slideshow.init;\n```\n\
    \n```javascript\nwindow.onload();\n```\n\n```javascript\nwindow.onload = function()\
    \ {\n  start();\n}\n```\n\n```javascript\na.increment.call(b, 1); // => 6\na.increment.apply(b,\
    \ [1]); // => 7\n```\n\n# arguments (参数)\n\n```javascript\n// 所有发送到函数的\n// 参数，无论有多少个\n\
    function sum() {\n  var total = 0;\n  for (var i = 0, l = arguments.length; i\
    \ < l; i++) {\n    total += arguments[i];\n  }\n  return total;\n}\n\nconsole.log(sum(2,\
    \ 5)); //=> 7\nconsole.log(sum(10, 20, 30)); //=> 60\n```\n\n```javascript\nvalidate('name');\n\
    validate('email', { min: 4, max: 10 });\n```\n\n```javascript\nfunction validate()\
    \ {\n  var options = {};\n  // 从 Array.prototype 窃取\n  var slice = Array.prototype.slice;\n\
    \n  if (typeof arguments === 'object') {\n    options = slice.call(arguments,\
    \ 1);\n  }\n  // 此处代码\n```\n\n# 函数可以返回其他函数\n\n```javascript\nfunction add(a, b)\
    \ { return a + b }\n\nfunction adder(a) {\n  return function(b) {\n    return\
    \ add(a, b);\n  }\n}\n\nadd(5, 5); //=> 10\n\nvar add5 = adder(5);\nadd5(10);\
    \ //=> 15\n```\n\n```javascript\nfunction add(a, b) { return a + b }\n\nfunction\
    \ adder(a) {\n  return function(b) {\n    return add(a, b);\n  }\n}\n\nadd(5,\
    \ 5); //=> 10\n\nvar add5 = adder(5);\nadd5(10); //=> 15\n```\n\n# 闭包 (Closure)\n\
    \n# 回到 Wikipedia...\n\n当一个函数定义在另一个函数内部，且内部函数引用了外部函数的局部变量时，发生了闭包。\n\n```javascript\n\
    function attachHelpEvents() {\n  var windowRef = null;\n  var openLink = document.getElementById('open_help');\n\
    \  var closeLink = document.getElementById('close_help');\n\n  var openWindow\
    \ = function() {\n    windowRef = this.href;\n  };\n\n  var onClose = function()\
    \ {\n    if (windowRef) windowRef.close();\n  };\n\n  openLink.onclick = openWindow;\n\
    \  closeLink.onclick = onClose;\n}\n\nwindow.onload = attachHelpEvents;\n```\n\
    \n```javascript\nfunction attachHelpEvents() {\n  var windowRef = null;\n  var\
    \ openLink = document.getElementById('open_help');\n  var closeLink = document.getElementById('close_help');\n\
    \n  var openWindow = function() {\n    windowRef = this.href;\n  };\n\n  var onClose\
    \ = function() {\n    if (windowRef) windowRef.close();\n  };\n\n  openLink.onclick\
    \ = openWindow;\n  closeLink.onclick = onClose;\n}\n\nwindow.onload = attachHelpEvents;\n\
    ```\n\n# 这为什么很有用？\n\n```javascript\nvar slideshow = {\n  init: function() {\n\
    \    this.start();\n  },\n  start: function() {\n  }\n}\n\nwindow.onload = slideshow.init;\n\
    ```\n\n```javascript\nfunction bind(func, context) {\n  return function() {\n\
    \    return func.apply(context, arguments);\n  }\n}\n```\n\n```javascript\nvar\
    \ slideshow = {\n  init: function() {\n    this.start();\n  },\n  start: function()\
    \ {\n  }\n}\n\nwindow.onload = bind(slideshow.init, slideshow);\n```\n\n# 函数可以用来创建对象\n\
    \n```javascript\nfunction Coord(x, y) {\n  this.x = x;\n  this.y = y;\n}\nvar\
    \ home = new Coord(132, 223);\nconsole.log(home.x); //=> 132\nconsole.log(home.y);\
    \ //=> 223\nconsole.log(home.constructor); //=> Coord\n```\n\n# 构造函数只是函数\n\n#\
    \ 魔法在于 new 运算符\n\n```javascript\nvar london = new Coord(32, 13);\n```\n\n```javascript\n\
    var london = {};\nCoord.call(london, 32, 13);\n```\n\n```javascript\nvar london\
    \ = {};\n\nCoord.call(london, 32, 13);\nlondon.__proto__ = Coord.prototype;\n\
    ```\n\n# 继承 (inheritance)\n\n```javascript\nCoord.prototype = {\n  toString: function()\
    \ {\n    return [this.x, this.y].join(', ');\n  }\n};\n\nhome.toString(); // 132,\
    \ 223\n```\n\n```javascript\nhome.toString? // 没有...继续寻找\nhome.__proto__.toString?\
    \ // 找到了！\n```\n\n```javascript\nhome.__proto__ == Coord\n```\n\n```javascript\n\
    function Marker(name, x, y) {\n  this.name = name;\n  this.x = x;\n  this.y =\
    \ y;\n}\n\nMarker.prototype = new Coord;\n\nvar pub = new Marker('Party!', 12,\
    \ 54);\npub.toString(); //=> 12, 54\n```\n\n```javascript\npub.toString // 没有...\n\
    pub.__proto__.toString // 没有...\npub.__proto__.__proto__.toString // 找到了！\n```\n\
    \n```javascript\npub.__proto__ == Marker.prototype\npub.__proto__.__proto__ ==\
    \ Coord\n```\n\n# 重点在于：\n它们都只是函数、\n对象和属性\n\n# 我们可以对它们进行任何操作。\n\n# 所以用这些东西能做什么？\n\
    \n# 修复糟糕实现中的漏洞\n\n```javascript\n// 为 IE 5 修复 Array#push\nif (!Array.prototype.push)\
    \ {\n  Array.prototype.push = function(item) {\n    return this[this.length] =\
    \ item;\n  }\n}\n```\n\n```javascript\n// 为旧浏览器添加 1.6 风格的 Array#forEach\nif (!Array.prototype.forEach)\
    \ {\n  Array.prototype.forEach = function(func, scope) {\n    scope = scope ||\
    \ this;\n    for (var i = 0, l = this.length; i < l; i++) {\n      func.call(scope,\
    \ this[i], i, this);\n    }\n  }\n}\n```\n"
