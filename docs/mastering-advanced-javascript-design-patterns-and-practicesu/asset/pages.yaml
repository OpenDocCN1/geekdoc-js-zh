    **1.2 ​Object Creation with Constructors and** `**new**` **Keyword**


    The constructor pattern in JavaScript is central to creating object instances
    that inherit from


    a prototype. A constructor is typically a function that, when invoked with the
    `new` keyword,


    creates and returns a new object whose internal `[[Prototype]]` links to the constructor’s


    `prototype` property. This section explores the inner workings and advanced techniques


    associated with constructor-based instantiation, discussing the `new` operator’s
    semantics,


    common pitfalls, and opportunities for optimization.


    The `new` operator executes a sequence of operations: it creates a new empty object,
    sets the


    object’s internal prototype to the `prototype` property of the constructor, binds
    `this` within


    the constructor to the newly created object, executes the constructor’s body,
    and finally


    returns the object if no explicit object is returned. This mechanism is captured
    conceptually


    by the following pseudo-code:


    `function NewOperator(Constructor, ...args) { `


    `  let instance = Object.create(Constructor.prototype); `


    `  let result = Constructor.apply(instance, args); `


    `  return typeof result === "object" && result !== null ? result : instance; `


    `}`


    Understanding this sequence is crucial for advanced JavaScript developers because
    it


    elucidates why certain constructor modifications—such as returning an explicit
    object—may


    override the natural return value. When a constructor returns an object, that
    object


    supplants the default instance created by the `new` operator. Being aware of this
    behavior


    allows developers to implement factory patterns while maintaining the opportunity
    to


    leverage shared behavior via prototypes.


