    Another effective CSRF mitigation strategy is the usage of `SameSite` cookies.
    By setting the


    `SameSite` attribute on cookies, the browser is instructed to withhold the cookie
    in cross-site


    requests, thereby preventing CSRF attacks that rely on the automatic transmission
    of


    credentials. When configured correctly, the browser enforces that only first-party
    requests


