    \ erratically.\n\nAn efficient event emitter leverages JavaScript structures for\
    \ keeping track of event types and their associated listener arrays. It is advisable\
    \ for advanced systems to account for the dynamic nature of listener registration.\
    \ Changes applied during a notification cycle can affect the expected behavior;\
    \ therefore, cloning internal data structures before initiating a dispatch guarantees\
    \ a consistent iteration. The sample implementation below demonstrates a basic\
    \ but advanced pattern for an event emitter.\n\n```\nclass EventEmitter {\n  constructor()\
    \ {\n    // Map events to an array of listener objects.\n    this.events = new\
    \ Map();\n  }\n\n  on(event, listener, context = null) {\n    if (typeof listener\
