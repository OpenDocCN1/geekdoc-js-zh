    \ = {\nget(target, prop, receiver) {\n  if (isDebugMode) {\n    console.debug('GET\
    \ accessed for ${String(prop)}');\n  }\n  return Reflect.get(target, receiver);\n\
    },\nset(target, prop, value, receiver) {\n  if (isDebugMode) {\n    console.debug('SET\
