    \n```\nimport React, { useReducer } from 'react';\n```\n\n```\nconst initialState\
    \ = {\ncount: 0,\nitems: []\n};\n```\n\n```\nfunction reducer(state, action) {\n\
    \  switch (action.type) {\n    case 'INCREMENT':\n      return { ...state, count:\
    \ state.count + 1 };\n    case 'DECREMENT':\n      return { ...state, count: state.count\
