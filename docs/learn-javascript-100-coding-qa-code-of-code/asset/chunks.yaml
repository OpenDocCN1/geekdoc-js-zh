    class Employee extends Person {\n\n constructor(name, age, occupation, company)\
    \  {\n\n    super(name, age, occupation);\n\n    this.company = company;\n\n  }\n\
    \n work()  {\n\n    console.log(\"I am working at \"  +  this.company +  \".\"\
    );\n\n  }\n\n}\n\nUnderstanding the Document Object Model (DOM)\n\nThe Document\
    \ Object Model (DOM) is a programming interface for HTML and XML documents. It\
    \ represents the structure of a document as a tree of objects, with each object\
    \ representing an element in the document.\n\nThe DOM allows you to manipulate\
    \ the content and structure of a document using JavaScript. This enables you to\
    \ create dynamic and interactive web pages that can respond to user input and\
    \ changing data.\n\nIn this article, we’ll go over the basics of the DOM and how\
    \ to use it in JavaScript.\n\nThe DOM Tree\n\nThe DOM represents a document as\
    \ a tree of objects, with the document itself at the root of the tree. Each object\
    \ in the tree represents an element in the document, such as a paragraph, a link,\
    \ or a form.\n\nThe tree structure of the DOM is called the “DOM tree”. The DOM\
    \ tree consists of “nodes”, with each node representing an object in the tree.\
    \ There are several types of nodes in the DOM, including element nodes, attribute\
    \ nodes, and text nodes.\n\nHere’s an example of a simple HTML document and its\
    \ corresponding DOM tree:\n\n<html>\n\n  <head>\n\n    <title>My Page</title>\n\
    \n  </head>\n\n  <body>\n\n    <h1>Welcome to My Page</h1>\n\n    <p>This is a\
