    控制结构是 JavaScript 编程中不可或缺的一部分。通过理解如何使用 `if/else` 语句、`for` 循环和 `while` 循环，你将具备使用\
    \ JavaScript 构建复杂交互 Web 应用所需的技能。\n\n## 练习\n\n为了回顾这些概念，我们将通过一系列练习，旨在测试你的理解能力并应用所学到的知识。\n\
    \n- 使用 `if/else` 语句检查一个数字是偶数还是奇数。\n- 使用 `for` 循环在控制台打印数字 1 到 10。\n- 使用 `while`\
    \ 循环在控制台打印数字 1 到 10。\n- 使用 `for` 循环在控制台打印数字 10 到 1。\n- 使用 `while` 循环在控制台打印数字 10\
    \ 到 1。\n\n## 解决方案\n\n### 使用 `if/else` 语句检查一个数字是偶数还是奇数。\n\n```javascript\nvar num\
    \ = 10;\n\nif (num % 2 == 0) {\n  console.log(\"The number is even.\");\n} else\
    \ {\n  console.log(\"The number is odd.\");\n}\n```\n\n### 使用 `for` 循环在控制台打印数字\
    \ 1 到 10。\n\n```javascript\nfor (var i = 1; i <= 10; i++) {\n  console.log(i);\n\
    }\n```\n\n### 使用 `while` 循环在控制台打印数字 1 到 10。\n\n```javascript\nvar i = 1;\nwhile\
    \ (i <= 10) {\n  console.log(i);\n  i++;\n}\n```\n\n### 使用 `for` 循环在控制台打印数字 10\
    \ 到 1。\n\n```javascript\nfor (var i = 10; i > 0; i--) {\n  console.log(i);\n}\n\
    ```\n\n### 使用 `while` 循环在控制台打印数字 10 到 1。\n\n```javascript\nvar i = 10;\nwhile\
    \ (i > 0) {\n  console.log(i);\n  i--;\n}\n```\n\n## 定义和调用函数\n\n在 JavaScript 中，函数是执行特定任务的块代码。函数是任何编程语言中必不可的一部分，用于将较大的程序分成更小、更易于管理的部分。\n\
    \n在本文，我们将介绍 JavaScript 中定义和调用函数的基础知识，以及如何在代码中使用它们。\n\n### 定义函数\n\n在 JavaScript\
    \ 中定义函数，你使用 `function` 关键字，后跟函数名和一组括号。然后将函数体放在大括号内。\n\n以下是定义函数的语法：\n\n```javascript\n\
    function functionName() {\n  // 要执行的代码\n}\n```\n\n这是一个定义一个向控制台打印消息的函数的示例：\n\n\
    ```javascript\nfunction sayHello() {\n  console.log(\"Hello, world!\");\n}\n```\n\
    \n你也可以定义带参数的函数，参数是在函数被调用时传递给它的值。参数放在括号内，并用逗号隔开。\n\n以下是定义带参数函数的示例：\n\n```javascript\n\
    function greet(name) {\n  console.log(\"Hello, \" + name + \"!\");\n}\n```\n\n\
    ### 调用函数\n\n在 JavaScript 中调用函数，你只需要使用函数名后跟一组括号。如果函数有参数，你在括号内将值传递给函数，并用逗号隔开。\n\n\
    以下是调用函数的示例：\n\n```javascript\nsayHello(); // 打印 \"Hello, world!\"\ngreet(\"John\"\
    ); // 打印 \"Hello, John!\"\n```\n\n### 返回值\n\n函数还可以向调用代码返回一个值。要做到这一点，你使用 `return`\
    \ 关键字，后跟要返回的值。\n\n这是一个返回值的函数示例：\n\n```javascript\nfunction add(x, y) {\n  return\
    \ x + y;\n}\n```\n\n然后你可以将函数的返回值赋值给变量：\n\n```javascript\nvar result = add(2, 3);\
    \ // result 为 5\n```\n\n## 结论 \n\n函数是 JavaScript 编程中强大且实用的工具。通过理解如何定义和调用函数，你将具备以更高效、有效的方式组织和重用代码所需的技能。\n\
    \n## 练习\n\n为了回顾这些概念，我们将通过一系列练习，旨在测试你的理解能力并应用所学到的知识。\n\n1. 定义一个接受两个数字作为参数并返回这两个数字之和的函数。\n\
    2. 使用参数 3 和 4 调用练习 1 中定义的函数，并将结果赋值给变量。\n3. 定义一个接受字符串作为参数并返回首字母大写的字符串的函数。\n4. 定义一个接受数组作为参数并返回数组中所有元素之和的函数。\n\
    5. 使用参数 `[1, 2, 3, 4, 5]` 调用上一个练习中定义的函数，并将结果赋值给变量。\n\n## 解决方案\n\n### 定义一个接受两个数字作为参数并返回这两个数字之和的函数。\n\
    \n```javascript\nfunction add(x, y) {\n  return x + y;\n}\n```\n\n### 使用参数 3 和\
    \ 4 调用练习 1 中定义的函数，并将结果赋值给变量。\n\n```javascript\nvar result = add(3, 4);\n```\n\n\
    ### 定义一个接受字符串作为参数并返回首字母大写的字符串的函数。\n\n```javascript\nfunction capitalize(str) {\n\
    \  return str.charAt(0).toUpperCase() + str.slice(1);\n}\n```\n\n### 定义一个接受数组作为参数并返回数组中所有元素之和的函数。\n\
    \n```javascript\nfunction sumArray(arr) {\n  let total = 0;\n  for (let i = 0;\
    \ i < arr.length; i++) {\n    total += arr[i];\n  }\n  return total;\n}\n```\n\
    \n### 使用参数 `[1, 2, 3, 4, 5]` 调用上一个练习中定义的函数，并将结果赋值给变量。\n\n```javascript\nvar result\
    \ = sumArray([1, 2, 3, 4, 5]);\n```\n"
- fmt: "\nObject-oriented programming (OOP) is a programming paradigm that is based\
    \ on the idea of “objects”, which can contain data and functionality. OOP is designed\
    \ to make it easier to create and maintain complex software systems.\n\nIn JavaScript,\
    \ you can use OOP by defining “classes” which serve as templates for creating\
    \ “instances” of objects. A class is defined using the `class` keyword followed\
    \ by the class name and a set of curly braces containing the class properties\
    \ and methods.\n\nHere’s an example of how to define a class in JavaScript:\n\n\
    ```javascript\nclass Person {\n  constructor(name, age, occupation) {\n    this.name\
    \ = name;\n    this.age = age;\n    this.occupation = occupation;\n  }\n  greet()\
    \ {\n    console.log(\"Hello, my name is \" + this.name + \" and I am a \" + this.occupation\
    \ + \".\");\n  }\n}\n```\n\nTo create an instance of an object, you use the `new`\
    \ operator followed by the class name and a set of parentheses containing the\
    \ constructor arguments.\n\nHere’s an example of how to create an instance of\
    \ an object:\n\n```javascript\nvar john = new Person(\"John\", 30, \"developer\"\
    );\n```\n\nYou can then access the object’s properties and methods using the dot\
    \ notation:\n\n```javascript\nconsole.log(john.name);  // logs \"John\"\nconsole.log(john.age);\
    \  // logs 30\nconsole.log(john.occupation);  // logs \"\njohn.greet();\n// logs\
    \ \"Hello, my name is John and I am a developer.\"\n```\n\n## Inheritance\n\n\
    In OOP, you can use inheritance to create a “child” class that derives properties\
    \ and methods from a “parent” class. This allows you to reuse code and avoid repeating\
    \ yourself.\n\nIn JavaScript, you can use inheritance by using the `extends` keyword\
    \ to create a child class that extends a parent class. The child class can then\
    \ override or add additional properties and methods as needed.\n\nHere’s an example\
    \ of how to use inheritance in JavaScript:\n\n```javascript\nclass Employee extends\
    \ Person {\n  constructor(name, age, occupation, company) {\n    super(name, age,\
    \ occupation);\n    this.company = company;\n  }\n  work() {\n    console.log(\"\
    I am working at \" + this.company + \".\");\n  }\n}\n```\n\n```javascript\nvar\
    \ jane = new Employee(\"Jane\", 32, \"developer\", \"Acme Inc.\");\nconsole.log(jane.name);\
    \  // logs \"Jane\"\nconsole.log(jane.age);  // logs 32\nconsole.log(jane.occupation);\
    \  // logs \"developer\"\nconsole.log(jane.company);  // logs \"Acme Inc.\"\n\
    jane.greet();  // logs \"Hello, my name is Jane and I am a developer.\"\njane.work();\
    \  // logs \"I am working at Acme Inc.\"\n```\n\nIn this example, the `Employee`\
    \ class extends the `Person` class and adds a new company property and a new work\
    \ method. The `Employee` class also overrides the constructor method to include\
    \ the company argument and calls the `super` function to access the parent class’s\
    \ constructor method.\n\n## Conclusion\n\nObjects and object-oriented programming\
    \ are powerful tools in JavaScript. By understanding how to create and manipulate\
    \ objects, as well as how to use inheritance, you’ll have the skills you need\
    \ to create complex and scalable software systems in JavaScript.\n\n## Exercises\n\
    \nTo review these concepts, we will go through a series of exercises designed\
    \ to test your understanding and apply what you have learned.\n\n1. Define an\
    \ object that represents a book, including the title, author, and number of pages.\n\
    2. Modify the object defined in exercise 1 to include a `read` property that is\
    \ a boolean indicating whether or not the book has been read.\n3. Define a class\
    \ that represents a person, including the person’s name, age, and occupation.\
    \ Add a method to the class that logs a greeting to the console.\n4. Create an\
    \ instance of the class defined in exercise 3 and call the `greet` method.\n5.\
    \ Define a class that represents an employee, which extends the person class defined\
    \ in exercise 3. Add a method to the employee class that logs the employee’s company.\n\
    \n## Solutions\n\n1. Define an object that represents a book, including the title,\
    \ author, and number of pages.\n\n```javascript\nvar book = {\n  title: \"The\
    \ Great Gatsby\",\n  author: \"F. Scott Fitzgerald\",\n  pages: 180\n};\n```\n\
    \n2. Modify the object defined in exercise 1 to include a `read` property that\
    \ is a boolean indicating whether or not the book has been read.\n\n```javascript\n\
    book.read = false;\n```\n\n3. Define a class that represents a person, including\
    \ the person’s name, age, and occupation. Add a method to the class that logs\
    \ a greeting to the console.\n\n```javascript\nclass Person {\n  constructor(name,\
    \ age, occupation) {\n    this.name = name;\n    this.age = age;\n    this.occupation\
    \ = occupation;\n  }\n  greet() {\n    console.log(\"Hello, my name is \" + this.name\
    \ + \" and I am a \" + this.occupation + \".\");\n  }\n}\n```\n\n4. Create an\
    \ instance of the class defined in exercise 3 and call the `greet` method.\n\n\
    ```javascript\nvar john = new Person(\"John\", 30, \"developer\");\njohn.greet();\n\
    ```\n\n5. Define a class that represents an employee, which extends the person\
    \ class defined in exercise 3. Add a method to the employee class that logs the\
    \ employee’s company.\n\n```javascript\nclass Employee extends Person {\n  constructor(name,\
    \ age, occupation, company) {\n    super(name, age, occupation);\n    this.company\
    \ = company;\n  }\n  work() {\n    console.log(\"I am working at \" + this.company\
    \ + \".\");\n  }\n}\n```\n"
