  trans: "\n\n```javascript\nconsole.error(error);\n});\n```\n\n`XMLHttpRequest` 对象和\
    \ `fetch` 函数都允许你通过设置请求的 `method` 属性来其他类型的 HTTP 请求，例如 POST、PUT、DELETE 等。\n\n##\
    \ 处理 JSON 数据\n\n许多 API 以 JSON（JavaScript 对象表示）格式返回数据，这是一种轻量级的数据交换格式，易于人类读写，也易于机器解析和生成。\n\
    \n在 JavaScript 中解析 JSON 数据，你可以使用 `JSON.parse` 函数。以下是一个使用 `JSON.parse` 函数解析 JSON\
    \ 数据的示例：\n\n```javascript\nvar jsonData = '{\"name\": \"John\", \"age\": 30, \"\
    city\": \"New York\"}';\nvar data = JSON.parse(jsonData);\nconsole.log(data.name);\
    \  // \"John\"\nconsole.log(data.age);  // 30\nconsole.log(data.city);  // \"\
    New York\"\n```\n\n要将 JavaScript 对象或数组转换为 JSON 字符串，你可以使用 `JSON.stringify` 函数。以下是一个使用\
    \ `JSON.stringify` 函数将 JavaScript 对象转换为 JSON 字符串的示例：\n\n```javascript\nvar data\
    \ = {name: \"John\", age: 30, city: \"New York\"};\nvar jsonData = JSON.stringify(data);\n\
    console.log(jsonData);  // '{\"name\":\"John\",\"age\":30,\"city\":\"New York\"\
    }'\n```\n\n## 处理 AJAX 请求\n\nAJAX（异步 JavaScript 和 XML）是一个术语，用于描述在 JavaScript 中发送异步\
    \ HTTP 请求并接收响应的过程，而无需刷新页面。AJAX 允许你通过向 API 发送请求并使用响应更新 DOM（文档对象模型）来动态更新网页的部分。\n\
    \n在 JavaScript 中发送 AJAX 请求，你可以使用我们之前讨论过的 `XMLHttpRequest` 对象或 `fetch` 函数。以下是一个使用\
    \ `XMLHttpRequest` 对象发送 AJAX 请求的示例：\n\n```javascript\nfunction makeRequest(url)\
    \ {\n  var xhr = new XMLHttpRequest();\n  xhr.open(\"GET\", url);\n  xhr.onload\
    \ = function() {\n    if (xhr.status === 200) {\n      var data = JSON.parse(xhr.responseText);\n\
    \      // 使用响应数据更新 DOM\n    } else {\n      console.error(xhr.statusText);\n \
    \   }\n  };\n  xhr.send();\n}\n\n// 当点击按钮时发送 AJAX 请求\nvar button = document.getElementById(\"\
    button\");\nbutton.addEventListener(\"click\", function() {\n  makeRequest(\"\
    http://example.com/api/data\");\n});\n```\n\n以下是一个使用 `fetch` 函数发送 AJAX 请求的示例：\n\
    \n```javascript\nfunction makeRequest(url) {\n  fetch(url)\n    .then(function(response)\
    \ {\n      return response.json();\n    })\n    .then(function(data) {\n     \
    \ // 使用响应数据更新 DOM\n    })\n    .catch(function(error) {\n      console.error(error);\n\
    \    });\n}\n\n// 当点击按钮时发送 AJAX 请求\nvar button = document.getElementById(\"button\"\
    );\nbutton.addEventListener(\"click\", function() {\n  makeRequest(\"http://example.com/api/data\"\
    );\n});\n```\n\n## 结论\n\n在“学习 JavaScript”课程的这一章节中，我们学习了 API 以及如何在 JavaScript 中发送\
    \ AJAX 请求。我们还还学习了如何处理 JSON 数据，以及如何使用 `XMLHttpRequest` 对象和 `fetch` 函数来发送 HTTP 请求并异步接收响应。\n\
    \n通过理解如何处理 API 和发送 AJAX 请求，你可以构建动态、交互式的 Web 应用，这些程序可以访问并操作来自其他网站和服务的数据。\n\n##\
    \ 练习题\n\n为了复习这些概念，我们将通过一系列练习，旨在测试你的理解并应用你所学的内容。\n\n1. 向 [GitHub API](https://developer.github.com/v3/)\
    \ 发送 AJAX 请求，以获取指定用户的仓库列表，并在页面上的列表显示显示仓库名称。\n2. 向 [OpenWeatherMap API](https://openweathermap.org/api)\
    \ 发送 AJAX 请求以获取指定城市的当前天气，并在页面上显示温度和天气描述。\n3. 向 [Wikipedia API](https://www.mediawiki.org/wiki/API:Main_page)\
    \ 发送 AJAX 请求以根据给定关键词搜索文章，并在页面上的列表中显示文章标题和描述。\n4. 向 [NASA 每日天文图片 API](https://api.nasa.gov/api.html#apod)\
    \ 发送 AJAX 请求以获取当前的“每日天文图片”，并在页面上显示图像和描述。\n5. 向 [USGS 地震 API](https://earthquake.usgs.gov/fdsws/event/1/)\
    \ 发送 AJAX 请求以获取过去一周的地震列表，并在 [Google Maps API](https://developers.google.com/maps/)\
    \ 的地图上显示震级和位置。\n\n## 答案\n\n### 向 [GitHub API](https://developer.github.com/v3/)\
    \ 发送 AJAX 请求，以获取指定用户的仓库列表，并在页面上的列表显示仓库名称。\n\n```javascript\nfunction getRepos(username)\
    \ {\n  fetch(`https://api.github.com/users/${username}/repos`)\n    .then(function(response)\
    \ {\n      return response.json();\n    })\n    .then(function(repos) {\n    \
    \  var list = document.getElementById(\"repo-list\");\n      repos.forEach(function(repo)\
    \ {\n        var li = document.createElement(\"li\");\n        li.textContent\
    \ = repo.name;\n        list.appendChild(li);\n      });\n    })\n    .catch(function(error)\
    \ {\n      console.error(error);\n    });\n}\n\nvar button = document.getElementById(\"\
    button\");\nbutton.addEventListener(\"click\", function() {\n  var username =\
    \ document.getElementById(\"username\").value;\n  getRepos(username);\n});\n```\n\
    \n### 向 [OpenWeatherMap API](https://openweathermap.org/api) 发送 AJAX 请求以获取指定城市的当前天气，并在页面上显示温度和天气描述。\n\
    \n```javascript\nfunction getWeather(city) {\n  fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=YOUR_API_KEY`)\n\
