  trans: "\n\n# 使用 API 和 AJAX 请求\n\n在“学习 JavaScript”课程的这一章节中，我们将探索如何使用 API（应用程序编程接口）以及如何在\
    \ JavaScript 中发送 AJAX（异步 JavaScript 和 XML）请求。API 允许你访问其他服务的数据和功能，而 AJAX 请求则可以在无需刷新页面的情况下完成操作。\n\
    \n## 什么是 API？\n\nAPI 是一套定义两个系统之间如何通信的规则。API 允许你访问其他服务的数据和功能。网络上有上有许多可用的 API，它们可以用于访问广泛的数据和功能。使用\
    \ API 可以实现的一些示例包括：\n\n* 从数据库或服务中检索数据\n* 在数据库或服务中添加或更新数据\n* 执行特定操作（例如发送电子邮件或发布到社交媒体）\n\
    \nAPI 通常要求你使用 API 密钥或其他形式的身份验证对请求进行身份验证。API 也会设置速率限制（rate limits），这限制了你在特定时间内可以发送请求的数量。\n\
    \n## 使用 JavaScript 发送 API 请求\n\n在 JavaScript 中发送 API 请求，你可以使用 `XMLHttpRequest`\
    \ 对象或 `fetch` 函数。\n\n### 使用 XMLHttpRequest\n\n`XMLHttpRequest` 对象是一个自 Web 早期一直存在的遗留\
    \ API。它允许你异步发送 HTTP 请求并接收响应，而无需刷新页面。以下是一个使用 `XMLHttpRequest` 对象向 API 发送 GET 请求的示例：\n\
    \n```javascript\nfunction makeRequest(url) {\n  var xhr = new XMLHttpRequest();\n\
    \  xhr.open(\"GET\", url);\n  xhr.onload = function() {\n    if (xhr.status ===\
    \ 200) {\n      console.log(xhr.responseText);\n    } else {\n      console.error(xhr.statusText);\n\
    \    }\n  };\n  xhr.send();\n}\n\nmakeRequest(\"http://example.com/api/data\"\
    );\n```\n\n### 使用 fetch\n\n`fetch` 函数是随着 fetch API 引入 JavaScript 的较新 API。它允许你异步发送\
    \ HTTP 请求并接收响应，并返回一个解析为 `Response` 对象的承诺（promise）。以下是一个使用 `fetch` 函数向 API 发送 GET\
    \ 请求的示例：\n\n```javascript\nfetch(\"http://example.com/api/data\")\n  .then(function(response)\
    \ {\n    return response.text();\n  })\n  .then(function(data) {\n    console.log(data);\n\
    \  })\n  .catch(function(error) {\n```\n\n"
- fmt: "\n```javascript\nconsole.error(error);\n});\n```\n\nBoth the `XMLHttpRequest`\
    \ object and the `fetch` function allow you to make other types of HTTP requests,\
    \ such as POST, PUT, DELETE, etc., by setting the `method` property of the request.\n\
    \n## Working with JSON data\n\nMany APIs return data in JSON (JavaScript Object\
    \ Notation) format, which is a lightweight data interchange format that is easy\
    \ for humans to read and write, and easy for machines to parse and generate.\n\
    \nTo parse JSON data in JavaScript, you can use the `JSON.parse` function. Here’s\
    \ an example of how to parse JSON data using the `JSON.parse` function:\n\n```javascript\n\
    var jsonData = '{\"name\": \"John\", \"age\": 30, \"city\": \"New York\"}';\n\
    var data = JSON.parse(jsonData);\nconsole.log(data.name);  // \"John\"\nconsole.log(data.age);\
    \  // 30\nconsole.log(data.city);  // \"New York\"\n```\n\nTo convert a JavaScript\
    \ object or array into a JSON string, you can use the `JSON.stringify` function.\
    \ Here’s an example of how to convert a JavaScript object into a JSON string using\
    \ the `JSON.stringify` function:\n\n```javascript\nvar data = {name: \"John\"\
    , age: 30, city: \"New York\"};\nvar jsonData = JSON.stringify(data);\nconsole.log(jsonData);\
    \  // '{\"name\":\"John\",\"age\":30,\"city\":\"New York\"}'\n```\n\n## Working\
    \ with AJAX requests\n\nAJAX (Asynchronous JavaScript and XML) is a term used\
    \ to describe the process of making asynchronous HTTP requests and receiving responses\
    \ in JavaScript, without the need to refresh the page. AJAX allows you to update\
    \ parts of a webpage dynamically, by making requests to an API and updating the\
    \ DOM (Document Object Model) with the response.\n\nTo make an AJAX request in\
    \ JavaScript, you can use the `XMLHttpRequest` object or the `fetch` function,\
    \ as we discussed earlier. Here’s an example of how to make an AJAX request using\
    \ the `XMLHttpRequest` object:\n\n```javascript\nfunction makeRequest(url) {\n\
    \  var xhr = new XMLHttpRequest();\n  xhr.open(\"GET\", url);\n  xhr.onload =\
    \ function() {\n    if (xhr.status === 200) {\n      var data = JSON.parse(xhr.responseText);\n\
    \      // Update the DOM with the response data\n    } else {\n      console.error(xhr.statusText);\n\
    \    }\n  };\n  xhr.send();\n}\n\n// Make the AJAX request when the button is\
    \ clicked\nvar button = document.getElementById(\"button\");\nbutton.addEventListener(\"\
    click\", function() {\n  makeRequest(\"http://example.com/api/data\");\n});\n\
    ```\n\nHere’s an example of how to make an AJAX request using the `fetch` function:\n\
    \n```javascript\nfunction makeRequest(url) {\n  fetch(url)\n    .then(function(response)\
    \ {\n      return response.json();\n    })\n    .then(function(data) {\n     \
    \ // Update the DOM with the response data\n    })\n    .catch(function(error)\
    \ {\n      console.error(error);\n    });\n}\n\n// Make the AJAX request when\
    \ the button is clicked\nvar button = document.getElementById(\"button\");\nbutton.addEventListener(\"\
    click\", function() {\n  makeRequest(\"http://example.com/api/data\");\n});\n\
    ```\n\n## Conclusion\n\nIn this chapter of the “Learn JavaScript” course, we learned\
    \ about APIs and how to make AJAX requests in JavaScript. We also learned how\
    \ to work with JSON data, and how to use the `XMLHttpRequest` object and the `fetch`\
    \ function to make HTTP requests and receive responses asynchronously.\n\nBy understanding\
    \ how to work with APIs and make AJAX requests, you can build dynamic, interactive\
    \ web applications that can access and manipulate data from other websites and\
    \ services.\n\n## Exercises\n\nTo review these concepts, we will go through a\
    \ series of exercises designed to test your understanding and apply what you have\
    \ learned.\n\n1. Make an AJAX request to the [GitHub API](https://developer.github.com/v3/)\
    \ to retrieve the list of repositories for a given user, and display the repository\
    \ names in a list on the page.\n2. Make an AJAX request to the [OpenWeatherMap\
    \ API](https://openweathermap.org/api) to retrieve the current weather for a given\
    \ city, and display the temperature and weather description on the page.\n3. Make\
    \ an AJAX request to the [Wikipedia API](https://www.mediawiki.org/wiki/API:Main_page)\
    \ to search for articles with a given keyword, and display the article titles\
    \ and descriptions in a list on the page.\n4. Make an AJAX request to the [NASA\
    \ Astronomy Picture of the Day API](https://api.nasa.gov/api.html#apod) to retrieve\
    \ the current “Astronomy Picture of the Day,” and display the image and description\
    \ on the page.\n5. Make an AJAX request to the [USGS Earthquake API](https://earthquake.usgs.gov/fdsws/event/1/)\
    \ to retrieve a list of earthquakes in the past week, and display earthquake magnitudes\
    \ and locations on a map using the [Google Maps API](https://developers.google.com/maps/).\n\
    \n## Solutions\n\n### Make an AJAX request to the [GitHub API](https://developer.github.com/v3/)\
    \ to retrieve the list of repositories for a given user, and display the repository\
    \ names in a list on the page.\n\n```javascript\nfunction getRepos(username) {\n\
    \  fetch(`https://api.github.com/users/${username}/repos`)\n    .then(function(response)\
    \ {\n      return response.json();\n    })\n    .then(function(repos) {\n    \
    \  var list = document.getElementById(\"repo-list\");\n      repos.forEach(function(repo)\
    \ {\n        var li = document.createElement(\"li\");\n        li.textContent\
    \ = repo.name;\n        list.appendChild(li);\n      });\n    })\n    .catch(function(error)\
    \ {\n      console.error(error);\n    });\n}\n\nvar button = document.getElementById(\"\
    button\");\nbutton.addEventListener(\"click\", function() {\n  var username =\
    \ document.getElementById(\"username\").value;\n  getRepos(username);\n});\n```\n\
    \n### Make an AJAX request to the [OpenWeatherMap API](https://openweathermap.org/api)\
    \ to retrieve the current weather for a given city, and display the temperature\
    \ and weather description on the page.\n\n```javascript\nfunction getWeather(city)\
    \ {\n  fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=YOUR_API_KEY`)\n\
    \    .then(function(response) {\n      return response.json();\n    })\n    .then(function(data)\
    \ {\n      var temperature = data.main.temp;\n      var description = data.weather[0].description;\n\
    \      document.getElementById(\"temperature\").textContent = temperature;\n \
    \     document.getElementById(\"description\").textContent = description;\n  \
    \  })\n    .catch(function(error) {\n      console.error(error);\n    });\n}\n\
    \nvar button = document.getElementById(\"button\");\nbutton.addEventListener(\"\
    click\", function() {\n  var city = document.getElementById(\"city\").value;\n\
    \  getWeather(city);\n});\n```\n\n### Make an AJAX request to the [Wikipedia API](https://www.mediawiki.org/wiki/API:Main_page)\
    \ to search for articles with a given keyword, and display the article titles\
    \ and descriptions in a list on the page.\n\n```javascript\nfunction searchArticles(keyword)\
    \ {\n  fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&list=search&utf8=1&formatversion=2&srsearch=${keyword}`)\n\
    \    .then(function(response) {\n      return response.json();\n    })\n    .then(function(data)\
    \ {\n      var list = document.getElementById(\"article-list\");\n      data.query.search.forEach(function(article)\
    \ {\n        var li = document.createElement(\"li\");\n        var a = document.createElement(\"\
    a\");\n        a.textContent = article.title;\n        a.href = `https://en.wikipedia.org/wiki/${article.title}`;\n\
    \        li.appendChild(a);\n        li.appendChild(document.createTextNode(`\
    \ - ${article.snippet}`));\n        list.appendChild(li);\n      });\n    })\n\
    \    .catch(function(error) {\n      console.error(error);\n    });\n}\n\nvar\
    \ button = document.getElementById(\"button\");\nbutton.addEventListener(\"click\"\
    , function() {\n  var keyword = document.getElementById(\"keyword\").value;\n\
    \  searchArticles(keyword);\n});\n```\n\n### Make an AJAX request to the [NASA\
    \ Astronomy Picture of the Day API](https://api.nasa.gov/api.html#apod) to retrieve\
    \ the current “Astronomy Picture of the Day,” and display the image and description\
    \ on the page.\n\n```javascript\nfunction getAPOD() {\n  var apiKey = \"YOUR_API_KEY\"\
    ;\n  fetch(`https://api.nasa.gov/planetary/apod?api_key=${apiKey}`)\n    .then(function(response)\
    \ {\n      return response.json();\n    });\n}\n```\n"
