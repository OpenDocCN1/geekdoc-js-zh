  trans: "\n\n除了数组之外，JavaScript 还有几种内置集合类型，包括 `Set`、`Map` 和 `WeakMap`。\n\n### Set\n\
    `Set` 是一个唯一值的集合，这意味着它不能包含重复的值。你可以使用 `Set` 构造函数来创建一个 `Set`。\n\n以下是如何创建一个 `Set`\
    \ 并向其添加项的示例：\n\n```javascript\nvar set = new Set();\nset.add(1);\nset.add(2);\n\
    set.add(3);\n```\n\n你可以使用 `size` 属性来获取 `Set` 中项的数量，并使用 `has` 方法来检查 `Set` 是否包含特定值。\n\
    \n以下是使用 `size` 属性和 `has` 方法的示例：\n\n```javascript\nconsole.log(set.size);  // 3\n\
    console.log(set.has(1));  // true\nconsole.log(set.has(4));  // false\n```\n\n\
    ### Map\n`Map` 是一个键值对的集合，其中每个键都是唯一的。你可以使用 `Map` 构造函数来创建一个 `Map`。\n\n以下是如何创建一个\
    \ `Map` 并向其添加项的示例：\n\n```javascript\nvar map = new Map();\nmap.set(\"name\", \"\
    John\");\nmap.set(\"age\", 30);\n```\n\n你可以使用 `size` 属性来获取 `Map` 中项的数量，并使用 `get`\
    \ 方法来获取特定键的值。\n\n以下是使用 `size` 属性和 `get` 方法的示例：\n\n```javascript\nconsole.log(map.size);\
    \  // 2\nconsole.log(map.get(\"name\"));  // \"John\"\n```\n\n### WeakMap\n`WeakMap`\
    \ 与 `Map` 类似，但它只对其键持有弱引用，这意味着如果没有其他其他引用指向这些键，这些键就可以被垃圾回收。这使得 `WeakMaps` 适用于存储那些在不再需要时希望被自动清理的数据。\n\
    \n要创建一个 `WeakMap`，你需要使用 `WeakMap` 构造函数并传入一个键值对的迭代器。\n\n以下是如何创建一个 `WeakMap` 并向其添加项的示例：\n\
    \n```javascript\nvar weakMap = new WeakMap([\n  [{}, \"value1\"],\n  [{}, \"value2\"\
    ]\n]);\n```\n\n你可以使用 `get` 方法来检索 `WeakMap` 中特定键的值。\n\n以下是使用 `get` 方法从 `WeakMap`\
    \ 中检索值的示例：\n\n```javascript\nvar value = weakMap.get(key);  // \"value\"\n```\n\
    \n注意，`WeakMaps` 没有 `size` 属性或 `has` 方法，因此你无法获取 `WeakMap` 中项的数量，无法检查 `WeakMap`\
    \ 是否包含特定键。\n\n### 结论\n在本文，我们涵盖了 JavaScript 中不同类型的数组和集合，以及如何使用它们来存储和处理数据。通过理解如何操作数组和集合，你将拥有为你的\
    \ JavaScript 应用创建高效且有效的数据结构所需的技能。\n\n### 练习\n为了复习这些概念，我们将通过一系列练习题，旨在测试你的理解并应用所学的内容。\n\
    \n1. 创建一个数字数组，并使用循环将每个数字的平方打印到控制台。\n2. 创建一个字符串 `Set`，并使用 `forEach` 方法将每个字符串打印到控制台。\n\
    3. 创建一个对象数组，并使用 `forEach` 方法将每个对象的名称打印到控制台。\n4. 创建一个数字 `Set`，并使用 `size` 属性和 `has`\
    \ 方法检查该集合是否包含数字 5。\n5. 创建一个键值对的 `Map`，并使用 `get` 方法检索键 `\"key1\"` 的值。\n\n### 答案\n\
    创建一个数字数组，并使用循环将每个数字的平方打印到控制台。\n\n```javascript\nvar numbers = [1, 2, 3, 4, 5];\n\
    numbers.forEach(function(number) {\n  console.log(number * number);\n});\n```\n\
    \n创建一个字符串 `Set`，并使用 `forEach` 方法将每个字符串打印到控制台。\n\n```javascript\nvar set = new\
    \ Set([\"apple\", \"banana\", \"cherry\"]);\nset.forEach(function(item) {\n  console.log(item);\n\
    });\n```\n\n创建一个对象数组，并使用 `forEach` 方法将每个对象的名称打印到控制台。\n\n```javascript\nvar objects\
    \ = [\n  {name: \"John\"},\n  {name: \"Jane\"},\n  {name: \"Jim\"}\n];\nobjects.forEach(function(object)\
    \ {\n  console.log(object.name);\n});\n```\n\n创建一个数字 `Set`，并使用 `size` 属性和 `has`\
    \ 方法检查该集合是否包含数字 5。\n\n```javascript\nvar set = new Set([1, 2, 3, 4, 5]);\nconsole.log(set.size);\
    \  // 5\nconsole.log(set.has(5));  // true\n```\n\n创建一个键值对的 `Map`，并使用 `get` 方法检索键\
    \ `\"key1\"` 的值。\n\n```javascript\nvar map = new Map([\n  [\"key1\", \"value1\"\
    ],\n  [\"key2\", \"value2\"]\n]);\nconsole.log(map.get(\"key1\")); // \"value1\"\
    \n```\n\n### 使用 async/await 进行异步编程\n异步编程是一种程序可以并发而非顺序执行的范式。在 JavaScript 中，异步编程通常用于\
    \ I/O 操作，例如读取或写入文件，或者发起需要时间完成的。\n\n#### 回调 (Callbacks)\n异步编程最早的方法之一是使用回调。回调是作为参数传递的函数并在任务完成时被调用。以下是使用回调的示例：\n\
    \n```javascript\nfunction makeRequest(url, callback) {\n  var xhr = new XMLHttpRequest();\n\
    \  xhr.open(\"GET\", url);\n  xhr.onload = function() {\n    callback(xhr.responseText);\n\
    \  };\n  xhr.send();\n}\n\n// 使用回调\nmakeRequest(\"http://example.com\", function(response)\
    \ {\n  console.log(response);\n});\n```\n虽然回调函数有效处理异步任务，但如果你有多个相互依赖的异步任务，它们会导致“回调地狱”。\n\
    \n#### 承诺 (Promises)\n为了解决“回调地狱”问题，JavaScript 在 ECMAScript 2015 (ES6) 中引入了承诺。承诺是一个代表异步操作结果的对象。承诺处于三种状态之一：\n\
    - 待定 (Pending)：承诺尚未履行或拒绝。\n- 已履行 (Fulfilled)：承诺已履行，异步操作成功。\n- 已拒绝 (Rejected)：承诺已拒绝，异步操作失败。\n\
    \n承诺提供了一种更具声明性且易读的方式来处理异步操作。与其使用回调函数，你可以使用承诺的 `then` 和 `catch` 方法。以下是使用承诺发起 HTTP\
    \ 请求的示例：\n\n```javascript\nfunction makeRequest(url) {\n  return new Promise(function(resolve,\
    \ reject) {\n    var xhr = new XMLHttpRequest();\n    xhr.open(\"GET\", url);\n\
    \    xhr.onload = function() {\n      if (xhr.status === 200) {\n        resolve(xhr.responseText);\n\
    \      } else {\n        reject(xhr.statusText);\n      }\n    };\n    xhr.send();\n\
    \  });\n}\n\n// 使用 then 和 catch 方法\nmakeRequest(\"http://example.com\")\n .then(function(response)\
    \ {\n    console.log(response);\n  })\n  .catch(function(error) {\n    console.error(error);\n\
    \  });\n```\n\n#### async/await\n`async/await` 语法是 JavaScript 新引入的一个特性，它使得处理异步代码变得更加容易。`async`\
    \ 关键字用于声明异步函数，而 `await` 关键字用于等待承诺被履行或拒绝后再继续执行。\n\n"
- fmt: "\n# Working with APIs and AJAX Requests\n\nIn this chapter of the “Learn JavaScript”\
    \ course, we will be exploring how to work with APIs (Application Programming\
    \ Interfaces) and make AJAX (Asynchronous JavaScript and XML) requests in JavaScript.\
    \ APIs allow you to access data and functionality from other services, and AJAX\
    \ requests without the need to refresh the page.\n\n## What is an API?\n\nAn API\
    \ is a set of rules that defines how two systems can communicate with each other.\
    \ APIs allow you to access data and functionality from other services. There are\
    \ many APIs available on the web, and they can be used to access a wide range\
    \ of data and functionality. Some examples of what you can do with APIs include:\n\
    \n* Retrieve data from a database or service\n* Add or update data in a database\
    \ or service\n* Perform a specific action (e.g. sending an email or posting to\
    \ social media)\n\nAPIs often require you to authenticate your request using an\
    \ API key or other form of authentication. It is also common for APIs to have\
    \ rate limits, which limit the number of requests you can make within a certain\
    \ period.\n\n## Making API requests with JavaScript\n\nTo make API requests in\
    \ JavaScript, you can use the `XMLHttpRequest` object or the `fetch` function.\n\
    \n### Using XMLHttpRequest\n\nThe `XMLHttpRequest` object is a legacy API that\
    \ has been around since the early days of the web. It allows you to make HTTP\
    \ requests and receive responses asynchronously, without the need to refresh the\
    \ page. Here’s an example of how to use the `XMLHttpRequest` object to make a\
    \ GET request to an API:\n\n```javascript\nfunction makeRequest(url) {\n  var\
    \ xhr = new XMLHttpRequest();\n  xhr.open(\"GET\", url);\n  xhr.onload = function()\
    \ {\n    if (xhr.status === 200) {\n      console.log(xhr.responseText);\n   \
    \ } else {\n      console.error(xhr.statusText);\n    }\n  };\n  xhr.send();\n\
    }\n\nmakeRequest(\"http://example.com/api/data\");\n```\n\n### Using fetch\n\n\
    The `fetch` function is a newer API that was introduced in JavaScript with the\
    \ fetch API. It allows you to make HTTP requests and receive responses asynchronously,\
    \ and returns a promise that resolves to a `Response` object. Here’s an example\
    \ of how to use the `fetch` function to make a GET request to an API:\n\n```javascript\n\
    fetch(\"http://example.com/api/data\")\n  .then(function(response) {\n    return\
    \ response.text();\n  })\n  .then(function(data) {\n    console.log(data);\n \
    \ })\n  .catch(function(error) {\n```\n"
  raw: "Here’s an example of how to use the async/await syntax to make an HTTP request:\n\
    \nasync  function  makeRequest(url)  {\n\n // Make the request\n\n var xhr = \
    \ new XMLHttpRequest();\n\n  xhr.open(\"GET\", url);\n\n  xhr.onload  =  function()\
    \  {\n\n    if  (xhr.status ===  200)  {\n\n      return xhr.responseText;\n\n\
        }  else  {\n\n      throw  new Error(xhr.statusText);\n\n    }\n\n  };\n\n\
      xhr.send();\n\n}\n\n// Use the await keyword\n\ntry  {\n\n var response =  await\
    \  makeRequest(\"http://example.com\");\n\n  console.log(response);\n\n}  catch\
    \  (error)  {\n\n  console.error(error);\n\n}\n\nUsing the async/await syntax\
    \ makes asynchronous code feel more like synchronous code, which can make it easier\
    \ to read and understand.\n\nConclusion\n\nIn this article, we’ve covered the\
    \ basics of asynchronous programming in JavaScript, and how to use promises and\
    \ the async/await syntax to make it easier to work with asynchronous code. By\
    \ understanding how to work with asynchronous programming, you’ll have the skills\
    \ you need to create efficient and effective JavaScript applications that can\
    \ handle long-running tasks without blocking the main thread of execution.\n\n\
