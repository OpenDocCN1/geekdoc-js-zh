  trans: "\n\n```css\n{\n  display: flex;\n  align-items: center;\n  padding: 8px;\n\
    \  border-radius: 4px;\n  margin-bottom: 8px;\n  background-color: #f1f1f1;\n\
    }\n\n#todo-list li.completed {\n  background-color: #ccc;\n  text-decoration:\
    \ line-through;\n}\n\n#todo-list li .task-title {\n  flex-grow: 1;\n  font-size:\
    \ 16px;\n}\n\n#todo-list li .delete-button {\n  margin-left: 10px;\n  font-size:\
    \ 16px;\n  color: #ff6b6b;\n  cursor: pointer;\n}\n```\n\n最后，我们将编写 JavaScript\
    \ 来为应用添加交互性。我们将使用 `addEventListener` 方法为表单和删除按钮绑定事件监听器，并使用 DOM 操作方法来在 HTML 中添加、删除和修改元素。\n\
    \n```javascript\n// 获取表单和列表元素的引用\nconst form = document.querySelector(\"#add-task-form\"\
    );\nconst taskList = document.querySelector(\"#todo-list ul\");\n\n// 为表单添加提交事件监听器\n\
    form.addEventListener(\"submit\", e => {\n  // 防止表单默认提交\n  e.preventDefault();\n\
    \  // 从输入元素中获取任务标题\n  const taskTitle = document.querySelector(\"#task-title\"\
    ).value;\n  // 创建一个新的列表项元素\n  const taskItem = document.createElement(\"li\");\n\
    \  // 如果任务已完成，则添加 \"completed\" 类\n  taskItem.classList.add(\"completed\");\n\
    \  // 将任务项的 innerHTML 设置为任务标题\n  taskItem.innerHTML = `\n    <span class=\"task-title\"\
    >${taskTitle}</span>\n    <button class=\"delete-button\">Delete</button>\n  `;\n\
    \  // 将任务项附加到任务列表\n  taskList.appendChild(taskItem);\n  // 清空任务标题输入\n  document.querySelector(\"\
    #task-title\").value = \"\";\n});\n\n// 为任务列表添加点击事件监听器\ntaskList.addEventListener(\"\
    click\", e => {\n  // 获取被点击的目标元素\n  const target = e.target;\n  // 如果目标是删除按钮，则删除任务\n\
    \  if (target.classList.contains(\"delete-button\")) {\n    target.parentElement.remove();\n\
    \  }\n  // 如果目标是任务标题，切换 completed 类\n  if (target.classList.contains(\"task-title\"\
    )) {\n    target.parentElement.classList.toggle(\"completed\");\n  }\n});\n```\n\
    \n有了这些 HTML、CSS 和 JavaScript 代码，我们现在有了一个功能完备的待事项列表应用，它允许用户添加、删除并标记任务为已完成。\n\n\
    # 使用库和框架 (jQuery, React, 等)\n\n当你继续使用 JavaScript 开发 Web 应用时，你可能会发现你需要使用库和框架来帮助简化你的开发流程，并为你的应用添加高级功能。在本章中，我们将探索一些最流行的\
    \ JavaScript 库和框架，包括 jQuery、React 和 Angular。\n\n## 什么是库和框架？\n\n库（Library）是预写代码的集合，为特定目的提供实用函数和其他辅助工具。框架（Framework）是一个更全面的结构，为构建应用程序提供了一套约定和指南。库和框架都可以在开发应用程序时节省时间和精力的，但它们在抽象级别和提供的控制程度上有所不同。\n\
    \n## jQuery\n\njQuery 是一个流行的库，提供了一组实用函数和方法用于与 DOM 交互、发送 HTTP 请求以及元素动画。jQuery 的主要优势之一是它简化了常见的\
    \ JavaScript 任务，并让你编写更短、更简洁的代码。\n\n要使用 jQuery，你需要在 HTML 文件中包含 jQuery 库。你可以下载库并在本地包含它，也可以通过在\
    \ HTML 文件中添加 `script` 标签从 CDN（内容分发网络）包含它。\n\n```html\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n```\n\n一旦包含了库，你就可以通过从 DOM 中选择元素并对其应用函数和方法开始使用 jQuery。例如，要选择页面上所有的\
    \ `p` 元素并隐藏它们，可以使用 `hide()` 函数：\n\n```javascript\n$(\"p\").hide();\n```\n\njQuery\
    \ 还提供了一组事件，你可以使用它们来响应用户操作，如点击、悬停和表单提交。例如，要给按钮绑定点击事件，可以使用 `click()` 函数：\n\n```javascript\n\
    $(\"button\").click(function() {\n  // 按钮被点击时执行的代码\n});\n```\n\n## React\n\nReact\
    \ 是一个用于构建用户界面的 JavaScript 库。由 Facebook 开发，现在由开发者社区维护。React 允许你创建可以轻松组合的复用组件，以构建复杂的应用程序。\n\
    \nReact 的主要优势之一是它使用虚拟 DOM（文档对象模型）来优化对实际 DOM 的更新。这意味着当组件状态变化时，React 只会更新必要的 DOM\
    \ 部分，而不是重建整个 DOM 树。这可以极大地提高你应用程序的性能，特别是在处理大型数据集或频繁变化的数据时。\n\n要使用 React，你需要在 HTML\
    \ 文件中包含 React 库，并设置构建过程来编译你的代码。有几种方法可以实现这一点，但一种流行的方法是使用 `create-react-app`。\n\n\
    一旦设置好 React，你就可以开始创建组件。组件是代表用户界面部分的代码。这里有一个显示列表的组件示例：\n\n```javascript\nimport\
    \ React from \"react\";\nclass List extends React.Component {\n  render() {\n\
    \    return (\n      <ul>\n        <li>Item 1</li>\n        <li>Item 2</li>\n\
    \        <li>Item 3</li>\n      </ul>\n    );\n  }\n}\n```\n\n要使用该组件，你可以在 HTML\
    \ 中这样包含它：\n\n```html\n<div id=\"root\"></div>\n```\n\n然后你可以使用 `ReactDOM.render`\
    \ 方法将其渲染到根元素：\n\n```javascript\nimport React from \"react\";\nimport ReactDOM\
    \ from \"react-dom\";\nimport List from \"./List\";\n\nReactDOM.render(<List />,\
    \ document.getElementById(\"root\"));\n```\n\nReact 组件还可以拥有状态（state）和属性（props）。状态是在组件内部管理数据的方法，而\
    \ props 是父组件向子组件传递数据的方法。\n\n例如，这是一个具有状态值和一个控制文本颜色属性的组件：\n\n```javascript\nimport\
    \ React from \"react\";\nclass Counter extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      count: 0\n    };\n  }\n  render()\
    \ {\n    return (\n      <div>\n        <p style={{ color: this.props.color }}>\n\
    \          计数为 {this.state.count}。\n        </p>\n        <button onClick={()\
    \ => this.setState({ count: this.state.count + 1 })}>\n          加 1\n       \
    \ </button>\n      </div>\n    );\n  }\n}\n```\n\n要使用该组件，你可以为 `color` 属性传递一个值：\n\
    \n```javascript\nReactDOM.render(<Counter color=\"#00b8d4\" />, document.getElementById(\"\
    root\"));\n```\n\n## Angular\n\nAngular 是用于构建单页应用程序的全功能框架。它提供了一套约定和工具用于创建具有模块化架构的复杂应用程序。Angular\
    \ 使用基于组件的架构，与 React 类似，但它提供了额外的功能，如依赖注入、路由和内置的 HTTP 客户端。它还有一种被称为 HTML 模板的模板语法，允许你使用类似\
    \ HTML 的语法定义组件的结构。\n\n要使用 Angular，你需要在 HTML 文件中包含 Angular 库，并设置构建过程来编译你的代码。你可以使用\
    \ Angular CLI（命令行界面）工具设置开发环境并创建一个新的 Angular 项目。\n\n"
- fmt: "\nOnce you have Angular set up, you can start creating components. A component\
    \ in Angular is a class that defines the properties and behavior of a view element.\
    \ You can use the `@Component` decorator to define the component, and you can\
    \ use the `template` or `templateUrl` property to define the HTML template for\
    \ the component.\n\nHere’s an example of a simple component that displays a greeting:\n\
    \n```typescript\nimport { Component } from \"@angular/core\";\n\n@Component({\n\
    \  selector: \"app-greeting\",\n  template: `\n    <h1>Hello, World!</h1>\n  `\n\
    })\nexport class GreetingComponent {\n  // component logic goes here\n}\n```\n\
    \nTo use the component, you can include it in your HTML file like this:\n\n```html\n\
    <app-greeting></app-greeting>\n```\n\nAngular components can also have inputs\
    \ and outputs, which allow you to pass data between components. For example, here’s\
    \ a component that has an input for a user name and an output that fires an event\
    \ when the user clicks a button:\n\n```typescript\nimport { Component, Input,\
    \ Output, EventEmitter } from \"@angular/core\";\n\n@Component({\n  selector:\
    \ \"app-user\",\n  template: `\n    <p>{{ userName }}</p>\n    <button (click)=\"\
    onClick()\">Click me</button>\n  `\n})\nexport class UserComponent {\n  @Input()\
    \ userName: string;\n  @Output() clicked = new EventEmitter<void>();\n  onClick()\
    \ {\n    this.clicked.emit();\n  }\n}\n```\n\nTo use the component, you can bind\
    \ to the `userName` input and listen to the `clicked` output like this:\n\n```html\n\
    <app-user [userName]=\"'John'\" (clicked)=\"handleClick()\"></app-user>\n```\n\
    \nAngular also provides a powerful routing system that allows you to define multiple\
    \ routes for your application and navigate between them. You can define routes\
    \ using the `RouterModule` and the `Routes` array.\n\nFor example, here’s how\
    \ you can define two routes for an application:\n\n```typescript\nimport { NgModule\
    \ } from \"@angular/core\";\nimport { RouterModule, Routes } from \"@angular/router\"\
    ;\nimport { HomeComponent } from \"./home.component\";\nimport { AboutComponent\
    \ } from \"./about.component\";\n\nconst routes: Routes = [\n  { path: \"\", component:\
    \ HomeComponent },\n  { path: \"about\", component: AboutComponent }\n];\n\n@NgModule({\n\
    \  imports: [RouterModule.forRoot(routes)],\n  exports: [RouterModule]\n})\nexport\
    \ class AppRoutingModule {}\n```\n\nYou can then use the `routerLink` directive\
    \ to create links to the different routes, and you can use the `router-outlet`\
    \ directive to define where the content for the current route will be displayed.\n\
    \n```html\n<nav>\n  <a routerLink=\"/\">Home</a>\n  <a routerLink=\"/about\">About</a>\n\
    </nav>\n<router-outlet></router-outlet>\n```\n\n## Conclusion\n\nLibraries and\
    \ frameworks can greatly improve your productivity when developing applications\
    \ with JavaScript. They provide a set of tools and conventions that can help you\
    \ write cleaner, more maintainable code and build more complex applications faster.\
    \ In this chapter, we’ve explored some of the most popular libraries and frameworks,\
    \ including jQuery, React, and Angular. Whether you choose to use a library or\
    \ a framework will depend on your specific needs and preferences, but either way,\
    \ you’ll be able to take advantage of the powerful capabilities that these tools\
    \ provide.\n\n## Exercises\n\nTo review these concepts, we will go through a series\
    \ of exercises designed to test your understanding and apply what you have learned.\n\
    \n1. Write a jQuery function that selects all the `p` elements on a page and toggles\
    \ their visibility when a button is clicked.\n2. Write a React component that\
    \ displays a form with two input fields (email and password) and a submit button.\
    \ When the form is submitted, display an alert with the values of the input fields.\n\
    3. Write an Angular component that displays a list of users, each with a name\
    \ and an avatar. The component should have an input for a list of users and an\
    \ output that fires an event when a user is clicked.\n4. Write a jQuery function\
    \ that makes an AJAX request to a REST API and displays the result in a table.\n\
    5. Write a React component that uses the `useEffect` hook to fetch data from a\
    \ REST API and display it in a list.\n\n## Solutions\n\n### Write a jQuery function\
    \ that selects all the `p` elements on a page and toggles their visibility when\
    \ a button is clicked.\n\n```javascript\n$(document).ready(function() {\n  $(\"\
    button\").click(function() {\n    $(\"p\").toggle();\n  });\n});\n```\n\n### Write\
    \ a React component that displays a form with two input fields (email and password)\
    \ and a submit button. When the form is submitted, display an alert with the values\
    \ of the input fields.\n\n```javascript\nimport React from \"react\";\n\nclass\
    \ Form extends React.Component {\n  handleSubmit(event) {\n    event.preventDefault();\n\
    \    const email = event.target.elements.email.value;\n    const password = event.target.elements.password.value;\n\
    \    alert(`Email: ${email} Password: ${password}`);\n  }\n  render() {\n    return\
    \ (\n      <form onSubmit={this.handleSubmit}>\n        <label>\n          Email:\n\
    \          <input type=\"email\" name=\"email\" />\n        </label>\n       \
    \ <br />\n        <label>\n          Password:\n          <input type=\"password\"\
    \ name=\"password\" />\n        </label>\n        <br>\n        <button type=\"\
    submit\">Submit</button>\n      </form>\n    );\n  }\n}\n```\n\n### Write an Angular\
    \ component that displays a list of users, each with a name and an avatar. The\
    \ component should have an input for a list of users and an output that fires\
    \ an event when a user is clicked.\n\n```typescript\nimport { Component, Input,\
    \ Output, EventEmitter } from \"@angular/core\";\n\n@Component({\n  selector:\
    \ \"app-user-list\",\n  template: `\n    <ul>\n      <li *ngFor=\"let user of\
    \ users\" (click)=\"handleClick(user)\">\n        {{ user.name }}\n        <img\
    \ [src]=\"user.avatarUrl\" [alt]=\"user.name\" />\n      </li>\n    </ul>\n  `\n\
    })\nexport class UserListComponent {\n  @Input() users: any[];\n  @Output() userClicked\
    \ = new EventEmitter<any>();\n  handleClick(user) {\n    this.userClicked.emit(user);\n\
    \  }\n}\n```\n\n### Write a jQuery function that makes an AJAX request to a REST\
    \ API and displays the result in a table.\n\n```javascript\n$(document).ready(function()\
    \ {\n  $.ajax({\n    url: \"https://api.example.com/users\",\n    success: function(result)\
    \ {\n      const table = $(\"<table>\");\n      result.forEach(function(user)\
    \ {\n        const row = $(\"<tr>\");\n        row.append(`<td>${user.name}</td>`);\n\
    \        row.append(`<td>${user.email}</td>`);\n        table.append(row);\n \
    \     });\n      $(\"#result\").append(table);\n    }\n  });\n});\n```\n\n###\
    \ Write a React component that uses the `useEffect` hook to fetch data from a\
    \ REST API and display it in a list.\n\n```javascript\nimport React, { useEffect,\
    \ useState } from \"react\";\n\nfunction UserList() {\n  const [users, setUsers]\
    \ = useState([]);\n  useEffect(() => {\n    fetch(\"https://api.example.com/users\"\
    )\n      .then(response => response.json())\n      .then(result => setUsers(result));\n\
    \  }, []);\n  return (\n    <ul>\n      {users.map(user => (\n        <li key={user.id}>{user.name}</li>\n\
    \      ))}\n    </ul>\n  );\n}\n```\n\n## Debugging and Troubleshooting JavaScript\
    \ Code\n\nIn addition to debugging, there are several other techniques that you\
    \ can use to troubleshoot your JavaScript code.\n\n### Testing Your Code\n\nTesting\
    \ your code is a crucial part of the development process. It helps you ensure\
    \ that your code is correct and works as expected under different conditions.\
    \ There are several types of tests that you can use to validate your code, including\
    \ unit tests, integration tests, and acceptance tests.\n\nUnit tests are small,\
    \ isolated tests that validate a specific piece of code, such as a function or\
    \ a module. They are typically fast to run and allow you to test individual components\
    \ in isolation.\n\nIntegration tests are tests that validate the interaction between\
    \ multiple components. They are typically slower to run than unit tests and may\
    \ require more setup and configuration.\n\nAcceptance tests are tests that validate\
    \ the overall functionality of your code from the perspective of the user. They\
    \ may involve simulating user input and verifying that the expected output is\
    \ produced.\n"
