  trans: "\n\n# 用户事件\n\n用户事件是用户在网页上执行的操作，例如点击按钮、将鼠标悬停在元素上或在文本框中输入内容。你可以使用 JavaScript\
    \ 来响应这些事件，并创建动态且交互式的网页。\n\n在本文中，我们将介绍 JavaScript 中不同类型的用户事件，以及如何使用它们来创建交互式网页。\n\
    \n## 点击事件\n\n点击事件在用户点击某个元素时触发。你可以使用 `click` 事件来响应用户的点击并执行操作，例如显示消息或更改元素的内容。\n\n\
    要向元素绑定点击事件，你可以使用 `addEventListener` 方法。以下是一个为按钮绑定点击事件的示例：\n\n```javascript\nvar\
    \ button = document.getElementById(\"button\");\n\nbutton.addEventListener(\"\
    click\",  function()  {\n  alert(\"Button clicked!\");\n});\n```\n\n你也可以使用 `onclick`\
    \ 属性为元素绑定点击事件。以下是使用 `onclick` 属性的示例：\n\n```html\n<button id=\"button\"\nonclick=\"\
    alert('Button clicked!')\">点击我</button>\n```\n\n## 悬停事件\n\n悬停事件在用户将鼠标移动到元素上时触发。你可以使用\
    \ `mouseover` 和 `mouseout` 事件来响应用户的悬停并执行操作，例如更改元素的外观。\n\n要向元素绑定悬停事件，你可以使用 `addEventListener`\
    \ 方法。以下是一个为 `div` 元素绑定悬停事件的示例：\n\n```javascript\nvar div = document.getElementById(\"\
    div\");\n\ndiv.addEventListener(\"mouseover\",  function()  {\n  div.style.backgroundColor\
    \ =  \"yellow\";\n});\n\ndiv.addEventListener(\"mouseout\",  function()  {\n \
    \ div.style.backgroundColor =  \"white\";\n});\n```\n\n你也可以使用 `onmouseover` 和\
    \ `onmouseout` 属性为元素绑定悬停事件。以下是使用 `onmouseover` 和 `onmouseout` 属性的示例：\n\n```html\n\
    <div id=\"div\"\nonmouseover=\"this.style.backgroundColor =  'yellow'\"\nonmouseout=\"\
    this.style.backgroundColor =  'white'\">\n悬停在我上方</div>\n```\n\n## 键事件\n\n键事件在用户在键盘上打字时触发。你可以使用\
    \ `keydown`、`keyup` 和 `keypress` 事件来响应用户的键盘输入并执行操作，例如验证表单字段或搜索内容。\n\n要向元素绑定按键事件，你可以使用\
    \ `addEventListener` 方法。以下是一个为文本框绑定按键事件的示例：\n\n```javascript\nvar textField =\
    \ document.getElementById(\"text-field\");\n\ntextField.addEventListener(\"keydown\"\
    ,  function()  {\n  console.log(\"Key down!\");\n});\n\ntextField.addEventListener(\"\
    keyup\",  function()  {\n  console.log(\"Key up!\");\n});\n\ntextField.addEventListener(\"\
    keypress\",  function()  {\n  console.log(\"Key press!\");\n});\n```\n\n你也可以使用\
    \ `onkeydown`、`onkeyup` 和 `onkeypress` 属性为元素绑定按键事件。以下是使用 `onkeydown`、`onkeyup`\
    \ 和 `onkeypress` 属性的示例：\n\n```html\n<input id=\"text-field\"  type=\"text\"\n\
    onkeydown=\"console.log('Key down!')\"\nonkeyup=\"console.log('Key up!')\"\nonkeypress=\"\
    console.log('Key press!')\">\n```\n\n## 结论\n\n用户事件是创建交互式动态网页的关键部分。通过理解如何使用不同的事件（如点击、悬停和键事件），你将拥有创建吸引人且响应良好的\
    \ Web 所需的技能。\n\n## 练习\n\n为了复习这些概念，我们将通过一系列练习来测试你的理解能力并应用所学知识。\n\n1. 使用 `addEventListener`\
    \ 方法为按钮绑定点击事件，使其在点击时显示警框消息。\n2. 使用 `onmouseover` 和 `onmouseout` 属性为 `div` 元素绑定悬停事件，使其在悬停时时更改背景颜色。\n\
    3. 使用 `addEventListener` 方法为文本框绑定按键事件，使其在按下按键时向控制台记录消息。\n4. 使用 `addEventListener`\
    \ 方法为按钮绑定点击事件，使其在点击时更改 `div` 元素的文本。\n5. 使用 `onmouseover` 和 `onmouseout` 属性为 `div`\
    \ 元素绑定悬停事件，使其在悬停时时切换 CSS 类。\n\n## 解决方案\n\n1. 使用 `addEventListener` 方法为按钮绑定点击事件，使其在点击时显示警框消息。\n\
    \n```javascript\nvar button = document.getElementById(\"button\");\n\nbutton.addEventListener(\"\
    click\",  function()  {\n  alert(\"Button clicked!\");\n});\n```\n\n2. 使用 `onmouseover`\
    \ 和 `onmouseout` 属性为 `div` 元素绑定悬停事件，使其在悬停时更改背景颜色。\n\n```html\n<div id=\"div\"\n\
    onmouseover=\"this.style.backgroundColor =\n'yellow'\"\nonmouseout=\"this.style.backgroundColor\
    \ =\n'white'\">悬停在我上方</div>\n```\n\n3. 使用 `addEventListener` 方法为文本框绑定按键事件，使其在按下按键时向控制台记录消息。\n\
    \n```javascript\nvar textField = document.getElementById(\"text-field\");\n\n\
    textField.addEventListener(\"keydown\",  function()  {\n  console.log(\"Key down!\"\
    );\n});\n\ntextField.addEventListener(\"keyup\",  function()  {\n  console.log(\"\
    Key up!\");\n});\n\ntextField.addEventListener(\"keypress\",  function()  {\n\
    \  console.log(\"Key press!\");\n});\n```\n\n4. 使用 `addEventListener` 方法为按钮绑定点击事件，使其在点击时更改\
    \ `div` 元素的文本。\n\n```javascript\nvar button = document.getElementById(\"button\"\
    );\nvar div = document.getElementById(\"div\");\n\nbutton.addEventListener(\"\
    click\",  function()  {\n  div.innerHTML = \"文本已更改!\";\n});\n```\n\n5. 使用 `onmouseover`\
    \ 和 `onmouseout` 属性为 `div` 元素绑定悬停事件，使其在悬停时切换 CSS 类。\n\n```html\n<style>\n.highlighted\
    \ { background-color: yellow; }\n</style>\n<div id=\"div\"\nonmouseover=\"this.classList.add('highlighted')\"\
    \nonmouseout=\"this.classList.remove('highlighted')\">悬停在我上方</div>\n```\n\n"
- fmt: "\nIn addition to arrays, JavaScript also has several built-in collection types,\
    \ including `Set`, `Map`, and `WeakMap`.\n\n### Set\nA `Set` is a collection of\
    \ unique values, meaning that it cannot contain duplicate values. You can create\
    \ a `Set` by using the `Set` constructor.\n\nHere’s an example of how to create\
    \ a `Set` and add items to it:\n\n```javascript\nvar set = new Set();\nset.add(1);\n\
    set.add(2);\nset.add(3);\n```\n\nYou can use the `size` property to get the number\
    \ of items in a `Set`, and the `has` method to check if a `Set` contains a specific\
    \ value.\n\nHere’s an example of how to use the `size` property and the `has`\
    \ method:\n\n```javascript\nconsole.log(set.size);  // 3\nconsole.log(set.has(1));\
    \  // true\nconsole.log(set.has(4));  // false\n```\n\n### Map\nA `Map` is a collection\
    \ of key-value pairs, where each key is unique. You can create a `Map` by using\
    \ the `Map` constructor.\n\nHere’s an example of how to create a `Map` and add\
    \ items to it:\n\n```javascript\nvar map = new Map();\nmap.set(\"name\", \"John\"\
    );\nmap.set(\"age\", 30);\n```\n\nYou can use the `size` property to get the number\
    \ of items in a `Map`, and the `get` method to get the value of a specific key.\n\
    \nHere’s an example of how to use the `size` property and the `get` method:\n\n\
    ```javascript\nconsole.log(map.size);  // 2\nconsole.log(map.get(\"name\")); \
    \ // \"John\"\n```\n\n### WeakMap\nA `WeakMap` is similar to a `Map`, but it only\
    \ holds weak references to its keys, meaning that the keys can be garbage collected\
    \ if there are no other references to them. This makes `WeakMaps` useful for storing\
    \ data that you want to be automatically cleaned up when it is no longer needed.\n\
    \nTo create a `WeakMap`, you need to use the `WeakMap` constructor and pass in\
    \ an iterable of key-value pairs.\n\nHere’s an example of how to create a `WeakMap`\
    \ and add items to it:\n\n```javascript\nvar weakMap = new WeakMap([\n  [{}, \"\
    value1\"],\n  [{}, \"value2\"]\n]);\n```\n\nYou can use the `get` method to retrieve\
    \ the value of a specific key in a `WeakMap`.\n\nHere’s an example of how to use\
    \ the `get` method to retrieve a value from a `WeakMap`:\n\n```javascript\nvar\
    \ value = weakMap.get(key);  // \"value\"\n```\n\nNote that `WeakMaps` do not\
    \ have a `size` property or a `has` method, so you cannot get the number of items\
    \ in a `WeakMap` or check if a `WeakMap` contains a specific key.\n\n### Conclusion\n\
    In this article, we’ve covered the different types of arrays and collections in\
    \ JavaScript and how to use them to store and manipulate data. By understanding\
    \ how to work with arrays and collections, you’ll have the skills you need to\
    \ create efficient and effective data structures for your JavaScript applications.\n\
    \n### Exercises\nTo review these concepts, we will go through a series of exercises\
    \ designed to test your understanding and apply what you have learned.\n\n1. Create\
    \ an array of numbers and use a loop to print the square of each number to the\
    \ console.\n2. Create a `Set` of strings and use the `forEach` method to print\
    \ each string to the console.\n3. Create an array of objects and use the `forEach`\
    \ method to print the name of each object to the console.\n4. Create a `Set` of\
    \ numbers and use the `size` property and the `has` method to check if the set\
    \ contains the number 5.\n5. Create a `Map` of key-value pairs and use the `get`\
    \ method to retrieve the value of the key `\"key1\"`.\n\n### Solutions\nCreate\
    \ an array of numbers and use a loop to print the square of each number to the\
    \ console.\n\n```javascript\nvar numbers = [1, 2, 3, 4, 5];\nnumbers.forEach(function(number)\
    \ {\n  console.log(number * number);\n});\n```\n\nCreate a `Set` of strings and\
    \ use the `forEach` method to print each string to the console.\n\n```javascript\n\
    var set = new Set([\"apple\", \"banana\", \"cherry\"]);\nset.forEach(function(item)\
    \ {\n  console.log(item);\n});\n```\n\nCreate an array of objects and use the\
    \ `forEach` method to print the name of each object to the console.\n\n```javascript\n\
    var objects = [\n  {name: \"John\"},\n  {name: \"Jane\"},\n  {name: \"Jim\"}\n\
    ];\nobjects.forEach(function(object) {\n  console.log(object.name);\n});\n```\n\
    \nCreate a `Set` of numbers and use the `size` property and the `has` method to\
    \ check if the set contains the number 5.\n\n```javascript\nvar set = new Set([1,\
    \ 2, 3, 4, 5]);\nconsole.log(set.size);  // 5\nconsole.log(set.has(5));  // true\n\
    ```\n\nCreate a `Map` of key-value pairs and use the `get` method to retrieve\
    \ the value of the key `\"key1\"`.\n\n```javascript\nvar map = new Map([\n  [\"\
    key1\", \"value1\"],\n  [\"key2\", \"value2\"]\n]);\nconsole.log(map.get(\"key1\"\
    )); // \"value1\"\n```\n\n### Asynchronous Programming with Async/Await\nAsynchronous\
    \ programming is a paradigm in which a program can perform tasks concurrently\
    \ rather than sequentially. In JavaScript, asynchronous programming is often used\
    \ with I/O operations, such as reading or writing to a file, or making a request,\
    \ which can take time to complete.\n\n#### Callbacks\nOne of the earliest approaches\
    \ to asynchronous programming was to use callbacks. A callback is a function passed\
    \ as an argument and is called when the task completes. Here’s an example of how\
    \ to use a callback:\n\n```javascript\nfunction makeRequest(url, callback) {\n\
    \  var xhr = new XMLHttpRequest();\n  xhr.open(\"GET\", url);\n  xhr.onload =\
    \ function() {\n    callback(xhr.responseText);\n  };\n  xhr.send();\n}\n\n//\
    \ Use the callback\nmakeRequest(\"http://example.com\", function(response) {\n\
    \  console.log(response);\n});\n```\nWhile callback functions are effective at\
    \ handling asynchronous tasks, they can lead to what is known as “callback hell”\
    \ if you have multiple asynchronous tasks that depend on each other.\n\n#### Promises\n\
    To address the issue of “callback hell,” JavaScript introduced promises in ECMAScript\
    \ 2015 (ES6). A promise is an object that represents the result of an asynchronous\
    \ operation. A promise can be in one of three states:\n- Pending: The promise\
    \ has not yet been fulfilled or rejected.\n- Fulfilled: The promise has been fulfilled,\
    \ and the asynchronous operation was successful.\n- Rejected: The promise has\
    \ been rejected, and the asynchronous operation failed.\n\nPromises provide a\
    \ more declarative and readable way to handle asynchronous operations. Instead\
    \ of using callback functions, you can use the `then` and `catch` methods of a\
    \ promise. Here’s an example of how to use a promise to make an HTTP request:\n\
    \n```javascript\nfunction makeRequest(url) {\n  return new Promise(function(resolve,\
    \ reject) {\n    var xhr = new XMLHttpRequest();\n    xhr.open(\"GET\", url);\n\
    \    xhr.onload = function() {\n      if (xhr.status === 200) {\n        resolve(xhr.responseText);\n\
    \      } else {\n        reject(xhr.statusText);\n      }\n    };\n    xhr.send();\n\
    \  });\n}\n\n// Use the then and catch methods\nmakeRequest(\"http://example.com\"\
    )\n .then(function(response) {\n    console.log(response);\n  })\n  .catch(function(error)\
    \ {\n    console.error(error);\n  });\n```\n\n#### async/await\nThe `async/await`\
    \ syntax is a newer addition to JavaScript that makes it even easier to work with\
    \ asynchronous code. The `async` keyword is used to declare an asynchronous function,\
    \ and the `await` keyword is used to wait for a promise to be fulfilled or rejected\
    \ before continuing execution.\n"
  raw: "In addition to arrays, JavaScript also has several built-in collection types,\
    \ including Set, Map, and WeakMap.\n\nA Set is a collection of unique values,\
    \ meaning that it cannot contain duplicate values. You can create a Setby using\
    \ the Set constructor.\n\nHere’s an example of how to create a Set and add items\
    \ to it:\n\nvar set =  new Set();\n\nset.add(1);\n\nset.add(2);\n\nset.add(3);\n\
    \nYou can use the size property to get the number of items in a Set, and the has method\
    \ to check if a Setcontains a specific value.\n\nHere’s an example of how to use\
    \ the size property and the has method:\n\nconsole.log(set.size);  // 3\n\nconsole.log(set.has(1));\
    \  // true\n\nconsole.log(set.has(4));  // false\n\nA Map is a collection of key-value\
    \ pairs, where each key is unique. You can create a Map by using the Mapconstructor.\n\
    \nHere’s an example of how to create a Map and add items to it:\n\nvar map = \
    \ new Map();\n\nmap.set(\"name\",  \"John\");\n\nmap.set(\"age\",  30);\n\nYou\
    \ can use the size property to get the number of items in a Map, and the get method\
    \ to get the value of a specific key.\n\nHere’s an example of how to use the size\
    \ property and the get method:\n\nconsole.log(map.size);  // 2\n\nconsole.log(map.get(\"\
    name\"));  // \"John\"\n\nA WeakMap is similar to a Map, but it only holds weak\
    \ references to its keys, meaning that the keys can be garbage collected if there\
    \ are no other references to them. This makes WeakMaps useful for storing data\
    \ that you want to be automatically cleaned up when it is no longer needed.\n\n\
    To create a WeakMap, you need to use the WeakMap constructor and pass in an iterable\
    \ of key-value pairs.\n\nHere’s an example of how to create a WeakMap and add\
    \ items to it:\n\nvar weakMap =  new WeakMap([\n\n [{},  \"value1\"],\n\n [{},\
    \  \"value2\"]\n\n]);\n\nYou can use the get method to retrieve the value of a\
    \ specific key in a WeakMap.\n\nHere’s an example of how to use the get method\
    \ to retrieve a value from a WeakMap:\n\nvar value = weakMap.get(key);  // \"\
    value\"\n\nNote that WeakMaps do not have a size property or a has method, so\
    \ you cannot get the number of items in a WeakMap or check if a WeakMap contains\
    \ a specific key.\n\nConclusion\n\nIn this article, we’ve covered the different\
    \ types of arrays and collections in JavaScript and how to use them to store and\
    \ manipulate data. By understanding how to work with arrays and collections, you’ll\
    \ have the skills you need to create efficient and effective data structures for\
    \ your JavaScript applications.\n\nExercises\n\nTo review these concepts, we will\
    \ go through a series of exercises designed to test your understanding and apply\
    \ what you have learned.\n\nCreate an array of numbers and use a loop to print\
    \ the square of each number to the console.\n\nCreate a Set of strings and use\
    \ the forEach method to print each string to the console.\n\nCreate an array of\
    \ objects and use the forEach method to print the name of each object to the console.\n\
    \nCreate a Set of numbers and use the size property and the has method to check\
    \ if the set contains the number 5.\n\nCreate a Map of key-value pairs and use\
    \ the get method to retrieve the value of the key \"key1\".\n\nSolutions\n\nCreate\
    \ an array of numbers and use a loop to print the square of each number to the\
    \ console.\n\nvar numbers =  [1,  2,  3,  4,  5];\n\nnumbers.forEach(function(number)\
    \  {\n\n  console.log(number * number);\n\n});\n\nCreate a Set of strings and\
    \ use the forEach method to print each string to the console.\n\nvar set =  new\
    \ Set([\"apple\",  \"banana\",  \"cherry\"]);\n\nset.forEach(function(item)  {\n\
    \n  console.log(item);\n\n});\n\nCreate an array of objects and use the forEach method\
    \ to print the name of each object to the console.\n\nvar objects =  [\n\n {name:\
    \  \"John\"},\n\n {name:  \"Jane\"},\n\n {name:  \"Jim\"}\n\n];\n\nobjects.forEach(function(object)\
    \  {\n\n  console.log(object.name);\n\n});\n\nCreate a Set of numbers and use\
    \ the size property and the has method to check if the set contains the number\
    \ 5.\n\nvar set =  new Set([1,  2,  3,  4,  5]);\n\nconsole.log(set.size);  //\
    \ 5\n\nconsole.log(set.has(5));  // true\n\nCreate a Map of key-value pairs and\
    \ use the get method to retrieve the value of the key \"key1\".\n\nvar map = \
    \ new Map([\n\n [\"key1\",  \"value1\"],\n\n [\"key2\",  \"value2\"]\n\n]);\n\n\
    console.log(map.get(\"key1\"));  // \"value1\"\n\nAsynchronous Programming with\
    \ Promises and Async/Await\n\nAsynchronous programming is an important concept\
    \ in JavaScript, as it allows you to perform long-running tasks without blocking\
    \ the main thread of execution. In this article, we’ll go over the basics of asynchronous\
    \ programming in JavaScript, and how to use promises and the async/await syntax\
    \ to make it easier to work with asynchronous code.\n\nWhat is Asynchronous Programming?\n\
    \nAsynchronous programming is a programming paradigm in which a program can perform\
    \ multiple tasks concurrently, rather than sequentially. This allows a program\
    \ to perform multiple tasks simultaneously, without having to wait for one task\
    \ to complete before starting another.\n\nIn JavaScript, asynchronous programming\
    \ is often used when working with I/O operations, such as reading or writing to\
    \ a file, or making an HTTP request to a server. These types of operations can\
    \ take a long time to complete, and blocking the main thread of execution while\
    \ they are running can lead to a poor user experience. By using asynchronous programming,\
    \ you can perform these tasks concurrently, without blocking the main thread of\
    \ execution.\n\nCallbacks\n\nOne of the earliest approaches to asynchronous programming\
    \ in JavaScript was to use callback functions. A callback function is a function\
    \ that is passed as an argument to another function, and is called when the task\
    \ that the function performs has completed.\n\nHere’s an example of how to use\
    \ a callback function to make an HTTP request:\n\nfunction  makeRequest(url, callback)\
    \  {\n\n // Make the request\n\n var xhr =  new XMLHttpRequest();\n\n  xhr.open(\"\
    GET\", url);\n\n  xhr.onload  =  function()  {\n\n    callback(xhr.responseText);\n\
    \n  };\n\n  xhr.send();\n\n}\n\n// Use the callback function\n\nmakeRequest(\"\
    http://example.com\",  function(response)  {\n\n  console.log(response);\n\n});\n\
    \nWhile callback functions are effective at handling asynchronous tasks, they\
    \ can lead to what is known as “callback hell” if you have multiple asynchronous\
    \ tasks that depend on each other. This can result in a deep nesting of callback\
    \ functions, which can be difficult to read and maintain.\n\nPromises\n\nTo address\
    \ the issue of “callback hell,” JavaScript introduced promises in ECMAScript 2015\
    \ (ES6). A promise is an object that represents the result of an asynchronous\
    \ operation. A promise can be in one of three states:\n\n*   Pending: The promise\
    \ has not yet been fulfilled or rejected.\n\n*   Fulfilled: The promise has been\
    \ fulfilled, and the asynchronous operation was successful.\n\n*   Rejected: The\
    \ promise has been rejected, and the asynchronous operation failed.\n\nPromises\
    \ provide a more declarative and readable way to handle asynchronous operations.\
    \ Instead of using callback functions, you can use the then and catch methods\
    \ of a promise to specify what should happen when the promise is fulfilled or\
    \ rejected.\n\nHere’s an example of how to use a promise to make an HTTP request:\n\
    \nfunction  makeRequest(url)  {\n\n return  new Promise(function(resolve, reject)\
    \  {\n\n    // Make the request\n\n    var xhr =  new XMLHttpRequest();\n\n    xhr.open(\"\
    GET\", url);\n\n    xhr.onload  =  function()  {\n\n      if  (xhr.status ===\
    \  200)  {\n\n        resolve(xhr.responseText);\n\n      }  else  {\n\n        reject(xhr.statusText);\n\
    \n      }\n\n    };\n\n    xhr.send();\n\n  });\n\n}\n\n// Use the then and catch\
    \ methods\n\nmakeRequest(\"http://example.com\")\n\n .then(function(response)\
    \  {\n\n    console.log(response);\n\n  })\n\n .catch(function(error)  {\n\n    console.error(error);\n\
    \n  });\n\nasync/await\n\nThe async/await syntax is a newer addition to JavaScript\
    \ that makes it even easier to work with asynchronous code. The async keyword\
    \ is used to declare an asynchronous function, and the awaitkeyword is used to\
    \ wait for a promise to be fulfilled or rejected before continuing execution."
