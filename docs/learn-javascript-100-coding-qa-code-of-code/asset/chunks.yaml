    Adding and Removing DOM Elements


    The DOM allows you to add and remove elements from the document using various
    methods.


    To add an element to the document, you can use the createElement method to create
    a new element and the appendChild method to append the element to an existing
    element. Here’s an example of how to add an element to the document:


    var newParagraph = document.createElement("p");


    newParagraph.innerHTML =  "This is a new paragraph.";


    document.body.appendChild(newParagraph);


    To remove an element from the document, you can use the removeChild method. Here’s
    an example of how to remove an element from the document:


    document.body.removeChild(newParagraph);


    Conclusion


    The DOM is an essential part of JavaScript and enables you to create dynamic and
    interactive web pages. By understanding how to access and modify DOM elements,
    you’ll have the skills you need to create powerful and engaging web applications.


