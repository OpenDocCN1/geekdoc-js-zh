  trans: "\n\n# 使用 JavaScript 操控 HTML 元素\n\nJavaScript 允许你操控 HTML 元素，并更改网页的内容、属性和样式。这使你能够创建动态且交互式的网页，以响应用户输入和不断变化的数据。\n\
    \n在本文中，我们将介绍使用 JavaScript 操控 HTML 元素的不同方法，包括使用文档对象模型 (DOM)、处理 HTML 表单以及创建和修改 CSS\
    \ 样式。\n\n## 文档对象模型 (DOM)\n\n文档对象模型 (DOM) 是用于 HTML 和 XML 文档的编程接口。它将文档结构表示为对象树，其中每个对象代表文档中的一个元素。\n\
    \n你可以使用 DOM 在 JavaScript 中访问和修改 HTML 元素。这是通过使用 `document` 对象以及各种方法和属性来实现的，例如 `getElementById`、`getElementsByTagName`\
    \ 和 `querySelector`。\n\n以下是如何使用 DOM 修改元素内容的示例：\n\n```javascript\nvar header =\
    \ document.getElementById(\"header\");\nheader.innerHTML = \"Welcome to My New\
    \ Page\";\n```\n\n以下是如何使用 DOM 更改元素属性的示例：\n\n```javascript\nheader.setAttribute(\"\
    class\", \"new-class\");\n```\n\n## 处理 HTML 表单\n\nHTML 表单允许你收集用户输入并将其到服务器。你可以使用\
    \ JavaScript 访问和操作表单元素，例如文本字段、单选按钮和选择列表。\n\n要在 JavaScript 中访问表单元素，你可以使用 `document.getElementById`\
    \ 方法。以下是如何访问表单中文本字段的示例：\n\n```javascript\nvar textField = document.getElementById(\"\
    text-field\");\n```\n\n然后可以使用各种方法和属性来操作表单元素。例如，你可以使用 `value` 属性来获取或设置文本字段的值：\n\
    \n```javascript\ntextField.value = \"Hello World!\";\n```\n\n你还可以使用 `checked`\
    \ 属性来获取或设置单选按钮或复选框的选中状态：\n\n```javascript\nvar radioButton = document.getElementById(\"\
    radio-button\");\nradioButton.checked = true;\n```\n\n## 创建和修改 CSS 样式\n\n你可以使用\
    \ JavaScript 为元素创建和修改 CSS 样式。这允许你根据用户输入或数据变化改变网页外观。\n\n要修改元素的属性，可以使用 `setAttribute`\
    \ 方法。以下是使用 `setAttribute` 的示例：\n\n```javascript\nheader.setAttribute(\"class\"\
    , \"new-class\");\n```\n\n你还可以使用 `style` 属性来修改元素的 CSS 样式。以下是使用 `style` 属性的示例：\n\
    \n```javascript\nheader.style.color = \"red\";\n```\n\n## 添加和移除 DOM 元素\n\nDOM\
    \ 允许你使用各种方法从文档中添加或移除元素。\n\n要向文档添加元素，可以使用 `createElement` 方法创建一个新元素，并使用 `appendChild`\
    \ 方法将该元素添加到现有元素之后。以下是如何向文档添加元素的示例：\n\n```javascript\nvar newParagraph = document.createElement(\"\
    p\");\nnewParagraph.innerHTML = \"This is a new paragraph.\";\ndocument.body.appendChild(newParagraph);\n\
    ```\n\n要从文档中移除元素，可以使用 `removeChild` 方法。以下是从文档中移除元素的示例：\n\n```javascript\ndocument.body.removeChild(newParagraph);\n\
    ```\n\n## 结论\n\nDOM 是 JavaScript 的重要组成部分，它让你能够创建动态且交互式的网页。通过理解如何访问和修改 DOM 元素，你将拥有创建强大且吸引\
    \ Web 应用所需的技能。\n\n## 练习\n\n为了复习这些概念，我们将通过一系列练习，旨在测试你的理解能力并应用所学知识。\n\n1. 使用 `document.getElementById`\
    \ 方法访问 id 为“header”的元素，并将其 `innerHTML` 改为“Welcome to My New Page”。\n2. 使用 `document.getElementsByTagName`\
    \ 方法访问文档中所有的 `p` 元素，并将其 `innerHTML` 改为“This is a new paragraph.”\n3. 使用 `document.createElement`\
    \ 和 `appendChild` 方法在 `body` 元素末尾添加一个新的 `p` 元素。\n4. 使用 `document.querySelector`\
    \ 方法访问类名为“highlighted”的元素，并将其 `style.color` 改为“red”。\n5. 使用 `removeChild` 方法从\
    \ `body` 元素中移除练习 3 中创建的元素。\n\n## 答案\n\n1. 使用 `document.getElementById` 方法访问 id\
    \ 为“header”的元素，并将其 `innerHTML` 改为“Welcome to My New Page”。\n```javascript\nvar\
    \ header = document.getElementById(\"header\");\nheader.innerHTML = \"Welcome\
    \ to My New Page\";\n```\n\n2. 使用 `document.getElementsByTagName` 方法访问文档中所有的 `p`\
    \ 元素，并将其 `innerHTML` 改为“This is a new paragraph.”\n```javascript\nvar paragraphs\
    \ = document.getElementsByTagName(\"p\");\nfor (var i = 0; i < paragraphs.length;\
    \ i++) {\n  paragraphs[i].innerHTML = \"This is a new paragraph.\";\n}\n```\n\n\
    3. 使用 `document.createElement` 和 `appendChild` 方法在 `body` 元素末尾添加一个新的 `p` 元素。\n\
    ```javascript\nvar newParagraph = document.createElement(\"p\");\nnewParagraph.innerHTML\
    \ = \"This is a new paragraph.\";\ndocument.body.appendChild(newParagraph);\n\
    ```\n\n4. 使用 `document.querySelector` 方法访问类名为“highlighted”的元素，并将其 `style.color`\
    \ 改为“red”。\n```javascript\nvar highlighted = document.querySelector(\".highlighted\"\
    );\nhighlighted.style.color = \"red\";\n```\n\n5. 使用 `removeChild` 方法从 `body`\
    \ 元素中移除练习 3 中创建的元素。\n```javascript\ndocument.body.removeChild(newParagraph);\n\
    ```\n\n"
- fmt: "\n# User Events\n\nUser events are actions that users take on a web page,\
    \ such as clicking a button, hovering over an element, or typing in a text field.\
    \ You can use JavaScript to respond to these events and create dynamic and interactive\
    \ web pages.\n\nIn this article, we’ll go over the different types of user events\
    \ in JavaScript and how to use them to create interactive web pages.\n\n## Click\
    \ Events\n\nClick events are triggered when a user clicks on an element. You can\
    \ use the `click` event to respond to a user’s click and perform an action, such\
    \ as displaying a message or changing the content of an element.\n\nTo attach\
    \ a click event to an element, you can use the `addEventListener` method. Here’s\
    \ an example of how to attach a click event to a button:\n\n```javascript\nvar\
    \ button = document.getElementById(\"button\");\n\nbutton.addEventListener(\"\
    click\",  function()  {\n  alert(\"Button clicked!\");\n});\n```\n\nYou can also\
    \ use the `onclick` attribute to attach a click event to an element. Here’s an\
    \ example of how to use the `onclick` attribute:\n\n```html\n<button id=\"button\"\
    \nonclick=\"alert('Button clicked!')\">Click Me</button>\n```\n\n## Hover Events\n\
    \nHover events are triggered when a user moves their mouse over an element. You\
    \ can use the `mouseover` and `mouseout` events to respond to a user’s hover and\
    \ perform an action, such as changing the appearance of an element.\n\nTo attach\
    \ a hover event to an element, you can use the `addEventListener` method. Here’s\
    \ an example of how to attach a hover event to a div element:\n\n```javascript\n\
    var div = document.getElementById(\"div\");\n\ndiv.addEventListener(\"mouseover\"\
    ,  function()  {\n  div.style.backgroundColor =  \"yellow\";\n});\n\ndiv.addEventListener(\"\
    mouseout\",  function()  {\n  div.style.backgroundColor =  \"white\";\n});\n```\n\
    \nYou can also use the `onmouseover` and `onmouseout` attributes to attach hover\
    \ events to an element. Here’s an example of how to use the `onmouseover` and\
    \ `onmouseout` attributes:\n\n```html\n<div id=\"div\"\nonmouseover=\"this.style.backgroundColor\
    \ =  'yellow'\"\nonmouseout=\"this.style.backgroundColor =  'white'\">\nHover\
    \ over me</div>\n```\n\n## Key Events\n\nKey events are triggered when a user\
    \ types on their keyboard. You can use the `keydown`, `keyup`, and `keypress`\
    \ events to respond to a user’s keyboard input and perform an action, such as\
    \ validating a form field or searching for content.\n\nTo attach a key event to\
    \ an element, you can use the `addEventListener` method. Here’s an example of\
    \ how to attach a key event to a text field:\n\n```javascript\nvar textField =\
    \ document.getElementById(\"text-field\");\n\ntextField.addEventListener(\"keydown\"\
    ,  function()  {\n  console.log(\"Key down!\");\n});\n\ntextField.addEventListener(\"\
    keyup\",  function()  {\n  console.log(\"Key up!\");\n});\n\ntextField.addEventListener(\"\
    keypress\",  function()  {\n  console.log(\"Key press!\");\n});\n```\n\nYou can\
    \ also use the `onkeydown`, `onkeyup`, and `onkeypress` attributes to attach key\
    \ events to an element. Here’s an example of how to use the `onkeydown`, `onkeyup`,\
    \ and `onkeypress` attributes:\n\n```html\n<input id=\"text-field\"  type=\"text\"\
    \nonkeydown=\"console.log('Key down!')\"\nonkeyup=\"console.log('Key up!')\"\n\
    onkeypress=\"console.log('Key press!')\">\n```\n\n## Conclusion\n\nUser events\
    \ are a crucial part of creating interactive and dynamic web pages. By understanding\
    \ how to use different events, such as click, hover, and key events, you’ll have\
    \ the skills you need to create engaging and responsive web applications.\n\n\
    ## Exercises\n\nTo review these concepts, we will go through a series of exercises\
    \ designed to test your understanding and apply what you have learned.\n\n1. Use\
    \ the `addEventListener` method to attach a click event to a button that displays\
    \ an alert message when clicked.\n2. Use the `onmouseover` and `onmouseout` attributes\
    \ to attach hover events to a div element that changes the background color when\
    \ hovered over.\n3. Use the `addEventListener` method to attach key events to\
    \ a text field that logs a message to the console when a key is pressed.\n4. Use\
    \ the `addEventListener` method to attach a click event to a button that changes\
    \ the text of a div element when clicked.\n5. Use the `onmouseover` and `onmouseout`\
    \ attributes to attach hover events to a div element that toggles a CSS class\
    \ when hovered over.\n\n## Solutions\n\n1. Use the `addEventListener` method to\
    \ attach a click event to a button that displays an alert message when clicked.\n\
    \n```javascript\nvar button = document.getElementById(\"button\");\n\nbutton.addEventListener(\"\
    click\",  function()  {\n  alert(\"Button clicked!\");\n});\n```\n\n2. Use the\
    \ `onmouseover` and `onmouseout` attributes to attach hover events to a div element\
    \ that changes the background color when hovered over.\n\n```html\n<div id=\"\
    div\"\nonmouseover=\"this.style.backgroundColor =\n'yellow'\"\nonmouseout=\"this.style.backgroundColor\
    \ =\n'white'\">Hover over me</div>\n```\n\n3. Use the `addEventListener` method\
    \ to attach key events to a text field that logs a message to the console when\
    \ a key is pressed.\n\n```javascript\nvar textField = document.getElementById(\"\
    text-field\");\n\ntextField.addEventListener(\"keydown\",  function()  {\n  console.log(\"\
    Key down!\");\n});\n\ntextField.addEventListener(\"keyup\",  function()  {\n \
    \ console.log(\"Key up!\");\n});\n\ntextField.addEventListener(\"keypress\", \
    \ function()  {\n  console.log(\"Key press!\");\n});\n```\n\n4. Use the `addEventListener`\
    \ method to attach a click event to a button that changes the text of a div element\
    \ when clicked.\n\n```javascript\nvar button = document.getElementById(\"button\"\
    );\nvar div = document.getElementById(\"div\");\n\nbutton.addEventListener(\"\
    click\",  function()  {\n  div.innerHTML = \"Text changed!\";\n});\n```\n\n5.\
    \ Use the `onmouseover` and `onmouseout` attributes to attach hover events to\
    \ a div element that toggles a CSS class when hovered over.\n\n```html\n<style>\n\
    .highlighted { background-color: yellow; }\n</style>\n<div id=\"div\"\nonmouseover=\"\
    this.classList.add('highlighted')\"\nonmouseout=\"this.classList.remove('highlighted')\"\
    >Hover over me</div>\n```\n"
