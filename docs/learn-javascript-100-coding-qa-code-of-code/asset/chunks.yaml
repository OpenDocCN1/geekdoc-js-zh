    \n          html node\n\n       /          \\\n\nhead node     body node\n\n             /         \\\
    \n\n        h1 node      p node\n\nAccessing DOM Elements\n\nTo access DOM elements\
    \ in JavaScript, you can use the document object and various methods and properties.\n\
    \nThe document.getElementById method allows you to access an element by its unique id attribute.\
    \ Here’s an example of how to use document.getElementById:\n\nvar header = document.getElementById(\"\
    header\");\n\nThe document.getElementsByTagName method allows you to access a\
    \ collection of elements by their tag name. Here’s an example of how to use document.getElementsByTagName:\n\
    \nvar paragraphs = document.getElementsByTagName(\"p\");\n\nThe document.getElementsByClassName method\
    \ allows you to access a collection of elements by their class name. Here’s an\
    \ example of how to use document.getElementsByClassName:\n\nvar highlighted =\
    \ document.getElementsByClassName(\"highlighted\");\n\nYou can also use the document.querySelector and document.querySelectorAll methods\
    \ to access elements using CSS selectors. Here’s an example of how to use document.querySelector:\n\
    \nvar header = document.querySelector(\"#header\");\n\nAnd here’s an example of\
    \ how to use document.querySelectorAll:\n\nvar highlighted =\n\ndocument.querySelectorAll(\"\
    .highlighted\");\n\nModifying DOM Elements\n\nOnce you have access to a DOM element,\
    \ you can modify its content and attributes using various methods and properties.\n\
    \nTo modify the content of an element, you can use the innerHTML property. Here’s\
    \ an example of how to use innerHTML:\n\nheader.innerHTML =  \"Welcome to My New\
    \ Page\";"
