    \n# 使用 JavaScript 构建 Web 应用程序\n\n现在你已经学习了 JavaScript 的基础知识，是时候将所有内容整合起来构建一个 Web\
    \ 应用程序了。在“学习 JavaScript”课程的最后一章中，你将学习如何使用 JavaScript 构建交互式的动态 Web 应用程序，这些程序可以与服务器通信、访问数据并执行复杂任务。\n\
    \n## 设置开发环境\n\n在开始构建 Web 应用程序之前，你需要设置开发环境。这包括安装代码编辑器、设置本地开发服务器以及配置你的项目结构。\n\n\
    有很多代码编辑器可以选择，例如 [Sublime Text](https://www.sublimetext.com/) [Atom](https://atom.io/)\
    \ 和 [Visual Studio Code](https://code.visualstudio.com/)。这些代码编辑器提供了语法高亮、代码补全和调试工具等功能，让编写和调试代码变得更加容易。\n\
    \n要设置本地开发服务器，你可以使用 [XAMPP](https://www.apachefriends.org/index.html)、[WAMP](http://www.wampserver.com/en/)\
    \ 或 [MAMP](https://www.mamp.info/en/) 等工具。这些工具允许你在本地上运行 Web 服务器，这在将 Web 应用程序部署到上线服务器之前进行测试和调试非常有用。\n\
    \n一旦设置好了代码编辑器和开发服务器，你就需要为你的 Web 应用程序决定项目结构。常见的结构是：一个用于样式表的 `css` 目录，一个用于 JavaScript\
    \ 文件的 `js` 目录以及一个用于 HTML 的 `index.html` 文件。你可能还想包含图像、字体和其他资源的目录。\n\n## 构建 HTML\
    \ 结构\n\n构建 Web 应用程序的第一步是创建 HTML 结构。这包括定义应用程序的布局、添加页眉、页脚和导航等元素，并使用 HTML 标签对内容进行标记。\n\
    \n要创建应用程序的布局，你可以使用 HTML5 结构化标签，如 `header`、`footer` 和 `main`。你也可以使用 CSS 对应用程序进行样式。\n\
    \n## 使用 JavaScript 添加交互性\n\n一旦有了 HTML 结构，你就可以使用 JavaScript 让你的应用程序具有交互性注意：此处原文包含重复/碎片化的句子；本节保持逻辑连贯性）。\n\
    \n# 整合一切\n\n构建一个完整的 Web 应用程序，你需要结合所有这些元素。\n\n## 结论\n\n构建 Web 应用程序需要 HTML、CSS 和\
    \ JavaScript 的结合。通过遵循本课程的步骤，你应该为构建自己的应用程序打下坚实的基础。\n\n## 示例项目\n\n在这个示例中，我们将构建一个待事项列表。首先，我们将设置\
    \ HTML 结构。我们将创建一个带有 `id=\"todo-list\"` 的 `div` 元素来包含任务列表，并创建一个带有 `id=\"add-task-form\"\
    ` 的 `form` 元素来添加任务。在表单内部，我们将添加一个 `type=\"text\"` 的 `input` 元素允许用户输入任务，以及一个 `type=\"\
    submit\"` 的 `button` 元素来提交表单。\n\n```html\n<div id=\"todo-list\">\n  <ul></ul>\n\
    </div>\n<form id=\"add-task-form\">\n  <input type=\"text\" id=\"task-title\"\
    \ placeholder=\"Enter title\">\n  <button type=\"submit\">Add Task</button>\n\
    </form>\n```\n\n接下来，我们将编写 CSS 来为应用程序设置样式。我们将使用 `flexbox` 等布局属性组合来定义应用程序的布局。\n\n\
    ```css\n#todo-list {\n  display: flex;\n  flex-direction: column;\n  width: 400px;\n\
    \  margin: 0 auto;\n}\n#add-task-form {\n  display: flex;\n  align-items: center;\n\
    \  margin-bottom: 20px;\n}\n#add-task-form input[type=\"text\"] {\n  flex-grow:\
    \ 1;\n  padding: 8px;\n  font-size: 16px;\n  border: none;\n  border-radius: 4px;\n\
    }\n#add-task-form button[type=\"submit\"] {\n  margin-left: 10px;\n  padding:\
    \ 8px;\n  font-size: 16px;\n  background-color: #00b8d4;\n  color: white;\n  border:\
    \ none;\n  border-radius: 4px;\n  cursor: pointer;\n}\n```\n\n"
- fmt: "\n```css\n{\n  display: flex;\n  align-items: center;\n  padding: 8px;\n \
    \ border-radius: 4px;\n  margin-bottom: 8px;\n  background-color: #f1f1f1;\n}\n\
    \n#todo-list li.completed {\n  background-color: #ccc;\n  text-decoration: line-through;\n\
    }\n\n#todo-list li .task-title {\n  flex-grow: 1;\n  font-size: 16px;\n}\n\n#todo-list\
    \ li .delete-button {\n  margin-left: 10px;\n  font-size: 16px;\n  color: #ff6b6b;\n\
    \  cursor: pointer;\n}\n```\n\nFinally, we’ll write the JavaScript to add the\
    \ interactivity to the app. We’ll use the `addEventListener` method to attach\
    \ event listeners to the form and the delete buttons, and we’ll use DOM manipulation\
    \ methods to add, remove, and modify elements in the HTML.\n\n```javascript\n\
    // Get references to the form and list elements\nconst form = document.querySelector(\"\
    #add-task-form\");\nconst taskList = document.querySelector(\"#todo-list ul\"\
    );\n\n// Add a submit event listener to the form\nform.addEventListener(\"submit\"\
    , e => {\n  // Prevent the form from submitting\n  e.preventDefault();\n  // Get\
    \ the task title from the input element\n  const taskTitle = document.querySelector(\"\
    #task-title\").value;\n  // Create a new list item element\n  const taskItem =\
    \ document.createElement(\"li\");\n  // Add a class of \"completed\" if the task\
    \ is completed\n  taskItem.classList.add(\"completed\");\n  // Set the innerHTML\
    \ of the task item to the task title\n  taskItem.innerHTML = `\n    <span class=\"\
    task-title\">${taskTitle}</span>\n    <button class=\"delete-button\">Delete</button>\n\
    \  `;\n  // Append the task item to the task list\n  taskList.appendChild(taskItem);\n\
    \  // Clear the task title input\n  document.querySelector(\"#task-title\").value\
    \ = \"\";\n});\n\n// Add a click event listener to the task list\ntaskList.addEventListener(\"\
    click\", e => {\n  // Get the target element that was clicked\n  const target\
    \ = e.target;\n  // If the target is a delete button, delete the task\n  if (target.classList.contains(\"\
    delete-button\")) {\n    target.parentElement.remove();\n  }\n  // If the target\
    \ is the task title, toggle the completed class\n  if (target.classList.contains(\"\
    task-title\")) {\n    target.parentElement.classList.toggle(\"completed\");\n\
    \  }\n});\n```\n\nWith these HTML, CSS, and JavaScript pieces in place, we now\
    \ have a functioning to-do list app that allows users to add, remove, and mark\
    \ tasks as complete.\n\n# Working with Libraries and Frameworks (jQuery, React,\
    \ etc.)\n\nAs you continue to develop web applications with JavaScript, you may\
    \ find that you need to use libraries and frameworks to help streamline your development\
    \ process and add advanced features to your apps. In this chapter, we’ll explore\
    \ some of the most popular libraries and frameworks for JavaScript, including\
    \ jQuery, React, and Angular.\n\n## What are Libraries and Frameworks?\n\nA library\
    \ is a collection of pre-written code that provides utility functions and other\
    \ helpful tools for a specific purpose. A framework is a more comprehensive structure\
    \ that provides a set of conventions and guidelines for building applications.\
    \ Both libraries and frameworks can be used to save time and effort when developing\
    \ applications, but they differ in the level of abstraction and the amount of\
    \ control they provide.\n\n## jQuery\n\njQuery is a popular library that provides\
    \ a set of utility functions and methods for interacting with the DOM, making\
    \ HTTP requests, and animating elements. One of the main benefits of jQuery is\
    \ that it simplifies common JavaScript tasks and allows you to write shorter,\
    \ more concise code.\n\nTo use jQuery, you’ll need to include the jQuery library\
    \ in your HTML file. You can either download the library and include it locally,\
    \ or you can include it from a CDN (Content Delivery Network) by adding a `script`\
    \ tag to your HTML file.\n\n```html\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n```\n\nOnce the library is included, you can start using jQuery by\
    \ selecting elements from the DOM and applying functions and methods to them.\
    \ For example, to select all the `p` elements on a page and hide them, you can\
    \ use the `hide()` function:\n\n```javascript\n$(\"p\").hide();\n```\n\njQuery\
    \ also provides a set of events that you can use to respond to user actions such\
    \ as clicks, hovers, and form submissions. For example, to attach a click event\
    \ to a button, you can use the `click()` function:\n\n```javascript\n$(\"button\"\
    ).click(function() {\n  // code to execute when the button is clicked\n});\n```\n\
    \n## React\n\nReact is a JavaScript library for building user interfaces. It was\
    \ developed by Facebook and is now maintained by a community of developers. React\
    \ allows you to create reusable components that can be easily combined to build\
    \ complex applications.\n\nOne of the main benefits of React is that it uses a\
    \ virtual DOM (Document Object Model) to optimize updates to the actual DOM. This\
    \ means that when the state of a component changes, React will only update the\
    \ parts of the DOM that are necessary, rather than rebuilding the entire DOM tree.\
    \ This can greatly improve the performance of your application, especially when\
    \ working with large datasets or frequently changing data.\n\nTo use React, you’ll\
    \ need to include the React library in your HTML file and set up a build process\
    \ to compile your code. There are several ways to do this, but one popular method\
    \ is to use `create-react-app`, which sets up a development environment with Webpack,\
    \ Babel, and other tools.\n\nOnce you have React set up, you can start creating\
    \ components. A component is a piece of code that represents a part of the user\
    \ interface. Here’s an example of a component that displays a list:\n\n```javascript\n\
    import React from \"react\";\nclass List extends React.Component {\n  render()\
    \ {\n    return (\n      <ul>\n        <li>Item 1</li>\n        <li>Item 2</li>\n\
    \        <li>Item 3</li>\n      </ul>\n    );\n  }\n}\n```\n\nTo use the component,\
    \ you can include it in your HTML like this:\n\n```html\n<div id=\"root\"></div>\n\
    ```\n\nAnd you can render it to the root element using the `ReactDOM.render` method:\n\
    \n```javascript\nimport React from \"react\";\nimport ReactDOM from \"react-dom\"\
    ;\nimport List from \"./List\";\n\nReactDOM.render(<List />, document.getElementById(\"\
    root\"));\n```\n\nReact components can also have state and props (properties).\
    \ State is a way to manage data that can change within a component, and props\
    \ are a way to pass data from a parent component to a child component.\n\nFor\
    \ example, here’s a component that has a stateful value and a prop that controls\
    \ the color of the text:\n\n```javascript\nimport React from \"react\";\nclass\
    \ Counter extends React.Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = {\n      count: 0\n    };\n  }\n  render() {\n    return (\n\
    \      <div>\n        <p style={{ color: this.props.color }}>\n          The count\
    \ is {this.state.count}.\n        </p>\n        <button onClick={() => this.setState({\
    \ count: this.state.count + 1 })}>\n          Increment\n        </button>\n \
    \     </div>\n    );\n  }\n}\n```\n\nTo use the component, you can pass a value\
    \ for the `color` prop like this:\n\n```javascript\nReactDOM.render(<Counter color=\"\
    #00b8d4\" />, document.getElementById(\"root\"));\n```\n\n## Angular\n\nAngular\
    \ is a full-featured framework for building single-page applications. It provides\
    \ a set of conventions and tools for creating complex applications with a modular\
    \ architecture.\n\nAngular uses a component-based architecture, similar to React,\
    \ but it also provides additional features such as dependency injection, routing,\
    \ and a built-in HTTP client. It also has a templating syntax called HTML templates,\
    \ which allows you to define the structure of your components using HTML-like\
    \ syntax.\n\nTo use Angular, you’ll need to include the Angular library in your\
    \ HTML file and set up a build process to compile your code. You can use the Angular\
    \ CLI (Command Line Interface) tool to set up a development environment and create\
    \ a new Angular project.\n"
