  trans: "\n一旦你配置好了 Angular，就可以开始创建组件了。Angular 中的组件是一个类，它定义了视图元素的属性和行为。你可以使用 `@Component`\
    \ 装饰器来定义组件，并可以使用 `template` 或 `templateUrl` 属性来定义组件的 HTML 模板。\n\n这里有一个显示问候的简单组件示例：\n\
    \n```typescript\nimport { Component } from \"@angular/core\";\n\n@Component({\n\
    \  selector: \"app-greeting\",\n  template: `\n    <h1>Hello, World!</h1\n  `\n\
    })\nexport class GreetingComponent {\n  // 组件逻辑写在这里\n}\n```\n\n要使用该组件，你可以像这样将其包含在\
    \ HTML 文件中：\n\n```html\n<app-greeting></app-greeting>\n```\n\nAngular 组件还可以具有输入（inputs）和输出（outputs），这允许你在组件之间传递数据。例如，这里有一个组件，它有一个用于用户名的输入，以及在用户点击按钮时触发事件的输出：\n\
    \n```typescript\nimport { Component, Input, Output, EventEmitter } from \"@angular/core\"\
    ;\n\n@Component({\n  selector: \"app-user\",\n  template: `\n    <p>{{ userName\
    \ }}</p>\n    <button (click)=\"onClick()\">Click me</button>\n  `\n})\nexport\
    \ class UserComponent {\n  @Input() userName: string;\n  @Output() clicked = new\
    \ EventEmitter<void>();\n  onClick() {\n    this.clicked.emit();\n  }\n}\n```\n\
    \n要使用该组件，你可以这样绑定到 `userName` 输入并监听 `clicked` 输出：\n\n```html\n<app-user [userName]=\"\
    'John'\" (clicked)=\"handleClick()\"></app-user>\n```\n\nAngular 还提供了一个强大的路由系统，允许你为应用程序定义多个路由并在这些路由之间进行导航。你可以使用\
    \ `RouterModule` 和 `Routes` 数组来定义路由。\n\n例如，以下是你可以为应用程序定义两个路由的方法：\n\n```typescript\n\
    import { NgModule } from \"@angular/core\";\nimport { RouterModule, Routes } from\
    \ \"@angular/router\";\nimport { HomeComponent } from \"./home.component\";\n\
    import { AboutComponent } from \"./about.component\";\n\nconst routes: Routes\
    \ = [\n  { path: \"\", component: HomeComponent },\n  { path: \"about\", component:\
    \ AboutComponent }\n];\n\n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n\
    \  exports: [RouterModule]\n})\nexport class AppRoutingModule {}\n```\n\n然后你可以使用\
    \ `routerLink` 指令创建指向不同路由的链接，并使用 `router-outlet` 指令来定义当前路由的内容显示在哪里。\n\n```html\n\
    <nav>\n  <a routerLink=\"/\">首页</a>\n  <a routerLink=\"/about\">关于</a>\n</nav>\n\
    <router-outlet></router-outlet>\n```\n\n## 结论\n\n在使用 JavaScript 开发应用程序时，库和框架可以极地提高你的工作效率。它们提供了一系列工具和规范，可以帮助你编写更整洁、更易维护的代码，并更快地构建更复杂的应用程序。在本章中，我们探索了一些流行的库和框架，包括\
    \ jQuery、React 和 Angular。选择使用库还是框架取决于你的具体需求和偏好，但无论如何，你都能利用这些工具提供的强大功能。\n\n## 练习题\n\
    \n为了复这些概念，我们将通过一系列练习，旨在测试你的理解并应用你所学的知识。\n\n1. 编写一个 jQuery 函数，选择页面上所有的 `p` 元素，并在点击按钮时切换它们的可见性。\n\
    2. 编写一个 React 组件，显示一个包含两个输入字段（邮箱和密码）和一个提交按钮的表单。当表单提交时，显示一个包含输入字段值的警报框。\n3. 编写一个\
    \ Angular 组件，显示用户列表，每个用户都有名称和头像。该组件应该有一个用于用户列表的输入以及一个在用户被点击时触发事件的输出。\n4. 编写一个\
    \ jQuery 函数，向 REST API 发起 AJAX 请求并在表格中显示结果。\n5. 编写一个 React 组件，使用 `useEffect` 钩子从\
    \ REST API 获取数据并显示在列表中。\n\n## 答案\n\n### 编写一个 jQuery 函数，选择页面上所有的 `p` 元素，并在点击按钮时切换它们的可见性。\n\
    \n```javascript\n$(document).ready(function() {\n  $(\"button\").click(function()\
    \ {\n    $(\"p\").toggle();\n  });\n});\n```\n\n### 编写一个 React 组件，显示一个包含两个输入字段（邮箱和密码）和一个提交按钮的表单。当表单提交时，显示一个包含输入字段值的警报框。\n\
    \n```javascript\nimport React from \"react\";\n\nclass Form extends React.Component\
    \ {\n  handleSubmit(event) {\n    event.preventDefault();\n    const email = event.target.elements.email.value;\n\
    \    const password = event.target.elements.password.value;\n    alert(`Email:\
    \ ${email} Password: ${password}`);\n  }\n  render() {\n    return (\n      <form\
    \ onSubmit={this.handleSubmit}>\n        <label>\n          Email:\n         \
    \ <input type=\"email\" name=\"email\" />\n        </label>\n        <br />\n\
    \        <label>\n          Password:\n          <input type=\"password\" name=\"\
    password\" />\n        </label>\n        <br>\n        <button type=\"submit\"\
    >Submit</button>\n      </form>\n    );\n  }\n}\n```\n\n### 编写一个 Angular 组件，显示用户列表，每个用户都有名称和头像。该组件应该有一个用于用户列表的输入以及一个在用户被点击时触发事件的输出。\n\
    \n```typescript\nimport { Component, Input, Output, EventEmitter } from \"@angular/core\"\
    ;\n\n@Component({\n  selector: \"app-user-list\",\n  template: `\n    <ul>\n \
    \     <li *ngFor=\"let user of users\" (click)=\"handleClick(user)\">\n      \
    \  {{ user.name }}\n        <img [src]=\"user.avatarUrl\" [alt]=\"user.name\"\
    \ />\n      </li>\n    </ul>\n  `\n})\nexport class UserListComponent {\n  @Input()\
    \ users: any[];\n  @Output() userClicked = new EventEmitter<any>();\n  handleClick(user)\
    \ {\n    this.userClicked.emit(user);\n  }\n}\n```\n\n### 编写一个 jQuery 函数，向 REST\
    \ API 发起 AJAX 请求并在表格中显示结果。\n\n```javascript\n$(document).ready(function() {\n\
    \  $.ajax({\n    url: \"https://api.example.com/users\",\n    success: function(result)\
    \ {\n      const table = $(\"<table>\");\n      result.forEach(function(user)\
    \ {\n        const row = $(\"<tr>\");\n        row.append(`<td>${user.name}</td>`);\n\
    \        row.append(`<td>${user.email}</td>`);\n        table.append(row);\n \
    \     });\n      $(\"#result\").append(table);\n    }\n  });\n});\n```\n\n###\
    \ 编写一个 React 组件，使用 `useEffect` 钩子从 REST API 获取数据并显示在列表中。\n\n```javascript\nimport\
    \ React, { useEffect, useState } from \"react\";\n\nfunction UserList() {\n  const\
    \ [users, setUsers] = useState([]);\n  useEffect(() => {\n    fetch(\"https://api.example.com/users\"\
    )\n      .then(response => response.json())\n      .then(result => setUsers(result));\n\
    \  }, []);\n  return (\n    <ul>\n      {users.map(user => (\n        <li key={user.id}>{user.name}</li>\n\
    \      ))}\n    </ul>\n  );\n}\n```\n\n## 调试和排查 JavaScript 代码\n\n除了调试，还有许多其他技术可以用于排查你的\
    \ JavaScript 代码。\n\n### 测试你的代码\n\n测试代码是开发过程中至关重要的部分。它可以帮助你确保代码是正确的并在不同的条件下按预期工作。可以使用多种类型的测试来验证你的代码，包括单元测试、集成测试和验收测试。\n\
    \n单元测试是小的、隔离的测试，用于验证特定的代码段（例如函数或模块）。它们通常运行速度很快，允许你隔离地测试单个组件。\n\n集成测试是验证多个组件之间相互作用的测试。它们运行速度通常比单元测试慢，并且需要更多的设置和配置。\n\
    \n验收测试是从用户的角度验证代码整体功能性的测试。它们可能涉及模拟用户输入并验证产生预期的输出。\n\n"
- fmt: "\nTo create tests for your JavaScript code, you can use a testing framework\
    \ such as Jest or Mocha. These frameworks provide tools and conventions for writing\
    \ and running tests and generating test reports.\n\n## Debugging Asynchronous\
    \ Code\n\nAsynchronous code is code that executes concurrently with the rest of\
    \ your program. JavaScript uses an event-driven, single-threaded model to handle\
    \ asynchronous code, which means that asynchronous code is executed in a separate\
    \ execution context and can be triggered by events such as user input, timers,\
    \ or network requests.\n\nDebugging asynchronous code can be challenging because\
    \ the order in which the code is executed may not be obvious. To debug asynchronous\
    \ code, you can use the browser’s developer console to view the call stack and\
    \ set breakpoints. You can also use the `console.log` function to output intermediate\
    \ values and trace the execution of your code.\n\n## Handling Errors\n\nErrors\
    \ are inevitable in software development, and it’s important to handle them gracefully\
    \ in your code. JavaScript provides several mechanisms for handling errors, including\
    \ the `try` and `catch` statements and the `throw` statement.\n\nThe `try` and\
    \ `catch` statements allow you to catch and handle exceptions that are thrown\
    \ by your code. The `try` block contains the code that may throw an exception,\
    \ and the `catch` block contains the code that will be executed if an exception\
    \ is thrown.\n\n```javascript\ntry {\n // code that may throw an exception\n}\
    \ catch (error) {\n // code to handle the exception\n}\n```\n\nThe `throw` statement\
    \ allows you to throw an exception manually. This can be useful for signaling\
    \ an error condition or for controlling the flow of your code.\n\n```javascript\n\
    if (x > 100) {\n  throw new Error(\"x is too big!\");\n}\n```\n\nWhen handling\
    \ errors, it’s important to choose the appropriate level of granularity. You should\
    \ try to catch specific errors that you can handle and let other errors propagate\
    \ up the call stack. You should also consider whether the error is recoverable\
    \ or whether the program should terminate.\n\n## Debugging Third-Party Code\n\n\
    Sometimes you may encounter errors in third-party code, such as a library or a\
    \ framework. Debugging third-party code can be challenging because you may not\
    \ have access to the source code or documentation.\n\nTo debug third-party code,\
    \ you can try the following techniques:\n\n* Use the browser’s developer console\
    \ to inspect the state of your variables and the call stack.\n* Use the `console.log`\
    \ function to output intermediate values and trace the execution of the code.\n\
    * Use breakpoints to pause the execution of the code and inspect the state.\n\
    * Search online for documentation or solutions to common issues.\n* Reach out\
    \ to the maintainers of the code and ask for help.\n\n## Conclusion\n\nDebugging\
    \ and troubleshooting are important skills in software development. By using the\
    \ tools and techniques discussed in this chapter, you can identify and fix issues\
    \ in your JavaScript code and improve the quality and reliability of your code.\n\
    \n## Exercises\n\nTo review these concepts, we will go through a series of exercises\
    \ designed to test your understanding and apply what you have learned.\n\n1. Write\
    \ a function `sum` that takes in two numbers as arguments and returns their sum.\
    \ Use the `console.log` function to output the intermediate values of the variables\
    \ and the final result.\n2. Write a function `divide` that takes in two numbers\
    \ as arguments and returns their quotient. Use the `try` and `catch` statements\
    \ to handle the case where the second argument is 0. Use the `console.error` function\
    \ to output the error message.\n3. Write a function `parseInt` that takes in a\
    \ string and returns the integer value of the string. Use the `console.log` function\
    \ to output the intermediate values of the variables and the final result.\n4.\
    \ Write a function `sortArray` that takes in an array of numbers and returns a\
    \ new array with the numbers sorted in ascending order. Use the `console.log`\
    \ function to output the intermediate values of the variables and the final result.\n\
    5. Write a function `fetchData` that takes in a URL and returns a promise that\
    \ resolves with the data from the URL. Use the `console.log` function to output\
    \ the intermediate values of the variables and the final result.\n\n## Solutions\n\
    \nWrite a function `sum` that takes in two numbers as arguments and returns their\
    \ sum. Use the `console.log` function to output the intermediate values of the\
    \ variables and the final result.\n\n```javascript\nfunction sum(a, b) {\n  console.log(`a:\
    \ ${a}, b: ${b}`);\n  const result = a + b;\n  console.log(`result: ${result}`);\n\
    \  return result;\n}\n\nconsole.log(sum(1, 2));  // output: 3\nconsole.log(sum(5,\
    \ 7));  // output: 12\n```\n\nWrite a function `divide` that takes in two numbers\
    \ as arguments and returns their quotient. Use the `try` and `catch` statements\
    \ to handle the case where the second argument is 0. Use the `console.error` function\
    \ to output the error message.\n\n```javascript\nfunction divide(a, b) {\n  try\
    \ {\n    if (b === 0) {\n      throw new Error(\"Cannot divide by 0\");\n    }\n\
    \    return a / b;\n  } catch (error) {\n    console.error(error);\n  }\n}\n\n\
    console.log(divide(4, 2));  // output: 2\nconsole.log(divide(4, 0));  // output:\
    \ \"Cannot divide by 0\"\n```\n\nWrite a function `parseInt` that takes in a string\
    \ and returns the integer value of the string. Use the `console.log` function\
    \ to output the intermediate values of the variables and the final result.\n\n\
    ```javascript\nfunction parseInt(str) {\n  console.log(`str: ${str}`);\n  const\
    \ result = Number.parseInt(str, 10);\n  console.log(`result: ${result}`);\n  return\
    \ result;\n}\n\nconsole.log(parseInt(\"123\"));  // output: 123\nconsole.log(parseInt(\"\
    hello\"));  // output: NaN\n```\n\nWrite a function `sortArray` that takes in\
    \ an array of numbers and returns a new array with the numbers sorted in ascending\
    \ order. Use the `console.log` function to output the intermediate values of the\
    \ variables and the final result.\n\n```javascript\nfunction sortArray(arr) {\n\
    \  console.log(`arr: ${arr}`);\n  const result = arr.sort((a, b) => a - b);\n\
    \  console.log(`result: ${result}`);\n  return result;\n}\n\nconsole.log(sortArray([5,\
    \ 3, 1, 4, 2]));  // output: [1, 2, 3, 4, 5]\nconsole.log(sortArray([100, 50,\
    \ 0, 25, 75]));  // output: [0, 25, 50, 75, 100]\n```\n\nWrite a function `fetchData`\
    \ that takes in a URL and returns a promise that resolves with the data from the\
    \ URL. Use the `console.log` function to output the intermediate values of the\
    \ variables and the final result.\n\n```javascript\nfunction fetchData(url) {\n\
    \  console.log(`url: ${url}`);\n  return fetch(url)\n    .then(response => response.json());\n\
    }\n```\n\n## Thank You\n\nThank you again for choosing \"Learn JavaScript\". I\
    \ hope it helps you in your journey to learn JavaScript and achieve your goals.\
    \ Please take a small portion of your time and share this with your friends and\
    \ family and write a review for this book. I hope your programming journey does\
    \ not end here. If you are interested, check out other books that I have or find\
    \ more coding challenges at: https://codeofcode.org\n"
