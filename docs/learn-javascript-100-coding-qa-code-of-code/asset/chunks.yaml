  trans: "\n面向对象编程（OOP）是一种基于“对象”的编程范式，对象可以包含数据和功能。OOP 的设计旨在更容易创建和维护复杂的软件系统。\n\n在 JavaScript\
    \ 中，你可以通过定义“类”（classes）来使用面向对象编程，类作为创建对象“实例”（instances）的模板。类使用 `class` 关键字定义，后面紧跟类名以及一组包含类属性和方法的大括号。\n\
    \n以下是在 JavaScript 中定义类的一个示例：\n\n```javascript\nclass Person {\n  constructor(name,\
    \ age, occupation) {\n    this.name = name;\n    this.age = age;\n    this.occupation\
    \ = occupation;\n  }\n  greet() {\n    console.log(\"Hello, my name is \" + this.name\
    \ + \" and I am a \" + this.occupation + \".\");\n  }\n}\n```\n\n要创建一个对象的实例，你使用\
    \ `new` 运算符，后面紧跟类名和一组包含构造函数参数的括号。\n\n以下是在 JavaScript 中创建对象实例的一个示例：\n\n```javascript\n\
    var john = new Person(\"John\", 30, \"developer\");\n```\n\n然后你可以使用点符号符号访问对象的属性和方法：\n\
    \n```javascript\nconsole.log(john.name);  // logs \"John\"\nconsole.log(john.age);\
    \  // logs 30\nconsole.log(john.occupation);  // logs \"\njohn.greet();\n// logs\
    \ \"Hello, my name is John and I am a developer.\"\n```\n\n## 继承\n\n在 OOP 中，你可以使用继承来创建一个“子”类，该类从“父”类派生属性和方法。这允许你重用代码并避免重复编写。\n\
    \n在 JavaScript 中，你可以通过 `extends` 关键字来使用继承，创建一个扩展父类的子类。子类可以根据需要覆盖或添加额外的属性和方法。\n\
    \n以下是在 JavaScript 中使用继承的示例：\n\n```javascript\nclass Employee extends Person {\n\
    \  constructor(name, age, occupation, company) {\n    super(name, age, occupation);\n\
    \    this.company = company;\n  }\n  work() {\n    console.log(\"I am working\
    \ at \" + this.company + \".\");\n  }\n}\n```\n\n```javascript\nvar jane = new\
    \ Employee(\"Jane\", 32, \"developer\", \"Acme Inc.\");\nconsole.log(jane.name);\
    \  // logs \"Jane\"\nconsole.log(jane.age);  // logs 32\nconsole.log(jane.occupation);\
    \  // logs \"developer\"\nconsole.log(jane.company);  // logs \"Acme Inc.\"\n\
    jane.greet();  // logs \"Hello, my name is Jane and I am a developer.\"\njane.work();\
    \  // logs \"I am working at Acme Inc.\"\n```\n\n在这个示例中，`Employee` 类扩展了 `Person`\
    \ 类，并添加了新的公司属性和一个新的工作方法。`Employee` 类还重写了构造函数方法以包含公司参数，并调用了 `super` 函数来访问父类的构造函数方法。\n\
    \n## 结论\n\n对象和面向对象编程是 JavaScript 中强大的工具。通过理解如何创建和操作对象，以及如何使用继承，你将拥有在 JavaScript\
    \ 中创建复杂且可扩展软件系统的技能。\n\n## 练习\n\n为了复习这些概念，我们将通过一系列练习，旨在测试你的理解并应用所学知识。\n\n1. 定义一个表示书的对象，包括标题、作者和页数。\n\
    2. 修改练习 1 中定义的对象，包含一个 `read` 属性，这是一个布尔值，表示书是否已阅读。\n3. 定义一个表示人的类，包括人的姓名、年龄和职业。为类添加一个方法，在控制台中打印问候语。\n\
    4. 创建练习 3 中定义的类的实例，并调用 `greet` 方法。\n5. 定义一个表示员工的类，它扩展了练习 3 中定义的类类。在员工类中添加一个方法，打印员工所属的公司。\n\
    \n## 答案\n\n1. 定义一个表示书的对象，包括标题、作者和页数。\n\n```javascript\nvar book = {\n  title:\
    \ \"The Great Gatsby\",\n  author: \"F. Scott Fitzgerald\",\n  pages: 180\n};\n\
    ```\n\n2. 修改练习 1 中定义的对象，包含一个 `read` 属性，这是一个布尔值，表示书是否已阅读。\n\n```javascript\nbook.read\
    \ = false;\n```\n\n3. 定义一个表示人的类，包括人的姓名、年龄和职业。为类添加一个方法，在控制台中打印问候语。\n\n```javascript\n\
    class Person {\n  constructor(name, age, occupation) {\n    this.name = name;\n\
    \    this.age = age;\n    this.occupation = occupation;\n  }\n  greet() {\n  \
    \  console.log(\"Hello, my name is \" + this.name + \" and I am a \" + this.occupation\
    \ + \".\");\n  }\n}\n```\n\n4. 创建练习 3 中定义的类的实例，并调用 `greet` 方法。\n\n```javascript\n\
    var john = new Person(\"John\", 30, \"developer\");\njohn.greet();\n```\n\n5.\
    \ 定义一个表示员工的类，它扩展了练习 3 中定义的类。在员工类中添加一个方法，打印员工所属的公司。\n\n```javascript\nclass Employee\
    \ extends Person {\n  constructor(name, age, occupation, company) {\n    super(name,\
    \ age, occupation);\n    this.company = company;\n  }\n  work() {\n    console.log(\"\
    I am working at \" + this.company + \".\");\n  }\n}\n```\n\n"
- fmt: "\n# Manipulating HTML Elements with JavaScript\n\nJavaScript allows you to\
    \ manipulate HTML elements and change the content, attributes, and styles of a\
    \ web page. This enables you to create dynamic and interactive web pages that\
    \ can respond to user input and changing data.\n\nIn this article, we’ll go over\
    \ the different ways you can manipulate HTML elements with JavaScript, including\
    \ using the Document Object Model (DOM), working with HTML forms, and creating\
    \ and modifying CSS styles.\n\n## The Document Object Model (DOM)\n\nThe Document\
    \ Object Model (DOM) is a programming interface for HTML and XML documents. It\
    \ represents the structure of a document as a tree of objects, with each object\
    \ representing an element in the document.\n\nYou can use the DOM to access and\
    \ modify HTML elements in JavaScript. This is done by using the `document` object\
    \ and various methods and properties, such as `getElementById`, `getElementsByTagName`,\
    \ and `querySelector`.\n\nHere’s an example of how to use the DOM to change the\
    \ content of an element:\n\n```javascript\nvar header = document.getElementById(\"\
    header\");\nheader.innerHTML = \"Welcome to My New Page\";\n```\n\nAnd here’s\
    \ an example of how to use the DOM to change the attributes of an element:\n\n\
    ```javascript\nheader.setAttribute(\"class\", \"new-class\");\n```\n\n## Working\
    \ with HTML Forms\n\nHTML forms allow you to gather user input and send it to\
    \ a server. You can use JavaScript to access and manipulate form elements, such\
    \ as text fields, radio buttons, and select lists.\n\nTo access a form element\
    \ in JavaScript, you can use the `document.getElementById` method. Here’s an example\
    \ of how to access a text field in a form:\n\n```javascript\nvar textField = document.getElementById(\"\
    text-field\");\n```\n\nYou can then use various methods and properties to manipulate\
    \ the form element. For example, you can use the `value` property to get or set\
    \ the value of a text field:\n\n```javascript\ntextField.value = \"Hello World!\"\
    ;\n```\n\nYou can also use the `checked` property to get or set the checked state\
    \ of a radio button or checkbox:\n\n```javascript\nvar radioButton = document.getElementById(\"\
    radio-button\");\nradioButton.checked = true;\n```\n\n## Creating and Modifying\
    \ CSS Styles\n\nYou can use JavaScript to create and modify CSS styles for elements.\
    \ This allows you to change the appearance of a web page in response to user input\
    \ or changing data.\n\nTo modify the attributes of an element, you can use the\
    \ `setAttribute` method. Here’s an example of how to use `setAttribute`:\n\n```javascript\n\
    header.setAttribute(\"class\", \"new-class\");\n```\n\nYou can also use the `style`\
    \ property to modify the CSS styles of an element. Here’s an example of how to\
    \ use the `style` property:\n\n```javascript\nheader.style.color = \"red\";\n\
    ```\n\n## Adding and Removing DOM Elements\n\nThe DOM allows you to add and remove\
    \ elements from the document using various methods.\n\nTo add an element to the\
    \ document, you can use the `createElement` method to create a new element and\
    \ the `appendChild` method to append the element to an existing element. Here’s\
    \ an example of how to add an element to the document:\n\n```javascript\nvar newParagraph\
    \ = document.createElement(\"p\");\nnewParagraph.innerHTML = \"This is a new paragraph.\"\
    ;\ndocument.body.appendChild(newParagraph);\n```\n\nTo remove an element from\
    \ the document, you can use the `removeChild` method. Here’s an example of how\
    \ to remove an element from the document:\n\n```javascript\ndocument.body.removeChild(newParagraph);\n\
    ```\n\n## Conclusion\n\nThe DOM is an essential part of JavaScript and enables\
    \ you to create dynamic and interactive web pages. By understanding how to access\
    \ and modify DOM elements, you’ll have the skills you need to create powerful\
    \ and engaging web applications.\n\n## Exercises\n\nTo review these concepts,\
    \ we will go through a series of exercises designed to test your understanding\
    \ and apply what you have learned.\n\n1. Use the `document.getElementById` method\
    \ to access the element with the `id` “header” and change its `innerHTML` to “Welcome\
    \ to My New Page”.\n2. Use the `document.getElementsByTagName` method to access\
    \ all the `p` elements in the document and change their `innerHTML` to “This is\
    \ a new paragraph.”\n3. Use the `document.createElement` and `appendChild` methods\
    \ to add a new `p` element to the end of the `body` element.\n4. Use the `document.querySelector`\
    \ method to access the element with the class“highlighted” and change its `style.color`\
    \ to “red”.\n5. Use the `removeChild` method to remove the element created in\
    \ exercise 3 from the `bodyelement`.\n\n## Solutions\n\n1. Use the `document.getElementById`\
    \ method to access the element with the `id` “header” and change its `innerHTML`\
    \ to “Welcome to My New Page”.\n```javascript\nvar header = document.getElementById(\"\
    header\");\nheader.innerHTML = \"Welcome to My New Page\";\n```\n\n2. Use the\
    \ `document.getElementsByTagName` method to access all the `p` elements in the\
    \ document and change their `innerHTML` to “This is a new paragraph.”\n```javascript\n\
    var paragraphs = document.getElementsByTagName(\"p\");\nfor (var i = 0; i < paragraphs.length;\
    \ i++) {\n  paragraphs[i].innerHTML = \"This is a new paragraph.\";\n}\n```\n\n\
    3. Use the `document.createElement` and `appendChild` methods to add a new `p`\
    \ element to the end of the `body` element.\n```javascript\nvar newParagraph =\
    \ document.createElement(\"p\");\nnewParagraph.innerHTML = \"This is a new paragraph.\"\
    ;\ndocument.body.appendChild(newParagraph);\n```\n\n4. Use the `document.querySelector`\
    \ method to access the element with the class“highlighted” and change its `style.color`\
    \ to “red”.\n```javascript\nvar highlighted = document.querySelector(\".highlighted\"\
    );\nhighlighted.style.color = \"red\";\n```\n\n5. Use the `removeChild` method\
    \ to remove the element created in exercise 3 from the `bodyelement`.\n```javascript\n\
    document.body.removeChild(newParagraph);\n```\n"
