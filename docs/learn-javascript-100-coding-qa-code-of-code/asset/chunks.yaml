    \ third-party code, you can try the following techniques:\n\n*   Use the browser’s\
    \ developer console to inspect the state of your variables and the call stack.\n\
    \n*   Use the console.log function to output intermediate values and trace the\
    \ execution of the code.\n\n*   Use breakpoints to pause the execution of the\
    \ code and inspect the state.\n\n*   Search online for documentation or solutions\
    \ to common issues.\n\n*   Reach out to the maintainers of the code and ask for\
    \ help.\n\nConclusion\n\nDebugging and troubleshooting are important skills in\
    \ software development. By using the tools and techniques discussed in this chapter,\
    \ you can identify and fix issues in your JavaScript code and improve the quality\
    \ and reliability of your code.\n\nExercises\n\nTo review these concepts, we will\
    \ go through a series of exercises designed to test your understanding and apply\
    \ what you have learned.\n\nWrite a function sum that takes in two numbers as\
    \ arguments and returns their sum. Use the console.log function to output the\
    \ intermediate values of the variables and the final result.\n\nWrite a function divide that\
    \ takes in two numbers as arguments and returns their quotient. Use the try and catch statements\
    \ to handle the case where the second argument is 0\\. Use the console.error function\
    \ to output the error message.\n\nWrite a function parseInt that takes in a string\
    \ and returns the integer value of the string. Use the console.log function to\
    \ output the intermediate values of the variables and the final result.\n\nWrite\
    \ a function sortArray that takes in an array of numbers and returns a new array\
    \ with the numbers sorted in ascending order. Use the console.log function to\
    \ output the intermediate values of the variables and the final result.\n\nWrite\
    \ a function fetchData that takes in a URL and returns a promise that resolves\
    \ with the data from the URL. Use the console.log function to output the intermediate\
    \ values of the variables and the final result.\n\nSolutions\n\nWrite a function sum that\
    \ takes in two numbers as arguments and returns their sum. Use the console.log function\
    \ to output the intermediate values of the variables and the final result.\n\n\
    function  sum(a, b)  {\n\n  console.log(`a: ${a}, b: ${b}`);\n\n const result\
    \ = a + b;\n\n  console.log(`result: ${result}`);\n\n return result;\n\n}\n\n\
    console.log(sum(1,  2));  // output: 3\n\nconsole.log(sum(5,  7));  // output:\
    \ 12\n\nWrite a function divide that takes in two numbers as arguments and returns\
    \ their quotient. Use the try and catch statements to handle the case where the\
    \ second argument is 0\\. Use the console.error function to output the error message.\n\
    \nfunction  divide(a, b)  {\n\n try  {\n\n    if  (b ===  0)  {\n\n      throw\
    \  new Error(\"Cannot divide by 0\");\n\n    }\n\n    return a / b;\n\n }  catch\
    \  (error)  {\n\n    console.error(error);\n\n  }\n\n}\n\nconsole.log(divide(4,\
    \  2));  // output: 2\n\nconsole.log(divide(4,  0));  // output: \"Cannot divide\
    \ by 0\"\n\nWrite a function parseInt that takes in a string and returns the integer\
    \ value of the string. Use the console.log function to output the intermediate\
    \ values of the variables and the final result.\n\nfunction  parseInt(str)  {\n\
    \n  console.log(`str: ${str}`);\n\n const result = Number.parseInt(str,  10);\n\
    \n  console.log(`result: ${result}`);\n\n return result;\n\n}\n\nconsole.log(parseInt(\"\
    123\"));  // output: 123\n\nconsole.log(parseInt(\"hello\"));  // output: NaN\n\
    \nWrite a function sortArray that takes in an array of numbers and returns a new\
    \ array with the numbers sorted in ascending order. Use the console.log function\
    \ to output the intermediate values of the variables and the final result.\n\n\
    function  sortArray(arr)  {\n\n  console.log(`arr: ${arr}`);\n\n const result\
    \ = arr.sort((a, b)  => a - b);\n\n  console.log(`result: ${result}`);\n\n return\
    \ result;\n\n}\n\nconsole.log(sortArray([5,  3,  1,  4,  2]));  // output: [1,\
    \ 2, 3, 4, 5]\n\nconsole.log(sortArray([100,  50,  0,  25,  75]));  // output:\
    \ [0, 25, 50, 75, 100]\n\nWrite a function fetchData that takes in a URL and returns\
    \ a promise that resolves with the data from the URL. Use the console.log function\
    \ to output the intermediate values of the variables and the final result.\n\n\
    function  fetchData(url)  {\n\n  console.log(`url: ${url}`);\n\n return  fetch(url)\n\
    \n    .then(response => response.json())\n\nThank You\n\nThank you again for choosing\
    \ \"Learn JavaScript\". I hope it helps you in your journey to learn JavaScript\
    \ and achieve your goals. Please take a small portion of your time and share this\
    \ with your friends and family and write a review for this book. I hope your programming\
    \ journey does not end here. If you are interested, check out other books that\
    \ I have or find more coding challenges at: https://codeofcode.org"
