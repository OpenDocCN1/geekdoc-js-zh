  trans: "\n\n为你的 JavaScript 代码创建测试，你可以使用如 Jest 或 Mocha 等测试框架。这些框架为编写、运行测试以及生成测试报告提供了工具和规范。\n\
    \n## 调试异步代码\n\n异步代码是指与程序其他部分并发执行的代码。JavaScript 使用事件驱动的单线程模型来处理异步代码，这意味着异步代码在独立的执行上下文中执行，并可以通过用户输入、定时器或网络请求等事件触发。\n\
    \n调试异步代码可能具有挑战性，因为代码执行的顺序可能并不明显。要调试异步代码，你可以使用浏览器的开发者控制台查看调用栈并设置断点。你还可以使用 `console.log`\
    \ 函数输出中间值并追踪代码的执行情况。\n\n## 处理错误\n\n在软件开发中，错误是不可避免的，在代码中优雅地处理错误非常重要。JavaScript\
    \ 提供了几种处理错误的机制，包括 `try` 和 `catch` 语句以及 `throw` 语句。\n\n`try` 和 `catch` 语句允许你捕获并处理代码抛出的异常。`try`\
    \ 包含可能抛出异常的代码，而 `catch` 块包含在抛出异常时执行的代码。\n\n```javascript\ntry {\n // 可能会抛出异常的代码\n\
    } catch (error) {\n // 处理异常的代码\n}\n```\n\n`throw` 语句允许你手动抛出异常。这对于信号错误条件或控制代码执行流非常有用。\n\
    \n```javascript\nif (x > 100) {\n  throw new Error(\"x is too big!\");\n}\n```\n\
    \n在处理错误时，选择合适的粒度非常重要。你应该尝试捕获你可以处理的特定错误，让其他错误向上调用栈传播。你还应该考虑错误是否是可以恢复的，或者程序是否应该终止。\n\
    \n## 调试第三方代码\n\n有时你可能会在第三方代码（如库或框架）中遇到错误。调试第三方代码可能很有挑战，因为你可能无法访问源代码或文档。\n\n要调试第三方代码，你可以尝试以下技术：\n\
    \n* 使用浏览器的开发者控制台检查变量状态和调用栈。\n* 使用 `console.log` 函数输出中间值并追踪代码执行。\n* 使用断点暂停代码执行并检查状态。\n\
    * 在网上搜索常见问题的文档或解决方案。\n* 联系代码的维护者并寻求帮助。\n\n## 结论\n\n调试和故障排除是软件开发中的重要技能。通过使用本章讨论的工具和技术，你可以识别并修复\
    \ JavaScript 代码中的问题，并提高代码的质量和可靠性。\n\n## 练习\n\n为了复习这些概念，我们将完成一系列练习，旨在测试你的理解并应用你所学的知识。\n\
    \n1. 编写函数 `sum`，它接收两个数字作为参数并返回它们的和。使用 `console.log` 函数输出变量的中间值和最终结果。\n2. 编写函数\
    \ `divide`，接收两个数字作为参数并返回它们的商。使用 `try` 和 `catch` 语句处理第二个参数为 0 的情况。使用 `console.error`\
    \ 函数输出错误信息。\n3. 编写函数 `parseInt`，接收一个字符串并返回字符串的整数值。使用 `console.log` 函数输出变量的中间值和最终结果。\n\
    4. 编写函数 `sortArray`，接收一个数字数组并返回一个按升序排列的新数组。使用 `console.log` 函数输出变量的中间值和最终结果。\n\
    5. 编写函数 `fetchData`，接收一个 URL 并返回一个解析为 URL 数据的 promise。使用 `console.log` 函数输出变量的中间值和最终结果。\n\
    \n## 解决方案\n\n编写函数 `sum`，接收两个数字作为参数并返回它们的和。使用 `console.log` 函数输出变量的中间值和最终结果。\n\n\
    ```javascript\nfunction sum(a, b) {\n  console.log(`a: ${a}, b: ${b}`);\n  const\
    \ result = a + b;\n  console.log(`result: ${result}`);\n  return result;\n}\n\n\
    console.log(sum(1, 2));  // 输出: 3\nconsole.log(sum(5, 7));  // 输出: 12\n```\n\n\
    编写函数 `divide`，接收两个数字作为参数并返回它们的商。使用 `try` 和 `catch` 语句处理第二个参数为 0 的情况。使用 `console.error`\
    \ 函数输出错误信息。\n\n```javascript\nfunction divide(a, b) {\n  try {\n    if (b ===\
    \ 0) {\n      throw new Error(\"Cannot divide by 0\");\n    }\n    return a /\
    \ b;\n  } catch (error) {\n    console.error(error);\n  }\n}\n\nconsole.log(divide(4,\
    \ 2));  // 输出: 2\nconsole.log(divide(4, 0));  // 输出: \"Cannot divide by 0\"\n\
    ```\n\n编写函数 `parseInt`，接收一个字符串并返回字符串的整数值。使用 `console.log` 函数输出变量的中间值和最终结果。\n\n\
    ```javascript\nfunction parseInt(str) {\n  console.log(`str: ${str}`);\n  const\
    \ result = Number.parseInt(str, 10);\n  console.log(`result: ${result}`);\n  return\
    \ result;\n}\n\nconsole.log(parseInt(\"123\"));  // 输出: 123\nconsole.log(parseInt(\"\
    hello\"));  // 输出: NaN\n```\n\n编写函数 `sortArray`，接收一个数字数组并返回一个按升序排列的新数组。使用 `console.log`\
    \ 函数输出变量的中间值和最终结果。\n\n```javascript\nfunction sortArray(arr) {\n  console.log(`arr:\
    \ ${arr}`);\n  const result = arr.sort((a, b) => a - b);\n  console.log(`result:\
    \ ${result}`);\n  return result;\n}\n\nconsole.log(sortArray([5, 3, 1, 4, 2]));\
    \  // 输出: [1, 2, 3, 4, 5]\nconsole.log(sortArray([100, 50, 0, 25, 75]));  // 输出:\
    \ [0, 25, 50, 75, 100]\n```\n\n编写函数 `fetchData`，接收一个 URL 并返回一个解析为 URL 数据的 promise。使用\
    \ `console.log` 函数输出变量的中间值和最终结果。\n\n```javascript\nfunction fetchData(url) {\n\
    \  console.log(`url: ${url}`);\n  return fetch(url)\n    .then(response => response.json());\n\
    }\n```\n\n## 感谢\n\n再次感谢选择《Learn JavaScript》。希望它能帮助你学习 JavaScript 的旅程并实现你的目标。请花一点时间与你的亲友分享，并为这本书写评论。我希望你的编程之旅不会此结束。如果你感兴趣，可以查看我写的其他书籍，或在以下处找到更多编程挑战：https://codeofcode.org\n\
    \n"
