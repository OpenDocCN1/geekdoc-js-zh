    Working with Arrays and Collections\n\nArrays and collections are data structures\
    \ that allow you to store and manipulate a group of values. They are an essential\
    \ part of JavaScript programming and can be used to store a wide variety of data\
    \ types, including numbers, strings, objects, and more.\n\nIn this article, we’ll\
    \ go over the basics of arrays and collections in JavaScript and how to use them\
    \ to store and manipulate data.\n\nArrays\n\nAn array is an ordered collection\
    \ of values. You can create an array in JavaScript by enclosing a comma-separated\
    \ list of values in square brackets []. Here’s an example of how to create an\
    \ array of numbers:\n\nvar numbers =  [1,  2,  3,  4,  5];\n\nYou can access the\
    \ values in an array by using the array’s index. Array indices start at 0, so\
    \ to access the first element of an array, you would use the index 0\\. Here’s\
    \ an example of how to access the first element of an array:\n\nvar firstElement\
    \ = numbers[0];\n\n// firstElement is 1\n\nYou can also use the length property\
    \ to get the number of elements in an array:\n\nvar numberOfElements = numbers.length;\n\
    \n// numberOfElements is 5\n\nModifying Arrays\n\nYou can use various methods\
    \ to modify the values in an array. Here are a few examples:\n\n*   The push method\
    \ adds an element to the end of an array:\n\nnumbers.push(6);\n\n// numbers is\
    \ now [1, 2, 3, 4, 5, 6]\n\n*   The unshift method adds an element to the beginning\
    \ of an array:\n\nnumbers.unshift(0);\n\n// numbers is now [0, 1, 2, 3, 4, 5,\
    \ 6]\n\n*   The splice method removes elements from an array and, optionally,\
    \ adds new elements:\n\nnumbers.splice(3,  2);\n\n// numbers is now [0, 1, 2,\
    \ 5, 6]\n\nnumbers.splice(3,  0,  3,  4);\n\n// numbers is now [0, 1, 2, 3, 4,\
    \ 5, 6]\n\nIterating Over Arrays\n\nYou can use a for loop to iterate over the\
    \ elements of an array. Here’s an example of how to use a for loop to iterate\
    \ over an array:\n\nfor  (var i =  0; i < numbers.length; i++)  {\n\n  console.log(numbers[i]);\n\
    \n}\n\nYou can also use the forEach method to iterate over an array. The forEach method\
    \ takes a callback function as an argument, and the callback function is called\
    \ for each element in the array. Here’s an example of how to use the forEach method:\n\
    \nnumbers.forEach(function(number)  {\n\n  console.log(number);\n\n});\n\nCollections"
