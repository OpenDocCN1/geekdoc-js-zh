  \  // logs \"\njohn.greet();\n// logs \"Hello, my name is John and I am a developer.\"\
  \n```\n\n## 继承\n\n在 OOP 中，你可以使用继承来创建一个“子”类，该类从“父”类派生属性和方法。这允许你重用代码并避免重复编写。\n\n在\
  \ JavaScript 中，你可以通过 `extends` 关键字来使用继承，创建一个扩展父类的子类。子类可以根据需要覆盖或添加额外的属性和方法。\n\n以下是在\
  \ JavaScript 中使用继承的示例：\n\n```javascript\nclass Employee extends Person {\n  constructor(name,\
  \ age, occupation, company) {\n    super(name, age, occupation);\n    this.company\
  \ = company;\n  }\n  work() {\n    console.log(\"I am working at \" + this.company\
  \ + \".\");\n  }\n}\n```\n\n```javascript\nvar jane = new Employee(\"Jane\", 32,\
  \ \"developer\", \"Acme Inc.\");\nconsole.log(jane.name);  // logs \"Jane\"\nconsole.log(jane.age);\
  \  // logs 32\nconsole.log(jane.occupation);  // logs \"developer\"\nconsole.log(jane.company);\
  \  // logs \"Acme Inc.\"\njane.greet();  // logs \"Hello, my name is Jane and I\
  \ am a developer.\"\njane.work();  // logs \"I am working at Acme Inc.\"\n```\n\n\
  在这个示例中，`Employee` 类扩展了 `Person` 类，并添加了新的公司属性和一个新的工作方法。`Employee` 类还重写了构造函数方法以包含公司参数，并调用了\
  \ `super` 函数来访问父类的构造函数方法。\n\n## 结论\n\n对象和面向对象编程是 JavaScript 中强大的工具。通过理解如何创建和操作对象，以及如何使用继承，你将拥有在\
