  3. 定义一个表示人的类，包括人的姓名、年龄和职业。为类添加一个方法，在控制台中打印问候语。\n4. 创建练习 3 中定义的类的实例，并调用 `greet` 方法。\n\
  5. 定义一个表示员工的类，它扩展了练习 3 中定义的类类。在员工类中添加一个方法，打印员工所属的公司。\n\n## 答案\n\n1. 定义一个表示书的对象，包括标题、作者和页数。\n\
  \n```javascript\nvar book = {\n  title: \"The Great Gatsby\",\n  author: \"F. Scott\
  \ Fitzgerald\",\n  pages: 180\n};\n```\n\n2. 修改练习 1 中定义的对象，包含一个 `read` 属性，这是一个布尔值，表示书是否已阅读。\n\
  \n```javascript\nbook.read = false;\n```\n\n3. 定义一个表示人的类，包括人的姓名、年龄和职业。为类添加一个方法，在控制台中打印问候语。\n\
  \n```javascript\nclass Person {\n  constructor(name, age, occupation) {\n    this.name\
  \ = name;\n    this.age = age;\n    this.occupation = occupation;\n  }\n  greet()\
  \ {\n    console.log(\"Hello, my name is \" + this.name + \" and I am a \" + this.occupation\
  \ + \".\");\n  }\n}\n```\n\n4. 创建练习 3 中定义的类的实例，并调用 `greet` 方法。\n\n```javascript\n\
  var john = new Person(\"John\", 30, \"developer\");\njohn.greet();\n```\n\n5. 定义一个表示员工的类，它扩展了练习\
  \ 3 中定义的类。在员工类中添加一个方法，打印员工所属的公司。\n\n```javascript\nclass Employee extends Person\
  \ {\n  constructor(name, age, occupation, company) {\n    super(name, age, occupation);\n\
  \    this.company = company;\n  }\n  work() {\n    console.log(\"I am working at\
  \ \" + this.company + \".\");\n  }\n}\n```\n\n\n\n\n\n# 使用 JavaScript 操控 HTML 元素\n\
  \nJavaScript 允许你操控 HTML 元素，并更改网页的内容、属性和样式。这使你能够创建动态且交互式的网页，以响应用户输入和不断变化的数据。\n\n\
  在本文中，我们将介绍使用 JavaScript 操控 HTML 元素的不同方法，包括使用文档对象模型 (DOM)、处理 HTML 表单以及创建和修改 CSS 样式。\n\
  \n## 文档对象模型 (DOM)\n\n文档对象模型 (DOM) 是用于 HTML 和 XML 文档的编程接口。它将文档结构表示为对象树，其中每个对象代表文档中的一个元素。\n\
  \n你可以使用 DOM 在 JavaScript 中访问和修改 HTML 元素。这是通过使用 `document` 对象以及各种方法和属性来实现的，例如 `getElementById`、`getElementsByTagName`\
  \ 和 `querySelector`。\n\n以下是如何使用 DOM 修改元素内容的示例：\n\n```javascript\nvar header = document.getElementById(\"\
  header\");\nheader.innerHTML = \"Welcome to My New Page\";\n```\n\n以下是如何使用 DOM 更改元素属性的示例：\n\
  \n```javascript\nheader.setAttribute(\"class\", \"new-class\");\n```\n\n## 处理 HTML\
  \ 表单\n\nHTML 表单允许你收集用户输入并将其到服务器。你可以使用 JavaScript 访问和操作表单元素，例如文本字段、单选按钮和选择列表。\n\n\
  要在 JavaScript 中访问表单元素，你可以使用 `document.getElementById` 方法。以下是如何访问表单中文本字段的示例：\n\n\
  ```javascript\nvar textField = document.getElementById(\"text-field\");\n```\n\n\
  然后可以使用各种方法和属性来操作表单元素。例如，你可以使用 `value` 属性来获取或设置文本字段的值：\n\n```javascript\ntextField.value\
  \ = \"Hello World!\";\n```\n\n你还可以使用 `checked` 属性来获取或设置单选按钮或复选框的选中状态：\n\n```javascript\n\
  var radioButton = document.getElementById(\"radio-button\");\nradioButton.checked\
  \ = true;\n```\n\n## 创建和修改 CSS 样式\n\n你可以使用 JavaScript 为元素创建和修改 CSS 样式。这允许你根据用户输入或数据变化改变网页外观。\n\
  \n要修改元素的属性，可以使用 `setAttribute` 方法。以下是使用 `setAttribute` 的示例：\n\n```javascript\nheader.setAttribute(\"\
  class\", \"new-class\");\n```\n\n你还可以使用 `style` 属性来修改元素的 CSS 样式。以下是使用 `style` 属性的示例：\n\
  \n```javascript\nheader.style.color = \"red\";\n```\n\n## 添加和移除 DOM 元素\n\nDOM 允许你使用各种方法从文档中添加或移除元素。\n\
  \n要向文档添加元素，可以使用 `createElement` 方法创建一个新元素，并使用 `appendChild` 方法将该元素添加到现有元素之后。以下是如何向文档添加元素的示例：\n\
  \n```javascript\nvar newParagraph = document.createElement(\"p\");\nnewParagraph.innerHTML\
  \ = \"This is a new paragraph.\";\ndocument.body.appendChild(newParagraph);\n```\n\
  \n要从文档中移除元素，可以使用 `removeChild` 方法。以下是从文档中移除元素的示例：\n\n```javascript\ndocument.body.removeChild(newParagraph);\n\
  ```\n\n## 结论\n\nDOM 是 JavaScript 的重要组成部分，它让你能够创建动态且交互式的网页。通过理解如何访问和修改 DOM 元素，你将拥有创建强大且吸引\
  \ Web 应用所需的技能。\n\n## 练习\n\n为了复习这些概念，我们将通过一系列练习，旨在测试你的理解能力并应用所学知识。\n\n1. 使用 `document.getElementById`\
  \ 方法访问 id 为“header”的元素，并将其 `innerHTML` 改为“Welcome to My New Page”。\n2. 使用 `document.getElementsByTagName`\
  \ 方法访问文档中所有的 `p` 元素，并将其 `innerHTML` 改为“This is a new paragraph.”\n3. 使用 `document.createElement`\
  \ 和 `appendChild` 方法在 `body` 元素末尾添加一个新的 `p` 元素。\n4. 使用 `document.querySelector`\
  \ 方法访问类名为“highlighted”的元素，并将其 `style.color` 改为“red”。\n5. 使用 `removeChild` 方法从 `body`\
  \ 元素中移除练习 3 中创建的元素。\n\n## 答案\n\n1. 使用 `document.getElementById` 方法访问 id 为“header”的元素，并将其\
  \ `innerHTML` 改为“Welcome to My New Page”。\n```javascript\nvar header = document.getElementById(\"\
  header\");\nheader.innerHTML = \"Welcome to My New Page\";\n```\n\n2. 使用 `document.getElementsByTagName`\
  \ 方法访问文档中所有的 `p` 元素，并将其 `innerHTML` 改为“This is a new paragraph.”\n```javascript\n\
  var paragraphs = document.getElementsByTagName(\"p\");\nfor (var i = 0; i < paragraphs.length;\
  \ i++) {\n  paragraphs[i].innerHTML = \"This is a new paragraph.\";\n}\n```\n\n\
  3. 使用 `document.createElement` 和 `appendChild` 方法在 `body` 元素末尾添加一个新的 `p` 元素。\n```javascript\n\
  var newParagraph = document.createElement(\"p\");\nnewParagraph.innerHTML = \"This\
  \ is a new paragraph.\";\ndocument.body.appendChild(newParagraph);\n```\n\n4. 使用\
  \ `document.querySelector` 方法访问类名为“highlighted”的元素，并将其 `style.color` 改为“red”。\n\
  ```javascript\nvar highlighted = document.querySelector(\".highlighted\");\nhighlighted.style.color\
  \ = \"red\";\n```\n\n5. 使用 `removeChild` 方法从 `body` 元素中移除练习 3 中创建的元素。\n```javascript\n\
  document.body.removeChild(newParagraph);\n```\n\n\n\n\n\n# 用户事件\n\n用户事件是用户在网页上执行的操作，例如点击按钮、将鼠标悬停在元素上或在文本框中输入内容。你可以使用\
  \ JavaScript 来响应这些事件，并创建动态且交互式的网页。\n\n在本文中，我们将介绍 JavaScript 中不同类型的用户事件，以及如何使用它们来创建交互式网页。\n\
  \n## 点击事件\n\n点击事件在用户点击某个元素时触发。你可以使用 `click` 事件来响应用户的点击并执行操作，例如显示消息或更改元素的内容。\n\n\
  要向元素绑定点击事件，你可以使用 `addEventListener` 方法。以下是一个为按钮绑定点击事件的示例：\n\n```javascript\nvar\
  \ button = document.getElementById(\"button\");\n\nbutton.addEventListener(\"click\"\
  ,  function()  {\n  alert(\"Button clicked!\");\n});\n```\n\n你也可以使用 `onclick` 属性为元素绑定点击事件。以下是使用\
  \ `onclick` 属性的示例：\n\n```html\n<button id=\"button\"\nonclick=\"alert('Button clicked!')\"\
  >点击我</button>\n```\n\n## 悬停事件\n\n悬停事件在用户将鼠标移动到元素上时触发。你可以使用 `mouseover` 和 `mouseout`\
  \ 事件来响应用户的悬停并执行操作，例如更改元素的外观。\n\n要向元素绑定悬停事件，你可以使用 `addEventListener` 方法。以下是一个为 `div`\
  \ 元素绑定悬停事件的示例：\n\n```javascript\nvar div = document.getElementById(\"div\");\n\n\
  div.addEventListener(\"mouseover\",  function()  {\n  div.style.backgroundColor\
  \ =  \"yellow\";\n});\n\ndiv.addEventListener(\"mouseout\",  function()  {\n  div.style.backgroundColor\
  \ =  \"white\";\n});\n```\n\n你也可以使用 `onmouseover` 和 `onmouseout` 属性为元素绑定悬停事件。以下是使用\
  \ `onmouseover` 和 `onmouseout` 属性的示例：\n\n```html\n<div id=\"div\"\nonmouseover=\"\
  this.style.backgroundColor =  'yellow'\"\nonmouseout=\"this.style.backgroundColor\
  \ =  'white'\">\n悬停在我上方</div>\n```\n\n## 键事件\n\n键事件在用户在键盘上打字时触发。你可以使用 `keydown`、`keyup`\
  \ 和 `keypress` 事件来响应用户的键盘输入并执行操作，例如验证表单字段或搜索内容。\n\n要向元素绑定按键事件，你可以使用 `addEventListener`\
  \ 方法。以下是一个为文本框绑定按键事件的示例：\n\n```javascript\nvar textField = document.getElementById(\"\
  text-field\");\n\ntextField.addEventListener(\"keydown\",  function()  {\n  console.log(\"\
  Key down!\");\n});\n\ntextField.addEventListener(\"keyup\",  function()  {\n  console.log(\"\
  Key up!\");\n});\n\ntextField.addEventListener(\"keypress\",  function()  {\n  console.log(\"\
  Key press!\");\n});\n```\n\n你也可以使用 `onkeydown`、`onkeyup` 和 `onkeypress` 属性为元素绑定按键事件。以下是使用\
  \ `onkeydown`、`onkeyup` 和 `onkeypress` 属性的示例：\n\n```html\n<input id=\"text-field\"\
  \  type=\"text\"\nonkeydown=\"console.log('Key down!')\"\nonkeyup=\"console.log('Key\
  \ up!')\"\nonkeypress=\"console.log('Key press!')\">\n```\n\n## 结论\n\n用户事件是创建交互式动态网页的关键部分。通过理解如何使用不同的事件（如点击、悬停和键事件），你将拥有创建吸引人且响应良好的\
  \ Web 所需的技能。\n\n## 练习\n\n为了复习这些概念，我们将通过一系列练习来测试你的理解能力并应用所学知识。\n\n1. 使用 `addEventListener`\
  \ 方法为按钮绑定点击事件，使其在点击时显示警框消息。\n2. 使用 `onmouseover` 和 `onmouseout` 属性为 `div` 元素绑定悬停事件，使其在悬停时时更改背景颜色。\n\
  3. 使用 `addEventListener` 方法为文本框绑定按键事件，使其在按下按键时向控制台记录消息。\n4. 使用 `addEventListener`\
  \ 方法为按钮绑定点击事件，使其在点击时更改 `div` 元素的文本。\n5. 使用 `onmouseover` 和 `onmouseout` 属性为 `div`\
  \ 元素绑定悬停事件，使其在悬停时时切换 CSS 类。\n\n## 解决方案\n\n1. 使用 `addEventListener` 方法为按钮绑定点击事件，使其在点击时显示警框消息。\n\
  \n```javascript\nvar button = document.getElementById(\"button\");\n\nbutton.addEventListener(\"\
  click\",  function()  {\n  alert(\"Button clicked!\");\n});\n```\n\n2. 使用 `onmouseover`\
  \ 和 `onmouseout` 属性为 `div` 元素绑定悬停事件，使其在悬停时更改背景颜色。\n\n```html\n<div id=\"div\"\n\
  onmouseover=\"this.style.backgroundColor =\n'yellow'\"\nonmouseout=\"this.style.backgroundColor\
  \ =\n'white'\">悬停在我上方</div>\n```\n\n3. 使用 `addEventListener` 方法为文本框绑定按键事件，使其在按下按键时向控制台记录消息。\n\
  \n```javascript\nvar textField = document.getElementById(\"text-field\");\n\ntextField.addEventListener(\"\
  keydown\",  function()  {\n  console.log(\"Key down!\");\n});\n\ntextField.addEventListener(\"\
  keyup\",  function()  {\n  console.log(\"Key up!\");\n});\n\ntextField.addEventListener(\"\
  keypress\",  function()  {\n  console.log(\"Key press!\");\n});\n```\n\n4. 使用 `addEventListener`\
  \ 方法为按钮绑定点击事件，使其在点击时更改 `div` 元素的文本。\n\n```javascript\nvar button = document.getElementById(\"\
  button\");\nvar div = document.getElementById(\"div\");\n\nbutton.addEventListener(\"\
  click\",  function()  {\n  div.innerHTML = \"文本已更改!\";\n});\n```\n\n5. 使用 `onmouseover`\
  \ 和 `onmouseout` 属性为 `div` 元素绑定悬停事件，使其在悬停时切换 CSS 类。\n\n```html\n<style>\n.highlighted\
  \ { background-color: yellow; }\n</style>\n<div id=\"div\"\nonmouseover=\"this.classList.add('highlighted')\"\
  \nonmouseout=\"this.classList.remove('highlighted')\">悬停在我上方</div>\n```\n\n\n\n\n\
  \n除了数组之外，JavaScript 还有几种内置集合类型，包括 `Set`、`Map` 和 `WeakMap`。\n\n### Set\n`Set` 是一个唯一值的集合，这意味着它不能包含重复的值。你可以使用\
  \ `Set` 构造函数来创建一个 `Set`。\n\n以下是如何创建一个 `Set` 并向其添加项的示例：\n\n```javascript\nvar set\
  \ = new Set();\nset.add(1);\nset.add(2);\nset.add(3);\n```\n\n你可以使用 `size` 属性来获取\
  \ `Set` 中项的数量，并使用 `has` 方法来检查 `Set` 是否包含特定值。\n\n以下是使用 `size` 属性和 `has` 方法的示例：\n\n\
  ```javascript\nconsole.log(set.size);  // 3\nconsole.log(set.has(1));  // true\n\
  console.log(set.has(4));  // false\n```\n\n### Map\n`Map` 是一个键值对的集合，其中每个键都是唯一的。你可以使用\
  \ `Map` 构造函数来创建一个 `Map`。\n\n以下是如何创建一个 `Map` 并向其添加项的示例：\n\n```javascript\nvar map\
  \ = new Map();\nmap.set(\"name\", \"John\");\nmap.set(\"age\", 30);\n```\n\n你可以使用\
  \ `size` 属性来获取 `Map` 中项的数量，并使用 `get` 方法来获取特定键的值。\n\n以下是使用 `size` 属性和 `get` 方法的示例：\n\
  \n```javascript\nconsole.log(map.size);  // 2\nconsole.log(map.get(\"name\")); \
  \ // \"John\"\n```\n\n### WeakMap\n`WeakMap` 与 `Map` 类似，但它只对其键持有弱引用，这意味着如果没有其他其他引用指向这些键，这些键就可以被垃圾回收。这使得\
  \ `WeakMaps` 适用于存储那些在不再需要时希望被自动清理的数据。\n\n要创建一个 `WeakMap`，你需要使用 `WeakMap` 构造函数并传入一个键值对的迭代器。\n\
  \n以下是如何创建一个 `WeakMap` 并向其添加项的示例：\n\n```javascript\nvar weakMap = new WeakMap([\n\
  \  [{}, \"value1\"],\n  [{}, \"value2\"]\n]);\n```\n\n你可以使用 `get` 方法来检索 `WeakMap`\
  \ 中特定键的值。\n\n以下是使用 `get` 方法从 `WeakMap` 中检索值的示例：\n\n```javascript\nvar value = weakMap.get(key);\
  \  // \"value\"\n```\n\n注意，`WeakMaps` 没有 `size` 属性或 `has` 方法，因此你无法获取 `WeakMap` 中项的数量，无法检查\
  \ `WeakMap` 是否包含特定键。\n\n## 结论\n在本文，我们涵盖了 JavaScript 中不同类型的数组和集合，以及如何使用它们来存储和处理数据。通过理解如何操作数组和集合，你将拥有为你的\
  \ JavaScript 应用创建高效且有效的数据结构所需的技能。\n\n## 练习\n为了复习这些概念，我们将通过一系列练习题，旨在测试你的理解并应用所学的内容。\n\
  \n1. 创建一个数字数组，并使用循环将每个数字的平方打印到控制台。\n2. 创建一个字符串 `Set`，并使用 `forEach` 方法将每个字符串打印到控制台。\n\
  3. 创建一个对象数组，并使用 `forEach` 方法将每个对象的名称打印到控制台。\n4. 创建一个数字 `Set`，并使用 `size` 属性和 `has`\
  \ 方法检查该集合是否包含数字 5。\n5. 创建一个键值对的 `Map`，并使用 `get` 方法检索键 `\"key1\"` 的值。\n\n## 答案\n\
  创建一个数字数组，并使用循环将每个数字的平方打印到控制台。\n\n```javascript\nvar numbers = [1, 2, 3, 4, 5];\n\
  numbers.forEach(function(number) {\n  console.log(number * number);\n});\n```\n\n\
  创建一个字符串 `Set`，并使用 `forEach` 方法将每个字符串打印到控制台。\n\n```javascript\nvar set = new Set([\"\
  apple\", \"banana\", \"cherry\"]);\nset.forEach(function(item) {\n  console.log(item);\n\
  });\n```\n\n创建一个对象数组，并使用 `forEach` 方法将每个对象的名称打印到控制台。\n\n```javascript\nvar objects\
  \ = [\n  {name: \"John\"},\n  {name: \"Jane\"},\n  {name: \"Jim\"}\n];\nobjects.forEach(function(object)\
  \ {\n  console.log(object.name);\n});\n```\n\n创建一个数字 `Set`，并使用 `size` 属性和 `has`\
  \ 方法检查该集合是否包含数字 5。\n\n```javascript\nvar set = new Set([1, 2, 3, 4, 5]);\nconsole.log(set.size);\
  \  // 5\nconsole.log(set.has(5));  // true\n```\n\n创建一个键值对的 `Map`，并使用 `get` 方法检索键\
  \ `\"key1\"` 的值。\n\n```javascript\nvar map = new Map([\n  [\"key1\", \"value1\"\
  ],\n  [\"key2\", \"value2\"]\n]);\nconsole.log(map.get(\"key1\")); // \"value1\"\
  \n```\n\n### 使用 async/await 进行异步编程\n异步编程是一种程序可以并发而非顺序执行的范式。在 JavaScript 中，异步编程通常用于\
  \ I/O 操作，例如读取或写入文件，或者发起需要时间完成的。\n\n#### 回调 (Callbacks)\n异步编程最早的方法之一是使用回调。回调是作为参数传递的函数并在任务完成时被调用。以下是使用回调的示例：\n\
  \n```javascript\nfunction makeRequest(url, callback) {\n  var xhr = new XMLHttpRequest();\n\
  \  xhr.open(\"GET\", url);\n  xhr.onload = function() {\n    callback(xhr.responseText);\n\
  \  };\n  xhr.send();\n}\n\n// 使用回调\nmakeRequest(\"http://example.com\", function(response)\
  \ {\n  console.log(response);\n});\n```\n虽然回调函数有效处理异步任务，但如果你有多个相互依赖的异步任务，它们会导致“回调地狱”。\n\
  \n#### 承诺 (Promises)\n为了解决“回调地狱”问题，JavaScript 在 ECMAScript 2015 (ES6) 中引入了承诺。承诺是一个代表异步操作结果的对象。承诺处于三种状态之一：\n\
  - 待定 (Pending)：承诺尚未履行或拒绝。\n- 已履行 (Fulfilled)：承诺已履行，异步操作成功。\n- 已拒绝 (Rejected)：承诺已拒绝，异步操作失败。\n\
  \n承诺提供了一种更具声明性且易读的方式来处理异步操作。与其使用回调函数，你可以使用承诺的 `then` 和 `catch` 方法。以下是使用承诺发起 HTTP\
  \ 请求的示例：\n\n```javascript\nfunction makeRequest(url) {\n  return new Promise(function(resolve,\
  \ reject) {\n    var xhr = new XMLHttpRequest();\n    xhr.open(\"GET\", url);\n\
  \    xhr.onload = function() {\n      if (xhr.status === 200) {\n        resolve(xhr.responseText);\n\
  \      } else {\n        reject(xhr.statusText);\n      }\n    };\n    xhr.send();\n\
  \  });\n}\n\n// 使用 then 和 catch 方法\nmakeRequest(\"http://example.com\")\n .then(function(response)\
  \ {\n    console.log(response);\n  })\n  .catch(function(error) {\n    console.error(error);\n\
  \  });\n```\n\n#### async/await\n`async/await` 语法是 JavaScript 新引入的一个特性，它使得处理异步代码变得更加容易。`async`\
  \ 关键字用于声明异步函数，而 `await` 关键字用于等待承诺被履行或拒绝后再继续执行。\n\n\n\n\n\n# 使用 API 和 AJAX 请求\n\n\
  在“学习 JavaScript”课程的这一章节中，我们将探索如何使用 API（应用程序编程接口）以及如何在 JavaScript 中发送 AJAX（异步 JavaScript\
  \ 和 XML）请求。API 允许你访问其他服务的数据和功能，而 AJAX 请求则可以在无需刷新页面的情况下完成操作。\n\n## 什么是 API？\n\nAPI\
  \ 是一套定义两个系统之间如何通信的规则。API 允许你访问其他服务的数据和功能。网络上有上有许多可用的 API，它们可以用于访问广泛的数据和功能。使用 API\
  \ 可以实现的一些示例包括：\n\n* 从数据库或服务中检索数据\n* 在数据库或服务中添加或更新数据\n* 执行特定操作（例如发送电子邮件或发布到社交媒体）\n\
  \nAPI 通常要求你使用 API 密钥或其他形式的身份验证对请求进行身份验证。API 也会设置速率限制（rate limits），这限制了你在特定时间内可以发送请求的数量。\n\
  \n## 使用 JavaScript 发送 API 请求\n\n在 JavaScript 中发送 API 请求，你可以使用 `XMLHttpRequest` 对象或\
  \ `fetch` 函数。\n\n### 使用 XMLHttpRequest\n\n`XMLHttpRequest` 对象是一个自 Web 早期一直存在的遗留\
  \ API。它允许你异步发送 HTTP 请求并接收响应，而无需刷新页面。以下是一个使用 `XMLHttpRequest` 对象向 API 发送 GET 请求的示例：\n\
  \n```javascript\nfunction makeRequest(url) {\n  var xhr = new XMLHttpRequest();\n\
  \  xhr.open(\"GET\", url);\n  xhr.onload = function() {\n    if (xhr.status ===\
  \ 200) {\n      console.log(xhr.responseText);\n    } else {\n      console.error(xhr.statusText);\n\
  \    }\n  };\n  xhr.send();\n}\n\nmakeRequest(\"http://example.com/api/data\");\n\
  ```\n\n### 使用 fetch\n\n`fetch` 函数是随着 fetch API 引入 JavaScript 的较新 API。它允许你异步发送 HTTP\
  \ 请求并接收响应，并返回一个解析为 `Response` 对象的承诺（promise）。以下是一个使用 `fetch` 函数向 API 发送 GET 请求的示例：\n\
  \n```javascript\nfetch(\"http://example.com/api/data\")\n  .then(function(response)\
  \ {\n    return response.text();\n  })\n  .then(function(data) {\n    console.log(data);\n\
  \  })\n  .catch(function(error) {\n```\n\n\n\n\n\n```javascript\nconsole.error(error);\n\
  });\n```\n\n`XMLHttpRequest` 对象和 `fetch` 函数都允许你通过设置请求的 `method` 属性来其他类型的 HTTP 请求，例如\
  \ POST、PUT、DELETE 等。\n\n## 处理 JSON 数据\n\n许多 API 以 JSON（JavaScript 对象表示）格式返回数据，这是一种轻量级的数据交换格式，易于人类读写，也易于机器解析和生成。\n\
  \n在 JavaScript 中解析 JSON 数据，你可以使用 `JSON.parse` 函数。以下是一个使用 `JSON.parse` 函数解析 JSON\
  \ 数据的示例：\n\n```javascript\nvar jsonData = '{\"name\": \"John\", \"age\": 30, \"\
  city\": \"New York\"}';\nvar data = JSON.parse(jsonData);\nconsole.log(data.name);\
  \  // \"John\"\nconsole.log(data.age);  // 30\nconsole.log(data.city);  // \"New\
  \ York\"\n```\n\n要将 JavaScript 对象或数组转换为 JSON 字符串，你可以使用 `JSON.stringify` 函数。以下是一个使用\
  \ `JSON.stringify` 函数将 JavaScript 对象转换为 JSON 字符串的示例：\n\n```javascript\nvar data\
  \ = {name: \"John\", age: 30, city: \"New York\"};\nvar jsonData = JSON.stringify(data);\n\
  console.log(jsonData);  // '{\"name\":\"John\",\"age\":30,\"city\":\"New York\"\
  }'\n```\n\n## 处理 AJAX 请求\n\nAJAX（异步 JavaScript 和 XML）是一个术语，用于描述在 JavaScript 中发送异步\
  \ HTTP 请求并接收响应的过程，而无需刷新页面。AJAX 允许你通过向 API 发送请求并使用响应更新 DOM（文档对象模型）来动态更新网页的部分。\n\n\
  在 JavaScript 中发送 AJAX 请求，你可以使用我们之前讨论过的 `XMLHttpRequest` 对象或 `fetch` 函数。以下是一个使用 `XMLHttpRequest`\
  \ 对象发送 AJAX 请求的示例：\n\n```javascript\nfunction makeRequest(url) {\n  var xhr = new\
  \ XMLHttpRequest();\n  xhr.open(\"GET\", url);\n  xhr.onload = function() {\n  \
  \  if (xhr.status === 200) {\n      var data = JSON.parse(xhr.responseText);\n \
  \     // 使用响应数据更新 DOM\n    } else {\n      console.error(xhr.statusText);\n    }\n\
  \  };\n  xhr.send();\n}\n\n// 当点击按钮时发送 AJAX 请求\nvar button = document.getElementById(\"\
  button\");\nbutton.addEventListener(\"click\", function() {\n  makeRequest(\"http://example.com/api/data\"\
  );\n});\n```\n\n以下是一个使用 `fetch` 函数发送 AJAX 请求的示例：\n\n```javascript\nfunction makeRequest(url)\
  \ {\n  fetch(url)\n    .then(function(response) {\n      return response.json();\n\
  \    })\n    .then(function(data) {\n      // 使用响应数据更新 DOM\n    })\n    .catch(function(error)\
  \ {\n      console.error(error);\n    });\n}\n\n// 当点击按钮时发送 AJAX 请求\nvar button\
  \ = document.getElementById(\"button\");\nbutton.addEventListener(\"click\", function()\
  \ {\n  makeRequest(\"http://example.com/api/data\");\n});\n```\n\n## 结论\n\n在“学习\
  \ JavaScript”课程的这一章节中，我们学习了 API 以及如何在 JavaScript 中发送 AJAX 请求。我们还还学习了如何处理 JSON 数据，以及如何使用\
  \ `XMLHttpRequest` 对象和 `fetch` 函数来发送 HTTP 请求并异步接收响应。\n\n通过理解如何处理 API 和发送 AJAX 请求，你可以构建动态、交互式的\
  \ Web 应用，这些程序可以访问并操作来自其他网站和服务的数据。\n\n## 练习题\n\n为了复习这些概念，我们将通过一系列练习，旨在测试你的理解并应用你所学的内容。\n\
  \n1. 向 [GitHub API](https://developer.github.com/v3/) 发送 AJAX 请求，以获取指定用户的仓库列表，并在页面上的列表显示显示仓库名称。\n\
  2. 向 [OpenWeatherMap API](https://openweathermap.org/api) 发送 AJAX 请求以获取指定城市的当前天气，并在页面上显示温度和天气描述。\n\
  3. 向 [Wikipedia API](https://www.mediawiki.org/wiki/API:Main_page) 发送 AJAX 请求以根据给定关键词搜索文章，并在页面上的列表中显示文章标题和描述。\n\
  4. 向 [NASA 每日天文图片 API](https://api.nasa.gov/api.html#apod) 发送 AJAX 请求以获取当前的“每日天文图片”，并在页面上显示图像和描述。\n\
  5. 向 [USGS 地震 API](https://earthquake.usgs.gov/fdsws/event/1/) 发送 AJAX 请求以获取过去一周的地震列表，并在\
  \ [Google Maps API](https://developers.google.com/maps/) 的地图上显示震级和位置。\n\n## 答案\n\
  \n### 向 [GitHub API](https://developer.github.com/v3/) 发送 AJAX 请求，以获取指定用户的仓库列表，并在页面上的列表显示仓库名称。\n\
  \n```javascript\nfunction getRepos(username) {\n  fetch(`https://api.github.com/users/${username}/repos`)\n\
  \    .then(function(response) {\n      return response.json();\n    })\n    .then(function(repos)\
  \ {\n      var list = document.getElementById(\"repo-list\");\n      repos.forEach(function(repo)\
  \ {\n        var li = document.createElement(\"li\");\n        li.textContent =\
  \ repo.name;\n        list.appendChild(li);\n      });\n    })\n    .catch(function(error)\
  \ {\n      console.error(error);\n    });\n}\n\nvar button = document.getElementById(\"\
  button\");\nbutton.addEventListener(\"click\", function() {\n  var username = document.getElementById(\"\
  username\").value;\n  getRepos(username);\n});\n```\n\n### 向 [OpenWeatherMap API](https://openweathermap.org/api)\
  \ 发送 AJAX 请求以获取指定城市的当前天气，并在页面上显示温度和天气描述。\n\n```javascript\nfunction getWeather(city)\
  \ {\n  fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=YOUR_API_KEY`)\n\
  \    .then(function(response) {\n      return response.json();\n    })\n    .then(function(data)\
  \ {\n      var temperature = data.main.temp;\n      var description = data.weather[0].description;\n\
  \      document.getElementById(\"temperature\").textContent = temperature;\n   \
  \   document.getElementById(\"description\").textContent = description;\n    })\n\
  \    .catch(function(error) {\n      console.error(error);\n    });\n}\n\nvar button\
  \ = document.getElementById(\"button\");\nbutton.addEventListener(\"click\", function()\
  \ {\n  var city = document.getElementById(\"city\").value;\n  getWeather(city);\n\
  });\n```\n\n### 向 [Wikipedia API](https://www.mediawiki.org/wiki/API:Main_page)\
  \ 发送 AJAX 请求以根据给定关键词搜索文章，并在页面上的列表中显示文章标题和描述。\n\n```javascript\nfunction searchArticles(keyword)\
  \ {\n  fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&list=search&utf8=1&formatversion=2&srsearch=${keyword}`)\n\
  \    .then(function(response) {\n      return response.json();\n    })\n    .then(function(data)\
  \ {\n      var list = document.getElementById(\"article-list\");\n      data.query.search.forEach(function(article)\
  \ {\n        var li = document.createElement(\"li\");\n        var a = document.createElement(\"\
  a\");\n        a.textContent = article.title;\n        a.href = `https://en.wikipedia.org/wiki/${article.title}`;\n\
  \        li.appendChild(a);\n        li.appendChild(document.createTextNode(` -\
  \ ${article.snippet}`));\n        list.appendChild(li);\n      });\n    })\n   \
  \ .catch(function(error) {\n      console.error(error);\n    });\n}\n\nvar button\
  \ = document.getElementById(\"button\");\nbutton.addEventListener(\"click\", function()\
  \ {\n  var keyword = document.getElementById(\"keyword\").value;\n  searchArticles(keyword);\n\
  });\n```\n\n### 向 [NASA 每日天文图片 API](https://api.nasa.gov/api.html#apod) 发送 AJAX\
  \ 请求以获取当前的“每日天文图片”，并在页面上显示图像和描述。\n\n```javascript\nfunction getAPOD() {\n  var apiKey\
  \ = \"YOUR_API_KEY\";\n  fetch(`https://api.nasa.gov/planetary/apod?api_key=${apiKey}`)\n\
  \    .then(function(response) {\n      return response.json();\n    })\n    .then(function(data)\
  \ {\n      document.getElementById(\"apod-image\").src = data.url;\n      document.getElementById(\"\
  apod-description\").textContent = data.explanation;\n    })\n    .catch(function(error)\
  \ {\n      console.error(error);\n    });\n}\n```\n\n\n\n\n\n```javascript\n.then(function(data)\
  \  {\n      var img = document.getElementById(\"apod-img\");\n      img.src = data.url;\n\
  \      img.alt = data.title;\n      document.getElementById(\"apod-title\").textContent\
  \ = data.title;\n      document.getElementById(\"apod-description\").textContent\
  \ = data.explanation;\n  })\n  .catch(function(error)  {\n    console.error(error);\n\
  \  });\n}\n\ngetAPOD();\n```\n\n向 [USGS 地震 API](https://earthquake.usgs.gov/fdsnws/event/1/)\
  \ 发起 AJAX 请求以获取过去的地震列表，并使用 [Google Maps API](https://developers.google.com/maps/)\
  \ 在地图上显示地震震级和位置。\n\n首先，你需要按照 Google Maps API 文档中的说明获取 Google Maps API 的 API 密钥。然后，你可以使用以下代码向\
  \ USGS 地震 API 发 AJAX 请求并在地图上显示地震：\n\n```javascript\nfunction  initMap()  {\n var\
  \ map =  new google.maps.Map(document.getElementById(\"map\"),  {\n    zoom:  2,\n\
  \    center:  {lat:  0,  lng:  0}\n  });\n  fetch(\"https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=2022-01-01&endtime=2022-01-08\"\
  )\n    .then(function(response)  {\n      return response.json();\n    })\n    .then(function(data)\
  \  {\n      data.features.forEach(function(earthquake)  {\n          var marker\
  \ =  new google.maps.Marker({\n            position: earthquake.geometry.coordinates,\n\
  \            map: map,\n            title:  `Magnitude ${earthquake.properties.mag}\
  \ - ${earthquake.properties.place}`\n          });\n        });\n      })\n    .catch(function(error)\
  \  {\n        console.error(error);\n      });\n}\n```\n\n# 使用 JavaScript 构建 Web\
  \ 应用程序\n\n现在你已经学习了 JavaScript 的基础知识，是时候将所有内容整合起来构建一个 Web 应用程序了。在“学习 JavaScript”课程的最后一章中，你将学习如何使用\
  \ JavaScript 构建交互式的动态 Web 应用程序，这些程序可以与服务器通信、访问数据并执行复杂任务。\n\n## 设置开发环境\n\n在开始构建 Web\
  \ 应用程序之前，你需要设置开发环境。这包括安装代码编辑器、设置本地开发服务器以及配置你的项目结构。\n\n有很多代码编辑器可以选择，例如 [Sublime Text](https://www.sublimetext.com/)\
  \ [Atom](https://atom.io/) 和 [Visual Studio Code](https://code.visualstudio.com/)。这些代码编辑器提供了语法高亮、代码补全和调试工具等功能，让编写和调试代码变得更加容易。\n\
  \n要设置本地开发服务器，你可以使用 [XAMPP](https://www.apachefriends.org/index.html)、[WAMP](http://www.wampserver.com/en/)\
  \ 或 [MAMP](https://www.mamp.info/en/) 等工具。这些工具允许你在本地上运行 Web 服务器，这在将 Web 应用程序部署到上线服务器之前进行测试和调试非常有用。\n\
  \n一旦设置好了代码编辑器和开发服务器，你就需要为你的 Web 应用程序决定项目结构。常见的结构是：一个用于样式表的 `css` 目录，一个用于 JavaScript\
  \ 文件的 `js` 目录以及一个用于 HTML 的 `index.html` 文件。你可能还想包含图像、字体和其他资源的目录。\n\n## 构建 HTML 结构\n\
  \n构建 Web 应用程序的第一步是创建 HTML 结构。这包括定义应用程序的布局、添加页眉、页脚和导航等元素，并使用 HTML 标签对内容进行标记。\n\n\
  要创建应用程序的布局，你可以使用 HTML5 结构化标签，如 `header`、`footer` 和 `main`。你也可以使用 CSS 对应用程序进行样式。\n\
  \n## 使用 JavaScript 添加交互性\n\n一旦有了 HTML 结构，你就可以使用 JavaScript 让你的应用程序具有交互性注意：此处原文包含重复/碎片化的句子；本节保持逻辑连贯性）。\n\
  \n# 整合一切\n\n构建一个完整的 Web 应用程序，你需要结合所有这些元素。\n\n## 结论\n\n构建 Web 应用程序需要 HTML、CSS 和 JavaScript\
  \ 的结合。通过遵循本课程的步骤，你应该为构建自己的应用程序打下坚实的基础。\n\n## 示例项目\n\n在这个示例中，我们将构建一个待事项列表。首先，我们将设置\
  \ HTML 结构。我们将创建一个带有 `id=\"todo-list\"` 的 `div` 元素来包含任务列表，并创建一个带有 `id=\"add-task-form\"\
  ` 的 `form` 元素来添加任务。在表单内部，我们将添加一个 `type=\"text\"` 的 `input` 元素允许用户输入任务，以及一个 `type=\"\
  submit\"` 的 `button` 元素来提交表单。\n\n```html\n<div id=\"todo-list\">\n  <ul></ul>\n\
  </div>\n<form id=\"add-task-form\">\n  <input type=\"text\" id=\"task-title\" placeholder=\"\
  Enter title\">\n  <button type=\"submit\">Add Task</button>\n</form>\n```\n\n接下来，我们将编写\
  \ CSS 来为应用程序设置样式。我们将使用 `flexbox` 等布局属性组合来定义应用程序的布局。\n\n```css\n#todo-list {\n  display:\
  \ flex;\n  flex-direction: column;\n  width: 400px;\n  margin: 0 auto;\n}\n#add-task-form\
  \ {\n  display: flex;\n  align-items: center;\n  margin-bottom: 20px;\n}\n#add-task-form\
  \ input[type=\"text\"] {\n  flex-grow: 1;\n  padding: 8px;\n  font-size: 16px;\n\
  \  border: none;\n  border-radius: 4px;\n}\n#add-task-form button[type=\"submit\"\
  ] {\n  margin-left: 10px;\n  padding: 8px;\n  font-size: 16px;\n  background-color:\
  \ #00b8d4;\n  color: white;\n  border: none;\n  border-radius: 4px;\n  cursor: pointer;\n\
  }\n```\n\n\n\n\n\n```css\n{\n  display: flex;\n  align-items: center;\n  padding:\
  \ 8px;\n  border-radius: 4px;\n  margin-bottom: 8px;\n  background-color: #f1f1f1;\n\
  }\n\n#todo-list li.completed {\n  background-color: #ccc;\n  text-decoration: line-through;\n\
  }\n\n#todo-list li .task-title {\n  flex-grow: 1;\n  font-size: 16px;\n}\n\n#todo-list\
  \ li .delete-button {\n  margin-left: 10px;\n  font-size: 16px;\n  color: #ff6b6b;\n\
  \  cursor: pointer;\n}\n```\n\n最后，我们将编写 JavaScript 来为应用添加交互性。我们将使用 `addEventListener`\
  \ 方法为表单和删除按钮绑定事件监听器，并使用 DOM 操作方法来在 HTML 中添加、删除和修改元素。\n\n```javascript\n// 获取表单和列表元素的引用\n\
  const form = document.querySelector(\"#add-task-form\");\nconst taskList = document.querySelector(\"\
  #todo-list ul\");\n\n// 为表单添加提交事件监听器\nform.addEventListener(\"submit\", e => {\n\
  \  // 防止表单默认提交\n  e.preventDefault();\n  // 从输入元素中获取任务标题\n  const taskTitle = document.querySelector(\"\
  #task-title\").value;\n  // 创建一个新的列表项元素\n  const taskItem = document.createElement(\"\
  li\");\n  // 如果任务已完成，则添加 \"completed\" 类\n  taskItem.classList.add(\"completed\"\
  );\n  // 将任务项的 innerHTML 设置为任务标题\n  taskItem.innerHTML = `\n    <span class=\"task-title\"\
  >${taskTitle}</span>\n    <button class=\"delete-button\">Delete</button>\n  `;\n\
  \  // 将任务项附加到任务列表\n  taskList.appendChild(taskItem);\n  // 清空任务标题输入\n  document.querySelector(\"\
  #task-title\").value = \"\";\n});\n\n// 为任务列表添加点击事件监听器\ntaskList.addEventListener(\"\
  click\", e => {\n  // 获取被点击的目标元素\n  const target = e.target;\n  // 如果目标是删除按钮，则删除任务\n\
  \  if (target.classList.contains(\"delete-button\")) {\n    target.parentElement.remove();\n\
  \  }\n  // 如果目标是任务标题，切换 completed 类\n  if (target.classList.contains(\"task-title\"\
  )) {\n    target.parentElement.classList.toggle(\"completed\");\n  }\n});\n```\n\
  \n有了这些 HTML、CSS 和 JavaScript 代码，我们现在有了一个功能完备的待事项列表应用，它允许用户添加、删除并标记任务为已完成。\n\n# 使用库和框架\
  \ (jQuery, React, 等)\n\n当你继续使用 JavaScript 开发 Web 应用时，你可能会发现你需要使用库和框架来帮助简化你的开发流程，并为你的应用添加高级功能。在本章中，我们将探索一些最流行的\
  \ JavaScript 库和框架，包括 jQuery、React 和 Angular。\n\n## 什么是库和框架？\n\n库（Library）是预写代码的集合，为特定目的提供实用函数和其他辅助工具。框架（Framework）是一个更全面的结构，为构建应用程序提供了一套约定和指南。库和框架都可以在开发应用程序时节省时间和精力的，但它们在抽象级别和提供的控制程度上有所不同。\n\
  \n## jQuery\n\njQuery 是一个流行的库，提供了一组实用函数和方法用于与 DOM 交互、发送 HTTP 请求以及元素动画。jQuery 的主要优势之一是它简化了常见的\
  \ JavaScript 任务，并让你编写更短、更简洁的代码。\n\n要使用 jQuery，你需要在 HTML 文件中包含 jQuery 库。你可以下载库并在本地包含它，也可以通过在\
  \ HTML 文件中添加 `script` 标签从 CDN（内容分发网络）包含它。\n\n```html\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
  ></script>\n```\n\n一旦包含了库，你就可以通过从 DOM 中选择元素并对其应用函数和方法开始使用 jQuery。例如，要选择页面上所有的 `p`\
  \ 元素并隐藏它们，可以使用 `hide()` 函数：\n\n```javascript\n$(\"p\").hide();\n```\n\njQuery 还提供了一组事件，你可以使用它们来响应用户操作，如点击、悬停和表单提交。例如，要给按钮绑定点击事件，可以使用\
  \ `click()` 函数：\n\n```javascript\n$(\"button\").click(function() {\n  // 按钮被点击时执行的代码\n\
  });\n```\n\n## React\n\nReact 是一个用于构建用户界面的 JavaScript 库。由 Facebook 开发，现在由开发者社区维护。React\
  \ 允许你创建可以轻松组合的复用组件，以构建复杂的应用程序。\n\nReact 的主要优势之一是它使用虚拟 DOM（文档对象模型）来优化对实际 DOM 的更新。这意味着当组件状态变化时，React\
  \ 只会更新必要的 DOM 部分，而不是重建整个 DOM 树。这可以极大地提高你应用程序的性能，特别是在处理大型数据集或频繁变化的数据时。\n\n要使用 React，你需要在\
  \ HTML 文件中包含 React 库，并设置构建过程来编译你的代码。有几种方法可以实现这一点，但一种流行的方法是使用 `create-react-app`。\n\
  \n一旦设置好 React，你就可以开始创建组件。组件是代表用户界面部分的代码。这里有一个显示列表的组件示例：\n\n```javascript\nimport\
  \ React from \"react\";\nclass List extends React.Component {\n  render() {\n  \
  \  return (\n      <ul>\n        <li>Item 1</li>\n        <li>Item 2</li>\n    \
  \    <li>Item 3</li>\n      </ul>\n    );\n  }\n}\n```\n\n要使用该组件，你可以在 HTML 中这样包含它：\n\
  \n```html\n<div id=\"root\"></div>\n```\n\n然后你可以使用 `ReactDOM.render` 方法将其渲染到根元素：\n\
  \n```javascript\nimport React from \"react\";\nimport ReactDOM from \"react-dom\"\
  ;\nimport List from \"./List\";\n\nReactDOM.render(<List />, document.getElementById(\"\
  root\"));\n```\n\nReact 组件还可以拥有状态（state）和属性（props）。状态是在组件内部管理数据的方法，而 props 是父组件向子组件传递数据的方法。\n\
  \n例如，这是一个具有状态值和一个控制文本颜色属性的组件：\n\n```javascript\nimport React from \"react\";\nclass\
  \ Counter extends React.Component {\n  constructor(props) {\n    super(props);\n\
  \    this.state = {\n      count: 0\n    };\n  }\n  render() {\n    return (\n \
  \     <div>\n        <p style={{ color: this.props.color }}>\n          计数为 {this.state.count}。\n\
  \        </p>\n        <button onClick={() => this.setState({ count: this.state.count\
  \ + 1 })}>\n          加 1\n        </button>\n      </div>\n    );\n  }\n}\n```\n\
  \n要使用该组件，你可以为 `color` 属性传递一个值：\n\n```javascript\nReactDOM.render(<Counter color=\"\
  #00b8d4\" />, document.getElementById(\"root\"));\n```\n\n## Angular\n\nAngular\
  \ 是用于构建单页应用程序的全功能框架。它提供了一套约定和工具用于创建具有模块化架构的复杂应用程序。Angular 使用基于组件的架构，与 React 类似，但它提供了额外的功能，如依赖注入、路由和内置的\
  \ HTTP 客户端。它还有一种被称为 HTML 模板的模板语法，允许你使用类似 HTML 的语法定义组件的结构。\n\n要使用 Angular，你需要在 HTML\
  \ 文件中包含 Angular 库，并设置构建过程来编译你的代码。你可以使用 Angular CLI（命令行界面）工具设置开发环境并创建一个新的 Angular\
  \ 项目。\n\n\n\n\n一旦你配置好了 Angular，就可以开始创建组件了。Angular 中的组件是一个类，它定义了视图元素的属性和行为。你可以使用\
  \ `@Component` 装饰器来定义组件，并可以使用 `template` 或 `templateUrl` 属性来定义组件的 HTML 模板。\n\n这里有一个显示问候的简单组件示例：\n\
  \n```typescript\nimport { Component } from \"@angular/core\";\n\n@Component({\n\
  \  selector: \"app-greeting\",\n  template: `\n    <h1>Hello, World!</h1\n  `\n\
  })\nexport class GreetingComponent {\n  // 组件逻辑写在这里\n}\n```\n\n要使用该组件，你可以像这样将其包含在\
  \ HTML 文件中：\n\n```html\n<app-greeting></app-greeting>\n```\n\nAngular 组件还可以具有输入（inputs）和输出（outputs），这允许你在组件之间传递数据。例如，这里有一个组件，它有一个用于用户名的输入，以及在用户点击按钮时触发事件的输出：\n\
  \n```typescript\nimport { Component, Input, Output, EventEmitter } from \"@angular/core\"\
  ;\n\n@Component({\n  selector: \"app-user\",\n  template: `\n    <p>{{ userName\
  \ }}</p>\n    <button (click)=\"onClick()\">Click me</button>\n  `\n})\nexport class\
  \ UserComponent {\n  @Input() userName: string;\n  @Output() clicked = new EventEmitter<void>();\n\
  \  onClick() {\n    this.clicked.emit();\n  }\n}\n```\n\n要使用该组件，你可以这样绑定到 `userName`\
  \ 输入并监听 `clicked` 输出：\n\n```html\n<app-user [userName]=\"'John'\" (clicked)=\"handleClick()\"\
  ></app-user>\n```\n\nAngular 还提供了一个强大的路由系统，允许你为应用程序定义多个路由并在这些路由之间进行导航。你可以使用 `RouterModule`\
  \ 和 `Routes` 数组来定义路由。\n\n例如，以下是你可以为应用程序定义两个路由的方法：\n\n```typescript\nimport { NgModule\
  \ } from \"@angular/core\";\nimport { RouterModule, Routes } from \"@angular/router\"\
  ;\nimport { HomeComponent } from \"./home.component\";\nimport { AboutComponent\
  \ } from \"./about.component\";\n\nconst routes: Routes = [\n  { path: \"\", component:\
  \ HomeComponent },\n  { path: \"about\", component: AboutComponent }\n];\n\n@NgModule({\n\
  \  imports: [RouterModule.forRoot(routes)],\n  exports: [RouterModule]\n})\nexport\
  \ class AppRoutingModule {}\n```\n\n然后你可以使用 `routerLink` 指令创建指向不同路由的链接，并使用 `router-outlet`\
  \ 指令来定义当前路由的内容显示在哪里。\n\n```html\n<nav>\n  <a routerLink=\"/\">首页</a>\n  <a routerLink=\"\
  /about\">关于</a>\n</nav>\n<router-outlet></router-outlet>\n```\n\n## 结论\n\n在使用 JavaScript\
  \ 开发应用程序时，库和框架可以极地提高你的工作效率。它们提供了一系列工具和规范，可以帮助你编写更整洁、更易维护的代码，并更快地构建更复杂的应用程序。在本章中，我们探索了一些流行的库和框架，包括\
  \ jQuery、React 和 Angular。选择使用库还是框架取决于你的具体需求和偏好，但无论如何，你都能利用这些工具提供的强大功能。\n\n## 练习题\n\
  \n为了复这些概念，我们将通过一系列练习，旨在测试你的理解并应用你所学的知识。\n\n1. 编写一个 jQuery 函数，选择页面上所有的 `p` 元素，并在点击按钮时切换它们的可见性。\n\
  2. 编写一个 React 组件，显示一个包含两个输入字段（邮箱和密码）和一个提交按钮的表单。当表单提交时，显示一个包含输入字段值的警报框。\n3. 编写一个\
  \ Angular 组件，显示用户列表，每个用户都有名称和头像。该组件应该有一个用于用户列表的输入以及一个在用户被点击时触发事件的输出。\n4. 编写一个 jQuery\
  \ 函数，向 REST API 发起 AJAX 请求并在表格中显示结果。\n5. 编写一个 React 组件，使用 `useEffect` 钩子从 REST API\
  \ 获取数据并显示在列表中。\n\n## 答案\n\n### 编写一个 jQuery 函数，选择页面上所有的 `p` 元素，并在点击按钮时切换它们的可见性。\n\
  \n```javascript\n$(document).ready(function() {\n  $(\"button\").click(function()\
  \ {\n    $(\"p\").toggle();\n  });\n});\n```\n\n### 编写一个 React 组件，显示一个包含两个输入字段（邮箱和密码）和一个提交按钮的表单。当表单提交时，显示一个包含输入字段值的警报框。\n\
  \n```javascript\nimport React from \"react\";\n\nclass Form extends React.Component\
  \ {\n  handleSubmit(event) {\n    event.preventDefault();\n    const email = event.target.elements.email.value;\n\
  \    const password = event.target.elements.password.value;\n    alert(`Email: ${email}\
  \ Password: ${password}`);\n  }\n  render() {\n    return (\n      <form onSubmit={this.handleSubmit}>\n\
  \        <label>\n          Email:\n          <input type=\"email\" name=\"email\"\
  \ />\n        </label>\n        <br />\n        <label>\n          Password:\n \
  \         <input type=\"password\" name=\"password\" />\n        </label>\n    \
  \    <br>\n        <button type=\"submit\">Submit</button>\n      </form>\n    );\n\
  \  }\n}\n```\n\n### 编写一个 Angular 组件，显示用户列表，每个用户都有名称和头像。该组件应该有一个用于用户列表的输入以及一个在用户被点击时触发事件的输出。\n\
  \n```typescript\nimport { Component, Input, Output, EventEmitter } from \"@angular/core\"\
  ;\n\n@Component({\n  selector: \"app-user-list\",\n  template: `\n    <ul>\n   \
  \   <li *ngFor=\"let user of users\" (click)=\"handleClick(user)\">\n        {{\
  \ user.name }}\n        <img [src]=\"user.avatarUrl\" [alt]=\"user.name\" />\n \
  \     </li>\n    </ul>\n  `\n})\nexport class UserListComponent {\n  @Input() users:\
  \ any[];\n  @Output() userClicked = new EventEmitter<any>();\n  handleClick(user)\
  \ {\n    this.userClicked.emit(user);\n  }\n}\n```\n\n### 编写一个 jQuery 函数，向 REST\
  \ API 发起 AJAX 请求并在表格中显示结果。\n\n```javascript\n$(document).ready(function() {\n  $.ajax({\n\
  \    url: \"https://api.example.com/users\",\n    success: function(result) {\n\
  \      const table = $(\"<table>\");\n      result.forEach(function(user) {\n  \
  \      const row = $(\"<tr>\");\n        row.append(`<td>${user.name}</td>`);\n\
  \        row.append(`<td>${user.email}</td>`);\n        table.append(row);\n   \
  \   });\n      $(\"#result\").append(table);\n    }\n  });\n});\n```\n\n### 编写一个\
  \ React 组件，使用 `useEffect` 钩子从 REST API 获取数据并显示在列表中。\n\n```javascript\nimport React,\
  \ { useEffect, useState } from \"react\";\n\nfunction UserList() {\n  const [users,\
  \ setUsers] = useState([]);\n  useEffect(() => {\n    fetch(\"https://api.example.com/users\"\
  )\n      .then(response => response.json())\n      .then(result => setUsers(result));\n\
  \  }, []);\n  return (\n    <ul>\n      {users.map(user => (\n        <li key={user.id}>{user.name}</li>\n\
  \      ))}\n    </ul>\n  );\n}\n```\n\n## 调试和排查 JavaScript 代码\n\n除了调试，还有许多其他技术可以用于排查你的\
  \ JavaScript 代码。\n\n### 测试你的代码\n\n测试代码是开发过程中至关重要的部分。它可以帮助你确保代码是正确的并在不同的条件下按预期工作。可以使用多种类型的测试来验证你的代码，包括单元测试、集成测试和验收测试。\n\
  \n单元测试是小的、隔离的测试，用于验证特定的代码段（例如函数或模块）。它们通常运行速度很快，允许你隔离地测试单个组件。\n\n集成测试是验证多个组件之间相互作用的测试。它们运行速度通常比单元测试慢，并且需要更多的设置和配置。\n\
  \n验收测试是从用户的角度验证代码整体功能性的测试。它们可能涉及模拟用户输入并验证产生预期的输出。\n\n\n\n\n\n为你的 JavaScript 代码创建测试，你可以使用如\
  \ Jest 或 Mocha 等测试框架。这些框架为编写、运行测试以及生成测试报告提供了工具和规范。\n\n## 调试异步代码\n\n异步代码是指与程序其他部分并发执行的代码。JavaScript\
  \ 使用事件驱动的单线程模型来处理异步代码，这意味着异步代码在独立的执行上下文中执行，并可以通过用户输入、定时器或网络请求等事件触发。\n\n调试异步代码可能具有挑战性，因为代码执行的顺序可能并不明显。要调试异步代码，你可以使用浏览器的开发者控制台查看调用栈并设置断点。你还可以使用\
  \ `console.log` 函数输出中间值并追踪代码的执行情况。\n\n## 处理错误\n\n在软件开发中，错误是不可避免的，在代码中优雅地处理错误非常重要。JavaScript\
  \ 提供了几种处理错误的机制，包括 `try` 和 `catch` 语句以及 `throw` 语句。\n\n`try` 和 `catch` 语句允许你捕获并处理代码抛出的异常。`try`\
  \ 包含可能抛出异常的代码，而 `catch` 块包含在抛出异常时执行的代码。\n\n```javascript\ntry {\n // 可能会抛出异常的代码\n\
  } catch (error) {\n // 处理异常的代码\n}\n```\n\n`throw` 语句允许你手动抛出异常。这对于信号错误条件或控制代码执行流非常有用。\n\
  \n```javascript\nif (x > 100) {\n  throw new Error(\"x is too big!\");\n}\n```\n\
  \n在处理错误时，选择合适的粒度非常重要。你应该尝试捕获你可以处理的特定错误，让其他错误向上调用栈传播。你还应该考虑错误是否是可以恢复的，或者程序是否应该终止。\n\
  \n## 调试第三方代码\n\n有时你可能会在第三方代码（如库或框架）中遇到错误。调试第三方代码可能很有挑战，因为你可能无法访问源代码或文档。\n\n要调试第三方代码，你可以尝试以下技术：\n\
  \n* 使用浏览器的开发者控制台检查变量状态和调用栈。\n* 使用 `console.log` 函数输出中间值并追踪代码执行。\n* 使用断点暂停代码执行并检查状态。\n\
  * 在网上搜索常见问题的文档或解决方案。\n* 联系代码的维护者并寻求帮助。\n\n## 结论\n\n调试和故障排除是软件开发中的重要技能。通过使用本章讨论的工具和技术，你可以识别并修复\
  \ JavaScript 代码中的问题，并提高代码的质量和可靠性。\n\n## 练习\n\n为了复习这些概念，我们将完成一系列练习，旨在测试你的理解并应用你所学的知识。\n\
  \n1. 编写函数 `sum`，它接收两个数字作为参数并返回它们的和。使用 `console.log` 函数输出变量的中间值和最终结果。\n2. 编写函数 `divide`，接收两个数字作为参数并返回它们的商。使用\
  \ `try` 和 `catch` 语句处理第二个参数为 0 的情况。使用 `console.error` 函数输出错误信息。\n3. 编写函数 `parseInt`，接收一个字符串并返回字符串的整数值。使用\
  \ `console.log` 函数输出变量的中间值和最终结果。\n4. 编写函数 `sortArray`，接收一个数字数组并返回一个按升序排列的新数组。使用\
  \ `console.log` 函数输出变量的中间值和最终结果。\n5. 编写函数 `fetchData`，接收一个 URL 并返回一个解析为 URL 数据的\
  \ promise。使用 `console.log` 函数输出变量的中间值和最终结果。\n\n## 解决方案\n\n编写函数 `sum`，接收两个数字作为参数并返回它们的和。使用\
  \ `console.log` 函数输出变量的中间值和最终结果。\n\n```javascript\nfunction sum(a, b) {\n  console.log(`a:\
  \ ${a}, b: ${b}`);\n  const result = a + b;\n  console.log(`result: ${result}`);\n\
  \  return result;\n}\n\nconsole.log(sum(1, 2));  // 输出: 3\nconsole.log(sum(5, 7));\
  \  // 输出: 12\n```\n\n编写函数 `divide`，接收两个数字作为参数并返回它们的商。使用 `try` 和 `catch` 语句处理第二个参数为\
  \ 0 的情况。使用 `console.error` 函数输出错误信息。\n\n```javascript\nfunction divide(a, b) {\n\
  \  try {\n    if (b === 0) {\n      throw new Error(\"Cannot divide by 0\");\n \
  \   }\n    return a / b;\n  } catch (error) {\n    console.error(error);\n  }\n\
  }\n\nconsole.log(divide(4, 2));  // 输出: 2\nconsole.log(divide(4, 0));  // 输出: \"\
  Cannot divide by 0\"\n```\n\n编写函数 `parseInt`，接收一个字符串并返回字符串的整数值。使用 `console.log`\
  \ 函数输出变量的中间值和最终结果。\n\n```javascript\nfunction parseInt(str) {\n  console.log(`str:\
  \ ${str}`);\n  const result = Number.parseInt(str, 10);\n  console.log(`result:\
  \ ${result}`);\n  return result;\n}\n\nconsole.log(parseInt(\"123\"));  // 输出: 123\n\
  console.log(parseInt(\"hello\"));  // 输出: NaN\n```\n\n编写函数 `sortArray`，接收一个数字数组并返回一个按升序排列的新数组。使用\
  \ `console.log` 函数输出变量的中间值和最终结果。\n\n```javascript\nfunction sortArray(arr) {\n \
  \ console.log(`arr: ${arr}`);\n  const result = arr.sort((a, b) => a - b);\n  console.log(`result:\
  \ ${result}`);\n  return result;\n}\n\nconsole.log(sortArray([5, 3, 1, 4, 2]));\
  \  // 输出: [1, 2, 3, 4, 5]\nconsole.log(sortArray([100, 50, 0, 25, 75]));  // 输出:\
  \ [0, 25, 50, 75, 100]\n```\n\n编写函数 `fetchData`，接收一个 URL 并返回一个解析为 URL 数据的 promise。使用\
  \ `console.log` 函数输出变量的中间值和最终结果。\n\n```javascript\nfunction fetchData(url) {\n \
  \ console.log(`url: ${url}`);\n  return fetch(url)\n    .then(response => response.json());\n\
  }\n```\n\n## 感谢\n\n再次感谢选择《Learn JavaScript》。希望它能帮助你学习 JavaScript 的旅程并实现你的目标。请花一点时间与你的亲友分享，并为这本书写评论。我希望你的编程之旅不会此结束。如果你感兴趣，可以查看我写的其他书籍，或在以下处找到更多编程挑战：https://codeofcode.org\n\
  \n"
