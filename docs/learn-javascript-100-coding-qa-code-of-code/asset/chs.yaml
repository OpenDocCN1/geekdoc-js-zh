  \ (i > 0) {\n  console.log(i);\n  i--;\n}\n```\n\n## 定义和调用函数\n\n在 JavaScript 中，函数是执行特定任务的块代码。函数是任何编程语言中必不可的一部分，用于将较大的程序分成更小、更易于管理的部分。\n\
  \n在本文，我们将介绍 JavaScript 中定义和调用函数的基础知识，以及如何在代码中使用它们。\n\n### 定义函数\n\n在 JavaScript 中定义函数，你使用\
