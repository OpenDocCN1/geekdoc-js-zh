  \ sumArray([1, 2, 3, 4, 5]);\n```\n\n\n\n面向对象编程（OOP）是一种基于“对象”的编程范式，对象可以包含数据和功能。OOP\
  \ 的设计旨在更容易创建和维护复杂的软件系统。\n\n在 JavaScript 中，你可以通过定义“类”（classes）来使用面向对象编程，类作为创建对象“实例”（instances）的模板。类使用\
  \ `class` 关键字定义，后面紧跟类名以及一组包含类属性和方法的大括号。\n\n以下是在 JavaScript 中定义类的一个示例：\n\n```javascript\n\
