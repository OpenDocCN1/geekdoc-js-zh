  function sayHello() {\n  console.log(\"Hello, world!\");\n}\n```\n\n你也可以定义带参数的函数，参数是在函数被调用时传递给它的值。参数放在括号内，并用逗号隔开。\n\
  \n以下是定义带参数函数的示例：\n\n```javascript\nfunction greet(name) {\n  console.log(\"Hello,\
