  \n5. 在 C++ 程序中，可以一次性声明多个数据类型吗？`sum, age, group;`\n    a) 可以\n    b) 不可以\n\n6. C++\
  \ 中有多种数据类型。`double` 数据类型存储什么类型的信息？\n    a) 整数\n    b) 双整数\n    c) 小数\n\n7. 从用户输入中读取一个名为\
  \ `check` 的 `double` 类型数据的正确方式是什么？\n    a) `cout>>\"check\";`\n    b) `cin>>check;`\n\
  \    c) `cin<<check;`\n\n8. 从用户输入中读取一个名为 `sum` 的 `double` 类型数据的正确方式是什么？\n    a)\
  \ `cin<<sum;`\n    b) `cout>>sum;`\n    c) `cin>>sum;`\n\n9. 为什么整数不应该被其他整数除？\n \
  \   a) 它们的值会被截断\n    b) 你会收到错误消息而不是实际答案\n    c) 一旦执行该语句，你的程序就会崩溃\n\n## 使用修饰符与限定符\n\
  \n修饰符也可以用于各种类型。修饰符可以指示数字的符号，或提供关于变量的更详细信息。修饰符可用于字符、整数以及任何 `double` 类型。修饰符用于将变量调整为适合特定场景。\n\
  \n数据类型修饰符类型包括：\n\n* Unsigned（无符号）\n* Signed（有符号）\n* Short（短）\n* Long（长）\n\n![](img/00010.jpeg)![](img/00011.jpeg)\n\
  \n![](img/00012.jpeg)运行以下程序以更好地理解修饰符。\n\n程序的输出是：-15536 <-- 变量 1 和 变量 2 --> 50000。上述输出是由于将\
  \ 50000 表示为短无符号整数的位模式被短整型解释为 -15536。\n\nC++ 中有 3 种限定符。包括 `const`（常量）、`volatile`\
  \ 和 `restrict`。\n\n`const` 用于在程序运行时不能更改的对象。`volatile` 则相反，这种类型的变量中的值可能在程序运行过程中被更改，即使是以未明确指定的方式。带有\
  \ `restrict` 限定符的指针只能通过该指针进行访问。\n\n## 关键字\n\nC++ 与许多编程语言一样，也使用一组关键字。关键字是语言中具有特殊含义的单词，不能以任何其他方式使用。由于它们的特殊含义，它们被保留。\n\
  \n![](img/00013.jpeg)\n\n## 注释\n\n注释是任何程序的重要组成部分，它们允许读者或其他开发者理解程序的预期目的以及每一行代码的作用。\n\
  \n在代码中创建注释有两种方式。\n\n```\n/* 这是多行注释\n * 因为它可以跨越多行\n */\n```\n\n```\n//这是单行注释。\n```\n\
  \n## C++ 基础练习\n\n1. `<iostream>` 在编程中被称为？\n    a) 指令\n    b) 预处理指令\n    c) 文件\n\n\
