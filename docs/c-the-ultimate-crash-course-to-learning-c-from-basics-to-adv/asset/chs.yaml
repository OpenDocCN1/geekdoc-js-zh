- "# C++ 终极速成指南：从基础到高级\n\n# 引言\n\n如果你正在阅读这本书，说明你正在主动学习 C++。C++最初由比雅尼·斯特劳斯特鲁普于 1979\
  \ 年开发。它是一种通用且高效的编程语言，具有高度的不可替代性。\n\nC++是 C 编程语言的扩展。比雅尼对 SIMULA 语言及其面向对象模型的了解，帮助他为\
  \ C 语言创建了类扩展。它最初被命名为“带类的 C”，后来更名为 C++。\n\nC++具有多种特性，包括：\n\n* C++高效。\n* C++是一种静态编程语言。\n\
  * C++是一种面向对象的语言：使用对象可以通过类和对象将大型程序划分为更小的子集。\n* C++是多范式的：这使开发者可以自由选择他们想要使用的编程风格，共有\
  \ 7 种不同的风格可供选择。\n* C++使用标准库：这意味着 C++能够通过使用库中的项目来扩展其语言能力。\n\n学习 C++可以让你的简历提升到一个新的水平。它仍然被用于许多主要应用程序、游戏、浏览器等。人们不断开发和扩展\
  \ C++的功能。像 GitHub 这样的开源平台拥有成千上万个 C++仓库。\n\n随着 C++的发展，C++开发者的机会也在增加。在这些职位中，平均薪资可达\
  \ 10 万美元，每月有数千个职位发布。\n\n尽管这本书是一个完美的起点，但不要指望一夜之间学会 C++。这门语言需要练习、坚持和毅力。如果你想知道，不，你不需要先掌握\
  \ C 语言才能理解 C++。\n\n将以下章节和练习作为你 C++编程之旅的路线图，知识在等待着你。\n\n# 第 1 章 – 开始学习 C++\n\n![toptal-blog-image-1485966944883-7529aa202bf60d8bb7895e863c508d96](img/00001.jpeg)\n\
  \n在开始用 C++开发之前，你必须先搭建一个能够高效工作的环境。也就是说，你需要一种运行和编译 C++程序的方式。这可以通过多种方式实现，包括以下几种：\n\n\
  1. 在线：在线运行和编译程序是一种避免过多下载或安装新软件的简单方法。当需要快速运行程序时，这也是一个不错的选择。有很多网站支持这一功能。由于易于使用，本书将采用这种方式。Ideone.com\
  \ 是一个很好的选择。\n2. Mac OS X：可以使用名为 XCode 的程序在 MAC 操作系统上运行程序。可以从苹果开发者页面下载。强烈推荐使用最新版本。\n\
  3. Linux：为了在 Linux 机器上有效运行程序，你需要安装一个编译器。对于初学者或刚接触该操作系统编程的用户，推荐使用 GNU GCC 编译器。你还需要下载一个文本编辑器，例如\
  \ Gedit。\n4. Windows：由于 Windows 是一个标准且广泛使用的平台，有多个选项可供使用，包括 Code::Blocks、JGrasp 或\
  \ Eclipse。\n\n为了更好地理解 C++程序的结构，我们将使用“Hello World”作为模板。“Hello World”程序通常用于各种编程语言的初学者。\n\
  \n![](img/00002.jpeg)\n\n程序的第一行用于在程序中包含头文件。这允许你使用其中包含的操作。需要使用命名空间`std`才能准确引用各种操作。它还能帮助你不必在每个`cout`语句前都写`std`。这一行基本上指的是使用标准命名空间。\n\
  \n![2eb3bc66df182280fa0b08ff6fb319cd](img/00003.jpeg)\n\n第三行表示这是程序的`main`函数。程序的主体位于花括号内。`cout`语句用于打印引号内的内容，或者在某些情况下打印变量名。这取决于`cout`语句中列出的内容。花括号前的最后一行很重要，因为它本质上关闭或终止了程序的`main`函数。\n\
  \n如果你熟悉其他编程语言，很容易理解所有程序只是一系列有序的指令或命令，供计算机执行。这些指令由语句组成。语句是编程语言的最小单元，相当于英语中的句子。在 C++中，使用分号而不是句号来结束语句。变量的概念也是编程中广泛使用且非常重要的。变量是内存中一个空间的名称，可以根据程序的指令进行更改。\n\
  \n变量可以有多种类型。这些类型指示该变量中可以存储什么内容。变量类型包括：\n\n整数（`int`）——此变量类型仅存储不带小数的整数。例如 5 或 4509。它们必须至少为\
  \ 16 位。例如 7854 或 34。\n\n字符（`char`）——此类型指单个字符，如`'a'`，至少为 8 位。\n\n`float`——存储浮点值，如\
  \ 3.1555。通常为 32 位。\n\n`double`——与 float 类似，但精度是其两倍。通常为 64 位。\n\n布尔值（`bool`）——存储真/假值。\n\
  \n`void`——不能直接存储数据，但有点像占位符。\n\n![10321_0ea1_7](img/00004.jpeg)\n\n![](img/00005.jpeg)\n\
  \n## 使用变量\n\n变量是程序非常基本的组成部分。它们可以由字母数字组成，但必须以字母开头。变量在程序中的各种语句中使用。\n\n语句有 3 种类型，包括声明语句、赋值语句和输出语句。下面提供了所有类型的示例。\n\
  \n![](img/00006.jpeg)\n\n在程序中可以使用变量之前，必须先通过声明语句声明它。声明语句为内存中一个将保存特定值的位置赋予名称和类型。在上面的示例中，名称是`y`，类型是`double`。\n\
  \n赋值语句为变量`y`赋予一个特定值。在示例中，`y`被赋值为 20.5。\n\n输出语句只是打印特定项或变量的值。上面的示例输出为 20。\n\n![](img/00007.jpeg)\n\
  \n变量的声明和赋值也可以同时进行，这称为初始化。重要的是要记住，只有在定义变量时才进行初始化。\n\n![](img/00008.jpeg)\n\n变量也可以使用一条语句而不是多条语句一起声明。只需遵循下面的语法即可。\n\
  \n\n\n\n\n上述语句只是将 `x`、`y` 和 `z` 都声明为 `double` 类型（即十进制数）。\n\n## 练习题\n\n使用下面的练习题来确保你理解了\
