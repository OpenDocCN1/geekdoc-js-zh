  \  b) `\\\\Here is another comment\\\\`\n    c) `//Here is the last comment`\n\n\
  2. 从下列选项中，选出正确声明并初始化为 10 的变量：\n    a) `int a 10;`\n    b) `int b=10;`\n    c) `double\
  \ c=10;`\n\n3. 下列选项中，哪一项展示了如何声明一个名为 `number` 的 `double` 类型变量并将其初始化为 5？\n    a) `double\
  \ number 5;`\n    b) `double number =5`\n    c) `double number =5;`\n\n4. 以下哪一种是正确将名为\
