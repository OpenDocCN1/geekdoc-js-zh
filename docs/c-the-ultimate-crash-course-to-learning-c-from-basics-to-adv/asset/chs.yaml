  \ 3:`\n\n6.  case 是否总是需要花括号？正确还是错误。\n\n答案\n\n1.  ```\n    switch (grade){\n    case(1):\n\
  \        if (numAvg < 60)\n            grade = 'F';\n        break;\n    case(2):\n\
  \        if (numAvg < 70)\n            grade = 'D';\n        break;\n    case(3):\n\
  \        if (grade < 80)\n            grade = 'C';\n        break;\n    case(4):\n\
  \        if (grade < 90)\n            grade = 'B';\n        break;\n    default:\
  \ grade = 'A';\n    }\n    ```\n\n2.  C. Break\n\n3.  不可以，switch 中不能有条件。\n\n4. \
  \ 这是错误的，因为 case 不能包含条件。\n\n5.  这个语句没有错误。\n\n6.  错误。\n\n# 第 4 章 – 使用数组\n\n数组不仅可以将数据存储在一个变量名下，还可以以有序列表的格式存储元素，因此非常有用。它们最终用于组织大量数据和信息。当需要遍历数组时，循环是赋值和打印输出的非常实用的工具。\n\
  \n![dynamic](img/00032.jpeg)\n\n当你遇到像下面这样有多个变量的情况时，使用数组会更简单。下面的信息仅显示了 5 个人的年龄。\n\
  \n```\nint Person1=15;\nint Person2=24;\nint Person3=54;\nint Person4=33;\nint Person5=120;\n\
  ```\n\n与其将每个人声明为不同的变量，不如直接声明一个包含 5 个元素、存储不同人年龄的数组。\n\n该数组的声明如下：`int person_ages\
  \ [5];`\n\n```\nint person_ages [5];\n```\n\n数组类型为 `int`，这是要存储的信息的类型。第二个元素是数组名称，这里名称是\
  \ `person_ages`。方括号内的最后一个部分表示数组中的元素数量。\n\n## 初始化数组\n\n有两种方法可以初始化数组。第一种方法是直接列出数组位置并设置值。如下所示：\n\
  \n```\nperson_age[0]=43;\nperson_age[1]=49;\nperson_age[2]=5;\nperson_age[3]=10;\n\
  person_age[4]=70;\n```\n\n手动设置数组中的值时，也可以像下面这样设置：\n\n```\n// 初始化\nperson_age = {43,49,5,10,70};\n\
  ```\n\n虽然对于只有 5 个元素的数组来说，手动设置可能没问题，但当数组有 500 个元素时该怎么办？这时就需要使用 `for` 循环。使用循环更高效，工作量也更少，尽管其工作方式相同。下面的示例使用\
  \ `for` 循环遍历数组以进行打印，但同样的方法也可以用于初始化，具体取决于代码的功能。\n\n```\n#include <iostream>\nusing\
  \ namespace std;\n\nint main()\n{\n    int a; // a 是你的计数器变量\n    int person_age\
  \ [5];\n    ages={45,24,5,95,12};\n\n    for (a=0; a<5; a++) // 将 'a' 设为 0，当 'a'\
  \ 小于 5 时执行\n    {\n        cout<<person_age[a]<<endl;\n    }\n\n    return 0;\n\
  }\n```\n\n在你的环境中运行上述程序，观察其实际效果并查看打印内容。\n\n下面的示例展示了如何使用 `for` 循环来遍历数组的初始化过程，而不是手动设置。\n\
  \n```\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int a;\n\
  \    int person_ages [5];\n    for (a=0; a<5; a++)\n    {\n        cout<<\"请输入该人的年龄\"\
  <<endl;\n        cin>>ages[a];\n    }\n\n    for (a=0; a<5; a++)\n    {\n      \
  \  cout<<ages[a]<<endl;\n    }\n```\n\n\n\n\n\n```\n   }\n\nreturn 0;\n\n}\n```\n\
