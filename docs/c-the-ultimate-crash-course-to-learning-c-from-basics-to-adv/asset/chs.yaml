  \ of this type<<endl;`\n\n6. `end1` 是什么意思/它有什么作用？\n    a) 结束整个程序\n    b) 换行\n  \
  \  c) 什么也不做\n\n7. 所有 C++ 程序结束时返回什么数字？\n    a) 0\n    b) 04\n    c) 3\n\n# 第 2 章\
  \ – 基本输入与输出\n\n编程中最常见的功能之一就是输入和输出。在 C++ 中，输入和输出发生在流中。流也被称为字节序列。\n\n如果给定的字节来自键盘或磁盘驱动器并流向主内存，这被归类为输入操作。输出则被归类为字节从主内存流向屏幕或显示器。\n\
  \n![22750_d8c2_9](img/00015.jpeg)\n\n程序中的头文件行对于输入和输出至关重要。程序开头的 `<iostream>` 行是定义输入和输出对象的头文件。其他头文件类型包括\
  \ `<iomanip>` 和 `<fstream>`。\n\n## 使用 cout\n\n\n\n\n\n`cout` 对象是 `ostream` 类的一个实例，它连接到输出设备或显示器。这是一个相当简单的命令，大多数情况下与\
  \ `cin` 一起使用，但也可以单独使用。\n\n![](img/00016.jpeg)运行下面的程序，以便准确观察 `cout` 语句的工作方式。\n\n\
  上述程序的输出应为给定语句中 `c` 的正确值。\n\n该程序中需要注意的两个重要内容包括插入运算符 `<<` 和 `end1`。`end1` 用于在给定字符串行的末尾添加一个新行。`<<`\
  \ 可以多次使用，如上所示。\n\n## 使用 cin\n\n使用 `cin` 允许用户向给定变量输入信息。该对象属于 `istream` 家族，它连接到输入设备，通常类似于键盘。提取运算符与插入运算符相反，即\
  \ `>>`，如下面的程序示例所示。\n\n```\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n char petname[40];\n char yourname[60];\ncout << \"请输入你的宠物名字：\";\ncin >> petname;\n\
  cout << \"你的名字是：\" << petname << endl;\ncout << \"请输入你的全名：\";\ncin >> yourname;\n\
  cout << \"你的名字是：\" << yourname << endl;\n}\n```\n\n运行程序后，系统会提示你输入宠物的名字，然后将其打印出来。接着会提示你输入你的名字，同样会打印出来。\n\
  \n请自行尝试这个练习，以获得更多输入和输出的实践。\n\n1. ![](img/00017.jpeg)回答下面的提示，使输入值分别为 23、55.7 和 12。\n\
  \n# 第 3 章 – 条件语句\n\nC++ 编程中的另一个主要组成部分是条件语句的使用。条件语句是那些根据程序当前值导致程序改变其预期路径的语句。首先要讨论的最基本的条件语句之一是\
  \ `if` 语句。\n\n在深入探讨各种类型的条件语句之前，我们必须首先知道在语句中使用哪些关系运算符以及它们的含义。\n\n![361854_b364_4](img/00018.jpeg)\n\
  \n`>` 大于 `8 > 6` 真  \n`<` 小于 `1 < 9` 真  \n`>=` 大于或等于 `3 >= 0` 真  \n`<=` 小于或等于 `6\
  \ <= 10` 真  \n`==` 等于 `6 == 6` 真  \n`!=` 不等于 `7 != 3` 真  \n`&&` 与  \n`||` 或  \n\
  `!` 非\n\n## 使用 If 语句\n\n为了完全理解 C++ 中的 `if` 语句，你必须首先了解它们是如何工作的。\n\n`if` 语句的结构如下：\n\
  \n```\nif (真)\n{\n执行下一条语句\n}\nif (真)\n{\n    如果为真，执行此语句块\n}\nelse\n{\n    如果为假，执行此语句块\n\
  }\n```\n\n在第一个示例中，如果给定表达式为真，则执行该语句。然而，在第二个语句中，如果表达式为真，则执行该语句；如果表达式为假，则执行 `else`\
  \ 语句。\n\n![633832_b4e7_2](img/00019.jpeg)\n\n![](img/00020.jpeg)下面的程序将演示 `if` 语句如何操作和执行。\n\
  \n你可能已经猜到，有时需要多个 `if` 语句。因此，可以使用多个 `if` 语句。\n\n下面的示例程序展示了多个 `if` 语句如何执行。为了成功执行多个\
  \ `if` 语句，我们可以使用块。\n\n![](img/00021.jpeg)\n\n块本质上就是使用花括号 `{}`。使用这些花括号可以让用户告诉程序 `if`\
  \ 语句的起始和结束位置。如果没有指定块，程序足够智能，可以隐式地定义块。\n\n`if` 语句也可以通过使用 `else if` 链接在一起，如下面的程序所示。\n\
  \n除了能够输入链式 `if` 语句外，在 C++ 中嵌套 `if` 语句也是完全可行的。以下是嵌套函数的示例。\n\n![](img/00022.jpeg)上面的代码之所以令人困惑，仅仅是因为缺少花括号。在\
  \ `else` 周围添加块会使代码更清晰。这种歧义被称为悬空 else。\n\n![](img/00023.jpeg)\n\n仍然对如何实现 `if` 或 `if-else`\
  \ 语句感到困惑？使用下面的问题作为练习。\n\n1. 以下哪一项提供了 `if` 语句的正确结构？  \n   A. `if this then that`\
