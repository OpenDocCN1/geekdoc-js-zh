  \   c) `cout>>sum>>endl;`\n\n5. 在 C++ 程序中，可以一次性声明多个数据类型吗？`sum, age, group;`\n  \
  \  a) 可以\n    b) 不可以\n\n6. C++ 中有多种数据类型。`double` 数据类型存储什么类型的信息？\n    a) 整数\n   \
  \ b) 双整数\n    c) 小数\n\n7. 从用户输入中读取一个名为 `check` 的 `double` 类型数据的正确方式是什么？\n    a)\
  \ `cout>>\"check\";`\n    b) `cin>>check;`\n    c) `cin<<check;`\n\n8. 从用户输入中读取一个名为\
  \ `sum` 的 `double` 类型数据的正确方式是什么？\n    a) `cin<<sum;`\n    b) `cout>>sum;`\n    c)\
  \ `cin>>sum;`\n\n9. 为什么整数不能除以自身？\n    a) 它们的值会被截断\n    b) 你会收到错误消息而不是实际答案\n    c)\
  \ 一旦执行该语句，你的程序就会崩溃\n\n![b2157ce2-a04a-42c2-b7fa-f341fffbb8c9C_plus_plus_training](img/00009.jpeg)\n\
  \n## 解答\n\n1. 以下哪一种是 C++ 中编写注释的正确方式？\n    a) `/*Here is a comment*/`\n    b) `\\\
  \\Here is another comment\\\\`\n    c) `//Here is the last comment`\n\n2. 从下列选项中，选出正确声明并初始化为\
  \ 10 的变量：\n    a) `int a 10;`\n    b) `int b=10;`\n    c) `double c=10;`\n\n3. 下列选项中，哪一项展示了如何声明一个名为\
  \ `number` 的 `double` 类型变量并将其初始化为 5？\n    a) `double number 5;`\n    b) `double\
  \ number =5`\n    c) `double number =5;`\n\n4. 以下哪一种是正确将名为 `sum` 的整数打印到屏幕的方式？\n\
