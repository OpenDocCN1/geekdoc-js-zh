  # 第 5 章 – 指针\n\n指针使某些复杂任务变得更容易，而且它们使用起来相当简单。指针被定义为存储另一个变量地址的变量。与变量类似，在使用之前必须先定义它。\n\
  \n`type *var-name;`\n\n使用指针时，类型就是基类型的类型。例如，如果我的指针指向一个 double 变量，那么我的指针必须是 double\
  \ 类型。var-name 是指针的名称。必须使用星号来表示指针。\n\n```\nint    *int_point;    // 指向整数的指针\ndouble\
  \ *dou_point;    // 指向 double 的指针\nfloat  *flo_point;    // 指向 float 的指针\nchar \
  \  *ch_point;     // 指向字符的指针\n```\n\n以下示例展示了指针中存储的信息，运行以下代码以更好地理解指针。\n\n```\n#include\
  \  <iostream>\nusing  namespace std;\nint main ()  {\n int variable  =  10; // 实际变量声明\n\
  \ int *ipointer; // 指针变量\ncout <<  \"Value of variable: \";\ncout <<  variable \
  \ << endl;\n // 访问指针中地址处的值\ncout <<  \"Value of *ipointer variable: \";\ncout <<\
  \  *ipointer << endl;\n return  0;\n}\n```\n\n## 空指针\n\n被赋值为 NULL 的指针称为空指针。空指针在声明时被赋值。空指针通常是常量，其值为零。\n\
  \n## 指针运算\n\n由于指针存储数值，它们也能够执行基本的算术运算。\n\n在某些程序中，开发者可能选择使用指针而不是数组。部分原因是指针可以递增，而数组在没有循环的情况下无法递增。\n\
  \n以下程序展示了如何成功递增指针变量以访问数组的每个后续元素：\n\n```\n#include  <iostream>\nusing  namespace\
  \ std;\nconst  int MAX =  4;\nint main ()  {\n int var[MAX]  =  {10,  100,  200,\
  \ 300};\n int *ptr;\n // 将数组地址放入指针\nptr =  var;\n for  (int j =  0; j < MAX; j++)\
  \  {\ncout <<  \"Value of var[\"  << j <<  \"] = \";\ncout <<  *ptr << endl;\n //\
  \ 指向下一个位置\n      ptr++;\n }\n return  0;\n}\n```\n\n由于指针可以递增，它们也可以递减。运行以下代码以展示指针如何递减。\n\
  \n```\n#include  <iostream>\nusing  namespace std;\nconst  int MAX =  4;\nint main\
  \ ()  {\n int var[MAX]  =  {10,  100,  200,300};\n int *ptr;\nptr =  &var[MAX-1];\n\
  \ for  (int j = MAX; j >  0; j--)  {\ncout <<  \"Value of var[\"  << j <<  \"] =\
  \ \";\ncout <<  *ptr << endl;\n // 指向前一个位置\n      ptr--;\n }\n return  0;\n}\n```\n\
  \n除了递增和递减，指针还可以使用关系运算符进行比较。这包括 ==、< 和 > 等运算符。\n\n# 第 6 章 – 函数\n\n函数是非常有用的代码段，它们被编写出来以完成特定的任务。当它们一起使用时，可以创建更复杂、更整洁的程序。\n\
  \n函数的基本结构如下所示。请注意，原型是函数声明的另一种说法或分类。\n\n`return type name (data type variable, data\
  \ type variable....)`\n\n返回类型：返回类型指的是函数完成后将返回什么。例如，如果我要创建一个程序来计算大学生的平均年龄，我会使用 int，因为我不需要也不想要小数位。因此，截断是可以接受的。那么我的返回类型就是\
  \ int。\n\n名称：这只是函数的名称。使用同样的例子，我可以将这个函数命名为 average_age。\n\n数据类型：数据类型仅指变量。这些是函数可以接收并使用的项。可以是一个，也可以是多个。\n\
  \n函数的开头如下例所示。\n\n`int average_age(int x, int y)`\n\n原型的放置位置如下例所示。\n\n```\n#include\
  \ <iostream>\nint average_age (int x, int y);\nint main()\n{\n//主程序\nreturn 0;\n\
  }\ndouble mult (int x, int y) //注意没有分号\n{\n//函数将在这里编写\n}\n```\n\n运行以下示例程序以了解函数如何运作。以下程序中的函数用于将两个变量相加并返回它们的和。\n\
  \n```\n//完整的工作程序\n#include <iostream>\ndouble summation (int a, int b); // 原型\n\
  int main()\n{\nint x,y;\nint c;\ncin>>x;  //用户输入 x 的值\ncin>>y;  //用户输入 y 的值\nc =\
  \ summation(x,y); //调用 summation 函数，并传入已读取的变量\ncout<<\"The sum of the 2 numbers\
  \ is \"<<c<<endl;\nreturn 0;\n}\n```\n\n\n\n\n\n```\ndouble summation (int a, int\
  \ b) //定义函数\n{\n    double z;\n    //'a' 保存 'x' 的值，'b' 保存 'y' 的值\n    z = a+b;\n\
  \    return z; //将 'z' 的值返回给 main 中的变量 'c'\n}\n```\n\n除了返回数字或变量的函数外，还有不返回任何内容的函数。这些是\
  \ `void` 函数。\n\n`void sum (int x)`\n\n这仅仅意味着不会有任何值被返回，正如上一个示例所示。\n\n## 函数练习\n\n\
