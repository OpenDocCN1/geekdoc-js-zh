  \ 语句\n\n`break` 和 `continue` 语句会改变程序的正常流程。`break` 语句在出现时立即终止循环和 `switch` 语句（`switch`\
  \ 语句将在后面介绍）。\n\n`break` 语句可用于 `while`、`do while` 和 `for` 循环。下图展示了 `break` 在每种循环类型中的工作方式。\n\
  \n![](img/00029.jpeg)\n\n`continue` 语句用于跳过循环中的某些条件。该语句在条件语句内部使用。下图说明了 `continue`\
  \ 语句的工作方式。\n\n![](img/00030.jpeg)\n\n运行以下程序，观察 `continue` 语句在代码中的实际运行效果。\n\n```\n\
  #include <iostream>\nusing namespace std;\n\nint main()\n{\n    for (int j = 1;\
  \ j <= 10; ++j)\n    {\n        if ( j == 6 || j == 9)\n        {\n            continue;\n\
  \        }\n        cout << j << \"\\t\";\n    }\n    return 0;\n}\n```\n\n## Switch\
  \ 语句\n\n当需要多个 `if else` 语句时，可以使用 `switch` 语句。`switch` 语句通常比多个嵌套的 `if` 语句执行得更快，也更易于理解和编程。\n\
  \n`switch` 语句的语法如下：\n\n```\nswitch (n)\n{\n    case constant1:\n        // 如果 n\
  \ 等于 constant1 则执行的代码\n        break;\n    case constant2:\n        // 如果 n 等于 constant2\
  \ 则执行的代码\n        break;\n    default:\n        // 如果 n 不匹配任何常量则执行的代码\n}\n```\n\n\
  ![](img/00031.jpeg)\n\n上述语法和图示表明，当找到与 `n` 匹配的 case 常量时，程序的控制权会转移到相应的 case 块。代码块会一直执行，直到程序遇到\
  \ `break` 语句或到达块的末尾。\n\n## Switch 语句练习\n\n使用以下问题来练习 `switch` 语句及其用法。\n\n1.  编写一个程序，根据学生的数字成绩确定其字母等级。程序应输出该学生的字母等级。`switch`\
  \ 应判断成绩是 A、B、C、D 还是 F。\n\n2.  在 `switch` 中，每个 case 后面都有一个特定的东西。那是什么？\n\n3.  case\
