    ### is_permutation()


    该算法用于判断一个元素范围是否由另一个元素范围排列而成。下面给出了 `is_permutation()` 的使用示例。


    ![](img/00080.jpeg)


    总体而言，C++11 引入了许多变化。变化之多以至于有些人认为它几乎是一种不同的语言。你需要时间来适应这些变化，不要期望一夜之间就能全部理解。C++14 对
    C++11 引入的许多内容进行了重大修订。下一章将重点介绍这些组件及其示例。


    # 第 10 章 – 新版本：C++14


    C++14 于 2014 年 12 月发布。在发布之前，它常被称为“C++1y”。C++14 为核心语言添加了大量更新。在许多情况下，C++14 建立在 C++11
    添加的功能之上。总体而言，它是一个更轻巧的版本，对用户的影响较小。


    ![grade-28199_960_720](img/00081.jpeg)


    ## 返回类型推导


    C++11 引入了 lambda 表达式，并允许它们根据表达式确定返回类型。这个新版本将这一能力赋予了所有函数。需要使用 `auto` 来确定返回类型。


    ![](img/00082.jpeg)


    ## 放宽的 constexpr 限制


    ![cpp_lesson1](img/00083.jpeg)


    C++11 还引入了 `constexpr` 声明函数的概念。这本质上是一个可以在编译时执行的函数。在 C++11 中，`constexpr` 函数只能有一个表达式。


    C++14 减少了版本 11 中存在的限制数量。这些函数现在可以包含以下内容：


    *   除 `thread_local` 或静态变量类型或任何无初始化的声明之外的所有声明

    *   包含 `if` 语句和 switch 的条件

    *   包含 `for` 或 `while` 的任何循环语句


    在此版本的 C++ 中，禁止使用 `goto` 语句。


    ## 数字分隔符


    C++14 现在允许用户使用数字分隔符。这只是在数字字面量中使用单引号，包括整数和浮点数。


    这个特性虽然算不上惊天动地，但对于阅读数字很有用。分隔符不会改变数字的求值结果，除了可读性之外没有特别的编码优势。


    下面的示例展示了如何使用它。


    ![](img/00084.jpeg)


