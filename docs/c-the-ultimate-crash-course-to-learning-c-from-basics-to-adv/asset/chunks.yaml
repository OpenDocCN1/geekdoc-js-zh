    \n## Variable Template\n\nThe intended purpose of a variable template is to make\
    \ coding easier and simplify definitions and the use of constants.  A variable\
    \ template essentially is the definition for a group of variables. \n\nA variable\
    \ template is created by using a template declaration at the place at which a\
    \ variable is declared.\n\n ![C-4-562x309-OPx](images/00098.jpeg)\n\nThese are\
    \ simply a few of the features which were introduced with C++14.  A number of\
    \ other features were introduced but are not strong advancements. Some of the\
    \ minor features which were included with C++14 include sized deal locations and\
    \ some syntax tidying. Although the C++14 versioning does not compare to the major\
    \ updates in C++11 it is necessary.\n\n# Conclusion\n\nCongratulations, you have\
    \ reached the end of this book by learning and applying the things listed in each\
    \ chapter!  Remember that this is only the beginning.  In order to truly master\
    \ C++ you must continuously learn and apply the things you are learning.  Now\
    \ that you have begun your journey with C++ it is pertinent that you stay vigilant.\n\
    \nC++ is a general language that can work with a variety of huge systems, as well\
    \ as smaller ones. It is a prominent language when creating commercial apps. \
    \ There are large variety of items written in C++, these include:\n\n*   Operating\
    \ systems like Linux and Mac OS X\n\n*   Games like World of Warcraft and the\
    \ Diablo series\n\n*   Popular Wii, PlayStation & XBOX games\n\n*   Virtual Machines\
    \ for programming languages (These languages include Python, Java, Rudy, PFP,\
    \ Perl)\n\n*   Popular software like MS Office, Adobe Photoshop, Inventor and\
    \ AutoCAD)\n\n*   Web Browsers (Chrome, Internet Explorer and Firefox)\n\n*  \
    \ Many Apple iOS applications\n\nThis list proves that C++ is a general language\
    \ that has the power to do almost anything.\n\nIf you’re wondering if C++ will\
    \ still be relevant tomorrow or in the next 10 years, the answer is YES!\n\nC++\
    \ in conjunction with its predecessor C provide access to hardware and a high\
    \ level of abstraction.  It is the third most used language after C, which falls\
    \ behind Java as the number one.  As of now there is no rival in place to replace\
    \ C++. \n\nC++ is fast and able to effectively and efficiently use resources. \
    \ Most fair quality applications are created within C and C++ for embedded systems. \n\
    \nC++ was first commercially 1mplemented in October of 1985.  C++ has had continued\
    \ evolution throughout its life cycle and it follows a distinct set rules.  These\
    \ rules include the following.  These rules have been taken from Evolving a language\
    \ in and for the real world: C++ 1991-2006 by Bjarne Stroustrup.\n\n General\
    \ rules\n\n*   C++’s evolution must be driven by real problems.\n\n*   Don’t get\
    \ involved in a sterile quest for perfection.\n\n*   C++ must be useful now.\n\
    \n*   Every feature must have a reasonably obvious implementation.\n\n*   Always\
    \ provide a transition path.\n\n*   C++ is a language, not a complete system.\n\
    \n*   Provide comprehensive support for each supported style.\n\n*   Don’t try\
    \ to force people to use a specific programming style.\n\n Design support rules:\n\
    \n*   Support sound design notions.\n\n*   Provide facilities for program organization.\n\
    \n*   Say what you mean.\n\n*   All features must be affordable.\n\n*   It is\
    \ more important to allow a useful feature than to prevent every misuse.\n\n*\
    \   Support composition of software from separately developed parts.\n\n Language-technical\
    \ rules:\n\n*   No implicit violations of the static type system.\n\n*   Provide\
    \ as good support for user-defined types as for built-in types.\n\n*   Locality\
    \ is good.\n\n*   Avoid order dependencies.\n\n*   If in doubt, pick the variant\
    \ of a feature that is easiest to teach.\n\n*   Syntax matters (often in perverse\
    \ ways).\n\n*   Preprocessor usage should be eliminated.\n\n Low-level programming\
    \ support rules:\n\n*   Use traditional (dumb) linkers.\n\n*   No gratuitous incompatibilities\
    \ with C.\n\n*   Leave no room for a lower-level language below C++ (except assembler).\n\
    \n*   What you don’t use, you don’t pay for (zero-overhead rule).\n\n*   If in\
    \ doubt, provide means for manual control.\n\nOverall there are a multitude of\
    \ reasons why people use C++.  Simply put, C++ is:\n\n*   Flexible – C++ is flexible\
    \ because it has no limitations that would mandate a certain programming language\
    \ be used.  It can be used in a variety of application areas almost effortlessly.\n\
    \n*   Efficient – The fundamental concepts governing C++ mirror that of an everyday\
    \ computer.\n\n*   Available – On all computers there is generally an available\
    \ C compiler.  There are also tools and other resources available so that developers\
    \ do not need to write items from scratch.\n\n*   Portable – Porting items used\
    \ with C++ is fairly simple and generally feasible.\n\nYou have learned the differences\
    \ between C++11 an C++14, as well as what they have to offer.  However, your knowledge\
    \ doesn’t stop there.\n\nTo fully gain momentum in programming effectively and\
    \ efficiently using C++11 and C++14, you must continue to do so.  That involves\
    \ learning, reading and applying these things on a constant and consistent basis. \
    \ Soon you’ll be mastering C++17.  Although not yet released, it is important\
    \ to look ahead and be prepared for what is coming.\n\n ![Без названия](images/00099.jpeg)\n\
    \nRemember each version of C++ offers something new, unique and useful.  C++14\
    \ essentially built atop of C++11, as it should.  It advanced on areas in which\
    \ version 11 started but didn’t complete the job. \n\nThank you very much for\
    \ getting this book!\n\nI hope, that you will really enjoy reading it. If you\
    \ want to help me to produce more materials like this, then please leave a positive\
    \ review on Amazon.\n\nIt really does make a difference!\n\nI think next books\
    \ will also be interesting for you:\n\n[Windows 10](https://www.amazon.com/dp/B06XJ57Y5H)\n\
    \n ![C:\\Users\\User1\\Downloads\\Windows2017Kindle (1) (1).jpg](images/00100.jpeg)\n\
    \n[Java](https://www.amazon.com/dp/B01G7U2VNK)\n\n![raspberry](images/00101.jpeg)"
