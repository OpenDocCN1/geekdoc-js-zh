    \ in an array?\n   - a) pointers\n   - b) conditions\n   - c) loops\n\n# Chapter\
    \ 5 – Pointers\n\nPointer make certain complex tasks easier and they are fairly\
    \ simple to use. A pointer is defined as a variable that holds the address of\
    \ another variable. Much like a variable, before its use it must be defined.\n\
    \n`type *var-name;`\n\nWhen using a pointer, the type is whatever the type of\
    \ the base type is.  For example, if my pointer is pointing to a double variable,\
    \ my pointer must be a double. The var-name is the name of your pointer.  The\
    \ asterisk must be used in order to denote a pointer.\n\n```\nint    *int_point;\
    \    // pointer to an integer\ndouble *dou_point;    // pointer to a double\n\
    float  *flo_point;    // pointer to a float\nchar   *ch_point;     // pointer\
    \ to character\n```\n\nThe following example shows the information which is stored\
    \ in a pointer, run the following code to get a better understanding of pointers.\n\
    \n```\n#include  <iostream>\nusing  namespace std;\nint main ()  {\n int variable\
    \  =  10; // actual variable declaration.\n int *ipointer; // pointer variable\n\
    cout <<  \"Value of variable: \";\ncout <<  variable  << endl;\n // access the\
    \ value at the address available in pointer\ncout <<  \"Value of *ipointer variable:\
    \ \";\ncout <<  *ipointer << endl;\n return  0;\n}\n```\n\n## Null Pointers\n\n\
    A pointer that is assigned to NULL is referred to as a null pointer. A null pointer\
    \ is assigned at the time of declaration.  The null pointer is generally constant\
    \ and holds a value of zero.\n\n## Pointer Math\n\nBeing that pointers hold values\
    \ for numbers, they also have the ability to perform basic arithmetic functions.\n\
    \nIn some programs the developer may choose to use a pointer instead of an array.\
    \  This is in part because pointers can be incremented and arrays can’t, without\
    \ the help of a loop.\n\nThe following program shows how to successfully increment\
    \ the variable pointer to access each succeeding element of an array:\n\n```\n\
    #include  <iostream>\nusing  namespace std;\nconst  int MAX =  4;\nint main ()\
    \  {\n int var[MAX]  =  {10,  100,  200, 300};\n int *ptr;\n // let us have array\
    \ address in pointer.\nptr =  var;\n for  (int j =  0; j < MAX; j++)  {\ncout\
    \ <<  \"Value of var[\"  << j <<  \"] = \";\ncout <<  *ptr << endl;\n // point\
    \ to the next location\n      ptr++;\n }\n return  0;\n}\n```\n\nBeing that pointers\
    \ can be incremented, they can also be decremented.  Run the following code to\
    \ show how a pointer is decremented.\n\n```\n#include  <iostream>\nusing  namespace\
    \ std;\nconst  int MAX =  4;\nint main ()  {\n int var[MAX]  =  {10,  100,  200,300};\n\
    \ int *ptr;\nptr =  &var[MAX-1];\n for  (int j = MAX; j >  0; j--)  {\ncout <<\
    \  \"Value of var[\"  << j <<  \"] = \";\ncout <<  *ptr << endl;\n // point to\
    \ the previous location\n      ptr--;\n }\n return  0;\n}\n```\n\nAside from incrementing\
    \ and decrementing, pointers also have the ability to be compared using relational\
    \ operators.  This includes operators such as ==, <, and >.\n\n# Chapter 6 – Functions\n\
