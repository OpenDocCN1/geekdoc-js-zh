    # Chapter 10 – The New Versions: C++ 14


    C++14 was released in December of 2014. It was often coined “C++1y” up until its
    release. C++14 added a plethora of updates to the core language. In many instances
    C++14 builds upon functionality which was added within C++11. Overall it is a
    much daintier version with less impact on users.


    ![grade-28199_960_720](images/00081.jpeg)


    ## Return Type Deduction


    C++11 brought about the onset of lambda expressions and allowed them to determine
    the return type based on the expression. This newer version gave this ability
    to all functions. The use of `auto` is needed in order to determine the return
    type.


