    \ (a,b)`\n    c) `summation (b)`\n\n8. 如果有一个变量在函数内部声明，这是什么类型的变量？\n    a) 全局变量\n\
    \    b) 局部变量\n    c) 扩展变量\n\n9. 如果我们有一个函数 `double go (double b)`，我们能否在主程序中向它传递一个不同的变量，还是必须传递\
    \ `b`？例如 `go (x)`\n    a) 可以\n    b) 不可以\n\n# 第 7 章 – 类与对象\n\nC++ 的主要功能之一是在 C\
    \ 语言的基础上增加了面向对象特性。因此，类是 C++ 程序所涉及的特性之一。它们有时被称为用户定义类型。\n\n## 为什么使用类？\n\n类用于详细描述对象的结构。它还包含了操作对象及其任何特性所需的方法。类中的函数和数据被称为其成员。\n\
    \n## C++ 类定义\n\n实际上，类并不定义任何形式的数据类型。它仅仅是一个大纲或蓝图。类定义了类名的含义以及它所代表对象的组成部分。它还定义了对象可以执行哪些操作。\n\
    \n在定义类时，必须始终以关键字 `class` 开头。其后应立即跟上类的名称。然后是类体，所有内容必须用花括号括起来。类定义之后必须跟一个分号或声明列表，具体取决于用户的需求。以下是类声明的示例。\n\
    \n```\nclass  Person  {\n\n public:\n\n double weight; // 一个人的体重\n\n double height;\
    \ // 一个人的身高（英寸）\n\n int age; // 一个人的年龄\n\n};\n```\n\n如上所示，你会看到关键字 `public` 的使用。它用于确定类成员的访问级别。任何标记为\
    \ `public` 的内容都可以从类外部的任何地方访问，但仍处于类对象的作用域内。`Public` 并不是唯一的访问方式。内容也可以被描述为 `private`\
    \ 或 `protected`，这将在本章后面讨论。\n\n## 定义 C++ 对象\n\n由于类被认为是对象的蓝图，因此对象是从类创建的。对象的声明方式与声明变量相同。下面是上一节中开始定义的\
    \ person 对象的定义。\n\n```\nPerson Person1;          // 声明 Person1 为 Person 类型\nPerson\
    \ Person2;          // 声明 Person2 为 Person 类型\n```\n\n对象 `Person1` 和 `Person2`\
    \ 都将拥有自己的数据成员副本。\n\n## 访问数据成员\n\n![](img/00035.jpeg)\n\n任何 `public` 访问类型的数据成员都可以通过使用（`.`）来访问。这是访问运算符。\n\
    \n运行上面的程序，看看访问运算符是如何使用的，以及如何正确使用对象。请记住，`private` 和 `protected` 成员不能使用访问运算符（`.`）访问。\n\
    \n以上提供的信息只是对象和类的基本概述。有几个概念需要深入复习。\n\n## 类成员函数\n\n成员函数操作类的对象。它是定义在类定义内部的函数。除了在类定义内部，成员函数也可以在使用作用域解析运算符\
    \ `::` 时单独定义。这相当于将函数声明为 `inline`。\n\n上述示例如下所示。\n\n![](img/00036.jpeg)\n\n![](img/00037.jpeg)\n\
    \n## 类成员修饰符\n\n`Public`、`private` 和 `protected` 对类体内的不同类成员提供访问限制。这些关键字可以称为说明符。一个类可以有多个不同访问级别的块。默认情况下，成员和类的访问类型为\
    \ `private`。\n\n![](img/00038.jpeg)\n\n## 构造函数与析构函数\n\n构造函数是每当创建新对象时都会执行的一个类函数。它们与类同名，但没有任何返回类型或\
    \ `void`。下面的示例展示了如何使用构造函数。\n\n![](img/00039.jpeg)\n\n虽然构造函数通常没有参数，但它仍然可以有参数。这有助于你在创建对象时赋值。下面是一个带参数构造函数的示例。\n\
    \n![](img/00040.jpeg)\n\n当对象超出作用域时，析构函数会被执行。当对指向对象的指针应用 `delete` 表达式时，它也会被执行。\n\
    \n析构函数与类同名，但前面带有波浪号。它不能返回任何值，也不能接受参数。它在释放资源时非常有用。以下是析构函数的示例。\n\n![](img/00041.jpeg)\n\
    \n## 友元函数\n\n"
