    \n如果给定的字节来自键盘或磁盘驱动器并流向主内存，这被归类为输入操作。输出则被归类为字节从主内存流向屏幕或显示器。\n\n![22750_d8c2_9](img/00015.jpeg)\n\
    \n程序中的头文件行对于输入和输出至关重要。程序开头的 `<iostream>` 行是定义输入和输出对象的头文件。其他头文件类型包括 `<iomanip>`\
    \ 和 `<fstream>`。\n\n## 使用 cout\n\n"
- fmt: "\nThe `cout` object is an instance of the `ostream` class, which is connected\
    \ to the output device or monitor. This is a fairly simple command and is most\
    \ times used in conjunction with `cin` although it can be used without it.\n\n\
    ![](images/00016.jpeg)Run the program below in order to accurately see the `cout`\
    \ statement at work.\n\nThe output for the above program should be the correct\
    \ value of `c`, with the given statement.\n\nTwo important things to note in this\
    \ program include the insert operator, `<<` and the `end1`. The `end1` is used\
    \ to add a new line to the end of the given string line. The `<<` can be used\
    \ multiple times, as we can see above.\n\n## Using cin\n\nThe use of `cin` allows\
    \ the user to input information into a given variable. This object belongs to\
    \ the `istream` family, which is attached to the input device which is generally\
    \ a device similar to a keyboard. The extraction operator is the opposite of the\
    \ insertion operator. It is simply `>>`, which will be seen in the program example\
    \ below.\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n char\
    \ petname[40];\n char yourname[60];\ncout << \"Please enter the name of your pet:\
    \ \";\ncin >> petname;\ncout << \"Your name is: \" << petname << endl;\ncout <<\
    \ \"Please enter your full name: \";\ncin >> yourname;\ncout << \"Your name is:\
    \ \" << yourname << endl;\n}\n```\n\nUpon running the program, you will be prompted\
    \ to enter in your pet’s name. It will then be printed. You will then be prompted\
    \ to enter your name and it will be printed as well.\n\nTry this exercise on your\
    \ own for more input and output practice.\n\n1. ![](images/00017.jpeg)Answer the\
    \ prompt below so that the input amounts are 23, 55.7 and 12.\n\n# Chapter 3 –\
    \ Conditionals\n\nAnother major component in C++ programming is the use of conditionals.\
    \ Conditionals are statements that cause a program to alter its intended path\
    \ based on a program’s current value. One of the first and most basic conditional\
    \ statements to be discussed is an `if` statement.\n\nBefore going into various\
    \ types of conditional statements we must first know which relational operands\
    \ to use within our statements and what they mean.\n\n![361854_b364_4](images/00018.jpeg)\n\
    \n`>` Greater Than `8 > 6` TRUE  \n`<` Less Than `1 < 9` TRUE  \n`>=` Greater\
    \ Than or Equal `3 >= 0` TRUE  \n`<=` less than or equal `6 <= 10` TRUE  \n`==`\
    \ equal to `6 == 6` TRUE  \n`!=` not equal to `7 != 3` TRUE  \n`&&` AND  \n`||`\
    \ OR  \n`!` NOT\n\n## Using If Statements\n\nIn order to fully understand `if`\
    \ statements within C++ you must first understand how they function.\n\nThe structure\
    \ of an `if` statement is as follows:\n\n```\nif (TRUE)\n{\nPerform the next statement\n\
    }\nif (TRUE)\n{\n    Perform this block of statements if True\n}\nelse\n{\n  \
    \  Perform this block of statement if False\n}\n```\n\nIn the first example, if\
    \ the given expression is true, the statement will implement. However, in the\
    \ second statement, if the statement is true, the statement will execute but if\
    \ the statement is false, the `else` statement will execute.\n\n![633832_b4e7_2](images/00019.jpeg)\n\
    \n![](images/00020.jpeg)The following program will demonstrate how `if` statements\
    \ operate and execute.\n\nAs you may have guessed, there will also be times when\
    \ more than one `if` statement is needed. Therefore, multiple `if` statements\
    \ can be used.\n\nThe example program below shows how multiple `if` statements\
    \ execute. In order to successfully execute multiple `if` statements we can use\
    \ a block.\n\n![](images/00021.jpeg)\n\nBlocks are essentially the use of the\
    \ brackets `{}`. Using these brackets allows the user to tell program where to\
    \ start and end an `if` statement. In the event that the blocks are not specified\
    \ the program is smart enough to implicitly define blocks.\n\n`if` statements\
    \ can also be chained together by using `else if` as shown in the program below.\n\
    \nAside from the ability to input chained `if` statements, nesting `if` statements\
    \ are also very possible to do in C++. The following is an example of nesting\
    \ functions.\n\n![](images/00022.jpeg)The above code is confusing simply because\
    \ of the missing brackets. Adding blocks around the `else` would make the code\
    \ clearer. This ambiguity is known as a dangling else.\n\n![](images/00023.jpeg)\n\
    \nStill confused on how to implement an `if` or `if-else` statement. Use the questions\
    \ below as practice.\n\n1. Which of the following provide the correct structure\
    \ for an `if` statement?  \n   A. `if this then that`  \n   B. `if { expression}`\
    \  \n   C. `if ( expression )`  \n   D. `else expression if`\n\n2. Write a program\
    \ that allows the user to input a number into the system. The program should then\
    \ tell the user 2 separate statements if the number is greater than or less than\
    \ 50. This will be done using input and condition statements. If the number is\
    \ greater than 50 the program should print, “Wow, this number is big”. If the\
    \ number is less than 50 the program should print, “Yikes, this number is too\
    \ small”.\n\n3. If `x` is equal to 10 and `y` is equal to 30 will this condition\
    \ execute? `if(x > y)`  \n   a) yes  \n   b) no\n\n4. What do conditions do for\
    \ programs?  \n   a) improves processing  \n   b) adds flexibility to a program\
    \ while lessening its length  \n   c) breaks them\n\n5. What does an `else` statement\
    \ do?  \n   a) gives an alternative route to the given conditions  \n   b) never\
    \ executes  \n   c) it looks good in the program\n\n6. What do the following condition\
    \ mean within the context of a conditional? `if (a!=b)`  \n   a) `a` is equal\
    \ to `b`  \n   b) checks if `a` does not equal `b`  \n   c) None of the above\
    \ are true\n\n7. In an `if` statement when do you need the curly braces?  \n \
    \  a) always  \n   b) generally they should be used where there are 2 or more\
    \ lines in the condition statement.  \n   c) never\n\n8. What does the following\
    \ condition mean in plain English? `if (y!=x)`  \n   a) if `y` doesn't equal `x`\
    \  \n   b) if `x` doesn't equal `y`  \n   c) if `x` is less than `y`\n\n9. If\
    \ `a` is equivalent to 20 and `b` is equivalent to 20 will this condition execute?\
    \ `if (a!=b)`  \n   a) yes  \n   b) no\n\n10. What does the following statement\
    \ mean? `if (a==b)`  \n    a) if `a` is greater than `b`  \n    b) if `a` is equal\
    \ to `b`  \n    c) if `b` is greater than or equal to `a`\n\n11. If `x` is equivalent\
    \ to 20 and `y` is equals to 8 is the following condition able to be executed?\
    \ `if(x<=y)`  \n    a) yes  \n    b) no\n\nSolutions\n\n1. C.\n\n2. ```\n   #include\
    \ <iostream>\n   using namespace std;\n   int main()\n   {\n       cout << \"\
    Enter your number \" << endl;\n       int number;\n       cin >> number;\n   \
    \    if(value < 50)\n       {\n           cout << \"Yikes, this number is too\
    \ small\";\n       }\n       else\n       {\n           cout << \"Wow, this number\
    \ is big.\";\n       }\n       return 0;\n   }\n   ```\n\n3. b) no\n\n4. b) adds\
    \ flexibility to a program while lessening its length\n\n5. a) gives an alternative\
    \ route to the given conditions\n\n6. b) checks if `a` does not equal `b`\n\n\
    7. b) generally they should be used where there are 2 or more lines in the condition\
    \ statement.\n\n8. a) if `y` doesn't equal `x`\n\n9. b) no\n\n10. b) if `a` is\
    \ equal to `b`\n\n11. b) no\n\n## Loops\n\nAside from conditional statements,\
    \ loops are utilized when parts of code need to be repeated. Instead of rewriting\
    \ or copying sections of code, loops are used. Loops allow a user to repeat certain\
    \ portions of code over and over until its completion.\n\nThe simplest loop which\
    \ exists in a C++ program is the `for` loop. The syntax for a `for` loop is as\
    \ follows:\n\n```\nfor ( variable initialization; condition; variable update )\
    \ {\n  Statements to be executed as long as condition, in parentheses is true.\n\
    }\n```\n\nLoops utilize 2 operands you must be familiar with in order to progress\
    \ any further. These are the increment and decrement symbols (`++` & `--`).\n\n\
    In order to further break down the structure of a `for` loop, see the example\
    \ below.\n\n![](images/00024.jpeg)\n\nThe code in the `for` loop above will execute\
    \ until the counter variable reaches 4. Once the variable reaches 5, it will no\
    \ longer execute since it will not meet the `for` loop condition.\n"
