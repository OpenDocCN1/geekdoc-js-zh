    \ it have to be `b`. For example, `go (x)`\n    a) yes\n    b) no\n\n# Chapter\
    \ 7 – Classes & Objects\n\nOne of the main functions of C++ is the addition of\
    \ object orientation to the C language. Due to this, classes one of the features\
    \ involved in C++ program. These are referred to at times as user defined types.\n\
    \n## Why are Classes Used?\n\nClasses are used in order to detail the structure\
    \ of an object. It also encompasses the methods which are needed to manipulate\
    \ the object and any of its characteristics. The functions and data within a class\
    \ are referred to as its members.\n\n## C++ Class Definitions\n\nIn reality, a\
    \ class does not define any type of formal data. It is simply an outline or a\
    \ blueprint. The class defines the meaning of the class name as well the components\
    \ of the object it represents. It also defines what operations can be performed\
    \ by the object.\n\nWhen defining a class, you must always start with the keyword,\
    \ `class`. This should be immediately followed by the name of the class. The class\
    \ body should then follow and all must be enclosed by curly brackets. The class\
    \ definition must then be followed by a semi colon or list of declaration depending\
    \ on the user’s needs. The following is an example of class declarations.\n\n\
    ```\nclass  Person  {\n\n public:\n\n double weight; // weight of a person\n\n\
    \ double height; // height in inches of a person\n\n int age; // age of a person\n\
    \n};\n```\n\nShown above, you will see the use of the keyword `public`. This is\
    \ used to determine the level of access the members of the class will have. Anything\
    \ marked as `public` can be accessed from anywhere outside of the class but still\
    \ within the scope of the class object. `Public` is not the only access method.\
    \ Things may also be described as `private`, or `protected`, which will be discussed\
    \ later in the chapter.\n\n## Define C++ Objects\n\nSince a class is said to be\
    \ the blueprint for an object, it makes sense that objects are created from classes.\
    \ Objects are declared the same way that we would declare a variable. Find below\
    \ the definitions of the person object which was started in the previous section.\n\
    \n```\nPerson Person1;          // Declare Person1 of type Person\nPerson Person2;\
    \          // Declare Person2 of type Person\n```\n\nBoth of the objects `Person1`\
    \ and `Person2` will have their own copy of data members.\n\n## Accessing the\
    \ Data Members\n\n![](images/00035.jpeg)\n\nAny data member of a `public` access\
    \ type may be used by simply using (`.`). This is the access operator.\n\nRun\
    \ the program above to see how the access operator is used and how to correctly\
    \ use objects. Please remember that items which are `private` and `protected`\
    \ members cannot be accessed using the access operator (`.`).\n\nThe information\
    \ provided above is simply a basic overview of objects and classes. There are\
    \ several concepts to review in depth.\n\n## Class Member Functions\n\nMember\
    \ functions operate on objects of a class. It is function that has its definition\
    \ within the class definition. Aside from within the class definition, member\
    \ functions can also be defined separately when the scope resolution operator,\
    \ `::`. This would be declaring the function `inline`.\n\nThe above examples are\
    \ shown below.\n\n![](images/00036.jpeg)\n\n![](images/00037.jpeg)\n\n## Class\
    \ Member Modifiers\n\n`Public`, `private` and `protected` provide access restrictions\
    \ to varies class members within the class body. These keywords can be called\
    \ specifiers. A class has the ability to have multiple blocks of varying access\
    \ levels. Members and classes, by default, have an access type of `private`.\n\
    \n![](images/00038.jpeg)\n\n## Constructors & Deconstructors\n\nA constructor\
    \ is a function of a class that gets implemented whenever new objects are created.\
    \ They have the same name as the class but do not have any return or `void`. The\
    \ example below shows how constructors are used.\n\n![](images/00039.jpeg)\n\n\
    Although a constructor generally does not have parameters, it still has the ability\
    \ to. This aids you in assigning values at the time of object creation. An example\
    \ of a parameterized constructor is shown below.\n\n![](images/00040.jpeg)\n\n\
    A deconstructor is executed when an object goes out of scope. It is also executed\
    \ when the `delete` expression is applied to a pointer to the object.\n\nA deconstructor\
    \ has the same name as the class but is prefixed with a tilde. It can not return\
    \ or take parameters. It is useful when releasing resources. The following is\
    \ an example of a deconstructor.\n\n![](images/00041.jpeg)\n\n## Friend Functions\n"
