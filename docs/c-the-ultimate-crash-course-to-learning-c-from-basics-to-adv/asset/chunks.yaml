    ## 新的 C++ 算法


    C++11 还引入了多种新算法。确切地说是 8 种算法。这些新算法包括：


    *   `all_of()`

    *   `any_of()`

    *   `none_of()`

    *   `is_sorted()`

    *   `is_sorted_until()`

    *   `is_partitioned()`

    *   `is_permutation()`

    *   `minmax_element()`


    ### All_of、any_of、none_of 算法


    这三种算法非常相似。它们本质上检查一元谓词是否对无、全部或部分元素返回 true。


    ![](img/00072.jpeg)


    ### is_sorted()


    该算法本质上检查指定范围内的元素是否按升序排序。范围内的元素使用 `operator<` 进行比较，也使用二元比较函数 `comp` 进行比较。


    下面给出了其用法示例以及输出结果。


    ![](img/00073.jpeg)


    ![](img/00074.jpeg)


    ### is_sorted_until()


    该算法与 `is_sorted()` 算法类似。它执行相同的功能，检查一组元素是否按升序排序，但此算法返回一个迭代器。该迭代器指向最大子范围的上界，该范围当然是已排序的。以下是一个使用
    `is_sorted_until()` 的程序示例及其输出。


    ![](img/00075.jpeg)


    ![](img/00076.jpeg)


    ### is_partitioned()


    该算法正如其名所暗示的那样工作。它检查一个范围是否已分区。这意味着它检查一个范围是否根据给定的一元谓词进行了排序。所有不满足给定谓词的元素必须出现在满足谓词的元素之后。


    以下程序展示了如何使用 `is_partitioned()` 算法。


    ![](img/00077.jpeg)


    ### minmax_element()


    `minmax_element()` 算法在给定范围内查找最小值和最大值。成功运行后，它会返回一对指向相应元素的迭代器。关于此算法，我们需要记住三点：


    *   当给定范围没有值或为空时，算法将简单地返回 `std::make_pair(first, first)`。

    *   如果给定值集合中有多个最小值，它将简单地返回第一个。

    *   如果给定值集合中有多个最大值，它将简单地返回最后一个。


    以下代码展示了该函数的使用及其输出：


    ![](img/00078.jpeg)


