    ## New C++ Algorithms


    C++11 also introduces a variety of new algorithms. 8 algorithms to be exact. These
    new algorithms include


    *   `all_of()`

    *   `any_of()`

    *   `none_of()`

    *   `is_sorted()`

    *   `is_sorted_until()`

    *   `is_partitioned()`

    *   `is_permutation()`

    *   `minmax_element()`


    ### All_of, any_of, none_of Algorithms


    These three algorithms are very similar. They essentially check if the unary predicate
    returns true for none, all or some.


    ![](images/00072.jpeg)


    ### is_sorted()


    This algorithm essentially checks to see if the elements within a specific range
    are sorted in ascending order. The elements within this range are compared using
    `operator<`. They are also compared using `comp`, the binary comparison function.


    An example of its usage can be found below, along with its given output.


    ![](images/00073.jpeg)


    ![](images/00074.jpeg)


    ### is_sorted_until()


    This algorithm is similar to the `is_sorted()` algorithm. It performs the same
    function by checking if a set of elements are sorted in ascending order however
    this algorithm returns an iterator. This iterator is to the upper bound which
    is of the largest sub range. This range is sorted of course. The following provides
    an example of a program using `is_sorted_until()` and its given output.


    ![](images/00075.jpeg)


    ![](images/00076.jpeg)


    ### is_partitioned()


    This algorithm does exactly what you would think based on its name. It checks
    to see if a range is partitioned. This means, it checks to see if a range is sorted
    according to a given unary predicate. All elements which do not satisfy the given
    predicate must be returned after those which do.


    The following program is an example of how to use the `is_partitioned()` algorithm.


    ![](images/00077.jpeg)


    ### minmax_element()


    The `minmax_element()` algorithm finds the minimum and maximum number within a
    given range. Once it is successfully ran, it returns a pair of iterators for the
    corresponding elements. Three things we must remember about this algorithm include:


    *   When a given range has no values or is otherwise empty, the algorithm will
    simply return `std::make_pair(first, first)`.

    *   If there are multiple minimums within a given set of values it will simply
    return the first one.

    *   If there are multiple maximums within a given set of values it will simply
    return the last one.


    The function can be seen in action within the following code, with its given output:


    ![](images/00078.jpeg)


    ![](images/00079.jpeg)


    ### is_permutation()


    This algorithm is used to determine if one range of elements is permutated from
    a different elements range. An example of `is_permutation()` in action can be
    found below.


    ![](images/00080.jpeg)


