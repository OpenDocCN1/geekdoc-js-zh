    ## Relaxed Restrictions constexpr


    ![cpp_lesson1](images/00083.jpeg)


    C++11 also brought about the notion of `constexpr`-declared function. This is
    essentially a function which can be executed at the time of compile. In C++11
    a `constexpr` function could only have one expression.


    C++14 decreased the amount of restrictions which were present in version 11. These
    functions are now able to include the following:


    *   All declarations except `thread_local` or static variable types or any declarations
    without initialization

    *   Conditions including `if` statements and switches

    *   Any loop statements including `for` or `while`


    The use of `goto` statements has been forbidden in this version of C++.


