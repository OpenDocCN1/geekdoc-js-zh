    \nint main()\n{\n    int a;\n    int person_ages [5];\n    for (a=0; a<5; a++)\n\
    \    {\n        cout<<\"请输入该人的年龄\"<<endl;\n        cin>>ages[a];\n    }\n\n  \
    \  for (a=0; a<5; a++)\n    {\n        cout<<ages[a]<<endl;\n    }\n```\n\n"
