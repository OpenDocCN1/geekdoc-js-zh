  trans: "\n在 C++14 出现之前，像 `11111101` 这样的二进制字面量是不被支持的。要使用它们，需要先转换为支持的类型。以下代码片段展示了它们在编程中的用法。\n\
    \n![](img/00097.jpeg)\n\n二进制字面量以 `0b` 或 `0B` 开头，后面跟着一串 0 和 1。许多其他编程语言中也能找到类似的语法，包括\
    \ Java、Perl 和 Python，这些语言都已经支持二进制字面量。\n\n二进制字面量的类型是 `int`。它可以在任何接受常量字面量的地方使用。\n\
    \n## 变量模板\n\n变量模板的初衷是让编码更简单，并简化常量的定义和使用。变量模板本质上是一组变量的定义。\n\n在声明变量的位置使用 `template`\
    \ 声明即可创建变量模板。\n\n ![C-4-562x309-OPx](img/00098.jpeg)\n\n这些只是 C++14 引入的部分特性。虽然还引入了其他一些特性，但都不是重大的进步。C++14\
    \ 包含的一些次要特性包括有大小定义的释放操作和一些语法整理。尽管 C++14 的版本更新无法与 C++11 的重大更新相比，但它仍然是必要的。\n\n#\
    \ 结论\n\n恭喜你！通过学习和应用各章节中列出的内容，你已经读完了这本书！请记住，这仅仅是个开始。要真正掌握 C++，你必须持续学习并应用所学知识。既然你已经踏上了\
    \ C++ 的学习之旅，保持警惕至关重要。\n\nC++ 是一种通用语言，既能用于大型系统，也能用于小型系统。在创建商业应用时，它是一种重要的语言。用 C++\
    \ 编写的项目种类繁多，包括：\n\n*   操作系统，如 Linux 和 Mac OS X\n*   游戏，如《魔兽世界》和《暗黑破坏神》系列\n*  \
    \ 流行的 Wii、PlayStation 和 XBOX 游戏\n*   编程语言的虚拟机（这些语言包括 Python、Java、Rudy、PFP、Perl）\n\
    *   流行软件，如 MS Office、Adobe Photoshop、Inventor 和 AutoCAD\n*   网页浏览器（Chrome、Internet\
    \ Explorer 和 Firefox）\n*   许多 Apple iOS 应用\n\n这份清单证明，C++ 是一种几乎无所不能的通用语言。\n\n如果你想知道\
    \ C++ 在未来或未来 10 年内是否仍然重要，答案是肯定的！\n\nC++ 及其前身 C 提供了对硬件的访问和高层次的抽象。它是使用率第三高的语言，仅次于\
    \ C，而 C 则落后于排名第一的 Java。目前还没有能取代 C++ 的竞争对手。\n\nC++ 速度快，能够高效地利用资源。大多数质量尚可的嵌入式系统应用都是用\
    \ C 和 C++ 创建的。\n\nC++ 于 1985 年 10 月首次商业化发布。C++ 在其生命周期中不断演进，并遵循一套明确的规则。这些规则如下，摘自\
    \ Bjarne Stroustrup 的《在现实世界中演化语言：C++ 1991-2006》。\n\n### 通用规则\n\n*   C++ 的演进必须由实际问题驱动。\n\
    *   不要陷入对完美无意义的追求。\n*   C++ 必须在当下有用。\n*   每个特性都必须有合理明显的实现方式。\n*   始终提供过渡路径。\n\
    *   C++ 是一种语言，而不是一个完整的系统。\n*   为每种支持的风格提供全面支持。\n*   不要试图强迫人们使用特定的编程风格。\n\n###\
    \ 设计支持规则：\n\n*   支持合理的设计理念。\n*   提供程序组织的设施。\n*   表达你的意图。\n*   所有特性都必须是可负担的。\n\
    *   允许一个有用的特性比防止所有误用更重要。\n*   支持由独立开发的部件组合成软件。\n\n### 语言技术规则：\n\n*   不隐式违反静态类型系统。\n\
    *   为用户定义类型提供与内置类型同等的支持。\n*   局部性是好事情。\n*   避免顺序依赖。\n*   如有疑问，选择最容易教授的特性变体。\n\
    *   语法很重要（通常以反常的方式）。\n*   应消除预处理器的使用。\n\n### 底层编程支持规则：\n\n*   使用传统（傻瓜式）链接器。\n\
    *   不与 C 产生无谓的不兼容。\n*   不给 C++ 之下留出更低级语言的空间（汇编除外）。\n*   不用则不付费（零开销原则）。\n*   如有疑问，提供手动控制的手段。\n\
    \n总的来说，人们使用 C++ 的原因有很多。简单来说，C++ 是：\n\n*   **灵活** – C++ 很灵活，因为它没有限制必须使用某种特定编程语言。它可以几乎毫不费力地用于各种应用领域。\n\
    *   **高效** – 支配 C++ 的基本概念与日常计算机的运作方式一致。\n*   **易获取** – 所有计算机上通常都有可用的 C 编译器。此外，还有可用的工具和其他资源，使开发者无需从头编写代码。\n\
    *   **可移植** – 移植用 C++ 编写的项目相当简单，通常也是可行的。\n\n你已经了解了 C++11 和 C++14 之间的区别，以及它们各自提供的功能。然而，你的知识并不止于此。\n\
    \n要充分利用 C++11 和 C++14 高效地进行编程，你必须继续努力。这包括持续不断地学习、阅读和应用这些知识。很快你就能掌握 C++17。虽然它尚未发布，但展望未来并做好准备是很重要的。\n\
    \n ![无标题](img/00099.jpeg)\n\n请记住，每个版本的 C++ 都提供了新的、独特的、有用的东西。C++14 本质上是建立在 C++11\
    \ 之上的，理应如此。它在版本 11 开始但未完成的工作领域取得了进展。\n\n非常感谢你购买这本书！\n\n我希望你会喜欢阅读它。如果你想帮助我创作更多类似的内容，请在亚马逊上留下好评。\n\
    \n这真的很有帮助！\n\n我想接下来的书也会让你感兴趣：\n\n[Windows 10](https://www.amazon.com/dp/B06XJ57Y5H)\n\
    \n ![C:\\Users\\User1\\Downloads\\Windows2017Kindle (1) (1).jpg](img/00100.jpeg)\n\
    \n[Java](https://www.amazon.com/dp/B01G7U2VNK)\n\n![树莓派](img/00101.jpeg)\n\n"
