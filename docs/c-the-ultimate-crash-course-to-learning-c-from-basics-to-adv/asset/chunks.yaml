    \ person_ages [5];`\n\n```\nint person_ages [5];\n```\n\n数组类型为 `int`，这是要存储的信息的类型。第二个元素是数组名称，这里名称是\
    \ `person_ages`。方括号内的最后一个部分表示数组中的元素数量。\n\n## 初始化数组\n\n有两种方法可以初始化数组。第一种方法是直接列出数组位置并设置值。如下所示：\n\
    \n```\nperson_age[0]=43;\nperson_age[1]=49;\nperson_age[2]=5;\nperson_age[3]=10;\n\
    person_age[4]=70;\n```\n\n手动设置数组中的值时，也可以像下面这样设置：\n\n```\n// 初始化\nperson_age =\
    \ {43,49,5,10,70};\n```\n\n虽然对于只有 5 个元素的数组来说，手动设置可能没问题，但当数组有 500 个元素时该怎么办？这时就需要使用\
    \ `for` 循环。使用循环更高效，工作量也更少，尽管其工作方式相同。下面的示例使用 `for` 循环遍历数组以进行打印，但同样的方法也可以用于初始化，具体取决于代码的功能。\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int a;\
    \ // a 是你的计数器变量\n    int person_age [5];\n    ages={45,24,5,95,12};\n\n    for\
    \ (a=0; a<5; a++) // 将 'a' 设为 0，当 'a' 小于 5 时执行\n    {\n        cout<<person_age[a]<<endl;\n\
    \    }\n\n    return 0;\n}\n```\n\n在你的环境中运行上述程序，观察其实际效果并查看打印内容。\n\n下面的示例展示了如何使用\
