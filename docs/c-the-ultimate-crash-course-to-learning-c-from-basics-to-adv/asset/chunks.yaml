    `int d = 33;`


    In the example above, `c` and `d` are both l-values:


    ```

    c = d;

    d = c;

    c = c * d;

    ```


    Of the items above, `c * d` is an rvalue.


    ```

    int e = c * d;

    ```


    This statement is okay because the rvalue is on the right-hand side of assignment


    ```

    c * d = 47;

    ```


    This statement would not be okay because the rvalue is on left hand side of assignment.


    ![codeish-v1-0-lightblue](images/00060.jpeg)


    The reason for the addition of these rvalue references is move semantics. Moving
    cannot be directly compared to the copying of an object. In moving, the object
    which is the target takes the resources from within the source. This essentially
    leaves the source without any resources or “empty”. A move operation is generally
    used when making a copy is unneeded or potentially expensive.


    In order for move semantics to be used to its fullest potential which includes
    taking advantage of the performance gains, string swapping should be considered.


    A very basic implementation would look similar to the example listed below:


    ```

    void basicswap(string &b, string & c){


    string temporary = b;


    b=c;


    c= temporary;


    }

    ```


    The above example can be categorized as basic or naïve because this implementation
    would be considered expensive. The copying of the string would also mean that
    the raw memory would have to be allocated. This would also mean that characters
    from the source would need to be moved to the target. Whereas, the data members
    are simply swapped when strings are moved. This is also done without the allocating
    of memory, without the deleting of memory and without copying char characters.


    ![Top-10-IDE’s-For-C_C-Copy](images/00061.jpeg)


    An rvalue reference has similar behavior to that of a regular reference. However,
    an rvalue reference has several exceptions.


    Aside from solving the problem of move semantics it also looks to solve perfect
    forwarding. Perfect forwarding allows a developer to write a constructor or function
    and forward the parameters as an rvalue or as an lvalue.


    The following code shows the moving of strings which merely swaps two data members.
    It does so without allocating or deleting memory or copying char arrays.


    ```

    void moveswap(string& blank, string & full){


    //pseudo code


    size_t sz=blank.size();


    const char *p= blank.data();


    //This moves full’s resources to blank


    empty.setsize(full.size());


    empty.setdata(full.data());


    //full becomes blank


    full.setsize(sz);


    full.setdata(p);


    }

    ```


    In the event that you are implementing a move supported class, a move constructor
    and assignment operator can be declared. This can be similar to the one seen below.


    ```

    class Ablemove


    {


    Ablemove (Ablemove &&); //The move constructor


    Ablemove && operator=( Ablemove &&); //The move assignment operator


    };

    ```


    One thing to note is that the C++11 Standard Library heavily utilizes move semantics.
    Therefore, a plethora of the algorithms and containers are now move-optimized.


    ## C++11 Standard Library


    ![terminal](images/00062.jpeg)


    Library Technical report 1 was first introduced in C++03. With the implementation
    of this library C++ received a major overhaul. It included a variety of new container
    classes and new libraries for components like regular expressions, function wrappers
    and much more. With C++11 came the official incorporation of Technical Report
    1 into the standard. This brought with it a number of new libraries.


    C++11 introduced a plethora of new libraries into the C++ language these include:


    * Regular expressions library

    * Threading Library

    * Atomic operations library

    * A variety of features within the containers library


    ## Threading Library


    One notable addition to C++11 is the addition of concurrency otherwise known as
    the execution of multiple instructions at the same time. C++11 now supplies developers
    with a thread class which symbolizes an execution thread. This is known as promises
    and futures. These are objects which are used mainly for synchronizing within
    a concurrent environment.


    Using the new threading functionality is simple and will be demonstrated in the
    example below. It is as easy as simply adding the threading header:


    ```

    #include <thread>

    ```


    The following example simply utilizes “Hello World”, the most basic of programming
    tutorials.


    ![](images/00063.jpeg)


    Run the above code from your machine. C++11 also allows for the use of parameters
    in a thread. We have the ability to add as many parameters as needed. The following
    code has been altered to use parameters and presents the given output.


    ![](images/00064.jpeg)


    ![](images/00065.jpeg)


    You may notice that some of the results are confusing or mangled. This is because
    all of the threads happen to be competing for the same resource. This resource
    is stdout.


    These jumbled results can be avoided by using mutexes or barriers. These barriers
    allow the developer the ability to organize how the threads will share a particular
    resource.


    ## New Smart Pointer Classes


    ![c-2-min1](images/00066.jpeg)


    If you are unaware, smart pointers are currently defined within the `std` namespace
    in the memory header file. They are a key factor in the RAII. The RAII, which
    stands for the idiom Resource Acquisition Is Initialization, ensure that “ensure
    that resource acquisition occurs at the same time that the object is initialized”(MDSN).


    A smart pointer, is also a class template. This template is declared at stack
    level. It is initialized by pointing a raw pointer to an object allocated by a
    heap. After this is done, the smart pointer owns the raw pointer. The smart pointer
