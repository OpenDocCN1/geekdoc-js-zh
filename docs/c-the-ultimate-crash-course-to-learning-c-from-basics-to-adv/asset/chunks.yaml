    \ 循环至少会执行一次。\n\n## Break 与 Continue 语句\n\n`break` 和 `continue` 语句会改变程序的正常流程。`break`\
    \ 语句在出现时立即终止循环和 `switch` 语句（`switch` 语句将在后面介绍）。\n\n`break` 语句可用于 `while`、`do while`\
    \ 和 `for` 循环。下图展示了 `break` 在每种循环类型中的工作方式。\n\n![](img/00029.jpeg)\n\n`continue`\
    \ 语句用于跳过循环中的某些条件。该语句在条件语句内部使用。下图说明了 `continue` 语句的工作方式。\n\n![](img/00030.jpeg)\n\
