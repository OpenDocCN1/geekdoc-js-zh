    \ of a class is also known as _____?\n   - A) Function\n   - B) class\n   - C)\
    \ object\n\n## Practice Problem Solutions\n\n1. ```cpp\n   /*  Creating Basic\
    \ Classes in C++\n   */\n\n   #include <iostream>\n   using namespace std;\n\n\
    \   // Class -------------------\n   class person\n   {\n   public:\n   //Varibale\
    \ Declaration\n     string name;\n     int age;\n   };\n   //----------------------\n\
    \   //Main Function\n   int main()\n   {\n       person info;\n       //Get Input\
    \ Values For Object Varibales\n       cout<<\"Enter the Name :\";\n       cin>>info.name;\n\
    \       cout<<\"Enter the Age :\";\n       cin>>info.age;\n       //Show the Output\n\
    \       cout << info.name << \": \" << info.age << endl;\n       return 0;\n \
    \  }\n   ```\n\n2. Assuming that a class is inherited publicly, which of the listed\
    \ statements is correct?\n   - A) Public members of the base class would stay\
    \ as protected members of derived class.\n   - B) Private members of the derived\
    \ class become private members of derived class.\n   - C) Private members of the\
    \ base class become protected members of derived class.\n   - D) Public members\
    \ of the base class become public members of derived class.\n\n3. Which of the\
    \ following is the default access type for classes in C++?\n   - A) Private\n\
    \   - B) Public\n   - C) Static\n   - D) Binding\n\n4. An instance of a class\
    \ is also known as _____?\n   - A) Function\n   - B) class\n   - C) object\n\n\
    # Chapter 8 – Inheritance\n\nObject Oriented programming languages which C++ is,\
    \ is modeled around objects instead of actions. OOO has 7 major components.\n\n\
    ![768340_bd19_2](images/00046.jpeg)\n\nThese components include:\n\n* Abstraction–\
    \ This refers to the hiding of details related to a feature but showing the essential\
    \ features.\n* Encapsulation– This is the binding of functions with variables.\n\
    * Inheritance– It allows for the reuse of code without being written over and\
    \ over. This also allows for classes to inherit information from a base class.\n\
    * Polymorhphism– This allows for the creation of functions which contain the same\
    \ name but utilize a variety of arguments. Even though these functions have similar\
    \ naming conventions the behave differently.\n\nThis chapter will focus on inheritance\
    \ and using inheritance in C++. Inheritance makes your code cleaner and easier\
    \ to understand.\n\n## Derived Classes\n\nA class has the ability to be derived\
    \ from multiple classes. This means that it can inherit functions and data from\
    \ various base classes.\n\nA class derivation list is used to define a derived\
    \ class. It names one or multiple base classes. The form of a derivation list\
    \ is shown below.\n\n`class derived-class: access-specifier base-class`\n\n##\
    \ Access Control and Inheritance\n\nA derived class has the ability to access\
    \ all non private base class members meaning that the base class members should\
    \ not be accessible to the functions of a derived class.\n\nThe different access\
    \ types are shown below according to who can access them and in what specific\
    \ way.\n\n| Access | Public | protected | private |\n| --- | --- | --- | --- |\n\
    | Same class | Yes | yes | yes |\n| Derived classes | Yes | yes | No |\n| Outside\
    \ classes | Yes | no | No |\n\n## Type of Inheritance\n\nWhen a class is being\
    \ derived from a base class, the base class can be inherited in 3 different ways.\
    \ It can be done through either public, protected or private inheritance. The\
    \ inheritance type is determined by the access- specifier, which was covered in\
    \ the previous section.\n\nThe most commonly used inheritance is public. Private\
    \ and protected are rarely used but are still useful to know. The following rules\
    \ should be utilized when using varying types of inheritance.\n\n* Public Inheritance:\
    \ When using public inheritance, the key is to remember that everything that is\
    \ cognizant of the base and the child will also be aware that the child inherits\
    \ the base.\n* Protected Inheritance: When you are using protected inheritance\
    \ one must remember that only the child and its children are aware that they inherit\
    \ from the base.\n* Private Inheritance: When utilizing private inheritance, it\
    \ is more closed off. No one other than the child is aware of the inheritance.\n\
    \n## Multiple Inheritances\n\nIn C++ a class has the ability to inherit members\
    \ from multiple classes. The multiple inheritance syntax is as follows.\n\n`class\
    \ derived-class: access baseA, access baseB....`\n\nIn the given syntax, access\
    \ would be one of the following: public, protected or private. The access would\
    \ be assumed for every one of the base classes.\n\n# Chapter 9 – The New Versions:\
    \ C++ 11\n\nThe first iteration in C++ occurred roughly in 1998. Although there\
    \ was a long wait for it, C++ 11 was approved in August 2011, 13 years after the\
    \ first iteration. It has been said that although version 11 is an improvement\
    \ if the same language, it feels brand new.\n\n![633832_b4e7_2](images/00047.jpeg)\n\
    \nC++11 is capable of supporting a number of new functionalities which include\
    \ the following:\n\n* Lambda expressions\n* Delegating constructors\n* Deleted\
    \ & defaulted function declarations\n* Null pointers\n* Rvalue references\n* Renovation\
    \ of the C++ standards library\n  * New algorithms\n  * New container classes\n\
    \  * Type traits\n  * Atomic operations\n  * Multithreading library\n\nWithin\
    \ this chapter, you will learn more about core functionality and things in C++11\
    \ operate.\n\n## Lambda Expressions\n\n![1-aOJJilDvkpP0GOlV9-Vw1g](images/00048.jpeg)\n\
    \nLambda expressions can be defined as large or small blocks of executable statements,\
    \ much like a function, that can be inserted in place of a function call. These\
    \ expressions are not only efficient but also secure.\n\nBefore implementing these\
    \ expressions, C++ offered the use of member functions, inline functions and function\
    \ objects. However, those methods were more laborious.\n\nThe following example\
    \ shows how to utilize lambda expressions while programming.\n\n![](images/00049.jpeg)\n"
  raw: "A friend function is defined outside of the scope of the class, however, it\
    \ is able access all private and protected members.  Member functions can not\
    \ be friend functions. In order to declare a function as a friend, the function\
    \ must be preceded by the keyword friend. The example below shows how friend functions\
    \ are used.\n\n![](images/00042.jpeg)\n\n## Static Class Members\n\nStatic class\
    \ members are defined using the keyword static.  This means that no matter how\
    \ many object may exist there is only one copy of the static class member.\n\n\
    The following example shows how static class members are used.\n\nA static member\
    \ function may be called even when no objects of the class exist. It is important\
    \ to remember that static functions are accessed by simply using the class name\
    \ and the scope resolution operator ::. A static member function is only able\
    \ to access a static data member, static member functions and any other functions\
    \ from outside the class.\n\nStatic data members, static member functions and\
    \ any other functions from outside the class can be accessed by a static member\
    \ function. It can also be used to determine if objects have not been created\
    \ or if they have. \n\nThe following is an example of using static function members.\n\
    \n![AAEAAQAAAAAAAAkKAAAAJDZlZDJhYzJiLWJiYzAtNDIwZS05OTE2LTE5YWZlOGQxMjY3Nw](images/00043.jpeg)\n\
    \n![](images/00044.jpeg)\n\n![](images/00045.jpeg)\n\nBasic Practice Problems\n\
    \n1.  Write a program using classes that takes in a name and age from a user and\
    \ prints that information on screen to the user.  Your class should contain the\
    \ name and age of the person.\n\n|  \n\n2.  Assuming that a class is inherited\
    \ publicly, which of the listed statements is correct?\n\n    A) Public members\
    \ of the base class would stay as protected members of derived class.\n\n    B)\
    \ Private members of the derived class become private members of derived class.\n\
    \n    C) Private members of the base class become protected members of derived\
    \ class.\n\n    D) Public members of the base class become public members of derived\
    \ class.\n\n3.  Which of the following is the default access type for classes\
    \ in C++.\n\nA) PrivateB) PublicC) StaticD) Binding4.   An instance of a class\
    \ is also known as _____?      A) Function\n\n      B) class\n\n      C) object\
    \ |\n\n|  |\n\nPractice Problem Solutions\n\n1. /*  Creating Basic Classes in\
    \ C++\n\n*/\n\n#include <iostream>\n\nusing namespace std;\n\n// Class -------------------\n\
    \nclass person\n\n{\n\npublic:\n\n//Varibale Declaration\n\n  string name;\n\n\
      int age;\n\n};\n\n//----------------------\n\n//Main Function\n\nint main()\n\
    \n{\n\n    person info;\n\n    //Get Input Values For Object Varibales\n\n   \
    \ cout<<\"Enter the Name :\";\n\n    cin>>info.name;\n\n    cout<<\"Enter the\
    \ Age :\";\n\n    cin>>info.age;\n\n    //Show the Output\n\n    cout << info.name\
    \ << \": \" << info.age << endl;\n\n    return 0;\n\n}\n\n2.  Assuming that a\
    \ class is inherited publicly, which of the listed statements is correct?\n\n\
    \    A) Public members of the base class would stay as protected members of derived\
    \ class.\n\n    B) Private members of the derived class become private members\
    \ of derived class.\n\n    C) Private members of the base class become protected\
    \ members of derived class.\n\n    D) Public members of the base class become\
    \ public members of derived class.\n\n3.  Which of the following is the default\
    \ access type for classes in C++.\n\nA) Private\n\nB) Public\n\nC) Static\n\n\
    D) Binding\n\n4.   An instance of a class is also known as _____?\n\n      A)\
    \ Function\n\n      B) class\n\n C) object\n\n# Chapter 8 – Inheritance\n\nObject\
    \ Oriented programming languages which C++ is, is modeled around objects instead\
    \ of actions.  OOO has 7 major components. \n\n![768340_bd19_2](images/00046.jpeg)\n\
    \nThese components include:\n\n*   Abstraction– This refers to the hiding of details\
    \ related to a feature but showing the essential features.\n\n*   Encapsulation–\
    \ This is the binding of functions with variables.\n\n*   Inheritance– It allows\
    \ for the reuse of code without being written over and over.  This also allows\
    \ for classes to inherit information from a base class.\n\n*   Polymorhphism–\
    \ This allows for the creation of functions which contain the same name but utilize\
    \ a variety of arguments.  Even though these functions have similar naming conventions\
    \ the behave differently.\n\nThis chapter will focus on inheritance and using\
    \ inheritance in C++.  Inheritance makes your code cleaner and easier to understand.\n\
    \n## Derived Classes\n\nA class has the ability to be derived from multiple classes. \
    \ This means that it can inherit functions and data from various base classes.\n\
    \nA class derivation list is used to define a derived class.  It names one or\
    \ multiple base classes.  The form of a derivation list is shown below.\n\nclass\
    \ derived-class: access-specifier base-class\n\n## Access Control and Inheritance\n\
    \nA derived class has the ability to access all non private base class members\
    \ meaning that the base class members should not be accessible to the functions\
    \ of a derived class.\n\nThe different access types are shown below according\
    \ to who can access them and in what specific way.\n\n| Access | Public | protected\
    \ | private |\n\n| Same class | Yes | yes | yes |\n\n| Derived classes | Yes |\
    \ yes | No |\n\n| Outside classes | Yes | no | No |\n\n## Type of Inheritance\n\
    \nWhen a class is being derived from a base class, the base class can be inherited\
    \ in 3 different ways.  It can be done through either public, protected or private\
    \ inheritance. The inheritance type is determined by the access- specifier, which\
    \ was covered in the previous section.\n\nThe most commonly used inheritance is\
    \ public.  Private and protected are rarely used but are still useful to know. \
    \ The following rules should be utilized when using varying types of inheritance. \n\
    \n*   Public Inheritance: When using public inheritance, the key is to remember\
    \ that everything that is cognizant of the base and the child will also be aware\
    \ that the child inherits the base.\n\n*   Protected Inheritance: When you are\
    \ using protected inheritance one must remember that only the child and its children\
    \ are aware that they inherit from the base.\n\n*   Private Inheritance: When\
    \ utilizing private inheritance, it is more closed off.  No one other than the\
    \ child is aware of the inheritance.\n\n## Multiple Inheritances\n\nIn C++ a class\
    \ has the ability to inherit members from multiple classes.  The multiple inheritance\
    \ syntax is as follows.\n\nclass derived-class: access baseA, access baseB....\n\
    \nIn the given syntax, access would be one of the following: public, protected\
    \ or private. The access would be assumed for every one of the base classes.\n\
    \n# Chapter 9 – The New Versions: C++ 11\n\nThe first iteration in C++ occurred\
    \ roughly in 1998.  Although there was a long wait for it, C++ 11 was approved\
    \ in August 2011, 13 years after the first iteration.  It has been said that although\
    \ version 11 is an improvement if the same language, it feels brand new.\n\n![633832_b4e7_2](images/00047.jpeg)C++11\
    \ is capable of supporting a number of new functionalities which include the following:\n\
    \n*   Lambda expressions\n\n*   Delegating constructors\n\n*   Deleted & defaulted\
    \ function declarations\n\n*   Null pointers\n\n*   Rvalue references\n\n*   Renovation\
    \ of the C++ standards library\n\n    *   New algorithms\n\n    *   New container\
    \ classes\n\n    *   Type traits\n\n    *   Atomic operations\n\n    *   Multithreading\
    \ library\n\nWithin this chapter, you will learn more about core functionality\
    \ and things in C++11 operate.\n\n## Lambda Expressions\n\n![1-aOJJilDvkpP0GOlV9-Vw1g](images/00048.jpeg)\n\
    \nLambda expressions can be defined as large or small blocks of executable statements,\
    \ much like a function, that can be inserted in place of a function call.  These\
    \ expressions are not only efficient but also secure.\n\nBefore implementing these\
    \ expressions, C++ offered the use of member functions, inline functions and function\
    \ objects.   However, those methods were more laborious. \n\nThe following example\
    \ shows how to utilize lambda expressions while programming.  \n\n![](images/00049.jpeg)"
