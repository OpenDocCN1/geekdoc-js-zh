    随着 C++14 的到来，出现了新的标准库特性。这些特性包括：


    *   锁定和共享互斥量

    *   关联容器中的异构查找

    *   用户定义的标准字面量

    *   元组寻址


    这是 C++14 提供的主要库特性列表，此外还有大量较小的库补充。


