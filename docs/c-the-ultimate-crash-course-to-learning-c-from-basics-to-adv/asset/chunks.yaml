    \ asterisk must be used in order to denote a pointer.\n\nint    *int_point;   \
    \ // pointer to an integer\n\ndouble *dou_point;    // pointer to a double\n\n\
    float  *flo_point;    // pointer to a float\n\nchar   *ch_point;     // pointer\
    \ to character\n\nThe following example shows the information which is stored\
    \ in a pointer, run the following code to get a better understanding of pointers.\n\
    \n#include  <iostream>\n\nusing  namespace std;\n\nint main ()  {\n\n int variable\
    \  =  10; // actual variable declaration.\n\n int *ipointer; // pointer variable\n\
    \ncout <<  \"Value of variable: \";\n\ncout <<  variable  << endl;\n\n // access\
    \ the value at the address available in pointer\n\ncout <<  \"Value of *ipointer\
    \ variable: \";\n\ncout <<  *ipointer << endl;\n\n return  0;\n\n}\n\n## Null\
    \ Pointers\n\nA pointer that is assigned to NULL is referred to as a null pointer.\
    \ A null pointer is assigned at the time of declaration.  The null pointer is\
    \ generally constant and holds a value of zero.\n\n## Pointer Math\n\nBeing that\
    \ pointers hold values for numbers, they also have the ability to perform basic\
    \ arithmetic functions.\n\nIn some programs the developer may choose to use a\
    \ pointer instead of an array.  This is in part because pointers can be incremented\
    \ and arrays can’t, without the help of a loop.\n\nThe following program shows\
    \ how to successfully increment the variable pointer to access each succeeding\
    \ element of an array:\n\n#include  <iostream>\n\nusing  namespace std;\n\nconst\
    \  int MAX =  4;\n\nint main ()  {\n\n int var[MAX]  =  {10,  100,  200, 300};\n\
    \n int *ptr;\n\n // let us have array address in pointer.\n\nptr =  var;\n\n for\
    \  (int j =  0; j < MAX; j++)  {\n\ncout <<  \"Value of var[\"  << j <<  \"] =\
    \ \";\n\ncout <<  *ptr << endl;\n\n // point to the next location\n\n      ptr++;\n\
    \n }\n\n return  0;\n\n}\n\nBeing that pointers can be incremented, they can also\
    \ be decremented.  Run the following code to show how a pointer is decremented.\n\
    \n#include  <iostream>\n\nusing  namespace std;\n\nconst  int MAX =  4;\n\nint\
    \ main ()  {\n\n int var[MAX]  =  {10,  100,  200,300};\n\n int *ptr;\n\nptr =\
    \  &var[MAX-1];\n\n for  (int j = MAX; j >  0; j--)  {\n\ncout <<  \"Value of\
    \ var[\"  << j <<  \"] = \";\n\ncout <<  *ptr << endl;\n\n // point to the previous\
    \ location\n\n      ptr--;\n\n }\n\n return  0;\n\n}\n\nAside from incrementing\
    \ and decrementing, pointers also have the ability to be compared using relational\
    \ operators.  This includes operators such as ==, <, and >.\n\n# Chapter 6 – Functions\n\
    \nFunctions are extremely useful sections of code that are written in order accomplish\
    \ a specific task. When they are used together they create a more sophisticated\
    \ and clean program.\n\nThe basic structure of a function is shown below.   Please,\
    \ note that a prototype is another way of saying or classifying a declaration\
    \ of a function. \n\nreturn type name (data type variable, data type variable....)\n\
    \nReturn type: The return type refers to what your function will return after\
    \ it has completed.  For example, if I am creating a program to give me the average\
    \ age of college students I would use an int because I do not want nor need the\
    \ decimal places.  Therefore, truncation is okay. My return type would then be\
    \ an int.\n\nName: This is simply the name of the function.  Using the same example,\
    \ I could name this function average_age.\n\nData type: The data type simply refers\
    \ to a variable.  These are the items that the function can take in to use.  It\
    \ can be one or it can be multiples.\n\nThe beginning of the function would look\
    \ like the sample below.\n\nint average_age(int x, int y)\n\nThe placement of\
    \ the prototype is shown in the sample below.\n\n#include <iostream>\n\nint average_age\
    \ (int x, int y);\n\nint main()\n\n{\n\n//main program\n\nreturn 0;\n\n}\n\ndouble\
    \ mult (int x, int y) //notice no semicolon\n\n{\n\n//function will be written\
    \ here\n\n}\n\nRun the following program as a sample in order to see how functions\
    \ operate. The function in the following program is used to add two variables\
    \ and return the sum of them both. \n\n//Full working program\n\n#include <iostream>\n\
    \ndouble summation (int a, int b); // prototype\n\nint main()\n\n{\n\nint x,y;\n\
    \nint c;\n\ncin>>x;  //the user inputs a value for x\n\ncin>>y;  //the user inputs\
    \ a value for y\n\nc = summation(x,y); //call the function summation and pass\
    \ through the variables you have read in\n\ncout<<\"The sum of the 2 numbers is\
    \ \"<<c<<endl;\n\nreturn 0;\n\n}"
