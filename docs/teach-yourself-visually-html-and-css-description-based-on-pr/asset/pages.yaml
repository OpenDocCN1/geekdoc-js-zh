  md: '# # Working with Frames


    +   4 Type <FRAME NAME=", replacing with a name for the frame.


    +   5 Type a space and SRC=", replacing with the name and location of the Web
    page you want to appear in the frame.


    +   6 Repeat steps 4 and 5 for each frame you specified in step 3.


    +   7 Type </FRAMET>


    The Web browser displays the frames.


    +   In this case, two rows appear in the browser window.


    You can use a nested frameset to combine rows and columns in a frameset.


    Note: To create a frameset with both rows and columns, see the "Create a Nested
    Frameset."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_159_0.png)


    ```

    <html>

    <TITLE>I''m Travel Agency</TITLE>

