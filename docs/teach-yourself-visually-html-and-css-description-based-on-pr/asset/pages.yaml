  md: '# Understanding Web Page Publishing


    The final phase of creating a Web site is publishing your pages. In the realm
    of HTML, the term *publishing* refers to all the necessary steps you must take
    to make your HTML documents available to others. This includes finding a Web host.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_314_0.png)


    # Web Hosts


    To make your pages available on the Web, you need a Web server — an Internet-connected
    computer specifically set up to store and manage Web pages. Commonly called *hosts*,
    Web servers allow you to transfer and store files, including HTML documents, images,
    and multimedia files. Unless you have your own Web server, you need to find a
    server to host your pages.


    # Determine Your Needs


    Before you start looking for a Web host, first determine what features and services
    you need. For example, how much storage space do you anticipate using for your
    Web site? Will you be serving multimedia content that uses a lot of space? Does
    your site require features like an online shopping cart, or a secure server for
    handling confidential information? Do you need to keep track of Web statistics,
    such as who visits your site and how often? Knowing your needs beforehand will
    help you find the right host.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_314_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_314_2.png)'
  merge: -1
  pgno: 314
