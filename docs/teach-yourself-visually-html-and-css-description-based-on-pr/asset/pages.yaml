    # What other values does the display property accept?


    The display property can accept a number of values, but only two are commonly
    supported across all of the currently browsers. A block value creates a block-level
    element, which means the element is added to the page with line breaks above and
    below it. An inline value creates an element that can sit within the text of a
    sentence, similar to how a SP tag works. For more about the SPAN tag, see Chapter
    10.


    # What is the visibility property?


    The visibility property is similar to the display property in that it renders
    an element invisible. However, the visibility property does not remove the area
    that would normally be occupied by the element. For example, hiding an element
    using the visibility property leaves a blank rectangular area on the page.'
