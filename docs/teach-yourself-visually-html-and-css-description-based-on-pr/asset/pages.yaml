  md: '# # Understanding HTML Document Structure


    Although Web pages can differ widely in terms of content and layout, all pages
    have certain HTML tags that give them the same basic structure. Understanding
    this structure helps you begin to build your own HTML pages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_32_0.png)


    # HTML Tags


    The `<html>` and `</html>` tags at the beginning and end of a text document identify
    it as HTML code. When a browser encounters these tags, it knows that anything
    within the two tags defines a Web page. Older Web browsers expect to see the HTML
    tags; with the latest version of HTML and newer versions of browsers, the tags
    are not always necessary, but adding them is good form.


    # Document Type Declaration


    You can add a DOCTYPE declaration to specify which tags a browser can expect to
    see in your HTML document. In HTML 4.01, there are three document types: HTML
    4.01 Transitional, HTML 4.01 Strict, and HTML 4.01 Frameset. The transitional
    type is the most inclusive, incorporating both current and older tags that have
    been phased out, or *deprecated*. The strict type is more pared down and excludes
    deprecated tags. The frameset type is the same as the transitional type but includes
    all the tags necessary to make frames on a page. For more frames, see Chapter
    8.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_32_1.png)


    > > Declaration!

    HTML 4.0 STRICT

    HTML 4.0 FRAMESET

    HTML 4.0 TRANSITIONAL


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_32_2.png)


