- img_proc: true
  md: '# # Understanding Web Page Images


    You can use images in a variety

    of ways on your Web pages.

    Images include everything from

    graphics and clip art to

    photographs and other visual

    objects. Images can illustrate

    text, show a product, provide

    background decoration, or act as

    avigational buttons for a Web

    site. An important part of using

    images effectively on your own

    site is to understand how

    browsers display the images of

    others to view.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_80_0.png)


    # Image File Formats


    Although there are numerous file types used

    images, JPEG and GIF are the two most popular

    types on the Web. Both formats are cross-

    platform and offer file compression. PNG is a newer

    arrival in the image file format and is gaining

    popularity among Web Developers. The current

    versions all of today''s popular Web browsers can

    dis JPEG, GIF, and PNG images.


    # JPEG


    JPEG, which stands for Joint Photographic Experts

    Group, supports 24-bit color, allowing for millions of

    colors. The JPEG format is commonly used with

    complex images, such as photos or graphics that use

    millions of colors and feature lots of detail. JPEG is

    ot a good choice for solid-color artwork because it

    results in a larger overall file size, which translates to

    longer download times. JPEG images usually use a

    .jpg file name extension.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_80_1.png)'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# GIF


    GIF, which stands for Graphics Interchange Format, supports up to 256 colors.
    The GIF format is more commonly used for simple images, such as logos and graphics
    containing basic shapes and lines. If your image or graphic contains few colors
    and not a lot of detail, GIF is a good file choice. A single GIF file can also
    store multiple images and display them as an animation. GIF uses a .gif file extension.


    # PNG


    The PNG (Portable Network Graphics) format offers rich color support and advanced
    compression schemes, so it is a good choice for a variety of image types. Like
    JPEG, PNG supports 24-bit color, but it can also be saved with fewer colors, similar
    to GIF. Because PNG is a relatively new format, use it if your intended audience
    likely has up-to-date browsers. PNG images use a .png file extension.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_81_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_81_1.png)


    # Downloading Considerations


    Browsers must download an image before users view it on a Web page. Large images
    take a long time to display, especially if Internet connection speeds are slow.
    For this reason, consider the overall file size of image when deciding whether
    to add it to a Web page. If you fill your page with several large pictures, the
    download time for the page to fully display will be excessive.


    # Optimize Images


    Most image-editing programs allow you to adjust the quality of an image to control
    its file size. You can also control file size by shrinking or cropping an image.
    For best results, make sure your image file size does not exceed 60K. If you have
    large image files, users may not be willing to wait for the pictures to download.
    With GIFs and some PNGs, you can decrease the number of colors in the image to
    reduce the file size.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_81_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_81_3.png)'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Prepare Your Images for the Web


    You can use image-editing software to edit your images and make them Web-ready.
    Whether you plan to use photographs or graphics on HTML page, you can save yourself
    some time and effort by preparing the images in an image-specific program first
    and inserting them onto your pages using HTML.


    For more on images and the formats you use, see the section "Understanding Web
    Page Images."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_82_0.png)


    # Image-Editing Programs


    A variety of programs are available for editing image files. Some programs, such
    as Adobe Photoshop Elements and Corel''s Paint Shop Pro, are affordable and allow
    you to reduce the overall file size of an image as well as to use in a Web-friendly
    file format such as JPEG, GIF, or PNG. Paint, which comes from Windows, also offer
    image-editing features that can help you optimize file size.


    # Reduce the Image Width and Height


    Image dimensions are important considerations when placing an image on a Web page.
    Images wider than the browser window will not be fully visible, requiring the
    user to scroll. You can use an image-editing program to resize an image. Cropping
    out areas of the image that you do not want to appear on the Web page can help
    reduce the overall image file size.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_82_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_82_2.png)'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Image Compression


    Image-editing programs allow you to save your image as a specific file type and
    set a compression level. File compression used in JPEG images can sometimes reduce
    the file size by up to 90 percent. Many programs let you view the image both before
    and after compression to check for differences in quality.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_83_0.png)


    # Number of Colors


    For GIF images and some PNG images, you can reduce the number of colors in the
    image to reduce the file size. For example, while GIF images can contain a maximum
    of 256 colors, an illustration with most solid-color regions may look just fine
    as a 16-color GIF. Most image editors allow you to compare an image at different
    color settings prior to saving.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_83_1.png)


    # Alternative Text


    Some users may turn off the browser''s image-display setting to help speed up
    the downloading of Web pages. Also, some visually impaired users view the Web
    using screen readers that do not display images at all. To accommodate such users,
    be sure to include alternative text describing the image in place of the image
    and allows users to appear in the image and allows users to understand how the
    image relates to the rest of the page. For more information, see the section "Add
    Alternative Text."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_83_2.png)'
  merge: -1
