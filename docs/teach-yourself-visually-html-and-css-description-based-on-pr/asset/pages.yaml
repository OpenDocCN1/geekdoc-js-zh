  md: '# Add Metadata


    Add and metadata to your page to include extra descriptive information that does
    not appear in the browser window. Metadata can include a page description, author
    and copyright information, keywords, and more. What you insert in metadata tags
    can help search engines categorize your page.


    Define metadata in the document header using the <META> tag.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_44_0.png)


    # ADD AN AUTHOR NAME


    +   1 Click between the <HEAD> and </HEAD> tags and Enter to start a new line.


    In this example, the metadata appears below the <TITLE> tags.


    +   2 Type <META name="author"> followed by a space.


    +   3 Type CONTENT="My Name", replacing My Name with your name.


    +   4 Press Enter


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_44_1.png)


    # ADD A PAGE DESCRIPTION


    +   5 Type <META name="description"> and a blank space.


    +   6 Type CONTENT="Page Description", replacing Page Description with your own
    page description.


    +   7 Press Enter


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_44_2.png)


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0//EN"

    http://www.w3.org/TR/HTML4/strict.dtd>

    <html>

    <head>

    <title>Travel Agency</title>

    <meta name="author" content="M and L">

    n<body>

    For more than 15 years, M and L''s Travel Agency have helped customers planning
    exciting vacations around the world. We specialize in one kind of kind vacation
    packages for all interests and budgets. Let us help you with your airline tickets,
    hotel bookings, and rental cars, online or in person.

    </body>

    </html>

    ```


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0//EN"

    http://www.w3.org/TR/HTML4/strict.dtd>

    <html>

    <head>

    <title>Travel Agency</title>

    <meta name="description" content="exciting vacation packages.">

    <body>

    For more than 15 years, M and L''s Travel Agency have helped customers planning
    exciting vacations around the world. We specialize in one kind of kind vacation
    packages for all interests and budgets. Let us help you with your airline tickets,
    hotel bookings, and rental cars, online or in person.

    </body>

    </html>

    ```'
  merge: -1
