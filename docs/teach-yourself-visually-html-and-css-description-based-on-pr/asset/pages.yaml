  md: '# Creating Your First HTML Page chapter 2


    # Document Header


    You use the header of an HTML document to add descriptive and accessory information
    to your Web page. The document header tags, <HEAD> and </HEAD>, immediately following
    the opening <HTML>. The document header contains information that does not appear
    in the browser window, including title information, metadata, scripts, and style
    sheets. For more scripts, see Chapter 13. For more about style sheets, see Chapter
    10.


    # Document Title


    You can add a title to your HTML document to help people and search engines identify
    your Web page. For example, if you are building a Web page for a business, you
    might want to include the company''s name and specification in the title. Most
    browsers display the title in the browser''s title bar. <TITLE> and </TITLE> tags
    define a page title and appear inside the document header. It is good to keep
    the title to fewer than 64 characters in length.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_33_0.png)


    ```

    <HEAD>

    <TITLE>HTML MAP</TITLE>

    </HEAD>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_33_1.png)


    # Metadata


    Metadata means "data about data." On a Web page, metadata can include author information,
    the type of editor used to create the page, a description of the content, relevant
    keywords, and copyright information. Search engines often use metadata when trying
    to categorize a page. You place metadata inside the document header.


    # Body


    The visible content that makes up your Web page, including paragraphs, lists,
    tables, and images in the body of your HTML document. The body of the document
    is identified by the <body> and </body> tags. The body of a document comes after
    the header of a document. Most of the HTML covered in the body of a document will
    determine how its content is formatted. Learn how to begin formatting body text,
    see Chapter 3.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_33_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_33_3.png)'
  merge: -1
