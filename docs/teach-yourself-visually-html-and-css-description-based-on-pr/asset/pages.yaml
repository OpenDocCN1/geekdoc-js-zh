    The user can click inside the text box and type the required information.


    # Can I add a default value to a text box?


    Yes. A default value is text that appears in the box when the user views the form.
    You can use default values to display instructions about the type of data required,
    giving users an example of the data you are looking for, or show a popular choice
    or response. To specify a default, you can use the VALUE attribute to the <INPUT>
    tag. For example:


    ```

    <INPUT TYPE="text" NAME="email" VALUE="Enter your e-mail address">

    ```


