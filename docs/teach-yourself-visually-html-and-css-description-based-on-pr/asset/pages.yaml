  md: '# Add a Document Declaration


    You can use a document declaration at the top of your Web page to declare which
    type of HTML tags the browser can expect to see. You can use one of three types:
    HTML 4.01 Transitional, HTML 4.01 Strict, or HTML 4.01 Frameset.


    The transitional version of HTML is the most inclusive. It has all the standard
    structural elements as well as older tags that have been phased out of the current
    standard. The strict type includes only currently sanctioned tags. The frameset
    type is the same as the transitional type but includes additional tags for creating
    frames.


    Add a Document Declaration


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_42_0.png)


    +   1 Open the HTML document you want to edit.


    +   2 Position your cursor before the <HTML> tag and press Enter to insert a new
    line.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_42_1.png)


    +   3 Type the DOCTYPE declaration.


    +   To specify HTML 4.01 Transitional, type:


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_42_2.png)


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.01//EN"

    "http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <title>M. and L''s Travel Agency</title>

    </head>

    <body>

    There are more than 15 years...

    </body>

    </html>

    ```


    You may need to press Enter to continue the code on a new line.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Creating Your First HTML Page


    To specify HTML 4.01 Strict, type:


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.01 Strict//EN"


    http://www.w3.org/TR/REC-html4/strict.dtd">

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_43_0.png)


    To specify HTML 4.01 Frameset, type:


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.01 Frameset//EN"


    http://www.w3.org/TR/REC-html4/frameset.dtd">

    ```


    The declaration statement is complete.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_43_1.png)


    # Do I have to include a document declaration?


    Most popular browsers can display your page without a DOCTYPE declaration. However,
    if you are using a validation tool to check for your page proper form, the tool
    may require that you include a declaration so it knows what type of HTML it should
    validate your page against. Including a declaration is also considered good form.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_43_2.png)


    # Which version of HTML should I use?


    All Web browsers support HTML. Transitional, professional developers are moving
    toward HTML Strict and using with Cascading Sheets (CSS) to control page formatting.
    Many of the deprecated tags have been replaced by formatting rules that use CSS.
    If you use frames, then you need to use HTML Frameset because it allows you to
    add frames to a page. deciding which version to use depends on what Web elements
    you plan to use and what type of coding you are familiar with.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_43_3.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_43_4.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_43_5.png)'
