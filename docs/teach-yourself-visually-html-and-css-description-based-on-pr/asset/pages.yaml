    Repeat steps 1 to 4 to add radio buttons to the group, using the same name for
    all the buttons in a set.


    Note: You can optionally use <BR> or <P> tags to separate input elements onto
    different lines in your form.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_187_0.png)


