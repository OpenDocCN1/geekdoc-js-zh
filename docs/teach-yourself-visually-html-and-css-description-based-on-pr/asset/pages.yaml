    +   * Click inside <FRAME> tag of the frame you want to control.

    * Type SCROLLING="? replacing ? with yes to display scroll bars or no to hide
    scroll bars.


    You can repeat steps 1 and 2 to control the scroll bars in other frames.


    The browser displays or hides scroll bars as instructed.


    +   * In this example, the scroll bars are hidden for the bottom frame.


