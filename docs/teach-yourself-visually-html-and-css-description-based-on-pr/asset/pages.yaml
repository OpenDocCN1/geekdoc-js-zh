  md: '# Creating Forms chapter 9


    Type a sample with WRAP="?", replacing with a text wrap control.


    soft wraps within the text area but not in the results.


    hard wraps within both the text area and the results.


    off turns text wrapping, forcing users to add line breaks naturally as they type.


    +   - You can add a default message between the <TEXTAREA> and </textarea> tags.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_183_0.png)


    # 7 Type TEXTAREA:


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_183_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_183_2.png)


    +   - The web browser displays the text box in the form.


    +   - The user can click inside the text box and type information.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_183_3.png)


    What happens if the user types more than can be viewed in the text area?


    If the user types more text than is visible in the text area, scroll bar becomes
    active before the side of the text area. Scroll bars allow the user to scroll
    and view the text. The text area automatically holds as much text as the user
    needs to type, up to 32,700 characters.


    Is there a way to keep users from typing into a large text area?


    Yes. You can use the READONLY attribute if you want to display default text in
    a text area and not want users to move or edit the text. For example, you might
    use a large text area to explain something about your form or offer detailed instructions.
    Please read the READONLY attribute, without assigning a value, within the <TEXTAREA>
    tag.


