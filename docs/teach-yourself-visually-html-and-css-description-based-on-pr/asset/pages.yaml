  md: '# # Display an Alert Message Box

    ## Working with JavaScript chapter 13


    You can use JavaScript to display an alert message box on your Web page. For example,
    you might use alert messages to provide special instructions about your site or
    to alert the user to any important information. After reading the message, the
    user can close the box.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_275_0.png)


    # Display an Alert Message Box


    +   - Type <SCRIPT TYPE="text/javascript">

    - Type alert(7), replacing 7 with the message you want to appear in the box.

    - Type </SCRIPT> to end the JavaScript code.


    The placement of your script on the page determines when it appears during the
    page download.

    Place the script at the top to load first or at the bottom to load last.


    When the user displays your page in a browser, the alert message box appears.


    +   - The user can click here to close the box.


    ```

    <html>

    <HEAD>

    <TITLE>L''s Travel Agency</TITLE>

    <BODY BACKGROUND="#F0F0F0">

    <IMG SRC="travel_yellow.gif" ALT="L''s Travel Agency">

    <FONT COLOR="#000000">Customer Information Form</FONT>

    <SCRIPT TYPE="text/javascript">

    function alertMsg() {

    alert("Tell us about yourself so we can help you with your travel needs?");

    }

    </SCRIPT>

    <form>

    <INPUT type="text" NAME="email" VALUE="example@example.com">

    Your name:

    <INPUT type="text" NAME="user-age" SIZE="30">

    <INPUT type="radio" NAME="returning" VALUE="yes"> <INPUT type="radio" NAME="returning"
    VALUE="no">

    Returning customer:

    </form>

    </BODY>

    </html>

    ```


    # H and L''s Travel Agency


    Customer Information Form


