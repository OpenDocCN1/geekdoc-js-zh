    The user can click the radio button to select that option.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_187_1.png)


    # What happens if I give radio buttons in a set different names?


    When radio buttons have different NAME attributes, the browser treats them as
    parts of radio button sets. This means the user is able to turn more than one
    of them at a time by clicking. Make sure all radio buttons in a set have the same
    NAME attribute to avoid this.


    # Can I show a particular radio button as selected by default?


    Yes. You can use the CHECKED attribute to show one radio button in the group as
    selected by default. The CHECKED attribute is inserted after the VALUE attribute
    in your HTML code. Your code might look like this:


    ```

    <INPUT TYPE="radio" NAME="agerange" VALUE="40-50" CHECKED>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_187_2.png)'
