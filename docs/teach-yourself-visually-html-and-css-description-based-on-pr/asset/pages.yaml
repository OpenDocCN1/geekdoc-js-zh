  md: '# # Add Active Labels


    To make your form easier to use, you can identify the text beside an input element
    as a label. The browser treats the text as an active form element, which means
    if the user clicks it, the input element changes to reflect the selection. For
    example, if you make the text next to a check box, the user can click the text
    as well as the check box to select the option.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_192_0.png)


    # Add Active Labels


    +   1. Click inside the tag for the form element you want to label and type ID="2",
    replacing? with a descriptive word for the element.


    +   2. Before the text, type `LABEL FOR="2"`, replacing with the word you assigned
    in step 1.


    +   3. Type the label text and then `</label>`.


    You can repeat steps 1 to 3 to add more labels.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_192_1.png)


    ```

    Comment:

    <input type="text" name="customercomment" rows="4" cols="20">

    Add your comment here.

    <br>

    Preference:

    <input type="checkbox" name="flight" value="yes" id="Flight"> Flight

    <input type="checkbox" name="hotel" value="yes" id="hotel"> Hotel

    <br>

    Returning customer:

    <input type="checkbox" name="returning" value="yes" id="returning"> Returning
    customer

    ```


    The user can move the mouse pointer over the label to make the input element as
    well as click to activate the input element.


