    # ## Does my page need to include information about the file that is available
    for downloading?


    It is always good practice to give your Web page visitors all the information
    they need to know to download and view any type of multimedia file. For example,
    you can include a brief description of the file, list format and size, and provide
    a link to any plug-ins or media players the user might need to play the file.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_291_2.png)


    # ## How can I add background music to my page?


    You can assign an audio clip to play in the background while users visit your
    page using the BGSOUND tag. The tag is not part of the official HTML standard;
    it does not work in Internet Explorer but does in other browsers as Firefox. You
    reference the audio clip using the SRC attribute, such as `<BGSOUND SRC="audio.mp3">`.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_291_3.png)'
