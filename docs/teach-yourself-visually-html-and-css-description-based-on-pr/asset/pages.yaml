  md: '# Customize Form Elements


    You can use style sheets to customize the elements in your forms. You can enlarge
    text fields to give them more prominence on your pages. You can also change the
    color of form buttons to make them match the other colors on your pages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_238_0.png)


    # Customize Form Elements


    # CUSTOMIZE A TEXT FIELD


    +   1 In your style sheet, type **INPUT{}**, replacing with a unique name for
    your text-box class.


    **Note:** For more details about creating a CSS class, see Chapter 10.


    +   2 Type a height declaration to set the height of the text box.


    +   3 Type a font-size declaration to set the size of the font text box.


    +   4 Inside the INPUT tag for the text box, use **class="****, replacing with
    the class name.


    +   5 The Web browser applies the new style to the form text box.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>I''s Travel Agency</title>

    <style>

    body{font-family:sans-serif}

    input{height:32px}

    </style>

    </head>

    <body>

    <h1>I''s Travel Agency</h1>

    <form action="/customer.php" method="post">

    <input type="text" name="username" size="30" class="Bigbox

    <input type="radio" name="returning" value="yes"> Yes

    <input type="radio" name="returning" value="no"> No

    </form>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_238_1.png)


    224'
