  md: '# # Adding Links chapter 6


    +   * The link appears in the Web browser.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_115_0.png)


    +   * When the link is clicked, the user''s e-mail editor opens with the To field
    prefilled with the e-mail address.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_115_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_115_2.png)


    # Can I specify a subject for an e-mail message?


    Yes. You can use the ?subject parameter within the link tag to include a subject
    line with the e-mail message. When the user clicks the link and the e-mail client
    opens, the subject is prefilled. You can use this technique to help recognize
    your e-mail generated from your Web site. For example:


    <A HREF="MAILTO:webmaster@example.com?subject=comments">E-mail</a>


    # Is it safe to use my e-mail address in a link?


    You should use caution when placing a personal e-mail address on a Web page. E-mail
    addresses on Web pages are notorious for unsolicited e-mail, because such addresses
    can be harvested automatically by spam tools that grow the Web. Reason you may
    want to create a separate e-mail account for your Web-generated e-mail messages.
    See your Internet service provider for more information.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_115_3.png)


