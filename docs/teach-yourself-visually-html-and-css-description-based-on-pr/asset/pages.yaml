  md: '# Understanding Forms


    You can use forms to collect information from the people who visit your Web site.
    For example, you might enable visitors to send you feedback, post comments on
    articles, or purchase goods or services from your business. Before you jump into
    building your own forms, take a moment to study how forms work and the various
    ways you can use them on your own Web site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_172_0.png)


    Tell us about yourself so that we may better serve you.


    # How Forms Work


    Forms use input elements to collect data from a user, such as text fields and
    check boxes. After a user fills in the data, he or she can click a button to submit
    the form, and the browser sends the data back to the Web server. As the Web developer,
    you decide how to handle the data. For example, you can write a script to parse
    the data and send back a custom Web page in response, have a program store the
    data in a database, or receive the data via e-mail. Most form data is processed
    by CGI scripts on the Web server. You can learn more about various ways to process
    your data in the section "Gather Form Data" in this chapter.


    # HTML for Forms


    Web pages have three important parts: a FORM> tag, form input, and a Submit button.
    When designing and building a form, you write HTML to define the different objects
    that allow users to type or select information. These objects include text fields,
    radio buttons, check boxes, and more. All forms should include a Submit button
    for sending the data to a Web server for processing.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_172_1.png)'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Form Design


    Before coding the HTML for a form, spend time thinking about how you want the
    user to interact with the form, what sort of data you want to collect, and how
    you want the form to look. Be sure to add label text to your form elements that
    explains what type of information you want from the user, and give users enough
    space to type their input. You should also explain how the information is to be
    used, especially if the user is submitting personal data.


    # Types of Forms


    You can create different types of forms. For example, you can create a search
    form that allows users to search your Web site for information by submitting keywords.
    You can add data-collection forms to gather information from users, such as names,
    and e-mail addresses. Your form may be as simple as a guest box or as complex
    as a detailed survey. You can also use forms to help customers add items to an
    online shopping cart and make a purchase on your site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_173_0.png)


    # Controlling Data Entry


    You can control how a user enters data into your form. For example, you can guide
    the user from one input field to the next by controlling the tab order. See the
    section "Change the Tab Order" to learn more. You can also control the type of
    data entered into a field. For example, you can limit the number text field so
    that it accepts only numbers, not characters. You can use JavaScript programs
    to alert users to invalid data. See Chapter 13 to learn more about JavaScript.


    # Confirmation


    After the form data is processed, a script typically displays a message in the
    browser window noting whether or not the form data was sent successfully. You
    might also code your script so that it sends a confirmation message by e-mail.
    It is always good practice when collecting form data to provide visitors with
    a confirmation or assurance that some sort of action will be taken on their submission.
    This confirmation is usually a page that you code using HTML.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_173_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_173_2.png)'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# # Types of Form Elements


    Forms are made up of a variety of input elements. Some elements, such as text
    boxes, give users a way to add information in a free-form manner. Others, such
    as radio buttons, constrain what the user can submit. You can mix different types
    of input elements in a single form.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_174_0.png)


    # ## Text Boxes


    Text boxes are input fields designed specifically for users to type data into,
    such as typing a name or comment. A text box can be a single line to collect a
    limited number of characters, such as a phone number or postal code. Text boxes
    can also be large, multiline fields that allow for submitting paragraphs of input.
    In single-line text boxes, you can control the maximum number of characters a
    user can type.


    # ## Check Boxes


    Check boxes enable a user to select one or more options from a list. For example,
    if you want to collect information about a user''s familiarity with computers,
    you can place a set of check boxes next to a list of computer applications. When
    designing a form, you have the option of presenting check boxes as already checked.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_174_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_174_2.png)'
