  md: '# Control Layout


    You can use cascading styles, or CSS, to organize text, images, and other elements
    on your Web page in precise ways. This enables you to create layouts that are
    more complicated than those you can create with HTML. Style sheets allow you to
    specify in where to put different types of content by defining coordinates within
    the browser window. You can also precisely control the space around different
    elements and even overlap content on your pages.


    By combining layout techniques with other CSS features covered in Chapter 11,
    you can produce pages that look like they were created using a page layout program.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_242_0.png)


    # Box Model


    The key to understanding layout using style sheets is the box model of Web page
    layout, where each element on a page exists in its own rectangular box. Style
    sheets let you control the dimensions of the box using height and width properties,
    where the box is on the Web page, and how the box aligns or overlaps with other
    boxes on the page.


    # HTML Block Tags


    You define boxes for your content using block-level HTML tags. Block level tags
    place new lines before and after the content they enclose. The <P>, <h1>, and
    <TABLE> are examples of block-level tags. The <div> is a generic block-level tag
    that is commonly placed around other tags to organize content using style sheets
    to determine layout.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_242_1.png)


    > It was May when I set off on my cross-country auto trip. As I got to set this
    trip, I decided to leave Maine to California, I would spend a year visiting every
    city that appealed to me. How would I fund this adventure? Articles would support
    myself by writing for various news magazines and web sites, I would apply for
    visiting, and if I needed help, at any of the places I visited I found someone
    who would offer me work on a temporary basis, and everyone was intrigued by my
    journey.


    228'
