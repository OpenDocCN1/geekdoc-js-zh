  md: '# Control which Borders to Display


    Ordarily, when you assign a border to a table, it surrounds the table and the
    individual cells. You can control which external and internal borders appear in
    your table using the FRAME and RULES attributes. For example, you can turn off
    the top and bottom borders of a cell or display the entire right side of the table
    without a border. By controlling which borders appear, you can create a custom
    table.


    This section includes a list of all external and internal border values for quick
    reference.


    # Control EXTERNAL BORDERS


    +   - In the border attribute for the table, type FRAME="?" replacing it with
    the border display you want to.


    You can use void, above, below, rhs, lhs, vsides, or border.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_134_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_134_1.png)


    The Web browser displays the table with the external borders you specified.


    +   - In this case, the sides of the table are hidden.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_134_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_134_3.png)'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# CONTROL INTERNAL BORDERS


    In the ORDER attribute for the table, type RULES="2", replacing ? with the value
    for the border you want to show.


    You can use none, cols, rows, groups, or all.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_135_0.png)


    The web browser displays the table with the internal borders


    In this example, the inside row borders are hidden.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_135_1.png)


    # What values do I use to define external or internal borders?


    | External Borders | Display | Internal Borders | Value | Display |

    |---|---|---|---||

    | VOID | No external borders | NONE | No internal borders |

    | ABOVE | A border above the table | COLS | Borders between columns |

    | BELOW | A border below the table | ROWS | Borders between rows |

    | RHS | A border on the right side of the table | GROUPS | Borders between column
    and row groups |

    | LHS | A border on the left side of the table | ALL | Borders throughout the
    table cells (default) |

    | HSIDES | Borders on the top and bottom of the table | | |

    | VSIDES | Borders on the left and right sides of the table | | |

    | BORDER | Borders on every side of the table (default) | | |


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_135_2.png)


