  md: '# Add a Text Box


    You can add a text box to your form to allow users to type a single-line reply
    or response. When creating a text box, you must identify the input field with
    a unique name. You can also control the text box size and the maximum number of
    characters a user can type in the field.


    By default, browsers display the text box field at a width of 20 characters. Using
    the SIZE attribute, you can control the number of characters allowed in a text
    box by specifying a value with the MAXLENLENGTH attribute.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_180_0.png)


    # Add a Text Box


    +   1 The <FORM> and </FORM> tags, add a new line for the text box.

    2 Type <INPUT TYPE="text">.\n3 Type a space and NAME="?", replacing ? with a unique
    identifier for the text box.

    4 Type a space and SIZE="?", replacing ? with a width in characters.


    ```

