  md: 'In this example, the browser displays a table with a default gray border.


    # # Working with Tables


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_125_0.png)


    In this example, the browser displays the same table with a colored border.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_125_1.png)


    # Can I specify a border with a style sheet?


    Yes. In your style sheet, type TABLE or TD. Then you type **(BORDER: VALUES)**,
    replacing VALUES with a border size (in pixels), border color, separating the
    values with spaces. For example, to create a 1-pixel, solid-red border, type **{BORDER:
    1px solid red;}** See chapter 11 to learn more about applying borders with style
    sheets.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_125_2.png)


    # Do I need to add borders if I am using a layout for my Web page?


    No. It is usually not a good idea to use the BORDER attribute for table layouts.
    With a layout, you want the table structure to define different sections of the
    page invisibly. If you assign a border to the browser, it can distract from your
    page content.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_125_3.png)


