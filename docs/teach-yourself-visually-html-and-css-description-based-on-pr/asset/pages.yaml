  md: '# Create a List


    You can use a nested list to add a list within a list to your Web page. Nested
    lists allow you to display listed text at different levels within the list hierarchy.
    You can use both numbered and bulleted lists within an existing list.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_60_0.png)


    # Create a Nested List


    +   1. Click where you want to insert a nested list, or add a new line within
    the existing list and type <OL> for a numbered list or <UL> for an unordered list.


    Note: To create a numbered list, see the section "Create a Nested List." To create
    a bulleted list, see the section "Create a Bulleted List."


    +   2. Type the new list text, including the <li> and </li> tags, using the same
    technique you used to create the original list.


    +   3. Type </OL> or </ul> at the end of the nested list.


    The text appears as a nested list on the Web page.


    Browsers usually set nested lists with different bullet styles. In this example,
    a nested list gets an open circle.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_60_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_60_2.png)'
