  md: '# Automatically Load another Web Page


    Automatically load a new Web page in the browser after a certain amount of time
    has passed. You might use this technique on a placeholder page that informs visitors
    that your Web page has moved.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_306_0.png)


    # Automatically Load another Web Page


    +   1. Add a new line between the <HEAD> and </HEAD> tags.


    +   2. Type <META HTTP-EQUIV="Refresh;seconds">


    ```

    <html>

    <head>

    <title>John and L''s Travel Agency</title>

    <style>

    body { font-family: "Arial"; background: #FFFFFF; }

    </style>

    <meta http-equiv="Refresh;content=200">

    </head>

    <body>

    <p align="center"><img src="mitravel.gif"></p>

    <br>

    <h2 align="center">This Page Has Moved!</h2>

    <br>

    <p align="center">You will be redirected in a moment.</p>

    </body>

    </html>

    ```


    +   3. Type a space and CONTENT=""; replacing with the number of seconds you want
    to elapse before the new page appears.


    ```

    <html>

    <head>

    <title>John and L''s Travel Agency</title>

    <style>

    body { font-family: "Arial"; background: #FFFFFF; }

    </style>

    <meta http-equiv="Refresh;content=5">

    </head>

    <body>

    <p align="center"><img src="mitravel.gif"></p>

    <br>

    <h2 align="center">This Page Has Moved!</h2>

    <br>

