  md: '# # Creating Style Sheets


    # # ASSIGN A CLASS


    +   1 Open the HTML document and click in the page you want to assign a class.


    +   2 Type="class?", replacing ? with the class name.


    You can assign multiple classes by separating names with a space.


    +   3 Open the HTML document in a Web browser.


    Note: To learn about viewing an HTML document in a Web browser, see Chapter 2.


    +   The Web browser applies the styles associated with the class content.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_209_0.png)


    # # M and L''s Travel Agency


    Mount Everest


    Mount Everest is the highest mountain on earth when measured from sea level. It
    is located on the border of Nepal and China.


    Machu Picchu


    Located in the Peruvian Andes, the ancient city of Machu Picchu was constructed
    at the height of 2,430 meters above sea level. The Inca Empire collapsed after
    the Spanish conquest. Today Machu Picchu is a popular tourist destination.


    Santiago de Compostela


    Located in the Galicia region of northwest Spain, Santiago de Compostela is the
    end of the famous pilgrimage of Saint James. Each year, thousands of Christian
    pilgrims walk along the route from the south of France. They finish at Santiago''s
    cathedral, which has the remains of St. James.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_209_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_209_2.png)


    # What is a generic class?


    You can use a generic class to format more than one type of tag. For example,
    you might use a generic class to format both paragraphs and level 3 headings in
    a document. When defining a generic class, simply type a period followed by the
    class name, such as .myclass. When applying the class, use the class name, such
    as <P CLASS="myclass"> or <H3 CLASS="myclass">


    # How do class styles affect styles that have been applied to a tag?


    When you apply a class to a tag, the class-based rules override any conflicting
    rules already assigned to the tag. For example, if you turn the paragraph text
    for a page red with (color:red); and then apply the class P.bluetooth (color:blue);
    the text in that paragraph appears blue instead of red.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_209_3.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_209_4.png)


    # 195'
