  md: '# Create Column and Row Groups


    You can define a group of columns in your table and set attributes across that
    group using the <colgroup> tag. This saves you from having to apply attributes
    separately to all the cells in the columns. You can use the <COL> tag to add special
    formatting to columns that differ from other columns in a group.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_142_0.png)


    # Create Column and Row Groups


    # CREATE A COLUM GROUP


    +   Add a line where you want to insert a new column group and type <COLGROUP
    SPANS="?", replacing with the number of columns you want to include in the group.


    +   You can type any formatting attributes you want to assign the group within
    the <colgroup> tag.


    +   Type </colgroup> to end the group.


    +   Repeat steps 1 and 2 for each column group you want to create.


    Any formatting you assign to the group is applied to every cell in the group.


    +   In this example, one group has a gray background color, while the other has
    a purple background color.


    Note: See the section "Add a Background Color to Cells" to learn.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_142_1.png)


    | Rank | Country | Continent | Area (sq. km) |

    |---|---|---|--|

    | 1 | Russia | Europe | 17,098,242 |

    | 2 | Canada | North America | 9,984,670 |

    | 3 | United States | North America | 9,833,517 |

    | 4 | China | Asia | 9,596,961 |

    | 5 | Brazil | South America | 8,515,767 |


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_142_2.png)'
