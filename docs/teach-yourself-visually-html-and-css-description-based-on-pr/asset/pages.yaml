  md: '# # Customize the Status Bar Message for a Link


    dinarily, when the user moves the mouse pointer over a link on your page, your
    browser''s status bar displays the address of the link. You can customize the
    text that appears in the status bar for a link. For example, you might shorten
    a complex address to something simpler or create your own text message to appear
    instead.


    Always be careful about typing single quotes and double quotes in JavaScript code.
    A mistake can inadvertently leave any spaces unless the code requires it. A mistake
    can cause problems with your script.


    # Customize the Status Bar Message for a Link


    +   - Within the < > tag for the link you want to change, type ONMOUSEOVER="window.status="


    +   - followed by the status bar message text, ending with ''''.


    +   - Anything you type between the single quotes will appear in the status bar.


    +   - return "true".


    +   - When the user moves the mouse pointer ( ) over the link, the status bar
    displays your custom text.


