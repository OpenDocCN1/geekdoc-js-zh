  md: '# # Add JavaScript to a Web Page


    JavaScripts are a great way to add interactivity to your Web pages. You can use
    the `<SCRIPT>` and `</SCRIPT>` tags to add JavaScript to your HTML document. The
    browser reads anything between the two tags as a script.


    To learn more about writing your own JavaScript, try one of these books: JavaScript
    for Dummies, Beginning JavaScript, or JavaScript Blueprint, all from Wiley Publishing.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_270_0.png)


    # Add JavaScript to a Web Page


    +   1. `<SCRIPT LANGUAGE="javascript">` where you want to insert the script on
    the page.


    +   2. Type the code for script what you want to add.


    In this example, the script tells the user of the monitor screen.


    +   3. `<SCRIPT>` at the end of the script.


    ```

    <html>

    <head>

    <title>Uriel and It''s Travel Agency: Destination/</title>

    body {font-family: "Arial"; font-size:12px;}

    </head>

    <body>

    <script language="javascript">

    <script align="center">

    document.write("Your screen width and height are: " + screen.width + " and " +
    screen.height + "");

    </script>

    <center>

    <img src="MachuPicchu.jpg" alt="MachuPicchu">

    document.write("Machu Picchu is in Peru. The ancient city of Machu Picchu was
    constructed in the 1400s at the height of the Inca Empire. It was abandoned until
    1911. Today Machu Picchu is the most visited tourist attraction in Peru.");

    </center>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_270_1.png)


    +   * If you are using Internet Explorer, you may have to click here and then
    **Allow Content** to allow scripts to run in your browser.


    +   * The web browser runs the script when the user views your page.


