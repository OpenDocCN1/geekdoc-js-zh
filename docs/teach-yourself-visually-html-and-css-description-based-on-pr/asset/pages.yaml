  md: '# Adjust Cell Padding and Spacing


    You can use padding to add space between the border and the contents of a cell.
    You can use spacing to increase the border size or distance between the cells.
    Padding and spacing size is measured in pixels.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_126_0.png)


    # Adjust Cell Padding and Spacing


    # SET CELL PADDING


    +   In the &lt;TABLE&gt; tag, type CELLPADDING="?", replacing ? with the pixel
    value you want to assign.


    +   In this example, a table border is turned on to show the padding more clearly.


    ```

    &lt;TABLE BORDER="1" Color="green"&gt;Largest Countries by Area&lt;/FONT&gt;

    &lt;TR&gt;

    &lt;FONT FACE="Arial"&gt;Largest Countries by Area&lt;/FONT&gt;

    &lt;/TR&gt;

    &lt;TD&gt;Country&lt;/TD&gt;&lt;TD&gt;Area (sq. km)&lt;/TD&gt;

    &lt;/TR&gt;

    &lt;TD&gt;Russia&lt;/TD&gt;&lt;TD&gt;17,098,242&lt;/TD&gt;

    &lt;/TR&gt;

    &lt;TD&gt;Canada&lt;/TD&gt;&lt;TD&gt;9,984,670&lt;/TD&gt;

    &lt;/TR&gt;

    &lt;TD&gt;United States&lt;/TD&gt;&lt;TD&gt;9,832,691&lt;/TD&gt;

    &lt;/TR&gt;

    &lt;TD&gt;China&lt;/TD&gt;&lt;TD&gt;9,596,961&lt;/TD&gt;

    &lt;/TR&gt;

    &lt;/TABLE&gt;

    ```


    +   The Web browser displays the designated amount of space between the cell contents
    and the cell borders.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_126_1.png)


    112'
