  md: '# # Display a Pop-Up Window


    You can use JavaScript to display a pop-up window on your Web page. Pop-up windows
    are great for alerting your Web site visitors to important news about your site,
    announcing a sale, or describing your upcoming event. The message that appears
    in the window is actually another Web page created just for the pop-up window.


    The pop-up window references a separate HTML file. You need to create the file
    before using the JavaScript. See Chapter 2 to learn more about building HTML documents.


    # Display a Pop-Up Window


    +   1. With the `<body>` tag `onload="javascript:window.open(''?'')"

    2. Replace `?` with the location and name of the Web page you want to appear in
    the pop-up box.

    3. Type `?`, replacing with a name for the window.

    4. Type `''HEIGHT=?, WIDTH=?''`, replacing each `?` with a height and width, measured
    in pixels, for the pop-up window.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_276_0.png)


    When the user displays the page in a browser, the pop-up window appears.


    +   * The user can click here to close the window.


    **Note:** Be careful about the punctuation you use in your JavaScript. A missed
    comma or quote can cause an error in your script.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_276_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_276_2.png)


