  md: "# Add a Border\n\nYou can add a border to a Web page element using the border\
    \ property. A border can help separate the element from other Web page objects.\
    \ You can\nspecify a thickness value in pixels or\n one of three descriptive values:\n\
    thin, medium, or thick.\n\nYou can assign a color value to a Border. For more\
    \ about HTML colors, see Chapter 4.\n\n# Add a Border\n\n+   1 Click inside the\
    \ tag declaration\ntype border: followed by a\nspace.\n\n+   2 Type a thickness\
    \ value in pixels or\nby descriptive value (thin,\nmedium, or thick).\n\n+   3\
    \ Type a space and then a border\nstyle (solid, double, groove,\nridge, inset,\
    \ outset, dotted, or\ndashed).\n\nNote: If you do not set a border style with\
    \ the\nborder property, the browser will not display\nborder.\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_230_0.png)\n\
    \n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_230_1.png)\n\n216"
