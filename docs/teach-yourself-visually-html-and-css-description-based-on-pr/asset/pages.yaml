  md: '# Set Margins


    You can control the margins of your Web page elements using the margin properties.
    You can set margin values for the top, bottom, left, and right margins around
    a Web page element.


    You can set margin sizing using points (pt), pixels (px), millimeters (mm), centimeters
    (cm), inches (in), pixels (pc), x-height (ex), or em.


    # Set Margins


    +   Click inside the tag and type margin-: and a space, replacing ? with the margin
    you want to add (top, bottom, left, or right).


    +   Type a value for the margin spacing.

    Typing; and then a spacing value that adds around all sides of an element.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_252_0.png)


    The Web browser assigns the margins to the Web page element.


    +   In this example, margins are assigned to the paragraphs on a page.


    +   In this example, borders are turned on. Margin spacing exists outside the
    element''s border.


    Note: See the section "Adding Padding" to learn how to add spacing borders.


