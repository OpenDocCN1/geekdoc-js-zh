  md: '# # Validate Form Data


    You can use JavaScript to check the values of a Web page submitted after the form
    is submitted. If the values are invalid, the script can prompt users to enter
    correct ones. Form validation can help ensure that only valid information is submitted
    with your Web page forms.


    To learn more about creating Web pages, see Chapter 9.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_280_0.png)


    # Validate Form Data


    # VALIDATE INPUT CHARACTERS


    +   1. In the <INPUT> or <TEXTAREA> tag you validate, use ONCHANGE="var pattern=[\/];",
    replacing with the characters whose error is not allowed to type into the form.


    +   2. Type a space and if (pattern.test(this.value)) alert(""), replacing with
    the error message text you want to display.


    In this example, the validation prevents users from typing numbers into the form
    field.


    +   If the user types the wrong data, the validation prompt box appears.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_280_1.png)


    266'
