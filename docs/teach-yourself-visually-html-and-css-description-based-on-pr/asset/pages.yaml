  md: '# # Add Alternative Text Working with JavaScript chapter13


    Some users turn off JavaScript their Web browsers for security reasons. You can
    provide alternative text to describe what the user is missing or to remind them
    their scripting feature is turned off.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_273_0.png)


    # Add Alternative Text


    +   1 Type <NOSCRIPT> below the </SCRIPT> tag.

    2 Type your alternative text message.

    3 Type </NOSCRIPT>.


    Note: You can format the alternate text. See Chapter 3 to learn how to add formatting
    to HTML text.


    ```

    ```html

    <html>

    <title>Lara''s Travel Agency: Destinations</title>

    <body style="font-family:Arial; font-size:12px">

    <script language="javascript"></script>

    <noscript>

    Your browser does not support the Javascript on this page.

