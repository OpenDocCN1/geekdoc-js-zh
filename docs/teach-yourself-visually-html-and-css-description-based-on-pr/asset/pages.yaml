  md: '# # Show a Hidden Element


    You can use JavaScript to show an HTML element that has been hidden on a page.
    You can hide an element by setting the CSS display property to none. With JavaScript,
    you can change that property to block or span, which exposes the element on the
    page.


    To learn more about hiding elements using CSS, see Chapter 12.


    # Show a Hidden Element


    +   1. Add the HTML element that you want to hide or display to your Web page.
    In example, an <img> element is added.

    Note: For more about adding images, see Chapter 5.

    2. Inside the element tag, type the attribute STYLE="display: none" to hide the
    element.

    Note: For more about using the STYLE attribute, see Chapter 10.

    3 Type NAME="? to identify the element, replacing ? with a descriptive name. This
    allows JavaScript to reference the element and change its style.

    4. Type some text to serve as a hyperlink. The user clicks the link to show the
    element.

    5. Before the text, type <A HREF="javascript:void(0)">.

    6. After the text, type <a>.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_282_0.png)


    ```

