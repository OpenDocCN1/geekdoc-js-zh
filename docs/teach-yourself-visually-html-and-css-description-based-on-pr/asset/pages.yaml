  md: '# Link to an E-mail Address


    You can create a link in your Web page that allows users to send an e-mail message.
    Adding e-mail links is a good way to solicit feedback and questions from your
    Web site visitors.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_114_0.png)


    # Link to an E-mail Address


    +   Type the text you want to use as an e-mail link.


    It is standard practice to use the e-mail address as the text link.


    ```

    <HTML>

    <head>

    <title>N and L''s Travel Agency</title>

    </head>

    <body>

    <img src="travel.gif" alt="N and L''s Travel Agency">

    <p>For more than 15 years, N and L''s Travel Agency has helped travelers plan
    expeditions to destinations around the world. We specialize in adventure-building
    honeymoons, packages for all interests, bookings, and rental cars, either online
    or in person.</p>

    <a href="mailto:info@mailtravel.com">Contact us at:</a></p>

    </body>

    </HTML>

    ```


    +   In the front of the link, type <A HREF="mailto:?"> replacing ? with the e-mail
    address you want to use.


    ```

    <HTML>

    <head>

    <title>N and L''s Travel Agency</title>

    </head>

    <body>

    <img src="travel.gif" alt="N and L''s Travel Agency">

    <p>For more than 15 years, N and L''s Travel Agency has helped travelers plan
    expeditions to destinations around the world. We specialize in adventure-building
    honeymoons, packages for all interests, bookings, and rental cars, either online
    or in person.</p>

    <img src="left.jpg" alt="left">

    <img src="right.jpg" alt="right">

    <p>Contact us at:

    <a href="mailto:info@mailtravel.com">info@mailtravel.com</a></p>

    <br clear="all"><a href="#top"></a>

    </body>

    </HTML>

    ```


    +   Type </A> at the end of the link text.


