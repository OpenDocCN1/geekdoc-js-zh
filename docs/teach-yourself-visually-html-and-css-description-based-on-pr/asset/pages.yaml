    # How do I control line breaks in a cell?


    To create a line break in a cell, you can use the <BR> tag or the <P> tag. These
    are the same formatting tags for regular page text. See Chapters 3 and 4 to learn
    more about line breaks and other text formatting. See the next section, "Control
    Wrapping in Cells," to learn how to control the way in which text wraps within
    a table cell.


    # Can I center a table using a style sheet?


    Yes. You can type MARGIN-RIGHT: AUTO or MARGIN-LEFT: AUTO in the table''s style
    sheet to center a table. However, you will need to specify the table width first.
    See Chapters 10, 11, and 12 to learn more about style sheets. See the section
    "Adjust the Table Size" to learn how to set a table width.


