  md: '# # Creating Your First HTML chapter 2


    +   - Click here to navigate to the folder or drive in which HTML document is
    stored.


    +   - Click the file name.


    +   - Open.


    +   - The Open dialog box displays the path and name of the file.


    +   - In the Open dialog box, click OK.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_41_0.png)


    The web browser displays the page.


    +   - The title appears here.


    +   - The body information appears here.


    +   - The location of the HTML file appears here.


    If you make changes to the HTML of the page that is displayed in the browser,
    you can click to refresh the page and view the changes.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_41_1.png)


    # Does it matter what browser I use to view the pages I''m building?


    All popular browsers are set up to view HTML pages that you have saved on your
    computer, also known as offline pages. You may need to follow a slightly different
    set of steps to open an offline HTML document in a browser other than Internet
    Explorer, such as Mozilla Firefox. Be sure to consider your browser''s documentation
    for more information.


    # ## What happens if I cannot view my page?


    If you do not see any content for your page, you need to double-check your HTML
    code for errors. Make sure your document uses correctly parsed start and end tags,
    and proofread your HTML code to make everything is correct. Also make sure you
    use a page with an .html or .htm extension.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_41_2.png)'
