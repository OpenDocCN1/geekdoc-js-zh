    # ## M and L''s Travel Agency


    Things to Do at an Airport


    +   1. Check in at the airline counter

    2. Go through security

    3. Find the departure gate

    4. Buy some food

    5. Board the plane

    6. Take off


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_237_2.png)


    # Can I use an image for a bullet?


    Yes. You can use an image as a bullet, you must include the url value to designate
    the location and name of the image. Your style rule may look similar to this:


    ```

    UL {list-style: url(''images/flower.gif'') circle};

    ```


    You can find numerous bullet images on the Web. The W3 Schools website (www.w3schools.com/graphics/)
    and Stylegalery.com/features/bulletness/ are two such sites.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_237_3.png)


    # Can I control the position of bullets or numbers in my lists?


    Yes. You can use the inside or outside value to position bullets or numbers in
    your lists. You can use the inside value to wrap beneath the bullet or number
    marker. The outside value indents the text to line next inside of the markers.
    Here is an example of the inside value applied in a style rule:


    ```

    OL {list-style: decimal; inside};

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_237_4.png)'
