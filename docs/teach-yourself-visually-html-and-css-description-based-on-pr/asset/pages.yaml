  md: '# Change Link Colors


    You can control the appearance of links throughout your Web pages using a style
    rule. You can change the color of unvisited, visited, and active links. You can
    also remove the default underlining that normally appears beneath a link.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_232_0.png)


    # Change Link Colors


    +   1 A:? to identify the link tag, replacing 7 with the type of link you want
    to change (**link, visited, or active**).


    *Note:* To learn more about writing style sheets and rules, see Chapter 10.


    +   2 Click between the { } and type color: and a space.


    +   3 Type the color name or hexadecimal code you want to assign.


    *Note:* To see a list of color values, see Chapter 4.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_232_1.png)


