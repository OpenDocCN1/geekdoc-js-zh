  md: "# Change Cell Alignment\n\nYou can control the alignment of data within your\
    \ table cells using the ALIGN and VALIGN attributes. The ALIGN attribute controls\
    \ horizontal alignment: left, center, and right. By default, all table data you\
    \ enter into cells is left-aligned. The VALIGN attribute controls vertical alignment:\
    \ top, middle, and bottom. By default, the table data is vertically aligned to\
    \ appear in the middle of each cell.\n\nYou can add alignment attributes to a\
    \ single cell, row, or all the data in the table. To learn how to position a table\
    \ on the page, see the section \"Change Table Alignment.\"\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_138_0.png)\n\
    \n# Change Cell Alignment\n\n+   1 Click the tag for the cell, row, or table to\
    \ align.\n\nNote: You can also align column or row groups. See the section \"\
    Create Column and Row Groups\" to learn more.\n\n+   2 Type Alignment=\"?\", replacing\
    \ ? with a horizontal alignment attribute: left, center, or right.\n\n```\n```html\n\
    <table border=\"1\" BORDERSIZE=\"10\" CELLPADDING=\"5\">\n  <tr>\n    <th align=\"\
    center\">City</th>\n    <th align=\"center\">Low</th>\n    <th align=\"center\"\
