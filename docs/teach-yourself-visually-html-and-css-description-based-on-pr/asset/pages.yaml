- img_proc: true
  md: '# Getting Familiar with HTML and Web Page Basics


    # Communication Standards


    The Internet infrastructure relies on a variety of protocols that dictate how
    computers and networks talk to each other. For example, Transmission Control Protocol/Internet
    Protocol, or TCP/IP, is a set of rules that dictate how messages flow between
    computers. HyperText Transfer Protocol, or HTTP, is a set of rules that determine
    how browsers request Web pages and how server computers deliver them. Having agreed-upon
    protocols allows seamless communication among the different types of computers
    that connect to the Internet.


    # The World Wide Web


    The World Wide Web is a giant collection of documents, pages, stored on computers
    around the globe. Commonly called the Web, this collection of pages represents
    a wealth of text, images, and video available to any computer with an Internet
    connection. Web pages are stored on servers, which are Internet-connected computers
    running software that allows them to serve up information. By access a text file,
    image, or other document in a Special Web directory on a server, that information
    is available for other users to view. Chapter 15 talks about how to transfer information
    to a Web server.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_19_0.png)


    # URLs and Links


    Every page on the Web has a unique address called a URL, which is short for Uniform
    Resource Locator. A URL looks like this:


    ```

    http://www.example.com/index.html

    ```


    If you know your page''s URL, you can type it into a Web browser to view that
    over the Internet. You can also view pages via of hyperlinks, or simply links,
    which are clickable words or images on Web pages. Every link on a page is associated
    with a URL that leads to another page on the Internet. Users can jump from one
    Web page to another by clicking links. Chapter 6 discusses how to create links
    with HTML.


    # Browsers


    A Web browser is allows you to view and interact with Web pages. When you type
    a URL or click a link in a Web browser, the browser retrieves the appropriate
    page from a server on the Internet and displays that page. Microsoft Explorer,
    Mozilla Firefox, and Apple Safari are the three most popular browsers in use today.
    Each program has number of versions with newer versions supporting more recent
    Web features. As you build your pages using HTML code, remember that different
    browsers may display your pages slightly differently depending on the version.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_19_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_19_2.png)'
