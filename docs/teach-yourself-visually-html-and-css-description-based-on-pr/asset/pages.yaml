  md: '# Link to a Style Sheet


    Link to a style sheet to assign a set of formatting rules to your HTML document.
    You can link multiple documents to the same style sheet to give all the pages
    in your site a consistent look and feel.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_204_0.png)


    # Link to a Style Sheet


    +   1. Open the HTML document you link to a style sheet.

    Note: To learn how to create a style sheet, see the section "Create an External
    Style Sheet."\n2. Click within the <head> and </head> tags and add a new line.

    3. Type <link REL="stylesheet" TYPE="text/css">.

    4. Type a blank space and href="?", replacing 7 with the name of the style sheet.
    If the style sheet is located in a subfolder, also specify the path.


    The style sheet is now linked with your page.


    You can test your page in a browser to see the style sheet results.


    ```

    <html>

    <head>

    <title>Lucy and L''s Travel Agency: Destinations</title>

    <link rel="stylesheet" type="text/css" href="styles.css">

    <meta name="description="Machu Picchu, Peru"/>

    <img src="machu.jpg" alt="left">

    <img src="machu.jpg" alt="right">

    <p>Located in the Peruvian Andes, the ancient Inca city of Machu Picchu was constructed
    in 1450 at the height of the Inca Empire. It was abandoned less than 100 years
    later when the Inca empire fell under Spanish conquest. Today Machu Picchu is
    the most visited tourist attraction in Peru.</p>

    </head>

    </html>

    ```


    ```

    <html>

    <head>

