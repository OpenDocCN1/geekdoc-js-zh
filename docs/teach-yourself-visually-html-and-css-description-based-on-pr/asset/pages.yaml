  md: '# # Use Absolute Positioning


    You can apply absolute positioning to place an element at coordinates on a page,
    independent of elements that came before it. The coordinates are determined relative
    to the box that contains them. This allows you to precisely fit boxes of text,
    images, and other content on a page, like a jigsaw puzzle.


    Absolute positioning removes an object from the normal flow of content. Its size
    and position have no effect on the position of content that follows.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_248_0.png)


    # Use Absolute Positioning


    +   1. Click inside the tag declaration and type position: **absolute.**


    In this example, absolute positioning is applied to an image using an ID attribute.
    For about using the ID attribute, see Chapter 10.


    +   2. Click inside the tag declaration and type left: **7**, replacing with the
    amount you want to offset the element from the left.


    In this example, the image is offset to the left of several paragraphs of text.


    ```

    ```html

    <html>

    <head>

    <title>Great Destinations</title>

    <style>

    body { font-family: "Arial"; }

    #Great-light {

    position: absolute;

    left: 7px;

    }

    </style>

    </head>

    <body>

    <h1>Great Destinations</h1>

    <img id="Great-light" src="pyramid.jpg">

    </body>

    </html>

    ```

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_248_1.png)'
