    # How do I hide my frame borders completely?


    To hide all the frame borders, type BORDERCOLOR="0" in the <FRAMESET> tag. This
    coding makes the content of each frame blend into one large Web page. In some
    browsers, you may still see a small space between the panes. To remove this space,
    use BORDER="0" in the <FRAMESET> tag.


    # Is there another way I can control frame border thickness?


    You can use the FRAMING attribute to control the thickness of frame borders. However,
    only Internet Explorer supports this attribute; it is not part of the HTML standard.
    To set a border thickness, type FRAMING="2" in the <FRAMESET> tag, replacing with
    the thickness value you want to set. Border thickness is measured in pixels.


