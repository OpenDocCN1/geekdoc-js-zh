  md: '# Insert Special Characters


    You can use HTML code to insert special characters into your Web page text. Special
    characters are characters that do not usually appear on your keyboard.


    The codes used to insert special characters are called entities. Entities consist
    of number or name codes preceded by an ampersand and 1/2 or &semicolon;, as &frac1;
    for the fraction 1/2 or &para; for a paragraph symbol.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_62_0.png)


    # Insert Special Characters


    +   1 Click where you want to insert a special character.

    2 Type the number or name code for the character, with an ampersand (&) before
    the code and a semicolon (;) following the code.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_62_1.png)


    +   The Web browser displays the designated character in the text.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_62_2.png)


