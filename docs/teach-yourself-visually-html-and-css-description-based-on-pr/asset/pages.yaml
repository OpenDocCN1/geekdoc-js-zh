  md: '# Adding Text


    # SET A NUMBER STYLE


    Type TYPE="?" within the <OL> tag, replacing ? with a number style code:


    +   A: A, B, C


    +   a: a, b, c


    +   I: I, II, III


    +   i: ii, iii


    +   1: 1, 2, 3


    The numbered list is displayed in the style you selected.


    In this example, the list uses letters rather than numbers.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_57_0.png)


    # How do I add another item to my numbered list?


    Simply insert the text where you want to appear in the list and add the <LI> and
    </LI> tags before and after the text. The Web browser displays the updated list
    next time you view the page.


    # How do I start my numbered list numbering that is different from the default?


    By default, a Web browser reads your numbered list coding and starts with number
    1. To start with a different number, you must add a START attribute to the <OL>
    tag. For example, if the numbering is start at 5, the coding would be <OL START="5"
    TYPE="1">.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_57_1.png)


    43'
