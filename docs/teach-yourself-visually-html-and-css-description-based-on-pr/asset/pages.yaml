  md: '# # Add Space

    Around an Image


    # Adding Images chapter 5


    Most Web browsers display only a small amount of space between images and text,
    also called *padding*, to make the page more visually appealing and easier to
    read. You can increase the amount of space, and control padding on the left and
    right sides of an image with the `HSPACE` attribute. You can control the padding
    above and below an image with the `VSPACE` attribute.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_97_0.png)


    The values used with horizontal and vertical attributes specify the padding in
    pixels.


    +   - Click inside the `<img>` tag and type `HSPACE="?` or `VSPACE="?`, replacing
    ? with the amount of space you want to insert.


    You can add one or both attributes to an image.


    If you add both attributes, separate them with a space in the HTML coding.


    ```

    <html>

    <head>

    <title>It''s La Travel Agency: Destinations/TITLE</title>

    </head>

    <body>

    <img src="machu.jpg" alt="Machu Picchu, Peru/" hspace="20" />

    <img src="old_city.jpg" alt="Old Inca Empire/" vspace="15" />

    <p>Located in the Peruvian Andes, the ancient city of Machu Picchu was constructed
    by the Incas at the height of the mountain range. It was abandoned for more than
    100 years after the Inca empire collapsed under Spanish conquest. Today Machu
    Picchu is the most visited tourist attraction in Peru.</p>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_97_1.png)


    +   - The web browser displays the image with the specified amount of space around
    it.


    The `HSPACE` and `VSPACE` attributes add space to two sides at a time. To add
    just to one side, for example the bottom of an image, use style sheets. See Chapter
    12 for details.


    # Machu Picchu, Peru


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_97_2.png)


