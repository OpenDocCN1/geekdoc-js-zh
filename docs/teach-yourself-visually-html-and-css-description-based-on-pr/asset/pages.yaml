  md: '# Controlling Layout with Style Sheets


    To control how the image repeats, type background-repeat: repeat, replacing it
    with repeat, repeat-x, or no-repeat:


    The repeat-x value tiles the image horizontally, while repeat-y tiles the image
    vertically.


    The repeat value, which is the default, tiles the image in directions.


    The no-repeat value displays the image once.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_263_0.png)


    ```

    <html>

    <title>Destinations</title>

    <body>

    <div style="background-image:url(''reef.jpg''); background-repeat:repeat; font-family:Arial;
    width:100px; height:200px; margin:0 auto;">

    </div>

    </body>

    </html>


    <img src="reef.jpg" alt="Great Barrier Reef is the world''s largest coral reef
    system, composed of coral stretching for 2300 miles. The reef is located in the
    Coral Sea, off the coast of Queensland, Australia. The Great Barrier Reef is the
    world''s biggest living structure, which is built by billions of organisms known
    as coral polyps.">

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_263_1.png)


    The web browser displays the image as a background with the specified repeat type.


    Note: To add a background image using HTML, see Chapter 5.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_263_2.png)


    # How do I create a background image that appears once in the center of my page?


    You can use a no-repeat value to the background-repeat property to place the image
    in the background. Then you can specify the location of the image using the background-position
    property. A center value places the image in the center of the Web page. You can
    use percentage values to place the image relative to the height and width of the
    window or numeric values to place it at specific coordinates. The first value
    is always the horizontal position, while the second value is the vertical.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_263_3.png)


    # How do I keep a background image from scrolling with the page?


    To control whether or not your background image scrolls with the page content,
    you assign background-attachment property. Assigning scroll, the default, allows
    the background image to scroll, while fixed keeps the background image fixed as
    the page content moves. This feature works with the different repeat and positioning
    settings described in this chapter.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_263_4.png)


