  md: '# Working with Frames chapter 8


    OPEN Open the HTML file where the link should appear.


    Type <A HREF="?"> replacing ? with the target page.


    Type a space and TARGET="_top".


    Note: To name frames, see the section "Create Frames".


    Type the link text.


    Type <A>.


    ```

    <HTML>

    <HEAD>

    <TITLE>L''s Travel Agency</TITLE>

    <FRAMSET ROWS="100%,*">

    <FRAME NAME="menu" SRC="menu.html">

    <FRAMSET COLS="200,*">

    <FRAME NAME="main" SRC="main.html" target="_top">

    <FRAME NAME="bottom" SRC="bottom.html">

    </FRAMSET>

    </FRAMSET>

    <BODY>

    <A TARGET="_self">

    <A HREF="madrid.html">Madrid</a>

    <A HREF="seville.html">Seville</a>

    <A HREF="barcelona.html">Barcelona</a>

    <A TARGET="_parent">

    <A HREF="santiagocompostela.html" target="_top">Santiago de Compostela</a>

    </A>

    </BODY>

    </HTML>


    ```


    When the user clicks the link, the page opens on top of the existing frameset.


    In step 3, you can type TARGET="_parent" to open the page in the parent frameset
    of a nested frameset.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_167_0.png)


    # Santiago de Compostela


    Located in the Galicia region of Spain, Santiago de Compostela is the capital
    of the province. Each year, thousands of Christian pilgrims spend weeks on foot
    to reach the cathedral of Saint James. Each year, they arrive at the cathedral
    where legend says the remains of St. James are buried.


    # How do I make all the links open in the same frame?


    To make all page links open in the same frame, you can add the target frame information
    to the <HEAD> tag, type <BASE TARGET="?"> replacing ? with the name of the target
    frame. You must name the frame in the frameset document in order to reference
    name it with the TARGET attribute.


    # Can I make the target link open in a new window?


    Yes. You can use the TARGET attribute to construct the link to open the link in
    a new window. To open the link page in a new, unnamed window, use the _blank value.
    For example:


    ```

    <A HREF="mypage.html" TARGET="_blank">

    Click here to view the page</A>

    ```


    In this code, when the user clicks the link, the mypage.html opens in a new browser
    window.'
