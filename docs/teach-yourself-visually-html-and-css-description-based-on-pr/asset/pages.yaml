    # ## How can I make an element transparent so that elements below it show through?


    You can make content on your Web page transparent by changing its opacity. Note
    that different browsers recognize different style commands for changing opacity.
    Use the following steps:


    +   - Create a rule for the element you want to make transparent.

    - **Type filter: alpha(opacity=?)** , replacing ? with a value up to 100. The
    **filter** property works in Internet Explorer.

    - **Type opacity: ?** ** , replacing ? with a fractional number from 0 to 1.0.
    The **opacity** property works in more popular browsers.


    ```

    ```html

    <head>

    <title>Great Destinations</title>

    </head>

    <style>

    #paris {

    position: absolute; top: 50px; left: 100px;

    }

    #rome {

    position: absolute; top: 80px; left: 250px;

    filter: opacity(0.5);

    }

    </style>

    <body>

    <img SRC="reef.jpg" align="LEFT" WIDTH="400" id="bottom">

    <img SRC="pyramids.jpg" align="LEFT" WIDTH="400" id="top">

    </body>


    ```

    ```


    The web browser turns the transparent element, allowing elements below it to show
    through.'
