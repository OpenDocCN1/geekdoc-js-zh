  md: '# # Wrap Text Between Images


    Can place two images side by side and wrap text between the two. To create this
    effect, you align one image to the left and the other to the right.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_94_0.png)


    # ## Wrap Text between Images


    +   1. Use <img> tags to insert the two images above the text you want to wrap.

    2. Click inside the first <img> tag and type ALIGN="left".

    3. Click inside the second <img> tag and type ALIGN="right".


    ```

    <html>

    <head>

    <title>Machu Picchu - Leo''s Travel Agency Destinations</title>

    </head>

    <body>

    <img src="machupicchu.jpg" alt="Machu Picchu, Peru" align="left">

    <img src="machupicchu.jpg" align="right">

    Machu Picchu was constructed at the height of the Inca Empire. It was abandoned
    less a hundred years after the Inca Empire collapsed under Spanish conquest. Machu
    Picchu is the most tourist attraction in Peru.

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_94_1.png)


    The text wraps between the two images on the Web page.


    Note: To learn how to add space between an image and surrounding text, see the
    section "Add Space around an Image."


