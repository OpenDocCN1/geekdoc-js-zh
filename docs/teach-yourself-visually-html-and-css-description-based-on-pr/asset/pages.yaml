  md: "# Create Side Navigation\n\nYou can use a table to create a two-column layout\
    \ for your page. You can use a narrow column on the left to hold navigation links\
    \ and a larger column on the right to hold the main content.\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_132_0.png)\n\
    \n# Create Side Navigation\n\n+   1. Start your table by typing <TABLE> and <TR>\
    \ tags.\n\n+   2. Type <TD ALIGN=\"top\" WIDTH=\"top\">, replacing with the pixel\
    \ value or percentage value you want to assign for your navigation column.\n\n\
    +   3. Type your navigation links. You can use the <BR> to put links on different\
    \ lines.\n\nNote: For more information about links, see Chapter 6.\n\n+   4. Type\
    \ <TD> at the end of the link text.\n\n+   5. Type <TD ALIGN=\"top\" WIDTH=\"\
    top\">, replacing with the pixel or percentage value you want to assign for the\
    \ main content column.\n\n+   6. Type your main content.\n\n+   7. Type </TD>,\
    \ and </TR>, then </TABLE> to close the table.\n\nWhen the table displays in a\
    \ browser, the links appear to the left of the main content.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>L and L's Travel Agency</title>\n<meta charset=\"\
    UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n<link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n<table CELLSPACING=\"\
    0\">\n  <tr>\n    <td ALIGN=\"top\" WIDTH=\"150\">\n      <img src=\"navigation.gif\"\
    \ alt=\"Navigation\">\n      <a href=\"index.html\">Home</a><br>\n      <a href=\"\
    tours.html\">Popular Destinations</a><br>\n      <a href=\"contact.html\">Contact\
    \ Us</a>\n    </td>\n    <td ALIGN=\"top\" WIDTH=\"350\">\n      <h1>L and L's\
    \ Travel Agency</h1>\n      <p>After more than 15 years, L and L's Travel Agency\
    \ has helped countless travelers explore the world. We specialize in one-of-a-kind\
    \ vacation packages for all budgets. We offer hotel bookings, and rental cars,\
    \ either online or in person.</p>\n      <a href=\"tours.html\">View Tours</a><br>\n\
    \      <img src=\"dest.jpg\" alt=\"Destinations\">\n    </td>\n  </tr>\n</table>\n\
    </body>\n</html>\n```\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_132_1.png)\n\
