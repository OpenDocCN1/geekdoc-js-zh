    # How do I use the program to design my page to the metadata information?


    To specify an authoring program, type <META NAME="generator" CONTENT="Program
    Name">\ Substitute the name of you for the text Program Name.


    The only users who can see your metadata information is if they view the HTML
    code for page. To view the HTML code of any page in your browser window, click
    View and find Source. This opens a text-editor window displaying the HTML used
    to create your page. Any metadata assigned to the document appears at the top
    inside the <HEAD> tags.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_45_0.png)


