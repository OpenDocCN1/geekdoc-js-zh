  md: '# Add Alternative Text


    # Working with Frames chapter 8


    You can use the <NOFRAMES> tag to insert alternative text for users whose browsers
    do not support frames. In some cases, the user may have decided to turn off frame
    display. Alternative text can alert them to the content they are missing.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_163_0.png)


    # Add Alternative Text


    +   Directly above the </FRAMES> tag, add a line and type <NOFRAMES>.


    ```

    <html>

    <head>

    <title>It''s Lisa''s Travel Agency</title>

    </head>

    <FRAME name="banner" SRC="travel_banner.html">

    <FRAME name="main" SRC="travel_main.html" MARGINWIDTH="50">

    <FRAME name="content" SRC="content.html">

    <NOFRAMES>

    Your web browser does not support frames, or they are turned off.

    </NOFRAMES>

    </html>

    ```


    +   Type any alternative text you want to appear.


    +   Type <NOFRAMES>

    If the user''s browser does not support frames, or the frame display is turned
    off, a page appears with the alternative text.


    ```

    <html>

    <head>

    <title>It''s Lisa''s Travel Agency</title>

    </head>

    <FRAME name="banner" SRC="travel_banner.html">

    <FRAME name="main" SRC="travel_main.html" MARGINWIDTH="50">

    <NOFRAMES>

    Your web browser does not support frames, or they are turned off.

    </NOFRAMES>

    </html>

    ```'
