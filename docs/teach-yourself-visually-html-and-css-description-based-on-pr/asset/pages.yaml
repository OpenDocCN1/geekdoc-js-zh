    ### Great Pyramid of Giza

    The Great Pyramid of Giza is one of the oldest and largest of the three Egyptian
    pyramids located near Cairo. It was the tallest man-made structure in the world
    for over 3,800 years and is believed to have been built as a tomb for the Fourth
    Dynasty Egyptian Pharaoh Khufu.


    ### The Great Wall

    The Great Wall of China is a series of stones and earthen structures built to
    guard the borders of the Chinese Empire. It stretches over 6,000 miles to the
