- img_proc: true
  md: '# # Insert a Blank Space


    # Adding Text chapter 3


    You can insert blank spaces within a line of text to indent or add emphasis to
    your text. You can also use blank spaces to help position an element on a Web
    page, such as a graphic or photo.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_51_0.png)


    # Insert a Blank Space


    +   1 &nbspsp; in the line where you want to add a blank space.


    To add multiple spaces, type the code multiple times.


    The code stands for **nonbreaking space**. Web browsers will not create a line
    break when you insert these characters.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_51_1.png)


    The browser displays blank spaces in the line.


    +   In this example, the blank spaces cause a paragraph to be indented.


    The code &nbsp; is a type of HTML entity. For more about entities, see the section
    "Insert Special Characters."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_51_2.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Insert Preformatted Text


    You can use the preformatted tags, <PRE> and </PRE>, to keep the line breaks and
    spaces you enter for a paragraph or block of text. Web browsers ignore hard returns,
    line breaks, and extra spaces between words you insert the preformatted tags.
    If you type a paragraph with spacing just the way you want, you can assign the
    preformatted tags to keep the spacing in place.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_52_0.png)


    # Insert Preformatted Text


    +   1 <PRE> above the text you want to keep intact.

    2 <PRE> below the text.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_52_1.png)


    +   * When displayed in a Web browser, the text retains all your original line
    breaks and spacing.


    Browsers display preformatted text in a monospaced font by default. This can help
    you align elements within the text into columns.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_52_2.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# # Insert a Heading


    You can use headings to help clarify information on a page, organize text, and
    create visual structure. You can choose from six heading levels for documents,
    ranging from heading level 1 (<H1>), the largest, to heading level 6 (<H6>), the
    smallest. Headings appear as bold text on a Web page.


    You can use the ALIGN attribute to change the horizontal alignment of a heading,
    such as <H1 ALIGN="right"> See the section "Change Paragraph Alignment" to learn
    more about inserting alignment controls within your HTML tags.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_53_0.png)


    # Insert a Heading


    +   - Type <H> in the front of the text you want to turn into a heading, replacing
    ? with the heading level number you want to assign.


    +   - You can set a heading level from 1 to 6.


    +   - Type </H> at the end of the heading text, replacing ? with the corresponding
    heading level.


    +   - Type additional heading tags for any other text that you want to emphasize
    on the page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_53_1.png)


    +   - The heading appears in bold text in the Web browser.


    This figure shows an example of each heading size in descending order.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_53_2.png)'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Add Block Quotes


    You can use block quotes to set off a paragraph from the rest of the document
    page. Block quotes are commonly used with quoted text or excerpts from other sources.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_54_0.png)


    # Add Block Quotes


    +   1 Type <BLOCKQUOTE> in front of the text you want to turn into a block quote.

    2 Type </BLOCKQUOTE> at the end of the text.


    ```

    ```html

    <HTML>

    <title>It''s Travel Agency: Quoted</title>

    <h2>Memorable Quote</h2>

    <BLOCKQUOTE>Business makes all things difficult, but industry; all things so easy.
    He that eats late must fast all day, and travels so slowly that poverty overtakes
    his business at <BLOCKQUOTE>

    Benjamin Franklin

    </BLOCKQUOTE>

    <body>

    </HTML>

    ```

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_54_1.png)


    The Web browser displays the block quote as inset text on the document page.

    You can place text inside multiple <BLOCKQUOTE> tags to add more indenting.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_54_2.png)'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Insert a Comment


    You can use comments to write notes to yourself within an HTML document. Comments
    do not appear when a browser displays a Web page. For example, you might leave
    a comment about a future editing task or leave a note to other Web developers
    viewing your HTML source code.


    You can also place comments around HTML code to turn that code off. HTML tags
    comments are not interpreted by the browser.


    # Insert a Comment


    +   1. Type <- where you want to place a comment.


    +   2. Type the comment text.


    +   3. Type - ->.


