  md: '# # Wrap Text around Elements


    You can use the float property to control how text wraps the elements on your
    Web page. The left value controls the left side of an element, and the right value
    controls the right side of an element. To ensure proper text wrapping, place the
    floating element before the text you want to wrap.


    The float property does not work with elements which you have assigned an absolute
    or fixed position.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_254_0.png)


    # Wrap Text around Elements


    +   1 Click the tag declaration you want to control and type float: and a space.

    2 Type left to set the element to the left side of the text, or type right to
    set the right side of the text.


    ```

    ```html

    <html>

    <title>Destinations</title>

    <style>

    img { margin: 5px; font-family: "Arial"; }

    pp { padding: 10px; margin: 10px; background: #DCDCDCD; width: 50%; }

    left { float: left; }

    right { float: right; }

    </style>

    <body>

    <img src="pyramid.jpg" width="200">

    <p>The Great Pyramid of Giza is one of the oldest and largest of the three Egyptian
    pyramids located near Cairo. It was the tallest man-made structure in the world
    for over 3,800 years and is believed to have been built as a tomb for the Fourth
    Dynasty Egyptian Pharaoh Khufu.</p>

    <img src="sphinx.jpg" align="right" width="160">

    <p>The Great Wall of China is a series of stones and earthen structures built
    to guard the borders of the Chinese Empire. It stretches over 6,000 miles to the
    southern edge of Mongolia. At its peak, it was nearly impenetrable.</p>

    </body>

    </html>

    ```

    ```


    The Web browser floats the element as directed.


    +   In this example, the <IMG> elements float to the right of the headings and
    paragraphs.

    Margins have been added to the <IMG> elements to separate them from the text.


    *Note:* See the section "Add Margins" for details about margins.


