  md: '# # Formatting Text with Style Sheets


    +   - Type a semicolon (;) followed by a space.


    +   - Type text-decoration: none to remove the link underline.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_233_0.png)


    The Web browser displays the link in the style you specified.


    +   - In this example, the style is assigned to the navigation links.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_233_1.png)


    # What other style properties can I apply to links?


    You can use the background and font properties to control the appearance of your
    links. Here is an example of a rule with other properties assigned:


    ```

    A:link { background: yellow; font-family: "Arial"; }

    ```


    Anytime you type more than one declaration in a style rule, be sure to separate
    them with semicolons.


    # Do I need to use styles to change the link color?


    If you want to change the link color, you do have to use styles. You can use regular
    HTML, THE LINK, and ALINK attributes for the BODY tag to set the colors for regular
    links, visited links, and active links, respectively. See Chapter 6 for more information.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_233_2.png)


