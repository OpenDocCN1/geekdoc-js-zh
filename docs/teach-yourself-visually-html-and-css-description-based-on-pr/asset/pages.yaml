- img_proc: true
  md: '# Radio Buttons


    Radio buttons are the small, circular buttons found on forms, named for their
    resemblance to the buttons on older automobile radios. Like check boxes, radio
    buttons are used to present several choices to the user. Unlike with check boxes,
    however, users may select only one radio button in a set. For example, if you
    include a feedback form on your page that rates your Site, you might include radio
    buttons for the values Excellent, Good, Average, and Poor. The user can select
    only one of the four options.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_175_0.png)


    # Menus and Lists


    Menu and list input elements enable you to present a large set of choices in a
    form. In a drop-down menu, a user clicks a box to open a list of options from
    which he or she can select only one. For example, users often choose from a drop-down
    menu when selecting their state or country in an address form. You can also present
    data as a scrollable list and allow users to select multiple options.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_175_1.png)


    # Submit and Reset Buttons


    Users need a way to send their data to the Web server. They can do this using
    a Submit button, which usually appears at the end of the form input elements.
    Data is collected only after the user clicks this button. You might also add a
    Reset button to your HTML form that allows the user to reset all the input fields
    and start over.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_175_2.png)'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Gather Form Data


    After a user submits data from a form to a Web server, you must do something with
    the information. Before you begin your form, you need to know how the collected
    data will be processed. Your Web host can usually help you set up programs known
    as scripts to process the form information.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_176_0.png)


    # CGI Scripts


    The form data you collect will most likely be processed by CGI (Common Gateway
    Interface) scripts. These are often written in Perl, PHP, or Java and run on the
    same Web server that serves your HTML pages. Scripts take form data and do something
    useful with it, such as putting it into a database, writing it to a file, creating
    a customized HTML response page, or sending the information to an e-mail address.


    # Finding CGI Scripts


    You can write your own CGI scripts if you know a programming language such as
    Perl, PHP, or Java, and can adapt one of the many free CGI scripts available on
    the Web. Sites like the CGI Resource Index (http://cgi.resourceindex.com), Matt''s
    Script Archive (www.scriptarchive.com), and HotScripts.com (www.hotscripts.com)
    are good places to stay. You should also check with your Web host to see what
    it provides.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_176_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_176_2.png)'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# CGI Scripts and Web Servers


    # Preparing a Script


    Many Web hosts offer CGI scripts for forming data. If your Web host does, you
    need to find out the location of your server''s CGI-bin directory. A CGI-bin directory
    is a place on Web where CGI scripts are stored (the directory may be something
    else, depending on the server). If your Web host does not allow CGI scripts, you
    might consider using another language to produce form results. Sites such as Digital
    Resources (www.creative-d.com) and Response-O-Matic (www.response-o-matic.com)
    offer free processing.


    To adapt a CGI script to your form output, you need to adjust the script variables
    and paths to suit your Web server. You must also transfer the CGI script to your
    server using FTP (File Transfer Protocol). You should check with the Web hosting
    where you are to store the CGI file. Some prefer to store scripts in a central
    CGI-bin directory, while others let you store them in your folders as long as
    the scripts have a particular file extension.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_177_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_177_1.png)


    # Sending Data to Databases


    # Sending Data to an E-mail Address


    Another use for CGI scripts is to send data to a database. Database programs are
    designed to store and manage large amounts of data. CGI scripts translate requests
    from the Web server into a format readable by a database. If you plan to use your
    form data in a database, you need to learn more about how databases work with
    the Web.


    If you do not want to use a CGI script, you can use a command directly in your
    <FORM> to send form data to an e-mail address. This action returns a list of field
    names and the values entered in each. This option is useful only if the form is
    simple; more complex forms require scripts or databases to make sense of the information.
    To learn more about sending form data via e-mail, see the section "Send Data to
    an E-mail Address".


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_177_2.png)'
  merge: -1
  pgno: 177
