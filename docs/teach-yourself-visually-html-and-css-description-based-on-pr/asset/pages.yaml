  md: '# # Send Form Data to an E-mail Address


    # Creating Forms chapter 9


    You can instruct the browser to send form data to an e-mail address. You might
    pursue this by creating a simple form or if your Web server does not support CGI
    scripts.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_179_0.png)


    # Send Form Data to an E-mail Address


    +   1 Click where you want to insert a form and type "METHOD="post".


    +   2 Type a space and ENCTYPE="text/plain".


    +   3 Type a space and ACTION="mailto:?", replacing with the e-mail address to
    which you want to send the form data.


    ```

    <html>

    <head>

    <title>Lila''s Travel Agency</title>

    </head>

    <body bgcolor="#FFFFE0">

    <center face="Arial" size="4">

    <img src="micro_travel.gif" alt="Lila and Lila''s Travel Agency">

    <h2 id="000066">Customer Information Form FORM="/process.php"</h2>

    <p>Please tell us about yourself so we can help you with your travel</p>

    <form method="post" enctype="text/plain"

    action="mailto:webmaster@example.com">

    </center>

    </body>

    </html>",

    ```


    +   4 Type </FORM>.

    You can add input elements to your form between the <FORM> and </FORM> tags.


    Note: See the remaining sections in this chapter to learn more about adding input
    elements.'
