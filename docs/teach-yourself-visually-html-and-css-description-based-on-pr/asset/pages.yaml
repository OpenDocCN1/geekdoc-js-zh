  md: '# # Change Link Colors


    You can control the color of links on a page. Links can appear as different colors
    depending on whether or not they have been clicked before. You can also define
    the color that a link turns when a user clicks it.


    You assign link colors in the BODY tag. Use the LINK attribute to assign a color
    to unclicked links. Use the ACTIVE attribute, which stands for active link, to
    specify the color that appears when a link is being clicked. Use the VLLINK attribute,
    which stands for visited link, to change the color of previously clicked links.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_116_0.png)


    # Change Link Colors


    +   1 In within the <body> tag and link type="?", replacing with the color value
    you want to apply to the unselected links on your page.


    Note: To learn more about HTML color, see Chapter 4.


    +   2 Type a space.


    +   3 ALINK="?", replacing with the color value you want to apply to links on
    your page.


    +   4 Type a space.


