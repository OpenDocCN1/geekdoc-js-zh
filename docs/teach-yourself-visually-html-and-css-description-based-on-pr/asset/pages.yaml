  md: '# Formatting Text with Style Sheets


    Type a repeat option for the image:

    **repeat** repeats the image to fill the background (default).

    n**repeat-x** tiles the image horizontally.

    **repeat-y** tiles the image vertically.

    **no-repeat** prevents a background image from repeating.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_229_0.png)


    The Web browser displays the background image as designated in the style rule.


    +   In this example, a background image is added to a DIV tag surrounding one
