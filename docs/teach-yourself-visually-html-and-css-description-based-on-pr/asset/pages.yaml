  md: '# # Add a File Upload Element


    If you want users to send files, as resumes or photos, you can add a file upload
    element to your form. When you add the element, a Browse button appears with the
    field, allowing users to locate the file they want to send.


    The upload element works only if your <FORM> tag''s METHOD attribute is set to
    post. See the section "Create a Form" to learn more about specifying method.


    # Add a File Upload Element


    +   1. Make sure the <FORM> tag method is set to post.

    2. Within the <FORM> tag, type ENTYPE="multipart/form-data".


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_194_0.png)


    +   3. Type the text you want to appear next to the upload element.

    4. Type <INPUT TYPE="file">.


    ```

    <html>

    <head>

    <title>ITM and L''s Travel Agency</title>

    </head>

    <body>

    <h1 value="water-gif">LEFEBRAN="25"

    <p>ABRAHAM,ISAAC</p>

    <img src="travel.jpg">

    <p style="color:#000066">Customer Information Form</p>

    <p>Please tell us all about your travel needs so we can help you with your travel
    needs.</p>

    <form method="post" action="/customer.cgi" enctype="multipart/form-data">

    Your name:<br>

    <input type="text" name="username" size="30"><br><br>

    Comment:<br>

    <textarea rows="5" cols="30"></textarea><br><br>

    Reviews:<br>

    <input type="checkbox" name="Flight" value="yes">

    <label for="Flight">Flight</label><br>

    <input type="checkbox" name="Hotel" value="yes">

    <label for="Hotel">Hotel</label><br>

    <input type="checkbox" name="Car" value="yes">

    <label for="Car">Car</label><br>

    <input type="radio" name="region" value="North America" selected>

    <input type="radio" name="region" value="South America">

    Attach your photo: <input type="file" name="File"><br><br>

    Action:<br>

    <input type="submit" value="Send">

    <input type="reset" value="Reset">

    </form>

    </body>

    </html>

    ```'
