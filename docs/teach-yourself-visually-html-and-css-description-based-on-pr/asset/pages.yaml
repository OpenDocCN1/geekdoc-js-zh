  md: '# Create a Numbered List


    You can use numbered lists on your Web page to display all kinds of ordered lists.
    For example, you can use numbered lists to show steps or prioritize items.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_56_0.png)


    # Create a Numbered List


    # PLACE TEXT IN A NUMBERED LIST


    +   1 Type <ol> above the text you want to turn into a numbered list.

    2 Type <li> in front of each item in the list.

    3 Type </li> after each list item.

    4 Type </ol> after the list text.


    ```

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    </head>

    <body>

    <h1>M and L''s Travel Agency Tips</h1>

    <h3>Things to Do</h1>

    <ol>

    <li>Check in at air counter</li>

    <li>Go through security</li>

    <li>Find gate</li>

    <li>Buy a newspaper to read</li>

    <li>Take off</li>

    </ol>

    </body>

    </html>

    ```


    +   The text appears as a numbered list on the Web page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_56_1.png)


    M and L''s Travel Agency Tips


    Things to Do at airport


    +   1 Check in at air counter

    2 Go through security

    3 Find gate

    4 Buy a newspaper to read

    5 Take off


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_56_2.png)'
