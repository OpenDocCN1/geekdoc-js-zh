  md: '# Working with Tables


    Click inside the tag for the cell, row, or value you want to align.


    Note: You can also align column or row groups. See the section "Create Column
    and Row Groups" to learn more.


    Type VALIGN="?", replacing ? with a horizontal alignment attribute: top, middle,
    or bottom.


    The web browser displays the table with the specified alignment.


    +   - In this example, a single column heading is bottom-aligned.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_139_0.png)


    # Temperature in Mexico


    | City | Low | High |

    |---|---|--|

    | Acapulco | 11 | 20 |

    | Ciudad Victoria | -6.1 | 46 |

    | Guadalajara | -5.5 | 39.6 |

    | La Paz | -4.6 | 43 |

    | Mexico | -6 | 52 |

    | Mexico City | -4.4 | 33.9 |

    | Monterrey | -4.5 | 39.2 |

    | Puebla | -6 | 37.8 |

    | Tampico | -2.5 | 44 |

    | Torreón | -3 | 40 |

    | Cancun | 72 | 38.9 |


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_139_1.png)


    Can I override the alignment of a column or row group for a single cell?


    Yes. you can set the alignment for a column or row and then override the alignment
    for an individual cell within the group. Simply add the attribute to the cell.
    See the section "Create Column and Row Groups" to learn more.


    How do I justify data in a table cell?


    Justification sets both left and right alignment and stretches the text between
    the cell borders. Although there is an HTML attribute for justification, **justify**,
    not all Web browsers currently support the setting.


