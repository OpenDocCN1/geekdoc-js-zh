  md: '# # Create an Label


    # # Adding Images chapter 5


    You can add a label that appears whenever the user moves the mouse pointer over
    a particular image on a Web page. You can use labels to offer detailed information
    about the image.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_89_0.png)


    Labels work differently from alternative text. Alternative text appears on the
    page itself when images are turned off. A label appears in a pop-up box when the
    user moves the mouse over the image.


    # Create an Label


    +   Within the `<img>` tag, type TITLE="?", label you want to appear.


    ```

    <html>

    <head>

    <title>Mount''s Travel Agency: Destinations:TITLE</title>

    </head>

    <body>

    <img src="images/everest.jpg">

    <p>At 29,029 feet, Mount Everest is the highest mountain on earth when measured
    from sea level.</p>

    <img alt="TITLE: Mt. Everest, elev. 29,029 feet"">

