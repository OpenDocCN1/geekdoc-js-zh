  md: '# # Add a Background Image


    You can turn an image into a background for your Web page by setting an attribute
    in the `<body>` tag. When selecting an image for a background, try to factor in
    how your text will appear against the image. You may need to change the color
    of the text to make it legible.


    If you use a large image file, it fills the entire background. If you use a smaller
    image, the browser tiles the image across and down the page to fill the background
    with a repeating pattern.


    # Add a Background Image


    +   Click inside the `<body>` tag and type `BACKGROUND="?";`, replacing ? with
    the page file you want to use.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_98_0.png)


    +   The Web browser displays the image as the page background.


    Note: To learn how to change the text color, see Chapter 4.


