  md: '# Understanding HTML Syntax


    HTML is a language for describing Web page content. HTML rules, or syntax, govern
    the way in which code is written. Learning the right to write your code can save
    you time and confusion later.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_24_0.png)


    # Writing HTML


    In HTML, tags determine how page content is organized and formatted. Tags consist
    of words or abbreviations surrounded by angle brackets, <>. Tags can be written
    using upper- or lowercase letters. You can type tag names in uppercase to distinguish
    the code from other text. This HTML code creates a paragraph in your page:

    <p>Hello, world!</p>


    # Tag Structure


    Certain structural HTML tags identify different parts of your HTML document. For
    example, the <body> and </body> tags surround the main body content that appears
    in the browser window. Many tags, such as the paragraph tags <p> and </p>, are
    written using an opening tag and a closing tag while others, such as the image
    tag <img>, stand alone. Closing tags must always include a slash (/) before the
    tag name.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_24_1.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Getting Familiar with HTML and Web Page Basics


    # Attributes and Values


    You can assign attributes to each HTML tag to customize its behavior. Most attributes
    work by setting a numeric or descriptive value. For example, you can set a paragraph''s
    alignment on the page using the ALIGN attribute with a type of alignment: left,
    right, or center. The code for creating a centered paragraph looks like this:


    ```

    <P ALIGN="center">My centered text.</P>

    ```


    Attributes always go inside the opening HTML tag, and it is good form to enclose
    attribute values in quotation marks.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_25_0.png)


    # Entities


    You can add special characters to a page, such as a copyright symbol or a fraction,
    by using special codes entities. Entities represent characters not readily available
    on the keyboard. All entities are preceded by an ampersand (&) and followed by
    a semicolon (;). For example, the following code adds a copyright symbol to your
    page:


    ```

    &copy;

    ```


    For more entities and special characters, see Chapter 3.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_25_1.png)


    # Avoiding HTML Errors


    To avoid HTML errors, always take the time to proofread your code. Most HTML editors
    have features that highlight bad syntax. Make sure your tags have brackets, your
    closing tags include a slash, and your attribute values are surrounded by quotation
    marks. Multiple HTML tags should be properly nested, meaning your closing tags
    should be in the reverse order of the opening tags. For example:


    ```

    <P ALIGN="center"><b>B</b></P>

    ```


    To make your HTML readable, consider using new lines to type code instead of running
    everything together on one line. Doing so will not affect how your page is displayed,
    because Web browsers ignore extra white space.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_25_2.png)'
