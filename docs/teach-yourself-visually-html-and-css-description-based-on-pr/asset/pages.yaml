  md: '# Make Text Bold


    You can add bold formatting to your text to give it more emphasis or make your
    page more visually appealing. For example, you might make a company name in a
    paragraph or add bold to a list of items.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_66_0.png)


    # Make Text Bold


    +   1. <B> in front of the text you want to make bold.

    2. Type </B> at the end of the text.


    ```

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    </head>

    <body>

    <h1 align="center">M and L''s Travel Agency</h1>

    <p>For more than 15 years, M and L''s Travel Agency has helped customers plan
    exciting adventures around the world. We specialize in one-of-a-kind vacation
    packages for all interests and budgets. Let us help you with your airline tickets,
    hotel bookings, and rental cars, either online or in person.</p>

    <p>Popular destinations:</p>

    <ul>

    <li>Giza, Egypt</li>

    <li>Mach Picchu, Peru</li>

    <li>Cay Cays, Belize</li>

    <li>Wall, China</li>

    </ul>

    </body>

    </html>

    ```


    +   When displayed in a Web browser, the text appears as bold.


    Note: To create bold text using the font-weight property in CSS, see Chapter 11.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_66_1.png)


    52'
