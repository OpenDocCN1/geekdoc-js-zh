  md: '# # Open a Linked Page in a New Window


    You can add instructions to an HTML link that tell the browser to open the link
    page in a new browser window. You may add this instruction if you want to keep
    a window to your own site so the user can easily return to your page.


    Use a target attribute within the link anchor element (<a>) to open links in new
    windows. To make all the links on your page open in new windows, you can use the
    BASE element. To learn more about how links and URLs work, see the sections at
    the beginning of this chapter.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_108_0.png)


    # Open a Linked Page in a New Window


    +   Click the <a> tag for the link you want to edit and type TARGET="?", replacing
    ? with a name for the new window.


    Other links on your Web page can reference the same target name to open pages
    in the same new window.


    If you want to open a link in a new, unnamed window, type "blank".


    +   When the link is clicked, the linked page opens in the targeted window.


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    </head>

    <body>

    <a href="http://www.travelagency.com" target="_blank">M and L''s Travel Agency</a>

    <p>For more than 15 years, M and L''s Travel Agency has helped countless travelers.
    We specialize in one-of-a-kind packages for all interests. Find great deals on
    bookings, and rental cars, either online or in person.</p>

    <a href="http://www.willey.com" target="_blank">Wiley Publishing</a>

    <a href="http://www.wikipedia.org/wiki/America" target="_blank">Travel destinations</a>

    <a href="http://www.google.com" target="_blank">Google: Discover other web ideas</a>

    </body>

    </html>

    ```

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_108_1.png)


