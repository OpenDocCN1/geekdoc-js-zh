  md: '# Prevent Resizing


    By default, users can resize the frames in your Web page, allowing them to view
    more information in a frame. You can control your page layout by framing resizing.
    This can be useful if you need the frame dimensions to remain fixed so that the
    content is viewed correctly.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_164_0.png)


    # Prevent Frame Resizing


    +   - Type NORESIZE inside the <FRAME> tag of the frame you want to control. You
    do not assign a value to the NORESIZE attribute.


    You can repeat step 1 for any other frames for which you want to prevent resizing.


    ```

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    <frameset name="top" size="160*">

    <frame name="main" src="main_frame.html">

    <frame name="bottom" src="bottom_frame.html" NORESIZE="50 />

    </frameset>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_164_1.png)


    The user is not able to resize the frame in the browser window.


    +   - In this example, resizing is turned off in the top frame.


