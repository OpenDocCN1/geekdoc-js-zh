  md: '# # Create an Internal Style Sheet


    Create an internal style sheet that resides within the <HEAD> tag of your HTML
    document. Internal style sheets are handy if your Web site consists of a single
    page because you can change both rules and HTML in the same file.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_206_0.png)


    # Create an Internal Style Sheet


    +   1 Within the <HEAD> and </tags>, add a new line and type <STYLE>.


    +   2 Add a new line and type the element for which to create a style rule.


    In this example, a new style rule is created for the H2 element.


    +   3 Type {.


    +   4 Type the properties and values for the rule.


    If you intend to add more one declaration to the rule, be sure to separate declarations
    with a semicolon.


    +   5 Type to end the rule.


    Note: To learn more about writing style rules, see Chapter 11.


    ```

    <html>

    <head>

    <title>Machu Picchu and I''s Travel Agency</title>

    <style>

    body { font-family: Arial; font-style: italic; }

    </style>

    </head>

    <body>

    <h2 face="Machu Picchu</h2>

    <p>The ancient city of Machu Picchu was constructed in the 1400s at the height
    of the Inca Empire. It was abandoned when the Spanish conquistors arrived. Machu
    Picchu is the most visited tourist attraction in Peru.</p>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_206_1.png)


    192'
