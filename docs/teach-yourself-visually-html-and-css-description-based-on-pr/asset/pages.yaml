  md: '# View an HTML Page


    After you create and save an HTML document, you can view it in your Web browser.
    Your Web browser can view HTML pages that you have saved on your computer as well
    as pages on the Internet.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_40_0.png)


    # View an HTML Page


    +   1 Open your Web browser.

    This example uses the Internet Explorer browser.

    2 Click File.

    3 Click Open.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_40_1.png)


    The Open dialog box appears.


    +   4 Click Browse.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_40_2.png)'
