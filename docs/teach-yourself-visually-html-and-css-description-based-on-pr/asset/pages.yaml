  md: '# Link to Another Page


    You can create a link in your HTML document that, when clicked, takes the visitor
    to another page on the Web. You can link to a page on your own Web site or to
    a page elsewhere in the Web.


    To create a link, you must first know the URL of the page to you want to link,
    such as http://www.wiley.com.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_106_0.png)


    # INSERT A TEXT LINK


    +   - Type the text you want to use as a link.


    +   - <A HREF="?"> in front of the text, replacing ? with the URL of the page
    which you want to link.


    +   - </a> at the end of the link text.


    +   - The browser displays the text as an underlined link.


    +   - Anytime the user moves the mouse pointer over the link, it takes the shape
    of a hand pointer.


    +   - The URL for the link appears in the status bar.


    ```

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    </head>

    <body>

    <img src="travel.gif" alt="M and L''s Travel Agency">

    <p>For more than 15 years, M and L''s Travel Agency has helped customers plan
    excursions to adventures around the world. We specialize in once-of-a-kind vacation
    packages for all interests and budgets. Let us help you with your tickets, hotel
    bookings, and rental cars, either or in person.</p>

    <p>Find travel guides and other books at http://www.wiley.Publishing/Ar.</p>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_106_1.png)


    # M and L''s Travel Agency


    We get you there!

    For more than 15 years, M and L''s Travel Agency has helped customers plan excursions
    to adventures around the world. We specialize in once-of-a-kind vacation packages
    for all interests and budgets. Let us help you with your tickets, hotel bookings,
    and rental cars, either or in person.

    Other books:

    Find travel guides and other books at Wiley.Publishing.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_106_2.png)


