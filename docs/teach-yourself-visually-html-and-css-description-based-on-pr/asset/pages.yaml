    <h1>Machu Picchu, Peru</h1>

    <p>In the Peruvian Andes, the ancient city of Machu Picchu was constructed in
    the 1400s at the height of the Inca Empire. It was abandoned less 100 years later
    when the Inca Empire collapsed. Today, Machu Picchu is the most visited tourist
    attraction in Peru.</p>

    </body>

    </html>

    ```

    ```


    If the browser''s script feature is turned off, the browser displays your alternate
    text.


