- img_proc: true
  md: '# Transfer Files to a Web Server with WS_FTP (continued)


    After you establish your server connection, you can start transferring files.
    The WS_FTP program shows two panes, one displaying the files on your computer
    and the other displaying files on your server. You can move files between the
    two by clicking the Upload and Download buttons.


    You can upload a single file or multiple files. Anytime you need to update your
    site, you must transfer more files to the server.


    # Transfer Files to a Web Server with WS_FTP (continued)


    +   - You can select this option if you want to open your connection immediately
    upon completing the Connection Wizard.


    +   - Click Finish.


    Your connection information is saved, and the program window remains open and
    ready for any file transfer activities you want to perform.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_320_0.png)


    # TRANSFER FILES


    +   - If you have not connected to your server, click Connect.


    Note: You must connect to the Internet before transferring files.


    The Site Manager dialog box appears.


    +   - Select your connection name from the list.


    +   - Click Connect.


    WS_FTP connects your computer to the server.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_320_1.png)


