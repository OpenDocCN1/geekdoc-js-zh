  md: "# Create Column and Row Groups (continued)\n\nYou can use row groups to divide\
    \ a table into horizontal sections. You create row groups using the <HEAD> and\
    \ <tbody> tags. The <HEAD> tag creates a header for the row group. You use the\
    \ <tbody> tag to define the actual row groups. If the row group requires a footer,\
    \ you can add one with the <tfoot> tag.\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_144_0.png)\n\
    \n# Create Column and Row Groups (continued)\n\n# CREATE A ROW GROUP\n\n+   -\
    \ Before the first header row you want to group, type <HEAD>.\n- You can add any\
    \ formatting you want to apply to the group within the <HEAD> tag.\n\nNote: see\
    \ the \"Add a Background Color to Cells\" to learn more about adding color to\
    \ tables.\n\n+   2 Type <HEAD> after the last row you want to include in the header\
    \ group.\n\n+   3 Type <tbody> after the first row you want to include in the\
    \ group.\n\n+   - You can type any formatting attributes you want to assign the\
    \ group within the <tbody> tag.\n\n+   4 Type </tfoot> after the last row you\
    \ want to include in the group.\n\nTo create multiple row groups, repeat steps\
    \ 3 and 4 for the other rows you want to group in the table.\n\n```\n<table>\n\
