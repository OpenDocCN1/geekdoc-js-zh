  md: '# Controlling Layout with Style Sheets


    # APPLY OFFSET


    +   1 Click the tag declaration and top: ?, replacing ? with the amount you want
    to offset the elements from the normal page flow.


    +   2 Click the tag declaration and left: ?, replacing ? with the amount you want
    to offset the elements from the normal page flow.


    You can specify values in points (pt), pixels (px), millimeters (mm), centimeters
    (cm), inches (in), pages (pc), x-header (ex), or em.


    The browser displays elements with offsets applied.


    In this example, the paragraphs are offset relative to their normal position in
    the page flow.


    You can narrow elements on your page so that they appear within the browser window
    by setting their dimensions. See the section "Set Width and Height for an Element"
    for details.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_247_0.png)


    # Can I offset content from the bottom or the right?


    Yes, but note that offsetting from the bottom may obscure the page content that
    is above the positioned element. Use the following steps:


    +   1 Click the tag declaration and type bottom: ?, replacing ? with the amount
    of offset from the bottom.


    +   2 Click the tag declaration and type right: ?, replacing ? with the amount
    of offset from the right.


    The browser offsets the page content 100 pixels from the bottom and 50 pixels
    from the right.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_247_1.png)


    # Great Demons


    Completed in 2560 BC, the Great Pyramid of Giza is the oldest of the three Egyptian
    pyramids near Cairo. It is the only surviving member of the Seven Wonders of the
    Ancient World. The Great Pyramid remained the tallest man-made structure for over
    3,800 years. It was built for the Fourth Dynasty pharaoh Khufu.


    The Great Wall of China is a series of walls built to protect the northern borders
    of China from nomadic groups. It stretches from the northern edge of Mongolia
    to the Gobi Desert in the south. It is the longest man-made structure in the world
    and is visible from the moon, although scientific calculations show this otherwise.


    The Great Barrier Reef is the world''s largest coral reef system, composed of
    over 2,900 individual reefs and 900 islands. It is located in the Coral Sea off
    the coast of Queensland in Australia. The Great Barrier Reef is the world''s largest
    living structure made by organisms. This reef structure is composed of billions
    of tiny organisms, known as coral polyps.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_247_2.png)


    It is 4,000 miles long across a state that is on the southern edge of Mongolia.
    The Great Wall was built by various Chinese emperors to protect China from invasions.
    It is the only man-made structure that is this.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_247_3.png)'
