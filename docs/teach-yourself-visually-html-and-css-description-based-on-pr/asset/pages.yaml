  md: '# Understanding Links


    Hyperlinks, or links for short, are what make Web pages different from other computer
    documents. Any publicly accessible Web page can be connected to another by creating
    a link. Links enable users to navigate from one topic to the next on a Web site
    and from one Web site to another. The user clicks the link and the browser opens
    the destination page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_102_0.png)


    # Types of Links


    # Link to External Web Pages


    Links can be text or images. Text links typically appear as underlined, differently
    colored words on a page. Any image on a Web page can also be turned into a link.
    For example, graphical site maps and navigation bars that appear at the top or
    side of a page make it easy for users to access other pages on the same Web site.
    When a user holds the mouse pointer over a link, the pointer takes the shape of
    a pointing hand, indicating the presence of an active, clickable link.


    You can use links on your Web page to direct users to other pages on the Internet.
    For example, you might include a link on your company Web page to a local city
    directory detailing and hotels in the area. You might add a link on a product
    page to the manufacturer''s Web site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_102_1.png)'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Adding Links


    # Link to Other Pages on Your Site


    If your Web Site consists of more than one page, you can include links to other
    pages on the site. For example, your main page may provide links to pages about
    your business, products, and ordering information as well as a map of your location.
    If you maintain a blog, the home page will usually link to postings that you have
    created in the past.


    # Link to Other Areas on the Same Page


    If your Web page is particularly long, you can provide links to different areas
    on the page. For example, at the top of a page, you might include links to each
    section heading or photo that appears below. This allows users to jump right to
    the information they want without having to scroll.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_103_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_103_1.png)


    # Absolute and Relative Links


    You can use two types of links in your HTML documents: absolute and relative.
    Absolute links use a complete URL to point to a specific page on a specific Web
    server. Relative links use shorthand to reference a page and do not specify the
    server. You generally use relative links to reference documents on the same Web
    site.


    # Anchor Tags


    The HTML code you use to create a link is called an anchor tag, consisting of
    the beginning <a> and the ending </a>. The HREF attribute works within the opening
    anchor tag to define the URL, or Web address, to which you want to link. You can
    learn more about using URLs in the next section, "Understanding URLs."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_103_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_103_3.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# # Understanding URLs


    Every page on the Web has a unique address called a URL. Short for Uniform Resource
    Locator, a URL identifies the domain name of the Web server and the directory
    path to the file on that server. Absolute links specify a complete Web page URL,
    whereas relative links use shorthand to specify pages relative to the page containing
    the link.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_104_0.png)


    # ## HTTP Prefix


    All URLs for Web pages include the standard HTTP (HyperText Transfer Protocol)
    prefix, as in http://www.example.com. While most browsers automatically insert
    the http:// prefix for you when you type an address such as www.example.com, you
    must include the prefix when referencing URLs in your HTML.


    # ## FTP or MAILTO Prefix


    There may be times when you use a prefix other than HTTP in your URLs. If you
    are linking to a document that resides on a file transfer site, you use the FTP
    prefix (ftp://). If you want to create a link that opens an e-mail program, allowing
    a user to send an e-mail message, use the MAILTO prefix (mailto:).


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_104_1.png)'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Domain Name


    Following the prefix in a URL is the domain name of the Web server where the page
    is stored. Typically, domain names correspond to the company or organization hosting
    your Web page files. Hosts can include commercial companies, educational institutions,
    and government agencies. In the URL http://www.example.com, with "example.com"
    is the name of the domain, specifying a Web server at that domain. Occasionally
    you may use a numeric IP (Internet Protocol) address such as 208.215.179.146 in
    your URL instead of a domain name.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_105_0.png)


    # Directory Path and File Name


    Following the domain name in a URL is information about the file name of the HTML
    page and the directories in which the page is stored. For example the http://www.example.com/pages/home.html
    has the file name "home.html" and is stored inside a directory named "pages" on
    the Web server. You use slashes (/) to separate the domain, directories, and file
    name. When you reference a Web site''s home page, you will often leave off the
    path and file name from a URL, as in http://www.example.com. In such cases, the
    server returns a default page for the site, usually titled index.html, located
    in the Web server''s root folder.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_105_1.png)


    # URL Errors


    One of the easiest mistakes you can make when creating a link is to type the wrong
    URL. This causes users to get an error message when they click the link. One misplaced
    letter or missing slash in an URL can result in a broken link. Renaming or rearranging
    the file structure on your Web server may also break links, requiring you to rewrite
    the URLs in your HTML.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_105_2.png)'
