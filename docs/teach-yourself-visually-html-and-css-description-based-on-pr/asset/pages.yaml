    # How do I display the entire menu on my form?


    The number of menu entries as the SIZE attribute value makes the menu appear as
    a rectangular box that displays all the items in the list. If the list is long,
    it may take up more room on the form than you want, making users scroll to view
    the selections. If you prefer to save room on your form, keep the menu size at
    1. This creates a drop-down menu list.


    # How can I create a submenu?


    Use the <OPTGROUP> tag and the LABEL attribute:


    ```

    <SELECT NAME="favoriteflower">

    <OPTGROUP LABEL="Perennial">

    <OPTION VALUE="Daisy">Daisy</OPTION>

    <OPTION VALUE="Lily">Lily</OPTION>

    </OPTGROUP>

    <OPTION VALUE="Annual">Annual</OPTION>

    <OPTION VALUE="Petunia">Petunia</OPTION>

    <OPTION VALUE="Impatiens">Impatiens</OPTION>

    </OPTGROUP>

    </SELECT>

    ```


    Not all browsers support the <OPTGROUP> tag.'
