  md: '# Apply a Style with the DIV Tag


    You can apply styles to different sections of your Web page using the &lt;DIV&gt;
    tag. You can define style classes for the &lt;DIV&gt; tag in your external or
    internal style sheet, and then apply those classes in your HTML document.


    You can associate a class with &lt;DIV&gt; content using the CLASS attribute.
    For more information about creating classes, see the section "Create a Class."


    # Apply a Style with the DIV Tag


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_210_0.png)


    # SET UP A DIV CLASS


    +   1. In your external or internal style sheet, type &lt;DIV&gt;?, replacing
    ? with the class name you want to assign to the DIV style.


    +   2. Type {. The declarations for the DIV style.


    Separate multiple declarations with semicolons.


    **Note:** Learn more about writing style rules, see Chapter 6.


    +   4. Type }. The style rule is complete.


    If you are editing an external style sheet, save the sheet.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_210_1.png)'
  merge: -1
