    |

    | MOUSEOWN | Triggers when the mouse button is released after being clicked |

    | CLICK | Triggers when the mouse button is clicked and released |

    | KEYPRESS | Triggers when a keyboard key is pressed and released |

    | KEYDOWN | Triggers when a keyboard key is pressed |

    | KEYUP | Triggers when a keyboard key is released |

    | SUBMIT | Triggers when a form button is clicked |

    | RESET | Triggers when a reset form button is clicked |


    | Event Handler | Action |

    |---|---|

    | ONLOAD | Browser loads a page |

