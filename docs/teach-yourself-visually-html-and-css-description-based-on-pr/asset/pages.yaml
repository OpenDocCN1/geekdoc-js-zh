  md: '# Add Check Boxes


    You can add check boxes to your form to allow users to select from one or more
    options. You can group the check boxes under a single NAME attribute.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_184_0.png)


    # Add Check Boxes


    +   1. Between the <FORM> and </FORM> tags


    +   2. Type a space and NAME="?", replacing ? with a unique name for the check
    box.


    ```

    ```html

    <FORM METHOD="POST" ACTION="cgi-bin/customer.cgi">

    Your name:

    <INPUT TYPE="text" NAME="customername" SIZE="50" MAXLENGTH="65">

    <BR><n>

    Comment:

    <BR>

    <TEXTAREA NAME="customercomment" ROWS="5" COLS="60">

    Your comment here.

    </TEXTAREA>

    <BR><n>

    Service:

    <BR>

    <INPUT TYPE="checkbox" NAME="Flight" VALUE="yes">

    </FORM>

    </BODY>

    </html>

    ```

    ```


    +   3. Type a space and VALUE="?", replacing ? with a value to be assigned if
    the check box is checked.


    Note: The check box value does not appear on the form.


    ```

