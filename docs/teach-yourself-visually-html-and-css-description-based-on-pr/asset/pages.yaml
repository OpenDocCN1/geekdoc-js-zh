  md: '# CREATE A LINK TO THE AREA


    # Adding Links


    In front of the text or image you want to turn into a link, type <A HREF="#">?;
    replacing with the name of the section you want to link.


    Note: Be careful not to leave the pound sign (#) when linking to other areas of
    the page.


    +   Type <A> after the link text.


    Note: to use an image as a link, see the section "Insert a Link to Another Page."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_111_0.png)


    When a user clicks the link, the browser scrolls to the designated section of
    the page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_111_1.png)


    # M and L''s Travel Agency


    +   - Mount Everest

    - Maches Picchu

    - Santiago de Compostela


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_111_2.png)


    Mount Everest

    At 29,032 feet, Mount Everest is the highest mountain on earth when measured from
    sea level. Each year, mountaineers climb the mountain, located in the Himalayas
    range on the border of Nepal and China. Many climbers use oxygen to compensate
    for the high altitude.


    Maches Picchu

    In the Peruvian Andes, the ancient city of Maches Picchu was constructed in 1450
    at the height of the Inca empire. It was abandoned for less than 100 years after
    the Inca empire collapsed. It is now the most visited tourist attraction in Peru.


    Santiago de Compostela

    Located in the region of northwest Spain, Santiago de Compostela is the end of
    the famous medieval pilgrimage route, known as the Camino.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_111_3.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_111_4.png)


    # Can I add a link to the bottom of a page that returns the user to the top of
    the page?


    Yes. It is a good idea to add a link to the bottom of a long page to help the
    user navigate to the top without having to scroll. To create such a link, create
    a named anchor at the top of the page following these steps in this section: Insert
    a link that references that named anchor. Good text to use for such a link is
    "Return to Top" or "Back to Top."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_111_5.png)


    # How do I link to a specific location on another page on my Web site?


    You can use the same technique shown in this section to link to a section on another
    page. First


