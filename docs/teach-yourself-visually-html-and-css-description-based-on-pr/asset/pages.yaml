    Replace margin with the attribute you want to change: LEFTMARGIN, RIGHTMARGIN,
    TOPMARGIN, BOTTOMMARGIN, MARGINWIDTH, and MARGINHEIGHT.


    Replace ? with the amount of indentation you measured, in pixels.


    You can set the margin for one side of the page or all four sides, all within
