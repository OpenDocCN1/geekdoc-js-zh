  md: '# Adjust Cell Width and Height


    You can control a cell''s width using the WIDTH attribute and its height using
    the HEIGHT attribute. This enables you to allocate more space to columns or rows
    that have more content. If you do not set a specific width or height, the content
    of the cell determines the cell''s size.


    You can specify dimensions using a pixel value or using a percentage relative
    to the width or height of the overall table.


    # Adjust Cell Width and Height


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_128_0.png)


    +   In the <TD> tag, type WIDTH="7", replacing 7 with the value or percentage
    you want to set for the cell.


    Note: See the section "Adjust the Table Size" to set the width of the entire table.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_128_1.png)


    +   The Web browser displays a set width for the cell, as well as all the others
    in the column.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_128_2.png)'
