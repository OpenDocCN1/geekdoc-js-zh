  md: '# # Controlling Layout with Style Sheets


    # DEFINE


    +   1. Click the tag declaration and type width: ?, height: ?, replacing ? with
    percentage sizes for the width and height.


    +   2. Type Id="?" the HTML tag, replacing ? with the ID name.


    The web browser displays the element with a height that are relative to the size
    of the enclosing box.


    In this case, the enclosing box is the <BODY> tag, so the content is resized based
    on the browser window dimensions.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_245_0.png)


    # Great Pyramid of Egypt


    Completed in 2560 BC, the Great Pyramid of Giza is built as the tomb of Pharaoh
    Khufu one of the Seven Wonders of the Ancient World. The pyramid remained the
    tallest man-made structure in the world for over 3,800 years and is still a tomb
    for Fourth Dynasty Egyptian pharaohs.


    # The Great Wall


    The Great Wall of China is a series of stones and earth structures built to protect
    the northern borders of the Chinese Empire against invasions by various nomadic
    groups. It is an arc along the northern edge of China. At its peak, the wall was
    over five thousand miles long and is not even visible from the moon, although
    scientific calculations show it is incomparable.


    # Great Barrier Reef


    The Great Barrier Reef is the world''s longest coral reef system, composed of
    nearly 3000 individual islands. The reef is located in the Coral Sea off the coast
    of Queensland in Australia. The Great Barrier Reef is the worlds largest single
    structure built by living organisms. This reef is composed of coral and other
    organisms known as polyps.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_245_1.png)


    # What are the em and ex-style measures?


    The em and ex allow you to define sizes on your pages based on the size of surrounding
    text. The concept comes from typography, where em represents the width of the
    capital letter M and ex represents the height of the lowercase x. If you set a
    style measurement to 2em, this will be twice the size of the normal font. If viewers
    adjust the font size of their browser, the content sized using an element also
    adjusts. The ex measure works similarly but on a smaller scale.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_245_2.png)


    # How do I control what happens when text extends beyond a CSS box?


    You can control text outside a box is hidden using the overflow property. Setting
    the property to visible allows the text to be rendered outside the box. A hidden
    value hides the text that is outside the box. Both scroll and auto values scroll
    bars for the content, if needed.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_245_3.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_245_4.png)


    231'
