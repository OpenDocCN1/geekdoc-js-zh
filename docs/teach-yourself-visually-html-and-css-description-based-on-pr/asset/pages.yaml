  md: '# Change Font Size


    You can change the font size of your Web page text using the SIZE attribute. You
    can specify seven font sizes in HTML. Font Size 1 creates the smallest text, while
    Font Size 7 creates the largest.


    While the attribute lets you set the text size for a section of the text, the
    <FONT> tag sets the font size for the entire page.


    # Change Font Size


    # CHANGE A SECTION OF TEXT


    +   1 <FONT SIZE="7"> before the text you want to change, replacing ? with a number
    from 1 to 7.


    +   2 </FONT> at the end of the text.


    +   3 Type additional <FONT> tags and SIZE attributes for any other text that
    you want to size.


    +   The text appears at the designated font size on the Web page.


    This figure shows samples of all seven font-size levels.


    Note: To change the font size using the font-size property in CSS, see Chapter
    11.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_70_0.png)'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Formatting Text


    # chapter 4


    CHANGE ALL THE TEXT


    Type **\<BASEFONT="&quot;>\>** at the top of your Web page text, replacing ? with
    a size you want from 1 to 7.


    ```

    <html>

    <head>

    <title>Me and L''s Travel Agency: Hiking</title>

    <body>

    <BASEFONT SIZE="5">

    <h2>Hiking Essentials</h2>

    <p>

    Sturdy shoes<br>

    Shorts<br>

    Rain poncho<br>

    Compass<br>

    Sunglasses<br>

    Sunscreen<br>

    Hat<br>

    </p>

    </BASEFONT>

    </body>

    </html>

    ```


    All the text appears at the new size in the Web browser.


    Note: The **\<BASEFONT\>** tag does not affect the size of any headings (**\<H1\>**
    within your Web page text.


    # Hiking Essentials


    +   - Sturdy shoes

    - Shorts

    - Rain poncho

    - Compass

    - Sunglasses

    - Sunscreen

    - Hat


    At what size will my text appear in my page if I size it the **SIZE attribute**?


    The exact size of the text depends on which browser you use, although most modern
    browsers display at the same sizes. This table shows at what sizes Internet Explorer
    6 and Firefox 2 display text.


    Can I set a size using something other than the seven size levels?


    Yes, using relative font size. If you add a plus (+) or minus (-) sign before
    a size number, the browser displays text at a size that is relative to the surrounding
    text. For example, if you type **\<SIZE="+2"\>**, the browser displays the text
    two sizes larger than the surrounding text. If you type two sizes larger than
    the surrounding text.


    | Size Attribute | Font Size |

    |---|---|n| 1 | 7 points |

    | 2 | 10 points |

    | 3 | 12 points |

    | 4 | 14 points |

    | 5 | 18 points |

    | 6 | 24 points |

    | 7 | 36 points |


