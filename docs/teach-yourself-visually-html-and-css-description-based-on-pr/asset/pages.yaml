  md: '# Adding Text chapter 3


    # SET A BULLET STYLE


    Type TYPE="?" with the <UL> tag, replacing ? with a bullet style code; for example,
    circle, disc, or square.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_59_0.png)


    The bulleted list is displayed in the style you selected.


    In this example, the bulleted list uses square bullets.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_59_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_59_2.png)


    # I can stop a bulleted list for one line of text and continue it on the following
    line?


    Yes. If you leave off the <LI> and </LI> tags for a line of text within the list,
    a Web browser renders the line as regular text. However, you can insert a line
    break <BR> or use the paragraph or heading tags to format the nonbulleted text
    so that it appears as a separate line in the list. For example:


    ```

    <UL>

    <LI>Dogs</LI>

    <LI>Cats</LI>

    <BR>and the ever-popular

    <LI>Potbellied pigs</LI>

    </UL>

    ```


    +   - Dogs

    - Cats

    - Birds

    - Reptiles


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_59_3.png)'
