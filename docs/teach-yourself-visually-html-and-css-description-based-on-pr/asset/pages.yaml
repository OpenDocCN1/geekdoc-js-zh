  md: '# # Create an Image Rollover Effect


    Can use JavaScript to create an image rollover effect. When the user moves the
    mouse pointer over the image on the Web page, the image is replaced with a different
    one. When the user moves the mouse pointer off the image, the original image returns.


    To create an image rollover, you must add two mouse event handlers to a hyperlink.
    The effect works if the images have the same dimensions. You can resize your images
    using an image-editing program.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_278_0.png)


    +   1 Add an image to your page by typing <IMG SRC="?"> replacing ? with the file
    name and location of the image.


    +   2 Type a space and then NAME="?">, replacing 7 with an identifier.


    +   3 Before the <img> tag, type <A HREF="?">, replacing 7 with a destination
    for the link.


    +   4 After the <img> tag, type <A>.


    Notes: For more about adding images, see Chapter 5. For more about links, see
    Chapter 6.


    +   5 Within the <a> tag, ONMOUSEOVER="document." , replacing 7 with the identifier
    from step 2.


    +   6 Type src="?">, replacing 7 with the name and location of the image that
    will replace when the user rolls over the picture.


    Note: Be careful not to leave any single quotes in the script.


    ```

    <html>

    <head>

    <title>Links Title</title>

    </head>

    <body>

    <a href="beach.jpg" NAME="beach">

    <img src="beach.jpg" NAME="beach">

    </a>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_278_1.png)


    264'
