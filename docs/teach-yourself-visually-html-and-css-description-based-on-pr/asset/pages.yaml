  md: '# # Hide or Display Frame Scroll Bars


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_165_0.png)


    # Working with Frames chapter 8


    Web browsers automatically display scroll bars if a frame''s content exceeds the
    size of the frame. You can use the SCROLLING attribute to control when scroll
    bars appear. A yes value displays scroll bars, while a no value hides the scroll
    bars.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_165_1.png)


