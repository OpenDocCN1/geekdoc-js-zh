  md: '# # Change Fonts


    You can change the appearance of your text using the tags <FONT> and </FONT>,
    along with the FACE attribute. Use the FACE attribute to specify a font by name.


    Not all web browsers display all fonts. It is best to assign common fonts typically
    found on most computers, such as Times Roman and Arial. It is also a good idea
    to list more than one font name in the FACE attribute, as the first font is not
    available on the viewer''s computer.


    # Change Fonts


    +   1. Type <FACE=""> in front of the text you want to change. Replace ? with
    one or more names or families, separated by commas.


    If the first font is not available on the user''s computer, the second font will
    be used.


    Commonly supported font families are serif, sans-serif, and monospace.


    +   2. Type</FONT> at the end of the text.


    The text appears in the new font on the Web page.


    Note: To change the font-family property in CSS, see Chapter 11.


    # Formatting Text chapter 4


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_69_0.png)


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    <body face="Arial, Helvetica, sans-serif">

    <p face="M and L''s Travel">

    <h1>M and L''s Travel Agency</h1>

    <p>For more than 15 years, M and L''s Travel Agency has helped customers plan
    exciting adventures to destinations around the world. We specialize in one-of-a-kind
    vacation packages, rental cars, hotel bookings and rental tickets, either online
    or in person.</p>

    <ul>

    <li>Pyramids of Egypt</li>

    <li>Machu Picchu, Peru</li>

    <li>Angkor Wat, Cambodia</li>

    <li>Great Wall, China</li>

    </ul>

    </p>

    </body>

    n</html>

    ```


