  md: '# Add Bold to Text


    You can make Web page text bold using the font-weight property in a style rule.
    The property allows you to control the amount of boldness. Setting text to bold
    can help emphasize it on a page. The font-weight values are lighter, normal, bold,
    and bolder. You can also use a numeric value


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_216_0.png)


    # Add Bold to Text


    +   - Click inside the tag declaration and type font-weight:


    Note: To learn more about writing style sheets and rules, see Chapter 10.


    +   - Type a space.


    +   - Type a weight value (bold or bolder).


    You can use the normal value to remove boldness that may be inherited from previous
    style rules.


    You can use the lighter value to decrease the weight of text.


    You can also specify a number using a multiple of 100 from 100 to 900 to control
    the boldness level. Not all browsers support this feature.


    The Web browser holds all the text to which the tag is applied.


    In this example, all paragraphs are now bold.


    Note: To learn how to link a style sheet to all the pages on your Web site, see
    Chapter 10.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_216_1.png)


    # 202'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# # Italicize Text

    Formatting Text with Style Sheets chapter 11


    You can use the font-style property to italicize Web page text. Applying italics
    is an easy way to add emphasis to text. The font-style values are italic, oblique,
    and normal.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_217_0.png)


    # Italicize Text


    +   1. Click inside the tag declaration and type font-style:


    Note: To learn more about writing style sheets and rules, see Chapter 10.


    +   2. Type a space.


    +   3. Type an italics value (italic or oblique).


    You can use the normal value to remove italics that may be inherited from previous
    style rules.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_217_1.png)


    The Web browser italicizes all the text to which the tag is applied.


    In this example, the slogan text is italicized.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_217_2.png)'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# # Indent Text


    You can indent the first line in a paragraph using the text-indent property in
    a style rule. You can set the indentation as a specific measurement value or as
    a percentage of the overall text block.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_218_0.png)


    # # Indent Text


    +   1. Click inside the tag declaration and type text-indent: ? replacing ? with
    the amount of space you want to indent.


    You can set the size measurement in pixels (px), millimeters (mm), centimeters
    (cm), inches (in), points (pt), picas (pc), x-height (ex) or em.


    You can also set an indent size as a percentage of the text block width, such
    as 20%.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_218_1.png)


    The Web browser indents the first line of all the text to which the tag is applied.


    +   * In this example, all the <P> tags are indented.


    Note: To indent with margins, see Chapter 12.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_218_2.png)


    204'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# # Change the Font Size


    # Formatting Text with Style Sheets chapter 11


    You can use the font-size property to change the font size for a document''s text.
    Rather than going through your document and changing each instance of a tag, you
    can use a style sheet rule to change the font size for all instances of the tag
    in your document.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_219_0.png)


    # Change the Font Size


    +   - Click inside the tag declaration and type font-size: a space.


    +   - Type a font size in points (pt), pixels (px), millimeters (mm), centimeters
    (cm), inches (in), picas (pc), x-height (ex), or em.


    You can also describe the size (xx-small, x-small, small, medium, large, x-large,
    or xx-large) font size.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_219_1.png)


    The web browser assigns the font size for any text to which the tag is applied.


    +   - In this example, the style is assigned to the links inside a table.


    Note: Learn how to create tables in Chapter 7.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_219_2.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: "# Change\nthe Font\n\nTo change the font of your Web page text, you can\nuse\
    \ the font-family property. You can specify a\nfont by name. Because not all fonts\
    \ are available on\ncomputers, you should designate a second and\ne third choice.\
    \ This, if the computer\ndoes not have the first choice installed, the browser\n\
    tries to display the next choice inside.\n\nTo ensure most browsers can display\
    \ your font, assign a common\nfont, such as Arial, Verdana, Courier, or Times\
