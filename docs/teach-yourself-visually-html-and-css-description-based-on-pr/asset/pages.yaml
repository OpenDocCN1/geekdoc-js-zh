  md: '# chapter 15


    # Web Hosting Scenarios


    Numerous companies around the world provide Web site hosting. Some do so for free,
    in exchange for advertising on your site, while others charge a monthly fee. Many
    Internet service providers (ISPs) and commercial online services offer their members
    a certain amount of storage space. If you expect your site to generate a lot of
    traffic, you can use a dedicated Web presence provider — a company that specializes
    in helping others establish and maintain a presence on the Web. Web presence providers
    generally offer more features and support than ISPs.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_315_0.png)


    # Search for a Web Host


    The best place to start looking for a host is your own ISP or commercial service.
    If it does not offer hosting services, you can look for Web hosting services on
    the Internet. For example, the Web Hosting Ratings (www.webhostingratings.com)
    can help you start your search. Also, consider asking friends and family for recommendations.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_315_1.png)


    # Features to Consider


    When considering a Web host, take some time to compare features and services as
    well as fees. Find out how disk space the host allows. Although HTML documents
    are generally small, images and multimedia files included with Web pages consume
    large amounts of space. Also find out the host''s Internet connection speed and
    what advanced features and software it supports, such as CGI scripts, PHP, and
    database access. Ask whether it offers technical support, registers domain names,
    or provides hit statistics to track visitors to your site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_315_2.png)


    continued 301'
  merge: -1
