  md: '# # Working with Tables


    # EXTEND inside the tag for the cell


    +   1 Click inside the tag for the cell you want to extend across rows.


    +   2 Type ROWSPAN="2", replacing 7 with the number of rows you want to span.


    The web browser displays the cell spanning the designated number of rows.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_141_0.png)


    +   - In this example, a heading spans two at the top of the table.


    +   - In this example, a heading spans five columns. You can combine column and
    row spanning to create complex table designs.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_141_1.png)


    | City | Basel | Bern | Geneva | Zurich |

    |---|---|---|---|--|

    | Basel | 54 | 161 | 144 | 122 |

    | Bern | 168 | | 259 | |

    | Geneva | 188 | 57 | 210 | |

    | Zurich | 85 | 123 | 216 | |


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_141_2.png)


    # Can I extend a cell across columns and rows at the same time?


    Yes. If you add the COLSPAN and ROWSPAN attributes to the row or header tag, you
    can make a cell horizontally and vertically in the table. Just remember to remove
    cells in the columns and rows you want the current cell to span.


    You can create a title cell by adding a top cell that spans all the cells beneath
    it that off from the others. You can add a section "Add Background Color to Cells"
    for more information. You can also make a cell header by using the <TH> tag. See
    the section "Add Column Labels" for details.'
