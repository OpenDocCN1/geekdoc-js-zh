  md: '# Create a Bulleted List


    You can add a bulleted list to your document to set a list of items apart from
    the rest of the page. You can use a bulleted list, also called an unordered list,
    when you do not need to show the items in a particular order.


    By default, bullets appear as solid circles. If you want to use another bullet
    style, you must add a TYPE attribute to the `<UL>` tag.


    # Create a Bulleted List


    # PLACE TEXT IN A BULLETED LIST


    +   1 Type `<UL>` before the text you want to add


    +   2 Type `<LI>` in front of each item in the list.


    +   3 Type `<LI>` after each list item.


    +   4 Type `</UL>` after the list text.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_58_0.png)


    The text appears as a bulleted list on the Web page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_58_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_58_2.png)'
