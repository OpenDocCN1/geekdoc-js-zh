  md: '# Working with Tables


    # SET A TABLE SIZE AS A PERCENTAGE


    In the <TABLE> tag, **WIDTH="?"**, replacing with the percentage value you want
    to assign.


    You can add a height setting if your table needs one by typing **HEIGHT="?"**
    in the <TABLE> tag.


    **Note:** The height attribute is not as well supported as the WIDTH attribute
    and may not display properly in all browsers.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_137_0.png)


    The Web browser displays the table at the specified size.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_137_1.png)


    | City | Low | High |

    |---|---|---|

    | Acapulco | 11 | 60.5 |

    | Ciudad Victoria | -0.1 | 46 |

    | Guadalajara | -0.5 | 39.6 |

    | La Paz | -0.8 | 43.1 |

    | Mexical | -6 | 52 |

    | Mexico City | -4.4 | 33.9 |

    | Monterrey City | -0.5 | 40.5 |

    | Puebla | -5 | 37.8 |

    | Tampico | -2.5 | 44 |

    | Tamaul | -3.3 | 38 |

    | Cancun | 7.2 | 38.9 |


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_137_2.png)


    Is it possible to set a table too small for its contents?


    If you accidentally make a table too small for the contents, the browser ignores
    the measurements and tries to make the fit as best it can. On the other hand,
    if you set a table too wide, users are forced to scroll to see parts of the table.
    For best results, do not make your table wider than 750 pixels.


    To what size does a browser set my table if I do not specify an exact width?


    If you do not set a width using the WIDTH attribute, the browser sizes the table
    based on the cell contents. When text is in the table, the table expands enough
    to fit its largest edge of the browser window. If a table contains large images,
    it may extend beyond the browser window.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_137_3.png)


