  md: '# Create an Image Map


    You can create an image map that links users to different pages based on where
    they click on the image. you might use an image map as a navigational tool for
    your Web site. The key to creating a good image map is finding an distinct areas
    to click.


    You can define each clickable area on the map using three shapes: rect (for rectangle),
    circle (for circle), and poly (for polygon, or an irregular shape).


    # Create an Image Map


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_308_0.png)


    +   TO DO LIST:

    - MAKE IMAGE MAP

    - CLEAN TOOL BENCH


    +   Click where you want to insert an image map.


    +   Type <IMG SRC="?">, replacing ? with the location and name of the image file.


    ```

