  md: '# Formatting Text with Style Sheets


    To designate a second, alternative font choice, type a comma, a space, and the
    second font name.


    You can repeat 3 to assign additional fonts.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_221_0.png)


    The Web browser uses the assigned font for any text to which the tag is applied.


    In this example, the style rule is applied to the <body> tag, so all the body
    text is affected.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_221_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_221_2.png)


    # Can I change multiple font settings at the same time?


    Yes. You can write a style rule that combines several settings in one fluid sweep
    using the font property.


    ```

    P { italic: 18pt "Times New Roman", "Arial" }

    ```


    Some browsers may require you to type the properties in a particular order, so
    as font style before size.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_221_3.png)


    # Is there a way to include a font with my page so users can see it if they do
    not have it installed?


    If the users are viewing the page with Internet Explorer, you can embed the font
    in your web page. If you embed the font, you must store it on the server, and
    it must use the Embedded Open Type, or EOT. You can use a special format, called
    WEFT, to convert it into EOT. Visit www.microsoft.com/typography/web/embedding/weft/
    to learn more. Replace ? with the name of the embedded font.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_221_4.png)


    207'
