- img_proc: true
  md: "# Understanding Web Page Publishing (continued)\n\nYou find a host for your\
    \ Web site and establish a domain name, if needed, the next step in publishing\
    \ your Web page is to transfer the HTML documents from your computer to the Web\
    \ server.\n\n Ordinarily, when you publish your pages to a Web host, your Web\
    \ address is the name of the host followed by the path to your files. If you want\
    \ a more unique address, you may want to obtain your own domain name. A domain\
    \ name is a high-level address for a Web site, such as wiley.com (owned by the\
    \ publisher of this book). To acquire a domain name, you must register and pay\
    \ for it.\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_316_0.png)\n\n# Acquire\
    \ Your Own Domain Name\n\nYou can register a domain name through VerSign (netsol.com),\
    \ which manages the infrastructure of the .com and .net domain names. Dozens of\
    \ other domain name registrars help you register these and other types of domain\
    \ names. Your Web hosting service may also offer a registration service for domain\
    \ names, for a reduced fee. After you acquire a domain name, you can ask your\
    \ Web host to create a virtual domain name for your site on the host's server.\
    \ This allows you to use your unique domain name rather than the provider's server\
    \ name in your URL.\n\n# Transfer Files\n\nAfter you set up an account with a\
    \ Web host, you can transfer your HTML files to the server and set up your Web\
    \ site. Transferring files from your computer to a Web server is called uploading.\
    \ Depending on your server, you can transfer files using FTP (File Transfer Protocol)\
    \ or a Web interface provided by your hosting service. More than not, you use\
    \ FTP to upload your files.\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_316_1.png)\n\
    \n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_316_2.png)\n\n302"
  merge: -1
  pgno: 316
- img_proc: true
  md: '# FTP Programs


    FTP is the standard for file transfer on the Internet. To transfer files with
    FTP, you need an FTP program, also called a *client*. You can find free and shareware
    FTP clients on the Internet. Popular FTP programs include WS_FTP for Windows (www.ipswitch.com/Products/WS_FTP/)
    and CuteFTP (www.globalscale.com/products/cuteFTP). Also, check your Web host
    to see what FTP clients or file upload tools it offers. See the section "Transfer
    Files to a Web Server with WS FTP" for more information.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_317_0.png)


    # Maintain Your Site


    After you upload your pages, you can view and test your site. One of your chores
    as a Web developer is to maintain your Web site. It is up to you to keep your
    information and links current. It is good practice to regularly test your site
    for broken links. See the section "Troubleshoot Your Web Pages" to learn more
    about fixing page problems. Although some others do, it is also good practice
    to update your content on a regular basis or give it a fresh look from time to
    time. Stale data can keep visitors from returning to your site.


    # Publicize Your Site


    After you publish your Web site, you can look for ways to attract visitors. You
    can add descriptions and keywords in <META> tags and useful page titles to gain
    the attention of search engines. See Chapter 2 for more information. You can also
    advertise your pages on other sites, e-mails, and offline. See the section "Promote
    Your Web Site" for more information.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_317_1.png)'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Transfer Files to a Web Server with WS_FTP


    You can transfer your Web page files to a Web server using FTP software. FTP stands
    for File Transfer Protocol, which is a method for moving files on the Internet.
    In this section, you learn how to transfer files using IPSwitch WS_FTP, a popular
    program for transferring Web files. If you use any FTP program, your steps may
    differ.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_318_0.png)


    # Transfer Files to a Web Server with WS_FTP


    # SET UP YOUR CONNECTION


    +   Open the WS_FTP program window.

    The first time you use the program, the Connection Wizard appears to help you
    set up server connection.

    Note: To download and install the program, visit www.ipswitch.com. This example
    uses the Home version of WS_FTP.

    Type a name for your connection. This can be the name of your Web site.

    Click Next.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_318_1.png)


    +   Select a connection type.

    The default and most common type for transferring files is FTP.

    Click Next.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_318_2.png)'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Publishing Your Web Pages chapter 15


    6 Type your server address.


    If you do not know the server address, contact your service provider for more
    information.


    Typically, you receive this information when you sign up for an account.


    7 Click Next.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_319_0.png)


    8 Type your user name.


    9 Type your password.


    If you do not know your user name or password, contact your service provider.


    Again, you typically receive this information when you sign up for an account.


    10 Click Next.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_319_1.png)


    > TIPS


    Where can I find an FTP program?

    You can find numerous FTP programs on the Internet, including free and shareware
    programs. Download.com (www.download.com) is popular site for obtaining programs.
    Many programs offer a free trial version you can experiment with to see if you
    want to purchase the full version. You can find a trial version of Ipswitch WS
    FTP at www.ipswitch.com.


    What information do I need to set up an account with an FTP program?

    Most servers ask you for a server address, a user name, and a password. When you
    create an account with a Web host, you are provided with this information, including
    a destination folder on the server''s directory. You can use this folder to store
    your HTML files, with any image and multimedia files you include with your Web
    page.


    continued 305'
