  md: '# Adding Links


    # INSERT AN IMAGE LINK


    +   1 Add the image you want to use as a link using the <IMG> tag.


    Note: To learn how to add images to a page, see Chapter 5.


    +   2 Type <HREF="?"> in front of the image code, replacing ? with the URL of
    the page which you want to link.


    +   3 Type</img> after the image code.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_107_0.png)


    +   The browser displays the image as a link.


    +   Anytime you move the mouse pointer () over the link, it takes the shape of
    a hand pointer ().


    +   The URL for the link appears in the status bar.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_107_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_107_2.png)


    # How do I link to another page on my Web site?


    You can link to another page on your site using a relative link. In a relative
    link, you can specify the location of the destination page relative to the page
    that contains the link without specifying the domain name of the server. If the
    destination page is located in the same directory as the containing page, you
    can simply specify the filename, as in <A HREF="photos.html"> If the destination
    page is in a subdirectory relative to the containing page, you need to specify
    that subdirectory as well, as in <A HREF="media/photos.html">.


    # My link image includes a border. How do I need to remove the border?


    When you turn an image into a link, a browser automatically places a border around
    the image. To remove the border, type BORDER="0" in the <IMG tag, like <A HREF="http://www.example.com"><IMG
    SRC="vacation.jpg" BORDER="0"></a>.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_107_3.png)


