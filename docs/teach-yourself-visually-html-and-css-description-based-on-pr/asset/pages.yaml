- img_proc: true
  md: '# # Publishing Your Web Pages chapter 15


    +   Navigate to the folder on your computer that contains your HTML and other
    files.


    +   You may need to navigate to a special folder on the server where site files
    are stored. Check with your service provider for details.


    +   Click the files you want to transfer.


    +   Select multiple files, press and hold Shift while clicking file names.


    +   Click the Upload button.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_321_0.png)


    +   WS_FTP shows status messages as it transfers the files.


    +   Depending on the file size, the transfer may take several minutes.


    +   The transferred files appear in the list of server files.


    +   Click the Close button to exit the program when finishing your transfer.


    You can now use your browser to view the files.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_321_1.png)


    > How do I remove a file from our Web site?


    Open your connection to the server, select the file you want to delete from the
    left pane, and press Delete. A prompt box appears if you really want to remove
    the file. Click Yes to remove your file from the server.


    > Can I transfer a new file of one that is already on the server?


    Yes. You can overwrite existing files. WS_FTP prompts you if you find the same
    file on the server. You have the option of overwriting the existing file with
    the new file. If you click Overwrite in the prompt box if you prefer to wait and
    check the file, click Skip and WS_FTP leaves the original file on the server.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_321_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_321_3.png)


