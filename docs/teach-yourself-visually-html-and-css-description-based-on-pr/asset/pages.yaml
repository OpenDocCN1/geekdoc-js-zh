  md: '# # Start an HTML Document


    You can start an HTML document using a text editor, HTML editor, or word processing
    program. You use of HTML tags to define the basic structure of your page.


    The `&lt;html&gt;`, `&lt;head&gt;`, and `&lt;title&gt;` tags are basic elements
    that appear at the beginning of all HTML documents.


    # Start an HTML Document


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_34_0.png)


    +   1 Open an editor or word processing program.

    * Note: The examples in this book use both Windows Notepad and WordPad. See Chapter
    1 to learn more about editors.

    2 Type `&lt;html&gt;`.

    This tag declares the document as HTML.

    3 Press Enter


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_34_1.png)


    +   4 Type `&lt;head&gt;`.

    This tag defines the title, metadata, and other descriptive information appear.

    Note: For more about adding metadata to a Web page, see the section "Add Metadata."

    5 Press Enter


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_34_2.png)


    20'
