    # What is the difference between client-side image maps and server-side image
    maps?


    # How do I prepare an image to be an image map?


    There are two kinds of image maps: client-side and server-side. Client-side maps
    are interpreted by the browser, so the response time is much faster. The user
    clicks a map area, and the page load must be sent to the server using a CGI script
    before the linked page appears. Most Web developers create client-side maps for
    use with less-complex Web sites.


    You can use a photograph as an image map or design your own graphic map. You can
    use a drawing program to create a simple image map of several shapes. For example,
    you can take a large shape and assign each a different color and label corresponding
    to a Web page or content on your site. Regardless of how you create image map,
    it should have logical areas to click.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_309_3.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_309_4.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_309_5.png)


    continued


