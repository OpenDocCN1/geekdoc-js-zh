  md: '# Internet Basics


    The Internet is a worldwide collection of interconnected computer networks that
    enables businesses, organizations, governments, and individuals to communicate
    in a variety of ways. One of the most popular ways users communicate on the Internet
    is by publishing and interacting with Web pages. You can also use the Internet
    to send and receive e-mail, chat with other users, and transfer files between
    computers.


    The Internet began as a military research project in the late 1960s. In 2007,
    the number of Internet users around the globe topped 1.2 billion.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_18_0.png)


    # Types of Connections


    Users connect to the Internet through a variety of methods. A relatively inexpensive
    but slow to connect via dialup service, which involves using a modem and a phone
    line. Faster ways to connect DSL (digital subscriber line), cable modem, satellite,
    and ISDN (integrated services digital network). Networks include special wireless
    transmitters that allow computers to access the Internet wirelessly. Companies
    that help you connect to the Internet are known as Internet service providers,
    or ISPs.


    # Connection Speeds


    Connection speeds play an important part in a user''s Internet experience because
    slower connections offer the slowest access to the Internet in slower file transfers
    and Web page viewing. Dialup offers up to 56 kilobits per second, or Kbps, followed
    by ISDN connections from 64 to 128 Kbps. DSL usually has connection speeds up
    to 3 megabits per second, or Mbps, while cable modems can achieve speeds up to
    6 Mbps. A Web page that takes about 20 seconds to download via dialup can take
    less than a second using a cable modem.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_18_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_18_2.png)'
  merge: -1
