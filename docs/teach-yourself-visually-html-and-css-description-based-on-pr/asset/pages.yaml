  md: '# Working with Tables


    # SET CELL SPACING


    +   1 In the <TABLE> tag, type CELLSPACING="?", replacing 2 with the pixel value
    you want to assign.


    +   In this example, a table border is turned on to clearly show the padding.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_127_0.png)


    +   The web browser displays the designated amount of space for the cell borders.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_127_1.png)


    # What happens if I set the spacing and padding values to 0?


    If you set the CELLSPACING and CELLPADDING values to 0, the browser removes any
    spacing or padding between the cells. You may use this technique to make images
    in adjacent cells appear as a single image. You can set the BORDER to 0 as well
    to remove the border between cells.


    # How do I control the padding on just one side of a cell?


    The CELLSPACING attribute adds padding to all sides of cells equally. To control
    padding on just one side of a cell, you can apply a style rule to a <TD> tag using
    style sheets. For example, you can apply 10 pixels of padding to the top of a
    table cell using the padding-top property. See Chapter 12 for information on controlling
    padding with style sheets.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_127_2.png)


    113'
