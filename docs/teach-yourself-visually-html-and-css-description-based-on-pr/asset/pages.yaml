  md: '# # Add a Reset Button


    You can add a Reset button to your form to allow users to clear the data they
    have entered. For example, the user may want to type different information, or
    change his or her mind after submitting the information. A Reset button lets erase
    all the information they typed into the various fields.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_191_0.png)


    +   1. Between the `<FORM>` and `</FORM>` tags, type `<INPUT TYPE="reset">`.

    2. Type a space and `VALUE=?`, replacing ? with the text you want to appear on
    the button.


