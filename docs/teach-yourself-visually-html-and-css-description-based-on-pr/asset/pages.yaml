  md: '# CREATE A NONSTRUCTURAL COLUMN GROUP


    # Working with Tables chapter 7


    +   1 After a <COLGROUP> tag, add a line where you want to create a new column
    definition and type <COLSPAN="> replacing ? with the number of columns you want
    to format.


    +   2 Type any formatting attributes you want to assign the columns within the
    <COL> tag.


    You do not need a closing tag for the <COL> tag.


    +   3 Repeat 1 and 2 for each column you want to create in the column group.


    Any formatting is applied to the columns in the group.


    In this example, two columns have a narrower width and a third column has a wider
    width.


    > Note: See the section "Adjust Cell Width and Height" to learn more about changing
    cell dimensions.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_143_0.png)


    # Geography Facts


    | Rank | Country | Continent | Area |

    |---|---|---|--|

    | 1 | USA | North America | 17,078,260 sq km |

    | 2 | Canada | North America | 9,984,640 sq km |

    | 3 | United Kingdom | Europe | 242,495 sq km |

    | 4 | China | Asia | 9,596,960 sq km |

    | 5 | Brazil | South America | 8,515,965 sq km |


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_143_1.png)


    TIPS Can my table include both grouped and ungrouped columns?


    Yes. For example, your table might include a group of cells aside for certain
    data, while the remaining cells remain ungrouped.


    If my column group includes a header and I assign an alignment to the group, does
    the header change, too?


    No. Header cells are not affected by alignment you assign to the column group.
    Browsers read the <th> tag and automatically center alignment and bold text. You
    can, however, align the cell separately using the alignment attributes. See the
    section "Change Cell Alignment" to learn how to align coding to a table cell.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_143_2.png)


