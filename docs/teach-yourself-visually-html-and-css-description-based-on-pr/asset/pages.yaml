  md: '# # Teach Yourself VISUALLY


    # Read Less-Learn More*


    Are you a visual learner? Do you prefer instructions that show you how to do something
    — and skip the long-winded explanations? If so, then this book is for you. Open
    it up and you''ll find clear, step-by-step screen shots that show you how to tackle
    more than 175 tasks HTML and CSS. Each task-based spread covers a single technique,
    to help you get up and running with HTML and CSS in no time.


    You''ll learn to:


    +   * View HTML code in a browser

    * Add and format text

    * Prepare images for the Web

    * Insert links to other pages

    * Control layout with style sheets

    * Add JavaScript* to a web page


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_0.png)


    You can embed a video that you found on a hosting service such as YouTube by inserting
    HTML code into your page. The video is stored locally with your HTML files. For
    a few examples please visit www.youtube.com and see how it works.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_1.png)


    +   * Open your HTML editor and click where you want to insert

    * Visit www.youtube.com

    * Click Copy

    * The HTML is selected.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_2.png)


    +   * Click Paste


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_3.png)


    +   * Open the HTML document in your editor

    * In HTML, click where you want to insert the video

    * Click Paste

    * The video is inserted.


    +   * Save your HTML document

    * Open the document in your browser

    * The video clip appears on the page with controls for playing the video.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_4.png)


    How do I change the dimensions of an embedded video? By changing the width and
    height attributes of the iframe tag. For compatibility with the most browsers,
    use the 480x360 size.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_5.png)


    Can I embed any video from YouTube? Yes, but you can only embed some videos. The
    embed feature only works if the embedding is turned on.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_6.png)


    +   * Helpful sidebars offer practical tips and tricks


    +   * Succinct explanations walk you through every step


    +   * Full-screen shots demonstrate each task


    +   * Two-page lessons break big topics into bite-sized modules


    Programming Languages/ HTML, SGML


    $29.99 USA • $32.99 CAN • £28.58-b


    ISBN 978-0-470-28588-6 52999


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_351_7.png)


    www.wiley.com/go/visual'
