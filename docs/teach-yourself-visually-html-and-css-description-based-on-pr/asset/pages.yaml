  md: '# # Create a JavaScript File


    # # Working with JavaScript chapter 13


    Many developers prefer to save their scripts in a separate text file and link
    the file to the Web page. Storing your scripts in a separate file can free up
    your HTML document to focus on Web content. When saving a JavaScript file, use
    the .js extension.


    When you upload your Web pages to a server, be sure to include the linked JavaScript
    file. See Chapter 15 to learn more about publishing Web pages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_271_0.png)


    +   1 Create a new document in your editor.


    +   2 Type your JavaScript code.


    Note: You can find many JavaScript programs on the Internet. See the section "Understanding
    JavaScript" to learn more.


    +   3 Save the file using the .js extension.


    Note: See Chapter 2 to learn how to create and save documents. ''javascript''.


    +   4 In your Web page document, click where you want to insert the code and type
    `<script type="javascript">`.


    +   5 Type a space and `SRC="?"`, replacing it with the location and name of the
    JavaScript file.


    +   6 Type `</script>`.


    The JavaScript file is now linked to the Web page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_271_1.png)


