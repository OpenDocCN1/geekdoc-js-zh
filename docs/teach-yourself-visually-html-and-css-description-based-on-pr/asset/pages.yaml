  md: '# # Add Column Labels


    If you are building a table to populate data, you can add labels, also called
    headers, to the top of each column using the `&lt;TH&gt;` tag. for example, if
    your table lists products and prices, your column headers might include labels
    as Product Number, Product Name, and Price. Column headers appear in bold type
    and are centered within each cell.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_130_0.png)


    # Add Column Labels


    +   1. **&lt;TH&gt;** after the `&lt;TR&gt;` tag for the row you want to use as
    your column labels.


    *Note: See the section "Add a Table" to learn how to create a basic table.*


    +   2. **Type label text** for the first column.


    +   3. **&lt;TH&gt;** at the end of the label.


    +   4. **Repeat steps to 1 to 3** to add as many column labels as you need, ending
    the row with the `&lt;/TR&gt;` tag.


    +   The web browser displays the labels as column headers in the table.


    ```

    <html>

    <head>

    <title>Largest Countries by Area</title>

    </head>

    <body>

    <table border="1" bgcolor="green" cellpadding="5">

    <tr>

    <th>Country</th>

    <th>Area (km²)</th>

    </tr>

    <tr>

    <td>Russia</td>

    <td>17,098,242</td>

    </tr>

    <tr>

    <td>Canada</td>

    <td>9,984,670</td>

    </tr>

