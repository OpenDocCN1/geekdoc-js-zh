    By default, Web browsers display the borders around your frames at a thickness
    of 6 pixels. You can set your frame borders to another size as well as control
    the color of the borders.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_160_0.png)


    # Customize Frame Borders


    # CHANGE THE FRAME BORDERS


    +   Within the <FRAMESET> tag, type BORDER="7", replacing ? with a thickness value
    in pixels.


    ```

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    </head>

    <FRAMESET rows="160,*" border="10">

    <frame name="left" src="left_banner.html"></frame>

    <frame name="main" src="main_main.html"></frame>

