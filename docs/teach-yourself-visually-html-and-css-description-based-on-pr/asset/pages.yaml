  md: '# # Create a New Paragraph


    You can use paragraph tags to start new paragraphs in an HTML document. In a word
    processing program, you press Enter or Return to separate blocks of text. Web
    browsers do not read these line breaks. Instead, you must insert a <p> tag in
    your HTML any time you want to start a new paragraph in your Web page.


    Paragraphs are left-aligned by default, but you can choose a different alignment
    by aligning the tags. See the section "Change Paragraph Alignment" to learn more.


    # Create a New Paragraph


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_48_0.png)


    +   1. Type <p> to start a new paragraph.

    2. Type your text.

    3. Type </p> at the end of the paragraph.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_48_1.png)


    When displayed in a Web browser, the text appears as a paragraph with extra space
    above and below it.


    **Note:** To create paragraphs that are indented at the sides, see the section
    "Add Block Quotes."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_48_2.png)'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Change Paragraph Alignment


    You can control the horizontal positioning, or alignment, of your paragraphs using
    the ALIGN attribute. You can choose to align a paragraph to the left, right, or
    center, or justify the text so it is aligned on both the left and the right. Paragraphs
    are left-aligned by default.


    # Adding Text chapter 3


    You can use the ALIGN attribute within numerous tag elements, including headings
    and lists. For example, you can center a heading or right-align a bulleted list.


    # Change Paragraph Alignment


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_49_0.png)


    +   1 Click the <p> tag in which you want to change the alignment.

    2 Type a space and then ALIGN="?", replacing ? with Left, Center, Right, or Justify.


    Note: You can type HTML commands in uppercase or lowercase letters, or a combination
    of the two.


    When displayed in a Web browser, the text aligns as specified.


    +   In this case, the line of text is centered on the page.


    Note: To control the width of a paragraph using style sheets, see Chapter 12 for
    more information.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_49_1.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# # Add anLine Break


    You can use the line break tag, `&lt;BR&gt;`, to control where your text breaks.
    Web browsers normally wrap text automatically; when a line of text reaches the
    right side of the browser window, it breaks and continues on the next line. You
    can insert a line break to instruct the browser to break the text and go to a
    new line.


    You can also use the `&lt;BR&gt;` tag to add blank lines between paragraphs. This
    is useful if you want to add extra space above or below a block of text or a heading.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_50_0.png)


    +   1 Type `&lt;BR&gt;` in front of the line of text that you want to appear as
    a new line.


    +   2 Type additional `&lt;BR&gt;` tags wherever you want a line break.


    *Note:* You do not need a closing tag for the `&lt;BR&gt;` tag.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_50_1.png)


    +   When the page is displayed in a Web browser, each instance of the tag creates
    a new text line.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_50_2.png)


    36'
  merge: -1
