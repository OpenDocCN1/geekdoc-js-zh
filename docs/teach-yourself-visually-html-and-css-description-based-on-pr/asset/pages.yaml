  md: '# # Create a

    Nested Frameset


    You can nest a frameset within another frameset, creating a combined frameset.
    For example, you might place a two-frame frameset within the largest frame of
    your main frameset.


    You create a nested frameset same way you created the initial frameset. See the
    section "Create Frames" to learn more about creating a frameset document and defining
    frames.


    # Create a Nested Frameset


    +   1 In the frameset document, add a line where to insert a nested frameset.


    +   2 Type `<FRAMES ROWS="?">` to insert rows, or type `<FRAMES COLS="?">` to
    insert columns, with the row or column values for your frames.


    +   3 Add the frame tags to define the frame names and source pages.


    +   4 Type `</FRAMESET>` to complete the nested frameset.


