  md: '# Creating Style Sheets


    7 Repeat steps 2 to 6 to continue adding rules to your style sheet.


    8 Click File.


    9 Click Save.


    The Save As dialog box appears.


    10 Navigate to the folder that contains your HTML pages.


    11 Type a unique filename for your style sheet and a .css extension.


    12 Save.


    Your text editor saves the new style sheet.


    Note: To learn how to apply a style sheet to an HTML document, see the section
    "Link to a Style Sheet.



    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_203_0.png)


    Do style declarations need to be on a single line?


    No. Similar to HTML, you can add line breaks and spaces within your CSS without
    changing the effects of your rules. It can be a good idea to put each declaration
    on a separate line to make it easier to view and edit your rules. You can also
    use tabs to make CSS properties and values on one line or another.


    Can I override the normal styles of an HTML tag with CSS?


    Yes. You may use CSS to change how HTML tags normally appear, making them behave
    like others. For example, you can change the style of a heading tag so that it
    looks like regular paragraph, or vice versa. See Chapter 11 for some of the many
    types of styles you can apply to tags with CSS.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_203_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_203_2.png)


    189'
