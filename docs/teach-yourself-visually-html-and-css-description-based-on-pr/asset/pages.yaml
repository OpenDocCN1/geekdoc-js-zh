  md: '# Control the Overlap of Elements


    You can use style sheets to overlap elements on your pages by positioning them
    at similar coordinates. You can then control the stack order of elements by adjusting
    the z-index property for each element. An element with a higher z-index value
    appears above an element with a lower z-index value.


    See the "Use Absolute Positioning" for more about the coordinates of a page element.


    # Control the Overlap of Elements


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_258_0.png)


    +   Create ID styles for the overlapping elements.


    +   Use absolute positioning to arrange the elements on the page.


    +   Apply the ID to the elements by typing id="?" inside the HTML tags, replacing
    ?2 with the ID names.


    In this example, two images are overlapped.


    Notes: For more about creating ID styles, see Chapter 10. For more about absolute
    positioning, see the section "Absolute Positioning."


    +   Inside the ID style declaration for the element you want on the bottom, z-index:
    2, replacing ? with a number.


    ```

    <html>

    <head>

    <title>Great Destinations</title>

    </head>

    <body>

    <style>

    #top { position: absolute; top: 50px; left: 100px; }

    #bottom { position: absolute; top: 80px; left: 250px; }

    </style>

    <img src="reef.jpg" alt="left" width="400" id="top">

    <img src="pypanic.jpg" alt="left" width="400" id="bottom">

    </body>

    </html>

    ```'
