  md: '# # Understanding JavaScript


    You use snippets of code written in JavaScript to add dynamic effects to your
    Web pages. Such scripts can help turn a static HTML page into a more exciting,
    interactive experience. You can use JavaScript to display message boxes, when
    a user rolls a mouse over an area of the page, validate form information, and
    more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_266_0.png)


    # ## How Scripts Work


    Scripts are short programs you can write to add interactivity to Web pages. Scripting
    instructions can be activated when an event occurs, such as when a user clicks
    a link or moves the mouse pointer over an image. Scripts can also be activated
    automatically when the user downloads your page. Because scripts are written in
    programming languages, you need to know a little bit about programming to write
    your own scripts. To learn more about writing scripts, visit www.htmlgoodies.com/primers/js/


    # ## JavaScript


    Most Web page scripts are written in the JavaScript language, which nearly all
    Web browsers support. Because JavaScript is executed by Web browsers, also known
    as clients, JavaScript is known as a client-side scripting language. Other scripting
    languages, such as PHP and Perl, run on Web servers and are known as server-side
    scripting languages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_266_1.png)'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Working with JavaScript chapter 13


    # Adding Scripts to Your Pages


    JavaScript code can be embedded within the HTML of your page or in a separate
    file. If you put JavaScript inside an HTML page, you need to bracket it with opening
    and closing <SCRIPT> tags. If you put JavaScript in a separate file, you need
    to end the name with a .js extension. To use code from an external file, you need
    to link the file in your page using the src attribute. JavaScript is case-sensitive
    and requires careful placement of semicolons, single quotes, double quotes, and
    other punctuation, so use care when typing your scripts.


    # Scripting Tools


    You can create your scripts using an HTML editor. Many editors, like Adobe Dreamweaver,
    offer built-in toolsets to help you create your scripts without needing to know
    a lot about programming. You can also easily incorporate scripts that other users
    have written.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_267_0.png)


    # Finding Prewritten Scripts


    Many Internet sites offer JavaScript that you can use in your own Web pages. Be
    sure to ask permission, if needed. For example, JavaScript.net (www.javascript.net),
    JavaScript City (www.javascriptcity.com), and The JavaScript Source (javascript.internet.com)
    offer free JavaScript for Web pages.


    # Scripting Tips


    Some users turn the JavaScript function in their browsers for security reasons.
    You can use the <NOSCRIPT> tag to include alternative text about the script. For
    example, message like "Your browser does not support this script." It is also
    good policy to note the scripting language in your HTML document, using the <META>
    tag. The remaining sections of this chapter show you a few JavaScript features
    you can try out on your own pages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_267_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_267_2.png)'
  merge: -1
