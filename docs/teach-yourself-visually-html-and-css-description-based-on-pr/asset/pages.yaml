  md: '# # Align an Image Horizontally


    # Adding Images chapter 5


    You can use the left and right alignment attributes to control the horizontal
    positioning of an image on a page. The alignment attributes also control how text
    wraps around the image.


    You can also align an image vertically on a page. See the section "Align an Image
    Vertically" to learn more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_91_0.png)


    # Align an Image Horizontally


    +   - Click inside the `<img>` tag and type `ALIGN="?", replacing with the alignment
    you want to apply, either left or right.


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Ira''s Travel Agency: Machu Picchu</title>

    </head>

    <body>

    <img src="Machu-Picho.jpg" ALIGN="right">

    <p>Located in the Peruvian Andes, the ancient Inca city of Machu Picchu was constructed
    in the 1400s at the height of the Inca Empire. It was abandoned for more than
    100 years after the Inca were conquered by Spanish. Today, Machu Picchu is the
    most visited tourist attraction in Peru.</p>

    </body>

    </html>

    ```

    ```


    The web browser aligns the image as specified.


    +   - In this example, the image is aligned to the right.


    Note: To center-align an image, see the section "Center an Image."


    Note: For greater control over image alignment, consider placing your images in
    tables. Learn more about using tables in Chapter 7.


