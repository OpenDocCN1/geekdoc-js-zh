  md: "# Create a Class\n\nYou can create a CSS class to apply a style rule to specific\
    \ HTML tags. For example, if you want the introductory paragraphs formatted differently\
    \ from all the other paragraphs, you can create a class specifically for the introductory\
    \ paragraphs. After you create the class, the browser applies it to all the paragraphs\
    \ to which it is assigned.\n\nYou can set a class in your external or internal\
    \ style, and then use the CLASS attribute to assign rules to an HTML tag. To learn\
    \ more about creating style sheets, see the sections \"Create an External Style\
    \ Sheet\" and \"Create an Internal Style Sheet.\"\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_208_0.png)\n\
    \n# Create a Class\n\n# DEFINE A CLASS\n\n+   1. In your external or internal\
    \ style sheet, type the tag for which you want to create a class.\n\n+   2. Type\
    \ a period.\n\n+   3. Type a name for the class.\n\n```\n.special {\n  width:\
    \ 50px;\n  family: Arial; font-size: 12px;\n}\n```\n\n+   4. Type.\n\n+   5. Type\
    \ one or more declarations for the class.\n\nSeparate multiple declarations with\
    \ semicolons.\n\nNote: To learn more about writing style rules, see Chapter 11.\n\
    \n+   6. } to end the style rule.\n\nYour class is now defined.\n\nIf you are\
    \ editing an external style sheet, save the sheet.\n\n```\n.special {\n  font-family:\
    \ Arial; color: #000066;\n  font-size: 12px;\n}\n```\n\n194"
