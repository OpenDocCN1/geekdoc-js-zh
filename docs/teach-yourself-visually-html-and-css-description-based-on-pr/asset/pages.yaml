  md: '# # Understanding Multimedia Elements


    The term multimedia encompasses all kinds of dynamic visual and audio data, including
    graphics, sound, animation, and movies. You can incorporate multimedia elements
    into your own HTML pages, but first it is useful to understand how such elements
    work on the Web.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_286_0.png)


    # ## Ways to Use Multimedia


    You can use multimedia files in a variety of ways on your Web page. Media can
    create an ambiance for the site, enhance your site''s message, illustrate a product
    or service, or simply entertain. When choosing a media file and format to add
    to your page, always consider the main target audience for your pages. Be sure
    to include about the multimedia elements on your page in case the user needs to
    install special programs or plug-ins to view them.


    # ## Delivering Media Files


    You can deliver multimedia files to your Web site visitors in several ways. You
    can link to an external media file, embed the file into your page, or stream the
    file. The method you choose depends on how you want the user to interact with
    the file. Regardless of the method, you must specify the location of the file—either
    on your Web server, where the multimedia files are stored with your HTML, or on
    an external host such as YouTube.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_286_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_286_2.png)'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# External Media Files


    One way to incorporate a multimedia element into your page is to supply a link
    to an external file. For example, you might allow a visitor to click a link and
    download a slide show of your vacation pictures or a music file of your latest
    song. If the user decides to access the file, the browser helps him her determine
    how to download it and where to store it. After downloading the file, the user
    can play the file in a separate window using the appropriate media player or program.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_287_0.png)


    # Embedded Files


    You can integrate a multimedia file directly onto your page by embedding the file.
    When the user accesses the page, the file plays as part of the page content. For
    example, you might embed a video file to play in an area on the Web page. Depending
    on the file type and setup, the file may play immediately when the user displays
    the page or when the user activates a button or other feature on the page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_287_1.png)


    # Streaming Media


    With streaming media, the user can immediately start viewing or hearing the file
    as the rest of it continues to download. The data starts downloading into a buffer
    and then the media begins playing the file. Adding streaming media is similar
    to linking or embedding a file, but instead of referencing the actual file, you
    define a metfile that contains information about the target file''s location.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_287_2.png)'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Understanding Plug-Ins and Players


    A wide variety of media formats exist on the Internet, but to play these formats
    the user needs a plug-in or media player. When determining what type of media
    file to include with your page, think about how your target audience will interact
    with the file. Do they need a special plug-in or program to play the file? If
    so, you need to add information about those requirements to your page, along with
    access to the actual media file.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_288_0.png)


    Plug-ins

    Plug-ins are specialized applications that work with the browser to play media
    files, typically focusing on a particular file format. If users do not have the
    right plug-in to play your file, they can easily download it, install it, and
    use it as part of their Web browser. First introduced by Netscape, plug-ins are
    now popular among all the browsers. For example, you can install a Flash Player
    plug-in to allow your browser to play multimedia files.


    Media Players

    Media players are separate programs designed to handle many types of media files.
    Often called all-in-one players, media players can work both separately and alongside
    browsers to play multimedia files encountered on and off the Web. Popular media
    players include Microsoft''s Windows Media Player, Apple''s QuickTime player,
    and RealNetworks'' RealPlayer. Users can download copies of these popular media
    players from the Internet. You can help your users by providing links to download
    locations.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_288_1.png)'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Adding Multimedia and Extra Touches


    # Dueling HTML Elements


    Establishing standards for Web page development is an ongoing task for the World
    Wide Web Consortium (W3C). Currently, two popular elements exist for showing multimedia
    files on Web pages: EMBED and OBJECT. Netscape created the nonstandard EMBED element,
    while W3C introduced the standard OBJECT element. Microsoft has added ActiveX
    controls to the OBJECT element. Today''s browser versions support them to varying
    degrees. For the widest support, many developers combine the OBJECT element with
    the nonstandard EMBED element. See the section "Embed an Audio File" for details.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_289_0.png)


    # Embed with ActiveX Controls


    Another way to embed video clips into your pages is using ActiveX controls along
    with the OBJECT element. ActiveX uses a CLASSID attribute number to define which
    data type the browser loads for playback. The CLASSID attribute for QuickTime,
    for example, is different from that for Windows Media Player. After you define
    the proper player, you can set the parameters for the clip''s playback. For an
    example, see the section "Embed a Flash Movie."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_289_1.png)


    # Finding Media Players and Plug-ins


    | Player | Web Site |

    | --- | --- |

    | Windows Media Player | www.microsoft.com/downloads |

    | QuickTime | www.apple.com/quicktime |

    | Adobe Flash Player | www.adobe.com/flashplayer |

    | Adobe Shockwave Player | www.adobe.com/shockwave/ |

    | Adobe Reader | www.adobe.com/products/accrobat |

    | RealPlayer | www.real.com |'
