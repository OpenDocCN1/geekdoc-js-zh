  md: '# Use Relative Positioning


    You can apply relative positioning to elements on your Web page to place content
    relative to other content on the page. If you offset a relatively positioned element
    the top, left, right, or bottom property, the element is offset to the point where
    it normally begins.


    Relative is the default for the positioning style property.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_246_0.png)


    # Use Relative Positioning


    # APPLY RELATIVE POSITIONING


    +   Click inside the tag declaration and type position: relative.


    +   In this example, the positioning is applied to all the paragraphs on a page
    by defining a style for the <P> tag.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Destinations</title>

    <style>

    pp { position: relative; }

    </style>

    </head>

    <body>

    <h2>Great Destiny</h2>

    <p>The Great Pyramid of Giza built around 2560 BC, is the oldest and largest of
    the three pyramids located near Cairo. It is the only surviving structure of the
    ancient wonders. The Ancient Pyramid was the tallest man-made structure in the
    world for over 3,800 years and is believed to be a tomb for the Egyptian pharaoh
    Khufu.</p>

    <p>The Great Wall of China is a series of fortifications built across the northern
    Chinese borders. It stretches over 4,000 miles along various mountains. The Great
    Wall was guarded by more than one million soldiers. Various accounts of its history
    provide scientific calculations that show this is impressive.</p>

    ```


    +   The browser displays the elements with relative positioning, one after the
    other.


    +   In this example, a background color is applied to the paragraphs to show the
    content boxes.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_246_1.png)


    232'
