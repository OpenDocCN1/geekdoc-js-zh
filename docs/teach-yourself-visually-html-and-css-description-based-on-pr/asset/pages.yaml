  md: '# Formatting Text with Style Sheets


    Type a space and then a color value.


    Note: To see a list of color values, see Chapter 4.


    +   - In many instances, you will need to add some padding between the content
    and the border; you can use the padding property to do so.


    Be sure to separate multiple style declarations in a rule with semicolons (;).


    Note: See Chapter 12 to learn about padding.


    The web browser assigns a border to the content.


    +   - In this example, a border is added to the introductory paragraph using a
    style-sheet class.


    Note: See Chapter 10 to learn more about creating classes in your sheets.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_231_0.png)


    Can I add a border to sides of an element instead of the entire element?


    Yes. You can use border-left, border-right, border-top, and border-bottom properties
    to designate which sides you want to add a border. Your code may look like:


    ```

    H3 {border-left: double 5px; border-right: double 5px}

    ```


    In this example, a border is added to the left and right sides of the heading.


    Is there a way to remove all of the borders on my page?


    Yes. To remove borders, such as that around default images, you can use the border
    property and set the value to none. Your code may look like this:


    ```

    IMG {border:none}

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_231_1.png)


