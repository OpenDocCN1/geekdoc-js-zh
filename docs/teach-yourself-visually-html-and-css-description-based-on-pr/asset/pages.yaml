  md: '# # Add Comments to a Style Sheet


    # Creating Style Sheets chapter 10


    You can add comments to your style sheet to describe and identify your style rules.
    For example, you might add a comment describing the effect of the rule when it
    is applied to text. Web browsers do not interpret information in style sheets.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_205_0.png)


    # Add Comments to a Style Sheet


    +   In your style sheet document, type /* to begin your comment.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_205_1.png)


    **Note:** To learn how to create a style sheet, see the section "Create an External
    Style Sheet"


    +   Type your comment text.


    +   Type /* to end the comment.


    When the page is displayed in a Web browser, the comments are ignored.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_205_2.png)'
  merge: -1
