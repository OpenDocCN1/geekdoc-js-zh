  md: '# # Creating Your First HTML Page


    5 Type a name for the file, followed by .html or .htm.


    6 Click Save.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_39_0.png)


    A dialog box may appear alerting you that all formatting will be removed.


    7 Click Yes.


    The editor saves the file.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_39_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_39_2.png)


    # What is the difference between the .html and .htm extensions?


    The shorter .htm extension is left over from the early Windows days, when file
    names could have only three-character extensions. Some Windows-based programs
    still default to .htm. Today''s computers can handle file names and extensions,
    so the three-character limit is no longer an issue. Web browsers and servers can
    read either extension, you probably wanna opt for .html because it is more universally
    used.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_39_3.png)


    # What makes a good file name for a Web page?


    When naming a file, it is a good idea to keep the name simple so that you can
    easily remember it and locate it again. In addition, you need to type file names
    when creating hyperlinks, so it is best to use a name that relates to the pages
    you are designing. For example, if you are creating a page that lists information
    for your company, the file name for that page might be contact.html. It is also
    a good idea to keep your Web page files in one folder and give the file name that
    clearly identifies the content, such as My Web Pages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_39_4.png)


    25'
  merge: -1
