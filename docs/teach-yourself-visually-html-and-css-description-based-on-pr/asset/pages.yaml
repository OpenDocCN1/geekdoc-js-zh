- img_proc: true
  md: '# Explore Web Browsers


    A Web browser is software that can retrieve HTML documents from the Web, parse
    HTML instructions, and display the resulting Web pages. You can also use a browser
    to display HTML documents you save locally on your computer. When coding your
    HTML, you can use a Web browser to test your work.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_22_0.png)


    # Finding a Browser


    # Browser Discrepancies


    Most computer operating systems come with a Web browser already installed. Microsoft
    Windows Vista includes the Internet Explorer browser, while Apple Mac computers
    include the Safari browser. (The examples in this book use Internet Explorer).
    Mozilla Firefox is another browser that has become increasingly popular in recent
    years. You can learn more about Firefox and download it for free at //www.mozilla.com/firefox.
    For more information about the Web browsers in use today, see the Wikipedia at
    http://wikipedia.org/wiki_browser.


    There are many Web browsers in use today, and numerous versions of each. While
    most of them interpret HTML essentially the same way, slight differences in interpretation
    mean that not all of them display Web pages exactly the same way. Also, some recent
    web browsers recognize newer HTML features that older browsers do not. You can
    avoid surprises by writing clean, well-formed HTML code and testing your in different
    browsers as you work. The Wikipedia offers a detailed comparison of Web browser
    features at http://wikipedia.org/wiki/Comparison_of_web_browsers.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_22_1.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# # Explore HTML Editors


    Getting Familiar with HTML and Web Page Basics chapter1


    Because HTML documents are plain-text documents, you can use any text-editing
    program to code HTML and create a Web page. You can also use a variety of Web-specific
    environments that will write your HTML code, validate it, and upload it to a Web
    server.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_23_0.png)


    # ## Simple Text Editors


    # ## HTML Editors


    # ## Word Processing Programs


    Simple text editors, also called plain-text editors, are easy to find. Microsoft
    Windows Vista comes with Notepad, while Apple Mac computers come with TextEdit.
    Simple text editors offer no-frills word processing and are often the best choice
    when you are learning to write HTML. This book uses the Windows Notepad and Notepad++
    in its examples. Wikipedia has a list of free and commercial text editors http://wikipedia.org/wiki/List_of_editors.


    HTML editors, such as Adobe Dreamweaver and Microsoft Expression, are dedicated
    programs for writing HTML code and managing Web pages. These programs can shield
    you from having to write HTML code by offering a graphical environment for building
    Web pages as well as a text-based environment. Most HTML editors also color your
    HTML tags for easier viewing, validate the code, and help you upload finished
    pages to a server.


    You can also use word processing programs, such as Microsoft Word, to write HTML.
    In Word, you can select HTML as the file type when you save a document, and the
    program automatically adds the appropriate HTML tags. However, commercial word
    processors need to store lots of extra information with your HTML, which can make
    it a challenge to edit the files in other editors.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_23_1.png)


