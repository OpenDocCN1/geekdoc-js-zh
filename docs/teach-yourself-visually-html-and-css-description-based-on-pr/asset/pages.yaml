  md: '# Adjust the Table Size


    You can control the exact size of a table using the WIDTH and HEIGHT attributes
    in the <TABLE> tag. You can specify a table size in pixels or set the size as
    a percentage of the browser window.


    When setting a width in pixels, limit the value to 750 pixels to ensure the table
    fits on the screen. If you prefer a more flexible table, set the size as a percentage.
    This allows the table to be resized if the browser window is resized.


    # Adjust the Table Size


    # SET A TABLE SIZE IN PIXELS


    +   1. In the <TABLE> tag, type WIDTH="7", replacing with the pixel value you
    want to assign.


    +   2. Type a size.


    +   3. Type HEIGHT="?", replacing with the pixel value you want to assign.


    Notes: The HEIGHT attribute is not as supported as the WIDTH attribute and may
    not display properly in all browsers.


    +   The Web browser displays the table at the specified size.


