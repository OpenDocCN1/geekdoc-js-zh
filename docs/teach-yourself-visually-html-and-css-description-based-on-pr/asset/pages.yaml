    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_123_0.png)


    The Web browser displays the data in a tabular format.


    +   In this example, the table cells need some padding and spacing or borders.


    > Note: See the sections "Assign a Table Border" and "Adjust Cell Padding and
    Spacing" to learn more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_123_1.png)


    # How do I set a size for a table?


    You can set the dimensions of a table as exact pixel values or percentages of
    the browser window using the `<TABLE>` tag''s WIDTH and HEIGHT attributes. If
    you want to set a fixed size and have the entire table width visible in browsers,
    set the width to 750 pixels or less, because most users use Web with their monitors
    set to at least 800 pixels. For more information, see the section "Adjust the
    Table Size."


    # What is the best way to build a table?


    Before start coding your table, draw it out on paper to organize the cell contents,
    design column headers and rows, and determine its general layout and size. When
    you are ready to begin coding, start by typing the numbers in the cells as placeholders.
    You can check the structure in a Web browser to see how it looks, then return
    to your editor and start filling in the real cell data.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_123_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_123_3.png)


