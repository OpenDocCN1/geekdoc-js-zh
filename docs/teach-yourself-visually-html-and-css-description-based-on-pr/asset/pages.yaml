  md: '# # Add a Menu List


    Add a menu to a form to give users a list of choices. Menus allow you to display
    choices as a drop-down list that appears when the user clicks the list. By storing
    a long list of choices as a drop-down list, you can free up space for other input
    items in the form.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_188_0.png)


    # Add a Menu List


    +   1. Between the `<FORM>` and `</FORM>` tags, type `<SELECT NAME="">`, replacing
    with a unique name for the menu.


    +   2. Type a space and `SIZE="">`, replacing with the height, measured in character
    lines, for the menu input.


    If you want to display a drop-down menu, set the height to 1.


    +   3. Start a new line and type `<OPTION VALUE="">`, replacing with a descriptive
    word for the menu.


    +   4. Type the text you want to appear in the menu list.


    ```

    <br><br>

    Returning customer:

    <INPUT TYPE="radio" NAME="returning" VALUE="yes">

    <INPUT TYPE="radio" NAME="returning" VALUE="no">

    <br>

    Comments:

    <SELECT NAME="content" SIZE="1">

    </FORM>

    <br>

