    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_311_0.png)


    # How do I determine the coordinates for an area on my image map?


    You can use an image map editor to create image maps. You can also use an image
    map editor to define the coordinates within the map. One of the most popular image
    map editors is Mapedit. You can find it at www.boutell.com/mapedit. You can conduct
    a Web search for free image map editors. If your graphics editing program has
    a graph feature, you might use it to figure out the map coordinates as well.


    # What happens if my clickable areas overlap?


    If you accidentally overlap two areas with your coordinates, the Web browser treats
    the second area as part of the first. If you type coordinates that extend past
    the image area, the Web browser ignores them.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_311_1.png)


