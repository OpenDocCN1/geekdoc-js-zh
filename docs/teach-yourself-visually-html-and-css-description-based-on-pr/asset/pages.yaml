  md: '# Promote Your Web Site


    After you publish your site, it is available for others to view on the Web. There
    are several ways you can bring attention to your Web site. You can advertise it
    offline by adding your URL to business cards, stationery, and other products you
    distribute to others. You can advertise your site online by adding your URL to
    your e-mail message signature. You can also enlist the help of search engines
    to index your site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_324_0.png)


    # Search Engines


    Search engines collect information about pages encountered on the Web and then
    make that easily searchable. They do this by cataloging URLs, keywords, page titles,
    and text from HTML documents. When someone performs a search for keywords, the
    search engine compares the request with the information gathered in its database
    and displays matching results as links, listing what it determines to be the most
    relevant first.


    # Submit Your Site


    To bring attention to your site, you can register it with search engines. Some
    search engines offer an online form you can fill out to register your URL. Popular
    search engines to contact Google (www.google.com/addurl.html) and Yahoo (docs.yahoo.com/info/suggest/).
    Even if you do not register your site with search engines, they will often do
    a good job of finding your site by following links from other sites.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_324_1.png)'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Publishing Your Web Pages


    # chapter 15


    # Add Keywords


    When users look for Web sites, they type keywords into a search engine. You can
    add keywords to your page to help users find your site. You can add keywords to
    your metadata information, as well as use them in your title and headers. Keywords
    should honestly reflect your content. Take into think about keywords users might
    type to find your page, and add them to your metadata tag. See Chapter 2 to learn
    how to insert metadata on your page.


    # Write Good Page Titles


    Because search engines give greater weight to page titles when analyzing Web pages,
    descriptive titles can help draw users to your site. Search engine results typically
    list page titles, a well-written title can tell a potential visitor whether your
    site is relevant or not. When writing titles, keep your text descriptive but concise.
    See Chapter 2 to learn how to add title to your page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_325_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_325_1.png)


    # Linking with Others


    Another good way to publicize your site is through links. You can contact sites
    with similar content to see if they will link to your site. You can then link
    to those sites in exchange. You can also join Web rings of similar sites. A Web
    ring is a group of sites focusing on a related topic, all linking to each other.


    # Advertising


    You can advertise your Web site on other pages. Some free link-exchange networks
    can help you promote your site by allowing you to exchange links with similar
    sites. Search for "link exchange" on your favorite search engine to find them.
    Advertising networks such as Adbrite (www.adbrite.com) and Google Adwords (http://www.adwords.google.com)
    allow you to promote your site''s services on other Web sites for a fee.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_325_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_325_3.png)'
