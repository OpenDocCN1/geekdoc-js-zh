  md: '# # Understanding Style Sheets


    You can use Cascading Style Sheets, or CSS, to exercise control over the appearance
    of your HTML documents. Style sheets can help you maintain a consistent look and
    feel throughout your Web site. By relegating formatting controls to a separate
    CSS, you can free your HTML documents from repetitive coding and concentrate on
    the content that makes up your pages. Like HTML documents, CSS documents are simple
    text files.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_200_0.png)


    # ## Defining Style Sheets


    A style sheet is usually a text file that separates from your HTML document. Style
    sheets can also be internal, residing within your HTML code. A style sheet holds
    formatting codes that control your Web page''s appearance. You can use style sheets
    to change the look of any Web element, such as paragraphs, lists, backgrounds,
    and more. Anyone you want to apply the formatting of an external style to an HTML
    document, you attach the style sheet to the page using a LINK tag. Style sheet
    files have a .css extension.


    # ## Controlling Multiple Pages


    You can link every page in your Web site to a single style sheet. Any changes
    you make to the style sheet formatting are reflected in every HTML document linking
    to the sheet. By storing all the formatting in one place, you can easily update
    the appearance of your site''s pages in one sweep. This can be a real timesaver
    if your site consists of lots of pages.


    # ## Style Sheet Syntax


    Style sheets are made up of rules, and each rule has two parts: a selector and
    a declaration. The selector specifies the element to which you want to apply a
    style rule, and the declaration, specifies the formatting for the selector. For
    example, in the rule h2 {color: silver}; h2 is the selector and the declaration.
    When applied to a page, this rule will make all level 2 headings appear in silver.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_200_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_200_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_200_3.png)


    186'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Style Sheet Declarations


    A declaration consists of one or more property and value pairs such as font-size:
    12px or position: absolute. The property and value are separated by a colon; multiple
    property-value pairs in a declaration are separated by semicolons. It is good
    to format each property-value pair on a line when writing your rules. Similar
    to HTML, you can add spaces and line breaks to your style sheet to make it more
    readable. Learn more about writing rules in Chapter 11.


    # Style Classes


    If you want to applying only to a particular instance of a tag, you can use a
    class attribute inside that tag. You can assign a distinct name to a class and
    add a style rule that applies only to that class. For example, perhaps you want
    to add special formatting to one paragraph but not others. Define the style on
    your style sheet, and then refer to the class name in your paragraph tag.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_201_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_201_1.png)


    # Inheritance


    Tags you add inside others inherit the outer tag''s formatting, unless you specify
    otherwise. For example, if you define a <BODY> style, any tags within the <BODY>
    style inherit that formatting. HTML makes it easy to keep the formatting consistent
    as you add new items within an element. The inheritance relationships between
    different styles in a document is known as the cascade.


    # External and Internal Style Sheets


    You can connect an HTML document to an external or internal style sheet. Internal
    style sheets exist within an HTML page, between the <HEAD> and </HEAD> tags, while
    external style sheets are separate files. External style sheets are useful because
    you can link them to more one HTML document. You may use an internal style sheet
    if your site consists of a single page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_201_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_201_3.png)'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Create an External Style Sheet


    We can use an external style sheet to define formatting and layout instructions
    and then apply those instructions to your HTML documents. You can save the style
    sheet as a text file and assign the .css file extension to identify the file as
    a Cascading Style Sheet.


    For more style sheets and how they work, see the section "Understanding Style
    Sheets."


    # Create an External Style Sheet


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_202_0.png)


    +   1 Create a new document in your text editor.


    Note: To create and save HTML documents, Chapter 2.

    2 To create a style rule, the element tag for which you want to define formatting
    properties.


    This example shows how to create a style rule for level 2 headings.

    3 Type a space.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_202_1.png)


    +   4 Type {

    5 Type one or more declarations.

    Each declaration includes a property and a value separated by a colon.


    Separate multiple declarations by semicolons.


    In this example, the rule includes setting a font and a font style.


    Note: To learn more about writing specific style rules, Chapter 11.

    6 } to end the rule.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_202_2.png)


    188'
