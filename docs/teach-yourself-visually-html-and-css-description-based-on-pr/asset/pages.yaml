    > Can I load one page right after another to create a slide show?


    Yes. You can use the <META> tag you used for loading pages to set up an automatic
    Web slide show of your pages. The pages progress from one to another, each staying-on
    for a designated time. Follow these steps:


    +   1 Add a new line between the <HEAD> and </HEAD> tags for the start of your
    page.

    2 Type <META HTTP-EQUIV="Refresh" CONTENT="?", replacing ? with the number of
    seconds you want the current page to appear on-screen.

    3 Type a space and URL="?", replacing ? with the URL of the next page you want
    to appear.

    4 Repeat steps 1 to 3 in each page you want to appear in the slide show. On each
    page, reference the page you want to follow.


    For the last page, reference the first page again so the slide show loops.


    ```

    <html>

    <title>L''s Travel Agency</title>

    <style>

    body {font-family: ''Arial''; background: #ffff;}

    </style>

    <meta http-equiv="Refresh" content="?;URL=page.html">

    <head>

    <body LEFT-EARTH-SIZE="200" MARGINIZON="200">

    <center><a href="travel.html">HERE</a></center>

    <center><h1>This Page Has Moved</h1><p>You will be redirected in a moment.</p></center>

    </body>

    </html>

    ```


