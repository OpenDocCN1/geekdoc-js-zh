  md: '# Create Newspaper-Style Columns


    # Working with Tables


    You can use the table format to present columns of text on your Web page, much
    like a newspaper. For example, you may want to organize your text into two or
    three columns. Paragraphs of text are contained within each column.


    You can use the vertical alignment attribute to make each column align at the
    top of the table.


    # Create Newspaper-Style Columns


    +   Within the &lt;TR&gt; tags, use &lt;TD valign="top"&gt; to start the first
    column.


    Note: see the "Add Table" to learn how create a basic table.


    +   You can optionally specify a &lt;WIDTH attribute to contain a column''s width.


    +   Type your column width.


    +   Use &lt;/TD&gt; at the end of the text.


    +   Repeat steps 2 and 3 to add more columns and text.


    The Web browser displays the text as columns on the page.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_131_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_131_1.png)


