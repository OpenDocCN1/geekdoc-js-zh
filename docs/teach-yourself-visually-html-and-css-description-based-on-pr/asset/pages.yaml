  md: '# Understanding Table Structure


    HTML tables enable you to effectively present large amounts of data in rows and
    columns. You can also use tables to organize the overall structure of a Web page.
    For example, you can create a two-column table that organizes a list of navigational
    links in one column and the main text and image content in another.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_120_0.png)


    # Table Structure


    Every table is basically a rectangle containing rows and columns. The places where
    the columns and rows intersect are called cells. Each cell can hold Web page content.
    Using HTML attributes, you can set the size of an entire table as well as the
    size of particular cells. You can also turn borders of a table and its cells on
    or off, depending on whether or not you want to draw attention to the table''s
    structure.


    # Cell Spanning


    Cells can span two or more columns or rows to form bigger containers for data.
    For example, a table may include a title cell at the top that spans multiple columns
    across the table, or one that extends downward across several rows. When you span
    cells in a table, interior cell walls disappear to create larger cells.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_120_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_120_2.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Working with Tables chapter 7


    # Traditional Tables


    You can use traditional tables on a Web page to present data in a tabular format.
    For example, you might insert a table to hold a list of products or prices to
    display a class roster. You can set a fixed width and height for the table to
    make it fit in the rest of the page content.


    # Presentation Tables


    You can use a presentation-style table to display the content on the page in interesting
    ways. Instead of defining an exact size, you can specify a table size using percentages.
    Whenever the user resizes his browser window, the table resizes too. This allows
    for a more "liquid" layout. This type of table is good for page layouts as data
    tables.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_121_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_121_1.png)


    # Table Elements


    The building blocks of HTML tables are the <TABLE>, <TR>, and <TD> tags. The <TABLE>
    element defines the itself. The <TR> tag defines a table row. The <TD> defines
    the table data, or cell content. In addition to these codes, you can assign table
    headers, captions, and column groups. You can also create tables within tables,
    called nested tables.


    # Preparing to Create a Table


    Before you start the task of creating any kind of table, whether it is strictly
    for data or to control the page layout, start and sketch out what you want the
    table to look like and what type of data you want each cell to hold. A little
    planning beforehand can help you build your table faster and more accurately.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_121_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_121_3.png)


    107'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# # Add a Table


    You can insert a table onto your page to organize data or control the page layout.
    HTML tables are made up of cells arranged into rows and columns. You can assign
    different page elements to different cells to control the positioning of those
    elements on the page. Cells can hold text, images, and other Web page content.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_122_0.png)


    # Add a Table


    +   1 **<TABLE>** where you want to insert a table.


    +   2 **<TR>** to start the first row in the table.


    To make it easier to distinguish between rows, each row tag on a new line.


    +   3 **<TD>** for the first cell you want to create.


    +   4 Type the cell data.


    Notes: If you want your first row to hold bold column labels, use the <TH>-tag
    instead of <TD>. See the section "Add Column Labels" to learn more.


    +   5 **<TD>** to complete the cell.


    +   6 Repeat steps 1 to 5 to add cells.


    To make it easier to distinguish between cells, you can place each cell on a new
    line in your HTML document.


    +   7 **<TR>** at the end of the first row.


    ```

    <html>

    <head>

    <title>L''s Travel Agency: Geography Facts</title>

    </head>

    <body>

    <table border="1" color="green">Largest Countries by Area

    <tr>

    <td>Canada</td>\<td>9.98 million km</td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ```

    <html>

    <head>

    <title>L''s Travel Agency: Geography Facts</title>

    </head>

    <body>

    <table border="1" color="green">Largest Countries by Area

    <tr>

    <td>Canada</td>\<td>9.98 million km</td>

    </tr>

    </table>

    </body>

    </html>

    ```'
