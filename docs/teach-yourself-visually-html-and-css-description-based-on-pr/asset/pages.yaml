  md: '# # Adding Links


    * The link appears on the Web page.


    When the link is clicked, the browser may display the file in the browser window.


    **Note:** To open the file in a new window, see the section "Open a Linked Page
    in a New Window."


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_113_0.png)


    If the browser cannot open the file, A File Download box may appear that allows
    the user to download the file to his or her computer.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_113_1.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_113_2.png)


    # Can I include links to plain-text files?


    Yes, and most browsers will be able to open and display such files. Because plain-text
    files do not include HTML formatting, browsers display the text unformatted and
    without inline images or other features.


    # What happens if the user cannot download or open the file?


    If the user encounters problems accessing a non-HTML file, or if her browser or
    computer may display an error message. To help with any problems that might occur,
    but be sure to include information about the file format and size on the Web page;
    also include links to any tool that can help the user with the file. For example,
    if the link is a PDF file, include a link to the Adobe Web site where the user
    can download the Adobe Acrobat Reader, which can read PDFs.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_113_3.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_113_4.png)'
