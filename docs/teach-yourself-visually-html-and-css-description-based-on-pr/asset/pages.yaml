  md: '# # Add a Background Image to an Element


    You can add a background image to an element using a style sheet rule. To specify
    a background image, you must know the name and location of the image file. If
    the image is small, the browser repeats, or *tiles*, to fill the background area.
    You control the repeating using the **repeat** values.


    Be careful when assigning a background image; make sure any overlay text is legible
    over the background. You may need to change the text color. See the section "Add
    Color to Text" to learn more.


    # Add Background Image to an Element


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_228_0.png)


    +   1. Click inside the tag declaration and type **background:** and a space.


    +   2. Type url("")") and a space, replacing ? with the location and name of the
    image file you want to use as a background.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_228_1.png)


