  md: '# # Add Padding


    # ## Controlling Layout with Style Sheets


    You can use the padding property to add space around a Web element. Adding padding
    can be useful for making text readable when they are one another in a page layout.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_253_0.png)


    You can specify padding in points (pt), pixels (px), millimeters (mm), centimeters
    (cm), inches (in), picas (pc), x-height (xh), or em.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_253_1.png)


    +   1. Click inside the tag and type padding: a space.

    2. Type a value for padding:


    To add padding to one side, can you type padding-?, replacing with top, bottom,
    left, or right.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_253_2.png)


    The Web browser uses the assigned padding for the element to which it is applied.


    In this example, padding is assigned to the paragraphs on a page.


    In this example, borders are turned on. Padding spacing exists inside an element''s
    border.


    Note: see the section "Set Margins" to learn how to add spacing outside borders.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_253_3.png)


