  md: '# # Extend Cells across Columns and Rows


    You can create a larger cell in your table by extending the cell two or more columns
    or rows. The ability to span cells, also called merging cells, allows you to create
    unique cell structures within your table. For example, you might include a large
    cell across the top of a table to hold a heading or an image.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_140_0.png)


    # Extend Cells across Columns and Rows


    +   - Click the tag for the cell you want to extend across columns.

    - Type COLSPAN="? replacing ? with the number of columns you want to span.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_140_1.png)


    The Web browser displays the cell spanning the designated number of columns.


    +   - In this example, a heading column spans the top of the table.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_140_2.png)


    | Basel | Bern | Geneva | Zurich |

    |---|---|---|---||

    | Basel | | | | 21 |

    | Bern | 54 | 161 | 67 | 122 |

    | Geneva | | 94 | 07 | - |

    | Lausanne | | 188 | | - |

    | Zurich | 85 | 223 | 210 | - |'
