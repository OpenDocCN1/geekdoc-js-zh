  md: '# An Introduction to HTML


    You build Web pages using HTML, which is short for HyperText Markup Language.
    HTML documents are made up of text content and special codes known as tags that
    tell Web browsers how to display the content. HTML documents are identified by
    their .html or .htm file extensions.


    For the most part, HTML is platform independent, which means you can view Web
    pages on any computer operating system, including Windows, Mac, and Linux.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_20_0.png)


    # HTML Tags


    # Rendering HTML


    HTML consists of text interspersed with special instructions known as tags. Surrounded
    by brackets, <>, HTML tags tell a browser how to organize and present items, and
    other Web page content. Many tags are written using an opening tag and a closing
    tag that surround content that appears on the page. When writing HTML tags, you
    can use upper- or lowercase letters. To make the coding easy to distinguish from
    other text in the page, you can type tag names in uppercase. For details, see
    the section "Understanding HTML Syntax".


    When a browser displays a Web page, it retrieves the HTML file for that page from
    a server, parses the HTML to determine how the content should be formatted, and
    renders the page. The HTML tags tell the browser images, video, audio, and other
    content need to be downloaded and integrated into the page. The HTML may also
    tell the browser to download style sheets and interactive scripts to further enhance
    the page. To view the HTML underlying a Web page, see the section "View HTML Code
    in a Browser".


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_20_1.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Getting Familiar with HTML and Web Page Basics


    # HTML Standards


    The World Wide Web Consortium, 3C, is the primary group guiding the evolution
    of the HTML language. The W3C is made up of hundreds of companies and organizations
    including Web industry leaders as Microsoft, Apple, and Google. The standards
    developed by the W3C give developers of Web servers and browsers a set of common
    guidelines with which to develop products. You can visit the W3C''s Web site at
    www.w3.org.


    # HTML Versions


    The most recent version of HTML is 4.01, Version 4.01 includes rules for using
    more than 90 HTML tags, most of which are covered in this book. It improves over
    previous versions by adding better support for multimedia, scripting, and style
    sheets. Style is especially important because it allows developers to apply more
    formatting to Web pages. It also allows developers to keep complex styling information
    separate from the rest of the HTML. Style sheets are covered in Chapters 10, 11,
    and 12.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_21_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_21_1.png)


    # XHTML


    # Next Generation of HTML


    XHTML, or Extensible HyperText Markup Language, is an alternative language for
    coding Web pages that conforms to the stricter standards of XML, or Extensible
    Markup Language. XHTML is tag-based and uses many of the same tags as HTML. However
    in HTML, all tags must be closed, tag names and attributes must be in lowercase,
    and attribute values must be surrounded by quotes. Most modern browsers read both
    HTML and XHTML. Although XHTML is not covered in this book, you can read more
    about it at the W3C site at www.w3.org.


    As this book is being published, the W3C is developing the specification for HTML
    5, the next version of HTML. This version will introduce features to help developers
    more easily and maintain the main pages of today''s Web sites. HTML 5 will include
    tags for defining headers, footers, and navigation sections, along with tags for
    interactive elements such as editable and sortable tables. For more information,
    see www.whatwg.org/html.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_21_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_21_3.png)'
  merge: -1
