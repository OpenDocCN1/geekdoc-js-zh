    | ONMOUSEUP | User releases the mouse button |

    | ONMOUSEMOVE | User moves the mouse |

    | ONMOUSEOUT | User moves the mouse away from an element |

    | ONCLICK | User clicks an element |

    | ONDBLCLICK | User double-clicks an element |

    | ONKEYPRESS | User presses and releases a keyboard key |

    | ONKEYDOWN | User presses a key |

    | ONKEYUP | User releases a key |

    | ONSUBMIT | User clicks a Submit button |'
