  md: '# # Create an Banner


    # Adding Images chapter 5


    You can use banners at the top of your Web pages to advertise a product or service,
    or to give your Web site a consistent look and feel. You can use a GIF, JPEG,
    or PNG image as a banner.


    Full banners are typically 468 pixels wide and 60 pixels tall, but yours can be
    whatever size suits your page. When creating the banner size in a graphics-editing
    program, or you can set the image size using HTML coding. To learn how to set
    image height and width, see the "Specify an Image Size" earlier in this chapter.


    # Create an Image Banner


    +   1. At the top of the page, before any body text, type `<IMG SRC="` replacing
    ? with the path to the banner file you use.


    +   2. Type WIDTH="?" within the `<IMG>` tag, replacing 7 with a value in pixels.


    +   3. Type HEIGHT="?" within the `<IMG>` tag, replacing 7 with a value in pixels.


