  md: '# Controlling Layout with Style Sheets chapter 12


    # Positioning Content


    You can use different types of positioning to place the boxes of content on your
    pages. Relative positioning places content relative to the normal flow of the
    other content on the page. Absolute positioning places content on absolute points
    on the page relative to the containing block. Fixed positioning places content
    relative to the browser window and keeps it as a user scrolls.


    # Offsetting Content


    You can offset content on your Web page from its normal positioning using the
    top, left, right, and bottom style properties. This allows you to place content
    in a precise position within the browser window. You can place content completely
    outside of the browser window using a large or negative offset value. You can
    also overlap content in the browser window by placing an element at the same window
    coordinates as another element.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_243_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_243_1.png)


    # Padding and Margins


    You can control the space that surrounds content inside each box on your page.
    Space outside the edge of your box is known as margin, while space inside the
    edge of the box is called padding. Style sheets let you control space on the top,
    left, right, and bottom of the boxes independently. You can also turn on borders,
    which appear when the margin and padding meet.


    # Floating Content


    The float CSS property takes a box out of the normal flow of your page and moves
    it to the right or left side of the enclosing box. Content that follows wraps
    around the floated element. Floating allows you to align images, paragraphs, tables,
    and other content, similar to how you can align images using the align attribute
    in HTML.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_243_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_243_3.png)'
