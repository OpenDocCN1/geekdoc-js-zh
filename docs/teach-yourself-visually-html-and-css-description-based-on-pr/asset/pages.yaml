  md: '# # Troubleshoot\Your Web Pages


    No matter how carefully you create your pages, errors can creep in. If your Web
    page does not display properly in a browser, you must track down the problem.
    In most situations, you can trace the problem to a common coding error. If you
    cannot find the error even after a thorough check, try showing your document to
    another Web developer for feedback.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_322_0.png)


    # ## Typing Errors


    Typing errors are the most common mistakes in HTML documents. Web browsers ignore
    tags they do not recognize, so always start your troubleshooting process with
    a proofread of your document. Read each line in your document, paying close attention
    to tags and attributes. One missed character, quotation mark, or bracket can cause
    a browser to display broken content. Many Web editors color-code HTML tags to
    help you find such errors.


    # ## Invalid Paths


    Typing the wrong path to a file can cause an error on your pages. This can occur
    in hyperlinks, image and multimedia tags, and references to JavaScript and CSS.
    If a server cannot locate a file on the Web host, it cannot access or display
    the corresponding content. When page content does not appear as expected, double-check
    your text for the correct paths. It is also essential to use the correct file
    extensions when specifying files.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_322_1.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Publishing Your Web Pages chapter 15


    # Broken Links


    Even if the paths to your links are syntactically correct, that doesn''t guarantee
    that the corresponding server is still there. Nothing is more frustrating than
    Web visitors clicking a nonfunctioning link, so test your links on a regular basis.
    Because pages come and go on the Web, make it a regular practice to check your
    links.


    # Missing Image Files


    If the browser cannot display your images, you may have typed the wrong file name.
    Verify your image name, making sure you typed the correct upper- and lower case.
    It is also common to type the wrong file extension for an image file, as GIF instead
    of JPG. Remember, not all browsers support all kinds of image files. Be sure to
    stick with formats commonly used on the Web. See Chapter 5 to learn more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_323_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_323_1.png)


    # HTML Code Appears


    If the browser displays your HTML code instead of the Web page, you probably saved
    the document as a TXT file instead of an HTML file. Also double-check to see if
    your <HTML> tag appears at the top of the page. If this tag is missing, the browser
    may not read your page as an HTML document.


    # HTML Validators


    After you upload your pages, you can access an HTML validator and have it automatically
    download and process your page content. Because most validators reference the
    official HTML specification, they can point out syntax errors and tell you if
    you are coding to the latest official standard. The W3C, maintains HTML specifications,
    offers a validation service at /w3.org.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_323_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_323_3.png)


