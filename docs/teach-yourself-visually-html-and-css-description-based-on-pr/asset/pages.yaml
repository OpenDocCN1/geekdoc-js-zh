  md: '# Change the Text Color


    You can enhance your text by adding color. The COLOR attribute works with the
    <FONT> tag to change text on a page from default black to a color. You can specify
    the color using a hexadecimal value, or for common colors, the color''s name.


    Legibility is always a concern when it comes to applying attributes to text. Be
    sure to choose a color that is easy to read on a Web page. Use caution when applying
    colored text to a colored background. Always test your text to make sure the colors
    do not clash and your text remains legible.


    # Change the Text Color


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_72_0.png)


    # CHANGE A SECTION OF TEXT


    +   1 Type <FONT COLOR="?> in front of the text you want to change, replacing
    ? with the name or hexadecimal value of the desired color.


    This example shows the color name for red.


    +   2 Type </FONT> at the end of the text.


    +   The text appears in the designated color on the Web page.


    Note: To change the font color using the color property in CSS, see Chapter 11.


    ```

    <html>

    <head>

    <title>M and L''s Travel Agency</title>

    </head>

    <body>

    <center>

    <h1><FONT COLOR="red">M and L''s Travel Agency</FONT></h1>

    <p><center>We get you there!</p>

    <p>For more than 15 years, M and L''s Travel Agency has helped customers planning
    excursions to adventures around the world. We specialize in one of a kind vacation
    for all interests and budgets. Let us help you with your airline tickets, hotel
    bookings, and rental cars, either online or in person.</p>

    <p>Popular destinations:</p>

    <ul>

    <li>Giza, Egypt</li>

    <li>Mexico City, Mexico</li>

    <li>Paris, France</li>

    <li>Rome, Italy</li>

    <li>Athens, Greece</li>

    <li>Great Wall, China</li>

    </ul>

    </center>

