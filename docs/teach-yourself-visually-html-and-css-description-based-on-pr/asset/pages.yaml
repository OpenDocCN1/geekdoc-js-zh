    # Mount Everest


    At 29,022 feet, Mount Everest is the highest mountain on earth when measured from
    sea level to summit.


    Each year, hundreds of mountaineers climb the mountain, which is located in the
    Himalayan range on the border of Nepal and Tibet. Many climbers use bottled oxygen
    to compensate for the Himalayan air.


