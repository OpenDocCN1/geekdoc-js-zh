    +   8 Type </TITLE>.


    +   9 Press Enter


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_35_0.png)


    +   10 Type <HEAD>.


    This tag completes the document header information for the page.


    +   11 Press Enter


    Note: You do not need to press Enter time you start a new tag or add a closing
    tag. However, placing tags on their own can help make your code more readable.


    Note: Browsers ignore extra space in the code when rendering Web pages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_35_1.png)


    | Which should I add first to my HTML document, the HTML tags or the page content?
    | Does it matter if I type my tags in uppercase, lowercase, or mixed? |

    | It is easier to start your HTML document by typing the basic structural tags,
    which include the <HTML>, <HEAD>, and <body> tags. These tags appear in all HTML
    documents, and typing them first helps you find valid syntax and are in the correct
    order. After you add the basic structural tags, you can add the body content and
    additional HTML tags to format that content. | No. The current HTML standard allows
    for different cases in your HTML text. However, it is good form to format your
    HTML consistently. Also, typing tags in uppercase letters makes it easier to distinguish
    HTML code from the page content and identify errors in your code.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_35_2.png)


    continued 21'
