- img_proc: true
  md: '# APPLY THE DIV TAG


    # Creating Style Sheets


    +   1 In the HTML document, click in front of the section which you want to assign
    a DIV tag and add a line.


    ```

    &lt;div class="?"&gt;

    ```


    +   2 Type &lt;div class="?"&gt;, replacing 2 with the DIV class name.


    ```

    &lt;div class="?"&gt;

    &lt;span class="?"&gt;Located in the Peruvian Andes, the ancient Inca city of
    Machu Picchu was constructed in the 15th century. It was abandoned after the Spanish
    conquest until 1911 when American explorer Hiram Bingham first visited it. Today,
    Machu Picchu is the most visited attraction in Peru.

    &lt;/span&gt;

    &lt;/div&gt;

    ```


    +   3 Type &lt;/div&gt; at the end of the section.


    ```

    &lt;div class="?"&gt;

    &lt;span class="?"&gt;Located in the Galicia region of northern Spain, Santiago
    de Compostela is one of the most famous pilgrimage routes in the world. Each year,
    thousands of Christians pilgrims walk to the city to pay respects to the tomb
    of St. James. In the great cathedral, legend has it, the remains of St. James
    are buried.

    &lt;/span&gt;

    &lt;/div&gt;

