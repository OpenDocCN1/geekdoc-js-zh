  md: '# Change Bullet or Number Styles


    You can use the list-style property to change the bullet or number style for your
    unordered lists. You can choose from three bullet styles and five number styles.


    Bullets come in three styles: circle, disc, and square. Disc is the default bullet
    style. Numbers can be decimal (1, 2, 3), lower-alpha (a,b), upper-alpha (A, B,
    C), lower-roman (i, ii, iii), and upper-roman (I, II, III). The default number
    style is decimal.


    # Change Bullet or Number Styles


    # CHANGE THE BULLET STYLE


    +   1 Click inside the UI declaration and type list-style: followed by a space.


    +   2 Type the bullet style you want to apply (circle, disc, or square).


    > Note:To learn more about creating lists, see Chapter 3.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_236_0.png)


    The Web browser displays the bullet style you specified in the style rule.


