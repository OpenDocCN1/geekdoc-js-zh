  md: '# # Understanding Script Events and Handlers


    When you use JavaScript to add interactivity to your pages, it helps to understand
    when and why a script executes. Some scripts run as soon as the page downloads,
    while others require an action on the part of the Web page visitor. As the site
    developer, you decide when and how a script executes. You can use events and event
    handlers to control it.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_268_0.png)


    # Script Events


    Script events are any actions taken by a Web page visitor, such as clicking on
    an area of the page. The browser can also cause an event, such as loading a page,
    to occur. For example, mouse events are actions a user performs with a mouse,
    such as clicking, moving the mouse pointer over an object, and releasing the mouse
    button after clicking it. Keyboard events include key presses on a keyboard.


    # Event Handlers


    You can determine what happens after an action by specifying an event handler.
    Event handlers associate an object or Web page element with an event. For example,
    you can use the ONCLICK event handler to associate a Web page button with a mouse
    click. Event handlers are not added using the <SCRIPT> tags but rather, appear
    within HTML element tags.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_268_1.png)'
  merge: -1
  pgno: 268
