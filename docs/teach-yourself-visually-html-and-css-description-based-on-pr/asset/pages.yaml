  md: '# Understanding Frames


    We use frames to divide your Web page into sections and allow users to access
    different pages in your Web site from one screen. Although frames are not as widely
    used as they once were, they can still serve as a valuable tool to help you create
    a dynamic structure for your Web site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_156_0.png)


    # Frame Basics


    Browser windows are typically made up of a single frame displaying a single HTML
    document. If a page''s content exceeds the size of the frame, scroll bars appear
    allowing the user to view different parts of the page. With multiple frames, the
    browser window displays several HTML documents at one time, each frame acting
    as a separate screen. Each frame can have its own scroll bars allowing users to
    view different portions of the Web page appearing within the frame.


    # Ways to Use Frames


    You can find numerous uses for frames with a multipage Web site. You can use frames
    to display a fixed page at the top of the screen and a scrollable page in the
    remainder of the screen. For example, you might use a navigation page at the top
    with links to pages on your site. When a user clicks a link in the top frame,
    the frame below displays the content. Or you might use side-by-side frames to
    display a picture in one frame and text next.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_156_1.png)


    142'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Working with Frames


    # Frame Advantages


    When deciding whether to use frames in your Web site, take time to examine the
    pros and cons of frames. On the pro side, frames are helpful with larger sites,
    especially when you want to contain certain information in view at all times.
    Frames offer a great way to display a navigation bar in one location without needing
    to include navigational links on every page in your site. Frames can make it easier
    for users to navigate a large Web site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_157_0.png)


    # Frame Disadvantages


    On the con side, users might not see your frame content as you envision; monitor
    resolution settings vary, and what you think is the perfect size for a frame may
    not be on another user''s screen. On the Web page, not all page contents look
    good smaller frames. Although newer browsers support the use, older versions do
    not. You may need to design a nonframe version of your site to accommodate frames
    without frame support. Frames can complicate HTML page coding, and when they are
    not working properly they can cause frustration. For example, if users are unable
    to view all of the links in a navigation-oriented frame, they may not be able
    to reach certain pages in your Web site.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_157_1.png)


    # Framesets and Frames


    You use several HTML documents to create frames in a Web site. A frameset document
    defines the overall frame architecture, including the number, size, and organization
    of frames. You also need a separate HTML page for each frame. You can save the
    frameset document as a separate file and link the pages to the frame structure.
    See the section "Create Frames" to learn how to make a frameset document.


    # Nested and Inline Frames


    If your Web site requires a more complex frame structure, you can nest a frameset
    within the original frameset. This gives you the flexibility of dividing a frame
    into more frames. See the section "Create a Nested Frameset" to learn how to do
    this. You can also insert an inline frame within any Web page on your site without
    needing to define a frameset document. See the section "Create an Inline Frame"
    to learn more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_157_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_157_3.png)'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Create Frames


    You can use frames to divide the Web browser into panes. This allows you to display
    different pages in the browser window at the same time. For example, you might
    use one frame to display a navigational page that lists links to different pages
    on your Web site and show the result of a click link in another frame.


    You can use the <FRAMSET> and <FRAME> tags to define the frame structure. The
    <FRAMSET> creates a frameset, dividing the window into sections, while the <FRAME>
    tag specifies which page goes into which frame.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_158_0.png)


    # Create Frames


    +   1 Create and save a new HTML document, including only the basic <HTML>, <HEAD>,
    and <TITLE> tags.


    Note: Learn how to create HTML documents, see Chapter 2.


    +   2 Below the </HEAD> tag, type <FRAMSET and a space.


    ```

    ```html

    <HTML>

    <HEAD>

    <TITLE>System and L''s Travel Agency</TITLE>

    </HEAD>

    <FRAMSET ROWS="160,*">

    <FRAME>

    </FRAMSET>

    </HTML>

    ```

    ```


    +   3 Define the frameset to include two or more rows or columns and specify a
    size in pixels for the rows or columns.


    To create frames in rows, type ROWS="?", replacing ? with the height of each row
    in your frameset.


    To create frames in columns, type COLS="?", replacing ? with the width of each
    column in your frameset.


    You also set a row or column size by a percentage by typing the value followed
    by a percentage sign, such as 30%.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_158_1.png)


    144'
