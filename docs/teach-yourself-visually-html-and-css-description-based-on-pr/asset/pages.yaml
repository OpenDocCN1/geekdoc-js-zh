  md: '# Save an HTML Document


    You can save your Web page as an HTML file so that users can view it in a Web
    browser. When saving a Web page, you can use either the .html or .htm extension.


    When naming a Web page, it is best not to use spaces and keep the characters limited
    to letters, numbers, hyphens (-), and underscores (_). If you are creating a home
    page for a Web site, it is common to name the page index.html or default.htm.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_38_0.png)


    # Save an HTML Document


    +   1. Click File.

    Note: Your text editor may have a different command name for saving files. See
    your program''s documentation for more information.

    2. Click Save.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_38_1.png)


    The Save As dialog box appears.


    +   3. Click here to navigate to the folder or drive where you want to store the
    file.

    4. Click here and select Text Document.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_38_2.png)'
  merge: -1
  pgno: 38
