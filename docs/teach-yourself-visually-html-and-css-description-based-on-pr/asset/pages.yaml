  md: '# # Link to an Area

    on the Same Page


    You can also link to pages that take

    t user to another place on the same

    page. This is particularly useful for longer

    ddocuments. For example, you can

    links that take the user to different

    headings in your document.


    To link to places on the same page, you must assign names

    to the areas to which you want to link. You can do this

    with the anchor tag (&lt;a&gt;) and the name attribute.

    signed assignments are called named anchors.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_110_0.png)


    # Link to an Area on the Same Page


    +   Click in the front of the section

    to which you want to create a link

    and type "&lt;NAME&gt;?"

    replacing ? with a unique name

    for the area.


    It is best to keep your names

    short and simple, using only

    letters and numbers.


    +   Type &lt;/A&gt; at the end of the

    section.


    | NAME AN AREA |

    |--- |


    ```

    &lt;html&gt;

    &lt;h3&gt;&a name="&quot;Everest&quot;"&gt; Everest&lt;/h3&gt;

    &lt;p&gt;At 29,032 feet, Mount Everest is the highest mountain on earth

    located in the Himalayas range of Tibet. Hundreds of

    climbers visit each year. They use bottled

    oxygen to reach the summit.&lt;/p&gt;

    &lt;a name="&quot;Machu Picchu&quot;"&gt;Machu Picchu&lt;/a&gt;

    &lt;p&gt;Located in the Peruvian Andes, the ancient city of Machu

    Picchu was built by the Inca Empire. It was

    abandoned 100 years later when the Inca Empire

    collapsed during the Spanish conquest. Machu Picchu is the most

    visited tourist attraction in Peru.&lt;/p&gt;

    &lt;a name="&quot;Santiago de Compostela&quot;"&gt;Santiago de Compostela&lt;/a&gt;

    &lt;p&gt;Located in the Galicia region of northern Spain, Santiago

    de Compostela is the shrine of St. James. Each year, tens of thousands

    ofilgrims walk along the Camino de Santiago, which

    spend weeks or months traveling by foot, bike, and even

    on donkey to reach the cathedral where St. James is buried.

    cathedral, legend has it, the remains of St. James are buried.&lt;/p&gt;

    &lt;/html&gt;

    ```


