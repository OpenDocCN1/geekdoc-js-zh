  md: '# Add Underlining to Text


    You can add underlining to your text for added emphasis. For example, you might
    underline a term or an important name.


    Use caution when applying underlining to Web pages because some users may mistake
    the underlined text for a hyperlink. See Chapter 6 to learn more about using links
    in Web pages.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_68_0.png)


    # Add Underlining to Text


    +   1. <U> in front of the text you want to underline.

