  md: '# # Creating Style Sheets


    # 6 Repeat steps 2 to 5 to continue adding style rules to your internal style
    sheet.


    ```

    <html>

    <head>

    <title>I''s Travel Agenda</title>

    <style>

    body { font-family: Arial, sans-serif; font-style: italic; }

    h1 { color: #666666; }

    </style>

    </head>

    <body class="">

    <img src="Machu_Picchu.jpg" alt="Machu Picchu">

    <p>The ancient city of Machu Picchu was constructed in the 1400s at the height
    of the Inca Empire. It was abandoned less a century later. Today Machu Picchu
    is the most visited tourist attraction in Peru.</p>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_207_0.png)


    # 7 Add a new line and type <STYLE>-


    You can save your page and test it in a browser to see the results.


    Note: To learn more about viewing HTML documents in a browser, see Chapter 2.


    ```

    <html>

    <head>

    <title>I''s Travel Agenda</title>

    <style>

    body { font-family: Arial, sans-serif; font-style: italic; }

    h1 { color: #666666; }

    </style>

    </head>

    <body class="">

    <img src="Machu_Picchu.jpg" alt="Machu Picchu">

    <p>The ancient city of Machu Picchu was constructed in the 1400s at the height
    of the Inca Empire. It was abandoned less a century later. Today Machu Picchu
    is the most visited tourist attraction in Peru.</p>

    </body>

    </html>

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_207_1.png)


    # Do all browsers recognize style sheets?


    Some older browsers do not support style sheets, so they ignore the <STYLE> tags.
    However, the content inside is not ignored in these browsers, so any code you
    type between the <STYLE> tags appears on the page. You can prevent an older browser
    from displaying style tag by typing <!-- and before after the style rules.


    # Can I link another Web page to my internal style sheet?


    No. a page cannot access another page''s internal style sheet. If you want Web
    pages to track a set of style rules, you must define those in an external sheet
    and link the pages to the sheet. An internal style sheet is useful only if you
    want to apply those styles to a single HTML document. See the section "An External
    Style Sheet" to learn more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_207_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_207_3.png)'
