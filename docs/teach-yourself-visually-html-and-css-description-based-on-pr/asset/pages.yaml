    +   4 Open the HTML document in a Web browser.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_211_0.png)


    Note: To learn about viewing an HTML document in a browser, see Chapter 2.


    +   The Web browser applies the style to the HTML section.


    # L''s Travel Everest


    Mount Everest: Mount Everest is the highest mountain on earth when measured from
    sea level. It is located on the border of Nepal and China. Thousands of climbers
    use bottled oxygen to compensate for the thin Himalayan air.


    # Machu Picchu


    Machu Picchu: The ancient Inca city of Machu Picchu was constructed in the 15th
    century. It was abandoned after the Spanish conquest until 1911 when American
    explorer Hiram Bingham first visited it. Today, Machu Picchu is the most visited
    attraction in Peru.


    # Santiago de Compostela


    Santiago de Compostela: Located in the Galicia region of northern Spain, Santiago
    de Compostela is one of the most famous pilgrimage routes in the world. Each year,
    thousands of Christians pilgrims walk to the city to pay respects to the tomb
    of St. James. In the great cathedral, legend has it, the remains of St. James
    are buried.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_211_1.png)


    # How do I format text within a paragraph or other section?


    You can use the &lt;span&gt; to apply formatting to a text in an HTML document.
    Unlike the &lt;div&gt;, the &lt;span&gt; is an inline tag; it does not add line
    breaks before and after the text.


    +   1 Define a class for the &lt;span&gt; tag.


    +   2 Before the text you want to format, &lt;span class="?"&gt;, replacing 2
    with the class name.


    +   3 After the text you want to format, use &lt;/span&gt;.


