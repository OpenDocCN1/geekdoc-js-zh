  md: '# About the Authors


    Mike Wooldridge is a user-interface designer based in the San Francisco Bay Area.
    He has been building Web sites with HTML since 1995.

    Linda Wooldridge is a former senior editor at Macworld. She is the coauthor of
    Teach Yourself Visually Photoshop Elements 6 and other books in the Visual series.


    # Authors’ Acknowledgements


    Mike and Linda thank Jody Lefever for assigning them the book, Jade Williams for
    managing the project, Namir Shammas for his technical editing, Kim Heusel for
    his copiediting, and Ronda David-Burroughs and Cheryl Grubbs for their artistic
    creations. Mike and Linda dedicate the book to their eight-year-old son, who enjoys
    surfing the Web and blogging.'
