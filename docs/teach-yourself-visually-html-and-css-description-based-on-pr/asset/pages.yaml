    # Can I embed any YouTube video in my page?


    When you put a video on YouTube, you can control whether that video can be embedded
    on other pages. The embed feature only works for videos that have the embedded
    setting turned on.


    # How do I change the dimensions of the video?


    You can change the dimensions of an embedded video by changing the WIDTH and HEIGHT
    attributes in the embedded code. For compatibility with the most browsers, remember
    to change the WIDTH and HEIGHT attributes in both the OBJECT tag and the EMBED
    tag.'
