  md: '# # Change Table Alignment


    You can control the positioning of a table on your Web page using the ALIGN attribute.
    You can use this attribute to center a table or align it on the left or right
    side of the page. The ALIGN attribute also determines the way in which text wraps
    around your table element. For example, if you align the table to the right, text
    wraps around the left side of the table.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_150_0.png)


    # # Change Table Alignment


