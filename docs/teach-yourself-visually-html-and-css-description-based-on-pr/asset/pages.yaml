    Java applets are programs written in the Java programming language.


    Many Java applets are available for downloading on the Web. The Java Boutique
    (www.javboutique.com) and JavaShare.com (www.javashare.com) are good places to
    start. You can also conduct a Web search to find free Java applets.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_297_0.png)


    # Add a Java Applet


    +   1. Click where you want to insert the applet and type CODE="?", replacing
    ? with the location and name of the applet.


    +   * Optionally, to control the size of the applet window, type WIDTH="?" HEIGHT="?"
    within the <APPLET> tag, replacing ? with width and height values.


    +   * You can also add alternative text for browsers that do not run Java applets.


    +   2. Type <APPLET>.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_297_1.png)


