    of the Seven Wonders located near Cairo. It is the only surviving ancient man-made
    structure that has stood for over 4,500 years and has been built as a tomb for
    the Fourth Dynasty Egyptian pharaoh Khufu.


    # Great Wall


    The Great Wall of China is made of stone and earth structures to protect the northern
    borders of the Chinese Empire over many centuries. It stretches over 4,000 miles
    along the southern edge of Mongolia. As for, the Great Wall was built to protect
    China from nomadic invasions. The structure in fact is not visible from space
    according scientific calculations


