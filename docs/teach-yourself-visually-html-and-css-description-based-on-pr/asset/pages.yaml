  md: '# Change the Text Case


    You can use the text-transform property to change the text case for a tag. For
    example, you may want all <H2> text to appear in all capital letters. The property
    controls how the browser displays the text regardless of how it was typed.


    You can choose from four cases: capitalize, uppercase, lowercase, and none. Use
    the capitalize value if you want the first character of each word to be capitalized.
    Use the none value to leave text as is. The none value cancels any case the text
    may have inherited.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_222_0.png)


    # Change the Text Case


    +   1 Click inside the tag declaration and type text-transform: and a space.


    +   2 Type a text case value (capitalize, uppercase, lowercase, or none).


    Note: To learn more about writing style sheets and rules, see Chapter 10.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_222_1.png)


    The Web browser assigns the text case to the content.


    +   In this example, text within the <H2> tags is displayed in uppercase letters.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_222_2.png)


