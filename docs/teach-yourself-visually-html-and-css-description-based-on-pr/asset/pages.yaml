  md: '# CUSTOMIZE A BUTTON


    # Formatting Text with Style Sheets


    +   In your style type, INPUT? replacing ? with a unique name for your button.


    Note: for details about creating a CSS class, see Chapter 10.


    +   Type a color declaration to set the color of the label text.


    +   Type a background declaration to set the background color of the button.


    +   Inside the INPUT tag for the button, type CLASS="", replacing ? with class
    name.


    +   The Web browser applies the new style to the form button.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_239_0.png)


    # Can I customize a form menu using style sheets?


    Yes. You can customize menus in HTML forms similar to how you customize text fields.


    +   In your style type, SELECT? replacing ? with a unique name for your menu class.


    +   Inside the {}, type a height declaration to set the height of the menu.


    +   Inside the tag, type a font-size declaration to set the size of the font in
    the menu options.


    +   Inside the SELECT tag for the menu, type CLASS="", replacing ? with the class
    name.


    +   The Web browser applies the new style to the form menu.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_239_1.png)'
