  md: '# # Controlling Layout with Style Sheets


    +   After the `&BODY;` HTML document and before the main page content, type `&DIV;`.


    +   Inside the `&DIV;` tag, type the attribute `ID="?`, replacing with the ID
    name from step 2.


    +   After the main page content and before the `</BODY;` tag, type `</DIV;`.


    The Web browser displays the content in a fixed-width style in the center of the
    window.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_257_0.png)


    # How can I make my page content flush with the edges of the browser window using
    CSS?


    By default, Web browsers add some space between the page content and the edge
    of the browser window. To remove this space using style sheets, follow these steps:


    +   Create a style declaration for the BODY tag.


    +   Add the style rule: margin: 0px to the declaration.


    The Web browser removes the space between the page content and the edges of the
    browser window.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_257_1.png)'
