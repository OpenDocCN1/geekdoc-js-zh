  md: '# # Add a Table Caption


    # # Working with Tables chapter 7


    You can add a caption to your table to help users identify the information contained
    within the table. Table captions can appear at the top or bottom of the table.
    By default, captions appear above the table unless you specify another alignment
    attribute. Captions always appear on a separate line from the table.


    You can format your caption text using the HTML formatting tags. See Chapter 4
    to learn more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_133_0.png)


    # Add a Table Caption


    +   1 Add a new line directly below the `<CAPTION>` tag.


    Note: see the section "Add a Table" to learn how to create a basic table.


    +   2 Type `<CAPTION>` To place the caption below the table, type ALIGN="bottom"
    within the `<CAPTION>` tag.


    +   3 Type the caption text.


    +   4 Type `<CAPTION>` at the end of the caption text.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_133_1.png)


    The web browser displays the caption above or below the table.


