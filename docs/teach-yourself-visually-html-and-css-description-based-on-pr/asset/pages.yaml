  md: '# Target a Link


    You can make links on your pages open content in specific frames. To target links
    to particular frames, you must identify each frame with a unique name and reference
    that name with the <a> tag''s TARGET attribute. You can also open a page into
    the entire browser window using a TARGET value of “top”. This breaks the user
    out of the current frameset.


    To learn how to assign names to frames, see the section "Create Frames".


    # Create a Link


    # OPEN IN A FRAME


    +   1. Open the HTML file where the link should appear.


    +   2. Type <A HREF="?"> replacing ? with the target page.


    +   3. Type a space and TARGET="?">, replacing ? with the frame name.


    Note: To name frames, see the section "Create Frames".


    +   4. Type the link text.


    +   5. Type <A>.


    +   6. The browser displays the link.


    +   7. When the user clicks the link, the page opens in the frame you specified.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_166_0.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_166_1.png)


