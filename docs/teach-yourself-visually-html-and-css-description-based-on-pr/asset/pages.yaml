    # What size should I set for a Web page image?


    The best size for an image depends on how you want to use it on the Web page.
    The vast majority of users access pages with monitors set at 800 pixels in width
    and 600 pixels in height. In these settings, browsers can easily display images
    that are 750 pixels in width and 400 pixels in height without requiring the user
    to scroll. Making your images smaller decreases download time and allows users
    to see more than one image at a time, depending on the layout.


    # Is it better to resize an image in an editing program or using HTML coding?


    Resizing images using HTML can reduce the quality of your images, especially if
    you use HTML to enlarge them. Also, shrinking an image using HTML doesn''t actually
    reduce its file size, which means it won''t download anything faster. For these
    reasons, it is better to resize images using an image editor. This allows you
    to maintain an image''s quality and optimize its file size.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_87_3.png)'
