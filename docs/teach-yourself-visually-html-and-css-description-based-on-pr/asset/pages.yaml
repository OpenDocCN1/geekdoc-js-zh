- img_proc: true
  md: '# Start an HTML Document (continued)


    You can use the body tags, <BODY> and </BODY>, to define the content in your Web
    page. Page content can include lines of text, bulleted and numbered lists, tables,
    forms, and more.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_36_0.png)


    # Start an HTML Document (continued)


    +   12 Type <BODY>.


    This tag marks the beginning of the actual content of your Web page.


    +   13 Press Enter.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_36_1.png)


    +   14 Type the body text you want to appear on the page.


    Body text is the content that appears in the browser window. For practice, you
    can type a simple paragraph for the body text.


    +   15 Press Enter.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_36_2.png)'
