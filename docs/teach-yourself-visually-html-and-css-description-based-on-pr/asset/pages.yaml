  md: '# Create a Form


    You can use a form to gather information from the people who visit your Web site.
    To create a form, you use the <FORM> tag to point to a CGI script that will process
    the form, define the form elements, and display a Submit button to send the data
    to the script.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_178_0.png)


    # Create a Form


    +   Click where you want to insert a form and type <FORM METHOD="2"> replacing
    with post or get.


    The type of method to use can depend on the information you are collecting or
    the script that processes the data.


    If you are including a file upload in your form, use the post method.


    +   Type a space and ACTION="?", replacing "?" with the name and location of the
    CGI script you want to process the data.


    Note: You may need to contact your Web host to determine the name and location
    of the CGI script.


    +   Type </FORM>


    You can now add elements to your form between the <FORM> and </FORM> tags.


    Note: See the remaining sections in this chapter to learn more about adding input
    elements.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>I''m and L''s Travel Agency</title>

    </head>

    <body>

    <input type="text" name="name" size="2">

    <textarea name="customer" rows="4" cols="20"></textarea>

    <p>tell us about yourself so we can help you with your needs.</p>

    <form method="post" action="cgi-bin/customer.cgi">

    <input type="submit" value="Submit">

    </form>

    </body>

    </html>

    ```


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>I''m and L''s Travel Agency</title>

    </head>

    <body>

    <input type="text" name="name" size="2">

    <textarea name="customer" rows="4" cols="20"></textarea>

    <p>tell us about yourself so we can help you with your needs.</p>

    <form method="post" action="cgi-bin/customer.cgi">

    <input type="submit" value="Submit">

    </form>

    </body>

    </html>

    ```


