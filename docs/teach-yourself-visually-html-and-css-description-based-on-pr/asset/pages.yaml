  md: "# # Assign a Table Border\n\nTable borders make your cells easier to distinguish\
    \ and give the table a visible structure on a page. A border is a simple line\
    \ that appears around the table as well as around each cell within the table.\
    \ By default, a table does not have a border unless you specify one. You can use\
    \ the BORDER attribute to turn borders on or off.\n\nWhen you set a border thickness,\
    \ it applies only to the outer edge of the table, not to the cells within the\
    \ table. Border thickness is measured in pixels. Borders appear gray unless you\
    \ specify a color. See the section \"Adjust Cell Padding and Spacing\" to learn\
    \ how to control interior borders.\n\n![](img/a5fa3070a8ca2e193a37b457edb4b0f7_124_0.png)\n\
    \n+   1. In the &lt;TABLE&gt; type BORDER=\"&quot;, replacing with the value for\
    \ the border thickness you want to set.\n\n# Assign a Table Border\n\nNote: See\
    \ the section \"Add a Table\" to learn how to create a basic table.\n\n+   2.\
    \ To set a border color, type BORDERCOLOR=\"&quot;?&quot; in the &lt;TABLE&gt;\
    \ tag, replacing ? with the value you want to apply.\n\n```\nTable Borders.html\
