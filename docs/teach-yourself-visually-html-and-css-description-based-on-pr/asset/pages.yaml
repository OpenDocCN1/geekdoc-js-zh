  md: '# # Align an Image Vertically


    You can use the alignment attributes to control the vertical positioning of an
    image on a page relative to text that follows it. The alignment attributes are
    top, middle, and bottom.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_92_0.png)


    # ## Align an Image Vertically


    +   * Click inside the &lt;IMG&gt; tag and type ALIGN="?", replacing with the
    alignment you want to apply, either middle, top, or bottom (the default).


    If the image shares the same line as text, the alignment attribute controls the
    position of the image relative to the text.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_92_1.png)


    The Web browser aligns the image as specified.


    +   * In this example, the image is middle-aligned with existing text.


    > Note: For greater control over image alignment, consider placing your images
    in tables. Learn more about tables in Chapter 7.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_92_2.png)


