  md: '# Hide Script


    You can hide your JavaScript coding from older Web browsers. Ordinarily, if a
    browser does not support JavaScript, it displays its script coding on the Web
    page instead of activating it. To prevent this from happening, you can hide the
    script using the comment tags.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_272_0.png)


    # Hide JavaScript


    +   1 Type <!-- - directly after the opening <SCRIPT> tag.


    ```

    ```html

    <html>

    <head>

    <title>Inca and L''s Travel Agency: Destinations</title>

    <body style="font-family: Arial; font-size:12px;">

    <script language="text/javascript">

    document.write(new Date());

    </script>

    <br>

    <table align="center" width="500">

    <tr>

    <td align="center" font-family="Arial;">Machu Picchu</td></tr>

    </table>

    <p>Located in the Peruvian Andes, the ancient Inca city of Machu Picchu was abandoned
    in the 1400s years later when the Inca Empire was invaded by Spanish conquest.
    Today, Machu Picchu is the most visited tourist attraction in Peru.</p>

    </body>

    </html>

    ```

    ```


    +   2 Type //--> directly before the closing </SCRIPT> tag.


    If an older browser does not read scripts your page, it will not display the script
    coding on the page.


    ```

    ```html

    <html>

    <head>

    <title>Inca and L''s Travel Agency: Destinations</title>

    <body style="font-family: Arial; font-size:12px;">

    <script language="text/javascript">

