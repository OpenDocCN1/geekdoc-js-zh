  md: '# Apply a Style Locally


    You can apply a style to a single instance of a tag in your document using an
    HTML attribute. The STYLE attribute allows you to apply a style rule to a tag
    without having to define the rule separately in an internal or external style.


    When you apply a style locally, it overrides any styles found in internal or external
    styles for the same tag. Applying styles works best for one-time changes. You
    should use internal or external styles for styles you plan to apply more than
    once.


    # Apply a Style Locally


    +   1. Click the tag for the element you want to change and type STYLE="style?",
    replacing ? with the style declarations you want to assign.


    Separate multiple declarations with semicolons.


    Note: To learn more about writing style rules, see Chapter 11.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_212_0.png)


    +   2. Open the HTML document in a Web browser.


    Note: To learn about viewing an HTML document in a Web browser, see Chapter 2.


    +   The web browser applies the style to the tag.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_212_1.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# # Apply a Style Using the ID Attribute


    You can use the ID attribute to assign a style rule to an individual Web page
    element. IDs are like classes except that classes can be associated with multiple
    elements on the page.


    If you want to assign a style rule to more than one element of the same tag, use
    a class instead. See the section "Create a Class" to learn more.


    # Apply a Style Using the ID Attribute


    +   1. Open your external style sheet or scroll to your internal style sheet.


    +   2. Type the tag to which you want to assign an ID.


    +   3. Type #?, replacing it with the ID name.


    +   4. Type a name and define the style rule.


    +   5. In the element for which you want to create a style rule, type ID="?, replacing
    it with the ID.


    The style is applied.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_213_0.png)


    ```

    <HTML>

    <head>

    <title>L''s Travel Agency</title>

    <body style="font-family:Arial; font-size:12px;">

    <h1 id="l-travel-agency">L''s Travel Agency</h1>

    <p id="trips">More than 15 years, L''s Travel Agency has been helping travelers
    around the world. We specialize in one-of-a-kind vacation packages for all interests
    and budgets. We also offer airline tickets and car rentals, online or in person.</p>

    <p id="everest">At 8,848 meters, Mount Everest is the highest mountain on the
    world. It is located in the Himalayas on the border of Nepal and Tibet. Many climbers
    use bottled oxygen to compensate for the high altitude.</p>

    <h2 id="machu-picchu">Machu Picchu</h2>

    <p class="special">Located in the Peruvian Andes, the ancient Inca city Machu
    Picchu was built at the height of 2,430 meters. Today Machu Picchu is one of the
    most visited tourist attractions in the world.</p>

    <h2 id="santiago">Santiago de Chile</h2>

    <p>Located in the Galicia region of northern Spain, Santiago de Chile is the</p>

    </body>

    </HTML>

    ```'
