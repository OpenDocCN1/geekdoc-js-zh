    # ## L''s Travel Agency


    For more than 10 years, L''s Travel Agency has helped clients plan exciting adventures
    around the world.


    We specialize in a variety of vacation packages for all interests and budgets.
    Let us help you with your travel arrangements, hotels, and other travel-related
    services.


    Here are some of our featured destinations:


    ### Machu Picchu

    In the Peruvian Andes, the ancient city of Machu Picchu was constructed in the
    15th century. It is located at 2,430 meters above sea level and remained hidden
    from Spanish conquest for centuries. Today Machu Picchu is the most visited attraction
    in Peru.


    ### Mount Everest

    Mount Everest is the highest mountain on the world when measured from sea level
    to summit. Each year, hundreds of mountaineers climb the mountain, which is located
    in the Himalayas range between Nepal and Tibet. Many climbers use oxygen bottles
    to compensate for the Himalayan air. Read more...


    Everest.com Communications


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_159_2.png)


    Do I need to declare a frameset document for my framed pages?


    It is good practice to include declaration in your pages. You can specify that
    your frameset is of type at the top of your HTML code. The declaration might look
    like this:


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/REC-html140/frameset.dtd">

    ```


    See Chapter 2 to learn more about document declarations.


    Do I have to specify a row height or column width for each frame?


    Yes, but the height or width can be a wildcard. After you define the first frame,
    you can use an asterisk (*) to assign the remaining space to other frames. For
    example:


    ```

    <FRAMET ROWS=",65,*,60>

    ```


    In this frameset, the middle frame is sized to take up whatever space remains
    after the two frames are sized.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_159_3.png)'
