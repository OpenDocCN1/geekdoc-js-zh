  md: '# # Use Fixed Positioning


    You can apply fixed positioning to an element at exact coordinates on a page and
    have it remain while a viewer scrolls. This is one way to keep navigation links
    visible as visitors view on a long page.


    You can also fix content on your Web pages by putting it in a frame. See Chapter
    8 for more frames.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_250_0.png)


    # ## Use Fixed Positioning


    +   - Click inside the tag declaration and type position: **fixed**.


    In this example, fixed positioning is applied to a body of navigation links using
    a DIV and ID attribute.


    > Note: for about using the DIV and ID attribute, see Chapter 10.


    Click inside the tag declaration and type left: **7,** replacing with the element
    you want to remove from the element.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_250_1.png)


    ```

    &lt;html&gt;

    &lt;head&gt;

    &lt;title&gt;Destinations&lt;/title&gt;

    &lt;/head&gt;

    &lt;body style="position:fixed;width:600px;height:600px;left:100px;top:20px;"&gt;

    &lt;h1&gt;Destinations&lt;/h1&gt;

    &lt;ul&gt;

    &lt;li&gt;&lt;a href="europe.html"&gt;Europe&lt;/a&gt&lt;/li&gt;

    &lt;li&gt;&lt;a href="asia.html"&gt;Asia&lt;/a&gt&lt;/li&gt;

    &lt;li&gt;&lt;a href="africa.html"&gt;Africa&lt;/a&gt&lt;/li&gt;

    &lt;li&gt;&lt;a href="america.html"&gt;America&lt;/a&gt&lt;/li&gt;

    &lt;/ul&gt;

    &lt;/body&gt;

    &lt;/html&gt;

    ```


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_250_2.png)


    ```

