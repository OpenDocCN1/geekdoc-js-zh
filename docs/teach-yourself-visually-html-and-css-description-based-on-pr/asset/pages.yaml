  md: '# Working with JavaScript


    Type a space and then ONMOUSEOUT="document.?, replacing with the name of the original
    image.


    Type a space and then .src="?", replacing with the name and location of the original
    image.


    ```

    <html>

    <head>

    <TITLE>Image Links</TITLE>

    </head>

    <body>

    <a href="home.html" ONMOUSEOVER="document.image.src=''llama_over.jpg'' ONMOUSEOUT="document.image.src=''llama.jpg''">

    <IMG src="home.jpg" NAME="home">

    <IMG src="search_bc.jpg" NAME="search">

    </a>

    </body>

    </html>

    ```


    When the user moves the mouse pointer over the image, the Web browser replaces
    the original image with the rollover image.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_279_0.png)


    # How can I make the rollover effects immediate?


    You can instruct the browser to preload the rollover image using JavaScript. This
    way, the browser doesn''t have to download the image when the mouse pointer rolls
    over the original image. You can preload an image by adding the following script
    inside the <HEAD> tags of your HTML:


    ```

    <SCRIPT>?new Image (h,w)?.SRC="image.url"</SCRIPT>

    Replace ? with an identifier for the image, replace h,w with height and width
    values for the image, and replace image.url with the location and file name of
    the image.

    ```


    How do I add multiple rollover images to my page?


    Follow the previous steps for each image, but remember to assign a different NAME
    identifier to each image in step 2. If you specify the same identifier for more
    than one of the images, some browsers will not display the rollover effect correctly.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_279_1.png)'
