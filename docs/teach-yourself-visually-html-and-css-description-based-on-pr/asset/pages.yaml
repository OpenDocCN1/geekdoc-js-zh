    Note: For about applying styles with a DIV tag, see chapter 10.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_229_1.png)


    Machu Picchu

    Located in the Peruvian Andes, the ancient Inca city Machu Picchu was built in
    the 15th century. It is located on a mountain ridge and remained hidden from the
    Spanish conquest. Today Machu Picchu is the most visited attraction in Peru.


    Santiago de Compostela

    Located in the region of Galicia Spain, Santiago de Compostela marks the end of
    the Camino de Santiago, the Way of St James. Each year thousands of pilgrims walk
    to the cathedral along the route from the south of France. This path leads to
    various routes, which lead where the remains of Saint James are buried.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_229_2.png)


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_229_3.png)


    Where can I find background images with my Web pages?

    If you do not have images to use as backgrounds, you can trying free ones on the
    Web. Many other sites offer texture images, such as marble backgrounds and water.
    (www.backgroundcity.com) and Free-Backgrounds.com (www.free-background.com) are
    good places to start. Try conducting a Web search for the keywords "free background
    images."


    If you have images turned off in your browsers, can you see the background image
    for an element?

    No. However, you can insert both a background color and a background image. While
    the image loads, the browser displays the background color. If the users have
    images turned off, then they see the background color. Be sure to type the color
    property before the URL.


    ![](img/a5fa3070a8ca2e193a37b457edb4b0f7_229_4.png)


