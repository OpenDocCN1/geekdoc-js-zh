  md: '# Overview-Plus-Detail


    By allowing users to view details of the areas of interest while simultaneously
    seeing the overview (albeit in a much coarser resolution), the need to zoom out
    to access other areas of the information space is eliminated. Allowing users to
    move or manipulate viewports makes it easy to quickly navigate the information
    space without losing context. Moreover, showing viewports provides a sense of
    where the user is in the information space; in essence, it answers the common
    orientation-related question: Where am I?


    This pattern is based on one of the basic principles of information visualization:
    focus plus context.


    +   - First, the user needs both overview (context) and detail information (focus)
    simultaneously. Second, information needed in the overview may be different from
    what is needed in detail. Third, these two types of information can be combined
    within a single (dynamic) display, such as human vision. (Cart et al., 1999, p.
    307)


    The main implication of this principle is to select regions of interest in greater
    detail (i.e., focus) and to preserve a global view at reduced detail (i.e., context)
    in such a way that all information is visible simultaneously.


    # How


    Make the overview pane available to users at all times. It can be positioned as
    an inset pane within the detail pane (Figure 8.16) or positioned next to the detail
    pane (Figure 8.17).


    Show the viewport within the overview, highlighting the completely zoomed-portion
    of the detail pane. Allow users to drag the viewport over overview to zoom in
    to different areas within the overview. If users can pan information in the detail
    pane, move the viewport in the overview pane along with it. Feasible, allow users
    to adjust the viewport size to change the dataset''s


    ![](img/ad042d15418a1098a617de420fc07871_251_0.png)


    FIGURE 8.17 Google Finance positions the overview and detail panes, one above
    the other, and allows users to see detailed price trends for a stock by letting
    them adjust the viewport size in the overview pane.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'scale in the detail pane. For example, Google Finance allows users to change
    the viewport size so they can zoom in or out of the date range for the stock-trend
    chart (see Figure 8.17).


    # Related design patterns


    When zooming and panning the detail area or moving and/or resizing the viewport,
    DRAG-AND-DROP is necessary. Additionally, some type of visual effects (ANIMATION/TRANSITIONS)
    may be employed to allow users to maintain the visual continuity between states.


    # DYNAMIC QUERING


    # Problem


    When presented with a large number of items, users may want to "tune" their criteria
    to reduce the number of items to a manageable set. Although traditional filtering
    mechanisms address the problem (see the FILTERING pattern in Chapter 6), user
    interaction can become cumbersome, with every filtering user needs to "submit"
    their criteria and wait for the page to see an updated item list.


    # Solution


    Allow users to filter items using a set of interactive controls (i.e., sliders,
    checkboxes, radio buttons, and so forth) that with each selection, they can see
    updated results without having to wait for the page to refresh (Figure 8.18).


    # Why


    In traditional web applications, filtering requires users to make narrowing selections,
    submit them to the server, and wait to view the updated result set after a refresh.
    With every filtering choice, users go through the same process, leading to an
    interrupted experience. RIAs eliminate the explicit "submit" action and accompanying
    page refreshes, providing a more fluid and interactive experience.


    ![](img/ad042d15418a1098a617de420fc07871_252_0.png)


    FIGURE 8.18 Blue Nile allows users to narrow diamond choices by them to filter
    by price, cut, color, and category. The range for each choice is selected by users
    using sliders.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# How


    Show criteria to users as a set of checkboxes, sliders, radio buttons, and links
    along with results. As users make different selections, narrow or expand the results
    without any page refreshes, enabling users to immediately see the effects of their
    choices (Figure 8.19).


    To the extent possible, make all choices visible to users and minimize the use
    of dropdown lists or hidden (cascading) options.


    # Related design patterns


    Although DYNAMIC QUERYING is a powerful way to show users a filtered dataset in
    almost real time, processing delays are inevitable. Therefore, the DELAY/PROCESS
    INDICATORS pattern commonly accompanies this pattern.


    # LIVE PREVIEW


    # Problem


    Unlike off-the-shelf, mass-produced products, many new products can be customized
    to users'' preferences along one or more attributes. For example, when purchasing
    a car, users may customize its color, trim, and other options and accessories.
    However, not being able to see the effect of their choices leaves unsure about
    their selections and prevents them from exploring other possibilities. In addition,
    asking users to see the effect of their changes after every selection can become
    tiresome.


    ![](img/ad042d15418a1098a617de420fc07871_253_0.png)


    **FIGURE 8.19** Kayak allows users to filter matching flights by the number of
    stops, airline, arrival and departure times, arrival and airports, and other options.'
