  md: "area. In addition, structure the page so that users can easily navigate among\
    \ the page’s content areas.\n\n# Why\n\nFor users without vision impairments,\
    \ it’s easy to ignore persistent header and navigation sections of pages and focus\
    \ on relevant content areas. Screen readers and keyboard users, however, are forced\
    \ to access the page in a linear fashion, disrupting their experience. Built-in\
    \ mechanisms to directly access a page’s content via an explicit “skip navigation”\
    \ link at the top of the page or through appropriate structural markup make interaction\
    \ with web pages both efficient and pleasurable for assistive technology users.\n\
    \n# How\n\nProvide a link at the top of the page that allows users to skip over\
    \ navigation links. The “skip to main content” link is just an HTML link created\
    \ using the anchor `<a>` tag. If designers do not want to make the link visible,\
    \ they may use CSS to hide it (Figure 11.21).\n\n```\nCSS:\na.skip-navigation\
    \ {\n  display: block;\n  position: absolute;\n  top: -9999px;\n  left: -9999px;\n\
    }\n\nHTML:\n<a class=\"skip-navigation\" href=\"maincontent\">Skip to main content\
    \ </a>\n... navigation and other persistent elements\n\n<a name=\"maincontent\"\
    \ id=\"maincontent\"></a>\n<!-- Main Content Starts Here -->\n```\n\n**FIGURE\
    \ 11.21** Using this approach, the link is hidden for users without vision impairments\
    \ but is read by screen readers and is accessible to text browsers like Lynx.\
    \ As shown, the anchor for the “skip” link does not need to have any content.\n\
    \n> NOTE\nFor sites with primary and secondary navigation, it’s beneficial to\
    \ separate skip navigation links: the first “skip” link would be “Skip Main Navigation”\
    \ or “Skip Global Navigation” and the second “Skip Local Navigation,” which then\
    \ takes users to the page’s main content."
