  md: '# Related design patterns


    Despite its comprehensiveness, APPLICATION HELP may not be able to answer all
    users'' questions. Therefore, consider complementing it with HELP COMMUNITY, where
    users can post their questions and get them answered by customer support staff
    or by other users of the application. Additionally, consider CLICK-TO-CHAT to
    allow users to get answers to their questions quickly and directly from qualified
    customer support personnel.


    # GUIDED TOURS


    # Problem


    When starting to use a new application or exploring unfamiliar functionality of
    an existing application, users may want to know how to accomplish certain goals/or
    tasks.


    # Solution


    Offer users how-to guided tours, demos, or step-by-step explanations of how certain
    tasks can be accomplished or how certain functions works (Figure Web.17).


    # Why


    No matter how easy it is to use an application, at least a few users are going
    to find functions difficult to understand and use. This may be because of their
    limited domain knowledge or exposure to modes of interaction. Providing guided
    tours with explanations can help confidence in new users, not only in terms of
    how to accomplish certain tasks but also as something they can return to and review
    if necessary. Even users who are familiar with the domain and application may
    want to familiarize themselves when attempting not-so-frequent tasks or tasks
    that may be difficult or impossible to use. Offering guided tours, how-to, or
    demos can help users


    WEB.17

    Microsoft Office Communicator shows users how to add communication modes by offering
    guided tours for each communication mode.


    ![](img/ad042d15418a1098a617de420fc07871_456_0.png)'
  merge: -1
