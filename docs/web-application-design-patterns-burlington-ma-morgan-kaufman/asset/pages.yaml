  md: '# CHAPTER1 Introduction


    This chapter focuses on design patterns for navigation systems, including PRIMARY
    NAVIGATION, SECONDARY NAVIGATION, UTILITY NAVIGATION, FACETED NAVIGATION, SUPPLEMENTARY
    NAVIGATION, TAG CLOUDS, BREADCRUMBS, and WIZARD.


    Chapter 6: Searching and Filtering. For most web applications, accessing information
    using only navigation systems can become cumbersome and promise usability. Therefore,
    information within web applications is searchable to users to their desired items
    quickly and efficiently. Unless search terms are very specific, users are likely
    to be faced with a large number of results. Designers must offer users options
    to narrow down such result to a manageable set of choices by providing filtering
    mechanisms. This chapter discusses design patterns related to searching and filtering
    in web applications, including SIMPLE SEARCH, PARAMETRIC SEARCH, ADVANCED SEARCH,
    SEARCH TIPS, SEARCH RESULTS, SORTING, PAGINATION, CONTINUOUS SCROLLING, FILTERING,
    FACETED SEARCH, and SAVED SEARCHES.


    Chapter 7: Lists. Lists are used to present a collection of items to users. Depending
    on the nature of items in the collection, the presentation approach varies. This
    chapter discusses design patterns for different types of lists, including SIMPLE
    LIST, TABULAR LIST, HIERARCHICAL LIST, EVENT LIST, TIMELINES, IMAGE/GRID, MAPS,
    LIST ACTIONS, and UTILITY FUNCTIONS.


    Chapter 8: Rich Internet Applications. Rich Internet Applications (RIAs) can deliver
    responsiveness and interactivity comparable to desktop applications because users
    need not wait for pages to refresh for basic data and layouts to update; therefore,
    their actions'' results can be seen immediately. This chapter discusses commonly
    used RIA design patterns, including RICH-TEXT EDITOR, AUTOSUGGEST/AUTOCOMPLETE,
    EDIT-IN-PLACE, OVERVIEW-PLUS-DETAIL, DYNAMIC QUERYING, LIVE PREVIEW, DRAG-AND-DROP,
    SLIDER, ANIMATIONS/TRANSITIONS, DELAY INDICATOR, SPOTLIGHT/YELLOW-FADE, and CAROUSEL.


    Chapter 9: Social Applications. A recent trend in web applications is the development
    of social applications, which not only encourage users to contribute and share
    content (e.g., photos, videos, bookmarks, and so forth), but also promote interaction
    and build communities. This chapter describes design patterns that have emerged
    from such social applications, including ADD/UPLOAD CONTENT, TAGGING, RATING,
    REVIEWS, VOTE TO PROMOTE, USER PROFILE, REPUTATION, DISCOVER MEMBERS, FRIEND LIST,
    GROUPS/SPECIAL INTEREST COMMUNITY, MESSAGING, PRESENCE INDICATOR, SHARING, and
    COLLABORATION.


    Chapter 10: Internationalization. Internationalizing web applications is an important
    step toward localization—that is, adapting them to a specific region or language.
    It helps reduce the effort required for localization later'
