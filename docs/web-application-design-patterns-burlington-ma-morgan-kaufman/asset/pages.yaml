    # GLOBAL GATEWAY


    # Problem


    When localized applications are available, users need to be directed to the application
    designed for their region and language. This is particularly important for applications
    (e.g., e-commerce applications) where products and services offered by a company
    vary from one region to another. Even when localized applications are available
    using the appropriate country codes in their top-level domain (TLD) names’ (e.g.,
    www.amazon.co.uk for United Kingdom), users may not know the appropriate code
    or a localized version exists and therefore they may go directly to the application’s
    nonlocalized version.


    # Solution


    To direct users to their localized version of the application, show them a global
    gateway page allowing them to choose their region (or country) and language (Figure
    10.29). Once users have specified their preference, remember their selection so
    they do not have to make the same choices again. However, do not lock users to
    their selection—allow them to change it (Yunkers, 2002).


    > *Many web applications use country-specific URLs using the appropriate country
    code in their TLD name. Country codes for TLDs include .uk for United Kingdom,
    .jp for Japan, .fr for France, and so forth. See www.iana.org/domains/root/db/
    for a list of country code TLDs.'
