  md: '# CHAPTER 8 Rich Internet Applications


    # Why


    Showing wait/progress indicators serves two purposes:


    +   1. They let users know the application has received their request and is working
    on it.

    2. They keep users informed about where the application is in terms of processing
    the request.


    Users can use this information to anticipate the amount of time they have to wait
    and opt to cancel the operation. Like the ANIMATIONS/TRANSITIONS pattern, progress
    indicators provide necessary feedback to users and keep them informed of the system
    status (Galitz, 2002; Nielsen and Molich, 1990).


    # How


    Different approaches may be used to indicate progress depending on the length
    of the delay. For shorter delays (less than 10–15 seconds), progress indicators
    may take the form of:


    +   * A text message as "loading" or "please wait..." (Figure 8.41).

    * An animated icon (e.g., an hour-glass) (see Figure 8.36).


    For longer delays (more than 10-15 seconds), use a progress bar that shows the
    extent of progress and indicates the status and/or an estimate of remaining time.
    If completing an action is going to take a long time, let users cancel the operation
    at any time (Figure 8.42).


    ![](img/ad042d15418a1098a617de420fc07871_266_0.png)


    FIGURE 8.41 Kayak uses "Updating results" message for shorter-duration delays.


    FIGURE 8.42 When loading a photo, Picnic uses a progress bar that shows the extent
    of progress. Users are also offered the option to cancel the upload process at
    any time.


    ![](img/ad042d15418a1098a617de420fc07871_266_1.png)'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'FIGURE 8.43 Picnic uses interesting progress bar messages (e.g., "Fluffling
    clouds" or "Sprinkling dew") while loading the application.


    For really long delays, show status information or other engaging content to shorten
    the perception of the delay (Figure 8.43).


    # Related design patterns


    Processing delays, usually shorter ones, are quite common in DYNAMIC QUERYING
    AND EDIT-IN-PLACE implementations. If users need to be informed about any page
    changes when processing is complete, the SPOTLIGHT/YELLOW-FADE pattern may be
    useful.


    # SPOTLIGHT/YELLOW-FADE


    # Problem


    Often, it is important to draw user attention to a specific page change either
    by a user action or initiated by the system. Because the change is not significant
    enough to keep the updated information highlighted (see the HIGHLIGHT pattern
    in Chapter 12) and because several elements on the page could change over a period
    of time, permanently highlighting may make the interface appear cluttered. Offering
    messages that inform users of changes for monitoring-type applications that show
    live data, such as stock quotes or sports scores, may make the interface jump
    and distracting, as on values on such interfaces changing frequently.


    # Solution


    Highlight the changed area for a very brief period—like a spotlight—to create
    an animation-type effect that draws user attention. This approach is a generic
    version of the yellow-fade technique proposed by Linderman (2004) to subtly spotlight
    a recently changed area on a page (Figure 8.44).


    # Why


    This brief highlighting approach helps provide sufficient animated effect to get
    users to quickly attend to the change when small changes are happening on the
    page. Additionally, because the effect is transient, users are not distracted
    by the highlight and can return to the task at hand, the interface remains unaltered
    as is.


    # How


    Highlight changed content briefly (no more than a few seconds) to create an animation-like
    effect. Choose an unsaturated highlight color that provides a noticeable contrast
    from the rest of the background (Figure 8.45).


    ![](img/ad042d15418a1098a617de420fc07871_267_0.png)'
  merge: -1
