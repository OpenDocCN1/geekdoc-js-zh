  md: '# CHAPTER 13 Pattern Libraries


    ![](img/ad042d15418a1098a617de420fc07871_412_0.png)


    FIGURE 13.10 Description of HOVER & COVER anti-pattern. (Source: Scott, 2008).


    TARGETS, POGO STICK NAVIGATION, LINKITUS, ANIMATION GONE WILD, WINDOWS APENTY,
    and MISSED MOMENTS, among others.


    Because antipattern are design practices that should be avoided, they should reference
    appropriate design patterns or suggest design practices to improve the design.
    An alternative to including antipatients is to indicate the correct practice within
    the original pattern itself. For example, when describing a hover pattern, one
    of the best practices (or the "how") can indicate that using the hover method,
    the contextual information or actions around the object should be occluded (i.e.,
    covered).


    # MAKE FINDING APPROPRIATE PATTERNS EASY


    To encourage use, pattern libraries must make finding appropriate patterns easy.
    This can be accomplished by allowing users to browse patterns in multiple ways
    such as user tasks, design requirements, application type, alphabetical list,
    and so forth (Figure 13.11).


    When listing patterns, a thumbnail of the pattern to make it easy to scan patterns
    and identify an appropriate match, as well as discover other relevant patterns
    (Figure 13.12).


    Designers would also benefit if they were provided assistance in selecting appropriate
    patterns from one or more design goals; this is especially helpful when choosing
    from a set of seemingly related patterns. As with the FILTERING pattern (see Chapter
    6), users can adjust their design criteria to narrow or expand their pattern choices
    (Figure 13.13).


    # ENABLE AND ENCOURAGE PARTICIPATION


    To encourage participation from other designers and developers, enable users to
    rate patterns, post comments, and/or suggest ideas for new patterns (Figure 13.14).'
