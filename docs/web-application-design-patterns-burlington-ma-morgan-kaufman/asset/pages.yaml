    MESSAGES).


    # SMART DEFAULTS


    # Problem


    With every additional form element, both the time it takes users to fill out the
    form and chances of potential errors increase. In addition, for multipart forms,
    if users have to reenter the same information, not only would it increase the
    time required to complete the form, but also require the application to check
