  md: '# Challenges to Designing Interfaces for Web Applications


    # Maturity and reliability of network connectivity and new web technologies


    An important roadblock for earlier web applications was unreliable network connectivity
    and inconsistent web standards support—that is, HTML, CSS, and JavaScript—in web
    browsers. This is no longer the case. Adherence to web standards is improving,
    and broader inconsistencies used to cause frustration for web developers are decreasing.
    In addition, network connectivity and broadband access is becoming more reliable,
    more ubiquitous, and cheaper to use. Using Website Optimization the use of broadband
    Internet grew to 75 percent in US homes in March 2008 and 90 percent over active
    Internet users (www.websiteoptimization.com/bw/0807/). This stable platform has
    also spawned the availability of visual development tools and frameworks to facilitate
    web application development.


    # CHALLENGES TO DESIGNING INTERFACES FOR WEB APPLICATIONS


    Despite these benefits and increasing use, designing interfaces for web applications
    remains difficult. Challenges in creating usable interactions are mainly related
    to the underlying "loosely coupled" web architecture, a limited set of interactive
    controls natively supported in web browsers, and the lack of design guidance to
    how user interactions are implemented.


    # “Loosely coupled” web architecture


    An important challenge faced by web application designers is caused by the "loosely
    coupled" or "stateless" nature of the web. The Web’s interaction paradigm is very
    simple: Users request web pages with web browsers, and serve by sending the requests
    to the servers or informing users if there are problems retrieving pages. However,
    once a user’s request is satisfied by the web server, sending the page to the
    browser, the connection between the web server and the browser is severed. When
    a user makes a subsequent request, the connection is established again with the
    server until the new page is "reloaded” in the user’s browser.


    Each page reload, or page refresh, is marked by perceptible delays caused by the
    need to establish the connection, the server to respond to the request, the network
    to receive the page, and the browser to reload the page. This creates a jumpy
    and discontinuous experience for web application users. For example, a user browsing
    a hierarchical tree of items may have to wait after every click to expand, or
    collapse, a data node for the page to reload and see the expanded, collapsed,
    view. Although this problem is addressed to a great extent by the use of scripting
    technologies such as JavaScript and Rich Internet Applications (Chapter 8), it’s
    an important user experience issue faced by most web applications.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Limited set of controls, widgets, to support application design


    In the current version of HTML (version 4.01), native support for controls is
    limited to text boxes, radio buttons, dropdown lists, and command buttons. It
    does not offer support for sophisticated interactions common in desktop applications
    as spin controls, calendars, wizards, tabs, toolbars, drag-and-drop, floating
    palettes, dialog boxes, context-sensitive menus, and so forth, which are available
    in each desktop applications. Although such controls can be developed using JavaScript
    and Cascading Style Sheets (CSS), a lack of inherent support for them to a variety
    of implementations with inconsistent presentations and interactions.


    # Inconsistent interaction approaches


    Both the underlying technological architecture of the Web and the limited set
    of controls available make it difficult to create interactions for web applications
    comparable to desktop applications. Additionally, because most web applications
    are designed to be browser-agnostic, interactions and appearance cannot be simulated
    to match all operating systems; for example, tabs in the Macintosh OS X Aqua interface
    are visually different from the tabs in the Windows Vista interface (Figure 1.6).


    Although the Web''s relatively unrestricted development environment offers considerable
    creativity and flexibility to designers, the resulting diversity and inconsistency
    in user interfaces and interaction approaches in web applications is often challenging
    for users. This is due to the fact that users are faced with a variety of objects,
    actions, and visuals mixed together in the same application (Tidwell, 2006). Figure
    1.7 shows an example of changing the tab name in Zoho Notes (a note-taking web
    application like MicrosoftOne) and Zoho Sheet (a worksheet web application like
    Excel). To change the tab name in Zoho Notes, users must double-click the tab
    name and a Rename dialog pops up. In order to change the tab name in Zoho Sheet,
    users must right-click


    > NOTE

    The next version of HTML (version 5) will support additional elements that are
    currently part of the World Wide Web Consortium''s (W3C) (https://www.w3.org/TR/web-forms-2/).
    This new version offers additional form controls (e.g., the `<datalist>` to create
    combo-boxes and the `<output>` to element show values from other controls) as
    well as an extension to existing form controls (e.g., `<input type="date">`, `<input
    type="email">`, etc.), which makes web development a little easier. Opera (version
    9 and above) currently supports Web Forms 2.0 enhancements and offers a good platform
    to develop interactive prototypes.'
