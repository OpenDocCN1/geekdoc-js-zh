    requires users to describe them using tags (TAGGING).


    # TAGGING


    # Problem


    Web applications allow users to add content (e.g., bookmarks, photos, music, videos,
    and so forth) may also want them to categorize or label their uploaded content
    to make it easier to find later. However, with all the different ways users want
    to label content, it may be impossible to anticipate and make all potential labels
    and variations (categories or subcategories). For example, users may want to label
    personal photos with labels such as the names of people, occasions, ages, emotions,
    and so forth.


    # Solution


    Allow users to label (i.e., tag) content with any descriptive information they
    desire so as to make it easy for them to find later (Figure 9.6). The labels used
    for tagging content should not be restrictive except when they might be offensive
    to other users of the application; for example, an application might not want
    to include profanity in labels.


    # Why


    The use of open-ended tags encourages a personally meaningful and natural vocabulary.
    This makes it easy for users to find items later and allows them


    ![](img/ad042d15418a1098a617de420fc07871_277_0.png)


    > FIGURE 9.6

    YouTube asks users to add tags when uploading videos.'
