    Research evidence. To improve pattern validity and strength, it may help include
    empirical or research evidence that demonstrates a pattern’s benefits. Supporting
    research can be added in a section such as research evidence, usability results,
    or user feedback (Spool, 2006).


    History or change log. Any changes made to patterns based on feedback from other
    designers or developers from research evidence can be logged and shown in a history
    section (Figure 13.3).


