  md: '# CHAPTER 9 Social Applications


    ![](img/ad042d15418a1098a617de420fc07871_320_0.png)


    # Why


    For their successful completion, many tasks require collaboration between two
    or more people. The nature of collaboration is often in real time, where all participants
    work (i.e., discuss, write, sketch, chat, etc.) simultaneously; or collaboration
    may be of a turn-taking nature, when only one person works on the item at a time
    and then sends it on to others.


    # How


    Collaboration involves several activities: sharing information with others, coordinating
    and inviting others to participate, working together on shared documents, reviewing
    changes and updates, and, if necessary, reverting to older versions.


    ALLOW USERS TO SPECIFY THE NATURE OF SHARING


    As a first step in collaboration, users must share the item with others and specify
    how the item should be shared. The item''s owner can determine whether the people
    with whom the item is shared can view the item, comment on it, and/or modify it
    (Figure 9.67).


    FACILITATE SCHEDULING


    Coordination is an important aspect of working together. An important task when
    working together is to determine a mutually convenient time for all participants.
    This can be done in several ways. One approach is to allow participants to share
    their schedules so that available times can be discerned by viewing them at the
    same time. Many calendar web applications allow users to share their calendars
    to identify times that are open for scheduling (Figure 9.68).


    When sharing calendars is not possible, a common approach is to have the team
    leader suggest a few times and let the rest of the team members vote on the preferred
    times (Figure 9.69).'
