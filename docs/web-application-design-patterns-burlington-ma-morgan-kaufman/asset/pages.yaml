    # OVERVIEW-PLUS-DETAIL


    # Problem


    When presented with a large dataset, users may want to zoom in to different areas
    of the dataset to access detailed information. At other times, users may want
    to zoom out to a higher "overview" level to be reoriented. Requiring users to
    go back and forth between an overview and a detail view makes navigating the information
    space extremely inefficient.


    # Solution


    Show both the overview and detail view panes with a movable viewport in the overview
    pane that shows the zoomed-in area (Figure 8.16).


    # Why


    When working with information spaces that are too large to fit on screens, users
    have to access information by zooming in and out to see the desired detail.


