  md: 'potential for them losing their place within the web application or their data
    is avoided, increasing their chances of completing tasks.


    # How


    As the name suggests, contextual help provides immediate assistance to users without
    requiring them to leave their task or application context. There are several ways
    of providing contextual help:


    +   - "What’s this?" link for information

    - In-line prompts


    # HOVER TIPS


    Hovertips are typically used to provide a short description or explanation for
    a form or interaction element. The help information is hidden and is not shown
    until users hover over the form or interaction element, its label, or an icon
    next to it (Figure Web.2). They are also known as tool tips, because they were
    originally used to help the icons in graphical user interface applications.


    # WHAT’S THIS?


    Unlike hover tips, “What’s this?” information is shown when users click on a “What’s
    this?” link, a “Learn more” link, or an icon representing this style of help.
    The “What’s this?” type of help is more detailed and is useful for longer descriptions
    and could even include images. Help information may be shown to users as pop-up
    windows (either separate browser windows or dynamic HTML overlaid on the page
    content) or the “What’s this?” link or icon (Figure Web.3). Because the help information
    is detailed and may take up considerable real estate, it’s important that users
    are offered an option to remove it (e.g., by clicking a “Close” link or button).


    # IN-LINE PROMPTS


    Unlike hover tips and “What’s this?” types of contextual help, in-line prompts
    stay visible while users interact with a form element or a section of the form.
    Prompts can be static or dynamic. Static prompts always remain visible and provide
    necessary instructions (e.g., formatting or syntax information) for all or a selected
    set of form elements (Figure Web.4). Dynamic prompts, on the other hand, appear
    only when users focus on a particular form element, and then they are hidden as
    soon as users have removed the focus from that form


