  md: '# WEB APPENDIX Help


    WEB WEB.9

    lickr organizes questions in categories as "General Flickr Questions," "Free Accounts,"
    "Upgrading and Gifts," and so forth.


    ![](img/ad042d15418a1098a617de420fc07871_452_0.png)


    In addition, a link to an FAQ should be provided from APPLICATION HELP as well
    as HELP COMMUNITY pages. Users should be able to review FAQs before exploring
    more extensive application-help or submitting questions that have already been
    answered to the user community.


    # APPLICATION HELP


    # Problem


    Although many questions can be answered within the context of users'' tasks through
    contextual help and FAQs, there are tasks that requiring visiting several pages
    within the application. Trying to embed answers to all questions, especially related
    questions, on the same page can make the page visually cluttered and daunting.


    # Solution


    Provide application-level help with detailed instructions for using the application''s
    functionality. In addition, make application-level help accessible from all pages
    within the web application; the link or icon for help is typically placed in the
    top-right corner of the page as part of the main or utility navigation (Figure
    Web.10).


    # Why


    When users are unable to accomplish tasks, they are likely to resort to help.
    Making help easily accessible can serve as a reassurance to users that they can
    access help when needed. By linking individual pages in the application to appropriate
    sections of the application-level help, it can also serve as contextual help,
    making help even more useful.


    # How


    Allow users to access help from all pages within the web application. Place the
    link for help in a consistent location, commonly located in the top-right section
    of the page as part of the primary or utility navigation of the application. This
    placement may have been influenced by desktop applications where "Help" is usually
    the last menu item in the menu bar (Figure Web.11).'
