    Highlighting is particularly important for communicating different states for
    a wide variety of elements, since it not only directs users’ attention but also
    invites appropriate action.


    # How


    There are several ways to highlight a page’s elements to make them stand out:
    change the background color, change the text color, make the text bold or larger
    size, change borders, use animation (see the patterns ANIMATIONS/TRANSITIONS and
    SPOTLIGHT/YELLOW-FADE in Chapter 8, dim some elements, or use icons). Ideally,
    a combination of these styles (Figures 12.19 and 12.20).


    # HIGHLIGHTED SELECTED ITEMS IN A LIST


    Clearly identify items which users are working or will be taking action on highlighting
    each selected item. Even when checkboxes are used for selection, highlighting
    is a better visual way of distinguishing selected items from unselected items
    (Figure 12.21).


    # USE TRANSIENT HIGHLIGHTING TO INFORM USERS OF PAGE CHANGES


    Highlighting an item momentarily (typically by fading the highlight and then fading
    it out) creates an animated effect and focuses users’ attention on the changed
    area on the page (see the ANIMATIONS/TRANSITIONS and SPOTLIGHT/YELLOW-FADE patterns
    in Chapter 8).'
