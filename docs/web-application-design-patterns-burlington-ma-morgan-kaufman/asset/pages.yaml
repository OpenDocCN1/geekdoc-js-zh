    # Related design patterns


    Like FILTERING, faceted search assumes page refreshes with user selection of a
    narrowing option. Using DYNAMIC QUERYING is another option available when rich
    Internet applications when selecting a facet updates the result set without page
    refresh. FACETED NAVIGATION also accompanies faceted search. The main difference
    between them is that the former focuses strictly on users browsing the information
    space, whereas the latter is initiated by a user search.


    # SAVED SEARCHES


    # Problem


    Users may want to rerun one or more of their searches in the future. Specifying
    the same search criteria over and again is inefficient and error-prone, as users
    may forget to include one or more criteria for complex searches.


    # Solution


    Allow users to save their ad hoc search queries and resubmit them as needed. In
    addition, consider allowing users to set alerts so they can be kept informed of
    new items that match their search criteria (Figure 6.45).'
