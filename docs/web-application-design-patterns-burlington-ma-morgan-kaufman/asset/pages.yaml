  md: '# Frequently Asked Questions


    # Customer Support


    Top customer support questions:


    +   - How do I confirm my booking?

    - How do I change or cancel a booking?

    - If I lose my items, where do I claim them?

    - Where can I get more information about shopping for travel?


    # Do I need to contact Expedia to confirm my booking?


    Most of the time, you don''t need to. As soon as the booking is complete, we will
    send you a confirmation email.


    Overnight, it may take up to 24 hours to confirm. If this is the case, we will
    let you know by email. Check your email 24 hours later to make sure it has been
    confirmed.


    Here is how to check your itinerary:


    +   - Click on ''My Itinerary'' in the blue bar at the top of the page

    - If you are prompted to sign in, please provide your username and password.

    - At the top of it, you will see a field ''Status'' which should say ''Confirmed''
    or ''Pending''.


    If you don''t see it, or if you have any questions, you can call us at 1-800-EXPEDIA
    (1-800-397-7234).


    # Popular Questions & Answers


    +   - Am I buying from Expedia or from a shopping competitor?

    Answer: You are buying from Expedia. We do not sell any of the items listed on
    the site. We are a travel site that helps buyers find information about products
    and merchants that they can buy online.


    +   - What is a ''Brand'' or what is a ''Member''?

    Answer: A brand is a hotel or company, and a member is a registered user.


    +   - I am interested in making a purchase. How do I buy on PriceExpedia?

    Answer: Just click on the item you want and follow the instructions.


    +   - What happens if a product is delayed, refunded, or cancelled?

    Answer: We will notify you as soon as we have information.


    ![](img/ad042d15418a1098a617de420fc07871_451_0.png)


    The FAQ(s)

    Here are common questions that people have asked about Picick.


    What is Picick?

    Picick is a travel search engine. In your browser, it''s the best way to find
    undiscovered photos, reviews, and apply filters to your search.


    How do I book with Picick?

    Picick uses various search engine tools to find you information about what could
    be the best booking options for flights, hotels, and car rentals. Once you find
    a deal you like, just click the link to be taken to the provider''s website where
    you can complete the booking.


    Hover over the Cross-link tags and you''ll see our custom-made effects which have
    the ability to help you compare prices, reviews, and availability across different
    sites. This includes flights, hotels, cars, and red-eye deals. The other tools,
    like route, rest, and de-clutter, will help you plan your trip.


