  md: '# Why


    When users are trying to research options failing to receive the desired information,
    or facing a complex task, they often prefer to receive assistance from someone
    with experience. Even when information is available and easily accessible, it
    may not be able to answer all users'' questions; they may not know where to find
    the desired information. In such cases, offering users an option to chat with
    a knowledgeable customer support person (i.e., an agent) can be very useful. In
    addition, on e-commerce applications, talking to a knowledgeable can assist users
    in their purchasing decisions. A study by Forrester found that almost half of
    the users who had tried click-to-chat functionality valued the ability to immediately
    chat with a live person (Sage, 2008).


    # How


    Before users can initiate a chat, they must know that it''s available. Therefore,
    make the click-to-chat option accessible from the pages where users are likely
    to expect it most. For many web applications, the option to chat live is available
    as part of the help or customer support section or on all pages as part of the
    utility navigation (Figure.28).


    Although most applications click-to-chat is initiated by the users, many e-commerce
    applications offer a proactive chat option to users based on their behavior, such
    as frequently visiting the same product page or spending time on a page. Here,
    users are prompted to initiate a chat with a sales agent to help in getting their
    questions answered.


    # LET USERS KNOW IF THE AGENT IS AN AUTOMATED AGENT


    It''s important for users to know whether they are chatting with a live agent
    or an automated agent. If an automated agent is the default option, offer users
    an easy way to chat with a live agent (Figure.29).


    # COMMUNICATE AVAILABILITY AND WAIT TIME


    Clearly indicate users when the live-chat option is unavailable. In addition,
    let users know what other help they have (Figure.30). Similarly, if


