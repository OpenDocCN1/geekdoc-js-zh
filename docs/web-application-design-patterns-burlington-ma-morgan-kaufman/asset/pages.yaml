  md: '![](img/ad042d15418a1098a617de420fc07871_97_0.png)


    **Figure 4.4** 1&1, a web hosting company, gives users the ability to access all
    functions related to their account on their control panel page. Because there
    are a number of options, it groups them into separate areas, ''Administration''
    and ''Account.''


    Control panels have a few similarities with home pages on content-oriented web
    sites:


    +   - They set an expectation of the application’s scope and provide quick access
    to its most important features and functionality.

    - They establish an overall information design approach for pages within the application
    in terms of its layout, placement of navigation, search functionality, and so
    forth.

    - They inform users of new features and functions.


    Control panels are also useful for account overview pages where users can access
    all of their account-related functions in one place. e-commerce applications use
    account overview pages to allow users to access their orders, shipping addresses,
    payment information, and so forth (Figure 4.5).


    # HIGHLIGHT ITEMS THAT NEED ATTENTION


    Like with the Inbox, a CONTROL PANEL is a place to inform users of, or direct
    their attention to changes in application functionality and content. As soon as
    users have landed on the control panel page, it is important to direct them to
    items that need their attention. Because users may not be expecting them, it’s
    necessary that items serving as notifications or announcements'
