    # MAKE ICONS VISUALLY DISTINCT FROM ANOTHER


    It’s important that icons are easily distinguishable from each other to help users
    find appropriate icons (this, actions) quickly and minimize confusion. This is
    usually accomplished by making their shapes visually distinct from another (Figure
    12.28) and is particularly important when icons are used to suggest “status” information.
    For example, using the same-shaped icons with different colors (e.g., red, yellow,
    and green) to indicate status. Instead, use different shapes in addition to colors
