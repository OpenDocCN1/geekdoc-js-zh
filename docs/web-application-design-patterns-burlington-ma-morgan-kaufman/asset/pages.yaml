    # Related design patterns


    Even when using CSS unobtrively, it’s important to use structural tags to mark
    pages to ensure that pages are accessible without style sheets (SEMANTIC MARKUP).
    In addition, style sheets should be added only after the page structure has been
    created (PROGRESSIVE ENHANCEMENT).


    # UNOBTRUSIVE JASCRIPT


    # Problem


    Using JavaScript on pages can offer users richer interactivity and interaction
    more pleasant. However, not all webs support JavaScript, and users or system administrators
    may disable JavaScript because of their security policy or personal preference.
    Therefore, web applications dependent on JavaScript may become inaccessible to
    least some users.


    # Solution


    Use JavaScript “unobtrusively”—that is, incorporate within web pages in a way
    that not having it available does not affect users’ ability to use the web application.


    # Why


    Using JavaScript unobtrively and redundantly allows web applications to be functional
    without being on it. When JavaScript is supported and enabled, the web application
    can offer enhanced interactivity.


    # How


    Following the principle of PROGRESSIVE ENHANCEMENT, structure the page first (SEMANTIC
    MARKUP), add necessary presentation enhancements (UNOBTRUSIVE STYLE SHEETS), and
    enhance browser interaction using JavaScript such that not having it available
    does not affect structural and presentation layers and the use of the web application.


    # KEEP PAGE MARKUP AND JAVASCRIPT SEPARATE


    Keep all JavaScript for the web application in external JS files rather than the
    page itself or embedded in the HTML markup


    ```

    <script type="text/javascript" src="javascriptfile.js"></script>

    ```'
