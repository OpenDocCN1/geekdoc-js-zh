    only signify the act of submitting the form data; rather, use labels such as "Save
    Changes," "Search for Flights," or "Find Users" (Figure 2.32).


    Following are two additional guidelines for labeling action buttons:


    Using "Remove" and "Delete." Use "Delete" when elements will be permanently deleted
    and will not be available without creating a new data element. Whereas, use "Remove"
    when elements are removed only from that context but are still available in other
    contexts. For example, in email applications, to remove a data from a list of
    attachments, use "Remove attachment" or "Remove." But to delete a message from
    a list of messages, use "Delete message" or "Delete."


