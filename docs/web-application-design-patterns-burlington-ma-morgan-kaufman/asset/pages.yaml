  md: '# CAROUSEL


    # Problem


    The total number of items (either images or a combination of images and text)
    to be presented to users cannot be accommodated in the available space.


    # Solution


    Show items as a "carousel" to allow users to browse through them quickly. Although
    the notion of a carousel conjures a circular structure to facilitate navigation
    both forward and backward, many implementations of the carousel are linear and
    work as viewpoints that allow users to view a few items at a time, and go forward
    and backward to access remaining items (Figure 8.46).


    # Why


    A carousel allows users access to several in a relatively small amount of screen
    real estate and allows designers to allocate more space per item. Circular carousels
    also enables users to access items by clicking on either left or right arrows.
    Carousels are most commonly used for images; for example, when browsing through
    photo albums (www.flickr.com); movies, music, and book listings (movies.yahoo.com,
    www.amazon.com); or real estate listings (www.zillow.com, www.funda.nl).


    # How


    Present items in carousels vertically or horizontally as a "strip" with navigation
    buttons (utually arrows) at each end of the strip (Figure 8.47). In designs where
    a carousel is implemented as a slideshow, highlight the item currently being viewed
    (Figure 8.46). In addition, use a "slide" transition effect when one set of items
    in the carousel is replaced by the next set to indicate the relationship among
    the items.


    # INFORM USERS OF THE PRESENCE, OR ABSENCE, OF ADDITIONAL ITEMS


    When using linear carousels, let users know whether additional items are available
    by enabling or disabling left and right arrows as appropriate. For example,


