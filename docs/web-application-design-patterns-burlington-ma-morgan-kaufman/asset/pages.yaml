    # CONSIDER USING THE GOLDEN RATIO


    The golden ratio, also known as divine proportion, is the ratio between two segments
    such that the smaller (bc) segment to the larger segment (ab) as the larger segment
    is to the sum of the two (ac), or bc/ab = 0.618 (Figure 12.10; Lidwell et al.,
    2003).


    In general, layouts based on the golden ratio are considered to be aesthetically
    pleasing. Although the aesthetic superiority of designs based on golden ratios
    have limited evidence (Markowski, 1992), most designers consider them superior
    and their grid layouts accordingly. Although designers shouldn''t be forced to
    fit the golden ratio, it should be considered whenever (Lidwell et al., 2003).


    To use the golden ratio for a two-column, 770-pixel, fixed-width-design—for example,
    multiply 770 pixels × 0.618. The result is approximately 475 pixels, which can
    be the main content column''s width. The remaining width of 295 pixels (i.e.,
    770–495) can be used for the second column, which can be used for navigation or
    other secondary content (Baird, 2007; Clarke, 2007). The same approach also can
    be used for larger widths (Figure 12.11).


    ![](img/ad042d15418a1098a617de420fc07871_389_0.png)


    FIGURE 12.10 The golden ratio (bc/ab = ab/bc = 0.618).


    ![](img/ad042d15418a1098a617de420fc07871_389_1.png)


    FIGURE 12.11 This example from Apple shows a good application of the golden ratio.
    The page content width “Select your MacBook Air” uses a width of 605 pixels (980
    × 0.618), and the image column occupies the remaining width of 375 pixels.'
