    near the search feature. In most instances, this is appropriate considering that
    users can use the information provided in search tips and formulate their search
    queries in the persistent search bar at the top of the page.


    +   - They can be shown in a pop-up if users are likely to access tips from a
    search results page or the advanced search and losing their current page (and
