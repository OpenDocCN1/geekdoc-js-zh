  md: '# CHAPTER 11 Accessibility


    AVOID USING TEXT IN GRAPHICS

    Graphic formats (e.g., GIF, JPEG, and PNG) appear pixelated when zoomed in. When
    text is used in graphics, users who have magnified the screen to improve readability
    would end up reducing the page''s readability (Figure 11.16). Readability is further
    compromised when text is overlaid on another image or a patterned background.
    Therefore, as much as possible, avoid using text in graphics; it also helps with
    internationalization (see the EXTENSIBLE DESIGN pattern in Chapter 10).


    ![](img/ad042d15418a1098a617de420fc07871_370_0.png)


    FIGURE 11.16 Text used in graphics appears pixelated and thus is difficult to
    read when magnified.


    # Related design patterns


    Using images should not compromise the SEMANTIC MARKUP. Therefore, use decorative
    images as background images using CSS so that they are not included in the page
    structure (see also the UNOBTRUSIVE STYLE SHEETS earlier in this chapter).


    # ACCESSIBLE TABLES


    # Problem


    Reading and understanding data presented in tables can be confusing to assistive
    technology users if they are unable to establish the relationship among the data
    elements. For example, if users are not able to associate data in table cells
    to corresponding headings, they may not know exactly what the data represent and
    how they relate to data in other cells.


    # Solution


    Reserve the use of <table> tags for presenting tabular data and use style sheets
    for page layout (see the TABULAR LIST pattern in Chapter 7). Mark up data such
    that table captions, column headings, and row headings are clearly identified.
    This helps screen readers understand and communicate the relationship between
    data presented in tables.


    This is not to suggest that pages formatted using <table> tags are inaccessible.
    It is possible to build accessible pages using tables so when content is “linearized”—that
    is, when all table-related tags are removed and content is presented in the order
    it appears in the markup—the resulting content order matches what users would
    expect and the page is accessible to assistive technology users. However, the
    same visual and structural result can be achieved'
  merge: -1
  pgno: 370
- img_proc: true
  md: "# NOTE\n\nWith the new browsers supporting CSS tables using the display properties\
    \ of **table**, **table-row**, and **table-cell**, soon there would be even fewer\
    \ reasons to use HTML `<table>` tags for laying out pages (Andrew and Yank, 2008).\n\
    \nusing style sheets, and there is no longer a valid reason for favoring `<table>`\
    \ for layout (Andrew and Shafer, 2006). In addition, using tables for layout violates\
    \ the SEMANTIC MARKUP pattern, which suggests that content be marked up using\
    \ tags to match its structural intent and not to achieve a visual presentation.\n\
    \n# Why\n\nAssociating data in tables by their column and row headings help readers\
    \ correctly communicate the relationship among data elements, and users establish\
    \ appropriate context for their use.\n\n# How\n\nMost important, clearly distinguishing\
    \ headings that indicate what the data represents from data cells (the actual\
    \ values). This is achieved by marking up headings (both column and row headings)\
    \ using `<th>` tags and data values using `<td>` tags.\n\n# USE THE <caption>\
    \ TAG AND SUMMARY ATTRIBUTE TO ESTABLISH CONTEXT\n\nUse the `<caption>` tag to\
    \ provide a short descriptive title indicating the table's purpose (Figure 11.17).\
    \ The information within the `<caption>` tag is displayed to users and can be\
    \ formatted using style sheets.\n\nIn addition, use the **summary** attribute\
    \ to describe in detail what the table presents. Information contained within\
    \ the **summary** attribute is not displayed, its main purpose is to describe\
    \ the table's purpose and any relevant formatting information for assistive technology\
    \ users (Figure 11.18).\n\n# IDENTIFY ROW AND COLUMN HEADERS OF DATA TABLES\n\n\
    Ensure that data values are correctly associated with their headings using the\
    \ **scope** attribute. Such a practice lets assistive technology users know if\
    \ data are\n\n```\n<table>\n  <caption>Sales Data for Past 3 years...</caption>\n\
    \  ... rest of the table markup\n</table>\n```\n\n**FIGURE 11.17** Use the `<caption>`\
    \ tag to briefly describe the purpose of tabular data."
  merge: -1
  pgno: 371
