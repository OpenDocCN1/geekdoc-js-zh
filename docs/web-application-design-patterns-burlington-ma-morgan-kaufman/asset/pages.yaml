  md: '# Personalization


    ![](img/ad042d15418a1098a617de420fc07871_109_0.png)


    # Why


    Personalization is becoming increasingly common in helping users manage access
    to almost an unlimited amount of information. Rather than presenting “all” information,
    users are only offered information that meet their needs and interests (Anand
    and Mobasher, 2005; Koch and Rossi, 2002; Rossi et al., 2001). Thus, personalization
    helps in two ways: It reduces “clutter” by eliminating items that users are not
    likely to be interested in and it exposes users to new items they might not have
    discovered or sought out on their own. Furthermore, because the personalized (or
    recommended) list of items is based on users'' interests and behaviors, users
    would have less anxiety in considering them for purchase or engaging in transactions.


    # How


    Personalized experiences can be offered at two levels:


    +   - Based on known facts about users such as their demographic information or
    stated interests (explicit personalization).

    - Based on inferred interests from users'' past interaction and transaction history
    (implicit personalization).


    # EXPLICIT PERSONALIZATION


    At its most basic level, an application can offer personalization simply by welcoming
    users with their name (Figure 4.19).


    ![](img/ad042d15418a1098a617de420fc07871_109_1.png)


    FIGURE 4.19 Morningstar greets users with a “Welcome [first name]” message log
    in.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# CHAPTER 4 Application Main Page


    ![](img/ad042d15418a1098a617de420fc07871_110_0.png)


    Another form of explicit personalization is saving users'' profiles and account
    information, such as shipping and billing information, and prepopulating them
    to improve returning users'' experience—for example, when checking out in e-commerce
    applications (Figure 4.20).


    Yet another form of personalization is showing different views of the application
    to guest users (those who have not logged in or do not have an account) and logged-in
    users (Figure 4.21).


    A comparable personalization approach for logged-in users is based on user roles,
    where they are presented different application content areas and thus a different
    navigation structure, based on their access rights and permissions within the
    application. For example, only users with administrative rights may have access
    to user management functionality (Figure 4.22).


    # IMPLICIT PERSONALIZATION


    Personalization inferred from users'' preferences and needs (implicit personalization)
    is typically in the form of recommendations, which consider users'' past transactions
    and interaction behaviors. Such personalization is common in e-commerce applications
    where users are recommended products based on'
