    not the total number of reviews that influences customer repurchase intention,
    but the percentage of positive


    # How


    Web applications that attempt to capture users'' feedback quickly employ a star-rating
    approach with one star representing the lowest rating and five stars representing
    the highest rating; some applications allow increments of half stars, thus increasing
    the range of the scale.


    Two types of interaction approaches are commonly used when using star ratings:


    +   1. Separating the user''s ratings from the average rating. With this approach,
    users are shown an item''s average rating separately from their own rating. To
    rate an item, users are shown a set of five "empty" stars. As users hover over
    the stars, stars reflecting the corresponding rating are highlighted. Users then
    click to assign and save a rating. Users are shown their ratings in a different
    color from the average rating (Figure 9.12); they are also offered an option to
    remove their ratings or change previously assigned ratings.

    2. Combining the average rating with the user''s ratings. By default, users are
    shown stars in red to indicate the current average item rating. As users hover
    over the stars, the red stars are replaced by yellow stars (another color). As
    users click to assign and save a rating, the stars are shown in the yellow state
    to indicate that the item has been rated by the user (Figure 9.13).


    Although it makes intuitive sense to separate the current rating from the users''
    ratings, both of these approaches are widely used. In some instances, both approaches
    are used within the same application. For example, Blockbuster separates the aggregated
    average rating from the users'' rating on the movie'
