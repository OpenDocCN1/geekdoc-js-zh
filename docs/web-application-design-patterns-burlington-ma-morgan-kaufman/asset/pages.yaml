  md: '# CHAPTER 1

    Introduction


    # INTRODUCTION


    Increasingly, software applications are built using web technologies and made
    accessible via web browsers (e.g., Internet Explorer, Firefox, Safari, and Opera).
    They are commonly referred to as web applications, or hosted applications—applications
    based on a software as a service (SaaS) model or cloud computing². These web applications
    are different from traditional web sites in their emphasis is on allowing users
    to accomplish tasks such as send email, make travel reservations, find home, pay
    bills, transfer money, buy products, send invitations, and so forth (Figures 1.1
    through 1.4). Web sites, on the other hand, are content oriented and are designed
    to facilitate browsing and consumption of rather static information (Figure 1.5).


    # BENEFITS OF WEB APPLICATIONS


    The trend in web applications is understandable in view of the benefits these
    applications offer, as described in the following sections (Baxley, 2003; Turnbull,
    2006).


    # Ease of access


    Typically, the only software users needs to access and use web applications is
    a browser such as Internet Explorer, Firefox, Safari, and Opera. Users do not
    need to download and install separate software to use different web applications,
    although there are instances when they need to download helpers applications


    > SaaS is a software application delivery model where a software vendor develops
    a Web-native application and operates it (either independently or through a third
    party) for use by customers over the Internet. Customers do not pay for owning
    the software; they subscribe to it and pay a regular subscription fee for using.


    > Web applications are considered to be a form of “cloud computing” because applications
    and files are hosted in the Internet “cloud,” which consists of thousands of computers
    and servers, all linked together and made accessible via the Internet.'
