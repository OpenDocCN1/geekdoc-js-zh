  md: '# CHAPTER 9 Social Applications


    FIGURE 9.61

    SlideShare offers several sharing options. When someone uploads a slideshow, it
    automatically shares with others. In addition, users can click “Share this slideshow”
    to invite people to view it, or they can share it with the general population
    by adding the link to applications such as Digg, Reddit, and MySpace.


    ![](img/ad042d15418a1098a617de420fc07871_316_0.png)


    Explaining the Impact of Twitter, Friendfeed and Social Media

    2.0

    from flickr: today | Twitter, Friendfeed and Social Media 2.0 its impact

    230 views | 0 comments | 1 favorite | 11 downloads | 4 tags (flick)


    ![](img/ad042d15418a1098a617de420fc07871_316_1.png)


    An interesting by-product of sharing is that it may help users increase their
    reputation in the community—recognizing them as experts in some fields (see the
    REPUTATION pattern earlier in this chapter). In addition, sharing is the foundation
    of social interaction. For a community to thrive (and survive), whether online
    or offline, it’s essential that it support sharing and improve participation and
    interaction among its community members.


    # How


    Porter (2008) identified two types of sharing: implicit and explicit. Implicit
    sharing occurs when content is shared by virtue of users’ participation in a community.
    For example, when users bookmark a page on Delicious, upload photos to Flickr,
    or put videos on YouTube, these are implicitly shared with the rest of the community,
    unless they are marked as private. Implicit sharing doesn’t require any specific
    action from other users. Items are shared with community users as soon as they
    are posted or made available to the application (Figure 9.62). Explicit sharing,
    on the other hand, requires users to send an explicit message, usually via an
    email, to access content on applications such as Google Docs, Zoho, Delicious,
    and others.


    ALLOW USERS TO SHARE CONTENT VIA EMAIL


    The most basic sharing feature is to allow users to send interesting content (e.g.,
    news stories, recipes, photos, videos, travel plans) via email. Allow users to
    share content entering one or more recipient names and their email addresses (and
    their own information to let recipients know who is sending the information).
    The shared content may be part of the email or as a link'
