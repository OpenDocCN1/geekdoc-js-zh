    and max-width attributes, use of JavaScript is required to ensure that the design
    works correctly on all browsers (Fulcinini, 2005; Jesse, 2007a, 2007b).


    # Related design patterns


    PROGRESSIVE LAYOUTs provide a graceful solution to counter arguments against designs
    using fixed- or liquid-width layouts, depending on the nature of the content presented
    by the application, either FIXED-WIDTH LAYOUT or LIQUID-WIDTH LAYOUT may be more
    appropriate and should be considered during design.


    # GRID STRUCTURE


    # Problem


    Users need to clearly see and understand relationships between different page
    elements. Not using a systematic approach to lay the page and its elements may
    lead to a cluttered design and make it appear unnecessarily complex.


    # Solution


    Use a grid-based system for placing and aligning web page elements, giving web
    pages a visual structure and coherence and making it easy for users to understand
    the content’s organization (Figure 12.8).


    ![](img/ad042d15418a1098a617de420fc07871_387_0.png)


    **FIGURE 12.8** Using GRID STRUCTURE for positioning and aligning page components
    this page is quite obvious. Not only does this make the page pleasing to the eye,
    but it also makes it easy to discern the visual hierarchy of page components (see
    the VISUAL HIERARCHY pattern next).'
