    # SUPPORT BROADCAST MESSAGES


    Although one-to-one communication between users is effective via messaging options
    such as chat and email, users may want to write a message for everyone to see.
    It is a broadcast message rather than a message targeted to a specific person
    in the network. Several different terms are in use today to indicate this feature,
    such as *walls* (e.g., Facebook), *scraps* (e.g., Orkut), and *comments* (e.g.,
    MySpace) (Figure 9.56).


    # ALLOW USERS TO INDICATE THEIR MESSAGING PREFERENCES


    Because broadcast messages, such as comments and scraps, are part of a user''s
    profile, they are visible to anyone is granted access to profiles. However, allow
    users to manage permissions so that they can specify who can write and view comments
    (Figure 9.57). Once set, it''s important that these preferences are clearly indicated
    on users'' profile pages (Figure 9.58).


