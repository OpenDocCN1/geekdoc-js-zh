  md: '# USE CONTRAST TO ESTABLISH VISUAL HIERARCHY


    Contrast is a key design approach used to communicate visual hierarchy. It is
    created by visual difference between elements—the more elements are different,
    the higher the contrast between them. In general, higher-contrasting elements
    grab users'' attention first when compared with lower-contrasting elements. For
    example, black has the highest contrast with white and varying levels of contrast
    with different shades of gray. Value is not the only way two elements can contrast
    from each other. Contrast can also be created by using one or more of the following:
    size, texture, shape, color, and orientation (Figure 12.14).


    By using a combination of these visual forms, an effective visual hierarchy can
    be designed, and desired elements can be emphasized to draw users'' attention.
    Contrast can be applied to page elements at the text level as well. For example,
    headings and subheadings can be made to stand out from the rest of the text by
    using contrast forms such as size and color (Figure 12.15).


    Figure 12.14

    The primary forms of contrast. (Source: From Routledge, 2007.)


    ![](img/ad042d15418a1098a617de420fc07871_392_0.png)


    Figure 12.15 Blogger establishes a visual hierarchy by using a large, colorful,
    high-contrasting logo; then moves users'' attention to the center area with a
    prominent call to action, “Create Your Blog Now"; then to the images, and so forth.'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'It’s important to remember that contrast does not just refer to background-foreground
    contrast but also about the contrast (i.e., differences) among page elements.
    If the background-foreground contrast is high, the contrast among page elements
    is low, the web page will fail to establish a clear visual hierarchy. This can
    also make the page appear cluttered and disorganized to users who will struggle
    to navigate through the page design to determine what to attend to first, second,
    and so forth.


    # GROUP RELATED INFORMATION VISUALLY


    By grouping information visually and clearly indicating what the group represents,
    users can quickly decide whether to pay attention to it. When designed correctly,
    grouping makes pages simpler because it’s easier for users to filter out (i.e.,
    ignore) not-so-relevant information and focus on the areas of interest (Figure
    12.16).


    Visual hierarchy is important for both groups and elements within groups. Once
    users decide to focus on a logical group, they should be able to understand the
    importance of elements within the group to indicate their importance. In 12.16,
    Crazy Egg examples them in the “Let’s Get Started” section, “Create a Test” is
    higher in the visual hierarchy than the text “Setting up a test . . .


    # PLACE PERSISTENT ELEMENTS IN CONSISTENT LOCATIONS


    Persistent elements on a page—that is, elements that appear on almost all pages
    within the application as logos, navigation, headers, and so


    ![](img/ad042d15418a1098a617de420fc07871_393_0.png)


    **FIGURE 12.16** Crazy Egg groups different areas of the page using colors, font
    sizes, and white space to not only establish a good visual hierarchy but also
    to make the page appear simpler and visually pleasing.'
