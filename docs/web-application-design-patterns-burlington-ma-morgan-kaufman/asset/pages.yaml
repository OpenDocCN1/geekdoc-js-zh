- img_proc: true
  md: '# Why


    A grid offers a consistent approach for designers to position and align various
    elements on a page and create appropriate visual hierarchies such that the resulting
    layouts are visually pleasing and easy to use. Laying out and aligning elements
    using grids not only makes the pages appear simpler and visually pleasing, but
    the consistent placement of components within the grid makes the application easier
    to navigate as well.


    # How


    When using a grid, pages are divided into rows and columns, and grid lines are
    used to position and align page elements. The grid of rows and columns itself
    may be established using the rule of thirds or using columnar grids that create
    units in multiples of threes (Figure 12.9); Baird, 2007; Vinh and Boulton, 2007).


    Once the grid is established, the next step is to position elements on the page
    that will be consistent throughout the application, such as logs, navigation (primary,
    secondary, and utility), headers, footers, and so forth. However, if content changes
    from one page to another, which may often be the case for web applications, it
    may be beneficial to position content within the grid first. The benefit of this
    "content-first" approach is that after placing the most important content on the
    page, it should become pretty clear which navigation should be placed at the top
    or on the sides (left or right). For example, if content, such as reports or search
    results, demands horizontal space on pages, positioning navigation at the top
    may be the most appropriate.


    Unlike printed pages, which have a fixed width and height, web pages provide limited
    control for vertical content, especially with a varying amount of


    ![](img/ad042d15418a1098a617de420fc07871_388_0.png)


    **FIGURE 12.9** Among common columnar grids for web page layout are those based
    on the rule of thirds, which divides pages into rows and columns (a) or using
    only columnar grids in units of threes or fours (b).'
  merge: -1
