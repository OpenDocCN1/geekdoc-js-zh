    However, one has to be careful and not use too many colors or text sizes in a
    tag cloud. Using too many colors can make the tag cloud cluttered and difficult
    for users to distinguish among tags. In general, do not use more than three colors
    combined with text sizes to indicate tag popularity.


    # DETERMINE TAG ORDER BASED ON USERS'' TASKS


    Tags in clouds are generally ordered alphabetically. This makes finding a tag
    faster, especially as the tag set becomes larger (Halvey and Keane, 2007). A study
    by Rivadenaera et al. (2007) provides evidence in favor of a frequency-based layout
    over an alphabetical layout when the users'' task is to form an impression about
    the "tagger." In applications where users'' tasks may vary, it may be useful to
    allow users to organize tags several different ways (Figure 5.28).


    # Related design patterns


    Because of the associative nature of navigation, TAG CLOUDS should not be used
    as the only means of navigation within web applications. They should supplement
    PRIMARY NAVIGATION and SECONDARY NAVIGATION as well, if applicable.


    ![](img/ad042d15418a1098a617de420fc07871_146_0.png)


    FIGURE 5.28 Delicious allows users to view tags as clouds or lists, sort them
    alphabetically or by frequency, filter them by minimum number of occurrences,
    and so forth.'
