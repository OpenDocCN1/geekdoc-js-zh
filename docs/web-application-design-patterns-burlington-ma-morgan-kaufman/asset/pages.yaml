    # Accessibility


    Specific types related to error messages from form validation


    +   * **Color perception**: Avoid using colour to convey information. That is,
    use colour to clearly label error messages and success messages mean ''bad'' but
    not everyone can distinguish red from green - so include the ''bad'' text as well

    * **Navigation**: Consider moving focus to the area on the page where an error
    occurred or providing a quick way for users to jump down to the problem

    * **Workflow**: If multiple errors occur, provide users with a summary or indication
    of the number of errors


    General techniques for form accessibility:


    +   * **Labels**: Clearly label form elements. Use the <label> tag to explicitly
    label form labels with their controls

    * **Sequence**: Ensure fields are laid out in a logical order and can be easily
    controlled with the keyboard and other input devices. Use tab order to control
    navigation

    * **Sections**: Group related elements using the <fieldset> tag when tapping through
    elements


    FIGURE 13.9 Fluid Source Design Pattern Library lists accessibility considerations
    for its patterns. This example shows the accessibility considerations for the
    LIST BUILDER pattern (see [www.uidesignpatterns.org/content/list-builder]).


    # CONSIDER INCLUDING ANTIPATTERNS


    Antipatterns are inappropriate solutions that appear to be good solutions to a
    given problem; they are also referred to as pitfalls (Gamma et al., 1995). Although
    not mentioned by Christopher Alexander (Alexander et al., 1977), who proposed
    the notion of patterns, some may benefit from including antipatterns in the pattern
    library if the use of inappropriate design solutions seems to be a common practice.


    A good example is the HOVER & COVER pattern noted by Scott (2008), who described
    it as when the hover hides important contextual information around the object
    or gets in the way of other actions (Figure 13.10). Antipatterns observed by Scott
