    # ALLOW DISCOVERY OF FRIENDS BASED ON EXISTING CONNECTIONS


    Allow users to explore their friends'' profiles and view friends'' to make it
    possible for them to discover common friends they didn''t know were part of the
    community. In addition, rather than making users browse friends'' profiles to
    discover common friends, the application can periodically discover friends from
    users'' connections they may know.


    # ALLOW USERS TO SEARCH OTHER COMMUNITY MEMBERS


    Allow users to search for people (Figure 9.42) in addition to allowing them to
    discover members based on their profiles, address books, and buddy lists (see
    SAMPLE SEARCH AND PARAMETRIC SEARCH in Chapter 6).


    # REQUIRE CONFIRMATION OF “FRIEND” REQUESTS


    While it''s easy to find network members whom users may want to connect (i.e.,
    a “friend”), it should not be an automatic process. It is important that requests
    to “friend” someone are acknowledged and confirmed before adding to their friends
    list. In addition, when accepting a request to become a friend, it helps to indicate
    the nature of their relationship. Information can be used to update profiles (and
    make them more complete) and further discover network members with whom users
    can connect.


    # SUPPORT THIRD-PARTY INTRODUCTIONS


    Users may want to “friend” with users they do not know. Although users should
    be permitted to send direct requests to add them to their network, if there’s
    a mutual friend that both users know, allow them to be introduced. This may help
    reduce hesitation on the part of both users in becoming friends.


    # ALLOW USERS TO “FOLLOW” OTHERS


    Offer another recently popular “friending” approach called “following,” where
    users can visit others’ profile pages and choose to “follow” their activities
    (or “status” in Twitter’s case) (Figure 9.43).'
