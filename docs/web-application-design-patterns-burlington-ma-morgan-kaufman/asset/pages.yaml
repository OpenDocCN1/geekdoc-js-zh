  md: '# CHAPTER 12

    Visual Design


    # INTRODUCTION


    Although web applications are designed to facilitate task completion, visual design
    of them shouldn''t be ignored. Not only does visual design play an important role
    in how usable an application is perceived (Kurosawa and Kashimura, 1995; Tractinsky,
    1997), but it also affects how credible it is considered by users (Fogg et al.,
    2002).


    Among the first decisions that web application designers make is whether application
    content should adjust to the browser width (LIQUID-WIDTH LAYOUT) or remain the
    regardless of its width (FIXED-WIDTH LAYOUT). Although usability and accessibility
    generally favor liquid-width layouts, page aesthetics are often compromised with
    excessively large or small browser widths. Using a PROGRESSIVE LAYOUT with defined
    minimum and maximum widths is a reasonable compromise because not only can it
    maintain the aesthetic integrity but also better accommodate users who have higher-
    low-resolution monitors.


    The next step is related to the placement and alignment of page elements to aid
    users by providing a clear visual page structure (GRID STRUCTURE, VISUAL HIERARCHY).
    Designers also may make certain page elements stand out (HIGHLIGHT) or use images
    that indicate important states and actions (ICONS) to further assist users in
    navigating pages and features.


    Visual design involves carefully balancing components: layout, colors, graphics,
    fonts, and so. On several books have been written on both the theory and practice
    of these components for web design (e.g., Baird, 2007; Lidwell et al., 2003; Mcintyre,
    2008; Wroblewski, 2002). This chapter, emphasizes visual design patterns that
    are relevant for web application. Best practices for incorporating other elements
    to create an effective design (e.g., color, size and proportion, typefaces), though
    not discussed, are important and must be considered for all designs.'
  merge: -1
  pgno: 379
