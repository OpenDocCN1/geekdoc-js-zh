    For your convenience, these documents will be emailed to your Yahoo! Mail account.


    ![](img/ad042d15418a1098a617de420fc07871_73_0.png)


    FIGURE 3.13 CAPTCHA on Yahoo!''s registration page.


    Decoding distorted images is used as a validation that a user is human and not
    an automated agent, since automatically decoding a distorted image is computationally
    intensive. This method is referred to as CAPTCHA, which stands for Completely
    Automated Public Turing test to tell Computers and Humans Apart (Ahn, Blum, and
    Langford, 2004).²


    # Why


    An increasing number of automated crawlers on the Web have difficulty to distinguish
    from legitimate users. By asking users to do something that is relatively easy
    for humans but difficult for automated crawlers, the use of CAPTCHA makes it difficult,
    if not impossible, for bots and crawlers to interact with the application and
    submit forms.


    # Why


    CAPTCHA images typically have about four to five distorted alphanumeric characters;
    the alphabetical characters in the image may include both uppercase and lowercase
