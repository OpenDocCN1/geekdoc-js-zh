  md: 'FIGURE 9.63

    SlideShare allows users to share a presentation to a variety of web applications.


    ![](img/ad042d15418a1098a617de420fc07871_318_0.png)


    # SET UP PERMALINKS


    Permalinks are permanent URLs for web content and make it easy to link to a specific
    blog or forum post. Content that may move from its current location (e.g., home
    page or the front page of a blog) benefits from having a permalink because the
    link does not change and makes it easy for other users to link to it.


    For example, with blogs, the main blog page changes as new entries are posted.
    When a blog entry first appears, it may be at the top of the page and then moves
    down as more entries appear, eventually pushed to a different page. To make sure
    that users can access any time in the future, allow users to access it using its
    permalink.


    Permalinks are also useful when content is likely to be linked from sources other
    than the application providing the content. In addition, permalinks are typically
    designed to be easier to read compared to the original URL.


    Using the format shown in the following Tip allows search engines to extract permalinks
    and establish the relationship between the documents rather than deciphering the
    relation from the anchor (i.e., `<a>` tag).


    > TIP

    Include the permalink of a page within the HTML using rel="bookmark" as follows:

    <link rel="bookmark" href="permalink URL" />


    # ALLOW CONTENT TO BE EMBEDDABLE


    Allow content such as videos, music, threaded discussions, and so forth to be
    shared by making it embeddable in applications other than where the original content
    resides. Make embedding content easy by offering users the necessary HTML (or
    JavaScript) to copy and paste it on a web page of their choice (Figure 9.64).'
