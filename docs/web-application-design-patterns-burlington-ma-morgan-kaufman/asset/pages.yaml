    Similarly, to facilitate reuse by developers, include code snippets in HTML, CSS,
    JavaScript, PHP, ASP, JSP, and so on, as appropriate for a development team, to
    make it easy for them to copy and paste snippets in their code when building the
    application (Figure 13.5).


    When offering software components for reuse, it''s important to test them for
    necessary cross-browser compatibility, performance, and interaction with other
    components before including them in the pattern library. It is also important
    to emphasize that components may not be completely pluggable solutions and may
    require some updates and tweaking. As development practices and technology change,
    review and retest components to ensure their continued usefulness.


    # INCLUDE MANY, MANY EXAMPLES


    By definition, patterns prove their merit by their use patterns (Winn and Calder,
    2002). Without clear evidence of successful use, patterns may have limited “strength.”
    Alexander’s patterns (Alexander et al., 1977) and a few user-interface design
    pattern collections (Bochers, 2001; Graham, 2003) usually indicate the strength
    of a pattern using a star-rating system. Graham (2003, p. 52) states:


    Again, following Alexander, we have classified the patterns according to our degree
    of confidence in them. The pattern’s “star rating,” shown next to it in orange,
    indicates this. Three stars mean that we are totally convinced of the pattern’s
    efficacy, having used it or seen it used successfully on many projects. Three
    stars may also appear, especially for abstract patterns, that there is a solid
    theoretical derivation or justification of the pattern in the literature and folklore
    of the subject. If there are no stars it means that we think this is a good idea
    but would like people to try and see. One and two stars are interpreted on the
    scale between these extremes in the evident manner.'
