  md: '# add accounts. CHECKING, SAVINGS, CREDIT & BROKERAGES NOW SUPPORTED!


    ![](img/ad042d15418a1098a617de420fc07871_123_0.png)


    **FIGURE 4.36** Mint offers help with initial account setup. They show the page
