    # SIMPLE LIST


    # Problem


    Users need to be presented with a list of items with one to a few attributes,
    and each item could be associated with one or more actions. In addition, the items
    to be presented do not need to be sorted or compared on any of the attributes.


    # Solution


    Show users simple list of items with associated actions (Figure 7.1).


    # Why


    Users’ familiarity with lists makes it a very effective design approach to present
    a set of items, especially when items are primarily text based and have basic
    actions associated with them. For example, lists are commonly used on dashboards
    and portals (see Chapter 4), where users are shown a list of items such as to-dos,
    to refer websites, most popular products, and so forth (Few, 2006).


    # How


    Show simple lists as either numbered or nonnumbered lists. Numbered lists are
    especially useful when numbers represent the item’s rank order, such as the top
    10 movies of the week or the top 10 news stories (Figure 7.2).


    Considering using icons or other symbols with nonnumbered lists to improve the
    list’s visual impact or to indicate the type of item. In addition, lists may use
    alternate shades of background color or a line separator to improve readability
    of closely spaced list items (Figure 7.3).'
  merge: -1
