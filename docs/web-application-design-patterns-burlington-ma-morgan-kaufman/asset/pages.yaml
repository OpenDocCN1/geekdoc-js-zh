    # GROUPS AND SPECIAL-INTEREST COMMUNITIES


    # Problem


    Users need a way to connect with those with similar interests and experiences
    so that they can learn, share their knowledge and opinions, build relationships,
    grow professionally, grow their networks, and so forth.


    # Solution


    Allow users to join and create groups, also referred to as forums or online communities
    (Figure 9.47).


    # Why


    One of the reasons users participate in community-based applications is to connect
    with those who share similar interests and experiences. Enabling users to create
    groups and connect with others is therefore essential because it contributes to
    a sense of community and encourages participation. For companies, forums and communities
    are also useful for customer support because they allow customers to help each
    other, and in the process, reduce support costs.


