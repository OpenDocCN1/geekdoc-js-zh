  md: '# Tag Clouds


    ![](img/ad042d15418a1098a617de420fc07871_143_0.png)


    **5.23** OfficeDepot shows related items both for up-sell and cross-sell.


    watching a video of an Olympic’s swimming event, you may be interested in watching
    other videos with the same athlete in other Olympics.


    # Solution


    Use tag clouds to show users the tags for individual items they are viewing along
    with “strength” or importance in describing those items. In addition, allow users
    to navigate the information space using the tags in the tag clouds (Figure 5.24).


    # Why


    Unlike navigation approaches discussed so far, which are designed to be persistent
    and support both navigation and orientation, tag clouds work as an associative
    navigation mechanism and facilitate the discovery of new content (Kalbach, 2007).
    This associative navigation supports three forms of information exploration (Smith,
    2007):


    +   * Pivot browsing. Users may choose a new reference point, a pivot, for exploring
    the information space.'
