    # Related design patterns


    Aligning page elements is extremely important for establishing appropriate VISUAL
    HIERARCHY and for guiding users through page elements. GRID STRUCTURE is typically
    used to ensure proper alignment of page elements and to facilitate content scanning.
    Knowing visual hierarchy of the page is also important for SEMANTIC MARKUP (see
    Chapter 11). The order of elements in the page markup should reflect the desired
    visual hierarchy so that when the page is rendered without style sheets and images,
    the visual hierarchy of page elements is still maintained.


    # HIGHLIGHT


    # Problem


    Certain page elements need to stand out and grab users'' attention, not only to
    establish their importance (VISUAL HIERARCHY) but also in response to users''
    actions (e.g., selecting an element) or to communicate to users a status change
    for page elements or individual data items.


    # Solution


    Highlighted selected or changed elements direct users'' attention to them (Figure
    12.18). If necessary, indicate the “value” or extent of the change.


    # Why


    Highlighting is important to provide a visual feedback about selected elements
    as well as to direct users'' attention to changes. It is also useful in the following
    ways (Mahemoff, 2006):


    +   - Showing which particular element has focus.'
