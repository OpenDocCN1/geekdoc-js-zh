  md: '# About the Author


    Pawan Vora is the founder and president of Alpha Cube, Inc., a user experience
    design consultancy focused on designing, reviewing, and evaluating user interfaces
    for software and web-based applications.


    He has been a user experience professional for more than 14 years and has designed
    user interfaces for a range of applications for business-to-consumer, business-to-business,
    consumer-to-consumer, and business-to-employee environments. He has published
    and conducted a number of tutorials and in-house training workshops on web site
    design, web application design, and design patterns in the United States and internationally.


    Pawan has a Ph.D. and M.S. in industrial engineering from the State University
    of New York at Buffalo in addition to his bachelor’s degrees in production engineering
    and mechanical engineering from Victoria Jubilee Technical Institute in Mumbai,
    India.'
