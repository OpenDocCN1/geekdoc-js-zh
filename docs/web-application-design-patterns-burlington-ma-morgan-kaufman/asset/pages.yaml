  md: '# Registration


    Calbucci (2008) found that removing CAPTCHA from the registration form improved
    the conversion rate by 9.2 percent on Sampa (www.sampa.com).


    # CONSIDER THE “LAZY” REGISTRATION APPROACH


    As mentioned, registration is often an interruption in users’ interaction experience.
    Therefore, delay registration as much as possible and allow users to explore the
    application before asking them to register. For instance, Morningstar asks users
    to register or log in when they land on a page that requires them to provide sensitive
    information (e.g., creating an investment portfolio) or when they are accessing
    content for paying customers.


    To make the registration process as efficient as possible, even when it is delayed,
    one is to use a “lazy” registration approach, which is collecting information
    about users using browser cookies as they interact with the application. As Mahemoff
    (2006) states:


    +   As the user interacts with the application, the account accumulates data.
    In many cases, the data is explicitly contributed by the user, and it’s advisable
    to expose this kind of information so that the user can actually populate it.
    In this way, the initial profile may be seen as a structure with lots of holes.
    Some holes are eventually filled out automatically by the user himself. (475)


    By collecting information in the background, users are presented with the registration
    form, some of the registration fields can be prepopulated, requiring users to
    verify collected information rather than enter it. For example, if a user signs
    up for an email newsletter, the application has the user’s email address, which
    can prepopulate the registration form.


    # CONSIDER ELIMINATING REGISTRATION


    Offer users the option to access without registering in applications where they
    may just to complete transactions quickly. This is common in e-commerce applications,
    especially those that support gift registries, where users may just want to purchase
    a gift and leave the application (Figure 3.5). Users may be prompted to register
    at the end of the transaction (or checkout process) with clearly listed benefits
    for doing so (e.g., track the order).


    # CLEARLY INDICATE REGISTRATION BENEFITS


    For web applications where it is not possible to delay registration, clearly indicate
    registration benefits to users (Figure 3.6).


    For many applications, listing benefits may not be sufficient, especially when
    registration is not free. In such instances, offer users the option to take a
    guided tour that explains the benefits of using the application and/or allow them
    to set a free-trial account for a limited time period or with restricted functionality
    (Figure 3.7).'
