  md: '# LIMIT THE NUMBER OF STEPS IN THE WIZARD


    When developing wizards, the number of steps needed must be balanced with the
    amount of information asked from users on each step. Users should feel that they
    are making good progress through the wizard and that each page shows logically
    grouped information. At the same time, they shouldn''t feel that most of their
    time is spent waiting for refresh to go to the next step. Nor should they feel
    have to backtrack often to change information provided in previous steps. Typically,
    wizards shouldn''t require more than five to seven steps to accomplish a task
    (Wickham et al., 2002).


    # CLEARLY SHOW WIZARD STEPS


    Show each step in the wizard as either a set of horizontal steps or tabs (Figure
    5.35) or vertically as a list or table of contents. The latter is preferred when
    one or more steps may have substeps. Usability tests for desktop-application wizards
    showed vertical placement of steps to be more effective than horizontal placement
    (Wickham et al., 2002). However, vertical placement may require additional space
    and may have to traded off against content to be presented for each step.


    # BEGIN WITH AN OVERVIEW PAGE FOR VERY INFREQUENTLY USED WIZARDS


    For wizards used infrequently (perhaps, only once), as initial configuration or
    application setup, use an overview page to explain and introduce the process and
    its steps (Figure 5.36).


    ![](img/ad042d15418a1098a617de420fc07871_153_0.png)


    **Figure 5.35** Washington Mutual shows the steps for opening an account horizontally
    above the form.


    ![](img/ad042d15418a1098a617de420fc07871_153_1.png)


    **Figure 5.36** Citibank provides an overview page that outlines steps included
    in the wizard for opening an EZ Checking account.'
