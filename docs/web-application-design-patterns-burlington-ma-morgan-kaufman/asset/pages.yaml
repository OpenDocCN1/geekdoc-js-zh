    # FACETED NAVIGATION


    # Problem


    Items as wines, diamonds, recipes, cameras, computers, and many others can be
    classified along several attributes. For example, wines can be classified based
    on their type (e.g., red, white), region (e.g., California, France, Spain, Australia),
    price (e.g., less than $20, $20–$30, etc.), and several others. Thus, there is
    no one widely accepted hierarchical structure that can be used for navigation.
    In fact, a navigation scheme can be devised for each attribute it carries. Designing
    a navigation approach based on just one attribute would make navigation inefficient
    and unsatisfactory to a large number of users.'
