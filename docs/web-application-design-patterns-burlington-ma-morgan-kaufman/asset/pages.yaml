  md: '# Praise for Web Application Design Patterns


    This is the type of book you''ll want to read with your entire team and a flip
    chart because every page will produce a list of actionable changes for the applications
    you''re developing. Pawan Vora has produced an amazing catalogue of the essential
    patterns for designing today''s web-based applications.


    +   - Jared Spool, Founding Principal, User Interface Engineering


    A generation has watched the Internet work into every very part of society as
    talented designers and developers have explored new user interfaces and the most
    robust design patterns have emerged through the refining fire of millions of users.
    Pawan Vora has done a wonderful service in capturing these best practices in Web
    Application Design Patterns. This book will be valuable to people ranging from
    putting their first website to those shaping corporate experiences, and from practitioners
    to researchers benchmarking existing patterns as new interface paradigms are created.


    +   - Annie Lued, User Experience Director, Microsoft


    Web Application Design Patterns is a must-read if you are in the business of designing
    web applications, or if you simply want to understand the elements of a well-designed
    web application. Pawan Vora has condensed best practices, along with research
    and his solid experience, to create a useful reference about designing web applications.
    Even if you skin the book and look at the designs, it will spark creative design
    ideas.


    +   - David Dick, Senior Member of STC, User and UX Special Interest Group


    Excellent! A very complete and exhaustive overview of patterns for web applications
    with many previously undocumented patterns. This book is written in a very accessible
    way and will tell you (nearly) everything you need to know when designing web
    applications. A must-have for any designer!


    +   - Martijn van Welie, Pattern Author, Philips Design'
