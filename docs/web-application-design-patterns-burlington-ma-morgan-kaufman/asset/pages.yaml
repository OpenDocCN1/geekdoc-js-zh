  md: '# CHAPTER 5 Navigation


    page. Because of their placement primary and secondary navigations,

    breadcrumbs shouldn''t visually compete for attention or distract users from

    the main navigation mechanisms.


    # Related design patterns


    Breadcrumbs should be given lesser emphasis than other important elements

    on the page, such as the page title, PRIMARY NAVIGATION, and SECONDARY

    NAVIGATION (see VISUAL HIERARCHY pattern in Chapter 12).


    # WIZARDS


    # Problem


    Users need to complete several steps in a specific order to complete a task (e.g.,nchecking
    out an item on an e-commerce site, making reservations, filing taxes,

    and so forth). Because most users are going to perform the task occasionally,

    they may not acquire enough familiarity or expertise to remember the steps

    and their order for successfully accomplishing it.


    # Solution


    Guide users through steps, one at a time, in a predetermined sequence (Figure

    5.32). Such interfaces are commonly referred to as *wizards*.


    ![](img/ad042d15418a1098a617de420fc07871_150_0.png)'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Wizards 137


    # Why


    Wizards are useful when users must go through a specific sequence of steps and
    perform a set of individual tasks in succession (e.g., checkout for e-commerce
    applications or opening an account with a financial institution). They are also
    useful for complex tasks with branches or dependencies among elements, which require
    considerable domain knowledge to complete (Dryer, 1997).


    By breaking these tasks into smaller steps and guiding users through each step,
    wizards hide the complexity of the underlying task. They require users to focus
    on only a few elements at a time and let the application keep track of what they
    have done and still need to do. Additionally, by guiding users through each step,
    errors are minimized and the chances of users successfully accomplishing the task
    are improved. Finally, wizards are also useful when a task is critical for accomplishing
    users'' goals (Wickham et al., 2002). For example, in e-commerce applications,
    checkout is a critical task for purchasing items.


    # How


    As a first step, identify all information or groups of information and the order
    in which they need to be presented to users to complete the desired task. In addition
    identify any dependencies or branches between them to ensure that the dependent
    tasks occur later in the sequence. For example, in an e-commerce checkout process,
    shipping information comes before payment information because the shipping address
    and shipping options (such as delivery timeframe, tax-exempt status, and so forth)
    are used to calculate and shipping charges, which contribute to the total price.
    After knowing the total price users should be asked for billing and payment information.
    Once information, grouping, and order are identified, break them up into individual
    steps so that logically related groups are together.


    Once the steps, sequence, and branching decisions, if any, are made design pages
    in a wizard style—that is, each step is on a separate page and allow navigation
    between them with “next” or “continue” and “previous” or “back” actions (Figure
    5.33).


    Although typical wizard implementation uses individual steps on separate pages,
    a recent trend is to use an accordion interface design approach (Figure 5.34).
    This design shows all the steps on the same page, like a wizard, makes only one
    step visible at a time. As users choose to go to the next step, the current step
    is collapsed and information corresponding to the next step is expanded and made
    available. Users may go to any previous step by clicking the corresponding step
    heading, which expands that step and collapses the current step. This design approach
    is effective for wizards with just a few steps because the headings that represent
    steps and facilitate navigation can take up excessive space on the page, leaving
    little room for content in each step.'
