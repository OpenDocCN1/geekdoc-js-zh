- img_proc: true
  md: '# Semantic Markup


    content paragraphs is not created using markup as <p>&nbsp;</ and markup doesn''t
    include &lt;ul&gt; or &lt;blockquote&gt; tags to achieve indentation.


    # Why


    With semantic markup, users accessing a web application using screen readers or
    browsers with limited or no support for style sheets or scripting languages will
    be able to understand the content structure, the relationship among page elements,
    and the nature of content inside an element. This is extremely important for users
    with screen readers, which ignore style sheets and allows users to navigate using
    structural markup—for example, JAWS for Windows, a screen reader allows users
    to navigate page headings using the "h" key. In absence of semantic markup, navigating
    among page elements and accessing appropriate sections within the page can become
    extremely difficult (Cannon, 2008).


    Using semantic markup with UNOBtrusive CSS facilitates a clear separation of structure
    and presentation and affords the largest reach by supporting a variety of browsers
    and devices. In addition, separating page structure from its presentation design
    makes it possible to easily adapt and optimize the presentation for different
    devices and technologies.


    # How


    > In markup, semantics is concerned with the meaning of an element and how that
    element describes its content contains. ~ Molly E. Holzschalg


    At most basic level, using semantic markup requires selecting and using HTML tags
    that match the desired intent of element and not on their presentational effect
    as interpreted by browsers. For example, the &lt;blockquote&gt; is intended to
    quote from an external source and not to indent text contained within the &lt;blockquote&gt;
    tags. Similarly, to emphasize text, the &lt;em&gt; tag should be used instead
    of &lt;b&gt;. Although &lt;b&gt; and &lt;i&gt; are elements not deprecated, even
    in recent versions of HTML or XHTML, where the &lt;em&gt; and &lt;strong&gt; are
    more appropriate for emphasizing words or phrases. Screen readers can use a different
    inflection when encountering them in text and convey the emphasis.


    Similarly, headings, paragraphs, and lists within a page should be made with available
    HTML markup tags such as &lt;h1&gt;, &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;ol&gt;,
    and so forth, and not with tags such as &lt;div&gt; or &lt;span&gt;, which do
    not have any inherent meaning.


    # STRUCTURE DOCUMENTS USING HEADINGS AND LISTS


    Organize web pages using heading-related tags such as &lt;h1&gt;, &lt;h2&gt;,
    &lt;h3&gt;, and so on. Heading establish page structure and help users identify
    page hierarchy. Users interacting with the page using screen readers or other
    assistive technology can also use the page structure to navigate (the ACCESSIBLE
    NAVIGATION pattern later in this chapter). They can jump from'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'first-level headings (i.e., &lt;h1&gt;), second-, third-, or lower-level headings
    (i.e., &lt;h2&gt;, &lt;h3&gt;), and so forth). They can also use assistive devices
    to "listen" to the page''s outline in order to understand the page''s structure
    (Cannon, 2008). For sighted users, using HTML-based headings helps determine the
    page''s visual hierarchy because web browsers style headings in larger and bolder
    fonts than the rest of the text, when style sheets are applied.


    Similarly, navigation menus, submenus, and lists within pages should be marked
    up using lists (&lt;ol&gt;, &lt;ul&gt;, &lt;dl&gt;, etc.). A general rule of thumb
    is to use ordered lists (&lt;ol&gt;) for lists that suggest some form of sequence
    or priority ordering, unordered lists (&lt;ul&gt;) for lists that have items without
    any suggested sequence or ordering, and definition lists (&lt;dl&gt;) for the
    items in the list consist of a term (marked up using &lt;dt&gt;) and its description
    (marked up using &lt;dd&gt;).


    # USE STYLEETS FOR LAYOUT AND PRESENTATION


    Use CSS to control the presentation and layout of a web page. Put all declarations
    in a separate file to easily enable updates (see also the UNTRUBUSIVE STYLE SHEETS
    pattern).


    Do not embed deprecated style-related markup in a page using tags as &lt;font&gt;,
    &lt;b&gt;, and so forth. In addition, do not use deprecated tags—that is, HTML
    tags that are no longer part of the HTML specification. The Ultimate HTML Reference
    (Lloyd, 2008) lists the following elements as deprecated: &lt;apple&gt;, &lt;base-font&gt;,
    &lt;center&gt;, &lt;di&gt;, &lt;font&gt;, &lt;frame&gt;, &lt;iframe&gt;, &lt;isindex&gt;,
    &lt;menu&gt;, &lt;noframes&gt;, &lt;s&gt;, &lt;strike&gt;, &lt;u&gt;, and &lt;xmp&gt;
    (see also www.w3.org/TR/REC-html40/index.html for deprecated HTML 4.0 elements).


    # DO NOT STYLE SHEETS TO SIMULATE STRUCTURAL MARKUP


    Do not use CSS to give visual appearance of structural elements such as headings,
    paragraphs, and lists with &lt;span&gt; and &lt;div&gt; tags (Figure 11.1).


    ![](img/ad042d15418a1098a617de420fc07871_358_0.png)


    FIGURE 11.1 The page title in YouTube is marked up using the &lt;div&gt; element
    instead of the &lt;h1&gt;Rihanna - Disturbia&lt;/h1&gt; or &lt;h2&gt;Rihanna -
    Disturbia&lt;/h2&gt; element, making it difficult for screen readers to navigate
    the page.'
  merge: -1
