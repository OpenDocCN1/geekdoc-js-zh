    # Related design patterns


    Using JavaScript unobtrusively requires that forms be built using the principle
    of PROGRESSIVE ENHANCEMENT and that the "behavior" layer provided by JavaScript
    be completely separated from the structure and presentation layers (provided by
    SEMANTIC MARKUP and UNOBTRUSIVE STYLE SHEETS, respectively), such that its unavailability
    does not make the web application inaccessible.


    # ACCESSIBLE FORMS


    # Problem


    Forms may become difficult to use if they are designed without regard to their
    use with keyboards and assistive technology as screen readers or Braille readers.


    # Solution


    Lay out form elements and incorporate appropriate accessibility tags in the markup
    to make forms accessible to assistive technology users. At a minimum, associate
    forms with labels using `<label>` tags, group related elements using `<fieldset>`
    tags, and set appropriate sequences for tabbing through elements using tabindex
    attributes.


    # Why


    Forms are the foundation of web applications. Making them accessible is essential
    to the widest reach. Using `<label>` tags and grouping elements using `<fieldset>`
    also adds meaning to elements and helps create a semantic structure in the markup
    (see the SEMANTIC MARKUP pattern). These techniques not only make forms accessible
    for assistive technology, but they make them more usable and readable for users
    without disabilities.


    # How


    First and foremost, the patterns in Chapter 2 to make forms usable and accessible.
    Ensure that forms are organized in a logical order and that it is easy for users
    to associate a form element with its label.


    # USE <LABEL> TAGS TO IDENTIFY CORRESPONDING ELEMENTS


    Use `<label>` tags to associate field labels with their corresponding form elements
    as follows:


    ```

    <label for="firstName">First Name:</label>

    <input type="text" id="firstName" name="firstName" />

    ```'
