    # HELP COMMUNITY


    # Problem


    Even when incorporating all the help approaches discovered so far, it''s almost
    impossible to anticipate all usage scenarios and user questions. This is true
    especially for expert users, who often stretch the boundaries of the application
    and test its limits.


    # Solution


    Allow application users a venue such as discussion forums and blogs to facilitate
    sharing problems, solutions, and experiences (Figure Web.23).'
