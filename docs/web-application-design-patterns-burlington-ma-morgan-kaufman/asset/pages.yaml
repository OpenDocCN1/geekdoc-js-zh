  md: '# CHAPTER 4


    # Application Main Page


    # INTRODUCTION


    An important decision for designers is what users should see or which page they
    should be taken to after they log in to the application.


    For web applications allow access without logging in (e.g., consumer e-commerce
    applications), users either remain on the same page or are taken to the next page
    in the sequence. For example, if users decide to log in on a product details page,
    they remain on the same page. However, if they log in during the checkout process,
    they are taken to the next page in the sequence—the shipping information page.


    On the other hand, applications that require users to log in before their functionality
    show one of the following, depending on the nature of the application:


    +   - An INBOX, where users can see a list of items to view or act on.

    - A CONTROL PANEL, which serves as a launch page to access application functionality.

    - A DASHBOARD, with the at-a-glance view of the most important performance indicators.

    - A PORTAL, which aggregates information from several sources and serves as a
    launching place for information and users may access. PORTAL pages often incorporate
    some aspects of CONTROL PANEL and DASHBOARD in order to enable users to quickly
    access functionality and content supported by one or more applications.


    Main pages are typically personalized based on user profiles, interests, and information
    needs with the intention of presenting the most relevant content and filtering
    out the not-so-relevant information. PERSONALIZATION driven by business rules
    or some form of formal filtering may not be to accurately predict the information
    users may need. Thus, applications often offer users CUSTOMIZATION options to
    allow them'
  merge: -1
