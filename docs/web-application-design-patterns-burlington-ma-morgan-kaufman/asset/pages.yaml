    ALLOW USERS TO SORT DATA COLUMNS

    Sorting long lists by columns helps users find desired items quickly and analyze
    them for specific types or statuses. Its desktop counterpart, common interaction
    approach for sorting tabular data is to let users click a column heading to sort
    that column (Figure 7.10) and a second click to reverse the sort order (ascending
    or descending).


    Indicate the column attribute by which the tabular data are sorted by placing
    an arrow icon next to the corresponding column heading indicating whether data
    are sorted in an ascending (up arrow) or descending (down arrow) order. Sorting
    the data by columns and showing a sort indicator by default also suggests to users
    that the table can be sorted.


    Sorting by columns is appropriate when all possible ways users might sort data
    are available in columns. In instances where this is not possible, show sort options
    explicitly either as a dropdown list or a set of links (Figure 7.11).


    For applications that require multiple levels of sorting (e.g., reporting), provide
    the functionality separately, where users can select more than one level of sorting,
    and for each sort can indicate if sorting should be ascending or descending (Figure
    7.12). For multilevel sorting, three levels are usually sufficient.


    ![](img/ad042d15418a1098a617de420fc07871_202_0.png)


