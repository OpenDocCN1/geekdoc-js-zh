  md: '# SET UP SECURITY QUESTIONS WHEN STORING SENSITIVE INFORMATION


    Security questions for web applications that require a higher level of security


    # OPT-IN


    Ask users to opt in instead of opt out if the company supporting the web application
    plans to communicate with them in the future or send promotional information (Figure
    3.12). This is the first step to making sure email to users is CAN-SPAM compliant
    (Dixon, 2004; see also the Federal Trade Commission''s SPAM home page). The better
    practice is to use double opt-in, where upon opting in, users are sent an email
    confirmation with a link that they must click to finish the opt-in process.


    In addition, set users'' expectations by explaining how frequently they will receive
    communication and what kind messages will be sent. With the possibility of email
    communication being blocked by spam filters, ask users to adjust their spam filter
    settings appropriately or add the “from email address” to their contact lists.


    # RETURN USERS TO THE NEXT LOCAL STEP IN THE INTERACTION SEQUENCE


    Upon the completion of registration, return users to the “page of departure”—that
    is, the page from where they chose to register or were required to register.


    > CAN-SPAM is a commonly used acronym for Controlling the Assault of Non-Solicited
    Pornography and Marketing Act of 2003. It became a law on January 1, 2004, and
    applies to most businesses in the United States that send commercial email. It
    provides email recipients with the right to opt out (unsubscribe).


    ![](img/ad042d15418a1098a617de420fc07871_71_0.png)'
