  md: '# Hierarchical List


    ![](img/ad042d15418a1098a617de420fc07871_207_0.png)


    **Figure 7.19** Rally shows a “Release Task Status” list in a hierarchical order
    by indenting subtasks below parent tasks. It does the same in the “State” column
    as well.


    # How


    Make the list items ‘hierarchical’ by clearing the relationship between items
    at the parent and child levels. In addition, include and collapse conflicts for
    items at the parent level in the first column (Figure 7.19).


    Indentation is the preferred method to indicate parent–child relationships among
    items in a multilevel hierarchical list. However, for single-level hierarchies—mainly
    used for grouping of information—some of visual indication that emphasizes the
    item at the parent level is usually sufficient to show the hierarchical relationship
    (Figure 7.20).


    # WHERE APPROPRIATE, OFFER A NONHIERARCHICAL VIEW


    For hierarchical lists, the default organization (sorting method) is the tree
    structure that shows parent–child relationships. For multicolumn (i.e., multi-attribute)
    lists, users may want to sort data by another attribute. For example, in discussion
    groups, users may want to view messages in a chronological order than the default
    hierarchical order of threaded discussions. When users can sort the columns, it
    may become necessary to switch to a non-hierarchical list; however, ensure that
    users are able to return to the original hierarchical view (Figure 7.21).


    # BE CAREFUL WHEN ALLOWING US TO DELETE PARENT ITEMS


    Deleting an item at the parent level would cause all the child items, including
    other parent items within it, to be deleted. Therefore, when offering the “delete”
    option, make users aware of the action’s consequences. If “delete” action could
    inadvertently cause substantial data loss, restrict users to deletion'
