  md: '# CHAPTER 1 Introduction


    large corporations with multiple and distributed design teams, where different
    solutions may be applied for the same problems by different design groups, leading
    to inconsistent interfaces among designs produced within the same company. By
    cataloging and communicating design patterns, teams can increase consistency,
    predictability, and usability of their designs (Leacock et al., 2005) and can
    serve as a corporate memory of design expertise (Borchers, 2001).


    A common, shared language. Patterns help support and improve communication among
    team members from diverse disciplines developing a common language or vocabulary
    when explaining and discussing the design solutions (Borchers, 2001; Erickson,
    2000). This is very important because user interface designers often work in an
    interdisciplinary team with developers, application domain experts, and users
    or user representatives, and these groups lack a common terminology to exchange
    design ideas and opinions.


    Effective teaching and reference tool. Patterns can be an effective way for experienced
    designers to offer design guidance without a formal background in design (Chen,
    2003). Because of the approach used in documenting patterns, by providing visual
    and textual description, it is easier for novice interface designers to see examples
    of their successful usage.


    Usable applications. Finally, because patterns are based on a history of successful
    usage, their use can make the web application usable because interactions addressed
    by patterns would be familiar to users.


    # DOCUMENTING PATTERNS


    It''s important that patterns are documented to convey what they are, why they
    work, and how they should be applied to solve a design problem to repeat the aforementioned
    benefits. Interestingly, there is no “pattern” for documenting patterns (see Chapter
    13). Pattern authors have used a range of approaches, from those following a more
    descriptive Alexandrian notation (Borchers; 2001; Graham, 2003; Dunyne et al.,
    2002, 2006) to those following-a more structured, albeit casual and minimalist,
    approach (Laaska, 2003; Tidwell, 2006; www.weelie.com).⁴


    In this book, patterns are presented using a minimalist approach. Specifically,
    each pattern includes:


    +   * Pattern name. A short title describing the design solution. Following the
    convention used in other pattern collections, pattern names are written in CAPITAL
    LETTERS to make them out from the rest of the text.


    > ⁴To bring about the varied and inconsistent forms pattern authors have used
    and find a way to combine patterns and pattern languages from different authors
    into specific, thematic pattern collections, participants at the CHI 2003 (April
    6–7) Workshop Perspectives on HCI Patterns: Concepts and Tools proposed an XML-based
    markup language called Pattern Markup Language (PLML), pronounced “Pell-Mell”.
    For more information, see Fincher (2003).'
