  md: 'access to other functionalities within the application—it''s just that it is
    secondary in nature. For example, email applications allow users to manage contact
    lists even though managing contacts is not its primary purpose. Therefore, when
    users log in, they are first shown a list of emails, past and new. The term inbox
    is appropriate, since these are typically items that users need to attend to when
    they log in the application.


    # How


    Show users a list of items for which the application was primarily designed—emails,
    defects, accounts, to-dos, and so on—highlighting the items that users need to
    immediately attend to or be reminded of, such as new emails, new files, defects,
    and so forth (Figure 4.2).


    # ALLOW USERS TO SET UP REMINDERS


    If the application is not going to be accessed frequently and if users prefer
    to be reminded of changes in the state of one or more items (e.g., payment due
    or a new to-do item), allow them to set up reminders (Figure 4.3).


    # Related design patterns


    The INBOX pattern typically uses lists, either TABULAR LISTS or IMAGE GRIDS. In
    addition, lists they often need SORTING and FILTERING to make it easy for users
    to find relevant information (Chapter 7 for further discussion on lists).


    # CONTROL PANEL


    # Problem


    After users have logged in, they may want to access different application functions
    to perform a variety of tasks. However, which function they may want to access
    cannot be readily predicted.


    ![](img/ad042d15418a1098a617de420fc07871_95_0.png)


    Figure 4.2 Users see their email after they have logged in to Gmail. New items
    in the inbox are in bold.'
