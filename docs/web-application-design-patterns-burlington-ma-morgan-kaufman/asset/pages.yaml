  md: '# CHAPTER 12 Visual Design


    FIGURE 12.23

    Yahoo mail uses icons for both objects (e.g., "Inbox," "Drafts," "Spam," etc.)
    and actions (e.g., "Delete," "Reply," "Forward," etc.).


    ![](img/ad042d15418a1098a617de420fc07871_398_0.png)


    # Solution


    Use icons to represent commonly used objects and actions (Figure 12.23).


    # Why


    +   - For many common objects and tasks, icons are more readily recognized and
    remembered.

    - They take less space than corresponding textual links.

    - Icons typically have more universal recognition than text; when localizing a
    web application, icons, when appropriately used, have minimal layout impact. However,
    if icons are used with labels, translation should account for text expansion when
    translating to other languages (see the EXTENSIBLE DESIGN pattern in Chapter 10).


    # How


    Most important, use familiar icons (Nolan, 1989)—that is use concrete (rather
    than abstract) icons that remind users of things already known. Icons that clearly
    suggest the objects or actions they represent. Ideally, users should be able to
    recognize icons without any accompanying text labels.


    # SUPPLEMENT ICONS WITH LABELS


    Undoubtedly, there will be objects and actions that are unfamiliar to users. Therefore,
    supplement icons with labels to make actions easier to identify. During users''
    initial interaction with an application, users are more likely to rely on labels,
    but as their use continues, their interaction will become more efficient as the
    icons become familiar.


    When adding labels may take additional space, include tool tips for the icons.
    However, when dynamically changing the status of an icon, update the tool tip
    dynamically to indicate the changed state.'
  merge: -1
