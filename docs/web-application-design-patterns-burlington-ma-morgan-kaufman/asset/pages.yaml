- img_proc: true
  md: '# CHAPTER 11

    Accessibility


    # INTRODUCTION


    In the context of web applications, the term accessibility refers to designing
    web pages such that they are available to all users, including those with visual,
    physical, auditory, cognitive, or other disabilities.


    When designing accessible web applications, it''s important to follow the principle
    of PROGRESSIVE ENHANCEMENT—that is, design web pages in layers so that the basic
    content and interaction are available to all, and the more interactive (i.e.,
    enhanced) options are available as capabilities of browsers and/devices that can
    access the application increase. To allow for progressive enhancement, it''s essential
    that application use SEMANTIC MARKUP, UNOBTRUSIVE STYLE SHEETS, and UNOBTRUSIVE
    JAVASCRIPT. Because user interaction with web applications is through forms, it''s
    important they are designed to be accessible (ACCESSIBLE FORMS). In addition,
    other content presented on pages should be made accessible as well (ACCESSIBLE
    IMAGES, ACCESSIBLE TABLES, ACCESSIBLE NAVIGATION).


    Although not a preferred option, there are situations where web applications cannot
    be made accessible in their current form and an alternative design may need to
    be built to ensure accessibility (ACCESSIBLE ALTERNATIVE). This is particularly
    the case with Rich Internet Applications (RIAs). To address this concern, which
    post significant challenges to accessibility, the World Wide Web Consortium''s
    Web Accessibility Initiative (W3CWAI) has proposed a road map and working-draft
    versions for Accessible Rich Internet Applications (W-ARIA). While assistive technologies
    are catching up to W3C-WAI recommendations, designers may want to start incorporating
    proposed markup in their designs.


    Patterns in this chapter help in making web applications accessible and supporting
    the standards and regulations for web accessibility (see Standards and Regulations
    for Web Accessibility sidebar).'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# CHAPTER 11 Accessibility


    STANDARDS AND REGULATIONS

    FOR WEB ACCESSIBILITY


    Several countries have adopted different laws and standards to ensure web accessibility.
    In the United States, the applicable standards and regulations include the Americans
    with Disabilities Act (ADA), Individuals with Disabilities Education Act (IDEA),
    and Section 508 of the Rehabilitation Act of 1973.


    Perhaps the most important and comprehensive guidelines are the Web Accessibility
    Initiative''s (WAI!); Web Content Accessibility Guidelines 1.0 (WCAG 1.0) and
    WCAG 2.0 in meeting the accessibility needs of the Web and complying with the
    regulations just noted. These guidelines detail how developers can make their
    web sites and web applications usable for people with disabilities and are based
    on the following four principles:


    +   1. Perceivable. Information and user interface components must be presentable
    to users in ways they can perceive.

    2. Operable. User interface components and navigation must be operable.

    3. Understandable. Information and the operation of a user interface must be understandable.

    4. Robust. Content must be robust enough that it can be interpreted reliably by
    a wide variety of user agents, including assistive technologies.


    For additional information on standards and regulations, resources for Government
    Laws, Regulations, Policies, Standards, and Support at www.uiaccess.com/access_links_html#government_laws_regs_policies.


    > The WAI is an organization within the W3C, the standards-making body for the
    World Wide Web. See www.w3.org/WAI for more information.


    This chapter focuses on accessibility using core web technologies (i.e., HTML,
    CSS, and JavaScript) and does not address accessibility issues related to Flash
    and PDF. Readers interested in learning more about Flash and PDF accessibility
    should consider the following resources:


    +   * Adobe Flash Accessibility Design Guidelines, www.adobe.com/accessibility/products/flash/best_practices.html

    * Adobe Acrobat Accessibility, www.adobe.com/products/acrobat/solutionsacc.html


    NOTE

    Because incorporating accessibility into web pages requires HTML, CSS, and JavaScript,
    this chapter requires some familiarity with their basic concepts and syntax.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# PROGRESSIVE ENHANCEMENT


    # Problem


    Not knowing the browser and its version, platform, and assistive technology that
    users utilize make it difficult to predict how web applications will be used.
    As a result, exclusively relying on certain implementation approaches—even the
    recommended style sheets and JavaScript—may make a web application unusable or
    inaccessible to certain populations.


    # Solution


    Design web applications that they support progressive enhancement. In other words,
    support users who have older browsers or assistive technologies to access the
    web application for content and functionality, while also offering users with
    newer browsers and more advanced technology to experience enhanced (i.e., more
    interactive) features in the web application (Champion, 2003a, 2003b).


    # Why


    Using progressive enhancement allows web applications the widest possible reach
    in terms of devices, browsers, and assistive technologies. In addition, by layering
    enhancements independent of each other, designers can avoid creating a separate
    version (the ACCESSIBLE ALTERNATIVE pattern in this chapter), because regardless
    of the technology supported by the browser and/or assistive technology, users
    will be able to accomplish their tasks.


    # How


    First and foremost, make web content accessible by using web standards to mark
    up and structure content and functionality without requiring client-side scripting
    technologies such as JavaScript (see the SEMANTIC MARKUP and ACCESSIBLE FORMS
    patterns in this chapter).


    Once content and functionality of a web application are made available to the
    widest audience, the next step is to improve its visual presentation using style
    sheets. However, make every effort to ensure that the incorporation of style sheets
    does not compromise their usability and accessibility for users whose browsers
    do not support them (the UNOBUSIVE STYLE SHEETS pattern in this chapter).


    The final layer is to interactivity using client-side scripting approaches (e.g.,
    JavaScript), which can make the application more responsive and efficient by supporting
    drag-and-drop, performing basic form validation without having sent data to the
    server, sorting content, and so forth. Like style sheets, added interactivity
    should not affect users’ ability to access web application content or functionality
    (see the UNOBUSIVE JAVASCRIPT pattern later in this chapter).'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'Finally, ensure that web applications using Ajax'' work even when JavaScript
    is unavailable. This can be accomplished using the HIJAX approach as follows (Keith,
    2007):


    +   1. Begin by building a regular web application where users can request information
    from and send information to the server. The server returns an updated version
    of the same page. Every time user click on a link or submit a form, the entire
    page is refreshed.


    +   2. Use the Document Object Model (DOM) scripting approach (see UNOBTRUSIVE
    JASCRIPT pattern later in this chapter (or "hijax", thus the term HIJAX) links
    and forms requesting information from and sending information to the server. Reroute
    them using Ajax such that the server sends back only the changed part of the page
    instead of returning the entire page.


    # Related design patterns


    Incorporating PROGRESSIVE ENHANCEMENT requires web pages to be marked using SEMANTIC
    MARKUP and then enhanced using UNOBTRUSIVE STYLE SHEETS and UNOBTRUSIVE JAVCRIPT.


    # SEMANTIC MARKUP


    # Problem


    It''s difficult to ensure consistent presentation of web pages to all users knowing
    the browser, platform, or assistive technology to access the web application.
    In addition, a page''s information hierarchy established using images, style sheets
    and layouts cannot be communicated visually because users'' browsers and assistive
    devices may render visual information unusable.


    # Solution


    Convey the document''s meaning using structural markup such that it clearly conveys
    the relationship between page elements and maintains the order irrespective of
    the browser''s ability to use CSS and/or render images. In addition, delegate
    page presentation aspects to style sheets so that the page structure remains meaningful
    regardless of the browser type, platform, or assistive device.


    This means web designers must ensure that the order of page elements is communicated
    via headings and lists (i.e., <h1>, <h2>, <h3>, <h4>, <ul>, <ol>, and so forth).
    <table> tags are not used for page layout, and page presentation aspects are absent
    from the markup. For example, additional space between


    > ^2Ajax stands for Asynchronous JavaScript and XML, and is a combination of technologies
    such as JavaScript, cascading style sheets (CSS), document object model, and XMLHttpRequest,
    which allow the creation of richer user experiences that are comparable to desktop
    applications (see Chapter 8 for additional details).'
  merge: -1
