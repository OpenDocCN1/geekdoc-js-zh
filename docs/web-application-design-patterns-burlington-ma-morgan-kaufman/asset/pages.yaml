    # Ease of deployment


    Web applications are also popular with businesses and software developers because
    they can be developed, updated, and maintained remotely without requiring users
    to install (or reinstall them). A related advantage of web applications is that
    they can perform regardless of the operating system on users'' computers. They
    can be built once and deployed to any system, rather than creating separate versions
    of applications for Microsoft Windows, Macintosh OS X, GNU/Linux, and other operating
    systems.


    # “Trained” user base


    The Web''s growth and widespread adoption (from 16 million users in December 1995
    to almost 1.5 billion users in June 2008, according to Internet World Stats; www.internetworldstats.com)
    has made the Web style of interaction familiar to a large number of users. Most
    Internet users can now be expected to be familiar with web browser terminology
    as home, back, forward, bookmarks, hyperlinks, submit buttons, and so forth. With
    this knowledge, and the fact that using web applications does not require elaborate
    installations, barriers to their use (or least to try them out) are much lower.
    Further, it helps that many popular web applications are now available for free
    or have a free trial period.'
