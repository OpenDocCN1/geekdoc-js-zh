    **FIGURE 6.35** Dig digs “previous” and "next” controls on the first and last
    pages, respectively. In addition, they highlight the current page and don’t link
    it to prevent unnecessary navigation.


    However, there are situations where the last link is both appropriate and necessary.
    If the resulting dataset is sorted in multiple ways (e.g., alphabetically, chronologically,
    price, and so forth), the last page becomes relevant, as it allows users to quickly
    see the last page of items with a predictable set of search results—example, items
    starting with Z, the most- or least-expensive item, and so forth.


    # REPEAT THE PAGINATION CONTROLS AT THE TOP OF THE PAGE


    For short lists, pagination controls may be provided only at the bottom of the
    list. However, in pages where search results would require users to scroll extensively
    (e.g., when users are permitted to change the page size), repeat the pagination
    controls at the top of the page as well.


    This technique can also be beneficial for search results accompanied by an alphabetical
    index. For example, users looking for an item beginning with the word “summit”
    might jump to the beginning of the “I” pages and use pagination controls at the
    top of the page to go backward until they get to the first result of which is
    closest to the word “summit.”


    # DO NOT LINK PAGINATION CONTROLS THAT ARE NOT RELEVANT


    Like all navigation mechanisms, provide a clear indication to users as to where
    they are in the search set and where they can go. Prevent unnecessary navigation
    by disabling pagination controls that do not navigate to other search results
    pages (Figure 6.35):


    +   - On the first page, disable links to “first” and/or “previous” pages.

    - On the last page, disable links to “next” and/or “last” pages.

    - Instead of changing the current page as a link, make it plain text or highlight
    it in some fashion.


    # LABEL PAGINATION CONTROLS APPROPRIATELY


    For most pagination controls, their labels and order are “first,” “previous,”
    “next,” and “last.” In applications where items are ordered chronologically, a
    more recent trend is to let them reflect their chronological order—“newest,” “newer,”
    “older,” and “oldest”—where “newest” is equivalent to “first” (Figure 6.36).'
