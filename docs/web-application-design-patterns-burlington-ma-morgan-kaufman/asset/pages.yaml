  md: '# Why


    In non-RIA applications, moving or rearranging of data items typically requires
    taking users to another page, where the effects of the changes are not visible
    until the desired rearrangement is submitted to the server and the original page
    is updated to reflect the new order or layout. Employing direct-manipulation methods
    similar to those in most desktop applications (e.g., deleting a document by dragging
    it to the trash) can make the interaction efficient and encourage exploration.


    # How


    Allow users to drag data items (or components) from their current place, move
    them to a new location and place, and drop them. Drag-and-drop may be used for
    the following:


    +   - Rearranging items on a list (Figure 8.25).

    - Moving overlaying pop-ups from one location to another (Figure 8.26).

    - Building lists as Adding an item to the shopping cart (Figure 8.27).

    - Indicating an action (Figure 8.28).

    - Resizing an object (Figure 8.29).


    When supporting drag-and-drop, it is important that the user interface is responsive
    and changes are shown instantly without any delays.


    ![](img/ad042d15418a1098a617de420fc07871_257_0.png)


    **FIGURE 8.25** Ta-Da Lists allows users to reorder items in their list using
    a drag-and-drop mechanism.


