  md: '# AVOID GRATUITOUS ANIMATIONS


    Animation is an effective tool only when it serves a specific purpose as communicating
    state elements and/or improving interaction.


    Because elements of a page draw users'' eyes, frivolous animations divert focus
    from valuable page information. Therefore, do not use animation gratuitously—all
    it does is distract. Gratuitous animations that do not communicate visual effects
    such as using a marque (of course, it is acceptable when showing a ticker tape).


    # Related design patterns


    Another way to keep users informed of changes in the interface is to use the DELAY/PROGRESS
    INDICATORS AND SPOTLIGHT/YELLOW-FADE patterns.


    # DELAY/PROGRESS INDICATORS


    Problem

    Though RIAs strive to provide real-time feedback, users often face noticeable
    server or processing delays before processing is complete and new information
    is presented.


    Solution

    Show users either a delay indicator to suggest the system is busy processing the
    request (Figure 8.39) or a progress indicator not to indicate that the system
    is busy also to indicate progress in terms of percentage complete, stage of processing,
    time remaining, or a combination thereof (Figure 8.40).


    ![](img/ad042d15418a1098a617de420fc07871_265_0.png)


    FIGURE 8.39 Amazon''s progress indicator for diamond search (short delay).


    ![](img/ad042d15418a1098a617de420fc07871_265_1.png)


    FIGURE 8.40 Kayak uses a progress bar when retrieving matching flight information
    (long delay).'
