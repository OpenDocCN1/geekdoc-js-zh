  md: '# CHAPTER 6


    # Searching and Filtering


    # INTRODUCTION


    For web applications of a reasonable size, accessing information only by navigating
    the application hierarchy can become cumbersome and compromise usability. Therefore,
    it''s important that information within web applications be made searchable to
    get users to desired items quickly and efficiently.


    After users have submitted their query, web applications match items ordered by
    relevance (SEARCH RESULTS). Although ordering by relevance is the most appropriate
    to present search results, users may prefer to reorder them using other criteria
    (e.g., when purchasing items) to get desired items (SORTING).


    For performance reasons and to overwhelm users with too many items, search results
    are usually presented in subsets of 10 to 20 that users can navigate through using
    controls such as next, first, last, and so far (PAGINATION). An alternative emerging
    approach is CONTINUOUS SCROLLING, which also presents a subset of search results
    at a time, but instead of pagination, it presents additional search results as
    users scroll to the bottom of the current set of results. Both approaches attempt
    to address a common problem with searching—too many search results.


    Users are typically offered mechanisms such as FILTERING or FACETED SEARCH to
    narrow down the list of search results to a manageable number.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# CHAPTER 6 Searching and Filtering


    Both mechanisms remove items within the search results that do not match the selected
    filters or facets. The difference, however, is that in FILTERING, users are offered
    options that remain the same irrespective of the presented search results. FACETED
    SEARCH, however, is dynamic and the narrowing options offered to users are derived
    from search results themselves and continue to update as users narrow their result
    set.


    After users have searched, filtered, and sorted results to their liking, allowing
    them to save their queries (SAVED SEARCHES) and set up alerts so that they can
    rerun saved queries and stay informed of new matches.


    # SIMPLE SEARCH


    # Problem


    Navigating deep application hierarchies can be cumbersome and an inefficient way
    to get to known items in web applications. In addition, it may be unclear to users
    where the desired item is in the hierarchy given the available navigation options.


    # Solution


    Allow users to search for items using keywords or key phrases and place the search
    feature in a consistent location throughout the application (Figure 6.1).


    # Why


    When users know exactly what they are looking for, searching is easier and more
    efficient than navigating the application hierarchy; this is also referred to
    as a known-item search. Even when a search doesn''t get users directly to the
    desired item, it may allow them to skip several levels of navigation to a point
    where they can navigate the rest of the hierarchy and get to the desired item
    quickly. Additionally, most users are not familiar with search concepts such as
    Boolean operators (Nielsen, 1997) and feel more comfortable using simpler


