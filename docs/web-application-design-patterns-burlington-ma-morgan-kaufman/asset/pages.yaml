  md: '# Why


    Pagination requires users to switch between navigating pages and reviewing search
    results. In addition, with pagination, interaction is challenging when users want
    to select items from different pages before applying an action (e.g., when users
    want to compare items that are not all on the same page). In such instances it''s
    often unclear to users whether their selections on other “pages” are retained
    when paging through results and selected items. In addition, pagination requires
    important screen real estate, pushing content down the page. The continuous-scrolling
    approach solves this by showing the items in a scrolling list and retrieving the
    next set of items when users reach the bottom of the list.


    At this time, the evidence favoring continuous scrolling over pagination is inconclusive.
    As mentioned before, Bernard et al. (2002) found that users took longer and had
    a larger preference for search results pages with 100 items compared with 10 items
    or 50 items per page. However, this research was based on paginated results and
    did not introduce continuous scrolling. Since interactions and selection become
    easier with continuous-scrolling, the approach should not be discounted.


    # How


    Show users search results in a list with subset of items exposed. As users scroll
    down and reach the bottom of the current list, fetch new data and show users the
    next set of items. To make scrolling smooth and continuous, prefetch and store
    the next few sets of data and request additional data as users scroll. If users
    have to wait for data to load, show a “please wait …” indicator so users know
    that additional data are retrieved (Figure 6.38).


    # INDICATE TO USERS THE SUBSET OF ITEMS THEY ARE VIEWING


    Like the pagination pattern, show which items users are currently viewing along
    with the total number of items in the search results (Figure 6.39).


    ![](img/ad042d15418a1098a617de420fc07871_185_0.png)


    FIGURE 6.38 DZone.net shows an animated “LOADING” icon when it''s fetching additional
    data from the server.'
