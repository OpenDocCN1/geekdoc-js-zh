    # ADJUST PAGE ELEMENTS TO BROWSER WINDOW SIZE


    When using liquid-width layouts, page elements using background colors or images
    should fill up appropriately with expanding or narrowing browser windows. The
    relative position of page elements—left- and right-aligned components such as
    headers, navigation bars, footers, and so on—should also maintain their alignment
    with varying window windows (Figure 12.3).


    # Related design patterns


    As already mentioned, large screen resolutions are becoming common, and designers
    have started considering PROGRESSIVE LAYOUTS to ensure that pages’ content readability
    does not suffer when maximize browser window sizes.


    # FIXED-WIDTH LAYOUT


    # Problem


    Liquid-width design can create excessive empty spaces between elements for pages
    with fewer elements. This not only makes pages sparse, disorganized, and disconnected
    but also less readable and visually unappealing.


    # Solution


    Use a design that has a fixed width to ensure that page components remain together
    and appear coherent. *Fixed-width layout* means that the width of the page content
    is set to a certain pixel width irrespective of browser'
