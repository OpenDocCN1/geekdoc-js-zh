  md: '# CHAPTER 3 User Authentication


    ![](img/ad042d15418a1098a617de420fc07871_70_0.png)


    FIGURE 3.9 YouTube asks users to click the confirmation link in the email to complete
    their registration and to check their spam folders if they don''t see the message
    in their inbox within a few minutes.


    FIGURE 3.10 Prosper provides a brief summary of their privacy policy on the registration
    form, as well as others link to a detailed privacy policy.


    # VERIFY REGISTRATION


    If necessary, require users to verify their registration to prevent fraud and
    ensure legitimate user accounts. This is commonly accomplished by sending a message
    with a confirmation link to the email address provided by users during registration.
    Only after users have returned to the application by clicking the confirmation
    link (or by pasting the registration URL in their browser address field) do they
    consider their registration complete. To ensure email reaches users'' inboxes,
    ask them to check their spam folders (Figure 3.9).


    # ALLAY USERS'' PRIVACY CONCERNS


    Users may be hesitant because they may not know how their personal information
    will be used. Include a brief privacy statement (e.g., “Your information will
    not be sold or shared”) followed by a link to a detailed privacy statement to
    address such concerns (Figure 3.10).'
