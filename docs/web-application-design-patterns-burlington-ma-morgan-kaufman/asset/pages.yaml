    # Related design patterns


    Although portals share a common "look and feel," typically users can "reskin"
    a portal by changing its appearance. Users are also allowed to customize content
    and layout (see CUSTOMIZATION). Because portals are designed to aggregate content
    from disparate sources, some content may also appear in a DASHBOARD style, giving
    users a view of the current status (or health) of key metrics.


    # PERSONALIZATION


    # Problem


    For web applications with an extensive amount of content (e.g., a large number
    of products in e-commerce applications), finding content or items that are relevant
    or of interest may become difficult for users. In addition, as new items are being
    added at a rate users are likely to find difficult to keep up with (and not all
    of them are going to be of interest to), showing every new item is neither desirable
    nor feasible.


    # Solution


    Tailors users'' experience by showing them personalized information based on their
    profiles, interaction patterns, and/or stated (or inferred) preferences and interests
    (Anand and Mobasher, 2005; Koch and Rossi, 2002) (Figure 4.18).'
