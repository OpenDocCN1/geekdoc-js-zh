    allow users to restrict search to a category by limiting them the scope of their
    search. Depending on the number of scoping options available, use radio buttons,
    a dropdown list, images, or tabs (Figure 6.3). However, it’s important that the
    page does not refresh when users choose a scoping option.


    Do not search by default or require users to select a scoping category. Users
    may not know the category to which an item belongs, which may be the'
