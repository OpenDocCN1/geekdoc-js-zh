  md: '# Help Community


    ![](img/ad042d15418a1098a617de420fc07871_461_0.png)


    Dell forums for Notebooks.


    # # Why


    Providing users with an open venue to discuss and share problems, solutions and
    makes it easier for them to have their questions answered and solved. Often, the
    most active users on such forums are expert users who have encountered unusual
    problems and may come up with innovative solutions and workarounds that can provide
    useful insights to application designers. Such information may then be used to
    improve help as well as the application''s functionality and usability.


    In addition, allowing users to share and store problems and solutions makes it
    easier for them to find answers anytime, and they do not have to wait on the phone
    for a customer support person to solve their problem.


    # # How


    Make it easy for users to share their experiences in either a forum (i.e., discussion
    groups) or a blog format and enable them to find answers to their questions. This
    self-service approach becoming common for both large corporations and start-ups
    (Figures Web.24 and Web.25).


    # # INTEGRATE COMMUNITY HELP WITH THE APPLICATION


    Instead of treating community as a standalone application, as is often the case,
    integrate it with application contextual help. This allows users to access relevant
    discussions and post or answer questions (Figure Web.26).


    # # MONITOR HELP COMMUNITY VENUES TO CONTROL SPAM, SLANDER, AND INACCURATE INFORMATION


    Help communities are a double-edged sword. On the one hand, they afford a self-service
    channel and make it easier for application users to get desired help;'
