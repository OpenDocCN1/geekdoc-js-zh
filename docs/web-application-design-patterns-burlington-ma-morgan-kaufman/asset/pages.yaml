  md: '# GEOLOCATION


    To present appropriate formats for date, time, number, and currency by default,
    many applications use the geolocation approach. Geolocation refers to identifying
    the geographic location of the computer on the Internet. Knowing the geographic
    location of the computer, and thus the location of its user, applications can
    direct users to an appropriate region-specific version of the application. For
    example, users using language from India typing www.google.com can be directed
    to www.google.co.in, and those from Japan can be directed to www.google.co.jp.
    Geolocation can also be used to make a reasonable guess about users'' date, time,
    number, and currency preferences. For example, users accessing- the application
    from the United States can be shown prices in U.S. dollars ($), and for those
    accessing the application from Japan, they can be shown prices in yen (¥)


    Although this chapter addresses a few of the important topics, internationalization
    and localization are very rich topics. Readers are encouraged to consider the
    resources listed in the References at the end of the book, specifically del Galdo
    et al. (1996), Aykin (2004, 2006), Yunkers (2002), and Ishida (2008).


    # EXTENSIBLE DESIGN


    # Problem


    Although web applications are designed primarily for users in a region and for
    a language, designers may want to make them available in other regions and languages
    in the future.


    # Solution


    Design web applications so that they do not favor any particular language or country
    and, when localized, they do not require a complete overhaul of the user interface
    or content, for translation. This requires identifying and separating country-
    and language-specific application elements and its user interface and ensuring
    that none of the localizable elements are “hard-coded” in it.


    # Why


    EXTENSIBLE DESIGN is the core of internationalization. It prepares web applications
    for localization and eliminates the need to create country- or language-specific
    versions. By having only one version, not only does maintaining code become easier,
    but so does ensuring consistency in the user interface among'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Extensible Design


    language-specific instances of the application. Furthermore, by making web applications
    locale-independent and culture-neutral, extensible design elements that may be
    misinterpreted or offensive to other cultures.


    An extensible design also helps make web applications more accessible to people
    with disabilities. For example, by designing the application such that it can
    accommodate expansion in text size when translated to other languages, it enables
    users with poor eyesight to enlarge text without affecting the page layout (see
    Chapter 11).


    # How


    Extensible design encompasses all aspects of user interface design: markup, images,
    messaging, terminology, and so forth. Following are some of the best practices
    for developing an extensible design.


    # USE THE UTF-8 ENCODING FORMAT FOR WEB PAGES


    Character encoding refers to mapping the characters (alphabets, numbers, punctuation
    marks, etc.) to a unique number (e.g., A is 65 in ASCII encoding). It helps web
    browsers to display the characters on a web page. Selecting the character-encoding
    method, therefore determines the web application may be able to support. Appropriate
    selection is also important for web applications that are designed to support
    users who may prefer languages other than English for inputting data.


    The original encoding method, ASCII, is based on the English alphabet and supports
    94 characters. ISO 8859-1, an extension of the ASCII encoding method, is based
    on a multinational character set and supports 191 characters from the Latin script.
    Although it supports English and several European languages, it does not support
    Asian language characters such as Chinese, Japanese, Indian, and others. UTF-8
    encoding method encodes all characters in the Unicode standard and thus supports
    the characters of most languages in the world. Therefore, to allow maximum coverage
    in terms of language, use the UTF-8 encoding format.


    Specifying the encoding method for web pages is pretty straightforward. Here are
    some examples:


    +   - XHTML:

    ```html

    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    ```


    +   - JSP (Java Server Pages):

    ```jsp

    @page contentType="text/html; charset=utf-8"

    pageEncoding="utf-8" %>

    ```


    > ASCII stands for American Code for Information Interchange and is pronounced
    "ascii."

    UTF-8 refers to Unicode Transformation Format-8 bit version.'
  merge: -1
