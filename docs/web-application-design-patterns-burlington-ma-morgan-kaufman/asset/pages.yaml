  md: '# CHAPTER 9 Social Applications


    ![](img/ad042d15418a1098a617de420fc07871_286_0.png)


    FIGURE 9.18 Yahoo! Local allows users to both rate restaurants and write reviews.


    # REVIEWS


    # Problem


    Although ratings are useful, they do not provide insights into the reasons for
    a higher or lower rating. In addition, users rating an item may want to share
    the reasons behind their opinions about the quality of an item, satisfaction with
    a transaction, or experience at a location. Showing a simple rating system may
    be limiting because users won''t be able to elaborate on their reasoning.


    # Solution


    In addition to providing a rating, allow users to write a review that expresses
    their opinions and reasons for the quality of an item or satisfaction with their
    transactions (Figure 9.18).


    # Why


    Users invariably trust reviews by other like-minded and "unbiased" users over
    the claims made by the product''s seller (Gauri et al., 2008). Edelman''s Trust
    Barometer (2008) found that about 60 percent of people tend to trust people like
    them—that is, those who shared their interests and similar beliefs. In addition,
    understanding a range of experiences from different viewpoints can help users
    judge how well an item''s attributes match their needs, and thus they can make
    better informed decisions.


    # How


    Offer users an option to write a review in addition to rating an item. If an item
    has not received any ratings or reviews, encourage users to be the first to write
    a review (Figure 9.19).'
