- img_proc: true
  md: '# CHAPTER 4 Application Main Page


    and not worry about coming up with a visual design that satisfies the needs of
    all users. Through customization options, users can then change the appearance
    of pages if they prefer a different set of colors, fonts, themes, and so forth.
    However, this should not be a reason to avoid difficult decisions. When customization
    options are offered, many users do not choose to customize (Mackay, 1991). In
    addition, having too many customization options is likely to add complexity to
    the interface and may make it difficult for users to customize it.


    # How


    Offer users customization options at the content, appearance, and application
    levels.


    # CONTENT-LEVEL CUSTOMIZATION


    Content-level customization is useful when users are interested in only a very
    small subset of application content. Allow users to choose content appropriate
    for their needs and interests from a list of available content. In addition, categorize
    content to make it easy for users to narrow down choices and select content quickly
    (Figure 4.27).


    Other ways to help users choose from available content is to provide detailed
    descriptions and user ratings (see the RATINGS pattern in Chapter 9). Incorporating
    personalization as part of customization is another way to help users discover
    useful content. For example, when users add a content module in


    ![](img/ad042d15418a1098a617de420fc07871_116_0.png)


    FIGURE 4.27 When users click "Add Stuff" on iGoogle, they are shown a categorized
    list of "Gadgets" that they can add to the iGoogle pages. When users choose a
    gadget, iGoogle offers recommendations of things users may like based on the choice
    of gadget. By doing so, iGoogle makes it easier for users to discover relevant
    content.'
