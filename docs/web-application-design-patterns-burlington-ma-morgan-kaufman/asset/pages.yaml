    # USE CULTURE-NEUTRAL IMAGES


    When using images and icons, use universally recognized objects and avoid using
    images that are ethnocentric and/or be considered offensive in other cultures.
    For example, to represent email, use an image of an envelope inside a rural mailbox,
    which is readily understood only in the United States. In addition, using gestures
    in icons and images, they may be considered offensive in some cultures. For example,
    using an "okay" sign (index finger and thumb forming a circle) is considered obscene
    in Brazil,$3$ while the thumbs-up gesture (a sign of "all good" or "okay" in North
    America) is considered highly offensive in Iraq and other Islamic countries (Koerner,
    2003).


    Even commonly symbols to be "neutral" may not be so. The check symbol (a cross
    in a square box) means "correct" or "okay" in many countries. But in Japan and
    Korea, a circle is used instead of a check mark to mean "yes"; in fact, the checkmark
    indicates "no good" or "fail". Finally, avoid using maps that include controversial
    or regional boundaries (e.g., showing national boundaries of India and Pakistan)


