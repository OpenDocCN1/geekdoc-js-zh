    FIGURE 8.45 Picnik uses the spotlight technique when applying the "Exposure >
    Autofox." Using this approach eliminates the need for dedicating a certain interface
    for such messaging. Also, because the message fades out within a few seconds,
    users do not have to dismiss it and can continue with the image.


