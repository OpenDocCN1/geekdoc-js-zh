    # MAKE TABULAR DATA READABLE BY ROWS AND COLUMNS


    The readability of tabular data is affected by the readability of rows as well
    as columns. Improve the readability of rows by adding a separator line for each
    row or using a different shade of color for alternate rows, known as row stripping
    or zebra stripping (Figure 7.8). Both approaches help create a visual grouping
    of items for rows and are particularly important for data tables with many columns
    (wide columns), where users may find tracing data in row difficulty. A study by
    Enders (2008) showed better task performance (at least not) and had a higher preference
    when compared with other styles such as plain, lined, two-color row stripping,
    double-striped, and triple striped.


    In addition, improve the readability of columns by aligning attribute values in
    columns based on table cell contents (Figure 7.9). Follow these rules to align
    data (Galitz, 2002; Mayfield, 1992):


    +   - Use alignment for columns containing whole numbers (not “text”) numbers
    such as a person’s identifier).

    - Use a decimal point and right alignment for numbers with decimal fractions;
    negative numbers may be shown in red or enclosed within parentheses.'
