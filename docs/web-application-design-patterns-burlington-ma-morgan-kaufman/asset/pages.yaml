    ideas and suggest patterns in a "Pattern Ideas Forum" (c).


    Although not, it helps to allow designers and developers to develop and publish
    patterns in an open-source fashion. At a minimum, it should be made possible for
    them to submit examples and screenshots for existing patterns, which may be added
    as photo galleries. With each example, users may indicate how the pattern was
    used and their comments on the evidence of successful use or contexts in which
    its use was found to be inappropriate.


    A good example is a UI Pattern Factory. It allows users to contribute pattern
    examples using Flickr. Users can join the Flickr group (UIPatternfactory.com),
    upload screenshots, tag them with the pattern name, and submit'
