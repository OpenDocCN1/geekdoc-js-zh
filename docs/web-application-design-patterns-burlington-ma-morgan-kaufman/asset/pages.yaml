    ```

    <table summary="Sales data for years 2005, 2006, and 2007 show an increasing trend,
    with sales doubling from $1,200,000 in 2005 to $2,400,000 in 2007">

    <caption>Sales Data for Past 3 Years</caption>

    ... rest of the table markup

    </table>

    ```


    **FIGURE 11.18** By using the summary attribute, users know what is relevant and
    important in the table and can improve comprehension of the data presented in
    the table.


    **FIGURE 11.19** Knowing the scope of headings, users can clearly establish that
    sales in 2005 were $1,200,000.


    ```

    <table>

    <caption>Sales Data for Past 3 Years</caption>

    <tr>

    <th scope="col">2005</th>

    <th scope="col">2006</th>

    <th scope="col">2007</th>

    </tr>

    <tr>

    <th scope="row">Sales</th>

    <td>$ 1,200,000</td>

    <td>$ 1,500,000</td>

    <td>$ 2,400,000</td>

    </tr>

    </table>

    ```


    tied to column headings (<th scope="col">), row headings (<th scope="row">), or
    both (Figure 11.19).


    # USE THE HEADERS ATTRIBUTE ON CELLS OF COMPLEX DATA TABLES


    Use the headers attribute to specify the relationship between the headings for
    a given cell in more complex tables. This is accomplished by attaching an id attribute
    to any cell that you want to be a header cell and then adding the ids of those
    cells to the headers attribute of the data cells (Figure 11.20).


    # Related design patterns


    Data presentation can be improved using style sheets that so the relationship
    between data values and headings are clear to those without vision impairments
    as well (See Christie, 2008, for how CSS can be used to effectively present tabular
    data). This is important for sighted users because attributes are not displayed
    in web browsers. However, UNOBTRUSIVE STYLEETS should be used to ensure that markup
    and presentation are layered independently as advocated in the PROGRESSIVE ENHANCEMENT
    pattern.'
