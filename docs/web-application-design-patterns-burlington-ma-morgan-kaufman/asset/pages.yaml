    # DESIGN TO PREVENT SELECTION ERRORS


    In instances where users'' selections are constrained by the number of items they
    can select or the specific items they can select, design the interface to prevent
    selection errors. For example, if users cannot select more than 4 items from a
    list of 10 items, as soon as users have selected 4 items, disable the checkboxes
    for other items. Or if there are dependencies on what users select, enable or
    disable options based on their selections (Figure 7.57).


    # SHOW CONFIRMATION AND ACKNOWLEDGMENT MESSAGES AS APPROPRIATE


    List actions affect the list items in one of the following:


    +   1. They immediately apply the action to selected items and show users the
    result. The result may be the same page or on a separate page. For example, actions,
    such as "update cart," keep users on the same page, whereas actions as "compare,"
    take users to a separate page.


    +   2. They ask users for additional information by showing a dialog or taking
    them to a separate page. Once users have provided additional information and submitted
    the request, they are returned to the list page, where they can see the results
    of the selected action. The actions in this category include "new," "edit," "copy,"
    "email to a friend," and so forth.


    +   3. They confirm user intent by requiring them to respond affirmively to the
    selected action—example, "Are sure you want to delete . . ?" (Figure 7.58). Requiring
    users to confirm their intent is important for actions that lead to unrecoverable
    data loss (e.g., "delete").


    It’s important to remember that not all "delete" require a confirmation message;
    only those actions with unrecoverable outcomes should require user confirmation.
    For example, deleting an item from a shopping cart should not require confirmation,
    as it’s relatively easy to add back.'
