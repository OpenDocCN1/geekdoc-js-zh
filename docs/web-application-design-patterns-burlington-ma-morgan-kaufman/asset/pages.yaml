  md: '# CHAPTER 2 Forms


    FIGURE 2.36

    Adobe Buzzword shows an error message above the “Sign In” area.


    ![](img/ad042d15418a1098a617de420fc07871_60_0.png)


    icon (or any other appropriate icon) to draw attention to the error message and
    or the form elements that caused the error(s) (Figure 2.37).


    PROVIDE INSTRUCTIONS TO FIX THE ERROR

    This could be as simple as asking users to do something simple and specific (e.g.,
    ”Reenter your username and password. Then click Log In”) to offer suggestions
    to fix the error (e.g., “Username is case-sensitive. Check the Caps Lock key on
    your keyboard”).


    SHOW ERROR MESSAGES ON THE SAME PAGE AS THE FORM

    Web applications show that error messages on a different page force users to memorize
    the error(s) and the instructions to fix them before returning to the form page
    containing errors. If there are several errors on a page, this can become cumbersome,
    because users may have to go back and forth several times to fix all the needs.
    Showing error messages on the same page as the form eliminates the need to return
    to the page with the error message and makes it easier for users to fix errors.


    RETAIN USER-ENTERED INFORMATION

    When showing error messages, it’s important that user-entered information is not
    lost. Asking users to enter the same information again is annoying and may lead
    them to abandon the form (Figure 2.38).'
