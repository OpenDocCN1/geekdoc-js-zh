    # RECOMMENDATIONS


    Recommendations are another way of introducing users to new content. This may
    be based on users'' past browsing or purchasing behaviors and/match behaviors
    of users with similar interests and profiles (i.e., collaborative filtering),
    as Figure 5.22 (see also the PERSONALIZATION pattern in Chapter 4).


    # RELATED ITEMS


    Many e-commerce applications use some form of related items promoting the discovery
    of new products and encouraging upsell and cross-sell (Figure 5.23). The related
    items may be in the form of similar products, product accessories, services and
    warranties, and so forth.


    # Related design patterns


    As the name suggests, supplementary navigation suggestions, rather than replaces,
    PRIMARY NAVIGATION and SECONDARY NAVIGATION. In addition, because supplementary
    navigation approaches bypass the hierarchical navigation structure, incorporating
    BREADCRUMBS may help users understand where they are in the application structure.
    TAG CLOUDS are also another form of supplementary navigation and should be considered
    for applications that rely on user-contributed content.


    # TAG CLOUDS


    # Problem


    Web applications that allow access to user-generated or user-contributed content,
    such as photos, videos, music, and so forth, typically allow users to label (i.e.,
    tag) items they are viewing or adding (the TAGGING pattern in Chapter 9). When
    an item is tagged by many users, tags created by them are likely to be dissimilar
    because of the differences in their interests, familiarity with the item, and
    usage context. Such diversity in tags can make it difficult for users to find
    those same items in the future. In addition, users may want to find items that
    are similar to the ones they are interested in. For example, after'
