    # USE CULTURALLY RELEVANT METAPHORS


    In North America, using a shopping cart is a valid metaphor for purchasing items
    because it translates to users'' real-world experience. In Europe and Asia, however,
    a shopping cart icon could cause confusion because users are more familiar with
    shopping baskets than carts. E-commerce sites should change labels/or images when
    serving customers in those countries (Figure 10.9).


    # USE PLAIN LANGUAGE


    Avoid confusing nonnative speakers by using plain language and refraining from
    slang and colloquialisms in text. In addition, be sensitive when using greetings
    such as "Welcome, <first name>" for applications that may be used by non-American
    users. North American culture is very informal compared to many other cultures,
    as evidenced by Hofstede''s Power Index Distance (see www.greet-hofstede.com/hofstede_united_states.html).
    In Asia, informality would be considered inappropriate, as people are usually
    addressed by their last name. Greetings by Amazon or Flickr are more appropriate
    for web applications with international audiences (Figure 10.10).


    In general, to make localization easier, avoid the following when developing web
    content (Hurst, 2007):


    +   * Words with multiple meanings

    * Abbreviations

    * Mnemonics

    * Acronyms

    * Slang or jargon

    * Gender notation

    * Creation of new words

    * Shortened plurals or word combinations

    * Anything that portrays a way of life or culture specific to one country'
