    # ACCESSIBLE NAVIGATION


    # Problem


    Most pages are organized such that the main "content" area elements such as a
    logo, utility navigation, primary navigation, and secondary navigation. Although
    this practice is beneficial for users without impairments because they prefer
    a consistent location for navigation (see Chapter 5), it’s disruptive for screen
    readers and keyboard users because they have to navigate through these links with
    every page load before they can reach the main content.


    # Solution


    Allow users to access the page’s main content without requiring them to go through
    persistent navigation and other elements located in the page’s header'
