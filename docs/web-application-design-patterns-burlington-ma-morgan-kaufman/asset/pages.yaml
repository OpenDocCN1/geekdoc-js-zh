    also helps users with color-vision deficiencies, as they can use the icon’s shape
    to determine status.


    # USE THE SAME VISUAL STYLE FOR ICONS


    Make sure that icons appear professionally designed and follow the same set of
    stylistic conventions—that is, the base color set (matched to the site’s brand)
    and the same visual styles and effects (Figure 12.29).


