  md: '# CHAPTER 4 Application Main Page


    # Why


    Requiring users to navigate several application pages or run reports to monitor
    items status and determine actions to take is not only inefficient but may cause
    users to overlook important information. In addition, integrating information
    from several places for every visit can become cumbersome for users.


    Dashboards, when properly designed, are “presented in a way that allows them [users]
    to monitor what’s going on in an instant (Few, 2006). By using appropriate visualizations
    for important measures (often referred to as key performance indicators or KPIs)
    with along exception conditions and alerts, dashboards provide-at-glance information
    about current status and facilitate identification of necessary corrective and
    preventive actions.


    # How


    Dashboards typically serve three important functions for users:


    +   1. They monitor and track important metrics.

    2. They provide analysis to determine trends and exception conditions.

    3. They report information to facilitate design and identify corrective actions
    as necessary.


    4.7 Data display methods.


    ![](img/ad042d15418a1098a617de420fc07871_100_0.png)


    Pie Charts: Use pie charts to represent proportional relationships for a few categories
    with potentially large value differences. When there are many categories that
    have smaller value differences, it may be difficult to discern the differences
    in this format.


    ![](img/ad042d15418a1098a617de420fc07871_100_1.png)


    Bar Charts: Use bar charts for showing the relationship among data elements in
    a series or multiple series. Because data bars share a common measure, they can
    be easily compared with one another. Bar charts may not be appropriate when a
    data series has few values with a large outlier value, which could compress the
    scale for the remaining data discrimination among the bars difficult.


    ![](img/ad042d15418a1098a617de420fc07871_100_2.png)


    Line Charts: Use line charts to see trends in one or more metrics.


    Tables and Lists: Use tables or lists for nonnumeric data or when a graphical
    presentation of numeric data may not be meaningful or easily understood by intended
    users. Tables or lists may also serve as an alternate view for graphical (see
    also Chapter 7).


