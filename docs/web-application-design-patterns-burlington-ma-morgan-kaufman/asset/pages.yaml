  md: '# USING PATTERNS IN THIS BOOK


    This book provides practical user interface design guidance for developing web
    applications by offering a usable “working” starting point that designers can
    adapt and refine to develop creative solutions.


    Consider patterns in this book as blueprints and not precise design solutions,
    and use them as they apply to your specific problem. Do not force a pattern to
    a problem just for the sake of using it! As pointed out by Graham (2003): “Patterns
    are abstract, core solutions to problems that recur in different contexts....
    The actual implementation of the solutions varies with each application. Patterns
    are not, therefore, ready-made ‘pluggable’ solutions” (p. 1). So, focus on the
    essence of a pattern and then consider how a problem might be solved with the
    pattern, as patterns do not dictate a single solution, but rather a strategy for
    solving the problem.


    # COMPANION WEB SITE


    All the patterns in this book are also available on the book’s companion web site
    (www.elsevierdirect.com/9780123742650). I will also use that site to list errata
    and additional information (and, perhaps more patterns) and use it as a way to
    answer your questions and respond to your comments.'
  merge: -1
