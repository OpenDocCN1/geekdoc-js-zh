    # USE LABELS CONSISTENTLY


    Although this has minor utility implications, a relevant design issue is labeling
    the action that ends user sessions with the application. The common options are
    log out, sign out, logoff, log off, and sign off. As the link represents an action,
    appropriate usage is log out, sign out, log off, or sign off. In the absence of
    any research evidence, a common practice is to complement the action used when
    accessing the web application: for consumer applications, Sign Out (to complement
    Sign In) is used, and for many business and technical applications, Log Out (to
    complement Log In) is used.'
