    Divide search results such that each page shows a fixed number of items (typically
    10–20 items per page), and allow users to navigate the pages of search results
    using controls as “previous,” “next,” “first,” and “last.” Pagination controls
    may use numbered page links to allow users to navigate directly to individual
    pages within the search results (Figure 6.31).


