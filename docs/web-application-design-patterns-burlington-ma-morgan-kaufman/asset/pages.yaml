- img_proc: true
  md: '# AVOID USING TEXT IN ICONS


    Avoid using text as part of an icon''s image, since it makes it more difficult
    to localize it (i.e., translate to other languages; see Chapter 10). Because of
    the smaller sizes of icons, text may also be difficult to read, and when used
    with a label, it may not be clear to users which label or text to consider for
    deciphering the icon''s meaning. In addition for users with vision deficiencies,
    text may be difficult to read when zoomed (see the ACCESSIBLE IMAGES pattern in
    Chapter 11).


    # USE MODIFIERS TO INDICATE OR CHANGE AN OBJECT''S STATUS


    The base icon can be used for multiple object states—or example, new email, read
    email, and responded-to-email (Figure 12.24).


    For monitoring applications, simple modifiers—referred to “health badges”—are
    often used to indicate alarms or the status of objects. They are either placed
    side by side or to the bottom right or bottom left of the main icon (Figure 12.25).
    The modifier icon may be used over the main icon as the main icon is still recognizable
    and not masked by the modifier icon (e.g., putting a “X” over an icon).


    # USE TOGGLE ICONS TO INDICATE ALTERNATE STATES


    Toggle icons are used to indicate either the presence or absence of an attribute
    or to assign a state. For example, Figure 12.26 shows the star icon used as a
    toggle by Gmail to indicate the “starred” or “normal” status of an email. This
    is very similar to the “flagging” approach offered by desktop-based email systems


