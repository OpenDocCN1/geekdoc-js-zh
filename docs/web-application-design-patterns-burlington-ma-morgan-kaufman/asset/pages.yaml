  md: '![](img/ad042d15418a1098a617de420fc07871_364_0.png)


    **FIGURE 11.6** In this form from Orbitz, users can click on the highlighted areas
    or the radio controls instead of just clicking the radio button to select.


    In this example, the text field for first name has an id of "firstName" that is
    referenced in the <label> tag using the "for" attribute to associate the First
    Name to the corresponding text field.


    Not only does the <label> tag make it easy to associate labels to form controls
    for screen readers irrespective of where the control is positioned, but it also
    helped users when they interact with radio buttons and checkboxes. When used with
    radio buttons and checkboxes, the <label> tag allows users to click to select
    the corresponding radio button or checkbox. Thus, users have a larger clickable
    area and are not restricted to the smaller radio button controls or checkboxes
    (Figure 11.6).


    In addition, to ensure screen readers present information to users in the correct
    order, place labels that relate to text fields or dropdown lists before the form
    element in the markup. This does not apply to radio buttons and checkboxes, where
    labels follow the corresponding controls.


    # GROUP FORM CONTROLS USING <FIELDSET> TAGS


    Use the <fieldset> tag to group related controls and use the <legend> tag to provide
    a heading to the grouped form controls. This helps screen readers identify and
    communicate groups to users. The <fieldset> and <legend> can also be styled using
    style sheets to make them visually appealing (Adams, 2008).


    # MAKE FORMS KEYBOARD ACCESSIBLE


    Most browsers allow users to navigate among links, frames, and form elements on
    a page using the Tab key, which when pressed, moves the focus from one element
    to another in order of their presence in the markup. In most cases, when the page
    is marked correctly, the sequence in which users would move from one element to
    another would be correct. However, in cases, when the default tab sequence needs
    to be changed to provide a better form-filling experience, use the tabindex attribute
    for form elements (Figure 11.8; see the KEYBOARD NAVIGATION pattern in Chapter
    2).


    Another way to make forms keyboard accessible and efficient is by using the accesskey
    attribute, which allows users keyboard access to frequently used'
