    # MINIMIZE PAGING WELL AS SCROLLING


    Deciding the number of items to show on a search results page is a trade-off between
    scrolling and paging. Typically, for all text results with a minimal description
    for each item, a search results page shows about 20 items at a time, whereas for
    results that include images, users are typically no more than 10 to 15 items.
    However, considering that users limit their exploration of search results to just
    a few pages and do not mind scrolling, a case can be made for showing more results
    per page to be optimal as reported by Bernard et al. (2002), who found the fastest
    search times and preference for 50 search results at a time when compared with
    10 or 100 search results.²


    # MAKE PAGINATION CONTROLS EASILY CLICKABLE


    When numbered links are included in pagination controls to allow users to jump
    directly to a specific search results page, they often present a very small target
    for users to click. To ensure that pagination controls are easily clickable, use
    a larger size and provide sufficient space between them (Figure 6.32). Doing so
    also helps distinguish one pagination link from another and minimizes inadvertent
    navigation to the wrong page.


    > ²Interestingly, the study found lower search times and lower preference for
    100 search results at a time. This may be a case against showing an arbitrarily
    large number of search results.'
