    # ## DEMONSTRATE RICHER INTERACTIONS


    Many design patterns, especially for Rich Internet Applications (RIAs), are embodied
    in the user interface. Such interactions can be made clearer if users experience
    the interactivity suggested by the pattern. When such is the case, it''s useful
    to allow users to experience the interactivity as an interactive prototype, type,
    animation, or movie (Figure 13.8).


    # ## INCLUDE ACCESSIBILITY AND INTERNATIONALIZATION CONSIDERATIONS


    If accessibility and internationalization-related design patterns are not separately
    documented, it''s important to include relevant best practices with the patterns
    themselves; the necessary accessibility and internationalization hooks should
    be included in corresponding software components as well.


    Although a few of the current pattern libraries include accessibility considerations
    (e.g., Yahoo! Pattern Library, UI Patterns, and Fluid Open Source Design Pattern
    Library; Figure 13.9), none currently include internationalization considerations.
    However, their inclusion is important for companies that plan to localize their
    applications (see Chapter 10 for details on internationalization considerations).'
