  md: '# CHAPTER 13


    # Pattern Libraries


    # INTRODUCTION


    As indicated in Chapter 1, design patterns have the potential to offer benefits
    such as proven design solutions and guidance for their use, improved design process,
    reusability and consistent interfaces, and so forth. To realize these benefits,
    it''s important that design patterns be documented and made available in a format
    that promotes reuse. Several documented collections of patterns, commonly referred
    to as *pattern libraries*, currently exist. Some notable includes Jenifer Tidwell''s
    collection of interaction design patterns (Tidwell, 2006), Martin van Velie''s
    web site about design patterns (www.welie.com), Van Duyne''s *Design of Sites*
    (2006), and Yahoo! Design Pattern Library (developer.yahoo.com/patterns/).


    Despite the popularity of patterns and pattern libraries, currently there is no
    consensus on how patterns should be documented, maintained, and shared with others.
    Nor has there any empirical research that evaluates the efficacy of using pattern
    languages, libraries, and collections designed for user interfaces. Rather than
    analyze and discuss the pros and cons of different approaches (Dearden and Finley,
    2006; Dennis and Snow, 2006), this chapter presents a pattern library as a pattern
    and identifies its core elements, as well as offers best practices for its development.


    # PATTERN LIBRARY


    # Problem


    In the absence of a formal process for reusing successful design solutions, the
    design process can be quite inefficient, because designers and developers spend
    time trying to solve interface design problems for which successful design solutions
    have already been identified and implemented. This is often exacerbated when the
    rationale and context for previously used design solutions is not documented,
    making it difficult to justify their use.'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# CHAPTER 13 Pattern Libraries


    ![](img/ad042d15418a1098a617de420fc07871_404_0.png)


    # Solution


    Develop a repository of design patterns (i.e., a pattern library), documenting
    the knowledge of design patterns, solutions, rationale; and best practices for
    implementing the patterns (Figure 13.1). In addition, share the pattern library
    with other designers and developers, promote use and reuse of patterns by incorporating
    implementation code snippets (i.e., components), and encourage designer and developer
    participation.


    # Why


    For large/or distributed design teams within a corporation, it is common to finding
    different user interface designs and interaction approaches for the same design
    problem across different products; they often have different visual treatments
    as well. This results in inconsistent interfaces, which can lower usability of
    applications and weaken the corporate brand (Malone et al., 2005). By facilitating
    the reuse of design solutions, pattern libraries offer an effective way of documenting
    and sharing solutions for recurring design problems and help achieve consistency.
    Pattern libraries also make the design process much more efficient and increase
    the productivity of designers by reducing duplicate research and minimizing "reinventing
    the wheel" (Malone et al., 2005).


    Although patterns are design solutions independent of specific implementation
    issues, design and development teams can further reduce the time spent on user
    interface development by building software components to support'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# Pattern Library


    design patterns. After a design pattern is chosen, development teams can reuse
    and adapt software components and code snippets for implementing selected patterns
    (Sinnig et al., 2004). Reuse and efficiencies are also achieved since software
    components typically incorporate related design patterns. For example, the TABULAR
    LIST pattern can incorporate the SORTING and PAGINATION patterns and make it easy
    for developers to implement all three in their designs.


    Even when design teams are small and colocated, pattern libraries are beneficial
    because they provide a way to capture design best practices and promote reuse.
    Because of the limited design and usability resources available to smaller design
    teams, minimizing rework by reusing successful design solutions are of even greater
    importance than for larger design teams.


    # How


    The first task when developing a pattern library is to determine how to document
    each pattern. As indicated in Chapter 1, pattern users have used different approaches
    (including this author) to document patterns, and a consensus on the most effective
    way of documenting patterns does not currently exist. However, they all contain
    the following sections.


    Pattern name. The name of the design solution should clearly communicate what
    the pattern stands for. An unambiguous (and preferably familiar) name is important
    to make it easy for designers to recognize, select, and remember patterns.


    Problem. A brief description of the design problem and the trade-offs faced by
    the designers, if any.


    Solution. A brief summary and an exemplar image that shows the successful design
    solution. The image may be a sketch or an actual screenshot; the latter is preferred
    because it shows the design solution and helps improve the strength of the pattern.


    Reasons the design solution is effective (why). Some form of design rationale
    is essential to make the case for the pattern. This may be based on empirical
    research, user interface design principles (or heuristics), and/or user familiarity
    of established conventions. This section may also include specific contexts in
    which the pattern is most appropriate.


    Best practices for applying the design solution (how). In most instances, applying
    a design solution requires attending to additional considerations. For example,
    when using the DELAY/PROGRESS INDICATOR pattern (see Chapter 8), designers may
    need to know whether time elapsed or remaining and in what contexts. Identifying
    best practices is essential to ensure the correct use of the selected pattern.


    Related design patterns. Most patterns do not stand alone. They are related to
    other patterns because their use requires incorporating other patterns or because
    they complete other patterns. For example, when creating a form, designers have
    to consider several patterns such as SHORT FORMS, ACTION BUTTONS, REQUIRED FIELD
    INDICATORS, ERROR MESSAGES,'
  merge: -1
