  md: '# Related design patterns


    Although a SIMPLE LIST may be acceptable for showing items with multiple attributes,
    consider a TABULAR LIST if the list needs to be sorted or list items compared
    based on one or more of the attributes and as a way to minimize the space required
    for multiattribute lists.


    # TABULAR LIST


    # Problem


    Users need to be presented a collection of items with several attributes so that
    they can clearly associate each item with its attributes as well as compare items
    to each other based on those attributes. In addition, they may want to sort the
    list based on one or more attributes.


    # Solution


    Show users the list in a tabular format, where items are listed in rows and their
    attributes are shown in columns (Figure 7.6).


    # Why


    Multattribute information is best presented in tables because it provides structure
    to data. For example, column headers can identify the attributes for items presented
    in rows. In addition, presenting information in a tabular format makes it easy
    for users to compare items and, when supported, sort them in the desired order.
    Most important, users'' familiarity with tabular arrangement of data into rows
    and columns makes it a useful approach to present multattribute data.


    # How


    Tabular data are generally read in rows with items in rows and attribute values
    in columns. Show attribute names in the table headers, they are implied by the
    data. For effective design, it''s important that the table design


