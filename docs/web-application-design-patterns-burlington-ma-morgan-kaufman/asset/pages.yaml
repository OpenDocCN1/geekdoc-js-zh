    # Related design patterns


    Grouping form elements may suggest that the form be split up into multiple pages
    to make it appear shorter (SHORT FORMS) or that it be structured so that data
    entered by users in earlier groups prepopulate fields in later groups (SMART DEFAULTS)
    so that users do not have to go back and refer to previously entered information.


    # LABEL ALIGNMENT


    # Problem


    Labels and corresponding form elements need to be clearly associated with one
    to another to make form filling easier and to minimize user input errors.


    # Solution


    There are three acceptable placements for labels in relation to form elements:
    above the element, with their left edges aligned with the elements; to the left,
    with their left edges aligned with other labels; and to the left, with their right
    edges aligned to other labels (Figure 2.15).'
