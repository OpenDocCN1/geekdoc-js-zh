    buttons, or dropdown lists to select one or more values within a range. sliders
    provide an easier and more direct method of selecting a value within a range (Galitz,
    2002). In addition, they prevent user errors when compared with entering values
    in text fields. Another important advantage of sliders is that the data range
    can be continuous as well as discrete, and the design of the slider can convey
    the appropriate precision of user input. It is also faster to select values using
    sliders compared to a selection involving a text-input field or radio buttons.


    # How


    Allow users to set one value or a range of values by dragging and dropping the
    slider(s) in the slider control. In addition to drag-and-drop, enable users to
    click directly on the arrow to move the slider to the clicked location. Allow
    users to control the slider using the left, right, up, and down arrow keys on
    the keyboard as well. It is important that the arrow keys match the orientation
    of the slider—that is, left and right arrow keys should work for horizontal sliders
    and up and down arrow keys should work for vertical sliders. It is however good
    practice to have the other set of arrow keys work as well. Finally, where feasible,
    allow users to simply enter the value in a text field (Figure 8.32).


    ![](img/ad042d15418a1098a617de420fc07871_260_1.png)


    FIGURE 8.32 Splashash (from Faux Labs) allows users to specify colors by entering
    RGB (red, green, blue) values or the corresponding hexadecimal values. Because
    of the context and users'' familiarity with color selection in other desktop-based-image-editing
    applications, providing verbal descriptors for the sliders is not necesary.'
