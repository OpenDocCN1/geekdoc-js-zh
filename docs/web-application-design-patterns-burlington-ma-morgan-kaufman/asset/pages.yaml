  md: '# CONSIDER USE OF SYMBOLS FOR SHOWING LOCATION TYPES


    Maps may have to show more than one type of location—for example, a map may show
    restaurants, gas stations, lodging facilities, and so forth. Use one or more of
    the following approaches to indicate different location types:


    **Colors and shapes.** Use of distinct colors and shapes is helpful when showing
    two to three location types on the map. Include a legend so that users can associate
    colors and shapes to location types. In addition, to not disadvantage users with
    color vision deficiencies, use colored markers in combination with unique shapes.


    **Pictographic symbols.** Use recognizable pictographic symbols to identify types
    of locations such as restaurants, restrooms, gas stations, trail symbols, and
    so forth (Figure 7.44).


    Although not used to indicate a location type per se, using thumbnails of actual
    photographs to identify a location is becoming a popular way to indicate a location
    on a map (Figure 7.45).


