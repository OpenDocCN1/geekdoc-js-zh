  md: "# CHAPTER 7 Lists\n\n![](img/ad042d15418a1098a617de420fc07871_206_0.png)\n\n\
    **FIGURE 7.18** Digg shows comments as a discussion thread. When users click \"\
    \n Replies,\" replies are shown indented in a treelike structure.\n\n# Solution\n\
    \nShow list items as a \"tree\" of items, which clearly illustrates the relationship\n\
    between parent and child item(s) (Figure 7.18). List items at the parent level\n\
    (i.e., a group node or parent item) may contain other groups (i.e., parents)\n\
    /or individual items (i.e., a leaf node or a child item) and can be expanded\n\
    and collapsed to view its contents.\n\n# Why\n\nFor many lists, especially in\
    \ emails and forums that have several participants\nand topics, it's important\
    \ to show how items relate to each other. Showing\nitems in a hierarchical list\
    \ makes it easier for users to follow the thread of a dis-\nscussion or conversation.\
    \ In addition, it makes it easier to trace the discussion's\nhistory."
