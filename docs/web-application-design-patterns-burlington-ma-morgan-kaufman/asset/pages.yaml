    # RELATED PATTERNS


    Guided tours are useful when users are faced with a BLANK SLATE (see Chapter 4).


    # HELP WIZARDS


    # Problem


    Users who are unfamiliar with an application domain typically find it difficult
    to articulate their problem accurately or don''t know the appropriate trigger
    words to get the relevant help information in APPLICATION HELP or HELP COMMUNITY.
    In addition, diagnosing a problem, which may have multiple causes and thus multiple
    solutions, may not know the best way to tease out the appropriate solution.


    # Solution


    Guide users through a series of questions to arrive at a solution (or a set of
    solutions) (Figure Web.21). This is not very different from recommender systems
    that suggest solutions based on a series of questions aimed at capturing users’
    goals or requirements.


    # Why


    When troubleshooting, guided approaches are typically better at narrowing the
    causes and getting users to the solution(s) quickly. In addition, although users
    find describing their problem difficult because of their lack of domain expertise,
    they are more likely to respond appropriately to targeted questions and narrow
    down their solution choices.'
