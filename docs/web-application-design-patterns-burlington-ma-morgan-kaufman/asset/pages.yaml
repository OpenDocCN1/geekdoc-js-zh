  md: '# CHAPTER 4 Application Main Page


    tailor the application to their preferences and compensate for personalization
    shortcomings. Customization is not limited to information and task-related needs;
    it often extends to a choice of colors, logos, themes, fonts, and page layouts.


    An often-overlooked design aspect of many applications is when first-time users
    will see (BLANK SLATE). This is particularly important for applications that rely
    on users to fill in the application with appropriate data.


    # INBOX


    # Problem


    It is essential that users know the items they need to work on or the activities
    that have happened since they last logged in.


    # Solution


    Show users list of items they can act on or review. For example, for email applications,
    show users a list of emails; for defect-tracking applications, show users a list
    of defects; and so forth (Figure 4.1).


    # Why


    Applications focused on managing items of one type (e.g., emails, defects, files,
    accounts, support calls, timesheets, etc.) benefit from showing users that they
    can interact with as soon as they log in. This does not mean that the application
    does not allow users to manage other types of items or quick


    ![](img/ad042d15418a1098a617de420fc07871_94_0.png)


    FIGURE 4.1 NetResults tracker shows developers a list of bugs and enhancements
    assigned to them when they log in.'
  merge: -1
