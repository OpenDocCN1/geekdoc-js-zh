  md: 'It''s important, however, to remember that web applications are developed using
    HTML and do not offer all the form controls available on popular forms such as
    Windows and Macintosh. Specifically, the interaction in web applications is limited
    to the following form elements: text fields (single and multiline), radio buttons,
    checkboxes, dropdown lists, scrolling lists, buttons (including image buttons),
    and a special control to browse files. Some of the missing controls are spin control,
    combo-box, tree control, and tabs. Although these controls have been implemented
    using some clever combinations of HTML, CSS, and JavaScript, they are workarounds
    and not true controls because they are not available as part of the markup language.


    # CLEAR BENEFITS


    # Problem


    When presented with a form, users may not understand how filling it out and submitting
    it helps them accomplish their goals and tasks.


    # Solution


    When designing, clearly indicate benefits of filling out and submitting forms.
    This is particularly important when users are creating a new account (i.e., registration
    forms), which is the first step before many web applications allow them access
    to their functionality (Figure 2.1).


    # Why


    Users may not want to fill out forms and provide personal information unless they
    understand the benefits they will get in return and how it helps them


