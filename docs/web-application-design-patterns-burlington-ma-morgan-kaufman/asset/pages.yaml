  md: '# SHOW THE TOTAL NUMBER OF SEARCH RESULTS


    On the search results page, clearly indicate the total number of search results
    and the number of results shown on the current page (Figure 6.21); see also the
    PAGINATION AND CONTINUOUS SCROLLING patterns later in this chapter. Showing the
    total number of search results helps users decide if they want to change their
    query, make it more specific (or broad), or simply browse the search results.


    # SHOW DESCRIPTIVE INFORMATION WITH EACH SEARCH RESULT


    It may not be clear to users whether a search result is relevant to their task
    based solely on its title. Users may need additional descriptive information about
    a search result to decide if it is worth the effort. For example, for books, users
    may want to know the author, date published, a preview of the content, and a brief
    summary (Figure 6.22). For products, they may want to know the price, user ratings
    (available), manufacturer, supplier, image, and so forth. Therefore, consider
    users'' most common tasks to determine the type of supplementary information to
    accompany each search result so to improve its "information scent" (Pirotli and
    Card, 1999).


    # SHOW IMAGES OF ITEMS TO FACILITATE SCANNING


    Include images in search results (Figure 6.23(a)) if they would help users recognize
    and differentiate items better than their textual descriptions (e.g., e-commerce
    and media applications). However, offer an alternate text-only version for the
    search results as well (Figure 6.23(b)); users may not be interested in images
    because of slower connection speeds (e.g., when accessing the application from
    remote areas or on mobile devices) or because they prefer a text-only view.


