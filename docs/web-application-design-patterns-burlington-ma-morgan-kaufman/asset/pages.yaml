  md: '# WEB APPENDIX Help


    ![](img/ad042d15418a1098a617de420fc07871_450_0.png)


    **WEBAPPENDIX.6** QuickBooks Online incorporates application help as contextual
    help as well. Depending on where users are within the application, clicking “Help”
    shows the relevant section of the application in a separate window.


    # Frequently Asked Questions


    **FAQs on Digg. Clicking on a question causes the area below it to expand, revealing
    the answer.**


    +   Using Digg

    How do I find all Digg submissions I submitted or commented on?

    Whenever you use a search service, Digg, or comment on a submission, the activity
    is highlighted in bold in the navigation bar. If you click on the “Activity” tab,
    you can see your friends'' subscriptions, Diggs, and comments. To visit the profile
    of a person friend, click on them anywhere on the site or enter the address manually:
    digg.com/username

    How do I remove the items selector from Digg?

    How can I see all digg entries with specific tags?

    How can I change the digg status of external links?

    What if I delete it, why does it say “Permanent” when the body looks to be?

    What is a like?

    Why do some posts get hidden when I have flagged them off Digg?


    # Solution


    Create a page to answer users'' frequently asked questions (FAQs). It’s important
    that questions listed in this section are really “frequently” asked questions
    and organized so that basic questions are answered before the advanced ones (Figure
    Web.7).


    # Why


    An FAQ page level is where users are likely to go before going to more detailed
    application-level help to see if their questions can be answered; many users assume
    their questions are common and likely asked by others. Furthermore, compared with
    other forms of help, FAQs are usually “How do I ...?” type questions. Users can
    more readily relate them to their own task and quickly narrow down their choices
    to a few appropriate questions or determine that their question is not answered
    and consider other forms of help. Companies also benefit because they can reduce
    the calls to customer support (Jarrett, 2007).'
