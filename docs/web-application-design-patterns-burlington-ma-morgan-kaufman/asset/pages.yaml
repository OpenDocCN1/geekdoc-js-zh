    # Why


    Showing users price information in their local currencies and formats helps because
    they know exactly how much they will pay for products (or services) and they do
    not have to rely on exchange calculators or other ways of converting prices to
    get correct amounts.


    # How


    Web applications that support multiple currencies must take into consideration
    currency symbols, codes, and formats. This is because of the diversity in currencies
    and number formatting schemes used by different countries. For example, the currency
    symbol for the British pound (ISO code: GBP) is £ and for Japanese yen (ISO code:
    JPY) is ¥. In addition, the placement of the currency symbol varies from one country
    to another (Figure 10.25).


    User interaction for changing currency is very similar to that of changing the
    language (using the LANGUAGE SELECTOR pattern later in this chapter). Depending
    on the number of currencies supported by an application, users may select the
    appropriate currency from either a dropdown list or a set of links (Figure 10.26).


    When users change to see prices in their local currency or a different currency,
    show the exchange rate along with the currency conversion (Figure 10.27).


    To avoid potential confusion about the currency, show the appropriate currency
    symbol (Figure 10.28), the ISO currency code, or both, as shown below. In addition,
    show the appropriate group and decimal separators based on users'' locale preference


    +   * United States: $ 1,234,567.89 USD

    * Germany: € 1,234.567,89 EUR

    * France: € 1 234 567,89 EUR


    # MAKE THE CURRENCY SELECTION PERSISTENT


    Do not require users to choose their desired currency every time they access the
    application pages. Make users'' currency selection persistent using cookies or
    a preference tied to their login not only within the same session but also when
    they return to the application later.


