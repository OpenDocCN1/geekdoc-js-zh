- img_proc: true
  md: '# FIGURE 12.17

    Blinksale positions the header, primary navigation, utility navigation, page content,
    and related actions in consistent locations.


    ![](img/ad042d15418a1098a617de420fc07871_394_0.png)


    forth—should be placed in consistent locations. For each persistent element, establish
