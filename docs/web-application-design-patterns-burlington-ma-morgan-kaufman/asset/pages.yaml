  md: '# WEB APPENDIX


    # Help


    # INTRODUCTION


    Despite adherence to basic design principles, processes, and patterns to create
    an interface that users can learn easily and use efficiently, it is necessary
    to provide help and make it available at all levels of user interaction. At its
    most basic level, help should be provided to answer users'' questions within their
    task and application context (CONTEXTUAL HELP). This can be in the form of hover
    tips and prompts to inform users about the type and format of data to enter or
    more detailed instructions to help users decide among the available options. The
    next level of help, to support frequent and important tasks, is to provide answers
    to users FREQUENTLY ASKED QUESTIONS.


    Embedding various forms of assistance does not eliminate the need for more comprehensive
    help. For a complex application, users may not even know certain functions and
    tasks are supported by the application and how to accomplish them. Such application-level
    help (APPLICATION HELP) should be available both as a standalone module and integrated
    with the application, so when users access help, they are directed to the section
    of application-level help relevant to their page or task context.


    For even moderately sized web applications, users may visit several pages and
    access several functions to accomplish tasks successfully. For such tasks, especially
    those likely to use frequently, it''s important to provide users detailed step-by-step
    instructions (GUIDED TOURS). If tasks require diagnoses or consideration of several
    alternatives, it helps to ask users to describe their scenario one at a time and
    lead to possible solutions (HELP WIZARDS). The wizard-based approach is effective
    because users can try solutions at their own pace and are not rushed.


    Even when providing many ways of assisting users and providing comprehensive help,
    it is not possible to anticipate and address all user questions and usage scenarios.
    Therefore, it''s important to consider community discussion forums where support
    staff and other users of the application can help'
  merge: -1
