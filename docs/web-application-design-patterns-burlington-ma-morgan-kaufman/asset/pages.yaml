  md: '# REPUTATION


    # Problem


    In many community-based web applications, it''s important that users feel comfortable
    interacting or transacting with others with whom they have no prior experience.
    In addition, users may need some indicators to identify the trustworthiness or
    expertise of people who are offering suggestions, solutions, or products. Some
    common scenarios are choosing a seller from whom purchase an item (e.g., eBay,
    Amazon Marketplace, NextTag), choosing a book to buy (e.g., Amazon), choosing
    a movie to rent (e.g., Netflix), choosing a restaurant to visit (e.g., Yelp!),
    trusting a suggestion or an answer offered by a person (e.g., Yahoo!), and so
    forth.


    # Solution


    Enable some form of reputation system to help users identify those with high reputations.
    The reputation system must not only make it easy to identify and compare user
    reputations, but it should also have a consistent and reliable way for building
    reputations (Figure 9.33).


    # Why


    Online interactions and transactions (monetary or otherwise) involve two types
    of users: providers (sellers) and receivers (consumers) of services, products,
    and information. In the absence of a face-to-face interaction, providers need
    a way to establish trust or a positive reputation with receivers. Designing a
    reputation system is then a way to establish criteria for determining trustworthiness
    of providers and receivers within the community. Having a reputation system in
    place, however helps users anticipate the likelihood of when interacting or transacting
    with other community users.


    Further, not all community users are equal—some are more experienced, reliable,
    and credible than others. Distinguishing them helps in determining how much weight
    to give their opinions and recommendations. Finally, using a reputation system
    is not just a way of establishing trust, but also a way for users to build their
    reputations and is an important motivation for users to participate in community-based
    applications (Porter, 2008).


    ![](img/ad042d15418a1098a617de420fc07871_297_0.png)


    **FIGURE 9.33** allows buyers to rate sellers on several criteria. Once sellers
    receive 98 percent positive feedback, they receive a Seller badge.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# CHAPTER 9 Social Applications


    ![](img/ad042d15418a1098a617de420fc07871_298_0.png)


    Figure 9.34 Yelp offers several ways for users to gain reputation: total number
    of friends, number of reviews, number of first reviews, number of fans, number
    of lists, compliments, and so forth.


    # How


    Users’ reputation is typically based on two criteria (Figure 9.34):


    +   1. A user’s connections, actions, and history within the community. This includes
    how long a user has been an active community member, the total number of connections
    (or friends), the number of followers (or fans), the number of recommendations,
    the number of reviews, and so forth.

    2. The feedback from other community members. In other words, what others who
    have no apparent interest in a user’s reputation say about him or her (Crumlish,
    2004; Porter, 2008). Therefore, a reputation system must include a feedback mechanism
    to judge the quality, timeliness, and accuracy of claims made by the products,
    services, and information. In addition, a reputation system must be robust enough
    to prevent abuse and manipulation by its users.


    Having multiple ways to achieve a reputation is important because it allows users
    to gain reputations in ways that match their behaviors and personalities. Like
    connectors and mavens in Malcom Gladwell’s The Tipping Point (2000), some can
    achieve a reputation by having a large network and by writing useful and extensive
    reviews.


    # OFFER USERS A QUICK WAY TO JUDGE A REVIEW’S USEFULNESS


    Web applications that allow users to submit reviews also allow readers of those
    reviews to judge their usefulness. Allowing all to see the usefulness of submitted
    reviews reduces the chances of bias and abuse and encourages reviewers to submit
    detailed and relevant information. In addition, the usefulness ratings can be
    used by other users to judge the reputation of the reviewer.


    To make it easy to rate usefulness, ask users to simply indicate whether a review
    was helpful or useful without accompanying comments or ratings (Figure 9.35).'
