    # Related design patterns


    If searching can be structured or directed, consider the use of PARAMETRIC SEARCH
    because it allows users to specify search criteria more precisely. For expert
    users, offer a separate ADVANCED SEARCH option or include SEARCH TIPS that explain
    in which users can improve search effectiveness.


    # PARAMETRIC SEARCH


    # Problem


    Users may not know the way to formulate their search queries as keywords or key
    phrases when looking for items with several attributes (e.g., prices of flights
    from Denver to San Francisco departing the following Wednesday and returning Friday).
    This may lead them to specify a search that is either general, requiring them
    to wade through a large number of irrelevant results, or too specific, thereby
    eliminating many useful results.


    # Solution


    Allow searching for items based on their characteristics (i.e., parameters). For
    example, when searching for flights, ask users to specify departure city, arrival
    city, and arrival dates, and so forth. In addition, where applicable, restrict
    users'' search query by requiring them to choose from a predetermined set of options
    presented as dropdown lists, radio buttons, or checkboxes (Figure 6.8).


    # Why


    Allowing users to specify their search in a structured manner makes it easy for
    them to formulate search queries and prevents them from making assumptions about
    which attributes are searchable. In some instances, searching by a set of parameters
    seems more natural than doing a free-form search—for example, making flight, hotel,
    or car reservations; finding driving directions; finding homes to buy or sell;
    finding people with specific profiles and interests; and so forth.'
