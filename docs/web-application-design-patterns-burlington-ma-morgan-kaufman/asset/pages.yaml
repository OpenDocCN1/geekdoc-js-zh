    # CONSIDER OPTIONS THAN CLICK-TO-CHAT


    With online tools like chat, users do not expect or like to wait for more than
    a few minutes. In the event the wait may be too long or if chat is unavailable,
    consider offering other options such as an email address, a phone number, or a
    click-to-call feature (Figure Web.35). The click-to-call option allows users to
    ask the customer service agent to call during a specific timeframe.


