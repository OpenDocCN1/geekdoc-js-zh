  md: '# BREADCRUMBS


    # Problem


    Users may lose track of where they are within applications that are several levels
    deep. Although users have an option to click a browser’s “back” button to orient
    them or navigate to previous pages, frequent application users may find themselves
    click the “back” button several times or start again from the home page just to
    return to a previous page. In addition, if users “teleported” to a page using
    a search or other forms of deep linking, they may not know where the page resides
    in relation to other application pages (Spool, 2005).


    # Solution


    Provide “breadcrumbs” starting from the application’s main page leading up to
    the current page that indicate the current page’s location within the application
    hierarchy. Link each page reference in the breadcrumbs trail, allowing users to
    return to any intermediate page (Figure 5.29).


    # Why


    Although there are different implementations of breadcrumbs such as location breadcrumbs,
    path breadcrumbs, and attribute breadcrumbs (sidebar, Types of Breadcrumbs), the
    most popular and advocated by usability experts is location breadcrumbs (Instone,
    2002; Nielsen, 2007; Spool, 2005). By identifying the current page’s relative
    position within the application structure, location breadcrumbs help orient users
    and help them understand the application’s hierarchical structure. Furthermore,
    by linking parent pages, they serve an important, albeit secondary, navigation
    function by allowing users to return to previous pages within the hierarchy.


    # How


    On each application page, show location breadcrumbs by indicating the current
    page’s position within the application hierarchy, starting from the “home”


    ![](img/ad042d15418a1098a617de420fc07871_147_0.png)


    **FIGURE 5.29** Circuit City location breadcrumbs to indicate where users are
    within the application hierarchy. In addition, link each page reference in the
    breadcrumbs trail to make it easy for users to navigate directly to it.'
  merge: -1
