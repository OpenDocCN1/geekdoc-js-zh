    # IDENTIFY "PROBLEM" AREAS


    In addition to showing the error message, clearly identify the specific form elements
    that caused the errors. This is particularly helpful for longer forms in which
    users may need to search for the form element(s) that caused the error (Figure
    2.39).


    # Related design patterns


    Although error messages are an important part of form design, every step should
    be taken to prevent errors. This can be accomplished by clearly indicating required
    fields (REQUIRED FIELD INDICATORS), providing appropriate instructions for formatting
    and the type of data expected from users (INPUT HINTS/PROMPTS), minimizing user
    data input using appropriate defaults (SMART DEFAULTS), and allowing users to
    accept data in common formats (FORGIVING FORMAT).'
