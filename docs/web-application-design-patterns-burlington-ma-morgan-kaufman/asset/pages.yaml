  md: '# MAPS


    # Problem


    Items be presented to users contain spatial information that refers to either
    geographical (e.g., location of restaurants on a map) or physical locations (e.g.,
    seating in an aircraft, a concert hall, or a stadium). In addition, for users,
    it''s important to know the item''s location in a geographical or physical space
    as well as its relation to other items in the same space.


    # Solution


    Show items on either the map of a region or space in question (Figure 7.40).


    ![](img/ad042d15418a1098a617de420fc07871_220_0.png)


    **FIGURE 7.40** Roast shows location of homes on a map (a), and United Airlines
    users to choose their seat by showing a seating map (b).'
