    # SLIDER


    # Problem


    Specifying one or more values between a range of values is error-prone, as users
    have to know valid values. In addition, they also need to know the precision of
    the desired input (e.g., 10.1 version 10.12). Although such information can be
    included in the page design, the page may get cluttered with many of form elements
    requiring data input increase.


    # Solution


    Offer users a slider control specifying an acceptable range of values. Users can
    then drag the slider(s) to set a value (Figure 8.30) or a range of values (Figure
    8.31).


    # Why


    For traditional web applications, because of a lack of native support for the
    slider control in the current version of HTML, users are offered a text field,
    a set of


