- img_proc: true
  md: 'The most common export/download formats Adobe PDF, Excel, CSV, (comma-separated
    values), TSV (tab-separated values), and XML (extensible Markup Language), because
    they allow users to import data to a preferred spreadsheet or database and manipulate
    or view the data as necessary. The XML data format is also useful when data may
    be used as input to other applications and/or converted to other formats as HTML
    (HyperText Markup Language) or SVG (Scalable Vector Graphics) for presentation
    purposes. Adobe PDF is useful when it''s important to maintain the visual look
    of data exported.


    Another commonly utility function is "Print." This may be implemented as simply
    a "print-friendly" version of the page that users can print on standard printers,
    removing banners, advertisements, navigation, and other branding and refining
    it to fit. Resizing the page for printing is particularly helpful with FIXED-WIDTH
    LAYOUTS (see Chapter 12), which may cut off text on the right when pages are printed
    in a portrait layout mode (instead of landscape). When printing lists, it may
    help ask users if they want to include details in the printed report (Figure 7.62).


    # SHOW USERS A PREVIEW BEFORE PRINTING


    Because it may not be clear to users what they are printing, show users a preview
    and offer a print action (Figure 7.63).


