  md: '# Related design patterns


    The patterns identified in Chapter 11—SEMANTIC MARKUP, UNOBTRUSIVE STYLE SHEETS,
    UNOBTRUSIVE JAVASCRIPT, and so forth—are relevant for internationalization, as
    they help make web applications easy to localize.


    # DATE FORMAT


    # Problem


    Using a date format in one region can be confusing to users from other regions.
    For example, the date format used in the United States (mm/dd or mm/dd/yyyy) would
    be confusing to European users because they are familiar with dd/mm/yy or dd/mm/yyyy
    formats and to Japanese users who use yy/mm/dd format.


    # Solution


    Use the ISO 8601 recommended yyyy-mm-dd date format when showing dates, or use
    a format that eliminates confusion between the month and the year in a date (Figures
    10.11 and 10.12).


    # Why


    Although web applications designed to be used exclusively by a country or a region
    can depend on its native formatting standards, users from other


    ![](img/ad042d15418a1098a617de420fc07871_335_0.png)


    ![](img/ad042d15418a1098a617de420fc07871_335_1.png)


    **FIGURE 10.11** uses the yyyy/mm/dd format for displaying dates (a slight variation
    from the ISO recommended yyyy-mm-dd format).


    | All Activity - Advanced View from Apr. 6, 2007 to Apr. 6, 2008 |

    | Date | Type | ToFrom | Name/Email |

    | Mar. 13, 2008 | Bonus | From | PayPal |

    | Oct. 4, 2007 | Transfer | To | Bank Account |


    **FIGURE 10.12** PayPal uses a date format of the abbreviated month, dd, yyy to
    make the month and year obvious.'
  merge: -1
