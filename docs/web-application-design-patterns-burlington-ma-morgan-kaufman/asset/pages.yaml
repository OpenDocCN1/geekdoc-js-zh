    starting with broader search criteria and later become more specific as they learn
    more about the search result and the available filtering attributes. Allowing
    users to filter is similar to incorporating some of the advanced search or parametric
    search functionalities on the search results page.


    # How


    On the search results pages, filters are usually shown as dropdown lists, a set
    of radio buttons, or links (Figure 6.1). As users filter by different attributes,
    the remaining filtering options are not updated to reflect the attributes available
    in the remaining search results because they would be in a FACETED SEARCH (the
    following pattern). As a result, users see “zero” items in the search results
    for certain combination of filtering options. However, it is easy for users to
    change or clear their filter criteria and return to the previous state and manipulate
    search results by applying a different set of filters.


    # Related design patterns


    FILTERING in traditional applications can become slow because filtering criteria
    would require a page refresh. Therefore, consider using DYNAMIC QUERYING (Chapter
    8), which updates search results as users make choices and affords a richer interactive
    experience to users. Using FACETED SEARCH should also be considered an alternative
    to filtering, because allows users to iteratively narrow down to the desired item(s)
    and eliminates the possibility of a “zero” result set. In addition, when search
    results are presented as TABULAR LISTS, users may place filtering options in individual
    columns (Chapter 7).'
