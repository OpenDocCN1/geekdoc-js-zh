    # USE HEADINGS IN THE MARKUP TO IDENTIFY PAGE STRUCTURE


    Identify sections within the page using headings markup—that is, using `<h1>`
    through `<h6>`. This allows users with screen readers and browsers to navigate
    using a keyboard (e.g., the `h` key) to navigate the page content.


    # Related design patterns


    It''s also important that primary, secondary, and/or utility navigation features
    are marked up with appropriate SEMANTIC MARKUP. With the availability of working-draft
    versions, consider marking up navigation elements using appropriate “role” attributes
    (see the Accessibility and Rich Internet Applications section later in this chapter).


    # ACCESSIBLE ALTERNATIVE


    # Problem


    Sometimes it is not possible to make a web application accessible either because
    the technology used (e.g. RIAs) or the way it is programmed.'
