    # ALLOW USERS TO ADJUST THEIR PERSONALIZATION PREFERENCES

    Although implicit personalization has its value, it often falls short because
    not all users'' interactions and transactions are for themselves. For example,
    some users'' purchases on e-commerce applications may be for gifts or made on
    behalf of friends and family members. To improve the quality of recommendations,
    allow users to either state their preferences (Figure 4.24) or adjust their preferences
    by having them indicate if an item should be excluded when generating recommendations
    (Figure 4.25).


    # Related design patterns


    Because users'' needs can never be accurately predicted, personalization can never
    be perfect. Therefore, consider using CUSTOMIZATION approaches to let users tailor
    the content and interface to their needs. In addition, some personalization can
    be based on users'' location—for example, users can be shown country-specific
    pages based on where they are accessing the application. Therefore, consider the
    GLOBAL GATEWAY pattern in Chapter 10 as well.


    # CUSTOMIZATION


