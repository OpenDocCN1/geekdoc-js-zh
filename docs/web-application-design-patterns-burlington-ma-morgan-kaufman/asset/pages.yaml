  md: '# Pattern Library


    Applying a star-rating system is difficult because it requires a judgment of the
    part of the pattern authors or the design team (one of the reasons for its absence
    in this book). In addition, applying a star-rating system in a corporate setting
    may be counterproductive, as it may appear to offer teams leeway when they consider
    patterns with lower star ratings. Including several examples of patterns is more
    effective because users can see instances of a pattern''s use and determine its
