  md: '# Related design patterns


    Like PARAMETRIC SEARCH, use of ADVANCED SEARCH does not guarantee fewer search
    results and can benefit from FILTERING or FACETED SEARCH to help users narrow
    down SEARCH RESULTS.


    # SEARCH TIPS


    # Problem


    The quality of search results often depends on how well users have been able to
    specify their search intent. There are typically a myriad of ways search engines
    allow users to make their intent clear. However, this information is usually unavailable
    to users, making it difficult for them to be precise when specifying their search
    criteria.


    # Solution


    Offer easily accessible search criteria and explain different ways of specifying
    search criteria and formulating precise search queries (Figure 6.16).


    # Why


    Search engines used by web applications vary in how they combine keywords and
    build precise search queries. Users cannot expect to know the nuances of each
    search engine they encounter. Search tips can describe to users in a simple language
    to effectively use the search feature.


