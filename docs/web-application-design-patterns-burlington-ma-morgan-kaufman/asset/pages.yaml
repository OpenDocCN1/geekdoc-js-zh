  md: 'To help users understand data, relationships, trends, diagnose problems, report
    summarized and abstracted data on dashboards using approaches such as pie charts,
    bar charts, line charts, tables or lists, and so forth. To ensure that data are
    understood correctly, employ data visualization or charting methods that are suitable
    for the type of data and their intended use (Figures 4.7 and 4.8).


    # MATCH EXCEPTION CONDITIONS TO USERS'' TASKS


    Match dashboard icons and indicators to users'' monitoring tasks (Figure 4.9).
    For example, use indicators, such as alert or traffic light icons, if users need
    to know the current state of a metric. However, if users need to know trends,
    use trend icons, such as up and down arrows, with appropriate colors may be more
    appropriate; they may be supplemented with spark lines to show a quick snapshot
    of the historical trend.


    ![](img/ad042d15418a1098a617de420fc07871_101_0.png)


    FIGURE 4.8 Analytics'' dashboard uses a variety of charts to convey site performance
    metrics. It uses a trend chart to show "Visitors Overview," numbers and spark
    lines to show "Site Usage," tabular data to show "Content Overview."'
