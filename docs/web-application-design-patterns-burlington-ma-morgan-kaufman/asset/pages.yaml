  md: '# Progressive Layout


    ![](img/ad042d15418a1098a617de420fc07871_386_0.png)


    layout work as a liquid-width layout within a range of browser window widths.
    For browser window sizes below a minimum width and above a certain maximum width,
    the page behaves as a fixed-width layout (Figure 12.7).


    Progressive layout offers benefits of both liquid- and fixed-width layouts. It
    works as a liquid-width layout between a range of browser window widths and as
    a fixed-width layout above and below these widths. This satisfies the needs of
    users with either lower or higher screen resolutions. In addition, it allows designers
    reasonable control over a page’s visual appearance.


    # Why


    # How


    Identify the minimum and maximum design widths based on the target users’ screen
    resolutions and design needs. Then design pages so that they remain at a fixed
    width below and above the minimum and the maximum browser window widths, respectively,
    and adjust to the browser window size between them.


    > **FIGURE 12.7** This example shows a progressive layout with a fixed width below
    540 pixels of browser width (a), liquid between 540 and 1024 pixels of browser
    width (b), and fixed over 1024 pixels of browser width (c). The maximum width
    of this design is set at 850 pixels. (Source: Fulcini, 2005).'
