    FIGURE WEB.8. FAQs can be linked to a list of questions with the answers with
    a link to return to the list (a); expanding the answer in when users click on
    a question (b); or listing questions and answers together (c).


    # How


    There are several options for presenting FAQs (Figure Web.8). The most common
    approach is to link them to corresponding answers. When a user clicks a question,
    they are taken to the answer on the same page (with a "back to top" link) or on
    a separate page (with a "return" link). Another option is to show the answer just
    below the question by expanding the space between the question. This approach
    is beneficial, since it eliminates navigation to a different location to find
    information, and users do not have to continually return to the list of questions
    to explore other answers. If the list is relatively short, it is sufficiently
    to simply list questions and answers without requiring users to navigate the it.


    # CATEGORIZE A LONG LIST OF FAQs


    If the list of FAQs is long (e.g., more than 30), organize them by task categories,
    sections of the web application, or by categorizing a set of interest allows users
    to quickly focus on one or more categories of interest and get their answers quickly
    (Figure Web.9).


    # Design patterns


    FAQs should be linked from the pages within the application where users are likely
    to request help to make them contextual (CONTEXTUAL HELP).'
