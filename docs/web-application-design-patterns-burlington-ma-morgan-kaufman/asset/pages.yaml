  md: '# WEB APPENDIX Help


    ![](img/ad042d15418a1098a617de420fc07871_458_0.png)


    FIGURE WEB.20 Basecamp uses videos to introduce users to functions they have not
    explored. To make help contextual, it offers the videos within the context of
