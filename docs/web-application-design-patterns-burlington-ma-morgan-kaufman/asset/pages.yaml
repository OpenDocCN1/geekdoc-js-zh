  md: '# CHAPTER 9 Social Applications


    to explore and interact with content in a myriad ways (Marlow et al., 2006). For
    example, by allowing users to labels (and add multiple labels to the same email),
    Gmail permits users to not only use tags that describe the content of the email
    but also to describe actions and priorities (e.g., "to do," "important," "urgent,"
    and so forth). In addition, users don''t have to force-fit items into a category/subcategory
    combination; they can place them in many virtual categories at once.


    Application developers also benefit from tagging because they do not have to address
    the whole categorization scheme (i.e., taxonomy) in advance. They can rely on
    users'' tags to continually create a dynamic, evolving taxonomy (also referred
    to as folsonomy)¹ and use it to supplement the high-level taxonomy to facilitate
    navigation.


    Finally, tagging can encourage user participation and sharing since it can create
    communities with shared interests and allow users to explore content that is tagged
    similar to theirs.


    # How


    Adding tags to a content item should be straightforward. To tag an item, let users
    enter keywords separated by a space or a comma (or another delimiter) in a text
    field. Using space as a delimiter may be problematic when users want to enter
    multword tags. Therefore, consider use of commas, semicolons; or other special
    characters as delimiters. In addition, allow users to tag both the content they
    are adding and the content that already exists (Figure 9.7).


    FIGURE 9.7

    flick allows users to add tags to photos they upload.


    ![](img/ad042d15418a1098a617de420fc07871_278_0.png)


    > ''Thomas Vander Wal (2007) coined the term folsonomy and described it as follows:
    "Folksonomy is the result of personal free tagging of information and objects
    (with a URL) for one''s own retrieval. The tagging is done in a social environment
    (usually shared and open to others). Folsonomy is created from the act of tagging
    by the person consuming the information."'
