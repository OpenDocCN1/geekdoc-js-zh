  md: '# LIQUID-WIDTH LAYOUT


    Problem

    Web page content (e.g., tabular data, image editors, portal applications with
    multicolumn layouts, etc.) requires considerable horizontal space. If using a
    preset width (FIXED-WIDTH LAYOUT), content would either appear cramped to users
    with large monitors or require users with small monitors to scroll horizontally,
    which is typically not (Nielsen, 2005).


    # Solution


    Design web pages using a liquid-width layout that as users widen or narrow the
    browser window, page content and data adjust to its width; this approach is also
    referred to as a fluid or flexible layout (Figure 12.1).


    # Why


    It is difficult to know or predict users’ screen resolutions and browser size
    preferences. Thus, designing for a specific width takes control over users instead
    of the design adapting to user preferences, users are forced to adjust to the
    design. Furthermore, with fixed-width, much of the


    ![](img/ad042d15418a1098a617de420fc07871_380_0.png)


    FIGURE 12.1 The gowebtopbeta web mail application uses a liquid layout and adjusts
    its content to fit the user’s window size.'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'available screen space remains unused for users with high-resolution monitors.


    On the other hand, those using lower-resolution monitors may need to scroll

    pages horizontally to view the entire page.


    Using a liquid-width design allows page areas to adjust to browser win-

    dows and minimizes unnecessary horizontal scrolling. It also allows users to

    oop sidebars for browser history and bookmarks without affecting their ability
    to view page content. In addition, users with vision deficiencies may prefer to
    use

    larger text sizes, which can be easily accommodated with liquid-width designs.


    Although this study by Bernard and Larsen (2001) found no significant differ-

    ences in user performance with liquid- or fixed-width layouts for reading and

    searching tasks, most users preferred a liquid layout. It could be argued that

    Bernard and Larsen’s conclusion is dated because they use a monitor resolution

    1024 × 768, and almost 40 percent of users on the Web today use screen

    resolutions higher than 1024 × 768 and may have a different preference (see

    w3schools, www.w3schools.com/browsers/browsers_display.asp). However, using

    larger-resolution monitors do not necessarily imply that most users maximize

    the browser window to their screen resolutions, and 60 percent of

    web users still use screen resolutions of 1024 × 768 or lower.


    # How


    Designing a liquid-width or fluid-width layout requires pages components—at

    least occupying the main content area—to have a specific width relative to

    the browser’s window, which is usually accomplished by designing pages\using percentage
    values. For example, overall content can be set to 100 percent,

    main content to 62 percent, and sidebar content to 38 percent (Clarke, 2007).


    IT’S TO KEEP NAVIGATIONAL AREAS AS FIXED WIDTH


    It’s not necessary for all layout areas to expand proportionally for win-

    dows. Pages such as navigation, sidebars, and callouts, may be kept

    to certain width, while keeping areas occupied by main content flexible

    (Figure 12.2). This jumping and readjusting of page components

    when users resize their browser window.


    ![](img/ad042d15418a1098a617de420fc07871_381_0.png)


