  md: '# Solution


    Create an accessible alternative for the web application that offers the same
    content and functionality, and provide a link to the alternative application.
    This follows the recommendation by WCAG 1.0, which states:


    If, after best efforts, you cannot create an accessible page, provide a link to
    an alternative page that uses W3C technologies, is accessible, has equivalent
    information (or functionality), and is updated as often as the inaccessible (original)
    page.


    And, from WCAG 2.0 (see Concordance Requirements at www.w3.org/TR/2007/WD-WCAG20-20070517#conformance):


    > If Web page does not meet all of the success criteria for a specified level,
    then a mechanism to obtain an alternate version that meets all of the success
    criteria can be derived from the nonconforming content or its URI [Universal Resource
    Identifier], and that mechanism meets all success criteria for the specified level
    of conformance.


    # Why


    Ideally, web applications should be able to adapt to the needs and capabilities
    of browsers, assistive technologies, or users without maintaining separate versions.
    However, sometimes web applications use technology that offer important benefits
    justifying its use (e.g., better performance, richer interactivity, etc.) but
    are not well supported by assistive technologies.


    RIAs are a good example. They offer important usability and performance benefits
    (e.g., Google Maps, Gmail). However, when used with assistive technology, mobile
    devices, or browsers that have JavaScript and CSS disabled, they break down. In
    addition, there may be legal requirements to use an exact copy of a document,
    making modifications to original documents impossible. In some instances, rather
    than excluding users, it''s better to create an alternative version of the application
    with the same content and core functionality.


    # How


    Once the alternative version is developed, two important WCAG 2.0 requirements
    are:


    +   1. The accessible version provides the same content even with compromises
    in design and functionality.

    2. At the beginning of the pages of the nonaccessible version, a link is provided
    to the alternative accessible version.


    Approaches similar to those used for incorporating "skip navigation" link in the
    page markup can be used for providing the links to an alternative version of the
    application (see ACCESSIBLE NAVIGATION pattern earlier in this chapter).'
  merge: -1
  pgno: 376
- img_proc: true
  md: "# Accessibility and Rich Internet Applications\n\n# Related design patterns\n\
    \nIf Ajax or of JavaScript makes the application inaccessible, use approaches\
    \ outlined in the UNOBTRUSIVE JAVASCRIPT and PROGRESSIVE ENHANCEMENT patterns\
    \ to make the application accessible as possible.\n\n# ACCESSIBILITY AND RICH\
    \ INTERNET APPLICATIONS\n\nApproaches used in developing RIAs (see Chapter 8)\
    \ make extensive use of dynamic HTML and Ajax to offer a richer and more interactive\
    \ experience. However, they may significant accessibility challenges. For example,\
    \ if page content changes without a refresh, new content may not be available\
    \ to people who rely on screen magnifiers or screen readers. RIAs also use interface\
    \ controls such as sliders, progress bars, tabs, trees and so forth, which are\
    \ natively supported in current versions of HTML/XHTML markup.\n\nThe W3C WAI\
    \ group has working on addressing these challenges through their ARIA suite (WAI-ARIA;\
    \ see www.w3.org/WAI/intro/aria). The purpose of WAI-ARIA is to offer a way to\
    \ associate behavior and structure controls used on web pages with markup to make\
    \ RIAs accessible to people with disabilities. It does so by incorporating roles\
    \ and properties within markup.\n\nRoles allow an RIA designer to provide proper\
    \ type semantics on custom controls to make them accessible. For example, as indicated\
    \ in the SEMANTIC MARKUP pattern, page should be marked up using lists. However,\
    \ if a page has several other types of lists, it is not easy for users to distinguish\
    \ between navigation and other lists. ARIA specification provides help by using\
    \ the notion of roles, which provide information about the control is irrespective\
    \ of the HTML markup that was used to create it. For example, an unordered list\
    \ for navigation can be marked up as:\n\n```\n<ul role=\"navigation\">\n  <li>Navigation\
    \ Item 1</li>\n</ul>\n```\n\nRoles are divided into widget roles and structural\
    \ roles. Widget role includes widgets in RIAs such as slider, combobox, tree,\
