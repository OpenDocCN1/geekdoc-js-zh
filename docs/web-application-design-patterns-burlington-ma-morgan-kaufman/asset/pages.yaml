  md: '# CHAPTER 9 Social Applications


    # ADD/UPLOAD CONTENT


    # Problem


    Users need to transfer content files, such as music, photos, presentations, and
    so forth, from their own computers to those of the application providers to share
    them with other users.


    # Solution


    Provide users a way to upload one or more content files. In addition, if appropriate,
    allow users to describe (and tag) the content and indicate their preferences for
    who can view it (Figure 9.1).


    # Why


    Making uploading of files easier is essential for web applications that rely on
    users to provide content. Furthermore, to make it easy for users to find their
    uploaded content, allow them to tag it (see the TAGGING pattern next).


    # How


    In most cases, users will have the content files on their computer. Therefore,
    make it easy for them to upload them from their computer. When users are likely
    to upload several files at a time, such as uploading photos, allow them to select
    multiple files and upload them all together (Figure 9.2).


    # ALLOW USERS TO COPY FILES FROM OTHER SOURCES


    In cases where users may already have uploaded their files (e.g., photos) on sites
    like Picasa or Flickr, make it easy for them to transfer files directly from


