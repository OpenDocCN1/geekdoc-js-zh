  md: 'Using design patterns addresses many of concerns and can complement design
    guidelines and style guides to create better, and consistent, interface designs
    and improve usability of web applications.


    # DESIGN PATTERNS


    The notion of patterns was introduced in the field of architecture by Christopher
    Alexander and his colleagues in A Pattern Language (Alexander et al., 1977) and
    The Timeless Way of Building (Alexander, 1979). They explained the nature of patterns
    as follows:


    Each pattern describes a problem that occurs over and again in our environment,
    and then describes the core of the solution to that problem, in such a way that
    you can use this solution million times over, without ever doing it the same way
    twice.(Alexander et al., 1977, p. x)


    Thus, explicitly focus on the problem within the context of use and guide designers
    on when, how, and why the solution can be applied. Patterns are practical and
    desirable instances of “good” design while embodying high-level principles and
    strategies.


    Patterns have recently become attractive to user interface and software designers
    as well for their following benefits:


    Proven design solutions and guidance for their use. Patterns identify real solutions
    and not abstract principles or guidelines. In addition, by making the context
    and problem explicit and summarizing the rationale for their effectiveness, patterns
    explain how a problem can be solved and why the solution is appropriate for a
    particular context. However, because it is a generic “core” solution, its use
    can vary from one implementation to another without making it look “cookie-cutter”
    or discouraging creativity.


    Improved design process. Identifying patterns and cataloging them can help user
    designers increase productivity by reducing time spent “reinventing the wheel.”
    Furthermore, if user interface components are built for patterns in the form of
    a design pattern library (see Chapter 13), designs can be developed, tested, and
    iterated rapidly, and can help shorten release cycles.


    Reusable and consistent interfaces. Developing a library of reusable interface
    components can also facilitate development of consistent interfaces both within
    and across applications. This is particularly useful in


    > Inspired by Alexander’s work in the field of architecture, the concept of patterns
    was applied and became popular in the field of software after the publication
    of Design Patterns: Elements of Reusable Object-Oriented Software (1994) by Erich
    Gamma, Richard Helm, Ralph Johnson, and John Vliss (commonly referred to as the
    Gang of Four or simply GoF). Subsequently, patterns also became popular in the
    field of human–computer interaction from the works of Tidwell (www.designinginterfaces.com),
    Welie (www.welie.com), Borchers (2001), Graham (2003), and Van Duyne et al. (2002).'
  merge: -1
