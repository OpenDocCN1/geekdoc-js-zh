  md: '# LIST UTILITY FUNCTIONS


    Problem

    Certain users might take do not require them to select specific items but rather
    apply to the list as a whole—for example, printing, downloading, emailing, and
    so forth.


    Solution

    Similar to shared list actions, LIST UTILITY shows functions (e.g., email, export,
    and so forth) outside the item list (Figure 7.61).


    Why

    The view as shown may not be sufficient for users’ needs. They may want to use
    information in their own analysis using their own tools. In addition, they may
    want to share information with others may not have direct access to the data.
    Utility functions can help users in performing such analyses and facilitate sharing.


    How

    First, distinguishing utility functions from shared list actions. Because utility
    functions apply to the list as a whole and not individual items, it’s important
    they be shown outside the list and presented separately from the shared list actions.
    The latter requires selecting items from the list, whereas the former does not.


    ![](img/ad042d15418a1098a617de420fc07871_234_0.png)


    **FIGURE 7.61** Google Analytics offers the utility functions "Export," "Email,"
    and "Add to Dashboard."'
  merge: -1
