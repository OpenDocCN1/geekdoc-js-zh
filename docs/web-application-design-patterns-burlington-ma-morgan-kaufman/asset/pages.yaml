    # ## Why


    For web applications that do not demand excessive horizontal space (i.e., mainly
    textual content and tables with just a few columns), a fixed-width layout is the
    most suitable, as information readability and scannability can be maintained even
    for larger browser window sizes. In addition, with fixed-width layouts, designers
    have complete control over the placement of page elements, which allows them to
    ensure the layout appears almost identical in all major browsers.


    # ## Why


    Fixed-width layouts are typically designed by specifying the width in pixels—an
    absolute unit of measure for text sizes. A downside of such approach is that it
    doesn''t scale well for users who have text sizes larger or smaller than those
    specified by the designer. A common alternative is to use relative units—that
    is, in em or ex. This layout is commonly referred to as an elastic layout because
    a layout changes its size based on the text size users. However, designing elastic
    layouts are still unaffected by browser widths and thus are fixed-width designs.


    Optimal screen resolution for specifying the width of the layout is an important
    consideration when designing fixed-width layouts. Design for $800 \times 600$
    resolutions to accommodate the largest number of users without introducing horizontal
    scrollbars. The width of the layout is then typically set to $750$ to $770$ pixels
    for the browser chrome. In situations where the design is targeted for $1024 \times
    768$ screen resolutions, the fixed-width container is set at $960$ pixels for
    all. The goal is, to prevent horizontal scrolling for the vast majority of the
    web application''s users. Baekdal''s (2006) research suggests that fixed-width
    designs for lower (i.e., $800 \times 600$) resolutions would support about $95$
    percent of users, whereas designed for larger (i.e., $1024 \times 768$) resolutions
    would only support about $80$ to $85$ percent of users.


    # ## CENTER LAYOUT ON THE PAGE


    Reduce the perception of empty space for users with larger screen resolutions
    by centering the layout so that the empty space is equally divided as the left'
