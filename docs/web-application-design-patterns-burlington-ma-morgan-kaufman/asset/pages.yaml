    # Related design patterns


    Use the BLANK SLATE design pattern, especially on “poke pages”, to avoid showing
    empty pages and to ensure that they are not confused as to what to do after logging
    in for the first time. This also helps them get comfortable using the application,
    especially for applications that rely on users to provide data.


    # DASHBOARD


    # Problem


    Information that helps users make decisions and monitor information about the
    “state of their world” is available, but requires users to visit different application
    areas. In addition, available information is not presented in a format that helps
    users make decisions and/or determine their next steps.


    # Solution


    Offer users a single-page “dashboard” view of information and metrics that they
    need to track. In addition, allow users to “drill” down to detailed content from
    the dashboard view (Figure 4.6).'
