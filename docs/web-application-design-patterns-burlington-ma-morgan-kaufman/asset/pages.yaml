    # ENABLE USERS TO RETRIEVE FORGOTTEN LOGIN INFORMATION


    Users often forget their login information, especially when they do not access
    a web application. Help users to retrieve login information by offering options
    such as “Forgot password?” and/or “Forgot username or password?” (Figure 3.21);
    see the FORGOT USERNAME/PASSWORD pattern later in this chapter.


    # CONSIDER A TWO-STEP LOGIN FOR HIGHER SECURITY


    For security reasons, many financial applications require a two-step login to
    verify a user’s identity. The first step is very similar to the login process
    described so far—that asking users to provide their username or user ID and password.
    The second step requires users to answer a security question. The answer must
    match the one provided during registration for them to successfully fully log
    in and access their account (Figure 3.22). Although many financial institutions
    require users to respond to a randomly selected security question, it may be annoying
    for users to answer questions every time they log in. To minimize frustration,
    offer users the option to skip the additional step by registering the computer
    they typically use to log in.'
