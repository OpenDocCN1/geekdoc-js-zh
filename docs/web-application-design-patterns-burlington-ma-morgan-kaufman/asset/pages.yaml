- img_proc: true
  md: '# CHAPTER 10 Internationalization


    regions may find confusing if it doesn''t match their local conventions. For example,
    the date "02/04/03" may be interpreted as


    +   * 2nd of April 2003 (Europe)

    * 4th of February 2003 (United States)

    * 3rd of April 2002 (Japan)


    The international format defined by ISO (ISO 8601) addresses this problem by defining
    a numerical date system in the format yyyy-mm-dd. Showing dates in an ISO format
    or making the month and year obvious prevents confusion. In addition, this approach
    is computer friendly, as it makes chronologically earlier easier (see also www.w3.org/International/questions/qa-date-format).


    However, the ISO date is difficult to read, as it is quite different from most
    users'' native date format. Therefore, when space and sorting are not issues,
    a more readable format that spells the month and makes the year obvious (e.g.,
    February 4, 2003, or 4 February 2003).


    # How


    Designers have two options to show dates:


    +   1. Use a locale-neutral ISO 8601 recommended format. The ISO 8601 recommended
    format of yyyy-mm-dd is the solution most commonly adopted by web applications
    with a diverse user base, where:

    * yyyy is the year (all the digits, i.e., 2008)

    * mm is the month (01, January, to 12, December)

    * dd is the day (01 to 31)

    January, 2008 would then be shown as 2008-02-01.


    +   2. Use a format that makes the month and year obvious. This approach uses
    a name for the month and four digits for the year. The date can be written as
    January 2, 2008, or 2 January 2008. This approach is more natural to users, it
    is easier to read. However, it occupies more space and, because it may affect
    sorting performance, it is less computer friendly.


    # BE CAREFUL WHEN ABBREVIATING MONTH


    Abbreviating letters for months in dates (e.g., Jan. 2, 2008, or 2 Jan.2008) may
    be problematic for users in some countries. In French, the first three letters
    of June and July are the same—juin and juillet, respectively.


    # CONSIDER USERS'' LOCALE PREFERENCES WHEN SHOWING DATES


