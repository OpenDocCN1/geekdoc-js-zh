  md: '# CHAPTER 2


    # Forms


    # INTRODUCTION


    Forms are a distinguishing characteristic of web applications. By using form elements
    (e.g., text boxes, dropdown lists, scrolling lists, radio buttons, checkboxes,
    and action buttons), web applications allow users to accomplish goals such as
    buying products and services, making flight reservations, directing directions,
    uploading and sharing photos, and so forth. To ensure that users accomplish their
    goals successfully, it is important that forms are not come and are designed such
    that:


    +   - Their purpose is clear (CLEAR BENEFITS).

    - They ask for only relevant and a minimal amount of information (SHORT FORMS).

    - Their organization clearly conveys the relationship among form elements (LOGICAL
    GROUPING).

    - Labels and corresponding form elements are aligned to improve scanning and completion
    (LABEL ALIGNMENT).

    - They clearly indicate what is expected from users (REQUIRED INDICATORS, INPUT
    HINTS/PROMPTS).

    - They minimize user input and do not require users to enter the same information
    twice (SMART DEFAULTS).

    - They make completing a form efficient (SMART DEFAULTS, FORGIVING FORMAT, KEYBOARD
    NAVIGATION).

    - They clearly indicate how to complete a task (ACTION BUTTONS).

    - They clearly guide users when errors occur (ERROR MESSAGES).


    Although selection of appropriate form elements (i.e., when to use a checkboxes
    or radio buttons) is extremely important for usable design, it’s not discussed
    here because excellent resources to address this topic already exist; for example,
    Mayhew (1991), Galitz (2002), Apple OS’s “Human Interface Design Guidelines” (2007),
    and Windows Vista’s “User Experience Guidelines” (2007).'
  merge: -1
  pgno: 29
