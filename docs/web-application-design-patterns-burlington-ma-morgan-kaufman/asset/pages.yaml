  md: '# WEB APPENDIX Help


    one another (HELP COMMUNITY). Offering such self-service options helps increase
    trust between application users and providers.


    Finally, when all else fails, nothing is more important than offering the ability
    to talk to a knowledgeable person to get the problem solved. Although including
    a support phone number is an obvious choice, companies users are increasingly
    offered CLICK-TO-CHAT options to help them get in touch with support personnel.


    # CONTEXTUAL Problem


    While trying to fill out or accomplish a task, users may have a question about
    one or more items on a page. Although application-level help includes such information
    (see the APPLICATION HELP pattern in this chapter), requiring users to navigate
    to a different part of the application may be undesirable because doing so may
    cause users to lose their task context or, worse, information.


    # Solution


    Offer help within the context of users'' information needs and make it easy for
    users and save them time looking for appropriate sections within the standalone
    help module (Figure Web.1). This may be in the form of hover tips or tool tips,
    a “What’s this?” link for information, and in-line prompts.


    # Why


    Offering help within the context of users'' tasks and locating closer to the problem
    area increase the likelihood of getting users'' questions answered and avoiding
    the feeling of needing help. In addition, by allowing users to maintain their
    task context and not needing them to navigate to a different page,


    FIGURE WEB.1

    Dell integrates help when users customize their selection by offering “Help Me
    Choose” links on system configuration.


    ![](img/ad042d15418a1098a617de420fc07871_446_0.png)'
