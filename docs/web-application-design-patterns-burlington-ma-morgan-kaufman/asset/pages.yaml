- img_proc: true
  md: '# Why


    Because users are presented with spatial information, showing them on a map of
    the physical space eliminates the need for users to visualize its location. It
    also makes information more meaningful and relevant to user goals, such as finding
    a location, navigating to and from a location, and relating data to the targeted
    region.


    # How


    Maps are typically used as a background image on which geographical, physical,
    and statistical information are superimposed. Depending on users'' needs, maps
    may be represented as illustrations (using points, lines, and polygons), photographic
    or satellite images, text, or a combination (Figure 7.41).


    # SHOW DETAILED INFORMATION ON DEMAND


    When showing several locations on a map, providing details of all of them at the
    same time could clutter the map and make it difficult for users to parse relevant
    information. In addition, users may be interested in seeing details of only a
    few locations. To minimize complexity, a common approach is to provide users details
    when they hover over or click on map markers. Detailed information can then be
    presented as hovertips or pop-ups.


    Hovertips are typically used when details are not extensive


    # FOR LARGE MAPS, PROVIDE USER CONTEXT BY SHOWING OVERVIEWS


    When panning and zooming large maps, it is important that users do not feel lost
    and are able to maintain their sense of location. Overviews within the map help
    provide such context (Figure 7.43). Most overviews support panning within them,
    allowing users to move to the “region” inside the overview, thus affecting the
    map being viewed.


    Some overviews support zooming as well. However, using overviews for panning and
    zooming is generally not as efficient as panning and zooming on the main map (Hornbæk
    et al., 2002) (see also the OVERVIEW-PLUS-DETAIL pattern in Chapter 8).'
  merge: -1
