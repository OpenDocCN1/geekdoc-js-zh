  md: '# CHAPTER 4 Application Main Page


    | | |

    |---||

    | | Alert icons convey state information by using both color and shape. They indicate
    binary information such as online/offline, safe, warning, and critical states.
    |

    | | Traffic light indicators, like alert icons, convey state information. Although
    they are widely recognized, they take up considerable space and are not desirable
    when screen ''real estate''. |

    | | Trend icons represent whether a metric is up or down, and with an accompanying
    color, the trend is favorable. |

    | | Spark lines provide a quick overview of trends and provide a historical context
    for the current value of the metric. |

    | | Progress bars provide a visual indication of progression along one dimension
    and, with appropriate threshold markers, can indicate whether specific limits
    are reached. |

    | | Gauges allow a quick assessment of desirable and undesirable values along
    a scale. Like traffic light indicators, however, they require additional space
    and are usually higher in the page''s visual hierarchy. Therefore, their use should
    be limited to the most important metrics |


    **FIGURE 4.9** Dashboard visualizations.


    # SHOW INFORMATION IN CONTEXT


    Because dashboards show monitored data (i.e., metrics) as abstractions or summaries,
    include their historical context to help users identify:


    +   - A metric is up or down.

    - The trend is increasing or decreasing (and favorable or unfavorable).

    - The metric is too close to the acceptable variance levels.

    - The metric has reached the desired benchmark; and so forth.


    Showing data in context offers users at-a-glance insights that simple measures
    by themselves can''t provide. Knowing the nature of contextual information that
    needs to be provided can also help identify appropriate methods and exception
    indicators. For example, trend information can be presented using line charts,
    area charts, or spark lines connected by trend icons (Figure 4.10).


    # DISPLAY ALL REQUIRED INFORMATION ON ONE SCREEN


    Whenever possible, avoid scrolling on dashboards (Few, 2006). This is especially
    for dashboards that present real-time data and are used primarily for monitoring.
    The main purpose of dashboards is to provide an overview of the current state
    for selected metrics and emphasize metrics that users need'' attention. In addition,
    ensure that every dashboard widget is allocated space and positioned relative
    to its importance to users.'
