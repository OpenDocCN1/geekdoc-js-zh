    # EDIT-IN-PLACE

    Problem


    When users are creating or editing items with just a few properties (no more than
    three or four), showing a pop-up window, or taking users to a separate “editor”
    makes the interaction inefficient. This is because users have to launch the editor,
    make changes, save those changes, and wait for the page to refresh to see updated
    information.


    # Solution


    Allow users to create new or make changes to the properties of an existing item
    “in place” using a lightweight editor (Figure 8.13). In some instances, it is
    better to use the “edit-in-place” option for editing a few chunks of information
    of existing items but not for creating new items. For example, in a bug-tracking
    application, changing an existing bug''s status is more suitable for edit-in-place,
    but creating a new bug entry may not be beneficial


