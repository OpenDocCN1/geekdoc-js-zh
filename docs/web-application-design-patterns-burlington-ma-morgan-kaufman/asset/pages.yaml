    # SHOW USERS AN EXAMPLE SNAPSHOT


    Set expectations of what the page will look like by showing a screenshot with
    sample content. Make it clear to users that they are not seeing real data by inserting
    watermarks, such as “Sample data” or “Example,” or dim the screenshot to it recede
    into the background (Figure 4.35).


    # ASSIST USERS IN THE INITIAL SETUP


    If there are certain tasks users must do before they can use the web application,
    offer options to guide them through the initial setup process. For example, for
    a financial application, users can be offered to set up accounts (Figure 4.36).


    # Related design patterns


    BLANK SLATES offer necessary guidance to new users of the application so that
    they can become productive with the application quickly. The need for assisting
    users does not completely go away after they have interacted with the application
    and filled with data. It is important to continue assisting users throughout their
    interaction with the application using CONTEXTUAL HELP, FREQUENTLY ASKED QUESTIONS,
    and APPLICATION help the Web Help Assist at www.elsevierdirect.com/9780123742650
    and the INPUT HINTS/PROMPTS pattern in Chapter 2.'
