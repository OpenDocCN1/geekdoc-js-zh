  md: 'employees may need to access a wide variety of information to accomplish tasks
    such as enrolling for benefits, managing personal information, reporting time
    and expenses, completing performance reviews, and so forth, of which require them
    to access a separate application.


    # # Solution


    Provide a central application that aggregates content and functionality from several
    sources and not only presents a unified look and feel, but also serves as a single
    launch point or access point for those applications (Figure 4.13). In addition,
    enable users to select content and customize their presentation, and if required
    for security and privacy reasons, restrict access to certain content and functions
    based on their roles and rights.


    # # Why


    Portals aggregate a disparate set of applications and offer a unified interface
    to users to access relevant content and applications that would otherwise have
    to be discovered and accessed independently. Portals also improve user experience
    by providing a consistent appearance and navigation (and single sign-on, SSO)
    when accessing a range of applications (the LOG IN pattern in Chapter 3). For
    many companies, a single launch point can help improve information sharing and
    collaboration among its users, which may include employees, customers, and partners.
    In addition, portals designed for self-service benefit both companies and users
    (employees or customers), they help reduce costs for the former and increase convenience
    for the latter.'
