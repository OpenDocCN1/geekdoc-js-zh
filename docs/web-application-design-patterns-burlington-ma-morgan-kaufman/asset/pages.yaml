  md: '# CHAPTER 10

    Internationalization


    # INTRODUCTION


    Web applications designed for global audiences need to address two important issues
    in their design: internationalization and localization (Aykin, 2000):¹


    +   - Internationalization (I18N)² is the process of designing an application
    so that it can be adapted to various languages and regions without engineering
    changes.

    - Localization (L10N) is the process of adapting an application for a specific
    region or language by adding locale-specific components and translating text.


    Internationalizing web applications is an important step toward localization.
    Not only can it decrease the total effort of localization by half (Hurst, 2007),
    but it can also eliminate the need to develop region and language-specific versions
    of the applications. The process of internationalization helps incorporate necessary
    flexibility and adaptability in web applications during the initial design (and
    not just localization) and requires paying attention to cultural norms and preferences,
    color choices, image appropriateness, and so forth (EXTENSIBLE DESIGN). In addition
    to designing for extensibility, designers must ensure that formats used for (DATE
    FORMAT, TIME FORMAT, NUMBER FORMAT), and currencies (CURRENCY AND CURRENCY FORMAT)
    follow familiar conventions and do not require undue effort for their interpretation
    (see the Geolocation sidebar).


    Once applications are localized, it''s important for users to be easily able to
    navigate to desired local applications (GLOBAL GATEWAY) and/or change the language
    while interacting with an application (LANGUAGE SELECTOR).


    > ¹A related term is globalization (sometimes abbreviated as G11N), which refers
    to the process of preparing both the application and the business for international
    markets (Aykin, 2000).


    > ²The terms internationalization and localization are sometimes abbreviated as
    I18N and L10N, respectively. The 18 in I18N refers to the number of letters between
    the I and N in the word internationalization; similarly, the 10 in L10N represents
    the number of letters between the L and N in the word localization.'
  merge: -1
