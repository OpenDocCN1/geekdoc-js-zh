  md: '# Action Buttons


    FIGURE 2.33

    Basecamp''s login screen aligns the primary action

    “Sign in” with

    form elements.


    ![](img/ad042d15418a1098a617de420fc07871_57_0.png)


    # ALIGN PRIMARY ACTION BUTTONS WITH FORM INPUT ELEMENTS


    ALIGN PRIMARY ACTION BUTTONS WITH FORM INPUT ELEMENTS


    Align primary action buttons with input elements (Figure 2.33). In an

    eye-tracking study conducted by Wroblewski and Etre (2007), aligning

    command buttons with input elements lead to faster form completion

    times, as it provided a clear path to completion for users.


    # ENABLE PRIMARY ACTION WHEN USERS PRESS “ENTER"


    The primary action for a form should be the default action when users press

    t “Return” or “Enter” key. This is particularly important for forms with only

    one input field, such as “Search.” This can be accomplished in HTML by set-

    ting the primary action button type to “Submit,” and in the following

    examples:


    ```

    <input type="submit" value="Save Changes" />

    <button type="submit">Save Changes</button>

    ```


    # BE CAREFUL DISABLING THE PRIMARY ACTION


    On short terms, it may be acceptable to disable the primary action until

    users have filled in the required fields (Figure 2.34). Such a practice can avoid

    errors by inadvertent submission of forms without all the required

    information. However, such a practice may be inappropriate for longer and

    complex forms users may not know why the primary action is unavail-

    able. They may incorrectly conclude that the form is not working properly

    and abandon the form.


    # DISABLE THE ACTION BUTTON AFTER THE FIRST CLICK


    Performing the same action multiple times (by repeatedly clicking the action

    button) could have undesirable consequences. For example, repeatedly-click-

    the action button may place order multiple times or place buy/sell

    orders on stock multiple. In such instances, disable the action button

    or remove it and replace it with “Processing...” or

    nPlease Wait.” This will acknowledge users’ actions and indicate that the web

    application is waiting for a response (Figure 2.35).'
  merge: -1
