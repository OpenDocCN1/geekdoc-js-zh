    # Related design patterns


    Large TIMELINES that don''t fit within the available screen space often incorporate
    the OVERVIEW-PLUS-DETAIL pattern (see Chapter 8) to allow users to zoom in and
    out to view details.


    # IMAGE LISTS/GRIDS


    # Problem


    Items presented to users are visual in nature, and presenting them using only
    their textual description may make it difficult for users to recognize and locate
    desired items. In addition, users may be able to recognize an item by its image
    but may be unfamiliar with the item''s name.


    # Solution


    Show users items as image grids or image lists rather than a textual list. However,
    complement images with a textual description (Figure 7.33).


    # Why


    > A picture is worth a thousand words. —A proverb


    Humans are able to recognize and recall images better than words (Paivio et al.,
    1968). Therefore, when showing multimedia content, such as photos, movies, music,
    and so forth, it’s easier for users to scan and find the desired item when all
    are presented as images rather than just in a textual list. The advantage of images
    over textual information—commonly referred to as Picture Superiority Effect (Lidwell
    et al., 2003)—isparticularly evident in situations where users may have been casually
    exposed to the image before or know what the “prototypical” image they are searching
    for. For example, if users are looking for a photo, an artist, an album, or a
    video that they have seen before or remember one more elements of, it would be
    faster for them to find it using images rather than text. Because memory for images
    is generally better than text or images by themselves,


    ![](img/ad042d15418a1098a617de420fc07871_216_0.png)


    FIGURE 7.33 Last.fm shows top videos as an image grid and includes brief textual
    information about the videos.'
