    of > was even more than prevalent among e-commerce sites (63.5 percent). Other
    commonly used separator symbols are /, ;, |, and →. Arrows and arrows are generally
    preferred because they clearly indicate movement from one level to another and
    users are familiar with their use in search directories (e.g., Yahoo!).


    # PLACE BREADCRUMBS BELOW THE PAGE HEADER


    The most frequent placement of breadcrumbs is below the page header near the page
    title. If the page header, the breadcrumbs trail them (Figure 5.31). If a page
    has vertical navigation on the left, breadcrumbs may be placed to its right. Placement
    of breadcrumbs below the header is also found to have a higher usage than at the
    top of the page (Lida and Chaparro, 2003).


    # MATCH BREADCRUMBS TRAIL LINKS TO CORRESPOND PAGE TITLES


    Just like the recommended practice for links to match their destination page titles,
    parent pages in breadcrumbs should match their corresponding page titles. This
    also makes it easy for users to recognize them if they visited on their way to
    the current page. If page titles are too long, shorten them with an ellipsis at
    the end, and provide the entire page title as a tool tip (or a hover tip).


    # MAKE LINKED BREADCRUMBS ELEMENTS LOOK LIKE LINKS


    Because parent pages in breadcrumbs are links, they should appear like links If
    they appear as buttons, they should look clickable. Without the necessary “click”
    affordance, breadcrumbs may fail to serve as an important navigation mechanism
    for users.


    # DESIGN BREADCRUMBS TO BE LOWER IN THE PAGE’S VISUAL HIERARCHY


    Breadcrumbs are not the primary form of navigation for users. Therefore, they
    should be placed lower in the page’s visual hierarchy (the VISUAL HIERARCHY pattern
    in Chapter 12). This is typically achieved by using smaller, yet readable, fonts
    and using no more than a single line of text on a'
