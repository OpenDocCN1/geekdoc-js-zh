    # USE DISTINCT ANCHORS FOR SLIDER ARM VALUES


    When using sliders for continuous values, use anchor labels (i.e., descriptors
    or icons) at the end of the slider arm (see Figure 8.33). For sliders for discrete
    values, use labels at each end as well as for each major value on the slider arm
    (see Figure 8.33). For sliders conveying color or other multivariable attributes,
    labels may not be necessary; however, show all attribute values as RGB or hexadecimal
    values for colors (see Figure 8.32).


    # INFORM US OF THE SELECTED VALUE(S)


    For continuous- and discrete-value sliders, users should always know the value(s)
    they have selected. In addition, when selected values affect more than one value
    (e.g., specifying a color using RGB, CMYK [cyan, magenta, black], or hexadecimal
    values), show users all the values (see Figure 8.32).


    # Related design patterns


    The DRAG-AND-DROP pattern is essential to make sliders work because users drag
    the slider to indicate their selections. Slider controls are also commonly used
    in DYNAMIC QUERING and may be applicable in RICH FORMS to specify one or more
    values within a range.


