  md: '# Faceted Navigation


    # Solution


    Offer us faceted navigation approach where users can choose any facet (i.e., attribute)
    of the item to navigate. With each selection of a facet, show users navigation
    choices based on facets that are valid for the remaining items (Figure 5.16).


    ![](img/ad042d15418a1098a617de420fc07871_137_0.png)


    Figure 5.16

    Wine.com uses a faceted navigation approach to help users navigate. With each
    selection, there are available facets based on value for the remaining items.
    Therefore, navigation choices available for (a) Wine > Cabernet Sauvignon > $20–40
    (price range).


    ![](img/ad042d15418a1098a617de420fc07871_137_1.png)'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Why


    In contrast to hierarchical navigation based on only one attribute, faceted navigation
    offers users the ability to navigate to desired items based on several attributes.
    In addition, users can select any available attribute to start their navigation.
    Another important benefit is that an empty result set is not possible with faceted
    navigation. Because faceted navigation is generated from "facets" (or attributes)
    of the remaining items, users see at least one at the end of the navigation. In
    fact, this is one important difference between faceted navigation (or faceted
    searching) from filtering (see the FILTERING and FACETED SEARCH patterns in Chapter
    6).


    # How


    Show users all available facets to start their navigation (Figure 5.17). After
    users have selected the initial facet, show items belonging to the selected facet
    along the updated navigation choices derived from the remaining items’ facets.
    Additional facets may be placed vertically or horizontally above the items list
    depending on the total number of facets available and the overall application
    design; horizontal placement may be limiting for items with several facets (Figure
    5.18).


    ![](img/ad042d15418a1098a617de420fc07871_138_0.png)


    FIGURE 5.17 Epicurious users offer users several facets to choose from browse
    recipes.


    # KEEP USERS INFORMED OF THEIR SELECTIONS


    Avoid disorientation by showing users their selections with mechanisms such as
    BREADCRUMBS above the item list (See Figure 5.19). See the BREADCRUMBS pattern
    later in this chapter.)'
  merge: -1
