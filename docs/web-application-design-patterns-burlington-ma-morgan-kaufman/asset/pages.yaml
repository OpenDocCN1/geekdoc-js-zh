  md: '# CHAPTER 7 Lists


    ![](img/ad042d15418a1098a617de420fc07871_210_0.png)


    FIGURE 7.23 When users click "Calendar," Clemson University’s web site shows users
    a monthly view by default (a) and allow them to switch to a weekly view or a daily
    view (b). In all views, users may navigate to another month or day using the calendar
    control or "previous" and "next" pagination controls.


    # Solution


    Use a calendar-like format to present items. In addition, consider showing them
    in a list view as allow users to switch between them (Figure 7.23).


    # Why


    Users generally know how to interact with calendars because of their familiarity
    with desktop applications such as Outlook, Entourage, iCal, and so forth. In addition,
    using a calendar view makes it easy for users to see detailed events and helps
    them with planning because they can clearly see available and busy time slots.


    # How


    Show users a calendar with an appropriate default view—for example, calendars
    for personal or business use typically show a weekly view by default. However,
    allow them to change to a different view per their preference (Figure 7.24).'
