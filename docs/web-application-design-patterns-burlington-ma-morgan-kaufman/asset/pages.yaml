  md: '# CHAPTER 8

    Rich Internet Applications


    # INTRODUCTION


    As discussed in Chapter 1, Rich Internet Applications (RIAs) can deliver responsiveness
    and interactivity comparable to desktop applications. With RIAs, the interaction
    remains continuous and dynamic because users do not have to wait for pages to
    refresh for basic data and layout updates and can immediately see the results
    of their actions.


    Perhaps the earliest rich interaction in web applications was a RICH-TEXT EDITOR,
    which enabled users to outline formatted text on pages without knowing the underlying
    HTML (HyperText Markup Language). With the advent of technologies such as Flash
    and Ajax (Asynchronous JavaScript and XML), richer interactions have become possible
    because they allow communications with web servers without explicit "submit" actions.
    Their initial use, however, has to replace the interactions that require users
    to wait for results to be processed by web servers and returned to them with a
    page refresh. With these validating user input and providing necessary feedback
    for data input when filling out forms (RICH FORM); AUTOSUGGEST/AUTOCOMPLETION;
    allowing users to edit information in the same location it''s being viewed (EDIT-IN-PLACE);
    panning and zooming around the information space (QUERY-PLUS-DETAIL); sorting
    and filtering the effects of user changes (LIVE PREVIEW); Enabling such richer
    interactions requires use of direct manipulation techniques in common desktop
    applications as DRAG-AND-DROP and interactive controls such as SLIDERS.


    In addition, communication changes effected on the page and help users maintain
    their visual content, designers have started relying on visual effects (ANIMATIONS/TRANSITIONS).
    Popular techniques include showing delays and progress in retrieving data (DELAY/PROGRESS
    INDICATOR); briefly highlighting changed information on a page (SPOTLIGHT/YELLOW-FADE);
    and allowing users to browse through a large set of items in a limited space'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# CHAPTER 8 Rich Internet Applications


    (CAROUSEL). By combining real-time aspects of data update with relevant visual
    effects, RIAs tend to make web application interactions efficient, effective,
    and pleasurable.


    # RICH-TEXT EDITOR


    Information entered by users may benefit from richer formatting, such as bold,
    underline, italic, and bullet list. In addition, the information may be better
    presented using colors, tables, images, and hyperlinks. Although this can be achieved
    with HTML, users cannot be expected to know HTML, and even if they do, cannot
    be expected to provide valid HTML. In some instances, allowing users to directly
    enter HTML (or JavaScript) may lead to security breaches as well.


    # Solution


    Allow users to enter information using rich-text editors with necessary controls
    for formatting and inserting images and hypertext links (Figure 8.1).


    # Why


    Plain text can go only so far. In applications where information is targeted to
    be used by others, such as email and blogs, it is important for users to emphasize
    certain information by making it bold, underlined, italicized, or with a different
    color. In some instances (e.g., blogs, job sites), it may also be important to
    provide supporting information such as tables, images, and links to other pages.
    Although this is possible by allowing users to enter their information in snippets
    of HTML, they cannot be expected to be familiar with. Allowing users to enter
    HTML may take more development effort to ensure that user-entered HTML is valid
    and that does not break the presentation of the rest of the page.


    Rich-text editors, because of their WYSIWYG (What You See Is What You Get) nature,
    are easy to format text and can be converted to HTML both for storage and allow
    users to see the effects of their selections immediately. Moreover, rich-text
    editors are easy for users who are likely to be familiar with similar interactions
    in office-productivity applications such as Microsoft Office, Core WordPerfect,
    OpenOffice, and so forth.


    ![](img/ad042d15418a1098a617de420fc07871_240_0.png)


    FIGURE 8.1 Yahoo! Mail offers users a rich-text editor for composing emails. Note
    that it also offers the option of inserting emoticons (i.e., “smileys”).'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# How


    Rich-text editors are typically used as part of a larger application and for specific
    data-entry tasks such as composing an email or creating a blog entry. So, it''s
    important to show the user-entry areas that can be formatted using rich-text controls
    and the formatting options that are available (e.g., bold, underline, italic,
    bulleted list, hyperlink, images, etc.).


    # OFFER USERS ALTERNATIVE TEXT OPTIONS


    Some users may not want to use rich-text options. When feasible, offer alternative
    text-input options such as plain text or HTML. In email applications, for example,
    consider providing a text option (Figure 8.2). In blogs, on the other hand, offer
    the option to enter HTML directly (Figure 8.3). Ensure that userentered scripts
    (e.g., JavaScript) in HTML code are removed before saving the information to prevent
    security breaches.


    # OFFER ONLY RELEVANT RICH-TEXT FORMATTING CONTLS


    It is not necessary to offer all possible controls to users, just those most users
    are likely to use. For example, Gmail does not offer any controls for creating


