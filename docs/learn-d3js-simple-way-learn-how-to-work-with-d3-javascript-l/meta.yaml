  md: '# 6. Geometrical objects


    While we are creating a graph or chart, the individual elements of these graphs
    or charts are our geometrical objects. It can be a rectangle or circle and it
    can be a line or an arc. Let’s see the example to make these geometrical objects
    using D3. In the previous section we saw how to add style sheets to our D3. In
    the same example, we will add our geometrical objects to it. In this example we
    are going to use the same SVG and append the rectangle inside it.


    ```

    <!DOCTYPE html>

    <meta charset="utf-8">

    <title>Adding attributes and selection to SVG element</title>

    <link rel="stylesheet" type="text/css" href="style.css"></link>

    <body>

    <script src="../D3/d3.v3.min.js"></script>

    <script>

    var svg = d3.select("body").append("svg").attr("width","300px")

    .attr("height","100px").attr("class","blueBack");


    svg.append("rect")

    .attr("width","100px")

    .attr("height","50px")

    .attr("x","100px")

    .attr("y","20px")

    .style("fill","orange");


    svg.append("circle")

    .attr("r","20px")

    .attr("cx","100px")

    .attr("cy","20px")

    .style("fill","green");

    </script>

    </body>

    ```


    The code given below is to draw rectangle of size 100X50 pixels with padding x
    and y as 100 and 20 respectively. The **padding** is used to denote the D3 to
    start drawing the object in x and y axis. We also filled the rectangle with orange
    colour.


    ```

    svg.append(“rect”)

    .attr(“width”,“100px”)

    .attr(“height”,“50px”)

    .attr(“x”,“100px”)

    .attr(“y”,“20px”)

    .style(“fill”,“orange”);

    ```


    The code to draw circle is given below. To draw a circle we need radius so we
    defined radius of 100px. The x and y is for the same purpose of padding in the
    rectangle. The colour inside the circle is given green to differentiate it from
    rectangle.


    ```

    svg.append(“circle”)

    ```'
