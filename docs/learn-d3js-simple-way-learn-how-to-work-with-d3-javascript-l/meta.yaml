    # 9. Scale and Axis


    In the previous example we saw that our last rectangle bar is out of our SVG.
    To rectify this error we are using scales in our D3.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_50_0.png)


    Generally we have an input and we have to map that input to the desired output.
    The output can be width of the canvas or the height of the canvas. Input can be
    our data points or how many numbers of data points we have to map. In D3 the input
    is called **domain** and the output is called **range**. So, we have to map the
    domain into range. For example, let’s assume we have three inputs 1, 2, 3 and
    we have to map these three inputs with six alphabets namely a, b, c, d, e, f.
    One simple approach we will do here is we can assign each input value to two alphabets.
    That is 1 is having a and b, 2 is having c and d, 3 is having e and f. This is
    the simple example for how the mapping can be done. There can be multiple approaches
    like value based approach. Example 1 will have a, 2 will have b and c, 3 will
    have d, e, f.


    In D3 we have two main types of scaling called **Linear** scaling and **Ordinal**
    Scaling.


    **Linear Scaling** - It is for continuous input domains, such as numbers.


    **Ordinal Scaling** - It is for discrete domain, such as a set of names or categories.


    Ordinal scale


    Let’s take an example for the bar chart. In that bar chart if we want to place
    the bars at a proper distance from each other as shown in the picture below as
    2, 4 and 6 units. In this data set we have input data set as [1, 2, 3] and we
    need to have an output data set as [2, 4, 6] that is how much distance it has
    from origin. In this scenario, we need to have a function to take each input data
    set and map it to the output data set. This function is called an ordinal scale.'
