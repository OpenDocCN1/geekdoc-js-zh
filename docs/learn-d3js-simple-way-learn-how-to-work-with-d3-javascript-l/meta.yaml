    var tooltip = d3.select('body').append('div')\n    .style('position','absolute')\n\
    \    .style('background','#fff')\n    .style('padding','5 15px')\n    .style('border','1px\
    \ #fff solid')\n    .style('border-radius','5px')\n    .style('opacity','0');\n\
    ```\n\n4. In the map we also have a click event. That is whenever a user clicks\
    \ a particular state on the map the user can see a bar chart. We will execute\
    \ a function while the click event occurs. We can see that we are using two functions\
    \ that we are using here update and new. The new function will be called while\
    \ the user clicks the state for the first time. At that time the state population\
    \ graph will appear. Once it appears and user clicks any other state the update\
    \ function will be called. The 'if' statement should be added after creating state\
    \ bar chart.\n\n```javascript\n}).on(\"click\", function(d,i){\n    if(document.getElementById(\"\
    stateBar\").childNodes.length>0)\n    {\n        addStateBarChart(d,i,\"update\"\
    );\n    }else{\n        addStateBarChart(d,i,\"new\");\n    }\n```\n\n## 15.3.\
    \ Defining properties for our state vs population bar chart\n\n5. Next we are\
    \ going to define the state vs population bar chart (Main bar chart). To do that\
    \ we will create a function called barFirstTimeRender(). We will create the limit\
    \ of bar chart and other boundaries and padding. Also copy the tooltip of the\
    \ map and use it here. The maxPop is used to fix the highest population of all\
    \ the states and use that for scaling.\n\n6. We use the ‘for loop’ to find the\
    \ maximum population value of the current year. If(!Number.isNaN(parseInt(k))){\
    \ - This is used to allow only year values inside the key condition. For that\
    \ we used ‘not a number(NaN)’.\n\n```javascript\nfunction barFirstTimeRender(){\n\
    \    var maxPop = 0;\n    var widthBar = 750;\n    var heightBar = 700;\n    var\
    \ paddingText = 70;\n    var tooltip = d3.select('body').append('div')\n     \
    \   .style('position','absolute')\n        .style('background','#fff')\n     \
    \   .style('padding','5 15px')\n        .style('border','1px #fff solid')\n  \
    \      .style('border-radius','5px')\n        .style('opacity','0');\n\n    for(var\
    \ i=0;i<dataUSPopulation.length;i++){\n        for(k in dataUSPopulation[i]){\n\
    \            if(!Number.isNaN(parseInt(k))){\n                if(dataUSPopulation[i][k]>maxPop){\n\
    \                    maxPop = dataUSPopulation[i][k];\n                }\n   \
    \         }\n        }\n    }\n}\n```\n\n7. Once we have the maximum population\
    \ that will be the upper limit for the bar chart then we will create the scales.\n\
    \n```javascript\nvar h = d3.scale.linear()\n        .domain([0,maxPop])\n    \
    \    .range([0,heightBar]);\n\nvar y = d3.scale.linear()\n        .domain([0,maxPop])\n\
    \        .range([heightBar,0]);\n\nvar x = d3.scale.ordinal()\n        .domain(d3.range(dataUSPopulation.length))\n\
    \        .rangeRoundBands([0,widthBar]);\n```\n\n8. After creating scales we will\
    \ create the ‘Y’ Axis with number of ticks, orientation and scale. Similarly for\
    \ ‘X’ axis also. Also we will create the width of the bar by dividing widthBar\
    \ / dataUSPopulation with floor value to make sure a complete rounded value.\n\
    \n```javascript\nvar yAxis = d3.svg.axis()\n    .scale(y)\n    .orient('left')\n\
    \    .ticks(10);\n\nvar xAxis = d3.svg.axis()\n    .scale(x)\n    .orient('bottom')\n\
