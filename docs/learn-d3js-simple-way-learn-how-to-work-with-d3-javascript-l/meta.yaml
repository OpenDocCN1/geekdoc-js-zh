    ```

    svg.selectAll("#kpi")

    .text(sBData["2016"])

    .transition()

    .duration(1000);


    svg.selectAll("#kpiDec")

    .text(sBState)

    .transition()

    .duration(1000);

    ```


    18. We also need to add the KPI information to the function barFirstTimeRender
