- md: "## 5. Styling\n\nStyling mostly refers to the CSS part of our D3 Application.\
    \ The CSS part will make our application look nice. In addition, while we are\
    \ drawing the graphical elements like bubble chart and bar chart, styling also\
    \ becomes very essential when we differentiate the data points. Styling to our\
    \ D3 can be achieved in three different ways.\n\n- **Inline**\n- **External**\n\
    - **Internal**\n\n## Inline\n\nThe rule of styling is to be within the quote (“”).\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_30_0.png)\n\nThis is the Inline style\
    \ rule that we saw in the previous example.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_30_1.png)\n\
    \n## External or Internal Style Sheet\n\nIn this scenario, the style is directly\
    \ added to our element. However, the better approach is to go with the external\
    \ or internal style class. Here we shall be defining a class and we will add this\
    \ class to the element. Later on, if we want to change the properties then we\
    \ don’t have to access all individual elements to perform those changes. We simply\
    \ do the changes in the class and it can be picked up by the elements of the assigned\
    \ class. We will see this in our coding.\n\n## Internal Style Rule\n\nThe internal\
    \ style rule can be defined inside the main coding without any external style\
    \ sheets. The following code is an example for internal style sheet.\n\n### Code\
    \ for Internal Style Rule:\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\"\
    >\n<title>Adding attributes and selection to SVG element</title>\n<style>\n.blueBack{\n\
    \    background : blue;\n}\n</style>\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\nvar svg =\nd3.select(“body”).append(“svg”).attr(“width”,“300px”).attr(“height”,“100px”).attr(“class”,\n\
    /* we are appending the class property ‘blueBack’ with body elements*/\n</script>\n\
    </body>\n</html>\n```\n\n## Output\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_31_0.png)\n\
    \n## External Style Rule\n\nExternal style rules can be added to the program by\
    \ creating a <filename>.css file and link the CSS file inside the program. For\
    \ instance, we create a style sheet as style.css then we link it in the program\
    \ using the filename style. This can be linked at the start of the coding part\
    \ shown in the following screenshot.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_32_0.png)\n\
    \n### D3.Styling.html\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n\
    <title>Adding attributes and selection to SVG element</title>\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n    var svg = d3.select(\"body\").append(\"svg\").attr(\"\
    width\", \"300px\")\n            .attr(\"height\", \"100px\").attr(\"class\",\
    \ \"blueBack\");\n</script>\n</body>\n</html>\n```\n\n### style.css\n\n```css\n\
    .blueBack{\n\n    background : blue;\n\n}\n```\n\nYou can also check our **Learn\
    \ D3.JS Hands-on And The Simple Way** video course for accelerated learning: [here](here)\
    \ or use the below QR code for 50-90% off.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_33_0.png)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_33_1.png)\n\n## 6. Geometrical objects\n\
    \nWhile we are creating a graph or chart, the individual elements of these graphs\
    \ or charts are our geometrical objects. It can be a rectangle or circle and it\
    \ can be a line or an arc. Let’s see the example to make these geometrical objects\
    \ using D3. In the previous section we saw how to add style sheets to our D3.\
    \ In the same example, we will add our geometrical objects to it. In this example\
    \ we are going to use the same SVG and append the rectangle inside it.\n\n```html\n\
    <!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and selection\
    \ to SVG element</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
    ></link>\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\nvar\
    \ svg = d3.select(\"body\").append(\"svg\").attr(\"width\",\"300px\")\n.attr(\"\
    height\",\"100px\").attr(\"class\",\"blueBack\");\n\nsvg.append(\"rect\")\n.attr(\"\
    width\",\"100px\")\n.attr(\"height\",\"50px\")\n.attr(\"x\",\"100px\")\n.attr(\"\
    y\",\"20px\")\n.style(\"fill\",\"orange\");\n\nsvg.append(\"circle\")\n.attr(\"\
    r\",\"20px\")\n.attr(\"cx\",\"100px\")\n.attr(\"cy\",\"20px\")\n.style(\"fill\"\
    ,\"green\");\n</script>\n</body>\n```\n\nThe code given below is to draw rectangle\
    \ of size 100X50 pixels with padding x and y as 100 and 20 respectively. The **padding**\
    \ is used to denote the D3 to start drawing the object in x and y axis. We also\
    \ filled the rectangle with orange colour.\n\n```javascript\nsvg.append(“rect”)\n\
    .attr(“width”,“100px”)\n.attr(“height”,“50px”)\n.attr(“x”,“100px”)\n.attr(“y”,“20px”)\n\
    .style(“fill”,“orange”);\n```\n\nThe code to draw circle is given below. To draw\
    \ a circle we need radius so we defined radius of 100px. The x and y is for the\
    \ same purpose of padding in the rectangle. The colour inside the circle is given\
    \ green to differentiate it from rectangle.\n\n```javascript\nsvg.append(“circle”)\n\
    .attr(\"r\", \"20px\")\n.attr(\"cx\", \"100px\")\n.attr(\"cy\", \"20px\")\n.style(\"\
    fill\", \"green\");\n```\n\n### Code for D3GeometricalShape.html\n\n```html\n\
    <!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and selection\
    \ to SVG element</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
    ></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n \
    \   var svg = d3.select(\"body\").append(\"svg\").attr(\"width\", \"300px\")\n\
    \    .attr(\"height\", \"100px\").attr(\"class\", \"blueBack\");\n\n\n    svg.append(\"\
    rect\")\n    .attr(\"width\", 100px\")\n    .attr(\"height\", 50px\")\n    .attr(\"\
    x\", 100px\")\n    .attr(\"y\", 20px\")\n    .style(\"fill\", \"orange\");\n\n\
    \    svg.append(\"circle\")\n    .attr(\"r\", 20px\")\n    .attr(\"cx\", 100px\"\
    )\n    .attr(\"cy\", 20px)\n    .style(\"fill\", \"green\");\n</script>\n</body>\n\
    </html>\n```\n\n## Output\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_37_0.png)\n\
    \nIn real projects we use variables instead of hard coding the attribute values\
    \ width, height.\nIn the next section we will see bar chart using rectangles.\n\
    You can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](https://example.com) or use the below QR code\
    \ for 50-90% off.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_37_1.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_37_2.png)\n\
    \n## 7. Bringing Data into the Picture\n\nWe are going to use data into our project.\
    \ The data can be JavaScript Array, JSON, XML or CSV Data. We can load the data\
    \ to our D3 application externally. In real projects data will be passed to the\
    \ application using Asynchronous request. We will be using some asynchronous services\
    \ and via AJAX calls we will be getting the data to our application. In the previous\
    \ section we saw geometrical objects. Using that we will create bar charts with\
    \ some data to visualize in D3. There will be some new functions that we will\
    \ see in our application called:\n\n1. data()\n2. enter()\n\nWe will discuss it\
    \ in our examples.\n\n## Coding\n\nWe will create a new file named as D3DataHand.html\
    \ and copy the structure from the previous examples and remove the other unwanted\
    \ coding. Now, we are going to add some data using a variable called data. After\
    \ adding data we will set the height and width of the total SVG. Also we are appending\
    \ the SVG inside the body. Here you can see as we told in the previous section,\
    \ instead of hard coded value we assigned the variables widthSVG and heightSVG.\
    \ Also, we gave the background style as black colour.\n\n```javascript\nvar data\
    \ = [10,20,30,40,100];\nvar heightSVG = 700;\nvar widthSVG = 700;\nvar svg = d3.select(\"\
    body\")\n    .append(\"svg\")\n    .attr(\"width\",widthSVG)\n    .attr(\"height\"\
    ,heightSVG)\n    .style(\"background\",\"black\");\n```\n\nAfter initializing\
    \ the data we start adding data and draw our bar chart.\n\n```javascript\nsvg.selectAll()\n\
    .data(data)\n.enter()\n.append(\"rect\")\n.attr(\"height\",function(d,i){\n  \
    \  return d*100;\n})\n.attr(\"width\",\"20px\")\n.style(\"fill\",\"orange\")\n\
    .attr(\"y\",function(d,i){\n    return heightSVG -(d)*10 ;\n})\n.attr(\"x\",function(d,i){\n\
    \    return i*40;\n}));\n```\n\n- We are adding the data to the program using\
    \ .data(data).\n- After that, we use .enter() function. It is used to perform\
    \ same actions to all data after enter(). It is similar to loop.\n\nThen we will\
    \ add rectangle. This rectangle width is constant but the height is dependent\
    \ upon the data input. To make the height depend upon the data we add the function\
    \ (d,i) where ‘d’ is the data and ‘i’ is the index. The width of the bar is constant\
    \ because we are using bar chart here. So we gave the constant 20px. For the y\
    \ value the function d and i are used to draw the rectangle according to the data.\
    \ The returnheightSVG – (d)*10; is used to return the height of SVG according\
    \ to the data. The value 10 is used for scaling purpose to enlarge or decrease\
    \ the size of the rectangle.\n\n### Code for D3DataHand.html\n\n```html\n<!DOCTYPE\
    \ html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and selection to SVG\
    \ element</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
    ></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n\n\
    \    var data=[10,20,30,40,100];  //Data variable Array\n    var heightSVG = 700;\
    \      //Maximum height of SVG\n    var widthSVG = 700;       //Maximum width\
    \ of SVG\n    var svg = d3.select(\"body\")\n    .append(\"svg\")\n    //As we\
    \ told in previous example we removed the hard coded value and given variables\n\
    \                                widthSVG and heightSVG\n\n    .attr(\"width\"\
    ,widthSVG)\n    .attr(\"height\",heightSVG)\n    .style(\"background\",\"black\"\
    );  //Black background\n\n    svg.selectAll()\n```"
  mdcn: "\n## 5. 样式\n\n样式主要指我们 D3 应用程序的 CSS 部分。CSS 部分将使我们的应用程序看起来更美观。此外，在绘制气泡图和条形图等图形元素时，当我们需要区分数据点时，样式也变得至关重要。D3\
    \ 的样式可以通过三种不同的方式实现。\n\n-   **行内**\n-   **外部**\n-   **内部**\n\n## 行内\n\n样式的规则是在引号（“”）内定义。\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_30_0.png)\n\n这是我们之前示例中看到的行内样式规则。\n\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_30_1.png)\n\n## 外部或内部样式表\n\n在这种情况下，样式直接添加到我们的元素上。然而，更好的方法是使用外部或内部样式类。在这里，我们将定义一个类，并将这个类添加到元素上。之后，如果我们想更改属性，就不必访问所有单独的元素来执行这些更改。我们只需在类中进行更改，已分配该类的元素就会采用这些更改。我们将在编码中看到这一点。\n\
    \n## 内部样式规则\n\n内部样式规则可以在主代码内部定义，无需任何外部样式表。以下代码是内部样式表的一个示例。\n\n### 内部样式规则代码：\n\n\
    ```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and\
    \ selection to SVG element</title>\n<style>\n.blueBack{\n    background : blue;\n\
    }\n</style>\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n\
    var svg =\nd3.select(“body”).append(“svg”).attr(“width”,“300px”).attr(“height”,“100px”).attr(“class”,\n\
    /* we are appending the class property ‘blueBack’ with body elements*/\n</script>\n\
    </body>\n</html>\n```\n\n## 输出\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_31_0.png)\n\
    \n## 外部样式规则\n\n可以通过创建一个 `<filename>.css` 文件并在程序内链接该 CSS 文件来添加外部样式规则。例如，我们创建一个名为\
    \ `style.css` 的样式表，然后在程序中使用文件名 `style` 进行链接。这可以在编码部分的开头链接，如下图所示。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_32_0.png)\n\
    \n### D3.Styling.html\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n\
    <title>Adding attributes and selection to SVG element</title>\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n    var svg = d3.select(\"body\").append(\"svg\").attr(\"\
    width\", \"300px\")\n            .attr(\"height\", \"100px\").attr(\"class\",\
    \ \"blueBack\");\n</script>\n</body>\n</html>\n```\n\n### style.css\n\n```css\n\
    .blueBack{\n\n    background : blue;\n\n}\n```\n\n您也可以查看我们的 **Learn D3.JS Hands-on\
    \ And The Simple Way** 视频课程以加速学习：[这里](here)，或使用下方二维码享受 50-90% 折扣。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_33_0.png)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_33_1.png)\n\n## 6. 几何对象\n\n在我们创建图表时，这些图表的各个元素就是我们的几何对象。它可以是矩形或圆形，也可以是线条或圆弧。让我们通过示例看看如何使用\
    \ D3 创建这些几何对象。在上一节中，我们了解了如何为 D3 添加样式表。在同一个示例中，我们将把几何对象添加到其中。在这个例子中，我们将使用相同的 SVG\
    \ 并在其内部追加矩形。\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding\
    \ attributes and selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"style.css\"></link>\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\nvar svg = d3.select(\"body\").append(\"svg\").attr(\"width\"\
    ,\"300px\")\n.attr(\"height\",\"100px\").attr(\"class\",\"blueBack\");\n\nsvg.append(\"\
    rect\")\n.attr(\"width\",\"100px\")\n.attr(\"height\",\"50px\")\n.attr(\"x\",\"\
    100px\")\n.attr(\"y\",\"20px\")\n.style(\"fill\",\"orange\");\n\nsvg.append(\"\
    circle\")\n.attr(\"r\",\"20px\")\n.attr(\"cx\",\"100px\")\n.attr(\"cy\",\"20px\"\
    )\n.style(\"fill\",\"green\");\n</script>\n</body>\n```\n\n下面的代码用于绘制一个尺寸为 100X50\
    \ 像素的矩形，其 x 和 y 内边距分别为 100 和 20。**内边距** 用于指定 D3 开始绘制对象的 x 和 y 轴位置。我们还将矩形填充为橙色。\n\
    \n```javascript\nsvg.append(“rect”)\n.attr(“width”,“100px”)\n.attr(“height”,“50px”)\n\
    .attr(“x”,“100px”)\n.attr(“y”,“20px”)\n.style(“fill”,“orange”);\n```\n\n下面的代码用于绘制圆形。要绘制一个圆，我们需要半径，因此我们定义了\
    \ 100px 的半径。x 和 y 的作用与矩形中的内边距相同。圆内部的颜色设置为绿色，以将其与矩形区分开来。\n\n```javascript\nsvg.append(“circle”)\n\
    .attr(\"r\", \"20px\")\n.attr(\"cx\", \"100px\")\n.attr(\"cy\", \"20px\")\n.style(\"\
    fill\", \"green\");\n```\n\n### D3GeometricalShape.html 的代码\n\n```html\n<!DOCTYPE\
    \ html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and selection to SVG\
    \ element</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
    ></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n \
    \   var svg = d3.select(\"body\").append(\"svg\").attr(\"width\", \"300px\")\n\
    \    .attr(\"height\", \"100px\").attr(\"class\", \"blueBack\");\n\n\n    svg.append(\"\
    rect\")\n    .attr(\"width\", 100px\")\n    .attr(\"height\", 50px\")\n    .attr(\"\
    x\", 100px\")\n    .attr(\"y\", 20px)\n    .style(\"fill\", \"orange\");\n\n \
    \   svg.append(\"circle\")\n    .attr(\"r\", 20px\")\n    .attr(\"cx\", 100px)\n\
    \    .attr(\"cy\", 20px)\n    .style(\"fill\", \"green\");\n</script>\n</body>\n\
    </html>\n```\n\n## 输出\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_37_0.png)\n\n\
    在实际项目中，我们使用变量而不是硬编码属性值 width、height。\n在下一节中，我们将看到使用矩形创建的条形图。\n您也可以查看我们的 **Learn\
    \ D3.JS Hands-on And The Simple Way** 视频课程以加速学习：[这里](https://example.com)，或使用下方二维码享受\
    \ 50-90% 折扣。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_37_1.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_37_2.png)\n\
    \n## 7. 将数据引入画面\n\n我们将在项目中使用数据。数据可以是 JavaScript 数组、JSON、XML 或 CSV 数据。我们可以将数据从外部加载到\
    \ D3 应用程序中。在实际项目中，数据将通过异步请求传递给应用程序。我们将使用一些异步服务，并通过 AJAX 调用将数据获取到我们的应用程序中。在上一节中，我们了解了几何对象。利用它们，我们将使用一些数据创建条形图，以便在\
    \ D3 中进行可视化。我们将在应用程序中看到一些新的函数，称为：\n\n1.  data()\n2.  enter()\n\n我们将在示例中讨论它们。\n\
    \n## 编码\n\n我们将创建一个名为 `D3DataHand.html` 的新文件，并从之前的示例中复制结构，删除其他不需要的编码。现在，我们将使用一个名为\
    \ `data` 的变量添加一些数据。添加数据后，我们将设置整个 SVG 的宽度和高度。同时，我们将 SVG 追加到 body 内部。在这里，正如我们在上一节中所说，我们使用了变量\
    \ `widthSVG` 和 `heightSVG` 而不是硬编码值。此外，我们将背景样式设置为黑色。\n\n```javascript\nvar data\
    \ = [10,20,30,40,100];\nvar heightSVG = 700;\nvar widthSVG = 700;\nvar svg = d3.select(\"\
    body\")\n    .append(\"svg\")\n    .attr(\"width\",widthSVG)\n    .attr(\"height\"\
    ,heightSVG)\n    .style(\"background\",\"black\");\n```\n\n初始化数据后，我们开始添加数据并绘制条形图。\n\
    \n```javascript\nsvg.selectAll()\n.data(data)\n.enter()\n.append(\"rect\")\n.attr(\"\
    height\",function(d,i){\n    return d*100;\n})\n.attr(\"width\",\"20px\")\n.style(\"\
    fill\",\"orange\")\n.attr(\"y\",function(d,i){\n    return heightSVG -(d)*10 ;\n\
    })\n.attr(\"x\",function(d,i){\n    return i*40;\n}));\n```\n\n-   我们使用 `.data(data)`\
    \ 将数据添加到程序中。\n-   之后，我们使用 `.enter()` 函数。它用于对进入后的所有数据执行相同的操作。它类似于循环。\n\n然后我们将添加矩形。这个矩形的宽度是固定的，但高度取决于数据输入。为了使高度依赖于数据，我们添加了函数\
    \ `(d,i)`，其中 ‘d’ 是数据，‘i’ 是索引。条形的宽度是固定的，因为我们这里使用的是条形图。所以我们给出了常量 `20px`。对于 y 值，函数\
    \ `d` 和 `i` 用于根据数据绘制矩形。`return heightSVG -(d)*10;` 用于根据数据返回 SVG 的高度。值 `10` 用于缩放目的，以放大或缩小矩形的尺寸。\n\
    \n### D3DataHand.html 的代码\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\"\
    >\n<title>Adding attributes and selection to SVG element</title>\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"\
    ../D3/d3.v3.min.js\"></script>\n<script>\n\n    var data=[10,20,30,40,100];  //Data\
    \ variable Array\n    var heightSVG = 700;      //Maximum height of SVG\n    var\
    \ widthSVG = 700;       //Maximum width of SVG\n    var svg = d3.select(\"body\"\
    )\n    .append(\"svg\")\n    //As we told in previous example we removed the hard\
    \ coded value and given variables\n                                widthSVG and\
    \ heightSVG\n\n    .attr(\"width\",widthSVG)\n    .attr(\"height\",heightSVG)\n\
    \    .style(\"background\",\"black\");  //Black background\n\n    svg.selectAll()\n\
    ```\n"
