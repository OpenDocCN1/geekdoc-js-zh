    # 5. Styling


    Styling mostly refers to the CSS part of our D3 Application. The CSS part will
    make our application look nice. In addition, while we are drawing the graphical
    elements like bubble chart and bar chart, styling also becomes very essential
    when we differentiate the data points. Styling to our D3 can be achieved in three
    different ways.


    +   * **Inline**

    * **External**

    * **Internal**


    # Inline


    The rule of styling is to be within the quote (“”).


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_30_0.png)


    This is the Inline style rule that we saw in the previous example.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_30_1.png)


    # External or Internal Style Sheet


    In this scenario, the style is directly added to our element. However, the better
    approach is to go with the external or internal style class. Here we shall be
    defining a class and we will add this class to the element. Later on, if we want
    to change the properties then we don’t have to access all individual elements
    to perform those changes. We simply do the changes in the class and it can be
    picked up by the elements of the assigned class. We will see this in our coding.


    # Internal Style Rule


    The internal style rule can be defined inside the main coding without any external
    style sheets. The following code is an example for internal style sheet.


    # Code for Internal Style Rule:


    ```

    <!DOCTYPE html>

    <meta charset="utf-8">

    <title>Adding attributes and selection to SVG element</title>

    <style>

