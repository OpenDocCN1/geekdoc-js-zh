- md: "## 10. Events\n\nEvents are used to perform some action while we move the mouse\
    \ over an object. For example, in the bar chart we created previously, if we move\
    \ the mouse over the bar, then a small pop up will appear on it to display the\
    \ value of the bar. Similarly, when the bars are being generated, then there will\
    \ be some transition effects. These are done by using events. To create an event,\
    \ we need an `on` function. In this event, we are using the `mouseover` event.\
    \ So we need to give the value as `mouseover` event inside the `on` function.\
    \ The second parameter `function(d)` is used to call the function when the event\
    \ is triggered. To add a transition property during the bar generation, we need\
    \ to use the `transition` function with parameters for the duration of the animation\
    \ and its attributes to be changed in this transition. For example, while the\
    \ bar starts to generate, it will generate from the bottom or slide over from\
    \ the side. These will be done by the attributes. Let's go to our cloud9 IDE to\
    \ use events in our bar chart.\n\nIn the last section, we created the bar chart.\
    \ Now we are going to use events on that bar chart.\n\n![Bar Chart](img/fe6f284f77f839b45695e65dc7c6dabb_65_0.png)\n\
    \n1.  We need a tooltip to display the value of the bar. So we create a box and\
    \ add a tooltip. Then we select the `body`. We append a `div` element. We need\
    \ to add styling to the tooltip. We add the position as `absolute` and background\
    \ as white color. Also, we added `padding` and `border` properties to the tooltip.\
    \ The `opacity` we initially give as 0 because we are going to hide this one for\
    \ now. We can change it later by increasing the value.\n\n    ```javascript\n\
    \    var tooltip = d3.select('body')\n    .append('div')\n    .style('position','absolute')\n\
    \    .style('background','#fff')\n    .style('padding','5px 15px')\n    .style('border','1px\
    \ #fff solid')\n    .style('opacity','0');\n    ```\n\n2.  We are going to add\
    \ the `on` function for the `mouseover` event. The `function(d)` will pull our\
    \ tooltip while we move the mouse over the bar. The `left` and `top` are the positions\
    \ to show the tooltip on the bar.\n\n3.  The `d3.select(this).style('opacity',0.5);`\
    \ function will select the current bar that the mouse is pointing at and it will\
    \ reduce the opacity to 0.5. Once we reduce the opacity, it will be set as 0.5\
    \ and does not change back to 1. To perform that, we add another `mouseout` event\
    \ to set it back to 1.\n\n    ```javascript\n    }).on('mouseover',function(d){\n\
    \        tooltip.transition().style('opacity',1);\n        tooltip.html(d)\n \
    \           .style('left',(d3.event.pageX)+'px')\n            .style('top',(d3.event.pageY)+'px');\n\
    \        d3.select(this).style('opacity',0.5);\n    }).on('mouseout',function(d){\n\
    \        d3.select(this).style('opacity',1);\n    });\n    ```\n\n4.  The next\
    \ step is to add a transition effect. To perform that, we add a `transition` function\
    \ to the graph. We need to do the transition for all the rectangles, so we selected\
    \ all the rectangles by `d3.selectAll('rect')`. The `transition` function is added,\
    \ and also the duration of the transition effect (time in milliseconds). Also,\
    \ we need to add the attribute that is going to change.\n\n    ```javascript\n\
    \    d3.selectAll(\"rect\").transition()\n        .duration(4000)\n        .attr('height',function(d,i){\n\
    \            return heightSVG-y(d);\n        })\n        .attr('y',function(d,i){\n\
    \            return y(d);\n        })\n    ```\n\n5.  We need to start the height\
    \ of the graph from 0 to the total height (`heightSVG`). For that, we will change\
    \ the `y` values.\n\n    ![Chart with transition](img/fe6f284f77f839b45695e65dc7c6dabb_67_0.png)\n\
    \n    If we run this code after these changes, then we will see the transition\
    \ effects and tooltips.\n\n## Code for D3Axis.html\n\n```html\n<!DOCTYPE html>\n\
    <meta charset=\"utf-8\">\n<title>Adding attributes and selection to SVG element</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"></link>\n<body>\n\
    <script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n    var data=[10,20,30,40,100];\n\
    \    var heightSVG = 700;\n    var widthSVG = 700;\n    var padding = 10;\n  \
    \  var paddingText = 30;\n    var paddingChart = 40;\n    var axisMargin = 30;\n\
    \    var margin = {\n        'top':5,\n        'right':20,\n        'bottom':20,\n\
    \        'left':50\n    };\n\n    var y = d3.scale.linear().domain([0,d3.max(data)])\n\
    \    .range([heightSVG-axisMargin,0]);\n\n    var x = d3.scale.ordinal().domain(d3.range(data.length))\n\
    \    .rangeRoundBands([0,widthSVG]);\n\n    var yAxis = d3.svg.axis()\n    .scale(y)\n\
    \    .orient('left')\n    .ticks(5);\n\n    var xAxis = d3.svg.axis()\n    .scale(x)\n\
    \    .orient('bottom')\n    .ticks(5);\n\n    var svg = d3.select(\"body\")\n\
    \    .append(\"svg\")\n    .attr(\"width\",widthSVG)\n    .attr(\"height\",heightSVG)\n\
    \    .style(\"transform\",\"translate(\"+paddingChart+\"px,\"+paddingChart+\"\
    px\")\n    .style(\"background\",\"black\");\n    var tooltip = d3.select('body')\n\
    \    .append('div')\n    .style('position','absolute')\n    .style('background','#fff')\n\
    \    .style('padding','5px 15px')\n    .style('border', '1px #fff solid')\n  \
    \  .style('opacity', '0');\n    svg.append(\"g\")\n    .call(yAxis)\n    .attr(\"\
    transform\", \"translate(\"+axisMargin+\",0)\")\n    .style(\"stroke\", \"#fff\"\
    );\n\n    svg.append(\"g\")\n    .call(xAxis)\n    .attr(\"transform\", \"translate(0,\"\
    +(heightSVG-axisMargin)+\")\")\n    .style(\"stroke\", \"#fff\");\n\n    svg.append(\"\
    g\")\n    .attr(\"class\", \"rectangle\")\n    .selectAll()\n    .data(data)\n\
    \    .enter()\n    .append(\"rect\")\n    .attr(\"height\", function(d,i){\n \
    \       return 0;\n    })\n    .attr(\"width\", \"20px\")\n    .style(\"fill\"\
    , \"orange\")\n    .attr(\"y\", function(d,i){\n        return heightSVG ;\n \
    \   })\n    .attr(\"x\", function(d,i){\n        return x(i);\n    }).on('mouseover',\
    \ function(d){\n\n        tooltip.transition().style('opacity',1);\n        tooltip.html(d)\n\
    \            .style('left',(d3.event.pageX)+'px')\n            .style('top',(d3.event.pageY)+'px');\n\
    \n        d3.select(this).style('opacity',0.5);\n\n    }).on('mouseout',function(d){\n\
    \n        d3.select(this).style('opacity',1);\n\n    });\n    d3.selectAll(\"\
    rect\").transition()\n    .duration(4000)\n    .attr('height',function(d,i){\n\
    \        return heightSVG-y(d);\n    })\n    .attr('y',function(d,i){\n      \
    \  return y(d) ;\n    })\n</script>\n</body>\n</html>\n```\n\n## Output\n\n![Initial\
    \ state](img/fe6f284f77f839b45695e65dc7c6dabb_71_0.png)\n\nAfter 4000ms\n\n![Final\
    \ state](img/fe6f284f77f839b45695e65dc7c6dabb_71_1.png)\n\n**Note:** This is a\
    \ transition effect, and we can see the transition in the browser only. The pictures\
    \ are only for demonstration purposes. To see the real transition effects, go\
    \ to the `D3Axis.html` file in the cloud9 editor and run the file.\n\n**File Name:**\
    \ D3Axis.html\n\n**Link:** [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](here) or use the below QR code for 50-90% off.\n\
    \n## Learn D3.JS Hands-on And The Simple Way\n\nUJS Community Network - SAP Experts\
    \ - SAP Services, SAP Consulting, SAP Education\n\nLearn how to work with D3 javascript\
    \ libraries in step-by-step and most simple manner with lots of hands-on examples\n\
    \n35 lectures • 7 hours • All Levels\n\n4.4 (10 ratings)\n\n![QR Code 1](img/fe6f284f77f839b45695e65dc7c6dabb_72_0.png)\n\
    \n![QR Code 2](img/fe6f284f77f839b45695e65dc7c6dabb_72_1.png)\n\n## 11. Bubble\
    \ Chart\n\nBubble charts are a pretty nice way to show correlation among data\
    \ points. For example, consider the data points as shown below, which have X and\
    \ Y coordinates. While representing these data points using bubble charts, there\
    \ are some data points that are grouped together. Those kinds of findings are\
    \ very easy to find in a bubble chart.\n\n![Bubble chart example](img/fe6f284f77f839b45695e65dc7c6dabb_74_0.png)\n\
    \nWe may have an extra dimension to our data, like three-dimensional data, and\
    \ we want to represent that in our graph. Then we will consider the `d` as the\
    \ size of the circle. Depending upon the value of `d`, we can have bigger or smaller\
    \ circles. So we can differentiate the data points not only in terms of positions\
    \ in X and Y coordinates but also the size of the circle. Let's go to our cloud9\
    \ editor and start creating our bubble chart.\n\nPreviously, we created a bar\
    \ chart with some transition effects. We are going to do some changes in the code\
    \ to create a bubble chart. To do that, create a new file **D3Bubble.html** and\
    \ copy the contents of **D3Axis.html** to perform some changes for the bubble\
    \ chart. Change the title name in the code to Bubble chart as we are coding for\
    \ a bubble chart.\n\n1.  The major change that we are going to make is from rectangle\
    \ to circle.\n    1.  We need to change all the `rect` elements into `circle`.\n\
    \    2.  We need radius `r` to create a circle, replacing the `height` with the\
    \ radius `r` here.\n    3.  Instead of `y` and `x`, we need to change it to `cy`\
    \ and `cx`."
  mdcn: "\n## 10. 事件\n\n事件用于在我们将鼠标移到某个对象上时执行某些操作。例如，在我们之前创建的条形图中，如果我们将鼠标移到条形图上，那么上面会出现一个小的弹出窗口来显示该条形图的值。同样，当条形图生成时，会有一些过渡效果。这些都是通过事件来完成的。要创建一个事件，我们需要一个\
    \ `on` 函数。在这个事件中，我们使用的是 `mouseover` 事件。所以我们需要在 `on` 函数内部给出 `mouseover` 事件的值。第二个参数\
    \ `function(d)` 用于在事件触发时调用该函数。为了在条形图生成过程中添加过渡属性，我们需要使用 `transition` 函数，并传入动画持续时间以及在此次过渡中要更改的属性作为参数。例如，当条形图开始生成时，它会从底部生成或从侧面滑动。这些将通过属性来完成。让我们进入我们的\
    \ cloud9 IDE，在我们的条形图中使用事件。\n\n在上一节中，我们创建了条形图。现在我们将在该条形图上使用事件。\n\n![条形图](img/fe6f284f77f839b45695e65dc7c6dabb_65_0.png)\n\
    \n1.  我们需要一个工具提示来显示条形图的值。所以我们创建一个方框并添加一个工具提示。然后我们选择 `body`。我们追加一个 `div` 元素。我们需要为工具提示添加样式。我们将位置设置为\
    \ `absolute`，背景设置为白色。此外，我们为工具提示添加了 `padding` 和 `border` 属性。`opacity` 我们最初设为 0，因为我们现在要隐藏它。我们可以通过增加数值在以后更改它。\n\
    \n    ```javascript\n    var tooltip = d3.select('body')\n    .append('div')\n\
    \    .style('position','absolute')\n    .style('background','#fff')\n    .style('padding','5px\
    \ 15px')\n    .style('border','1px #fff solid')\n    .style('opacity','0');\n\
    \    ```\n\n2.  我们将为 `mouseover` 事件添加 `on` 函数。`function(d)` 将在我们将鼠标移到条形图上时拉出我们的工具提示。`left`\
    \ 和 `top` 是在条形图上显示工具提示的位置。\n\n3.  `d3.select(this).style('opacity',0.5);` 函数将选择鼠标当前指向的条形图，并将其不透明度降低到\
    \ 0.5。一旦我们降低了不透明度，它将被设置为 0.5 并且不会变回 1。为了执行此操作，我们添加另一个 `mouseout` 事件将其设置回 1。\n\n\
    \    ```javascript\n    }).on('mouseover',function(d){\n        tooltip.transition().style('opacity',1);\n\
    \        tooltip.html(d)\n            .style('left',(d3.event.pageX)+'px')\n \
    \           .style('top',(d3.event.pageY)+'px');\n        d3.select(this).style('opacity',0.5);\n\
    \    }).on('mouseout',function(d){\n        d3.select(this).style('opacity',1);\n\
    \    });\n    ```\n\n4.  下一步是添加过渡效果。为此，我们向图形添加一个 `transition` 函数。我们需要对所有矩形进行过渡，所以我们使用\
    \ `d3.selectAll('rect')` 选择了所有矩形。添加了 `transition` 函数，以及过渡效果的持续时间（以毫秒为单位的时间）。此外，我们需要添加要更改的属性。\n\
    \n    ```javascript\n    d3.selectAll(\"rect\").transition()\n        .duration(4000)\n\
    \        .attr('height',function(d,i){\n            return heightSVG-y(d);\n \
    \       })\n        .attr('y',function(d,i){\n            return y(d);\n     \
    \   })\n    ```\n\n5.  我们需要将图形的高度从 0 开始设置到总高度（`heightSVG`）。为此，我们将更改 `y` 值。\n\n\
    \    ![带过渡效果的图表](img/fe6f284f77f839b45695e65dc7c6dabb_67_0.png)\n\n    如果我们在进行这些更改后运行此代码，我们将看到过渡效果和工具提示。\n\
    \n## D3Axis.html 的代码\n\n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding\
    \ attributes and selection to SVG element</title>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"style.css\"></link>\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n    var data=[10,20,30,40,100];\n    var heightSVG = 700;\n\
    \    var widthSVG = 700;\n    var padding = 10;\n    var paddingText = 30;\n \
    \   var paddingChart = 40;\n    var axisMargin = 30;\n    var margin = {\n   \
    \     'top':5,\n        'right':20,\n        'bottom':20,\n        'left':50\n\
    \    };\n\n    var y = d3.scale.linear().domain([0,d3.max(data)])\n    .range([heightSVG-axisMargin,0]);\n\
    \n    var x = d3.scale.ordinal().domain(d3.range(data.length))\n    .rangeRoundBands([0,widthSVG]);\n\
    \n    var yAxis = d3.svg.axis()\n    .scale(y)\n    .orient('left')\n    .ticks(5);\n\
    \n    var xAxis = d3.svg.axis()\n    .scale(x)\n    .orient('bottom')\n    .ticks(5);\n\
    \n    var svg = d3.select(\"body\")\n    .append(\"svg\")\n    .attr(\"width\"\
    ,widthSVG)\n    .attr(\"height\",heightSVG)\n    .style(\"transform\",\"translate(\"\
    +paddingChart+\"px,\"+paddingChart+\"px\")\n    .style(\"background\",\"black\"\
    );\n    var tooltip = d3.select('body')\n    .append('div')\n    .style('position','absolute')\n\
    \    .style('background','#fff')\n    .style('padding','5px 15px')\n    .style('border',\
    \ '1px #fff solid')\n    .style('opacity', '0');\n    svg.append(\"g\")\n    .call(yAxis)\n\
    \    .attr(\"transform\", \"translate(\"+axisMargin+\",0)\")\n    .style(\"stroke\"\
    , \"#fff\");\n\n    svg.append(\"g\")\n    .call(xAxis)\n    .attr(\"transform\"\
    , \"translate(0,\"+(heightSVG-axisMargin)+\")\")\n    .style(\"stroke\", \"#fff\"\
    );\n\n    svg.append(\"g\")\n    .attr(\"class\", \"rectangle\")\n    .selectAll()\n\
    \    .data(data)\n    .enter()\n    .append(\"rect\")\n    .attr(\"height\", function(d,i){\n\
    \        return 0;\n    })\n    .attr(\"width\", \"20px\")\n    .style(\"fill\"\
    , \"orange\")\n    .attr(\"y\", function(d,i){\n        return heightSVG ;\n \
    \   })\n    .attr(\"x\", function(d,i){\n        return x(i);\n    }).on('mouseover',\
    \ function(d){\n\n        tooltip.transition().style('opacity',1);\n        tooltip.html(d)\n\
    \            .style('left',(d3.event.pageX)+'px')\n            .style('top',(d3.event.pageY)+'px');\n\
    \n        d3.select(this).style('opacity',0.5);\n\n    }).on('mouseout',function(d){\n\
    \n        d3.select(this).style('opacity',1);\n\n    });\n    d3.selectAll(\"\
    rect\").transition()\n    .duration(4000)\n    .attr('height',function(d,i){\n\
    \        return heightSVG-y(d);\n    })\n    .attr('y',function(d,i){\n      \
    \  return y(d) ;\n    })\n</script>\n</body>\n</html>\n```\n\n## 输出\n\n![初始状态](img/fe6f284f77f839b45695e65dc7c6dabb_71_0.png)\n\
    \n4000毫秒后\n\n![最终状态](img/fe6f284f77f839b45695e65dc7c6dabb_71_1.png)\n\n**注意：**\
    \ 这是一种过渡效果，我们只能在浏览器中看到过渡。图片仅用于演示目的。要查看真实的过渡效果，请在 cloud9 编辑器中转到 `D3Axis.html` 文件并运行该文件。\n\
    \n**文件名：** D3Axis.html\n\n**链接：** [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \n您也可以查看我们的 **实践学习 D3.JS 的简单方法** 视频课程以加速学习：[这里](here) 或使用以下二维码获取 50-90% 的折扣。\n\
    \n## 实践学习 D3.JS 的简单方法\n\nUJS 社区网络 - SAP 专家 - SAP 服务、SAP 咨询、SAP 教育\n\n通过分步且最简单的方式学习如何使用\
    \ D3 JavaScript 库，包含大量实践示例\n\n35 讲 • 7 小时 • 所有级别\n\n4.4（10 条评价）\n\n![二维码 1](img/fe6f284f77f839b45695e65dc7c6dabb_72_0.png)\n\
    \n![二维码 2](img/fe6f284f77f839b45695e65dc7c6dabb_72_1.png)\n\n## 11. 气泡图\n\n气泡图是显示数据点之间相关性的一种非常好的方式。例如，考虑下面显示的数据点，它们具有\
    \ X 和 Y 坐标。当使用气泡图表示这些数据点时，有一些数据点是分组在一起的。在气泡图中很容易找到这类发现。\n\n![气泡图示例](img/fe6f284f77f839b45695e65dc7c6dabb_74_0.png)\n\
    \n我们的数据可能还有一个额外的维度，比如三维数据，我们希望在图形中表示它。那么我们将考虑 `d` 作为圆的大小。根据 `d` 的值，我们可以得到更大或更小的圆。因此，我们不仅可以在\
    \ X 和 Y 坐标的位置上区分数据点，还可以通过圆的大小来区分数据点。让我们进入我们的 cloud9 编辑器，开始创建我们的气泡图。\n\n之前，我们创建了一个带有一些过渡效果的条形图。我们将对代码进行一些更改以创建气泡图。为此，创建一个新文件\
