    id\",\"xAxis\")\n    .call(xAxis)\n    .style(\"stroke\",\"#000\")\n    .attr(\"\
    transform\",\"translate(\"+paddingText+\",\"+(heightBar)+\")\");\n```\n\n10. Next\
