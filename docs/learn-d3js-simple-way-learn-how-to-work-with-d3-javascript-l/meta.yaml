  md: '# # 9.1. Linear Scale


    These scales are used for continuous input domains, such as numbers. For example,
    if the input data set is [7, 10, 6], the entire canvas height is 100. We need
    to plot the graph within this 100 value. To plot the graph according to the canvas
    we need the output data set as 70, 100 and 60 units respectively for our input
    data sets.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_52_0.png)


    **Syntax**


    **Linear Scale**


    ```

    var y = d3.scale.linear().domain([0,d3.max(data)]) /* Min and Max value of data
    */

    .range([0, heightSVG]); /* Specify the range to crate chart in specified area

    ```'
