    \ = 700;\n    var padding = 10;\n    var paddingText = 30;\n    var paddingChart\
    \ = 40;\n    var axisMargin = 30;\n    var margin = {\n        'top':5,\n    \
    \    'right':20,\n        'bottom':20,\n        'left':50\n    };\n    var minR\
    \ = 20;\n    var maxR = 70;\n    var dataVal1 = data[\"val1\"];\n    var dataVal2\
    \ = data[\"val2\"];\n\n    var y = d3.scale.linear().domain([0,d3.max(dataVal1)])\n\
    \        .range([heightSVG-axisMargin,0]);\n\n    var x = d3.scale.ordinal().domain(d3.range(dataVal1.length))\n\
    \        .rangeRoundBands([0,widthSVG]);\n\n    var r = d3.scale.linear().domain([d3.min(dataVal2),d3.max(dataVal2)])\n\
    \        .range([minR,maxR]);\n\n    var yAxis = d3.svg.axis()\n        .scale(y)\n\
    \        .orient('left')\n        .ticks(5);\n\n    var xAxis = d3.svg.axis()\n\
    \        .scale(x)\n        .orient('bottom')\n        .ticks(5);\n\n    var svg\
    \ = d3.select(\"body\")\n        .append(\"svg\")\n        .attr(\"width\",widthSVG)\n\
    \        .attr(\"height\",heightSVG)\n        .style(\"transform\",\"translate(\"\
    +paddingChart+\"px,\"+paddingChart+\"px)\")\n        .style(\"background\",\"\
    black\");\n    var tooltip = d3.select('body')\n        .append('div')\n     \
    \   .style('position','absolute')\n        .style('background','#fff')\n     \
    \   .style('padding','5px 15px')\n        .style('border','1px #fff solid')\n\
    \        .style('opacity','0');\n\n    svg.append(\"g\")\n        .call(yAxis)\n\
    \        .attr(\"transform\",\"translate(\"+axisMargin+\",0)\")\n        .style(\"\
    stroke\",\"#fff\");\n\n    svg.append(\"g\")\n        .call(xAxis)\n        .attr(\"\
    transform\",\"translate(0,\"+(heightSVG-axisMargin)+\")\")\n        .style(\"\
    stroke\",\"#fff\");\n\n    svg.append(\"g\")\n        .attr(\"class\",\"circle\"\
    )\n        .selectAll()\n        .data(dataVal1)\n        .enter()\n        .append(\"\
    circle\")\n        .attr(\"r\",function(d,i){\n          return r(dataVal2[i]);\n\
    \        })\n        .attr(\"width\",\"10px\")\n        .style(\"fill\",\"orange\"\
    )\n        .attr(\"cy\",function(d,i){\n          return heightSVG ;\n       \
    \ })\n        .attr(\"cx\",function(d,i){\n          return x(i);\n        }).on(\"\
    mouseover\",function(d,i){\n\n          tooltip.transition().style(\"opacity\"\
    ,1);\n          tooltip.html(\"y: \"+d+\" / r: \"+dataVal2[i])\n          .style(\"\
    left\",(d3.event.pageX)+\"px\")\n          .style(\"top\",(d3.event.pageY)+\"\
    px\");\n\n          d3.select(this).style(\"opacity\",0.5);\n\n        }).on(\"\
    mouseout\",function(d){\n\n          d3.select(this).style(\"opacity\",1);\n\n\
    \        });\n\n    d3.selectAll(\"circle\").transition()\n        .duration(4000)\n\
    \        .attr(\"cy\",function(d,i){\n            return (y(d))+\"px\" ;\n   \
    \     })\n</script>\n</body>\n</html>\n```\n\n## CSS 样式\n\n```\n.blueBack{\n \
    \   background : blue;\n}\n```\n\n```\n.rectangle{\n    transform: translate(30px,-30px)\
