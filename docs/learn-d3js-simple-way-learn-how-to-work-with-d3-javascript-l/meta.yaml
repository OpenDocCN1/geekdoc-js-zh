    \n## 9.3. 坐标轴\n\n当我们想在图表中使用比例尺时，我们会使用坐标轴。它帮助用户理解数据点的边界以及对应的值。通常，在二维图表中，我们有两个坐标轴，即X轴和Y轴。要在D3中创建坐标轴，我们使用函数\
