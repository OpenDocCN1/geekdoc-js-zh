  - "[PAGE 98]\n\n# 13. Line Chart\n\nLine charts are wonderful ways to represent\
    \ **trends over time**. It is like multiple small bubbles representing our data.\
    \ We are connecting those points using straight line. When we have a lot of data\
    \ points over time then using a line chart is very beneficial to see some of the\
    \ patterns or trends over time. To create a simple line chart in D3 we need to\
    \ use the function\n\n```\nd3.svg.line()\n.x(function(d,i) { return x(i)})\n.y(function(d){return\
    \ return y(d) });\n```\n\nWe are passing the x and y values. The ‘x’ value is\
    \ based upon the index value ‘i’. The ‘y’ value is based upon the data point value\
    \ itself. To create a line chart we take the code for bar chart and removed the\
    \ code for bars and made it with only the axis. We use the linear and ordinal\
    \ scales we used in the bar chart. So we will add the code for line chart to draw\
    \ using D3.\n\n+   1. We are going to add the syntax for line and add the x value\
    \ and y value with function having data and index. Here the y scale value may\
    \ not return the integer value so we need to add parseInt to get integer value\
    \ the data.\n\n```\nvar line = d3.svg.line()\n    .x(function(d,i){return x(i);})\n\
    \    .y(function(d){return parseInt(y(d));});\n```\n\n+   2. We need to append\
    \ the path to the svg. We are using a new function called datum to specify data.\
    \ Also we will add the stroke attributes and add data to line. This will call\
    \ the line function on each data points.\n\n```\nsvg.append(\"path\")\n    .datum(data)\n\
    \    .attr(\"stroke\",\"orange\")\n    .attr(\"d\",line)\n```\n\nAfter we have\
    \ added these codes if we try to run this we will get the line that is connected\
    \ according to the data points. Next we need to add a tooltip while we put the\
    \ mouse over the line then it will show the corresponding ‘y’ value. In bar chart\
    \ and bubble chart we have discrete values but in this case we will use continuous\
    \ values so it will be tricky to show the values. This is because if we put the\
    \ mouse over any part of the line it must show the corresponding ‘y’ values. So\
    \ we need to find a way for it."
- md: "## 3. We will add a mouseover event for transition of tooltip.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_99_0.png)\n\
    \n## 4. We need to add a tooltip for the mouse event.\n\nAs we told that it will\
    \ be little tricky here. For that we are going to use a scale here. First we define\
    \ the scale and then add the tooltip. To define scale we used hoverVal variable\
    \ and defined the minimum and maximum range.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_99_1.png)\n\
    \n## 5. Now we add the tooltip with the parameter hoverVal and get the y position.\n\
    \nAlso we will add the position of the tooltip to display on the line. So we define\
    \ the tooltip style as left and top. The value 50 added to the chartBottomPadding\
    \ is used to equalize the exact ‘y’ value to show in the tooltip.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_99_2.png)\n\
    \n## 6. As we created mouseover event we also need to create a mouseout event\
    \ to change the event back to normal.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_99_3.png)\n\
    \nOnce we complete this we can run the program then we will get the line chart.\
    \ In real scenarios the line chart is not the only chart present in our project.\
    \ In those cases we have to do some calculations and adding some padding to it.\
    \ We need to do lot of trial and error to reach our final result.\n\n## 7. Additionally\
    \ we can add some text property to tell what is the axis is about like amplitude,\
    \ time, value and other variables.\n\nTo do that we will append the text property\
    \ to our ‘x’ and ‘y’ axis.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_100_0.png)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_100_1.png)\n\n## Code for D3LineChart.html\n\
    \n```\n<!DOCTYPE html>\n<head>\n<style>\n</style>\n</head>\n<title>Line chart</title>\n\
    <meta charset=\"utf-8\">\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\nvar padding = 1;\nvar paddingText = 30;\nvar paddingChart = 40;\nvar\
    \ heightSVG = 700;\nvar widthSVG = 700;\nvar animationDuration = 1000;\nvar animationDelay\
    \ = 1000;\nvar chartBottomPadding = 200;\n\nvar data = [10,20,30,40,120];\n\n\
    var svg = d3.select(\"body\").append(\"svg\").attr(\"width\", widthSVG+200)\n\
    \    .attr(\"height\", heightSVG+chartBottomPadding)\n    .style(\"transform\"\
    , \"translate(\"+paddingChart+\"px,\"+paddingChart+\"px)\")\n    .style(\"padding-left\"\
    ,\"100px\")\n    .style(\"padding-top\",\"100px\")\n    .style(\"background\"\
    , \"#000\");\n\nvar tooltip = d3.select('body').append('div')\n    .style('position','absolute')\n\
    \    .style('background','#fff')\n    .style('padding','5 15px')\n    .style('border','1px\
    \ #fff solid')\n    .style('border-radius','5px')\n    .style('opacity','0');\n\
    \nvar y = d3.scale.linear().domain([0,d3.max(data)])\n    .range([heightSVG,0]);\n\
    \nvar hoverVal = d3.scale.linear().domain([0,heightSVG])\n    .range([d3.max(data),0]);\n\
    \nvar x = d3.scale.ordinal().domain(d3.range(data.length))\n    .rangeRoundBands([0,\
    \ widthSVG]);\n\nvar yAxis = d3.svg.axis()\n    .scale(y)\n    .orient(\"left\"\
    )\n    .ticks(5);\n//.tickValues([1, 2, 3, 5, 8, 13]);;\n\nvar xAxis = d3.svg.axis()\n\
    \    .scale(x)\n    .orient(\"bottom\")\n    .ticks(10);\n\nsvg.append(\"g\")\n\
    \    //.attr(\"class\",\"axis\")\n    .call(yAxis)\n    .style(\"fill\",\"none\"\
    )\n    .style(\"stroke\",\"#fff\")\n    .append(\"text\")\n    .attr(\"transform\"\
    ,\"translate(-\"+paddingText+\",0)\")\n    .attr(\"dy\",\"0.71rem\")\n    .style(\"\
    text-anchor\",\"end\")\n    .text(\"Value\");\n\nsvg.append(\"g\")\n    .call(xAxis)\n\
    \    .attr(\"transform\", \"translate(0,\"+(heightSVG)+\")\")\n    .style(\"fill\"\
    ,\"none\")\n    .style(\"stroke\",\"#fff\")\n    .append(\"text\")\n    .attr(\"\
    transform\",\"translate(-\"+paddingText+\",0)\")\n    .attr(\"dy\",\"0.71rem\"\
    )\n    .style(\"text-anchor\",\"end\")\n    .text(\"Time\");\n\nvar line = d3.svg.line()\n\
    .x(function(d,i){return x(i);})\n.y(function(d){return parseInt(y(d));});\n\n\
    svg.append(\"path\")\n.datum(data)\n.attr(\"stroke\",\"orange\")\n.attr(\"d\"\
    ,line)\n.on(\"mouseover\",function(d,i){\n    tooltip.transition()\n    .style(\"\
    opacity\",1);\n\n    tooltip.html(parseInt((hoverVal(d3.event.pageY-chartBottomPadding+50))))\n\
    \    .style(\"left\",(d3.event.pageX)+\"px\")\n    .style(\"top\",(d3.event.pageY)+\"\
    px\");\n\n    d3.select(this).style(\"opacity\",0.5);\n\n}).on(\"mouseout\",function(){\n\
    \n    d3.select(this).style(\"opacity\",1);\n})\n</script>\n</body>\n</html>\n\
    ```\n\n# Output\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_104_0.png)\n\nYou\
    \ can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
