  md: "# 13. Line Chart\n\nLine charts are wonderful ways to represent **trends over\
    \ time**. It is like multiple small bubbles representing our data. We are connecting\
    \ those points using straight line. When we have a lot of data points over time\
    \ then using a line chart is very beneficial to see some of the patterns or trends\
    \ over time. To create a simple line chart in D3 we need to use the function\n\
    \n```\nd3.svg.line()\n.x(function(d,i) { return x(i)})\n.y(function(d){return\
    \ return y(d) });\n```\n\nWe are passing the x and y values. The ‘x’ value is\
    \ based upon the index value ‘i’. The ‘y’ value is based upon the data point value\
    \ itself. To create a line chart we take the code for bar chart and removed the\
    \ code for bars and made it with only the axis. We use the linear and ordinal\
    \ scales we used in the bar chart. So we will add the code for line chart to draw\
    \ using D3.\n\n+   1. We are going to add the syntax for line and add the x value\
    \ and y value with function having data and index. Here the y scale value may\
    \ not return the integer value so we need to add parseInt to get integer value\
    \ the data.\n\n```\nvar line = d3.svg.line()\n    .x(function(d,i){return x(i);})\n\
    \    .y(function(d){return parseInt(y(d));});\n```\n\n+   2. We need to append\
    \ the path to the svg. We are using a new function called datum to specify data.\
    \ Also we will add the stroke attributes and add data to line. This will call\
    \ the line function on each data points.\n\n```\nsvg.append(\"path\")\n    .datum(data)\n\
    \    .attr(\"stroke\",\"orange\")\n    .attr(\"d\",line)\n```\n\nAfter we have\
    \ added these codes if we try to run this we will get the line that is connected\
    \ according to the data points. Next we need to add a tooltip while we put the\
    \ mouse over the line then it will show the corresponding ‘y’ value. In bar chart\
    \ and bubble chart we have discrete values but in this case we will use continuous\
    \ values so it will be tricky to show the values. This is because if we put the\
    \ mouse over any part of the line it must show the corresponding ‘y’ values. So\
    \ we need to find a way for it."
