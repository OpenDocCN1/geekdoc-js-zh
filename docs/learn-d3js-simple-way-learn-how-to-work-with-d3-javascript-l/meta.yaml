  md: '# 1. Introduction


    **What is D3?**

    D3 stands for Data Driven Documentation. It is a JavaScript library which allows
    developers to create amazing analytics and visualizations.


    **Why D3?**

    D3 should be preferred to any other JavaScript library, because there are a lot
    of options available for us. If we want to create some visualization projects
    like a simple project or a simple mathematical application then it is one of the
    best choices because of the following reasons.


    **Modern Browser Capability:** We can use modern browser capability with D3. We
    have access to all the HTML5 and CSS properties. So, the created application is
    responsive and adaptable to user devices.


    **Endless Variations:** Variations and options provided by D3 are endless. We
    will see in [d3js.org](https://d3js.org) website for possibilities of D3.


    **BSD Open Source License:** D3 comes with a BSD open source license. So we don''t
    need to pay anyone to use D3.


    **Large Community Support:** D3 has large community support. There are lot of
    people in **StackOverflow** and **GitHub**. Support is essential if we are learning
    a new technology. This community will guide us to resolve any queries and issues
    that we face in projects.


    Let''s explore [d3js.org](https://d3js.org) website


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_8_0.png)


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_8_1.png)


    If you go to the examples tab you can see popular examples in the gallery. Here
    we can see a lot of examples created using D3. There are many common graphs like
    Box plot,'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Bubble chart, Heat maps and more innovative charts like graph with force layout
    and motion charts are available in the examples tab. We will find several variations
    and innovative approach to solve any visualization problem using D3. In the right
    hand side, they have provided the API reference. It is very useful if you are
    new to D3. It contains the documentations and features of all elements used in
    D3.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_9_0.png)


    # ## Arrays (d3-array)


    Array manipulation, ordering, searching, summarizing, etc.


    > > Statistics


    Methods for computing basic summary statistics.


    +   - `d3.min` - compute the minimum value in an array.

    - `d3.max` - compute the maximum value in an array.

    - `d3.extent` - compute the minimum and maximum value in an array.

    - `d3.sum` - compute the sum of an array of numbers.

    - `d3.mean` - compute the arithmetic mean of an array of numbers.

    - `d3.median` - compute the median of an array of numbers (the 0.5-quantile).

    - `d3.quantile` - compute a quantile for a sorted array of numbers.

    - `d3.variance` - compute the variance of an array of numbers.

    - `d3.deviation` - compute the standard deviation of an array of numbers.


    # ### API Reference


    Let’s go back to the example and select one example to explore. Here we select
    the Box plot example to explore.'
