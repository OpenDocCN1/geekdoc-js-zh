  md: '# 3.2 SVG with D3


    In this example we are going to use SVG element with D3. To do that, we need to
    use d3.select(“body”).append(“svg”). The final hierarchy of our webpage will have
    a HTML element and inside that we will have a body and this body will contain
    the SVG element.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_20_0.png)


    Let’s try this out in our Cloud9 IDE. We already created a simple SVG element
    inside our HTML page. Now we are going to use D3 to perform the same activity.
    To use D3 we need to add D3 libraries before the body tag. To do that we need
    to add the link to that library inside the script tag.


    ```

    <script src="../D3/d3.v3.min.js"></script>

    <script>

    ```


    The “../D3/d3.v3.min.js” is the relative path for D3 library files.


    To verify this, run the file and go to console by right click on the page and
    select inspect element. Then, enter D3 and hit enter. If everything is perfect,
    then it does not show any errors and our path is correct.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_20_1.png)


    If there is some error in defining the path, then it shows like this in the console.'
