  md: '# 10. Events


    Events are used to perform some action while we move the mouse over an object.
    For example, in the bar chart we created previously if we move the mouse over
    the bar then a small pop up will appear on it to display the value of the bar.
    Similarly when the bars are being generated then there will be some transition
    effects. These are done by using events. To create an event we need an on function.
    In this event we are using mouseover event. So we need to give the value as mouseover
    event inside the on function. The second parameter function(d) used to call the
    function during the function is triggered. To add a transition property during
    the bar is generated we need to use the function transition function with parameters
    duration of animation and its attributes to be changed in this transition. Example,
    while the bar start to generate it will generate from the bottom or sliding over
    from the side. These will be done by the attributes. Let''s go to our cloud9 IDE
    to use events in our bar chart.


    In last section we created the bar chart. Now we are going to use events to that
    bar chart.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_65_0.png)


    +   1. We need a tooltip to display the value of the bar. So we create a box and
    add a tooltip. Then we select the body. We append a div element. We need to add
    styling to the tooltip. We add the position as absolute and background as white
    colour. Also we added padding and border properties to the tooltip. The opacity
    we initially give 0 because we are going to hide this one for now. We can change
    it later by increasing the value.


    ```

    var tooltip = d3.select(''body'')

