    # 2. LEARNING PATH OF THIS BOOK


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_13_0.png)


    +   - Initially we will start with SVG (Scalable Vector Graphics). We will see
    how to create simple graphic objects like circles, rectangles and triangles.

    - Also, we learn how these SVG elements can be drawn from HTML5. Next, we will
    use D3 to create these SVG elements.

    - Once we get basic understanding the basic SVG elements works then we move on
    to work with custom style sheets (CSS).

    - Working with CSS, we see how to use Data with D3.

    - Following that we shall see how to use simple graph like bubble chart and bar
    chart.

    - Then, we will see the Events in our graph while the end user moves mouse over
    the graph.

    - Our learning curve would also proceed to some advanced graphs like map or heat
    map project.

    - Finally, we will create an assignment project. This assignment will be a use
    case of a visualization project that we will solve using D3. We are going to learn
    the process step wise and by hands-on basis.'
- md: "## 3. SVG Elements\n\nSVG is a short form for Scalable Vector Graphics. Similar\
    \ to PNG or JPEG files, SVG is used to store XML based vector image formats. A\
    \ normal bitmap image is composed of a fixed set of pixels. A vector image, on\
    \ the other hand, is composed of fixed set of shapes like circles, line or text.\
    \ We can see that the image represented in .jpeg, .png or .gif files are pixilated\
    \ or distorted. However, in vector images they are set of shapes and we would\
    \ not see any quality compromise while zooming on the image.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_16_0.png)\n\
    \n## Examples\n\nLet us see some simple examples of using SVG elements in our\
    \ HTML5 page. We are going to use the Cloud9 IDE. We do majority of our developments\
    \ in Cloud9 IDE. The files are accessible for our users 24x7.\n\nLink for the\
    \ repositories: [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \nPeople who are not familiar with this IDE can read the document on getting started\
    \ in the given link.\n\nGetting Started: [https://docs.c9.io/docs/getting-started](https://docs.c9.io/docs/getting-started)\n\
    \nLet us ***START CODING!***\n\n## 3.1. Simple Example for SVG\n\nIn this example\
    \ we are going to create a bar using SVG elements. To create a SVG, we need a\
    \ <svg> tag. In this tag, we added the width, height and the background colours\
    \ of the rectangle bar. If we add the below code before the body tag and run the\
    \ code we will get an orange colored rectangle with width of 300px and height\
    \ of 100px.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_18_0.png)\n\n**Code for\
    \ SVG.html**\n\n```html\n<!DOCTYPE html>\n<title>Create a SVG element with HTML\
    \ and D3</title>\n<meta charset=\"utf-8\">\n<svg width=\"300px\" height=\"100px\"\
    \ style=\"background:orange\">\n</svg>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n    var svg = d3.select(\"body\").append(\"svg\").style(\"background\"\
    ,\"green\");\n</script>\n<body>\n</body>\n</html>\n```\n\n**Result:**\nThis is\
    \ our **SVG** element. In future sections we are going to use it with D3.\n\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_18_1.png)\n\n## 3.2 SVG with D3\n\nIn\
    \ this example we are going to use SVG element with D3. To do that, we need to\
    \ use d3.select(“body”).append(“svg”). The final hierarchy of our webpage will\
    \ have a HTML element and inside that we will have a body and this body will contain\
    \ the SVG element.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_20_0.png)\n\nLet’s\
    \ try this out in our Cloud9 IDE. We already created a simple SVG element inside\
    \ our HTML page. Now we are going to use D3 to perform the same activity. To use\
    \ D3 we need to add D3 libraries before the body tag. To do that we need to add\
    \ the link to that library inside the script tag.\n\n```html\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n```\n\nThe “../D3/d3.v3.min.js” is the relative path for\
    \ D3 library files.\n\nTo verify this, run the file and go to console by right\
    \ click on the page and select inspect element. Then, enter D3 and hit enter.\
    \ If everything is perfect, then it does not show any errors and our path is correct.\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_20_1.png)\n\nIf there is some error\
    \ in defining the path, then it shows like this in the console.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_21_0.png)\n\
    \nWhen we are working in a project we will always use the relative path or a path\
    \ from a content delivery network CD. If we open the D3 library file then we will\
    \ see a very big file inside it. This is the library file that we are going to\
    \ use in our application. D3 is JavaScript based so we have a script tag and we\
    \ write the JavaScript code inside the Script tag. The first example we are going\
    \ to create is an SVG using D3.\n\n**Code for SVG with D3:**\n\n```html\n<!DOCTYPE\
    \ html>\n<title>Create a SVG element with HTML and D3</title>\n<meta charset=\"\
    utf-8 \">\n<svg width=\"300px\" height=\"100px\" style=\"background:orange\"></svg>\n\
    \n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n\t/*Creating  a SVG\
    \ inside the body and added style as green to make the SVG visible*/\n\t\n\tvar\
    \ svg = d3.select(\"body\").append(\"svg\").style(\"background\", \"green\");\n\
    \n</script>\n<body>\n</body>\n</html>\n```\n\n**Output:**\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_22_0.png)\n\
    \nThe first orange colored rectangle is without D3 and the second rectangle box\
    \ is rendered by D3 syntax. This is a simple example using SVG. We shall see a\
    \ few more examples of graphic elements and its variations in coming sections.\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](https://www.google.com) or use the below QR\
    \ code for 50-90% off.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_22_1.png)\n\
    \n## 4. Selecting elements and operating\n\nSimilar to JQuery, if we like to hold\
    \ on an object to make some changes or read some values we need to use select\
    \ statement. D3 provides two top level elements for selecting elements **select**\
    \ and **selectAll**. Let’s start with select. In this example, we are going to\
    \ have a simple HTML page that contains a body and this body will have a SVG element\
    \ inside it. This SVG element will be containing some attribute values like width\
    \ or height. These properties are actually called SVG properties.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_24_0.png)\n\
    \n## 4.1 Coding\n\nYou have access to the repositories of these examples. To access\
    \ it go to the link [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_25_0.png)\n\nWe see the select and\
    \ selectAll properties in this example. If we use the select property, it selects\
    \ the specific elements that are mentioned. The first orange colour rectangle\
    \ is the example for select property. The Dinosaurs, Elephant and Cat are used\
    \ with selectAll. Here you can see that Dinosaur and Elephant are of green colour\
    \ because in the div tag with id and class attributes we defined the background\
    \ colour as green.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_25_1.png)\n\n1.\
    \ d3.select(“body”) is a jQuery selector statement that selects the contents inside\
    \ body. The attributes are also defined here with style as orange background.\n\
    2. Div element with id demo and another div element with class as ‘demoClass’\
    \ are used to group the specified class or id.\n3. The ‘SelectAll’ will select\
    \ the entire SVG inside div and the ‘Select’ selects only the particular class\
    \ or id that is specified inside the function.\n\n## Code for D3SVG.html\n\n```html\n\
    <!DOCTYPE html>\n<meta charset=“utf-8”>\n<title>Adding attributes and selection\
    \ to SVG element</title>\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n    var svg = d3.select(\"body\").append(\"svg\").attr(\"width\", \"\
    300px\")\n    .attr(\"height\", \"100px\").style(\"background\", \"orange\");\n\
    </script>\n<div id=\"demo\">Dinosaurs</div>\n<div class=\"demoClass\">Elephant</div>\n\
    <div>Cat</div>\n<script>\nd3.selectAll(\"div\").style(\"background\", \"orange\"\
    );\nd3.select(\"#demo\").style(\"background\", \"green\");\nd3.select(\".demoClass\"\
    ).style(\"background\", \"green\");\n</script>\n</body>\n</html>\n```\n\n## Output\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_26_0.png)\n\nIf we remove the id and\
    \ class for the Dinosaur and Elephant and the actual result will appear as shown\
    \ below.\n\n```html\n<title>Adding attributes and selection to SVG</title>\n<body>\n\
    <script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n    var svg = d3.select(\"\
    body\").append(\"svg\")\n              .attr(\"height\",\"100px\").style(\"border\"\
    ,\"1px solid black\");\n\n</script>\n<div>Dinosaurs</div>\n<div>Elephant</div>\n\
    <div>Cat</div>\n\n<script>\n    d3.selectAll(\"div\").style(\"background\",\"\
    orange\").style(\"color\",\"black\");\n\n    d3.select(\"#demo\").style(\"background\"\
    ,\"green\").style(\"color\",\"black\");\n    d3.select(\".demoClass\").style(\"\
    background\",\"purple\").style(\"color\",\"white\");\n</script>\n```\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_27_0.png)\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](here) or use the below QR code for 50-90% off.\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_28_0.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_28_1.png)"
  mdcn: "\n## 3. SVG 元素\n\nSVG 是可缩放矢量图形的缩写。与 PNG 或 JPEG 文件类似，SVG 用于存储基于 XML 的矢量图像格式。普通的位图图像由一组固定的像素组成。而矢量图像则由一组固定的形状（如圆形、线条或文本）组成。我们可以看到，.jpeg、.png\
    \ 或 .gif 文件中表示的图像是像素化的或失真的。然而，在矢量图像中，它们是一组形状，因此在缩放图像时不会看到任何质量损失。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_16_0.png)\n\
    \n## 示例\n\n让我们看一些在 HTML5 页面中使用 SVG 元素的简单示例。我们将使用 Cloud9 IDE。我们大部分开发工作都在 Cloud9\
    \ IDE 中进行。用户可以全天候访问这些文件。\n\n代码仓库链接：[https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \n不熟悉此 IDE 的用户可以在给定链接上阅读入门文档。\n\n入门指南：[https://docs.c9.io/docs/getting-started](https://docs.c9.io/docs/getting-started)\n\
    \n让我们***开始编码！***\n\n## 3.1. SVG 简单示例\n\n在这个例子中，我们将使用 SVG 元素创建一个条形图。要创建 SVG，我们需要一个\
    \ `<svg>` 标签。在这个标签中，我们添加了矩形条的宽度、高度和背景颜色。如果在 body 标签之前添加以下代码并运行代码，我们将得到一个宽度为 300px、高度为\
    \ 100px 的橙色矩形。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_18_0.png)\n\n**SVG.html\
    \ 的代码**\n\n```html\n<!DOCTYPE html>\n<title>Create a SVG element with HTML and\
    \ D3</title>\n<meta charset=\"utf-8\">\n<svg width=\"300px\" height=\"100px\"\
    \ style=\"background:orange\">\n</svg>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n    var svg = d3.select(\"body\").append(\"svg\").style(\"background\"\
    ,\"green\");\n</script>\n<body>\n</body>\n</html>\n```\n\n**结果：**\n这就是我们的 **SVG**\
    \ 元素。在接下来的部分，我们将把它与 D3 一起使用。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_18_1.png)\n\
    \n## 3.2 SVG 与 D3\n\n在这个例子中，我们将把 SVG 元素与 D3 一起使用。为此，我们需要使用 `d3.select(\"body\"\
    ).append(\"svg\")`。我们网页的最终层级将有一个 HTML 元素，其内部将有一个 body，而这个 body 将包含 SVG 元素。\n\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_20_0.png)\n\n让我们在我们的 Cloud9 IDE 中尝试一下。我们已经在\
    \ HTML 页面中创建了一个简单的 SVG 元素。现在我们将使用 D3 来执行相同的活动。要使用 D3，我们需要在 body 标签之前添加 D3 库。为此，我们需要在\
    \ script 标签内添加该库的链接。\n\n```html\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n```\n\n“../D3/d3.v3.min.js”是 D3 库文件的相对路径。\n\n要验证这一点，运行该文件并右键单击页面选择“检查元素”进入控制台。然后，输入\
    \ D3 并按回车键。如果一切正常，它将不会显示任何错误，并且我们的路径是正确的。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_20_1.png)\n\
    \n如果在定义路径时有错误，那么控制台将显示如下内容。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_21_0.png)\n\
    \n在项目中工作时，我们将始终使用相对路径或来自内容分发网络 CDN 的路径。如果我们打开 D3 库文件，我们会看到里面有一个非常大的文件。这就是我们将在应用程序中使用的库文件。D3\
    \ 是基于 JavaScript 的，所以我们有一个 script 标签，并在 script 标签内编写 JavaScript 代码。我们将创建的第一个示例是使用\
    \ D3 创建 SVG。\n\n**使用 D3 的 SVG 代码：**\n\n```html\n<!DOCTYPE html>\n<title>Create\
    \ a SVG element with HTML and D3</title>\n<meta charset=\"utf-8 \">\n<svg width=\"\
    300px\" height=\"100px\" style=\"background:orange\"></svg>\n\n<script src=\"\
    ../D3/d3.v3.min.js\"></script>\n<script>\n\t/*在 body 内创建一个 SVG，并添加绿色样式使 SVG 可见*/\n\
    \t\n\tvar svg = d3.select(\"body\").append(\"svg\").style(\"background\", \"green\"\
    );\n\n</script>\n<body>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_22_0.png)\n\
    \n第一个橙色矩形是没有 D3 的，第二个矩形框是由 D3 语法渲染的。这是一个使用 SVG 的简单示例。我们将在接下来的部分中看到更多图形元素及其变体的示例。\n\
    \n您也可以查看我们的 **Learn D3.JS Hands-on And The Simple Way** 视频课程以加速学习：[点击此处](https://www.google.com)\
    \ 或使用下面的二维码享受 50-90% 的折扣。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_22_1.png)\n\
    \n## 4. 选择元素和操作\n\n与 JQuery 类似，如果我们想持有某个对象以进行一些更改或读取一些值，我们需要使用 select 语句。D3 提供了两个顶级元素来选择元素：**select**\
    \ 和 **selectAll**。让我们从 select 开始。在这个例子中，我们将有一个简单的 HTML 页面，其中包含一个 body，这个 body\
    \ 内部将有一个 SVG 元素。这个 SVG 元素将包含一些属性值，如宽度或高度。这些属性实际上被称为 SVG 属性。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_24_0.png)\n\
    \n## 4.1 编码\n\n您可以访问这些示例的代码仓库。要访问它，请转到链接 [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_25_0.png)\n\n在这个例子中，我们看到了 select 和\
    \ selectAll 属性。如果我们使用 select 属性，它会选择指定的特定元素。第一个橙色矩形是 select 属性的示例。Dinosaur、Elephant\
    \ 和 Cat 使用了 selectAll。在这里您可以看到 Dinosaur 和 Elephant 是绿色的，因为在带有 id 和 class 属性的 div\
    \ 标签中，我们定义了背景颜色为绿色。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_25_1.png)\n\n\
    1. `d3.select(\"body\")` 是一个 jQuery 选择器语句，用于选择 body 内部的内容。属性也在这里定义，样式为橙色背景。\n\
    2. 带有 id demo 的 div 元素和另一个 class 为 'demoClass' 的 div 元素用于分组指定的类或 id。\n3. 'SelectAll'\
    \ 将选择 div 内部的所有 SVG，而 'Select' 仅选择函数内部指定的特定类或 id。\n\n## D3SVG.html 的代码\n\n```html\n\
    <!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>Adding attributes and selection\
    \ to SVG element</title>\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n    var svg = d3.select(\"body\").append(\"svg\").attr(\"width\", \"\
    300px\")\n    .attr(\"height\", \"100px\").style(\"background\", \"orange\");\n\
    </script>\n<div id=\"demo\">Dinosaurs</div>\n<div class=\"demoClass\">Elephant</div>\n\
    <div>Cat</div>\n<script>\nd3.selectAll(\"div\").style(\"background\", \"orange\"\
    );\nd3.select(\"#demo\").style(\"background\", \"green\");\nd3.select(\".demoClass\"\
    ).style(\"background\", \"green\");\n</script>\n</body>\n</html>\n```\n\n## 输出\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_26_0.png)\n\n如果我们移除 Dinosaur 和 Elephant\
    \ 的 id 和 class，实际结果将如下所示。\n\n```html\n<title>Adding attributes and selection to\
    \ SVG</title>\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n<script>\n\
    \    var svg = d3.select(\"body\").append(\"svg\")\n              .attr(\"height\"\
    ,\"100px\").style(\"border\",\"1px solid black\");\n\n</script>\n<div>Dinosaurs</div>\n\
    <div>Elephant</div>\n<div>Cat</div>\n\n<script>\n    d3.selectAll(\"div\").style(\"\
    background\",\"orange\").style(\"color\",\"black\");\n\n    d3.select(\"#demo\"\
    ).style(\"background\",\"green\").style(\"color\",\"black\");\n    d3.select(\"\
    .demoClass\").style(\"background\",\"purple\").style(\"color\",\"white\");\n</script>\n\
    ```\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_27_0.png)\n\n您也可以查看我们的 **Learn\
    \ D3.JS Hands-on And The Simple Way** 视频课程以加速学习：[点击此处](here) 或使用下面的二维码享受 50-90%\
