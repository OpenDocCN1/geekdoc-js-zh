    \ for 50-90% off.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_104_1.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_104_2.png)\n\
    \n## 14. Maps\n\nMaps are one of the most exciting and interesting data representation\
    \ formats. While we see a map representation we can have a question how we can\
    \ create a map. In this example we will create a simple US map. This US map consists\
    \ of many numbers of states and each state is having a polygon shape.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_106_0.png)\n\
    \nWhile we look into the polygon we can see that what are the corresponding ‘X’\
    \ and ‘Y’ coordinates involved that represents the boundary. For example if we\
    \ consider ‘n’ number of points that ‘n’ can be 100 or 20 or 10. Then each point\
    \ joint sequentially will result into closed boundary that represents a state.\
    \ All the points of coordinates are a list of array. This is the first thing we\
    \ need to know to create a polygon. Also we need to know some basic property of\
    \ the state like name of the state and id of the state. These two data combined\
    \ normally called Geo-JSON data. We will see the Geo-JSON data in detail in the\
    \ example. Apart from these another thing we need to create a map is projections.\
    \ This is because while we use geometrical we need to consider the earth is spherical\
    \ in shape. When we are representing a 3D data format into 2D then we need to\
    \ go with projections.\n\nD3 provides many popular formats for projecting these\
    \ 3D data into 2D. Let’s look into some of the projections we used in our project.\n\
    \nNow we go to the link [https://github.com/d3/d3/wiki/Geo-Projections](https://github.com/d3/d3/wiki/Geo-Projections)\
    \ and see there are lot of geo projections formats and select one that we are\
    \ going to use it in our project. Each one has some specific benefits. We are\
    \ going to use the **d3.geo.albersUsa** format.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_107_0.png)\n\
    \nNow we can move to our coding part using cloud9 editor. Let we see the GeoJSON\
    \ data before going to actual development.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_107_1.png)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_108_0.png)\n\n- 1. The GeoJSON data\
    \ is a very big data representation. There are lot of coordinates and lot of information.\n\
    - 2. The top level represented in the picture is having an object of this GeoJSON\
    \ data representation format. If we go one level inside it then we can see that\
    \ the object is having two keys as type and features. Type represents the type\
    \ of GeoJSON data it corresponds.\n- 3. The feature is actually an array of objects.\
    \ If we open any one of the individual objects then we can see the type, id, properties\
    \ and geometry as keys. The property will represent the name of the state. The\
    \ geometry represents the coordinates of the polygon in the states corresponds\
    \ to.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_108_1.png)\n\n- 4. We can see\
    \ a lot of coordinates. The ‘0’ is the coordinate for the state Alabama and it\
    \ contains 33 coordinates. If we still extend it we can see the ‘0th’ and ‘1st’\
    \ index of the coordinates. The ‘0th’ index represent ‘X’ and ‘1st’ index value\
    \ represents ‘Y’. Most of the time the GeoJSON data will available on internet\
    \ to download and work on them.\n\n“You can also check our **Learn D3.JS Hands-on\
    \ And The Simple Way** video course for accelerated learning: [here](https://www.google.com)\
    \ or use the below QR code for 50-90% off.”\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_109_0.png)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_109_1.png)"
  mdcn: "\n## 3. 我们将为工具提示的过渡添加鼠标悬停事件。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_99_0.png)\n\
    \n## 4. 我们需要为鼠标事件添加一个工具提示。\n\n正如我们所说，这里会有点棘手。为此，我们将使用一个比例尺。首先我们定义比例尺，然后添加工具提示。定义比例尺时，我们使用了\
    \ `hoverVal` 变量，并定义了最小和最大范围。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_99_1.png)\n\
    \n## 5. 现在我们添加带有参数 `hoverVal` 的工具提示并获取 y 位置。\n\n同时，我们将添加工具提示在折线上的显示位置。因此，我们将工具提示样式定义为\
    \ `left` 和 `top`。加到 `chartBottomPadding` 上的值 `50` 是为了使工具提示中显示的精确 'y' 值对齐。\n\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_99_2.png)\n\n## 6. 既然我们创建了 mouseover\
    \ 事件，我们还需要创建一个 mouseout 事件，将事件恢复到正常状态。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_99_3.png)\n\
    \n一旦我们完成这些，就可以运行程序，然后会得到一个折线图。在实际场景中，折线图并非我们项目中存在的唯一图表。在这些情况下，我们必须进行一些计算并添加一些填充。我们需要进行大量的试错才能达到最终结果。\n\
    \n## 7. 此外，我们可以添加一些文本属性来说明轴代表的含义，如振幅、时间、值和其他变量。\n\n为此，我们将文本属性附加到我们的 'x' 和 'y'\
    \ 轴上。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_100_0.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_100_1.png)\n\
    \n## D3LineChart.html 的代码\n\n```\n<!DOCTYPE html>\n<head>\n<style>\n</style>\n\
    </head>\n<title>Line chart</title>\n<meta charset=\"utf-8\">\n\n<body>\n<script\
    \ src=\"../D3/d3.v3.min.js\"></script>\n<script>\nvar padding = 1;\nvar paddingText\
    \ = 30;\nvar paddingChart = 40;\nvar heightSVG = 700;\nvar widthSVG = 700;\nvar\
    \ animationDuration = 1000;\nvar animationDelay = 1000;\nvar chartBottomPadding\
    \ = 200;\n\nvar data = [10,20,30,40,120];\n\nvar svg = d3.select(\"body\").append(\"\
    svg\").attr(\"width\", widthSVG+200)\n    .attr(\"height\", heightSVG+chartBottomPadding)\n\
    \    .style(\"transform\", \"translate(\"+paddingChart+\"px,\"+paddingChart+\"\
    px)\")\n    .style(\"padding-left\",\"100px\")\n    .style(\"padding-top\",\"\
    100px\")\n    .style(\"background\", \"#000\");\n\nvar tooltip = d3.select('body').append('div')\n\
    \    .style('position','absolute')\n    .style('background','#fff')\n    .style('padding','5\
    \ 15px')\n    .style('border','1px #fff solid')\n    .style('border-radius','5px')\n\
    \    .style('opacity','0');\n\nvar y = d3.scale.linear().domain([0,d3.max(data)])\n\
    \    .range([heightSVG,0]);\n\nvar hoverVal = d3.scale.linear().domain([0,heightSVG])\n\
    \    .range([d3.max(data),0]);\n\nvar x = d3.scale.ordinal().domain(d3.range(data.length))\n\
    \    .rangeRoundBands([0, widthSVG]);\n\nvar yAxis = d3.svg.axis()\n    .scale(y)\n\
    \    .orient(\"left\")\n    .ticks(5);\n//.tickValues([1, 2, 3, 5, 8, 13]);;\n\
    \nvar xAxis = d3.svg.axis()\n    .scale(x)\n    .orient(\"bottom\")\n    .ticks(10);\n\
    \nsvg.append(\"g\")\n    //.attr(\"class\",\"axis\")\n    .call(yAxis)\n    .style(\"\
    fill\",\"none\")\n    .style(\"stroke\",\"#fff\")\n    .append(\"text\")\n   \
    \ .attr(\"transform\",\"translate(-\"+paddingText+\",0)\")\n    .attr(\"dy\",\"\
    0.71rem\")\n    .style(\"text-anchor\",\"end\")\n    .text(\"Value\");\n\nsvg.append(\"\
    g\")\n    .call(xAxis)\n    .attr(\"transform\", \"translate(0,\"+(heightSVG)+\"\
    )\")\n    .style(\"fill\",\"none\")\n    .style(\"stroke\",\"#fff\")\n    .append(\"\
    text\")\n    .attr(\"transform\",\"translate(-\"+paddingText+\",0)\")\n    .attr(\"\
    dy\",\"0.71rem\")\n    .style(\"text-anchor\",\"end\")\n    .text(\"Time\");\n\
    \nvar line = d3.svg.line()\n.x(function(d,i){return x(i);})\n.y(function(d){return\
    \ parseInt(y(d));});\n\nsvg.append(\"path\")\n.datum(data)\n.attr(\"stroke\",\"\
    orange\")\n.attr(\"d\",line)\n.on(\"mouseover\",function(d,i){\n    tooltip.transition()\n\
    \    .style(\"opacity\",1);\n\n    tooltip.html(parseInt((hoverVal(d3.event.pageY-chartBottomPadding+50))))\n\
    \    .style(\"left\",(d3.event.pageX)+\"px\")\n    .style(\"top\",(d3.event.pageY)+\"\
    px\");\n\n    d3.select(this).style(\"opacity\",0.5);\n\n}).on(\"mouseout\",function(){\n\
    \n    d3.select(this).style(\"opacity\",1);\n})\n</script>\n</body>\n</html>\n\
    ```\n\n# 输出\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_104_0.png)\n\n您也可以查看我们的\
    \ **《动手学 D3.JS 与简单方法》** 视频课程以加速学习：[点击这里](http://example.com)，或使用下方二维码享受五至九折优惠。\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_104_1.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_104_2.png)\n\
    \n## 14. 地图\n\n地图是最令人兴奋和有趣的数据表示格式之一。当我们看到地图表示时，可能会想如何创建一个地图。在这个例子中，我们将创建一个简单的美国地图。这个美国地图由许多州组成，每个州都是一个具有多边形形状的区域。\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_106_0.png)\n\n当我们查看多边形时，可以看到哪些对应的 'X'\
    \ 和 'Y' 坐标构成了边界。例如，如果我们考虑 'n' 个点，这个 'n' 可以是 100、20 或 10。然后每个点按顺序连接将形成一个表示一个州的封闭边界。所有坐标点都是一个数组列表。这是我们创建多边形首先需要知道的。同时，我们还需要知道一些州的基本属性，比如州名和州\
    \ id。这两组数据通常合称为 Geo-JSON 数据。我们将在示例中详细查看 Geo-JSON 数据。除了这些，创建地图我们还需要投影。这是因为当我们使用几何图形时，需要考虑地球是球形的。当我们将\
    \ 3D 数据格式表示为 2D 时，就需要使用投影。\n\nD3 提供了许多流行的格式，用于将这些 3D 数据投影到 2D。让我们看看我们项目中使用的一些投影。\n\
    \n现在我们访问链接 [https://github.com/d3/d3/wiki/Geo-Projections](https://github.com/d3/d3/wiki/Geo-Projections)，可以看到有很多地理投影格式，我们选择一个将在我们项目中使用的格式。每种格式都有其特定的优点。我们将使用\
    \ **d3.geo.albersUsa** 格式。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_107_0.png)\n\
    \n现在我们可以转到使用 cloud9 编辑器进行编码的部分。在进入实际开发之前，让我们先看看 GeoJSON 数据。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_107_1.png)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_108_0.png)\n\n- 1. GeoJSON 数据是一种非常庞大的数据表示。它包含大量的坐标和信息。\n\
    - 2. 图片中显示的顶层是这个 GeoJSON 数据表示格式的一个对象。如果我们深入一层，可以看到该对象有两个键：`type` 和 `features`。`type`\
    \ 代表它对应的 GeoJSON 数据类型。\n- 3. `feature` 实际上是一个对象数组。如果我们打开其中任何一个单独的对象，可以看到 `type`、`id`、`properties`\
    \ 和 `geometry` 作为键。`properties` 将表示州的名称。`geometry` 表示该州对应多边形的坐标。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_108_1.png)\n\
    \n- 4. 我们可以看到大量的坐标。'0' 是阿拉巴马州的坐标，它包含 33 个坐标点。如果我们继续展开，可以看到坐标的 '第0个' 和 '第1个' 索引。'第0个'\
    \ 索引代表 'X'，'第1个' 索引值代表 'Y'。大部分情况下，GeoJSON 数据可以在互联网上下载并使用。\n\n“您也可以查看我们的 **《动手学\
    \ D3.JS 与简单方法》** 视频课程以加速学习：[点击这里](https://www.google.com)，或使用下方二维码享受五至九折优惠。”\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_109_0.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_109_1.png)\n"
