- md: "## 15.4. Defining properties for our individual state vs Year bar chart\n\n\
    ```javascript\nvar plot = svg.append(\"g\")\n    .attr(\"id\",\"barPlot\")\n \
    \   .selectAll()\n    .data(dataUSPopulation)\n    .enter()\n    .append(\"rect\"\
    )\n    .attr(\"width\",widthOfBar)\n    .attr(\"height\",function(d,i){\n    \
    \    return h(d[\"2016\"]);\n    })\n    .style(\"fill\",\"orange\")\n    .attr(\"\
    y\",function(d,i){\n        return heightBar- h(d[\"2016\"]);\n    })\n    .attr(\"\
    x\",function(d,i){\n        return x(i);\n})\n.on('mouseover',function(d){\n\n\
    \    tooltip.transition()\n        .style('opacity',1);\n    tooltip.html(\"2016\
    \ : \"+d[\"2016\"]+\" \"+d[\"Name\"])\n        .style('left',(d3.event.pageX)+\"\
    px\")\n        .style('top',(d3.event.pageY)+\"px\");\n\n    d3.select(this).style('opacity',0.5);\n\
    \n})\n.on('mouseout',function(){\n\n    d3.select(this).style('opacity',1);\n\n\
    });\n```\n\n11. Until this if we run the code we will be getting the bar chart.\
    \ We have to call the barFirstTimeRender function so call it before the function\
    \ we created. We can also add a tool tip event using the mouse over event.\n\n\
    The next step will be the State vs Year bar chart that needs to be displayed while\
    \ clicking any of the state. We already saw that we have two functions that we\
    \ are going to use ‘update’ and ‘new’. So we will come back to our addStateBarChart()\
    \ function to continue plotting our State vs Year population chart. We will be\
    \ using small renamed variables used here to differentiate the main bar chart\
    \ variables and these bar chart variables.\n\n```javascript\nfunction addStateBarChart(data,index,mode){\n\
    \n    var sBMaxPop = 0;\n    var sBWidthBar = 400;\n    var sBHeightBar = 250;\n\
    \    var sBPaddingText = 10;\n    var sTtooltip = d3.select('body').append('div')\n\
    \        .style('position','absolute')\n        .style('background','#fff')\n\
    \        .style('padding','5 15px')\n        .style('border','1px #fff solid')\n\
    \        .style('border-radius','5px')\n        .style('opacity','0');\n```\n\n\
    13. We are using the sBData here. Here the data is different. We will select one\
    \ particular state and draw bar chart for that. Each individual state is having\
    \ a different index. This index will be passed to the function parameter. We also\
    \ create a new sBDataNew array to store the Year value into it to make the process\
    \ easier.\n\n```javascript\nvar sBData = dataUSPopulation[index];\nvar sBDataNew\
    \ = [];\nvar sBNumYear = 0;\nvar sBState = dataUSPopulation[index][\"Name\"];\n\
    \nfor(k in sBData){\n    if(!Number.isNaN(parseInt(k))){\n\n        sBNumYear++;\n\
    \        sBDataNew.push({\n\n            \"year\":k,\n            \"popl\":sBData[k]\n\
    \        });\n\n        if(sBMaxPop < sBData[k]){\n            sBMaxPop = sBData[k];\n\
    \        }\n    }\n};\n```\n\n14. Next we will define the scales for the bar chart\
    \ and also the width of the bar.\n\n```javascript\nvar sBH = d3.scale.linear().domain([0,sBMaxPop])\n\
    \           .range([0,sBHeightBar]);\n\nvar sBY = d3.scale.linear().domain([0,sBMaxPop])\n\
    \           .range([sBHeightBar,0]);\n\nvar sBX = d3.scale.ordinal().domain(d3.range(sBNumYear))\n\
    \           .rangeRoundBands([0,sBWidthBar]);\n\nvar sBWidthOfBar = Math.floor(sBWidthBar\
    \ / sBNumYear)-1;\n```\n\n15. If the bar chart is new and it will start render\
    \ that if we click the bar chart for the first time. The mode new is the third\
    \ parameter of the function of this small bar chart. We will create a global variable\
    \ called statePlot variable and use it inside the mode.\n\n```javascript\nif(mode\
    \ === \"new\"){\n    statePlot.selectAll()\n    .data(sBDataNew)\n    .enter()\n\
    \    .append(\"rect\")\n    .attr(\"width\",sBWidthOfBar)\n    .attr(\"height\"\
    ,function(d,i){\n        return parseInt(sBH(d[\"pop1\"]));\n    })\n    .attr(\"\
    y\",function(d,i){\n        return parseInt(sBY(d[\"pop1\"]));\n    })\n    .attr(\"\
    x\",function(d,i){\n        return sBX(i);\n    })\n    .style(\"fill\",\"green\"\
    ).on('mouseover',function(d){\n\n    tooltip.transition()\n        .style('opacity',1);\n\
    \    tooltip.html(d[\"year\"]+\" : \"+d[\"popl\"])\n        .style('left',(d3.event.pageX)+\"\
    px\")\n        .style('top',(d3.event.pageY)+\"px\");\n\n    d3.select(this).style('opacity',0.5);\n\
    \n})\n.on('mouseout',function(){\n\n    d3.select(this).style('opacity',1);\n\n\
    });\n```\n\n16. In the else if part we write the code to update the data. This\
    \ will make the transitions and display the graph for the current state.\n\n```javascript\n\
    }else if(mode === \"update\"){\n    statePlot.selectAll(\"rect\")\n    .data(sBDataNew)\n\
    \    .transition()\n    .duration(1000)\n    .attr(\"width\",sBWidthOfBar)\n \
    \   .attr(\"height\",function(d,i){\n        return parseInt(sBH(d[\"popl\"]));\n\
    \    })\n    .attr(\"y\",function(d,i){\n\n        return parseInt(sBY(d[\"popl\"\
    ]));\n    })\n    .attr(\"x\",function(d,i){\n\n        return sBX(i);\n    })\n\
    \    .style(\"fill\",\"green\");\n\n}else{\n\n    return ;\n}\n```\n\n## 15.5.\
    \ Defining and Drawing KPI numbers\n\n17. The final part is defining the KPI numbers\
    \ as per our use case. This will display the data for the particular state. We\
    \ will add the KPI inside the addBarChart() function.\n\n```javascript\nsvg.selectAll(\"\
    #kpi\")\n.text(sBData[\"2016\"])\n.transition()\n.duration(1000);\n\nsvg.selectAll(\"\
    #kpiDec\")\n.text(sBState)\n.transition()\n.duration(1000);\n```\n\n18. We also\
    \ need to add the KPI information to the function barFirstTimeRender function.\n\
    \n```javascript\nsvg.append(\"text\")\n.attr(\"id\",\"kpi\")\n.text(\"State Population\"\
    )\n.attr(\"class\",\"KPIMain\")\n.attr(\"x\",parseInt(widthBar/2 - 200))\n.attr(\"\
    y\",parseInt(heightBar/2 - 200));\n\nsvg.append(\"text\")\n.attr(\"id\",\"kpiDec\"\
    )\n.text(\"State Name\")\n.attr(\"class\",\"KPIDesc\")\n.attr(\"x\",parseInt(widthBar/2\
    \ - 200))\n.attr(\"y\",parseInt(heightBar/2 - 200));\n```\n\n## 15.6. CSS and\
    \ Other Small Changes\n\n19. Without CSS the map will not look good. All the map\
    \ and charts will be not aligned properly. To fix that we need to add the CSS\
    \ styles to correct the elements.\n\nWithout CSS\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_124_0.png)\n\
    \nSo we need to improve the CSS. After we did some trial and error finally we\
    \ have a proper CSS to display our project correctly.\n\n```html\n<style type=\"\
    text/css\">\n/* No style rules here yet */\n\ng#barPlot {\n    transform: translateX(70px)\
    \ !important;\n}\n\n.KPIMain{\n    transform:translate(814px,-82px);\n    font-size:72px;\n\
    \    fill:gray !important;\n    font-weight:bold;\n}\n.KPIDesc{\n    transform:translate(840px,-41px);\n\
    \    font-size:20px;\n    fill:gray !important;\n}\n.map{\n    transform:translate(400px,77px);\n\
    }\n</style>\n```\n\nCode for D3FinalProject.html is available in the repository\
    \ [https://c9.io/ajaytech/dataviz](https://c9.io/ajaytech/dataviz). It contains\
    \ 15000+ lines of code that can’t be shared here. So go to the repository and\
    \ verify your coding.\n\n## 15.7 Output\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_126_0.png)\n\
    \nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video course\
    \ for accelerated learning: [here](link) or use the below QR code for 50-90% off.\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_126_1.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_126_2.png)\n\
    \n# Reference and bibliography\n\n- [Interactive Data Visualization for the Web\
    \ by Scott Murray](http://alignedleft.com/work/d3-book)\n- [D3 JavaScript Libraries\
    \ official documentation and API reference](https://d3js.org/)\n- [US Census government\
    \ website for public data to show use case](http://www.census.gov/)"
  mdcn: "\n## 15.4. 为我们的各州人口与年份柱状图定义属性\n\n```javascript\nvar plot = svg.append(\"\
    g\")\n    .attr(\"id\",\"barPlot\")\n    .selectAll()\n    .data(dataUSPopulation)\n\
    \    .enter()\n    .append(\"rect\")\n    .attr(\"width\",widthOfBar)\n    .attr(\"\
    height\",function(d,i){\n        return h(d[\"2016\"]);\n    })\n    .style(\"\
    fill\",\"orange\")\n    .attr(\"y\",function(d,i){\n        return heightBar-\
    \ h(d[\"2016\"]);\n    })\n    .attr(\"x\",function(d,i){\n        return x(i);\n\
    })\n.on('mouseover',function(d){\n\n    tooltip.transition()\n        .style('opacity',1);\n\
    \    tooltip.html(\"2016 : \"+d[\"2016\"]+\" \"+d[\"Name\"])\n        .style('left',(d3.event.pageX)+\"\
    px\")\n        .style('top',(d3.event.pageY)+\"px\");\n\n    d3.select(this).style('opacity',0.5);\n\
    \n})\n.on('mouseout',function(){\n\n    d3.select(this).style('opacity',1);\n\n\
    });\n```\n\n11. 目前，如果我们运行代码，将会得到这个柱状图。我们需要调用 `barFirstTimeRender` 函数，所以在我们创建的函数之前调用它。我们还可以使用鼠标悬停事件添加工具提示事件。\n\
    \n下一步将是“各州与年份柱状图”，需要在点击任意一个州时显示该图。我们已经看到我们将使用两个函数：‘update’ 和 ‘new’。因此，我们将回到 `addStateBarChart()`\
    \ 函数，继续绘制我们的“各州与年份人口”图表。我们将使用此处重命名的小变量，以区分主柱状图变量和这些柱状图变量。\n\n```javascript\nfunction\
    \ addStateBarChart(data,index,mode){\n\n    var sBMaxPop = 0;\n    var sBWidthBar\
    \ = 400;\n    var sBHeightBar = 250;\n    var sBPaddingText = 10;\n    var sTtooltip\
    \ = d3.select('body').append('div')\n        .style('position','absolute')\n \
    \       .style('background','#fff')\n        .style('padding','5 15px')\n    \
    \    .style('border','1px #fff solid')\n        .style('border-radius','5px')\n\
    \        .style('opacity','0');\n```\n\n13. 我们在这里使用 `sBData`。此处的数据不同。我们将选择一个特定的州，并为其绘制柱状图。每个州都有一个不同的索引。这个索引将作为函数参数传递。我们还创建了一个新的\
    \ `sBDataNew` 数组，用于存储年份值，以简化处理过程。\n\n```javascript\nvar sBData = dataUSPopulation[index];\n\
    var sBDataNew = [];\nvar sBNumYear = 0;\nvar sBState = dataUSPopulation[index][\"\
    Name\"];\n\nfor(k in sBData){\n    if(!Number.isNaN(parseInt(k))){\n\n       \
    \ sBNumYear++;\n        sBDataNew.push({\n\n            \"year\":k,\n        \
    \    \"popl\":sBData[k]\n        });\n\n        if(sBMaxPop < sBData[k]){\n  \
    \          sBMaxPop = sBData[k];\n        }\n    }\n};\n```\n\n14. 接下来，我们将定义柱状图的比例尺以及柱子的宽度。\n\
    \n```javascript\nvar sBH = d3.scale.linear().domain([0,sBMaxPop])\n          \
    \ .range([0,sBHeightBar]);\n\nvar sBY = d3.scale.linear().domain([0,sBMaxPop])\n\
    \           .range([sBHeightBar,0]);\n\nvar sBX = d3.scale.ordinal().domain(d3.range(sBNumYear))\n\
    \           .rangeRoundBands([0,sBWidthBar]);\n\nvar sBWidthOfBar = Math.floor(sBWidthBar\
    \ / sBNumYear)-1;\n```\n\n15. 如果柱状图是新的，那么当我们第一次点击柱状图时，它将开始渲染。模式 `new` 是这个小柱状图函数的第三个参数。我们将创建一个名为\
    \ `statePlot` 的全局变量，并在模式中使用它。\n\n```javascript\nif(mode === \"new\"){\n    statePlot.selectAll()\n\
    \    .data(sBDataNew)\n    .enter()\n    .append(\"rect\")\n    .attr(\"width\"\
    ,sBWidthOfBar)\n    .attr(\"height\",function(d,i){\n        return parseInt(sBH(d[\"\
    pop1\"]));\n    })\n    .attr(\"y\",function(d,i){\n        return parseInt(sBY(d[\"\
    pop1\"]));\n    })\n    .attr(\"x\",function(d,i){\n        return sBX(i);\n \
    \   })\n    .style(\"fill\",\"green\").on('mouseover',function(d){\n\n    tooltip.transition()\n\
    \        .style('opacity',1);\n    tooltip.html(d[\"year\"]+\" : \"+d[\"popl\"\
    ])\n        .style('left',(d3.event.pageX)+\"px\")\n        .style('top',(d3.event.pageY)+\"\
    px\");\n\n    d3.select(this).style('opacity',0.5);\n\n})\n.on('mouseout',function(){\n\
    \n    d3.select(this).style('opacity',1);\n\n});\n```\n\n16. 在 `else if` 部分，我们编写代码来更新数据。这将产生过渡效果并显示当前州的图表。\n\
    \n```javascript\n}else if(mode === \"update\"){\n    statePlot.selectAll(\"rect\"\
    )\n    .data(sBDataNew)\n    .transition()\n    .duration(1000)\n    .attr(\"\
    width\",sBWidthOfBar)\n    .attr(\"height\",function(d,i){\n        return parseInt(sBH(d[\"\
    popl\"]));\n    })\n    .attr(\"y\",function(d,i){\n\n        return parseInt(sBY(d[\"\
    popl\"]));\n    })\n    .attr(\"x\",function(d,i){\n\n        return sBX(i);\n\
    \    })\n    .style(\"fill\",\"green\");\n\n}else{\n\n    return ;\n}\n```\n\n\
    ## 15.5. 定义和绘制关键绩效指标数字\n\n17. 最后部分是根据我们的用例定义关键绩效指标数字。这将显示特定州的数据。我们将在 `addBarChart()`\
    \ 函数中添加关键绩效指标。\n\n```javascript\nsvg.selectAll(\"#kpi\")\n.text(sBData[\"2016\"\
    ])\n.transition()\n.duration(1000);\n\nsvg.selectAll(\"#kpiDec\")\n.text(sBState)\n\
    .transition()\n.duration(1000);\n```\n\n18. 我们还需要将关键绩效指标信息添加到 `barFirstTimeRender`\
    \ 函数中。\n\n```javascript\nsvg.append(\"text\")\n.attr(\"id\",\"kpi\")\n.text(\"\
    State Population\")\n.attr(\"class\",\"KPIMain\")\n.attr(\"x\",parseInt(widthBar/2\
    \ - 200))\n.attr(\"y\",parseInt(heightBar/2 - 200));\n\nsvg.append(\"text\")\n\
    .attr(\"id\",\"kpiDec\")\n.text(\"State Name\")\n.attr(\"class\",\"KPIDesc\")\n\
    .attr(\"x\",parseInt(widthBar/2 - 200))\n.attr(\"y\",parseInt(heightBar/2 - 200));\n\
    ```\n\n## 15.6. CSS 和其他小改动\n\n19. 没有 CSS，地图将不会好看。所有的地图和图表将无法正确对齐。为了解决这个问题，我们需要添加\
    \ CSS 样式来修正元素。\n\n没有 CSS 的情况\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_124_0.png)\n\
    \n因此我们需要改进 CSS。经过反复试验，我们终于有了正确的 CSS 来正确显示我们的项目。\n\n```html\n<style type=\"text/css\"\
    >\n/* No style rules here yet */\n\ng#barPlot {\n    transform: translateX(70px)\
    \ !important;\n}\n\n.KPIMain{\n    transform:translate(814px,-82px);\n    font-size:72px;\n\
    \    fill:gray !important;\n    font-weight:bold;\n}\n.KPIDesc{\n    transform:translate(840px,-41px);\n\
    \    font-size:20px;\n    fill:gray !important;\n}\n.map{\n    transform:translate(400px,77px);\n\
    }\n</style>\n```\n\nD3FinalProject.html 的代码可在仓库 [https://c9.io/ajaytech/dataviz](https://c9.io/ajaytech/dataviz)\
    \ 中找到。它包含 15000 多行代码，无法在此分享。因此请访问该仓库并验证你的代码。\n\n## 15.7 输出\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_126_0.png)\n\
    \n你也可以查看我们的 **动手学 D3.JS：简单方法** 视频课程以加速学习：[此处](link)，或使用下方二维码享受 50-90% 的折扣。\n\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_126_1.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_126_2.png)\n\
    \n# 参考文献与书目\n\n- [Scott Murray 著《基于 Web 的交互式数据可视化》](http://alignedleft.com/work/d3-book)\n\
    - [D3 JavaScript 库官方文档和 API 参考](https://d3js.org/)\n- [美国人口普查局政府网站，用于展示用例的公共数据](http://www.census.gov/)\n"
