  mdcn: "\n## 15. 最终项目\n\n在本节中，我们将开始着手最终项目，并了解如何在真实项目中运用 D3。我们将开展一个数据可视化项目，而**数据可视化是当前市场上热门的技能组合之一**。如果你想了解更多关于数据可视化的内容，我们强烈推荐你查看\
    \ Udemy 上的‘**7 个简单步骤学习数据可视化**’课程。这将为如何在数据可视化项目中工作打下非常坚实的基础。下一节我们将探讨使用 D3 的用例。\n\
    \n在开始任何数据可视化项目之前，我们应始终有一个明确的目标陈述/需求。让我们看一下这里的目标陈述。\n\n![image](img/fe6f284f77f839b45695e65dc7c6dabb_111_0.png)\n\
    \n根据此目标陈述，我们需要构建一个仪表盘，供**监测美国各州人口增长的人们**使用，以便他们能够基于**这些州的当前人口和人口增长情况**来**分配资源给各州**。\n\
    \n这里我们可以看到三个主要部分：\n-   受众是谁？\n-   范围是什么？\n-   产出\n\n**受众**：监测人口的人们。我们将使用 D3 为他们创建一个可视化项目。\n\
    \n**范围和产出**：利用这个可视化工具，他们将根据这些数据为各州分配资源。\n\n一旦我们明确了在数据可视化项目中要做什么，我们就会进入数据可视化项目的\
    \ 7 个步骤。初始阶段我们将获取数据，然后花时间解析数据并为使用做准备。\n\n![image](img/fe6f284f77f839b45695e65dc7c6dabb_112_0.png)\n\
    \n这是基于我们已在 moqups 网站创建的需求而生成的线框图。我们跳过了如何获取数据、如何处理数据、过滤以及创建此线框图的步骤，因为我们在其他数据可视化课程中已经涵盖了这\
    \ 7 个步骤。本课程我们主要关注开发。在上图中，我们可以看到包含所有州人口的柱状图以及一张美国地图。KPI 字段显示当前州的人口数据。\n\n地图上方还有一个小的柱状图，它将显示特定年份的人口变化。这是一个交互式的\
    \ D3 地图，如果我们按下地图上的任何州，KPI 值和小的柱状图将根据该州的数据相应改变。\n\n## 15.1. 代码结构\n\n![image](img/fe6f284f77f839b45695e65dc7c6dabb_113_0.png)\n\
    \n1.  让我们看看解决我们讨论的用例的代码结构。第一项是美国地图的 GeoJSON 数据文件。第二项是美国人口数据。这两项是 JSON 数据，将在项目开始前提供给我们。\n\
    2.  接下来，我们需要创建所有州的“人口 vs 图表”的柱状图。\n3.  第三步是添加交互事件。如果我们在地图上按下单个州，我们应该能够看到代表该州历年的人口柱状图。我们还需要根据所选州更新\
    \ KPI 字段信息。接下来，我们将使用 cloud9 编辑器在代码中看到这些步骤。\n\n## 15.2. 创建地图项目\n\n1.  创建一个新文件，命名为\
    \ D3FinalProject.html，并将我们从 github 获取的地图内容复制粘贴到该文件中。我们会看到一个非常大的 geoJSON 数据，将其最小化/折叠以便更容易查看其他代码。\n\
    \n```javascript\nvar data = {\n    \"type\": \"FeatureCollection\",\n    \"features\"\
    : [\n        {\n            \"type\": \"Feature\",\n            \"id\": \"01\"\
    ,\n            \"properties\": {\n                \"name\": \"Alabama\"\n    \
    \        },\n            \"geometry\": {\n                \"type\": \"Polygon\"\
    ,\n                \"coordinates\": [\n                    [\n               \
    \         [-87.359296, 35.00118],\n                        [-85.606675, 34.984749],\n\
    \                        [-85.431413, 34.124869],\n                        //\
    \ ...\n                    ]\n                ]\n            }\n        }\n  \
    \  ]\n};\n```\n\n![image](img/fe6f284f77f839b45695e65dc7c6dabb_114_0.png)\n\n\
    2.  接下来我们需要美国的人口数据。我们可以看到美国人口的 JSON 数据。它包含大量数据，每个对象都有一个 name 键字段，并且我们拥有 2010、2012、2014\
    \ 和 2016 年的数据。这些是我们将使用的偶数年份。在实际项目中，我们通常从网络服务获取数据或从某些文件中读取数据。这个用例的目的很简单，所以我们可以在\
    \ D3 程序中使用硬编码的数据。我们将复制 JSON 数据并粘贴到 `var dataUSPopulation = [{<在此粘贴数据>}]` 中。\n\n\
    ![image](img/fe6f284f77f839b45695e65dc7c6dabb_115_0.png)\n\n3.  其余部分对于地图是相同的。我们将增加宽度和高度，并为图表添加一些内边距。\n\
    \n```javascript\n//Width and height\nvar w = 1600;\nvar h = 800;\nvar margin =\
    \ {\n    left:32,\n    right:30,\n    bottom:30,\n    top:30\n};\nvar numOfState\
    \ = 50;\nvar scaleOfMap = 1000;\nvar tooltip = d3.select('body').append('div')\n\
    \    .style('position','absolute')\n    .style('background','#fff')\n    .style('padding','5\
    \ 15px')\n    .style('border','1px #fff solid')\n    .style('border-radius','5px')\n\
    \    .style('opacity','0');\n```\n\n4.  在地图中我们还有一个点击事件。即当用户点击地图上的某个州时，可以看到一个柱状图。我们将在点击事件发生时执行一个函数。我们可以看到我们使用了两个函数：`update`\
    \ 和 `new`。当用户首次点击州时，将调用 `new` 函数，此时该州的人口图表将会显示。一旦显示后，用户再点击任何其他州，将调用 `update` 函数。`if`\
    \ 语句应在创建州柱状图之后添加。\n\n```javascript\n}).on(\"click\", function(d,i){\n    if(document.getElementById(\"\
    stateBar\").childNodes.length>0)\n    {\n        addStateBarChart(d,i,\"update\"\
    );\n    }else{\n        addStateBarChart(d,i,\"new\");\n    }\n```\n\n## 15.3.\
    \ 为我们的州人口柱状图定义属性\n\n5.  接下来我们将定义州人口柱状图（主柱状图）。为此，我们将创建一个名为 `barFirstTimeRender()`\
    \ 的函数。我们将创建柱状图的限制范围、其他边界和内边距。同时复制地图的 tooltip 并在此处使用。`maxPop` 用于确定所有州中的最高人口，并将其用于缩放。\n\
    \n6.  我们使用 `for` 循环来查找当前年份的最大人口值。`if(!Number.isNaN(parseInt(k)))`：这用于仅允许键条件中的年份值。为此我们使用了‘非数字(NaN)’。\n\
    \n```javascript\nfunction barFirstTimeRender(){\n    var maxPop = 0;\n    var\
    \ widthBar = 750;\n    var heightBar = 700;\n    var paddingText = 70;\n    var\
    \ tooltip = d3.select('body').append('div')\n        .style('position','absolute')\n\
    \        .style('background','#fff')\n        .style('padding','5 15px')\n   \
    \     .style('border','1px #fff solid')\n        .style('border-radius','5px')\n\
    \        .style('opacity','0');\n\n    for(var i=0;i<dataUSPopulation.length;i++){\n\
    \        for(k in dataUSPopulation[i]){\n            if(!Number.isNaN(parseInt(k))){\n\
    \                if(dataUSPopulation[i][k]>maxPop){\n                    maxPop\
    \ = dataUSPopulation[i][k];\n                }\n            }\n        }\n   \
    \ }\n}\n```\n\n7.  一旦我们得到最大人口（这将是柱状图的上限），我们就会创建比例尺。\n\n```javascript\nvar h =\
    \ d3.scale.linear()\n        .domain([0,maxPop])\n        .range([0,heightBar]);\n\
    \nvar y = d3.scale.linear()\n        .domain([0,maxPop])\n        .range([heightBar,0]);\n\
    \nvar x = d3.scale.ordinal()\n        .domain(d3.range(dataUSPopulation.length))\n\
    \        .rangeRoundBands([0,widthBar]);\n```\n\n8.  创建比例尺后，我们将创建带有刻度数、方向和比例尺的\
    \ ‘Y’ 轴。‘X’ 轴同理。同时，我们将通过 `widthBar / dataUSPopulation.length` 并向下取整来创建柱子的宽度，以确保一个完整的圆整值。\n\
    \n```javascript\nvar yAxis = d3.svg.axis()\n    .scale(y)\n    .orient('left')\n\
    \    .ticks(10);\n\nvar xAxis = d3.svg.axis()\n    .scale(x)\n    .orient('bottom')\n\
    \    .ticks(50);\n\nvar widthOfBar = Math.floor(widthBar / dataUSPopulation.length)-1;\n\
    ```\n\n9.  我们将分别对 ‘Y’ 轴和 ‘X’ 轴进行分组，因为我们将分别应用 CSS 属性。\n\n```javascript\nsvg.append(\"\
    g\")\n    .attr(\"id\",\"yAxis\")\n    .call(yAxis)\n    .style(\"stroke\",\"\
    #000\")\n    .attr(\"transform\",\"translate(\"+paddingText+\",0)\");\n\nsvg.append(\"\
    g\")\n    .attr(\"id\",\"xAxis\")\n    .call(xAxis)\n    .style(\"stroke\",\"\
    #000\")\n    .attr(\"transform\",\"translate(\"+paddingText+\",\"+(heightBar)+\"\
    )\");\n```\n\n10. 接下来，我们将为这个柱状图将 ‘Y’ 轴和 ‘X’ 轴附加到我们的 SVG。我们在这里绘制柱子。\n"
