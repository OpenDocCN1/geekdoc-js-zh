    \n在上一个例子中，我们创建了柱状图并引入了比例尺的概念。在本节中，我们将为柱状图添加坐标轴。我们需要做的第一步是创建X轴和Y轴。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_56_0.png)\n\
