  md: '# 12. Pie Chart and Donut charts


    Pie charts are used to show differentiation and comparison among data points.
    Most of the time in business context these are used to show percentage shares
    between different data point. Like revenues from different regions of our company
    or productions from different regions of factory. It can also be used to show
    some sales information of different regions that how they are performing in sales.
    We can come to a conclusion on the highest earning region and lowest earning regions.
    These are some of the examples that we are using pie chart. A slightly modified
    version of pie chart is donut chart. We can generate a donut chart by cutting
    out the inner circle of pie chart. To create a pie chart and donut chart we will
    use the following functions.


    ```

    d3.svg.arc()

    d3.layout.pie()

    ```


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_83_0.png)


    Let’s go to our cloud9 editor and create the donut chart.


    +   1. Simply create a file as D3PieChart.html and declare the variables and basic
    framework.'
