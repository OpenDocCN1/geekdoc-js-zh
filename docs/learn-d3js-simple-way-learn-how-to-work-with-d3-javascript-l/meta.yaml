    \ to. Generally in a two dimensional graph we are having two axis namely X – Axis\
    \ and Y – Axis. To create an axis in D3 we use the function d3.svg.axis(). The\
    \ actual syntax we create an Axis is\n\n```\nvar yAxis = d3.svg.axis()\n    .scale(y)\n\
    \    .orient('left')\n    .ticks(5);\n```\n\nWe are using the function d3.svg.axis()\
    \ and passing the scale to it. The orientation we are passing will tell the bar\
    \ chart to be in left hand side. Ticks are used to have number of ticks we need\
    \ in the Y- Axis. Similarly the syntax for X – Axis is\n\n```\nvar xAxis = d3.svg.axis()\n\
    \    .scale(x)\n    .orient('bottom')\n    .ticks(10);\n```\n\nWe are passing\
    \ the scale here. The orientation is given as bottom because we need the x axis\
    \ comes under the bottom part of the bar chart. In our case we need more number\
    \ of ticks. So we had given 10 as our parameter in ticks in X – Axis. Depending\
    \ upon our requirements we can give more or less ticks. Generally in most cases\
    \ we need more number of ticks in the X – Axis. We will see an example using this\
    \ syntax in our cloud9 editor.\n\nIn the last example we created bar chart and\
