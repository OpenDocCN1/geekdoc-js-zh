    \    .call(xAxis)\n    .style(\"stroke\",\"#fff\");\n```\n\n添加这些后，如果我们运行代码。我们将看到结果看起来像这样\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_57_0.png)\n\n这不是我们想要的确切结果。Y轴不可见，X轴位于上方。\n\
    \n5.  首先我们将X轴推到底部，然后将Y轴稍微推到右侧。为此，我们在这里添加 `transform` 属性，值为 `translate`。我们添加了一个变量\
    \ `axisMargin` 来统一定位坐标轴边距。我们需要在声明部分将其值声明为30。\n\n```\nsvg.append(\"g\")\n    .call(yAxis)\n\
    \    .attr(\"transform\", \"translate(\"+axisMargin+\",0)\")\n    .style(\"stroke\"\
    , \"#fff\");\n\nsvg.append(\"g\")\n    .call(xAxis)\n    .attr(\"transform\",\
    \ \"translate(0,\"+(heightSVG-axisMargin)+\")\")\n    .style(\"stroke\", \"#fff\"\
    );\n```\n\n我们现在已经修复了坐标轴。然而，我们仍然需要将图表稍微向上和向右移动。目前如果我们运行代码，我们将得到如下结果\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_58_0.png)\n\
    \n为了修复该图片中箭头所示的问题，我们需要添加一个简单的CSS属性。\n\n6.  首先，我们将使用 `append` 函数将矩形组合在一起。同时我们添加带有类名\
    \ `rectangle` 的样式函数。\n\n```\nsvg.append(\"g\")\n    .attr(\"class\", \"rectangle\"\
    )\n    .selectAll()\n    .data(data)\n    .enter()\n    .append(\"rect\")\n  \
    \  .attr(\"height\", function(d,i){\n        return 0;\n```\n\n7.  在输出中，我们可以看到Y轴的值是反的。为了修复这个问题，我们需要反转Y轴的范围。\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_59_0.png)\n\n如果我们交换 `heightSVG` 和 `y(d)`\
    \ 的值，我们可以看到柱状图会反转。即从高到低变为从低到高。\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_59_1.png)\n\
    \n这些是我们创建和对齐坐标轴需要做的更改。我们需要做大量的实验才能得到正确的结果。\n\n## D3Axis.html 的代码\n\n```\n<!DOCTYPE\
    \ html>\n<meta charset=\"utf-8\">\n<title>向 SVG 元素添加属性和选择</title>\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"\
    ../D3/d3.v3.min.js\"></script>\n<script>\n\n    var data=[10,20,30,40,100];\n\
    var heightSVG = 700;\nvar widthSVG = 700;\nvar padding = 10;\nvar paddingText\
    \ = 30;\nvar paddingChart = 40;\nvar axisMargin = 30;\nvar margin = {\n    'top':5,\n\
    \    'right':20,\n    'bottom':20,\n    'left':50\n};\n\nvar y = d3.scale.linear().domain([0,d3.max(data)])\n\
    \    .range([heightSVG-axisMargin,0]);\n\nvar x = d3.scale.ordinal().domain(d3.range(data.length))\n\
    \    .rangeRoundBands([0,widthSVG]);\n\nvar yAxis = d3.svg.axis()\n    .scale(y)\n\
    \    .orient('left')\n    .ticks(5);\n\nvar xAxis = d3.svg.axis()\n    .scale(x)\n\
    \    .orient('bottom')\n    .ticks(5);\n\nvar svg = d3.select(\"body\")\n.append(\"\
    svg\")\n.attr(\"width\", widthSVG)\n.attr(\"height\", heightSVG)\n.style(\"transform\"\
    , \"translate(\" + paddingChart + \"px, \" + paddingChart + \"px\")\")\n.style(\"\
    background\", \"black\");\n```\n\n```\nsvg.append(\"g\")\n.call(yAxis)\n.attr(\"\
    transform\", \"translate(\" + axisMargin + \", 0)\")\n.style(\"stroke\", \"#fff\"\
    );\n```\n\n```\nsvg.append(\"g\")\n.call(xAxis)\n.attr(\"transform\", \"translate(0,\
    \ \" + (heightSVG - axisMargin) + \")\")\n.style(\"stroke\", \"#fff\");\n```\n\
    \n```\nsvg.append(\"g\")\n.attr(\"class\", \"rectangle\")\n.selectAll()\n.data(data)\n\
    .enter()\n.append(\"rect\")\n.attr(\"height\", function(d, i){\n    return heightSVG;\n\
    })\n.attr(\"width\", \"20px\")\n.style(\"fill\", \"orange\")\n.attr(\"y\", function(d,\
    \ i){\n    return y(d);\n})\n```\n\n```\n</script>\n</body>\n</html>\n```\n\n\
    ## Style.css\n\n```\n.blueBack{\n    background : blue;\n}\n\n.rectangle{\n  \
    \  transform: translate(30px,-30px) !important;\n}\n```\n\n## 输出\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_62_0.png)\n\
