    ![](img/fe6f284f77f839b45695e65dc7c6dabb_2_3.png)\n![](img/fe6f284f77f839b45695e65dc7c6dabb_2_4.png)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_3_0.png)\n\n## Free Gift Coupons\n\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_3_1.png)\n\nOr\n[Go here](https://example.com)\n\
    \n## You Might Be Also Interested In\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_4_0.png)\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_4_1.png)\n![](img/fe6f284f77f839b45695e65dc7c6dabb_4_2.png)\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_4_3.png)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_5_0.png)\n\
    \n[Learn SAP® UI5: The new enterprise Javascript framework with examples](http://www.example.com)\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_5_1.png)\n![](img/fe6f284f77f839b45695e65dc7c6dabb_5_2.png)\n\
    \n[SAP® Netweaver Gateway: Learn how to use SAP® Netweaver Gateway for UI5 and\
    \ ABAP projects](http://www.example.com)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_5_3.png)\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_5_4.png)\n\n[Data Visualization In 7\
    \ Simple Steps](http://www.example.com)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_5_5.png)\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_5_6.png)\n\n[Internet of Things with\
    \ SAP HANA: Build Your IoT Use Case With Raspberry PI, Arduino Uno, HANA XSJS\
    \ and SAPUI5](http://www.example.com)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_5_7.png)\n\
    \n## Table of Content\n\n1. [Introduction](#)\n2. [LEARNING PATH OF THIS BOOK](#)\n\
    3. [SVG Elements](#)\n    3.1. [Simple Example for SVG](#)\n    3.2. [SVG with\
    \ D3](#)\n4. [Selecting elements and operating](#)\n    4.1. [Coding](#)\n5. [Styling](#)\n\
    6. [Geometrical objects](#)\n7. [Bringing Data into the Picture](#)\n8. [Loading\
    \ Data from external file](#)\n9. [Scale and Axis](#)\n    9.1. [Linear Scale](#)\n\
    \    9.2. [Ordinal Scale](#)\n    9.3. [Axis](#)\n10. [Events](#)\n11. [Bubble\
    \ Chart](#)\n12. [Pie Chart and Donut charts](#)\n    12.1. [Converting Donut\
    \ chart into Pie Chart](#)\n13. [Line Chart](#)\n14. [Maps](#)\n15. [Final Project](#)\n\
    \    15.1. [Code Structure](#)\n    15.2. [Creating map project](#)\n    15.3.\
    \ [Defining properties for our state vs population bar chart](#)\n    15.4. [Defining\
    \ properties for our individual state vs Year bar chart](#)\n    15.5. [Defining\
    \ and Drawing KPI numbers](#)\n    15.6. [CSS and Other Small Changes](#)\n15.7.\
    \ [Output](#)\n\nReference and bibliography\n\n## 1. Introduction\n\n**What is\
    \ D3?**\nD3 stands for Data Driven Documentation. It is a JavaScript library which\
    \ allows developers to create amazing analytics and visualizations.\n\n**Why D3?**\n\
    D3 should be preferred to any other JavaScript library, because there are a lot\
    \ of options available for us. If we want to create some visualization projects\
    \ like a simple project or a simple mathematical application then it is one of\
    \ the best choices because of the following reasons.\n\n**Modern Browser Capability:**\
    \ We can use modern browser capability with D3. We have access to all the HTML5\
    \ and CSS properties. So, the created application is responsive and adaptable\
    \ to user devices.\n\n**Endless Variations:** Variations and options provided\
    \ by D3 are endless. We will see in [d3js.org](https://d3js.org) website for possibilities\
    \ of D3.\n\n**BSD Open Source License:** D3 comes with a BSD open source license.\
    \ So we don't need to pay anyone to use D3.\n\n**Large Community Support:** D3\
    \ has large community support. There are lot of people in **StackOverflow** and\
    \ **GitHub**. Support is essential if we are learning a new technology. This community\
    \ will guide us to resolve any queries and issues that we face in projects.\n\n\
    Let's explore [d3js.org](https://d3js.org) website\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_8_0.png)\n\
    ![](img/fe6f284f77f839b45695e65dc7c6dabb_8_1.png)\n\nIf you go to the examples\
    \ tab you can see popular examples in the gallery. Here we can see a lot of examples\
    \ created using D3. There are many common graphs like Box plot, Bubble chart,\
    \ Heat maps and more innovative charts like graph with force layout and motion\
    \ charts are available in the examples tab. We will find several variations and\
    \ innovative approach to solve any visualization problem using D3. In the right\
    \ hand side, they have provided the API reference. It is very useful if you are\
    \ new to D3. It contains the documentations and features of all elements used\
    \ in D3.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_9_0.png)\n\n### Arrays (d3-array)\n\
    \nArray manipulation, ordering, searching, summarizing, etc.\n\n> Statistics\n\
    \nMethods for computing basic summary statistics.\n\n- `d3.min` - compute the\
    \ minimum value in an array.\n- `d3.max` - compute the maximum value in an array.\n\
    - `d3.extent` - compute the minimum and maximum value in an array.\n- `d3.sum`\
    \ - compute the sum of an array of numbers.\n- `d3.mean` - compute the arithmetic\
    \ mean of an array of numbers.\n- `d3.median` - compute the median of an array\
    \ of numbers (the 0.5-quantile).\n- `d3.quantile` - compute a quantile for a sorted\
    \ array of numbers.\n- `d3.variance` - compute the variance of an array of numbers.\n\
    - `d3.deviation` - compute the standard deviation of an array of numbers.\n\n\
    ### API Reference\n\nLet’s go back to the example and select one example to explore.\
    \ Here we select the Box plot example to explore.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_10_0.png)\n\
    \nAfter selecting the Box plot, it opens the D3 example and the coding that created\
    \ to the graph. Mike Bostock is the developer who created this graph. He also\
    \ posted lot of examples. You can click his name to see the graphs posted by him.\n\
    \n![](img/fe6f284f77f839b45695e65dc7c6dabb_10_1.png)\n\nYou can also check our\
    \ **Learn D3.JS Hands-on And The Simple Way** video course for accelerated learning:\
    \ [here](link) or use the below QR code for 50-90% off.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_11_0.png)\n\
    \n## Learn D3.JS Hands-on And The Simple Way\n\nUI5 Community Network • SAP Experts\
    \ • SAP Services, SAP Consulting, SAP Education\n\nLearn how to work with D3 Javascript\
    \ libraries in step-by-step and most simple manner with lots of hands-on examples\n\
    \n35 lectures 7 hours All Levels\n\n★★★★★ 4.4 (10 ratings)\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_11_1.png)\n\
    \n## 2. LEARNING PATH OF THIS BOOK\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_13_0.png)\n\
    \n- Initially we will start with SVG (Scalable Vector Graphics). We will see how\
    \ to create simple graphic objects like circles, rectangles and triangles.\n-\
    \ Also, we learn how these SVG elements can be drawn from HTML5. Next, we will\
    \ use D3 to create these SVG elements.\n- Once we get basic understanding the\
    \ basic SVG elements works then we move on to work with custom style sheets (CSS).\n\
    - Working with CSS, we see how to use Data with D3.\n- Following that we shall\
    \ see how to use simple graph like bubble chart and bar chart.\n- Then, we will\
    \ see the Events in our graph while the end user moves mouse over the graph.\n\
    - Our learning curve would also proceed to some advanced graphs like map or heat\
    \ map project.\n- Finally, we will create an assignment project. This assignment\
    \ will be a use case of a visualization project that we will solve using D3. We\
    \ are going to learn the process step wise and by hands-on basis."
