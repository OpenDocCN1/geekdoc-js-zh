    \ of all the states and use that for scaling.\n\n6. We use the ‘for loop’ to find\
    \ the maximum population value of the current year. If(!Number.isNaN(parseInt(k))){\
    \ - This is used to allow only year values inside the key condition. For that\
    \ we used ‘not a number(NaN)’ is used.\n\n```\nfunction barFirstTimeRender(){\n\
    \    var maxPop = 0;\n    var widthBar = 750;\n    var heightBar = 700;\n    var\
    \ paddingText = 70;\n    var tooltip = d3.select('body').append('div')\n     \
