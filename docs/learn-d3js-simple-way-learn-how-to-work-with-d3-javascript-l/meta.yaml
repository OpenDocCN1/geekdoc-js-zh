- md: "## 12. Pie Chart and Donut charts\n\nPie charts are used to show differentiation\
    \ and comparison among data points. Most of the time in business context these\
    \ are used to show percentage shares between different data points. Like revenues\
    \ from different regions of our company or productions from different regions\
    \ of factory. It can also be used to show some sales information of different\
    \ regions that how they are performing in sales. We can come to a conclusion on\
    \ the highest earning region and lowest earning regions. These are some of the\
    \ examples that we are using pie chart. A slightly modified version of pie chart\
    \ is donut chart. We can generate a donut chart by cutting out the inner circle\
    \ of pie chart. To create a pie chart and donut chart we will use the following\
    \ functions.\n\n```\nd3.svg.arc()\nd3.layout.pie()\n```\n\nLet's go to our cloud9\
    \ editor and create the donut chart.\n\n- 1. Simply create a file as D3PieChart.html\
    \ and declare the variables and basic framework.\n\n```\nvar padding = 1;\nvar\
    \ paddingText = 30;\nvar paddingChart = 40;\nvar heightSVG = 700;\nvar widthSVG\
    \ = 700;\nvar extraPadding = 200;\nvar animationDuration = 1000;\nvar animationDelay\
    \ = 1000;\nvar radius = 200;\nvar innerRadius = 100;\nvar paddingPieX = 200;\n\
    var paddingPieY = 250;\nvar unit = \"px\";\n```\n\n- 2. Next we will add some\
    \ data and colour scales. We use linear scale with domain parameters from 0 to\
    \ maximum length of the data set. The colour values range from green to orange.\n\
    \n```\nvar data = [10,20,30,40,120];\nvar color = d3.scale.linear().domain([0,data.length])\n\
    \    .range([\"green\",\"orange\"]);\n```\n\n- 3. Next thing we need to add is\
    \ the Arc with outer radius and inner radius.\n\n```\nvar arc = d3.svg.arc()\n\
    \    .outerRadius(radius)\n    .innerRadius(innerRadius);\n```\n\n- 4. Next we\
    \ need to create an arc label with outer and inner radius. The outer radius is\
    \ subtracted from the paddingText.\n\n```\nvar labelArc = d3.svg.arc()\n    .outerRadius(radius-paddingText)\n\
    \    .innerRadius(innerRadius-paddingText);\n```\n\n- 5. We are going to create\
    \ a pie layout in the next step. The following syntax will give us a pie layout.\n\
    \n```\nvar pie = d3.layout.pie()\n    .sort(null)\n    .value(function(d){return\
    \ d;});\n```\n\n- 6. Creating SVG with maximum height and width of these SVG.\n\
    \n```\nvar svg = d3.select(\"body\").append(\"svg\")\n    .attr(\"width\",widthSVG+extraPadding)\n\
    \    .attr(\"height\",heightSVG+extraPadding)\n    .style(\"background\",\"#000\"\
    );\n```\n\n- 7. Next we need to group all the SVG elements and then append the\
    \ path of those elements. We are using a transform property here. This will align\
    \ the chart to the browser window correctly. If we failed to introduce a transform\
    \ property we won't be able to see the full chart inside the browser window.\n\
    \n```\nvar g = svg.selectAll(\".arc\")\n    .data(pie(data))\n    .enter()\n \
    \   .append(\"g\");\n\ng.append(\"path\")\n.attr(\"d\",arc)\n.style(\"transform\"\
    ,\"translate(\"+paddingPieX+\"px,\"+paddingPieY+\"px)\")\n.style(\"fill\",function(d,i){return\
    \ \"#000\";})\n```\n\nAs of now if we run the code we will able to see the donut\
    \ chart. We still need to add label, tooltip and mouse over events to it.\n\n\
    - 8. To add a label we need to append a text with transformation to show this\
    \ inside the arc. We use the translation property here to translate the X and\
    \ Y co-ordinates. The centroid function we used here is to get a simple array\
    \ which having X and Y values. We also add some extra padding using `.attr(\"\
    dy\",\".35em\")` function and `.text(function(d){return d.value;});`\n\n```\n\
    g.append(\"text\")\n    .attr(\"transform\",function(d){\n        return \"translate(\"\
    +(parseInt(labelArc.centroid(d)[0])+paddingPieX-10)+\",\"\n              +(parseInt(labelArc.centroid(d)[1])+paddingPieY-10)+\"\
    )\";\n    })\n    .attr(\"dy\",\".35em\")\n    .text(function(d){return d.value;});\n\
    ```\n\n- 9. In the next step we are going to add some events to our donut chart.\
    \ To do that we will use mouseover event and we will call the tooltip from there.\
    \ The mouseover event will change the opacity to 0.5 and the mouseout event will\
    \ set back to 1.\n\n## Code for D3Bubble.html\n\n```\n<!DOCTYPE html>\n<meta charset=\"\
    utf-8\">\n<title>Bubble chart</title>\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"></script>\n\
    <script>\n\n    var data={\n        \"val1\": [10,20,30,40,100],\n        \"val2\"\
    :[20,30,50,40,70]};\n    var heightSVG = 700;\n    var widthSVG = 700;\n    var\
    \ padding = 10;\n    var paddingText = 30;\n    var paddingChart = 40;\n    var\
    \ axisMargin = 30;\n    var margin = {\n        'top':5,\n        'right':20,\n\
    \        'bottom':20,\n        'left':50\n    };\n    var minR = 20;\n    var\
    \ maxR = 70;\n    var dataVal1 = data[\"val1\"];\n    var dataVal2 = data[\"val2\"\
    ];\n\n    var y = d3.scale.linear().domain([0,d3.max(dataVal1)])\n        .range([heightSVG-axisMargin,0]);\n\
    \n    var x = d3.scale.ordinal().domain(d3.range(dataVal1.length))\n        .rangeRoundBands([0,widthSVG]);\n\
    \n    var r = d3.scale.linear().domain([d3.min(dataVal2),d3.max(dataVal2)])\n\
    \        .range([minR,maxR]);\n\n    var yAxis = d3.svg.axis()\n        .scale(y)\n\
    \        .orient('left')\n        .ticks(5);\n\n    var xAxis = d3.svg.axis()\n\
    \        .scale(x)\n        .orient('bottom')\n        .ticks(5);\n\n    var svg\
    \ = d3.select(\"body\")\n        .append(\"svg\")\n        .attr(\"width\",widthSVG)\n\
    \        .attr(\"height\",heightSVG)\n        .style(\"transform\",\"translate(\"\
    +paddingChart+\"px,\"+paddingChart+\"px)\")\n        .style(\"background\",\"\
    black\");\n    var tooltip = d3.select('body')\n        .append('div')\n     \
    \   .style('position','absolute')\n        .style('background','#fff')\n     \
    \   .style('padding','5px 15px')\n        .style('border','1px #fff solid')\n\
    \        .style('opacity','0');\n\n    svg.append(\"g\")\n        .call(yAxis)\n\
    \        .attr(\"transform\",\"translate(\"+axisMargin+\",0)\")\n        .style(\"\
    stroke\",\"#fff\");\n\n    svg.append(\"g\")\n        .call(xAxis)\n        .attr(\"\
    transform\",\"translate(0,\"+(heightSVG-axisMargin)+\")\")\n        .style(\"\
    stroke\",\"#fff\");\n\n    svg.append(\"g\")\n        .attr(\"class\",\"circle\"\
    )\n        .selectAll()\n        .data(dataVal1)\n        .enter()\n        .append(\"\
    circle\")\n        .attr(\"r\",function(d,i){\n          return r(dataVal2[i]);\n\
    \        })\n        .attr(\"width\",\"10px\")\n        .style(\"fill\",\"orange\"\
    )\n        .attr(\"cy\",function(d,i){\n          return heightSVG ;\n       \
    \ })\n        .attr(\"cx\",function(d,i){\n          return x(i);\n        }).on(\"\
    mouseover\",function(d,i){\n\n          tooltip.transition().style(\"opacity\"\
    ,1);\n          tooltip.html(\"y: \"+d+\" / r: \"+dataVal2[i])\n          .style(\"\
    left\",(d3.event.pageX)+\"px\")\n          .style(\"top\",(d3.event.pageY)+\"\
    px\");\n\n          d3.select(this).style(\"opacity\",0.5);\n\n        }).on(\"\
    mouseout\",function(d){\n\n          d3.select(this).style(\"opacity\",1);\n\n\
    \        });\n\n    d3.selectAll(\"circle\").transition()\n        .duration(4000)\n\
    \        .attr(\"cy\",function(d,i){\n            return (y(d))+\"px\" ;\n   \
    \     })\n</script>\n</body>\n</html>\n```\n\n## CSS Style\n\n```\n.blueBack{\n\
    \    background : blue;\n}\n```\n\n```\n.rectangle{\n    transform: translate(30px,-30px)\
    \ !important;\n}\n```\n\n```\n.circle{\n    transform: translate(30px,0px) !important;\n\
    }\n```\n\nYou can also check our **Learn D3.JS Hands-on And The Simple Way** video\
    \ course for accelerated learning: [here](https://example.com) or use the below\
    \ QR code for 50-90% off."
  mdcn: "\n## 12. 饼图与环形图\n\n饼图用于展示数据点之间的差异和比较。在商业场景中，大多数情况下用于展示不同数据点之间的百分比份额，例如公司来自不同区域的收入或工厂来自不同地区的产量。它也可以用于展示不同地区的销售信息及其表现情况。通过饼图，我们可以得出收入最高和最低的区域结论。这些是使用饼图的一些典型示例。饼图的一个轻微变体是环形图。我们可以通过挖去饼图的内圆来生成环形图。创建饼图和环形图，我们将使用以下函数。\n\
    \n```\nd3.svg.arc()\nd3.layout.pie()\n```\n\n让我们打开 Cloud9 编辑器来创建环形图。\n\n- 1. 简单地创建一个名为\
    \ D3PieChart.html 的文件，并声明变量和基本框架。\n\n```\nvar padding = 1;\nvar paddingText =\
    \ 30;\nvar paddingChart = 40;\nvar heightSVG = 700;\nvar widthSVG = 700;\nvar\
    \ extraPadding = 200;\nvar animationDuration = 1000;\nvar animationDelay = 1000;\n\
    var radius = 200;\nvar innerRadius = 100;\nvar paddingPieX = 200;\nvar paddingPieY\
    \ = 250;\nvar unit = \"px\";\n```\n\n- 2. 接下来，我们将添加一些数据和颜色比例尺。我们使用线性比例尺，其域参数从\
    \ 0 到数据集的最大长度。颜色值范围从绿色到橙色。\n\n```\nvar data = [10,20,30,40,120];\nvar color =\
    \ d3.scale.linear().domain([0,data.length])\n    .range([\"green\",\"orange\"\
    ]);\n```\n\n- 3. 接下来需要添加的是带有外半径和内半径的弧。\n\n```\nvar arc = d3.svg.arc()\n    .outerRadius(radius)\n\
    \    .innerRadius(innerRadius);\n```\n\n- 4. 接下来我们需要创建一个带有外半径和内半径的弧标签。外半径减去了 paddingText\
    \ 的值。\n\n```\nvar labelArc = d3.svg.arc()\n    .outerRadius(radius-paddingText)\n\
    \    .innerRadius(innerRadius-paddingText);\n```\n\n- 5. 下一步我们将创建一个饼图布局。以下语法将为我们提供一个饼图布局。\n\
    \n```\nvar pie = d3.layout.pie()\n    .sort(null)\n    .value(function(d){return\
    \ d;});\n```\n\n- 6. 创建具有最大高度和宽度的 SVG。\n\n```\nvar svg = d3.select(\"body\").append(\"\
    svg\")\n    .attr(\"width\",widthSVG+extraPadding)\n    .attr(\"height\",heightSVG+extraPadding)\n\
    \    .style(\"background\",\"#000\");\n```\n\n- 7. 接下来，我们需要将所有 SVG 元素分组，然后追加这些元素的路径。这里我们使用了\
    \ transform 属性。这将使图表与浏览器窗口正确对齐。如果我们未能引入 transform 属性，我们将无法在浏览器窗口内看到完整的图表。\n\n\
    ```\nvar g = svg.selectAll(\".arc\")\n    .data(pie(data))\n    .enter()\n   \
    \ .append(\"g\");\n\ng.append(\"path\")\n.attr(\"d\",arc)\n.style(\"transform\"\
    ,\"translate(\"+paddingPieX+\"px,\"+paddingPieY+\"px)\")\n.style(\"fill\",function(d,i){return\
    \ \"#000\";})\n```\n\n目前，如果我们运行代码，将能够看到环形图。我们仍需为其添加标签、工具提示和鼠标悬停事件。\n\n- 8. 要添加标签，我们需要追加一个带有变换的文本，以显示在弧内部。这里我们使用\
    \ translation 属性来平移 X 和 Y 坐标。我们这里使用的 centroid 函数是为了获取一个包含 X 和 Y 值的简单数组。我们还使用 `.attr(\"\
    dy\",\".35em\")` 函数添加了一些额外的间距，并使用 `.text(function(d){return d.value;});` 设置了文本内容。\n\
    \n```\ng.append(\"text\")\n    .attr(\"transform\",function(d){\n        return\
    \ \"translate(\"+(parseInt(labelArc.centroid(d)[0])+paddingPieX-10)+\",\"\n  \
    \            +(parseInt(labelArc.centroid(d)[1])+paddingPieY-10)+\")\";\n    })\n\
    \    .attr(\"dy\",\".35em\")\n    .text(function(d){return d.value;});\n```\n\n\
    - 9. 在下一步中，我们将为环形图添加一些事件。为此，我们将使用 mouseover 事件，并在那里调用工具提示。mouseover 事件将透明度更改为\
    \ 0.5，而 mouseout 事件将透明度设置回 1。\n\n## D3Bubble.html 代码\n\n```\n<!DOCTYPE html>\n\
    <meta charset=\"utf-8\">\n<title>Bubble chart</title>\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"style.css\"></link>\n\n<body>\n<script src=\"../D3/d3.v3.min.js\"\
    ></script>\n<script>\n\n    var data={\n        \"val1\": [10,20,30,40,100],\n\
