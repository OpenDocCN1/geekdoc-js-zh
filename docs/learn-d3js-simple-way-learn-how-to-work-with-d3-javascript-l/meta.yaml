    \n1.  我们要进行的主要更改是从矩形到圆形。\n    1.  我们需要将所有 `rect` 元素更改为 `circle`。\n    2.  我们需要半径\
    \ `r` 来创建一个圆，在这里用半径 `r` 替换 `height`。\n    3.  不使用 `y` 和 `x`，我们需要将其更改为 `cy` 和 `cx`。\n"
