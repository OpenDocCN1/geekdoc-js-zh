    # 3. SVG Elements


    SVG is a short form for Scalable Vector Graphics. Similar to PNG or JPEG files,
    SVG is used to store XML based vector image formats. A normal bitmap image is
    composed of a fixed set of pixels. A vector image, on the other hand, is composed
    of fixed set of shapes like circles, line or text. We can see that the image represented
    in .jpeg, .png or .gif files are pixilated or distorted. However, in vector images
    they are set of shapes and we would not see any quality compromise while zooming
    on the image.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_16_0.png)


    # Examples


    Let us see some simple examples of using SVG elements in our HTML5 page. We are
    going to use the Cloud9 IDE. We do majority of our developments in Cloud9 IDE.
    The files are accessible for our users 24x7.


    Link for the repositories: [https://ide.c9.io/ajaytech/dataviz](https://ide.c9.io/ajaytech/dataviz)


    People who are not familiar with this IDE can read the document on getting started
    in the given link.


    Getting Started: [https://docs.c9.io/docs/getting-started](https://docs.c9.io/docs/getting-started)


    Let us ***START CODING!***'
