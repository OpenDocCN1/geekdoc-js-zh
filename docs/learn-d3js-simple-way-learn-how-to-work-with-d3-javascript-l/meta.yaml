  md: '# 14. Maps


    Maps are one of the most exciting and interesting data representation formats.
    While we see a map representation we can have a question how we can create a map.
    In this example we will create a simple US map. This US map consists of many numbers
    of states and each state is having a polygon shape.


    ![](img/fe6f284f77f839b45695e65dc7c6dabb_106_0.png)


    While we look into the polygon we can see that what are the corresponding ‘X’
    and ‘Y’ coordinates involved that represents the boundary. For example if we consider
    ‘n’ number of points that ‘n’ can be 100 or 20 or 10. Then each point joint sequentially
    will result into closed boundary that represents a state. All the points of coordinates
    are a list of array. This is the first thing we need to know to create a polygon.
    Also we need to know some basic property of the state like name of the state and
    id of the state. These two data combined normally called Geo-JSON data. We will
    see the Geo-JSON data in detail in the example. Apart from these another thing
    we need to create a map is projections. This is because while we use geometrical
    we need to consider the earth is spherical in shape. When we are representing
    a 3D data format into 2D then we need to go with projections.


    D3 provides many popular formats for projecting these 3D data into 2D. Let’s look
    into some of the projections we used in our project.


    Now we go to the link [https://github.com/d3/d3/wiki/Geo-Projections](https://github.com/d3/d3/wiki/Geo-Projections)
    and see there are lot of geo projections formats and select one that we are going
    to use it in our project. Each one has some specific benefits. We are going to
    use the **d3.geo.albersUsa** format.'
