    \nWe can check this in console window also. To verify, right click on the browser\
    \ window and select inspect element. Inside the console window enter the minimum\
    \ data point value. In our case it is 10 so enter y(10) in the console window\
    \ then it return 70. This 70 is our height of the first data set. Similarly we\
    \ can check for y(100) then it will return 700. You can also check the x scale\
    \ (ordinal scale) if we enter x(0) then it will return the padding left for the\
    \ first rectangle because the bar starts without any padding. If we enter x(1)\
    \ then it will return 140.\n\n![](img/fe6f284f77f839b45695e65dc7c6dabb_55_1.png)"
