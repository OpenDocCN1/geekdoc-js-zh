- md: "## 15. Final Project\n\nIn this section we are going to start working in our\
    \ final project and we will see how we will use D3 in a real project. In this\
    \ we will work in a data visualization project and **visualizing data is one of\
    \ the hot skill sets in the marketplace right now**. If you want to learn more\
    \ about data visualization then we will highly recommend to check our ‘**Learn\
    \ Data Visualization in 7 simple steps**’ course in Udemy. This will provide a\
    \ very firm basic understanding of how to work in a data visualization project.\
    \ In the next section we are going to see the use case to work in D3.\n\nBefore\
    \ starting any data visualization project we should always have a clear purpose\
    \ statement/requirements. Let’s look into the purpose statement that we have here.\n\
    \n![image](img/fe6f284f77f839b45695e65dc7c6dabb_111_0.png)\n\nAccording to this\
    \ purpose statement we have to build a dashboard that will be utilized by **people\
    \ who monitor population growth** of different states of the US, so they can **allocate\
    \ resources to states** based upon **current population and population growth\
    \ of these states**.\n\nHere we can see the three main parts:\n- Who is the audience?\n\
    - What is the scope?\n- Outcome\n\n**Audience**: People who monitor population.\
    \ We are going to create a visualization project for them using D3.\n\n**Scope\
    \ and Outcome**: Using this visualization they will be allocating the resources\
    \ to those states according to this.\n\nOnce we are clear on what we are going\
    \ to do in a data visualization project then we will go into the 7 steps of a\
    \ data visualization project. The initial stage we will acquire the data and then\
    \ after we will spend time in parsing the data and preparing it for usage.\n\n\
    ![image](img/fe6f284f77f839b45695e65dc7c6dabb_112_0.png)\n\nThis is the wireframe\
    \ based upon our requirement that we already created in the moqups website. We\
    \ have skipped how to acquire data and how to work with data, filtering and creating\
    \ this wireframe because we covered these 7 steps in our other courses of data\
    \ visualization. This course we are covering development oriented. In the above\
    \ picture we can see that the bar chart with population of all the states and\
    \ we also have a USA map. The KPI field shows the data of the population of the\
    \ current state.\n\nThere is also a small bar chart above our map that will show\
    \ the variation of population for that particular years mentioned. This is an\
    \ interactive D3 map that if we press any state on the map and the KPI values\
    \ and small bar chart will change corresponding to the data.\n\n## 15.1. Code\
    \ Structure\n\n![image](img/fe6f284f77f839b45695e65dc7c6dabb_113_0.png)\n\n1.\
    \ Let’s see the code structure to solve the use case that we discussed. The first\
    \ thing is the GeoJSON data file for our USA map. The second thing is the data\
    \ for US population. These two are the JSON data that will be given to us before\
    \ starting the project.\n2. Next we need to create the bar chart for population\
    \ vs graph of all states of US.\n3. The third step is to add the interaction event.\
    \ If we press on any single state of the map then we should be able to see the\
    \ bar chart that represents the population of that state over years. We also update\
    \ the KPI field information based upon the state we have selected. Next we will\
    \ see these steps in our coding using cloud9 editor.\n\n## 15.2. Creating map\
    \ project\n\n1. Create a new file and name it as D3FinalProject.html and copy\
    \ the content of the map that we got from the github and paste it in the file.\
    \ We will see a very big geoJSON data and minimize/collapse it to see other codes\
    \ easily.\n\n```javascript\nvar data = {\n    \"type\": \"FeatureCollection\"\
    ,\n    \"features\": [\n        {\n            \"type\": \"Feature\",\n      \
    \      \"id\": \"01\",\n            \"properties\": {\n                \"name\"\
    : \"Alabama\"\n            },\n            \"geometry\": {\n                \"\
    type\": \"Polygon\",\n                \"coordinates\": [\n                   \
    \ [\n                        [-87.359296, 35.00118],\n                       \
    \ [-85.606675, 34.984749],\n                        [-85.431413, 34.124869],\n\
    \                        // ...\n                    ]\n                ]\n  \
    \          }\n        }\n    ]\n};\n```\n\n![image](img/fe6f284f77f839b45695e65dc7c6dabb_114_0.png)\n\
    \n2. Next we need the population data of US. We can see the JSON data for population\
    \ of US. It contains a huge number of data and each object is having a name key\
    \ field and we have the data for the year 2010, 2012, 2014 and 2016. These are\
    \ even number of years that we are going to use. While we are in real projects\
    \ we are capturing the data from web services or reading the data from some files.\
    \ The purpose of this use case is simple here so we can use the hard coded data\
    \ inside our D3 program. We will copy the JSON data and paste it inside var dataUSPopulation\
    \ = [{<data to be pasted here>}];\n\n![image](img/fe6f284f77f839b45695e65dc7c6dabb_115_0.png)\n\
    \n3. Other remaining things are same for the map. We will increase the width and\
