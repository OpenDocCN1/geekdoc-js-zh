  raw: 'We address it by speaking to the mountain of distractions or obstacles. In
    other words, by speaking to it, we are not tolerating or ignoring it. We are not
    going around it but addressing it by facing it head on! We are to address it by
    taking a place of commitment, determination, and command as we use our faith and
    authority in Christ to remove its ability to distract us. It is not difficult.
    We can identify and address our mountains or obstacles just like Jesus taught
    His disciples to do.


    To get started, when you are ready to identify and address your obstacles, ask
    yourself some basic questions. The mountain image often describes how people feel
    when they are dealing with Spiritual A.D.D. They feel like their situations are
    mountains, huge and immovable. If that is how you feel, ask yourself some questions
    to better identify and address the distraction:


    Do I need to stop what I’m doing to address this distraction? Does it need to
    be done now? Is it even urgent, or can it wait until another time? Is it important
    or necessary to drop what I’m doing to tend to the distraction? Am I using my
    time wisely? What distractions are stealing my time, keeping me from my prayer
    time, Bible reading, or walk with the Lord?


    Asking questions like these will help you better deal with distractions and will
    help you single in on the things you may need to change.


    Another way to tell that you are becoming distracted is if you start losing focus
    and even become fidgety. This is usually a real problem for those who are suffering
    from Spiritual A.D.D. When you start feeling restless and antsy in prayer, for
    example, try getting up and moving around. Sometimes activity helps bring you
    back to a place where you can better focus.


    If you are dealing with Spiritual A.D.D., you need to be encouraged that there
    are natural and spiritual solutions you can apply. Sometimes you need to address
    the devil, who may be trying to distract you. This would be a spiritual solution,
    and the way to apply it is to do what Jesus taught His disciples regarding the
    mountain. Tell the enemy he has no place in your life.


    At other times, your own spiritual apathy could be contributing to your distraction
    because you are so busy in natural things. If so, you need to identify what natural
    things are replacing or affecting your spiritual hunger. Is it an overemphasis
    on some activity, person, place, or thing? If it is, then you need to make the
    necessary steps to bring it into order. You do this simply by substituting spiritual
    things in place of that hindrance. You will be surprised how your hunger will
    return in your Christian walk. The important thing is to rise up in your heart,
    your spirit, and decide you aren’t going to let any mountain stand in the way
    of your victory over Spiritual A.D.D. and distractions.


    You deal with spiritual distractions in the same way you deal with natural distractions.
    However, natural distractions can affect you not only in natural things but also
    in your spiritual life if you are not careful.


    If you feel like you have a mountain of Spiritual A.D.D. or distractions that
    you are facing, here are some considerations that may help you.


    Start with writing down a list of things that are wants, needs, and absolutes
    in your life. When you make this list, be sure that at the top you have time with
    God as your first priority. Then make note of what things you have to absolutely
    put first because you can’t live without them. Then ask yourself, What are the
    things I need to do and give quality attention to? Finally, ask, What are some
    things that I want but that aren’t necessarily absolute needs?


    After you have made note of your wants, needs, and absolutes, then make note of
    your daily and weekly routine and responsibilities by creating a schedule. When
    you do, consider how you can better prioritize your time. What are things that
    could be distractions to this schedule? Where are spiritual things listed on this
    schedule, and how much priority are you giving to them?


    This is called clearing your head—when you make a list before you go about your
    time with God. You will find it helpful, and it will limit distractions before
    and during your time with God. Making a list of the things you need to do, like
    chores, schedules, work responsibilities, important dates, and other things, will
    keep you better focused and less distracted. This is one reason why Jesus said
    not to put your hands to the plow and look back (see Luke 9:62). In other words,
    stay focused on the spiritual tasks at hand, and don’t get distracted.


    A good farmer can’t plow his field correctly and expect a harvest if he’s looking
    over his shoulder and getting distracted. The result would be crooked rows and
    precious space and time wasted because of distractions. Also, if you have been
    suffering from Spiritual A.D.D., do not look back on your frustration or failures,
    but plow ahead and refuse to focus on the past!


    Once you have written out your schedule and determined to prioritize time with
    God, make sure you have plenty of spiritual things that you are implementing in
    your schedule. Once you put the schedule to use, it is important to make a note
    of what specific things start trying to distract you before you spend time with
    the Lord. Also, it is just as important to do the same thing during your regular
    times with the Lord—making note of things that try to make you restless and distracted.
    You need to ask yourself if these distractions are commonly occurring just when
    you set your heart on spiritual things. If they are, then identify and address
    them. Always remember the importance of checking your heart attitude when you
    begin. Are you complaining, yawning, acting bored, going through the routine,
    or are you really putting your heart excitement in what you are doing?


    Don’t forget the importance of being well organized and prepared in your times
    with God to keep your attention focused on the Lord. Consider bringing a list
    of things to pray, your Bible, a notebook, some worship music, or a Christian
    book.


    Another helpful thing to consider if you are feeling distracted is to check your
    surroundings. For me, if there is a lot of clutter, my surroundings can be a distraction.
    You may want to take a look around to see if excess clutter can be removed and
    to physically clean your surroundings. You will be amazed at how free you feel
    and how much more you feel like investing in spiritual things when your surroundings
    are clean and in order. The vital thing is to establish a clean, uncluttered location
    for time with God, if possible.


    If your location is distracting you, perhaps you could choose a different place,
    one with the least amount of distractions. If it is noise, then try to find a
    place that is more quiet and peaceful. If that is not an option, consider what
    things you can do to your current place to make it more peaceful and less of a
    distraction. If it is the time you are meeting with the Lord that is distracting
    you (because you are feeling tired or restless), consider praying at another time
    when you are more alert, or try to get more rest.


    If you are still struggling with Spiritual A.D.D. and just can’t seem to shake
    the distractions, consider the possibility of finding an accountability partner
    to help you stay on course with your spiritual walk or time with God. This is
    only as good as you want it to be—you have to allow yourself to be accountable.'
