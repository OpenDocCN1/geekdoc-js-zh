  trans: '

    如果它们在我们活着的时候没有得到解决，就会导致我们失去对主或灵性事事的渴望、专注和注意力。当这种情况发生时，我们会感到沮丧，导致我们的祷告生活陷入挣扎。我们开始对神的事物失去兴趣，从而导致一个恶性循环。这可能导致我们与神的同行关系有时看起来像失控了一样。日复一日，我们发现自己很难专注于神的事物。我们发现对灵性生活的保持兴趣变得越来越困难，有时甚至与神相处的时间感到不充实。


    这听起来对你来说熟悉，是你正在面对的问题吗？我想让你受到鼓励，因为事情并不事必须如此。正如我之前提到的，分心是灵性注意力缺失（Spiritual A.D.D.）的主要症状之一，当它们试图在你的生活中肆意生长时，你是可以把它们套住的。约束并避免这些讨厌的干扰、干扰、干扰的一种方法，就是记录下经常试图分你心的事情。


    # 记录干扰


    你可以通过写下或记下它们来记录干扰。你可以通过考虑你的日常行程、中断以及你可能安排的其他事情来实现。问问自己：这些事情是如何影响我的灵性生活的？换句话说，如果是电脑在让你分心，就记录下来。它是否正通过过度使用
    Facebook、发电子邮件、互联网搜索和购物等，将你从与神相处的时间中抽离——尤其是当你试图花时间与神相处时？你的灵修经常被中断吗？或者你很少找到时间做这些，因为你必须检查电脑或看手机看谁可能发了短信？


    当我们记录那些试图中断和偷走我们时间的细微和明显的事物时，我们就能更好地应对灵性注意力缺失。当我们记录某事时，并不意味着仅仅是承认那些让我们分心的事；它也意味着采取行动来处理。例如，我们可以选择在祷告时关手机，或者选择与神相处，而不是整晚上上网或看电视。


    我们需要记录哪些事情正成为讨厌的干扰，偷走了我们给主的时间。当我们意识到不需要仅仅因为随身带着手机就必须接电话（即使在祷告时也是如此），这种感觉是解脱的。我们需要能够自律关掉它们，而不是总是把它们当成哭泣的新婴儿一样对待。（我个人不喜欢手机，因为人们往往认为别人只要带着手机就必须一直接听电话或短信。）


    通常，有些人以干扰的形式受到灵性注意力缺失的影响，是因为时间纪律和时间管理不善。圣经告诉我们，我们要明智地使用时间，“要爱机会，因为现今是邪恶的”（以弗所书
    5:16 NASB）。这意味着我们要对抗分心。干扰形式的灵性注意力缺失的问题在于，它占据了本可以产生与神满足的灵性行的行的能量。这就是为什么我们被要求关注我们的时间以及它是如何被使用的。


    正如我们所看到的，如果我们愿意记录那些让我们分心并偷走我们时间的事情，干扰很容易解决。这通过适当的时间管理和建立正确的优先级来实现。电脑、手机、电视和其他现代便利品如果我们不小心，实际上可能会变成不便。它们可以是令人愉快的，但我们需要注意它们如何影响我们的灵性生活。它们是在帮助我们，还是在通过变成失控的干扰来阻碍我们，将我们的灵性生活置于脑后？


    我们需要记录的另外一点是由于这些不受欢迎或不需要干扰，我们被偷多少时间。如果我们失去的时间非常多，我们可能需要考虑如何更好地规划我们的每天和每周——确保我们有意识地安排、优先考虑并守护神的事物。我们越有组织、越有序，干扰就越难让我们偏离轨道。最后，有组织会导致健康的灵性生活，并有助于克服灵性注意力缺失。


    你可能在想：但我尝试了其中一些方法，我仍然很分心。我觉得灵性注意力缺失正在主宰我的生活。如果你是这样，请记住一点：你必须继续经营你的灵性生活，拒绝放弃。正如我在整本书中强调的，你的心必须参与到你的灵性追求中。这归根结底取决于你真实的内心检查和承诺。如果你想将灵性注意力缺失和干扰控制在范围内，这一点尤其真实。如果你想改变（你猜对了！）这将要求你不半心吊子！你的心态度和承诺在赢得对抗灵性注意力缺失的战斗中至关重要。


    我在生活中发现了将心投入神的事物中的重要性。在侍奉神的 255 多年里，我注意到当我祷告或读圣经感到分心时（这不时发生），通常是因为我是半心焉焉地面对这段时间的。然而，一旦我通过简单的内心调整和时间管理来记录它，问题就得到了解决，我的生活恢复了应有的秩序和平衡。


    让我给你一个例子，说明我所说的将心投入某事而不分心。耶稣知道在不分心的情况下离开祷告的重要性。人们经常看到他离开人群和不断拉扯他的许多干扰，以便与父相处。“他离开他们，退到旷野里去祷告”（路加福音
    5:16）。我决定效法主的榜，离开去祷告。


    ## 我的灵修体验


    我开始时非常好，因为灵性肾上腺素开始起作用，我决定为耶稣受苦。我已准备好与神相处，并在木屋里度过周末。我决定带上的东西只有衣服、睡袋、圣经、笔记本和水。我想，这些将是我灵性生活中最好的日子。对吗？错了！


    我起初祷告得很长、很努力且虔诚。我读了几个小时圣经，直到我开始变得躁动。我发现自己不断站起来看向窗外，出去一会儿，然后回到室内面对更多随我祷告之旅的灵性注意力缺失症状。我躺下，站起来，走着祷告，然后跪着祷告。

    '
- fmt: '

    Does this story sound familiar in your spiritual life? If it does, I encourage
    you to take note of things that may be trying to pull you from needed time with
    God. I often try really hard in my prayer times to take note of possible distractions.
    I do this by choosing to turn off my phone, my computer, and outside distractions,
    and focus solely on the Lord, putting my whole heart and attention to what I am
    doing.


    Let’s look at what David said about his pursuit with God and how he dealt with
    distractions. He gave us a clue of what will help us to avoid distractions.


    > With my whole heart have I sought Thee: O let me not wander from Thy commandments.
    Thy word have I hid in mine heart, that I might not sin against Thee (Psalm 119:10-11).


    David made a clear connection between having a focused heart and not being distracted.
    He said this was a vital step so he could seek God with his whole heart. It would
    then, in return, help him not to wander or be distracted. He also mentioned the
    importance of the Word of God in keeping him focused. This is an important thing
    to implement in our lives and is helpful for dealing with Spiritual A.D.D.


    We can pray the Word of God out loud to help us better focus and not become distracted.
    When we speak the Word of God out loud by reading, memorizing, or praying the
    Word, it does minimize distractions. The Bible is so powerful that it actually
    engages us when we speak it. There is something about our ears hearing us speak
    the Word of God out loud that has powerful results and will keep us focused. If
    we will give it a try or do it more often, we will see amazing results!


    ### The Needful Thing


    As I mentioned before, distractions affect everyone differently and are different
    for everyone. Sometimes distractions are a result of being too busy. It may not
    be bad or evil things that are keeping us busy, but they still limit us in spiritual
    things. Parenting, school, jobs, recreation, hobbies, sports, leisure—the list
    can go on and on—can keep us busy and can get us distracted from spiritual things.
    If we don’t establish some kind of order with them, these things will further
    promote Spiritual A.D.D. They aren’t evil distractions, but we have to consider
    how they are affecting our spiritual lives. This is an important step if we really
    want to change and not become distracted from having a healthy spiritual life
    with God.


    The danger for all of us is to fall prey to the busyness of life so that we hinder
    our spiritual walk, thinking we are doing OK. This is what happened to a woman
    named Martha in the Bible, who became distracted by her own busyness. She thought
    she was doing the right thing when Jesus came to dinner at the house where she
    and her sister, Mary, lived. Martha was busy getting everything ready and perfect
    while Mary sat at Jesus’ feet listening to Him.


    > Her sister, Mary, sat at the Lord’s feet, listening to what He taught. But Martha
    was distracted by the big dinner she was preparing. She came to Jesus and said,
    “Lord, doesn’t it seem unfair to You that my sister just sits here while I do
    all the work? Tell her to come and help me” (Luke 10:39-40 NLT).


    Yet, the Lord was not impressed with Martha’s busyness, her choice to be distracted
    rather than spend time with Him. What she was doing wasn’t necessarily bad or
    evil, but it wasn’t needful at that time. Distractions can be good or bad, but
    nevertheless, they are distractions that affect our time with the Lord. Martha
    had a good distraction—she desperately wanted to serve the Lord properly by getting
    everything just right while Jesus visited her house. The problem was she got caught
    up in those sideshow distractions. She took her eyes off the Lord, just like Peter.


    In contrast, her sister, Mary, got the Lord’s attention because she was determined
    to focus on Jesus and not be distracted. She wasn’t going to let distractions
    pull her from her “time with Jesus.” We need to ask ourselves if distractions
    are pulling us away from spending time with the Lord like they were with Martha.
    It is obvious from this story that Jesus wants to be the highest, most important
    priority of our lives and days. We know this by the fact that He brought attention
    to Martha’s distraction and failure to make Him her priority.


    > And Jesus answered and said unto her, Martha, Martha, thou art careful and troubled
    about many things: but one thing is needful: and Mary hath chosen that good part,
    which shall not be taken away from her (Luke 10:41-42).


    It is so easy, when dealing with Spiritual A.D.D., to become like Martha—distracted
    and easily pulled from spiritual things. Have you ever noticed how many distractions
    try to raise their ugly heads the moment you determine to spend time with God
    or get serious about your spiritual walk? As mentioned, you can also allow good
    things to become distractions, such as your family, finances, work, favorite programs,
    and hobbies, to name a few. These are important, however, if they are wrongly
    prioritized, they can become the most important things in your life, making your
    time with God less important.


    That day at Martha’s house, Jesus wanted her undivided attention; He wanted to
    be her priority. His desire hasn’t changed. What would have happened if Martha
    had been more focused on spending time with the Lord instead of her preparations?
    She would have been more freed up to spend time with the Lord, and she wouldn’t
    have been corrected by Him.


    Jesus said that one thing is needful or should be the highest priority in our
    lives—spending time with Him and not being distracted. We have to watch and not
    allow Spiritual A.D.D. to take away our time with Him. The things we do every
    day can be needful in our minds. However, the question we need to ask ourselves
    is Are they taking a greater priority than seeking first the Kingdom of God and
    His righteousness? (see `Matt. 6:33`). Jesus was showing us that when it comes
    to God and our spiritual walk, we must make God our highest priority. This is
    why King David said it was one thing that he desired.


    > One thing have I desired of the LORD, that will I seek after; that I may dwell
    in the house of the LORD all the days of my life, to behold the beauty of the
    LORD, and to enquire in His temple (Psalm 27:4).


    David shows us in this verse something that will help in overcoming Spiritual
    A.D.D. It is revealed in that verse as being one thing! This speaks of time with
    God, which is the most important thing that we must make priority. It is exactly
    what Jesus said to Martha was the most needful thing in her life—desiring God
    above all else and not becoming distracted from Him. God also gave Joshua this
    instruction in the Bible, telling him to meditate on the Lord and the Scriptures
    both day and night.


    > Do not let this Book of the Law depart from your mouth; meditate on it day and
    night, so that you may be careful to do everything written in it. Then you will
    be prosperous and successful (Joshua 1:8).


    When you truly love the Lord, you will want to please Him and make Him a priority.
    Why not try scheduling into your day regular times to talk with God and read and
    meditate on Scripture? You will be glad you did because success and blessings,
    as this Scripture says, will come knocking on the door of your life!

    '
