    他说了那句奇妙的话——那是我不想听到的那。他说：“汉克，你在这里大吵小闹做什么？”我知道主是在引用我们一直在看的《马可福音》第 5 章的一节经文，当时雅鲁比的女儿去世了，人们正聚起一个非常嘈杂、情绪化的场面。“他进来，就对他们说：你们为什么大吵小闹，哭泣呢？……”（马可福音
    5:39）。我个人还没见过任何人使用 `ado` 这个词。但我知道主对我指的是什么，以及它在现代术语中意味着什么。今天，我们可能会对某个大吵小闹的人说：“你为什么要在这里惊慌失措或如此激动呢？”


    这正是我当时在做的事情！我带着恶劣的态度、疲惫和一种真正的失败心态在闹腾。我不认为我生活中的事情正在顺利进行，我对此产生了一些情绪。当我们觉得自己正在处理“灵性多动症”（Spiritual
    A.D.D.）的症状时，这就是危险所在。我们可能会开始诉诸大吵小闹！有时我们认为闹腾或在灵性的麻木中徘徊，会以某种方式引起神的注意，或者让问题自行消失。


    然而，我学到我们必须像耶稣那天在雅鲁比家里所做的那样。他必须面对这种喧闹。他通过让所有那些大哭大闹、充满不信的人离开来这样做。他们以一种轻视和嘲弄的方式嘲笑耶稣。他们坚信复活这个女孩是行不通的，他只是在浪费时间。然而，主没有让这些事情分心，让他取得神迹般的突破。


    > 他们就笑他他。他把他们都赶出去，就领着女孩的父亲、母亲和和他同在的人，进了那女孩躺着的地方（马可福音 5:40）。


    主应对这种喧闹表现的方式，正是我们需要对待“灵性多动症”的方式如模一样。他面对了它，不容忍它，并把它赶出房子。这正是我们需要做的！我们不能只是忽视它、抱怨它，或者陷入情绪化。我们必须在今天决定站起来，去看到自己正享受着充满灵性活力和成果的灵性生活。我们需要像耶稣对待那些大吵小闹的人那样对待他们；他向他们指了离开的门。我们需要下决心，“灵性多动症”必须离开我们的生活！当我们这样做时，我们将看到自己的灵性生活像雅鲁比的女儿一样活过来！我们必须愿意为此努力，并像彼得那样推自己得更深。


    如果你愿意像耶稣一样拒绝放弃，并在与神的道路上继续前进直到你看到结果，你就会发现你一直在寻找的东西。我鼓励你站起来，再次尝试，并且：“这里没有同情会！”我鼓励你继续抵抗放弃或自怜的诱惑。如果你正在与“灵性多动症”作斗争，请建立一项
    `no ado`（不喧闹）政策！如果你这样做，我确定你的祷告生活将会奏效，你的灵性生活将重新充满活力。

