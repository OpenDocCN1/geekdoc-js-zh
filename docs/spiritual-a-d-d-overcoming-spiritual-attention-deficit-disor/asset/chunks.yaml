  trans: '

    为了让我们能够成功战胜属灵 A.D.D. 并回到充满救恩喜乐的生活，我们必须愿意停下来，调整呼吸，并审视自己的属灵方向和动机。这可能需要我们改变方向。对于那些可能正属灵
    A.D.D. 困扰并感觉自己陷入了属灵循环——一个永远无法到达理想属灵目的圈的人来说，确实如此。这可能会让他们感到孤独和迷失，而且这种感觉可能会持续很长时间。


    这听起来就像我和妻子在蜜月旅行途经 `Dallas/Fort Worth` 时，我们拼命迷路时的经历。这对新婚夫妇当时并不快乐，因为我们在那座城市里转了一整整天。说认真的，我们整了一整天都在迷路中绕圈！这是由于许多因素造成的。首先，我拒绝问路，因为我觉得自己认识地图。其次，我们在
    `Dallas` 的一个地方停下时，我忘记了钱包，不得不从 `Fort Worth` 开回去取。第三，我们不断地转错方向，在一个永完没了的圈子里转，这让我们显然变得非常愤怒和沮丧！我们在城市里漫无目的地游荡，一整天都需要改变方向。指示要求我们向北走，但我们一直在从东向西、又从西向东。我们哪里也没有去！


    这段关于我们蜜月旅行的故事我想起了以色列子民，他们也需要改变方向向北走。为了做到这一点，他们需要转身回到正确的道路上。他们在沙漠中漫无目的地游荡，绕着一座山转。主最终不得不告诉他们不要再绕那座被称为
    `Seir` 的山转了。“你们绕这山已经绕够久了。现在向北转。”（`Deut. 2:3 NASB`）神告诉他们，必须改变方向向北走。为什么要向北？从先知意义上来说，它正指向神宝座的方向。


    路西法（魔鬼）在堕落之前，曾关注过神所在的位置，那里在北方，或说是天上（参见 `Isa. 14:13`）。北方在先知意义上也代表将神作为我们的焦点，而不是在属灵生活中转圈子。以色列子民的问题在于，他们对多年前上帝访问过的那座山感到安逸。他们对那里太熟悉了，以至于神告诉他们要改变一下。他们因为看别的东西而正在失去初爱。他们开始私语、抱怨，并失去了神在将他们从埃及救赎出来时所赐给他们的救恩喜乐。


    属灵 A.D.D. 的运作方式是一样的。它让你偏离轨道，你开始仅仅是维持现状、游荡，带着一种像以色列子民那样无法到达理想目的地的感觉。神想要成为他们的焦点和爱。他不希望他们仅仅生活在一种山顶的体验中，而却并不真正认识祂。


    尽管这听起来很愚蠢，就像我和妻子在 `Dallas` 以及旷野中的以色列子民一样，我们都可能因为属灵 A.D.D. 而在属灵生活中漫无目的地、愚蠢地游荡。我们都可能在属灵上陷入定式，一次一次重复同一个问题。我们开始在属灵上空转轮胎，没有取得什么成就，我们甚至开始失去救恩的喜乐。有些人困于试图抓住过去的某个属灵时刻或经历，却失去了了当下的喜乐。


    这就是发生在以色列子民身上的事情。他们执着于自己的属灵经历——当神下山访问他们时（参见 `Exod. 19:16-20`——但他们并没有履行他们的属灵旅程，去享受并抓牢神应给他们的。因此，他们习惯了转圈子，在沙漠中游荡，哪里也没有去。这并不是以色列历史上他们被困的唯一时刻。其他人在神从埃及和邪恶的法老那里救赎之后也失去了救恩的喜乐（参见
    `Num. 11:1-10; 14:1-4; 21:4`）。有些人想要回到埃及，他们开始抱怨、发怒、感到沮丧并想要放弃。他们开始失去神已经赐给并将要赐给他们的事物的喜乐。


    我们必须小心，不要变得像以色列子民一样——在属灵旅程中愤怒、沮丧、抱怨并想要放弃。这就是神告诉他们要向北走的原因，这也是祂告诉我们也要同样做的原因。如果我们真的想认真对待属灵
    A.D.D. 并回到救恩的喜乐，我们必须下决心不再转圈子、不再空转轮胎、不再在属灵上原地踏步。我们必须下决心改变我们的习惯、常规和方式。


    随着我们年龄的增长，这可能会变得困难，不仅在身体上，在属灵上也是如此。我们对改变、建议或任何违背我们信仰以及我们一直以来做事方式的事产生抵触。问题在于，我们可以变得停滞不前，并认定不会改变，即使我们知道应该改变。我们我们经常否认问题的存在，只为了证明自己是对的，并固守那些行不通且无法在属灵生活和与神相处的时间中产生结果的顽固做法。


    如果这听起来像你，那么我想是时候向北转走了。你呢？


    ## 改变你的习惯


    如果我们想改变方向以恢复救恩的喜乐，那么我们必须愿意改变习惯。布伦达和我在 `Dallas/Fort Worth` 迷路了一整整天，因为我的习惯是不问路。这是我拒绝调整习惯，导致了喜乐的失去。


    如果我们真的想抵制属灵 A.D.D.，我们必须愿意改变习惯。当我们这样做时，我们的属灵生活将向正确的方向发展，我们将重新找到喜乐。如果我们想要改变习惯，必须检查我们的日常常规。改变习惯需要改变我们的日常常规，有时还需要改变个人的舒适区。如果我们正遭受属灵
    A.D.D.，可能是因为生活中的某些旧习惯需要改变了。


    我们需要问自己这样的问题：我的日常常规中有多少是对神的追求？我是基督徒的见证吗？我向别人传道吗，还是经常对承认我是基督徒感到羞耻？读经和祷告是我日常习惯的一部分吗？这些问题很重要，因为我们每天选择做的事情会导致每天的心态，最终导致我们所创造的习惯生活方式。


    通过观察圣经中一个生来残疾人的例子，我们可以看到每天在生活中建立正确习惯是多么重要。


    ```

    有一个生就瘸腿的人被人抬着来。每天他被放在殿门口，那门叫美门，好为了向进殿的人乞讨（行徒纪录 3:2 NLT）。

    ```


    这导致他过着不断乞讨食物的生活，并需要身体上的医治。他的日常常规在他的生活中形成了一种心态和习惯。如果没有神迹，他余生都将保持原样。对于那些拒绝改变习惯以变得更加属灵和连贯的人来说，可能会发生同样的结果。我们可能会在属灵上处于瘸废的状态。

