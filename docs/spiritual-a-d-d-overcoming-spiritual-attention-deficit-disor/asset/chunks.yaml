    our spiritual lives. Distractions are meant to get us to give our full attention
    to something else. This often occurs while we are pursuing the things of God.
    These distractions, whether good or bad, are meant to prevent us from doing what
    we want to or should be doing for the Lord. If we are experiencing these things,
    we are probably distracted and are dealing with a form of Spiritual A.D.D.


