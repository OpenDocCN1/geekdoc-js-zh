    body or soul because the spirit is created in the image of God. This is why it
    can often be a struggle to keep your soul and body involved in your spiritual
    pursuit. God is a spirit, and the way to connect with Him is from your spirit
    to His spirit—with your soul and body coming in line with your spiritual pursuit.
    Jesus even mentioned this when explaining how to worship God. “God is a Spirit:
    and they that worship Him must worship Him in spirit and in truth” (John 4:24).'
