    # Introduction


    Staying focused and committed while keeping your heart right and on God is important
    in your spiritual walk. It is so easy to get distracted, frustrated, or bored
    with the things of God if you are not wise. It comes down to spiritual focus,
    your heart, and your self-examination.


    This same principle is also seen when God brought His people to the waters of
    self-examination in a place called the “waters of Marah” (see Exod. 15:23). Israel
    had just celebrated a major victory over Pharaoh and his army, and they even sang
    about God’s great victory. However, there was a slight problem. This major victory
    was short-lived as it quickly turned into a session of complaining, murmuring,
    and lack of focus three days later. This happened because they had nothing to
    drink. The people complained that they were thirsty, and they began to take it
    out on Moses. So God made them “face themselves” by bringing them to the water
    for examination.


    ## Why did God bring them to the waters of Marah?


    It was to show them their hearts and spiritual condition before the Lord. Just
    like with the brazen laver and the waters of Gideon, God wanted to show them that
    they were losing focus on Him and becoming distracted. Their hearts were wrong,
    and God wanted them to see it by a simple test of self-examination. He brought
    them to the water because it showed a reflection of their attitudes and their
    hearts.


    Interestingly, the meaning of Marah in the Hebrew is “bitterness.” This was exactly
    how the Israelites were acting. Making them come, drink, and look into these bitter
    waters was God’s way of giving an illustrated sermon—showing them their spiritual
    condition! He was making them face themselves.


    ## The Word of God


    As we can see in these examples, God used water for self-examination, and He still
    uses water today. You might be asking, “Water? What water is He using today?”
    It is the water of His Word, which is used for self-examination and focus. “That
    He might sanctify and cleanse it with the washing of water by the word” (Eph.
    5:26). The Word of God is a measuring stick and standard by which you should live
    and gauge your spiritual progress.


    The Bible mirrors or reflects your spiritual walk and how you are to conduct your
    life as a Christian. It is meant to keep you focused and to reveal your heart
    like the examples we read of the waters of examination. Notice what the Book of
    James tells us about God’s Word being a mirror, or reflection, of our spiritual
    condition.


    > But prove yourselves doers of the word, and not merely hearers who delude themselves.
    For if anyone is a hearer of the word and not a doer, he is like a man who looks
    at his natural face in a mirror; for once he has looked at himself and gone away,
    he has immediately forgotten what kind of person he was. But one who looks intently
    at the perfect law, the law of liberty, and abides by it, not having become a
    forgetful hearer but an effectual doer, this man will be blessed in what he does
    (James 1:22-25 NASB).


    We can see from these verses that there are two types of people. The first type
    is those who hear the Word and don’t do it because they won’t let the Word be
    the true reflection or standard by which they conduct their Christian walk. The
    second type is those who are faithful to hear the Word and do it because they
    have examined themselves, and they are blessed as a result.


    This is often why people are distracted in regard to the Bible and seldom, if
    ever, read it. They don’t want to have face (like with the water) the things that
    are not right in their lives before the Lord. They don’t want to be held accountable
    to what God has said in His Word. We must come to the Scriptures and adjust our
    lives to the standards that God has placed in His Word. It is not just enough
    to hear or read the Bible; we must do what it says.


    People who don’t want to be honest before God or themselves about their spiritual
    condition won’t bother with self-examination and won’t see God’s Word as important
    for change. They will just be hearers only and not doers of the Word. This is
    often why some suffer in their spiritual lives.


    ## Cleansing and Transformation


    It is important to know that the Word of God is for cleansing. It is perfect for
    cleansing your life and adjusting your walk and attitude. This is why the enemy
    loves, as the Scripture says, to steal the Word of God from people’s hearts (see
    Mark 4:15), especially through the effects of Spiritual A.D.D. He knows that the
    Word of God is powerful and that it is your daily bread through which you grow
    spiritually. If he can convince you that the Word isn’t working or is boring,
    if he can get you distracted from its importance, then he can frustrate your spiritual
    walk greatly.


    The Bible is so powerful that it can be a mirror in your life and can be used
    for spiritual cleansing. The Word of God is used by the Holy Spirit as a mirror
    and a source of cleansing to convict and cause you to change your ways. This is
    what Jesus said in John chapter 15, “Now ye are clean through the word which I
    have spoken unto you” (John 15:3). This happens when you stay connected to the
    Lord through His Word and you start to bear fruit of Christian character.


    When you examine yourself by the Word of God, you need to take what you read and
    apply it. The brazen laver did the priests no good unless they applied the water.
    In the same way, the Word isn’t successful in overcoming Spiritual A.D.D. unless
    you apply it. It wasn’t enough for them to just look and do nothing; neither is
    self-examination useful without action.


    > This book of the law shall not depart out thy mouth; but thou shalt meditate
    therein day and night, that thou mayest observe according to all that is written
    therein: for then shalt make thy way prosperous, and then shalt have good success
    (Joshua 1:8).


    Go ahead, take that first step in overcoming A.D.D., and pick up your Bible. Take
    a moment to pray and reflect, no matter how you feel or how bad things have become.
    This isn’t self-condemnation but rather self-examination. It is for the purpose
    of facing yourself so you can make the adjustments and changes necessary to defeat
    Spiritual A.D.D. in your life.

