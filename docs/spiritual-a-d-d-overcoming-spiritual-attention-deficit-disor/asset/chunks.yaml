  trans: '


    主在这一节经文中指的是救恩后的第二次经历，被称为圣灵的充满或圣灵的洗。。这是一条力量之河，当你充满祂的灵并属灵祷告时，它就会从你身上流出来。这是你手中非常有力的工具，可以让你生活重新重新顺畅起来，并帮助你回到拯救的喜乐！如果你正感到“灵性注意力缺失”（Spiritual
    A.D.D.）的影响，或者只是觉得像旧水泵一样生锈，事实尤其如此。如果这听起来像你的现状，那么鼓励你，是时候开始给你的水泵启动，让你与神的相处再次恢复顺畅了！


    让我提醒你如何让事情重新顺畅，让这条力量之河从你身上流出。我确信，这将让灵性注意力缺失难以附在你的身上，也不会让你失去那份珍贵的拯救之喜乐！如果你在祷告生活中遇到挣扎，或者不想祷告，你可以花额外的时间针对性地属灵祷告。属灵祷告会在灵上造就你。“亲爱的，你们要在至圣洁的信上造就自己，用圣灵祷告”（犹大书
    20）。正如这节经文所说的，如果你觉得属软弱，神已经提供了可以造就你、让你生活重新恢复顺畅的方法。


    属灵祷告是如此强大，因为它就像为你的属电池充电，特别是当世俗事物在消耗你时。如果你正在与灵性注意力缺失作斗争或正在失去拯救的喜乐，那么让我用一件事来鼓励你。做一个对你大有远意义的小练习怎么样？尝试属灵祷告五分钟——在那五分钟里里，把你的整个灵、魂、体都投入其中。每天都这样做，直到你准备好增加时间。也许下周你把时间增加到
    10 分钟。关键在于改变并不断增加，直到你的基督徒生活开始产生稳定的流量。你会发现不一样的！你准备好花时间来练习了吗？如果你愿意，你将会发现这会防止你忽视你的拯救，并挫败灵性注意力缺失。看着你对神的饥渴如何增加，喜乐如何回到你的拯救中。是时候让一切再次重新恢复顺畅了！


    ## 培养属灵饥渴


    有时，我们失去拯救的喜乐，是因为灵性注意力缺失导致我们失去了属灵的饥渴。当这种情况发生时，我们开始对属灵的事物失去胃口。我们有时甚至开始渴望其他对我们没有好处的东西，这些东西甚至会增加属灵上的重担。


    所以，如果你是这种状态，该怎么办呢？首先，你需要开始一个所谓的“属灵饮食计划”，以找回你的属灵饥渴和胃口。你可以这样做的一种方法是将主放在你面前。“我常将耶和华放在我面前；祂在我的右边，我就不震动”（诗篇
    16:8）。


    换句话说，你像对待尊贵的客人一样，为祂设定并留出一个特别的地方。我在灵修时做过的一件事，就是字面上为为主预留一个地方来与我见面。我并不是想听起来很奇怪，而是提到一件能带回喜乐到你拯救中的事。我曾多次为主专门指定了一把椅子，我对着祂说话，仿佛祂就坐在我的面前。每当我这样做某些时刻，我的整个祷告场所都充满了祂同在的感电。我想鼓励你找到适合自己的方法。关键是要让主对你来说是真实的！也许可以尝试像我一样为主预留一个特别的地方。永远将主放在你面前的第一位是在你的心里！


    当你将主放在你面前时，结果将显而易见；你会看到拯救的喜乐回归，并开始再次对神产生饥渴。将主放在面前是防止失去拯救喜乐极极方法。它还能帮助你养成更好的属灵饮食习惯，从而促进属灵饥渴。你越是吃某样东西，就越会渴望它。在神的事上也是如此。你越是吃神的事物，你对祂就越饥渴，就越渴望属灵的事物。


    这在我减肥时发生过。我戒掉了甜食，只吃有营养的食物。问题是，在相当一段时间内，我的胃口和味蕾渴望糖分，而那些对我更好的东西似乎像是折磨，味道糟糕极了！大多数时候，我一直都在吃甜食而忽视了健康食物。我训练我的身体喜欢甜食，并渴望营养不的食物。我本质上养成了对甜味而非营养食物的偏好！


    同样的原理在属灵事物上同样适用。我们失去属灵饥渴也可能阻碍我们获得属灵的突破。吃错误的事物会导致我们失去属灵饥渴。当我们不吃属灵的事物时，我们就失去了属灵的胃口，只渴望吃肉体。如果我们感到正因为灵性注意力缺失而失去饥渴，该如何增加属灵饥渴呢？这里有一些属灵饥渴计划中可以考虑的有用建议。


    ### 如何培养属灵饥渴


    1. 进行属灵饮食——这需要心思和心的改变。“不要效法世界，只要心意更新，就可以叫事事变化……”（罗马书 12:2）。当你这样做时，你的饥渴就改变了！

    2. 丢弃垃圾食品和你的甜瘾，控制你的欲望——从属灵上说，这可能是世上你一直渴望但需要做的事物。“不要爱世界……”（约翰书 1:15）。

    3. 改变你的食物选择，并在饮食上保持纪律——选择吃属灵的事物，而不是在世的事上过饱（参见加拉太书 5:16）。

    4. 在属灵饮食中培养一致性和纪律——计划你吃神的话语的时间。

    5. 在饮食计划中对他人负责——通过圣餐、主契、祷告和神的事物与基督的身体一同进餐（参见使徒行传 2:42, 46）。

    6. 优先排序并简化你的生活——通过除去不必要的负担来坚持你的饮食计划，并勤于操练你的灵，先寻求神的国（参见马太福音 6:33）。

    7. 盯住奖赏——保持良好的态度并感恩，专注于你终极的目标，即与神成功的相处以及对祂的新饥渴（参见哥罗西书 3:2；以赛亚书 55:1-3）。

    8. 回到初爱——培养属灵饥渴需要回到你与主初爱的日子，去做那些让你对祂保持饥渴的事（参见启示录 2:4）。

    9. 再往前一步——逼迫自己改变属灵饮食习惯。设定小目标并做出小小的改变（参见标记福音 14:15）。

    10. 每天吃神和祂的话语——建立每天祷告和读读神话语的常规，持守你们的拯救（参见腓立比书 2:12）。


    所以，如何？你觉得这个属灵饥渴计划是一个挑战吗？你准备好让你的属灵生活重新顺畅起来，找回你曾经对神的饥渴了吗？你是否决定开始一种由属灵事物组成的饮食？如果你决定了，那么你正朝着正确的方向前进，以克服生活中的灵性注意力缺失，并回到拯救的喜乐！


    '
- fmt: '

    In order for us to successfully defeat Spiritual A.D.D. and return to lives full
    of the joy of our salvation, we will have to be willing to stop for a moment,
    catch our breath, and examine our spiritual direction and motives. This may require
    us to change our direction. This is true for some who may be dealing with Spiritual
    A.D.D. and feel like they are going in a spiritual cycle, a circle in which they
    will never reach their desired spiritual destination. This can leave them with
    a lonely and lost feeling that may persist for a long time.


    This sounds like what happened to my wife and me when we were traveling through
    `Dallas/Fort Worth` on our honeymoon and were desperately lost. This newly married
    couple wasn’t feeling very joyful because we drove around that city the whole
    day. Seriously, for the whole day we drove around lost! This was due to many factors.
    First, I refused to ask directions because I thought I knew the map. Second, I
    forgot my wallet when we stopped at a place in `Dallas` and had to drive back
    from `Fort Worth` to get it. Third, we kept taking the wrong turns, going in a
    never-ending circle, which made us visibly upset and frustrated! We were wandering
    aimlessly in the city and needed to change our direction the whole day. The directions
    called for us to go north, but we kept going east to west and west to east. We
    were not getting anywhere!


    This story of our honeymoon trip reminds me of the children of Israel, who also
    needed to change their direction and go north. In order for them to do this, they
    needed to turn around and get back on the proper path. They were wandering aimlessly
    in the desert, circling a mountain. The Lord finally had to tell them to stop
    going around the same mountain, called `Seir`. “You have circled this mountain
    long enough. Now turn north” (`Deut. 2:3 NASB`). God told them they had to change
    their direction and head north. Why north? Prophetically speaking, it was pointing
    them in the direction of God’s throne.


    Lucifer, the devil, before he fell, drew attention to the location where God is
    seated, which is in the north, or the Heavens (see `Isa. 14:13`). The north also
    speaks prophetically of looking to God as our focus and not wandering in circles
    in our spiritual lives. The children of Israel’s problem was that they got comfortable
    with the mountain where God had visited them all those years before. They became
    so familiar with it, in fact, that God told them to change it up. They were losing
    their first love by looking to something else. They started murmuring, complaining,
    and losing the joy of their salvation, which God gave them in delivering them
    from Egypt.


    Spiritual A.D.D. works the same way. It gets you off course, and you start just
    maintaining, wandering, with the feeling of not reaching your desired destination,
    like the children of Israel. God wanted to be their focus and love. He didn’t
    want them to just live in a mountaintop experience, all the while not really knowing
    Him.


    As silly as it seems, like my wife and I in `Dallas` and the children of Israel
    in the wilderness, we can all wander in our spiritual lives aimlessly and foolishly
    because of Spiritual A.D.D. We can all get stuck in a rut spiritually and go around
    the same problem again and again. We start spinning our spiritual wheels, not
    accomplishing much, and we even start losing the joy of our salvation. Some get
    stuck trying to hold on to a spiritual moment or experience of the past without
    the joy of one in the present.


    This is what happened to the children of Israel. They were holding on to their
    spiritual experience— when God came down on the mountain to visit them (see `Exod.
    19:16-20)—but they were not fulfilling their spiritual journey to enjoy and take
    hold of what God had promised them. So they got used to going around in circles,
    wandering in the desert, and not going really anywhere. This wasn’t the only time
    in Israel’s history that they got stuck. Others lost the joy of their salvation
    through God’s deliverance from Egypt and wicked Pharaoh (see `Num. 11:1-10; 14:1-4;
    21:4`). Some wanted to go back to Egypt, and they started complaining, getting
    mad, feeling frustrated, and wanting to quit. They began losing the joy of what
    God had and would give them.


    We have to be careful we don’t become like the children of Israel—mad, frustrated,
    complaining, and wanting to quit in our spiritual journeys. This is why God told
    them to go northward, and it is why He’s telling us to do the same. If we really
    want to get serious about Spiritual A.D.D. and returning to the joy of our salvation,
    then we have to get determined about not going around in circles, spinning our
    wheels, but going nowhere spiritually. We have to be determined to change our
    habits, routines, and ways.


    This can be difficult the older we get in life, not only physically, but also
    spiritually. We become resistant to change, advice, or anything that goes against
    what we believe and how we have always done things. The problem is we can become
    stagnant and determined that we aren’t going to change, even if we know we should.
    We then often deny there is a problem, just so we can be right, and we hold on
    to our stubborn ways that aren’t working and yielding much result in our spiritual
    lives and time with God.


    If this sounds like you, then I think it’s time to go northward. How about you?


    ## Changing Your Habits


    If we want to change our direction to restore the joy back to our salvation, then
    we have to be willing to change our habits. Brenda and I were lost the whole day
    in `Dallas/Fort Worth` because it is my habit not to ask directions. This is my
    refusal to adjust my habit, which led to losing our joy.


    If we really want to resist Spiritual A.D.D., then we have to be willing to change
    our habits. When we do, our spiritual lives will start heading in the right direction,
    and we will find joy again. If we want to change our habits, we must first examine
    our daily routines. Changing our habits will require a change in our daily routines
    and, at times, our personal comfort. If we are suffering from Spiritual A.D.D.,
    it could be because some old habits in our lives need to change.


    We need to ask ourselves such questions: How much of my daily routine consists
    of a pursuit of God? Am I a Christian testimony? Do I witness to others about
    the Lord, or am I often embarrassed to let anyone know I am a Christian? Are Bible
    reading and prayer a part of my daily habits? These questions are important because
    the things we choose to do daily often lead to daily mindsets, which ultimately
    lead to a lifestyle from the habits that we have created.


    We can see how important it is to set the right habits in our lives daily by looking
    at an example of a man in the Bible who was born crippled.


    ```

    A man lame from birth was being carried in. Each day he was put beside the Temple
    gate, the one called the Beautiful Gate, so he could beg from the people going
    into the Temple (Acts 3:2 NLT).

    ```


    This resulted in him having a continued life of begging for a daily handout and
    needing a physical healing. His daily routine formed a mindset and habit in his
    life. Outside of a miracle, he would stay the same for the rest of his life. The
    same result can happen for those who refuse to change their habits to become more
    spiritual and consistent. We can be left in a spiritually lame condition.

    '
