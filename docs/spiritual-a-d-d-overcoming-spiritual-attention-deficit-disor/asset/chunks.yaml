    > > So Gideon took the men down to the water. There the LORD told him, “Separate
    those who lap the water with their tongues like a dog from those who kneel down
    to drink.” Three hundred men lapped with their hands to their mouths. All the
    rest got down on their knees to drink. The LORD said to Gideon, “With the three
    hundred men that lapped I will save you and give the Midianites into your hands.
    Let all the other men go, each to his own place” (Judges 7:5-7 NIV).


    God brought a separation through the way they drank water. It sounds odd, doesn’t
    it? What was God up to? God was revealing which soldiers were focused, committed,
    and fervent about their trust in Him. Any distractions, lack of focus, procrastination,
    or fear would have dangerous consequences. God needed those who would be focused.


    This same principle will work in defeating Spiritual A.D.D. in your life today.
    What was the difference between the 9,700 who were drinking the water kneeling
    down and the 300 who drank the water lapping like a dog, cupping their hands and
    bringing it to their mouths? It was about the heart, and it revealed who was and
    who wasn’t focused and committed. The ones who knelt down to drink had to put
    their faces in the water. This meant they would have to take their eyes off the
    enemy and become distracted by the blessing of the water.


    Unfortunately, this is where many people live today. They take their eyes off
    God and even off the enemy to have a moment of drinking up all the blessings in
    life. Yes, they looked into the water, but it wasn’t for self-examination but
    rather self-gratification, and they completely lost their focus and purpose. This
    is exactly how Spiritual A.D.D. works because it gets you off your focus and purpose
    by making other things look more gratifying, interesting, and appealing than spiritual
    things. As a result, you lose focus and fall prey to the enemy—not necessarily
    the devil, but the enemy of Spiritual A.D.D. Sadly, this is where some live; they
    base their spiritual lives solely on what is in it for them, on their needs and
    their feelings, and they completely lose sight of the spiritual tasks at hand.


    The 300 who were chosen in Judges 7 lapped like a dog, putting their hands like
    cups up to their mouths to drink. This spoke of true focus and heart; they were
    able to enjoy blessings without losing focus or interest, especially on spiritual
    things. Remember, it would take a supernatural act of God to defeat a multitude
    of an army with only 300 men! They had a warrior mentality that kept their eyes
    on the enemy and that would forge through any challenge.


    This is a beautiful picture of how we should handle things in this world. Sure,
    we can enjoy the rich blessings that this life provides, but we must not let the
    blessings put our spiritual lives and spiritual things out of focus! In the same
    way, we must keep our hearts in check and committed to God. This helps us overcome
    and not be hindered by the effects of Spiritual A.D.D.'
