    Bible. Take a moment to pray and reflect, no matter how you feel or how bad things
    have become. I want to encourage you to take a moment of self-examination; do
    some soul searching, some inner reflecting on your spiritual walk, attitude, and
    pursuit. How are things really going? This isn’t self–condemnation but rather
    self-examination. It is for the purpose of facing yourself so you can make the
    adjustments and changes necessary to defeat Spiritual A.D.D. in your life.


    As you have you reflected for a moment and examined your life, you may have discovered
    that you are suffering from some of these symptoms and need to make some changes.
    If this is true, then you have passed the necessary part of the exam that starts
    with taking a self-exam. It is the start of a spiritual journey to the life and
    walk with God that you are crying out for. Continue to read and discover more
    truths to walking in a life of complete victory and satisfaction in Christ!


