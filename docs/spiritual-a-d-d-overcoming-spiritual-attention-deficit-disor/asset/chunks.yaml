    # Rising in the Spirit to Defeat Spiritual A.D.D.


    When you rise up in your spirit by stirring yourself up and speaking to yourself,
    your spirit gets stronger, and your body and soul will follow, resulting in the
    defeat of Spiritual A.D.D. in your life! The power to pray and win this tug-of-war
    between the spirit and the body and soul comes as you rise up in your spirit.
    Jesus too had to rise up in His spirit. He did this when He was in the Garden
    of Gethsemane with His disciples.


    > He taketh with Him Peter and James and John, and began to be sore amazed, and
    to be very heavy [He was feeling the pressure of the death He was about to face—there
    was so much pressure coming at Him in His soul]; and saith unto them, My soul
    is exceeding sorrowful unto death: tarry ye here, and watch. And He went forward
    a little, and fell on the ground, and prayed that, if it were possible, the hour
    might pass from Him (Mark 14:33-35).


    Jesus faced so much pressure that the Bible says He sweated great drops of blood
    (see `Luke 22:44`). He had to rise up in His spirit, or all hope would have been
    lost! You can imagine the pressure because the purpose for His life and all humankind
    would be lost if He failed to rise up in His spirit, submitting His body and soul
    when He prayed. He had to stay in a spiritual mindset and even resist being distracted
    by His disciples, who slept even though three times He asked for their help in
    prayer. He had to resist His soul and stay strong in His spirit for the will of
    God to be accomplished.


    > And He said, Abba, Father, all things are possible unto Thee; take away this
    cup from Me: nevertheless not what I will, but what Thou wilt (Mark 14:36).


    This is why Jesus said, “If possible let this cup pass from Me, yet not My will
    be done but Yours.” He was speaking to His Heavenly Father from His spirit and
    not letting His mind pull Him off course. His soul was trying to pull Him in a
    different direction than His spirit. Yet, Jesus rose up in His spirit, yielding
    to God’s purposes. He made His body and soul submit to His spirit, which was submitted
    to the will of God. The result was that He fulfilled the will of God for His life
    and for humanity.


    ## Winning the Spiritual Tug-of-War


    Jesus won the spiritual tug-of-war that we often face, which tries to pull us
    from our time of prayer. He won the battle that tries to come between the spirit,
    soul, and body. We can learn how to rise up in our spirits and not give in to
    the pressure from our souls by His example. This is how we can also win the battle
    that tries to rage against our spiritual lives through Spiritual A.D.D.


    If you rise up in your spirit, you will win the spiritual tug-of-war because the
    spirit is stronger than the soul and flesh. This is why the same principle that
    worked for Jesus in the Garden will work for you and will break off the symptoms
    of Spiritual A.D.D. When you understand how powerful your spirit is to dominate
    the rest of your person, you can then keep your mind from wandering, and you will
    begin to enjoy your spiritual life with God.


    > So I say, live by the Spirit, and you will not gratify the desires of the sinful
    nature. For the sinful nature desires what is contrary to the Spirit, and the
    Spirit what is contrary to the sinful nature. They are in conflict with each other,
    so that you do not do what you want (Galatians 5:16-17 NIV).


    You just need to learn to develop your spiritual life, making your soul and flesh
    submit to the things of the spirit.


    ## Symbolism of the Donkey


    This same principle can further be prophetically applied to us today as we look
    at the Scripture when Jesus rode into Jerusalem on a donkey (see `Luke 19:30`).
    Why did Jesus ride a donkey? Perhaps one reason was because the donkey represents
    our stubborn fleshly nature, our minds that want to wander and rebel against the
    things of God. It represents the carnal nature that must be submitted to the ways
    of God. The Bible says that people are born into the earth with natures like wild
    donkeys. “For vain man would be wise, though man be born like a wild ass’s colt”
    (Job 11:12). This means that we are born into this earth with a fleshly nature
    that is resistant to spiritual things and stubborn against God.


    This is why we need to be born again spiritually and continue to walk in the spirit
    and not fulfill the stubborn desires of our flesh. Jesus riding in on a donkey
    prophetically reveals to us that our flesh nature needs to submit to His Lordship
    and life in the Spirit. When we are submitted, we will always overcome the flesh
    that wants to resist spiritual things. We can see this in the fact that Jesus
    rode on a donkey that had never been ridden before.


    > Saying, Go ye into the village over against you; in the which at your entering
    ye shall find a colt tied, whereon yet never man sat: loose him, and bring him
    hither (Luke 19:30).


    Can you imagine trying to ride a wild donkey that had never been ridden? It would
    most likely kick, resist, and act stubbornly with the rider. This is indeed a
    picture of our stubborn souls and flesh that need to submit to the things of God.
    It also reveals to us the need for the Lordship of Jesus in our lives to help
    us submit our stubborn souls and flesh, which want to go contrary to the way and
    life of the spirit. This is the tug-of-war—the spirit against the flesh. Our spirits
    try to pull us into the things of God, and our flesh tries to pull us into the
    things of this world and away from God. This is exactly what Spiritual A.D.D.
    does.


    ## Practical Application of the Principle


    I have learned an important principle regarding winning at tug-of-war and enjoying
    a fulfilled life with God. Whatever we feed the most, making it the strongest,
    will ultimately win. To better illustrate this point, I will share a tug-of-war
    from my childhood. I wasn’t a very big kid, and there was this one kid whom my
    friends and I would challenge to a game of tug-of-war. He was bigger than all
    of us, so it was the little kids against just one big kid. We would pull and pull
    to no avail, and he would beat us every time because he was stronger, bigger.
    It really is pretty simple. If we feed on spiritual things, we will be spiritually
    strong! The opposite is also true. If we feed on fleshly, worldly, natural things
    and give little attention to our spiritual lives, we will lose the war every time.
    The more we feed on spiritual things and guard our minds, the easier it is to
    defeat the Spiritual A.D.D. that wants to pull us away, tugging at us.


    When we set our hearts and minds toward spiritual things, the result will often
    be a battle to stay focused, interested, and engaged. This is because of the tug-of-war
    going on between our spirits and our flesh. It comes down to the principle that
    whatever we feed the most will determine the direction of our spiritual lives.
    This is how Spiritual A.D.D. works to get us distracted, to get our minds wandering,
    to get us tired and procrastinating in order to keep us from reaching the place
    of spiritual strength.


    When your spirit is hungry for the things of God, you need to feed it. There is
    a healthy craving and lusting in your spirit. Have you ever felt the desire to
    pray, to shut off the television, or you just couldn’t wait until you got home
    to be with God? This happens because your spirit is lusting for spiritual things.


    > This I say then, Walk in the Spirit, and ye shall not fulfil the lust of the
    flesh.

