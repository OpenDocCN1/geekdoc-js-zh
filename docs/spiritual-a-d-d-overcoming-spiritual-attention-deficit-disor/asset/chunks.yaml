    where Lazarus was buried, knowing that He would raise him from the dead, and encountered
    a party scene— not one of celebration but of grief, sorrow, and blaming Him. This
    pity party scene was so bad that both of Lazarus’ sisters, Mary and Martha, tried
    to blame Jesus for their brother’s death. “Then said Martha unto Jesus, Lord,
    if Thou hadst been here, my brother had not died” (John 11:21). We can see that
    Martha was blaming Jesus while her sister Mary stayed in her house having a pity
    party. “Then Martha, as soon as she heard that Jesus was coming, went and met
    Him: but Mary sat still in the house” (John 11:20). Mary later blamed Jesus just
    like her sister.


    > > Then when Mary was come where Jesus was, and saw Him, she fell down at His
    feet, saying unto Him, Lord, if Thou hadst been here, my brother had not died
    (John 11:32).


    It is important to note that Jesus was friends with this family, yet He purposely
    didn’t join their weeping, sorrow, and display of unbelief. You might be saying,
    “Wait a minute, doesn’t the Bible say that Jesus wept in this same story?” That’s
    right; Jesus did weep in this story. “Jesus wept” (John 11:35). However, the better
    question to ask is, “Why did He weep?” Was it to join their pity party of blame,
    unbelief, and feeling sorry? No, He wept in regard to their display of unbelief
    and their commotion. “When Jesus therefore saw her weeping, and the Jews also
    weeping which came with her, He groaned in the spirit, and was troubled” (John
    11:33).


    Jesus saw them weeping, and He was troubled. This is not to imply that He was
    angry at their weeping; He was angry at why they were weeping. In other words,
    He saw something He didn’t like in the way they were weeping and carrying on;
    He became troubled and groaned in His spirit about it. This doesn’t sound like
    He was on board with their pity party, does it? What does it mean to be troubled
    and to groan in the spirit? What is the difference between Jesus who “wept” and
    the people who were “weeping”? To better understand the difference and why Jesus
    was troubled and groaned about it, we have to look more closely at the meaning
    of these words—groaned, trouble, wept, and weeping.


    Groaned in spirit is translated from the Greek word embrimaomai. It means to be
    moved with anger; to admonish sternly; to snort with the notion of coercion, springing
    out of displeasure, anger, indignation, antagonism; to express indignant displeasure
    with someone; and to charge sternly. It also means to snort like an angry horse,
    literally to “snort (roar) with rage,” which expresses strong indignation, i.e.
    deep feeling that is moved to sternly admonish.^([2](#index_split_016.html_filepos235928))


    Troubled is from the Greek word tarassó. It means to agitate back and forth, shake
    to and fro, trouble, and agitate, causing inner perplexity and emotional agitation
    from getting too stirred up inside and upset.^([3](#index_split_016.html_filepos236129))


    Wept comes from the Greek word dakrýo¯.^([4](#index_split_016.html_filepos236330))
    This is also from the Greek word dákry. It means a teardrop or to properly shed
    quiet actual tears, to weep silently with tears.^([5](#index_split_016.html_filepos236531))


    Weeping is the Greek word klaío¯.^([6](#index_split_016.html_filepos236732)) This
    means to properly weep aloud, expressing uncontainable, audible grief, audible
    weeping, and to sob, i.e. wail aloud. It is different from the word wept (dakruo),
    which, as we have seen, means to cry silently.


    Do you see the difference? Jesus wept (verse 35) in control of His emotions and
    spirit, shedding quiet actual tears, while the other people were weeping loud
    and fleshly tears (verse 33). Jesus’ “teardrop” and His properly shedding quiet
    tears, according to the definition, certainly implies the Lord’s heart and how
    He is touched with the feeling of our infirmities. Yet, what troubled Him, causing
    Him to agitate back and forth and be stirred up inside, like the definition says,
    was that the people were emotional and out of control, creating a scene—and not
    one of believing Him to raise Lazarus but of blame and unbelief! In other words,
    they were having a pity party that Jesus didn’t join. There is a difference between
    their weeping and moaning and the kind of mourning due to the loss of a loved
    one. Mourning is legitimate feeling of grief, but moaning is different—a complaining
    and “poor ole me” attitude on display.


    Some of these people weren’t mourning; instead they were moaning and carrying
    on, hoping they could move Jesus to intervene because nothing they did worked!
    Jesus responded by showing His anger and disapproval of their commotion (based
    on the definitions of groan and trouble). We can see from these definitions that
    Jesus was angry, moving His head back and forth like an angry horse snorting in
    defiance! Studying these words makes it very apparent that He didn’t approve of
    their display and He didn’t join their pity party!'
