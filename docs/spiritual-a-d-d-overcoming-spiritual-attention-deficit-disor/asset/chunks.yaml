  trans: '


    请注意下一节经文中亚伯拉罕的第一个反应是什么。这通常也是我们的反应：你要给我什么呢？


    > > 亚伯拉罕说：“耶和华主啊，你何用给我呢？我没有后裔，我家的管子就是大马士的以以以勒。”（创世记 15:2）


    向祂祈求东西并没有错，但如果上帝刚刚向我们显现并介绍祂自己，我们对他说的第一句话会是“你要给我什么？”吗？这听起来有点自私。我并不是说向神要东西是自私的，而是说我们更大的目标是先爱祂并与祂交通。上帝渴望我们把祂作为我们的焦点和重点，而不仅仅是我们从祂那里得到什么，尽管祂想要祝福我们。


    那天，当我询问上帝心里在想什么时，我意识到在那段时间祷告之后，祂有多想祝福我。当我进入祷告时，我的焦点和决心是不为自己向神要任何东西。相反，我只想知道能为祂做什么。我问祂心里想什么，祂想要讨论什么。神通过对我内心说话来回应，告诉我我那天对他内心的敏感带给祂多大的快乐。我们经常忘记神是一个位格。祂和我们一样有感情。祂心里有很多想要讨论的事情。


    当涉及到祷告时间和与神的关系时，如果我们对主的心和需要不敏感，我们就会花费大部分时间向神索要东西，而不是渴望与祂交通。当我们这样做时，我们就限制了祂向我们敞开心心的机会。请不要误解我。神确实想祝福我们，而且祂也以此为乐。祂确实告诉我们要祈求，并应许我们必得（参见
    `Matt. 7:7-8`）。然而，我的心意是我们应该对主和祂的心更加敏感和理解。我们经常将大部分关系及其成功建立在我们可以向神要多少东西以及从祂那里得到多少之上。


    亚伯拉罕在还名叫亚伯时，与神的第一次互动是接受。神当时在介绍祂自己，并准备与他立约。然而，亚伯拉罕的脑子里想的是接受，这从他对主的第一个反应中显而易见。在祂的介绍中，主确实提到祂将将是亚伯拉罕的供应者和补偿者。“亚伯拉罕，不要惧怕，我是你的盾牌，是你极丰的赏报，你的赏赐要极大”（`Gen.
    15:1 AMP`）。亚伯拉罕立即问神他能得到什么——我们可能都会这样做。然而，还有更重要的东西，它不仅在于一直地向神要东西，而在于将寻求和爱祂作为我们最高优先的重点和焦点。


    在祂最初的介绍之后，神继续祝福亚伯拉罕，然后将他的名字改为亚伯拉罕，并与他立约（参见 `Gen. 17`）。我们知道亚伯拉罕成为了神的朋友，因为神来与祂朋友亚伯拉罕讨论祂心里的事——所多和蛾玛城的未来。主等待与一个愿意倾听并成为祂朋友的人交谈讨论。神找到的人正是亚伯拉罕。“耶和华说：‘我要行的事的，向亚伯拉罕隐藏吗？’”（`Gen.
    18:17 NASB`）。神想与他讨论祂心里想的事。亚伯拉罕只需要做的就是让自己能够出来，就此事与主交通。如果祂这样寻找我们，这说明了我们与神的相处状态！


    像亚伯拉罕一样，我们可以克服过去，成为神的朋友。如果我们养成将寻求神作为最高优先的习惯，我们与神的关系就会畅通。祂会在我们开口之前就通过满足我们的需求来回应！将祂放在第一位也是一种重要的练习，它可以战胜灵性注意力缺陷（Spiritual
    A.D.D.），防止它占据我们与神相处的时间或属灵追求。如果我们尝试真正将与神的亲密关系放在优先，我们就能战胜灵性 A.D.D.。这次会真正有效，因为神将更积极地参与我们的生活，并使我们的生活进入适当的秩序和祝福中。当我们最重要的焦点是先事奉神时，要避免拖延、疲劳、分心、心神不定以及其他灵性
    A.D.D. 症状要容易得多。


    当我们心心真正奉献并致力于先与祂在一起并事奉祂时，我们就不会感到完成某些属灵常规之事的压力（这些常规通常更容易受到灵性 A.D.D.的影响，而不是专注于与神在一起的属灵生活）。这种自由培养了我们的属灵饥渴，并推开了可能影响我们的任何灵性
    A.D.D. 症状。它更新了我们与主之间的属灵亲密，使寻求祂变得更容易、更有回报。我们发展出了一种内在的火或骚动，让我们宁愿与神在一起胜过其他任何事——这对于克服灵性
    A.D.D. 至关重要。


    我想分享另一个与神相处的经历，它改变了我，并不断提醒我先与主亲密的重要性，而不仅仅是一种“只要给我”的心态。那天，我再次进入与主相处的时间，决定不向神要任何东西，而是要不停地崇拜祂。我告诉祂，我来不是为了任何东西，只是为了与祂在一起。


    当我早晨继续与神的崇拜和交通时，发生了一些奇妙的事情：祂回应了我。在我花了一些时间崇拜并与祂交流、提问并等待祂的回应后，祂对我内心说话。祂说：“Hank，我可以用什么来祝福你？”我知道祂想祝福我们，但那并不是这次时间的主题。


    '
- fmt: '

    We can learn a powerful principle from a pattern that Jesus established in His
    life, which works well to combat Spiritual A.D.D. On many occasions, He took with
    Him three of His disciples—namely Peter, James, and John—while he didn’t include
    the other disciples. Why did He allow only these three and not others in many
    of these experiences? I believe it had something to do with their prophetic purposes
    and destinies. We can see this in the definitions of their names. Let’s look at
    the Greek names of these three, Peter, James, and John, as well as their prophetic
    meanings. We can learn from these names some powerful prophetic applications that
    we can apply in our spiritual lives today to help us overcome Spiritual A.D.D.


    ### 1. Peter (Simon)

    His original name was Simon bar Jonah. Jesus renamed him `Peter`, or `Petros`
    in the Greek, meaning “a rock.”


    * **Prophetic application**—If we want to defeat Spiritual A.D.D., then we need
    to get around people who are rock solid in their faith and their walk with God.
    Peter also was given the keys of the Kingdom after a Kingdom revelation that Jesus
    was the Christ (see Matt. 16:18-19). This means we need to be around people who
    are Kingdom-minded also.


    ### 2. James

    He was the brother of John. His name in the Greek is actually `Iakobos`, or `Yaakob`
    in the Hebrew, which means “heelcatcher or supplanter.” This meaning of the name
    James here in the New Testament is the same as Jacob in the Old Testament. Jacob
    also wrestled with God in Scripture (see Gen. 32).


    * **Prophetic application**—To overcome Spiritual A.D.D., it is helpful to be
    surrounded by those who are spiritually determined, like Jacob was when he wrestled
    with God. This name definition of James/Jacob prophetically speaks of the need
    to be around people who can pray, intercede, and break through and who are godly.
    Their spiritual pursuit and determination can spark something in our spiritual
    lives to help us succeed.


    ### 3. John

    He was the brother of James and one of the “sons of thunder.” His name in the
    Greek means “Yahweh is gracious.” So, John is the gracious one. He is also the
    one who was seen leaning on Jesus’ chest at the last supper.


    * **Prophetic application**—Having people who are close to the heart of Jesus,
    like John was and like his name prophetically represents, helps us to add spiritual
    strength in our lives if we are dealing with Spiritual A.D.D. We need people who
    know God’s heart and who are intimate with Him, as John’s name prophetically indicates,
    as part of our lives to encourage us and help us grow in God’s grace.


    Now that we have discovered the meaning of their names and their prophetic applications,
    let’s see what else we can prophetically glean from these three in regard to our
    spiritual life with God. Here is what we can conclude from Peter, James, John,
    and the meaning of their names.


    If we are going to overcome Spiritual A.D.D. in our lives and get things working
    again, then we are going to need to get around godly people who have these kinds
    of characteristics. For example, it is important to have people who are like Peter’s
    name definition and what he prophetically represents. They bring a dimension of
    rock solid Christianity to our spiritual lives. They also understand Kingdom principles
    and live by them, helping to bring spiritual stability to those they are around.


    Surrounding ourselves with people like what Jacob prophetically represents is
    also vital for overcoming Spiritual A.D.D. We may need, from time to time, people
    who can pray, break through, and intercede to help us defeat it in our lives—people
    who will encourage us to keep seeking God no matter what we face.


    Finally, we need people in our lives who will be like what John prophetically
    represents. It is important to have those who know how to hear from God and are
    intimate with Him in their Christian walk. We find it both refreshing and helpful
    to be connected to those who lean on the heart of Jesus like John did.


    These prophetic applications from these names are vital for our spiritual walk
    today. Like the old saying says, “We are the company we keep.” Thus, it is helpful
    to have, prophetically speaking, a “Peter,” a “James,” and a “John” around us.
    We need those who can encourage us, pray for us, take us back to the Word of God,
    and help us to become more intimate with the Lord. Solid Christians (Peter), those
    who know how to pray and break through (James), and those who know and pursue
    God’s heart (John) will be three powerful pillars of strength in our spiritual
    lives!


    What these names represent is a spiritual three-fold cord that won’t be broken.
    Paul even referred to these three men as pillars to him and the Church as well.
    “In fact, James, Peter, and John, who were known as pillars of the church, recognized
    the gift God had given me…” (Gal. 2:9 NLT).


    It helps having these sorts of people around when you are struggling in prayer
    or need someone to help get you going again in your Christian walk. I believe
    Jesus knew the powerful benefits of having others whom you can draw spiritual
    strength and encouragement from. This is why He brought the disciples with Him
    to pray in the Garden of Gethsemane just before His crucifixion (see Mark 14:32-42).
    He wanted to receive strength from them. This is why He asked Peter, James, and
    John to go a little farther from the other disciples and pray with Him. However,
    they fell asleep on Him three times, and Jesus couldn’t count on them.


    #### Restoring the Cutting Edge


    Having the right people and applying these three prophetic pillars of “Peter,”
    “James,” and “John” to our spiritual lives is an important part of reviving our
    spiritual lives and then staying spiritually.


    I have learned, in the many years that I have been a Christian and in the ministry,
    the importance of being surrounded by the right people. I like to refer to this
    as the “lean on me” principle. This principle will help us to overcome Spiritual
    A.D.D. because, when we add this kind of dimension through building relationships
    with the right people, it becomes a pillar of strength to our lives.


    In the story of the man at the gate Beautiful, we see an amazing act. After this
    man was healed at the gate, he did something that has prophetic significance for
    us. He was very grateful that he was healed, and the Bible records what he did.
    He reached out and held on Peter and John.

