    > > Then Peter said unto them, Repent, and be baptized every one of you in the
    name of Jesus Christ for the remission of sins, and ye shall receive the gift
    of the Holy Ghost. For the promise is unto you, and to your children, and to all
    that are afar off, even as many as the LORD our God shall call (Acts 2:38-39).


    The requirement for being able to pray in the Spirit is that we first have to
    be saved as Christians (see John 3). Then there is an additional experience known
    as the baptism of the Holy Spirit, which gives us power (see John 7:37-39; Acts
    1:8). At the back of this book, I have included a prayer and instructions on how
    to receive this infilling for those who are Christians but have not received the
    baptism of the Spirit.


    This powerful tool God provided helps us defeat Spiritual A.D.D. because with
    it we are praying from our spirits. We aren’t letting our minds pull us from spiritual
    things but are connecting to God in our spirits. The beauty of this is that we
    can seek God both by praying with our understanding, as the apostle Paul teaches
    in First Corinthians, and in the spirit also!


    > > What is the outcome then? I will pray with the spirit and I will pray with
    the mind also; I will sing with the spirit and I will sing with the mind also
    (1 Corinthians 14:15 NASB).


    Praying in the Spirit, when done regularly, is an amazing way to keep you focused.
    It builds you up spiritually, aiding in the strength of your Christian walk. Helping
    you win the race of your mind, it is extremely powerful if you are suffering with
    the symptoms of Spiritual A.D.D. Rather than trying to focus on one thing you
    have to do or a number of steps that are helpful and important, you can simply
    focus on one exercise— praying in the Spirit—that will build you and reconnect
    you with God. It is a great way to get you back into the game spiritually. It
    helps you to put your foot down in the spirit and win that race of the mind. It
    is one way to help you “keep your feet”!


    Keep Your Feet


    What does it mean to keep your feet? “Keep your foot [give your mind to what you
    are doing] when you go [as Jacob to sacred Bethel] to the house of God…” (Eccl.
    5:1 AMP). This verse in the Amplified Bible says that you “keep your foot” by
    giving your mind, or attention, to what you are doing. This verse is telling you
    to stay focused and balanced, to hold your position, and to think through your
    thoughts and actions prayerfully. When you keep your foot in the things of God,
    you aren’t letting your mind wander and race all over the place.


    Discipline and action are required on your part to pull the reins on your mind
    by guarding your thoughts. You can take that determined step in your spirit to
    defeat Spiritual A.D.D. You just need to tighten things up and not let your mind
    take you on a journey into a path of Spiritual A.D.D.


    The Bible calls tightening things up in our minds and not letting them wander
    loosely “girding up” our minds. “Wherefore gird up the loins of your mind, be
    sober…” (1 Pet. 1:13). The word “girding” in this verse means to tighten, to take
    up slack, and to prepare our minds for action. “Therefore, prepare your minds
    for action…” (1 Pet. 1:13 NASB). Are we ready to prepare our minds for action?
    The verse continues by telling us how to do it—by staying alert and fixing our
    hope on the grace of God given to us. “…Keep sober in spirit, fix your hope completely
    on the grace to be brought to you at the revelation of Jesus Christ” (1 Pet. 1:13
    NASB). Sounds like keeping our feet, doesn’t it?


    Are you ready to win the race of the mind? Are you getting determined to put the
    reins on your mind and to posses your soul? Remember, you can win the tug-ofwar
    that wants to pull you into a life of Spiritual A.D.D. because you have the power
    of God in you! All Christians have that power available in their born-again spirits
    to bring their thoughts into order. We have been granted the ability to get results
    by praying both in the Spirit and with our understanding. This enables us to stand
    strong and “keep our feet” in whatever we do for the Lord. We can do it with all
    our might! This is the lasting joy and results that every true believer wants,
    especially a life that wins against Spiritual A.D.D. Be encouraged to win against
    it and to finish your spiritual race strong, victorious, and refreshed as you
    pursue Him. Don’t let your mind get in the way of your spiritual life; you have
    so many things provided by the Lord to help you win! Are you ready? Start pulling
    those reins!


    ![](images/00007.jpg)


    ENDNOTE


    > > > > [1.](#index_split_012.html_filepos103908) James Strong, The New Strong’s
    Exhaustive Concordance of the Bible (Nashville, TN: Thomas Nelson, 1991), Hebrew
    #1288.


    [Chapter Four](#index_split_006.html_filepos6014)


    [PAYING ATTENTION COSTS TOO MUCH](#index_split_006.html_filepos6014)


    > > Keep your eyes straight ahead; ignore all sideshow distractions (Proverbs
    4:25 MSG).


    Early one morning I headed to my prayer room to begin my time with the Lord. I
    had my Bible in one hand and my hot cup of coffee in the other. I turned the lamp
    on in my room, took a few sips from my coffee cup, and read a few Scriptures.
    However, across the room something kept catching my eye, distracting me. I got
    up and headed to that side of the room. There it was right before my eyes! I could
    hardly believe it! No, it wasn’t Jesus, an angel, or anything else spiritual,
    but rather it was a model train that I had been working on for a few days.


    Perhaps you are wondering, Why would you be distracted by a model train? I have
    had a love for model trains ever since I was a young child and have been an avid
    collector for years. I have been building my train layout for many years, and
    it’s something I really enjoy. In fact, I was enjoying it too much, and this routine
    of going to my prayer room and working on this train lasted for a few days. It
    seemed every morning for a few days, while I should have been praying, spending
    time with God, I would get distracted and get up and work on that train.'
