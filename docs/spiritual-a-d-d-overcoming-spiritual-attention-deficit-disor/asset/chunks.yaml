  trans: '


    这个故事在你的灵性生活中听起来熟悉吗？如果是，我鼓励你留意那些可能试图将你远离与神相处时间的事物。在祷告时，我经常非常努力地留意可能的干扰。我的做法是选择关闭手机、电脑和外界的干扰，完全专注于主，将整个心意和注意力投入到我正在做的事情中。


    让我们看看大卫是如何描述他对神的追求，以及他是如何处理干扰的。他为我们提供了一个帮助我们避开干扰的线索。


    > 我用全意寻找你，我的耶华，求你不要偏离你的律例。你的话已藏在我心里，免我得罪背你（诗篇 119:10-11）。


    大卫在专心的内心与不分心之间建立了清晰的联系。他说这是至关重要的一步，使他能够全意地寻求神。反过来，这也会帮助他不偏离或分心。他还提到了神的话语对他保持专注的重要性。这是我们生活中需要执行的一项重要事项，对于应对“灵性多动”（Spiritual
    A.D.D.）很有帮助。


    我们可以大声读出神的话语，帮助我们更好地专注，不分心。当我们通过朗读、背诵或祷告大声说出神的话语时，它确实能减少干扰。圣经是如此强大，当我们读出它时，它实际上在吸引我们。我们的耳朵听到自己大声读出神的话语，这会产生强大的效果并让我们保持专注。如果我们尝试这样做或频繁地这样做，我们将看到惊人的结果！


    ### 所需的事


    正如我之前提到的，干扰对每个人的影响不同，每个人面临的干扰也不同。有时，干扰是由于太忙导致的。让我们忙碌的未必是坏或邪恶的事，但它们仍然在灵性上限制了我们。育儿、上学、工作、娱乐、爱好、运动、休闲——这个清单可以一直列下去——都能让我们忙碌，让我们从灵性事务中分心。如果我们不对这些事情建立某种秩序，这些事情就会进一步促进“灵性多动”。它们不是邪恶的干扰，但我们必须考虑它们是如何影响我们的灵性生活的。如果我们真的想改变，并且不想在与神建立健康灵性生活时分心，这就是重要的一步。


    我们所有人面临的危险是陷入生活的忙碌中，从而阻碍我们的灵性成长，却以为自己表现得很好。这就是圣经中一个名叫马大拉的妇女身上发生的事，她被自己的忙碌分散了心神。当耶稣来她和妹妹马利亚住的家里吃晚餐时，她认为自己在做正确的事。马大拉忙于准备一切并力求完美，而马利亚坐在耶稣脚下听祂讲道。


    > 她的妹妹马利亚坐在主的脚前，听他的教训。马大拉忙于准备那顿晚餐，分心了。她来到耶稣面前说：“主，我的妹妹马利亚只坐在这里，我不做所有的事务，你不觉得公平吗？叫她来帮我吧”（路加福音
    10:39-40 NLT）。


    然而，主并没有对马大拉的忙碌留下深刻，也没有对她选择分心而不是与祂相处感到满意。她所做的并不一定坏或邪恶，但在那时并不是必要的。干扰可能是好的，也可以是坏的，但尽管如此，它们都是影响我们与主相处时间的干扰。马大拉有一个很好的干扰——她迫切希望在耶稣访问她的家时，通过把一切都做得完美来好好事主。问题在于她陷入了那些支线干扰中。她移开了对主的关注，就像彼得一样。


    相比之下，她的妹妹马利亚获得了主的关注，因为她下心专注于耶稣而不分心。她不会让干扰将她带离“与耶稣相处的时间”。我们需要问自己，干扰是否像对马大那样，将我们远离与神相处的时间。从这个故事中显而易见，耶稣想要成为我们生活和每天最高、最重要的优先事项。我们知道这一点，是因为祂注意到了马大的干扰以及她没有将祂视为首要任务。


    > 耶稣回答对她说：“马大，马大，你为许多事要顾念、烦乱；只有一事是必要的；马利亚已经挑选了好的福，就不能夺她的了”（路加福音 10:41-42）。


    在应对“灵性多动”时，很容易变得像马大一样——分心且容易被从灵性事务中拉走。你是否注意到，每当你决定花时间与神相处或认真对待你的灵性成长时，会有多少干扰试图现出丑陋的真目？正如提到的，你也可以让好事变成干扰，例如你的家庭、财务、工作、喜欢的节目和爱好等等，仅举几例。这些都是重要的，但如果它们的优先顺序安排错误，它们可能会成为你生命中最重要的事，使你与神相处的时间变得不重要。


    在马大家的那一天，耶稣想要她全心的投入；祂想要成为她的优先事项。祂的愿望没有改变。如果马大更专注于与神相处而不是她的准备工作，会发生什么呢？她会有更多的空暇与神相处，也不会被祂纠正。


    耶稣说有一件事是必要的，或者说应该是我们生命中的最高优先事项——与祂相处而不分心。我们必须警惕，不要让“灵性多动”夺走我们与祂相处的时间。我们每天做的在我们看来可能是必要的。然而，我们需要问自己的问题是：这些事是否比寻求神的国和他的义更有优先（参见
    `Matt. 6:33`）。耶稣告诉我们，当涉及到神和我们的灵性成长时，我们必须把神视为首要任务。这就是为什么大卫王说他渴望的是一件事。


    > 我喜爱耶华，我所渴望，这就是我所求的：我要一生一天住在耶华的殿中，瞻耶华的华，在他的殿中仰（诗篇 27:4）。


    大卫在这一节中向我们展示了有助于克服“灵性多动”的事。它在那个节中被揭示为“一件事”！这指的是与神相处，这是我们必须视为优先事项的最重要的事。这正是耶稣对马大所说的生命中最需要的事——渴望胜过一切，而不分心。神在圣经中也给了约书亚这样的指令，叫他昼夜默默思想这本律法书。


    > 本律法书不可离开你的口，你要昼夜思想它，都要效法上面所写的，这样你就可以路顺亨（约书亚 1:8）。


    '
- fmt: '

    The Lord wants us to stay focused on Him, and the devil loves it when we are distracted
    from our time with God. This is why, when resisting distractions, we will often
    have to address the enemy who wants to steal our time with God and make our spiritual
    lives miserable and unproductive. He watches and knows the things that he can
    use to aid in distracting us. After all, this is how he gets a foothold. The Bible
    tells us to give him no place in our lives (see `Eph. 4:27`). When we do give
    him a place, he will even use `Spiritual A.D.D.` to his advantage, trying to gain
    a foothold.


    Jesus warned in Scripture that the devil comes immediately to steal the seed of
    the Word of God in our lives.


    > > And these are they by the way side, where the word is sown; but when they
    have heard, Satan cometh immediately, and taketh away the word that was sown in
    their hearts (Mark 4:15).


    We can see from this verse how the enemy is afraid of the people who set their
    hearts to be about God and obeying His Word. He comes immediately to try to affect
    our lives in a negative way. One such way is through `Spiritual A.D.D.` in the
    form of distractions. Not every distraction we face can be blamed on the devil,
    but he is determined to have his hand on most of them. In this same parable, the
    Lord mentions other things that can become distractions as well, causing our spiritual
    lives to be unproductive.


    > > And these are they which are sown among thorns; such as hear the word, and
    the cares of this world, and the deceitfulness of riches, and the lusts of other
    things entering in, choke the word, and it becometh unfruitful (Mark 4:18-19).


    Take note of the things that Jesus said can cause us some frustrations or pain
    in the form of distractions and `Spiritual A.D.D.`. He mentions three specific
    things that can choke out our spiritual lives, making them unfruitful. He tells
    us to be watchful of the cares of this world, the deceitfulness of riches, and
    the lust for other things. All three of these distractions try to keep us from
    having spiritual lives that are healthy and productive.


    This is why we need to put a leash on `Spiritual A.D.D.`, so to speak, and not
    let it dictate the direction we are going in our Christian walk. We have to do
    this so that we aren’t being pulled in a direction that is opposite of spiritual
    productivity. We are advised by the apostle Paul in Scripture to turn away from
    distractions and things that can easily entangle us and to keep our eyes focused
    on the Lord instead (see `Heb. 12:1-5`).


    This sounds like what happened to Peter when he tried walking on the water, or
    to Martha, who was more focused on her chores than the Lord. In both cases, they
    took their eyes off the Lord and got caught up in distractions instead. If we
    refuse to deal with `Spiritual A.D.D.` in the form of distractions, it may become
    a spiritual weight to us. This can cause us to become spiritually bored and to
    feel weighed down. Our minds can even become clouded, preventing us from a productive
    Christian life.


    Many things can distract us from our spiritual lives and further cause us to struggle
    with `Spiritual A.D.D.`. They are different for everyone, yet, in most cases,
    they come down to three categories of distractions. I refer to these categories
    as the danger of the noun. A noun, according to definition, is a person, a place,
    or a thing. If these people, places, and things are not kept in proper balance,
    they can really hurt our spiritual walk and become major thorns of distractions.


    This is what the Lord told Moses when He gave him instructions for the children
    of Israel. He mentioned some things to avoid as they crossed over the Jordan River
    into their land of inheritance. Just as they had a natural inheritance, we also
    have an inheritance—a spiritual inheritance that is in Christ and belongs to all
    Christians. Thus, the things God mentioned to the children of Israel in their
    natural inheritance prophetically apply to us spiritually today. The Lord warned
    them to beware of the “noun.” He mentioned the three categories of distractions—people,
    places, and things:


    > > Then ye shall drive out all the inhabitants of the land [people] from before
    you, and destroy all their pictures, and destroy all their molten images [things],
    and quite pluck down all their high places [places] (Numbers 33:52).


    The Lord was letting Israel know there were distractions waiting for them in the
    land of their inheritance. They were such things as the people who lived there,
    the high places of worship to false gods, and pictures and images used to worship
    these false gods. The Lord mentioned these things to keep Israel focused on Him
    as their God. However, He had to warn them of the effects these things could have
    on them if they became distracted and refused to eliminate them. He knew these
    could distract them, pulling them away from the Him.


    > > But if ye will not drive out the inhabitants of the land from before you;
    then it shall come to pass, that those which ye let remain of them shall be pricks
    in your eyes, and thorns in your sides, and shall vex you in the land wherein
    ye dwell (Numbers 33:55).


    The failure to drive these things out of their lives could get them to lose focus
    and cause them a lot of problems. This is true for us if we don’t deal with things
    trying to distract, or if we ignore `Spiritual A.D.D.`.


    The important thing for all of us is to be wise of these distractions and how
    they can be used to get our focus off of the Lord. Many of us are ready to go
    deeper with the Lord and want to be more aware of distractions. The question is:
    How do we go about our spiritual lives even if we are still feeling the weight
    of these distractions? I believe the way is pretty easy to apply. It’s what I
    will refer to as indentifying and addressing distractions.


    ## Identify and Address Distractions


    Now that we have been made aware of how distractions can get us off course with
    the Lord, let’s identify specific distractions and address them. That’s right—we
    can address them! We don’t have to tolerate those seemingly unmovable mountains
    of distraction and `Spiritual A.D.D.`.


    Jesus taught His disciples a powerful principle of how to address obstacles, and
    it will work for us today. He instructed His disciples in the importance of identifying
    and addressing obstacles. Jesus began by pointing to a literal mountain that they
    could see as they were walking with Him one particular day.


    > > …For verily I say unto you, If ye have faith as a grain of mustard seed, ye
    shall say unto this mountain, Remove hence to yonder place; and it shall remove;
    and nothing shall be impossible unto you (Matthew 17:20).


    We know that He was giving them a life lesson about a specific mountain because
    he said “this mountain.” If we could speak to a literal mountain by faith and
    see it be removed, then what can we do with a mountain of distractions? Jesus
    points to this literal mountain to show us that no matter how big we think something
    is, if we identify specifically what it is, then we can address it, causing it
    to no longer stand in our way. Only if we are willing to take the necessary steps
    to identify and address it will we see the desired breakthrough we are seeking.
    This means that if `Spiritual A.D.D.` is hindering us and standing in our way,
    we have the answer to removing it.

    '
