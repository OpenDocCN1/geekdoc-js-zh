  raw: 'Jesus didn’t weep in the same manner of those He saw weeping. Instead, He
    was groaning in His spirit and not in His flesh or emotions, like the others who
    were weeping. He was groaning against the powers of darkness and the fleshly acts
    of the people who were carrying on in a pity party of self-pity, blame, offense,
    and out-of-control emotion.


    Does the Lord feel any different today when we carry on the same way as these
    people? At some point we have to quit feeling sorry for ourselves, complaining,
    murmuring, and getting upset if our spiritual lives aren’t working. If we are
    dealing with Spiritual A.D.D., we need to not complain or carry on in a fleshly
    way but rather be willing to push ourselves to overcome it the right way. In fact,
    God takes note of our constant complaining, murmuring, and feeling sorry for ourselves.
    You may have heard some people say, “God keeps the score.” And they are right—He
    does! God keeps count (or score) of how many times we murmur and complain!


    > > Because all those men which have seen My glory, and My miracles, which I did
    in Egypt and in the wilderness, and have tempted Me now these ten times, and have
    not hearkened to My voice (Numbers 14:22).


    The reason the Lord was counting was because the Israelites’ words and attitude
    were wrong. They were having a pity party against Moses and the Lord. Whether
    we are dealing with Spiritual A.D.D. or not, we still have to watch our words
    and attitudes so we don’t hinder God’s blessings in our lives.


    Cain


    Another example in Scripture of the Lord not attending a pity party is when Cain
    decided he was going to have one because he offered to God an offering that was
    unacceptable in the Lord’s sight.


    > > And Abel brought of the firstborn of his flock and of the fat portions. And
    the Lord had respect and regard for Abel and for his offering, but for Cain and
    his offering He had no respect or regard. So Cain was exceedingly angry and indignant,
    and he looked sad and depressed (Genesis 4:4-5 AMP).


    His brother Abel gave his best by offering to God the first of what he had, but
    this wasn’t the case with Cain. He developed a bad attitude with the Lord and
    began to feel sorry for himself. He became angry, indignant, sad, and depressed.
    He started his pity party and had a tantrum because he hadn’t given the Lord his
    best! However, the Lord wasn’t going to join his pity party, so He asked why he
    was acting all sad and depressed. “GOD spoke to Cain: ‘Why this tantrum? Why the
    sulking?…’” (Gen. 4:6 MSG). He even told him that he needed to adjust, by pushing
    himself to do what was right. “If you do what is right, will you not be accepted?
    But if you do not do what is right, sin is crouching at your door…” (Gen. 4:7
    NIV).


    It sounds a lot like what we read about Peter being asked by the Lord to step
    out and try again. Cain would have had to decide not to have a pity party and
    to try again, by doing what was right, if he was to receive the desired blessings.


    Spiritual A.D.D. is meant to discourage us and keep us from getting the results
    we want. It’s intended to get us to feel sorry for ourselves. The effects of Spiritual
    A.D.D. are meant to convince us that our time with God or our spiritual lives
    aren’t having any real benefit. When this happens, we can really get down on ourselves
    and end up not giving our best to God, like Cain. Sometimes we can even condemn
    ourselves and feel like failures before the Lord. If we are not careful, we can
    even think that God doesn’t understand and decide that we are going to have a
    pity party. We can start to feel sorry for ourselves and develop an unhealthy
    attitude that affects our spiritual outlook.


    Unfortunately, the kind of behavior that Cain displayed is common among some church
    folk today and those who take Spiritual A.D.D. to the extreme. People often come
    into church or walk around in their spiritual lives moody, sad, and depressed—and
    everyone knows they are having another bad day like Cain did. Sometimes people
    are afraid to ask such people how they are doing for fear of receiving a life-long
    list of negative things, which most of the time aren’t really that bad or are
    blown out of proportion.


    This is not to suggest that some people don’t legitimately have situations where
    they need someone to understand and care. However, if asked whether they are praying,
    those same people will often respond with, “Oh, yes, I spend lots of time reading
    my Bible and in the presence of the Lord praying.” I have just one problem with
    this: The Bible says that in the presence of the Lord there is much joy (see Ps.
    16:11). Thus, it is not hard to conclude that these people probably aren’t really
    praying and pursuing God as hard and as often as they imply; if they were, the
    fruit of it would be joy, not depression and pity parties.


    The sun isn’t going to stop for this kind of people or for our pity parties. The
    only time the sun stopped still was in the days of Joshua (see Josh. 10:12-14—the
    sun stood still and the moon stayed). It didn’t stop because God felt sorry for
    poor old Joshua, who was in a major battle in his life. Joshua got the Lord’s
    intervention because he wouldn’t have a pity party. Instead, he got up, refused
    to quit, and went into battle with the power of God on his side! He refused to
    have a pity party and kept trying until he won!


    Why Make This “Ado”?


    When dealing with Spiritual A.D.D., it is not always easy to be like Joshua and
    feel like rising up and fighting for what belongs to us. As we have seen, when
    it doesn’t look like things are working in our spiritual lives, we can start to
    feel sorry for ourselves if we are not careful, and begin to have a pity party.
    It then becomes easier to create a scene or resort to what Jesus called “making
    an ado.” “…He saith unto them, Why make ye this ado, and weep?…” (Mark 5:39).


    “Making an ado” is kind of like a pity party, but it is more along the lines of
    overreacting, complaining, and responding in uncontrolled emotion and fear. Before
    we get to the scriptural example, let me share a story from my life that gives
    a clear picture of “making an ado.”


    I crawled into my prayer time literally feeling the weight of the things that
