    A.D.D. It is revealed in that verse as being one thing! This speaks of time with
    God, which is the most important thing that we must make our priority. It is exactly
    what Jesus said to Martha was the most needful thing in her life—desiring God
    above all else and not becoming distracted from Him. Making the Lord the one thing
    or needful thing requires focus, order, scheduling, and discipline on our parts.
    A helpful way to do this is to make it the first thing we do when we wake up and
    the last thing we do before retiring for the night; this is the recipe for a healthy
    spiritual life.


    God also gave Joshua this instruction in the Bible, telling him to meditate on
    the Lord and the Scriptures both day and night.


    > > Do not let this Book of the Law depart from your mouth; meditate on it day
    and night, so that you may be careful to do everything written in it. Then you
