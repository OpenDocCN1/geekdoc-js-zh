    # INTRODUCTION

    As you read this, I pray you will find something to laugh, cry, or be challenged
    about. If you have ever felt that your spiritual life is like a wandering puppy,
    this book is for you. I know that if you have ever felt the frustration of wanting
    to focus on God but finding yourself distracted by everything else, you are not
    alone.


    I have spent over 25 years serving God, and in that time, I have dealt with Spiritual
    A.D.D. I always like to share experiences, whether they are mine or someone else’s.
    I pray that as you turn these pages, you will find something refreshing and encouraging
    regarding how A.D.D. has a grip on you. Go ahead; I believe when you reach this
    book’s final page, you will be glad you did!


    # Chapter One: TAKING THE EXAM own> Let us examine our ways and test them, and
    let us return to the LORD (Lamentations 3:40).


    “I am not going to pray, read my Bible, worship, or even try to stir myself up
    today,” I said, letting God know how felt. I was feeling weary, distracted, and
    overwhelmed, and I just plain did not want to do anything. Sound familiar? I was
    determined that when I went to have time with God that day I wasn’t going to do
    anything My intention was not to sound mad at God, to look for a reason to not
    talk with Him, or to be a brat. Rather, my heart was crying out to God because
    I really needed Him and felt so disconnected.


    I continued my speech to Him. “I am going to lie here on the ground and not do
    anything!” What!? Is that a good idea? Certainly this should not be the norm when
    it comes to spending time with God or spiritual things. I continued, “I am not
    doing anything, Lord, but rather I am expecting You to speak a word to me, sing
    to me, strengthen me, and when I get up from this floor, I will be refreshed!”


    Do you know what happened? I fell asleep, snoring, slobbering, lying face down
    with my head buried in the carpet. I awakened soon after and didn’t sense anything
    different, so I lay there some more and fell asleep again. I was determined not
    to do anything but let it be God’s turn to minister to me. Thank the Lord that
    He did help me, strengthen me, and minister to me that day! I woke up refreshed
    and then realized there had been a subtle pattern in my life for a few months.
    Little did I know that I had been suffering from what I would call spiritual attention
    deficit disorder or Spiritual A.D.D.

