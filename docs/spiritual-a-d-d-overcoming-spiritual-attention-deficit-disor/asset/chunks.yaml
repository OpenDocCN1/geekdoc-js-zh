    This is often how we deal with the Spiritual `A.D.D.` trying to attack our lives.
    We tend to let our minds and our schedules take off wildly, and we just go along
    for the ride. We often go through life and spiritual moments with God that are
    running out of our control, like the horse I was riding. It is hard for us to
    focus, pray, and get excited about spiritual things, so we just keep letting our
    minds wander. And we do nothing about our out-of-control schedules, which keep
    us from a consistent life with God.


    We have a God who is with us along the journey. But the Lord has put the decision
    and `power` in our hands (just like I had the `reins` for the horse I was riding).
    We are able to address our `minds` when they wander in prayer. We can create a
    solution for the continual distractions and the out-of-control schedules, which
    are not only symptoms of Spiritual `A.D.D` but are hindrances to a spiritually
    satisfied life.


    ## Go Ahead, Pull the Reins


    We have to pull the `reins` and say to our minds and any symptoms of Spiritual
    `A.D.D.`, “Whoa, you aren’t going to wander and get out of control!” This is also
    what Jesus meant by “possessing our souls” (see `Luke 21:19`). Our souls are made
    up of our `minds`, our `wills`, and our `emotions`. They are like the horse I
    was riding, always trying to run wild. We have to pull back on the `reins` and
    slow the horse down. The same is true with our `minds` when they try to pull us
    away from spiritual things. We must respond immediately by taking the `reins`,
    gaining control, slowing down, and bringing our minds and thoughts in order by
    determining that we are going to focus on and pursue God.


    We are spirits, we have souls (`minds`, `wills`, and `emotions`), and we live
    in physical bodies.


    > And the very God of peace sanctify you wholly; and I pray God your whole spirit
    and soul and body be preserved blameless unto the coming of our Lord Jesus Christ
    (1 Thessalonians 5:23).


    We are triune beings created by God Himself. Whenever we have thoughts that distract
    us from the things of God, it is helpful to immediately address those thoughts
    by speaking to them. Tell yourself that you are going to have a successful, fruitful
    time with the Lord; all other thoughts are to be taken captive to the obedience
    of Christ.


    > (For the weapons of our warfare are not carnal, but mighty through God to the
    pulling down of strong holds;) casting down imaginations, and every high thing
    that exalteth itself against the knowledge of God, and bringing into captivity
    every thought to the obedience of Christ (2 Corinthians 10:4-5).


    This is what we are referring to as “pulling on the reins”—we address Spiritual
    `A.D.D.` and take our thoughts captive to the obedience of Christ. When you pull
    the `reins` during your time with God, you tell your `mind` to be quiet with a
    determination that you are going to pray, read your Bible, and press into spiritual
    things. It is about making righteous and godly decisions and holding on tightly
    to your spiritual time and your desire to seek the things of God.


    Notice what Jesus did with the fig tree when He noticed it didn’t have any fruit
    on it.


    > And seeing a fig tree afar off having leaves, He came, if haply He might find
    any thing thereon: and when He came to it, He found nothing but leaves; for the
    time of figs was not yet. And Jesus answered and said unto it, No man eat fruit
    of thee hereafter for ever. And His disciples heard it (Mark 11:13-14).


    Perhaps Jesus immediately addressed this fig tree in response to thoughts the
    enemy may have been trying to attack Him with, suggesting that His ministry was
    fruitless like this fig tree. However, He did not listen to these thoughts, but
    He spoke and took His thoughts captive to the purposes of His Father.


    We can learn from this example what we need to do when something is trying to
    interrupt our spiritual walk and the spiritual things we want to do for and with
    the Lord. We need to speak to it and address it. This is vital because, if these
    things are not immediately dealt with, they will become stronger and we will lose
    the battle, eventually giving in to Spiritual `A.D.D.` Over time, if we are not
    careful, we may begin to accept things as they are. These hindrances can even
    affect our feelings of self-worth, causing us to feel like failures, spiritually
    inadequate, and to condemn ourselves before the Lord.


    How we see ourselves often determines our success. “For as he thinketh in his
    heart, so is he…” (Prov. 23:7). If we see ourselves as people who can’t focus
    on God, who are always distracted in spiritual things, and who constantly suffer
    from Spiritual `A.D.D.`, then we probably will end up becoming exactly that. If
    we think of ourselves as spiritual failures who will never be able to enjoy the
    benefits of seeking God, then we most likely will become just that.


    This is why many quit in their pursuit of God and have decided, “Why bother?”
    Their self-worth has been redefined by their constant struggles. Instead, we must
    speak to ourselves. We all talk to ourselves at times. In fact, the Bible even
    tells us to. “Speaking to yourselves in psalms and hymns and spiritual songs,
    singing and making melody in your heart to the Lord” (Eph. 5:19).


    Sometimes you have to look at yourself in the mirror and speak to yourself! You
    have to tell your body to wake up and your `mind` to quit wandering. Eye-to-eye
    contact with yourself may be difficult, but it’s necessary. In fact, most of what
    you hear and say comes from yourself. No one forms your outlook, mindset, and
    decisions more than you. This is why speaking to yourself to address the things
    that are trying to interrupt your spiritual life and time is so important. It
    is another way of possessing your soul. You have to address yourself and your
    situation so that you can experience a positive outcome.


    This is exactly what King David did. He spoke to himself, and he spoke to his
    soul. He commanded his soul to wake up and bless the Lord.


    > Bless the LORD, O my soul: and all that is within me, bless His holy name. Bless
    the LORD, O my soul, and forget not all His benefits (Psalm 103:1-2).


    David was speaking to his soul, which is the `mind`, `will`, and `emotions`. He
    told his soul to bless the Lord. Don’t let your soul tell you what you are going
    to do or what your attitude is. You have to address your soul and speak to yourself.
    In fact, this verse denotes that it is a choice to keep your soul in line. The
    Hebrew word for bless in this verse is `barak`, and it means to bow or kneel as
    in prayer, worship, or praise. David was saying to himself, “I will bless the
    Lord, and I will do it with my whole heart. I am telling my soul what to do, not
    my soul telling me. I am not going to let it steal my time with God.”


    Do you see it? He was pulling the reins on his soul! This same action will work
    for you and will help you greatly in overcoming Spiritual `A.D.D.`


    ## Win the Tug-of-War


    The trinity of God is the Father, Son, and Holy Ghost; the trinity of humanity
    is spirit, soul, and body. Your spirit is stronger and more dominant than your
    body or soul because the spirit is created in the image of God. This is why it
    can often be a struggle to keep your soul and body involved in your spiritual
    pursuit. God is a spirit, and the way to connect with Him is from your spirit
    to His spirit—with your soul and body coming in line with your spiritual pursuit.
    Jesus even mentioned this when explaining how to worship God. “God is a Spirit:
    and they that worship Him must worship Him in spirit and in truth” (John 4:24).

    '
