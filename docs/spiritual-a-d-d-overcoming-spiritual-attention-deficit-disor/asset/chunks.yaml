- fmt: '

    Notice in the next verse what Abram’s first response was. It is often our response
    as well: What will You give me?


    > > And Abram said, LORD God, what wilt Thou give me, seeing I go childless, and
    the steward of my house is this Eliezer of Damascus? (Genesis 15:2)


    There’s nothing wrong with asking Him for things, but if God had just appeared
    to us, introducing Himself, would the first thing we say to Him be, “What will
    You give me?” It sounds kind of selfish. I am not suggesting that asking God for
    things is selfish but rather that our greater purpose is to love and fellowship
    with Him first. God desires us to make Him our focus and priority, not just what
    we can receive from Him, even though He wants to bless us.


    That day when I asked God what was on His heart, I realized how much He wanted
    to bless me after that time of prayer. My focus as I went into prayer and my determination
    was that I wasn’t going to ask God for a thing for me. Instead, I just wanted
    to know what I could do for Him. I asked Him what was on His heart, what He wanted
    to discuss. God responded by speaking to my heart about how much I blessed Him
    that day in being sensitive to His heart. We often forget that God is a person.
    He has feelings like us. He has things on His heart that He wants to discuss.


    When it comes to our prayer time and our relationship with God, if we are not
    sensitive to the Lord’s heart and needs, we will spend most of our time asking
    God for things rather than desiring to fellowship with Him. When we do this, we
    limit Him from having a chance to open up His heart to us. Please don’t misunderstand
    me. God does want to bless us, and He enjoys it. He did tell us to ask and promised
    that we would receive (see `Matt. 7:7-8`). However, my heart is that we should
    be more sensitive and understanding to the Lord and His heart. We often base most
    of our relationship and its success on how many things we can ask God for and
    receive of Him.


    Abraham’s first interaction with God, when he was still called Abram, was one
    of receiving. God was introducing Himself and getting ready to establish a covenant
    with him. Yet receiving was on Abram’s mind instead, as is obvious in his first
    response to the Lord. In His introduction, the Lord did mention that He was and
    would be Abram’s provider and compensator. “…Fear not, Abram, I am your Shield,
    your abundant compensation, and your reward shall be exceedingly great” (`Gen.
    15:1 AMP`). Abram asked God immediately what he could receive— we might all do
    the same. Yet, there is something more, and it is found not just in asking God
    for things all the time, but in seeking and loving Him as our highest priority
    and focus.


    After His initial introduction, God continued to bless Abram and then changed
    his name to Abraham and established a covenant with him (see `Gen. 17`). We know
    that Abraham became a friend to God as well because God came to discuss His heart
    with His friend Abraham about the future of the cities of Sodom and Gomorrah.
    The Lord waited to talk and discuss it with someone who would listen and be His
    friend. The person God found was Abraham. “The LORD said, ‘Shall I hide from Abraham
    what I am about to do’” (`Gen. 18:17 NASB`). God wanted to discuss with him what
    was on His heart. All Abraham needed to do was make himself available to fellowship
    with the Lord about it. If He seeks us out like that, it says something about
    our walk with God!


    Like Abraham, we can overcome our pasts and become a friend to God. Our relationship
    with God will work if we make a habit of seeking God as our highest priority.
    He will respond by meeting our needs even before we ask! Putting Him first is
    also an important practice that will defeat Spiritual A.D.D. and keep it from
    taking hold of our time with God or spiritual endeavors. If we try to really prioritize
    intimacy with God, we will defeat Spiritual A.D.D. It will really work this time
    because God will be more actively involved in our lives and will cause our lives
    to come into proper order and blessing. It is a whole lot easier to avoid procrastination,
    tiredness, distractions, a wandering mind, and other Spiritual A.D.D. symptoms
    when our most important focus is ministering to God first.


    When our hearts are truly dedicated and committed to being with Him and ministering
    to Him first, we don’t feel the pressure to accomplish some spiritual routine
    (which is commonly subject to Spiritual A.D.D. instead of spiritual life, which
    focuses first on just being with God). This freedom develops our spiritual hunger
    and pushes aside any symptom of Spiritual A.D.D. that may be trying to affect
    us. It renews spiritual intimacy between us and the Lord, making seeking Him easier
    and more rewarding. We develop an inner fire or stirring that we would rather
    be with God than anything else—and that is so vital in overcoming Spiritual A.D.D.


    I want to share another time with God that changed me and has been a constant
    reminder to me of the importance of intimacy with the Lord first and not just
    a “give me” mentality. On that day I went into my time with the Lord again determined
    not to ask God for a thing but rather to worship Him non-stop instead. I told
    Him I hadn’t come for anything except to just be with Him.


    As I continued in my worship and fellowship with God that morning, something amazing
    happened: He spoke back to me. After I spent some time in worship and talking
    with Him, asking questions and waiting for his response, He spoke into my heart.
    He said, “Hank, what can I bless you with?” I know He wants to bless us, but that
    was not what this time was to be about. In response, I kept telling the Lord that
    I didn’t want anything. I told Him I didn’t come for any other purpose but just
    to be with Him. What did He do? He kept insisting on wanting to bless me because
    my desire to just be with Him had touched Him. He, of course, already knew what
    I wanted and what was on my heart. His desire to bless is just so much His nature!
    I believe it was the motive of my heart and actions that got His attention. Well,
    I am no dummy. Even though it wasn’t my plan to ask for anything but just to worship
    Him, I took Him up on His repeated offer to bless me! I began to let Him know
    some things I desired, and it wasn’t too long until those desires were fulfilled.


    Now I frequently spend time with God worshiping Him and not asking to receive
    anything. When I do, it seems as if God is waiting to be with me the moment I
    step into my prayer room. I don’t feel the distractions, the feeling of tiredness,
    the fidgeting, and lack of focus because something has been developed in me. I
    am certainly not suggesting that every time I spend time with God is without spiritual
    pursuit or the need to discipline my spirit, soul, and body. However, the majority
    of the time, it is a spiritual life that really works. I am not struggling as
    often—through over 25 years of serving God—with staying focused and being controlled
    by the symptoms of Spiritual A.D.D.


    I have noticed that the more I just focus on my friendship with God and worship
    of Him, the more blessed I am and the less the symptoms of Spiritual A.D.D. can
    affect my life. His presence, His love, and a disciplined life of being with Him
    keep Spiritual A.D.D. from taking hold. The same will be true for you! God loves
    friendship and fellowship, and He enjoys our time.

    '
