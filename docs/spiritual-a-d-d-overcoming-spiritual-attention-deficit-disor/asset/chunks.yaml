    I hope you were able to find some things from these suggestions that will help
    you overcome Spiritual A.D.D. I am convinced if you give it some thought and put
    your heart into identifying and addressing Spiritual A.D.D. and distractions,
    you will find the joy you are looking for. Are you ready to deal with distractions
    and remove Spiritual A.D.D. from your spiritual walk? Then I challenge you to
    step out like Peter, but keep your eyes on the Lord, refusing to become distracted
    (see Matt. 14:22-32.). Continue to pursue the Lord like Mary, who sat at the feet
    of the Lord and didn’t get caught up in the distractions that affected her sister,
    Martha (see Luke 10:38-42).


    I know that you can do it! All you have to do is step out, keep your eyes on the
    Lord, and identify and address those distractions. When you do, your spiritual
    path will be clear, and the future you have desired will be staring you in the
    face—the life with God that you have dreamed of!


    ![](images/00007.jpg)


    # Chapter Five: IT’S NOT WORKING


    > Simon answered, “Master, we’ve worked hard all night and haven’t caught anything.
    But because You say so, I will let down the nets” (Luke 5:5 NIV).


    When my wife, Brenda, and I were newlyweds, we were living in a small apartment.
    I will never forget what took place one afternoon while I was praying in the extra
    bedroom that we had converted into our “ministry office.” There was only one problem
    with that office: We didn’t really have any place to minister; so we really couldn’t
    consider it a ministry office, but we did. My wife and I both had a dream and
    a call to preach that we believed was to take us all over the world. But nobody
    was calling our phone or requesting for us to minister. They were staying away
    by the thousands! In fact, it seemed in those beginning days of our ministry together
    that nothing was working. So we both decided to get jobs outside of our struggling
    upstart ministry just to make ends meet.


    I decided I would pray and study in this little ministry office in our apartment
    as I always did. I was trying hard in my heart to maintain the faith and belief
    that we were really called to preach. I had to fight feelings of discouragement,
    frustration, and disappointment. The harder I tried, the less results it seemed
    to bring; nothing was working! I continued to pray, all the while not really feeling
    connected to God. I paced around that little office, praying and pressing in for
    God to use us and send us to the world. It felt like my prayers were shooting
    up to the ceiling and falling back down. I took a deep breath and pushed forward,
    praying some more.


    Eventually, I was ready to stop praying and do something else. It felt like things
    just weren’t working, so I thought, Why continue? That’s when something amazing
    happened! I decided to stand in front of my brown chair, which I often used to
    pray and study in, when I thought I saw something move out of the corner of my
    right eye. I continued standing in prayer, and then I saw it again. With my heart
    racing I thought, OK, I am going to just keep praying and ignore it!


    I prayed again and decided to slowly look over my right shoulder. As I did, I
    saw what appeared to be an angelic figure standing next to me and looking right
    at me. I knew this was real and not a “pizza” dream because I hadn’t eaten any,
    and, truthfully, we couldn’t afford to order any. I didn’t know what to do so
    I folded my hands and bowed my head. The angel folded his hands and bowed his
    head too! I couldn’t believe it! OK, I thought, I better kneel down in front of
    my chair. So I did, and so did that angel! I bowed my head kneeling, and he bowed
    his head kneeling.


    I felt such an awesome reverence for God, so I began to pray, crying out to God
    for His power and telling Him I wanted to preach around the world. I started calling
    out places when suddenly it was as if the angel shot out of the room from my chair.
    Visibly shaken after this event, I sat in my chair, pondering why it had happened.
    Why was an angel sent, and why did he leave the moment I began praying for open
    doors around the world?


    Over 20 years later, I have come to realize that what I thought wasn’t working
    in those days in fact was! It was working; I just didn’t realize it. You see,
    during the countless hours when my wife and I would pray, calling out to cities
    and nations specifically (including that day in my “ministry office”), God was
    listening, and our prayers were working. I know this because my wife and I now
    have the privilege of ministering all over the world. I believe this is because
    we kept praying even when it didn’t seem like anything was working. It was working;
    we just had to believe that it was and remain faithful!


    ## It’s Not Working


    I am sure that I am not the only one who has ever felt like his (or her) prayers
    weren’t being answered or his spiritual walk with God wasn’t getting the results
    he wanted. Have you ever felt that way? Perhaps you are feeling that way now.
    Maybe it’s because you are dealing with Spiritual A.D.D. Whatever you are facing,
    it is important to remember that even if you can’t see the results or what you’re
    doing doesn’t seem like its working, you still have to keep pushing forward and
    be willing to go that extra mile with God, remaining faithful to seek Him. When
    you aren’t seeing the results in your life that you want or when things don’t
    seem like they are working, it is never God’s fault. There is always something
    we need to adjust in our lives in order to bring the blessings and the results
    we desire.


    This reminds me of the story in the Bible when Peter and some fishermen were fishing
    all night and they caught nothing (see Luke 5:1-11). After their long night of
    fishing, Jesus arrived on the shore. He saw them cleaning their nets and calling
    it quits after a night of no results, so the Lord began to teach the people from
    Peter’s boat. After finishing His message, He asked Peter to do something that
    might have seemed a little pushy. Jesus asked Peter to do something that would
    require more work (even though He had seen them clean their nets and probably
    noticed the lack of fish). He told them to push out into the water farther and
    try fishing again! “When He finished teaching, He said to Simon, ‘Push out into
    deep water and let your nets out for a catch’” (Luke 5:4 MSG).


    Does that sound ridiculous? How about pushy? Peter thought so; he informed the
    Lord that he had already gone fishing in the night and hadn’t caught anything.
    “Simon answered, ‘Master, we’ve worked hard all night and haven’t caught anything’”
    (Luke 5:5 NIV). However, Jesus didn’t think it was a ridiculous request to ask
    Peter to keep pushing. In fact, He wasn’t at all convinced that it wouldn’t work
    if Peter was willing to try again.


    You could say the Lord was pushing him to use his faith and trust Him. He was
    trying to teach Peter that even though he didn’t see any results and it seemed
    like it wasn’t working, he still needed to stretch and try again so the Lord could
    bless him. I love Jesus’ request of Peter, pushing him on to make him try again!
    Essentially, He was saying, “Peter, pick yourself up and keep doing what you have
    been doing, but this time do it as I tell you.”


    Peter was like many who struggle with the symptoms of Spiritual A.D.D. and feel
    they aren’t getting the results they desire in their spiritual lives. He started
    to make excuses because he felt like he was trying and laboring without the results
    he wanted. Those who are dealing with Spiritual A.D.D. often pray, worship, read
    their Bibles, and attend church, yet they feel like things aren’t working spiritually
    for them, so they begin to make excuses. This is due to the symptoms of Spiritual
    A.D.D. that put more of the focus on what isn’t working than what is working in
    their lives.

