    但有一个小问题。随着时间的推移，那辆面包车变得不听话了。油箱漏了；变速箱必须更换；防冻液泄漏弄脏了地毯；电器故障；空调也坏了。噢，天哪！我们开了它 13 年，尽管有几次小挫折，但它真是一件福。最终，我不得不把它处理掉，因为发动机发出了非常大——我的意思是，非常巨大的——噪音！人们在几里之外就能听到我们来了，并转头看向我们那辆吵闹的面包车。情况变得糟糕到我的孩子们恳求我在离学校几英里的地方放下他们；他们宁愿走路，也不愿让朋友看到他们坐这辆面包车。


    这是一个很长的故事，但我想说的是关于我们的救恩经历。我们大多数人开始时都是快乐且兴奋的，就像布伦达和我都得到那辆新车时一样。生活是如此美妙；再不能更好了。事实上，我们告诉遇到的每每个人上帝为我们做了什么。但接着（噢，那个可怕的词）我们开始遇到问题，就像我们遇到那辆面包车一样。然后我们开始变得愤怒，甚至感到尴尬，因为我们竟然有所谓的“救恩”这种东西。在我们的灵性生活中，这被称为忽视我们的救恩。


    ## 忽视我们的救恩


    我对新车的经历通常反映了我们如何对待与耶稣的救恩经历。我们可能会开始忽视它，因为我们开始失去最初把心交给主时所拥有的那种新奇的喜悦、兴奋和感激。如果不留心，我们倾向于对上帝和灵性事物失去兴趣。当我们与上帝的关系不再“感觉”起来或“看起来”像以前那样时，我们也会忽视我们的救恩。这和我我的那辆面包车发出那种可怕的噪音时是一样的。我们停止向人们谈论上帝。由于事情开始变得不顺利，兴奋和喜悦就消失了。我们随后变得太不好告诉任何人我们爱上帝了。关键在于，无论如何，我们不能让“灵性多动症”（Spiritual
    A.D.D.）让我们失去喜乐，失去那份珍贵的救恩喜乐。


    这正是哈巴谷告诉我们的——无论如何，都要保持你的喜乐！看看正在发生的事情，这些事本足以以色列人失去喜乐并停止赞美上帝。


    > 即使无花树不开了花，葡萄树不结果子；即使橄榄树不收成，田庄上没有粮食；旷野的羊群死亡，牛圈里没有牛马（哈巴谷 3:17 NLT）。


    这节经文中发生的事情听起来熟悉吗？换句话说，也许我们没有得到灵性上的喂养，或者我们的生活真的变得非常糟糕，我们正面临着许多困难。我们都曾不时面临困难，并知道受苦和求而不得滋滋。然而，在所有这些事情中，我们需要提防变得低落和抑郁！下一节告诉我们，当我们面临问题且周围的事情似乎都在失败时，我们应该做什么。“然而，我要在耶华里欢欣，我要因我救恩的神而欢呼！”（哈巴谷
    3:18 NLT）。


    这节经文告诉我们，无论如何都应该保持我们的喜乐。这意味着如果我们想享受基督徒的生活，它不能仅仅基于感觉。生活中会有很多事情试图让我们情绪低落。这节经文提醒我们，如果生活中其他所有事情都失败了，我们仍旧主里有救恩的喜乐。上帝掌控着一切。我们可以依靠祂。


    当我们开始忽视我们的救恩时，可能会导致作为基督徒的喜乐和兴奋的丧失。灵性多动症可以通过不断的拖延、分心、难以专注、烦躁和疲劳等因素导致我们对救恩的忽视。如果随着时间的推移，灵性多动症没有被发现或没有得到处理，它会导致我们忽视了与上帝健康同行中可以拥有的喜乐。


    当灵性多动症影响我们时，特别是以忽视的形式时，我们开始觉得不想祷告甚至不想读圣经。通常当我们选择花时间在灵性事物上时，这似乎很无聊且毫无满足感。这通常是因为我们在与上帝的同行中忽视了某些事情。“忽视”（neglect）这个词意味着很少或不关注；未能听从；忽略；由于疏忽或漏掉而未能妥善照顾或处理；未完成或未处理。这些定义揭示了忽视的运作方式，试图偷走我们在与上帝的救恩中的喜乐。


    我不是说那些忽视救恩的人不会上天堂。正如圣经所说，我们都要战战兢兢地成自己的救恩（参见腓比书 2:12）。我指的是失去我们初成为基督徒时拥有的喜乐，或失去事奉上帝的喜乐。事实上，圣经告诉我们不要忽视这伟大的救恩：“如果我们忽略这伟大的救恩，我们能逃脱呢……”（希伯来书
    2:3）。


    我想让你思考一分钟，忽视是否正在影响你救恩的喜乐。在你的灵性生活中，是否有你认为本该做却没做的事？你是否正在做某些需要调整的事情，某些导致你忽视了灵性生活的事情？


    对我们每个人来说都不同。然而，通常会有明显的迹象，表明我们是否开始失去救恩的喜乐。这些是灵性多动症正在影响我们基督徒生活的指标。首要迹象之一就是我们几乎不读上帝的话，而且它不能引起我们的兴趣。如果是这样，我们需要像大卫在圣经中所说的那样。“我要喜爱你的律例，总不忘记你的话。”（诗篇
    119:16）。上帝的话应该是我们生活中的喜乐，而不是我们应该忽视的东西。


    ## 让事情重新顺畅起来


    '
- fmt: '

    If we want to restore the joy in our salvation and avoid spiritual neglect, then
    we need to see if there is anything in our lives hindering the flow of God. Sometimes
    we have to prime our spiritual lives like an old water pump on a farmstead. We
    have to keep pumping the handle until the water flows. Sometimes, if that pump
    hasn’t been used in a while, it will take extra work and some time to get things
    flowing again. It is the same way when we neglect our salvation and feel like
    we are losing the joy in our salvation. It may take a while to get things flowing
    again, but we need to keep working at it until we do. God is calling out to our
    hearts, wanting to be involved in every facet of our lives. This is what the Scripture
    means when it says that the deep calls unto the deep. “Deep calleth unto deep
    at the noise of Thy waterspouts: all Thy waves and Thy billows are gone over me”
    (Ps. 42:7).


    This means God’s Spirit, who lives in our hearts if we are saved, longs to fellowship
    with us. God is always calling out to our hearts. God has put everything we need
    to make it in this life inside of our hearts. When we are Christians, we have
    the Lord in us, who is the hope of glory (see Col. 1:27). This means we also then
    have joy already inside of us; it is not something that we are necessarily trying
    to obtain. We can do certain things to develop and deepen our relationship with
    the Lord. They are simple things, really, that will get things flowing again and
    bring back the joy that seems to be missing in our salvation. They are important
    steps that will really revitalize our walk with God.


    ### Drawing from the Wells of Our Salvation


    One way to begin to do this is what I refer to as “drawing from the wells of our
    salvation.” When we realize God has provided everything we need inside our hearts
    to enjoy our Christian walk, then it is not difficult to draw it out. Once we
    know it is just waiting to be drawn out of our hearts or the well of our salvation,
    like water from a well or a farm pump, we just need to learn how to draw it out.
    How do we do that? First, we need to understand that our hearts or spirits are
    like a well of salvation that Jesus said springs up to everlasting life.


    > But whosoever drinketh of the water that I shall give him shall never thirst;
    but the water that I shall give him shall be in him a well of water springing
    up into everlasting life (John 4:14).


    Sometimes this spiritual well can get stopped up with so many things in this life,
    including Spiritual A.D.D. Spiritual A.D.D. certainly contributes to hindering
    the flow of God in our lives. The well of our hearts is often like that old water
    pump on a farmstead. If left unattended or unused for a while, it may get rusty
    or even clogged. We have to literally keep pumping and pumping the handle until
    clear water begins to flow again. It might seem like we are wasting our time or
    never getting to that clear place when we are working the handle to get the pump
    working. This is because at first it might not look like any water is going to
    flow out of the pump. Sometimes, to our surprise, we may get some dirt, cobwebs,
    and even some old crusty rust when we first start pumping the handle.


    As I said before, that same principle is true for those who want to restore the
    joy back to their salvation. We have to put some effort behind it and keep working
    it, not getting surprised if some crusty old things come to the surface at first!
    Sometimes we have lost the joy in our salvation because we have packed our spiritual
    wells (hearts) with many things from this earth. They aren’t necessarily bad things,
    but nevertheless they can hinder or clog up our spiritual pursuit.


    ### Reflection on Spiritual Flow


    I want you to take a moment to reflect and ask yourself what may be stopping the
    spiritual flow in your life. Is it Spiritual A.D.D.? Ask yourself, What things
    am I neglecting in my spiritual life? Is it going to church regularly, reading
    my Bible, praying, or hanging with Christian friends? Have I lost the joy that
    should be found in my salvation? Whatever it is, it could be what is contributing
    to your struggle with Spiritual A.D.D.


    If we take a close look at our spiritual lives, we usually find something that
    is trying to stop our spiritual flow. A good way for us to get a better understanding
    of things stopping the flow of God in our lives is to consider a garden hose flowing
    powerfully with water. There is such a steady flow until something stops the flow
    of water. After further examination, we discover that this garden hose, which
    once flowed freely, now has a kink in it which is stopping the flow of water.
    Worse yet, it’s building up pressure! This happens in our spiritual lives when
    dealing with Spiritual A.D.D. Things may be flowing beautifully until we allow
    the symptoms of Spiritual A.D.D. to cause a spiritual kink, stopping the joy and
    excitement that comes with serving God.


    ### The Analogy of Isaac


    This same analogy can also apply to a well that holds water, but the water is
    full of dirt. The only things we could draw from it would be dirty water or no
    water at all, depending upon how much dirt was clogging the well. This is exactly
    what happened with Isaac in the Bible. He had to unclog the natural wells that
    his father, Abraham, had made.


    > And Isaac digged again the wells of water, which they had digged in the days
    of Abraham his father; for the Philistines had stopped them after the death of
    Abraham… (Genesis 26:18).


    They were clogged because they were full of dirt or things of this earth that
    the Philistines used to stop up these wells.


    > For all the wells which his father’s servants had digged in the days of Abraham
    his father, the Philistines had stopped them, and filled them with earth (Genesis
    26:15).


    Notice what the Philistine used to stop the flow of water from these wells? They
    filled them with earth. The dirt was now a barrier from receiving the benefits
    from these wells.


    ### Overcoming Spiritual A.D.D.


    Just as Isaac had to unclog the wells before he could get water from them, the
    same is true if we are going to gain victory over Spiritual A.D.D. We will have
    to get the dirt, sin, and things from this earth out from clogging spiritual wells.
    When our spiritual wells are clogged with worldliness or too many natural things,
    it makes it harder for our spiritual lives to flow. This is why people struggle
    with Spiritual A.D.D. and lose the joy of their salvation.


    If this is happening to you, and you are losing joy in your salvation, you to
    get things flowing again! You need to be reminded that when you accepted Jesus
    as your Lord and Savior, you received a well within you of eternal life (see John
    4:14). However, in addition to this initial experience, you have something else
    that will help get things flowing and aid in overcoming Spiritual A.D.D. It is
    a second experience after you become a Christian, which Jesus referred to as a
    river of living water that flows out of this same well of salvation.


    > He that believeth on Me, as the scripture hath said, out of his belly shall
    flow rivers of living water. (But this spake He of the Spirit, which they that
    believe on Him should receive: for the Holy Ghost was not yet given; because that
    Jesus was not yet glorified) (John 7:38-39).

