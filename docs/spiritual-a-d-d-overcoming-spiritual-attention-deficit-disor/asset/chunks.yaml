  trans: '


    要做的第一件事是建立一个聚会时间。最好的时间始终是你每天开始的第一件事。让你的时间保持现实，并与你的日程表保持一致。在刚开始时，避免极端的时长长度，这只会导致挫败感和放弃的念头。如果你在祷告时会睡着，那么一段时间内采用晚间常规可能有效，直到你建立起一致性并回到晨间常规。


    # 设定一个地点


    在设定了一个合适且现实的聚会时间后，你需要建立一个能给你提供耶稣在`马福音 6:6` 中提到的“内室”的地方。你可以根据空间和位置进行调整。关键是让它变得有趣且令人兴奋——一个你喜欢且没有干扰的地方。


    # 敬拜并省察内心


    （5 或 10 分钟）通过与父的交通开始你的祷告时间。向祂唱诗歌，与祂交谈，花时间了解祂。敬拜祂，宣告祂的伟大。这也是省察内心、认领自己的罪并接受祂赦恕的好时机。


    # 给出感谢的时刻


    （5 或 10 分钟）这段时间是你感谢神的神性以及祂所做的事。在面对神的赐福和供应时，保持具体和感恩的心是非常重要的。


    # 在灵里祷告或向神提问，听祂说话


    （5 或 10 分钟）灵里祷告。用灵、魂、体的热切祷告。当你在灵里祷告时，顺服不同的样样和发出的声音，让圣灵借着你祷告。如果需要的话，可以设置一个计时器，因为你正在灵界中建立强度。或者，你也可以利用这段时间等候主说话并对你施行事工。


    # 宣告祂的话并用经文祷告


    （5 或 10 分钟）花一点时间在你生命中以及在你爱的人身上宣告祂的话。祷告你背诵过的经文，或从`圣经`中祷告神的话。记住，当祂的话被说出来时，神在倾听并听祂的话。


    # 让你的你的求公开


    （5 或 10 分钟）带着准备进入神的宝座是非常重要的。祂说要把你所求的告诉祂。“凡无挂怀，只要凡事借祷告、祈求，带着感谢，将你们所要的告诉神”（`腓比书
    4:6`）。一个很有用的工具是笔记本和笔。我建议把你的祷告事项清单写下来，并留出空间，写下你在祷告中可能听到、感受到或看到的事。


    # 为他人祷告


    （5 或 10 分钟）为他人列出一份名单和祷告事项。花一点时间为你名单上的这些人祷告并代求。拥有一份关于自己和他人的祷告清单，是你观察神对祷告的回应的好方法。这将帮助你为得应的祷告感谢神，并建立你的信心。


    我祈祷当你读完这个激活步骤列表时，你会开始重新拥有你可以做到的新希望。这个模式本身可能很有帮助，也许你也会调整这份列表制定一个属于你自己的。请记住，你的灵性生活和与神的相处时间完全取决于你愿意投入其中的比例。它需要你的心、时间、专注、勤勉、牺牲和委身。当你致力于于这些事情时，灵性`A.D.D.`
    就不会在你的生活中扎根。


    # 其他睡着的人


    有时候，无论计划多么完美，仍然很容易受到灵性`A.D.D.`的困扰，并因为你不断睡着或感到灵性筋力竭而选择放弃。这种情况通常让人们问道：“为什么要试呢？”有灵性`A.D.D.`的人经常在神的面前睡着，结果就是感到内疚。“懒惰就陷入大睡；懒散的灵魂必受饥饿”（`箴言
    19:15`）。


    有时你可能因为缺乏休息而睡着或经历灵性冷淡，这让你感到疲倦。神在人生活中力量最大的敌人之一就是缺乏休息。神在创造的最后一天休息了，从以后建立了安日（参见`创世记
    2:2`；`出埃及记 31:17`；`希来书 4:9-11`）。“安日为人设定的，不是人为此设立安日”（`马福音 2:27`）。


    获得良好的夜睡眠至关重要，这样祷告时才不容易睡着。通常，我发现当我疲倦时，很难专注于属灵的事。正如我提到的，偶尔在灵修中，我会允许自己进入短时间的睡眠，在主面前休息。有时在学习经文或祷告时睡着是没关系的；那么在你小睡之后，你可以回到与神的灵修中。然而，如果你太频繁地这样做，或者只是因为挫败而摊手放弃，这可能会变成一种睡着或灵性冷淡的习惯性状态。如果这是一个常态，你可能正遭受灵性`A.D.D.`，如果你想享受富有成效的灵性生活，就需要解决这个问题。


    如果这种情况发生在你身上，重要的是不要感到内疚并责备自己。意识到如果人们能更诚实，会有更多人承认他们也有灵性`A.D.D.`。事实上，许多人在他们灵修时间的某个时刻都睡着过。当我们看圣经时，我们看到有些人也这样做了。圣经告诉我们不要像别人那样睡着，而要警醒。“因此，我们不要像别的人睡觉，要警醒警醒”（`帖撒罗尼前书
    5:6`）。让我们看看圣经中一些这样做的人，看看这些例子如何预言地应用在我们身上，以及如何克服灵性`A.D.D.` 这种症状。雅各的睡——创世记 28


    雅各睡着时并没有意识到神访问了祂。祂也意识到对于那些保持清醒的人，天上的梯子（机会）是可以提供的。今天的人因为灵性`A.D.D.`，处于“雅各的睡”中——他们难以获得祷告的回应和福分，因为他们睡着了而失去了神的同在。保持警醒是非常重要的。当我们祷告时，神在倾听或对我们说话，但如果我们处于雅各那样的昏沉和疲倦状态，就会错过。“雅各醒来的时候，说：‘耶和华实在在这里，我却不知道’（`创世记
    28:16`）。


    ## 参松的睡——士民记 16


    当参松被底拉哄睡时，他被诱暴露了他的力量的源头，即不剪头发对神的顺服。这种睡眠对于那些不解决灵性`A.D.D.`以及陷入睡着或被敌人哄睡的人来说是危险的。这是因为他们像参松一样，醒来时以为自己有力量战胜敌人。但他们无法做到，因为他们灵里太软弱，并且被敌人诱进入了灵性的妥协生活。结果是他们的祷告生活随着时间的推移越来越软弱，直到想要放弃。根据耶稣的说法，祷告使我们强大并让我们不倒。“耶稣讲了一个比喻，叫常常祷告，不要灰心”（`路福音
    18:1`）。


    ## 拿单的睡——拿单记 1


    拿单被主吩去向尼尼卫城悔改。但他拒绝了并逃避主，在一艘带他离开神想要去的反方向的船上睡着了。这种睡眠症状出现在不顺服神旨意的人灵性`A.D.D.`中；这种睡眠会导致他们像拿单在船上一样在灵里漂浮。这就是灵性的沉睡会导致不顺服和对神旨意心硬的地方。


    '
- fmt: "\n# The Sleep of Eli the Priest—First Samuel 3\n\nEli the priest became a\
    \ heavy man whose eyes became dim, and he was unable to discern the voice of the\
    \ Lord speaking to his young protégé, Samuel. The reason for Eli’s condition,\
    \ according to the Bible, was that he lay down to rest in his own place while\
    \ Samuel rested where the presence of God was (see `1 Sam. 3:2-3`). Failure to\
    \ address this spiritual sleep condition and the symptoms of Spiritual A.D.D.\
    \ may cause people, like Eli, to become spiritually weighed down, their spiritual\
    \ eyes becoming dim. It becomes harder for them to hear the voice of the Lord\
    \ and His direction for their lives. The key is to rest in the presence of God,\
    \ not falling asleep, but spending time in His presence like Samuel did.\n\n#\
    \ The Sleep of Uriah—Second Samuel 11\n\nKing David had committed adultery with\
    \ Bathsheba, the wife of one of his key warriors. In order to cover it up, David\
    \ suggested that this warrior, Uriah, go from the battle he was fighting for David\
    \ to his own house to be with his wife, Bathsheba. But Uriah, a faithful and loyal\
    \ soldier, decided that instead of going home to be with his wife he would stay\
    \ close to his job and his boss, King David. He elected to sleep outside the doors\
    \ of the palace, working overtime and neglecting his home due to his loyalty to\
    \ his boss and job.\n\nThis may sound crazy, but it is often why some suffer with\
    \ Spiritual A.D.D. They are more loyal, faithful, and dedicated to their boss\
    \ and employment than to their time with God. If people choose to prioritize God\
    \ and His Kingdom as first, making Him the highest thing on their daily agendas,\
    \ their homes and spiritual lives won’t suffer as much. Dedication, commitment,\
    \ and fervor in employment are important, but not at the expense of falling asleep,\
    \ thus damaging fellowship with God and causing homes to suffer because priorities\
    \ are out of order.\n\n# Sitting Too Close to the Edge\n\nHere is yet another\
    \ biblical example of a person who fell asleep, in addition to the ones we have\
    \ just read. As we look at this story, we will find it isn’t just about falling\
    \ asleep. It also prophetically represents a spiritual state that affects some\
    \ individuals and some churches. We can learn a lot from the example that we find\
    \ in `Acts` chapter 20—the story of a young man named `Eutychus` who fell asleep.\n\
    \n> We met on Sunday to worship and celebrate the Master’s Supper. Paul addressed\
    \ the congregation. Our plan was to leave first thing in the morning, but Paul\
    \ talked on, way past midnight. We were meeting in a well-lighted upper room.\
    \ A young man named Eutychus was sitting in an open window. As Paul went on and\
    \ on, Eutychus fell sound asleep and toppled out the third-story window. When\
    \ they picked him up, he was dead (`Acts 20:7-9 MSG`). \n\nImagine, right in the\
    \ middle of the sermon, someone falls out a window three stories high to his death!\
    \ This is no laughing matter. Yet, in this story, we discover that the apostle\
    \ Paul was preaching until midnight in a place called an upper chamber. My wife\
    \ and I often tease each other with this example of Paul being long-winded. We\
    \ have all probably known a long-winded preacher or sat through a long sermon\
    \ somewhere. My wife and I always joke about which one of us is the longer-winded\
    \ preacher. Of course, I say it’s her, and she says it’s me, but neither of us\
    \ has ever preached until midnight like Paul. But we have had some fall asleep\
    \ while we preached!\n\nEutychus fell asleep during Paul’s sermon while he was\
    \ listening in a window. Probably it wasn’t a good place to be sitting since he\
    \ was tired. This story reveals some truths of how Spiritual A.D.D. is affecting\
    \ some people in their individual lives and others while in the church. It could\
    \ be said that Eutychus was sitting in a place that can cause Spiritual A.D.D.—living\
    \ too close to the edge. He fell three stories to his death and had to be brought\
    \ back to life by Paul!\n\nIt is safe to assume that Eutychus was sitting facing\
    \ Paul, with his back toward the outside. This means he fell backward! Often we\
    \ talk about people who are backsliding—people who are not walking with the Lord\
    \ as they should or who have fallen into a state of apathy and are not pressing\
    \ in and really serving the Lord. This can happen if they are sitting too close\
    \ to the edge in their lives like Eutychus did in the window. When Spiritual A.D.D.\
