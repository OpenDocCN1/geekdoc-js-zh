    some of my relatives and family. I thought, I don’t need this, God, and I started
    to mumble and complain, full of unbelief. I was angry that things weren’t working
    in my life as I thought they should be. I was speaking wrong, praying wrong, and
    exhibiting a bad attitude with the Lord. This went on for some time, and the longer
    I exhibited this and prayed this way, somehow I knew God wasn’t impressed or getting
    on my spiritual bandwagon.


    I am not saying we can’t or shouldn’t be honest with God or that He isn’t interested
    in helping us. Yet, God is moved by faith, so He was not moved by my unbelief,
    complaining, murmuring, and feeling-sorry-for-myself attitude.


    > > But without faith it is impossible to please Him: for he that cometh to God
    must believe that He is, and that He is a rewarder of them that diligently seek
    Him (Hebrews 11:6).


    I continued in my state of defeat and even began to plan my own spiritual pity
    party when the Lord finally spoke to me to stop. I laugh today at what He said,
    especially when He again quoted from the King James Version of the Bible! I have
    already told how He had spoken this way to me another time, and I won’t be surprised
    if He does so to me again. God’s sense of humor with me amazes me. After all,
    He is the source of all joy and laughter; He created it.'
