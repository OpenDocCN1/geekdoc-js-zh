    But there was one little problem. Over time, that van didn’t behave itself. Its
    gas tank went out; its transmission had to be replaced; an antifreeze leak stained
    the carpet; there were electrical problems; and the air conditioning went out.
    Oh my! We drove it for 13 years, and it was a blessing despite the few setbacks.
    Ultimately, I had to get rid of it because of a very loud—I mean very loud—noise
    coming from the engine! People could hear us coming for miles and turned their
    heads to look at our noisy van. It got so bad my kids begged me to drop them off
    miles from their school; they would rather walk than have their friends see them
    riding in this van.


    It’s quite a story, but the point I want to make is in regard to our salvation
    experiences. Most of us start off joyful and excited, just like Brenda and I were
    with the brand-new van. Life is so sweet; it couldn’t get any better. In fact,
    we tell everyone we meet what God has done for us. But then (oh, that dreaded
    word) we start having problems, like we had with this van. Then we start getting
    angry, even embarrassed, that we have such a thing called salvation. In our spiritual
    lives, it’s called neglecting our salvation.


    ## Neglecting Our Salvation


    My experience with the new van is often how we treat our salvation experience
    with Jesus. We can start to neglect it because we start losing the new joy, excitement,
    and appreciation that we first had when we gave our hearts to the Lord. We can
    tend to lose interest with God and spiritual things if we are not careful. We
    also neglect our salvation if we begin to not appreciate our relationship with
    God when it doesn’t “feel” like or “look” like it once did. It’s the same as with
    my van when it made that awful noise. We stop telling people about God. The excitement
    and joy wears off because things start going wrong. We then become too embarrassed
    to tell anyone that we love God. The key is, no matter what, we can’t allow Spiritual
    A.D.D. to cause us to lose our joy, that precious joy of our salvation.


    This is exactly what Habakkuk tells us—No matter what, keep your joy! Look at
    what was happening that could have made Israel lose their joy and stop praising
    God.


    > Even though the fig trees have no blossoms, and there are no grapes on the vines;
    even though the olive crop fails, and the fields lie empty and barren; even though
    the flocks die in the fields, and the cattle barns are empty (Habakkuk 3:17 NLT).


    Do the things that happened in this verse sound familiar? In other words, maybe
    we are not getting spiritually fed, or things are really going badly in our lives,
    and we are facing many difficulties. We have all faced difficulties from time
    to time and know what it is like to suffer and have to do without. Yet, in all
    of these things, we need to guard against getting down and depressed! The next
    verse tells us what we should do if we are facing problems and things seem to
    be failing around us. “Yet I will rejoice in the LORD! I will be joyful in the
    God of my salvation!” (Hab. 3:18 NLT).


    This verse is telling us that we should keep our joy no matter what. This means
    that if we want to enjoy our Christian life, it can’t be based on feelings alone.
    There will be plenty of things in this life that will to try to get us down. This
    verse reminds us that if everything else fails in life, we still have the joy
    of our salvation in the Lord. God has it under control. We can trust Him.


    When we start neglecting our salvation, this can result in the loss of the joy
    and the excitement of being a Christian. Spiritual A.D.D. can contribute to neglect
    of our salvation through constant procrastination, distractions, struggling to
    pay attention, restlessness, and tiredness, to name a few. If over time Spiritual
    A.D.D. goes undetected or is not dealt with, it causes us to neglect the joy that
    is available in a healthy walk with God.


    When Spiritual A.D.D. affects us, especially in the form of neglect, we start
    feeling less like praying or even reading our Bibles. Often when we do choose
    to invest time in spiritual things it can seem boring and unfulfilling. This is
    usually because we are neglecting something in our walk with God. The word neglect
    means to pay little or no attention to; to fail to heed; to disregard; to fail
    to care for or attend to properly, through carelessness or oversight; to leave
    undone or unattended to. These definitions reveal many ways that neglect works
    to try to steal the joy that is in our salvation with God.


    I am not saying that people who neglect their salvation aren’t going to Heaven.
    We all have to work out our own salvation, as the Scripture says, with fear and
    trembling (see Phil. 2:12). What I am referring to is losing the joy that we had
    when we first became Christians or losing the joy of serving God. In fact, we
    are told in Scripture not to neglect so great salvation: “How shall we escape,
    if we neglect so great salvation…” (Heb. 2:3).


    I want you to think for a minute if neglect may be affecting the joy of your salvation.
    Is there anything in your spiritual life that you know you should be doing that
    you’re not? Are you doing anything that you need to adjust, something that is
    causing you to neglect your spiritual life?


    It’s different for all of us. Yet, there are usually obvious signs that indicate
    if we are starting to lose the joy of our salvation. They are indicators that
    Spiritual A.D.D. is affecting our Christian walk. One of the first indications
    is when we hardly read the Word of God and it doesn’t hold our interest. If that
    is the case, we need to do what David said in the Bible. “I will delight myself
    in Thy statutes: I will not forget Thy word” (Ps. 119:16). The Word of God is
    to be a joy in our lives and not something that we should neglect. The more we
    feed on it, the more joy and success we will have.


    > Thy words were found, and I did eat them; and Thy word was unto me the joy and
    rejoicing of my heart: for I am called by Thy name, O LORD God of hosts (Jeremiah
    15:16).


    ## Get Things Flowing Again

