    Him.


    As silly as it seems, like my wife and I in Dallas and the children of Israel
    in the wilderness, we can all wander in our spiritual lives aimlessly and foolishly
    because of Spiritual A.D.D. We can all get stuck in a rut spiritually and go around
    the same problem again and again. We start spinning our spiritual wheels, not
    accomplishing much, and we even start losing the joy of our salvation. Some get
    stuck trying to hold on to a spiritual moment or experience of the past without
    the joy of one in the present.


    This is what happened to the children of Israel. They were holding on to their
    spiritual experience— when God came down on the mountain to visit them (see Exod.
    19:16-20)—but they were not fulfilling their spiritual journey to enjoy and take
    hold of what God had promised them. So they got used to going around in circles,
    wandering in the desert, and not going really anywhere. This wasn’t the only time
    in Israel’s history that they got stuck. Others lost the joy of their salvation
    through God’s deliverance from Egypt and wicked Pharaoh (see Num. 11:1-10; 14:1-4;
    21:4). Some wanted to go back to Egypt, and they started complaining, getting
    mad, feeling frustrated, and wanting to quit. They began losing the joy of what
    God had and would give them.


    We have to be careful we don’t become like the children of Israel—mad, frustrated,
    complaining, and wanting to quit in our spiritual journeys. This is why God told
    them to go northward, and it is why He’s telling us to do the same. If we really
    want to get serious about Spiritual A.D.D. and returning to the joy of our salvation,
    then we have to get determined about not going around in circles, spinning our
    wheels, but going nowhere spiritually. We have to be determined to change our
    habits, routines, and ways.


    This can be difficult the older we get in life, not only physically, but also
    spiritually. We become resistant to change, advice, or anything that goes against
    what we believe and how we have always done things. The problem is we can become
    stagnant and determined that we aren’t going to change, even if we know we should.
    We then often deny there is a problem, just so we can be right, and we hold on
    to our stubborn ways that aren’t working and yielding much result in our spiritual
    lives and time with God.


    If this sounds like you, then I think it’s time to go northward. How about you?


    Changing Your Habits


    If we want to change our direction to restore the joy back to our salvation, then
    we have to be willing to change our habits. Brenda and I were lost the whole day
    in Dallas/Fort Worth because it is my habit not to ask for directions unless I
    absolutely have to. My refusal to adjust my habit affected me; I stubbornly refused
    to change my direction. I kept thinking I would just figure it out on my own,
    and I wound up losing my joy in the process!


    If we really want to resist Spiritual A.D.D., then we have to be willing to change
    our habits. When we do, our spiritual lives will start heading in the right direction,
    and we will find joy again. If we want to change our habits, we must first examine
    our daily routines. They usually set our day and determine the course of our lives.
    Changing our habits will require a change in our daily routines and, at times,
    even our personal comfort. If we are suffering from Spiritual A.D.D., it could
    be because some old habits in our lives need to change.


    We need to ask ourselves such questions as: How much of my daily routine consists
    of a pursuit of God? Am I a Christian testimony? Do I witness to others about
    the Lord, or am I often too embarrassed to let anyone know I am a Christian? Are
    Bible reading and prayer a part of my daily habits? These questions are important
    because the things we choose to do daily often lead to daily mindsets, which ultimately
    lead to a lifestyle from the habits that we have created. These habits can be
    good or bad, spiritual or unspiritual.


    We can see how important it is to set the right habits in our lives daily by looking
    at an example of a man in the Bible who was born crippled. Every day this man
    was brought by others and laid down to beg at a gate called Beautiful. It became
    his habit, mindset, and eventually his lifestyle.


    > > …A man lame from birth was being carried in. Each day he was put beside the
    Temple gate, the one called the Beautiful Gate, so he could beg from the people
    going into the Temple (Acts 3:2 NLT).


    This resulted in him having a continued life of begging for a daily handout and
    needing a physical healing. His daily routine formed a mindset and habit in his
    life. Outside of a miracle, he would stay the same for the rest of his life. The
    same result can happen for those who refuse to change their habits to become more
    spiritual and consistent. We can be left in a spiritually lame condition.'
