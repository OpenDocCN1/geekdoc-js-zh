  trans: '

    “什么？”我对自己自言自语。我对内心听到的话感到惊讶，意识到那是主在对我说话。然而，我那理性的、宗教的大脑却将那温柔的声音斥之，认为那是我在找借口逃避祷告。


    那天早上，我比平时起得更早，非常期待能与上帝共度时光，但祷告时我却睡着了。我祈着睡着睡着，睡一会儿又接着睡着。我不断在睡眠和清醒之间徘徊，直到有一次，我发现自己正在为一些荒唐的事情祷告，在继续灵修时还在嘟囔。我睁不开眼睛，已经尝试了我能想象到的所有祷告姿势。我走着、跪着、站着、躺着、俯卧。我甚至想过如果能让我保持清醒，我是不是倒立着祷。（好吧，并不是真的，但你明白我的意思。）


    于是，我决定，我就这样躺在主面前祷告吧。行吧！你知道这意味着什么吗？我开始迅速入睡，眼睛变得越来越沉重，开始打瞌睡。我经常开玩笑说，天堂的人看着我进入睡眠模式时开始了了倒计时。十、九、八、七……没错，没错，熄灯了！我们都有过那种“躺”在主面前，结果却从短暂的“祷告盹”中醒来的时刻。


    这正是我试图祷告时正在发生的情况——直到我听到了我认为是主的声音打断了我。我永远不会忘记那些话：“汉克，你为什么不去休息，等我们两个都能享受这个呢？”这些话给了我如何看待我们与祂相处的时间一个全新的视角。也让我意识到，我需要更努力地珍惜与祂相处的时刻。


    主知道我没有把心投入到祷告中，我内心深处想回到床上。我确实是这么做了！我采纳了上帝的建议，在休息更充足之后再回来与祂契交。在这种情况下，我发现休息后，祷告和理解我所阅读的经文变得变得更容易了。当然，睡着了再回来不应该是我们的常态。我们需要确保自己得到了充分休息，这样才能更好地关注属灵的事物，而不是睡着了。


    也许你在祷告和灵修时经常睡着。也许你对属灵的事物感到厌倦。如果你在属灵生活中经常睡着或感到筋力竭，尤其是当你已经得到了充分休息时，你该怎么办？在本章中，我将提供一些建议，当你决定“醒来”是否是你生活中需要解决的问题时，这些建议可能会给你提供帮助和鼓励。


    # 是时候醒醒了


    你可能会说：“但是，我很累！你不了解我的情况。”我理解，我也曾有过那种感觉——就像我之前提到的，甚至在祷告时睡着了。持续地在祷告和圣经灵修中睡着可能是属灵多动症（Spiritual
    A.D.D.）的迹象；好消息是，还有希望和答案。


    在我提供解决方案之前，你必须意识到睡着、属灵昏睡和麻木的危险。这会对你的属灵生活产生非常令人沮丧或灰心的影响，往往让你感到与上帝的关系空虚，而且祷告几乎没有结果。当这种结果一次又一次发生时，人们很容易对属灵的事物感到厌倦。你可能会对祷告或读圣经感到无味，觉得教会不再重要，并认为寻求上帝真是一件苦差事！这是因为属灵的厌倦（属灵多动症的症状之一）已经袭来。这导致了疲劳和最终的昏睡，并在保持对属灵事物的兴趣上不断挣扎。


    当耶稣在真正需要他们祷告支持时，要求他们与祂一起祷告，这种情况发生在门徒身上。毕竟那是带他们来的原因。“他去，见他们睡着了，就对彼得说：西门，你睡着了？你们不能守醒一个小时吗？”（马福音
    14:37）。耶稣在告诉他们醒来，因为他们在祷告中睡着了。


    睡着和疲劳让门徒们无法祷告一小时。我总是将每天灵修时间至少祷告一小时作为目标。这对于那些成为基督一段时间的人来说尤为重要。门徒们跟随耶稣三年了，祂期望他们至少能告一小时。


    ## 祷告整整小时？


    你是认真的吗？是的，我是认真的！你可以祷告一小时，尤其是如果你已经事奉一段时间了。这并不困难。如果你打算认真克服属灵多动症，你需要能够祷得更久、更强、更有规律。如果你真的想要结果和令人满意的属灵生活，这就是你必须做的。


    你可能会问：“在摆脱属灵多动症的道路上，第一步从哪里开始？”第一步始终是心态。没有心态，你只会在属灵道路上原地打转并感到沮丧。如果你在与上帝相处时觉得很无聊、很不方便，这会影响你与祂相处的时间。我试着带着兴奋、喜乐和期待来与上帝相处。为你将与祂相处的时光感到兴奋，而不是强迫自己出现在祂面前。


    一旦你降服了你的心并建立了正确的喜乐和兴奋的心态，下一步就是建立一个你与祂会面的时间（这需要是一致的）。计划好与主会面的时间和地点。对于那些深受多动症困扰的人，我建议规划一小时的时间。


    我发现，把想要和上帝讨论的内容写下来很有益处。列出你想聊的话题可以让你保持轨迹并专注，避免在祷告时像是在盲目射。


    我在灵修时间发现的另一个有用的方法，是尝试不要把它看作是一小时的单纯说话。我将其与敬拜、读经、祷告、向上帝提问以及等待祂回答结合在一起。有时，我只是在主面前休息，让祂事奉我。


    这些仅仅是引导你进入正轨的建议。重要的是有一个规律、一致且令人享受的时间。关键在于要有组织和纪律，但不要死板和紧张，因为那会夺走与祂关系的乐趣。


    这里有一个你可以参考的格式，它可以帮助你与上帝进行至少一小时有效的交流！这是一个简单（但并非强制）的利用一小时对你有益的例子。记得我的故事吗？主希望我在投入并休息更充足之后回来。永远记住，祷告是一种关系。它不仅仅是单方面的讨论，而是与上帝的对话！你在生命中让上帝变得越真实，祂对你来说就越真实，从而帮助你把属灵多动症踢出生活。尝试这个列表一段时间，直到你建立——或重新建立适合自己的模式。


    # 激活


    '
- fmt: '

    The first thing to do is establish a meeting time. The best time is always first
    thing in your day. Keep your time realistic and consistent to what works for your
    schedule. Avoid extreme times and lengths when you first start, which will only
    lead to discouragement and the desire to quit. If you are falling asleep in prayer,
    an evening routine may work for a season until you build consistency to return
    to a morning routine instead.


    # Set a Place


    After you set a meeting time that works and is realistic, you need to establish
    a meeting place that gives you that “private room” that Jesus mentioned in `Matthew
    6:6`. You can change this depending on space and location. The key is to keep
    it fun and exciting—a place you enjoy being that is void of distractions.


    # Worship and Search Your Heart


    (5 or 10 minutes) Begin your prayer time by fellowshipping with the Father. Sing
    songs to Him, talk to Him, and spend time getting to know Him. Worship Him, declaring
    His greatness. This is also a great time to search your heart and confess your
    sins, receiving His forgiveness.


    # Give a Moment of Thanks


    (5 or 10 minutes) This is time when you thank God for who He is and what He has
    done. It is important to be specific and grateful when it comes to God’s blessings
    and provisions.


    # Pray in the Spirit or Ask God Questions, Listening to Him


    (5 or 10 minutes) Pray in the Spirit. Pray with fervency of spirit, soul, and
    body. Let the Holy Spirit pray through you as you yield to the different diversities
    and utterances as you pray in the Spirit. Set a timer if you have to, as you build
    intensity in the spirit realm. Or you can use this time to wait on the Lord to
    speak and minister to you.


    # Declare His Word and Pray the Word


    (5 or 10 minutes) Take a moment to declare His Word in your life and over your
    loved ones. Pray Scriptures you have memorized, or pray God’s Word from the `Bible`.
    Remember, God listens for and listens to His Word when it is spoken.


    # Make Your Requests Known


    (5 or 10 minutes) It is important to come into God’s throne room prepared. He
    said to make your requests known to Him. “Be careful for nothing; but in every
    thing by prayer and supplication with thanksgiving let your requests be made known
    unto God” (`Phil. 4:6`). A helpful tool is a notebook and writing instrument.
    I recommend writing down your list of prayer requests and leaving space where
    you can write things that you may hear, sense, or see in prayer.


    # Pray for Others


    (5 or 10 minutes) Make a list of names and prayer requests for others. Take a
    little time to pray over and intercede for those on your list. Having a list to
    pray about for yourself and for others is a great way for you see God’s answers
    to prayer. It will help you to offer thanks to God for answered prayer and also
    to build your faith.


    I pray that as you read through this list of activation steps, you will begin
    to have renewed hope that you can do it. This pattern may be helpful as is, or
    perhaps you will adjust the list to make one of your own. Just remember that your
    spiritual walk and time with God is only good to the proportion that you are willing
    to invest in it. It requires your heart, time, focus, diligence, sacrifice, and
    commitment. When you commit to these things, Spiritual `A.D.D.` won’t take root
    in your life.


    # Others Who Slept


    Sometimes, no matter how good the plan is, it can still be easy to suffer from
    Spiritual `A.D.D.` and resort to quitting because you keep falling asleep or you
    feel spiritually exhausted. This scenario often leaves people asking, “Why try?”
    Those who have Spiritual `A.D.D.` often fall asleep in God’s presence and, as
    a result, feel guilty. “Slothfulness casteth into a deep sleep; and an idle soul
    shall suffer hunger” (`Prov. 19:15`).


    Sometimes you may fall asleep or experience spiritual apathy because of a lack
    of rest, which makes you tired. One of the greatest enemies to the power of God
    in people’s lives is lack of rest. God rested on the last day of creation and
    established a day of rest thereafter (see `Gen. 2:2`; `Exod. 31:17`; `Heb. 4:9-11`).
    “The Sabbath was made for man, and not man for the Sabbath” (`Mark 2:27`).


    It is vital to get a good night’s rest so it will be easier to pray without falling
    asleep. Typically, I have found it more difficult to stay focused in spiritual
    things when I am tired. As I have mentioned, occasionally I have times in my devotions
    when I will allow myself to fall into a short sleep, resting before the Lord.
    Sometimes it is OK to fall asleep while studying the Word or praying; then after
    your short nap, you can return to your devotions with God. However, this can become
    a habitual condition of falling asleep or spiritual apathy if you allow it too
    often or if you just throw your hands in the air in frustration. If this is a
    normal pattern, you are probably suffering from Spiritual `A.D.D.`, which needs
    to be addressed if you want to enjoy a spiritual life that is productive.


    If this is true of you, the important thing is to not feel guilty and condemn
    yourself. Realize that if people were more honest, more of them would admit they
    have Spiritual `A.D.D.` too. In fact, many people have fallen asleep at some time
    in their devotional time. When we look at the Scriptures, we see some who did
    as well. The Bible tells us not to fall asleep as others do, but to stay alert.
    “Therefore let us not sleep, as do others; but let us watch and be sober” (`1
    Thess. 5:6`). Let’s look at some examples from the Bible and see how they can
    prophetically apply to us today. As we look at each one, we can also gain insight
    on how to defeat this symptom of Spiritual `A.D.D.` in our lives.


    ## The Sleep of Jacob—Genesis 28


    Jacob fell asleep and didn’t realize that God had visited Him while he was sleeping.
    He also realized that there is a heavenly ladder (access) available for those
    who will stay awake and take advantage of the covenant right to heavenly blessings
    and answers. Some people today, because of Spiritual `A.D.D.`, are in the “sleep
    of Jacob”—they struggle to receive answers to prayers and their heavenly benefits,
    and they don’t experience the presence of God because they are asleep. It’s important
    to stay awake and spiritually alert. When we pray, God is listening or speaking
    to us, but we will miss it if we are in a state of spiritual stupor and tiredness
    like Jacob was. “When Jacob awoke from his sleep, he thought, ‘Surely the LORD
    is in this place, and I was not aware of it’” (`Gen. 28:16` NIV).


    ## The Sleep of Samson—Judges 16


    When Samson was lled to sleep by Delilah, he was seduced into revealing the source
    of his strength, his obedience to God by not cutting his hair. This type of sleep
    is dangerous to those who won’t address Spiritual `A.D.D.` and their struggles
    with falling asleep or being lled to sleep by the enemy. This is because, like
    Samson, they awake presuming they have the strength to defeat the enemy. But they
    struggle to do so because they are too spiritually weak and have been seduced
    into a life of spiritual compromise by the enemy. As a result, their prayer lives
    start weakening more and more over time until they want to give up. According
    to Jesus, prayer is what makes us strong and keeps us from fainting. “And He spake
    a parable unto them to this end, that men ought always to pray, and not to faint”
    (`Luke 18:1`).


    ## The Sleep of Jonah—Jonah 1


    Jonah was told by the Lord to go and prophesy to the city of Nineveh to repent.
    But he refused and ran from the Lord, falling asleep on a ship taking him in the
    opposite direction from where God wanted him to go. This kind of sleep symptom
    arises in Spiritual `A.D.D.` when people are not submitted to the will of God;
    such sleep can cause them to spiritually drift like Jonah in the boat. This is
    where spiritual slumber can lead to disobedience and a hardening of the heart
    toward God’s will, which eventually causes them to run away from spiritual things
    because they are drifting in spiritual apathy.

