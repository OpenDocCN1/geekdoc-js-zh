    [Chapter Six](#index_split_006.html_filepos6456)


    [JOY AGAIN IN MY SALVATION](#index_split_006.html_filepos6456)


    > > Yet I will rejoice in the LORD, I will joy in the God of my salvation (Habakkuk
    3:18).


    I will never forget the day I got a phone call from someone who wanted to visit
    me. Brenda and I had just returned from a ministry trip, and we were not really
    in the mood for company. Yet, this person kept insisting, so I hesitantly agreed.
    A few hours later, I was glad I had. He had come to visit us because he had been
    impressed by the Lord to give us a new car! I remember looking at his hand, holding
    car keys, with my mouth opened in surprise by what he said to me. “Go ahead. This
    is yours, Hank and Brenda. These are the keys to a brand-new car. The Lord told
    me to give this to you, and you are to trade it in and get the one you want,”
    he said, as he handed us the keys.


    We were so grateful to the Lord because we had believed for a new car. This was
    especially a blessing because many of the vehicles we had owned before this were
    nothing to speak of. We had a car that caught fire when running too long and cars
    that had more rust on them than paint. We had never owned a new one at that point
    in our marriage. So we did exactly as he said and traded that new car in for a
    minivan, which is what we had believed for.


    I must admit, during this time I was wrestling with feelings of guilt, like I
    didn’t deserve this blessing. It wasn’t until we were on the way to the auto dealership
    in a different city to trade the new car in that the Lord gave me a vision of
    the new van we were to buy. I remember how clear the vision was. The Lord showed
    me the color of this new van—green on the exterior with a camel brown interior—sitting
    on the showroom floor. I was surprised by this picture and shared it with Brenda.
    The vision was interesting to both of us because neither one of us had ever discussed
    wanting a green van with a camel interior. In fact, green was one of our least
    likely colors to consider!


    But when we pulled up to the dealership, we saw the green van the Lord had showed
    me sitting right in the middle of the showroom floor, looking out the window at
    us. It was as if it was staring at us, waving, with our name on it! We were super
    excited and thankful to the Lord as we traded in the new car we had been blessed
    with and bought the van that He had graciously provided. My wife and I were so
    happy as we drove it off the car lot. It was fully loaded and fully paid for.
    It couldn’t get any better than that!


    As I said, we had never, ever had a vehicle this nice in the few years we had
    been married. We told everyone—I mean everyone, everywhere—that the Lord had given
    us this van. It was practically our newborn, and we were proud parents! Whether
    they cared or wanted to hear it, we told everyone. It was our testimony, and we
    were sticking to it. We even bought a Jesus logo for the back. We were dedicated
    to letting the whole world know of our blessing. We were so filled with joy!'
