    # 引言

    当你阅读这本书时，我祈祷你能发现一些让你发笑、哭泣或受到挑战的内容。如果你曾觉得自己的灵性生活像一只游荡的小狗，那么这本书就是是为你准备的。我知道，如果你曾感到过想要专注于神却发现自己被其他所有事情分心的挫败感，你并不孤单。


    我服事上帝已超过 25 年，在那段时间里，我一直在应对灵性 A.D.D.。我总是喜欢分享经验，无论是我的还是他人的。我祈祷当你翻阅这些页时，会发现一些关于
    A.D.D. 如何掌控你的、令人振奋且鼓励的内容。读下去吧；我相信当你读到这本书的最后一页时，你会庆幸自己这么做的！


    # 第一章：考试


    > 我们要省察自己的行为，要验自己的道路，都要归向耶和华。（哀歌 3:40）。


    “我今天不想祷告、不想读经、不想崇拜，甚至不想尝试让自己振作起来，”我这样说，让神知道我的感受。我感到疲惫、分心、心力交瘁，我根本不想做任何事。听起来熟悉吗？我决定那天在和神相处的时间里，我什么都不做。我的本意不是要对神发脾气、找理由不和祂说话，或是表现得像个孩子。相反，我的心在向神呼求，因为我真的需要祂，并且感到如此疏离。


    我继续对他诉说：“我要一直躺在地上，什么都不做！”什么！？这是个好主意吗？对于与神相处或处理灵性事务来说，这不应该是常态。我继续道：“主，我什么都不做，但我期待你对我说一句话，对我唱首歌，坚强我，当我从地板上站起来时，我会得着更新！”


    你知道发生了什么吗？我睡着了，打着呼噜，流着口水，脸朝下头埋在地毯里。不久后我醒了，并没有感觉到有什么不同，于是我又躺在那了一会儿，又睡着了。我决定什么都不做，就让神轮到服事我。感谢主，祂那天确实帮助了我、坚强了我并服事了我！我醒来时神清气爽，然后意识到几个月来我的生活中一直存在着微妙的模式。我当时并，我一直遭受着我所谓的灵性注意力缺陷障碍，或灵性
    A.D.D.。


