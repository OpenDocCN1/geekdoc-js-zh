    “What?” I said to myself. I was surprised by what I had heard in my heart, perceiving
    it was the voice of the Lord speaking to me. Yet, my rational, religious mind
    dismissed the gentle voice as just me making excuses so I could get out of praying.


    I had started earlier than usual that morning and was so excited to spend time
    with God, but I was falling asleep while praying. I would pray and then fall asleep,
    pray some more and then fall asleep again. I kept going in and out of sleep until,
    at one point, I caught myself praying about something ridiculous, mumbling as
    I continued in my devotions. I couldn’t keep my eyes open and had exhausted every
    possible praying position I could imagine. I walked, knelt, stood, lay on my back,
    then lay face down. I even thought about praying standing on my head if it meant
    keeping me awake. (OK, not really, but you get the point.)


    So, I decided, I am going to just lie here before the Lord and pray. Sure! You
    know what that means? I started fading fast, as my eyes got heavier and started
    nodding off to sleep. I often joke that Heaven started a countdown as they watched
    me fade into sleep mode. Ten, nine, eight, seven…. Yes, that’s right, lights out!
    We all have had that moment of “lying” before the Lord only to awake from a brief
    “prayer nap.”


    This was exactly what was happening to me as I was trying to pray—until I heard
    what I believe was the Lord’s voice interrupting me. I will never forget those
    words, “Hank, why don’t you go rest and come back when we will both enjoy this?”
    Those words gave me a whole new perspective on how God views our time with Him.
    It also made me realize that I needed to try harder to value my moments with Him.


    The Lord knew that I wasn’t putting my heart into my prayer time and that deep
    inside of me I wanted to go back to bed. That’s exactly what I did! I took God
    up on His suggestion and came back later to fellowship with Him when I was more
    rested. In this case, I found it easier to pray and comprehend what I was reading
    in Scripture after I had rested. Of course, it shouldn’t be our norm to fall asleep
    and then come back later. We need to make sure we are getting plenty of rest so
    we can better focus on spiritual things and not fall asleep.


    Maybe you are falling asleep regularly in prayer and devotions. Perhaps you are
    bored with spiritual things. What do you do if it is common for you to fall asleep
    or feel worn out in your spiritual walk, especially if you are getting plenty
    of rest? In this chapter, I will give some pointers that may be a help and encouragement
    as you are deciding if “waking up” is something that needs to be addressed in
    your life.


    # It Is Time to Wake Up


    You might be saying, “But, I am tired! You don’t know my situation.” I do understand,
    and I have felt that way too—to the point of falling asleep in my prayer time,
    as I mentioned before. Consistently falling asleep in prayer and Bible devotions
    could be a sign of Spiritual A.D.D.; the good news is, there is hope and an answer.


    First you have to recognize the danger of falling asleep, spiritual slumber, and
    stupor before I address the solution. It can be very frustrating or discouraging
    to your spiritual walk, often leaving you with a feeling of emptiness with God
    and little to no results in prayer. When this is the outcome time and time again,
    it is easy to become bored with spiritual things. You can become bored with prayer
    or reading the Bible, feel church isn’t important anymore, and believe that trying
    to seek God is a real chore! This is because spiritual boredom, which is one of
    the symptoms of Spiritual A.D.D., has set in. This leads to tiredness and eventual
    slumber, with the constant struggle to stay interested in spiritual things.


    This happened with Jesus’ disciples when He asked them to pray with Him at a time
    when He really wanted their support in prayer. After all, that’s why He had brought
    them. “And He cometh, and findeth them sleeping, and saith unto Peter, Simon,
    sleepest thou? couldest not thou watch one hour?” (Mark 14:37). Jesus was telling
    them to wake up because they had fallen asleep in prayer.


    Falling asleep and tiredness kept the disciples from being able to pray for an
    hour. I always make it my goal to pray at least an hour during my devotional time.
    This is especially important for those who have been Christians for a while. The
    disciples had been with Jesus three years, and He expected them to be able to
    pray at least an hour.


    ## Pray for an entire hour?


    Are you serious? Yes, I am! You can pray for an hour, especially if you have been
    serving the Lord awhile. It isn’t that difficult. If you are going to get serious
    about overcoming Spiritual A.D.D., you need to be able to pray longer, stronger,
    and more consistently. This is what you need to do if you really want results
    and a satisfying spiritual walk.


    You may be asking, “Where is the first place to start in the path to freedom from
    Spiritual A.D.D.?” The first place to start is always with the heart attitude.
    Without it you will just spin your spiritual wheels and become frustrated. If
    you go into your time with God acting like it is boring and inconvenient, it will
    affect your time with Him. I try to approach my time with God with excitement,
    joy, and expectation. Get excited about the time that you will be with Him, rather
    than dragging yourself to be in His presence.


    Once you submit your heart and develop the right attitude of joy and excitement,
    the next step is to establish a time when you will meet with Him (this needs to
    be consistent). Plan your time and place to meet with the Lord. For those struggling
    with Spiritual A.D.D., I suggest planning out a one-hour time frame. That gives
    you plenty of time to worship God, talk with Him, pray, and read your Bible.


    I have also found it beneficial to have things I want to discuss with Him written
    down. Making a list of things you want to talk to God about will keep you on track
    and focused, helping you to make better use of your time with Him. It will help
    you accomplish the things you desire while not feeling like you’re just shooting
    in the dark with your prayers.


    Another helpful thing I have found in my devotional time is to try not to approach
    it as an hour of just me talking. I mix it up with worship, Bible reading, prayer,
    asking God questions, and waiting for Him to answer. Sometimes I just rest before
    the Lord in His presence, letting Him minister to me.


    These are merely suggestions to get you on track. The important thing is a regular
    and consistent time that is enjoyable and gets results. The key is to be well-organized
    and disciplined, yet not rigid and uptight, because that will take the joy out
    of your relationship with Him.


    Here is a format you can consider which will help you have more effective times
    with God for at least an hour! It is a simple (though certainly not required)
    example of how to use an hour to your benefit and the Lord’s. Remember my story?
    God wanted me to come back when my heart was in it and more rested. Always remember,
    prayer is a relationship. It’s not just a one-sided discussion but rather a conversation
    with God! The more real you will make God in your life, the more real He will
    become to you, thus helping you to kick Spiritual A.D.D. out of your life. Try
    out this list for a while until you establish—or reestablish—one that works for
    you!


    # Activation


    The purpose of this activation is to help people to start, get back to, or further
    develop 30 minutes to one hour of daily private prayer. The five minutes on each
    of the suggestions below is for a 30-minute plan, and the ten minutes is for a
    one-hour plan. These are simply suggestions. The key is doing what works for you
    and stretches you. Start small and increase!


    ## Set a Time

