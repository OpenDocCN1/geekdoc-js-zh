  trans: '


    主希望我们能够专注于祂，而魔鬼则喜欢看到我们在与神相处时产生分心。这就是为什么，当我们抵御分心时，我们往往必须对那个想要偷走我们与神相处的时间、并让我们的灵性生活变得痛苦且低效的敌人。他监视并知道哪些事情可以被用来帮助分散我们的心智。毕竟，这就是他获得立足点的方式。圣经告诉我们，切不要在我们的生命中给他留存任何余地（参见
    `Eph. 4:27`）。当我们真的给他留了余地时，他甚至会利用 `Spiritual A.D.D.` 来让自己有利，试图占据立足点。


    耶稣在圣经中警告说，魔鬼会立刻偷走我们生命中神的话语的种子。


    > > 有的撒在路边的，就是路边旁；当他们听了，撒旦就立刻来，把那撒在他们心中的道夺走了（马太福音 4:15）。


    我们从这节经文中看到，敌人是如何害怕那些一心追求神并顺服祂话语的人的。他立刻试图以负面的方式影响我们的生活。其中一种方式就是通过 `Spiritual A.D.D.`
    形式的分心。我们面临的每种分心并不都能归咎于魔鬼，但他下定决心要介入大部分情况。在同一个比喻中，主还提到了其他可能成为分心的事物，导致我们的灵性生活变得低效。


    > > 有的撒在刺网中间；就是听了道，世上的忧怀、钱财的诡惑以及各事事的私欲，就挤综这道，不能结果子（马太福音 4:18-19）。


    请注意耶稣所说的那些可能以分心和 `Spiritual A.D.D.` 形式给我们带来挫败或痛苦的事。他提到了三件会扼杀我们灵性生活、使其无法结实的具体事项。他告诉我们要留心世上的忧怀、钱财的诡惑以及对他事事的私欲。这三种分心都试图阻碍我们拥有健康且高效的灵性生活。


    这就是为什么我们需要对所谓的 `Spiritual A.D.D.` 套上枷锁，不要让它决定我们在基督徒信仰道路上的方向。我们必须这样做，这样才不会被拉向一个与灵性生产相反的方向。使徒保罗在圣经中建议我们，要远离分心和那些容易缠绕我们的事物，转而将眼睛专注于主（参见
    `Heb. 12:1-5`）。


    这听起来就像彼得尝试在水面上行走时发生的情况，或者像马大拉那样，她更关注家务胜过关注主。在这两种情况下，他们都移开了对主的关注，反而陷入了分心之中。如果我们拒绝处理以分心形式存在的
    `Spiritual A.D.D.`，它可能会成为我们的灵性负担。这可能导致我们在灵性上感到厌倦并感到压力巨大。我们的头脑甚至变得模糊，阻碍我们过高效的基督徒生活。


    许多事情会让我们从灵性生活中分心，并进一步导致我们与 `Spiritual A.D.D.` 作斗。每个人的情况不同，但在大多数情况下，它们归结为三类分心。我将这些类别称为“名词的危险”。根据定义，名词是指人、地方或事物。如果这些人、地方和事物没有被保持恰当的平衡，它们真的会伤害我们的灵性道路，并成为分心的主要荆棘。


    这就是主在给以色列人下达指示时对摩西说的话。他提到了一些他们在越过约旦河进入应许之地时要避免的事物。正如他们拥有自然的产业一样，我们也拥有一个产业——一种在基督里面并属于所有基督徒的灵性产业。因此，神在以色列人的自然产业中提到的那些事物，在今天的灵性层面预言性地适用于我们。主警告他们提防“名词”。他提到了三类分心——人、地方和事物：


    > > 你们要将当地的居民[人]全然赶出去，破他们一切偶像，砸他们一切雕像[事物]，凡将他们的高坛[地方]拆毁（民数记 33:52）。


    主让以色列人知道，在他们的应许之地有分心在等着他们。那些事物诸如住在那里的人、崇拜假神的高坛，以及用于崇拜这些假神的画像和雕像。主提到这些事是为了让以色列人专注于祂作为他们的神。然而，如果他们产生分心并拒绝消除它们，主必须警告他们这些事物对他们可能产生的影响。他知道这些事会让他们分心，将他们远离祂。


    > > 但你们若不将当地的居民赶出去；就可以你们所留下的，就必要作你们眼睛的针，作你们肋骨的刺，在你们所住之地烦扰你们（民数记 33:55）。


    没能将这些事从他们的生活中赶出去可能会导致他们失去焦点并带来很多问题。如果我们不处理那些试图分心的事物，或者忽略了 `Spiritual A.D.D.`，这对我们来说也是如此。


    对我们所有人来说，重要的是对这些分心保持警觉，以及它们如何被用来分散对主的注意力。我们中许多人已经准备好与主进一步深探索，并希望对分心更加警觉。问题是：当我们仍然感到这些分心的压力时，该如何经营灵性生活呢？我相信这个方法非常容易应用。这就是我所说的识别并处理分心。


    ## 识别并处理分心


    现在我们已经意识到分心如何让我们偏离主的主线，让我们来识别具体的分心并处理它们。没错，我们可以处理它们！我们不需要忍受那些看似不可动的分心大山和 `Spiritual
    A.D.D.`。


    耶稣教导他的门徒关于处理障碍的有力原则，这对今天的我们依然有效。他指示门徒识别和处理障碍的重要性。耶稣通过指着他们某一天与祂行走时看到的一座真实的山开始说明。


    > > ……我实在告诉你们，你们若有像芥子般的信，就可以对这山说：‘你从这里移到那里去’，它就过去；你们就没有不能的事（马太福音 17:20）。


    '
- fmt: "\nWe address it by speaking to the mountain of distractions or obstacles.\
    \ In other words, by speaking to it, we are not tolerating or ignoring it. We\
    \ are not going around it but addressing it by facing it head on! We are to address\
    \ it by taking a place of commitment, determination, and command as we use our\
    \ faith and authority in Christ to remove its ability to distract us. It is not\
    \ difficult. We can identify and address our mountains or obstacles just like\
    \ Jesus taught His disciples to do.\n\n### Identifying and Addressing Obstacles\n\
    \nTo get started, when you are ready to identify and address your obstacles, ask\
    \ yourself some basic questions. The mountain image often describes how people\
    \ feel when they are dealing with Spiritual A.D.D. They feel like their situations\
    \ are mountains, huge and immovable. If that is how you feel, ask yourself some\
    \ questions to better identify and address the distraction:\n\n* Do I need to\
    \ stop what I’m doing to address this distraction?\n* Does it need to be done\
    \ now? \n* Is it even urgent, or can it wait until another time? \n* Is it important\
    \ or necessary to drop what I’m doing to tend to the distraction? \n* Am I using\
    \ my time wisely? \n* What distractions are stealing my time, keeping me from\
    \ my prayer time, Bible reading, or walk with the Lord?\n\nAsking questions like\
    \ these will help you better deal with distractions and will help you single in\
    \ on the things you may need to change.\n\nAnother way to tell that you are becoming\
    \ distracted is if you start losing focus and even become fidgety. This is usually\
    \ a real problem for those who are suffering from Spiritual A.D.D. When you start\
    \ feeling restless and antsy in prayer, for example, try getting up and moving\
    \ around. Sometimes activity helps bring you back to a place where you can better\
    \ focus.\n\n### Spiritual and Natural Solutions\n\nIf you are dealing with Spiritual\
    \ A.D.D., you need to be encouraged that there are natural and spiritual solutions\
    \ you can apply. Sometimes you need to address the devil, who may be trying to\
    \ distract you. This would be a spiritual solution, and the way to apply it is\
    \ to do what Jesus taught His disciples regarding the mountain. Tell the enemy\
    \ he has no place in your life.\n\nAt other times, your own spiritual apathy could\
    \ be contributing to your distraction because you are so busy in natural things.\
    \ If so, you need to identify what natural things are replacing or affecting your\
    \ spiritual hunger. Is it an overemphasis on some activity, person, place, or\
    \ thing? If it is, then you need to make the necessary steps to bring it into\
    \ order. You do this simply by substituting spiritual things in place of that\
    \ hindrance. You will be surprised how your hunger will return in your Christian\
    \ walk. The important thing is to rise up in your heart, your spirit, and decide\
    \ you aren’t going to let any mountain stand in the way of your victory over Spiritual\
    \ A.D.D. and distractions.\n\nYou deal with spiritual distractions in the same\
    \ way you deal with natural distractions. However, natural distractions can affect\
    \ you not only in natural things but also in your spiritual life if you are not\
    \ careful.\n\n### Practical Considerations for Focus\n\nIf you feel like you have\
    \ a mountain of Spiritual A.D.D. or distractions that you are facing, here are\
    \ some considerations that may help you.\n\nStart with writing down a list of\
    \ things that wants, needs, and absolutes in your life. When you make this list,\
    \ be sure that at the top you have time with God as your first priority. Then\
    \ make note of what things you have to absolutely put first because you can’t\
    \ live without them. Then ask yourself, `What are the things I need to do and\
    \ give quality attention to?` Finally, ask, `What are some things that I want\
    \ but that aren’t necessarily absolute needs?`\n\nAfter you have made note of\
    \ your wants, needs, and absolutes, then make note of your daily and weekly routine\
    \ and responsibilities by creating a schedule. When you do, consider how you can\
    \ better prioritize your time. What are things that could be distractions to this\
    \ schedule? Where are spiritual things listed on this schedule, and how much priority\
    \ are you giving to them?\n\nThis is called clearing your head—when you make a\
    \ list before you go about your time with God. You find it helpful, and it will\
    \ limit distractions before and during your time with God. Making a list of the\
    \ things you need to do, like chores, schedules, work responsibilities, important\
    \ dates, and other things, will keep you better focused and less distracted. This\
    \ is one reason why Jesus said not to put your hands to the plow and look back\
    \ (see `Luke 9:62`). In other words, stay focused on the spiritual tasks at hand,\
    \ and don’t get distracted.\n\nA good farmer can’t plow his field correctly and\
    \ expect a harvest if he’s looking over his shoulder and getting distracted. The\
    \ result would be crooked rows and precious space and time wasted because of distractions.\
    \ Also, if you have been suffering from Spiritual A.D.D., do not look back on\
    \ your frustration or failures, but plow ahead and refuse to focus on the past!\n\
    \nOnce you have written out your schedule and determined to prioritize time with\
    \ God, make sure you have plenty of spiritual things that you are implementing\
    \ in your schedule. Once you put the schedule to use, it is important to make\
    \ a note of what specific things start trying to distract you before you spend\
    \ time with the Lord. Also, it is just as important to do the same thing during\
    \ your regular times with the Lord—making note of things that try to make you\
    \ restless and distracted. You need to ask yourself if these distractions are\
