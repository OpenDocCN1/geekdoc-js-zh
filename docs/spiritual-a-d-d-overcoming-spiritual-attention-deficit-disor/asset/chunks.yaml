- fmt: '

    If they are not addressed within our lives, they can cause us to lose our desire,
    focus, and attention for the Lord or spiritual things. When this happens, we can
    become frustrated, which causes our prayer lives to struggle. We start losing
    interest in the things of God, which causes a downward spiral. This can result
    in our walk with God seeming like it is spinning out of control at times. Day
    after day, we find ourselves struggling to focus on the things of God. We find
    it harder to stay interested in our spiritual lives, sometimes even leaving our
    times with God feeling unfulfilled.


    Does this sound familiar to you and what you might be dealing with? I want you
    to be encouraged because this isn’t the way things have to be. As I mentioned
    before, distractions are one of the main symptoms of Spiritual A.D.D., and when
    they’re trying to run wild in your life, they can be lassoed. One way to rein
    them in and avoid these pesky distractions, distractions, distractions, is to
    take note of the things that often try to distract you.


    # Taking Note of Distractions


    You can take note of distractions by writing them down or making note of them.
    You accomplish this by considering your daily routine, interruptions, and other
    things you may have scheduled. Ask yourself, How are these things influencing
    my spiritual life? In other words, if it is your computer that is distracting
    you, take note of it. Is it pulling you from your time with God by excessive Facebooking,
    e-mailing, Internet searching and shopping, and the like—especially when you are
    trying to spend time with God? Are your devotions often interrupted, or do you
    rarely find time for them because you have to check your computer or look at the
    phone to see who may have texted?


    When we take note of the subtle and obvious things trying to interrupt and steal
    our time, we will better deal with Spiritual A.D.D. When we take note of something,
    it doesn’t mean just recognizing the things distracting us; it is also means choosing
    to do something about it. For example, we could choose to turn the cell phone
    off while praying or choose to spend time with God instead of surfing the Internet
    or watching television all night.


    We need to make note of what things are being pesky distractions that are stealing
    our time from the Lord. It is liberating when we come to realize that we don’t
    have to answer our phones just because we carry them on us, even while we are
    in prayer. We need to be able to have the discipline to turn them off and not
    always treat them like they are crying newborns. (I personally don’t like cell
    phones because people often expect others to always answer their calls or texts
    simply because they have their phones with them.)


    Often the reason some deal with Spiritual A.D.D. in the form of distractions is
    because of poor time discipline and time management. We are told in Scripture
    that we are to use our time wisely, “Making the most of your time, because the
    days are evil” (Eph. 5:16 NASB). This means we are to fight distraction. The problem
    with Spiritual A.D.D. in the form of distractions is that it takes up time and
    energy that can produce a satisfied spiritual walk with God. This is why we are
    told to watch or pay attention to our time and how it is being used.


    As we have seen, distractions can easily be fixed if we will take note of what
    is distracting us and stealing our time. This comes by proper time management
    and establishing the right priorities. Computers, cell phones, television, and
    other modern conveniences can actually become inconveniences if we are not careful.
    They can be enjoyable, but we need to take note of how they are affecting us in
    our spiritual walk. Are they helping us or hindering us by becoming distractions
    that are getting out of control, putting our spiritual lives on the back burner?


    Something else we need to take note of is how much time is being stolen from us
    because of these unwanted or unneeded distractions. If the time we are losing
    is significant, we may need to consider how to better plan out our days and weeks—making
    sure we purposely schedule, prioritize, and guard the things of God. The more
    organized and orderly we are, the more difficult it is for distractions to take
    us off course. In the end, organization leads to a healthy spiritual life and
    helps to overcome Spiritual A.D.D.


    You may be thinking, But I have tried some of these things, and I am still distracted.
    I feel like Spiritual A.D.D. is running my life. If this is you, keep something
    in mind. You have to keep working at your spiritual life, refusing to give up.
    As I have highlighted throughout this book, your heart must be involved in your
    spiritual pursuit. It always comes down to you having a real heart check and commitment.
    This is especially true if you want to bring Spiritual A.D.D. and distractions
    under control. If you want to change, (you guessed it!) it will require you to
    not be halfhearted! Your heart attitude and commitment is so important in winning
    the battle against Spiritual A.D.D.


    I have found true in my life the importance of putting my heart into the things
    of God. In over 25 years of serving God, I have noticed that when I am feeling
    distracted in prayer or Bible reading, which occurs from time to time, it is usually
    because I am approaching this time halfheartedly. However, once I take note of
    it with a simple heart adjustment and time management, it is remedied and things
    return to proper order and balance in my life.


    Let me give you an example of what I mean by putting my heart into something and
    not getting distracted. Jesus knew the importance of getting away to pray without
    being distracted. He was often seen withdrawing Himself from the crowds and the
    many distractions that constantly pulled on Him in order to spend time with the
    Father. “And He withdrew Himself into the wilderness, and prayed” (Luke 5:16).
    I decided to follow the Lord’s example and get away to pray.


    ## My Prayer Retreat Experience


    I started off great, as my spiritual adrenaline began to kick in and I determined
    I would suffer for Jesus. I was all ready to meet with God and spend a weekend
    in a prayer cabin. I determined that all I would bring with me was clothes, a
    sleeping bag, a Bible, a notebook, and some water. These are going to be the best
    days of my spiritual life, I thought. Right? Wrong!


    I prayed at first so long, hard, and fervently. I read my Bible for several hours,
    until I started to get antsy. I found myself constantly getting up, looking out
    the window, going outside for a moment, and then walking back inside to more of
    the Spiritual A.D.D. symptoms that joined my prayer getaway. I lay down, then
    got up, then walked and prayed, then kneeled and prayed. I was starting to really
    get fidgety and bored, feeling like I was experiencing cabin fever. Yet, I hadn’t
    been there that long, maybe a few hours.


    I looked at my watch as it seemed to be moving so slowly and for eternity. I had
    no cell phone, radio, music, or outside modern technology to enjoy. I was suffering
    and miserable. It felt like I had been there for days! It was so bad I finally
    got in my car and went back into town to get a hamburger. What I didn’t realize
    was how much I had gotten used to all the things around me as a regular part of
    my life and routine. Once they were removed, I went into withdrawal, so to speak.
    Now, I am much better and can handle things better than I did then, but that time
    taught me some things.

