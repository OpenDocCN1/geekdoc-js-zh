    > > Therefore, brethren, be all the more diligent to make certain about His calling
    and choosing you; for as long as you practice these things, you will never stumble
    (2 Peter 1:10 NASB).


    We have to be diligent about the things of God and what He has asked us to do
    for Him. In the same way, when you decide that Spiritual A.D.D. isn’t going to
    hinder you anymore, you will have to push yourself, being diligent to take small
    steps to overcome it. Then you will see amazing blessing and breakthroughs in
    your spiritual life like Peter did that night.


    It isn’t usually the big steps that lead to the breaking of Spiritual A.D.D. from
    us but rather the consistent, little-by-little steps that cause us to overcome.
    The Bible says our spiritual growth occurs step by step, little by little with
    consistency. “For precept must be upon precept, precept upon precept; line upon
    line, line upon line; here a little, and there a little” (Isa. 28:10). The consistent
    little choices will cause things to work in our spiritual lives again—like reading
    the Bible again for a few minutes or getting back to being consistent in church
    attendance. Maybe that small step is just planning a little time with God each
    day and gradually increasing its duration.


    It is important to take small, decisive steps when dealing with overcoming Spiritual
    A.D.D. because if we try to take too big of steps at first, we can become frustrated
    if change doesn’t seem to be happening immediately. Change is often a process
    that requires heart, dedication, commitment, and consistency. It is the little-by-little
    daily choices to push ourselves to give God our best, not the giant steps that
    don’t last, that will get us the results we are seeking.


    Remember, Jesus took that small push forward when He prayed in the Garden of Gethsemane.
    We have to be determined like He was and press forward. This determination and
    pushing forward kept Jesus from getting off course and becoming affected by the
    enormous pressure and spiritual attack coming against Him. Through it all, He
    pushed and pressed forward, continuing to seek His Heavenly Father.


    We have to be determined just like that, and each time we feel the pressure to
    quit, we need to rise up and press forward in our spiritual lives by pushing ourselves
    and setting necessary goals to go a little further each time. When we do, it will
    help us to not feel bound or struggle with Spiritual A.D.D. The important thing
    is to never forget that Jesus went forward a little at a time and then to consider
    how far He got! Look at the results! Fighting Spiritual A.D.D. is a process that
    requires consistent, little-by-little steps to overcome.'
