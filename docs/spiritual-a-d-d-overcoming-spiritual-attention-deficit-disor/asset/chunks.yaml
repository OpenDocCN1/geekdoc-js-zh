  trans: "\n\n我们可以采取一些小小的实际步骤，帮助我们在与神的道路上走得更远。在`马可福音`的第 14 章中，当我们觉得灵性生活不如人意，或者正遭受着“灵性注意力缺陷”（Spiritual\
    \ A.D.D.）时，我们可以发现一些实用的工具。让我们来看看耶稣在西马尼园祷告之前和期间生活的简单模式。我将强调一些关键词和事件，当我们渴望前进并取得结果时，可以很容易将其作为原则应用到生活中。这些小小的步骤可以在我们与神的灵性生活中带来巨大的果效！\n\
    \n### 马可福音 14:17-37\n\n1. **设定时间**——“晚晚，他就和那十二个人一同去”（`马可福音 14:17`）。早晨通常是最好的，但也许某个时间更符合你的日程安排。关键在于“设定”一个时间并持之如一。\n\
    2. **先寻求神的国**——“……他就和那十二个人一同去”（`马可福音 14:17`）。12 是一个言性的数字，象征着神的国（祂做事的方式）。当我们寻求并把神的国放在第一位，就会看到结果（参见`马太福音\
    \ 6:33`）。\n3. **经常圣餐**——（参见`马可福音 14:22-25`）。我们可以根据需要经常领主餐（参见`哥林多后书 11:25`）。\n\
    \    * 领饼的五大祝福。耶稣复活后与门子分饼时，发生了五件事（参见`路加福音 24:31-32`）：1）“他们的眼睛开了”——他们获得了启示性的知识；2）“他们认识祂”；3）他们“心里发热”；4）“祂对他们说话”——他们听到了神的声音；5）“祂向他们解释圣经”。作为信徒，我们也可以领这五点。\n\
    \    * 领血的七大祝福——能力、富足、智慧、力量、尊贵、荣耀和祝福（参见`启示录 5:12`）。耶稣作为被杀的神的羔羊领了这七种祝福，现在这些这些作为祂里的合一继承人赐给了我们并供我们使用。\n\
    4. **记得敬拜**——“他们唱了一了诗歌，就到橄榄山去”（`马可福音 14:26`）。正如`以弗弗书 5:18-20`所鼓励的，让敬拜成为你生活的一部分。\n\
    5. **保守内心洁净**——“耶稣对他们说：你们今晚都要因我跌倒了……”（`马可福音 14:27`）。过着一种悔改和宽恕的生活（参见`马可福音 11:25`）。不要产生冒犯或在心中怀恨是非常重要的，因为这会阻碍我们的祷告。因此，我们必须通过保持爱、行圣洁以及避免冒犯和怀恨来保持内心的正直。\n\
    6. **设定地点**——“他们到了一个叫西马尼园的地方……”（`马可福音 14:32`）。建立一个与神见面的固定地方。\n7. **热切**——耶稣在一个名为`西马尼`的园子里祷告，这个词在希腊语中的意思是“榨油机”。这揭示了在祷告中竭尽心力挤压，以使神的能力彰显的重要性。关键在于找到一个你可以热切进入神之同在的地方。\n\
    8. **与人同告**——“……你们坐在这里，我去祷告。他带着彼得、雅各、约翰的去，就极得忧愁，又甚难苦”（`马可福音 14:32-33`）。与人同告是克服“灵性注意力缺陷”的好方法。\n\
    9. **设定祷告目标**——“他往前去了一些，俯伏在地上祷告说……”（`马可福音 14:35`）。继续设定目标，在追求主的过程中每次都更进一步。\n10.\
    \ **抵挡睡睡**——“他回来，见他们睡着了，就对彼得说：西门，你睡着了吗？你不能守一小时吗？”（`马可福音 14:37`）。\n11. **建立一小时**——“……你不能守一小时吗？”（`马可福音\
    \ 14:37`）。通过尝试建立与神恒定的一小时灵修时间来律己自己。尽力避免那种“快餐式、得来速式”的心态，即在五分钟内点完订单就离开的神。\n\n这些都是你可以采取的小步骤，以更好地促自己进入神的深层领域。留意这些步骤也将帮助你更好地准备与神面对面，获得你渴望的结果。\n\
    \n### 你准备好了吗？\n\n另一种在灵性生活中推动自己以便开始看到渴望结果的小小但有效的方法是：做好准备、保持准备，并拒绝沮丧和放弃。这只需要迈出一小步，花点时间做好更好的准备。\n\
    \n当我们没有做好准备和规划时，我们的灵性生活往往会受到影响，尤其是灵修生活。这是因为我们倾向于随意进行灵修而没有做好准备。换句话说，如果我们随意对待时间，我们可能会拖着进入祷告时间却并不期待结果。当这种情况发生时，我们可能会开始想做别的事，而不是花时间做灵性的事。这会导致无聊，并感觉没用。\n\
    \n### 与神见面的准备\n\n神知道为了获得结果，这个简单步骤的重要性。祂告诉摩西要确保百姓准备好。\n\n> 耶华又对摩西说：你叫百姓今日、明天彼此洁净，洗衣服，预备到第三日，因为第三日耶华要在众人面前降在西山上（出埃及记\
    \ 19:10-11）。\n\n这是为了帮助他们与神相处时获得最大的益处。圣经中另一个例子是关于旬乃母妇人的（参见`列王纪下 4:9-10`）。她想为先知以利亚准备一个房间让他与神见面。祂经常来，但她想要增加祂与神特别相处的机会。她通过准备房间来实现这一点。这些同样的事情也可以帮助我们推动灵性生活向前。当我们做好准备时，就可以把“灵性注意力缺陷”抛在脑后了！\n\
    \n"
