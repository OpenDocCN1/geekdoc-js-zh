    这个故事描述了当时我在祷告和灵性生活中所经历的挣扎。如果大多数人，甚至是道道，能够诚实，他们也会承认自己有时会在方面感到挣扎。我与主的关系很好，并勤切寻求祂；然而，我写这个主题的目标是对你们保持透明，以帮助任何可能正在遭受“灵性
    ADHD”（Spiritual A.D.D.）的人。


    ## 灵性 A.D.D. 的症状


    你可能会问自己：灵性 A.D.D. 的症状是什么？我有吗？为了了解这个问题是否存在于你的生活中，你需要知道它的症状。识别这些症状其实很容易，因为灵性 A.D.D.
    的许多症状与为人知的疾病 A.D.D. 相似，只不过是在灵性层。真的可能存在像 A.D.D. 这样的东西能以如此相似的方式影响你的灵性吗？是的，绝对可以！一旦被识别，它是可以治疗的。你将在书中发现如何识别这些症状，以及如果你已经受到影响该怎么办。


    我们知道 A.D.D. 不是开玩笑的，它正影响着今天的许多人。灵性 A.D.D. 也如此，它正影响着许多基督徒。为了帮助你更好地理解灵性症状，我将观察 A.D.D.
    的自然症状，并进行灵性上的类比。


    在我们灵性生活中开始发生的一些常见现象，可能表明我们正受到灵性 A.D.D. 的影响，包括遗忘、注意力分散感以及无法抵抗干扰。我们可能会因注意力不集中而挣扎，或开始拖延，无法完成已经开始的事情。我们可能也会变得越来越无章。这些只是可能表明我们需要处理自己的灵性生活的几点。


    为了更好地帮助你理解，我包含了一份更完整的 A.D.D. 症状列表。这些通常是医学诊断的 A.D.D. 案例的关键症状，也可以适用于灵性 A.D.D.。


    *   注意力分散

    *   难以集中注意力

    *   无章

    *   难以专注和投入注意力

    *   遗忘

    *   遵循指示困难

    *   拖延症

    *   难以完成项目

    *   坐立不安（感到心躁不宁、焦虑）

    *   时间管理问题和迟到

    *   东西放错位置和难以记忆

    *   思绪飞快和大脑游离

    *   频繁感到无聊

    *   情绪波动

    *   缺乏自控


    这份 A.D.D. 症状列表虽然不全面，但可以帮助你更好地识别你的灵性生活中可能发生了什么。它也能帮助你识别什么可能是导致你对神的事物感到挫败、挣扎或无聊的原因。


    ## 类比


    通过观察 A.D.D. 的症状，可以得出许多类比，说明我们的灵性生活是如何受到影响的。尽管 A.D.D. 通常与灵性生活没有联系，但如果我们允许，它就会跨界影响我们的灵性生活。这些
    A.D.D. 症状可能会让我们在灵里变得失效，使我们感到沮丧、无聊、疲惫且灵性散漫。


    让我们再次看看列表，将其与我们的灵性生活进行对比：


    ### 注意力分散

    *   难以集中注意力

    *   难以专注和投入注意力

    *   坐立不安（感到心躁不宁、焦虑）

    *   思绪飞快和大脑游离


    我们在祷告时可能经历过这些情况。如果我们难以集中注意力，我们的大脑就会游离，我们费力寻找祷告的词汇。我们可能会发现自己在看表，或者以一种坐立不安、躁动或焦虑的方式移动。在读圣经时，我们的大脑可能倾向于游离，所以我们并不真正理解所读的内容。我们可能开始祷告或追求神的事物，但随后就停止了，因为我们更想做别的事，并且发现很难专注于神。如果是这样，我们就让干扰战胜了我们。


    ### 无章

    *   遗忘

    *   拖延症

    *   难以完成项目


    如果我们似乎永远找不到为神留的时间，而神的时间经常被其他不重要的事情取代，那么我们的灵性生活可能就是这种情况。我们是否让生活的忙碌导致我们无章，导致与神之间很少或完全没有定期的交流？我们可能在某天决定将神和祂的灵性事务视为首要，但很快拖延症就会袭，直到灵性上的事务几乎不存在。这可能导致自责和沮败，使得难以完成或继续下去。


    ### 遵循指示困难

    *   时间管理问题和迟到

    *   东西放错位置和难以记忆


    我们生活的忙碌和灵性专注的缺乏可能开始影响我们的灵性生活、我们的信念以及我们作为基督徒的行为方式。如果是这样，我们可能不再认为需要去捍卫或维护我们曾经立足的事物。这可能发生在我们没有遵循圣经的指示，并且没有首先寻求祂的国和祂的义时。我们可能会在每日灵修和每日的道路中挣扎，仅仅是因为我们的时间管理没有在一天的开始和在万事上将神放在第一。


    随着时间的推移，我们可能会变得越来越忘记神，我们的心可能会变得冷漠并离祂疏远。当这种情况发生时，我们的灵性生活就发生了变化——改变了我们作为完全委身给主和祂旨意的人应当如何生活的方式。如果我们发现自己经常弄丢圣经，可能可能是因为我们没有读神的话，或者没有刻意将其在我们的生活中视为首要。


    ### 无聊产生得容易

    *   情绪波动

    *   缺乏自控


    问自己很重要：我的灵性生活是否正变得枯燥乏味？它是否缺乏专注和自？我是否必须费力去祷告、读圣经或去教会？如果我们不留心，可能会出现情绪波动和肉体态度，导致肉体主宰了我们的灵。这并不是意味着偶尔无聊或需要控制肉体就是灵性
    A.D.D.。相反，当这些情况频繁发生（或频率增加）时，它们是灵性 A.D.D. 的指标。


    我希望你开始看到，通常与 A.D.D. 相关的症状列表是如何类似于灵性 A.D.D. 的，这可能会阻碍你的灵性生活和成长。我并没有称自己是医生或 A.D.D.
    专家。但我可以回顾自己的生活，以及我在灵性事务的干扰、灵性无聊、难以专注于神以及灵性疲惫方面偶尔所面对的问题，仅举几例）。通过考虑这个列表，可以得出 A.D.D.
    与灵性 A.D.D. 之间的许多简单真理和类比。


    当然，被诊断出有 A.D.D. 的并没有灵性 A.D.D.。反之亦然。如果人们灵性生活中出现这些症状，他们不应该假设自己有 A.D.D. 并需要被那样诊断。这种比较仅仅是为了让你检查自己，并看看你在追求与神建立回报性灵性生活时，阻碍或让你沮败的可能来源。


    现在是考试了。为了确定你是否需要处理和治疗灵性生活中的这种状况，这是一个健康且必要的测试。关键在于愿意检查自己。


    ## 自省


    对于我们中的一些人来说，承认自己可能有灵性 A.D.D. 甚至愿意检查自己以确定我们的灵性状态可能并不容易。然而，圣经说，我们要检查自己，作为基督徒生活的一部分。“你们要验自己是否在真道上；要可用自己……”（哥多后书
    13:5）。


    '
