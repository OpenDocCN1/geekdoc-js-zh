    这正是耶稣在讲述一个法利赛人的故事时所指的，那人做自义的祷告，夸耀自己的义，却审判他人的行为。他拒绝审视自己。在同一个故事中，耶稣提到了另一个人，那是一个税人和罪人，他审视了自己的内心、动机和生活方式，捶胸祈求上帝的怜悯和宽恕（参见路加福音
    18:9-14）。耶稣通过这个故事想表达的观点是：人们往往会指责别人的错误，却不审视自己的生活。


    同样，考虑到这一点，铜水盆可以预言性地应用在今天的我们身上，表明我们都需要审视自己，以确保我们在全能上帝面前正按照我们应当的方式生活！我们今天必须审视自己，通过自省在属灵上洗净手脚。为什么是手和脚？因为手预言地代表了我们为上帝的事奉和工作，这必须是洁净的；脚预言地代表了在上帝面前洁净、专注且有目标的行走。


    如果我们想要过上更深、更亲密的方式追求上帝的生活，自省也是必不可少的步骤。我们必须愿意审视自己、我们的内心以及我们的属灵状况。未能这样做往往会导致我们陷入“属灵多动”（Spiritual
    A.D.D.）的陷阱。你对自己属灵状况越诚实，就越容易从生活中消除这些症状。你是否在审视自己的手，以完全事奉上帝？你是否真的在全心投入中以令祂喜悦的方式行走？


    我发现，我对自己的内心以及对待上帝和属灵事务的方式越诚实，就越容易抵抗“属灵多动”的症状。我是通过强迫自己追求上帝、阅读我的`Bible`、祷告并去教会，无论我的感觉如何。我让自己在面对上帝时保持充满喜乐的态度和生活方式。追求祂不是我被迫去做的事，而是我想做的事；是我喜欢做的事！记住，主所喜乐就是你们的力量，在神面前有意外满溢的喜乐（参见尼米雅记
    8:10；诗篇 16:11）。


    这就是为什么诚实并面对自己如此重要，就像祭司们看向铜水盆时所做的一。它可以防止“属灵多动”在你的生活中扎根。经常自省和属灵检查非常重要，这能防止你滑向一个毫无成效且令人沮丧的属灵状态。它还能打破敌人利用你生活中的“属灵多动”的能力。


    上帝要求我们自省，检查并保持我们属灵生活的整洁。进行属灵检查并抵制那些想要阻碍和负面影响我们属灵之行的事物是我们的责任。上帝正在等待我们展现内心的想法。祂正观察我们将如何处理那些让“属灵多动”在我们生活中扎根的事。


    这就是主在`士士记 7` 章中对基甸和他的军队所做的。祂想看他们内心有什么，以及他们有多种程度的属灵投入。他们相信主会为他们争战吗？上帝采取此的方法之一类似于摩西幕布中使用的铜水盆。上帝再次利用水作为自省的反映来使他们接受测试。祂让他们看向水并面对自己。这以后将揭示他们生活中缺失的某些东西，以便赢得即将面临的战斗。这水测试水最终将揭示他们真实的内心和焦点。它将那些分心的人与那些专注且决绝的人分开，使他们能够击败敌人。


    以色列有 32,000 人跟随基甸对抗米甸人，圣经说米甸人多如如蚂虫和海滩的沙（参见士士记 7:12）。尽管他们的人数明显少于对方，但上帝仍然坚持基甸的军队“太多了”，以至于祂无法将米甸人交在他们手中（参见士士记
    7:2）。他们可能想：“太多了，上帝，你确定吗？”主知道祂在做什么。祂将以一种超自然的方式击败他们！为了在生活的战斗以及你感到正针对你的事物中获胜，你必须避开借口和分心。


    上帝测试了人们的心，看谁是专注并将心投入顺服祂的。结果导致其中 22,000 人离开，因为他们害怕敌军的规模。现在，基甸的军队中仅剩下 10,000 人战斗了！即便如此，上帝仍然想要那些专注并拥有不同精神、不会轻易被分心的人。祂通过带他们来到水边测试了留下来的人。为什么要用水？目的是为了自省，看他们内心隐藏什么，焦点在哪里。他们会相信上帝会击败他们的敌人吗？


    > 于是基甸就领人到水边。耶和华对他说：“把像狗一样用舌舔水的人，和跪下喝水的人分开。”有三百人用手捧口舔水。其余的人都跪下喝水。耶和华对基甸说：“这三百个舔水的，我必救你，把米甸人交在你手中。其余的人就各回自己的地方去。”（士士记
    7:5-7 和合）。


    上帝通过他们喝水的方式带来了一种分开。

