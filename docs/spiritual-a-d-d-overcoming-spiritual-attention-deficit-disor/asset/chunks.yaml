    He spoke that wonderful phrase—that I didn’t want to hear. He said, “Hank, why
    are you making this ado?” I knew the Lord was quoting from this verse we have
    been looking at in Mark chapter 5, when Jairus’ daughter had died and people were
    creating a very loud, emotional scene. “And when He was come in, He saith unto
    them, Why make ye this ado, and weep?…” (Mark 5:39). I personally haven’t met
    anyone who uses the word `ado`. Yet, I knew what the Lord was referring to with
    me and what it meant in modern terminology. Today we might say to someone who’s
    making an ado, “Why are you freaking out or getting all worked up?”


    This is exactly what I was doing! I was carrying on with a bad attitude, weariness,
    and a real mentality of defeat. I didn’t think that things were working in my
    life, and I wanted to have an attitude about it. This is the danger when we feel
    like we are dealing with the symptoms of Spiritual A.D.D. We can start to resort
    to making an ado! Sometimes we think carrying on or walking around in a spiritual
    stupor will somehow get God’s attention or cause the problem to just go away on
    its own.


    However, I have learned that we have to do what Jesus did that day at Jairus’
    house. He had to confront the ado. He did this by making all the people leave
    who were making a loud scene of crying and unbelief. They were laughing at Jesus
    in a way that was belittling Him and mocking Him. They were convinced that raising
    this girl from the dead wouldn’t work and He was just wasting His time. However,
    the Lord wouldn’t let it distract Him from having a miracle breakthrough.


    > And they laughed Him to scorn. But when He had put them all out, He taketh the
    father and the mother of the damsel, and them that were with Him, and entereth
    in where the damsel was lying (Mark 5:40).


    The Lord responded to this display of ado in the same way we need to treat Spiritual
    A.D.D. He confronted it, didn’t tolerate it, and put it out of the house. This
    is exactly what we need to do! We can’t just ignore it, complain about it, or
    get all emotional. We have to decide today to rise up and see ourselves enjoying
    spiritual lives that are full of spiritual vitality and results. We need to do
    what Jesus did with those who are making ado; He showed them the door to leave.
    We need to be determined that Spiritual A.D.D. has to go from our lives! When
    we do, we will see our spiritual lives come to life like Jairus’ daughter! We
    have to be willing to work for it and push ourselves to go deeper, just like Peter.


    If you will refuse to quit, like Jesus, and press on to go further in your walk
    with God until you see results, you will find what you have been seeking. I encourage
    you to rise up, try again, and say, “No pity parties here!” I encourage you to
    keep resisting the temptation to quit or feel sorry for yourself. If you are struggling
    with Spiritual A.D.D., establish a `no ado` policy! If you do, I am certain that
    your prayer life will work, and your spiritual life will be reenergized.

