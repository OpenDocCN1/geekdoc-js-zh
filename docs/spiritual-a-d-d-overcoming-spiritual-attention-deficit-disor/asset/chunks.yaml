  raw: 'We now have available to us this powerful blood of Jesus that renews and protects
    our minds against the devil’s attacks. This means that our minds don’t have to
    be garbage pails for the junk of this earth or open doors for the enemy’s distracting
    thoughts. Our minds have been purchased by the precious blood of Jesus! However,
    because we live in this world and our minds are affected every day, we need to
    renew our minds through God’s Word and presence. We need to put a spiritual rein
    on our minds that will help us keep our thoughts subject to the knowledge of God.
    We can do this through the power of Jesus’ blood and through putting our whole
    hearts into seeking Him.


    I pray you are seeing just how powerful your spirit is and how important it is
    to submit your will to Him. As you have been reading, I hope you have seen the
    success in your spiritual life that can be obtained to defeat Spiritual A.D.D.
    This success is especially possible when you are doing things with all your heart.
    Putting your heart into something is all about choice. It is called heart attitude,
    and it keeps your mind from getting in the way of your time with God. Defeating
    Spiritual A.D.D. and having an enjoyable spiritual life usually comes down to
    a few decisions and steps. It often comes down to the distance of just a few inches—the
    distance between your head and your heart.


    Jesus pointed this out in Mark chapter 12 when He told a scribe that he was not
    far from the Kingdom of God. He said this after seeing him intelligently answer
    His question regarding what is the greatest commandment. “When Jesus saw that
