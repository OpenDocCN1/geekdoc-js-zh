- fmt: '

    This story describes the struggle that I had been having in my prayer life and
    spiritual life at that time. If most people, even preachers, were to be honest,
    they would admit they have struggled with this at times as well. I have a great
    relationship with the Lord and seek Him diligently; however, my goal in writing
    on this subject is to be transparent with you in order to help anyone who may
    be dealing with Spiritual A.D.D.


    ## Symptoms of Spiritual A.D.D.


    You may be asking yourself, What are the symptoms of Spiritual A.D.D., and do
    I have it? In order to understand if this problem is in your life, you need to
    know the symptoms. Recognizing the symptoms is pretty easy since Spiritual A.D.D.
    has many of the same symptoms as the well-known medical condition of A.D.D., only
    in a spiritual sense. Could there really be something like A.D.D. that can affect
    you spiritually in much the same way? Yes, absolutely! And it can be treated when
    recognized. You will find out in this book how to recognize the symptoms and what
    to do if you have been affected.


    We know that A.D.D. is not a laughing matter and that it affects many people today.
    Neither is Spiritual A.D.D., and it is affecting many Christians. To help you
    better understand the spiritual symptoms, I am going to look at the natural symptoms
    of A.D.D. and draw spiritual parallels.


    Some common things that begin to happen in our spiritual lives that may indicate
    we are being affected by Spiritual A.D.D. are forgetfulness, feelings of distraction,
    and inability to fight distraction. We may struggle with poor concentration or
    start to procrastinate, failing to finish what we have started. We may also become
    more and more disorganized. These are just a few things that could indicate we
    may need to address our spiritual lives.


    To better help you understand, I have included a more complete list of symptoms
    of A.D.D. These are often the key symptoms of a medically diagnosed case of A.D.D.
    and can be applied to Spiritual A.D.D. as well.


    *   Distractions

    *   Difficulty concentrating

    *   Disorganization

    *   Difficulty focusing and paying attention

    *   Forgetfulness

    *   Problems following directions

    *   Procrastination

    *   Difficulty finishing projects

    *   Restlessness (feeling fidgety and antsy)

    *   Problems with time management and lateness

    *   Misplacement of things and difficulty remembering

    *   Racing thoughts and a wandering mind

    *   Frequent boredom

    *   Mood swings

    *   Lack of self control


    This list of A.D.D. symptoms, though not comprehensive, can help you better identify
    what may be happening in your spiritual life. It also can help you recognize what
    might be causing frustration, struggle, or boredom concerning the things of God.


    ## Drawing Parallels


    Many parallels can be drawn as to how our spiritual lives can be affected by looking
    at the symptoms of A.D.D. Even though A.D.D. isn’t usually associated with spiritual
    life, it can cross over to affect our spiritual lives if we let it. These symptoms
    of A.D.D. can render us spiritually ineffective, making us frustrated, bored,
    tired, and spiritually sloppy.


    Let’s look at the list again, comparing it to our spiritual lives:


    ### Distractions

    *   Difficulty concentrating

    *   Difficulty focusing and paying attention

    *   Restlessness (feeling fidgety and antsy)

    *   Racing thoughts and a wandering mind


    We may have experienced these things when praying. If we are having difficulty
    concentrating, our mind wanders and we struggle to find the words to pray. We
    might find ourselves watching the clock or moving around in a restless, fidgety,
    or antsy manner. When reading the Bible, our minds might tend to wander, so we
    don’t really comprehend what we are reading. We may start praying or pursuing
    the things of God, but we stop because we would rather do something else and we
    find it hard to focus on God. If so, we let distractions get the better of us.


    ### Disorganization

    *   Forgetfulness

    *   Procrastination

    *   Difficulty finishing projects


    This may be the case in our spiritual lives if we can never seem to find time
    for God and God’s time is often replaced with something else less important. Do
    we let the busyness of life cause us to be disorganized, resulting in little to
    no regular time with God? We might start one day determining to make God and His
    spiritual things a priority, but soon procrastination sets in until spiritual
    things are almost non-existent. This can result in self-condemnation and frustration,
    which make it difficult to finish or continue.


    ### Problems following directions

    *   Problems with time management and lateness

    *   Misplacement of things and difficulty remembering


    The busyness of our lives and the lack of spiritual focus may start to affect
    our spiritual lives, our convictions, and how we conduct ourselves as Christians.
    If so, we may no longer see a need to defend or uphold the things we once stood
    for. This can happen when we aren’t following the directions of Scripture and
    aren’t seeking first His Kingdom and His righteousness. We may struggle with our
    daily devotions and daily walk simply because our time management isn’t putting
    God first at the beginning of the day and in all things.


    Slowly, over time, we can become more and more forgetful of God, and our hearts
    can grow cold and distant from Him. When this happens, a change takes place in
    our spiritual walk—in how we should be living as one sold out to the Lord and
    His purposes. If we find ourselves constantly misplacing our Bibles, it is probably
    because we aren’t reading God’s Word or making a point to make it a priority in
    our lives.


    ### Boredom comes easily

    *   Mood swings

    *   Lack of self control


    It is important to ask ourselves, Is my spiritual life becoming boring and mundane?
    Does it lack attention and self control? Do I have to muster up the feeling to
    pray, read the Bible, or go to church? If we aren’t careful, we might have mood
    swings and fleshly attitudes, resulting in our flesh overruling our spirits. This
    is not implying that occasional boredom or the need to control our flesh is Spiritual
    A.D.D. Rather, these are indicators of Spiritual A.D.D. when they are a frequent
    occurrence (or are increasing in frequency).


    I hope you are beginning to see how the list of the natural symptoms often identified
    with A.D.D. parallels Spiritual A.D.D., which may be hindering your spiritual
    life and growth. I am not claiming to be a medical doctor or an expert on the
    condition of A.D.D. But I can look at my own life and what I have dealt with at
    times regarding distractions in spiritual things, spiritual boredom, difficulty
    concentrating on the things of God, and spiritual tiredness, just to name a few.
    Many simple truths and parallels between A.D.D. and Spiritual A.D.D. can be drawn
    by considering the list.


    Of course, people who have been diagnosed with A.D.D. don’t have Spiritual A.D.D.
    The converse is also true. If people have these symptoms in their spiritual lives,
    they should not assume they have A.D.D. and need to be diagnosed as such. This
    comparison is simply to get you to examine yourself and look at the possible source
    of the things hindering or frustrating you in your pursuit of a rewarding spiritual
    life with God.


    Now it’s time to take the exam. It is a healthy and necessary test to determine
    if you need to address and treat this condition in your spiritual life. The key
    is to be willing to examine yourself.


    ## The Self-Exam


    For some of us it may not be easy to admit we could have Spiritual A.D.D. or even
    be willing to examine ourselves to determine our spiritual condition. However,
    Scripture says that we are to examine ourselves as a part of our Christian walk.
    “Examine yourselves, whether ye be in the faith; prove your own selves…” (2 Cor.
    13:5).

