    [INTRODUCTION](#index_split_006.html_filepos5131)


    I never thought about writing a book on Spiritual


    A.D.D. before. In fact, I didn’t really even quite know if there was such a thing.
    It wasn’t until I heard an advertisement on television describing people with
    the symptoms of what is commonly known as A.D.D., or attention deficit disorder,
    that I began to realize that a similar experience can affect people spiritually.
    I started to notice the symptoms described on television in people I counseled,
    such as loss of attention, restlessness, difficulty focusing, distractions, disorganization,
    a wandering mind, boredom, tiredness, and the like. I started to draw many parallels
    between A.D.D. and Spiritual A.D.D.


    The thought soon occurred to me, I need to write a book that helps people who
    are dealing with these spiritual symptoms in their Christian walk. I always like
    to help people and especially connect them to God. I thought writing a book like
    this would be such an easy task—was I wrong! Though I have authored several books
    before, I have never had a more difficult time putting together what I thought
    would be a simple manuscript. I was dealing with Spiritual A.D.D. myself in trying
    to write it. In fact, even the way this manuscript was written is different from
    how I normally write. I was writing a little in each chapter, skipping around,
    and struggling with a mountain of distractions. However, in the end, I believe
    I have put together a life-changing book that will help many!


    As you read this book you will be challenged to examine yourself and get honest.
    It will make you laugh, possibly cry, and I am prepared if you decide to get angry
    and throw the book. Yet, if you stay with the journey through these pages, your
    spiritual life with God will deepen in an amazing way.


    What I didn’t realize until I began to pen the pages of this manuscript was how
    much in my own life, in over 25 years of serving God and nearly as many in the
    ministry, I too have dealt with the symptoms of Spiritual A.D.D. from time to
    time. I always like to write from experiences, sharing real life stories, whether
    they are mine or someone else’s. I pray you, the reader, will find that refreshing
    and encouraging as you examine your life regarding whether Spiritual A.D.D. has
    a grip on you. Go ahead; start turning the pages. I believe when you reach this
    book’s final page, you will be glad you did!


