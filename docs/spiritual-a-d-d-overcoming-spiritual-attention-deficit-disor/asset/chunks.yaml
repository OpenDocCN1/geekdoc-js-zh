  trans: '


    我所说的不是一种疯狂的新型舞蹈热潮，而是一种影响你的精神、灵魂和身体的属灵行动。圣经告诉我们要摇动自己。“你要从尘土中摇出来；起来，坐下吧，耶路撒冷！从你项上的束缚中脱出来，被掳的女儿”（赛亚书
    52:2）。


    ## 属灵觉醒的必要性


    抖掉尘土！你知道那本久久没读、落满灰尘的圣经。那么对于寻找、加入和参与良好教会那种落满灰尘的缺乏投入又是怎样的呢？抖掉那些压抑着你、导致你犯罪并陷入属灵冷淡的世俗尘埃又如何呢？无论你的生活中允许了什么样的尘埃，都需要把它们抖掉！


    我们需要按照这节经文所说的，将这些事情从身上抖掉，把自己从那些试图导致疲劳、无聊和属灵冷淡的事物中解出来。我们该如何做呢？有时我们必须字面上地摇动自己，以防止在属灵上睡着或变得萎靡。这可能发生在祷告中，被称为属灵的沉重：“……用赞美换换忧愁的华……”（赛亚书
    61:3）。


    ## 理解忧愁灵


    这种沉重发生在我们投入属灵事务中时，或是作为我们属灵状态的一个方面，它可能是邪恶的忧愁灵。正如耶稣提到的，这种灵想要在我们的生命里撒麦子，并通过在属灵注意力缺失（Spiritual
    A.D.D.）中常见的沉重来实现。战胜这种忧愁灵的方法之一就是赞美和敬拜上帝。敬拜的生活有助于增强我们，并让敌人的属灵阻碍消失。


    我们在扫罗王身上找到了这个例子。当他疲倦并受到敌人攻击时，只有大卫在扫罗王面前献给主的敬拜和赞美让他重新焕发精神，并让恶灵离开了。


    > 每当神的苦毒灵搅扰扫罗时，大卫就弹琴。扫罗就觉得好些了，苦毒灵也离开了（撒母耳上记 16:23 NLT）。


    我鼓励你放一些基督教赞美音乐，开始敬拜主。不要害怕面对那种忧愁灵，并告诉它离开你的生活！


    ## 抖落自己的实用方法


    在其他时候，你可能需要花点时间抖自己（当然，不是伤害自己）。我知道这听起来可能很傻。请不要误解我，但有时在自己的祷告时间，我必须字面上摇摇手、摇摇头，并跳跳跳来清醒。我做的另一一件事是原地站几分钟，开始敬拜上帝，或用我的全心、灵魂和灵尽可能地在灵里祷告。我指的不是要吵醒邻居或吓跑猫，我说的是一种狂热和决心，去激励我的灵，并让我的身体和灵魂也这样做。这就是保罗使徒提到他如何把自己振奋起来时所指的。


    > 所以，我奔跑不像不像乱跑的人；我打仗不像打空拳的人。不，我击打自己的身体，叫它服我，免得我别人传道以后，自己却为那奖赏被丢弃（哥林多后书 9:26-27
    NIV）。


    这是保罗所谈论的过程，它并不需要肉体的折磨！相反，你可以通过行走、踱步、站立和抖动来采用这种振奋自己的方法。这与其说是身体上的抖动，不如说是一种激励自己的决心，以打破属灵注意力缺失导致的属灵昏睡。《圣经信息译本》（The
    Message translation）说，保罗振奋自己是为了防止自己打瞌睡！“我不会打瞌睡，把一切都告诉了别人，结果自己却掉了队子”（哥林多后书 9:27
    MSG）。抖动自己是一种自律，是一种决心，去抵抗那些试图偷走你属灵生命道路的事物。它是诚切地祷告，并专注于你为主祷告、敬拜或所做的事。这能防止你睡着。


    这就像运动员在赛前：他们花几分钟通过移动头、手和身体来抖动自己。这让他们保持放松并帮助他们专注。“我操练我的身体，像运动员一样，训练它去做应当做的事”（哥林多后书
    9:27 NLT）。


    ## 培养独立的属灵力量


    如果你正在挣扎，为什么不直接开始敬拜上帝呢？试着进入祂，无论你那个时刻听起来或感觉如何。结果将将与扫罗王发生的情况一样。它让你重新焕发，让敌人离开，并带走你身上的沉重和负担！


    我想指出的大卫（未受恶灵影响）与扫罗（受压迫）之间的一个关键区别是，大卫不需要任何人成为他的属灵拉拉队或敬拜领。需要这些并不是错，但当你学会自己发展力量时，真正的属灵力量就会产生。大卫能够独自一人通过进入上帝来实现这一点，不像扫罗王需要别人来帮助他敬拜、赞美、经历上帝并获得属灵突破。


    正如我之前说的，有时属灵注意力缺失可能来自魔鬼，也称为忧愁灵。我们需要把它抖掉。这就是保罗在使徒行传 28 章中发生的事，他被一条咬在他手上的蛇咬了。


    > 保罗捡了一捆木柴，放在火里烧。一条毒蛇从火里钻出来，咬在他的手上（使徒行传 28:3）。……保罗就把那蛇抖入火里，并没有受伤害（使徒行传 28:5）。


    ## 避免属灵注意力缺失的贴士


    你准备好抖掉它了吗？这里有一些你可以考虑以防止自己睡着的方法：


    - **充足的休息**：尽可能保持正常的睡眠计划和作息。未能做到这一点是人们遭受属灵注意力缺失的主要原因之一，这能让他们在与上帝相处时专注。

    - **花点时间清醒**：洗澡、洗脸、看天气预报、喝杯热咖啡或做一些其他提神的活动。这对有些人来说，比在疲倦时直接进入与上帝相处更有帮助。短暂的清醒可能比你想象的更有用。我的妻子布伦达开玩笑说，她刚醒时无法和任何人说话，甚至包括上帝。她喜欢用新鲜咖啡开启的一天。

    - **在光线充足的地方灵修**：祷告时保持灯光开启，因为黑暗时更容易睡着。改变祷告地点和作息可能很有帮助，并给你需要的鼓励。

    - **放一些赞美音乐或背景音**：背景噪音有助于保持清醒，又不会分散。

    - **尝试新的祷告姿势**：尝试有助于清醒的姿势，如行走和踱步。在舒适的床上祷告可能并不明智。再次，尝试不要在第一次祷告时就“伏在主面前”。下床，从行走、踱步、跪下或坐在充足的光线下开始，以保持警觉。

    - **大声朗读经文**：选择符合你处境的经文。这也是与耶稣祷告的一种方式，用祂的话祷告。'
- fmt: '

    # 7. Get a prayer partner to help you in your prayer life


    This is what Jesus tried to accomplish in the Garden of Gethsemane. “Could you
    not pray with Me?” Jesus said this to the disciples (see `Mark 14:37`). Pray with
    a friend, either on the telephone or in person. It is a great way to keep you
    awake and hold yourself and another person accountable to pray.


    Now that you have either tried or are considering some of these things, you are
    ready to rise up and defeat Spiritual A.D.D. in your life, especially spiritual
    fatigue!


    ## Stir Yourself Up


    If we are going to shake off and defeat Spiritual A.D.D. in our lives, it will
    require spiritual determination. David modeled such determination in `Psalm 132`.


    > Surely I will not come into the tabernacle of my house, nor go up into my bed;
    I will not give sleep to mine eyes, or slumber to mine eyelids, until I find out
    a place for the LORD, an habitation for the mighty God of Jacob (Psalm 132:3-5).


    David was determined that nothing would stop him from being in the presence of
    God. He stirred himself up, saying that he wouldn’t slumber or sleep until he
    found a place for the Lord. He definitely wasn’t going to stay in spiritual neutral;
    he was in high gear in his pursuit of the Lord. This is the same kind of determination
    that we need to stir ourselves up in the things of the Lord.


    This kind of determination is a great way to defeat Spiritual A.D.D., tiredness,
    and spiritual apathy. It requires learning how to shift gears from a life in neutral
    to a life running in a higher gear of spiritual fervency and pursuit. It is called
    stirring yourself up. It keeps you from remaining in neutral, not going anywhere
    or accomplishing what you want for the Lord. This shifting of gears comes through
    the decision to stir yourself up, regardless of how you feel.


    Stirring yourself up and shifting spiritual gears is like learning to drive a
    car with a stick and clutch. In order to reach your desired destination, you can’t
    stay in neutral, and you need to know how to shift the gears at the proper time.
    It is also important, if you want to go faster and farther, to know how to shift
    into a higher gear when needed.


    When I first learned to drive a standard transmission, which requires manually
    shifting gears, it was no easy task for me, as I am not always the most coordinated
    person. It was a real challenge. In fact, my wife, Brenda, had to teach me. We
    were engaged at the time, and she had her hands full trying to teach me, especially
    since I can be determined in my own ways. I wasn’t doing well learning on her
    car, and I even ruined the radiator by overheating it. It wasn’t long after this
    that she finally asked her dad to teach me instead. That was over 20 years ago,
    and I am happy to say that I know how to drive a stick with ease today. In fact,
    I love driving antique cars that have standard transmissions and require me to
    shift from gear to gear.


    The point of this story is that it took me some time, at first, to learn how to
    shift from neutral to first and then go from gear to gear without jerking, stalling,
    and damaging the car. The same is true in the spirit and in attempts to overcome
    Spiritual A.D.D. You might jerk, overheat, stall, and feel like quitting—all the
    same things that may happen to a person learning to drive stick. The moment you
    decide to get it into gear and really prioritize the Lord, prayer, Bible reading,
    going to church, and your spiritual life in general, you may feel like you’re
    learning to drive stick in the spirit.


    “Stick” with it; you will be glad you did! If you will stick with it, the Lord
    will help you shift from neutral into gear until you are running smoothly on all
    spiritual cylinders. He is also excellent at teaching you when to slow down and
    when to speed up. He knows how to teach you to not grind your spiritual gears
    in frustration, causing damage to your spiritual life.


    How do you apply this to your life, and just how do you shift into gear from a
    life of Spiritual A.D.D.? You have to stir yourself up! That is how you shift
    spiritual gears. This is exactly what the apostle Paul told his young protégé,
    Timothy—to stir himself up, especially in the gifts of God.


    > Wherefore I put thee in remembrance that thou stir up the gift of God, which
    is in thee by the putting on of my hands (2 Timothy 1:6).


    We have to stir ourselves up! The responsibility is on us to stir ourselves up,
    and there are many ways to do it. It starts with a return to spiritual fervency,
    which gives a powerful victory against Spiritual A.D.D.! We are told in Scripture
    that we need to live our Christian lives in spiritual fervency. “Never be lacking
    in zeal, but keep your spiritual fervor, serving the Lord” (Rom. 12:11 NIV). This
    means we have to press in with fervency if we want spiritual victory and success.


    In order to do this, stir yourself up by trying to put more heart, emotion, and
    spirit into your prayers and overall Christian attitude. God is waiting and expecting
    you to shift gears and stir yourself up, avoiding spiritual sleep and slumber.
    “And there is none that calleth upon Thy name, that stirreth up himself to take
    hold of Thee…” (Isa. 64:7).


    When we press into God with a determination and excitement about spiritual things,
    it stirs us up and brings proper balance to our lives. When making Kool-Aid, if
    we add the Kool-Aid packet and a whole bunch of sugar to the water, but don’t
    stir it, the contents will fall to the bottom and it won’t taste good. The same
    way, spiritually speaking, we need to stir our up. Once we stir the Kool-Aid,
    it tastes better, looks better, and can be enjoyed. Take a few minutes to stir
    your heart up; focus on the Lord and pick up that Bible. Start shifting and you
    will make it to the finish line!


    ![](images/0007.jpg)


    ## ENDNOTE


    1. `James Strong, The New Strong’s Exhaustive Concordance of the Bible (Nashville,
    TN: Thomas Nelson, 1991)`, Greek `#5258`.


    ## WINNING THE RACE OF THE MIND


    > In your patience possess ye souls (Luke 21:19).


    “Whoa!! Whoa!” I kept repeating, but to no avail. I had agreed to go horseback
    riding with some of my friends. But the horse that I was riding took off running
    wildly with me holding the reins loosely and screaming for this seemingly “demonic”
    horse to stop. The more I yelled, the faster he seemed to go; at one point he
    ran under a tree as if to to knock me off. I finally let go of the reins and held
    on to the saddle. I hadn’t really ridden a horse before and was getting a very
    fast lesson. It seemed this crazy animal was enjoying every moment of it, knowing
    I was a scared new rider. I kept yelling, hoping the horse would slow down, all
    the while not realizing that the ability to control this horse was right in my
    hands. I had the reins to help determine his direction, to slow him down, and
    to make him stop—the power was right in my hands! The problem was I was holding
    them too loosely, and then I let go of them. Eventually one of my friends, who
    was an experienced rider, grabbed the reins of the horse I was riding and made
    him come to a stop.

    '
