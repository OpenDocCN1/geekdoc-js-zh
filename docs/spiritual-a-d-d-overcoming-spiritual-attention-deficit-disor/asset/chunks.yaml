- fmt: '

    This is exactly what Jesus referred to when He told a story about a Pharisee who
    would pray self-righteous prayers, boasting of his own righteousness, while judging
    the acts of others. He refused to examine himself. In the same story, Jesus spoke
    of another man, a tax collector and sinner, who self-examined his heart, motives,
    and lifestyle, beating his breast and asking for God’s mercy and forgiveness (see
    Luke 18:9-14). The point Jesus was making with the story is that people often
    will point out the faults in others but won’t examine their own lives.


    Again, with this in mind, the brazen laver can be prophetically applied to us
    today, indicating the need that we all have to examine ourselves to make sure
    we are living as we should before Almighty God! We have to look at ourselves today,
    washing our hands and feet spiritually through self-examination. Why the hands
    and feet? Because the hands speak prophetically of our service and work for God
    that must be clean. The feet prophetically represent a clean walk before God that
    is focused and purposeful.


    Self-examination is also a necessary step if we are going enjoy a life that pursues
    God in a deeper and more intimate way. We have to be willing to look at ourselves,
    our hearts, and our spiritual condition. Failure to do this is what often causes
    us to fall prey to Spiritual A.D.D.


    The more honest you are with yourself about the state of your spiritual condition,
    the more easily you will rid your life of the symptoms. Are you examining your
    hands to serve God fully? Are you truly walking in a manner pleasing to Him with
    full dedication?


    I have found the more I am honest with myself as to my heart and approach to God
    and spiritual things, the more easily I resist the symptoms of Spiritual A.D.D.
    I do this by making myself pursue God, read my `Bible`, pray, and go to church,
    regardless of how I feel. I keep myself in an attitude and approach to life that
    is full of joy when it comes to God. Pursuing Him is not something I am being
    forced to do but what I want to do; it is what I enjoy doing! Remember, it is
    the joy of the Lord that is your strength, and in the presence of God there is
    the fullness of joy (see Neh. 8:10; Ps. 16:11).


    This is why it is important to get honest and face yourself, like the priests
    did when they looked into the brazen laver. It keeps Spiritual A.D.D. from taking
    root in your life. It is important to do a regular self-examination and spiritual
    checkup to keep you from sliding backward into a spiritual state that becomes
    unproductive and frustrating. It also breaks the enemy’s ability to use Spiritual
    A.D.D. in your life.


    God requires us to self-examine, to inspect and keep our spiritual lives in order.
    It is our responsibility to do a spiritual checkup and resist the things that
    want to hinder and affect our spiritual walk in a negative way. God is waiting
    on us to see what is in our hearts. He is looking to see how we will deal with
    the things that are allowing Spiritual A.D.D. to take root in our lives.


    This is what the Lord did with Gideon and his army in `Judges 7`. He wanted to
    see what was in their hearts and what level of spiritual commitment they had.
    Did they trust the Lord to fight for them? One of the ways God did this was similar
    to the brazen laver used in Moses’ tabernacle. God once again used water as a
    reflection of self-examination to cause them to be tested. He made them look into
    the water and face themselves. It would later reveal something that was missing
    in their lives in order to win the battle they were about to face. This water
    of testing would ultimately reveal their true hearts and focus. It separated those
    who were distracted from those who were focused and determined in order to enable
    them to defeat the enemy.


    Israel had 32,000 men to fight with Gideon against the Midianites, whom the Bible
    says were as numerous as grasshoppers and the sand on the seashore (see Judg.
    7:12). Though they were clearly outnumbered, God still insisted Gideon’s army
    was “too many” for Him to deliver the Midianites into their hands (see Judg. 7:2).
    They probably thought, "Too many, are you sure God?" The Lord knew what He was
    doing. He was going to defeat them supernaturally! In order to win in the battles
    of life and the things you feel are against you, you have to avoid excuses and
    distractions.


    God tested the men’s hearts to see who would be focused and put their hearts into
    obeying Him. This resulted in 22,000 of them leaving because they were afraid
    of the size of the opposing army. Now, this would leave just 10,000 in the army
    of Gideon remaining to fight! Even after this, God still wanted those who would
    be focused and have a different spirit, those who wouldn’t be so easily distracted.
    He tested the men who remained by bringing them to the water. Why the water? It
    was for the purpose of self-examination, to see what was in their hearts and where
    their focus was. Would they trust God to defeat their enemy?


    > So Gideon took the men down to the water. There the LORD told him, “Separate
    those who lap the water with their tongues like a dog from those who kneel down
    to drink.” Three hundred men lapped with their hands to their mouths. All the
    rest got down on their knees to drink. The LORD said to Gideon, “With the three
    hundred men that lapped I will save you and give the Midianites into your hands.
    Let all the other men go, each to his own place” (Judges 7:5-7 NIV).


    God brought a separation through the way they drank water.

