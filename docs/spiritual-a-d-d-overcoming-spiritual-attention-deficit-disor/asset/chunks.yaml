    *   A Stool (the best posture)—This is where you can sit, pray, and study to get
    the best results. If you are struggling to stay awake, for example, try a different
    posture, like pacing.

    *   A Table (the right material to be fed spiritually)— The table speaks of having
    your Bible and other biblical material with you in your devotions. It speaks of
    being organized and prepared in your reading and studying of the Word of God.
    The table is the place where you can be prepared to feed on God’s Word, study,
    and enjoy God’s presence.

    *   A Bed and Table (the balance of rest and spiritual labor)—The bed and the
    table are different items; however, both are necessary for overcoming Spiritual
    A.D.D. The table is for work and feeding, while the bed is for rest. Both of these
    are important in your spiritual life.


    As we can see, these items were necessary to aid Elisha in his spiritual life.
    They will work for us also and will better prepare us when we spend time with
    God.


    Take a moment to consider these items in your life and even determine what you
    need to do to better prepare yourself to be with God. This is important because
    you may not actually be dealing with Spiritual A.D.D. symptoms but rather with
    the lack of preparation and organization. If you will become better prepared and
    purposeful, it will greatly increase your spiritual results and keep you from
    feeling like your spiritual life isn’t working.


    # The Lord and Pity Parties


    When we are battling Spiritual A.D.D. and feeling as though things are not working
    as we desire, the worst thing we can do is to start feeling sorry for ourselves
    and begin to get negative. These struggles can affect each person differently,
    but we can all agree on the importance of keeping our faith and trust in the Lord.
    We have to guard our hearts against unbelief and developing a mindset of, “It
    won’t work so, why should I try anymore?” If this is our mindset, it can lead
    to a pity party.


    The Lord loves parties, except those that indulge in sinful practices or the ones
    full of feeling sorry for ourselves and making up excuses. Those are called pity
    parties. This doesn’t imply that He doesn’t care or isn’t touched by our problems
    or that we aren’t allowed to show emotion. We know the Lord is compassionate,
    loving, longsuffering, and full of mercy. However, He won’t be manipulated by
    our emotions or compelled to step in just because we are offended or feeling sorry
    for ourselves. This may sound kind of harsh, but it’s the truth. We will examine
    a few examples of pity parties in Scripture.


    ## Lazarus


    In one example, Jesus had a friend named Lazarus who was very sick and later died.
    The news traveled back to Jesus, who, after a few days of waiting, went to raise
    Lazarus from the dead. This did not go over well with those who felt He should
    have come earlier to prevent Lazarus’ death. Jesus arrived in Bethany, the place
    where Lazarus was buried, knowing that He would raise him from the dead, and encountered
    a party scene— not one of celebration but of grief, sorrow, and blaming Him. This
    pity party scene was so bad that both of Lazarus’ sisters, Mary and Martha, tried
    to blame Jesus for their brother’s death. “Then said Martha unto Jesus, Lord,
    if Thou hadst been here, my brother had not died” (John 11:21). We can see that
    Martha was blaming Jesus while her sister Mary stayed in her house having a pity
    party. “Then Martha, as soon as she heard that Jesus was coming, went and met
    Him: but Mary sat still in the house” (John 11:20). Mary later blamed Jesus just
    like her sister.


    > Then when Mary was come where Jesus was, and saw Him, she fell down at His feet,
    saying unto Him, Lord, if Thou hadst been here, my brother had not died (John
    11:32).


    It is important to note that Jesus was friends with this family, yet He purposely
    didn’t join their weeping, sorrow, and display of unbelief. You might be saying,
    “Wait a minute, doesn’t the Bible say that Jesus wept in this same story?” That’s
    right; Jesus did weep in this story. “Jesus wept” (John 11:35). However, the better
    question to ask is, “Why did He weep?” Was it to join their pity party of blame,
    unbelief, and feeling sorry? No, He wept in regard to their display of unbelief
    and their commotion. “When Jesus therefore saw her weeping, and the Jews also
    weeping which came with her, He groaned in the spirit, and was troubled” (John
    11:33).


    Jesus saw them weeping, and He was troubled. This is not to imply that He was
    angry at their weeping; He was angry at why they were weeping. In other words,
    He saw something He didn’t like in the way they were weeping and carrying on;
    He became troubled and groaned in His spirit about it. This doesn’t sound like
    He was on board with their pity party, does it? What does it mean to be troubled
    and to groan in the spirit? What is the difference between Jesus who “wept” and
    the people who were “weeping”? To better understand the difference and why Jesus
    was troubled and groaned about it, we have to look more closely at the meaning
    of these words—groaned, trouble, wept, and weeping.


    Groaned in spirit is translated from the Greek word `embrimaomai`. It means to
    be moved with anger; to admonish sternly; to snort with the notion of coercion,
    springing out of displeasure, anger, indignation, antagonism; to express indignant
    displeasure with someone; and to charge sternly. It also means to snort like an
    angry horse, literally to “snort”.


    Troubled is translated from the Greek word `tarassō`. It means to agitate, to
    shake to and fro, cause perplexity, and be stirred up.


    Wept is translated from the Greek word `dakryō`. It means a teardrop or to properly
    weep.


    Weeping is translated from the Greek word `klaio`. It means to properly weep aloud,
    expressing audible grief, and to wail.

