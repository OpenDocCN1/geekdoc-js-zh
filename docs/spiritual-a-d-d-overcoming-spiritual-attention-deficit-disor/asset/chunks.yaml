    ![](images/00007.jpg)


    [Chapter Seven](#index_split_006.html_filepos6679)


    [IT WILL WORK THIS TIME](#index_split_006.html_filepos6679)


    > > Therefore, behold, I will proceed to do a marvellous work among this people,
    even a marvellous work and a wonder… (Isaiah 29:14).


    “What’s on Your heart, God?” I asked, as I started my time of prayer with Him.
    I deeply wanted to know what I could do for the Lord. Was there any song He wanted
    me to sing to Him? Was there anything He wanted to talk to me about? I didn’t
    come to ask Him for anything, except to know what was on His heart. You see, so
    often we can suffer from Spiritual A.D.D. because, rather than spend time with
    God developing our friendship with Him, we make the time primarily about what
    we can receive from Him.


    If we put pressure on ourselves to have to accomplish something, rather than to
    develop intimacy with God, most of our spiritual pursuit will be aimed at receiving
    “from” God rather than ministering “to” God. We often focus primarily on our needs
    and our “what we need God to give us” mentality. Here’s an example of what I call
    the “give me” mentality.


    The Abram Mentality or the Abram Response


    This “give me” mentality was found in a man named Abram, who later had his name
    changed by the Lord to Abraham. God came to introduce Himself to Abram, who didn’t
    know Him.


    > > After these things the word of the LORD came unto Abram in a vision, saying,
    Fear not, Abram: I am thy shield, and thy exceeding great reward (Genesis 15:1).'
