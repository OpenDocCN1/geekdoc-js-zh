- fmt: '

    We now have available to us this powerful blood of Jesus that renews and protects
    our minds against the devil’s attacks. This means that our minds don’t have to
    be garbage pails for the junk of this earth or open doors for the enemy’s distracting
    thoughts. Our minds have been purchased by the precious blood of Jesus! However,
    because we live in this world and our minds are affected every day, we need to
    renew our minds through God’s Word and presence. We need to put a spiritual rein
    on our minds that will help us keep our thoughts subject to the knowledge of God.
    We can do this through the power of Jesus’ blood and through putting our hearts
    into Him.


    I pray you are seeing just powerful your spirit is and how important it is to
    submit your will to Him. As you have been reading, I hope you have seen the success
    in your spiritual life that can be obtained to defeat `Spiritual AD`. This success
    is es possible when you are doing things with all heart. Putting your heart into
    something is all about choice. It is called heart attitude, and it keeps your
    mind from getting in the way.


    Defeating `Spiritual AD` usually comes down to a few decisions and steps. It often
    comes down to just a few inches—the distance between your head and your heart.
    Jesus pointed this out in `Mark 12` when He told a scribe he was not far from
    the Kingdom. He said this after seeing what is the greatest commandment. When
    Jesus saw he had answered intelligently, He said to him, “You are not far from
    the kingdom...” (`Mark 12: NASB`). This man had the right answer from his head,
    but it wasn’t from his heart. He answered intelligently—but without revelation
    in his heart. As a result, Jesus told him he wasn’t far from God.


    Some of us may be exactly that close to spiritual breakthrough from `Spiritual
    AD`. Sometimes it comes down to those few decisions or steps that can cause our
    spiritual lives to be productive. Unless we make the spiritual decision to approach
    our walk with God with whole hearts, it starts to become routine, boring, and
    unfilling. This happens when we stop putting our hearts into it and let our minds
    dictate things. Putting our whole hearts into God, Bible reading, and other spiritual
    activities, as well as having the right attitude, helps immensely. Wholeheartedness
    keeps us from becoming negative or frustrated, and it requires of us the right
    attitudes and focus. `Spiritual AD` is about the heart and can be cured by having
    the right attitude. As I mentioned before, it is vastly important that our spirits
    are strengthening. When our hearts are in it, everything else in our lives will
    fall into proper order and spiritual fulfillment. Jesus pointed out this principle
    when He quoted the greatest commandment:


    And thou shalt love the Lord thy God with all thy heart, and with all thy soul,
    and with all thy mind, and with all thy strength (`Mark 12:30`). This is because
    when we put our whole hearts into seeking Him and the things of God, we are set
    on the right path for blessings. One person who sought God with his whole heart
    was King David. “With my whole heart have I sought...” (`Ps.119:10`). The Bible
    reveals why he was so blessed and loved by the Lord—he was a man after God’s heart
    (see `Acts 13:22`). He sought the Lord with all his heart and put Him first, even
    in the midst of sin, struggles, and enemies. What worked for King David will work
    for you!


    I cannot emphasize how important it is to stay focused in your spiritual life—striving
    to put your whole heart into time in the Bible, prayer, worship, going to church,
    and spending time with God. When you focus and don’t let your mind wander, when
    you really put your heart into it, God is ready to respond. He wants to, as shown
    in the Book of Ezekiel:


    And the man said to me, Son of man, look with your eyes and hear with your ears,
    and set your heart and mind on all that I will show you, for you are brought here
    so that I may show them to you... (`Ezekiel 40:4 AMP`).


    God was telling Ezekiel, through an angelic messenger, to stay focused. He told
    him to do this by looking with his eyes and expecting to hear with his spiritual
    ears. If he would also stay focused in his mind and not let it wander, God would
    respond by showing things to him. This is exactly true for us. A good way to do
    this is to close our eyes in prayer, unless of course we are driving. Another
    thing we can do is try to shut off the noise and distractions around us so we
    can better focus. Jesus knew the importance of this, and he told us to shut the
    door when we pray:


    But thou, when thou prayest, enter into thy closet, and when thou hast shut thy
    door, pray to thy Father which is in secret; and thy Father which seeth in secret
    shall reward thee openly (`Matthew 6:6`).


    The Lord was telling us in this verse to get ourselves into a place where God
    is our focus. He was telling us how to shut off and shut out other things that
    will distract us. Sometimes we have to shut off the thoughts that are trying to
    bombard our minds and break our focus from spiritual things.


    ### Let It Flow From the Heart


    One of the great ways to shut off the distractions is to flow from your heart
    by connecting to God with your human spirit, or what is commonly called your heart
    (not your natural heart but your spiritual heart). It is that place deep inside
    that is the real you, the place where real gut decisions are made. Jesus referenced
    the heart’s location when He mentioned the baptism of the Holy Spirit:


    Anyone who believes in Me may come and drink! For the Scriptures declare, “Rivers
    of living water will flow from his heart.” (When He said “living water,” He was
    speaking of the Spirit, who would be given to everyone believing in Him. But the
    Spirit had not yet been given, because Jesus had not yet entered into His glory)
    (`John 7:38-39 NLT`). In the King James Version of this verse, it says, “Out of
    his belly shall flow rivers of living water” (`John 7:38`). These Scriptures are
    important in helping us understand the need to do things for the Lord with our
    whole hearts.

