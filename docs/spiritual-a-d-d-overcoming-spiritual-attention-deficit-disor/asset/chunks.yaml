- fmt: "\nWe can take little practical steps to help us launch out a little further\
    \ in our walk with God. In Chapter 14 of `Mark`, we find some practical tools\
    \ we can use when we feel that our spiritual lives aren’t working as we’d like,\
    \ or we are suffering from Spiritual A.D.D. Let’s look at a simple pattern of\
    \ the events in Jesus’ life before and during His prayer in the Garden of Gethsemane.\
    \ I will highlight key words and events that we can easily apply as principles\
    \ in our lives as we desire to push forward and see results. They are small steps\
    \ that can lead to big results in our spiritual lives with God!\n\n### Mark 14:17-37\n\
    \n1. **Set a Time**—“And in the evening He cometh with the twelve” (`Mark 14:17`).\
    \ Morning is usually best, but maybe there is a time that works better with your\
    \ schedule. The key is to “set” a time and stay consistent.\n2. **Seek God’s Kingdom\
    \ First**—“…He cometh with the twelve” (`Mark 14:17`). The number 12 is a prophetic\
    \ number that symbolizes God’s Kingdom (His way of doing things). When we seek\
    \ and put God’s Kingdom first, we will see results (see `Matt. 6:33`).\n3. **Take\
    \ Communion Often**—(see `Mark 14:22-25`). We can take communion as often as we\
    \ need to (see `1 Cor. 11:25`).\n    * Claim the five blessings of the bread.\
    \ Five things happened when Jesus broke bread with His disciples after the Resurrection\
    \ (see `Luke 24:31-32`): 1) “their eyes were opened”—they received revelation\
    \ knowledge; 2) “they knew Him”; 3) their “heart burn[ed] within them”; 4) “He\
    \ talked with us”—they heard God’s voice; 5) “He opened us the Scriptures.” As\
    \ believers, we can claim these five things also.\n    * Claim the seven blessings\
    \ of the blood—power, riches, wisdom, strength, honor, glory, and blessing (see\
    \ `Rev. 5:12`). Jesus received these seven blessings as the Lamb of God who was\
    \ slain, and they are now given and available to us as joint heirs in Him.\n4.\
    \ **Remember to Worship**—“And when they had sung an hymn, they went out into\
    \ the mount of Olives” (`Mark 14:26`). Make worship a part of your life as `Ephesians\
    \ 5:18-20` encourages.\n5. **Keep Your Heart Right**—“And Jesus saith unto them,\
    \ All ye shall be offended because of Me this night…” (`Mark 14:27`). Live a repentant\
    \ and forgiving life (see `Mark 11:25`). It is important not to get offended or\
    \ have unforgiveness in our hearts, which can hinder our prayers. Therefore, we\
    \ must keep our hearts right by staying in love, walking pure, and avoiding offenses\
    \ and unforgiveness.\n6. **Set a Place**—“And they came to a place which was named\
    \ Gethsemane…” (`Mark 14:32`). Establish a regular place to meet with God.\n7.\
    \ **Be Fervent**—Jesus prayed in a garden called `Gethsemane`, which means “oil\
    \ press” in the Greek. This reveals the importance of pressing in with your heart\
    \ in prayer for the power of God to manifest. The key is to find a place where\
    \ you can fervently press into God’s presence.\n8. **Pray With Others**—“…Sit\
    \ ye here, while I shall pray. And He taketh with Him Peter and James and John,\
    \ and began to be sore amazed, and to be very heavy” (`Mark 14:32-33`). Praying\
    \ with others is a great way to defeat Spiritual A.D.D.\n9. **Set Prayer Goals**—“And\
    \ He went forward a little, and fell on the ground, and prayed…” (`Mark 14:35`).\
    \ Continue to set goals, going further each time in your pursuit of the Lord.\n\
    10. **Resist Falling Asleep**—“And He cometh, and findeth them sleeping, and saith\
    \ unto Peter, Simon, sleepest thou? couldest not thou watch one hour?” (`Mark\
    \ 14:37`).\n11. **Build Up to an Hour**—“…couldest not thou watch one hour?” (`Mark\
    \ 14:37`). Discipline yourself by trying to establish a consistent hour of devotions\
    \ with the Lord. Do your best to avoid a fast-food, drive-through mentality of\
    \ seeking God where you are in and out with your order within five minutes.\n\n\
    These are little steps you can take to better push yourself to launch out in the\
    \ deeper things of God. Taking note of them will also help you better prepare\
    \ yourself to be with God, getting the results that you desire.\n\n### How Prepared\
    \ Are You?\n\nAnother little, but effective, way to push ourselves in our spiritual\
    \ lives so that we can start seeing the results we desire, is to come prepared,\
    \ stay prepared, and refuse to become discouraged and give up. This just requires\
    \ a small step of taking a moment and becoming better prepared.\n\nWhen we aren’t\
    \ prepared and organized, our spiritual lives often suffer, especially our devotional\
    \ lives. This is because of the tendency to approach our devotions haphazardly\
    \ and not well prepared. In other words, if we handle our time carelessly, we\
    \ may drag ourselves into our prayer time not expecting results. When this happens,\
    \ we can start wishing to do something else rather than spending time doing spiritual\
    \ things. This can result in boredom and feeling like its not working.\n\n###\
    \ Preparation for Meeting God\n\nGod knew the importance of this simple step in\
    \ order to have results. He told Moses to sure the people were ready.\n\n> The\
    \ LORD also said to Moses, “Go to the people and consecrate them today and tomorrow,\
    \ and let them wash their garments; let them be ready for the third day, for on\
    \ the third day the Lord will come down on Sinai in the sight of all the people\
    \ (`Exodus 19:10-11`).\n\nThis was in order to help them get maximum benefits\
    \ of their time with God. Another example of this can be found in the Bible regarding\
    \ the Shunammite woman (see `2 Kings 4:9-10`). She wanted to prepare a room for\
    \ the prophet Elisha to meet with God. He visited frequently, but she wanted to\
    \ increase his ability to have special times with God. She did this by preparing\
    \ things in a room. These same things can help us launch our spiritual lives forward.\
    \ When we prepare ourselves, we can kick Spiritual A.D.D. goodbye!\n\nLet’s take\
    \ a look at the things we need to have and do in our prayer rooms that will help\
    \ us get.\n\n2 Kings 4:9-10\n\n*   **Chamber** (a place to pray, your prayer closet\
    \ or place of prayer)—This is to help you establish your set place of prayer and\
    \ meeting with God.\n*   **Candlestick** (the right physical atmosphere)—Having\
    \ the proper lighting helps to set the atmosphere that gets the best results you\
    \ are seeking, helping you to focus better. If you are struggling with falling\
    \ asleep, try turning on a light!\n*   **Bed** (the place to meditate, listen,\
    \ and rest before God)—This speaks of having somewhere that is comfortable to\
    \ meditate on God and rest before Him. This is so you can hear God’s voice and\
    \ let Him minister to you as well!\n"
  raw: 'We can take little practical steps to help us launch out a little further
    in our walk with God. In Chapter 14 of Mark, we find some practical tools we can
    use when we feel that our spiritual lives aren’t working as we’d like, or we are
    suffering from Spiritual A.D.D. Let’s look at a simple pattern of the events in
    Jesus’ life before and during His prayer in the Garden of Gethsemane. I will highlight
    key words and events that we can easily apply as principles in our lives as we
    desire to push forward and see results. They are small steps that can lead to
    big results in our spiritual lives with God!


    Mark 14:17-37


    > > 1\. Set a Time—“And in the evening He cometh with the twelve” (Mark 14:17).
    Morning is usually best, but maybe there is a time that works better with your
    schedule. The key is to “set” a time and stay consistent.


    > > 2\. Seek God’s Kingdom First—“…He cometh with the twelve” (Mark 14:17). The
    number 12 is a prophetic number that symbolizes God’s Kingdom (His way of doing
    things). When we seek and put God’s Kingdom first, we will see results (see Matt.
    6:33).


    > > 3\. Take Communion Often—(see Mark 14:22-25). We can take communion as often
    as we need to (see 1 Cor. 11:25).


    > > > • Claim the five blessings of the bread. Five things happened when Jesus
    broke bread with His disciples after the Resurrection (see Luke 24:31-32): 1)
    “their eyes were opened”—they received revelation knowledge; 2) “they knew Him”;
    3) their “heart burn[ed] within them”; 4) “He talked with us”—they heard God’s
    voice; 5) “He opened us the Scriptures.” As believers, we can claim these five
    things also.


    > > > • Claim the seven blessings of the blood—power, riches, wisdom, strength,
    honor, glory, and blessing (see Rev. 5:12). Jesus received these seven blessings
    as the Lamb of God who was slain, and they are now given and available to us as
    joint heirs in Him.


    > > 4\. Remember to Worship—“And when they had sung an hymn, they went out into
    the mount of Olives” (Mark 14:26). Make worship a part of your life as Ephesians
    5:18-20 encourages.


    > > 5\. Keep Your Heart Right—“And Jesus saith unto them, All ye shall be offended
    because of Me this night…” (Mark 14:27). Live a repentant and forgiving life (see
    Mark 11:25). It is important not to get offended or have unforgiveness in our
    hearts, which can hinder our prayers. Therefore, we must keep our hearts right
    by staying in love, walking pure, and avoiding offenses and unforgiveness.


    > > 6\. Set a Place—“And they came to a place which was named Gethsemane…” (Mark
    14:32). Establish a regular place to meet with God.


    > > 7\. Be Fervent—Jesus prayed in a garden called Gethsemane, which means “oil
    press” in the Greek.^([1](#index_split_016.html_filepos235727)) This reveals the
    importance of pressing in with your heart in prayer for the power of God to manifest.
    The key is to find a place where you can fervently press into God’s presence.


    > > 8\. Pray With Others—“…Sit ye here, while I shall pray. And He taketh with
    Him Peter and James and John, and began to be sore amazed, and to be very heavy”
    (Mark 14:32-33). Praying with others is a great way to defeat Spiritual A.D.D.


    > > 9\. Set Prayer Goals—“And He went forward a little, and fell on the ground,
    and prayed…” (Mark 14:35). Continue to set goals, going further each time in your
    pursuit of the Lord.


    > > 10\. Resist Falling Asleep—“And He cometh, and findeth them sleeping, and
    saith unto Peter, Simon, sleepest thou? couldest not thou watch one hour?” (Mark
    14:37).


    > > 11\. Build Up to an Hour—“…couldest not thou watch one hour?” (Mark 14:37).
    Discipline yourself by trying to establish a consistent hour of devotions with
    the Lord. Do your best to avoid a fast-food, drive-through mentality of seeking
    God where you are in and out with your order within five minutes.


    These are little steps you can take to better push yourself to launch out in the
    deeper things of God. Taking note of them will also help you better prepare yourself
    to be with God, getting the results that you desire.


    How Prepared Are You?


    Another little, but effective, way to push ourselves in our spiritual lives so
    that we can start seeing the results we desire, is to come prepared, stay prepared,
    and refuse to become discouraged and give up. This just requires a small step
    of taking a moment and becoming better prepared.


    When we aren’t prepared and organized, our spiritual lives often suffer, especially
    our devotional lives. This is because of the tendency to approach our devotions
    haphazardly and not well prepared. In other words, if we handle our time carelessly,
    we may drag ourselves into our prayer time not expecting results. When this happens,
    we can start wishing to do something else rather than spending time doing spiritual
    things. This can result in boredom and feeling like we are just going through
    the motions. We can start feeling like it’s just not working, which affects our
    spiritual attitudes.


    This is how Spiritual A.D.D. works. It is meant to get us to stay in neutral,
    never progressing in our spiritual lives; it can even get us going in reverse,
    causing us to back up spiritually and eventually quit—at least on the inside.
    When this starts to happen, we need to take some small steps to get things working
    again. We can accomplish this by being determined to push ourselves to keep trying
    in our spiritual lives, regardless of the obstacles before us. We do this by making
    a decision to take those small steps that will further launch our spiritual lives
    in the right direction so we can get the results we are seeking.


    Here are some simple and helpful things we can do that will help us get those
    results. They will help us to prepare and recharge, or jump start, our spiritual
    lives.


    Take a moment to see how prepared you are. Whenever you decide you are going to
    go deeper, like Peter did, I suggest you start coming prepared to your time with
    God so you can get better results. The more prepared, expectant, and hungry you
    are, the easier it is to defeat Spiritual A.D.D. God knew the importance of this
    simple step in order to have maximum results. He told Moses in the Bible to make
    sure the people were prepared to meet with Him.


    > > The LORD also said to Moses, “Go to the people and consecrate them today and
    tomorrow, and let them wash their garments; and let them be ready for the third
    day, for on the third day the Lord will come down on Mount Sinai in the sight
    of all the people (Exodus 19:10-11 NASB).


    This was in order to help them get the maximum benefits of their time with God
    by being well prepared before meeting with Him.


    Another example of this can be found in the Bible regarding the Shunammite woman
    (see 2 Kings 4:9-10). She wanted to prepare a room for the prophet Elisha to meet
    with God. He visited frequently, but she wanted to increase his ability to have
    special times with God. She did this by preparing things in a room for him. She
    took a determined approach that included some practical items to help him prepare
    to meet with the Lord. These same things can help us launch our spiritual lives
    forward. When we prepare ourselves, we can kick Spiritual A.D.D. goodbye!


    Let’s take a look at the things we need to have and do in our prayer rooms that
    will help us get results.


    2 Kings 4:9-10


    *   A Chamber (a place to pray, your prayer closet or place of prayer)—This is
    to help you establish your set place of prayer and meeting with God.


    *   A Candlestick (the right physical atmosphere)— Having the proper lighting
    helps to set the atmosphere that gets the best results you are seeking, helping
    you to focus better. If you are struggling with falling asleep, try turning on
    a light!


    *   A Bed (the place to meditate, listen, and rest before God)—This speaks of
    having somewhere that is comfortable to meditate on God and rest, being quiet
    before Him. This is so you can hear God’s voice and let Him minister to you as
    well!'
