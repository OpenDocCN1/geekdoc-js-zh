    That happened until something else happened that I wasn’t expecting. I heard a
    voice speak to me—a very loving, but firm voice that dropped me to my knees. This
    voice said to me, “Hank, lovest thou Me more than trains?” Great, I thought as
    I was on my knees, convicted and feeling like the kid who got caught by his mom
    with his hand in the cookie jar. I knew this voice was the Lord speaking to me
    about being distracted by this train, but I wondered, Did He have to say it in
    King James Version? He spoke it again, “Hank, lovest thou Me more than trains?”
    I thought, Are You kidding me, God? This sounds like what You said to Peter in
    the Bible, when You asked him if he loved You more than natural things. “So when
    they had dined, Jesus saith to Simon Peter, Simon, son of Jonas, lovest thou Me
    more than these?” (John 21:15). Of course, I love You more than trains. It didn’t
    take long for me to repent for letting this train distract me and pull me from
    my time with God.


    I got a glimpse that day of just how jealous and excited God is about our time
    with Him. He waits for it and cherishes it. I was letting that train come between
    God and me, and the Lord wasn’t pleased about it. It wasn’t that He was bothered
    so much by the train but rather by me being distracted. I took my eyes or focus
    off of Him and became distracted by something else. As I was on my knees telling
    the Lord that I did love Him more than the train, I also began to laugh as I realized
    that the Lord is such a good God and Father. He has such a sense of humor—quoting
    it to me in the King James Version by saying, “Lovest thou Me more than these?”
    I haven’t heard anyone use the word lovest in our modern language when they talk.
    I knew the Lord was being funny with me, and it certainly got my attention, stopping
    this daily distraction.


    ## Distractions, Distractions, Distractions


    Does this story about my train distraction sounds familiar to your life? Maybe
    you are having your own set of things that are pulling you away from quality time
    with God or spiritual things? Maybe you are dealing with Spiritual A.D.D. and
    don’t know what to do.


    Whatever they may be, we must not allow these distractions to take our eyes off
    of the Lord and steal our time with Him (like with my train). Staying focused
    and minimizing or removing distractions is necessary for overcoming Spiritual
    A.D.D. We need to keep our focus on God and stay consistent in our prayer and
    Bible reading time. It is so easy in this day and age to take our eyes off the
    Lord and focus on the waves of things coming at us or even the storms of life.


    This is exactly what happened to Peter. He was being groomed by Jesus to become
    a powerful leader, but he got distracted. The Lord, after feeding the multitudes,
    told Peter to get in the boat ahead of Him with the other disciples. Then something
    happened that Peter and the others didn’t expect. A wind began to cause the waves
    and the sea to toss their boat like it was a toy. The disciples were panicking
    with fear, but Jesus miraculously walked upon the water toward them. They were
    so afraid at the events they were experiencing that they didn’t recognize that
    it was the Lord. They thought He was a ghost instead.


    > When the disciples saw Him walking on the lake, they were terrified. “It’s a
    ghost,” they said, and cried out in fear. But Jesus immediately said to them:
    “Take courage! It is I. Don’t be afraid” (Matthew 14:26-27 NIV).


    After hearing Jesus calling out to them, Peter began questioning if it was really
    the Lord who was walking on the water toward them. He asked Jesus, if it was Him,
    to ask him to come to Him on the water. The Lord responded by telling Peter to
    go ahead and get out of the boat and walk to Him on the water. However, as he
    got out of the boat and started to walk on the water by God’s supernatural power,
    Peter quickly became distracted as fear of the wind and waves gripped him. This
    caused him to lose focus from the Lord, and he began to sink, crying out for the
    Lord to save him.


    Of course, the Lord did save him, but imagine what would have happened if he had
    kept his eyes on the Lord. He wouldn’t have sunk! This is true for many who suffer
    and are feeling as though their spiritual lives are sinking fast, like Peter.
    This is because the symptoms of Spiritual A.D.D. can make it difficult to focus
    on spiritual things without being distracted. Its purpose is to get our eyes and
    pursuit off the Lord, like Peter, and onto the things around us. Then we won’t
    accomplish the things we desire.


    Peter would have been fine had he kept his focus on the Lord and resisted the
    distractions around him. His own mind began to pull him from his spiritual focus,
    causing him to sink because he got distracted. This is so easy to do without realizing
    that it is happening. I like how The Message Bible tells us to avoid these things.
    It tells us to avoid sideshow distractions that will get our focus off of the
    Lord. “Keep your eyes straight ahead; ignore all sideshow distractions” (Prov.
    4:25 MSG).


    These sideshow distractions can come from many different sources, and they are
    different for each person. For Peter, it was the water and the wind; for me, it
    was my train. Take a moment to reflect. What is it in your life that may be distracting
    you? What things are trying to keep you from focusing on God?


    For some, admitting to anything might be hard, while others have a list a mile
    long. Truth be known, many Christians, even the most disciplined ones, including
    leaders and pastors, have all had to deal with plenty of sideshow type distractions
    in this modern world of technology. There are plenty of things in this earth to
    distract us and aid in the symptoms of Spiritual A.D.D. The enemy’s goal is to
    get our focus off the things of God and onto other things around us, making them
    sideshow distractions. These distractions can include e-mails, Facebook, Twitter,
    the Internet, cell phones, family, friends, sports, hobbies, entertainment, work,
    and many other things.


    These sideshow distractions may not be necessarily bad and may even be necessary.
    Yet, we can’t let them pull us from our spiritual pursuit of God—to the point
    that we prioritize them or get distracted by them more than the things of God.
    Unfortunately, we can’t always control or avoid these. Yet, we still need to learn
    how to not let them dictate or affect our walk with God or our time with Him.


    A good way to help determine if Spiritual A.D.D. is affecting us in the form of
    distractions is to better understand what defines something as being a distraction.
    Distraction by definition means to draw apart or bring a separation. It is that
    which diverts our attention or a diversion. It is a state in which our attention
    is called in different ways by confusion, perplexity, or disorder. Once we discover
    what a distraction is, we recognize more easily how it can work against us in
    our spiritual lives.

