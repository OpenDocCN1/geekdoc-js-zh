    detached from the handle and fell into the water. The ax head became disconnected
    from the handle, sank in the water, and ceased to be of use. What was worse for
    this person who lost his cutting edge was that this tool was borrowed! This caused
    him to seek the prophet Elisha for help in getting his cutting edge back.


    > > …“Oh, sir!” he cried. “It was a borrowed ax!” “Where did it fall?” the man
    of God asked. When he showed him the place, Elisha cut a stick and threw it into
    the water at that spot. Then the ax head floated to the surface. “Grab it,” Elisha
    said. And the man reached out and grabbed it (2 Kings 6:5-7 NLT).


    What a supernatural miracle for the ax head to float to the top of the water after
    it sank! This is amazing because iron doesn’t float. What was better yet for this
    man, was that he was able to reconnect the cutting edge to the handle again. You
    could say he got a handle on things!


    What does this story mean for us, and how does it relate to overcoming Spiritual
    A.D.D.? If we feel like we our spiritual cutting edge has sunk like that ax head,
    we must not despair because, if God can cause an iron ax head to resurface, He
    can cause our spiritual lives to rise again as well! This is encouraging for those
    who really want to stay sharp in their Christianity or overcome Spiritual A.D.D.
    Rather than get upset, we need to tap into the power of God and the tools He has
    made available to sharpen our walk with Him. We also have to reconnect with some
    things that may help in restoring our “cutting edge” for the Lord.


    Many spiritually sink or drift in their walk with God because they don’t stay
    connected to the things that keep them spiritually sharp and intact, like the
    ax head. One way to stay sharp and not lose your cutting edge is to be thankful
    and to rehearse what God has done for you. Something I suggest you consider, if
    you want to restore that cutting edge in your spiritual life, is making a checklist
    of things you are believing God for. Then follow up with continual thanks and
    praise to the Lord for His answers. When you see the things you listed start manifesting
    before your eyes (and even before they do), it is important not to forget to thank
    the Lord and remind Him of specific answers to prayers. These things will keep
    you spiritually sharp and keep you from thinking that nothing is working in your
    spiritual life.


    Here are some other suggestions to help you restore and keep your cutting edge.
    They will work, even if you feel like your cutting edge is sinking like the ax
    head. The key to remember is: It will resurface if you believe it can! This is
    what I call “restoring your cutting edge.” This is not an all-inclusive list,
    but it includes many helpful tips:


    *   Prioritize your day by seeking God and putting Him first, setting a time and
    place to meet.


    *   Pray in the Spirit often every day, building yourself up to pray for longer
    periods of time.


    *   Find a strong, Bible-believing church where God’s Spirit and presence are.


    *   Get around other strong believers (those who are like Peter, James, and John).


    *   Pray and meditate on the Word of God every day and night.


    *   Find a good Christian book, devotional, or biblical study book.


    *   When driving in your car, worship and pray with your understanding and in
    the Spirit.


    *   Share and be bold about your faith. Look for evangelism opportunities.


    *   Get involved in your local church, serving others.


    *   Consider a short-term mission trip.


    *   Learn about safe and effective fasting, as well as the biblical benefits of
    fasting.


    *   Listen to worship and praise music in your car and in your home often.


    *   Monitor your television, computer, and cell phone use and your other activities.


    *   Avoid sin, carnal people, and worldly influences.


    Build an Altar


    As we bring this chapter and book to a close, I believe something new is opening
    for you. It is a greater, more fulfilled, and more spiritually intimate life with
    the Lord. I pray that the principles you have learned throughout this book have
    challenged you—that they made you laugh and made you feel as though you could
    relate to the things mentioned. Yet I pray that you have also found the tools
    you need to inspire you to overcome Spiritual A.D.D., not letting it reign in
    your life!


    I believe that a spark has been lit, and now a new spiritual fire is beginning
    to burn in you! You have gained new insights, strategies, and principles that
    you can apply to your spiritual walk. In the end, as you reflect on what you have
    read, realize that it really comes down to consistently building an altar with
    God every day. When you do this, you will see life spring up again in your walk
    with God. You will see the things that you have cried out for, and you will continue
    on a road to a greater depth in the things of God.


    Before ending, let’s take a small glimpse at the importance of a personal altar
    with God. Altars in the Bible were very significant, and God required many people
    to build them. An altar represents so much. It represents a place to meet with
    God and to seek His face. It represents a place of sacrifice and worship. It is
    a place to show your love, heart, and commitment to the Lord. An altar is a place
    to find forgiveness of sin and to receive a clean start again.


    So how do we build a personal spiritual altar to meet with God? Let’s look at
    an example and apply it to us today. Noah built an altar before the Lord after
    the flood had been on the earth. This altar represented a fresh start, a commitment
    to God and His covenant. It signified that things were working in the earth as
    God brought restoration after the flood, which had destroyed all that was in the
    earth except Noah and the animals in the ark.


    > > Then Noah built an altar to the LORD and, taking some of all the clean animals
    and clean birds, he sacrificed burnt offerings on it. The LORD smelled the pleasing
    aroma… (Genesis 8:20-21 NIV).'
