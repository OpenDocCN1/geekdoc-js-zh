    Building an altar was something that Noah did on his own to worship and honor
    God. It wasn’t something that God necessarily commanded him to do. We can apply
    the same principle that Noah did to help us overcome Spiritual A.D.D. An altar
    is a place to meet with God and develop our spiritual walk. It is also where we
    present our hearts, our worship, our sacrifice, and anything else we want to present
    to the Lord. At this altar, Noah presented some clean animals. This means we need
    to present ourselves as clean vessels before the Lord. The more pure we are in
    our hearts, the more we will see God and the less Spiritual A.D.D. we will have
    in our lives (see `Matt. 5:8`).


    Another thing we can do in building an altar is to bring our lives as an act of
    worship, honor, and obedience to the Lord. Notice what happens when we establish
    an altar. (I am not speaking of a physical altar high up on a hill with artifacts
    and statues or some odd shrine in some room in our home. I am speaking of our
    hearts and establishing a consistent time and place to be with the Lord, not some
    religious ritual.) When we establish a spiritual altar to the Lord, connecting
    our hearts and everything we are and have to Him, He responds!


    The Lord responded to Noah by saying:


    > And the LORD smelled a sweet savour; and the LORD said in His heart, I will
    not again curse the ground any more for man’s sake; for the imagination of man’s
    heart is evil from his youth; neither will I again smite any more every thing
    living, as I have done. While the earth remaineth, seedtime and harvest, and cold
    and heat, and summer and winter, and day and night shall not cease (Genesis 8:21-22`).


    We can see the Lord’s response was favorable and one of blessing to Noah and future
    generations. Are you hungry to build that new spiritual altar between you and
    the Lord like Noah did? I bet you are! I challenge you to do so and to watch how
    things will work for you in your walk with Jesus. You will experience an amazing
    God releasing amazing results in your spiritual life. Are you ready to start building?


    The good thing is that I believe you have already started! You know how I know?
    Think for a moment! Look at how great a step you have taken by actually making
    it to the end of this book. That is, of course, if you didn’t skip to the back
    and are just reading this sentence. But all joking aside! If you were dealing
    with the symptoms of Spiritual A.D.D. and you have read the pages of this book,
    then I think you need to applaud yourself (careful not to make a scene now). You
    have completed a great step, a necessary step to better and further your walk
    with God. You have actually started to build your spiritual altar before the Lord.


    I am convinced you are on your way to seeing results, but don’t let this stop
    with you. Pass this book on to someone else you know who could really benefit
    from it also. It is working! Just keep moving forward! Victory is on the horizon,
    and you are sailing right into the spiritual life you have longed for! Happy spiritual
    altar building; say goodbye to Spiritual A.D.D!


    ![](images/00007.jpg)


    ## About Hank Kunneman


    Hank Kunneman is senior pastor of Lord of Hosts Church in Omaha, Nebraska, and
    founder of One Voice Ministries. Hank is known for his prophetic ministry and
    prophetic words for nations and world events. His prophetic Web site called Prophetic
    Perspectives has been an encouragement to many. He travels extensively, ministering
    in conferences and churches throughout the United States and overseas. He demonstrates
    the power of God and preaches biblical truths that stir the Body of Christ, while
    equipping people to do the work of the ministry. Hank also ministers with his
    wife, Brenda, and has authored several books, including *Barrier Breakers*, *Don’t
    Leave God Alone*, and *The Revealer of Secrets*.


    ### Other Books by Hank Kunneman


    * *The Revealer of Secrets*

    * *Don’t Leave God Alone*

    * *Barrier Breakers*


