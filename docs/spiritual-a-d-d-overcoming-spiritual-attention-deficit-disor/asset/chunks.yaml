- fmt: '

    The Lord was referring in this verse to a second experience after salvation called
    the infilling or the baptism of the Holy Spirit. It’s a river of power available
    that flows out of you when you are filled with His Spirit and then pray in the
    Spirit. This is such a powerful tool in your hands to get things flowing again
    in your life and to help you return to the joy of your salvation! This is especially
    true if you are feeling the effects of Spiritual A.D.D. or just plain feeling
    rusty like an old water pump. If this sounds like you, then I encourage you that
    it’s time for you to begin priming your pump and get things flowing again in your
    walk with God!


    Let me remind you of how to get things flowing again and let this river of power
    flow out of you. I am certain it will make it hard for Spiritual A.D.D. to latch
    on to your life or for you to lose that precious joy of your salvation! If you
    are ever struggling with your prayer life or don’t feel like praying, you can
    spend extra, targeted time praying in the Spirit. Praying in the Spirit will build
    you up spiritually. “But ye, beloved, building up yourselves on your most holy
    faith, praying in the Holy Ghost” (Jude 20). Like this verse says, if you feel
    spiritually weak, God has made something available to build you up, to get things
    flowing again in your life.


    Praying in the Spirit is so powerful because it is like recharging your spiritual
    battery, especially when natural things are draining you. If you are struggling
    with Spiritual A.D.D. or losing the joy of your salvation, then let me encourage
    you with something. How about doing a small exercise that will go a long way for
    you? Try praying in the Spirit for five minutes—putting your whole spirit, soul,
    and body into it for those five minutes. Do this every day until you are ready
    to increase the time. Maybe the next week you increase the time to 10 minutes.
    The key is changing it up and increasing it until a steady flow begins to happen
    in your Christian life. You will notice a difference! Are you ready to take time
    to exercise? If you do, you will see that it will keep you from neglecting your
    salvation, and it thwarts Spiritual A.D.D. as well. Watch how your hunger for
    the Lord increases and joy returns to your salvation. It’s time to get things
    flowing again!


    ## Develop Spiritual Hunger


    Sometimes we are losing the joy of our salvation because Spiritual A.D.D. is causing
    us to lose our spiritual hunger. When this happens, we start losing our appetite
    for spiritual things. We can even sometimes start craving other things that may
    not be good for us and can even add spiritual heaviness to us.


    So what do you do if this is you? Well, for starters, you need to start a spiritual
    eating plan, so to speak, that gets your spiritual hunger and appetite back. One
    way you can do this is to set the Lord before you. “I have set the LORD always
    before me: because He is at my right hand, I shall not be moved” (Ps. 16:8).


    In other words, you set and make a special place for Him like you would an honored
    guest. Something I have done in my devotions is to literally have a place set
    for the Lord to come meet with me. I am not intending to sound strange here but
    rather mention something that will bring joy back to your salvation. I have designated
    at times a special chair for the Lord, and I speak to Him as if He was sitting
    right there in front of me. At some moments when I have done this, my whole prayer
    meeting place has become electrified with His presence. I want to encourage you
    to find what works for you. The key is to make the Lord real to you! Maybe try
    setting a special place for the Lord like I did. The first place to always set
    the Lord before you is in your heart!


    When you set the Lord before you, the results will be visibly evident; you will
    see the joy return in your salvation, and you will start getting hungry for God
    again. Setting the Lord before you is a great way to keep from losing the joy
    of your salvation. It also helps you develop better spiritual eating habits that
    promote spiritual hunger. The more you feed on something, the more you will crave
    it. This is true in the things of God as well. The more you feed on the things
    of God, the hungrier you will be toward Him, and the more you will crave spiritual
    things.


    This has happened to me when I have gone on a diet. I cut out sweets and only
    ate things that are nutritious. The problem is, for a period of time, my appetite
    and taste buds craved sugar, and the things that are better for me seemed like
    torture, tasting terrible! Most of the time, I had been feeding on sweets and
    neglecting healthy foods. I had trained my body to like sweets and to hunger for
    less nutritious foods. I essentially acquired a taste for sugar over nutritious
    things!


    The same principle is true in spiritual things. Our loss of spiritual hunger can
    also be what keeps us from having a spiritual breakthrough. Feeding on the wrong
    things causes us to lose our spiritual hunger. When we do not feed on spiritual
    things, we lose our spiritual appetite and only desire to feed on things of the
    flesh. How can we increase our spiritual hunger if we feel like we are losing
    it to Spiritual A.D.D.? Here are some helpful things to consider in a spiritual
    hunger plan.


    ### How to Develop Spiritual Hunger


    1. Go on a spiritual diet—It requires a change of mind and heart. “Be not conformed
    to this world: but be ye transformed by the renewing of your mind…” (Rom. 12:2).
    When you do, your hunger changes!

    2. Get rid of junk food and your sweet tooth, and control your cravings—This could
    be, spiritually speaking, things in this world that you keep craving that you
    need to do. “Love not the world...” (1 John 2:15).

    3. Change your meal options, and be disciplined in what you’re eating—Choose to
    feed on spiritual things rather than overeating on the things in world (see Gal.
    5:16).

    4. Develop consistency and discipline in your spiritual diet—Plan the times when
    you will feed on God’s Word.

    5. Be accountable to others in your meal plan—Eat with the Body of Christ through
    communion, fellowship, prayer, and the things of God (see Acts 2:42,46).

    6. Prioritize and simplify your life—Stick to your meal plan by getting rid of
    unnecessary weight, and be diligent to exercise your spirit, seeking first the
    things of God (see Matt. 6:33).

    7. Keep an eye on the prize—Keep a good attitude and be thankful, staying focused
    on your ultimate goal of a successful walk with God and new hunger for Him (see
    Col. 3:2; Isa. 55:1-3).

    8. Return to first love—Developing spiritual hunger requires going back to the
    days of your first love with the Lord and doing the things that caused you to
    stay hungry for Him (see Rev. 2:4).

    9. Go a little further—Push yourself to change your spiritual eating habits. Set
    small goals and make small changes (see Mark 14:15).

    10. Feed on God and His Word everyday— Develop a daily routine of prayer and reading
    the Word of God, working at your salvation (see Phil. 2:12).


    ## Changing Direction


    So, how about it? Did you find this spiritual hunger plan a challenge? Are you
    ready to get things flowing again in your spiritual life and get that hunger back
    you once had for the Lord? Have you decided it’s time to go on a diet that consists
    of spiritual things? If you have, then you are heading in the right direction
    to overcome Spiritual A.D.D. in your life and return to the joy of your salvation!

    '
  raw: 'The Lord was referring in this verse to a second experience after salvation
    called the infilling or the baptism of the Holy Spirit. It’s a river of power
    available that flows out of you when you are filled with His Spirit and then pray
    in the Spirit. This is such a powerful tool in your hands to get things flowing
    again in your life and to help you return to the joy of your salvation! This is
    especially true if you are feeling the effects of Spiritual A.D.D. or just plain
    feeling rusty like an old water pump. If this sounds like you, then I encourage
    you that it’s time for you to begin priming your pump and get things flowing again
    in your walk with God!


    Let me remind you of how to get things flowing again and let this river of power
    flow out of you. I am certain it will make it hard for Spiritual A.D.D. to latch
    on to your life or for you to lose that precious joy of your salvation! If you
    are ever struggling with your prayer life or don’t feel like praying, you can
    spend extra, targeted time praying in the Spirit. Praying in the Spirit will build
    you up spiritually. “But ye, beloved, building up yourselves on your most holy
    faith, praying in the Holy Ghost” (Jude 20). Like this verse says, if you feel
    spiritually weak, God has made something available to build you up, to get things
    flowing again in your life.


    Praying in the Spirit is so powerful because it is like recharging your spiritual
    battery, especially when natural things are draining you. If you are struggling
    with Spiritual A.D.D. or losing the joy of your salvation, then let me encourage
    you with something. How about doing a small exercise that will go a long way for
    you? Try praying in the Spirit for five minutes—putting your whole spirit, soul,
    and body into it for those five minutes. Do this every day until you are ready
    to increase the time. Maybe the next week you increase the time to 10 minutes.
    The key is changing it up and increasing it until a steady flow begins to happen
    in your Christian life. You will notice a difference! Are you ready to take time
    to exercise? If you do, you will see that it will keep you from neglecting your
    salvation, and it thwarts Spiritual A.D.D. as well. Watch how your hunger for
    the Lord increases and joy returns to your salvation. It’s time to get things
    flowing again!


    Develop Spiritual Hunger


    Sometimes we are losing the joy of our salvation because Spiritual A.D.D. is causing
    us to lose our spiritual hunger. When this happens, we start losing our appetite
    for spiritual things. We can even sometimes start craving other things that may
    not be good for us and can even add spiritual heaviness to us.


    So what do you do if this is you? Well, for starters, you need to start a spiritual
    eating plan, so to speak, that gets your spiritual hunger and appetite back. One
    way you can do this is to set the Lord before you. “I have set the LORD always
    before me: because He is at my right hand, I shall not be moved” (Ps. 16:8).


    In other words, you set and make a special place for Him like you would an honored
    guest. Something I have done in my devotions is to literally have a place set
    for the Lord to come meet with me. I am not intending to sound strange here but
    rather to mention something that will bring joy back to your salvation. I have
    designated at times a special chair for the Lord, and I speak to Him as if He
    was sitting right there in front of me. At some moments when I have done this,
    my whole prayer meeting place has become electrified with His presence. I want
    to encourage you to find what works for you. The key is to make the Lord real
    to you! Maybe try setting a special place for the Lord like I did. The first place
    to always set the Lord before you is in your heart!


    When you set the Lord before you, the results will be visibly evident; you will
    see the joy return in your salvation, and you will start getting hungry for God
    again. Setting the Lord before you is a great way to keep from losing the joy
    of your salvation. It also helps you develop better spiritual eating habits that
    promote spiritual hunger. The more you feed on something, the more you will crave
    it. This is true in the things of God as well. The more you feed on the things
    of God, the hungrier you will be toward Him, and the more you will crave spiritual
    things.


    This has happened to me when I have gone on a diet. I cut out sweets and only
    ate things that are nutritious. The problem is, for a period of time, my appetite
    and taste buds craved sugar, and the things that are better for me seemed like
    torture, tasting terrible! Most of the time, I had been feeding on sweets and
    neglecting healthy foods. I had trained my body to like sweets and to hunger for
    less nutritious foods. I essentially acquired a taste for sugar over nutritious
    things!


    The same principle is true in spiritual things. Our loss of spiritual hunger can
    also be what keeps us from having a spiritual breakthrough. Feeding on the wrong
    things causes us to lose our spiritual hunger. When we do not feed on spiritual
    things, we lose our spiritual appetite and only desire to feed on things of the
    flesh. How can we increase our spiritual hunger if we feel like we are losing
    it to Spiritual A.D.D.? Here are some helpful things to consider in a spiritual
    hunger plan.


    How to Develop Spiritual Hunger


    1.  Go on a spiritual diet—It requires a change of mind and heart. “Be not conformed
    to this world: but be ye transformed by the renewing of your mind…” (Rom. 12:2).
    When you do, your hunger changes!


    2.  Get rid of junk food and your sweet tooth, and control your cravings—This
    could be, spiritually speaking, things in this world that you keep craving for
    that you need to do without. “Love not the world…” (1 John 2:15).


    3.  Change your meal options, and be disciplined in what you’re eating—Choose
    to feed on spiritual things rather than overeating on the things in this world
    (see Gal. 5:16).


    4.  Develop consistency and discipline in your spiritual diet—Plan the times when
    you will feed on God’s Word and at the Lord’s table.


    5.  Be accountable to others in your spiritual meal plan—Eat with the Body of
    Christ through communion, fellowship, prayer, and the things of God (see Acts
    2:42,46).


    6.  Prioritize and simplify your life—Stick to your spiritual meal plan by getting
    rid of unnecessary weight, and be diligent to exercise your spirit, seeking first
    the things of God (see Matt. 6:33).


    7.  Keep an eye on the prize—Keep a good attitude and be thankful, staying focused
    on your ultimate goal of a successful walk with God and new hunger for Him (see
    Col. 3:2; Isa. 55:1-3).


    8.  Return to your first love—Developing spiritual hunger requires going back
    to the days of your first love with the Lord and doing the things that caused
    you to stay hungry for Him (see Rev. 2:4).


    9.  Go a little further—Push yourself to change your spiritual eating habits.
    Set small goals and make small changes (see Mark 14:15).


    10.  Feed on God and His Word everyday— Develop a daily routine of prayer and
    reading the Word of God, working at your salvation (see Phil. 2:12).


    So, how about it? Did you find this spiritual hunger plan a challenge? Are you
    ready to get things flowing again in your spiritual life and get that hunger back
    that you once had for the Lord? Have you decided it’s time to go on a diet that
    consists of spiritual things? If you have, then you are heading in the right direction
    to overcome Spiritual A.D.D. in your life and return to the joy of your salvation!


    Changing Direction'
