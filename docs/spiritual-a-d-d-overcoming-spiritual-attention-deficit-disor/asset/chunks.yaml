  trans: '


    我们现在拥有了耶稣这强大的宝血，它更新并保护我们的心智，免受魔鬼的攻击。这意味着我们的头脑不需要成为这世间垃圾的垃圾桶，也不需要为敌人分心的思想敞开大门。我们的心智已被耶稣宝贵的血买赎了！然而，因为我们生活在这个世界上，心智每天都会受到，我们需要通过神的话语和他的同在来更新我们的思想。我们需要为心智套上属性的缰绳，帮助我们保持思想顺服于神的知识。我们可以通过耶稣血的力量并将全心投入祂来实现这一点。


    我祈祷你正看到你的灵是多么强大，以及将你的意志顺服于祂有多么重要。正如你一直在阅读的，我希望你已经看到属生活中可以获得的成功，以击败 `Spiritual
    AD`。当你全心投入地做某事时，这种成功是可能的。全心投入某事完全取决于选择。这被称为心的态度，它能防止你的头脑产生阻碍。


    击败 `Spiritual AD` 通常归于几个决定和步骤。它往往取决于仅仅几英寸的距离——你的头部和心灵之间的距离。耶稣在`马可福音第 12 章`中指出了这一点，他告诉一位文士他离神国并不远。他在看到什么是最大的诫命后这样说的。当耶稣看到他回答得很有见地时，对他说：“你离神国不远……”
    (`Mark 12: NASB`)。这个人从脑头上给出了正确的答案，但不是从心里出的。他回答得很精明——但内心没有启示。结果是，耶稣告诉他离神并不远。


    我们中的一些人可能离 `Spiritual AD` 的属灵突破仅如此近。有时，这取决于那几个让我们的属生活产生成效的决定或步骤。除非我们在灵上做出决定，以全心与神同行行，否则它就会开始变得常规化、无聊且乏味。当我们停止投入全心并让头脑来主宰一切时，这种情况就会发生。全心投入神、读圣经和其他属灵活动，并保持正确的态度，会有巨大的帮助。全心意使我们不变得消极或沮丧，它要求我们具备正确的态度和专注。`Spiritual
    AD`关乎心，可以通过正确的态度来治愈。正如我之前提到的，我们的灵得到加强至关重要。当我们全心投入其中时，生活中的其他一切都将恢复秩序并获得属灵的满足。耶稣在引用最大的诫命时指出了这一原则：


    你要尽心爱耶华你的神，尽性命，尽意意，尽力爱你的神 (`Mark 12:30`)。这是因为当我们全心寻求祂和神的事物时，我们就走在了得福的正确道路上。全心寻求神的人之一是大卫王。“我用全心寻求你……”
    (`Ps.119:10`)。圣经揭示了为什么他蒙受如此福分并被主所爱——他是一个合神心意的人（参见`使徒行传 13:22`）。他全心寻求耶华并将祂放在首位，即使在罪孽、挣扎和敌人之中也是如此。大卫王有效的方法对你也有效！


    我无法强调在你的属灵生活中保持专注的有多么重要——努力将全心投入到读圣经、祷告、敬拜、去教会以及与神相处的时间中。当你专注而不让头脑游离时，当你真正全心投入时，神随时准备好给予回应。祂想要这样做，正如《西结结书》中所示：


    那人对我说：“人子，你要用你的眼睛看，用你的耳朵听，并将你的心放在我要给你看的一切，因为你被带到这里是为了把它们显给你看……” (`Ezekiel 40:4
    AMP`)。


    神通过一位天使使者告诉西结要保持专注。他告诉他通过用眼睛看并期待用属性的耳朵听来这样做。如果他在思想上也保持专注不让其游离，神就会通过向他显示事物来回应。这对我们来说也是如此。做到这一点的一种好方法是在祷告时闭上眼睛，除非我们正在开车。我们可以做的另一件事是尝试关掉周围的噪音和干扰，以便我们更好地专注。耶稣知道这的重要性，他告诉我们祷告时要关上门：


    惟你祷告的时候，要进你的屋，关上门，向你在暗处的父祷告；你在暗处的父得了见的，必在众面前赏赐你 (`Matthew 6:6`)。


    主在这一节中告诉我们，要让自己进入一个以神为中心的地方。他是在告诉我们如何关闭并排除其他会分散我们注意力的事物。有时我们必须关闭那些试图轰炸我们头脑并打破我们对属灵事物专注的想法。


    ### 让它从心中流出


    关闭干扰的极佳方法之一是通过你人的灵与神连接，即通常所说的心（不是你的自然心，而是你的属灵心），让它从你的心中流出。内心深处那个地方才是真实的你，是做出直觉决策的地方。耶稣在提到圣灵的洗时时提到了心的位置：


    凡信我的，可以来喝水！经经上说：‘信我的人，从他里面要有活水的源流出来’（当你说“活水”时，祂是指圣灵，这圣灵是要赐给凡信祂的。但圣灵还没有赐，因为耶稣还没有进入荣耀）
    (`John 7:38-39 NLT`)。在这一节的钦定本圣书中，说是：“从他腹里流出活水的源” (`John 7:38`)。这些经文有助于我们理解全心全意为主主做某事的必要性。


