- fmt: '

    We need to be encouraged with this example of Peter; what worked for him will
    work for us. We just have to do what Peter did and let God push us into not giving
    up but instead trusting in Him. This will enable us to go deeper in our walk with
    Him and not be afraid to try again.


    How did the Lord push Peter? He pushed him by suggesting that he continue to do
    what he had already done before, even if it didn’t seem like it was working. He
    insisted that Peter should go fishing again by pushing out a little farther into
    the deep water and trying again. This time, though, he would have to be willing
    to let Jesus go along with him and do things His way! Jesus wanted Peter to take
    those extra steps, make that extra decision to pick himself back up, and push
    forward for results.


    This is true for us also, especially if we are experiencing any of the symptoms
    of Spiritual A.D.D. Rather than taking necessary steps to improve our spiritual
    walk, we often resort to quitting or making excuses so we don’t have to keep trying.
    What we need to do is what Jesus instructed Peter. We need to press into the things
    of God, pushing forward, no matter what we face. If we do continue trying, it
    will bring blessings into our lives. This is what happened to Peter. Once he decided
    to try again, his net was filled with so many fish that it broke, and he experienced
    the blessing that he desired. “And when they had this done, they inclosed a great
    multitude of fishes: and their net brake” (Luke 5:6).


    Imagine the surprised look on those fishermen after they saw the results! Their
    nets broke in an amazing way. In fact, I bet after this happened, Peter didn’t
    mind that the Lord had pushed him to try fishing again. Notice that once Peter
    obeyed and tried again, a breakthrough came. It was only after he was willing
    to push himself to go farther and keep trying that it worked. Peter had to be
    willing to do things the way Jesus instructed him in order to get the results
    he wanted. In the same way we have be willing to launch out, go deeper, and press
    in a little harder to get those desired results.


    Jesus had to do this also. He had to push Himself in order to achieve His desired
    results. He did this to keep Himself connected to God and not subject to the incredible
    amount of pressure that He was feeling. “And going a little farther, He fell on
    the ground and kept praying that if it were possible the [fatal] hour might pass
    from Him” (Mark 14:35 AMP).


    In this verse, the Lord went a little farther and kept praying. He didn’t give
    up in the midst of pressure; rather He kept pressing! He didn’t stop seeking His
    Heavenly Father, no matter how He was feeling. This same principle is key for
    anyone suffering from Spiritual A.D.D.


    Don’t give up in your pursuit of God, especially if you are feeling like your
    spiritual life isn’t working. You have to push yourself like Peter did and keep
    rowing and rowing until you reach that place where you receive your breakthrough!
    You do this simply by continuing to push forward and pray, going further little
    by little until you reach that place where the symptoms of Spiritual A.D.D. aren’t
    dictating your spiritual life. You just have to be willing, like Jesus was that
    night in the Garden of Gethsemane, to take those little steps of obedience. It
    will work if you don’t quit! God is working for you, and He is on your side. You
    just need to remember to stay faithful to do your part in prayer, righteousness,
    and the continual pursuit of the things of God. Then watch as God is faithful
    to show up and give you the results you have been wanting.


    This is what I came to realize that day in my prayer time when I saw that angel.
    I did my part, and God was showing me that He was doing His. He was there to help
    me, and it was working! I just needed to keep seeking God, keep reading my Bible,
    and remain faithful in my spiritual life to Him.


    Are you willing to push yourself to get the results you desire with the Lord?
    Do you want to have success in your spiritual life, like Peter wanted that day
    in his fishing? If so, I want to encourage you go a little further, to do what
    Jesus suggested to Peter and try again! Are you ready to give it another try?
    Let’s launch out together and keep taking those little steps.


    ### Practical Steps Little by Little


    Perhaps you are wondering what kind of little steps to make to defeat Spiritual
    A.D.D. and see better results in your spiritual life. One of the first steps could
    be making a determined decision to launch out or push yourself in your spiritual
    walk. A second step is to do what Peter finally did. Think about it for a moment.
    He had to be willing to work for it in order to get the results he wanted. It
    required him to row little by little, going farther with each rowing motion. He
    had to keep making the decision to go deeper. He had to be obedient, willing to
    work at it again. He had to be determined and consistent if he wanted to see results.


    > Therefore, brethren, be all the more diligent to make certain about His calling
    and choosing you; for as long as you practice these things, you will never stumble
    (2 Peter 1:10 NASB).


    We have to be diligent about the things of God and what He has asked us to do
    for Him. In the same way, when you decide that Spiritual A.D.D. isn’t going to
    hinder you anymore, you will have to push yourself, being diligent to take small
    steps to overcome it. Then you will see amazing blessing and breakthroughs in
    your spiritual life like Peter did that night.


    It isn’t usually the big steps that lead to the breaking of Spiritual A.D.D. from
    us but rather the consistent, little-by-little steps that cause us to overcome.
    The Bible says our spiritual growth occurs step by step, little by little. “For
    precept must be upon precept, precept upon precept; line upon line, line upon
    line; here a little, and there a little” (Isa. 28:10).

