  raw: 'I am not talking about a wild new dance craze, but of a spiritual action that
    affects your spirit, soul, and body. The Scriptures tell us to shake ourselves.
    “Shake thyself from the dust; arise, and sit down, O Jerusalem: loose thyself
    from the bands of thy neck, O captive daughter of Zion” (Isa. 52:2).


    Shake off the dust! You know that dusty Bible that hasn’t been read in a while.
    How about that dusty lack of commitment to finding, joining, and getting involved
    in a good church? What about shaking off the dust of earthly things that are weighing
    you down, causing you to sin and fall into spiritual apathy? Whatever the dust
    is that has been allowed in your life, it needs to be shaken from you!


    We need to do what this verse says and shake such things from us, loosing ourselves
    from the things that are trying to cause tiredness, boredom, and spiritual apathy.
    How do we do that? Sometimes we have to literally shake ourselves to keep from
    falling asleep or becoming lethargic in spiritual things. This can happen in prayer,
    and it is referred to as spiritual heaviness: “…the garment of praise for the
    spirit of heaviness…” (Isa. 61:3).


    This heaviness, which comes when we are spending time in spiritual things or is
    an aspect of our spiritual condition, can be an evil spirit of heaviness. This
    spirit, as Jesus mentioned, wants to sow tares into our lives and does so through
    a heaviness often found in Spiritual A.D.D. One of the ways to defeat this spirit
    of heaviness is by praising and worshipping God. A life of worship helps to strengthen
    us, as well as causing spiritual resistance from the enemy to go.


    We find an example of this with King Saul. When he was tired and under attack
    from the enemy, only worship and praise that David gave to the Lord in King Saul’s
    presence refreshed him and made the evil spirit leave.


    > > And whenever the tormenting spirit from God troubled Saul, David would play
    the harp. Then Saul would feel better, and the tormenting spirit would go away
    (1 Samuel 16:23 NLT).


    I encourage you to put on some Christian praise music and begin worshipping the
    Lord. Don’t be afraid to address that spirit of heaviness and tell it to leave
    your life!


    At other times, you may need to take a moment to shake yourself (of course, not
    to hurt yourself). I know this may sound silly. Please don’t misunderstand me,
    but sometimes, in my own time of prayer, I have had to literally shake my hands,
    shake my head, and jump up and down to wake up. Something else I do is to take
    a few minutes standing in place and begin worshipping God or praying in the spirit
    as strong as I can with all my body, soul, and spirit. I am not talking about
    waking up the neighbors and scaring the cat, but I am talking about a fervency
    and determination to stir up my spirit and cause my body and soul to do so as
    well. This is what the apostle Paul referred to when he mentioned what he does
    to shake himself up.


    > > Therefore I do not run like a man running aimlessly; I do not fight like a
    man beating the air. No, I beat my body and make it my slave so that after I have
    preached to others, I myself will not be disqualified for the prize (1 Corinthians
    9:26-27 NIV).


    This is a process that Paul is speaking about, and it doesn’t require physical
    torture! Instead you can do this method of shaking yourself up by walking, pacing,
    standing, and shaking yourself. It’s not so much a physical shaking as a determination
    to stir yourself up to break Spiritual A.D.D. from causing a spiritual sleep.
    The Message translation of Scripture says that Paul shakes himself up to keep
    himself from being caught napping! “…I’m not going to get caught napping, telling
    everyone else all about it and then missing out myself” (1 Cor. 9:27 MSG). Shaking
    yourself is a self-discipline and determination to resist things that are trying
    to steal from your spiritual walk. It is praying earnestly and pressing into what
    you are praying, worshipping, or doing for the Lord. This keeps you from falling
    asleep.


    It’s kind of like runners before race: They take a few moments to shake themselves
    by moving their heads, hands, and bodies. This keeps them loose and helps them
    to focus. “I discipline my body like an athlete, training it to do what it should”
    (1 Cor. 9:27 NLT).


    If you are struggling, why not just begin to worship God? Try pressing into Him,
    no matter how you sound or feel at that moment. The results will be the same as
    what happened for King Saul. It will refresh you, causing the enemy to leave,
    and it will lift that heaviness and burden from you!


    One key difference I want to point out between David, who wasn’t affected by an
    evil spirit, and Saul, who was oppressed, is that David didn’t need anything or
    anyone to be his spiritual cheerleader or worship leader. It’s not wrong to need
    that, but true spiritual strength comes when you learn to develop it on your own.
    David was able to do this himself by pressing into God when he was alone, unlike
    King Saul, who needed someone else to help him worship, praise, experience God,
    and get a spiritual breakthrough.


    As I said before, sometimes Spiritual A.D.D. can come from the devil, also known
    as the spirit of heaviness. We need to shake it off. This is what happened to
    Paul in Acts 28 when he was bit by a snake that fastened to his hand.


    > > And when Paul had gathered a bundle of sticks, and laid them on the fire,
    there came a viper out of the heat, and fastened on his hand (Acts 28:3).


    Those standing by were watching as he was bit, and they expected him to fall over
    dead. Paul didn’t die, nor was he affected by this snakebite. Instead Paul’s answer
    was to shake it off and continue on without the effects of the enemy. He just
    shook off that viper attack! “And he shook off the beast into the fire, and felt
    no harm” (Acts 28:5). This is exactly what we need to do with Spiritual A.D.D.—heaviness,
    lethargy, tiredness, and all other symptoms. I encourage you to make that choice
    and shake it off, loosing yourself from captivity!


    Are you ready to shake it off? Here are some things you can consider to prevent
    you from falling asleep in prayer or into a spiritual state of apathy:


    1.  Get plenty of rest—Try to maintain a normal sleep schedule and routine, if
    possible. Failure to do so is one of the biggest reasons people suffer with Spiritual
    A.D.D., and it keeps them from being focused in their times with God.


    2.  Take a moment to wake up—Take a shower, wash your face, watch the weather
    forecast, drink a hot cup of coffee, or do some other arousing activity. This
    is helpful to some, rather than diving head-first into their time with God if
    they are tired. A brief moment to wake up may help you more than you realize.
    My wife, Brenda, jokes that she can’t talk to anyone when she first wakes up,
    even God. She likes a fresh cup of coffee to start her day first.


    3.  Have your devotions in a well-lit place—Once in prayer, keep the lights on,
    as it is easier to fall asleep when it’s dark. Changing your prayer location and
    routine maybe be helpful and give you a needed spark of encouragement as well.


    4.  Have a little praise music or background noise— It is helpful to have some
    faint noise, which will help you to stay awake, yet not become distracted.


    5.  Try new prayer positions—Try positions that promote staying awake, like walking
    and pacing. It is probably not wise to try to pray while you are in bed and comfortable.
    Again, try not to “lie before the Lord” in prayer at first. Get out of bed and
    start off by walking, pacing, kneeling, or sitting with plenty of light to keep
    you alert.


    6.  Pray the Word of God out loud—Select Scriptures that go with your situation.
    This is also a type of praying with Jesus, praying His Word.'
