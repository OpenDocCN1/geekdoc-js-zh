    # Winning the Tug-of-War


    To win the tug-of-war between your flesh and your spirit, it is helpful to obey
    the lusts of your spirit while starving your flesh. How do you do that? When you
    have that craving to read your Bible, pray, or go to church— go ahead and do it
    joyfully with all of your heart. This will feed the lust of your spirit, which
    is craving for God and things of the spiritual life that it needs. Your flesh
    will try to resist you and pull you away from spiritual things. You have to determine
    you aren’t going to be pulled away into Spiritual A.D.D., but instead are going
    to resist it and obey your spiritual desires to do the things of God willfully
    and joyfully. This is one of the best ways to defeat Spiritual A.D.D. and win
    the tugofwar between your soul and spirit.


    ## Practical Steps


    Here is a brief list of things you can consider if you want to rise up in your
    spirit, dominate your soul, and increase your spiritual hunger. Taking note of
    these things can help you win over the effects of Spiritual A.D.D.:


    * Turn off cell phones or other phones so you won’t be distracted by calls during
    prayer.

    * Turn off the computer or spend time with God away from the distractions of one.

    * Play worship music while you pray or read to help you concentrate.

    * Include spiritual things in your day-to-day routine, staying consistent so you
    will crave spiritual things and starve your flesh.

    * Find a quiet place or create one to concentrate on God.

    * Find a time that is best suited for concentrating on the Lord.

    * Try abstaining from or cutting back on unnecessary things that steal from your
    time with God and affect your spiritual hunger.

    * Make a list of things you need to do before you pray or before you go to bed
    so that while you are praying or reading, you are focused.

    * Write down a prayer list and try to avoid letting your mind wander in thinking
    about other things.

    * Use the Spiritual ABC’s at the beginning of your prayer time: Try coming up
    with a descriptive attribute of God for each letter of the alphabet. For example:
    A is for Awesome, B is for Beautiful, C is for Caring. This helps you to focus
    and concentrate on God, keeping your mind from wandering.


    After reading these tips, did you see some areas in your life that would be helpful
    to adjust? As you can see, many of these things are simple adjustments that can
    make a huge difference in winning the race of your mind. You just need to pull
    the reins on your mind by watching for things that try to distract you, causing
    you to wander and allowing Spiritual A.D.D. to take root.


    Many can relate to the tug-of-war that tries to affect their spiritual walk and
    the struggle that often happens when they go to pray, read the Bible, go to church,
    or just spend good quality time with God. Their minds begin to wander, and they
    become easily distracted, eventually talking themselves out of spending time doing
    spiritual things. In just about anything, our approach in the first few minutes
    of a particular task will make or break our success. This is true in spiritual
    things as well: Our minds can begin to wander or be bombarded with all kinds of
    thoughts of things that we should be doing rather than spending time around the
    things of God. These thoughts can be positive or negative and often determine
    the quality of our spiritual pursuit of godly things. Our minds tend to race with
    all kinds of things that we need to accomplish or would rather be doing.


    Your mind will always try to challenge you. It does this by throwing doubts, fears,
    worries, and anxieties at you to try to distract you or cause you to quit. This
    is why, as I mentioned before, you need to learn to put the reins on your soul
    and win the spiritual tug-of-war. However you respond to the thoughts and things
    that are trying to hinder you will determine the outcome of your spiritual time
    with God.


    Have you ever noticed that the minute you decide you are going to pray, you start
    thinking about whether you took out the garbage or completed other tasks? The
    specifics are different for everyone, but most people can probably attest to the
    sudden thoughts that try to distract them while they are having their devotions.
    Something I suggest to help keep the mind from wanting to wander is to make a
    list before you go to bed. You can also do this with the things you want to pray
    about as you enter into prayer. It’s what I call clearing the mind and getting
    focused. It helps me to be more organized, keeps my mind from wandering, and enables
    me to put my heart into what I am doing.


    ## Put Your Whole Heart Into It


    When you put your heart into something, you are submitting your will like Jesus
    did in the Garden of Gethsemane (see `Mark 14:35-36`). You are saying, “I will
    do this!” It is the power of your will. This is why, as we mentioned before, speaking
    to yourself is so important to defeating Spiritual A.D.D.


    Putting your heart into something is vital—it accesses the power of your will.
    This was demonstrated by lucifer, the devil (though obviously in a negative way)
    when he tried to overthrow God and His Kingdom. The Bible records five times in
    `Isaiah 14:13-14` that lucifer purposed with his whole heart to try to rebel against
    God. Five times he said, “I will…” in reference to his attempt to steal God’s
    authority. He spoke to himself what his heart’s purpose was, and he submitted
    his will to do it. He put his whole heart and determination into thinking he could
    overthrow God. We know the result: Because of those “I will’s,” which revealed
    his twisted heart, he was kicked out of Heaven.


    We obviously should not emulate the devil’s rebellion, but we can learn from his
    wholeheartedness in this example. In a good and positive way, we can defeat Spiritual
    A.D.D. by speaking our hearts’ intents and submitting our spirits to God. This
    comes by us saying, “I will…” in accordance with the plan of God. When we do,
    we will defeat the devil, who uses Spiritual A.D.D. to his advantage, still seeking
    to overthrow God’s Kingdom by እንደሚ His children.


    We can rise up and address our minds and the devil, who tries to attack our thoughts
    and make our spiritual lives miserable. We don’t have to suffer or feel defeated.
    Instead, we can place our hands over minds, praying and claiming the benefits
    that Jesus paid for with blood. Jesus paid for our minds to be blessed by redeeming
    us with His own blood. When He died on the cross, He became sin so we in exchange
    could become the righteousness of God in Christ (see `2 Cor. 5:21`). In the same
    way, we exchanged our carnal minds, mental attacks, Spiritual A.D.D., depression,
    and the like for His thoughts and a renewed mind.


    Because of the blood of Jesus, we can say we now have the mind of Christ. “For
    who hath known the mind of the Lord, that he may instruct Him? But we have the
    mind of Christ” (`1 Cor. 2:16`). This means we can have renewed minds and proper
    thoughts.


    How did we obtain this mind of Christ? At His crucifixion, Jesus wore a crown
    of thorns, which was literally slammed onto His head. When the soldiers did this
    to Him, something glorious took place for you and me—the purchasing of our minds
    to be blessed and renewed. Those thorns were a picture of the redeeming blood
    that he shed, which is a hedge of protection over our thoughts.

