    建造祭坛是诺亚独自完成的事情，用来崇拜和尊崇上帝。这并不是上帝一定命令他做的。我们可以运用诺亚所采取的同样原则，帮助我们克服灵性多动症（Spiritual
    A.D.D.）。祭坛是一个与神相面并发展我们属灵生活的地方。它也是我们献上内心、崇拜、祭物以及任何我们想要献给主的地方。在那个祭坛上，诺亚献上了一些洁净的动物。这意味着我们需要在主面前将自己作为洁净的器皿。我们的内心越纯洁，就越能看见神，我们生活中的灵性多动症也就越少（参见
    `Matt. 5:8`）。


    在建造祭坛时，我们还可以做的另一件事是将我们的生命作为对主崇拜、尊崇和顺服的行为。注意看当我们建立祭坛时会发生什么。（我指的不是位于高山之上的、带有器物和雕像的实体祭坛，也不是家里某个房间里某种奇特的神龛。我说的是我们的内心，以及建立一个固定的时间和地点与主同在，而不是某种宗教仪式。）当我们为主建立一个属灵祭坛，将我们的心以及我们所的一切和所拥有的一切都与祂连接时，祂会回应的！


    主这样回答了诺亚：


    > 耶和闻了那香气，耶和就在心里说：我以后不再因人的缘由咒诅这地，因为人心人心意从从小心里都是恶的；我不再照我以前所行的，打灭一切有生命的了。只要地上还存存，就种、收、冷热、夏冬、日夜，就不废止（`创世记
    8:21-22`）。


    我们可以看到，主的回答是积极的，对诺亚和后代都是一种祝福。你是否渴望像诺亚那样，在你和主之间建立那个新的属灵祭坛呢？我敢打赌你很渴望！我挑战你这样做，并观察在你与耶稣同行的道路上事情将如何发展。你将体验到一位奇的神在你属灵生活中释放奇人的结果。你准备好开始建造了吗？


    好消息是，我相信你已经开始了！你觉得我是怎么知道的？想一下！看看你竟然读完这本书，这迈出了多么伟大的一步。当然，前提是你没有直接跳到最后只读这一句。但话虽归话！如果你正深受灵性多动症症状的困扰，并且读了这本书的页面，我认为你需要为自己鼓个掌（注意不要在这里大闹）。你完成了伟大的一步，这是完善和进一步促进你与神之行的必要的一步。你实际上已经开始在主面前建造你的属灵祭坛了。


    我深信你正走向收获的道路，但不要让此于此。把这本书传给你认识的其他也可能从中受益的人。它正在起作用！继续前进吧！胜利在咫尺，你正驶向你向往的属灵生活！祝你属灵祭坛建造顺利；告别灵性多动症！


    ![](img/00007.jpg)


    ## 关于 Hank Kunneman


    Hank Kunneman 是内布拉斯加州奥马哈万军主教会（Lord of Hosts Church）的主任牧师，也是声音事工（One Voice Ministries）的创始人。Hank
    以他的先知事奉以及对国家和世界事件的先知性宣告而闻名。他的先知网站“先知视角”（Prophetic Perspectives）给许多人带来了鼓励。他经常往各地，在全美及海外的会议和教会中事奉。他彰显神的大能，传讲触动基督身体的圣经真理，同时装备信徒去做事工的工作。Hank
    还与妻子 Brenda 一同事奉，并编写了多本书，包括《突破障碍者》（*Barrier Breakers*）、《不要离开神》（*Don’t Leave God
    Alone*）和《秘密的揭示者》（*The Revealer of Secrets*）。


