  raw: 'The Sleep of Eli the Priest—First Samuel 3


    Eli the priest became a heavy man whose eyes became dim, and he was unable to
    discern the voice of the Lord speaking to his young protégé, Samuel. The reason
    for Eli’s condition, according to the Bible, was that he lay down to rest in his
    own place while Samuel rested where the presence of God was (see 1 Sam. 3:2-3).
    Failure to address this spiritual sleep condition and the symptoms of Spiritual
    A.D.D. may cause people, like Eli, to become spiritually weighed down, their spiritual
    eyes becoming dim. It becomes harder for them to hear the voice of the Lord and
    His direction for their lives. The key is to rest in the presence of God, not
    falling asleep, but spending time in His presence like Samuel did.


    The Sleep of Uriah—Second Samuel 11


    King David had committed adultery with Bathsheba, the wife of one of his key warriors.
    In order to cover it up, David suggested that this warrior, Uriah, go from the
    battle he was fighting for David to his own house to be with his wife, Bathsheba.
    But Uriah, a faithful and loyal soldier, decided that instead of going home to
    be with his wife he would stay close to his job and his boss, King David. He elected
    to sleep outside the doors of the palace, working overtime and neglecting his
    home due to his loyalty to his boss and job.


    This may sound crazy, but it is often why some suffer with Spiritual A.D.D. They
    are more loyal, faithful, and dedicated to their boss and employment than to their
    time with God. If people choose to prioritize God and His Kingdom as first, making
    Him the highest thing on their daily agendas, their homes and spiritual lives
    won’t suffer as much. Dedication, commitment, and fervor in employment are important,
    but not at the expense of falling asleep, thus damaging fellowship with God and
    causing homes to suffer because priorities are out of order.


    Sitting Too Close to the Edge


    Here is yet another biblical example of a person who fell asleep, in addition
    to the ones we have just read. As we look at this story, we will find it isn’t
    just about falling asleep. It also prophetically represents a spiritual state
    that affects some individuals and some churches. We can learn a lot from the example
    that we find in Acts chapter 20—the story of a young man named Eutychus who fell
    asleep.


    > > We met on Sunday to worship and celebrate the Master’s Supper. Paul addressed
    the congregation. Our plan was to leave first thing in the morning, but Paul talked
    on, way past midnight. We were meeting in a well-lighted upper room. A young man
    named Eutychus was sitting in an open window. As Paul went on and on, Eutychus
    fell sound asleep and toppled out the third-story window. When they picked him
    up, he was dead (Acts 20:7-9 MSG).


    Imagine, right in the middle of the sermon, someone falls out a window three stories
    high to his death! This is no laughing matter. Yet, in this story, we discover
    that the apostle Paul was preaching until midnight in a place called an upper
    chamber. My wife and I often tease each other with this example of Paul being
    long-winded. We have all probably known a long-winded preacher or sat through
    a long sermon somewhere. My wife and I always joke about which one of us is the
    longer-winded preacher. Of course, I say it’s her, and she says it’s me, but neither
    of us has ever preached until midnight like Paul. But we have had some fall asleep
    while we preached!


    Eutychus fell asleep during Paul’s sermon while he was listening in a window.
    Probably it wasn’t a good place to be sitting since he was tired. This story reveals
    some truths of how Spiritual A.D.D. is affecting some people in their individual
    lives and others while in the church. It could be said that Eutychus was sitting
    in a place that can cause Spiritual A.D.D.—living too close to the edge. He fell
    three stories to his death and had to be brought back to life by Paul!


    It is safe to assume that Eutychus was sitting facing Paul, with his back toward
    the outside. This means he fell backward! Often we talk about people who are backsliding—people
    who are not walking with the Lord as they should or who have fallen into a state
    of apathy and are not pressing in and really serving the Lord. This can happen
    if they are sitting too close to the edge in their lives like Eutychus did in
    the window. When Spiritual A.D.D. starts affecting people, some choose to sit
    too close to things in this life that may cause them to fall backward and away
    from God. For some, it is immediate, and for others, it happens over a time of
    constant falling asleep or through an attitude of apathy that causes them to drift
    closer to the edge. They sit there in this state until, like Eutychus, they fall
    from a high place in their spiritual walk, and then they need to be resuscitated.


    This is why we have to take a serious and hard look at our spiritual condition.
    Are we allowing the symptoms of Spiritual A.D.D. to cause us to sit too close
    to the edge? We know we are being affected when we are falling asleep spiritually
    and becoming dull of hearing. We begin to lose interest in spiritual things because
    we are spiritually sleepy, disinterested, or distracted. All of this happens because
    we are trying to see how close we can live to the edge of spiritual compromise
    without falling. This is why we have to address Spiritual A.D.D.; it can lead
    to us falling away from God, to backsliding.


    We must avoid this spiritual state or spiritual stupor. Look at the definitions
    in the Greek for the word sleeping that was used to describe Eutychus. The word
    sleeping is the Greek word hupros. This word means to sleep or a figuratively
    spiritual torpor or sleep.^([1](#index_split_011.html_filepos94571)) Now, the
    word torpor, which is used to describe the kind of sleep Eutychus fell into, means
    a state of being dormant or inactive; a temporary loss of all or part of the power
    of sensation or motion: sluggishness, stupor, dullness, apathy. It is a state
    of mental or physical inactivity or instability, lethargy, and apathy. It also
    means dormant or an inactive state of hibernating. Wow! It’s sobering to look
    at these definitions describing what kind of sleep he fell into.


    This shows that falling into this spiritual state is serious and must be avoided!
    From these definitions, we can also see the importance of resisting this spiritual
    slumber and state if we want to have a successful spiritual walk. They also reveal
    how detrimental to our lives a constant habit of falling asleep or a constant
    state of spiritual apathy can be. This is why we need to address this symptom
    of Spiritual A.D.D. and drive it from our lives.


    Jesus understood this danger. He further illustrated it and the consequences for
    those who fall asleep in spiritual things or live in spiritual apathy in Matthew
    chapter 13\. He revealed that, if we don’t address the enemy who comes while we
    are sleeping to take the Word sown into our hearts, the enemy will sow tares in
    our lives, which can affect the will of God concerning us. These tares the devil
    sows can be distractions, sins, or other things that seek to destroy our spiritual
    lives. The importance of resisting Spiritual A.D.D. is obvious. The enemy tries
    to attack when we are asleep. “But while men slept, his enemy came and sowed tares
    among the wheat, and went his way” (Matt. 13:25).


    You must ask yourself some important questions. Are you falling asleep in spiritual
    things? Has spiritual apathy for the things of God caused you to start spiritually
    drifting? Is your attitude toward your spiritual life, “Whatever will be, will
    be”? If this is the case, you may be experiencing the effects of Spiritual A.D.D.
    It is important to rise up and shake it off!


    It’s Time to Shake It Off'
