    stay with the group, which for the most part I did—except for a few occasions
    when some of my friends would wander into the woods, just a little off the path,
    at certain stops. At times I would join them to do more exploring. But I was also
    being mindful to stay with the group and the boring—I mean boring—guide.


    It seemed that our guide would stop every few feet and give us a lengthy speech,
    reminding us to stay on the path due to poison ivy and ticks. The problem with
    that was that we were getting distracted, losing focus, and becoming just plain
    bored. So, we decided to do what we wanted, which led to us not listening very
    well. We thought that as long as we were in earshot and could still see the group
    we would be fine. At the end of the day, we were told to examine ourselves to
    make sure we didn’t have poison ivy or ticks.


    Guess what? Everyone who was diligent to stay on the path was fine, but those
    of us who wandered off the path from time to time weren’t. I wound up with ticks,
    and my friends got poison ivy. It was all because we got off the path and started
    wandering and not following directions. We should have paid attention, listened,
    and stayed on the path; then we wouldn’t have had to deal with ticks and poison
    ivy!


    Self-examination of our hearts and the paths we were choosing would have helped
    us avoid those problems, which we brought upon ourselves. In the same way, we
    all need to self-examine our hearts and spiritual condition. We must stay on the
    path of the Bible and spiritual pursuit of God and righteousness. When we don’t
    listen to God and keep His ways, we get distracted and bored, and we will suffer
    consequences that aren’t pleasant to our spiritual lives, like my friends and
    I did that day with the ticks and poison ivy.


    This is because disobedience also opens our lives up to the enemy—who works to
    kill, steal, and destroy our spiritual walk, getting us off our spiritual path.
    This is exactly what Spiritual A.A.D. is intended to do in our lives, which is
    why the devil loves it. In fact, he is known as one of Spiritual A.D.D.’s biggest
    fans and perpetrators. He uses it to distract, frustrate, and remove us from our
    path of spiritual pursuit and satisfaction with God.


    However, when you do your best to stay on a dedicated path of spiritual pursuit,
    you are less likely to fall into the enemy’s traps. You are also less likely to
    develop things that can make your life miserable, like the ticks and poison ivy.
    Self-examination of your heart, spiritual condition, and life will help you to
    better identify the symptoms you are dealing with so that you can be helped.


    To help further determine the quality of your spiritual life and to identify and
    overcome symptoms that may be trying to hinder you, ask yourself the questions
    below. Remember, Spiritual A.D.D. is a condition that can result in many spiritual
    challenges and problems, so it is important to answer these questions honestly.
    The self-examination of your heart and spiritual life is not only healthy, but
    God requires and expects it.


    1.  How often do you start to pray, read the Bible, or go to church and then quit?


    2.  Is it difficult for you to organize and stay consistent with spiritual things?


    3.  How often do you have problems remembering God, your daily devotions, prayer,
    and Bible reading?


    4.  When spiritual tasks require effort, do you avoid or delay them?


    5.  How often do you get fidgety or squirm during church or spiritual devotions?


    6.  Do you have difficulty paying attention to spiritual things?


    7.  Are you having mood changes about spiritual things, feeling interest in them
    one day and becoming uninterested the next?


    8.  Do you have physical symptoms—such as tiredness, poor sleep, or low energy
    and concentration—that are making it difficult to focus on spiritual things?


    9.  Are you having trouble managing your spiritual life?


    How did you do on this self-examination? Did you find yourself relating to any
    of these questions? If you answered yes, it is probably a good indication that
    you may be falling prey to Spiritual A.D.D.


    The Waters of Self-Examination


    We are going to look at some helpful truths now regarding the tabernacle that
    Moses built and how it relates it to the New Testament Church today and our spiritual
    lives. In the Old Testament, God gave instruction to Moses to build a tabernacle
    for Him, which is referenced many times in Scripture. One of the first things
    that God required of those entering this tabernacle was that they look in a basin
    of water and cleanse themselves. This was because God wanted their undivided attention
    and focus without the distractions of this world that could affect their time
    with Him. Even though this practice was for the priests before they could go any
    farther into the presence of God, it applies to us prophetically as believers.
    We are now called kings and priests unto God who must examine our hearts in a
    similar way if we are to go deeper into the Lord’s presence (see Rev. 1:6).


    The basin was called the brazen laver and was made with material of shiny brass
    in which the priests could see their reflection. The reason it was set in the
    outer court, by God, was for the purpose of self-examination.


    > > They made the bronze basin and its bronze stand from the mirrors of the women
    who served at the entrance to the Tent of Meeting (Exodus 38:8 NIV).


    As they would come to the laver, they would see a reflection of themselves and
    would wash their hands and feet with the water. They did this before proceeding
    farther into His presence, into the places in the tabernacle called the inner
    court and the holy of holies.


    > > Then the LORD said to Moses, “Make a bronze basin, with its bronze stand,
    for washing. Place it between the Tent of Meeting and the altar, and put water
    in it. Aaron and his sons are to wash their hands and feet with water from it.
    Whenever they enter the Tent of Meeting, they shall wash with water so that they
    will not die. Also, when they approach the altar to minister by presenting an
    offering made to the LORD by fire, they shall wash their hands and feet so that
    they will not die… (Exodus 30:17-21 NIV).


    Did you notice the seriousness of this laver and self-examination? They were told
    twice by God that they were to wash themselves or die. This is much like today:
    Some are dying spiritually because they won’t take a hard (but not condemning)
    look at themselves and the state of their Christian lives.'
