    The beggar was physically lame, begging and unable to leap, dance, and worship
    God like he wanted— until he was healed—because of a daily habit and mindset that
    hindered him. This is because he was more comfortable with his daily habits, routines,
    and mindsets that kept him begging for money instead of looking for an opportunity
    to be healed. This is why Peter said, “Silver and gold have I none; but such as
    I have I give thee: in the name of Jesus Christ of Nazareth rise up and walk”
    (Acts 3:6). Maybe we are like this man, who needed to change his daily habits
    to bring the joy he needed in his life. He needed a physical healing and a life
    that didn’t require begging.


    ## How to change your daily habits to overcome Spiritual A.D.D.?


    First, you need to examine your routine. Is it working? Is it producing godly,
    productive fruit in your life? How do you start your day? Does it consist of seeking
    God first? This is important because what you choose to do at the start of your
    day will affect the rest of your day and even your life. This is why the Bible
    speaks so much about the importance of seeking God first thing in the morning
    (see Ps. 63:1; Isa. 26:9). What you prioritize first in your day is the foundation
    that everything else is built on.


    For example, if you get up in the morning and practically smash your alarm clock
    as it rings for the umpteenth time, mumbling and grumbling about how tired you
    are and how much you hate having to start your day and go to work, this attitude
    will carry over in your outlook and affect the rest of your day. If you let this
    happen, you will find that you won’t have much joy in your salvation, let alone
    life. How much better do you think your life would be or how much more joy would
    you have in your spiritual life if you would wake up with a good attitude and
    start your day by meeting with the Lord? What a difference it would make!


    ## Identifying your motive and priorities


    If we want to improve the joy of our salvation, then we need to ask ourselves
    what we are looking to receive in life. In other words, what is our motive, and
    what do we want to accomplish in our daily walk with the Lord? We see this in
    the example of the man at the gate Beautiful who daily had his eyes on the wrong
    thing. His eyes weren’t on the Lord. His motive was not to receive a miracle but
    to receive money and try to make a living. There’s nothing wrong with making a
    living, but he had his priorities wrong. His first motive and focus was not on
    spiritual things but rather on his daily routine of begging, which kept him in
    his current state. He had developed daily habits that weren’t helping him to change
    his current situation.


    ## Developing right habits


    Developing right habits is important if we want to see significant change. This
    is especially true when dealing with Spiritual A.D.D. because we can start to
    feel pretty low and unworthy. We may feel spiritually weak and begin having a
    hard time keeping our joy. When this happens, it is a good idea to examine our
    lives. Are we really trying to develop good habits in our lives that will help
    us, or are we holding onto habits that are hurting us?


    Good habits are vitally important. The Lord Jesus had good habits when He walked
    on this earth. He sought His Heavenly Father daily, seeking Him all hours of the
    day, staying in constant fellowship with Him. He also had a habit of attending
    regular worship services (see Luke 4:16). The Bible says it was “His custom,”
    or habit, to attend regularly.


    Some struggle with their spiritual walk and Spiritual A.D.D. because they haven’t
    developed good habits to restore the joy they need in their salvation. This is
    usually due to a lack of regular attendance in a good, Bible-feeding and Bible-believing
    church. Sometimes, it can be because they seldom choose to spend time with quality
    believers who can strengthen their Christian walk.


    > Let us not give up meeting together, as some are in the habit of doing, but
    let us encourage one another— and all the more as you see the Day approaching
    (Hebrews 10:25 NIV).


    Fellowshipping with other believers is important because sometimes we need others
    to help carry us in our Christian walk until we can get on our feet again. Getting
    around the right godly people who can help to restore the joy in our salvation
    is helpful. We may, at some point in our lives, need someone to carry us because
    we can’t carry ourselves. The beggar at the gate Beautiful was carried daily to
    the gate. It’s important to have people from time to time to help carry us, but
    we have to be careful that we don’t become dependent upon them more than the Lord
    or make this a daily habit. We also can’t use people as a spiritual crutch, never
    truly learning or trying to walk upright on our own.


    It’s good to ask ourselves what we are dependent on that we think we can’t live
    without. It will help us to determine if we are growing or just maintaining in
    our spiritual walk. It will also help us to identify what could be causing bad
    habits in us.


    For example, we often think we can’t live without television or the cell phone
    for one night, or we depend on others to carry us in our daily habits with God.
    Technology is fine, and so is looking to others to help us grow in the Lord, as
    long as we keep these things in proper order and balance. Keeping in balance still
    comes back to the decisions we make as to what is most important in our day to
    have a successful Christian walk that values God above all else. What manner of
    Christians do we want to be? Do we want to live our Christian faith constantly
    dependent on others, looking for handouts and living in a state of spiritual lameness?
    Do we really want to be resistant to change and neglect our salvation?

    '
