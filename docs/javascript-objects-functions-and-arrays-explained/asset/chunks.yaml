    **Deleting** items with splice( ):


    **1-** Declare an array [raw file](http://icontemp.com/joagi/scripts/228b.txt):
    [ icontemp.com/joagi/scripts/228b.txt ]  **var x = ["blue","red","green", "violet",
    "brown"];**


    2- Delete 3 items starting at positions 0: **x.splice(0,3);**


    3- Call in the array: **x;** // returns ["violet", "brown"]. Items in positions
    0,1,2 were deleted.


    **Adding** items with splice( ):


    4- Let’s add our items back into the array, starting at position zero: **x.splice(0,0,
    "blue","red", "yellow");**


    4- Call the array: **x;** // returns ["blue", "red", "yellow", "violet", "brown"].


    We started at position zero and added all the listed items and deleted zero items.


    What would happen now if the second digit was 3 instead of zero? splice() would
    first deleted three items, and it would replace the same three items back.  **No
    change**.


    Remember the footnote on the topic pop( )?


    **abc.splice(-3,3);** note: if you want to try it change *abc* for *x*.


    The -3 counts 3 items from the right as an inclusive starting position. The second
    number means to delete 3 items with no replacements.


    **Extracting items into another array:**


    Up to now we have been editing the same array *x* but we could also extract the
    items we are currently deleting into another array, like if we were splitting
    the array in two, sort of like using *slicing()* with the addition of deleting
    the items from the original array:


    5- Take for example the original array ***x***: **var x =["blue","red","green","violet","brown"];**


    6- Split the array by copying the first three items into ***newArray*** before
    deleting them: **var newArray = x.slice(0,3);**


    7- Call array ***x***: **x;** // returns ["violet", "brown"]


    8- Call array ***newArray***: **newArray;** // returns ["blue", "red", "green"].


    **For more information, please refer to the following ECMASCRIPT 5 page:** [15.4.4.12
    Array.prototype.splice](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.12)


    # 2.3 New JavaScript Array Iteration Methods


    ## 2.3.1 forEach()


    Do not confuse forEach() with **for each… in** which has been *[deprecated](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for_each...in)*
    in JavaScript.


    *forEach* is a function which takes another function as an input argument.'
