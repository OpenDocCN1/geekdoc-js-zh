    我们通过括号内的占位符（称为 `parameter`，它实际上是一个类似数组的对象，最多可以持有 `up` 到 255 个参数）向函数传递 `data in`（这些数据在传入时被称为
    `arguments`，最多可以传递高达 255 种不同的参数）。我们使用 `return` 语句从函数传出 `data out`。`return` 还充当了
    `break` 的作用，一旦解释器处理了 `return`，函数内部将不再处理后续代码。`Return` 是函数处理过程中发生的最后件事。随后，函数实例会被销毁，除非有另一个指针保持其存（关于这一点稍后会详细介绍）。


    函数可以被`externally`调用（就像我们刚刚做的那样），也可以在自身内部`internally`调用（称为`递归`）。


    在 JavaScript 中 `functions are objects`（你知道的！）。它们可以像任何其他对象一样被传递。我们可以给它分配多个变量，或者将函数包含在其他脚本中。


    ### 5. 在长程序中，当我们完成函数 `addMe100` 且不再需要它时，我们应该对变量（指针）进行 `dereference` 以将其从浏览器内存中移除，因为它是一个全局变量，如果不进行解引用，它将一直留在内存中直到程序结束。dereferencing
    意味着通过将变量设置为 "`null`”来 `remove the reference`。这将最终清除变量和函数。方法如下：


    ```

    addMe100 = null;

    ```


    （`Note:`：在将 `addMe100` 解除引用为 `null` 后，如果你检查它的 `typeof`，将得到一个空 `object`。`Null`
    是一个特殊的对象（记得第一章提到的历史原因吗？）。JavaScript 将根据浏览器实现 `garbage Collection` 的方式删除 `addMe100`）。此外，该函数不再存在。尝试调用该函数。你将得到一个错误。`addMe100(3);`
    将导致 TypeError: object is not a function。）


    实际的函数实现将在后面的章节中详细介绍。让我们继续，继续剥开这层洋葱。


    ## 1.6 命名函数 vs 匿名函数


    我们在第 1 步、实验 3 中的函数 `addMe100` 是一个 `anonymous` 函数。这意味着该函数被赋值给一个 `variable declaration`，并且它是
    `declared` 变量的一个 `expression`（程序的一部分）。


    让我向你解释一下……


    在 JavaScript 中，我们可以有如下所示 `variable declarations`：


    ```

    var x;

    ```


    我们也可以有 `function declarations`：


    ```javascript

    function y( ){ };

    ```


    声明可以拥有 `expressions`，例如：


    ![](img/00005.jpeg)


    图 5


    此外，`variables` 可以拥有 `functions as expressions`：


    ![](img/00006.jpeg)


    图 6


    当我们声明一个变量或函数时，它们通常会被解释器 `hoisted`（提升）到 `scope` 的顶部，解释器会将所有 `variable declarations`
    列在最顶部。这就像是可用内容的索引。**只有声明会被提升**，表达式（expression）不会。这对于程序本身可能不会产生区别，或不会产生影响，除非在 `debugging`
    代码时。当我们调试时，能够从列表中在视觉上区分变量和函数是非常很棒的。这简化了我们对菜单上有什么内容的理解，对吧？


    **问题在于：**


    在我们上面的示例中，以下内容会在形式上出现在作用域的顶部：


    `x`、`y()`、`z`


    注意 `y` 被显示为一个函数，但 `z` 看起来像某种变量。这是因为**只有声明名会被提升**，而表达式不会。这只意味着调试时需要多做一些工作。


    `y` 和 `z` 之间还有另一个区别：我们实际上可以在声明函数脚本之前调用 `y`，因为 JavaScript 已经识别 `y` 为一个函数并会寻找它。然而，在
    `z` 中，如果我们在函数赋值写入之前调用 `z` 中的函数，可能会产生错误。


    在尝试调用所有函数之前先所有的它们被认为是一种最佳实践。


    除此之外，**使用 [anonymous](http://en.wikipedia.org/wiki/Function_literal) 函数是完全可以的，而且是一种非常强大的技术**，如果实现得当（jQuery
    大量使用了匿名函数）。


    ## 1.7 第一次复


    *   JavaScript 是一种 `prototype-based` 语言。

    *   就像类一样，原型（prototyping）避免了代码的重复，从而节省内存并简化了脚本。

    *   **Memory**（内存）被划分为 `Stack`（栈）和 `Heap`（堆）。栈充当原始类型和其他临时数据的短数据记录板。更长、更详细的数据（如任何类型的对象）被写入
    `Heap`。

    *   我们通过创建被称为变量的 `pointers` 来访问对象。一旦对指针进行解引用，对象就会通过 `Garbage Collection`（垃圾回收）方法进入删除计划。垃圾回收方法由浏览器本身决定，并可能随浏览器版本而异。

    *   `Primitive types`（原始类型）存在于 `Stack` 中，`Reference types`（引用类型）存在于 `Heap` 中。

    *   要 `dereference` 一个对象，我们将指针（变量）声明为 `null`。

    *   我们可以通过实例化对象 `Object`（**全局对象**）来创建一个对象。

    *   一旦我们声明一个对象，它就会从我们“克隆”它的原型中继承 `properties` 和 `methods`，以及从该原型在链中更上层的任何父原型继承。

    *   当我们声明一个包含字符串 `key-value pairs` 的变量时，数据以对象的形式保存在 `Heap` 中，变量名以符号的形式保存在栈中。我们随后可以使用
    `Dot syntax` 甚至 `Bracket syntax` 来调用每个值。熟悉这两种方法。

    *   由于一切都是对象，因此函数和数组本身也是对象，并且它们都继承自对象 `Object`。

    *   当我们声明变量或函数时，它们的名称会被 `hoisted` 到 `Scope` 的顶部，这样 JavaScript 就知道它们的存在。它们的表达式不会被提升，它们将在脚本运行到它们时在运行时求值，但
    `pointer` 在最顶部被认可。

    *   **Anonymous function**（匿名函数）是一个 `assigned` 给变量的函数。它是变量的一个表达式。我们用分号结束变量赋值。

    *   **Named function**（命名函数）是一个 `declared` 函数。它作为函数被列在作用域的顶部，而不是简单的命名变量。

    *   当函数在自身内部调用自己时，被称为 `[recursion](http://en.wikipedia.org/wiki/Recursion)`。


    ## 1.8 不可触摸的对象


    ### 还记得对象在哪里吗？


    对象位于 `heap` 中。它们是引用类型。


    ### 我们如何访问对象？


    我们通过给它分配一个标签来访问对象。这个标签被称为变量。变量指向对象。


    ### 当我们移除变量时，对象会发生什么？


    对象会被自动放入垃圾回收进行删除。


    ### 我们可以直接触摸并修改对象本身吗？


    *大不！*我们需要使用指针（变量）来处理对象。通过指针以及相关的其他技术，我们能够通过接口机制操作或修改对象，这取决于对象可属性和方法。


    到目前，我们已经知道新对象如何从大对象（JavaScript 对象模板）继承某些方法和属性，但我们当然可以添加新的或覆盖现有的。我们将在实验课程中练习不同的技术。

    '
- fmt: '

    But wait! Without a variable pointing to the object there is no object if the
    object has been created from scratch, or instantiated from another object. What
    about permanent objects such as `native` objects, `built in` objects or `the Global
    object` itself?


    These objects always exist. They are in standby waiting to be called upon by another
    variable whenever needed. **The permanent library never goes away**.


    **This is an important concept:** JavaScript is **not just** **ECMAScript**. JavaScript
    is a combination of ECMAScript and the environment where it is being used such
    as the browser (I’m referring to `DOM` & BOM). ECMAScript is implemented by a
    JavaScript Engine. There are several engines being used. A short discussion on
    engines can be found at [Wikipedia](http://en.wikipedia.org/wiki/JavaScript_engine).


    ## 1.8.2 Native objects


    Native objects are originally implemented by the ECMAScript standard and they
    are always present no matter where JavaScript is being used at. They help to specify
    and define other objects. Native objects are also called `Standard Global Objects`.


    Some of the standard built in objects are the following:


    `Array`, `Boolean`, `Date`, `Function`, `Math`, `Number`, `Object`, `RegEx`, `String`.


    A list of Standard Global objects can be seen At the [Mozzila Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects).


    Do not confuse the term `Global Objects` with `The Global` Object (the mother
    of all objects, the object `Object`). This particular object is the prototype
    we have mentioned earlier in 1.3 Variables vs. Reference Types. Actually we **can’t**
    even refer to it directly since its name varies with each environment where ECMAScript
    is used at. For example, in the browser it assumes the name `Window`. `Window`
    is the very first object, (root of the script) and any global declaration (like
    for example: `var x;`), are scoped at the `Window level` or at the level of the
    `Global Object`. We will experiment with this concept on the next lab work.


    Some native objects, such as `String` and `Math`, allow access to their properties
    and methods without instantiating a new object. Other native objects, such as
    `Date`, require you to create a new instance in order to use their properties
    and methods.


    ## 1.8.3 Hosted Objects


    Other objects are supplied by the **host environment** which interfaces with ECMAScript
    to complete the whole JavaScript functionality. In the browser, the other objects
    come from the [DOM](http://en.wikipedia.org/wiki/Document_Object_Model) (the document
    environment) and the BOM (the browser environment).

