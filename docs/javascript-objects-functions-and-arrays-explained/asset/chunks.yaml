    | [RegExr](http://gskinner.com/RegExr/) : an intuitive tool for learning RegEx.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    *   [String.prototype.match (regexp)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.10).


    ## 2.1.7 replace( )


    Another search method is the replace() which searches a string for a specific
    value and returns a *new string* where the value found is replaced by the value
    indicated on the second parameter. We could also search using regular expressions.


    The sample script below uses our previous variable **xyz** to replace delicious
    for tasty:


    **xyz = xyz.replace("delicious","tasty");** 


    // returns “Apples and bananas are **tasty**”.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    *   [String.prototype.replace (searchValue, replaceValue)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.11).


    ## 2.1.8 search( )


    The **search( )** method returns a negative one **(-1)** if no match is found,
    or it returns a ***position number*** if a match is found.


    1- Create a string variable:


    **var xyz = "Apples and bananas are delicious";**


    2- Then use search() to look for a word in the string:


    **xyz.search("bananas");** // returns 11 (it starts counting from 0, *b* is at
    position 11 including spaces).


    3- Let’s try finding the characters ‘na’:


    **xyz.search("na");**  // returns 13 ( from 0, n is at position 13).


    4- search() is by default a ***case sensitive*** method:


    **xyz.search("A");**  // returns position 0 for **A**pple.


    **xyz.search("a");**  // returns position  7 (Apples **a**nd…)


    **xyz.search(/a/i);**


     // returns position 0\. Here we used a **regular expression** with flag "i" which
    stands for **insensitive** (case insensitive). This will give me the first character
    "a" found, regardless of its *letter case*.


    To learn more about regular expressions please navigate to Mozilla’s [RegExp](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions).


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.5.4.12 String.prototype.search](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.12).


    ## 2.1.9 slice( )


    The method **slice( )** extracts the text *from* one string and **returns** a
    *new* string with the extracted text. Changes to the text in the old string do
    not get affect unless the method is applied to itself. This is the same as taking
    a slice of cake but the cake stays intact. We must give this copy of sliced cake
    to another variable in order to reuse it.


    This method uses up to  two parameters. The first parameter indicates the zero
    based **first character to be sliced** *(copied from)*. The second parameter indicates
    the first character to be excluded from the action of slicing. 


    Sample scripts:


    1- Declare a variable: **var xpt = "red,blue,white,black";**


    2- Extracting the word “**blue**” into another variable:


    **var xpt2 = xpt.slice(4,8);**


    3- Call **xpt2;** // returns “blue” The first character to be included is on position
    4, and the first to be excluded is on position 8, which is the comma.


    - **Using negative numbers:**


    As an alternative, if we apply an negative number to the second parameter, it
    changes its meaning: now it means to start *excluding* from the right based on
    the number of characters indicated. Commas and spaces count as characters.


    4- For example: excluding the last color, (black and the *comma* to the left)
    from our slicing:


    **var xpt3 = xpt.slice(0,-6);**


    5- Call the variable: **xpt3;** // returns “red, blue, white”.


    In other words, it includes all characters from position zero on, except the last
    6 from the end. This also means that we could exclude some characters from the
    extreme left if instead of zero we entered some other number as the left parameter.


    - **Using just one parameter:**


    When using just one positive parameter, it represents the first character position
    to be included on the slice which extends all the way to the end.


    6- For example:


    **var x = xpt.slice(3);** // returns ",blue,white,black", which means that "red"
    was cutoff.


    If the single parameter is negative, it has an opposite effect: it tells JavaScript
    how many characters to include from the right and exclude all else.


    7- Example:


    **var x = xpt.slice(-3);** // it returns "ack" from "black". It counted from the
    right to the left 3 characters and cutoff all the others to the left.


    8- One more example. Extract the "e"  from ecmascript:


    **"ecmascript".slice(1);** // returns "cmascript".


    This is actually useful to remove the first character and replace it with another
    similar capitalized character, as we will see later in the book when we cover
    toUpperCase().


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.5.4.13 String.prototype.slice](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.13).


    ## 2.1.10 split( )


    The method **split()** is a very useful one so let’s make sure we understand the
    mechanism behind it. split() converts a string into an array. The opposite of
    split() is join(). Arrays will be covered on the next topic.


    1- As an example we are going to declare a new variable with words separated by
    a space ( no commas)


    **var abc = "green yellow red black";**


    Vocabulary: In computer science, a **delimiter** is a symbol (or sequence of characters)
    marking the beginning or the end, of a *unit of data*. In the following example,
    1|2|3, the delimiter is the pipe symbol |. Here, “1, 2, 3, 4” the delimiter is
    the comma, etc.


    The first thing we need to determine when splitting a string is what are we going
    to use as a *delimiter* in order to separate the *units of data*.


    In our case we will use a **blank space** between words as a delimiter. What this
    means is that the method split( ) will grab everything in between two delimiters
    , creating an array with the split data.


    2- Let’s **split** variable abc into separate words using the white space as a
    delimiter, and put it on a new variable named abc2:


    **var abc2 = abc.split(" ");**


    3- Call the variable: **abc2;** // returns ["green", "yellow", "red", "black"].


    The white space was eliminated and each word became individualized in a new array.'
