    \ we are creating a new function with a whole new list of available variables\
    \ and other resources. When the function returns, these list gets wiped out.\n\
    \n**Variable search:** For each different scope, a list called an `activation\
    \ object` is created. An activation object is a list of all available variables.\
    \ The activation object is saved in the `heap` allowing it to last longer than\
    \ if it was in the temporary stack. This is the `chain` the `interpreter` will\
    \ traverse when looking for a variable. It starts at the local scope, the inner\
    \ most scope where the script is acting from; if not there, it goes one step further;\
    \ if not there, it goes up higher until it reach the end of the scope environment\
    \ for the script in question. The `first` variable to be found with a `given name`\
    \ is the one to be used. Even if there are other variables with the same name\
    \ elsewhere up the chain, the interpreter will never get there once it finds its\
    \ first target.\n\nEvery function can actually be considered a `closure` since\
    \ a function has access to global variables, as well as to the variables from\
    \ outer functions if any (parent functions, not sibling functions). What is a\
    \ closure if not the combination of a function and all the variables available\
    \ in the entirety of its scope? Be sure to `return` your closure functions when\
    \ no longer needed, in order for the garbage collection to do its job and save\
    \ memory in the long run. Avoid [memory leaks](http://en.wikipedia.org/wiki/Memory_leak).\n\
