  raw: '1- Declare a variable: **var x = "ninja";**


    2- Add the property color: **x.color = "green";** Console returns “green” (so
    it must have accepted it, right?) Let’s test it and see:


    3- Enter **x.color;** returns “undefined”. **What happened?** It didn’t save it.
    **In order to save a *property* we should send it to the heap as a reference value**.
    Let’s do that….


    4- Declare another variable but this time assign it to an object by creating the
    expression at the heap (the braces will do that for you):


    **var y = { };**


    5- Now try adding a property just like before: **y.color = "green";**


    6- Call the property: **y.color;** // console returns “green”. Alright, *we’re
    in business!!*


    7- Call it again with window just for fun:


    **window.y.color;** // returns “green”.


    **What do you think it happened?**


    By pointing a variable to a *reference value*, we can add properties to it. When
    and if we delete, **dereference** or reassign the variable, the object will automatically
    be placed on *garbage collection* according to the browser’s implementation, and
    the memory will be cleared once the object gets deleted.


    In summary, we have created an object under the window object. This object inherited
    all the properties and methods available from window, also known as the Global
    Object. We will *peel* more of this onion a bit later.


    Now let’s consider another important concept:


    Our first variable **x** contains a value of “**ninja**”. Let’s assign “ninja”
    to a second variable:


    8- Declare a new variable **z** and assign it to **x:** **var z = x;**


    9- Test **z**: **z;** // returns “ninja”


    10- Now change **x** to  **samurai**: **x = "samurai";**


    11- Test **x**: **x;** // returns “samurai”.


    12- Test **z**; **z;** // returns “**ninja**”.


    **What do you think it happened?**


    If **x** was pointing at an *object* when we assigne **z = x**, we would have
    told **z** to *point at* the same object. However, **x** is a **string** variable
    located in the *stack* because it is a **primitive value**. When we assign other
    variables to existing primitive values we are actually copying the data into the
    new assignment. We copied **x** into **z**. Then we changed the value of **x**
    which it didn’t affect the value of **z**, right?


    This is called **passing data by value** and it is what happens with primitive
    values.


    Every time we assign a value to another variable it gets copied into the variable
    itself because in the stack, a variable and its stack data is all **one unit**.
    As a helper to remember “passing by value”, think of “adding value” when we duplicate
    (copy) stuff (I know it’s cheesy but it may help).


    When it comes to reference values (the ones in the heap), things work a bit differently.
    That’s why they are called *“reference”* and we will see the difference in a second.
    This is obviously called **passing data by reference** (by pointing instead of
    copying).


    Let’s do some more testing:


    You should still have your **object** **y** in the console (if not, create a new
    one again by following steps 4 & 5 above).


    13- Test y just to be sure: **y;** it should return *Object {color: "green"}*


    14- Assign a new variable **b** to ***y***: **var b = y;**


    15- Test **b**: **b;** // it should return *Object {color: "green"}*.


    Now **y** and **b point to the same object *source***.


    16-  Add a new color to **y**:


    **y.color2 = "red";**


    17- Test **y**:


    **y;** //  returns *Object {color: "green", color2: "red"}*


    18- Test **b**: **b;**//  returns *Object {color: "green", color2: "red"}*


    As seen, reference values don’t get copied when we assign a second variable to
    them.


    Here the variable acts as a *pointer*, and a reference value can have many pointers.
    If one of the pointers edits the data from the object, the other pointers will
    reflect the same data from the same object. This saves memory but we also need
    to be careful because if we want to **dereference** the object in order to clear
    memory space, we need to make sure that we dereference all the variables pointing
    to the object.


    **What would happen to b, if we reassigned y to a different object?**


    Let’s try it:


    19- Reassign y: **y = {"color": "violet"}**


    20- Test it: **y;** // returns *Object {color: "violet"}*


    21- Test b: **b;**  //b remains the same:  *Object {color: "green", color2: "red"}*.


    22- Let’s practice **dereferencing** objects  by first, assigning another variable
    to **b**:


    **var c = b;**


    23- Test **c;**  // returns *Object {color: "green", color2: "red"}*


    24- Dereference **b**: **b = null;**


    25- Test **c**: **c;**  // returns *Object {color: "green", color2: "red"}*


    26- Dereference **c**: **c = null;**


    27- Test **c**: **c;**  // returns null


    The object has finally been sent to **Garbage Collection** and it will be disposed
    of because there is no reference pointing to it from the stack. It will be deleted
    on the next memory sweep.


    ## 1.11.2 How to pass in data from the stack to the heap


    One way to pass data from the stack to the heap is as an *argument* in a function
    *call*.


    ![](images/00012.jpeg)


    Figure 12


    In JavaScript, *primitive* data from a variable can be passed *into* a function
    as a copy, via a function ***argument*** which is given to a function ***parameter***.


    The parameter acts as the *interface* between stack and heap. In other words,
    the data in the variable and the data being passed into the function become independent
    of each other. (**x above is pointing to function, but x(33) is copying into the
    function**). So even though a function resides in the heap, we are **not** pointing
    or **passing by reference**, we are actually cloning the data to be processed
    by the function, which is the same as *passing by value* (remember? *like copying
    data into another variable, or “adding”value*). If the data as in x(33) changes
    after the first copy, it will not affect the function data already passed in,
    it will create a new function call (a new instance of the function with new data).


    **Please note:** we are talking about *passing in* data from the ***stack*** to
    the ***heap***. This data is copied because there is no physical connection.


    When it comes to internal data being passed into a function from inside the heap
    itself, like from another function, object or array, it is done *by reference*,
    not by copying. When we pass an object or an array as an argument into a function,
    we are **passing by reference**. They are both in the heap,  function and (objects
    or arrays). Passing by reference means that any change processed inside of the
    function will be reflected on the original object/array being passed in. This
    is because we have actually given permission to the function to point at the object
    or array and modify it as per the function code.


    Looking it from a different perspective, a function parameter accepts a copy of
    data coming from a primitive on the stack, but it does not accept a copy of data
    if the data is coming from the heap. Instead, it points to the existing data,
    the one coming from another function, object or array.


    This difference is important because the behavior of data coming from the stack
    and data coming from within the heap have different outcomes. To *cross the void*
    from stack to heap, one needs to copy. To travel from within the heap one only
    needs to point and in this case, *any change by the pointer will change the original
    data*.


    Congratulations on reading and understanding this material.


    Let’s move on to part two and peel the onion a bit more.


    This mental picture of JavaScript will serve you well.


    There is no shame on reviewing if you must, it is actually a good sign.


    Black belt is on the horizon…


    *Thanks for coming along!*


    *Tony de Araujo*


