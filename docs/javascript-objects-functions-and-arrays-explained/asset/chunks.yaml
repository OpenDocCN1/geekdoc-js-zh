    ## 2.4.5 indexOf() 与 lastIndexOf()


    如果我们只需要某个特定且唯一项的索引，那么 `indexOf` 和 `lastIndexOf` 的性能是相同的。但在长数组中，取决于项所在的位置（是在前半部分还是后半部分），其中一种方法可能会比另一种方法快。


    如果存在多个相同的项，选择一种方法而非另一种方法将输出不同的结果。


