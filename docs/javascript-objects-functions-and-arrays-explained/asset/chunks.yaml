    \ `split` 函数传递分隔符，结果仍然是一个数组，但数组中的项目数量将为一个。所以从某种意义上说，`split()` 可以作为另一种将`length`为\
    \ 1 的`字符串转换为数组`的方法，但可能并不是一个很常用的方法。\n\n正则表达式让 `split` 变成了一个非常强大的方法。花时间学习正则表达式是一项非常值得的投入。这里关于该主题的另一个链接：[Wikipedia](http://en.wikipedia.org/wiki/Regular_expression)。\n\
    \n**欲需更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n- [15.5.4.14 String.prototype.split](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.14)。\n\
    \n## 2.1.11 substr()\n\n子字符串方法 `substr()` 是 `slice()` 方法的替代方案。`slice()` 方法接收一个\
    \ `start` 索引位置和一个 `end` 索引位置，而 `substr()` 方法接收一个 `start` 索引位置和一个表示要提取项目长度的数字。\n\
    \n不要将 `substr()` 与 `substring()` 混淆。后者实际上已经被 `slice()` 取代了。我们稍后会讨论它。\n\n**何时使用\
    \ slice 何时使用 substr？**\n\n当你知道第一个要`包含`的字符的位置数和第一个要`排除`的字符的位置时，使用 `slice()`。当你知道需要提取内容的字符`length`时，使用\
    \ `substr()`。无论使用哪种方法，你都需要知道要包含的第一个字符的位置。\n\n在 `substr()` 中，`(4,9)` 意味着提取从 4 开始（从\
    \ 0 开始并计算空格，这意味着第 5 个字符）并停止于 12（包含），这意味着第 13 个字符，对应于 `4 + 9`。\n\n**示例代码（与 slice\
    \ 使用的相同）：**\n\n1- 声明一个变量：\n\n```javascript\nvar xpt = \"red, blue, white, black\"\
    ;\n```\n\n2- 使用与之前 slice 相同的脚本，以便我们能够看到区别：\n\n```javascript\nvar xpt2 = xpt.substr(4,9);\
    \ \n// 从 0 开始，将空格作为第一个字符，然后向右计数 9 位，包含在内。\nxpt2; // 返回 \" blue, wh\". \n```\n\n\
    如果你记得，之前用于 slice 的相同数字 `(4,9)` 给了我们“blue”。`slice 4/9` 意味着从 4 开始（0 索引）并排除 9，给了我们“blue”。现在，通过使用\
    \ `substr`，`(4, 9)` 意味着从 4 开始（0 索引）并向右扩展 9 个字符，给了我们“blue, wh”。\n\n**注意：** 在 `substr`\
    \ 中，第二个数字 9 是要提取的字符数。在 `slice` 中，第二个数字 9 代表第一个要排除的`position`（位置数）。\n\n![](img/00014.jpeg)\n\
    \n图 14\n\n**欲需更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n- [String.prototype.substr (start,\
    \ length)](http://www.ecma-international.org/ecma-262/5.1/#sec-B.2.3)\n\nSubstr\
    \ 未在 ecma-262 中发布。然而它现在位于附录 B（上面的链接）。\n\n## 2.1.12 substr() vs substring()\n\n\
    这里情况变得有一点混乱，因为 `substr` 和 `substring` 的名字看起来非常相似。实际上，它们的工作方式是不同的，意义在于`substring\
    \ 已经被 slice 取代`。\n\n曾几何时，JavaScript 开发者想要实现负数作为从字符串末尾数到某个特定位置的手段。问题在于为了向后兼容，因此他们决定想出一个不同的方法名称\
    \ `slice()`，并保留了原来的名称 `substring`。\n\n除了不接受负数外，`substring` 不在乎参数的顺序，这意味着它总是假设较小的数字在前面。所以当我们编写代码\
    \ `(5,4)` 时，它意味着 `(4,5)`。`slice()` 方法则严格得多，顺序是重要的，因为它不会自动反转顺序。\n\n**该怎么办？** 使用\
    \ `slice()`。注意 `substring()`。\n\n**欲需更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n- [15.5.4.15\
    \ String.prototype.substring](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.15)。\n\
    \n## 2.1.13 toLowerCase() and toUpperCase()\n\n`toLowerCase()` 方法输出一个全小写的新字符串。`toUpperCase()`\
    \ 方法输出一个全大写的新字符串。\n\n**示例代码：**\n\n1- 声明一个变量：\n\n```javascript\nvar txt = \"ECMASCRIPT\"\
    ;\n```\n\n2- 转换为小写：\n\n```javascript\ntxt.toLowerCase(); // 返回 \"ecmascript\"\n\
    ```\n\n3- 转换为大写：\n\n```javascript\ntxt.toUpperCase(); // 返回 \"ECMASCRIPT\"\n```\n\
    \n4- 这里是首字母大写的一种方法：\n\n```javascript\ntxt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase();\
    \ // 返回 \"Ecmascript\"\n```\n\n5- 或者不用 `charAt`，我们可以使用数组符号：\n\n```javascript\n\
    txt[0].toUpperCase() + txt.slice(1).toLowerCase(); // 返回 \"Ecmascript\"\n```\n\
    \n不要忘记可以使用 CSS 将段落的首字母大写：\n\n```css\np:first-letter { text-transform:capitalize;\
    \ }\n```\n\n**欲需更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n- [15.5.4.16 String.prototype.toLowerCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.16)。\n\
    - [15.5.4.17 String.prototype.toUpperCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.17)。\n\
    \n## 2.1.14 trim()\n\n`trim()` 方法是由 ECMAScript 5 引入的。它创建一个去掉所有前后空格的字符串副本。由于原始字符串保持不变，如果我们清理原始字符串，我们需要将其赋值给自己。\n\
    \n**示例代码：**\n\n1- 声明一个带有多个开头和结尾空格的字符串：\n\n![](img/00015.jpeg)\n\n图 15 [原始文件](http://icontemp.com/joagi/scripts/8.txt)。\
    \ [ icontemp.com/joagi/scripts/8.txt ]\n\n2- 调用变量查看字符串的样子：\n\n```javascript\n\
    str1; // 返回像上面一样带有多个空格的 test，对吗？\n```\n\n3- 声明第二个变量并将其赋值为 `str1` 的修剪版本：\n\n![](img/00016.jpeg)\n\
    \n图 16\n\n4- 调用 `str2` 查看它的样子：\n\n```javascript\nstr2; // 返回完全修剪的“test”，对吗？\n\
    ```\n\n5- 调用 `str1` 查看它的样子？\n\n```javascript\nstr1; // 返回带有所有空白字符的原始字符串。\n```\n\
    \n为了清理原始字符串，我们需要将变量赋值给自己。\n\n6- 像下面的图片所示：\n\n![](img/00017.jpeg)\n\n图 17\n\n7-\
    \ 现在当你再次调用 `str1` 时，它将是完全修剪过的，周围没有空格。\n\n`trim()` 方法可能无法被如 *IE8* 及更早版本的浏览器识别。如果这是一个问题，请尝试使用\
    \ jQuery 版本。\n\n"
