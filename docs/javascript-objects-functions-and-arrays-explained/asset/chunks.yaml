- fmt: '

    For practice purposes add a few properties and methods to the `String` object
    via the `prototype` property, and call `x` for each one of them. Creative practice
    is the way to cement concepts. Don’t forget that `x` is a property of the `window`.
    `x` is a string which inherits `String` methods but it is also a property of `window`.
    We could have coded all our scripts with `dot` as a prefix, like: `window.feelings;`
    or even `window["feelings"];` which means the following address: `location` on
    `window`.


    ### Constructor


    Every time we create a new string variable, it inherits the "prototype" where
    we can find readily available properties and methods to use, and we can add our
    own via the "property" also known as `prototype`. The third property available
    to a string primitive via its String object, is the "constructor" which contains
    a reference to the `function` that potentially creates another replica of the
    `String` object.


    If one hand the `prototype` points to a "menu", on the other hand, the `constructor`
    points to a function or method that can build `instances` of the `String` object.
    This means that we can bypass the act of prototyping by doing it directly as we
    create the object. So, while the `prototype` only creates `properties`, the `constructor`
    creates `objects` with optional properties. However, for memory efficiency it
    is best to leave the method creation to the `prototype`, instead of referring
    to already existing prototypes. Newly constructed objects also inherit properties
    and methods from their native objects such as: `charAt`, `charCodeAt`, `concat`,
    `fromCharCode`, `indexOf`, `lastIndexOf`, `match`, `replace`, `search`, `slice`,
    `split`, `substr`, `substring`, `toLowerCase`, `toUpperCase`, `valueOf`.


    ### `charAt(pos)` and `charCodeAt(pos)`


    Both of the above methods have to do with accessing a character from a string
    based on the character’s position. The first returns the character and the later
    returns the character. Let’s look at an example of each:


    1. Declare a variable `x`: `var x = "bananas";`

    2. Call its wrapper method `charAt`: `x.charAt(2);` // returns "n" (it starts
    from 0, the most left character and it picks the character at position 2, like
    0, 1, 2).

    3. The above method does the same as we call with bracket notation. Try it out:
    `x[2];` // returns “n”. Bracket notation is newer from the ECMAScript and may
    not be recognized on very old browsers.

    4. Try the other method: `x.charCodeAt(2);` // returns 110 which is the Unicode
    code point. `charCodeAt` is a direct match of the ASCII character encoding. For
    information on Unicode please read it here: [Mozilla](https://developer.mozilla.org/en-US/docs/Web/Guide/Values,_and_literals)
    or [Wikipedia](https://en.wikipedia.org/wiki/Unicode).


    For more information, please refer to the following ECMCRIPT 5 page:

    - `15.5.4.4 String.prototype.charAt`

    - `15.5.4.5 String.prototype.charCodeAt` (The `charCodeAt` code range from 0 to
    65535).


    ### `fromCharCode(pos)`


    The method `fromCharCode(pos)` is the inverse of `charCodeAt()`. This method is
    pretty simple. It returns a character based on the Unicode given as an argument:


    ```

    String.fromCharCode(110); // returns n

    ```


    You can assign the result of these methods to variables. We can also call in several
    Unicode numbers:


    ```

    String.fromCharCode(110, 111, 112); // returns nop

    ```


    For more information, please refer to the following ECMCRIPT 5 page:

    - `15.5.3.2 String.prototype.fromCharCode`


    ### `concat()`


    The `concat()` method is sometimes used in place of the `+` operator to concatenate
    (join) different strings to one another. Here’s an example:


    1. Our previously declared variable `x`: `var x = "bananas";`

    2. Declare another variable combining two strings (notice the space on the left):
    `var w = x.concat(" are good for you!");`

    3. Call `w`: `w;` // returns "bananas are good for you!".


    Concatenation does not change the value of the original variable `x` unless concatenation
    is called upon itself like in this case (no need to do it): `x = x.concat(" are
    good for you!");` which is the same as using `+=` on itself instead of `concat()`.


    4. The method `concat` comes handy at times like in this example where several
    variables are added to compose a new string:


    ```

    var h = "Read this: ";

    var y = " are good for you!";

    h = h.concat(x, y); // returns "Read this: bananas are good for you!"

    ```


    For performance reasons the preferable way to concatenate in JavaScript is using
    `+` or `+=`. However the `+` is slower than the `+=` as the engine creates a new
    temporary string for every two strings separated by a +. Which method to use?
    It just depends on what you are trying to accomplish based on the existing code.
    To have options is a good thing.


    For more information, please refer to the following ECMCRIPT 5 page:

    - `15.5.4.6 String.prototype.concat`


    ### `indexOf()` and `lastIndexOf()`


    This is a very important method. The String methods `indexOf` and `lastIndexOf`,
    return the position of a specified value in a string.


    The first method searches from the beginning of the string, and the second method
    starts searching from the last character instead of from the first.


    If the character is unique, both methods will return the same value. If we ask
    for the index of "n" in "bananas" where multiple "n"s exist, `indexOf` will return
    position 2 because it finds the first "n" there. However, `lastIndexOf` will return
    position 4 because it finds its first "n" there (but it also displays its counts
    from left to right, not from last to first). A position number 5, for example,
    is the same position for both methods.


    Example scripts:


    1. If our old `x` is not defined, define it again as `var x = "bananas";` then
    try the following scripts:


    ```

    x.indexOf("n"); // returns 2

    x.lastIndexOf("n"); // returns 4

    ```


    2. Let’s try another one:


    ```

    var aba = "The quick brown fox jumps over the lazy dog.";

    aba.indexOf("brown"); // returns 10

    ```


    When a word or character is not found, both methods return a `-1`. This can be
    very useful. Suppose your decision depends whether a certain word exists or not
    on the paragraph. We could use a conditional statement such as this:


    ```

    if(aba.indexOf("brown") !== -1)

    ```


    which means, if the word exists, do this, else do that. See the following raw
    file for an example of both conditions: [raw file](http://icontemp.com/joagi/scripts/indexof.txt).

    '
