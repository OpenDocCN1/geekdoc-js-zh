    \ wrap the second into the first**: **Math.floor(Math.random()*10+1);** // results:\
    \ rounds down to 1,7, 8, 4,10 etc\n\n**Math.ceil(Math.random()*10+1);** // results:\
    \ rounds up to 2, 8, 9, 5, 11etc.\n\n**Human versus machine**\n\nThe following\
    \ script is a simple guessing game between  a machine and a man. It could be the\
    \ seed for a more sophisticated match if you want to make it better. Its purpose\
    \ is to illustrate Math.random and Math.floor. When we call the function with\
