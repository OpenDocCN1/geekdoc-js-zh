  raw: '**d) toString()** - Every object has a toString() method. It is automatically
    called when the object is to be represented as a text value like when we alert(object)
    or console.log it. String conversion happens when a string representation of an
    object is required.


    e) **valueOf()** - JavaScript **returns the primitive value of** the specified
    object. **myobject.valueOf();** may return an Array, Boolean, Date, Function,
    Number, Object, String. JavaScript uses this method internally and as needed,
    but we can also call it on purpose. Objects *Math* and *Error* do not have a built-in
    valueOf method.


    Going back to properties:


    Picture this: **A property** of an object can be explained as a **variable**  **attached
    to** the object. Of course, all these properties and values can be overwritten
    when we create a new object.


    **So, in this example:** var tony = new Object(); **is *tony* the object itself?**


    The answer is **No;** *tony* is a **label**, a *symbol*. Technically the symbol
    *tony* is classified as a **variable** (a pointer) which temporarily resides in
    the **stack** and **points** to an **object** instantiated (cloned but using existing
    functionality) from a **template**. This object resides in the **heap** and once
    we reassign or delete the label *tony*, this objet goes into **garbage collection
    mode** from where it will be erased (different browsers implement different ways
    of sweeping unused data. This technique gets improved with each new browser version).


    In **JavaScrip**t, ***almost* everything is an object**. All primitive types except
    **null** and **undefined**, are actually treated as objects by JavaScript, because
    they get internally *wrapped into* objects, whenever the interpreter needs to
    implement a method to process the primitive in question.


    Because they can be wrapped as objects, properties and methods can be assigned
    to primitives, showing all the characteristics of an object. This is because **JavaScript**
    has a prototype **reference** for **Boolean**, **Number** and **String** in its
    library, which is automatically called in when temporarily needed  to wrap a primitive
    value:


    ![](images/00003.jpeg)


    Figure 3


    ## 1.4 Everything comes from objects


    ## 1.4.1 Lab 1


    Time to fire up your favorite *JavaScript Console* and do some lab work. In this
    project I will use the console from **Google Chrome**. At the browser, you can
    click on the shortcut **CRTL+SHIFT+j** for Windows, **CMD+OPT+j** for Mac, or
    follow the steps below:


    a) Open Chrome. On the top right, locate the 3-horizontal-lines button, and click.


    b) In the *Tools* section, click on *JavaScript Console*.


    Now let’s play a bit with**typeof**. Observe each result and try deducting the
    reasons why it is so.


    **typeof** is a JavaScript operator. Its purpose is to  return a string indicating
    the type of the operand.


    Enter the code in green, followed by the **Enter** key. Pay closer **attention
    to steps 9..15**:


    1-    **typeof 1;**


    // result is “**number**”. Of course one is a number! Notice how the console automatically
    finished the *typeof* keyword. Never wrap a number in quotes unless you want to
    convert it to type string.


    2-    **typeof x;**


    // result is “**undefined**”. x does not exist as defined.


    3-    typeof **tony;** 


    // result is “**undefined**”. JavaScript doesn’t mess around!


    4-    typeof **"tony"**;


    // result is “**string**”. Ah now we are speaking JS lingo! The quotation marks
    make it a string.


    5-    typeof **true;**


    // result is “boolean”. *true* is a reserved word. JavaScript is case sensitive.


    6-    typeof **"true"**;


    // result is “**string**” *Do you see why*? Although *true* is reserved, **“**true**”**
    does not exist as string.


    7-    **var** y = 123;


    // (enter) then code: 


    8-    **typeof y;** 


    // result is “**number**”.


    9-    var z = new  Object;


    // O is capitalized. Click (enter), then code:


    10-  **typeof z;**


    // result is “**object**”.


    11-  var b **=** z;


    // (enter), then code:


    12-  typeof b;


    // result is “object”. Now both **z** and **b** point to the **same object**.
    Let’s now reassign **z**:


    13-  **z = 123;**


    // (enter) Then code:


    14-  typeof **z**;


    // result is now “**number**”. Z no longer points to the object. It symbolizes
    the number 123 in the stack.


    15-        typeof **b**;


    // result is still “object”. Object still exists due to symbol **b** which keeps
    it alive.


    In exercise **9** we declared **z** as a new Object (more about this later). Notice
    how the o Object is capitalized. All JavaScript native objects start with a capital
    letter. String and string are not the same symbol. JavaScript is case sensitive.
    Back to our **z**, z is a variable in the stack that points to an object in the
    heap, right?


    In exercise **11** we declared a variable **b** and assigned it to the same value
    as **z**. So **b** is now a *label* for a pointer pointing to the same object
    as **z** (remember our figure 1?).


    In **13** we changed our mind and pointed **z** to the number 123\. So now **z**
    is of type “number’. It’s no longer pointing to the object.


    In exercise **15** we realize that **b** remains a true friend of the object and
    didn’t follow **z**. It still points to the object. This reminds us that when
    we assign one variable that points to something on the heap to another variable,
    it is a one shot deal. It says, “*Hey you, I want you to point at the same location
    I’m pointing at, but stay out of my way!*” If any of the variables gets reassigned
    to another object, the other variable doesn’t follow it. However if any of the
    variables **modifies the** current object it points to, the modification is reflected
    on both variables.


    **Note:** The description above only happens when we assign **reference data to
    variables**. If variable **a** is a string or a is a number, and we assign it
    to b, like **b = a**, string **a** is **copied** to string **b**. With ***primitives***,
    each variable and its data is independent of any other variable and its data.


    **Question:**


    Let’s suppose we reassign variable **b** (now the only link to the object) to
    something else, like for example *b=345*; Now the *type* of **b** is a ***number***
    and the object which **b** was previously pointing to, has no label to address
    it because no other variable points to it. **What happens to the object located
    in the heap**?


    **Answer:** The object gets flagged for “**garbage collection**” and eventually
    it will be *erased* from the browser the next time the interpreter sweeps the
    code.


    ## 1.4.2 Lab 2


    Let’s fire up our favorite JavaScript Console (I’m using Chrome) and code the
    following:


    `1-` `var x = "hat";`  `// Declare one more variable:`


    2-    var color = "green";


    3-    typeof x;  // result is “**string**”. (Nothing new so far!).


    4-    typeof color;  // result is “**string**”. (Same as above).


    You know how in JavaScript *almost* everything is an object, right?


    Let’s test it!


    Try another variable. This time however let’s add a few more properties to it.
    Notice the semicolon after the curly brace on the next step 1\. We are declaring
    a variable named shirt. *Variable declarations **always terminate with a semicolon**
    even if after curly braces*. A semicolon informs JavaScript that the statement
    is over, nothing more to declare:


    1-            var shirt={color: "white", size: "M", material: "cotton"};


    2-            typeof shirt;  //results in “object”


    **What happened there?** JavaScript is smart and as soon as it saw the **curly
    braces** it decided that this variable was going to be a bit more complicated
    than a simple primitive, and placed it in the **heap**, keeping *shirt* in the
    **stack** as a *pointer* to it.'
