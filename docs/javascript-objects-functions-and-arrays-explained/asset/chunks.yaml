  trans: '


    为了练习，请通过 `prototype` 属性为 `String` 对象添加一些属性和方法，并对其中的每一个都调用 `x`。创造性练习是巩固概念的途径。不要忘记
    `x` 是 `window` 的属性。`x` 是一个继承了 `String` 方法的字符串，但它也是 `window` 的属性。我们可以使用 `dot` 作为前缀编写所有脚本，例如：`window.feelings;`
    甚至可以是 `window["feelings"];`，这意味着指向 `window` 上的 `location` 地址。


    ### 构造函数


    每当我们创建一个新的字符串变量时，它都会继承“prototype”，在其中我们可以找到许多可用的属性和方法，我们也可以通过“property”（也称为 `prototype`）添加我们自己的内容。字符串原始类型通过其
    String 对象可用的第三个属性是“constructor”，它包含指向一个 `function` 的引用，该函数可能会创建另一个 `String` 对象的副本。


    如果说 `prototype` 指向一个“菜单”，那么 `constructor` 则指向一个可以构建 `String` 对象 `instances` 的函数或方法。这意味着我们可以在创建对象时直接进行操作，从而跳过原型链的过程。因此，虽然
    `prototype` 只创建 `properties`，但 `constructor` 创建带有可选属性的 `objects`。然而，出于内存效率考虑，最好将方法的创建留给
    `prototype`，而不是引用已存在的原型。新构造的对象也会从其原生对象继承属性和方法，例如：`charAt`, `charCodeAt`, `concat`,
    `fromCharCode`, `indexOf`, `lastIndexOf`, `match`, `replace`, `search`, `slice`,
    `split`, `substr`, `substring`, `toLowerCase`, `toUpperCase`, `valueOf`。


    ### `charAt(pos)` 和 `charCodeAt(pos)`


    上述两个方法都与根据字符的位置从字符串中访问字符有关。前者返回字符，后者返回字符。让我们来看每个示例：


    1. 声明变量 `x`：`var x = "bananas";`

    2. 调用它的包装方法 `charAt`：`x.charAt(2);` // 返回 "n"（它从 0 开始，最左侧的字符，选取位置为 2 的字符，如 0,
    1, 2）。

    3. 上述方法使用括号表示法调用的效果相同。尝试一下：`x[2];` // 返回 “n”。括号表示法是 ECMAScript 较新的特性，在非常旧的浏览器上可能无法识别。

    4. 尝试另一个方法：`x.charCodeAt(2);` // 返回 110，即 Unicode 编码点。`charCodeAt` 与 ASCII 字符编码直接对。。关于
    Unicode 的信息请阅读此处：[Mozilla](https://developer.mozilla.org/en-US/docs/Web/Guide/Values,_and_literals)
    或 [Wikipedia](https://en.wikipedia.org/wiki/Unicode)。


    更多信息，请参考以下 ECMASCRIPT 5 页面：

    - `15.5.4.4 String.prototype.charAt`

    - `15.5.4.5 String.prototype.charCodeAt` (`charCodeAt` 的代码范围从 0 到 65535)。


    ### `fromCharCode(pos)`


    `fromCharCode(pos)` 方法是 `charCodeAt()` 的反向。这个方法非常简单。它根据给定的 Unicode 参数返回一个字符：


    ```

    String.fromCharCode(110); // 返回 n

    ```


    你可以将这些方法的结果赋值给变量。我们还可以传入多个 Unicode 数字：


    ```

    String.fromCharCode(110, 111, 112); // 返回 nop

    ```


    更多信息，请参考以下 ECMASCRIPT 5 页面：

    - `15.5.3.2 String.prototype.fromCharCode`


    ### `concat()`


    `concat()` 方法有时用于替代 `+` 运算符，以连接（合并）不同的字符串。这里有一个示例：


    1. 我们之前声明的变量 `x`：`var x = "bananas";`

    2. 声明另一个组合两个字符串的变量（注意左侧的空格）：`var w = x.concat(" are good for you!");`

    3. 调用 `w`：`w;` // 返回 "bananas are good for you!".


    连接不会改变原始变量 `x` 的值，除非在自身上调用连接（这种情况不需要这样做）：`x = x.concat(" are good for you!");`，这与对自身使用
    `+=` 而不是 `concat()` 相同。


    4. `concat` 方法在某些情况下非常有用，例如示例所示，将多个变量相加组成一个新字符串：


    ```

    var h = "Read this: ";

    var y = " are good for you!";

    h = h.concat(x, y); // 返回 "Read this: bananas are good for you!"

    ```


    出于性能考虑，JavaScript 中连接字符串字符串的方式是使用 `+` 或 `+=`。然而 `+` 比 `+=` 慢，因为引擎会为每两个由 `+` 分隔的字符串创建一个新的临时字符串。使用哪种方法？取决于你根据现有代码想要实现的目标。有多种选择是一件好事。


    更多信息，请参考以下 ECMASCRIPT 5 页面：

    - `15.5.4.6 String.prototype.concat`


    ### `indexOf()` 和 `lastIndexOf()`


    这是一个非常的方法。String 方法 `indexOf` 和 `lastIndexOf` 返回指定值在字符串中的位置。


    第一个方法从字符串开头开始搜索，而第二个方法从最后一个字符开始搜索，而不是从第一个字符开始。


    如果字符是唯一的，两个方法将返回相同的值。如果我们询问 "bananas" 中 "n" 的索引（其中存在多个 "n"），`indexOf` 将返回位置 2，因为它在那里找到了第一个
    "n"。然而，`lastIndexOf` 将返回位置 4，因为它在那里找到了它的第一个 "n"（但它从左到右显示计数，而不是从右到左）。例如，位置 5 对两个方法来说是相同的。


    示例脚本：


    1. 如果我们旧的 `x` 未定义，重新定义它为 `var x = "bananas";` 然后尝试以下脚本：


    ```

    x.indexOf("n"); // 返回 2

    x.lastIndexOf("n"); // 返回 4

    ```


    2. 让我们尝试另一个：


    ```

    var aba = "The quick brown fox jumps over the lazy dog.";

    aba.indexOf("brown"); // 返回 10

    ```


    当未找到单词或字符时，两个方法都返回 `-1`。这非常有用。假设你的决策取决于段落中是否存在某个单词。我们可以使用如下的条件语句：


    ```

    if(aba.indexOf("brown") !== -1)

    ```


    这意味着，如果单词存在，则执行此操作，否则执行另一个操作。查看以下原始文件获取两种条件的示例：[raw file](http://icontemp.com/joagi/scripts/indexof.txt)。


    '
- fmt: "\nPlease note how these methods use `[camel case](http://en.wikipedia.org/wiki/CamelCase)`\
    \ syntax.\n\nFor more information, please refer to the following ECMASCRIPT 5\
    \ page:\n\n- [15.5.4.7 String.prototype.indexOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.7).\n\
    - [15.5.4.8 String.prototype.lastIndexOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.8).\n\
    \n## 2.1.6 match()\n\nThis method searches a string for a match against a `regular\
    \ expression` returning all the matches as an `Array`.\n\nSample scripts:\n\n\
    ```javascript\nvar xyz = \"Apples and bananas are delicious\";\nxyz.match(/n/g);\
    \ \n// returns [\"n  \", \"n  \", \"n  \"]\n```\n\nThe symbols `/ /` delimit the\
    \ expression we are searching for. `g` indicates that this is a `global` search,\
    \ meaning that we want JavaScript to return all findings, not just the first finding.\n\
    \nMore examples:\n\n```javascript\nxyz.match(/banana/g); // returns [\"banana\"\
    ]\n```\n\nWe could assign a variable to the array being returned. For example,\
    \ in \"Apples and bananas\".\n\n```javascript\nvar fruits = xyz.match(/Apples\
    \ and bananas/g); // returns [\"banana\"]\n```\n\nWe could also convert the output\
    \ to `string` instead of getting an array:\n\n```javascript\nvar fruits = xyz.match(/Apples\
    \ and bananas/g).toString();\n```\n\nCall fruits:\n\n```javascript\nfruits; //\
    \ returns \"Apples and bananas\":\n```\n\nRegular Expressions are a subject beyond\
    \ the scope of the current edition of this writing.\n\nUseful references:\n\n\
    [Mozzila](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
    \ | [RegExr](http://gskinner.com/RegExr/) : an intuitive tool for learning RegEx.\n\
    \nFor more information, please refer to the following ECMASCRIPT 5 page:\n\n-\
    \ [String.prototype.match (regexp)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.10).\n\
    \n## 2.1.7 replace()\n\nAnother search method is the `replace()` which searches\
    \ a string for a specific value and returns a `new string` where the value found\
    \ is replaced by the value indicated on the second parameter. We could also search\
    \ using regular expressions.\n\nThe sample script below uses our previous variable\
    \ `xyz` to replace delicious for tasty:\n\n```javascript\nxyz = xyz.replace(\"\
    delicious\",\"tasty\"); \n// returns “Apples and bananas are tasty”.\n```\n\n\
    For more information, please refer to the following ECMASCRIPT 5 page:\n\n- [String.prototype.replace\
    \ (searchValue, replaceValue)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.11).\n\
    \n## 2.1.8 search()\n\nThe `search()` method returns a negative one `(-1)` if\
    \ no match is found, or it returns a `position number` if a match is found.\n\n\
    1. Create a string variable:\n\n```javascript\nvar xyz = \"Apples and bananas\
    \ are delicious\";\n```\n\n2. Then use `search()` to look for a word in the string:\n\
    \n```javascript\nxyz.search(\"bananas\"); // returns 11 (it starts counting from\
    \ 0, b is at position 11 including spaces).\n```\n\n3. Let’s try finding the characters\
    \ ‘na’:\n\n```javascript\nxyz.search(\"na\"); // returns 13 ( from 0, n is at\
    \ position 13).\n```\n\n4. `search()` is by default a `case sensitive` method:\n\
    \n```javascript\nxyz.search(\"A\"); // returns position 0 for Apple\nxyz.search(\"\
    a\"); // returns position 7 (Apples and...)\nxyz.search(/a/i); // returns position\
    \ 0. Here we used a `regular expression` with flag \"i\" which stands for `insensitive`\
    \ (case insensitive). This will give me the first character \"a\" found, regardless\
    \ of its `letter case`.\n```\n\nTo learn more about regular expressions please\
    \ navigate to Mozilla’s [RegExp](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions).\n\
    \nFor more information, please refer to the following ECMASCRIPT 5 page:\n\n-\
    \ [15.5.4.12 String.prototype.search](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.12).\n\
    \n## 2.1.9 slice()\n\nThe method `slice()` extracts the text `from` one string\
    \ and returns a `new` string with the extracted text. Changes to the text in the\
    \ old string do not get affect unless the method is applied to itself. This is\
    \ the same as taking a slice of cake but the cake stays intact. We must give this\
    \ copy of sliced cake to another variable in order to reuse it.\n\nThis method\
    \ uses up to two parameters. The first parameter indicates the zero based `first\
    \ character to be sliced` (copied from). The second parameter indicates the first\
    \ character to be excluded from the action of slicing. \n\nSample scripts:\n\n\
    1. Declare a variable:\n```javascript\nvar xpt = \"red,blue,white,black\";\n```\n\
    \n2. Extracting the word \"blue\" into another variable:\n\n```javascript\nvar\
    \ xpt2 = xpt.slice(4,8);\n```\n\n3. Call `xpt2`:\n```javascript\nxpt2; // returns\
    \ “blue” The first character to be included is on position 4, and the first to\
    \ be excluded is on position 8, which is the comma.\n```\n\n- **Using negative\
    \ numbers:** As an alternative, if we apply an negative number to the second parameter,\
    \ it changes its meaning: now it means to start `excluding` from the right based\
    \ on the number of characters indicated. Commas and spaces count as characters.\n\
    \n4. For example: excluding the last color (black and the comma to the left) from\
    \ our slicing:\n\n```javascript\nvar xpt3 = xpt.slice(0,-6);\n```\n\n5. Call the\
    \ variable:\n```javascript\nxpt3; // returns “red, blue, white”.\n```\nIn other\
    \ words, it includes all characters from position zero on, except the last 6 from\
    \ the end. This also means that we could exclude some characters from the extreme\
    \ left if instead of zero we entered some other number as the left parameter.\n\
    \n- **Using just one parameter:** When using just one positive parameter, it represents\
    \ the first character position to be included on the slice which extends all the\
    \ way to the end.\n\n6. For example:\n\n```javascript\nvar x = xpt.slice(3); //\
    \ returns \",blue,white,black\", which means that \"red\" was cutoff.\n```\n\n\
    If the single parameter is negative, it has an opposite effect: it tells JavaScript\
    \ how many characters to include from the right and exclude all else.\n\n7. Example:\n\
    \n```javascript\nvar x = xpt.slice(-3); // it returns \"ack\" from \"black\".\
    \ It counted from the right to the left 3 characters and cutoff all the others\
    \ to the left.\n```\n\n8. One more example. Extract the \"e\" from ecmascript:\n\
    \n```javascript\n\"ecmascript\".slice(1); // returns \"cmascript\".\n```\nThis\
    \ is actually useful to remove the first character and replace it with another\
    \ similar capitalized character, as we will see later in the book when we cover\
    \ `toUpperCase()`.\n\nFor more information, please refer to the following ECMASCRIPT\
    \ 5 page:\n\n- [15.5.4.13 String.prototype.slice](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.13).\n\
    \n## 2.1.10 split()\n\nThe method `split()` is a very useful one so let’s make\
    \ sure we understand the mechanism behind it. `split()` converts a string into\
    \ an array. The opposite of `split()` is `join()`. Arrays will be covered on the\
    \ next topic.\n\n1. As an example we are going to declare a new variable with\
    \ words separated by a space ( no commas)\n\n```javascript\nvar abc = \"green\
    \ yellow red black\";\n```\n\nVocabulary: In computer science, a `delimiter` is\
    \ a symbol (or sequence of characters) marking the beginning or the end, of a\
    \ `unit of data`. In the following example, 1|2|3, the delimiter is the pipe symbol\
    \ `|`. Here, “1, 2, 3, 4” the delimiter is the comma, etc.\n\nThe first thing\
    \ we need to determine when splitting a string is what are we going to use as\
    \ a `delimiter` in order to separate the `units of data`.\n\nIn our case we will\
    \ use a `blank space` between words as a delimiter. What this means is that the\
    \ method `split()` will grab everything in between two delimiters , creating an\
    \ array with the split data.\n\n2. Let’s split variable `abc` into separate words\
    \ using the white space as a delimiter, and put it on a new variable named `abc2`:\n\
    \n```javascript\nvar abc2 = abc.split(\" \");\n```\n\n3. Call the variable:\n\
    ```javascript\nabc2; // returns [\"green\", \"yellow\", \"red\", \"black\"].\n\
    ```\nThe white space was eliminated and each word became individualized in a new\
    \ array.\n"
