    In this book the author uses the JavaScript Console from Google Chrome, as well
    as `Opera` and `Epic`.


    At the browser we can access the console by clicking on:

    - `CTRL+SHIFT+j` for Windows

    - or `CMD+OPT+j` for Mac.


    When you open it for the first time, **undock the console** by clicking on the
    square button on the lower left. Here’s a [link](https://developers.google.com/chrome-developer-tools/docs/shortcuts)
    to a list of shortcuts for the Chrome Developer Toolset. Google Chrome can be
    downloaded from [source](https://www.google.com/intl/en/chrome/browser/). As an
    alternative both [Opera](http://www.opera.com/) and [Epic](https://www.epicbrowser.com/)
    work the same. Please feel free to use your favorite browser as long as you know
    how to access its JavaScript console.


    If you need an editor online to use as a scratchpad you can use [EditPad](http://www.editpad.org/),
    or many other alternatives. **Update:** [jsbeautifier.org](http://jsbeautifier.org/)
    can also be used as an editor with the advantage of beautifying your code before
    you copy it. I’ve been using it daily to correct the layout of scripts submitted
    by my students.


    There is no need to memorize anything in the book.


    Please follow instructions for the exercises discussed on each chapter. Repetition
    of the examples is the key to master the subject at hand.


    Each topic is *short* and right to the point. Many subjects will be repeated as
    needed with further explanation the second time around. ***The onion is peeled
    in layers***.


    For your convenience there will also be external link references. The links to
    Standard ECMA-262 point directly to the topic being discussed. Sometimes the link
    takes us to the main page instead of the correct topic. This is due to some erratic
    behavior at the ECMA site. Usually if you click a second time it then goes directly
    into the correct location.


    “*Empty your cup, start at the beginning*” like every black belt martial artist
    does each day.


    # PART I : AT THE GATES OF ENLIGHTENMENT


    Awareness empowers


    ## 1.1 Prototypical versus Class-based


    Because JavaScript is all about *creating* and *destroying* objects, understanding
    the nature of a JavaScript object is the most important step for mastering JavaScript.


    Let’s revisit JavaScript by entering through the back door, albeit the least most
    common path.


    JavaScript is a **prototype-based** object oriented language. It is not a class-based
    object language.


    Both prototype-based and class-based languages have one purpose in common: to
    share code and avoid redundancy.


    In a class-based language, the programmer creates a blue-print (the class) and
    then objects are built based on such *schematic*.


    In a prototype-based language, the programmer creates an object and allows it
    to become a prototype for the creation of other objects. Like in a class paradigm,
    this technique avoids repeating code and it saves memory. From here on, all the
    theory about classes starts fading away. In addition, since objects are allowed
    to be linked together in a hierarchically manner, the code can be reused forming
    a **prototypical chain**. When an object needs a tool (a method), it goes up the
    chain until it grabs one from one of its ancestors (parent or grandparent).


    This classless model of language, also known as *instance-based* or **prototype-oriented
    programming** works with a process called *delegation*, or one object relying
    upon another to provide a specified set of functionality. It works because JavaScript
    relies on its real-time environment to make its magic. Like water in a river,
    it is never the same the second time around.


    Just because JavaScript can simulate many of the popular class features by using
    prototypes, it doesn’t mean it is a class based language. Someone once said that
    *familiarity takes off the edge of admiration*. Let’s admire JavaScript for what
    it is and not by what it looks like.


    Is there any advantage in prototypical code versus a class-based languages?


    Throughout the book, you will find useful reference links for further reading.
    Here is our first link from [Wikipedia](http://en.wikipedia.org/wiki/Prototype-based_programming).
    In the middle of the page, you will find a topic titled “Criticism” that may lead
    you in the right direction to get an answer to this question.


    ## 1.2 The Memory Concept


    Memory management or the act of *managing computer memory* is defined as a way
    to dynamically allocate portions of memory to a *program* **at** its request.
    It is also the act of freeing memory for reuse when data is no longer needed (a
    task **done by browsers**).


    A *thread* of execution **is** the smallest sequence of programmed instructions
    that can be managed independently. Multiple threads can coexist within the same
    process and share the same memory area.


    In general terms, we can **subdivide memory** into two distinct areas, the **stack**
    and the **heap**.


    A **stack** is a **restricted** data structure. Only a small number of operations
    can be performed in it. Usually this data points to bigger data on the *heap*.
    Like for example, variables pointing to objects.


    When these operations are done, the data is **automatically cleared** to give
    space for the next batch. In a way the stack acts as ***scratchpad*** for memory
    operations, and for the most part, only *quick data* such as **pointers** (variable
    names) reside in the **stack**.


    The ***heap*** is a completely different mater. To start with, in the heap, data
    is not as well organized as in the stack, and chunks of data can be stored [ad-hoc](http://en.wikipedia.org/wiki/Ad_hoc)
    because in the heap, if a piece of data gets larger, memory can be allocated as
    needed. This makes the heap slower than the stack. Stack memory is faster because
    in the stack, each data set has a specific size under strict management.


    ![](images/00001.jpeg)


    Figure 1 A picture is worth a gazillion words


    In **JavaScript**, **primitive type values** are stored in the **stack** and **reference
    type values** are stored in the **heap**. Remember “**reference type**”, we will
    be talking a lot about it.


    In general terms, a reference is something being referred by something else and
    without the referrer, there is no reference. In the picture above, when you cancel
    the link from **y** at the *stack* to the object in the *heap*, the object vanishes
    as we will see later in more detail.


    Do not try to *memorize* all this information. Just read it and **understand it**,
    as we will be mentioning it repeatedly with incremental detail in the process
    of pealing the JavaScript *onion*.


    In JavaScript **primitive type values** are defined as **Number**, **Boolean**,
    **String**, **Null** and **Undefined**. Since these are *simple values*, in JavaScript
    they are stored directly in the location taken by the **variable** (the stack):
    they are one and the same. For other types of data, **variables are nothing but
    *labels*** or *symbols* that point to the bigger stuff at the *heap*.


    **Reference type values** are that “*bigger stuff values at the heap*” mentioned
    in the prior paragraph. They have their *variable name* stored in the *stack*
    (acting as a **pointer** to the real data at the heap).


    Speaking of *Primitives*, the **Undefined** type is assigned to any *declared*
    variable that does not have a specific value. An undefined variable has no **length
    property** because it has exactly *one* value (called *undefined*) so a length
    property would have been useless and one more thing hanging on the memory vine.


    The **Null** on the other hand is usually a *placeholder* for an *object* and
    the reason why it is considered a primitive in JavaScript is due to an error made
    earlier by the ECMAScript Standard. It remains a primitive due to historical reasons.
    It also has exactly *one* value, *null*. On the previous image one could say that
    the variable ***y*** has a value of null. Variables with value of *null* are eventually
    erased from memory (more about this later).

