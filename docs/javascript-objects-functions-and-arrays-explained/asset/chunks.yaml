    **xyz.match(/n/g);** 


    // returns ["n  ", "n  ", "n  "]


    The symbols / / delimit the expression we are searching for. **g** indicates that
    this is a *global* search, meaning that we want JavaScript to return all findings,
    not just the first finding.


    More examples:


    **xyz.match(/banana/g);** // returns ["banana"]


    We could assign a variable to the array being returned . For example, in "Apples
    and bananas".


    **var fruits = xyz.match(/Apples and bananas/g);** // returns ["banana"]


    We could also convert the output to ***string*** instead of getting an array:


    var fruits = xyz.match(/Apples and bananas/g).toString();


    Call fruits:


    **fruits;** // returns "Apples and bananas":


    Regular Expressions are a subject beyond the scope of the current edition of this
    writing.


