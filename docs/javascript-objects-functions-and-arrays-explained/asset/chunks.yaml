    9 to the right, inclusively.


    **xpt2;** 


    // returns " blue, wh". 


    If you remember, the same numbers (4,9) used earlier for slice gave us “blue”.
    With slice 4/9 meant starts at 4 (0 based) and excludes 9, giving us “blue”. Now,
    by using substr, (4, 9) means starts at 4 (0 based) and it expands 9 characters
    to the right, giving us “blue, wh”.


    **Note:** In **substr**, the second digit, 9, is the number of characters to extract. 
    In **slice**, the second digit, 9, represents a *position* number, the first to
    be excluded.


    ![](images/00014.jpeg)


    Figure 14


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [String.prototype.substr (start, length)](http://www.ecma-international.org/ecma-262/5.1/#sec-B.2.3)


    Substr was not published with ecma-262. However it is now on Annex B (link above)


    ## 2.1.12 substr( ) vs substring( )


    This is where things get a bit confusing since the names **substr** and substring
    look so much alike. In reality they work differently in the sense that **substring
    has been replaced by slice**.


    At one time JavaScript developers wanted to implement negative numbers as the
    means to count from the end of the string to a certain position. The trouble was
    to be backwards compatible so they decided to come up with a different method
    name which was slice() and kept the former name intact, *substring*.


    Aside from not accepting negative numbers, substring doesn’t care about the order
    of parameters, which means that it always assumes the smaller number is first.
    So when we code (5,4) it means (4,5).The method **slice()** is more strict, the
    order matters as it will not reverse the order by itself.


    **What to do?** Use **slice()**. Be aware of **substring()** when analyzing code
    previously written.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.5.4.15 String.prototype.substring](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.15).


    ## 2.1.13 toLowerCase() and toUpperCase()


    The String method **toLowerCase()** outputs a new string with only lower case
    characters. “AFRICA” returns as “africa”.


    The String method **toUppercase()** outputs a new string with only upper case
    characters. “apple” returns as “APPLE”.


    **Sample code:**


    1- Declare and call a  string variable:


     **var txt = "ECMASCRIPT";**


    2- Convert to lower case: **txt.toLowerCase();** // returns "ecmascript".


    3- Convert to upper case again: **txt.toUpperCase();** // returns "ECMASCRIPT".


    4- Here’s one way for capitalizing just the first character using what we have
    covered so far:


    **txt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase();**


    // returns "*Ecmascript*".


    First character is converted to uppercase. Then we concatenate the string by slicing
    out the first character at position zero, and down casing the rest of the string.
    When using just one positive parameter in slice(), the number represents the first
    character position to be included on the slice which extends all the way to the
    end.


    5- Or instead of using **charAt** we could call the first character using the
    array bracket notation:


    **txt[0].toUpperCase() + txt.slice(1).toLowerCase();** // returns "Ecmascript".


    Don’t forget that we can also use CSS to capitalize the first letter of a paragraph:


    **p:first-letter {  text-transform:capitalize; }**


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.5.4.16 String.prototype.toLowerCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.17).


    · [15.5.4.18 String.prototype.toUpperCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.18).


    ## 2.1.14 trim( )


    The **trim()** method was introduced by ECMAScript 5\. It creates a copy of a
    string cutting off all leading/trailing spaces. Since the original remains the
    same, if we are cleaning up the original, we need to assign it to itself.


    **Sample code:**


    1- Declare a string with multiple leading and trailing spaces:


    ![](images/00015.jpeg)


    Figure 15 [raw file](http://icontemp.com/joagi/scripts/8.txt). [ icontemp.com/joagi/scripts/8.txt
    ]


    2- Call the variable to see how the string looks like: **str1;**  


    // it returns test with multiple spaces like the picture above, right?


    3- Declare a second variable and assign it to the trimmed version of *str1*:


    ![](images/00016.jpeg)


    Figure 16


    4- Call str2 to see how it looks: **str2;** // it returns “test” all trimmed up,
    right?


    5- Call str1 to see how it looks? **str1;** // returns the original string with
    all the white space.


    In order to clean up the original string we need to assign the variable to itself.


    6- Like in the following picture:


    ![](images/00017.jpeg)


    Figure 17


    7- Now if you call str1 again, it will be all trimmed up with no white space around
    it.


    The method *trim()* may not be recognized by older browsers like *IE8* and below.
    If this is a problem try using the jQuery version instead.


    **For more information, please refer to the following ECMASCRIPT 5 page:**'
