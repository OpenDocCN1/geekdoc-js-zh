    The `length` property of an array works just like the length of a `String` object.
    After all, a string is just a list of ordered characters like an array, right?
    However, there are reasons to use strings and reasons to use arrays. We can display
    or print a string, but to print an array we need to iterate over each item. We
    can also change elements of an array, but to change a character on a string is
    a bit more complicated. That is why sometimes we need to convert an array into
    a string, and other times we convert a string into an array. Do you remember when
    we used `split()` to convert a string into an array? The opposite is accomplished
    with `join()` which will be covered in this chapter when we come to Array methods.


    1- In the string `xyz = "bananas";` `xyz.length;` // returns 7.


    2- In our previous array, `ijk.length;` // returns 3 as we have three items on
    the array, `["red", "white", "blue"]`.


    `Length` comes handy when we need to iterate over an array, like going item by
    item to accomplish something. The reason for using length is that most of the
    times we don’t know how many items an array contains. By calling its length directly
    or indirectly to represent the number of items, we don’t really have to worry
    about the size of the array. Be aware that when you need a specific `location`
    number for an item, you may have to call its `length -1`, since an array starts
    at a zero location. It all depends on what you are trying to accomplish. An array
    with 6 items has a length of six but its item locations go from zero to five.
    There will be examples of these techniques later.


    The `prototype` property is a constructor that allows the addition of new properties
    and methods to the `Array` `object`. Remember, just like the `String` prototype,
    The `Array` prototype adds new methods and properties to the object `Array()`
    itself, not to a single array instance. Up to this point and until we cover the
    object `Object`, we have been working with `built in objects` and we will continue
    to do so because built in objects are the most important to know about in JavaScript.
    Later we will discuss creation of `user` objects as prototypes. When we add a
    new property or method to the `Array` object, this addition is not permanent,
    it only applies to this instance of the `Array` object and to all the arrays under
    this executable environment. When the program is over, every customization gets
    wiped out.


    Time for some action.


    Since we can’t natively display array items like we display a string, let’s prototype
    a method that `console logs` array items in a string format when we call it.


    1- Let’s use the same array as before. If you don’t have it on your console yet,
    declare a new one like shown below:


    ```

    var ijk = ["red", "white", "blue"];

    ```


    Let’s prototype a function that uses the property `length` to iterate over the
    array and `console log` each individual item to the screen. The function will
    be called `listArray`:


    ![](images/00018.jpeg)


    Figure 18 [raw file](http://icontemp.com/joagi/scripts/5.txt). [ icontemp.com/joagi/scripts/5.txt
    ]


    The figure above uses the dot syntax which `binds` a newly created variable name
    `listArray` to the `Array` prototype menu, which in turns binds to the `Array`
    object. `listArray` points to an anonymous function. This method uses the temporary
    variable `"i"` to loop over each item of an array represented by `"this"`, until
    it reaches the end of its `length`. For each iteration, `"this"`, which is a `placeholder`
    for the array calling the function, will print the item on position `"i"`.


    2- Copy the above prototype script into your editor (see raw file), and then paste
    it into the console. This will add `listArray()` to the current native `Array`
    object instance.


    3- Now call `listArray()` on the existing array: `ijk.listArray();` // it returns
    *red white blue*.


    Did you write listArray as `listArray( )`? It is a function or method so the parentheses
    are necessary.


    Just to prove this method actually belongs to the `Array` object itself, let’s
    create a new array and see if we can display its items:


    4- Declare a new array: `var bcd = ["apples","bananas","grapes"];`


    5- Call its `listArray()` method: `bcd.listArray();` // returns *apples bananas
    grapes*.


    So far we know that a prototype property is used to `add properties and methods`
    to an `existing` object. We also know how to design the basic script to create
    such methods. We have seen it with `String` and we have seen it with `Array`.
    No need to memorize anything, `we learn by layers`. When eating an elephant take
    one bite at a time, right?


    Next we are going to discuss the `native` `Array` methods automatically available
    when you instantiate a new array object.


    a) `Array methods` such as `concat()`, `join`, `reverse()`, `sort()`, `pop()`,
    `push()`, `shift()`, `unshift()`, `slice()`, `splice()`


    Some of these `Array` methods were covered when we discussed the `String` object
    and they will sound familiar the second time around. They say that repetition
    is the mother of learning, especially when we add a new `flavor` to it.


    ## 2.2.1 concat()


    The method `concat()` will concatenate (add) the elements of a second array, into
    the end of the first array, creating a possible third array if assigned to it,
    or we could just display it.


    If you still have the previous arrays in the console skip the following two steps
    which are to declare two different arrays (or you can start all over again):


    1- Declare an array: `var ijk = ["red", "white", "blue"];`


    2- Declare a second array: `var bcd = ["apples","bananas","grapes"];`


    3- Now let’s declare a third array and assign it a concatenation of the first
    two arrays: `var abc = ijk.concat(bcd);`


    4- Call in abc: `abc;` // returns ["red", "white", "blue", "apples", "bananas",
    "grapes"]


    `ijk` was written first and the other array inside of the parentheses was written
    second.


    5- If you call the other arrays you will see that they haven’t changed.


    Also, the elements of the concatenated arrays were `actually copied`. The third
    array is `not` a reference pointing to the other arrays. If you change or delete
    any of the first two arrays, the third array will remain unchanged.


    We now have three different arrays. If however our intention was to merge those
    arrays we could have scripted it this way: (**don’t do it so we can use the same
    arrays on the next topic**)


    `ijk.concat(bcd);`


    `ijk;` // returns ["red", "white", "blue", "apples", "bananas", "grapes"]


    We could now declare bcd as `null`: `bcd = null;`


    **For more information, please refer to the following ECMCRIPT 5 page:**


    · [15.4.4.4 Array.prototype.concat](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.4)


    ## 2.2.2 join()


    To convert an array into a string we use the `Array` method `join()`. This is
    the opposite of the `String` method `split()` which converts a string into an
    array.


    1- If you don’t have the array `abc` from the previous topic, declare it as such:
    `var abc = ["red", "white", "blue", "apples", "bananas", "grapes"];`


    2- Let’s assign a new string variable to include the elements of the array `abc`:
    `var abc2 = abc.join();`


    3- Call in abc2: `abc2;` // returns "red,white,blue,apples,bananas,grapes"


    Notice how each element of the string is separated by a **comma**. This is the
    **default setup**. We can specify what separates each element by including the
    symbol inside the parentheses:


    `abc2 = abc.join(" ");` // returns "red white blue apples bananas grapes"


    `abc2 = abc.join("/");` // returns "red/white/blue/apples/bananas/grapes". Etc.


    The array `abc` remains unchanged.


    **For more information, please refer to the following ECMCRIPT 5 page:**


    · [15.4.4.5 Array.prototype.join](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.5)


    ## 2.2.3 reverse()


    The `Array` method `reverse()` reverses the order of elements.


