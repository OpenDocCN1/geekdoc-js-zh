    The array method `forEach()` was introduced with ECMAScript 5 when nine new methods
    were added to help developers create ways of searching and manipulating array
    contents. These methods perform operations that previously would have required
    complex iterative loops. The nine additions are: `indexOf`, `lastIndexOf`, `every`,
    `some`, `forEach`, `map`, `filter`, `reduce`, `reduceRight`. All these methods
    are variations of the `forEach()` method which I’m about to discuss.


    `forEach()` performs a specified action for each element on the array. The specification
    of what to do is written by the programmer as a function in the form of an argument
    to the `forEach()` mechanism.


    Remember, the purpose of a function is to store some code that will run when the
    function is called. We create the function, and `forEach()` will process it.


    So, `forEach()` takes a function as its argument. The parameters of the function
    itself will interface with each valid element of the array in an iterative manner,
    just like a loop would do. By valid element I mean an element with data (not an
    empty element location). Empty or undefined array indexes are ignored.


    1- Let’s experiment with this method in increments. Start by introducing on the
    console a new array (I’m using the Chrome console):


    ```

    var g = ["red", "blue", "white"];

    ```


    2- Call `forEach()` on the array `g` by using a function with just one parameter,
    `y`. In this function we stored a simple `console.log` output (see the figure
    below):


    ![](images/00022.jpeg)


    Figure 22 [raw file](http://icontemp.com/joagi/scripts/20.txt).[ icontemp.com/joagi/scripts/20.txt
    ]


    The function being used here may contain up to 3 arguments. The first argument
    (as the example above), points to the array data. Do you remember when on the
    chapter **More Primitive and Reference Values** we mentioned how we could point
    to a reference type value such as an array, via a function parameter? Review that
    lesson chapter if you need refreshment.


    This `forEach` “macro” saves us a lot of coding, such as what we used to script
    this way:


    ```javascript

    for (var i = 0; i < array.length; i ++)

    ```


    In the `forEach()` example given above, parameter `y` will point to the value
    of each index on the array, and the method `forEach` will process each value according
    to the instructions written in the body. In this case the next instruction is
    to `console.log` each value at each `y` iteration and the result is: *red blue
    white* (in separate lines).


    You may ask “How does JavaScript does all these?” and the answer may be “Don’t
    ask! let it go for now. Learn how to use the tool not how the tool was conceived”.
    knowing how the tool was conceived is a curiosity that interferes with your mastering
    of the trade. Leave that question for later when you have time to spare.


    ### Two arguments instead of just one:


    3- Let’s try the same script with two arguments instead of just one:


    ![](images/00023.jpeg)


    Figure 23 [raw file](http://icontemp.com/joagi/scripts/21.txt).[ icontemp.com/joagi/scripts/21.txt
    ]


    As seen before, the first argument points to the element `data`. The second argument
    points to the `index` location of the data. In the example above we were able
    to print the index and the value for each element of the array `g`. Note that
    arguments `y`, `index` are arbitrary names. You can name them anything.


    **Notes:** `forEach` calls the callback function once per item in the array like
    a loop would do. The calling is done in ascending order.


    Sometimes a third parameter is used to specify the Array being traversed.


    The `forEach` function is intentionally generic; it does not require its third
    parameter to be an Array object. Therefore it can be transferred as a method to
    other kinds of objects. However the functionality of `forEach` with other types
    of Objects is implementation-dependent.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.4.4.18 Array.prototype.forEach](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.18).


    ## 2.3.2 map()


    The method `map()` iterates an array just like `forEach()` does, with the exception
    that it actually returns a value, and because it returns a value, it can be used
    to create a second modified array based on the first. Also, contrary to `forEach()`
    that calls the function for every item that iterates, `map` calls the function
    once for the whole process.


    Here’s an example:


    1- Declare a new array (see raw file bellow image):


    ```

    var firstArray = ["amazon", "nile", "kwanza"];

    ```


    2- Declare a second array and assign it value by mapping and returning the contents
    of `firstArray`. To be sure they are visually different, convert them to upper
    case. After scripting a map, call the second array:


    ![](images/00024.jpeg)


    Figure 24 [raw file](http://icontemp.com/joagi/scripts/22.txt).[ icontemp.com/joagi/scripts/22.txt
    ]


    Just like in `forEach()`, we used a function to store some code that takes the
    item from the array it points to, and returns it in upper case. This return is
    then assigned to another array (our `secondArray`).


    By using `map()` instead of `forEach()`, each element was copied into another
    array we arbitrarily named `secondArray` and via the `return` mechanism. If you
    try to assign a `forEach()` to another array it will not work like it does with
    `map()`. Like for each(), `map()` is just a macro and its magic is internal. All
    we do is to input parameters to be worked on (such as “item” in our case).


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.4.4.19 Array.prototype.map](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.19)


    ## 2.3.3 every()


    The method `every()` is another iterative mechanism. It is called “every” because
    whatever is going to be checked, must be true for every item in the array (all
    items), or it will return false. This is a read only method. It doesn’t change
    anything in the original array. It can be used for testing and searching, like
    using `every()` to inspect an array and make decisions based on the outcome.


    Here’s a sample script where we check if the elements are all odd or all even.
    If even, return true, else, return false:


    1- Declare a new array with a mix of odd and even numbers:


    ```

    var abc = [1,2,3,4,5];

    ```


    2- Call the array `abc` with the method `every()`, using a function that checks
    for even numbers. If all items do not match, `every()` will result in “false”:


    ![](images/00025.jpeg)


    Figure 25 [raw file](http://icontemp.com/joagi/scripts/23.txt).[ icontemp.com/joagi/scripts/23.txt
    ]


    **Remember from the previous two methods:** “item” is just a generic name representing
    each element of the array. It serves as an interface by pointing to each element
    (I put emphases on each because all these methods are different versions of `forEach()`).
    As `item* points to the elements of the array and the function does its magic,
    `every()` gathers the results and applies them to my own program, which is inside
    the body.


    If on the other hand (in this case) the array is “all even” (based on the sample
    script), `every()` will return *true*.


    Remember, the purpose of this function is to store code that can be used when
    `every()` calls the function. This internal function does not have to be named,
    it is known as an anonymous function or a callback function because it gets called
    back when needed and there is no reason for a pointer to it because it is internal
    to the `every()` script.


    3- Here’s a sample of an array that will return true:


    ```

    var xyz = [2,30,40,60];

    ```


    4- After declaring the array from the previous step, change the script on the
    above figure to apply `every()` on `xyz` instead of on `abc`. The result should
    be *true*.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.4.4.16 Array.prototype.every](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.16).

