    You could also do it this way: shelf["books"] = 21;


    12-          shelf.books;  // results in  21.


    We have just added 1 more book to the *shelf* by changing the value of books in
    the shelf variable.


    Let’s test it:


    13-           shelf; //results in Object {books: 21, CDs: 57, Magazines: 19}.


    We can also *add* (assign) new items to the object:


    14-          shelf.audioBooks = 11; *or* shelf["audioBooks"] = 11;


    Call the object:


    15-                              shelf; // results in:  Object {books: 21, CDs:
    57, Magazines: 19, audioBooks**: 11**}


    As you see, a *variable* can point to a collection of data in key-value pairs,
    making the collection an object. However, even regular strings, although primitive
    values, inherit properties and methods from Object since almost everything is
    an object.


    Look at the following examples:


    16-          var x = “tony”;  Then code the following:


    17-          typeof x;  //results in “string”.


    18-          x.length;  //result 4.  (Where did length come from?)


    19-          x.substring(0,3);  //result “ton”.


    The **0** parameter represents the **first included** character for the substring
    and the **3** parameter represents the **first** **excluded** character. We’ll
    cover more about length and substrings in a later chapter.


    **What happened in exercises 18 ... 19?** 


    Remember Figure 3? It seems that although JavaScript didn’t move “tony” to the
    heap converting it into an “official” object, the string still has properties
    and methods available to work with, due to **object wrapping**. In JavaScript
    it is then best to just think of objects and nothing but objects. Code makes more
    sense from this perspective.


    ## 1.5 More Variables, add Functions.


    ### What happens when we assign a function to a variable?


    ## 1.5.1 Lab Work 3


    1- Write this function on a simple editor (I’m using *Notepad*) and copy it to
    the JavaScript Console (you can also copy my file by clicking of the **raw file**
    link):


    ![](images/00004.jpeg)


    Figure 4 [raw file](http://icontemp.com/joagi/scripts/4.txt). [ icontemp.com/joagi/scripts/4.txt
    ]


    **Notice the semicolon**. This is a **function definition** statement, which means
    that we are defining the variable addMe100 which points to some unnamed function
    object on the heap, which in turn adds 100 to any *argument* passed in by the
    *parameter*. (We haven’t passed in any argument yet). As you know, when we declare
    a variable we add a semicolon to its end of declaration, hence the semicolon at
    the end of this function.


    Functions are like **black boxes** where groups of code scripts exist to perform
    a specific task.


    Functions are very useful to save code and/or data for later usage. They diminishing
    *redundancy* by reusing the same code each time it is needed. We delegate the
    code every time the function is called upon. Sounds familiar? Functions are objects
    and objects can also be collections of functions. A collection of functions designed
    to perform a specific assignment for an object is called a method. Sometimes a
    method has only one function, other times, a method comprises of several function
    in the same method. When we aggregate functionality that works together to accomplish
    a specific outcome (behavior), we are creating an object. Yes, objects within
    objects within objects make up a package known as a program.


    The above script is represented in the same manner as when we declare a variable.
    What I mean by this is that there is no value to the variable itself. **Its purpose
    is** to point to a function. It works just like any other variable declaration
    such as **var x;** Browsers will keep it as a reference, but the interpreter will
    only act when we call the function, such as when we write **addMe100(3);**  (3)
    being the argument to be passed into the function via the interface *parameter1*.
    The browser then keeps track of that unique execution of the function.


    2- Let’s code this: **addMe100(3);** // results in **103**


    3- Code: **typeof addMe100;** // results in “**function**”.


    4- **addMe100.length;** // results in **1**.


    The property .length in a function returns the number of *official* parameters
    available in this particular function. These parameters are the interfaces to
    insert data into the function as arguments.'
