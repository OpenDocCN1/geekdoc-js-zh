    3- The above method does the same as when we call the *character number* with
    **bracket notation**. Try it out:


    **x[2];** // returns “n”.


    Bracket notation is newer, from the ECMAscript 5 standard. It may not be recognized
    on very old browsers.


    4- Try the other String method: **x.charCodeAt(2);**  // returns  its Unicode
    which is 110\.


    Unicode code points range from 0 to 1,114,111and the first 128 Unicode code points
    are a direct match of the ASCII character encoding. For information on Unicode
    please read it here: [Mozzila](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Values,_variables,_and_literals#Unicode)
    or  [Wikipedia](http://en.wikipedia.org/wiki/Unicode).


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.5.4.4 String.prototype.charAt](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.4).


    · [15.5.4.5 String.prototype.charCodeAt](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.5)


    ## 2.1.3 fromCharCode( )


    The method **fromCharCode( )** is the inverse of charCodeAt(). This method is
    pretty simple. It returns a character based on the Unicode given, as an argument:


    **String.fromCharCode(110);**


     // returns a string character ***n***. You can assign the result of these methods
    to variables.


    We can also call in several Unicode numbers:


    **String.fromCharCode(110,111,112);** // returns ***nop***.


    For more information, please refer to the following ECMASCRIPT 5 page:


    · [15.5.3.2 String.fromCharCode](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.3.2).


    ## 2.1.4 concat( )


    The concat() method is sometimes used in place of the “**+**” operator to concatenate
    (join) different  strings to one another. Here’s an example:


    1- Our previously declared variable x: **var x = "bananas";**


    2- Declare another variable combining two strings (notice the space on the left):
    **var w = x.concat(" are good for you!** **");**


    3- Call **w**: **w;** // it returns "bananas are good for you! ".


    Concatenation does not change the value of the original variable “**x**” unless
    concatenation is called upon itself like in this case (no need to do it):


     x=x.concat(" are good for you!"); which is the same as using **+=** on itself
    instead of concat().


    4- The method ***concat*** comes handy at times like in this example where several
    variables are added to compose a new string:


    **var h = "Read this: ";


    var y = " are good for you!";


    h = h.concat(x,y);**  // returns “**Read this: bananas are good for you!**”.


    For performance reasons the preferable way to concatenate in JavaScript is using
    **+** or **+=**  However the **+** is slower than the **+=** as the engine creates
    a *new temporary string* for every two strings separated by a + and that takes
    time.


    Which method to use? It just depends on what you are trying to accomplish based
    on the existing surrounding code. To have options is a good thing.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.5.4.6 String.prototype.concat](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.6).


    ## 2.1.5 indexOf() and lastIndexOf( )


    This is a very important method .


    The String methods **indexOf**  and **lastIndexOf**, return the position of a
    specified value in a string.


    The first method searches *from* the beginning of the string, and the second method
    starts searching from the last character instead of from the first.


    If the character is unique, both methods will return the same value. If we ask
    for the index of “**n**” in “**bananas**” where multiple “n”s exist, **indexOf**
    will return position 2 because it finds the first “n” there. However, **lastIndexOf**
    will return position 4 because it finds its first “n” there (but it also displays
    its counts from left to right, not from last to first). A position number 5, for
    example, is the same position for both methods.


    Example scripts:


    1- If our old **x** is not defined, define it again as **var x = "bananas";**
    then try the following scripts:


    **x.indexOf("n");** // returns 2 as a position number. Notice how the console
    tries to complete the word for you. This is a very convenient feature.


    **x.lastIndexOf("n");** 


    // returns 4 as a position number.


    2- Let’s try another one:


    **var aba = "The quick brown fox jumps over the lazy dog.";**


    **aba.indexOf("brown");** // returns 10 which is the position where brown starts,
    counting from 0.


    **When a word or character is not found, both methods return a** **-1**.


    This can be very useful. Suppose your decision depends whether a certain word
    exists or not on the paragraph. We could use a conditional statement such as this:


    **if(aba.indexOf("brown") !== -1)**, which means, if the word *brown* exists (or
    in its current negative logic: not nonexistent), do this, *else* do that. See
    the following raw file for an example of both conditions: [raw file](http://icontemp.com/joagi/scripts/indexof.txt).
    [ icontemp.com/joagi/scripts/indexof.txt ]


    ***Note:*** If your intention for searching is to actually replace a specific
    word, use replace() discussed further down the page.'
