    \ (in our case you may have to declare it again):\n\n`myOb = new y();`\n\n13-\
    \ Next, let’s modify the `Fruits` value from “apple” to “banana”: `myOb.setFruit(\"\
    banana\");`\n\n14- Print the `Fruits` property of `myOb`: `myOb.getFruit();` //\
    \ returns \"banana\".\n\nJust to be sure we understand, when we call `myOb` to\
    \ the console, the only *items* we see from the object are the *public* methods.\
    \ Because of var, all data is hidden: `myOb;` // returns y {getFruit: function,\
    \ setFruit: function}\n\n**Finish the object:** *(your turn!)*\n\n*Try* adding\
    \ getters and setters for the two other properties: **Vegetables** and **Grains**.\
    \ Don’t forget to reset *myOb* or any other created object. In the console you\
    \ may have to re-declare *myOb*.\n\nWhen you are finished or if you need to peek,\
    \ you can check my own result [here](http://icontemp.com/joagi/scripts/75a.txt).\
    \ [ icontemp.com/joagi/scripts/75a.txt ]\n\n#### 5.1.4 Practice and review: Create\
    \ a Loan Object\n\n![](images/00078.jpeg)\n\nFigure 78\n\nIn this code *drill*\
    \ we are going to design a *fictitious* loan application in order to review some\
    \ of the key elements we have covered so far in this chapter.\n\n Object name:\
    \ `LoanApp`.\n\n· Application input properties: `personName`, `income`, `loanAmount`.\n\
    \n· Private properties: `bankBranch`, `approvalStatus`.\n\n· Public methods: `submit`.\n\
    \na) A person will fill up the loan application by declaring his/her name, income\
    \ and loan amount desired. This is a simple app: income is merely a number to\
    \ allow us a basic calculation.\n\nb) There will be a method (`submit`) that calculates\
    \ the ratio between the person’s (`income`) and loan requested (`loanAmount`),\
    \ a simple division. If the person’s income is at least twice the amount of the\
    \ loan applied for, the loan will be approved *instantly* and a message will be\
    \ sent as follows: \"*Congratulations! Your application for a loan of*\" + `lanAmount`\
    \ + \" *has been approved.*\" Also, at the same time, variable (`approvalStatus`)\
    \ will change from \"*invalid*\" to \"*Approved*\".\n\nElse, if the person’s income\
    \ is less than the automatic qualification, the person will receive a message\
    \ as follows: \"*Thanks for submitting a loan application. We will contact you\
    \ shortly.*\" Also, at the same time, variable (`approvalStatus`) will change\
    \ from \"*invalid*\" to \"*On review*\".\n\nThat is it for now. We will improve\
    \ the script after we get a working object.\n"
