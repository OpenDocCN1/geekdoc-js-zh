    \n让我们访问它的数据：\n\n3- `shirt.color;` //结果为“white”。\n4- `shirt.size;` //结果为“M”。\n\
    5- `shirt.material;` //结果为“cotton”。\n\n这个变量继承了来自 **Object 模板**的**属性**和**方法**。通过使用**点语法（Dot\
