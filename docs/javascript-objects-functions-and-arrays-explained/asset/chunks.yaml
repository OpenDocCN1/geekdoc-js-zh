- fmt: "\nSo `this` is just a shortcut referring to its parent object. For the most\
    \ part, as long as we keep this concept in mind we will not go wrong. The reason\
    \ to use `this` is portability. It allows creating generic scripts that can be\
    \ applied to different subjects depending on which subject is being called in\
    \ at any given time. Whenever a property (a variable) is referred to without a\
    \ doted prefix of the object’s name (or `this` in its place), it is understood\
    \ that such object is firstly a local object, or secondly, a global object under\
    \ which the script falls into scope.\n\nAs for `this` in our example, even if\
    \ we use an inner function, (see fig below), the `this.x` still refers to the\
    \ global (window) property `x`:\n\n![](images/00052.jpeg)\n\nFigure 52 [raw file](http://icontemp.com/joagi/scripts/43.txt).[\
    \ icontemp.com/joagi/scripts/43.txt ]\n\n**NOTE:** This concept is simple but\
    \ we should keep in mind that the variable `this` only gets assigned to the object’s\
    \ name in question at the time that the object invokes the script. This is known\
    \ as “late binding”. When we call the function, `this` will represent the object\
    \ under which we are calling the function from. In our case it works correctly\
    \ because our function y is bound to window. The explicit path to call the expression\
    \ is actually de following: `window.y(20);` // `y(20)` is just a shortcut.\n\n\
    If, in a different object oriented context under which the script is written,\
    \ we mean to call the function for an instance of another object, `this` will\
    \ represent the instance of the object in question, and not its prototype. However,\
    \ we need to make sure we are not calling the wrong object by accident. Sometimes\
    \ it is best to use methods like `Call()`, `Bind()` or `Apply()` in place of `this`,\
    \ especially when it comes to callback functions because the context may change\
    \ and the object need may not be pointing at the script when the function is called\
    \ back. These methods will be covered soon and the concept of `this` will be expanded.\
    \ Let’s keep peeling that onion!\n\n## 3.1.8 Functions as Object Constructors\n\
    \nWe can use functions to build objects of our own, sort of like prototypes from\
    \ which we can then instantiate other replicas, using the same functionality.\
    \ If functions are collections of scripts that can be called in to work together,\
    \ objects are referred to as containers of functions and variables coming together\
    \ to represent a common functionality (of data and behavior).\n\nTo build an object\
    \ constructor we create a function just like any other, but since this is the\
    \ prototype mold of future objects, we follow the JavaScript convention, which\
    \ is to capitalize the first character of the constructor’s name, to visually\
    \ distinguish this “3d printer” function from other regular functions, because\
    \ its purpose is to instantiated other objects. This allows us to recognize the\
    \ “queen bee” of all the little bees we are about to reproduce. In an illustrative\
    \ way, we create a Form pad and then we rip out each page every time we create\
    \ (fill in) a new Form.\n\n![](images/00053.jpeg)\n\nFigure 53\n\n1- The basic\
    \ structure of the function object constructor is this:\n```javascript\nfunction\
    \ JobApplication() {\n  // properties go here;\n}\n```\n\nSince I didn’t use the\
    \ variable declaration we have been using all along in this book, I don’t need\
    \ the semicolon at the end. Please note that we are creating a brand new object\
    \ constructor and not an instance of the object `Object`. Of course we could have\
    \ used a variable declaration, but this is a more common design. Also keep in\
    \ mind that it gets hoisted as a function to the top of the scope (see 1.6 Named\
    \ Functions vs. Anonymous Functions).\n\n`JobApplication` is the name of the function\
    \ we have created above. It is also the name of our object prototype.\n\nBy declaring\
    \ the above function, we are creating a template for the job Application. Now\
    \ we need to design a few text boxes inside the function in order for the form\
    \ to make sense, since right now, we only have a blank form or an empty container.\n\
    \n2- Let’s redo our Job Application with one of the properties we want to get\
    \ from the applicant (a job position) (see link to raw file below the image if\
    \ you want to copy it):\n\n![](images/00054.jpeg)\n\nFigure 54 [raw file](http://icontemp.com/joagi/scripts/45.txt).[\
    \ icontemp.com/joagi/scripts/45.txt ]\n\nHere we created a form that allows the\
    \ applicant to insert a job position into the function when he/she fills out the\
    \ form. Our first applicant arrives and we rip a form from the application pad\
    \ so that he can fill it up. By ripping out a page, I mean to create a new instance\
    \ of the application.\n\n3- We create a new instance of the application in the\
    \ following manner:\n```javascript\nvar tonyDeAraujo = new JobApplication(\"writer\"\
    );\n```\n\nA variable `tonyDeAraujo` was created and a new `JobApplication` was\
    \ assigned to the variable, and a job position of “writer” was passed in via the\
    \ function parameter.\n\n4- Test it in the console like this:\n```javascript\n\
    tonyDeAraujo; // returns JobApplication {position: \"writer\"}\n```\n\nThe keyword\
    \ `new`, binds the `JobApplication` template to the variable `tonyDeAraujo` with\
    \ a set of preconfigured properties. In this case the only property available\
    \ is “position” which reflects the position `tonyDeAraujo` has filled out in his\
    \ application. How does JavaScript know whose position this is? It knows it by\
    \ the generic variable `this` attached to position. `this` holds the place of\
    \ the object that calls the function.\n\n**Is tonyDeAraujo an object?**\n\n5-\
    \ Let’s test if tonyDeAraujo is an object:\n```javascript\ntypeof tonyDeAraujo;\
    \ // returns \"object\"\n```\n\n6- Now we start from the beginning again and create\
    \ a second version of the JobApplication form with a lot more options (practice\
    \ makes perfect, right?) See the raw file:\n\n![](images/00055.jpeg)\n\nFigure\
    \ 55 [raw file](http://icontemp.com/joagi/scripts/46.txt).[ icontemp.com/joagi/scripts/46.txt\
    \ ]\n\nNotice how `this` binds each property into each parameter, which means\
    \ that, whatever information we introduce when we fill out another instance of\
    \ the JobApplication, it will be bound to the name of the instance we create via\
    \ the function parameters. Notice also the arrows showing the sequence of assignment:\
    \ The data comin in via the age parameter is assigned to `this.age`. If for example\
    \ the new object’s name is tonyDeAraujo and its age is 39, `this.age` becomes\
    \ `tonyDeAraujo.age = 39`.\n\n7- Make sure you paste the above script on the console\
    \ and then let’s recreate the tonyDeAraujo’s application again:\n```javascript\n\
    var tonyDeAraujo = new JobApplication(\"writer\", \"Tony\", \"deAraujo\", 99);\n\
    ```\n\n8- Call the applicant:\n```javascript\ntonyDeAraujo; // returns JobApplication\
    \ {position: \"writer\", firstName: \"Tony\", lastName: \"deAraujo\", age: 99}\n\
    ```\n\n9- Let’s introduce another applicant:\n```javascript\nvar lespaul = new\
    \ JobApplication(\"guitarist\", \"Les\", \"Paul\", 99);\n```\n\n10- Call the applicant:\n\
    ```javascript\nlespaul; // returns JobApplication {position: \"guitarist\", firstName:\
    \ \"Les\", lastName: \"Paul\", age: 99}\n```\n\n11- Don’t forget to introduce\
    \ yourself as an applicant just for practicing.\n\nAnd now it is time to create\
    \ methods common to all applicants. We know from previous experiments with prototype,\
    \ that if we mix the methods together with the property names under the `new`\
    \ function constructor, we will be duplicating methods, which is not what we want\
    \ to do. We want to create a method and then use the same method for each applicant\
    \ (by reference).\n"
  raw: 'So “**this**” is just a *shortcut* referring to its *parent* object. For the
    most part, as long as we keep this concept in mind we will not go wrong. The reason
    to use “this” is ***portability***. It allows creating generic scripts that can
    be applied to different subjects depending on which subject is being called in
    at any given time. Whenever a property (a variable) is referred to without a doted
    prefix of the object’s name (or “**this**” in its place), it is understood that
    such object is firstly a local object, or secondly, a global object under which
    the script falls into scope.


    As for “this” in our example, even if we use an inner function, (see fig below),
    the **this.x** still refers to the global (window) property **x**:


    ![](images/00052.jpeg)


    Figure 52 [raw file](http://icontemp.com/joagi/scripts/43.txt).[ icontemp.com/joagi/scripts/43.txt
    ]


    **NOTE:** This concept is simple but we should keep in mind that the variable
    “this” only gets assigned to the object’s name in question at the time that the
    object **invokes the script**. This is known as “***late binding***”. When we
    call the function, **this** will represent the object under which we are calling
    the function from. In our case it works correctly because **our function y is
    bound to window**. The explicit path to call the expression is actually de following:
    **window.y(20);** // **y(20) is just a shortcut**.


    **If**, in a different object oriented context under which the script is written,
    we mean to call the function for an instance of another object, “**this**’ will
    represent the instance of the object in question, and not its prototype. However,
    we need to make sure we are not calling the wrong object by accident. Sometimes
    it is best to use methods like Call(), Bind () or  Apply () in place of ”**this**”,
    especially when it comes to **callback** functions because the context may change
    and the object need may not be pointing at the script when the function is called
    back. These methods will be covered soon and the concept of “**this**” will be
    expanded. Let’s keep peeling that onion!


    ## 3.1.8 Functions as Object Constructors


    We can use functions to build *objects of our own*, sort of like prototypes from
    which we can then instantiate other replicas, using the same functionality. If
    functions are collections of scripts that can be called in to work together, objects
    are referred to as containers of functions and variables coming together to represent
    a common functionality (of data and behavior).


    To build an **object constructor** we create a function just like any other, but
    since this is the prototype mold of future objects, we follow the JavaScript convention,
    which is to **capitalize** the first character of the constructor’s name, to visually
    distinguish this “*3d printer*” function from other regular functions, because
    its purpose is to instantiated other objects. This allows us to recognize the
    “*queen bee*” of all the little bees we are about to reproduce. In an illustrative
    way, we create a **Form pad** and then we *rip out* each page every time we create
    (fill in) a **new** Form.


    ![](images/00053.jpeg)


    Figure 53


    1- The basic structure of the function object constructor is this: **function
    JobApplication() {


      // properties go here;


    }**


    Since I didn’t use the variable declaration we have been using all along in this
    book, I don’t need the *semicolon* at the end. Please note that we are creating
    a brand new object constructor and not an instance of the object Object. Of course
    we could have used a variable declaration, but this is a more common design. Also
    keep in mind that it gets hoisted as a function to the top of the scope (*see*
    **1.6 Named Functions vs. *Anonymous*** Functions).


    **JobApplication** is the name of the **function** we have created above. It is
    also the name of our **object prototype**.


    By declaring the above function, we are creating a **template** for the job Application.
    Now we need to design a few text boxes inside the function in order for the form
    to make sense, since right now, we only have a *blank* form or an empty container.


    2- Let’s ***redo*** our Job Application with one of the properties we want to
    get from the applicant (a job position) (see link to *raw file* below the image
    if you want to copy it):


    ![](images/00054.jpeg)


    Figure 54 [raw file](http://icontemp.com/joagi/scripts/45.txt).[ icontemp.com/joagi/scripts/45.txt
    ]


    Here we created a form that allows the applicant to insert a job position into
    the function when he/she fills out the form. Our first applicant arrives and we
    rip a form from the application pad so that he can fill it up. By ripping out
    a page, I mean to **create a new instance** of the application.


    3- We create a new instance of the application in the following manner: **var**
    **tonyDeAraujo** **=** **new** **JobApplication("writer");**


    A variable **tonyDeAraujo** was created and a *new* **JobApplication** was assigned
    to the variable, and a job position of  “writer” was passed in via the function
    parameter.


    4- Test it in the console like this: **tonyDeAraujo;** // returns *JobApplication
    {position: "writer"}*.


    The keyword **new**, **binds** the JobApplication **template** to the **variable**
    *tonyDeAraujo* with a set of *preconfigured* properties. In this case the only
    property available is “**position**” which reflects the position *tonyDeAraujo*
    has filled out in his application. How does JavaScript know whose position this
    is? It knows it by the generic variable **this** attached to position. “this”
    holds the place of the object that calls the function.


    **Is tonyDeAraujo an object?**


    5- Let’s test if tonyDeAraujo is an object: **typeof tonyDeAraujo;** // returns 
    "object".


    6- Now we **start from the beginning again** and create a second version of the
    JobApplication form with a lot more options (practice makes perfect, right?) See
    the raw file:


    ![](images/00055.jpeg)


    Figure 55 [raw file](http://icontemp.com/joagi/scripts/46.txt).[ icontemp.com/joagi/scripts/46.txt
    ]


    Notice how “**this**” binds each property into each parameter, which means that,
    whatever information we introduce when we fill out another instance of the JobApplication,
    it will be bound to the name of the instance we create via the function parameters.
    Notice also the arrows showing the sequence of assignment: The data comin in via
    the age parameter is assigned to this.age. If for example the new object’s name
    is tonyDeAraujo and its age is 39, this.age becomes tonyDeAraujo.age = 39.


    7- Make sure you paste the above script on the console and then let’s *recreate*
    the tonyDeAraujo’s application again: **var tonyDeAraujo =** **new** **JobApplication("writer",
    "Tony", "deAraujo", 99);**


    8- Call the applicant: **tonyDeAraujo;** // returns


    *JobApplication {position: "writer", firstName: "Tony", lastName: "deAraujo",
    age: 99}*.


    9- Let’s introduce another applicant: **var lespaul =** **new** **JobApplication("guitarist",
    "Les", "Paul", 99);**


    10- Call the applicant: **lespaul;** // returns


    *JobApplication {position: "guitarist", firstName: "Les", lastName: "Paul", age:
    99}*.


    11- Don’t forget to introduce yourself as an applicant just for practicing.


    And now it is time to create **methods** common to all applicants. We know from
    previous experiments with prototype, that if we mix the methods together with
    the property names under the **new** function constructor, we will be **duplicating**
    methods, which is not what we want to do. We want to create a method and then
    use the same method for each applicant (by reference).'
