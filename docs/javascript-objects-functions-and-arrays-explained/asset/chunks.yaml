    Math.random() + 5;\n```\n// try it a few times. We get numbers such as 5.2907,\
    \ etc.\n\nLet’s suppose we want random numbers between **1 and 10**. We multiply\
    \ the method result by 10 and add 1 in order to start from 1:\n\n```javascript\n\
    Math.random() * 10 + 1;\n```\n // example return: 7.784083819948137\n\nThis brings\
