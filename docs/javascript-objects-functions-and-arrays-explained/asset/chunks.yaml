    function is still processing, JavaScript keeps a pointer to the surrounding applicable
    variables such as **boy = “has kite”**. And that’s because of the **inventory
    list** JavaScript first made.


    JavaScript functions aren''t really just pieces of code you can execute; they
    are **closures**, like [dreamcatchers](http://en.wikipedia.org/wiki/Dreamcatcher),
    they are symbols of unit.  A closure records not only what code a function must
    run, but also what environment it was created in. An inner function has access
    to the outer function and the outer of outer function, all the way up to the Global
    object.


    ![](images/00042.jpeg)


    Figure 42


    Sometimes we read on the web how closures have “*free* variables”. By free variables
    it is meant all those variables a function can use but are not in the function.
    In this illustration, func2 has the following free variables: A, B, and C. ( D,
    it is not free, it belongs to func2).


    Below we have another way of seeing it based on the balloon concept. This demonstrates
    which balloons are being held by whom at the time **function1** is instantiated
    (called):


    ![](images/00043.jpeg)


    Figure 43


    Taking the concept of the above illustration as an example, we could use func2
    to make the outer function variables *more* private if we wanted to. We would
    do this by outputting the outer function variables through the inner function,
    creating a shield between the outside world and *function 1*. Consider the following
    example:


    ![](images/00044.jpeg)


    Figure 44 [raw script](http://icontemp.com/joagi/scripts/61.txt).[ icontemp.com/joagi/scripts/61.txt
    ]


    In the above example, we further isolated the outer function data (clientBalance)
    from the public scope. We did this by creating an **inner** function which acts
    as an **interface** between the outer function and the outside world. The outer
    function’s data remains private as there is no output directly from it. The process
    works due to the closure principle, which keeps tabs on the **lexical environment**
    (covered next), even when the outer function returns before the inner function
    does, which is the case. The outer function outputs the inner function which in
    turn returns its result. Its result (inner) is based on the data in the outer
    function.  The data in the outer function does not get wiped out *during the microseconds
    when the outer function returns and closes*, because the inner function is still
    pointing at its (outer) data. It only gets wipeout (outer) after the inner function
    returns and places itself and its entire lexical environment, at the mercy of
    the garbage collection mechanism.


    So what is the purpose of all these?


    The purpose is to prevent any script from the outside to view or edit the private
    variable *clientBalance*. This variable is only being accessed by the inner function,
    which is being called from the outside via the outer function. Sort of like a
    bank clerk accessing the vault to remove money for someone cashing a check. 


    ## 3.1.5 Lexical Scope


    Lexical means “words that refer to things” or a “menu of things”. In languages
    *without* closures, the lifetime of a local variable ends with the execution of
    the scope where that variable is declared. However, in languages with closures,
    such as JavaScript, variables *continue to exist* well after the code is done,
    **as long as** there are **closures** surrounding them.


    Since scope in JavaScript is determined by functions, functions are also the ones
    that create closure environments, which connect variables and arguments to running
    processes. As you remember, a closure happens when a mechanism in an inner scope
    points to data in an outer scope, and JavaScript needs to keep a log of *potentially
    necessary* data, preventing any active scope from being wiped out. This persistence
    method is normally done by the garbage collection mechanism. *Garbage collection*
    is managed by the browser, and it varies depending on which browser and its version
    JavaScript is being run on.


    The image below illustrates a set of nested functions and their scope environment,
    also known as **lexical (or static) scoping** “Every inner level can access its
    outer levels”:


    ![](images/00045.jpeg)


    Figure 45


    In the figure above, if you attempt to directly return (the most inner function)
    function 3, from function 1, it will give you a “**ReferenceError: Function3 is
    not defined**”. To access function **3** from function **1**, one must first have
    a return from 3 to 2, and then from 2 to 1, in order for function 3 to be available
    to function 1. This is because an inner function is only available to the immediate
    function above it. However, as seen, Function 3 has access to its *entire environment*
    which spans all the way up to Window or the Global Scope. **It’s a one way street,
    functions point (see) from inside out**.'
