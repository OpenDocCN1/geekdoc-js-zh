    \ between *reduce* and *reduceRight*. Keep these differences in mind when looking\
    \ for code solutions.\n\n**For more information, please refer to the following\
    \ ECMASCRIPT 5 page:**\n\n· [15.4.4.22 Array.prototype.reduceRight](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.22)\n\
    \n## 2.4.4 Location Methods\n\nBeyond the *iteration* and *reduction* methods,\
    \ JavaScript has two new methods that can be used to locate items in the array:\
    \  **indexOf( )** and **lastIndexOf( )**.\n\nIndexOf starts from the left to the\
    \ right, and lastIndexOf starts from the right towards the left.\n\nThey both\
    \ work the same way and give the same location reference position."
