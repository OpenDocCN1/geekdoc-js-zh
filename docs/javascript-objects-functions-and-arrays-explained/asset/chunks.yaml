  trans: '

    但等一下！如果没有指向对象的变量，那么如果该对象是从零创建的或从另一个对象实例化的，它就不存在了。那么像 `native` 对象、`built in` 对象或`the
    Global object`（全局对象）本身这样的持久对象又是呢？


    这些对象始终存在。它们处于待命状态，随时准备被另一个变量调用。**持久化库永远不会消失**。


    **这是一个重要的概念：** JavaScript **不仅仅是** **ECMAScript**。JavaScript 是 ECMAScript 与其运行环境的结合体，例如浏览器（我指的是
    `DOM` 和 `BOM`）。ECMAScript 由 JavaScript 引擎实现。目前有多个引擎正在被使用。关于引擎的简短讨论可以参考 [维基](http://en.wikipedia.org/wiki/JavaScript_engine)。


    ## 1.8.2 原生对象 (Native objects)


    原生对象最初由 ECMAScript 标准实现，无论 JavaScript 在何处使用，它们始终存在。它们有助于指定和定义其他对象。原生对象也被称为 `Standard
    Global Objects`（标准全局对象）。


    一些标准内置对象包括：


    `Array`、`Boolean`、`Date`、`Function`、`Math`、`Number`、`Object`、`RegEx`、`String`。


    标准全局对象的列表可以在 [Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects)
    查看。


    不要将 `Global Objects`（全局对象）术语与 `The Global` Object（所有对象的母体，即 `Object` 对象）混淆。这个特定的对象我们在之前的
    1.3 变量与引用类型中提到过的原型。实际上，我们甚至**无法**直接引用它，因为它的名称随着使用 ECMAScript 的每个环境而变化。例如，在浏览器中，它假设名为
    `Window`。`Window` 是第一个对象（脚本的根），任何全局声明（例如：`var x;`）的作用域都在 `Window level`（Window
    层）或 `Global Object level 层（全局对象层）。我们将在下一次实验中尝试这个概念。


    某些原生对象（如 `String` 和 `Math`）允许在不实例化新对象的情况下访问其属性和方法。其他原生对象（如 `Date`）则要求你创建一个新实例以便使用它们的属性和方法。


    ## 1.8.3 托管对象 (Hosted Objects)


    其他对象由**宿主环境**提供，该环境与 ECMAScript 接口以完成整个 JavaScript 功能。在浏览器中，其他对象来自 [DOM](http://en.wikipedia.org/wiki/Document_Object_Model)（文档环境）和
    BOM（浏览器环境）。

