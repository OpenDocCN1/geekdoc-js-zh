    Let’s suppose we want random numbers between **1 and 10**. We multiply the method\
    \ result by 10 and add 1 in order to start from 1:\n\n**Math.random( ) * 10 +\
    \ 1;** // example return: 7.784083819948137\n\nThis brings me to a *related topic*.\
    \ On one of my tests I got and answer of 10.575064114760607\\. That’s because\
    \ the 10 multiplier + 1 makes random outputs from1 to 10.999… We could remove\
    \ the decimals to get a cleaner output by using another method:\n\n**Math.floor(\
