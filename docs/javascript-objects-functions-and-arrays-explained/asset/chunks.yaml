    – (`This current eBook**)

    This is a more advanced JavaScript book. Here, variables, functions, arrays and
    objects are explained in further detail. Memory management concepts are introduced,
    the concept of execution context, scope and closures are explained. The book also
    explains the most useful methods from the JavaScript library. It is a great book
    to keep around.


