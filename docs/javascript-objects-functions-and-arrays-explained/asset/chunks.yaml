    We expose a *var scoped property* by creating an **inner function** that returns
    the data. We have done it before, remember? Do you remember *closures*, and the
    balloon with two strings? Inner functions have access to the outer function data
    and can use it or display it to the outside world acting as agents like [tellers](http://en.wikipedia.org/wiki/Bank_teller)
    in a bank.


    ## 5.1.2 Accessor methods


    Study the **inner function** on line 6 below, and read the comments afterwards:


    ![](images/00075.jpeg)


    Figure 75 (for raw file see next)


    The above script makes sense. We create a method arbitrarily called **getFruit**,
    which returns our property **Fruits**. However there are a couple of problems
    with it:


    a) Because **y** is a constructor, we cannot call its methods in its current form
    because an object constructor is just the **blueprint** of the object. It reminds
    me of the **Date Object**. We need to *instantiate* an object in order to use
    its methods. Also, although it is not mandatory, by convention I should have capitalized
    **y** but I don’t want this to take us away from our real topics: ***a***) and
    ***b***).


    b) Once we *instantiate* a ***new*** *object* we need to make sure that the method
    *getFruit* is applied to it (**this** new object), and not to any other object.
    So we need to add a ***this*** prefix as a *placeholder* to the method inside
    the constructor. Like **this.getfruit =** .


    8- Add a ***this*** to **getFruit**:


    ![](images/00076.jpeg)


    Figure 76 [raw file](http://icontemp.com/joagi/scripts/74.txt).[ icontemp.com/joagi/scripts/74.txt
    ]


    In the script above we have addressed problem (***b***). To address problem (***a***)
    we need to instantiate a *new object*.


    9- Let’s instantiate an object from ***y*** called ***myOb*** (or whatever name
    you wish): **var myOb = new y();**


    10- Now we can finally call *getFruit* from *myOb*: **myOb.getFruit();** // returns
    "apple".


    **Summary:**


    When we create an object, its properties are public, which makes it easier to
    *read* and *write* properties. However, we can protect our object properties by
    initiating them with the prefix **var**. Once we protect the object’s properties,
    the only way to *fetch* data from them is through an **inner function** also known
    as an **Accessor method** (because it is allowed to access the property). It is
    conventional, although not mandatory, to name these Accessor methods **get**Something
    (“something” being the name of the property) because they are popularly called
    “**getters**” methods. *Just a good habit to form*!


    ## 5.1.3 Mutation methods


    What if we want to mutate (modify) one of the properties inside of our *protected*
    object?


    Before we made the decision to protect our object properties, we also were able
    to **assign** a **new value** to any of the object properties (the variables),
    like


    object**.property = "otherValue";**


    Now that our properties are tagged with ***var*** as well as being inside of a
    **function** (*an object property is always inside of a function*), we can’t modify
    them directly from the outside because they are invisible to an external bracket
    syntax approach. The only way to edit a private property is via an internal method
    that does it for us. A kind of [surrogacy](http://en.wikipedia.org/wiki/Surrogacy)
    arrangement:


    11- **Create a second method** that *sets* the property **Fruits** to a different
    fruit, if you ever want to modify it:


    ![](images/00077.jpeg)


    Figure 77 [raw file](http://icontemp.com/joagi/scripts/75.txt).[ icontemp.com/joagi/scripts/75.txt
    ]


    The **setFruit** method takes an argument as input via the parameter **myFruit**
    (arbitrary name), and assigns the property **Fruits** to a *new value*.


    12- Now that we have modified the object, make sure you **reset** the **previously
    instantiated** object **myOb** since it is still pointing at the old **y** object
    (in our case you may have to declare it again):


    **myOb = new y();**


    13- Next, let’s modify the **Fruits** value from “**apple**” to “**banana**”:
    **myOb.setFruit("banana");**


    14- Print the **Fruits** property of **myOb**: **myOb.getFruit();** // returns
    "banana".


    Just to be sure we understand, when we call ***myOb*** to the console, the only
    *items* we see from the object are the *public* methods. Because of var, all data
    is hidden: **myOb;** // returns y {getFruit: function, setFruit: function}


    **Finish the object:** *(your turn!)*


    *Try* adding getters and setters for the two other properties: **Vegetables**
    and **Grains**. Don’t forget to reset ***myOb*** or any other previously created
    object so that you can test your code. In the console you may have to re-declare
    *myOb* again.


    When you are finished or if you need to peek, you can check my own result [here](http://icontemp.com/joagi/scripts/75a.txt).
    [ icontemp.com/joagi/scripts/75a.txt ]


    ## 5.1.4 Practice and review: Create a Loan Application Object


    ![](images/00078.jpeg)


    Figure 78


    In this code *drill* we are going to design a *fictitious* loan application in
    order to review some of the key elements we have covered so far in this chapter.


    · Object name: ***LoanApp***.


    · Application input properties: ***personName***, ***income***, ***loanAmount***.


    · Private properties: ***bankBranch***, ***approvalStatus***.


    · Public methods: ***submit***.


    a) A person will fill up the loan application by declaring his/her name, income
    and loan amount desired. This is a simple app: income is merely a number to allow
    us a basic calculation. No details needed.


    b) There will be a method (**submit**) that calculates the ratio between the person’s
    (**income**) and loan requested (**loanAmount**), a simple division. If the person’s
    income is at least twice the amount of the loan applied for, the loan will be
    approved *instantly* and a message will be sent as follows: "*Congratulations!
    Your application for a loan of*  " + **lanAmount** + " *has been approved.*" Also,
    at the same time, variable (**approvalStatus**) will change from "*invalid*" to
    "*Approved*".


    **Else**, if the person’s income is less than the automatic qualification, the
    person will receive a message as follows: "*Thanks for submitting a loan application.
    We will contact you shortly.*" Also, at the same time, variable (**approvalStatus**)
    will change from "*invalid*" to "*On review*".


    That is it for now. We will improve the script after we get a working object.'
