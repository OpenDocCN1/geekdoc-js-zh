    ## 4- Now we can call the method `thankYouCard` for each one of our customers
    in a more formal way. As we write the script bellow, notice the difference between
    the current `call()` function, and the previous `call()` function. The first parameter
    points to the object the method will be applied to, it represents the `this`,
    and the second parameter applies the `gender` argument parameter which acts as
    a placeholder :


    ```

    thankYouCard.call(mary, "Dear Miss"); // returns

    ```


    “Dear Miss Mary! Thank you so much for your last purchase.”


    ```javascript

    thankYouCard.call(john, "Dear Mr."); // returns

    ```


    “Dear Mr. John! Thank you so much for your last purchase.”


    ## 5- We cannot test the method `apply( ) in the same way, because it will give
    us an error if the second argument is not an array. **However**, we could *fake
    an array* and it would output just fine:


    ```javascript

    thankYouCard.apply(john,["Dear Mr."]); // returns

    ```

    ”Dear Mr. John! Thank you so much for your last purchase.”


    **About the second argument:** The first argument addresses the object being targeted
    for processing. The second and consecutive arguments target properties of the
    object. By attaching the desired method to `call( )` or to `apply( )` with *dot
    syntax*, we are binding the method to the target object, allowing “this” to be
    addressed accordingly.


    ### What if we want to simplify the `thankYouCard` method calling in order to
    be used by a non-technical person?


    As an example we could simplify the calling, by creating a “thanks” *function*
    that calls the `thankYoucard` as applied to the targeted customer:


    ![](images/00065.jpeg)


    Figure 65 [raw file](http://icontemp.com/joagi/scripts/66.txt).[ icontemp.com/joagi/scripts/66.txt
    ]


    Now we can just instruct our helper to call the “thanks” function every time he
    or she needs to thank a customer by using the following syntax:


    ```javascript

    thanks(mary,"Dear Miss");

    thanks(john,"Dear Mr.");

    ```


    This is just a shortcut to `thankYouCard.call(mary, "Dear Miss ");` and it avoids
    spelling errors.


    **Note:** Although john and mary look like regular names, they are object names
    and the script inside the method caters to the property name that belongs to the
    object’s this.name. Because of this, a regular “string” name will not work in
    its place. If you call “tony” on the thankYouCard method, it will output the name
    as *undefined*. However, we could call any name (string) if the internal method
    script is less specific, as we shall see next.


    ## 3.2.3 More practice with call( ), apply( ) methods.


    Let’s look at a few more examples to *cement* our understanding of these important
    function methods.


    1- The following function prints a license number based on the parameter entered,
    and that’s all it does. As you will see next, when we call it, we are able to
    *call* this function on anyone, an object or a string, by using the `call( )`
    method:


    ![](images/00066.jpeg)


    Figure 66 [raw file](http://icontemp.com/joagi/scripts/63.txt).[ icontemp.com/joagi/scripts/63.txt
    ]


    2- Call the function on a person (string value) named Tony with license 34568:
    `showLicense.call("Tony","34568");` // returns “Tony has license number 34568”.


    As seen above, “this” is applied to the first argument of the `call( )` method,
    and “license” is applied to the second argument of the `call( )` method.


    3- Let’s try another similar script with a third argument:


    ![](images/00067.jpeg)


    Figure 67 [raw file](http://icontemp.com/joagi/scripts/64.txt).[ icontemp.com/joagi/scripts/64.txt
    ]


    4- Call the function again but this time add an expiration date: `showLicense2.call("Tony","34568","January
    5, 2016");` // returns “Tony has license number 34568 expiring on January 5, 2016”.


    The *call* method will apply the first parameter to the placeholder *this* (the
    object named), wherever it may be on the output script, and subsequent parameters
    where a placeholder matches the parameter’s name.


    Arguments for all the parameters can comprise of objects, strings or even **functions**.
    See this [external script](http://icontemp.com/joagi/scripts/63z.txt) [icontemp.com/joagi/scripts/63z.txt]
    for a sample where a function return result is being applied as the ‘this’ on
    a *call* method.


    Before we move on, let’s visualize **call functions** from a different window
    in the hopes of bringing a better understanding to the subject matter.


    Consider the following test script:


    ![](images/00068.jpeg)


    Figure 68


    - Lines 1 through 3 represent function `x` with one parameter, num.

    - Line 5 calls the function on an argument 3 and the output result is `num + 1
    = 4`.

    - On line 7 we attempted to *bind* `x` to *call* and pass `num` as 3, but JavaScript
    assumed 3 as the first parameter, the (“this”), and a value of “nothing” as the
    second parameter. The second was supposed to be a number. So we’ve got a NaN error.

    - On line 9 we applied `window` (the object under which the function `x` exists)
    as the first parameter, and then 3 is finally processed as the second parameter
    of `call( )` which becomes `num`.


    This shows that `x(3)` is actually a **shortcut** for `x.call(window, 3)`. Better
    yet, remembering some of our first lectures, and to be more specific, `x(3)` is
    the same as:


    ```javascript

    window.x.call(window, 3);

    ```


    In the past few exercises we’ve experimented with functions to test the method
    `call( )` where the object was actually a string (“Tony”), and also where the
    object was *window* (the default value). **In summary**, our tests show that functions
    don’t have a persistent awareness of “this”, because “this” is determined **at
    call time** based on it.

