    ## 2.4.5 indexOf( ) versus lastIndexOf( )


    If all we need is the index of one specific and unique item, ***indexOf*** and
    ***lastIndexOf*** will give us the same performance. However in long arrays, one
    may be faster than the other depending where the item is located, if at the first
