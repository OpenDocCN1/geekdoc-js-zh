    \ or you can just do a web search to find the correct syntax for the method you\
    \ need to use. However, if you don’t go through this section and do your own tests,\
    \ you will not know what to look for in the future. Awareness if three quarters\
    \ of the path to know about something.\n\nThen on **Part 3** we will cover functions\
    \ in more detail as well as other objects such as ordered and unordered lists\
    \ (arrays and hashes).\n\nOnce you master these two sections you will be well\
    \ on your way to become a great JavaScript programmer.\n\n# 2.1 Strings as Objects\
    \ in JavaScript\n\nUp to this point we have been covering strings as primitive\
    \ values in JavaScript. Strings are **immutable** (fixed values) and they reside\
    \ in the Stack. If we edit a string, the variable gets replaced by another string\
    \ variable of a shorter or longer length and with the same name. The previous\
    \ string gets automatically discarded since no editing is possible.\n\nHowever\
    \ there is such thing as a **String object**. The prototype is there, in all its\
    \ glory, with bells and whistles to be called upon when needed. Actually JavaScript\
    \ calls the String object at will and wraps strings into objects when it needs\
    \ to do so.  You want to find out the length of a string variable? JavaScript\
    \ replies: “No problem sir, madam, I’ve got you covered!”.\n\nAll methods and\
    \ properties of the String object are automatically available to primitive values.\
    \ There is no need to instantiate an object.\n\nFirst let’s define two terms in\
    \ our vocabulary.\n\nThe term “**literal**” refers to a character, word, or phrase\
    \ within quotes like for example “*apples and bananas*”. A string literal is composed\
    \ of *zero* or more characters enclosed in single or double quotes. Although there\
    \ is no difference between single or double quotes in JavaScript, double quotes\
    \ are mandatory in JSon (JavaScript Object Notation) and many developers are picking\
    \ up double quotes as a standard format.\n\nAlso, just to be sure you understand\
    \ the term **method**, method is what programmers call a piece of functionality\
    \ that acts on behalf of an object. A method is normally a function, or a collection\
    \ of functions to accomplish one specific task.\n\nIn JavaScript the string literal\
    \ is normally a primitive type. When a *method* is called on a string literal,\
    \ the string is temporarily and automatically *wrapped* into an object in order\
    \ to process the call.\n\nHere’s an example of a string primitive to be used in\
    \ our subsequent demonstration of properties and methods. Please do the exercises\
    \ in green as we did during our  previous lab work:\n\n**(fire up your favorite\
    \ JavaScript Console,** I’m using Chrome**)**.\n\n**var x = \"bananas\";**\n\n\
    When a string primitive is wrapped around a String object, it automatically inherits\
    \ several (a) properties, and several (b) methods.\n\nLet’s take a look at some\
    \ of these properties and methods:\n\na) **String properties** such as length,\
    \ prototype, constructor:\n\n1- **length** \n\nReturns a number based on the length\
    \ of the string:\n\n**x.length;** // returns *7*\n\n2- **prototype**\n\nThe prototype\
    \ property is used to ***add* properties and methods** to an *existing* object.\
    \ Let’s add a property to the String object to see if “x” inherits from the object\
    \ (I’m assuming you still have **x** in your console from the previous exercise)\
    \ S for string is capitalized:\n\n**String.prototype.feelings = \"love bananas\"\
    ;** (notice the capitalized **S** for string).\n\nSince a picture is worth a million\
    \ words I would remember it like this: “Mr. String, please *prototype* (verb meaning\
    \ create as prototype) the property “*feelings*” with a value of  “*love bananas*”.\
    \ (In this case I would also *see*  a property in my mind as a key-value pair\
    \ as in *x.feelings*).\n\nThink of the *prototype command* as adding something\
    \ new to a *menu* of tools. We can think of the name of this menu as *prototype*,\
    \ the verb allowing the addition of new properties and methods  is also the verb \
    \ *prototype*.\n\n**Now test it:**  **x.feelings;** // it should return \"love\
    \ bananas\".\n\nRemember, you can also write it as x[\"feelings\"];\n\nbecause\
    \ *feelings* is the location where the property *value* resides.\n\nThe property\
    \ *feelings* became part of the string **x** and it can be called using **Dot**\
    \ *or* **Bracket notation**. **x** is still a string *primitive* and you can confirm\
    \ it by calling **typeof** on it, which returns a lower cased string type, and\
    \ not an *object*.\n\nWhen we look at the syntax, we see a property named “**feelings**’\
    \ which was prototyped (created) on the ***String object prototype*** (menu).\
    \ It is now part of a list of properties available to all string primitives during\
    \ *this* particular *execution context*.\n\nDid I just say that **feelings** is\
    \ “available to all” other string variables?\n\nThe property *feelings* is universal.\
    \ This means that *x* is inheriting it from the String object, but any other string\
    \ variable inherits the same property because feelings was added to the global\
    \ String object, as you can see by looking at the prototype declaration done earlier.\n\
    \n**If we declare another string variable, will this property be also available\
    \ to it?**\n\nLet’s try it:\n\nDeclare the following variable: **var y = \"oranges\"\
    ;**\n\nPrint out its feelings property: **y.feelings;** // returns “love bananas”\n\
    \nSo the answer is **yes**, any other string variable will inherit the newly created\
    \ property because this property belongs to the mother object, which is the String\
    \ object. If you go back and look at the prototype declaration you will not see\
    \ any reference to ***x***, the property was added to the String object prototype.\n\
    \n**What about any other variable from a different type?**\n\nTry this: **var\
    \ z = 123;**\n\nThen this: **z.feelings;** // it returns ***undefined***.\n\n\
    Of course we already knew that. This property belongs to the **String** object\
    \ and not to the **Number** object. This new property however is *temporary* and\
    \ it only applies to **this instance**. When it comes to the Native Objects (built\
    \ in objects), we can add functionality (properties and methods) to our instance\
    \ of the program but **we cannot permanently modify the native String object**\
    \ to use on other programs.\n\n**What about adding a new method to String, via\
    \ prototype?**\n\nTry this one:\n\n![](images/00013.jpeg)\n\nFigure 13 [raw file](http://icontemp.com/joagi/scripts/18.txt).\
    \ [ icontemp.com/joagi/scripts/18.txt ]\n\nNow let’s call on it by writing **x.repeat(\
    \ );** // It returns \"**bananasbananas**\", ***this*** is a *placeholder* for\
    \ the object calling it.\n\nAlso try **y.repeat();** // returns \"**orangesoranges**\"\
    .\n\nSo, adding methods to the String object prototype *menu* and applying them\
    \ to string primitives is also possible.\n\nWe can retrieve the list of our own\
    \ properties and methods by using a *quick-and-dirty* technique on the variable\
    \ in question:\n\n**x.__proto__;** (2 underscores each)\n\nreturns \" String {*feelings*:\
    \ \"love bananas\", *repeat*: function} \".\n\nThat’s proto and 2 underscores\
    \ on the left after the dot and 2 underscores on the right.\n\n__proto__ is not\
    \ a JavaScript standard, hence the term *quick-and-dirty*.\n\nIn the new ECMAScript\
    \ 5, __proto__  will be replaced by the following method, but not all browsers\
    \ support it at the time of this writing and you may get this error *TypeError:\
    \ Object.getPrototypeOf called on non-object*:\n\n**Object.getPrototypeOf(x);**"
