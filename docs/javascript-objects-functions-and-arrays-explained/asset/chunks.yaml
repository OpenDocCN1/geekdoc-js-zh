    **这是一个核心概念：** 每当我们调用一个函数来评估一个参数时，我们都在创建一个具有全新的完整可用变量列表和其他资源的新函数。当函数返回时，这些列表会被擦除。


    **变量搜索：** 对于每一个不同的作用域，都会创建一个名为 `activation object`（激活对象）的列表。激活对象是所有可用变量的列表。激活对象保存在`heap`（堆）中，使其持续时间比在临时栈中更长。这就是`interpreter`（解释器）在查找变量时遍历的`chain`（链）。它从局部作用域，即脚本执行的最内层作用域开始；如果不在，就向上一步；如果那里也没有，就继续向上，直到到达该脚本作用域环境的末端。找到的第一个具有
    `given name` 的变量就是要使用的那个。即使在链的其他地方有同名的变量，一旦解释器找到了第一个目标，它永远不会再去那里。


    实际上每个函数都可以被视为一个 `closure`（闭包），因为函数可以访问全局变量，还可以访问外部函数的变量（如果有的话，父函数，而不是兄弟函数）。如果闭包不是函数及其整个作用域内所有可用变量的结合，它还能是什么呢？在不再需要时务必
    `return` 你的闭包函数，以便垃圾回收工作工作并在长期来看节省内存。避免[内存泄漏](http://en.wikipedia.org/wiki/Memory_leak)。


    **提醒：** 我之前提到过，当变量赋值给函数参数时，数据会被复制，它与该变量保持独立。这与闭包无关，因为闭包“链接”并不是通过函数参数发生的。闭包函数（任何函数）实际上保留了外部变量（所有变量）的引用，因为它们被自动绑定到这些变量，这意味着如果函数内部有指向外部作用域变量的赋值，闭包函数实际上可以在其数据处理过程中
    `update`（更新）外部变量。因此，通过参数从栈传递到堆的数据与通过直接调用外部变量呈现给函数的数据之间是有区别的。前者是数据的拷贝；后者仅是一个指针。而指针具有修改其所指向位置数据的能力。


    1- 这是一个我意思的示例。请尝试下面图片中的练习，如果需要理解发生了什么，请阅读注释：


    ![](img/00046.jpeg)


    图 46 [原始文件](http://icontemp.com/joagi/scripts/38.txt).[ icontemp.com/joagi/scripts/38.txt
    ]


    **注意：** 如果函数内部的变量 `x` 写成这样：`var x = x * num`，`var` 将为 `x` 创建一个新的作用域，这将使其成为与外部
    `x` 独立的 `x`。在这种情况下，外部的 `x` 不受计算的影响。


    ## 3.1.6 arguments 对象与内部函数


    `inner` 函数可以访问 `outer` 函数的 `variables`（变量）和 `parameters`（参数），以及全局变量。


    然而，内部函数并没有`direc`t 直接访问外部函数的 `arguments object`；只有在当 `arguments` 被指定为形式参数时才可以。


    记住这一点很重要，因为如果你没有意识到，这可能会让你困惑。


    现在，为什么父函数的 `arguments object` 对内部函数是不可见的呢？


    因为内部函数即使是空的，也有自己的 `arguments object`。


    所以当我们调用对象 `arguments` 时，我们谈论的是哪个 `arguments`：是内部的 `arguments` 还是外部的 `arguments`？当我们告诉内部函数返回参数对象时，它返回它自己的，那可能是一个空集。


    如果你需要复习 `arguments object` 与 `通过形式化参数的 arguments`，请参阅本章的开头。


    让我们编写一些代码来证明确实如此，并看看我们如何绕过它。


    1- 单独创建一个名为 `mx` 的函数并测试它（从下面的图片获取 `raw file`）。


    2- 然后创建一个 `inner` 函数，并尝试使用外部函数的 `arguments object` 看看会发生什么。只需按照图片上的指令操作即可。


    **注意：** 在这些示例中，我们没有直接调用参数“num”（那样是可以运行的）；我们调用的是整个 `arguments object`。让我们来看看：


    ![](img/00047.jpeg)


    图 47 [原始文件](http://icontemp.com/joagi/scripts/36.txt).[ icontemp.com/joagi/scripts/36.txt
    ]


    在上面的示例中需要记住的是，我们正尝试使用内部函数来访问外部函数的参数 `object`，而不是外部函数的形式参数（例如括号中的“num”）。最后一个例子（第
    22 - 27 行）运行良好，是因为我们通过`将内部函数绑定`到外部函数的参数对象上（第 24 行），从内部函数内部访问了外部参数对象。


    记住，内部函数可以访问外部函数的变量。函数的 `formal parameter`（形式参数）充当 `temporary variable`（临时变量）。然而，当我们尝试访问
    `object arguments` 本身（它不被视为参数）时，我们需要指定我们说的是哪个对象，因为内部函数也有自己的参数对象，而且那个具有优先级。


    ## 3.1.7 “this”变量


    让我们揭开 `this` 关键字的另一层含义。在之前的章节中，我们提到过 `this` 的用法就像我们使用代词“whose”一样。你可以把“this”想成一个指向`上一个提到的对象`值的变量，或者说是脚本在其作用域下运行的那个。让我们启动
    JS 控制台来玩玩“this”这个概念：


    1- 创建一个变量 `x` 和一个打印 `x + m` 的简单函数：


    ![](img/00048.jpeg)


    图 48 [原始文件](http://icontemp.com/joagi/scripts/39.txt).[ icontemp.com/joagi/scripts/39.txt
    ]


    2- 通过加 10 来调用函数：`y(10);` // 返回 355，一切正常，因为 345 + 10 = 355。


    让我们看看在这种语境下如何应用 `this`。我知道这有点过度，但请跟我坚持，这是有意义的。我们知道 `x` 是全局变量，所有全局变量都是 `Object`
    的属性，在浏览器中被称为 `window`。


    - 我们通过应用变量 `x` 的完整路径来重做函数：


    ![](img/00049.jpeg)


    图 49


    - 通过加 11 调用函数：`y(11);` // 返回 356，运行得良好，对吧？


    既然我们可以通过名称或通过绑定（binding）到 `window` 对象来调用全局变量，那么当我们将其绑定到“this”时它也应该工作，因为它代表了拥有函数的对象，*window
    对象*，对吧？


    - 再次修改函数：


    ![](img/00050.jpeg)


    图 50


    - 通过加 20 调用函数：`y(20);` // 返回 365，运行得良好。同样的过程！


    - 我们对这个小家伙进行一次“石蕊测试”。在函数内部添加一个与外部变量同名的变量。你从之前的阅读中知道，通常情况下，如果命名相同，函数会忽略外部变量而只使用内部变量，因为它是它找到的第一个，对吧？在在这种情况下不是的，因为我们正在绑定外部变量，以确保脚本理解我们的意思。


    让我们看看：


    ![](img/00051.jpeg)


    图 51


    - 通过加 20 调用函数（和之前一样）：`y(20);` // 返回 10365，运行得良好。它加了 `outer x` + `m` + `inner x`。


