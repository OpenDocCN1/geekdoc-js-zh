  trans: '

    `Boolean` 类型表示一个逻辑实体，它具有`两个`值，即 `true` 和 `false`。


    `String` 原始类型非常特殊！通常在其他语言中，字符串被视为`引用类型`，但在 JavaScript 中，字符串是`原始（Primitive）`类型。


    正如我们所知，字符串的大小是可以变化的，因此在 JavaScript 中，当你向字符串中添加单词时，当前的字符串会被另一个包含新添加数据的字符串所替换。对于原始值来说，变量及其数据是合一的，因此当我们修改字符串时，整个变量都会被替换。这种替换是因为容纳新数据需要内存空间。这种替换在后台发生，我们永远不会察觉这种区别。


    字符串值可以存储 0 个或多个字符，每个字符由一个 16 位的正整数表示。第一个位置编号为零。因此，在字符串“Tony”中，`最后一个字符`的`位置`是“Tony”的长度`减
    1`，因为它是从零开始的。当字符串包含实际文本数据时，每个元素被视为单个 UTF-16 [代码单元](http://en.wikipedia.org/wiki/Code_point)。


    简而言之（稍后将演示），JavaScript 字符串实际上存储在栈中，因为它们是原始类型。如果字符串扩展，`一个新字符串会替换旧字符串`，旧的`数据`会被丢弃。


    ## 1.3 变量 vs 引用类型


    我意识到我们还没有介绍 `Number` 原始类型。随着学习的深入，我们将详细介绍数字。基本上，原始类型是系统提供的类型。`Number` 类型连同文本（String
    类型）以及布尔值，是 JavaScript 中的`基础原始类型`。


    `Numbers, Strings, Booleans =>` JavaScript 原始类型。


    至于引用类型，我们在这里讨论的是`对象定义`。其他语言使用类（Classes）。[ECMAScript](https://en.wikipedia.org/wiki/ECMAScript)
    标准没有使用类。ECMAScript 是在 `ECMA-262` 中标准化的脚本语言名称。JavaScript 是该标准加上它运行的`环境`（例如`浏览器`）的结合。


    在 `JavaScript` 中，有一个我们可以称为`全局对象（Global Object）`的对象。它是原型（`模板`），每个创建的其他对象都将从它`继承标准属性`。


    全局对象是[变异的](http://en.wikipedia.org/wiki/Mutant)：取决于我们使用 ECMAScript 的地方，它实际上会有不同的生命形态。当
    ECMAScript 与计算机浏览器结合时，`全局对象`变成`窗口对象（Window Object）`，我们就是这样称呼它的（稍后讨论）。


    所以，如果我们将 `tony` 声明为一个`Object`：


    ```javascript

    var tony = new Object();

    ```


    我们正在为变量 `tony` 提供`预定义的工具供使用`。我的意思是，`tony` 从`JavaScript 内部库``继承了标准数量的属性和方法`，这些工具包含在`内置`的
    Object“原型”中。


    那么，这个新对象（`tony`）到底从 Object 标准模板中继承了什么呢？


    ### 1. 对象属性


    一旦`被声明为对象`，我们的新对象 `tony` 就会“通过指向”继承某些`属性`，例如：


    （不需要记忆。我们将在过程中自然地涵盖这个主题。只需理解即可。）


    **A) 构造函数（Constructor）** – 一个通过 `new` 运算符创建相似的`未来`对象的“公式”。构造函数是对一个函数的引用。如果你需要创建对象的实例，构造函数可以作为一个脚本使用，充当接口，规定了新对象`可以`和`不被允许`拥有的新规则。这简化了构思并节省了内存，因为所有对象都可以从它的源（当前源）获取养分，我们只需要编写一次这个源，而与有多少个对象实例无关。一个`继承的`构造函数是`指向源的指针`，对于已经构造好的对象的功能来说并不是必需的。它仅用于给`未来`对象一个通过构造函数`脐带`出生并生存的权利。构造函数利用了名为
    `this` 的`隐藏`参数，这是一个通用的`占位符`，将代表正在被处理的对象。在英语中，我们使用代词“whose”。正如在 whose 中一样，在 JavaScript
    和其他语言中，我们使用 `this` 来产生类似的结果。“this”意味着“作用域内上一个对象的实例”，或者我们现在这里想要代表的对象。关于“this”的更多信息稍后介绍。


    **B) 原型（Prototype）** – 另一个继承属性是 `Prototype`，它是一个内置接口。`Prototype` 充当对象从父对象继承属性和方法的`脐带`或管道。“Protos”或父级是源，当前对象从链中上方某处的另一个对象那里继承属性/方法。该源。这种链接的有用用性超过了当前对象本身，因为较低层级的其他对象也可能从它们的祖父对象继承特征。和构造函数一样，原型链链接仅用于检索。它对更新原型没有影响。这意味着当前对象中的任何更改都不会改变其原型或父级源。我们也可以将原型视为对象被授权使用的所有方法的列表。该对象的每个新实例都会继承这个列表。我们稍后将对原型进行一些实验工作。


    **![](img/00002.jpeg)**

    图 2


    不要从`继承`属性和方法的角度来考虑 JavaScript。要从`接口`的角度来考虑它。某些对象拥有方法。这些方法可以与管道下游的其他对象建立接口，其他对象可以使用它们来创建自己的功能，这些功能可能与父对象相似，也可能不相似。


    ### 2- 对象方法


    至于`继承的方法`（我们的示例对象 `tony`），它“通过指向”从其父对象“Object”对象继承`方法`。


    （不需要记忆。我们将在过程中自然地涵盖这个主题。只需理解即可。）


    **a) hasOwnProperty**–（将 `hasOwnProperty` 看作一个问题，JavaScript 提供结果作为答案）。此方法`不`检查继承链的`向上`或`向下`。它只验证问题对象是否创建了`自己的`属性（例如属性‘writer’：`object_name.hasOwnProperty(''writer'');`？
    如果它存在`并且如果`它是被创建的，而不是从链中向上继承的，则返回 true）。


    `tony.hasOwnProperty("toString");` 返回什么吗？返回 `false`，因为这属于它的父对象。注意：我们很快就会在控制台上尝试这个。


    **b) isPrototypeOf**- `isPrototypeOf` 方法允许我们检查一个对象是否直接从另一个对象获取其`魔法`。我们需要包含“prototype”一词才能使用此方法。换句话说，“`ObjectOne.isPrototypeOf(ObjectTwo)`”将不起作用，因为
    JavaScript 不知道我们对该命令指的是什么。我们需要更具体一点，并这样写：`ObjectOne.prototype.isPrototypeOf(ObjectTwo);`？
    如果 `objectOne` 是 `objectTwo` 的`原型`，则返回 true。这等于说 `objectTwo` 是从 `objectOne` 建模的。“建模”节省了内存，因为无论
    `objectOne` 拥有哪些属性，在实例化 `objectTwo` 时都不会重新创建，因为它们已经存在（注意：稍后我们将看到这完全取决于我们如何编写脚本）。


    **c) propertyIsEnumerable** - 此方法用于确定对象中的指定属性是否`足够可见`（被列出）以便在脚本（如 for...in 循环）中进行枚举。`它实际上列出了对象自身的属性`，因为自身的属性是可以枚举的，但所有继承的属性不在
    `enumerable`（可枚举）列表中，不会出现在 for...in 循环中。

    '
- fmt: "\n### d) `toString()` - Every object has a `toString()` method. It is automatically\
    \ called when the object is to be represented as a text value like when we `alert(object)`\
    \ or `console.log` it. String conversion happens when a string representation\
    \ of an object is required.\n\n### e) `valueOf()` - JavaScript returns the primitive\
    \ value of the specified object. `myobject.valueOf()` may return an `Array`, `Boolean`,\
    \ `Date`, `Function`, `Number`, `Object`, `String`. JavaScript uses this method\
    \ internally and as needed, but we can also call it on purpose. Objects `Math`\
    \ and `Error` do not have a built-in `valueOf` method.\n\nGoing back to properties:\n\
    \nPicture this: A property of an object can be explained as a variable attached\
    \ to the object. Of course, all these properties and values can be overwritten\
    \ when we create a new object.\n\n**So, in this example:** `var tony = new Object();`\
    \ is `tony` the object itself?\n\nThe answer is No; `tony` is a `label`, a `symbol`.\
    \ Technically the symbol `tony` is classified as a `variable` (a pointer) which\
    \ temporarily resides in the stack and points to an object instantiated (cloned\
    \ but using existing functionality) from a template. This object resides in the\
    \ heap and once we reassign or delete the label `tony`, this objet goes into garbage\
    \ collection mode from where it will be erased (different browsers implement different\
    \ ways of sweeping unused data. This technique gets improved with each new browser\
    \ version).\n\nIn JavaScript, almost everything is an object. All primitive types\
    \ except `null` and `undefined`, are actually treated as objects by JavaScript,\
    \ because they get internally wrapped into objects, whenever the interpreter needs\
    \ to implement a method to process the primitive in question.\n\nBecause they\
    \ can be wrapped as objects, properties and methods can be assigned to primitives,\
    \ showing all the characteristics of an object. This is because JavaScript has\
    \ a prototype reference for `Boolean`, `Number` and `String` in its library, which\
    \ is automatically called in when temporarily needed to wrap a primitive value:\n\
    \n![](images/00003.jpeg)\n\nFigure 3\n\n## 1.4 Everything comes from objects\n\
    \n## 1.4.1 Lab 1\n\nTime to fire up your favorite JavaScript Console and do some\
    \ lab work. In this project I will use the console from Google Chrome. At the\
    \ browser, you can click on the shortcut `CRTL+SHIFT+j` for Windows, `CMD+OPT+j`\
    \ for Mac, or follow the steps below:\n\na) Open Chrome. On the top right, locate\
    \ the 3-horizontal-lines button, and click.\n\nb) In the Tools section, click\
    \ on JavaScript Console.\n\nNow let’s play a bit with `typeof`. Observe each result\
    \ and try deducting the reasons why it is so.\n\n`typeof` is a JavaScript operator.\
    \ Its purpose is to return a string indicating the type of the operand.\n\nEnter\
    \ the code in green, followed by the Enter key. Pay closer attention to steps\
    \ 9..15:\n\n1- `typeof 1;`\n```\n// result is “number”. Of course one is a number!\
    \ Notice how the console automatically finished the `typeof` keyword. Never wrap\
    \ a number in quotes unless you want to convert it to type string.\n```\n\n2-\
    \ `typeof x;`\n```\n// result is “undefined”. x does not exist as defined.\n```\n\
    \n3- `typeof tony;`\n```\n// result is “undefined”. JavaScript doesn’t mess around!\n\
    ```\n\n4- `typeof \"tony\";`\n```\n// result is “string”. Ah now we are speaking\
    \ JS lingo! The quotation marks make it a string.\n```\n\n5- `typeof true;`\n\
    ```\n// result is “boolean”. true is a reserved word. JavaScript is case sensitive.\n\
    ```\n\n6- `typeof \"true\";`\n```\n// result is “string” Do you see why? Although\
    \ `true` is reserved, “true” does not exist as string.\n```\n\n7- `var y = 123;`\n\
