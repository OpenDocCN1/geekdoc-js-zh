    ## 3.1.4 The closure principal


    “Knowledge is `closed` under entailment”. Entailment means “logical consequence”.
    If `A` knows `B`, and `B` entails `C`, then `A` knows `C`.


    In the array described above, when variable `ara` was declared `null`, normally
    the array would be placed for `garbage collection`. However, it is said that variables
    `ujo` and `tony` had closure on `array` and therefore the array survived the dismissal
    of its original pointer. In JavaScript, closure “talk” is usually referred to
    functions when a function returns, it ends and is sent to garbage collection.
    However, if there is `inner function` still holding the thread to outer function,
    those variables will not be destroyed. They will remain in `execution context`
    until the inner function finishes its job.


    Before we get to function examples, let’s analyze the picture below, just to be
    sure we understand the principle behind closures since isn’t much literature about
    it.


    ![](images/00040.jpeg)

    Figure 40


    1- Let’s create an easy function to experiment with closures:


    ![](images/0041.jpeg)

    Figure 41 [raw script](http://icontemp.com/joagi/scripts/59.txt)


    2- Call the function on `boy`: `kiteFlying("boy");` // returns "has kite". `boy`
    returns the variable `boy` which is “has kite”.


    3- Call the function on `girl`: `kiteFlying("girl");` // returns "has kite". `girl`
    triggers `else`, which triggers the function `girl()`, which in turn return the
    contents of `boy`, which are “has kite”. When `kiteFlying()` has already returned,
    but variable `boy` is still available because `girl()` has closure. The above
    function has an inner function and based on the argument it returns either `boy`
    from the outer function or `girl` which is the inner function.


    However, as you know, when a function returns, it gets wiped out. In this case,
    if the function returns “else”, which is another function, it still gets wiped
    out, but the inner function is able to fetch the variable from the outer function
    while the outer function is already gone. Then the inner function also gets wiped
    out.


    The question is: How does the inner function access the outer function’s variable
    when the outer function no longer exists? Remember the picture with the balloons
    above? This is what happens:


    1- JavaScript looks at the outer function at the time of calling and makes an
    inventory: `Outer function`, `variable boy`, “has kite”


    2- JavaScript also looks at the inner function and makes an inventory: `Inner
    function`, `mapped boy` (a free from outer function), “has kite”. Then, it does
    not matter what happens to the outer function. As long as the inner function is
    still processing, JavaScript keeps a pointer to the surrounding variables such
    as `boy = “has kite”`. And that’s because of the inventory list first made. JavaScript
    functions aren''t really just pieces of code you can execute; they are `closures`,
    like [dreamcatchers](https://en.wikipedia.org/wiki/Dreamcatcher), they are symbols
    of unit. A closure records not only what code a function must run, but also what
    environment it was created in. An inner function has access to the outer function
    and the outer of outer function, all the way up to Global object.


    ![](images/0042.jpeg)

    Figure 42


    Sometimes we read on the web how closures have free variables. By free variables
    it is meant all variables a function can use but are not in the function. In this
    illustration, `func2` has the following free variables: `A`, `B`, and `C`. (`D`
    is not free, it belongs to `func2`).


    Below we have another way of seeing it based on the balloon concept. This demonstrates
    which balloons are being held by whom at the time `function1` is instantiated
    (called):


    ![](images/0043.jpeg)

    Figure 43


    Taking the concept of the above illustration as an example, we could use `func2`
    to make the outer function variables more private if we wanted to. We would do
    this by outputting the outer function variables through the inner function, creating
    a shield between the outside world and `function1`. Consider the following example:


    ![](images/0044.jpeg)

    Figure 44 [raw script](http://icontemp.com/joagi/scripts/61.txt)


    In the above example, we further isolated the outer function data (`clientBalance`)
    from the public scope. We did this by creating an `inner` function which acts
    as an `interface` between the outer function and the outside world. The outer
    function’s data remains private as there is no output directly from it. The process
    works due to the closure principle, which keeps tabs on the `lexical environment`
    (covered next), even when the outer function returns before the inner function
    does, which is the case. The outer function outputs the inner function which in
    turn returns its result. Its result (inner) is based on the data in the outer
    function. The data in the outer function does not get wiped out during the microseconds
    when the outer function returns and closes, because the inner function is still
    pointing at its (outer) data. It only gets wipeout (outer) after the inner function
    returns and places itself and its entire lexical environment, at the mercy of
    the garbage collection mechanism.


    So what is the purpose of all these?


    The purpose is to prevent any script from the outside to view or edit the private
    variable `clientBalance`. This variable is only being accessed by the inner function,
    which is called from the outer. Sort of like a bank clerk accessing the vault.


    ## 3.1.5 Lexical Scope


    Lexical means “words that refer to things” or a “menu of things”. In languages
    without closures, the lifetime of a local variable ends with the execution of
    the scope. However, in languages with closures, such as JavaScript, variables
    continue to exist well after the code is done, as long as there are closures surrounding
    them.


    Since scope in JavaScript is determined by functions, functions are also the ones
    that create closure environments, which connect variables and arguments to running
    processes. As you remember, a closure happens when a mechanism in an inner scope
    points to data in an outer scope, and JavaScript needs to keep a log of potentially
    necessary data, preventing any active scope from being wiped out. This persistence
    method is normally done by the garbage collection mechanism. Garbage collection
    is managed by the browser, and it varies depending on which browser and its version
    JavaScript is being run on.


    The image below illustrates a set of nested functions and their scope environment,
    also known as lexical (or static) scoping “Every inner level can access its outer
    layers”:


    ![](images/0045.jpeg)

