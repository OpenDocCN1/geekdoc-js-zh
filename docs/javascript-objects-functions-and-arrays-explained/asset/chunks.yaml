    When it comes to all or nothing, the method `some() ` is the opposite of `every()`.
    It will return true if any of the elements checks positive to the query criteria.
    As `every()`, it doesn’t change the original data, it only reads the data and
    reports back. It is up to us to manipulate the data in question.


    The method `some()` can be used to test a script of the existence of a certain
    element or condition.


    Here’s a sample script based on the same data from the last exercise:


    1- Declare an array ( if not yet declared):


    ```javascript

    var abc = [1,2,3,4,5];

    ```


    2- Call the `some()` method to check if any of the elements in the array are even.
    As long as one element is even, the result will be true:


    ![](images/00026.jpeg)


    Figure 26 [raw file](http://icontemp.com/joagi/scripts/24.txt).[ icontemp.com/joagi/scripts/24.txt
    ]


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.4.4.17 Array.prototype.some](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.17)


    ## 2.3.5 filter( )


    The array method `filter()` works the same way as `some()` but instead of returning
    true or false, it returns an array containing the elements that qualify as true.


    Let’s use the same `abc` array as an example.


    1- Declare the array `abc` if it hasn’t been declared before:


    ```javascript

    var abc = [1,2,3,4,5];

    ```


    What we want here to do, is to extract all the even numbers into a new array.


    2- Declare a new array `abc2` and use `filter()` to iterate through each item
    and fetch all even numbers into it:


    ![](images/00027.jpeg)


    Figure 27 [raw file](http://icontemp.com/joagi/scripts/25.txt).[ icontemp.com/joagi/scripts/25.txt
    ]


    3- Call array `abc2` as per line 9 and observe the result which should be even
    numbers such as [2, 4].


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.4.4.20 Array.prototype.filter](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.20)


    # 2.4 New JavaScript Array Reduction and Location Methods


    ## 2.4.1 What is Reduction


    In computer Science a reduction is an algorithm for transforming one problem into
    another problem, or the conversion of an expression or equation into its simplest
    form.


    ECMASCript 5 has introduced two methods of reduction, `reduce()` and `reduceRight()`.
    The difference between one and the other is the direction in which they operate.
    One starts at the beginning of the array, the other starts at the end of the array.


    Both reduction methods take an anonymous function where we can save some code
    customization of our own, and an optional base value:


    ![](images/00028.jpeg)


    Figure 28


    **The initValue is an arbitrary name for a parameter in the reduce/reduceRight
    methods that change the outcome:**


    If the `initValue` is present, the function iteration will start at the `initValue`
    value.


    In the JavaScript reduction methods, when an `initValue` is present, the first
    parameter of the anonymous function which I will call `previousValue` starts at
    the `initValue`’s value. The second parameter of the function, which I call `currentValue`,
    starts at the value of the first item.


    ![](images/00029.jpeg)


    Figure 29


    Normally the `initValue` is not present and in this case, the first parameter,
    `previousValue`, starts at the first item value, and the second parameter, `currentValue`,
    starts at the second item value.


    See the next two examples for further explanation.


    ## 2.4.2 reduce( )


    The method `reduce()` allows a callback function with up to four arguments:


    a) `previousValue` - The value from the previous call to the callback function.


    b) `currentValue` - The value of the element at current iteration (position).


    c) Optional `current index`, or location of the object being traverse. You can
    exclude the index as a parameter, or included it if you need to influence the
    calculation process.


    Let’s look at an example. We are going to declare an array with even numbers.
    Then we will declare a variable to store the result of multiplying all numbers
    of the array, using `reduce()`.


    1- Declare array `qaz`:


    ```javascript

    var qaz = [2,4,6,8];

    ```


    2- Declare a variable `addQAZ` and assign `qaz` to the variable where both left
    and right values are multiplied by one another with the help of the method `reduce()`:


    ![](images/00030.jpeg)


    Figure 30 [raw file](http://icontemp.com/joagi/scripts/26.txt).[ icontemp.com/joagi/scripts/26.txt
    ]


    3- Call `addQAZ;`


    ```javascript

    // returns 384.

    ```


    On the first iteration, `previousValue` is 2 (first element), and the `currentValue`
    is 4 (second element), and so on.


    However, if we had included the `initValue`, which would go here: `}, init);`
    the `previousValue` would have started at the `initValue` given, and because of
    that, the `currentValue` would have started at the first element’s value instead
    of at the second’s, resulting in a totally different output since the `initValue`
    value would have influenced the operation at hand. See the next example:


    4- For example, let’s declare another variable using the same script as before
    but giving `reduce()` an `initValue` of `10`:


    ![](images/00031.jpeg)


    Figure 31 [raw file](http://icontemp.com/joagi/scripts/27.txt).[ icontemp.com/joagi/scripts/27.txt
    ]


    5- Call `addQAZ2;`


    ```javascript

    // returns 3840. A big difference from before.

    ```


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.4.4.21 Array.prototype.reduce](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.21)


    ## 2.4.3 reduceRight( )


    The array method `reduceRight()` works the same way as the previously described
    method `reduce()`. The difference is **where it starts**: `reduceRight()` starts
    processing from the last two elements of the array, whereas `reduce()` starts
    processing from the first two elements of the array. One works from right to left,
    the other works from left to right. Everything else that has been described for
    `reduce()`, also applies for `reduceRight()`.


    If we use the previous script (multiplication) to `reduceRight()`, the result
    is the same, 384 and 3840. For testing purposes just **change “reduce” to “reduceRight”**
    on line 2 in the examples given above.


    For illustration’s sake let’s try a different script. This time we subtract one
    value from the other to see how these methods differ:


    1- Use the previously declared array `qza`. If you are restarting your JavaScript
    console, declare the array as shown below:


    ```javascript

    var qaz = [2,4,6,8];

    ```


    2- Follow the next two steps on the figures shown below to test `reduce` and `reduceRight`,
    when values are subtracted:


    ![](images/00032.jpeg)


    Figure 32 [raw file](http://icontemp.com/joagi/scripts/28.txt).[ icontemp.com/joagi/scripts/28.txt
    ]


    3- Call `subQAZ;`


    ```javascript

    // returns -16.

    ```


    4- Change the method to `reduceRight`:


    ![](images/00033.jpeg)


    Figure 33 [raw file](http://icontemp.com/joagi/scripts/28b.txt).[ icontemp.com/joagi/scripts/28b.txt
    ]


    5- Call `subQAZ;`


    ```javascript

    // returns -4.

    ```


    In the above example, `subQAZ` returns -4 when using reduceRight, as opposed to
    -16 in the prior exercise.


    As you can see the result of subtracting all the array items is quite different
    between `reduce` and `reduceRight`. Keep these differences in mind when looking
    for code solutions.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    · [15.4.4.22 Array.prototype.reduceRight](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.22)


    ## 2.4.4 Location Methods


    Beyond the *iteration* and *reduction* methods, JavaScript has two new methods
    that can be used to locate items in the array: `indexOf()` and `lastIndexOf()`.


    IndexOf starts from the left to the right, and lastIndexOf starts from the right
    towards the left.


    They both work the same way and give the same location reference position.

