    ## 2.1.2 charAt( pos ) and charCodeAt( pos )


    Both of the above methods have to do with accessing a character from a string
    and **based on the character’s position**. The first returns the character and
    the later returns the character Unicode itself.


    Let’s look at an example of each:


    1- Declare a variable x: **var x = "bananas** **";**


    2- Call its wrapper String method charAt: **x.charAt(2);** // returns “n” ( it
