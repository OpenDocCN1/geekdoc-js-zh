    它先找到了最后一个“walnuts”。


    如果搜索的项不在数组中，这两种方法都会返回 -1。


    这些元素是如何比较的？索引方法将用于搜索的元素与 `Array` 中的元素进行比较，并使用**严格相等**（strict equality），这与 `===`（三全等号运算符）使用的方法相同。如果元素在语法或类型上不同，算法将返回
    -1 表示“未找到”。


    #### 可选第二个参数：从哪里开始。


    `indexOf()` 和 `lastIndexOf()` 可以使用第二个可选参数。


    这个第二个可选参数通常通称为 `fromIndex`（任何名称均可）。


