    从右向左找到了第一个“walnuts”。


    ### 搜索标准总结。


    以下是 `indexOf` 和 `lastIndexOf` 的总结。这是为了以后的参考而写的。不要试图背诵这些规则，只需在日后需要实现该方法时查阅它们即可。


    - **indexOf() 方法的搜索标准：**


    a) 在 `indexOf()` 方法中，可选的第二个参数 `fromIndex` 默认为 0。如果缺少 `fromIndex` 参数，JavaScript
    假设 `fromIndex` 为零。另一方面，如果 `fromIndex` 大于或等于数组的长度，将不执行搜索并返回 -1。


    b) 使用正数的 `indexOf` 表示从哪里开始搜索（包含），之后向右进行搜索。例如：`fromIndex` 为 1 表示从第二个元素开始搜索（包含），因为它是基于零的。


    c) 使用负数的 `indexOf` 用于偏置第一个要搜索的元素，偏移量基于数组长度加上该负数。计数是基于零的：在长度为 5 的数组中使用 -1，会使其从位置
    4 开始，即 0, 1, 2, 3, 4 或第五个元素），之后向右进行搜索。


    示例：


    1- 记住，我们的 `x1` 是 `["peanuts", "almonds", "walnuts", "heartnuts", "walnuts"]` `x1.indexOf("walnuts",
    -2);` // 返回 4，因为（ 5 - 2 = 3。3 实际上是元素 4 (heartnuts)，它已经跳过了第一个“walnuts”。返回的是下一个“walnuts”，即第四个元素的索引）。


    - **lastIndexOf() 方法的搜索标准：**


    a) 当配合 `lastIndexOf()` 使用时，`fromIndex` 默认为数组长度减 1。这是合理的，因为是从是从右侧开始的。


    在一个有 5 个元素的数组中，它默认为 4，这意味着将搜索所有元素：0,1,2,3,4。在前一种方法中它默认为零。此外，大于数组的 `fromIndex`
    作用相当于 `fromIndex` 为 4。


    b) 使用负数的 `lastIndexOf()` 用于偏置第一个要搜索的元素，偏移量基于数组长度加上该负数。计数是基于零的：在长度为 5 的数组中使用 -1，会使其从位置
    4 开始，即 0, 1, 2, 3, 4 或第五个元素），之后向右进行搜索。


    2- 在我们的示例中，它是最后一个“walnuts”：`x1.lastIndexOf("walnuts",-1);` // 返回 4。


    同样，具有 5 个元素的相同数组使用 -2 作为 `fromIndex`，将从位置 3 或元素 4 开始。


    3- 在我们的示例中，它从“heartnuts”开始：`x1.lastIndexOf("walnuts",-2);` // 返回 2。


    它在从末尾开始的第一个“walnuts”之后启动搜索。


    - 使用 `lastIndexOf()` 方法时，正数决定了从哪个位置开始搜索（从右到左）。例如：`fromIndex` 为 0 将只搜索第一个项，在我们的示例中是“peanuts”。`fromIndex`
    为 1 将只搜索第二个和第一个元素，按此顺序进行。


