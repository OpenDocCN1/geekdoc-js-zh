    \ That’s because the 10 multiplier + 1 makes random outputs from 1 to 10.999…\
    \ We could remove the decimals to get a cleaner output by using another method:\n\
    \n`Math.floor()` or `Math.ceil()`. The first rounds the number *down*, the second\
    \ rounds them *up*.\n\nHow do we combine `Math.floor()` with `Math.random()`?\n\
    \n**We wrap the second into the first**: \n```javascript\nMath.floor(Math.random()*10+1);\n\
    ```\n // results: rounds down to 1,7, 8, 4,10 etc\n\n```javascript\nMath.ceil(Math.random()*10+1);\n\
    ```\n // results: rounds up to 2, 8, 9, 5, 11etc.\n\n## Human versus machine\n\
    \nThe following script is a simple guessing game between a machine and a man.\
