    the function on line 12.


    ## 4.2.2 Converting Date to a string


    There are several methods to convert a date format to string format. Let’s look
    at a few of the most used ones to get an idea on how to use them:


    We are going to use the same **sampleDate** object we created earlier. If you
    are restarting the console again, please create **sampleData** as described earlier
    **and** below:


    var **sampleDate = new Date**; 


    Depending where you are located your result may be different. Here is mine: **sampleDate;**
    // returns " Wed May 28 2014 17:49:04 GMT-0400 (Eastern Daylight Time)".


    Now we can test some of the **string conversion methods** available from the date
    object:


    sampleDate**.toDateString()**; // returns (in my case) "Wed May 28 2014"


    It grabbed the left portion of the full date displayed on the previous exercise,
    leaving out the time portion at the far right.


    sampleDate**.toLocaleDateString()**; //returns  "5/28/2014"


    It returned the same date as previously, but in a format more appropriate to my
    **location**.


    sampleDate**.toLocaleTimeString()**; // returns "5:49:04 PM"


    *toLocaleTimeString* returns the localized ***time*** portion of the date.


    sampleDate**.toLocaleString()**; 


    // returns "5/28/2014 5:49:04 PM"


    *toLocaleString* is a combination of *toLocaleDateString* and *toLocaleTimeString*.


    sampleDate**.toUTCString()**; // returns "Wed, 28 May 2014 21:49:04 GMT"


    *toUTCSString* returns a string, according to **universal time**.


    sampleDate**.toJSON()**; // returns " "2014-05-28T21:49:04.498Z"


    *toJSON* returns a string in the **JSON format**. W


    ## 4.2.3 Useful JavaScript date libraries


    JavaScript date libraries allow us to add date and time picker functionality to
    our applications by manipulating, parsing and formatting dates.


    *   [Later.js](http://bunkat.github.io/later/) - Easily define complex schedules
    then quickly calculate future or previous schedule occurrences. Works in Node
    and in the browser.


    *   [Countdown.js](http://countdownjs.org/) - A simple JavaScript API for producing
    an accurate, intuitive description of the timespan between two Date instances.


    *   [Moment.js](http://momentjs.com/) - This library can easily convert any given
    date to many different formats, add/subtract dates, hours, and has methods for
    displaying user-friendly date/times like “in 5 days”, in a multi-language environment.


    *   [Cubism.js](http://square.github.io/cubism/) - Is a JavaScript visualization
    library for HTML and SVG, to display time series in real-time.


    *   [XDate](http://arshaw.com/xdate/) – Is a thin wrapper around JavaScript''s
    native Date object that provides enhanced functionality for parsing, formatting,
    and manipulating dates. It implements the same methods as the native Date, so
    it should seem very familiar.


    # PART V – DEFEATING THE DRAGON


    “Great things are not done by impulse,


    but by a series of small things brought together.” *Van Gogh*


    # 5.1 Unordered Lists as Objects


    We’ve seen earlier on 2.2 The Array Object in JavaScript how **array** objects
    are numerically *ordered* lists. In JavaScript when we see the *square* brackets
    we know it is an array of some sort:


    **var x = [77, 34, 23, "book"];**


    We also know how, in arrays, every item is ordered starting from location 0 and
    up. In our example, the first location (at zero) contains item 77\. The fourth
    location, which is in position 3, contains a string named “book”.


    We can also recall seeing something like the following script:


    **var y = {"Fruits": "apple", "Vegetables": "spinach", "Grains": "beans"};**


    The above script represents an **unordered list**. In JavaScript, **unordered
    lists** are not part of the *array family*, they stand on their own as objects
    of their own right. They are represented by **key-value pairs**.


    Because we can fetch the items by their **key label**, they don’t need to be *ordered*
    in any particular sequence, and this gives them a different flexibility than arrays.


    So, in summary, we use square brackets **[ ]** to declare numeric ordered arrays,


    and curly braces **{ }** to declare objects with key-value pairs.


    In arrays we call in an item this way: **x[2];**  // returns 23


    which is the 3^(rd) element from our example above.


    In object notation we call an item in this way: **y.Fruits;** // returns “apple”.


    We could also call an object key label with *bracket notation* just like we do
    with arrays:


    **y["Fruits"];** //  returns "apple ". Make sure you include the key **in quotes**
    for bracket notation.


    **Bracket notation** is good to keep in mind *because* if you ever use a number
    as a *key* in a **key-value pair**, you can’t call it or add it with **dot.syntax**,
    like this **y.12="foo"**;. We need to add or call it like this:


    **y[12] = "foo";**


    Printing y: **y;** // returns Object {**12: "foo"**, Fruits: "apple", Vegetables:
    "spinach", Grains: "beans"}


    Also calling y 12: y[12]; // returns 12: "foo". (Contrary to *keys as strings*
    which require quotes when referring to them in bracket notation, numbers as keys
    work either way, quotes or not).


    **Lab Work:**


    1- **Let’s create the object again**.


    This time we add each different item in a separate line. This is a common method
    of creating more complex objects because it is visually more appealing and less
    prone to error than the above example, albeit the same. (copy from  the raw file
    if you so desire):


    ![](images/00073.jpeg)


    Figure 73 [raw file](http://icontemp.com/joagi/scripts/71.txt).[ icontemp.com/joagi/scripts/71.txt
    ]


    Creating an object in this manner such as the one above, works well if we don’t
    have intentions of *instantiating* other objects based on the same *template*.
    If we have intentions of using this object as a prototype for other objects, then
    it is best to create the object through a function with parameters just like we
    created the *JobApplication Form* on the subchapter 3.1.8 Functions as Object
    Constructors. We will go over it again soon.


    There are many ways to create objects. Mentioning all of these ways is a source
    of unnecessary confusion and it can actually slow the learning process as well
    as the gaining of practical experience. Do not overload yourself. Here, less is
    actually more!


    2- If you haven’t done so, please **paste the above object** ***y*** on your *Javascript
    Console* in order to test a few important concepts before we build anything more
    detailed.


    3- Print the object: **y;** // returns Object {Fruits: "apple", Vegetables: "spinach",
    Grains: "beans"}


    3- Print Fruits: **y.Fruits;** // returns "apple"


    **Here’s a silly story:**  “apple” is my favorite fruit. However anyone can come
    to my computer and change my favorite fruit to “lemon” while I’m not looking.


    4- (try it): **y.Fruits = "lemon";**


    Then one day another friend comes to visit me and I’m showing him how my JavaScript
    object can remember my favorite fruit,


    5- and when I type fruits... **y.Fruits;** // I get “lemon”!!!'
