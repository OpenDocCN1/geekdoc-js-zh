    ## 2.1.15 valueOf()


    The String method `valueOf()` converts an object to a primitive. This is usually
    done automatically so we seldom call it ourselves. We will be using it sometimes
    throughout the book.


    All objects including `String`, descend from object `Object`, and all objects
    inherit properties and methods from `Object.prototype` unless they are overridden
    by the new object. The `valueOf()` method is inherited from `Object` but every
    `built-in object` such as `String`, overrides it so it can return an appropriate
    value for its type.


    When we call `valueOf` it returns a value as follows:


    In an `Array`, the array instance; In a `Boolean`, the `Boolean` value; In `Date`,
    the stored time value in milliseconds since midnight, January 1, 1970 UTC; In
    a `Function`, the function itself; In `Number`, the numeric value; In `String`,
    the string value; In `Math` and `Error` objects, nothing is returned since there
    are no `valueOf` methods; And last but not least, in objects with no primitive
    values, the object itself as object `Object`.


    The code script is `objectName.valueOf()`. When we call `valueOf` on a string
    variable JavaScript wraps it on the `String` object and gives us its value.


    Sample code:


    ```javascript

    1- Declare a variable: var ppp = "amazon";

    2- Call valueOf: ppp.valueOf(); // returns “amazon”.

    ```


    Recapping this concept, **the `valueOf()` returns the primitive of an object**.
    **If there is no primitive, it returns the object reference itself**. Each built-in
    object type modifies the output to coincide with its type. In case of a `String`,
    it returns the string value. This method is usually called automatically by JavaScript
    behind the scenes when it needs the primitive value of an object. It is not a
    commonly written code script but there are exceptions.


    `valueOf()` is the default method used to extract a single value from an object.
    Another method would have been `toString()` which is not needed on a `String`
    object but it comes handy on other types of objects, a way to display the value
    itself. As written earlier, In a `Boolean` Object, the value will be converted
    to the string `true` or its counterpart, `false`. In some other `Object` types,
    `valueOf()` result will not have much use and may not be applied as much. We will
    revisit `valueOf` in later chapters.


    **Need further explanation?**


    ```javascript

    3- Declare the following variable: var x = 123;

    4- Call the valueOf x: x.valueOf(); // returns 123\. It shows the value inside
    of x.

    5- Declare an array: var y = ["Tony","de","Araujo"];

    6- Get the valoueOf y: y.valueOf(); // returns ["Tony", "de", "Araujo"]

    7- The example on step 6 could be replaced by the method `toString()` to have
    a different visual effect: y.toString(); // returns "Tony,de,Araujo"

    ```


    JavaScript does this conversions internally depending on what it needs to use
    at the moment and what king of object it is working with. Programmers also take
    advantage of `valueOf()` as you will be able to see in later topics.


    **For more information, please refer to the following ECMASCRIPT 5 page:**


    - [15.5.4.3 String.prototype.valueOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.3).


    ## Summary: String Object methods


    In ECMAScript, the `Object` constructor is able to automatically **box all primitive
    types** as object types when need.


    It is like saying that when an `Object` sees a primitive being used as object,
    it *boxes* it like this:


    `new Object([primitive])`


    Then later, it unboxes it like this:


    `[boxedobject].valueOf()` (Remember the discussion about `valueOf()`? It returns
    a primitive value when invoked).


    We will be using `String` methods in subsequent topics because these methods are
    used everywhere. Make sure to return to this chapter if you find yourself a bit
    lost. I will remind you as we go along.


    Learning is nonlinear, the conveyor-belt model of learning is from the 19^(th)
    century and it has no place in our modern world. We learn by doing, through direct
    experiences and by dealing with issues as they arise. We learn by making connections
    between what we already knew and what we are currently learning. Each one of us
    constructs our own knowledge set. I hope I am being somewhat successful on providing
    you the tools to build your own experience.


    ## 2.2 The Array Object in JavaScript


    Arrays are *ordered list* objects. The order is what makes this object an array
    since objects by themselves are typically unordered.


    (For unordered lists please see 5.1 Unordered Lists as Objects.)


    In JavaScript an [array](http://en.wikipedia.org/wiki/Array) uses an index number
    pointing to a *pocket* where data may be stored. Contrary to other languages,
    in JavaScript there is no such thing as an Associative Array where the index is
    substituted by a string label. If you attempt to assign a label to a data pocket,
    it makes the data a property of the object, and it is not listed as an array item.
    If you really want *key-value pairs*, it is best to use the `Object` construct
    (*curly braces* which makes it an *unordered list*) instead of the array construct
    (square brackets). Object constructs will be covered in more detail in a later
    chapter. A link to that chapter can be found above this paragraph.


    Because of the Array rigid order, there are *specific methods* to append data
    to the beginning, to the end, and also to append in between items.


    The array constructor is as follows:


    ```javascript

    var bcd = new Array("green","red","yellow");

    ```


    This declares a variable (a pointer) named `bcd` which points to an array object
    containing three string names. Notice the `new` keyword. Although we could skip
    “new” when we declare an array object like this, it is recommended to **always**
    include it if you use this type of construct (I mean the `Array()` function call).
    Notice how the first letter of `A`rray is capitalized, just like `O`bject and
    `String` object. In JavaScript, native and built in object names have their first
    character capitalized. Since JavaScript is case sensitive, all native and built
    in objects must be called upon exactly as they were created, in other words, with
    the first letter capitalized.


    JavaScript has a shortcut to create arrays, which is the **square bracket notation**.


    Instead of this: `var ijk = new Array( );` // creates an empty array.


    1- It is more common to do it this way: `var ijk = [ ];` // creates an empty array.


    Contrary to some other languages, there is no need to declare the *number of items*
    the array can contain. JavaScript arrays adjust accordingly. When we add new items,
    just like it does with strings, JavaScript copies de existing data plus the new
    data into a new array instance and discards the old one, and at the same time,
    JavaScript tells the variable to point to the latest array instance.


    2- After declaring the above array `ijk`, we can add items like this:


    ```javascript

    ijk[0] = "red"; // first location is always location 0.

    ijk[1] = "white";

    ijk[2] = "blue";

    ```


    3- Call it like this: `ijk;` // returns ["red", "white", "blue"].


    4- We can also call individual items like this: `ijk[0];` // returns "red".


    And just like the `String` object, the `Array` object inherits properties and
    methods from `object Object`.


    We will cover some of these properties and methods next.


    a) **Array properties** such as `length`, `prototype` and `constructor`.


    The `constructor` property has already been explained when we covered `String`
    objects. We will explore *constructors* during our lab work when we get to create
    our own objects at a later chapter.

