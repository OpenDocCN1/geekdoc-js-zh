  trans: "\n\n你可以按照我的指示进行，或者如果你愿意，也可以按照自己的节奏来，稍后再检查结果。我会在过程中添加一些注释。最好的可能是先完整执行一遍，然后你自己重新做一遍。\n\
    \n我将首先单独创建第 (**b**) 部分，以便我对其进行 `test it`。部分 `(b)` 是提交和批准贷款申请的方法。\n\n然后，我将创建 `object`\
    \ 并将我的 `submit method` 复制（并适配）到该 `object` 中。（在步骤 **3** 处可以找到原始文件的链接）。\n\n如果你需要一个在线编辑器作为草稿板，这里有一个很有用的工具：[editpad.org](http://www.editpad.org/)。\n\
    \n### 第 1 部分：创建方法\n\n1- 首先，我声明一个变量 `approvalStatus` 并将其设置为 `\"invalid\"`：\n\n\
    ```javascript\nvar approvalStatus = \"invalid\"; // invalid 只是我任选的一个字符串，不是关键字。\n\
    ```\n\n2- 然后，创建一个名为 `submit` 的 `testing function`，它包含两个参数：`income` 和 `loanAmount`。\n\
    \n这些参数不会出现在最终项目中，因为它们将包含在对象构造函数本身中，但现在，我在这里需要它们来测试方法 `submit`：\n\n```javascript\n\
    var submit = function(income, loanAmount){ };\n```\n\n3- 在函数体内，我需要一个 `conditional\
    \ statement` 来判定申请人的资格，并向他/她发送相应的消息。\n\n如果 `income` 至少是请求贷款金额的两倍，贷款将立即通过，外部变量\
    \ `approvalStatus` 将设置为 `\"Approved\"`，并发送一条状态消息；*否则*，`approvalStatus` 将设置为 `\"\
    On review\"` 并发送一条不同的消息：\n\n```javascript\nif(income/loanAmount >= 2){  //这会计算收入与贷款的比例。\n\
    \  approvalStatus = \"Approved\";\n  console.log(\"see script for the message\"\
    );\n} else {\n  approvalStatus = \"On review\";\n  console.log(\"see script for\
    \ the message\");\n}\n```\n\n**请在此处找到** **原始文件](http://icontemp.com/joagi/scripts/pre1.txt)**。[\
    \ icontemp.com/joagi/scripts/pre1.txt ]\n\n4- 将脚本粘贴到 `console` 中，通过使用 `income`\
    \ 和 `loanAmount` 之间的比例来测试函数 `submit`：`submit(5000, 1000);` // 返回 \"Congratulations!\
    \ Your application for a loan of 1000 has been approved\"。\n\n```javascript\n\
    approvalStatus; // 返回 \"Approved\"。\n```\n\n5- 到目前为止一切顺利！现在我将用较低的收入进行测试：`submit(1500,\
    \ 1000);` // 返回 \"Thanks for submitting a loan application. We will contact you\
    \ shortly.\"\n\n```javascript\napprovalStatus; // 返回 \"On review\"。\n```\n\n太棒了，我们的方法正在工作！\n\
    \n### 第 2 部分：创建对象\n\n现在是创建我们的对象构造函数 `LoanApp` 了。\n\n**以下是我们接下来要做的总结：**\n\n在 `LoanApp`\
    \ 对象构造函数中，`personName`、`income` 和 `loanAmount` 将被编写为 `input parameters`。这些参数将在实例化任何\
    \ `new object` `LoanApp` 应用时接收参数。\n\n在正体内部，我们将利用 `this` 占位符，使对象具有可移植性（可实例化）。\n\
    \n此外，还将声明私有变量：`bankBranch` 和 `approvalStatus`。\n\n然后，函数 `submit` 将被复制到对象中，但我们需要从当前的\
    \ submit 函数中移除参数，因为它们不再需要了。（原始文件链接在步骤 5 处）。\n\n**我们开始吧：**\n\n1- 声明对象构造函数：\n\n\
    ```javascript\nfunction LoanApp(personName, income, loanAmount){\n```\n\n2- 在单独的行中包含函数参数中列出的属性。不要忘记对每一个属性应用\
    \ `this`：\n\n```javascript\nthis.personName = personName;\nthis.income = income;\n\
    this.loanAmount = loanAmount;\n```\n\n3- 声明一个名为 `bankBranch` 的私有属性并分配一个位置：\n\n\
    ```javascript\nvar bankBranch = \"New York\"; // 我们稍后来看这个\n```\n\n4- 声明一个名为 `approvalStatus`\
    \ 的私有属性并赋值为字符串值 \"invalid\"：\n\n```javascript\nvar approvalStatus = \"invalid\"\
    ;\n```\n\n5- 最后复制方法 `submit`，但确保在前面加上 `this` 前缀，以便它可以应用于每个不同的对象实例化：\n\n```javascript\n\
    this.submit = function(){ etc...\n```\n\n// 在此 **[raw 文件](http://icontemp.com/joagi/scripts/pre2.txt)**\
    \ 上找到直到步骤 5 的完整脚本。\n\n[ icontemp.com/joagi/scripts/pre2.txt ]\n\n6- 测试：将对象脚本粘贴到控制台，查看它是否通过验证。修正任何错误。如果需要，查看上一步的原始文件。\n\
    \n7- 实例化一个对象。我的对象将是 `tony`，收入为 5000，贷款请求为 1000：\n\n```javascript\nvar tony = new\
    \ LoanApp(\"Tony\",5000,1000); // 通过通过！！\n```\n\n8- 调用对象 `tony`：`tony;` // 返回\
    \ `LoanApp {personName: \"Tony\", income: 5000, loanAmount: 1000, submit: function}`\n\
    \n9- **提交** `tony` 的申请：`tony.submit();` // 返回 \"Congratulations! Your application\
    \ for a loan of 1000 has been approved。\"\n\n10- 调用 `tony` 的 `approvalStatus`：`tony.approvalStatus;`\
    \ // 返回 undefined (\"Houston, we have a problem!\")\n\n如你所见，我们无法获取 `approvalStatus`，因为我们将其私有属性。从私有属性读取数据的唯一方法是创建一个中间读取方法，即\
    \ **getter**，你还记得吗？\n\n11- 让我们修改我们的对象构造函数以包含一个 `getApprovalStatus` 方法。尝试自己做，如果需要，查看\
    \ **[新原始文件](http://icontemp.com/joagi/scripts/pre3.txt)**。\n\n[ icontemp.com/joagi/scripts/pre3.txt\
    \ ]\n\n12- 将新的对象构造函数粘贴到控制台，通过重新实例化来**重置**对象 `tony`：\n\n```javascript\nvar tony\
    \ = new LoanApp(\"Tony\",5000,1000);\n```\n\n13- 获取 `tony` 的审批状态：\n\n```javascript\n\
    tony.getApprovalStatus(); // 仍然返回 “invalid”（为什么呢？）\n```\n\n结果是“invalid”是因为它还没有从原始状态改变。我们还没有**提交**申请。\n\
    \n14- 提交申请：\n\n```javascript\ntony.submit(); // 返回 \"Congratulations! Your application\
    \ for a loan of 1000 has been approved.\"\n```\n\n15- 验证 `tony` 的审批状态是否已更改：\n\n\
    ```javascript\ntony.getApprovalStatus(); // 返回 \"Approved\"。\n```\n\n***还有件事……***\n\
    \n我们还没有测试 `submit` 方法中的“**else**”。我们需要测试它以确保它确实有效。\n\n16- 为 Mary 创建另一个申请，并将其命名为\
    \ `mary`。她的收入也是 5000，但她想要 3000 的更大额贷款，这将延迟她的审批：\n\n```javascript\nvar mary = new\
    \ LoanApp(\"Mary\",5000,3000);\n```\n\n17- 提交她的申请：\n\n```javascript\nmary.submit();\
    \ // 返回 \"Thanks for submitting a loan application. We will contact you shortly.\"\
    \n```\n\n18- 经过了一段时间后，Mary 想要检查她的审批状态：\n\n```javascript\nmary.getApprovalStatus();\
    \ // 返回 \"On review\".\n```\n\n太棒了！！！！\n\n### 第 3 部分：自动评估\n\n让我们再剥开一点这个洋葱。***如果***我们想要在实例化新对象时提交申请并立即获得*状态变化*怎样？\n\
    \n#### 5.1.5 如何自动评估并调用方法\n\n**这是一个函数：**\n\n```javascript\nfunction ( ) { }\n```\n\
    \n**这是一个自调用的函数：**\n\n```javascript\nfunction () {}();\n```\n\n右侧的最后一对括号触发函数调用自己。\n\
    \n上面编写的函数将运行得良好。它会在程序启动时调用自己。但是，如果我们在（调用之前）将整个函数*封装*在括号中，那么在视觉上告诉另一个程序员该函数会调用自己将更显式。\n\
    \n像这样：\n\n```javascript\n(function( ){ })();\n```\n\n// 返回 function ( ) { }\n\n\
    **回到**我们的 `LoanApp` 对象，我们可以在 `submit` 方法上实现这种技术。这将使得方法在我们实例化一个新的 `LoanApp` 时立即运行，它将打印出状态*消息*并更新\
    \ `approvalStatus` 私有变量。\n\n下面的图片显示了额外的括号放在哪里，也可以获取整个脚本的原始文件：\n\n![](img/00079.jpeg)\n\
    \n图 79 [raw 文件](http://icontemp.com/joagi/scripts/pre4.txt)（完整）。\n\n"
- fmt: "\n1- Paste the new object constructor on the console and reset the object\
    \ `tony` from the last exercise, by re-instantiating it:\n\n```javascript\nvar\
    \ tony = new LoanApp(\"Tony\",5000,1000);\n```\n\nYou should be able to see the\
    \ approval message immediately after you instantiate the new applicant `tony`.\
    \ There is no need to manually submit the application as an extra step since the\
    \ `submit` function is called in automatically as soon as you instantiate an object.\n\
    \n2- Test the `approvalStatus` variable by calling in its getget method, to see\
    \ if that was also changed automatically:\n\n```javascript\ntony.getApprovalStatus();\
    \ // returns \"Approved\".\n```\n\nCongratulations! If you feel a bit confused\
    \ it is because we have covered a huge territory. As long as you understand what\
    \ is happening, you can proceed to the next step. If you still need to mend a\
    \ few concepts here and there, it may be a good idea to review this chapter now\
    \ since you have a broader view of what is being covered. *Repetition* is the\
    \ secret to learn JavaScript.\n\n## 5.1.6 Prototyping new methods\n\nWhat if we\
    \ want to add a new method to our `LoanApp` object?\n\nWe could go into the object\
    \ and hardwire the method like we did when we first created `LoanApp`. However,\
    \ many times this is not a convenient way to do it. Also, it is not a memory efficient\
    \ implementation because, if you recall from previous chapters, every time we\
    \ instantiate a *new* object, the constructor copies all the data which, when\
    \ it comes to methods, it is totally unnecessarily.\n\nWe could instead, just\
    \ point the new instance object to the original method, and use it when needed.\n\
    \nIt is best practice then, to add methods as separate prototype links. However,\
    \ if you prefer to encapsulate them inside the object as opposed to have them\
    \ separate, there are ways to do it and we will cover one of such implementations\
    \ soon, once we finish covering the proper way of doing it.\n\n**Question:** Based\
    \ on what was written above about memory efficiency, why did we include the methods\
    \ `submit` and `getApprovalStatus` inside the object `LoanApp`, and not outside?\
    \ Isn’t this a bad practice? Yes, it seems to be. The reason why we did it this\
    \ way was because we are using these methods as **getters** to access private\
    \ data. We can’t get private information by using outside methods. We always attempt\
    \ to code the most efficient way possible. Right now this is what we can do with\
    \ our `LoanApp`.\n\nFor the most part however, newly added methods will be created\
    \ separately.\n\n**Let’s add a new method to our LoanApp just for practicing purposes.**\n\
    \nOur boss comes in one day and asks us if there is a way to get a summary of\
    \ each individual applicant from the `LoanApp`. We reply that there isn’t one\
    \ yet, but we could implement such method in less than 5 minutes. She approves\
    \ it, and we go back to the drawing board.\n\nDo you still remember the syntax\
    \ from an earlier chapter? Let me remind you: we add a new method name to the\
    \ object prototype menu, in other words, we prototype it.\n\n1- Create a prototype\
    \ method named `summary` that returns an applicant’s name and the loan he/she\
    \ is applying for, see raw file on step 4 (**[raw file](http://icontemp.com/joagi/scripts/pre4.txt)**).\
    \ [ icontemp.com/joagi/scripts/pre4.txt ] `LoanApp.prototype.summary = function(){}`\n\
    \n2- In the body of the function write the following: `console.log(this.personName\
    \ + \" is applying for a loan of \" + this.loanAmount);`\n\n3- Don’t forget to\
    \ close the function: `}`\n\nLet’s test it before we show it to our boss:\n\n\
    4- Paste the `LoanApp` to the console: see (**[raw file](http://icontemp.com/joagi/scripts/pre4.txt)**).\
    \ [ icontemp.com/joagi/scripts/pre4.txt ]\n\n5- Paste the `summary` method afterwards.\
    \ ([raw file](http://icontemp.com/joagi/scripts/pre5.txt)). [ icontemp.com/joagi/scripts/pre5.txt\
    \ ]\n\n6- Instantiate a new applicant: \n\n```javascript\nvar tony = new LoanApp(\"\
    Tony\", 5000, 1000);\n```\n\n7- Test the new method:\n\n```javascript\ntony.summary();\
    \ // returns \"Tony is applying for a loan of 1000\".\n```\n\nGo ahead and show\
    \ it to your boss!\n\nWe had previously covered method prototyping earlier when\
    \ we created a job application. It may be a good time to review that section because\
    \ it might make more sense now.\n\nHere’s the link: *3.1.8 Functions as Object\
    \ Constructors*.\n\n## 5.1.7 Objects that inherit from other objects\n\nSometimes\
    \ we want to create an object with a certain functionality that already exists\
    \ in another object. JavaScript allows us to inherit functionality from other\
    \ objects avoiding repetition.\n\nThere are several ways to implement such inheritance,\
    \ each one of them with its quirks. I will cover the ones I believe to be best\
    \ practices. Let’s do discuss them as by creating a new application:\n\nThe branch\
    \ manager from Los Angeles calls the programmer in New York and praises him for\
    \ the work he did with the `LoanApp`. They want to be able to access an application\
    \ from Los Angeles under their own branch name, and they wanted to be sure the\
    \ app is independent from the New York application in case they decide to add\
    \ more functionality to it. The Los Angeles branch also wanted an additional method\
    \ to print the branch location since they noticed the existing application does\
    \ not provide such information to the public.\n\nWe decided to reuse the object\
    \ `LoanApp` to save time and resources by just making a few changes to the new\
    \ object constructor as follows:\n\n*   New application name is `LoanApp2`.\n\
    *   `bankBranch` is `Los Angeles`.\n*   The additional method is `getBankBranch`.\n\
    \nWe are going to use a technique called object **masquerading**.\n\n![](images/00080.jpeg)\n\
    \nFigure 80 (raw file on next picture).\n\nLet’s do it!\n\n1- New object declaration:\n\
    \n```javascript\nfunction LoanApp2(personName, income, loanAmount){\n```\n\n2-\
    \ Assign inheritance from `LoanApp` to `LoanApp2`, via a temporary variable `x`\
    \ ( I have chosen `x` to make this clear: the name does not matter but in real\
    \ life this variable should have a more illustrative name):\n\n```javascript\n\
    this.x = LoanApp; // here x inherits all of LoanApp.\n```\n\n3- Next choose which\
    \ properties will need to inherit methods from `LoanApp`, using `x` as a conduit:\n\
    \n```javascript\nthis.x(personName, income, loanAmount);\n```\n\nThe inheritance\
    \ has been established, JavaScript has taken note, and we don’t need the *temp*\
    \ variable `x` anymore because we want to have a “disconnect” from one object\
    \ to the other. Do you remember the kite held by boy and girl? and closures? Now\
    \ that JavaScript knows `loanApp2` has a connection with the properties and methods\
    \ of `loanApp`, we can safely “return” or delete `loanApp` and still keep the\
    \ goodies to be used on `loanApp2`.\n\nHere we introduce a new keyword: `delete`.\
    \ The `delete` operator removes a property from an object. The syntax is `delete\
    \ object.property`, delete does not affect regular variables or functions, just\
    \ objects.\n\n4- Delete `x`:\n\n```javascript\ndelete this.x;\n```\n\nNow we can\
    \ add newer functionality. The reason to do it *after* we deleted `x` is to prevent\
    \ any overwriting from `loanApp1` to `loanApp2` when we first introduced inheritance:\n\
    \n5- Add the new branch name:\n\n```javascript\nvar bankBranch = \"Los Ageles\"\
