    \ icontemp.com/joagi/scripts/72.txt ]\n\nNow if we print object `y` we get a copy\
    \ of the above image. Our favorite fruits, vegetables and grains are there, but\
    \ we can’t read them nor edit them directly because we have no access to the function\
    \ variables.\n\nTry `y.Fruits;` // returns *undefined*\n\nWe have made our object\
    \ properties private; too private for our own sake! We want [encapsulation](http://en.wikipedia.org/wiki/Encapsulation_%28object-oriented_programming%29)\
    \ but we don’t want to feel claustrophobic.\n\nSince our object is now **encapsulated**\
    \ (remember this term), we need to create a method to read our properties from\
    \ the outside.\n\n### How do we expose the data of a private variable from inside\
    \ of a function?\n\nWe expose a `var scoped property` by creating an `inner function`\
    \ that returns the data. We have done it before, remember? Do you remember *closures*,\
    \ and the balloon with two strings? Inner functions have access to the outer function\
    \ data and can use it or display it to the outside world acting as agents like\
    \ [tellers](http://en.wikipedia.org/wiki/Bank_teller) in a bank.\n\n#### 5.1.2\
    \ Accessor methods\n\nStudy the `inner function` on line 6 below, and read the\
