    ## 2.2.4 sort()


    In the method `sort()`, the sorting order is done alphabetically by default, or
    from `a` to `z`. However, alphabetical sorting doesn’t work with numbers since,
    for example, 20 comes before 3. This is because the number is converted to string
    before being sorted and therefore the first digit to the left is the one being
    sorted accordingly. To get a true numerical sort we should be more specific and
    let JavaScript know about it. This alphabetical sorting happens even if all items
    are numeric due to String [casting](http://en.wikipedia.org/wiki/Programming_language#Type_system).


    1- Let’s test it using the following array, `var x = ["red", "white", "blue",
    35, 24];`


    `x.sort();` // returns [24, 35, "blue", "red", "white"].


    Because JavaScript knows that sorting can become problematic, JavaScript allows
    passing in a comparison function as a parameter in the `sort()` parentheses. This
    function is an example of a *callback function*. It is named callback because
    JS is calling back a function that you have provided earlier. (See the function
    in the image below).


    The method `sort()` processes your `callback function` which is comparing every
    two items of the array and making a decision. Then it compares the item placed
    `last` with the `next` item on the array, and so on.


    This is the selection criteria:


    When the result of the function comparison (`subtraction`) is a `negative number`,
    the first item goes `before` the second item being compared (no switch is made).
    When a result is `zero`, both items are `equal` and no changes in sorting will
    happen. When a result is a `positive` number, the `first` item switches with the
    second item making this last one first.


    2- Let’s declare a numeric array to see how this works:


    `var numA = [5,8,1,3,20];` // normally, 20 would display before 3.


    3- Copy the following function to your editor then paste it on your console;


    ![](images/00019.jpeg)


    Figure 19 [raw file](http://icontemp.com/joagi/scripts/6.txt).[ icontemp.com/joagi/scripts/6.txt
    ]


    We will *pass* the function `compareMe` into the `sort()` method. This will *trigger*
    JavaScript to *take notice of* the result of each array element as it passes through
    the function. Then a decision is made to place the item accordingly. When `num1`
    is lower than `num2`, the result is `negative`. If they are `equal`, the result
    is `zero`. When `num1` is `higher` than `num2`, the result is `positive`. JavaScript
    will sort according to its `internal table`. The function has nothing to do with
    this decision; the function just helps the decision making by providing a result
    of its calculation. The `sort()` mechanism does the rest. This function acts like
    a filter that gives a rank to each item before the numbers are sorted.


    4- Now we can sort numbers correctly:


    `numA.sort(compareMe);` // returns [1, 3, 5, 8, 20].


    5- What if we want the sort reversed?


    `numA.sort(compareMe).reverse();` // returns [20, 8, 5, 3, 1].


    Since `sort()` allows us to use a callback function, we could also use it with
    string arrays to sort by, for example, *word length*. For that, instead of `num1
    – num2`, we would use `paran1.length – paran2.length`. (the name “paran” is my
    invention. You can call it anything).


    Here’s a sample script for future reference. Note how this script efficiently
    uses a built in anonymous function as a callback:


    ![](images/00020.jpeg)


    Figure 20 [raw file](http://icontemp.com/joagi/scripts/19.txt).[ icontemp.com/joagi/scripts/19.txt
    ]


    For more information, please refer to the following ECMASCRIPT 5 page: [15.4.4.11
    Array.prototype.sort](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.11)


    ## 2.2.5 pop() and push()


    The array method `pop()` *pops out* the `last element` of an array AND it *decrements*
    the array length by one since one goes along with the other.


    1- Create our fruity array `abc` again (or copy it from this [raw file](http://icontemp.com/joagi/scripts/225.txt)):
    [ icontemp.com/joagi/scripts/225.txt ]


    `var abc =["apples","bananas","blue","grapes","red","white"];e`


    2- Call the array to the console: `abc;` // results ["apples", "bananas", "blue",
    "grapes", "red", "white"].


    3- Remove the last item: `abc.pop();` // removes "white".


    4- Call the array: `abc;` // results ["apples", "bananas", "blue", "grapes", "red"].


    The “white” element is **gone forever** unless we bring it back with `push()`:


    The array method `push()` inserts an element into the last location.


    5- Reinsert the last item: `abc.push("white");` // returns 6. Six is the number
    of elements.


    6- Call abc again: `abc;` // results in ["apples", "bananas", "blue", "grapes",
    "red", "white"].


    The last element *white* is back again and on the last location since push adds
    elements to the end of the array.


    In a sense the array is acting like a stack restricting the insertion and removable
    of items in a last-in-first-out fashion. `pop()` and `push()` are useful to insert
    and remove items without having to refer to their specific position. We always
    know that the action happens at the end of the array.


    7- We could `push()` **multiple items** ( manually or in a loop):


    `abc.push("peaches","cherries", "apricots");`


    8- Now `abc` has 9 items:


    `abc;` // returns ["apples", "bananas", "blue", "grapes", "red", "white", "peaches",
    "cherries", "apricots"].


    Let’s remove them again with `pop()` **ah, but wait!!!** Although `push()` can
    add several items at once, `pop()` can only remove one at a time. We would have
    to *manually* `pop()` out three times, right? Of course we could also [create
    a loop](http://icontemp.com/joagi/scripts/225a.txt) and pop all items from the
    array, but be careful not to go below the array’s total length because you will
    get an error if the loop goes below zero.


    9- Just for practice let’s do it manually three times. This will bring our `abc`
    array to its original status. On the first time I will unsuccessfully attempt
    to pop() all of them at once:


    `abc.pop("peaches","cherries", "apricots");` // it removed only “apricots”. It
    ignored the other two elements so we will have to remove the others one by one:
    `abc.pop();` // removed “cherries”. `abc.pop();` // removed “peaches”. We should
    now be back to the original array’s length: `abc;` // returns ["apples", "bananas",
    "blue", "grapes", "red", "white"]


    **NOTE:** Although we should know about `pop()` because it is used in many scripts,
    we could have used `splice()` such as `abc.splice(-3,3);` `splice` has several
    customized options which could come very handy. (`splice()` will be covered further
    down in this chapter).


    For more information, please refer to the following ECMASCRIPT 5 page:


    · [15.4.4.6 Array.prototype.pop ( )](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.6)


    · [15.4.4.7 Array.prototype.push](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.7)


    ## 2.2.6 shift() and unshift()


    The methods `shift()` and `unshift()` are similar to `pop()` and `push()`, but
    instead of acting on the last element, they perform on the **first element of
    the array**.


    Think of an array as a [Pez](http://en.wikipedia.org/wiki/Pez_Candy) dispenser
    for candy. When we insert a candy into the top of the dispenser we need to push
    it in. When we remove a piece of candy we pop it. On the other hand, when we insert
    a piece to the bottom of it we need to unshift the others up one slot, their positions
    are moved from their original location by one, so they lose location “rank”. If
    we remove a piece of candy from the bottom the others get shifted by falling downward,
    their rank location gets promoted.

