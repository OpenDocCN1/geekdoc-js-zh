    \ ]\n\nCall the game a couple of times with a number argument from 1 to 5 like\
    \ for example: **game(3);** // returns “human wins!” Or “machines wins”.\n\nYou\
    \ could improve the game by giving points to lower numbers and taking points when\
    \ a human uses the highest number, or preventing the usage of the highest number\
    \ more than once, and many more possibilities. That of course would takes us out\
    \ of this topic.\n\n**Moving along…**\n\n**Math.round( )**.\n\nSince **Math.floor**\
    \ always rounds down and **Math.ceil** always rounds up, we need another method\
    \ to round up **or** down *based on the value given*.\n\nFor that JavaScript has\
    \ **Math.round( )**. Not to confuse with *math.random()*.\n\n**Math.round( )**\
    \ rounds it up if the value >= **.**5 or down if the value is less than half.\n\
    \n4.1.2 Math.max( ) and Math.min( )\n\nThe **Math.max( )** returns the largest\
    \ number from a list of given parameters:\n\n**Math.max(6,9,23,57,3);** // returns\
    \ 57\n\n**Math.max(5,10);** // returns 10\n\n**Math.max(-5,-10);** // returns\
    \ -5\n\nWe could **fetch max from an array** by using **apply( )**\n\n(remember,\
    \ *apply()* takes an array as the second argument):\n\nCode the following array\
    \ **x**: **var x = [3,6,9,1];**\n\n**Math.max.apply(null,x);** // returns 9\\\
    .\n\n**Null** took the place of the **window** object, since *x* is an array under\
    \ the *window* object and ‘this’ points to *window*. We could have written (**null**,\
    \ x), (**window**, x), (**x**,x), or even (“tony”,x). The result would have been\
    \ the same. The important thing to realize here is that we had to include a first\
    \ parameter so that our second parameter was recognized as a second parameter\
    \ and not as a “this” parameter. In case you’re wondering why “tony” is in quotes,\
    \ it is because there is no variable named tony in our execution context and without\
    \ quotes JS would have thrown an error. In this script we are not taking advantage\
    \ of the first parameter, so anything would do. Our target is the second parameter.\n\
    \nThe opposite of max is **min**:\n\n**Math.min(6,9,23,57,3);** // returns 3.\n\
    \n**Math.min.apply(null,x);** // returns 1 ( from our previous x array)\n\nThese\
    \ methods are very handy. They can replace quite a bit of code.\n\nTake for example\
    \ the **loop script** on the next figure that iterates over an array in order\
    \ to choose the largest value:\n\n![](images/00071.jpeg)\n\nFigure 71 [raw file](http://icontemp.com/joagi/scripts/69.txt).[\
    \ icontemp.com/joagi/scripts/69.txt ]\n\nWe can simplify it by using Math.max\
    \ in conjunction with apply( ). The following script replaces the above loop mechanism\
    \ (lines 4 through 8), applying the **max** (or largest) to the variable **largest**:\n\
    \n**largest = Math.max.apply(null,*array*);** // returns 75.\n\nWe could even\
    \ eliminate line 2 if we declare the variable largest at the same time we assign\
    \ Math.max to it. That’s six less lines of code and a drastic reduction of possible\
    \ syntax errors. Another advantage is that JavaScript library methods are written\
    \ internally  in a language closer to machine which makes them much more productive\
    \ in terms of execution speed.\n\n  4.1.3 Math.pow( ), Math.sqrt( ), Math.abs(\
    \ )\n\n**Math.pow(** *base***,** *exponent* **)** returns a number based on its\
    \ exponent:\n\n**Math.pow(2,2);** // returns 4.\n\nAs of (2 x 2 = 4).\n\n**Math.pow(2,3);**\
    \ // returns 8.\n\nAs of (2 x 2 x 2 = 8).\n\n**Math.sqrt(**num**)** returns the\
    \ square root of a number:\n\n**Math.sqrt(9);** // returns 3.\n\n**Math.abs(**num**)**\
    \ returns the absolute value of a number:\n\n**Math.abs(-2);** // returns 2.\n\
    \n**Math.abs(null);** // returns 0.\n\n## 4.1.3 Math constants, PI\n\n**Math.pi(\
    \ )** returns the constant of **3.14159**, which is the ratio of the circumference\
    \ of a circle to its diameter.\n\nAn example of where **PI** could be used is\
    \ when calculating the area of a circle: **var area = Math.PI * radius * radius;**\n\
    \nIn the example above all we need to know is the radius. PI is given automatically\
    \ by JavaScript.\n\nif  **var radius = 10;** the area will be calculated to 314.159...\n\
    \n## 4.1.4 Useful Math Object references\n\n· [Mozzila Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math).-\
    \ A full list of Math’s constants and methods.\n\n· [Sylvester](http://sylvester.jcoglan.com/)\
    \ - a math JavaScript library for vectors, matrix and geometry.\n\n· [Accounting.js](http://jster.net/library/accounting-js)\
    \ - library for number, money and currency formatting.\n\n· [Numeral.js](http://jster.net/library/numeral-js)\
    \ - currency, percentages, time, and more.\n\n· [JSter](http://jster.net/category/math-libraries)\
    \ - a catalog of front end JavaScript libraries.\n\nThis is a draft of what is\
    \ coming in the near future if you are looking ahead:\n\n[ECMAScript Language\
    \ Specification 6th Edition (ECMA-262)](http://people.mozilla.org/~jorendorff/es6-draft.html#sec-math-object).\n\
    \n# 4.2 The Date Object\n\n**Date();** // by itself will return today’s complete\
    \ date, like for example:\n\n\"Wed May 28 2014 17:37:21 GMT-0400 (Eastern Daylight\
    \ Time)\"\n\nWe can also use Date**.now()**; // returns in milliseconds the date\
    \ it was executed.\n\n1401313102975.\n\nUsing the above **Date( )** returns a\
    \ complete **object**, and it can be used at any time. However, contrary to the\
    \ Math object which is *static* and readily available, in order to use the functionality\
    \ from the Date object’s library, one needs to create an instance of the object,\
    \ and then call the different methods from there.\n\nLet’s create an instance\
    \ of the object Date.\n\n## 4.2.1 Creating a working Date object instance\n\n\
    We create an instance of Date with the **new** keyword.\n\nExample:\n\nvar **sampleDate\
    \ = new Date**; \n\n// try it on your console.\n\nOnce we have an instance of\
    \ the object  **Date** we can use it as an *interface* in order to access Date\
    \ methods from JavaScript library:\n\nsampleDate**.getDate()**; // returns today’s\
    \ monthly day. Example: 28, if today is the 28^(th) day of the month.\n\n sampleDate**.getDay()**;\
    \ // returns the day of the week. *0* being Sunday and *6* being Saturday."
