    在书中，作者使用了 Google Chrome 的 JavaScript 控制台，以及 `Opera` 和 `Epic`。


    在浏览器中，我们可以通过点击访问控制台：

    - Windows 用户使用 `CTRL+SHIFT+j`

    - Mac 用户使用 `CMD+OPT+j`


    当你第一次打开它时，点击左下角的方形按钮来**分离控制台**。这里有一个[Chrome 开发者工具快捷键列表](https://developers.google.com/chrome-developer-tools/docs/shortcuts)。你可以从[源](https://www.google.com/intl/en/chrome/browser/)
    下载 Google Chrome。作为替代，[Opera](http://www.opera.com/) 和 [Epic](https://www.epicbrowser.com/)
    的工作原理相同。只要你知道如何访问其 JavaScript 控制台，请随时使用你喜欢的浏览器。


    如果你需要一个在线编辑器作为草稿本，可以使用 [EditPad](http://www.editpad.org/) 或许多其他替代。**更新：** [jsbeautifier.org](http://jsbeautifier.org/)
    也可以作为编辑器，其优点是在复制代码之前对其进行美化。我每天都用它来纠正学生提交的脚本。


    书中不需要记忆任何内容。


    请遵循每章中讨论的练习说明。重复示例是掌握所学课题的关键。


    每个主题都非常*简短*且直击要点。许多主题将根据需要重复，并在第二次出现时提供进一步解释。***洋葱是层层剥开的***。


    为了方便，书中还会提供外部链接引用。指向标准 ECMA-262 的链接直接指向正在讨论的主题。有时链接会带我们进入首页而不是正确的主题。由于 ECMA 网站的某些异常行为。通常情况下，如果你点击第二次，它就会直接进入正确的位置。


    “*虚怀若，从头开始*”，就像每一位黑带武术大师每天做的那样。


    # 第一部分：启蒙之门


    意识赋能


    ## 1.1 原型与基于类


    由于 JavaScript 的核心在于*创建*和*销毁*对象，因此理解 JavaScript 对象的本质是掌握 JavaScript 最重要的步骤。


    让我们从后门重新回到 JavaScript，尽管这是最不常用的路径。


    JavaScript 是一种**基于原型的**面向对象语言。它不是一种基于类的对象语言。


    基于原型的和基于类的语言有一个共同的目的：共享代码并避免冗余。


    在基于类的语言中，程序员创建一个蓝图（类），然后根据这种*图纸*构建对象。


    在基于原型的语言中，程序员创建一个对象，并允许它成为创建其他对象的原型。就像类范式中一样，这种技术避免了代码的重复并节省了内存。从这里开始，所有关于类的理论都开始淡化。此外，由于对象允许以分级的方式链接，代码可以被重用，形成一条**原型链**。当一个对象需要某个工具（方法）时，它会沿着链向上寻找，直到从它的某个祖先（父级或祖父级）那里获取。


    这种无类的语言模型也称为*基于实例的*或**面向原型的编程**，它的工作原理是一种*委托*过程，即一个对象依赖另一个对象来提供一组特定的功能。它之所以有效，是因为
    JavaScript 依赖其实时环境来施展魔法。就像河流中的水，第二次出现时永远是同一个。


    仅仅因为 JavaScript 可以通过原型模拟许多流行的类特性，并不意味着它是一种基于类的语言。曾有人说“*熟悉会消除崇拜的棱角*”。让我们按照 JavaScript
    的质本身来欣赏它，而不是根据它的样子。


    原型代码与基于类的语言相比是否有优势？


    在整书中，你将找到进一步阅读的有用参考链接。这是我们来自[维基百科](http://en.wikipedia.org/wiki/Prototype-based_programming)的第一个链接。在页面中间你会发现一个名为“批评”的主题，它可能会引导你朝着正确的方向找到这个问题的答案。


    ## 1.2 内存概念


    内存管理或*管理计算机内存*的行为被定义为根据*程序*请求动态分配部分内存的方法。它也是在数据不再需要时释放内存以供再次使用的行为（这一任务**由浏览器完成**）。


    执行*线程***是**可以独立管理的最小程序化指令序列。多个线程可以在同一个进程中共存并共享相同的内存区域。


    通常来说，我们可以将内存**划分为**两个不同的区域：**栈（stack）**和**堆（heap）**。


    **栈**是一个**受限**的数据结构。在其中只能执行少数操作。通常，这些数据指向*堆*上更大的数据。例如，指向对象的变量。


    当这些操作完成时，数据会被**自动清除**，为下一批数据留出空间。在某种程度上，栈充当了内存操作的***草稿本***，在大多数情况下，**栈**中只居住**指针**（变量名）等*快速数据*。


    ***堆***是完全不同的事情。首先，在堆中，数据不像栈中那样整齐，数据块可以被[随地](http://en.wikipedia.org/wiki/Ad_hoc)存储，因为在堆中，如果一段数据变大，可以根据需要分配内存。这使得堆比栈慢。栈内存更快，是因为在栈中，每个数据集在严格管理下都有特定的大小。


    ![](img/00001.jpeg)


    图 1 一图胜于万言


    在 **JavaScript** 中，**基本类型值**存储在**栈**中，**引用类型值**存储在**堆**中。记住“**引用类型**”，我们将经常讨论它。


    通常来说，引用是被其他东西所引用的东西，如果没有引用者，就没有引用。在上面的图片中，当你取消从*栈*中的 **y** 到*堆*中对象的链接时，该对象就会消失，正如我们稍后更详细地看到的那样。


    不要尝试*记忆*所有这些信息。只需阅读并**理解它**，因为在剥开 JavaScript *洋葱*的过程中，我们会不断增加细节并反复提到它。


    在 JavaScript 中，**基本类型值**被定义为 **Number**、**Boolean**、**String**、**Null** 和 **Undefined**。由于这些是*简单值*，在
    JavaScript 中它们直接存储在**变量**（栈）所占据的位置：它们是合一的。对于其他类型的数据，**变量无非是*标签***或*符号*，指向*堆*中更大的内容。


    **引用类型值**就是前段落中提到的那些“*堆中更大的内容值*”。它们的*变量名*存储在*栈*中（作为指向堆中真实数据的**指针**）。


    说到*基本类型*，**Undefined** 类型被分配给任何没有特定值的*声明*变量。未定义的变量没有**length 属性（属性）**，因为恰好只有*一个*值（称为
    *undefined*），所以长度属性将是没用的，而且是又一个挂在内存藤蔓上的负担。


    **Null** 另一方面通常是*对象*的*占位符*，它在 JavaScript 中被认为是基本类型是因为早期 ECMAScript 标准的一个错误。由于历史原因，它仍然是一个基本类型。它也恰好只有*一个*值，*null*。在上一张图中可以说变量
    ***y*** 的值为 null。值为 *null* 的变量最终会从内存中擦除（稍后会详细介绍）。


    '
- fmt: '

    The `Boolean` type represents a logical entity having `two` values, called `true`
    and `false`.


    The `String` Primitive type is a strange one! Normally in other languages Strings
    are considered a `Reference type` but in JavaScript the string is a `Primitive`
    type.


    As we know Strings can vary in size so in JavaScript, when you add words to a
    string, the current string is replaced by another string containing the newly
    added data. Since the variable and its data is one in the same when it comes to
    primitive values, the whole variable is replaced when we modify the string. This
    replacement happens because of the memory size necessary to accommodate the new
    data. The replacement happens in the background and we never notice the difference.


    A string value can store 0 or more characters and each character is represented
    by a 16-bit positive integer. The first position is numbered zero. Therefore,
    in a string “Tony”, the `position` of the `last character` is the length of “Tony”
    `minus 1` since it starts at zero. When a string contains actual textual data,
    each element is considered a single UTF-16 [code unit](http://en.wikipedia.org/wiki/Code_point).


    In short, (this will be demonstrated later) JavaScript strings are actually stored
    in the stack because they are primitives. If the string expands, `a new string
    replaces the old string` and the old `data` is discarded.


    ## 1.3 Variables vs. Reference Types


    I’m aware we didn’t introduce the `Number` primitive type yet. Numbers will be
    covered in more detail as we go along. Basically, primitive types are types provided
    by the system. The `Number` type, along with text (String type) and Booleans are
    `the primitives` in JavaScript.


    `Numbers, Strings, Booleans =>` JavaScript primitives.


    As for reference types, here we are talking about `object definitions`. Other
    languages use classes. Classes are not used in the [ECMAScript](https://en.wikipedia.org/wiki/ECMAScript)
    Standard. ECMAScript is the name of the scripting language standardized in `ECMA-262`.
    JavaScript is the combination of this standard plus the `environment` where it
    is used (such as the `browser`).


    In `JavaScript` there is an object we could call the `Global Object`. This is
    the prototype (the `template`) for which every other object created will `inherit
    standard properties`.


    The Global Object is [mutant](http://en.wikipedia.org/wiki/Mutant): it actually
    takes a different life depending where we use ECMAScript. When ECMAScript mixes
    in with a computer browser, the `Global Object` becomes the `Window Object` and
    that’s how we address it (discussed later).


    So if we declare `tony` as an `Object`:


    ```javascript

    var tony = new Object();

    ```


    We are giving the variable `tony` `predefined tools to use`. I mean, `tony` `inherits
    a standard number of properties and methods` from the `JavaScript internal library`,
    tools which are included with the `built in` Object "prototype".


    So what exactly is this new object (`tony`) inheriting from the Object standard
    template?


    ### 1. Object Properties


    Once `declared as an object`, our new object `tony` “inherits by pointing to”
    `properties` such as:


    (No need to memorize. We will cover this subject naturally along the way. Just
    understand it.)


    **A) Constructor** – A “formula” for creating similar `future` objects via the
    `new` operator. A constructor is a reference to a function. If you need to create
    instances of an object, a constructor can be used as a script which serves as
    an interface with rules of `what can` and cannot `be allowed` on the new object
    to be. This simplifies conception and it saves memory because all objects can
    feed from its source (the present source), and we only have to code this source
    once, independently of how many object instances there are. An `inherited` constructor
    is a `pointer to source`, and it is not necessary for the functionality of the
    object already constructed. It serves only to give to a `future` object, the right
    to be born and exist via the constructor `umbilical` cord. A constructor takes
    advantage of the `hidden` parameter called `this`, a generic `placeholder` that
    will represent the object being processed. In the English language we use the
    pronoun “whose”. As in whose, in JavaScript and other languages we use `this`
    to create a similar result. “This” meaning “this instance of the last object in
    scope”, or the object we mean to represent here and now. More about “this” later.


    **B) Prototype** – Another inherited property is `Prototype` which is a built-in
    interface. `Prototype` acts as an `umbilical cord` or pipeline for an object to
    inherit properties and methods from a parent object. ‘Protos” or parent, is the
    source from which the current object inherits properties/methods from another
    object somewhere above in the chain. The usefulness of this link goes beyond the
    current object itself as other objects of a lower hierarchy may also inherit traits
    from their grandparent. Like the constructor, the prototype link is used only
    in retrieval. It has no effect on updating prototypes. This means that any change
    in the current object does not change its prototype or parent source. We can also
    think of prototype as a list of all methods the object is authorized to use. Every
    new instance of the object inherits this list. We will do some lab work on prototypes
    later.


    **![](images/00002.jpeg)**

    Figure 2


    Don’t think of JavaScript in terms of `inheriting` properties and methods. Think
    of it in terms of `interfaces`. Some objects have methods. These methods can be
    interfaced with other objects down the pipeline and the other objects can used
    them to create their own functionality which may or may not be similar to the
    parent object.


    ### 2- Object Methods


    As for `inherited methods`, (our example object `tony`) inherits “by pointing
    to” `methods` from its parent object, the “Object” object,*


    (No need to memorize. We will cover this subject naturally along the way. Just
    understand it.)


    **a) hasOwnProperty**– (look at `hasOwnProperty` as a question where JavaScript
    provides a result as an answer). This method does `not` check `up` or `down` the
    chain of inheritance. It only verifies if the object in question has created `its
    own` properties (for example property ‘writer’: does `object_name.hasOwnProperty(''writer'');`
    ? returns true `if` it exists `and if` it has been created, not inherited from
    up the chain).


    Does `tony.hasOwnProperty("toString");`? Returns `false` because it belongs to
    its parent object. Note: We will try this on the console soon.


    **b) isPrototypeOf**- The `isPrototypeOf` method allows us to check if an object
    feeds its `magic` directly from another object. We need to include the term “prototype”
    in order to use this method. In other words, “`ObjectOne.isPrototypeOf(ObjectTwo)`”
    will not work because JavaScript does not know what exactly we mean by that command.
    We need to be more specific and write it this way: `ObjectOne.prototype.isPrototypeOf(ObjectTwo);`
    ? It returns true if `objectOne` is the `prototype` of `objectTwo`. This is the
    same as saying that `objectTwo` was modeled from `objectOne`. “Modeling from”
    saves memory because whatever properties `objectOne` already have, will not be
    recreated when instantiating-objectTwo since they already exist (Note: we will
    see later that it all depends how we code our scripts).


    **c) propertyIsEnumerable** - This method is used to determine whether the specified
    property in an object, is `visible enough` (listed) to be enumerated in a script
    such as for...in loop. `It actually lists the object own properties` because own
    properties can be enumerated, but all inherited properties are not in the `enumerable`
    list and will not appear on a for...in loop.

