  trans: "\n\n请注意这些方法是如何使用`[驼峰命名](http://en.wikipedia.org/wiki/CamelCase)`语法的。\n\n\
    欲更多信息，请参考以下 ECMASCRIPT 5 页面：\n\n- [15.5.4.7 String.prototype.indexOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.7).\n\
    - [15.5.4.8 String.prototype.lastIndexOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.8).\n\
    \n## 2.1.6 match()\n\n该方法在字符串中搜索与`regular expression`匹配的内容，并将所有匹配项作为`Array`返回。\n\
    \n示例脚本：\n\n```javascript\nvar xyz = \"Apples and bananas are delicious\";\nxyz.match(/n/g);\
    \ \n// 返回 [\"n  \", \"n  \", \"n  \"]\n```\n\n符号 `/ /` 隔定了我们要搜索的表达式。`g` 表示这是一个`global`搜索，意味着我们希望\
    \ JavaScript 返回所有找到的结果，而不仅仅是第一个结果。\n\n更多示例：\n\n```javascript\nxyz.match(/banana/g);\
    \ // 返回 [\"banana\"]\n```\n\n我们可以将返回的数组赋值给变量。例如，在 \"Apples and bananas\" 中。\n\n\
    ```javascript\nvar fruits = xyz.match(/Apples and bananas/g); // 返回 [\"banana\"\
    ]\n```\n\n我们还可以将输出转换为`string` 而不是获取数组：\n\n```javascript\nvar fruits = xyz.match(/Apples\
    \ and bananas/g).toString();\n```\n\n调用 fruits：\n\n```javascript\nfruits; // 返回\
    \ \"Apples and bananas\":\n```\n\n正则表达式是一个超出本文当前版本范围的主题。\n\n有用参考：\n\n[Mozzila](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
    \ | [RegExr](http://gskinner.com/RegExr/) : 一个用于学习正则表达式的直观工具。\n\n欲更多信息，请参考以下 ECMASCRIPT\
    \ 5 页面：\n\n- [String.prototype.match (regexp)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.10).\n\
    \n## 2.1.7 replace()\n\n另一种搜索方法是 `replace()`，它在字符串中搜索特定值并返回一个`new string`，其中找到的值被第二个参数中指定的值所替换。我们也可以使用正则表达式进行搜索。\n\
    \n下面的示例脚本使用了我们之前的变量 `xyz` 将 delicious 替换为 tasty：\n\n```javascript\nxyz = xyz.replace(\"\
    delicious\",\"tasty\"); \n// 返回 “Apples and bananas are tasty”.\n```\n\n欲更多信息，请参考以下\
    \ ECMASCRIPT 5 页面：\n\n- [String.prototype.replace (searchValue, replaceValue)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.11).\n\
    \n## 2.1.8 search()\n\n`search()` 方法在未找到匹配项时返回负一 `(-1)`，如果找到匹配项，则返回`position number`。\n\
    \n1. 创建一个字符串变量：\n\n```javascript\nvar xyz = \"Apples and bananas are delicious\"\
    ;\n```\n\n2. 然后使用 `search()` 在字符串中查找一个单词：\n\n```javascript\nxyz.search(\"bananas\"\
    ); // 返回 11 (从 0 开始计数，包括空格 位于位置 11)。\n```\n\n3. 让我们尝试找到字符 ‘na’：\n\n```javascript\n\
    xyz.search(\"na\"); // 返回 13 (从 0 开始，n 位于位置 13)。\n```\n\n4. `search()` 默认是`case\
    \ sensitive`（区分大小写的）：\n\n```javascript\nxyz.search(\"A\"); // 返回位置 0\nxyz.search(\"\
    a\"); // 返回位置 7 (Apples...)\nxyz.search(/a/i); // 返回位置 0。这里使用了带有 \"i\" 标志的`regular\
    \ expression`，不区分大小写（`insensitive`）。\n```\n\n欲了解更多关于正则表达式的信息，请访问 Mozilla 的 [RegExp](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)。\n\
    \n欲更多信息，请参考以下 ECMASCRIPT 5 页面：\n\n- [15.5.4.12 String.prototype.search](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.12).\n\
    \n## 2.1.9 slice()\n\n`slice()` 方法从字符串中提取文本并返回一个`new string`。原始字符串的文本不会受到影响，除非方法应用于自身。我们必须将此切片赋值给另一个变量以便重用。该方法最多使用两个参数。第一个参数指示从哪里开始切片，第二个参数指示排除到哪个位置。\n\
    \n示例脚本：\n\n1. 声明一个变量：\n```javascript\nvar xpt = \"red,blue,black\";\n```\n\n2.\
    \ 将 \"blue\" 提取到另一个变量：\n\n```javascript\nvar xpt2 = xpt.slice(4,8);\n```\n\n3.\
    \ 调用 xpt2：\n```javascript\nxpt2; // 返回 “blue”，包含位置 4，排除位置 8（逗号）。\n```\n\n- **使用负数：**\
    \ 另一种方式，如果在第二个参数上应用负数，它的含义会改变：现在意味着从右侧开始`excluding`指定的字符数量。逗号和空格被视为字符。\n\n4. 示例：排除最后的颜色（包括逗号在左侧）：\n\
    \n```javascript\nvar xpt3 = xpt.slice(0,-6);\n```\n\n5. 调用变量：\n```javascript\n\
    xpt3; // 返回 “red, blue, white”。\n```\n换句话说，它包含了从位置零开始的所有字符，除了最后的 6 个。如果我们在左侧输入了其他数字，就可以排除某些字符。\n\
    \n- **仅使用一个参数：** 当使用单个正参数时，它代表包含的起始字符位置，延伸到结尾。\n\n6. 示例：\n\n```javascript\nvar\
    \ x = xpt.slice(3); // 返回 \",blue,white,black\"，意味着 \"red\" 被切掉了。\n```\n\n如果单个参数是负数，它具有相反的效果：它告诉\
    \ JavaScript 从右侧包含多少字符并排除所有其他。\n\n7. 示例：\n\n```javascript\nvar x = xpt.slice(-3);\
    \ // 返回 \"black\" 中的 \"ack\"。从右向左数 3 个字符并切掉所有其他。\n```\n\n8. 另一个示例。从 ecmascript\
    \ 中提取 \"e\"：\n\n```javascript\n\"ecmascript\".slice(1); // 返回 \"cmascript\"。\n\
    ```\n这实际上用于移除第一个字符并将其替换为另一个大写字符，我们稍后在介绍 `toUpperCase()` 时会看到。\n\n欲更多信息，请参考以下 ECMASCRIPT\
    \ 5 页面：\n\n- [15.5.4.13 String.prototype.slice](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.13).\n\
    \n## 2.1.10 split()\n\n`split()` 方法非常有用，让我们确保理解背后的机制。`split()` 将字符串转换为数组。`split()`\
    \ 的相反操作是 `join()`。数组将在下一个主题介绍。\n\n1. 示例，我们将声明一个用空格分隔（无逗号）的新变量：\n\n```javascript\n\
    var abc = \"green yellow red black\";\n```\n\n词汇：在计算机科学中，`delimiter`（分隔符）是标记`unit\
    \ of data`开始或结束的符号（或字符序列）。在下面的示例 1|2|3 中，分隔符是管道符号 `|`。在这里，“1, 2, 3, 4”的分隔符是逗号，依此类推。\n\
    \n分割字符串时我们首先需要确定的是，我们将使用什么作为`delimiter`来分离`units of data`。\n\n在我们的情况下，我们将使用单词之间的`blank\
    \ space`作为分隔符。这意味着`split()` 方法将获取两个分隔符之间的所有内容，创建一个包含切分数据的数组。\n\n2. 让我们用空格作为分隔符将变量\
    \ `abc` 分分成单独的单词，并将其放入新变量 `abc2` 中：\n\n```javascript\nvar abc2 = abc.split(\"\
    \ \");\n```\n\n3. 调用变量：\n\n```javascript\nabc2; // 返回 [\"green\", \"yellow\",\
    \ \"red\", \"black\"].\n```\n空格被消除，每个单词在新的数组中变得变得独立。\n\n"
- fmt: "\nRemember that the delimiter is not included in the new array. If we want\
    \ to split `abcdefg` using `\"d\"` as our delimiter, `\"d\"` will not be included,\
    \ and the new array will look like this: `[abc, efg]`. If you want to try it,\
    \ make sure to include `\"d\"` in quotes because it is a string. Example: \n\n\
    ```javascript\nvar y = x.split(\"d\");\n```\n\nThe method `split()` can use a\
    \ `second parameter`. The first is the `delimiter` (what separates on unit from\
    \ another), the second parameter is a `limiter` of how many units are to be included,\
    \ or in other words, the `length` of the array.\n\nLet’s try it:\n\n4- Declare\
    \ a variable: `var abc3 = abc.split(\" \",3);`\n\n5- Call `abc3`:\n\n```javascript\n\
    abc3; // returns [\"green\", \"yellow\", \"red\"], it left out “black”.\n```\n\
    \n6- What is the length of abc3?? `abc3.length;` // returns 3\n\n**Note:** When\
    \ using `split()` we must pass at least one argument which is the delimiter. If\
    \ we don’t pass the delimiter into the split function, the result will still be\
    \ an array but the number of items on the array will be one. So in a way, the\
    \ `split()` could be used as another way to `convert a string into an array` with\
    \ the `length` of one, but probably not a very used method for that matter.\n\n\
    Regular Expressions turn `split` into a very powerful method. Investing some time\
    \ to learn RegEx is a very rewarding time spent. Here’s another link about the\
    \ subject: [Wikipedia](http://en.wikipedia.org/wiki/Regular_expression).\n\n**For\
    \ more information, please refer to the following ECMASCRIPT 5 page:**\n\n- [15.5.4.14\
    \ String.prototype.split](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.14).\n\
    \n## 2.1.11 substr()\n\nThe substring method `substr()` is an alternative to the\
    \ `slice()` method. While the `slice()` method takes in a `start` index position\
    \ and an `end` index position, the `substr()` method takes in a `start` index\
    \ position and a number representing the length of items to be extracted.\n\n\
    Do not confuse `substr()` with `substring()`. The later has actually replaced\
    \ by `slice()`. We will talk about it in a moment.\n\n**When to use slice versus\
    \ when to use substr?**\n\nUse `slice()` when you know the position numbers of\
    \ the first character to be `included` and the position of the first character\
    \ to be `excluded`. Use `substr()` when you know the `length` in characters of\
    \ what needs to be extracted. With either method, you need to know the position\
    \ of the first character to be included.\n\nIn `substr()`, a `(4,9)` means that\
    \ the extraction starts at 4 (from zero and counting white space, which means\
    \ the 5^th character) and stops at 12 (inclusive), meaning the 13^th character,\
    \ which corresponds to `4 + 9`.\n\n**Sample code (same as the one used for slice):**\n\
    \n1- Declare a variable:\n\n```javascript\nvar xpt = \"red, blue, white, black\"\
    ;\n```\n\n2- Use the same script as the one used earlier for slice so that we\
    \ can see the difference:\n\n```javascript\nvar xpt2 = xpt.substr(4,9); \n// starts\
    \ at 4 from zero, making the space the first character, then it counts 9 to the\
    \ right, inclusively.\nxpt2; // returns \" blue, wh\". \n```\n\nIf you remember,\
    \ the same numbers `(4,9)` used earlier for slice gave us “blue”. With `slice\
    \ 4/9` meant starts at 4 (0 based) and excludes 9, giving us “blue”. Now, by using\
    \ `substr`, `(4, 9)` means starts at 4 (0 based) and it expands 9 characters to\
    \ the right, giving us “blue, wh”.\n\n**Note:** In `substr`, the second digit,\
    \ 9, is the number of characters to extract. In `slice`, the second digit, 9,\
    \ represents a `position` number, the first to be excluded.\n\n![](images/00014.jpeg)\n\
    \nFigure 14\n\n**For more information, please refer to the following ECMASCRIPT\
    \ 5 page:**\n\n- [String.prototype.substr (start, length)](http://www.ecma-international.org/ecma-262/5.1/#sec-B.2.3)\n\
    \nSubstr was not published with ecma-262. However it is now on Annex B (link above)\n\
    \n## 2.1.12 substr() vs substring()\n\nThis is where things get a bit confusing\
    \ since the names `substr` and `substring` look so much alike. In reality they\
    \ work differently in the sense that `substring has been replaced by slice`. \n\
    \nAt one time JavaScript developers wanted to implement negative numbers as the\
    \ means to count from the end of the string to a certain position. The trouble\
    \ was to be backwards compatible so they decided to come up with a different method\
    \ name which was `slice()` and kept the former name intact, `substring`.\n\nAside\
    \ from not accepting negative numbers, `substring` doesn’t care about the order\
    \ of parameters, which means that it always assumes the smaller number is first.\
    \ So when we code `(5,4)` it means `(4,5)`. The method `slice()` is more strict,\
    \ the order matters as it will not reverse the order by itself.\n\n**What to do?**\
    \ Use `slice()`. Be aware of `substring()`.\n\n**For more information, please\
    \ refer to the following ECMASCRIPT 5 page:**\n\n- [15.5.4.15 String.prototype.substring](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.15).\n\
    \n## 2.1.13 toLowerCase() and toUpperCase()\n\nThe method `toLowerCase()` outputs\
    \ a new string with only lower case. The method `toUpperCase()` outputs a new\
    \ string with only upper case.\n\n**Sample code:**\n\n1- Declare a variable:\n\
    \n```javascript\nvar txt = \"ECMASCRIPT\";\n```\n\n2- Convert to lower case:\n\
    \n```javascript\ntxt.toLowerCase(); // returns \"ecmascript\"\n```\n\n3- Convert\
    \ to upper case:\n\n```javascript\ntxt.toUpperCase(); // returns \"ECMASCRIPT\"\
    \n```\n\n4- Here’s one way capitalizing the first character:\n\n```javascript\n\
    txt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase(); // returns \"Ecmascript\"\
    \n```\n\n5- Or instead of `charAt` we could use array notation:\n\n```javascript\n\
    txt[0].toUpperCase() + txt.slice(1).toLowerCase(); // returns \"Ecmascript\"\n\
    ```\n\nDon’t forget that we can also use CSS to capitalize the first letter of\
    \ a paragraph:\n\n```css\np:first-letter { text-transform:capitalize; }\n```\n\
    \n**For more information, please refer to the following ECMASCRIPT 5 page:**\n\
    \n- [15.5.4.16 String.prototype.toLowerCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.16).\n\
    - [15.5.4.17 String.prototype.toUpperCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.17).\n\
    \n## 2.1.14 trim()\n\nThe `trim()` method was introduced by ECMAScript 5. It creates\
    \ a copy of a string cutting off all leading/trailing spaces. Since the original\
    \ remains the same, if we are cleaning up the original we need to assign it to\
    \ itself.\n\n**Sample code:**\n\n1- Declare a string with multiple leading and\
    \ trailing spaces:\n\n![](images/00015.jpeg)\n\nFigure 15 [raw file](http://icontemp.com/joagi/scripts/8.txt).\
    \ [ icontemp.com/joagi/scripts/8.txt ]\n\n2- Call the variable to see how the\
    \ string looks like:\n\n```javascript\nstr1; // returns test with multiple spaces\
    \ like the picture above, right?\n```\n\n3- Declare a second variable and assign\
    \ it to the trimmed version of `str1`:\n\n![](images/00016.jpeg)\n\nFigure 16\n\
    \n4- Call str2 to see how it looks:\n\n```javascript\nstr2; // returns “test”\
    \ all trimmed up, right?\n```\n\n5- Call str1 to see how it looks?\n\n```javascript\n\
    str1; // returns the original string with all the white space.\n```\n\nIn order\
    \ to clean up the original string we need to assign the variable to itself.\n\n\
    6- Like in the following picture:\n\n![](images/00017.jpeg)\n\nFigure 17\n\n7-\
    \ Now if you call str1 again, it will be all trimmed up with no white space around\
    \ it.\n\nThe method *trim()` may not be recognized by older browsers like *IE8*\
    \ and below. If this is a problem try using the jQuery version instead.\n"
