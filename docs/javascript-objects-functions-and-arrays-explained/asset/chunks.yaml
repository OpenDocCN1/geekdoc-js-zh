    \ points when a human uses the highest number, or preventing the usage of the\
    \ highest number more than once, and many more possibilities. That of course would\
    \ takes us out of this topic.\n\n## Moving along…\n\n`Math.round()`.\n\nSince\
    \ `Math.floor` always rounds down and `Math.ceil` always rounds up, we need another\
