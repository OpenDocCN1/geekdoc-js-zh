    ## 3.2.1 apply( and call(()


    Sometimes we want to call in an object that is not the object owning our function
    in the current execution environment, and since “`this`” refers to the object
    under which the calling script belongs to at the time of calling, it will prevent
    us from addressing our intended target since it is not the object currently pointing
    at the script. That’s when the methods `call()` or `apply()` become useful. These
    two mechanisms from the JavaScript library allow us to borough methods from other
    objects, without having to rewrite them again. It is like **importing** from an
    external source to the current execution environment and à la carte (which is
    the opposite of [table d''hôte](http://en.wikipedia.org/wiki/Table_d%27h%C3%B4te)).


    The way I visualize `call()` is by keeping in mind one of the meanings of the
    term *call* which is “refer to”, or “consider to be”, “apply to”. The same goes
    for `apply()`.


