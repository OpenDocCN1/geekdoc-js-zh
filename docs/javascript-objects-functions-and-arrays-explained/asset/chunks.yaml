    ## 2.4.4 位置方法


    除了*迭代*和*归约*方法外，JavaScript 还有两个新方法用于定位数组中的项：`indexOf()` 和 `lastIndexOf()`。


    `indexOf()` 从左向右开始，而 `lastIndexOf()` 从右向左开始。


    它们的工作原理相同，并提供相同的引用位置位置。


    '
- fmt: '

    However, since they only report the first item that matches, if there are two
    similar items in the array, the `lastIndexOf` will find the very last first, and
    that is the one it will report.


    ## 2.4.5 indexOf() versus lastIndexOf()


    If all we need is the index of one specific and unique item, `indexOf` and `lastIndexOf`
    will give us the same performance. However in long arrays, one may be faster than
    the other depending where the item is located, if at the first half or if at the
    last half.


    Should there be more than one item of the same, choosing one method over the other
    will output different results.


    1- Let’s declare a new array on the console ([raw file](http://icontemp.com/joagi/scripts/245.txt)):
    `icontemp.com/joagi/scripts/245.txt` `var x1 = ["peanuts", "almonds", "walnuts",
    "heartnuts"];`


    2- Call the index of “walnuts” using `indexOf()`: `x1.indexOf("walnuts");` //
    returns 2 because it counts 0,1,2.


    3- Call the index of “walnuts” again, but this time using the `lastIndexOf()`:
    `x1.lastIndexOf("walnuts");` // returns 2.


    Although it searches from the right, it reports the position counting from the
    left (it decrements instead of incrementing).


    4- Let’s try it with “peanuts”: `x1.indexOf("peanuts");` // returns 0. `x1.lastIndexOf("peanuts");`
    // returns 0.


    From the examples above, there is no difference in what is returned in both methods
    as applied to this simple script.


    However if there are two elements alike, the results will be different. Consider
    the next exercise:


    5- Add a second element “walnuts” to the end of the array by using `push()`: `x1.push("walnuts");`
    // returns ["peanuts", "almonds", "walnuts", "heartnuts", "walnuts"].


    6- Call the index of “walnuts” using `indexOf()`: `x1.indexOf("walnuts");` //
    returns 2.


    7- Call the index of “walnuts” using the `lastIndexOf()`: `x1.lastIndexOf("walnuts");`
    // returns 4.


    It finds the last “walnuts” first.


    If the item being searched is not in the array, both of these methods will return
    a -1.


    How are these elements being compared? The index methods compare, the elements
    used for search, to the elements in the `Array`, using **strict equality**, which
    is the same method used by `===` (the triple-equals operator). If the elements
    differ in syntax or type, the algorithm will return a -1 as of "not found".


    ### Optional second argument: Where to begin.


    There is a second optional argument that could be used with `indexOf()` and `lastIndexOf()`.


    This second optional argument is commonly known as `fromIndex` (any name will
    do).


    The optional `fromIndex` argument specifies the array index at which to begin
    the search (inclusively). I mean, it is possible to bypass a portion of the data
    and start searching further down the pipe.


    `fromIndex` is base zero, which means the first element counts as 0 and the 1,2,3,
    etc.


    Based on the sample we currently have on the console:


    `["peanuts", "almonds", "walnuts", "heartnuts", "walnuts"];`


    8- Let’s experiment with the `fromIndex` parameter, using an argument of 2: `x1.indexOf("walnuts",2);`
    // returns 2


    (found the first “walnuts” which by coincidence it is the first item to be searched.


    `x1.indexOf("walnuts",3);` // returns 4


    (passed the first "walnuts", finds the second "walnuts".


    Now let’s see how the `lastIndexOf` behaves: `x1.lastIndexOf("walnuts",2);` //
    returns 2


    It couldn’t find the last “walnuts” because it only searched from item 2 and down
    to zero (like 2,1,0) and “walnuts” was on location 2 from zero. Remember, it searches
    towards the left and it began at the third element, position 2, so nothing at
    the right of position 2 was scanned.


    9- One more test: `x1.lastIndexOf("walnuts",4);` // returns 4.


    Found the first “walnuts” from the right to the left.


    ### Search criteria summary.


    The following is a summary for both `indexOf` and `lastIndexOf`. It is written
    for future reference. Do not confuse yourself trying to memorize these rules.
    Just refer to them when you need to implement the method at a later date.


    - **Search criteria for the indexOf() method:**


    a) In the `indexOf()` method, the optional second argument `fromIndex`, defaults
    to 0. If the `fromIndex` argument is missing, JavaScript assumes `fromIndex` as
    zero. If on the other hand, the `fromIndex` is greater than or equal to the length
    of the array, search will not be performed and a -1 will be returned.


    b) An `indexOf` with a positive number, indicates where to start searching from
    (inclusively), and thereafter, search is done to the right. Example: a `fromIndex`
    of 1 starts searching on the second element (inclusively) because it is zero based.


    c) An `indexOf` with a negative number, is used to offset the first element to
    be searched, based on the array’s length plus the negative number. Counting is
    zero based: (-1 in a length of 5, makes it start at position 4, which is 0, 1,
    2, 3, 4 or the fifth element), and thereafter, search is done to the right.


    Example:


    1- Remember, our `x1` is `["peanuts", "almonds", "walnuts", "heartnuts", "walnuts"]`
    `x1.indexOf("walnuts", -2);` // returns 4 because ( 5 -2 = 3. Three is actually
    element 4 (heartnuts) which already passed the first “walnuts”. The index for
    the next “walnuts”, the fourth element, is returned instead).


    - **Search criteria for the lastIndexOf() method:**


    a) The `fromIndex` defaults to the array''s length -1 when used with the `lastIndexOf()`.
    Which makes sense since it starts from the right.


    In an array with 5 elements, it defaults to 4 which means that all elements will
    be searched: 0,1,2,3,4. In the previous method it defaulted to zero. Also a `fromIndex`
    larger than the array will act the same as a `fromIndex` of 4.


    b) A `lastIndexOf()` with a negative number, is used to offset the first element
    to be searched, based on the array’s length plus the negative number. Counting
    is zero based: (-1 in a length of 5, makes it start at position 4, which is 0,
    1, 2, 3, 4 or the fifth element), and thereafter, search is done to the right.


    2- In our example, it is the last “walnuts”: `x1.lastIndexOf("walnuts",-1);` //
    returns 4.


    Similarly, the same array with 5 elements and -2 as `fromIndex` will start at
    position 3 or element 4.


    3- In our example, it starts at “heartnuts”: `x1.lastIndexOf("walnuts",-2);` //
    returns 2.


