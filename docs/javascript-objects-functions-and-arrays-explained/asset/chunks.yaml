    We pass `data in` (this data is called `arguments` going in, and up to 255 different
    arguments can be passed) into the function by using the placeholder inside the
    parenthesis (called `parameter`, and it is actually an object array-lookalike
    holding a maximum of `up` to 255 parameters.). We pass `data out` from the function
    using the `return` statement. The return also acts as a `break` and no further
    code will be processed within the function once the interpreter processes the
    return. `Return` is the last thing that happens in a function process. The function
    instance is then destroyed, unless there is another pointer keeping it alive (more
    about this later).


    Functions can be called `externally` (like we just did), or `internally` within
    their own body (called `recursion`).


    In JavaScript `functions are objects` (you know that!). They can be passed around
    just like any other object does. We could assign several variables to it, or include
    the function inside of other scripts, etc.


    ### 5. In long programs, after we are done with function `addMe100` and we no
    longer need it, we should `dereference` the variable (pointer) in order to remove
    it from the browser’s memory, because it is a global variable and it will remain
    in memory until the end of the program if not dereferenced. Dereferencing means
    to `remove the reference` by making the variable "`null`“. This will eventually
    clear both the variable and the function. Here’s how it is done:


    ```

    addMe100 = null;

    ```


    (`Note:` After dereferencing `addMe100` to `null`, if you check its `typeof`,
    you will get an empty `object`. `Null` is a special object (Remember the historical
    reason stated on chapter 1?). JavaScript will delete `addMe100` based on how the
    browser implements `garbage Collection`). Also the function ceases to exist. Try
    calling the function. You will get an error. `addMe100(3);` will result in TypeError:
    object is not a function.


    Practical functions implementations will be covered in more detail on later chapters.
    Let’s move along a keep peeling this current onion.


    ## 1.6 Named Functions vs Anonymous Functions


    Our function `addMe100` from step 1, Lab Work 3, is an `anonymous` function. This
    means that the function is assigned to a `variable declaration` and it is an `expression`
    (part of a program) of the `declared` variable.


    Let me explain…


    In JavaScript we can have `variable declarations` such as this:


    ```

    var x;

    ```


    We can also have `function declarations`:


    ```javascript

    function y( ){ };

    ```


    Declarations can have `expressions` such as:


    ![](images/00005.jpeg)


    Figure 5


    Also `variables` can have `functions as expressions`:


    ![](images/00006.jpeg)


    Figure 6


    When we declare a variable or a function, they are normally `hoisted` (pulled
    up) to the top of the `scope` by the interpreter, which lists all `variable declarations`
    on the top. Sort of like an index of what’s available. **Only the declaration
    is hoisted**, not the expression. This may not make a difference or matter to
    the program in itself, except when `debugging` code. When we debug, it is nice
    to visually distinguish between variables and functions from the list. It simplifies
    our understanding of what’s on the menu, right?


    **Here’s the problem:**


    In our examples above, the following would be figuratively seen on the top of
    scope:


    `x`, `y()`, `z`


    Notice how `y` is shown as a function but `z` looks like a variable of some sort.
    That’s because **only the declaration name is hoisted** and not the expression.
    It only means a bit more work when it comes to debugging.


    There is another difference between `y` and `z`: We could actually call `y` before
    we declare the function script because JavaScript already recognizes `y` as a
    function and it will look for it. However, in `z`, if we call the function in
    `z` before the function assignment is written, we may have an error.


    It is considered a best practice to declare all our functions before we try calling
    them.


    Other than that, **using [anonymous](http://en.wikipedia.org/wiki/Function_literal)
    functions is perfectly ok and a very powerful technique** if implemented wisely
    (jQuery makes extensive use of anonymous functions).


    ## 1.7 First Review


    *   JavaScript is a `prototype-based` language.

    *   Just like classes, prototyping avoids repeating code which saves memory and
    simplifies the script.

    *   **Memory** is subdivided between `Stack` and `Heap`. Stack acts as a scratch
    pad for short length data such as primitives and other temporary data. Longer
    more detailed data such as objects of any kind, are written in the `Heap`.

    *   To access objects we create `pointers` known as variables. Once we dereference
    a pointer, the object goes into delete schedule via a `Garbage Collection` method.
    Garbage Collection methods are determined by the browser itself and may vary from
    browser version to browser version.

    *   `Primitive types` reside in the `Stack` and `Reference types` reside in the
    `Heap`.

    *   To `dereference` an object we declare the pointer (variable) as `null`.

    *   We can create an object by instantiating it from the object `Object` (**the
    Global object**).

    *   Once we declare an object, it inherits `properties` and `methods` from the
    prototype we “cloned” it from, as well as from any parent of this prototype further
    up the chain.

    *   When we declare a variable containing strings as `key-value pairs` the data
    is saved as an object in the `Heap`, and the variable name is saved in the stack
    as a symbol. We can then recall each value by using `Dot syntax` or even `Bracket
    syntax`. Know both methods.

    *   Since everything is an object, functions and arrays are also objects in their
    own right and they all inherit from the object `Object`.

    *   When we declare variables or functions their names are `hoisted` to the top
    of the `Scope` so JavaScript knows they exist. Their expressions are not hoisted,
    they will be evaluated at runtime as the script gets to it, but the `pointer`
    gets acknowledged at the very top.

    *   An **Anonymous function** is a function `assigned` to a variable. It acts
    as an expression of the variable. We terminate the variable assignment with a
    semicolon.

    *   A **Named function** is a `declared` function. It is listed at the top of
    the scope as a function and not as a simple named variable.

    *   When a function calls itself within its own body is called a `[recursion](http://en.wikipedia.org/wiki/Recursion)`.


    ## 1.8 The Untouchable Object


    ### Do you remember where an object resides?


    Objects reside in the `heap`. They are reference types.


    ### How do we access the object?


    We access the object by assigning a label to it. This label is known as a variable.
    The variable points to the object.


    ### What happens to the object when we remove the variable?


    The object is placed automatically in garbage collection to be deleted by the
    browser.


    ### Can we directly touch and modify the object itself?


    *Big No!* We need to use a `pointer` (variable) to handle the object. Through
    the pointer and other manipulative techniques therefrom, we are able to manipulate
    or modify the object via interface mechanisms, which depend on properties and
    methods available to the object.


    At this point we already know how a new object inherits certain methods and properties
    from the big mother object, the JavaScript object template, but we certainly can
    add new ones or override existing ones. We will have opportunity to practice different
    techniques in our lab sessions.


    In review, **objects** are created by JavaScript when we assign a variable to
    the object. The variable resides in the stack and points to the location of the
    object in the heap. Without this *umbilical cord* leading the program to the object,
    there is no object. If we cut the umbilical cord by *dereferencing* the variable
    (declaring it null or reassigning it to something else), the object ceases to
    exist.

