    \ it back and try again and again until you have a clear notion on how it works.\n\
    \nBecause `Math.random() ` is less than 1, if we need random numbers higher than\
    \ 1 we need to add a constant to the method. For example if we add 5 we get numbers\
    \ from 5 (inclusively) to 6 (exclusively):\n\n```javascript\nMath.random() + 5;\n\
    ``` \n// try it a few times. We get numbers such as 5.2907, etc.\n\nLet’s suppose\
    \ we want random numbers between **1 and 10**. We multiply the method result by\
