- fmt: '

    However, we can’t just write `this.summary = function`, etc. This will not work.
    We need to send the method to the `prototype chain` in order to be part of the
    menu available for all objects to be instantiated, not just the original. We’ve
    done it before outside of the constructor, and we can also do it inside of the
    construct.


    See the next image for details and also the *raw file*:


    ![](images/00083.jpeg)


    Figure 83 [raw file](http://icontemp.com/joagi/scripts/80b.txt). [ icontemp.com/joagi/scripts/80b.txt
    ]


    On line 5 we included a `_xyz` (arbitrarily uniquely named variable) which was
    `undefined` to begin with, and which allowed the method to be implemented. Then
    on line 10 we made `_xyz = true` which will prevent the next object instance from
    recopying the method(s). Of course the properties themselves will always be different
    so we don’t have to worry about those.


    ### 1. Test the object instance again to be sure it is working:


    ```

    var jc = new Player("Coltrane", "saxophone");

    ```


    `jc;` // returns Player {name: "Coltrane", instrument: "saxophone", summary: function}.


    We can’t really see any difference between this implementation and the original,
    but if you are going to encapsulate your methods along with the constructor, this
    is a better way of doing it because it prevents methods from overloading the memory.
    In the end, as you know, the best technique is to code your prototyped methods
    *outside of* the constructor.


    **Note:** At this time, knowing what we now know and if you need some more practice,
    you could go back to 5.1.4 Practice and review: Create a Loan Application Object
    and redo it so that each method gets declared only once per execution context.


    # Conclusion


    We could go on and on because JavaScript is as large as the Atlantic Ocean and
    we are just at the Jersey Shore (my hometown), but I believe we have traveled
    far and our journey is well on the way to enlightenment... Well, if you’re like
    me you know that such nirvana keeps moving forward and it is by its own nature
    untouchable. The more we become aware, the more we realize how much we still don’t
    know.


    This is probably the right time to review some of the concepts covered in the
    book. Do not get distracted searching the internet because you will get lost and
    you will get confused. Most of what is written on the internet is a copy of a
    copy of a copy and as you know garbage in, garbage out.


    Don’t take me wrong, there is a lot of goodness online and I have learned my share
    from it which I’m thankful. But there is great danger and I have wasted so much
    time trying to understand the understandable because copying is not teaching.
    Teaching is explaining and giving room for the reader to think and come to his
    or her own conclusions. Sometimes we have to tell a story and let the reader put
    the pieces of the puzzle together. Telling a story is a way to convey information
    without forcing anyone to memorize what they don’t understand. I’m a great fan
    of metaphors. They expand our horizons exponentially.


    You have come a long way and I am proud of you because you have endured my writing
    and arrived at the end of the book. The end is just the beginning, right?


    As a mental review, here is what you have covered:


    *   Memory concepts. Stack versus Heap.

    *   The value of reference types.

    *   Everything in JavaScript comes from objects.

    *   You have become good friends with the JavaScript Console.

    *   You have played with functions and they also became your friends.

    *   The untouchable `Object`. Pointers, primitives, object wrapping.

    *   Execution context, scope, private variables, `this`, the role of functions
    in privacy.

    *   Native objects, hosted objects, user objects.

    *   Anonymous functions, closures, `call`, `apply`.

    *   String objects, `Arrays`, new methods of interaction.

    *   Arguments, nested functions, Lexical scope.

    *   Functions as object constructors.

    *   `Math`, `Date` constructs. Libraries.

    *   Unordered lists, inheritance, encapsulation.


    We could have continued on, but what good is a 400 page book if it goes unread?


    It is best then to stop and think about what has been covered because if you know
    this much, then you know quite a lot and everything else will be easier to grasp.


    With this knowledge you can go into more specialized books without getting lost
    as easily because you have acquired some powerful concepts.


    This book can also be used as a reference when you need to clear up your mind
    about some method that is giving you problems and you just don’t see why.


    I am planning to keep on improving the book, by reading it, editing it, adding
    to it, and always, thinking of you and what you would like to find in this writing.


    It has truly been an honor and a very exciting experience writing this book.


    Thank you so much!


    Tony de Araujo


    *Edited last on May 29th, 2014*


