  raw: 'But wait! Without a variable pointing to the object there is no object if
    the object has been created from scratch, or instantiated from another object.
    What about permanent objects such as **native** objects, **built in** objects
    or **the Global object** itself?


    These objects always exist. They are in standby waiting to be called upon by another
    variable whenever needed. **The permanent library never goes away**.


    **This is an important concept:** JavaScript is **not just** **ECMAScript**. JavaScript
    is a combination of ECMAScript and the environment where it is being used such
    as the browser (I’m referring to DOM & BOM). ECMAScript is implemented by a JavaScript
    Engine. There are several engines being used. A short discussion on engines can
    be found at [Wikipedia](http://en.wikipedia.org/wiki/JavaScript_engine).


    ## 1.8.2 Native objects


    Native objects are originally implemented by the ECMAScript standard and they
    are always present no matter where JavaScript is being used at. They help to specify
    and define other objects. Native objects are also called **Standard Global Objects**.


    Some of the standard built in objects are the following:


    Array, Boolean, Date, Function, Math, Number, Object, RegEx, String.


    A list of Standard Global objects can be seen At the [Mozzila Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects).


    Do not confuse the term ***Global* Objects** with ***The* Global** Object (the
    mother of all objects, the object Object). This particular object is the prototype
    we have mentioned earlier in 1.3 Variables vs. Reference Types. Actually we **can’t**
    even refer to it directly since its name varies with each environment where ECMAScript
    is used at. For example, in the browser it assumes the name **Window**. Window
    is the very first object, (root of the script) and any global declaration (like
    for example: **var x;**), are scoped at the *Window level* or at the level of
    the *Global Object*. We will experiment with this concept on the next lab work.


    Some native objects, such as String and Math, allow access to their properties
    and methods without instantiating a new object. Other native objects, such as
    *Date*, require you to create a new instance in order to use their properties
    and methods.


    ## 1.8.3 Hosted Objects


    Other objects are supplied by the **host environment** which interfaces with ECMAScript
    to complete the whole JavaScript functionality. In the browser, the other objects
    come from the [DOM](http://en.wikipedia.org/wiki/Document_Object_Model) (the document
    environment) and the BOM (the browser environment).


    **BOM** - Browser Object Model: this is a collection of objects that define the
    browser window and its contents. By using the BOM, developers can perform actions
    that do not directly relate to the document content such as *move the window*
    and *change text in the status bar*. Unfortunately BOM was not standardized until
    HTML5 and each browser uses its own implementation. With the advent of HTML5 the
    browser industry is now starting to implement standards and it should get better
    for every new browser version published.


    **DOM** - Document Object Model: this is an **object** which defines the document
    being displayed in the browser window. Dom has been standardized and it is an
    object within the Window scope. Window is an internal part of the BOM.


    In addition to being used on web browsers and servers, JavaScript interpreters
    are also embedded in a plethora of software tools. Each of these applications
    provides its own unique **object model**, which allows the core language to interface
    with the host environment. JavaScript core (ECMAScript), remaining basically the
    same in each application. The Global Object takes a different life in each one
    of these cases, and it serves as the *liaison* between the core language and its
    host. One example of such implementation is Adobe''s Acrobat and Adobe Reader
    which support JavaScript in PDF files. Other tools using JavaScript are Photoshop,
    Illustrator and Dreamweaver. Also Flash which implements ECMAScript under the
    name of ActionScript.


    The following image is a very broad view of a browser instance. Each internal
    object is included on the outer object. BOM being the wrapper of it all. Unfortunately
    BOM is not a standard but all the other objects have been standardized. Notice
    how HEAD and BODY are siblings, and children of HTML. In the BODY section, notice
    how each object shown is a sibling of the others within the BODY. Notice also
    how ***text*** is actually an object in itself.


    ![](images/00007.jpeg)


    Figure 7 - When we open a new Window, the window belongs to the browser. We are
    using BOM syntax when we open a new window. The object is the window itself. In
    window.open("url"); .open is a method from the BOM.


    ## 1.8.4 What is a property?


    Let’s peel the onion a bit more…


    A property is an *association* between a name and one of the values of the object
    in question, which is to say that properties are the building blocks of objects.


    ## 1.8.5 What is a variable?


    A variable is a “property” acting within an **execution context**.


    ## 1.8.6 What is an execution context?


    An execution context is the scope *in which* something is executed. A variable
    declared inside of a function has a scope of its function or inner functions inside
    it. However, in execution context terms, each time we call a function the scope
    of this variable is different than other prior or future function call. That’s
    an execution context.


    When the interpreter first starts, there is only one execution context, the global
    context. In the Global context we can visualize scope a lot better than afterwards.
    Then, as each function executes, the context changes, and since JavaScript only
    does one thing at a time, each time the execution context is unique.


    When JavaScript is running in the browser the global context is **window**.  


    Everything runs under window (the object Object). Then we can subdivide into functions
    which are objects that include groups of code environments. A function context
    runs each time we call the function and it clears out when the program exits the
    function.


    When we declare **var x = "tony";** in the browser environment x becomes a property
    of the Global Object known in the browser as **window**.


    If in the console we type **x;** the result is “tony”


    If instead, we type **window.x;** the result is still ‘tony”. “tony” is a value
    of window and x points to ”tony”.


    If however we have a function like for example


    ![](images/00008.jpeg)


    Figure 8


    **z** is a property of function **y**, not of **window**. However just for the
    record, **function y** is a function of the *global object* (window).


    We will cover more about scope and context a bit later on. Like a slow-moving
    tortoise, *slow and steady wins the race*!


    ## 1.9 Second Review


    *   Reference values reside in the Heap.


    *   In order to call or modify an object we need to have a variable pointing to
    it.


    *   JavaScript is composed of its core (ECMAScript) *plus* the objects from the
    environment where it is being implemented.


    *   In a browser, the main object is Window. ECMAScript interfaces with the Document
    Object and the Browser Object Models.


    *   The Document Object (DOM) has been standardized. The Browser Object Model
    continues to be browser brand specific but it is rapidly changing.


    *   ECMAScript comes with Native objects, which are always available, such as
    the Global Object, Array, Boolean, Date, Function, Math, Number, RegEx and String.


    *   The running environment (such as a browser) adds its own objects called **Hosted
    Objects**. In a browser, the Global Object *morphs* *in* to become **Window**.
    Then we have the Document Object (**DOM**) and all sorts of proprietary objects
    known as the **BOM** collection.


    *   A variable is a given name *declared* under a given scope.


    *   A property is a variable **+** the data to which the variable points to.'
