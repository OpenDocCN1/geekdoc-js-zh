    Congratulations! If you feel a bit confused it is because we have covered a huge
    territory. As long as you understand what is happening, you can proceed to the
    next step. If you still need to mend a few concepts here and there, it may be
    a good idea to review this chapter now since you have a broader view of what is
    being covered. *Repetition* is the secret to learn JavaScript.


    ## 5.1.6 Prototyping new methods


    What if we want to add a new method to our *LoanApp* object?


    We could go *into* the object and *hardwire* the method like we did when we first
    created *LoanApp*. However, many times this is not a convenient way to do it.
    Also, it is not a memory efficient implementation because, if you recall from
    previous chapters, every time we instantiate a *new* object, the constructor copies
    all the data which, when it comes to methods, it is totally unnecessarily.


    We could instead, just *point* the new instance object to the original method,
    and use it when needed.


    It is best practice then, to add methods as separate prototype links. However,
    if you prefer to encapsulate them inside the object as opposed to have them separate,
    there are ways to do it and we will cover one of such implementations soon, once
    we finish covering the proper way of doing it.


    **Question:** Based on what was written above about memory efficiency, why did
    we include the methods **submit** and **getApprovalStatus** inside the object
    **LoanApp**, and not outside? Isn’t this a bad practice? Yes, it seems to be.
    The reason why we did it this way was because we are using these methods as **getters**
    to access private data. We can’t get private information by using outside methods.
    We always attempt to code the most efficient way possible. Right now this is what
    we can do with our LoanApp.


    For the most part however, newly added methods will be created separately.


    **Let’s add a new method to our** **LoanApp** **just for practicing purposes**.


    Our boss comes in one day and asks us if there is a way to get a **summary** of
    each individual applicant from the **LoanApp**. We reply that there isn’t one
    yet, but we could implement such method in less than 5 minutes. She approves it,
    and we go back to the drawing board.


    Do you still remember the syntax from an earlier chapter? Let me remind you: we
    add a new method name to the object prototype *menu*, in other words, we *prototype
    it*.


    1- Create a prototype method named **summary** that returns an applicant’s name
    and the loan he/she is applying for, see raw file on step 4 (**[raw file](http://icontemp.com/joagi/scripts/pre5.txt)**).
    [ icontemp.com/joagi/scripts/pre5.txt ]  **LoanApp.prototype.summary = function(){**


    2- In the body of the function write the following: **console.log(this.personName
    + " is applying for a loan of " + this.loanAmount);**


    3- Don’t forget to close the function: **}**


    Let’s test it before we show it to our boss:


    4- Paste the **LoanApp** to the console: see (**[raw file](http://icontemp.com/joagi/scripts/pre4.txt)**).
    [ icontemp.com/joagi/scripts/pre4.txt ]


    5- Paste the **summary** method afterwards. ([raw file](http://icontemp.com/joagi/scripts/pre5.txt)).
    [ icontemp.com/joagi/scripts/pre5.txt ]


    6- Instantiate a new applicant:


    **var tony = new LoanApp("Tony", 5000, 1000);**


    7- Test the new method:


    **tony.summary();** // returns "Tony is applying for a loan of 1000".


    Go ahead and show it to your boss!


    We had previously covered method prototyping earlier when we created a job application.
    It may be a good time to review that section because it might make more sense
    now.


    Here’s the link: *3.1.8 Functions as Object Constructors*.


    ## 5.1.7 Objects that inherit from other objects


    Sometimes we want to create an object with a certain functionality that already
    exists in another object. JavaScript allows us to inherit functionality from other
    objects avoiding repetition.


    There are several ways to implement such inheritance, each one of them with its
    quirks. I will cover the ones I believe to be best practices. Let’s do discuss
    them as by creating a new application:


    The branch manager from Los Angeles calls the programmer in New York and praises
    him for the work he did with the LoanApp. They want to be able to access an application
    from Los Angeles under their own branch name, and they wanted to be sure the app
    is independent from the New York application in case they decide to add more functionality
    to it. The Los Angeles branch also wanted an additional method to print the branch
    location since they noticed the existing application does not provide such information
    to the public.


    We decided to reuse the object *LoanApp* to save time and resources by just making
    a few changes to the new object constructor as follows:


    *   New application name is **LoanApp2**.


    *   *bankBranch* is **Los Angeles**.


    *   The additional method is **getBankBranch**.


    We are going to use a technique called object **masquerading**.


    ![](images/00080.jpeg)


    Figure 80 (raw file on next picture).


    Let’s do it!


    1- New object declaration:


    **function LoanApp2(personName, income, loanAmount){**


    2- Assign **inheritance** from **LoanApp** to **LoanApp2**, via a temporary variable
    **x** ( I have chosen **x** to make this clear: the name does not matter but in
    real life this variable should have a more illustrative name):


    **this.x = LoanApp;** // here x inherits all of LoanApp.


    3- Next choose which properties will need to inherit methods from LoanApp, using
    **x** as a conduit:


    **this.x(personName, income, loanAmount);**


    The inheritance has been established, JavaScript has taken note, and we don’t
    need the *temp* variable **x** anymore because we want to have a “disconnect”
    from one object to the other. Do you remember the kite held by boy and girl? and
    closures? Now that JavaScript knows *loanApp2* has a connection with the properties
    and methods of  *loanApp*, we can safely “return” or delete *loanApp* and still
    keep the goodies to be used on loanApp2\.


    Here we introduce a new keyword: **delete**. The delete operator removes a property
    from an object. The syntax is *delete object.property*, delete does not affect
    regular variables or functions, just objects.


    4- Delete x:


    **delete this.x;**


    Now we can add newer functionality. The reason to do it *after* we deleted **x**
    is to prevent any overwriting from loanApp1 to loanApp2 when we first introduced
    inheritance:


    5- Add the new branch name:


    **var bankBranch = "Los Ageles";**


    6- Add a new method to return the branch name by a client:


    **this.getBankBranch = function() {


     return bankBranch;


    };**


    7- Close the object LoanApp2:


    **}** // (see image and link to raw file below).


    ![](images/00081.jpeg)


    Figure 81 [raw file](http://icontemp.com/joagi/scripts/pre6.txt). [ icontemp.com/joagi/scripts/pre6.txt
    ]


     **Let’s test our object inheritance:**


