    # 11- Create a user for the Los Angeles `LoanApp2` (old Tony is just fine):


    ```javascript

    var tony = new LoanApp2("Tony", 5000, 1000);

    ```


    # 12- Test the new method `getBankBranch`:


    ```javascript

    tony.getBankBranch(); // returns *Los Angeles*.

    ```


    # 13- Test the methods inherited from the New York object:


    ```javascript

    tony.getApprovalStatus(); // returns “*Approved*”.```


    Now let’s use another new operator: `instanceof`. This operator comes handy to
    verify where an object comes from:


    ```javascript

    tony instanceof LoanApp2; //? returns *true*.

    tony instanceof LoanApp; // returns *false*. (tony if from Los Angeles)

    LoanApp2 instanceof LoanApp; // returns *false*. (LoanApp2 is not an instance
    of LoanApp even though it inherits its functionality and then is adds some more
    of its own. LoanApp is a constructor.)

    ```


    # 14- If you pasted the external method on step 9, you also have the added prototype
    method `summary`. Let’s test it:


    ```javascript

    tony.summary(); // returns "TypeError: Object #<LoanApp2> has no method ''summary''"

    ```


    Ooops! That’s the “drawback” of using masquerading to inherit from other objects
    because the new constructor is pointing at its own prototype list, not at the
    list from its ancestor’s constructor. This is no problem if you don’t have external
    prototyped methods. However, if you do have them or plan to have them, then you
    need to add another line of scripting in order to access prototyped based methods
    from the older constructor. A proper interface need to be implemented. We need
    to link the `LoanApp`’s prototype list to `LoanApp2`. Then your object inheritance
    will work perfectly:


    Just like when we create an external prototype method, create an external prototype
    chain that links all the prototype methods from `LoanApp` to `LoanApp2`. Follow
    step 15:


    # 15- Paste the following script into the console. It will be immediately available
    to new applicants. However we need to reset all existing applicants:


    ```javascript

    LoanApp2.prototype = new LoanApp();

    ```


    # 16- Now we can instantiate an applicant:


    ```javascript

    var tony = new LoanApp2("Tony", 5000, 1000);

    ```


    # 17- Test if `summary` works:


    ```javascript

    tony.summary();

    // returns "*Tony is applying for a loan of 1000*".

    ```


    “***We have lift off!!***”. **Question:** What would happen if we now declared
    `LoanApp` as null? Remember the kite being held by a boy and a girl? If we declare
    the old constructor as null, the new constructor still holds the inherited functionality.
    However, because `LoanApp` is no longer available, variable `x` will not function
    and therefore, we can’t instantiate new applicants!


    In other words, in order for `loanApp2` to function with its 100% capabilities,
    both `loanApp` and `loanApp2` need to coexist. It’s like saying that we need an
    internet service in order to visit Amazon and download a [new eBook](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)
    from Tony de Araujo (*sorry, couldn’t help myself!*).**Summary:** Masquerading
    an existing object as a new object, is a great way to delegate functionality avoiding
    code repetition. One needs to make sure that the prototype chain is linked to
    the new object constructor if methods created under the prototype mechanism exist
    in the object to be inherited from. The Los Angeles branch manager is now a very
    happy person and so are we!


    We have looked at object creation, unordered lists to be exact. We’ve seen how
    encapsulation makes code more functional, and we have pondered on how inheritance
    can save memory and development time by chaining objects together. These are two
    important concepts in the JavaScript object paradigm and they are all used frequently.


    Before we leave this subject there is another topic of great importance about
    encapsulation:


    How can we include object methods inside of the constructor without creating duplication
    which may overload the memory? So far we have included prototype methods as external
    scripts, which is a recommended practice. However it is possible to include them
    inside of the constructor and at the same time avoid duplication. Let’s look into
    a way of achieving such endeavor in the next topic.


    ## 5.1.8 How to include prototype methods inside a constructor


    Sometimes we just want to have properties and methods together for whatever reason,
    even if it is to look like some other language! Not that there is anything wrong
    with the way we have done it so far, and it is the recommended way; but I’m including
    the other option here, in case you are interested on knowing about it. And even
    if you are going to use it, this explanation will open new doors of understanding
    on how JavaScript ‘thinks’.


    Let’s create a simple object to illustrate how to include methods inside of the
    constructor in ways that do not overload the memory (the other alternative is
    to prototype them externally like we have done before). This object will be called
    `Player` and it contains two properties: name and instrument. Then we create a
    method to display a summary about the player. Simple enough, right?


    ### 1- Create `Player` and paste it into the console:


    ![](images/00082.jpeg)

    Figure 82 [raw file](http://icontemp.com/joagi/scripts/79.txt). [ icontemp.com/joagi/scripts/79.txt
    ]


    ### 2- Instantiate a player:


    ```javascript

    var jc = new Player("Coltrane", "saxophone");

    ```


    ### 3- Call `jc`:


    ```javascript

    jc; // returns Player {name: "Coltrane", instrument: "saxophone"}

    ```


    ### 4- Test the method `summary`:


    ```javascript

    jc.summary(); // returns "*Coltrane plays the saxophone*"


    The object is working fine. So why would we want to change it? If this object
    was to stand alone I would leave it like is. However, this is not just an object;
    this is a constructor, which means that we are going to instantiate many objects
    from it. Since we are going to instantiate other objects, I’m concerned with memory
    management. In order not to duplicate the object each time we create new instance,
    we need to place the methods outside but wrapped around a script that checks if
    they already exist.


    ### Preamble


    The `typeof` operator in JavaScript allows you to probe the data type of its operand,
    or even to see if the data is `undefined`. It is this last one that we need to
    get. Conventionally, an underscore before a variable name, means that such variable
    or keyword is for internal use. This of course is only to elucidate another developer
    that may come by and peek at our script (like ourselves 6 months later since we
    will not remember what we did earlier, not even tomorrow!). We are going to make
    a magic pass at our object. We ask the program to proceed forward only if a certain
    variable does not exist. We do this by implicitly asking the object if “x variable”
    is undefined. But of course it is undefined because it is the first time we mention
    such variable. Then we code our methods, and finally we set the variable to `true`,
