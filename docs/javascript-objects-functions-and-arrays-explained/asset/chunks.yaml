  trans: "\n\n### d) `toString()` - 每个对象都有一个 `toString()` 方法。当对象需要表示为文本值时（例如我们执行 `alert(object)`\
    \ 或 `console.log` 它时），该方法会被调用。当需要对象的字符串表示时，会发生字符串转换。\n\n### e) `valueOf()` - JavaScript\
    \ 返回指定对象的原始值。`myobject.valueOf()` 可能返回 `Array`、`Boolean`、`Date`、`Function`、`Number`、`Object`\
    \ 或 `String`。JavaScript 在内部根据需要使用此方法，但也可以刻意调用它。`Math` 和 `Error` 对象没有内置的 `valueOf`\
    \ 方法。\n\n回到属性：\n\n想象一下：对象的属性可以解释为附着在对象上的变量。当然，当我们创建一个新对象时，所有这些属性和值都可以被重写。\n\n\
    **所以，在这个例子中：** `var tony = new Object();` 中的 `tony` 是对象本身吗？\n\n答案是否定的；`tony` 是一个\
    \ `label`（标签），一个 `symbol`（符号）。从技术上讲，符号 `tony` 被归类为 `variable`（变量，即指针），它临时留在栈中，并指向从模板实例化（克隆但使用现有功能）的对象。该对象存储在堆中，一旦我们重新分配或删除标签\
    \ `tony`，该对象就会进入垃圾回收模式，并从那里被擦除（不同的浏览器实现不同的清理未使用数据的方法。这种技术随着每个新版本的发布而不断改进）。\n\n\
    在 JavaScript 中，几乎一切都是对象。除了 `null` 和 `undefined` 之外的所有原始类型实际上都被 JavaScript 视为对象，因为每当解释器需要实现一个方法来处理相关的原始类型时，它们会在内部被包装成对象。\n\
    \n因为可以被包装成对象，属性和方法可以赋值给原始类型，显示出对象的所有特征。这是因为 JavaScript 在其库中为 `Boolean`、`Number`\
    \ 和 `String` 拥有原型引用，当临时需要包装原始值时，该引用会被调用：\n\n![](img/00003.jpeg)\n\n图 3\n\n## 1.4\
    \ 一切源于对象\n\n## 1.4.1 实验 1\n\n是时候启动你最喜欢的 JavaScript 控制台进行一些实验工作了。在这个项目中，我将使用 Google\
    \ Chrome 的控制台。在浏览器中，你可以点击快捷键 Windows 的 `CRTL+SHIFT+j`，Mac 的 `CMD+OPT+j`，或按照以下步骤操作：\n\
    \na) 打开 Chrome。在右上角找到三条横线的按钮并点击。\n\nb) 在“工具”部分，点击“JavaScript 控制台”。\n\n现在让我们来玩玩\
    \ `typeof`。观察每个结果并尝试推断其背后的原因。\n\n`typeof` 是 JavaScript 运算符。它的作用是返回一个指示操作数类型的字符串。\n\
    \n输入绿色代码，然后按 Enter 键。特别注意步骤 9..15：\n\n1- `typeof 1;`\n```\n// 结果为 “number”。当然，1\
    \ 是一个数字！注意控制台是如何自动完成 `typeof` 关键字的。除非你想将其转换为字符串类型，否则永远不要给数字加引号。\n```\n\n2- `typeof\
    \ x;`\n```\n// 结果为 “undefined”。x 未定义。\n```\n\n3- `typeof tony;`\n```\n// 结果为 “undefined”。JavaScript\
    \ 不会闹着！\n```\n\n4- `typeof \"tony\";`\n```\n// 结果为 “string”。啊，现在我们在说 JS 术语了！引号让变成了字符串。\n\
    ```\n\n5- `typeof true;`\n```\n// 结果为 “boolean”。true 是保留字。JavaScript 是大小敏感的。\n\
    ```\n\n6- `typeof \"true\";`\n```\n// 结果为 “string” 你知道为什么吗？虽然 `true` 是保留字，但 “true”\
    \ 以字符串形式存在。\n```\n\n7- `var y = 123;`\n```\n// (回车) 然后输入： \n```\n\n8- `typeof\
    \ y;`\n```\n// 结果为 “number”。\n```\n\n9- `var z = new Object;`\n```\n// O 大写。点击\
    \ (回车)，然后输入：\n```\n\n10- `typeof z;`\n```\n// 结果为 “object”。\n```\n\n11- `var b\
    \ = z;`\n```\n// (回车)，然后输入：\n```\n\n12- `typeof b;`\n```\n// 结果为 “object”。现在 z\
    \ 和 b 都指向同一个对象。现在让我们重新分配 z：\n```\n\n13- `z = 123;`\n```\n// (回车) 然后输入：\n```\n\n\
    14- `typeof z;`\n```\n// 结果现在是 “number”。z 不再指向该对象。它在栈中代表数字 123。\n```\n\n15- `typeof\
    \ b;`\n```\n// 结果仍然是 “object”。由于符号 b 保持其活跃，对象仍然存在。\n```\n\n在练习 9 中，我们将 `z` 声明为一个新\
    \ Object（稍后会详细介绍）。注意 Object 中的 o 是大写的。所有 JavaScript 原生对象都大大写开头。\n\n## 1.4.2 实验\
    \ 2\n\n让我们启动 JavaScript 控制台（我使用的是 Chrome）并编写以下代码：\n\n1- `var x = \"hat\";`\n```\n\
    // 再声明一个变量：\n```\n\n2- `var color = \"green\";`\n\n3- `typeof x;`\n```\n// 结果为\
    \ “string”。（目前为止没什么新奇！）\n```\n\n4- `typeof color;`\n```\n// 结果为 “string”。与上面相同）。\n\
    ```\n\n你知道 JavaScript 中几乎一切都是对象，对吧？\n\n让我们测试一下！\n\n尝试另一个变量。但这一次让我们给它再添加几个属性。注意下一步步骤\
    \ 1 中大括号后面的分号。我们正在声明一个名为 shirt 的变量。*变量声明始终以分号结束，即使在大括号之后也是如此*。分号告诉 JavaScript\
    \ 语句已结束，没有更多需要声明的了：\n\n1- `var shirt={color: \"white\", size: \"M\", material:\
    \ \"cotton\"};`\n\n2- `typeof shirt;`\n```\n// 结果为 “object”\n```\n\n"
- fmt: "\nNOTICE: because each label (like for example “color”:) is technically a\
    \ string, it is also good practice to write them within double quotes at the time\
    \ of declaration. Single quotes will work the same but stick to doubles because\
    \ once you get into JSon this type of writing will be stricter, so might as well\
    \ get used to it from the beginning. In the future, I will write them within quotes.\n\
    \n**Alright, now we’ve got a *real* object, yes?**\n\nLet’s access its data:\n\
    \n3- `shirt.color;` //results in “white”.\n4- `shirt.size;` //results in “M”.\n\
    5- `shirt.material;` //results in “cotton”.\n\nThis variable has **properties**\
    \ and **methods** *inherited* from the **Object template**. By using **Dot syntax**\
    \ we can access its values. After all, an object is nothing but a bunch of mapped\
    \ **key-value** items harnessed together by a *variable name*, pointing to the\
    \ data.\n\nWe could also use **bracket syntax** instead of **dot syntax**. Like\
    \ this:\n\n6- `shirt[\"color\"];` //results in “white”.\n7- `Shirt[\"material\"\
    ];` //results in “cotton”.\n\nIt all depends on what you are trying to accomplish\
    \ and also on your preferences of syntax. Bracket syntax is more versatile in\
    \ the sense that we could apply a numeric *key* if we had one to use, whereas\
    \ Dot syntax will not accepts numbers. We will see this later in more advanced\
    \ lab works.\n\n***Are are objects difficult to understand?**\n\nThink of variables\
    \ as symbols pointing to data; think of *stack* pointing to the *heap*; and of\
    \ *key-value pairs* in the heap, bound by a pointer in the stack. If no pointer\
    \ exists, no key-value pairs exist. Just like a coin, one side does not exist\
    \ without the other. An unassigned variable has a value of **undefined** but still\
    \ exists. If you really want to get rid of a variable, assign it to **null** after\
    \ you are done with it. This will clear it from working memory. To check if a\
    \ variable is assigned or if is not assigned, use `typeof`. We will use `typeof`\
    \ later on in the book to verify if methods have been activated in object instantiation\
    \ in order to avoid method duplication. Don’t memorize anything, just keep practicing\
    \ and read back if your mind flies away for a bit. Review often.\n\nThink of JavaScript\
    \ as a collection of objects inheriting functionality from their “parent object”\
    \ to which they *interface* with.\n\nNew objects can also override the original\
    \ properties and methods and create their own.\n\nThese newly created properties\
    \ can be passed on down the pipeline via the object’s **prototype** property every\
    \ time we instantiate (reproduce) the object (more about this as we move along).\n\
    \nWe can also use the prototype property to assign (adding) new functionality\
    \ to the existing object, even to the global object **for this particular instance**\
    \ (since anything added to a the global object is temporary).\n\nLet’s keep going…\n\
    \n8- `var shelf = {\"books\": 20, \"CDs\": 57, \"Magazines\": 19};`\n9- `shelf.CDs;`\
    \ // results in 57.\n10- `shelf.books;` // results in 20 Now try the following:\n\
    11- `shelf.books = 21;` // added one more.\n\nYou could also do it this way: `shelf[\"\
    books\"] = 21;`\n12- `shelf.books;` // results in 21.\n\nWe have just added 1\
    \ more book to the *shelf* by changing the value of books in the shelf variable.\n\
    \nLet’s test it:\n13- `shelf; //results in Object {books: 21, CDs: 57, Magazines:\
    \ 19}.`\n\nWe can also *add* (assign) new items to the object:\n14- `shelf.audioBooks\
    \ = 11;` or `shelf[\"audioBooks\"] = 11;`\n\nCall the object:\n15- `shelf; //\
    \ results in: Object {books: 21, CDs: 57, Magazines: 19, audioBooks: 11} `\n\n\
    As you see, a *variable* can point to a collection of data in key-value pairs,\
    \ making the collection an object. However, even regular strings, although primitive\
    \ values, inherit properties and methods from Object since almost everything is\
    \ an object.\n\nLook at the following examples:\n\n16- `var x = “tony”;` Then\
    \ code the following:\n17- `typeof x; //results in “string”.`\n18- `x.length;\
    \ //result 4. (Where did length come from?)`\n19- `x.substring(0,3); //result\
    \ “ton”.`\n\nThe `0` parameter represents the **first included** character for\
    \ the substring and the `3` parameter represents the **first** **excluded** character.\
    \ We’ll cover more about length and substrings in a later chapter.\n\n**What happened\
    \ in exercises 18 ... 19?** \n\nRemember Figure 3? It seems that although JavaScript\
    \ didn’t move “tony” to the heap converting it into an “official” object, the\
    \ string still has properties and methods available to work with, due to **object\
    \ wrapping**. In JavaScript it is then best to just think of objects and nothing\
    \ but objects. Code makes more sense from this perspective.\n\n## 1.5 More Variables,\
    \ add Functions.\n\n### What happens when we assign a function to a variable?\n\
    \n## 1.5.1 Lab Work 3\n\n1- Write this function on a simple editor (I’m using\
    \ *Notepad*) and copy it to the JavaScript Console (you can also copy my file\
    \ by clicking of the **raw file** link):\n\n![](images/00004.jpeg)\n\nFigure 4\
    \ [raw file](http://icontemp.com/joagi/scripts/4.txt). [ icontemp.com/joagi/scripts/4.txt\
    \ ]\n\n**Notice the semicolon**. This is a **function definition** statement,\
    \ which means that we are defining the variable `addMe100` which points to some\
    \ unnamed function object on the heap, which in turn adds 100 to any *argument*\
    \ passed in by it.\n"
