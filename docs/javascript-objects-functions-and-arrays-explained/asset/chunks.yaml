    If you need an online editor as a scratch pad there is an interesting one here:
    [editpad.org](http://www.editpad.org/).


    1- First I declare a variable **approvalStatus** and set it to **"invalid"**:


    **var approvalStatus = "invalid";** // invalid is just a string of my choice,
    not a keyword.


    2- Then, create a ***testing* function** named **submit** with these two parameters:
    **income** and **loanAmount**.


    These parameters will not be in the final project because they will be included
    on the object constructor itself, but for now, I need them here in order to test
    the method *submit*:


    **var submit = function(income, loanAmount){ };**


    3- In the body of the function I need a *conditional statement* to qualify the
    applicant and also to send him/her a message accordingly.


    If income is at least twice of the amount of the loan requested, the loan will
    be immediately approved, the outer variable **approvalStatus** will be set to
    "**Approved**", and a status message will be sent, *else*, **approvalStatus**
    will be set to "**On review**" and a different message will be sent:


    **if(income/loanAmount >= 2){**  //this will calculate the ratio of income to
    loan.  **approvalStatus = "Approved";


    console.log(“**see script for the message**”);


    } else {


    approvalStatus = "On review";


    console.log(“**see script for the message**”);


    }**


    **Please find the** **raw file** **[here](http://icontemp.com/joagi/scripts/pre1.txt)**.
    [ icontemp.com/joagi/scripts/pre1.txt ]


    4- Paste the script to the ***console*** and test the function **submit** by using
    different ratios between *income* and *loanAmount*: **submit(5000, 1000);** //
    returns "*Congratulations! Your application for a loan of 1000 has been approved*".


    **approvalStatus;** // returns "*Approved*".


    5- So far so good! Now I will test it with a lower income: **submit(1500, 1000);**
    // returns "*Thanks for submitting a loan application. We will contact you shortly.*"


    **approvalStatus;** // returns "*On review*".


    Great, our method is working!


    Now it is time to create our object construct, **LoanApp**.


    **This is a summary of what we will be doing next:**


    In the *LoanApp* object constructor,  **personName**, **income**, and **loanAmount**
    will be programmed as **input parameters**. These parameters will take arguments
    from any *new object* LoanApp application when being instantiated.


    Inside of the body, we are going to take advantage of the ***this*** placeholder,
    in order to make the object portable (*instantiable*).


    Also, two private variables will be declared: **bankBranch** and **approvalStatus**.


    Then, the function **submit** will be copied into the object but we need to remove
    the parameters from our current submit function because they are not need anymore.
    (the raw file link is on step 5).


    **Let’s do it:**


    1- Declare the object constructor:


    **function LoanApp(personName, income, loanAmount){**


    2- In separate lines, include the properties listed on the function parameters.
    Don’t forget to apply the **this** to each one of them:


    **this.personName = personName;**


    **this.income = income;**


    **this.loanAmount = loanAmount;**


    3- Declare a private property named **bankBranch** and assign it a location:


    **var bankBranch = "New York";** // we will look into this later


    4- Declare a private property named **approvalStatus** and assign it the string
    value "invalid":


    **var approvalStatus = "invalid";**


    5- Finally copy the method **submit**, but make sure you prefix it with ***this***,
    so it can be applied to each different object instantiation:


    **this.submit = function(){** etc...


    // find the whole script up to step 5 on this  **[raw file](http://icontemp.com/joagi/scripts/pre2.txt)**.


    [ icontemp.com/joagi/scripts/pre2.txt ]


    6- Testing: Paste the object script on the console to see if it passes validation.
    Correct any errors. Take a look at the raw file from the previous step if needed.


    7- Instantiate an object. My object will be *tony* with an income of 5000 and
    a loan request of 1000:


    **var tony = new LoanApp("Tony",5000,1000);** // it passed!!


    8- Call the object tony: **tony;** // returns *LoanApp {personName: "Tony", income:
    5000, loanAmount: 1000, submit: function}*


    9- **Submit** tony’s application: **tony.submit();** // returns "*Congratulations!
    Your application for a loan of 1000 has been approved.*"


    10- Call tony’s **approvalStatus**: **tony.approvalStatus;** // returns undefined
    ("*Houston, we have a problem!*")


    As you see, we can’t fetch **approvalStatus** because we have made it a private
    property. The only way to read the data from a private property is by creating
    an intermediary reading method, a **getter**, do you remember?


    11- Let’s modify our object construct to include a **getApprovalStatus** method.
    Try to do it on your own then look at the **[new raw file](http://icontemp.com/joagi/scripts/pre3.txt)**
    if needed.


    [ icontemp.com/joagi/scripts/pre3.txt ]


    12-  Paste the new object construct on the console and **reset** the object tony
    by re-instantiating it:


    **var tony = new LoanApp("Tony",5000,1000);**


    13-  Get tony’s approve status:


    **tony.getApprovalStatus();** // still returns “invalid” (***why?***)


    The result was “invalid” because it hasn’t been changed from its original status.
    We have not yet **submitted** the application.


    14- Let’s submit the application:


    **tony.submit();** // returns "*Congratulations! Your application for a loan of
    1000 has been approved.*"


    15- Verify if tony’s approval status has actually changed:


    **tony.getApprovalStatus();** // returns "**Approved**".


    ***One more thing….***


    We have not yet tested the “**else**” on the submit method. We need to test it
    to make sure that it actually works.


    16- Create another application for Mary as *mary*. Her income is also 5000 but
    she wants a bigger loan for 3000 which will delay her approval:


    **var mary = new LoanApp("Mary",5000,3000);**


    17-  Submit her application:


    **mary.submit();** // returns "*Thanks for submitting a loan application. We will
    contact you shortly.* "


    18- Some time has passed and Mary wants to check her approval status:


    **mary.getApprovalStatus();** // returns "*On review*".


    Great!!!!


    Let’s peel this onion a bit more. ***What if*** we wanted to submit the application
    and get an immediate *status change* at the time we instantiate a new object?


    ## 5.1.5 How to automatically evaluate and call a method


    **This is a function:**


    **function ( ) { } ;**


    **This is a function that calls itself:**


    **function () {}();**


    The last pair of parentheses to the right trigger the function to call itself.


    The function *as* written above will work just fine. It will call itself when
    the program starts. However, it is visually more explicit to tell another programmer
    that such function will call itself, if we also *enclose* the whole function (before
    calling) in parentheses.


    Like this:


    ** (function( ){ })();** 


    // returns function ( ) { }


    **Going back** to our **LoanApp** object, we could implement this technic on the
    **submit** method. This will make the method to run as soon as we instantiate
    a new LoanApp, which will print the status *message* and update the **approvalStatus**
    private variable.


    The following image shows where the extra parentheses will go, and a raw file
    for the whole script is also available:


    ![](images/00079.jpeg)


    Figure 79 [raw file](http://icontemp.com/joagi/scripts/pre4.txt) (complete). [
    icontemp.com/joagi/scripts/pre4.txt ]'
