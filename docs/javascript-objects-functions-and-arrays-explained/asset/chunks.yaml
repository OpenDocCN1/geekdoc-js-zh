    # Preface


    Even when literature about JavaScript Objects is abundant and already accessible
    to the reader, this book still fills a need. `JavaScript Objects Functions and
    Arrays Explained` challenges the void between books for teaching syntax and those
    covering specific implementations of the language. This comprehensive approach
    revisits the foundation of JavaScript Objects without asking anyone to memorize
    constructs that are seldom used in the real world of JavaScript implementation.
    It dissects objects from the simplest form to a more complex paradigm. It uses
    simple illustrations allowing the reader to stay focused on the subject matter.
    Although most book sales happen in the US, this book has also been written in
    international English and any idiomatic expression has a link to a suitable explanation.


    `JavaScript Objects Functions and Arrays Explained` is about concepts; it is not
    about implementation of exotic scripts that may lose students before they have
    a chance to grasp the idea behind the topic. Because JavaScript is such a complex
    language, the author has chosen to simplify, but not to diminish, certain areas
    that may be new to a great number of readers. One example is `closures`. The author
    approaches closures in a minimalistic yet effective way, with illustrations and
    simplified scripts in order to keep the concept from being lost by the power of
    the code itself.


    The author’s intent is to approach JavaScript in a manner he hoped to find when
    first initiated his studies of the language. This book is not for the very beginner
    because it does not cover basic rules of syntax. However, `if you have been exposed
    to the basics somewhere else before`, you will not have any problem grasping the
    written material. On the other hand if you come from a different language or need
    a refresher, `there is always an explanation of the scripts presented,` line by
    line.


    For the early beginner or if you need a review, please refer to the following
    eBook before attempting to read this one:


    [JavaScript in Plain Language – A Self-Study Method, JSON and AngularJS Prep](http://www.amazon.com/JavaScript-Plain-Language-Self-Study-AngularJS-ebook/dp/B00NQERIEI).


    Each topic has been kept short on purpose; yet, packed with information normally
    missed in introductory books or even in many of the more advanced writings. The
    author assumes that anyone adventuring into JavaScript has the capacity to learn,
    if given a change to do so.


    The book has not just been written for `newer` developers. It is also intended
    for those already involved with JavaScript but lacking time to search for detailed
    explanations of why JavaScript works the way it does. This book is the result
    of many hundreds of hours of research and lab testing by the author, and intends
    to give every reader `something` worth taking.


    `JavaScript Objects Functions and Arrays Explained` will give you the foundation
    needed to move into more complex books: It will open many doors of understanding
    without insulting anyone’s intelligence.


    **Welcome to the second edition of JavaScript Objects Functions and Arrays Explained.**


    ## A note from the author


    Dear reader,


    Thank you for choosing to read `JavaScript Objects Functions and Arrays Explained`.
    With so many great books out there, it is a real honor and a humble experience
    to feel welcome into your inner world and I will work hard in this writing to
    make it worth your while.


    This book is a `hands-on` approach. Theory and lab will come together, to bring
    concepts to a full understanding. You may decide to do a quick reading of the
    material or just use it as a reference. However, the book can also be `executed`.
    I suggest taking the last approach first and later return to read at random.


    Aside from one-line scripts, all other sample code will have a link to a `raw
    file`, giving you a choice of copy and paste into the console, or of coding it
    from scratch.


    The book explains the `newly available` JavaScript native objects, as well as
    how to create your own. I have spent many days meditating on each topic, paragraph
    by paragraph, to find the best way to approach each one of them in an effort to
    convey that information more effectively. As much as I enjoy writing, my love
    for teaching is deeper.


    Native objects are the most used objects in JavaScript because they are faster
    and well recognized by modern browsers. Yet, several authors choose to teach object
    `construction` right from the beginning, confusing readers with terminology and
    concepts the student may never see again in real life. I guess this approach mimics
    the way other languages are taught. But JavaScript is not any other language.
    JavaScript is a combination of `ECMAScript`, plus the `host environment`. Its
    mutant characteristic makes it behaves differently each time, depending where
    and how it is going to be used.


    In this book, concepts will come in `layers` and nothing will need to be memorized.
    When I first started my research for the book, I was caught in awe by the complexity
    of JavaScript Objects. Complexity in the sense that JavaScript is not like any
    other language; it resides apart in its own world. The legend goes that [Brendan
    Eich](http://en.wikipedia.org/wiki/Brendan_Eich), the inventor of JavaScript,
    wanted to do a Scheme-like (Lisp dialect) language for Netscape, but a reality
    check intervened, forcing him to compromise with a C/Java syntax, which was familiar
    to a plethora of programmers already on the field. In the `ECMAScript 5` official
    publication, one can read the following: “Some of the facilities of ECMAScript
    are similar to those used in other programming languages; in particular Java™,
    Self, and Scheme*”


    Today, many developers hate the language for what it is not; but once they get
    to know it, they love the language for what it is. I certainly love the language
    as it positively surprises me almost every day!


    Thank you for this opportunity,


    *Tony de Araujo*


    Technical writer – New Jersey, 2013


    ## About the Second Edition


    The Second Edition of this eBook was published in early `June, 2014`. In reality
    this eBook has been updated on a regular basis, almost monthly. The reason to
    publish it as a Second Edition is because the Index has been subdivided into five
    parts instead of only the prior two. The titles and subtitles of each topic remain
    basically the same but this subdivision makes it easier to determine which topics
    to review the second time around.


    Some illustrations have been improved and a few misspells have been corrected.


    Hyperlinks have been checked for validity. Also exercise URLs have been written
    explicitly for a possible printout of the eBook.


    Other than that, the author has asserted the material as current and relevant
    to his goals for the book.


    ## Color Representation in This Book


    - **ORANGE** - New term or element: *make a mental note of it*.

    - **BROWN** - Previously introduced element

    - **GREEN** - New `action` to take: *Focus on the action*.

    - **BLUE** - Blue represents an external link for further reading.

    - **BLUE** - Some `side notes` are also written in blue to call attention.


    Images of code scripts will have links to an actual script. They will be listed
    as raw files.

