    \ book. Do not get distracted searching the internet because you will get lost\
    \ and you will get confused. Most of what is written on the internet is a copy\
    \ of a copy of a copy and as you know garbage in, garbage out.\n\nDon’t take me\
    \ wrong, there is a lot of goodness online and I have learned my share from it\
    \ which I’m thankful. But there is great danger and I have wasted so much time\
    \ trying to understand the understandable because copying is not teaching. Teaching\
    \ is explaining and giving room for the reader to think and come to his or her\
    \ own conclusions. Sometimes we have to tell a story and let the reader put the\
    \ pieces of the puzzle together. Telling a story is a way to convey information\
    \ without forcing anyone to memorize what they don’t understand. I’m a great fan\
    \ of metaphors. They expand our horizons exponentially.\n\nYou have come a long\
    \ way and I am proud of you because you have endured my writing and arrived at\
    \ the end of the book. The end is just the beginning, right?\n\nAs a mental review,\
    \ here is what you have covered:\n\n*   Memory concepts. Stack versus Heap.\n\n\
    *   The value of reference types.\n\n*   Everything in JavaScript comes from objects.\n\
    \n*   You have become good friends with the JavaScript Console.\n\n*   You have\
    \ played with functions and they also became your friends.\n\n*   The untouchable\
    \ Object. Pointers, primitives, object wrapping.\n\n*   Execution context, scope,\
    \ private variables, this, the role of functions in privacy.\n\n*   Native objects,\
    \ hosted objects, user objects.\n\n*   Anonymous functions, closures, call functions,\
    \ apply.\n\n*   String objects, Arrays, new methods of interaction.\n\n*   Arguments,\
    \ nested functions, Lexical scope.\n\n*   Functions as object constructors.\n\n\
    *   Math, Date constructs. Libraries.\n\n*   Unordered lists, inheritance, encapsulation.\n\
    \nWe could have continued on, but what good is a 400 page book if it goes unread?\n\
    \nIt is best then to stop and think about what has been covered because if you\
    \ know this much, then you know quite a lot and everything else will be easier\
    \ to grasp.\n\nWith this knowledge you can go into more specialized books without\
    \ getting lost as easily because you have acquired some powerful concepts.\n\n\
    This book can also be used as a reference when you need to clear up your mind\
    \ about some method that is giving you problems and you just don’t see why.\n\n\
    I am planning to keep on improving the book, by reading it, editing it, adding\
    \ to it, and always, thinking of you and what you would like to find in this writing.\n\
    \nIt has truly been an honor and a very exciting experience writing this book.\n\
    \nThank you so much!\n\nTony de Araujo\n\n*Edited last on May 29^(th), 2014*\n\
    \n  One More Thing…\n\nThanks for reading and investing your time doing the exercises!\
    \ If you have enjoyed this eBook or found it useful in any way, I’d be very grateful\
    \ if you'd post a short review on Amazon. It really makes a difference to myself\
    \ and to others looking for ideas about this subject.\n\nIf you would like to\
    \ leave a review please go to my [Amazon profile](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)\
    \ and click on the book from there.\n\nThank you again for your support!\n\nTony\
    \ de Araujo\n\nNew Jersey, November 2013 | May 2014 | January 2015\n\n# APPENDIX\n\
    \n## Other eBooks from the author\n\n( As of January 2015 )\n\n1.  [JavaScript\
    \ in Plain Language - A Self-Study Method: JSON and AngularJS Prep](http://www.amazon.com/JavaScript-Plain-Language-Self-Study-AngularJS-ebook/dp/B00NQERIEI)\
    \ -  If you have found the currently book somewhat difficult to grasp this eBook\
    \ is for you. It introduces JavaScript concepts followed by advanced topics such\
    \ as JSON and AngularJS which is the modern way to include JavaScript on an HTML\
    \ page.\n\n2.  [Practicing AngularJS in HTML: Volumes I & II](http://www.amazon.com/Practicing-AngularJS-HTML-Mastering-JavaScript-ebook/dp/B00P6ZARCA/)\
    \ – This eBook covers the part of AngularJS written on the book describe above\
    \ and adds another level to it. It assumes the reader knows basic JavaScript and\
    \ HTML.\n\n3.  [Solid Steps into JavaScript: A hands on Approach](http://www.amazon.com/Solid-Steps-into-JavaScript-Approach-ebook/dp/B00HGLG4CO/)\
    \ – You may not need this book since it is less advanced than the one you’ve just\
    \ read. However, it is a solid book about basic syntax and a way to practice more\
    \ JavaScript. If you have to choose between this book or the one on the very top\
    \ which came out later, go with the top book because it covers other important\
    \ topics. However, if you can afford it and want to practice, then by all means\
    \ get both.\n\n4.  [Small Projects to Learn JavaScript - Drawing Six 'Lucky' Numbers](http://www.amazon.com/Small-Projects-Learn-JavaScript-Drawing-ebook/dp/B00H4P987A/)\
    \ – This is a short book but readers love it because it is a fun project to do.\
    \ In it the concepts covered on the basic books are reviewed and some new concepts\
    \ are added, such as methods from the Math library. It also introduces a way to\
    \ **embed JavaScript on HTML**.\n\n5.  [JavaScript innerHTML: A Project in Three\
    \ Acts](http://www.amazon.com/JavaScript-innerHTML-Project-Projects-Mastering-ebook/dp/B00JAOLFZ6/)\
    \ – This eBook is also a single project designed to introduce innerHTML. Important\
    \ concepts about JavaScript as used in HTML are covered. It is a fun topic for\
    \ a Sunday afternoon."
