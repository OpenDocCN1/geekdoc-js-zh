    both methods, and it is the one we mostly frequently use, which means that for
    the most part, either method will work.


    If however we are going to include several parameters, then `call()` will accept
    individual arguments to fine tune the script, whereas `apply()` will require the
    second parameter to be an array of arguments. This is the difference between the
    two methods, individual arguments versus an array. We will see how this works
    in the next exercises.


