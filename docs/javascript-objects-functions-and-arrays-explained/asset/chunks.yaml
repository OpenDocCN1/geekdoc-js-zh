    \ syntax）**代替**点语法**。如下：\n\n6- `shirt[\"color\"];` //结果为“white”。\n7- `Shirt[\"\
    material\"];` //结果为“cotton”。\n\n这取决于你试图实现什么，以及你对语法的偏好。中括号语法更通用，因为如果我们有一个要使用的数字*键*，可以使用它，而点语法不接受数字。我们将在以后更高级的实验中看到这一点。\n\
    \n***对象很难理解吗？**\n\n把变量想象成指向数据的符号；把*栈（stack）*想象成指向*堆（heap）*；并将堆中由栈中的指针绑定的*键值对*。如果没有指针，就不存在键值对。就像硬币一样，没有一面，另一面就不存在。未赋值的变量值为\
    \ **undefined**，但它仍然存在。如果你真的想丢弃一个变量，在使用完毕后将其赋值为 **null**。这将将其从工作内存中清除。要检查变量是否已赋值或未赋值，请使用\
    \ `typeof`。我们将在书的后面使用 `typeof` 来验证对象实例化时方法是否已激活，以避免方法重复。不要死记任何东西，保持练习，如果你的思绪走神了就回来读读。经常复习。\n\
    \n将 JavaScript 想象成对象的集合，这些对象从它们与其*交互*的“父对象”中继承功能。\n\n新对象也可以覆盖原始属性和方法并创建它们自己的。\n\
    \n这些新创建的属性可以通过对象的**原型（prototype）**属性，在每次我们实例化（复制）对象时向下传递（随着学习的深入，我们会介绍更多相关内容）。\n\
    \n我们还可以使用原型属性为现有对象分配（添加）新功能，甚至是针对**这个特定实例**向全局对象添加（因为添加到全局对象中的任何内容都是暂时的）。\n\n\
    让我们继续……\n\n8- `var shelf = {\"books\": 20, \"CDs\": 57, \"Magazines\": 19};`\n\
    9- `shelf.CDs;` //结果为 57。\n10- `shelf.books;` //结果为 20 现在尝试以下操作：\n11- `shelf.books\
    \ = 21;` //增加了一个。\n\n你也可以这样做：`shelf[\"books\"] = 21;`\n12- `shelf.books;` //结果为\
    \ 21。\n\n我们刚刚通过更改 `shelf` 变量中 `books` 的值，向*架子（shelf）*增加了 1 本书。\n\n让我们测试一下：\n13-\
    \ `shelf; //结果为 Object {books: 21, CDs: 57, Magazines: 19}.`\n\n我们还可以向对象*添加*（赋值）新项：\n\
    14- `shelf.audioBooks = 11;` 或 `shelf[\"audioBooks\"] = 11;`\n\n调用对象：\n15- `shelf;\
    \ //结果为：Object {books: 21, CDs: 57, Magazines: 19, audioBooks: 11} `\n\n如你所见，*变量*可以指向一组键值对数据，使该集合成为对象。然而，即使是普通字符串（尽管基本值），也从\
    \ Object 继承属性和方法，因为几乎一切都是对象。\n\n看以下示例：\n\n16- `var x = “tony”;` 然后编写以下代码：\n17-\
