    \ next)\n\nThe above script makes sense. We create a method arbitrarily called\
    \ `getFruit`, which returns our property `Fruits`. However there are a couple\
    \ of problems with it:\n\na) Because `y` is a constructor, we cannot call its\
    \ methods in its current form because an object constructor is just the **blueprint**\
    \ of the object. It reminds me of the `Date Object`. We need to *instantiate*\
    \ an object in order to use its methods. Also, although it is not mandatory, by\
    \ convention I should have capitalized `y` but I don’t want this to take us away\
    \ from our real topics: *a* and *b*.\n\nb) Once we *instantiate* a *new* *object*\
    \ we need to make sure that the method `getFruit` is applied to it (`this` new\
    \ object), and not to any other object. So we need to add a `this` prefix as a\
    \ *placeholder* to the method inside the constructor. Like `this.getfruit =`.\n\
    \n8- Add a `this` to `getFruit`:\n\n![](images/00076.jpeg)\n\nFigure 76 [raw file](http://icontemp.com/joagi/scripts/74.txt).[\
    \ icontemp.com/joagi/scripts/74.txt ]\n\nIn the script above we have addressed\
    \ problem (b). To address problem (a) we need to instantiate a *new object*.\n\
    \n9- Let’s instantiate an object from `y` called `myOb` (or whatever name you\
    \ wish): `var myOb = new y();`\n\n10- Now we can finally call `getFruit` from\
    \ `myOb`: `myOb.getFruit();` // returns \"apple\".\n\n**Summary:**\n\nWhen we\
    \ create an object, its properties are public, which makes it easier to *read*\
    \ and *write* properties. However, we can protect our object properties by initiating\
    \ them with the prefix `var`. Once we protect the object’s properties, the only\
    \ way to *fetch* data from them is through an `inner function` also known as an\
    \ **Accessor method** (because it is allowed to access the property). It is conventional,\
    \ although not mandatory, to name these Accessor methods `getSomething` (“something”\
    \ being the name of the property) because they are popularly called “**getters**”\
    \ methods. *Just a good habit to form*!\n\n#### 5.1.3 Mutation methods\n\nWhat\
    \ if we want to mutate (modify) one of the properties inside of our *protected*\
    \ object?\n\nBefore we made the decision to protect our object properties, we\
    \ also were able to **assign** a **new value** to any of the object properties\
    \ (the variables), like\n\n`object.property = \"otherValue\";`\n\nNow that our\
    \ properties are tagged with `var` as well as being inside of a `function` (*an\
    \ object property is always inside of a function*), we can’t modify them directly\
    \ from the outside because they are invisible to an external bracket syntax approach.\
    \ The only way to edit a private property is via an internal method that does\
