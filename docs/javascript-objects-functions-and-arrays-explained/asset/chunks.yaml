    # 2.2 The Array Object in JavaScript


    Arrays are *ordered list* objects. The order is what makes this object an array
    since objects by themselves are typically unordered.


    (For unordered lists please see 5.1 Unordered Lists as Objects.)


    In JavaScript an [array](http://en.wikipedia.org/wiki/Array) uses an index number
    pointing to a *pocket* where data may be stored. Contrary to other languages,
    in JavaScript there is no such thing as an Associative Array where the index is
    substituted by a string label. If you attempt to assign a label to a data pocket,
    it makes the data a property of the object, and it is not listed as an array item.
    If you really want *key-value pairs*, it is best to use the Object construct (*curly
    braces* which makes it an *unordered list*) instead of the array construct (square
    brackets). Object constructs will be covered in more detail in a later chapter.
    A link to that chapter can be found above this paragraph.


    Because of the Array rigid order, there are *specific methods* to append data
    to the beginning, to the end, and also to append in between items.


    The array constructor is as follows:


    var bcd = new Array("green","red","yellow");


    This declares a variable (a pointer) named *bcd* which points to an array object
    containing three string names. Notice the **new** keyword. Although we could skip
    “new” when we declare an array object like this, it is recommended to **always**
    include it if you use this type of construct (I mean the Array() function call).
    Notice how the first letter of **A**rray is capitalized, just like **O**bject
    and **S**tring object. In JavaScript, native and built in object names have their
    first character capitalized. Since JavaScript is case sensitive, all native and
    built in objects must be called upon exactly as they were created, in other words,
    with the first letter capitalized.


    JavaScript has a shortcut to create arrays, which is the **square bracket notation**.


    Instead of this: **var ijk = new Array( );** // creates an empty array.


    1- It is more common to do it this way: **var ijk = [ ];** 


    // creates an empty array.


    Contrary to some other languages, there is no need to declare the *number of items*
    the array can contain. JavaScript arrays adjust accordingly. When we add new items,
    just like it does with strings, JavaScript copies de existing data plus the new
    data into a new array instance and discards the old one, and at the same time,
    JavaScript tells the variable to point to the latest array instance.


    2- After declaring the above array **ijk**, we can add items like this:


    **ijk[0] = "red";** 


    // first location is always location **0**.


    **ijk[1] = "white";**


    **ijk[2] = "blue";**


    3- Call it like this: **ijk;** // returns ["red", "white", "blue"];.


    4- We can also call individual items like this: **ijk[0];** // returns "red".


    And just like the String object, the Array object inherits properties and methods
    from **object Object**.


    We will cover some of these properties and methods next.


    a) **Array properties** such as **length**, **prototype** and **constructor**.


    The **constructor** property has already been explained when we covered String
    objects. We will explore *constructors* during our lab work when we get to create
    our own objects at a later chapter.'
