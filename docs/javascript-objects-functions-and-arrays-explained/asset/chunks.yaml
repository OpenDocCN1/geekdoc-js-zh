    3- 再次调用“walnuts”的索引，但这次使用 `lastIndexOf()`：`x1.lastIndexOf("walnuts");` // 返回 2。


    尽管它从右侧搜索，但它报告的是从左侧计数的索引（它是递减而不是递增的）。


    4- 尝试一下“peanuts”：`x1.indexOf("peanuts");` // 返回 0。`x1.lastIndexOf("peanuts");`
    // 返回 0。


    从上面的示例可以看出，应用于此简单的脚本时，两种方法返回的内容没有区别。


