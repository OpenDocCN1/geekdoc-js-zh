    ![](img/00060.jpeg)

    图 60


    4- 创建一个独立的 `thankYouCard` 方法：


    ![](img/00061.jpeg)

    图 61


    我们**没有**直接对我们的任何一个客户使用 `thankYouCard` 方法，因为“`this`”将是*undefined*：


    ![](img/00062.jpeg)

    图 62


    但是，我们可以*使用*方法 `call()` 或 `apply()` 来绕过客户对象的‘this’，从而访问目标方法。


    **使用 call()**


