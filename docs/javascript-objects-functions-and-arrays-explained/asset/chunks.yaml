- fmt: "\n- Contrary to some other popular languages, there is no scope protection\
    \ inside of a JavaScript code block, except if this code block is a function.\
    \ This will change in EcmaScript 6 with the introduction of `let`. In JavaScript,\
    \ functions protect their variables, but only if predefined with the prefix `var`\
    \ when they are declared.\n- Although in the global scope the keyword `var` could\
    \ be omitted because the variable is available down the scope chain, it is good\
    \ practice to always write it down when we declare a variable in order to prevent\
    \ confusion and misinterpretation by the JavaScript interpreter. `var binds the\
    \ variable to its immediate scope`. In the latest ECMAScript 5, the omission of\
    \ `var` will actually throw an error.\n\n## 1.10 The Window Object – Intro\n\n\
    As mentioned before, the Global Object becomes the `Window` object, when using\
    \ JavaScript in a browser environment. \n\nLet’s do a little test to illustrate\
    \ this concept:\n\nFire up your JS Console and code the following:\n\n1. `var\
    \ myText = \"hello World!\";`\n2. `myText;` // returns “hello World!”\n3. `window.myText;`\
    \ // returns “hello World!”\n4. `console.log(myText);` // returns hello World!\n\
    5. `window.console.log(myText);` // returns hello World!\n6. `this.myText;` //\
    \ returns “hello World!” (`this` substitutes (points to) the object under which\
    \ the variable is `scoped at`. In this case it substitutes `window`). More about\
    \ it later.\n7. `this.console.log(myText);` // returns hello World!\n\n### What\
    \ about a function?\n\n8. Code the following in your text editor then paste in\
    \ the console (raw file available):\n\n![](images/00009.jpeg)\n\nFigure 9 [raw\
    \ file](http://icontemp.com/joagi/scripts/9.txt). [ icontemp.com/joagi/scripts/9.txt\
    \ ]\n\n9. `x;` // returns `function(){var text2 = \"hello JavaScript\";};`\n\n\
    Remember, `x` points to an expression which happens to be a function. We are not\
    \ calling the function here because we didn’t use parentheses as a postfix.\n\n\
    10. `window.x;` // returns `function(){var text2 = \"hello JavaScript\";};`\n\n\
    11. `text2;` // returns `text2 is not defined`. (`text2` doesn’t exist on the\
    \ global scope.)\n\n12. `window.text2;` // returns `undefined`. Same as above.\
    \ Window recognizes function `x`, but does not recognize the function’s local\
    \ variables.\n\n1- Consider the following loop where `i` is used as a temporary\
    \ counter ([raw file](http://icontemp.com/joagi/scripts/f1.txt)). [ icontemp.com/joagi/scripts/f1.txt\
    \ ]\n\n```javascript\nfor (var i = 0; i<5; i++){ console.log(i); }\n```\n// returns\
    \ 0,1,2,3,4\n\nAfter we run it, we no longer need the variable `i`, right?\n\n\
    2- Call `i`: `i;` returns 5 ( that’s no good, it’s keeping up memory unnecessarily).\n\
    \n3- Now try coding the same loop but inside of a function:\n\nSee [raw file](http://icontemp.com/joagi/scripts/f2.txt).\
    \ We used `y` instead of `i` just so that we don’t get confused. [ icontemp.com/joagi/scripts/f2.txt\
    \ ]\n\n4- Now if we try to call in `y`, the same as the earlier `i`, we get an\
    \ error:\n\n`y;` // returns y is not defined.\n\nThe function has effectively\
    \ isolated and destroyed the temporary variable. We still have `x` to worry about\
    \ because it points to the function, but `x` is more obvious to us and we could\
    \ assign it to `null`. In either case, the idea here is to illustrate how functions\
    \ can isolate variables from the global object (and also to start thinking about\
    \ possible [memory leaks](http://en.wikipedia.org/wiki/Memory_leak)).\n\nThe object\
    \ `window` is both: the ECMAScript’s `Global Object`, and also the browser’s `BOM`\
    \ central object.\n\nEach `window` represents an `instance of the browser` itself.\
    \ The object `window` is the `interface` between the core JavaScript language\
    \ and the browser. It represents the global scope for every variable and function\
    \ on the webpage.\n\nWe can add properties to the object `window` at will (although\
    \ not on a permanent basis).\n\n**Try this:**\n\n13- `window.color = \"green\"\
    ;`\n\nNote: This is actually declaring a variable named `color`. It is the same\
    \ as declaring the variable by itself excluding `window` because window is assumed.\
    \ However since we are grasping concepts please write window to cement the idea\
    \ behind it.\n\n14- `window.mood = \"happy\";`\n15- `window.gender = \"female\"\
    ;`\n16- `color;` // returns “*green*”.\n17- `mood;` // returns “*happy*”.\n18-\
    \ `gender;` // returns “*female*”.\n19- `this.color;` // returns green. (etc….)\n\
    \n## 1.10.2 An example of scope\n\nLet’s just make sure we understand about `\
    \ scope` (global) and `function scope` (local).\n\n1- Declare a variable, and\
