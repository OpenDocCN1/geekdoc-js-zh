- fmt: "\n1- Declare a variable: `var x = \"ninja\";`\n\n2- Add the property color:\
    \ `x.color = \"green\";` Console returns “green” (so it must have accepted it,\
    \ right?) Let’s test it and see:\n\n3- Enter `x.color;` returns “undefined”. **What\
    \ happened?** It didn’t save it. **In order to save a *property* we should send\
    \ it to the heap as a reference value**. Let’s do that….\n\n4- Declare another\
    \ variable but this time assign it to an object by creating the expression at\
    \ the heap (the braces will do that for you):\n\n`var y = { };`\n\n5- Now try\
    \ adding a property just like before: `y.color = \"green\";`\n\n6- Call the property:\
    \ `y.color;` // console returns “green”. Alright, *we’re in business!!*\n\n7-\
    \ Call it again with window just for fun:\n\n`window.y.color;` // returns “green”.\n\
    \n**What do you think it happened?**\n\nBy pointing a variable to a *reference\
    \ value*, we can add properties to it. When and if we delete, **dereference**\
    \ or reassign the variable, the object will automatically be placed on *garbage\
    \ collection* according to the browser’s implementation, and the memory will be\
    \ cleared once the object gets deleted.\n\nIn summary, we have created an object\
    \ under the window object. This object inherited all the properties and methods\
    \ available from window, also known as the Global Object. We will *peel* more\
    \ of this onion a bit later.\n\nNow let’s consider another important concept:\n\
    \nOur first variable `x` contains a value of “**ninja**”. Let’s assign “ninja”\
    \ to a second variable:\n\n8- Declare a new variable `z` and assign it to `x:`\
    \ `var z = x;`\n\n9- Test `z`: `z;` // returns “ninja”\n\n10- Now change `x` to\
    \ **samurai**: `x = \"samurai\";`\n\n11- Test `x`: `x;` // returns “samurai”.\n\
    \n12- Test `z;` `z;` // returns “**ninja**”.\n\n**What do you think it happened?**\n\
    \nIf `x` was pointing at an *object* when we assigne `z = x`, we would have told\
    \ `z` to *point at* the same object. However, `x` is a **string** variable located\
    \ in the *stack* because it is a **primitive value**. When we assign other variables\
    \ to existing primitive values we are actually copying the data into the new assignment.\
    \ We copied `x` into `z`. Then we changed the value of `x` which it didn’t affect\
    \ the value of `z`, right?\n\nThis is called **passing data by value** and it\
    \ is what happens with primitive values.\n\nEvery time we assign a value to another\
    \ variable it gets copied into the variable itself because in the stack, a variable\
    \ and its stack data is all **one unit**. As a helper to remember “passing by\
    \ value”, think of “adding value” when you duplicate (copy) stuff (I know it’s\
    \ cheesy but it may help).\n\nWhen it comes to reference values (the ones in the\
    \ heap), things work a bit differently. That’s why they are called *“reference”*\
    \ and we will see the difference in a second. This is obviously called **passing\
    \ data by reference** (by pointing instead of copying).\n\nLet’s do some more\
    \ testing:\n\nYou should still have your **object** `y` in the console (if not,\
    \ create a new one again by following steps 4 & 5 above).\n\n13- Test `y` just\
    \ to be sure: `y;` it should return *Object {color: \"green\"}*\n\n14- Assign\
    \ a new variable `b` to ***y***: `var b = y;`\n\n15- Test `b`: `b;` // it should\
    \ return *Object {color: \"green\"}*.\n\nNow `y` and `b point to the same object\
    \ *source***.\n\n16- Add a new color to `y`:\n\n`y.color2 = \"red\";`\n\n17- Test\
    \ `y`:\n\n`y;` // returns *Object {color: \"green\", color2: \"red\"}*\n\n18-\
    \ Test `b`: `b;`// returns *Object {color: \"green\", color2: \"red\"}*\n\nAs\
    \ seen, reference values don’t get copied when we assign a second variable to\
    \ them.\n\nHere the variable acts as a *pointer*, and a reference value can have\
    \ many pointers. If one of the pointers edits the data from the object, the other\
    \ pointers will reflect the same data from the same object. This saves memory\
    \ but we also need to be careful because if we want to **dereference** the object\
    \ in order to clear memory space, we need to make sure that we dereference all\
    \ the variables pointing to the object.\n\n**What would happen to b, if we reassigned\
    \ y to a different object?**\n\nLet’s try it:\n\n19- Reassign `y`: `y = {\"color\"\
    : \"violet\"}`\n\n20- Test it: `y;` // returns *Object {color: \"violet\"}*\n\n\
    21- Test `b`: `b;` //b remains the same: *Object {color: \"green\", color2: \"\
    red\"}*.\n\n22- Let’s practice **dereferencing** objects by first, assigning another\
    \ variable to `b`:\n\n`var c = b;`\n\n23- Test `c;` // returns *Object {color:\
    \ \"green\", color2: \"red\"}*\n\n24- Dereference `b`: `b = null;`\n\n25- Test\
    \ `c`: `c;` // returns *Object {color: \"green\", color2: \"red\"}*\n\n26- Dereference\
    \ `c`: `c = null;`\n\n27- Test `c`: `c;` // returns null\n\nThe object has finally\
    \ been sent to **Garbage Collection** and it will be disposed of because there\
    \ is no reference pointing to it from the stack. It will be deleted on the next\
    \ memory sweep.\n\n## 1.11.2 How to pass in data from the stack to the heap\n\n\
    One way to pass data from the stack to the heap is as an *argument* in a function\
    \ *call*.\n\n![](images/00012.jpeg)\n\nFigure 12\n\nIn JavaScript, *primitive*\
    \ data from a variable can be passed *into* a function as a copy, via a function\
    \ ***argument*** which is given to a function ***parameter***.\n\nThe parameter\
    \ acts as the *interface* between stack and heap. In other words, the data in\
    \ the variable and the data being passed into the function become independent\
    \ of each other. (`x` above is pointing to function, but `x(33)` is copying into\
    \ the function). So even though a function resides in the heap, we are **not**\
    \ pointing or **passing by reference**, we are actually cloning the data to be\
    \ processed by the function, which is the same as *passing by value* (remember?\
