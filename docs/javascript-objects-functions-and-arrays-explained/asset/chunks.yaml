    The **String** Primitive type is a strange one! Normally in other languages Strings
    are considered a **Reference type** but in JavaScript the string is a **Primitive**
    type.


    As we know Strings can vary in size so in JavaScript, when you add words to a
    string, the current string is replaced by another string containing the newly
    added data. Since the variable and its data is one in the same when it comes to
    primitive values, the whole variable is replaced when we modify the string. This
    replacement happens because of the memory size necessary to accommodate the new
    data. The replacement happens in the background and we never notice the difference.


    A string value can store 0 or more characters and each character is represented
    by a 16-bit positive integer. The first position is numbered zero. Therefore,
    in a string “Tony”, the *position* of the *last character* **is** the length of
    “Tony” **minus 1** since it starts at zero. When a string contains actual textual
    data, each element is considered a single UTF-16 [code unit](http://en.wikipedia.org/wiki/Code_point).


    *In short*, (this will be demonstrated later) JavaScript strings are actually
    stored in the stack because they are primitives. If the string expands, **a new
    string replaces the old string** and the old *data* is discarded.


