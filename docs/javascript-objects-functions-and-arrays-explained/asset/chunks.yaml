    \n**练习 18 ... 19 发生了什么？** \n\n记得图 3 吗？似乎尽管 JavaScript 没有将“tony”移动到堆中将其转换为“官方”对象，但由于**对象包装（object\
    \ wrapping）**，字符串仍然拥有可用的属性和方法。在 JavaScript 中，最好的办法就是仅仅将其看作对象。从这个角度来看代码更有意义。\n\n\
    ## 1.5 更多变量，添加函数。\n\n### 当我们将函数赋值给变量时发生了什么？\n\n## 1.5.1 实验 3\n\n1- 在简单的编辑器中编写此函数（我使用的是*记事本*）并将其复制到\
    \ JavaScript 控制台（你也可以点击**原始文件**链接复制我的文件）：\n\n![](img/00004.jpeg)\n\n图 4 [原始文件](http://icontemp.com/joagi/scripts/4.txt)。[\
    \ icontemp.com/joagi/scripts/4.txt ]\n\n**注意分号**。这是一个**函数定义**语句，意味着我们正在定义变量 `addMe100`，它指向堆上的某个未命名函数对象，该对象反过来会向传递给它的任何*参数*加\
