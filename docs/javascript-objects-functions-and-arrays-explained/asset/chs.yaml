  \n- **你 true 如何向对象原型声明一个新方法吗？** `objectName.prototype.methodName =`\n- 方法由一个或多个函数组成。我们将“`this`”附加到变量而不是对象名称上，以便使其具有通用性，从而可以应用于任何*实例*。\n\
