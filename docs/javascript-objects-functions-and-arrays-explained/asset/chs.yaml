  \ `y` 和 `index` 是任意名称。你可以为它们命名为任何名称。\n\n**注意：** `forEach` 像循环一样对数组中的每个项目调用一次回调函数。调用按升顺序进行。\n\
  \n有时会使用第三个参数来指定正在遍历的数组。\n\n`forEach` 函数是有意通用的；它并不要求第三个参数必须是 Array 对象。因此，它可以作为方法传递给其他类型的对象。然而，`forEach`\
  \ 在其他类型对象上的功能取决于实现。\n\n**欲更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n· [15.4.4.18 Array.prototype.forEach](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.18)。\n\
  \n## 2.3.2 map()\n\n`map()` 方法遍历数组的方式与 `forEach()` 相同，不同在于它实际上会返回一个值，正因为它返回了值，它可以根据第一个数组创建一个修改后的第二个数组。此外，与\
  \ `forEach()` 为迭代的每个项调用一次函数不同，`map` 在整个过程中只调用一次函数。\n\n这是一个示例：\n\n1- 声明一个新数组（见图像下方的原始文件）：\n\
  \n```\nvar firstArray = [\"amazon\", \"nile\", \"kwanza\"];\n```\n\n2- 声明第二个数组，通过映射并返回\
  \ `firstArray` 的内容为其赋值。为了确保它们在视觉上不同，将它们转换为大写。在编写完 map 脚本后，调用第二个数组：\n\n![](img/00024.jpeg)\n\
  \n图 24 [原始文件](http://icontemp.com/joagi/scripts/22.txt).[ icontemp.com/joagi/scripts/22.txt\
  \ ]\n\n就像在 `forEach()` 中一样，我们使用一个函数来存储某些代码，这些代码从指向的数组获取项并以大写形式返回。此返回值被赋值给另一个数组（我们的\
  \ `secondArray`）。\n\n通过使用 `map()` 而不是 `forEach()`，每个元素都被复制到我们命名为 `secondArray` 的另一个数组中，并通过\
  \ `return` 机制。如果你尝试将 `forEach()` 赋值另一个数组，它不会像 `map()` 那样工作。就像 `forEach()` 一样，`map()`\
  \ 只是一个宏，它的魔力在于内部。我们做的只是输入要处理的参数（例如在我们的案例中是“item”）。\n\n**欲更多信息，请参考以下 ECMASCRIPT 5\
  \ 页面：**\n\n· [15.4.4.19 Array.prototype.map](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.19)\n\
  \n## 2.3.3 every()\n\n`every()` 方法是另一种迭代机制。被称为“every”是因为无论检查什么，对于数组中的每个项（所有项）都必须为真，否则它将返回\
  \ false。这是一个只读方法。它不会更改原始数组中的任何内容。它可以用于测试和搜索，例如使用 `every()` 检测数组并根据结果做出决策。\n\n这是一个示例脚本，其中我们检查元素是否全奇数或全偶数。如果是偶数，返回\
  \ true，否则返回 false：\n\n1- 声明一个包含奇数和偶数混合的新数组：\n\n```\nvar abc = [1,2,3,4,5];\n```\n\
  \n2- 使用 `every()` 方法调用数组 `abc`，使用一个检查偶数的函数。如果项都不匹配，`every()` 的结果将是“false”：\n\n![](img/00025.jpeg)\n\
  \n图 25 [原始文件](http://icontemp.com/joagi/scripts/23.txt).[ icontemp.com/joagi/scripts/23.txt\
  \ ]\n\n**记住前两个方法：**：“item”只是一个代表数组每个元素的通用名称。它通过指向每个元素来充当接口（我强调了*每个*，因为所有这些方法都是 `forEach()`\
  \ 的不同版本）。当 `item*` 指向数组元素且函数执行其魔力时，`every()` 收集结果并将它们应用于我的正程序中（正程序位于正文内部）。\n\n如果反过来（在这种情况下）数组是“全偶数”的（根据示例脚本），`every()`\
  \ 将返回 *true*。\n\n记住，这个函数的目的是存储在 `every()` 调用该函数时可以使用的代码。这个内部函数不需要具名，它被称为匿名函数或回调函数，因为它在需要时被回调调用，并且没有理由有它的指针，因为它是\
  \ `every()` 脚本内部的。\n\n3- 这是一个将返回 true 的数组示例：\n\n```\nvar xyz = [2,30,40,60];\n```\n\
  \n4- 在声明上一步的数组后，更改上方图中的，将 `every()` 应用于 `xyz` 而不是 `abc`。结果应该是 *true*。\n\n**欲更多信息，请参考以下\
