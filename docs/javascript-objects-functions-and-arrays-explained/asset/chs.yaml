  \ 的随机数，就需要给该方法加上一个常数。例如，如果我们加上 5，就会得到从 5（包含）到 6（不包含）的数字：\n\n```javascript\nMath.random()\
  \ + 5;\n``` \n // 尝试几次。我们得到像 5.2907 等数字。\n\n假设我们想要 **1 到 10** 之间的随机数。我们将该方法的结果乘以\
