  \n## 3.2 函数属性与方法\n\n## 3.2.1 apply() 和 call()\n\n有时我们想要调用的对象在当前执行环境中并不是拥有我们函数的对象，由于“`this`”指的是调用时调用脚本所属的对象，它将阻止我们访问预期的目标，因为该目标不是当前指向脚本的对象。这时，`call()`\
  \ 或 `apply()` 方法就变得有用了。JavaScript 库中的这两个机制允许我们从其他对象借用方法，而无需重新编写它们。这就像是从外部源**导入**到当前执行环境，并像点餐一样（这与[定食套餐](http://en.wikipedia.org/wiki/Table_d%27h%C3%B4te)\
  \ 相反）。\n\n我可视化 `call()` 的方式是记住 *call* 一词的含义之一，即“引用”、“或“视为”、“应用于”。`apply()` 也是如此。\n\
  \n**前言：**\n\n`call()` 或 `apply()` 中包含的参数在两个方法中的作用相同，这也是我们最频繁使用的，这意味着在大多数情况下，任种方法都可以工作。\n\
  \n但如果我们要包含多个参数，那么 `call()` 将接受单个参数来精细调整脚本，而 `apply()` 则要求第二个参数为参数数组。这就是这两个方法的区别：单个参数与数组。我们将在下一个练习中看到它是如何工作的。\n\
