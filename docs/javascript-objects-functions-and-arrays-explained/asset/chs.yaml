  \n10- 使用水果调用函数：`f(\"banana\",\"apple\",\"grape\",\"peach\");` // 返回香蕉是水果，苹果是水果，葡萄是水果，桃子是水果。\n\
  \n总结来说，新的 arguments 对象结合函数的形式参数开启了巨大的可能性。\n\n当你需要特定的输入序列时使用形式参数，在需要创意脚本时使用 arguments\
  \ 对象。\n\n最后两个练习对某些读者来说可能有点难，但请不要在这里停止。在接几个主题中一切都会变得清晰。给它机会吧。\n\n## 3.1.2 嵌套函数\n\n\
  嵌套函数是函数内部的函数。这些内部函数访问外部函数的所有数据，赋予了它们巨大的力量。下一个主题的目的是对内外部函数的一些重要特征建立理解。\n\n## 3.1.3\
  \ 闭包的简单介绍\n\n1- 假设我们将数组赋值给变量 `ara`：\n\n`var ara = [1,2,3,4,5];`\n\n2- 我们将 `ara`\
  \ 赋值给 `ujo`，然后将 `ujo` 赋值给 `tony`：\n\n`var ujo = ara;`\n`var tony = ujo;`\n\n*我们做了什么？*\n\
  \n我们创建了三个指向堆中同一个数组的变量，对吗？\n\n让我们测试一下：\n\n3- `ujo;` // 返回 `[1,2,3,4,5]`。\n\n4- `tony;`\
  \ // 返回 `[1,2,3,4,5]`。\n\n5- `ara;` // 返回 `[1,2,3,4,5]`。\n\n6- 如果我们现在将原始变量 `ara`\
  \ 声明为 `null`：\n\n`ara = null;`\n\n\n\n\n## 3.1.5 词法作用域 (Lexical Scope)\n\nLexical（词法）是指“引用事物的词”或“事物的清单”。在没有闭包的语言中，局部变量的生命周期随着作用域的执行而结束。然而，在像\
  \ JavaScript 这样的语言中，只要有闭包包裹它们，变量在代码执行完成后仍然会存在。\n\n由于 JavaScript 中的作用域是由函数决定的，因此函数也是创建闭包环境的主体，将变量和参数与运行进程连接起来。正如你记得的，当内部作用域机制指向外部作用域的数据时，JavaScript\
  \ 需要保留可能有用数据的日志，以防止任何活跃的作用域被清除。这种持久化方法通常由垃圾回收机制来实现。垃圾回收由浏览器管理，并根据运行 JavaScript 的浏览器及其版本而异。\n\
  \n下图插图了一组嵌套函数及其作用域环境，也称为词法（或静态）作用域，“每一个内部层级都可以访问其外部层”：\n\n![](img/0045.jpeg)\n图\
  \ 45\n\n\n\n\n**这是一个核心概念：** 每当我们调用一个函数来评估一个参数时，我们都在创建一个具有全新的完整可用变量列表和其他资源的新函数。当函数返回时，这些列表会被擦除。\n\
  \n**变量搜索：** 对于每一个不同的作用域，都会创建一个名为 `activation object`（激活对象）的列表。激活对象是所有可用变量的列表。激活对象保存在`heap`（堆）中，使其持续时间比在临时栈中更长。这就是`interpreter`（解释器）在查找变量时遍历的`chain`（链）。它从局部作用域，即脚本执行的最内层作用域开始；如果不在，就向上一步；如果那里也没有，就继续向上，直到到达该脚本作用域环境的末端。找到的第一个具有\
  \ `given name` 的变量就是要使用的那个。即使在链的其他地方有同名的变量，一旦解释器找到了第一个目标，它永远不会再去那里。\n\n实际上每个函数都可以被视为一个\
  \ `closure`（闭包），因为函数可以访问全局变量，还可以访问外部函数的变量（如果有的话，父函数，而不是兄弟函数）。如果闭包不是函数及其整个作用域内所有可用变量的结合，它还能是什么呢？在不再需要时务必\
  \ `return` 你的闭包函数，以便垃圾回收工作工作并在长期来看节省内存。避免[内存泄漏](http://en.wikipedia.org/wiki/Memory_leak)。\n\
  \n**提醒：** 我之前提到过，当变量赋值给函数参数时，数据会被复制，它与该变量保持独立。这与闭包无关，因为闭包“链接”并不是通过函数参数发生的。闭包函数（任何函数）实际上保留了外部变量（所有变量）的引用，因为它们被自动绑定到这些变量，这意味着如果函数内部有指向外部作用域变量的赋值，闭包函数实际上可以在其数据处理过程中\
  \ `update`（更新）外部变量。因此，通过参数从栈传递到堆的数据与通过直接调用外部变量呈现给函数的数据之间是有区别的。前者是数据的拷贝；后者仅是一个指针。而指针具有修改其所指向位置数据的能力。\n\
  \n1- 这是一个我意思的示例。请尝试下面图片中的练习，如果需要理解发生了什么，请阅读注释：\n\n![](img/00046.jpeg)\n\n图 46 [原始文件](http://icontemp.com/joagi/scripts/38.txt).[\
  \ icontemp.com/joagi/scripts/38.txt ]\n\n**注意：** 如果函数内部的变量 `x` 写成这样：`var x = x *\
  \ num`，`var` 将为 `x` 创建一个新的作用域，这将使其成为与外部 `x` 独立的 `x`。在这种情况下，外部的 `x` 不受计算的影响。\n\n\
  ## 3.1.6 arguments 对象与内部函数\n\n`inner` 函数可以访问 `outer` 函数的 `variables`（变量）和 `parameters`（参数），以及全局变量。\n\
  \n然而，内部函数并没有`direc`t 直接访问外部函数的 `arguments object`；只有在当 `arguments` 被指定为形式参数时才可以。\n\
  \n记住这一点很重要，因为如果你没有意识到，这可能会让你困惑。\n\n现在，为什么父函数的 `arguments object` 对内部函数是不可见的呢？\n\n\
  因为内部函数即使是空的，也有自己的 `arguments object`。\n\n所以当我们调用对象 `arguments` 时，我们谈论的是哪个 `arguments`：是内部的\
  \ `arguments` 还是外部的 `arguments`？当我们告诉内部函数返回参数对象时，它返回它自己的，那可能是一个空集。\n\n如果你需要复习 `arguments\
  \ object` 与 `通过形式化参数的 arguments`，请参阅本章的开头。\n\n让我们编写一些代码来证明确实如此，并看看我们如何绕过它。\n\n1-\
  \ 单独创建一个名为 `mx` 的函数并测试它（从下面的图片获取 `raw file`）。\n\n2- 然后创建一个 `inner` 函数，并尝试使用外部函数的\
  \ `arguments object` 看看会发生什么。只需按照图片上的指令操作即可。\n\n**注意：** 在这些示例中，我们没有直接调用参数“num”（那样是可以运行的）；我们调用的是整个\
  \ `arguments object`。让我们来看看：\n\n![](img/00047.jpeg)\n\n图 47 [原始文件](http://icontemp.com/joagi/scripts/36.txt).[\
  \ icontemp.com/joagi/scripts/36.txt ]\n\n在上面的示例中需要记住的是，我们正尝试使用内部函数来访问外部函数的参数 `object`，而不是外部函数的形式参数（例如括号中的“num”）。最后一个例子（第\
  \ 22 - 27 行）运行良好，是因为我们通过`将内部函数绑定`到外部函数的参数对象上（第 24 行），从内部函数内部访问了外部参数对象。\n\n记住，内部函数可以访问外部函数的变量。函数的\
  \ `formal parameter`（形式参数）充当 `temporary variable`（临时变量）。然而，当我们尝试访问 `object arguments`\
  \ 本身（它不被视为参数）时，我们需要指定我们说的是哪个对象，因为内部函数也有自己的参数对象，而且那个具有优先级。\n\n## 3.1.7 “this”变量\n\
  \n让我们揭开 `this` 关键字的另一层含义。在之前的章节中，我们提到过 `this` 的用法就像我们使用代词“whose”一样。你可以把“this”想成一个指向`上一个提到的对象`值的变量，或者说是脚本在其作用域下运行的那个。让我们启动\
  \ JS 控制台来玩玩“this”这个概念：\n\n1- 创建一个变量 `x` 和一个打印 `x + m` 的简单函数：\n\n![](img/00048.jpeg)\n\
  \n图 48 [原始文件](http://icontemp.com/joagi/scripts/39.txt).[ icontemp.com/joagi/scripts/39.txt\
  \ ]\n\n2- 通过加 10 来调用函数：`y(10);` // 返回 355，一切正常，因为 345 + 10 = 355。\n\n让我们看看在这种语境下如何应用\
  \ `this`。我知道这有点过度，但请跟我坚持，这是有意义的。我们知道 `x` 是全局变量，所有全局变量都是 `Object` 的属性，在浏览器中被称为 `window`。\n\
  \n- 我们通过应用变量 `x` 的完整路径来重做函数：\n\n![](img/00049.jpeg)\n\n图 49\n\n- 通过加 11 调用函数：`y(11);`\
  \ // 返回 356，运行得良好，对吧？\n\n既然我们可以通过名称或通过绑定（binding）到 `window` 对象来调用全局变量，那么当我们将其绑定到“this”时它也应该工作，因为它代表了拥有函数的对象，*window\
  \ 对象*，对吧？\n\n- 再次修改函数：\n\n![](img/00050.jpeg)\n\n图 50\n\n- 通过加 20 调用函数：`y(20);`\
  \ // 返回 365，运行得良好。同样的过程！\n\n- 我们对这个小家伙进行一次“石蕊测试”。在函数内部添加一个与外部变量同名的变量。你从之前的阅读中知道，通常情况下，如果命名相同，函数会忽略外部变量而只使用内部变量，因为它是它找到的第一个，对吧？在在这种情况下不是的，因为我们正在绑定外部变量，以确保脚本理解我们的意思。\n\
  \n让我们看看：\n\n![](img/00051.jpeg)\n\n图 51\n\n- 通过加 20 调用函数（和之前一样）：`y(20);` // 返回 10365，运行得良好。它加了\
  \ `outer x` + `m` + `inner x`。\n\n\n\n\n\n所以 `this` 只是指向其父对象的快捷方式。在大多数情况下，只要我们记住这个概念，就不会出错。使用\
  \ `this` 的动为了可移植性。它允许创建通用脚本，并根据在任何给定时间调用的主体，将其应用于不同的主体。每当我们引用一个属性（变量）而没有使用对象名作为点前缀（或用\
  \ `this` 代替）时，会被理解为该对象首先是一个本地对象，其次是脚本所属作用范围下的全局对象。\n\n至于我们示例中的 `this`，即使我们使用了内部函数（见下图），`this.x`\
  \ 仍然指向全局（window）属性 `x`：\n\n![](img/00052.jpeg)\n\n图 52 [原始文件](http://icontemp.com/joagi/scripts/43.txt).\
  \ [ icontemp.com/joagi/scripts/43.txt ]\n\n**注意：** 这个概念很简单，但我们应该记住，变量 `this` 只有在对象调用脚本时才会被赋值给相关的对象名称。这被称为“后期绑定”。当我们调用函数时，`this`\
  \ 将代表我们调用函数所在的对象。在我们的情况下，它运行正常，因为我们的函数 y 绑定到了 window。调用该表达式的显式路径实际上是：`window.y(20);`\
  \ // `y(20)` 只是一个快捷方式。\n\n如果在编写脚本的另一个面向对象的上下文中，我们想要为另一个对象的实例调用函数，那么 `this` 将代表该对象的实例，而不是它的原型。然而，我们需要确保自己没有意外地调用错误的对象。有时，使用\
  \ `Call()`、`Bind()` 或 `Apply()` 方法来代替 `this` 是最好的，特别是涉及到回调函数时，因为上下文可能会发生变化，并且当函数被回调时，对象可能不再指向该脚本。这些方法很快就会介绍，`this`\
  \ 的概念也将得到扩展。让我们继续剥这个洋葱吧！\n\n## 3.1.8 函数作为对象构造函数\n\n我们可以使用函数来构建自己的对象，有点类似于原型，然后我们可以从原型中实例化其他具有相同功能的副本。如果说函数是可被相互调用以协同工作的脚本集合，那么对象被视为函数和变量的容器，它们结合在一起表示一个公共的功能（数据和行为）。\n\
  \n为了构建一个对象构造函数，我们像创建任何其他函数一样创建一个函数，但由于它是未来对象的原型模具，我们遵循 JavaScript 的惯例，即构造函数名称的首字母大大写，以便在视觉上将这个“3D\
  \ 打印机”函数与其他普通函数区分开，因为它的目的是实例化其他对象。这允许我们识别出即将繁殖的所有小蜜蜂中的“蜂王”。以一种形象化的方式，我们创建了一个表单本（Form\
  \ pad），然后每当我们创建（填写）一个新表单时，都会撕下每一页。\n\n![](img/00053.jpeg)\n\n图 53\n\n1- 函数对象构造函数的基本结构如下：\n\
  ```javascript\nfunction JobApplication() {\n  // 属性放在这里；\n}\n```\n\n由于我没有使用我们在本书中一直使用的变量声明，所以不需要在末尾加分号。请注意，我们正在创建一个全新的对象构造函数，而不是\
  \ `Object` 对象的实例。当然，我们可以使用变量声明，但这种设计更常见。还要记住，它会作为函数被提升到作用域的顶部（参见 1.6 具名函数与匿名函数）。\n\
  \n`JobApplication` 是我们上面创建的函数名称。它也是我们对象原型的名称。\n\n通过声明上述函数，我们正在为职位申请创建一个模板。现在，我们需要在函数内部设计几个文本框，以便表单具有意义，因为现在我们只有一个空白的表单或一个空的容器。\n\
  \n2- 让我们重新制作我们的职位申请，加入一个我们想要从申请者那里获取的属性（职位）（如果你想复制，请查看图像下方的原始文件链接）：\n\n![](img/00054.jpeg)\n\
  \n图 54 [原始文件](http://icontemp.com/joagi/scripts/45.txt). [ icontemp.com/joagi/scripts/45.txt\
  \ ]\n\n在这里，我们创建了一个表单，允许申请者在填写表单时向函数插入职位。我们的第一个申请者到达了，我们从申请本上撕下一张表单供他填写。我的“撕下一页”，意思是创建一个申请的新实例。\n\
  \n3- 我们以以下方式创建申请的新实例：\n```javascript\nvar tonyDeAraujo = new JobApplication(\"writer\"\
  );\n```\n\n创建了一个变量 `tonyDeAraujo`，并将一个新的 `JobApplication` 赋值给该变量，通过函数参数传入了“writer”这一职位。\n\
  \n4- 在控制台中这样测试它：\n```javascript\ntonyDeAraujo; // 返回 JobApplication {position: \"\
  writer\"}\n```\n\n关键字 `new` 将 `JobApplication` 模板绑定到变量 `tonyDeAraujo`，并带有一预配置的属性。在这种情况下，唯一的可用属性是“position”，它反映了\
  \ `tonyDeAraujo` 在他的申请中填写的职位。JavaScript 如何知道这是谁的职位呢？它通过附加到 position 上的通用变量 `this`\
  \ 知道。`this` 留下了调用函数的对象的位置。\n\n**tonyDeAraujo 是一个对象吗？**\n\n5- 让我们测试 tonyDeAraujo\
  \ 是否一个对象：\n```javascript\ntypeof tonyDeAraujo; // 返回 \"object\"\n```\n\n6- 现在我们从头开始再次创建一个带有更多选项的\
  \ JobApplication 表单版本（熟能生巧，对吧？）？查看原始文件：\n\n![](img/00055.jpeg)\n\n图 55 [原始文件](http://icontemp.com/joagi/scripts/46.txt).\
  \ [ icontemp.com/joagi/scripts/46.txt ]\n\n注意 `this` 如何将每个属性绑定到每个参数中，这意味着无论我们在填写另一个\
  \ JobApplication 实例时引入了什么信息，它将绑定到我们通过函数参数创建的实例名称上。注意显示赋值顺序的箭头：通过 age 参数传入的数据被赋值给\
  \ `this.age`。例如，如果新对象的名称是 tonyDeAraujo 且年龄为 39，则 `this.age` 变为 `tonyDeAraujo.age\
  \ = 39`。\n\n7- 确保你将上述脚本粘贴到控制台中，然后让我们再次创建 tonyDeAraujo 的申请：\n```javascript\nvar tonyDeAraujo\
  \ = new JobApplication(\"writer\", \"Tony\", \"deAraujo\", 99);\n```\n\n8- 调用申请者：\n\
  ```javascript\ntonyDeAraujo; // 返回 JobApplication {position: \"writer\", firstName:\
  \ \"Tony\", lastName: \"deAraujo\", age: 99}\n```\n\n9- 让我们引入另一个申请者：\n```javascript\n\
  var lespaul = new JobApplication(\"guitarist\", \"Les\", \"Paul\", 99);\n```\n\n\
  10- 调用申请者：\n```javascript\nlespaul; // 返回 JobApplication {position: \"guitarist\"\
  , firstName: \"Les\", lastName: \"Paul\", age: 99}\n```\n\n11- 不要忘记也作为申请者介绍你自己以进行练习。\n\
  \n现在是时候为所有申请者创建通用方法了。我们从之前对原型的实验中知道，如果我们在 `new` 函数构造函数下将方法与属性名混合在一起，我们将会重复方法，这并不是我们想要做的。我们想要创建一个方法，然后让每个申请者使用同一个方法（通过引用）。\n\
  \n\n\n\n为了让这些方法在意义上是唯一的（即它们只会被创建一次，然后被所有 `JobApplication` 实例使用），我们必须通过在 `prototype\
  \ property`（原型属性）菜单中列出它们来创建。我们需要在`函数外部`创建它们，因为它们只会被建创建`一次`，我们不需要在每次填写新申请表时重新创建它们。它们将一直在那里，准备好供每位新申请人调用。这就像是在说：“*感谢您注册成为新申请人。您现在可以享受我们的福利。以下是您现在符合的所有福利列表*”。\n\
  \n12 让我们创建一个方法来观察它是如何工作的。创建一个名为 `introduction` 的方法，每当我们对新申请人或现有申请人*调用* `introduction`\
  \ 时，它都会自动显示一条消息。\n\n这里是我们的 `introduction` 的两个示例：\n\n我的名字是 Tony deAraujo。我 99 岁了，正在申请作家职位。\n\
  \n我的名字是 Les Paul。我 99 岁了，正在申请吉他手职位。\n\n13 **我们如何做到这一点？** 我们通过创建以下 `prototype`（粘贴原始文件或手动重输它）来实现：\n\
  \n![](img/00056.jpeg)\n图 56 [原始文件](http://icontemp.com/joagi/scripts/47.txt).[ icontemp.com/joagi/scripts/47.txt\
  \ ]\n\n`JobApplication.prototype.introduction` 意味着向 `JobApplication` 的 `prototype\
  \ list` 菜单添加一个名为 `introduction` 的方法。然后，在右侧我们定义该方法，它显然是一个函数。将原型理解为向一个已有的对象模板添加方法，这样所有实例化对象都可以立即共享此功能。\n\
  \n14 现在，在我们的示例中，每当我们需要*介绍*一位申请人时，我们通过用*点语法****绑定***对象和方法来调用函数的 `introduction` 方法。如下所示：\n\
  \n```\ntonyDeAraujo.introduction();\n// 返回\n// 我的名字是 Tony deAraujo。我 99 岁了，正在申请作家职位。\n\
