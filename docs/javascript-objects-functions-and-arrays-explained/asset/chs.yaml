  \n// 返回 \"5/28/2014 5:49:04 PM\"\n\n`toLocaleString` 是 `toLocaleDateString` 和 `toLocaleTimeString`\
  \ 的组合。\n\n`sampleDate.toUTCString();` // 返回 \"Wed, 28 May 2014 21:49:04 GMT\"\n\n\
  `toUTCSString` 返回一个根据世界时间的字符串。\n\n`sampleDate.toJSON();` // 返回 \"2014-05-28T21:49:04.498Z\"\
  \n\n`toJSON` 返回 JSON 格式的字符串。W\n\n## 4.2.3 有用的 JavaScript 日期库\n\nJavaScript 日期库允许我们通过对日期进行操作、解析和格式化，为应用程序添加日期和时间选择器功能。\n\
  \n*   [Later.js](http://bunkat.github.io/later/) - 轻松定义复杂的计划，然后快速计算未来或之前的计划出现情况。在\
  \ Node 和浏览器中均可工作。\n\n*   [Countdown.js](http://countdownjs.org/) - 一个简单的 JavaScript\
  \ API，用于生成两个 Date 实例之间时间跨度的准确、直观的描述。\n\n*   [Moment.js](http://momentjs.com/) -\
  \ 该库可以轻松地将任何给定日期转换为许多不同的格式，增加/减少日期、小时，并具有在语言环境下显示诸如“5 天后”等用户友好日期/时间的方法。\n\n*   [Cubism.js](http://square.github.io/cubism/)\
  \ - 是用于 HTML 和 SVG 的 JavaScript 可视化库，用于实时显示时间序列。\n\n*   [XDate](http://arshaw.com/xdate/)\
  \ – 是 JavaScript 原生 Date 对象的封装，提供了增强的解析、格式化和操作日期的功能。它实现了与原生 Date 相同的方法，因此看起来应该非常熟悉。\n\
  \n# 第五部分 – 战胜巨龙\n\n“伟大的成就不是出于冲动，\n而是一系列小事的汇聚。” *梵高*\n\n## 5.1 作为对象的无序列表\n\n我们之前在\
  \ 2.2 JavaScript 中的数组对象中看到过数组对象是按数字排序的列表。在 JavaScript 中，当我们看到方括号时，我们就知道它是某种类型的数组：\n\
  \n`var x = [77, 34, 23, \"book\"];`\n\n我们还知道在数组中，每个项目都从位置 0 开始向上排序。在我们的示例中，第一个位置（0\
  \ 位）包含项目 77。第四个位置（在 3 位）包含一个名为“book”的字符串。\n\n我们还记得看到过类似下面的脚本：\n\n`var y = {\"Fruits\"\
  : \"apple\", \"Vegetables\": \"spinach\", \"Grains\": \"beans\"};`\n\n上面的脚本表示一个无序列表。在\
  \ JavaScript 中，无序列表不是数组家族的一部分，它们作为独立的对象存在。它们由键值对表示。\n\n由于我们可以通过键标签获取项目，因此它们不需要按照任何特定的顺序排列，这赋予了它们不同于数组的灵活性。\n\
  \n所以，总而言之，我们使用方括号 `[ ]` 声明数字有序数组，并使用大括号 `{ }` 声明带有键值对的对象。\n\n在数组中，我们这样调用项目：`x[2];`\
  \ // 返回 23\n\n这是我们上面示例中的第 3 个元素。\n\n在对象表示法中，我们这样调用项目：`y.Fruits;` // 返回 “apple”。\n\
  \n我们也可以像处理数组一样，使用括号表示法来调用对象的键标签：\n\n`y[\"Fruits\"];` // 返回 \"apple\"。确保在括号表示法中为键加上引号。\n\
  \n记住括号表示法是有好的，因为如果你以后使用数字作为键，两种方式都有效或都不有效。\n\n**实验工作：**\n\n1- **让我们再次创建该对象**。\n\n\
