  \n9- 从 `y` 实例化一个名为 `myOb` 的对象（或任何你喜欢的名称）：`var myOb = new y();`\n\n10- 现在终于可以从 `myOb`\
  \ 调用 `getFruit` 了：`myOb.getFruit();` // 返回 \"apple\"。\n\n**总结：**\n\n当我们创建一个对象时，它的属性是公开的，这使得*读取*和*写入*属性变得更容易。然而，我们可以通过用\
  \ `var` 前缀初始化来保护我们的对象属性。一旦保护了对象的属性，从它们中*获取*数据的唯一方法就是通过`内部函数`，它也被称为**访问器方法**（因为它被允许访问属性）。虽然不是强制性的，但习惯上的做法是将这些访问器方法命名为\
  \ `getSomething`（“something”是属性名），因为它们通常被称为“**getters**（get 器）”方法。*这只是一个好习惯！*\n\n\
  ### 5.1.3 变更方法\n\n如果我们想修改（修改）*保护*对象内部的某个属性怎么办？\n\n在我们决定保护对象属性之前，我们能够给任何对象属性（变量）**分配**一个**新值**，例如\n\
