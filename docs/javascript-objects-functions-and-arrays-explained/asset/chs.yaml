  c) 可选的 `current index`，或正在遍历的对象的位置。你可以将索引作为参数排除在外，或者在需要影响计算过程时包含它。\n\n让我们看一个例子。我们将声明一个包含偶数的数组。然后我们将声明一个变量来使用\
