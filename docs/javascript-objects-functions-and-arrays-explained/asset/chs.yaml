  \n## 4.2.2 将 Date 转换为字符串\n\n有几种方法可以将日期格式转换为字符串格式。让我们来看几个最常用的方法，以直它们如何使用它们：\n\n我们将使用之前创建的相同\
  \ `sampleDate` 对象。如果你重新启动了控制台，请按照上文和下文描述创建 `sampleData`：\n\n`var sampleDate = new\
  \ Date;`\n\n根据你所在的位置，结果可能会有所不同。这是我的结果：`sampleDate;` // 返回 \" Wed May 28 2014 17:49:04\
  \ GMT-0400 (Eastern Daylight Time)\"。\n\n现在我们可以测试日期对象提供的一些字符串转换方法：\n\n`sampleDate.toDateString();`\
  \ // 返回（在我的情况下）\"Wed May 28 2014\"\n\n它抓取了上一个练习中显示的完整日期的左部分，去掉了最右侧的时间部分。\n\n`sampleDate.toLocaleDateString();`\
