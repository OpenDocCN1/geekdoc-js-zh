  \n## 2.4.4 位置方法\n\n除了*迭代*和*归约*方法外，JavaScript 还有两个新方法用于定位数组中的项：`indexOf()` 和 `lastIndexOf()`。\n\
  \n`indexOf()` 从左向右开始，而 `lastIndexOf()` 从右向左开始。\n\n它们的工作原理相同，并提供相同的引用位置位置。\n\n\n\n\
  \n然而，由于它们只报告第一个匹配的项，如果数组中有两个相似的项，`lastIndexOf` 将找到最后一个“第一个”匹配项，并报告那一个。\n\n## 2.4.5\
  \ indexOf() 与 lastIndexOf()\n\n如果我们只需要某个特定且唯一项的索引，那么 `indexOf` 和 `lastIndexOf` 的性能是相同的。但在长数组中，取决于项所在的位置（是在前半部分还是后半部分），其中一种方法可能会比另一种方法快。\n\
  \n如果存在多个相同的项，选择一种方法而非另一种方法将输出不同的结果。\n\n1- 让我们在控制台上创建一个新数组（[原始文件](http://icontemp.com/joagi/scripts/245.txt)）：`icontemp.com/joagi/scripts/245.txt`\
  \ `var x1 = [\"peanuts\", \"almonds\", \"walnuts\", \"heartnuts\"];`\n\n2- 使用 `indexOf()`\
  \ 调用“walnuts”的索引：`x1.indexOf(\"walnuts\");` // 返回 2，因为它计数为 0,1,2。\n\n3- 再次调用“walnuts”的索引，但这次使用\
  \ `lastIndexOf()`：`x1.lastIndexOf(\"walnuts\");` // 返回 2。\n\n尽管它从右侧搜索，但它报告的是从左侧计数的索引（它是递减而不是递增的）。\n\
  \n4- 尝试一下“peanuts”：`x1.indexOf(\"peanuts\");` // 返回 0。`x1.lastIndexOf(\"peanuts\"\
  );` // 返回 0。\n\n从上面的示例可以看出，应用于此简单的脚本时，两种方法返回的内容没有区别。\n\n然而，如果有两个相同的元素，结果将是不同的。考虑下一个练习：\n\
  \n5- 使用 `push()` 在数组末尾添加第二个元素“walnuts”：`x1.push(\"walnuts\");` // 返回 [\"peanuts\"\
  , \"almonds\", \"walnuts\", \"heartnuts\", \"walnuts\"]。\n\n6- 使用 `indexOf()` 调用“walnuts”的索引：`x1.indexOf(\"\
  walnuts\");` // 返回 2。\n\n7- 使用 `lastIndexOf()` 调用“walnuts”的索引：`x1.lastIndexOf(\"\
  walnuts\");` // 返回 4。\n\n它先找到了最后一个“walnuts”。\n\n如果搜索的项不在数组中，这两种方法都会返回 -1。\n\n这些元素是如何比较的？索引方法将用于搜索的元素与\
  \ `Array` 中的元素进行比较，并使用**严格相等**（strict equality），这与 `===`（三全等号运算符）使用的方法相同。如果元素在语法或类型上不同，算法将返回\
  \ -1 表示“未找到”。\n\n### 可选第二个参数：从哪里开始。\n\n`indexOf()` 和 `lastIndexOf()` 可以使用第二个可选参数。\n\
  \n这个第二个可选参数通常通称为 `fromIndex`（任何名称均可）。\n\n可选的 `fromIndex` 参数指定了开始搜索的数组索引（包含）。我的意思是，可以跳过部分数据并从更靠后的位置开始搜索。\n\
  \n`fromIndex` 是零开始的，这意味着第一个元素计为 0，其后是 1、2、3 等。\n\n根据我们目前在控制台上的示例：\n\n`[\"peanuts\"\
  , \"almonds\", \"walnuts\", \"heartnuts\", \"walnuts\"];`\n\n8- 让我们实验一下 `fromIndex`\
  \ 参数，使用参数 2：`x1.indexOf(\"walnuts\",2);` // 返回 2\n\n（找到了第一个“walnuts”，碰巧它是要搜索的第一个项。）\n\
  \n`x1.indexOf(\"walnuts\",3);` // 返回 4\n\n（跳过了第一个 \"walnuts\"，找到了第二个 \"walnuts”。\n\
  \n现在让我们看看 `lastIndexOf` 的行为：`x1.lastIndexOf(\"walnuts\",2);` // 返回 2\n\n它没有找到最后一个“walnuts”，因为它只从项\
  \ 2 开始搜索到 0（如 2,1,0），而“walnuts”位于从 0 开始计数的第 2 位置。记住，它是向左搜索的，并且从第三个元素（位置 2）开始，所以位置\
  \ 2 右侧的任何地方都没有扫描。\n\n9- 另外一个测试：`x1.lastIndexOf(\"walnuts\",4);` // 返回 4。\n\n从右向左找到了第一个“walnuts”。\n\
  \n### 搜索标准总结。\n\n以下是 `indexOf` 和 `lastIndexOf` 的总结。这是为了以后的参考而写的。不要试图背诵这些规则，只需在日后需要实现该方法时查阅它们即可。\n\
  \n- **indexOf() 方法的搜索标准：**\n\na) 在 `indexOf()` 方法中，可选的第二个参数 `fromIndex` 默认为 0。如果缺少\
  \ `fromIndex` 参数，JavaScript 假设 `fromIndex` 为零。另一方面，如果 `fromIndex` 大于或等于数组的长度，将不执行搜索并返回\
  \ -1。\n\nb) 使用正数的 `indexOf` 表示从哪里开始搜索（包含），之后向右进行搜索。例如：`fromIndex` 为 1 表示从第二个元素开始搜索（包含），因为它是基于零的。\n\
  \nc) 使用负数的 `indexOf` 用于偏置第一个要搜索的元素，偏移量基于数组长度加上该负数。计数是基于零的：在长度为 5 的数组中使用 -1，会使其从位置\
  \ 4 开始，即 0, 1, 2, 3, 4 或第五个元素），之后向右进行搜索。\n\n示例：\n\n1- 记住，我们的 `x1` 是 `[\"peanuts\"\
  , \"almonds\", \"walnuts\", \"heartnuts\", \"walnuts\"]` `x1.indexOf(\"walnuts\"\
  , -2);` // 返回 4，因为（ 5 - 2 = 3。3 实际上是元素 4 (heartnuts)，它已经跳过了第一个“walnuts”。返回的是下一个“walnuts”，即第四个元素的索引）。\n\
  \n- **lastIndexOf() 方法的搜索标准：**\n\na) 当配合 `lastIndexOf()` 使用时，`fromIndex` 默认为数组长度减\
  \ 1。这是合理的，因为是从是从右侧开始的。\n\n在一个有 5 个元素的数组中，它默认为 4，这意味着将搜索所有元素：0,1,2,3,4。在前一种方法中它默认为零。此外，大于数组的\
  \ `fromIndex` 作用相当于 `fromIndex` 为 4。\n\nb) 使用负数的 `lastIndexOf()` 用于偏置第一个要搜索的元素，偏移量基于数组长度加上该负数。计数是基于零的：在长度为\
  \ 5 的数组中使用 -1，会使其从位置 4 开始，即 0, 1, 2, 3, 4 或第五个元素），之后向右进行搜索。\n\n2- 在我们的示例中，它是最后一个“walnuts”：`x1.lastIndexOf(\"\
  walnuts\",-1);` // 返回 4。\n\n同样，具有 5 个元素的相同数组使用 -2 作为 `fromIndex`，将从位置 3 或元素 4 开始。\n\
  \n3- 在我们的示例中，它从“heartnuts”开始：`x1.lastIndexOf(\"walnuts\",-2);` // 返回 2。\n\n它在从末尾开始的第一个“walnuts”之后启动搜索。\n\
  \n- 使用 `lastIndexOf()` 方法时，正数决定了从哪个位置开始搜索（从右到左）。例如：`fromIndex` 为 0 将只搜索第一个项，在我们的示例中是“peanuts”。`fromIndex`\
  \ 为 1 将只搜索第二个和第一个元素，按此顺序进行。\n\n# 第三部分 – 进入第二个领域\n\n“敲击天空，听其声音。” 禅语\n\n## 3.1 JavaScript\
