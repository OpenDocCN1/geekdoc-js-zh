  ## 3.1.1 arguments\n\n在 ECMAScript 5 中，**arguments** 不再像以前那样是函数的属性。它们已被升级为类似于数组的对象，但多了一个数组库可用的属性：**length**。\n\
  \nLength 是一个重要的属性，因为它通过循环遍历每个现有的参数元素来方便迭代。\n\n\n\n\n\n`arguments object` 就像函数的局部变量。它只在函数中真正起作用。它由函数本身或函数内部的任何子函数调用（如后文所示，在应用了正确的绑定后）。你不能显式地创建\
  \ arguments 对象，因为它只有在函数开始执行时才会变为可用。这个 `arguments` 对象拥有一个容量可达 255 个元素的数组。\n\n参数 `parameters`\
