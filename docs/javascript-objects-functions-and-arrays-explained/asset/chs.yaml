  \ 开发者工具快捷键列表](https://developers.google.com/chrome-developer-tools/docs/shortcuts)。你可以从[源](https://www.google.com/intl/en/chrome/browser/)\
  \ 下载 Google Chrome。作为替代，[Opera](http://www.opera.com/) 和 [Epic](https://www.epicbrowser.com/)\
  \ 的工作原理相同。只要你知道如何访问其 JavaScript 控制台，请随时使用你喜欢的浏览器。\n\n如果你需要一个在线编辑器作为草稿本，可以使用 [EditPad](http://www.editpad.org/)\
  \ 或许多其他替代。**更新：** [jsbeautifier.org](http://jsbeautifier.org/) 也可以作为编辑器，其优点是在复制代码之前对其进行美化。我每天都用它来纠正学生提交的脚本。\n\
  \n书中不需要记忆任何内容。\n\n请遵循每章中讨论的练习说明。重复示例是掌握所学课题的关键。\n\n每个主题都非常*简短*且直击要点。许多主题将根据需要重复，并在第二次出现时提供进一步解释。***洋葱是层层剥开的***。\n\
  \n为了方便，书中还会提供外部链接引用。指向标准 ECMA-262 的链接直接指向正在讨论的主题。有时链接会带我们进入首页而不是正确的主题。由于 ECMA 网站的某些异常行为。通常情况下，如果你点击第二次，它就会直接进入正确的位置。\n\
  \n“*虚怀若，从头开始*”，就像每一位黑带武术大师每天做的那样。\n\n# 第一部分：启蒙之门\n\n意识赋能\n\n## 1.1 原型与基于类\n\n由于\
  \ JavaScript 的核心在于*创建*和*销毁*对象，因此理解 JavaScript 对象的本质是掌握 JavaScript 最重要的步骤。\n\n让我们从后门重新回到\
  \ JavaScript，尽管这是最不常用的路径。\n\nJavaScript 是一种**基于原型的**面向对象语言。它不是一种基于类的对象语言。\n\n基于原型的和基于类的语言有一个共同的目的：共享代码并避免冗余。\n\
  \n在基于类的语言中，程序员创建一个蓝图（类），然后根据这种*图纸*构建对象。\n\n在基于原型的语言中，程序员创建一个对象，并允许它成为创建其他对象的原型。就像类范式中一样，这种技术避免了代码的重复并节省了内存。从这里开始，所有关于类的理论都开始淡化。此外，由于对象允许以分级的方式链接，代码可以被重用，形成一条**原型链**。当一个对象需要某个工具（方法）时，它会沿着链向上寻找，直到从它的某个祖先（父级或祖父级）那里获取。\n\
  \n这种无类的语言模型也称为*基于实例的*或**面向原型的编程**，它的工作原理是一种*委托*过程，即一个对象依赖另一个对象来提供一组特定的功能。它之所以有效，是因为\
  \ JavaScript 依赖其实时环境来施展魔法。就像河流中的水，第二次出现时永远是同一个。\n\n仅仅因为 JavaScript 可以通过原型模拟许多流行的类特性，并不意味着它是一种基于类的语言。曾有人说“*熟悉会消除崇拜的棱角*”。让我们按照\
  \ JavaScript 的质本身来欣赏它，而不是根据它的样子。\n\n原型代码与基于类的语言相比是否有优势？\n\n在整书中，你将找到进一步阅读的有用参考链接。这是我们来自[维基百科](http://en.wikipedia.org/wiki/Prototype-based_programming)的第一个链接。在页面中间你会发现一个名为“批评”的主题，它可能会引导你朝着正确的方向找到这个问题的答案。\n\
  \n## 1.2 内存概念\n\n内存管理或*管理计算机内存*的行为被定义为根据*程序*请求动态分配部分内存的方法。它也是在数据不再需要时释放内存以供再次使用的行为（这一任务**由浏览器完成**）。\n\
  \n执行*线程***是**可以独立管理的最小程序化指令序列。多个线程可以在同一个进程中共存并共享相同的内存区域。\n\n通常来说，我们可以将内存**划分为**两个不同的区域：**栈（stack）**和**堆（heap）**。\n\
  \n**栈**是一个**受限**的数据结构。在其中只能执行少数操作。通常，这些数据指向*堆*上更大的数据。例如，指向对象的变量。\n\n当这些操作完成时，数据会被**自动清除**，为下一批数据留出空间。在某种程度上，栈充当了内存操作的***草稿本***，在大多数情况下，**栈**中只居住**指针**（变量名）等*快速数据*。\n\
  \n***堆***是完全不同的事情。首先，在堆中，数据不像栈中那样整齐，数据块可以被[随地](http://en.wikipedia.org/wiki/Ad_hoc)存储，因为在堆中，如果一段数据变大，可以根据需要分配内存。这使得堆比栈慢。栈内存更快，是因为在栈中，每个数据集在严格管理下都有特定的大小。\n\
  \n![](img/00001.jpeg)\n\n图 1 一图胜于万言\n\n在 **JavaScript** 中，**基本类型值**存储在**栈**中，**引用类型值**存储在**堆**中。记住“**引用类型**”，我们将经常讨论它。\n\
  \n通常来说，引用是被其他东西所引用的东西，如果没有引用者，就没有引用。在上面的图片中，当你取消从*栈*中的 **y** 到*堆*中对象的链接时，该对象就会消失，正如我们稍后更详细地看到的那样。\n\
  \n不要尝试*记忆*所有这些信息。只需阅读并**理解它**，因为在剥开 JavaScript *洋葱*的过程中，我们会不断增加细节并反复提到它。\n\n在 JavaScript\
  \ 中，**基本类型值**被定义为 **Number**、**Boolean**、**String**、**Null** 和 **Undefined**。由于这些是*简单值*，在\
  \ JavaScript 中它们直接存储在**变量**（栈）所占据的位置：它们是合一的。对于其他类型的数据，**变量无非是*标签***或*符号*，指向*堆*中更大的内容。\n\
  \n**引用类型值**就是前段落中提到的那些“*堆中更大的内容值*”。它们的*变量名*存储在*栈*中（作为指向堆中真实数据的**指针**）。\n\n说到*基本类型*，**Undefined**\
  \ 类型被分配给任何没有特定值的*声明*变量。未定义的变量没有**length 属性（属性）**，因为恰好只有*一个*值（称为 *undefined*），所以长度属性将是没用的，而且是又一个挂在内存藤蔓上的负担。\n\
  \n**Null** 另一方面通常是*对象*的*占位符*，它在 JavaScript 中被认为是基本类型是因为早期 ECMAScript 标准的一个错误。由于历史原因，它仍然是一个基本类型。它也恰好只有*一个*值，*null*。在上一张图中可以说变量\
  \ ***y*** 的值为 null。值为 *null* 的变量最终会从内存中擦除（稍后会详细介绍）。\n\n\n\n\n`Boolean` 类型表示一个逻辑实体，它具有`两个`值，即\
  \ `true` 和 `false`。\n\n`String` 原始类型非常特殊！通常在其他语言中，字符串被视为`引用类型`，但在 JavaScript 中，字符串是`原始（Primitive）`类型。\n\
  \n正如我们所知，字符串的大小是可以变化的，因此在 JavaScript 中，当你向字符串中添加单词时，当前的字符串会被另一个包含新添加数据的字符串所替换。对于原始值来说，变量及其数据是合一的，因此当我们修改字符串时，整个变量都会被替换。这种替换是因为容纳新数据需要内存空间。这种替换在后台发生，我们永远不会察觉这种区别。\n\
  \n字符串值可以存储 0 个或多个字符，每个字符由一个 16 位的正整数表示。第一个位置编号为零。因此，在字符串“Tony”中，`最后一个字符`的`位置`是“Tony”的长度`减\
  \ 1`，因为它是从零开始的。当字符串包含实际文本数据时，每个元素被视为单个 UTF-16 [代码单元](http://en.wikipedia.org/wiki/Code_point)。\n\
  \n简而言之（稍后将演示），JavaScript 字符串实际上存储在栈中，因为它们是原始类型。如果字符串扩展，`一个新字符串会替换旧字符串`，旧的`数据`会被丢弃。\n\
  \n## 1.3 变量 vs 引用类型\n\n我意识到我们还没有介绍 `Number` 原始类型。随着学习的深入，我们将详细介绍数字。基本上，原始类型是系统提供的类型。`Number`\
  \ 类型连同文本（String 类型）以及布尔值，是 JavaScript 中的`基础原始类型`。\n\n`Numbers, Strings, Booleans\
  \ =>` JavaScript 原始类型。\n\n至于引用类型，我们在这里讨论的是`对象定义`。其他语言使用类（Classes）。[ECMAScript](https://en.wikipedia.org/wiki/ECMAScript)\
  \ 标准没有使用类。ECMAScript 是在 `ECMA-262` 中标准化的脚本语言名称。JavaScript 是该标准加上它运行的`环境`（例如`浏览器`）的结合。\n\
  \n在 `JavaScript` 中，有一个我们可以称为`全局对象（Global Object）`的对象。它是原型（`模板`），每个创建的其他对象都将从它`继承标准属性`。\n\
  \n全局对象是[变异的](http://en.wikipedia.org/wiki/Mutant)：取决于我们使用 ECMAScript 的地方，它实际上会有不同的生命形态。当\
  \ ECMAScript 与计算机浏览器结合时，`全局对象`变成`窗口对象（Window Object）`，我们就是这样称呼它的（稍后讨论）。\n\n所以，如果我们将\
  \ `tony` 声明为一个`Object`：\n\n```javascript\nvar tony = new Object();\n```\n\n我们正在为变量\
  \ `tony` 提供`预定义的工具供使用`。我的意思是，`tony` 从`JavaScript 内部库``继承了标准数量的属性和方法`，这些工具包含在`内置`的\
  \ Object“原型”中。\n\n那么，这个新对象（`tony`）到底从 Object 标准模板中继承了什么呢？\n\n### 1. 对象属性\n\n一旦`被声明为对象`，我们的新对象\
  \ `tony` 就会“通过指向”继承某些`属性`，例如：\n\n（不需要记忆。我们将在过程中自然地涵盖这个主题。只需理解即可。）\n\n**A) 构造函数（Constructor）**\
  \ – 一个通过 `new` 运算符创建相似的`未来`对象的“公式”。构造函数是对一个函数的引用。如果你需要创建对象的实例，构造函数可以作为一个脚本使用，充当接口，规定了新对象`可以`和`不被允许`拥有的新规则。这简化了构思并节省了内存，因为所有对象都可以从它的源（当前源）获取养分，我们只需要编写一次这个源，而与有多少个对象实例无关。一个`继承的`构造函数是`指向源的指针`，对于已经构造好的对象的功能来说并不是必需的。它仅用于给`未来`对象一个通过构造函数`脐带`出生并生存的权利。构造函数利用了名为\
  \ `this` 的`隐藏`参数，这是一个通用的`占位符`，将代表正在被处理的对象。在英语中，我们使用代词“whose”。正如在 whose 中一样，在 JavaScript\
  \ 和其他语言中，我们使用 `this` 来产生类似的结果。“this”意味着“作用域内上一个对象的实例”，或者我们现在这里想要代表的对象。关于“this”的更多信息稍后介绍。\n\
  \n**B) 原型（Prototype）** – 另一个继承属性是 `Prototype`，它是一个内置接口。`Prototype` 充当对象从父对象继承属性和方法的`脐带`或管道。“Protos”或父级是源，当前对象从链中上方某处的另一个对象那里继承属性/方法。该源。这种链接的有用用性超过了当前对象本身，因为较低层级的其他对象也可能从它们的祖父对象继承特征。和构造函数一样，原型链链接仅用于检索。它对更新原型没有影响。这意味着当前对象中的任何更改都不会改变其原型或父级源。我们也可以将原型视为对象被授权使用的所有方法的列表。该对象的每个新实例都会继承这个列表。我们稍后将对原型进行一些实验工作。\n\
  \n**![](img/00002.jpeg)**\n图 2\n\n不要从`继承`属性和方法的角度来考虑 JavaScript。要从`接口`的角度来考虑它。某些对象拥有方法。这些方法可以与管道下游的其他对象建立接口，其他对象可以使用它们来创建自己的功能，这些功能可能与父对象相似，也可能不相似。\n\
  \n### 2- 对象方法\n\n至于`继承的方法`（我们的示例对象 `tony`），它“通过指向”从其父对象“Object”对象继承`方法`。\n\n（不需要记忆。我们将在过程中自然地涵盖这个主题。只需理解即可。）\n\
  \n**a) hasOwnProperty**–（将 `hasOwnProperty` 看作一个问题，JavaScript 提供结果作为答案）。此方法`不`检查继承链的`向上`或`向下`。它只验证问题对象是否创建了`自己的`属性（例如属性‘writer’：`object_name.hasOwnProperty('writer');`？\
  \ 如果它存在`并且如果`它是被创建的，而不是从链中向上继承的，则返回 true）。\n\n`tony.hasOwnProperty(\"toString\"\
  );` 返回什么吗？返回 `false`，因为这属于它的父对象。注意：我们很快就会在控制台上尝试这个。\n\n**b) isPrototypeOf**- `isPrototypeOf`\
  \ 方法允许我们检查一个对象是否直接从另一个对象获取其`魔法`。我们需要包含“prototype”一词才能使用此方法。换句话说，“`ObjectOne.isPrototypeOf(ObjectTwo)`”将不起作用，因为\
  \ JavaScript 不知道我们对该命令指的是什么。我们需要更具体一点，并这样写：`ObjectOne.prototype.isPrototypeOf(ObjectTwo);`？\
  \ 如果 `objectOne` 是 `objectTwo` 的`原型`，则返回 true。这等于说 `objectTwo` 是从 `objectOne` 建模的。“建模”节省了内存，因为无论\
  \ `objectOne` 拥有哪些属性，在实例化 `objectTwo` 时都不会重新创建，因为它们已经存在（注意：稍后我们将看到这完全取决于我们如何编写脚本）。\n\
  \n**c) propertyIsEnumerable** - 此方法用于确定对象中的指定属性是否`足够可见`（被列出）以便在脚本（如 for...in 循环）中进行枚举。`它实际上列出了对象自身的属性`，因为自身的属性是可以枚举的，但所有继承的属性不在\
  \ `enumerable`（可枚举）列表中，不会出现在 for...in 循环中。\n\n\n\n\n### d) `toString()` - 每个对象都有一个\
  \ `toString()` 方法。当对象需要表示为文本值时（例如我们执行 `alert(object)` 或 `console.log` 它时），该方法会被调用。当需要对象的字符串表示时，会发生字符串转换。\n\
  \n### e) `valueOf()` - JavaScript 返回指定对象的原始值。`myobject.valueOf()` 可能返回 `Array`、`Boolean`、`Date`、`Function`、`Number`、`Object`\
  \ 或 `String`。JavaScript 在内部根据需要使用此方法，但也可以刻意调用它。`Math` 和 `Error` 对象没有内置的 `valueOf`\
  \ 方法。\n\n回到属性：\n\n想象一下：对象的属性可以解释为附着在对象上的变量。当然，当我们创建一个新对象时，所有这些属性和值都可以被重写。\n\n**所以，在这个例子中：**\
  \ `var tony = new Object();` 中的 `tony` 是对象本身吗？\n\n答案是否定的；`tony` 是一个 `label`（标签），一个\
  \ `symbol`（符号）。从技术上讲，符号 `tony` 被归类为 `variable`（变量，即指针），它临时留在栈中，并指向从模板实例化（克隆但使用现有功能）的对象。该对象存储在堆中，一旦我们重新分配或删除标签\
  \ `tony`，该对象就会进入垃圾回收模式，并从那里被擦除（不同的浏览器实现不同的清理未使用数据的方法。这种技术随着每个新版本的发布而不断改进）。\n\n在\
  \ JavaScript 中，几乎一切都是对象。除了 `null` 和 `undefined` 之外的所有原始类型实际上都被 JavaScript 视为对象，因为每当解释器需要实现一个方法来处理相关的原始类型时，它们会在内部被包装成对象。\n\
  \n因为可以被包装成对象，属性和方法可以赋值给原始类型，显示出对象的所有特征。这是因为 JavaScript 在其库中为 `Boolean`、`Number`\
