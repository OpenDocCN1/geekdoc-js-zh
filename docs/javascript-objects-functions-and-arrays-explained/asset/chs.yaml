  不需要记忆这些方法，只要确保你理解它们即可。以后你会在自己的项目需要时再回来获取某个特定方法，或者你也可以只需通过网络搜索找到你需要使用的方法的正确语法。然而，如果你不学习这一部分并进行自己的测试，你将来将不知道该寻找什么。了解某件事的道路已经完成了四分之三。\n\
  \n接着在**第 3 部分**中，我们将更详细地介绍函数以及其他对象，如有序和无序列表（数组和哈希）。\n\n一旦你掌握了这两个部分，你就已经在通成为优秀 JavaScript\
  \ 程序员的道路上了。\n\n## 2.1 JavaScript 中作为对象的字符串\n\n到目前为止，我们一直在讨论作为 JavaScript 原始值的字符串。字符串是`immutable`的（固定值），它们存储在栈（Stack）中。如果我们编辑一个字符串，该变量将被另一个长度较短或较长但名称相同的字符串变量替换。由于无法进行编辑，之前的字符串会被自动丢弃。\n\
  \n然而，确实存在 `String` 对象。原型（prototype）就在那里，光彩夺丽，并带有各种功能完备，以便在需要时被调用。实际上，JavaScript\
  \ 会根据需要调用 `String` 对象并在需要将字符串封装成对象。你想查找一个字符串变量的长度吗？JavaScript 回道：“没问题，先生/女士，我为您搞定了！”。\n\
  \n`String` 对象的所有方法和属性对原始值都是自动可用的。无需实例化对象。\n\n首先，让我们在词汇表中定义两个术语。\n\n`literal`（字面量）一词是指引号内的字符、单词或短语，例如“apples\
  \ and bananas”。字符串字面量是由单引号或双引号包裹的零或多个字符组成的。虽然在 JavaScript 中单引号或双引号没有区别，但在 JSON（JavaScript\
  \ 对象表示）中强制使用双引号，许多开发者也选择双引号作为标准格式。\n\n另外，为了确保你理解 `method`（方法）这个术语，方法是程序员所说的代表对象执行操作的功能单元。方法通常是一个函数，或者完成一个特定任务的函数集合。\n\
  \n在 JavaScript 中，字符串字面量通常是原始类型。当在字符串字面量上调用 `method` 时，字符串会被临时自动地封装成一个对象以处理该调用。\n\
  \n这是一个字符串原始值的示例，将用于我们后续对属性和方法的演示。请像我们之前在实验课程中所那样，完成绿色部分的练习：\n\n**(启动你最喜欢的 JavaScript\
  \ 控制台，我正在使用 Chrome)**。\n\n```javascript\nvar x = \"bananas\";\n```\n\n当字符串原始值被封装成\
  \ `String` 对象时，它会自动继承几个 (a) 属性和几个 (b) 方法。\n\n让我们来看其中的一些属性和方法：\n\n### a) String 属性，如\
  \ length、prototype、constructor：\n\n1- **length**\n\n根据字符串长度返回一个数字：\n\n```javascript\n\
  x.length; // 返回 7\n```\n\n2- **prototype**\n\n原型属性用于向现有对象添加属性和方法。让我们向 `String` 对象添加一个属性，看看\
  \ “x” 是否继承了该对象（我假设你的控制台中还有上一个练习留下的 `x`），字符串的 S 大写：\n\n```javascript\nString.prototype.feelings\
  \ = \"love bananas\"; // 注意 string 的 S 是大写的。\n```\n\n由于一画胜于万言，我会这样记住它：“String 先生，请原型（动词，意为创建原型）一个名为\
  \ 'feelings' 的属性，值为 'love bananas'。”（在这种情况下，我也会脑海中将该属性看作键值对，就像 `x.feelings` 一样）。\n\
  \n将 `prototype` 命令想象成向工具菜单中添加新东西。我们可以把这个菜单的名字称为 `prototype`，而允许添加新属性和方法的动词也是 `prototype`。\n\
  \n**现在测试一下它：**\n```javascript\nx.feelings; // 它应该返回 \"love bananas\"。\n```\n\n记住，你也可以将其写成\
  \ `x[\"feelings\"]`，因为 `feelings` 是属性值所在的位置。\n\n属性 `feelings` 变成了字符串 `x` 的一部分，并可以使用点符号（Dot\
  \ notation）或括号符号（Bracket notation）进行调用。`x` 仍然是一个字符串原始值，你可以通过对其调用 `typeof` 来确认，它返回的是小写的字符串类型，而不是对象。\n\
  \n当我们看语法时，我们看到一个名为 “feelings” 的属性，它是在 `String object prototype`（菜单）上被原型化（被创建）的。它现在是该特定执行上下文中所有字符串原始值可用的属性列表的一部分。\n\
  \n我刚才说 `feelings` 对“所有”其他字符串变量都是可用的吗？\n\n**如果我们声明另一个字符串变量，这个属性对它也有效吗？**\n\n让我们试一下：声明以下变量：`var\
  \ y = \"oranges\";`\n\n打印它的 feelings：\n```javascript\ny.feelings; // 返回 “love bananas”\n\
  ```\n\n所以答案是肯定的，任何其他字符串变量都会继承它，因为 `feelings` 被添加到了全局 `String` 对象中。\n\n**那么不同类型的变量呢？**\n\
  \n尝试这个：`var z = 123;`\n\n然后是这个：\n```javascript\nz.feelings; // 返回 undefined\n```\n\
  \n当然，我们已经知道了。这个属性属于 `String` 对象而不是 `Number` 对象。然而，这个新属性是临时的，它仅适用于此实例。当涉及到原生对象（内置对象）时，我们可以为我们的实例添加功能（属性和方法），但**我们无法永久地修改原生\
  \ String 对象**以便供其他程序使用。\n\n**通过原型向 String 添加一个新方法呢？**\n\n尝试这个：\n\n![](img/00013.jpeg)\n\
  \n图 13 [原始文件](http://icontemp.com/joagi/scripts/18.txt)。 [ icontemp.com/joagi/scripts/18.txt\
  \ ]\n\n现在让我们通过编写来调用它：\n```javascript\nx.repeat( ); // 它返回 \"bananasbananas\"，这是调用它的占位符。\n\
  ```\n\n再尝试：\n```javascript\ny.repeat(); // 返回 \"orangesoranges\"。\n```\n\n所以，向 `String`\
  \ 对象的原型菜单添加方法并将其应用于字符串原始值也是可能的。\n\n我们可以通过对目标变量使用一种快速粗暴的方法来获取我们自己的属性和方法列表：\n\n```javascript\n\
  x.__proto__ // 每边有两个下划线\n```\n\n返回 \" String {feelings: \"love bananas\", repeat:\
  \ function} \"。\n\n这是 proto 且点左有两个下划线，右有两个下划线。`__proto__` 不是 JavaScript 标准，因此被称为“快速粗暴的方法”。\n\
  \n在新的 ECMAScript 5 中，`__proto__` 将被下面的方法取代，但在本文期间并非所有浏览器都支持它，你可能会遇到错误 *TypeError:\
  \ Object.getPrototypeOf called on non-object*：\n\n```javascript\nObject.getPrototypeOf(x);\n\
  ```\n\n\n\n\n\n为了练习，请通过 `prototype` 属性为 `String` 对象添加一些属性和方法，并对其中的每一个都调用 `x`。创造性练习是巩固概念的途径。不要忘记\
  \ `x` 是 `window` 的属性。`x` 是一个继承了 `String` 方法的字符串，但它也是 `window` 的属性。我们可以使用 `dot` 作为前缀编写所有脚本，例如：`window.feelings;`\
  \ 甚至可以是 `window[\"feelings\"];`，这意味着指向 `window` 上的 `location` 地址。\n\n### 构造函数\n\n\
  每当我们创建一个新的字符串变量时，它都会继承“prototype”，在其中我们可以找到许多可用的属性和方法，我们也可以通过“property”（也称为 `prototype`）添加我们自己的内容。字符串原始类型通过其\
  \ String 对象可用的第三个属性是“constructor”，它包含指向一个 `function` 的引用，该函数可能会创建另一个 `String` 对象的副本。\n\
  \n如果说 `prototype` 指向一个“菜单”，那么 `constructor` 则指向一个可以构建 `String` 对象 `instances` 的函数或方法。这意味着我们可以在创建对象时直接进行操作，从而跳过原型链的过程。因此，虽然\
  \ `prototype` 只创建 `properties`，但 `constructor` 创建带有可选属性的 `objects`。然而，出于内存效率考虑，最好将方法的创建留给\
  \ `prototype`，而不是引用已存在的原型。新构造的对象也会从其原生对象继承属性和方法，例如：`charAt`, `charCodeAt`, `concat`,\
  \ `fromCharCode`, `indexOf`, `lastIndexOf`, `match`, `replace`, `search`, `slice`,\
  \ `split`, `substr`, `substring`, `toLowerCase`, `toUpperCase`, `valueOf`。\n\n###\
  \ `charAt(pos)` 和 `charCodeAt(pos)`\n\n上述两个方法都与根据字符的位置从字符串中访问字符有关。前者返回字符，后者返回字符。让我们来看每个示例：\n\
  \n1. 声明变量 `x`：`var x = \"bananas\";`\n2. 调用它的包装方法 `charAt`：`x.charAt(2);` // 返回\
  \ \"n\"（它从 0 开始，最左侧的字符，选取位置为 2 的字符，如 0, 1, 2）。\n3. 上述方法使用括号表示法调用的效果相同。尝试一下：`x[2];`\
  \ // 返回 “n”。括号表示法是 ECMAScript 较新的特性，在非常旧的浏览器上可能无法识别。\n4. 尝试另一个方法：`x.charCodeAt(2);`\
  \ // 返回 110，即 Unicode 编码点。`charCodeAt` 与 ASCII 字符编码直接对。。关于 Unicode 的信息请阅读此处：[Mozilla](https://developer.mozilla.org/en-US/docs/Web/Guide/Values,_and_literals)\
  \ 或 [Wikipedia](https://en.wikipedia.org/wiki/Unicode)。\n\n更多信息，请参考以下 ECMASCRIPT\
  \ 5 页面：\n- `15.5.4.4 String.prototype.charAt`\n- `15.5.4.5 String.prototype.charCodeAt`\
  \ (`charCodeAt` 的代码范围从 0 到 65535)。\n\n### `fromCharCode(pos)`\n\n`fromCharCode(pos)`\
  \ 方法是 `charCodeAt()` 的反向。这个方法非常简单。它根据给定的 Unicode 参数返回一个字符：\n\n```\nString.fromCharCode(110);\
  \ // 返回 n\n```\n\n你可以将这些方法的结果赋值给变量。我们还可以传入多个 Unicode 数字：\n\n```\nString.fromCharCode(110,\
  \ 111, 112); // 返回 nop\n```\n\n更多信息，请参考以下 ECMASCRIPT 5 页面：\n- `15.5.3.2 String.prototype.fromCharCode`\n\
  \n### `concat()`\n\n`concat()` 方法有时用于替代 `+` 运算符，以连接（合并）不同的字符串。这里有一个示例：\n\n1. 我们之前声明的变量\
  \ `x`：`var x = \"bananas\";`\n2. 声明另一个组合两个字符串的变量（注意左侧的空格）：`var w = x.concat(\" are\
  \ good for you!\");`\n3. 调用 `w`：`w;` // 返回 \"bananas are good for you!\".\n\n连接不会改变原始变量\
  \ `x` 的值，除非在自身上调用连接（这种情况不需要这样做）：`x = x.concat(\" are good for you!\");`，这与对自身使用\
  \ `+=` 而不是 `concat()` 相同。\n\n4. `concat` 方法在某些情况下非常有用，例如示例所示，将多个变量相加组成一个新字符串：\n\n\
  ```\nvar h = \"Read this: \";\nvar y = \" are good for you!\";\nh = h.concat(x,\
  \ y); // 返回 \"Read this: bananas are good for you!\"\n```\n\n出于性能考虑，JavaScript 中连接字符串字符串的方式是使用\
  \ `+` 或 `+=`。然而 `+` 比 `+=` 慢，因为引擎会为每两个由 `+` 分隔的字符串创建一个新的临时字符串。使用哪种方法？取决于你根据现有代码想要实现的目标。有多种选择是一件好事。\n\
  \n更多信息，请参考以下 ECMASCRIPT 5 页面：\n- `15.5.4.6 String.prototype.concat`\n\n### `indexOf()`\
  \ 和 `lastIndexOf()`\n\n这是一个非常的方法。String 方法 `indexOf` 和 `lastIndexOf` 返回指定值在字符串中的位置。\n\
  \n第一个方法从字符串开头开始搜索，而第二个方法从最后一个字符开始搜索，而不是从第一个字符开始。\n\n如果字符是唯一的，两个方法将返回相同的值。如果我们询问\
  \ \"bananas\" 中 \"n\" 的索引（其中存在多个 \"n\"），`indexOf` 将返回位置 2，因为它在那里找到了第一个 \"n\"。然而，`lastIndexOf`\
  \ 将返回位置 4，因为它在那里找到了它的第一个 \"n\"（但它从左到右显示计数，而不是从右到左）。例如，位置 5 对两个方法来说是相同的。\n\n示例脚本：\n\
  \n1. 如果我们旧的 `x` 未定义，重新定义它为 `var x = \"bananas\";` 然后尝试以下脚本：\n\n```\nx.indexOf(\"\
  n\"); // 返回 2\nx.lastIndexOf(\"n\"); // 返回 4\n```\n\n2. 让我们尝试另一个：\n\n```\nvar aba\
  \ = \"The quick brown fox jumps over the lazy dog.\";\naba.indexOf(\"brown\"); //\
  \ 返回 10\n```\n\n当未找到单词或字符时，两个方法都返回 `-1`。这非常有用。假设你的决策取决于段落中是否存在某个单词。我们可以使用如下的条件语句：\n\
  \n```\nif(aba.indexOf(\"brown\") !== -1)\n```\n\n这意味着，如果单词存在，则执行此操作，否则执行另一个操作。查看以下原始文件获取两种条件的示例：[raw\
  \ file](http://icontemp.com/joagi/scripts/indexof.txt)。\n\n\n\n\n\n请注意这些方法是如何使用`[驼峰命名](http://en.wikipedia.org/wiki/CamelCase)`语法的。\n\
  \n欲更多信息，请参考以下 ECMASCRIPT 5 页面：\n\n- [15.5.4.7 String.prototype.indexOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.7).\n\
  - [15.5.4.8 String.prototype.lastIndexOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.8).\n\
  \n## 2.1.6 match()\n\n该方法在字符串中搜索与`regular expression`匹配的内容，并将所有匹配项作为`Array`返回。\n\
  \n示例脚本：\n\n```javascript\nvar xyz = \"Apples and bananas are delicious\";\nxyz.match(/n/g);\
  \ \n// 返回 [\"n  \", \"n  \", \"n  \"]\n```\n\n符号 `/ /` 隔定了我们要搜索的表达式。`g` 表示这是一个`global`搜索，意味着我们希望\
  \ JavaScript 返回所有找到的结果，而不仅仅是第一个结果。\n\n更多示例：\n\n```javascript\nxyz.match(/banana/g);\
  \ // 返回 [\"banana\"]\n```\n\n我们可以将返回的数组赋值给变量。例如，在 \"Apples and bananas\" 中。\n\n\
  ```javascript\nvar fruits = xyz.match(/Apples and bananas/g); // 返回 [\"banana\"\
  ]\n```\n\n我们还可以将输出转换为`string` 而不是获取数组：\n\n```javascript\nvar fruits = xyz.match(/Apples\
  \ and bananas/g).toString();\n```\n\n调用 fruits：\n\n```javascript\nfruits; // 返回\
  \ \"Apples and bananas\":\n```\n\n正则表达式是一个超出本文当前版本范围的主题。\n\n有用参考：\n\n[Mozzila](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
  \ | [RegExr](http://gskinner.com/RegExr/) : 一个用于学习正则表达式的直观工具。\n\n欲更多信息，请参考以下 ECMASCRIPT\
  \ 5 页面：\n\n- [String.prototype.match (regexp)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.10).\n\
  \n## 2.1.7 replace()\n\n另一种搜索方法是 `replace()`，它在字符串中搜索特定值并返回一个`new string`，其中找到的值被第二个参数中指定的值所替换。我们也可以使用正则表达式进行搜索。\n\
  \n下面的示例脚本使用了我们之前的变量 `xyz` 将 delicious 替换为 tasty：\n\n```javascript\nxyz = xyz.replace(\"\
  delicious\",\"tasty\"); \n// 返回 “Apples and bananas are tasty”.\n```\n\n欲更多信息，请参考以下\
  \ ECMASCRIPT 5 页面：\n\n- [String.prototype.replace (searchValue, replaceValue)](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.11).\n\
  \n## 2.1.8 search()\n\n`search()` 方法在未找到匹配项时返回负一 `(-1)`，如果找到匹配项，则返回`position number`。\n\
  \n1. 创建一个字符串变量：\n\n```javascript\nvar xyz = \"Apples and bananas are delicious\"\
  ;\n```\n\n2. 然后使用 `search()` 在字符串中查找一个单词：\n\n```javascript\nxyz.search(\"bananas\"\
  ); // 返回 11 (从 0 开始计数，包括空格 位于位置 11)。\n```\n\n3. 让我们尝试找到字符 ‘na’：\n\n```javascript\n\
  xyz.search(\"na\"); // 返回 13 (从 0 开始，n 位于位置 13)。\n```\n\n4. `search()` 默认是`case\
  \ sensitive`（区分大小写的）：\n\n```javascript\nxyz.search(\"A\"); // 返回位置 0\nxyz.search(\"\
  a\"); // 返回位置 7 (Apples...)\nxyz.search(/a/i); // 返回位置 0。这里使用了带有 \"i\" 标志的`regular\
  \ expression`，不区分大小写（`insensitive`）。\n```\n\n欲了解更多关于正则表达式的信息，请访问 Mozilla 的 [RegExp](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)。\n\
  \n欲更多信息，请参考以下 ECMASCRIPT 5 页面：\n\n- [15.5.4.12 String.prototype.search](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.12).\n\
  \n## 2.1.9 slice()\n\n`slice()` 方法从字符串中提取文本并返回一个`new string`。原始字符串的文本不会受到影响，除非方法应用于自身。我们必须将此切片赋值给另一个变量以便重用。该方法最多使用两个参数。第一个参数指示从哪里开始切片，第二个参数指示排除到哪个位置。\n\
  \n示例脚本：\n\n1. 声明一个变量：\n```javascript\nvar xpt = \"red,blue,black\";\n```\n\n2. 将\
  \ \"blue\" 提取到另一个变量：\n\n```javascript\nvar xpt2 = xpt.slice(4,8);\n```\n\n3. 调用\
  \ xpt2：\n```javascript\nxpt2; // 返回 “blue”，包含位置 4，排除位置 8（逗号）。\n```\n\n- **使用负数：**\
  \ 另一种方式，如果在第二个参数上应用负数，它的含义会改变：现在意味着从右侧开始`excluding`指定的字符数量。逗号和空格被视为字符。\n\n4. 示例：排除最后的颜色（包括逗号在左侧）：\n\
  \n```javascript\nvar xpt3 = xpt.slice(0,-6);\n```\n\n5. 调用变量：\n```javascript\nxpt3;\
  \ // 返回 “red, blue, white”。\n```\n换句话说，它包含了从位置零开始的所有字符，除了最后的 6 个。如果我们在左侧输入了其他数字，就可以排除某些字符。\n\
  \n- **仅使用一个参数：** 当使用单个正参数时，它代表包含的起始字符位置，延伸到结尾。\n\n6. 示例：\n\n```javascript\nvar x\
  \ = xpt.slice(3); // 返回 \",blue,white,black\"，意味着 \"red\" 被切掉了。\n```\n\n如果单个参数是负数，它具有相反的效果：它告诉\
  \ JavaScript 从右侧包含多少字符并排除所有其他。\n\n7. 示例：\n\n```javascript\nvar x = xpt.slice(-3);\
  \ // 返回 \"black\" 中的 \"ack\"。从右向左数 3 个字符并切掉所有其他。\n```\n\n8. 另一个示例。从 ecmascript 中提取\
  \ \"e\"：\n\n```javascript\n\"ecmascript\".slice(1); // 返回 \"cmascript\"。\n```\n\
  这实际上用于移除第一个字符并将其替换为另一个大写字符，我们稍后在介绍 `toUpperCase()` 时会看到。\n\n欲更多信息，请参考以下 ECMASCRIPT\
  \ 5 页面：\n\n- [15.5.4.13 String.prototype.slice](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.13).\n\
  \n## 2.1.10 split()\n\n`split()` 方法非常有用，让我们确保理解背后的机制。`split()` 将字符串转换为数组。`split()`\
  \ 的相反操作是 `join()`。数组将在下一个主题介绍。\n\n1. 示例，我们将声明一个用空格分隔（无逗号）的新变量：\n\n```javascript\n\
  var abc = \"green yellow red black\";\n```\n\n词汇：在计算机科学中，`delimiter`（分隔符）是标记`unit\
  \ of data`开始或结束的符号（或字符序列）。在下面的示例 1|2|3 中，分隔符是管道符号 `|`。在这里，“1, 2, 3, 4”的分隔符是逗号，依此类推。\n\
  \n分割字符串时我们首先需要确定的是，我们将使用什么作为`delimiter`来分离`units of data`。\n\n在我们的情况下，我们将使用单词之间的`blank\
  \ space`作为分隔符。这意味着`split()` 方法将获取两个分隔符之间的所有内容，创建一个包含切分数据的数组。\n\n2. 让我们用空格作为分隔符将变量\
  \ `abc` 分分成单独的单词，并将其放入新变量 `abc2` 中：\n\n```javascript\nvar abc2 = abc.split(\" \"\
  );\n```\n\n3. 调用变量：\n\n```javascript\nabc2; // 返回 [\"green\", \"yellow\", \"red\"\
  , \"black\"].\n```\n空格被消除，每个单词在新的数组中变得变得独立。\n\n\n\n\n\n请记住，分隔符不会包含在新数组中。如果我们想使用\
  \ `\"d\"` 作为分隔符来分割 `abcdefg`，那么 `\"d\"` 将不会被包含，新数组将看起来像这样：`[abc, efg]`。如果你想尝试一下，请确保给\
  \ `\"d\"` 加上引号因为它是一个字符串。示例：\n\n```javascript\nvar y = x.split(\"d\");\n```\n\n`split()`\
  \ 方法可以使用`第二个参数`。第一个参数是`delimiter`（分隔不同单元的字符），第二个参数是`limiter`（限制器），表示要包含的单元数量，换句话说，就是数组的`length`。\n\
  \n让我们尝试一下：\n\n4- 声明一个变量：`var abc3 = abc.split(\" \",3);`\n\n5- 调用 `abc3`：\n\n```javascript\n\
  abc3; // 返回 [\"green\", \"yellow\", \"red\"], 它排除了“black”。\n```\n\n6- abc3 的长度是多少？`abc3.length;`\
  \ // 返回 3\n\n**注意：** 使用 `split()` 时，我们必须传递至少一个参数，即分隔符。如果我们不向 `split` 函数传递分隔符，结果仍然是一个数组，但数组中的项目数量将为一个。所以从某种意义上说，`split()`\
  \ 可以作为另一种将`length`为 1 的`字符串转换为数组`的方法，但可能并不是一个很常用的方法。\n\n正则表达式让 `split` 变成了一个非常强大的方法。花时间学习正则表达式是一项非常值得的投入。这里关于该主题的另一个链接：[Wikipedia](http://en.wikipedia.org/wiki/Regular_expression)。\n\
  \n**欲需更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n- [15.5.4.14 String.prototype.split](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.14)。\n\
  \n## 2.1.11 substr()\n\n子字符串方法 `substr()` 是 `slice()` 方法的替代方案。`slice()` 方法接收一个 `start`\
  \ 索引位置和一个 `end` 索引位置，而 `substr()` 方法接收一个 `start` 索引位置和一个表示要提取项目长度的数字。\n\n不要将 `substr()`\
  \ 与 `substring()` 混淆。后者实际上已经被 `slice()` 取代了。我们稍后会讨论它。\n\n**何时使用 slice 何时使用 substr？**\n\
  \n当你知道第一个要`包含`的字符的位置数和第一个要`排除`的字符的位置时，使用 `slice()`。当你知道需要提取内容的字符`length`时，使用 `substr()`。无论使用哪种方法，你都需要知道要包含的第一个字符的位置。\n\
  \n在 `substr()` 中，`(4,9)` 意味着提取从 4 开始（从 0 开始并计算空格，这意味着第 5 个字符）并停止于 12（包含），这意味着第 13\
  \ 个字符，对应于 `4 + 9`。\n\n**示例代码（与 slice 使用的相同）：**\n\n1- 声明一个变量：\n\n```javascript\n\
  var xpt = \"red, blue, white, black\";\n```\n\n2- 使用与之前 slice 相同的脚本，以便我们能够看到区别：\n\
  \n```javascript\nvar xpt2 = xpt.substr(4,9); \n// 从 0 开始，将空格作为第一个字符，然后向右计数 9 位，包含在内。\n\
  xpt2; // 返回 \" blue, wh\". \n```\n\n如果你记得，之前用于 slice 的相同数字 `(4,9)` 给了我们“blue”。`slice\
  \ 4/9` 意味着从 4 开始（0 索引）并排除 9，给了我们“blue”。现在，通过使用 `substr`，`(4, 9)` 意味着从 4 开始（0 索引）并向右扩展\
  \ 9 个字符，给了我们“blue, wh”。\n\n**注意：** 在 `substr` 中，第二个数字 9 是要提取的字符数。在 `slice` 中，第二个数字\
  \ 9 代表第一个要排除的`position`（位置数）。\n\n![](img/00014.jpeg)\n\n图 14\n\n**欲需更多信息，请参考以下 ECMASCRIPT\
  \ 5 页面：**\n\n- [String.prototype.substr (start, length)](http://www.ecma-international.org/ecma-262/5.1/#sec-B.2.3)\n\
  \nSubstr 未在 ecma-262 中发布。然而它现在位于附录 B（上面的链接）。\n\n## 2.1.12 substr() vs substring()\n\
  \n这里情况变得有一点混乱，因为 `substr` 和 `substring` 的名字看起来非常相似。实际上，它们的工作方式是不同的，意义在于`substring\
  \ 已经被 slice 取代`。\n\n曾几何时，JavaScript 开发者想要实现负数作为从字符串末尾数到某个特定位置的手段。问题在于为了向后兼容，因此他们决定想出一个不同的方法名称\
  \ `slice()`，并保留了原来的名称 `substring`。\n\n除了不接受负数外，`substring` 不在乎参数的顺序，这意味着它总是假设较小的数字在前面。所以当我们编写代码\
  \ `(5,4)` 时，它意味着 `(4,5)`。`slice()` 方法则严格得多，顺序是重要的，因为它不会自动反转顺序。\n\n**该怎么办？** 使用 `slice()`。注意\
  \ `substring()`。\n\n**欲需更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n- [15.5.4.15 String.prototype.substring](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.15)。\n\
  \n## 2.1.13 toLowerCase() and toUpperCase()\n\n`toLowerCase()` 方法输出一个全小写的新字符串。`toUpperCase()`\
  \ 方法输出一个全大写的新字符串。\n\n**示例代码：**\n\n1- 声明一个变量：\n\n```javascript\nvar txt = \"ECMASCRIPT\"\
  ;\n```\n\n2- 转换为小写：\n\n```javascript\ntxt.toLowerCase(); // 返回 \"ecmascript\"\n\
  ```\n\n3- 转换为大写：\n\n```javascript\ntxt.toUpperCase(); // 返回 \"ECMASCRIPT\"\n```\n\
  \n4- 这里是首字母大写的一种方法：\n\n```javascript\ntxt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase();\
  \ // 返回 \"Ecmascript\"\n```\n\n5- 或者不用 `charAt`，我们可以使用数组符号：\n\n```javascript\ntxt[0].toUpperCase()\
  \ + txt.slice(1).toLowerCase(); // 返回 \"Ecmascript\"\n```\n\n不要忘记可以使用 CSS 将段落的首字母大写：\n\
  \n```css\np:first-letter { text-transform:capitalize; }\n```\n\n**欲需更多信息，请参考以下 ECMASCRIPT\
  \ 5 页面：**\n\n- [15.5.4.16 String.prototype.toLowerCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.16)。\n\
  - [15.5.4.17 String.prototype.toUpperCase](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.17)。\n\
  \n## 2.1.14 trim()\n\n`trim()` 方法是由 ECMAScript 5 引入的。它创建一个去掉所有前后空格的字符串副本。由于原始字符串保持不变，如果我们清理原始字符串，我们需要将其赋值给自己。\n\
  \n**示例代码：**\n\n1- 声明一个带有多个开头和结尾空格的字符串：\n\n![](img/00015.jpeg)\n\n图 15 [原始文件](http://icontemp.com/joagi/scripts/8.txt)。\
  \ [ icontemp.com/joagi/scripts/8.txt ]\n\n2- 调用变量查看字符串的样子：\n\n```javascript\nstr1;\
  \ // 返回像上面一样带有多个空格的 test，对吗？\n```\n\n3- 声明第二个变量并将其赋值为 `str1` 的修剪版本：\n\n![](img/00016.jpeg)\n\
  \n图 16\n\n4- 调用 `str2` 查看它的样子：\n\n```javascript\nstr2; // 返回完全修剪的“test”，对吗？\n```\n\
  \n5- 调用 `str1` 查看它的样子？\n\n```javascript\nstr1; // 返回带有所有空白字符的原始字符串。\n```\n\n为了清理原始字符串，我们需要将变量赋值给自己。\n\
  \n6- 像下面的图片所示：\n\n![](img/00017.jpeg)\n\n图 17\n\n7- 现在当你再次调用 `str1` 时，它将是完全修剪过的，周围没有空格。\n\
  \n`trim()` 方法可能无法被如 *IE8* 及更早版本的浏览器识别。如果这是一个问题，请尝试使用 jQuery 版本。\n\n\n\n\n\n- [15.5.4.20\
  \ String.prototype.trim](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.20).\n\
  \n## 2.1.15 valueOf()\n\nString 方法 `valueOf()` 将对象转换为原始值。这通常是自动完成的，因此我们很少手动调用它。在书中我们有时会用到它。\n\
  \n所有包括 `String` 在内的对象都继承自对象 `Object`，并且所有对象都从 `Object.prototype` 继承属性和方法，除非它们被新对象重写。`valueOf()`\
  \ 方法继承自 `Object`，但每个**内置对象**（如 `String`）都重写了它，以便能够返回一个与其类型相匹配的值。\n\n当我们调用 `valueOf`\
  \ 时，它返回的值如下：\n\n在 `Array` 中，返回数组实例；在 `Boolean` 中，返回 `Boolean` 值；在 `Date` 中，返回自 UTC\
  \ 1970 年 1 月 1 日午夜以来的毫秒级存储时间值；在 `Function` 中，返回函数本身；在 `Number` 中，返回数值值；在 `String`\
  \ 中，返回字符串值；在 `Math` 和 `Error` 对象中，不返回任何内容，因为它们没有 `valueOf` 方法；最后但同样重要的是，在没有原始值的对象中，返回对象\
  \ `Object` 身。\n\n代码脚本为 `objectName.valueOf()`。当我们在字符串变量上调用 `valueOf` 时，JavaScript\
  \ 会将其封装在 `String` 对象中并交给我们它的值。\n\n示例代码：\n\n```javascript\n1- 声明变量：var ppp = \"amazon\"\
  ;\n2- 调用 valueOf: ppp.valueOf(); // 返回 “amount”。\n```\n\n回顾这个概念，**`valueOf()` 返回对象的原始值**。**如果没有原始值，它返回对象引用本身**。每个内置对象类型都会修改输出结果以与其类型保持一致。对于\
  \ `String` 情况，它返回字符串值。该方法通常是 JavaScript 在需要对象的原始值时，在后台自动调用的。它不是一种常见的 set 编写的代码脚本，但存在例外。\n\
  \n`valueOf()` 是用于从对象中提取单个值的默认方法。另一个方法是 `toString()`，它在 `String` 对象上并不需要，但在其他类型的对象上非常有用，是一种显示值本身的方法。正如早些提到的，在\
  \ `Boolean` 对象中，值将被转换为字符串 `true` 或其对应项 `false`。在其他某些 `Object` 类型中，`valueOf()` 的结果可能用处不大，应用也不那么频繁。我们将在后面的章节中重新回顾\
  \ `valueOf`。\n\n**需要进一步的解释吗？**\n\n```javascript\n3- 声明以下变量：var x = 123;\n4- 调用 valueOf\
  \ x：x.valueOf(); // 返回 123。它显示了 x 内部的值。\n5- 声明数组：var y = [\"Tony\",\"de\",\"Araujo\"\
  ];\n6- 获取 y 的 valueOf：y.valueOf(); // 返回 [\"Tony\", \"de\", \"Araujo\"]\n7 步骤 6\
  \ 中的示例可以使用方法 `toString()` 来获得不同的视觉效果：y.toString(); // 返回 \"Tony,de,Araujo\"\n```\n\
  \nJavaScript 根据它当前需要使用什么以及正在处理什么类型的对象在内部进行这些转换。程序员也会利用 `valueOf()`，你将在后续的话题中看到。\n\
  \n**欲需更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n- [15.5.4.3 String.prototype.valueOf](http://www.ecma-international.org/ecma-262/5.1/#sec-15.5.4.3).\n\
  \n## 总结：String 对象方法\n\n在 ECMAScript 中，`Object` 构造函数能够在需要时自动将**所有原始类型装箱**为对象类型。\n\
  \n这就像是，当 `Object` 看到原始值被用作对象时，它会这样对其进行*装箱*：\n\n`new Object([primitive])`\n\n然后，它会这样对其进行拆箱：\n\
  \n`[boxedobject].valueOf()` （记得关于 `valueOf()` 的讨论吗？它在调用时返回一个原始值）。\n\n我们将在后续的话题中使用\
  \ `String` 方法，因为这些方法无处不在。如果你发现自己有点迷失，请确保返回这一章。我会在进行过程中提醒你。\n\n学习是非线性的，传送带式的学习模型源于\
  \ 19 世纪，它在我们的现代世界没有立足之地。我们通过实践来学习，通过直接经历以及处理出现的问题来学习。我们通过在已知知识和当前正在学习的内容之间建立联系来学习。我们每个人都在构建自己的知识集。我希望我在为你提供构建自己经验的工具方面是相当成功的。\n\
  \n## 2.2 JavaScript 中的 Array 对象\n\n数组是*有序列表*对象。顺序使得这个对象成为数组，因为对象本身通常是无序的。\n\n（对于无序列表，请参见\
  \ 5.1 无序列表作为对象。）\n\n在 JavaScript 中，[数组](https://en.wikipedia.org/wiki/Array) 使用索引数字指向一个可能存储数据的*口袋（pocket）*。与其它语言不同，在\
  \ JavaScript 中没有所谓的关联数组（即索引被字符串标签代替）。如果你尝试给数据口袋分配一个标签，它会使该数据成为该对象的属性，而不会被列为数组项。如果你真的想要*键值对*，最好使用\
  \ `Object` 构造（使用*大括号*，这使其成为一个*无序列表*）而不是数组构造（方括号）。对象构造将在稍后的章节中更详细地介绍。该章节的链接可以在段落上方找到。\n\
  \n由于数组的严格顺序，有*特定方法*可以将数据追加到开头、末尾，也可以在项目之间进行追加。\n\n数组构造函数如下：\n\n```javascript\nvar\
  \ bcd = new Array(\"green\",\"red\",\"yellow\");\n```\n\n这声明了一个名为 `bcd` 的变量（指针），它指向一个包含三个字符串名称的数组对象。注意\
  \ `new` 关键字。尽管我们在像这样声明数组对象时可以跳过“new”，但建议在使用这种类型的构造时（我指的是 `Array()` 函数调用）**始终**包含它。注意\
  \ `A`rray 的第一个字母是大大写的，就像 `O`bject 和 `String` 对象一样。在 JavaScript 中，原生和内置对象的名称的第一个字母都是大写的。由于\
  \ JavaScript 是对大小写敏感的，所有原生和内置对象必须按照创建时的精确格式进行调用，换句话说，首字母必须大写。\n\nJavaScript 有一种创建数组的快捷方式，即**方括号表示法**。\n\
  \n而不是这种：`var ijk = new Array( ); // 创建一个空数组。\n\n1- 这样做更常见：`var ijk = [];` // 创建一个空数组。\n\
  \n与某些语言不同，不需要声明数组可以包含的*项目数量*。JavaScript 数组会相应调整。当我们添加新项目时，就像处理字符串一样，JavaScript 将现有数据加上新数据复制到新的数组实例并丢弃旧的，同时，JavaScript\
  \ 让变量指向最新的数组实例。\n\n2- 在声明上述数组 `ijk` 后，我们可以这样添加项目：\n\n```javascript\nijk[0] = \"\
  red\"; // 第一个位置始终是 0。\nijk[1] = \"white\";\nijk[2] = \"blue\";\n```\n\n3- 这样调用：`ijk;`\
  \ // 返回 [\"red\", \"white\", \"blue\"].\n\n4- 我们也可以这样调用单个项目：`ijk[0];` // 返回 \"red\"\
  。\n\n就像 String 对象一样，`Array` 对象从 `object Object` 继承属性和方法。\n\n接下来我们将介绍其中一些属性和方法。\n\
  \na) **数组属性**如 `length`、`prototype` 和 `constructor`。\n\n`constructor` 属性在介绍 `String`\
  \ 对象时已经解释过。我们将在后后的章节创建自己的对象时，在实验工作中探索*构造函数*。\n\n\n\n\n数组的 `length` 属性用法与 `String`\
  \ 对象的长度完全一样。毕竟，字符串不就像数组一样，是一个有序字符的列表，对吧？然而，使用字符串有其理由，使用数组也有其理由。我们可以显示或打印字符串，但要打印数组，我们需要遍历每一个项。我们还可以更改数组的元素，但要更改字符串上的字符就要稍微复杂一些。这就是为什么有时我们需要将数组转换为字符串，而另时候又又将字符串转换为数组。你还记得我们如何使用\
  \ `split()` 将字符串转换为数组吗？相反的操作可以通过 `join()` 完成，我们将在本章介绍到 Array 方法时涵盖该方法。\n\n1- 在字符串\
  \ `xyz = \"bananas\";` 中，`xyz.length;` // 返回 7。\n\n2- 在我们之前的数组中，`ijk.length;` //\
  \ 返回 3，因为数组中有三个项：`[\"red\", \"white\", \"blue\"]`。\n\n当我们需要遍历数组时（例如逐个项目以完成某项任务），`Length`\
  \ 就非常有用。使用 `length` 的原因是大多数时候我们并不知道数组中包含多少个项。通过直接或间接调用它的长度来代表项的数量，我们就不需要真正担心数组的大小。请注意，当你需要某个项的特定\
  \ `location` 数字时，你可能需要调用 `length -1`，因为数组是从零位置开始的。这完全取决于你想实现什么。一个包含 6 个项的数组长度为六，但它的项位置从零到五。稍后会有关于这些技术的示例。\n\
  \n`prototype` 属性是一个构造函数，允许向 `Array` `object` 添加新的属性和方法。请记住，就像 `String` 原型一样，`Array`\
  \ 原型是向 `Array()` 对象本身添加新方法和属性，而不是向单个数组实例。到目前为止，在我们涵盖 `Object` 对象之前，我们一直在使用 `built\
  \ in objects`（内置对象），我们并将继续这样做，因为内置对象是 JavaScript 中最重要的学习内容。稍后我们将讨论如何作为原型来创建 `user`\
  \ 对象。当我们向 `Array` 对象添加新属性或方法时，这种添加不是永久的，它只适用于该 `Array` 对象的此实例以及此执行环境下的所有数组。当程序结束时，所有的自定义都会被擦除。\n\
  \n是时候行动了。\n\n由于我们无法像显示字符串那样原生地显示数组项，让我们原型化一个方法，调用它时以字符串格式 `console logs` 数组项。\n\n\
  1- 让我们使用之前的相同数组。如果你的控制台中还没有这个数组，请像下面所示声明一个新的：\n\n```\nvar ijk = [\"red\", \"white\"\
  , \"blue\"];\n```\n\n让我们原型化一个函数，该函数使用属性 `length` 遍历数组并将每个单独的项 `console log` 到屏幕上。该函数将命名为\
  \ `listArray`：\n\n![](img/00018.jpeg)\n\n图 18 [raw file](http://icontemp.com/joagi/scripts/5.txt)。[\
  \ icontemp.com/joagi/scripts/5.txt ]\n\n上面的图形使用了点语法，该语法 `binds` 将新创建的变量名 `listArray`\
  \ 绑定到 `Array` 原型菜单，而它又绑定到 `Array` 对象。`listArray` 指向一个匿名函数。该方法使用临时变量 `\"i\"` 遍历由\
  \ `\"this\"` 代表的数组的每个项，直到到达其 `length` 的结束。对于每次迭代，作为调用函数的数组占位符 `placeholder` 的 `\"\
  this\"` 将打印位置 `\"i\"` 项。\n\n2- 将上述原型脚本复制到你的编辑器中（查看 raw file），然后将其粘贴到控制台中。这将向当前的原生\
  \ `Array` 对象实例添加 `listArray()`。\n\n3- 现在在现有数组上调用 `listArray()`：`ijk.listArray();`\
  \ // 它将返回 *red white blue*。\n\n你是把 `listArray` 写成 `listArray( )` 的吗？它是一个函数或方法，所以括号是必要的。\n\
  \n为了仅仅证明这个方法确实属于 `Array` 对象本身，让我们创建一个新数组并看看是否可以显示它的项：\n\n4- 声明一个新数组：`var bcd = [\"\
  apples\",\"bananas\",\"grapes\"];`\n\n5- 调用它的 `listArray()` 方法：`bcd.listArray();`\
  \ // 返回 *apples bananas grapes*。\n\n到为止，我们知道原型属性用于向 `existing`（现有）对象 `add properties\
  \ and methods`。我们还知道如何设计基础脚本来创建此类方法。我们已经在 `String` 中见过它，在 `Array` 中也见过了。不需要记忆任何东西，`we\
  \ learn by layers`（我们分层学习）。吃大象要一步一步吃，对吧？\n\n接下来我们将讨论在实例化新数组对象时自动可用的 `native` `Array`\
  \ 方法。\n\na) `Array methods` 如 `concat()`, `join`, `reverse()`, `sort()`, `pop()`,\
  \ `push()`, `shift()`, `unshift()`, `slice()`, `splice()`\n\n这些 `Array` 方法中的我们在讨论\
  \ `String` 对象时已经涵盖过，第二次遇到时你会觉得很熟悉。俗说重复是学习之母，尤其是当我们为它添加新的 `flavor` 时。\n\n## 2.2.1\
  \ concat()\n\n`concat()` 方法将第二个数组的元素连接（添加）到第一个数组的末尾。\n\n如果我们还没有上一个题目的数组 `abc`，可以这样声明它，以便显示它：\n\
  \n1- 声明一个数组：`var ijk = [\"red\", \"white\", \"blue\"];`\n\n2- 声明第二个数组：`var bcd =\
  \ [\"apples\",\"bananas\",\"grapes\"];`\n\n3- 现在通过连接声明第三个数组：`var abc = ijk.concat(bcd);`\n\
  \n4- 查看 abc：`abc;` // 返回 [\"red\",\"white\",\"blue\",\"apples\",\"bananas\",\"grapes\"\
  ]\n\n`ijk` 是先写的，括号内的其他数组是后写的。如果你更改或删除前两个数组中的任何一个，第三个数组将保持不变。现在有三个不同的数组。如果我们的意图是合并这些数组，我们可以这样编写（**在下一个主题中可以使用它**）：\n\
  \n`ijk.concat(bcd);`\n\n`ijk;` // 返回 [\"red\",\"white\",\"blue\",\"apples\",\"bananas\"\
  ,\"grapes\"]\n\n我们现在可以将 bcd 声明为 `null`：`bcd = null;`\n\n更多信息请参考以下 ECMCRIPT 5 页面：\n\
  \n· [15.4.4.4 Array.prototype.concat](https://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.4)\n\
  \n## 2.2.2 join()\n\n将数组转换为字符串，我们使用 `Array` 方法 `join()`。这是 `String` 方法 `split()`\
  \ 的相反操作，后者将字符串转换为数组。\n\n1- 如果你没有上一个题目的数组 `abc`，请这样声明它：`var abc = [\"red\", \"white\"\
  , \"blue\", \"apples\", \"bananas\", \"grapes\"];`\n\n2- 让我们分配一个新的字符串变量包含数组 `abc`\
  \ 的元素：`var abc2 = abc.join();`\n\n3- 查看 abc2：`abc2;` // 返回 \"red,white,blue,apples,bananas,grapes\"\
  \n\n注意字符串的每个元素是用逗号分隔的。这是默认设置。我们可以通过在括号内包含符号来指定分隔每个元素的符号：\n\n`abc2 = abc.join(\"\
  \ \");` // 返回 \"red white blue apples bananas grapes\"\n\n`abc2 = abc.join(\"/\"\
  );` // 返回 \"red/white/blue/apples/bananas/grapes\"。 等\n\n数组 `abc` 保持不变。\n\n更多信息请参考以下\
  \ ECMCRIPT 5 页面：\n\n· [15.4.4.5 Array.prototype.join](https://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.5)\n\
  \n## 2.2.3 reverse()\n\n`Array` 方法 `reverse()` 反转元素的顺序。\n\n**反转是 *永久的***：\n\n反转\
  \ **abc**：\n\n\n\n\n\n`abc.reverse();` // 返回 [\"grapes\", \"bananas\", \"apples\"\
  , \"blue\", \"white\", \"red\"]。\n\n更多信息，请参考以下 ECMASCRIPT 5 页面：\n\n· [15.4.4.8 Array.prototype.reverse\
  \ ( )](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.8)\n\n## 2.2.4\
  \ sort()\n\n在 `sort()` 方法中，默认按照字母顺序进行排序，即从 `a` 到 `z`。然而，字母排序不适用于数字，因为例如，20 会排在 3\
  \ 之前。这是因为数字在排序之前会被转换为字符串，因此左侧的第一个数字将根据该数字进行相应的排序。要获得真正的数值排序，我们应该指定得更具体，并让 JavaScript\
  \ 知晓这一点。即使所有项目都是数字，这种字母排序也会由于字符串[类型转换](http://en.wikipedia.org/wiki/Programming_language#Type_system)\
  \ 而发生。\n\n1- 让我们使用以下数组进行测试：`var x = [\"red\", \"white\", \"blue\", 35, 24];`\n\n\
  `x.sort();` // 返回 [24, 35, \"blue\", \"red\", \"white\"]。\n\n因为 JavaScript 知道排序可能会出现问题，所以它允许在\
  \ `sort()` 括号中传递一个比较函数作为参数。这个函数是*回调函数*的一个示例。它之所以命名为回调，是因为 JS 回调你之前提供的函数。（见下方图片中的函数）。\n\
  \n`sort()` 方法处理你的`回调函数`，该函数会比较数组中的每两个项目并做出决定。然后，它会将放在最后（last）的项目与数组上的下一个（next）项目进行比较，依此类推。\n\
  \n这是选择标准：\n\n当函数比较的结果（`减法`）为`负数`时，第一个项目将位于被比较的第二个项目`之前`（不进行交换）。当结果为`零`时，两个项目`相等`，排序不会发生变化。当结果为`正`数时，`第一个`个项目将与第二个项目交换，使后者变为第一个。\n\
  \n2- 让我们声明一个数字数组来看它是如何运作的：\n\n`var numA = [5,8,1,3,20];` // 通常情况下，20 会显示在 3 之前。\n\
  \n3- 将以下函数复制到你的编辑器中，然后将其粘贴到控制台中；\n\n![](img/00019.jpeg)\n\n图 19 [原始文件](http://icontemp.com/joagi/scripts/6.txt).[\
  \ icontemp.com/joagi/scripts/6.txt ]\n\n我们将*传递*函数 `compareMe` 到 `sort()` 方法中。这将*触发*\
  \ JavaScript *注意*每个数组元素在通过函数时的结果。然后将做出决定在相应的位置放置该项目。当 `num1` 低于 `num2` 时，结果为`负`。如果它们`相等`，结果为`零`。当\
  \ `num1` `高于` `num2` 时，结果为`正`。JavaScript 将根据其`内部表`进行排序。该函数与此决定无关；函数只是通过提供其计算结果来帮助做出决定。`sort()`\
  \ 机制完成了其余工作。此函数就像一个过滤器，在数字排序之前给每个项目给出一个排名。\n\n4- 现在我们可以正确地对数字进行排序了：\n\n`numA.sort(compareMe);`\
  \ // 返回 [1, 3, 5, 8, 20]。\n\n5- 如果我们想要反转排序该呢？\n\n`numA.sort(compareMe).reverse();`\
  \ // 返回 [20, 8, 5, 3, 1]。\n\n由于 `sort()` 允许我们使用回调函数，我们也可以将其用于字符串数组，以按*单词长度*进行排序。对于这一点，我们不再使用\
  \ `num1 – num2`，而是使用 `paran1.length – paran2.length`。（“paran”这个名字是我发明的。你可以称它任何名字）。\n\
  \n这里有一个以后参考的示例脚本。注意此脚本如何高效地使用内置匿名函数作为回调：\n\n![](img/00020.jpeg)\n\n图 20 [原始文件](http://icontemp.com/joagi/scripts/19.txt).[\
  \ icontemp.com/joagi/scripts/19.txt ]\n\n更多信息，请参考以下 ECMASCRIPT 5 页面：[15.4.4.11 Array.prototype.sort](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.11)\n\
  \n## 2.2.5 pop() and push()\n\n数组方法 `pop()` 会*弹出*数组的`最后一个元素`，并且它会*减少*数组长度一个，因为两者是同时发生的。\n\
  \n1- 再次创建我们的水果数组 `abc`（或从此[原始文件](http://icontemp.com/joagi/scripts/225.txt）复制）：[\
  \ icontemp.com/joagi/scripts/225.txt ]\n\n`var abc =[\"apples\",\"bananas\",\"blue\"\
  ,\"grapes\",\"red\",\"white\"];e`\n\n2- 在控制台中调用数组：`abc;` // 结果 [\"apples\", \"bananas\"\
  , \"blue\", \"grapes\", \"red\", \"white\"]。\n\n3- 最后一项：`abc.pop();` // 移除 \"white\"\
  。\n\n4- 调用数组：`abc;` // 结果 [\"apples\", \"bananas\", \"blue\", \"grapes\", \"red\"\
  ]。\n\n“white”元素**永远消失了**除非我们用 `push()` 将带回来：\n\n数组方法 `push()` 将元素插入到最后一个位置。\n\n\
  5- 重新插入最后一项：`abc.push(\"white\");` // 返回 6。六是元素的数量。\n\n6- 再次调用 abc：`abc;` // 结果为\
  \ [\"apples\", \"bananas\", \"blue\", \"grapes\", \"red\", \"white\"]。\n\n最后一个元素\
  \ *white* 又回来了，并且仍然在最后一个位置，因为 push 将元素添加到数组的末尾。\n\n在某种意义上，数组的作用就像一个栈，以“后进先出”的方式限制项目的插入和移除。`pop()`\
  \ 和 `push()` 对于插入和移除项目非常实用，而无需引用它们的特定位置。我们总是知道操作发生在数组的末尾。\n\n7- 我们可以 `push()`**多个项目**（手动或在循环）：\n\
  \n`abc.push(\"peaches\",\"cherries\", \"apricots\");`\n\n8- 现在 `abc` 有 9 个项目：\n\n\
  `abc;` // 返回 [\"apples\", \"bananas\", \"blue\", \"grapes\", \"red\", \"white\"\
  , \"peaches\", \"cherries\", \"apricots\"]。\n\n让我们再次用 `pop()` 移除它们。**啊，等一下！！！**\
  \ 虽然 `push()` 可以一次添加多个项目，但 `pop()` 每次只能移除一个。我们必须*手动* `pop()` 三次，对吧？当然，我们也可以[创建一个循环](http://icontemp.com/joagi/scripts/225a.txt)\
  \ 并从数组中弹出所有项目，但注意不要低于数组的总长度，因为如果循环低于零，你将得到错误。\n\n9- 为了练习，让我们手动操作三次。这将使我们的 `abc`\
  \ 数组恢复到原始状态。第一次我将尝试尝试一次性 pop() 所有项：\n\n`abc.pop(\"peaches\",\"cherries\", \"apricots\"\
  );` // 它只移除了“apricots”。它忽略了另外两个元素，所以我们需要一个移除：`abc.pop();` // 移除了“cherries”。`abc.pop();`\
  \ // 移除了“peaches”。现在我们应该回到原始数组长度：`abc;` // 返回 [\"apples\", \"bananas\", \"blue\"\
  , \"grapes\", \"red\", \"white\"]\n\n**注意：** 虽然我们应该了解 `pop()`，因为它在许多脚本中使用，但我们可以使用\
  \ `splice()`，例如 `abc.splice(-3,3);` `splice` 有许多非常实用的选项（`splice()` 将在本章节后续部分介绍）。\n\
  \n更多信息，请参考以下 ECMASCRIPT 5 页面：\n\n· [15.4.4.6 Array.prototype.pop ( )](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.6)\n\
  \n· [15.4.4.7 Array.prototype.push](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.7)\n\
  \n## 2.2.6 shift() and unshift()\n\n`shift()` 和 `unshift()` 方法与 `pop()` 和 `push()`\
  \ 相似，但它们不是作用最后一个元素，而是作用数组的**第一个元素**。\n\n将数组想象成一个[Pez](https://en.wikipedia.org/wiki/Pez_Candy)糖果分配器。当我们把糖放入分配器顶部时，我们需要将其推进去。当我们移除一颗糖果时，我们将其弹出（pop）。相反，当我们把一颗糖果放入底部时，我们需要\
  \ `unshift` 将其他的向上移动一个槽，它们的位置从原始位置移动了一个位置，因此它们失去了位置“排名”。\n\n\n\n\n\n这里是我们的数组示例：`var\
  \ abc = [\"apples\", \"bananas\", \"blue\", \"grapes\", \"red\", \"white\"];`\n\n\
  1- 删除第一个元素：（链接到原始[原始文件](http://icontemp.com/joagi/scripts/225.txt)) [ icontemp.com/joagi/scripts/225.txt\
  \ ]\n\n`abc.shift();` // 移除“apples”。\n\n2- 调用数组：`abc;` // 返回 [\"bananas\", \"blue\"\
  , \"grapes\", \"red\", \"white\"]\n\n3- 重新插入第一个元素：`abc.unshift(\"apples\");` //\
  \ 返回 6。6 是元素的个数。\n\n4- 调用数组：`abc;` // 返回 [\"Apples\", \"bananas\", \"blue\", \"\
  grapes\", \"red\", \"white\"]。\n\n**欲更多信息，请参考以下 ECMASCRIPT 5 页面：**\n\n· [15.4.4.9\
  \ Array.prototype.shift ( )](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.9)\n\
  \n· [15.4.4.13 Array.prototype.unshift](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.13)\n\
  \n## 2.2.7 slice( )\n\n就像在 String 对象中一样，`slice(()` 方法从一个数组中提取项并返回一个包含提取数据的新数组。旧数组中元素的更改不会受到影响，除非该方法应用于同一个数组上。\n\
  \n此方法接受两个参数。第一个数字表示要切片的第一个元素（从 0 开始）。第二个数字表示不被切片的第一个元素。（[原始文件](http://icontemp.com/joagi/scripts/225.txt))。[\
  \ icontemp.com/joagi/scripts/225.txt ]\n\n1- 创建与之前相同的 `abc` 数组（见上方的原始文件）：\n\n`[\"\
  apples\", \"bananas\", \"blue\", \"grapes\", \"red\", \"white\"]`\n\n2- 让我们通过基于\
  \ `abc` 创建一个新数组，但排除“red”和“white”，来应用 `slice(()`：`var abc2 = abc.slice(0,4);`\n\n\
  // 从 0 开始并排除位置 4 及以后。\n\n3- 调用新数组：`abc2;` // 返回 [\"apples\", \"bananas\", \"blue\"\
  , \"grapes\"]，它们位于位置 0,1,2,3。\n\n**slice() 中的负数：**\n\n`slice(()()` 的功能远比我们刚刚经历的更多。通过使用负数，我们可以从数组长度的末尾（最右位置）到开始选择元素。让我们来看几个例子来解释这个令人困惑的话：\n\
  \n4- 我们的数组 `abc` 是\n\n`[\"apples\", \"bananas\", \"blue\", \"grapes\", \"red\",\
  \ \"white\"]`。\n\n5- 声明另一个数组并赋值为对 abc 进行 -2 负数切片的结果：`var abc3 = abc.slice(-2);`\
  \ // 它将从 `abc` 复制最后两个元素。负数从右向左选择等同于该数字指定的数量数量。在这种情况下，它从右侧选取了两个元素。我们在这里讨论的不是位置编号，而是元素的个数。\n\
  \n`abc3;` // 返回 [\"red\", \"white\"]。\n\n6- 将另一个经过两个负数切片的数组赋值给 `abc`：`var abc4 =\
  \ abc.slice(-4,-2);` // 这将复制倒数第 4 个和倒数第 3 个元素，因为它在倒数第二个元素处切断。所以我们可以说“从倒数第 4 个开始并排除最后两个”。`abc4;`\
  \ // 返回 [\"blue\", \"grapes\"]。\n\n学习 `slice()` 的最佳方法是根据你选择的数组通过不同的场景进行练习。此外，当你需要复习时请返回此页面。\n\
  \n关于 slice 的另一个示例，请见 3.1.1 节。\n\n**欲更多信息，请参考以下 ECMASCRIPT 5 页面：** [15.4.4.10 Array.prototype.slice](http://www.ecma-international.org/ecma-262/5.1/#sec-15.4.4.10)\n\
  \n## 2.2.8 splice( )\n\n数组方法 `splice()` 非常有趣。你还记得 push 和 unshift 吗？它们将元素添加到数组的末尾或开头，对吧？`splice()`\
  \ 则将元素添加到中间（或数组的任何地方）。\n\n让我们看看它是如何工作的。\n\n取决于你在括号中使用多少个参数，你可以执行以下操作：\n\na) 删除元素模式：\n\
  \n当你只使用两个参数时，你是在提供索引位置：\n\n第一个参数：操作开始的位置（包含在内），\n\n第二个参数：将移除多少个元素。\n\n两个参数意味着删除，因为没有要添加的元素。\n\
  \nb) 添加元素模式，\n\n如果你插入了两个以上的参数，第三个及后续的参数是要要插入的数据，在这种情况下 JavaScript 假设你想将元素插入数组中。\n\
  \n在仅添加模式下，第二个参数为 0，这意味着不会删除任何元素，以交换我们通过第三个及后续参数添加的元素。\n\nc) 替换元素模式。如果添加模式中的第二个参数是零以外的任何数字，这个数字将指示删除多少个元素以交换添加的元素。\n\
  \n例如 `splice(0,3)` 意味着删除 3 个元素：第一、第二和第三。数字 3 表示要移除的元素数量。数字 3 与数组上的第三个元素重合，但并不一定如此。如果我们使用\
  \ `splice(2,3)`，它将移除第三、第四和第五个元素，对应于从 0 开始计算的位置 2,3,4。\n\n第 3 个及后续参数代表要插入的元素。\n\n\
  例如，`splice(2,0,\"yellow\")` 意味着在位置二（第三个元素）插入黄色，并移动其他元素，因为零意味着不删除任何元素。\n\n在 `splice(2,1,\"\
  yellow\")` 中，它意味着在位置 2（第三个元素）添加黄色并移除那里的任何内容（由于第二个参数这是一个替换）。\n\n下面的图片将说明该概念：\n\n\
  ![](img/00021.jpeg)\n\n图 21\n\n让我们尝试几个样本来说明这一概念。\n\n**使用 splice( ) 删除元素：**\n\n1-\
  \ 声明一个数组 [原始文件](http://icontemp.com/joagi/scripts/225.txt)：icontemp.com/joagi/scripts/225.txt\
  \ `var x = [\"blue\",\"red\",\"green\",\"violet\",\"brown\"];`\n\n2- 从位置 0 删除 3\
  \ 个元素：`x.splice(0,3);`\n\n3- 调用数组：`x;` // 返回 [\"violet\", \"brown\"]。位置 0,1,2 被删除了。\n\
  \n**使用 splice( ) 添加元素：**\n\n4- 让我们从位置 0 开始向数组添加我们的元素：`x.splice(0,0,\"blue\",\"red\"\
  ,\"yellow\");`\n\n4- 调用数组：`x;` // 返回 [\"blue\", \"red\", \"yellow\"]. 我们从 0 开始添加了列出的元素并删除了零元素。\n\
  \n如果现在第二个数字是 3 而不是 0 会发生什么？`splice()` 将先删除三个元素，然后替换这三个元素。没有变化。\n\n记得关于 pop( ) 的脚注吗？\n\
  \n`abc.splice(-3,3);` 注意：如果你想尝试，将 `abc` 改为 `x`。\n\n-3 从右侧计算 3 个元素作为包含的位置。第二个数字意味着删除\
  \ 3 个元素而不进行替换。\n\n**将元素提取到另一个数组：**\n\n到为止我们一直在编辑同一个数组 `x`，但我们也可以将正在删除的元素提取到另一个数组中，就像拆分数组一样，有点像使用\
  \ `slicing()` 并从原数组中删除元素：\n\n5- 以原始数组 `x` 为例：`var x =[\"blue\",\"red\",\"green\"\
  ,\"violet\",\"brown\"];`\n\n6- 在删除它们之前通过将前三个元素复制到 `newArray` 来拆分数组：`var newArray\
  \ = x.slice(0,3);`\n\n7- 调用数组 `x`：`x;` // 返回 [\"violet\", \"brown\"]\n\n8- 调用数组\
  \ `newArray`：`newArray;` // 返回 [\"blue\", \"red\", \"green\"]。\n\n\n\n\n\n数组方法 `forEach()`\
  \ 随着 ECMAScript 5 引入，当时新增了九种新方法来帮助开发者创建搜索和操作数组内容的方法。这些方法执行了以前需要复杂迭代循环的操作。新增的九种方法是：`indexOf`、`lastIndexOf`、`every`、`some`、`forEach`、`map`、`filter`、`reduce`、`reduceRight`。这些方法都是我即将讨论的\
  \ `forEach()` 方法的变体。\n\n`forEach()` 对数组上的每个元素执行指定的操作。做什么由程序员编写一个函数，并作为 `forEach()`\
  \ 机制的参数传入。\n\n记住，函数的目的是存储某些在函数被调用时运行的代码。我们创建该函数，`forEach()` 将处理它。\n\n因此，`forEach()`\
  \ 接受一个函数作为其参数。函数本身的参数将以迭代的方式与数组的每个有效元素交互，就像循环执行一样。我所说的“有效元素”是指带有数据的元素（而不是空元素位置）。空或未定义的数组索引会被忽略。\n\
  \n1- 让我们循序渐进地实验这个方法。首先在控制台中引入一个新数组（我使用的是 Chrome 控制台）：\n\n```\nvar g = [\"red\",\
  \ \"blue\", \"white\"];\n```\n\n2- 使用仅带一个参数 `y` 的函数对数组 `g` 调用 `forEach()`。在这个函数中，我们存储了一个简单的\
  \ `console.log` 输出（见下图）：\n\n![](img/00022.jpeg)\n\n图 22 [原始文件](http://icontemp.com/joagi/scripts/20.txt).[\
  \ icontemp.com/joagi/scripts/20.txt ]\n\n这里使用的函数最多可以包含 3 个参数。第一个参数（如上例所示）指向数组数据。你还记得在**原始值和引用值**（More\
  \ Primitive and Reference Values）章节中，我们提到过如何通过函数参数指向引用类型值（如数组）吗？如果需要复习，请回顾该课程章节。\n\
  \n这个 `forEach` “宏”为我们节省了大量的代码，例如我们以前用这种编写脚本：\n\n```javascript\nfor (var i = 0; i\
  \ < array.length; i ++)\n```\n\n在上面提供的 `forEach()` 示例中，参数 `y` 将指向数组上每个索引的值，而 `forEach`\
  \ 方法将根据正文中编写的指令处理每个值。在这种情况下，下一条指令是在每次 `y` 迭代时 `console.log` 每个值，结果是：*red blue white*（分行显示）。\n\
  \n你可能会问“JavaScript 是如何做到这一切的？”，答案可能是“别问！先放放一边。学习如何使用工具，而不是学习工具是如何构思的”。了解工具是如何构思的会干扰你对技艺的掌握。把那个问题留到以后你有空的时候再考虑。\n\
  \n### 使用两个参数而不是一个：\n\n3- 让我们尝试用两个参数而不是一个来运行相同的脚本：\n\n![](img/00023.jpeg)\n\n图 23\
  \ [原始文件](http://icontemp.com/joagi/scripts/21.txt).[ icontemp.com/joagi/scripts/21.txt\
