  \ 4`。\n- 在第 7 行，我们尝试通过 *call* 绑定 `x` 并传入 `num` 作为 3，但 JavaScript 假设 3 是第一个参数（`this`），而第二个参数为“无”。第二个参数应该是一个数字。所以我们得到了\
