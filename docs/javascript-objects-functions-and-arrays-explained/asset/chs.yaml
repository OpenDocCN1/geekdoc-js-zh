  \n### 5.1.2 访问器方法\n\n学习下面第 6 行的`内部函数`，并阅读后面的注释：\n\n![](img/00075.jpeg)\n\n图 75（原始文件见下一页）\n\
  \n上面的脚本是有意义的。我们创建了一个任意名为 `getFruit` 的方法，它返回我们的属性 `Fruits`。然而，它存在几个问题：\n\na) 因为 `y`\
  \ 是一个构造函数，我们无法以其当前的形式调用它的方法，因为对象构造函数只是对象的**蓝图**。这让我想起了 `Date Object`。我们需要*实例化*一个对象才能使用它的方法。此外，虽然不是强制性的，但按照命名惯例，我应该将\
  \ `y` 大写，但我不想让这让我们偏离实际主题：*a* 和 *b*。\n\nb) 一旦我们*实例化*一个*新**对象*，我们需要确保方法 `getFruit`\
  \ 被应用于它（`this` 新对象），而不是任何其他对象。因此，我们需要在构造函数内部的方法中添加 `this` 前缀作为*占位符*。例如 `this.getfruit\
  \ =`。\n\n8- 给 `getFruit` 添加一个 `this`：\n\n![](img/00076.jpeg)\n\n图 76 [原始文件](http://icontemp.com/joagi/scripts/74.txt).[\
