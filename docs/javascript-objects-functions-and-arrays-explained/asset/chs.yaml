  \n# 2.4 新 JavaScript 数组归约与位置方法\n\n## 2.4.1 什么是归约（Reduction）\n\n在计算机科学中，归约（reduction）是一种将一个问题转换为另一个问题的算法，或者将表达式或方程转换为最简单的形式。\n\
  \nECMAScript 5 引入两种归约方法：`reduce()` 和 `reduceRight()`。它们区别在于操作的方向。一个从数组开头开始，另一个从数组结尾开始。\n\
  \n两种归约方法都接受一个匿名函数（我们可以在其中保存自己的自定义代码）以及一个可选的基值：\n\n![](img/00028.jpeg)\n\n图 28\n\n\
  **initValue 是 reduce/reduceRight 方法中参数的任意名称，它会改变结果：**\n\n如果存在 `initValue`，函数迭代将从\
  \ `initValue` 的值开始。\n\n在 JavaScript 归约方法中，当存在 `initValue` 时，匿名函数的第一个参数（我称之为 `previousValue`）从\
  \ `initValue` 的值开始。函数的第二个参数（我称之为 `currentValue`）则从第一个项的值开始。\n\n![](img/00029.jpeg)\n\
  \n图 29\n\n通常情况下 `initValue` 不存在，在这种情况下，第一个参数 `previousValue` 从第一个项的值开始，第二个参数 `currentValue`\
  \ 从第二个项的值开始。\n\n请参接接两个示例以获得进一步的解释。\n\n## 2.4.2 reduce( )\n\n`reduce()` 方法允许一个带有最多四个参数的回调函数：\n\
