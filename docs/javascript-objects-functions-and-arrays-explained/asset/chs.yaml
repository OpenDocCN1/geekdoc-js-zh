  \ `i` 一样），我们会得到一个错误：\n\n`y;` // 返回 y is not defined.\n\n函数实际上有效地隔离并销毁了临时变量。我们仍然需要担心\
  \ `x`，因为它指向函数，但 `x` 对我们来说更直观，我们可以将其赋值为 `null`。无论哪种，这里的主意是说明函数如何将变量从全局对象隔离开（并开始考虑可能的[内存泄漏](http://en.wikipedia.org/wiki/Memory_leak)）。\n\
  \n`window` 对象既是 ECMAScript 的 `Global Object`，也是浏览器的 `BOM` 中心对象。\n\n每个 `window` 代表浏览器本身的一个\
  \ `instance`。`window` 对象是核心 JavaScript 语言与浏览器之间的 `interface`。它代表了网页上每个变量和函数的全局作用域。\n\
  \n我们可以随心所欲地向 `window` 对象添加属性（尽管不是永久性的）。\n\n**尝试一下：**\n\n13- `window.color = \"green\"\
  ;`\n\n注意：这实际上是在声明一个名为 `color` 的变量。这与排除 `window` 单独声明变量是一样的，因为假设 `window` 是存在的。然而，由于我们正在理解概念，请写上\
  \ `window` 以强化背后的概念。\n\n14- `window.mood = \"happy\";`\n15- `window.gender = \"\
  female\";`\n16- `color;` // 返回 “*green*”。\n17- `mood;` // 返回 “*happy*”。\n18- `gender;`\
  \ // 返回 “*female*”。\n19- `this.color;` // 返回 green.（等等……）\n\n## 1.10.2 作用域示例\n\n\
  让我们确保我们理解了 `scope`（全局）和 `function scope`（局部）。\n\n1- 按照如下方式声明变量，然后声明一个函数：\n\n![](img/00010.jpeg)**\n\
  \n图 10 [原始文件](http://icontemp.com/joagi/scripts/16.txt)。 icontemp.com/joagi/scripts/16.txt\
  \ ]\n\n1- 调用函数 `x`：`x();`\n\n它应该返回：`my is Subaru` `\"the other is Ford\"`\n\n**为什么得到了这两个输出？**\n\
  \n这两个变量具有相同的名称，但它们位于不同的作用域。第一个在 `global` 作用域，另一个在 `window` 作用域。由于我们在函数内部声明了同名变量，JavaScript\
  \ 无法使用全局变量。\n\n在第 6 行，我们通过包含全局变量的完整路径来解决冲突：`window.car`。为了使用同名变量，我们需要 `window` 前缀。这种做法是为了演示目的，但在现实生活中确实会发生。这种语法为变量分配了正确的目标。\n\
  \n2- **尝试使用 \"this\"** 看看会发生什么。将第 6 行的 `window` 替换为 `this`：\n\n\n\n\n\n1- 声明变量：`var\
  \ x = \"ninja\";`\n\n2- 添加属性 color：`x.color = \"green\";` 控制台返回“green”（所以它一定接受了，对吧过）让我们测试一下看：\n\
  \n3- 输入 `x.color;` 返回“undefined”。**发生了什么？** 它没有保存它。**为了保存一个*属性*，我们应该将其作为引用值发送到堆（heap）中**。让我们\
  \ true 吧……\n\n4- 声明另一个变量，但这次通过在堆中创建表达式将其赋值给对象（括号会为你完成此操作）：\n\n`var y = { };`\n\n\
  5- 现在尝试像之前一样添加属性：`y.color = \"green\";`\n\n6- 调用属性：`y.color;` // 控制台返回“green”。好了，*我们入门成功了！*\n\
  \n7- 为了好玩，用 window 再次调用它：\n\n`window.y.color;` // 返回“green”。\n\n**你认为发生了什么？**\n\n\
  通过让变量指向一个*引用值*，我们可以向它添加属性。当我们删除、**取消引用**或重新分配变量时，对象将根据浏览器的实现自动放入*垃圾回收（garbage collection）*，一旦对象被删除，内存将被清除。\n\
  \n总之，我们在 window 对象下创建了一个对象。该对象继承了从 window 可的所有属性和方法，也称为全局对象（Global Object）。我们稍后会进一步剥开这个洋葱。\n\
  \n现在让我们考虑另一个重要的概念：\n\n我们的第一个变量 `x` 包含值“**ninja**”。让我们将“ninja”赋值给第二个变量：\n\n8- 声明新变量\
  \ `z` 并将其赋值给 `x`：`var z = x;`\n\n9- 测试 `z`：`z;` // 返回“ninja”\n\n10- 现在将 `x` 改为 **samurai**：`x\
  \ = \"samurai\";`\n\n11- 测试 `x`：`x;` // 返回“samurai”。\n\n12- 测试 `z`：`z;` // 返回“**ninja**”。\n\
  \n**你认为发生了什么？**\n\n如果在赋值 `z = x` 时 `x` 指向一个*对象*，那么我们就告诉 `z` *指向*同一个对象。然而，`x` 是一个位于*栈（stack）*中的**字符串**变量，因为它是一个**原始值**。当我们把其他变量赋值给现有原始值时，我们实际上是将数据复制到新的赋值中。我们将\
  \ `x` 复制到了 `z`。然后我们更改了 `x` 的值，这并没有影响 `z` 的值，对吧？\n\n这被称为**按值传递（passing data by value）**，是原始值发生的情况。\n\
  \n每当我们将值赋值给另一个变量时，它都会复制到变量本身，因为在栈中，变量及其栈数据是**同一个单元**。为了帮助记住“按值传递”，可以在复制（拷贝）东西时想成“添加值（adding\
  \ value）”（我知道这很老俗，但可能有帮助）。\n\n涉及到引用值（堆中的值）时，工作方式稍有不同。这就是为什么它们被称为*“引用”*，我们稍后会看到区别。这显然被称为**按引用传递（passing\
  \ data by reference）**（通过指向而不是复制）。\n\n让我们再做一些测试：\n\n你的控制台中应该仍然有你的**对象** `y`（如果没有，请按照上面的步骤\
  \ 4 和 5 重新创建一个）。\n\n13- 测试 `y` 以确保无：`y;` 它应该返回 *Object {color: \"green\"}*\n\n14-\
  \ 将新变量 `b` 赋值给 ***y***：`var b = y;`\n\n15- 测试 `b`：`b;` // 它应该返回 *Object {color:\
  \ \"green\"}*。\n\n现在 `y` 和 `b` 指向同一个对象*源***。\n\n16-为 `y` 添加一个新颜色：\n\n`y.color2 =\
  \ \"red\";`\n\n17- 测试 `y`：\n\n`y;` // 返回 *Object {color: \"green\", color2: \"red\"\
  }*\n\n18- 测试 `b`：`b;` // 返回 *Object {color: \"green\", color2: \"red\"}*\n\n如所示，当我们将第二个变量赋值给引用值时，引用值并被复制。\n\
  \n在这里，变量充当*指针*，而一个引用值可以有很多指针。如果其中一个指针编辑了对象中的数据，其他指针将反映来自同一对象的相同数据。这节省了内存，但我们也需要小心，因为如果我们想**取消引用**对象以清除内存空间，我们需要确保取消引用指向该对象的所有变量。\n\
  \n**如果我们将 y 重新赋值为一个不同的对象，b 会发生什么？**\n\n让我们试一下：\n\n19- 重新赋值 `y`：`y = {\"color\":\
  \ \"violet\"}`\n\n20- 测试它：`y;` // 返回 *Object {color: \"violet\"}*\n\n21- 测试 `b`：`b;`\
  \ // b 保持不变：*Object {color: \"green\", color2: \"red\"}*。\n\n22- 让我们练习**取消引用**对象，首先给\
  \ `b` 赋值另一个变量：\n\n`var c = b;`\n\n23- 测试 `c;` // 返回 *Object {color: \"green\", color2:\
  \ \"red\"}*\n\n24- 取消引用 `b`：`b = null;`\n\n25- 测试 `c`：`c;` // 返回 *Object {color:\
  \ \"green\", color2: \"red\"}*\n\n26- 取消引用 `c`：`c = null;`\n\n27- 测试 `c`：`c;` //\
  \ 返回 null\n\n对象终于被发送到了**垃圾回收（Garbage Collection）**，它将被处置，因为栈中没有引用指向它。它将在下一次内存扫描时被删除。\n\
  \n## 1.11.2 如何将数据从栈传递到堆\n\n从栈传递到堆的一种方法是作为函数*调用*中的*参数*。\n\n![](img/00012.jpeg)\n\n\
  图 12\n\n在 JavaScript 中，来自变量的*原始*数据可以作为拷贝*传递进*函数中，通过函数***参数（argument）***传递给函数***形参（parameter）***。\n\
  \n形参充当栈和堆之间的*接口*。换句话说，变量中的数据和传递到函数的数据变得相互独立（上面的 `x` 指向函数，但 `x(33)` 是复制到函数中的）。所以，尽管函数存在于堆中，但我们**不是**在进行指向或**按引用传递**，我们实际上是在克隆供函数处理的数据，这与*按值传递*相同（记得吗？*就像将数据复制到另一个变量中，或“添加”值*）。如果如\
  \ `x(33)` 这样的数据在第一次复制后发生变化，将不会影响已经传递的函数数据，它将创建一个新的函数调用（带有新数据的函数新实例）。\n\n**请注意：**\
  \ 我们说论的是从***栈***到***堆****传入*数据。这些数据是被复制的，因为没有物理连接。\n\n当涉及到从堆内部传递到函数的内部数据时（例如从另一个函数、对象或数组），它是*通过引用*完成的，而不是通过复制的。当我们将对象或数组作为参数传递给函数时，我们是在**按引用传递**。它们都在堆中，包括函数和（对象或数组）。按引用传递意味着函数内部处理的任何更改将反映在同一个对象上。\n\
