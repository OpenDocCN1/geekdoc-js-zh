  \ JavaScript 的秘诀。\n\n## 5.1.6 为原型创建新方法\n\n如果我们想为我们的 `LoanApp` 对象添加一个新方法怎么办？\n\n\
  我们可以进入对象内部，像我们第一次创建 `LoanApp` 时那样硬编码该方法。然而，很多时候这并不是一种方便的方法。此外，这不是一种内存高效的实现，因为正如你从之前的章节中记得的，每当我们实例化一个*新*对象时，构造函数都会复制所有数据，而对于方法来说，这完全没有必要。\n\
  \n相反，我们只需要将新实例对象指向原始方法，并在需要时使用它。\n\n那么，最佳实践是将方法作为独立的原型链接进行添加。然而，如果你倾向于将它们封装在对象内部而不是让它们分开，我们有方法可以实现这一点，一旦我们完成对正确做法的介绍，很快就会涵盖其中一种实现方式。\n\
  \n**问题：** 根据上面关于内存效率的描述，我们为什么把 `submit` 和 `getApprovalStatus` 方法包含在 `LoanApp` 对象内部而不是外部？这难道不是坏习惯吗？是的，看起来的确是。我们之所以这样做是因为我们正将这些方法作为**getters（访问器）**来访问私有数据。我们无法通过外部方法获取私有信息。我们总是尝试编写尽可能高效的代码。目前这是我们对\
  \ `LoanApp` 所能做的。\n\n但在大多数情况下，新添加的方法将是单独创建的。\n\n**让我们为了练习目的，为我们的 LoanApp 添加一个新方法吧。**\n\
  \n有一天，老板走进来问我们是否有方法从 `LoanApp` 中获取每个单独申请人的摘要。我们回答说还没有，但我们可以在 5 分钟内实现这样的方法。她批准了，我们回到起点开始。\n\
  \n你还记得早些章节中的语法吗？让我提醒你一下：我们在对象原型菜单中添加一个新方法名，换句话说，我们对其进行原型化处理。\n\n1- 创建一个名为 `summary`\
  \ 的原型方法，返回申请人的姓名及其申请的贷款金额，参见步骤 4 中的原始文件（**[raw file](http://icontemp.com/joagi/scripts/pre4.txt)**）。[\
  \ icontemp.com/joagi/scripts/pre4.txt ] `LoanApp.prototype.summary = function(){}`\n\
  \n2- 在函数体内编写以下内容：`console.log(this.personName + \" is applying for a loan of \"\
  \ + this.loanAmount);`\n\n3- 不要忘记关闭函数：`}`\n\n在展示给老板之前，让我们测试一下：\n\n4- 将 `LoanApp`\
  \ 粘贴到控制台：参见（[raw file](http://icontemp.com/joagi/scripts/pre4.txt)）。[ icontemp.com/joagi/scripts/pre4.txt\
  \ ]\n\n5- 之后粘贴 `summary` 方法。（[raw file](http://icontemp.com/joagi/scripts/pre5.txt)）。[\
  \ icontemp.com/joagi/scripts/pre5.txt ]\n\n6- 实例化一个新的申请人：\n\n```javascript\nvar\
  \ tony = new LoanApp(\"Tony\", 5000, 1000);\n```\n\n7- 测试新方法：\n\n```javascript\n\
  tony.summary(); // 返回 \"Tony is applying for a loan of 1000\"。\n```\n\n去展示给你的老板看吧！\n\
  \n我们之前在创建职位申请时已经涵盖过方法原型化。现在可能是复习该部分的好时机，因为现在理解可能会更有意义。\n\n链接是这里：*3.1.8 Functions\
  \ as Object Constructors*。\n\n## 5.1.7 继承自其他对象\n\n有时我们想要创建一个具有另一个对象中已存在的功能的对象。JavaScript\
  \ 允许我们从其他对象继承功能，以避免重复。\n\n实现这种继承有多种方法，每种方法都有其独特之处。我将涵盖我认为是最佳实践的方法。让我们通过创建一个新应用程序来讨论它们：\n\
  \n洛杉矶的分行经理给纽约的程序员打了电话，赞扬他在 `LoanApp` 上所做的工作。他们希望能够以他们自己的分行名称访问来自洛杉矶的申请，并且他们想确保程序与纽约的程序是独立的，以防他们决定为其添加更多功能。洛杉矶分行还需要一个额外的方法来打印分行位置，因为他们注意到现有程序没有向公众提供此类信息。\n\
  \n我们决定重用 `LoanApp` 对象以节省时间和资源，只需对新对象构造函数进行如下几处更改：\n\n*   新应用程序名称为 `LoanApp2`。\n\
  *   `bankBranch` 为 `Los Angeles`。\n*   额外的方法是 `getBankBranch`。\n\n我们将使用一种称为对象**伪装（masquerading）**的技术。\n\
  \n![](img/00080.jpeg)\n\n图 80（见下一张图的原始文件）。\n\n让我们开始吧！\n\n1- 新对象声明：\n\n```javascript\n\
  function LoanApp2(personName, income, loanAmount){\n```\n\n2- 通过临时变量 `x` 将 `LoanApp`\
  \ 的继承赋予 `LoanApp2`（我选择 `x` 是为了清楚这一点：名字并不重要，但在现实生活中这个变量应该有一个更有描述性的名称）：\n\n```javascript\n\
  this.x = LoanApp; // 这里 x 继承了 LoanApp 的所有内容。\n```\n\n3-接下来选择哪些属性需要继承 `LoanApp` 的方法，使用\
  \ `x` 作为中介：\n\n```javascript\nthis.x(personName, income, loanAmount);\n```\n\n继承已经建立，JavaScript\
  \ 已经记录，我们不再需要这个*temp*变量 `x` 了，因为我们希望一个对象之间实现“断开”。你还记得男孩女孩手中的风筝吗？还有闭包？现在 JavaScript\
  \ 知道 `loanApp2` 与 `loanApp` 的属性和方法有连接，我们可以安全地“返回”或删除 `loanApp`，并保留这些好东西供 `loanApp2`\
  \ 使用。\n\n这里我们引入了一个新关键字：`delete`。`delete` 操作符从对象中删除属性。语法是 `delete object.property`，`delete`\
  \ 不影响普通变量或函数，只影响对象。\n\n4- 删除 `x`：\n\n```javascript\ndelete this.x;\n```\n\n现在我们可以添加新的功能。在删除\
  \ `x` *之后* 做的它的目的是防止在我们最初引入继承时从 `loanApp1` 到 `loanApp2` 的任何覆盖：\n\n5- 添加新的分行名称：\n\
  \n```javascript\nvar bankBranch = \"Los Angeles\";\n```\n\n6- 添加一个新方法由客户端返回分行名称：\n\
  \n```javascript\nthis.getBankBranch = function() {\n  return bankBranch;\n};\n```\n\
  \n7- 关闭对象 `LoanApp2`：\n\n```javascript\n} // （参见图片和原始文件链接）。\n```\n\n![](img/0081.jpeg)\n\
  \n图 81 [raw file](http://icontemp.com/joagi/scripts/pre6.txt)。[ icontemp.com/joagi/scripts/pre6.txt\
  \ ]\n\n让我们测试我们的对象继承：\n\n8- 将原始的 `LoanApp` 粘贴到控制台（[raw file](http://icontemp.com/joagi/scripts/pre4.txt)）。[\
  \ icontemp.com/joagi/scripts/pre4.txt ]\n\n9- 粘贴 `summary` 原型方法（供以后使用）。[raw file](http://icontemp.com/joagi/scripts/pre5.txt)）。[\
  \ icontemp.com/joagi/scripts/pre5.txt ]\n\n10- 将新对象 `LoanApp2` 粘贴到控制台（[raw file](http://icontemp.com/joagi/scripts/pre6.txt)）。[\
  \ icontemp.com/joagi/scripts/pre6.txt ]\n\n\n\n\n\n# 11- 为洛杉矶的 `LoanApp2` 创建用户（旧的\
  \ Tony 也可以）：\n\n```javascript\nvar tony = new LoanApp2(\"Tony\", 5000, 1000);\n\
  ```\n\n# 12- 测试新方法 `getBankBranch`：\n\n```javascript\ntony.getBankBranch(); // 返回\
  \ *Los Angeles*.\n```\n\n# 13- 测试继承自 New York 对象的方法：\n\n```javascript\ntony.getApprovalStatus();\
  \ // 返回 “*Approved*”。```\n\n现在让我们来使用另一个新操作符：`instanceof`。这个操作符对于验证对象的来源非常有用：\n\n\
  ```javascript\ntony instanceof LoanApp2; //? 返回 *true*.\ntony instanceof LoanApp;\
  \ // 返回 *false*. (如果 tony 来自洛杉矶)\nLoanApp2 instanceof LoanApp; // 返回 *false*. (LoanApp2\
  \ 并不是 LoanApp 的实例，尽管它继承了后者的功能并添加了一些自己的功能。LoanApp 是一个构造函数。)\n```\n\n# 14- 如果你粘贴了第\
  \ 9 步的外部方法，你还拥有了额外的原型方法 `summary`。让我们测试一下：\n\n```javascript\ntony.summary(); //\
  \ 返回 \"TypeError: Object #<LoanApp2> has no method 'summary'\"\n```\n\n哎呀！这就是使用伪装（masquerading）继承其他对象的“缺点”，因为新的构造函数指向它自己的原型列表，而不是其祖先构造函数的列表。如果你没有外部原型方法，这并不是问题。然而，如果你有或计划拥有它们，你就需要添加另一行脚本以便从旧构造函数访问基于原型的方法。需要实现一个适当接口。我们需要将\
  \ `LoanApp` 的原型列表链接到 `LoanApp2`。这样你的对象继承就能完美工作了：\n\n就像我们创建外部原型方法一样，创建一个外部原型链，将 `LoanApp`\
  \ 的所有原型方法链接到 `LoanApp2`。遵循第 15 步：\n\n# 15- 将以下脚本粘贴到控制台。它将立即供新申请人使用。但我们需要重置所有现有的申请人：\n\
  \n```javascript\nLoanApp2.prototype = new LoanApp();\n```\n\n# 16- 现在我们可以实例化一个申请人了：\n\
  \n```javascript\nvar tony = new LoanApp2(\"Tony\", 5000, 1000);\n```\n\n# 17- 测试\
  \ `summary` 是否工作：\n\n```javascript\ntony.summary();\n// 返回 \"*Tony is applying for\
  \ a loan of 1000*\".\n```\n\n“***我们发射成功了！！”。 **问题：** 如果我们现在将 `LoanApp` 为 null 会发生什么？还记得那个男孩和女孩拿着风筝吗？如果我们将旧的构造函数设置为\
  \ null，新的构造函数仍然持有继承的功能。但由于 `LoanApp` 不再可用，变量 `x` 将无法运行，因此我们无法实例化新的申请人！\n\n换句话说，为了让\
  \ `loanApp2` 发挥其 100% 的功能，`loanApp` 和 `loanApp2` 需要共存。这就像是我们需要互联网服务来访问 Amazon 并从\
  \ Tony de Araujo 那里下载[新电子书](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/)（*抱歉，我忍不住！*）。**总结：**\
  \ 将现有对象伪装成新对象是委托功能以避免代码重复极极方法。如果要继承的对象中存在在原型机制下创建的方法，则需要确保原型链链接到新的对象构造函数。洛杉矶的分行经理现在是一个非常快乐的人，我们也是如此！\n\
  \n我们查看了对象创建，准确地说说是无序列表。我们看到了封装如何让代码更具功能性，并思考了继承如何通过链接对象链来节省内存和开发时间。这些是 JavaScript\
  \ 对象范式中的两个重要概念，并且被频繁使用。\n\n在我们离开这个主题之前，还有一个关于封装的非常重要的话题：\n\n我们如何在构造函数内部包含对象方法，而不产生可能导致内存过载的重复？目前为止，我们是将原型方法作为外部脚本包含的，这是推荐的做法。然而，可以将它们包含在构造函数内部并同时避免重复。让我们在下一个主题中研究实现这种尝试的方法。\n\
  \n## 5.1.8 如何在构造函数内部包含原型方法\n\n有时，出于某种原因，我们只是想让属性和方法放在一起，即使是为了看起来像某种其他语言！并不是说我们目前的方法有什么错，而且它是推荐的方法；但我在这里包含了另一种选择，以防你感兴趣想了解它。即使你打算使用它，这个解释也会为你理解\
  \ JavaScript 如何“思考”开启新的大门。\n\n让我们创建一个简单的对象，说明如何在不导致内存过载的情况下在构造函数内部包含方法（另一种方案是像我们之前做的那样在外部原型化）。这个对象将被称为\
  \ `Player`，它包含两个属性：name 和 instrument。然后我们创建一个方法来显示关于玩家的摘要。足够简单对吧？\n\n### 1- 创建 `Player`\
  \ 并将其粘贴到控制台：\n\n![](img/00082.jpeg)\n图 82 [原始文件](http://icontemp.com/joagi/scripts/79.txt)。\
  \ [ icontemp.com/joagi/scripts/79.txt ]\n\n### 2- 实例化一个玩家：\n\n```javascript\nvar\
  \ jc = new Player(\"Coltrane\", \"saxophone\");\n```\n\n### 3- 调用 `jc`：\n\n```javascript\n\
  jc; // 返回 Player {name: \"Coltrane\", instrument: \"saxophone\"}\n```\n\n### 4-\
  \ 测试方法 `summary`：\n\n```javascript\njc.summary(); // 返回 \"*Coltrane plays the saxophone*\"\
  \n\n```\n\n对象运行正常。那么我们为什么要更改它呢？如果这个对象是独立存在的，我会让保持原样。然而，这不仅仅是一个对象；这是一个构造函数，这意味着我们将从它实例化许多对象。由于我们要实例化其他对象，我担心内存管理。为了不在每次创建新实例时都重复对象，我们需要将方法放在外部，但封装在一个检查它们是否已经存在的脚本中。\n\
  \n### 前言（Preamble）\n\nJavaScript 中的 `typeof` 运算符允许你探测其操作数的数据类型，甚至可以查看数据是否为 `undefined`。我们需要获取的就是后者。按照惯例，在变量名之前加下划线意味着该变量或关键字是供内部使用的。这当然是为了向可能路来并偷看我们脚本的另一个开发者说明（就像\
  \ 6 个月后的我们自己，因为我们不会忘记之前做了什么，甚至明天也可能忘记！）。我们将对对象进行一次“魔法处理”。我们要求程序仅在某个变量不存在时继续执行。我们通过隐式地询问对象“x\
  \ 变量”是否为 `undefined` 来做到。但当然它是 `undefined`，因为这是我们第一次提到该变量。然后我们编写方法，最后将变量设置为 `true`，使其变为定义。通过变为定义，下一次在同一个执行环境中实例化对象将会有不同的结果，因为涉及的变量将是\
  \ `true`，因此 `undefined` 将是 `false`，这样 JavaScript 将跳过方法的创建，从而不复制方法。\n\n这听起来很长！让我们看看它在实践中是如何运作的：\n\
  \n### 5- 在方法（方法）之前向对象中添加以下 if 语句。我们正在询问名为 `_xyz` 的变量是否存在：\n\n```javascript\nif (typeof\
  \ Player._xyz === \"undefined\"){\n```\n\n现在我们包含我们的方法，然后将 `_xyz` 设置为 `true` 并关闭\
  \ `if` 语句（我会用插图再次解释一遍）。\n\n\n\n\n然而，我们不能直接写 `this.summary = function` 等。这样做行不通的。我们需要将方法发送到`prototype\
  \ chain`（原型链）中，以便它成为所有实例化对象的可用菜单的一部分，而不仅仅是原始对象。我们以前在构造函数之外做过这样做，也可以在构造函数内部完成。\n\n\
  请查看下一图获取详情以及*原始文件*：\n\n![](img/00083.jpeg)\n\n图 83 [原始文件](http://icontemp.com/joagi/scripts/80b.txt)。\
  \ [ icontemp.com/joagi/scripts/80b.txt ]\n\n在第 5 行中，我们包含了一个 `_xyz`（任意唯一命名的变量），它初始状态为\
  \ `undefined`，这允许了方法的实现。然后在第 10 行，我们设置了 `_xyz = true`，这将防止下一个对象实例重新复制该方法（方法）。当然，属性本身总是不同的，所以我们不需要担心这些问题。\n\
  \n### 1. 再次测试对象实例以确保它正在正常工作：\n\n```\nvar jc = new Player(\"Coltrane\", \"saxophone\"\
  );\n```\n\n`jc;` // 返回 Player {name: \"Coltrane\", instrument: \"saxophone\", summary:\
  \ function}。\n\n我们无法真正看出这种实现与原始实现之间的任何区别，但如果你打算将方法与构造函数封装在一起，这是一个更好的方法，因为可以防止方法过度消耗内存。到最后，如你所知，最好的技术是在构造函数*之外*编写你的原型方法。\n\
  \n**注意：** 此时此刻，鉴于我们现在所掌握的知识，并且如果你需要更多练习，可以回到 5.1.4 练习与复习：创建一个贷款申请对象并重做一遍，使每个方法在每个执行上下文中只声明一次。\n\
  \n# 结论\n\n我们可以一直写下去，因为 JavaScript 就像大西洋一样广阔，而我们正处于新泽西湖岸（我的家乡），但我相信我们已经走了很远，我们的旅程正通往启蒙之路……嗯，如果你像我一样，你就知道这种涅槃是在不断前进的，它本质上是不可触及的。我们意识到的越多，就越意识到自己还有很多不知道。\n\
  \n现在可能是复习书中涵盖某些概念的好时机了。不要分心去网上搜索，因为你会迷失并感到困惑。互联网上的大部分内容都是复制的复制的再复制，正如你所知，垃圾进，垃圾出。\n\
  \n不要误会我的意思，网上有很多很好的东西，我也从中学习到了很多，并对此表示感谢。但存在着巨大的危险，我浪费了太多时间试图理解那些本易理解的东西，因为复制并不等于教学。教学是解释，并为读者留出思考并得出自己结论的空间。有时我们必须讲述故事，让读者自己拼凑拼图碎片。讲故事是一种传递信息的方式，而不需要强制任何人记忆他们不理解的东西。我是比喻的忠实粉丝，它们能指数级地扩展我们的视野。\n\
  \n你已经走了很远，我为你感到骄傲，因为你忍受了我的文字并来到了书的末尾。结束仅仅是开始，不是吗？\n\n作为心理回顾，以下是你涵盖的内容：\n\n*   内存概念。栈（Stack）与堆（Heap）。\n\
  *   引用类型的价值。\n*   JavaScript 中的一切都源于对象。\n*   你已经和 JavaScript 控制台成了好朋友。\n*   你和函数玩在一起了，它们也成了你的朋友。\n\
  *   不可触及的 `Object`。指针、原始类型、对象包装（object wrapping）。\n*   执行上下文、作用域、私有变量、`this`、函数在隐私化中的作用。\n\
  *   原生对象、宿主对象、用户对象。\n*   匿名函数、闭包、`call`、`apply`。\n*   字符串对象、数组（Arrays）、新的交互方法。\n\
  *   参数（Arguments）、嵌套函数、词法作用域（Lexical scope）。\n*   作为对象构造函数的函数。\n*   `Math`, `Date`\
  \ 构建。库。\n*   无序列表、继承、封装。\n\n我们本可以继续下去，但如果一本 400 页的书没人读，那有什么用呢？\n\n那么最好的办法停下来思考一下涵盖的内容，因为如果你已经了这么多，那么你就已经掌握了很多，其他事情将更容易掌握。\n\
  \n有了这些知识，你可以进入更专业的书籍而不会那么容易迷失，因为你已经获得了一些强大的概念。\n\n当你需要理清某个一直困扰你且你又看不懂原因的方法时，这本书也可以作为参考。\n\
  \n我计划通过阅读、编辑、增加内容不断改进这本书，并始终思考你，以及你希望在这些文字中发现什么。\n\n写这本书真的是一种荣幸，也是一次非常兴奋的经历。\n\n\
  非常感谢！\n\nTony de Araujo\n\n*最后编辑于 2014 年 5 月 29 日*\n\n## 还有一件事……\n\n感谢阅读并投入时间完成练习！如果你喜欢本电子书或觉得它在任何方面都有用，如果你能在\
