  \ Miss\"); // 返回\n```\n\n“亲爱的小姐，感谢您的购买！”\n\n## 3.2 使用 `call( )` 和 `apply( )` 方法更多练习\n\
  \n为了巩固理解，让我们看看更多使用 `call( )` 方法处理 `this` 占位符的例子。\n\n1- 让我们通过 `call( )` 方法来对函数进行绑定\
  \ `this`：\n\n(images/0066.jpeg)\n\n图 66\n\n```javascript\nthanks.call(john, \"Dear\
  \ Mr.\"); // 返回\n```\n\n“亲爱的先生，感谢您的购买！”\n\n2- 再次使用 `call( )` 传入一个 `this` 值：\n\n\
  ```javascript\nshow.call(\"Tony\", 34568); // 返回\n```\n\n“Tony 有 34568 号。”\n\n3-\
  \ 让我们尝试另一个类似的 `call( )` 参数：\n\n(images/0067.jpeg)\n\n图 67\n\n```javascript\nthanks.call(mary,\
  \ \"Dear Miss\"); // 返回\n```\n\n“亲爱的小姐，感谢您的购买！”\n\n4- 再次调用函数，但这次添加一个过期日期：\n\n```javascript\n\
  showLicense.call(\"Tony\", 34568, \"January 5, 2016\"); // 返回\n```\n\n“Tony 有 34568\
  \ 号，于 2016 年 1 月 5 日过期。”\n\n`call( )` 方法会将第一个参数应用到 `this` 占位符（无论它在何处）。所有参数的类型都可以包括对象、字符串甚至是**函数**。\n\
  \n在继续之前，让我们从不同的窗口来可视化 **call 函数**，以便更好地理解该主题。\n\n考虑以下测试脚本：\n\n(images/0068.jpeg)\n\
