  \n我们在第 1 步、实验 3 中的函数 `addMe100` 是一个 `anonymous` 函数。这意味着该函数被赋值给一个 `variable declaration`，并且它是\
  \ `declared` 变量的一个 `expression`（程序的一部分）。\n\n让我向你解释一下……\n\n在 JavaScript 中，我们可以有如下所示\
  \ `variable declarations`：\n\n```\nvar x;\n```\n\n我们也可以有 `function declarations`：\n\
  \n```javascript\nfunction y( ){ };\n```\n\n声明可以拥有 `expressions`，例如：\n\n![](img/00005.jpeg)\n\
  \n图 5\n\n此外，`variables` 可以拥有 `functions as expressions`：\n\n![](img/00006.jpeg)\n\
  \n图 6\n\n当我们声明一个变量或函数时，它们通常会被解释器 `hoisted`（提升）到 `scope` 的顶部，解释器会将所有 `variable declarations`\
  \ 列在最顶部。这就像是可用内容的索引。**只有声明会被提升**，表达式（expression）不会。这对于程序本身可能不会产生区别，或不会产生影响，除非在 `debugging`\
  \ 代码时。当我们调试时，能够从列表中在视觉上区分变量和函数是非常很棒的。这简化了我们对菜单上有什么内容的理解，对吧？\n\n**问题在于：**\n\n在我们上面的示例中，以下内容会在形式上出现在作用域的顶部：\n\
  \n`x`、`y()`、`z`\n\n注意 `y` 被显示为一个函数，但 `z` 看起来像某种变量。这是因为**只有声明名会被提升**，而表达式不会。这只意味着调试时需要多做一些工作。\n\
  \n`y` 和 `z` 之间还有另一个区别：我们实际上可以在声明函数脚本之前调用 `y`，因为 JavaScript 已经识别 `y` 为一个函数并会寻找它。然而，在\
  \ `z` 中，如果我们在函数赋值写入之前调用 `z` 中的函数，可能会产生错误。\n\n在尝试调用所有函数之前先所有的它们被认为是一种最佳实践。\n\n除此之外，**使用\
  \ [anonymous](http://en.wikipedia.org/wiki/Function_literal) 函数是完全可以的，而且是一种非常强大的技术**，如果实现得当（jQuery\
  \ 大量使用了匿名函数）。\n\n## 1.7 第一次复\n\n*   JavaScript 是一种 `prototype-based` 语言。\n*   就像类一样，原型（prototyping）避免了代码的重复，从而节省内存并简化了脚本。\n\
  *   **Memory**（内存）被划分为 `Stack`（栈）和 `Heap`（堆）。栈充当原始类型和其他临时数据的短数据记录板。更长、更详细的数据（如任何类型的对象）被写入\
  \ `Heap`。\n*   我们通过创建被称为变量的 `pointers` 来访问对象。一旦对指针进行解引用，对象就会通过 `Garbage Collection`（垃圾回收）方法进入删除计划。垃圾回收方法由浏览器本身决定，并可能随浏览器版本而异。\n\
  *   `Primitive types`（原始类型）存在于 `Stack` 中，`Reference types`（引用类型）存在于 `Heap` 中。\n\
  *   要 `dereference` 一个对象，我们将指针（变量）声明为 `null`。\n*   我们可以通过实例化对象 `Object`（**全局对象**）来创建一个对象。\n\
  *   一旦我们声明一个对象，它就会从我们“克隆”它的原型中继承 `properties` 和 `methods`，以及从该原型在链中更上层的任何父原型继承。\n\
  *   当我们声明一个包含字符串 `key-value pairs` 的变量时，数据以对象的形式保存在 `Heap` 中，变量名以符号的形式保存在栈中。我们随后可以使用\
  \ `Dot syntax` 甚至 `Bracket syntax` 来调用每个值。熟悉这两种方法。\n*   由于一切都是对象，因此函数和数组本身也是对象，并且它们都继承自对象\
  \ `Object`。\n*   当我们声明变量或函数时，它们的名称会被 `hoisted` 到 `Scope` 的顶部，这样 JavaScript 就知道它们的存在。它们的表达式不会被提升，它们将在脚本运行到它们时在运行时求值，但\
  \ `pointer` 在最顶部被认可。\n*   **Anonymous function**（匿名函数）是一个 `assigned` 给变量的函数。它是变量的一个表达式。我们用分号结束变量赋值。\n\
  *   **Named function**（命名函数）是一个 `declared` 函数。它作为函数被列在作用域的顶部，而不是简单的命名变量。\n*   当函数在自身内部调用自己时，被称为\
  \ `[recursion](http://en.wikipedia.org/wiki/Recursion)`。\n\n## 1.8 不可触摸的对象\n\n###\
  \ 还记得对象在哪里吗？\n\n对象位于 `heap` 中。它们是引用类型。\n\n### 我们如何访问对象？\n\n我们通过给它分配一个标签来访问对象。这个标签被称为变量。变量指向对象。\n\
  \n### 当我们移除变量时，对象会发生什么？\n\n对象会被自动放入垃圾回收进行删除。\n\n### 我们可以直接触摸并修改对象本身吗？\n\n*大不！*我们需要使用指针（变量）来处理对象。通过指针以及相关的其他技术，我们能够通过接口机制操作或修改对象，这取决于对象可属性和方法。\n\
  \n到目前，我们已经知道新对象如何从大对象（JavaScript 对象模板）继承某些方法和属性，但我们当然可以添加新的或覆盖现有的。我们将在实验课程中练习不同的技术。\n\
  \n\n\n但等一下！如果没有指向对象的变量，那么如果该对象是从零创建的或从另一个对象实例化的，它就不存在了。那么像 `native` 对象、`built in`\
  \ 对象或`the Global object`（全局对象）本身这样的持久对象又是呢？\n\n这些对象始终存在。它们处于待命状态，随时准备被另一个变量调用。**持久化库永远不会消失**。\n\
  \n**这是一个重要的概念：** JavaScript **不仅仅是** **ECMAScript**。JavaScript 是 ECMAScript 与其运行环境的结合体，例如浏览器（我指的是\
  \ `DOM` 和 `BOM`）。ECMAScript 由 JavaScript 引擎实现。目前有多个引擎正在被使用。关于引擎的简短讨论可以参考 [维基](http://en.wikipedia.org/wiki/JavaScript_engine)。\n\
  \n## 1.8.2 原生对象 (Native objects)\n\n原生对象最初由 ECMAScript 标准实现，无论 JavaScript 在何处使用，它们始终存在。它们有助于指定和定义其他对象。原生对象也被称为\
  \ `Standard Global Objects`（标准全局对象）。\n\n一些标准内置对象包括：\n\n`Array`、`Boolean`、`Date`、`Function`、`Math`、`Number`、`Object`、`RegEx`、`String`。\n\
  \n标准全局对象的列表可以在 [Mozilla Developer Network](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects)\
  \ 查看。\n\n不要将 `Global Objects`（全局对象）术语与 `The Global` Object（所有对象的母体，即 `Object` 对象）混淆。这个特定的对象我们在之前的\
  \ 1.3 变量与引用类型中提到过的原型。实际上，我们甚至**无法**直接引用它，因为它的名称随着使用 ECMAScript 的每个环境而变化。例如，在浏览器中，它假设名为\
  \ `Window`。`Window` 是第一个对象（脚本的根），任何全局声明（例如：`var x;`）的作用域都在 `Window level`（Window\
  \ 层）或 `Global Object level 层（全局对象层）。我们将在下一次实验中尝试这个概念。\n\n某些原生对象（如 `String` 和 `Math`）允许在不实例化新对象的情况下访问其属性和方法。其他原生对象（如\
  \ `Date`）则要求你创建一个新实例以便使用它们的属性和方法。\n\n## 1.8.3 托管对象 (Hosted Objects)\n\n其他对象由**宿主环境**提供，该环境与\
  \ ECMAScript 接口以完成整个 JavaScript 功能。在浏览器中，其他对象来自 [DOM](http://en.wikipedia.org/wiki/Document_Object_Model)（文档环境）和\
  \ BOM（浏览器环境）。\n\n\n\n\n-   与某些其他流行语言不同，JavaScript 代码块内部没有作用域保护，除非该代码块是一个函数。这将在 EcmaScript\
  \ 6 引入 `let` 后发生变化。在 JavaScript 中，函数会保护其变量，但只有当这些变量在声明时使用 `var` 前缀进行定义时才会生效。\n-\
  \   虽然在全局作用域中可以省略 `var` 关键字，因为该变量在作用域链中一直可用，但在声明变量时始终写下它是一个良好的习惯，以防止 JavaScript\
  \ 解释器产生混淆和误读。`var 将变量绑定到其直接所属的作用域中`。在最新的 ECMAScript 5 中，省略 `var` 实际上会抛出错误。\n\n##\
  \ 1.10 Window 对象 – 简介\n\n如前所述，在浏览器环境中使用 JavaScript 时，全局对象（Global Object）会变成 `Window`\
  \ 对象。\n\n让我们通过一个小测试来来说明这个概念：\n\n打开你的 JS 控制台并输入以下代码：\n\n1. `var myText = \"hello\
  \ World!\";`\n2. `myText;` // 返回 “hello World!”\n3. `window.myText;` // 返回 “hello\
  \ World!”\n4. `console.log(myText);` // 返回 hello World!\n5. `window.console.log(myText);`\
  \ // 返回 hello World!\n6. `this.myText;` // 返回 “hello World!” (`this` 替换（指向）了变量`scoped\
  \ at` 的对象。在这种情况下它替换了 `window`）。稍后会详细介绍。\n7. `this.console.log(myText);` // 返回 hello\
  \ World!\n\n### 函数呢？\n\n8. 在你的文本编辑器中编写以下代码，然后粘贴到控制台（提供原始文件）：\n\n![](img/00009.jpeg)\n\
