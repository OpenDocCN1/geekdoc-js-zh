- "# JavaScript 对象、函数与数组详解\n\n\n\n![](img/00084.jpeg)\n\n\n\n最后更新：2014 年 6 月\n小更新：2015\
  \ 年 1 月\n\n最后更新：2014 年 6 月\n\n为您的电脑下载亚马逊免费阅读器应用：[Kindle 阅读器应用](http://www.amazon.com/gp/feature.html?ie=UTF8&docId=1000493771)。\
  \ \n在 [亚马逊](http://www.amazon.com/Tony-de-Araujo/e/B00D7V08WY/) 上查看作者个人简介。\n\n“卓越不是一种技能，而是一种态度。”\n\
  -- 索伦·克尔凯郭尔 (Soren Kierkegaard)\n\n向所有我学习过的老师、作者和同学们表示诚挚的感谢。\n向我世界各地的家人和朋友表示衷心的感谢！\n\
  \n\n# 前言\n\n即使关于 JavaScript 对象的文献已经丰富且读者可以轻松获得，这本书仍然填补了空白。`JavaScript Objects Functions\
  \ and Arrays Explained` 挑战了教学语法的书籍与涵盖语言特定实现的书籍之间的真空空白。这种全面的方法重新审视了 JavaScript 对象的基础，而没有要求任何人记忆在\
  \ JavaScript 实现真实世界中很少使用的结构。它从最简单的形式到更复杂的范式对对象进行剖。它使用简单的插图，让读者专注于主题本身。尽管大多数书籍销售发生在美国，但这本书也使用国际英语编写，任何地道的表达都带有指向合适解释的链接。\n\
  \n`JavaScript Objects Functions and Arrays Explained` 关乎概念，而不是关于奇特脚本的实现，那些脚本可能会让学生在有机会理解主题背后的理念之前就失去兴趣。因为\
  \ JavaScript 是一种非常复杂的语言，作者选择了简化而非削减某些对许多读者来说可能是新的领域。一个例子是 `closures`（闭包）。作者以一种极简而有效的方式处理闭包，通过插图和简化的脚本，使概念不被代码本身的力量所淹没。\n\
  \n作者的意图是以他初开始学习这种语言时希望找到的方式来接触 JavaScript。这本书不是为非常初学者准备的，因为它没有涵盖基础语法规则。然而，`如果你以前在其他地方接触过基础知识`，那么你在理解书面材料将不会有任何问题。另一方面，如果你来自不同的语言或需要复习，`对呈现的脚本总会有逐行的解释，`。\n\
  \n对于初级初学者或如果你需要复习，在尝试阅读这本书之前，请参考以下电子书：\n\n[JavaScript in Plain Language – A Self-Study\
  \ Method, JSON and AngularJS Prep](http://www.amazon.com/JavaScript-Plain-Language-Self-Study-AngularJS-ebook/dp/B00NQERIEI)。\n\
  \n每个主题都刻意保持简短；然而，它包含了入门级书籍甚至在许多高级著作中通常被遗漏的信息。作者假设任何进入 JavaScript 领域的人只要有机会，就具有学习的能力。\n\
  \n这本书不仅仅是为`新`开发者编写的。它也是为那些已经参与 JavaScript 但缺乏时间寻找关于 JavaScript 为什么这样运行的详细解释的人准备的。这本书是作者数百小时研究和实验室测试的成果，旨在给每位读者提供`一些`值得借鉴的内容。\n\
  \n`JavaScript Objects Functions and Arrays Explained` 将为你提供进入更复杂书籍所需的基础：它将开启许多理解之门，而不会冒犯任何人的智。\n\
  \n**欢迎阅读《JavaScript Objects Functions and Arrays Explained》第二版。**\n\n## 作者寄语\n\n\
  亲爱的读者：\n\n感谢选择阅读 `JavaScript Objects Functions and Arrays Explained`。在有这么多优秀书籍的情况下，感到被欢迎进入你的内心世界是一份真正的荣誉，也是一种谦卑的体验，我将在写作中努力，让你的阅读物有所值。\n\
  \n这本书采用的是实践型（hands-on）方法。理论与实验将相结合，以对概念产生充分的理解。你可能决定快速阅读材料，或仅将其作为参考。然而，这本书也可以被`执行`。我建议先采取最后一种方法，之后再随机阅读。\n\
  \n除了单行脚本外，所有其他示例代码都将有一个指向`原始文件`的链接，让你选择复制粘贴到控制台，或从零开始编写。\n\n这本书解释了`新可用的`JavaScript\
  \ 原生对象，以及如何创建自己的对象。我花费了许多时间对每个主题进行逐段冥想，以寻找处理每个主题的最佳方式，以便更有效地传递这些信息。尽管我喜欢写作，但我教学的热爱更深。\n\
  \n原生对象是 JavaScript 中最常用的对象，因为它们更快且被现代浏览器良好认可。然而，几位作者选择从一开始就开始教授对象的`构造`，用学生在现实生活中可能永远不会看到的术语和概念困扰读者。我猜这种方法模仿了其他语言的教学方式。但\
  \ JavaScript 不是任何其他语言。JavaScript 是 `ECMAScript` 加上`主机环境`的结合。它的变异特征使其每次行为都不同，取决于它在何时以及如何被使用。\n\
  \n在书中，概念将以`层级`方式出现，不需要记忆。当我开始为这本书进行研究时，我被 JavaScript 对象的复杂性所震撼。这种复杂性意味着 JavaScript\
  \ 不像任何其他语言；它独立存在于自己的世界中。传说中，JavaScript 的发明者 [Brendan Eich](http://en.wikipedia.org/wiki/Brendan_Eich)\
  \ 想为 Netscape 编写一种类似 Scheme（Lisp 方言）的语言，但现实的检查介入了，迫他与 C/Java 语法妥协，这对于已经在领域的许多程序员来说是熟悉的。在\
  \ `ECMAScript 5`官方出版物中可以读到：“ECMAScript 的某些功能与其他编程语言使用的功能相似；特别是 Java™、Self 和 Scheme*”\n\
  \n今天，许多开发者讨厌这种语言是因为它不是什么；但一旦他们了解它，就会因为它本身而喜爱。我确实热爱这种语言，因为它几乎每天都带给我积极的惊喜！\n\n感谢这次机会，\n\
  \n*Tony de Araujo*\n\n技术作家 – 新泽西州，2013\n\n## 关于第二版\n\n本电子书的第二版于`2014 年 6 月初`出版。实际上，本电子书一直在定期更新，几乎每月一次。之所以出版第二版是因为索引被分为五个部分，而不是之前的两个。每个主题的标题和副标题基本保持，但这种划分使得更容易确定第二次需要复习哪些主题。\n\
  \n一些插图得到了改进，并纠正了一些拼写错误。\n\n检查了链接的有效性。此外，为了方便电子书可能的打印，明确编写了练习题 URL。\n\n除此之外，作者确认材料是实时的且符合他的书籍目标。\n\
