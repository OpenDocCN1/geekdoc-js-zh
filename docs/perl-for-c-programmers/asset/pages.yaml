  md: "# Subroutines 133\n\nNow see how this would affect the way you write the function:\n\
    \n```\nsub array_swap(\\@\\@ {\n    my $array1 = shift; # Reference to @first\n\
    \    my $array2 = shift; # Reference to @second\n```\n\nSimilarly, the \\% flag\
    \ indicates a hash parameter that's turned into a hash reference when the subroutine\
    \ is called.\nFinally, there's the &, which indicates a function reference.\n\n\
    # Array and Hash Parameters\n\nThe flag @ in a parameter list tells Perl that\
    \ an array is to be passed and to not automatically convert it to a reference.\
    \ For example:\n\n```\nsub sum_array(@)\n```\n\nIn this case, Perl assigns the\
    \ entire array to the parameter variable @_. A typical case might look like\n\n\
    ```\nmy $sum = sum_array(@foo);\n```\n\nThe parameter passing code generated by\
    \ Perl is equivalent to\n\n```\n@_ = @foo); # Notice the absence of a backslash\n\
    ```\n\nTo get the parameter out of @_ and into a real array, use code like this:\n\
    \n```\nsub sum_array(@)\n    my @array_to_sum = @_;\n```\n\nThere are some limitations\
    \ on this type of parameter:You can use it once in a parameter specification,\
    \ and it must be last.\nHere's another example of a subroutine that takes two\
    \ scalar arguments and an array parameter:\n\n```\nsub sum_slice_array($$)\n \
    \   my $start_index = shift; # Index of the first element to sum\n    my $end_index\
    \ = shift; # Index of the last element to sum\n    my @array_to_sum = @_; # The\
    \ array containing the data to sum\n```\n\nCompare these two subroutines:\n\n\
    ```\nsub sum_slice_ref(\\$\\@)\n\nsub sum_slice_array($$)\n```\n\nThe first, sum_slice_ref,\
    \ uses a reference for the array specification. This means that passing the array\
    \ in is a little more efficient.\nBut it means that the function call is limited\
    \ to passing in a single array. For example:"
