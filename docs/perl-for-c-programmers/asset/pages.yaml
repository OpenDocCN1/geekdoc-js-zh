  md: '# Using the CPAN Installer (UNIX and Linux)


    When you install manually, you have to go through each step. Perl programmers
    don''t like to do anything twice if they can help it, and that includes installing
    modules. So is there a Perl script designed to download and install modules called
    CPAN.


    The CPAN script also has one additional advantage over manual installation; it
    automatically downloads and installs any prerequisite modules that are needed.
    Thus if you are installing the C Inline module and need the recursive descent
    parser, it automatically downloads and installs it.


    The CPAN script comes with Perl. To start it, use the command


    ```

    $ perl -MCPAN -e shell

    ```


    # For Information


    If you want to know what the -M and -e flags do, check out the document perrun
    using the perdoc command. If you want to find out all about CPAN, you can use
    the command


    ```

    $ perdoc CPAN

    ```


    # Caution: Running CPAN with PERL5LIB


    On occasion, I''ve experienced problems when running CPAN with the PERL5LIB environment
    variable set. If you experience problems, you might want to unset this variable
    and try again.


    When you run CPAN for the first time, it asks you a number of questions to configure
    it.


    The first is “Are you ready for manual configuration?” If you answer “no,” CPAN
    attempts to automatically configure everything using the default answers. Because
    some of these may not be correct, you should press Enter to select “yes,” the
    default:


    ```

    $ perl -MCPAN -e shell

    ```


    CPAN is the world-wide archive of perl resources

    It consists of about

    100 sites that replicate the same contents around the globe. Many countries have
    at least one CPAN site already. The resources found on CPAN are easily accessible
    with the CPAN.pm module. If you want to use CPAN.pm, you have to configure it
    properly.


    If you do not want to enter a dialog now, you can answer ''no'' to this question
    and I''ll try to autoconfigure. (Note: you can revisit this dialog anytime later
    by typing ‘conf init’ at the cpan prompt.)


    Are you ready for manual configuration? [yes]'
