- img_proc: true
  md: 'POD documentation begins with a line =pod and ends with =cut. Anything between
    the =pod or other POD directive and =cut lines is considered a comment by Perl
    but is considered documentation by the POD tools.

    Start the script with the usual stuff, put in the POD documentation, and then
    follow this with the rest of the program. An abbreviated version of the program
    looks like this:


    ```

    use strict;

    use warnings;

    ```


    ```

    =pod

    The pod documentation (to be done)

    =cut

    # The rest of the script

    print "This program solves all the worlds problems.\n"

    ```


    Now all you have to do something between these two directives.

    A semistandard style has developed over the years when it comes to documenting
    programs. This style was started by the UNIX man pages and copied into the Perl
    documentation system. You don''t have to follow this standard, but it is the one
    that everyone has to expect, and the one that''s documented here.


    # NAME


    The first section of the documentation is the NAME section. In it, you give the
    name of your program and a short one-line description of what it does.

    In the case of the money conversion program, this looks like


    ```

    =head1 NAME

    ```


    us2hk - Convert US$ to HK$ (or versa)


    The =head1 directive tells POD that this is a level 1 heading. The text NAME will
    be printed in bold letters in the typeset of the documentation. Other levels of
    heading from (=head2) to (=head6) are available for your needs.

    A blank line occurs after the =head1 directive. POD uses blank lines to separate
    things. In this case, you are separating the heading from the paragraph that follows.


    This paragraph is actually a single line listing the name of the program (us2hk)
    and a single line description. (It''s a very short paragraph.)

    POD considers text that begins in column 1 to be a part of a paragraph that can
    be typeset. Paragraphs are separated by blank lines.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# SYNOPSIS


    The SYNOPSIS section lists the program name and all the options and arguments
    that can be passed to it. The SYNOPSIS section looks like


    ```

    =head us2hk [-u] [-r=<rate>] <amount>

    ```


    Again, this is a level 1 (head). If the next line is indented with one or more
    spaces, POD considers it to be a code example or command, and it will be typeset
    in monospaced courier type. Also no typesetting conversions are made on the text.


    In this example, the command is us2hk. It can take a -u flag. Because this flag
    is in square brackets ([u]), it is optional.


    The second flag also is optional. It takes an argument indicated by <rate>. Finally,
    the <amount> argument is not in square brackets ([]), so it is not optional.


    # DESCRIPTION


    The DESCRIPTION section contains a description of what the program does. This
    can run for several paragraphs:


    ```

    =head DESCRIPTION

    ```


    The I<us2hk> converts United dollars to Hong Kong dollars. It can optionally convert
    form HK to US as well.


    It is an extremely useful program if you ever go to Hong Kong and find out that
    a copy of Microsoft Windows 2000 that you need to purchase is selling for $160.00
    (HK).


    This section has two paragraphs.They are separated by a blank line.The paragraphs
    are not indented because POD considers indented text a code example, not a paragraph.


    The first paragraph uses the I<...> escape. This tells B<...> for bold and C<...>
    for code. The online font controls include B<...> bold. The online document perlipod
    contains a complete list of escapes.'
