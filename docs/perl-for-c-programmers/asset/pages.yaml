  md: "# Debugging a Module\n\n# Running the Debugger\n\nTo debug the module, you\
    \ must first run the debugger on Perl. The example in this chapter uses the gdb\
    \ debugger on Linux. This section shows how to use this debugger to debug the\
    \ function.\n\nThe first step is to figure out the name of the function. Although\
    \ it is called mt_op, the Perl-to-C translation program (xsubpp) mangles the name.\n\
    \nInspect the C code to see what xsubpp generates. In this case, the function\
    \ declaration is:\n\n```\n#line 18 \"mt_op.c\"\nXS(XS_mt_op_mt_op)\n{\n    dXSARGS;\n\
    ```\n\nFrom this, you can see the name of the function generated XS_mt_op_mt_op.\
    \ Now you know what you are debugging, you can start the debugging.\n\nThe first\
    \ thing to do is to start the debugger on the Perl program:\n\n```\n$ gdb /home/oualline/local/bin/perl\n\
    ```\n\nGNU gdb 5.0\nCopyright 2000 Free Software Foundation, Inc.\nGDB is free\
