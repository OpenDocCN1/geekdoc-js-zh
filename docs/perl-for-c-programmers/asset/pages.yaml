  md: '# Tk Widgets 25


    +   - Listbox—Displays a list of items and lets you select one or more of them.

    - Menus—Lets you build command menus.

    - Dialogs—Pop-up windows for messages and other common selections.

    - Text—Contains multiple lines of text. This is a flexible widget in which you
    can embed widgets and have all sorts of fun. (More on this in the upcoming “text”
    section.)

    - Canvas—A widget in which you can draw shapes, text, and widgets.

    - MainWindow—The top-level menu for your application.

    - Toplevel—A pop-up window.


    The Tk system comes with a number of demonstration programs that let you see what
    widgets are available. The first demonstration program is called widget, and it''s
    installed when you first install Tk.


    To run the program, just type widget. Note that if you are using ActiveState’s
    Perl, you’ll find the widget.bat command in the \PERL\E\TK directory.


    The program gives you an overview of almost all the types of widgets as well as
    demonstrations of their use (see Figure 13.2). For example, if you click on item
    7, Two Labels Displaying Images, you see a demonstration of two image labels.
    Click on the Code button and code for the demonstration appearances.


    ![](img/59544d13b3df863dfcb334297c75b37e_232_0.png)


    | PerTk Widget Demonstrations |

    | This application provides a front end for several short scripts that demonstrate
    what you can do with Tk. Each of the below demonstrations, you can click to run
    the demonstration. Once the demonstration appears, you can click the “Code” button
    to see the code. If you want, you can edit the code and click the “View” button
    to run the demonstration with your modified code. |


    +   Labels, buttons, checkboxes, and radiobuttons

    1. Labels (text and images)

    2. Buttons

    3. Checkboxes (select any of a group)

    4. Radiobuttons (select one of a group)

    5. Scrollbars (scroll out boxes)

    6. Iconic labels that use bitmaps

    7. Two labels displaying images

    8. A simple user interface for viewing images.


    +   Listboxes

    1. BD status

    2. Change the color scheme for the application

    3. A collection of famous sayings


    +   Entries

    1. Without scrolling.

    2. With scrollbars.


    Figure 13.2 Widget demonstration program.'
