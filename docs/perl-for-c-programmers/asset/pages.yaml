  md: "This function tells Tk that the button is to be packed up at the top of the\n\
    window and attached to the upper-right (ne) corner of the window:\n$tk_exit_button->pack(\n\
    \  -side => \"top\",\n  -anchor => \"ne\"\n);\n\nYou can join these two function\
    \ calls and create and manage the widget at\nsame time:\nmy $tk_exit_button =\
    \ $tk_mw->Button(\n  -text => \"Exit\",\n  -Command => \\&exit,\n  -background\
    \ => \"red\",\n  -foreground => \"white\"\n)->pack(\n  -side => \"top\",\n  -anchor\
    \ => \"ne\"\n);\n\n# The Main Event Loop\n\nThe last thing you need in the Tk\
    \ program is a call to the event loop handler.\nThis is a short loop that waits\
    \ for an event and then handles it. It's a simple\nfunction:\nMainLoop();\n\n\
    As you can see, this covers all the main elements of a Tk program are pre-\nsent\
    \ in \"Hello World\" program. There's no difference between \"Hello\nWorld\" and\
    \ a real-world program except for some added complexity.\n\n# Geometry Managers\n\
    \nThe geometry manager is responsible for determining where the widgets get\n\
    placed inside the window. This section discusses the four basic geometry man-\\\
    agers: pack, grid, place, and form.\n\n# pack\n\nThe basic algorithm of the pack\
    \ geometry manager is to \"shove\" the widgets\ntogether as closely as possible\
    \ in the indicated direction.\"There are four pack\nregions: top, bottom, left,\
    \ and right.\n\nThe geometry manager must not only support the initial placement\
    \ of the\nwidgets, but also redo the layout if the size of the window changes.\
    \ The\npack algorithm lets you anchor a widget to a point within the packing region."
