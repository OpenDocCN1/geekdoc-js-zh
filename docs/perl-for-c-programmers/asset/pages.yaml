  md: '# Character Sets


    One problem with the current approach is that it only takes into account leading
    spaces. But what happens if someone decides to start a comment line with a <tab>?
    The regular expression won''t work.


    You need to tell Perl that a line may start with a combination of spaces or tabs.
    By enclosing a set of characters in square brackets ([]), you will tell Perl to
    match any one of the enclosed characters. For example, if you want to match a
    space or tab, use the expression [\t ] (\t is the escape sequence for tab). So
    the new regular expression


    ```

    if ($line =~ /^[\t]*# /)

    ```


    This matches


    +   # Hash at the beginning of the line

    # 4 spaces before the hash

    # A tab starts this line


    This expression is starting to get a little complex. It would be a good idea to
    comment it. So the expression, including comments looks like the following:


    ```

    # +Beginning of line (^)

    ------+ Space or tab ( ) and (\t)

    ###### Repeated 0 or more times (*)

    #!!!!! The character #

    ```


    ```

    if ($line =~ /^[\t]*# /)

    ```


    Commenting regular expressions like this serves several purposes. First it helps
    you organize your thoughts. Thinking about what you are doing can be a big help
    when creating regular expressions. (It''s not a bad lesson for life either!)


    Also, it helps you make sure that you include all the elements you expected to.
    Because of the compact nature of regular expressions, it''s easy to leave something
    out.


    Finally, it leaves notes for the people who come after you and maintain the code.
    Because regular expressions are dense and cryptic, these notes will be extremely
    useful for the poor soul who inherits your code.


    # More on the Character Set Operator ([])


    The character set operator matches any character enclosed in the square brackets
    ([{}). For example, to match the lowercase vowels, you can use the expression
    /[aeiou]/. Suppose that you want to match the word "the". The regular expression
    will be /the/. But the word can be capitalized. That means that you want to look
    for "The" or "the". The regular expression for this is /[tT]he.'
