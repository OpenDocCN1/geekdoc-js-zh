  md: '# Perl for C Programmers


    If you are a programmer wanting to learn Perl and have a background in C or C++,
    this book is for you!


    While no other book on the market covers specifically for you and your background,
    Perl for C Programmers is written specifically with you in mind and will teach
    you how to upgrade your skills using Perl. This book teaches how similar and different
    between Perl and C/C++ how to utilize Perl to the fullest. In addition, it includes
    a cookbook section that is full of recipes for quick and easy answers on common
    tasks.


    Steve Oualline, reputable C/C++ and VIM author, teaches you all major types of
    Perl programming. He also goes beyond Perl to teach how to exploit the extensive
    library of Perl housed in the CPAN repository.


    > Steve Oualline is the author of many programming and Linux-related books. He
    is a professional software engineer, author, and educator. Currently, he works
    for a large software company as a quality engineer devising ways to improve the
    quality and reliability of the cade produced by their programmers. Other books
    by this author Vi - Vim (New Riders), Practical C++ Programming, Second Edition
