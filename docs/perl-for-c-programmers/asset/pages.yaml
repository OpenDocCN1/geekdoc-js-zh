  md: "# 222 Chapter 13 Creating GUIs with Tk\n\nremember. This is followed by the\
    \ list of attributes for this tag. In this case, there's only one attribute, background,\
    \ and you want it to be yellow.\n\nNow that you have defined the tag, apply it\
    \ to the first two lines of the text. This is done by adding the tag to the text:\n\
    \n```\n$text_box->tagAdd('highlight',\n  \"0.0',\n  \"1.0 lineend\");\n```\n\n\
    This example changes the first line (numbered 0 and 1) and adds the tag 'highlight'.\
    \ This turns the background yellow (in addition to any other tags that apply to\
    \ this text).\n\nYou start at the beginning of the first line—that's line, character\
    \ 0, or \"0.0\". You end at the end of the second line. This is specified as \"\
    1.0 lineend\", or in Tk line 1, character 0, and then go to the end of line line.\n\
    \nTags give you great flexibility in displaying text. You can also bind events\
    \ (see the following section, \"Events\") to tags, which allows them to respond\
    \ to events such as mouse clicks, function keys, focus changes, and other events.\n\
    \n# Events\n\nThe widgets in the Tk collection a pretty good job of handling their\
    \ own events. For example, the Button widget handles a mouse click by calling\
    \ the function specified by --command. The Text widget handles keypress events\
    \ by putting the characters typed in the entry.\n\nBut sometimes you may want\
    \ to handle additional events. The bind method is used to connect an event, widget,\
    \ and subroutine together. For example, suppose you want to implement a status\
    \ line in which context help is displayed when the mouse is placed over a widget.\n\
    \nThe two events you are interested in <Enter> (mouse enters the widget's window)\
    \ and <Leave> (mouse leaves the widget). The bind calls look like this:\n\n```\n\
    $tk_exit_button->bind('<Enter>',\n  sub {display_help(\"Exits the program\");});\"\
    ,\n```\n\n```\n$tk_exit_button->bind('<Leave>',\n  sub {display_help(\"\");});\"\
    ,\n```\n\nIn this case, the widget is an Exit button called $tk_exit_button. When\
    \ the mouse enters the button, a help message \"Exits the program\" is displayed.\
    \ When the mouse leaves, the message is erased.\n\nA wide variety of events can\
    \ be bound. The online documentation Tk::Bind contains a complete list."
