  md: '# Table 4.1 Regular Expression Elements Discussed in the Chapter


    | Element | Meaning |

    |---|---|

    | <character> | Match the given character. Works on letters, digits, and a few
    symbols. (Most symbols have a special meaning.) |

    | ^ | Match the beginning of the line. |

    | $ | Match the end of the line. |

    | * | Repeat zero or more times. |

    | + | Repeat one or more times |

    | [xyz] | Match any of the characters "x", "y", or "z". (Only one character in
    the string is matched.) |

    | [a-m] | Match any character from "a" to "m". |

    | [^xyz] | Match any character except "x", "y", or "z". |

    | \s | Match a whitespace character. |

    | \S | Match any character that''s not whitespace. |

    | \d | Match a digit. |

    | (...) | Put characters that match the enclosed regular expression in the variable
    $1. The next ()''s data is placed in $2 and so on. |

    | x|y | Match "x" or "y". |

    | *? | Repeat zero or more times, but match as little as possible. (The default
    is to match as much as possible.) |

    | (?:...) | Treat the enclosed regular expression as a single atom but not put
    the enclosed text in $1, $2, and so on. |

    | (?<...) | Negative assertion. In other words, the text cannot match "..." at
    this point. |


