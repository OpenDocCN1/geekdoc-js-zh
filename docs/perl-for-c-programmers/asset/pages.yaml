  md: "The $_ variable serves as the default in the following cases:\n\n+   - It is\
    \ the default value when doing a pattern match expression:\nif ($_ =~ /#/) { \
    \   # is the same as\nif (/^#)/\n\n+   - Unless a variable is specified, an input\
    \ statement will store the result on a\nread in $:\n$_ = <STDIN>; # he is the\
    \ same as\n<STDIN>\n\n+   - If no variable is specified for chomp, then $_ is\
    \ used:\nchomp($_); # he is the same as\nchomp\n\n+   - It is the default string\
    \ for split:\nmy @words = split /\\s+/, $_; # Is the same as\nmy @words = split\
    \ /\\s+/\n\n+   - A standalone s/xx/yy/ statement modifies it by default:\n$_\
    \ -= s/manager/idiot/g; # he is the same as\ns/manager/idiot/\n\n+   - It is the\
    \ default argument for many arithmetic functions, such as sin, cos,\nand log:\n\
    my $angle = sin $_; # is the same as\nmy $angle = sin;\n\n+   - It is the default\
    \ value for the print function:\nprint $_; # he is the same as\nprint;\n\nNote\
    \ that the use of $_ can lead to some compact code. For example,\nListing 5.1\
    \ shows a program that removes all the trailing whitespace from the\nstandard\
    \ in and writes the results to standard out.\n\n# Listing 5.1 trailing.pl\n\n\
    ```\nuse strict;\nuse warning;\n```\n\n```\nwhile (<STDIN>) {\n    s/\\s+$//;\n\
