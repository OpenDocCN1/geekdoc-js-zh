  md: "# 136 Chapter 7 Subroutines and Modules\n\nThis form of parameter passing should\
    \ be avoided. By using a parameter specification, you give Perl the capability\
    \ to do valuable parameter checking. Leave out the parameter specification, and\
    \ you invite chaos.\n\n# The local Declaration\n\nThe local keyword needs to be\
    \ discussed because it's so commonly misused in subroutines. It does not create\
    \ a local variable. The my keyword does that job. Instead, it has a more complex\
    \ meaning. A local declaration does the following:\n\n+   - Saves the global definition\
    \ of a variable.\n- Lets you change the variable as much as you want.\n- When\
    \ the local variable goes out of scope, it restores the global definition.\n\n\
    For example, take a look at the following code:\n\n```\nprint \"$ARGV arguments\
    \ present\\n\"\n{\n  local @ARGV;\n  my $first = shift @ARGV;\n  print \"$ARGV\
    \ arguments present now\\n\"\n}\n```\n\nThis is the equivalent of saying\n\n```\n\
    print \"$ARGV arguments present\\n\"\nmy $save_argv = @ARGV;\n{\n  my $first =\
    \ shift @ARGV;\n  print \"$ARGV arguments present now\\n\"\n}\n@ARGV = @save_argv;\n\
    print \"$ARGV arguments restored\\n\"\n```\n\nThe bottom line is that local is\
    \ a very tricky keyword that should only be used in limited circumstances. It\
    \ is presented here so that you can recognize it when you see it in other people's\
    \ code.\n\nYou should not use it at this stage. Instead, you should use the my\
    \ declaration to declare your local variables. Note that local is one of the most\
    \ misused keywords in Perl. Frequently, people will inappropriately use local\
    \ when they really should use my."
  merge: -1
