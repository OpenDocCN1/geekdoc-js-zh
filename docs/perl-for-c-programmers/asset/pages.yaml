  md: "# 208 Chapter 12 CGI Programming\n\n```\nprint \"User is good\\n\"\nelse {\n\
    \    print \"User is bad\\n\"\n}\n```\n\nSo what's wrong with this program? The\
    \ problem is that the user can supply anything he wants for his username. This\
    \ can be something reasonable such as sam, or it can be something that allows\
    \ him to hack the system such as sam ; rm -rf /.\n\nThe second answer causes the\
    \ system to execute the command validate_user sam; rm -rf /\n\nBecause a semicolon\
    \ is the separator for the shell, it is actually two commands: the validate_user\
    \ and an rm -rf. This is not what was intended.\n\nIn general, Perl's Taint mode\
    \ prevents you from using any unchecked input in a system or open function.\n\n\
    For example, when Taint mode is turned on, using tainted user input in a system\
    \ can result in an error like the following:\n\n```\nInsecure dependency in system\
    \ while running -T switch\n-at passwd.pl line 7, <- line.\n```\n\nDirect assignment\
    \ will not remove the taint from the data. However, if you extract a string tainted\
    \ from data, the result is untreated. For example:\n\n```\n$tainted_data -- /^([^\\\
    s)*$/;\n$my_tainted_data = $1;\n```\n\nAlso anything coming from the environment\
    \ is considered tainted. In particular, Perl will not start a system if the path\
    \ is tainted. To remove this taint, you will need to set the path yourself as\
    \ well as remove from your environment variables that affect the shell:\n\n```\n\
    $ENV{PATH} = /bin:/usr:/usr/X1R6/bin;\ndelete $ENV{'IFS', 'CPATH', 'BASH_ENV'};\n\
    ```\n\n# How Perl Programs Break\n\nExperience is the best teacher; unfortunately,\
    \ experience in a security disaster is not something you really want to have.\
    \ Take a few minutes to learn what not to do.\n\nFirst, remember that usernames,\
    \ filenames, and other user input can contain special characters. You've already\
    \ seen how a username of sam; rm -rf / can create havoc."
