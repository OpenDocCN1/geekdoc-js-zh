  md: '# UNIX/Linux Installation Quick Reference


    Here are the steps you need to perform to do a Perl compilation and\installation:


    ```

    $ zcat perl-5.6.1.tar.gz | tar xf -

    $ cd perl-5.6.1

    $ ./Configure

    $ make

    $ make tests

    $ make install

    ```


    # Installing Perl on Microsoft Windows


    The people at ActiveState have a precompiled Perl binary that they make

    available for free. You can get it at http://www.activestate.com. (Select

    Downloads and select ActivePerl to get to the download screen.)


    You may need to download some tools or service packages before you can

    install ActivePerl. Check the initial download screen for information.


    To install the program, download the file and save it to disk. Then from the

    file browser, double-click on the file, and the installation process begins.


    The system asks you a number of questions. The default answer works on

    most systems.


    Note that the system modifies your default path. To get this new path, you''ll

    have to close down any MS-DOS Prompt windows that were open during the

    installation and start them up again.'
