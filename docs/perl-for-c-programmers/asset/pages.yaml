  md: "Listing 4.3 contains the full Makefile fixing program.\n\n```\nListing 4.3\
    \ fix_make.pl\nuse strict;\nuse warning;\n\nwhile (!) {\n    my $line = <STDIN>;\n\
    \    if (not defined($line)) {\n        last;\n    }\n    chomp $line;\n\n   \
    \ $line = s/^/ /\\t/;\n    $line = s/\\\\*/\\\\\\\\//;\n\n    print \"$line\\\
    n\";\n}\n```\n\n# The grep Function\n\nThe grep function searches through a list\
    \ of strings and returns an array of the strings that match a regular expression.\
    \ (UNIX users will notice that this function works very much like the system grep\
    \ command. Microsoft Windows users will find that it works a very souped-up FIND\
    \ command).\nThe general form of the function is\n\ngrep /expression/, list\n\
    where /expression/ is the regular expression to check, and list is a list of strings\
    \ to examine.\nFor example, if you want to find any lines with the word \"TODO:”\
    \ in them, you can use the statement:\nmy @todo_lines = grep /TODO:/, @file_lines;\n\
    \n# Summary\n\nThis chapter covered one of the most powerful features of Perl—regular\
    \ expressions. As you can see from the examples in this chapter, regular expressions\
    \ allow you to do some very sophisticated examination and manipulation of strings.\
    \ This is, again, part of the strength of Perl as a language."
