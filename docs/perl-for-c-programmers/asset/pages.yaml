  md: '# Step-by-Step Installation


    This section goes through the installation process step-by-step.

    The first step is to unpack the binary. To do this, use the zcat and tar commands
    (you must have the GNU version of zcat to unpack the tar ball; if this program
    has not been installed yet, you can get one from htp://www.gzip.org). For example:


    ```

    $ zcat perl-5.6.1.tar.gz | tar xf

    ```


    Next, jump into the directory you just created and run the Configure command:


    ```

    $ cd perl-5.6.1

    $ ./Configure

    ```


    The Configure command asks several questions concerning the operating system and
    environment you are. Unless you are an expert doing an installation on an unusual
    system, you''ll want to just accept the defaults. After running the command you
    will see something similar to the output shown below:


    ```

    $ ./Configure

