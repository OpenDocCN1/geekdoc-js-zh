  md: '# Installing Perl on UNIX or Linux from Source Code


    If your system does not have Perl or if your Perl is out-of-date, you can install
    it from the source code.You can get a copy of the source code from http://cpan.perl.org.


    This example shows how to download version 5.6.1 of Perl. During the install process,
    you will be asked many questions. The default answers work for almost all of them.
    The questions you have to worry about are


    +   - The location where you want Perl installed

    - Whether you want to perform setuid emulation


    # Installation Directory


    The installation directory is the name of the directory in which Perl installs
    the Perl program and related files. Say that you selected /home/oualline/local
    as your installation directory. The following directories are created during the
    installation process:


    ```

    /home/oualline/local/bin—The Programs such as "perl"

    /home/oualline/local/lib—The Modules

    /home/oualline/local/man—Man format documentation files

    ```


    # setuid Emulation


    A setuid program is one that runs under the user ID of the owner of the file rather
    than the user ID of the person running the program.

    Many UNIX systems do not allow you to have setuid scripts as Perl programs because
    they are not secure. Perl has a way around this problem, however. The solution,
    called setuid emulation, is to create a program that makes it look like you have
    setuid scripts.

    The method Perl uses is to create a helper program called suidperl. However, to
    install this program, you''ll need to be the root.


    > Note

    If you''re doing CGI programming (for web forms), you''ll probably want to install
    a setuid version of Perl. The web server normally runs CGI programs using a special
    username (such as "nobody"). If you want your CGI programs to run as if they were
    started by you, you''ll need to make them setuid programs.'
