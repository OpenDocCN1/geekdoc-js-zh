    # Debugging


    Debugging CGIs is always a problem. To help you debug this program, some debug
    code was installed. This code prints the value of all the items in the %cgi_data
    hash.

    The nice thing about this debug output is that it can be turned on and off. If
    the file /tmp/debug.disk exists, debugging is turned on. If it''s not there, nothing
    is output. The full debug function is


    ```

    58 sub debug()

    59 {

    60     if (-f "/tmp/debug.disk") {

    61         foreach my $cur_key (sort %cgi_data) {

    62             print encode_entities($cur_key), " =gt; ",

    63             encode_entities($cgi_data($cur_key));

    64         }

    65         print "<BR\n";

    66     }

    67 }

    ```


    Although simple, this function provides a lot of useful debug information.


    # The Cookie


    The example program was embellished with one extra feature. The system uses a
    cookie to remember the last selected category. The information is recorded by
    sending the web browser cookie. To do this, the program uses the Set_Cookie to
    create the cookie and a print statement to send it to the web server:


    ```

    251 # The cookie to send to the user

    252 $my_cookie;

    253 $cookie = Set_Cookie(

    254     NAME => "CATEGORY", # Cookie''s name

    255     VALUE => \$category, # Value for the cookie

    256     EXPIRE => "$2d", # Keep cookie for 2 days

    257 );

    258 print "$cookie";

    ```


    ![](img/59544d13b3df863dfcb334297c75b37e_299_0.png)'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# The CGI Version 283


    In this example, the name of the cookie is CATEGORY, and it will expire in two
    days. The value of the cookie is the current category.


    The cookie is printed using a print statement. The cookie line is actually part
    of the header sent back to the browser. The other header line used is the "Content-type"
    line. For a full description of the various elements of a heading, check out the
    standard at http://www.w3.org/Protocols/.


    The first time the program runs, the cookie is set. The next time the browser
    accesses the program, it sends the cookie back to you. Actually, once (you can
    set more than one). You can check the cookie using the Parse_Cookie function:


    ```

    239 # Cookie information

    240 my %cookies = Parse_Cookies();

    241

    242 # The weight from the cookie

    243 my $category = Cookies(CATEGORY);

    244 if (not defined ($category)) {

    245   $category = "All"

    246 }

    ```


    This code gives you the default category.


    # Debugging Cookies


    Debugging cookies is a little difficult because they are stored by the browser.
    being sent from the web server to the browser. To turn it on, select Edit, Preferences.
    This opens the Preferences window (see Figure 15.7). If you are using Microsoft
    Internet Explorer 6.0, you can turn off cookies through the Tools, Internet Options,
    Privacy, Advanced menu.


    ![](img/59544d13b3df863dfcb334297c75b37e_300_0.png)


    Figure 15.7 Netscape Preferences.'
