    # 17

    Creating Modules


    AS YOU HAVE SEEN, A MAIN FEATURE of Perl is its extensive module library. Modules
    are available for just about everything. But there are some things just can''t
    find a module for. In that case, Perl provides you the tools to write your own.


    Note that the examples used in this chapter have been generated and tested on
    a Linux system. They should work the same way on any UNIX system. Microsoft Window,
    users will notice minor differences in the generation process. Also note that
    the module described here is Linux/UNIX operating dependent.


    # The Module Creation Process


    Perl provides the module creator a set of tools to make his life easier. The main
    one is called h2xs. This is a program that translates C header files (h files)
    into Perl external subroutine specifications (xs files).


    In C, you use a header file to define an interface to the module. A Perl module
    is no different; it starts with a C header file.


    This example defines a function that manipulates a magnetic tape drive. In other
    words, it allows the user to rewind the tape, forward space files, and so on.'
  merge: -1
  pgno: 372
