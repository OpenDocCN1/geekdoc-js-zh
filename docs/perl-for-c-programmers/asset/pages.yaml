  md: "# The split and join Functions\n\nThe split function is one of the most useful\
    \ functions in Perl. It splits up a string and turns it into an array. This makes\
    \ it extremely useful when it comes to parsing things such as Excel export files,\
    \ UNIX or Linux configuration files, or other similar files.\n\nFor example, suppose\
    \ that you have an inventory data file where the colon (:) separates each record.\
    \ A typical entry might look like the following:\n\n```\n#10 screws:1000:500:Universal\
    \ Screw Company\n```\n\n(This record has a list for #10 screws. 1000 is in stock.\
    \ When the number reaches 500, you'll reorder more from the Universal Screw Company.)\n\
    \nNow turn this record into an array. You do this by using the split function:\n\
    @array = split /:/, $record;\n\nThe first argument to the split function tells\
    \ it what delimiter to use to split the string. This uses a colon (/:). The second\
    \ argument is the string to split. In this case, it's the database record.\n\n\
    The first argument is enclosed in slashes (/) because it is a regular expression.\
    \ (See Chapter 4, \"Regular Expressions,\" for a more detailed explanation of\
    \ it.)\n\n# Balancing a Checkbook\n\nSuppose that you want to balance your checkbook.\
    \ The checking information is kept in a file. Each line is a single check record\
    \ consisting of a date, when the check was made out to, and an amount. The fields\
    \ are separated by a tab.\n\nThe program must read in this data and produce a\
    \ report. Listing 3.3 contains the program.\n\nListing 3.3 check.pl\n\n```\nuse\
    \ strict;\nuse warnings;\n\nmy $total = 0;      # Current running total of all\
    \ the checks\n\nwhile (1) {\n    my $line = <STDIN>\n\n    # STDIN may be redirected,\
    \ check for EOF\n    if (not defined($line)) {\n        last;\n    }\n}\n```"
  merge: -1
  pgno: 81
- img_proc: true
