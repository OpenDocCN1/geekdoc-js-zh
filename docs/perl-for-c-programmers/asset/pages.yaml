- img_proc: true
  md: '# Chapter 16 Cookbook


    The first buttons, First, Next, Previous, and Last, select which error is shown
    on the screen. The Ignore button causes the system to add the current line to
    the list of ignored expressions. Finally, the Exit button stops the program. The
    program makes extensive use of the Tk widgets for its work. One of the more interesting
    is the Text widget. This is used to hold the log file.


    The program is designed to display the error lines in red. Does it through the
    use of a text tag. This is the name given to a group of attributes applied to
    the text in a Text widget.


    To use a text tag, you must first define it. This is done through the tagConfigure
    method. This changes the attributes of a tag if it exists, or creates one if it
    does not:


    ```

    196 $text_box->tagConfigure(''highlight'',

    197 -background => ''Red'');

    ```


    In this case, a tag highlighted is created, which turns the background of the
    text to red. (The name highlight was arbitrarily chosen; you can use any name
    that makes sense.).


    Now you need to apply to the error text. This is done through the tag method.
    You need to tell this function which characters get the highlight. There are several
    different ways of specifying a location in a text box. (These locations go by
    character index).


    One way is to use <line><character>. <line> is the line number of text starting
    with 1. The<character> parameter denotes the character starting with 0. So the
    start of the tenth line is "10.0".


    A character index can have an adjustment following the initial location specification.
    For example, linstart moves the location to the start of a line, and lineend moves
    it to the end.


    To highlight a single line, from the start of the line ($text_line.0) to the end
    ($text_line.lineend) as shown in the code:


    ```

    132 # Text box uses 1 number/Perl uses 0

    133 $text_line = $line_number + 1;

    134 $text_box->tagAdd(

    135 "highlight",

    136 $text_line.0,

    137 $text_line.lineend

    138 );

    ```


    The other interesting item in the code is the use of a named block. The program
    goes through the list of ignore commands, and if one matches, the line is not
    an error (lines 120–127). If a line is not ignored, it is checked against the
    error list and highlighted if it is on the error list (lines 128–141).'
