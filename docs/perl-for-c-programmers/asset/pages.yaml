  md: '![](img/59544d13b3df863dfcb334297c75b37e_230_0.png)


    # # 13 Creating GUIs with Tk


    IF YOU WANT TO WRITE A GUI for a Perl program, then the Tk module is the way to
    go. It lets you easily create powerful and functional GUIs. The other nice thing
    about the Tk package is that it''s portable, so you can use your programs both
    on Microsoft Windows and UNIX/Linux systems.


    # ## Tk Basics


    To use the Tk module, you need to know some basics first. This chapter starts
    with an impractical example, the Tk version of “Hello World” (see Listing 13.1).


    Listing 13.1 hello.pl


    ```

    use strict;

    use warnings;


    use Tk;


    sub byebye()

    {}

    ```'
