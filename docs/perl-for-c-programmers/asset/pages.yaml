    01/01/01: Rent Payment 500.00 Total: 500.00\n01/01/01: Car Payment 86.29 Total:\
    \ 586.29\n01/08/01: Grocery store 26.95 Total: 613.24\n01/15/01: Dog Groomer 19.95\
    \ Total: 633.19\n```\n\n# Common split Expressions\n\nSome common split expressions\
    \ are listed in Table 3.1.\n\n| Expression | Explanation |\n| --- | --- |\n| /\\\
    t/ | Tab separated (One of Excel's export format.) |\n| / + | One or more spaces\
