    \nThe next step is to turn the SV into something you can use, namely an array\
    \ and a length. This is done through the SvPV macro:\n\n```\nint len; /* Length\
    \ of the bit array */\n/* The bit array */\nunsigned char *array = SvPV(bits,\
    \ len);\n```\n\nNow that you have the array, check to whether it has the correct\
    \ number of bytes in it. If it's the wrong size, write out an error message and\
    \ call the Perl internal function croak. (This is the equivalent of the Perl language\
    \ function die.) For example:\n\n```\nif (len != SIZE_BYTES) {\n    fprintf(stderr,\
    \ \"Bit array is %d bytes long\\n\", SIZE_BYTES);\n    croak('Can not continue');\n\
    }\n```"
