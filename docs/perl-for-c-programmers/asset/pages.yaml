  md: 'In this case, a here-doc string is used for a print statement, but you could

    have just used $error_msg = <<EOF; in an assignment statement:

    Error: Syntax error on line $line, no such keyword $key

    Please check spelling and try again.

    EOF


    Perl expands variables (*) in a here-doc string just like it does in any other

    double-quoted string. So in this example, $line will be replaced by the

    value of the variable $line, and the variable $key will be interpreted as well.

    If you do not want variables, you need to tell Perl to do this

    string as if it were in single quotes (''''). This is done by putting the keyword
    in

    single quotes:


    ```

    print <<''EOF'';

    Total cost is $6,250.00

    Shipping is $450 more

    EOF

    ```


    Common Mistake: Forgetting the ;

    If you are a shell or csh programmer, the here-doc syntax is familiar to you.
    Remember that a

    Perl here-doc string replaces a normal string in the statement. It doesn''t replace
    the rest of

    t line. You still need the semicolon (;) to end the line. For example:


    # Incorrect

    print <<EOF

    Phase one is now complete.

    Phase two is beginning.

    EOF


    Although this looks correct to shell programmers, the missing semicolon (;) causes
    Perl to complain.


    # The die Function


    Frequently in a program, you will encounter a fatal error. When this occurs,

    anner error message and abort the program.

    Perl has a convenient function to do that, called die. The usage is simple

    enough:

    die(''We can not go on'');


    When run, the following prints:

    We can not go on at test.pl line 4.


    So the function only prints the error message but also tells the user where

    in the script the error occurred. This makes the die function very useful for
    all

    those error conditions that cause your program to stop.'
