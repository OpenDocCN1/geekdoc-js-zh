  md: '# Log File Viewer 35


    By making spotting errors easier, you can create a Perl program that goes through
    a log file and highlights the errors.


    But what constitutes an error? Obviously, a line with the word “Error” on it.
    That’s not always true. Sometimes someone produces a module with a name: STR_Error.c.
    Compiling this is not an error.


    So your program must be flexible in deciding what is an error and what isn’t.
    You can solve this problem by partially weaning out of it and letting the user
    control what is and not an error through a configuration file.


    The file looks like


    ```

    ERROR

    regular expression

    regular expression

    ```


    ```

    ...

    IGNORE

    regular expression

    regular expression

    ```


    Anything in the ERROR section will be an error, unless it’s in the IGNORE section,
    in case it isn’t an error. This means you can tell the system that all lines with
    “Error” in them are errors (they would appear in the ERROR section), unless the
    line looks like:


    ```

    cc -g ErrorMessages.c

    ```


    In this case we put the line in the IGNORE section and it would not be counted
    as an error.


    Now you need to design a GUI for the program. The results can be seen in Figure
    16.2.


    ![](img/59544d13b3df863dfcb334297c75b37e_332_0.png)


    Figure 16.2 GUI for log file viewing.'
