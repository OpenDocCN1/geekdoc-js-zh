  md: '# The Definition of Truth


    # String "00"


    One of the more unusual true values is the string "00". Take a look at how Perl
    treats this value:


    +   1. Is it undefined? If it is, it''s false. Not undefined.

    2. Is the empty string? If it is, it''s false. Not the empty string.

    3. Is it the same as the string "0"? If it is, it''s false. Because "0" is not
    equal to "00", it''s not the same as "0"

    4. Then it must be true.


    This string is defined, not empty, and not the string "0" so it is true.


    # What Is Truth Anyway?


    For a long time, people have been searching for the meaning of truth. However
    the legal profession has created a precise definition of this philosophical term.


    "Truth is anything the judge says it is. An absolute truth is anything 5 out of
    9 Supreme Justices agree upon."


