  md: '```

    @array(0..9) = ((0) x 10);

    ```


    (You can also use the x operator to repeat the 0 ten times.)


    # The splice Function


    The splice function allows you to remove or replace part of an array. The simplest
    form of this function looks like the following:


    ```

    splice @array, Offset;

    ```


    This deletes the elements in the array starting at offset and going to the end
    of the array.


    For example:


    ```

    my @array = (0, 1, 2, 3, 4, 5);

    slice(@array, 3);

    print "@array\n";

    ```


    This prints "0 1 2" elements from 3 removed. If the offset is negative, the number
    of elements is counted from the end of the array rather than the start. For example,
    if you apply the following to the original array


    ```

    splice(@array, -2);

    ```


    get "0 1 2 3" elements dropped from the end


    # The splice Function’s Return Value


    The splice function returns different things depending on whether it''s used in
    the array context or the scalar context. Array context means the result is assigned
    to an array, or the function is used in a place where you would expect an array.
    Similarly, a scalar context is where the result is assigned to a scalar or as
    it were a scalar.


    When used in the array context, the splice function returns the elements. For
    example:


    ```

    my @array = (0, 1, 2, 3, 4, 5);

    my $result = splice(@array, 3); # Array context

    print "$result\n";

    ```


    This removes elements "3 4 5".nIn the scalar context, it returns the last element
    removed. For example:


    ```

    my @array = (0, 1, 2, 3, 4, 5);

    my $result = splice(@array, 3); # Array context

    print "$result\n";

    ```


    Because three elements were removed, this prints "5".'
