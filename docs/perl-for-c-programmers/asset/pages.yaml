  md: '![](img/59544d13b3df863dfcb334297c75b37e_206_0.png)


    # # CGI Programming


    PERL IS THE LANGUAGE BEHIND MANY OF THE interactive web pages you see today. Whenever
    you enter data into a form or get information from an interactive report, you
    are probably dealing with Perl.


    Interactive web pages use a programming API called CGI (Common Gateway Interface)
    to handle the interaction between the user and the application. Because of its
    excellent string handling capabilities, Perl is an ideal language for writing
    web applications.


    This chapter shows how the CGI system works and how to write simple CGI programs
    to power your web site.


    This chapter is oriented toward a UNIX or Linux system because that''s what web
    servers run on.


    # ## Simple CGI


    You need to understand what happens when a CGI program is executed. It all starts
    when a user requests a URL either by clicking on a link or by typing it into his
    browser.


    The browser sends a request to the web server telling it, “I want to get a resource
    with the URL named http://www.webserver.com/cgi-bin/hello.pl.”'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'The web server looks at the URL and breaks it down into its components. The
    key parts are the directory cgi-bin and the filename hello.pl. Normally, the server
    would merely return the file hello.pl, but because it''s in the directory cgi-bin
    and because the server''s configuration tells it that cgi-bin contains CGI programs,
    it executes the program, capturing the output and sending it to the web server.


    The user''s web browser sees a resource coming from the web server and displays
    it or offers to save it on a hard drive. As far as it''s concerned, the web browser
    sends in a request and got back a web page.


    Now that you have an idea of what''s going on, you''ll see how to write the first
    program.


    # CGI Hello World


    The CGI version of "Hello World". Although simple, the program may be of a challenge
    to get running than your usual Perl program. The program itself is simple enough,
    as shown in Listing 12.1.


    Listing 12.1 hello.pl


    ```

    #!/home/sdo/local/bin/perl -T

    # Replace the above line with the path

    # to your Perl program


    use strict;

    use warnings;


    print <<EOF

    Content: text/html


    <HEAD><TITLE>Hello</TITLE></HEAD>

    <body>

    <P>

    Hello World!

    </BODY>


    EOF

    ```


    The first thing to notice is that the program begins with the line

    #!/home/sdo/local/bin/perl -T'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# CGI Hello World 191


    This is a special "magic line" used on UNIX/Linux systems to turn the script into
    a program. (See Appendix B, "Turning Perl Scripts into Commands," for details.)
    You''ll have to replace that line with one that contains the full path to your
    installation of Perl, so this script will require a little customization.


    You are passing the Perl interpreter the -T switch to turn on something called
    "taint" checking. This is a security feature discussed in detail later.


    Next, the program prints out the following:


    ```

    Content: text/html

    blank line

    ```


    That is, it prints Content: text/html followed by a blank line. These two tell
    the browser that a web page follows.


    Then the web page itself is printed.


    # Running the Program


    The next step is to get the program to run. First, you set the execute permission
    using the command


    ```

    chmod +xr hello.pl

    ```


    Next, you must put the program in a place where the web server can execute it.
    The exact directory is going to be configuration dependent. If you are running
    the Apache web server, the default location of CGI scripts is in the directory
    www/cgi/cgi-bin and its subdirectories. Even different distributions of Linux
    put the CGI directory in different places. Some common installation directories
    are -var/www/cgi-bin and -apache/cgi-bin/.)


    For this example, assume that you are running Linux with Apache and have a default
    configuration. Move the script into that directory:


    ```

    mv hello.pl www/cgi-bin

    ```


    The next step is to see whether you can run the script from the browser. You do
    that by specifying the URL of the script. Again, this is system and configuration
    dependent. If you are running Apache in the default configuration (as in this
    example), the URL would be


    ```

    http://www.webserver.com/cgi-bin/hello.pl

    ```


    Replace webserver with the name of your system.'
