  md: '# Chapter 4 Regular Expressions


    Vim (Vi Improved) and Regular Expressions

    Vim editor (a clone available from http://www.vim.org) is extremely useful when
    it comes to learning regular expressions. When you search in Vim (using the /,
    ?, or related commands), the search string you specify is a regular expression
    very similar to the regular expression used by Perl.


    Vim has an option called highlight search. When you do a search with this option
    enabled, all matching strings are highlighted. Thus if you don''t know exactly
    what the regular expression /+/+ will match, you edit the file with Vim, search
    for "the+", and see what''s highlighted.


    To turn off the highlight search option, execute the Vim command:


    ```

    :set hlsearch

    ```


    # Modifiers


    Suppose that you want to make your comment structure a little more flexible. You
    want to let the user type a few spaces before the # in a comment. The following
    lines are all considered comments:


    +   * This is a comment

    * This is too

    * <space># <space><space># And this is also


    Note that I spelled out a space as <space> in this example, because real spaces
    are difficult to see on the page. I mean real spaces.

    to match this, you need to tell Perl that a comment has the following characteristics:


    +   * Beginning of line

    * Zero or more spaces

    * A #


    Now to translate these rules into Perl: Rule 1 is "Beginning of a line."That''s
    "~" in Perl speak.

    Zero or more spaces is trickier. A single space is easy to do—that''s " \ But
    you need a modifier to tell Perl that a space can be repeated zero or more times.
    For that, use the star (*) modifier. So zero or more spaces translates to "* ".


    Finally, there''s the # itself.

    So the full regular expression is


    ```

    if ($line =~ / *#)/

    ```


    This successfully matches the three comment lines.'
