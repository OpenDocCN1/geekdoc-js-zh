    # GUI Interface


    In addition to the command-line interface, a GUI interface is created using the
    Tk toolkit (see Figure 15.1).


    ![](img/59544d13b3df863dfcb334297c75b37e_284_0.png)


    Figure 15.1 GUI interface to the disk database.


    To build this GUI, we start by constructing a selector. This selector (set to
    All in Figure 15.1) lets the user decide which type of disk is displayed. The
    selector is constructed using a Tk::Optionmenu widget.

    Below the category selector is the list of disks. A Tk::Listbox widget is used
    for the display.

    At the bottom of the window is the action frame that contains all the action buttons.


    # The Add Pop-Up Window


    When the user clicks the Add button, a pop-up window appears that allows him to
    add the text (see Figure 15.2).'
