- img_proc: true
  md: '# Chapter 2 Perl Basics


    The first line,

    use strict;


    tells Perl to turn on strict syntax and variable checking. This line should begin

    every program you write. Without it, Perl relaxes the syntax rules and lets you

    do do things you shouldn''t. (More on this later.)


    The second line

    use warnings;


    turns on additional compile time and runtime warnings. These diagnostics can

    be useful in spotting problems in your code.


    The warnings directive is relatively new in Perl. If you are using an earlier

    version of Perl (pre-5.6.0), this directive won''t work. You''ll get an error:
    "Can’t

    locate warnings.pm in @INC..." (To find out which version of Perl you are

    running, execute the command perl -v.) If that happens, upgrade your ver-

    sion of Perl or omit this directive.


    Finally, you come to the heart of the program:

    print Hello\n;


    This prints the message

    Hello World


    # Running a Perl Script as a Standalone Command


    Frequently, you''ll see Perl programs beginning with a line that looks something
    like:


    ```

    #!/usr/bin/perl

    ```


    This is actually not part of the Perl program itself, but a "magic string" that
    is used to turn this Perl

    script into something can be executed as a standalone command. Because this string
    is highly

    installation dependent, it is not discussed here. Instead you''ll find full details
    in Appendix B,

    "Turning Perl Scripts into Commands"


    To run this program, use the command

    perl hello.pl


    If you are using an old version (pre 5.6) of Perl and want to turn on warnings,

    use the command

    perl -w hello.pl


    Now that you''ve gotten a Perl program to run, you can add on to this basic

    knowledge by adding in variables and expressions.'
  merge: -1
