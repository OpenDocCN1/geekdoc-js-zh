  md: '# Time Adjustment


    Perl is not the first language that comes to mind when you say “number crunching”.
    After all, the math in Perl is slow and inexact. You have much better control
    over your numbers if you use C or C++.


    It turns out that most number crunching applications don''t do all that much math.
    Instead, they spend a lot of time reading the input and parsing it, and a lot
    of time formatting the output with a little number work in the middle.


    Perl is excellent for the beginning and end of this process. And if the middle
    (the numbers) is small, it is an ideal language for the job.


    One of my hobbies is horology (horology is the study of time measurement and the
    making of clocks). I have a number of antique clocks around that I am constantly
    fiddling with them. I wind and set them one day, and then check them another.
    Based on the results, I make some adjustments to see whether I get them to be
    more accurate.


    To get an idea of how accurate my clocks are, I wrote a little script that computes
    the time error and normalizes it so that I get an error based on a 24-hour period.


    As you can see in Listing 16.3, 97 percent of the program is concerned with decoding
    the input, about 2 percent performing the calculations, and 1 percent doing the
    output.


