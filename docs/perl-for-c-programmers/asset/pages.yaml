    A line with a # in the middle


    But if you want to check for empty lines as well? The $ character matches the
    end of a line. So if you want to check for an empty line, use the following statement:


    ```

    if ($line =~ /$/)

    ```


    This matches any line that has a beginning (^) followed immediately by an ending
    ($). Because the only way you can have the beginning of the line in the same place
    as the end is when the line is empty, this matches empty lines.'
