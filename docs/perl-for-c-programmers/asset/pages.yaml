  md: '# 192 Chapter 12 CGI Programming


    Figure 12.1 shows the result of loading this URL into an Internet Explorer window.


    ![](img/59544d13b3df863dfcb334297c75b37e_209_0.png)


    Figure 12.1 Hello World (CGI version).


    Common Problem: Wrong Directory or Misconfigured Server?

    Sometimes when you type in your URL, the script appears rather than the output
    of the script (Figure 12.2).


    The problem probably is caused by putting the script in the wrong directory. Scripts
    are executed only if they are put in a CGI-enabled directory. If a script is put
    in an ordinary web page directory, it''s treated as an ordinary web page and is
    displayed.


    The solution is to put the script in the correct directory. Your web site administrator
    can help you.


    On the other hand, if you''re sure that you''ve got the right directory, it''s
    possible that your web server could be misconfigured.


    In either case, work with your web server administrator to solve the problem or
    read the section "Debugging a CGI Script" later in the chapter.


    continues'
