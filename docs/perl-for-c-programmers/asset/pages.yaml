  md: "# Chapter 8 Object-Oriented Programming\n\nSo you've taken care of the following\
    \ case:\n\n```\n$time1 = $time2 + 10;\n```\n\nbut what happens when the code have\n\
    \n```\n$time1 = 10 + $time2;\n```\n\nThe answer is that Perl switches the operators\
    \ so that $time2 is first and then calls the add function. Perl also does a number\
    \ of other little things behind your back. If you use the ++ operator and don't\
    \ explicitly specify a function for it, Perl turns the ++ into an add. It also\
    \ does the same for the ++ operator. By defining the code for one operator, you\
    \ can perform all of explicit and implied additions:\n\n```\n$time1 = $time2 +\
    \ $time3;\n$time1 += 5;\n$time1 += $time2;\n$time1++;\n```\n\nThe subtract function\
    \ looks pretty much like add, but there's a problem. When the first argument is\
    \ a number and the second argument is an object, Perl switches the order. This\
    \ is not a problem with addition, but in subtraction, it causes strange answers.\n\
    Fortunately, Perl supplies an extra argument that tells you when the operands\
    \ have to be switched. This is true if Perl has flipped the arguments for you.\n\
    \nTo use this in the subtract function, you must first grab the argument:\nsub\
    \ subtract($$$)\n\n```\n{\n  $time1 = shift;      # The hash we wish to subtract\
    \ from\n  $time2 = shift;      # The other hash\n  $flag = shift;       # The\
    \ manipulation flag\n\n```\n\nAfter all the reference shift is handled, check\
    \ to see whether the arguments need to be flipped:\n\n```\nif ($flag) {\n  ($time1,\
    \ $time2) = ($time2, $time1);\n}\n```\n\nFinally, overload the operator double\
    \ quote (*). This operator is used to turn the object into a string. This is useful\
    \ for printing. For example:\nprint \"The time $time1\\n\";\n\n+   Listing 8.6\
    \ shows the fully overloaded time package. Listing 8.7 presents the code to test\
    \ it."
