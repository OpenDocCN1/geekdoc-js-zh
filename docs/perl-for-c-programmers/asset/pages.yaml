  md: 'The program creates a test script mt_op (the name of the module) and a number
    of files in it. These are


    +   - mt_op.pm—The Perl interface to the module. This file contains the code that
    actually loads the C functions.


    +   - mt_op.xs—The external subroutine specification. This code is a special sort
    of half Perl, half C language used to create the interface between the Perl and
    C code.


    +   - Makefile.PL—The Perl version of the Makefile. Actually, the Perl script
    that generates the Makefile.


    +   - README—A prototype README file. (For you to edit and fill in.)


    +   - test.pl—A test script. (You are encouraged to add your own tests to this
    script.)


    +   - MANIFEST—A list of files included in this module.


    If you are interested, you can examine these files now, but the real fun is to
    begin. You need to copy the header file into the mt_op directory and run h2xs
    again. Before you start, first install the module C::scan if you have not already
    done so. Then you can copy the header file and run h2xs again (from the same directory
    as the previous h2xs command). For example:


    ```

    $ cp mt_op.h mt_op

    $ h2xs -Oxn mt_op_op.h

    Overwriting existing mt_op!!

    Scanning typemaps...

    Scanning mt_op.h for functions...

    Scanning mt_op.h for typedefs...

    Writing mt_op/mt_op.pm

    Writing mt_op/mt_op.xs

    Writing mt_op/typemap

    Writing mt_op/Makefile.PL

    Writing mt_op/README

    Writing mt_op/test.pl

    Writing mt_op/Changes

    Writing mt_op/MANIFEST

    ```


    The preceding code uses few new flags. The -0 flag tells h2xs to overwrite existing
    files. The -x indicator tells the program to scan the header files listed on the
    command line (mt_op.h) for function prototype and constants and to generate code
    based on what it finds.


    You may wonder why you couldn''t run the program like this in the first place.
    Why run it twice?'
