  md: "But what happens when you add a scalar time object to a number? For example:\n\
    my $time1 = $time1 + 10;\n\nThe answer is that Perl calls your add function. Unfortunately,\
    \ your function can't handle this situation.\n\nIn C++, you would solve this problem\
    \ by overloading the add function.\nThus, you would create two functions:\n\n\
    ```\ntime &add(const time &t1, const time &t2);\ntime &add(const time &t1, const\
    \ int t2);\n```\n\nPerl doesn't let you overload functions. Instead, all add calls,\
    \ no matter what the type of the variable, are funneled through this function.\n\
    So the function needs to be smart enough to detect when the second parameter is\
    \ an object and when it's a scalar. To do this, use the ref function. If \\$var\
    \ is a reference, the ref function returns the name of the object being referenced.\
    \ If \\$var is not a reference, the ref function returns undef.\nSo to check whether\
    \ you have a reference, use the following statement:\n\n```\nif (not ref($time2))\n\
    ```\n\nIf you find that a number, change it to an object:\n\n```\nif (not ref($time2))\
    \ {\n  \\$time2 = new time_over($time2);\n}\n```\n\nListing 8.5 shows the full\
    \ add function.\n\n# Listing 8.5 Full add Function\n\n```\nsub add(\\$)\n  my\
    \ \\$time1 = shift;      # The first time for adding\n  my \\$time2 = shift; \
    \     # The second time for adding\n  my \\$result = {};        # Result of the\
    \ addition\n\n  if (not ref($time2)) {\n    \\$time2 = new time_over($time2);\n\
    \  }\n\n  \\$result->{hours} = \\$time1->{hours} + \\$time2->{hours};\n  \\$result->{minutes}\
    \ = \\$time1->{minutes} + \\$time2->{minutes};\n  \\$result->{hours} += int(\\\
    $result->{minutes} / 60);\n  \\$result->{minutes} %= 60;\n  return (bless \\$result);\n\
    ```"
