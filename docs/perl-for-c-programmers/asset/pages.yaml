  md: '# Naming Schemes


    The names push, pop, and unshift may seem like an unusual collection of words
    to use for array manipulation. These names have a bit of history behind them.
    The push and pop operators come from the classical terms used for stack manipulation.


    The shift comes from shell programming. Perl borrows much of its syntax from the
    UNIX Bourne shell and its successor the Korn shell and the Bourne Again shell.


    As for shift, it seems the obvious choice for the name of something that''s the
    reverse of shift.


    # Dealing with Parts of an Array


    Perl contains a wealth of features that let you deal with part of an array. For
    example, Perl lets you index an array not only with a single index, but also with
    a set of indices. To make this specification easier, the range operator (..) can
    be used to specify a whole set of indices.


    The splice function lets you extract or replace a whole set of values within an
    array.


    # Using a Set of Indices


    You know that the notation @array is used to specify an entire array, and the
    expression @array[$index] specifies a single value.


    You can specify a set of indices separated by commas. For example:

    @new_array = @array[1,3,5]


    The following expression swaps the first two elements of an array:

    @array[1,0] = @array[0, 1];


    or

    @array[0,1] = @array[1, 0];


    Here''s another example where you set the first and last elements of an array
    to -1:

    @array[0, $array] = (-1, -1);


    # The Range Operator


    Suppose that you want to assign something to the first three elements of an array
    without changing the rest of the array. One way to do this is to use the comma
    (,) operator:

    @array[0,1,2] = (0, 0, 0);


    But suppose you want to zero the first 10 elements. You could write out all the
    numbers from 0 to 9, or you could use the range operator to specify a range of
    values:'
  merge: -1
