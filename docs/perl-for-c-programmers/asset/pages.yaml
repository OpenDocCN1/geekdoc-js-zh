  md: '# Chapter 2 Perl Basics


    The expression:


    ```

    my $full_name = "" $last;

    ```


    uses explicit concatenation to create the result. It''s much simpler to use the
    string interpretation method described in the next section.

    So when it comes to arithmetic, Perl is not that much different from C.

    However, Perl''s power comes from what it can do with strings, as you''ll see
    in later chapters.


    # Quoting Rules


    There''s one type of expression that you haven''t learned about yet—the expressions
    evaluated when a string is interpreted. For example, the statement


    ```

    my $full_name = "$first $last";

    ```


    actually has a couple of implied concatenation operations. In this case, the system
    concatenates the variable $first, a space, and the variable $last together and
    assigns the result to $full_name.

    A number of characters have special meaning inside double quotes (*).

    These are the scalar variable names, which begin with $, array names, which begin
    with @ (more on this in Chapter 3,"Arrays") and escape sequences, which start
    with \).


    For example:


    ```

    my $size = 42; # Size of a dimension

    my $name = "width"; # Name of the dimension

    my $title = "$name$size";

    ```


    In this case, the value of $title is assigned the following value:

    width=42


    But what if you want to put text after a variable name? Suppose that want to say
    "42inches" rather than just "42."You can''t write the expression as


    ```

    my $title = "$name\tsizeinches";

    ```


    This won''t work because Perl looks for a variable called $sizeinches. The solution
    is to separate the variable from the rest of the string by enclosing the name
    in curly brackets {}} as follows:


    ```

    my $title = "$name\${size}inches";

    ```


    If you don''t want Perl to interpolate your strings, use single quotes ('''').
    The only things that Perl considers special single quotes are the escape characters
    ''\'' and \\.'
