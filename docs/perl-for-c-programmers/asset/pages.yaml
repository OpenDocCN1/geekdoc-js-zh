  md: '# The join Function


    The join function is the reverse of the split function. It takes the elements
    of an array and joins them together. The general form of the join function is


    ```

    $result = join($string, @array);

    ```


    For example, say that you want to write a file that can be imported by Microsoft
    Excel. The simplest import file is one in which the fields are separated by tabs.
    To turn an array into a line that Microsoft Excel can use, need the Perl statement


    ```

    $my line = join("it", @data);

    ```


    # Sorting an Array


    The sort function sorts an array. By default, the sort function sorts in ASCII
    order. For example:


    ```

    @array = qw(John Mark Ann)

    @sorted = sort @array;

    print "@sorted\n";

    ```


    This prints the following:


    Ann John Mark


    To sort an array in numerical order, use the statement


    ```

    @result = sort {$a <=> $b}, @unsorted;

    ```


    Note that this code uses an advanced feature of sort that is discussed in further
    detail in Chapter 7,"Subroutines and Modules."


    # Multiple Dimension Arrays


    Perl does not have a multiple dimension array. It can do a pretty good job of
    faking one through the use of anonymous references. (References in Chapter 6.)


    For example:


    ```

    @matrix = (

    [ 1, 2, 3],

    [ 11, 12, 13],

    [ 21, 22, 23]

    );

    ```


    ```

    $matrix[2][2] = "Sam";

    ```


    Notice that square brackets are used ([]) to declare the rows of the matrix.'
  merge: -1
