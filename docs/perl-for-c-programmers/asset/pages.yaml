  md: "# Reading a Binary File\n\nThis is not what you want if you are dealing with\
    \ binary files, so you need\ntell Perl that your file is binary using the binmode\
    \ function call:\nbinmode(IN_FILE);\n\nNext loop through and read the file. This\
    \ is done with the Perl read function\ncall. The Perl read function works pretty\
    \ much like the C read function, only\nit reads the file using the buffered I/O\
    \ mechanism. (For an unbuffered read,\nuse the sysread function).\n\nLike C's\
    \ read, the Perl read function takes three arguments: a file variable, a\nbuffer\
    \ in which to store the data, and number of bytes to read. The return\nvalue is\
    \ the number of bytes read.\n\nIn the dump program, you want to read in the first\
    \ 8 bytes:\n\n```\nwhile (1) {\n    my $buffer;\n    my $read_size = read(IN_FILE,\
    \ $buffer, 8);\n```\n\nNote that Perl strings are different from C strings. C\
    \ strings use the null char-\\acter (0) as an end-of-string delimiter. Perl strings\
    \ have no null-delimiter\ncan contain anything, including a null character. This\
    \ makes it possible to store\nbinary data in a Perl string, something that can't\
    \ be done with a C string.\n\nThe call returns 8 bytes of binary data. Now check\
    \ to see that you\nactually got 8 bytes and exit the loop if there is a problem\
    \ or if you run out of\nbytes:\n\n```\nif ($read_size < 8) {\n    }\n```\n\nNow\
    \ you have the buffer as a scalar. Because almost all of Perl's operators deal\n\
    with strings, there's not much you can do with it at this point. You need to\n\
    transform it into something you can use.\n\nYou do this through the unpack function\
    \ call. This function's job is to\nunpack binary data and turn it into an array\
    \ of values.\n\nThe question is, how do you turn a set of bits into a string?\
    \ After all, there\nare many different ways of expressing a bit pattern. For example,\
    \ ASCII char-\\acter“L” can be presented as\n\n+   01001100 (Binary)\nL (ASCII)\n\
    76 (Decimal)\n4C (Hexadecimal)\n0114 (Octal)"
