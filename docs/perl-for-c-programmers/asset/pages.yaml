    In addition, the geometry manager manages the size of the widget. -expand option
    controls whether the widget expands to fill the available space. In addition,
    the -fill option tells the geometry manager whether the widget is to fill the
    available space. The value of -fill can be "x", "y", "both", or "none".


    You''ll see how these things work in a real example. Figure 13.4 shows the main
    window of the tk_grep.pl program. (Listing 13.2 shows the full program.)


