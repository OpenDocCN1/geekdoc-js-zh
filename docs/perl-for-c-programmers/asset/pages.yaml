    > Declare a Variable Anywhere


    > Perl lets you declare a variable anywhere. The scope of the variable is from
    the point it is declared to the end of the file. If the variable is declared inside
    a curly bracket block {}, the scope of the variable ends at the end of the block.


    # Common Mistake: Using printf


    Perl has both a print function, which prints strings, and a printf function, which
    acts very much like the C printf function.


    One common mistake made by most C programs is to over use the Perl printf statement.
    For example:


    ```

    printf "Total pressure on the cylinder %f\n", $effort;

    ```


    Although this statement works, it is inefficient and not as clear as writing


    ```

