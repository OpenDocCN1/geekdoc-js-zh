  md: '# Arrays on the Left Side of the =


    Perl is a little unusual in that it lets you put array expressions on both sides
    of

    the operator. For example:


    ```

    ($first, $middle, $last) = @array;

    ```


    This is the equivalent of


    ```

    $first = $array[];

    $middle = $array[1];

    $last = $array[2];

    ```


    Another use for this syntax is to swap two variables without the use of a tem-porary
    value:


    ```

    ($first, $second) = ($second, $first);

    ```


    # Perl’s Darker Corners


    Perl’s designers have stated that their philosophy in designing Perl is “There’s
    more than one way to do it.” My philosophy is a little different:“There is only
    one clearest way to do it."


    Unfortunately, if you examine some of the existing Perl scripts, you''ll discover
    that Perl has a very rich and somewhat confusing set of syntax elements. This
    section describes some of the slightly obscure statements so you''ll know what
    they do when you come across them.


    # The unless Statement


    The unless statement is a shorthand for if not. For example, the following two
    statements are the same:


    ```

    if (not defined ($title))

    unless (defined ($title))

    ```


    But why two different words (unless and if) where one will do? There is no need
    for you to remember both of them. Just stick with the if not, and don''t worry
    about the unless.


    # The Dangling if and unless Statements


    Normally the if and unless statements precede the statements they control, but
    Perl lets you use the if and unless statements as a sort of postscript. For example,
    the following statement prints a debug message if the variable $debug is true:


    ```

    print "The current file is $file\n" if ($debug);

    ```'
