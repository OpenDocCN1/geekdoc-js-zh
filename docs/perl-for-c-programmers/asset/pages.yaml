  md: '# Cookbook


    This section presents step-by-step instructions for installing the Perl modules

    Tk and Devel::ptkb. The steps presented here can be useful in installing other

    modules from CPAN or the ActiveState repository.


    # Linux


    To install these modules to a Linux system, do the following:


    +   1. Check to see whether you have the gcc compiler installed by using the

    following command:

    $ which gcc


    If the command reports an error, install the Linux package containing

    the GNU compiler from your Linux distribution. (The pack-

    age name depends on which distribution you have, but it is usually called

    `gcc-<something> ` )


    +   2. Check to see whether you have installed the XFree86 development

    libraries. You will need to compile programs that use the XFree86

    windowing system, such as the Perl module Tk. To see whether this pack-

    age is installed, execute the following command:

    $ /usr/X11R86/include/X11/core.h


    If this file does not exist, install the Linux package containing the

    XFree86 development system.


    +   3. Install every Perl package you can find.

    4. Check to see whether the module Tk has already been installed using the

    following command:

    $ perl -e "use Tk;"


    If you get an error message, go to the next step. If the program prints

    nothing, the module Tk is already installed, and you can go on to step 6.


    +   5. Install Tk as root using CPAN, by executing the following commands:

    $ perl -MCPAN -e shell


    ......


    ```

    cpan install Tk

    ```


    If you cannot become root, check out the section “Dealing with

    Permission Problems” later in the chapter.'
