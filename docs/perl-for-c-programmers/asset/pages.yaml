  md: "As a rule, if you want to write clear readable programs, you don’t want\nhave\
    \ hidden variables or defaults. After all, if you see a statement like\nchomp;\n\
    \nhow can you tell whether the programmer wanted the program to change $\\_\n\
    or he just forgot to put in the variable name? To avoid confusion, it is\nadvised\
    \ that you include a variable and not let things default.\n\n# “Here-Doc” Syntax\n\
    \nSuppose that you want to print a bunch of lines. One way to do it is with\n\
    bunch of print statements:\n\n```\nprint \"Help text:\\n\"\nprint \"Command line\
    \ is:\\n\"\nprint \"datecheck [options] <file> [<file>...]\\n\"\nprint \"Where:\\\
    n\"\nprint \" [options] are to be defined\\n\"\n```\n\nAnother way of doing it\
    \ is to print using a single long string:\n\n```\nprint \"Help text:\\nCommand\
    \ line is:\ndatecheck [options] <file> [<file>]\nWhere:\n[options] are to be defined\"\
    \n```\n\nA third solution is to use the “here-document” syntax. This syntax tells\
    \ Perl\n a long, multiline string that follows the here-document statement shouldnbe\
    \ printed as it was entered until the closing marker is found. In other words,\\\
    Ive put the string *here* in the script itself. The string starts on the line\
    \ follow-\ning the statement and continues until a special keyword is found.\n\
    \nThe syntax of a here-doc string is <<Keyword>. The Keyword signals that a here-\n\
    document string follows. The Keyword tells Perl that the string stops when younsee\
    \ a line with just *Keyword* on.\n\nFor example:\n\n```\nprint <<EOF;\nHelp text:\n\
    Command line is:\ndatecheck [options] <file> [<file>]\nWhere:\n[options] are to\
    \ be defined\n```\n\n```\nEOF\n```\n\nThis example uses the keyword EOF. This\
    \ is the traditional keyword used fornalmost all here-doc strings, but any other\
    \ word can be used."
