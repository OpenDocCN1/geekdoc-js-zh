  md: 'The phone.pl program (see Listing 16.2) takes a letter phone number on the
    command line and outputs a numeric version. The basic algorithm is to split the
    argument into individual letters and then process them through a translation hash.


    The only tricky part is turning a string such as "junk" into an array such as
    (''j'', ''u'', ''n'', ''k''). The natural solution when you need to break up something
    is to look at the unpack function. But after looking at the documentation for
    unpack and experimenting with many different packing specifications, I concluded
    that unpack just wouldn''t work. Sometimes the natural solution is not the correct
    one in Perl.


    I remembered the split function. Specifically, what happens if someone tries to
    use the following statement to split a line into a bunch of words is something
    like the:


    ```

    # Classic mistake

    my @words = split /\s*/, $line;

    ```


    This does not split around whitespace(\s) boundaries because it says 0 or more
    times, and Perl likes to choose. The result is that line split into single characters.
    (See Chapter 3, "Arrays," if you''ve forgotten about this.)

    So split if used properly. But what should you use as a field separator? The answer
    is nothing. You want every character to be a field. So to split the argument into
    single characters, use this statement:


    ```

    49 @chars = split //, $string;

    ```


    That being, all you need are some loops and print statements, and you''re in business.


