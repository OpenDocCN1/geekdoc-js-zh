    # 10 POD


    PERL COMES WITH ITS OWN BUILT-IN DOCUMENTATION SYSTEM. In Chapter 1, “Exploring
    Perl,” you learned how to use that system to access the huge repository of online
    documentation that comes with Perl.

    In this chapter, you''ll learn how to create such documents.


    # POD (Plain Old Documentation)


    Perl uses a documentation format called POD (Plain Old Documentation). POD enables
    you to put the documentation for a program in the program itself. The system was
    designed to be simple and easy to use so that writing documentation would be easy.


    The simplicity also makes it possible for people to create a wide variety of POD
    converters (pod2html, pod2man, pod2tex), which convert POD format documents into
    something more readable.


    # Documenting a Program


    Suppose you have written a program that converts US dollars to Hong Kong (HK)
    dollars, and you want to document it. You can do so by embedding POD documentation
    in the Perl script itself.'
