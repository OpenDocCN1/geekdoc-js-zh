    # Summary


    According to Oualine''s law of documentation, 90 percent of the time, the documentation
    is lost. Out of the remaining 10 percent, 9 percent of the time it will be a version
    or two out of date and therefore completely useless. The 1 percent of the time
    you have the documentation and the correct version of the documentation, it will
    be written in Japanese (my Japanese readers might want to substitute the term
    "English" here).

    Prl has been the odds and created a standard way of documenting your programs.
    By keeping the documentation inside the program, things do not get lost.

    One strength of the Perl CPAN archive is that almost all the modules are documented.
