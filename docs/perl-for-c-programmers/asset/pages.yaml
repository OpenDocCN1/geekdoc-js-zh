  md: "# 214 Chapter 13 Creating GUIs with Tk\n\nListing 13.1 Continued\n\n```\nexit\
    \ ();\n}\nmy $tk_mw = MainWindow->new();\nmy $tk_button = $tk_mw->Button(\n  \
    \  -text => \"Hello World\",\n    -command => \\byebye\n);\n$tk_button->pack(\n\
    \    -side => 'top'\n);\nMainLoop();\n```\n\nWhen run, this program displays a\
    \ window containing a single button labeled “Hello” as seen in Figure 13.1. When\
    \ this button is clicked, the program exits.\n\n![](img/59544d13b3df863dfcb334297c75b37e_231_0.png)\n\
    \nFigure 13.1 Hello World program.\n\nThree important graphical elements are involved\
    \ in this program.\nAt the top level is the window. In this case, because it's\
    \ the first (and only) window, it's called the Main Window.You put all the GUI\
    \ elements in this window.\nNext are the GUI elements, also called widgets. This\
    \ example has only one widget, the Hello button.\nThe final element is the geometry\
    \ manager. It is responsible for telling Tk where to put the widgets in the window.This\
    \ example uses the pack geometry manager. It tells Tk to stuff the widgets as\
    \ close together as possible.\nYou learn about these elements in more detail as\
    \ you study the Tk module.\n\n# Tk Widgets\n\nThe Tk module provides many widgets.\
    \ These include\n\n+   - Button—A button you can click on.\n- Label—A text or\
    \ graphic label.\n- Checkbox—A box that can be checked.\n- Radiobutton—Lets you\
    \ select from a set of options."
