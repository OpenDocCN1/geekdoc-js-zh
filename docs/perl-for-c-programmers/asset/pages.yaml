  md: "# References\n\nA reference is simply a Perl equivalent of a C pointer. Actually,\
    \ Perl references do much more than C pointers, but for now, it's easiest to think\
    \ of them as pointers.\n\nThe backslash character (\\) indicates a reference.\
    \ The equivalent operator in C is address of (&). The following example creates\
    \ a reference to a simple variable:\n\n```\nmy $variable = 1;\nmy $reference =\
    \ \\$variable; # Reference to a variable\n$$reference = 2;\nprint \"$variable\\\
    n\";\n```\n\nIn this example,$reference is you need to add a scalar--$variable.\
    \ To get to the actual scalar referenced, you need to add another $ to the expression--$$reference.\
    \ Think of ($) as a (*) operator being used with a C pointer.\n\nThe following\
    \ example gets a little bolder and defines a reference to an array:\n\n```\nmy\
    \ @array = qw(red white blue);\nmy $ref = \\@array;\n```\n\nThe elements of array\
    \ are\n$array[0], $array[1], $array[2]\n\nor if you access them through the following\
    \ reference:\n$$ref[0], $$ref[1], $$ref[2]\n\nTo get the number of the last element\
    \ in an array, you use the expression $$array. When using a reference, you would\
    \ use #ref instead.\n\nYou can use the push, pop, shift, and shift commands on\
    \ references as well as normal arrays. For example:\npush(@$ref, \"new-value\"\
    );\n\nReferences to hashes follow the backslash (\\) operator and then use $ref\
    \ in place of the variable name where:\n\n```\nmy $hash = (red => 1, blue => 2,\
    \ green => 3);\nmy $ref = \\hash;\n```\n\n```\nprint \"Red's value is $$ref\\\
    n\";\nprint \"Blue's value is $$ref[blue]\\n\";\n```\n\nThe following code fragment\
    \ prints all the values in a hash:\n\n```\nforeach $cur_key (keys %$ref) {\n \
    \   print \"$cur_key: $$ref->{$cur_key}\\n\";n}\n```"
