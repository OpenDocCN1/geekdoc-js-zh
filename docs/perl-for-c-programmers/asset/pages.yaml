  md: "# The foreach Statement\n\nChapter 3, \"Arrays,\" used the following statement\
    \ to go through all the ele- of an array:\n\n```\nfor ($index = 0; $index <= $array;\
    \ $index++)\n{ $element = $array[$index]; }\n```\n\nThe same statement can be\
    \ written more easily as a foreach statement\nforeach $element (@array)\n\nThe\
    \ foreach statement loops through each element in the list. The variable $element\
    \ is assigned the value of each element as Perl goes through the list. \nFor example:\n\
    \n```\nmy $array = (qw(One Two Three));\n```\n\n```\nprint \"The array contains\
    \ ;\nforeach $element (@array) {\n    print \"$element \";\n}\nprint \"\\n\";\n\
    ```\n\nThis code fragment prints the elements of the array. Notice that you are\
    \ all to declare the variable $element inside the foreach statement. The output\
    \ of this program is\n\nThe array contains One Two Three\n\nIncidentally\n\nNote\
    \ that the $element variable is actually a reference to the array element (see\
    \ Chapter 6, \"Hashes, References, and Complex Data Structures,\" for information\
    \ on references).This means that any change to $element changes the element in\
    \ the array.\n\n# $ \\_ Variable\n\nIn C and C++, people generally use the variable\
    \ i as the \"handy-dandy, all-purpose, very temporary integer.\\ In Perl, that\
    \ honors to the predefined variable $_ In addition to being a handy temporary\
    \ value, this is used as the default for many of Perl’s functions and statements.\n\
    \nFor example, if no variable is supplied in the foreach statement, $_ is implied.\
    \ For example, the following two statements are equivalent:\n\n```\nforeach $_\
    \ (@array)\nforeach (@array)\n```"
