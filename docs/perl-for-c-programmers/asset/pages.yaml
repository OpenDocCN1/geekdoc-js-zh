  md: '# OPTIONS


    Next you need to document the list of options. A list in POD starts with the following
    directive:


    ```

    =over 4

    ```


    The number 4 is the number of spaces to be used for indenting the list. Each item
    in the list is identified by an item directive:


    ```

    =item <text>

    ```


    Finally, the list is ended with the following directive:


    ```

    =back

    ```


    The option list looks like this:


    ```

    =head1 OPTIONS

    ```


    The I-us2hk command takes the following arguments:


    ```

    =over 4

    ```


    ```

    =item B<-u

    ```


    Convert from US$ to HK$. The default is HK$-E<gt>US$.


    ```

    =item B<-r=><rate>

    ```


    Specify the conversion rate for US$ to HK$ instead of the default: 0.128. (1:8)


    ```

    =back

    ```


    This example has a problem with the explanation of the -u option. You want to
    say “The default is HK$->US$.” But the greater than (>) is a special character,
    and you cannot put it in the text. So you must use the escape code: E<character>,
    which enables you to put special characters in the text.


    Table 10.1 POD Escape Characters


    | Escape Character | Character Escaped |

    |---|---|

    | E<lt> | < |

    | E<gt> | > |

    | E<sol> | / |

    | E<verb> | | |

    | E<nnn> | Character whose decimal number is nnn |'
