  md: "# 144 Chapter 7 Subroutines and Modules\n\nListing 7.4 Continued\n\n```\nEND\
    \ {\n  print \"END\\n\";\n}\n\nprint \"Module\\n\";\n\nBEGIN {\n  print \"BEGIN\\\
    n\";\n}\n;\n```\n\nWhen you load this module with a use begin_mod statement, the\
    \ program prints the following:\n\nBEGIN\nModule\n\nAfter the program finishes,\
