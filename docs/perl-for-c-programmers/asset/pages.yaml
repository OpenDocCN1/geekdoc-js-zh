    \ Naturally, this tag is called 'highlight', and it is created with the code\n\
    \n```\n$text_box->tagConfigure('highlight', background => 'yellow');\n```\n\n\
    In this example, $text_box is a text widget. The tagConfigure function is used\
    \ to create or change a tag. The name of the tag is 'highlight'. We could have\
    \ chosen any name for this tag, but 'highlight' seemed to be the easiest to"
