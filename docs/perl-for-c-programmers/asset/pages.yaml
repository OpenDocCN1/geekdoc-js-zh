    # Creating a Package File


    By convention, Perl programmers put each package in a file of its own. For example,
    the package call would be placed in the file call.pm. For reasons that will be
    explained later, the file must end with the statement",


    +   1;


    If the module or the package is in the current or Perl directory, you can use
    it by putting the following line in your program:

    use call;


    # Providing an External Interface


    A module is divided into two parts: a public interface that describes the functions
    and data to be provided (.hn file) and a private implementation section (.c file).

    In Perl, both parts are contained in a single file. So far, you have seen how
    to create functions and data. To create a public interface, you will have to use
    the Exporter module.


    Suppose that you want to write a module that reads in a bunch of numbers and lets
    the user compute a moving average on them:


    ```

    read_data($file);          # Read the file

    my @raw_data;             # Array containing the stock data

    @result = moving_average($Elements);

    # Return a moving average

    # that spans $Elements array elements.

    ```


    The module starts with the usual package:


    ```

    package average;

    ```


    You now need to define the interface. This starts with a statement to bring in
    the Exporter module:


    ```

    require Exporter;

    use vars qw(@ISA EXPORT);\ISA = qw(Exporter);

    ```'
