  md: "# 134 Chapter 7 Subroutines and Modules\n\n```\nsum_slice_ref(1, 3, @array);\
    \ # Legal\nsum_slice_ref(1, 3, @start, @middle, @end); # Illegal\n```\n\nOn the\
    \ other hand, when you use the @ parameter specifier, Perl takes all the leftover\
    \ parameters and stuffs them into one array. Thus the following are legal:\n\n\
    ```\nsum_slice_array(1, 3, @array); # Legal\nsum_slice_array(1, 3, @start, @middle,\
    \ @end); # Illegal\n```\n\nThe code generated for that call looks like\n@ = (1,\
    \ 3, @start, @middle, @end)\n-- call to slice_array\n\nThe % specification works\
    \ similarly. You can use it to specify a hash of a parameter specification. In\
    \ this case, Perl converts the hash into an array (@), but you can convert it\
    \ back again at the beginning of your function.\n\n# Variable-Length Parameter\
    \ Lists\n\nSuppose you want a function that takes an optional third parameter.\
    \ Can you do this by using the ; to separate the mandatory from the optional parameters:\n\
    \n```\nsub draw_rectangle($$$) {\n  my $width = shift; # Mandatory\n  my $height\
    \ = shift; # Mandatory\n  my $color = shift; # Optional\n```\n\nThis can be called\
    \ as\n\n```\ndraw_rectangle(10, 20, \"green\");\n```\n\nor\n\n```\ndraw_rectangle(40,\
    \ 86);\n```\n\nBut how can you tell whether the subroutine was called with the\
    \ optional parameter? The answer is if the optional parameter is missing, it gets\
    \ the value undef. For example, suppose you want a default color to be black,\
    \ which will be used if the color's not specified. You write\n\n```\nif (not defined($color))\
    \ {\n  $color = \"black\"\n}\n```\n\nNote that all parameters after the semicolon\
    \ are optional. Thus the function\nsub compute_sum($$$);\n\ncan 1, 2, 3, or 4\
    \ parameters. (But 5 not)"
