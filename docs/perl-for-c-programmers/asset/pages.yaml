  md: "# The Special File <>\n\nThe UNIX cat command takes a list of files as its\
    \ arguments:\n\n```\ncat [file] [file] [...]\n```\n\nIt goes through each file\
    \ in order and sends them to the standard out.\nIf no file is specified, it copies\
    \ standard to out.\n\nThe cat command is like many other UNIX commands, such as\
    \ sort, grep,\n uniq, which take a list of files as their arguments. If no files\
    \ are specified,\nt operate on standard.\n\nThis type of program is so common\
    \ that Perl has a special file <> to facilitate the construction of programs like\
    \ this.\nThe <- file is defined as follows:\n\n+   - If there are arguments @ARGV,\
    \ <> treats each argument as a filename and reads them in order.\n- @ARGV is empty,\
    \ <> reads standard in.\n\nListing 5.2 contains the Perl version of the cat command.\n\
    \n```\nListing 5.2 cat.pl\n\\use strict;\nuse warnings;\n\nmy $line; # Current\
    \ input line\nwhile ($line = <>) {\n    print $line;\n}\n```\n\nThat's all there\
    \ is to it. If you run the program\n$ perl cat.pl file1.txt file2.txt\nThe program\
    \ will read and print all the lines in file1.txt and then go to\nfile2.txt and\
    \ read and print all the lines in that file as well.\nIf you run the program\n\
    $ perl cat.pl\n\nthen the script reads from standard (in this case the keyboard)\
    \ and writes\nanything it sees to standard out. In other words, what you type\
    \ gets typed\nright at you.\n\n# Getting the Name of the Current File\n\nThe name\
    \ of the file currently being processed by the <> file is contained in the variable\
    \ ARGV."
