  md: 'print_it(STDOUT);


    You must use a module because Perl treats file handles differently from other
    variables. When you specify STDOUT in the parameter, Perl treats this parameter
    as a bare word and passes the string STDOUT to the subroutine.


    The qualify_to_ref function takes a typed this string and converts it into a reference
    to the file handle.


    Actually, you don''t get a reference to a file handle; rather, you get a type-glob
    to the file handle. This is discussed in more detail in the next section.


    # References to a File Handle


    You can''t take a reference to a file handle—at least not directly. However, you
    can use a trick called a typeglob to do virtually the same thing. The syntax is


    ```

    my $ref = \*FILE_HANDLE;

    ```


    You can now use $ref as a file handle, for example:


    ```

    my $ref = \*STDOUT;

    print $ref "Hello World";

    ```


    How is a typeglob different from a normal reference? The answer is the statement


    ```

    my $ref = \*FO0;

    ```


    makes $ref a sort of reference for all variables, no matter what type, whose name
    is FO0. This statement also assigns %ref the value of %FO0, $$ref is the same
    as $FO0, @@ref gets @FO0, and finally &&() is &&ref.


    The typeglob was an early method for creating references before real references
    were put in the language. Although it has been made obsolete by better references,
    in most cases, it is still useful when it comes to file handle references.


