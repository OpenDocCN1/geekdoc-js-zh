  md: '# 194 Chapter 12 CGI Programming


    The survey page is actually a CGI form. This example assumes that you are familiar
    with basic HTML, but you may not be familiar with CGI forms.

    The page starts with the following itens:


    ```

    <HEAD><TITLE>Survey</TITLE></HEAD>

    <BODY>

    <CENTER><H1>Please fill in our survey</H1></CENTER>

    ```


    Next, you deal with the special form-related tags.


    # FORM Statement


    Now that you''ve taken care of the bookkeeping, you need to specify what you want
    from the server. This is done through the use of a form.

    The form starts with the line


    ```

    <FORM ACTION="http://www.webserver.com/cgi-bin/record.pl" METHOD="POST">

    ```


    This line uses an absolute address (one starting with http) for the CGI field.
    You could have used a relative address as:

    <FORM ACTION="/cgi-bin/record.pl" METHOD="POST">


    Relative URLs are system independent. Using them means that you can move your
    form from system to system and the URL still refers to the local system. This
    means that you need to keep the CGI script as well.\ FORM tag indicates that this
    is the beginning of a form. The button tells the web browser to use the URL when
    the form is submitted.

    Finally the METHOD tells the browser how to encode the data in the form. Two possible
    methods are "GET" and "POST". In the "GET" method, the form''s information is
    encoded as part of the URL. For example, if you''ve seen a URL that looked something
    like


    ```

    http://www.webserver.com/cgi-bin/record.pl?name=sam

    ```


    you''ve seen when using POST, sends use the GET method.

    The other method, GET sends the data in the HTTP header that sent to the browser
    to run the program and get the next page.

    The advantage of the GET method is that the form''s data is contained in the URL,
    you can bookmark the submitted URL. This makes useful for things such as web search
    engines or stock quotes where you might want to bookmark the page after submitting
    the form.

    For example, the page http://quote.yahoo.com/?q=rhat&d=v1 shows the current Redhat
    stock generated by one of Yahoo''s CGI programs.

    However, if you don''t want your information exposed at the top of the screen,
    there is also a 1024 character limit on the data that can be sent by a GET method,
    so for large forms, you must use a POST.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'Because the data sent by the GET method is part of the URL, it''s visible to
    the user. (It''s also recorded in the web server''s logs.) Having visible data
    is useful for debugging, but you don''t want to use it for secure data such as
    passwords or credit card numbers.

    Also because the GET is really an enhanced URL, you can bookmark a GET form. You
    can''t do this with a POST because the data disappears when you leave the page.


    # Text Blanks


    You now need to tell the browser what data you want to get from the user. The
    first thing is the user''s name. The code for this is


    ```

    <P>

    Name:

    <INPUT TYPE="text" NAME="name" SIZE="30">

    ```


    The <INPUT> directive tells the browser to ask the user for information. The TYPE
    attribute tells the browser what type of information is wanted. In this case,
    it''s a single line of text (TYPE="text")

    The NAME attribute is used to give this blank name, and the SIZE specifies how
    big a blank to make.


    # Option List


    You want to know what group you belongs to. He can be in Software, Marketing,
    or Support. To get this information, put an option list in the page:


    ```

    <SELECT NAME="group" SIZE=1>

    <OPTION>Software</OPTION>

    <OPTION>Marketing</OPTION>

    <OPTION>Support</OPTION>

    </SELECT>

    ```


    The <SELECT> tag encloses a list of options. Each option in the list is put inside
    an <OPTION> tag.


    # Check Boxes


    The next two items in the form are the <INPUT> tag to specify these:

    You need to return to them


    ```

    <INPUT TYPE="checkbox" NAME="work" VALUE="1" CHECKED>

    Full time employee</INPUT>

    <BR>

    <INPUT TYPE="checkbox" NAME="intern" VALUE="1">

    Currently a member of an intern program</INPUT>

    ```'
  merge: -1
