    # # C Beyond Perl


    PERL IS AN EXCELLENT LANGUAGE FOR WRITING many applications. This appendix discusses
    some of the more useful ones that you can download from the net. These include
    programs to do web searching, code browsing, and E-Commerce.


    Many helper programs also are available that can work with Perl to create a powerful
    programming environment. These include databases and text indexing tools.


    This combination of Perl and helper programs can produce a system that makes it
    possible to write programs quickly, with flexibility, and yet create something
    that is also powerful and useful.


    # ## Databases


    Perl comes with some database modules. These are limited and whimpy. If you''re
    going to handle only a couple thousand records of limited size, they''re okay,
    but what if you have to deal with millions of records and complex data?'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'You need a high-quality, fast database. The two major open source ones that
    are available are MySQL and PostgreSQL. Both are free.


    Now, to the question of which one is better: Because both provide the same basic
    set of features, it''s a matter of taste or technology. In general, most people
    make their choice based on two factors:


    +   - They choose the database required for the other programs they install. In
    other words, if they install an E-Commerce application that was tested on MySQL,
    that''s what they install.

    - They install the program they know. (You can always write a program in a language
    you know much faster than in a language you don''t, even if the new language is
    technically superior.)


    You may notice that these two factors do not depend on the technical merits of
    the database itself. Sometimes the real world truths technology.


    MySQL is available from http://www.mysql.com/.\PostgreSQL can be obtained from
    http://www.postgresql.org/


    # Tools for C/C++ Programmers


    Perl is an ideal language for writing tools for handling large-scale C or C++
    programs. It easily lets you analyze large amounts of text and create reports.
    This section presents two of the most popular tools that are useful for large
    programming projects.These are LXR, the Linux cross-referencer, and Bugzilla,
    a bug-tracking system.


    # Linux Cross-Reference (C Source Cross Reference)


    The Linux cross-reference project is a web site that produces a cross-reference
    of the Linux kernel source. This tool lets you browse through the kernel source
    (see Figure C.1).'
  merge: -1
