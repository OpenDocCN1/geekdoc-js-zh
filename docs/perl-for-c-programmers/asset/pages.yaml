    # # Subroutines and Modules


    YOU NOW KNOW ENOUGH PERL TO BE able to write a moderately complex program. At
    this point, you need to start organizing your code into subroutines. Perl lets
    you put a collection of subroutines together into *packages*. A package designed
    to hold reusable code is called a *module*.


    In this chapter, you''ll learn how to produce modules as well as how to create
    your own module library.


    # ## Subroutines


    Suppose that you want to write a subroutine to compute the difference between
    two time values. Start your subroutine definition like this:


    ```

    sub timeddiff($) {

    ```


    The sub keyword signals the start of a subroutine. In this case, the subroutine
    is named *timeddiff*. The function takes two scalar parameters. This is indicated
    by the parameter list ($).


    The method Perl uses to pass parameters is unique: passing by special variables.
    When a function is called, Perl assigns the parameters to the array `@_`. You
    now need to get the parameters out of the `@_` array and into something you use.'
