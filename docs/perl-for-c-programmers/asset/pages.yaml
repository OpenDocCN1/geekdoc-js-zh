    # Summary


    As I noted in the beginning, one of the great things about Perl is its extensive
    module library. You have now seen why the library is so extensive. It is not that
    difficult to create your own modules. As we saw, Perl provides all the tools you
    need to create them. You should be able do so without any great difficulty.


    # Exercises


    +   Write a module that generates a frequency count of the letters in a string
    (number of A''s, B''s, C''s, and so on). The function should return a 256-element
    array whose index is the character appears and whose elements are the number of
    times that character appears in the string.


    +   Write a module that computes a frequency count of the pairs of letters in
    a string. Because returning a 256x256 element array is difficult in Perl, you''ll
    have to create some access functions that the application can query the counts
    after you compute them.


    +   Create a module to extract any number of bits from a scalar starting at any
    offset. For example, the function may be asked to return 5 bits in the string
    starting at bit index 27.


    +   Write a module that gives a Perl program direct access to the I/O operations
    (in and out on the PC class machines).


    +   Create a module that allows reading and writing of random bytes in a file.
    In other words, you can tell this module, "change byte 56 of the file to the letter
    ''Q''."'
