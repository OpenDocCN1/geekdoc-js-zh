  md: '# Basic Regular Expressions 79


    The new regular expression looks like


    ```

    # Match start of line

    # Match all except # or"

    # Repeat 0 or more times (*)

    # Match either pattern (!)

    # Match *

    # Any character (.)

    # Repeat 0 or more times (*)

    # Group the following and

    # put into $2

    # Repeated 0 or more times (*)

    # Put the encoded in $1

    # The character hash (#)

    # Any character (.)

    # Repeat 0 or more times (*)

    # Put the enclosed in $3

    if ($line == /\(([:#]*).*\)/)

    ```


    You have to use the grouping operators ( ) to get the expression to work.

    But that causes you to put the statement in $1 and the comment part in $3.

    You want it in $2, so you have to tell Perl "group these, but don''t put the

    result in $<number>variable"; You do that by changing the grouping operator

    (...) to (?:).\The result is


    ```

    if ($line == /\((?:[:#]*).*\)/)

    ```


    But there''s still a problem. What happens when you see a line like

    MACRO = "String" # "String" used


    The regular expression ..* tries to match as much as possible. The result is

    that it matches


    ```

    MACRO = "String" # "String" used

    ```


    You want to match only the first part. A solution to this is to follow the star

    (*) with a question mark (?). The question mark tells Perl to match as little
    as

    possible. So the revised expression is


    ```

    # Match any character (.)

    # repeat 0 or more times (*)

    # as little as possible)

    # Match quote (")

    if ($line == /\((?:[:#]*).*?")\)/)

    ```


    This change tells Perl the string stops when the first double quote (*) is seen.'
