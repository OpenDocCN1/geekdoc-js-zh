  md: 'Finally, now is a good time to take a break and depressurize. You''ve probably
    never had such a concentrated session of powerful and cryptic syntax thrown at
    you at one time. Take a break, let the concepts settle in a little, and continue
    after a cup of coffee.


    # Substitutions


    At one job site I worked, I encountered a number of problems caused by improperly
    formatted Makefiles. The problems were caused by


    +   - Lines that began with eight spaces rather than a tab—The make program is
    picky about this and insists on a tab.

    - Lines that ended in a continuation character (\ followed by whitespace—This
    means that although the line looked like it was continued, it wasn''t.


    To get things working, I turned to Perl to solve the problem by writing a Makefile
    fixing script.

    The script read the Makefile one line at time and wrote out a corrected Makefile.
    I then used the Perl s:///tag> operator to perform a substitute edit on the line.

    The general form of it is


    ```

    $line = s/<>/<new>;

    ```


    where <old> is the text to replace, <new> is what to replace it with, and <flags>
    are flags flagging the replacement. One of the common flags is g, which tells
    Perl to perform the replacement as many times as possible. (The default is to
    replace only once). Another common flag is i, which tells Perl to ignore case
    when performing the match.

    To correct a line that begins with eight spaces, use the command


    ```

    $line -- s/ //

    ```


    Note that if the line does not begin with eight spaces, it remains unchanged.
    In this expression, the ^ anchors the expression to the beginning of the line.
    To correct the other problem, (whitespace after a continuation character), you
    need the following command:


    ```

    # Change

    # +++ The character backslash

    # |+++ Any whitespace character (\s)

    # |+ Repeat one or more times

    # | to

    # |++ The character backslash

    $line =~ s=\s+//;

    ```'
