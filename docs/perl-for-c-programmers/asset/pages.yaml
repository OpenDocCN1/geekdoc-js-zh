  md: '# Using the Autoloader


    It is possible to generate code with the autoload feature turned on by omitting
    the -A flag when running h2xs.


    By default, the module contains just the function mt_op. If you turn on the autoload
    feature, it will contain not only the function but all the constant definitions
    (MTREW, MTFSF, and so on).


    The code generated also will be more complex.


    # Module Creation Cookbook


    The steps to create a simple module can be summarized as follows:


    +   1. Run h2xs to create the module directory:

    h2xs -n mt_op


    +   2. Copy the header files into the directory you created:

    cp mt_op.h mt_op


    +   3. Run h2xs again, to create the prototype module files:

    h2xs -OXn mt_op mt_op.h


    +   4. If you require anything special in your build environment, edit the file

    Makefile.PL.


    +   5. Edit the README file and put in proper documentation on how to build\and
    install the module.


    +   6. Edit the module file (.pm file) so that the POD section documents your

    module.


    +   7. Edit the module file (.pm file) and put the names of the functions you\want
    to export by default in the @EXPORT list.


    +   8. Edit the external subroutine (.xs file) and put in your code.


    +   9. Edit the typedefmap (For most programs, this means removing all the

    entries in this file.)


    +   10. Create the Makefile with the command

    perl Makefile.PL


    +   11. Compile the program with the command

    make


    +   12. Run the basic self-test with the command

    make test'
