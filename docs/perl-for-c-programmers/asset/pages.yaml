  md: "# Using the Perl Debugger\n\nOne of the more useful tools when it comes to\
    \ exploring a language is the debugger. This tool allows you to see real-world\
    \ programs in action and examine what they are doing.\n\nFirst you need a Perl\
    \ script. Listing 1.1 shows a program that computes the average grade for a list\
    \ of students.\n\nListing 1.1 ave.pl (Line numbers added)\n\n```\nuse strict;\n\
    use warnings;\nwhile <DATA>\n{\n    if (/^/)\n        next;\n    }\nmy $grades\
    \ = split /[\\t]+, $;\nmy $name = shift $grades;\nmy $save = ($grades[0] + $grades[2])\
    \ / 3;\n    print \"Student $name Average $save\\n\";\n}\n__DATA_\n# Student Grade\
    \ Grade Grade\noualline 98 95 92\nsmith 75 84 99\njones 45 26 55\n```\n\nSpelling\
    \ _DATA_ is spelled \"<Underscore><Underscore>DATA<Underscore><Underscore><Underscore>\"\
    \ this spelling is not obvious in typeset.\n\n# Leave Out warning Statement\n\n\
    If you get the error\n\nCan't locate warnings.pm at . . . you have an old version\
    \ of Perl that predates version 5.6.0. In that case, you can leave out the line\
    \ use warnings;\n\nThis statement turns on runtime warnings in your program. If\
    \ it's left out, your program will still run, but you won't get any warnings when\
    \ something stupid happens."
