  md: '# Chapter 4 Regular Expressions


    Although this matches "the" or "The", it does not match "THE". For that

    you need [tT][hH][eE]. (Yuck!)


    Also you can specify a range of characters. [a-z] matches any

    single lowercase letter.


    Now you''ll design a regular expression to see whether a variable contains

    anumber. A number consists of one or more digits. Breaking things down

    to components, your regular expression is


    +   - ^Match the start of the line (that way the regular expression won''t skip

    junk at the beginning of the line).

    - [0-9]-Match a single digit.

    - [0-9]*-Zero or more additional digits.

    - $-Match the end of the string. (The number can''t have any trailing

    garbage.)


    The regular expression is /^[0-9][0-9]*$/

    So this matches like


    ```

    0

    14

    568

    333

    000

    0524

    ```


    but does not match


    ```

    x45 # Does not begin with a digit

    45x # Last digit is not at end of line

    x4545 # Letter in the middle breaks the string of digits.

    ```


    The modifier + acts like the *, only it tells Perl to repeat the previous atom

    or more times. Thus with a +, your new regular expression is /^[0-9]+$/.


    # Whitespace (\)


    Back to the comment matching statement—you need to make one final

    change. Currently, the expression \[t] matches whitespace. It''s simpler and\easier
    to use escape \s instead. This is a special regular expression atom

    that matches one whitespace character. So your final comment matching

    looks like the following:


    ```

    # +----- Beginning of line (^)

    # +++++ Match whitespace

    # !++++ Repeated 0 or more times

    # !!!!+---- The character #

    if ($line =~ /\s**/)

    ```'
