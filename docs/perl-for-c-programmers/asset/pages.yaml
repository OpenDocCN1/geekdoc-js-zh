  md: "# 166 Chapter 9 Advanced I/O\n\nAll represent the same bit pattern. So how's\
    \ unpack going to know which representation you want to use? The answer is that\
    \ unpack uses a TEMPLATE parameter to decide how to unpack the value.\n\nThe general\
    \ form of the function is @result = unpack TEMPLATE, $buffer;\n\nA in the template\
    \ indicates a binary number, an H indicates a hex one, and so on. (See perldoc\
    \ -f pack for a list of template characters. Yes, that's pack, not unpack, for\
    \ a list of the buffer with the unpack template characters.)\n\nYou want to decode\
    \ the buffer as a series of two-digit numbers, so use the template \"H2\". Because\
    \ you want eight values out of the buffer, you need to repeat this specification\
    \ eight times. The unpack function calls like\n\nmy $hex = unpack(\"H2\" x 8,\
    \ $buffer);\n\nYou also want to print a character representation of the data.\
    \ For that, you need to split the buffer into characters. Again, use the unpack\
    \ function and template \"a1\" (ASCII character; 1-one at a time).\n\nmy $char\
    \ = unpack(\"a1\" x 8, $buffer);\n\nThe rest of the program is devoted to changing\
    \ any special characters in the @char array to \".\" and printing the results.\
    \ Listing 9.1 shows the full program.\n\n+   Listing 9.1 dump.pl\n\n```\nuse strict;\n\
    use warnings;\n\nopen IN_FILE, \"<\\ARGV[0]\" or\ndie(\"Could not open \\$ARGV[0]\"\
    );\n\nbinmode(IN_FILE);\nwhile (1) {\n    $buffer;\n    my $read_size = read(IN_FILE,\
    \ $buffer, 8);\n\n    if (\\$read_size < 8) {\n        last;\n    }\n\n    my\
    \ $hex = unpack(\"H2\" x 8, $buffer);\n    my $char = unpack(\"a1\" x 8, $buffer);\n\
    \n    foreach my $ch (@char) {\n        if ($ch lt ' ') || ($ch gt \"-\") {\n\
    \            $ch = \".\";\n        }\n    }\n```"
