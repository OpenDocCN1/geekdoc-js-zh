  md: '# Exercises


    +   1. Write a script to take a list of names in the format

    last, first


    and write it out as

    last first


    +   2. Write a script that searches a file for lines that contain an error message.

    You can assume that all error messages begin with the string "Error".


    +   3. The last line of a typical United States postal address is of the form

    City, State zip


    Note that the state can be a two-letter abbreviation, or a full name.

    The ZIP Code can be nine digits or ZIP+4 (that is, 92126–1234).


    Write a program that splits these fields and prints them individually.


    +   4. A bug reporting system contains a status log line. The status log line
    contains an entry for each change made to the bug report. A typical entry looks
    like


    > OPENED by sdo on 19-Aug-00, VERIFIED by khoun on 30-Aug-00,

    --ASSIGNED by fred on 31-Aug-00, FIXED by arun on 01-Sep-00,

    --TESTED by james on 01-Sep-00, CLOSED by cknard on 02-Sep-00


    Note that this is all one big, ugly line.

    Although this entry contains every possible status, some bugs may contain fewer
    entries. For example:


    OPENED by sdo on 19-Aug-00


    Write a program that goes through a status log and determines whether any entries
    have been CLOSED without being TEST.

    Bonus: Download one of the date parsing modules from CPAN and use it to determine
    the number of days between the time a report is opened until the time it is closed.


    +   5. (UNIX/Linux only): Write a program that reads the file /etc/password into
    an array. It then lets the user type in a username and displays the full name
    for that user.'
