- img_proc: true
  md: 'Don''t assume that filenames contain only legal characters. For example, suppose
    that your script is designed to fetch any file in the tree /home/status/data,
    and you write this as

    chdir(''/home/status/data'');

    open IN_FILE,"$user_supplied_file_name";


    The filename supplied by the user can look like something simple (status.txt)
    or something designed to get data it shouldn''t (../etc/passwd). In the second
    case, file specification gives the user access to the system password file. This
    is useful to a hacker.

    The Code Red worm uses a variation of this trick to break into Microsoft IIS servers.
    The server checked for something as simple as .., but there are ways of hiding
    this path using Unicode, which the worm exploited.

    Another mistake is to assume that an input field has not been altered by the user.
    Remember that users can write their own web pages and point them to your CGI program.
    A couple of online stores found about this problem the hard way. The stores put
    the price of an item in a hidden field called PRICE in their generated web pages.
    The hackers came along and saw the line


    ```

    <INPUT TYPE="hidden" NAME="price" VALUE="298.99">

    ```


    and did a minor edit before submitting the form to the store:


    ```

    <INPUT TYPE="hidden" NAME="price" VALUE="2.99">

    ```


    Needless to say, they were getting the digital cameras ever so cheap.


    # Cookies


    One problem with using CGI programs is that each run is done in isolation. It''s
    difficult to carry information from one run to the next.


    One solution to this is to use INPUT tags. Another cookie is a named string that
    the server sends the browser. The browser can then send it back upon request.


    Say that you want to send a cookie to the browser. You first need the CGI::Thin::Cookies
    module. (This was installed when you installed CGI::Thin.) You then use it to
    send a cookie using the Set_Cookie function:


    ```

    use CGI::Thin::Cookies;

    ...

    Set_Cookie(

    NAME => "Username",nVALUE => \$user,

    EXPIRES => "+14d"

    );

    ```'
