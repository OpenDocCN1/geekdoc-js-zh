  md: 'If you are using the X Windows system, you can perform some tricks to connect
    the debugger to your display.The first step is to find out what the name of your
    display is.This is done through the command


    ```

    echo DISPLAY

    :0.0

    ```


    This example uses the display :0.0. The next step is to create a shell script
    that starts the debugger on the specified window.


    If you are starting the pdbdb debugger, the script is shown in Listing 12.5.


    Listing 12.5 record.ptkb


    ```

    #1/bin/sh

    DISPLAY=:0.0

    export DISPLAY perl -Wtd record.pl "$*"

    ```


    The first line is a magic line that tells the system that this is a shell (sh)
    script.

    The next two lines tell the system which display to use. Finally, the real program
    is executed using the debugger.

    The script must be placed in the CGI directory and make executable.

    Next, create a web form that calls the debugger wrapper (record.ptkb) rather than
    the real script (record.p1).


    Finally, you need to tell the X Windows system that you are going to connect to
    a CGI program and that it''s okay to accept connections from the web server. This
    is done with the command


    ```

    xhost +

    ```


    Now when you submit the debugging form, the script record.ptkd runs. (:0.0 in
    this example) and then starts the debugger on your script.


    To summarize, the steps in doing a server debug be


    +   1. Find out what display you are running (echo DISPLAY)

    2. Create a wrapper that sets the display and starts the debugger.

    3. Put the wrapper in the CGI directory.

    4. Create a form that calls the wrapper.

    5. Enable connections to your display from another system (xhost +).

    6. Run your debugging form.


    You can use almost the same technique to debug the program using the command-line
    debugger. In this case, use the xterm program to create a new window for debugging.
    Listing 12.6 shows how this is done.'
