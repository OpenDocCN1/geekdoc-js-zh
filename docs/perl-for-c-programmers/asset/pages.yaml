  md: "# 268 Chapter 15 Putting It All Together\n\n![](img/59544d13b3df863dfcb334297c75b37e_285_0.png)\n\
    \nFigure 15.2 The pop-up window that appears when you click Add.\n\nThe code for\
    \ this can be seen in the function add_modify in Listing 15.6. (It's called add_modify\
    \ because it also displays the pop-up merry as well.)\n\nThis function uses a\
    \ widget called the LabEntry to display the description of the disk. This widget\
    \ is quite unusual in that it's not documented in the Tk documentation. But there\
    \ are still ways to figure out what it does. The first is to see whether any demonstration\
    \ programs use it. You can do this by looking through the files installed in Tk/demos.\
    \ You'll find the Tk directory under the Perl directory.\n\nLooking through the\
    \ demonstration tells you that the notebook.pl demonstration contains a number\
    \ of examples telling you how to use the widget.\n\nAnother way of finding out\
    \ about the widget is to take a look at the source code for the module (LabEntry.pm)\
    \ itself.\n\nIf you want a shortcut, the module is documented here. The widget\
    \ consists of a Tk::Frame, which contains a Tk::Label and Tk::Entry object. You\
    \ can use any additional option -labelPack specifies the arguments sent to pack\
    \ any options for the widget that are allowed for a normal Label or Entry. One\
    \ additional option -labelPack specifies the arguments sent to pack any options\
    \ for the widget that are allowed for a normal Label or Entry. When you want the\
    \ Label subwidget to be packed on the left-hand side, then you need -labelPack\
    \ =>[-side => \"left\"]. If you want to stick it to the left, you also need -anchor\
    \ => \"w\".\n\nTo create a LabEntry to enter your weight, the code\n\n```\n$tk_popup->(\n\
    \  -label => \"Description\",\n  -textvariable => [-side => 'left']\n)->(\n  -side\
    \ => 'top',\n  -expand => 1,\n  -fill => 'x'\n);\n```\n\nThe rest of the logic\
    \ is straightforward. Most of the code is bogged down with the details of creating\
    \ the GUI and responding to buttons."
