- img_proc: true
  md: '# 196 Chapter 12 CGI Programming


    The first check box is named "work", and a value of 1 is returned if it''s set.

    CHECKED attributed tells the browser that this check box is initially checked.

    The second box has no such attributes, so by default it will be unchecked.


    # Radio Buttons


    Just below the two check boxes is a series of three radio buttons.

    The code for this is


    ```

    <P>

    <BR>

    <INPUT TYPE="radio" NAME="schedule" VALUE="early">Early</INPUT>

    <INPUT TYPE="radio" NAME="schedule" VALUE="on">Time</INPUT>

    <INPUT TYPE="radio" NAME="schedule" VALUE="late">Late</INPUT>

    ```


    The TYPE attribute is "radio" to create radio buttons. All the buttons in a set
    have the same name. In this case, it''s "schedule".

    The VALUE is used by the system to tell the CGI program which button is selected.

    Because no radio button has the attribute CHECKED, no button will be selected
    by default.


    # Text Areas


    This form starts with the "Name" blank. This blank allowed you to type in a single
    line. Now you want to let the user type in comments. This is a multi line blank.


    The code for this is

    <TEXTAREA NAME="comments" COLS="35" ROWS="4*>

    Replace this with your comments.

    </TEXTAREA>


    The <TEXTAREA> directive begins a text box. The NAME attribute tells the user
    what identifier to use for the blank. The attributes COLS and ROWS specify the
    width and height of the box.

    The initial text for the box appears between the <TEXTAREA> and the </TEXTAREA>
    directives.


    # Hidden Input


    Now you come to a section that doesn''t appear on the form. That''s for the hidden
    input. This type of INPUT directive lets you embed information in the form that
    the user doesn''t see. This example uses it to embed a version number into the
    form.'
