    # External Link Checking


    During the file processing, you stored away list of external links (@external_links).
    To check whether these are valid, you must go through them and use LWP::Simple
    module to check the links.

    Actually, what you try to use is the head function out of this module to retrieve
    the header. If the header exists, then the link is:


    ```

    181 print "Broken External Links\n";

