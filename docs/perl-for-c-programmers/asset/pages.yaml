    # Dynamic Web Page Graphs


    It would be nice to access this graph from the web. Better still, would be nice
    to have the system produce to-the-second results. This can be done using a simple
    CGI program that runs the graph routine and then displays the results:


    ```

    1 #!/usr/local/bin/perl

    2 use strict;

    3 use warnings;

    4

    5 system("cd /home/httpd/html/web;/usr/local/bin/perl /home/httpd/cgi-bin/web-graph.pl
    /var/log/httpd/access*");

    6

    7 print <<EOF

    8 Content-type: text/html

    9

    10 <HEAD><TITLE>Web Hits</TITLE></HEAD>

    11 <BODY COLOR="#FFFFFF">

    12 <IMG SRC="/web/top_web.png">

    13 EOF

    ```'
