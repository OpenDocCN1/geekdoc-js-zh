    Writing mt_op/test.pl

    Writing mt_op/Changes

    Writing mt_op/MANIFEST


    (Be careful with the order of the flags. -nA works does not.)

    The program h2xs is the Perl utility used to create modules from header files.
    The -n flag tells the program that this program is called mt_op. The -A flag tells
    Perl to omit the autoloader flag. (This makes things simpler, and is simple good
