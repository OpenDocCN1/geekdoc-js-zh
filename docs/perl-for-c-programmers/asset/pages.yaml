  md: 'If you do decide to make things compact, please put it in a few comments so
    that anyone maintaining your code can understand what''s going on.


    # Perl''s Syntax Subtleties and the map Function


    Only read this sidebar if you are interested in the subtleties of the Perl syntax.


    The general form of the map function is


    ```

    map expression, array

    ```


    where expression is an expression repeated for each element of the array. In the
    preceding example, the expression is ($ => 1). So why the + before it?


    The problem is when Perl sees a function call, it expects a set of parameters
    to follow. These parameters might not be enclosed in parentheses. Thus the following
    two statements are equivalent:


    ```

    print "This is a ", "test\n";

    print (''This is a ", "test\n");

    ```


    The other problem is that Perl lets you use the comma (,) operator to string together
    two statements. For example:


    ```

    $i = 1, $j = 2;

    ```


    Consider the following statement:


    ```

    %power_users = map ($ => 1), @user_array;

    ```


    Does Perl treat this as a function call with two parameters or statements joined
    by the comma operator? The two statements would be a function call with one parameter:


    ```

    map ($ => 1)

    ```


    and an array:


    ```

    @user_array

    ```


    The rule Perl follows is if the first character after a function is an open parenthesis,
    a parameter list follows. That means Perl treats the first item ($ => 1) as the
    entire parameter list to the map function.


    To fool Perl into thinking that map has two parameters, you need to add a unary
    (+) in front of the expression. The unary plus does nothing to the expression,
    but it does cause Perl to parse this statement as a function call with two parameters:


    ```

    %power_users = map +($ => 1), @user_array;

    ```


    Perl is full of interesting syntax subtleties like this. Fortunately, the programs
    in this book avoid most of them.'
