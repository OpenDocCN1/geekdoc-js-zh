  md: '# Variable Declarations and Simple Expressions


    You start your exploration of Perl by looking at simple, single-value variables.
    Next you use these variables in some basic expressions. Almost all the concepts
    discussed here have equivalents in C, so learning them should not be too difficult.


    # Variables


    Unlike most other languages, Perl doesn''t have different variable types. There
    is only one type of data in Perl: the string. Perl lets you use numbers, but as
    far as Perl is concerned what you really have is a string of digits. Want to deal
    with characters? Then you''re dealing with one-character strings. Want to handle
    binary? Then you''re dealing with a string of 1s and 0s.


    To declare a variable in Perl, use the directive:


    ```

    $size = 42; # The size of the box in inches

    ```


    Take a look at this statement. The statement begins with the keyword indicating
    a local variable declaration. You learn about global variables in Chapter 7, "Subroutines
    and Modules." The name of the variable is $size. The dollar sign ($) indicates
    that this is a scalar variable. In other words, it holds a single value.


    This statement initializes the variable to 42. Because Perl is a string-oriented
    language, this is actually a two-character string. In fact, you could have written
    the statement as


    ```

    $size = "42"; # The size of the box in inches

    ```


    Finally there is a comment. In Perl, comments begin with a hash mark (#) and continue
    to the end of the line.


    If you do not initialize a variable, it is assigned the special value undef. This
    value is different from the empty string (""). If you try to use an uninitialized
    variable for comparison, printing, or arithmetic, Perl issues a warning (of course
    the warning is only issued if turned on warnings with the warnings statement or
    the -w flag). For example:


    ```

    Use of uninitialized variable at <file> line <line>

    ```


    Now see how you can use variable declarations in a simple program. On the weekends,
    I''m a real engineer at the Pow-Midland Railroad. A co-worker asked me how much
    power the locomotive produced. Listing 2.2 is a Perl program that answers this
