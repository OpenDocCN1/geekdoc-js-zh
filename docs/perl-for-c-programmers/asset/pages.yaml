- img_proc: true
  md: '# Additional splice Arguments


    By default, splice deletes all the elements from the offset to the end of the
    array. The splice function allows you to supply an additional argument, length,
    which tells splice how many elements to delete:


    ```

    @new_array = splice @array, $offset, $length

    ```


    For example:


    ```

    my @array = (0, 1, 2, 3, 4, 5);

    slice(@array, 3, 2);

    print "@array\n"

    ```


    This example deletes two elements starting with the third element and prints "0
    1 2 5".


    Finally, splice lets you a set of elements to be inserted into the array at offset:


    ```

    @new_array = splice @array, $offset, $length, REPLACEMENTS

    ```


    (REPLACEMENTS) can be a list of scalars or an array expression.

    For example, replace one element of an array with a new value:


    ```

    my @array = (0, 1, 2, 3, 4, 5);

    slice(@array, 3, "sam", "joe", "mac");

    print "@array\n"

    ```


    This command goes element #3 (offset), deletes one element (length), and inserts
    three new elements ("sam", "joe", and "mac") before element #3. The result is


    ```

    0 1 sam joe mac 4 5

    ```


    This example uses three scalars as replacement elements. You could just have used
    an array or array expression:


    ```

    my @new_stuff = qw(sam joe max);

    slice(@array, 3, 0, @new_stuff);

    ```


    Figure 3.2 illustrates how the various forms of splice work.'
  merge: -1
