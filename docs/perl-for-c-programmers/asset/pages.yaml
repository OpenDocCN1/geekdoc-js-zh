    In the regular expression //, the # character is called an atom. It matches the
    character "#. Letters and digits are atoms that match themselves. For example,
    if you want to see whether a line contains the word "Error," you can use the statement


    ```

    if ($line =~ ~/Error/)

    ```


    Back to the comment eliminator—there''s a problem with the code. It matches any
    line that contains a # anywhere in the line.You want to match only lines that
    begin with the # character.


    So to check, you need to tell Perl that the # must appear at the beginning of
    the line. The ^ character is used to anchor a pattern at the beginning of a line.
    So /#/ means match # anywhere, and /^#/ means match # only if it occurs at the
    beginning of a line.


    So to check for a comment, you need the statement


    ```

    if ($line =~ /^#/)

    ```


    So this expression will match


    +   # This is a test

    but will not match

    SRC:cc.c

