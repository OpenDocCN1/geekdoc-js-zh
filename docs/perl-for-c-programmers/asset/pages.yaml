- img_proc: true
  md: '# Table 9.1 open Flags


    | Flag | Description |

    | --- | --- |

    | <file.txt | Open for reading |

    | >file.txt | Open for writing |

    | >>file.txt | Append to file |

    | ++file.txt | Open file for reading and writing |

    | ++file.txt | Create a new file for reading and writing |

    | command | Open a pipe from the Perl program to command (writing) |

    | command | Open a pipe from the command to the Perl program (reading) |


    # Using the Backtick ('') Operator


    The find example gives a lot of trouble just to read the output of a command and
    put it in an array. The backtick ('') operator does this in one operation. For
    example, you could write code as

    nmy @file_list = ''find /release/software-name *.c'' -print'';

    chomp(@file_list);


    The backtick operator ('') executes the command enclosed in the backticks and
    whatever the command prints. In the array context, it returns an array containing
    each line of the output. In the scalar context, it returns a string containing
    the entire output of the program. Lines are separated by newlines.


    # sysopen (Advanced open)


    The sysopen function gives you greater control over the opening of a file handle.
    The format of this function is similar to that of the C open function:


    ```

    sysopen FILEHANDLE,FILENAME,MODE [, ,PERMS];

    ```


    In this case, FILEHANDLE is the file to be opened. MODE is open mode. It can be
    0 for read, 1 for write, and 2 for read write; however, these values may not work
    on some operating systems as Macintosh.


    Or you can use the package Fcntl in the symbols O_RDONLY, O_WRONLY, and O_RDWR.
    This module provides all the flags available on your system. Other flags such
    as O_APPEND and 0_NONBLOCK are available as well.'
