  md: "# Turning POD into Something Readable\n\nThe POD file format is used as input\
    \ by several translators, which turn it into something you can read. One command\
    \ you're already familiar with is perdoc. It reads the POD documentation from\
    \ the command specified, formats it, and prints it on the screen.\n\nA number\
    \ of other POD-related commands format the text in a variety of ways. For example,\
    \ the pod2html program turns POD into HTML, which can be viewed by Netscape or\
    \ Internet Explorer. (Or imported into Microsoft Word so that it can be converted\
    \ to Quark Express to become a typeset in a book.)\n\nTable 10.2 lists the standard\
    \ POD converters.\n\n| Converter | Description |\n|---|---|\n| pod2html | Converts\
    \ to standard HTML |\n| pod2latex | Output is for the LaTeX text processor |\n\
