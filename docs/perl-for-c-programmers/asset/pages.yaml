  md: "# How Perl Handles Variables\n\nSuppose instead of using a static variable\
    \ for your bit array, you want to pass it a Perl scalar and let the program store\
    \ its data there. To do so, you need to know a little about how Perl stores its\
    \ data internally.\n\nAll scalar variables are represented by the type SV defined\
    \ in the perl.h file. The definition of this type is\n\n```\nstruct sv {\n   \
    \ void* sv_any;      /* pointer to something */\n    U32   sv_refcnt;   /* how\
    \ many references to us */\n    U32   sv_flags;    /* what we are */\n};\\ypef\
    \ struct sv;\n```\n\nThe sv_any field points to the data held in the scalar. This\
    \ can be a Perl string (called a byte array) by C programmers or a reference to\
    \ a hash, array, code, scalar, or typeglob.\n\nThe sv_refcnt is a reference count\
    \ used by Perl to determine when to free the variable. Finally, the sv_flags are\
    \ used by Perl to handle variable type information and booking information.\n\n\
    # Accessing Perl's SV Variables\n\nYou don't normally access the contents of an\
    \ SV directly. Instead, Perl provides a rich set of functions that you can create\
    \ and access SV variables.\n\nFor example, the SVIV macro turns a scalar into\
    \ an integer. If the scalar doesn't contain an integer value, the conversion does\
    \ the best it can.) For example:\n\n```\nvoid do_square(SV *value) {\n    int\
    \ number = SVIV(value);\n```\n\nIf you want to set a scalar value to an integer,\
    \ you can use the sv_setiv macro:\n\n```\nsv_setiv(value, 56);\n```\n\nFinally,\
    \ if some reason you need to create a scalar, there is a set of newSV...macros.\n\
    \n```\nunsigned char array[5] = {1, 2, 3, 4, 5};\nnew_value = newSVpv(array, 5);\n\
    ```\n\nThe online document perdoc peruts you to the functions that manipulate\
    \ it. Table 14.2 contains a short list of some of the most important functions\
    \ that can be used with svs. For a complete list of all the functions you can\
    \ use (all variable types), see the online document perlapi."
  merge: -1
  pgno: 255
- img_proc: true
  md: "# Table 14.2 Some Important Functions that Can Be Used with SVs.\n\n| Function\
    \ | Meaning |\n| SV *result = NEWSV(count, length) | Create a new SV. Set the\
    \ reference to count and allocate length bytes. (Nothing is in the SV, but length\
    \ bytes are reserved). |\n| SV *result = newSViv(integer) | Create a new SV and\
    \ assign it integer value integer. |\n| SV *result = newSVnv(float_value) | Create\
    \ a new SV and assign it the floating-point value float_value. |\n| SV *result\
    \ = newSVpv(string, length) | Create a new SV and assign it string value string.\
    \ The number of bytes copied is specified by the length variable. If this variable\
    \ is zero, then the length of the string is computed using the strlen function.\
    \ |\n| flag = SvOK(SV_ptr) | Return true if the SV_ptr points to an SV that contains\
    \ an integer. |\n| integer = SvIV(SV_ptr) | Turn an SV into an integer. |\n| double_value\
    \ = SVNV(SV_ptr) | Turn an SV into a double. |\n| string = SvPV(SV_ptr) | Turn\
    \ an SV into a string (char *). |\n\n# Using SV\n\nNow rewrite bits program to\
    \ let the user pass in an array. First change the function header so that it accepts\
