  md: '# Date Formats


    This program makes extensive use of date parsing and date calculations. To make
    things easier, the system keeps track of time as the number of days since Jan
    1, 1970.

    You may wonder why this date is so special. It seems that the people who created
    the Posix standard decided that it would be a good idea to "start the clock" on
    this date. The standard time format is the number of seconds since this date.

    That standard is used by Posix and Perl. The Perl function returns the current
    time base on this standard. The date parsing functions use it as well.

    If you are interested in days, all you have to divide is by the number of seconds
    in a day for your calculations.


    # The Program


    The program starts by reading the file and extracting the date:


    ```

    80 # Decode the line

    81 # <spaces>(date-1)<spaces>(rest-2)

    82 $line =~ /^\s*(\S+)\s*(.*)/;

    83 my $date_str = $1; # Get the date

    84 $rest = $2; # Get the rest of the line

    ```


    One problem with the format used is that the second field is optional, so you
    need to check and see whether it''s there. (If it''s not, create some defaults.)
    For example:


    ```

    87 # We might have a line like:

    88 ([^0-9]+-$1)<spaces>($rest-2)

    89 if ($rest =~ /(-(\S+)\s*(.*))$/) {

    90 $flag = $1; # Grab the flag

    91

    92 # Put in a default number of days if needed

    93 if ($rest eq "-") {

    94 $flag = -9999;

    95

    96

    97 $rest = $2; # Grab the rest

    98 } else {

    99 $flag = 7; # Assume the flag is +7

    100 }

    ```


    Next, turn the date into something useful:


    ```

    102 my $date = parsedate($date_str);

    103 if (not defined($date)) {

    104 print STDERR "Unable to parse date: $date_str\n";n105 next;

    106 }

    ```'
