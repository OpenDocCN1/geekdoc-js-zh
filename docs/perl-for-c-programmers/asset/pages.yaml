- img_proc: true
  md: '# The result looks like


    join EXPR,LIST


    Joins the separate strings of LIST into a single string with fields separated
    by the value of EXPR, and returns that new string. Example:


    ```

    $rec = join('':'', $login,$passwd,$uid,$gid,$gcos,$home,$shell);

    ```


    See split


    From this, you can see that this function has something to do with joining together
    the items of a LIST. In this case, the documentation uses uppercase words as LIST
    to indicate a variable. In this case, EXPR is a string expression such as '':'',
    and LIST is a list of items such as $login, $password, and so on.


    In this example, perdoc has two options. The -t option tells perldoc to use its
    internal formatter to format the text. If this option is not present, it tries
    to use the -f, which tells perldoc that you want information on a built-in function,
    in this case join.


    > - Comes First

    perldoc is picky when it comes to the order of its options on the command line.

    The -t must be first.


    # Module Documentation


    Perl not only consists of a core language, but also many modules. To find out
    about a module, use the command


    ```

    $ perldoc module-name

    ```


    That''s if you know the name of the module. If you don''t, you can find which
    modules are installed on your system by looking through the Perl library directory.
    The actual search commands are system-dependent.


    # Finding Modules (UNIX/Linux)


    To search for modules on UNIX or Linux, use the command


    ```

    $ find /usr/lib/perl5 -name "*.pm" -print

    ```


    (If Perl is installed in some other directory, say /usr/local, you''ll need to
    adjust the directory used in the find command.)


    For example, a typical run might look like'
