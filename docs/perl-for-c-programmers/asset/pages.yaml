- img_proc: true
  md: 'The search is done depth first, so if you have the following packages:


    ```

    package computer;

    @ISA = qw(motherboard case);

    ```


    ```

    package motherboard;

    @ISA = qw(cpu memory);

    ```


    ```

    package case;

    @ISA = qw(power_supply disks);

    ```


    the search order for the methods in the package computer


    +   - computer

    - motherboard

    - cpu

    - memory


    +   - case

    - power_supply

    - disks


    Note that the searching occurs only if you have a variable of the type computer.
    For example, suppose that start_disk is a method in the package disks. Then you
    can use the following code:


    ```

    my $server = computer->new();

    $server->start_disk();

    ```


    It will not work if you call a method directly:


    ```

    computer::start_disk($server); # Fails

    ```


    # Information Hiding


    In C++, the protection keywords public, private, and protected tell the user who
    may access the member functions and member variables. In Perl, everything is public.
    No access protection exists at all.


    # Common Mistake: Exporting the Methods


    When you design an ordinary package, you must put all the public functions and
    variables in the @EXPORT array. Otherwise, they will not be readily accessible
    to the caller when strict syntax checking is turned on.


    continues'
