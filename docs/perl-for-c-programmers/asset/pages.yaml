  md: '# Searching for Modules (Microsoft Windows)


    To search for module files under Microsoft Windows, open an MS-DOS command session.
    You''ll need to know in which directory your Perl package is installed. (If you
    forget which directory it is, you can execute the command PATH to display your
    path settings. The Perl program should be in your path.) This example assumes
    you installed it in the default directory C:\PERL. To find the modules, execute
    the command


    ```

    C:\WINDOWS> dir/s/p C:\PERL\*.pm

    ```


    All your modules will be listed. Now you can use the perdoc command to extract
    the information from them as described in the previous section.


    # How to Print Nice-Looking Documentation


    Perl keeps its documentation in a format called POD (Plain Old Documentation).
    It''s easily converted into a wide variety of formats such as HTML, LaTeX, man,
    and text.


    By default, the perdoc command turns POD into text for display on a terminal.
    You can turn it into HTML using the command


    ```

    $ perdoc -u subject | pod2html >file.html

    ```


    Next, you can use your web browser (Netscape, Internet Explorer, or other browser)
    to view and print the file.


    For example, if you are on UNIX or Linux, you can view the results using the command


    ```

    $ netscape file.html

    ```


    On Microsoft Windows, you can double-click on the Internet Explorer icon and then
    use the File, Open command to open the file.


    # CPAN (The Module Archive)


    The preceding commands tell you all about the installed modules; but what about
    the uninstalled ones? If you do any serious programming in Perl, you quickly learn
    how many modules are available to help you. Unfortunately, you have to download
    and install most of them.


    The Perl people have up a repository called CPAN (Comprehensive Perl Archive Network),
    which contains almost all the modules ever written for Perl. You can access this
    archive through the web at http://cpan.perl.org. Figure 1.1 shows the top-level
    CPAN web page.'
