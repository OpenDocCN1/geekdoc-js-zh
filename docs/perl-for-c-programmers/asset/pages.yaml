  md: '# Chapter 8 Object-Oriented Programming


    The next step is figuring out how to use the time hash package. You can create
    a new time variable using the function time_hash::new. For example:


    ```

    $time1 = time_hash::new(1,30);

    $time2 = time_hash::new(8,40);

    ```


    You can then add and subtract time, using the functions add and subtract. For
    example to add $time2 to $time1, use the statement


    ```

    time_hash::add($time1, $time2);

    ```


    You can print the results with the statement

    Listing 8.2 shows a test routine.


    ```

    Listing 8.2 test_hash.pl


    use strict;

    use warnings;


    time_hash;


    $time1 = time_hash::new(1,30);

    $time2 = time_hash::new(8,40);


    print "Time1 is " , time_hash::to_string($time1), "\n"

    print "Time2 is " , time_hash::to_string($time2), "\n"

    time_hash::add($time1, $time2);

    print "Time1 is " , time_hash::to_string($time1), "\n";

    ```


    # Design Notes


    You should note a few things about the design of the package. First, the first
    parameter for every function, except new, is a reference to the object being acted
    on. This technique is commonly used to object-oriented programming when you don''t
    have an object-oriented language.


    The second name new was chosen to be the constructor for the object. There''s
    nothing magical about the new name, except that every C++ programmer associates
    new with construction of an object.


    Finally, in all the functions, the variable $self is used to refer to the object.
    Again, you could have used any name; by convention, many Perl programmers use
    $self to refer to the current object. (C++ uses the built-in keyword to do the
    same thing);'
