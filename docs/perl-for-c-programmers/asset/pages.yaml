  md: "# Configuring Inline\n\nYou can supply a number of configuration parameters\
    \ to the Inline package. This first is the DIRECTORY option. This tells Inline\
    \ which directory (the default is _Inline) to put the code in that it generates.\
    \ For example, if you wanted to use the directory c_stuff, you would use the Perl\
    \ statement\n\n```\nuse Inline (C => 'DATA',\n      DIRECTORY => './c_stuff');\n\
    ```\n\nOther common options include those shown in Table 14.3.\n\n| Option | Description\
    \ |\n| --- | --- |\n| INCLUDE | A set of -1 options used to specify where the\
    \ include files reside |\n| LIBS | The library options for the C compiler |\n\
    | CC | The name of the C compiler |\n| CCFLAGS | Compiler flags |\n| MAKE | The\
    \ name of the make command |\n\nWith these options, you should be able to compile\
    \ almost any C program with ease. Additional options can be found in the online\
    \ documentation.\n\n# Making a Distributable Module\n\nCurrently, there is no\
    \ simple way of creating a portable module using the Inline package. However,\
    \ if you really want to create one, you can follow the procedures outlined in\
    \ the Inline-FAQ document.\n\nThe developer of the Inline package, Brian Ingerson,\
    \ has promised that it will be possible to turn Inline code into a module with\
    \ a single command “real soon now.\"\n\n# Summary\n\nThe Inline function is the\
    \ easiest to join C and Perl code together. That’s because it hides most of the\
    \ Perl details from the C programming.\n\nBut it’s not possible to cover up everything,\
    \ sometimes you do have to dive into the internals of Perl to unlock the full\
    \ power of this interface between languages."
