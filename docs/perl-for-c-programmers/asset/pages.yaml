    # Security


    Web forms have their own set of security problems. Fortunately, the operating
    system, the web browser, and Perl provide some security against hackers. But that
    doesn''t mean you should ignore it.


    The first line of defense comes from the operating system and web browser. The
    web browser runs under a special user account, typically named www or something
    similar. This means that all CGI scripts can access only the data available to
    this user and can destroy only the files writable by this user.


    However sometimes this can be a problem. Suppose that you want the data created
    by your CGI program to be owned by you rather than the user www. Linux and UNIX
    solve this problem through use of something called a setuid bit. If a script has
    this bit set, the script runs as the user who owns it, not the user who invoked
    it.


    To create a setuid script, all you have to do is the correct chmod command:


    ```

    chmod u+s script.pl

    ```


    This command tells the system when script.pl is run, that it is to be run as you
    ran it.


    # Taint Mode


    The next defense against hackers is Perl''s Taint mode. This is enabled by the
    -T switch on the first line of the program. In Taint mode, anything supplied from
    the outside is considered tainted and generates an error if used in an insecure
    manner.


    Say that you have a form that lets a user submit a name and password, and you
    want to validate it using an external program. Here''s an insecure code fragment
    that does the job:


    ```

    my $user = $form_data(USER);

    my $password = $form_data(PASSWORD);

    my $status = ''validate_user $user $password'';

    if ($status == 0) {}

    ```'
