  md: "# Calling Perl from C\n\nSometimes you'll need to call a Perl function from\
    \ your C code. For example, in the Tk graphical environment, Perl functions are\
    \ called when a window event occurs, such as when a button is clicked.\n\nIn this\
    \ example we're going to update our code to call the Perl function handler error.\
    \ Up to now all your C functions have called croak when they encountered an error.\
    \ Aborting the program for any little problem is a drastic way of handling a problem.\n\
    \nSo for a change, you'll call the Perl function handle_error instead. In C, you\
    \ can execute any Perl command using the eval_pv function. For example: eval_pv('main::handle_error('message'),\
    \ 0);\n\nThe arguments to this function are a string, which contains executable\
    \ Perl code, and a flag. If the flag is set, the function aborts the program if\
    \ there is a syntax error in the string.\n\nThe result of executing the string\
    \ (a SV*) is returned by the function. Listing 14.5 shows the complete function\
    \ and a short test routine.\n\nListing 14.5 error.pl\n\n```\nuse strict;\nuse\
    \ warnings;\n\nuse Inline \"C\";\n\nsub handle_error($)\n{\n    my $msg = shift;\n\
    \    print \"ERROR: $msg\\n\";\n    print \"Continuing anyway\\n\";\n}\n\ncause_trouble();\n\
    __END__C_\nvoid cause_trouble() {\n    eval_pv('main::handle_error('Trouble caused');\"\
    , 0);\n    return;\n}\n```"
