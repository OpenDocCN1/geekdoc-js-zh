    183     if (not (head(\$cur_file->{link}))) {

    184         print "\t$cur_file->{$file} => \$cur_file->{link}\n";n185     }

    186 }

    ```


    You could have grabbed the entire web page using the get function, but the header
    works just as well and less bandwidth.


    # Summary of Web Site Checker


    I originally wrote the link-check.pl program in C++. It was several thousand lines
    long. As you can see in Listing 16.8, the Perl version of this program is only
    186 lines long.'
