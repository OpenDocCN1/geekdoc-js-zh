  md: "New and Useful Syntax 107\n\n# The C and C++ Operators\n\nIn C and C++, you\
    \ need to call the library function access to determine whether a file exists,\
    \ whether you can read or write it. In Perl, these operations are built in. The\
    \ operator -f checks to see whether a file exists and whether it is an ordinary\
    \ file. For example:\n\n```\nif (-f \"file.bak\") {\n  die(\"file.bak\" exists\
    \ before running this script\");\n}\n```\n\nSome common file test operators are\
    \ as follows:\n\n+   -r —File is readable.\n-w —File is writable.\n-x —File is\
    \ executable.\n-d —File is a directory.\n\nFor a full list of all the Perl file\
    \ operators, use the online document using the following command:\n\n```\n$ perdoc\
    \ -f -x\n```\n\nIn other words, these operators are considered functions, and\
    \ their documentation is filed under the function name -x.\n\n# The redo Operator\n\
    \nThe next operator starts a loop over at the top. The redo operator starts a\
    \ loop without reevaluating the conditional. For example:\n\n```\nuse strict;\n\
    use warnings;\nmy $; # Loop index\n\nmy $flag = 0; # True if we've been here before\n\
    \nfor ($i = 1; $i <= 5; $i++) {\n  print \"$i \";\n  if (($flag == 0) and ($i\
    \ == 3)) {\n    $flag = 1;\n    redo;\n  }\n}\nprint \"\\n\";\n```\n\nThis function\
    \ prints\n\n+   1 2 3 4 5"
