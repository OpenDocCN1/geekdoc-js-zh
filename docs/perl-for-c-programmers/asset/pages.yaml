  md: '![](img/59544d13b3df863dfcb334297c75b37e_200_0.png)


    # Under the Hood


    Perl is a complex language that does many wonderful things behind your back. This
    chapter looks at how some of these features are implemented so

    t you can truly understand how Perl works and can exploit this language to

    maximum benefit.


    # What Really Goes On When You Use Perl


    Because Perl is an interpreted language, you can do things that you can''t do

    with compiled languages. For example, you can create code that changes the

    symbol table (adding or removing variables). You also can define new subrou-

    tines or replace old ones. In other words, self-modifying code is back.


    Perl not only lets you write self-modifying code, in some cases makes

    y depend on it. Fortunately, almost all these cases happen behind your back,

    but it''s important to know what''s going on.


    Perl executes some statements at compile time and others at runtime. The

    use statement is executed at compile time. You should remember that this

    statement is used to bring in other modules.


    Take a look at what happens when you issue a use statement such as

    use_module qw(start_it process_it end_it);'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'First, the module my_module.pm is read and compiled. If no error occurs, the
    code in any BEGIN blocks in my_module is executed, followed by any code in the
    module that''s not in any subroutine. If the code returns a good (nonzero, usually
    1) result, the module loaded successfully.


    Next, Perl calls the module''s import function (if there is one). The argument
    list is the name of the module followed by the list of items in the use list.
    In this case, Perl would execute the statement


    ```

    my_module::import("my_module", "start_it", "process_it", "end_it");

    ```


    The import function normally does some symbol tabulation and creates the names
    "start_it", "process_it", and "end_it" in the calling program. Normally, you don''t
    have to do this yourself; the Exporter module does it for you (more on this later
    in this chapter). In fact, the module name is supplied so that subclasses as Exporter
    know whose symbols they are exporting to


    # How use strict


    The strict module uses the import method a little differently. Before going into
    the details, you need to learn a little more about strict. Consider the following
    statement:


    ```

    use strict;

    ```


    This turns on all strict syntax checking. But you don''t have to turn on everything.
    You can turn on just variable checking with the statement


    ```

    use strict "vars";

    ```


    The other restricted forms of strict are


    +   - strict "refs"—Do not allow symbolic references.

    - strict "subs"—Prevents the automatic conversion of barewords to subroutines.


    Now getting back to the statement


    ```

    use strict "vars";

    ```


    This does not cause the function strict::vars to be made available to the calling
    program. Rather, it turns on variable checking. The strict module does this by
    changing the state of the Perl compiler inside its import function (actually,
    the variable $H if you must know). A pseudocode version of strict::import is'
  merge: -1
  pgno: 201
- img_proc: true
  md: "# What Really Goes on When You Use Perl 18\n\n```\npackage strict;\nsub import($module,\
    \ @list)\n{\n  # $module is ignored\n\n  # if the list is empty, turn on everything;\n\
    \  # Turn on the bits represented by the keywords in @list;\n}\n```\n\nYou also\
    \ can say the following statement:\nstrict \"vars\";\n\nIn this case, the unimport\
    \ function is called rather than the import function.\nThe job of the unimport\
    \ function is to turn off Perl's internal syntax checking flags.\n\nRemember that\
    \ the use command executes the import function at compile time. Because of that,\
    \ the import function can, at compile time, change the internal state of the compiler\
    \ to make the syntax checking more strict.\n\n# The use vars Statement\n\nThe\
    \ vars module, which is used to declare global variables, is another example of\
    \ the use of a nonstandard import function. For example, suppose that you put\
    \ the statement\n\n```\nuse vars qw($alpha @beta %gamma);\n```\n\nin your code.\
    \ When Perl sees this, it executes the statement\nvars::import(vars $alpha @beta\
    \ %gamma));\nThe vars module then does some magic in the global symbols $main::alpha,\
    \ main::::beta, and main::gamma being created. (This assumes that you call the\
    \ module from the top-level file. If you call it from inside a package, the package\
    \ name will be used rather than main.)\nThe pseudocode for this function is\n\n\
    ```\npackage vars;\nsub import($module, @list)\n{\n  foreach $variable (@list)\
    \ {\n    # define the variable in the caller's namespace;\n  }\n}\n```\n\nAgain\
    \ the import function does something a little different."
  merge: -1
  pgno: 202
- img_proc: true
  md: '# 186 Chapter 11 Under the Hood


    # The Exporter Package


    The Exporter package defines a function called import. Unlike the other packages
    discussed, the import function does what it''s supposed to do, namely import a
    function from the package into the caller''s namespace. It does this through some
    magic involving typeglobs and references, but it doesn''t matter how it does;
    the thing is works.


    This is another case of the Perl module using some of the hidden syntax features
    of the language to modify the program—in this case, the symbol table—on-the-fly.


    # How import and AUTOLOAD Work


    Perl follows the following algorithm when you call the function:


    package->method()


    First, it looks in the package for the given method. Then it searches through
    all the methods in the packages specified by the @ISA array.


    Next, it searches for an AUTOLOAD method using the same algorithm. If it finds
    one, it calls the statement


    package->AUTOLOAD(package, method, arguments);


    Remember that Perl is an interpreted language. It is entirely possible to define
    a new subroutine during the middle of a program''s execution. The AUTOLOAD method
    facilitates this process. The idea is that you don''t have a method defined, you
    can use the AUTOLOAD method to define it and then execute it.


    The reason Perl lets you defer the loading of the function is speed. It takes
    time to compile things. If you don''t compile them, you save that time. However,
    there is a cost to be paid in complexity.


    Using AUTOLOAD is not easy, and it''s just one more thing you have to worry about.
    Besides, if you are really concerned about speed, you wouldn''t be using Perl
    in the first place.


    # Summary


    Hopefully this look under the hood helps you understand how Perl works a little
    better. As a language, Perl is a little different, and understanding what goes
    on behind your back is useful.'
  merge: -1
  pgno: 203
