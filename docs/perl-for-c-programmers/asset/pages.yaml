    # 9


    # Advanced I/O


    IN CHAPTER 2, "Perl BASICS," YOU LEARNED how to do basic I/O. This chapter takes
    a look at the rich set of features Perl has for doing I/O. These features include
    pipes as well as files. You''ll also learn about reading and writing binary files
    as well as other special operations.


    # Opening a File (Revisited)


    As you already know, to open a file for reading, you use the following statement:


    ```

    open FILE_VAR, "file_in.txt";

    ```


    And to open a file for writing, you use this statement:


    ```

    open FILE_VAR, "file_out.txt";

    ```


    Perl uses the special character > to indicate that it should open a file for writing
    and < for a read indicator. Other special characters are recognized as well. For
    example, if you want to append to a file, use the >> indicator:


    ```

    open LOG_FILE, \>>command.log";

    ```'
