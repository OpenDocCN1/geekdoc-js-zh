- img_proc: true
  md: '# 302 Chapter 16 Cookbook


    Mr. Congrove''s idea was to use a rolling ball rather than a pendulum. The ball
    rolls down a track in an inclined plane. When it reaches the bottom, it hits a
    lever, and the clock ticks and in the process reverses the slope of the plane
    causing the ball to roll in the other direction. Thus you can easily make a clock
    that ticks only once every 30 seconds.


    The inventor calculated that his inclined plane was the equivalent to a pendulum
    of 30 feet in length. He had a brilliant theory and an inventive concept. The
    only problem was that it didn''t work.


    The problem is that whereas a pendulum has a natural frequency, a falling ball
    doesn''t. Every speck of dust, every temperature change, every bump on the track
    causes inaccuracies in the system. A good Congrove clock is accurate to within
    20 minutes a day.


    Most engineering, what sounds good on paper doesn''t quite work in the field.


    # Calendar Programs


    Like most people, I need to help keeping tracking of dates. I have trouble with
    two types of dates: the ones in the future (upcoming events) and the ones in the
    past.

    The cal.pl program is designed to help me. It examines a calendar file and decides
    whether an event is approaching. It writes out a warning message. The default
    format of an entry in this file is


    ```

    <date> <Event>

    ```


    For example:

    1/27 Wife''s Birthday


    This causes the program to warn me seven days before my wife''s birthday.

    But for some events, I want more advanced warning. So another optional field is
    added to the program to give me much extra time. The format of this field is +warn-time>.
    For example:

    1/27 +30 Wife''s Birthday


    gives me 30 days warning of the approaching event.

    Another function of this program is to keep track of events in the past. For example,
    it could track the number of days since I sent out my rebate form to Canon. For
    those types of events, the file format is changed slightly. A minus (-) is used
    to indicate that this event is in the past and to count the number of days since
    it occurred.

    9/25 - Canon rebate'
