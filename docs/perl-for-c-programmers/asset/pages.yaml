- img_proc: true
  md: "# Table 3.1 Continued\n\n| | |\n|---|---|\n| /s*/ | One or more whitespaces—that\
    \ is, spaces or tabs |\n| /, | Comma |\n| /\\s*/ | Comma, which may be followed\
    \ by zero or more whitespaces |\n| \\n/ | Newline (Useful when your string contains\
    \ a bunch of lines and you want to separate it into an array of individual lines.)\
    \ |\n\n# Common Programming Mistake: split /\\s*/\n\nMany people wrongly use the\
    \ regular expression /\\s*/ to split a line where the fields are separated by\
    \ spaces (\\s in Perl terms). For example, the code in Listing 3.4 is designed\
    \ to split a full name into the first name and the last name:\n\n# Listing 3.4\
    \ name.pl\n\n```\nuse strict;\nuse warnings;\nmy $name = \"Steve Oualline\";n\n\
    @name = split /\\s*/, $full_name; # WRONG WRONG\n\nfor ($index = 0; $index <=\
    \ $name; $index++) {\n    print \"$index:$name[$index]\\n\";n}\n```\n\nThe regular\
    \ expression /\\s*/ tells to split the line where a whitespace character (\\s)\
    \ occurs zero or more times (*). The key word here is \"zero\". If you look at\
    \ the string \"Steve Oualline\", there are spaces between the \"S\" and \"t\"\
    \ of \"Steve\". The split function sees that. It matches the delimiter specification\
    \ and splits the \"S\" off from the \"t\".\n\nSo the result of the split is not\n\
    \n```\n0: Steve # This does not happen\n1: Oualline\n```\n\nbut instead, you get\n\
    \n```\n0: S\n1: t\n2: e\n3: v # And so on\n```\n\nIf you want to split a space\
    \ delimited record, use the regular expression /\\s+/, which means for a whitespace\
    \ character (\\s) one or more times (+)."
