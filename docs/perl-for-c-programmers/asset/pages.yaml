  md: "# Common Mistake: Putting / in a Regular Expression Comment\n\nTake a look\
    \ at the following extended regular expression:\n\n```\nif ($line =~ /\n  \\/\
    \    # C / C++ Single line comment Start\n  .*      # Goes to the end of the line\n\
    /x )    # End of extended regular expression\n```\n\nAt first glance, everything\
    \ looks ok. The regular expression begins with / and ends with /x, so it is an\
    \ extended regular expression. But there's a problem.\n\nWhen Perl sees this,\
    \ it doesn't know it's an extended regular expression, so it parses things until\
    \ it finds the end of the expression. The first slash is the slash /\n\n```\n\\\
    / # C / C++ Single line comment Start\n```\n\nPerl sees this and, because it doesn't\
    \ know that this is an extended regular expression yet, concludes that the / in\
    \ \"C / C++\" is the end of an ordinary regular expression.\n\nFor this reason,\
    \ you can't use / in a regular expression comment.\n\n# Using the Regular Expression\
    \ Debugging Package\n\nRegular expressions use all their own. This makes them\
    \ tricky to write and debug. However, you can use a few tricks to make your life\
    \ easier.\n\nFirst, the best way of debugging a regular expression is to avoid\
    \ making a mistake in the first place. This is difficult, especially for a novice,\
    \ but if you design and comment your regular expressions, you will reduce errors\
    \ before even start.\n\nIn spite of how clever or careful you are, some errors\
    \ will get through. In that case, you can use Perl's regular expression debugging\
    \ module. It is turned on with the line\n\n```\nuse re 'debug';\n```\n\nIt is\
    \ turned off with the statement\n\n```\nno re 'debug';\n```\n\nWhen debug is turned\
    \ on, Perl outputs debugging messages whenever a regular expression is compiled.\
    \ Take a look at how this works with a simple regular expression #/. The result\
    \ of the compilation is\n\n```\nCompiling REX #/\nsize 3 first at 1\n1: EXACT\
    \ <>(3)\n3: END(0)\nanchored '#' at 0 (checking anchored isall) minlen 1\n```"
