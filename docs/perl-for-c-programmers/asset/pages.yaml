  md: '# Printing Complex Data Structures


    Sometimes, such as when you are creating a program like date.pl, you''ll need
    to print out a complex data structure. You can do this in the debugger, or you
    can use the module dumpvar.pl to display the data.


    To use this module, you need to put the following line near the top of your program,
    just after the use lines:


    ```

    require *dumpvar.pl;

    ```


    Now when you want to print a variable, use the function call:


    ```

    dumpValue(\$reference);

    ```


    where reference is a reference to the variable to Dump. For example, to print
    out the @date_array variable in human readable format, use the following command:


    ```

    dumpValue(\@date_array);

    ```


    # Copying Data Structures


    Suppose that you want to make a duplicate of a data structure, such as an array
    of hashes, as in @date_array shown previously. You could use an assignment statement
    as such


    ```

    my @new_array = @date_array;      # Won''t work as expected

    ```


    Because this array contains a set of references, the references (pointers) are
    copied, not the data. This is not what you want if you change some of the data
    in @new_array, you''ll change the data in @date_array. What you want is a new
    copy of all the data, not just the references.


    For purpose, you need to go to the Storable module. The function clone clones
    a complex data structure, making copies of all the references. It takes one argument,
    the reference to the data, and returns a reference to a copy of the data.


    So replace the assignment statement with a dclone call:


    ```

    use Storable qw(dclone);

    # .....

    my \$new_array_ref = dclone(\@date_array);

    ```'
