  md: '# Installing Perl


    THIS APPENDIX DESCRIBES HOW TO INSTALL Perl on your system. Before you install
    it, however, you may need to get a copy. The main Perl repository (http://cpan.perl.org)
    contains links to the source code for Linux and UNIX systems. For Microsoft Windows
    binaries, check out http://www.activestate.com.


    # Installing Perl on Linux


    Almost all Linux distributions come with Perl. If it''s not already installed,
    you can use your package manager or whatever installation program your system
    comes with to install Perl and all its related packages.


    Because each distribution is different, a complete discussion of package installation
    is beyond the scope of this book.'
