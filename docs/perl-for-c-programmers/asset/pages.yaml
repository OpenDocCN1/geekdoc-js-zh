  md: '# Debugging a Module


    Because of the way they are constructed, modules are difficult to debug. The problem
    is that you have to debug Perl, but the module is not part of the Perl program
    proper. Instead, it''s loaded during the program run.


    The first step to debugging a module is to create a debuggable version of Perl.
    By default, when you build and install Perl, the system builds an optimized version
    with no debugging information.


    To build a debug version of the program, you''ll have to rebuild it. This is done
    at configuration time. The first step in building the Perl program from source
    is run the Configure command. It asks you for the compiler optimizing/debugger
    flag to be used to create the program. The default (-O2) is good for a production
    version of the program. For a debug version, you''ll need to answer this question
    flag -g (enable debug).


    By default, perl compiles with the -o flag to use the optimizer. Alternatively,
    you might want to use the symbolic debugger, which uses the -g flag (on traditional
    UNIX systems). To use neither, specify the word "none". Each flag can be specified
    here:


    What optimizer/debugger flag should be used? [-O2] -g


    The next question configuration tool asks is for any additional flags. Because
    you answered -g in the previous step, the flag -DEBUGGING will be added to the
    compiler flags. (Leave this option alone.) The configuration tool continues to
    run:


    Checking if your compiler accepts -fno-strict-aliasing Yes, it does.


    Your compiler may want other flags. For this question you should include -I/-whatever
    flags and any other flags used by the C compiler, but you should NOT include libraries
    or ld flags like -whatever. If you want perl to honor its debug switch, you should
    include -DEBUGGING here. Your C compiler might also need additional flags, such
    as -D_POSIX_SOURCE.


    To use no, specify the word "none".


    Any additional cc flags?

    [-DEBUGGING -fno-strict-aliasing -I/usr/local/]


    After you''ve compiled and built the Perl program, you can use it for debugging
    your modules.'
  merge: -1
