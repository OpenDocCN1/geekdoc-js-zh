    # Combining C and Perl with Inline::C


    AS YOU MIGHT HAVE GUESSED, C is better than Perl for some things, and Perl is
    better than C for other things. The Inline module enables you to combine both
    languages. That way, you can use C to do what C does well and use Perl for what
    Perl does well.


    This chapter shows you how to use the Inline module to actually put C into your
    Perl program as well as gives you an introduction to Perl''s internals so that
    you can make maximum use of this module.


    # What Is the Inline Module?


    You can combine C and Perl in several different ways. One of the most common is
    to use C to create a Perl module. This is useful and flexible, but it is complex
    and difficult to get right. You also have to know a bit about Perl''s internals
    to create a really good module.


    Another way of marrying C and Perl is to use the embedded Perl interpreter- .
    But again, the process is not as easy as it looks, and you have to know a lot
    about the internals of Perl.


    Finally, you can use the Inline module. This module lets you put your C code in
    your Perl program. When the code is needed, the module compiles'
  merge: -1
  pgno: 250
- img_proc: true
  md: "and loads it for you. This method avoids many of the hassles of dealing with\n\
    both languages. In fact, the Inline module goes to a lot of trouble to make it\n\
    almost unnecessary to be concerned with the internals of the Perl interpreter.\n\
    (You still have to get your hands dirty, but this is the cleanest interface poss-\n\
    ble.) Note that if you haven't done already, you need to download and\ninstall\
    \ the Inline::C module.\n\n# Hello World\n\nThis section starts with yet another\
    \ version of \"Hello World\". Listing 14.1 uses\nPerl to call a function named\
    \ say_hello, which is written in C.\n\n+   Listing 14.1 hello.pl\n\n```\nuse strict;\n\
    use warnings;\n\nuse Inline \"C\"\n\nsub say_hello();\n\nsay_hello();\n\n__END__\n\
    C\nvoid say_hello() {\n    printf(\"Hello World\\n\");\n}\n```\n\n> Note\nTo use\
    \ Inline::C on Microsoft Windows, you must have installed a C compiler. By default,\
    \ the\nInline::C module assumes that you have installed the Microsoft C++ compiler.\n\
    \nYou must be able to compile a C program from the command line before you can\
    \ use Inline::C.\n\nThe program starts by telling Perl that you want to include\
    \ some inline C\ncode with the statement\n\n```\nuse Inline \"C\";\n```\n\nThis\
    \ is followed by a Perl prototype for the function say_hello:\nsub say_hello();"
