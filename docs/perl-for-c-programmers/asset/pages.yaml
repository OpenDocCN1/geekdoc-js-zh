  md: 'At this point in the game, you can pretend that Perl has multiple dimension
    arrays. For almost everything you''ll write, Perl does the right thing. But for
    a more detailed description of what''s going on you, you have to wait for Chapter
    6.


    # @ARGV Variable


    The special variable @ARGV contains the command-line arguments for the program.
    For example, if you run a script with the command


    ```

    $ perl doi.pl alpha beta gamma

    ```


    Then


    ```

    $ARGV[0] = "alpha";

    ARGV[1] = "beta";

    ARGV[2] = "gamma";

    ```


    To get the number of arguments, use the notation $$ARGV (there is no @). Note
    that unlike in C programming, the first argument is not the name of the program.
    If you need the name of the program, it is assigned to the variable $s.


    # The English Module


    Remembering cryptic names as $s may be a little difficult. To make things easier,
    someone wrote the module English. This module lets you use more descriptive names
    as $PROGRAM_NAME. All the special variables (both English and cryptic) are documented
    in the Perl documentation page perperl.


    # Summary


    Perl provides all the power of C arrays with none of the headaches. (You don''t
    have to worry about dimensions, going off the end, resizing, and so on.)


    But Perl goes far beyond what you can do with C. For example, Perl has array expressions
    as well as scalars. There is also a rich set of manipulation functions like shift,
    unshift, push, pop, and splice. Thus Perl lets you perform complex array operations
    with a few simple operators.


    Perl also provides a rich set of operations for examination and manipulation of
    strings as you see in Chapter 4.


