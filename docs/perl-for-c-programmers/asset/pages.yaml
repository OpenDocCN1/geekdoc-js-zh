- img_proc: true
  md: '# Perl and Databases 25


    Later when you want to use the database, you use the tie function to connect the
    database and a Perl hash variable:


    ```

    167      $database = tie (%disk,

    168               ''MLDBM'', $db_file,

    169               O_RDWR|O_CREATE, 0640);

    ```


    In this example, %disk_db is the Perl hash, and the name of the database file
    is contained in the variable $db_file. The other parameters tell the DB_File package
    that you want to open the database for both reading and writing, to create it
    if necessary, and to use the UNIX permissions 0640 for the new file (if any).


    Now look at what happens when you do a complex assignment such as this:


    ```

    $db{users} = [qw(tom dick harry)];

    ```


    Perl sees that %db is a tied hash, so it calls the method MLDB::STORE. This function
    sees that you are trying to store any array of elements, so it calls Storable::Freeze
    to turn the array into an encoded scalar. MLDB::STORE uses the DB_File database
    to store the key (users) and the encoded data. This works well and almost transparently.
    There is just one thing that can get you into trouble—a statement like this:


    ```

    $db{users}[0] = "sam";

    ```


    In this case, Perl takes a look at $db{users}. It''s a reference to an array.
    Because you want to change the first element of this array, you are not changing
    anything in the proper way; Perl does not call MLDB::STORE.


    Again, the reference ($db{users}) is not being changed but the array being referenced
    (@$db{users}), and that doesn''t trigger the tie logic. As a result, stores such
    as this will not make into the database.

    So do you do you? You have to split the operation into stages. For example:


    ```

    my $ref = $db(users);

    ${$ref}[0] = "sam"

    $db{users} = $ref;

    ```


    That statement does modify %db and triggers the MLDB::STORE call.

    Now that you know how to access a database, take a look at what goes into it.


    # Dealing with Simultaneous Database Accesses


    It''s possible that many people will use the database system at the same time.
    That means you have to deal with the problem of simultaneous access to the database.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Chapter 15 Putting It All Together


    The DB_File package deals with this in a limited way. The database can be opened
    read-only or read-write. An unlimited number of people can open the database read-only.
    Only one program at a time can open the database read-write. If a second person
    attempts to open the database read-write, he will be blocked until the first program
    finishes changing the database and closes it.


    If you open the database read-only and then another program changes, these changes
    are not reflected in your copy. In other words, the data is “frozen” when you
    open the database read-only. (At least as you’re concerned.)


    This means that if you want to use the database, you should get in quickly, do
    your work, and get out. Keeping the database open for a long time is not a good
    idea.


    Other databases do not have these limitations, and there are Perl interfaces to
    them. The DB_File database was chosen because the amount of data you are dealing
    with is small and it comes with the Perl core distribution. In other words, it
    was the simplest to use.


    The DB_File database limits you to one write at a time, which is okay for short,
    simple applications. But this won’t do for more complex jobs. For them, you’ll
    need a better database.Two of the most ones are MySQL and PostgreSQL.(See Appendix
    C, “Beyond Perl,” for more information.)


    # Database Design


    Now take a look at the database design. The first thing to look at is the data
    you are organizing. In this case, it’s disks. I organize my disk into several
    broad categories, including the following:


    +   - Floppies

    - Zip disks

    - Bare CD-ROMs (These are CD-ROMs that I store without their cases.)

    - CD-ROMs with cases (These are CD-ROMs stored with their cases. The cases are
    kept because they contain valuable information such as instruction sheets, licenses,
    or other information.)


    Each disk is identified by its index. For example, the first floppy disk is assigned
    the identifier F1 (F for floppy disk, 1 for first disk). This identifier makes
    it easy to find the disk. All I have to do is go to my floppy cabinet and select
    the first disk.


    Similarly, if I want to find my “Redhat 5.1 Disk,” I look up the identifier in
    the database and find that it’s disk B37. I then go to the CD organizer disks
    B33–B64 and grab the CD-ROM. Because everything is in order, everything is easy
    to find after I find the identifier.'
