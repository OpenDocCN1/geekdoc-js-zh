  md: '# Web Search Engine


    A variety of programs available that will index a web site and allow users to
    search the site. MiniSearch is simple, easy to install, and works fairly well
    for small sites.


    To use this program, all you need to do is install the scripts in your CGI directory.
    Next, run the script searchindex (searchdata/config) and update it as needed.
    You can now access the admin page for this script through the URL http://<your-server>/<cgi-install-dir>/searchindex.


    Where:


    +   <your-server> is the name of your server.


    +   <cgi-install-dir> is the name of the CGI directory in which you installed
    MiniSearch.


    After you log in, you arrive at the administration screen shown in Figure C.4.
    This screen allows you to adjust the configuration parameters and to reindex the
    site.


    The searches can be made using the URL http://<your-server>/<cgi-install-dir>/search.


    MiniSearch can be obtained from http://www.dansteinman.com/minisearch/


    ![](img/59544d13b3df863dfcb334297c75b37e_410_0.png)


    Figure C.4 MiniSearch screen.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# Text Search GUI


    A nice little search tool called Critter can be found at http://

    www.mainmatter.com/perltk/. It searches a series of files for a given string.

    Figure C.5 shows the GUI. Although a high-powered tool, Critter does

    provide you with a number of bells and whistles. Besides, you get the source,

    so if you want to add anything, you can.


    ![](img/59544d13b3df863dfcb334297c75b37e_411_0.png)


    Figure C.5 Critter Search.


    If the basic functions of Critter Search work, I found many minor,

    anoying flows in the program, such as the use of uninitialized variables and a

    directory selection system that could use some improvement. However, with you''ve

    got the program, and a knowledge of Perl, so it is possible to come up with

    solution.


    # Photo Album


    If you have a digital camera, you may want to put your photos on the web.

    You can write the code to do this yourself, or you can use one of the many

    different photo album scripts out there.'
