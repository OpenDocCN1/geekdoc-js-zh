  md: "# Basic Perl Objects\n\nThe time_hash package has all the ingredients that\
    \ make up an object. Data and functions act on that data. In Perl, these are called\
    \ *methods*; in C++, they are called *member functions*.\n\nThe only problem is\
    \ that you must manually specify the class variable every time you call a method.\
    \ It would be nice if you could do automatically. The hash knows all the data\
    \ contained in it. The only thing it doesn't know is what methods can be used\
    \ on that data, and you need information if you are able to write object-oriented\
    \ code. Perl solves this problem through the use of the bless function.\n\nThis\
    \ function tells Perl to associate the subroutines (methods) in the current package\
    \ or, in other words, the package where this function was called with the current\
    \ hash. Modify your new function and put the following statement at the end of\
    \ it:\n\n```\nreturn (blessed $self);\n```\n\nNow object $self (a hash created\
    \ by the new function in the time_hash package) is associated with this package.\n\
    \nNow to create a new time_hash variable, use the following statement:\n\n```\n\
    my $time1 = time_hash::new(1, 30);\n```\n\nPerl looks for the new method in the\
    \ package time_hash and calls it. The new method returns an object, also known\
    \ as a blessed hash.\n\nHere's how to call the function:\n\n```\n$time1->add($time2);\n\
    ```\n\nThis adds $time2 to $time1. Notice that you didn't have to specify the\
    \ package name. Because $time1 is a blessed hash, Perl knows that it comes from\
    \ the time_hash package and therefore knows how to find the time_hash::add function.\n\
    \nPerl does one other thing in this case; it adds the hash reference ($time1)\
    \ to the beginning of the parameter list. So, although you call add with ($time1,\
    \ $time2), the add function receives two parameters ($time1, $time2). The add\
    \ function begins with\n\n```\nsub add($)\n{\n    my $self = shift; # The hash\
    \ we wish to add\n    my $other = shift; # The other hash\n```\n\nThe first thing\
    \ is that the function takes the reference to the hash off the parameter list\
    \ and assigns it to $self. The variable $self is the equivalent of the C++ keyword\
    \ this. It is a pointer to data in the class."
