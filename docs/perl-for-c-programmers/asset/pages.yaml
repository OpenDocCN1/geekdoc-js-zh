  md: '# Conditionals


    Now add a final refinement to the code. You want to match strings that contain
    an escaped double quote (\*) in them, such as


    ```

    MACRO = "string with \* in it" # Comment

    ```


    Now when you look for a string, you want to match "all the text from one double
    quote to another, but don''t match quotes with an escape in front of them,


    Fortunately, Perl has a "don''t match if" operator. Actually, the Perl for this
    is "negative lookbehind assertion."

    So your string consists of


    +   - A starting quote (")

    - Zero or more inside characters (.*)

    - An ending quote (\*) that works only if

    - It is not preceded by a \ (?!\)


    The updated expression is


    ```

    +----------------------- Character (\)

    ++++!---------- (The thing not to match)

    |       | Match next (") if

    |       | ||

    |       | enclosed (\) does not

    |       | ||

    |       | occur here.

    |       | ||

    |       +---------- Match double quote (")

    if ($Line =~ /^(?:[:"#]*!\*.*?(?<!\))\)*\.*)/

    ```


    Now take the revised expression and use it in a program that parses Makefiles
    and parses the lines into their various parts. Listing 4.2 contains the results.'
