  md: "# Chapter 7 Subroutines and Modules\n\nThis can be modified by the -I switch\
    \ on the command line. For example, if you have a local module library in the\
    \ directory /usr/local/lib/perl, then you can use modules within it you run your\
    \ program with a -I flag that points to:\n\n```\nperl -I/usr/local/lib/perl average.pl\n\
    ```\n\nAnother way of adding to @INC is through the environment variable PERLLIB.\
    \ This variable contains a list of additional module directories to be searched,\
    \ separated by colons. For example to add two directories to your library path,\
    \ use the commands from the following operating systems/shells:\n\n+   * UNIX/Linux\
    \ (ksh):\n  setenv PERLLIB=/usr/local/lib/perl:/home/sdo/perl/lib\n* UNIX/Linux\
    \ (sh, bash):\n  PERLLIB=/usr/local/lib/perl:/home/sdo/perl/lib;export PERLLIB\n\
    * Microsoft Windows:\n  set PERLLIB=/usr/local/lib/perl:/home/sdo/perl/lib\n\n\
    # Structuring Your Modules\n\nYou can structure your module library into modules,\
    \ submodules, sub-modules, and so on. Suppose that you have a top-level module\
    \ directory called /usr/local/perl/lib/lib. You tell Perl about this directory\
    \ by putting the -I/usr/local/perl/lib/lib switch on the command line.\n\nCreate\
    \ a module called call. The name of the module file is call.pm. If you put the\
    \ module in the top-level directory, you can then use the module with the statement\n\
    \n```\nuse call;\n```\n\nYou can make this a submodule by putting it in a subdirectory\
    \ of your module library. In this call, you want to make this a part of the \"\
    phone\" system, so put it in a subdirectory called phone. The use statement is\
    \ now\n\n```\nuse phone::call;\n```\n\nTable 7.2 summarizes some of the various\
    \ module constructions."
  merge: -1
  pgno: 159
- img_proc: true
  md: "# Table 7.2 Paths and use Statements\n\n| Module Path | use Statement |\n|\
    \ $LIB/call.pm | use call; |\n| $LIB/phone/call.pm | use phone::call; |\n| $LIB/phone/basic/call.pm\
    \ | use phone::basic::call; |\n\n$LIB is the location of the module library.\n\
    \n# Special Blocks (BEGIN, END)\n\nThe code in the special block labeled BEGIN\
    \ will be executed as soon possible in the program. This gives a module writer\
    \ a place to put his initialization code. For example:\n\n```\nBEGIN {\n  $vowels\
    \ = 'aeiou'; # Initialize the vowel table\n}\n```\n\nNote that BEGIN blocks are\
    \ executed at compile time, so if you check your syntax using the perl -c command,\
    \ all your BEGIN blocks will be executed.\n\nAn END block is executed as late\
    \ as possible. This is usually after an exit call or other normal terminations.\
    \ (Special terminations, such as an interrupt signal or other exceptions, cause\
    \ the END blocks to be skipped.) For example:\n\n```\nEND {\n  unlink(\"tmp.\\\
    $\\$\");\n}\n```\n\nFor those who have not browsed the online documentation, unlink\
    \ is a standard function to delete a file (perldoc -t -f unlink), and $$ is a\
    \ built-in variable containing the process number of the current program (perldoc\
    \ perlvar).\n\nFinally, the code is in the module itself, which is not in any\
    \ subroutine. This code is executed after the BEGIN blocks when the module is\
    \ loaded. This code must end in a statement that returns true to let Perl know\
    \ that the module loaded correctly.\n\nConsider the module in Listing 7.4.\n\n\
    # Listing 7.4 begin.pm\n\n```\nuse strict;\npackage begin;\n```"
  merge: -1
