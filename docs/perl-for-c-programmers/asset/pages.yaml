  md: '# Chapter 4 Regular Expressions


    Now see how this operates on your test statement:

    CC = gcc          # Use the gnu compiler


    The first part of the regular expression match everything except a #:

    [^]*

    This matches the underlined part of the line:


    ```

    CC = gcc          # Use the gnu compiler

    ```


    Because this portion of the regular expression is enclosed in the first set of
    parentheses, the matching string is put in the variable $1. So $1 is

    ""CC = gcc ,"

    The next part of the regular expression tells Perl to match a # (#) followed by
    any character (.) repeated zero or more times (*), followed by the end of line
    ($):

    #.\**


    The second string is enclosed in the second set of parentheses, so the matching
    string gets inside the variable $2:


    ```

    CC = gcc          # Use the gnu compiler

    ```


    In this case, $2 becomes "# Use the gnu compiler".


    # Dealing with Alternatives (|) and Limited Matches


    Regular expressions work in almost all cases. There is a problem, however, if
    you have a line like

    MACRO = "String with # in it"  # Comment


    In this case, you don''t want to break the line at the first # since it''s in
    the middle of a quoted string. So how do you write a regular expression that excludes
    it?

    The solution is to refine the regular expression so that you consider the elements
    command to be


    +   - Any character other than %

    - A quoted string

    - Either one, or repeated zero or more times


    This introduces a new operator or (;). This causes Perl to match either one of
    two different values. The two values in this case are any character other than
    a # or "[^#]" or a quoted string (\.\*\). Note that you exclude the quotation
    mark from the first element because it''s taken care of in the second.'
