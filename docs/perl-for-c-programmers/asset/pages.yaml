  md: "# Basic Regular Expressions\n\n# Using Grouping to Split a Line\n\nSo far,\
    \ you've created regular expressions that can determine whether a line is a blank\
    \ line or a comment line. But what about a line that's half data and half comment?\
    \ For example:\n\n```\nCC = gcc # Use the gnu compiler\n```\n\nSuppose that you\
    \ want to separate this line into two components, executable code and a comment.\
    \ For this you use the grouping operator (parentheses).\n\nFirst\n\nSimilarly,\
    \ you can use the caret (^) to exclude a range of characters. For example [^a-z]\
    \ matches everything except.\n\n# The Two Meanings\n\n> Note that /[a-z]/ is different\
    \ from /[^a-z]/. The caret means different things in the two expressions. In the\
    \ first one, /^[a-z]/ the caret (^) is outside any classification, so it means\
    \ \"start of line\". So [^a-z]/ means \"start of line\" followed by a lower-case\
    \ letter ([a-z]).\n\n> In the second case, /[a-z]/, the caret (^) is inside the\
    \ range specification ([]), so it means anything except the following. So /[^a-z]/\
    \ matches a single character that's not a lowercase letter.\n\nThe dollar sign\
    \ ($) has a similar double meaning. Outside a range specification ([]), it means\
    \ \"match of line\". Inside it means the literal dollar sign.\n\nThe comment starts\
    \ with # and continues for the end of the line. To capture the two parts of the\
    \ line, put parentheses around the first part and another set of parentheses around\
    \ the second. The data matched by the regular expression contained in the first\
    \ parentheses will be placed in variable $1. The result of the second match will\
    \ be placed in $2.\n\nThe following shows how this works:\n\n```\n################++++\
    \ Any character except #\n################++++# Repeated 0 or more times (*)\n\
    ################++++||# Put the enclosed in $1\n################||||||# # The\
    \ character hash (#)\n################||||||# # Any character (.)\n################||||||#\
    \ Repeated 0 or more times (*)\n################||||# Put the enclosed in $2\n\
    if ($line = /([^#])*)(\\$)/) {\n  $code = $1;\n  $comment = $2;\n```"
