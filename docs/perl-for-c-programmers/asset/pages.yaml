  md: '![](img/59544d13b3df863dfcb334297c75b37e_20_0.png)


    # 1 Exploring Perl


    EXPLORING A NEW PROGRAMMING LANGUAGE ALWAYS starts with understanding what it
    is and how it works. In the case of Perl, first there is a core language—called
    Perl—which is a Perl syntax and a set of basic functions. The Perl syntax lets
    you write very powerful and flexible programs. It is designed to take care of
    a lot of the bookkeeping and details for you.


    At the beginning, Perl was a language for processing text, and because of its
    extensive built-in text-handling capabilities, it is an ideal language for creating
    business reports, doing system administration work, and handling HTML forms.


    Now Perl is more than just a language for processing text. A large collection
    of modules comes with the system. The modules are like a programming library or
    DLL full of very useful features and functions.


    However, the number of modules Perl comes with nothing compared with the total
    number of modules available for the language on the Internet. In fact, so many
    modules are available that a group of people got together and created the web
    site Comprehensive Perl Archive Network (CPAN). The CPAN library now contains
    thousands of modules all ready for downloading and installation. Chances are there
    is a module that can significantly reduce your programming job.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1 Exploring Perl


    Needless to say, all the modules and all the programs in the world won''t do you
    any good if they don''t have documentation explaining how to use them. That is
    why Perl was designed with a built-in documentation system. Even better, all Perl
    module writers use it to document their work.


    So by exploiting the installed modules, CPAN, and the documentation to maximum
    effect, you can write your programs with minimal effort. To summarize, Perl is


    +   - A core, extremely flexible language

    - A set of installed modules

    - CPAN, a repository containing thousands of useful modules

    - Online module documentation


    This chapter shows you how to discover the many different features of Perl and
    its modules and how to exploit them for maximum effect.


    Have Perl\This chapter assumes that you have Perl installed on your system. (If
    not, see Appendix A, ''Installing Perl.'') It is also a good idea to have access
    to your Perl system when reading this book.


    # Online Documentation


    Perl comes with about 15,000 pages of online documentation. This book doesn''t
    reproduce all this documentation, but instead tells you how to access it. (Sets
    of books are available for purchase that contain a paper copy of most of the online
    documentation, but they are expensive, out-of-date, and more difficult to access
    the stuff that comes with Perl.) Why use your own money when there is a book 15,000
    pages right on your hard drive?


    Perl''s online documentation makes a reference manual unnecessary if you know
    how to tickle Perl in such a way that it gives you the information you want. In
    the next few sections, you learn how to just that.


    # perldoc


    The main way to access Perl''s documentation is through the perdoc command. For
    example, to find out about Perl itself, use the following command:


    ```

    $ perdoc perl

    ```'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# UNIX, Linux, and Windows


    This command works for UNIX, Linux, and Microsoft Windows systems. (On Microsoft
    Windows, you need to create a command prompt window and then execute the command).


    This example uses $ as the command prompt. That''s the default UNIX/Linux prompt.
    If you are using Microsoft Windows, the prompt may look like C:\WINDOWS>

    The `perdoc` command prints the top-level Perl document. This document contains
    a list of the other documentation that gives details on the various parts of Perl.
    For example, the command `perdoc per` discusses the built-in Perl variables, and
    `perdoc rerun` tells you how to run Perl.


    Suppose that while looking at a program you see the code uses the operator !=.
    If you do not know what this operator does, you can use the online documentation
    to find out. First step is the main Perl documentation page, which is obtained
    with the command


    ```

    $ perdoc perl

    ```


    Looking through the list of documentation, you see the lines


    +   ...

    lsyn Perl syntax

    perlop Perl operators and precedence

    perlre Perl regular expressions

    ...


    It looks like the `perdoc` document might be of use, so you take a look at it
    with the command


    ```

    $ perdoc perlop

    ```


    Looking through this document, you find the definition of the operator !=-. (It
    compares a string against a regular expression and returns true if it is false—more
    on this in Chapter 4, “Regular Expressions.”)


    # Function Definitions


    Perl comes with many built-in functions. If you want to find out what a particular
    function does, you can read the `perfunc` documentation—all 7,000 lines of it.
    Or you can use `perdoc` to give you information on a specific function.


    For example, if you want to find out what the function join does, use the following
    command:


    ```

    $ perdoc -t -f join

    ```'
  merge: -1
