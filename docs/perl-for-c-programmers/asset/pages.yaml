    # # Putting It All Together


    YOU''VE LEARNED A GREAT DEAL ABOUT PERL in the previous chapters, and it''s time
    to put your knowledge to use. This chapter covers how to design a small, real-world
    system and how to use Perl to implement it.


    If you''re like me you have a few floppies and CD-ROMs lying about. Organizing
    these disks can be a chore. This chapter shows you how to create a database to
    support the cataloging of program disks.


    To make things convenient for all users, the example program implements three
    front ends to the system: a command-line interface, a GUI version, and a set of
    CGI programs.


    But before you get to the various interfaces, you need to design the core functions.


    # ## Perl and Databases


    You need to learn a little bit about how Perl handles databases. Perl contains
    a tie function that connects a variable with a package. For example, let''s tie
    the Perl %db to the DB_File package as follows:


    ```

    use DB_File;

    tie(my %db, ''DB_File'', ''my_info.db'');

    ```'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Chapter 15 Putting It All Together


    This tells Perl that all accesses to the hash %db are to be turned into method
    calls to the package DB_File. This means that now the following statement is actually
    a function call:


    ```

    $db(password) = `Surfs Up";

    ```


    The function is provided by the DB_File package. This package is one of the many
    small databases available for Perl. In fact, this one comes with the core Perl
    distribution. When this package sees this statement, it stores a new key/value
    pair in the database.


    One nice thing about this is that your data is preserved between program runs.
    If, one item is stored in the database one day, it will still be there when the
    program runs another day.


    The tie consists of three parts. The first is a variable to be tied. This can
    be an array, scalar, or hash. The next parameter is the package to be used. In
    the example, this is DB_File.


    Finally, there are the arguments to the package. In this case, you''re using only
    one, the name of the database: my_info.db.


    The tie connects the hash to the database. If you want to break this connection,
    use the untie function:

    untie(%db);


    # MLDBM Package


    There is a problem with the DB_File packages. You can put only scalars in the
    database. It won''t work with references.


    For example, attempting to store a reference fails:


    ```

    $db(users) = [qw(tom dick harry)];

    ```


    However, another interface, MLDBM, allow you to store and retrieve complex data.
    Actually, this is not a database but a wrapper that sits between the tied variable
    and the actual database. Its job is to encode and decode the data that you think
    you are dealing with complex data structures, and the database thinks it''s dealing
    with scalars.


    When you bring in the MLDBM package, you need to give it two parameters: the name
    of the package to use for the underlying database and the name of a package that
    is to be used for encoding and decoding the data.


    For the disk (in the file disk.pm), ask for the MLDBM package using the following
    statement:


    ```

    141 use MLDBM qw(DB_File Storable);

    ```


    (Line numbers refer to the full program which can be seen in Listing 15.1.)'
