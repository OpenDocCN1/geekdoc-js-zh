  md: "# # Translating C Data Structures into Perl\n\nPerl and C have vastly different\
    \ ways of dealing with data structures. In C, you can generate complex data structures\
    \ and precisely control their layout. Perl’s data structures are both simpler\
    \ (you can't nest data structures) and more complex (anonymous references).Yet\
    \ despite these differences, it's easy to translate almost any C data structure\
    \ into Perl. Some of the internals and the details may be different, and the syntax\
    \ is vastly different, but it can be done.\n\n# ## Hashes as Structures\n\nPerl\
    \ does not have a built-in data type similar to a C structure, but you can make\
    \ do with a hash. For example, suppose that you need a structure to hold the date.\
    \ In C, this would be written as\n\n```\nstruct date { /* C Code */\n    int day;\n\
    \    int month;\n    int year;\n} today = {\n    5, 10, 2001\n};\n```\n\nThis\
    \ can be easily translated into a Perl hash as follows:\n\n```\nmy %today = {\
    \ # Perl code\n    day => 5,\n    month => 10,\n    year => 2001\n};\n```\n\n\
    There are a few differences between Perl's hashes and C's structures. The first\
    \ is that whereas the fields in a C structure are ordered, the elements of a Perl\
    \ hash are unordered. In other words, Perl guarantees that you have something\
    \ with a day, month, and year in it, but does not tell you anything about how\
    \ it's put together.\n\nSecond, you can add and remove elements from a hash, whereas\
    \ the fields in a C structure are fixed.\n\n# ## Arrays of Hashes\n\nPerl does\
    \ not allow you to nest data structures directly, so you cannot have an array\
    \ whose elements are hashes. But you can come up with a good approximation by\
    \ using references.\n\nSuppose that you want to declare the Perl equivalent of\
    \ a C array of dates. In C, this is\n\n```\nstruct date_array[100]; /* C array\
    \ of dates */\n```"
