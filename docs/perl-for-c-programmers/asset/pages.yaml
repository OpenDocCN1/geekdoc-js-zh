  md: "However, when you are doing object-oriented programming, the methods (functions)\
    \ are addressed through the object. For your example:\n\n```\n$time->to_string();\n\
    ```\n\nBecause $time has been blessed, Perl knows what methods are associated\
    \ with this object. In this case, the methods do not to be exported.\n\nIf they\
    \ are, it pollutes the namespace unnecessarily, so don't export methods.\n\n#\
    \ Operator Overloading\n\nPerl enables you to perform operator overloading. This\
    \ enables you to define a function that's called when two time objects are added\
    \ such as the following:\n\n```\nmy $time3 = $time1 + $time2;\n```\n\nThis section\
    \ defines a new package called time_over that uses operator overloading to allow\
    \ you to add, subtract, and print times.\n\nTo define a function for adding two\
    \ time classes, you need to use the overload package:\n\n```\nuse overload (\n\
    \  '+=' => \\add,\n  '-=' => \\subtract,\n  '*=' => \\to_string\n);\n```\n\nNow\
    \ when Perl sees you add two time objects, it calls this function to perform the\
    \ addition. Listing 8.4 shows the subroutine to add two time objects.\n\nListing\
    \ 8.4 add Function\n\n```\n# Incomplete function, see below for the full version\
    \ sub add($)\n```\n\n```\n{\n  my $time1 = shift; # The first time for adding\n\
    \  my $time2 = shift; # The second time for adding\n  my $result = {}; # Result\
    \ of the addition\n\n$result->{hours} = $time1->{hours} + $time2->{hours};\n$result->{minutes}\
    \ = $time1->{minutes} + $time2->{minutes};\n$result->{hours} += int($result->{hours}\
    \ / 60);\n$result->{minutes} %= 60;\n  return (bless $result);\n}\n```"
