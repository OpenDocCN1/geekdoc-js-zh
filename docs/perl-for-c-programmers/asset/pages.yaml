    # Unpacking the Archive


    Place your archive in a working directory. This is not the directory where

    installed Perl. This is a temporary workspace that can be deleted after you

    install the module.


    After downloading the module, you need to unpack the archive containing

    it. On UNIX and Linux, this is done with the gzip and tar commands.

