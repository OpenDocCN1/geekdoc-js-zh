  md: '# grid


    As you can see, with the pack geometry manager and a few frames you can make complex
    GUIs with a few simple commands.


    The grid geometry manager allows you to lay out your widgets in a set of rows
    and columns. It is not as flexible as the pack geometry manager, but it is useful
    in some cases.

    The manager comes with a number of options and even lets you create grids with
    widgets that span rows and columns.


    # place


    The place geometry manager lets you do all the work of deciding where you want
    your widgets yourself. In other words, you must explicitly place the widgets inside
    the window.


    # form


    A newer geometry manager is the form. It gives you the capability to describe
    the location of a widget in a variety of ways. One way is to specify a location
    in terms of a percentage of the window. In other words, you can say “I want this
    widget to be put 30 percent below and 10 percent to the right of the upper-left
    corner.

    The form also lets you specify a widget''s location through attachments and springs,
    which gives you a way of placing your widget relative to other widgets.

    Note that the form geometry manager is new and, as of this writing, not completely
    documented or implemented yet.


    # Special Widgets


    Most widgets, such as buttons, labels, and entries, are simple and straightforward.
    However, some are more complex and deserve more attention.


    # Scrollbars


    Say that you want to create a list of options. You can do this using the ListBox
    widget. But you may have more items than can be displayed at one time.

    No problem, just create a Scrollbar widget. All you need to do is connect the
    movement callbacks from the scrollbar to your listBox widget.

    Coding this operation is both time consuming and tricky, so the makers of Tk created
    a way of automatically adding scrollbars to a widget through the Scrolled method.'
  merge: -1
  pgno: 237
