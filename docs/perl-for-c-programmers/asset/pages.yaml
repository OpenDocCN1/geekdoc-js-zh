    # 2 Perl Basics


    PERL AND C SHARE A LOT of the same basic syntax. In this chapter, you learn how
    to write simple programs starting with, of course, “Hello World.” Next you explore
    the basic Perl statements and operators that have C equivalents.


    Finally, the chapter covers some simple I/O. When you have completed this chapter,
    you’ll know enough to write some basic Perl programs. You won’t know enough to
    solve all the world’s problems, but you will know enough to get yourself in trouble.


    # Writing Your First Perl Program


    This chapter starts with the Perl version of “Hello World.” The program is fairly
    simple, yet it introduces some basic elements of Perl (see Listing 2.1).


    Listing 2.1 hello.pl


    ```

    use strict;

    use warnings;


    print "Hello World\n";

    ```'
