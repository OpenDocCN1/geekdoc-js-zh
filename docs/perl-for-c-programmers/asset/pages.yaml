  md: "# Chapter 8 Object-Oriented Programming\n\nHowever, in C++ you can omit references\
    \ to this when you access member functions. You can't do this in Perl; the $self\
    \ is required. For example:\n\n```\n$self->{minutes}\n```\n\nAlthough there's\
    \ nothing magical about using the variable $self, it has become the standard name\
    \ used by most Perl programmers.\n\nBecause of the way Perl does object-oriented\
    \ programming, all the member functions, except new, look the same as in Listing\
    \ 8.3.\n\nHowever, your use of this package is much simpler. You can see the new\
    \ program in Listing 8.3.\n\n```\nListing 8.3 test_obj.pl\n\nuse strict;\nuse\
    \ warnings;\n\nuse time_hash;\n\nmy $time1 = time_hash::new(1,30);\nmy $time2\
    \ = time_hash::new(8,40);\n\nprint \"Time1 is \", $time1->to_string(), \"\\n\"\
    ;\nprint \"Time2 is \", $time2->to_string(), \"\\n\";\n$time1->add($time2);\n\n\
    print \"Time1 is \", $time1->to_string(), \"\\n\";\n```\n\n# Polymorphism\n\n\
    One thing about C++ classes is the capability to create a derived class. For example,\
    \ you can define a base class animal and then create derived classes for pigs,\
    \ horses, and dogs.\n\nIn C++, a derived class might look like this:\n\n```\n\
    class dog: public animal {\n  // ...\n```\n\nYou can do the same thing in Perl\
    \ through the use of the @ISA array. In a derived class, or package, the derived\
    \ class contains a list of base packages. For example:\n\n```\npackage dog;\n\
    @ISA = qw(animal);\n```\n\nWhen Perl looks for a method (C++ member function),\
    \ it first looks in the package being called. It then searches through the packages\
    \ specified by the @ISA array."
  merge: -1
