    I discovered one problem when debugging the cookie logic. My web server is named
    www.oualline.com. On my local network, I can refer to it as www. As a security
    measure, Netscape won''t accept cookies that say they are coming from one machine
    (www.oualline.com) when the web page comes from another (www). As a result, none
    of my cookie-setting code worked until starting using the server www.oualline.com
    rather than www.


