  md: '# Command-Line Utilities


    Now that the core of the system is ready, you need a couple of front-end functions.
    The first, `new_disk.pl`, adds a disk to the database. The logic for this function
    is fairly trivial. All it does is grab the category and disk description from
    the command line and call `new_disk`.


    Similarly, the `update_disk.pl` command takes a disk ID and description from the
    command line and uses `update_disk` to modify an existing disk.


    Finally, the `report.pl` command reads all the data from the database and prints
    a report.


    All these scripts are simple with minimal logic. But they do serve a purpose because
    they are useful when it comes to testing the disks.pm module. Besides they provide
    the user with a command-line interface to the database. The code for each is presented
    in Listings 15.3 through 15.5.


