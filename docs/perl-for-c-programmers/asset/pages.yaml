- img_proc: true
  md: "# Parameter Specification Summary\n\nPerl has a simple, yet rich parameter\
    \ syntax. Table 7.1 shows a summary of the various specification characters.\n\
    \nTable 7.1 Parameter Specification Characters\n| Specification | Explanation\
    \ |\n|---|---|\n| $ | Scalar |\n| \\@ | Array (converted to reference) |\n| %\
    \ | Hash (converted to reference) |\n| & | Function reference |\n| @ | Array (must\
    \ be last) |\n| % | Hash (must be last) |\n| ; | Indicates that optional parameters\
    \ follow |\n\n# Alternate Parameter Passing Methods\n\nThere is nothing magic\
    \ about the shift method used to get the parameters out of _ and into variables.\
    \ The method is simple, clear, and easy to use; that's why it's the preferred\
    \ method of this author.\n\nBut you can convert _ to variables in many other ways.\
    \ One of the common ways is to use an array assignment statement. For example:\n\
    sub distance($$$$)\n    my ($x1, $y1, $x2, $y2) = @_;\n\nThis example assigns\
    \ an array on the left-hand side to an array on the right-hand side, and everything\
    \ works.\nThis system has the advantage of assigning all your parameters at once.\n\
    However, the shift method is a little simpler and easier to comment.\n\n# Function\
    \ with No Parameter Specification\n\nThere's a third way of specifying function\
    \ parameters: the empty specification. For example:\nsub do_it {\n\nThis tells\
    \ Perl that the function takes any number of parameters of any type. In other\
    \ words, absolutely no type checking is done. Also no automatic conversion of\
    \ array references to arrays or hashes to hash references is done. All the parameters\
    \ are concatenated together, dumped in @_, and that's it."
  merge: -1
  pgno: 152
