  md: "# Packages\n\nYou've now learned how to organize your code into subroutines.\
    \ A collection of related subroutines is called a package. The statement\n\n```\n\
    package call;\n```\n\nindicates to Perl that from now on all functions and variables\
    \ are to be part of the package call. A Perl package is similar to a C++ class.\
    \ Each variable and exists in a namespace local to the class or package. Suppose\
    \ that in this package define a variable and a function:\n\n```\nmy $sin_call\
    \ = 0;\nsub start() {\n#...\n```\n\nThis defines a variable and function that\
    \ can be used somewhere within the package. For example:\n\n```\n$call = 1;\n\
    ```\n\nBut outside the package program must use the scope operator (:) to access\
    \ these names. The variable $in_call in the package call is referred to by the\
    \ name call::in_call. Similarly, if you want to invoke the subroutine from outside\
    \ the package, you need to use the name\n\n```\ncall::start();\n```\n\nThe default\
    \ package (the one that's implied if you don't specify a package directive) is\
    \ named main.\n\nListing 7.1 illustrates how packages affect naming.\n\n# Listing\
    \ 7.1 package_ex.pl\n\n```\n# Note: This example is artificial\n# Most of the\
    \ time packages are in\n# separate files.\nuse strict;\nuse warnings;\n\nmy $calling\
    \ = 0;          # Are we calling\n                     # (Defines main::calling)\n\
    package call;\n\nmy $in_call = 0;         # Are we in a call\n               \
    \      # (Defines variable $call::in_call)\n\n# Subroutine call::start()\nub start()\
    \ {\n  $in_call = 1;         # We are calling\n                     # (Uses $call::in_call)\n\
    ```"
  merge: -1
