  md: 'Perl C for Programmers is designed to get C programmers up to speed with the
    Perl language in a minimal amount of time. The book covers the aspects of the
    Perl language familiar to all C software engineers as variables, data structures,
    control statements, and subroutines. It also goes into extensive detail on the
    aspects of Perl that have no counterpart in C, such as regular expressions and
    other text processing operations. All major types of Perl programming are discussed
    including report writing (for the business programmer), text and table mapping
    (for the system administrator, webmaster) and interfacing to simple (for larger
    programming projects).

    The book goes beyond just Perl, however, and describes how to exploit the extensive
    library of Perl modules housed in the CPAN repository. With these modules and
    a little bit of programming you can do anything.

    By not treating the reader as a dummy and by reproducing online documentation
    that comes with Perl, this book can be compact and extremely comprehensive at
    the same time. The most concentrated collection on Perl anywhere.


    # Perl C for Programmers


    Content Highlights:


    +   * Perl for Microsoft Windows, UNIX, and Linux

    * Methods of looking and reading online documentation to make best use of Perl
    has to offer

    * How to locate, install, and use modules from CPAN (a repository with thousands
    of useful Perl modules)

    * Using the built-in debugger as the graphical debugger pktdb

    * Regular expressions including the regular expression debugging package

    * CGI programming

    * Report writing

    * Database interfaces

    * Mixing C and Perl with Inline.pm

    * Writing Perl modules


    > “Learning a new structured programming language is a challenge that is almost
    always taken under tight time constraints. This book would definitely help speed
    up that process, which will turn the reader’s adoption of Perl as a tool for problem
    solving. The book is tutorial in nature with good depth and thorough coverage.”


    Jim Meyer, Director of Production Engineering, Wild Brain, Inc.


    ![](img/59544d13b3df863dfcb334297c75b37e_1_0.png)'
