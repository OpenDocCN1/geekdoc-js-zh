    \ = Description\n# #check_info[2] = Amount\n$total += $check_info[2];\nprintf\
    \ \"%%8s:%%20s %%6.2f\\n\", $check_info[0], $check_info[1], $check_info[2], $total;\n\
    ```\n\nNote that when an end of file is detected on the standard input, when you\
