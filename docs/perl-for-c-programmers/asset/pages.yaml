    Figure 13.4 tk_grep.pl.


    You''ll see how to assemble this widget. At the top is a "Pattern" blank. This
    is actually two widgets, a label (the Pattern text) and a blank (an Entry widget).You
    want this pair at the top of the window.


    So you need a grouping widget. This widget is a Frame. A Frame is a widget in
    which you put other widgets. In this case, you create a Frame and pack the Label
    and Entry widgets into it.


    The Label is packed on the left side, the Entry on the right.

    Now you need to consider expansion options. You don''t want the label to grow
    if you resize the window, so it will not expand. The text entry can grow, however,
    but only in the x direction. (You don''t want it any higher.)


    The code for creating the top frame looks like the following:


    ```

