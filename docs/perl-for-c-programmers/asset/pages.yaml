    # Object File Cross-Reference System


    As a professional C programmer, I''ve had to deal with extremely large programs.
    Part of this work involved integration of software whose components were made
    in Finland, the United States, and Korea. Needless to say, sometimes the parts
    don''t go together smoothly.

    One common problem I have to deal with symbol conflicts that occur at link time.
    Frequently, I will get duplicate symbols or undefined symbols.'
