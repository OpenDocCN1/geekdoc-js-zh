  md: '#  Compiling the Program


    The first step in compiling a Perl module is to create a Makefile. This is done
    by executing the Makefile.PL Perl script located in the directory where you just
    extracted archive contents using the command


    ```

    $ perl Makefile.PL

    ```


    (These command work on both Microsoft Windows and UNIX.)nThis command creates
    a file called Makefile, which controls the rest of the building and installation
    process. (By default, this file installs the module in the standard Perl library
    location. So follow the instructions in the upcoming section \uDealing with Permission
    Problems” if you don''t have permission to write into this directory.)

    Now you need to build sources into the modules using the command


    ```

    $ make

    ```


    (If you use Microsoft Visual C++, the make command is called nmake)

    If everything goes well, the module compiles without errors. (If there are errors,
    check for a README or INSTALL file. Also make sure that you have installed any
    modules that are a prerequisite to this one)

    Most modules come with a number of self-test modules. To run the tests,execute
    the command


    ```

    $ make test

    ```


    The tests should execute and report success. If there is a problem, check the
    documentation that comes with your module and try again.


    > X Windows Session

    If you are testing the Tk module on UNIX or Linux, you''ll need to have an X Windows
    session running. The testing process creates several windows during the testing
    process.


    Finally, to install the modules, use the command


    ```

    $ make install

    ```


    #  Dealing with Permission Problems


    The instructions just presented are designed to install the module in the standard
    location for the Perl library. But what if you are on a UNIX or Linux system and
    don''t have permission to write into a system directory?


    The Perl module system is flexible enough to install the module into any directory
    you want. This is done with the PREFIX option to the Makefile.PL command. For
    example, suppose that you want to install modules in /home/oumaline/local. You
    would use the command'
  merge: -1
  pgno: 30
- img_proc: true
  md: '```

    $ perl Makefile.PL PREFIX=/home/oualline/local

    ```


    After the installation is complete, you need to tell Perl about the new, added
    library by setting the environment variable PERLSLIB. For example, if you are
    using the csh shell, you would execute the command


    ```

    $ setenv PERLSLIB "/home/oualline/local/lib/perl15/5.00503:\\n/home/oualline/local/lib/perl15/site_perl/5.005/i386-linux/*

    ```


    Note that this path variable includes both the version of Perl used (5.005) and
    the architecture of the machine it''s running on (i386-linux).These may be different
    from your system. To find out what they are, execute the command


    ```

    $ perl -V

    ```


    Another way of locating the module directory is to use the find command to locate
    the .pm files.


    ```

    $ find /home/oualline/local -name "*.pm" -print

    ```


    For the sh, ksh, and bash shells, the commands are


    ```

    $ PERLSLIB="/home/oualline/local/lib/perl15/5.00503:\\n/home/oualline/local/lib/perl15/site_perl/5.005/i386-linux/*\n$
    export PERLSLIB

    ```


    You probably want to put commands to set PERLSLIB in your initialization files.
    These files are .csh for csh users and .profile for the other shells.


    See "Cookbook" for More


    The "Cookbook" section in the chapter contains not only instructions for installing
    the modules needed by this chapter but also step-by-step instructions for setting
    the PERLSLIB variable.


