  md: "# 132 Chapter 7 Subroutines and Modules\n\nOne simple way of doing this is\
    \ to use the shift function to “shift” the\nparameters out of @_ and into simple\
    \ variables:\n\n```\nmy $start_time = shift;      # Time the event started\nmy\
    \ $end_time = shift;        # Time the event finished\n```\n\nNow comes the body\
    \ of the function, which computes an answer and stores it in\n$result. This value\
    \ can be returned to the caller with the return statement:\n\n```\nreturn($result);\n\
    ```\n\nSo the complete (mostly) function looks like\n\n```\nsub timediff($) {\n\
    \    my $start_time = shift;      # Time the event started\n    my $end_time =\
    \ shift;        # Time the event finished\n\n    # Something amazing happens\n\
    \    my $result = the answer\n\n    return ($result);\n}\n\n    # Sample call\n\
    \    elapsed = timediff($end_time, $start_time);\n```\n\n# On Parameter Specification\n\
    \n$ S in a parameter specification indicates a scalar variable. In the preceding\n\
    example, the function timediff($) takes two scalar variables.\nThis tells Perl\
    \ when it sees a function call such as\n\n```\n    minutes = timediff(\"1:30\"\
    , \"2:40\");\n```\n\nto execute the following:\n\n```\n    _ = (\"1:30\", \"2:40\"\
    );\n    -- timediff --\n    $minutes = -- value returned by timediff\n```\n\n\
    Other specifications can be used in a parameter list. A \\@ indicates an array\n\
    parameter. For example, the function swap_array(\\@) can be called with\n\n```\n\
    swap_array(@first, @last);\n```\n\nPerl automatically converts the arrays to array\
    \ references and puts them in the\nparameter list. The passing code that Perl\
    \ executes behind your\nback looks like this:\n\n```\n    _ = (@first, \\last);\n\
    \    -- call swap --\n```"
