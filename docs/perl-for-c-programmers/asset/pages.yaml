    90            $list{$_} = 2;

    91        }

    92    }

    ```


    The result is that %list contains all the words in both files. The key is the
    only word. The value depends on which file the word is. Words that appear only
    in file 1 have a value of 1. If a word appears only in the second file, the value
    is file 2. Common words contained by both files have the value B.


    From this point, it''s a simple process of printing out each of these categories
    of words. For example, to print the words that appear only in the first file,
    use the following code:


    ```

    95    print "Words only in $ARGV[0]\n";

    96    foreach my $cur_key (sort keys %list) {

    97        if ($list{$cur_key} eq 1) {

