- img_proc: true
  md: '# Interactive Debugging


    There are two ways of debugging interactively. The first is to simulate the web
    server environment, and the second is to get the web server to start the debugger
    for you.


    To simulate the server environment, this section creates a short Perl script that
    reads the form information, encodes it, and then calls the program.


    To do this, you use the module CGI::Enurl, which provides the function enurl.
    This function does the reverse of Parse_CGI; it takes a hash and returns an encoding
    string representing the hash.


    The simulation function starts by asking the user the name of the script and then
    gets the form data in the form of key/value pairs. Next, it encodes the string
    using the enurl function:


    ```

    $$url_info = enurl \cgi_info;

    ```


    One of the simplest ways of passing data to a CGI program is through the environment.
    By setting some environment variables and then executing the program itself:


    ```

    # Set a set of environment variables

    ENV(QUERY_STRING) = $url_info;

    ENV(REQUEST_URI) = "$prog\$url_info";nENV(REQUEST_METHOD) = "GET";

    exec(perl -d $prog);

    ```


    A typical run looks like


    ```

    perl debug.pl

    Script name:/home/httpd/cgi-bin/record.pl

    Enter key=value

    (End with a blank line)

    > name=ouallah

    > group=Software

    > schedule=early

    > version=1.0

    > work=1

    >

    ```


    Loading DB routines from perl5db.pl version 1.0402

    Emacs support available.


    Enter h or ''h'' for help.


    ```

    main::(/home/httpd/cgi-bin/record.pl:33)

    33: print "Content-type: text/html\n";nDB<1>

    ```


    You can now debug the CGI program normally. Listing 12.4 shows the full version
    of the debug program.'
