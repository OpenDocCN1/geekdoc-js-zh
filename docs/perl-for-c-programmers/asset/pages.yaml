  md: "Using grep to search through several thousand files is prohibitively slow,\
    \ I devised the object cross-referencing system. It consists of two parts: the\
    \ ox-gen.pl program that generates the object cross-reference and the ox.pl program\
    \ that queries it.\n\n# ox-gen.pl\n\nThe job of the ox-gen.pl program is to find\
    \ all the object files, read their symbols, and store the information in a hash.\n\
    \nThe structure of the data is\n\n```\n%object_xref =\nKey => the symbol name\n\
    value => hash reference\nkey => defined\ndata => array of files where the symbol\
    \ is defined\n\nkey => used\ndata => array of files where the symbol is used\n\
    ```\n\nOr to put this in C::\n\n```\nstruct single_object {\n  struct object_info\
    \ {\n    char *defined[];\n    char *data[];\n  }\n} object_xref[indexed by symbol];\n\
    ```\n\nThe first step in this process is to find all the object files. Anytime\
    \ the term \"find\" is used in a sentence, you know that find2perl probably is\
    \ going to be used to generate some code. Here's code (slightly modified) that\
    \ finds all the object files (ending in .o) and calls the function gen_xref on\
    \ each one:\n\n```\n109 # Generated by find2perl\n110 sub wanted {\n111   \"*.\\\
    o/z s & &\n112   gen_xref($name);\n113 }\n114\n115 # Traverse desired filesystems\n\
    116 File::$find([wanted] => \\&wanted\\], '.');\n```\n\nThe gen_xref subroutine\
    \ uses the UNIX command to extract the symbol from the files.\n\nMicrosoft Window\
    \ users can find a Windows version of this command in the Cygwin tool (http://www.cygwin.org).\
    \ Microsoft itself provides a utility called dumpbin with its C++ development\
    \ system, but the output is different, so these programs will need editing before\
    \ they work with it:"
  merge: -1
  pgno: 350
- img_proc: true
  md: "# 334 Chapter 16 Cookbook\n\n```\n53 sub gen_xref($)\n54 {\n55     # The name\
    \ of the file we're examining\n56     $file_name = shift;\n57\n58     # The symbol\
    \ information\n59     my @lines = `nm $top_dir/$file_name`;\n```\n\nThe output\
    \ of the nm command looks something like\n\n```\n00000000 T XS_mt_mod_mt_op\n\
    \       U GLOBAL_OFFSET_TABLE_\n00000030 U boot_mt_mod\n       U mt_op\n```\n\n\
    In this case, this file defines the symbols xs_mt_mod_mt_op and boot_mt.mod. It\
    \ uses the GLOBAL_OFFSET_TABLE and mt_op.\n\nYour first job is to break apart\
    \ line into its three components: the value of the symbol (if any), the symbol\
    \ code (T or U whatever), and the name of the symbol.\n\nThis calls for a moderately\
    \ large regular expression:\n\n```\n61     # Loop over each line in the symbol\
    \ data\n62     foreach my $cur_line (@lines) {\n63         # Decode the line\n\
    64             #        +++++++++      Any Hex digit\n65             #      ============\
    \      Zero or more\n66             #      |||||||||||      Put in $1\n67    \
    \         #      |||||||||||||      Whitespace (s)\n68             #      |||||||||||||||\
    \      1 or more (+)\n69             #      |||||||||||||||      Any char (.)\n\
    70             #      ||||||||||||+      Put in $2 ($type)\n71             # \
    \     ||||||||||||||||      Whitespace (s)\n72             #      |||||||||||||||||\
    \      1 or more (+)\n73             #                ||||||||||+      Any character\
    \ (.)\n74             #                  repeat 0\n75             #          \
    \        or more times (*)\n76             #                    ||||+      Put\
    \ in $3\n77 $cur_line = /\\([0-9a-f\\]*)\\s*(.*)$/;\n```\n\nNow that you have\
    \ the information about the symbol, you can see whether you have a record for\
    \ it. If you don't have an entry for this, a new one is created:\n\n```\n82  \
    \   # If we have an entry for this, create it\n83     if (not defined($Object_xref{$name}))\
