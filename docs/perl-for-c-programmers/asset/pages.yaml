    # Creating the CGI Program


    Now the web form is created, you need a program to handle it. This description
    explains how to make a simple CGI program to read the form data.


    When the user clicks on the Submit button, the browser encodes the data in the
    form and sends it to web server. The web server runs the CGI program and sends
    the data to it.


    A list of details are involved in the encoding and decoding of form data. Fortunately,
    you don''t have to worry about them because there are Perl modules to do the work
    for you.


    # CGI Version CGI::Thin


    Most books on CGI programming describe how to use the CGI module rather than the
    CGI::Thin module. The CGI ::Thin module is a short, simple module that does everything
    you want to.


    The CGI module also does everything you want. The problem is that CGI module also
    contains hundreds of functions that you don''t want. As a result, it''s large
    and bloated. Finding the correct function in this is difficult.


    For both speed and simplicity, this chapter uses the CGI::Thin module.


    Before getting started, you''ll need to install two modules:


    +   - CGI::Thin—Decodes CGI data.

    - HTML::Entities—Text-to-HTML encoder.


    The CGI program begins with


    ```

    #!/usr/local/bin/perl -T

    use strict;

    use warnings;

    ```'
