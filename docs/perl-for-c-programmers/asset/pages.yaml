  md: '# Chapter 6 Hashes, References, and Complex Data Structures


    There is, however, one bit of syntactic sugar that you can use with hashes.

    Instead of referencing an element of the hash with the awkward $$ref{value},

    You can write this expression as $ref->{value}. This is similar to C syntax,

    which you write as (*struct_ptr).value and struct_ptr->value. For

    example:


    ```

    print ''Green''s value is $ref->{green}\

    ```


    # Anonymous References


    Unlike C or C++, Perl doesn''t have a heap where you can explicitly allocate

    things. Instead, variables are created using anonymous references. For example,

    you already know how to create a reference to a named data array:


    ```

    my @array = ("red", "white", "blue");

    myref = @array;

    ```


    An anonymous reference looks much like this, when you don''t use @array:


    ```

    my $ref = [''red'', ''white'', ''blue''];

    ```


    The square brackets ([]) tell Perl to create a new array, and return a reference

    to it.


    The square brackets also can be used to create a copy of an array and return

    an anonymous reference to it:


    ```

    my $copy_ref = {[array}];

    ```


    In C and C++, you have to explicitly free any memory you allocate. In Perl

    it''s done automatically. Perl maintains a reference count for each variable.
    This

    is a count of the number of references that point to it. When the reference

    count goes to zero, the variable is automatically deallocated. For more on this

    topic, see the New Riders Win32 Perl Programming: Standard Extensions,

    2nd edition, by Dave Roth.


    You can also create references to anonymous hashes. This is done through

    out of the curly bracket ({}) operators. Here''s an example:


    ```

    my $ref = {red => 1, blue => 2, green => 3};

    ```


    Again, this operator can be used to create a copy of a hash and return

    an anonymous reference to it:


    ```

    my $copy_ref = {%hash};

    ```'
