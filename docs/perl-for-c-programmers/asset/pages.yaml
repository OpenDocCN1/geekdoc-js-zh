  md: "# Debugging a CGI Script 205\n\nListing 12.4 debng.pl\n\n```\nuse strict;\n\
    use warnings;\n\nuse CGI::Enurl;\n\nmy %cgi_info = ();  # CGI Information we are\
    \ creating\n\nprint \"Script name: \";\nmy $prog = <STDIN>;nchomp($prog);\n\n\
    print \"Enter key=value\\n\";\nprint \"*(End with a blank line)\\n*\";\n\n# Get\
    \ pairs that look like name=value\nwhile (1) {\n  print \"*\";\n  my $line = <STDIN>;\n\
    \  chomp($line);\n\n  if ($line eq \"\") {\n    last;\n  }\n\n  if ($line != /^([^=]*)\\\
    s*=\\s*(.*)$/) {\n    print \"ERROR: Could not understand $line\\n\";\n    next;\n\
    \  }\n  $cgi_info($1) = $2;\n}\n\n# Encode the CGI information for simulation\n\
    my $url_info = enurl %cgi_info;\n\n# Set a minimal set of environment variables\n\
    $ENV{QUERY_STRING} = $url_info;\n$ENV{REQUEST_URI} = \"$?$url_info\";\n$ENV{REQUEST_METHOD}\
    \ = \"GET\";\nexec(perl -Td $prog);\n```\n\n# Server-Started Debuggers\n\nAnother\
    \ way to debug a CGI program is to have the server start the debugger. This may\
    \ be a little difficult because the program starts with no terminal connected\
    \ to it."
