  md: '# Colophon


    Pictured on the front cover of this book is the Pyramid of Mycerinus. It was built
    for Chephren''s son, Mycerinus, and is the smallest of the three pyramids of Giza.
    Many consider this pyramid to be indicative of the decline in the workmanship
    of Egyptian pyramid building. The pyramid stands 218 feet tall and has an incline
    of 51 degrees. One striking thing about this pyramid is the front facade which
    has an enormous hole above the passage. In 1215 the Turks decided to demolish
    the pyramids, and the Pyramid of Mycerinus being the smallest of the lot, they
    started with this one. After months of hard work they gave up.


    This book was written and edited in Microsoft Word, and laid out in QuarkXPress.
    The font used for the body text are Bembo and Mono. It was printed on 50# Husky
    Offset Smooth paper at Owensville, MO. Prepress consisted of PostScript computer-to-plate
    technology (filmless process). The cover was printed at Moore Langen Printing
    in Terre Haute, Indiana, on 12 pt., coated on one side.'
