    # ## List Differences


    The first program checks two lists of words and prints out the difference between
    the two. The method used is simple. The words in the first list are used to populate
    a hash (%list). The key is the word from the file, and the value is 1, as shown
    here:


    ```

    76    while (<_FILE>) {

    77        chomp($_);

    78        $list{$_} = 1;

    79    }

    ```


    (Line numbers refer to the listings that follow)

    Now the words in the other file are used to populate the list. This is more complex
    because you already have items in the list. The rule used for population is simple:
    If the word is already in the list, change the 1 to a B. If it''s not, insert
    it with a value of 2. For example:'
