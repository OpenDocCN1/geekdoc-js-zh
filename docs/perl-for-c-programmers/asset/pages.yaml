    Now that you know how to find modules, it''s time to see how to install them.


    # Installing Modules


    There are several different ways of installing modules, including the following:


    +   - Manual installation—You download the modules and then manually execute the
    commands to compile and install it yourself. This method is generally only if
    the other methods fail.

    - CPAN module—A module called CPAN can download and install the modules for you.
    This method is primarily used on UNIX systems.

    - PPM (Perl Package Manager)—This system automatically downloads and installs
    packages. The ppm command comes standard with ActiveState Perl for Microsoft Windows
    and is primarily used on that system.


    Which method you need to use depends on your operating system and environment.
    For step-by-step instructions, see the “Cookbook” section later in this chapter.

    Get through this chapter, you''ll need to download and install two modules.


    ```

    Tk (Full name: Tk8.0.023)

    ptkb (Full name: Devel-tkdb-1.1074)

    ```


    > Latest Versions

    nYou may use later versions of these modules if ones are available.


    # Installing Manually (UNIX, Linux, and Microsoft Windows)


    To install manually, you''ll need the following programs:


    +   - gzip and tar (UNIX systems)

    - WinZip, WinRAR, or PowerArchiver (Microsoft Windows)

    - make or nmake

    - A C compiler'
