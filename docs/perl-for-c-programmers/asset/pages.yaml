- img_proc: true
  md: '# 352 Chapter 16 Cookbook


    One thing to remember about CGI scripts: you can''t put data and programs in the
    same directory. In fact, with Apache, the default installation has one directory
    tree for web pages and another for CGI programs.


    This is due to security. Anything in a CGI directory may be executed. If an outside
    user can write into this directory, he or she could easily break into the system.


    Also remember permissions are a significant problem when dealing with CGI scripts.
    Normally, CGI scripts run as a special, limited access user. For this script to
    work, the following permissions must be in place:


    +   - The "CGI user" must be able to read all the web server log files.

    - The "CGI user" must be able to read and execute the script.

    - The "CGI user" must have the ability to write to the file in the directory web-top/top_web.png
    (where web-top is the root directory for the web pages).


    # Notes on Web Page Counting


    It takes about five seconds for the Perl script to go through all my web logs
    and produce a plot. This is a little long to wait for a web page. Also, I run
    a minuscule site, so for any larger site, the wait would be unacceptable.


    If you wanted to run this for a large site, performance would be an issue. There
    are many ways of doing this. One is to only update the graph periodically. Another
    is to cache the computed data and store it for later use. Subsequent runs of the
    program would need only to parse entries that were added since the cache was updated.


    Or you could use the author''s cop-out and say that this exercise is left to the
    reader.


    # Summary


    Perl is a flexible and compact language. The examples in this chapter show how
    Perl can be used to quickly write useful and powerful programs with a small amount
    of code.


    Now you''ve seen how to slay a few dragons in this chapter, you''re ready to go
    out into the real world and slay a few dragons of your own. Ch. 16 Perl for C
    Programmers 1228x'
