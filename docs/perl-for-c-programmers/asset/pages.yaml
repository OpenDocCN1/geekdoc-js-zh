- img_proc: true
  md: '# Opening a Pipe


    Suppose that you are going to write a report to the screen. If you just write
    the report, the data scrolls off the top of the screen. So to be nice, you want
    to write out a page of data and wait for the user to press a key.Then you would
    write out a new page and so on.This behavior is similar to what the more command
    does. A cheap way of doing this is to require the user to pipe the output of the
    program to more:


    ```

    $ perl report.pl | more

    ```


    Or you could use Perl''s write-to-pipe feature to do the work yourself. For example:

    open REPORT_FILE, "\| more";


    When Perl uses the special character |, it opens a pipe to the command (in this
    case more) and sends all data written to <REPORT_FILE> to that pipe.

    Pipes can be used for input as well. For example, the flags to the UNIX/Linux
    find command finds list of files and prints the results to screen if needed. Suppose
    that you want file in /release/software that end in .c.

    You can locate them with the find command:

    find /release/software -name ''*.c'' -print


    Now if you want to get that list into a program, all you have to do is use the
    open statement with the pipe symbol on the right side of the file specification:
    ''*c'' or

    open LIST_FILE, "find /release/software -name ''*.c'' -print |" or

    die("Could not execute the find command")

    my @file_list = <LIST_FILE>;nchomp(@file_list)

    close(LIST_FILE)


    Note that if you are running on Microsoft Windows, you need to use the DIR command
    in the open statement:

    open LIST_FILE, "DIR C:\*.c /s/b |" or

    die("Could not execute the DIR command")


    # Open Summary


    As you can see in Table 9.1, you can pass many different flags to the open function.'
