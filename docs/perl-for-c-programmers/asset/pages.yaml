  md: '# Basic Regular Expressions 93


    +   - Ranges—A range is a set of charters enclosed in [].


    +   - Anchors—Anchors serve to position a pattern on the line. You''ve used the
    beginning of line (^) anchor to make sure that your regular expression is at the
    right place. Other anchors include things such as the end of line ($) and word
    boundaries (\B).


    +   - Modifiers—Modifiers tell Perl how many of an item to expect. You used the
    * (zero or more times) modifier extensively in this example. Another common modifier
    is +


    By putting together these elements, you can easily build up a very powerful string-matching
    capability.


    # Regular Expression Construction


    You should remember a few things when you create regular expressions:


    +   - Start slowly—Regular expressions are complex and tricky. Start with something
    simple and build on it later.


    +   - One step at a time—Because one character out of place in a regular expression
    can change the whole meaning of the operation, you should build slowly on what
    works to make sure that what you are doing right.


    +   - Test often—What you think you''ve written and what you really write can
    be different from the construction. Make sure you check things carefully at each
    stage of the construction. (Vim is extremely helpful for verifying regular expressions).


    +   - Comment verbely—Every character in a regular expression has its own meaning.
    It was put there for a purpose. When you construct it, write down the purpose
    by sticking it in a comment. It''s easy for the programmer to forget why a regular
    expression was constructed the way it was, so write down everything and stick
    that information in the comments. The programmer''s life you may save be your
    own.


    +   - Check the documentation regularly—A ton of things can go into a regular
    expression. To make sure that you are using the right ones, and to make sure you
    aren''t missing things, check out the online documentation (`perl`) regularly.
    There may be something inside that will surprise you.'
