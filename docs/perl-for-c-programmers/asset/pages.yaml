  md: '# Deleting an Element from a Hash


    You know how to put things into a hash, but how do you remove one? You might think
    that it can be done by assigning undef to the hash element, but this technique
    doesn''t quite do the job. For example, look at the following statement:


    ```

    $hash{sam} = undef;

    ```


    This statement does not remove the element sam from the hash. It leaves the element
    in place, with the value undef. The key sam is still in the hash. To actually
    remove the element sam from the hash, use the delete function: delete($hash{sam});


    # Arrays and Hashes


    You can assign a hash to an array. If you assign a hash to an array, you get an
    array whose elements are key, value, key, value, ... For example:


    ```

    my %hash = (

    sam => 45,

    joe => 57,

    mac => 68

    );

    my @array = %hash;

    print "@array\n";

    ```


    This example may print


    ```

    joe 57 mac 68 45

    ```


    You may have noticed that the keys are not in order. That''s because in a hash,
    the key order is not defined. The output could just easily have been

    joe 57 mac 68 45


    It is also possible to assign an array to a hash. The result is a hash whose first
    key is $array[0] and first value is $array[1]. The second key is $array[2], and
    the second value is $array[3]. This continues until the system runs out of elements.
    If you specify an odd number of elements, a warning is issued. For example:


    ```

    my @array = qw(sam 45 joe 57 mac 68);

    my %hash = @;

    ```


    results in the same hash you had in the previous example.'
