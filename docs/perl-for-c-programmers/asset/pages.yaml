  md: "# Widget Documentation\n\nTo get documentation on each widget, use the perldoc\
    \ command. For example, to get information on the Button widget, use the command:\n\
    \n```\nperldoc Tk::Button\n```\n\nThis documentation lists all the information\
    \ specific to the Button widget. But because the Button widget is derived from\
    \ the basic widget, it inherits many options from this base object.To find out\
    \ about the generic options, use the command:\n\n```\nperldoc Tk::options\n```\n\
    \n# Using Widgets\n\nAll Tk programs start by creating a main window. All other\
    \ widgets are children of this window and inherit the attributes of this widget.\
    \ To create a main window, call the MainWindow->new() function:\n\n```\nmy $Tk_mw\
    \ = MainWindow->new(\n  -title => \"This is the main window\",n  -background =>\
    \ \"cyan\"\n);\n```\n\nThe option -title sets the title of the window. The -background\
    \ sets the background of the window and all its child widgets. (See perldoc Tk::CmdLine\
    \ for a list of method options.)\n\nNow create a button under the main window:\n\
    \n```\nmy $tk_exit_button = $tk_mw->Button(\n  -text => \"Exit\",n  -command =>\
    \ \\exit,n  -background => \"red\",n  -foreground => \"white\"\n);\n```\n\nIn\
    \ this case, you are creating a push button labeled Exit (white letters on a red\
    \ background). When you click on it, the function exit is called.\n\nThe button\
    \ is created as a child of the main window, then you use the $tk_mw->Button call\
    \ to create it.\n\nOne thing is missing from the button specification: the system\
    \ doesn't know where to put it. It goes in the main window, where?\n\nTo answer\
    \ this question, you need to use a geometry manager. This is a set of functions\
    \ that handle the placement of widgets. This example uses the most popular geometry\
    \ manager, pack."
  merge: -1
