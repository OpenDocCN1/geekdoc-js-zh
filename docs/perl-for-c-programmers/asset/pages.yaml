  md: '# 84 Chapter 4 Regular Expressions


    The first line tells you what is being compiled. The second tells you how large
    the compiled result is and which node starts the expression (in this case #1).

    The next two lines are the parsed version of the regular expression. Each line
    consists of a single element of the expression called a node. In this case, the
    expression consists of two nodes, an exact match for the character # and the end
    of the expression:


    +   1: EXACT <>(3)

    3: END(@)


    The number at the beginning of each line is an identification number. The number
    at the end of each line indicates the next node to be evaluated. The usually the
    next node for simple regular expressions, but things can jump around if you have
    moderately complex code.

