  md: "The keyword __END__ is used to tell Perl that it has reached the end of the\
    \ program. (At least as far as the Perl code is concerned.)\nThis is followed\
    \ by the _C__ keyword that tells the Inline module that the C code follows.\n\
    Finally there is the C function itself:\n\n```\nvoid say_hello() {\n    printf(\"\
    Hello World\\n\");\n}\n```\n\nWhen the Inline function does its work, it examines\
    \ the function headers of the C code and parses the argument list. The parser\
    \ is not a full C parser and is somewhat limited. In particular, if you tried\
    \ to declare the function as\nvoid say_hello(void)\nthe operation failed. (On\
    \ arguments in section, \"Simple Arguments and Return Values.\")\n\nAlso you did\
    \ not have to include the <stdio.h> header file along with the \"perl.h\" header\
    \ file is automatically included.\nWhen this program is first run, it takes a\
    \ long time because the Inline module is working. It strips out your C code, adds\
    \ some glue, and then compiles it. It is a loadable Perl module, which then loads.\n\
    The next time you run the program, the Inline module checks to see whether it\
    \ needs to recompile or whether it can use the existing module. If the old module\
    \ works, the compilation step is skipped, and the program runs much faster.\n\
    All this work is done in the _Inline directory. You can delete this directory;\
    \ the next time the program is run, it will be re-created.\n\n# Simple Arguments\
    \ and Return Values\n\nOne thing that C is good at is handling a bit array. For\
    \ simplicity, make it a fixed size (16×16).\nYou'll need two C functions, one\
    \ to set a bit to a given value and the other to return the value of the bit.\
    \ Listing 14.2 contains the functions along with a little Perl code to test it.\n\
    \nListing 14.2 bits1.pl\n\n```\nuse strict;\nuse warnings;\n\nuse Inline \"C\"\
    ;\n```\n\ncontinues"
