  md: '# Web Site Checker


    I run a small web site (http://www.oualline.com), and I want to make sure that
    it is consistent. In other words, I want to check for


    +   - Broken links

    - Files in the HTML tree that are never referenced (orphans)


    This section shows you how to write a program to do this. First, the program needs
    to go through the web pages and extract the links. A Perl module does most of
    that: HTML::SimpleLinkExtractor.


    You also need to go through the file tree and get a list of all the files. A Perl
    module also does that:File::Find.


    You need to check to make sure that all the referenced files (internal links)
    exist. A Perl operator does that: -f.


    Finally, you need to check to see whether the external links are valid. A Perl
    module does that with LWP::$Simple.


    You also need mentioning to call these modules and handle the bookkeeping—you''ll
    have to do that for yourself.


    # Parsing the Files


    The program starts by walking down the tree of all the web pages accessed directly
    or indirectly from the top-level page. The search stops if the file has already
    been processed or if the file does not exist. For example:


    ```

    92  sub process_file($)

    93  {

    94      my $file_name = shift;      # The file to process

    95      my $dir_name = dirname($file_name);

    96

    97      # Did we do it already

    98      if ($file_seen($file_name)) {

    99          return;

    100     }

    101     $file_seen($file_name) = 1;

    102     if (! -f $file_name) {

    103         push(@bad_files, $file_name);

    104         return;

    105     }

    ```


    The program also makes no attempt to handle files that are not HTML:


    ```

    107     if (($file_name != /\.html$/) and ($file_name != /\.htm$/))

    108         return;

    109     }

    ```'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'The program then uses the HTML::SimpleLinkExtor module to extract the links

    of the file. This is done in three stages: create an extraction object (line

    111), parse the file (line 114), and grab the links (line 117).These steps are

    shown in the following code:


    ```

    110 # The parser object to extract the list

    111 my $extractor = HTML::SimpleLinkExtor->new();

    112

    113 # Parse the file

    114 $extractor->parse_file($file_name);

    115

    116 # The list of all the links in the file

    117 my @all_links = $extractor->links();

    ```


    The links are then processed. External links are stored on the list

    @external_links. Local links are processed recursively through the

    process_file function. For example:


    ```

    120     foreach $cur_link (@all_links) {

    121

    122         # Is the link external

    123         if ($cur_link =~ /http:\///) {

    124             # Put it on the list of external links

    125             push(@external_links,

    126                 file => $file_name,

    127                 link => $cur_link);

    128             next;

    129         }

    130         # Get the name of the file

    131         my $next_file = "$dir_name/$cur_link";

    132

    133         # Remove any funny characters in the name

    134         $next_file = File::Spec->canonpath($next_file);

    135

    136         # Follow the links in this file

    137         process_file($next_file);

    138     }

    ```


    # Orphan Detection


    You now have a list of all the files accessible (directly or indirectly) from
    the

    top web page. This list is made up of the keys of the %file_seen hash. You

    need to know the names of all the files on the system to do orphan checking.

    This is accomplished with the File::Find module. Actually, the program

    uses your old friend find2perl to create the code that calls this module and

    adap it to your needs.'
