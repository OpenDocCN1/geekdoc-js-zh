  md: '# Variable Declarations and Simple Expressions


    The problem with printf is that the function must interpret the string looking
    for format characters and converting the arguments to formatted text. This is
    a slow process.


    Use printf only where you need precise control over the formatting of the variables—for
    example, if you are checking a register and the columns line up:


    ```

    printf("%3d-%$5.2f\n", $sequence, $description, $amount);

    ```


    # Simple Arithmetic and String Operators


    Perl and C share a common set of operators. All the C arithmetic operators do
    the same thing in Perl. These operators include the following:


    +   + Addition

    - Subtraction

    * Multiplication

    / Division

    % Modulo

    << Left Shift

    >> Right Shift

    ++ Increment

    -- Decrement

    ; Bitwise or

    & Bitwise and

    ^ Bitwise exclusive or

    - Bitwise not (invert)

    ?: Conditional


    In addition, Perl has a few new operators that C does not. These are

    String concatenation


    ```

    my $full_name = $first . " " . $last; # See note below

    ```


    **Exponentation


    ```

    my $gross = 12**2

    ```


    x Repeat (Repeats a string a given number of times)


    ```

    my $no = "no " * 3;

    print("$no no no\n"); # prints "no no"

    ```'
