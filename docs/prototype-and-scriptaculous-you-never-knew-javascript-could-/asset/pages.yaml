  md: '# COMBINED EFFECTS


    Effect.SlideUp/Effect.SlideDown


    These are content-sliding variants of the “blind” effects. These look like the
    blinds are slid down or up, so the contents move along. However, this requires
    the element''s contents are wrapped in an additional container, say, a `<div>`.
    You can''t just put the contents in the element affected by the effect, as you
    would on, for instance, BlindDown.


    Effect.DropOut


    This opens a trap over the element, in which it falls while fading out. That''s
    a nasty way to die it (especially because the trap, being invisible, leaves no
    evidence whatsoever).


    # Creative In and Outs


    Most of these are based on the Scale core effect.


    Effect.Grow/Effect.Shrink


    These make the element expand in (from size zero) or shrivel away (and stay hidden,
    although restored properties, as usual). This relies on several core effects,
    most importantly Scale and Move. There is a specific option, called *direction*,
    that defines in which the expansion or contraction takes place. It faults to center
    but can also be any of the box corners: *top-right, bottom-right, and bottom-left.


    Effect.Puff


    This taps a magical wand and has the element disappear in a cloud of smoke. Well,
    almost—it expands to twice its size fading away, which is just as good.


    Effect.SwitchOff


    So, your element is on a good '' TV, and you''re switching it off. It''ll shrink
    away like things did back then—with a flickering, quick contraction toward the
    center.


    Effect.Squish


    This has the element shrivel with no specific positioning. For most elements for
    which the point of reference is their top-left corner, it''ll contract toward
    that point.


    Effect.Fold


    This is a two-phase shrink. First it shrinks vertically, until only a tiny, 5-pixel
    bar is left, and then left-wise. Content is not scaled along. Think of it as folding
    a napkin. Sort of.'
