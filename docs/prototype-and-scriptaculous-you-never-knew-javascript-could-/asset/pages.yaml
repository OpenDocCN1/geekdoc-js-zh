    out for separate eval()` processing, can sound a bit overkill, not to say cumbersome.


    On the other hand, it''s very easy to do. Just put a dummy hidden `<span>` somewhere,
    or whatever. Still, for those of you, like me, it''s not the right way to do,
    consider the marriage of a PeriodicalExecutor and an Ajax.Request, when you''d
    send the raw script back with the proper Content-Type header. There''s no noticeable
    difference, but it''s certainly less.


    # A Few More Tricks Up Your Sleeve


    Besides its frequency option, Ajax.PeriodicalUpdater also features a rather advanced
    option called decay. Sometimes, the longer result stays unchanged, the less you
    want to check. In such situations, setting decay to values greater than 1 (its
    default) will do the trick nicely.


    Here is the idea: when the response text changes the last time (which obviously
    happens on the first request, at any rate), the next request is scheduled frequency
    seconds later. But every time the response comes back unchanged, the scheduling
    is multiplied by decay. Incidentally, this decay value less than 1 will quickly
    saturate quickening checks, which will quickly saturate the browser (ouch!).


    The official API page at http://prototypejs.org/api/ajax/PeriodicUpdater has a
    nice table illustrating how decay impacts the scheduling of successive requests.
    Check it out for details. But remember, this is for slightly edge cases. Most
    of the time, you''re good to go without needing it.


    Also know that you can stop, and later resume, the scheduling of requests. The
    methods stop() and start() are just for this. This comes in handy when you provide
    your user with a way to toggle a particular periodical behavior on the fly. By
    the way, the onclick callback has different semantics. It doesn''t fire on every
    Ajax request, but when the periodical update system "completes," which means it
