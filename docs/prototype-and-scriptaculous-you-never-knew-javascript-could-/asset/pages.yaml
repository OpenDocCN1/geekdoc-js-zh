    # Selecting Elements with CSS


    ```

    match(selector) -> Boolean

    select/getElementsBySelector(selector, ...) -> [ HTMLElement, ... ]

    ```


    These methods let you descendant elements by class name or using a full CSS selector
    (handled by Prototype''s Selector class, discussed on page 167). The match() method
    lets you quickly check whether the current element matches a given selector.


    Selectors for select() (formerly known as getElementsBySelector()) are expressed
    as strings, in the same way as Selector.findChildElements(), which will be discussed
    in this chapter. Note, however, that this method is not much used. Most of the
    time you''ll find yourself using the $( ) utility function instead; it''s faster
    and more concise.


    # Tweaking Individual Style Properties


    ```

    getStyle(propertyName) -> value

    setStyle({ name: value, [...] ] } | CSSPropertiesString) -> HTMLElement

    ```


    Prototype provides elements with a uniform access to style properties (DOM properties
    representing CSS properties), smoothing over many browser compatibility issue
    (and trust me, in this specific area, compatibility issues are legion).


    First, getStyle() retrieves the specified (or failing that, computed) value for
    a CSS property. You can use the CSS syntax (hyphen-separated, as in border-width)
    or the DOM syntax (camelized, as in border). Since the DOM syntax is the one ending
    up being, providing it directly makes for faster processing. If the property cannot
    be retrieved or is auto, you''ll get a null.


    In a general manner, refrain from using CSS shorthand for properties. Use detailed
    names as per the DOM Level 2 specification.


    Second, setStyle() lets you set any number of style properties at once by simply
    passing a "hash" as the first argument. Since version 1.6, the property names
    must be camel-cased (for example, font-Size, not font-size) when using the "hash"
    form, and you can use an'
