  md: "# WHAT DOES OUR JAVASCRIPT LOOK WHEN USING PROTOTYPE?\n\nJavaScript, like many\
    \ dynamic languages, has that important feature, so we can indeed pass a function\
    \ without having to resort to \"ancient\" tricks as method pointers.\n\nIn the\
    \ code we saw, we're passing a function as an argument to the sort() method. This\
    \ is one aspect of higher-order functions. The function we're passing is actually\
    \ the result of calling bind() on the original Person.compare() method, which\
    \ means this bind() thing, which I'll explain shortly in a moment, actually returns\
    \ a function. This is another aspect of the language's support for higher-order\
    \ functions.\n\nIn this code, we would like to use our comparator function, except\
    \ we need to pass it with the first argument (the criterion) prefilled. Prototype's\
    \ bind() method on functions lets us do, among other things (and we will discuss\
    \ it in Section 4.2, Proper Function Binding,) on page 58.\n\nFinally, the invoke()\
    \ method lets us call a method on each element in the series returned by sort()\
    \ (possibly with arguments, although we don't need here) and returns an array\
    \ of the resulting values. JavaScript places no restrictions on where you can\
    \ use the (:) operator; as long as the left side is an object, you're in the clear.\
    \ If that side is a method call, all you need is that method call to return an\
    \ object; this lets you chain calls easily to any length you may need.\n\nFinally,\
    \ on page creation, once it is loaded and the DOM is all ready, we want to dynamically\
    \ inject a bulleted list of all the people we have by ascending natural order\
    \ (since the default value for the criterion is the first name, we get first-name\
    \ ordering).\n\nManually creating all the required DOM nodes would be fastidious,\
    \ so we need to build valid HTML text and insert it safely into the proper container.\
    \ Here's the code:\n\n```\ndocument.observe('dom: loaded', function() {\n  html\
    \ = '<ul>\\n    + person.sort(Person.compare).map(function(p) {\n      return\
    \ '<li>' + p.getDisplayName().escapeHTML() + '</li>';\n    }).join('\\n')\n  \
    \  + '</ul>';\n  $(result).update(html);\n  $(#result li:nth-child(2)).invoke(addClassName,\
    \ 'alternate');\n});\n```"
