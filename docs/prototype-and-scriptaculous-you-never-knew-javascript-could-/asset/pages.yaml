  md: '# Additional Text


    In addition to adjusting how submission and cancellation are triggered, you can
    insert custom text before, and after the OK and cancel controls:


    +   - textBeforeControls appears before the first visible control.

    - textBetweenControls appears between the OK and cancel controls, but only if
    both are visible.

    - textAfterControls appears after the last visible control.


    All three options default to the empty string.

    As long as we''re talking about text-related options, you can customize the tooltip
    displayed when the mouse lingers over the static element. Just change the value
    of the clickToEditText option, which defaults to Click to edit.


    Finally, you can change the text that appears, however briefly, while the new
    content is being saved through Ajax. Use the savingText option for this, which
    defaults to Saving...


    Let''s test a fair number of these options to see what the results look like.
    We have a number of editors here, we need to adjust our server script in order
    to maintain not one, but multiple contents:


    ```

    Download scriptaculous/ipe/variants/server.rb

