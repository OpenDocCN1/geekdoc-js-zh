  md: '# 15.5 Monitoring Drags


    You should monitor dragging activity throughout your page, you can use the observer
    facility provided by the global Draggable object. All drag activity passes through
    it, and it is always happy to let you know.


    All you need to register your own observer object by passing it to Draggables.addObserver().
    Your observer can implement any of the three callbacks as available globally in
    Section 15.1; Interactive with the Drag: Callbacks, on page 287; onStart(the drag
    started), onDrag(the position is out to change), and onEnd(the drag has just concluded).


    All callbacks get passed two arguments: the callback name (in case you share a
    callback across multiple events), Draggable object (in case you share a callback
    across multiple elements), and the event object itself.


    Astute readers (that''s all of you) will have remembered that we used this global
    monitoring facility in our geometry persistence example, back on page 198. We
    used it to monitor drags so we could persist window positions ("geometry") on
    the server side through Ajax.


    # 15.6 Dropping Stuff


    So far we dragged stuff around with no special place to put them down. Although
    this can be sufficient for certain applications, most of the time we don''t let
    our users shuffle the UI. Items are usually supposed to be dropped on specific
    locations: a task list, a shopping cart, and so on.


    Much as you can make elements draggable by creating a Draggable object on them,
    you can turn elements into drop zones by registering them with Droaggables.


    # A Simple Drop Zone


    So, you have this element that should act as a drop zone. Fine. Just call Droppables.add()
    on it. This can be as simple as the following:


    ```

    Droppables.add(''dropZoneId'');

    ```'
