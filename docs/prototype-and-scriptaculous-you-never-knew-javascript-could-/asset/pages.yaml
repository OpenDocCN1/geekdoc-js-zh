- img_proc: true
  md: "its constructor to extract all the necessary information from the original\n\
    \nFile object:\n\n```\n#! /usr/bin/env ruby\n\nrequire 'cgi'\nrequire 'erb'\n\
    require 'webrick'\ninclude WEBrick\n\nclass LibInfo\n  attr_reader :name, :mtime,\
    \ :size\n\n  def initialize(name)\n    @name = File.basename(name, '.rb')\n  \
    \  @mtime = File.mtime(name)\n    @size = File.size(name)\n  end\n\n  def <<>>(other)\n\
    \    self.name <=> other.name\n  end\nend\n```\n\n```\ntemplate_text = File.read('suggestions.html')\n\
    suggestions = ERB.new(template_text)\n```\n\n```\nserver = HTTPServer.new(:Port\
    \ => 8042)\nserver.mount('/', HttpServlet::FileHandler, '.')\n```\n\n```\nserver.mount_proc('/completions')\
    \ do |request, response|\n  name_start = request.query['LibName']\n  suffix =\
    \ \"#{Regexp.escape(name_start)}\\.rb\"\n  libs = $LOAD_PATH.map { |dir|\n   \
    \ Dir.glob(dir + suffix, File::FNM_CASEFOLD).map { |f| LibInfo.new(f) }\n  }.flatten.uniq\n\
    \  response['Content-Type'] = 'text/html'\n  response.body = suggestions.result(binding)\n\
    end\n```\n\n```\ntrap('INT') { server.shutdown }\n```\n\n```\nserver.start\n```\n\
    \nThe (==) method on line 17 is probably very weird-looking to the non-Rubists\
    \ among you. We call it the \"Tie Fighter\" operator. It's used for sorting, as\
    \ a comparator between two LibInfo objects. It simply makes sure they are sorted\
    \ by name. On line 32, we notice that we simply map every File object we get to\
    \ a new LibInfo object."
