  md: '# Grabbing the Source Element


    +   * Prototype: event.element()

    * W3C: event.target

    * Internet Explorer: event.srcElement


    Internet Explorer uses yet another custom property on the event object. Note that
    the Prototype version returns the extended form of the element (more on the extension
    in the next chapter) and also guarantees you get an element back (not, say, a
    text node).


    # Getting Details on the Event


    +   * Prototype: event.pointerX(), event.pointerY(), event.isLeftClick().

    * W3C: event.clientX, event.clientY, event.button...

    * Internet Explorer: event.clientX, event.clientY, event.which...


    Internet Explorer has some specific properties, might most about mouse buttons
    and keys.


    # Event-Related Methods Straight in the DOM


    The three fundamental methods for event manipulation, observe(), stop-Observing(),
    and fire(); do not need to be accessed through the Event namespace. They are defined
    in the syntax blocks of the previous sections, they are part of the DOM extensions
    Prototype performs for every element, plus the document object itself. See Section
    7.2, Handling Events, on page 143 for details.


    # A Normalized Event Object


    In the same spirit, Prototype 1.6 introduced event object normalization; most
    methods used to be called from the Event namespace, such as element(), stop(),
    or isLeftClick(), can now be accessed directly on the event passed to handlers.
    W3C methods that browsers use as Internet Explorer currently fail to provide (for
    example, stopPropagation()) are filled when necessary. Finally, Prototype provides
    a few normalized properties (for example, target, relatedTarget, and pageX), as
    defined by the W3C, based on what the browser natively defines. Such normalization
    has trimming effect on Prototype code base and probably on yours, too! We will
    review and use them in the coming sections.'
