  md: '# Appendix A


    # Extending and Contributing


    It doesn''t take long before you end up with complicated scripts providing complex
    functionality. You might very well need to complement Prototype''s features with
    your own, either in separate objects or by extending existing ones. In this appendix,
    you''ll see how to extend Prototype objects and how to contribute back.


    # A.1 Building Over: Classes, Inheritance, and DOM Extension


    First you need to understand the object system in Prototype. As you may know,
    JavaScript is not a class-based language, with the usual class/object dichotomy
    and the usual class inheritance reflexes and habits. No JavaScript is a prototype-based
    language.


    Getting into the details of how this actually works would be way beyond the scope
    of this chapter, or even this book. You''ll find excellent articles about prototypes
    and other JavaScript OO issues (such as how to encode private,, and "privileged"
    methods, as well as "static" members) on the websites of several JavaScript groups,
    such as Douglas Crockford and Dean Edwards:


    +   * http://javascript.croford.com/prototypal.html

    * http://javascript.croford.com/private.html

    * http://www.litotes.demon.com/js/info/private_static.html

    * http://dean.edwards.name/base/


    However, we can simulate the traditional OO concepts, such as the class/object
    dichotomy, inheritance, mixins, and so on, using regular JavaScript and a healthy
    dose of syntactic sugar provided by Prototype.'
