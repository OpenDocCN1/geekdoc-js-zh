    # 5.3 Finding Elements and Applying Filters


    One of the most common usage patterns over a collection of elements is finding
    stuff, filtering the contents to retain only the relevant items. In this area,
    Iterable comes with a variety set of methods, catering to just about every common
    need:


    ```

    detect(find(iterator) -> firstElement | undefined

    filter/findAll(select(iterator)) -> Array

    grep(pattern, iterator = Prototype.K) -> Array

    partition(iterator = Prototype.K) -> [trueItems, falseItems]

    reject(iterator) -> Array

    ```


