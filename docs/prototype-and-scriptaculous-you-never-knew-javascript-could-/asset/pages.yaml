    +   - If you hit performance issues (typically frame drops), it''s usually a symptom
    that your DOM trees are too complex and/or you''re relying on a lot of opacity
    play. Several browsers (most notably, Macs, Firefox, and Safari 2) get sluggish
    in such situations. Reducing opacity-based effects, or the amount of effects running
    at the same time, helps a lot.


    # 14.5 Unlocking the Cool Factor: Effect Queues


    Chaining effects is a common need; maybe you want an element to fade in, and then
    you want to highlight it. Or perhaps it puls and finally fade out. Such cases
    can be well handled by manually defining the `afterFinish` callback.


    However, consider more advanced cases. One question that keeps popping up on the
    support mailing list sounds like this: "I have this list of items, and when I
    mouse over them, I''d like their picture to change with a fade-out + fade-in (not
    a crossfade)."


    Although the requirements seem difficult, the code for it is quite simple. Sure,
    it doesn''t rely on manually chaining effects afterFinish. That works most when
    you know the effect list in advance and doesn''t scale very well from a readability
    standpoint.


    No, the answer is effect queues let define multiple queues which to put effects.
    You don''t have to put them at the end of the queue, either. You can ask them
    to zip all the way to the front, for instance.


    # Using the Global Queue


    So far, we haven''t used the queue option in our effects. It defaults to `parallel`.
    When its value is a string, it is assumed to be a position specification in the
    global queue (quite simply, the queue whose name is ''global'').


    Queues are stored in the Effect.Queues repository and are accessed through its
    `get()` method, passing in the queue name. When adding'
