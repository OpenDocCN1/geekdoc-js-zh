  md: '# WHAT DOES OUR JavaScript LOOK LIKE WHEN USING PROTOTYPE?


    Look at the map() call on line 3; this is the all-purpose transformation method
    (pluck() and invoke()) are special-optimizations of it. We get an array of <li>...</li>
    text with "display" names inside, we join them with delimiters, and finally wrap
    the whole thing in a <ul>...</ul>. To guard against weird characters in the people
    data, we use `escapeHTML()` on the resulting strings, effectively "defanging"
    any markup in them.


    This is all just markup. To inject it into the DOM, we need grab the element with
    id="result", which is gracefully done with $(). This method also makes sure the
    element we get back is equipped with the countless DOM extensions Prototype provides,
    including the mighty update() method, that we use to inject our markup into the
    element''s DOM fragment.


    Notice that our anonymous method is passed to document.observe(), which is part
    of Prototype''s unified API to event handling (if you''ve ever played with your
    bytes have have noticed, for instance, that Internet Explorer ignores most of
    the official W3C specifications about it). Our method will run when the document''s
    DOM has finished loading, which is just what we need.


    Finally, the killer call is on line 8. You know these CSS 3 selectors we can''t
    just use because they''re not all supported yet? Well, we can use them with Prototype''s
    $(()) to select any set of elements in the DOM! Prototype comes with CSS-tweaking
    methods, such as className(Name), that take an extra CSS class name argument,
    but such methods are designed to work on the element we''re calling them on. How
    can we use it all the elements $(()) returned? What''s invoke() is for, and by
    using it lets us all matching elements concisely. The matching CSS is very short:


    ```

    Down load prototype/intro/basic/basic.css

    #li.alternate { font-weight: bold; color: green; }

    ```


    Once loaded, our page looks like Figure 2.1, on the next page.


    That''s it for a first run. Excited? I hope so. Take some time to breathe. If
