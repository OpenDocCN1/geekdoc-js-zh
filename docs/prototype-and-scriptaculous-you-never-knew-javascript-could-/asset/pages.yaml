  md: '# Version 1.6 Changed Everything!


    Prototype 1.6 was internally dubbed the "event overhaul" release. It brought about
    major changes in the API and provided many new, exciting, powerful features. This
    chapter attempts to systematically point out when a feature or syn-tax was changed
    or appeared in this release.


    # Internet Explorer vs. the Rest of the World


    Events can be a pretty messy thing to play with, mostly because there is no unified
    support across major browsers. More specifically, there are two factions: Microsoft
    Internet Explorer, which just walks its own path, and everyone else, follows W3C
    specifications. In this instance, the bible is DOM Level 2 Events. And on just
    about every aspect of dealing with events, Internet Explorer superbly ignores
    it and does things its own way (which must be a persisting it the six Microsoft
    experts who helped with the specification, especially Chris Wilson, Mr. Internet
    Explorer).


    Internet Explorer 7, with a fairly recent release, has not made an progress on
    the JavaScript/DOM front (or too little progress to warrant mention). It focused
    on "security" and catching up a bit on CSS, which is certainly good but won''t
    help us at all when it comes to event support and DOM manipulation.


    Never fear, though, for you now use Prototype! And as you may have come to expect,
    it comes to the rescue in these areas, too.


    # Smooth Operator: A Unified Interface to Events


    Indeed, Prototype provides a unified way of dealing with events. In the following
    sections, I will mention, for each feature, three syntaxes: Prototype, the W3C,
    and Internet Explorer. This should help those of you who are not familiar with
    the W3C''s or Internet Explorer''s ways understand exactly how to migrate your
    code, and it provides an informal conversation table.


    +   2. http://www.w3.org/TR/DOM-Level-2-Events/events.html'
