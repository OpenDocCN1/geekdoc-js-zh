  md: "# 18.2 A Simple Example\n\nIt's time we start playing with this. We'll need\
    \ the usual files: Prototype, the required script.aculous modules and the loader,\
    \ our custom CSS and JavaScript files. Because we are talking about in-place editing,\
    \ that means we expect the user to be able to modify content that will later be\
    \ saved. So, we will use template files and serve our demo dynamically, instead\
    \ of a static index.html file.\n\nFor starters, here is our template file, index.html:\n\
    \n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0//EN\"\n\"http://www.w3.org/TR/html1/html1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en-US\" xml:lang=\"en-US\"\
    >\n  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n\
    \  <title>Simple-in-place editing</title>\n  <link rel=\"stylesheet\" type=\"\
    text/css\" href=\"demo.css\" />\n  <script type=\"text/javascript\" src=\"prototype.js\"\
    ></script>\n  <script type=\"text/javascript\">\n  <script src=\"sc-rtaculous.js?load=effects,controls\"\
    ></script>\n  <script type=\"text/javascript\" src=\"demo.js\"></script>\n</head>\n\
    <body>\n<h1>Simple in-place editing</h1>\n<p id=\"freeZone\"><%= editableHTML\
    \ %></p>\n</body>\n</html>\",\n```\n\nThe CSS just could be well missing, because\
    \ it retains only our `<h1>` downplay:\n\n```\nh1 { font-size: 1.5em; }\n```\n\
    \nWe'll go with all the defaults here, so in-place editing will be extremely concise:\n\
    \n```\ndocument.observe('dom:loaded', function() {\nnew Ajax.InPlaceEditor('freeZone',\
    \ '/update');\n});\",\n```\n\nNeat, isn't it? It's short and to the point. The\
    \ constructor syntax is actually the following:\n\n```\nnew Ajax.InPlaceEditor(element,\
    \ url [, options])\n```"
