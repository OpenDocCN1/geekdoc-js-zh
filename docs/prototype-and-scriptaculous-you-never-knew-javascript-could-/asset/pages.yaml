  md: "# AUTOCCOMPLETING MULTIPLE VALUES IN ONE FIELD\n\nThe option that lets deal\
    \ with this is tokens. You just need to set it to an array of delimiter characters,\
    \ and the completion mechanism will automatically work with the latest token (text\
    \ part)—either the only one or the last delimiter. It's especially useful when\
    \ you're working with a multiple-line field and want to work on a per-line basis,\
    \ because you need to put the newline character ('\\n') in the allowed separators.\n\
    \ntokens defaults to an empty array, effectively disabling the multiple-value\
    \ mode. If you need only one delimiter, you can set it to a single string; you\
    \ don't have to bother with a single-element array.\n\nLet's adapt our Ajax example\
    \ to use a few options, including tokens. We'll adjust our page to use a multiple\
    \ input field, that is <textarea>:\n\n![](img/58ce77657835196da1e063557fbd9fb0_335_0.png)\n\
    \n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/html1/html1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en-US\">\n<head>\n <meta\
    \ http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\" />\n <title>Advanced\
    \ autocompletion</title>\n <link rel=\"stylesheet\" type=\"text/css\" href=\"\
    demo.css\" />\n <script type=\"text/javascript\" src=\"prototype.js\"></script>\n\
    \ <script type=\"text/javascript\"></script>\n <script src=\"scriptaculous.js?load=effects,controls\"\
    ></script>\n <script type=\"text/javascript\" src=\"demo.js\"></script>\n</head>\n\
    <body>\n<h1>Advanced autocompletion</h1>\n\n<form>\n <p>\n <label for=\"editLibNames\"\
    \ accesskey=\"L\">Ruby libraries</label><br>\n <textarea type=\"text\" id=\"editLibNames\"\
    \ name=\"libNames\"></textarea>\n <div id=\"libChoices\" class=\"autocomplete\"\
    ></div>\n </p>\n</form>\n</body>\n</html>\n```\n\nNotice that we adjusted the\
    \ id= and name= attributes accordingly. On the server side, we'd like to provide\
    \ richer content, with not only library names, but for each one, its last modification\
    \ time and its file size in bytes. To store all this data, we will create a LibInfo\
    \ class and use"
