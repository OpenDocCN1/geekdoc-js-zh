  md: '# ELEMENT, YOUR NEW BEST FRIEND 147


    Also note that we triggered the default tree injection, this Who event registration
    business happens when the page is loaded so as to make sure we have the basic
    DOM available to us and can bind event handlers without problems.


    To move ahead, we need to be able to select elements, which requires us to dynamically
    alter the CSS class name set of elements. From on, we''ll be able to adjust the
    form''s look and behavior depending on the selection state, and we''ll also be
    ready to implement element removal.


    # Tweaking CSS Class Names


    ```

    addClassName(className) → HTMLElement

    hasClassName(className) → Boolean

    removeClassName(className) → HTMLElement

    toggleClassName(className) → HTMLElement

    ```


    It''s really no big deal, or so it seems—the set of CSS classes pertaining to
    an element is stored as a whitespace-separated list in its class-attribute, which
    is accessible through its class property in Java-Script.


    The trick is that since it''s a string concatenation and not some form of container,
    we keep having to pull some string-fu to work with it. That is why Prototype provides
    these tricks for you.³


    The names are self-explanatory: addClassName() makes a given class name in the
    set (without hurting any existing class name in there), removeClassName() makes
    sure it gets out, hasClassName() tests whether it''s in, and toggleClassName()
    removes it if it''s there or adds it if it''s missing.


    Knowing this, we can start dealing with clicks on our tree zone. Creating an individual
    handler for all items in there would be wasteful. We can leverage event bubbling
    and attach only one handler at the tree level, which will get all clicks events
    happening somewhere in it. However, we need to be careful about which clicks we''re
    talking about:


    +   Clicks on checkboxes are left for the browser to deal with (they toggle the
    checkbox status). We''re not interfering with this.


    > ³ Until version 1.6, to use it internally on a tiny Element.classList class,
    which was made for a rather heavy-handed execution of these CSS manipulations.
    It''s now deprecated, along with the classNames() method, and these manipulations
    are implemented with optimized string manipulation.'
