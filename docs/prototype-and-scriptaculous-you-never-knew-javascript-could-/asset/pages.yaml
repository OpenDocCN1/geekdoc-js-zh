  md: 'Or you may just want to evaluate the scripts in an HTML fragment:


    ```

    extractScripts() → [ JSString, ... ]

    evalScripts() → [ resultValue, ... ]

    ```


    If you need the scripts in an HTML fragment, just call extractScripts(). It returns
    an array of scripts (without their enclosing <script> tags, just pure JavaScript).
    If you want to eval() all the scripts in a fragment, go directly with evalScripts().
    As a bonus, it will return an array of the result values for said scripts (a script
    with no specific return value yields undefined). By the way, do not mistake extractScripts()
    with strip-Scripts() (which strips the scripts out of the fragment and returns
    the expurgated fragment).


