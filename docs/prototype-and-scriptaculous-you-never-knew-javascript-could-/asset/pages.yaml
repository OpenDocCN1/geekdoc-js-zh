  md: '# Warning: Always Sync range with values!


    At the time of this writing, the computing of handle positions is entirely based
    on the range option. When using values, you leave range to its default (zero to
    one), your handles may vary very well away off the track.


    Conversely, if you use a range larger than the extreme values you''re allowing,
    portions of the track won''t be accessible to your handles.


    So when using values, I recommend you sure range uses the two extreme values.
    For instance:


    ```

    new Control.Slider(''handle1'', ''track1'', {

    range: $R(3, 10), values: $R(3, 10) // other options...

    });

    ```


    So let''s want to use a slider to choose our users integer from 3 to 10. We could
    do this with the following:


    ```

    new Control.Slider(''handle1'', ''track1'', {

    values: $R(3, 10), range: $R(3, 10)

    });

    ```


    Keep in mind the difference between these options'' behaviors: values uses the
    range''s enumerated values, which will be apart from each other by exactly one
    (as Number#Succi() uses an increment of one), and only these values will be allowed.
    On the other hand, range cares only about the minimum and maximum values, which
    Control.Slider uses to compute handles positions over the track.


    When values is defined, sliding the handles will "stick" to the nearest allowed
    positions as you''re dragging.


    Of course, you don''t have to use a regular series of values. It can be much more...
    personal:",


    ```

    new Control.Slider(''handle1'', ''track1'', { values: [1, 5, 38, 46] });

    ```


    Still, this may be a bit unwieldy for the user. It''s better then to use a regular
    series and map the raw values to those you need by using, for instance, one-to-one
    mapping between both arrays.'
  merge: -1
