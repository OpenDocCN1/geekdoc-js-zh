  md: 'Sliders are thin tracks with one or more handles on them that the user can
    drag along the track. The goal of a slider is to provide an alternative input
    method for defining a numerical value; the slider represents a range, and sliding
    a handle along the track defines a value within this range.


    Figure 19.1 provides an overview of what sliders can look like, with a rather
    simple look. Internally, they are implemented by `<div>` and `<span>` elements
    that we define, so the styling is entirely up to us. It will easily fit whatever
    design our page already uses.


    ![](img/58ce77657835196da1e063557fbd9fb0_372_0.png)


    Figure 19.1: A variety of possible sliders'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'We''ll need the slider.js module, which contains the Control.Slider class.

    There is no dependency on other script.aculo modules. So, our

    script.aculo defaulting will look, at minimum, like this:

    <script type="text/javascript" src="slider.js"></script>


    # 19.1 Creating a Simple Slider


    Let''s start with a slider somewhere lets the user define a numerical

    value within a given range.


    Creating a slider is, as usual, a matter of constructing a custom object

    of few elements in your page''s DOM. You''ll need two elements

    hhere one for the handle and one for the track.


    ```

    new Control.Slider(handle, track, [options])

    ```


    The track element is using a <div>, and the handle is a <div>

    <span> within the track element. Both can be passed

    by their id= by direct DOM references, as usual.


    Let''s imagine the following XHTML fragment:


    ```

    <div id="track1" class="track" style="width:20em">

    <div id="handle1" class="handle" style="width:0.5em;\</div>

    </div>

    ```


    Creating a basic, all-defaults slider would require this:


    ```

    new Control.Slider(''handle1'', ''track1'');

    ```


    To try this, create a simple demonstration that will let us experi-

    ment with the orientation of the slider (its axis, horizontal or vertical),

    the definition of a preset value, and range customization.


    Our test bench, index.html, will look like this:


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Strict//EN"

    http://www.w3.org/TR/xhtml1/xhtml-strict.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">

