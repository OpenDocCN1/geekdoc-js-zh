    # Joe Asks...

    Hang on... What''s This JSON Thingy?


    JSON stands for JavaScript Object Notation. It’s a simple representation of any
    object as text using only standard JavaScript syntax for literal values (objects,
    arrays, strings, numbers, booleans, and so on).


    It was formalized by Douglas Crockford, noted JavaScript guru. The specification
    is available at http://json.org.


    The major advantage of JSON is that it’s trivial to produce and parse in JavaScript,
    no matter how rich and structured the information may be. This makes it a tasty
    format for exchanging complex information with a server through say, Ajax. It’s
    rapidly becoming prevalent over XML in this case.


    The resulting API is as follows:


    ```

    Object.toJSON(obj) → String

    array.toJSON() → String

    date.toJSON() → String

    hash.toJSON() → String

    number.toJSON() → String

    string.toJSON() → String

    JsonString.evalJSON( {sanitize = false}) → Object

    ```


    # Converting Any Object to JSON


    The generic way of turning a JavaScript value into its JSON representation is
    to call toJSON(), passing the value. It honors the JSON serialization mechanism,
    which basically means the following:


    +   * Functions, DOM elements, undefined, and exotic stuff? are ignored.

    * null and booleans are represented literally.

    * If the object has a toJSON() method, it is used; Prototype does equip all relevant
    types (see the API block in the prior section) with appropriate toJSON() methods.
    It even equips Date with one


    > For instance, in Internet Explorer, objects that are accessed across COM+ bridge,
    which makes old Internet Explorer’s typeof burp the nonstandard ‘unknown’ value.'
