    You can adjust edge detection and scroll speed using the two companion options:
    scrollSensitivity, which determines how close to the container''s edges the cursor
    must get to trigger autoscrolling (defaults to 20 pixels), and scrollSpeed, which
    states how autoscrolling will go, in pixels per second (defaults to 15). This
    is actually a basis for putting the actual speed, which will increase the cursor
