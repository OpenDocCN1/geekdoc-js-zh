- img_proc: true
  md: '# BUILDING OVER: CLASSES, INHERITANCE, AND DOM Extension


    Prototype also adds new properties. First, every class features a superclass property,
    which refers to its parent class (or null if there is no parent class, which means
    the class was created with no parent class first argument to Class.create()).


    Second, every class also features subclasses property, which is an array of references
    to the classes that extend the current class. This property is never null, much
    less undefined. At worst, it''s an empty array. Whenever a class is created by
    extension of another, it registers itself in its parent''s subclasses property.
    Using these two properties, you can see it''s easy to walk a class hierarchy.


    A series of expressions based on our previous code:


    ```

    tom.constructor == Cat // true

    tom.constructor.superclass == Animal // true

    Cat.superclass == Animal // true

    Animal.superclass // null

    Animal.subclasses.length // 2

    Animal.subclasses.first() == Cat // true

    Animal.subclasses.last() == Mouse // true

    Cat.subclasses // []

    ```


    # Extending DOM Elements


    If you want to equip DOM elements with even more methods than Prototype already,
    you need to work with Element.addMethods(). It lets you add methods to elements
    or elements with specific tag names (say, <form> or <input> elements alone).


    Element.addMethods([tagNameOrNames] methods)


    The first, optional argument is a single tag name or an array of names. The mandatory
    argument is a hash-like object with the methods inside.


    Each method you define must take the element as its first argument. It does not
    have the guarantee that this will be bound to the element. The extension mechanism
    will let you invoke these methods without that first argument, right on the extended
    elements. You can also invoke them directly, passing an extended element to them.


    I advise you against hacking Prototype''s original method repositories (such as
    Element.Methods). Use your own repositories, and perform the addMethods() call
    with it.'
  merge: -1
