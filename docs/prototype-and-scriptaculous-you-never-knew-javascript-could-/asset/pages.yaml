    # What We Just Learned


    Ajax is a core skill for Web 2.0 development, and Prototype provides a hell of
    a lot in this regard. Let''s briefly review what we saw in this chapter:


    +   - First, we saw how Ajax was not always the best solution for the problem:
    it could degrade ease of use instead of improving it. Ajax-ifying a page should
    always be done with great care and thoroughly tested in various performance and
    accessibility contexts.

    - Prototype''s Ajax features are entirely based on one class: Ajax Request. Make
    sure you understand it and know all its features.

    - Synchronous requests (sometimes dubbed SJAX) should be avoided at all costs.
    They''re most likely to freeze the browser, effectively defeating, in a big way,
    the purpose of Ajax.

    - JSON should be your preferred format for data-only exchanges. Just forget XML.
    It''s too much of a bother to parse on the client side, and it''s verbose and
    hence bandwidth-heavy.

    - Whenever possible, prefer the hash form of the parameters option to its predigested
    query string variant. The object is easier to tweak and maintain.

    - Prototype employs HTTP outside of get and post by reverting post and using an
    extra _method field in the request.

    - You should not rely on nonguaranteed, intermediate-state callbacks.'
