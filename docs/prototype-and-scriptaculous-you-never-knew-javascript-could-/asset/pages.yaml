  md: '# BUILDING OVER: CLASSES, INHERITANCE, AND DOM EXTENSION


    Modules are also sets of instance methods, so you can modify methods

    to mix in, not just a literal of custom methods for your class:


    ```

    var Queue = Class.create(Enumerable, {

    // dequeue methods

    });

    ```


    Naturally, you can combine a parent class and modules:


    ```

    var ChildClass = Class.create(ParentClass, Enumerable, MyCoolModule, {

    // child''s instance methods

    });

    ```


    # Inheriting from Another Class


    This was a sore point of the former versions. "Traditional" inheritance

    in JavaScript is implemented in a rather disturbing fashion—by re-

    signing the prototype of the constructor function for the subclass. This

    can quickly lead to headaches for the nonexpert, Prototype hides all

    this complexity from you. When you want to define a class as a subclass

    of another one, you simply pass the superclass as the first argument

    to Class.create(element), by mixins and set of instance methods.


    Let''s look at an example:


    ![](img/58ce77657835196da1e063557fbd9fb0_393_0.png)


    ```

    var Cat = Class.create(Animal,

    eat: function($Super, food) {

    if (food instanceof Mouse) return $super(food);

    return this.say(''Yuck! I only eat mice.'');

    });

    ```


    ```

    var Mouse = Class.create(Animal); // Dumb subclass

    ```


    And that''s all there is to it! Note how we didn''t even need to declare\initialize()
    this time. We automatically inherit it from Animal, and because

    we not need to augment the inherited behavior for it, we don''t need

    to override it.


    # Overriding a Method and Calling the Inherited One


    I''m sure you noticed the $super first parameter to eat(). This is a specific

    name that Prototype detects. When you prepend your method''s signa-

    ture with it, you''ll get passed the inherited version of the method as

    argument, which you can then call when you need it. If you don''t need

    to invoke the inherited version, just don''t declare this first argument.'
