  md: '# 11.3 Obsolete Event Handlers


    A frequent concern is the memory cost of large amounts of event observers. When
    you navigate outside the page, you may risk memory leakage on Internet Explorer,
    if Prototype did not take special care of this browser by manually detaching the
    observers previously defined by the library. On the other hand, you may have registered
    numerous observers on a page fragment that gets replaced or removed. What then?


    Indeed, you would need to do some manual bookkeeping over your observers, because
    currently is no simple way to decommission all the observers on a DOM fragment
    (although you can now easily decommission all those on a single element). This
    is tedious, not to mention it''s very impractical. Many observers are internal
    to Prototype objects, and your user code has no easy means of accessing those
    references.


    One thing you can do is minimize the amount of observers you have. I often see
    people write code that creates trees of elements (say, a tree representation)
    and attach individual observers on each, for the same event. That''s ludicrous.
    Bubbling lets us define a single handler at the container level and use the event''s
    source concept to handle the specific item we''re dealing with. This goes a long
    way toward dramatically reducing the observer count. For a detailed example of
    this, look at how we did it with the staff tree on page 149.


    # 11.4 Recent Speed Boosts You Should Know About


    Every release of Prototype brings with it a handful of improvements that can sometimes
    be quite dramatic. Warnings that once good advice become obsolete. Here are a
    few speed boosts in 1.5.1 that you should know about:


    Selectors are blazing fast!


    Andrew Dupont, (to a lesser degree, yours) did a full rewrite of the Selector
    class, with some heavy inspiration from Jack Slorum''s DomQuery and a healthy
    dose of XPath-fu.


    Because of this, everything based on Selector (most notably $$) and the DOM traversal
    extensions) is now blazing fast. Really, at the time of this writing, it''s eating
    everyone''s lunch. Andrew'
