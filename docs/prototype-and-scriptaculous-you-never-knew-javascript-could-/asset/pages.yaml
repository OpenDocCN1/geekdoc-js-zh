  md: '# Toward A Better User Interface ▲ 174


    Navigation is important not only for users with special needs or mouse-devices.
    Users will automatically intuit navigation from the form’s layout. They will form
    expectations on the order of navigation for your fields, and efficient one wants
    to be able to use the keyboard to tab through your fields even if there is a mouse
    hand. Failing to meet their navigational expectations can lead to a lot of frustration.


    Management of field enablement has many ramifications, too. Whenever a field is
    enabled, it should be enabled for a good reason. Conversely, whenever a field
    should not be touched, make sure it cannot be touched. Disable for the time being.


    Properly disabling fields (including buttons) when they are irrelevant or inoperant
    is a much better way to go leaving them enabled and responding to their activation
    with “Not just now” message, or worse—doing nothing.


