    intersect(Array) → Array

    reduce() → Array | singleValue

    reverse([|inline = true]) → Array

    unique()([sorted = false]) → Array

    without(value...) → Array

    ```


    Most of these methods are easy to understand and use. A few deal with removing
    elements: clear() removes them all, returning the original array; empty() returns
    a new version except of any null or undefined element; intersect() returns a new
    set of the elements that exist both in the current array and in the one passed
    as a parameter (using the === operator for comparisons); uniq returns a new version
    without any duplicate, while retaining the original order; without(value...) returns
    a new version purged of any of the passed arguments.


    If you call uniq() on a large array that is already sorted, tell it so. It''ll
    work in linear time instead of quadratic time, resulting in a significant performance
    boost.


    A common operation when dealing with recursively built arrays is flatten(). As
    its name implies, it takes an arbitrarily nested array and turns it into a flat
    array using depth-first traversal; check the next example code for a demo. Another
    structural method is reduce(), which leaves multiple-element arrays untouched
    but turns single-element arrays into their unique element. Imagine gathering all
    the values for a given field name; if you end up with only one value, as most
    will be the case; you want to spare external code to index your result with [0].
    You could use reduce() on the array of arrays you got from the initial collection
    process.


    Finally, reverse() lets you reverse the contents of an array. Unless you explicitly
    pass false as its inline argument, it reverses the array itself. Otherwise, it
    clones the original and reverses the copy. In both cases, the reversed array is
    returned. As an interesting note, reverse() exists, strictly inline, as a native
    method for JavaScript arrays. Prototype replaces it with this version that lets
    you choose whether you need inline reversal, which delegates to the native unless
    you need to leave the original array untouched.


    +   6. Beware: it starts by using uniq() on the current array, which may have
    performance impacts as discussed in the next paragraph.'
