  md: 'The new init() method recursively injects your default node tree into our web
    page. There are a couple of things to look at:


    +   - Notice the idiom at the beginning of the init() function (from line 9).
    A common way to provide default values for arguments where a false-equivalent
    argument is invalid. Either is a valid value passed or an argument is missing,
    and we use the operator on the right as it. These two lines make sure calling
    init() with no arguments will start at the root level of the tree (staff is the
    id of <form>, remember?), both in the view and in our JavaScript structure.


    +   - You may be intrigued by this container property we''re tweaking on line
    12. This is because we want to make sure JavaScript nodes keep a reference on
    their container node. We''ll need that to properly handle node removal.


    +   - There''s also an important line. Line 16 contains a call to bind(). Without
    it, our anonymous function would be unbound and could not find its methods (it
    uses createDOMFragments and this.init). Explicitly binding it to this avoids such
    surprises.


    Rubber, meet: save all, refresh your web page in your browser of choice, fire
    up a JavaScript console (or better yet in Firefox, use Firebug''s console), and
    try it:


