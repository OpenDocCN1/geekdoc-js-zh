  md: "# GROUPING ELEMENTS AND PASTING COLLECTIONS TOGETHER\n\n# # Don’t Waste Time:\
    \ findAll vs. vs. reject\n\nThe reject() method does exactly the opposite of findAll()\
    \ (or select(), its alias). Instead of getting the elements that match the iterator,\
    \ it gets those that do *not*. It's fairly simple.\n\nOften enough, your code\
    \ needs to extract both sets: the selectees and the rejectees. The dummy way of\
    \ doing this is to call the two methods in sequence. This will iterate twice,\
    \ calling the iterator as much as a single pass could suffice. The smart way is\
    \ to use a context partition(). It sorts out the elements in two arrays: those\
    \ that pass the iterator and those that fail. Then it returns two sets wrapped\
    \ in another array (remember that JavaScript, like most languages, lets you return\
    \ one thing at a time).\n\nNote that partition() doesn’t require the iterator.\
    \ It will use the elements' boolean equivalence to sort them apart.\n\nHere is\
    \ an example using it:\n\n```\nDownload prototype/new/enumerable_partition.js\n\
    ```['hello', null, 42, false, true, 17].partition()\n// -> [['hello', 42, true,\
    \ 17], [null, false, undefined]]\n\nR(1, 10).partition(function(n) {\n  return\
    \ 0 == n % 2;\n})\n// -> [[2, 4, 6, 8, 10], [1, 3, 5, 7, 9]]\n```\n\nSo, let's\
    \ play with inGroupsOf() for starters. It's actually fairly simple. It takes the\
    \ full list of elements and arranges them in fixed-size groups. If there are not\
    \ enough elements for the last group to be complete, it gets filled with null\
    \ or the second, optional argument. Naturally, groups are composed in iterating\
    \ order.\n\nThis is actually a special case of generic grouping. You may well\
    \ want to fill up the last group, or you may want to do something altogether differ\
    \ to the groups as they’re created, turning them into something else. This is\
    \ why the slicing behavior resides in eachSlice(), which is then reused internally\
    \ by inGroupsOf(). You pass the maximum size of each slice and an optional iterator\
    \ that is used to transform each slice once they are all defined."
