  md: '# Chapter 20


    # Sound Without Flash


    Version 1.7 of script.aculo.us introduced a new tiny module that lets play sounds
    in your web pages without having to resort to an embedded, Flash-based player.
    The upshot is well, you don''t need Flash. That means you do not need to load
    a Flash sound-playing object in addition to your sound file(s). The potential
    issue, however, is that this module assumes your browser can natively process
    the sound file (for example, a MP3 file).


    # 20.1 Where Does It Work?


    This module works wherever your browser has native (or plug-in-based) support
    for the sound files you are using, which are assumed to be based on MPEG audio
    layer (the most common variant nowadays being MP3). This essentially means the
    following situations:


    +   - On X, you''re good to go. Every browser on OS X benefits from the platform''s
    QuickTime support for sound files. It Just Works.

    - On Windows, it works natively on Internet Explorer; otherwise, you usually need
    the QuickTime plug-in installed; it has pretty good market penetration (especially
    since, recently, it has been bundled with Windows versions of (iTunes and Safari),
    although it''s perhaps not quite as ubiquitous as Flash.

    - On Linux, as always, it depends on which packages were installed by the system''s
    administrator. But then, it''s as true for QuickTime as it is for Flash, and all
    major distributions for both.'
  merge: -1
  pgno: 385
