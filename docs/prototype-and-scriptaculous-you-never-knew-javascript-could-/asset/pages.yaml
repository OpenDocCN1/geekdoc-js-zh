  md: '# EXTENDING DOM ELEMENTS


    An extended element is a DOM element that also features all the methods we will
    see in the next section (plus extras one if it''s a form or field element, as
    we will see in Chapter 8, Form Management, on page 173). It is not a fresh object,
    distinct from the original DOM node. It''s the same node augmented with Prototype''s
    extensions.


    I could discourse for pages about Prototype''s extension mechanism, but this would
    wildly beyond the scope of this book. So instead of entering into the nifty-gritty
    details of stuff like Element.Methods.Simulated, or Element.attributeTranslations,
    let me answer the most common questions first.


    # Speed Cost


    On browsers providing DOM elements with a prototype, the cost is close to zero.
    Prototype automatically extends the relevant prototypes at loading time, which
    is blazing fast. This is, most notably, the case of all Gecko-based browsers (and
    hence Firefox), Opera (at least from version 9), Conqueror, and Safari (although
    specific versions of Safari may handle this in a specific way, the particulars
    are addressed by Prototype, and the speed is roughly identical).


    For browsers with no such support (for example, Internet Explorer), the element
    is extended on the fly the first time it is requested as an extended element (either
    through the $( function or through a direct call to Element.extend(), which your
    code should never need to do). Such an request can vary well inside Prototype''s
    code, because numerous methods in Prototype return extended elements. The element
    is then marked as extended, and there will be no further cost associated with
    requesting it as an extended element.


    However, on-the-fly extension is not a trivial cost in itself, and when applied
    over a large number of elements (depending on your environment, this can be anywhere
    100 and 1,000 elements), the speed hit can be noticeable. So, you should refrain
    from needlessly relying on $(() or other methods that guarantee extended results)
    when working with very large sets of elements. All extended methods can be called
    indirectly on “raw” elements (because they will use $(() internally, what may
    have been raw is now extended anyway...).'
