  md: '# Insertion methods


    ![](img/58ce77657835196da1e063557fbd9fb0_159_0.png)


    Figure 7.3: Demonstrating the insertion methods


    # Meeting the Family: Ancestors, Children, Siblings...


    adjacent(expression...) → [ HTMLElement, ... ]

    ancestors() → [ HTMLElement, ... ]

    childElements() → [ HTMLElement, ... ]

    descendantOf(ancestor) → Boolean

    dendants() → [ HTMLElement, ... ]

    empty() → Boolean

    extSiblings() → [ HTMLElement, ... ]

    previousSiblings() → [ HTMLElement, ... ]

    siblings() → [ HTMLElement, ... ]


    Besides regular DOM walking (with methods such as up()). Prototype can gather
    every node chain for you and with common lookup cases. It is important to note
    that these focus on elements. You won''t get any text node, entity reference node,
    or what.


    The methods ancestors(), descendants(), previousSiblings(), and next-Siblings()
    fetch the chain of elements you get in the usual directions: upward, downward,
    before, and after your node, respectively. A convenience siblings() returns the
    whole list of your elements, in document order. Finally, childElements() is a
    one-level-down narrowing of descendants(), returning only elements that are direct
    children of your element.'
