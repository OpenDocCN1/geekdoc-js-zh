    # change


    Applicable to <input>, <select>, and <textarea>.


    This is one bit peculiar. It''s supposed to trigger only when the element loses
    focus and its value changed since it last had the focus. This works pretty much
    way that on <input> and <textarea>, but things can be different for <select>,
    especially if it renders as a drop-down list (which is the default case, if you
    do not provide it with a size= attribute).


    In this latter context, this event may trigger whenever you change the selected
    value, either through the keyboard or through the mouse. Because of this, triggering
    large content changes (such as page reloads) on this event goes against accessibility,
