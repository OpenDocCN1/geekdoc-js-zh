  md: '# Registering an Event Listener


    +   * Prototype: $(event).observe(eventName, handler)

    * W3C: elt.addEventListener(eventName, handler, useCapture)

    * Internet Explorer: elt.attachEvent(onEvent, handler)


    Internet Explorer parts away from the W3C specs in that it does not use official
    event names (you need to use the on prefix) and does not support capture-style
    propagation³ [which is why Prototype ignores that aspect too, because it''s not
    portable so far).


    # Unregistering an Event Listener


    +   * Prototype: $(event).stopObserving(eventName[, handler])

    * W3C: elt.removeEventListener(eventName, handler, useCapture)

    * Internet Explorer: elt.detachEvent(onEvent, handler)


    We get the same kind of differences we had on registration.


    # Stopping Event Propagation


    +   * Prototype: event.stopPropagation() or event.stop()

    * W3C: event.stopPropagation()

    * Internet Explorer: event.cancelBubble = true


    Internet Explorer uses a custom property on the event object.


    # Preventing the Default Behavior


    +   * Prototype: event.preventDefault() or event.stop()

    * W3C: event.preventDefault()

    * Internet Explorer: event.returnValue = false


    Internet Explorer uses another custom property on the event object.


    +   3. If you''re unfamiliar with capture, don''t fret. I''ll explain the idea
    behind it in Section 6.1. A Quick Primer on Event Propagation, on page 117. Still,
    Prototype ditched it with version 1.6, so it''s not that big of a deal.'
