    +   - A lot of effects will have trouble with table-related elements (mostly `<tr>`,
    `<th>`, and `<td>`) on Internet Explorer. More often than not, making sure your
    rows are properly wrapped in a `<tbody>` (or `<head>` or `<tfoot>` (or `<footer>`))
