  md: 'That''s one consequence of bubbling, and it''s very useful; it lets us define
    generic listeners capable of dealing with the actual elements the event was triggered
    on (and sometimes helps reduce the amount of listeners you''re registering, which
    has a significant positive impact on your page''s setup time).


    Another important advantage of leveraging bubbling is that you can tweak the elements
    inside your container as much as you need, without having to re-register the handlers
    for them. You didn''t register previous handlers on the elements you''re replacing,
    removing, or adding to; you registered it on the container, which is still there
    and will be glad to grab the bubbling events originated from new or updated elements
    inside it.


    Now click the first list event. You get two messages. First you get something
    like *click from li (bubbler)* and then *click from li (doc)*. The order in which
    you registered the listeners is irrelevant; it''s where you click that counts.
    The first listener from the click target outward is the bubbler-registered one,
    and then the event bubbles up to the document level.


    Note that you can stop this propagation at any level by calling the proper method
    on the event object. The unified Prototype way of doing this is `event.stop()`.


    The event will simply not bubble (it will also cancel its default behavior; if
    you don''t want it to, use `event.stopPropagation()` instead, which Prototype
    guarantees even on Internet Explorer). This is useful when your listener takes
    definitive action for the event and there is no need to let listeners higher up
    the document hierarchy pay attention to it.


    # Capture


    Event capture is the second form propagation can take, and it lets you implement
    local censorship on events. Basically, whenever an event occurs, any listener
    registered in capture mode gets triggered in sequence, from the outside inward.
    Any listener that stops propagation effectively censors the event; it gets trumped,
    shot, chopped to bits, seasoned, and thrown to the dogs your browser keeps in
    a small pen next to the garbage collector.


    This can be a powerful tool (for example, to implement "glass panes" over the
    whole UI, which could be nice for fake modal dialog boxes); alas, it is currently
    *not* supported by Internet Explorer, which means nobody can risk using it on
    anything other than an intra-'
