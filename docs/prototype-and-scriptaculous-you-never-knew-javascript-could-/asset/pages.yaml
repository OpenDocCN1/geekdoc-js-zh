    attribute. It takes care of false and null values by removing the attribute altogether;
    conversely, true values, used to express the presence of a "flag" attribute (such
    as disabled=selected=), follow XHTML guidelines by setting the attribute''s value
    to its own name (for example, selected=''selected''). Other attributes do not
    set without tweaking.


