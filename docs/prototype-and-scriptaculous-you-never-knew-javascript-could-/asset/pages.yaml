    # 14.3 Diving into Effects


    Before going ahead with combined effects, we need to review generic options and
    callbacks that are available on all effects. Many of those were alluded to in
    the prior section, so it''s time you get the nitty-gritty details.


    # Common Effect Options


    Effects come with a number of standard options. Knowing them is one of the keys
    to successful effects usage (and something too few developers take the time to
    learn).'
