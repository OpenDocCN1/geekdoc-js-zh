- img_proc: true
  md: '+   Finally, you can tell the in-place editing mechanism that the server won''t
    return a finalized markup by setting the htmlResponse option to false (defaults
    to true). The system will then revert to using AjaxRequest object, which can still
    autvaluate JavaScript-typed results (see Section 9.2, Other Things Your Ajax.Request
    Can Do, on page 205 for more details on this). More generally, you can pass your
    own callbacks (for example, onComplete to deal with any response you send). Such
    a callback must be specified at the regular options level, not in ajaxOptions.


    # 18.4 Customizing the Appearance


    There''s a lot you can do to tailor the appearance of in-place editors to your
    needs: buttons or links (or none), additional texts, styling, controls, and callbacks
    that let you add custom logic, including visual effects, to various stages of
    the editor''s life cycle.


    # Buttons vs. Links


    As noticed, by default, you get an OK button and a cancel link. This is the original
    choice, made back when the dinosaurs still roared the earth. You can customize
    this in a variety of ways:


    +   The okControl and cancelControl options each can take three values: ''button'',
    ''link'', and false. The latter choice removes the respective widget, pure and
    simple. Respective defaults are, obviously, ''button'' and ''link''.


    +   You can change the text of the buttons or links with the text and cancel options,
    which default to ''ok'' and ''cancel'', respectively.

    You can go bare and strip both controls, which leaves you with the keyboard hooks
    on Return and Esc. This alone, however, is a risky choice, because plenty of users
    may not hit any of these keys. So, you can make sure the modification is committed
    as soon as the focus leaves the editable field (for example, as user clicks everywhere).
    Simply set the submitOnBlur option to true (defaults to false). Of course, if
    this is enabled, OK/cancel controls become entirely useless; clicking them would
    first cause a focus loss, which would immediately trigger submission of the new
    content anyway.


    We''ll see variants based on these options, and a few more, in the following section.'
