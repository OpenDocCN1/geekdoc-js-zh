    \ processForm);\n  $(btnAddChild).observe('click',\n    processForm.bindEventListener(this,\
    \ true));\n});\n```\n\nThere are a few items of interest in this code. The idea\
    \ is that processForm() deals with both the submission button and the Add as child\
