  md: '# Technical Limitations You Should Know About


    There are essentially two constraints in Ajax: the SOP and the two-request limit.


    The Same Origin Policy (SOP) essentially mandates that Ajax requests access another
    fully qualified domain than the page from which they are running. You can''t even
    access the same domain from another port. This makes a lot of sense, securitywise,
    because this would open a Pandora’s box of cross-site scripting (XSS) attacks.
    Imagine a malicious script running on a sensitive intranet page that use its privileged
    position to access confidential data and then silently send those over to its
    cracking domain. . . . Not good.


    The SOP is all over XSS (how’s that for a geek phrase?) and also describes what
    other in the browser a given script is allowed to access (for example, explore
    or modify their DOM). Originated in Netscape Communicator 2.0, this approach is
    widely supported by modern browsers (although as usual, Internet explores the
    lone wolf on this). You’ll find a great description of the SOP, and links to more
    detailed resources, on the ever-useful Wikipedia: http://en.wikipedia.org/wiki/Same_origin_policy/


    The second general issue you need to keep in mind when designing Ajax-based pages,
    especially if you intend to use Ajax heavily, is the infamous two-request limit.
    This is a recommendation in the defining standard for us: HTTP/1.1. It is described
    in RFC 2616, and section 8.4.1 clearly states that “a single-user client SHOULD
    NOT maintain more than 2 connections with any server or proxy. [...]” This is
    intended to improve HTTP response time and avoid congestion.


    Most modern browsers abide by this rule, including Internet Explorer. True, you
    can tweak this, but this requires manual client-side configuration (for Internet
    Explorer; you would have to tweak a registry key, and Firefox would have you tinker
    at internal options using about:config). In short, unless you have an absolute
    need for simultaneous request, have servers that can indeed handle the resulting
    load, and have enough control over the whole browser base (as in an intranet),
    you can forget using more than two connections at once.


    This works for any request, incidentally. When the browser fetches external resources
    for your web page, such as images, CSS files, script files, and the like, it follows
    this guideline as well. Have a look at Fire-


    +   - http://tools.ietf.org/html/rfc2616#section-8.1.4'
