    // Alerts 'one', 'two', then 'three'\n['one', 'two', 'three'].each(function(s)\
    \ {\n  alert(s);\n});\n\n// Alerts 0: hello 1: world\n['hello', 'world'].each(function(s,\
    \ index) {\n  alert(index + ': ' + s);\n});\n```\n\nWe'll get to the context parameter\
    \ in a moment, but there are few things I'd like to explain first, which are generally\
    \ more useful.\n\n# Short-Circuiting Enumerations\n\nWith vanilla loop constructs\
    \ (such as for or while), you can use two short-circuit instructions: continue\
    \ the remainder of the loop body and goes to the next iteration (if any), while\
    \ break terminates the loop altogether. Such instructions, or their equivalents,\
    \ are found in many languages (such as C/C++, Java, C#, and Delphi).\n\nWhat seems\
    \ to be a problem here is that we do not use vanilla loops; we use each()! So\
    \ how can we obtain the same kind of functionality? Well easily. We can skip the\
    \ remainder of the current iteration by simply returning from the iterator function,\
    \ using return as the Gods of Code intended us to use. However, there is no such\
    \ straightforward substitute for break. That is why Prototype introduces a specific\
    \ exception constant, named $break. Just throw it from your iterator, and each()\
    \ will automatically catch it, cleanly terminate the loop, and return normally."
