  md: "...but we don't use any options yet. The final piece for our puzzle is\nthe\
    \ server script, of course. Here it is:\n\n```\n#! /usr/bin/env ruby\n\nrequire\
    \ 'cgi'\nrequire 'erb'\nrequire 'webrick'\ninclude WebBrick\n\ntemplate_text =\
    \ File.read('index.rhtml')\ntemplate = ERB.new(template_text)\n\nserver = HTTPServer.new(:Port\
    \ => 8042)\nserver.mount('/', HTTPServer::FileHandler, '.')\n\neditableHTML =\
    \ \n'Click here to edit with <code>Ajax.InPlaceEditor</code>&#8230;'\n\nserver.mount_proc('/update')\
    \ do |request, response|\nresponse['Content-Type'] = 'text/html'\nresponse.body\
    \ = template.result(binding)\nend\n\nserver.mount_proc('/update') do |request,\
    \ response|\neditableHTML = request.query['value']\nresponse.body = editableHTML\n\
    end\n\ntrap('INT') { server.shutdown }\n\nserver.start\n```\n\nNote the default\
    \ content, on line 15. More important, note the code\nof line 24. This round-trip\
    \ is a bit overkill, because we do not\nuse any alternative syntax for the content,\
    \ and the client side could go\nwith the raw content typed by the user. But we\
    \ went with all\ndefault, which assume the server will return the final content.\
    \ After\neven with no alternative syntax, we could well strip specific\ntags,\
    \ or limit the length, or whatever. It's your code on the server. You\ncan implement\
    \ whatever validation logic you want!\n\nNow that we have everything in place,\
    \ kill any running example\nYou might still have around, and run this the usual\
    \ way (ruby server.rb).\nFigure 18.1, on the next page, is a montage of the successive\
    \ stages in\nusing our in-place editor: basic, hovering, editing, and edited.\n\
    You not notice the \"saving\" stage because we are running against a\nlocal server,\
    \ that not doing anything long, responds too fast for this\nstep to linger at\
    \ all."
