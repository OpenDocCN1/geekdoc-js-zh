  md: '# Always Remember invoke and pluck


    These methods address two very common needs:


    +   - invoke() calls a specific method on each element and returns an array of
    the results.

    - pluck() gets a specific property from each element and returns an array of their
    values.


    When you''re looking for one of these behaviors, you should forget(collect) and
    go with the specific method. I mean it. Why? Because not only does it make your
    code consistent and yet more readable, it also makes it more efficient.


    You see, collect() takes an iterator, which will be invoked for each element,
    with the associated costs of function call and lexical closure. On the other hand,
    pluck() do not need iterators, avoiding all these extra costs. It''s just better
    in all respects.


    As always, examples help make it all click:


    ```

    Download prototype/new/enumerable_invokePluck.js

    [''hello'', ''world'', ''cool!''].invoke(toUpperCase)

    // [''HELLO'', ''WORLD'', ''COOL!'']


    [''hello'', ''world'', ''cool!''].invoke(substring, 0, 3)

    // [''hel'', ''wor'', ''coo'']


    // Of course, this works on Prototype extensions (why shouldn''t it?)

    $(navBar, ''adsBar'', ''footer'').invoke(hide)


    [''hello'', ''world'', ''this'', ''is'', ''nice''].pluck(length)

    // -> [5, 5, 4, 3, 4]


    $(''cool!'').pluck(''tagName'').sort().uniq(true)

    // -> sorted list of unique canonical tag names for elements with this

    // specific CSS class...

    ```


