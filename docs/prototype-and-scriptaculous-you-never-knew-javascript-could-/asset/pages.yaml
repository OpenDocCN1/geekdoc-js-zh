  md: '# CUSTOMIZING DROP BEHAVIOR


    Naturally, you can further refine your dropping policy by mixing both

    options tether.


    To demonstrate this, we will build a simple shopping cart. To keep things

    simple, we will stay on the client side, but notifying the server is as simple

    as creating an Ajax.Request in the drop zone''s onDrop callback.


    Our simple shopping cart will feature several items we can put (as many

    times as we''d like) in our shopping cart. We can also decide to put

    stuff out of the shopping cart by dropping them into the trash can.

    Obviously, there would be no point in draggingable items directly to

    the trash, and we not let the user drag items back into obtainable

    items.


    So, let''s mock a massively discounted (and massively reduced) version

    of the Pragmatic Bookshelf''s online store. The XHTML page looks

    like this:


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0 Strict//EN"

    "http://www.w3.org/TR/html11/DTD/html1-strict.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en-US" xml:lang="en-US">

    <head>

    <meta http="Content-Type" content="text/html; charset=utf-8" />

    <title>Discount bookshelf</title>

    <link rel="stylesheet" type="text/css" href="demo.css" />

    <script type="text/javascript" src="prototype.js"></script>

    <script type="text/javascript" src="scriptactous.js?load=effects,dragdrop"></script>

    <script type="text/javascript" src="demo.js"></script>

    </head>

    <body>

    <h1>Discount bookshelf</h1>

    <div id="products">

    <img src="rails2.jpg" id="rails2" alt="Great book #1" class="product" />

    <img src="svn2.jpg" id="svn2" alt="Great book #2" class="product" />

    </div>

    <h2>Your cart:</h2>

    <div id="cart"></div>

    <p id="trash"><img src="trash.png" alt="Trashcan" /></p>

    </body>

    </html>

    ```'
  merge: -1
