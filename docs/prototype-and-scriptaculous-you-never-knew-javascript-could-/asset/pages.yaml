  md: '# Pitching In with Callbacks


    Ajax.InPlaceEditor lets you hook in at all important times in order to customize
    the behavior of the widget. The following are all the defined callbacks (somewhat)
    chronological order:


    onEnterHover


    Triggered when the mouse stops hovering over the element (because it is still
    in nonditable mode). This defaults to setting its inline style''s background color
