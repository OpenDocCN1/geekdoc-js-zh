  md: '# WHAT''S-In-Place Editing EXACTLY?


    If you use an alternate form of the contents on the server side and just generate
    its XHTML representation to produce this content, you can edit to the "source"
    text through Ajax and have the user edit this original content (for example, Textile¹
    or Markdown² text instead of actual XHTML).


    +   Editing pages. In regular mode, hitting Return (on singleline editors) or
    triggering the submission control (button or link) commits; conversely, hitting
    Esc or triggering the cancellation control reverts.

    However, you may elect not to have any OK/cancel controls. Submitting pages when
    hitting Return (for example, by clicking elsewhere or Tab), and reverting is still
    bound to Esc. This is a popular behavior, because it unutters the editing area.


    +   If the editing is canceled, the original content is restored. If it is committed,
    the UI goes away and is replaced by a message stating that the modification is
    being saved; when the modification is saved, the original element reappears, with
    updated content. If you used an alternate syntax for the edited content, the server
    will have sent the XHTML conversion for your static element to use instead of
    the "source" text.

    The element undergoes a quick highlight effect to state its recent modification.


    We''ll explore these steps, and the various options and callbacks available for
    our customizing pleasure, in the following sections.


    # Using In-Place Editors in Our Code


    You''ll need the controls.js module, which also contains, as you''ll no doubt
    recall, the autocompletion stuff. Because default behaviors for in-place editing
    rely heavily on the Highlight object, you''ll also need to include effects.js.
    Your script.aculo.js loading will look like, minimum, like this:


    ```

    <script type="text/javascript" src="scriptaculous.js?load=effects,controls"></script>

    ```


    +   1. http://www.textism.com/tools/textile/

    2. http://daringfireball.net/projects/markdown/'
