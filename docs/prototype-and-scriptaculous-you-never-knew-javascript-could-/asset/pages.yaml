  md: "# Joe Asks...\n\n# Positioning Container? What Are the Ground Rules?\n\nThe\
    \ full details are at http://www.w3.org/TR/CSS21/visudet.html#containing-block-details.\n\
    Make a long story short and ignoring a few edge cases,\nit goes like this:\n\n\
    +   - If you're relatively positioned, it's the content area of your nearest block-level\
    \ ancestor.\n- If you're fixed, it's the viewport itself.\n- If you're absolutely\
    \ positioned, it's usually the padding edge (that is, immediately inside the border)\
    \ of your nearest positioned ancestor (regardless of its positioning being relative,\
    \ fixed, or absolute).\n\nSo, the options argument lets you specify which properties\
    \ you want to clone, using booleans setLeft, scrollTop, setWidth andHeight. They\
    \ all default to true. You can also specify an offset from your source element's\
    \ position using the offsetLeft and paddingTop properties (both default to zero).\n\
    \nFor instance, script.aculo.us's Autocomplete.Base code does something like the\
    \ following:\n\n```\nupdate.clonePosition(element,\n  setHeight: false,\n  offsetTop:\
    \ element.offsetTop\n));\n```\n\nThis positions the suggestion list (update) right\
    \ below the text field, with the same width as the text field but retaining its\
    \ original height.\n\nFigure 7.4, on the next page, attempts to convey the interrelations\
    \ of the -Offset methods.\n\nThe source archive for this book contains, in code/prototype/dom/\n\
    positioning, a live example that reproduces 7.4 and lets you interactively play\
    \ with scrolls. Hovering on the colored zones will update the results of all four\
    \ offset methods in a top-right display."
