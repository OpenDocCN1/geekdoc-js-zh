  md: '# HOW TO CREATE OUR OWN EFFECTS


    | Property | Description |

    | --- | --- |

    | startOn | |


    The moment (expressed in milliseconds since the epoch, the usual numerical form
    of times) at which the effect should start (based on the delay option).


    A string that tells you where effect stands in its life cycle. The possible values
    are idle (not started yet), running, and finished.


    The total amount of frames for the effect, based on its duration and fps options.
    By way of consequence, this is the maximum amount of calls to your update() method.


    The duration of your effect, in milliseconds. It''s based on the duration option.


    Note that it is possible to short-circuit an effect, abruptly stopping it where
    it stands, by calling its cancel() method. This does not trigger the finish callbacks.


    Speaking of callbacks, in order to let users of your shiny new effect use them,
    you will not hook them up for internal processing. The effect lets you define
    identical callbacks with the Internal pre-fix (for example, afterInternal()),
    which are called right before the "public" ones. This is where you should put
    code that doesn''t fit in the clear-cut methods you redefine.


    The execution of an effect is sequenced as follows, codewise:


    +   1. The usual initialize() method is called. It''s all yours. You must end
    it with a call to start(), passing the options hash.

    2. start() takes care of all the boilerplate setup. Before scheduling your effect
    in the proper queue, it triggers the beforeStart() callback.

    3. As soon as the effect is scheduled for execution, its loop() method kicks in,
    which verifies that it should still run (it might be overdue) and, if not, straight
    to the finish line. Otherwise, it computes its regular position and frame number
    and delegates to render.

    4. render() takes care of the setup callbacks on the first rendering, calling
    your optional setup() method between the two, and delegates to the effect''s chosen
    transition to adjust the rendering position. It then calls your optional update()
    method with it.

    5. The effect has reached its end. It renders its final position, it gets decommissioned
    from the effect queue, and your optional finish() method is called between the
    two finish callbacks.'
