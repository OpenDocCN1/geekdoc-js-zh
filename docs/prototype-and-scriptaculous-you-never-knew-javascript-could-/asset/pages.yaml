    \ methods are both implemented using `inject()` over an initially empty array,\
    \ which `accumulates` values over time.\n\nInjection is commonly used to create\
    \ internal sums or products:\n\n```\n$R(1,10).inject(0,function(acc, n) { return\
    \ acc + n; })\n --> 55 (sum of 1 to 10)\n```\n\n```\n$R(2,5).inject(1, function(acc,\
    \ n) { return acc * n; })\n --> 120 (factorial 5)\n```\n\nHowever, we can use\
