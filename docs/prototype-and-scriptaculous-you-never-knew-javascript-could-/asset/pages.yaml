    \ method for the core Effect.Opacity. It simply goes like this:\n```javascript\n\
    update: function(position) {\n  this.element.opacity(position);\n}\n```\n\n+ \
    \  - finish() is called after the last rendering and after the effect has been\
    \ decommissioned from its queue. You'll mostly use it when your effect is supposed\
