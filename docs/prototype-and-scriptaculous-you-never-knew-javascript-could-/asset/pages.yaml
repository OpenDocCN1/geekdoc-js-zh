- img_proc: true
  md: "This behavior is controlled by the constraint option, which defaults here\n\
    to vertical. And indeed, for most cases, it's a reasonable constraint.\n\nBut\
    \ your list must be horizontally displayed, in which case you'll need\nto constrain\
    \ movement accordingly. You may even have multiple lists\nand to swap elements\
    \ between them, a frequent use we'll\nillrate later in this chapter, at which\
    \ point you'll need to remove\nmovement constraints altogether.\n\nTo address\
    \ all three cases, constraint has three possible values, which\nwe already listed\
    \ back when looking at Draggable options: 'vertical' (the\ndefault), 'horizontal',\
    \ and false (no constraint at all).\n\nAlso note that Sortable relies on its overlap\
    \ option to determine whether\ndragged element should change position in the list.\
    \ When using a\\constrained layout (that is, a constraint option that is not false),\
    \ overlap\nshould use a matching value.\n\nLet's see a quick example of a horizontal\
    \ layout. We will take the following\nXHTML list:\n\n```\n<lt id=\"guys\">\n \
    \ &lt;li id=\"guy_1\"\\gt;Alexis Toulotte&lt;/li&gt;\n  &lt;li id=\"guy_2\"\\\
    gt;Amir Jaballah&lt;/li&gt;\n  &lt;li id=\"guy_3\"\\gt;Anne-Julie Peschaud&lt;/li&gt;\n\
    \  &lt;li id=\"guy_4\"\\gt;Élodie Jaubert&lt;/li&gt;\n  &lt;li id=\"guy_5\"\\\
    gt;Erin Odenweaver&lt;/li&gt;\n&lt;/ul&gt;\n```\n\nThen we'll style it to obtain\
    \ a horizontality:\n\n```\nh1 { font-size: 1.5em; }\n#guys {\n  list-style-type:\
    \ none;\n  padding: 0;\n}\n#guys li {\n  float: left; cursor: move;\n  margin-left:\
    \ 1em; padding: 0.2em; width: 10em;\n  border: 0.05em solid gray; background:\
    \ #ddd;\n  text-align: center;\n}\n```"
  merge: -1
  pgno: 312
- img_proc: true
  md: "# Thinking horizontally\n\n![](img/58ce77657835196da1e063557fbd9fb0_313_0.png)\n\
    \nFigure 15.9: Horizontal reordering\n\nFinally, we'll adjust our scripting so\
    \ it takes horizontality into account:\n\n```\nDownload scriptaculous/dragdrop/sortable3/demo.js\n\
    document.observe(':dom: 'loaded', function() {\n  Sortable.create('guys', { constraint:\
    \ 'horizontal',\n    overlap: 'horizontal' });\n```\n\nNotice how we care to synchronize\
    \ the constraint and overlap options in a single-direction reordering like this?\
    \ Figure 15.9 uses a monitor to illustrate reordering in action on such a list.\n\
    \n# Sorting More Than Regular Lists\n\nYou're absolutely required to use list\
    \ markup (that is, `<ul>`, `<ol>`, and `<li>`) in order to get reordering capabilities.\
    \ Sortable lets you specify the tag identifying which elements of the container\
    \ you are up for dragging.\n\nYou can express this primarily with the `tag` option,\
    \ which defaults to 'li'. All child elements with the tag name you provide are\
    \ then taken into account. For instance, you have the following markup:\n\n```\n\
    <div id=\"avatars\">\n  <img src=\"/avatars/john_1.jpg\" alt=\"John (favorite)\"\
    />\n  <img src=\"/avatars/john_2.jpg\" alt=\"John (regular)\"/>\n  <img src=\"\
    /avatars/john_3.jpg\" alt=\"John (wacky)\"/>\n</div>\n```"
  merge: -1
