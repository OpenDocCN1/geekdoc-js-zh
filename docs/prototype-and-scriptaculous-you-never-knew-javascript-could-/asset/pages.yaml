    \ override them: start(), loop(), render() (it would, anyway, be redefined dynamically\
    \ by start()), and cancel().\n\nOn the other hand, the following methods are undefined\
    \ by default and are designed for you to define according to your effect's logic.\
    \ They are all optional, because their usefulness depends on your effect's nature:\n\
    \n+   - setup() is called before the first actual rendering.\n- update(pos) is\
    \ called for every rendering, with a position adjusted by the transition function.\
