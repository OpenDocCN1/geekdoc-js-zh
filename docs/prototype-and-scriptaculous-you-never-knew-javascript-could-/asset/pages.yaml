    # 9.7 Ajax Considered Harmful? Thinking About Accessibility and Ergonomy


    Before we move ahead, I would much like to talk about a bit accessibility, not
    only pertaining to Ajax but to JavaScript more generally. This falls a bit outside
    the scope of this book, so I''ll try to be concise yet.


    Most people think accessibility and scripting (especially Ajax) are intrinsically
    irreilable. It is painfully untrue. As with most things, best practices go a long
    way toward having your cake and eating it. There is no titanic effort here—just
    proper habits make yours.


    # Not Using JavaScript? No Problem!


    Unless you are working on an intranet-style application where you have control
    over the browsers, you cannot always afford to require JavaScript. Except perhaps
    for applications where JavaScript-powered features are key to your product''s
    value (which as most 37signals applications, one could argue), JavaScript should
    always be used to improve'
