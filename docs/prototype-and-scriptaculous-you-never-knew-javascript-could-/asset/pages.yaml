  md: 'On drag start, the element is also pushed “up,” from a 3D perspective, to be
    “closer” to the eye of the user; this is done by adjusting its CSS z-index property,
    according to the zindex option. The end of drag restores the original setting.


    # Option Description


    The z-index (“layer”) of the element while being dragged. This defaults to 1000
    in order to ensure it''s above anything else. When manually dealing with such
    ordering, you may want to set it to false, as we do in Section 9.2, Get It: Geometry
    Persistence, on page 192.


    Finally, in certain circumstances, you may not want the drag to be initiated immediately
    (that is, as soon as the mouse button is pressed). Perhaps your element is also
    clickable, and you don''t want a regular click to trigger a drag as well. To this
    end, the delay option lets you specify a duration, in milliseconds,¹ for the mouse
    button to remain pressed before the drag is triggered. Naturally, this defaults
    to zero, but setting it as small as 500 can make all the difference in the world.


    # Option Description


    How the button should be down before we actually start dragging. This is in seconds,
    and it defaults to zero. The drag will align on the mouse pointer when the delay
    expires. If the button is released before the delay is over, no drag is attempted.


    # Controlling How the Draggable Element Moves


    By default, the user can drag your element all over the place. This is fine for
    many situations, but there are cases where you''d like to constrain how the element
    moves. There are basically two needs you may have, perhaps combined, too:


    +   - The element must not move on a pixel basis but by larger increments (say,
    by 10-pixel steps). These increments are not necessarily the same horizontally
    and vertically.


    +   - The element must not move outside a given bounding box (its container element,
    for instance, or some arbitrary box you defined).


    1. This is actually the only duration-related option in all of Prototype and script.aculo.us
    that is in milliseconds, not in seconds.'
