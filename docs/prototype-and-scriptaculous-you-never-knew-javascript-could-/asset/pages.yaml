  md: '# Now about the rest:


    # Summaries


    A summary needs to be as expressive as possible. By “expressive,” I mean concise
    and informational enough. For instance, “The Back button clears out autocompleter
    fields in Mozilla-based browsers” is pretty good, but “Ajax doesn’t work” is as
    lame as it gets.


    Another very important part of summaries is the informal standards in their prefixes.
    You should always prefix a ticket that comes with a patch using [PATCH]. If this
    patch comes with tests, you should add [TEST]. This helps triage a lot for Prototype
    Core.


    # Descriptions


    Always use clear descriptions. Classic copy advice holds true—simple sentences,
    clear punctuation, and so on. Make sure you use proper markup for code, to be
    inline (for example, variable method names) or as a separate block (code samples).
    The trick is to wrap code between triple braces, like this:


    The following code:


    ```

    ```

    var obj = HumongousLib.dom.util.short.get(''someID'');

    HumongousLib.effects.visual.simple.hide(obj);

    ```

    ```


    > ... OK, I realized ({{someID''}}} rules. Do you get a lot of switches?


    This makes it easier on the eyes of everybody.


    If you’re reporting a bug or editing an existing bug report, be sure to include
    clear steps for reproducing it. You may have to put up a minimalistic reproducible
    case online (aww, aren’t you!), in which case the description is an ideal place
    to put a link to it. URLs get linked automatically. By the way, Trac’s number
    formats get detected and linked. Most notably, you can use #ticketId, [changeSetId],
    and [reportId]. Use the WikiFormatting link above the description zone for the
    full details of the available syntax.'
