    # 10.1 Storing Values in a Hash


    Hash was completely rewritten for Prototype 1.6. If you used it in previous versions,
    pay special attention!


    Many languages feature an associative array type. You know, it has some unique
    keys, which can be just about anything and are associated with values. It''s common
    (and just indispensable) in scripting languages such as PHP, Perl, or Ruby, and
    it can also be found in libraries tied to more static languages such as Java (think
    java.util.Map) or C++ (think std::map). Prototype calls them hashes and offers
    a Hash type.


    JavaScript makes hashes really easy. Any object can be treated as a hash. It is
    inherently possible to iterate through an object''s properties (using the for...in
    loop), add and remove properties to an object, change property values, and so
    on. Properties are also intrinsically unique. What then, you may ask, if objects
    make great hashes as it is, why would we need a specific Hash type? Good question,
    my dear, astute reader.'
