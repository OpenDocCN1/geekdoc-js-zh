  md: '# Getting the Latest Source Code


    Prototype and script.aculowe live in a branch of Rails'' Subversion repository,
    located at http://svn.rubyonrails.org/rails/spinoffs/.


    At the time of this writing, script.aculo has no branches, but Prototype uses
    the classical trunk/tags/branches split:


    +   * The trunk is the next version is being cooked up. It''s the home of Prototype
    Edge.

    * Branches provide separate areas for Prototype Core members to tweak stuff. For
    instance, the selector branch is where Andrew Dupont and I play around when pushing
    Selector (and therefore($)) forward; it is the playground for new ideas being
    tossed around a full rewrite of the event management system; and so on...

    * Tags are frozen states of the trunk that represent specific versions. You''ll
    find every released version of Prototype in, from 1.5.0 onward.


    To contribute, the only thing you really need to do is check out the trunk and
    update it. To do this, you just need to grab a Subversion client program and point
    it to the URL of the trunk (or higher up the repository tree, perhaps all the
    way to spinoffs).


    There are client programs for all (tastes, from TortoiseSVN (which integrates
    with the Windows Explorer) to the classic command-line client. This is the one
    we are going to use in this chapter. Look at what is available for your specific
    platform at http://subversion.tigris.org/project_packages.html, and download install
    it.


    The first time, you''ll need to check out the repository that you need. For instance,
    to check out the trunk, just enter a command prompt, go to the directory you want
    to check it out, and simply type this:


    ```

    $ svn co http://svn.rubyonrails.org/rails/spinoffs/prototype/trunk/

    A trunk/test

    A trunk/test/unit

    A trunk/test/unit/range.html

    nA trunk/src/ajax.js

    A trunk/src/form.js

    A trunk/src/hash.js

    A trunk/README

    Checked out revision 6390.

    $

    ```'
  merge: -1
  pgno: 405
- img_proc: true
  md: 'Of course, you''ll get a higher version number (it rises with every commit
    operation). You know have a trunk directory, which is bound to the Subversion
    repository. To update it to the latest version, you just need to get in there
    and do this:


    ```

    $ svn up

    U test/selector.html

    U RakeFile

    U CHANGELOG

    U src/selector.js

    Updated to revision 6435.

    $

    ```


    There! You''re all set up with the latest sources.


    The last thing you need is a Ruby setup, with Ruby and Rake executables. You can
    learn how to do that in Appendix C, on page 414.


    # Road to Glory: Creating Patches


    Writing a patch is as simple as getting into the trunk''s src directory and changing
    the appropriate .js file. Once this is done, you need to rebuild the consolidated
    prototype.js file. To do this, from somewhere in the trunk''s directory tree,
    just type rake dist. This will build the library file in the trunk''s dist directory.
    This file is used by the tests.


    # Working with Tests


    When you''re done with a patch, make sure you run the proper test files. Simply
    open them in the browsers you have handy. Passing tests go green, and failing
    ones go red. This can actually be a way to contribute. Run all tests, find the
    failing ones, and figure out what''s wrong and fix them!


    To see tests in action, you just this:


    +   1. Fire up your trusty browser. Open it the test/unit/array.html file. The
    page loads, runs all tests, and is done. If everything is groovy, they all pass,
    as in Figure A.3, on the following page.


    +   2. Open src/array.js and break something! For instance, change first(1) to
    null instead of this[0]. Rebuild the library (rake dist, remember?), and refresh
    the page in your browser. It should look like Figure A.4, on the next page.


    +   3. OK, you just ruined this file. Undo by hand and rebuild, or just use Subversion
    to revert to the latest checked-out version: svn revert src/array.js.'
