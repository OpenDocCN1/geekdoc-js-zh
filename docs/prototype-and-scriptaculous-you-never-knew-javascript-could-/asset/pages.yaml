  md: '# Chapter 15


    # Drag and Drop


    A huge part of what people envision when they think “Web 2.0 interface” is drag
    and drop. Moving blocks around in a customizable portal, putting items in a shopping
    cart, and reordering items in a list—it all comes down to dragging and dropping.
    Fortunately, script.aculo.us comes with strong support for this capability, easing
    integration into our own web applications.


    To use script.aculo.us capabilities, you''ll need to load the dragdrop module,
    which requires the effects module. So your minimum loading for script.aculo.us
    will look like this:


    ```

    <script type="text/javascript" src="scriptaculous.js?load=effects,dragdrop"></script>

    ```


    # 15.1 Dragging Stuff Around


    Let''s start with the basics: making an element draggable and dragging it around.
    We''ll then see how we can react to various stages of the drag and look at the
    numerous aspects that can be customized.


    Also, remember that we did simple drag and drop in Section 9.2 Get It: Geometry
    Persistence, on page 192, so you''ll find example code there as well.


    # Making an Element Draggable


    OK, first things first: making an element draggable. It can be as simple as instantiating
    a Draggable object over it (or its ID, as usual):


    ```

    new Draggable(element);

    ```'
