    # Positioning


    Prototype extends DOM elements with many position-related methods

    let you obtain an element''s position (within a variety of coordinate

    systems) and play with the element''s position-related aspects.


    All of these methods are intensively used inside visual features such

    as the visual effects and drag-and-drop facilities in script.aculo, but

    this doesn''t mean your code will never need them. In case you do

    them, I include them here.


    Until Prototype 1.6, these methods were available through the Position

    namespace and suffered from inconsistent naming. A recent event was

    made to clean up this.


    In the following syntax, the Positioninfo is basically a two-views

    object. For backward compatibility, it acts as a two-item array (with

    indices 0 and 1), holding the left and top coordinates, respectively. In

    t newer way, it also holds these data in two properties, named left

