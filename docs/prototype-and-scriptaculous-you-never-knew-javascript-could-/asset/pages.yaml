  md: '# A Note About Versions


    This book covers Prototype 1.6. To understand how Prototype evolved, and where
    it''s headed, it''s worth looking at a short history.


    The release of version 1.5, on January 18, 2007, was a major event for people
    using only the public versions. They had been stuck with version 1.4 for a year,
    and 1.5 brought about a tremendous amount of improvements and new features.


    These days, Prototype is rapidly pacing ahead, moving in swifter, shorter steps.
    Version 1.5.1 was released in April 2007 and brought a few new features and significant
    refactoring and cleanup of the code base. Version 1.5.1.1, a bug-fix release with
    a few surgical improvements to boot, was released in June. With a first release
    candidate in early August 2007 and a final release scheduled in October 2007,
    version 1.6 is a major step ahead. It introduces a complete overhaul of the event
    system, the first improvements on subclassing, and many more new features. Prototype
    Core is considering a later 1.6.1 release with yet more event- and class-related
    improvements, and then we''ll be done with the 1.x branch. The next steps will
    take us to 2.0. And we''re hard at work on it already!


    The information in this book is current at the time we''re about to go to press.
    This means by the time this book is out, at worst one or two months behind; in
    other words, you''re up-to-date on 95% of the library and have only to peruse
    the recent items in the change log to be on the very top of things.


    You can get additional information on later releases and feature updates on the
    book''s site and blog: thebungeebook.net.'
