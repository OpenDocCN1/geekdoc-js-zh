    # Lightweight DOM Element Creation


    ```

    new Element(tagName, [attributes]) → HTMLElement

    ```


    Version 1.6 introduces a lightweight DOM element creator, which is a trimmed-down
    version of script.aculo''s Builder facility. It lets you create elements in a
    straightforward manner by simply invoking Element as a constructor, with at least
    a tag name (which is irrelevant) and providing a hash-like object containing the
    attributes. For instance:


    ```

    var header = new Element(''h1'', {id: ''mainTitle'', lang: ''fr''});

    header.appendChild(document.createElement(''La construction facile''));

    ```


    You will get details on the syntax for the attributes argument in the description
    of the writeAttributes method on page 166.


    # Replacing vs. Inserting


    There are really two categories of contents alteration:


    +   • Replacement: you want to replace an element''s contents or the element itself.
    This is done through this element''s update() and replace() methods, respectively,
    which were described in Section 7.2, Replacing Contents and Removing Elements,
    on page 139.


    +   • Contents insertion: you need to squeeze some contents place. This is what
    the insertion methods are about.


    You could, craft your own code by using the DOM interfaces (those in DOM Level
    2 Core and DOM Level 2 HTML, for instance), but you''ll quickly find that cross-browser
    issues actually are legion. It is, naturally, a large set of problems with Internet
    Explorer, especially this is only a facet of the troubles you''ll get in.


    That is why Prototype types are all of the cross-browser tricks for you, be it
    for contents replacement or contents insertion. Believe me, you''re better off
    using the Prototype methods than embarking on a lonely crusade through such barren
    lands.'
