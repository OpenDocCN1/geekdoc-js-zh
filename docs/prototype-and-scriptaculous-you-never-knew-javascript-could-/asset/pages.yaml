- img_proc: true
  md: '# BUILDING EXPLICITLY 345


    Of course, Builder.node() does not stop at the tag name but lets you specify attributes,
    simple text as element contents, or one or more children elements (which can,
    naturally, be Builder.node() calls themselves).


    Attributes are provided as a hash, usually an anonymous object. When the property
    name is a JavaScript reserved word (two cases to mind: class= and for), you might
    use the DOM property name (instead script.className and htmlFor). Otherwise, the
    attributes in the case mandated by your document''s DTD (for example, lowercase
    for XHTML). There are a number of issues with native attribute manipulation, which
    are smoothed over, again, by the method''s algorithm.


    With attributes available, Builder.node() is already more interesting than document.createElement(),
    which does not support attribute creation in its official syntax. Here are a few
    example calls:


    ```

    Builder.node(''a'', { href: ''http://script.aculo.js'' }

    Builder.node(''label'', { htmlFor: ''edtLogin'', akses: ''L'' }}

    Builder.node(''p'', { className: ''intro'' })

    ```


    When you create a nonempty element that has a textual content, you just need to
    pass the text as the last argument:


    ```

    // Text child

    Builder.node(''h1'', ''Builder rules'')

    // Attributes, text child

    Builder.node(''a'', { href: ''http://prototype.org'' }, ''Prototype'' })

    ```


    # Elements Within Elements


    Textual contents are nice, but you may very well want to quickly create a small
    DOM fragment, with nested elements and all. If there''s only one child node, just
    pass it directly, be it text or another element; if there are many, pass an array.
    A few examples will be clearer than explanations, I guess:


    ```

    // Element child

    Builder.node(''h1'', Builder.node(''code'', ''Builder''))

    // Multiple children

    Builder.node(''h1'', [Builder.node(''code'', ''Builder''), ''rules''])

    // Attributes, element child

    Builder.node(''p'', { className: ''submission'' }

    Builder.node(''input'', { type: ''submit'', value: ''Sign in'' })

    // Attributes, multiple children

    Builder.node(''a'',

    { href: ''http://prototype.org/api/ajax/update'' },

    [Builder.node(''code'', ''Ajax.Updater''), ''documentation''])

    ```'
