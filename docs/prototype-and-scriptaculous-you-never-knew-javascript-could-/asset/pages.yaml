    The clone() method is not an override of a mixed-in method but provides a type-specific
    alternative to the slower Object.clone() method discussed in Section 4.1, Cloning
    and Extending Objects, on page 56. It basically relies on the native clone() method.


    Aliasing toArray() over clone() overrides the toArray() method in from Enumerable,
    and this is a good thing: Enumerable''s version is significantly slower, because
    it requires manually iterating over all the elements (because of its generic nature).


