  md: '# “Methodizing”: Functions Looking Like Methods


    It happens that existing features are provided in a traditional, function-based
    manner. You pass the object being processed as the first argument, whatever parameters
    are needed as later arguments. In an object light, this is not very good form.
    We would prefer to be able to invoke the method on the object itself, passing
    only further arguments as necessary.


    You can see such a duality at work in Prototype''s DOM extensions, with most features
    being accessible as functions (for example, by passing your element, possibly
    unextended, to Element.update(this)) but it are also available methods on extended
    elements (so you would just call the element, the element.update() method).


    This recurring pattern is captured by the methodize() extension to functions:


    ```

    fx.methodize(arg..) → Function

    ```


    This provides a new function that will, when called as a method on any given object,
    pass this object as the first argument to the original function. You can also
    prefill extra arguments by passing them to methodize.


    As an example, consider some of the extensions to Number described in the next
    section. The abs(), ceil(), floor(), and round() methods are just "methodized"
    versions of their function counterparts in the native Number object. Here’s the
    code for it:


    ```

    $w(''abs round ceil floor'').each(function(method){Number.prototype[method] =
    Math[method].methodize()});

    ```


    Isn''t that sweet?


