    ><span>script.acolous</span></li>\n</ul>\n\nOK, if we provide some mouseover/mouseout\
    \ machinery so that going triggers a black-and-white image and going goes back\
    \ to the normal image, the code for implementing the transition looks like this:\n\
    \n```\nvar queue = { scope: element.id, position: 'end' };\nelement.visualEffect('Opacity',\
    \ { to: 0.1, duration: FADE_DURATION,\nqueue: queue });\nnew Element.Event({ queue:\
    \ queue, afterFinish: function() {\n  element.setStyle([backgroundColor, url]);\n\
    }});\nelement.visualEffect('Opacity', { from: 0.1, to: 1,\nduration: FADE_DURATION,\
    \ queue: queue });\n```\n\nNote the queue definition. It uses a unique scope,\
    \ based on the suffix of the source element's ID; all effects are stored in queue\
    \ by using your queue option. Since queues are separate, we can trigger parallel\
    \ sequences on multiple items while retaining sequential execution for the item\
    \ level.\n\nFinally, note that you can enforce a limit to the events in a queue\
    \ at any given time by using an extra property for your queue option object: limit.\
    \ This can be useful to prevent rapid-fire clicking from queuing up a huge amount\
    \ of Ajax requests, for instance, when only a few makes sense from an ergonomic\
    \ standpoint.\n\n# 14.6 Effect Helpers\n\nThomas acknowledges very common uses\
