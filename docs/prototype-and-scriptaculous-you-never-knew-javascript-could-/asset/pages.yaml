    # 5.4 Grouping Elements and Pasting Collections Together


    Sometimes, you want to cut collections into chunks, roughly equalsized. You might
    want to put them into multiple collections or some other stylish layout. Maybe
    you can pass only so many to a time backend processing layer (aaah, those hard-coded,
    arbitrary limits in legacy software (..)). Maybe you just feel like it! That''s
    what inGroupsOf is for. As it was coded, it spawned eachSlice(), a nice group-based
    iterator.


    Another issue arises when you need to zip together. Picture the fly rising when
    a pair of torsers: there''s the left side, the right side, and zip! They break
    in pairs. Taking two collections and turning it into a collection of pairs is
    what zip does:


    ```

    eachSlice(size, iterator: Prototype.KJ) -> [ slice, ... ]

    inGroupsOf(size, filter: null) -> [ group, ... ]\zip(sequence..., iterator: Prototype.KJ)
