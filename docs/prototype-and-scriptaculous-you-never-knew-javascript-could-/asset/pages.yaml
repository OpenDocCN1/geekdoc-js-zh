  md: '# AJAX CONSIDERED HARMFUL? THINKING ABOUT ACCESSIBILITY AND ERGONOMI


    usability, not to implement it. A classic example is providing navigation (or
    other important actions) only through clicks or otherwise passive elements (such
    as images or `<div>` elements). With no JavaScript, your elements are inert. Functionality
    is lost.


    Having no JavaScript at hand is more frequent than you think. A of mobile users
    (using phones, PDAs, and so on) or those equipped with alternative browsing systems
    (such as a screen reader) still have no JavaScript or have a very limited implementation
    of it. JavaScript could also be technically available but be disabled by a stringent
    system administrator.


    Even if JavaScript is there and enabled, requiring complex manipulations from
    your users is inaccessible. Many cannot use a pointing device (for example, a
    mouse) with good precision, or cannot wield at all, because of some motor handicap;
    they also find it difficult to press complex keyboard shortcuts. Even with no
    handicap, many use a browsing device with a limited or absent keyboard (think
    mobile phones or PDAs) and possibly no efficient pointing mechanism. The whole,
    people with one form of handicap or another (cognitive, visual, motor, and so
    on) make more than 15% of web users, which means millions of people worldwide.
    You can''t just exclude them.


    The key to better accessibility is to embrace unobtrusive JavaScript. Have your
    page work (even if not too fabulously from a usability standpoint) with no script
    whatsoever (ideally, with no CSS whatsoever), and then separate scripting to hook
    into regular events (for example, form submission, link activation) to make it
    behave in a comfortable way, saving the user''s time and effort. Starting with
    bare stuff and progressively applying feature augmentations through JavaScript
    and Ajax, in an unobtrusive way, is referred to as progressive enhancement.


    # Ergonomic Ajax: Taking the Right Approach


    What''s true for JavaScript obviously still stands for Ajax. Jeremy Keith, of
    DOM scripting fame, refers to progressive enhancement through Ajax as Hijack.¹¹¹
    Yet Ajax accessibility is not just about technical availability and graceful degradation.
    On the Web, users have a different set of expectations that they do on “desktop”
    applications.


    Most people still expect a web page not to behave like a regular application screen.
    They''re not alert to your page doing requests


