  md: 'There are a lot of ways you can help and share your (however newly acquired)
    Prototype skills. Here are the main ones:


    +   - Subscribe to the support list,¹ and start answering questions. Avoid guessing
    too wildly, but you don''t need to be absolutely authoritative. If you miss a
    detail when replying, someone will chime in with a quick fix.


    +   - Start browsing the Trac, which is where everybody bug reports and enhancement
    requests. You can start hunting down duplicate or invalid tickets. If you do not
    notice as-yet unreported issues that you can easily reproduce, feel free to submit
    bug reports, too.


    +   - Learn to use the Subversion repository, so as to play with “Prototype Edge,”
    the latest state of the library. This is important to know what it''s cooking
    and to help incoming tickets when they are fixed, for instance.


    +   - Shift into third gear, and start writing patches! This will require mastering
    the unit test library that Prototype relies on, because patches need to come with
    a full complement of tests to be accepted. You''ll have to test on as many browsers
    as you can, to but once your patches starting it in, you''ll likely find it addictive
    (and contributor glory is at hand!).


    Because Trac and Subversion are the two pivotal tools of contributing to Prototype,
    I''ll spend a few pages giving you as useful pointers as I can about how we expect
    contributors to use them. This should help you contribute in the most efficient
    (and appreciated) manner.


    # Staying on Top of Things: Trac


    Trac is a tracking system that lets people file bug reports and enhancement requests.
    It also has a lot of nice features, as document sharing, reports (custom queries
    over the ticket database that can be saved and reused it), and a wonderful integration
    with version control systems such as Subversion.


    Prototype shares a Trac (and a Subversion server, actually) with Ruby on Rails
    (remember that although backend-agnostic, Prototype and script.aculo.us are, original.
    Rails spin-offs). The basic URL is http://dev.rubyonrails.org/.


    +   ¹ http://groups.google.com/group/rubyonrails-spinoffs'
  merge: -1
