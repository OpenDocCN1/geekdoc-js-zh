  md: '# CUSTOMIZING DROP BEHAVIOR


    ![](img/58ce77657835196da1e063557fbd9fb0_304_0.png)


    Figure 15.5: Several steps of our cart working


    Note how we create small, draggable `<img>` elements to populate the cart but
    still let the user take them away to the trash can. On line 9, we create Draggable
    objects for them, with the `revert` option, which will have them slide back into
    place unless they''re properly dropped. In such a case, we''ll simply remove them
    from the DOM.


    If you were to implement this with a server notification, the server side would
    probably compute the new representation of the whole cart, and you''d use `Ajax.Updater`
    over the cart container.


    Figure 15.5 shows a montage of our shopping cart on load (empty), during cart
    addition, and during trashing (a few additions and trashings in between were skipped).


    If you''re using multiple drop zones and they happen to overlap, you must be careful
    about the order in which you''re creating them. Check out Section 15.9, *Creating
    Droppables in the Right Order*, on page 320 for details.


    # Reacting to Drag


    A few options let you exert finer control over how the drop zone reacts to dragged
    elements hovering over it.'
