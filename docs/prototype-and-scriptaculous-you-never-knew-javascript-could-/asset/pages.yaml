  md: '# # What We Just Learned


    There''s a lot to grok in this chapter: DOM extension is at the heart of Prototype
    and is one of the major reasons why it''s so nice to use. Let''s quickly go over
    the central points we explored:


    +   - DOM extension is the process of slapping extra methods onto any DOM method.
    Prototype provides tons of such methods out of the box and a mechanism to add
    your own (`Element.addMethods()`).


    +   - The speed cost of DOM extension is almost null (a few milliseconds at script
    load to update the prototypes for the DOM elements) in many browsers and slower
    on Internet Explorer (which doesn''t feature prototypes for DOM interfaces). Still,
    it''s very reasonable and has an excellent cost/benefit ratio (usually less than
    a millisecond to equip your element with many power tools).


    +   - The extension propagates. The starting point is often a call to $(), which
    returns a guaranteed extended element. Every extended method, when returning one
    or more elements, guarantees their extension. And element-related methods in the
    event system also return the extended versions.


    +   - All mutative methods (methods that alter the element) return the element
    itself, so you can chain-call (for example, like this: `element.update(''cool'').highlight()


    +   - Areas where DOM extension radically shortens your code include DOM traversal,
    DOM extraction, DOM construction, CSS processing, and positioning. That''s not
    even all...


    +   - The Selector API, which is the basis for the well-loved $$ utility function,
    lets you extract DOM elements based on the full complement of CSS 3 selectors,
    regardless of your browser''s actual support for CSS.'
