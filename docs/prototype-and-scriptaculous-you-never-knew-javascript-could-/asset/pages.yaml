    // $(''container'').replace(''<h1>\''t cross the streams!</h1>'');

    // DOM: <h1>Don''t cross the streams!</h1>

    ```


    Aside from these, we have a convenience remove() method, which simply takes the
    element out of the DOM, and a cleanWhitespace() method, which scours the element''s
    DOM to expunge any text node with only whitespace in it. This can be handy when
    you go from a HTML template with some indentation or line breaks and end up messing
    with your styling.


