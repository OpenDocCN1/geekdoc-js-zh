    \ not on map keys.\n\nHere’s a short example:\n\n```\nvar lib = $(version: 1.5,\
    \ author: 'Sam Stephenson ');\nlib.each(function(pair) {\n  alert(pair.key + '\
    \ = ' + pair.value + '');\n});\n// Alerts, in non-guaranteed order, version =\
    \ \"1.5\" and\n// 'author = \"Sam Stephenson\".\n```\n\nHashes let you get a list\
    \ of the keys or values, ordered based on the native for...in loop. Since these\
    \ are returned as arrays, they enumerable, which is rather handy.\n\nYou can decide\
    \ to *merge* hashes by using merge(). The idea is that the hash you're calling\
    \ merge() has on lower priority than the one passed as an argument. When the merge\
    \ is done, you get a new hash that has all properties from both, with the argument’s\
    \ values when there is a property conflict.\n\nNote the argument doesn’t need\
