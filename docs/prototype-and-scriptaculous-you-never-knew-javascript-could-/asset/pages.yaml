    as if there were multiple fields with this same name, one per value.


    The two other methods are closely related and deal with serializing part or all
    of a form. Calling serialize() on a form simply forwards all elements in the form
    (except for type="submit" elements, where only one will be used, which is by default
    the first one).


    Most of the time you''re happy with a URL-encoded string representation, which
    is what you get by default. If you pass a hash option with the value true, you''ll
    get the resulting hash object (not actually a Hash instance, just a vanilla JavaScript
    object) back, containing all field names and values, which you can use to build
    your own serialization.


    By default, if there are multiple type="submit" fields, only the first one in
    document order will be serialized. You can change that by specifying the value
    of the name= attribute for the submission field you want to serialize. Just specify
    it as the submit option.


    For instance, the following:


    ```

    $(myForm).serialize({ hash: true, submit: ''delete'' })

    ```


