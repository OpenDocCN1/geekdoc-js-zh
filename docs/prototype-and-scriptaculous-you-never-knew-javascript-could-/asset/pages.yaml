  md: '# WHAT ARE PROTOTYPES ANYWHERE?


    manipulates the this reference to work with instance members (such as instance
    fields). You can see a call to the constructor on line 12.


    Starting on line 6, we we define in our constructor''s prototype. Here, it''s
    only a single method, calledFullName(), which uses a simple version of the full-name
    algorithm. The important point is that this method''s definition is shared by
    all instances of the Person class. It is defined only once and used from them.
    We use it indifferently on both instances, as you can see from line 15.


    This is very much preferable to "old-school" code that you still find in many
    tutorials, which goes something like this:


    ```

    function Person(lastName, firstName) {

    this.lastName = lastName;

    this.firstName = firstName;

    this.getFullName = function() { // DON''T DO THIS!

    return this.firstName + '' '' + this.lastName;

    }}

    ```


    In such code, every time an instance is created, it gets its own singleton method
    (a method that exists specifically on this object; its definition is not shared
    by any other instance). This is entirely wasteful, because the function''s definition
    does not change over time and does not lexical closure from the constructor''s
    code, since it uses data only from this reference. The prototype-based approach
    is a much cleaner solution and is how JavaScript is supposed to be used anyway.


    Note that the syntax we use to express the prototype from line 6 onwards is pure-vanilla
    JavaScript. The (...) block is a regular object literal, with a comma-delimited
    list of key: value pairs.


    Now for the salient points. First, prototypes are objects. You can alter them
    at any point, and this retroactively alters all the instances on this prototype.
    So, for instance, adding a method to String.prototype makes it available to all
    String objects, whether they were created before or after the addition! This is
    a way of “monkey patching”⁵ classes, much like you would do on Ruby classes and
    modules.


    > 5. In scripting language, monkey patching is the practice of patching existing
    objects (classes, functions, and so on) at run time, not in their actual source
    code. Dynamic languages, which generally leave their types “open.” are a prime
    candidate for this kind of approach.'
