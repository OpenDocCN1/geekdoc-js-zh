  md: "# 16.3 Getting Ajaxy\n\nThe other data source method available is, of course,\
    \ Ajax, which lets you get completion choices from a remote source (your server\
    \ side). The construction syntax is similar to the local variant, except the data\
    \ source is not specified as a JavaScript array but by the URL to your server-side\
    \ logic:\n\n```\nnew Ajax.Autocompleter(element, container, url [.options])\n\
    ```\n\nYour server side gets one parameter, which defaults to the input field's\
    \ name= attribute and holds the typed characters. The server code is responsible\
    \ for producing a list of completion choices using the same format inbuilt by\
    \ local completion: an unordered list of choices, expressed as a `<ul>` element\
    \ with its `<li>` items.\n\n# Automatically Displaying an Indicator\n\nBecause\
    \ we're going through Ajax and having a round-trip to the server side, completion\
    \ might not be instantaneous. As always, letting the user know processing is going\
    \ on the scenes is a good idea. When dealing manually with objects as Ajax.Update,\
    \ we will manually show and hide an indicator element on our page from the `onCreate`\
    \ and `onComplete` callbacks. This indicator was usually an `<img>` somewhere,\
    \ hiding a spinner or progress bar of some sort.\n\nAutoComplete.Base acknowledges\
    \ this common need with a custom indicator option that hides the DOM reference\
    \ or ID of your element and will automatically show and hide it appropriately.\
    \ The option is originally undefined, and whenever it is false-equivalent, it\
    \ is simply ignored. It's available to all autocompleters, but local completion\
    \ rarely needs it, being usually fast enough. . .\n\n# A First Example\n\nLet's\
    \ work up a simple Ajax example. We'll need all the stuff from our local demo,\
    \ but we'll adjust the web page's title and heading the demo. The new web page\
    \ says:\n\n```\nDownload scriptulous/autocompleter/ajax/index.html\n```\n\n```\n\
    <!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Strict//EN\"\n\"http://www.w3.org/DTD/html1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en-US\" lang=\"en-US\"\
    >\n<head>\n  <meta httpequiv=\"Content-Type\" content=\"text/html; charset=utf-8\"\
    \ />\n  <title>AJAX autocompletion</title>\n```"
