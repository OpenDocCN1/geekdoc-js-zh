    # The Duality of event.stop


    ```

    event.stop()

    event.stopPropagation()

    event.preventDefault()

    ```


    There are two things you can do on an event that relate to what happens next with
    it: you can stop its propagation, and you can prevent the browser from applying
    the default behavior for this event.


    Many events have an associated default behavior. For instance, a submit event
    on a form triggers submission (ahem) of the form. A click event on a link navigates
    to the link''s destination, and so on. Obviously, when you register a client-side
    form-checking method as a listener for a submit event, you want to inhibit the
    default behavior if your checks fails. So-called smart pop-ups unobtrusively listen
    to your link''s click event to open in a pop-up window, at which point navigation
    should not place in the link''s. The DOM Level 2 Events specification ends event
    objects with a specific method for this: preventDefault(). As we said, Internet
    Explorer doesn''t support it, but Prototype smooths over and guarantees it''s
    there.


    Because these two behaviors—stopping propagation and preventing default behavior—are
    often indociable, stop() does both. It calls the event''s stopPropagation() and
    preventDefault() methods. It''s a nifty little shortcut.


    # Getting Information About the Event


    There''s a whole world of information you might want to extract for the current
    event: what element was triggered, what the key being pressed or released, what
    modifier keys are active, what are the coordinates of the mouse cursor, and so
    on. Not all of this is easy to grab in a cross-browser way, but some of it is.


    # Getting Elements for the Event


    ```

    event.element() -> HTMLElement

    event.findElement(selector) -> HTMLElement

    event.relatedTarget

    ```'
