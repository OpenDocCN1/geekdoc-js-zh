  md: '# How Is Our XHTML Fragment Processed?


    The same hedgehogs mate: with great care (and a hearty spirit). The general idea
    (for both update()/replace()) and the insertion methods) is as follows:


    +   1. The fragment is stripped of its <script> elements, which are kept aside.


    +   2. The stripped fragment is inserted, taking care of the cross-browser issues
    and potential pitfalls.


    +   3. The scripts originally in the fragment get evaluated; at this point, the
    elements in the fragment are indeed part of the page''s DOM, so they are accessible
    through regular scripting.


    At this point, you may roar in outrage at the mere thought of inline <script>
    tags. In an Ajax context, this is the only way⁴ for the server to send both page
    contents and the companion scripting. A common use is that of a new item to be
    appended to a list and then subjected to a highlight effect (you know, this yellow
    fade you are keeping now and then), or you could make the new content draggable
    or otherwise script-enabled.


    As a warning note, you should always use JavaScript <script> elements (that is,
    not some other scripting language, such as Internet Explorer''s proprietary VScript).
    This is because Prototype will the tags and evaluate only their contents (not
    the tag itself), assuming they are JavaScript.


    # So, How Do We Insert Stuff?


    Version 1.6 provides two new methods that cater to the usual needs, replacing
    the deprecated insertion object:


    ```

    insert(content) -> HTMLElement

    insert({ pos: content [...]} }) -> HTMLElement

    wrap(wrapper = ''div'', attributes) -> WrapperHTMLElement

    ```


    insert() inserts contents before, at the top of, at the bottom of the (default),
    or after the reference element. This is a replacement of the former insertion
    namespace.


    +   4. Well, not quite so, but other ways will pull you some coding and configuration
    tricks, so I figure they''re just not worth it, compared to how convenient the
    inline <script> approach is here....'
