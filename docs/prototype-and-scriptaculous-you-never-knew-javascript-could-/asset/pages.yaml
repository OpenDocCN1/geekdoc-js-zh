  md: '# Chapter 7


    # Playing with the DOM Is Finally Fun!


    When writing modern web applications, you find yourself doing a lot of DOM manipulation.
    Traversing the DOM, fetching elements, showing and hiding them, replacing fragments
    of the document with new [X]HTML contents, fiddling with CSS class names…this
    is what we developers do.


    Unfortunately, if we stick with the raw standards (such as DOM Level 2), we find
    ourselves tragically underquiped. The tools of the trade were judged and found
    wanting. It feels like building a skyscraper with cardboard and string.


    But you''re using Prototype now.


    True to its aim, Prototype comes with plenty of nifty tools you can use to tweak
    the DOM. At the heart of it is the notion of DOM extension. The idea is simple:
    one way or another, you can get “extended” versions of the original DOM nodes,
    and these versions are easy to play with than their bare-bones counterparts. At
    the time of this writing, there are 45+ extension-provided methods in there.


    # 7.1 Extending DOM Elements


    Let’s first focus on the net result for the web developer: fetching an element
    through the $() function (which we saw in Section 3.2, Quick Fetching of Smart
    Elements with $, on page 42) guarantees that you get is is the extended version
    of the original DOM element.'
