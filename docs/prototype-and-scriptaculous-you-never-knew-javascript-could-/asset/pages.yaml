  md: "# Adding Static Properties and Methods\n\nObject.extend(klass, { staticMethod<ldots/>\
    \ > }) → klass\n\nAdding static properties (and thus methods) to a class is just\
    \ one case of adding properties to an object (remember that in JavaScript, classes\
    \ are functions, and functions are objects), so we can use the Object.extend()\
    \ mechanism.\n\nYou could extend it like this, for instance:\n\n```\nvar Animal\
    \ = Class.create({\n  initialize: function(name) {\n    Animal.newInstance();\n\
    \    this.name = name;\n  },\n  eat: function(food) {\n    return this.say('Yum!');\n\
    \  },\n  say: function(msg) {\n    return this.name + ': ' + msg;\n  }\n});\n\n\
    Object.extend(Animal, {\n  instanceCount: 0,\n  newInstance: function() { ++this.instanceCount;\n\
    });\n```\n\nIt is likely that Prototype 1.6.1 will provide a more integrated mechanism\
    \ for specifying class methods and properties, though, especially at creation\
    \ time.\n\n# Automatic Class Properties\n\nPrototype maintains three properties\
    \ for you that open the door to powerful introspection:\n\n```\nobj.constructor\
    \ → Class\nclass.superclass → Class\nclass.subclasses → [ Class, ... ]\n```\n\n\
    Theoretically, every object has a native property that refers to its constructor\
    \ function, which basically means its class. However, there are a few issues across\
    \ browsers with this property, so Prototype overwrites it to guarantee its value\
    \ is correct."
