  md: '# SORTING WITH DRAG AND DROP


    To let your users reorder the elements in your `<div>` container, you''d need
    code like:


    ```

    Sortable.create(''avatars'', { tag: ''img'' });

    ```


    Perhaps you need to restrict this, however, to only a subset of these children,
    in which case you can also define the only option. It defaults `false`, which
    disables it. You can set it to either a single CSS class or any array of CSS class
    names to precisely select which children elements are to be used.


    We can try this; let''s take our previous page and change the list definition
    to the following markup:


    ```

    <div id="chapter">

    <p>This stays on top.</p>

    <p class="orderable">This can, on the other hand.</p>

    <p class="orderable">And this too!</p>

    <p class="moveIt">You can reorder this one.</p>

    <p>This stays at bottom.</p>

    </div>

    ```


    Now we all need to do our Sortable creation to this:


    ```

    document.observe('':dom:loaded'', function() {

    Sortable.create(''chapter'', { tag: ''p'', only: [''orderable'', ''moveIt''] });

    });

    ```


    We can drag all the two outermost paragraphs, which do not match any of the CSS
    classes we specified for the only option.


    Version 1.7.2 introduced a new option, called elements, which lets you specify
    exactly child elements you want to reorder, and only those will be taken into
    account. When you know, beforehand, which elements will need to be draggable for
    reordering, this is by far the fastest to initialize your Sortable object. It
    skips any of DOM traversal or CSS-based selection.


    The `elements` option is originally disabled (by setting it to `false`), so you
    would begin by enabling it with an array of elements (for example, the result
    of a `$`). As usual, any item in this array can be either a string with the element''s
    `id` value or the element''s DOM reference.


    Naturally, if this option is enabled, it supersedes any other means of defining
    child elements for reordering.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Reordering Trees!


    Sometimes you''re not dealing with linear lists (or list equivalents) but element
    trees, with containers inside items containers inside. . . . In short, these are
    nested lists.


    Dealing with this efficiently and correctly is by no means a simple task; script.aculo
    provides a tree-handling feature, which is still somewhat experimental, but seems
    to hold up well in real-world use. You need to create a Sortable object only on
    the outermost container, but you must pass the proper options, including two specific
    ones: tree and treeTag.


    The tree option is simply a boolean flag used to activate alternative behaviors
    in the Sortable internals in order to deal with tree-like structures. It is set
    to true to deal with nested containers.


    The treeTag option lets you specify which tag you rely on for containers. This
    assumes all containers, outermost or nested, use the same tag. This defaults to
    ''ul'', but you can change it for your needs (for example, ''ol'' or ''div'').


    To put create right it''s, I should mention that most of the tree support code
    was contributed by Sammi Williams.


    You can look at a fairly good demonstration of sortable trees at work in the corresponding
    functional page using your script.aculo.js distribution: test/functional/sortable_tree_test.html.
