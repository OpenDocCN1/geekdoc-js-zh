    \        if (this.country) result += ', ';\n      }\n      result += ')';\n  \
    \  }\n    return result;\n  }\n});\n```\n\nThis first fragment deserves some explanation:\n\
    \n+   - The Class.create() call on line 1 produces a Prototype class. For the\
    \ JavaScript gurus around you, yes, that is a function object.\n- When using Prototype\
    \ classes, initialization is taken care of via initialize() method, here on line\
    \ 2, which receives all the arguments passed at construction time.\n- Finally,\
    \ our getDisplayName() method, starting on line 13, builds a variable-form string\
    \ representation of the person, with the first name/or last name and possibly\
    \ city/country information between parentheses, or if it properly formatted and\
    \ adjusted.\n\nBeing defined at the prototype level, all of these methods are\
