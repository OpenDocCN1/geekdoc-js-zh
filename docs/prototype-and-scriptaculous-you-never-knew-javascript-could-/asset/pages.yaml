  md: '# Ajax.Response and Backward Compatibility


    Tobie, who’s responsible for the Ajax.Response refactoring, made sure the code
    remained backward compatible. This is why these objects feature the same crucial
    properties, such as transport and ready.


    However, there are many more properties designed to help you manipulate the response
    in a more portable, type-oriented way. You should get familiar with headerJSON
    and responseJSON, for instance.


    Callbacks are listed here in chronological order, instead of lexicographical order.
    I thought you''d like to find both the callback’s timing and the definition in
    the same place.


    onCreate


    +   - The object was created, with its request out to be prepared and sent.


    onUninitialized(not guaranteed)


    +   - The XHR was just created.


    onLoading(not guaranteed)


    +   - The XHR is being set up, with its connection open.


    onLoaded(not guaranteed)


    +   - The XHR is set up, with its connection open, and is ready to send data.


    onInteractive(not guaranteed)


    +   - The XHR has sent its request, and it is now receiving parts of the response.


    onFailure


    +   - The response was received, its HTTP status code is not considered successful
    (see next callback), and it doesn’t have a dedicated callback in place (see onXYZ).


    onSuccess


    +   - The response was received, its HTTP status code is considered successful
    (it’s in the 200–299 range), and it does not have a dedicated callback in place
    (see the next callback).'
