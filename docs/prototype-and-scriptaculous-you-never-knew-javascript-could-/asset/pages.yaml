  md: 'Waiting for the field to lose its focus was inadequate. The user might

    click the enabled button only to find it suddenly disabled because

    clicking, the text field would lose its focus. Visual feedback needed to

    take place earlier and be live. The resulting code was confoundingly

    simple:


    ```

    new Field.Observer(''edtName'', 0.3, function() {

    $(''btnSubmit'').disabled = $(''edtName'').blank();

    });

    ```


    Checking every 0.3" is debounced (the user doesn''t have to

    consciously wait after they type to see the UI get updated) by large

    enough an interval not to hog the processor.


    Since Prototype 1.6, these observer classes descend from PeriodicalExe-

    cut, so they inherit its stop(it) method, which lets you put the observer

    to rest.


    # What We Just Learned


    Here are the main take-away points about Prototype’s form-related fea-

    tures:


    +   * The features operate at two levels: full forms (the Form namespace)

    and individual fields (the Field namespace, which is an alias of

    Form.Element).

    * Methods in these namespaces appear as additional extens-\ions on the relevant
    DOM elements.

    * Most of the APIs with value retrieval and setting, either indi-

    ually through getValue() and setValue() or at the form’s level

    through such methods as serialize().

    * Prototype smooth over cross-browser inconsistencies in field

    value retrieval (on issues as no-value-attribute list elements

    or elements that can be toggled) and provides a powerful value-

    setting mechanism that helps dynamic form filling.

    * Form serialization is handy for Ajax submission of the data, but

    common cases can be automated one step further using the

    request() method.

    * Interval-based observers let us react quickly to changes in a form

    or individual field to implement dynamic behavior (such as en-

    able or disabling parts of the UI based on the current form data).'
