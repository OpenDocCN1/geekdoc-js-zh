    \ or Hash. From a technical standpoint, modules have no constructor function,\
    \ so the new operator does not work with them. You will just get an error, something\
    \ along the lines of “Enumerable” is not a constructor.\n\n# Which Objects Can\
    \ Mix Enumerable?\n\nModules often make requirements on the objects they get mixed\
    \ in, for the order to work in. Enumerable makes one specific demand on its “host\
    \ objects”—that they provide the fundamental iteration mechanism through a method\
    \ named `each()`. It can be as simple as a vanilla numerical-index for loop (as\
    \ it is for Array). Let your object feature this method, and it becomes, shall\
    \ we say, “Enumerable-compatible.”\n\nThis_each()` will be passed a single argument,\
    \ which is a callback function. All it has to do is call for each element in the\
    \ iteration. Simple as Sunday (but not SOAP).\n\nAs a real-world example, consider\
    \ the implementation of `each()` in Array (your favorite collection type):\n\n\
    ```\nDownload prototype/new/array/array.js\n_each: function(iterator) {\n  for\
    \ (var i = 0, length = this.length; i < length; i++)\n    iterator(this[i]);\n\
    }\n```\n\nSee? No bad.\n\n# How to Mix Enumerable?\n\nThat’s easy. If your type\
    \ was created using Class.create(), just use its addMethods() with the module,\
    \ like so:\n\n```\nYourObjectType.addMethods(Enumerable);\n```\n\nIf it’s a more\
    \ custom type, go like this: \n\n```\nObject.extend(YourObjectType.prototype,\
    \ Enumerable);\n```\n\nBe sure to be before adding your own methods to your object\
    \ type in order to make sure you override generic methods from Enumerable if need\
    \ (for instance, Array defines optimized versions of size() and to(), to name\
    \ two).\n\nFor further details on Object.extend(), go to Section 4.1, Cloning\
