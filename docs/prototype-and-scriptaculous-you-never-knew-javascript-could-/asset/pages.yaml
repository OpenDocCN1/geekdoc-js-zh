  md: "# COMPUTING A DERIVED COLLECTION OR VALUE\n\nsince all iterations pass the\
    \ index as the final argument of the iterator.\nThe iterator computes a new value\
    \ for the iterator and returns it.\n\nSince JavaScript passes object objects by\
    \ reference, you can use complex objects as accumulators whose state evolves across\
    \ the iteration. For instance, you can fill an array like this, which is pretty\
