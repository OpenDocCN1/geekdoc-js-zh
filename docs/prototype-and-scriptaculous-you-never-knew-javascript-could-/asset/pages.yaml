  md: '# HITTING THE ROAD: AJAX.Request


    The bindWidgets() method iterates over our widgets (any element with class=''widget''),
    isolates the <h2> in there, and does two things:


    +   - It makes the widget draggable by creating a new Draggable object over it.

    - It attaches an extra behavior to the handle''s mousedown event: raiseWidget().


    The raiseWidget() method is a nice touch we add to make widgets like actual visuals:
    the idea is to make sure the last clicked or dragged is on top and stays there
    the click or drag is. The default Draggable behavior would temporarily raise the
    element''s zindex during the drag and restore it dropped, which won''t. Plus,
    this would require an actual drag, and casual clicks would not bring the widget
    to the front.


    So, what we do here is react to mouse buttons pressed over a widget drag handle
    by rearranging zindex properties so the current one comes naturally on top while
    preserving the remaining ordering. The algorithm for this is simple enough: take
    "higher" widgets one notch down, and then get them magic on our top.


    The actual Ajax happens on line 31. This is where we create an Ajax.Request object.
    Creating it will automatically trigger the request proper. Because this is our
    first example, call is concise. Only the target URL (look at our server script
    to see it lists for /geometry requests in order to process updates) and the parameters
    for it, will use default values for all other options, which especially means
    we''re going POST on this one. The parameters will be transmitted in the request''s
    body in this URL-encoded format.


    The last trick is, of course, to build these parameters. To avoid tweaking URL-encoded
    strings, we''ll use the ability to take an object that it then uses as a hash
    of parameters. Building such an object is simple enough, as the code starting
    at line 25 strategies. For each widget, grab its absolute position, and add then
    the corresponding properties to the parameters object.


