    demonstrate.


    # Using an External Control


    Perhaps you want to provide an obvious means of editing. Indeed, for most users,
    it is not at self-evident that your element is editable in-place: titles, paragraphs,
    and their lot are fairly static. By default, only the element itself reacts to
    hovering and clicking, but you may want to use "sidekicks" such as an associated
    Edit link or button, which will loudly (and proudly) proclaim to users that something
    can be edited here.


    If you want to use such controls, you''ll be happy with the externalControl option.
    Just have it reference the element (directly or by ID), as that''s supposed to
    react to hovering and clicks. The element itself still reacts, so does your associated
    component.


    You may also want to require the user to use this external control in order to
    trigger the editing mode. By default, both the original element and the external
    control would work. You can use the externalControlOnly option to limit triggering
    to the external control.


    # Changing Default Options


    There are a lot of defaults, and they may just not suit you all that well. For
    instance, perhaps all your failure callbacks behave the same way. ...just not
    the default one. Or you''d like to get rid of highlights entirely. Or something.


    To let you change these defaults, they are all centralized in the Ajax. InPlaceEditor.DefaultOptions
    object. You can alter them, whenever you create a new Ajax.InPlaceEditor, it will
    use the current state of this object as defaults. Of course, the specific options
    you pass for this construction override the current defaults, as usual.


    # 18.5 Dealing with Multiple Lines


    So far we''ve used single-line editor fields. But sometimes the element you make
    in-place editable holds quite a- lot of markup, and multiple-line editing would
    be preferable. How can we do this?'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'Well, it all hinges on two things: the rows option and whether there are line
    breaks (\r or \n: carriage returns or linefeed characters) in the content to edit.


    If rows is at its default of 1 and there are no line breaks, you''ll get a single-line
    editor (an <input type="text"> element). But if there are line breaks or rows
    is greater than 1, you''ll get multiple-line editing. If rows is 1, it is ignored
    in favor of the value stored in Ajax.InPlaceEditor.DefaultOptions.RowsAuto, which
    originally is 3.


    The rows option governs the height of multiple-line editors; their width is governed
    by the cols option, which lacking a default, is assumed to be 40 if missing. The
    reason there is no default value is that there is no size option to set the width
    of single-line editors but there is a cols option, it will be used for single-line
    editors too. This is intended to help homogenize the width of a given editor over
    time, whether the content has multiple lines or not.


    You should also know that when a multiple-line editor (technically a <textarea>)
    is used, OK and cancel controls will appear below, next to it; a <br> element
    will be added right after the editor.


    In a general manner, the logic for deciding when to use single-line editors, along
    with how the content was transformed prior to putting it in the editors, has changed
    significantly during refactoring. The new behavior is not entirely backward compatible
    but is thought to be much more useful and flexible.


    # 18.6 Editing Alternative Text


    OK, now for a very cool moment—you can actually have your users edit alternate
    content, instead of the markup inside the element. For instance, perhaps you''re
    building some sort of wiki; although it''s rendered as XHTML, you''re using some
    simpler markup, such as Textile or Markdown, for the source text of articles and
    sections. The server side renders these into the XHTML seen on your pages but
    stores using the simpler syntax.


    You can do this all by the way of having your in-place editors load the alternate—"source"—content
    when being activated and benefit from the default html_response mode in order
    to get the corresponding XHTML from the server side when saving to it.'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'All you need to use is the loadText option to specify the URL required to load
    the alternate content. It will automatically be passed an extra editor parameter,
    just like the operation detail in Section 18.3, How Can We Tweak the Ajax Persistence.,
    on page 354. How-ever, it will use a GET method by default, instead of POST (as
    opposed to the behavior prior to refactoring), unless yourajaxOptions explicitly
    contains a method option that says otherwise.


    When loading alternate text, the editor''s content is temporarily set to the text
    specified in the loading option, which defaults to Loading..., and the editor
    and submission systems (Return key, OK control) are disabled. The form can be
    styled, during loading, with the CSS class specified in loadingClassName, which
    defaults to inplaceeditor-loading.3


    As soon as the alternate content is retrieved, it is put in the editor, and the
    whole UI is enabled again.


    This fairly covers an example. Textile and Markdown are both readily available
    as gems (Ruby packages) but are not part of the standard Ruby library, and I do
    not want to take you through the steps of gem installation for this example, so
    we''ll make do without these neat markup libraries. We''ll use empty line delimiters
    and triple percent signs (%%%) to be interpreted as explicit line breaks (which
    will become <br> followed by a line break).


    So, let''s copy over our original example, with only one in-place editor. We''ll
    need three actions: one to serve the full page, one to serve the source map for
    the editable element, and one to save and return the XHTML equivalent. The resulting
    server script is as follows:


    ```

    # /usr/bin/env ruby

    require ''cgi''

    require ''erb''

    require ''webrick''

    include WEBrick


    template_text = File.read(''index.rhtml'')

    template = ERB.new(template_text)

    ```


    +   - Beware of the difference of targets between loadingClassName, which applies
    to the whole editing form, and savingClassName, which applies only to your original
    element whose content is, at this point, only the save message.'
