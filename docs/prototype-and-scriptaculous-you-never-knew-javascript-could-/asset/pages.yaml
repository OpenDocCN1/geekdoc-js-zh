  md: '# What If These Methods Exist Natively?


    Simple as Sunday: they''re left as is. Prototype''s method extensions apply only
    when there is no native version present in order to maximize execution speed.


    #  7.2 Element, Your New Best Friend


    Your gateway to DOM extension is the Element namespace. It contains the DOM extension
    machinery and the repositories for the extra methods (mostly Element.Methods).


    # Calling the Methods


    All methods can be used in these ways:


    +   - As vanilla functions, which can be passed any DOM element (including, most
    important, nonended ones) as their first argument. The easiest way is to call
    them through the Element space:

    ```javascript

    Element.remove(elt);

    Element.next(elt, ''ji'');

    ```

    - As methods over extended elements, which certainly feels more like object-oriented
    programming:

    ```javascript

    $(elt).remove();

    $(elt).next(''ji'');

    ```


    All mutative methods return their original element extended. A mutable method
    alters the element in some way. Methods returning elements (for example, fetching
    the descendant elements of the one passed as first argument) return extended elements,
    too. This makes chaining easy:

    $$(elt).next(''ji'').remove();


