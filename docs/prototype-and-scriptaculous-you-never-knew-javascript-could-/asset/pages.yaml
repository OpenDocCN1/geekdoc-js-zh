  md: "# Firing Custom Events\n\nPrototype 1.6 introduces custom events, which are\
    \ events with a name-spaced name (that is, a name with two components separated\
    \ by a colon delimiter, as in widget:activated) that you can fire on any DOM element,\
    \ which bubble as regular DOM events and are equipped with the usual normalized\
    \ properties and methods.\n\nPrototype will soon bundle a series of built-in custom\
    \ events to make several lifecycle maintenance tasks easier (for example, react\
    \ to DOM fragments being updated or removed, react to drag and drop in better\
    \ ways, and so on. So far, you can still use this for adding your own events to\
    \ DOM elements.\n\n```\nelement.fire(eventName [, memo = ()]) → Event\n```\n\n\
    To fire a custom event on an element, simply call the fire() method on it, possibly\
    \ passing any data you want to attach to the event (it will be accessible through\
    \ the event object's memo property). The event then triggers on the element and\
    \ bubbles like any regular event. It is detected normally by registered observers,\
    \ can be canceled, and so on.\n\nTo steal an example from the release notes, imagine\
    \ you have a title somewhere, and every time it is changed, you judge some visual\
    \ behavior to happen (say, a highlight effect). You could define a custom event\
    \ for this element (let's call it title:changed) and register the proper listener\
    \ for it.\n\nAssuming the following XHTML fragment:\n\n```\n<div id=\"container\"\
    >\n  <h1><span id=\"title\">Release notes</span></h1>\n  ...**\n</div>\n```\n\n\
    ...we'd use the following code to register a listener for our custom event:\n\n\
    ```\n$('container').observe('title:changed', function(event) {\n  this.highlight({\
    \ duration: 0.5 });\n});\n```\n\nAs you can see, it is not different from our\
    \ usual handlers. Now when some code, somewhere, changes that title (perhaps from\
    \ a script in an Ajax response), it would just need to conclude its edit with\
    \ the following line:\n\n```\n$('title').fire('title:changed');\n```"
