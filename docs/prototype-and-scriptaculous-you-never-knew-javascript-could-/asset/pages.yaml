  md: 'The whole set of methods ending with -Offset returns a coordinate set.

    Depending on the coordinate system you''re interested in, you''ll pick one or
    the other:


    +   - cumulativeOffset() returns the position in the document''s system (from
    the top-left corner


    offsetParent() returns the positioning container of the element. Every positioned
    element (be it relative or absolute positioning) has a positioning container,
    which is defined by a nontrivial set of rules in the CSS specification, as the
    "CSS-containing block."


    Sometimes you need to take an element and start manipulating it like it is positioned
    in a certain way (usually relative or absolute). And perhaps it is not positioned
    that way. You can make it positioned according to your needs without changing
    its visible position (which would cause a rather troubling movement) by using
    either absolute() or relativize().


    Finally, clonePosition() lets you apply the positioning of another element to
    yours. However, getting the same positioning may not be what you had in mind.
    You likely want a derivative positioning, such as "just put me below it, with
    the same width and its original height" (this is what happens, for instance, with
    the list of suggestions in script.acolo''s autocompletion feature).'
