  md: 'when the corresponding keyspace is pressed. There is no portable way of determining
    laterality (all these keys usually exist on both sides of the keyboard), something
    DOM Level 3 Events will more than address with its future keyLocation field.


    Now for the tough part: determining which key was pressed. It depends on no less
    than three contextual parameters:


    +   * What your browser is (ouch!)

    * Whether you''re after a character key (for example, A or B) or not (for example,
    PageDown or Esc).

    * Whether you''re listening to a key movement event (keydown or keyup) or a character-producing
    event (keypress)


    If you''re on Internet Explorer, handling a key movement event, or are dealing
    with noncharacter keys, you''re going to look at the event object''s keyCode property,
    which holds the Unicode value for the key.


    On the other hand, if you''re not on Internet Explorer, and handling a character-producing
    event, and are interested in character keys, you''ll look exclusively at the char
    property, which holds the Unicode value for the character. Both properties are
    never set on the same event.


    If you think carefully about this, there''s a lesson to be learned: never rely
    on keypress, because this opens the gate to a browser-compatible nightmare. Always
    use keydown and keyup constants, along with the event''s keyCode property. That''s
    portable.


    Finally, here is the current set of keys provided by the Event namespace: BACKSPACE,
    KEY_DELETE, KEY_DOWN, KEY_END, KEY_ESC, KEY_HOME, KEY_INSERT, KEY_LEFT, KEY_PAGEDOWN,
    KEY_PAGEUP, KEY_RETURN, KEY_RIGHT, KEY_TAB, and KEY_UP. This is by no means an
    exhaustive list (obviously!); this is just a compiled from the needs of Prototype
    and script.aculo over time.


    As an interesting side note, know that the future DOM Level 3 Events specification
    chooses a more generic way, equipping keyboard events with a identifier property,
    which is a normative string identifier for the key. The specification, currently
    at the working draft level, defines a comprehensive set of 196 key identifiers.'
