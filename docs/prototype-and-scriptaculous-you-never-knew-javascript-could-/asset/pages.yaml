    part of the id= the DOM element responsible for playing the sound. You would likely
    use such names as effects, notifications, music, or ambience.


    Note that currently, grouping sounds in tracks is useful when you need to replace
    them with another sound, as described in the next section.


    # The replace Option


    Sometimes you may want a new sound to replace any currently running sound in its
    track. Perhaps you’re signaling the end of a process and that process was made
    “audible” through the use of a little tune or something; perhaps you have “ambient”
    sounds that reflect the current visual theme or universe, the user you need to
    reflect not only visually but also audibly. In this case, you can use the replace
    option and set it to true (it defaults to false). All currently running sounds
    in the track will be stopped, and your new sound will start.


