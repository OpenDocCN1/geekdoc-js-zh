  md: 'There is nothing so useless as doing efficiently that which should not be done
    at all.


    +   - Peter F. Drucker


    # Chapter 11


    # Performance Considerations


    # 11.1 Element Extension and the $ Function


    If you''re running on a browser that does not feature native DOM element prototypes
    (for example, Internet Explorer), extending elements unnecessarily can have some
    performance impact. Such extensions are not always easy to spot in your code.
    A lot of Prototype methods automatically extend their arguments, instance, or
    the elements they return. Just look at all the calls to $() in the source.


    Still, in most cases this is not a real issue. Here are the two main reasons why:


    +   - Element extension happens at most once per element. Attempting to extend
    an already extended element has a much lower cost (basically, just the function
    call cost).


    +   - Element extension is, in itself, not a complex process. It mostly means
    copying bunch of properties from one object to the element. To become noticeable
    from a user''s perspective, it would have to operate on hundreds, if not thousands,
    of unextended elements.


    If you need to work over a vast amount of elements without extending all of them,
    you can still revert to a regular loop over these elements, and either use a namespaced
    syntax when calling ''extended'' methods on them (for example, Element.hide(elf)
    or extend only those you''re interested in (by manually calling Element.extend()
    on them).


    On the other hand, many Prototype features will automatically extend their element-based
    results. Most notably, the almighty $$($), which'
  merge: -1
