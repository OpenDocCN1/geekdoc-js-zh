    the effect goes from start to finish over time), and effect queues

    (which let you create advanced effect sequences), enough to cover

    most of your needs. Even if you found it lacking, adding new

    effects is easy enough.


    # Drag and drop


    You will use the dragdrop module to make any element draggable,

    turn it into a drop zone, or even make entire series of elements

    sortable so you can rearrange them by dragging and dropping—a

    killer improvement on list sorting.


    # Autocompletes and in-place editing


    This module makes it easy to slap an autocompletion facility over

    regular text fields, which can come from the server side (through

    Ajax) or from a preloaded set of possibilities. You can also make

    just about any text or collection of items editable in-place by sim-

    clicking it. A specific UI will appear and notify the server side

    when editing is done to be persisted.


    # Sliders


    A slider is a sort of small rail, or track, along which you can slide a

    handle. It translates into a numerical value. With script.aculo.us,

    y can create such sliders with a lot of control: define bound-

    aries, restrict possible positions to specific values, use multiple

    handles (for instance, to define ranges), and so on.


    On the other hand, customizing the aspect of your sliders will

    be possible only to a certain extent, which is a necessary limita-

    t with such complex UI elements, when they are created using

    XHTML.'
