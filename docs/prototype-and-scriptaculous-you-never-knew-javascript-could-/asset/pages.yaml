  md: '# Using the keyboard and mouse


    Once a list of choices is displayed, it automatically reacts to the keyboard and
    mouse to help pick an option as easily as possible:


    +   - The Up Down keys change the selected option (and wrap at the limits of the
    list). Hovering the mouse over options automatically changes the selected option
    to the one below it.


    +   - Pressing Tab or Return, or clicking an option, confirms selection and completes
    the text field accordingly. The list is then hidden.


    +   - Pressing Esc or moving the focus away from the text field cancels completion,
    hiding the list.


    # Options You''ll Get No Matter What


    Whatever the source mode, you''ll always get at least the following three:


    autoSelect


    Determines whether to automatically accept the autocompletion choice when it''s
    the only one. Defaults to false (indeed, in many situations, this can be confusing
    to the user).


    frequency


    This option lets you specify the interval, in seconds, between two attempts at
    autocompleting the input. It defaults to 0.4, which is reasonably fast from a
    user''s standpoint.


    minChars


    Determines how many characters need to be typed before autocompletion kicks in.
    This is useful when relying on a data source that has so many values that would
    be too numerous based on only a few characters. Still, it defaults to 1.


    # 16.2 Local Autocompletion


    Let''s start here with the simplest setup: a data source provided by a JavaScript
    array in our count. Create a directory for this, and put the necessary JavaScript
    files in it—prototype.js and scriptacious.js, of course, but also effects.js and
    controls.js, which we will need for our demonstration.'
