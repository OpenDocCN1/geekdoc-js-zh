  md: '> Furious activity is no substitute for understanding.

    H H. H. Williams


    #  Chapter 2


    # # Discovering Prototype


    This part provides in-depth coverage of Prototype, which is the JavaScript library
    at the core of this book. Prototype is a very dense library: although rather small
    (at about 120KB raw, less than 30KB gzipped, it is no huge framework), it is replete
    with features, helper objects, and nifty tools, arranged in a reasonably consistent
    set.


    But before we go ahead, we need to answer a few questions and tackle the more
    involved subjects with a clear mind and proper expectations. For example, what''s
    Prototype exactly? What should we expect it to do for us? What kind of listo we
    need to learn? And apparently it relies on...well, prototypes so what are JavaScript
    prototypes in the first place? I''ll start explaining all this quickly; you will
    be armed with everything necessary to fully leverage the following chapters.


    # 2.1 What Is Prototype, and What Is It Not?


    Prototype is a JavaScript library designed to improve the browser''s JavaScript
    environment; it extends DOM elements and built-in types with useful methods, built-in
    support for class-style OOP (including inheritance), advanced support for event
    management, and power-Ajax features.


    Prototype is not a complete application framework: it does not provide widgets
    or a full set of standard algorithms, I/O systems, or what you have. It stands
    in this middle ground between down-and-dirty manual coding of everything and full-fledged
    frameworks with their countless objects. Most massive frameworks do indeed use
    Prototype internally and build upon it.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Note, however, that there is a more visual-oriented library working closely
    with Prototype called script.aculo.us; we''ll explore it in the sec-ond part of
    this book.


    Although inspired by the Ruby programming language, Prototype is not attached
    to any server-side technology. True, it stems from the Ruby Rails universe, but
    it is a stand-alone spin-off. It is indeed very easy to use Prototype when coding
    with Ruby on Rails, but the library can be used with no difficulty over any back
    end, such as PHP, J2EE, or ASP.NET. It is very successfully used in production
    for projects with all these technologies and more.


    Prototype is distributed as a single file called prototype.js, currently weighing
    about 120KB (before any start of packing or gzipping). Despite this relativity,
    it provides a large set of features, most of which interoperate in an intuitive
    way.


    # 2.2 Using Prototype in Our Project


    So, how do we get enabling Prototype in a web page? It is really quite simple:
    we just need to load prototype.js, and loading it will first let us leverage its
    power in any other scripts. This loading is best done with a simple <script> element
    in the <head> of our page:


    ```

    <head>

    <script type="text/javascript" src=".../prototype.js"></script>

    ...

    head>

    ```


    # Where Can We Get Prototype?


    The official website is the authoritative source for the latest version of Prototype
    and also provides detailed, up-to-date API documentation with plenty of examples,
    tutorial-style articles, and a blog updated by the Prototype Core team. It is
    located at http://prototypejs.org.


    # 2.3 What Does Our JavaScript Look Like When Using Prototype?


    Good question. To make a long story short, it looks darn good. It looks nifty.
    It looks Rubesque. JavaScript is fun again. But don''t take my word for it—see
    for yourself. Let''s look at a simple example and then at a more involved, combined
    demo that will help you understand just how easy Prototype coding is.'
  merge: -1
