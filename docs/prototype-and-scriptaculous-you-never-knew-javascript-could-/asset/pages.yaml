  md: '# Appendix C


    # # Installing and Using Ruby


    Although Prototype and script.aculus are totally agnostic about the server side,
    I chose to use Ruby when writing the small servers for Ajax-based examples. The
    reasons for this are many:


    +   - Using server layers such as JavaEE, ASP.NET, or PHP requires some serious
    setup on your machine if it''s not already working environment. Sure, there are
    tools like EasyPHP for Windows, but that leaves out platforms.


    +   - JavaEE and ASP.NET require too much groundwork in order to get a working
    page. There''s project creation, server configuration, and more. And with PHP,
    unless you''re EasyPHP, there''s a lot of setup to do as well, binding to a web
    server, and so on.


    +   - I don''t like PHP all that much, too.


    +   - Getting the server technology up and running, in the context of this book,
    should be as unobtrusive as possible. Monitoring the server side should be easy,
    too, in case you mistype the scripts. This book is about Prototype and script.aculus,
    not about server-side technologies.


    So, I chose Ruby, because it''s simple enough for non-Rubists to grasp quickly
    (or at least, get the hang of the script works), it''s simple to install on most
    platforms (when it''s not already there), and there''s zero setup groundwork when
    you need a server with dynamic contents.


    To run the examples in this book, you will thus need to have Ruby installed on
    your machine. This is pretty easy to do, and this appendix will show you how.'
  merge: -1
