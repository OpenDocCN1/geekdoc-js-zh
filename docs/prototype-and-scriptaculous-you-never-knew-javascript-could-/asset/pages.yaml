- img_proc: true
  md: '# C.5 “But I Don’t Know a Thing About Ruby!”


    Have no fear, no fear. Ruby is the kind of language you can quickly get the basics
    of; it follows the principle of least surprise. To newcomers, a piece of Ruby
    code often does *what it seems to be doing*. And the code in this book refrains
    from using too much Ruby-fu so as not to make your head spin.


    At any rate, if you''re interested in learning more about this wonderful language,
    the prime resource for head is the official website, which links to everything
    you''ll need to quickly get on the saddle, from 20-minute tutorials to book-length
    material.


    The official site is here http://ruby-lang.org.


    Here are some great write-ups that will take you less than an hour and equip you
    with everything you need to comfortably wade through the examples:


    http://tryruby.hobix.com/


    +   An interactive, 15-minute demo. It''s entirely online and doesn''t require
    you to install Ruby first! Coming from the infamous Lucky Stiff, it''s very funny
    to walk through, too.


    http://www.ruby-lang.org/en/documentation/quickstart/


    +   A 20-minute intro to Ruby, which is pretty cool to help you dive in. Like
    a lot of documentation on the Ruby official website, it''s available in a variety
    of languages, including English, French, Spanish, and Japanese.


    http://www.ruby-lang.org/en/documentation/ruby-from-other-languages/


    +   Ruby is very cool, but coming from other languages can sometimes inhibit us
    with bred reflexes as to what is or not possible and how to achieve certain results.
    This write-up highlights important points and idioms every newcomer should know
    in order to get the best advantage of Ruby''s syntax and possibilities.


    You''ll find a lot more material, including books (sometimes very off ones, such
    as “Why’s (the poignant) guide to Ruby”) on the documentation page at http://www.ruby-lang.org/en/documentation/.'
  merge: -1
