  md: '# Chapter 14


    # Visual Effects


    Animated effects are a huge part of why people use script.aculo.us. They are split
    in two groups: the core effects and the combined ones. Combined effects machinery
    usually rely on the parallel, synchronized execution of other effects. Because
    such an execution is readily available, creating your own combined effects is
    very easy.


    We''ll start with core effects and list the options that are part of the core
    effect machinery (which means they are available to all effects). We will then
    list the combined effects and their specific options. We will spend some time
    on the important topic of effect queues, currently far too unknown and underused,
    which makes all the difference between a newbie and an effects master. Finally,
    we''ll show how to create your own effects.


    To use the capabilities of script.aculo.us, you will need to load the effects
    module. So, your minimum loading for script.aculo.us will look like:


    ```

    <script type="text/javascript" src="effects.js"></script>

    ```


    Note that script.aculo.us relies heavily on Prototype, so you would go that something
    like this:


    ```

    <script type="text/javascript" src="prototype.js"></script>

    <script type="text/javascript" src="effects.js"></script>

    ```


    # 14.1 What Are Effects, and Why Should We Use Them?


    Well, there are plenty of reasons to use effects.


    Sometimes you need to bring part of your web page to the user''s attention, and
    visual cues, such as background fade-overs, opacity pulses,'
  merge: -1
