  md: '# What About File Fields?


    When a form contains a file field (&lt;input&gt; with type=''file''), traditional
    serialization-URL cannot happen anymore. Instead of using regular URL-site encoding,
    the form must be transmitted as multipart/form-data and encode the file bytes
    in a specific MIME part.


    Manually creating this multipart encoding would not be difficult, but JavaScript
    prevents it from accessing the contents of local files (unless you tinker with
    it, which is beyond most user''s abilities or access rights). Because of this,
    Prototype cannot use actual Ajax for sending local files.


    The usual workaround for this is to use a hidden &lt;iframe&gt; as the target
    for the &lt;form&gt; and submit the form the regular. Once the &lt;iframe&gt;
    is loading the result, we can access it through scripting. This is rather old-school
    and a bit ugly, but so far this is all we have.


    Note that a later version of Prototype may autosch to such a technique you''re
    trying to Ajaxify with file fields. In the meantime, you can find detailed walkthroughs
    on this many web pages, http://www.webtoolkit.info/ajax-file-upload.html (and
    a Google search on Ajax file upload will yield tons of other options);


