  md: '# Properties


    Be sure to set all key properties with care. *Type* will usually be *defect* (bug
    report) or *enhancement*. *Component* will be either *Prototype* or *script.aculo*.
    *Priority* determines how urgent the ticket is, while *Severity* determines its
    impact (how bad the bug is and how deeply the enhancement impacts the code base).


    Leave fields such *Milestone* and *Version* alone; those decisions by Who Commit
    To Trunk. Also refrain from manually assigning the ticket to someone in particular.


    # Keywords


    Spin-offs teams have agreed on a series of normalized keywords to use in the *Keywords*
    field that let sort through incoming staff. When a ticket requires only a tiny
    patch (for example, a trivial one-liner), use the keyword *tiny*. When the patch
    is well-tested and deemed ready (possibly after multiple revisions and a consensus
    in the comments) for application to the trunk, add the *ready* keyword.


    # Patches and tests


    Whatever the ticket, good patches are paramount. To have a decent chance at being
    processed quickly, a ticket has to come with a clean patch and a full completion
    of tests. The art of producing such things is what we will discuss in the next
    section.


    # Edge Spin-offs: The Subversion Repository


    Prototype, script.aculo, and everything in the Rails use Subversion for version
    control (keeping track of the history for all files in the source tree). You don''t
    need to be a Subversion guru to contribute to Prototype and script.aculo, but
    you''ll need, at the very least, to be able to get Edge from it.


    If you know CVS, you''ll be at right with Subversion. The basic usage is ideal.
    If you don''t know any of those, the website is http://subversion.tigris.org where
    you''ll find, among other things, a link to the excellent Subversion book,2 available
    in many formats, including PDF and online HTML. Chapters 1 and 2 should get you
    up and running in no time.


    +   2. http://svnbook.red-bean.com/'
