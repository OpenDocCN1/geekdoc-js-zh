  md: '```

    Effect.toggle()

    ```


    When hiding elements, you often show them back. Hide them again. And so forth.
    Because you often toggle visibility, usually with one of the Fade/Appear, BlindUp/BlindDown,
    or SlideUp/SlideDown sets, the convenience Effect.toggle() is here to make it
    shorter. Calling on any element will check whether it''s hidden (read: its display
    CSS property is set to none) and call the appropriate effect based.


    ```

    Effect.toggle(elt [.family = ''appear''])

    ```


    The allowed families are, logically enough, appear, blind, and slide. You don''t
    have to actually use these in pairs. An element toggled off using the slide family,
    for instance, can perfectly be brought back using blind.


    ```

    Effect.multiple()

    ```


    This is one Flash killer. It applies any effect, in delayed sequence, over a series
    of elements. For instance, you could use it with Effect.fade over the items in
    a list, to have them fade away progressively, from first to last, each beginning
    to fade out shortly after the previous one. This is governed by the generic delay
    option, plus the specific (though il-named) speed option, which expresses the
    internal delay between consecutive elements, in seconds. It defaults to 0.1.


    You can pass elements in a variety of ways:


    ```

    Effect.multiple(element, effect [.options])

    Effect.multiple([element, ... ], effect [.options])

    Effect.multiple(NodeList, effect [.options])

    ```


    When a single element is passed, its childNodes property is used.


    The really neat use of this is when you have text where each character is a separate
    element (for example


    ```

    Effect.tagifyText()

    ```


    This one is mostly a support function for multiple(). It takes all the text child
    nodes of an element and replaces them with the proper <span> (taking care of a
    few styling issues). Making regular text ready for multiple() becomes a snap.
    Here''s a short example:


    ```

    Effect.tagifyText(''heading''); // just once

    Effect.multiple(''heading'', Effect.Highlight); // any time

    ```'
