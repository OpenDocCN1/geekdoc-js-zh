    Prototype devote methods to the (somewhat technical) task of cloning objects.
    By cloning, I mean "producing an object with a shallow-copy of the original object''s
    property set." In short, we start with an empty object and iterate over all the
    properties in the original one, copying them to the new one. This is shallow copying,
    which means the properties do not get cloned. We just share references. This is
    no issue for simple values, such as strings and numbers, but can be surprising
    when properties are themselves custom objects, arrays, and with the like.


