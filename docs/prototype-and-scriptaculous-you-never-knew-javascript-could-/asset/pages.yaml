  md: "# We need a bit of CSS for this to work:\n\nDownload scriptaculous/dragdrop/cart1/demo.css\n\
    \n```\nh1 { font-size: 1.5em; }\n\n#products { margin-bottom: 20px; height: 180px;\
    \ }\n\n.product, #cart img { cursor: move; }\n\n#cart {\n  width: 350px; height:\
    \ 100px; padding: 1ex;\n  border: 1px solid #fa0;\n  font-family: sans-serif;\
    \ color: gray;\n}\n\ntrash {\n  width: 64px; margin: 0; padding: lex;\n  border:\
    \ 2px dotted white;\n  /* Internet Explorer doesn't know transparent... */\n}\n\
    ```\n\nNow for the script. It's actually concise:\n\nDownload scriptaculous/dragdrop/cart1/demo.js\n\
    \n```\ndocument.observe('dom:loaded', function() {\n  $('.product').each(function(book)\
    \ {\n    new Dragaggable(book, { revert: true });\n  });\n  Droppables.add('cart',\
    \ { //n    accept: 'product', onDrop: function(book) {\n      var bought = new\
    \ Element('img');\n      bought.src = book.readAttribute('src').replace('.', '.tiny');\n\
    \      new Dragaggable(bought).appendChild(bought));\n    }\n  });\n  Droppables.add('trash',\
    \ {\n    containment: 'cart', onDrop: function(bought) {\n      bought.remove());\n\
    \    }\n  });\n});\n```\n\nWe start by making all elements draggable Then we proceed\
    \ to create two drop zones. The first one is the cart, which accepts only those\
    \ elements with a product CSS class, as required by the accept option on line\
    \ 6. The second one is the trash can, which accepts only those elements originating\
    \ from the shopping cart. This is what the containment option says on line 14."
