  md: '# 19.4 Tweaking an Existing Slider and Adding Controls


    There are a few things you can do to a slider once it''s up and running. For instance,
    you can disable it and enable it later (which is useful when you use it as part
    of a form, because it won''t be disabled auto-matically by Form#disable(), for
    instance). The methods for this are simpl-fyEnabled() and setDisabled(). You can
    check whether it''s disabled by looking at the value for its disabled property.


    You can also programmatically change the value of the slider by using set-Value(value).
    If you need to specify a delta instead of an actual, use setValueBy(delta). This
    lets you easily implement external controls, such as arrow links or buttons. You''ll
    find an example of this in script.-aculo.us''s sliders functional test in test/functional/slider_test.html.


    Finally, as always with script.aculo.us controls, you can take back their features
    by destroying the control object. The method for this is-dispose().


    # 19.5 Defining Multiple Values


    A great feature of sliders lets you use multiple handles on a single track, which
    allows you to define multiple values on a single slider.


    The trick is to provide an alternative syntax for the sliderValue and han-dle
    options. They can take arrays, too. Each handle will be preset to the original
    value that matches it, a one-to-one basis, in sliderValue.


    The value-setting methods, setValue and setValueBy, also take an opt-ional second
    argument that is the index (starting at zero) of the handle whose value is being
    assigned. Instead of the single value property, you would use the values property,
    an array indexed in the same order as the handles.


    Your slider control maintains two properties for this: activeHandle and activeHandleId.
    The latest used handle (be it clicking, dragging, or programmatic setting) is
    the only one featuring a selected CSS class, which lets you set it visually apart.


    Finally, note that you can prevent handles from crossing each other (when dragging,
    you could prevent a handle from moving across an-other one). This is enabled with
    the restricted option, which you just need to set to true.'
