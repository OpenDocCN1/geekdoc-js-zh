    # 15.3 Ghosting


    When you''re dragging to express an actual movement of data (for example, taking
    an item out of a “excluded” list into a “included” list), regular drag is fine
    and proper. In other contexts, dragging may be a means of assigning a specific
    status to a piece of data. Perhaps you''re putting an item in your shopping cart;
    this doesn’t mean the item is in stock anymore and available for further shopping.
    Or perhaps the element represents one of a few building blocks for a sequence,
    and you can drag elements repeatedly on some sort of sequence container to build
    the sequence itself.


    Or you may just want the original element to move out of its original position,
    because this would cause a reflow that you could consider unless it is an actual
    drag.


    For this kind of situation, you can arrange to drag a temporary clone of the draggable
    element; this clone is called *ghost*, so the option for it is ghosting, which
    defaults to `false`. By simply setting it to `true`, you’ll get to drag a ghost
    of the element instead of the element itself. This doesn’t change anything about
    other aspects of the drag (for example, movement constraints, reverting, or effects).
    When you’re done with the drag, you can use callback hooks to manipulate the original
    element if need be.


    | Option | Description |


    | ghosting | Whether to use ghosting, that is, dragging a clone of the element
    instead of the original. This defaults to `false`. |


    Note that ghosting doesn’t make a lot of sense unless you’re dealing with specific
    drop locations or drop-related actions. We’ll deal with dropping in the next section.
    In the meantime, Figure 15.3 the following page illustrates what a ghosting-enabled
    drag looks like. You will find the example in the source code archive for this
    book in `scriptacious/dragdrop/ghosting`.'
