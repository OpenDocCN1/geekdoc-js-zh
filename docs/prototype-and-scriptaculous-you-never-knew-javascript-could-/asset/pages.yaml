    are indeed objects in JavaScript. Hey, that’s just like in Ruby!


    For instance, ECMAScript-compliant numbers (as of the third edition, which is
    roughly JavaScript 1.5) feature, among other methods, toString() and toFixed().


    What, you never used those?'
