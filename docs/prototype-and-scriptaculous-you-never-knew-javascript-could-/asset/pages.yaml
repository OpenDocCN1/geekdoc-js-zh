- img_proc: true
  md: '![](img/58ce77657835196da1e063557fbd9fb0_306_0.png)


    Figure 15.6: hoverclass on drop zones


    Finally, I''d like to mention this little-used option you can put on Draggable
    when you intend to work with drop zones:


    | Option | Description |

    | --- | --- |

    | quiet | Whether to wait until drop to check whether dropping is allowed and
    work with the drop zone. This defaults to false, so drop zones interact with the
    drag on the fly. If you have a true of drop zones, enabling it can help improve
    performance |


    # 15.8 Sorting with Drag and Drop


    By using Draggable and Droppables, you can achieve just about any drag-and-drop
    need you may have.


    One of the most common needs is to provide the user with the ability to reorder
    elements (such as items in a list) by dragging them. Without drag and drop, reordering
    can be a nightmare of clicking arrow glyphs or similar buttons and can take a
    while to go through. For users, it does seem to forever, which is a sure sign
    your reordering is not going to be much. Mouse support is a big help, letting
    users simply drag items in their final position. However, this particular feature
    calls for quite a hefty of advanced code (if you want to make it reusable), which
    is why script.aculo.us provides extended reordering support out of the box through
    the Sortable class.'
  merge: -1
  pgno: 306
- img_proc: true
  md: "# I Want a Sortable List, Now!\n\nYes, I can feel it from where I sit. So,\
    \ let's go for a simple example. We'll define a regular ordered list and make\
    \ sortable, leaving all options (they are numerous) to their defaults. Our XHTML\
    \ page has the usual structure, and the body looks like this:\n\n```\n`Download`\
    \ scrichtulous/dragdrop/sortable/index.html\n&lt;h1&gt;You ought to love these\
    \ guys&lt;/h1&gt;\n&lt;ol&gt;\n  &lt;li id=\"guys_1\"&gt;Arnaud Berthomer&lt;/li&gt;\n\
    \  &lt;li id=\"guy_2\"&gt;Elodie Jubert&lt;/li&gt;\n  &lt;li id=\"guy_3\"&gt;Justin\
    \ Palmer&lt;/li&gt;\n  &lt;li id=\"guy_4\"&gt;Rick Olson&lt;/li&gt;\n  &lt;li\
    \ id=\"guy_5\"&gt;Thomas Fuchs&lt;/li&gt;\n&lt;/ol&gt;\n```\n\nWe'll keep the\
    \ styling to almost nothing:\n\n```\n`Download` scrichtulous/dragdrop/sortable/demo.css\n\
    h1 { font-size: 1.5em; }\nl { cursor: move; }\n```\n\nWe'll just need a pinch\
    \ of scripting, based on the following method:\n\nSortable.create(element [. options])\n\
    \nThe scripting goes like this:\n\n```\n`Download` scrichtulous/dragdrop/demo.js\n\
    document.observe('dom: 'loaded', function() {\n  Sortable.create('guys');\n});\n\
    ```\n\nThat's it! Figure 15.7, on the next page, shows various stages of toying\
    \ around the list drag and drop.\n\nAnd it's not just for <ul> or <ol> containers,\
    \ either. You'll be able to use this for just about any elements within a given\
    \ container. We'll learn how to customize this in a few moments with the options.\n\
    \n# Getting the Items' Order\n\nAs the user reorders the elements in your sortable\
    \ container, you'll probably want to get the current ordering now and then, perhaps\
    \ to store it on the server.\n\nSortable.serialize(element [. options]) -> URLEncodedString"
  merge: -1
  pgno: 307
- img_proc: true
  md: "# SORTING WITH DRAG AND DROP\n\n![](img/58ce77657835196da1e063557fbd9fb0_308_0.png)\n\
    \nYou ought to love these guys\n\n+   1. Arnaud Berthomier 1. Elodie Jaubert 1.\
    \ Elodie Jaubert\n2. Elodie Jaubert 2. Arnaud Berthomier 2. Arnaud Berthomier\n\
    3. Justin Palmer 3. Justin Palmer 3. Justin Palmer\n4. Rick Olson 4. Thomas Fuchs\
    \ 4. Thomas Fuchs\n5. Thomas Fuchs 5. Rick Olson 5. Rick Olson\n\nFigure 15.7:\
    \ Dead-simple list sorting\n\nIt produces a URL-encoded representation of the\
    \ current ordering, based on the container and the ordered elements. The default\
    \ rule is as follows:\n\n+   - The container's id= attribute is used as field\
    \ name, suffixed with // (this makes things easy on server layers based on PHP\
    \ or Rails, for instance, and poses no discomfort to other technologies). If that's\
    \ unsatisfactory to you, you can override this by passing an option (it will be\
    \ suffixed with square brackets).\n- The id attributes for the ordered elements\
    \ (Sortable uses <li> children by default) extract field values. They are analyzed\
    \ using a regular expression, which defaults to Sortable.SERIALIZE_RULE; I'll\
    \ spare you the details, but this means your id attributes need to be of the form\
    \ xxx_yyy, and the second part (everything after the first underscore) will be\
    \ used as a value.\n\nSo, let's take our previous example. We had the following\
    \ list:\n\n```\nDownload load scriptaculous/dragdrop/sortable/index.html\n<ol>You\
    \ ought to love these guys</ol>\n<ol id=\"guys\">\n  <li id=\"guy_1\">Arnaud Berthomier</li>\n\
    \  <li id=\"guy_2\">Elodie Jaubert</li>\n  <li id=\"guy_3\">Justin Palmer</li>\n\
    \  <li id=\"guy_4\">Rick Olson</li>\n  <li id=\"guy_5\">Thomas Fuchs</li>\n</ol>\n\
    ```\n\nNow let's assume the user moved Elodie in first position and Thomas in\
    \ fourth, as shown on Figure 15.7."
  merge: -1
  pgno: 308
- img_proc: true
  md: "Here are a couple serialization calls and their results:\n\n```\nSortable.serialize('guys')\n\
    \ -> guys[i]=2&guys[i]=1&guys[i]=3&guys[i]=5[]=4\n```\n\n```\nSortable.serialize('guys',\
    \ { name: 'users' })\n -> users[i]=2&users[i]=1&users[i]=5[]=4\n```\n\nThe default\
    \ requirement for id= is usually just fine, but you might need to change other\
    \ formats. Perhaps you need to use hyphens instead of underscores or take the\
    \ id- instead of just a part?\n\nYou can do this by providing a custom format\
    \ option, which must be a regular expression isolating the desired part as the\
    \ first captured group. Note that you can define this option once and for all\
    \ when creating the Sortable object, it doesn't have to be defined every time\
    \ you call serialize().\n\nLet's suppose we have the following list:\n\n```\n\
    <ol>\n  <li id=\"sub123\">Wired</li>\n  <li id=\"sub456\">456 Berea St.</li>\n\
    \  <li id=\"sub789\">A List Apart</li>\n</ol>\n```\n\nThese id-attributes do not\
    \ match the default format option, and we would end up with a useless result:\
    \ subs[]=&subs&subs[]. But we can provide a custom format, at creation time, or\
    \ in the following script, when serializing:\n\n```\nSortable.serialize('subs',\
    \ { format: /^\\subs(\\d+)/ })\n -> subs[]=126&subs[]=456&subs[]=789\n```\n\n\
    # Posted with Two Callbacks\n\nWhen you let your users reorder elements, you want\
    \ to be notified when they do. There are actually two distinct situations here:\n\
    \n+   An element is being dragged and gets into a new position; it's not being\
    \ dropped yet, so it might end up dropped in its original position. Still, the\
    \ onChange callback is notified, with the dragged element as an argument.\n\n\
    +   In regexes, a captured group is a group of characters delimited by parentheses\
    \ (unless the opening parenthesis is followed by ?, in which case the group is\
    \ noncapturing). They are numbered starting from 1 and are useful to individually\
    \ grab parts of the matched string, perhaps to reuse them later in the search\
    \ pattern or in a replacement."
  merge: -1
  pgno: 309
- img_proc: true
  md: "# SORTING WITH DRAG AND DROP\n\n+   - An element was dragged and dropped, and\
    \ the ordering actually changed compared to before. The onUpdate callback is fired,\
    \ with the container element as argument.\n\nA small note about when element \"\
    changes position\" in the list while being dragged: it requires the mouse cursor\
    \ to be dragged beyond the hovered element, in the dragging direction (for instance,\
    \ if you're dragging vertically, the mouse cursor must go beyond the height of\
    \ the hovered element). That's pretty intuitive behavior for most users.\n\nLet's\
    \ augment our previous example to get the hang of just these callbacks get called.\
    \ We'll add two notification zones below the <ol> element, like this:\n\n```\n\
    <p id=\"changeNotification\"></p>\n<p id=\"updateNotification\"></p>\n```\n\n\
    Now let's create our Sortable container to register callbacks:\n\n```\ndocument.observe(':loaded',\
    \ function() {\n  var changeEffect =\n  Sortable.create('guys', {\n    onChange:\
    \ function(item) {\n      var list = Sortable.options(item).element;\n      $('changeNotification').update(Sortable.serialize(list).escapeHTML());\n\
    \      if (changeEffect) changeEffect.cancel();\n      changeEffect = new Effect.Highlight('changeNotification',\
    \ {\n        textcolor: 'transparent' \n      });\n    },\n    onUpdate: function(list)\
    \ {\n      $('updateNotification').update(Sortable.serialize(list).escapeHTML());\n\
    \      $('updateNotification').highlight({ startcolor: '#9ffff9' });\n    }\n\
    \  });\n});\n```\n\nNotice the trick on line 5. The argument receive is the dragged\
    \ element that just changed, but we can use this on Sortable.serialize(). We need\
    \ the container on which we called Sortable.create(). Naturally, we could just\
    \ pass the id= of the container, or the reference to it, but the code here is\
    \ more generic and dynamically retrieves the container for the element pass."
  merge: -1
  pgno: 310
- img_proc: true
  md: "# You ought to love these guys - Icewasel\n\nYou ought to love these guys\n\
    \n+   1. Arnold Berthromer\n2. Emile Laubert\n3. Justin Palmer\n4. Rick Olson\n\
    5. Thomas Fuchs\n\n+   1. Arnold Berthromer\n2. Emile Laubert\n3. Rickson\n4.\
    \ Justin Palmer\n5. Thomas Fuchs\n\n```\npays(y=[[-16px]|[-26px]|[-46px]|[-56px]])\n\
    ```\n\n```\npays(y=[[-16px]|[-26px]|[-46px]|[-56px]=5)\n```\n\nFigure 15.8: onChange\
    \ and onUpdate in action\n\nWe also avoid multiple highlight effects going on\
    \ concurrently when the user drags too fast across the list, and we make sure\
    \ that highlight finishes with a transparency instead of whatever degree of yellowness\
    \ was current (because of a previous highlight going on) the latest onChange()\
    \ callback handled.\n\nFigure 15.8 shows various states of the page as we drag\
    \ an item and finally release it. Releasing it on its original position does not\
    \ fire onUpdate, the final order is unchanged.\n\n# Binding to Ajax\n\nOf course,\
    \ onUpdate is a prime candidate for triggering Ajax notifications to the server,\
    \ for instance when the user reorders a to-do list or some other data set. Combining\
    \ Ajax.Request and Sortable.serialize makes live persistence simple:\n\n```\n\
    Sortable.create('tasks', {\n  onUpdate: function(list) {\n    new Ajax.Request('/tasklist/1',\n\
    \    parameters: Sortable.serialize(list)\n  }\n});\n```\n\nNote that if your\
    \ server side is RESTful, you'll want to add the method: 'put' option, because\
    \ you're updating data, not creating it.\n\n# Reordering with Horizontal Layouts\n\
    \nSo far we've used reordering in a vertical layout, and you may have noticed,\
    \ when trying our examples, that the dragging won't let you move items horizontally;\
    \ only vertical movement is rendered."
