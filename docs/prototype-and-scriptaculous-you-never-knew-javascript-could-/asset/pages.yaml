    # 10.2 Expressing Ranges of . . Well, Anything You Want!


    Talking about simple guys, met ObjectRange. This is the class

    behind the SR() utility function, which we saw in Section 3.8, Handling

    Ranges with $R, on page 50. This class simply represents a range of

    values, which can be of any type amenable to ranges. OK, so what

    exactly makes a type amenable to ranges?


    Well, in short, it just has to have a succ() method. When you call it on

    a value, you get the next value. That''s. Prototype puts a method in

    Number and String, so out of the box, you can have number ranges

    and string ranges. The former is actually more used (and useful)

    than the latter.


    Ranges mix in Enumerable, which is the salient point about them. It lets

    y iterate easily, slap them on existing sequences with methods such

    as zip(), or easily convert them to an array (since Enumerable provides

    ranges with a generic implementation of toArray()).


    # Creating Ranges


    Oh, that''s a walk in the park:


    ```

    $R(start, end, [.exclusive = false)

    new ObjectRange(start, end, [.exclusive = false)

    ```


    For once, there is absolutely no distinction whatsoever between the

    utility function and its vanilla counterpart. They share the

    same semantics.


    # Range Iteration


    Ranges iterate from the start value to the end value, calling succ() on

    the current value to get the next one. If the exclusive parameter is set to

    true, the end value is skipped; the iteration will stop right before it.'
