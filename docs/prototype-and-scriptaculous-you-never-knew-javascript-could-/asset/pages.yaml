  md: '# The Art of Observing Events


    A lot of web developers these days are still using plenty of obstructive JavaScript.
    That is, their HTML pages are laden with event-related attributes (<body onload=''...'')
    or inline <script> elements. But you can see, this is increasingly regarded as
    bad because this mixes content and behavior, which is generally not the best thing
    to do (although I should mention it may yield a performance boost in specific
    cases or make it easier to provide tooling for script-based features). It also
    leads to inconsistent behaviors when Internet Explorer calls attached this way.


    You may object that your page-creation tools are the culprits and that you just''t
    make them do things in a better way. Well, first, check your vendor for upgrades:
    unobtrusive JavaScript, which aims to pull all (or at least most) scripting outside
    the content file (in separate Script files), is quickly becoming the widely accepted
    best practice.


    The clean scenario is like this:


    +   The DOM of the page loads, creating elements in source order—the <html> node,
    the <head> node, and at some point the <script> nodes—which immediately load and
    process your scripts.


    +   Because the body of the page is not loaded yet, it is important to remember
    not register event listeners on page elements yet. You''ll have to wait for phase
    2, or at worst phase 3, in this sequence.


    +   The DOM is fully loaded; all elements described by the document are created
    in memory. External resources may not be loaded (for example, images, CSS files,
    embedded objects), but their DOM elements exist. From this point, you can register
    event listeners on them. Prototype 1.6 introduces a normalized DOMContentLoadedLoaded
    event (originally a custom event from Mozilla) so you can react at this phase.
    Just the custom dom:loaded event on the document object.4


    +   3. The page is fully loaded; all external resources were loaded in and processed.
    That''s when the load event triggers on the win-


    +   Due credit: the code is inspired by the excellent writers of Dan Webb, Mathias
    Miller, Dean Edwards, and John Resig. As Isaac Newton would have said, we stand
    on the shoulders of giants...'
