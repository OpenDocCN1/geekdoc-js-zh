    Figure 2.1: Our dynamic, custom-styled content


    Ready to move ahead with something more involved? Here we go.


    # One Good-Looking Script: A Table Sorter


    To let you feel how using Prototype can lead to neat, cool JavaScript code, we''ll
    build a simple table sorter. As long as our (XHTML tables properly feature a feature
    `<thead>` and a `<body>`, our sorter object will be able to sort it.


    The idea is to unobtrively bind sort objects to `<table>` elements so that the
    user can click the column heading and have the table sort accordingly. Clicking
    a second time on the current sort heading switches to a descending sort. We''ll
    also use a few CSS class names so that styling can be applied to express the current
    sorting status.


    Our table sort system is "simpler" insofar as it does not deal with data types;
    it treats every cell as text. On the other hand, it does grab the cell''s whole
    text, regardless of internal markup.


    The full source code is available online. For this example, we''ll focus on the
    near parts, but there''s very little we''re leaving away: for CSS rules, status
    toggling for the sort, and extra `<table>` elements.


    # Laying the Groundwork


    OK, so we need an HTML page with a couple tables on it (just to show the sorting
    capability is neatly wrapped into an object and we can reuse it multiple times
    on the same page).'
