    # Inserting New Contents


    Inserting new contents in the DOM is a common need, especially when

    using Ajax. Here are a few scenarios that keep popping up when devel-

    oping web apps:


    +   - There''s this Ajax processing you do needs to have some place

    to put its error messages when something gets borky.

    - The user adds an item by filling in a form, which is then submitted

    through Ajax. What comes back from the server is the polished

    XHTML fragment that now needs to find its place at the bottom

    of the item list (perhaps a shopping cart or comments listing). A

