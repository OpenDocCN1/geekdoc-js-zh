  md: '# Removing or Replacing a DOM Fragment


    You must be extra careful when removing fragments of the DOM elements that were
    drop zones (by extension, this also applies to Sortable elements).


    Whenever you drag elements around, script.aculo.us will loop through its internal
    drop zone list that that are not in the DOM anymore can cause several issues,
    but the dominant one is a painful freeze of the browser.


    Prototype Core is currently working on implementing custom events, which would
    let Thomas jump in and make script.aculo.us auto-matically mops relevant drop
    zones, but for now you have to take care of the cleanup yourself. So, be on the
    lookout for DOM removals and replacements (for example, Ajax.Updater processing)
    that wipe out sections of the DOM where drop zones are registered. Be sure to
    unregister them as soon as possible (it''s OK to do this after the replacement
    happened, as long as the user didn''t get a chance to initiate a drag between).


    Generally generally, it pays to try and stay lean with the Draggable objects,
    Droppable-registered elements, and Sortable objects you keep around. For instance,
    if you have a very large set of items that are potentially draggable, use lazy
    initialization over those that the user appears to drag. Only make those draggable,
    on the fly. You''ll notice a significant speed! For further details, search through
    the archives of the Spinoffs mailing list.


    The cleanup methods are as follows:


    ```

    draggable.destroy()

    Droppables.remove(element)

    Sortable.destroy(element)

    ```


    # Creating Droppables in the Right Order


    A common mistake is to create drop zones in the inappropriate order. When a draggable
    element hovers over the document, it will iterate through the drop zone list in
    registration order, and the first one to match will be used, regardless of layering
    (the z-index property).


    > 3. http://groups.google.com/group/rubyonrails-spinoffs'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'So if you have a drop zone B that is located "inside" a drop zone A But A was
    registered before B, you''re in trouble, because B will never get a hold on your
    element; only A will.


    There is actually one case where script.angulo will still behave properly despite
    this—when B is a descendant element of A in the DOM. But if you''re playing with
    unrelated elements where they are through specific positioning, you need to tread
    carefully.


    The rule of thumb to avoid this is simple. Always register your drop zones from
    outside instead, the other way around. It may appear counterintuitive, because
    we''re used to the outside-in order because of DOM creation, but we need to think
    about it from a layering standpoint; the foremost zone first and then working
    away toward the background.


    # What We Just Learned


    As you can see, in barely 30KB of uncompressed JavaScript, script.angulo provides
    an incredible wealth of features for dragging and dropping, thanks to a few core
    objects and a wealth of options that cater to just about every need. This part
    of the library truly opens the doors to significant improvements of the user experience
    in our web applications.


    Let''s recap what we just saw:


    +   - Making an element draggable is as simple as doing a new Draggable over it.


    +   - Draggable supports a wealth of options to control movement and behavior.


    +   - Any element can become a drop zone, that is, a surface that reacts to a
    dragging operation hovering over it and dropping onto it. We just need to do a
    Dropables.add over the element. Options let us filter out unwanted drops.


    +   - An observer mechanism lets us globally monitor drag and drop in our page.


    +   - Because drag and drop is a great way to sort items and sorting is a common
    need, we have the Sortable class, which enables drag-based reordering of any series
    of elements.'
