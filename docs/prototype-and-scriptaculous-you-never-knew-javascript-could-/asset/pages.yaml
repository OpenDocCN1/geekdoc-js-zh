  md: "# Chapter 16\n\n# Autocompletion\n\nAutocompletion is one of those features\
    \ that suddenly popped up on a popular site and soon became an obvious one to\
    \ have. It's immensely useful to help your users zero in existing values, which\
    \ reduces their time to task completion (no multiple round-trips for the whole\
    \ page in order to get the spelling right or refine the search, for instance),\
    \ alleviates your need to process such suboptimal submissions, and generally makes\
    \ everyone happier.\n\nSo, how do we use it in our apps? Thanks to script.aculo.us's-built\
    \ autocompletion facility, making any text field autocomtable is a snap, be it\
    \ from a client-side data source or through Ajax.\n\nYou'll need the controls.js\
    \ module, which contains the autocompletion classes but also effects.js (the default\
    \ behavior for showing and hiding the autocompletion relies on which appear/fade\
    \ effects). So, your script.aculo loading will work, at minimum, like this: \n\
    \n```\n<script type=\"text/javascript\"> src=\"scriptaculous?load=effects,controls\"\
    ></script>\n```\n\n# 16.1 The Basics\n\nOut of the box, script.aculo.us supports\
    \ two sources for autocompletion:\n\n+   - Local sources (string arrays in your\
    \ web page's scripts)\n- Remote sources (obtained through Ajax)\n\nDepending on\
    \ the source you're planning to use, you'll install Autocompleter.Local or Ajax.Autocompleter,\
    \ respectively. Although equipped with specific options, these two share a large\
    \ feature set and provide a uniform user experience."
  merge: -1
