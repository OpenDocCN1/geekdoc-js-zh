    # Trimming the Fat: strip, stripTags, stripScripts, and truncate


    Let''s start with methods aimed at removing stuff in the string. All of them return
    the new version of the string:


    +   - strip() -> String

    - stripScripts() -> String

    - stripTags() -> String

    - truncate([length = 30 [, truncation = ''...'']) -> String


    For starters, strip() is the equivalent of the classic (but missing) trim(); it
    chops leading and trailing whitespace. stripTags() purges any opening or closing
    tag but not remove whatever lies between an opening and closing match. stripScripts()
    is, in some, more surgical; it strips out any <script> element, with its contents
    and closing tag. Finally, truncate chops text that is longer than its length argument,
    which will be used for the final length of the truncated version, including the
    truncation text. So if your text is, say, 35 characters ending with "too bad really"
    and you''re truncating to 30 characters, you''ll end up with "too bad...".'
