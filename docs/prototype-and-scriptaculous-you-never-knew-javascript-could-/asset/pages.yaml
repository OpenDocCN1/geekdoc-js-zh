  md: '![](img/58ce77657835196da1e063557fbd9fb0_164_0.png)


    # ## More Visual Aspects


    +   - getDimensions() -> { width: Number, height: Number }

    - getHeight() -> Number

    - getWidth() -> Number

    - makeClipping() -> HTMLElement

    - makePositioned() -> HTMLElement

    - scrollTo() -> HTMLElement

    - undoClipping() -> HTMLElement

    - undoPositioned() -> HTMLElement


    Those are a heart of position-related methods. The most common ones are getDimensions(),
    which returns an object with a width and a height property, plus getHeight() and
    getWidth(), when you need only one dimension. The others deal with making the
