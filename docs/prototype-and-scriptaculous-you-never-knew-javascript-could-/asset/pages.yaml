    # 2.4 Prototype Jargon and Concepts


    Prototype comes with a handful of specific notions that will come up time and
    again in this reference. To keep things nice and concise, I will provide names
    for these notions. As with any domain, knowing the luogo will help you grasp things
    more readily and avoid potential mistakes.


    # Objects, Namespaces, and Modules


    Prototype objects fall into three categories, which I''ll use when describing
    an object. This categorization lets you immediately understand how a given object
    is to be used. There are three categories: class, name-space, and module.


    # Class


    +   - Such objects are intended for regular use: construction with the `new` operator,
    properties being stored in instance fields, and so on. Regular objects include
    ObjectRange, Ajax.Request, and PeriodicalExecutor, for instance.'
