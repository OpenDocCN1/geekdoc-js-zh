  md: "# WHAT DOES OUR JASCRIPT LOOK LIKE WHEN USING PROTOTYPE?\n\nJust to make our\
    \ code \"Prototypish\" and to demonstrate near\nJavaScript usage, we'll make it\
    \ conform to the following usage syntax:\n\nPerson.compare(criterion = 'first.',\
    \ p1, p2) → (-1|0|1])\n\nNow, that's unusual—ordinary arguments appearing first!\
    \ It's actually\nease to deal with you regard your arguments as an array of\n\
    values, like Ruby would allow. Here is the code:\n\n```\nPerson.compare = function()\
    \ {\n  var prop = 'first', args = $A(arguments);\n  if (args.length == 3 && typeof\
    \ args[0] == 'string') {\n    prop = args.shift();\n    var c1 = args[0][prop],\
    \ c2 = args[1][prop];\n    return c1 < c2 ? -1 : (c2 < c1 ? 1 : 0);\n  }\n}\n\
    ```\n\nAs you may know, functions in JavaScript create an automatic arguments\n\
    variable that holds their arguments. It's not an array properly speaking,\nbut\
    \ it looks like a [] operator and an\nlength property, so we can readily convert\
    \ it to an actual array with\nPrototype's $A() utility function, as shown on line\
    \ 2.\n\nPrototype-enhanced arrays are mighty to save the least, but in this par-\n\
    tcticular occasion all we need is their native shift() method, which will\ntake\
    \ the first element out and return it.\n\nBy simply checking whether there are\
    \ three arguments instead of two,\nwith a $String-typed first one, we know we've\
    \ been called with an explicit\nfield name as the comparison criterion. We override\
    \ our prop vari-\nable with the first argument, which we take out the argument\
    \ list at\nthe time.\n\nNow that we have the name of the field we're going to\
    \ use for compar-\nis, we need to dynamically access it for each of the two people\
    \ we'\nto to compare. This is trivially done in JavaScript with the square\nbrackets\
    \ operator, [], which we use on line 5. When used on an object,\nit takes an expression\
    \ that evaluates to the name of a property in\nthe object, and it returns the\
    \ value of property.\n\nFinally, using nested ternary operators (?:), we return\
    \ -1 if the first\nobject looks lesser, 1 if it looks greater, and zero otherwise."
