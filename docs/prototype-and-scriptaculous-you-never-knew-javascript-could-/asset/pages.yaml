  md: '# What We Just Learned


    Events are probably the most critical block of dynamic web apps, and Prototype
    has a lot to offer smoothing them out. The take-away points from this chapter
    are as follows:


    +   - The whole event machinery lies in the namespace.


    +   - The events in web development is essentially split in two factions: on the
    one hand, Internet Explorer, and on the other hand, pretty much every browser
    and the W3C. Prototype''s unified API lets us write code for both sides only.


    +   - Prototype 1.6 overhauled the entire event system, addressing many long-standing
    requests and wish lists.


    +   - All event objects are extended to feature the namespace''s methods directly.
    You go e.stop() instead of Event.stop(e), for instance.


    +   - The three key methods to manage behavior on elements and the document itself
    are observe(), stopObservering(), and fire().


    +   - An event handler will run, by default, in the context of the element it
    was registered on (using observe()). It''s bound to it, and this will refer to
    that element. If the handler was already bound, it retains its original binding.


    +   - Event handlers are always passed the event object as their argument.


    +   - In addition to regular browser and DOM events, Prototype lets you observe
    and fire custom events, which among others helps to decouple your scripts.


    +   - Prototype supports bubbling only, because it would not be able to cleanly
    capture on Internet Explorer.


    +   - The standard load event, on the window object, triggers late—only once all
    the resources in the page, including style sheets, images, Flash animations and
    scripts, have loaded. To quickly slap behavior onto your DOM, just wait for it
    to load (which is pretty fast) using the custom dom:loaded event on document.'
