  md: "# Turning Each Element into Something Else\n\nThis is actually the most common\
    \ case. Most beginners at Prototype\noften commit the venial sin of overusing\
    \ each() instead of leveraging\nthese tailor-made methods.\n\n```\ncollect/map(iterator)\
    \ -> Array\ninvoke(methodName [, arg...]) -> Array\npluck(propertyName) -> Array\n\
    ```\n\nThe collect() method, and its most commonly used alias(map), let you\n\
    turn each element into virtually anything! Here's how it works: each element\n\
    is passed to your iterator, which computes the value being stored\nin the result\
    \ of the original element.\n\nHere are a couple examples, using both method names:\n\
    \n![](img/58ce77657835196da1e063557fbd9fb0_100_0.png)\n\n```\n['Hitch', 'Hiker's',\
    \ 'Guide', 'To', 'The', 'Galaxy'].collect(\nfunction() {\n  return s.charAt(0).toUpperCase();\n\
    }).join('')\n// -> 'HGGTTG'\n\nR(1,5).map(function(n) {\n  return n * n;\n})\n\
    // -> [1, 4, 9, 16, 25]\n```\n\nA common use case for collect() is to either call\
    \ the same method on\neach element, with the same arguments, or get the same property\
    \ for\ne element. Then we use either the method result or the property\nvalue\
    \ instead of original element. These two cases make up,\ntogether, a significant\
    \ share of collect()-like scenarios.\n\nThis is why Prototype provides two methods,\
    \ which should be\npreferred over collect(). For the method-calling need, use\
    \ invoke(). Just\npass the name of the method and whichever arguments you would\
    \ want\nto get. Combined with the DOM extension mechanism, which equips\nall DOM\
    \ elements with numerous cool methods, this is a potent tool.\nFor the property-getting\
    \ use case, go with pluck(), passing in the property\name. pluck() has a gentle,\
    \ delicate aura about it that fits perfectly\nwith the efficient, minimalistic\
    \ approach it takes, codewise, to perform-\ning its task."
