  md: '# DIVING INTO EFFECTS


    trouble, here''s a quick rundown on impact the functions have on the series of
    rendering positions for the effect:


    # Function Impact


    | flicker | Randomly picks from the 25% last frames, thus flickering. Effect disabler
    of sorts—sticks with the final frame. This is used in synchronized parallel effects
    to ensure one of them is fully effective immediately. It''s also handy, at debug
    time, to quickly "enable" the result of an effect |

    | full | Goes from start to finish at a steady pace. For most animations (moving
    and scaling), this is actually not so aesthetic. It doesn''t feel natural; it
    feels rather dull |

    | none | The other effect disabler—sticks with the first frame. Technically, the
    same effect can be achieved with a full transition over swapped values for the
    from and to options; it is very much a question of personal aesthetics and logic
    whether you use full or none. During debugging, it''s handy to leave an effect
    in code while disabling it for a while |

    | pulse | Accelerates the effect so it runs more than one time in its lifetime.
    By default, it uses five pulses, but you can bind() to pass it another count.
    For instance, the combined Effect.Pulse essentially relies on Effect.Opacity with
    a crafty use of this transition |

    | reverse | Reverses the effect. This has it go from its final frame to its first
    one |

    | sinusoidal | The default transition. This has the effect start and finish slowly
    but accelerate in between. This is aesthetically pleasing for most effects, such
    as movements and scalings |

    | spring | The latest addition. Specifically targeted at effects such as Effect.Move,
    this lets the effect "overshoot" a bit and then bounce back forth around the final
    position, finally stabilizing on it. This is especially nice for giving a slightly
    bouncy feel by reverting a drag and drop, for instance.


    Examples of custom, third-party transitions, see Ken Snyder''s script.aculo part
    of Robert Penner''s easing library, as reported at http://giancarlo.dimassa.net/2007/07/11.'
