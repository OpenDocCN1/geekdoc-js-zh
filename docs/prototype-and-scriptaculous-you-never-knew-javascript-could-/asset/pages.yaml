  md: 'Before all this started, I asked Justin Palmer if I could step in his shoes
    and write this book for Pragmatic Programmers. Not only was he very gracious about
    it, but he got me on board with the Prototype documentation effort and later with
    Prototype Core. It has been an amazing ride so far. Thanks a bunch, Justin.


    This book would be an order of magnitude less pleasant to read if it not for the
    keen eyes and minds of its reviewers, both "live" and at the final draft stage.
    I am deeply in the debt of Stéphane Akkouai, Arnaud Berthomer, Craig Castellaz,
    Seth Dillingham (Prototype Core), Tom Gregory (a prominent voice on the official
    mailing list), Sébastien Gruhier (of Prototype Window Class frame), Amir Jaballah,
    Tobie Lang (Prototype Core), Justin Palmer (again), and Sunny Ripert. Many readers
    also got onto the bandwagon at the beta stage and so far as to report a number
    of typos, errata, and the like. Among those, I am especially grateful to Steve
    Erbach, Brandon Kelly, and "DarkRat" (whose real name I''m sorry to know), who''ve
    been particularly helpful.


    Sam Peterson (creator of Prototype) and Thomas Fuchs (creator of script.ac.us)
    first deserve the highest accolade for having churned out those two libraries.
    The groundbreaking nature of their work cannot be emphasized enough, and the immense
    satisfaction they have brought to countless web developers demands. When it comes
    to this particular book—the first ever in depth on their babies!—they not revised
    the final draft but also agreed to write the preface, for which I can not help
    but feel honored. Working with them is a privilege and a very fun ride, and I
    take this opportunity to thank them thrice over: for the libraries, for the review,
    and for the preface.


    Élodie Jaubert, my fiancée, took admirably well to this second writing endeavor,
    barely four months after the previous one ended. She showed wonderful patience
    and support through the eight months it took to write and edit this one, bearing
    with quite a few late evenings and afternoons spent writing at my desk, pushing
    me ahead, and giving me strength and love at all turns. I could not dream of more.
    This book is for her.'
