  md: '# Mouse Information


    ```

    event.pointerX() -> Number

    event.pointerY() -> Number

    event.isLeftClick() -> Boolean

    event.isMiddleClick() -> Boolean

    event.isRightClick() -> Boolean

    ```


    Mouse coordinates are a complex thing. The official specification for DOM Level
    2 Mouse Events defines two sets of coordinates: client and screen. That''s fairly,
    but screen coordinates are mostly useless to the web app, and client ones (relative
    to the viewport) are far less useful than page coordinates (relative to the document
    itself, unaffected by scrolling).


    Prototype provides two methods you can use, pointerX() and pointerY(), which provide
    page coordinates. This makes nifty stuff like drag and visual effects much easier
    to achieve. If you need client-based coordinates, the clientX and clientY properties
    of the event object are fairly portable.


    Even seemingly apparently as simple as the mouse being pressed or released is
    tricky. W3C mandates a button property, theoretically ranging from zero (left)
    to 2 (right). Internet Explorer provides a generic which, whose button-related
    values range from 1 to 3. There are many others surrounding mouse click, such
    as different events being fired for right-clicking and button emulation on single-button
    devices.


    This quickly becomes a mess, so Prototype provides three methods: isLeftClick(),
    isMiddleClick(), and isRightClick().


    # Keyboard Information


    Finally, you need to retrieve keyboard information about the event. Prototype
    provides a standardized set of keyboard codes KEYXXX constants in the Event namespace.


    The easy part is first: looking up modifier keys. Traditionally, we consider only
    Ctrl, Alt, and Shift (although some keyboards provide a Meta key, which might
    be mapped to the Windows key or the Esc key). The state of these modifiers can
    be relatively easily examined, whether on a mouse or a keyboard event, by using
    three event object properties: respectively apiKey, altKey, and shiftKey. These
    are booleans, set to true


    +   Obviously, this is mirrored if the user''s mouse is configured for the left-handed.'
