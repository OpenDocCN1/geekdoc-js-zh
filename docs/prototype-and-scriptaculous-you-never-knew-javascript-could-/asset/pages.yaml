    # 15.4 Dragging and Scrolling


    | Option | Description |

    | --- | --- |

    | scroll | Identifies the scroll container, if any. This is used for autoscrolling.
    If defined and the drag reaches the borders of the container''s viewport, it will
    scroll automatically based on factors defined in the next two options. This can
    be any element (or its ID) or the window object. |

    | scrollSensitivity | The threshold for autoscrolling, in pixels from the edges
    of the scroll container. This defaults to 20. |

    | scrollSpeed | The scrolling speed, in pixels per second. This is used as a basis
    for the actual scroll speed, which depends on how close to the container''s edge
    (or how far over the edge) the mouse cursor is. This defaults to 15. |


    When ramping up to advanced UIs, you''ll find yourself needing to let the user
    drag stuff around scrollable containers. The simplest case is when the web page
    itself is higher (or wider) than the window''s viewport (the part of the window
    that renders your page) and your user needs to drag somewhere on the page that
    is not currently visible.


    You may also have a scrollable container somewhere within the page (a `<div>`
    with overflow=''auto'', perhaps), in which elements can be dragged.'
