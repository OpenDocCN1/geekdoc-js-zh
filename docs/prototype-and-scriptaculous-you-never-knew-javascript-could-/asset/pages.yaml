  md: '# WHAT ARE THOSE EFFECTS, AND WHY SHOULD WE USE THEM?


    growing or shrinking, might be nice. Other times, you''re just trying to fintune
    the introduction, removal, of contents; gradually revealing or hiding (it by adjusting
    opacity or by sliding in or out of view) looks and feels better than abruptly
    displaying or stripping it. You may also want to help users perceive a relocation
    by moving contents from its origin to its destination.


    Effects let you do this, and much more, in a uniform, way. They offer a wide range
    of standard options and callbacks to help you tailor your execution to your needs.
    Each specific effect usually provides even more options (for instance, Effect.Highlight,
    being all about gradually changing the background''s color, lets you specify to
    begin and finish with).


    Using effects appropriately can give your applications a whole new degree of polish
    and can contribute to the ergonomics of Ajax-powered pages, where there may be
    minute changes to the contents in locations the user is not necessarily focusing
    on just then.


    Before diving into the myriad options, callbacks, and tweaks surrounding the effects
    system. I will introduce you to the core effects so you can get a feel of it quickly.
    However, we first need to learn how to start an effect.


    # Starting an Effect


    A lot of people get this wrong, so pay attention. The proper way to start a core
    effect is usually with the `new` operator. This is because otherwise, you''re
    using the effect as a function, called in your main code flow, which will prevent
    multiple effects from properly running in parallel.


    Depending on your preferences, you can use one of two syntaxes:


    ```

    new Effect.EffectName(element [.requiredArgs], [options]) -> extElement.visualEffect(''EffectName''
    [.requiredArgs], [options]) -> extElement

    ```


    These two syntaxes are technically equivalent. Choosing between the two is mostly
    about your personal sense of code aesthetics. If you look at effect triggering
    an external action over an element, you''ll probably find the former syntax more
    intuitive. On the other hand, if we regard effects as extra capabilities of elements,
    then using `visualEffect()` may feel more natural.'
