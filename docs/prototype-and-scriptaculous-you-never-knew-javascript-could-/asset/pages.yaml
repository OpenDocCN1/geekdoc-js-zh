    \ for each previous registration. This is a sort of ad hoc, Internet Explorer-only\
    \ garbage collector.\n\n# A Quicker Primer on Event Propagation\n\nWhen an event\
    \ fires up, it is triggered on the elements that registered a listener for it.\
    \ That sounds simple, but it's incomplete and barely half the story anyway.\n\n\
