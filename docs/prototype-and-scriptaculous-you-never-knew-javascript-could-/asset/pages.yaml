  md: 'Native methods (and many native properties) usually do not appear in a for...in
    loop JavaScript does not mark them as iterable. In an array, for example, only
    the numerical indices of its cells are iterable, which creates the illusion that
    you can for...in to iterate its contents. Unfortunately, our own code cannot mark
    properties or methods as “not iterable.” Everything we augment native types will
    show up on a loop. Because Prototype relies on lot extending native types with
    custom methods, for...in when it''s not appropriate starts yielding weird values.


