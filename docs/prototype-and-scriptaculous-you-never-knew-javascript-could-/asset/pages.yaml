  md: "# CONTROLLING HOW IT STARTS, WHERE IT GOES, & HOW IT ENDS 293\n\nBoth these\
    \ needs are addressed with the snap option, which defaults to false, meaning there\
    \ is no constraint.\n\n# Option Description\n\nsnap Governs the smoothness and\
    \ boundaries of the drag. By default, the drag is pixel-fine and roams freely\
    \ over the place. You may need to specify a “resolution” for the drag (for example,\
    \ moving by 25-pixel steps), limit the drag to a specific screen region (for example,\
    \ the container element), or both.\n\n# Sticking to a Grid\n\nBy setting snap\
    \ to a positive integer value, you will make your element move only by steps of\
    \ this size, both vertically and horizontally. Prototype will monitor actual mouse\
    \ movements to determine just when to update the element's actual position. For\
    \ instance, the following code makes the element with id=`item1` draggable by\
    \ 15-pixel steps:\n\n```\nnew Draggable('item1', snap: 15 });\n```\n\nYou should\
    \ need a different “grid size” for horizontal and vertical movement, just specify\
    \ two pixel sizes in an array. The following uses 15-pixel horizontal steps but\
    \ 5-pixel vertical ones:\n\n```\nnew Draggable('item1', snap: [15, 5]);\n```\n\
    \nThis could force Tux to move on a cell-by-cell basis, staying aligned. However,\
    \ that doesn't prevent it from venturing outside the board (at which point it\
    \ would revert, granted).\n\n# Limited the Movement to a Given Area\n\nHowever,\
    \ the real power of snap is revealed only when assigning to a function that adjusts\
    \ coordinates according to your needs. A function takes three arguments: the x\
    \ and y positions and the Draggable object (in case you need to share across draggable\
    \ items).\n\nUsing such function is the only way to apply boundaries to the drag’s\
    \ movement. For instance, here’s a code snippet that makes sure the element with\
    \ id=`item1` does not stay outside a (0,0)-(100,50):\n\n```\nnew Draggable('item1',\
    \ {\n  return [\n    x < 0 ? (x > 100 : x),\n    y < 0 ? (y > 50 : y)\n  ]\n});\n\
    ```"
