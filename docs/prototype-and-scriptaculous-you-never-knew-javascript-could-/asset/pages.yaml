  md: 'What we have here are methods designed to work with multiple kinds of input
    for content:


    An (X)HTML text


    You will most commonly have (XHTML fragments as fodder for insertion or replacement.
    More often than not, you''re getting them as responses from the server after an
    Ajax call. Their processing is described in the next section. Before version 1.6,
    only this form was acceptable.


    An object featuring a toElement() method


    The result of calling this method is used instead of the original object. Such
    a method must return a DOM element or fragment.


    A DOM element or fragment


    It is used directly.


    An object featuring a toHTML() method


    The result of calling this method is used as direct XHTML text. We actually rely
    internally on Object.toHTML(), as out-lined in Section 4.1, *Miscellaneous*, on
    page 58, so if a code mistake ends up in passing something else, we get fallback
    behavior.


    The fundamental methods are replace() and update(). The difference between the
    two is critical. replace() actually replaces the elements you are calling on,
    update() only replaces its contents. For instance, consider the following DOM
    fragment:


    ```

    <div id="container"><p>This is an example</p></div>

    ```


    ```

    // $(''container'').update(''<h1>\''t cross the streams!</h1>'');

