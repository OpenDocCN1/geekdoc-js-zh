  md: "Finally, note that you can use the reserved #{...} syntax as a literal by simply\
    \ escaping the first character: \\#{...}. This is actually not an absolute truth,\
    \ because it depends on the template pattern being properly defined.\n\nIndeed,\
    \ if you look closely at the syntax block I used for the Template constructor,\
    \ you notice that there is a second, optional pattern argument, which defaults\
    \ to Template.Pattern. What is that? Well, quite simply, this is a regular expression\
    \ used to search the template text for dynamic fragments and \"parse\" those fragments\
    \ in order to provide the templating engine with proper information.\n\nThe default\
    \ pattern, Template.Pattern, looks like this:\n\n```\n/^([^|\\|\\r|n)(#(\\*?))\\\
    )//\n```\n\nTo better understand, you need to know that a valid template pattern\
    \ must identify at least three groups, which is done using paired-parentheses:\n\
    \n+   - The character, or anchor, positioned immediately before the dynamic fragment.\
    \ This is used to detect backslash escaping (yes), this part of the template never\
    \ needs to change. It's (^|\\|\\r|n).\n- The full dynamic fragment, including\
    \ its opening and closing delimiters: the default pattern uses (#(\\*?)) (recall\
    \ that all curly braces, square brackets, and parentheses, among other characters,\
    \ are special characters in JavaScript's regular expressions. To use them as literals,\
    \ you must escape them, which is why we use \\{ and \\).\n- The property name\
    \ part, is the dynamic fragment stripped of its delimiters. This part seldom changes\
    \ and is generally (.*).\n\nSo if you insist on using any template syntax, you\
