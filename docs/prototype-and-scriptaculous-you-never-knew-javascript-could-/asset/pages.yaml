  md: '# Chapter 17


    # Building DOM Fragments

    The Easy Way: Builder


    Frequently, you need to inject some new content into your page''s document. Depending
    on the complexity of the content and potential browser quirks, you''ll choose
    between three ways to do this:


    +   - If producing the markup text for your contents is easy enough, you''ll usually
    want to go with Element extension methods such as insert(), replace(), or updateAt().
    We covered these back in Section 7.2, Replacing vs. Inserting, on page 156.

    - However, because such methods internally rely (most of the time) on the innerHTML
    property, which is currently not quite standard/normative and has a few issues
    on Firefox (prior to version 2, if I''m not mistaken), you may hit browser inconsistencies
    in a while (especially when dealing with <select> and <option> in my humble experience).
    In some cases, you may also find it easier (or more natural) to manually build
    the DOM elements instead of composing XHTML markup.


    +   - When manual element construction is what you''re going for, simple needs
    can be addressed by the new Element(...) syntax discussed in Section 7.2, Lightweight
    DOM Element Creation, on page 156. Unfortunately, this facility currently will
    not let you specify text or nested elements as content for the element you are
    creating. You are limited to the element''s tag name and its attribute list.'
  merge: -1
