- img_proc: true
  md: 'adjust with the partialChars option. Do not confuse partialChars with minChars.
    The latter has precedence, given that no completion whatsoever trigger below its
    value. However, the amount of typed characters is greater than or equal to minChars
    below partialChars, you''ll get a nonpartial search (beginning of full-choice
    text only).


    +   - Prefix-only: begins (of words or full texts) will be locked up. It''s generally
    the better way, but you should want to search anywhere in the choice text, set
    the fullSearch option to true.


    +   - Case-insensitive, which you can change by setting the ignoreCase option
    to false.


    I should also mention that the actual completion algorithm is formed by a method
    reference by the selector option. Such a method gets the current Autocomplete.Local
    instance and is responsible for building the appropriate `<ul></li>` markup and
    returning it. The default value for this option implements all the options discussed
    in this section, and you should generally not need to implement your own.


    # Changing the List of Completions


    Every so often, someone will pop up on the mailing list asking how they can change
    the list of completions for a local autocompleter without destroying it and constructing
    it anew.


    There''s no official support for this, but so far the reference to your JavaScript
    array has always been stored in an array option in the Autocomplete.Local object.
    Changing this property to reference your new array of choices does the trick.


    ```

    var ac = new Autocomplete.Local(''edtContact'', ''contactChoices'', girls);

    // ...

    // And when you''d want to switch to another list of choices:

    ac.options.array = guys;

    ```


    Once again, this is not officially supported, because array is not intended to
    be part of a "public" API, but it has been untouched since the object first appeared
    in script.aculo.us and certainly works well enough.'
