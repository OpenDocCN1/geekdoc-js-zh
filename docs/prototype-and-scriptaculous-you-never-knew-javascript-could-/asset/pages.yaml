  md: '# CONTRIBUTING! 403


    +   • The Ticket requests an enhancement that is far too user-specific (it does
    not look like it is generally useful and should be implemented in the library).

    • The Ticket is obviously a spam of some kind.


    Detecting duplicates is a bit harder, because it requires a good knowledge of
    the existing tickets, which means you spend time now and keeping up-to-date on
    the open tickets and knowing enough of the code base that you can determine two
    issues are actually the same one. For instance, after Prototype 1.50 released,
    tickets started coming in hard about Ajax being broken and Hash#QueryString()
    not behaving properly. The two issues were actually very much related. Duplicate
    hunting meant understanding this and closing all but the first report as duplicates.


    A final note on good manners: when you close a ticket you deem it a duplicate,
    be sure to add a comment that states it is a duplicate of!


    # Completing or Creating Tickets


    If you''re all interested in contributing to Prototype and script.aculo.us, this
    section is important. It defines what a good ticket is.


    A good ticket should satisfy the following requirements (most of which are detailed
    later):


    +   • It''s not a duplicate, and it is valid against the current trunk.

    • Its summary is concise yet explicit and features the proper prefixes.

    • The description (and comments) uses proper markup, especially for code fragments
    (either inline or blocks).

    • The key properties (Type, Component, Severity, and to a slightly lesser degree
    Priority) are properly set.

    • It makes efficient use of the normalized keywords.

    • It comes with a clean patch, made against the current trunk (or a reasonably
    close version), provided as an attached file.

    • The patch includes all relevant unit tests (and possibly functional tests).
    The trunk fails these tests without the patch and passes them, on all supported
    browsers, with the patch applied.


    I already talked about what duplicates were and what was a sure flag for an invalid
    one.'
