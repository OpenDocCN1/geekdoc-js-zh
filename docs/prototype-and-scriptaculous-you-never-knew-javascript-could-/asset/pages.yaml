    So, you could rely on the same classes but within different ID contexts, which
    CSS makes it easy to specify. The only question is, what’s an editor’s form ID?


    The single “bad case” is the one where your original element has no ID, and the
    options don’t include formid. Then the form won’t have an ID, and you won''t be
    able to tell it apart.


