- img_proc: true
  md: 'However, the actual syntax is as follows:


    ```

    Droppables.add(element [. options])

    ```


    There are many options, which we will discover in a moment. The important thing
    is, once your element is a drop zone, dragging will interact with it. Your element
    will get notified when something is dragged over or dropped on it, for instance.
    And dropping an element on a drop zone triggers a new callback, onDropped, just
    before the usual onEnd callback.


    By default, your drop zone will accept any element for dropping. It''s very literal
    about what you drop in its lap. Naturally, we''ll be able to tailor all that to
    your needs, as we''ll see in the next section.


    # 15.7 Customizing Drop Behavior


    Just as you can take a draggable element and strip its dragging ability, you can
    take a drop zone and turn it back into a regular element, using the Droppables.remove()
    method. Just pass it your element.


    # Not Leaving Everbody In


    A common need is to pick about which elements you accept on a particular drop
    zone. In a nontrivial UI, you may have several kinds of draggable elements, each
    being droppable at specific locations. You can specify this with two options:
    accept and containment.


    +   * accept a CSS class name and requires any draggable element to have it among
    its CSS classes in order to be "cleared for landing." This offers maximum flexibility
    for your dropping policy, and it lets you flag any element, regardless of its
    tag name or origin in the document. You can also pass in an array of CSS class
    names.


    +   * containment spares you manual CSS class assignment when acceptable elements
    come from the same container (which is very frequently). Just specify the id=
    of their container element, and only they will be allowed to drop. Like with accept,
    you can pass either a single value or an array of values. Because the values are
    elements, you can pass, as always, either id= values or direct DOM references.'
