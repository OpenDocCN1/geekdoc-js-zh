  md: "# Interacting with the Drag: Callbacks\n\nDraggables come with a few callbacks,\
    \ some of which are reserved for local use (being passed in the draggable object's\
    \ options) and are marked in the next table with an asterisk (*). We'll see \"\
    global\" use in Section 15.5, Monitoring Drags, on page 301.\n\nWhen used locally,\
    \ all callbacks take the Draggable object as the first argument and the event\
    \ object as the second argument. Note that when you have a Draggable reference\
    \ in hand, you can get the element itself using its element property.\n\n| Callback\
    \ | Description |\n| --- | --- |\n| onStart | The drag starts. The start effect,\
    \ if any, has not been applied yet, but any other preliminary work (cloning, position\
    \ adjustments, and so on) was performed already. |\n| onDrag | The drag is going\
    \ on. In drag state, the element is about to be moved in order to reflect mouse\
    \ movement. This occurs immediately after having moved the element in response\
    \ to mouse movement. |\n| onDropped* | The element was just successfully dropped\
    \ on a defined drop zone somewhere. We'll talk about drop zones starting on page\
    \ 301. |\n| onEnd | The drag is freshly over. Finalization (revert, reverting,\
    \ and end effect, if any) is to start.|\n\nDemonstrate callbacks by adding a highlight\
    \ CSS class to our board while the drag is going on and by building a log of our\
    \ Tux as it'll use the chess notation of cells: rows numbered from A, top to bottom,\
    \ and columns numbered from 1, left to right. Tux is deemed to be on the cell\
    \ where its top-left corner stands.\n\nFirst, we need to add an element for the\
    \ log. An ordered list seems pretty appropriate from a semantic endpoint:\n\n\
    ```\n<div id=\"board\">\n  <span id=\"piece\"></span>\n  <ol id=\"log\"></ol>\n\
    </div>\n```"
