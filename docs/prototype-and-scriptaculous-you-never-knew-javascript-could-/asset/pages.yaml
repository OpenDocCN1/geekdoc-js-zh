  md: 'To summarize, the following syntaxes are supported:


    $(ID) -> extendedElement

    $(element) -> extendedElement

    $(ID|element...) -> [extendedElement, ...]


    In syntax blocks like the previous summary, the | (referred to as pipe character)
    describes an alternative, which remains local when applied to an argument. In
    the third syntax, you should not read, as you would on a regular expression, "an
    ID,, followed by one or more arguments that each can also be an ID or an element,
    individually." As for the square brackets and dots on the return type, this reads
    "an array of extended elements," which does not imply anything about the size
    of returned arrays; they might contain any number of elements, including 0 or
    1.


    Hey, who doesn''t like having dollars around anyway?


    # 3.3 Because Array Literals Are Boring


    Sometimes, typing string array literals can seem like a study in rigor; getting
    all the quotes and commas right seems like a burden to some, especially if there
    are numerous elements. Perl developers have long used the qw() function, and Rubyists
    are fond of %w. Prototype gives you {}, slightly different from these venerable
    precences in that it requires you to pass it an actual string, which will be split
    based on whitespace:


    ```

    Download prototype/utility/dollar-w.js

    ```


    ```

    // The hard way

    var fruits = [''raspberries'', ''pears'', ''peaches'', ''kiwis''];

    ```


    ```

    // The easy way

    var fruits = %w(''raspberries pears peaches kiwis'');

    ```


    Because it splits on whitespace, you cannot, obviously, use it when you have individual
    elements that contain whitespace. Also, if the passed string is nothing but whitespace
    (or is plain empty), you''ll get an empty array back.'
