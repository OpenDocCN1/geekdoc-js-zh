  md: '# 6.3 Reacting to Form-Related Content Changes


    When working with Ajax, you often find yourself monitoring the changes on a form
    field or the whole form. Whenever a field value changes, you whip up some Ajax
    stuff in reaction.


    It is in fact a frequent need, and Prototype caters to it through two tailor-made
    classes, aptly named Form.EventObserver and Form.ElementObserver (because of the
    aliasing of Form.Element, this latter class can also be used as Field.EventObserver).


    # Form.EventObserver


    ```

    new Form.EventObserver(form, callback)

    ```


    This class lets instantly react to any change-related event in a form that resulted
    in the form''s overall data (the values of all its fields) having changed. It
    will then invoke the callback method you provided when you created the observer,
    passing it two arguments: the form and its serialized data.


    Change-related events are determined on a per-field basis, as described in the
    next section. A Form.EventObserver essentially creates and manages Form.Element.EventObserver
    instances for all fields in the form at construction time. Note that this form
    after the observer is created are not added dynamically to the form taken into
    account.


    For details on how the data get serialized, see Section 8.3, Serializing Fields
    and Whole Forms, on page 179.


    # Form.Element.EventObserver


    ```

    new Form.Element.EventObserver(field, callback)

    ```


    This second class lets you instantly react when a field''s value changes (based
    on the click event for radio buttons and checkboxes and the change event for other
    field types). The callback then gets invoked with two arguments: the field and
    its value. For further details on how the value is represented (this can get interesting
    on fields as multiple-selection listboxes), see Section 8.3, Shape Shifters: The
    Changing Nature of Field Values, on page 178.'
