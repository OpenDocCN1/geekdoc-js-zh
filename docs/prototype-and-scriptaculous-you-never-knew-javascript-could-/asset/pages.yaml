  md: '# JSON and Security


    Prototype offers two features regarding JSON security.


    The first one is JSON sanitizing. It will validate that the JSON text follows
    the accepted syntax and does not contain any attempt at tricking the JavaScript
    evaluator into undesirable processing (for example, sensitive information). You
    can enable it by passing true as an argument to the eval() method. If you''re
    using an Ajax requester or updater (see Chapter 9, Ajax Has Never Been So Easy,
    on page 186), there''s a sanitize option that lets you request this for automatic
    JSON evaluation.


    The second one lets you wrap JSON data with special "filter" text that aims to
    defeat JavaScript hijacking, a recently discovered security hole.8 The default
    filter, by the Prototype.JSONFilter regular expressions, which you start with
    /-secure- and finish with */ (with allowed whitespace after). This wrapper is
    automatically stripped by evalJSON().


    Still, there are no means silver bullets. They provide rou security improvement,
    but with any data format that can contain active code and can go through an eval()-like
    call, you should be extra careful of the reliability and security of your JSON
    exchanges.


    # So, What Did We Learn Here?


    We covered a lot of ground in this chapter: Prototype''s augmentation of native
    JavaScript capabilities and types is quite impressive. Let''s take a minute to
    recap the main points we''ve gone through:


    +   * The for... loop is not intended to iterate over arrays; it iterates over
    an object''s properties. We should not use it to go through an array''s integer-indexed
    values and should rely on a regular loop or a prefaked enumeration listed.

    * Most type detections (for example, whether something is an array, a string,
    a function...) are straightforwardly available as Object. is(...) methods.


    > 8 For all the details, read up on it at http://www.fortifysoftware.com/servlet/downloads/public/JavaScript_Hijacking.pdf.'
