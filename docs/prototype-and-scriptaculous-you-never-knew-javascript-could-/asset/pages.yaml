  md: '# Chapter 18


    # In-Place Editing


    # 18.1 What''s In-Place Editing Exactly?


    In-place editing is about taking noneditable content, such as a <p>, <h1>, or
    <div>, and letting the user edit its contents by simply clicking it. This turns
    the static element into an editable zone (either single-line or multiline) and
    pops up submit and cancel buttons (or links, depending on your options) for the
    user to commit or roll back the modification. It then synchronizes the edit on
    the server side through Ajax and makes the element noneditable again.


    In-place editing is the hallmarks of Web 2.0-style applications, which aim to
    make the user more and more participatory in the contents and reduce the barrier
    to contribution and writing. You could use it for customizing the title of a per-user
    portal page, editing “notes” sprinkled throughout the screen space by the user,
    and so on.


    # What script.aculo Brings to the Table


    Two classes focus on in-place editing: Ajax.InPlaceEditor and Ajax.InPlaceCollectionEditor.
    The former is the most commonly used and relies on free-typing text fields for
    content modification. The latter one, which specializes the former, limits the
    options by using a drop-down list from which our users can pick the value they
    want.


    As their names imply, both use Ajax to synchronize the new content on the server.
    Both come with a wealth of options that give you fine-grained control over the
    look and feel of the resulting UI. We''ll tackle these capabilities by theme in
    the following sections.'
  merge: -1
  pgno: 348
- img_proc: true
  md: "# Careful About Versions: Code Refactoring\n\nIn version 1.8, the two classes\
    \ responsible for in-place editing underwent massive refactoring, and their public\
    \ API changed a bit, especially where available options and callbacks are concerned.\n\
    \nThe former code was mostly a third-party contribution, which so far had worked\
    \ well enough. Unfortunately, the code had grown organically and had not kept\
    \ very well in sync with new, better Prototyping ways. It had become a rather\
    \ haphazard collection of methods with more than a few inconsistencies and odd\
    \ behaviors under specific circumstances. Hence, it was refactored: it was close\
    \ to a full rewrite.\n\n# Step by Step with In-Place Editors\n\nBefore diving\
    \ in with examples and the numerous features, I think it is better if we take\
    \ a moment to stand back and get the big picture. Here's a surface rundown of\
    \ the successive stages of an in-place editor's life:\n\n+   1. First, you make\
    \ an element in-place editable. As always with script.aculo.us, it's the job of\
    \ a single call, in our case the construction of the proper wrapper object based\
    \ on the relevant element.\n2. From then on, when users hover over our element\
    \ with the mouse, a few features mark this element as in-place editable. All of\
    \ these are customizable to your needs, but here are the defaults:\n    * Hovering\
    \ in immediately highlights the element.\n    * Lingering will display the element's\
    \ title= is set by default to Click to edit.\n    * Hovering over delights with\
    \ a quick fade-out (aesthetics, my friend, aesthetics...).\n3. Clicking the element\
    \ enters edit mode. A proper <form> is created on the fly, with an appropriate\
    \ UI (for example, a single-line text field, a drop-down list of possible choices,\
    \ submission and cancellation buttons or links, and so on). Although rarely used,\
    \ an option to bind click and hovering listeners to another element instead of\
    \ the content-containing element, if you want to dissociate them."
