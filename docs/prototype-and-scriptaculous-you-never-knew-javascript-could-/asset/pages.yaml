  md: '# Chapter 6


    # # Unified Event Handling


    This book is all about Prototype script.aculo.us, the two libraries at the forefront
    of Web 2.0 application scripting the world over. We''re surrounded by JavaScript,
    and our pages must react to events coming from a variety of sources: DOM events
    resulting from user interaction with elements on the page, wake-up calls by timers,
    UI notifications from the browser itself, custom events triggered by library objects.
    . . . It''s an event-rich world our code lives in.


    Until now, we could basically test whichever code sample was in this part of the
    book by simply opening a blank page in your browser that loaded Prototype, grabbing
    a JavaScript console (or better yet, Firebug''s console on Firefox), and typing
    away. That was sure and allowed for easy experimentation, irb style.¹


    But now, we''re going to get into more and more complex examples, which will require
    our code to react to events from many sources. To do that, we first need to get
    familiar with event objects, including their nature, their origins, their behavior,
    and what we can do with them.


    # 6.1 Event


    The fundamental object here is Event. Depending on your browser, such an object
    may already exist. In that case, Prototype will merely expand it. Otherwise, it
    creates it from scratch. Event provides an entry point for using event-related
    methods and constants (although, as we''ll see, we can also access the key methods
    directly on DOM elements and documents).


    > ¹ irb is a command-line tool that provides an interactive Ruby shell.'
