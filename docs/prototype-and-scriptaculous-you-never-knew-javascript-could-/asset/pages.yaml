  md: '# $$ SEARCHES WITH STYLE


    Descendant

    Whitespace between other selectors, as in #a


    Attribute

    The full CSS 3 set is available:


    +   - [attr] Is present.

    -[attr=value] Has a specific value.

    -[attr=-value] Has a whitespace-separated list containing a value.

    Think class= values.

    -[attr=value] Has a specific value or starts with followed by a hyphen (-). Think
    language codes.

    -[attr!=value] Does not have a specific value (note it''s not standard CSS 3;
    it''s just there for convenience).

    -[attr^=value] Starts with a specific value.

    -[attr=$value] Ends with a specific value.

    -[attr*=value] Contains, anywhere, a specific value.


    If the value you''re matching against includes a space, be sure to enclose the
    value in quotes, as in [title="Hello world!\]


    Class

    CSS class names, as in .highlighted or example.wrong.


    Child

    As in #item1 > a.


    Sibling

    As in #item1 + p.


