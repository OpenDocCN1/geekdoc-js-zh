    \ I mean geographically on. Keyboard events obviously happen on whichever visual\
    \ component currently has the focus (most often as an input field, but it could\
    \ very well be a link, for instance), but mouse events are associated with whichever\
    \ element was \"on top\" (appeared above any other) right under the mouse cursor.\
