  md: '# HOW TO CREATE OUR OWN EFFECTS


    Before digging in, understand the dependencies for your custom effects. As script.aculo.us
    changes, you will need to test your work against the new releases. As a matter
    of fact, script.aculo.us 2.0 will have a completely rewritten effects engine,
    which should not have, stop the 1.8 version from working.


    # What''s an Effect to Do?


    Most effects are supposed to derive from the Effect.Base class. They can use this
    base to hook up their specific logic for initialization, rendering, and finalization.


    An effect has a number of properties, mostly for internal use, that constitute
    its state. Many of them are going to be very useful to you when writing your own
    effects, especially for the rendering logic, so let me quickly describe:


    | Property | Description |

    | --- | --- |

    | currentFrame | As we saw in Section 14.3, How Fast: duration, fps, sync, and
    transition, an effect''s animation is divided into frames. Every frame gets rendered
    at most once (frames may be skipped because of CPU hogging or debugging breakpoints,
    for instance). The amount of frames depends on the duration of the effect (duration
    option, defaults to 1) and its frames per second ratio (fps option). The first
    actual frame is 1. |

    | finishOn | The moment (expressed in milliseconds since the epoch, the usual
    numerical form of times) at which the effect should finish (based on delay and
    duration options). |

    | fromToDelta | The difference between the to and from options. You normally have
    to deal with it yourself: render() uses it to create a proper evolution of your
    rendering positions. |

    | options | The options passed at construction time, possibly adjusted by the
    initialize() method. |

    | position | Your current rendering position, as a floating-point number between
    0 and (same scale as the from and to options). It is automatically adjusted by
    render(), prior to triggering update callbacks.


    +   3. Although on a few transitions, such as Spring, it may exceed 1 at some
    point.'
