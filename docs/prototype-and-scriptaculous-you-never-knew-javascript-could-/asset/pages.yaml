- img_proc: true
  md: 'There are four things you''ll always pass to these objects when building them:


    +   - The text field you want to make autocompletable. As usual, you can pass
    the field itself or the value of its id= attribute.

    - The container for autocompletion choices, which will end up holding a `<ul>`/`<li>`
    list of options to pick from. Again, pass the element directly or its id. This
    element is most often a simple `<div>`.

    - The data source, which will be expressed, depending on the type, as a JavaScript
    array of strings or as a URL to the remote source.

    - The options. As always, they''re provided as a hash of sorts, and both autocompletion
    objects can make do with no custom option: there are suitable defaults for everything.


    The shared feature and behavior is put in the base object for every-autocomplete-related:
    `Autocompleter.Base`. You''ll probably need to use it in your code, even if you''re
    building a custom autocomplete widget (you''ll more likely extend one of the specific
    objects).


    # Built-in Behaviors


    `Autocompleter.Base` goes to great lengths to make it as easy as possible on you
    by providing a list of proper default behaviors. In particular the following:


    Automatic container configuration


    You don''t need to do anything special to auto-completion choices. You''ll usually
    just put a `<div>` in the markup, with an id= and likely, a dedicated CSS class.


    When you build your autocompletion object, this container will automatically be
    hidden; when it''s time to display choices in, it will automatically be positioned
    absolutely if need and aligned below the text field (it will retain any height
    you may have specified, however). It fades in quickly (0.15''). When a choice
    is selected or the completion is aborted, it-automatically fades out just as fast.


    In the same spirit, your text field''s `autocomplete=` attribute will be turned
    off automatically to prevent conflict between the browser''s native autocompletion
    feature and script.aculo.us''s.'
