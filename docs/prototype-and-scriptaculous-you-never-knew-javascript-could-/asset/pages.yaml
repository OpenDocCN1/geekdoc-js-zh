  md: '# STORING VALUES IN A HASH


    Well, Hash exists to wrap this basic behavior with a few layers of nice features,
    such as being able to mix Enumerable, easily fetching keys or merging hashes,
    and converting to a query string (which comes in handy more often than you may
    think).


    # Creating a Hash


    ```

    $Hash(obj) -> Hash

    new Hash(obj) -> $Hash

    ```


    We already know how one to create a hash: the Hash() utility function, described
    in Section 3.7. $Hash Makes a Hash of Things, on page 50. The other way is to
    use a vanilla class syntax such as new Hash(obj), or if you need to start with
    a set of properties and values, new Hash(basicObject).). Both syntaxes are absolutely
    equivalent and always return a hash, new object.


    # Hash Maintenance: Tinkering with Keys and Values


    Now that we have a hash in our hands, what can we do with it? Well, we want to
    store, fetch, and remove associations in it. That''s what the accessor methods
    are for:


    ```

    get(propName) -> propValue

    set(propName, propValue) -> samePropValue

    unset(propName) -> propValue

    ```


    The names of these methods are rather self-explanatory: set() lets you create
    or replace an association in the hash, get() lets you fetch it (and returns, quite
    naturally, undefined if the association does not exist), and unset() ensures such
    an association is not anymore, returning the former association''s value, if any.


    Note that set() returns the new value, not the old one (in the spirit as JavaScript
    assignment). This lets you reuse the call in an assignment or method call, as
    if h.set(''blah'', value) or v = h.set(''blah'', value) + 2..


    If you need to do more powerful stuff, it''s either Prototype or the hard way.
