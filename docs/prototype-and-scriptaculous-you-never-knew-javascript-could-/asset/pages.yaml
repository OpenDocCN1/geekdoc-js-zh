  md: '# CONTRIBUTING!


    take you right to it. Übergeeks actually use their browser history to bring up
    a recent ticket URL (something like http://dev.rubyonrails.org/ticket/7417) and
    replace the number in it so as avoid having to load a Trac page.


    +   - If you''re looking to filter down on reports, load the appropriate report,
    either by first going to their list page (the View Tickets link) or by playing
    it hard and using a direct URL, such as http://dev.rubyonrails.org/report/22.

    - Advanced searches with complex criteria will need to use the ''Custom query''
    feature, accessible through a link in the top-right corner of the reports pages
    or directly at http://dev.rubyonrails.org/query.

    Lets you define custom filters on any ticket property.


    # Keeping Posted


    A great thing about Trac is that its report-like pages have a related RSS feed.
    This is true not only for the timeline, reports, or even individual tickets but
    also for any query you could create!


    Just look at the bottom of the page for a *Download in other formats* section.
    You can get several variants in there and always an RSS feed. By putting it in
    your favorite aggregator, you''re certain not to miss a thing!


    A word of caution about this, though, when it comes to the Timeline feed. By default,
    it is configured to load a maximum of 50 items, going at most 90 days back. The
    URL you''ll get for it is simple enough to customize, in case you want it to be
    more (less) comprehensive than the default settings.


    # Pragmatic Tickets


    OK, so the next step is to contribute to the tickets. There are two things you
    can do here: file new stuff and help with the triage of existing stuff. Both are
    helpful, although maybe the second task is easier and perhaps a smooth way of
    warming up to Trac.


    # Hunting Down Invalid Tickets and Duplicates


    A significant part of the work over Prototype and script.acula tickets in Trac
    is hunting down duplicate or invalid tickets. Helping with this is easy enough
    and very useful to Prototype Core. Common cases where tickets are invalid include
    the following:


    +   - The current stable version does not exhibit the reported issue.'
