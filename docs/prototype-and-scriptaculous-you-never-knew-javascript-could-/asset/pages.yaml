  md: '# Timeline - Rails Trac - Trac - Iceweasel


    ![](img/58ce77657835196da1e063557fbd9fb0_399_0.png)


    Figure A.1: The Trac timeline


    Anybody can browse tickets, to searches, and the like. However, only authenticated
    users can modify tickets (for example, attach a comment, close the ticket, reopen
    it) and create new ones. Getting a user account is simple enough. Use the Register
    link on the top-right corner of Trac''s home page, and sign up. When you come
    to Trac, don''t forget to log in first (there is a Login link in the same area).


    # Browsing the Trac


    The Trac is mostly tickets, plus terse information about past and upcoming milestones.
    Those are Rails milestones, they''re not directly related to Prototype.


    You can see the latest ticket activity by looking at the timeline (http://dev.rubyonrails.org/timeline),
    which displays everything that happened in a given timeframe. By default, it lists
    just commits—called changesets in the past seven days, but you can customize this
    thanks to a little pad on the right side, as displayed in Figure A.1.'
