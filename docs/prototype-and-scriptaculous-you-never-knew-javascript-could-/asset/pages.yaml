  md: '![](img/58ce77657835196da1e063557fbd9fb0_327_0.png)


    Figure 16.2: Same views, with “standard” styling


    A couple notes about this:


    +   - The **autocomplete** class is not a mandatory name. You can use whatever
    class name you like on the `<div>` element in your mark-up (the element that will
    act as a container for your suggestions).

    - On the other hand, the **selected** class is a “magic” name. script-aculo.us
    will apply this class automatically to the currently selected suggestion (and
    update this as the user moves the selection, obviously).


    Refresh the page and try again. It should look more like Figure **16.2**. That''s
    *much* better indeed!


    # Customizing Local Completion


    The first thing you can adjust is the maximum amount of visible choices (above
    which you''d to scroll). It defaults to 10, but you can adjust this with the `choices`
    option.


    The focus of local-completion options is the completion algorithm itself. By default,
    the search will be as follows:


    +   - *Partial*: searches for the typed text at the beginning of any word in the
    completion text. You can search only at the beginning of the whole text by setting
    the `partialSearch` option to *false*.


    Also note that partial search will trigger only once a given amount of characters
    has been typed. This defaults to 2, which you can'
  merge: -1
