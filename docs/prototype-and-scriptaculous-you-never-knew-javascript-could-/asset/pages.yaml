    Iterators are faster.


    The $continue thing is not supported anymore in iterations. Use

    a simple return in your callback instead. Not only is it faster than

    throw an exception, but this strips one level of exception han-

    dling from the iterator, which results in a significant boost of all

    iterator methods.


    Array''s uniq() is much faster.


    It used to rely on concat(), which meant it had a quadratic cost.

    It has been rewritten to use a single array and work in linear time

    if the array is already sorted.


    Style manipulations are faster.


    The element methods getStyle() and setStyle() are getting faster

