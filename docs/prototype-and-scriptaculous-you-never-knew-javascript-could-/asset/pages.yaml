- img_proc: true
  md: "A useful one is hoverclass, which lets you specify an extra CSS class that\
    \ is slapped on the drop zone when it is hovered over by an acceptable draggable\
    \ element (not when the element is unacceptable for dropping). This lets you make\
    \ it obvious, visually, that the drop can be made. We could adjust our shopping\
    \ cart CSS like this:\n\n```\nDownload scripticulous/dragdrop/cart2/demo.css\n\
    ```css\n#cart.dropAllowed { background: #ffd }\n#trash.readyToTrash { border-color:\
    \ red; }\n```\n```\n\nAnd then, we can change our script to add the relevant hoverclass\
    \ options:\n\n```\nDownload scripticulous/dragdrop/cart2/demo.js\n```javascript\n\
    document.observe('dom:loaded', function() {\n  $('.product').each(function(book)\
    \ {\n    new Draggable(book, { revert: true });\n  });\n  droppables.add('cart',\
    \ {\n    accept: 'product', hoverclass: 'dropAllowed',\n    onDrop: function(book)\
    \ {\n      var bought = new Element('img');\n      bought.src = book.getAttribute('src').replace('.',\
    \ '_tiny');\n      new Draggable(bought, { revert: true });\n      $('#cart').appendChild(bought);\n\
    \    }\n  });\n  droppables.add('trash', {\n    containment: 'cart', hoverclass:\
    \ 'readyToTrash',\n    onDrop: function(bought) {\n      bought.remove();\n  \
    \  }\n  });\n});\n```\n```\n\nFigure 15.6, on the next page, shows these options\
    \ in action, for the cart and the trash can.\n\nBy the way, in addition to the\
    \ onDestroy callback, there's also an onHover callback that gets fired on a drop\
    \ zone, with three arguments: the dragged element, the drop zone element, and\
    \ an overlap factor. (You can ignore this one though, it's mostly for Sortable\
    \ purposes.)\n\nAlso remember that Draggable elements can have an onDropped callback,\
    \ as I mentioned back on 287, which is fired whenever the draggable element is\
    \ released on a drop zone that had accepted it. This takes the draggable element\
    \ as its sole argument and triggers after the onDrop callback."
