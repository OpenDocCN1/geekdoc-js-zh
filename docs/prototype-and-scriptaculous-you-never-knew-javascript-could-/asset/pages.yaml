  md: '# Chapter 1


    # Introduction


    Prototype is a wonderful JavaScript library aimed at easing dynamic web application
    development. Its close friend, script.aculo.us, provides a lot of us interface-oriented
    features with a high wow factor (still), such as drag and drop, autocompletion,
    mouse-driven element sorting, awesome visual effects, and in-place editing. It''s
    all at your fingertips, with only a couple of lines of script.


    The close relation between the two lies in that they both originated in the Ruby
    on Rails universe, as Rails "spin-offs." They are provided with Rails but can
    be obtained separately on their official web sites and are actually backend-agnostic;
    you can use them over PHP, .NET, J2EE, Python, Delphi, or anything else that helps
    you produce dynamic web pages. And indeed, thousands of developers do just that
    every day. script.aculo.us relies on Prototype, and both libraries are written
    in a consistent style.


    These libraries will, quite simply, rock your world. You will discover, as I and
    countless others have, that client-side web page development does not need to
    be gruesome, kludgy, or ever dull. It can be expressive, productive, efficient,
    clean, portable, and intellectually pleasing. It can call to our technical sense
    of aesthetics, and most important, it can be a huge amount of fun.


    # 1.1 It''s About Time


    Prototype and script.aculo.us have been around for quite some time now. According
    to an Ajaxian.com survey in September 2006.¹ they


    > 1. http://ajaxian.com/archives/ajaxiancom-2006-survey-results'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'are by far the two most popular JavaScript frameworks, whopping 43% and 33%
    adoption rates, way more than the third contender, Dojo. With the advent of Prototype''s
    new official site and comprehensive online reference documentation in January
    2007, it will likely have an even higher adoption rate by the time this book hits
    the shelves.


    Still, a year ago, both frameworks were already extremely popular. And what did
    fellows have to say about it? Nothing. In November 2006, Scott Raymond and Sergio
    Pereira produced a 30-page Prototype reference in O''Reilly''s Short Cuts, but
    that''s it. The script.aculo-wiki is a good starting point but uses a fairly inconsistent
    style and is out-of-date. As for Prototype, most addicts started out with Sergio''s
    unofficial page and then had to dive into the source code to figure out all the
    tricks.


    And some source code is it. Both frameworks squeeze the power they get out of
    JavaScript and are written in a fairly advanced style. The unfortunate result
    is that those diving into the code serious JavaScript knowledge could easily become
    lost, dazzled, confused, or all of them at once. Although accurate, timely, and
    polite answers were found on the Google Group² all users agreed that some production-quality,
    official documentation was in order. It is now available, for Prototype, at its
    official website.³


    “This is all well and good,” you might say, “but then what the heck do I need
    this book for?” Well, there are several reasons why reading this book is a good
    idea:


    +   - This book goes far beyond the documentation available online. it includes
    a lot more examples, goes further into details, and provides a lot more besides
    the actual reference material: a full-on tutorial; real-world scenarios and their
    solutions; and plenty of extra tips, tricks, best practices, and all-around advice.


    +   - You may well want to leverage passive offline time to learn. This is about
    reading on the bus, in the subway, or in the passenger seat in a carpool highway
    lane.


    +   - Even active offline time needs a book, such as when you’re working on your
    laptop in a train or plane.


    2 http://groups.google.com/group/rubyonails-spinoffs


    3 http://prototype.org'
  merge: -1
