    # Other Things Our Ajax.Request Can Do


    There are a few more things your request can do for, which can be of assistance
    in your callbacks'' code...


    Every requester has a success() method that implements the success/failure logic
    (it returns a boolean) used for callback selection. There''s also a getHeader(name)
    method that lets you grab a response header easily and returns null if the header
    is missing or something borks.


    An important feature is automatic JavaScript evaluation. When a request consists
    entirely of JavaScript, the best way for the server to send it is to put the script
    in the response body and advertise the response''s content type as JavaScript.
    Prototype recognizes all accepted values for the Content-Type header (anything
    with a main type of text or application) and a subtype of javascript or ecmascript,
    possibly prefixed with x).


    When a response is received, the requesters will automatically evaluate(). It
    Pay attention to the timing. This occurs after specific callbacks (onSuccess,
