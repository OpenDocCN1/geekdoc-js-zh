    extensively used by Prototype itself, which provides a portable way of accessing
    numerous DOM properties representing HTMLAttribute attributes and dealing with
    naming or semantics discrepancies from one browser to the next (for example, when
    working with name= attributes). Both methods take an HTML attribute name.


    Version 1.6 introduces the converse operation with writeAttribute() that takes
