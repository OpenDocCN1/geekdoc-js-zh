  md: '# REACTING TO COMPLETION WITH CALLBACKS


    ![](img/58ce77657835196da1e063557fbd9fb0_339_0.png)


    Figure 16.4: Advanced completion: tokens and rich contents


    Here''s a quick rundown, in chronological (triggering) order:


    onShow

    In charge of positioning and revealing the choice list. You should rarely change
    it. The default behavior positions the completion container under the input field,
    aligns its width, and makes it fade in pretty fast (0.15") with a Effect.Appear.
    This takes two arguments: the input field and the completion container (the two
    first arguments you passed at construction time).


    updateElement

    In charge of reacting to a `li` completion choice being accepted in order to actually
    complete the input field''s value. This is very seldom overridden, because it
    replaces the default behavior, which is responsible for a hell of a lot—dealing
    with richly structured contents (the informal class and the select option), handling
    tokenization (tokens option), actually updating the input field''s value, and
    eventually calling the afterUpdateElement callback.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# REACTING TO COMPLETION WITH CALLBACKS


    If you define this, you''re very much on your own. Most options and behaviors
    are dealt with by the default processing, which your callback replaces entirely.
    You would get only one argument: the accepted <li> element (but you would bound
    to the autocompleter object, which you could access, say, `this.options` and this).


    In short, be careful with this!


    afterUpdateElement


    Undoubtedly the most-used callback. It is triggered by the default `updateElement`
    behavior once the value was completed by an accepted choice. It takes two arguments:
    the input field and the accepted <li> element. This is what lets you react to
    completions in the easiest manner


    onHide


    In charge of taking the choice list away. Just like `onShow`, it''s rarely overridden.
    The default behavior fades out in 0.15 seconds. It takes the same arguments as
    `onShow`.


    # What We Just Learned


    Providing dynamic completion of text input, be it from a page-local or more remote
    source through Ajax, is a breeze with script. Our completion items can be content-rich,
    and we can hook onto the completion extraction process when an item is picked
    so as to complete more than just the visible editor. Use cases for completion-assisted
    input are numerous and sometimes unexpected. Be on the lookout for situations
    where they can help your users!


    Here''s a quick recap:


    +   - The most common form of autocompletion is through Ajax, thanks to `Ajax.Autocompleter`.
    However, a local variant, based on JavaScript arrays embedded in our code, is
    also possible.

    - We can easily tune and how the completion process triggers by adjusting a few
    options, such as `minChars` and frequency.'
