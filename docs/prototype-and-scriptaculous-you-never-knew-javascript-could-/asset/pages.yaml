  md: '# Walking Around: Moving Across the DOM


    ```

    down([selector = ''*''], [index = 0]) -> HTMLElement

    firstDescendant() -> HTMLElement

    next([selector = ''*''], [index = 0]) -> HTMLElement

    previous([selector = ''*''], [index = 0]) -> HTMLElement

    up([selector = ''*''], [index = 0]) -> HTMLElement

    ```


    To build and manipulate DOM fragments from this JavaScript data structure, we
    need to learn about two categories of methods in Element: those that let us walk
    the DOM easily and those that let us alter the contents of elements.


    Bare-bones DOM is quite the nightmare: the properties provided by the W3C specification—firstChild,
    lastChild, childNodes, previousSibling, and nextSibling—work only at the node
    level, not at the element level. The immediate consequence of this low-level attitude
    is that we end up walking empty text nodes produced by markup formatting (for
    example, line breaks and indentation), comment nodes, entity references, and so
    forth. This is indeed unfortunate, because in the vast majority of cases, we concern
    ourselves with elements. Not only that, but we usually want to reach for a specific
    kind of element (for example, `<ul>` or `<a>` element).


    Prototype extends DOM elements with methods that let us just do that (it also
    lets us look at element chains in all directions, as we''ll see in Section 7.2,
    *Meeting the Family: Ancestors, Children, Siblings...* on page 160). These are
    named up(), down(), next(), and previous(), and all share they same signature:


    +   - With no argument, they get you to the closest element in their direction.

    - With a string argument, they interpret it as a CSS selector, relying on the
    amazing capabilities of the Selector class, which we will explore in greater depth
    on page 167. A common form of selector in this context is a simple tag name.

    - With an integer argument, they get you to the index element in their direction.

    - With two arguments, a string and an integer, they get you to the index among
    those obtained by the selector, counting from the current element outward.


    There is also an optimized method for a common use case, which just needs the
    first child element with no additional requirement. It''s covered by firstDescendant().'
  merge: -1
