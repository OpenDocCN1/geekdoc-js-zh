  md: "# 10.4 Templating Made Easy\n\nPrototype 1.5 introduced a new object dedicated\
    \ to template-based string creation: Template. It lets you pluck properties from\
    \ an object and insert them into a template string. It is also useful when you\
    \ have a group of similar objects and you need to produce formatted output for\
    \ these objects, maybe inside a loop.\n\nYou would then typically resort to concatenating\
    \ literals with the object's fields. There is nothing wrong with the previous\
    \ approach, except that it is hard to visualize the output immediately by glancing\
    \ at the concatenation expression.\n\nThe Template class provides a much nicer\
    \ and clearer way of achieving this formatting:\n\n```\nnew Template(templateText,\
    \ pattern = Template.Pattern) -> template.evaluate(scopeObject) -> String\n```\n\
    \nBy default, the syntax used by Template is akin to Ruby's string syntax. You\
    \ can embed fields from the scope object with a #{field-Name} fragment. Because\
    \ arrays have numerical properties, you can use this syntax for vanilla arrays\
    \ as well, using #{0} for the first element, #{1} for the second, and so forth.\
    \ Here's a first example:\n\n```\nDownload prototype/new/template.simple.js\n\
    var people = [\n  name: 'Elodie Jaubert', field: 'Heritage management',\n  role:\
    \ 'my fiancée',\n  name: 'Seth Dillingham', field: 'Web development',\n  role:\
    \ 'a fellow Core'\n];\nt tpl = new Template('#name} works in #{field} and is #{role}.')\n\
    people.each(function(person) {\n  alert(tpl.evaluate(person));\n}\n```\n\n```\n\
    // Alerts\n// \"Seth Dillingham works in Web development and is a fellow Core.\"\
    \n// then \"Elodie Jaubert works in Heritage management and is my fiancée.\"\n\
    ```\n\nSince Prototype 1.6, you can use more advanced syntax in expansion blocks\
    \ (the #{...} thing). You are not limited to a field name anymore but can walk\
    \ down the properties using dot notation (a.b) or square bracket indexing ([a|b]).\
    \ In this case, however, quotes for the key are not only necessary but will be\
    \ handled literally."
