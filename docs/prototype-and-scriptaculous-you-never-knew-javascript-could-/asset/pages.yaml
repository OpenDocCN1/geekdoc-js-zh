    # Customizing the Request Parameters


    You can specify a method option for the underlying Ajax.Request object. It does
    default to ''post'', as usual, but you may want to make that a ''get''. After
    all, you''re only fetching data.


    You can tweak the parameters to the server side in a variety of ways:


    +   - A single parameter contains the currently typed text; its name defaults
    to the input field''s name= attribute. You can change this parameter''s name with
    the parameter option.

    - If you want to dynamically craft the passed parameters, you can provide a callback
    method with the callback (ahem) option. It will get passed both the input field
    and the current parameter text. It returns the new parameter text (properly encoded,
    like any query string in a URL).

    - You can specify static parameters to be passed no matter what (cumulative to
    the result of a potential callback result) with the parameters option, which must
    be a properly encoded query string fragment.'
