  md: '# What We Just Learned


    Effects are a prominent part of script.aculo us and a richer rich API. Let''s
    quickly summarize what we covered in this chapter:


    +   - There are two kinds of effects: core and combined. The seven effects are
    created using the new operator, but combined ones are called like regular functions.

    - Most effects apply to a single element and can take a hash of options, many
    of which are common to all effects.

    - By default, effects run immediately upon creation; therefore, they execute in
    parallel, although not necessarily in sync.

    - To run multiple effects in perfect sync, we need to wrap them in an Effect.Parallel
    and set their individual sync options to true.

    - Effects can also be arranged in queues, with the queue option.

    - Transitions control the variation of speed across the effect''s duration. The
    default transition, Effect.transitions.sinoidal, has a "natural" feel to it by
    accelerating shortly after the beginning and decelerating shortly before the end.

    - A few effects facilitate common usage patterns, such as applying the same effect
    on multiple elements with a small delay between each trigger.

    - We can create our effects and add them to the library.


    # Neuron Workout


    Here are a few questions to ponder and suggestions for code practice:


    +   - Say we have half a dozen items (effects and custom code snippets) we want
    to queue up like pearls on a string. What''s the best option here? after callbacks
    or a custom queue? Why?

    - How would you queue two effects with a two-second pause between the end of the
    first effect and the beginning of the one?

    - Write horizontal blind effects (Effect.BlindLeft and Effect.BlindRight).

    - How could we turn any effect into a permanent loop?


    And that''s for it. It''s a fascinating thing, no doubt, and one of the main reasons
    people use script.aculo us. The other main developer magnet is the support for
    drag and drop, including its use to reorder elements on the page. That''s what
    we''ll dive in next.'
  merge: -1
