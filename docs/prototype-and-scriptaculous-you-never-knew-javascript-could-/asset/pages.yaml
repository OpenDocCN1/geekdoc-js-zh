  md: "# Advanced Sliders and Opera\n\nWhen you get advanced with sliders, you may\
    \ end up having visual quirks running on Opera. Opera is not, after all, officially\
    \ supported yet, and although just about every code in this book runs fine on\
    \ it, sliders may get a bit quirky here and there.\n\nBy interleaving spans with\
    \ your handle elements (all of this within your track's `<div>`), you can ask\
    \ Control.Slider to adjust your positions and dimensions so they stick to surrounding\
    \ handles. This is most used in conjunction with \"restricted\" handle movement\
    \ (in which handle order is preserved over time, because handles cannot be dragged\
    \ across each other).\n\nThree properties are involved here:\n\n+   spans\n\n\
    +   An array of elements (or their id values, as always), usually `<span>s`, in\
    \ ascending range order (that is, the first `<span>` is between the first and\
    \ second handle, the second `<span>` lies between the second and third handle,\
    \ and so on). This defaults to `false`, which disables the feature.\n\n+   startSpan\n\
    \n+   Optional initial range, appearing between the beginning of the track and\
    \ the first handle. This defaults to `null`.\n\n+   endSpan\n\n+   Optional final\
    \ range, appearing between the last track and the end of the track. This defaults\
    \ to `null`.\n\nHere's an example XHTML fragment:\n\n```\n<div id=\"track1\" class=\"\
    track\" style=\"width: 20em;\">\n<div id=\"handle1\" class=\"handle\" style=\"\
