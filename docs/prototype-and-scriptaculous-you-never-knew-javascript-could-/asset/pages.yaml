    We mostly use Array, Hash, and ObjectRange, though.


    # What We Just Learned


    Enumerable is quite something. Let''s quickly go through the salient points:


    +   - The core enumeration is each(), which relies on your enumerable container''s
    own_each() implementation. All the more specific methods (for example, map() or
    inject()) are just using each() to do their jobs.

    - To skip ahead to the next turn, just return from your iterator function. To
    short-circuit the enumeration, throw $break.

    - There is likely a predefined method for just about every need you might have.

    - There''s often a way to squeeze more performance out of Enumerable if you know
    it. For instance, use pluck() or invoke() instead of the more generic map() whenever
    appropriate, or leverage partition instead of calling select() and reject().

    - Method chaining (calling a method directly on the result of another call) can
    quickly whip up complex processes in a rather concise way; however, because every
    call is an enumeration, you might turn out to run faster with fewer calls and
    a more advanced custom iterator...

    - Although sortBy() looks more comfortable, it''s usually less efficient than
    sort() with a custom iterator.'
