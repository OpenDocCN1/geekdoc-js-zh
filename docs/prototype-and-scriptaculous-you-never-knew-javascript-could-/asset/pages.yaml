  md: 'More recently introduced, adjacent() lets you fetch all siblings (and children)
    that match the CSS selectors you''re passing as arguments. Technically, these
    selectors behave exactly like those after Selector#findChildElements() (see Section
    7.3, Selector, on page 167 for details). The current node is obvious, left even
