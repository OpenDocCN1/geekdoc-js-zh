    # 4.2 Proper Function Binding


    JavaScript has this particular notion called function binding. The binding of
    a function is, essentially, the object to which this reference is bound when the
    function executes. It is a dynamic concept; it is not statically resolved when
    the function is defined. It all depends on the actual execution flow of your code—which
    chain of function calls and which objects these functions were called (be it through
    the obj.method() notation or through more advanced JavaScript tricks, such as
    the apply() or call() methods), leading to your function eventually being called.


    By default, a function defined outside any explicit object is bound to the current
    window object, accessible through the predefined window variable.'
