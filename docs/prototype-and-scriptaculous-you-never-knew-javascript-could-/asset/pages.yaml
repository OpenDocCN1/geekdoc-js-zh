  md: '# When: delay and queue


    The rule of thumb is this: an effect starts as soon as it is created. You can
    delay it by using the delay option, which is in seconds and defaults to 0.0. As
    we will see later in Section 14.5, Unlocking the Cool Factor: Effect queues, effects
    are put in queues upon creation. The default value for queue, *parallel*, has
    them start as soon as soon as the delay expires; there are, however, several other
    possible values, as well as the ability to create custom queues, too.


    # How Fast: duration, fps, sync, and transition


    Effects are animated through a series of steps, or *frames*, spread over a given
    duration. By default, they run over a duration of 1.0 second, at a rate of up
    to 100 frames per second (fps). The engine adjusts depending on the performance
    of the user''s computer. Note that 25 fps is fast enough for the human eye to
    see a fluid animation.


    Frames are not necessarily spread evenly across the duration of the effect. For
    most effects, a moment, a linear distribution would actually not look too good.
    As we will see in a moment, script.aculo lets you specify, through the *transition*
    option, one of eight possible “transitions,” which are several functions determining
    how to get from one position (in the time window of the effect) to the next. The
    default transition is Effect.Transitions.


    sigmoid which basically makes the effect start up slowly, quicken, and then slow
    back down at the end. It is usually the best setting.


    Finally, sync is both related to effect start and progress. In order to run effects
    in synchronized parallel mode (inside an Effect.Parallel, as we will see in a
    moment), you need to make sure all synchronized effects have their sync option
    set to **true**.


    # Cutting Corners: from and to


    By default, an effect goes from a starting position of zero to a position of one.
    You can have it start ahead or stop by adjusting its from and to options. This
    is mostly used for effects where these options represent extreme points of the
    effect''s action. For instance, with Effect.Opacity, position zero is full transparency,
    and position one is full opacity.


    Note that from can also be greater than to. The effect will then run “backward,”
    so to speak.'
