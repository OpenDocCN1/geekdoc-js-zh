  md: '# 20.2 How Do We Play Sounds?


    First, you need to load the sound module, just like you would load any other script.aculo.module,
    for instance, using the sound system:


    ```

    <script type="text/javascript" src="sound.js"></script>

    ```


    Then, all you need to do in your code is something as simple as this:


    ```

    Sound.play(''sounds/myeffect.mp3'');

    ```


    That''s it! Playing your sound now (the module does not support looping). As you
    might expect, there can be a bit more to it, though. The full syntax goes like:


    ```

    Sound.disable()

    Sound.enable()

    Sound.play(url [options])

    ```


    The disable() and enable() methods globally toggle whether play() calls are actually
    processed. They do not impact previously made calls; any ongoing sound keeps going.
    They impact only future calls to play(). They''re the obvious way to implement
    a user-togglable Mute feature.


    The core method is, expected, play(). At the minimum, you provide the URL of your
    sound file. The module will assume your file format is related to MPEG audio,
    so you should use MP3, for instance. The options parameter is a hash of options,
    as usual, and Sound supports two of them: track and replace. We''ll explore them
    now.


    # 20.3 Playing Multiple Sounds on Multiple Tracks


    The sound module lets you play multiple sounds in parallel and group them as tracks.
    Whenever you ask for a new sound to play, you can put it into a specific group
    (or track), and either add it to the currently playing sounds of that track or
    replace it the whole track.


    # The track Option


    By default, sounds are added to the default track, name global. They also add
    to the track, which means they do not replace the currently running sounds. They
    start playing whatever sound is currently playing.


    To specify group sounds, use the track option. You can use whatever names you
    want for the tracks, as long as you observe XHTML''s id syntax requirements. This
    is because your track name will become'
  merge: -1
