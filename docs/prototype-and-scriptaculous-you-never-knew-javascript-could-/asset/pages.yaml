    # The Life and Works of XHR


    In the rest of this book, we''ll mostly use the shorter XHR abbreviation for it.
    An XHR object has the following life cycle (normative states appear in italics):


    +   1. You create it. It''s *initialized*.

    2. You open a connection to the server side. It''s *open*.

    3. If necessary, you set request headers according to your needs.

    4. You send the request (and any body contents for the HTTP you may need to include).
    It becomes *sent*.

    5. The server starts responding. Your object is now *receiving*.

    6. You''re done getting all of the response. It is now *loaded*.


    This is the official life cycle, but legacy implementations, which are still the
    most widespread ones, may differ slightly. As we''ll see in Section **9.2, Hooking
    Up Our Code: Ajax Callbacks**, on page **203**, Prototype defines a series of
    callbacks for state changes and events mapping to the official states, plus a
    few ones. But not all these callbacks are "guaranteed." Some of them may not fire
    with the same semantics on all browsers or sometimes not fire at all; I even see
    occasional reports of callbacks firing in a different order, although reproducing
    these opposites often proves challenging. Fortunately, the key ones (especially
    the completion-related ones) are safe.


