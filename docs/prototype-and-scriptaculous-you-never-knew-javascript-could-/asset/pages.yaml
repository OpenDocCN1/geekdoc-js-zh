  md: '# CONTRIBUTING!


    When your patch is done, make sure you provide good test coverage.

    Figure out as many things as you can seem to need tests, and write those tests
    in a way that fail without your patch. Test with and without your patch applied.
    You can even run tests automatically by using rake test. It runs the tests on
    all the available browsers (which some tests, like Ajax, require so they get a
    valid server side). You can restrict it by using BROWERS and TESTS variables.


    The tests are located in the test subdirectory, with the unit tests in test/unit.
    Just look at the large inline scripts in there for inspiration on how to add tests
    to the suites.


    # Packaging, Submitting, and Cleaning Up


    All set? Then package your patch as a Subversion diff file. It''s easy, really.
    Just go to the trunk''s base directory, and do something like this:


    ```

    $ svn diff > good_patch_name.diff

    $

    ```


    You might want to put these files outside the trunk directory. Then go to the
    Trac, edit or create the proper ticket, and attach your patch to it. Add a comment
    to whatever explanations are required about this patch. Update the summary if
    you need.


    Also, don''t forget to revert your trunk to its normal state before tackling any
    other work or updating it once again. Just go for the trunk''s base directory,
    and do to this:


    ```

    $ svn revert -R

    Reverted ''src/array.js''

    $

    ```


    # Code Style Guidelines


    +   - Indent with two spaces, not tabs. Make sure your editor of choice doesn''t
    use autofill mode that will convert given amounts of spaces to tabs automatically.


    +   - Use expressive variable names; n, e, or epC won''t quite cut it.


    +   - Semicolons to terminate statements.


    +   - If possible, use Unix line breaks.'
  merge: -1
