  md: "# The Core METHOD: ITERATING WITH EACH\n\nWell, it takes care of all the extra\
    \ fluff:\n\n+   * It makes sure the iterator pass gets invoked with two arguments:\
    \ the current item and the current index in the iteration (starting at zero).\n\
    \n+   * It handles the special $break exception your iterator may use to short-circuit\
    \ the iteration loop.\n\nIndeed, whatever iterator you pass to each(), when invoked\
