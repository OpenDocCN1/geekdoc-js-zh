  md: '# Chapter 8


    # Form Management


    Although this is technically part of Prototype''s DOM extensions, I feel that
    form manipulation is a topic unto itself. Prototype indeed equips forms, and form
    fields, with many extra methods in addition to the generic element extensions.
    Because forms are such an important part of web app development, I decided to
    cover these extensions in a specific chapter.


    # Form.Element vs. Field


    First, note that the “official” namespace for methods grafted upon form elements
    is, quite surprisingly, Form.Element. However, as this is a somewhat long name,
    it is aliased to Field. I prefer this shorter version over the more verbose one.
    So in this book, I use Field in my code and examples. It''s just more concise
    and less expressive.


    # 8.1 Toward a Better User Interface


    Savvy developers put increasing effort into the design of the forms in their apps.
    Proper markup (with an emphasis on semantics and accessibility) is a major step,
    as is proper styling, which lets us things like highlight the focused field or
    clearly mark incorrect or incomplete fields. With a dollop of scripting, we can
    also provide timely, contextual help on field semantics.


    This is all well and good, but two key aspects of form ergonom need your sweet
    care, too: form navigation (that is, how the user can go from one field to the
    next or previous one) and proper management of field enablement.'
