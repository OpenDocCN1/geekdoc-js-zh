- img_proc: true
  md: "# What \"Classes\" Actually Are in JavaScript\n\nThe main point to remember\
    \ is that there are no classes per se, only objects. Every object is created based\
    \ on a constructor function (which most people call a class as not to lose sanity\
    \ too quickly). Functions are objects, too (like numbers and regular expressions,\
    \ by the way). Every object has a prototype, which defines properties (including\
    \ methods) shared by all instances of this object—yes, I actually said \"instances\
    \ of this object.\" Get a grip.\n\nSo when you're defining methods in a constructor\
    \ function, for instance, you're defining methods for all the instances obtained\
    \ by using the new operator on this function (for example, new String (or string\
    \ literals)). This is exactly what Prototype does to existing constructor functions\
    \ to extend the capabilities of native JavaScript.\n\nThe reason I'm not diving\
    \ more into the details is that Prototype does most of its own way, which is much\
    \ simpler and feels like traditional OO programming. It has been profoundly redesigned\
    \ in version 1.6 and now features more convenient syntax and properly simulates\
    \ inheritance and mixins.\n\n# Defining a New Class\n\nThe Prototype of creating\
    \ a class still relies on Class.create(), although the syntax has enriched. The\
    \ full syntax, which lets you define a class when you want to, is as follows:\n\
    \n```\nClass.create([superclass], [ Module..], [ instanceMethod<id>/] ]) → Class\n\
    ```\n\nBecause all arguments are optional, you can call it with no arguments,\
    \ as you used to do in, say, Prototype 1.5. You would then add the instance methods\
    \ later. However, why keep with the old, two-phase, kludge when we can put the\
    \ instance methods right in the call? Here's an example class creation:\n\n```\n\
    var Animal = Class.create({\n  initialize: function(name) {\n    this.name = name;\n\
    \  },\n  eat: function(food) {\n    return this.say('Yum/');\n  },\n  say: function(msg)\
    \ {\n    return this.name + ': ' + msg;\n  }\n});\n```"
  merge: -1
  pgno: 391
- img_proc: true
  md: "# Class Mechanism: 1.6 Changed Everything!\n\nIf you had already created your\
    \ classes in versions of Prototype prior to 1.6, your code should still work in\
    \ this new version. However, to fully leverage the new capabilities (such as inheritance),\
    \ you'll need to migrate your code to the new, extended syntaxes. The former dichotomy\
    \ (Class.create() / Object.extend()) is not the way to go anymore.\n\nThe following\
    \ pattern:\n\n```\nvar Loader = Class.create();\nObject.extend(Loader.prototype,\
    \ {\n  initialize: ...,\n  otherInstanceMethod: ...\n});\nObject.extend(Loader,\
    \ {\n  staticMethod1: ...,\n  staticMethod2: ...\n});\n```\n\n... would still\
    \ work but now read as follows:\n\n```\nvar Loader = Class.create({\n  initialize:\
    \ ...,\n  otherInstanceMethod: ...\n});\nObject.extend(Loader, {\n  staticMethod1:\
    \ ...,\n  staticMethod2: ...\n});\n```\n\nNote that the initialize() method is\
    \ not mandatory anymore. If you don't have construction-time behavior in your\
    \ class, you can now skip it (it will be stubbed out by Prototype.emptyFunction()).\n\
    \nOur simple class can now be used in a straightforward manner:\n\n```\nDownload\
    \ prototype/classes/creation.js\n```\n\n```\nvar fido = new Animal('Fido');\n\
    fido.name\n// => 'Fido'\nfido.say('Hi')\n// => 'Fido: Hi'\nfido.eat('bone');\n\
    // => 'Fido: Yum!'\n```"
  merge: -1
  pgno: 392
