  md: "# Unlocking the Cool Factor: Effect Queues ◀ 273\n\neffect to a queue, you\
    \ can specify a position, which will be interpreted as follows:\n\n+   * parallel\
    \ will have the effect start the next time the queue processes its effects.\n\
    * front puts the effect before any pending effect in the queue, delaying them.\n\
    * end puts the effect at the end of the queue, obviously. It will trigger after\
    \ all the effects in the queue are done.\n* with-last schedules the effect to\
    \ start with the last pending effect currently in the queue, if any (if there\
    \ is no pending effect, it will start after all running effects in the queue are\
    \ over).\n\nQueues process their effects at a higher frequency, currently up to\
    \ 100Hz, which is in my humble opinion, far than needed. The human eye is tricked\
    \ into seeing continuity from 25Hz, and even the sharpest eyes cannot detect frames\
    \ faster than 50Hz (although I'm quite certain I'll find hardcore² will swear\
    \ they need more). This does mean you need to watch the order in which you swear\
    \ stuff. It should be the intended order of execution, whenever possible.\n\n\
    So you specify any of these values for the queue option (once again, parallel\
    \ is the default), we use the global queue, which is fitting for most purposes.\
