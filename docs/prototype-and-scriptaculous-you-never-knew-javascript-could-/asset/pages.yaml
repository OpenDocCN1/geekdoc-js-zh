  md: 'Editing mode is triggered by clicking, either on the editable zone itself (by
    default) or on a specified external control.


    We can use an alternate text representation, fetched through Ajax and reprocessed
    by the server when saving, to spare the user need to understand HTML.


    Options provide fine control over every detail of the appearance.


    The Ajax requests sent to the server are highly customizable via many options
    and callbacks. An extra editor parameter is always added in case the server code
    for several editors can be made generic.


    # Neuron Workout


    +   - What set of options would let implement “unobtrusive in-place editing,”
    where clicking, say, titles would make them editable with no visual clutter and
    just clicking outside it or pressing the Return key would save to the server and
