  md: '• Just look at the existing source code for inspiration about general code
    architecture and layout. Avoid polluting the global namespace as much as possible;
    put function-specific constants, variables, and subfunctions in the calling function''s
    prototype; and so on.


    • Notice some low-hanging fruit (trivial fix about performance or cleanliness?)
    Pick it!


    # Common Pitfalls


    +   • First, don''t writing a patch that will end up being considered invalid
    (earlier in this chapter about such cases). Also make you''re not duplicating
    an existing effort.


    +   • Make sure you revert your local repository before starting up on a new patch
    so you don''t aggregate it with prior patching work.


    +   • Make sure you update your local repository, too, so you do patch against
    the latest trunk (revert updating).


    +   • The tests keep falling? Are you sure you rebuilt the library (rake dist)
    after saving the source file?


    +   • Make sure you test in least two browsers, one of which must be Firefox.
    If you''re on Linux, try testing on Firefox and Konqueror, at least. If you''re
    on Mac OS X, use Firefox, Safari (ideally 2 and 3), and perhaps Opera. If you''re
    on Windows, go crazy and use Firefox, Internet Explorer (ideally both versions
    6 and 7), Opera 9 or later, and perhaps even Safari 3!


    We''re looking forward to your contributions!'
