  md: '# Should We Reuse Our XHR Objects?


    Although in Prototype this translates to “Should we reuse our Ajax objects?” the
    question is just as valid. These are network connections we''re talking about.
    Such an object has a nontrivial initialization cost, and we may want to reuse
    them in order to speed things up.


    Well, let me give you some perspective.


    First, from a technical standpoint, reuse is not free of issues, depending on
    the browser you''re on, the way you manipulate the original methods of the XHR
    object, and a few others points. So, it''s not as simple as simply keeping a reference
    on it and ending up calling open() again and again.


    Second, this is UI we''re talking about. You''re using Ajax to smooth things up,
    to make your UI snappier, over full-page reload, and to interact more richly with
    the user. The time constraints we face here are user time, a satisfactory response
    delay is of the order of one second. Plus, we''re bound by this two-request limit
    anyway. Overusing XHR objects will end up delaying most of them, resulting in
    the opposite effect: increased latency.


    For the overall scheme of things, the setup for an XHR object (and thus, for an
    Ajax*) in Prototype is fairly negligible. If your UI is properly designed (especially
    from an ergonomics perspective), you''ll be well in the clear with creating such
    objects when you need them and discarding the references afterwards.


