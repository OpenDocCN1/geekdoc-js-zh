    # Hooking Up Our Code: Ajax Callbacks


    Aside from proper, you can pass, in the options object, callbacks to be called
    at specific times in the request''s life cycle. Prototype defines a handful of
    those, but beware: XHR-level callbacks are not "guaranteed," meaning they may
    not work consistently across browsers, because the W3C specification has not yet
    been finalized, much less widely implemented. Such callbacks are *emphasized*
    when listed.


    Note that all callbacks, when defined on an individual requester like, are called
    with two arguments: the current state of the Ajax response (an Ajax.Response object)
    and the evaluation of the X-JSON header, if any (this one can be null, especially
    prior to response completion). The onError callback, however, gets different arguments:
    the requester object and the exception object.


    ![](img/58ce77657835196da1e063557fbd9fb0_202_1.png)


    The Ajax.Response object you get lets you response''s data in a comfortable, portable
    way, smoothing over some issues with the restrictions of using specific methods
    on the underlying XHR object (for example, header-related ones) and taking special
    care of JSON handling of its rising popularity). We''ll explore it in greater
    depth later in this chapter.'
