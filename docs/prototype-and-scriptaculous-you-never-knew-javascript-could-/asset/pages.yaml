    # evalJSON


    Also introduced in Prototype 1.6, this new option controls whether to enable automatic
    JSON evaluation, evaluating the response as JSON and storing the resulting object
    in the response''s responseJSON property. It defaults to true, and just like evalJS,
    it can be false or force, with the same semantics. The JSON content type is application/json.
    Also see sanitizeJSON.


    # method


    The HTTP method used. Current implementations guarantee only the two methods allowed
    by HTML forms: get and post. The W3C recommendation for XMLHttpRequest, however,
    acknowledging the ever-growing interest of REST, mandates that compatible implementations
    support all six methods defined by HTTP/1.1, including for instance put and delete.
    Currently, using such values (that is, anything but get or post) will trigger
    one of the few Rails-specific behaviors of Prototype. It will actually use post
    and will include a _method parameter in the data, with the original value. This
    circumvents the fact that browsers such as Safari and Internet do not yet accept
    these HTTP methods for XMLHttpRequest.


    Defaults to post.


