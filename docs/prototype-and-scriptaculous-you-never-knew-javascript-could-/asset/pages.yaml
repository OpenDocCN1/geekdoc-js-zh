    Well, that''s about it for in-place editing. If you used it in the past, do remember
    that it got through a complete rewrite for script.aculo.us 1.8, and the API changed
    a bit. Ajax.InPlaceCollectionEditor, in particular, became much more usable, and
    latent holes were plugged, making the whole thing more robust.


    # We We Just Learned


    Despite the numerous features and possible tweaks, in-place editing is not a very
    complex subject. It boils down to these key points:


    +   - In-place editing is mostly about the Ajax.InPlaceEditor class. There is
    also a dropbox-based, predefined-values variant using Ajax. InPlaceCollectionEditor.

    - Both were rewritten in 2007 to clean up their code base and add functionality.
    This rewrite changed parts of the API, especially the options.'
