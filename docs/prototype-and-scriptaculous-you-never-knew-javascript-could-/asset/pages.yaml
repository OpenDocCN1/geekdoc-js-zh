  md: '# Chapter 4


    # Regular JavaScript on Steroids


    Prototype goes to great lengths to make JavaScript development feel better. Prototype
    Core loves Ruby. (Who doesn''t? Honestly, give it a serious try.) That''s why
    Prototype tries to make JavaScript feel more like Ruby—so that most common tasks
    become a breeze and eminently readable. Dealing with collections of items (be
    it for simple iteration, filtering, transforming, or whatnot), exploring object
    properties, manipulating strings, or even passing methods around without losing
    their binding the way—all of this (and much more!) becomes easy as pie when using
    Prototype.


    # 4.1 Generic Object Manipulation


    In JavaScript, just about everything is an object: strings, numbers, functions,
    arrays, regular expressions.... And there is a basic inheritance that makes all
    objects descend from the fundamental Object type. Prototype carefully avoids adding
    anything in Object.prototype, because this would percolate into every single object,
    effectively breaking every legitimate use of the for...in construct. However,
    Prototype adds a few methods in the Object namespace that are mainly geared toward
    object introspection.


    # A Fresh Look at for...in


    Misconception alert: for...in is not intended to iterate over an array. That it
    works (and only as long as you leave Array''s prototype untouched) is a mere side
    effect. Its actual purpose is fairly different. It is intended to iterate over
    all the iterable properties and methods of an object.'
