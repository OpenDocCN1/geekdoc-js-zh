  md: '# Preface


    Prototype began its life in early 2005 at a time when the name “JavaScript” still
    evoked images of pop-up ads, blinking text, and copied-pasted <script> tags in
    most developers'' minds. Even though web applications such as Gmail and Google
    Suggested that JavaScript (and this new thing calling “Ajax") could actually be
    used to improve the user experience, implementing these new techniques in your
    own apps proved to be painful and frustrating. Each web browser had its own quirks
    to work around, and most existing code wasn''t designed to take advantage of JavaScript''s
    object-oriented nature or powerful closure capabilities.


    Inspired by the expressiveness of dynamic languages such as Ruby, we set out to
    build a browser programming environment that we could actually look forward to.
    We started with a small set of tools that let us work with classes and functions.
    Then we extracted common Ajax and DOM manipulation operations from our existing
    applications. In March 2005, we released Prototype 1.0 as part of the Ruby on
    Rails framework. Prototype has grown a lot since, but it remains focused on providing
    the best possible environment for JavaScript developers.


    As script.aculo.us, or “Script” as it''s affectionately known by the Core team,
    it started out as a short section of code in Prototype that implemented the non-ubiquitous
    “yellow fade technique.” With a desire to make web applications more user-friendly—and
    provide eye candy that''s really easy to boot—it quickly grew into a complete
    real-time DOM-based effects engine, drag-and-drop framework, and controls library.
    Version 1.0 was released in June 2005.


    You should understand that script.aculo.us is distinct from many other UI libraries
    in that it does not try to shield the developer from the DOM but rather extends
    and improves the DOM so that developers and designers can capitalize on their
    existing knowledge.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Combined with Prototype, it''s engineered for building your own widgets, controls,
    and basically any artsy awomeness in less time than it takes to configure heavier,
    widget-based frameworks.


    To paraphrase the motto of Ruby, the language whose design heavily influenced
    our libraries: Prototype and script.aculo are “a web programmer’s best friends.”
    According to the feedback we’ve received, we’re not the only ones who feel that
    way.


    Two-and-a-half years after the initial release, Prototype and script.aculous are
    in use on many of the web’s most popular websites and power all sorts of innovative
    web applications.


    This rapid popular uptake has been possible only through the efforts of the Prototype
    Core team, consisting of Seth Dilling, Andrew Dupont, Mislav Marohníć, Justin
    Palmer, Christophe Porteneuve, Tobie Langel, Scott Raymond, and Dan Webb; the
    thousands of hours of work by hundreds of contributors from the Prototype and
    script.aculous community: and, of course, Christophe, for providing this very
    book.


    Big thanks to all of them and to you.


    Sam Stephenson (Creator of Prototype)

    October 15, 2007


    Thomas Fuchs (Creator of script.aculo.us)

    October 15, 2007'
