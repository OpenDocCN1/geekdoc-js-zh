  md: '# DRAGGING STUFF AROUND


    ![](img/58ce77657835196da1e063557fbd9fb0_285_0.png)


    Figure 15.1: Tux dragging about


    Try unchecking the box. You will now notice the cursor no longer indicates dragging
    capability, and attempting to drag Tux is rewarded with resonant failure. Checking
    the box again restores the penguin''s fleet-ness of feet.


    As basic usage goals, here are a few things you should know:


    +   - You can always interrupt a drag by pressing the Esc key.

    - During drag, the element''s opacity moves to 70%. Its original opacity is restored
    when the drag ends.

    - By default, the element is draggable. Holding the "left" (that is, main) mouse
    button over any part of it will trigger the drag. You can restrict this part of
    the element''s contents using the handle option, which we will discuss in a moment.
    It''s commonly used to drag through a title bar or a corner, for instance.

    - If your element needs to be both draggable and clickable, triggering drag as
    soon as the mouse button is down can be a problem and result in disruptive ergonomics.
    You can use the delay option, discussed later, to require the button to stay down
    for a given time before the drag actually happens (it will catch up on the mouse
    movement in the meantime, if necessary).'
