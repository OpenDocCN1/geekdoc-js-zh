  md: "# How Can We Tweak the Ajax Persistence?\n\n![](img/58ce77657835196da1e063557fbd9fb0_353_0.png)\n\
    \n# 18.3 How Can We Tweak the Ajax Persistence?\n\nFirst, we need to know what\
    \ the defaults are. Basically, we rely on a call to Ajax.Updater, with our element\
    \ as the success container, no specific Ajax options (all the defaults of Ajax.Updater\
    \ apply; for instance, we're using asynchronous post), and two parameters: a value\
    \ parameter with our editable field's value and an editorid parameter with the\
    \ id= our original element (unless it doesn't have one, in which case this second\
    \ parameter is absent).\n\nWe can customize quite a handful of things here:\n\n\
    +   - We can change the name of the parameter holding the field's value using\
    \ the paramName option (defaults to 'value').\n- We can change the whole series\
    \ of parameters (except for the editor, which is handled internally) by replacing\
    \ the default callback, er, callback, with our own. The default one simply goes\
    \ like this:\n\n```\nfunction(form) {\n  return Form.serialize(form);\n}\n```\n\
    \nWe can provide our own logic. It will actually be passed two arguments: the\
    \ synthesized <form> element and the editable field's value (retrieved by the\
    \ $) method, which we discussed on 49. Using this, you could add any extra parameters\
    \ to you need, transform the passed value, and so on.\n\n+   - You can provide\
    \ any options you want for the Ajax call with the ajaxOptions option, which defaults\
    \ to the following simple set: eval(evalScripts: true)."
  merge: -1
