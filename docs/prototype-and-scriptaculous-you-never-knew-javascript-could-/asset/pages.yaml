    DOM extension mechanism. It''s a DOM element with superpowers, so to speak.


    Having the guarantee that the element is extended $() not much more concise than
    its traditional pure-DOM counterpart (document.getElementById) but also superior
    from a usage standpoint. Since the resulting elements feature all the extended
