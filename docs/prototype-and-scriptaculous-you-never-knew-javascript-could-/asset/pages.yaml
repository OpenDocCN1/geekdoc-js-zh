  md: '# #7585 ([PATCH]) Optimized Element.style - Rails Trac - Trac - I CONTRIBUTING!
    ⊒ 401


    ![](img/58ce77657835196da1e063557fbd9fb0_400_0.png)


    Figure A.2: A Trac ticket


    You can also zero in tickets that fall within a specific category. In Trac, categories
    are mostly represented by reports, which are predefined search criteria. Our Trac
    facere features a bunch of such reports, accessible through the View Tickets link.
    For instance, report #22 contains all the pending patches for Prototype and script.aculo.us.
    They''re usually in need of further review or complementary tests. That''s a great
    place to start helping.


    A Trac looks like Figure A.2. It features a summary, description, comments, attached
    files, and a whole bunch of properties. The most important ones are the Type (for
    example, defect and enhancement), the Component (which in our case will always
    be Prototype and script.aculo.us), and the Severity.


    # Searching the Trac


    Sometimes you just need to find specific tickets in the Trac. There are several
    ways to do that quickly:


    +   * If you''re looking for a specific ticket, you can just type its number,
    preceded by a hash sign (#), in the top-right search box. That will'
