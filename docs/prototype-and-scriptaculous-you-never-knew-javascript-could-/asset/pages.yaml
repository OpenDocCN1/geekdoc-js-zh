  md: '# 14.4 Combined Effects


    Based on core effects, script.aculo.us provides a number of combined effects,
    which cater to most needs. We won''t show examples of these, but you''ll see combined
    demos on the documentation site.¹1 I''ll just list them as they stand at the time
    of this writing, with a few about specific options you may have.


    # Triggering a Combined Effect


    Unlike core effects, the new operator is superfluous here. The functions for combined
    effects are not constructors. On the other hand, they all benefit from a shortcut
    syntax that makes them available as methods on extending elements (script.aculo.us
    1.7.1). So, you can use any of the following syntaxes:


    ```

    Effect.CombinedEffectName(element [, options]) extElement.combinedEffectName(options)
    → extElement

    ```


    Note that a few combined effects are left out of this shortcut syntax because
    they would conflict with existing methods or were deemed irrelevant for this shortcut
    use. These are Event, ScrollTo, and Transform.


    # Smooth Operators


    Effect.Fade/Effect.Appear


    > We make an element fade away or fade in, respectively. Fading out will start,
    by default, with the element''s current opacity; when the effect is over, the
    element is hidden, and its original opacity is restored. Fading in starts by making
    sure that the element is displayed and starts with its original opacity if it
    already was. These effects obviously rely on Opacity core effect.


    # Sliding In and Out


    Effect.BlindUp/Effect.BlindDown


    These roll up (or down, respectively) a surface on which the element is supposed
    to be displayed. The element''s contents are left untouched and do not move. Only
    its surface shrinks upward or expands downward. Note that using BlindDown will
    work if the element is not "rolled up", then, the other way around.


    +   * http://wiki.script.aculo.us/scriptaculous/show/CombinationEffectsDemo'
