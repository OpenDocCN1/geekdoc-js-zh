  md: '# BUILDING EXPLICITLY


    +   - That leaves us with a large array of use cases, where we need to create
    DOM trees (or just hit a snag with innerHTML-based ways and need to revert to
    go ol'' DOM interfaces under the hood).


    This is what Builder is for.\It lets you quickly specify the construction of DOM
    fragments, to any depth and degree of complexity you need, with a rather concise,
    expressive syntaxes.


    You''ll need the builder.js module. So, your script.aculois loading will look,
    at minimum, like this:


    ```

    <script type="text/javascript" src="builder.js"></script>

    ```


    # 17.1 Building Explicitly


    Let''s start with the fundamental building block: Builder.node(). You can call
    it in a variety of ways, but by using a single statement block requires to decipher
    it, so I''ll use one line per variant:


    ```

    Builder.node(tagName) → Element

    Builder.node(tagName, attributes) → Element

    Builder.node(tagName, text | child | [ child, ... ]) → Element

    Builder.node(tagName, attributes, text | child | [ child, ... ]) → Element

    ```


    # Starting Early: Just One Element


    This is the safest way and lets you explicitly specify every tag name, attribute,
    and parent-relationship. You always start by passing a tag name. If you stop,
    you''ll get a rather raw element, but this is, in many subtle ways, superior to
    the usual document.createElement() call you would normally do with DOM. Indeed,
    there are stealthy bugs across browsers when you attempt to create, out of the
    blue, certain HTML elements this way.


    Builder.node() tries a variety of approaches, based on the innerHTML property
    and synthetic nodes, using document.createElement() only as a fallback. This results
    in maximum portability, with one exception. In Firefox prior to version 1.5, you
    will not be able to create <optgroup> and <option> elements this way, because
    of an acknowledged Firefox bug. But then, Firefox users usually have at least
    version 1.5...'
  merge: -1
