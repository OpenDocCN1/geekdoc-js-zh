- img_proc: true
  md: 'Like many people, you may just like having the physical copy of the book close
    at hand. It is just nicer to the eye than on-screen, text, you know.


    I discovered Prototype and script.relu in late 2005 and dived into them for real
    around June 2006 (since my early peruse had me fall in love with them) when I
    was writing my first book, *Bien développement pour le Web* 2.0, which featured
    rather detailed coverage of them through dedicated chapters. I loved the code
    I saw, I loved the code I could write, and I started contributing heavily to the
    Google Group and then the official documentation site. If you find examples in
    this book that also appear online, this is no accident. I may well have written
    the online page. And at any rate, when you have a very good example available,
    you just use it in.


    # 1.2 What’s in This Book, and How Is It Organized?


    The book is organized in three parts: the case-study tutorial, the Prototype reference,
    and the script.relu reference. These are not references in the usual sense of
    the term, which generally implies a dry series of object and method descriptions
    sprinkled with laconic snippets of code. These references are written like books
    unto themselves, arranged by topics, and they devote plenty of time and effort
    to providing background, explaining concepts, detailing the architecture, and
    helping you get the big picture as well as the details.


    Both reference parts open with an introductory chapter; these are Chapter 2, *Discovering
    Prototype*, on page 21 and Chapter 13, *Discovering script.relu*, on page 253.
    They’re here to help you dip your foot and test the waters. They tackle the library
    by topic, in roughly prioritized, with the most critical appearing first. This
    is actually not a straight rule; for instance, in script.relu, features are orthogonal,
    so you can study them in any order. I decided to go first with what seems most
    useful and perhaps brings most fun.


    This book is, quite simply, the *comprehensive reference* for these two libraries,
    with enough extra stuff to help you actually master them, be able to extend them
    for your own needs, or even contribute to them. This is the single book you need
    to become a Rails spin-offs guru. Doesn’t that sound good? Of course it does.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Some Things This Book Doesn''t Specifically Address


    Although Prototype helps and encourages best practices such as unobtrusive JavaScript,
    better accessibility, and so on, it does not guarantee it at all: it''s a tool,
    not a process.


    I am very fond of JavaScript accessibility and the narrower subset of Ajax accessibility.
    I discussed them at length in my previous book, Bien développeur pour le Web 2.0,
    which is however, not available in English so far... But the focus of this book
    is Prototype and script-abulous, which makes it a sizable book as it is. To stay
    focused and avoid straying too far afield, I won''t cover the details of general
    matters, which can be tackled and honored with any set of tools, as long as your
    development process embraces the right constraints.


    # Who Is This Book For?


    This book is essentially for any JavaScript developer interested in fully leveraging
    the power of these two wonderful libraries: Prototype and script.ulous. I expect
    that you have at least a decent understanding of JavaScript (although you may
    not master its tricky details) and (XHTML, as well as basic knowledge of the DOM
    and CSS. That''s all you''ll need, really! Whenever we tread in deeper waters,
    I''ll try to help you wade by explaining whatever details are relevant.


    # 1.3 Acknowledgments


    Writing a book is no walk in the park. It takes time, effort, dedication, steadfastness,
    and a tremendous amount of help and support.


    I cannot thank Pragmatic Programmers enough. These guys take you through a book-writing
    journey that leaves you loathe to write for anybody else. As publishing books,
    they''re the bleeding edge and a real magnet for technical writers with a soft
    spot for efficiency and cool tool chains. My heartfelt thanks especially to Dave
    Thomas, Andy Hunt, and Daniel H. Steinberg. You''re putting the word editor into
    a whole new perspective and a wonderful one at that.


    I would also like to express my unending gratitude to my copy editor, Kim Wimpsett
    who did a wonderful job with enormous insight and attention to detail; to my indexer,
    Sarah Lynn Eastler, who produced the outstanding, Pragmatic-Bookshelf-quality
    index at the end of this book; and to my typesetter, Steve Peter, who provided
    all the final touches to make it all look so prim.'
