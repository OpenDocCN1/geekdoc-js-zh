  md: "The following CSS classes are defined, which you can then define as\nYou want\
    \ in your style sheet:\n\n+   * *inplaceeditor-form* applies to the dynamically\
    \ created forms that we wrap the editor controls.\n* *editor_ok_button* and *editor_ok_link*\
    \ are used for OK controls, depending on the type.\n* *editor_cancel_button* and\
    \ *editor_cancel_link* are used for cancel controls.\n* *editor_field* is used\
    \ for the editor itself (in other words, the `<input>` or `<textarea>`).\n* *inplaceeditor-saving*\
    \ is used for the saving message, and we'll see later that *inplaceeditor-loading*\
    \ is used for the loading message when you use your editors an alternate text.\n\
    \nYou can use your own class names for several of these but not all (and at some\
    \ future point, you won't be able to change these names at all, as I'll discuss\
    \ in a moment). Currently, the following options are available for specifying\
    \ class names:\n\n+   * *hoverClassName* applies to editable elements when the\
    \ mouse hovers over them in noneditable mode. It has no default value.\n* *formClassName*\
    \ is for the wrapper forms and defaults to *inplaceeditor-form*.\n* *loadingClassName*\
    \ is for the loading status message, when you edit alternate text instead of the\
    \ raw content. It defaults to *inplaceeditor-loading*.\n* *savingClassName* is\
    \ for the saving status message. It defaults to *inplaceeditor-saving*.\n\nFinally,\
    \ note that there is a size property, which lets you to specify the \"size\" of\
    \ the single-line editor field, as per the `size=` attribute. Most of the time,\
    \ you'll resort to CSS instead, which is much more flexible and accurate.\n\n\
    Let's adapt our previous example to use these styles. The CSS file grows a bit\
    \ to accommodate this:\n\n```\nh1 { font-size: 1.5em; }\n.editable.hovered {\n\
    \  border: 1px dashed #880;\n}\n```"
