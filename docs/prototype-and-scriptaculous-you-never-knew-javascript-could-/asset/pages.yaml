    # CSS Classes, Colors, and Other Style Properties


    In-place editors are a kind of widget, which they actually produce UI components
    on the page (the editor, its OK/cancel controls, and so on). And widgets would
    not be good if they could not properly adapt to your application''s visual identity.
    Fortunately, you can rely on numerous CSS classes and several options to tune
    the editors'' appearance.'
