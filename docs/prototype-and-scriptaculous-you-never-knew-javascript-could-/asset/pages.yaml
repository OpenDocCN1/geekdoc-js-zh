    # Querying the Viewport


    Sometimes we need to get the dimensions of the viewport itself, not the browser
    window. The viewport, as you probably know, is the rendering surface for the document.
    It what''s left in the window we put in the menus, toolbars, scroll bars, status
    bars, and so on. This surface is much more interesting to us, for our scripts,
    than the window-dimensions, especially since the relation between viewport size
    and window size varies depending on the amount of "chrome" (UI components).


    Starting with Prototype 1.6, a new object is maintained, called document.viewport,
    with a few methods:


    ```

    document.viewport.getDimensions() -> { width: Number, height: Number }

    document.viewport.getHeight() -> Number

    document.viewport.getWidth() -> Number

    document.viewport.getScrollOffsets() -> { left: Number, top: Number }

    ```


    The signatures are pretty much-explanatory. As a reminder, scroll offsets are
    the shifting operated by the scroll bars (which means, incidentally, they''re
    never negative).


