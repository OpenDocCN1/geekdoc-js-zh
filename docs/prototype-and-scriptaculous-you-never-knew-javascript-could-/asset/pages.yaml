- img_proc: true
  md: '# C.1 On Windows


    The golden way to go for Microsoft Windows is to use the 1-Click Ruby Installer,
    a package maintained on RubyForge. Its home page is at http://rubyinstaller.rubyforge.org/wiki.pl?RubyInstaller,
    with the latest download (Ruby 1.8.6) at the time of this writing being accessible
    at http://rubyforge.org/frs/download.php/18566/ruby186-25.exe.


    This installer does not only contain Ruby but also popular tools, extensions,
    and documentation files in various formats. If you all need Ruby itself, you can
    go with the binary download at ftp://ftp.ruby-lang.org/pub/ruby/binaries/mswin


    # C.2 On Linux


    Well, chances are already have Ruby installed if you''re running Linux. It''s
    used by many system tools. Open a console, and try the following command:


    ```

    $ ruby -v

    ruby 1.8.6 (2007-03-13 patchlevel 0) [i486-linux]

    ```


    If you get a Command not found error, you don''t have it yet. But fear not—all
    you need to do is install the relevant packages. Depending on your distribution,
    the package system will vary, but the package name is usually ruby. There are
    currently packages for Debian, Mandriva, SuSE, Red Hat Linux, BSDs, and a number
    of their variants (including Ubuntu, OpenSUSE, Fedora, and more). Slackware gets
    packages through LinuxPackages.net, for instance.


    If you plan only to run the examples in this book, that''s all you need. If you
    plan to tinker a bit more with Ruby, you''ll probably want irb (interactive Ruby
    shell, great to try stuff out) and ri (the help browser), too.


    For instance, on Debian and its derivatives (for example, Ubuntu), all you need
    to do is something like this:


    ```

    $ sudo apt-get install ruby irb

    ```


    (Note that if you use Ubuntu or its derivatives, you''ll have to enable the universe
    repository to get these.)'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# ON MAC OS X


    # C.3 On Mac OS X


    OS X is now in a love affair with Ruby and Ruby on Rails, which mostly shows in
    Leopard (OS X 10.5, just released as this book is going to (press). Depending
    on the version of OS X you have, there are a bunch of options for binaries:


    +   - Panther (10.3), Tiger (10.4) and Leopard (10.5) have Ruby 1.8 pre-installed;
    Leopard features version 1.8.6, which is the latest one at the time of this writing.


    +   - Jaguar (10.2): there''s a .dmg package for Ruby 1.8.2 available at http://homepage.mac.com/discord/Ruby.


    If you''re technically savvy, you can naturally elect to grab the source for the
    latest version and compile it: ftp://ftp.ruby-lang.org/pub/ruby/ruby-1.8.6.tar.gz.
    A middle-of-the-road approach would be to use tools such as MacPorts¹ or Fink²;
    for instance, with MacPorts, you can grab Ruby like this:


    ```

    $ port install ruby

    ```


    # C.4 Running a Ruby Script


    The universal way of running a Ruby script is simply to pass its filename to the
    ruby interpreter. For instance, you would open a command prompt, move into the
    script''s directory, and invoke the interpreter on it. For instance:


    ```

    $ ruby server.rb

    ```


    In all our server-side examples for this book, we use Ruby''s inclusion of the
    WEBrick module in its standard library to provide us with a working, lightweight
    HTTP server that can run Ruby code dynamically. To make things simpler, WEBrick
    will, by default, do all logging on the script''s standard output, which you can
    make it very easy to stop, just press Ctrl+C in the console window once it''s
    running.


    This all makes it very easy to run a server, track its logs, and stop it, especially
    when compared to other server-side solutions.


    +   1. http://www.macports.org/


    +   2. http://fink.sourceforge.net/'
  merge: -1
