  md: '# USING SCRIPT.ACULO.us In Your Pages


    # DOM builder


    This is a developer tool that eases DOM creation considerably. When building DOM
    fragments, not only are the raw W3C interfaces bland and unruly, they are not
    flawlessly supported browsers! There are issues with <select> tags or their contents,
    with table-related elements, with name= attributes on specific tags, with attribute
    whose names are JavaScript keywords, and so on.


    This object lets you specify DOM fragments in the simple way, smoothing over such
    discrepancies and issues.


    # Sound!


    Version 1.7.1 introduced a sound system that lets you play sounds easily, queue
    them up, use multiple tracks, and so on. It does not require Flash and relies
    on your browser''s native audio capabilities, usually provided through widely
    spread plug-ins.


    Efficient use of shorts can be a really nice feature for applications that need
    to grab the user''s attention even when the page is not visible (moved aside,
    hidden another window, reduced to the task bar, or simply not the active tab).


    # 13.2 Using script.aculo.us in Your Pages


    First, you''ll need to download a recent version. Thomas keeps pushing new releases
    frequently on the official website, so just head to http://script.aculo.us/ and
    grab the latest archive. It includes the minimal version of Prototype that this
    particular release relies on. If you have an earlier Prototype release, use the
    one that comes with script.aculo.us or update your copy to a more recent one.


    You will need to load Prototype first and script.aculo.us second. The shortest
    way to use two <script> elements, like this:


    ```

    <script type="text/javascript" src="...prototype.js"></script>

    <script type="text/javascript" src="...scriptaculous.js"></script>

    ```


    However, this will end up loading all the modules, which need to be available
    in the same directory as scriptaculous.js. This is useless wasteful. Most of the
    time, you need only a couple modules. So, be nice on your bandwidth, your users,
    and everyone by just loading the modules you need.'
