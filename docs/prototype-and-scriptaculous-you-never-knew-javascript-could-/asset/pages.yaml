  md: '# It''s we spawn a whole series of people to tinker with:


    ```

    var people = [

    new Person(''Jes ''Canlaith'', ''Hall'', ''Wellington'', ''NZ''),

    new Person(''Sebastien'', ''Gruhier'', ''Carfeou'', ''FR''),

    new Person(''Clototie'', ''Michel''),

    new Person(''Stéphane'', ''Akkaoui'', ''Paris''),

    new Person(''Elodie'', ''Jaubert'', ''Paris'')

    ];

    ```


    Notice how we do not need to pass all the arguments every time and the objects
    are constructed: through the traditional new keyword.


    OK, we are all set. We can now start playing with Prototype-induced power. For
    instance, let''s say we need to get a sorted list of all the first names for these
    people, with no risk of duplicates:


    ```

    people.pluck(''first'').sort().uniq().join('', '')

    // Clotilde, Elodie, Jes ''Canlaith'', Sebastien, Stéphane

    ```


    Doesn''t this rock? The pluck() method fetches a given property from all the objects
    in the series and returns an array of the resulting values. uniq() strips out
    duplicates. This is rancid, don''t you think?


    How about getting full information on all people with a defined country, sorted
    by ascending country code:


    ```

    people.findAll(function(n) { return n.country; })

    .sort(Person.compare.bind(Person, ''country'')).invoke(getDisplayName)

    // => [''Sebastian Gruhier (Carfeou, FR)'', ''Jes Canlaith Hall (Wellington, NZ)''
    ]

    ```


    The findAll() method takes a predicate (taking an element and returning a boolean
    about it) and returns all the elements that passed it. Here, our predicate returns
    each person''s country property, value may very well be undefined. If it holds
    a nonempty string, it will be deemed true, so the predicate will pass. Otherwise,
    the predicate will fail.


    Perhaps you come from a programming background with languages that do not have
    higher-order-functions, meaning you can use functions as regular values to be
    assigned, passed around as arguments to other functions, returned as result values,
    and so on.'
