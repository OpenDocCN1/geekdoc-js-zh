    # Method Dumping: Still Explicit, But Shorter


    If you feel like shortening your code and your personal sense of code aesthetics
    tolerates it, you can equip any object, including the global scope (that is, the
    window object) with convenience methods for just about every XHTML tag. These
    convenience methods are really just wrappers around Builder.node(), with the first
    argument prefixed.


    For instance, instead of doing this:


    ```

    Builder.node(''h1'', Builder.node(''code'', ''Builder''))

    ```


    ...you would do this:


    ```

    HI(CODE(''Builder''))

    ```


    In the same vein, following this snippet:


    ```

    Builder.node(''h1'', Builder.node(''code'', ''Builder''), ''rules'')

    ```


    ...would become this:


    ```

    HI([CODE(''Builder''), ''rules''])

    ```


    As a final example, the two following calls:


    ```

    Builder.node(''p'', { className: ''submission'' },

    Builder.node(''input'', { type: ''submit'', value: ''Sign in'' }),

    <a href=''http://prototypes.org/api/ajax/update'' },

    [Builder.node(''code'', ''Ajax.Updater''), ''documentation''] }

    ```


    ...would be turned into:


    ```

    P({className: ''submission'', INPUT({ type: ''submit'' },

    value: ''sign in'' }),

    A({href: ''http://prototypes.org/api/ajax/update'' },

    [CODE(''Ajax.Updater''), ''documentation'']})

    ```


    So, how do we simplify this? By calling Builder.dump()—once, at some point before
    we start using these shortcuts. The method takes an optional scope argument:


    ```

    Builder.build([scope = window])

    ```


    So, calling it with no argument sprinkles the global scope with those uppercase
    methods. Uppercase was chosen so the risk of conflict with'
