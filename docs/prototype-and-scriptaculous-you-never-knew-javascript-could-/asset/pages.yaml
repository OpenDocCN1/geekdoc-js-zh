    Strings and arrays are probably the two richest types in native JavaScript; they
    come with tens of methods out of the box. But because they are so essential to
    just any kind of processing, there is still plenty of room for useful improvement.
    Prototype endow them with numerous new methods, which I''ll explain for you now,
