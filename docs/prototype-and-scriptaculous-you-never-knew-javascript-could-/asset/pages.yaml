- img_proc: true
  md: '# ITERATIONS VS. REGULAR LOOPS


    is so helpful in extracting elements from the DOM based on complex criteria, systematically
    extends the elements it returns. Most element-returning methods added by DOM extension
    (for example, up()) return extended elements. So, you had better think about how
    you use descendants().


    # 11.2 Iterations vs. Regular Loops


    Using iterator methods (methods that will take a function as an argument and invoke
    this function for some or all of a collection of elements) basically means that
    at some point the collection''s each() method is called, and it will call your
    iterator. That, already, has a slight cost (double function call, with the maintenance
    of the closures). But the wrapper each() also needs to maintain a try/catch block
    to deal with the break exception, which has a significant impact.


    Generally, you shouldn''t worry too much about performance using iterators. Unless
    you''re iterating over an exceptionally large collection, you''re in the clear.
    However, sometimes you do need to squeeze every last bit of speed you can do.
    There is, then, no other alternative to writing your iteration by code. Make sure
    you do it right, then. Cache the collection length, avoid declaring too many variables
    in the loop block, and so on. Here''s a typical “fast” loop:


    ```

    var item;

    for (var i = 0, l = data.length; i != l; i++) {

    item = data[i];

    // Process item

    }

    ```


    First, it declares item outside the loop scope, so there''s no allocation/release
    cost for every iteration. Second, it caches the collection''s length, avoiding
    evaluation at every turn. Third (and least important), it uses the prefix ++ operator,
    which avoids cloning its operand.


    It would appear that another approach, grabbing length and then using something
    like a while (--) loop, can squeeze even more juice out of an array iteration.
    The aesthetics of it just make me nauseous. Still, it''s worth a mentioning—maybe
    it does shave off more than a few nanoseconds off the for version, should you
    need it.'
