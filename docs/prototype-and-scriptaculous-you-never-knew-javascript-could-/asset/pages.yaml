  md: '# Namespace


    Several objects are not intended for instantiation. They exist only to bundle
    related elements, such as functions or objects. I call such objects namespaces,
    because this is the role they play—named area where related objects exist. Two
    examples of such namespaces are Ajax and Event.


    # Module


    Sometimes an object is neither a regular namespace nor proper namespace. It does
    contain methods, but these are supposed to be mixed in another object''s prototype.
    There is generally some assumption about this object; it is usually supposed to
    feature one or more methods, upon which the mixed-in ones depend.


    Such objects represent an almost stand-alone feature that just needs a host object
    to satisfy a few criteria in order to extend it with all these features. I call
    such objects modules, because it is the exact term for this kind of entity in
    the Ruby world, and the word sounds mince. Prototype''s most famous module is
    Enumerable, which is mixed by numerous objects, such as Array.


    # Iterators


    For brevity''s sake, I use iterators for callback functions that are passed to
    methods that, internally, iterate over a collection. Such-back functions are called
    in sequence over part or all of the iterated elements. The quintessential iteration
    function is Enumerable.each, which most functions from Enumerable rely upon internally.


    # Extended Elements


    Prototype features an awesome DOM extension mechanism, described at great length
    in Chapter 7. Playing with the DOM is Finally Fun!, on page 130. When I refer
    to extended elements (which happens fairly often), I mean a DOM element that went
    through DOM extension, one way or another. This essentially means all element-related
    methods can be invoked straight on it, which is good. elt.hide() feels much more
    object-oriented than Element.hide(elf), don''t you think?


    # Aliases


    Sometimes, a given feature is well-known under multiple names. For instance, consider
    a method that iterates through a sequence to'
