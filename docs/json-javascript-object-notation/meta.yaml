    # About the Tutorial


    JSON or JavaScript Object Notation is a lightweight text-based open standard designed
    for human-readable data interchange. The JSON format was originally specified
    by Douglas Crockford, and is described in RFC 4627. The official Internet media
    type for JSON is application/json. The JSON filename extension is .json.


    This tutorial will help you understand JSON and its use within various programming
    languages such as PHP, PERL, Python, Ruby, Java, etc.


    # Audience


    This tutorial has been designed to help beginners understand the basic functionality
    of JavaScript Object Notation (JSON) to develop the data interchange format. After
    completing this tutorial, you will have a good understanding of JSON and how to
    use it with JavaScript, Ajax, Perl, etc.


    # Prerequisites


    Before proceeding with this tutorial, you should have a basic understanding of
    the web application''s work over HTTP and we assume that you have a basic knowledge
