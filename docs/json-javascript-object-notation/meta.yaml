- md: "## JSON\n\n```json\n\"id\":\"01\",\n\"language\": \"Java\",\n\"edition\": \"\
    third\",\n\"author\": \"Herbert Schildt\"\n},\n{\n    \"id\":\"07\",\n    \"language\"\
    : \"C++\",\n    \"edition\": \"second\",\n    \"author\": \"E.Balagurusamy\"\n\
    }]\n}\n```\n\nAfter understanding the above program, we will try another example.\
    \ Let's save the below code as **json.htm**:\n\n```html\n<html>\n<head>\n<title>JSON\
    \ example</title>\n<script language=\"javascript\" >\n\n    var object1 = { \"\
    language\" : \"Java\", \"author\"  : \"herbert schildt\" };\n    document.write(\"\
    <h1>JSON with JavaScript example</h1>\");\n    document.write(\"<br>\");\n   \
    \ document.write(\"<h3>Language = \" + object1.language+\"</h3>\");\n    document.write(\"\
    <h3>Author = \" + object1.author+\"</h3>\");\n\n    var object2 = { \"language\"\
    \ : \"C++\", \"author\"  : \"E-Balagurusamy\" };\n    document.write(\"<br>\"\
    );\n    document.write(\"<h3>Language = \" + object2.language+\"</h3>\");\n  \
    \  document.write(\"<h3>Author = \" + object2.author+\"</h3>\");\n\n    document.write(\"\
    <hr />\");\n    document.write(object2.language + \" programming language can\
    \ be studied \" +\n    \"from book written by \" + object2.author);\n    document.write(\"\
    <hr />\");\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\nNow let's try\
    \ to open json.htm using IE or any other javascript enabled browser that produces\
    \ the following result:\n\n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_7_0.png)\n\
    \nYou can refer to JSON Objects chapter for more information on JSON objects.\n\
    \n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_7_1.png)\n\n## 2. JSON – Syntax\n\n\
    Let's have a quick look at the basic syntax of JSON. JSON syntax is basically\
    \ considered as a subset of JavaScript syntax; it includes the following:\n\n\
    - Data is represented in name/value pairs.\n- Curly braces hold objects and each\
    \ name is followed by ':' (colon), the name/value pairs are separated by ',' (comma).\n\
    - Square brackets hold arrays and values are separated by ',' (comma).\n\nBelow\
    \ is a simple example:\n\n```json\n{\n    \"book\": [\n    {\n        \"id\":\"\
    01\",\n        \"language\": \"Java\",\n        \"edition\": \"third\",\n    \
    \    \"author\": \"Herbert Schildt\"\n    },\n    {\n        \"id\":\"07\",\n\
    \        \"language\": \"C++\",\n        \"edition\": \"second\",\n        \"\
    author\": \"E.Balagurusamy\"\n    }]\n}\n```\n\nJSON supports the following two\
    \ data structures:\n\n- **Collection of name/value pairs:** This data structure\
    \ is supported by different programming languages.\n- **Ordered list of values:**\
    \ It includes array, list, vector or sequence etc.\n\n## 3. JSON – DataTypes\n\
    \nJSON format supports the following data types:\n\n| Type | Description |\n|\
    \ :--- | :--- |\n| Number | double-precision floating-point format in JavaScript\
    \ |\n| String | double-quoted Unicode with backslash escaping |\n| Boolean | true\
    \ or false |\n| Array | an ordered sequence of values |\n| Value | it can be a\
    \ string, a number, true or false, null etc |\n| Object | an unordered collection\
    \ of key:value pairs |\n| Whitespace | can be used between any pair of tokens\
    \ |\n| null | empty |\n\n### Number\n\n- It is a double precision floating-point\
    \ format in JavaScript and it depends on implementation.\n- Octal and hexadecimal\
    \ formats are not used.\n- No NaN or Infinity is used in Number.\n\nThe following\
    \ table shows the number types:\n\n| Type | Description |\n| :--- | :--- |\n|\
    \ Integer | Digits 1-9, 0 and positive or negative |\n| Fraction | Fractions like\
    \ .3, .9 |\n| Exponent | Exponent like e, e+, e-, E, E+, E- |\n\n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_9_0.png)\n\
    \n### Syntax\n\n```javascript\nvar json-object-name = {\"string\" : number_value,\
    \ ......}\n```\n\n### Example\n\nExample showing Number Datatype, value should\
    \ not be quoted:\n\n```javascript\nvar obj = {\"marks\": 97}\n```\n\n### String\n\
    \n- It is a sequence of zero or more double quoted Unicode characters with backslash\
    \ escaping.\n- Character is a single character string i.e. a string with length\
    \ 1.\n\nThe table shows various special characters that you can use in strings\
    \ of a JSON document:\n\n| Type | Description |\n| :--- | :--- |\n| \" | double\
    \ quotation |\n| \\ | backslash |\n| / | forward slash |\n| b | backspace |\n\
    | f | form feed |\n| n | new line |\n| r | carriage return |\n| t | horizontal\
    \ tab |\n| u | four hexadecimal digits |\n\n### Syntax\n\n```javascript\nvar json-object-name\
    \ = { string : \"string value\", ......}\n```\n\n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_10_0.png)\n\
    \n### Example\n\nExample showing String Datatype:\n\n```javascript\nvar obj =\
    \ {\"name\": \"Amit\"}\n```\n\n### Boolean\n\nIt includes true or false values.\n\
    \n### Syntax\n\n```javascript\nvar json-object-name = { string : true/false, .......}\n\
    ```\n\n### Example\n\n```javascript\nvar obj = {\"name\": \"Amit\", \"marks\"\
    : 97, \"distinction\": true}\n```\n\n### Array\n\n- It is an ordered collection\
    \ of values.\n- These are enclosed in square brackets which means that array begins\
    \ with '[' and ends with ']'.\n- The values are separated by ',' (comma).\n- Array\
    \ indexing can be started at 0 or 1.\n- Arrays should be used when the key names\
    \ are sequential integers.\n\n### Syntax\n\n```javascript\n[ value, .......]\n\
    ```\n\n### Example\n\nExample showing array containing multiple objects:\n\n```json\n\
    {\n  \"books\": [\n    { \"language\":\"Java\" , \"edition\":\"second\" },\n \
    \   { \"language\":\"C++\" , \"lastName\":\"fifth\" },\n    { \"language\":\"\
    C\" , \"lastName\":\"third\" }\n  ]\n}\n```\n\n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_11_0.png)\n\
    \n### Object\n\n- It is an unordered set of name/value pairs.\n- Objects are enclosed\
    \ in curly braces that is, it starts with '{' and ends with '}'.\n- Each name\
    \ is followed by ':' (colon) and the key/value pairs are separated by ',' (comma).\n\
    - The keys must be strings and should be different from each other.\n- Objects\
    \ should be used when the key names are arbitrary strings.\n\n### Syntax\n\n```javascript\n\
    { string : value, ......}\n```\n\n### Example\n\nExample showing Object:\n\n```json\n\
    {\n  \"id\": \"011A\",\n  \"language\": \"JAVA\",\n  \"price\": 500\n}\n```\n\n\
    ### Whitespace\n\nIt can be inserted between any pair of tokens. It can be added\
    \ to make a code more readable. Example shows declaration with and without whitespace:\n\
    \n### Syntax\n\n```javascript\n{string: \"  \",....}\n```\n\n### Example\n\n```javascript\n\
    var obj1 = {\"name\": \"Sachin Tendulkar\"}\nvar obj2 = {\"name\": \"SauravGanguly\"\
    }\n```\n\n### null\n\nIt means empty type.\n\n### Syntax\n\n```javascript\nnull\n\
    ```\n\n### Example\n\n```javascript\nvar i = null;\n\nif(i==1)\n{\n    document.write(\"\
    <h1>value is 1</h1>\");\n}\nelse\n{\n    document.write(\"<h1>value is null</h1>\"\
    );\n}\n```\n\n### JSON Value\n\nIt includes:\n\n- number (integer or floating\
    \ point)\n- string\n- boolean\n- array\n- object\n- null\n\n### Syntax\n\n```javascript\n\
    String | Number | Object | Array | TRUE | FALSE | NULL\n```\n\n### Example\n\n\
    ```javascript\nvar i = 1;\nvar j = \"sachin\";\nvar k = null;\n```\n\n## 4. JSON\
    \ – Objects\n\n### Creating Simple Objects\n\nJSON objects can be created with\
    \ JavaScript. Let us see the various ways of creating JSON objects using JavaScript:\n\
    \n- Creation of an empty Object:\n- Creation of a new Object:\n- Creation of an\
    \ object with attribute **bookname** with value in string, attribute **price**\
    \ with numeric value. Attribute is accessed by using '.' Operator:\n\n```javascript\n\
    var JSONObject = {};\n```\n\n```javascript\nvar JSONObject = new Object();\n```\n\
    \n```javascript\nvar JSONObject = { \"bookname \":\"VB BLACK BOOK\", \"price\"\
    :500 };\n```\n\nThis is an example that shows creation of an object in javascript\
