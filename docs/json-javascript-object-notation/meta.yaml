    ,\n    \"title\": \"Product\",\n    \"description\": \"A product from Acme's catalog\"\
    ,\n    \"type\": \"object\",\n    \"properties\": {\n        \"id\": {\n     \
    \       \"description\": \"The unique identifier for a product\",\n          \
