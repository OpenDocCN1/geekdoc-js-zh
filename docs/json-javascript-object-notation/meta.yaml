  md: "# 12. JSON – JSON with Ajax\n\nAJAX is Asynchronous JavaScript and XML, which\
    \ is used on the client side as a group of interrelated web development techniques,\
    \ in order to create asynchronous web applications. According to the AJAX model,\
    \ web applications can send and retrieve data from a server asynchronously without\
    \ interfering with the display and the behavior of the existing page.\n\nMany\
    \ developers use JSON to pass AJAX updates between the client and the server.\
    \ Websites updating live sports scores can be considered as an example of AJAX.\
    \ If these scores have to be updated on the website, then they must be stored\
    \ on the server so that the webpage can retrieve the score when it is required.\
    \ This is where we can make use of JSON formatted data.\n\nAny data that is updated\
    \ using AJAX can be stored using the JSON format on the web server. AJAX is used\
    \ so that JavaScript can retrieve these JSON files when necessary, parse them,\
    \ and perform one of the following operations:\n\n+   * Store the parsed values\
    \ in the variables for further processing before displaying them on the webpage.\n\
    * It directly assigns the data to the DOM elements in the webpage, so that they\
    \ are displayed on the website.\n\n**Example**\nThe following code shows JSON\
    \ with AJAX. Save it as **ajax.htm** file. Here the loading function loadJSON()\
    \ is used asynchronously to upload JSON data.\n\n```\n<html>\n<head>\n<meta content=\"\
    text/html; charset=ISO-8859-1\" http-equiv=\"content-type\">\n<script type=\"\
    application/javascript\">\nfunction loadJSON()\n{\n    var data_file = \"http://www.tutorialspoint.com/json/data.json\"\
    ;\n    var http_request = new XMLHttpRequest();\n    try{\n        // Opera 8.0+,\
    \ Firefox, Chrome, Safari\n        http_request = new XMLHttpRequest();\n    }catch\
    \ (e){\n        // Internet Explorer Browsers\n        try{\n            http_request\
    \ = new ActiveXObject(\"Msxml2.XMLHTTP\");\n        }catch (e) {\n           \
    \ try{\n                http_request = new ActiveXObject(\"Microsoft.XMLHTTP\"\
    );\n            }catch (e) {\n                window.alert(\"Something bad is\
    \ going on....\");\n            }\n        }\n    }\n}\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```"
