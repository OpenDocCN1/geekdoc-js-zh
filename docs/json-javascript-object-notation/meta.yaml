  md: '# # 5. JSON – Schema


    JSON Schema is a specification for JSON based format for defining the structure
    of JSON data. It was written under IETF draft which expired in 2011. JSON Schema:


    +   - Describes your existing data format.

    - Clear, human- and machine-readable documentation.

    - Complete structural validation, useful for automated testing.

    - Complete structural validation, validating client-submitted data.


    # ## JSON Schema Validation Libraries


    There are several validators currently available for different programming languages.
    Currently the most complete and compliant JSON Schema validator available is JSV.


    | Languages | Libraries |

    | :--- | :--- |

    | C | WJElement (LGPLv3) |

    | Java | json-schema-validator (LGPLv3) |

    | .NET | Json.NET (MIT) |

    | ActionScript 3 | Frigga (MIT) |

    | Haskell | aeson-schema (MIT) |

    | Python | Jsonschema |

    | Ruby | autoparse (ASL 2.0); ruby-jsonschema (MIT) |

    | PHP | php-json-schema (MIT). json-schema (Berkeley) |

    | JavaScript | Orderly (BSD); JSV; json-schema; Matic (MIT); Dojo; Persevere (modified
    BSD or AFL 2.0); schema.js. |'
