    # 9.  JSON – JSON with Python


    This chapter covers how to encode and decode JSON objects using Python programming
    language. Let''s start with preparing the environment to start our programming
    with Python for JSON.


    # Environment


    Before you start with encoding and decoding JSON using Python, you need to install
    any of the JSON modules available. For this tutorial we have downloaded and installed
    Demjson (http://deron.meranda.us/python/demjson/) as follows:


    ```

    $tar xvfz demjson-1.6.tar.gz

    $cd demjson-1.6

    $python setup.py install

    ```


    # JSON Functions


    | Function | Libraries |

    | :--- | :--- |

    | encode | Encodes the Python object into a JSON string representation. |

    | decode | Decodes a JSON-endoded string into a Python object. |


    # Encoding JSON in Python (encode)


    Python encode() function encodes the Python object into a JSON string representation.


    # Syntax


    ```

    demjson.encode(self, obj, nest_level=0)

    ```


    # Example


    The following example shows arrays under JSON with Python.


    ```

    #!/usr/bin/python

    import demjson


    data = [ { ''a'' : 1, ''b'' : 2, ''c'' : 3, ''d'' : 4, ''e'' : 5 } ]

    ```'
