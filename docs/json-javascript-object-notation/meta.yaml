    ,\n    \"price\": 25.50,\n  }\n]\n```\n\n## 6. JSON – 与 XML 的比较\n\nJSON 和 XML\
    \ 都是人类可读的格式，并且与语言无关。它们都在现实世界中支持创建、读取和解码。我们可以基于以下因素将 JSON 与 XML 进行比较：\n\n### 冗余性\n\
    \nXML 比 JSON 更冗长，因此对程序员来说，编写 JSON 更快。\n\n### 数组用法\n\nXML 用于描述结构化数据，但不包括数组，而 JSON\
