    \ is 1</h1>\");\n}\nelse\n{\n    document.write(\"<h1>value is null</h1>\");\n\
    }\n```\n\n### JSON 值\n\n它包括：\n\n-   数字（整数或浮点数）\n-   字符串\n-   布尔值\n-   数组\n-  \
    \ 对象\n-   null\n\n### 语法\n\n```javascript\nString | Number | Object | Array |\
    \ TRUE | FALSE | NULL\n```\n\n### 示例\n\n```javascript\nvar i = 1;\nvar j = \"\
    sachin\";\nvar k = null;\n```\n\n## 4. JSON – 对象\n\n### 创建简单对象\n\nJSON对象可以使用JavaScript创建。让我们看看使用JavaScript创建JSON对象的各种方式：\n\
