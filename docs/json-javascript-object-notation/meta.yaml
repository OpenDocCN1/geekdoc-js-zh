  md: "# 2. JSON – Syntax\n\nLet's have a quick look at the basic syntax of JSON.\
    \ JSON syntax is basically considered as a subset of JavaScript syntax; it includes\
    \ the following:\n\n+   * Data is represented in name/value pairs.\n* Curly braces\
    \ hold objects and each name is followed by ':'(colon), the name/value pairs are\
    \ separated by , (comma).\n* Square brackets hold arrays and values are separated\
    \ by ,(comma).\n\nBelow is a simple example:\n\n```\n{\n    \"book\": [\n    {\n\
    \        \"id\":\"01\",\n        \"language\": \"Java\",\n        \"edition\"\
    : \"third\",\n        \"author\": \"Herbert Schildt\"\n    },\n    {\n       \
    \ \"id\":\"07\",\n        \"language\": \"C++\",\n        \"edition\": \"second\"\
    \n        \"author\": \"E.Balagurusamy\"\n    }]\n}\n```\n\nJSON supports the\
    \ following two data structures:\n\n+   * **Collection of name/value pairs:**\
    \ This Data Structure is supported by different programming languages.\n* **Ordered\
    \ list of values:** It includes array, list, vector or sequence etc."
