  md: '# JSON


    # Syntax


    ```

    var json-object-name = {"string" : number_value, ......}

    ```


    # Example


    Example showing Number Datatype, value should not be quoted:


    ```

    var obj = {"marks": 97}

    ```


    # String


    +   - It is a sequence of zero or more double quoted Unicode characters with backslash
    escaping.

    - Character is a single character string i.e. a string with length 1.


    The table shows various special characters that you can use in strings of a JSON
    document:


    | Type | Description |

    |---|---|

    | " | double quotation |

    | \ | backslash |

    | / | forward slash |

    | b | backspace |

    | f | form feed |

    | n | new line |

    | r | carriage return |

    | t | horizontal tab |

    | u | four hexadecimal digits |


    # Syntax


    ```

    var json-object-name = { string : "string value", ......}

    ```


