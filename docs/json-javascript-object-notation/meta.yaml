    ```


    # Decoding JSON in Python (decode)


    Python can use demjson.decode() function for decoding JSON. This function returns
    the value decoded from json to an appropriate Python type.


    # Syntax


    ```

    demjson.decode(self, txt)

    ```


    # Example


    The following example shows how Python can be used to decode JSON objects.


    ```

    #!/usr/bin/python

    import demjson


    json = ''{"a":1,"b":2,"c":3,"d":4,"e":5}'';


    text = demjson.decode(json)

    print text

    ```


    On executing, it will produce the following result:


    ```

    {u''a'': 1, u''c'': 3, u''b'': 2, u''e'': 5, u''d'': 4}

    ```'
