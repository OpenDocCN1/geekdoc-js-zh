  md: "# 6. JSON – Comparison with XML\n\nJSON and XML are human readable formats\
    \ and are language independent. They both have support for creation, reading and\
    \ decoding in real world situations. We can compare JSON with XML, based on the\
    \ following factors:\n\n# Verbose\n\nXML is more verbose than JSON, so it is faster\
    \ to write JSON for programmers.\n\n# Arrays Usage\n\nXML is used to describe\
    \ the structured data, which doesn't include arrays whereas JSON include arrays.\n\
    \n# Parsing\n\nJavaScript's *eval* method parses JSON. When applied to JSON, eval\
    \ returns the described object.\n\n# Example\n\nIndividual examples of XML and\
    \ JSON:\n\n# JSON\n\n```\n{\n    \"company\": Volkswagen,\n    \"name\": \"Vento\"\
    ,\n    \"price\": 800000\n}\n```\n\n# XML\n\n```\n<car>\n    <company>Volkswagen</company>\n\
    \    <name>Vento</name>\n    <price>800000</price>\n</car>\n```"
