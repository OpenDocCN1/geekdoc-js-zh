    id\": 3,\n    \"name\": \"A blue mouse\",\n    \"price\": 25.50,\n  }\n]\n```\n\
    \n## 6. JSON – Comparison with XML\n\nJSON and XML are human readable formats\
    \ and are language independent. They both have support for creation, reading and\
    \ decoding in real world situations. We can compare JSON with XML, based on the\
    \ following factors:\n\n### Verbose\n\nXML is more verbose than JSON, so it is\
    \ faster to write JSON for programmers.\n\n### Arrays Usage\n\nXML is used to\
    \ describe the structured data, which doesn't include arrays whereas JSON include\
    \ arrays.\n\n### Parsing\n\nJavaScript's *eval* method parses JSON. When applied\
    \ to JSON, eval returns the described object.\n\n### Example\n\nIndividual examples\
    \ of XML and JSON:\n\n### JSON\n\n```\n{\n    \"company\": Volkswagen,\n    \"\
    name\": \"Vento\",\n    \"price\": 800000\n}\n```\n\n### XML\n\n```\n<car>\n \
    \   <company>Volkswagen</company>\n    <name>Vento</name>\n    <price>800000</price>\n\
    </car>\n```\n\n## 7. JSON – JSON with PHP\n\nThis chapter covers how to encode\
    \ and decode JSON objects using PHP programming language. Let's start with preparing\
    \ the environment to start our programming with PHP for JSON.\n\n### Environment\n\
    \nAs of PHP 5.2.0, the JSON extension is bundled and compiled into PHP by default.\n\
    \n### JSON Functions\n\n| Function | Libraries |\n| --- | --- |\n| json_encode\
    \ | Returns the JSON representation of a value. |\n| json_decode | Decodes a JSON\
    \ string. |\n| json_last_error | Returns the last error occurred. |\n\n### Encoding\
    \ JSON in PHP (json_encode)\n\nPHP json_encode() function is used for encoding\
    \ JSON in PHP. This function returns the JSON representation of a value on success\
    \ or FALSE on failure.\n\n#### Syntax\n\n```\nstring json_encode ( $value [, $options\
    \ = 0 ] )\n```\n\n#### Parameters\n\n- **value**: The value being encoded. This\
    \ function only works with UTF-8 encoded data.\n- **options**: This optional value\
    \ is a bitmask consisting of JSON_HEX_QUOT, JSON_HEX_TAG, JSON_HEX_AMP, JSON_HEX_APOS,\
    \ JSON_NUMERIC_CHECK, JSON_PRETTY_PRINT, JSON_UNESCAPED_SLASHES, JSON_FORCE_OBJECT.\n\
    \n### Example\n\nThe following example shows how to convert an array into JSON\
    \ with PHP:\n\n```\n<?php\n    $arr = array('a' => 1, 'b' => 2, 'c' => 3, 'd'\
    \ => 4, 'e' => 5);\n    echo json_encode($arr);\n?>\n```\n\nWhile executing, this\
    \ will produce the following result:\n\n```\n{\"a\":1,\"b\":2,\"c\":3,\"d\":4,\"\
    e\":5}\n```\n\nThe following example shows how the PHP objects can be converted\
    \ into JSON:\n\n```\n<?php\n    class Emp {\n        public $name = \"\";\n  \
    \      public $hobbies  = \"\";\n        public $birthdate = \"\";\n    }\n  \
    \  $e = new Emp();\n    $e->name = \"sachin\";\n    $e->hobbies  = \"sports\"\
    ;\n    $e->birthdate = date('m/d/Y h:i:s a', \"8/5/1974 12:20:03 p\");\n    $e->birthdate\
    \ = date('m/d/Y h:i:s a', strtotime(\"8/5/1974 12:20:03\"));\n\n    echo json_encode($e);\n\
    ?>\n```\n\nWhile executing, this will produce the following result:\n\n```\n{\"\
    name\":\"sachin\",\"hobbies\":\"sports\",\"birthdate\":\"08\\/05\\/1974 12:20:03\
    \ pm\"}\n```\n\n### Decoding JSON in PHP (json_decode)\n\nPHP json_decode() function\
    \ is used for decoding JSON in PHP. This function returns the value decoded from\
    \ json to appropriate PHP type.\n\n#### Syntax\n\n```\nmixed json_decode ($json\
    \ [,$assoc = false [, $depth = 512 [, $options = 0 ]]])\n```"
