    : \"Name of the product\",\n            \"type\": \"string\"\n        },\n   \
    \     \"price\": {\n            \"type\": \"number\",\n            \"minimum\"\
    : 0,\n            \"exclusiveMinimum\": true\n        }\n    },\n    \"required\"\
    : [\"id\", \"name\", \"price\"]\n}\n```\n\nLet's check the various important keywords\
    \ that can be used in this schema:\n\n| Keywords | Description |\n| :--- | :---\
    \ |\n| $schema | The $schema keyword states that this schema is written according\
    \ to the draft v4 specification. |\n| title | You will use this to give a title\
