    \n## 2. JSON – 语法\n\n让我们快速了解一下JSON的基本语法。JSON语法基本上被视为JavaScript语法的子集；它包括以下内容：\n\
    \n-   数据以名称/值对的形式表示。\n-   花括号保存对象，每个名称后跟':'（冒号），名称/值对由','（逗号）分隔。\n-   方括号保存数组，值由','（逗号）分隔。\n\
    \n下面是一个简单的例子：\n\n```json\n{\n    \"book\": [\n    {\n        \"id\":\"01\",\n\
    \        \"language\": \"Java\",\n        \"edition\": \"third\",\n        \"\
    author\": \"Herbert Schildt\"\n    },\n    {\n        \"id\":\"07\",\n       \
    \ \"language\": \"C++\",\n        \"edition\": \"second\",\n        \"author\"\
    : \"E.Balagurusamy\"\n    }]\n}\n```\n\nJSON支持以下两种数据结构：\n\n-   **名称/值对的集合：** 这种数据结构得到不同编程语言的支持。\n\
    -   **值的有序列表：** 它包括数组、列表、向量或序列等。\n\n## 3. JSON – 数据类型\n\nJSON格式支持以下数据类型：\n\n|\
    \ 类型 | 描述 |\n| :--- | :--- |\n| Number | JavaScript中的双精度浮点数格式 |\n| String | 带反斜杠转义的双引号Unicode\
    \ |\n| Boolean | true或false |\n| Array | 值的有序序列 |\n| Value | 可以是字符串、数字、true或false、null等\
    \ |\n| Object | 键值对的无序集合 |\n| Whitespace | 可以在任何一对标记之间使用 |\n| null | 空值 |\n\n\
    ### Number\n\n-   它是JavaScript中的双精度浮点数格式，具体取决于实现。\n-   不使用八进制和十六进制格式。\n-   数字中不使用NaN或Infinity。\n\
    \n下表显示了数字类型：\n\n| 类型 | 描述 |\n| :--- | :--- |\n| Integer | 数字1-9，0，正数或负数 |\n| Fraction\
    \ | 小数，如.3, .9 |\n| Exponent | 指数，如e, e+, e-, E, E+, E- |\n\n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_9_0.png)\n\
    \n### 语法\n\n```javascript\nvar json-object-name = {\"string\" : number_value,\
    \ ......}\n```\n\n### 示例\n\n展示数字数据类型的示例，值不应该加引号：\n\n```javascript\nvar obj = {\"\
    marks\": 97}\n```\n\n### String\n\n-   它是零个或多个带反斜杠转义的双引号Unicode字符的序列。\n-   字符是单个字符字符串，即长度为1的字符串。\n\
    \n下表显示了可以在JSON文档字符串中使用的各种特殊字符：\n\n| 类型 | 描述 |\n| :--- | :--- |\n| \" | 双引号 |\n\
    | \\ | 反斜杠 |\n| / | 正斜杠 |\n| b | 退格 |\n| f | 换页 |\n| n | 换行 |\n| r | 回车 |\n| t\
    \ | 水平制表符 |\n| u | 四个十六进制数字 |\n\n### 语法\n\n```javascript\nvar json-object-name\
    \ = { string : \"string value\", ......}\n```\n\n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_10_0.png)\n\
    \n### 示例\n\n展示字符串数据类型的示例：\n\n```javascript\nvar obj = {\"name\": \"Amit\"}\n```\n\
    \n### Boolean\n\n它包括true或false值。\n\n### 语法\n\n```javascript\nvar json-object-name\
    \ = { string : true/false, .......}\n```\n\n### 示例\n\n```javascript\nvar obj =\
    \ {\"name\": \"Amit\", \"marks\": 97, \"distinction\": true}\n```\n\n### Array\n\
    \n-   它是值的有序集合。\n-   它们被括在方括号中，这意味着数组以'['开始，以']'结束。\n-   值由','（逗号）分隔。\n-   数组索引可以从0或1开始。\n\
    -   当键名是连续的整数时，应该使用数组。\n\n### 语法\n\n```javascript\n[ value, .......]\n```\n\n\
    ### 示例\n\n展示包含多个对象的数组的示例：\n\n```json\n{\n  \"books\": [\n    { \"language\":\"\
    Java\" , \"edition\":\"second\" },\n    { \"language\":\"C++\" , \"lastName\"\
    :\"fifth\" },\n    { \"language\":\"C\" , \"lastName\":\"third\" }\n  ]\n}\n```\n\
    \n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_11_0.png)\n\n### Object\n\n-   它是名称/值对的无序集合。\n\
    -   对象被括在花括号中，即它以'{'开始，以'}'结束。\n-   每个名称后跟':'（冒号），键/值对由','（逗号）分隔。\n-   键必须是字符串，并且应该彼此不同。\n\
    -   当键名是任意字符串时，应该使用对象。\n\n### 语法\n\n```javascript\n{ string : value, ......}\n\
