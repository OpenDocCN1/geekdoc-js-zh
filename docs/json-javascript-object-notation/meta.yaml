- md: "## JSON\n\n## Parameters\n\n- **json_string**: It is an encoded string which\
    \ must be UTF-8 encoded data.\n- **assoc**: It is a boolean type parameter, when\
    \ set to TRUE, returned objects will be converted into associative arrays.\n-\
    \ **depth**: It is an integer type parameter which specifies recursion depth.\n\
    - **options**: It is an integer type bitmask of JSON decode, JSON_BIGINT_AS_STRING\
    \ is supported.\n\n## Example\n\nThe following example shows how PHP can be used\
    \ to decode JSON objects:\n\n```\n<?php\n$json = '{\"a\":1,\"b\":2,\"c\":3,\"\
    d\":4,\"e\":5}';\n\nvar_dump(json_decode($json));\nvar_dump(json_decode($json,\
    \ true));\n?>\n```\n\nWhile executing, it will produce the following result:\n\
    \n```\nobject(stdClass)#1 (5) {\n  [\"a\"] => int(1)\n  [\"b\"] => int(2)\n  [\"\
    c\"] => int(3)\n  [\"d\"] => int(4)\n  [\"e\"] => int(5)\n}\n\narray(5) {\n  [\"\
    a\"] => int(1)\n  [\"b\"] => int(2)\n  [\"c\"] => int(3)\n  [\"d\"] => int(4)\n\
    \  [\"e\"] => int(5)\n}\n```\n\n## 8. JSON – JSON with Perl\n\nThis chapter covers\
    \ how to encode and decode JSON objects using Perl programming language. Let's\
    \ start with preparing the environment to start our programming with Perl for\
    \ JSON.\n\n### Environment\n\nBefore you start encoding and decoding JSON using\
    \ Perl, you need to install JSON module, which can be obtained from CPAN. Once\
    \ you downloaded JSON-2.53.tar.gz or any other latest version, follow the steps\
    \ mentioned below:\n\n```\n$tar xvfz JSON-2.53.tar.gz\n$cd JSON-2.53\n$perl Makefile.PL\n\
    $make\n$make install\n```\n\n### JSON Functions\n\n| Function | Libraries |\n\
    | :--- | :--- |\n| encode_json | Converts the given Perl data structure to a UTF-8\
    \ encoded, binary string. |\n| decode_json | Decodes a JSON string. |\n| to_json\
    \ | Converts the given Perl data structure to a json string. |\n| from_json |\
    \ Expects a json string and tries to parse it, returning the resulting reference.\
    \ |\n| convert_blessed | Use this function with true value so that Perl can use\
    \ TO_JSON method on the object's class to convert an object into JSON. |\n\n###\
    \ Encoding JSON in Perl (encode_json)\n\nPerl encode_json() function converts\
    \ the given Perl data structure to a UTF-8 encoded, binary string.\n\nSyntax:\n\
    \n```\n$json_text = encode_json ($perl_scalar );\n\nor\n\n$json_text = JSON->new->utf8->encode($perl_scalar);\n\
    ```\n\nExample\n\nThe following example shows arrays under JSON with Perl:\n\n\
    ```\n#!/usr/bin/perl\nuse JSON;\n\nmy %rec_hash = ('a' => 1, 'b' => 2, 'c' =>\
    \ 3, 'd' => 4, 'e' => 5);\nmy $json = encode_json \\%rec_hash;\nprint \"$json\\\
    n\";\n```\n\nWhile executing, this will produce the following result:\n\n```\n\
    {\"e\":5,\"c\":3,\"a\":1,\"b\":2,\"d\":4}\n```\n\nThe following example shows\
    \ how Perl objects can be converted into JSON:\n\n```\n#!/usr/bin/perl\n\npackage\
    \ Emp;\nsub new\n{\n    my $class = shift;\n    my $self = {\n        name =>\
    \ shift,\n        hobbies  => shift,\n        birthdate  => shift,\n    };\n \
    \   bless $self, $class;\n    return $self;\n}\nsub TO_JSON { return { %{ shift()\
    \ } }; }\n\npackage main;\nuse JSON;\n\nmy $JSON  = JSON->new->utf8;\n$JSON->convert_blessed(1);\n\
    \n$e = new Emp( \"sachin\", \"sports\", \"8/5/1974 12:20:03 pm\");\n$json = $JSON->encode($e);\n\
    print \"$json\\n\";\n```\n\nOn executing, it will produce the following result:\n\
    \n```\n{\"birthdate\":\"8/5/1974 12:20:03 pm\",\"name\":\"sachin\",\"hobbies\"\
    :\"sports\"}\n```\n\n### Decoding JSON in Perl (decode_json)\n\nPerl decode_json()\
    \ function is used for decoding JSON in Perl. This function returns the value\
    \ decoded from json to an appropriate Perl type.\n\nSyntax:\n\n```\n$perl_scalar\
    \ = decode_json $json_text\n\nor\n\n$perl_scalar = JSON->new->utf8->decode($json_text)\n\
    ```\n\nExample\n\nThe following example shows how Perl can be used to decode JSON\
    \ objects. Here you will need to install Data::Dumper module if you already do\
    \ not have it on your machine.\n\n```\n#!/usr/bin/perl\nuse JSON;\nuse Data::Dumper;\n\
    \n$json = '{\"a\":1,\"b\":2,\"c\":3,\"d\":4,\"e\":5}';\n$text = decode_json($json);\n\
    print Dumper($text);\n```\n\nOn executing, it will produce following result:\n\
    \n```\n$VAR1 = {\n    'e' => 5,\n    'c' => 3,\n    'a' => 1,\n    'b' => 2,\n\
    \    'd' => 4\n};\n```\n\n## 9. JSON – JSON with Python\n\nThis chapter covers\
    \ how to encode and decode JSON objects using Python programming language. Let's\
    \ start with preparing the environment to start our programming with Python for\
    \ JSON.\n\n### Environment\n\nBefore you start with encoding and decoding JSON\
    \ using Python, you need to install any of the JSON modules available. For this\
    \ tutorial we have downloaded and installed Demjson (http://deron.meranda.us/python/demjson/)\
    \ as follows:\n\n```\n$tar xvfz demjson-1.6.tar.gz\n$cd demjson-1.6\n$python setup.py\
    \ install\n```\n\n### JSON Functions\n\n| Function | Libraries |\n| :--- | :---\
    \ |\n| encode | Encodes the Python object into a JSON string representation. |\n\
    | decode | Decodes a JSON-endoded string into a Python object. |\n\n### Encoding\
    \ JSON in Python (encode)\n\nPython encode() function encodes the Python object\
    \ into a JSON string representation.\n\nSyntax\n\n```\ndemjson.encode(self, obj,\
    \ nest_level=0)\n```\n\nExample\n\nThe following example shows arrays under JSON\
    \ with Python.\n\n```\n#!/usr/bin/python\nimport demjson\n\ndata = [ { 'a' : 1,\
    \ 'b' : 2, 'c' : 3, 'd' : 4, 'e' : 5 } ]\njson = demjson.encode(data)\nprint json\n\
    ```\n\nWhile executing, this will produce the following result:\n\n```\n[{\"a\"\
    :1,\"b\":2,\"c\":3,\"d\":4,\"e\":5}]\n```\n\n### Decoding JSON in Python (decode)\n\
    \nPython can use demjson.decode() function for decoding JSON. This function returns\
    \ the value decoded from json to an appropriate Python type.\n\nSyntax\n\n```\n\
    demjson.decode(self, txt)\n```\n\nExample\n\nThe following example shows how Python\
    \ can be used to decode JSON objects.\n\n```\n#!/usr/bin/python\nimport demjson\n\
    \njson = '{\"a\":1,\"b\":2,\"c\":3,\"d\":4,\"e\":5}';\n\ntext = demjson.decode(json)\n\
    print text\n```\n\nOn executing, it will produce the following result:\n\n```\n\
    {u'a': 1, u'c': 3, u'b': 2, u'e': 5, u'd': 4}\n```\n\n## 10. JSON – JSON with\
    \ Ruby\n\nThis chapter covers how to encode and decode JSON objects using Ruby\
    \ programming language. Let's start with preparing the environment to start our\
    \ programming with Ruby for JSON.\n\n### Environment\n\nBefore you start with\
    \ encoding and decoding JSON using Ruby, you need to install any of the JSON modules\
    \ available for Ruby. You may need to install Ruby gem, but if you are running\
    \ latest version of Ruby then you must have gem already installed on your machine,\
    \ otherwise let's follow the following single step assuming you already have gem\
    \ installed:\n\n```\n$gem install json\n```\n\n### Parsing JSON using Ruby\n\n\
    The following example shows that the first 2 keys hold string values and the last\
    \ 3 keys hold arrays of strings. Let's keep the following content in a file called\
    \ **input.json**.\n\n```\n{\n    \"President\": \"Alan Isaac\",\n    \"CEO\":\
    \ \"David Richardson\",\n\n    \"India\": [\n        \"Sachin Tendulkar\",\n \
    \       \"Virender Sehwag\",\n        \"Gautam Gambhir\",\n    ],\n\n    \"Srilanka\"\
    : [\n        \"Lasith Malinga\",\n        \"Angelo Mathews\",\n        \"Kumar\
    \ Sangakkara\"\n    ],\n\n    \"England\": [\n        \"Alastair Cook\",\n   \
    \     \"Jonathan Trott\",\n        \"Kevin Pietersen\"\n    ]\n}\n```\n\nGiven\
    \ below is a Ruby program that will be used to parse the above mentioned JSON\
    \ document:\n\n```\n#!/usr/bin/ruby\nrequire 'rubygems'\nrequire 'json'\nrequire\
    \ 'pp'\n\njson = File.read('input.json')\nobj = JSON.parse(json)\n\npp obj\n```\n\
    \nOn executing, it will produce the following result:\n\n```\n{\"President\"=>\"\
    Alan Isaac\",\n\"CEO\"=>\"David Richardson\",\n\n\"India\"=>\n [\"Sachin Tendulkar\"\
    , \"Virender Sehwag\", \"Gautam Gambhir\"],\n\n\"Srilanka\"=>\n [\"Lasith Malinga\
    \ \", \"Angelo Mathews\", \"Kumar Sangakkara\"],\n\n\"England\"=>\n [\"Alastair\
    \ Cook\", \"Jonathan Trott\", \"Kevin Pietersen\"]\n}\n```\n\n## 11. JSON – JSON\
    \ with Java\n\nThis chapter covers how to encode and decode JSON objects using\
    \ Java programming language. Let's start with preparing the environment to start\
    \ our programming with Java for JSON.\n\n### Environment\n\nBefore you start with\
    \ encoding and decoding JSON using Java, you need to install any of the JSON modules\
    \ available. For this tutorial we have downloaded and installed JSON.simple (https://code.google.com/p/json-simple/)\
    \ and have added the location of **json-simple-1.1.1.jar** file to the environment\
    \ variable CLASSPATH.\n\n### Mapping between JSON and Java entities\n\nJSON.simple\
    \ maps entities from the left side to the right side while decoding or parsing,\
    \ and maps entities from the right to the left while encoding.\n\n| JSON | Java\
    \ |\n| --- | --- |\n| string | java.lang.String |\n| number | java.lang.Number\
    \ |\n| true\\|false | java.lang.Boolean |\n| null | null |\n| array | java.util.List\
    \ |\n| object | java.util.Map |\n\nOn decoding, the default concrete class of\
    \ *java.util.List* is *org.json.simple.JSONArray* and the default concrete class\
    \ of *java.util.Map* is *org.json.simple.JSONObject*."
  mdcn: "\n## JSON\n\n## 参数\n\n-   **json_string**：这是一个编码字符串，必须是 UTF-8 编码的数据。\n- \
    \  **assoc**：这是一个布尔类型参数，当设置为 TRUE 时，返回的对象将被转换为关联数组。\n-   **depth**：这是一个整数类型参数，用于指定递归深度。\n\
    -   **options**：这是一个整数类型的 JSON 解码位掩码，支持 JSON_BIGINT_AS_STRING。\n\n## 示例\n\n以下示例展示了如何使用\
    \ PHP 来解码 JSON 对象：\n\n```\n<?php\n$json = '{\"a\":1,\"b\":2,\"c\":3,\"d\":4,\"\
    e\":5}';\n\nvar_dump(json_decode($json));\nvar_dump(json_decode($json, true));\n\
    ?>\n```\n\n执行时，将产生以下结果：\n\n```\nobject(stdClass)#1 (5) {\n  [\"a\"] => int(1)\n\
    \  [\"b\"] => int(2)\n  [\"c\"] => int(3)\n  [\"d\"] => int(4)\n  [\"e\"] => int(5)\n\
    }\n\narray(5) {\n  [\"a\"] => int(1)\n  [\"b\"] => int(2)\n  [\"c\"] => int(3)\n\
    \  [\"d\"] => int(4)\n  [\"e\"] => int(5)\n}\n```\n\n## 8. JSON – JSON 与 Perl\n\
    \n本章介绍如何使用 Perl 编程语言来编码和解码 JSON 对象。让我们从准备环境开始，以便使用 Perl 进行 JSON 编程。\n\n### 环境\n\
    \n在使用 Perl 编码和解码 JSON 之前，你需要安装 JSON 模块，可以从 CPAN 获取。下载 JSON-2.53.tar.gz 或任何其他最新版本后，请按照以下步骤操作：\n\
    \n```\n$tar xvfz JSON-2.53.tar.gz\n$cd JSON-2.53\n$perl Makefile.PL\n$make\n$make\
    \ install\n```\n\n### JSON 函数\n\n| 函数 | 库 |\n| :--- | :--- |\n| encode_json |\
    \ 将给定的 Perl 数据结构转换为 UTF-8 编码的二进制字符串。 |\n| decode_json | 解码 JSON 字符串。 |\n| to_json\
    \ | 将给定的 Perl 数据结构转换为 JSON 字符串。 |\n| from_json | 接收一个 JSON 字符串并尝试解析它，返回结果引用。 |\n\
    | convert_blessed | 使用此函数并设置为 true 值，以便 Perl 可以使用对象类上的 TO_JSON 方法将对象转换为 JSON。\
    \ |\n\n### 在 Perl 中编码 JSON (encode_json)\n\nPerl encode_json() 函数将给定的 Perl 数据结构转换为\
    \ UTF-8 编码的二进制字符串。\n\n语法：\n\n```\n$json_text = encode_json ($perl_scalar );\n\n\
    或\n\n$json_text = JSON->new->utf8->encode($perl_scalar);\n```\n\n示例\n\n以下示例展示了\
    \ JSON 与 Perl 中的数组：\n\n```\n#!/usr/bin/perl\nuse JSON;\n\nmy %rec_hash = ('a'\
    \ => 1, 'b' => 2, 'c' => 3, 'd' => 4, 'e' => 5);\nmy $json = encode_json \\%rec_hash;\n\
    print \"$json\\n\";\n```\n\n执行时，将产生以下结果：\n\n```\n{\"e\":5,\"c\":3,\"a\":1,\"b\"\
    :2,\"d\":4}\n```\n\n以下示例展示了如何将 Perl 对象转换为 JSON：\n\n```\n#!/usr/bin/perl\n\npackage\
    \ Emp;\nsub new\n{\n    my $class = shift;\n    my $self = {\n        name =>\
    \ shift,\n        hobbies  => shift,\n        birthdate  => shift,\n    };\n \
