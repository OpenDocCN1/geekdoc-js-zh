    \ \"JAVA\",\n  \"price\": 500\n}\n```\n\n### Whitespace\n\n它可以在任何一对标记之间插入。添加它可以提高代码的可读性。示例展示了有和没有空白符的声明：\n\
    \n### 语法\n\n```javascript\n{string: \"  \",....}\n```\n\n### 示例\n\n```javascript\n\
    var obj1 = {\"name\": \"Sachin Tendulkar\"}\nvar obj2 = {\"name\": \"SauravGanguly\"\
    }\n```\n\n### null\n\n它意味着空类型。\n\n### 语法\n\n```javascript\nnull\n```\n\n### 示例\n\
