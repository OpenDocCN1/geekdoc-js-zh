- md: "# About the Tutorial\n\nJSON or JavaScript Object Notation is a lightweight\
    \ text-based open standard designed for human-readable data interchange. The JSON\
    \ format was originally specified by Douglas Crockford, and is described in RFC\
    \ 4627. The official Internet media type for JSON is application/json. The JSON\
    \ filename extension is .json.\n\nThis tutorial will help you understand JSON\
    \ and its use within various programming languages such as PHP, PERL, Python,\
    \ Ruby, Java, etc.\n\n# Audience\n\nThis tutorial has been designed to help beginners\
    \ understand the basic functionality of JavaScript Object Notation (JSON) to develop\
    \ the data interchange format. After completing this tutorial, you will have a\
    \ good understanding of JSON and how to use it with JavaScript, Ajax, Perl, etc.\n\
    \n# Prerequisites\n\nBefore proceeding with this tutorial, you should have a basic\
    \ understanding of the web application's work over HTTP and we assume that you\
    \ have a basic knowledge of JavaScript.\n\n# Copyright & Disclaimer\n\n© Copyright\
    \ 2017 by Tutorials Point (I) Pvt. Ltd.\n\nAll the content and graphics published\
    \ in this e-book are the property of Tutorials Point (I) Pvt. Ltd. The user of\
    \ this e-book is prohibited to reuse, retain, copy, distribute or republish any\
    \ contents or a part of contents of this e-book in any manner without written\
    \ consent of the publisher.\n\nWe strive to update the contents of our website\
    \ and tutorials as timely and as precisely as possible, however, the contents\
    \ may contain inaccuracies or errors. Tutorials Point (I) Pvt. Ltd. provides no\
    \ guarantee regarding the accuracy, timeliness or completeness of our website\
    \ or its contents including this tutorial. If you discover any errors on our website\
    \ or in this tutorial, please notify us at contact@tutorialspoint.com\n\n# Table\
    \ of Contents\n\n- About the Tutorial\n- Audience\n- Prerequisites\n- Copyright\
    \ & Disclaimer\n- Table of Contents\n1. JSON – OVERVIEW\n   - Uses of JSON\n \
    \  - Characteristics of JSON\n   - Simple Example in JSON\n2. JSON – SYNTAX\n\
    3. JSON – DATATYPES\n   - Number\n   - String\n   - Boolean\n   - Array\n   -\
    \ Object\n   - Whitespace\n   - null\n   - JSON Value\n4. JSON – OBJECTS\n   -\
    \ Creating Simple Objects\n   - Creating Array Objects\n5. JSON – SCHEMA\n   -\
    \ JSON Schema Validation Libraries\n   - JSON Schema Example\n6. JSON – COMPARISON\
    \ WITH XML\n7. JSON – JSON WITH PHP\n   - Environment\n   - JSON Functions\n \
    \  - Encoding JSON in PHP (json_encode)\n   - Decoding JSON in PHP (json_decode)\n\
    8. JSON – JSON WITH PERL\n   - Environment\n   - JSON Functions\n   - Encoding\
    \ JSON in Perl (encode_json)\n   - Decoding JSON in Perl (decode_json)\n9. JSON\
    \ – JSON WITH PYTHON\n   - Environment\n   - JSON Functions\n   - Encoding JSON\
    \ in Python (encode)\n   - Decoding JSON in Python (decode)\n10. JSON – JSON WITH\
    \ RUBY\n    - Environment\n    - Parsing JSON using Ruby\n11. JSON – JSON WITH\
    \ JAVA\n    - Environment\n    - Mapping between JSON and Java entities\n    -\
    \ Encoding JSON in Java\n    - Decoding JSON in Java\n12. JSON – JSON WITH AJAX\n\
    \n# 1. JSON – Overview\n\nJSON or JavaScript Object Notation is a lightweight\
    \ text-based open standard designed for human-readable data interchange. Conventions\
    \ used by JSON are known to programmers, which include C, C++, Java, Python, Perl,\
    \ etc.\n\n- JSON stands for JavaScript Object Notation.\n- The format was specified\
    \ by Douglas Crockford.\n- It was designed for human-readable data interchange.\n\
    - It has been extended from the JavaScript scripting language.\n- The filename\
    \ extension is **.json**.\n- JSON Internet Media type is **application/json**.\n\
    - The Uniform Type Identifier is public.json.\n\n# Uses of JSON\n\n- It is used\
    \ while writing JavaScript based applications that includes browser extensions\
    \ and websites.\n- JSON format is used for serializing and transmitting structured\
    \ data over network connection.\n- It is primarily used to transmit data between\
    \ a server and web applications.\n- Web services and APIs use JSON format to provide\
    \ public data.\n- It can be used with modern programming languages.\n\n# Characteristics\
    \ of JSON\n\n- JSON is easy to read and write.\n- It is a lightweight text-based\
    \ interchange format.\n- JSON is language independent.\n\n# Simple Example in\
    \ JSON\n\nThe following example shows how to use JSON to store information related\
    \ to books based on their topic and edition.\n\n```\n{\n    \"book\": [\n    {\n\
    ```"
  mdcn: "\n# 关于本教程\n\nJSON 或 JavaScript 对象表示法（JavaScript Object Notation）是一种轻量级的、基于文本的开放标准，专为人类可读的数据交换而设计。JSON\
    \ 格式最初由道格拉斯·克罗克福特（Douglas Crockford）制定，并在 RFC 4627 中进行了描述。JSON 的官方互联网媒体类型是 `application/json`。JSON\
    \ 的文件名扩展名是 `.json`。\n\n本教程将帮助您了解 JSON 及其在各种编程语言（如 PHP、PERL、Python、Ruby、Java 等）中的使用。\n\
    \n# 目标读者\n\n本教程旨在帮助初学者理解 JavaScript 对象表示法（JSON）的基本功能，以开发数据交换格式。完成本教程后，您将对 JSON\
    \ 及其与 JavaScript、Ajax、Perl 等的使用有良好的理解。\n\n# 前提条件\n\n在继续学习本教程之前，您应该对 Web 应用程序通过\
    \ HTTP 的工作方式有基本的了解，并且我们假设您具备基本的 JavaScript 知识。\n\n# 版权声明与免责声明\n\n© 版权所有 2017 Tutorials\
    \ Point (I) Pvt. Ltd.\n\n本电子书发布的内容和图形均为 Tutorials Point (I) Pvt. Ltd. 的财产。未经出版商书面同意，本电子书用户不得以任何方式重用、保留、复制、分发或重新发布本电子书的任何内容或部分内容。\n\
    \n我们力求及时、准确地更新我们网站和教程的内容，但是，内容可能包含不准确或错误之处。Tutorials Point (I) Pvt. Ltd. 不对其网站或其内容（包括本教程）的准确性、及时性或完整性做任何保证。如果您在我们网站或本教程中发现任何错误，请通过\
    \ contact@tutorialspoint.com 通知我们。\n\n# 目录\n\n-   关于本教程\n-   目标读者\n-   前提条件\n\
    -   版权声明与免责声明\n-   目录\n1.  JSON – 概述\n    -   JSON 的用途\n    -   JSON 的特性\n   \
    \ -   JSON 简单示例\n2.  JSON – 语法\n3.  JSON – 数据类型\n    -   数字\n    -   字符串\n   \
    \ -   布尔值\n    -   数组\n    -   对象\n    -   空白字符\n    -   null\n    -   JSON 值\n\
    4.  JSON – 对象\n    -   创建简单对象\n    -   创建数组对象\n5.  JSON – 模式（Schema）\n    -  \
    \ JSON Schema 验证库\n    -   JSON Schema 示例\n6.  JSON – 与 XML 的比较\n7.  JSON – JSON\
    \ 与 PHP\n    -   环境\n    -   JSON 函数\n    -   在 PHP 中编码 JSON（json_encode）\n  \
    \  -   在 PHP 中解码 JSON（json_decode）\n8.  JSON – JSON 与 PERL\n    -   环境\n    -\
    \   JSON 函数\n    -   在 Perl 中编码 JSON（encode_json）\n    -   在 Perl 中解码 JSON（decode_json）\n\
    9.  JSON – JSON 与 PYTHON\n    -   环境\n    -   JSON 函数\n    -   在 Python 中编码 JSON（encode）\n\
    \    -   在 Python 中解码 JSON（decode）\n10. JSON – JSON 与 RUBY\n    -   环境\n    -\
    \   使用 Ruby 解析 JSON\n11. JSON – JSON 与 JAVA\n    -   环境\n    -   JSON 与 Java 实体之间的映射\n\
    \    -   在 Java 中编码 JSON\n    -   在 Java 中解码 JSON\n12. JSON – JSON 与 AJAX\n\n\
    # 1. JSON – 概述\n\nJSON 或 JavaScript 对象表示法（JavaScript Object Notation）是一种轻量级的、基于文本的开放标准，专为人类可读的数据交换而设计。JSON\
    \ 使用的约定为程序员所熟知，包括 C、C++、Java、Python、Perl 等。\n\n-   JSON 代表 JavaScript 对象表示法。\n\
    -   该格式由道格拉斯·克罗克福特（Douglas Crockford）制定。\n-   它是为人类可读的数据交换而设计的。\n-   它是从 JavaScript\
    \ 脚本语言扩展而来的。\n-   文件名扩展名是 **.json**。\n-   JSON 互联网媒体类型是 **application/json**。\n\
    -   统一类型标识符是 `public.json`。\n\n# JSON 的用途\n\n-   用于编写基于 JavaScript 的应用程序，包括浏览器扩展和网站。\n\
    -   JSON 格式用于通过网络连接序列化和传输结构化数据。\n-   它主要用于在服务器和 Web 应用程序之间传输数据。\n-   Web 服务和 API\
    \ 使用 JSON 格式来提供公共数据。\n-   它可以与现代编程语言一起使用。\n\n# JSON 的特性\n\n-   JSON 易于读写。\n- \
    \  它是一种轻量级的基于文本的交换格式。\n-   JSON 与语言无关。\n\n# JSON 简单示例\n\n以下示例展示了如何使用 JSON 存储与书籍主题和版本相关的信息。\n\
    \n```\n{\n    \"book\": [\n    {\n```\n"
