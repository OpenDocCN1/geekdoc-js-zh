    \n$e = new Emp( \"sachin\", \"sports\", \"8/5/1974 12:20:03 pm\");\n$json = $JSON->encode($e);\n\
    print \"$json\\n\";\n```\n\n执行后，将产生以下结果：\n\n```\n{\"birthdate\":\"8/5/1974 12:20:03\
    \ pm\",\"name\":\"sachin\",\"hobbies\":\"sports\"}\n```\n\n### 在 Perl 中解码 JSON\
    \ (decode_json)\n\nPerl decode_json() 函数用于在 Perl 中解码 JSON。此函数将从 JSON 解码的值返回为适当的\
    \ Perl 类型。\n\n语法：\n\n```\n$perl_scalar = decode_json $json_text\n\n或\n\n$perl_scalar\
    \ = JSON->new->utf8->decode($json_text)\n```\n\n示例\n\n以下示例展示了如何使用 Perl 来解码 JSON\
    \ 对象。如果您的机器上尚未安装 Data::Dumper 模块，则需要在此处安装它。\n\n```\n#!/usr/bin/perl\nuse JSON;\n\
    use Data::Dumper;\n\n$json = '{\"a\":1,\"b\":2,\"c\":3,\"d\":4,\"e\":5}';\n$text\
    \ = decode_json($json);\nprint Dumper($text);\n```\n\n执行后，将产生以下结果：\n\n```\n$VAR1\
    \ = {\n    'e' => 5,\n    'c' => 3,\n    'a' => 1,\n    'b' => 2,\n    'd' =>\
    \ 4\n};\n```\n\n## 9. JSON – JSON 与 Python\n\n本章介绍如何使用 Python 编程语言来编码和解码 JSON\
    \ 对象。让我们从准备环境开始，以便使用 Python 进行 JSON 编程。\n\n### 环境\n\n在使用 Python 编码和解码 JSON 之前，你需要安装任何可用的\
    \ JSON 模块。在本教程中，我们下载并安装了 Demjson (http://deron.meranda.us/python/demjson/)，步骤如下：\n\
    \n```\n$tar xvfz demjson-1.6.tar.gz\n$cd demjson-1.6\n$python setup.py install\n\
    ```\n\n### JSON 函数\n\n| 函数 | 库 |\n| :--- | :--- |\n| encode | 将 Python 对象编码为 JSON\
    \ 字符串表示形式。 |\n| decode | 将 JSON 编码的字符串解码为 Python 对象。 |\n\n### 在 Python 中编码 JSON\
    \ (encode)\n\nPython encode() 函数将 Python 对象编码为 JSON 字符串表示形式。\n\n语法\n\n```\ndemjson.encode(self,\
    \ obj, nest_level=0)\n```\n\n示例\n\n以下示例展示了 JSON 与 Python 中的数组。\n\n```\n#!/usr/bin/python\n\
    import demjson\n\ndata = [ { 'a' : 1, 'b' : 2, 'c' : 3, 'd' : 4, 'e' : 5 } ]\n\
    json = demjson.encode(data)\nprint json\n```\n\n执行时，将产生以下结果：\n\n```\n[{\"a\":1,\"\
    b\":2,\"c\":3,\"d\":4,\"e\":5}]\n```\n\n### 在 Python 中解码 JSON (decode)\n\nPython\
    \ 可以使用 demjson.decode() 函数来解码 JSON。此函数将从 JSON 解码的值返回为适当的 Python 类型。\n\n语法\n\n\
    ```\ndemjson.decode(self, txt)\n```\n\n示例\n\n以下示例展示了如何使用 Python 来解码 JSON 对象。\n\
    \n```\n#!/usr/bin/python\nimport demjson\n\njson = '{\"a\":1,\"b\":2,\"c\":3,\"\
    d\":4,\"e\":5}';\n\ntext = demjson.decode(json)\nprint text\n```\n\n执行后，将产生以下结果：\n\
    \n```\n{u'a': 1, u'c': 3, u'b': 2, u'e': 5, u'd': 4}\n```\n\n## 10. JSON – JSON\
    \ 与 Ruby\n\n本章介绍如何使用 Ruby 编程语言来编码和解码 JSON 对象。让我们从准备环境开始，以便使用 Ruby 进行 JSON 编程。\n\
    \n### 环境\n\n在使用 Ruby 编码和解码 JSON 之前，你需要为 Ruby 安装任何可用的 JSON 模块。你可能需要安装 Ruby gem，但如果你运行的是最新版本的\
    \ Ruby，那么你的机器上一定已经安装了 gem，否则请按照以下单步操作（假设你已安装 gem）：\n\n```\n$gem install json\n\
    ```\n\n### 使用 Ruby 解析 JSON\n\n以下示例显示前 2 个键保存字符串值，后 3 个键保存字符串数组。让我们将以下内容保存在名为 **input.json**\
    \ 的文件中。\n\n```\n{\n    \"President\": \"Alan Isaac\",\n    \"CEO\": \"David Richardson\"\
    ,\n\n    \"India\": [\n        \"Sachin Tendulkar\",\n        \"Virender Sehwag\"\
    ,\n        \"Gautam Gambhir\",\n    ],\n\n    \"Srilanka\": [\n        \"Lasith\
    \ Malinga\",\n        \"Angelo Mathews\",\n        \"Kumar Sangakkara\"\n    ],\n\
    \n    \"England\": [\n        \"Alastair Cook\",\n        \"Jonathan Trott\",\n\
    \        \"Kevin Pietersen\"\n    ]\n}\n```\n\n下面是一个 Ruby 程序，用于解析上述 JSON 文档：\n\
    \n```\n#!/usr/bin/ruby\nrequire 'rubygems'\nrequire 'json'\nrequire 'pp'\n\njson\
    \ = File.read('input.json')\nobj = JSON.parse(json)\n\npp obj\n```\n\n执行后，将产生以下结果：\n\
    \n```\n{\"President\"=>\"Alan Isaac\",\n\"CEO\"=>\"David Richardson\",\n\n\"India\"\
    =>\n [\"Sachin Tendulkar\", \"Virender Sehwag\", \"Gautam Gambhir\"],\n\n\"Srilanka\"\
    =>\n [\"Lasith Malinga \", \"Angelo Mathews\", \"Kumar Sangakkara\"],\n\n\"England\"\
    =>\n [\"Alastair Cook\", \"Jonathan Trott\", \"Kevin Pietersen\"]\n}\n```\n\n\
    ## 11. JSON – JSON 与 Java\n\n本章介绍如何使用 Java 编程语言来编码和解码 JSON 对象。让我们从准备环境开始，以便使用\
    \ Java 进行 JSON 编程。\n\n### 环境\n\n在使用 Java 编码和解码 JSON 之前，你需要安装任何可用的 JSON 模块。在本教程中，我们下载并安装了\
    \ JSON.simple (https://code.google.com/p/json-simple/)，并将 **json-simple-1.1.1.jar**\
    \ 文件的位置添加到环境变量 CLASSPATH 中。\n\n### JSON 与 Java 实体之间的映射\n\nJSON.simple 在解码或解析时将实体从左侧映射到右侧，在编码时将实体从右侧映射到左侧。\n\
