    \ value. |\n| exclusiveMaximum | If \"exclusiveMaximum\" is present and has boolean\
    \ value true, the instance is valid if it is strictly lower than the value of\
    \ \"maximum\". |\n| multipleOf | A numeric instance is valid against \"multipleOf\"\
    \ if the result of the division of the instance by this keyword's value is an\
    \ integer. |\n| maxLength | The length of a string instance is defined as the\
    \ maximum number of its characters. |\n| minLength | The length of a string instance\
    \ is defined as the minimum number of its characters. |\n| pattern | A string\
    \ instance is considered valid if the regular expression matches the instance\
    \ successfully. |\n\n15\n\n![img/dfcbe7259b4ea609a027cf7c8440bcf5_19_0.png](img/dfcbe7259b4ea609a027cf7c8440bcf5_19_0.png)\n\
    \n## JSON\n\nYou can check a http://json-schema.org for the complete list of keywords\
