    # # 8. JSON – JSON with Perl


    This chapter covers how to encode and decode JSON objects using Perl programming
    language. Let''s start with preparing the environment to start our programming
    with Perl for JSON.


    # ## Environment


    Before you start encoding and decoding JSON using Perl, you need to install JSON
    module, which can be obtained from CPAN. Once you downloaded JSON-2.53.tar.gz
    or any other latest version, follow the steps mentioned below:


    ```

    $tar xvfz JSON-2.53.tar.gz

    $cd JSON-2.53

    $perl Makefile.PL

    $make

    $make install

    ```


    # ## JSON Functions


    | Function | Libraries |

    | :--- | :--- |

    | encode_json | Converts the given Perl data structure to a UTF-8 encoded, binary
    string. |

    | decode_json | Decodes a JSON string. |

    | to_json | Converts the given Perl data structure to a json string. |

    | from_json | Expects a json string and tries to parse it, returning the resulting
    reference. |

    | convert_blessed | Use this function with true value so that Perl can use TO_JSON
    method on the object''s class to convert an object into JSON. |


    ![](img/dfcbe7259b4ea609a027cf7c8440bcf5_25_0.png)'
  - "[PAGE 26]\n\nJSON\n\n# Encoding JSON in Perl (encode_json)\n\nPerl encode_json()\
    \ function converts the given Perl data structure to a UTF-8 encoded, binary string.\n\
    \nSyntax:\n\n```\n$json_text = encode_json ($perl_scalar );\n\nor\n\n$json_text\
    \ = JSON->new->utf8->encode($perl_scalar);\n```\n\nExample\n\nThe following example\
    \ shows arrays under JSON with Perl:\n\n```\n#!/usr/bin/perl\nuse JSON;\n\nmy\
    \ %rec_hash = ('a' => 1, 'b' => 2, 'c' => 3, 'd' => 4, 'e' => 5);\nmy $json =\
    \ encode_json \\%rec_hash;\nprint \"$json\\n\";\n```\n\nWhile executing, this\
    \ will produce the following result:\n\n```\n{\"e\":5,\"c\":3,\"a\":1,\"b\":2,\"\
    d\":4}\n```\n\nThe following example shows how Perl objects can be converted into\
    \ JSON:\n\n```\n#!/usr/bin/perl\n\npackage Emp;\nsub new\n{\n    my $class = shift;\n\
    \    my $self = {\n        name => shift,\n        hobbies  => shift,\n      \
    \  birthdate  => shift,\n    };\n    bless $self, $class;\n}\n```"
