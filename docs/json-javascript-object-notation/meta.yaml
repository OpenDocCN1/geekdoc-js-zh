    # # 11. JSON – JSON with Java


    This chapter covers how to encode and decode JSON objects using Java programming
    language. Let''s start with preparing the environment to start our programming
    with Java for JSON.


    # ## Environment


    Before you start with encoding and decoding JSON using Java, you need to install
    any of the JSON modules available. For this tutorial we have downloaded and installed
    JSON.simple (https://code.google.com/p/json-simple/) and have added the location
    of **json-simple-1.1.1.jar** file to the environment variable CLASSPATH.


    # ## Mapping between JSON and Java entities


    JSON.simple maps entities from the left side to the right side while decoding
    or parsing, and maps entities from the right to the left while encoding.


    | JSON | Java |

    | --- | --- |

    | string | java.lang.String |

    | number | java.lang.Number |

    | true|false | ava.lang.Boolean |

    | null | null |

    | array | java.util.List |

    | object | java.util.Map |


    On decoding, the default concrete class of *java.util.List* is *org.json.simple.JSONArray*
    and the default concrete class of *java.util.Map* is *org.json.simple.JSONObject*.'
- md: "## Encoding JSON in Java\n\nFollowing is a simple example to encode a JSON\
    \ object using Java JSONObject which is a subclass of java.util.HashMap. No ordering\
    \ is provided. If you need the strict ordering of elements, use JSONValue.toJSONString\
    \ (map) method with ordered map implementation such as java.util.LinkedHashMap.\n\
    \n```java\nimport org.json.simple.JSONObject;\n\nclass JsonEncodeDemo\n{\n   \
    \ public static void main(String[] args)\n    {\n        JSONObject obj = new\
    \ JSONObject();\n\n        obj.put(\"name\", \"foo\");\n        obj.put(\"num\"\
    , new Integer(100));\n        obj.put(\"balance\", new Double(1000.21));\n   \
    \     obj.put(\"is_vip\", new Boolean(true));\n\n        System.out.print(obj);\n\
    \    }\n}\n```\n\nOn compiling and executing the above program the following result\
    \ will be generated:\n\n```json\n{\"balance\": 1000.21, \"num\":100, \"is_vip\"\
    :true, \"name\":\"foo\"}\n```\n\nFollowing is another example that shows a JSON\
    \ object streaming using Java JSONObject:\n\n```java\nimport org.json.simple.JSONObject;\n\
    \nclass JsonEncodeDemo\n{\n    public static void main(String[] args)\n    {\n\
    \        JSONObject obj = new JSONObject();\n\n        obj.put(\"name\",\"foo\"\
    );\n        obj.put(\"num\",new Integer(100));\n        obj.put(\"balance\",new\
    \ Double(1000.21));\n        obj.put(\"is_vip\",new Boolean(true));\n\n      \
    \  StringWriter out = new StringWriter();\n        obj.writeJSONString(out);\n\
    \n        String jsonText = out.toString();\n        System.out.print(jsonText);\n\
    \    }\n}\n```\n\nOn compiling and executing the above program the following result\
    \ is generated:\n\n```json\n{\"balance\": 1000.21, \"num\":100, \"is_vip\":true,\
    \ \"name\":\"foo\"}\n```\n\n## Decoding JSON in Java\n\nThe following example\
    \ makes use of **JSONObject** and **JSONArray** where JSONObject is a java.util.Map\
    \ and JSONArray is a java.util.List, so you can access them with standard operations\
    \ of Map or List.\n\n```java\nimport org.json.simple.JSONObject;\nimport org.json.simple.JSONArray;\n\
    import org.json.simple.parser.ParseException;\nimport org.json.simple.parser.JSONParser;\n\
    \nclass JsonDecodeDemo\n{\n    public static void main(String[] args)\n    {\n\
    \        JSONParser parser=new JSONParser();\n        String s = \"[0,{\\\"1\\\
    \":{\\\"2\\\":{\\\"3\\\":{\\\"4\\\":[5,{\\\"6\\\":7}]}}}}]\";\n        try{\n\
    \            Object obj = parser.parse(s);\n            JSONArray array = (JSONArray)obj;\n\
    \            System.out.println(\"The 2nd element of array\");\n            System.out.println(array.get(1));\n\
    \            System.out.println();\n\n            JSONObject obj2 = (JSONObject)array.get(1);\n\
    \            System.out.println(\"Field \\\"1\\\"\");\n            System.out.println(obj2.get(\"\
    1\"));\n\n            s = \"{}\";\n            obj = parser.parse(s);\n      \
    \      System.out.println(obj);\n\n            s= \"[5,]\";\n            obj =\
    \ parser.parse(s);\n            System.out.println(obj);\n\n            s= \"\
    [5,,2]\";\n            obj = parser.parse(s);\n            System.out.println(obj);\n\
    \        }catch(ParseException pe){\n            System.out.println(\"position:\
    \ \" + pe.getPosition());\n            System.out.println(pe);\n        }\n  \
    \  }\n}\n```\n\nOn compiling and executing the above program, the following result\
    \ will be generated:\n\n```\nThe 2nd element of array\n{\"1\":{\"2\":{\"3\":{\"\
    4\":[5,{\"6\":7}]}}}}\n\nField \"1\"\n{\"2\":{\"3\":{\"4\":[5,{\"6\":7}]}}}\n\
    {}\n[5]\n[5,2]\n```\n\n## 12. JSON – JSON with Ajax\n\nAJAX is Asynchronous JavaScript\
    \ and XML, which is used on the client side as a group of interrelated web development\
    \ techniques, in order to create asynchronous web applications. According to the\
    \ AJAX model, web applications can send and retrieve data from a server asynchronously\
    \ without interfering with the display and the behavior of the existing page.\n\
    \nMany developers use JSON to pass AJAX updates between the client and the server.\
    \ Websites updating live sports scores can be considered as an example of AJAX.\
    \ If these scores have to be updated on the website, then they must be stored\
    \ on the server so that the webpage can retrieve the score when it is required.\
    \ This is where we can make use of JSON formatted data.\n\nAny data that is updated\
    \ using AJAX can be stored using the JSON format on the web server. AJAX is used\
    \ so that JavaScript can retrieve these JSON files when necessary, parse them,\
    \ and perform one of the following operations:\n\n- Store the parsed values in\
    \ the variables for further processing before displaying them on the webpage.\n\
    - It directly assigns the data to the DOM elements in the webpage, so that they\
    \ are displayed on the website.\n\n**Example**\nThe following code shows JSON\
    \ with AJAX. Save it as **ajax.htm** file. Here the loading function loadJSON()\
    \ is used asynchronously to upload JSON data.\n\n```html\n<html>\n<head>\n<meta\
    \ content=\"text/html; charset=ISO-8859-1\" http-equiv=\"content-type\">\n<script\
    \ type=\"application/javascript\">\nfunction loadJSON()\n{\n    var data_file\
    \ = \"http://www.tutorialspoint.com/json/data.json\";\n    var http_request =\
    \ new XMLHttpRequest();\n    try{\n        // Opera 8.0+, Firefox, Chrome, Safari\n\
    \        http_request = new XMLHttpRequest();\n    }catch (e){\n        // Internet\
    \ Explorer Browsers\n        try{\n            http_request = new ActiveXObject(\"\
    Msxml2.XMLHTTP\");\n        }catch (e) {\n            try{\n                http_request\
    \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n            }catch (e) {\n    \
    \            window.alert(\"Something bad is going on....\");\n            }\n\
    \        }\n    }\n}\n</script>\n<title>tutorialspoint.com JSON</title>\n</head>\n\
    <body>\n<h1>Cricketer Details</h1>\n<table class=\"src\">\n<tr><th>Name</th><th>Country</th></tr>\n\
    <tr><td><div id=\"Name\">Sachin</div></td>\n<td><div id=\"Country\">India</div></td></tr>\n\
    </table>\n\n<div class=\"central\">\n<button type=\"button\" onclick=\"loadJSON()\"\
    >Update Details </button>\n</div>\n</body>\n</html>\n```\n\nGiven below is the\
    \ input file **data.json**, having data in JSON format which will be uploaded\
    \ asynchronously when we click the **Update Detail** button. This file is being\
    \ kept in http://www.tutorialspoint.com/json/.\n\n```json\n{\"name\": \"brett\"\
    , \"country\": \"Australia\"}\n```\n\nThe above HTML code will generate the following\
    \ screen, where you can check AJAX in action:\n\n# Cricketer Details\n\n| Name\
    \ | Country |\n| --- | --- |\n| Sachin | India |\n\n# Update Details:\n\nWhen\
    \ you click on the **Update Detail** button, you should get a result something\
    \ as follows. You can try JSON with AJAX yourself, provided your browser supports\
    \ Javascript.\n\n# Cricketer Details\n\n| Name | Country |\n| --- | --- |\n| Brett\
    \ | Australia |"
  mdcn: "\n## 在Java中编码JSON\n\n以下是一个简单的示例，展示了如何使用Java JSONObject（它是java.util.HashMap的子类）来编码一个JSON对象。此方法不保证元素的顺序。如果需要严格保证元素顺序，请使用`JSONValue.toJSONString(map)`方法，并配合有序映射实现，如`java.util.LinkedHashMap`。\n\
    \n```java\nimport org.json.simple.JSONObject;\n\nclass JsonEncodeDemo\n{\n   \
    \ public static void main(String[] args)\n    {\n        JSONObject obj = new\
    \ JSONObject();\n\n        obj.put(\"name\", \"foo\");\n        obj.put(\"num\"\
    , new Integer(100));\n        obj.put(\"balance\", new Double(1000.21));\n   \
    \     obj.put(\"is_vip\", new Boolean(true));\n\n        System.out.print(obj);\n\
    \    }\n}\n```\n\n编译并执行上述程序后，将产生以下结果：\n\n```json\n{\"balance\": 1000.21, \"num\"\
    :100, \"is_vip\":true, \"name\":\"foo\"}\n```\n\n以下是另一个示例，展示了如何使用Java JSONObject进行JSON对象流处理：\n\
    \n```java\nimport org.json.simple.JSONObject;\n\nclass JsonEncodeDemo\n{\n   \
    \ public static void main(String[] args)\n    {\n        JSONObject obj = new\
    \ JSONObject();\n\n        obj.put(\"name\",\"foo\");\n        obj.put(\"num\"\
    ,new Integer(100));\n        obj.put(\"balance\",new Double(1000.21));\n     \
    \   obj.put(\"is_vip\",new Boolean(true));\n\n        StringWriter out = new StringWriter();\n\
    \        obj.writeJSONString(out);\n\n        String jsonText = out.toString();\n\
    \        System.out.print(jsonText);\n    }\n}\n```\n\n编译并执行上述程序后，将产生以下结果：\n\n\
    ```json\n{\"balance\": 1000.21, \"num\":100, \"is_vip\":true, \"name\":\"foo\"\
    }\n```\n\n## 在Java中解码JSON\n\n以下示例使用了**JSONObject**和**JSONArray**，其中JSONObject是一个java.util.Map，JSONArray是一个java.util.List，因此你可以使用Map或List的标准操作来访问它们。\n\
    \n```java\nimport org.json.simple.JSONObject;\nimport org.json.simple.JSONArray;\n\
    import org.json.simple.parser.ParseException;\nimport org.json.simple.parser.JSONParser;\n\
    \nclass JsonDecodeDemo\n{\n    public static void main(String[] args)\n    {\n\
    \        JSONParser parser=new JSONParser();\n        String s = \"[0,{\\\"1\\\
    \":{\\\"2\\\":{\\\"3\\\":{\\\"4\\\":[5,{\\\"6\\\":7}]}}}}]\";\n        try{\n\
    \            Object obj = parser.parse(s);\n            JSONArray array = (JSONArray)obj;\n\
    \            System.out.println(\"数组的第二个元素\");\n            System.out.println(array.get(1));\n\
    \            System.out.println();\n\n            JSONObject obj2 = (JSONObject)array.get(1);\n\
    \            System.out.println(\"字段 \\\"1\\\"\");\n            System.out.println(obj2.get(\"\
    1\"));\n\n            s = \"{}\";\n            obj = parser.parse(s);\n      \
    \      System.out.println(obj);\n\n            s= \"[5,]\";\n            obj =\
    \ parser.parse(s);\n            System.out.println(obj);\n\n            s= \"\
    [5,,2]\";\n            obj = parser.parse(s);\n            System.out.println(obj);\n\
    \        }catch(ParseException pe){\n            System.out.println(\"位置: \" +\
    \ pe.getPosition());\n            System.out.println(pe);\n        }\n    }\n\
    }\n```\n\n编译并执行上述程序后，将产生以下结果：\n\n```\n数组的第二个元素\n{\"1\":{\"2\":{\"3\":{\"4\":[5,{\"\
    6\":7}]}}}}\n\n字段 \"1\"\n{\"2\":{\"3\":{\"4\":[5,{\"6\":7}]}}}\n{}\n[5]\n[5,2]\n\
    ```\n\n## 12. JSON – 结合Ajax使用JSON\n\nAJAX是Asynchronous JavaScript and XML（异步JavaScript和XML）的缩写，它在客户端作为一组相互关联的Web开发技术使用，以创建异步Web应用程序。根据AJAX模型，Web应用程序可以异步地从服务器发送和检索数据，而不会干扰现有页面的显示和行为。\n\
    \n许多开发者使用JSON在客户端和服务器之间传递AJAX更新数据。实时更新体育赛事比分的网站可以被视为AJAX的一个例子。如果这些比分必须在网站上更新，那么它们必须存储在服务器上，以便网页在需要时可以检索比分。这正是我们可以利用JSON格式化数据的地方。\n\
    \n任何使用AJAX更新的数据都可以使用JSON格式存储在Web服务器上。使用AJAX是为了让JavaScript能够在必要时检索这些JSON文件，解析它们，并执行以下操作之一：\n\
    \n- 在将解析后的值显示在网页上之前，将其存储在变量中以进行进一步处理。\n- 它直接将数据分配给网页中的DOM元素，使它们显示在网站上。\n\n**示例**\n\
    以下代码展示了如何结合使用JSON与AJAX。将其保存为**ajax.htm**文件。这里，加载函数`loadJSON()`被异步地用于上传JSON数据。\n\
    \n```html\n<html>\n<head>\n<meta content=\"text/html; charset=ISO-8859-1\" http-equiv=\"\
    content-type\">\n<script type=\"application/javascript\">\nfunction loadJSON()\n\
