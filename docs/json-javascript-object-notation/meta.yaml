  md: "# 1. JSON – Overview\n\nJSON or JavaScript Object Notation is a lightweight\
    \ text-based open standard designed for human-readable data interchange. Conventions\
    \ used by JSON are known to programmers, which include C, C++, Java, Python, Perl,\
    \ etc.\n\n+   - JSON stands for JavaScript Object Notation.\n- The format was\
    \ specified by Douglas Crockford.\n- It was designed for human-readable data interchange.\n\
    - It has been extended from the JavaScript scripting language.\n- The filename\
    \ extension is **.json**.\n- JSON Internet Media type is **application/json**.\n\
    - The Uniform Type Identifier is public.json.\n\n# Uses of JSON\n\n+   - It is\
    \ used while writing JavaScript based applications that includes browser extensions\
    \ and websites.\n- JSON format is used for serializing and transmitting structured\
    \ data over network connection.\n- It is primarily used to transmit data between\
    \ a server and web applications.\n- Web services and APIs use JSON format to provide\
    \ public data.\n- It can be used with modern programming languages.\n\n# Characteristics\
    \ of JSON\n\n+   - JSON is easy to read and write.\n- It is a lightweight text-based\
    \ interchange format.\n- JSON is language independent.\n\n# Simple Example in\
    \ JSON\n\nThe following example shows how to use JSON to store information related\
    \ to books based on their topic and edition.\n\n```\n{\n    \"book\": [\n    {\n\
    ```\n\n![](img/dfcbe7259b4ea609a027cf7c8440bcf5_5_0.png)"
