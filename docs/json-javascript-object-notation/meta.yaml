    As of PHP 5.2.0, the JSON extension is bundled and compiled into PHP by default.


    # JSON Functions


    | Function | Libraries |

    | --- | --- |

    | json_encode | Returns the JSON representation of a value. |

    | json_decode | Decodes a JSON string. |

    | json_last_error | Returns the last error occurred. |


    # Encoding JSON in PHP (json_encode)


    PHP json_encode() function is used for encoding JSON in PHP. This function returns
    the JSON representation of a value on success or FALSE on failure.


    # Syntax


    ```

    string json_encode ( $value [, $options = 0 ] )

    ```


    # Parameters


    +   - **value**: The value being encoded. This function only works with UTF-8
    encoded data.

    - **options**: This optional value is a bitmask consisting of JSON_HEX_QUOT, JSON_HEX_TAG,
    JSON_HEX_AMP, JSON_HEX_APOS, JSON_NUMERIC_CHECK,JSON_PRETTY_PRINT, JSON_UNESCAPED_SLASHES,
    JSON_FORCE_OBJECT.'
