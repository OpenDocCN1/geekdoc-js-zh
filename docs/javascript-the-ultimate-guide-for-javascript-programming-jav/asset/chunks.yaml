    # 引言


    在这一代，计算机似乎不再令人令畏了。它们现在正成为我们日常的工具之一——让我们让事情变得简单且高效。尽管今天最新的计算机操作对用户非常友好，但仍然存在许多隐藏的复杂性。大多数人会发现它们很难理解。因此，这本书是为那些想要以最简单的方式发现计算机最大潜力的人而编写的。


    为了实现这一点，你必须记住通信是计算机过程的一个至关重要的部分。这并不是计算机之间的过程，而是键盘后的用户与运行机器之间的过程。基本元素当然是语言。学习像
    `C` 这样的语言将让你能够按照你想要以及你要求的方式命令机器。


    在书中，你将学习计算机最重要的语言之一——`JavaScript`。


    ## 编程简述


    在学习 `JavaScript` 之前，首先理解什么是编程至关重要。


    计算机程序可以是任何东西。你用来阅读这本电子书的软件是一个程序。你使用的浏览器浏览器是一个程序。播放音乐文件的应用程序是一个程序。你玩的游戏是一个程序。换句话说，你在计算机中看到和使用的一切都是程序。这一切都是一个被称为“编程”的单一过程的产物。


    ![Computer-Programming2(images/00005.jpeg


    编程是一艺术。程序员在这里输入一段文本，命令计算机执行特定的操作。让我们以人体作为类比。


    如果你被给你一个数学题来解决，你的大脑必须处理它。根据方程的规模，你可能会发现自己正在数手指或在纸上解公式。简而言之，有几种身体功能在工作。


    从编程的角度来看，所有这些身体功能都是程序，你的整个身体就是机器。你大脑的机械对应物是机器内存。方程就是我们要处理的数据。


    我们这里的主要目标是处理数据。在上面的场景中，那就是得到数学题的正确答案。为了让我们身体能够做到这一点，你的眼睛需要看到问题并将其传递给大脑。对于机器，你需要一个程序将该信号传递到计算机内存中。


    回到人体，你的眼睛需要看到问题并将其传递给大脑。对于机器，你需要一个程序将该信号传递到计算机内存中。


    ## 介绍 JavaScript


    ![javascript(images/00006.jpeg)


    在一切之前，你可能已经熟悉另一种名为 `Java` 的编程语言。记住 `JavaScript` 和 `Java` 之间几乎没有任何关系。


    `JavaScript` 最初被名为 `Mocha`，创建于 1995 年 5 月。它是 `Brendan Eich` 在当时工作于 `Netscape`
    时十天艰苦工作的成果。`Mocha` 这个名字是由 `Netscape` 的 `Marc Andreessen` 定的。


    在同年 9 月，语言的名字更改为 `LiveScript`。同年 12 月，在获得 `Sun` 的商标许可后，名称再次更改为 `JavaScript`。显然，这是一个营销手段，因为当时
    `Java` 语言正在大力推广并变得越来越流行。


    今天，`JavaScript` 是初学者可以轻松学会的编程语言之一。它是网页开发者除了 `CSS` 和 `HTML` 之外必学习语言。网页开发者使用 `HTML`
    定义网页内容。使用 `CSS` 指定网页布局。最后，他们使用 `JavaScript` 编写网站的行为。因此，`JavaScript` 被认为 Web 的编程语言。


    尽管 `JavaScript` 的理念是为初学者提供更简单的编程领域，但该语言提供的灵活性对资深程序员也有巨大的优势。它为在更僵化的编程语言中无法实现的编程技术提供了大量的空间。你将在本书后面看到更多此类技术。


    程序在正确编写时是美的。


    ## 你在书中可以找到什么？


    这本书是《简单英语学 JavaScript》系列的第一部分。该部分包含 3 章。第一章将向你介绍值以及如何在 `JavaScript` 语言中处理这些值。你将学习使用运算符、比较符以及创建字符串。第二章讨论变量。在这一章中，你将学习向变量赋值。你还将学习如何通过组合多个变量创建多变的信息。最后一章讨论
    `JavaScript` 源文件的创建。在这一章中，你将学习如何正确地在源文件中编写 `JavaScript` 代码。你还将学习如何在 `HTML` 文件中执行此文件。


