- fmt: '

    The `The JavaScript in Simple Words` book series were divided into several parts
    to help you master the programming language without being overwhelmed. Many beginners
    quitted because they thought that JavaScript is too much to handle. The entire
    series aims to bring you right to the heart of JavaScript in the simplest way
    possible.


    # Chapter 1 – Getting to Know Numbers, Operators, and Strings


    Browsing the internet alone gives you access to millions of lines of JavaScript
    codes. The moment you start your favorite internet browser (e.g. Google Chrome,
    Mozilla Firefox, and Internet Explorer) and began to visit a certain website,
    you are already communicating using the JavaScript language.


    In this chapter, we will be discussing the fundamental building blocks of JavaScript
    language. This will help you establish a concrete foundation once you move on
    to advanced frameworks like `jQuery`.


    You will learn more about numbers, operators, and strings. This chapter will also
    cover the different processes for you to manipulate values using operators and
    how can you store these values inside variables. Lastly, you will also learn how
    to create, run, and find JavaScript codes within HTML codes.


    ## The Console


    Before anything else, it is vital for you to have access to the web browser console.
    The web browser console serves as one of the developer’s tools. It logs information
    associated with the current web page. The information includes CSS, security errors,
    and JavaScript. The console will also allow you to engage with the web page by
    asserting JavaScript expressions.


    This is where we will be executing our sample JavaScript codes within the book.
    You can access it by pressing `F12` key on your keyboard. Look for the `Console`
    tab and you are now ready to begin.


    ![c8SPG](images/00007.jpeg)


    ## Basic Numbers and Prompt


    There are 2 symbols you need to familiarize as you begin to learn JavaScript:


    - `>` The greater than symbol; and,

    - `→` The arrow symbol


    The `>` symbol represents the JavaScript prompt. All the codes we want to enter
    into the console will be written after this symbol. The `→` symbol refers to the
    result produced by the code we entered.


    In JavaScript language, numbers are automatically recognized. Writing the number
    after the prompt and hitting the Enter key on your keyboard will give you the
    same value as a result. Try to enter number `13` into the console and it will
    show the same value in return.


    | `> 13→` `13` |


    The same goes with numbers that have decimal values.


    | `> 13.29→` `13.29` |


    ## Operators


    In JavaScript, mathematical operations are also acceptable. The operations commonly
    used in JavaScript syntax are the following:


    - Addition

    - Subtraction

    - Multiplication

    - Division

    - Modulus


    Addition is expressed through the `+` sign.


    | `> 1 + 3→` `4` |


    Subtraction is expressed through the `–` sign.


    | `> 10 – 5→` `5` |


    Multiplication is expressed through the `*` sign.


    | `> 2 * 9→` `18` |


    Division is expressed through the `/` sign.


    | `> 25 / 5→` `5` |


    Modulus, on the other hand, is a special operation in JavaScript language. It
    is expressed through the `%` sign. The result you’ll get is the remainder between
    the two numbers after dividing them.


    | `> 23 % 2→` `1` |


    In the modulus example above, the console divides `23` by `2`. Even if it goes
    `11` times in the number `23`, the console will only show the remainder as the
    result which is `1`.


    ### PEMDAS Order


    JavaScript programming follows the popular mathematical order of operations: the
    `PEMDAS`. This acronym stands for:


    - `P` - Parentheses

    - `E` - Exponents

    - `M` - Multiplication

    - `D` - Division

    - `A` - Addition

    - `S` - Subtraction


    Let us take the following expression for example.


    | `> (10 + 5) * 3` |


    Upon pressing Enter, the console will give you this answer.


    | `→ 45` |


    The operation inside the parentheses will be solved first. In our case, it is
    `10 + 5` which gives us `15`. After which the sum will then be multiplied to `3`.
    Hence the console gives you `45`.


    Let us try a longer expression.


    | `> (7 * 2) + 5 – 10 / 2` |


    Following the order of `PEMDAS`, the expression will be solved as follows:


    ```

    (7 * 2) + 5 - 10 / 2

    14 + 5 - 10 / 2

    19 - 10 / 2

    19 - 5

    14

    ```


    Hence, the console will give you this answer.


    | `→ 14` |


    ## Comparators


    Aside from operators, JavaScript language recognizes logical operators as well
    which we call comparators. The comparators commonly used in JavaScript are expressed
    through the following syntax:


    - `>` Greater than

    - `<` Less than

    - `==` Equal

    - `!=` Not equal

    - `>=` Greater than or Equal

    - `<=` Less or Equal


    Sending an expression in JavaScript using these comparators is like asking the
    console with a logical question. The answer that you will get from the console
    may either be `true` or `false`. These answers are known to as `Boolean` values.


    Let us try to send the following expression to the console.


    | `>10 != 9` |


    This expression is like asking the console if `10` is not equal to `9` in JavaScript
    language. And so, the console will give you `true` as an answer since `10` is
    not numerically equal to `9`.


    ## Strings


    ![Split-String-in-Javascript-Step-1](images/00008.jpeg)


    JavaScript handles, stores, and processes flat text as strings. To inform the
    console that we want to process flat texts, we need to enclose them within quotation
    marks. This will allow the console to recognize the texts as a string and will
    return the string back to us.


    | `> "The quick brown fox jumps over the lazy dog"→"The quick brown fox jumps
    over the lazy dog"` |


    Multiple strings can be combined by using the concatenation method. We concatenate
    two or more strings by simply adding a `+` sign in between of strings. The console
    will combine all concatenated strings into a single string.


    | `> "Lee" + "and" + "Haide"→"Lee and Haide"` |


    Did you notice that there is a space at the beginning and the end of the string
    `" "`? This is because concatenation does not automatically considers the `+`
    sign as space. Let us try another example using a combination of strings and numbers.


    | `> "I will deliver this at" + 5 + "PM"→"I will deliver this at5PM"` |


    There are two things you should notice here. First, there is no need for quotation
    marks for numbers when concatenating them with strings. Second, the results we
    received is not how we want it to be. Hence, we should add a space at the end
    of the first string and at the beginning of the second string. It should go like
    this.


    | `> "I will deliver this at " + 5 + " PM"→"I will deliver this at 5 PM"` |


    Aside from numbers, you can also concatenate strings, numbers, and expressions.
    Take note, however, that the console automatically evaluates mathematical expressions.


    | `> "The rooftop needs to be " + 15 + " feetand + 1/4→"The rooftop needs to be
    15 feet and 0.25"` |


    The fraction in our JavaScript code was automatically transformed into a value.
    If you need to keep the expression as it is, then you need to assert them within
    a string. It should be like this.


    | `> "The rooftop needs to be " + 15 + " feet and 1/4"→"The rooftop needs to be
    15 feet and 1/4"` |


    ### Formatting Strings with Special Characters


    You can use special characters to format how strings look. One good example is
    the special character backslash (`\`) followed by the letter `t`.


    - `\t` Signals the console to advance to the next tab stop


    Writing strings with this additional command and the result you will get should
    look like this.


    | `> "Height:\t6 ft.\t\t\tWidth:\t26 ft."→"Height:      6 ft.Width:      26 ft.`
    |

