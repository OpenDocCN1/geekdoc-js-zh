  raw: 'Adding quotation marks within a string should be written with backslash as
    well.


    \”              Signals the console that the following quotation mark is not the
    start or the end of a string.


    Here is how your string line should look like when asserting quotation marks inside
    the string and the output you will get in return.


    | > “Nicknames:\t\”The Geek\” \”Com Wiz\” \”Backslasher\””→“Nicknames:     “The
    Geek” “Com Wiz” “Backslasher”” |


    The same rule applies if you want to assert the backslash symbol in your string
    output.


    \\              Signals the console to add the following backslash as it is in
    your output.


    When writing this command, the string and the output should appear as follows.


    | > “Target Folder:\t\”C:\\Program Files\\Directory 1\\Directory 2\””→“Target
    Folder:     “C:\Program Files\Directory 1\Directory 2”” |


    You can also command the console to put values to a new line by simply adding
    the letter “n” after the backslash.


    \n              Signals the console to assert the next values in a new line.


    This is how your code and the output should look like.


    | > “Member 1:\tFebz\nMember 2:\tDonz\nMember 3:\tTaz”→“Member 1:     Febz→ Member
    2:     Donz→ Member 3:     Taz” |


    Comparators and Strings


    Aside from numbers, comparators can also be used to compare strings to get Boolean
    values as an output. Let us try to use the equal comparator.


    | > “Obi-Wan Kenobi” == “Obi-Wan Kenobi”→true |


    Basing from the example above, we got the Boolean value “true” in return because
    the first string is exactly the same with the second string. Let us try to alter
    one of these strings.


    | > “Obi-Wan Kenobi” == “Obi-Wan Kinobi”→ false |


    Keep in mind that JavaScript language is case sensitive. Hence, if the first string
    was written with uppercase characters and the second string was completely written
    in lowercase characters; then the console will treat them as not equal.


    | > “Obi-Wan Kenobi” == “obi-wan kenobi”→ false |


    Counting String Length


    In JavaScript language, you can easily access the length of your strings. Doing
    so will command the console to count all the characters including the spaces and
    non-alphabet characters between the quotations mark that signify the beginning
    and end of your string. We do it by adding the following property right after
    the string.


    .length              Commands the console to count the characters within the string
    it follows.


    This is how we write it and what kind of output we will get.


    | > “Pneumonoultramicroscopicsilicovolcanoconiosis”.length→45 |


    Now let us try to use a string with spaces and non-alphabet characters.


    | > “Pink, Blue, Black, Red, Purple, White, and Green”.length→48 |


    Chapter 2 – Discovering Variables


    Now that you already know how to write, format, and process data in JavaScript
    language, it is now time for you to learn about variables. In this chapter, you
    will learn how to store values using variables. You will not be able to do it
    without learning how to write variables first. Without further due, let us begin
    our journey to the world of variables.


    ![3_variables_write](images/00009.jpeg)


    The Storage of Values


    In order to manage data in JavaScript language, you to store them inside variables.
    Let me show you a basic assignment syntax for a variable we shall name as “Learn
    Easy”.


    | >varlearnEasy = 6 |


    The code “var” here refers to the variable keyword. This commands the browser
    to reserve a specific space for this variable. The next one is “learnEasy” which
    refers to the variable name. This is the name we will be assigning to this example
    variable syntax. The equal sign here serves as the assignment operator. Notice
    that we only use a single equal sign here unlike the double equal signs that we
    used previously for comparison. Lastly, the number 6 here serves as the value
    which we are storing inside our variable named as learnEasy.


    Now that we have a stored value inside a variable, we can now call it using the
    variable name alone. Asserting the variable name “learnEasy” in the console will
    give us the assigned value as its output.


    | >learnEasy→ 6 |


    When assigning names in our variables, there are rules we need to follow in JavaScript
    language. These rules are as follows:


                  1\. No spaces in the variable name. (E.g. var learn easy, var sweet
    java)


                  2\. No digits at the beginning of the variable name. (E.g. var 4life,
    var 1piece)


    There are special characters you can use in the variable name. But, it is better
    to use simple names to make JavaScript languageless complicated.


                  1\. You can use underscores ( _ ) in the variable name. (E.g. varlearn_easy)


                  2\. You can use the dollar sign ( $ ) in the variable name. (E.g.
    varlearnEa$y)


                  3\. You can use both underscores and dollar signs together. (E.g.
    varlearn_ea$y)


    Here is what a good variable name should be. It is known as the “Camel Case” which
    begins with lowercase and the first letter of the following words in uppercase.


    | >varsimpleAndClean |


    If you like to reuse a variable name to store a different value, then you can
    simplify everything by adding a number at the end like this.


    | >var simpleAndClean2 |


    Changing Assigned Value in Variables


    Let us go back with our example variable learnEasy. At the moment, we have the
    numerical value 3 assigned to it. Let us say, for example, you want to change
    the value assigned to that variable. You can easily do it by entering the variable
    name, followed by the assignment operator, then followed by the new value you
    want to assign to the variable.


    | >learnEasy = 13 |


    Notice that we no longer use the variable keyword here. This is because the console
    remembers that the value is already existing in its memory. Once you call for
    this variable, you will now get the new value assigned to it.


    | >learnEasy→ 13 |


    You may also change the value of an existing variable using its own variable name
    in mathematical expressions. The format should be the variable name followed by
    the assignment operator. You insert the mathematical expression after the operator.
    It should go like this.


    | >learnEasy = learnEasy + 16 |


    This will change our store value to 29 since the expression calls for the current
    variable value, which is 13, plus 16\. This makes it 29.


    There is another way to do this. We will end up changing the stored value using
    a different syntax. It goes like this.


    | >learnEasy += 2 |


    The += operator here commands the console to add the current value of the variable
    to the number 2 first. Then it commands the console to store the new value to
    the same variable afterward. Since our current value is 29, we will now get 31
    as the new value stored in the variable learnEasy.


    All operators can be used in this case using both formats.


    Storing Strings in Variables


    Aside from numerical values, you can also store strings inside variables. The
    syntax uses the same format. Let us create a variable to welcome our guests.


    | >var hello = "Welcome to my website!" |


    By storing the string in a variable, you no longer have to type lengthy strings.
    Just call the name of the variable and the console will give you the stored string.
    This is how it should appear.


    | >hello→“Welcome to my website!” |


    You can also use the length property using the variable name. The output value
    you will get is the same with adding the length property after the string. Let
    us take, for instance, a variable named “fox” which contains the string “The quick
    brown fox jumped over the lazy dog”. We simply add .length after the variable
    name and we will have the following lines on our console:


    | >fox.length→ 44 |


    Finding Characters in Strings


    The JavaScript language has its own way to index each character inside the string.
    Let us take the variable “hello” as an example.


    “Welcome to my website!”


