    在字符串内部添加引号时也应该使用反斜杠转义。


    `\"` 告诉控制台接下来的引号不是字符串的开始或结束。


    当在字符串内部断言引号时，你的字符串行看起来如下，以及你将得到的输出。


    | > “Nicknames:\t\”The Geek\” \”Com Wiz\” \”Backslasher\”→“Nicknames:     “The
    Geek” “Com Wiz” “Backslasher”” |


    如果你想在字符串输出中断言反斜杠符号，适用于相同的规则。


    `\\` 告诉控制台在输出中原样添加接下来的反斜杠。


    编写此命令时，字符串和输出应该显示如下。


    | > “Target Folder:\t\”C:\\Program Files\\Directory 1\\Directory 2\”→“Target Folder:     “C:\Program
    Files\Directory 1\Directory 2”” |


    你还可以通过简单在反斜杠后添加字母“n”来命令控制台将值放在新行。


    `\n` 告诉控制台在新行中断言接下来的值。


    这是你的代码和输出应该的样子。


    | > “Member 1:\tFebz\nMember 2:\tDonz\nMember 3:\tTaz→“Member 1:     Febz→ Member
    2:     Donz→ Member 3:     Taz” |


    ## 比较运算符与字符串


    除了数字，比较运算符也可以用于比较字符串以获取布尔值作为输出。让我们尝试使用等号运算符。


    | > “Obi-Wan Kenobi” == “Obi-Wan Kenobi”→true |


    根据上面的示例，我们得到了布尔值“true”，因为第一个字符串与第二个字符串完全相同。让我们尝试修改其中一个字符串。


    | > “Obi-Wan Kenobi” == “Obi-Wan Kinobi”→ false |


    记住 JavaScript 语言是大小写敏感的。因此，如果第一个字符串用大写字母编写，而第二个字符串完全用小写字母编写；那么控制台将它们视为不相等。


    | > “Obi-Wan Kenobi” == “obi-wan kenobi”→ false |


    ## 计算字符串长度


    在 JavaScript 语言中，你可以轻松访问字符串的长度。这样做将命令控制台计算引号之间的所有字符，包括空格和非字母字符。我们通过在字符串后紧跟以下属性来实现。


    `.length` 命令控制台计算其后跟字符串内的字符。


    这是我们编写的方式以及我们将得到的输出输出。


    | > “Pneumonoultramicroscopicsilicovolcanoconiosis”.length→45 |


    现在让我们尝试使用带有空格和非字母字符的字符串。


    | > “Pink, Blue, Black, Red, Purple, White, and Green”.length→48 |


    ## 第二章 – 发现变量


    现在你已经知道如何在 JavaScript 语言中编写、格式化和处理数据，现在是时候学习变量了。在本章中，你将学习如何使用变量存储值。如果不学习如何编写变量，你就无法做到这一点。话不多说，让我们开始变量世界的之旅。


    ![3_variables_write](img/00009.jpeg)


    ### 值的存储


    为了在 JavaScript 语言中管理数据，你需要将它们存储在变量中。让我向你展示一个名为“Learn Easy”的变量的基本赋值语法。


    | >varlearnEasy = 6 |


    这里的代码 `var` 指的是变量关键字。它命令浏览器为此变量预留特定空间。下一个是 `learnEasy`，指的是变量名。我们将赋值给此示例变量语法的名称。等号在这里充当赋值运算符。注意这里只使用单个等号，与我们之前用于比较的双等号不同。最后，这里的数字
    `6` 是我们存储在名为 `learnEasy` 的变量中的值。


    现在我们已经在变量中存储了一个值，现在只需使用变量名即可调用它。在控制台中断言变量名 `learnEasy` 将带给我们赋值的值作为输出。


    | >learnEasy→ 6 |


    在为变量命名时，JavaScript 语言中有我们需要遵循的规则。这些规则如下：


    1. 变量名中不能有空格。（例如 `var learn easy`, `var sweet java`）

    2. 变量名开头不能是数字。（例如 `var 4`）

    3. 你可以使用特殊字符，但最好使用下划线。（例如 `var_easy`）

    4. 你可以使用美元符号。（例如 `varea$`）

    5. 这被称为驼峰命名法（Camel Case）（例如 `varsimpleAndClean`）


