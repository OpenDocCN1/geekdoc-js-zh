- fmt: "\n## Introduction\n\nWhen indexing, JavaScript indexes the first character\
    \ using the numerical value `0`. This is different from the `.length` property\
    \ since JavaScript counts the first character using the numerical value `1`. In\
    \ other words, the last index number is always 1 value less than the length value.\n\
    \nUsing the string stored in `hello` variable, we have `22` for `length` property\
    \ and `21` as the last index number. Now, why do we need the index number you\
    \ ask?\n\nWe use it to find specific characters within the string. This is done\
    \ using the `charAt()` method which we place after the variable just like the\
    \ `.length` property. For instance, we want to know which character falls under\
    \ index number 20 from our variable `hello`. We simply type the following:\n\n\
    ```\nhello.charAt(20)→ “e”\n```\n\n## Creating Messages with Variables\n\nNow\
    \ that you know how to store values inside variables, let us now create messages\
    \ using variables. Let us create one more variable to combine with our existing\
    \ variable `hello`.\n\n```\nvar enjoy = \"Please enjoy your visit!\"\n```\n\n\
    Now that we have our second variable, let us now combine them and create a new\
    \ variable that will serve as our welcoming message.\n\n```\nvarwelcome = hello\
    \ + enjoy\n```\n\nThis will give us the following output whenever we call for\
    \ the variable `welcome`.\n\n```\nwelcome→\"Welcome to my website! Please enjoy\
    \ your visit!\"\n```\n\n## Chapter 3 – Building and Running JavaScript\n\nLearning\
    \ variables was fun, was it not? However, no one wants to code JavaScript language\
    \ in a console. In this chapter, you will learn how to build JavaScript files.\
    \ You will also learn how to run these files inside HTML. So let us begin.\n\n\
    ![programming](images/00010.jpeg)\n\n### Creating Source Files\n\nWriting JavaScript\
    \ codes in the console alone will not print out what we want to convey to our\
    \ user’s web browsers. Hence, we need to find a way to bring what we want to the\
    \ users. In order to do that, we need to create JavaScript source files and run\
    \ these files in an HTML file. Here is an example of the most common HTML file\
    \ known as `index.html`.\n\n```html\n<html><head><script src=\"greetings.js\"\
    ></script></head><body><h1>WELCOME TO JAVASCRIPT!</h1></body></html>\n```\n\n\
    As you can see, we have the `<script>` tag in this file. This tag commands this\
    \ HTML file to load a specific JavaScript source file so that the web browser\
    \ of your visitors will let them see your website in the way you want them to\
    \ see it. Notice that we have the `src` keyword inside the `<script>` tag. This\
    \ is a command to the HTML file which directs it where to load the JavaScript\
    \ source file.\n\nIn this example, we are commanding the `index.html` file to\
    \ load all variables and values within saved inside `greetings.js`.\n\nIn order\
    \ to create this `.js` file, all you need to do is open any text editor like Notepad\
    \ or Text Edit. Write all your JavaScript codes inside and save the file in `.js`\
    \ format. Inside this file, we assert all the JavaScript codes we want our visitor’s\
    \ web browser to execute as soon as they access our website.\n\n### Where To Place\
    \ The Source File?\n\nWhen browsing your website’s file manager, you will never\
    \ miss seeing a folder named `root/`. This is where we can find everything inside\
    \ our website. This is also the default location of your website’s `index.html`\
    \ as well.\n\nBasing from the `index.html` file we have above, we are directing\
    \ it to find the JavaScript source file within the same location folder – that\
    \ is, the `root/` folder. Hence, we should place our `greetings.js` in the same\
    \ location.\n\n```\n+ root/     - index.html     - greetings.js \n```\n\nThere\
    \ are websites, however, that place all their JavaScript source files in a subfolder.\
    \ The most common directory for their source files is under `scripts/` folder.\
    \ Here is how they look like in your website’s directory.\n\n```\n+ root/\n  \
    \  - index.html\n    + scripts/\n        - greetings.js\n```\n\nIf this is how\
    \ you want to organize your source files, then we need to alter the `<script>`\
    \ tag in our sample `index.html`. This is how your HTML codes should look like.\n\
    \n```html\n<html><head><script src=\"scripts/greetings.js\"></script></head><body><h1>WELCOME\
    \ TO JAVASCRIPT!</h1></body></html>\n```\n\nNotice that in this code, we are instructing\
    \ the `index.html` to load the `greetings.js` from the `scripts/` subfolder.\n\
    \n### Writing Codes in the Source File\n\nWriting console-style expressions inside\
    \ the `greetings.js` as they will will only end up in error. Let us try to write\
    \ these following lines inside our source file for example.\n\n```javascript\n\
    var hello = \"Welcome to my website! \"var enjoy = \"Please enjoy your visit!\"\
    hello + enjoy\n```\n\nOnce we open our `index.html` and go to our browser’s console,\
    \ we will see nothing but error. This is because web browser got confused on what\
    \ you really intend to show. The error comes from our JavaScript source file.\
    \ Unlike the console, we need to assert our JavaScript codes differently in the\
    \ source files. We do this by adding a semicolon (`;`) every after a statement.\
    \ Hence, we should write our JavaScript codes like this.\n\n```javascript\nvar\
    \ hello = \"Welcome to my website! \";var enjoy = \"Please enjoy your visit!\"\
    ;hello + enjoy;\n```\n\nWith our codes written with semicolons, you will no longer\
    \ see an error when trying to access the console. However, you will not see anything\
    \ in the console. This means that our code is not yet being delivered to the console.\
    \ In order to fix this, we need to use `console.log()`.\n\nWhat we want to do\
    \ here is to show the string coming from the concatenation of the variables `hello`\
    \ and `enjoy`. Here is how we are going to.\n\n```javascript\nconsole.log(hello\
    \ + enjoy);\n```\n\nBy using `console.log()`, you will be able to see now the\
    \ string inside the console. In other words, we now have a working JavaScript\
    \ language being run by our `index.html` file.\n\n## Conclusion\n\nAt this point,\
    \ you now know how to write values in JavaScript language. You just learned how\
    \ JavaScript interprets numbers and flat texts, as well as how to transform texts\
