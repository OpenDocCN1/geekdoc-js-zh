    `The JavaScript in Simple Words` 系列书籍分为几个部分，帮助你掌握这门编程语言而不会感到不知从从。许多初学者放弃了，是因为他们认为
    JavaScript 太难处理。整个系列旨在以最简单的方式带你直击 JavaScript 的核心。


    # 第 1 章 – 认识数字、运算符和字符串


    仅仅是浏览网络就能接触到数百万行的 JavaScript 代码。当你启动你喜爱的网络浏览器（例如 Google Chrome、Mozilla Firefox
    和 Internet Explorer）并开始访问某个网站时，你已经在使用 JavaScript 语言进行通信了。


    在本章中，我们将讨论 JavaScript 语言的底层构建模块。这将帮助你在转向如 `jQuery` 等高级框架时建立坚实的基础。


    你将学习更多关于数字、运算符和字符串的知识。本章还将涵盖使用运算符操作值的过程，以及如何将这些值存储在变量中。最后，你还将学习如何在 HTML 代码中创建、运行和查找
    JavaScript 代码。


    ## 控制台 (Console)


    在进行任何操作之前，访问网页浏览器控制台至关重要。网页浏览器控制台是开发者工具之一，它记录与当前网页相关的信息。这些信息包括 CSS、安全错误和 JavaScript。控制台还允许你通过断言
    JavaScript 表达式与网页交互。


    这就是我们将执行书中示例 JavaScript 代码的地方。你可以通过按下键盘上的 `F12` 键来访问它。寻找 `Console` 标签页，现在你可以准备开始了。


    ![c8SPG](img/00007.jpeg)


    ## 基础数字与提示符 (Prompt)


    在你开始学习 JavaScript 之初，有两个符号需要熟悉：


    - `>` 大于符号；以及，

    - `→` 箭头符号


    `>` 符号代表 JavaScript 提示符。我们想要输入到控制台的所有代码将写在这个符号之后。`→` 符号指代我们输入的代码所产生的结果。


    在 JavaScript 语言中，数字会被自动识别。在提示符后输入数字并按下键盘上的回车键（Enter key），你将得到相同的值作为结果。尝试在控制台中输入数字
    `13`，它将返回相同的值。


    | `> 13→` `13` |


    带有小数值的数字也是如此。


    | `> 13.29→` `13.29` |


    ## 运算符


    在 JavaScript 中，数学运算也是被允许的。JavaScript 语法中常用的运算符如下：


    - 加法 (+)

    - 减法 (-)

    - 乘法 (*)

    - 除法 (/)

    - 取模 (Modulus)


    加法通过 `+` 符号表示。


    | `> 1 + 3→` `4` |


    减法通过 `–` 符号表示。


    | `> 10 – 5→` `5` |


    乘法通过 `*` 符号表示。


    | `> 2 * 9→` `18` |


    除法通过 `/` 符号表示。


    | `> 25 / 5→` `5` |


    而取模是 JavaScript 语言中的一种特殊运算。它通过 `%` 符号表示。你得到的结果是两个数字相除后的余数。


    | `> 23 % 2→` `1` |


    在上面的取模示例中，控制台将 `23` 除以 `2`。即使在 `23` 中除了 `11` 次，控制台也只显示余数作为结果，即 `1`。


    ### PEMDAS 顺序


    JavaScript 编程遵循流行的数学运算顺序：`PEMDAS`。这个缩写代表：


    - `P` - 括号 (Parentheses)

    - `E` - 幂指数 (Exponents)

    - `M` - 乘法 (Multiplication)

    - `D` - 除法 (Division)

    - `A` - 加法 (Addition)

    - `S` - 减法 (Subtraction)


    让我们以以下表达式为例。


    | `> (10 + 5) * 3` |


    按下回车后，控制台将给你这个答案。


    | `→ 45` |


    括号内部的运算优先求解。在我们的情况下，是 `10 + 5`，得到 `15`。之后，将该总和乘以 `3`。因此，控制台给了你 `45`。


    让我们尝试一个更长的表达式。


    | `> (7 * 2) + 5 – 10 / 2` |


    遵循 `PEMDAS` 顺序，表达式将按如下方式求解：


    ```

    (7 * 2) + 5 - 10 / 2

    14 + 5 - 10 / 2

    19 - 10 / 2

    19 - 5

    14

    ```


    因此，控制台将给得到这个答案。


    | `→ 14` |


    ## 比较符 (Comparators)


    除了运算符，JavaScript 语言还识别逻辑运算符，我们称之为为比较符。JavaScript 中常用的比较符通过以下语法表示：


    - `>` 大于

    - `<` 小于

    - `==` 等于

    - `!=` 不等于

    - `>=` 大于等于

    - `<=` 小于等于


    在 JavaScript 中使用这些比较符发送一个表达式，就像是在向控制台提一个逻辑问题。你从控制台得到的答案可能是 `true`（真）或 `false`（假）。这些答案被称为
    `Boolean`（布尔）值。


    让我们尝试向控制台发送以下表达式。


    | `>10 != 9` |


    这个表达式就像是在问控制台 `10` 是否不等于 `9`。由于 `10` 确实不等于 `9`，控制台会返回 `true`。


    ## 字符串 (Strings)


    ![Split-String-in-JavaScript](img/0008.jpeg)


    JavaScript 处理、存储并处理文本作为字符串。为了通知控制台我们要处理文本，我们需要将它们封装在引号内。这允许控制台识别文本并返回字符串。


    | `> "The quick brown fox jumps over the dog"→"The quick brown fox jumps over
    the dog"` |


    字符串可以通过合并方法组合。我们通过在字符串之间添加 `+` 符号来合并。控制台会将所有字符串合并成单个字符串。


    | `> "Lee" + "and" + "Haide"→"Lee and Haide"` |


    你注意到字符串开头有一个空格吗？这是因为合并操作不会自动将 `+` 符号视为空格。让我们尝试一个组合字符串和数字的示例。


    | `> "I will deliver this at" + 5 + "PM"→"I will deliver this at5PM"` |


    这里注意两点。第一，在与字符串合并数字时不需要引号。第二，我们得到的结果不是我们想要的。因此，我们应该在一个字符串的末尾和第二个字符串的开头添加空格。应该是这样的。


    | `> "I will deliver this at " + 5 + " PM"→"I will deliver this at 5 PM"` |


    除了数字，你还可以合并字符串、数字和表达式。但注意，控制台会自动计算数学表达式。


    | `> "The rooftop needs to be " + 15 + " feetand + 1/4→"The rooftop needs to be
    15 feet and 0.25"` |


    JavaScript 代码中的分数被转换成了数值。如果你需要保持表达式原样，你需要将它们封装在字符串中。应该是这样的。


    | `> "The rooftop needs to be " + 15 + " feet and 1/4"→"The rooftop needs to be
    15 feet and 1/4"` |


    ### 使用特殊字符格式化字符串


    你可以使用特殊字符来格式化字符串。一个很好的例子是反斜杠 `\` 后跟字母 `t`。


    - `\t` 通知控制台跳转到下一个制表位


    使用此额外命令编写字符串，你得到的结果应该像这样。


    | `> "Height:\t6 ft.\t\t\tWidth:\t26 ft."→"Height:      6 ft.Width:      26 ft.`
    |


