  trans: "\n\n## 引言\n\n在进行索引时，JavaScript 使用数值 `0` 来索引第一个字符。这与 `.length` 属性不同，因为 JavaScript\
    \ 使用数值 `1` 来计数第一个字符。换句话说，最后一个索引值总是比长度值小 1。\n\n使用存储在 `hello` 变量中的字符串，其 `length`\
    \ 属性的值为 `22`，最后一个索引号为 `21`。现在，你可能会问，我们为什么需要索引号呢？\n\n我们使用它来查找字符串中的特定字符。这是通过 `charAt()`\
    \ 方法实现的，我们将其放在变量之后，就像使用 `.length` 属性一样。例如，我们想知道变量 `hello` 中索引号为 20 的字符是什么。我们只需输入以下内容：\n\
    \n```\nhello.charAt(20)→ “e”\n```\n\n## 使用变量创建消息\n\n现在你已经知道如何在变量中存储值了，让我们使用变量创建消息吧。再创建一个变量，与我们现有的变量\
    \ `hello` 结合。\n\n```\nvar enjoy = \"Please enjoy your visit!\"\n```\n\n现在我们已经有了第二个变量，让我们将它们合并并创建一个新变量，作为我们的欢迎消息。\n\
    \n```\nvarwelcome = hello + enjoy\n```\n\n每当我们调用变量 `welcome` 时，都将得到以下输出。\n\n```\n\
    welcome→\"Welcome to my website! Please enjoy your visit!\"\n```\n\n## 第三章 – 构建与运行\
    \ JavaScript\n\n学习变量很有趣，不是吗？然而，没有人想在控制台中编写 JavaScript 语言。在本章中，你将学习如何构建 JavaScript\
    \ 文件。你还将学习如何在 HTML 中运行这些文件。那么，让我们开始吧。\n\n![programming](img/00010.jpeg)\n\n###\
    \ 创建源文件\n\n仅在控制台中编写 JavaScript 代码无法将我们想要传达给用户浏览器的内容。因此，我们需要找到一种方法将想要的内容呈现给用户。为了做到这一点，我们需要创建\
    \ JavaScript 源文件并在 HTML 文件中运行这些文件。以下是一个最常见的 HTML 文件 `index.html` 示例。\n\n```html\n\
    <<html>><head><script src=\"greetings.js\"></script></head><body><h1>WELCOME TO\
    \ JAVASCRIPT!</h1></body></html>\n```\n\n如你所见，我们在这个文件中包含了一个 `<script>` 标签。该标签命令此\
    \ HTML 文件加载特定的 JavaScript 源文件，这样访问者的网络浏览器就能以你想要的方式查看你的网站。注意我们在 `<script>` 标签内部使用了\
    \ `src` 关键字。这是给 HTML 文件的命令，指示它从哪里加载 JavaScript 源文件。\n\n在这个示例中，我们正在命令 `index.html`\
    \ 文件加载保存在 `greetings.js` 中的所有变量和值。\n\n为了创建此 `.js` 文件，你只需要打开任何文本编辑器（如记事本或 Text\
    \ Edit）。在里面编写所有的 JavaScript 代码，并将文件保存为 `.js` 格式。在该文件中，我们断言访问者浏览器在访问我们的网站时立即执行的所有\
    \ JavaScript 代码。\n\n### 源文件放在什么位置？\n\n在浏览网站的文件管理器时，你永远不会错过一个名为 `root/` 的文件夹。这是我们找到网站内所有内容的地方。这也是你网站\
    \ `index.html` 的默认位置。\n\n根据上面的 `index.html` 文件，我们引导它在同一个位置文件夹内寻找 JavaScript 源文件——即\
    \ `root/` 文件夹。因此，我们应该将 `greetings.js` 放在同一个位置。\n\n```\n+ root/     - index.html\
    \     - greetings.js \n```\n\n然而，有些网站会将所有的 JavaScript 源文件放在子文件夹中。它们源文件最常见的目录是\
    \ `scripts/` 文件夹下。以下是它们在你的网站目录中的结构。\n\n```\n+ root/\n    - index.html\n    + scripts/\n\
    \        - greetings.js\n```\n\n如果你想这样组织源文件，那么我们需要修改示例中 `index.html` 的 `<script>`\
    \ 标签。你的 HTML 代码看起来应该是这样的。\n\n```html\n<<html><head><script src=\"scripts/greetings.js\"\
    ></script></head><body><h1>WELCOME TO JAVASCRIPT!</h1></body></html>\n```\n\n\
    注意，在这段代码中，我们正在指示 `index.html` 从 `scripts/` 子文件夹加载 `greetings.js`。\n\n### 在源文件中编写代码\n\
    \n在 `greetings.js` 直接书写控制台风格的表达式只会导致错误。让我们尝试在源文件中编写以下几行作为示例。\n\n```javascript\n\
    var hello = \"Welcome to my website! \"var enjoy = \"Please enjoy your visit!\"\
    hello + enjoy\n```\n\n一旦我们打开 `index.html` 并进入浏览器的控制台，我们将什么也看不到，只有错误。这是因为网络浏览器对你真正想要显示的内容感到困惑。错误来自我们的\
    \ JavaScript 源文件。与控制台不同，我们需要在源文件中以不同的方式断言 JavaScript 代码。我们通过在每个语句后添加分号（`;`）来实现。因此，我们应该这样写\
    \ JavaScript 代码。\n\n```javascript\nvar hello = \"Welcome to my website! \";var\
    \ enjoy = \"Please enjoy your visit!\";hello + enjoy;\n```\n\n用带有分号的代码编写后，当你尝试访问控制台时将不再看到错误。然而，你会在控制台中看不到任何东西。这意味着我们的代码尚未被传递到控制台。为了解决这个问题，我们需要使用\
    \ `console.log()`。\n\n我们在这里想要做的是显示来自 `hello` 和 `enjoy` 连接的字符串。我们将如下操作：\n\n```javascript\n\
    console.log(hello + enjoy);\n```\n\n通过使用 `console.log()`，你现在可以在控制台中看到字符串了。换句话说，我们现在有了一个由我们的\
    \ `index.html` 文件运行的 JavaScript 语言。\n\n## 总结\n\n此时，你已经知道如何在 JavaScript 语言中编写值。你刚刚学会了\
    \ JavaScript 如何解释数字和纯文本，以及如何将文本转换为字符串值。你还学会了如何使用运算符和比较符将这些值转换为表达式和语句。\n\n在第二章中，你被介绍了变量。你学习了如何在变量中存储值以及连接方法，你学习了如何以变量的形式快速处理值。还介绍了一些方法，例如\
    \ `charAt()` 方法和 `.length` 属性——这些都是帮助你高效分析值的工具。\n\n在第三章中，你学习了如何创建自己的源文件。注意与控制台相比，需要在源文件中以不同的方式断言\
    \ JavaScript 代码。你还了解了 `console.log()` 方法，允许你在浏览器控制台中打印值。然而，这并不是交付 JavaScript 代码的最有效方法。想象一下要向浏览器传递成百上千个值？\n\
    \n在《易学 JavaScript》系列的下一部分中，我们将带你进入 JavaScript 的循环，你将学习如何高效地管理重复代码。书的第二部分还将讨论几个主题，包括条件的使用和对话框的创建。\n\
    \n感谢阅读。希望你喜欢。我请求你留下诚恳的反馈。\n\n"
