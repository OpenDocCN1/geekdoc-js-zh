  \n### 逻辑运算符\n\n最后，在你对运算符的简要检查中，出现了逻辑运算符。`logical operator` 用于评估正在测试的条件是真还是假。你经常会看到大写的\
  \ `True` 和 `False`（如此处所示），以强调这是一个逻辑值或布尔值（Boolean value）。\n\n`Boolean` 一词源于数学家乔治·布尔（George\
  \ Boole）的名字，他是逻辑形式代数规则的先驱。计算机依赖逻辑来工作，因此你经常经常会遇到 `True`（通常用值 1 表示，也可以用任何非零值表示）和 `False`（通常用值\
  \ 0 表示）。\n\n数值 `True` 值是任何非零值，因此数值零等同于 `False`。所以 1、5、7、232、-175 等都是 `True`。只有数值零是\
  \ `False`。我们也可以对字符串应用 `True/False` 检查。单词 `Olympic` 是 `True`，包含 `'0'` 的字符串是 `True`，单个空格也是\
  \ `True`。只有完全没有任何字母或数字字符才是 `False`。\n\n第 78 页\n\n基本上有三个逻辑运算符：`and`、`or` 和 `not`。\n\
  \n这意味着你可以仅通过以下方式检查两个变量是否有值：\n\n```perl\nif ($num1 and $num2) { print \"Both of those\
  \ variables have a non-zero value.\\n\"; }\n```\n\n或者你可以说：\n\n```perl\nif (not $num1)\
  \ { print \"That variable is empty.\\n\"; }\n```\n\n你还可以说：\n\n```perl\nif ($num1\
  \ OR $num2) { print \"One of those variables has a non-zero value.\\n\"; }\n```\n\
  \n你可以组合条件，例如：\n\n```perl\nif ($num1 and $num2 or $num3) { print \"Both of the first\
  \ variables have a non-zero value or that last one does!.\\n\"; }\n```\n\n逻辑运算符的工作方式完全相同。正如你所发现的，空字符串等于\
  \ `False`，而所有其他值都等于 `True`。\n\n第 79 页\n\n最后，有一些可以代替 `and`、`or` 和 `not` 的符号。\n\n\
  * `||` 等同于 `or` 逻辑运算符\n* `&&` 等同于 `and` 运算符\n* `!` 等同于 `not` 运算符\n\n使用这些符号代替单词运算符\
  \ `and`、`or` 和 `not` 的唯一区别是符号版本的优先级更高。这意味着，`||` 的处理会在 `or` 之前。不要过于担心这个。如果你想让某个内容在另一个内容之前进行评估，只需将想要先执行的内容括在括号中即可。\n\
  \n逻辑运算符看起来很简单，但误用可能会导致非常困惑的错误。你以后会经常使用逻辑运算符。尝试使用之前的示例并并玩玩代码，或者继续读下去等待一些真实的例子。\n\n\
