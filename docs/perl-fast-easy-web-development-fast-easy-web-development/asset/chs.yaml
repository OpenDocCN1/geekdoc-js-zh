  \n# Perl 中的循环\n\nPerl 的循环功能非常丰富。Perl 可以在条件为真（True）时进行循环，也可以直到条件为真时循环。Perl 可以在条件为真或假时进行循环或直到循环，并确保循环至少执行一次。最后，Perl\
  \ 可以使用 `for` 循环执行预定的次数。接下来你将学习如何使用这些循环结构。\n\n## while 和 until 循环\n\n`while` 循环在给定条件为真时一直运行。如果指定的条件最初不为真，则\
  \ `while` 循环内的代码将永远不会执行。`while` 循环的形式如下：\n\n```\nWhile (condition) { statement …;\
  \ statement …; }\n```\n\n| NOTE |\n\n| 请注意，你经常会看到左大括号与 `while (condition)` 在同一行——这只是另一种习惯写法。\
  \ |\n\n第 112 页\n\n`until` 循环与 `while` 循环非常相似。正如这些循环名称所示，`while` 循环在给定条件满足*时*继续循环，而\
  \ `until` 循环则在*直到*某个条件出现为止继续循环。\n\n这里是一个包含两种类型循环的示例。\n\n**1.** 在你的编辑器中启动一个新程序。\n\
