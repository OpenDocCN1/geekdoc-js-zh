  \ = index($teststring, \"Web\"); print \"The position of \\\"Web\\\" in \\$teststring\
  \ is: $position \\n\";\n```\n\n将显示：\n\nThe position of \"Web\" in $teststring is:\
  \ 17;\n\n| 注意事项 |\n| :--- |\n| 字符串中的第一个位置是 0。如果未找到要搜索的子字符串，该函数将返回值 -1。 |\n\n###\
  \ rindex() 函数\n\n`rindex()` 函数查找另一个字符串首次出现的最右侧位置。也就是说，它是反向搜索字符串的。在所有其他方面，该函数与 `index()`\
  \ 函数相同。\n\n第第 398 页\n\n语法如下：\n\n```perl\n$position = rindex($teststring, $substring);\n\
  ```\n\n或者\n\n```perl\n$position = rindex($teststring, $substring, $startposition);\n\
  ```\n\n例如：\n\n```perl\n$teststring = ''Perl Fast & Easy Web Development\"; $position\
  \ = rindex($teststring, \"Web\" ); print \"The position of \\\"Web\\\" in \\$teststring\
  \ is: $position \\n\";\n```\n\n也将显示：\n\nThe position of \"Web\" in $teststring is:\
  \ 17;\n\n### substr() 函数\n\n`substr()` 函数允许你从另一个字符串中提取部分字符串。其语法如下：\n\n```\nSubstr(\
  \ $wholestring, offset, length, $replacementstring);\n```\n\n这意味着检查 `$wholestring`（可以是变量或字面量），从\
  \ `offset` 位置开始，长度为 `length`，如果找到子字符串，则将其替换为 `$replacementstring` 的内容（该也可以是字面量）。\n\
  \n因此，以下代码：\n\n```perl\n$wholestring = \"Cats are cute\"; $substring = substr( $wholestring,\
  \ 0, 4, \"Dogs\"); print $substring;\n```\n\n将给您输出：\n\nCats are cute\n\n第第 399 页\n\
  \n如果你省略了 `$replacementstring` 参数，则只返回子字符串，因此与上述代码相同但没有 `$replacementstring` 参数的代码将给出：\n\
  \nCats\n\n`substr()` 是一个非常强大的函数。\n\n### tr/// 运算符\n\n`tr///` 运算符严格来说不是函数，但可以认为它提供了函数功能。`tr///`\
  \ 运算符的语法为：\n\n```\ntr/ searchstring / replacestring /\n```\n\n正斜杠仅仅是分隔符。\n\n`tr///`\
  \ 运算符非常强大。考虑以下内容：\n\n```perl\n$newstring =~ tr/a-z/A - Z/\n```\n\n这将替换字符串中 a 到 z\
  \ 范围内的每个字符，并将其替换为对应的大写字母 A 到 Z。\n\n注意 `=~` 符号。这被称为*绑定运算符*，如果不使用它，操作将在 `$_` 中的任何内容上执行。在这种情况下，你不会在左侧使用变量，如下所示：\n\
  \n```\ntr/a-k/A-K\n```\n\n你还可以在翻译运算符的末尾添加修饰符。因此\n\n```\ntr/a-k/h-k/c\n```\n\n（其中\
  \ `/c` 是修饰符）会替换任何不在搜索字符串中的字符。\n\n```\ntr/a-k/h-k/c\n```\n\n\n\n\n* http://www.w3schools.com/\n\
