  \ 如何在 Perl 中循环\n\n第 106 页\n\n### 什么是程序流？\n\n这种符号可能被称为逗号箭头运算符，因为 `=>` 替换了上一个例子中的逗号。无论原因如何，逗号箭头运算符让值对更容易识别。\n\
  \n程序流是程序中允许做出决策的属性。在编程中，基本上有三种结构：顺序、选择和迭代。\n\n#### 顺序\n\n顺序是按照顺序执行的指令块。\n\n####\
  \ 选择\n\n选择是根据值执行的。块通常是缩进的。这有助于代码的可读性。\n\n#### if 语句\n\n`if` 语句是 Perl 的选择语句之一。它根据变量中的值做出决策。\n\
  \nPerl 中的 `if` 语句与 `C`、`C++` 等语言相似。\n\n```perl\nif (condition) {\n  statement;\n\
  } elsif {\n  statement;\n} else {\n  statement;\n}\n```\n\n第 107 页\n\n注意，通常你会发现第一个大括号与\
  \ `if (condition)` 部分在同一行，如下：\n\n```perl\nif (condition) {\n```\n\n再次，这只是一个约定，取决于你是否采用它。如果你不是在任何设定的规则下工作，请保持一致。否则你可能会困扰那些从你的程序中学习的人。\n\
  \n`elsif`/else` 部分是 `if` 构造可选的。你可能不需要它们；事实上，通常不需要。还要注意 `elsif` 的拼写。\n\n你也可以在 `if`\
