  \n第 192 页\n\n### 什么是 CGI？\n\n让我们快速概述一下 Web 服务器的作用。通常情况下，Web 服务器从用户的 Web 浏览器接收一个所谓的\
  \ `request`（请求）。也就是说，用户从某个网站请求一个页面。Web 服务器接收请求，找到页面并将其返回给浏览器。浏览器使用我们之前讨论过的 HTML\
  \ 标签渲染页面，并在用户的屏幕上对页面进行格式化。\n\n![Image](img/5040fcbe599d6c3e70b72846fd650452.gif)\n\
  \n对于 HTML 页面来说这很好，但当你想要让 Web 页面使用 Perl 程序来更新数据库时会发生什么？Web 服务器无法独立处理该操作。当此类请求到达 Web\
  \ 服务器时，它会被传递给其他外部软件。这是通过“通用网关接口”（Common Gateway Interface）实现的，这正是 CGI 编程的核心。\n\n\
  #### CGI 处理\n\n![Image](img/8334920a9104bcb2a68cdbf71ce6ee99.gif)\n\n所示的 CGI 可能包含许多内容。例如，如果你打算在\
  \ Web 应用程序中使用 ASP，任何对 ASP 页面的请求将会被重定向到程序 `asp.dll`。但目前最重要的是 Perl；对 Perl 脚本或程序的请求将传递给\
  \ `perl.exe`。在第 1 章你已经在机器上安装了 Perl，所以现在你已经准备就绪了。\n\n第 193 页\n\n### 我可以用 CGI 做什么？\n\
  \nCGI 编程允许你使用 Perl CGI 程序完成任何你想要的基于 Web 的任务。使用 Perl 与其 Web 环境通信有一些规则需要你学习。CGI 本身的一些功能也需要学习，你会发现它们非常有用。\n\
  \n### 一个简单的 Perl CGI 程序\n\n你终于要尝试一个真实的 CGI 程序了。你将编写一个非常简单的 Perl 程序，在 Web 页面上显示你机器的\
  \ IP 地址。\n\n| 注意 |\n| :--- |\n| IP `address` 是你 PC 的网络地址。每台连接到互联网的计算机都有 IP 地址。IP\
  \ 地址看起来像这样：`121.236.157.53`。也就是说，它是由点分隔的四组数字。互联网使用名称来查找网站地址，但这些名称由域名服务器（DNS）转换为\
  \ IP 地址，这些计算机的工作就是执行这种转换，以便计算机能够相互找到。 |\n\n在第 1 章中，你学习了 Web 服务器以及如何为网站设置文件夹。你还学习了\
  \ `cgi-bin`，即脚本文件夹。如果你使用 Microsoft Personal Web Server，你将把 Perl 程序放在 scripts 文件夹中；如果你使用\
  \ UNIX 机器和类似 Apache Web Server（极佳的选择），则将其放在 `cgi-bin` 文件夹中。\n\n当然，如果你的 ISP 允许你运行自己的\
  \ Perl 脚本，请向他们咨询你应该将脚本放在哪里，以及你的 Web 空间是否有任何禁忌。你将使用 `127.0.0.1` 地址从 Web 浏览器访问你的 Web\
  \ 页面。但记住，如果你选择在 ISP Web 空间托管你的程序，你将使用如下地址：\n\n`http://www.mydomain.com/scripts/`\n\
  \n用于 Perl 代码，以及类似：\n\n`http://www.mydomain.com/`\n\n用于 HTML。\n\n当然，如果你的 IP 地址是静态的（也就是说它不会改变——大多数都是如此），那么你可以用它代替域名。\n\
