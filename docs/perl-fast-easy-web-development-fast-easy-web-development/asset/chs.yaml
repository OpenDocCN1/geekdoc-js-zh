  \n### **开始之前**\n\n在这一阶段，决定你想要使用的文本编辑器是很有用的。有很多选择，从 `记事本`（Windows）和 `Vi`（UNIX）到具有特定功能的复杂编辑器。一个适合初者的编辑器是\
  \ `HTMLPad 2000`。它很容易学习，虽然没有提供语言支持，但它可以对源代码进行颜色显示，使其更容易阅读。\n\n对于本章以及接几章，请在硬盘上的任意位置创建一个名为\
  \ `test`（或你喜欢的名称）的文件夹。你可以在顶层文件夹 `c:\\Perl` 下，或者在硬盘上创建一个 `myPerl` 文件夹。\n\n\n\n\n\
  • *注释*（comment）是一行（或多行）在程序中不执行任何函数的文本。它是描述性文本，用于帮助人类阅读者理解代码在做什么。在 Perl 中，每行注释都以\
  \ `#` 符号开头。\n\nPerl 是一门*自由格式*语言。这意味着，你可以根据需要使用任意数量的空白（空格、制表符、换行符等）。这意味着你可以以一种比其他语言更具可读性的方式来编写代码。\n\
  \n这也意味着 Perl 需要某种方式来显示它何时到达一个语句的结束。这是通过使用分号（`;`）实现的。因此，一个 Perl 语句可能看起来这样：\n\n```\n\
  print ''I think Perl is great \\n\";\n```\n\n这是终止语句的常用方法。`C`、`C++`、`Java`、`PHP`\
  \ 和 `Pascal` 等语言都使用分号来终止语句；所以，如果你是从这些语言过来的，你可能已经熟悉这一点了。\n\n好了，假设你已经选择了想要使用的编辑器，现在可以投入到\
  \ Perl 的世界中看看它是如何运作的了！\n\n### **初学 Perl**\n\n所有的 Perl 程序都应该以亲切地称为\"shebang\"的语句开头。shebang\
  \ 语句应该出现在程序第一行第一列的开头，并且它应该包含指向 Perl 解释器 `perl.exe` 的文件路径。为什么它应该被称为\"shebang\"语句尚无争议，但它是计算机中用于某些特殊字符的典型命名类型（感叹号通常被称为\"\
  shriek\" 或 \"splat\"）。\n\nshebang 语句以 `#` 符号开头，表示它是一行注释。然而，它实际上是此规则的唯一例外！在 UNIX\
  \ 系统上，这一行告诉操作系统去哪里寻找 Perl，以便执行该程序。\n\n| **注意** |\n| 记住：Perl 程序始终应该以 `#!pathname_to_Perl,`\
  \ 开头，位于第 1 行第 1 列。 |\n\n![Image](img/33549e68164280b7e867150c26ec4542.gif)\n\n![Image](img/0ef74731c8a15bca09ed8211e9d798f1.gif)\n\
  \n但注意，对于 Windows 来说，这完全是一个注释！\n\n![Image](img/8083fa0014e484251ef12143f22545b4.gif)\n\
  \n| **警告** |\n| 这是 UNIX 和 NT 平台之间的一个重要区别。任何以 `#` 开头的语句都被 Perl 视为注释，因此被解释器忽略。此规则的例外是\
  \ Perl 程序的第一行，如前所述。这条语句告诉 UNIX 操作系统去哪里寻找 Perl 解释器。只要程序文件被设置为可执行文件（通过将 `chmod` 设置为\
  \ `755`），只需输入名称即可运行。当然，你仍然可以在 NT 的命令行中使用 `-w` 标志。 |\n\n在 NT 平台上，这第一行将被视为注释。然而，NT\
  \ 使用程序与其文件名文件扩展名之间的“关联”。换句话说，当 Windows NT（以及 Windows 9x 等）看到 `.pl` 扩展名时，它会自动调用 Perl\
  \ 解释器。\n\n### **在 Perl 程序中输入和输出**\n\n我们已经看到，可以使用 Perl 的 `print` 命令在屏幕上显示内容：\n\n\
