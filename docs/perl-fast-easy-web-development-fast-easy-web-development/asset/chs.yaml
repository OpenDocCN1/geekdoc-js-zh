  \ 6. 哈希映射（Hashes）\n\n哈希在 Perl 中有时被认为是一个晦涩的主题。这种认知在很大程度上源于所谓的“误导且不一致”的语法。出于这个原因，这个短章节的开头包含了对什么是哈希以及如何在\
