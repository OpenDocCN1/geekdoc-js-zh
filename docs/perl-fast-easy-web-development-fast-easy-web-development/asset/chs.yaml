  \n## **3 数据类型：标量**\n\nPerl 有四种内置数据类型。它们是标量、数组、哈希和引用。*标量*基本上是单个数据。*数组*是通过数字下标访问的数据列表，而*哈希*是通过另一个变量或字面量访问的数据列表；数组和哈希将在后面的章节介绍。*引用*是指其他东西的“指针”。例如，引用被用作文件句柄指向文件。\n\
  \n本章涉及 Perl 中的标量数据类型。具体而言，你将学习：\n\n![Image](img/b6fc6dc698fbf23ac57371ee96e7ade.gif)\
  \ 标量变量\n\n![Image](img/b6fc6dc698fbf23ac57371ee96e7ade.gif) 字符串\n\n![Image](img/b6fc6dc698fbf23ac57371ee96e7ade.gif)\
