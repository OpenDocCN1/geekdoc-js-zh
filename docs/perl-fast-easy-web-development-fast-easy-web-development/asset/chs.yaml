  \ 页\n\n### CGI.pm 模块背后的想法是什么？\n\n`CGI.pm` 模块试图简化并规范 CGI 应用中使用的函数。 CGI 程序执行过程中需要采取的一些操作并不直观，某些操作的必要性已迷失在时光流中——早在\
  \ 90 年代！\n\nPerl 是一种强大的语言，但为了完成一些本该简单的事情仍然需要进行一些复杂的体操。事实是现有技术已经进步，出现了一些新技术，但在许多情况下，我们仍然只有非常原始的机制来访问这些技术。\n\
  \n你已经看到发送头（`print \"Content-type: text/html\\n\\n\";`）有多单调，以及从表单获取数据有多困难。该模块旨在简化这一切，提供\
  \ CGI 函数接口，并让你更快速更方便地创建 HTML 表单和后端 CGI 脚本。`CGI.pm` 模块中有许多函数，在本章中将学习一些常用的。\n\n要使用\
  \ `CGI.pm` 函数，你必须导入 `CGI.pm` 模块方法。你可以通过以下语句来实现；此语句使 `CGI.pm` 模块包含的函数在程序可用：\n\n```perl\n\
  use CGI qw(:standard);\n```\n\n`qw` 仅仅是将 `:standard` 包起来的方式。\n\n你也可以使用：\n\n```perl\n\
  use CGI ':standard';\n```\n\n`:standard` 指的是标准函数集，这样你可以使用不那么长的方法来引用函数。\n\n快速学习这些\
  \ `CGI.pm` 函数的最佳方法是通过示例，让我们直接开始吧。\n\n第 343 页\n\n### 使用 CGI.pm 开始和结束 HTML 页面\n\n\
