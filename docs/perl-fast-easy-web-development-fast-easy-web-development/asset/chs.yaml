  \n\n\n请备好这个程序，因为查看每个环境变量的作用是非常有用的。当你开始构建自己的 Web 应用程序时，你将需要用到其中的许多变量。\n\n你的 Perl\
  \ Web 应用程序开始变得稍微有趣了一些。但你能用它们做什么呢？你可以获取有关客户端浏览器的信息等，但似乎缺少了东西。\n\n## HTML 表单\n\n为了让\
  \ Web 应用程序真正有用，你必须能够与它们“对话”——向它们发送数据并获取数据。你可以使用我们已经用过的 print HTML 类型语句来获取数据。但你如何发送数据呢？为了这一点，你需要比我们目前涵盖的更多的\
  \ HTML。你需要 HTML 表单。\n\n| 注意 |\n| :--- |\n| 在继续之前，如果你还没有这样做，请在 `wwwroot` 文件夹下创建一个名为\
  \ `myhtml` 的文件夹。这对于你即将尝试的示例非常有帮助。 |\n\nHTML 表单允许用户通过输入数据与 网站进行交互，这些数据可以用于填充数据库或文件，或者向网站所有者发送电子邮件。表单让网页变得有用！通过使用表单，你可以从网站用户那里收集信息，并向他们提供想要和需要的信息。\n\
  \n第 204 页\n\n### 什么是表单？\n\n如果你要构建任何静态 HTML 网站以外的内容；也就是说，如果你希望页面执行显示文本图像以外的功能，你就必须将页面连接到某种存储机制。这将使你能够存储数据，以便从用户那里捕获数据并发送到用户的\
  \ Web 浏览器。\n\n通常，数据存储在数据库或文件中。如果你的页面能够处理某种数据，那么你必须能够以某种方式输入数据——这种输入机制就是表单。\n\n表单有许多元素，如表\
  \ 10.1 所示。\n\n**表 10.1 表单元素及其用途**\n\n| 元素 | 目的 |\n| :--- | :--- |\n| Text（文本） |\
  \ 允许输入短字符串。 |\n| Textarea（文本区域） | 允许输入占据多行的较长字符串。 |\n| Radio Button（单选按钮） | 一“多选一”的选择机制。\
  \ |\n| Check Box（复选框） | 真假指示器——选中时显示带有勾号或 X 的框。 |\n| Select Boxes（选择框） | 下拉选项列表，可以从中选择一个（或多个）选项。\
  \ |\n| Hidden（隐藏） | 文本框，但框在页面上不可见。它通常用于携带用户不需要看到的数据。 |\n| Password（密码） | 文本框，但在用户输入时，每个字符都用星号表示。\
  \ |\n| Submit Button（提交按钮） | 允许将表单输入数据传输到处理机制的按钮。 |\n| Reset Button（重置按钮） | 清除表单中所有数据的按钮，使用户重新开始。\
  \ |\n\n表单本身使用 `<FORM> </FORM>` 标签定义，并在其中包含表示所有所需数据项的标签。\n\n第 205 页\n\n这是一个典型的 FORM\
  \ 标签：\n\n```html\n<FORM NAME=\"myform\" METHOD=\"POST\" ACTION=\"/scripts/myscript.pl\"\
  >\n```\n\n`NAME` 属性允许表单内的元素被页面中的脚本引用，例如 `JavaScript`、`VBScript` 等。你将在第 15 章学习更多关于\
  \ `JavaScript` 的知识。\n\n`METHOD` 通常设置为 \"POST\" 或 \"GET\"。这是一种向脚本或其他程序发送数据的方法。\n\n\
  #### METHOD=\"GET\"\n\n通过 `GET` 方法发送的数据将随 URL 一起发送到脚本，作为一个字符串发送。你可能注意到，在互联网上填写表单时，浏览器的\
  \ URL 地址栏中会有类似这样的内容：\n\n`http://www.somedomain.com/scripts/ascript.exe?dataitem1=value1`\n\
  \n注意分隔脚本名称和其后数据的问号。\n\n这种方法的主要缺点是所传递的数据可以很容易被看到，而且数据字符串的长度受到限制。\n\n#### METHOD=\"\
  POST\"\n\n这种方法将数据发送到接收这些数据的“标准输入”。程序员们，特别是那些编写过 `C`、`C++` 等软件的人，会理解这意味着什么。只需说明，这是将数据获取到程序的标准方法。\n\
  \n这种方法的主要优势是可以传输的数据量是无限的。\n\n第 206 页\n\n### ACTION\n\n`ACTION` 是描述要执行的脚本或程序的位置和名称的属性。它可能像：\n\
  \n`/scripts/myprogram.pl`\n\n当然，你可以使用位于其他的程序，也许在另一个域名的另一个服务器上，在这种情况下，可以使用程序的完整语法，如下：\n\
  \n`http://www.mydomain.net/scripts/myprogram.pl`\n\n## 使用表单\n\n将表示表单要收集的所有数据的标签放在\
  \ `<FORM>` 和 `</FORM>` 标签之间。\n\n你现在将查看一些用于描述数据输入字段的典型标签。HTML 表单中的几乎所有字段都是 `INPUT`\
  \ 标签类型。\n\n| 注意 |\n| :--- |\n| 后文中的标签名将同时以全大写（例如：`SELECT`）和全小写（例如：`select`）出现。在\
  \ HTML 早期，始终使用大写 HTML 标签是一种习惯。近年来，在整个 HTML 文档中使用小写字母已成为习惯，可能是因为 HTML（或生成它的程序）现在常用\
  \ `C`、`C++` 等。 |\n\n### 文本字段\n\n文本字段可能是最常用的。表单中的几乎所有字段都是这种类型。它们提供普通的单行文本输入。\n\n\
  第 207 页\n\n文本字段的 HTML 代码如下：\n\n```html\n<INPUT TYPE=\"TEXT\" NAME=\"surname\" SIZE=\"\
  30\" MAXLENGTH=\"25\">\n```\n\n`SIZE` 属性是可选的，决定框的大小。`MAXLENGTH` 属性也是可选的，用于限制可以到框中输入的文本量。在这种情况下，限制被设置为\
  \ 25。\n\n### 密码字段\n\n密码字段在大多数方面与文本字段相同。主要区别是输入密码字段的文本是不可见的。每个输入的字符都会被星号代替。\n\n典型密码字段的\
  \ HTML 代码如下：\n\n```html\n<INPUT TYPE=\"Password\" NAME=\"pwrd\">\n```\n\n显然，密码字段对于\
  \ Web 应用程序中的登录功能有用。\n\n### 隐藏字段\n\n隐藏字段与文本字段也非常相似。主要区别是在 Web 页面上看不到该字段。你可能认为这很没用，但它对于静地将数据从一个页面传递到另一个页面或\
  \ Perl 程序非常方便。\n\n典型隐藏字段的 HTML 代码如下：\n\n```html\n<INPUT TYPE=\"hidden\" NAME=\"\
  secret\" value=3000\n```\n\n### 单选按钮\n\n单选按钮的名字来源于带有波段选择机械按钮收音机。你以前按下按钮，之前选中的按钮就会弹出来。这些单选按钮以逻辑相似的方式工作。它们在大多数浏览器中显示是圆形的；如果有多个，当你用鼠标点击其中一个，之前选中的按钮将取消选择。\n\
  \n单选按钮的语法是\n\n```html\n<INPUT TYPE=\"RADIO\" NAME=\"choice1\">\n```\n\n如果你希望这种类型的字段已经是被选中状态，请添加\
  \ `SELECTED` 属性。\n\n```html\n<INPUT TYPE=\"RADIO\" NAME=\"choice1\" SELECTED>\n\
  ```\n\n单选按钮也可以像所示的值：\n\n```html\n<INPUT TYPE=\"RADIO\" NAME=\"choice1\" value=\"\
  1\" SELECTED>\n```\n\n这是一个非常简单的 HTML 示例，以便让你有个概念。\n\n**1.** 打开你的编辑器。\n\n第 209 页\n\
  \n\n\n\n| 单选按钮的 `name` 属性都具有相同的 `name`。正是这一点导致了单选按钮的效果。如果你给它们赋予不同的名称，你就可以一次选择任何一个或所有选项。尝试一下看看。\
  \ |\n\n**8.** 将你的 HTML 保存到 `myhtml` 文件夹或任何你想要保存的地方。\n\n**9.** 打开你的 Web 浏览器。\n\n\
  第 210 页\n\n**10.** 在浏览器的地址框中输入你新 HTML 文件的地址，并按 `Enter` 键。\n\n![Image](img/d3b68c9045e50ddb694e26167a47dea.gif)\n\
  \n**11.** 尝试操作单选按钮并观察效果。\n\n**12.** 更改单选按钮 `name` 属性的名称，看看在你选择它们时它们如何不再互斥重置。\n\n\
  ### 复选框 (Check Boxes)\n\n复选框是另一种实用的输入框。它在原理上与单选按钮相似，但它是为多选设计的——你一定见过某些在线调查表单，其中要求你从列表中选出所有你喜欢或同意的项目。\n\
  \n即使给复选框赋予相同的名称也不会改变它们的行为。这会让它们处理起来稍微困难一些，因此给它们赋予各自独立的名称会更有意义。你可以拥有一个满是复选框的页面，并根据需要选择任意数量的框。\n\
  \n此外，请注意通过再次点击复选框可以取消选择。\n\n```html\n<INPUT TYPE=''CHECKBOX\" NAME=\"selection1\"\
  >\n```\n\n再次，如果你想让此字段显示为已选中状态，请添加 `checked` 属性。\n\n```html\n<INPUT TYPE=\"checkbox\"\
  \ NAME=\"choice1\" checked>\n```\n\n这里有一个与上一个类似的示例，但是针对复选框的。\n\n第 211 页\n\n**1.**\
  \ 与上一个示例一样，打开你的编辑器并开始一个新的 HTML 文件。\n\n**2.** 完成标准的 HTML 头部。\n\n```html\n<html> <head>\
  \ <title>Checkbox Demo</title> <head>\n```\n\n![Image](img/31f202ad3fe221cd3c3ab820d3b0117a.gif)\n\
  \n**8.** 将你的程序保存到 `myhtml` 文件夹中，名为 `check.htm`。\n\n第 212 页\n\n![Image](img/1906f59ae86b4825d51f63010910818e.gif)\n\
  \n### 下拉框 (Drop-Down Boxes)\n\n对于下拉框，你使用 `<SELECT>` 标签。`select` 标签与其他标签不同，因为它不是\
  \ `<input type= >` 类型标签的变体。\n\n一个典型的 `select` 标签如下：\n\n```html\n<SELECT NAME=''country\"\
  > <OPTION value=\"UK\" SELECTED>UK</OPTION> <OPTION value=\"USA\">USA</OPTION> <OPTION\
  \ value=\"France\">France</OPTION> <OPTION value=\"Germany\">Germany</OPTION> </SELECTED>\n\
  ```\n\n`select` 标签内部嵌入了 `option` 标签。每个 `option` 标签包含一个选项。`option` 语句的 `value` 子句是表单实际使用的值。`option`\
  \ 标签之前的文本是实际上在页面上显示的文本，尽管两者通常是相同的。\n\n如果你想在页面加载时将其中一个选项显示为预选，可以在 `option` 标签内包含\
  \ `selected` 属性。\n\n第 213 页\n\n你也可以为 `select` 标签指定 `size`，但这会让用户感到困惑。但是，当你向 `select`\
  \ 标签添加 `multiple` 属性时，可以使用 `size` 标签。这告诉 `select` 标签你可以选择多个选项。用户通过按住 `Ctrl` 键然后用鼠标点击更多选项来实现这一点。你也可以通过点击第一个选项，向下移动\
  \ `select` 列表直到到达想要选择的块的末尾，最后按住 `Shift` 键并点击最后一项来选择一组选项。该块中的所有选择将被选中并变为蓝色。\n\n现在你可以使用\
  \ `select` 标签的 `size` 属性。`size` 属性决定了可见选项的数量。\n\n尝试以下操作查看两种类型 `select` 标签的示例。\n\n\
