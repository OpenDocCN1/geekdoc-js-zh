  \ 405 |\n| **索引** | **407**\n\n第 xv 页\n## 引言\n\nPerl 由 Larry Wall 在 1987 年作为一个博士项目诞生。在许多情况下，它是默认语言。它已经在许多平台上被使用，并成为了一种不可或缺的工具。在当前的时尚下，它是一种解释语言。它还被用于创建动态网站。换句话说，这就是编程语言的设计初衷！\n\
  \n在本书中，你将探索 Perl 的许多特性。Perl 被用于许多平台，并已成为了一种不可或缺的工具。在许多情况下，它是默认语言。它还被用于创建动态网站。换句话说，这就是编程语言的设计初衷！它是，那意味着它是可能的。Perl\
  \ 是一种解释语言。它还被用于构建网站。在许多情况下，Perl 是强大的，Perl 是快速的！几乎没有什么工作是 Perl 不能完成的，而且很多工作用少得的代码就能完成。\n\
  \n在本书中，你将探索 Perl 的许多特性。Perl 是一种解释语言，已经在许多平台上被使用。换句话说，这就是编程语言的设计初衷！它还被用于创建动态网站。在许多情况下，它是默认语言。它已经在许多平台上被使用，并成为了一种不可或缺的工具。它是，那意味着它是可能的。Perl\
  \ 是一种解释语言。它还被用于构建网站。在许多情况下，Perl 是强大的，Perl 是快速的！几乎没有什么工作是 Perl 不能完成的，而且很多工作用少得的代码就能完成。\n\
  \n## 本书是如何组织的\n\n本书的目标是让你在最短时间内达到你的目标，同时帮助你理解其工作原理。\n\n你会发现本书的前几章关于创建 Web 开发环境——安装\
  \ Perl 和 Web 服务器。从这里到本书的一半以后，你会发现许多小型 Perl 代码段，每个用于演示语言的一个特定方面。逐步代码示例配有代码及其执行结果的截图。从那里开始你将构建真实的\
  \ Perl 应用——研究 CGI 和表单，以及文件和电子邮件。\n\n## 谁应该读这本书？\n\n本书假设得尽可能少。它针对对 Web 开发知识较少的人，或者使用过\
  \ WYSIWYG 点点式 Web 创作工具但现在希望在尽可能短时间内创建 Web 应用的人。\n\n## 软件/硬件要求\n\n为了使用本书及其示例，你需要一个\
  \ Web 服务器。如果你使用的是 Windows 95，可以获取 Personal Web Server。这通常可以在免费杂志附赠的 CD 中找到，包含在一个名为\
  \ NT Server 4 Option Pack 的免费产品中。该选项包还包含 Windows NT 4 的 Peer Web Services，它具有相同的功能。Windows\
  \ 98 / ME 用户应该发现他们的机器上已经有了 Personal Web Server。如果没有，请检查你的 Windows 安装光。Windows 2000\
  \ 专业版 / XP 专业版用户应该发现他们的机器上安装了 Internet 信息服务 (IIS)，这更好。UNIX 用户可以使用从 www.apache.org\
  \ 获取的优秀的 Apache Web 服务器（也有 Windows 版本）。\n\n\n\n\n当然，你还需要 Perl 本身；关于从哪里获取它以及如何安装，书中会有详细介绍。\n\
  \n你需要一个编辑器来编写代码。你可以使用简单的编辑器，例如 Windows 中的 `Notepad`，或者 UNIX 平台上的 `Vi` 或 `Emacs`。对于\
  \ Windows 用户，我个人非常喜欢的是 `HTMLPad 2000` (http://www.blumentals.net/)。还有 `OptiPerl`\
  \ (http://www.xarka.com/optiperl/)，它为 Perl 提供了一个完整的集成开发环境 (IDE)。\n\n开发 Perl 并不需要性能极其强劲的机器；几乎任何机器都可以，只要它有足够的内存（`128Mb+`）以及几百兆的空闲空间供你开发即可。\n\
  \n当然，你还需要一个 Web 浏览器；你们大多数人的机器上已经预装了微软的 `Internet Explorer`，但你可能也想尝试 `Opera` (www.opera.com)，这是一个非常优秀的浏览器，内置了一个非常实用的邮件客户端。\n\
  \n第 xviii 页\n\n本页特意留白。\n\n第 1 页\n\n# 1\n\n## 开始入门\n\n本章将介绍如何在你的机器上设置 Perl。这里的重点是\
  \ Windows 用户，但对于其他平台的设置建议也并不缺少。请参阅本书附录 B 中实用的 URL，你可以在那里找到 Perl  way 的网站地址，以及提供详细建议、示例和更新的海量\
  \ Perl 资源网站。当你浏览互联网时，请看看这些网站——它们确实是获取 Perl 相关知识的极佳来源！\n\n具体来说，本章将涵盖：\n\n![Image](img/d938f552af65a53b177029c39d905885.gif)\
  \ 哪里获取 Perl\n\n![Image](img/d938f552af65a53b177029c39d905885.gif) 如何安装 Perl\n\n\
  ![Image](img/d938f552af65a53b177029c39d905885.gif) 配置个人 Web 服务器\n\n第 2 页\n\n## 我可以在哪里获得\
  \ Perl？\n\nPerl 可以从多个来源获取。最著名的是 http://www.activestate.com 和 http://www.perl.com。\n\
  \n我建议你不要下载 Perl 的“开发版本”（development version），因为如果你遇到任何错误，这可能会导致一些困惑。软件的开发版本顾名其义并不是最终的、完全调试过的版本，可能包含导致你误以为代码中写了错误的\
  \ bug。由于这个原因，Perl 的开发版本通常被称为“不稳定”版本。当你对使用 Perl 更有经验时，你可能想要尝试开发版本以利用提供的新功能，在此之前，最好坚持使用最新的“稳定”版本。\n\
  \n除了下载 Perl 之外，你可能还会查看一些为 Perl 开发者提供的资源。这里给出了一些实用的互联网网站，附录 B 中还有更多。\n\n![Image](img/59cdbf9790a710347720b20579d20ea2.gif)\n\
  \n这些网站将让你紧跟 Perl 世界的动态，并能为你提供有关技术、编程思路以及关于 Perl 语言及其使用者的大量新闻的宝贵资源。Perl 是互联网的自然语言，因此你在广维网、新闻组（News\
  \ Groups）、邮件列表和公告板上发现对这种强大且备受尊敬的语言的持续支持也是理所当然。\n\n第 3 页\n\n## 我如何安装 Perl？\n\n在使用\
  \ Perl 之前，你需要安装它并设置好你打算与之使用的 Web 服务器。你很快就会学习如何设置 Web 服务器，但现在，这里是你开始使用 Perl 所需的信息。你可以在“命令提示符”中使用\
  \ Perl，就像你过去可能可能运行 DOS 程序一样！Perl 最初是作为系统管理和报告工具出生的，因此在这种方式下工作得同样出色。\n\n### Windows\
  \ 安装\n\n1. 从 www.activestate.com 或 www.perl.com 下载 Perl。\n\n2. 下载完成后，双击文件开始安装。\n\
  \n3. 按照屏幕上的提示在你的机器上安装 Perl。如果安装失败，你可能需要获取最新版本的微软安装程序（Microsoft Installer）。如果你使用的是\
  \ Activestate 网站，可以在下载（Downloads）链接下找到最新 MS 安装程序的链接。\n\n安装过程应该更新 Windows 路径（path），以便能够找到\
