  \n此示例中的两个循环都与之前的 `while` 和 `until` 循环相似，但正如提到的，主要区别在于 `do` 版本的循环至少执行一次。\n\n## for\
  \ 循环\n\n这与 C/C++ 的 `for` 循环相似。`for` 循环的格式为：\n\n```perl\nfor(loop_variable = initial_value;\
  \ loop_termination_condition; loop_variable_update)\n```\n\n该语法以关键字 `for` 开始，后面跟着一个左括号，然后是\
  \ `for` 语句的初始条件，接着是决定循环是否应该结束的测试，最后是针对被测试变量的更新。这通常是一个增量，也可以是一个递减值。最后是右括号。然后是在测试条件允许时要执行的代码块。\n\
