  \n第 259 页\n\n# 13 在 Perl 中发送电子邮件\n\n电子邮件是 Perl Web 应用程序功能的一项有用补充。在 Perl 中发送电子邮件并不困难。遗憾的是，实现实现的方法各不相同，这很大程度上取决于向你的互联网服务提供商（ISP）获取信息。电子邮件需要一个名为邮件传输代理（MTA）的程序将邮件发送到\
  \ SMTP 服务器。在 UNIX 平台上，壳命令 `sendmail` 可以完成此操作。在 Windows 类型环境中，有来自微软互联网信息服务器（IIS）自带的\
  \ SMTP 服务器，但 Windows 中没有 MTA。相反，你可以使用 Perl 中一个名为 `SMTP` 的包来帮助发送电子邮件，或者使用一个较新的名为\
  \ `sender.pm` 的模块。在 Windows 平台上，也可以使用名为 `Blat.exe` 的程序通过 SMTP 发送电子邮件。\n\n在本章中，你将学习：\n\
  \n![Image](img/d938f552af65a53b177029c39d905885.gif) 什么是 FTP 以及如何使用它\n\n![Image](img/d938f552af65a53b177029c39d905885.gif)\
  \ 如何在 Perl 中使用 SMTP 发送电子邮件\n\n![Image](img/d938f552af65a53b177029c39d905885.gif)\
  \ 如何使用 `Blat.exe` 发送电子邮件\n\n![Image](img/d938f552af65a53b177029c39d905885.gif) 如何在\
  \ UNIX 服务器上使用 `Sendmail` 发送电子邮件\n\n第 260 页\n\n由于使用电子邮件的方法因 ISP 而异，我将通俗地描述每种方法，但会带有真实的代码。显然，通过截图证明电子邮件已发送是困难的，但我会像往一样描述并展示代码。如果你有任何问题，请咨询你的\
  \ ISP；或者在开始之前，如果有关于你特定环境需要了解的任何，请询问你的 ISP。大多数问题将是微小的——例如，你可能需要更改 `Blat.exe` 或 `Sendmail`\
  \ 程序的路径。\n\n无论使用什么平台，发送电子邮件的方法都是相似的。无论你使用什么硬件或软件，发送电子邮件都需要某些信息。例如，以下数据项是始终需要的：\n\
  \n• 收件者\n• 主题\n• 正文\n• 发件者\n\n有了这些基本信息，你就可以编写一个 Perl 程序来发送电子邮件。\n\n正如我所说，所有平台发送电子邮件的基本方法是类似的。通用方法是：\n\
