    ![Image](img/d938f552af65a53b177029c39d905885.gif) 学习如何使用 HTML 表格


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 学习如何通过 GET 和 POST 方法获取表单数据


    第 222 页


    ## 从表单接收数据


    如既往，演示如何使用表单的最佳方法是通过一个简单的示例。但，你应该学习 HTML 的另一个功能：表格。现在是讨论 HTML 表格的好时机，因为它们对于创建整洁的表单布局非常有用！


    ### HTML 表格


    HTML 表格用于（以及其他用途）格式化网页的内容。在本节中，你将学习如何使用它们让 Web 输入 HTML 表单看起来更漂亮。表格对于表单来说不是必须的——但它们确实能让表单看起来更好。你可以直接使用空格
    `&nbsp;` 和换行符 `<BR>` 来在页面上定位表单元素，但效果可能不太理想。


    正如你所预期的，表格以 `<TABLE>` 标签开始。`<TABLE>` 标签有许多属性；例如，你可以使用 `background = imagename.jpg`
    来设置表格的背景图片，就像你对 `<BODY>` 标签做一样。同样，你可以使用 `bgcolor` 属性设置背景颜色。


    你可以使用表格标签的 `width=nnn` 或 `width=nn%` 属性来设置表格宽度，类似于 `<HR>` 水平规则标签的 `width` 属性。


    一个典型的表格标签可能如下：


    ```html

    <table width=600 bgcolor=lightblue>

    ```


    这段代码表示创建一个宽度为 600 像素、背景颜色为浅蓝色的表格。简单不是吗？


    表格通过成为你预期的样子来实现目的：一个行列组成的表格，你可以在其中放置选择的元素、图片或文本。


    在表格顶部，你可以有一个可选的“表头”行，用于标题等内容。表头行如下：


    ```html

    <tr><th width=200>列标题 1</th><th width=200>列标题 2</th><th width=200>列标题 3</th><tr>

    ```


    第 223 页


    `<tr>` 标签标志表格行的开始。`<th>` 标签定义一列的表格表头，在这种情况下，它是表头的宽度，因此整个列被固定在 200 像素（同样，也可以使用百分比）。`</th>`
    标签关闭此表头。在这个示例中，有三个相同的表头，包含了表格的三个列标题。


    注意，虽然在本示例中表头的宽度设置为 200 像素，但如果 `<th>` 和 `</th>` 标签之间的标题超过了 200 像素宽度，列将拉伸（即表头标签正下任何单元格都会拉伸），以容纳你放置在其中的文本、图像或任何内容。


    在表头的末尾，使用 `</tr>` 标签关闭行。


    随后的行可以包含 HTML 所说的“数据”。数据行的格式与表头行非常相似，只是单个单元格是由 `<<td>` 标签而不是表头行的 `<th>` 标签定义的。表头行或数据行也可以有自己的宽度标签、背景颜色标签等。


    一个数据行可能如下：


    ```html

    <tr><td>列标题 1</td><td>列标题 2</td><td>列标题 3</td><tr>

    ```


    HTML 表格可以包含许多行数据，正如你将看到的，这在基于 Web 的应用程序中非常有用。


    每个 `<td>` 或 `<th>` 标签都可以自己的背景颜色 `bgcolor`、`width` 和 `height` 属性。它们还可以用于对齐单元格内容的标签。在水平方向，对齐可以指定为左、中或右。在垂直方向，对齐可以指定为顶、中或底。例如，`<<td>`
    标签可以这样指定对齐属性：


    ```html

    <td align=''center" valign="top">

    ```


    注意，`valign` 和 `height` 属性也可以添加到 `<tr>` 标签中。


    正如你预期的，HTML 表格使用 `</table>` 标签关闭。


    下面的表单示例显示了如何使用表格定位表单元素以产生整洁的布局。


    第 224 页


    1. 打开你的编辑器。

    2. 创建一个新的 HTML 页面。


    ![Image](img/f6b12346217b6b43074253fe70df9fa5.gif)


    | NOTE |

    | :--- |

    | 你正在使用 POST 方法。你在第 9 章中学习了一些关于这种方法的知识。在本章中你将学习更多关于 POST 和 GET 的知识。 |


    第 225 页


    ![Image](img/484d77d767f5d86df2f0e1873db8a32c.gif)


    第 226 页


    ![Image](img/e5cbbeadfe8be06f2039f89989b72b35.gif)


    13. 将表单 HTML 保存为 11-01.htm，放在 Web 服务器 root 文件夹下的合适目录下。


