    ## 我可以在哪里获得 Perl？


    Perl 可以从多个来源获取。最著名的是 http://www.activestate.com 和 http://www.perl.com。


    我建议你不要下载 Perl 的“开发版本”（development version），因为如果你遇到任何错误，这可能会导致一些困惑。软件的开发版本顾名其义并不是最终的、完全调试过的版本，可能包含导致你误以为代码中写了错误的
    bug。由于这个原因，Perl 的开发版本通常被称为“不稳定”版本。当你对使用 Perl 更有经验时，你可能想要尝试开发版本以利用提供的新功能，在此之前，最好坚持使用最新的“稳定”版本。


    除了下载 Perl 之外，你可能还会查看一些为 Perl 开发者提供的资源。这里给出了一些实用的互联网网站，附录 B 中还有更多。


    ![Image](img/59cdbf9790a710347720b20579d20ea2.gif)


    这些网站将让你紧跟 Perl 世界的动态，并能为你提供有关技术、编程思路以及关于 Perl 语言及其使用者的大量新闻的宝贵资源。Perl 是互联网的自然语言，因此你在广维网、新闻组（News
    Groups）、邮件列表和公告板上发现对这种强大且备受尊敬的语言的持续支持也是理所当然。


    第 3 页


    ## 我如何安装 Perl？


    在使用 Perl 之前，你需要安装它并设置好你打算与之使用的 Web 服务器。你很快就会学习如何设置 Web 服务器，但现在，这里是你开始使用 Perl 所需的信息。你可以在“命令提示符”中使用
    Perl，就像你过去可能可能运行 DOS 程序一样！Perl 最初是作为系统管理和报告工具出生的，因此在这种方式下工作得同样出色。


    ### Windows 安装


    1. 从 www.activestate.com 或 www.perl.com 下载 Perl。


    2. 下载完成后，双击文件开始安装。


    3. 按照屏幕上的提示在你的机器上安装 Perl。如果安装失败，你可能需要获取最新版本的微软安装程序（Microsoft Installer）。如果你使用的是
    Activestate 网站，可以在下载（Downloads）链接下找到最新 MS 安装程序的链接。


    安装过程应该更新 Windows 路径（path），以便能够找到 Perl 可执行文件。打开一个 MS-DOS “提示符”（prompt）命令行窗口运行 Perl
    并验证其版本。


