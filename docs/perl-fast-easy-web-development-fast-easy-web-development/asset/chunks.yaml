    `Boolean` 一词源于数学家乔治·布尔（George Boole）的名字，他是逻辑形式代数规则的先驱。计算机依赖逻辑来工作，因此你经常经常会遇到 `True`（通常用值
    1 表示，也可以用任何非零值表示）和 `False`（通常用值 0 表示）。


    数值 `True` 值是任何非零值，因此数值零等同于 `False`。所以 1、5、7、232、-175 等都是 `True`。只有数值零是 `False`。我们也可以对字符串应用
    `True/False` 检查。单词 `Olympic` 是 `True`，包含 `''0''` 的字符串是 `True`，单个空格也是 `True`。只有完全没有任何字母或数字字符才是
    `False`。


