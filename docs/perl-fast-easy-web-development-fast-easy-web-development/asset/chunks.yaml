    **1.** Open a new program in your editor, and again bring in the `WIN32::OLE`
    modules.


    ```perl

    #!/usr/bin/perl

    use Win32::OLE;

    use Win32::OLE::Const ''Microsoft ActiveX Data Objects'';

    ```

