    在类定义中，你会编写方法（在普通编程术语中称为函数）来处理这些操作中的每一个。


    有了对象的定义（以类的形式存在），你现在可以创建银行账户对象本身了；事实上，你可以创建很多这样的对象。普通语言可能只有整数数组等，而在面向对象的语言中，你也可以拥有对象数组。这确实非常强大。设想一下在普通的过程化语言中尝试跟踪大量的账户。


    面向对象的编程要点之一是，对象内部的数据可以被设置为仅通过该对象的方法进行访问。这有助于确保数据的完整性并减少错误。这种特征被称为`数据隐藏`（data hiding）。


    从类定义创建对象被称为`实例化`（instantiation）。


    目前已经开发出一种记法法，帮助你描述访问对象内部访问方法的行为。这有时被称为`点表示法`（dot notation）。例如，如果你想访问对象的 `add_funds()`
    方法，你可以写成：


    ```javascript

    account.add_funds( )

    ```


    注意 `account` 和 `add_funds()` 之间的点。


    如果你一直跟得上我的思路，这里还有一个转折。


    第 312 页


    创建了你的账户类后，你现在可以稍微改变账户的目的。例如，你可以拥有现期账户和储蓄账户。定义账户的基本信息（账户号码、余额等）可以存储在一个超类中。然后其他类可以继承这个类，并提供描述特定类型账户的更具体的信息。这是面向对象编程潜在灵活性的说明。这种对继承的使用是面向对象语言中广为讨论的代码重用优势的例子。


    让我们来举一个愚蠢的例子，创建一个名为 `Animal` 的类。


    关于动物，你可以存储哪些数据？


    肉食性（真/假） 腿的数量（整数）


    你可以拥有哪些方法（函数）？大多数动物都会发出某种声音，所以你可以有一个名为 `talk()` 的方法


    ```javascript

    talk( );

    ```


    这提供了一个基础的动物类。你可以继承这个类并特化为更具体的子类。你的子类可以继承父类（或更高层的类）的基础方法。因此你可以为猫创建一个类，为狗创建一个类，它们都基于动物超类，但都有它们自己的描述与基础动物类差异的特化内容。


    现在，为你创建的每个对象调用 `talk()` 方法，例如 `dog.talk()`、`cat.talk()`，会导致每个对象产生适当的响应——狗会汪汪，猫会喵喵。


    这种产生等效但适当响应的能力被称为`多态`（polymorphism）。也许你已经开始看到这种行为的可能用途。


    关于面向对象编程所有方面的深入讨论超出了本书的范围，但我希望你能够开始看到面向对象优于传统过程化编程的可能优势。现在让我们回到 JavaScript 中。


    第 313 页


    ### JavaScript 的元素


    JavaScript 使用对象。你在任何特定时间可能停留的 HTML 页面被称为`document 对象`（document object）。还有许多其他对象，例如窗口对象、表单对象、表单元素对象（包含
    `<INPUT TYPE=…>` 元素）和按钮对象。


    这些许多对象会产生`事件`（events），即用户操作的结果或页面或窗口上某些元素状态的变化。例如，点击表单上的按钮会触发 `onClick` 事件。当你将鼠标悬停在图像上时，你会触发
    `onMouseOver` 事件。你可以将 JavaScript 代码附加到这些事件上以导致某些事情发生。


    和其他面向对象的语言一样，你通过使用方法来让对象发生某些情况。这里有一个简单的例子。如果你想将光标移动到名为 `MyForm1` 表单上名为 `Surname`
    的文本框，你会写：


    ```javascript

    document.MyForm1.Surname.focus();

    ```


    再次注意点表示法。这意味着 `document` 对象包含一个名为 `MyForm1` 的表单对象，而对象 `MyForm1` 包含一个名为 `Surname`
    的对象。名为 `Surname` 的对象内部有一个名为 `Focus()` 方法，这就是示例中正在调用或执行的内容。所以你有包含在对象中的对象，有点像俄罗斯套娃。


    还要注意方法名末尾的括号。这些显示这是一个方法，但它们也被用于向接受参数的方法传递参数。在我们之前的银行账户示例中，你可能想添加资金。当你使用该方法执行此操作时，你可以写道：


    ```javascript

    account1.addfunds(500.00)

    ```


    这意味着（在这个例子中）你正在向 `account1` 添加 $500.00。


    在很多时候，方法名后的括号是空的。有时，正如上一个例子一样，括号被用于向方法传递信息。


    第 314 页


    所以你现在对对象是如何使用的有了一个概念；你将通过一些示例在此基础上构建。但在那之前，你必须学习如何将 JavaScript 整合到你的 Web 页面中。


    ### 你把 JavaScript 放在哪里？


    现在你对 JavaScript 是什么有一定的了解，是时候看看把它放在哪里了。要告诉 Web 浏览器你正在使用任何脚本，你必须使用 `<SCRIPT>` 标签。这是一个通用
    HTML 标签，与 JavaScript 本身无关。它被用来指出后面跟着某种脚本。默认脚本语言（至少对于 IE 而言）是 VBScript。所以，如果你想使用
    JavaScript，你应该使用


    ```html

    <SCRIPT LANGUAGE=''">

    ```


    如果不指定语言，浏览器通常足以识别你正在使用的语言，但不要假设。`</SCRIPT>` 用于结束所有脚本，无论是 VBScript、JavaScript 还是其他语言。注意
    JavaScript 有多个版本，当你变得精通并想要扩展脚本的复杂度时，你需要意识到这些差异。


    第 315 页


    另一个需要记住的是，你可以将脚本放在 HTML 文档的 `<BODY>` 中或 `<HEAD>` 中。


    通常，如果你希望在页面加载时执行 JavaScript，就会在文档的 `<body>` 中使用。放置在 `<head>` 中的 JavaScript 通常是由于需要，或者说是被“调用”，因为执行它的动作被称为调用。头部的脚本形式为`函数`（离散的代码段），每个函数都有特定的目的。


    ###更多 JavaScript 语法


    JavaScript 到处使用代码块。这些是用花括号括起来的代码行，非常像 Perl。


    例如：


    ```javascript

    { Document.write (''Hello There!"); Alert("This is a pop-up box!"); }

    ```


