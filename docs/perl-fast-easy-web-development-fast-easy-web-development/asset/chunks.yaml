    ## 16 The CGI.pm Module


    In this book, you have so far learned (amongst other things) about Perl, HTML,
    and how to create HTML from Perl. This has been useful, as learning about how
    to create HTML-the-fly from Perl has reinforced the HTML that you have learned.
    In this chapter you''ll learn a little about a module called `CGI.pm`, which simplifies
    the creation of HTML from Perl.


    Specifically, you''ll learn:


    ![Image](content/d938f552af65a3b177029c39085.gif) What `CGI.pm` does


    ![Image](content/d938f552af65a3b177029c39085.gif) How to start and end an HTML
    page with `CGI.pm`


    ![Image](content/d938f552af65a3b177029c39085.gif) How to use forms with `CGI.pm`


    ![Image](content/d938f552af65a3b177029c39085.gif) How to use `CGI.pm` in object-oriented
    mode


    Page 342


    ### What''s the Idea Behind the CGI.pm Module?


    The `CGI.pm` module attempts to simplify and formalize the functions used in CGI
    applications. Some of the actions that need to be taken in the execution of CGI
    programs are not intuitive, and the reason for the necessity of some of them is
    lost in the mists of time—way back in the 1990s!


    Perl is a powerful language and yet it still has to perform some obscure gymnastics
    to do some things that should be fairly easy. The truth is that the existing technologies
    have moved on and some new technologies have arrived, but in many cases we still
    have fairly primitive mechanisms available to us to access these technologies.


    You have seen how tedious it is to send headers (`print "Content-type: text/html\n\n";`)
    and how cumbersome it can be to get data back from forms. The `CGI.pm` module
    is intended to simplify all of this and provide an interface into the CGI functions
    and enable you to create HTML forms and back-end CGI scripts much more quickly
    and easily. There are many functions available in the `CGI.pm` module, and in
    this chapter you are going to learn some of the commonly used.


    To use the `CGI.pm` functions, you must import the `CGI.pm` module methods. You
    do this by using the following statement; this statement makes the functions contained
    within the `CGI.pm` module available within your program:


    ```perl

    use CGI qw(:standard);

    ```


    The `qw` is simply a way of wrapping `:standard` in quotes.


    You can also use:


    ```perl

    use CGI '':standard'';

    ```


    The `:standard` refers to the standard set of functions, so that you can use a
    less long-winded way of referring to functions.


    The best way to learn some of these `CGI.pm` functions quickly is by example,
    so let''s get right on with it.


    Page 343


