    ### **初学 Perl**


    所有的 Perl 程序都应该以亲切地称为"shebang"的语句开头。shebang 语句应该出现在程序第一行第一列的开头，并且它应该包含指向 Perl 解释器
    `perl.exe` 的文件路径。为什么它应该被称为"shebang"语句尚无争议，但它是计算机中用于某些特殊字符的典型命名类型（感叹号通常被称为"shriek"
    或 "splat"）。


    shebang 语句以 `#` 符号开头，表示它是一行注释。然而，它实际上是此规则的唯一例外！在 UNIX 系统上，这一行告诉操作系统去哪里寻找 Perl，以便执行该程序。


    | **注意** |

    | 记住：Perl 程序始终应该以 `#!pathname_to_Perl,` 开头，位于第 1 行第 1 列。 |


