    The syntax is as follows:


    ```

    $position = index($teststring, $substring);

    ```


    Or


    ```

    $position = index($teststring, $substring, $startposition);

    ```


    So, for example


    ```perl

    $teststring = ''''Perl Fast & Easy Web Development"; $position = index($teststring,
    "Web"); print "The position of \"Web\" in \$teststring is: $position \n";

    ```


    will display


    The position of "Web" in $teststring is: 17;


    | NOTE |

    | :--- |

    | The first location in the string is 0\. If the substring being searched for
    is not found, the function will return the value –1. |


    ### The rindex() Function


    The `rindex()` function finds the rightmost position of the first occurrence of
    another string. That is, it searches the string backwards. In all other respects,
    this function is the same as the `index()` function.


    Page 398


    The syntax is as follows:


    ```perl

    $position = rindex($teststring, $substring);

    ```


    Or


    ```perl

    $position = rindex($teststring, $substring, $startposition);

    ```


    So, for example


    ```perl

    $teststring = ''''Perl Fast & Easy Web Development"; $position = rindex($teststring,
    "Web" ); print "The position of \"Web\" in \$teststring is: $position \n";

    ```


    will also display


    The position of "Web" in $teststring is: 17;


    ### The substr() Function


    The `substr()` function enables you to extract a partial string from another string.
    The syntax is as follows:


    ```

    Substr( $wholestring, offset, length, $replacementstring);

    ```


    This means inspect `$wholestring` (which can be a variable or a literal), starting
    at `offset` position, for a length of `length`, and replace the substring if found
    with the contents of `$replacementstring` (which can also be a literal).


    So the following:


    ```perl

    $wholestring = "Cats are cute"; $substring = substr( $wholestring, 0, 4, "Dogs");
    print $substring;

    ```


    will you give you


    Cats are cute


    Page 399


    If you leave out the `$replacementstring` parameter, then just the substring is
    returned so that the same code as above but without the `$replacementstring` parameter,
    would give


    Cats


    `substr()` is quite a powerful function.


    ### The tr/// Operator


    The `tr///` operator is not, strictly speaking, a function, but it can be argued
    that it provides one. The syntax of the `tr///` operator is


    ```

    tr/ searchstring / replacestring /

    ```


    The forward slashes are simply delimiters.


    The `tr///` operator is very powerful. Consider the following:


    ```perl

    $newstring =~ tr/a-z/A - Z/

    ```


    This will replace every character in a string, of the range a to z, and replace
    it with the uppercase equivalent A to Z.


    Note the `=~` symbol. This is called the *binding operator* and if it is not used,
    the operation is carried out on whatever is in `$_`. In this case you will not
    use a variable on the lefthand side, like this:


    ```

    tr/a-k/A-K

    ```


    You can also add modifiers onto the end of the translation operator. So


    ```perl

    tr/a-k/h-k/c

    ```


    (where `/c` is the modifier) replaces any character that is not in the search
    string.


    ```

    tr/a-k/h-k/c

    ```

