    ### UNIX Installation


    Installing Perl on a UNIX machine is very different from doing so on Windows.
    To install Perl on a UNIX machine you must first obtain a copy, as it is known,
    from either http://www.perl.com or http://www.activestate.com. Note that there
    is a Production version and a version that is often marked as "Development." I
    recommend that you go for the Production version (sometimes referred to as the
    "Stable" version).


    Having obtained your UNIX Bundle, you must now build your system. For this you
    will need an ANSI C Compiler. There are a number to choose from, and you may well
    have one on your UNIX "box."


    In fact, you may already have a copy of Perl on your machine, as many machines
    are now shipped with Perl as part of the operating system.


    As with the Windows test, try typing:


    ```bash

    Perl -v

    ```


    If you have Perl you will get a version report; if not, you will get a "UNIX command
    not found" message.


    It is worth checking around on the activestate.com or perl.com Web sites to see
    what packages are available. Things are improving all the time, and it is likely
    that you will find an easy-to-install version for your platform. Just download
    it, follow the instructions to the letter, and all should be fine.


    Of course there is also a version of Perl for the Mac. Known as MacPerl, it is
    available from http://www.perl.com. You should be able to find a downloadable
    version there and unpack it using the well-known StuffIt expander program. If
    you don''t have a copy of that, go to http://www.aladdinsys.com/expander/ and
    download a copy. (Incidentally, StuffIt is available for other platforms, too!)


