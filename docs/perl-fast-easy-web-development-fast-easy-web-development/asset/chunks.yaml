    ## 15 Another Diversion: JavaScript


    You know how to create a form and how to get the data sent by the form into your
    Perl program. But what if the data entered by the user is invalid? You can get
    your Perl program to return the form with an indication of what the problem is,
    but this is an inefficient way of checking the form data because each error discovered
    means the page is re-sent over and over until the user has corrected all mistakes.
    Wouldn''t it be nice if you knew (as far as possible) that the data being received
    into your Perl program was okay?


    This is where JavaScript comes in. JavaScript can check your form data at the
    client (that is, within your Web page) and can prevent your form being submitted
    until all the errors in the entered data have been corrected. This means that
    you get instant notification of any errors and there is (hopefully) only one trip
    across the Internet for your form.


    In this chapter you will learn about:


    - Object orientation

    - JavaScript syntax

    - JavaScript variables

    - Using JavaScript to validate form data


    Page 310


    ### A Few Notes about JavaScript


    JavaScript is an interpreted, object-oriented programming language developed for
    use in HTML Web pages (that is, client-side programming). Although it can also
    be used as a server-side programming language, we are not going to discuss that
    aspect of JavaScript here.


    JavaScript is similar in its syntax to `Java` and `C++`, and behaves in much the
    same way. However, JavaScript is not the same as `Java`. `Java` enables you to
    build full-blown, stand-alone applications; JavaScript does not. It simply reacts
    with objects within a Web page.


    ### Object Orientation


    Object orientation attempts to bring the real world into programming. Real world
    objects (I''ll give an example of such an object soon) are represented as software
    objects. In theory, object-oriented programs are simpler, more reliable, and more
    closely model their real-world subjects.


    Object orientation should also be more efficient in terms of software creation,
    as you do not, in theory, have to keep rewriting things. Objects are described
    using what is known as a `class`. This class contains all the definitions of the
    data that are relevant to that object and all of the functions that operate upon
    that data. Classes can be reused and modified to suit a particular purpose without
    having to rewrite things from scratch. This gives rise to a property known as
    `inheritance`.


    An example of a real-world object is a bank account. You could have a `class`
    describing such an account. The data for a bank account would include:


    - Account number

    - Account name

    - Sort node

    - Balance


    These items describe the data contained within the description of the `class`.


    Page 311


    Having decided upon the data that might be contained within a `class`, you now
    need to be able to manipulate these data items to read, write, update, and delete
    them. That is, to use the account you need to be:


    - Open the account

    - Add funds

    - Debit funds

    - Close the account

