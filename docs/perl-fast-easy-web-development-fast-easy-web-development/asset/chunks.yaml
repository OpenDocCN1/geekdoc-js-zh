    ### **The listcontacts.pl Program**


    The listcontacts.pl program simply reads the contents of the database table and
    lists the first name, last name, and town fields for each record. (A view of the
    database design is at the end of this chapter). In this program, ADO is being
    used to connect with the Access database. There should be no surprises here, but
    if something doesn''t make sense to you, refer to Chapter 14, ''''Databases."


