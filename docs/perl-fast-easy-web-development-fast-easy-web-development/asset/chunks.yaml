    ### What are Hashes?


    Hashes (sometimes referred to as *associative arrays*) are similar to "normal"
    arrays in as much as they are a list of scalar values. However, the way in which
    they are accessed is different—the mechanism utilizes "keys" rather than the simple
    numeric subscript. The important thing to remember about hashes is simply the
    order in which you quote or specify them, that is, the key and then the value.
    In most other respects, hashes might be considered a bucket into which you can
    pour data.


    Hashes have a prefix just like scalars and arrays do. For hashes, the prefix is
    the `%` symbol. This denotes, when used, that you are referring to the whole hash;
    if you want to access a single element of a hash you use the `$` prefix as you
    do with arrays. This might seem confusing until you consider that you are only
    referencing a single scalar within the hash; therefore, you use the scalar notation.
    Only when you are accessing the whole hash do you use the hash `%` prefix symbol.


    Hashes provide you with a useful lookup mechanism that is a bit like some database
    tables. A unique key is used to locate a given value. Hashes are uniformly fast;
    that is, hashes can grow very large with very little degradation in speed, and,
    as long as your machine has the resources to cope with them, you can make them
    as large as you like!


    Hashes have many uses, not least in Web applications, where they are useful for
    handling input from HTML forms, CGI environment variables, and other.


    ### Hash Prefixes


    Hashes have a prefix just like scalars and arrays do. For hashes, the prefix is
    the `%` symbol. This denotes, when used, that you are referring to the whole hash;
    if you want to access a single element of a hash you use the `$` prefix as you
    do with arrays. This might seem confusing until you consider that you are only
    referencing a single scalar within the hash; therefore, you use the scalar notation.
    Only when you are accessing the whole hash do you use the hash `%` prefix symbol.


    Page 97


    ### Initializing a Hash


    To initialize a hash, simply do:


    ```perl

    %animals = ();

    ```


    You now have a hash called `animals`, with no keys or values.


    ### Creating a Hash


    You can add key-value pairs to a hash individually or many at time. To add elements
    to a hash you can do something like:


    ```perl

    $animals{''Horse''} = ''Red Rum'';

    ```


    This adds one key-value pair to the hash `animals`. (Note the `$` prefix. As you
    saw previously, you use the `$` prefix because you are accessing a single element
    of the hash).


    If you want to add several at once, you can do so in the following manner:


    ```perl

    %animals = (''Red Rum'', ''Horse'', ''Jaws'', ''Shark'', ''King Kong'', ''Gorilla'');

    ```


    Now, this is okay, but have you noticed what starts to happen as you read along
    the list? As you grow the list, imagine what happens when you try to jump into
    the middle of the list. With the subjects and names you''re using here it is fairly
    obvious which is a key and which is a value. However, in some cases this will
    not be quite obvious, and so Perl has another notation that helps you to determine
    which is which, no matter how long the list. The notation is known as the *comma-arrow
    operator* and looks it like:


    ```perl

    %animals = (Horse => ''Red Rum'', Shark => ''Jaws'', Gorilla => ''King Kong'');

    ```


    Now you can easily see that the `=>` operator is pointing from the key to the
    data for that pair in the hash. Not only that, but you can now add newline / carriage
    returns and other whitespace characters and it will still work, so you can make
    your hash definitions more readable in your programs by using one key-value pair
    per line, like this:


    ```perl

    %animals = (Horse => ''Red Rum'', Shark => ''Jaws'', Gorilla => ''King Kong''
    );

    ```

