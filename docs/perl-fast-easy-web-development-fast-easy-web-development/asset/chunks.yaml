    使用 `CGI.pm` 函数似乎并不比使用 `print` 函数和普通的 HTML 更容易。这里有一个例子。要使用 `CGI.pm` 打印一条水平线，你可以这样做：


    ```

    print hr( );

    ```


    并不困难，但也不算更短。当然，在如今的现代编程中一致性有很多优点可言，如果你正在使用 `CGI.pm` 模块，也许你可能在整个程序中使用它，以避免困扰后来的维护者。但坦率地说，将标准
    Perl 与 `CGI.pm` 内容混合使用，允许你将 `CGI.pm` 模块的有用功能与你已经熟悉的其他 Perl 标准功能结合起来。


    其他类似的“非成对标签”（例如 `<BR>` 和 `<P>` 标签）以类似的方式处理。请尝试下一页的短程序，演示如何通过 `CGI.pm` 使用其他标签。


    第 346 页


    ![Image](img/673b05f5a00ba13fd29752b1e3bc4fde.gif)


    | **注意** |

    | :--- |

    | 有序列表之前是 HTML 中 `<h3>Languages</h3>` 标题的 `CGI.pm` 等效项。 |


