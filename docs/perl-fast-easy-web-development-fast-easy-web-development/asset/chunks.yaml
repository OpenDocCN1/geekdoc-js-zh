    ### UNIX 安装


    在 UNIX 上安装 Perl 与在 Windows 上这样做非常不同。要在 UNIX 上安装 Perl，你必须首先获取一个副本，如周知，来自 http://www.perl.com
    或 http://www.activestate.com。注意，有一个生产版本和一个标记为“开发”的版本。我建议选择生产版本（有时被称为“稳定”版本）。


    获取 UNIX 压缩包后，你现在必须构建你的系统。这需要一个 ANSI C 编译器。有很多种选择，并且你的 UNIX “机器”上很可能已经有了。


    事实上，你的机器上可能已经有了 Perl 副本，因为许多机器现在已作为操作系统的一部分附带 Perl。


    就像 Windows 测试一样，尝试输入：


    ```bash

    Perl -v

    ```


    如果你有 Perl，你将得到一个版本报告；如果没有，你会收到“UNIX command not found”的消息。


    值得查看 activestate.com 或 perl.com 网站看看有哪些可用包。技术在不断进步，你可能会找到适用于你平台的易安装版本。只需下载它，严格按照说明操作，一切都应该是正常的。


    当然，还有一个适用于 Mac 的 Perl 版本。被称为 MacPerl，可以从 http://www.perl.com 获取。你应该可以在那里找到可下载版本，并使用著名的
    StuffIt 解压程序进行解压。如果你没有该程序的副本，请访问 http://www.aladdinsys.com/expander/ 并下载。（顺便提一下，StuffIt
    也适用于其他平台！）


    个人 Web 服务器 (PWS)


