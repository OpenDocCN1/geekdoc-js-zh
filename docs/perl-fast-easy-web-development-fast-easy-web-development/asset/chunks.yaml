    |


    ![Image](img/030c079e2d38edf6902278540e771007.gif)


    | TIP |

    | 用鼠标拖动角部并观察线条宽度的变化。请注意，75% 的规则会自动调整，以保持其相对于窗口宽度的比例。 |


    第 169 页


    ### 段落标签


    段落标签 `<P>` 用于将文本部分拆分为多个段落。它比仅用于强制换行的 `<BR>` 标签更好。`<P>` 标签有一个结束标签 `</P>`，并且应该使用它。现在你可能不使用它也没关系，但它的本意是应该在那里的，而且无法保证未来的浏览器不会坚持要求它存在。无论如何，它有助于保持你的
    HTML 整洁，所以请使用它吧！


    这是一个段落标签的简单示例。


