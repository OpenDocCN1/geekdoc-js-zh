    在本章中，你将学习如何编写作为构建简单通讯录基础的脚本。为了简单起见，将省略 HTML 表单，并且你将构建的数据库中要输入的值将硬编码在 Perl 代码中。显然，这不是一种实际的安排，但你已经知道如何从表单获取数据了（如果你忘记了，请参阅第
    11 章）。


    现在，请集中学习操作简单通讯录数据库所需的技巧和代码。


    ## 数据库设计


    这将是一个在 Access 97 中易于实现的简单数据库。你将使用的数据项如表 14.1 所示，以及一些你可能想要输入以测试代码的典型测试数据。


    第 279 页


    | 表 14.1 数据库项目和测试数据 |

    | **ID** | **名** | **姓** | **地址** |

    | :--- | :--- | :--- | :--- |

    | 1 | Joe | Bloggs | 14 High Street |

    | 2 | Fred | Smith | 1 Sun Street |

    | 3 | Jane | Doe | 4 Love Lane |

    | 4 | Angus | McCoatup | 17 Lake Close |


    注意 ID 列。在本章中不会使用它，但当你第 17 章将这个简单示例扩展为“联系人数据库”案例研究时，你会用到它。简而言之，`ID` 字段（或你定义的名称）是数据库中每条记录（或行）的唯一引用。这是必要的，因为对数据库的某些操作需要确切知道你指的是哪条记录。例如，如果你必须从数据库中删除一条记录，唯一的
    `ID` 可以确保删除的是正确的记录，且仅删除正确的记录。这比某种系统要好得多，例如，如果你尝试删除一个姓 Smith 的人的记录，数据库将不知道你指的是哪一个，因此可能会删除所有这些人。当然，有些时候你想要做这样的操作，但通常你只想提取某条特定的记录，这时
    `ID` 字段（即唯一键）就非常有用了。


    数据库的另一个考虑因素是`数据类型`。并不是所有数据都是文本数据。还有日期时间字段（以产生问题而闻名）、布尔字段（用作标记，包含表示是/否、开启/关闭、1/0
    或 True/False 的值）以及备忘字段（能够容纳大量文本）。


    最后，还有`规则`和`默认值`。规则的一个示例可能是“允许零长度字符串”。默认值用于在表单未返回值时为字段填充一个值。


    数据库可以非常复杂。你可以拥有大量的表，其中许多表通过外键系统相互链接，以便一个表可以对另一个表进行查找。这种类型的数据库以及随之来的复杂 SQL 超出了本书的范围，但随着你构建简单应用程序的经验和信心增长，你将希望扩展在这方面的知识。


