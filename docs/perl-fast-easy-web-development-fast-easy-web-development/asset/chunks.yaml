    ## **5


    Arrays**


    *Arrays* are simply collections of scalars. The array has a name much like the
    simple scalar does, but it also has a number of elements. Each element has the
    same name and is pointed at by a numeric subscript.


    In this chapter you will learn about:


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Declaring arrays


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Loading arrays


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Joining arrays


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Array function and manipulation


    Page 82


    Conceptually, an array can be thought of as a number of ''''pigeon-holes," each
    of which can contain separate items of data. As mentioned, each element shares
    a common name with all of the others, and uses a *subscript* (a sort of address)
    to determine which element in the array is being referenced.


    You will remember that the scalar variable was preceded by the dollar sign ($).
    The array uses a prefix to make it instantly recognizable just as the scalar variables
