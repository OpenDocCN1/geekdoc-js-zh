    ## Acknowledgments


    There are many people that I should like to thank and I am bound to forget someone,
    I am sorry if one of them is you!


    First I should like to thank Julie C. Meloni, who told me my first sample text
    was good enough. Also thanks to Lynette Quinn for her encouragement in the early
    stages. Likewise thank you to Estelle Manticas, for encouraging me with her good
    humor and helpful remarks, and for turning my gibberish into this book. Thanks
    to Kevin Harreld, who kept me on the rails throughout.


    Thank you to my wife Pauline and my daughter Victoria for putting up with my absences.


    I would also like to thank my past UWE lecturers, especially Simon Langley, Nigel
    Baker and Jane Berry, who fired up my enthusiasm for computing, and in the case
    of Simon, fired up my sense of humor too!


    Thank you to Mum and Dad for being my Mum and Dad!


    Finally, a special thank you to my good friend Clarisse Craen, who gave me the
    initial shove to start this project: thank you, my mate!


    Les


    Page vii


    ## About the Author


    **LES BATE** is a Senior Analyst Programmer at Aerospace (Airbus) in Filton, Bristol.
    In 1998 he gained a BSc (Hons) in computing from the University of the West of
    England, later switched careers into systems analysis and development. He has
    used many technologies, including C++, Perl, JavaScript, VBScript, ASP, which
    opened new horizons for him in terms of technology application. In spare time
    he messes around with electronics, plays the guitar, traveling. He attributes
    his love for reading solely to the works of J.R. Tolkien.


    Page viii


