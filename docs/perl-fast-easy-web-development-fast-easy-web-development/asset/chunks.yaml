    ### 水平线标签


    此时另一个值得关注的标签是 `<HR>` 标签。`HR` 代表 `horizontal rule`（水平规则），它会在屏幕上提供一条贯分割线。它不像以前那样被频繁使用，因为作者现在更倾向于使用更多图形化的方法，但作为简单的页面分割符它很有用。注意，不需要结束标签。


    修改早前的页面以显示 `HR` 的外观（使用哪个示例均可，或者你自己编写一个也可以）。


    水平线标签可以是一个非常简单的标签，如下所示：


    ```html

    <HR>

    ```


    或者你可以为它添加其他属性，例如以百分比表示的宽度，如下：


    ```html

    <HR WIDTH=75%>

    ```


    你甚至可以像这样添加一个颜色属性：


    ```html

    <HR WIDTH=500 SIZE=5 COLOR="#804040">

    ```


    **1.** 将以下内容添加到第二个示例 Web 页面 (`09-02.htm`)：


    ```html

    <HR WIDTH=75%> It is just a simple demonstration<BR> <HR> Here is some more text<BR>
    <HR WIDTH=500 SIZE=5 COLOR="#804040">

    ```


    ![Image](img/7be0cc6d67c3a29d1a1759a632982c55.gif)


    **3.** 将此示例保存为 `09-07.htm`。


