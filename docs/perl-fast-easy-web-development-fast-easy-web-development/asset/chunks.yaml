    For the purposes of this chapter, you will learn how to write the scripts that
    would be the basis of building a simple address book. For simplicity, the HTML
    forms will be left out and values to enter into the database you are going to
    build will be hard-coded into the Perl code. Obviously this is not a practical
    arrangement, but you already know how to get data back from a form (if you have
    forgotten, refer to Chapter 11).


    Right now, concentrate on learning the techniques and code necessary to manipulate
    a simple address book database.


    ## The Database Design


    This will be a simple database that will be easy to implement in Access 97. The
    data items you are going to use are given in Table 14.1, along with some typical
    test data that you might want to enter to test your code.


    Page 279


    | TABLE 14.1 Database Items and Test Data |

    | **ID** | **First name** | **Last name** | **Address** |

    | :--- | :--- | :--- | :--- |

    | 1 | Joe | Bloggs | 14 High Street |

    | 2 | Fred | Smith | 1 Sun Street |

    | 3 | Jane | Doe | 4 Love Lane |

    | 4 | Angus | McCoatup | 17 Lake Close |


    Note the ID column. This will not be used in this chapter, but you will have a
    use for it when you expand this simple example into the Contact Database case
    study in Chapter 17. Briefly, the `ID` field (or whatever you decide to call it)
    is a unique reference to each record (or row) in the database. This is needed,
    as certain operations on the database need to know precisely to which record you
    are referring. For example, if you had to delete a record from the database, a
    unique `ID` would ensure that the correct record and only the correct record is
    deleted. This is much better than a system where, for example, if you tried to
    delete a record for someone by the name of Smith, the database wouldn''t know
    which one you meant and so would probably delete them all. Of course, there are
    times when you want to do something like that, but often you want to pluck out
    a certain record, and that is when the `ID` field, a unique key, is so useful.


    Another consideration of databases is that of `data types`. Not all data is text
    data. There are date and time fields (notorious for creating problems), Boolean
    fields (which are used as flags and contain values that signify yes or no, on
    or off, 1 or 0, or True or False), and memo fields (which are able to hold large
    amounts of text).


    Finally, there are `rules` and `default values`. An example of a rule might be
    "allow zero length strings." Default values are used to fill in a field with a
    value in the absence of a value coming back from a form.


    Databases can be very complex. You can have a large number of tables, many of
    which link to each other through a system of foreign keys so that one table can
    do a lookup on another. This sort of database, and the complex SQL to go with
    it, are beyond the scope of this book, but as your experience and confidence in
    building simple applications grows, you will want to extend your knowledge in
    this area.


    Page 280


