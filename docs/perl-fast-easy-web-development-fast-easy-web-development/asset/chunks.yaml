- fmt: "\nMany Windows-based ISPs send e-mails by means of a freeware program called\
    \ `Blat.exe`. This was actually originally developed as a command-line e-mail\
    \ program, and it sends its e-mail text from a file. In fact, where this program\
    \ is used on the Web, it still uses a file and it stills uses `Blat.exe` as a\
    \ command-line program, sort of. You use the system Perl command that is designed\
    \ to enable you to run any executable program from within a Perl program.\n\n\
    So, under normal circumstances, what you have to do is collect the address information\
    \ and data (text) you are going to send from an HTML form. Then you save the text\
    \ data to a file. Then call the `Blat.exe` program and send your data and message\
    \ text file as parameters. `Parameters` are just individual items of data that\
    \ a program needs to complete its job or to tell the program how to behave. In\
    \ this case they are items of data such as recipient address, sender address,\
    \ and name of the text file containing the message.\n\nTry out the following program\
    \ (if your ISP or hosting company offers the `Blat.exe` facility).\n\n**1.** Start\
    \ a new program in your editor.\n\n```\n#!c:\\perl\\bin\n```\n\n![Image](content/d5d6fd02ff3f5619c4721bf240f65c78.gif)\n\
    \n| **NOTE** |\n| Note the `\\` character; this enables you to escape special\
    \ characters such as the `@` character, which would otherwise be interpreted as\
    \ an array indicator by Perl. | For testing, you will probably want to put your\
    \ own address in the `$recipient` variable. |\n\n![Image](content/66b8f2dad452fea85a4b9db8b6dff4a5.gif)\n\
    \n![Image](content/c171be3afff32435a7169c68397ff2c4.gif)\n\n![Image](content/23b1de7462cd4e0d884dea86f8573102.gif)\n\
    \nNote the different use of the `if` statement. It simply means do the first part\
    \ of the statement if the variable being checked has something in it.\n\n![Image](content/a94f7dabbacfd63a8295ebe1aced010b.gif)\n\
    \n![Image](content/730ac2621890b0053aac4fbd010211f3.gif)\n\n**17.** Now save your\
    \ program as `13-02.pl`.\n\n**18.** Upload the program to your Web space.\n\n\
    **19.** Create a text file containing a message and save it at the location you\
    \ put in your `$message` variable.\n\n**20.** Upload the message file to that\
    \ location.\n\n**21.** Open your Web browser and enter the URL (the location of\
    \ your scripts folder will be determined by your ISP or hosting company) for your\
    \ script to run it. \n\nAll being well, you will shortly receive an e-mail. If\
    \ you do not, check your script again. If you can't see anything wrong with it,\
    \ consult your ISP or hosting company and ask it for an example of how to use\
    \ `Blat.exe` on its system (ISPs often have sample scripts that you can use, in\
    \ which case you save yourself a lot of work).\n\nThe Blat program is not very\
    \ sophisticated and the additional step of having to create a file is a nuisance.\
    \ But it can be useful, and it may be all your ISP or hosting company offers,\
    \ so it is a good program to learn.\n\nYou can also create a file using Perl from\
    \ data that a user has given on a form. So you would get the data from the form\
    \ (you already know how to do that now), write the text data to a file (you can\
    \ do that too), and then let `blat.exe` run as shown previously.\n\nThe program\
    \ given here is a typical example of a Perl program for sending e-mails, but there\
    \ are lots of possible variations in terms of directories and so on, so talk to\
    \ whomever you host with. You may find that your ISP will supply you with a working\
    \ example to plug in to your applications.\n\n### Sending Mail on a UNIX Server\
    \ Using Sendmail\n\nThe UNIX community has had for years a mail program called\
    \ `Sendmail`. It is quite simple to use, but again, before you start, talk to\
    \ your hosting company or ISP to learn about any local variations or hints for\
    \ using `sendmail` from their servers.\n\nTry this example, after you have spoken\
    \ to your hosting company, making any modifications that your company indicates\
    \ for its particular installation (again, the company may offer you a pre-written\
    \ example that will save you time on debugging).\n\nFollowing is a simple example\
    \ of using `Sendmail` in Perl.\n\n**1.** Open your editor and start a new program.\n\
    \n```\n#!/usr/bin/perl\n```\n\n| **NOTE** |\n| Note the UNIX shebang statement—the\
    \ path is different, which matters in the case of UNIX, as the shebang statement\
    \ is not just a comment, but is used by the operating system to find Perl. |\n\
    \n![Image](content/5399ff07f103cc71691ebcf9f4d3872b.gif)\n\n| **NOTE** |\n| For\
    \ testing, you will probably want to put your own address in the `$to` variable.\
    \ |\n\n![Image](content/46d63af0ea41883a4b9db8b6d)\n\n**9.** Save your program\
    \ as `13-03.pl`.\n\n| **NOTE** |\n| Note the `|` symbol before `$sendmail` variable.\
    \ This tells `sendmail` its input can be taken from `STDIN`. | The `sendmail`\
    \ option allows for `To`, `CC`, and `BCC` fields. |\n\n**10.** Now upload your\
    \ program to your Web space.\n\n**11.** Open your browser and enter the URL for\
    \ your script. If all has gone well, you will shortly receive an e-mail. If you\
    \ do not, check your script again. If you can't see anything wrong with it, consult\
    \ your ISP or hosting company and ask it for an example of how to use `Blat.exe`\
    \ on its system (ISPs often have sample scripts that you can use, in which case\
    \ you save yourself a lot of work). The additional step of having to create a\
    \ file is a nuisance. But it can be useful, and it may be all your ISP or hosting\
    \ company offers, so it is a good program to learn. It is also increasingly available\
    \ for Windows platforms. Keep an eye on the Web and look out for new tools that\
    \ suit you. You'll be glad you did.\n\n## 14 Using Perl with Databases\n\nYou\
    \ have learned how, using Perl, you can collect data from users. You know how\
    \ to store data in files and how to retrieve it. You know how to use Perl to respond\
    \ to people who visit your Web site. Now you are going to use Perl to store your\
    \ data in a much more powerful way, by using relational databases. Essentially,\
    \ a *database* is almost any store of related data. For example, a filing cabinet\
    \ is a database. But generally these days, what we really mean is an electronic\
    \ database.\n\nIn this chapter you will learn how to:\n\n![Image](content/d938f552af65a53b177029c39d0585.gif)\
    \ Add MS Access databases to your Web site\n\n![Image](content/d938f552af65a53b177029c39d0585.gif)\
    \ Read, add, update, and delete records from a database using ADO\n\n![Image](content/d938f552af65a53b177029c39d0585.gif)\
    \ Read, add, update, and delete records from a database using DBI\n\n### Access\
    \ 97 and Relational Databases\n\nAccess 97 is a database package that includes\
    \ sufficient code to enable the user to create standalone applications using forms,\
    \ SQL, and so on. However, in this chapter you are only interested in using the\
    \ database engine. There are many other database systems that are as good or better,\
    \ such as MySQL, PostgreSQL, and SQL Server, but Microsoft Access is widely used\
    \ and available to many users, so I'll use it for the examples in this chapter.\n\
    \n| **NOTE** |\n| You can also use Access 2000 for the exercises in this chapter.\
    \ |\n\nAccess 97 is a *relational* database system. A relational database allows\
    \ the data structures to be defined or described. The data is organized into tables.\
    \ A *table* is a collection of identically organized records and each record,\
    \ or row, in a table contains the same *fields*, forming columns of that field.\
    \ One or more fields may be designated as *keys*, allowing searches for specific\
    \ values to be speeded up.\n"
