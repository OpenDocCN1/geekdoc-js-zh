    get all of the columns. This is fine for a small program like this, but you are
    actually bringing back columns that you do not need and therefore the database
    and the network are doing unnecessary work. It keeps things simple for this example,
    but a better SQL statement would be: |


    | $sql = ''''SELECT id, firstname, lastname, town FROM $table"; |


