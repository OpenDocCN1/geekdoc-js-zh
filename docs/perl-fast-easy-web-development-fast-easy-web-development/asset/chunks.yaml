    #### **Text Area Fields**


    The text area field is useful when users want to type in lots of text. You can
    provide a place for users to type with the <input type=text> tag, but with that
    method, the user can''t see what he''s typed once he''s filled the box, because
    the text ''''tickertapes" out of the box to the left. With a text area field,
    you have a number of rows of text, so that as the user types the text scrolls
    up the box. You can also have a scrollbar so that the user can scroll up and down
    the text to review it.


    <TEXTAREA NAME="comments" COLS="50" ROWS="50"></TEXTAREA>


    There is not a value clause with the text area. If there is a default text, then
    you place it between the <textarea> and the </textarea> tags.


    Page 217


