    ### **Images**


    In addition to text, a Web page can also hold pictures, sound, video, and almost
    anything you want. Right now, you can find out more about images and using them
    in your Web pages. Web browsers normally support two image formats, the JPEG and
    the GIF image.


    #### **JPEG Files**


    JPEG files are very good where there are lots of colors, such as in photographs,
    as they can achieve a high degree of compression so that the file size is reduced
    and the time taken to download them is shorter.


    #### **GIF Files**


    The GIF format was developed by the ISP CompuServe and has become a popular image
    standard. It achieves a degree of compression by limiting the maximum number of
    colors to 256\. GIF images are better where there are fewer colors in an image.
    It is possible to remove all unused colors to reduce the file size and download
    time.


    There is a new image format (PNG) that seemed likely to rise to prominence in
    the near future, but so far has failed to catch on. You don''t need to worry about
    that here. In any event, the same principle will apply in so far as Web pages
    are concerned.


    Let''s add an image to a Web page. Create a new Web page for this example; keep
    it nice and simple.


    Page 172


    ![Image](content/8c84e9ef9c5cac69e0cd03658f163ee9.gif)


