    `chop()` has behaved in exactly the same way as it did for the string variable.
    This is not altogether surprising; as you will remember, a scalar can be string
    or numeric, in fact any single value of any data type. `chop()` receives a scalar
    variable as its argument (or parameter) and so regardless of what it contains,
    `chop()` deals with it in the same way.


    The `chop` function is very useful when it comes to things like removing the carriage
    return character at the end of a line in a file, for example. But you will find
    other uses for it as you go along.


    ### A Smart Chop: chomp()


    `chomp` is similar to `chop`, except that you have some control over what it chops…err,
    chomps. It too takes characters from the end of a line (string), but this time
    only the characters you tell it to. It does this through the use of a special
    variable known as the input record separator. The `input record separator` is
    represented like this:


    `$/`


    `$/` will contain the character you want removed from the end of a string, which
    means if the string you give it doesn''t have the character(s) you wanted removed,
    the original string is returned. Check out the example on the next page.


    Page 124


    ```

    $/ = "\n"; $stringvalue = "This is a string \n"; print ($stringvalue);

    ```


    This will return


    This is a string


    If you do the following:


    ```

    $/ = "\n"; $stringvalue = "This is a string"; # note no \n in this string print
    ($stringvalue);

    ```


    Then this will still return


    This is a string


    To illustrate this, try the following program.


    **1.** Open your editor.


    ![Image](content/5318ce14783a76c9028382b1a3b088e6.gif)


    | **NOTE** |

    | :--- |

    | Note though, that `\n` is the default value for `$/`, so you do not really need
    to do this unless `$/` previously contained something else. |


    Page 125


    ![Image](content/02fafb94dd2ecb417611e42851fc53e6.gif)


    **8.** Display the result.


    ```

    print "The string that had NO newline character becomes: $stringvalue"; print
    " and this is a following string\n\n";

    ```


    **9.** Save the program as `08-03.pl`.


    **10.** Open a command window.


    Page 126


    ![Image](content/697f25498b9ca2db40c4cd88436d59e9.gif)


    As you can see, `chomp()` is a bit more flexible than `chop()`, and it saves you
    having to check if the unwanted character is at the end of the string before chopping
    it.


    Let''s look at a few more Perl functions.


    ### Measuring String Length: length()


    This is a simple function that enables you to measure the length of a string.


    Try this easy example.


    **1.** Open your editor.


    ![Image](content/a2a10f1bce6bea30c7866386565d3182.gif)


    Page 127


    ![Image](content/4eda03867b76c65ff04a94487d52a483.gif)


    **5.** Save the program as `08-04.pl`.


    **6.** Open a command window.


    ![Image](content/190727d4adc656a59ae078f4ee2703f5.gif)


    The `length()` function is a very simple but a very useful Perl string function,
    with many uses in many different applications. You''ll be surprised how often
    you use it.


    ### Getting Substrings: substr()


    The `substr` function enables you to extract a part of a string. Perl needs this
    function as, unlike C, a Perl string scalar is not an array of chars, and therefore
    you cannot address characters individually using things like the example on the
    next page.


    Page 128


    ```

    $stringvalue = "Perl is a great language"; $char = $stringvalue[5]; # This will
    NOT work!!

    ```


    The `substr` function allows you to extract one or more characters from a string
    scalar like this:


    **1.** Open your editor.


    ![Image](content/a0c0237ddeaddb01ef1f9c7ca2599717.gif)


    **5.** Save the program as `08-05.pl`.


    **6.** Open a command window.


    Page 129


    ![Image](content/988ebbbd04dbf90bdb39e1e9a48eb175.gif)


    The `substr` function therefore accepts three parameters; the string being worked
    upon, the starting character position for the substring you want to extract, and
    the length (number of characters) to extract.


    | **NOTE** |

    | :--- |

    | The starting position for a string is ZERO, that is, in the above example, `$anotherstring
    = substr($stringvalue, 1, 3);` would return `erl` |


    `Substr` is a very useful function and you will no doubt be using it a lot. There
    will be many times that you will want to extract a domain from an e-mail address
    or a page name from a URL.


    ### Changing Case: lc(), uc(), lcfirst(), ucfirst()


    You first learned about these functions in Chapter 4, but you''ll examine them
    in more detail. `lc()` function simply changes any uppercase characters to lowercase.
    In this example, `string2` will contain "smith".


    Page 130


    ```

    $stringvalue = "SMITH"; $string2 = lc($stringvalue);

    ```


    As you would expect, `uc()` has the opposite. In this example, `string2` will
    contain "SMITH".


    ```

    $string1 = "smith"; $string2 = uc($string1);

    ```


    `lcfirst()` does what you might expect. In this example, `string2` will contain
    "s".


    ```

    $string1 = "SMITH"; $string2 = lcfirst($string1);

    ```


    Finally, a slightly more useful function is `ucfirst()`. It takes a string and
    capitalizes the first letter. In this example, `string2` will contain "Smith".


    ```

    $string1 = "smith"; $string2 = ucfirst($string1);

    ```


    To illustrate this, try the following program.


    **1.** Open your editor.


    ![Image](content/5318ce14783a76c9028382b1a3b088e6.gif)


