    在继续之前，给出一个警告：有几种情况可能会导致困惑，最常见的是，如果你使用 `tr()` 函数尝试创建一个表格行（是的，`CGI.pm` 也处理表格），你最终会调用
    Perl 的转换函数（translate）。类似的冲突在 `select`（如选择列表）中也会发生。坦率地说，你最好使用传统的 HTML 创建表格；这样你就不会遇到冲突了。


    顺便提一下，如果你感到纳奇，你可以这样生成表格：


    ```perl

    print table(Tr( td(''Some Data''), td(''Some More Data''), td(''Even More Data'')));

    ```


    它将生成正常的 HTML，如下：


    ```html

    <table><tr><td>Some Data</td> <td>Some More Data</td> <td>Even More Data</td></tr></table>

    ```


    接下来你将学习一些非常实用的东西，`CGI.pm` 的功能真正减轻了从 HTML 表单获取数据的繁琐工作。


    第 352 页


    ### 从表单获取数据


    这是 `CGI.pm` 真正大显身手的地方。使用 `CGI.pm` 从表单获取数据对程序员来说要容易且直观得多。有了 `CGI.pm`，你不需要考虑将如何分离键值对，或者如何将表单字段名与其对应的值分离。


    记得你学过的那些从表单获取数据并必须进行转换、对 `=` 进行分割等所有内容吗？亏了 `CGI.pm`，你现在可以避开这些。如果你使用 `POST` 方法，可以通过
    `CGI.pm` 的 `param(''fieldname'')` 函数简单地获取表单数据。


    `param()` 函数只需返回括号中指定的字段的值。所以：


    ```perl

    myfield = param(''surname'');

    ```


    返回输入 `Surname` 字段的值。现在这很有用！尝试这个：


    **1.** 重新打开你的程序。


    第 353 页


    ![Image](img/697647ab72380f9ce5f85d519ba0.gif)


    **3.** `if` 语句检查字段是否有值，如果有则显示。这就是我所说的页面调用自己并记住其状态。


    **4.** 将程序保存为 `16-04.pl`。


    第 354 页


    ![Image](img/817ab970828fa0176a372be67da47.gif)

    ![Image](img/59f51d18c7317a22a48a9e4c59.gif)


    使用 `CGI.pm` 操作表单是一个非常有用的领域。在我看来，另一个让你感兴趣的方面是——`CGI.pm` 的面向对象模式。


    ### 面向对象的模式 CGI.pm


    在我们离开 `CGI.pm` 主题之前，还有一点你需要了解的。你已经在所谓的面向函数模式中使用过 `CGI.pm`。`CGI.pm` 也可以以面向对象的方式使用。


    第 355 页


    - 如果你将 `CGI` 视为类，你可以拥有多个 `CGI` 对象。

    - 你可以继承 `CGI` 类并修改结果的行为以符合你的需求。

    - 在面向对象模式下使用 `CGI.pm` 内存更少。

    - 你可以使用生成的参数，而不需要学习位置；

    - 你可以将 `CGI` 对象保存到磁盘并重新加载。


    然而，面向对象模式也是冗长的，这意味着更多的输入。为了好玩，让我们用面向对象模式做一个与上一个类似的程序（`16-04.pl`），你就会明白我的意思了。


    **1.** 在编辑器中启动一个程序。


    ```perl

    #!c:/perl/bin

    ```


    ![Image](img/6ba55fe14b589ef9c54429b680915e0.gif)


    第 356 页


    ![Image](img/fd0a98a27364e9ed4294341a6a52dd9.gif)


    第 357 页


    ![Image](img/6b4de4b30de776a5ef5ca8ad3b271a.gif)


    **6.** 将你的程序保存为 `16-05.pl`。


    第 358 页


    ![Image](img/968a710cfceabd3d458e22e28c97358d.gif)

    ![Image](img/3e888af956d0d3834f7e90738c954e3.gif)


    第 359 页


    ![Image](img/f9476d9be12da19f82a684bfbd471ec.gif)


    面向对象使用 `CGI.pm` 的意义在于你可以许多独立的 `CGI` 对象并分别处理它们（`q2`、`q3` 等）。事实上，Perl 现在本身就有面向对象的模式，遗憾这出了本书的范围。但如果你想了解更多信息，在书末附录
    B 中列出的网站上有大量信息。


    第 360 页


    ## 17 案例研究：联系人数据库


    在 361 章中，你将看到到为止学到的所有内容如何结合在一起演示一个完整的 Perl 数据库驱动应用程序。该应用程序是一个简单的联系人数据库。当然，你可以修改它来执行许多不同的工作，包括留言板。我认为你会发现该应用程序中使用的技术有很多实用的之处。


    在本章中，你将：


    - ![Image](img/d938f552af65a53b177029c3d905885.gif) 创建首页

    - ![Image](img/d938f552af65a53b177029c3d905885.gif) 使用 `listcontacts.pl` 程序读取并列出数据库表的内容

    - ![Image](img/d938f552af65a53b177029c3d905885.gif) 使用 `editcontact.pl` 程序向数据库插入数据

    - ![Image](img/d938f552af65a53b177029c3d905885.gif) 使用 `editcontact.pl` 程序将数据加载到字段


    第 362 页


