    <Script Language=JavaScript> function checkfields( ) { var okeydokey; okeydokey
    = 1; if(document.addrec.firstname.value == ''''") { alert("You have not entered
    the contact''s First Name"); okeydokey = 0; document.addrec.firstname.focus( );
    } if(document.addrec.lastname.value == "" && okeydokey) { alert("You have not
    entered the contact''s Last Name"); okeydokey = 0; document.addrec.lastname.focus(
    ); } if(document.addrec.street.value == "" && okeydokey) { alert("You have not
    entered the contact''s Street Address");


    Page 371


    okeydokey = 0; document.addrec.street.focus( ); } if(document.addrec.town.value
    == ''''" && okeydokey) { alert("You have not entered the contact''s Town"); okeydokey
    = 0; document.addrec.town.focus( ); } if(document.addrec.postcode.value == ""
    && okeydokey) { alert("You have not entered the contact''s Zip / Post Code");
    okeydokey = 0; document.addrec.postcode.focus( ); } if(document.addrec.phone.value
    == "" && okeydokey) { alert("You have not entered the contact''s Phone No.");
    okeydokey = 0; document.addrec.phone.focus( ); } if(document.addrec.email.value
    == "" && okeydokey) { alert("You have not entered the contact''s e-mail address");
    okeydokey = 0; document.addrec.email.focus( ); } if(okeydokey) { document.addrec.submit(
    ); } } </script>


