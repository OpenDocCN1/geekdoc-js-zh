  raw: 'In this chapter you learned how to obtain user input from an HTML form using
    both the GET and POST methods. This is a major milestone, as you have now made
    the link from user input at a form in the user''s Web browser to actual data available
    for use on the server.


    So, you can create the forms and you can grab the data in your Perl program. Now,
    what are you going to do? One thing you might like to do is to save the data into
    a file. So, in the next chapter you will learn about files.


    Page 234


    *This page intentionally left blank.*


    Page 235


    ## **12


    Using Files in Perl**


    In this chapter, you''ll learn how to use files in Perl—how to create them, write
    to them, read from them, and delete them. You will also learn how to create and
    remove directories in Perl.


    In this chapter you will learn how to:


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Open a file in Perl


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Read data from a file


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Close a file


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Use directories


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Delete a file


    Page 236


    ### **Opening Files in Perl**


    Before you can do anything with a file, you need to open it. This is done using
    the Perl open function. The general syntax for the open function is


    Open(MYFILE, ''''testfile.dat") || die "Error encountered when opening file ...";


    This means that Perl will attempt to open a file whose file handle is MYFILE.
    A *file handle* is a reference variable that is used to store the *internal name*
    of the file, that is, the name by which the Perl program will recognize the file.


    Following the file handle is the real name of the file; in this example, testfile.dat.


    Notice in the line of code that the next thing on the line is a *double pipe*.
    This is the OR operator and is used here to execute whatever follows it if the
    file open code fails. In other words, if for any reason the file cannot be opened
    by Perl, the code following the || symbol will be executed.


    The code after the double pipe OR operator simply says


    die "Error encountered when opening file ..."


    The die function then stops the program running after displaying the message "Error
    encountered when opening file . . .".


    A general error message in itself isn''t very helpful. However, Perl also has
    a special error variable that holds the error message for an event such as this.
    This is the $! variable. You can now add this variable to the die error message:


    Open(MYFILE, "testfile.dat") || die "Error encountered when opening file . . .
    $!";


    As you would be unable to see anything when a file is successfully opened, trying
    an example would be a bit pointless right now. The next step will be to read a
    file so that you can see the open function in action and see how data is read
    from a file. If you want to, you can rename the input file so that the program
    cannot find it, and then try out the die function and error message.


    Page 237


    ### **Reading Data from a File**


    Data may be read from a file in Perl using the angle operator, < >. To get a line
    of data, you simply wrap the file handle in the angle operator like this:


    $dataline = <MYDATA>;


    This will take any data from MYDATA (testfile.dat) and store it into $dataline.
    The data will stop when a newline character is encountered.


    The end of a file is recognized when the file handle returns ''''undefined." So
    to read and display the whole contents of a file you can do this:


    while (defined($dataline=<MYFILE>)) { print "$dataline <br>"; }


    This can be simplified still further if you do not have any other conditions in
    the while statement. The while statement will execute while the conditions in
    the following parentheses are True. The condition "undefined" of the file handle
    is effectively False.


    Therefore, you can now say


    while (<MYFILE>) { print; }


    Note that now, unless you had <BR> tags at the end of your lines of data in the
    file, the data would all be joined together. Of course, you could put a separate
    print line after the empty one to provide the <br> tag.


    while (<MYFILE>) { print; print "<br>"; }


    Page 238


    | **NOTE** |


    | You cannot add a <BR> tag to the first print statement, as it would then no
    longer be reading the data from $_, but would instead just directly print <br>
    and nothing else. |


    Now, providing you have a file to work with, you can try out both the open function
    and reading data from a file.


    **1.** Open your editor and clear it of any default code that the editor might
    create so that you have a completely clear file.


    ![Image](content/caac84632ae530b5207b47ddb5d37731.gif)


    Page 239


    ![Image](content/c6b065e9ef81ada54c01cd8fd0a1fdcc.gif)


    | **NOTE** |


    | Note the use of double backslashes. The string is double-quoted and so *interpolation*
    will occur. If this was not done, then, should any part of the path begin with
    an ''''n," it would be treated as a newline character. The double backslashes
    suspend the interpolation process for the characters following those double backslashes.
    An alternative to prevent character combinations being treated as special characters
    is to use forward slashes, as you will see in UNIX programs. This will work with
    Windows too, so you may prefer to use forward slashes rather than double backslashes
    like this: |


    | open(MYFILE, "c:/inetpub/wwwroot/filetest/testfile.dat")        &#124;&#124;
    die print "Error encountered opening file . . . $!"; |


    Page 240


    ![Image](content/c64b966316b67b481a1bb484ad1280ce.gif)


    | **NOTE** |


    | So you have a while loop, the terminating condition of which is when the input
    from the file is undefined; that is, you receive a null input from the file. |


    **8.** Save your file as 12-01.pl.


    ![Image](content/b116c5961677c6f06f29c7275189f0fe.gif)


    Page 241


    ![Image](content/39202078bdcf952788d4e5d09f24e654.gif)


    **10.** Save the program as 12-02.pl.


    ![Image](content/444635b2989b84e0b63e262eb4e57e34.gif)


    Just to prove that the error condition is indeed trapped, try temporarily renaming
    your data file to anything you like and then re-running your code. You should
    get the error message.


    ### **Error Checking**


    The die function you have used so far is the simplest way of checking for errors.
    As an alternative you could use the code on the next page.


    Page 242


    If (open(MYFILE, ''''testfile.dat")) { while (defined($dataline=<MYFILE>)) { print
    "$dataline <br>"; } } else { print "There was an error opening the file …"; }


    This works because the open function returns a False value if it fails. (More
    correctly, if you displayed the value, you would find that it is returned as undefined).
    If it succeeds, it will return a non-zero value. Any non-zero value equates logically
    to True, so the rest of the code to read data from the file is executed.


    The advantage of trapping errors in this way is that the program does not have
    to abort. The die function stops execution of the program, and therefore should
    be used where failure to open a file is considered a catastrophic error.


    #### **Closing a File**


    When you have finished with a file, you should always close it. Doing so is good
    programming practice and also ensures that resources no longer being used are
    returned to the operating system. If this is not done in large systems, the upper
    limit for the number of file handles that can be open at any one time may be reached
    and the system may then fail.


    To close a file, simply use the close function. For the previous example, it would
    be coded like this:


    close (MYFILE);


    Page 243


    ![Image](content/d4403fc31ff740f7bac36e82cbe42627.gif)


    Save your updated program as 12-03.pl and check that it works.


    ### **Writing to a File**


    You have learned one way to get data from a file. Now you are going to learn how
    to write data to a new file, and how to add data to an existing file.


    #### **Opening the File for Writing**'
