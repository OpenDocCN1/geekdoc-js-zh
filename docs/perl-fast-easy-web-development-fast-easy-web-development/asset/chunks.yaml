    ![Image](content/8392f51d14365a152ca9b14d395f2bd1.gif)


    **4.** Now re-open your 11-01.pl program.


    **5.** Remove the following line:


    read(STDIN,$tempbuffer,$ENV{''CONTENT_LENGTH''});


    ![Image](content/41ad95c2aeba1e90ceebc34dffe848cf.gif)


    Page 232


    | **NOTE** |


    | Now you are taking the data contained within the environment variable QUERY_STRING
    as your source for the form data. Note that you do not have a ''''read" command
    anymore, as the data is, in the case of the GET method, simply a part of the URL,
    and therefore appears in QUERY_STRING. |


    **7.** The rest of the code is identical to the 11-01.pl; now save this code as
    11-02.pl in your scripts folder.


    ![Image](content/5f771ad0140928cbe85387135a168c9e.gif)


    Page 233


    ![Image](content/f96f09e9c610774d631054c1ff26300b.gif)


    Once again the data fields used on the form are displayed along with their respective
    values.'
