    braces, `{}`, around the code. It also shows where functions are placed and one
    method of calling a function (`onClick=`).


    Just to remind you, the `<!--` and `-->` tags are normally used to embrace HTML
    comments (text that is designed to be informative to humans but is ignored by
    the browser) and therefore anything inside them is ignored. Modern browsers recognize
    that there is script inside them and therefore execute it. Older browsers (that
    do not understand JavaScript) ignore the JavaScript code; this prevents unnecessary
    error messages. Of course, the JavaScript code won''t work on an older browser,
    either. The opening HTML comment needs a less than symbol (`<`) followed by at
    least two dashes like this:


    ```html

    <!--

    ```


    It should end with at least two dashes followed by a greater than symbol (`>`),
    like this:


    ```html

    -->

    ```


    Note that case is very important when specifying keywords in JavaScript—`function`
    is a keyword, `Function` isn''t.


    ## JavaScript Variables


    As do all other languages, JavaScript uses variables to store information. Variables
    can be created on-the-fly as and when you need them, but it is a good idea to
    create them at the beginning of your script so that it is easier to follow, and
    so you know where to look for them. To create a variable you use the `var` keyword.


    ```javascript

    var age; var name;

    ```


    And so on. To assign a value to a variable you use the assignment operator, `=`.


    ```javascript

    age = 17; name = ''fred'';

    ```


    Most JavaScript statements end with a semicolon. JavaScript, like most modern
    languages, is free format, that is, it can be split over many lines if desired,
    usually to aid readability. It uses the semicolon to indicate the end of a statement,
    a form of notation borrowed from C++ and Java (and of course, Perl) languages.


    Other things you will want to do with JavaScript include:


    * Add numbers together

    * Subtract

    * Multiply

    * Divide


    You might add the values of a couple of variables like this:


    ```javascript

    firstNumber = 13; secondNumber = 23; ressultOne = firstNumber + secondNumber;

    ```


    Note that the standard convention is to capitalize the second word in a variable.
    This makes the code easier to read and reduces mistakes. It is up to you whether
    to follow this convention, but doing so will make it easier for other people following
    along behind you to update your code.


    Subtraction, multiplication, and division are performed in a similar manner to
    the previous example, using the `-`, `*`, and `/` operators, respectively.


    There are many other things you might want to do; for example, you might want
    to get the length of a character string.


    ```javascript

    stringVar = ''fred''; sLength = stringVar.length;

    ```


    There are no parentheses after `length` because this is not a method, but an attribute
    of the string object, `stringVar`.


    To test a value you use the equals operator, `==` (remember that you already used
    the `=` operator to assign a value to a variable).


    So you would say:


    ```javascript

    if(numVar == 5) {

    ```


    Other operators are:


    * `>` (greater than)

    * `<` (less than)

    * `<=` (less than or equal to)


    You can do many hundreds of other things too with JavaScript, including opening
    new windows, jumping to different Web pages, opening dialog boxes, and so on.
    JavaScript is a large, complex, and immensely powerful language. You will learn
    more features of the language with experience, but now we have to be ruthless
    and stick to things that will help you with your Web applications.


    ## Your First Form Validation JavaScript Function


    One of the most interesting and useful things you can do with JavaScript is client-side
    validation. But before we go any further, let us briefly re-visit the object discussion.
    All things in JavaScript are regarded as objects. An HTML page is called a *document
    object*. As you learned a short time ago, a form is another object that lives
    inside a document and has a name by which you can refer to it. Therefore, you
    refer to a form that has a `NAME=''addrecord''` attribute like this:


    ```javascript

    document.addrecord

    ```


    Note the dot! This is not a complete statement yet, but it means "go to the form
    `addrecord` contained within the document."


    Any fields in the form are referred to in a similar way. So, if you have a field
    called `surname`, like this:


    ```html

    <INPUT TYPE=TEXT NAME="surname">

    ```


    Then you would refer to it like this:


    ```javascript

    document.addrecord.surname

    ```


    This gets you to the field object inside the form object, which is inside the
    document object. Now you have reached the field object. But this object has many
    attributes, such as `length`, `value`, and so on. So, to access the value of your
    field, you refer to the value of the field like this:


    ```javascript

    document.addrecord.surname.value

    ```


    Now, you can have a look at what is in the field. To do this, use the JavaScript
    `if` statement. If you want to check that the field is empty, you can do this:


    ```javascript

    if (document.addrecord.surname.value == "") { Do something ... Do something else
    ... }

    ```


    As you can see, the braces `{}` are used here to limit the scope of the `if` statement.
    Note that you use `==` to check for equality. A single `=` is used to assign a
    value to a variable. Other tests are:


    * `!=` not equal to

    * `>` greater than

    * `<` less than

    * `<=` less than or equal to

    * `>=` greater than or equal to


    You can have multiple conditions in your `if` statement. These conditions can
    be ANDed or ORed together using the AND operator `&&`, and the OR operator `||`.
    So, a `if` statement might look like this:


    ```javascript

    if ((document.formname.department.value == "HR" || document.formname.expenses.value
    != 0) && (document.formname.jobtitle.value == "Manager")) {

    ```


    The parentheses force conditions to be grouped in the way you intend rather than
    the way JavaScript decides if you leave the inner parentheses out. There are rules
    about operator precedence that define in what order conditions will be tested.
    If you do not want to learn them, or you are at all unsure as how your conditions
    will be interpreted, use parentheses to group them.


    ### Submitting Forms Using JavaScript


    You can submit your form to a server-side script or program (such as your Perl
    programs) from within a JavaScript function. This can be done by using the `submit()`
    method of the form object, like this:


    ```javascript

    document.addrecord.submit();

    ```


    ### Conditional Form Submission


    Now you can check the value contained within fields in your form and you can submit
    your form. But there is much more to learn yet. How do you check for the possibility
    that a field is blank? You have met the `if` statement briefly; the full syntax
    for the if statement includes an `else` block to handle cases where the condition
    is false:


    ```javascript

    if (condition) { do something[...] something else[...] } else { do some other
    stuff[...] do more other stuff[...] }

    ```


