    | **警告** |

    | 这是 UNIX 和 NT 平台之间的一个重要区别。任何以 `#` 开头的语句都被 Perl 视为注释，因此被解释器忽略。此规则的例外是 Perl 程序的第一行，如前所述。这条语句告诉
    UNIX 操作系统去哪里寻找 Perl 解释器。只要程序文件被设置为可执行文件（通过将 `chmod` 设置为 `755`），只需输入名称即可运行。当然，你仍然可以在
    NT 的命令行中使用 `-w` 标志。 |


    在 NT 平台上，这第一行将被视为注释。然而，NT 使用程序与其文件名文件扩展名之间的“关联”。换句话说，当 Windows NT（以及 Windows 9x
