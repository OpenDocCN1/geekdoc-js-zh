    Single quotes cause escape sequences to be ignored. If you put one of the print
    statements in the previous program in singles quotes, the `\n` sequences will
    be displayed and there will be no newlines.


    Note that a scalar variable can contain nothing. For example, if you do the following:


    ```perl

    print $string1;

    ```


    `$string1` now exists but has no value. However, you can check for the existence
    of a scalar using the following:


    ```perl

    if (defined $string1) { print ''''That variable has been defined! \n"; }

    ```


    You can even "uninitialize" a scalar variable like this:


    ```perl

    undef($string1);

    ```


    or


    ```perl

    $string1 = undef;

    ```


