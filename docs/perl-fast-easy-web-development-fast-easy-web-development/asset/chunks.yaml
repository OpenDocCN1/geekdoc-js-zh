    ### **The Database**


    This is the last step in creating your application. You are going to create the
    database that your application ''''talks" to. Create the database (contact.mdb)
    in exactly the same way as you did in Chapter 14. Don''t forget that for added
    security, the database should be stored above the Web root (wwwroot).


    Make sure that the option "Allow Zero Length" for each field is set to "Yes."
    This prevents errors if you decide that completion of a field is not mandatory
    and you therefore remove the JavaScript code pertaining to that field.


    Page 391


    Don''t forget to set up the data source name using the ODBC feature of the control
    panel. If you can''t remember how, refer to Chapter 14.


    Save your database as contact.mdb.


    ![Image](content/e0033becda0fcde35eab3bf8361dfbc8.gif)


    You now have a full, working application. I did leave out one function: the delete
    option. See if you can work out how to do it. Here''s a clue: the deleterec.pl
    would be almost identical to the updaterec.pl program. Do you remember how the
    listcontacts.pl program links to the editcontact.pl program using the hidden id
    field? The delete function will work in exactly the same way! You will need another
    separate form like that used for the edit buttons in the listcontacts.pl program.
    But this time you can go directly to the deleterec.pl program because you''re
    not editing anything.


    There are a number of improvements you can make to this program. You can improve
    the look and feel, you can add a search facility (remember the ''''LIKE %data%
    option in SQL?), and you could add a separate view option that doesn''t have edit
    options, so that you can just look at the data. You could even allow an e-mail
    to be sent directly from your program.


