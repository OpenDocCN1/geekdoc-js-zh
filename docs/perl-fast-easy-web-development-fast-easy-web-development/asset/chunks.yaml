    \ your Web server folders.\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\n\
    \n### Getting Data via the POST Method\n\nOkay, now you know how to get at sent\
    \ from a form using the POST method. How about the GET method?\n\nThe good news\
    \ is that most of the code is the same. In fact, in the form, all you need to\
    \ do is change the `method=\"post\"` attribute to `method=\"get\"`.\n\n### Getting\
    \ Data via the GET Method\n\nNow you are taking the data contained within the\
    \ environment variable `QUERY_STRING` as your source for the form data. Note that\
    \ you do not have a `read` command anymore, as the data is, in the case of the\
    \ GET method, simply a part of the URL, and therefore appears in `QUERY_STRING`.\n\
    \n```perl\n#!/bin/perl\nContent-type: text/html\n\nmy @pairs = split(/&/, $ENV{'QUERY_STRING'});\n\
