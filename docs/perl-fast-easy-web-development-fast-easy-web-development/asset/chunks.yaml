    ![Image](content/d938f552af65a53b177029c39d905885.gif) Learn how to get form data
    via the GET and POST methods


    Page 222


    ### **Receiving Data from Forms**


    As always, the best way to demonstrate the way you use forms is by way of a simple
    example. But first, you should learn about another feature of HTML: tables. This
    is a good time to discuss HTML tables, as they are very useful for creating neat
    form layouts!


    #### **HTML Tables**


    HTML tables are used to (amongst other things) format the contents of a Web page.
    In this section you''ll learn how to use them to make a Web input HTML form look
    prettier. Tables are not essential for forms—but they do make them look better.
    You could just use spaces (&nbsp;) and breaks (<BR>) to position the form elements
    on the page, but it probably wouldn''t look very good.


    As you would expect, a table starts with the <TABLE> tag. The <TABLE> tag has
    a number of attributes; for example, you can use background = imagename.jpg to
    set the background image of a table, just like you did for the <BODY> tag. In
    the same way, you can set the background color using the bgcolor attribute.


    You can set the width of the table using the width=nnn or width=nn% attributes
    of the table tag, rather like the width attribute of the <HR>, horizontal rule
    tag.


    A typical table tag might look like this:


    <table width=600 bgcolor=lightblue>


    This code says to create a table 600 pixels in width with a light blue background
    color. Simple enough, isn''t it?


    A table achieves its aims by being what you would expect it to be: a table of
    rows and columns into which you can place the elements, pictures, or text you
    choose.


    At the top of a table, you can have an optional ''''header" row, intended for
    things like titles. A header row looks like this:


    <tr><th width=200>Column Title 1</th><th width=200>Column Title 2</th><th width=200>Column
    Title 3</th><tr>


    Page 223


    The <tr> tag signifies the start of a table row. The <th> tag defines a table
    header for a column, in this case the width of the header, and therefore the whole
    column has been fixed at 200 pixels (again, percentages could be used). The </th>
    tag closes this header. In this example, there are three identical headers containing
    three column titles for the table.


    Note that although the width of the headers is set in this example to 200 pixels,
    if the title between the <th> and </th> tags exceeds 200-pixel width, the column
    will stretch (that is, any cells directly beneath the header tag will stretch)
    to accommodate the text, image, or whatever you choose to place within it.


    At the end of the headers, the row is closed using the </tr> tag.


    Following rows can contain what HTML calls *data*. The format of the data rows
    is very similar to the header row, except that the individual cells are defined
    by <td> tags instead of the <th> tag of the header row. A header row or a data
    row can also have its own width tags, background color tags, and so on.


    A data row may look like this:


    <tr><td>Column Title 1</td><td>Column Title 2</td><td>Column Title 3</td><tr>


    An HTML table can contain many rows of data, which is, as you will see, very useful
    in Web-based applications.


    Each <td> or <th> tag can have its own background color, bgcolor, width, and height
    attributes. They also can have tags for aligning the contents of the cell. Horizontally,
    alignment can be specified as left, center, or right. Vertically, alignment can
    be specified as top, middle, or bottom. So for example, a <td> tag can have its
    alignment attributes specified thus:


    <td align=''''center" valign="top">


    Note that the valign and height attributes can also be added to the <tr> tag.


    The HTML table is closed, as you would expect, using the </table> tag.


    The following form example shows how a table is used to position the form elements
    to produce a neat layout.


    Page 224


    **1.** Open your editor.


    **2.** Create a new HTML page.


    ![Image](content/f6b12346217b6b43074253fe70df9fa5.gif)


    | **NOTE** |


    | You are using the POST method. You learned a bit about this method in Chapter
    9\. You will learn a little more about POST and GET in this chapter. |


    Page 225


    ![Image](content/484d77d767f5d86df2f0e1873db8a32c.gif)


    Page 226


    ![Image](content/e5cbbeadfe8be06f2039f89989b72b35.gif)


    **13.** Save the form HTML as 11-01.htm in a suitable folder under the wwwroot
    folder in your Web server folders.


    ![Image](content/83ba0e91140d0ced263e065a7f916e28.gif)


    At this point you cannot actually submit the form without receiving an error,
    as you have no Perl program yet to accept the data. That''s what you are going
    to do next.


    #### **Getting Form Data via the POST Method**


    In your editor, start a new Perl program. Now you are going to add a Perl program
    to deal with the input from your HTML form. This small Perl program will require
    some explanation, as there will be some code you haven''t seen before.


    Page 227


    **1.** Start your program in the usual way, and add the HTTP header line.


    #!c:/perl/bin print ''''Content-type: text/html\n\n";


    ![Image](content/1a87ad2a7d3bb6153ac32505555a6de0.gif)


    An array, called @pairs, is used to contain the key value pairs from the form.
    This line of code uses the split function to separate each key-value pair from
    all the other pairs so that you end up with an array of pairs each containing
    a field and its associated value. (Notice that each pair is separated from the
    next by an & character; the split function in this case uses this character to
    separate the data into discrete pairs.) You are almost at the stage where you
    have something useful.


    Page 228


    ![Image](content/1298867538bd7488096a846929e57129.gif)


    Page 229


    | **NOTE** |


    | Again you have a pattern-matching line using the binding operator. The command
    using the pattern is the substitute command, s. In this case, hexadecimal codes,
    which replace symbols during their transmission via HTTP, are substituted with
    their character equivalent. The /g at the end of the command simply means ''''global,"
    that is, replace each occurrence found in the data. |


    ![Image](content/ee13b7f65bfe202169f4b65f7e5525ab.gif)


    That seemed like hard work didn''t it? But read through each line and the notes
    attached to each step and I think you will agree it''s a lot simpler than it might
    first appear.


    Page 230


    **12.** Save your code as 11-01.pl.


    ![Image](content/17e15a3aef50120666174b3fa00c9eac.gif)


    ![Image](content/fe2db9f1f4635c6c5f8f4b1a2c970f4e.gif)


    #### **Getting Form Data via the GET Method**


    Okay, now you know how to get at data sent from a form using the POST method.
    How about the GET method?


    The good news is that most of the code is the same. In fact, in the form, all
    you need to do is to change the: method= ''''post" attribute to: method= "get".


