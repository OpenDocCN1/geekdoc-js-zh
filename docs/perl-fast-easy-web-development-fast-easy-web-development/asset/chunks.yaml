    Page 181


    ### **Frames**


    Before you start, a warning: use frames sparingly—they can make your site slower
    to load and they don''t always look the same in all browsers. However they do
    have their uses. The most common purpose is to aid navigation.


    You have seen Web sites where you have a menu of options down the left side and
    perhaps a banner at the top of the screen. If you find that when you scroll down
    the main screen the left side menu doesn''t move, this site has probably been
    created using frames.


    ![Image](content/9eebb89239d5fa4d7bae37137c395350.gif)


    Of course, this is only one option. You can create frame layouts of any type you
    want to set up, but this is one of the most commonly used.


    | **NOTE** |


    | If you created a page that described the above layout and then tried to view
    it in a browser, you would see nothing. As I have already said, the frame page
    merely describes the frame layout that will contain the pages that fit into each
    frame. Those pages are set up separately as conventional HTML pages and are then
    loaded into the required frame. |


    Page 182


    In summary, a *frameset* is a collection of frames designed to contain HTML pages,
    which are then displayed as one page in the browser.


    ### **Frame Tags**


    There can be several frames in a frameset but more than two or three becomes impractical.
    For each frame, you specify the size of the frame. The frames effectively divide
    up the page area that you see in the browser. This is achieved by specifying the
    width or height of each frame.


    To get the frames to look like you want them to appear can be difficult at first,
    but it is logical. Honestly.


    ![Image](content/db031499d74df629643257ed81c78adc.gif)


    Remember that you will need an HTML page to fit into each of the above frames.
    To fit in with the scheme, you can call them Banner.htm, Menu.htm, and Page1.htm.


    The coding needed to produce the frames page to achieve the layout is as follows:


    <HTML> <HEAD> <TITLE>Frames Demo</TITLE> </HEAD> <FRAMESET ROWS=''''20%,80%" COLS="*"
    FRAMEBORDER="0"> <FRAME SRC="banner.htm" NAME="banner"> <FRAMESET COLS="20%,80%"
    ROWS="*"> <FRAME SRC="menu.htm" name="menu"> <FRAME SRC="page1.htm" name="main">


    Page 183


    </FRAMESET> </FRAMESET> <NOFRAMES><BODY BGCOLOR=''''#FFFFFF"> Sorry, Your browser
    does not support frames. </BODY></NOFRAMES> </HTML>


    ![Image](content/ab47990438c72403cb31600e0703b9b5.gif)


    Page 184


    ![Image](content/48fa062156cd31397c64479e358a3fd7.gif)


    **11.** Notice that the COLS attribute in the first FRAMESET is set to *, which
    means ALL or in this case the whole width. Similarly, the second FRAMESET has
    ROWS set to *, the whole height.


    Try changing the values of the numbers in the FRAMESET tags to observe the effect.


    Try replacing the * values in the ROWS and COLS attributes with numbers and see
    what you get.


    Now add additional numbers separated by commas to the FRAMESET attributes.


    <FRAMESET ROWS=''''100,500,100" COLS="100,200">


    Also, note that although here the values are specified as a numbers of pixels,
    you can also use percentage values.


    <FRAMESET ROWS="10%, 90%" COLS="* >


    Now let''s put something into the frames.


    Page 185


    For this demo, you will need to build five pages.


    **1.** You should already have the framedemo page. If not, copy the following
