    in Perl, you will learn about another subject that is very useful in Web applications:
    e-mail.


    Page 259


    ## **13


    Sending E-mail in Perl**


    E-mail is a useful addition to the facilities in your Perl Web applications. And
    it is not difficult to send e-mail in Perl. Unfortunately, the methods used to
    do so differ, and it is largely a matter of asking your ISP for information. E-mail
    requires a program called a Mail Transfer Agent (MTA) to send the e-mail to an
    SMTP server. On the UNIX platform, the shell command sendmail does this. In Windowstype
    environments there is the SMTP server that comes with Microsoft''s Internet Information
    Server (IIS), but there is no MTA in Windows. Instead, you can use a package called
    SMTP in Perl to help you send e-mail, or you can use a more recent module called
    sender.pm. A program called Blat.exe can also be used on Windows platforms to
    send e-mail via SMTP.


    In this chapter you will learn:


    ![Image](content/d938f552af65a53b177029c39d905885.gif) What FTP is and how to
    use it


    ![Image](content/d938f552af65a53b177029c39d905885.gif) How to use SMTP in Perl
    to send e-mail


    ![Image](content/d938f552af65a53b177029c39d905885.gif) How to send e-mail using
    Blat.exe


    ![Image](content/d938f552af65a53b177029c39d905885.gif) How to send e-mail on a
    UNIX server using Sendmail


    Page 260


    Because methods of using e-mail vary from ISP to ISP, I will describe each method
    generally, but with real code. Obviously, it is difficult to demonstrate with
    screenshots that e-mail has worked, but I''ll describe and show the code as usual.
    Please check with your ISP if you have any problems, or ask your ISP before you
    start if there is anything you need to know about your particular environment.
    Most problems will be minor—you may have to change the path to the Blat.exe or
    the Sendmail program, for example.


    Regardless of the platform that is being used, the method of sending e-mail is
    similar. Certain information is needed to send an e-mail, no matter what hardware
    or software you are using. For example, the following data items will always be
    required:


    • Recipient


    • Subject


    • Message body


    • Sender


    Armed with this basic information, you can build a Perl program to send e-mail.


    As I have said, the basic method of sending e-mail on all platforms is similar.
    The general method is to:


    **1.** Define the path to the mail program.


    **2.** Open the mail connection.


    **3.** Supply the recipient and subject information.


    **4.** Send the mail body data.


    **5.** Close the e-mail connection.


    ### **Using FTP**


    Before you begin to learn about e-mail in Perl, you need to know how to get your
    files from your machine up to your ISP or hosting company Web space because, for
    this chapter, you need to step outside of your development cocoon (Microsoft Personal
    Web Server if you''re using Windows 9x or Peer Web Services if you''re


    Page 261


    using Windows NT). You will also need to use Web space that has an e-mail service
    attached to it. You need an SMTP server or some means of being able to send e-mail.
    To get your work onto your ISP Web space, you''re going to have to learn how to
    get your files from your machine up to the ISP server using FTP (File Transfer
    Protocol)


    ### **What Is FTP?**


    FTP is the means by which you are able to transfer your files from your computer
    to another, usually a server at your ISP installation where you keep your Web
    sites and Web applications.


    It isn''t difficult to learn to use FTP, but it''s a good idea idea to become
    familiar with it to remove some of the guesswork and to speed you along your way.
    So, before you start to learn about sending e-mail, read this short briefing on
    how to use FTP. I shall use one example of an FTP client; there are many, but
    they are basically very similar. There are a number of FTP clients on the market,
    and some of them are free for personal use.


    | **NOTE** |


    | For the purposes of this discussion, I will concentrate on WS-FTP LE (the LE
    stands for Light Edition). This is an excellent, free FTP client that is easy
    to use and very effective. |


    #### **How Do I Use FTP?**


    First of all, obtain a copy of WS-FTP from http://www.ipswitch.com. Download a
    copy of the installation file, follow the onsite instructions, and install a copy
    of WS-FTP LE. There are a number of FTP clients out there, so you may want to
    shop around to find a product that suits you once you are comfortable using FTP.


    After you have installed the product, you have to configure it. To do so, follow
    this procedure.


    Page 262


    ![Image](content/90be19eef1c9962c8307ac9c891b3122.gif)


    ![Image](content/d136068e03aadf3d7e8d18e872da8c21.gif)


    Page 263


    ![Image](content/6c36fa2c1d730a5e80e04923cb65454a.gif)


    ![Image](content/c6b723d2322680b047e29240148ca9dd.gif)


    Page 264


    | **NOTE** |


    | Of course, you can also transfer them the other way, by highlighting files in
    the right window and clicking the left arrow button. You can select more than
    one file by holding down the Shift key as you click with the mouse to select a
    list of files that are grouped together in the list, or by using the Ctrl key
    as you click the mouse to select files that are not together in the list. |


    Try transferring some files and you will soon see how easy WS-FTP is. Like most
    Windows-type tools, the easiest way to learn how to use them is to play with them
    and read the help screens.


    One thing to note is that you will want to transfer your Perl and HTML files as
    ASCII. Your images will be transferred as binary files. If you look at the bottom
    of the WS-FTP transfer screen, you will see radio buttons for ASCII and Binary.
    Select the appropriate one for the type of file you are transferring.


    | **TIP** |


    | The Auto button uses the file extension to determine whether to use binary transfer
    mode or ASCII. To set up the extensions in order to transfer files automatically,
    click the Options button, select the Extensions tab, then add all of the ASCII
    extensions you may want to use. |


    There are lots of settings for you to play with in WS-FTP LE, but I will leave
    you to discover them yourself; I suggest you read the help documentation before
    changing any setting.


    ### **Sending E-mail Using SMTP in Perl**


    Perl has a module called Net that contains its networking functions. One of the
    components of Net is the SMTP module that contains all of the functions needed
    to send e-mail via an SMTP server. Try the example on the next page.


    Page 265


    **1.** Open a new program in your editor.


    #!c:\perl\bin


    ![Image](content/71f461378958daf040684cdafd8da3fb.gif)


    ![Image](content/ee77ecf673a85ddf3a17b771e1d1e503.gif)


    Page 266


    ![Image](content/f846acc58b7dd4c4d3f1664609e611e1.gif)


    ![Image](content/99a40abfe4ea7bea3bda8d6fe4b5153c.gif)


    | **NOTE** |


    | The subject was terminated with two newline characters. This tells the SMTP
    server that this is the end of the header information, and that what follows is
    the body of the message. The message also ends with two newline characters, indicating
    that the end of the message has been reached, as you will see next. |


    Page 267


    ![Image](content/6797db198fec910febbf4bcd0b0a5d7d.gif)


    **17.** Save the program as 13-01.pl and upload it into your cgi-bin or scripts
    folder in your ISP or hosting company''s Web space using a suitable FTP client.


    **18.** Open your browser and enter the URL for your program (http://www.*yourdomain*.com/cgi-bin/13-01.pl).
    Notice that you will not see any output on the screen. If you want to see something
    to reassure yourself that the program completed, put in a print statement with
    a suitable message.


    That''s one way of sending an e-mail. There is another way that you may find useful
    if your site is hosted on a Windows server: using the Blat program.


    ### **Sending E-mail Using Blat.exe**'
