    ### The Horizontal Rule Tag


    One other tag of interest at this point is the `<HR>` tag. `HR` stands for `horizontal
    rule`, and it gives a dividing line across the screen. It is not employed as often
    as it used to be because authors now favor more graphical methods, but it is useful
    as a simple page divider. Note that an end tag is not required.


    Modify an earlier page to show what `HR` looks like (it doesn''t matter which
    example you use, or whether you make up your own).


    The horizontal rule tag can be a very simple tag, as shown here:


    ```html

    <HR>

    ```


    Or you can add other attributes to it such as its width as a percentage, like
    this:


    ```html

    <HR WIDTH=75%>

    ```


    And you can even add a color attribute like this:


    ```html

    <HR WIDTH=500 SIZE=5 COLOR="#804040">

    ```


