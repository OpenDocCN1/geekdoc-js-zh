- fmt: "\n![Image](content/d938f552af65a53b177029c39d905885.gif) Learn how to use\
    \ HTML tables\n\n![Image](content/d938f552af65a53b177029c39d905885.gif) Learn\
    \ how to get form data via the GET and POST methods\n\nPage 222\n\n## Receiving\
    \ Data from Forms\n\nAs always, the best way to demonstrate the way you use forms\
    \ is by way of a simple example. But first, you should learn about another feature\
    \ of HTML: tables. This is a good time to discuss HTML tables, as they are very\
    \ useful for creating neat form layouts!\n\n### HTML Tables\n\nHTML tables are\
    \ used to (amongst other things) format the contents of a Web page. In this section\
    \ you'll learn how to use them to make a Web input HTML form look prettier. Tables\
    \ are not essential for forms—but they do make them look better. You could just\
    \ use spaces `&nbsp;` and breaks `<BR>` to position the form elements on the page,\
    \ but it probably wouldn't look very good.\n\nAs you would expect, a table starts\
    \ with the `<TABLE>` tag. The `<TABLE>` tag has a number of attributes; for example,\
    \ you can use `background = imagename.jpg` to set the background image of a table,\
    \ just like you did for the `<BODY>` tag. In the same way, you can set the background\
    \ color using the `bgcolor` attribute.\n\nYou can set the width of the table using\
    \ the `width=nnn` or `width=nn%` attributes of the table tag, rather like the\
    \ `width` attribute of the `<HR>`, horizontal rule tag.\n\nA typical table tag\
    \ might look like this:\n\n```html\n<table width=600 bgcolor=lightblue>\n```\n\
    \nThis code says to create a table 600 pixels in width with a light blue background\
    \ color. Simple enough, isn't it?\n\nA table achieves its aims by being what you\
    \ would expect it to be: a table of rows and columns into which you can place\
    \ the elements, pictures, or text you choose.\n\nAt the top of a table, you can\
    \ have an optional \"header\" row, intended for things like titles. A header row\
    \ looks like this:\n\n```html\n<tr><th width=200>Column Title 1</th><th width=200>Column\
    \ Title 2</th><th width=200>Column Title 3</th><tr>\n```\n\nPage 223\n\nThe `<tr>`\
    \ tag signifies the start of a table row. The `<th>` tag defines a table header\
    \ for a column, in this case the width of the header, and therefore the whole\
    \ column has been fixed at 200 pixels (again, percentages could be used). The\
    \ `</th>` tag closes this header. In this example, there are three identical headers\
    \ containing three column titles for the table.\n\nNote that although the width\
    \ of the headers is set in this example to 200 pixels, if the title between the\
    \ `<th>` and `</th>` tags exceeds 200-pixel width, the column will stretch (that\
    \ is, any cells directly beneath the header tag will stretch) to accommodate the\
    \ text, image, or whatever you choose to place within it.\n\nAt the end of the\
    \ headers, the row is closed using the `</tr>` tag.\n\nFollowing rows can contain\
    \ what HTML calls data. The format of the data rows is very similar to the header\
    \ row, except that the individual cells are defined by `<td>` tags instead of\
    \ the `<th>` tag of the header row. A header row or a data row can also have its\
    \ own width tags, background color tags, and so on.\n\nA data row may look like\
    \ this:\n\n```html\n<tr><td>Column Title 1</td><td>Column Title 2</td><td>Column\
    \ Title 3</td><tr>\n```\n\nAn HTML table can contain many rows of data, which\
    \ is, as you will see, very useful in Web-based applications.\n\nEach `<td>` or\
    \ `<th>` tag can have its own background color, `bgcolor`, `width`, and `height`\
    \ attributes. They also can have tags for aligning the contents of the cell. Horizontally,\
    \ alignment can be specified as left, center, or right. Vertically, alignment\
    \ can be specified as top, middle, or bottom. So for example, a `<td>` tag can\
    \ have its alignment attributes specified thus:\n\n```html\n<td align='center\"\
    \ valign=\"top\">\n```\n\nNote that the `valign` and `height` attributes can also\
    \ be added to the `<tr>` tag.\n\nThe HTML table is closed, as you would expect,\
    \ using the `</table>` tag.\n\nThe following form example shows how a table is\
    \ used to position the form elements to produce a neat layout.\n\nPage 224\n\n\
    1. Open your editor.\n2. Create a new HTML page.\n\n![Image](content/f6b12346217b6b43074253fe70df9fa5.gif)\n\
