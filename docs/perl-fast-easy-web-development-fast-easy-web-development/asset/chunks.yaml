  trans: "\n\n# 联系人数据库应用需要哪些要求？\n\n简单来说，你需要能够：\n\n• 添加新联系人\n• 更新现有联系人\n• 删除联系人\n•\
    \ 列出联系人\n\n是的，可以应用各种变体和改进，但基本上这是任何数据库应用的核心需求。其他所有内容都是微调（尽管某些微调非常有用）。我将在本章最后提到一些你可能想尝试的微调。\n\
    \n你已经知道想对数据库做什么，那么你对哪些数据项感兴趣呢？这里有一组基础数据：\n\n• 名字\n• 中间名缩写\n• 姓\n• 地址（门牌号、街道等）\n\
    • 城镇/城市\n• 邮政编码/邮码\n• 电话号码\n• 电子邮件地址\n\n这构成了一个有用信息集的基础。你可能还想存储其他信息，你可以回来添加任何你需要的额外信息。或者，你当然也可以更改所有数据，并将该程序完全用于其他用途。\n\
    \n现在你知道我们要做什么，以及用什么来做了。是时候视觉化一下应用程序应该长什么样，以及它应该如何运行了。当我说“样子”时，我指的不是审美——那并不重要，而且在你对应用程序满意后可以再推琢。我的意思是它将如何工作。\n\
    \n一个很好的起点是想象你自己是新应用程序的用户。当程序启动时，你期望看到什么？你认为新记录应该是如何添加的，这种过程应该是如何运作的？你如何在系统中导航？简而言之，如何才能尽可能让你的应用程序更加友好且不那么笨拙？\n\
    \n一个好的起点是在纸上画出你的想法，规划你的应用程序包含哪些内容以及它们如何组织在一起，注意导航和逻辑事件顺序。\n\n![Image](img/ff7dab7912fd1c7fb393d4bf57f57b5a.gif)\n\
    \n这是我为这个简单应用采用的方法。我认为这个简单的设计非常浅显易懂。我给文件命名了，以便让你了解它们应该的功能。实线是通往应用程序不同部分的链接。虚线是你可能想要为了方便导航而设置的可能链接。\n\
    \n现在，你可以开始组装你的应用程序了。\n\n## 主页\n\n一个很好的起点是 `home.htm` 页面，这是一个简单的 HTML 页面，作为应用程序的首页和菜单。\n\
    \n顶层页面（`home.htm`）没有什么特别吸引人的。它只是一个简单的 HTML 页面，带有两个指向“列出联系人”程序和“添加新联系人”页面的链接。\n\
    \n**1.** 打开你的编辑器并开始一个新的 HTML 页面。\n\n```html\n<html> <head>\n```\n\n![Image](img/e8fd965b29abfc9be90592d8179589be.gif)\n\
    \n![Image](img/ef7796c3c795e4dfb36090c0714acf35.gif)\n\n**8.** 将你的页面保存为 `home.htm`，存放在名为\
    \ `Contacts` 的合适文件夹中。\n\n**9.** 如果你愿意，打开浏览器查看你的 `home.htm` 页面。\n\n好了，你已经开始制作你的联系人数据库应用了。你还需要一个\
    \ Perl 脚本来以列表的形式显示数据库中的联系人。让我们接着做这个。\n\n## listcontacts.pl 程序\n\n`listcontacts.pl`\
    \ 程序简单地读取数据库表的内容，并列出每条记录的名字、姓和城镇字段。（数据库设计的视图在本章末尾）。在此程序中，使用了 ADO 连接 Access 数据库。这里不应该有什么意外，但如果某些地方对你不理解，请参阅第\
    \ 14 章“数据库”。\n\n**1.** 打开你的编辑器并开始一个新的 Perl 程序。\n\n```perl\n#!c:/perl/bin\n```\n\
    \n![Image](img/b7a0362508eceee3461c5e17cf59e656.gif)\n\n![Image](img/f33738f91d09e9e0784996f44815f83b.gif)\n\
    \n| **注意** |\n| :--- |\n| 注意你正在使用 `SELECT * FROM $table` 类型的 SQL 语句，这意味着获取所有列。对于像这样的小型程序来说没问题，但你实际上取回了不需要的列，因此数据库和网络在做不必要的工作。这为了让这个示例保持简单，但一个改进的\
    \ SQL 语句应该是：`$sql = 'SELECT id, firstname, lastname, town FROM $table';` |\n\n\
    ![Image](img/afc177cd2dee2d70c6cde598ac3dc095.gif)\n\n![Image](img/efc70583ba21a5f415da0acac9328aee.gif)\n\
    \n**8.** 只为了整洁，关闭 `<body>` 和 `</html>` 标签。\n\n```html\n</body> </html>\n```\n\n\
    **9.** 将你的程序保存为 `listcontacts.pl`。\n\n`listcontacts.pl` 程序写完成了。当然，你现在还不能运行它，因为还没有数据库来运行它！接下来你将创建一个表单来向数据库添加数据，以及一个插入数据的\
    \ Perl 脚本。\n\n## addcontact.htm\n\n你现在有了 HTML 表单，以及需要传递给插入数据的 Perl 程序的所有数据；这里将是\
    \ `addcontact.htm`\n\n这是一个简单的 HTML 表单，将数据发送到 `insertrec.pl`。你还将使用 JavaScript 检查用户是否输入了数据。\n\
    \n![Image](img/d52879be9125bd)\n\n```html\n<script>\nfunction checkfields() {\n\
    \  var okeyey = 1;\n  if (document.firstname == \"\") {\n    alert(\"你没有输入名字\"\
    );\n    okeyey = 0;\n  }\n  if (document.lastname == \"\") {\n    alert(\"你没有输入姓\"\
    );\n    okeyey = 0;\n  }\n  if (document.street == \"\") {\n    alert(\"你没有输入街道\"\
    );\n    okeyey = 0;\n  }\n  if (document.town == \"\") {\n    alert(\"你没有输入城镇\"\
    );\n    okeyey = 0;\n  }\n  if (document.postcode == \"\") {\n    alert(\"你没有输入邮编\"\
    );\n    okeyey = 0;\n  }\n  if (document.phone == \"\") {\n    alert(\"你没有输入电话号码\"\
    );\n    okeyey = 0;\n  }\n  if (document.email == \"\") {\n    alert(\"你没有输入电子邮件地址\"\
    );\n    okeyey = 0;\n  }\n  if (okeyey) {\n    document.addrec.submit();\n  }\n\
    }\n</script>\n```\n\n| **注意** |\n| :--- |\n| 注意函数的最后部分。它对 `okeyey` 进行检查以决定是否提交表单。如果有错误且\
    \ `okeyey` 为假，则不会执行提交方法，表单会停留让用户修正错误。每次修正错误，`checkfields()` 函数都会再次执行。如果一切正常，表单将被提交，你的数据将发送到插入数据的\
    \ Perl 程序。 |\n\n![Image](img/e45f9b093c40934404d5ae3458beb7.gif)\n\n![Image](img/28b13b95801359bb239d5cb61e95be4.gif)\n\
    \n![Image](img/49772bf3827d9000910820d864cc643e.gif)\n\n**10.** 将你的 HTML 页面保存为\
    \ `addcontact.htm` 到 wwwroot 下的 Contacts 文件夹中。\n\n## insertrec.pl 程序\n\n你现在有了\
    \ HTML 表单，以及需要传递给插入数据的 Perl 程序的所有数据；这里将是 `insertrec.pl`。\n\n**1.** 在编辑器中打开一个新的\
    \ Perl 程序：\n\n```perl\n#!c:/perl/bin\n```\n\n![Image](img/86f309183eee6a76bd680ab61d5f041b.gif)\n\
    \n![Image](img/d8f8a1bc8fca0e5b33e7203f11ad8087.gif)\n\n![Image](img/9225d159b487df6016c2082f98356f0e.gif)\n\
    \n"
