    be able to write a Web page from scratch, using little more than a simple text
    editor and your Web browser.


    Start by telling the browser that this is an HTML document. To do this, you use
    the `<HTML>` tag. You end the HTML document with the `</HTML>` tag. All end tags
    are the same as the start tags, except they have the forward slash at the start
    of the tag name.


