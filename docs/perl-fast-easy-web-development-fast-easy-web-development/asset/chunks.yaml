    ## Reading Records from a Database Using ADO


    In this chapter you are going to learn two methods of using databases with Perl—using
    OLE (Object Linking and Embedding) database access, and the Perl `DBI` method.
    The first method is often referred to as ActiveX Data Objects, or `ADO`. In this
    section you will learn how to select records from a relational database using
    `ADO` and `SQL` (Structured Query Language, the language used to select records
    from the database, write records to it, and so on). An in-depth discussion on
    `SQL` is beyond the scope of this book, but you will learn sufficient `SQL` to
    perform the most common database functions—read, write, delete, and so on.


    Page 290


    **1.** Open your editor and start a new program.


    ```perl

    #!/usr/bin/perl

    ```


    ![Image](content/6259ed7ec1934d0400f10b74bc16f76.gif)


    NOTE: A `recordset` is a temporary table containing the records that are returned
    from your database query.


    Page 291


    ![Image](content/8613995acc8a34a97a2b93a739.gif)


    NOTE: This statement means: Select all the columns from a table whose name is
    held in the variable `$table`. That is, `*` means "all columns." You could instead
    simply name all the fields you want returned from the query, like this:


    ```perl

    $sql = "SELECT firstname, lastname, address FROM $table";

    ```


    You can also add a `WHERE` clause, which filters the records, like this:


    ```perl

    $sql = "SELECT * FROM $table WHERE lastname=''Bate''";

    ```


    Finally, you can change the order of the records by using the `ORDER BY` clause,
    like this:


    ```perl

    $sql = "SELECT * FROM $table ORDER BY lastname";

    ```


    Page 292


    ![Image](content/c99716efaa2dd77609b582b35223b31.gif)


    NOTE: The `1, 1` is an advanced feature that controls the way in which the records
    are read using cursors (you can have different cursors for reading and writing
    to database tables) and LockTypes (as they are called in `ADO` parlance), which
    determine what kind of locking should be used for different purposes. These are
    advanced features that we will not delve into here; for now, just code them as
    they are.


    Page 293


    ![Image](content/cd78771fa4614a6af4c30ab2a6292dbf.gif)


    **18.** Save your program as `14-01.pl` in your scripts folder.


    ![Image](content/561ca2dd1523c6a066069d462a6857e4.gif)


    If you don''t get results like this, check the code and try again.


