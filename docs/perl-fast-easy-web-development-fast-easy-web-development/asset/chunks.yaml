    ## 开始入门


    本章将介绍如何在你的机器上设置 Perl。这里的重点是 Windows 用户，但对于其他平台的设置建议也并不缺少。请参阅本书附录 B 中实用的 URL，你可以在那里找到
    Perl  way 的网站地址，以及提供详细建议、示例和更新的海量 Perl 资源网站。当你浏览互联网时，请看看这些网站——它们确实是获取 Perl 相关知识的极佳来源！


    具体来说，本章将涵盖：


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 哪里获取 Perl


