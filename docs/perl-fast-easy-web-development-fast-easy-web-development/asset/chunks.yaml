    也将显示：


    The position of "Web" in $teststring is: 17;


    ### substr() 函数


    `substr()` 函数允许你从另一个字符串中提取部分字符串。其语法如下：


    ```

    Substr( $wholestring, offset, length, $replacementstring);

    ```


    这意味着检查 `$wholestring`（可以是变量或字面量），从 `offset` 位置开始，长度为 `length`，如果找到子字符串，则将其替换为
    `$replacementstring` 的内容（该也可以是字面量）。


    因此，以下代码：


    ```perl

    $wholestring = "Cats are cute"; $substring = substr( $wholestring, 0, 4, "Dogs");
    print $substring;

    ```


    将给您输出：


    Cats are cute


    第第 399 页


    如果你省略了 `$replacementstring` 参数，则只返回子字符串，因此与上述代码相同但没有 `$replacementstring` 参数的代码将给出：


    Cats


    `substr()` 是一个非常强大的函数。


    ### tr/// 运算符


    `tr///` 运算符严格来说不是函数，但可以认为它提供了函数功能。`tr///` 运算符的语法为：


    ```

    tr/ searchstring / replacestring /

    ```


    正斜杠仅仅是分隔符。


    `tr///` 运算符非常强大。考虑以下内容：


    ```perl

    $newstring =~ tr/a-z/A - Z/

    ```


    这将替换字符串中 a 到 z 范围内的每个字符，并将其替换为对应的大写字母 A 到 Z。


    注意 `=~` 符号。这被称为*绑定运算符*，如果不使用它，操作将在 `$_` 中的任何内容上执行。在这种情况下，你不会在左侧使用变量，如下所示：


    ```

    tr/a-k/A-K

    ```


    你还可以在翻译运算符的末尾添加修饰符。因此


    ```

    tr/a-k/h-k/c

    ```


    （其中 `/c` 是修饰符）会替换任何不在搜索字符串中的字符。


    ```

    tr/a-k/h-k/c

    ```

