    让我们再看几下 `CGI.pm` 能够做的其他几件事。


    第 348 页


    ### 表单与 CGI.pm


    `CGI.pm` 还可以构建表单。你可以动态生成 HTML 来创建表单，包括所有常规元素，如选择框、文本区域和提交按钮。尝试以下程序，它包含了你可能期望在表单中看到的许多常规元素。由你来判断它有多么容易使用。


    你在这里创建的页面将调用自己。这个表单在每次执行表单时都会记住所有字段的状态或值。稍后你会明白我的意思的。


    **1.** 在编辑器中打开一个新程序。


    ```perl

    #!c:/perl/bin

    ```


    ![Image](img/e72d44c096ce583c799a00d4b2e8e938.gif)


