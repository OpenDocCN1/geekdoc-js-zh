    Perl 与大多数其他语言不同，它只支持一维数组，因此二维数组必须使用引用数组或指针来模拟。你很快就会有机会研究引用了。


    第 95 页


    ### 6. 哈希映射（Hashes）


    哈希在 Perl 中有时被认为是一个晦涩的主题。这种认知在很大程度上源于所谓的“误导且不一致”的语法。出于这个原因，这个短章节的开头包含了对什么是哈希以及如何在
    Perl 中引用它们的讨论。希望你将发现哈希不仅有用，而且完全符合逻辑！随后，你将学习并练习如何使用这种强大的数据结构。所以，请继续读下去并耐心听我说；这段旅程是值得的。


    在本章中，你将学习什么是哈希以及如何使用哈希前缀，以及如何：


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 初始化哈希


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 创建哈希


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 加载和搜索哈希


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 从哈希中移除键


    第 96 页


    ### 什么是哈希？


    哈希（有时称为*关联数组*）在作为标量值列表这方面与“普通”数组相似的。然而，它们的访问方式是不同的——该机制利用“键”（keys）而不是简单的数字下标。关于哈希需要记住的重要点仅仅是引述或指定它们的顺序，即先指定键，后指定值。在大多数其他方面，哈希可以被看作一个你可以向其中倾倒数据的桶。


    哈希拥有像标量和数组一样的前缀。对于哈希，前缀是 `%` 符号。这表示在使用时，你正在引用整个哈希；如果你想访问哈希的单个元素，则像处理数组一样使用 `$`
    前缀。这可能看起来很令人困惑，直到你考虑到你只是在引用哈希内部的单个标量；因此，你使用标量表示法。只有当你访问整个哈希时，才使用哈希的 `%` 前缀符号。


    哈希为你提供了一种实用的查找机制，有点类似于数据库表。唯一键被用于定位给定的值。哈希的速度是均匀快速的；也就是说，哈希可以增长得很大，而速度几乎不会下降，而且只要你的机器有资源来处理它们，你就可以让它们变得随你想要的大小！


    哈希有许多用途，尤其是在 Web 应用中，它们对于处理来自 HTML 表单的输入、CGI 环境变量等非常有用。


    ### 哈希前缀


    哈希拥有像标量和数组一样的前缀。对于哈希，前缀是 `%` 符号。这表示在使用时，你正在引用整个哈希；如果你想访问哈希的单个元素，则像处理数组一样使用 `$`
    前缀。这可能看起来很令人困惑，直到你考虑到你只是在引用哈希内部的单个标量；因此，你使用标量表示法。只有当你访问整个哈希时，才使用哈希的 `%` 前缀符号。


    第 97 页


    ### 初始化哈希


    要初始化哈希，只需：


    ```perl

    %animals = ();

    ```


    现在你有了一个名为 `animals` 的哈希，其中没有键或值。


    ### 创建哈希


    你可以单独或一次性向哈希添加键值对。要向哈希中添加元素，你可以这样做：


    ```perl

    $animals{''Horse''} = ''Red Rum'';

    ```


    这为哈希 `animals` 增加了一个键值对。（注意 `$` 前缀。正如你之前看到的的，你使用 `$` 前缀是因为你正在访问哈希的单个元素）。


    如果你想一次添加多个元素，可以按照以下方式进行：


    ```perl

    %animals = (''Red Rum'', ''Horse'', ''Jaws'', ''Shark'', ''King Kong'', ''Gorilla'');

    ```


    现在，这样做是可以的，但你是否注意到在阅读整个列表时发生了什么？随着列表的增长，想象一下当你尝试跳到列表中间时会发生什么。对于你这里使用的主题和名称，很容易判断哪个是键哪个是值。然而，在某些情况下，这并不明显，因此
    Perl 有另一种表示法可以帮助你判断哪个是哪个，无论列表有多长。这种表示法被称为*逗号箭头运算符*（comma-arrow operator），看起来如下：


    ```perl

    %animals = (Horse => ''Red Rum'', Shark => ''Jaws'', Gorilla => ''King Kong'');

    ```


    现在你可以很容易地看到 `=>` 运算符从键指向哈希中该对的数据。不仅如此，你现在还可以添加换行符/回车和其他空白字符而它仍然可以正常工作，因此你可以通过每行使用一个键值对来使程序中的哈希定义更具可读性，如下：


    ```perl

    %animals = (Horse => ''Red Rum'', Shark => ''Jaws'', Gorilla => ''King Kong''
    );

    ```


