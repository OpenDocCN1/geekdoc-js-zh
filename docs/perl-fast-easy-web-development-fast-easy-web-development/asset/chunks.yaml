    \ 函数，该函数可以检查你是否填写了所有必填字段，在适当的地方显示错误信息，或者在没有错误的情况下提交你的表单。 |\n\n**21.** 将你的页面保存为\
    \ `15-02.htm` 并检查以确保它运行正常。\n\n第 328 页\n\n![Image](img/9e04b26f41445962c02b34b1976911f.gif)\n\
    \n| **注意** |\n| 如果你在姓（surname）字段中输入了名字，那么正如前面说的，你将看到除了页面刷新和姓字段变空之外，什么都没有发生。 |\n\
    \n 还有另一种方法可以让表单更加实用且用户友好，特别是对于具有许多字段的表单。你可以使用 JavaScript 的 `focus()` 方法将用户引导回出错的字段。\n\
    \n![Image](img/d33b9db6ffab4b93be2bd2ef6547efa4.gif)\n\n**2.** 将你的页面保存为 `15-03.htm`\
    \ 并确保它运行正常。\n\n第 329 页\n\n![Image](img/7ece97f997bbd332bd4d3fb9b2047816.gif)\n\
    \n### 更多 JavaScript 函数\n\n如果你想检查用户输入的内容是否为数字呢？JavaScript 有名为 `isNaN()` 的函数，意思是“是否不是数字”。此函数返回一个布尔结果（True\
    \ 或 False），如果传递给它的值不是数字，则返回 True。\n\n你可以像这样使用 `isNaN`：\n\n```javascript\nif(isNaN(variable)\
    \ {\n```\n\n第 330 页\n\n![Image](img/9314c0ad05cde4a53dcc0f28239f2aeb.gif)\n\n\
    **3.** 将页面保存为 `15-04.htm`。\n\n![Image](img/59404ea124d337100720d8f6d194b02c.gif)\n\
    \n第 331 页\n\n![Image](img/5c0acb28d8ecd96e00a032f3a784ac38f.gif)\n\n如果你想检查两个字段，例如年龄和姓氏呢？你可以将两个检查都放在一个函数中，这运行得良好。但如果表单包含\
    \ 15 或 20 个字段呢？如果有很多错误又怎样？\n\n嗯，用户会收到很多错误信息，但可能只记得最后二三个；他或她必须再次点击按钮来获取其他错误。更好的方法是逐个检查每个字段，当你发现问题时，跳过剩余的检查并显示第一个错误信息。用户纠正该错误后，当他或她再次点击按钮时，会出现下一个错误信息，直到表单没有错误，此时提交表单。\n\
    \n这很容易做到。\n\n**1.** 再次打开你的 HTML 页面。\n\n![Image](img/7f732100cd7e83650e46bfcb67a72297.gif)\n\
    \n第 332 页\n\n![Image](img/af67dc84f9ebb6fb89e5f282556b7cf5.gif)\n\n| **注意** |\n\
    | 注意 `if` 语句说：`If (isNAN(testVariable) && okeydokey)` |\n| 记得我说过任何非零值都是 True 吗？这意味着上面的\
    \ `okeydokey` 会被值 `True` 替换。遵循逻辑看看你是否理解它是如何工作的！ |\n\n第 333 页\n\n![Image](img/5a73d9f4183fa42aacf52203287e7b17f.gif)\n\
    \n**9.** 将页面保存为 `15-05.htm`。\n\n![Image](img/2e234312145c6f2604badb51ea4a7f33f.gif)\n\
    \n第 334 页\n\n![Image](img/9046019f0d24b176c696fe119871055f.gif)\n\n现在你知道如何检查表单中的空字段，以及如何引导用户回到填写错误的字段了。\n\
    \n### 电子邮件地址验证\n\n电子邮件地址验证是你可能想要用 JavaScript 实现的另一个实用用功能。但你如何检查电子邮件地址呢？为了避免偶尔的拼写错误，有几个基础检查是做的。\n\
    \n一个有效的电子邮件地址通常包含以下内容：\n\n- 电子邮件地址字符串中有一个 `@` 符号。\n- `@` 符号之前有一些字符。\n- `@` 符号之后有一些文本。\n\
    - `@` 符号之后的字符中有一个点（period）。\n\n如果这些检查没有发现问题，那么该地址可能没问题。\n\n第 335 页\n\n![Image](img/18096b64dd94999e9087e95dd9650603.gif)\n\
    \n![Image](img/a1b984c5ea7803d956e0e6e3fcbc52e.gif)\n\n第 336 页\n\n![Image](img/9b6acf8800678d9c4c9b291a67fe.gif)\n\
    \n第 337 页\n\n![Image](img/b829bfae915621b5741faf23d8a23f067edec48529814f.gif)\n\
    \n第 338 页\n\n![Image](img/2a17b55978fa7b9e1bc91a7eb53.gif)\n\n第 339 页\n\n![Image](img/886abc45ff6e5bd741e53.gif)\n\
    \n![Image](img/85119a90cf15e46529815d3704db.gif)\n\n有很多书籍、网站和课程教授 JavaScript。我敦促你深入研究\
    \ JavaScript，因为它是一个可以节省服务器端工作的非常有用的工具。\n\n第 340 页\n\n*本页留白。*\n\n第 341 页\n\n##\
    \ 16 CGI.pm 模块\n\n在书中，你已经学习了（除其他之外）关于 Perl、HTML 以及如何从 Perl 创建 HTML。这是非常有用的，因为学习如何从\
    \ Perl 动态创建 HTML 加强了你所学的内容。在本章中，你将学习一个名为 `CGI.pm` 的模块，它简化了 HTML 的创建。具体来说，你将学习：\n\
    \n![Image](img/d938f552af65a3b177029c385.gif) `CGI.pm` 是什么\n\n![Image](img/d5552af65a3b177029c385.gif)\
    \ 如何使用 `CGI.pm` 开始和结束 HTML 页面\n\n![Image](img/d5552af65a3b177029c385.gif) 如何使用\
    \ `CGI.pm` 使用表单\n\n![Image](img/d5552af65a3b177029c385.gif) 如何以面向对象的模式使用 `CGI.pm`\n\
    \n第 342 页\n\n### CGI.pm 模块背后的想法是什么？\n\n`CGI.pm` 模块试图简化并规范 CGI 应用中使用的函数。 CGI 程序执行过程中需要采取的一些操作并不直观，某些操作的必要性已迷失在时光流中——早在\
    \ 90 年代！\n\nPerl 是一种强大的语言，但为了完成一些本该简单的事情仍然需要进行一些复杂的体操。事实是现有技术已经进步，出现了一些新技术，但在许多情况下，我们仍然只有非常原始的机制来访问这些技术。\n\
    \n你已经看到发送头（`print \"Content-type: text/html\\n\\n\";`）有多单调，以及从表单获取数据有多困难。该模块旨在简化这一切，提供\
    \ CGI 函数接口，并让你更快速更方便地创建 HTML 表单和后端 CGI 脚本。`CGI.pm` 模块中有许多函数，在本章中将学习一些常用的。\n\n\
    要使用 `CGI.pm` 函数，你必须导入 `CGI.pm` 模块方法。你可以通过以下语句来实现；此语句使 `CGI.pm` 模块包含的函数在程序可用：\n\
    \n```perl\nuse CGI qw(:standard);\n```\n\n`qw` 仅仅是将 `:standard` 包起来的方式。\n\n你也可以使用：\n\
    \n```perl\nuse CGI ':standard';\n```\n\n`:standard` 指的是标准函数集，这样你可以使用不那么长的方法来引用函数。\n\
    \n快速学习这些 `CGI.pm` 函数的最佳方法是通过示例，让我们直接开始吧。\n\n第 343 页\n\n### 使用 CGI.pm 开始和结束 HTML\
    \ 页面\n\n使用传统的 HTML 开始和结束页面并不困难。你可以使用 Perl 的 `print` 语句逐行创建 HTML（有点单调），或者可以使用附录\
    \ A“更多 Perl 函数”中描述的文档，或者第 17 章“案例研究：联系数据库”中演示的方法。\n\n但尝试一下：\n\n**1.** 打开你的编辑器并启动一个新的\
    \ Perl 程序。\n\n```perl\n#!c:/perl/bin\n```\n\n![Image](img/cd2226193b2b246888e7ce17b4e2c1b0.gif)\n\
    \n第 344 页\n\n![Image](img/35d8ba303d482b2964542575d623af5c.gif)\n\n| **注意** |\
    \ 这等同于使用 `<<h1>>Welcome to Perl Fast and Easy: the CGI.pm module!</h1>` |\n| **注意**\
    \ | 这就像使用 `</body></html>` |\n\n**9.** 将你的程序保存为 `16-01.pl` 存放在你的脚本文件夹中。\n\n第 345\
    \ 页\n\n![Image](img/e0526f31b881e938dddd95a6a9bce0b0.gif)\n\n这比标准 HTML 要整洁一点，不是吗？\n\
    \n"
