    ### **What Is Program Flow?**


    *Program flow* is the property of a program that gives that program the capability
    to make decisions or to do repetitive work. In programming logic, there are basically
    three program structures: sequence, selection, and iteration.


    #### **Sequence**


    *Sequence* is a mode of programming in which a sequence of instructions is executed
    in the order in which the instructions are written until the program reaches the
    end. Most of the old assembly language programs were of this type (with a few
    ''''go to" statements or something similar thrown in).


    #### **Selection**


    *Selection* is concerned with the route through a program dependent upon values
    presented to it or values calculated or derived within a program. In other words,
    when a program is executed, the statements that are executed are decided upon
    based on certain data. Some of that data might come from outside the program under
    consideration; other data might be the result of calculations occurring within
    the program.


    The main tools used in selection are variants of the IF and CASE statements.


    #### **Iteration**


    Iteration is a fancy name for looping. *Looping*, when it is unintentional, can
    be a programmer''s nightmare. But it can also be very useful if used correctly;
    for example, a loop construct can be used to process records in a file or database.


    There are a number of loop constructs; the most common in most languages are the
    for loop, the while loop, and the repeat loop.


    Page 107


    ### **Program Flow in Perl**


    First of all, let us discuss the program block. This is a group of statements
    that are always executed one after the other. They are wrapped in braces, like
    this:


    { statement one; statement two; statement three; statement four; }


    You can nest a block of statements inside another block. Note that although it
    makes no difference to the way a program works, blocks of code are usually indented
    from the rest of the code before and after them. This helps to make code more
    readable and to simplify future maintenance. Blocks are usually found in loop
    constructs and IF statements, and these too will be indented, again, just to make
    the program easier to read.


    ### **The If Statement**


    The if statement is one of Perl''s selection statements. It enables Perl to make
    decisions based on the values contained in variables.


    The if statement in Perl is similar to that in C, C++, and other languages.


    If (condition) { statement …; statement …; } elsif { statement …; statement …;
    } else {


    Page 108


    statement …; statement …; }


    Note that often you will find the first curly brace on the same line as the if
    (condition) part of the statement, like this:


    If (condition) { statement …; }


    Once again, this is just convention and it is up to you whether or not to adopt
    it. If you are not working to any set rules within an organization, just be consistent.
    Otherwise you might confuse people who attempt to maintain or learn from your
    program.


    The elsif/else part of the if construct is optional. You might not need one; in
    fact, often you will not. Also note that spelling of elsif.


    You can also have if statements within if statements or within else clauses, and
    you will come across many differing examples. You have leaned the basic syntax
    of the if statement, so now it is time to try one out. You have actually seen
    this example before, but it won''t hurt to cover it again.


