    ### 空格


    Web 浏览器只会注意到遇到的第一个空格字符。如果你在单词之间放置三个空格，将只显示一个空格，任何随后的空格都会被忽略。要解决这个问题，你必须输入 HTML
    不换行空格。这不是一个 HTML 标签，而是一个转义码（escape code）：


    `&nbsp;`


    它被称为转义码（或转义序列），因为它会导致系统跳出当前进程，执行代码，然后返回系统。`&` 字符开始转义，分号表示代码的结束。


    你可以将若干 `&nbsp;` 代码组合在一起，使文本沿行移动得更远，提供另一种简单的文本格式形式。虽然有更好的方法，但这种方法确实有其用途。


    再次，修改你的 HTML 代码以添加一些 `&nbsp;` 转义码。


