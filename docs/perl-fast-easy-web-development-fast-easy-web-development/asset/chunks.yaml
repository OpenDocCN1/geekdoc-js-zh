    ## **3 Data Types: Scalars**


    Perl has four built-in data types. They are scalars, arrays, hashes and references.
    *Scalars* are basically single items of data. *Arrays* are lists of data accessed
    by means of a numeric subscript, and *hashes* are lists of data accessed via another
    variable or literal; arrays and hashes will be covered in later chapters. A *reference*
    is a ''''pointer" to something else. For example, references are used as "file
