    \ both the `GET` and `POST` methods. This is a major milestone, as you have now\
    \ made the link from user input at a form in the user's Web browser to actual\
    \ data available for use on the server.\n\nSo, you can create the forms and you\
    \ can grab the data in your Perl program. Now, what are you going to do? One thing\
    \ you might like to do is to save the data into a file. So, in the next chapter\
    \ you will learn about files.\n\nPage 234\n\n*This page intentionally left blank.*\n\
    \nPage 235\n\n## 12 Using Files in Perl\n\nIn this chapter, you'll learn how to\
    \ use files in Perl—how to create them, write to them, read from them, and delete\
    \ them. You will also learn how to create and remove directories in Perl.\n\n\
    In this chapter you will learn how to:\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ Open a file in Perl\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ Read data from a file\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ Close a file\n\n![Image](content/d938f552af65a53b177029c39d905885.gif) Use directories\n\
    \n![Image](content/d938f552af65a53b177029c39d905885.gif) Delete a file\n\nPage\
    \ 236\n\n### Opening Files in Perl\n\nBefore you can do anything with a file,\
    \ you need to open it. This is done using the Perl `open` function. The general\
    \ syntax for the `open` function is\n\n```perl\nopen(MYFILE, \"testfile.dat\"\
    ) || die \"Error encountered when opening file ...\";\n```\n\nThis means that\
    \ Perl will attempt to open a file whose file handle is `MYFILE`. A *file handle*\
    \ is a reference variable that is used to store the *internal name* of the file,\
    \ that is, the name by which the Perl program will recognize the file.\n\nFollowing\
    \ the file handle is the real name of the file; in this example, `testfile.dat`.\n\
    \nNotice in the line of code that the next thing on the line is a *double pipe*.\
    \ This is the `OR` operator and is used here to execute whatever follows it if\
    \ the file open code fails. In other words, if for any reason the file cannot\
    \ be opened by Perl, the code following the `||` symbol will be executed.\n\n\
    The code after the double pipe `OR` operator simply says\n\n```perl\ndie \"Error\
    \ encountered when opening file ...\"\n```\n\nThe `die` function then stops the\
    \ program running after displaying the message \"Error encountered when opening\
    \ file .. ..\".\n\nA general error message in itself isn't very helpful. However,\
    \ Perl also has a special error variable that holds the error message for an event\
    \ such as this. This is the `$!` variable. You can now add this variable to the\
    \ `die` error message:\n\n```perl\nopen(MYFILE, \"testfile.dat\") || die \"Error\
    \ encountered when opening file . . . $!\";\n```\n\nAs you would be unable to\
    \ see anything when a file is successfully opened, trying an example would be\
    \ a bit pointless right now. The next step will be to read a file so that you\
    \ can see the `open` function in action and see how data is read from a file.\
    \ If you want to, you can rename the input file so that the program cannot find\
    \ it, and then try out the `die` function and error message.\n\nPage 237\n\n###\
    \ Reading Data from a File\n\nData may be read from a file in Perl using the angle\
    \ operator `< >`. To get a line of data, you simply wrap the file handle in the\
    \ angle operator like this:\n\n```perl\n$dataline = <MYDATA>;\n```\n\nThis will\
    \ take any data from `MYDATA` (`testfile.dat`) and store it into `$dataline`.\
    \ The data will stop when a newline character is encountered.\n\nThe end of a\
    \ file is recognized when the file handle returns `undefined`. So to read and\
    \ display the whole contents of a file you can do this:\n\n```perl\nwhile (defined($dataline=<MYFILE>))\
    \ { print \"$dataline <br>\"; }\n```\n\nThis can be simplified still further if\
    \ you do not have any other conditions in the `while` statement. The `while` statement\
    \ will execute while the conditions in the following parentheses are True. The\
    \ condition \"undefined\" of the file handle is effectively False.\n\nTherefore,\
    \ you can now say\n\n```perl\nwhile (<MYFILE>) { print; }\n```\n\nNote that now,\
    \ unless you had `<BR>` tags at the end of your lines of data in the file, the\
    \ data would all be joined together. Of course, you could put a separate print\
    \ line after the empty one to provide the `<br>` tag.\n\n```perl\nwhile (<MYFILE>)\
    \ { print; print \"<br>\"; }\n```\n\nPage 238\n\n| NOTE | |\n| :--- |\n| You cannot\
