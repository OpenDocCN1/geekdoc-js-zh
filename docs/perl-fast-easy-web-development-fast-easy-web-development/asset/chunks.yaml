    `chop()` 的行为与处理字符串变量时完全相同。这并不完全意外；正如你所记得的，标量（scalar）可以是字符串或数字，事实上，它可以是任何数据类型的任何单个值。`chop()`
    接收一个标量变量作为其参数（或参数），因此无论它包含什么，`chop()` 都会以相同的方式处理它。


    在处理如删除文件行尾的回车符等操作时，`chop` 函数非常有用。但随着学习的深入，你还会发现它的其他用途。


    ### 智能切除：chomp()


    `chomp` 与 `chop` 类似，不同在于你对它“切掉”……呃，应该是“吃掉”的内容有一定的控制权。它同样从行（字符串）的末尾提取字符，但这次只提取你告诉它提取的字符。这是通过使用名为“输入记录分隔符”（input
    record separator）的特殊变量来实现的。`输入记录分隔符`表示如下：


    `$/`


    `$/` 将包含你想要从字符串末尾删除的字符，这意味着如果你提供的字符串不包含你想要删除的字符，则返回原始字符串。查看下一页的示例。


    第 124 页


    ```

    $/ = "\n"; $stringvalue = "This is a string \n"; print ($stringvalue);

    ```


    这将返回


    This is a string


    如果你执行以下操作：


    ```

    $/ = "\n"; $stringvalue = "This is a string"; # 注意此字符串中没有 \n print ($stringvalue);

    ```


    那么它仍然返回


    This is a string


    为了说明这一点，请尝试以下程序。


    **1.** 打开你的编辑器。


    ![Image](img/5318ce14783a76c9028382b1a3b088e6.gif)


    | **注意** |

    | :--- |

    | 请注意，`\n` 是 `$/` 的默认值，除非 `$/` 之前包含其他内容，否则你并不真的需要这样做。 |


    第 125 页


    ![Image](img/02fafb94dd2ecb417611e42851fc53e6.gif)


    **8.** 显示结果。


    ```

    print "The string that had NO newline character becomes: $stringvalue"; print
    " and this is a following string\n\n";

    ```


    **9.** 保存程序为 `08-03.pl`。


    **10.** 打开命令行窗口。


    第 126 页


    ![Image](img/697f25498b9ca2db40c4cd88436d59e9.gif)


    如你所见，`chomp()` 比 `chop()` 更灵活一点，它让你省去了在切除之前检查不需要的字符是否在字符串末尾的麻烦。


    让我们来看几个 Perl 函数。


    ### 测量字符串长度：length()


    这是一个简单的函数，允许你测量字符串的长度。


    尝试这个简单的示例。


    **1.** 打开你的编辑器。


    ![Image](img/a2a10f1bce6bea30c7866386565d3182.gif)


    第 127 页


