    # Scalar Variables


    Scalar variables are variables that hold a single value. They can be integer,
    string, floating-point numbers (real numbers), or references. A reference scalar
    variable is a variable that simply holds the address of another variable; that
    is, it is a pointer to that variable.


    An integer scalar is simply a variable that holds a whole number:


    ```perl

    $age = 20;

    ```


    Of course, you can do all the things that you can normally do with a numeric variable.
    To demonstrate this and to show how you use simple arithmetic in Perl, try the
    following:


    1. Open your text editor.


    ![Image](content/d4827923e9acabca146a5852cca24bc0.gif)


    | **NOTE** |

    | :--- |

    | Blank lines are optional, but they do help to make the program easier to read.
    Code that follows on line after line looks a bit crowded. Leaving blank lines
    between blocks of code that logically belong as a group is easier on the eye and
    the brain! |


