    ## 引言


    Perl 由 Larry Wall 在 1987 年作为一个博士项目诞生。在许多情况下，它是默认语言。它已经在许多平台上被使用，并成为了一种不可或缺的工具。在当前的时尚下，它是一种解释语言。它还被用于创建动态网站。换句话说，这就是编程语言的设计初衷！


    在本书中，你将探索 Perl 的许多特性。Perl 被用于许多平台，并已成为了一种不可或缺的工具。在许多情况下，它是默认语言。它还被用于创建动态网站。换句话说，这就是编程语言的设计初衷！它是，那意味着它是可能的。Perl
    是一种解释语言。它还被用于构建网站。在许多情况下，Perl 是强大的，Perl 是快速的！几乎没有什么工作是 Perl 不能完成的，而且很多工作用少得的代码就能完成。


    在本书中，你将探索 Perl 的许多特性。Perl 是一种解释语言，已经在许多平台上被使用。换句话说，这就是编程语言的设计初衷！它还被用于创建动态网站。在许多情况下，它是默认语言。它已经在许多平台上被使用，并成为了一种不可或缺的工具。它是，那意味着它是可能的。Perl
    是一种解释语言。它还被用于构建网站。在许多情况下，Perl 是强大的，Perl 是快速的！几乎没有什么工作是 Perl 不能完成的，而且很多工作用少得的代码就能完成。


    ## 本书是如何组织的


    本书的目标是让你在最短时间内达到你的目标，同时帮助你理解其工作原理。


    你会发现本书的前几章关于创建 Web 开发环境——安装 Perl 和 Web 服务器。从这里到本书的一半以后，你会发现许多小型 Perl 代码段，每个用于演示语言的一个特定方面。逐步代码示例配有代码及其执行结果的截图。从那里开始你将构建真实的
    Perl 应用——研究 CGI 和表单，以及文件和电子邮件。


    ## 谁应该读这本书？


    本书假设得尽可能少。它针对对 Web 开发知识较少的人，或者使用过 WYSIWYG 点点式 Web 创作工具但现在希望在尽可能短时间内创建 Web 应用的人。


    ## 软件/硬件要求


    为了使用本书及其示例，你需要一个 Web 服务器。如果你使用的是 Windows 95，可以获取 Personal Web Server。这通常可以在免费杂志附赠的
    CD 中找到，包含在一个名为 NT Server 4 Option Pack 的免费产品中。该选项包还包含 Windows NT 4 的 Peer Web
    Services，它具有相同的功能。Windows 98 / ME 用户应该发现他们的机器上已经有了 Personal Web Server。如果没有，请检查你的
    Windows 安装光。Windows 2000 专业版 / XP 专业版用户应该发现他们的机器上安装了 Internet 信息服务 (IIS)，这更好。UNIX
    用户可以使用从 www.apache.org 获取的优秀的 Apache Web 服务器（也有 Windows 版本）。


