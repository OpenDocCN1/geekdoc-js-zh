    Apache 可以从 `http://www.apache.org` 下载，而个人版服务器（Personal Web Server）可以作为微软下载选项包（Option
    Pack）的一部分进行下载。安装个人版服务器（适用于 Windows NT 或 Windows 95）简单的方法是使用 NT Server 4 选项包，该包下载时是免费的，或者可以在杂志的“免费光盘”中找到。


    请注意，要通过你的个人版服务器查看页面，必须使用“特殊”IP 地址：`http://127.0.0.1`，或者你可以使用 `http://localhost/`。


    如果你使用的是 Windows 98，你应该很容易就能找到个人版服务器；它已经出现在你的程序列表中：


