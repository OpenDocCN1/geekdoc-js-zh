  trans: "\n打开一个文件进行写入与打开文件进行读取一样简单。你只需要使用 `open` 函数，如下所示。\n\n```perl\nopen(MYFILE,\
    \ '>c:\\\\inetpub\\wwwroot\\filetest\\outfile.dat\")\n```\n\n请注意，这与打开文件进行读取只有一个非常细微的区别——在文件名之前包含了\
    \ `>` 符号。\n\n### 要从 Perl 程序创建一个文件，请执行以下操作。\n\n![Image](img/2315ca870dbd83955a501ae273159806.gif)\n\
    \n| 注意事项 |\n| :--- |\n| 数组中的每一项都以 `\\n` 结尾，且每项都用双引号括起来，这样换行符 `\\n` 被正确解析。 |\n\n\
    ![Image](img/5cd5147158e4f2747e042af607370738.gif)\n\n| 注意 |\n| :--- |\n| 在此示例中，你在\
    \ `open` 函数的文件名的开头使用了 `>` 符号，这将导致写入一个新文件。如果你再次运行该程序，它仍然会执行相同的操作。也就是说，任何之前的文件都将被覆盖。记住这一点对于未来避免丢失重要文件非常重要。\
    \ |\n\n**9.** 现在将你的文件保存为 `12-04.pl`。\n\n**10.** 运行你的程序（http://127.0.0.1/scripts/12-04.pl）。\n\
    \n![Image](img/7cbe913177c75d164dc88c494c843a21.gif)\n\n### 向现有文件添加数据\n\n你也可以向现有文件添加数据。实现此点的代码变化是非常细微的。请记住，你在\
    \ `open` 函数中向文件名开头添加了一个 `>` 符号，以便写入该文件。要打开一个文件以追加数据，你只需要在名称开头放置两个 `>` 符号即可。\n\n\
    尝试一下：\n\n**1.** 重新打开你的写入文件程序（`12-04.pl`）。\n\n![Image](img/908231b86e47526be0ba51ea63935ef0.gif)\n\
    \n**3.** 现在你在文件打开语句的文件名属性开头处有了 `>>`。\n\n**4.** 将你的程序保存为 `12-05.pl`。\n\n**5.**\
    \ 运行你的程序（http://127.0.0.1/scripts/12-04.pl）。\n\n![Image](img/2cd1fcd93bed811e121092f955b1ebd3.gif)\n\
    \n![Image](img/f9abfd276310a8607990accb5ad7f581.gif)\n\n如你所见，与其 `12-03.pl` 那样覆盖文件\
    \ `outfile.dat`，你现在是将程序中的每份文本副本添加到文件的末尾。\n\n### 删除文件\n\n删除文件非常简单。它是通过使用命名奇特的 `unlink`\
    \ 函数实现的。\n\n为了演示 `unlink` 函数，请删除你刚刚创建的输出文件。\n\n![Image](img/89e407d152a2043fb753b3e5145be0a2.gif)\n\
    \n| 注意事项 |\n| :--- |\n| 可以通过逗号分隔文件名来指定多个文件。 |\n| `unlink('c:/inetpub/wwwroot/filetest/outfile.dat,\
    \ c:/inetpub/wwwroot/filetest/anotherfile.dat ') || die \"File(s) could not be\
    \ deleted …\";` |\n| 你也可以将要删除的文件名存储在一个数组中，这样你的删除操作变为： |\n| ```perl\n  @files =\
    \ {\"c:/inetpub/wwwroot/filetest/outfile.dat\", \"c:/inetpub/wwwroot/filetest/anotherfile.dat\"\
    };\n  unlink(@files) || die \"Files could not be deleted …\";\n  ``` |\n\n**5.**\
    \ 将你的程序保存为 `12-06.pl`。\n\n![Image](img/84e42b551944acce1d39299001c2d7bc.gif)\n\
    \n### 在 Perl 中使用目录\n\nPerl 能够创建和删除目录或文件夹。这使其非常强大，因为它可以创建应用程序所需的任何环境或文件和文件夹结构。\n\
    \n#### 创建目录\n\n使用 Perl 创建目录或文件夹非常简单，使用的函数与相应的 DOS 和 UNIX 命令非常相似。用于创建目录的函数是 `mkdir`。\n\
    \n尝试这个简单的程序。\n\n![Image](img/5185edee439eef45057994f3119180e9.gif)\n\n**4.** 将你的程序保存为\
    \ `12-07.pl`。\n\n![Image](img/78cf753c9cdbe1ae7457d2ffd68c9617.gif)\n![Image](img/b56ad726a8fa3c0ed8610f4905.gif)\n\
    \n#### 删除目录\n\n删除目录与创建目录一样简单，正如你所期的那样，它的用法与 `rmdir` 命令相似。\n\n![Image](img/7cbe913177c75d164dc88c494c843a21.gif)\
    \ （此处由于原文内容截断）\n"
- fmt: "\nEven more powerful are databases, but before you learn about how to use\
    \ them in Perl, you will learn about another subject that is very useful in Web\
    \ applications: e-mail.\n\nPage 259\n\n# 13 Sending E-mail in Perl\n\nE-mail is\
    \ a useful addition to the facilities in your Perl Web applications. And it is\
    \ not difficult to send e-mail in Perl. Unfortunately, the methods used to do\
    \ so differ, and it is largely a matter of asking your ISP for information. E-mail\
    \ requires a program called a Mail Transfer Agent (MTA) to send the e-mail to\
    \ an SMTP server. On the UNIX platform, the shell command `sendmail` does this.\
    \ In Windowstype environments there is the SMTP server that comes with Microsoft's\
    \ Internet Information Server (IIS), but there is no MTA in Windows. Instead,\
    \ you can use a package called `SMTP` in Perl to help you send e-mail, or you\
    \ can use a more recent module called `sender.pm`. A program called `Blat.exe`\
    \ can also be used on Windows platforms to send e-mail via SMTP.\n\nIn this chapter\
    \ you will learn:\n\n![Image](content/d938f552af65a53b177029c39d905885.gif) What\
    \ FTP is and how to use it\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ How to use SMTP in Perl to send e-mail\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ How to send e-mail using `Blat.exe`\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ How to send e-mail on a UNIX server using `Sendmail`\n\nPage 260\n\nBecause\
    \ methods of using e-mail vary from ISP to ISP, I will describe each method generally,\
    \ but with real code. Obviously, it is difficult to demonstrate with screenshots\
    \ that e-mail has worked, but I'll describe and show the code as usual. Please\
    \ check with your ISP if you have any problems, or ask your ISP before you start\
    \ if there is anything you need to know about your particular environment. Most\
    \ problems will be minor—you may have to change the path to the `Blat.exe` or\
    \ the `Sendmail` program, for example.\n\nRegardless of the platform that is being\
    \ used, the method of sending e-mail is similar. Certain information is needed\
    \ to send an e-mail, no matter what hardware or software you are using. For example,\
    \ the following data items will always be required:\n\n• Recipient\n• Subject\n\
    • Message body\n• Sender\n\nArmed with this basic information, you can build a\
    \ Perl program to send e-mail.\n\nAs I have said, the basic method of sending\
    \ e-mail on all platforms is similar. The general method is to:\n\n1. Define the\
    \ path to the mail program.\n2. Open the mail connection.\n3. Supply the recipient\
    \ and subject information.\n4. Send the mail body data.\n5. Close the e-mail connection.\n\
    \n### Using FTP\n\nBefore you begin to learn about e-mail in Perl, you need to\
    \ know how to get your files from your machine up to your ISP or hosting company\
    \ Web space because, for this chapter, you need to step outside of your development\
    \ cocoon (Microsoft Personal Web Server if you're using Windows 9x or Peer Web\
    \ Services if you're using Windows NT). You will also need to use Web space that\
    \ has an e-mail service attached to it. You need an SMTP server or some means\
    \ of being able to send e-mail. To get your work onto your ISP Web space, you're\
    \ going to have to learn how to get your files from your machine up to the ISP\
    \ server using FTP (File Transfer Protocol)\n\n### What Is FTP?\n\nFTP is the\
    \ means by which you are able to transfer your files from your computer to another,\
    \ usually a server at your ISP installation where you keep your Web sites and\
    \ Web applications.\n\nIt isn't difficult to learn to use FTP, but it's a good\
    \ idea idea to become familiar with it to remove some of the guesswork and to\
    \ speed you along your way. So, before you start to learn about sending e-mail,\
    \ read this short briefing on how to use FTP. I shall use one example of an FTP\
    \ client; there are many, but they are basically very similar. There are a number\
    \ of FTP clients on the market, and some of them are free for personal use.\n\n\
    | NOTE |\n| For the purposes of this discussion, I will concentrate on WS-FTP\
    \ LE (the LE stands for Light Edition). This is an excellent, free FTP client\
    \ that is easy to use and very effective. |\n\n#### How Do I Use FTP?\n\nFirst\
    \ of all, obtain a copy of WS-FTP from http://www.ipswitch.com. Download a copy\
    \ of the installation file, follow the onsite instructions, and install a copy\
    \ of WS-FTP LE. There are a number of FTP clients out there, so you may want to\
    \ shop around to find a product that suits you once you are comfortable using\
    \ FTP.\n\nAfter you have installed the product, you have to configure it. To do\
    \ so, follow this procedure.\n\nPage 262\n\n![Image](content/90be19eef1c9962c8307ac9c891b3122.gif)\n\
    \n![Image](content/d136068e0c100681102233932222gifgif)\n\n\n\n339322222gif (Wait,\
    \ re-checking source text: content/d136068e1c9962c8307ac9c891b3122.gif)\n\n![Image](content/d136068e1c9962c8307ac9c891b3122.gif)\n\
    \nPage 263\n\n![Image](content/7f6f6f6f61111111111111111111.gif) (Wait, checking\
