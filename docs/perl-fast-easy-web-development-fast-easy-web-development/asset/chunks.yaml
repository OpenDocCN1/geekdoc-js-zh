    ### Arithmetic Operators


    Perl has a familiar list of arithmetic operators Page 52 (Wait, the text says
    Page 55):


    `+` Addition operator

    `-` Subtraction operator

    `*` Multiplication operator

    `/` division operator

    `%` Modulus operator

    `**` Exponent operator


    We have mentioned most of them, but here:


