    ## Where Can I Get Perl?


    Perl is available from a number of sources. The best known are http://www.activestate.com
    and http://www.perl.com.


    I advise you not to download a "development version" of Perl, as doing so may
    cause some confusion if you get any errors. Development versions of software are,
    as their name suggests, not final, fully debugged versions and may include bugs
    that could lead you to think that you had made a mistake in your code. For this
    reason, development versions of Perl are often referred to as "unstable." When
    you are more experienced in the use of Perl you may want to try development versions,
    in order to make use of new facilities provided, but until then it is best to
    stick to the latest "stable" version.


    In addition to downloading Perl, you might want want to look around at some of
    the resources available for Perl developers. Some useful Internet sites are given
    here, and there are more in Appendix B.


    ![Image](content/59cdbf9790a710347720b20579d20ea2.gif)


    These sites will keep you up-to-date with what is happening in the world of Perl
    and will provide you with invaluable resources for techniques, coding ideas, and
    loads of news about the Perl language and those who use it. Perl is a natural
    language for the Internet, so it is equally natural that you will find lots of
    ongoing support for this powerful and much respected language on the World Wide
    Web and in News Groups, email lists, and bulletin boards.


    Page 3


    ## How Do I Install Perl?


    Before you can use Perl, you need to install it and set up the Web server with
    which you are going to use it. You will learn how to set up the Web server shortly,
    but for now, here is the information you need to get started with Perl. Perl can
    be used at the "command prompt" the way you may have run DOS programs in the old
    days! Perl began life as a system administration and reporting tool, so it works
    equally well in this way.


    ### Windows Installation


    1. Download Perl from www.activestate.com or www.perl.com.


    2. When the download is complete, double-click the file to begin installation.


    3. Follow the on-screen prompts to install Perl on your machine. If the installation
    fails, you may need to obtain the latest copy of the Microsoft Installer. If you
    are using the Activestate site, you will find a link to the latest MS installer
    there under the Downloads link.


    The installation process should update the windows path so that the Perl executable
    can be found. Open an MS-DOS "prompt" command window to run Perl and verify its
    version.


