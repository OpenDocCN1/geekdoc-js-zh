    ### 图片


    除了文本，Web 页面还可以包含图片、声音、视频以及几乎你想要的任何内容。现在，你可以了解更多关于图片以及在 Web 页面中使用它们的知识。Web 浏览器通常支持两种图像格式：`JPEG`
    和 `GIF` 图片。


    #### JPEG 文件


    JPEG 文件在颜色丰富的地方（如照片）效果非常好，因为它们可以实现高程度的压缩，从而减文件大小并缩短下载时间。


    #### GIF 文件


    `GIF` 格式由 ISP CompuServe 开发，已成为一种流行的图像标准。`GIF` 格式在颜色丰富的地方（如照片）效果非常好，因为它们可以实现高程度的压缩，从而减少文件大小并缩短下载时间。`GIF`
    格式由 ISP CompuServe 开发，已成为一种流行的图像标准。`GIF` 格式由 ISP CompuServe 开发，已成为一种流行的图像标准。`GIF`
    格式通过限制颜色数量来表现更好。有一种新格式 `PNG` 似乎在未来会兴起，`GIF` 之于 Web 页面。


