    \ simply returns the value of the field named in the param() function parentheses.\
    \ So\n\nmyfield = param('surname');\n\nreturns the value that had been typed into\
    \ a field called Surname on the sending form. Now that's useful!\n\nTry this:\n\
    \n**1.** Re-open your last program in your editor.\n\nPage 353\n\n![Image](content/6976470ab72380f9ce5f85d517194ba0.gif)\n\
    \n**3.** The if statement checks to see if there are any values in the fields\
    \ and displays them if there are. Which is what I mean by saying the page *calls\
    \ itself* and remembers its state between executions.\n\n**4.** Save the program\
    \ as 16-04.pl.\n\nPage 354\n\n![Image](content/817ab9708280fa0176a372be6781da47.gif)\n\
    \n![Image](content/59f51d18c7317a22a483a594e3c04659.gif)\n\nForm manipulation\
    \ is a very useful area in which to use CGI.pm. In my opinion, the most useful\
    \ of all! However, there is one other aspect that will interest you—the object-oriented\
    \ mode of CGI.pm.\n\n### **CGI.pm in Object-Oriented Mode**\n\nBefore we leave\
    \ the subject of CGI.pm, there is a little more you should know about it. You\
    \ have so far used CGI.pm in what is known as *function-oriented* mode. CGI.pm\
    \ can also be used in an *object-oriented* way.\n\nPage 355\n\nThis has a few\
    \ advantages:\n\n• If you treat CGI as a class, you can have more than one CGI\
    \ object.\n\n• You can inherit from a CGI class and modify the resulting object's\
    \ behavior to suit your requirements.\n\n• Using CGI.pm in object-oriented mode\
    \ uses less memory.\n\n• You can use parameters of tags generated by name, so\
    \ you don't have to learn the positional location of a parameter; you just name\
    \ it and assign a value in any order you like.\n\n• You can save a CGI object\
    \ to disk and reload it.\n\nHowever, the object-oriented mode is also more verbose,\
    \ so it means more typing.\n\nJust for fun, let's do a program similar to the\
    \ last program (16-04.pl) in object-oriented mode and you'll see what I mean.\n\
    \n**1.** Start a new program in your editor.\n\n#!c:/perl/bin\n\n![Image](content/6ba55fe14b589ef9c54429b680915e0e.gif)\n\
    \nPage 356\n\n![Image](content/fd0a98a27364e9ed4294341a6a52dd99.gif)\n\nPage 357\n\
    \n![Image](content/6b4de4b30de776a5ef5bfca8ad3b271a.gif)\n\n**16.** Save your\
    \ program as 16-05.pl.\n\nPage 358\n\n![Image](content/968a710cfceabd3d458e22e28c97358d.gif)\n\
    \n![Image](content/3e888af956d0d3834f7e90738c95f4e3.gif)\n\nPage 359\n\n![Image](content/f9476d9be12da19f82a684bfbd47e1ec.gif)\n\
    \nThe significant thing about the object-oriented way of using CGI.pm is that\
    \ you can have lots of independent CGI objects and handle them all separately\
    \ (q2, q3 and so on). In fact, Perl itself now has an object-oriented mode, which\
    \ is unfortunately beyond the scope of this book. But should you wish to learn\
    \ more about it, there is lots of information at the Web sites listed in Appendix\
    \ B in the back of this book.\n\nPage 360\n\n*This page intentionally left blank.*\n\
    \nPage 361\n\n## **17\n\nCase Study: A Contact Database**\n\nIn this chapter you\
    \ are going to see how all of the things you have learned so far can be brought\
    \ together to demonstrate a complete Perl database-driven application. This application\
    \ is a simple contacts database. You can, of course, modify it to do any number\
    \ of different jobs including the ubiquitous Guest book. I think you will find\
    \ many useful things to do with the techniques used in this application.\n\nIn\
    \ this chapter you will:\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ Create a home page\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ Use the listcontacts.pl program to read and list the contents of a database\
    \ table\n\n![Image](content/d938f552af65a53b177029c39d905885.gif) Use the editcontact.pl\
    \ program to insert data in the database\n\n![Image](content/d938f552af65a53b177029c39d905885.gif)\
    \ Use the editcontact.pl program to load data into fields\n\nPage 362\n\n### **The\
    \ Requirements**"
