- fmt: "\n# What are the requirements for a contacts database application?\n\nVery\
    \ simply, you need to be able to:\n\n• Add a new contact\n• Update an existing\
    \ contact\n• Delete a contact\n• List contacts\n\nYes, there are variations and\
    \ refinements that can be applied, but basically this is the core requirement\
    \ of any database application. Everything else is a tweak (although some of the\
    \ tweaks are very useful). I will mention some tweaks that you might like to try\
    \ at the end of this chapter.\n\nYou know what you want to do with the database,\
    \ so what data items might you be interested in? Here is a set to begin with:\n\
    \n• First name\n• Middle initial\n• Last name\n• Address (number, street, and\
    \ so on)\n• Town/City\n• Post code/ZIP code\n• Telephone number\n• E-mail address\n\
    \nThis forms the basis of a useful set of information. There are other bits of\
    \ information you might want to store, and you can go back and add any extra bits\
    \ you would like. Or, of course, you can change all the data and use the application\
    \ for something else entirely.\n\nNow you know what we are going to do and what\
    \ we are going to do it with. It's time to visualize what the application should\
    \ look like, and how it should behave. When I say \"look like,\" I don't mean\
    \ aesthetically—that isn't important, and it is something you can tinker with\
    \ when you're happy with your application. What I mean is how it is going to work.\n\
    \nA good place to start is to imagine you are the user of the new application.\
    \ What would you expect to see when the application started? How do you see new\
    \ records being added and how should this work? How would you navigate around\
    \ the system? In short, how can you best make your application friendlier and\
    \ less cumbersome?\n\nA good starting point is draw out your ideas on paper and\
    \ plan out what your application is to consist of and how it should hang together,\
    \ paying attention to navigation and to a logical sequence of events.\n\n![Image](content/ff7dab7912fd1c7fb393d4bf57f57b5a.gif)\n\
    \nHere is the approach I took for this simple application. I think this simple\
    \ design is fairly self-explanatory. I have named the files to give you an idea\
    \ of what they should be doing. The solid lines are links to the different parts\
    \ of the application. The dotted lines are possible links that you might want\
    \ to have to ease navigation.\n\nNow you can start putting together your application.\n\
    \n## The Home Page\n\nA good place to start is with the `home.htm` page, which\
    \ is a simple HTML page to act as the home page and the menu for your application.\n\
    \nThe top-level page (`home.htm`) is nothing exciting. It is as simple an HTML\
    \ page as you can get with a couple of links to the List Contacts program and\
    \ the Add a New Contact Page.\n\n**1.** Open your editor and start a new HTML\
    \ page.\n\n```html\n<html> <head>\n```\n\n![Image](content/e8fd965b29abfc9be90592d8179589be.gif)\n\
    \n![Image](content/ef7796c3c795e4dfb36090c0714acf35.gif)\n\n**8.** Save your page\
    \ as `home.htm` in a suitable folder called, say, `Contacts`.\n\n**9.** If you\
    \ wish, open your browser and view your `home.htm` page.\n\nOkay, so you have\
    \ made a start on your contacts database application. You will also want a Perl\
    \ script to display the contacts from your database as a list. Let's do that next.\n\
    \n## The listcontacts.pl Program\n\nThe `listcontacts.pl` program simply reads\
    \ the contents of the database table and lists the first name, last name, and\
    \ town fields for each record. (A view of the database design is at the end of\
    \ this chapter). In this program, ADO is being used to connect with the Access\
    \ database. There should be no surprises here, but if something doesn't make sense\
    \ to you, refer to Chapter 14, \"Databases.\"\n\n**1.** Open your editor and start\
    \ a new Perl program.\n\n```perl\n#!c:/perl/bin\n```\n\n![Image](content/b7a0362508eceee3461c5e17cf59e656.gif)\n\
    \n![Image](content/f33738f91d09e9e0784996f44815f83b.gif)\n\n| **NOTE** |\n| :---\
    \ |\n| Note that you are using the `SELECT * FROM $table` type of SQL statement,\
    \ meaning get all of the columns. This is fine for a small program like this,\
    \ but you are actually bringing back columns that you do not need and therefore\
    \ the database and the network are doing unnecessary work. It keeps things simple\
    \ for this example, but a better SQL statement would be: `$sql = 'SELECT id, firstname,\
    \ lastname, town FROM $table';` |\n\n![Image](content/afc177cd2dee2d70c6cde598ac3dc095.gif)\n\
    \n![Image](content/efc70583ba21a5f415da0acac9328aee.gif)\n\n**8.** Just to tidy\
    \ things up, close the `<body>` and `<html>` tags.\n\n```html\n</body> </html>\n\
    ```\n\n**9.** Save your program as `listcontacts.pl`.\n\nThat completes the `listcontacts.pl`\
    \ program. Of course, you cannot run it yet, as you do not have a database to\
    \ run it against! Next you are going to create the HTML form to add data to the\
    \ database and a Perl script to actually insert the data.\n\n## addcontact.htm\n\
    \nThis is a simple HTML form that sends data to the `insertrec.pl` program. You\
    \ are also going to check, using JavaScript, if the user has entered the data.\n\
    \n![Image](content/d52879be9125d6a04458bd.gif)\n\n```html\n<script>\nfunction\
    \ checkfields() {\n  var okeyey = 1;\n  if (document.firstname.value == \"\")\
    \ {\n    alert(\"You have not entered the First Name\");\n    okeyey = 0;\n  }\n\
    \  if (document.lastname.value == \"\") {\n    alert(\"You have not entered the\
    \ Last Name\");\n    okeyey = 0;\n  }\n  if (document.street.value == \"\") {\n\
    \    alert(\"You have not entered the Street\");\n    okeyey = 0;\n  }\n  if (document.town.value\
    \ == \"\") {\n    alert(\"You have not entered the Town\");\n    okeyey = 0;\n\
    \  }\n  if (document.postcode.value == \"\") {\n    alert(\"You have not entered\
    \ the Zip / Post Code\");\n    okeyey = 0;\n  }\n  if (document.phone.value ==\
    \ \"\") {\n    alert(\"You have not entered the Phone No.\");\n    okeyey = 0;\n\
    \  }\n  if (document.email.value == \"\") {\n    alert(\"You have not entered\
    \ the e-mail address\");\n    okeyey = 0;\n  }\n  if (okeyey) {\n    document.addrec.submit();\n\
    \  }\n}\n</script>\n```\n\n| **NOTE** |\n| :--- |\n| Note the last part of the\
    \ function. It uses the `if(true)` check on `okeyey` to decide whether or not\
    \ submit the form. If there are errors and `okeyey` is False, the submit method\
    \ will not be executed and the form will sit there for the user to correct the\
    \ errors. Each time the errors are corrected, the `checkfields()` function will\
    \ be executed again. If all is well, the form will be submitted and your data\
    \ will be sent to the Perl program that will insert the data into the database.\
    \ |\n\n![Image](content/e45f9b093c40934404d05ae3458beb7.gif)\n\n![Image](content/28b13b95801359bb239d5cb61e95be4.gif)\n\
    \n![Image](content/49772bf3827d9000910820d864cc643e.gif)\n\n**10.** Save your\
    \ HTML page as `addcontact.htm` in, say, a Contacts folder beneath wwwroot.\n\n\
    ## The insertrec.pl Program\n\nYou now have your HTML form and all the data that\
    \ you need to pass to the Perl program that's going to insert the data into the\
    \ database; here it is going to be `insertrec.pl`.\n\n**1.** Open a new Perl program\
    \ in your editor:\n\n```perl\n#!c:/perl/bin\n```\n\n![Image](content/86f309183eee6a76bd680ab61d5f041b.gif)\n\
    \n![Image](content/d8f8a1bc8fca0e5b33e7203f11ad8087.gif)\n\n![Image](content/9225d159b487df6016c2082f98356f0e.gif)\n"
  raw: 'What are the requirements for a contacts database application?


    Very simply, you need to be able to:


    • Add a new contact


    • Update an existing contact


    • Delete a contact


    • List contacts


    Yes, there are variations and refinements that can be applied, but basically this
    is the core requirement of any database application. Everything else is a tweak
    (although some of the tweaks are very useful). I will mention some tweaks that
    you might like to try at the end of this chapter.


    You know what you want to do with the database, so what data items might you be
    interested in? Here is a set to begin with.


    • First name


    • Middle initial


    • Last name


    • Address (number, street, and so on)


    • Town/City


    • Post code/ZIP code


    • Telephone number


    • E-mail address


    This forms the basis of a useful set of information. There are other bits of information
    you might want to store, and you can go back and add any extra bits you would
    like. Or, of course, you can change all the data and use the application for something
    else entirely.


    Now you know what we are going to do and what we are going to do it with. It''s


    Page 363


    time to visualize what the application should look like, and how it should behave.
    When I say ''''look like," I don''t mean aesthetically—that isn''t important,
    and it is something you can tinker with when you''re happy with your application.
    What I mean is how it is going to work.


    A good place to start is to imagine you are the user of the new application. What
    would you expect to see when the application started? How do you see new records
    being added and how should this work? How would you navigate around the system?
    In short, how can you best make your application friendlier and less cumbersome?


    A good starting point is draw out your ideas on paper and plan out what your application
    is to consist of and how it should hang together, paying attention to navigation
    and to a logical sequence of events.


    ![Image](content/ff7dab7912fd1c7fb393d4bf57f57b5a.gif)


    Here is the approach I took for this simple application. I think this simple design
    is fairly self-explanatory. I have named the files to give you an idea of what
    they should be doing. The solid lines are links to the different parts of the
    application. The dotted lines are possible links that you might want to have to
    ease navigation.


    Now you can start putting together your application.


    ### **The Home Page**


    A good place to start is with the home.htm page, which is a simple HTML page to
    act as the home page and the menu for your application.


    Page 364


    The top-level page (home.htm) is nothing exciting. It is as simple an HTML page
    as you can get with a couple of links to the List Contacts program and the Add
    a New Contact Page.


