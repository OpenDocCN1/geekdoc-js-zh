    As you can see, `chomp()` is a bit more flexible than `chop()`, and it saves you
    having to check if the unwanted character is at the end of the string before chopping
    it.


    Let''s look at a few more Perl functions.


    ### Array Functions


    In this section you will learn about some of the functions provided by arrays.


    ### Printing Arrays


    Earlier, you learned how to print an array. In this example, `string2` will contain
    "smith".


    ```

    $string1 = "SMITH"; $string2 = lc($string1);

    ```


    ### Finding the Size of an Array


    In Chapter 5, you saw how to print the size of an array. `scalar()` returns the
    size of an array so that it can be stored in a variable. In this example, `string2`
    will contain "3".


    ```

    $string1 = "SMITH"; $string2 = scalar($string1);

    ```


    To determine the size of an array, you can use the last index operator. Here is
    another way:


    ```

    print $#passengers;

    ```


    This prints 2 as the value returned is a count starting at 0.


    ```python

    $arraysize = @passengers; print $arraysize;

    ```


    which will return a value of 3.


    ### Adding to the End of an Array: push()


    You can add elements to the end of an array by using the `push()` function.


    Sticking with the array in the previous example, you can add another element to
    the end of the array like this:


    ```python

    push(@passengers, "QE2");

    ```


