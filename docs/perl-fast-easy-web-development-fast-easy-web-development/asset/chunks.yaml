    # Loops in Perl


    Perl is fairly rich in its loop facilities. Perl can loop while a condition is
    True. It can loop until a condition is True. Perl can do a loop while or until
    a condition is True or False, performing the loop at least once. Finally, Perl
    can loop a predetermined number of times using the `for` loop. Next you will learn
    how to use each of these loop structures.


    ## The while and until Loops


    The `while` loop runs a loop as long as a given condition is True. If the condition
    specified is not True to begin with, the code within the `while` loop is never
    executed. The `while` loop looks like this:


    ```

    While (condition) { statement …; statement …; }

    ```


    | NOTE |


    | Note that again you will often see the opening brace on the same line as the
    `while (condition)`—it is just another convention. |


    Page 112


    The `until` loop is very similar to the `while` loop. As the names of these loops
    suggest, the `while` loop continues to loop *while* a given condition is satisfied,
    whereas the `until` loop continues to loop *until* a condition arises.


    Here is an example with both types of loops.


    **1.** Start a new program in your editor.


    **2.** Announce what you are going to do (this is optional, of course).


    ```

    print ''''The While Loop:\n";

    ```


