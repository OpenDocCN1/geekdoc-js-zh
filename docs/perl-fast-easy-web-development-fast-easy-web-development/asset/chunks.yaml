    ## 10. CGI Programming


    Remember right back at the beginning, in Chapter 1, when you installed your Web
    server and tested it? Now it is time to start using it.


    In this chapter you will:


    ![Image](content/d938f552af65a53b177029c39905885.gif) Learn what CGI is and what
    you can do with it


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Try your first Perl CGI
    Program


    ![Image](content/d938f552af65a53b177029c39d905885.gif) Use HTML forms


    Page 192


    ### What Is CGI?


    Let''s have a quick overview of what the Web server does. Normally, the Web server
    receives a `request`, as it is known, from the user''s Web browser. That is, the
    user requests a page from a Web site. The Web server receives the request, finds
    the page, and returns it to the browser. The browser renders the page using the
    HTML tags we talked about earlier to format the page on the user''s screen.


    ![Image](content/5040fcbe599d6c3e70b72846fd650452.gif)


    This is fine for HTML pages, but what happens when you want your Web page to use
    a Perl program to update a database? A Web server cannot handle that by itself.
    When such a request arrives at the Web server it is passed to other external software.
    This is achieved through the `Common Gateway Interface`; and this is what CGI
    programming is all about.


    #### CGI Processing


    ![Image](content/8334920a9104bcb2a68cdbf71ce6ee99.gif)


    The CGI box shown can consist of many things. For instance, if you intend to use
    ASP for your Web applications, any requests for an ASP page will be diverted to
    the program `asp.dll`. But of most interest right now is Perl; requests for Perl
    scripts or programs are passed to `perl.exe`. In Chapter 1 you installed Perl
    on your machine, so now you should be all ready to go.


    Page 193


    #### What Can I Do with CGI?


    CGI programming allows you to do almost any Web-based task you could ever want
    to do with a Perl CGI program. There are some rules for using Perl to talk to
    its Web surroundings that you''ll need to learn. There are also some features
    of CGI itself to learn that you will find useful.


    ### A Simple Perl CGI Program


    At last you are going to try a real CGI program. You are going to write a very
    simple Perl program to display the IP address of your machine on a Web page.


    | NOTE |

    | :--- |

    | An IP `address` is the network address of your PC. Every computer connected
    to the Internet has an IP address. An IP address looks like this: `121.236.157.53`.
    That is, four sets of numbers separated by dots (periods). The Internet uses names
    to find Web site addresses, but these names are converted into IP addresses by
    Domain Name Servers (DNS), computers whose job it is to carry out this conversion
    so that computers can find each other. |


    In Chapter 1, you learned about the Web server and how to set up folders for Web
    sites. You also learned about the `cgi-bin`, or scripts folder. You will be putting
    your Perl program in the scripts folder if you are using Microsoft Personal Web
    Server or into the `cgi-bin` folder if you are using a UNIX machine and something
    like Apache Web Server (an excellent choice).


    Of course, if your ISP enables you to run your own Perl scripts, find out from
    them where you should put your scripts and if there are any do''s and don''ts
    for your Web space. You will be using the `127.0.0.1` address to access your Web
    pages from your Web browser. Remember though, that if you choose to host your
    programs on your ISP Web space, you will use an address like:


    `http://www.mydomain.com/scripts/`


    for the Perl code, and something like:


    `http://www.mydomain.com/`


    for the HTML.


    Of course, if your IP address is static (that is, it doesn''t change—most of them
    do) then you can use that instead of your domain name.


