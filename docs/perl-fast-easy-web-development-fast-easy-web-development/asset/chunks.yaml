    | 注意参数：Default 是表单显示时你希望字段具有任何文本，50 是字段的长度。这等于 `<INPUT TYPE=''TEXT" NAME="surname"
    VALUE="Default" SIZE="50">`。 |


    注意复选框组名称的参数以及每个复选框的值。


    第 350 页


    ![Image](img/f8a8fe4f7ee9dbbe08b90af4196f7094.gif)


    **13.** 将脚本保存为 `16-03.pl`。


