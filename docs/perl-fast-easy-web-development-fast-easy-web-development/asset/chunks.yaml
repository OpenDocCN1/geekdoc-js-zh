  raw: 'The reason for this is that = = is a numeric comparison operator, and so Perl
    will interpret $string1 and $string2 as numeric variables. Because Perl will be
    unable to evaluate them as numbers, they will be set to zero. Therefore, both
    variables are numerically equal and so the test is passed and the string ''''Those
    two names are the same!" is printed.


    For this reason, Perl has a different set of comparison operators for strings.


    • **eq.** Equal to


    • **ne.** Not equal to


    • **it.** Less than


    • **gt.** Greater than


    • **le.** Less than or equal to


    • **ge.** Greater than or equal to


    These operators are used in a similar manner to the numeric ones, but obviously
    only with string variables.


    Here is an identical program, except you will be using the string eq comparison
    operator, and there is an else option to catch the result; otherwise you would
    see no output.


    **1.** Open a new file or copy the previous one.


    Page 76


    ![Image](content/e973c5fe246bd23ca19d71322d7f7cc4.gif)


    **5.** Save your program as 04-13.pl.


    Page 77


    ![Image](content/e9b0056c730e5a1e5d3694224d87ccc5.gif)


    Before we leave operators for now, you will learn a little about logical operators.


    ### **Logical Operators**


    Finally, in your brief examination of operators, comes the logical operator. A
    *logical operator* is used to evaluate whether or not a condition being tested
    is true or false. You will often see True and False capitalized, as here, to emphasize
    that this is a logical, or Boolean, value.


    The term *Boolean* comes from the name of a mathematician, George Boole, who pioneered
    the rules of a logical form of algebra. Computers rely on the logic to work, and
    so you will often come across the terms *True* (often represented by the value
    1, but can be represented by any non-zero value) and *False* (often represented
    by the value zero).


    A numeric True value is any non-zero value and, therefore, numeric zero equates
    to False. So 1, 5, 7, 232, -175, and so on are all True. Only numeric zero is
    False. We can apply True/False checks to strings, too. The word Olympic is True,
    a string containing ''''0" is True, and a single empty space is True. Only the
    absence of any alphanumeric characters at all is False.


    Page 78


    There are basically three logical operators: and, or, and not.


    This means that you can check whether two variables have a value simply by doing
    this:


    if ($num1 and $num2) { print ''''Both of those variables have a non-zero value.\n";
    }


    Or you can say:


    if (not $num1) { print "That variable is empty.\n"; }


    And you can say:


    if ($num1 OR $num2) { print "One of those variables has a non-zero value.\n";
    }


    You can combine conditions such as:


    if ($num1 and $num2 or $num3) { print "Both of the first variables have a non-zero
    value or that last one does!.\n"; }


    The logical operators all work in exactly the same way. As you have discovered,
    the empty string equates to False, and all other values equate to True.


    Page 79


    Finally, there are symbols that can be used instead of and, or, and not.


    || is the same as the or logical operator


    && is the same as the and operator


    ! is the same as the not operator


    The only difference between using these instead of the word operators and, or,
    and not is that the symbol version has a greater precedence. That is, a || will
    be dealt with before an or. Don''t worry about that too much. If you want something
    evaluated before something else, just enclose the one want you want done first
    in parentheses.


    Logical operators seem simple, but misuse can lead to very confusing errors. You
    will use logical operators quite a lot later. Try using the previous examples
    and playing with the code, or just read on and wait for some real examples.


    Page 80


