    ### Check Boxes


    The check box is another useful type of input box. It is similar in principle
    to the radio button, except that it is designed for multiple choices—you have
    no doubt seen the online survey forms wherein you are asked to choose from a list
    all of the items that you like or agree with.


    Even giving the check boxes the same name does not change their behavior. It does
    make them a little more difficult to deal with, so it would make more sense to
    give them their own individual names. You can have a page full of check boxes
    and select as few or as many as you want.


    Also, note that you deselect check boxes by clicking them again.


    ```html

    <INPUT TYPE=''''CHECKBOX" NAME="selection1">

    ```


    Again, if you want to show this field already checked, then add the `checked`
    attribute.


    ```html

    <INPUT TYPE="checkbox" NAME="choice1" checked>

    ```


