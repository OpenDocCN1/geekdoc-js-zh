    ### **A Final Word**


    That brings us to the end of this book. I have not tried to make you an expert
    in Perl, but I hope I have helped you to get up and running writing Web applications
    with the minimum of fuss and complexities. There is much more you will want to
    learn that is beyond the scope of this book; I will have to leave you to research
    this on your own.


    Please feel free to e-mail me with any questions or problems that you may have.
