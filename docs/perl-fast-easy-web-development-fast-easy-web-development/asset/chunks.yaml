    ## 12 在 Perl 中使用文件


    在本章中，你将学习如何在 Perl 中使用文件——如何创建文件、写入文件、读取文件以及删除文件。你还将学习如何在 Perl 中创建和删除目录。


    在本章中，你将学习如何：


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 在 Perl 中打开文件


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 从文件中读取数据


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 关闭文件


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 使用目录


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 删除文件


    第 236 页


    ### 在 Perl 中打开文件


    在对文件进行任何操作之前，你需要打开它。这是通过 Perl 的 `open` 函数完成的。`open` 函数的通用语法为：


    ```perl

    open(MYFILE, "testfile.dat") || die "Error encountered when opening file ...";

    ```


    这意味着 Perl 将尝试打开一个文件句柄为 `MYFILE` 的文件。*文件句柄*（file handle）是一个引用变量，用于存储文件的*内部名称*，即
    Perl 程序识别该文件的名称。


    文件句柄之后是文件的真实名称；在本例中，为 `testfile.dat`。


    注意代码行，该行中的后续内容是*双竖线*（double pipe）。这是 `OR` 运算符，在这里用于在文件打开代码失败时执行其后的任何内容。换句话说，如果由于任何原因
    Perl 无法打开文件，将将执行 `||` 符号后面的代码。


    双竖线 `OR` 运算符后的代码简单来说：


    ```perl

    die "Error encountered when opening file ..."

    ```


    `die` 函数会在显示消息 "Error encountered when opening file .. .." 后停止程序运行。


    一个通用的错误消息本身并没有太大帮助。然而，Perl 还有一个特殊的错误变量，用于存储此类事件的错误消息。这就是 `$!` 变量。你现在可以将此变量添加到
    `die` 错误消息中：


    ```perl

    open(MYFILE, "testfile.dat") || die "Error encountered when opening file . . .
    $!";

    ```


    由于当文件成功打开时你无法看到任何内容，现在尝试示例可能没意义。下一步是读取文件，以便你能够看到 `open` 函数的作用，并看到如何从文件中读取数据。如果你愿意，可以重命名输入文件使程序找不到它，然后尝试
    `die` 函数和错误消息。


    第 237 页


    ### 从文件中读取数据


    在 Perl 中，可以使用角括号运算符 `< >` 从文件中读取数据。要获取一行数据，你只需将文件句柄封装在角括号运算符中即可：


    ```perl

    $dataline = <MYDATA>;

    ```


    这将从 `MYDATA`（`testfile.dat`）获取任何数据并将其存储在 `$dataline` 中。遇到换行符时数据停止。


    当文件句柄返回 `undefined` 时即可识别文件结束。因此，要读取并显示文件的全部内容，你可以这样做：


    ```perl

    while (defined($dataline=<MYFILE>)) { print "$dataline <br>"; }

    ```


    如果你在 `while` 语句中没有其他条件，这可以进一步简化。`while` 语句会在后续括号内的条件为真（True）时执行。文件句柄的 "undefined"
    条件实际上为假。


    因此，你现在可以说：


    ```perl

    while (<MYFILE>) { print; }

    ```


    注意，现在除非你在文件中的数据行末尾有 `<BR>` 标签，否则所有数据将连接在一起。当然，你可以在后面单独放一个打印行来提供 `<br>` 标签。


    ```perl

    while (<MYFILE>) { print; print "<br>"; }

    ```


