  trans: '

    数据库更加强大，但在你学习如何在 Perl 中使用它们之前，你将学习另一个在 Web 应用程序中非常有用的的话题：电子邮件。


    第 259 页


    # 13 在 Perl 中发送电子邮件


    电子邮件是 Perl Web 应用程序功能的一项有用补充。在 Perl 中发送电子邮件并不困难。遗憾的是，实现实现的方法各不相同，这很大程度上取决于向你的互联网服务提供商（ISP）获取信息。电子邮件需要一个名为邮件传输代理（MTA）的程序将邮件发送到
    SMTP 服务器。在 UNIX 平台上，壳命令 `sendmail` 可以完成此操作。在 Windows 类型环境中，有来自微软互联网信息服务器（IIS）自带的
    SMTP 服务器，但 Windows 中没有 MTA。相反，你可以使用 Perl 中一个名为 `SMTP` 的包来帮助发送电子邮件，或者使用一个较新的名为
    `sender.pm` 的模块。在 Windows 平台上，也可以使用名为 `Blat.exe` 的程序通过 SMTP 发送电子邮件。


    在本章中，你将学习：


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 什么是 FTP 以及如何使用它


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 如何在 Perl 中使用 SMTP 发送电子邮件


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 如何使用 `Blat.exe` 发送电子邮件


    ![Image](img/d938f552af65a53b177029c39d905885.gif) 如何在 UNIX 服务器上使用 `Sendmail`
    发送电子邮件


    第 260 页


    由于使用电子邮件的方法因 ISP 而异，我将通俗地描述每种方法，但会带有真实的代码。显然，通过截图证明电子邮件已发送是困难的，但我会像往一样描述并展示代码。如果你有任何问题，请咨询你的
    ISP；或者在开始之前，如果有关于你特定环境需要了解的任何，请询问你的 ISP。大多数问题将是微小的——例如，你可能需要更改 `Blat.exe` 或 `Sendmail`
    程序的路径。


    无论使用什么平台，发送电子邮件的方法都是相似的。无论你使用什么硬件或软件，发送电子邮件都需要某些信息。例如，以下数据项是始终需要的：


    • 收件者

    • 主题

    • 正文

    • 发件者


    有了这些基本信息，你就可以编写一个 Perl 程序来发送电子邮件。


    正如我所说，所有平台发送电子邮件的基本方法是类似的。通用方法是：


    1. 定义邮件程序的路径。

    2. 打开邮件连接。

    3. 提供收件者和主题信息。

    4. 发送邮件主体数据。

    5. 关闭电子邮件连接。


    ### 使用 FTP


    在开始学习 Perl 电子邮件之前，你需要知道如何将文件从你的机器上传到你的 ISP 或托管公司的 Web 空间，因为对于本章来说，你需要走出开发茧茧（如果你使用
    Windows 9x，则是 Microsoft Personal Web Server；如果你使用 Windows NT，则是 Peer Web Services）。你还需要使用带有一个电子邮件服务的
    Web 空间。你需要一个 SMTP 服务器或某种发送电子邮件的方法。要将你的工作放到你的 ISP Web 空间，你必须学习如何使用 FTP（文件传输协议）将文件从你的机器上传到
    ISP 服务器。


    ### 什么是 FTP？


    FTP 是你将文件从一台电脑传输到另一台电脑的方法，通常是你存放 Web 站点和 Web 应用程序的 ISP 安装地的一台服务器。


    学习使用 FTP 并不困难，但熟悉它是一个好主意，可以消除一些猜测并加快你的进度。因此，在开始学习发送电子邮件之前，请阅读这段关于如何使用 FTP 的简要介绍。我将使用一个
    FTP 客户端作为示例；有很多种，但它们基本上非常相似。市场上有许多 FTP 客户端，其中一些对个人用户免费。


    | 注意 |

    | 就此讨论而言，我将集中在 WS-FTP LE 上（LE 代表 Light Edition）。这是一个优秀、免费、易于使用且非常有效的 FTP 客户端。
    |


    #### 我如何使用 FTP？


    首先，从 http://www.ipswitch.com 获取 WS-FTP 副本。下载安装文件的副本，按照现场说明操作并安装 WS-FTP LE。市场上有很多
    FTP 客户端，一旦你熟悉了使用 FTP，你可能想货货找到一个适合你的产品。


    安装产品后，你必须配置它。按照此步骤操作。


    第 262 页


    ![Image](img/90be19eef1c9962c8307ac9c891b3122.gif)


    ![Image](img/d136068e0c100681102233932222.gif)

