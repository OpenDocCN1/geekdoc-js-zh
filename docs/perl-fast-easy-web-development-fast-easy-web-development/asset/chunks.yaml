    system. The & character starts the escape and the semicolon signifies the end
    of the code.


    You can group a number of &nbsp; codes together to move a piece of text further
    along a line, giving another form of simple text formatting. There are much better
    ways, but this method does have its uses.


    Once again, modify your HTML code to add some &nbsp; escape codes.


    **1.** Open the previous HTML page in your editor.


    Page 153


    ![Image](content/57aeeaf74bb34b8a9153cb7e3d28c253.gif)


    ![Image](content/f4aaaca7a123deb29bef6995cd456bd3.gif)


    Three &nbsp; codes have been added and each one gives a single space, so the second
    line of text is moved along by three spaces.


    ### **More Text Formatting**


    Okay, so now you can create a new document, give it a title, display text, force
    line breaks, and put larger gaps comprised of spaces into your HTML document.


    Page 154


    Here are some more simple text formats you can use:


    • **Bold** is achieved using the <B> tag and ends with the </B> tag.


    • *Italics* are achieved using the <I> tag and ends with the </I> tag.


    • Underline is achieved using the <U> tag and ends with the </U> tag.


    You can combine any or all of these tags to combine the effect. So now you can
    make your test1.htm document look a bit more interesting.


    **1.** Modify the previous HTML file.


    ![Image](content/73a6d40cc9c88f6e6174d783bd4071ac.gif)


    | **NOTE** |


    | You still have the <BR> tag at the end of the line to give a line break. On
    the second line of text, add italic and underline effects by using the <I> …</I>
    and <U> …</U> tags respectively: |


    | <I><U>It is just a simple demonstration</U></I> |


    | There are no &nbsp; codes this time. This is just for clarity so that you can
    focus on the subject at hand. If you want to include them to see the effect, please
    do. |


    Page 155


    ![Image](content/b85ba6e03929ff5baab67ec848b58c46.gif)


    It is normal to end tags in the reverse order to the way you started them. If
    you open the italic tag first, you close it last (as you have done above). But
    it is not mandatory to do this, and the browser will forgive you if you get the
    order wrong. However, it is good practice to get the order right, as it makes
    modifying or debugging the page much easier.


    ### **Adding Structure and Color**


    Web Pages were originally about text and then, later, images. Now however, Web
    pages are much more complex, and a wide variety of tags and associated attributes
    can be used to give your pages structure and color. Next, you will learn more
    about some of the most useful tags that add richness to your Web pages.


    #### **HTML Headings**


    What you have so far is all very well, but you still need to be able to add things
    like titles and, if you are to use the main advantage of the Web, you also need
    to be able to use hyperlinks.


    Titles, or in HTML-speak *headings* or *headers*, are easily implemented using
    the <Hx> tags (where x = a number between one and six). <H1> is a start tag for
    the largest header. As usual, an end tag </H1> is placed after the heading text.
    Once again, an example will show the effect.


    In your editor, open a new file and write a new HTML page.


    Page 156


    ![Image](content/7587e5dee95e45f4a4af8e7f517d2704.gif)


    Page 157


    ![Image](content/3a6d5b633f5374a00f840d93714f3a18.gif)


    **8.** Save it as 09-02.htm, or any other name you are happy with.


    ![Image](content/8bcc6f97cc848c7d5073117200e39630.gif)


    | **NOTE** |


    | <H1> tags can also be combined with most other text formatting tags to produce
    desired effects, such as the <B>, <I>, and <U> tags (just don''t forget the end
    tags—</B>, </I> and <U>). |


    There are other tags that might also be combined, and more of these will be covered
    later.


    Page 158


    #### **Text Positioning**


    Now you can create headings for passages of text in your Web pages, but note that
    in the previous example, the titles are all left-justified, that is, they are
    lined up with the left hand edge of the page. Sometimes, you might want to have
    a title or heading that is centered on the page.'
