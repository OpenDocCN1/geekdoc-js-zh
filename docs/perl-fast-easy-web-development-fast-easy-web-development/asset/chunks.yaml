    starting with a `#` is regarded by Perl as a comment and is therefore ignored
    by the interpreter. An exception to this is the first line of a Perl program,
    as described earlier. this first statement tells the UNIX operating system where
    to find the Perl interpreter. As long as the program file is made an executable
    file (by setting `chmod` to `755`), then just typing its name will cause it to
    run. You can of course still use the `-w` flag on the command line in NT. |


    On the NT platform, this first line will be treated as a comment. However, NT
    uses ''''association" between a program and the file extension of its file name.
    In other words, when Windows NT (and Windows 9x, and so on) sees a `.pl` extension,
    it will automatically invoke the Perl interpreter.


    ### **Getting Things In and Out of Perl Programs**


    We have already seen that we can display things on the screen by using the Perl
    `print` command:


    ![Image](content/e1d11719c13e1653ddef2f88f5249731.gif)


    (Note the semicolon at the end of the statement.)


