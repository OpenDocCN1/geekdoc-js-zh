    ## String Operators


    String operators provide you with some useful methods of manipulating strings;
    with these operators you can join strings together (known as *concatenation*)
    or extract "substrings" from other strings. You will learn about some different
    string operators in the next sections.


    ### The Concatenation Operator


    You can join strings together in Perl using the "dot" (concatenation) operator.
