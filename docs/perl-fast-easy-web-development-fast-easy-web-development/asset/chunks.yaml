    Apache can be downloaded from `http://www.apache.org`, and Personal Web Server
    can be downloaded as part of a download Option Pack from Microsoft. The easiest
    way to install Personal Web Server (for Windows NT or for Windows 95) is to use
    the NT Server 4 Option Pack, which is free when downloaded, or is occasionally
    available from magazine "freebie disks."


    Note that to view pages through your Personal Web Server, you must use a "special"
    IP address: `http://127.0.0.1`, or you can use `http://localhost/`.


    If you have Windows 98, you should find Personal Web Server easily; it is already
    available in your program list:


    ![Image](content/4887cf914aebfdb7e9faab249735ec8c.gif)


    Page 13


    ![Image](content/226685b7bbac5eeb39c4dde0919e9e3a.gif)


    | **NOTE** |

    | It is not a good idea to have the Web server running when you are connected
    to the Internet, as it provides a nice gateway for hackers! Make sure that PWS
    is not in your Startup list, and if it is loaded (you will see an icon in the
    Taskbar tray), make sure that the server is stopped by using the Stop/Start toggle
    button when you are on the Internet. |


    When your Web server is running, you will see that the Stop button is showing—that
    is, the server is started. Conversely, when the Web server is stopped, the Start
    button is visible where the Stop button was. (It sounds confusing, I know, but
    you will see what I mean as you use it!)


    Page 14


    The five buttons down the left side are:


    ![Image](content/ae6ae057ad40975edde086216f79af7c.gif)


    ### **PWS Advanced Options**


    ![Image](content/09fb331a629cd1c6ec0d950645e16206.gif)


    Page 15


    PWS (and all other servers) allows you to store files other than HTML files in
    locations outside of the Web server root structure, but allows you to connect
    the Web server to them by using the Web server alias feature (sometimes referred
    to as a virtual directory or folder).


    Notice also that you get, as a default, a `SCRIPTS` folder; this is similar to
    the usual `CGI-BIN` folder found on most normal Web servers. You will almost certainly
    find one on your ISP upload (FTP) directory list.


    ![Image](content/f0f760f3a3720a643e9f00886dfaf022.gif)


    The `Add` button leads you though a wizard to set up a new folder. Let''s assume
    you want to add a new site to your Web server—a site we can refer to as a collection
    of Web files (HTML and so on) that has a home page at its root and probably a
    set of other supporting pages, images, and so on.


    To illustrate the point, you will now set up a new folder called `Test` on your
    Web server.


    Page 16


    1. Create a folder called `Test` under the `C:\inetpub\wwwroot` folder.


    | **NOTE** |

    | You can also create a new folder through the My Computer interface using `File`,
    `New`, `Options`, or through the Windows Explorer interface. |


    ![Image](content/72ea46f0ba29957f9f9abf72294b77eb.gif)


    3. Save the file as `default.htm` in your new test folder.


    Page 17


    ![Image](content/11db94a9250882a063ffe9381f5730c5.gif)


    ![Image](content/c803947b24a7b04c92ce048b25c62ec7.gif)


    Page 18


    | **CAUTION** |

    | Note the Access check boxes below the main window. These set the access options
    for your new folder or virtual directory. You will probably find `Read` and `Scripts`
    access already checked. These are the "safe" options that allow scripts and HTML
    pages to be run and read, respectively. The middle option, `Execute`, is to allow
    you to run executable programs within your folder. This is potentially dangerous
    if the folder also has "write" access set up in the Operating System permissions.
    Also, many commercial Web servers have a "write access" feature in the web server,
    and UNIX allows you to set permissions through the use of the `CHMOD` command.
    Whichever platform you have, always bear in mind that it is dangerous to have
    a folder that has both execute and write access. This allows a hacker to potentially
    install his own program into your folder and then to execute it and to write to
    your disk – with possibly disastrous results! |


    ![Image](content/1841f70e40480678cdf58d2124404f3a.gif)


    Page 19


    ![Image](content/2bd20662d88ab168f10765e4940d3092.gif)


    If you are using a different Web server, follow the vendor''s instructions to
    get to a similar point with your chosen server.


    You should now have a working Web server and a working copy of Perl, and we can
    now start to discuss the basics of Perl.


    Page 20


    *This page intentionally blank.*


    Page 21


    ## **2 Taking Your First Steps with Perl**


    ### **Before You Start**


    It will be useful at this stage to decide which text editor you''d like to use.
    There are many available, from `Notepad` (on Windows) and `Vi` (on UNIX) to more
    sophisticated editors with specific-support functions, and help. A good starter''s
    editor is `HTMLPad 2000`. It is great for HTML, Perl, and quite a few languages,
    and although it doesn''t offer language support, it does "color code" your source
    code, making it easier to read. `HTMLPad 2000` is a nice, easy-to-use editor to
    learn with; later, you can choose an editor that includes the language support
    you want and works in a way that suits you.


    For this chapter, and for the next few, create a new folder anywhere on your hard
    drive. You could create a new folder called `test` (or whatever you prefer to
    call it) inside the top-level `c:\Perl` folder, or create a folder called `myPerl`
    on your hard drive. It doesn''t matter where you put it, really, as long as you
    can find it easily!


    ### **The Basics of Coding in Perl**


    In this chapter, you will begin looking at the structure of Perl, what elements
    make up a Perl program, and how to use them. So you can learn the basic concepts,
    the examples at this stage will be kept as simple as possible. As you proceed
    into later sections, you will be introduced to other useful Perl concepts and
    gradually increase your knowledge. Finally, a full CGI Perl sample program will
    bring together all you have learned, and add new practical elements and concepts
    as you try the example.


    Now it''s time to learn how to put Perl programs together and how to represent
    and manipulate data. You''ll also have a chance to examine some simple mechanisms.


    ### **Perl Syntax**


    You don''t need to learn all parts of Perl syntax in this chapter, but there are
    a few general points you need to understand before you can begin to put together
    a Perl program.


    #### **Statement Formatting**


    Following are a few definitions to help you with statement formatting:


    - A *statement* is the smallest complete unit of code that actually does something.
    It is the computing equivalent of a sentence in English.

    - An *expression* is a value, or an arithmetic, algebraic, or string value.

