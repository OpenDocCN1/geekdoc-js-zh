    ![Image](img/190727d4adc656a59ae078f4ee2703f5.gif)


    `length()` 函数是一个非常简单但非常有用的 Perl 字符串函数，在许多不同的应用程序中有许多用途。你会惊讶于自己使用它有多频繁。


    ### 获取子字符串：substr()


    `substr` 函数允许你提取字符串的一部分。Perl 需要这个函数，因为与 C 不同，Perl 字符串标量不是字符数组，因此你不能像下一页示例中那样通过类似的方法单独访问字符。


    第 128 页


    ```

    $stringvalue = "Perl is a great language"; $char = $stringvalue[5]; # 这不起作用！！

    ```


    `substr` 函数允许你像这样从字符串标量中提取一个或多个字符：


    **1.** 打开你的编辑器。


    ![Image](img/a0c0237ddeaddb01ef1f9c7ca2599717.gif)


    **5.** 保存程序为 `08-05.pl`。


    **6.** 打开命令行窗口。


    第 129 页


    ![Image](img/988ebbbd04dbf90bdb39e1e9a48eb175.gif)


    因此，`substr` 函数接受三个参数：正在处理的字符串、你想要提取的子字符串的起始字符位置，以及要提取的长度（字符数）。


    | **注意** |

    | :--- |

    | 字符串的起始位置从零开始，也就是说在上面的示例中，`$anotherstring = substr($stringvalue, 1, 3);` 将返回
    `erl` |


    `Substr` 是一个非常有用的函数，你无疑会经常使用它。很多情况下，你可能想要从电子邮件地址中提取域名，或者从页面中提取内容。


    ### 改变大小写：lc(), uc(), lc()


    你在第 4 章学过这些函数，但我们将在这里详细检查它们。`lc()` 函数简单地将任何字符转换为小写。在这个示例中，`string2` 将包含 "smith"。


    第 130 页


    ```

    $stringvalue = "SMITH"; $string2 = lc($stringvalue);

    ```


    `uc()` 是它的相反。在这个示例中，`string2` 将包含 "SMITH"。


    ```

    $stringvalue = "smith"; $string2 = uc($stringvalue);

    ```


    `ucfirst()` 函数将首字母转换为大写。在这个示例中，`string2` 将包含 "Smith"。


    ```

    $stringvalue = "smith"; $string2 = ucfirst($stringvalue);

    ```


