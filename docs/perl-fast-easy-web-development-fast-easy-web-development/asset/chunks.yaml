    许多基于 Windows 的 ISP（互联网服务提供商）通过一个名为 `Blat.exe` 的免费程序发送电子邮件。该程序最初实际上是作为一个命令行电子邮件程序开发的，它从文件中发送电子邮件文本。事实上，当在
    Web 上使用该程序时，它仍然使用文件，并且仍然将 `Blat.exe` 作为一种命令行程序（某种程度上）。你使用的是系统的 Perl 命令，该命令的设计旨在允许你在
    Perl 程序中运行任何可执行程序。


    因此，在正常情况下，你需要做的是从 HTML 表单中收集你将发送的地址信息和数据（文本）。然后将文本数据保存到文件中。接着，调用 `Blat.exe` 程序，并将你的数据和消息文本文件作为参数传递。`Parameters`（参数）只是程序完成工作所需或告诉程序如何行为的单个数据项。在这种情况下，它们是诸如收件人地址、发件地址以及包含消息的文本文件名等的数据项。


    尝试以下程序（如果你的 ISP 或托管公司提供 `Blat.exe` 功能）。


    **1.** 在你的编辑器中启动一个新程序。


    ```

    #!c:\perl\bin

    ```


    ![Image](img/d5d6fd02ff3f5619c4721bf240f65c78.gif)


    | **NOTE** |

    | 注意 `\` 字符；这允许你转义特殊字符，例如 `@` 字符，否则 Perl 会将其解释为数组指示符。 | 为了测试，你可能想在 `$recipient`
    变量中填入自己的地址。 |


    ![Image](img/66b8f2dad452fea85a4b9db8b6dff4a5.gif)


    ![Image](img/c171be3afff32435a7169c68397ff2c4.gif)


    ![Image](img/23b1de7462cd4e0d884dea86f8573102.gif)


    注意 `if` 语句的不同用法。它仅意味着：如果正在检查的变量有内容，则执行语句的第一部分。


    ![Image](img/a94f7dabbacfd63a8295ebe1aced010b.gif)


    ![Image](img/730ac2621890b0053aac4fbd010211f3.gif)


    **17.** 现在将你的程序保存为 `13-02.pl`。


    **18.** 将程序上传到你的 Web 空间。


    **19.** 创建一个包含消息的文本文件，并将其保存到 `$message` 变量所在的位置。


    **20.** 将消息文件上传到该位置。


    **21.** 打开 Web 浏览器并输入 URL（脚本文件夹的位置将由你的 ISP 或托管公司决定）来运行脚本。


    如果一切顺利，你很快就会收到一封电子邮件。如果没有收到，请再次检查你的脚本。如果你看不出有任何问题，请咨询你的 ISP 或托管公司，并向他们索要在其系统中使用
    `Blat.exe` 的示例（ISP 通常有你可以使用的示例脚本，在这种情况下，你可以省去大量工作）。


    Blat 程序并不复杂，但必须创建文件的额外步骤很麻烦。不过它是有用的，而且这可能就是你的 ISP 或托管公司提供的全部功能，所以它是一个值得学习的程序。


    你也可以使用 Perl 根据用户在表单提供的数据创建文件。因此，你可以从表单获取数据（你现在已经知道怎么做了），将文本数据写入文件（你也可以这样做），然后让
    `blat.exe` 如前所示所示运行。


    这里给出的程序是发送电子邮件的 Perl 程序的典型示例，但在目录等方面有许多可能的变，因此请咨询你的托管服务商。你可能会发现你的 ISP 会为你提供一个可以运行的示例，插入到你的应用程序中。


    ### 在 UNIX 服务器上使用 Sendmail 发送邮件


    多年来，UNIX 社区一直有一个 `Sendmail` 的邮件程序。它非常简单用，但在你开始之前，请咨询你的托管公司或 ISP，了解从他们的服务器使用 `sendmail`
    的任何本地差异或提示。


    在与托管公司交流后，尝试此示例，并根据公司针对特定安装指示进行任何修改（再次，公司可能会为你提供一个预先写的示例，为你节省调试时间）。


    以下是一个使用 Perl 使用 `Sendmail` 的简单示例。


    **1.** 打开你的编辑器并启动一个新程序。


    ```

    #!/usr/bin/perl

    ```


    | **NOTE** |

    | 注意 UNIX 的 shebang 语句——路径不同，这在 UNIX 中很重要，因为 shebang 语句不仅仅是注释，它是操作系统用于查找 Perl
    的。 |


    ![Image](img/5399ff07f103cc71691ebcf9f4d3872b.gif)


    | **NOTE** |

    | 为了测试，你可能想在 `$to` 变量中填入自己的地址。 |


    ![Image](img/46d63af0ea41883a4b9db8b6d)


    **9.** 将你的程序保存为 `13-03.pl`。


    | **NOTE** |

    | 注意 `$sendmail` 变量前的 `|` 符号。这允许 `sendmail` 从 `STDIN` 获取输入。 | `sendmail` 允许 `To`、`CC`
    和 `BCC` 字段。 |


    **10.** 现在将你的程序上传到 Web 空间。


    **11.** 打开浏览器并运行脚本。如果一切顺利，你很快就会收到一封电子邮件。如果没有收到，请再次检查你的脚本。如果你看不出有任何问题，请咨询你的 ISP
    或托管公司，并向他们索要在其系统中使用 `Blat.exe` 的示例（ISP 通常有你可以使用的示例脚本，在这种情况下，你可以省去大量工作）。Blat 程序并不复杂，但必须创建文件的额外步骤很麻烦。不过它是有用的，而且这可能就是你的
    ISP 或托管公司提供的全部功能，所以它是一个值得学习的程序。它在 Windows 平台上也日益可用。关注 Web 并寻找适合你的工具。你会庆幸这么做的。


    ## 14 使用 Perl 使用数据库


    你已经学习了如何使用 Perl 收集数据。你知道如何在文件中存储数据以及如何检索它。你知道如何使用 Perl 响应访问网站的人。现在你将使用 Perl 以更强大的方式存储数据，即使用关系型数据库。本质上，*数据库*
    是任何相关数据的存储。例如，文件柜就是一个数据库。但通常情况下，我们真正指的是电子数据库。


    在本章中，你将学习如何：


    ![Image](img/d938f552af65a53b177029c390585.gif) 为你的网站添加 MS Access 数据库


    ![Image](img/d938f552af65a53b177029c390585.gif) 使用 ADO 从数据库中读取、添加和删除记录


    ![Image](img/d938f552af65a53b177029c390585.gif) 使用 DBI 从数据库中读取、添加和删除记录


    ### Access 97 和关系型数据库


    Access 97 是一个数据库软件包，包含了足够的代码以允许用户使用表单、SQL 等创建独立的应用程序。然而，在本章中，你只对使用数据库引擎感兴趣。有许多相同甚至更好的数据库系统，例如
    MySQL、PostgreSQL 和 SQL Server，但 Microsoft Access 被广泛使用且许多用户可用，因此我在本章的示例中使用它。


    | **NOTE** |

    | 你也可以使用 Access 2000 进行本章的练习。 |


    Access 97 是一个关系型数据库系统。关系型数据库允许定义或描述数据结构。数据组织成表格。“表格*是相同组织记录的集合，表中的每条记录（行）都包含相同的*字段*，形成该字段的列。一个或多个字段可以指定为*键*，从而加速对特定值的搜索。


