    提醒你一下，`<!--` 和 `-->` 标签通常用于包裹 HTML 注释（设计为人类提供信息但会被浏览器忽略的文本），因此它们内部的任何内容都会被忽略。现代浏览器可以识别它们内部包含脚本，因此会执行它。旧版浏览器（不理解
    JavaScript 的浏览器）会忽略 JavaScript 代码；这可以防止出现必要的错误消息。当然，JavaScript 代码在旧版浏览器上也无法运行。HTML
    注释的开头需要一个小于符号（`<`），后跟至少两个横线，如下：


    ```html

    <!--

    ```


    它应该以至少两个横线后跟一个大于符号（`>`）结束，如下：


    ```html

    -->

    ```


    注意，在指定 JavaScript 关键字时大小写是非常重要的——`function` 是关键字，而 `Function` 不是。


    ## JavaScript 变量


    与所有其他语言一样，JavaScript 使用变量来存储信息。你可以在需要时随时创建变量，但最好在脚本开头创建它们，这样更容易追踪，而且你也就知道去哪里寻找它们。要创建一个变量，你使用
    `var` 关键字。


    ```javascript

    var age; var name;

    ```


    以此类推。要给变量赋值，你使用赋值运算符 `=`。


    ```javascript

    age = 17; name = ''fred'';

    ```


    大多数 JavaScript 语句以分号结尾。JavaScript 像大多数现代语言一样，是自由格式的，也就是说，如果需要，它可以被分成多行，通常是为了提高可读性。它使用分号来表示语句的结束，这种符号形式是从
    C++ 和 Java（以及当然还有 Perl）语言中借来的。


    你可能想用 JavaScript 做的其他事情包括：


    * 数字相加

    * 减法

    * 乘法

    * 除法


    你可以像这样将几个变量的值相加：


    ```javascript

    firstNumber = 13; secondNumber = 23; ressultOne = firstNumber + secondNumber;

    ```


    注意，标准约定是变量的第二个字母大写。这使得代码更易读并减少错误。是否遵循这一约定取决于你，但这样做会让其他跟进你代码的人更容易更新你的代码。


    减法、乘法和除法的执行方式与之前的示例类似，分别使用 `-`、`*` 和 `/` 运算符。


    你可能还会很多很多事情；例如，你可能想获取字符字符串的长度。


    ```javascript

    stringVar = ''fred''; sLength = stringVar.length;

    ```


    `length` 后面没有括号，因为这不是一个方法，而是字符串对象 `stringVar` 的属性。


    要测试一个值，你使用相等运算符 `==`（记得你已经用过 `=` 运算符给变量赋值了）。


    所以你会说：


    ```javascript

    if(numVar == 5) {

    ```


    其他运算符有：


    * `>`（大于）

    * `<`（小于）

    * `<=`（小于或等于）


    你还可以用 JavaScript 做几百种其他事情，包括打开新窗口、跳转到不同的 Web 页面、打开对话框等。JavaScript 是一门巨大、复杂且强大的语言。你将随着经验学习更多语言的特性，但现在我们必须果断，坚持那些对你的
    Web 应用有帮助的内容。


    ## 你的第一个表单验证 JavaScript 函数


    你用 JavaScript 能做的最有趣且实用的事情之一是客户端验证。但在继续之前之前，让我们简要回顾一下关于对象的讨论。JavaScript 中的所有内容都被视为对象。一个
    HTML 页面被称为*文档对象*（document object）。正如你不久前学到的，表单是另一个位于文档内部的对象，并有一个你可以通过它引用它的名称。因此，你可以这样引用一个具有
    `NAME=''addrecord''` 属性的表单：


    ```javascript

    document.addrecord

    ```


    注意点符号！这还不是完整的语句，但它的意思是“进入文档中的 `addrecord` 表单”。


    表单中的任何字段都以类似的方式引用。所以，如果你有一个名为 `surname` 的字段，如下：


    ```html

    <INPUT TYPE=TEXT NAME="surname">

    ```


    那么你就可以这样引用它：


    ```javascript

    document.addrecord.surname

    ```


    这让你到达表单对象内部的字段对象，而字段对象在文档对象内部。现在你到达了字段对象。但这个对象有很多属性，例如 `length`、`value` 等。所以，为了访问字段的值，你可以这样引用字段的值：


    ```javascript

    document.addrecord.surname.value

    ```


    现在，你可以查看字段中的内容了。要这样做，使用 JavaScript 的 `if` 语句。如果你想检查字段是否为空，可以这样做：


    ```javascript

    if (document.addrecord.surname.value == "") { ... }

    ```


    在这里使用大括号 `{}` 来限制 `if` 语句的作用范围。使用 `==` 来检查相等性。单个 `=` 用于赋值。其他测试运算符还有：


    * `!=`（不等于）

    * `>`（大于）

    * `<=`（小于或等于）

    * `>=`（大于或等于）


    你可以在 `if` 语句中使用多个条件。这些条件可以使用与运算符 `&&` 和或运算符 `||` 组合。所以，一个 `if` 语句可能像这样：


    ```javascript

    if ((document.formname.department.value == "HR" || document.formname.expenses.value
    != 0) && (document.formname.jobtitle.value == "Manager")) {

    ```


    括号强制条件按照你的意图进行分组，而不是按照 JavaScript 的决定（如果你省略了内部括号）。如果你不确定条件将如何被解释，使用括号来分组。


    ### 使用 JavaScript 提交表单


    你可以在 JavaScript 函数内部将表单提交到服务器端脚本或程序（例如你的 Perl 程序）。可以通过表单对象的 `submit()` 方法来实现，如下：


    ```javascript

    document.addrecord.submit();

    ```


