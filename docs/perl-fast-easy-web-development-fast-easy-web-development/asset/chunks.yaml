- fmt: "\nOpening a file for writing is just as easy as opening a file for reading.\
    \ You simply use the `open` function, like this.\n\n```perl\nopen(MYFILE, '>c:\\\
    \\inetpub\\wwwroot\\filetest\\outfile.dat\")\n```\n\nNote that there is only a\
    \ very subtle difference between this and opening the file for reading—the inclusion\
    \ of the `>` symbol in front of the filename.\n\n### To create a file from a Perl\
    \ program, do the following.\n\n![Image](content/2315ca870dbd83955a501ae273159806.gif)\n\
    \n| NOTE |\n| :--- |\n| Each entry in the array ends in `\\n` and each entry is\
    \ double quoted so that the newline `\\n` characters are correctly interpreted.\
    \ |\n\n![Image](content/5cd5147158e4f2747e042af607370738.gif)\n\n| CAUTION |\n\
    | :--- |\n| In this example you used the `>` symbol at the front of the filename\
    \ in the `open` function, causing a new file to be written. If you run the program\
    \ again, it will still do the same. That is, any previous file will be overwritten.\
    \ It is very important to remember this for the future to avoid losing important\
    \ files. |\n\n**9.** Now save your file as `12-04.pl`.\n\n**10.** Run your program\
    \ (http://127.0.0.1/scripts/12-04.pl).\n\n![Image](content/7cbe913177c75d164dc88c494c843a21.gif)\n\
    \n### Adding Data to an Existing File\n\nYou can also add data to an existing\
    \ file. The change in the code to achieve this is very subtle. Remember that you\
    \ added a `>` sign to the front of a filename in the `open` function so that you\
    \ could write to the file. All you have to do to open a file to append data is\
    \ to put two `>` signs at the front of the name.\n\nTry it:\n\n**1.** Re-open\
    \ your write file program (`12-04.pl`).\n\n![Image](content/908231b86e47526be0ba51ea63935ef0.gif)\n\
    \n**3.** you now have `>>` at the front of the filename attribute of the file\
    \ open statement.\n\n**4.** Save your program as `12-05.pl`.\n\n**5.** Run your\
    \ program (http://127.0.0.1/scripts/12-04.pl).\n\n![Image](content/2cd1fcd93bed811e121092f955b1ebd3.gif)\n\
    \n![Image](content/f9abfd276310a8607990accb5ad7f581.gif)\n\nAs you can see, instead\
    \ of overwriting the file `outfile.dat` as `12-03.pl` would do, you are now adding\
    \ each copy of the text in your program to the end of the file.\n\n### Deleting\
    \ a File\n\nDeleting a file is very straightforward. It is accomplished using\
    \ the oddly-named `unlink` function.\n\nTo demonstrate the `unlink` function,\
    \ delete the output file you just created.\n\n![Image](content/89e407d152a2043fb753b3e5145be0a2.gif)\n\
    \n| NOTE |\n| :--- |\n| Multiple files can be specified by separating the filenames\
    \ with commas. |\n| `unlink('c:/inetpub/wwwroot/filetest/outfile.dat, c:/inetpub/wwwroot/filetest/anotherfile.dat\
    \ ') || die \"File(s) could not be deleted …\";` |\n| You can also store all the\
    \ filenames to be deleted in an array so that your delete becomes: |\n| ```perl\n\
    \  @files = {\"c:/inetpub/wwwroot/filetest/outfile.dat\", \"c:/inetpub/wwwroot/filetest/anotherfile.dat\"\
    };\n  unlink(@files) || die \"Files could not be deleted …\";\n  ``` |\n\n**5.**\
    \ Save your program as `12-06.pl`.\n\n![Image](content/84e42b551944acce1d39299001c2d7bc.gif)\n\
    \n### Using Directories with Perl\n\nPerl is also able to create and remove directories\
    \ or folders. This makes it very powerful, as it's able to create any environment\
    \ or file and folder structure that your application needs.\n\n#### Making a Directory\n\
    \nMaking directories or folders with Perl is very easy, and the functions used\
    \ are very similar to the equivalent DOS and UNIX commands. The function used\
    \ to create a directory is `mkdir`.\n\nTry this simple program.\n\n![Image](content/5185edee439eef45057994f3119180e9.gif)\n\
    \n**4.** Save your program as `12-07.pl`.\n\n![Image](content/78cf753c9cdbe1ae7457d2ffd68c9617.gif)\n\
    ![Image](content/b56ad726a8fa3c0ed8610f4905.gif)\n\n#### Removing a Directory\n\
    \nRemoving a directory is just as easy as creating one, and as you would expect,\
    \ it uses a similar syntax to the `rmdir` command.\n\n![Image](content/c0ea1d40e048cc42dd15f67e2151.gif)\n\
    \n**4.** Save your program as `12-08.pl`.\n\n![Image](content/e2d66a0c02bb92dee0b4bf6a3cab.gif)\n\
    ![Image](content/5a5cb61feb2f2ec07f5e9c0cba7f.gif)\n\nThere are lots of other\
    \ things you can do with folders, such as change permissions and so on, but that\
    \ is beyond the scope of this book. In most cases, being able to change permissions\
    \ through a Web application could be pretty dangerous.\n\n### Data Files\n\nYou\
    \ have already seen how to read data from and write data to a file. But in that\
    \ case, the data was simple strings of text. On most occasions your data will\
    \ be more sophisticated than that. For example, a simple directory may store its\
    \ data in separate fields such as forename, surname, telephone number, and so\
    \ on. How do you know which bit of data belongs where in a file? You have to tell\
    \ your program how to determine that. It's not as daunting as it sounds. All you\
    \ have to do is to decide on a character to use as field separator. Often you\
    \ will see the comma used for this purpose, but what if there are commas in the\
    \ data? Use a different character that is not likely to appear in the data. You\
    \ can use any character you like; in the following examples you will see the character\
    \ used. It really doesn't matter what you use as long as you can use it to separate\
    \ each data item from the next, and as long as that separator does not appear\
    \ in the text.\n\n| NOTE |\n| :--- |\n| If you have a U.S. Keyboard (or any other\
    \ besides British), you can get the character into your editor by holding down\
    \ the ALT key and typing `170` on the numeric keypad on the right hand side. Release\
    \ the ALT key and the character will appear in your editor. But, as I said, you\
    \ can use any character you like. |\n\nRight now, take a look at reading and writing\
    \ data from and to files and see how you can retrieve the information as separate\
    \ fields of data.\n\n#### Writing Files\n\nTry the following example, which is\
    \ almost identical to a previous example except for the data, which is stored\
    \ in a field called `$thisline`. The difference is that this is not one item of\
    \ data but four, as you will see.\n\n![Image](content/f63992675d9e143145e57ac30207d7e.gif)\n\
    \n![Image](content/6e74121eb8b110ab773b90352c74a55.gif)\n\n**6.** Save your program\
    \ as `12-09.pl`.\n\n![Image](content/245a7151c3cc4f85185258a5e0844dd.gif)\n\n\
    ![Image](content/6c1a5f77c9e1b1f838df6a27dda5.gif)\n\nThe next step is to be able\
    \ to get your data back from the file.\n\n#### Reading Files\n\nNow try retrieving\
    \ the data you just wrote to the file called `personnel.dat`.\n\n![Image](content/e6f5aeadd6823d6115047c57ac6d4bf.gif)\n\
    \n**3.** Using a while loop, read the data from the file.\n\n```perl\nwhile (defined($dataline=<MYFILE))\
    \ { print 'Reading file ...\"}\n```\n\n![Image](content/f2db618c2070f0d37f75ab09b35a103a.gif)\n\
    \n**8.** Save your program as `12-10.pl`.\n\n![Image](content/5e10c3f2192cf6d8aefa99540affcb8.gif)\n\
    \nAs you can see, files are useful to have available when building applications,\
    \ and indeed there is much you can do with them. By now, you have learned the\
    \ basics of the Perl language and now you can use some of the features of Perl\
    \ to grab data from a user on your Web page and store that data in a file. You\
    \ have learned how to retrieve that data and send it back to the user, or do whatever\
    \ you want to do with it. You can now build applications that are fully interactive\
    \ with the user. You may not be confident yet—so far this books has shown you\
    \ brief, easy to understand examples, and the leap from those to a full application\
    \ may seem a little daunting—but you are getting there.\n\nFiles have enabled\
    \ you to complete the loop. They give permanence (often referred to as *persistence*)\
    \ to your data, so that when your users come back another day, they can see their\
    \ input staring back at them.\n"
  raw: 'Opening a file for writing is just as easy as opening a file for reading.
    You simply use the open function, like this.


    open(MYFILE, ''''>c:\\inetpub\\wwwroot\\filetest\\outfile.dat")


    Note that there is only a very subtle difference between this and opening the
    file for reading—the inclusion of the > symbol in front of the filename.


    Page 244


    To create a file from a Perl program, do the following.


    ![Image](content/2315ca870dbd83955a501ae273159806.gif)


    | **NOTE** |


    | Each entry in the array ends in \n and each entry is double quoted so that the
    newline \n characters are correctly interpreted. |


    Page 245


    ![Image](content/5cd5147158e4f2747e042af607370738.gif)


    | **CAUTION** |


    | In this example you used the > symbol at the front of the filename in the open
    function, causing a new file to be written. If you run the program again, it will
    still do the same. That is, any previous file will be overwritten. It is very
    important to remember this for the future to avoid losing important files. |


    **9.** Now save your file as 12-04.pl.


    **10.** Run your program (http://127.0.0.1/scripts/12-04.pl).


    Page 246


    ![Image](content/7cbe913177c75d164dc88c494c843a21.gif)


    ##### ***Adding Data to an Existing File***


    You can also add data to an existing file. The change in the code to achieve this
    is very subtle. Remember that you added a > sign to the front of a filename in
    the open function so that you could write to the file. All you have to do to open
    a file to append data is to put two > signs at the front of the name.


    Try it:


    **1.** Re-open your write file program (12-04.pl).


    ![Image](content/908231b86e47526be0ba51ea63935ef0.gif)


    **3.** you now have >> at the front of the filename attribute of the file open
    statement.


    **4.** Save your program as 12-05.pl.


    Page 247


    **5.** Run your program (http://127.0.0.1/scripts/12-04.pl).


    ![Image](content/2cd1fcd93bed811e121092f955b1ebd3.gif)


    ![Image](content/f9abfd276310a8607990accb5ad7f581.gif)


    As you can see, instead of overwriting the file outfile.dat as 12-03.pl would
    do, you are now adding each copy of the text in your program to the end of the
    file.


    ### **Deleting a File**


    Deleting a file is very straightforward. It is accomplished using the oddly-named
    unlink function.


    To demonstrate the unlink function, delete the output file you just created.


    Page 248


    ![Image](content/89e407d152a2043fb753b3e5145be0a2.gif)


    Page 249


    | **NOTE** |


    | Multiple files can be specified by separating the filenames with commas. |


    | Unlink(''''c:/inetpub/wwwroot/filetest/outfile.dat,    c:/inetpub/wwwroot/filetest/anotherfile.dat
    ")


       &#124;&#124; die "File(s) could not be deleted …"; |


    | You can also store all the filenames to be deleted in an array so that your
    delete becomes |


    | @files = {"c:/inetpub/wwwroot/filetest/outfile.dat",    "c:/inetpub/wwwroot/filetest/anotherfile.dat"}


    unlink(@files)


       &#124;&#124; die "Files could not be deleted …"; |


    **5.** Save your program as 12-06.pl.


    ![Image](content/84e42b551944acce1d39299001c2d7bc.gif)


    ### **Using Directories with Perl**


    Perl is also able to create and remove directories or folders. This makes it very
    powerful, as it''s able to create any environment or file and folder structure
    that your application needs.


    Page 250


    #### **Making a Directory**


    Making directories or folders with Perl is very easy, and the functions used are
    very similar to the equivalent DOS and UNIX commands. The function used to create
    a directory is mkdir.


    Try this simple program.


    ![Image](content/5185edee439eef45057994f3119180e9.gif)


    **4.** Save your program as 12-07.pl.


    Page 251


    ![Image](content/78cf753c9cdbe1ae7457d2ffd68c9617.gif)


    ![Image](content/b56eead726a8fa3c0ed068610f490705.gif)


    #### **Removing a Directory**


    Removing a directory is just as easy as creating one, and as you would expect,
    it uses a similar syntax to the DOS rmdir command.


    Page 252


    ![Image](content/c0ea1d408e048ccf42dd15f672e21c51.gif)


    **4.** Save your program as 12-08.pl.


    ![Image](content/e2d66a0c02cbb92dee0b4bfb6a863cab.gif)


    Page 253


    ![Image](content/5a5cb61feb12f3ec07f5e9c60c6ba7f7.gif)


    There are lots of other things you can do with folders, such as change permissions
    and so on, but that is beyond the scope of this book. In most cases, being able
    to change permissions on folders through a Web application could be pretty dangerous.


    ### **Data Files**


    You have already seen how to read data from and to write data to a file. But in
    that case, the data was simple strings of text. On most occasions your data will
    be more sophisticated than that. For example, a simple employee directory may
    store its data in separate fields for data items such as forename, surname, department,
    telephone number, and so on. How do you know which bit of data belongs where in
    a file?


    You have to tell your program how to determine that. It''s not as daunting as
    it sounds. All you have to do is to decide on a character to use as a *field separator*.
    Often, you will see the comma used for this purpose, but what if there are commas
    in the data? Just use a different character that is not likely to appear in the
    data. You can use any character you like; in the following examples you will see
    the *not* (¬) character used. It really doesn''t matter what you use as long as
    you can use it to separate each data item from the next, and as long as that separator
    does not appear in the text.


    Page 254


    | **NOTE** |


    | If you have a U.S. Keyboard (or any other besides British), you can get the
    ¬ character into your editor by holding down the ALT key and typing 170 on the
    numeric keypad on the right hand side of the keyboard. Release the ALT key and
    the character will appear in your editor code. But, as I said, you can use any
    character you like. |


    Right now, take a look at reading and writing data from and to files and see how
    you can retrieve the information as separate fields of data.


    #### **Writing Files**


    Try the following example, which is almost identical to a previous example except
    for the data, which is stored in a field called $thisline. The difference is that
    this is not *one* item of data but *four*, as you will see.


    ![Image](content/f63992675d9e1431450e57ac30207d7e.gif)


    Page 255


    ![Image](content/6e74121eb8b110ab773b903522c74a55.gif)


    **6.** Save your program as 12-09.pl.


    ![Image](content/245a7151c13cc4f85185258a5e0844dd.gif)


    Page 256


    ![Image](content/6c1a5f77c9e1b1f838df6a27e7dda052.gif)


    The next step is to be able to get your data back from the file.


    #### **Reading Files**


    Now try retrieving the data you just wrote to the file called personnel.dat.


    ![Image](content/e6f5aeadd6823d6115047c576ac6d4bf.gif)


    Page 257


    **3.** Using a while loop, read the data from the file.


    while (defined($dataline=<MYFILE>)) { print ''''Reading file …<br>";


    ![Image](content/f2db618c2070f0d37f75ab09b35a103a.gif)


    **8.** Save your program as 12-10.pl.


    Page 258


    ![Image](content/5e10c3f2192cf6d8aefa99540faffcb8.gif)


    As you can see, files are useful to have available when building applications,
    and indeed there is much you can do with them.


    By now, you have learned the basics of the Perl language and now you can use some
    of the features of Perl to grab data from a user on your Web page and store that
    data in a file. You have learned how to retrieve that data and send it back to
    the user, or do whatever you want to do with it. You can now build applications
    that are fully interactive with the user. You may not be confident yet—so far
    this books has shown you brief, easy to understand examples, and the leap from
    those to a full application may seem a little daunting—but you are getting there.


    Files have enabled you to complete the loop. They give permanence (often referred
