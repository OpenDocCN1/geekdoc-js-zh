    ## How is This Book Organized?


    My aim in this book is to get you to your destination in the shortest possible
    time, while seeking to help you understand how works. I have deliberately avoided
    some of the more difficult aspects of learning a language such as Perl, for that
    lies the seeds of exasperation, disillusionment, and the abandonment of the language.


    You will find that first chapters of the book are concerned with the creation
    of the Web development environment—installing Perl and a Web server. From there
    to little over half-way through the book, you''ll find bite-sized pieces of Perl
    code, each designed to demonstrate one particular aspect of the language. The
    step-by-step code examples are accompanied by screenshots showing the code and
    its resulting execution. From there onwards, you will work to building real Perl
    applications—examining CGI and forms, as well as files and e-mail.


    ## Who Should Read this Book?


    This book assumes as little as it is possible to assume. It is aimed at someone
    who has little knowledge of Web development, or someone who has used WYSIWYG point-and-click-type
    Web authoring tools and now wants to move into creating Web applications in as
    short a time as possible.


    ## Software/Hardware Requirements


    To use this book and the examples supplied, you will need a Web server. If you''re
    using Windows 95 then you can obtain Personal Web Server. This is often to be
    found on freebie magazine-mounted CDs lurking in a free product called NT Server
    4 Option Pack. The Option Pack also contains Peer Web Services for Windows NT
    4, which does the same job. Users of Windows 98 / ME should find that they have
    a copy of Personal Web Server already on their machine. If not, check your Windows
    installation CD. Windows 2000 professional / XP Professional users should find
    they have a copy of Internet Information Server (IIS) on their machine, which
    is even better. UNIX users can make use of the brilliant Apache Web server available
    from www.apache.org (a Windows version is also available).

