    `<BODY>` 标签包含页面的实际内容——通常称为 `document`——它由各种可能的 HTML 标签组成。


    ## 编写 HTML 文档


    在本章中，你将学习 HTML 的基础知识，帮助你尽可能快地上手 Web 应用程序，但你应该知道，正如计算机领域的大多数其他事物一样，HTML 也有正式且公认的标准。随着你编写
    Web 应用变得越来越熟练，你将会想要更多关于这些标准。网上有许多网站以及一些优秀的书籍，可以帮助你扩展知识。


    第 148 页


    HTML 是简单的，但像生活中的大多数事情一样，它是有规则的。遵循文本并尝试示例；当你读到章节结束时，你应该能够仅使用一个简单的文本编辑器和 Web 浏览器从零开始编写网页。


    首先告诉浏览器这是一个 HTML 文档。要做到这一点，你使用 `<HTML>` 标签。你用 `</HTML>` 标签结束 HTML 文档。所有的结束标签与起始标签相同，只是它们在标签名称开头有一个正斜杠。


    所以，头部标签是 `<HEAD>`，并以 `</HEAD>` 结束。主体标签是 `<BODY>`，并以 `</BODY>` 结束。明白了吗？


    打开你的编辑器并开始编写一些 HTML。


    ![Image](img/4e41b178a466443b8e2715e6c78b1dda.gif)


    HTML 页面的标题（显示在你 Web 浏览器顶部蓝色标题栏上的那个，而不是网页内部的！）的代码为：


    `<HEAD> <TITLE>This is a Web Page</TITLE>`


    | 注意 |

    | :--- |

    | `<HEAD>` 标签打开 HTML 页面头部。`<HEAD>` 用于包含标题和其他内容，例如 JavaScript、VBScript 等。当你编写表单代码时，你会看到这一点。
    |


