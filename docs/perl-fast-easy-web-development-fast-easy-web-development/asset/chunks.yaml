    There are a couple of things to note here. The SRC= attribute gives the name of
    the file and the path to the file if it is not in the same folder as the HTML
    file. The image file could even be at another location, in which case you could
    give the full URL. If the image file is in a folder called Images below the current
    folder (that is, below the folder the HTML file is in), you would specify the
    SRC attribute as:


    Images/biggles.jpg


    If your Images folder is stored above the current folder you would denote this
    as


    ../images/biggles.jpg


    If the Images folder were right at the top of the site, you would indicate this
    by


    /images/biggles.jpg


    All this might seem a little confusing, but you will come across it again when
    you learn about hyperlinks, and you will find it gets clearer as you go along.


    ### **Hyperlinks**


    You will shortly be learning about frames. Before you do, you need to understand
    hyperlinks, because frames are pretty useless without them. Indeed, the whole
    Internet would cease to exist without hyperlinks (sometimes called *hypertext
    links*)


    Page 175


    Linking pages is very simple; you use *anchor* tags to accomplish it. The anchor
    tag looks like this:


    <A HREF=''''http://www.microsoft.com">Go to the Microsoft Home Page</A>


    This anchor tag shows the text "Go to the Microsoft Home Page." When displayed
    on the Web page it is (usually) colored blue and underlined to show that it is
    a hyperlink. You can set the color of the link text in the <BODY> tag. (HREF stands
    for hypertext reference).


    You can use images instead of the link text shown in the previous example.


    <A HREF="http://www.microsoft.com"><IMG SRC=image1.jpg WIDTH="30" HEIGHT="10"
    BORDER ="0"></A>


    | **NOTE** |


    | The BORDER= "0" attribute is used to prevent a box being displayed around the
    image. |


    ### **Linking within a Page**


    You can link to a location within a page by using the anchor NAME attribute.


    <A HREF=#placename</A>


    Lower in the page you must put an anchor name tag.


    <A NAME=placename>


    You can also jump to a location within another page by combining the URL type
    HREF and the "place name," or anchor name.


    <A HREF="http://www.mydomain.com/index.htm#location2">Go to the Microsoft Home
    Page</A>


    This will cause index.htm to be loaded and to be immediately scrolled down the
    place in the page containing the <A NAME=location1> tag.


    Page 176


    Try this simple hypertext link demonstration.


    **1.** Create an HTML page using the usual <HEAD> tags and so on and with an appropriate
    title.


    <HTML> <HEAD> <TITLE>Hyperlink Test Page</TITLE> </HEAD>


