    In a class definition you would write methods (know as functions in normal programming
    terms) to deal with each of these actions.


    With the definition of the object (in the form of a class) you can now create
    the bank account object itself; in fact you can create lots of them. Where ordinary
    languages might have arrays of integers and so on, in object-oriented languages
    you can have arrays of objects too. This is very powerful indeed. Imagine trying
    to keep track of loads of accounts in a normal procedural language.


    One of the main points of object orientation is that the data within an object
    can be set up to be accessed only via that object''s methods. This helps to ensure
    the integrity of the data and reduces bugs. This feature is known as `data hiding`.


    Creating an object from the class definition is referred to as `instantiation`.


    A form of notation has been developed to help you to describe the act of accessing
    the methods within an object. This is sometimes referred to as `dot notation`.
    For example, if you want to access the `add_funds()` method of an object you can
    write it as


    ```javascript

    account.add_funds( )

    ```


    Note the dot between `account` and `add_funds()`.


    If you are with me so far, here is another twist.


    Page 312


    Having created your account class, you can now slightly change the purpose of
    the account. For example, you can have current accounts and savings accounts.
    The basic information that defines an account (account number, balance, and so
    on) can be held in a super class. Then other classes can inherit from this class
    and provide the more specific information that describes a particular type of
    account. This is an illustration of the potential flexibility of object orientation.
    This use of inheritance is an example of the much-discussed code re-use advantage
    of object-oriented languages.


    Let''s go for a silly example, and create a class called `Animal`.


    What data can you hold about an animal?


    Carnivore (true/false) Number of legs (integer)


    What methods (functions) could you have? Most animals make a sound of some sort,
    so you could have a method called


    ```javascript

    talk( );

    ```


    This gives a basic animal class. You can inherit from this class and specialize
    into more specific subclasses. Your subclasses can inherit the basic methods from
    the superclass, or higher level class. So you can create a class for a cat and
    one for a dog, both based on the animal superclass but with their own specializations
    that describe the differences from the basic animal class.


    Now calling the `talk()` method for each object you create, such as `dog.talk()`,
    `cat.talk()`, causes an appropriate response from each object—the dog will bark
    and the cat will meow.


    This ability to produce an equivalent but appropriate response is known as `polymorphism`.
    Perhaps you can begin to see the possible uses of such behavior.


    An in-depth discussion about all the aspects of object orientation is beyond the
    scope of this book, but I hope that you can begin to see there are possible advantages
    of object orientation over conventional procedural programming. Now let''s turn
    back to discussing JavaScript.


    Page 313


    ### Elements of JavaScript


    JavaScript uses objects. The HTML page that you might be on at any particular
    time is referred to as the `document object`. There are many other objects as
    well, such as the window object, the form object, the form element object (containing
    the `<INPUT TYPE=…>` elements), and the button object.


    Many of these objects produce `events`, that is a result of the user''s action
    or a change in the state of some element on a page or in a window. For example,
    clicking a button on a form triggers the `onClick` event. When you roll your mouse
    over an image you trigger the `onMouseOver` event. You can attach JavaScript code
    to these events to cause things to happen.


    As in other object-oriented languages, you use methods to cause something to happen
    to an object. Here is a simple example. If you want to move the cursor into a
    text field called `Surname` on a form called `MyForm1` you would write


    ```javascript

    document.MyForm1.Surname.focus();

    ```


    Note the dot notation again. This means that the `document` object contains a
    form object called `MyForm1`, and object `MyForm1` contains an object called `Surname`.
    The object called `Surname` has a method within it called `Focus()`, which is
    what is being called, or executed, in the example. So you have objects contained
    within objects, a bit like a Russian nesting doll.


    Also notice the parentheses at the end of the method name. These show that this
    is a method, but they are also used to pass parameters to methods that accept
    them. In our earlier bank account example, you might want to add funds. When you
    use the method to do this, you can write


    ```javascript

    account1.addfunds(500.00)

    ```


    This means (in this example) you are adding $500.00 to `account1`.


    Much of the time, the parentheses following a method name are empty. Sometimes,
    as in the previous example, the parentheses are used to pass information to the
    method.


    Page 314


    So now you have an idea of how objects are used; you will start to build upon
    this with some examples. But before you do that, you must learn how to incorporate
    JavaScript into your Web pages.


    ### Where Do You Put Your JavaScript?


    Now you have some idea of what JavaScript is all about, it is time to look at
    where to put it. To tell the Web browser that you are using any kind of script,
    you have to use the `<SCRIPT>` tag. This is a general HTML tag and not anything
    to do with JavaScript itself. It is used to point out that some kind of script
    follows. The default script language (for IE5 at least) is VBScript. So, if you
    want to use JavaScript, you should use


    ```html

    <SCRIPT LANGUAGE=''''JavaScript">

    ```


    If you don''t specify the language, the browser is usually enough to recognize
    which language you are using, but don''t assume anything. `</SCRIPT>` is used
    to end all script sections, whether they are VBScript, JavaScript, or another
    language. Note also that there are several versions of JavaScript, so you will
    need to become more aware of the differences as you become more proficient and
    want to extend the complexity of your scripts.


    Page 315


    Another thing to remember is that you can place script either in the `<BODY>`
    of an HTML document or in the `<HEAD>`.


    Generally, you use JavaScript in the body of a document if you want it to execute
    as the page loads. JavaScript placed in the head of a document is generally used
    as it is required, or `called`, as the action of executing it is called. The script
    in the head takes the form of `functions` (discrete sections of code), each function
    having a specific purpose.


    ### More JavaScript Syntax


    JavaScript uses code blocks all over the place. These are lines of code enclosed
    in braces, very much like Perl.


    For example:


    ```javascript

    { Document.write (''Hello There!"); Alert("This is a pop-up box!"); }

    ```


    It is unusual to see a block of code like this on its own. Often it is the body
    of a function, as in this example:


    ![Image](content/5f3df98b1f0efd945d63b2f3b08440f2.gif)


    Page 316


    ![Image](content/6db65e2846138e0680f876cd592d7e06.gif)


    Page 317


    ![Image](content/8ed0ca1bdd3f806d88a3c5a9af547f68.gif)


    | **NOTE** |


    Normally, you would save this either in a folder under your wwwroot folder, or
    you would upload it to your hosting company to use on the Internet and you would
    then access it using the appropriate URL as you do when you are connecting to
    a normal Web site.


    If you saved this page into a folder called `test` at the top level of your ISP
    Web space, you would enter something like


    http://www.mydomainname.com/test/15-01.htm |


    Page 318


