    浏览器将这两行文字在了一起。在 HTML 文档中，换行符（carriage returns）会被忽略。这样做是为了让文档流具有灵活性，这样当你更改浏览器窗口大小时，文本会移动以占据可用空间。如果你在文档中放置普通的换行符，这种调整功能将无法良好工作。


    如果你想强制换行，必须使用 HTML 标签 `<BR>`。它代表 break（换行符）。


    为了演示这一点：


    ![Image](img/6cea91fd5e710a2fe9bf3bb63f219584.gif)


    第 152 页


