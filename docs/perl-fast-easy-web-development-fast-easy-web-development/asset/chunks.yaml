    as you do not have a database to run it against! Next you are going to create
    the HTML form to add data to your database and a Perl script to actually insert
    the data into the database table.


    ### **addcontact.htm**


    This is a simple HTML form that sends data to the insertrec.pl program. You are
    also going to check, using JavaScript, if the user has entered the data he or
    she should have and then give them an appropriate message if they did not.


