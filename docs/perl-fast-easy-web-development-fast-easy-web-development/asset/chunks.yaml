    ## **Introduction**


    Perl was born in October, 1987\. Written by Larry Wall as a Ph.D. project, it
    first appeared on the comp.sources News Group as Perl version 1.0\. Perl now offers
    a standard set of supplied libraries, object-oriented programming facilities,
    and expanded regular expressions. Perl used to be written as PERL (and sometimes
    still is), reminding us that it stands for Practical Extraction and Reporting
    Language. That is what it did, back when it was first written. Now it does much
    more.


    Perl is an interpreted language. That means it isn''t as fast as languages like
    C, but it also means you don''t have to keep cycling through the laborious process
    of editing, compiling testing, then re-editing, recompiling, and so on. With Perl,
    you just edit and run! It''s a fast language to develop in and a great one to
    prototype with! Perl can also be very concise. It is possible to achieve a lot
    with very little code. In current parlance, then, Perl is a results-oriented language.


    Perl has become the ''''glue" that allows many other tools to be linked together.
    It has been "ported" to many platforms and has become an essential tool for OS
    administrators and Web Programmers. It has been used to build complete systems,
    and it is also used for creating throw-away code snippets to do one-off jobs.
    Perl is used world-wide on numerous platforms and with many different Web servers.
    In many cases it is the default Web language. If an ISP offers any CGI-type programming
    facilities, it is likely that they will include Perl. If it offers only one language,
    that language is probably Perl. Perl is powerful, Perl is fast (for an interpreted
    language!), and Perl is useful! There is virtually no job that cannot be done
    with Perl, and often jobs can be done with far less code than would be possible
    using most other languages.


    Page xvi


    In this book you will explore many of Perl''s features before looking at how you
    can use it to build dynamic Web sites. You will not trawl through huge conceptual
    discussions on the whys and wherefores of Perl. Rather, you''ll take the language
    and select the methods and mechanisms that can help you most in your quest to
    write active Web sites. In other words, you''ll be exploring ways of solving problems.
    After all, that''s what programming languages are designed to do! My aim in this
    book is to get you to your destination in the shortest possible time, at the same
    time seeking to help you understand how Perl works in this field.


    ### **How is This Book Organized?**


    This is very much a ''''get you started" book. I have deliberately avoided some
    of the more difficult aspects of learning a language such as Perl, for that way
    lies the seeds of exasperation, disillusionment, and the probable abandonment
    of the language.


    You will find that first chapters of the book are concerned with the creation
    of the Web development environment—installing Perl and a Web server. From there
    to a little over half-way through the book, you''ll find bite-sized pieces of
    Perl code, each designed to demonstrate one particular aspect of the Perl language.
    The step-by-step code examples are accompanied by screenshots showing the code
    and its resulting execution.


    From there onwards, you will work to wards building real Perl applications—examining
    CGI and forms, as well as files and e-mail. The book ends with a full Perl database
    Web application.


    ### **Who Should Read this Book?**


    This book assumes as little as it is possible to assume. It is aimed at someone
    who has little knowledge of Web development, or someone who has used WYSIWYG point-and-click-type
    Web authoring tools and now wants to move into creating Web applications in as
    short a time as possible.


    Page xvii


