    ## The For Loop


    This is similar to the C/C++ `for` loop. The format of the `for` loop is


    ```perl

    for(loop_variable = initial_value; loop_termination_condition; loop_variable_update)

    ```


    The syntax begins with the keyword `for`, followed by an open bracket, and then
    the initial condition of the `for` statement, followed by the test that determines
    whether the loop should finish or not, followed by the update to the variable
    being tested. Often this is an increment, but it can also be a decrement value.
    Finally, there is the closing bracket. Then there is the block of code to be executed
    while the test condition allows.


