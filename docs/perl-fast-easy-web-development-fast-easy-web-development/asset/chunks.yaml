- fmt: '

    • A *comment* is a line (or more than one line) that performs no function in the
    program. It is descriptive text used to help a human reader to understand what
    is going on in the code. Each line of a comment in Perl starts with a `#` sign.


    Perl is a *free format* language. That is, there can be as much white space (spaces,
    tabs, line breaks, and so on) as you wish. This means that you can write your
    code in a manner that makes it a lot more readable than some other languages.


    It also means that Perl needs some way of showing when it has reached the end
    of a statement. This is achieved by the use of the semicolon (`;`). So a Perl
    statement may look like this:


    ```

    print ''''I think Perl is great \n";

    ```


    This is a common method of terminating a statement. `C`, `C++`, `Java`, `PHP`,
    and `Pascal`, among others, all use the semicolon to terminate statements; so
    if you are coming from one of those languages, you will be familiar with this
    already.


    Okay, assuming you have selected which editor you would like to work with, you
    can now plunge into some Perl and see how it hangs together!


    ### **Beginning Perl**


    All Perl programs should begin with what is affectionately known as the "shebang"
    statement. The shebang statement should occur in the beginning at the first column
    on the first line of the program, and it should contain the file path to the Perl
    interpreter, `perl.exe`. Why it should be called the "shebang" statement is open
    to debate, but it is typical of the type of names that are used in computing for
    some special characters (the exclamation mark is often referred to as the ''''shriek"
    or the "splat").


    The shebang statement starts with a `#` sign, indicating that it is a comment
    line. However, it is actually the one exception to this! On UNIX systems, this
    line tells the operating system where to find Perl so that the program can be
    executed.


    | **NOTE** |

    | Remember: A Perl program should always begin with `#!pathname_to_Perl,`, in
    column 1, line 1. |


