    Some things don''t appear to be any easier using the `CGI.pm` functions than using
    the `print` function and the usual HTML. Here is an example. To print a horizontal
    rule using `CGI.pm`, you would do this:


    ```

    print hr( );

    ```


    Not difficult, but not exactly shorter. Of course, in these days of modern programming
    there is much to be said for consistency, and if you are using the `CGI.pm` module,
    perhaps you might want to use it throughout your program to avoid confusing others
    who come along after you. But to be honest, mixing and matching of standard Perl
    with `CGI.pm` stuff allows you to mix useful features of the `CGI.pm` module with
    other standard features of Perl that you are already familiar with.


    Other similar "unpaired tags" such as the `<BR>` and the `<P>` tags are treated
    in a similar way. Try the short program on the next page to demonstrate the use
    of some other tags via `CGI.pm`.


    Page 346


    ![Image](content/673b05f5a00ba13fd29752b1e3bc4fde.gif)


    | **NOTE** |

    | :--- |

    | The ordered list is preceded by the `CGI.pm` equivalent of the `<h3>Languages</h3>`
    header in HTML. |


    Page 347


    **6.** Save this program as `16-02.pl` in your script folder.


    ![Image](content/3357608dd847f426b734d603eea48f43.gif)

    ![Image](content/edcd1d0d931e32ae084638ec65db3b67.gif)


    Let''s take a look at a few more things that `CGI.pm` can do.


    Page 348


    ### Forms and CGI.pm


    `CGI.pm` can also build forms. You can generate the HTML on-the-fly to create
    forms, including all the usual elements, such as select boxes, text areas, and
    a submit button. Try the following program, which has many of the usual elements
    you might expect to find in a form. I''ll leave you to judge how easy it is to
    use.


    The page you are going to create here is going to call itself. This form will
    also remember the state or values of all the fields on each execution of the form.
    You will see what I mean in a moment.


    **1.** Open a new program in your editor.


    ```perl

    #!c:/perl/bin

    ```


    ![Image](content/e72d44c096ce583c799a00d4b2e8e938.gif)


    Page 349


    ![Image](content/11ac64b67168d14bf826b70b451c8415.gif)


    | **NOTE** |

    | :--- |

    | Note the parameters: Default is any text you want the field to have when the
    form is displayed, the 50 is the length of the field. This is the same as `<INPUT
    TYPE=''TEXT" NAME="surname" VALUE="Default" SIZE="50">`. |


    Note the parameters for the name of the check box group, and the value for each
    check box.


    Page 350


    ![Image](content/f8a8fe4f7ee9dbbe08b90af4196f7094.gif)


    **13.** Save the script as `16-03.pl`.


    ![Image](content/36c2454c5be37b62e56a7ad5a3b352b0.gif)


    Page 351


    ![Image](content/633a2d59f3931f90f3d34546e5722fbb.gif)


    Before you go any further, a word of warning: There are a few cases that may cause
    confusion, the most common being that if you use the `tr()` function to try to
    create a table row (yes `CGI.pm` handles tables, too) you will end up invoking
    the Perl translate function. A similar conflict occurs with `select` (as in select
    lists). To be honest, you are better off creating tables using the conventional
    HTML; then you won''t encounter the conflicts.


    Incidentally, if I''ve left you wondering, you can generate a table like this:


    ```perl

    print table(Tr( td(''Some Data''), td(''Some More Data''), td(''Even More Data'')));

    ```


    which will generate the normal HTML, like this:


    ```html

    <table><tr><td>Some Data</td> <td>Some More Data</td> <td>Even More Data</td></tr></table>

    ```


    Next you''ll learn something really useful, something that the `CGI.pm` does that
    really takes the hard work out of grabbing data from HTML forms.


    Page 352


    ### Getting Data from Forms


    Here is an area where `CGI.pm` really does come into its own. Get--ing data from
    forms using `CGI.pm` is so much easier and more intuitive for the programmer.
    With `CGI.pm`, you don''t have to think about how you''re going to separate the
    key value pairs, or how you are going to separate the form field name from its
    accompanying value.


    Remember all that stuff you learned about getting the data from a form and having
    to convert characters, splitting on `=` and so on? Well, thanks to `CGI.pm` you
    can now dodge all that. If you are using the `POST` method, you can simply get
    at form data by using `CGI.pm`''s `param(''fieldname'')` function.


    The `param()` function simply returns the value of field named in `param()` parentheses.
    So


    ```perl

    myfield = param(''surname'');

    ```


    returns the value that had been typed into a field called `Surname`. Now that''s
    useful! Try this:


    **1.** Re-open your last program.


    Page 353


    ![Image](content/697647ab72380f9ce5f85d51194ba0.gif)


    **3.** The `if` statement checks if there are any values in fields and displays
    them if are. Which is what I mean by saying the page calls itself and remembers
    its state.


    **4.** Save the program as `16-04.pl`.


    Page 354


    ![Image](content/817ab9708280fa0176a372be678da47.gif)

    ![Image](content/59f51d18c7317a22a483a59e4c0459.gif)


    Form manipulation is a very useful area in which use `CGI.pm`. In my opinion,
    most useful of all! However, is one other aspect that will interest you—the object-oriented
    mode of `CGI.pm`.


    ### CGI.pm in Object-Oriented Mode


    Before we leave the subject of `CGI.pm`, there is a little more you should know.
    You have far used `CGI.pm` in what is known as function-oriented mode. `CGI.pm`
    can also be used in an object-oriented way.


    Page 355


    - If you treat `CGI` as class, you can have more than one `CGI` object.

    - You can inherit from `CGI` class and modify the resulting object''s behavior
    to suit your requirements.

    - Using `CGI.pm` in object-oriented mode uses less memory.

    - You can use parameters generated by name, so you don''t have to learn positional
    location of parameter; you just name it and assign a value in any order you like.

    - You can save a `CGI` object to disk and reload it.


    However, the object-oriented mode is also verbose, so it means more typing. Just
    for fun, let''s do a program similar to the last program (`16-04.pl`) in object-oriented
    mode and you''ll see what I mean.


    **1.** Start a new program in your editor.


    ```perl

    #!c:/perl/bin

    ```


    ![Image](content/6ba55fe14b589ef9c54429b6809150e.gif)


    Page 356


    ![Image](content/fd0a98a27364e9ed4294341a6a52dd9.gif)


    Page 357


    ![Image](content/6b4de4b30de776a5ef5ca8ad3b271a.gif)


    **6.** Save your program as `16-05.pl`.


    Page 358


    ![Image](content/968a710cfceabd3d458e22e28c97358d.gif)

    ![Image](content/3e888af956d0d3834f7e90738c954e3.gif)


    Page 359


    ![Image](content/f9476d9be12da19f82a684bfbd471ec.gif)


    The significant thing about the object-oriented way of using `CGI.pm` is that
    you can have lots of independent `CGI` objects and handle them all separately
    (`q2`, `q3` and so on). In fact, Perl itself now has an object-oriented mode,
    which is unfortunately beyond the scope of this book. But should you wish to learn
    more about it, there is lots of information at the Web sites listed in Appendix
    B in the back of this book.


    Page 360


    ## 17 Case Study: A Contact Database


    In 361 this chapter you are going to see how all of the things you have learned
    so far can be brought together to demonstrate a complete Perl database-driven
    application. This application is a simple contacts database. You can, of course,
    modify it to do any number of different jobs including the Guest book. I think
    you will find many useful things to do with the techniques used in this application.


    In this chapter you will:


    - ![Image](content/d938f552af65a53b177029c3d905885.gif) Create a home page

    - ![Image](content/d938f552af65a53b177029c3d905885.gif) Use the `listcontacts.pl`
    program to read and list the contents of a database table

    - ![Image](content/d938f552af65a53b177029c3d905885.gif) Use the `editcontact.pl`
    program to insert data in the database

    - ![Image](content/d938f552af65a53b177029c3d905885.gif) Use the `editcontact.pl`
    program to load data into fields


    Page 362


