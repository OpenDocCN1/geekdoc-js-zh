    Page 396


    ### **The length() Function**


    The length() function returns the length of a scalar variable. The syntax for
    the length function is


    $size = length($variable);


    For example, the following code:


    $variable = ''''fred"; $size = length($variable); print "The length of \$size
    = $size";


    would display


    The length of $size = 4


    ### **The reverse() Function**


    The reverse() function takes an array as its argument, and returns an array in
    which the order of the elements has been reversed. The syntax is


    @reversedarray = reverse( @startarray );


    So, if you do this


    @startarray = (A .. K); @reversedarray = reverse( @startarray ); print "Array
    = @reversedarray \n";


    Then you will see


    K J I H G F E D C B A


    Page 397


    ### **The index() Function**


    The index() function finds the postion of the first occurrence of another string.
    By default, it starts at the leftmost character of the string being searched.
    If you add a third optional parameter, the function will start at the location
    in this parameter.'
