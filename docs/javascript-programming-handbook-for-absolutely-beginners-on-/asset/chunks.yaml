- fmt: "\n## Properties and Values\nEach CSS rule consists of properties (such as\
    \ `color`, `font-size`, `margin`) and their corresponding values. These properties\
    \ define how the selected elements will be styled.\n\n```css\n.button {\n  background-color:\
    \ blue;\n  color: white;\n  border-radius: 5px;\n}\n```\n\n## Cascading and Inheritance\n\
    The \"Cascading\" in CSS refers to how styles are applied in a hierarchy. Specific\
    \ rules take precedence over more general ones, and properties can be inherited\
    \ from parent elements unless explicitly overridden.\n\nFor GUI design, CSS plays\
    \ a critical role in defining the look and feel of the interface. However, the\
    \ real power of a dynamic and interactive GUI comes when CSS is combined with\
    \ JavaScript.\n\n## Dynamically Manipulating CSS Classes with JavaScript\nThe\
    \ most common way to change the appearance of elements in a GUI is by dynamically\
    \ adding or removing CSS classes using JavaScript. CSS classes group styles together,\
    \ making it easier to apply multiple styles at once. JavaScript can interact with\
    \ these classes through the `classList` API.\n\n### 1. Adding and Removing Classes\n\
    JavaScript’s `classList` property is used to manipulate the CSS classes applied\
    \ to an element. Using methods like `add()`, `remove()`, or `toggle()`, developers\
    \ can control which styles are applied to elements in real-time.\n\n```javascript\n\
    let button = document.querySelector('.btn');\nbutton.classList.add('active');\n\
    ```\nIn the above example, JavaScript adds the `active` class to the button element.\
    \ This could trigger a change in its appearance, such as highlighting the button\
    \ or changing its color to indicate that it has been clicked or activated.\n\n\
    Similarly, you can remove classes when certain conditions are met:\n\n```javascript\n\
    button.classList.remove('active');\n```\nIf the user deselects or deactivates\
    \ the button, JavaScript removes the `active` class, reverting it back to its\
    \ original style.\n\n### 2. Toggling Classes\nOne of the most convenient methods\
    \ provided by the `classList` API is `toggle()`. This method adds a class if it’s\
    \ not already present, or removes it if it is.\n\n```javascript\nlet menu = document.querySelector('.menu');\n\
    menu.classList.toggle('open');\n```\nIn this case, clicking a button could toggle\
    \ the visibility of a dropdown menu by adding or removing the `open` class. Toggling\
    \ classes like this makes it easy to switch between different states of an element\
    \ based on user actions.\n\n## Modifying Inline Styles Using JavaScript\nWhile\
    \ manipulating CSS classes is the most efficient way to change styles dynamically,\
    \ there are times when you may need to directly modify an element’s inline styles.\
    \ JavaScript allows you to access and change any CSS property using the `style`\
    \ object of an element.\n\n### 1. Changing CSS Properties\nYou can modify any\
    \ CSS property of an element using JavaScript. The `style` object provides direct\
    \ access to the inline styles of an element. For example, to change the background\
    \ color of a button, you would write:\n\n```javascript\nlet button = document.querySelector('.btn');\n\
    button.style.backgroundColor = 'red';\n```\nIn this case, the `backgroundColor`\
    \ property is modified directly via JavaScript, changing the button’s background\
    \ color to red. Note that CSS properties that usually contain a hyphen (e.g.,\
    \ `background-color`) are written in camelCase (e.g., `backgroundColor`) when\
    \ accessed via JavaScript.\n\n### 2. Resetting Styles\nIf you want to remove an\
    \ inline style that was previously applied with JavaScript, you can set the style\
    \ property to an empty string. This reverts the element back to its original style\
    \ as defined by the CSS stylesheet.\n\n```javascript\nbutton.style.backgroundColor\
    \ = '';\n```\nThis would reset the button’s background color to whatever was originally\
    \ defined in the CSS, effectively undoing the change.\n\n## Responsive Design\
    \ with JavaScript and CSS\nResponsive design ensures that a website’s layout adjusts\
    \ appropriately for different screen sizes and devices. CSS handles much of this\
    \ with media queries, but JavaScript can enhance responsive behavior by detecting\
    \ the current screen size or browser window dimensions and adjusting the styles\
    \ accordingly.\n\n### 1. Detecting Screen Size Changes\nJavaScript’s `window`\
    \ object provides properties and methods for detecting the size of the browser\
    \ window. By using the `resize` event, you can trigger style changes when the\
    \ window is resized.\n\n```javascript\nwindow.addEventListener('resize', () =>\
    \ {\n  let width = window.innerWidth;\n  if (width < 600) {\n    document.body.style.backgroundColor\
    \ = 'lightblue';\n  } else {\n    document.body.style.backgroundColor = 'white';\n\
    \  }\n});\n```\nIn this example, when the window is resized to a width of less\
    \ than 600 pixels, the background color of the body element changes to light blue.\
    \ Otherwise, it remains white. This type of behavior can be useful in responsive\
    \ design when you need to adapt the GUI based on the user’s screen size.\n\n###\
    \ 2. Applying Dynamic CSS Rules\nJavaScript can dynamically insert CSS rules into\
    \ a document’s stylesheet to handle specific conditions or states that may not\
    \ be easily captured by CSS alone. For instance, when a user interacts with a\
    \ specific component, you might want to apply unique styles that aren’t predefined\
    \ in the stylesheet.\n\n```javascript\nlet style = document.createElement('style');\n\
    style.innerHTML = `\n@media (max-width: 600px) {\n  body {\n    font-size: 12px;\n\
    \  }\n}\n`;\ndocument.head.appendChild(style);\n```\nIn this example, a new style\
    \ rule is created dynamically using JavaScript. This rule ensures that if the\
    \ screen width is 600 pixels or less, the font size for the body element is reduced\
    \ to 12 pixels. By dynamically adding CSS rules like this, developers can fine-tune\
    \ the appearance of their GUIs based on runtime conditions.\n\n## Implementing\
    \ Transitions and Animations with JavaScript\nCSS transitions and animations play\
    \ a significant role in enhancing the user experience by adding smooth, visually\
    \ appealing effects when elements change. JavaScript can be used to trigger and\
    \ control these animations, offering a more dynamic and responsive GUI.\n\n###\
    \ 1. CSS Transitions Triggered by JavaScript\nCSS transitions allow you to smoothly\
    \ property changes over time. JavaScript can trigger these transitions by altering\
    \ the styles or classes applied to an element.\n\n```javascript\nlet box = document.querySelector('.box');\n\
    box.style.transition = 'width 2s';\nbox.style.width = '300px';\n```\nHere, the\
    \ width of a box element is animated over a period of two seconds when it is resized.\
    \ By modifying the element’s style properties via JavaScript, you can initiate\
    \ transitions that enhance the interactivity and visual appeal of the interface.\n\
    \n### 2. CSS Animations Controlled by JavaScript\nCSS animations can be defined\
    \ in stylesheets, but JavaScript allows you to control when and how these animations\
    \ are triggered. By adding or removing specific classes, JavaScript can initiate\
    \ animations at the appropriate time based on user interactions.\n\n```javascript\n\
    let ball = document.querySelector('.ball');\nball.classList.add('bounce');\n```\n\
    In this example, when the `bounce` class is added to the `ball` element, a predefined\
    \ CSS animation starts, making the ball bounce. This class can be removed or added\
    \ again to repeat the animation based on specific events or user actions.\n\n\
    ## Handling User Input for GUI Styling\nIn many interactive GUIs, user input can\
    \ directly influence the appearance of elements on the page. For instance, selecting\
    \ a theme, resizing components, or adjusting the layout can change the entire\
    \ look and feel of the interface. JavaScript plays a key role in handling this\
    \ dynamic aspect of GUI design.\n\n### 1. Theme Switching\n"
