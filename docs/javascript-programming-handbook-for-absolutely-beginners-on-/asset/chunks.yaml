    switch (action.type) {


    case ''INCREMENT'':


    return { count: state.count + 1 };


    default:


    return state;


    }


    };


    // Create a Redux store


    const store = createStore(reducer);


    store.dispatch({ type: ''INCREMENT'' });


    console.log(store.getState().count); // Output: 1


    Context API: Built into React, the Context API provides a way to pass data through
    the component tree without prop drilling, allowing for efficient state management
    in React applications.


