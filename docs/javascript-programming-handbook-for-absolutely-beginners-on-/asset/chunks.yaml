    \ Loading of Assets: Depending on the user’s device capabilities, JavaScript can\
    \ load different images or scripts, optimizing performance and user experience.\n\
    \n```javascript\nif (window.innerWidth < 768) {\n  const img = document.createElement('img');\n\
    \  img.src = 'small-image.jpg'; // Load a smaller image for mobile\n  document.body.appendChild(img);\n\
    }\n```\n\nMenu Toggle for Mobile: JavaScript can enhance navigation by enabling\
    \ responsive menus that toggle visibility based on user interaction, improving\
    \ accessibility on smaller devices.\n\n```javascript\nconst menuToggle = document.querySelector('.menu-toggle');\n\
    const nav = document.querySelector('.nav');\nmenuToggle.addEventListener('click',\
    \ function() {\n```\n"
