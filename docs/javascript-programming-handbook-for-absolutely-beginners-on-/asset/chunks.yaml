    \n## 高级动画技术\n\n一旦你掌握了基础知识，就可以开始尝试更高级的技术，来创建响应用户交互或多个同时变化的复杂动画。JavaScript 的灵活性允许动画链联、控制动画时机并实时对用户输入做出反应。\n\
