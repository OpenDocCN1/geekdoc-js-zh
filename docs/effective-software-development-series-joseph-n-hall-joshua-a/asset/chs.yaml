  \ 来检查 `open` 是否成功，以避免优先级问题。\n\n### 第 53 条 考虑从流中读取的不同方式\n\n你可以使用行输入操作符 `<>` 在标量上下文中从流中读取单行，或在列表上下文中读取整个流的内容。使用哪种方法取决于你对效率、对已读取行的访问需求以及其他因素，比如语法上的便利性。\n\
  \n一般来说，逐行读取在时间和内存方面是最有效的。隐式的 `while (<>)` 形式与对应的显式代码速度相同：\n\n```\nopen my ($fh),\
