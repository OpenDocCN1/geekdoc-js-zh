  \ =\n    sort { $lines{$a} <=> $lines{$b} } keys %lines;\n```\n\n### 高级排序：酷炫方式\n\
  \n通过设计，或者也许是尝试，或者只是偶然，Perl 程序员想出了一些方便的惯用法来实现复杂的排序转换。\n\n在前面的例子中，不太理想的一点是需要一个单独的语句来设置转换后的键的数组或哈希。一种绕过这个问题的方法是我称之为**兽人策略**（“||\
  \ cache”）的方法。它使用了鲜为人知的`||=`运算符。让我们重新审视之前看到的按修改日期排序文件名的例子。\n\n### 使用兽人策略排序\n\n这是按修改时间排序文件的旧方法，效率低下。这种排序必须多次调用`-M`：\n\
  \n```\nmy @sorted = sort { -M $a <=> -M $b } @files;\n```\n\n这是使用兽人策略的方法：\n\n```\n\
  my @sorted =\n    sort { ( $m{$b} ||= -M $b ) <=> ( $m{$b} ||= -M $b ) }\n    @files;\n\
  ```\n\n哇！这到底是怎么回事？首先，看看那个`||=`：\n\n```\n$m{$a} ||= -M $a\n```\n\n`||=`的语义与写成这样相同：\n\
  \n```\n$m{$a} = $m{$a} || -M $a\n```\n\nDownload from <www.wowebook.com>\n\n**82**\
  \ ❘ *第 2 章 惯用 Perl*\n\n排序子程序第一次遇到特定的文件名`$a`时，`$m{$a}`的值为`undef`，这是假值，因此必须计算`||`的右侧`-M\
  \ $a`。由于这是 Perl，而不是 C，`||`运算符返回右侧的实际结果，而不是简单的`0`或`1`（“真”或“假”值）。这个值现在被赋给`$m{$a}`。后续对同一文件名的测试将使用缓存在`$m{$a}`中的修改时间值。\n\
  \n哈希`%m`是临时的，在遇到这个排序语句时应该为空或未定义。你可能希望将这行代码包裹在花括号中，并将`%m`声明为`my`变量以限制其作用域，例如：\n\n\
  ```\n{\n    my %m;\n    @sorted = sort ...\n}\n```\n\n### 施瓦茨变换\n\n然而，最简洁、最全面的排序技术是**施瓦茨变换**，以\
  \ Randal Schwartz 命名。施瓦茨变换是一种由`map`包围的排序。\n\n展示施瓦茨变换的最佳方式是逐步构建它。使用之前的修改时间排序示例，但更高效地完成。首先，从文件名开始：\n\
