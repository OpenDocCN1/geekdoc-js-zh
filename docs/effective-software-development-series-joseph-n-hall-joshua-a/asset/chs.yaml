  \ 来构造可移植路径。\n\nptg\n\n# 第 57 条 将大部分数据留在磁盘上以节省内存\n\n如今的数据集可能非常庞大。无论是进行 DNA 测序还是解析网络日志，收集的数据量很容易超过程序内存所能容纳的量。处理大型数据集的\
