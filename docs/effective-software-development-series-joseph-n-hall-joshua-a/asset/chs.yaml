  my @results = $find_buster->( \\@input );\n```\n\n下载自 <www.wowebook.com>\n\n*第 50\
  \ 条 用子程序创建新的子程序* ❘ **177**\n\n你也可以使用函数从旧函数中创建新函数。我们可以用一整本书来介绍 Perl 中的这些**高阶函数**，但幸运的是，Mark\
  \ Jason Dominus 已经写了《高阶 Perl》。\n\n不过，这里有一个简短的例子。假设你有一组转换字符串的子程序：\n\n```\nsub my_uc\
  \ { uc $_[0] }\nsub my_ucfirst { ucfirst $_[0] }\n```\n\n\n\n\n\nsub trim_front\
  \ { my $s = shift; $s =~ s/^\\s+//; $s }\n\nsub trim_back { my $s = shift; $s =~\
  \ s/\\s+$//; $s }\n\n现在，给定一个字符串，你想要去除字符串开头和结尾的空白，并将首字母大写。你可以逐个调用所有需要的子例程，并将结果赋值回原始标量：\n\
  \n```\nmy $string = '';\n$string = trim_front($string);\n$string = trim_back($string);\n\
  $string = my_ucfirst($string);\n```\n\nptg\n\n你也可以通过将一个步骤的结果作为下一个步骤的输入来跳过中间步骤，但这有点混乱：`$string\
  \ = my_ucfirst( trim_back( trim_front($string) ) );` 相反，你可以将这些函数组合成一个新的子例程：\n\n\
  ```\nmy $ucfirst_and_trim = sub {\n    my $string = shift;\n    my_ucfirst( trim_back(\
  \ trim_front($string) ) );\n};\n```\n\n现在，你可以在任何需要执行这三个操作的地方使用这个组合子例程：\n\n```\n\
  $string = $ucfirst_and_trim->($string);\n```\n\n这与编写一个普通的子例程（创建一段可重用代码）没有太大区别，只不过你现在是在运行时执行它。\n\
  \n更进一步，编写一个工厂子例程来为你创建组合子例程。也许你在运行时才知道需要哪些操作，因此你不知道匿名子例程中应该放什么。这个组合子例程接收一个子例程引用列表，并返回一个返回它们组合结果的单一子例程：\n\
  \n```\nsub composer {\n    my (@sub_refs) = @_;\n    sub {\n        my $string =\
  \ shift;\n        foreach my $sub_ref (@sub_refs) {\n            $string = $sub_ref->($string);\n\
  \        }\n        return $string;\n    };\n}\n```\n\n你可以按照自己喜欢的方式组合新的子例程。在这个例子中，你按所需顺序列出操作：\n\
  \n```\nmy $ucfirst_and_trim = composer( \\&trim_front, \\&trim_back, \\&my_ucfirst\
  \ );\n```\n\nptg\n\n```\n$string = $ucfirst_and_trim->($string);\n```\n\n你的组合子例程可以做任何你需要它做的事情，只要它返回一个代码引用（或者可能多个代码引用）。\n\
  \n**需要记住的事项**\n\n- 根据运行时的程序状态创建新的子例程。\n- 包装子例程以提供默认参数。\n- 使用生成器子例程创建高阶函数。\n\n下载自\
