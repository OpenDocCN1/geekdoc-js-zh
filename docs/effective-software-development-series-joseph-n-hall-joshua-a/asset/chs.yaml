  \ <>;\n```\n\n你可以在 `perldsc`（Perl 数据结构食谱）或 `perllol` 文档中看到更多示例。\n\nDownload from\
  \ <www.wowebook.com>\n\n**214** ❘ *第 6 章 引用*\n\n### 要记住的事项\n\n- 使用数组引用来创建 Perl 中的数组的数组。\n\
  - 使用数组的数组来表示矩阵。\n- 确保你知道你的变量是普通数组还是引用。\n\n## 第 61 条：不要混淆匿名数组和列表字面量。\n\n匿名数组构造器 `[]`\
  \ 看起来很像包围列表字面量的圆括号。表面上，它们似乎都服务于相同的目的——构建列表。然而，匿名数组构造器在重要方面与列表字面量不同。\n\n匿名数组构造器返回一个引用，而不是一个列表。匿名数组构造器的目的是让你能够创建数组对象的引用，而无需创建一个命名数组：\n\
  \n```\n# If you didn't have [], you might try:\n{ my @arr = 0 .. 9; $aref = \\@arr\
  \ }\nprint $$aref[4]; # gives 4\n\n# or perhaps:\nmy $aref = do { \\( my @arr =\
  \ 0 .. 9 ) };\n\n# But you do have []:\nmy $aref = [ 0 .. 9 ];\n```\n\n你可以将由匿名数组构造器创建的数组引用赋值给数组变量，但这可能不是你想要的。注意，数组变量与列表一起使用，标量变量与匿名数组构造器一起使用：\n\
  \n```\n# meant to use parentheses, maybe?\nmy @files = [ glob '*.c' ];\nprint \"\
  @files\\n\"; # something like ARRAY(0xa4600)\n\n# another classic -- yields the\
  \ enigmatic\n# ARRAY(0xa45d0),ARRAY(0xa4654),ARRAY(0xa4558)\nmy @two_d_array = [\
  \ [ 1 .. 3 ], [ 4 .. 6 ], [ 7 .. 9 ] ];\nforeach my $row (@two_d_array) {\n    print\
  \ join( ',', @$row ), \"\\n\";\n}\n```\n\n运算符和函数会创建列表上下文和标量上下文。匿名数组构造器是一个运算符。圆括号不是。仅仅在某个东西周围加上圆括号并不会将标量上下文改变为列表上下文（第\
  \ 12 条）。\n\n你可以自己验证这一点：\n\n```\nsub arrayish { print \"arrayish\\n\" if wantarray\
  \ }\nmy $foo = arrayish();          # nope\nmy $foo = ( arrayish() );      # not\
  \ yet\nmy $foo = ( arrayish(), () );  # dang, it's stubborn\nmy $foo = [ arrayish()\
  \ ];      # score!\nmy ($foo) = arrayish();        # this works too\n```\n\n这只是问题的一部分，如果你错误地将一个本应是列表字面量的东西赋值给标量变量，而不是匿名数组构造器，就会导致这个问题。问题的另一部分是，当你解引用该标量变量时，Perl\
  \ 会取标量中最终得到的任何奇怪的值并解引用它——可能将其解释为软引用。当然，你最终得到的总会是完全无意义的东西，但这两个效应结合起来，可能会让你一开始就遇到一些非常奇怪的行为，从而使调试过程变得困难。例如：\n\
  \n```\n# meant to use brackets this time, I bet\nmy $file_list_ref = ( glob '*.c'\
  \ );\nprint \"@$file_list_ref\\n\"; # prints nothing?\nprint \"$file_list_ref\\\
  n\";  # prints foo.c or something\n```\n\n考虑到所有这些，聪明的读者应该能弄清楚这里发生了什么：\n\n```\nmy\
  \ $aref = ( 1 .. 10 );\nprint $$aref; # prints nothing?\nprint $aref;  # also prints\
  \ nothing?\n```\n\n### 要记住的事项\n\n- 使用匿名数组构造器 `[]` 来创建引用。\n- 记住匿名数组构造器会施加列表上下文。\n\
  \n\n\n\n■ 将列表赋值给数组，但将匿名数组赋值给标量。\n\n下载自 <www.wowebook.com>\n\n## 第 62 条 使用匿名哈希构建\
  \ C 风格结构体\n\n人们经常问 Perl 是否拥有“像 C 语言那样的真实数据结构”。嗯，某种程度上是有的。你已经知道 Perl 只有少数几种数据类型：标量、数组、哈希、子程序，以及一些其他零碎的东西如文件句柄。像\
  \ C 或 Pascal 中使用的结构体并不在这些类型之中。所以从某种意义上说，Perl 没有结构体。但另一方面，哈希提供了非常相似的效果：\n\n```\n\
  $student{'last'} = 'Smith';\n$student{'first'} = 'John';\n$student{'bday'} = '01/08/72';\n\
  ```\n\n当引用哈希元素时，只要键是有效的 Perl 标识符，就可以省略键周围的引号：`$student{last} = 'Smith';`\n\n这看起来有点像结构体的元素，不是吗？\n\
  \n你对此的第一反应可能是：“哎呀！这是用字符串来查找结构体的成员！效率太低了！真正的结构体会使用编译器计算的某种数值偏移。”然而，对于 Perl 来说，这只是不切实际的幻想，你完全不必为此烦恼。Perl\
  \ 是一种解释型语言。无论如何，访问变量以及数组和哈希的元素都是相对较慢的。在整体考量中，查找哈希元素所需的时间微不足道。\n\n你甚至可以将这些“结构体”传递给子程序：\n\
  \n```\nsub student_name {\n    my %student = @_;\n    return \"$student{first} $student{last}\"\
  ;\n}\n\nprint student_name(%student);\n```\n\n这看起来可能有用，但效率并不高。当你将哈希作为参数传递时，实际上是将哈希展开成一个元素列表，然后在子程序内部将这些元素重新读入一个全新的哈希。此外，还存在一些语法限制。你不能轻易地以这种方式传递两个哈希。因为\
  \ Perl 在调用子程序时会将这些哈希展开成一个单一的列表，它不知道如何将列表拆分成两个哈希。在这种情况下，所有的键值对都会被`%roomie1`吃掉：\n\n\
  ```\nsub roommates {\n    my ( %roomie1, %roomie2 ) = @_;\n    ...\n}\n```\n\n因此，虽然哈希在总体思路上是正确的，但它们并不完美。更好的做法是使用哈希的引用，特别是使用匿名哈希构造器来创建它们：\n\
  \n```\nmy $student = {\n    last => 'Smith',\n    first => 'John',\n    bday =>\
  \ '01/08/72'\n};\n```\n\n你也可以创建一个空结构体，然后逐步填充它。使用箭头语法来访问“结构体”的成员，会让事情看起来更像 C 或 C++：\n\
  \n```\n$student = {};\n$student->{last} = 'Smith';\n$student->{first} = 'John';\n\
  $student->{bday} = '01/08/72';\n```\n\n由于你现在操作的是标量，而不是哈希，将它们传递给子程序会更高效，而且一次传递多个也没有问题：\n\
  \n```\nsub roommates {\n    my ( $roomie1, $roomie2 ) = @_;\n    ...\n}\n\nroommates(\
  \ $student1, $student2 );\n```\n\n这种技术是 Perl 在大多数类中构建对象的基础。\n\n下载自 <www.wowebook.com>\n\
  \n### 要记住的事项\n\n- 使用哈希来模拟 C 结构体。\n- 将哈希引用（而非哈希本身）传递给子程序，以避免复制。\n- 将哈希引用传递给子程序，以保留哈希的标识。\n\
  \n## 第 63 条 小心循环数据结构\n\nPerl 目前使用引用计数方法来管理内存。每当一个对象获得一个名称或一个新的引用时，Perl 就会增加该对象的引用计数。每当一个对象失去一个名称或一个引用时，Perl\
  \ 就会减少其引用计数。一旦对象的引用计数降为零，Perl 就会删除该对象并回收其占用的存储空间。\n\n当对象以循环或自引用的方式相互指向时，引用计数就会失效。考虑以下示例：\n\
  \n```\npackage Circular;\n\nsub new {\n    my $class = shift;\n    return bless\
  \ { name => shift }, $class;\n}\n\nsub DESTROY {\n    my $self = shift;\n    print\
  \ \"$self->{name}: nuked\\n\";\n}\n\npackage main;\n\n{\n    my $a = Circular->new('a');\n\
  \    my $b = Circular->new('b');\n    $a->{next} = $b;\n    $b->{next} = $a;\n}\n\
  \nprint \"the end\\n\";\n```\n\n`main`包中的代码块创建了两个属于`Circular`类的对象，每个对象都包含对另一个对象的引用。在代码块结束之前，情况是这样的：`$a`和`$b`。每个对象的引用计数为\
  \ 2：一个来自其名称，另一个来自另一个对象的引用。一旦代码块退出，词法变量`$a`和`$b`就超出了作用域，然后你得到的是：你再也无法访问这些对象，因为它们都没有名称，也没有任何外部引用指向它们。它们只是占用着空间。\n\
  \n不幸的是，Perl 对此无能为力，因为这两个对象的引用计数仍然为 1。这些对象会一直存在，直到整个程序退出。\n\nPerl 最终会销毁这些对象。在执行线程的最后，Perl\
  \ 会进行一次“标记-清除”垃圾回收。这最后一次遍历会销毁解释器创建的所有对象，无论是否可访问。如果你运行上面的示例，你会看到最后一次遍历的效果：\n\n```\n\
  the end\nb: nuked\na: nuked\n```\n\n正如你所料，Perl 在程序正常流程中执行完最后一条语句之后销毁这些对象。\n\n这最后一次遍历很重要。你可以将\
  \ Perl 用作嵌入式语言。如果你在同一进程中重复使用解释器来执行类似上面的代码，如果没有一种可靠的方法来销毁该线程期间创建的所有对象，就会导致内存泄漏。\n\
  \n除了终止执行之外，一旦陷入这种混乱，就没有办法清理，但你可以通过谨慎地使用暴力手段来预防它。你必须实现一种技术来显式地打破循环引用。在前面的例子中，一种可行的解决方案是：\n\
  \n```\npackage main;\n\n{\n    my $a = Circular->new('a');\n    my $b = Circular->new('b');\n\
  \    $a->{next} = $b;\n    $b->{next} = $a;\n    $head = $a;\n}\n\nundef $head->{next};\n\
  undef $head;\n```\n\n这里，我们将一个链接保存到变量`$head`中的循环数据结构中。由于结构中只有一个循环，打破一个链接就足以让 Perl\
  \ 回收其中的所有对象。如果这还不够彻底，你可以自己处理所有链接：\n\n```\nwhile ($head) {\n    my $next = $head->{next};\n\
  \    undef $head->{next};\n    $head = $next;\n}\n\nundef $head;\nprint \"the end\\\
  n\";\n```\n\n这里你遍历结构体并显式销毁每一个麻烦的引用。你销毁的是指向你想要删除的对象的引用，这样它们的引用计数就会降为零。在 Perl 中，无论引用计数如何，都没有办法显式销毁一个对象；如果有，那将是一个可怕的错误和崩溃来源。\n\
  \n另一种方法是分两遍完成工作，方式类似于标记-清除收集器。首先，获取你需要销毁的引用的列表或“目录”：\n\n```\nmy $ptr = $head;\n\
  do {\n    push @refs, \\$head->{next};\n    $head = $head->{next};\n} while ( $ptr\
  \ != $head );\n\n$ptr = $head = undef;\n```\n\n这个循环遍历自引用结构体，并收集所有需要销毁的引用的引用列表。下一遍只需遍历该列表并销毁它们：\n\
  \n```\nforeach (@refs) {\n    print \"preemptive strike on $$_\\n\";\n    undef\
  \ $$_;\n}\n```\n\n\n\n\n对于像这样的简单循环列表，两次遍历的方法有些浪费，但在包含许多循环的图状结构中，这可能是唯一的选择。\n\n###\
  \ 需要记住的事项\n\n- Perl 通过引用计数管理内存。\n- 避免循环引用，因为 Perl 无法回收它们。\n- 如果创建了循环引用，你必须自己打破它们。\n\
  \n## 第 64 条。使用 `map` 和 `grep` 操作复杂数据结构\n\n有时，对多维数组或哈希进行“切片”，或者选择具有特定特征的切片是很有用的。反过来，你可能需要将一组列表组装成二维数组，或者将一组二维数组组装成三维数组。Perl\
  \ 的 `map` 和 `grep` 运算符非常适合这类任务。\n\n### 使用 `map` 进行切片\n\n从一个程序开始，该程序将三维坐标文件读入内存。示例文件包含以下数据：\n\
  \n```\n# point data\n1 2 3\n4 5 6\n9 8 7\n```\n\n下载自 <www.wowebook.com>\n\n222 ❘\
  \ *第 6 章 引用* 该程序将三维坐标文件读入内存。文件的每一行包含一个点的 `x`、`y` 和 `z` 坐标，由空白分隔。例如：\n\n```\nopen\
  \ my ($points), '<', 'points'\n    or die \"couldn't read points data: $!\\n\";\n\
  while (<$points>) {\n    next if /^\\s*#.*$/;   # skip comments\n    push @xyz,\
  \ [split];\n}\n\nforeach my $pt (@xyz) {\n    print \"point \", $i++,\n        \"\
  : x = $pt->[0], y = $pt->[1], \",\n        \"z = $pt->[2]\\n\";\n}\n```\n\n该程序输出：\n\
  \n```\npoint 1: x = 1, y = 2, z = 3\nptg\npoint 2: x = 4, y = 5, z = 6\npoint 3:\
  \ x = 9, y = 8, z = 7\n```\n\n点数据被读入一个如下所示的结构：\n\n```\n@xyz\n  1\n  4\n  2\n  9\n\
  \  5\n  3\n  8\n  6\n  7\n```\n\n现在，假设你只想获取每个点的 `x`（第 0 个）元素，如 PEGS 图中的阴影所示。你可以使用显式索引编写一个循环，或者使用\
  \ C 风格的 for 循环：\n\n```\nfor ( $i = 0 ; $i < @xyz ; $i++ ) {\n    push @x, $xyz[$i][0];\n\
  }\n```\n\n下载自 <www.wowebook.com>\n\n*第 64 条。使用* `map` *和* `grep` *操作复杂数据结构* ❘ 223\n\
  \n但实际上，这是 `map` 的一个自然应用：\n\n```\nmy @x = map { $_->[0] } @xyz;\n```\n\n### 使用 `map`\
  \ 进行嵌套\n\n另一方面，假设你从并行数组 `@x`、`@y` 和 `@z` 开始，它们包含点的向量：\n\n```\n@x   @y   @z\n1  \
  \  2    3\n4    5    6\n9    8    7\n```\n\n现在，你想将它们组装成一个像之前展示的单一三维结构。同样，你可以使用某种显式循环结构，以缓慢而繁琐的方式将\
  \ `@x`、`@y` 和 `@z` 转换为 `@xyz`：\n\n```\nfor ( $i = 0 ; $i < @x ; $i++ ) {\n    $xyz[$i][0]\
  \ = $x[$i];\n    $xyz[$i][1] = $y[$i];\n    $xyz[$i][2] = $z[$i];\n}\n```\n\n然而，`map`\
  \ 提供了一种更优雅的替代方案。在 `map` 内部使用 `[]` 来创建更深层次的嵌套结构：\n\n```\nmy @xyz = map { [ $x[$_],\
  \ $y[$_], $z[$_] ] } 0 .. $#x;\n```\n\n你无疑可以想象出切片和嵌套主题的多种变体。例如，交换 `x`（第 0 个）和 `y`（第\
  \ 1 个）坐标：\n\n```\nmy @yxz = map { [ $_->[1], $_->[0], $_[2] ] } @xyz;\n```\n\n你可以使用切片来重新排列元素，这样做看起来更美观：\n\
  \n```\nmy @yxz = map {\n    [ @$_[ 1, 0, 2 ] ]\n} @xyz;\n```\n\n下载自 <www.wowebook.com>\n\
  \n224 ❘ *第 6 章 引用* 数据看起来与单独的数组大不相同：\n\n```\n@yxz\n  4\n  1\n  5\n  9\n  2\n  6\n\
  \  8\n  3\n  7\n```\n\n或者，也许你创建一个包含点模长的新列表：\n\n```\nmy @mag = map {\n    sqrt( $_->[0]\
  \ * $_->[0] +\n          $_->[1] * $_->[1] +\n          $_->[2] * $_->[2] )\n} @xyz;\n\
  ```\n\n施瓦茨变换（第 22 条）是一个同时使用 `map` 的切片和嵌套操作的应用：\n\n```\nmy @sorted_by_mtime =\n \
  \   map { $_->[0] }               # slice\n    sort { $a->[1] <=> $b->[1] }\n  \
  \  map { [ $_, -M $_ ] }         # nest\n    @files;\n```\n\n### 使用 `grep` 进行选择\n\
  \n假设你想过滤 `@xyz`，使其只包含 `y` 坐标大于 `x` 坐标的点。你可以编写一个循环（你猜我们接下来会这么说吗？）：\n\n```\nforeach\
  \ $pt (@xyz) {\n    if ( $pt->[1] > $pt->[0] ) {\n        push @y_gt_x, $pt;\n \
  \   }\n}\n```\n\n下载自 <www.wowebook.com>\n\n*第 64 条。使用* `map` *和* `grep` *操作复杂数据结构*\
  \ ❘ 225\n\n但这次，你有一个非常适合 `grep` 的任务：\n\n```\nmy @y_gt_x = grep { $_->[1] > $_->[0]\
  \ } @xyz;\n```\n\n当然，你可以组合使用 `map` 和 `grep`——例如，收集 `y` 大于 `x` 的点的 `x` 坐标：\n\n```\n\
  my @x = map { $_->[0] }\n        grep { $_->[1] > $_->[0] } @xyz;\n```\n\n```\n\
  my @x = map { $_->[0] > $_->[1] ? ( $_->[0] ) : () } @xyz;\n```\n\n### 需要记住的事项\n\
  \n- 使用 `map` 将数据结构的元素转换为新结构。\n- 使用 `grep` 从复杂数据结构中选择元素。\n- 将 `map` 和 `grep` 结合使用以进行复杂操作。\n\
  \nptg\n\n下载自 <www.wowebook.com>\n\n## 7 ❘ CPAN\n\n综合 Perl 存档网络（CPAN）是一个包含所有 Perl\
  \ 相关内容的仓库，包括 Perl 源代码、Perl 库和模块以及 Perl 应用程序。Perl 程序员的能力很大程度上取决于他们有效使用 CPAN 的能力。在撰写本文时，CPAN\
  \ 已超过 6 GB，包含来自 7,758 位作者的 16,835 个模块。\n\n1993 年，Tim Bunce、Jarkko Hietaniemi 和 Andreas\
  \ König 组织了 *perl-packrats* 邮件列表。Larry Wall 正在开发 Perl 5，这是 Perl 的一次重大升级，允许人们通过模块扩展语言。随着\
  \ Perl 越来越流行，人们创建了非常有用的库，但没有正式的分发方式。如果你知道某个库并且能在作者的网站上找到它，你可以自己下载。如果该库需要另一个库，你必须去找到那个库，依此类推，直到安装完所有内容。\n\
  \n1995 年，Jarkko 建立了一个 FTP 仓库（ftp://ftp.cpan.org/pub/CPAN）来收集所有散落的 Perl 内容，以便人们可以在一个地方获取所有内容。\n\
  \n大约在同一时间，Andreas König 建立了 PAUSE（Perl 作者上传服务器）来管理模块。人们将他们的作品上传到 PAUSE，PAUSE 根据找到的内容创建一些索引，然后主\
  \ CPAN 站点镜像 PAUSE 以添加 `modules/` 和 `authors/` 目录。尽管 `authors/` 目录占据了 CPAN 的大部分（按大小和关注度而言），但它并不是\
  \ CPAN 的全部，CPAN 确实旨在做到全面。\n\n有一组服务器直接从 CPAN 主服务器进行镜像。主服务器与 PAUSE 同步，然后公共镜像与主服务器同步。这只是一个大型仓库，被复制到全球数百台服务器上。CPAN\
  \ 本身并不为你做其他任何事情。\n\n然而，在此基础上还有 CPAN 工具链，这是大多数人体验 CPAN 的方式。你可能已经使用过 `CPAN.pm` 或 `CPANPLUS`，它们都知道如何读取\
  \ PAUSE 索引文件、连接到 CPAN 服务器并为你下载和安装发行版。\n\n227\n\n下载自 <www.wowebook.com>\n\n228 ❘\
  \ *第 7 章 CPAN*\n\n多年来，“CPAN”一词已经具有多种含义。它就像 Perl 语法中的花括号一样被过度加载。有些人认为 CPAN 是一个网站，比如\
  \ Graham Barr 的 CPAN 搜索（http://search.cpan.org/）或 Randy Kobes 的（http://kobesearch.cpan.org/）。这些网站提供了\
  \ CPAN 仓库的接口，但增加了许多展示内容，例如来自 CPAN 测试者（http://testers.cpan.org/）、CPAN 评级（http://cpanratings.perl.org/）、CPAN\
  \ RT 问题跟踪器（http://rt.cpan.org/）等信息。\n\n## 第 65 条。在没有管理员权限的情况下安装 CPAN 模块。\n\n如果你能创建文件，你就可以安装模块。“但是，但是，但是……”你说。不，如果你能创建文件，你就可以安装模块。你甚至可以在没有特殊权限的情况下安装\
  \ Perl 本身（第 110 条）。这并不是说你不会受到某种限制性社交环境的约束，但这不是技术能解决的问题。\n\n\n\n\n\n## 第 65 条 在没有管理员权限的情况下安装\
  \ CPAN 模块\n\nPerl 模块并没有什么特别之处。它们只是文件，你可以告诉 Perl 去哪里找到你的模块。你只需要知道如何把它们放到那里。\n\n首先，你必须选择存放它们的位置。如果仅供自己使用，你可以把它们放在主目录下的`lib`目录中；这是一个不错的选择。假设你的主目录是`/Users/snuffy`，本条后续内容均以此为例。\n\
  \n### 手动操作\n\n每个人都应该至少手动安装一次发行版，这样才能体会到 CPAN 工具节省时间的奇迹。你可能会在过程中途放弃，但这已经足够了。\n\n\
  假设你已经下载并解压了一个发行版，并且进入了该发行版目录，准备开始操作。你需要运行正确的构建脚本来安装模块。\n\n对于基于`MakeMaker`的发行版，使用`INSTALL_BASE`：\n\
  \n```\n% perl Makefile.PL INSTALL_BASE=/Users/snuffy\n% make test install\n```\n\
  \n对于基于`Module::Build`的发行版，使用`--install_base`：\n\n```\n% perl Build.PL --install_base\
  \ /Users/snuffy\n% ./Build test\n% ./Build install\n```\n\n无论使用哪种方式，最终都会在`/Users/snuffy/lib`下生成一些目录，这只是基础目录。你的模块最终会放在类似`/Users/snuffy/lib/perl5`的位置；你需要将这个目录添加到模块搜索路径中（参见第\
  \ 69 条）。你可能还会看到`/Users/snuffy/bin`和`/Users/snuffy/man`等目录。\n\n### 配置 CPAN.pm\n\n\
  将模块安装到指定位置的最简单方法是直接告诉`CPAN.pm`你想把它们放在哪里。\n\n你可以设置`CPAN.pm`传递给`ExtUtils::MakeMaker`和`Module::Build`的选项。通过不带参数调用`cpan`工具，可以启动`CPAN.pm`的\
  \ shell。较早版本的`CPAN.pm`需要你显式提交更改，因此你可能需要显式提交：\n\n```\n% cpan\ncpan> o conf makepl_arg\
  \ INSTALL_BASE=/Users/snuffy\ncpan> o conf mbuild_arg --install_base /Users/snuffy\n\
  cpan> o conf commit\n```\n\n在匆忙安装模块之前，请检查你的配置是否已保存。再次启动 shell 并检查刚刚设置的值，以确保无误：\n\
  \n```\n% cpan\ncpan[1]> o conf makepl_arg\nmakepl_arg [INSTALL_BASE=/Users/snuffy]\n\
  ```\n\n如果你更愿意手动编辑文件，可以查找`CPAN::Config`或`CPAN::MyConfig`模块。\n\n一旦在工具中设置好所有内容，只需安装模块即可：\n\
  \n```\n% cpan Set::CrossProduct IO::Interactive Getopt::Whatever\n```\n\n### 配置\
  \ CPANPLUS\n\n如果你喜欢使用另一个发行版安装工具`CPANPLUS`，可以编辑`$HOME/.cpanplus/lib/CPANPLUS/Config/User.pm`，其中包含你的用户设置。你也可以通过其\
  \ shell 配置界面，输入之前为`CPAN.pm`设置的相同值。选择“设置安装程序设置”：\n\n```\n% cpanp\nCPAN Terminal>\
  \ s reconfigure\n=================> 主菜单 <=================\n欢迎来到 CPANPLUS 配置。请选择你要配置的部分。\n\
  默认值取自你当前的配置。\n如果现在保存，你的设置将写入：CPANPLUS::Config::User\n1> 选择配置文件\n2> 设置 CLI 程序\n3>\
  \ 设置 CPANPLUS 主目录\n4> 设置 FTP/电子邮件设置\n5> 设置基本偏好\n6> 设置安装程序设置\n要配置的部分：[1]: 6\n```\n\
  \n进入该界面后，按照提示操作即可。设置完成后，正常安装模块：\n\n```\n% cpanp i XML::Twig\n```\n\n### 使用 local::lib\n\
  \n`local::lib`模块可以帮你省去一些猜测工作。默认情况下，它会在你的主目录下设置模块目录。只需加载它，就能在主目录下建立一个模块目录：\n\n```\n\
  % perl -MCPAN -Mlocal::lib \\\n   -e 'CPAN::install(Net::MAC::Vendor)'\n```\n\n\
  `CPAN.pm`会将`Net::MAC::Vendor`模块安装到`~/perl5/lib/perl5`。\n\n不过，你不需要知道`local::lib`把它放在了哪里，因为当你在程序中使用`local::lib`模块时，它会自动将正确的目录添加到`@INC`中：\n\
  \n```perl\n#!/usr/bin/perl\nuse local::lib;\nuse Net::MAC::Vendor;\n```\n\n如果你真的想查看所有细节，可以单独加载`local::lib`。这样做时，它会打印出它的设置：\n\
  \n```\n% perl -Mlocal::lib\nexport MODULEBUILDRC=\"/Users/snuffy/perl5/.modulebuildrc\"\
  \nexport PERL_MM_OPT=\"INSTALL_BASE=/Users/snuffy/perl5\"\nexport PERL5LIB=\"/Users/snuffy/perl5/lib/perl5:/Users/snuffy/perl5/lib/perl5/darwin-2level:$PERL5LIB\"\
  \nexport PATH=\"/Users/snuffy/perl5/bin:$PATH\"\n```\n\n`local::lib`模块还允许你显式指定自己的目录。详情请参阅其文档。\n\
  \n### 需要记住的要点\n\n- 即使没有管理员权限，也可以安装 Perl 模块。\n- 使用`lib`或`local::lib`模块告诉 Perl 你的模块在哪里。\n\
  - 配置`cpan`或`cpanp`，将模块安装到自定义位置。\n\n## 第 66 条 随身携带一个 CPAN\n\n你不需要连接网络就能享受 CPAN 的好处。即使你正在飞越海洋的飞机上、身处沙漠中央，甚至是在\
  \ Wi-Fi 故障的会议上，你也可以从 CPAN 安装模块。\n\n仓库已经变得相当庞大。它自 1994 年左右就存在了，而且增长速度并未放缓。在撰写本文时，整个\
  \ CPAN 的大小接近 7 GB。你甚至无法再将其放入一张 DVD 中。\n\n然而，CPAN 中可直接使用的部分要小得多。通过工具链，你只处理任何模块的最新版本。当你移除所有旧版本时，大小会降至约\
  \ 1 GB。这个大小也在增长，表明即使是 CPAN 的最前沿也在不断变大。\n\n### 设置 MiniCPAN\n\n`CPAN::Mini`模块提供了`minicpan`程序，它会将模块的最新版本复制到你的本地计算机。你可以从命令行调用它，使用你在`http://mirrors.cpan.org/`找到的镜像之一：\n\
  \n```\n% minicpan -l /MiniCPAN -r http://cpan.example.com\n```\n\n当然，`/MiniCPAN`不必永久保存在你的本地计算机上。你可以将其镜像到外部设备（如\
  \ U 盘），这样无论走到哪里，你都可以随身携带一个 CPAN。\n\n手动运行`minicpan`很容易。但更有用的是持续更新的 MiniCPAN。将该命令添加到你的`crontab`（或任何在你的系统上定期运行程序的工具）中。\n\
  \n你也可以在`minicpan`配置文件中设置选项。在你的主目录中放置一个`.minicpanrc`文件：\n\n```\n# ~/.minicpanrc\n\
  local: /MiniCPAN\nremote: http://cpan.example.com\n```\n\n你也不必只下载所有内容的最新版本。如果`minicpan`工具对你来说不够灵活，你可以使用`CPAN::Mini`编写自己的脚本。例如，你可能不需要完整的\
  \ MiniCPAN，因此你可以使用`path_filters`或`module_filters`来过滤镜像的内容。两者都告诉`CPAN::Mini`它可以跳过哪些内容：\n\
  \n```perl\nuse CPAN::Mini;\nCPAN::Mini->update_mirror(\n    remote => \"http://cpan.example.com\"\
  ,\n    local => \"/MiniCPAN\",\n    # 跳过路径匹配正则表达式或子例程返回真值的路径\n    # 路径格式如 B/BD/BDFOY/Mac-iTunes-1.23.tar.gz\n\
  \    path_filters =>\n        [ qr/BDFOY/, sub { $_[0] =~ /JMCADA/ } ],\n    # 跳过匹配正则表达式的模块：\n\
  \    module_filters => [qr/Acme/i],\n);\n```\n\n### 使用你的 MiniCPAN\n\n现在你已经设置好了 MiniCPAN，需要告诉你的工具在哪里找到它。对于`CPAN.pm`，你需要设置`urllist`配置。使用`cpan`启动\
  \ shell 进行配置：\n\n```\n% cpan\ncpan[1]> o conf urllist push file:///MiniCPAN\n请使用\
  \ 'o conf commit' 使配置永久生效！\ncpan[2]> o conf commit\ncpan[3]> o conf urllist\nurllist\n\
  0 [file:///MiniCPAN]\n```\n\n\n\n\n\n在 `CPANPLUS` 中，启动 shell，然后按照 `s reconfigure`\
  \ 的指示操作：\n\n```\n% cpanp\nCPAN Terminal> s reconfigure\n```\n\n按照菜单选择“选择主机”选项，然后选择“自定义”选项。\n\
  \n一旦你设置好喜欢的工具，它应该直接从你的 `MiniCPAN` 中获取内容，而不是从公共仓库中获取。\n\n### 注入你自己的模块\n\n`MiniCPAN`\
  \ 的另一个强大功能是，你可以将自己的非公开模块注入到 `MiniCPAN` 中，并使用标准的 CPAN 工具安装它们。你将使用 `CPAN::Mini::Inject`\
  \ 进行注入。\n\n首先要做的是为 `CPAN::Mini::Inject` 创建一个配置文件。这个文件与你为 `CPAN::Mini` 创建的文件类似，只是它位于\
  \ `$HOME/.mcpani/config`。一个示例文件可能如下所示：\n\n```\nlocal: /Users/clara/cpan\nremote:\
  \ ftp://ftp.cpan.org/pub/CPAN\nrepository: /Users/clara/internal-modules\npassive:\
  \ yes\ndirmode: 0755\n```\n\n这里我们告诉 `CPAN::Mini::Inject`，我们希望将 `MiniCPAN` 存储在 `/Users/clara/cpan`，从\
  \ `ftp://ftp.cpan.org/` 镜像公共模块，并将私有模块存储在 `/Users/clara/internal-modules`。\n\n现在你已经有了\
  \ `CPAN::Mini::Inject` 的配置文件，接下来需要构建一个私有模块以安装到你的 `MiniCPAN` 中。假设你已经编写好一个发行版并准备构建，只需让构建工具生成发行版文件即可。如果你使用的是\
  \ `ExtUtils::MakeMaker`：\n\n```\n% make dist\n```\n\n或者使用 `Module::Build`（条目 79）：\n\
  \n```\n% ./Build dist\n```\n\n这些命令会创建一个包含发行版所有文件的 `.tar.gz` 文件。这个文件通常是你上传到 CPAN\
  \ 的文件（条目 70）。\n\n如果你的发行版是 `Foo-Bar`，版本为 `0.01`，那么生成的发行版文件将是 `Foo-Bar-0.01.tar.gz`。知道这一点后，你可以告诉\
  \ `CPAN::Mini::Inject` 将你的模块添加到它已知的模块集合中。如果你不需要太复杂的操作，可以使用随 `CPAN::Mini::Inject`\
  \ 一起安装的 `mcpani` 工具：\n\n```\n% mcpani --add module Foo::Bar \\\n   --authorid JMCADA\
  \ --modversion 0.01 \\\n   --file Foo-Bar-0.01.tar.gz\n```\n\n接下来，你需要告诉 `mcpani`\
  \ 从公共仓库更新镜像，然后注入你的模块。你可以分两步完成：\n\n```\n% mcpani --mirror\n% mcpani --inject\n```\n\
  \n或者一步完成：\n\n```\n% mcpani --update\n```\n\n完成后，你应该拥有一个包含私有模块和所有公共模块的 `MiniCPAN`，可以从中进行安装。\n\
  \n### 需要记住的事项\n\n- 使用 `CPAN::Mini` 维护个人 CPAN 镜像。\n- 配置你的 CPAN 工具，使其指向本地仓库。\n- 使用\
  \ `CPAN::Mini::Inject` 在 `MiniCPAN` 中托管你的私有模块。\n\n## 条目 67. 降低公共代码的风险。\n\n在下载那个\
  \ CPAN 模块之前先想一想！它一开始可能看起来很简单，但你还需要做些什么？是否存在脆弱的依赖关系、不响应的维护者或许多未解决的 bug？使用那个模块会让你陷入什么境地？\n\
  \n建议你*不要*使用 CPAN 模块可能听起来像是异端邪说，但这并不是真正的意思。没有人能替你做出决定，因为他们可能并不完全了解你遇到的问题。你的经济投入可能与别人不同。\n\
  \n为交易员提供实时金融数据与离线分析 Web 服务器流量有着不同的要求，随之而来的是不同的风险承受能力。\n\n一切都是权衡。通过重用别人已经写好的模块，你可以节省开发时间。在许多情况下，原作者对问题进行了深入思考，并实现了健壮的解决方案。然而，这并不意味着当事情出错时，你的老板或客户会免除你的责任。\n\
  \n### 你不需要一辆法拉利去商店\n\n人们通常认为处理日期是一件简单的事情，但有多少人像 Dave Rolsky 对 `DateTime` 那样费尽心思去支持时区、闰秒以及许多其他人甚至不知道的其他维度？在这些情况下，使用\
  \ `DateTime` 可能是一个胜利。\n\n是的，*可能*是。`DateTime` 处理一切，使用它你一定能得到正确的答案，但你真的需要所有这些支持来将纪元时间格式化为\
  \ `YYYYMMDD` 吗？如果你在处理日志文件时需要执行数百万次这个任务呢？你愿意为那些你不会用到的所有功能承担额外的开销吗？也许你愿意，但你是*知道*自己愿意，还是在猜测？\n\
  \n### 你真的需要那个升级吗？\n\nCPAN 模块内部有很多东西，你可能已经体验过安装一个模块时堆积起来的长长的依赖链。你是否曾经手动安装过一个复杂的模块，跟踪每一个需要下载的新依赖？很快就会变得一团糟。\n\
  \nCPAN 有一个突出的设计缺陷：PAUSE 只跟踪模块的最新版本，而该版本号在 CPAN 上的不同发行版之间几乎没有一致性。当你使用 `CPAN.pm` 或\
  \ `CPANPLUS` 升级一个模块时，该工具会识别出模块有依赖关系。它会检查你已经安装的版本以及 CPAN 上的最新版本。即使你从未要求升级依赖项，该工具也可能默默地、未经询问地为你升级。之前稳定的东西可能会因为你没有明确要求安装的东西而损坏。\n\
  \n例如，在 `CGI.pm` 版本 `2.64` 中，Lincoln Stein 将查询参数的默认分隔符从 `&` 改为 `;`。分号是现代的做法，但许多旧代码期望使用\
  \ `&`，因为那是已发布接口的一部分。当应用程序升级到最新的 `CGI.pm` 时，尽管它们不想要（甚至不知道）新功能，但它们还是坏了。\n\n我们并不是告诉你不要升级；只是不要丢掉你的思考帽。你知道存在风险，所以先在开发机器上升级，看看是否有任何东西损坏。\n\
  \n### 基石模块\n\n`Test::More` 和 `ExtUtils::Makemaker` 模块的维护者 Michael Schwern，即使是最微小的错误也可能有效地破坏所有人的\
  \ CPAN（尽管他非常小心地避免这种情况）。大多数现代发行版依赖 `Test::More` 来处理测试套件，但如果 `Test::More` 不能工作，模块就无法通过测试，工具链也不会安装测试失败的模块。\n\
  \n在较小的程度上，你所依赖的其他模块也可能破坏你的应用程序。它们可能引入 bug、稍微改变接口、给出不同的输出，或者做许多其他不同的事情，以至于你的应用程序不再正常工作。这是不可避免的；要么你已经经历过，要么将来会发生。在冒险升级之前考虑这一点，并且不要先升级你的生产机器。\n\
  \n### 先试后买\n\n在将你的项目押注于某个模块之前，先尝试一下以降低风险。\n\nPerl 社区提供了大量关于发行版的额外信息。你不必盲目地投入。\n\n\
  #### 检查 CPAN Testers\n\nCPAN Testers（条目 97）收集所有上传到 CPAN 的发行版的测试报告，并且发行版拥有来自不同系统和\
  \ Perl 版本的数百份测试报告并不罕见。你可以在 `http://testers.cpan.org/` 查看某个发行版，但也可以在 CPAN Search（`http://search.cpan.org/`）的发行版页面上看到报告的摘要。\n\
  \n\n\n\n\n除了依赖信息之外，David Cantrell 还能根据平台和 Perl 版本计算出大多数 CPAN 发行版成功安装的概率。在决定升级或尝试新模块之前，请先查看\
  \ CPANdeps (http://deps.cpantesters.org/)。如果你没有看到绿色框，特别是针对你目标使用的 Perl 版本和操作系统，请谨慎行事。\n\
  \n### 检查谷歌热度\n\n如果你想知道是否还有其他人在使用某个模块，请使用你最喜欢的搜索引擎查找相关信息。这看起来是显而易见的事情，但显然并没有多少人这么做。有邮件列表吗？当人们询问关于模块的问题时，其他人会回答吗？他们回答的速度有多快？是\
  \ 15 分钟内、当天、还是两周后？有多少个回答？有多少不同的人给出了这些回答？\n\n来自多个不同人的快速回答是活力和受欢迎程度的标志。总是同一个人延迟回答可能意味着使用该模块会让你感到孤立无援。\n\
  \n### 将开发环境与生产环境分离\n\n你不应该在生产环境中测试代码，把真实用户当作测试对象。尝试先将升级了模块的代码部署到测试服务器上，这样你可以确保它正常工作且性能可接受。使用虚拟机时，你甚至不需要为此购买新硬件。\n\
  \n### 降低升级频率\n\n你真的需要每天升级模块吗？也许你确实需要最新版本中的某个修复，但每次升级时，你都要花一些时间进行管理。许多升级还要求依赖项更新到你可能并不直接关心的新版本，而这些间接升级有可能引发问题。频繁的升级会占用你处理手头任务的时间。考虑将所有升级安排在同一时间进行，比如每季度一次，这样你可以集中精力进行集成工作。\n\
  \n### 使用 DPAN 管理依赖项\n\n有时 CPAN 对你来说风险太大。如果你想要更多控制权，可以考虑建立一个 DPAN，即（分布式|去中心化|黑暗）Perl\
  \ 归档网络。这是一个私有的类 CPAN 仓库，你的常规 CPAN 工具链可以使用它来代替公共仓库。你决定哪些内容进入你的仓库，以及这些内容使用哪个版本。MyCPAN::App::DPAN\
  \ 可以帮助你进行设置。\n\n### 需要记住的事项\n\n- 记住，公开可用的代码可能存在风险。\n- 在使用模块之前先进行研究。\n- 创建你自己的 CPAN\
  \ 替代品（或“DPAN”）来控制你使用的模块和版本。\n\n![图片 2](img/index-252_1.png)\n\n## 第 68 条。在安装模块之前先进行研究。\n\
  \nCPAN 是一个代码金矿，但就像现实中的金矿一样，你需要筛选大量泥土才能找到好东西。幸运的是，Perl 社区拥有丰富的资源来帮助你找到金子。\n\n###\
  \ CPAN 搜索\n\n开始查找模块或发行版信息的最佳地点是 CPAN 搜索 (http://search.cpan.org/)。找到你感兴趣的模块，然后导航到它的发行版页面。在该页面顶部，你会看到指向社区提供的许多资源的链接，如下图所示。这是开始研究的好地方。\n\
  \n### 错误报告\n\n从 CPAN 搜索的发行版页面，你可以看到一个查看和报告错误的链接，该链接会带你进入 CPAN 模块的请求跟踪器 (RT) 工单系统\
  \ (http://rt.cpan.org/)。你可以看到该发行版有多少未解决的错误，同样重要的是，维护者已经修复了多少错误。这有助于你了解模块的质量，但还有一些问题需要考虑。\n\
  \n例如，如果没有提交错误，这是否意味着代码非常可靠，还是意味着没有人使用该模块？相反，如果有大量错误，是模块不稳定，还是仅仅因为使用的人很多？如果提交了错误但没有回应，这是否意味着模块已被放弃，还是仅仅意味着作者使用了与\
  \ CPAN 请求跟踪器不同的错误跟踪系统？\n\n### CPAN 测试者\n\n发行版页面上的另一个重要链接是 CPAN 测试者（第 97 条）。CPAN\
  \ 测试者是一群敬业的个人，他们在各种平台上对发行版运行自动化测试，然后将这些测试运行的报告发送回给全世界查看。他们提供的信息汇总为三组：通过计数、失败计数和未知状态计数。\n\
  \n不要因为少数失败或未知结果而气馁。测试者在多个平台上运行测试，并且测试的 Perl 版本可能已经过时多年。你正在研究的发行版可能在你不会使用的平台上或多年前已退役的\
  \ Perl 版本上测试失败。点击报告详情和测试矩阵链接，可以深入了解发行版的问题真正出在哪里。\n\n### CPAN 评分\n\n你还会看到该发行版的五星评分系统，如果有人评分，你会看到一些星星被高亮显示。星星越多，模块的评分越高。还有一个链接指向人们为该发行版撰写的任何评论。阅读一些评论样本，看看赞扬或批评是否对你决定是否安装该发行版有影响。\n\
  \n这些评分和评论都是主观的，因此它们不应成为你决定是否使用该发行版的唯一因素；不过，它们对你的研究仍然有用。\n\n### 其他考虑因素\n\n最后一次发布是什么时候？总共发布过多少次？这两个事实可以让你知道模块是否已经过时或被放弃。当然，也有可能模块已经稳定，不需要定期更新。通常会有指向代码源代码控制仓库的链接。在仓库中四处看看，了解该发行版的开发进展如何。你甚至可能成为提交者！\n\
  \n### CPANTS 质量指标\n\nCPAN 测试者还提供了另一个小信息供你在查看发行版时考虑。你可以访问 CPAN 测试服务 (http://cpants.perl.org/)，找到你感兴趣的发行版，并查看该发行版的“质量指标”。有句话说，我们无法判断发行版的真正质量，但我们可以衡量一些接近的东西，就像“质量指标”接近“质量”一样。\n\
  \n质量指标归结为一系列检查项，这些项是 Perl 社区认为判断模块质量的重要因素。例如，发行版是否有测试和文档，是否遵循当前的最佳实践？当然，你可以编写一段完全糟糕的代码，但它仍然能通过质量指标检查。大多数优秀的发行版能通过大部分质量指标检查，这是注重细节的维护者的标志。对于未能通过太多质量指标检查的发行版，要稍微警惕一些。\n\
  \n### 阅读代码\n\nPerl 是一种开源语言。Perl 代码，尤其是 CPAN 上的代码，只是你可以自己阅读的文本。检查一些你即将下载的代码。你应该能够判断开发者是否知道自己在做什么，而且你甚至可能学到一些东西。\n\
  \n在阅读代码时，思考一下理解代码逻辑的难易程度。也许你不理解所有特性，但你能跟上程序流程吗？如果你必须处理那段代码，你会抓狂吗？记住，如果你使用那段代码，你可能不得不处理它的某个错误。\n\
  \n\n\n\n\n### 需要记住的事项\n\n- 在安装并依赖某个发行版之前，先研究模块。\n- 使用不同的数据源来评估 CPAN 发行版。\n- 检查你下载的代码，以了解你将使用的内容。\n\
  \n## 第 69 条 确保 Perl 能找到你的模块\n\nPerl 模块只是 `use` 指令加载到程序中的文件。仅凭模块名称，Perl 如何找到这些文件？\n\
  \n### 包含路径\n\nPerl 会搜索一个**包含路径**，该路径是存储在全局变量 `@INC` 中的目录列表。默认的包含路径在编译 Perl 时内置于\
  \ Perl 可执行文件中。有多种方法可以查看具体的包含路径。\n\n当然，一种方法是编写一个小脚本来打印它。在命令行中，以下命令即可实现：\n\n```\n\
  % perl -e 'print \"include is @INC\\n\"'\n```\n\n另一种更简单的替代方法是使用 `-V` 命令行选项检查 Perl\
  \ 的配置：\n\n```\n% perl -V\nSummary of my perl5 (revision 5 version 10 subversion\
  \ 0) ↵\nconfiguration:\n...等等等等...\nCharacteristics of this binary (from libperl):\n\
  Compile-time options: PERL_DONT_CREATE_GVSV ↵\nPERL_MALLOC_WRAP USE_LARGE_FILES\
  \ USE_PERLIO\nBuilt under darwin\nCompiled at May 8 2009 02:12:43\n%ENV:\nPERL5LIB=\"\
  /usr/local/perls/perl-5.10.0/lib/perl5\"\n@INC:\n/usr/local/perls/perl-5.10.0/lib/perl5/↵\n\
  darwin-2level\n/usr/local/perls/perl-5.10.0/lib/perl5\n/usr/local/perls/perl-5.10.0/lib/5.10.0/↵\n\
  darwin-2leevel\n/usr/local/perls/perl-5.10.0/lib/5.10.0\n/usr/local/perls/perl-5.10.0/lib/site_perl/5.10.0↵\n\
  /darwin-2level\n/usr/local/perls/perl-5.10.0/lib/site_perl/5.10.0\n.\n```\n\n包含路径列出了\
  \ `use` 或 `require` 指令搜索 Perl 模块的目录，或者对于像 `File::Basename` 这样的“嵌套”模块，它列出了各种模块树（如\
  \ `File`）所在的根目录。\n\n### 修改包含路径\n\n如果你的模块安装在内置 `@INC` 列出的目录之外的其他位置，则必须修改包含路径才能让 Perl\
  \ 使用它们。\n\n通常情况下，这种情况不会经常发生。当你构建和安装模块时（无论是通过使用 CPAN 模块，还是手动解压并构建），Perl 的 `ExtUtils::MakeMaker`\
  \ 和 `Module::Build` 模块会自动知道如何将发行版文件放置到你的特定 Perl 安装的正确位置。\n\n如果你不希望模块放在那里，则必须告诉它们将其放在其他地方（第\
  \ 65 条）。\n\n但假设你将一个模块安装在一个奇怪的位置——例如，在目录 `/share/perl` 中。你可能会想直接在程序的源代码中修改包含路径：\n\
  \n```\nunshift @INC, '/share/perl'; # MyModule.pm 所在位置\nuse MyModule; # 错误！\n```\n\
  \n不幸的是，这种简单的方法行不通。`use` 指令是编译时特性，而非运行时特性。当程序中出现 `use Module;` 时，它实际上相当于一个 `require`\
  \ 和一个 `import`：\n\n```\nBEGIN { require 'Module.pm'; Module->import; }\n```\n\n\
  Perl 在编译时而非运行时执行 `BEGIN` 块内的代码。这意味着在运行时对 `@INC` 的修改对 `use` 指令没有影响。\n\n解决这个问题的另一种方法是将对\
  \ `@INC` 的修改放在它自己的 `BEGIN` 块中：\n\n```\nBEGIN {\n    unshift @INC, '/share/perl';\
  \ # MyModule.pm 所在位置\n}\nuse MyModule; # 现在可以了！\n```\n\n现在，包含路径在编译时设置好了，`use` 可以找到该模块。\n\
  \n虽然这是一种可行的策略，但有一种更好的方法来控制包含路径：使用 `lib` 编译指示模块。要将一个或多个目录添加到包含路径的前面，只需将它们作为参数提供给\
  \ `use lib`：\n\n```\nuse lib '/share/perl'; # 添加目录 /share/perl\nuse lib qw( # 添加更多目录\n\
  \    /xtra/perl\n    /xtra/perl5\n);\nuse MyModule; # 现在可以了……\n```\n\n除了提高可读性之外，`use\
  \ lib` 相比显式修改包含路径还有一个优势。`lib` 编译指示还会添加相应的架构特定的自动加载路径（如果该目录存在）。如果你使用自动加载的模块，这可以提高性能。例如，如果机器架构是“sun4-solaris”，那么\
  \ `use lib '/share/perl'` 会添加 `/share/perl/sun4-solaris/auto`（如果该目录存在）。\n\n在某些不适合使用\
  \ `use lib` 的情况下，还有其他控制包含路径的方法。你可以使用 `-I` 命令行选项：\n\n```\n% perl -I/share/perl myscript\n\
  ```\n\n你也可以在 shebang 行中使用 `-I`：\n\n```\n#!/usr/local/bin/perl -I/share/perl\n```\n\
  \n最后，你可以在 `PERL5LIB` 环境变量中放置一个或多个目录名。在类 Unix shell 中，用冒号分隔目录：\n\n```\n% export PERL5LIB=/share/perl:/xtra/perl5\n\
  ```\n\n在 Windows 机器上，用分号分隔目录：\n\n```\n% set %%PERL5LIB%%=C:/libs/perl;C:/libs/perl5\n\
  ```\n\n### 使用 local::lib 创建私有库\n\n许多人在无法将模块安装到标准 Perl 库目录的环境中工作。虽然你可以将模块安装在任何你能创建文件的地方，但你的主目录是一个好地方。只需在命令行中加载\
  \ `local::lib`，它就会告诉你它期望在哪里找到你的模块：\n\n```\n% perl -Mlocal::lib\nexport MODULEBUILDRC=\"\
  /Users/snuffy/perl5/.modulebuildrc\"\nexport PERL_MM_OPT=\"INSTALL_BASE=/Users/snuffy/perl5\"\
  \nexport PERL5LIB=\"/Users/snuffy/perl5/lib/perl5:/Users/snuffy/perl5/lib/perl5/darwin-2level:$PERL5LIB\"\
  \nexport PATH=\"/Users/snuffy/perl5/bin:$PATH\"\n```\n\n注意，`local::lib` 会自动为你添加架构相关的目录。要使用你的本地库目录运行程序，可以在命令行中使用\
  \ `-M` 加载它：\n\n```\n% perl -Mlocal::lib program.pl\n```\n\n你可以在程序中使用 `local::lib`，它会为你添加正确的目录，比\
  \ `lib` 更智能一些：\n\n```\nuse local::lib;\n```\n\n你也可以自动将模块安装到 `local::lib` 目录中（第 65\
  \ 条）。\n\n### 设置相对目录\n\n你可以将应用程序设置为库目录靠近程序文件。你将应用程序和库交给别人，但不知道他们会放在哪里，因此无法提前配置 `@INC`。在这种情况下，你可以使用\
  \ `FindBin` 模块来定位程序路径，然后基于该路径构建模块目录：\n\n```\nuse FindBin;\nuse lib \"$FindBin::Bin/../lib\"\
  ;\n```\n\n### 在编译时配置包含路径\n\n包含路径是在编译 Perl 时内置于 Perl 中的（第 110 条）。通常，它源自运行 `Configure`\
  \ 脚本时指定的安装前缀：\n\n```\n% ./Configure -des -Dprefix=$HOME/localperl\n```\n\n更改安装前缀允许你构建和安装\
  \ Perl 的私有或替代副本，用于测试或调试。\n\n### 需要记住的事项\n\n- 将你的私有模块目录添加到 `@INC`。\n- 使用 `local::lib`\
  \ 在你的主目录中设置模块目录。\n- 使用 `FindBin` 添加相对模块路径。\n\n## 第 70 条 为 CPAN 做贡献\n\nCPAN 似乎已经有一个模块可以完成所有任务，但矛盾的是，它的增长速度比以往任何时候都快。人们不仅会发现新问题或为新库创建接口，有时甚至重新发明的轮子也比旧的好。通过将你的代码提交到\
  \ CPAN，你会得到很多回报。\n\n为 CPAN 做贡献本身就可以写满一整本书，事实上已经有一本：Sam Tregar 的《为 CPAN 编写 Perl 模块》¹，你可以从\
  \ Apress, LLC 免费下载（http://www.apress.com/book/view/159059018X）。\n\n\n\n\n你只需要一点点就能入门，所以我们先给你介绍基础知识。\n\
  \n1. Sam Tregar, *为 CPAN 编写 Perl 模块* (纽约州纽约市: Apress, LLC, 2002)。\n\n下载自 <www.wowebook.com>\n\
  \n## 条目 70. 为 CPAN 做贡献\n\n### 注册 PAUSE\n\nPerl 作者上传服务器（PAUSE，http://pause.perl.org/）是\
  \ CPAN 背后的真正核心。人们将自己的模块和程序上传到 PAUSE，PAUSE 会对这些模块进行索引和归档。然后 CPAN 将这些文件镜像到自己的主服务器。\n\
  \n从 http://pause.perl.org/ 开始。在左侧菜单中，你会看到一个“请求 PAUSE 账户”链接。点击该链接，填写表单，PAUSE 会将请求排队等待管理员审核。每个账户都会由真人检查，大多数账户会在一天内设置完成。如果你没有收到账户激活的通知，请检查\
  \ *modules@perl.org* 的存档（http://www.xray.mpe.mpg.de/mailing-lists/modules/）。搜索你申请的用户名，查看管理员是否对此有任何评论，或者是否看到账户设置邮件。如果你没有收到那封邮件，管理员可以帮你首次访问你的账户。\n\
  \n### 大胆行动\n\nPAUSE 供你上传发行版。它不会评判你工作的质量、实用性或任何其他方面。它只会检查你的命名空间是否与他人使用的冲突，但即便如此，你仍然可以上传：PAUSE\
  \ 只是不会索引冲突的命名空间。\n\nCPAN 特意设计成允许你上传非常早期的代码草稿、实验性脚本以及想法的碎片。它的座右铭可能是“尽早发布，经常发布”。通过尽早让人们访问你的代码，你并没有浪费资源或伤害任何东西。\n\
  \n你上传得越早，就越早可能得到全球其他 Perl 用户的帮助。如果你给模块一个开发版本号（条目 97），你可以看到 CPAN 测试者的结果，而无需 PAUSE\
  \ 将该发行版添加到其索引中。\n\n### HTTP 文件上传\n\n登录 PAUSE 网站，选择“上传文件到 CPAN”菜单项，然后按照表单上的说明操作。\n\
  \n下载自 <www.wowebook.com>\n\n### 匿名 FTP\n\n以匿名用户身份登录 ftp://pause.perl.org/，并将你的归档文件放入\
  \ `incoming/` 目录。完成后，返回 PAUSE 菜单中的“上传文件到 CPAN”项。滚动到页面底部认领你的上传。在你认领之前，你的模块将孤独地被遗忘在\
  \ `incoming/` 中。\n\n### 使用命令行工具\n\n`cpan-upload` 工具和 `Module::Release` 中的发布工具只需几次按键即可处理你的上传，无需你与网站交互。\n\
  \n### 观察测试报告纷至沓来\n\nCPAN 测试者（条目 97）几乎立即就能看到你的新上传。这些分布在世界各地的志愿者使用他们的自动化测试设置来下载你的代码、运行测试，并通常在几小时内将结果发送给你。你可以立即看到你的测试在你没有或可能从未听说过的平台上表现如何。你可以通过设置\
  \ CPAN 测试者偏好（https://prefs.cpantesters.org/）来控制你收到的报告。这就像拥有一个无需付费的 QA 部门。\n\n###\
  \ 讨论你的模块\n\n在开始开发新模块之前，先四处问问。可能 CPAN 中已经隐藏着一个有价值的模块，正好满足你的需求。附录 B 中的一些资源可以帮助你找到可能回答你问题的人。\n\
  \n许多作者喜欢考虑“三天规则”。你今天想到的任何好模块想法，三天后仍然是个好主意。遵循三天规则可以让你在最初兴奋之后有一个冷静期，有些想法看似不错，但可能会让你陷入大量枯燥的工作中。这并不妨碍你为了乐趣而编码，但如果你时间有限，它能帮助你明智地利用时间。\n\
  \n关于新模块的讨论，你希望得到以下几点：\n\n下载自 <www.wowebook.com>\n\n### 我是在浪费时间吗？\n\n时间是你自己的，但你可能对已有的东西感到满意。\n\
  \n### 我的接口是否合适？\n\n在实现你的模块之前，先编写一些示例脚本，就好像它已经存在一样。然而，由于它不存在，你可以选择任何你喜欢的接口。你可能需要哪些方法来处理常见任务？接口是否易于使用、美观，或者与任务可能使用的其他模块一致？\n\
  \n### 谁能帮助我？\n\n你没有理由独自完成所有工作！即使你只是为了乐趣而编码，有时当其他 Perl 用户帮助你实现想法、添加他们自己的想法或宣传你精彩的新创作时，你会获得更多乐趣。\n\
  \n不要因为收到的反馈而过度沮丧。人们往往会根据他们的烦恼程度来回应，所以负面意见有时似乎多于正面意见。不要忽视负面反馈，但你不必听从它（除非是给你发薪水的人，即便如此，你仍然可能说服他们）。许多现在\
  \ CPAN 的中坚力量都是这样开始的。\n\n### 欢迎来到 CPAN\n\n就是这样！你现在是 CPAN 作者社区的一员了。一旦你经历了这个过程，你就不会再像之前不知道它有多简单时那样感到畏惧了。通过帮助别人做你刚刚做过的事情来传递善意。现在你已经上传了第一个发行版，开始思考你的第二个发行版要做什么吧！\n\
  \n### 要记住的事情\n\n- 获取一个免费的 PAUSE 账户，以便上传到 CPAN。\n- 尽早并经常上传到 CPAN，以便人们能够帮助你完成项目。\n\
  - 在命名和编码你的发行版之前，先征求建议。\n\n下载自 <www.wowebook.com>\n\n## 条目 71. 了解常用的模块\n\nPerl 程序员可以使用许多许多不同的模块。各种常见的编程任务已经被封装在可从\
  \ CPAN 免费获得的模块中。可用的模块包括电子邮件、网络新闻、FTP 和 WWW 工具；图形和字符用户界面工具；Perl 语言扩展；以及数据库、文本处理、数学和图像处理工具。这个列表还可以继续列下去——而且相当长！\n\
  \n我们不能告诉你应该使用哪些模块，因为我们不知道你在做什么。以下是一个非常简短的流行模块列表。如果你最喜欢的模块没有出现在列表中，请给我们发个消息，也许我们可以在下一版中加入。\n\
