  \ <www.wowebook.com>\n\n### 要点记忆\n\n- 安装你自己的 `perl`，这样就不会干扰系统 `perl`。\n- 你可以安装多个具有不同配置的\
  \ `perl`。\n- 将你偏好的 Perl 位置添加到你的 `PATH` 中，使其成为默认值。\n\n## 第 111 条 使用 `Perl::Tidy`\
  \ 美化代码\n\n一致的格式是可维护代码的基本属性。代码中可预测且重复的模式使开发者更容易阅读你的程序。你可以使用 `Perl::Tidy` 来为你完成美化工作，而不是自己费力去做。\n\
  \n从一些不太美观的代码开始，将其放入 `ugly.pl`：\n\n```perl\nuse warnings; use strict;\nwhile(<>)\
  \ { if(/\\d/\n) { print \"contains number\\n\"; }\nelse { print \"number-free\\\
  n\" } }\n```\n\n对该文件运行 `perltidy`：\n\nptg\n\n```\n% perltidy ugly.pl\n```\n\n`perltidy`\
  \ 命令将清理后的源代码放入一个同名但附加了 `.tdy` 的文件中。以下是 `ugly.pl.tdy` 中的结果：\n\n```perl\nuse warnings;\n\
  use strict;\nwhile (<>) {\n    if (/\\d/) { print \"contains number\\n\"; }\n  \
  \  else { print \"number-free\\n\" }\n}\n```\n\n`perltidy` 没有覆盖 `ugly.pl` 文件，这是一种保护措施，以免丢失原始程序。虽然\
  \ `perltidy` 不应引入错误，但你不应依赖于此。在删除原始文件之前（或者更好的是，使用源代码控制），请务必对美化后的代码进行编译检查甚至单元测试。\n\
  \n或者，你可以使用 `-b` 选项创建一个包含原始数据的 `.bak` 文件，并直接修改代码文件。使用此选项可以使测试更容易，因为你无需移动文件，但仍应保存原始源代码。\n\
  \nDownload from <www.wowebook.com>\n\n### 配置 `Perl::Tidy`\n\n如果你想更改格式化样式，有大量的命令行选项可用。假设你想缩进四个空格而不是两个，并输出到标准输出而不是\
  \ `.tdy` 文件。使用正确的 `perltidy` 选项，你可以实现这一点：\n\n```\n% perltidy -st -i=4 ugly.pl\n\
  ```\n\n你的 `ugly.pl` 现在略有不同（并显示在你的终端上）：\n\n```perl\nuse warnings;\nuse strict;\n\
  while (<>) {\n    if (/\\d/) { print \"contains number\\n\"; }\n    else { print\
  \ \"number-free\\n\" }\n}\n```\n\n如果你不喜欢那种大括号样式，可以将其更改为你更喜欢的其他样式：\n\n```\n% perltidy\
  \ -st -bl -bli ugly.pl\n```\n\nptg\n\n现在 `while` 的大括号独占一行：\n\n```perl\nuse warnings;\n\
  use strict;\nwhile (<>)\n{\n    if (/\\d/) { print \"contains number\\n\"; }\n \
  \   else { print \"number-free\\n\" }\n}\n```\n\n找到你喜欢的格式后，不必浪费时间在命令行上输入配置选项。将这些选项放入\
  \ `.perltidyrc` 文件中。启动该文件的一个便捷方法是转储所有设置：\n\n```\n% perltidy -st -bl -bli -dump-options\n\
  ```\n\n现在你拥有了该特定调用的所有设置，包括默认设置：\n\n```\n# Final parameter set for this run.\n# See\
  \ utility 'perltidyrc_dump.pl' for nicer formatting.\n--add-newlines\n--add-semicolons\n\
  --add-whitespace\n--backup-file-extension=\"bak\"\n--blanks-before-blocks\n--blanks-before-comments\n\
  --blanks-before-subs\n...\n```\n\n你甚至可以创建一个用于单个项目的配置文件，而不是对所有项目使用相同的配置。使用 `--profile`\
  \ 开关，你可以告诉 `perltidy` 使用哪个配置文件：\n\n```\n% perltidy --profile=projecttidy ugly.pl\n\
  ```\n\n你还可以通过 `PERLTIDY` 环境变量覆盖配置文件的位置，以及创建全局默认配置，将其放在 `/usr/local/etc/perltidyrc`\
  \ 或 `/usr/local/etc/perltidyrc` 中。\n\n如果你不想使用除命令行指定之外的任何配置，请使用 `--noprofile` 选项：\n\
  \nptg\n\n```\n% perltidy --noprofile ugly.pl\n```\n\n### 检查语法\n\n即使代码中存在一些语法错误，`Perl::Tidy`\
  \ 也能工作，但它无法绕过所有错误。如果 `perltidy` 过于混乱，它会创建一个 `.ERR` 文件，列出错误。\n\n\n\n\n\n这里有一段损坏的代码，没有正确引用字符串。这是一个语法错误：\n\
