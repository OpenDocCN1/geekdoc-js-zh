  \n## 第 75 条 将八位字节字符串转换为字符串。\n\n在理想世界中，你的数据总是知道自己的编码，Perl 也能为你搞定。可惜现实并非如此。有人给你一些字节，Perl\
  \ 不知道它应该是什么编码，需要你来弄清楚。不仅如此，你可能会收到指定了编码但实际是错误的数据。最好的建议是确保正确解码所有输入。也就是说，你必须获取八位字节并将其转换为正确的字符串。不要相信任何东西。\n\
  \n### 设置编码\n\nptg\n\n从一串字节开始。例如，下面这一长串十六进制数：\n\n```perl\nmy $hex = '4A2761692070617373C3A9206C27C3'\n\
  \        . 'A974C3A920C3A0205061726973210A';\n( my $bytes = $hex ) =~ s/(..)/chr(hex($1))/eg;\n\
  ```\n\nPerl 不知道这个字符串应该是什么编码。调试时，你可以用 `Devel::Peek` 查看 Perl 对字符串的看法：\n\n```perl\n\
  use Devel::Peek;\nDump($bytes);\n```\n\n输出显示没有特殊的编码知识（不过我们暂时不透露字符串内容）：\n\n```\n\
  SV = PVMG(0x830ce4) at 0x80eb50\nREFCNT = 1\nFLAGS = (PADMY,SMG,POK,pPOK)\nPV =\
  \ 0x228bc0 \"...\\n\"\\0\nCUR = 30\nLEN = 32\n```\n\n在这个例子中，假设你知道这些字节代表一个 UTF-8\
  \ 字符串。有了这个先验知识，你可以使用 `Encode` 将字符串解码为正确的编码（记住，从字节到字符是解码）：\n\n```perl\nuse Encode;\n\
  my $utf8_string = decode_utf8($bytes);\nDump($utf8_string);\n```\n\n现在 `Dump` 显示\
  \ Perl 明确知道编码，你可以看到 UTF-8 标志：\n\n```\nSV = PV(0x801398) at 0x80ea30\nREFCNT = 1\n\
  FLAGS = (PADMY,POK,pPOK,UTF8)\nPV = 0x259a80 \"...\\n\"\\0 [UTF8 \"...!n\"]\nCUR\
  \ = 30\nLEN = 32\n```\n\n`decode_utf8` 实际上是一个便捷子程序，封装了几个步骤。`decode` 子程序使用你指定的编码：\n\
  \n```perl\nuse Encode qw(decode);\ndecode( 'utf8', $bytes );\n```\n\n`decode` 子程序通过一个对象完成实际工作：\n\
  \n```perl\nmy $encoding = 'utf8';\nmy $utf8_string = do {\n    my $obj = find_encoding($encoding);\n\
  \    die qq(encoding \"$encoding\" not found) unless ref $obj;\n    $obj->decode($bytes);\n\
  };\n```\n\n如果你需要解码多个字符串，你可能希望使用对象接口，这样每次调用 `decode` 时就不必重新创建编码对象。\n\n从 <www.wowebook.com>\
  \ 下载\n\n*第 75 条 将八位字节字符串转换为字符串* ❘ **263**\n\n现在你已经解码了输入，可以输出了。不过，你需要在输出句柄上设置正确的编码（第\
  \ 73 条）：\n\n```perl\nbinmode STDOUT, ':utf8';\nprint $utf8_string;\n```\n\n输出显示秘密句子：\n\
