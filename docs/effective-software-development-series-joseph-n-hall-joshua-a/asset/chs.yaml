  \n### seek 和 tell\n\n一旦你有了一个指向字符串的文件句柄，你就可以做所有常规文件句柄能做的事情，包括在这个“虚拟文件”中移动位置。以读取模式打开字符串，移动到某个位置，读取一定数量的字节。\n\
  \n当你处理图像文件或其他二进制（非面向行）格式时，这非常有用：\n\n```\nuse Fcntl qw(:seek); # for the constants\n\
