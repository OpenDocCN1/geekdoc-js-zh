  \ 是一种独特的语言，在许多方面与你可能使用过的其他编程语言截然不同。\n\n流畅性和风格只能通过实践和反思来获得。虽然学习是艰苦的工作，但它也是愉快且有回报的。\n\
  \n## Perl 的世界\n\nPerl 是一种非凡的语言。在我们看来，它是最成功的模块化编程环境。\n\n事实上，Perl 模块是软件世界所见过的、最接近传说中的“软件集成电路”（即软件领域的集成电路，可以在不了解其内部工作原理的情况下用于各种应用的组件）的东西。这有很多原因，其中最重要的一个原因是存在一个集中、协调的模块仓库\
  \ CPAN，它减少了在相互竞争、不兼容的功能实现上浪费的精力。更多资源请参见附录 A。\n\nPerl 拥有一个最小但足够用的模块化和面向对象编程框架。语言中缺乏广泛的访问控制特性，使得可以用自然、简洁的形式编写具有不寻常特性的代码。软件领域似乎有一条自然法则：最有用的特性往往也是最不适合现有框架的特性。Perl\
  \ 对“规则和条例”的骨架式方法有效地颠覆了这一法则。\n\nPerl 提供了出色的跨平台兼容性。它作为 UNIX 上的系统管理工具表现出色，因为它最大程度地隐藏了不同\
  \ UNIX 版本之间的差异。你能编写跨平台的 shell 脚本吗？可以，但极其困难。大多数凡人不应尝试这种事情。你能编写跨平台的 Perl 脚本吗？可以，而且很容易。Perl\
  \ 也能相当好地从其诞生地 UNIX 移植到其他平台，如 Windows、VMS 等。\n\n作为 Perl 程序员，你拥有世界上最好的支持之一。你可以完全访问所有你使用的模块的源代码，以及语言本身的完整源代码。如果逐行检查代码找\
  \ bug 不是你的风格，你可以通过互联网获得每周 7 天、每天 24 小时的在线支持。如果免费支持不适合你，你也可以购买商业支持。\n\n最后，你拥有一种敢于与众不同的语言。Perl\
  \ 是流动的。在其最佳状态下，面对多种可能的解释，Perl 会做你期望的事情（有时被称为`DWIM`，“按我的意思做”）。这或许是一个可怕的想法，但它表明了计算领域的真正进步，超越了单纯的周期、磁盘空间和内存。\n\
  \n## 术语\n\n总的来说，Perl 中使用的术语与描述其他编程语言的术语并没有太大不同。然而，有一些术语的含义略有特殊。此外，随着 Perl 的发展，一些术语已经过时，一些新术语也出现了。\n\
  \n通常，这种语言的名称是 Perl，首字母大写，而 perl 是编译和运行源代码的程序名称。除非我们特指解释器，否则我们默认使用大写版本。\n\nPerl 中的`operator`（运算符）是一种不带括号的语法结构。（当然，运算符的参数可以包含在括号中。）特别是，`list\
  \ operator`（列表运算符）是一个标识符，后跟一个由逗号分隔的元素列表：\n\n```\nprint \"Hello\", chr(44), \" world!\\\
  n\";\n```\n\nPerl 中的`function`（函数）是一个标识符，后跟一对完全包含参数的括号：\n\n```\nprint(\"Hello\"\
  , chr(44), \" world!\\n\");\n```\n\n现在，你可能刚刚注意到列表运算符和函数之间的某种相似性。事实上，在 Perl 中，除了使用的语法之外，它们之间没有区别。当我们提到\
  \ Perl 的内置函数如`print`和`open`时，我们通常使用术语“运算符”，但偶尔也会使用“函数”。在含义上没有特别区别。\n\n用 Perl 编写的子程序的正确称呼就是`subroutine`（子程序）。当然，“函数”、“运算符”甚至“过程”在文学上都是可以接受的替代词。请注意，Perl\
  \ 对“函数”的使用与数学定义不同，一些计算机科学家可能会对 Perl 滥用该术语感到不寒而栗。\n\n所有 Perl 的`method`（方法）实际上都是符合某些约定的子程序。这些约定既不是\
  \ Perl 要求的，也不是 Perl 识别的。然而，使用“调用方法”这样的短语是合适的，因为 Perl 有一种特殊的方法调用语法，用于支持面向对象编程。定义（有些难以捉摸的）区别的一个好方法是：方法是作者希望你通过方法调用语法来调用的子程序。\n\
  \nPerl 的`identifier`（标识符）是一个“C 符号”——一个字母或下划线，后跟一个或多个字母、数字或下划线。标识符用于命名 Perl 变量。Perl\
  \ 变量是标识符与适当标点符号的组合，如`$a`或`&func`。\n\n虽然严格来说并不完全符合 Perl 内部的使用习惯，但我们使用术语`keyword`（关键字）来指代\
  \ Perl 中少数具有独特语法含义的标识符——例如`if`和`while`。其他具有普通函数或运算符语法的标识符，如`print`和`oct`，我们称之为`built-ins`（内置函数）。\n\
  \n`lvalue`（左值，发音为“ell value”）是可以出现在赋值语句左侧的值。这是该术语的惯常含义；然而，在 Perl 中，有一些不寻常的构造充当左值，例如`substr`运算符。\n\
  \n`Localizing`（局部化）一个变量意味着为其创建一个独立的作用域，该作用域一直持续到封闭块或文件的末尾。特殊变量必须使用`local`运算符进行局部化。你可以使用`my`或`local`来局部化普通变量（参见第\
  \ 4 章的第 43 条）。这是 Perl 的一个不幸遗留问题，Larry Wall 希望他曾为`local`使用另一个名称，但生活还要继续。当有区别时，我们会说“用`my`局部化”。\n\
  \n## 符号表示\n\n在本书中，我们使用 Joseph 的 PEGS（Perl 图形结构）符号来表示数据结构。它应该大部分是不言自明的，但这里有一个简要概述。\n\
  \n变量是具有名称的值。名称出现在值的侧向“栅栏”上方。标量值用一个矩形框表示：\n\n```\n$cat\nBuster\n```\n\n数组和列表有类似的图形表示。值显示在一个堆栈中，顶部有一条粗线：\n\
  \n```\n@cats\nBuster\nMimi\nGinger\nElla\n```\n\n哈希用名称堆栈和对应的值堆栈表示：\n\n```\n%microchips\n\
  Mimi    9874\nGinger  5207\nBuster  1435\nElla    3004\n```\n\n引用用点和箭头表示，就像那些古老的\
  \ LISP 图表一样：\n\n```\n$cats\n |\n +----> Mimi\n |      Buster\n |      Ginger\n |\
  \      Ella\n```\n\n以上就是基础内容。\n\n## Perl 风格\n\n你应该从本书中学到的部分内容是对良好 Perl 风格的感知。\n\n\
  \n\n\n\n# 引言\n\n当然，风格是一个偏好和争论的问题。我们不会假装知道或展示“唯一正确的风格”，但我们希望向读者展示一种当代、高效、有效的 Perl\
  \ 风格示例。有时，当有助于可读性时，我们的风格会不一致。我们的偏好大多来自 `perlstyle` 文档。\n\n代码出现在书中这一事实在一定程度上影响了它的风格。我们的行长度有限，而且我们不想编写跨越几页的过长程序。我们的示例不能过于冗长或无聊——每个示例必须针对一两个特定点，且没有不必要的杂乱。因此，你会发现一些偏离良好实践的地方。\n\
  \n在某些示例中，我们希望突出某些点，而淡化其他点。在某些代码中，我们使用 `...` 来代表我们省略的代码。\n\n假设 `...` 代表应该存在的真实代码。（奇怪的是，当这本书上架时，那个\
  \ `...` 也应该是可编译的 Perl。Perl 5.12 引入了“yadda yadda”运算符，它编译得很好，但当你尝试执行它时会产生运行时错误。这是一种很好的存根代码的方式。）\n\
