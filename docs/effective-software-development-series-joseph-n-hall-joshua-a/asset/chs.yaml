  \n- 将程序创建为 modulino，以便于测试和子类化。\n- 分块测试你的应用程序。\n- 创建小的子类来覆盖功能。\n\n**条目 92. 模拟对象和接口以聚焦测试。**\n\
  \nptg\n\n有时你想测试代码的一小部分，而不处理围绕它的其余逻辑和数据。对于这些情况，通常可以模拟（mock）或伪造（fake）代码的某些部分，以便专注于你正在测试的功能，而不是导致该功能的每个功能。\n\
  \n例如，假设你正在测试对数字列表求和的代码。在实际代码中，这些数字来自数据库查询：\n\n```perl\npackage MySum;\n\nuse DBI;\n\
  \nsub sum_values_per_key {\n    my ( $class, $dsn, $user, $password, $parameters\
