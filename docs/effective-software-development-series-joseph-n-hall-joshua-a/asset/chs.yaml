  \ {\nchomp;\nmy ( $key, $value ) = split;\n$lookup{$key} = $value;\n}\n```\n\nptg\n\
  \n```\nreturn \\%lookup;\n}\n```\n\n构建查找表可能代价高昂，因此应尽量减少构建次数。如果可能，预先构建好查找 DBM 文件，并在运行时直接加载。一旦拥有它，就不应再重新构建。\n\
  \n你甚至可以在多个程序之间共享它。\n\n`SDBM_File` 是 DBM 的 Perl 实现，但扩展性不佳。如果你的系统上有 `NDBM_File` 或\
  \ `GDBM_File`，请优先选择它们。\n\n## 像读取数组一样读取文件\n\n\n\n\n\n如果通过哈希进行键查找不够灵活，你可以使用 `Tie::File`\
  \ 将文件的行视为数组，即使这些行并不在内存中。你可以像操作普通数组一样浏览文件，随时访问文件中的任意一行，就像下面这个随机格言打印程序一样：\n\n下载自 <www.wowebook.com>\n\
  \n```\nuse Tie::File;\n\ntie my @fortunes, 'Tie::File', $fortune_file\n    or die\
  \ \"Unable to tie $fortune_file\";\n\nforeach ( 1 .. 10 ) {\n    print $fortunes[\
  \ rand @fortunes ];\n}\n```\n\n## 使用临时文件和目录\n\n如果这些现成的解决方案不适用，你也可以自己编写临时文件。`File::Temp`\
  \ 模块能自动创建唯一的临时文件名，并在使用完毕后清理文件，这非常方便。当你需要完整创建一个新版本的文件，但只在创建完成后才替换原文件时，它尤其有用：\n\n\
  ```\nuse File::Temp qw(tempfile);\n\nmy ( $fh, $file_name ) = tempfile();\n\nwhile\
  \ (<>) {\n    print {$fh} uc $_;\n}\n\n$fh->close;\nrename $file_name => $final_name;\n\
  ```\n\n`File::Temp` 甚至可以创建临时目录，用于存储多个文件。你可以抓取多个网页并保存起来供后续处理：\n\n```\nuse File::Temp\
  \ qw(tempdir);\nuse File::Spec::Functions;\nuse LWP::Simple qw(getstore);\n\nmy\
  \ ($temp_dir) = tempdir( CLEANUP => 1 );\n\nmy %searches = (\n    google    => 'http://www.google.com/#hl=en&q=perl',\n\
  \    yahoo     => 'http://search.yahoo.com/search?p=perl',\n    microsoft => 'http://www.bing.com/search?q=perl',\n\
  );\n\nforeach my $search ( keys %searches ) {\n    getstore( $searches{$search},\n\
  \        catfile( $temp_dir, $search ) );\n}\n```\n\n使用 `File::Temp` 时有一个注意事项：它默认以二进制模式打开文件。如果你需要行结束符转换或不同的编码（参见第\
  \ 73 条），则必须自行对文件句柄使用 `binmode`。\n\n### 要点回顾\n\n- 将大型哈希存储在磁盘的 DBM 文件中以节省内存。\n- 使用\
  \ `Tie::File` 将文件视为数组。\n- 使用 `File::Temp` 创建临时文件和目录。\n\n下载自 <www.wowebook.com>\n\
  \n# 引用\n\n学习引用是 Perl 中一项重要的进阶仪式。引用自 Perl 5 引入，为复杂数据结构和面向对象编程开辟了道路。引用是组织数据并将其作为整体传递的关键。如果你想在\
  \ Perl 中更上一层楼，就必须掌握引用。\n\n虽然本章会展示一些引用技巧，但最大的收益来自于你有效创建和操作数据结构的能力。这些技能需要通过实践来培养，所以不要害怕开始使用它们。\n\
  \n## 第 58 条 理解引用及其语法\n\n引用是一种标量值。你可以将引用存储在标量变量中，或作为数组或哈希的元素，就像处理数字和字符串一样。\n\n你可以将引用视为指向\
  \ Perl 中其他对象的“指针”。引用可以指向任何类型的对象，包括其他标量（甚至引用）、数组、哈希、子程序和类型团。\n\n然而，除了类似指针的行为外，引用与\
  \ C 或 C++ 中的指针并没有太多共同之处。你只能创建指向现有对象的引用；之后无法修改它们，例如让它们指向数组的下一个元素。\n\n你可以将引用转换为字符串或数字，但\
  \ Perl 没有内置的方法将字符串或数字转换回引用。\n\n尽管引用在语法上与其他标量值一样，但引用“知道”它指向的对象类型。最后，每个指向 Perl 对象的引用都会增加该对象的引用计数，防止该对象被\
  \ Perl 的垃圾回收器回收。\n\n下载自 <www.wowebook.com>\n\n### 创建引用\n\n你可以通过多种方式创建引用。最简单的方法是在变量上使用反斜线运算符（或“取引用”运算符）：\n\
  \n```\nmy $a = 3.1416;\nmy $scalar_ref = \\$a;\n```\n\n反斜线运算符会创建一个指向其参数值的引用。在 PEGS\
  \ 表示法中，看起来像这样：\n\n```\n$a\n3.1416\n```\n\n反斜线运算符适用于任何类型的变量名：\n\n```\nmy $array_ref\
  \ = \\@a;\nmy $hash_ref  = \\%a;\nmy $sub_ref   = \\&a;\nmy $glob_ref  = \\*a;\n\
  ```\n\n它也适用于数组和哈希元素：\n\n```\n$array_elem_ref = \\$a[0];\n$hash_elem_ref  = \\$a{'hello'};\n\
  ```\n\n它甚至适用于字面值，不过指向字面值的引用是只读的：\n\n```\n$one_ref  = \\1;\n$mode_ref = \\oct('0755');\n\
  ```\n\n反斜线在值列表上的行为非常奇怪，它会返回一个引用列表，而不是指向列表的引用。它使用一种看似任意的启发式规则来决定返回哪些引用。\n\n以这个 `val`\
  \ 子程序为例：\n\n```\nsub val { return 1 .. 3 }\n```\n\n当你使用 & 符号创建引用时，你会得到一个指向 `val`\
  \ 子程序本身的 `CODE` 引用：\n\n```\nmy $ref1 = \\(&val);\n```\n\n如果你在调用 `val` 之后创建引用，你会得到一个\
  \ `SCALAR` 引用：\n\n```\nmy $ref2 = \\( val() );\n```\n\n由于这个特定语句在标量上下文中进行赋值，因此引用指向\
  \ `val` 返回的最后一个值，即 `3`。\n\n如果将赋值改为列表上下文，你会得到一个指向 `val` 返回的第一个值的 `SCALAR` 引用，即 `1`：\n\
  \n```\nmy ($ref3) = \\( val() );\n```\n\n你可能会认为从子程序返回的列表中获取引用的行为也适用于字面列表——确实如此。以下两种情况都返回指向值\
  \ `3` 的标量引用：\n\n```\nmy $ref4 = \\( 1 .. 3 );\nmy $ref5 = \\( 1, 2, 3 );\n```\n\n\
  引用和引用语法可能会变得有点复杂，所以即使你理解其中的原理，下一个需要维护你代码的人很可能不理解，因此请尽量保持清晰。\n\n匿名数组构造器看起来像普通列表，但内容用方括号而不是圆括号括起来，它会在内存中创建一个未命名的数组并返回一个指向它的引用。这是创建指向项目列表的引用的惯用方法。\n\
  \n```\nmy $a_ref = [ 1 .. 3 ];\n```\n\n现在 `$a_ref` 是一个指向未命名数组的 `ARRAY` 引用，该数组包含值\
  \ `1`、`2` 和 `3`：\n\n```\nprint ref $a_ref, \" @$a_ref\";\n```\n\n```\n$a_ref\n1\n\
  2\n3\n```\n\n匿名哈希构造器使用花括号而不是方括号，工作方式类似：\n\n```\nmy $h_ref = { anonymous => 'user'\
  \ };\n$h_ref->{'joe'}  = 'bloe';\n$h_ref->{'john'} = 'public';\n```\n\n```\n$h_ref\n\
  john\npublic\njoe\nbloe\nanonymous\nuser\n```\n\n没有名称的子程序定义会返回一个指向匿名子程序的引用。指向子程序的引用有时被称为\
  \ **coderef**。这里你将一个 coderef 存储在 `$greetings` 中，然后执行引用的代码：\n\n```\nmy $greetings\
  \ = sub { print \"hello, world!\\n\" };\n$greetings->();\n```\n\n这种创建子程序的方式常用于信号处理，例如这个中断处理程序：\n\
  \n```\n$SIG{INTR} = sub { print \"not yet--I'm busy\\n\" };\n```\n\n指向匿名子程序的引用非常有用（参见第\
  \ 50 条）。它们有点像 C 中的函数指针。不过，由于匿名子程序是动态创建而非静态的，它们具有一些更像 LISP 的特性。\n\n当需要传递大型字符串时，指向标量的引用可以非常高效。在下一个例子中，第一次调用\
  \ `some_sub()` 会复制 `$string` 的全部内容，而第二次调用只复制指向该字符串的引用：\n\n```\nmy $string = 'a'\
  \ x 1_000_000;\nsome_sub($string);\nsome_sub( \\$string );\n```\n\n这是通过“自动活体化”（autovivification）实现的，稍后在本条目中讨论。\n\
  \n下载自 <www.wowebook.com>\n\n\n\n\n\n## 第 58 条 理解引用和引用语法\n\n### 使用引用\n\n### 解引用\n\
  \n`解引用`使用引用指向的值。解引用语法有几种不同的形式。\n\n解引用语法的规范形式是，在原本可以使用变量或子程序标识符的位置，使用一个返回引用的块。使用标识符会得到该名称变量的值，而使用返回引用的块则会得到引用指向的值。\n\
  \n在下面的例子中，你有一个普通标量 `$a`，然后创建了一个指向该标量的引用 `$s_ref`。你可以像处理任何普通标量值一样处理这个引用：\n\n```\n\
  my $a = 1;\nmy $s_ref = \\$a;\nprint ${$s_ref};\n${$s_ref} += 1;\n```\n\n数组引用的工作方式类似。这里有一个数组\
  \ `@a`，并创建了指向它的引用 `$a_ref`。两者向 `print` 提供相同的数据。\n\n对其中任一所做的修改，在访问数组或数组引用时都能看到。\n\
  \n```\nmy @a = 1 .. 5;\nmy $a_ref = \\@a;\nprint \"@a\";\nprint \"@{$a_ref}\";\n\
  push @{$a_ref}, 6 .. 10;\n```\n\n块内的代码可以任意复杂，只要最后一个表达式求值的结果是一个引用即可。在这个刻意构造的例子中，根据变量\
  \ `$hi` 的值，你从两个不同数组之一返回第三个值：\n\n```\nmy $ref1 = [ 1 .. 5 ];\nmy $ref2 = [ 6 .. 10\
  \ ];\nmy $val = ${\n    if ($hi) { $ref2; }\n    else { $ref1 }\n}[2];\nprint $val;\
  \   # 要么是 3，要么是 8\n```\n\n如果引用值存储在一个标量变量中，你可以省略花括号，直接使用标量变量的名称（前面加上 `$`）。如果它是一个指向引用的引用，你可以使用多个\
  \ `$`。这个例子使用一个指向标量的引用和一个指向引用的引用，两次打印单词 `testing`：\n\n```\nmy $a = 'testing';\nmy\
  \ $s_ref = \\$a;\nmy $s_ref_ref = \\$s_ref;\nprint \"$$s_ref $$$s_ref_ref\";\n```\n\
  \n这同样适用于哈希引用：\n\n```\nmy $h_ref = { 'F' => 9, 'Cl' => 17, 'Br' => 35 };\nprint \"\
  The elements are \", join ' ', keys %$h_ref, \"\\n\";\nprint \"F's atomic number\
  \ is $$h_ref{'F'}\\n\";\n```\n\n像 `$$h_ref{'F'}` 或更笨拙的等价形式 `${$h_ref}{'F'}` 这样的表达式经常出现。有一种视觉上更吸引人的“箭头”语法，可用于编写数组和哈希引用的下标：\n\
  \n```\n${$h_ref}{'F'}      # 规范形式\n$$h_ref{'F'}        # 标量变量形式\n$h_ref->{'F'} \
  \      # 箭头形式\n```\n\n你可以级联箭头。此外，如果箭头左右两侧都是下标，你可以省略箭头。下面两个 `print` 语句都打印单词 `joe`：\n\
  \n```\n$student->[1] = { 'first' => 'joe', 'last' => 'bloe' };\nprint $student->[1]->{'first'};\n\
  print $student->[1]{'first'};\n```\n\n注意不要省略过多的箭头或花括号。例如，如果你省略了第一个箭头，你会得到一个哈希引用的数组，这是不同的：\n\
  \n```\n@student\n...\nfirst\njoe\nlast\nbloe\n```\n\n最后，Perl 将所有引用（无论其类型如何）都当作普通标量处理——它们没有特殊的“类型”来在语法上与其他标量区分。然而，引用值包含关于其指向对象类型的信息。你可以通过\
  \ `ref` 运算符获取这些信息。\n\n这个指向标量值的引用会导致打印 `SCALAR`：\n\n```\nmy $s_ref = \\1;\nprint\
  \ ref $s_ref;\n```\n\n而这个子程序引用会导致打印 `CODE`：\n\n```\nmy $c_ref = sub { 'code!' };\n\
  print ref $c_ref;\n```\n\n### 自动活体化\n\n如果你将一个未定义值的标量当作指向其他对象的引用来使用，Perl 会自动创建一个适当类型的对象，并使该标量成为指向该类型的引用。这称为**自动活体化**。例如，以下代码创建了一个包含四个元素的数组，并使\
  \ `$ref` 成为指向它的引用：\n\n```\nundef $ref;\n$ref->[3] = 'four';\n```\n\n这对于深层数据结构特别方便，省去了你创建每一层的工作：\n\
  \n```\nuse Data::Dumper;\nmy $ds;\n$ds->{top}[0]{cats}[1]{name} = 'Buster';\nprint\
  \ Dumper($ds);\n```\n\n只需少量代码，你就创建了一个相当复杂的结构：\n\n```\n$VAR1 = {\n    'top' => [\
  \ {\n        'cats' => [\n            undef,\n            {\n                'name'\
  \ => 'Buster'\n            }\n        ]\n    } ]\n};\n```\n\n第 60 条给出了一个关于自动活体化的更长的例子。\n\
  \n### 软引用\n\n如果你解引用一个字符串值，Perl 会返回以该字符串为名称的变量的值。如有必要，该变量会被创建。这称为**软引用**。\n\n软引用可以是变量解释的结果：\n\
  \n```\nmy $str = 'pi';\n${$str} = 3.1416;\nprint \"pi = $pi\\n\";\n```\n\n你甚至可以使用字面字符串来创建软引用：\n\
  \n```\n${ 'e' . 'e' } = 2.7183;\nprint \"ee = $ee\\n\";   # 2.7183\n```\n\n这样的变量名不必是合法的标识符，这意味着你可以用空白字符甚至空字符来创建变量：\n\
  \n```\n${} = 'space';\n${' '} = 'space';\n${'  '} = 'two space';\n${\"\\0\"} = 'null';\n\
  ```\n\n注意，软引用与引用计数无关。只有普通的“硬”引用才会增加引用计数。\n\n启用 `strict refs` 会禁用软引用（第 3 条），这是有充分理由的：几乎总有更好的方法来做事情。\n\
  \n### 要记住的要点\n\n- 使用引用运算符 `\\`，或匿名数组 `[]` 或哈希 `{}` 构造器来获取变量的引用。\n- 解引用一个引用以获取它指向的值。\n\
  - 不要将普通标量当作引用使用；那样会创建软引用。\n\n---\n\n## 第 59 条 比较引用类型与原型。\n\n一旦你开始将引用作为子程序参数传递，你就会想要验证你得到了期望的类型。\n\
  \n```\nsub count_matches {\n    my ( $regex, $array_ref ) = @_;\n    my $matches\
  \ = grep /$regex/, @$array_ref;\n}\n```\n\n如果你向 `count_matches` 传递了错误类型的参数，一切都会崩溃。如果你在调用中使用了数组而不是数组引用，Perl\
  \ 会报错：\n\n```\nmy $matches = count_matches( qr/.../, @array );\n```\n\n你会得到类似这样的错误：\n\
  \n```\nNot an ARRAY reference at ...\n```\n\n同样，如果你传递了一个字符串而不是正则表达式引用，并且该字符串不是有效的正则表达式（例如包含不匹配的括号），你会得到另一种错误：\n\
  \n```\nmy $matches = count_matches( '(...', \\@array );\n```\n\n你会得到一个指向正则表达式问题的错误：\n\
  \n```\nUnmatched ( in regex; marked by <-- HERE in m/( <-- HERE / at ...\n```\n\n\
  ### `ref` 运算符\n\n要找出你拥有的引用类型，请使用 `ref`：\n\n```\nmy $array_ref = \\@array;\nmy $type\
  \ = ref $array_ref;   # $type 是 'ARRAY';\n```\n\n对于基本类型，你会得到以下之一：`SCALAR`、`ARRAY`、`HASH`、`CODE`、`GLOB`\
  \ 或 `Regexp`。\n\n### 比较类型\n\n有些人会将 `ref` 返回的类型与硬编码的字面类型进行匹配：\n\n```\nsub count_matches\
  \ {\n    my ( $regex, $array_ref ) = @_;\n    die \"First argument needs to be a\
  \ regex reference\"\n        unless ref $regex eq 'Regexp';\n    die \"Second argument\
  \ needs to be an array reference\"\n        unless ref $regex eq 'ARRAY';\n    my\
  \ $matches = grep /$regex/, @$array_ref;\n}\n```\n\n然而，硬编码这些值很容易出错。例如，很容易忘记正则表达式的引用类型不遵循其他类型的模式；它是混合大小写并且末尾有一个\
  \ `p`：\n\n```\ndie '...' unless ref $regex eq 'REGEX';   # 错误\ndie '...' unless\
  \ ref $regex eq 'Regex';   # 错误\n```\n\n\n\n\n不过，你不需要记住这些字面值。你可以使用你想要生成字符串的引用的原型，将其赋值给一个首字母大写的标量，以表示它是一个常量：\n\
  \n```\n# ref of empty anonymous array\nmy $ARRAY_TYPE = ref [];\n\n# ref of empty\
  \ anonymous regex\nmy $REGEX_TYPE = ref qr//;\n\nDownload from <www.wowebook.com>\n\
  \n*Item 60\\. Create arrays of arrays with references* ❘ **211**\n\n# ref of empty\
  \ anonymous hash\nmy $HASH_TYPE = ref {};\n\n# ref of empty anonymous sub\nmy $CODE_TYPE\
  \ = ref sub { };\n```\n\n现在你将获得与 Perl 返回的相同类型，从而避免拼错那个字面字符串的风险，而且无需记忆任何东西：\n\n```\n\
  die '...' unless ref $regex eq $REGEX_TYPE;\ndie '...' unless ref $array eq $ARRAY_TYPE;\n\
  ```\n\n你也可以使用 `constant` 或 `Readonly` 模块做同样的事情：\n\n```\nuse constant ARRAY_TYPE\
  \ => ref [];\nuse Readonly;\nReadonly my $ARRAY_TYPE => ref [];\n```\n\n如果你需要对子例程参数进行更复杂的验证，请查看\
  \ `Params::Validate`。\n\nptg\n\n### 要记住的事项\n\n- 在解引用之前，验证引用的类型。\n- 使用原型值来比较引用类型。\n\
  - 将原型值转化为常量。\n\n## 第 60 条：使用引用创建数组的数组。\n\nPerl 本身没有列表的列表，但一个包含数组引用的数组可以实现这一功能。这通常被称为**数组的数组**或简称为\
  \ **AoA**。\n\n请记住，你用于下标的圆括号或方括号必须与你想要创建的结构类型相匹配（第 61 条）。\n\n你可以直接构造 AoA：\n\n```\n\
  # an array of refs to arrays\nmy @a = ( [ 1, 2 ], [ 3, 4 ] );\nprint $a[1][0]; #\
  \ gives 3\n\n# a ref to an array of refs to arrays\nmy $a = [ [ 1, 2 ], [ 3, 4 ]\
  \ ];\nprint $a->[1][0]; # gives 3\n```\n\nDownload from <www.wowebook.com>\n\n**212**\
  \ ❘ *第 6 章 引用*\n\n你也可以通过编程方式构建数据结构。例如，你可以生成一个表示乘法表的矩阵，使用几个 C 风格的 `for` 循环来遍历索引：\n\
  \n```\nmy $max = 5;\nmy $matrix;\nfor ( my $i = 1 ; $i < $max ; $i++ ) {\n    for\
  \ ( my $j = 0 ; $j < $max ; $j++ ) {\n        $matrix->[$i][$j] = $i * $j;\n   \
  \ }\n}\n```\n\n打印 AoA 也不难。大部分工作在于设置格式，而不是访问数据结构：\n\n```\nmy $format = ' %2d' x @{$matrix};\n\
  printf \" i/j $format\\n\", 0 .. $max;\nfor my $i ( 0 .. $max - 1 ) {\n    printf\
  \ \"%2d: $format\\n\", $i, @{ $matrix->[$i] };\n}\n```\n\nptg\n\n输出是一个格式良好的乘法表：\n\
  \n```\ni/j 0 1 2 3 4\n0: 0 0 0 0 0\n1: 0 1 2 3 4\n2: 0 2 4 6 8\n3: 0 3 6 9 12\n\
  4: 0 4 8 12 16\n```\n\n如果你想获取某个特定元素，只需使用正确的索引：\n\n```\nmy $two_squared = $matrix->[2][2];\n\
  ```\n\n注意第一个下标要小心。因为 `$matrix` 是一个引用，所以需要在它后面加上 `->`。在第一个索引之后，你可以省略 `->`，因为相邻的两个下标暗示了引用（第\
  \ 58 条）。\n\n再考虑另一个例子。假设你想快速访问文本行：\n\n```\nmy @lines;\nwhile (<>) {\n    chomp;\n\
  \    push @lines, [split];\n}\n```\n\n一旦有了数据结构，你就可以快速访问任意行的任意单词。例如，如果你想获取第七行的第三个单词，只需确保索引正确。在这种情况下，`@lines`\
  \ 是一个数组（不是引用），所以不需要前导的 `->`：\n\n```\nmy $third_on_seventh = $lines[6][2];\n```\n\
  \n文件中第 15 行有多少个单词？数组元素是一个数组的引用，因此你可以解引用它并赋值给一个标量，以获取其元素个数（第 9 条）：\n\n```\nmy $count\
  \ = @{ $lines[14] };\n```\n\n哪一行的单词最多？你可以使用施瓦茨变换（第 22 条）对 `@lines` 的索引进行排序，以避免创建数据的副本。由于你只需要一个索引来获取单词最多的行，将其赋值给一个包含一个标量变量的列表：\n\
  \n```\nmy ($most_words) =\n    map  { $_->[0] }\n    sort { $b->[1] <=> $a->[1]\
  \ }\n    map  { [ $_, scalar @{ $lines[$_] } ] } 0 .. $#lines;\nprint \"Line $most_words\
  \ is the longest with \", scalar @{ $lines[$most_words] }, \" words\\n\";\n```\n\
  \n这有点冗长。你可以将其作为一个长列表操作来完成，并且你可能会喜欢琢磨这个施瓦茨变换的变体：\n\n```\nuse 5.010;\nprintf \"Line\
  \ %s is the longest with %s words\\n\", map { @$_ }\n    sort { $b->[1] <=> $a->[1]\
