  \n“学习一门编程语言的基础是一回事；学习如何用该语言设计和编写有效的程序则完全是另一回事。”斯科特·迈耶斯在《Effective C++》引言中写的话同样适用于\
  \ Perl。\n\nPerl 是一种超高级语言——对于熟悉缩写的人来说，就是 VHLL。它将正则表达式、网络和进程管理等高级功能融入一种上下文相关的语法中，这种语法在某种程度上比其他编程语言更“人性化”。Perl\
  \ 是一种比任何其他广泛使用的计算机语言（或许就是任何其他计算机语言）都更好的文本处理语言，句号。Perl 是 UNIX 管理员极其有效的脚本工具，也是全球大多数\
  \ UNIX CGI 脚本编写者的首选。Perl 还支持面向对象编程、模块化软件、跨平台开发、嵌入和可扩展性。\n\n## 这本书适合你吗？\n\n我们假设你已经有一些\
  \ Perl 经验。如果你刚开始学习 Perl，你可能想先等一等再读这本书。我们的目标是让你成为更好的 Perl 程序员，而不一定是新的 Perl 程序员。\n\
  \n这本书不是权威参考书，尽管我们希望你把它放在桌面上。我们涵盖的许多主题可能相当复杂，我们不会深入每一个细节。我们试图为你提供概念的基础知识，这些知识应该能满足大多数情况，但如果你需要更多，也可以作为进一步研究的起点。你仍然需要深入阅读\
  \ Perl 文档，并阅读我们在附录 A 中列出的一些书籍。\n\n**1**\n\n下载自 <www.wowebook.com>\n\n## 关于 Perl\
  \ 有很多要学。\n\n一旦你通过一本入门书籍或课程学习了 Perl，你就学会了编写 Perl 的创造者拉里·沃尔亲切地称之为“婴儿语”的内容。Perl 婴儿语是简单、直接且冗长的。这并不坏——你被允许并鼓励以任何适合你的风格编写\
  \ Perl。\n\n你可能会达到一个阶段，想要超越简单、直接和冗长的 Perl，转向更简洁和个性化的风格。这本书是为那些踏上这条道路的人而写的。《*Effective\
  \ Perl 编程*》致力于教你成为流利且富有表现力的 Perl 程序员所需的知识。本书提供了几种不同类型的建议，以帮助你前进。\n\n- **知识，或者说是“Perl\
  \ 琐事”。** Perl 中的许多复杂任务已经或可以被简化为极其简单的语句。学习有效使用 Perl 编程在很大程度上需要积累关于“正确”做事方式的经验和知识。一旦你知道了好的解决方案，你就可以将它们应用到自己的问题中。此外，一旦你知道好的解决方案是什么样的，你就可以自己发明并准确判断它们的“正确性”。\n\
