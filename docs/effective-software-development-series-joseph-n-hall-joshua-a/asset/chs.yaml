  \ `perldoc` 给你名为 `-X` 的函数：\n\n```\n% perldoc -f -X\n```\n\n文件测试非常适合循环和条件语句。例如，下面是一个目录中的文本文件列表。`-T`\
  \ 文件测试通过采样文件的一部分并进行猜测来判断内容是否为文本。\n\n几乎所有文件测试默认都使用 `$_`：\n\n```\nmy @textfiles =\
