  \n下一步，使用排序块对这个引用列表进行排序：\n\n```\nmy @sorted_names_and_ages =\n    sort { $a->[1]\
  \ <=> $b->[1] } @names_and_ages;\n```\n\nDownload from <www.wowebook.com>\n\n*第\
