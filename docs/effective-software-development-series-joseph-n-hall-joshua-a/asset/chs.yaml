  \n如果我们使用 Perl 5.10 的特性，我们会在示例开头加上一行注明版本（参见第 1 章中的条目 2）：\n\n```\nuse 5.010;\n```\n\
  \n我们还忽略了 Perl 的开发版本，其中次版本号为奇数，例如 5.009 和 5.011。我们会在引入该特性的第一个稳定 Perl 版本中注明其最早出现。\n\
  \n并非所有内容都能在 `warnings` 或 `strict`（条目 3）下干净运行。我们建议所有 Perl 程序员定期使用这两者。然而，在所有示例开头加上这些声明可能会分散我们对主要观点的注意力，因此我们省略了它们。在适当的情况下，我们尽量保持\
  \ strict 清洁，但从较大的示例中提取代码并不总是使这变得可行。\n\n我们通常尽量减少标点符号（条目 18）。我们不热衷于“Perl 高尔夫”，即人们将程序缩减到尽可能少的字符。\n\
  \n我们只是去掉不必要的字符，并使用更多的空白，以便重要的部分突出，而框架则淡入背景。\n\n最后，我们努力使示例有意义。并非每个示例都能成为有用的代码片段，但我们尽量包含尽可能多的真实世界代码。\n\
