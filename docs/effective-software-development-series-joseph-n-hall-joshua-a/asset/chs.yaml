- "# 高效Perl编程：编写更好更地道的Perl代码\n\n# 前言\n\n十多年前我第一次学习 Perl 时，我以为自己对这门语言已经相当了解；事实上，我对这门*语言*确实足够了解。但我所不了解的是那些真正赋予\
  \ Perl 力量的惯用法和结构。\n\n虽然不使用这些也能编程，但它们代表了一笔容易被忽视的知识和生产力财富。\n\n幸运的是，我得到了 Joseph N.\
  \ Hall 的《Effective Perl Programming》第一版，而它并没有被放在我的书架上。相反，它几乎永久地待在我的包里，这样我就能在有空的时候随时翻阅。\n\
  \nJoseph 的《Effective Perl Programming》格式简单得令人愉悦：短小的智慧片段，易于消化。事实上，它最初启发了我们免费的 Perl\
  \ Tips（http://perltraining.com.au/tips/）新闻通讯，该通讯至今仍在探索 Perl 及其社区。\n\n十年间，一门语言可以发生很多变化，但社区对一门语言的理解在这段时间里变化更大。因此，我很高兴地得知不仅第二版正在筹备中，而且将由\
  \ Perl 社区中最杰出的两位成员撰写。\n\n说 brian 致力于 Perl，就像说太阳的日冕相当热一样。brian 不仅写了大量关于这门语言的著作，还出版了一本杂志（《The\
  \ Perl Review》），管理 Perl 的 FAQ，并且是 Perl 和编程社区网站上持续且受欢迎的存在。\n\nJosh 以运营 *Perlcast*\
  \ 而闻名，自 2005 年以来一直以音频形式提供 Perl 新闻。Josh 持续采访世界上最聪明、最有趣的人的能力，不仅使他成为理想的知识积累者，也让我非常嫉妒。\n\
  \n**xi**\n\n下载自 <www.wowebook.com>\n\n**xii** ❘ *前言*\n\n因此，我非常荣幸有机会向您呈现本书的第二版。愿它像第一版帮助我一样，助您走上掌握\
  \ Perl 的道路。\n\n*—Paul Fenwick*\n\n*董事总经理*\n\n*Perl Training Australia*\n\nptg\n\n\
  下载自 <www.wowebook.com>\n\n# 序言\n\n许多 Perl 程序员都是从《Effective Perl Programming》第一版开始学习的。当\
  \ Addison-Wesley 在 1998 年首次出版时，整个世界似乎都在使用 Perl；互联网泡沫正值鼎盛，任何懂一点 HTML 的人都能找到程序员的工作。一旦他们得到这些工作，程序员就必须快速掌握一些技能。《Effective\
  \ Perl Programming》很可能是那些新 Perl 程序员放在桌上的书籍之一，与 Perl 的圣经《Programming Perl》1 和《Learning\
  \ Perl》2 并列。\n\n那时书架上还有许多其他 Perl 书籍。如今的年轻人可能不会相信，你走进美国的一家书店，会看到数百英尺的书架空间专门用于计算机编程，而其中大部分似乎是\
  \ Java 和 Perl。今天走进一家书店，计算机区可能只有自己的一个角落，每种语言可能只有几本书。其中大部分书名可能六个月后就不在了。\n\n尽管如此，《Effective\
  \ Perl Programming》坚持了十多年。Joseph Hall 对 Perl 编程哲学的洞察和智慧是永恒的。毕竟，他的书更多的是关于用 Perl 思考。他所有的建议至今仍然有效。\n\
  \n然而，Perl 的世界与 1998 年相比已经大不相同，而且现在有更多的好建议。CPAN（综合 Perl 存档网络）当时只有几岁，现在已成为 Perl 的杀手级特性。人们发现了新的、更好的做事方式，并且凭借十多年的额外\
  \ Perl 经验，最佳实践和惯用法已经取得了长足的进步。\n\n1. Larry Wall, Tom Christiansen, 和 Jon Orwant，《Programming\
  \ Perl, Third Edition》（Sebastopol, CA: O'Reilly Media, 2000）。\n\n2. Randal L. Schwartz,\
  \ Tom Phoenix, 和 brian d foy，《Learning Perl, Fifth Edition》（Sebastopol, CA: O'Reilly\
  \ Media, 2008）。\n\n**xiii**\n\n下载自 <www.wowebook.com>\n\n**xiv** ❘ *序言*\n\n自《Effective\
  \ Perl Programming》第一版以来，Perl 本身也发生了变化。第一版存在于从 Perl 4 到 Perl 5 的过渡期，因此人们仍然保留着旧的\
  \ Perl 4 习惯。在本版中，我们基本上摒弃了这种区分。只有一种 Perl，它是主版本 5。（不要问我们关于 Perl 6 的事。那是另一本书，另一个时代的事。）\n\
  \n\n\n\n\n现代 Perl 已经能够处理 Unicode，并认识到世界远不止 ASCII。你也需要跨过这道坎，因此我们专门增加了一整章来讨论它。Perl\
  \ 可能是测试最充分的代码库之一，这一趋势由 Michael Schwern 在几年前开创，如今几乎已成为每个模块发行版的一部分。Perlers 庆祝代码乱写的狂野西部时代已经一去不复返。现在，你可以同时实现快速原型设计和良好的测试。如果你在企业领域工作，你会想阅读我们关于测试的建议。如果你是一个正则表达式爱好者，你会想使用最新版本\
  \ Perl 提供的所有新正则表达式特性。我们将向你介绍其中最流行的那些。\n\nPerl 仍在不断发展，新的主题不断涌现。有些主题，比如后现代 Perl 对象系统\
  \ `Moose`，值得单独成书，因此我们甚至没有尝试在这里涵盖它们。其他主题，如 `POE`（Perl 对象环境）、对象关系映射器和 GUI 工具包，同样值得关注，但本书也未涉及。我们已经在考虑\
  \ *More Effective Perl*，所以情况可能会有所改变。\n\n最后，Perl 文献库已经成熟得多。尽管我们努力涵盖了我们认为你需要了解的大部分内容，但我们省略了一些在其他书籍中覆盖得更好的领域，这些书籍列在附录\
  \ B 中。这为其他主题腾出了空间。\n\n*——Joseph N. Hall、Joshua A. McAdams 和 brian d foy*  \n## 第一版前言\n\
  \n我以前写过很多 C 和 C++ 代码。在全身心投入 Perl 世界之前，我的最后一个主要项目是一个解释型语言，它可以绘制图表、计算概率并生成完整的 FrameMaker\
  \ 书籍。该项目包含超过 50,000 行平台无关的 C++ 代码，并拥有各种有趣的内部特性。这是一个有趣的项目。\n\n它也花了我两年时间才完成。\n\n下载自\
  \ <www.wowebook.com>\n\n*前言* ❘ **xv**\n\n在我看来，大多数用 C 和/或 C++ 编写的有趣项目都需要数月或数年才能完成。这很合理，因为一个项目之所以有趣，部分原因就在于它的复杂性和耗时性。但我也觉得，很多最初看似平凡无趣的想法，当用普通高级语言表达时，就会变成耗时三个月的有趣项目。\n\
  \n这是我最初对 Perl 产生兴趣的原因之一。我听说 Perl 是一种出色的脚本语言，具有强大的字符串处理、正则表达式和进程控制功能。这些都是 C 和 C++\
  \ 程序员在时间紧迫时最头疼的特性。\n\n当我被投入一个项目，其中大部分工作涉及处理文本文件——从一个软件获取输出并重新格式化，以便输入到另一个软件时，我学会了\
  \ Perl，并开始喜欢上它。我很快发现自己花不到一天时间就能写出 Perl 程序，而如果用其他语言，这些程序可能需要几天甚至几周才能完成。\n\n**我写这本书的方式和原因**\n\
  \nptg\n\n我一直想成为一名作家。童年时，我对科幻小说着迷。我不断地阅读，有时一天读三本平装书，偶尔也会自己写一些（糟糕的）故事。后来，在 1985 年，我参加了在密歇根州东兰辛举行的\
  \ Clarion 科幻与奇幻作家研讨会。之后的一年左右，我偶尔会写一些短篇小说手稿，但从未发表过。学业和工作开始占据我越来越多的时间，最终我逐渐远离了小说创作。不过，我继续写作，时不时地撰写技术手册、课程、提案或论文。此外，多年来我与许多技术作者建立了联系。\n\
  \n其中一位是 Randal Schwartz。我聘请他作为工程项目的承包商，并管理了他一年多。（这是我第一次担任技术经理，对于了解软件开发管理世界的人来说，这无疑是一次很好的入门体验，任何认识\
  \ Randal 的人都能猜到。）最终，他离开去全职教授 Perl。过了一段时间，我也做了同样的事。\n\n在这期间，我对写书越来越感兴趣。过去几年，我一直在所有“热门”领域工作——C++、Perl、互联网和万维网——我觉得我应该能从中找到一些有趣的东西写下来。使用和教授\
  \ Perl 更加强化了这种感觉。我希望有一本书能汇集我反复遇到的各种 Perl 技巧和陷阱。\n\n然后，在 1996 年 5 月，我在圣何塞的一次开发者会议上与\
  \ Keith Wollman 进行了一次交谈。我并没有真正想找一本书来写，但我们正在讨论哪些东西可能成为好书，哪些不会。当我们聊到 Perl 这个话题时，他问我：“你觉得一本叫\
  \ *Effective Perl* 的书怎么样？”我喜欢这个主意。Scott Meyers 的 *Effective C++* 是我最喜欢的 C++ 书籍之一，将这个系列扩展到\
  \ Perl 是显而易见的。\n\n我无法摆脱 Keith 的想法，过了一段时间，在 Randal 的帮助下，我制定了一份本书的提案，Addison-Wesley\
  \ 接受了它。\n\n剩下的……嗯，那是有趣的部分。我花了无数个 12 小时的日日夜夜，在电脑屏幕前使用 FrameMaker，在 Perl 5 Porters\
  \ 邮件列表上问了很多烦人的问题，翻阅了几十本书籍和手册，编写了许多许多小段的 Perl 代码，喝了很多很多罐健怡可乐和百事可乐。我甚至偶尔会有 ptg 顿悟，发现一些关于\
  \ Perl 的基本知识，而我之前从未意识到自己错过了它们。过了一段时间，一份手稿诞生了。\n\n这本书是我尝试与你们分享我在学习 Perl 强大功能时所体验到的乐趣和激励。我非常感谢你花时间阅读它，希望你能觉得它有用且愉快。\n\
  \n*——Joseph N. Hall*  \n*亚利桑那州钱德勒*  \n*1998 年*\n\n下载自 <www.wowebook.com>\n\n## 致谢\n\
