  $fib[3] = 3;\n$fib[4] = 5;\n```\n\nptg\n\n简单的方法是直接将值存储在数组中：\n\n```\nmy @x = ( 1,\
  \ 1, 2, 3, 5 );\n```\n\n使用引号词操作符`qw()`甚至更简单：\n\n```\nmy @x = qw( 1 1 2 3 5 );\n\
  ```\n\n这种模式的一个更复杂的变体涉及将成对的值存储在单独的变量中——例如，二维坐标：\n\n```\nmy $x0 = 1;\nmy $y0 = 1;\n\
