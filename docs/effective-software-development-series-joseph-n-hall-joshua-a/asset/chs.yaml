  你也可以修改主题。也许你想要 `pbp` 主题，但希望忽略那些仅仅是外观上的建议（即代码格式化）或与发行版维护相关的建议。你可以直接调整主题：\n\n```\n\
  % perlcritic --brutal --theme=\\\n'pbp && ! (cosmetic || maintenance)' MyPrinter.pm\n\
