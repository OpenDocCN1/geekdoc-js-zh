  \n### 数字和字符串上下文\n\n在 Perl 中，上下文告诉操作如何对待数据和计算表达式。\n\n有时上下文完全由操作符决定。算术操作符将数据视为数字，而字符串操作符将数据视为字符串：\n\
  \n```\nmy $result = '123' + '345'; # 468\nmy $result = 123 . 345; # '123456'\n```\n\
  \n在比较时必须使用正确的操作符（第 6 条）。如果你尝试将数字作为字符串比较，可能会得到有趣的结果。作为字符串，`'12'`小于`'2'`，因为字符串比较器逐字符比较，而`'1'`小于`'2'`：\n\
  \n```\nif ( '12' lt '2' ) { print \"12 is less than 2!\\n\"; }\n```\n\n同样，用数字比较器比较字符串可能会让你困惑。作为数字，`foo`和`bar`都转换为\
  \ 0（第 8 条），因此它们在数值上相等：\n\n```\nif ( 'foo' == 'bar' ) { print \"Oh noes! foo is bar!\\\
  n\" }\n```\n\nptg\n\n### 标量和列表上下文\n\n当操作期望处理单个项时，Perl 强制使用标量上下文。当操作期望处理多个项时，Perl\
  \ 强制使用列表上下文。\n\n加法操作符（数字和字符串）是标量操作符，因为它们期望两侧都是单个项：\n\n```\n1 + 2\n'foo' . 'bar'\n\
  ```\n\n列表操作符期望处理多个元素。`print`操作符接受一个列表项并输出它们：\n\n```\nprint reverse( 1 .. 10 ), \"\
  \\n\";\n```\n\n`while`条件处于标量上下文，而`foreach`条件处于列表上下文，因为这是它们定义的方式：\n\n```\nwhile (\
  \ SCALAR CONTEXT HERE ) { ... }\nforeach ( LIST CONTEXT HERE ) { ... }\n```\n\n\
