  \n考虑遍历一个文件句柄来处理行，一旦找到`__END__`标记就停止。使用`while`循环，每次迭代读取一行，循环结束后你仍然可以从该文件句柄读取另一行：\n\
  \n```\nwhile (<STDIN>) {\n    last if /__END__/;\n    ...;\n}\nmy $next_line = <STDIN>;\n\
  ```\n\n如果你使用`foreach`，就会有问题。由于`foreach`强制使用列表上下文，它会读取`STDIN`中的所有内容，即使你提前停止循环，之后也没有行可读了：\n\
  \n```\nforeach (<STDIN>) {\n    last if /__END__/;\n    ...;\n}\nmy $next_line =\
  \ <STDIN>; # 哎呀——没有更多行了！\n```\n\nptg\n\n通常，在需要之前就读取行是不好的做法，因此通常最好使用`while`。\n\n\
  ### 通过赋值确定上下文\n\n赋值操作符提供上下文。它知道是要赋值给单个元素还是元素列表。如果赋值操作符知道它要赋值给一个列表，它会为右侧提供列表上下文。\n\
  \n以下都是列表赋值：\n\n```\nmy ($n) = ( 'a', 'b', 'c' ); # $n 是 'a'\nmy ($n, $m) = ( 'a',\
  \ 'b', 'c' ); # $n 是 'a', $m 是 'b'\nmy @array = ( 'a', 'b', 'c' );\nmy @lines =\
  \ <STDIN>; # 读取所有行\n```\n\n下载自 <www.wowebook.com>\n\n**44** ❘ *第 1 章 Perl 基础*\n\n\
  注意，单个元素的列表，如`my ($n)`，与任何其他数量的项一样有效。它仍然是一个列表。标量周围的括号使其成为列表操作，即使只有一个标量。\n\n赋值给裸标量（左侧没有括号）提供**标量上下文**。\n\
  \n```\nmy $single_line = <STDIN>; # 只读取一行\n```\n\n有时这可能会非常棘手。在这种情况下，`$n`是什么？\n\n\
  ```\nmy $n = ( 'a', 'b', 'c' ); # $n 是 'c'\n```\n\n要理解这个奇怪的结果，需要知道列表和数组之间的区别（第 9\
  \ 条）。\n\n### 空上下文\n\n还有一种**空上下文**，在这种上下文中，你调用子程序或使用操作符，但不保存或使用结果：\n\n```\nsome_sub(@args);\n\
  grep { /foo/ } @array;\n1 + 2;\n```\n\n在某些情况下，Perl 可以判断操作是无用的。例如，当你不保存结果时，真的需要执行那个`grep`吗？\n\
  \n在某些情况下，比如`1 + 2;`，当你启用警告时（第 99 条），你会收到警告：\n\n```\nUseless use of a variable in\
  \ void context\n```\n\n### 要记住的事项\n\n- Perl 根据你在做什么来确定上下文。\n- Perl 根据数字或字符串上下文解释标量。\n\
  - 列表上下文可能产生与标量上下文完全不同的结果。\n\n下载自 <www.wowebook.com>\n\n*第 13 条。使用数组或哈希来分组数据。* ❘\
  \ **45**\n\n## 第 13 条。使用数组或哈希来分组数据。\n\nPerl 有两种内置类型可以让你的编码生活更轻松：数组和哈希。这些是**集合**类型，旨在对相关数据进行分组。\n\
  \n### 不要使用编号变量\n\n从那些了解标量但尚未学习数组的初学者那里，你经常会看到使用单独标量存储一系列值的代码：\n\n```\nmy $fib_0\
