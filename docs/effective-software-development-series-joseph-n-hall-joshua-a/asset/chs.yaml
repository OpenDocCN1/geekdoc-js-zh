  Subroutine name is a homonym for builtin function at ↵\nline 7, column 1. See page\
  \ 177 of PBP. (Severity: 4)\nSubroutine \"print\" does not end with \"return\" at\
  \ line 7,↵\ncolumn 1. See page 197 of PBP. (Severity: 4)\n```\n\n`perlcritic` 还有更多的命令行选项。你可以通过正则表达式限制或包含策略，只显示有限数量的违规，重新格式化输出，显示代码统计信息等等。任何你偏好的配置选项都可以存储在\
  \ `.perlcriticrc` 文件中，这样你就不必重复输入了。花些时间阅读 `perlcritic` 的文档。\n\n下载自 <www.wowebook.com>\n\
  \n*第 112 条 使用 Perl Critic* ❘ **401**\n\n### 在测试套件中\n\n`Perl::Critic` 的命令行界面很好用，前提是你记得使用它。你可以使用\
  \ `Test::Perl::Critic` 在每次运行测试套件时进行静态分析。许多人会在他们的发行版中添加一个 `t/perlcriticrc` 文件，以便仅为该发行版调整策略。\n\
  \n添加该文件后，只需将 `t/perl-critic.t` 模板添加到你的测试套件中：\n\n```\nuse File::Spec;\nuse Test::More;\n\
  if ( not $ENV{TEST_AUTHOR} ) {\n    plan( skip_all =>\n        'Set $ENV{TEST_AUTHOR}\
  \ to a true value to run.' );\n}\neval \"use Test::Perl::Critic\";\nif ( $@ ) {\n\
  \    plan( skip_all =>\nptg\n        'Test::Perl::Critic required to criticise code'\
  \ );\n}\n```\n\n\n\n\n\n`my $rcfile = File::Spec->catfile( 't', 'perlcriticrc' );\
  \ Test::Perl::Critic->import( -profile => $rcfile ); all_critic_ok();`\n\n你很可能正在处理一个已经存在的项目，如果启用\
  \ `Test::Perl::Critic`，你会被大量问题淹没，无法一次性处理。与其停止所有新开发来修复静态分析问题（或者完全放弃 Perl Critic），不如使用\
  \ `Test::Perl::Critic::Progressive`，它只警告你新出现的问题：\n\n```\nuse Test::More;\n\neval\
  \ {\n    use Test::Perl::Critic::Progressive\n        qw( progressive_critic_ok\
  \ )\n};\n```\n\n下载自 <www.wowebook.com>\n\n402 ❘ *第 13 章 杂项* `plan skip_all => 'T::P::C::Progressive\
  \ required for this test' if $@; progressive_critic_ok();`\n\n`Test::Perl::Critic::Progressive`\
  \ 首先记录代码中的违规数量，然后在每次后续运行时确保自上次成功运行测试套件以来，违规数量保持不变或更少。你可以设定代码库中可接受的违规数量上限，并随着时间的推移逐步减少它们。\n\
  \n你甚至可以按策略设置步长，以便更快地减少某些问题：\n\n```\nuse Test::More;\n\neval {\n    use Test::Perl::Critic::Progressive\n\
  \        qw(\n            progressive_critic_ok\n            set_total_step_size\n\
  \            ptg\n        )\n};\n\nplan skip_all => 'T::P::C::Progressive required\
  \ for this test' if $@;\nset_total_step_size( 5 );\nprogressive_critic_ok();\n```\n\
  \n由于 `Test::Perl::Critic::Progressive` 的默认操作仅仅是检查自上次成功运行测试以来违规数量是否相同或更少，你需要强制自己和团队减少总违规数量。为了加速合规，你可以配置\
  \ `Test::Perl::Critic::Progressive` 的步长参数，使其发出警告：\n\n```\nmy %step_sizes = (\n \
  \   'ValuesAndExpressions::ProhibitLeadingZeros' => 2,\n    'Variables::ProhibitConditionalDeclarations'\
  \ => 1,\n    'InputOutput::ProhibitTwoArgOpen' => 3,\n);\nset_step_size_per_policy(\
  \ %step_sizes );\nprogressive_critic_ok();\n```\n\n下载自 <www.wowebook.com>\n\n*第\
  \ 113 条. 使用* Log::Log4perl *记录程序状态* ❘ **403**\n\n### 自定义策略\n\n`Perl::Critic` 附带大量策略；然而，CPAN\
  \ 上还有许多非核心策略，你可以根据自己的代码偏好将其集成到系统中。附加策略太多，无法在此一一列举，但一些值得注意的有：\n\n- **Perl-Critic-More**\
  \ – 由 `Perl::Critic` 开发者编写的包含多种不同策略的包。\n- **Perl-Critic-Bangs** – Andy Lester 编写的一组实用策略，用于搜索代码“坏味道”，例如注释掉的代码和糟糕的变量名。\n\
  - **Perl-Critic-StricterSubs** – 比核心更严格的子程序规则，适用于真正受虐倾向的开发者。\n- **Perl-Critic-Swift**\
  \ – 要求你在源代码和 Pod 文件中使用 UTF-8 编码声明的策略。\n- **Perl-Critic-Moose** – 针对基于 Moose 的代码的批评。\n\
  \n`ptg`\n\n如果你找不到检查所需内容的策略，你可以轻松编写自己的策略。请查看 `Perl::Critic` 发行版中的 `Perl::Critic::DEVELOPER`\
  \ 文档。\n\n### 要点回顾\n\n- 使用 `Perl::Critic` 分析源代码中的潜在问题。\n- 通过 `Test::Perl::Critic`\
  \ 将 `Perl::Critic` 添加到测试套件中。\n- 使用 `Test::Perl::Critic::Progressive` 将 Perl Critic\
  \ 添加到现有项目中。\n\n## 第 113 条. 使用 Log::Log4perl 记录程序状态。\n\n适当的日志记录可以成为代码的强大调试和诊断工具。在最基本的层面上，日志记录可以简单到使用\
  \ `print` 语句：\n\n```\nprint \"The value is [$value]\\n\";\n```\n\n下载自 <www.wowebook.com>\n\
  \n404 ❘ *第 13 章 杂项* 你甚至可以通过环境变量来控制它，使其更花哨一些：\n\n```\nprint \"The value is [$value]\\\
  n\" if $ENV{DEBUG};\n```\n\n### 简单的 Log::Log4perl\n\n这种方式不加区分且不够灵活。要真正利用良好日志记录的力量，你需要使用一个健壮的日志框架，例如\
  \ `Log::Log4perl`，它会为你处理所有细节。最简单的方法是使用 `easy_init` 初始化 `Log::Log4perl`。`:easy` 标签导出了代表每个级别的变量，以及每个级别的子程序：\n\
  \n```\nuse Log::Log4perl qw(:easy);\n\nLog::Log4perl->easy_init($ERROR);\n\nINFO\
  \ 'starting program';\n\nfor ( 1 .. 100 ) {\n    DEBUG \"loop counter: $_\";\n}\n\
  ```\n\n`ptg`\n\n```\nINFO 'program complete';\n```\n\n当你运行这段代码时，看不到任何输出！`Log::Log4perl`\
