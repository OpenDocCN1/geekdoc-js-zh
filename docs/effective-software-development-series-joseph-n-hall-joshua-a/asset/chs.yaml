  \n## 第 112 条 使用 `Perl::Critic`\n\nPerl 以其灵活性和表现力而闻名（或臭名昭著）。Perl 程序员长期以来的口头禅是“条条大路通罗马”（TMTOWTDI）。这种灵活性很棒；然而，有时你需要收敛一下，遵循一些编码标准。当你与其他程序员团队合作时，规定哪些允许、哪些不允许会非常方便。它可以防止人们编写难以阅读的代码，让你的代码库变得更加宜人。即使你独自负责一个项目，制定一些规则来保持代码外观和感觉的一致性也绝无坏处。\n\
  \n制定规则是一回事，执行规则是另一回事。你可以设置敏捷方法、代码审查和结对编程，这些都是好事，但仍然可能有人为错误。你真正需要的是一个自动系统，它可以审查你的代码，并告诉你哪里违反了规则。\n\
  \n`Perl::Critic` 就是这样一个系统。它对你的 Perl 代码进行静态分析，并在可能时发出警告。它不能解决所有问题，但能帮助你管理它们。\n\n\
  ptg\n\n### 在网页上\n\n使用 `Perl::Critic` 检查文件最简单的方法就是直接上传到 <http://perlcritic.com/>。你不需要安装任何东西，可以在决定正式使用之前先试用\
  \ `Perl::Critic`。你得到的输出与你在本条目后面看到的其他 `Perl::Critic` 工具的输出类似。\n\n### 在命令行上\n\n一旦安装了\
  \ `Perl::Critic`，你就可以直接从命令行使用 `perlcritic` 程序。\n\n下面是一个简短的程序，使用默认设置会产生一些 `Perl::Critic`\
  \ 警告：\n\n```\npackage MyPrinter;\nsub new {\n    bless {}, shift;\n}\n```\n\n下载自\
  \ <www.wowebook.com>\n\n*第 112 条 使用 Perl Critic* ❘ **399**\n\n```\nsub print {\n\
  \    print \"Hello, World\\n\";\n}\n1;\n```\n\n即使对于像这样简单的模块，`perlcritic` 也能发现错误。例如，它会警告你没有使用\
  \ `strict`（第 3 条）：\n\n```\nperlcritic MyPrinter.pm\nCode before strictures are enabled\
  \ at line 3, column 1.↵\nSee page 429 of PBP. (Severity: 5)\n```\n\n在错误信息中，`perlcritic`\
  \ 会告诉你哪一行代码有问题。此外，如果这个问题是 Damian Conway 在《Perl 最佳实践》¹ 中展示过的，你还会得到该书的相关页码。\n\n最后，`perlcritic`\
  \ 会对问题的“严重性”进行评级。\n\n共有五个级别的策略和相应的严重性，其中 5 级最严重，1 级最轻。你应该优先处理最严重的问题，作为立即修复的目标。默认情况下，`perlcritic`\
  \ 只显示 5 级违规。要查看更低级别，请使用 `--severity` 开关：\n\nptg\n\n```\n% perlcritic --severity\
  \ 1 MyPrinter.pm\nError: No word lists can be found for the language \"↵\nen_US\"\
  .\nCode is not tidy at line 1, column 1. See page 33 of ↵\nPBP. (Severity: 1)\n\
  RCS keywords $Id$ not found at line 1, column 1. See ↵\npage 441 of PBP. (Severity:\
  \ 2)\nRCS keywords $Revision$, $HeadURL$, $Date$ not found at ↵\nine 1, column 1.\
  \ See page 441 of PBP. (Severity: 2)\nRCS keywords $Revision$, $Source$, $Date$\
  \ not found at ↵\nline 1, column 1. See page 441 of PBP. (Severity: 2)\nNo \"$VERSION\"\
  \ variable found at line 1, column 1. See ↵\npage 404 of PBP. (Severity: 2)\nSubroutine\
  \ \"new\" does not end with \"return\" at line 3, ↵\ncolumn 1. See page 197 of PBP.\
  \ (Severity: 4)\nCode before strictures are enabled at line 3, column 1. ↵\nSee\
  \ page 429 of PBP. (Severity: 5)\n```\n\n1. Damian Conway，《Perl 最佳实践》（Sebastopol,\
  \ CA: O’Reilly Media, 2005）。\n\n下载自 <www.wowebook.com>\n\n**400** ❘ *第 13 章 杂项*\n\
  \n```\nCode before warnings are enabled at line 3, column 1. ↵\nSee page 431 of\
  \ PBP. (Severity: 4)\nSubroutine name is a homonym for builtin function at ↵\nline\
  \ 7, column 1. See page 177 of PBP. (Severity: 4)\nSubroutine \"print\" does not\
  \ end with \"return\" at line 7, ↵\ncolumn 1. See page 197 of PBP. (Severity: 4)\n\
  Return value of flagged function ignored - print at line ↵\n8, column 5. See pages\
