  \ 第 3 条 启用严格模式以促进更好的编码\n\n默认情况下，Perl 是一种非常宽松的语言。你可以用最少的麻烦快速拼凑一些语句。Perl 会尽可能少地让你输入，处理大部分细节。这是一个特性。\n\
  \n然而，这种宽松性对于较大的程序来说并不那么有吸引力，因为你希望 Perl 帮助你管理代码。`strict` 编译指示使 Perl 变得不那么宽松。在你的所有\
  \ Perl 文件中，添加这一行：\n\n```\nuse strict;\n```\n\n如果你使用的是 Perl 5.12 或更高版本，你可以通过要求该版本或更高版本来自动启用严格模式（第\
  \ 2 条）：\n\n```\nuse 5.012; # 自动启用 strict\n```\n\n通过启用严格模式，你就能捕获程序员常犯的大部分常见错误。其余的大部分错误可以通过警告（第\
  \ 99 条）捕获。这些特性可能会在头几周让你感到烦恼，但渐渐地你的编码会得到改善，`strict` 也会变得越来越不烦人，直到你甚至感觉不到它的存在。\n\n\
  如果你正在翻译不兼容严格模式的遗留代码，你可以先在命令行上启用它，以便在提交之前查看所有错误：\n\n```\nperl -Mstrict program.pl\n\
  ```\n\n严格模式包含三个部分：`vars`、`subs` 和 `refs`。通常你会同时使用它们，但我们将分别介绍。\n\n下载自 <www.wowebook.com>\n\
  \n*第 3 条 启用严格模式以促进更好的编码* ❘ **15**\n\n### 声明你的变量\n\n拼写错误是 Perl 程序中常见的错误来源。你将数据放入一个变量，但后来使用了错误的变量名。在下面的示例中，你读入\
  \ `@temp`，但随后试图遍历 `@tmp`。你困惑为什么看不到任何输出，无论你如何查看源代码，都找不到问题：\n\n```\nmy @temp = <FH>;\n\
  foreach (@tmp) { # 哎呀——本意是使用 @temp\n    print \"Found $_\\n\";\n}\n```\n\n`strict\
  \ vars` 编译指示通过要求你以某种方式声明所有变量来捕获并防止此类错误。有三种声明变量的方式。你可以用 `my` 或 `our` 声明：\n\n```\n\
  use strict 'vars';\nmy @temp;\nour $temp;\n```\n\nptg\n\n使用完整的包规范：\n\n```\nuse strict\
  \ 'vars';\n$main::name = 'Buster';\n```\n\n或者在 `use vars` 中列出变量：\n\n```\nuse strict\
  \ 'vars';\nuse vars qw($bar);\n$bar = 5;\n```\n\n你永远不需要声明特殊变量——`$_`、`%ENV` 等。此外，`strict`\
  \ 会忽略 `$a` 和 `$b` 的全局版本，它们对 `sort` 是特殊的（第 22 条）。Perl 看到的任何其他变量都会在编译时触发致命错误。\n\n\
  ### 小心裸字\n\nPerl 默认将没有其他解释的标识符视为字符串（有时称为“诗歌模式”），这是另一个潜在的错误来源，很难通过视觉检查发现。你能发现以下代码中的错误吗？\n\
  \n```\nfor ( $i = 0 ; $i < 10 ; $i++ ) {\n    print $a[i]; # 哎呀——本意是 $a[$i]\n}\n\
  ```\n\n### 要点回顾\n\n- 使用 `perldoc` 阅读 Perl 的文档。\n- 在 Web 上阅读未安装模块的文档。\n- 设置本地文档服务器，通过\
  \ Web 浏览器阅读本地文档。\n\n\n\n\n\n下标 `i`（本应为 `$i`）被解释为字符串 \"i\"，在此上下文中被解释为数值 0。因此，`$a[0]`\
  \ 的内容被打印了十次。使用 `strict 'subs'` 会关闭诗意模式，并对不当使用的标识符生成错误：`use strict 'subs';`\n\n```\n\
  for ( $i = 0 ; $i < 10 ; $i++ ) {\n    print $a[i]; # 错误\n}\n```\n\n`strict 'subs'`\
  \ 编译指示与允许的裸字引用形式兼容——单独出现在哈希键花括号内，或位于胖箭头左侧：`use strict 'subs';`\n\nptg\n\n```\n$a{name}\
  \ = 'ok';          # 裸字作为哈希键是允许的\n$a{-name} = 'ok';         # 同样允许\nmy %h = (\n\
  \    last  => 'Smith',     # => 左侧的裸字是允许的\n    first => 'Jon'\n);\n```\n\n### 避免软引用\n\
  \n`strict refs` 编译指示禁用软引用（第 58 条）。软引用通常不是错误的来源，但也不是广泛使用的特性。当你尝试解引用一个实际上是字符串的东西时，就会发生软引用。在没有严格模式的情况下，Perl\
  \ 会使用字符串中的值作为变量名：\n\n```\nno strict 'refs';\n$not_array_ref = 'buster';\n@{$not_array_ref}\
  \ = qw( 1 2 3 ); # 实际上是 @buster 下载自 <www.wowebook.com>\n```\n\n## 第 4 条：理解符号告诉你什么。\
  \ ❘ 17\n\n### 需要记住的要点\n\n- 默认情况下，Perl 是一种非常宽松的编程语言。\n- 当你可以明确表达时，不要让 Perl 猜测你的意思。\n\
  - 启用 `strict` 让 Perl 捕获常见的编程问题。\n\n### 第 4 条：理解符号告诉你什么。\n\n符号是你在 Perl 变量名开头和解引用时看到的那些有趣字符，它们常常是人们混淆\
  \ Perl 语法的根源。程序员之所以困惑，是因为他们猜测符号的含义，在邮件列表中读到关于它们的错误猜测，或者是从塔罗牌占卜师那里学到的 Perl。人们害怕它们，而实际上，符号是他们最好的朋友。\n\
  \n符号与变量类型本身的关系非常松散。事实上，你甚至不需要有一个变量。根本不要把它们看作变量类型指示符。\n\n`$` 表示你正在处理一个单一值，它可以是一个标量变量，也可以是数组或哈希中访问的单个元素：\n\
  \nptg\n\n```\n$scalar\n$array[3]\n$hash{'key'}\n```\n\n`@` 表示你正在处理多个值，因此你会将其用于数组或哈希，因为它们是\
  \ Perl 仅有的集合类型：\n\n```\n@array\n@array[0,2,6]        # 数组切片\n@hash{ qw(key1 key2)\
  \ } # 哈希切片\n```\n\n`%` 符号有点特殊。它表示你将某物视为哈希，并且只有一种变量类型和访问方法可以充当哈希，那就是整个哈希本身：\n\n```\n\
  %hash\n```\n\nPerl 也有用于子程序（`&`）和类型团（`*`）的符号，但它们仅用于这些类型，因此我们在此不赘述。\n\n下载自 <www.wowebook.com>\n\
  \n既然你知道不要用符号来识别变量类型，那么如何判断你正在查看的是哪种变量呢？有三个因素需要考虑：符号、标识符以及数组或哈希可能的索引语法。你可以在对数组的单个元素访问中看到这三个因素：\n\
  \n```\n符号 标识符 索引\n  $   name   [3]\n$name[3]\n```\n\n符号是 `$`，标识符是 `name`，索引是 `[3]`。你知道变量是\
  \ `name`，并且知道它是一个数组变量，因为只有数组类型使用 `[ ]` 进行索引。对于哈希，你也是同样的做法：\n\n```\n符号 标识符 索引\n \
  \ $   name   {'Buster'}\n$name{'Buster'}\n```\n\n你知道你正在处理一个哈希变量，因为你使用 `{ }` 进行索引，并且使用字符串作为索引。`$`\
  \ 只告诉你这个变量包含哈希中的一个单一元素。\n\n如果你没有看到单个元素访问，你可以通过查看符号来确定变量类型：\n\n```\n$scalar\n@array\n\
  %hash\n```\n\n你还使用符号来解引用匿名标量、数组和哈希。你使用相同的规则来确定引用类型（第 59 条）。\n\n### 需要记住的要点\n\n-\
  \ 符号与数据相关，而不一定与变量类型相关。\n- `$` 表示单个元素。\n- `@` 表示元素列表。\n\n下载自 <www.wowebook.com>\n\
  \n## 第 5 条：了解你的变量命名空间。\n\nPerl 中有七种独立的包变量或类似变量的元素：标量变量、数组变量、哈希变量、子程序名、格式名、文件句柄和目录句柄。\n\
  \n每种不同类型的包变量都有自己的命名空间。改变一种变量的值不会以任何方式影响同名其他类型变量的值。例如，标量变量 `$a` 独立于数组变量 `@a`：\n\n\
  ```\nmy $a = 1;          # 设置标量 $a = 1\nmy @a = ( 1, 2, 3 ); # @a = (1,2,3) 但 $a\
  \ 仍然是 1\n```\n\n此外，Perl 程序中的每个包都定义了自己的一组命名空间。例如，包 `main` 中的 `$a` 独立于包 `foo` 中的 `$a`：\n\
  \n```\n$a = 1;             # 设置标量 $main::a = 1\npackage foo;        # 默认包现在是 foo\n\
  $a = 3.1416;        # $foo::a 是 3.1416；$main::a 仍然是 1\n```\n\n你必须像 Perl 一样，同时查看标识符的左侧和右侧，才能确定该标识符引用的是哪种变量。例如，访问数组和哈希单个元素的语法以\
  \ `$` 开头，而不是 `@` 或 `%`。`$` 表示结果是一个标量值，而不是你在引用一个标量变量（第 4 条）：\n\n```\nmy $a = 1;\n\
  my @a = ( 1, 2, 3 );\nmy %a = ( a => 97, b => 98 );\n$a[3] = 4;          # $a 仍然是\
  \ 1；@a 现在是 (1,2,3,4)\n$a{'c'} = 99;       # $a, @a 仍然相同；\n                    #\
  \ %a 现在有三个键值对\n```\n\n并非 Perl 中所有类似变量的项都以标点字符为前缀。子程序名可以以 & 符号（`&`）为前缀，但 & 符号通常是可选的。在某些情况下，子程序参数周围的括号也可以省略，如下例所示。\n\
  \n定义一个名为 \"hi\" 的子程序，看看调用它的不同方式：\n\n```\nsub hi {\n    my $name = shift;\n    return\
  \ \"hi, $name\\n\";\n}\n```\n\n你可以使用“旧式”语法调用子程序，包括 & 符号和括号：\n\n```\nprint &hi(\"\
  Fred\");\n```\n\n这种风格在新代码中不常见。相反，你会看到子程序只带括号调用：\n\n```\nprint hi(\"Fred\");\n```\n\
  \n括号为 `perl` 提供了足够的信息，使其知道 `hi` 是一个子程序。如果 `hi` 在你使用它之前已经声明或定义，那么连括号也是可选的：\n\n```\n\
  print hi \"Fred\";\n```\n\n文件句柄、格式名和目录句柄不以标点字符为前缀，而是在上下文中被识别。文件句柄、目录句柄和格式名彼此独立，即使它们都命名为\
  \ `TEST`：\n\n```\nopen TEST, '>', \"$$.test\"   # 打开文件句柄 TEST\nprint TEST \"test\
  \ data\\n\";   # 打印到文件句柄 TEST\nopendir TEST, \".\";          # 名为 TEST 的目录句柄\n#\
  \ 名为 TEST 的格式\nformat TEST =\n@<<<<<<<<<<<<< @<<<< @<<<<\n$name,         $lo,  \
  \ $hi\n.\n```\n\n如果这看起来可能会让人困惑，那确实可能。幸运的是，由于 `IO::File` 和 `IO::Dir` 的存在，现在人们通常将文件句柄和目录句柄存储在对象中。\n\
  \n### 需要记住的要点\n\n- 每种变量类型都有自己的命名空间。\n- 同名不同类型的变量互不影响。\n- 不同包中的变量可以同名，但互不影响。\n\n\
  下载自 <www.wowebook.com>\n\n## 第 6 条：了解字符串比较和数值比较的区别。\n\nPerl 有两套完全不同的比较运算符，一套用于比较字符串，一套用于比较数字。了解它们的区别并保持清晰是值得的，因为使用错误的比较运算符可能会成为难以发现的错误的来源。\n\
  \n\n\n\n\n用于比较字符串的运算符使用字母，看起来像单词或 FORTRAN。字符串是逐字符比较的——即通过比较字符串中字符的值（或根据当前区域设置，如果你使用了\
  \ `use locale`），包括大小写、空格等：\n\n```\n'a' lt 'b' # TRUE\n'a' eq 'A' # FALSE -- 大小写\n\
  \"joseph\" eq \"joseph \" # FALSE -- 空格算在内\n```\n\n数值比较运算符使用标点符号，看起来像代数或 C 语言：\n\
  \n```\n0 < 5 # TRUE\n10 == 10.0 # TRUE\n```\n\n字符串比较运算符不应用于比较数字，因为它们不能正确比较数字（除非你对“正确”的定义是“10”排在“2”之前）。同样，用于比较字符串的数值运算符也是如此：\n\
  \n```\n'10' gt '2' # FALSE -- '1' 排在 '2' 之前\n\"10.0\" eq \"10\" # FALSE -- 不同的字符串\n\
  'abc' == 'def' # TRUE -- 两者对 == 来说都像 0\n```\n\n这种错误会导致条件判断在你不想为真时变为真，因为两个操作数都变成了数字：\n\
  \n```\nmy $hacker = 'joebloe';\nif ( $user == $hacker ) { # 错误 -- 对字符串使用了 ==\n \
  \   deny_access();\n}\n```\n\nPerl 的排序运算符默认使用字符串比较。不要用字符串比较来排序数字（第 22 条）！\n\n解决\
  \ `eq` 和 `==` 混淆的一种方法是避免使用两者。与其自己判断正确与否，不如让 Perl 通过智能匹配运算符 `~~`（第 23 条）来替你思考。它会查看两侧并决定该怎么做。它还使用了“类数字”字符串的概念——即看起来像数字的字符串。\n\
  \n这些比较实际上是数值比较，因为智能匹配在右侧看到数字，或者在左侧看到数字而右侧看到类数字字符串，从而使用 `==` 运算符进行比较：\n\n```\nuse\
  \ 5.010;\nif ( 123 ~~ '456' ) { ... } # 数字和类数字：FALSE\nif ( '123.0' ~~ 123 ) { ...\
  \ } # 字符串和数字：TRUE\nif ( 'Mimi' ~~ 456 ) { ... } # 字符串和数字：FALSE\n```\n\n否则，智能匹配会使用\
  \ `eq` 运算符进行字符串比较：\n\n```\nif ( 'Mimi' ~~ 'Mimi' ) { ... } # 字符串和字符串：TRUE\n```\n\
  \n这可能有点棘手。两侧都是类数字字符串时，仍然是字符串比较（`eq` 运算符）：\n\n```\nif ( '123.0' ~~ '123' ) { ...\
  \ } # 类数字和类数字：FALSE\n```\n\n当你在智能匹配中使用变量时需要小心，因为它们在程序中的历史很重要。如果你之前对 `$var` 做了某些触发转换的操作（第\
  \ 8 条），你可能会得到意想不到的结果，因为智能匹配选择了错误的比较类型。在以下情况中，你从一个字符串开始，但通过将其与数值运算符一起使用将其转换为数字，从而强制使用\
  \ `==` 运算符进行数值比较：\n\n```\nuse 5.010;\nif ( ( '123' + 0 ) ~~ '123.0' ) { # 数字和类数字：TRUE\n\
  \    say \"匹配 1！\";\n}\nmy $var = '123';\nif ( ( $var + 0 ) ~~ '123.0' ) { # 数字和类数字：TRUE\n\
  \    say \"匹配 2！\";\n}\n```\n\n```\nmy $var2 = '123';\n$var2 + 0;\nif ( $var2 ~~\
  \ '123.0' ) { # 数字和类数字：TRUE\n    say \"匹配 3！\";\n}\n```\n\n然而，如果你从一个数字开始但将其转换为字符串，Perl\
  \ 只会将其视为字符串并强制使用 `eq` 语义。\n\n```\nuse 5.010;\nmy $var3 = 123;\n$var3 = \"$var3\"\
  ;\nif ( $var3 ~~ '123.0' ) { # 字符串和类数字，eq，FALSE\n    say \"匹配 4！\";\n}\n```\n\n\
  ### 要记住的事情\n\n- 记住字符串和数字的比较与排序方式不同。\n- 使用字母比较运算符来比较字符串。\n- 使用符号比较运算符来比较数字。\n\n##\
  \ 第 7 条：了解哪些值是假值并据此进行测试。\n\n由于 Perl 中的数值和字符串数据具有相同的标量类型，并且布尔运算可以应用于任何标量值，因此 Perl\
  \ 的逻辑真值测试必须同时适用于数字和字符串。\n\n基本测试是：`0`、`'0'`、`undef` 和 `''`（空字符串）是假值。其他所有值都是真值。\n\n\
  更准确地说，当你在**布尔上下文**（有时用于指代控制表达式中的条件，例如 `?:` 运算符、`||` 和 `&&`）中使用一个量时，它首先会被转换为字符串（第\
  \ 8 条）。然后 Perl 测试字符串结果。如果结果是空字符串，或者结果恰好由单个字符 `'0'` 组成，则结果为假。否则结果为真。注意，这条规则意味着 `undef`\
  \ 会被评估为假，因为除了 `defined` 运算符之外，它对所有东西都表现为 `0` 或空字符串。\n\n这通常工作得很好。如果出现问题，很可能是因为你测试了一个量是否为假，而实际上你应该测试它是否已定义：\n\
  \n```\nwhile ( my $file = glob('*') ) { # 错误\n    do_something($file);\n}\n```\n\
  \n这个 `glob` 在绝大多数情况下工作良好。每次循环时，`glob('*')` 从当前目录产生另一个文件名，存入 `$file`。一旦 `glob` 遍历完目录中的所有文件名，它会返回\
  \ `undef`，这看起来像空字符串，因此为假，导致 `while` 循环终止。\n\n但有一个问题。如果当前目录中有一个名为 `0` 的文件，它也会表现为假，导致循环提前终止。为了避免这种情况，使用\
  \ `defined` 运算符专门测试 `undef`：\n\n```\nwhile ( defined( my $file = glob('*') ) ) {\
  \ # 正确\n    do_something($file);\n}\n```\n\n行输入运算符 `<>` 的情况完全相同，尽管 Perl 会自动为你处理。看起来你在这个\
  \ `while` 中测试来自 `STDIN` 的行：\n\n```\nwhile (<STDIN>) {\n    do_something($_);\n}\n\
  ```\n\n然而，这是一个特例，Perl 会自动转换为检查 `$_` 是否已定义：\n\n```\nwhile ( defined( $_ = <STDIN>\
  \ ) ) { # 隐式完成\n    do_something($_);\n}\n```\n\n你可以通过 `B::Deparse` 自行验证，它会撤销 `perl`\
  \ 编译的结果，让你看到它对代码的理解：\n\n```\n% perl -MO=Deparse \\\n    -e 'while( <STDIN> ) { do_something($_)\
  \ }'\nwhile (defined($_ = <STDIN>)) {\n    do_something($_);\n}\n-e syntax OK\n\
  ```\n\n如果你想使用另一个变量来保存刚读取的行，你必须自己进行 `defined` 检查：\n\n```\nwhile ( defined( my $line\
  \ = <STDIN> ) ) {\n    do_something($line);\n}\n```\n\n### 数组的末尾\n\n数组元素未定义并不意味着你已经超出了数组的边界。通常，Perl\
  \ 对让其他语言抓狂的越界访问非常宽容：\n\n```\nmy @cats = qw( Buster Roscoe Mimi );\nmy $favorite\
  \ = $cats[8]; # 那里没有猫，所以是 undef\n```\n\n在数组中间有一个 `undef` 值也是完全允许的：\n\n```\nmy @cats\
  \ = qw( Buster Roscoe Mimi );\n$cats[1] = undef; # 安息吧 Roscoe\n```\n\n你不应该使用该值来决定是否已经遍历了数组的每个元素：\n\
  \n```\nwhile ( defined( my $cat = shift @cats ) ) { # 错误\n    print \"我有一只猫叫 $cat\\\
  n\";\n}\n```\n\n相反，使用 `foreach` 确保遍历所有元素，并跳过那些未定义的：\n\n```\nforeach my $cat (@cats)\
  \ {\n    next unless defined $cat;\n    print \"我有一只猫叫 $cat\\n\";\n}\n```\n\n如果你需要知道数组的最后一个元素，不要寻找\
  \ `undef` 值。`$#cats` 语法会给你最后一个元素。\n\n```\nfor ( my $i = 0 ; $i <= $#cats ; $i +=\
  \ 2 ) {\n    next unless defined $cat[$i];\n    print \"我有一只猫叫 $cat[$i]\\n\";\n\
  }\n```\n\n### 哈希值\n\n\n\n\n你可能还需要使用不同的测试策略来检查哈希中是否存在某个元素，因为 `undef` 在哈希中是完全合法的值。假设\
  \ `%hash` 初始时未定义。检查键 `foo` 的结果在作为值时是假，使用 `defined` 时也是假，使用 `exists` 时同样是假：\n\n```\n\
  my %hash;\n\nif ( $hash{'foo'} ) { ... }       # 假\n\nif ( defined $hash{'foo'}\
  \ ) { ... } # 也是假\n\nif ( exists $hash{'foo'} ) { ... } # 也是假\n```\n\n一旦你给某个键赋值，即使赋的是假值或未定义值，该键也会存在：\n\
  \n```\n$hash{'foo'} = undef;   # 赋一个未定义值\n\nif ( $hash{'foo'} ) { ... }       #\
  \ 仍然是假\n\nif ( defined $hash{'foo'} ) { ... } # 仍然是假\n\nif ( exists $hash{'foo'}\
  \ ) { ... } # 现在为真\n```\n\n```\nprint keys %hash;   # ('foo')\n```\n\n赋一个已定义的值，即使它是假值，也会使该值变为已定义：\n\
  \n```\n$hash{'foo'} = '';\n\nif ( $hash{'foo'} ) { ... }       # 仍然是假\n\nif ( defined\
  \ $hash{'foo'} ) { ... } # 现在为真\n\nif ( exists $hash{'foo'} ) { ... } # 现在为真\n```\n\
  \n在测试哈希元素访问之前，先弄清楚你真正想测试什么。没有唯一正确的答案；这取决于你希望如何处理该值。\n\n**要记住的事项**\n\n■ 有四个假值：`undef`、`''`、`0`\
  \ 和 `'0'`。\n\n■ 除了这四个假值之外的所有值都是真值。\n\n■ 确保你测试的是你想要的值的类型，而不仅仅是真值。\n\n## 第 8 条 理解字符串与数字之间的转换\n\
  \nPerl 的标量变量既可以包含字符串数据，也可以包含数字数据。它们也可以同时包含两者，通常是将字符串数据转换为数字，或反之的结果。\n\nPerl 会根据需要自动将值从数字表示转换为字符串表示，或反之。例如，如果字符串出现在像\
  \ `+` 这样的数字运算符旁边，Perl 会在进行算术运算之前将字符串值转换为数字。如果数字是模式匹配的对象，Perl 会先将数字转换为字符串。\n\nPerl\
  \ 期望字符串的地方称为**字符串上下文**，期望数字的地方称为**数字上下文**。这些术语了解即可，但本书中不常使用，因为它们很少造成实际差异。\n\nPerl\
  \ 用于将数字转换为字符串的函数是 C 标准库的 `sprintf()`，格式为 `\"%.20g\"`。如果你需要使用特定格式，请使用 Perl 的 `sprintf`：\n\
  \n```\nmy $n = sprintf \"%10.4e\", 3.1415927;   # \"3.1416e+00\"\n```\n\n用于将字符串转换为数字的函数是\
  \ C 标准库的 `atof()`。任何前导空白字符都会被忽略。Perl 会使用字符串中看起来像数字的前导部分，并忽略其余部分。Perl 会将任何看起来不像数字的内容转换为\
  \ `0`。例如：\n\n```\nmy $n = 0 + \"123\";        # 123\nmy $n = 0 + \"123abc\";   \
  \  # 也是 123 -- 尾部内容被忽略\nmy $n = 0 + \"\\n123\";      # 也是 123 -- 前导空白\nmy $n = 0\
  \ + \"a123\";       # 0 -- 开头没有数字\nmy $n = 0 + \"\\x{2165}\";   # 0 -- 罗马数字不是数字\n\
  ```\n\n转换过程不识别八进制或十六进制。请使用 `oct` 运算符来转换八进制或十六进制字符串：\n\n```\nmy $n = 0 + \"0x123\"\
  ;          # 0 -- 看起来像数字 0\nmy $n = 0 + oct(\"0x123\");     # 291 -- oct 将八进制和十六进制转换为十进制\n\
  print \"模式（八进制）：\";       # 提示输入文件模式\nchmod <STDIN>, $file;         # 错误 -- 来自 STDIN\
  \ 的字符串被解释为十进制，而非八进制\nprint \"模式（八进制）：\";       # 提示输入文件模式\nchmod oct(<STDIN>), $file;\
  \    # 正确 -- 模式字符串被转换为八进制\n```\n\n当 Perl 自动将数字转换为字符串或反之，它会同时保留两种表示，直到变量的值被改变。\n\n\
  ### 同时作为字符串和数字\n\n通常，变量包含字符串值还是数字值并不重要，但在某些情况下确实重要。例如，按位数字运算符如果应用于数字，则对整个数值进行操作；如果应用于字符串，则按字符进行操作：\n\
  \n```\nmy $a = 123;\nmy $b = 234;\nmy $c = $a & $b;   # 数字 106\n\n$a = \"$a\";\n\
  $b = \"$b\";\nmy $d = $a & $b;   # 字符串 \"020\"\n```\n\n你可以通过 `Devel::Peek` 模块看到这一点。从一个部分能转换为数字的字符串开始，然后在数值运算中使用它（不改变它）：\n\
  \n```\nuse Devel::Peek qw(Dump);\n\nmy $a = '12fred34';   # 转换为 12\n\nprint STDERR\
  \ \"转换前：\";\nDump($a);\n\nmy $b = $a + 0;\n\nprint STDERR \"转换后：\";\nDump($a);\n\
  \nprint STDERR \"\\n$a\\n\";\n```\n\n`Dump` 输出显示了 Perl 跟踪的内容。虽然我们不深入 Perl 内部，但你可以看到在转换前，Perl\
  \ 有一个 PV 槽用于存储实际的字符串值。转换后，它还有 IV 和 NV 槽用于存储转换后的数值：\n\n```\n转换前：SV = PV(0x801038)\
  \ at 0x80e770\nREFCNT = 1\nFLAGS = (PADMY,POK,pPOK)\nPV = 0x204c10 \"12fred34\"\\\
  0\nCUR = 8\nLEN = 12\n\n转换后：SV = PVNV(0x8023c0) at 0x80e770\nREFCNT = 1\nFLAGS =\
  \ (PADMY,IOK,NOK,POK,pIOK,pNOK,pPOK)\nIV = 12\nNV = 12\nPV = 0x204c10 \"12fred34\"\
  \\0\nCUR = 8\nLEN = 12\n```\n\n错误变量 `$!` 是一个具有“魔法”属性的变量示例。当它在数字上下文中使用时，返回系统变量 `errno`\
  \ 的值；但在字符串上下文中，它返回 `perror()` 函数（或系统等效函数）的字符串：\n\n```\nopen \"\";   # 无效文件名；应产生错误\n\
  print \"$!\\n\";          # \"没有那个文件或目录\"\nprint 0 + $!, \"\\n\";    # \"2\"（或其他值）\n\
  ```\n\n这个问题也影响智能匹配运算符（第 23 条），该运算符被 `given-when`（第 24 条）隐式使用。由于智能匹配会猜测需要哪种比较，它可能会做出意想不到的选择。在这个例子中，你使用智能匹配运算符测试两个字符串，期望它只匹配相同的字符串：\n\
  \n```\nuse 5.010;\n\nfor my $s ( '137', ' 137' ) {\n    given ($s) {\n        when\
  \ ('137') { say \"$s 匹配 '137'\"; continue }\n        when (' 137') { say \"$s 匹配\
  \ ' 137'\" }\n    }\n}\n```\n\n输出显示字符串只精确匹配自身：\n\n```\n137 匹配 '137'\n 137 匹配 ' 137'\n\
  ```\n\n然而，对程序稍作修改就会改变结果。如果你在算术表达式中使用该字符串，即使没有显式改变字符串，智能匹配也会进行数字比较而不是字符串比较：\n\n```\n\
  use 5.010;\n\nfor my $s ( '137', ' 137' ) {\n    my $t = $s + 0;\n    given ($s)\
  \ {\n        when ('137') { say \"$s 匹配 '137'\"; continue }\n        when (' 137')\
  \ { say \"$s 匹配 ' 137'\" }\n    }\n}\n```\n\n现在你会得到比预期更多的匹配：\n\n```\n137 匹配 '137'\n\
  \ 137 匹配 ' 137'\n137 匹配 '137'\n 137 匹配 ' 137'\n```\n\n### 创建你自己的双值变量\n\n你不需要使用 Perl\
  \ 的内部转换来创建“双值变量”——即根据上下文具有不同字符串和数字值的变量。下面是一个子程序，它同时返回数字错误码和错误字符串，全部在一个普通标量值中：\n\n\
  ```\nuse Scalar::Util qw(dualvar);\n\nsub some_sub {\n    # ...\n    if ($error)\
  \ {\n        return dualvar( -1,\n            '你不被允许这样做' );\n    }\n}\n\nmy $return_value\
  \ = some_sub();\n```\n\n变量 `$return_value` 会保持其不同的数字和字符串值，直到你改变它。不过，既然你现在知道了这一点，不要到处使用它。把它留到非常特殊的情况，比如在会议和鸡尾酒会上给人留下深刻印象。\n\
  \n**要记住的事项**\n\n■ Perl 根据上下文将标量用作字符串或数字。\n\n■ Perl 使用其最佳猜测将字符串转换为数字。\n\n■ 如果字符串看起来不像数字，Perl\
  \ 会将其转换为 `0`。\n\n## 第 9 条 了解列表与数组的区别\n\n**要记住的事项**\n\n（原文中第 9 条未列出具体事项。）\n\n\n\n\
  \n\n## 第 9 条 了解列表与数组的区别\n\n列表和数组是不同的东西。如果你能识别出何时遇到的是列表还是数组，并了解各自适用的规则，那么你将远远领先于大多数人（甚至包括许多\
  \ Perl 书籍）。Perl 中一些最强大的惯用法正是基于这种区别。\n\n列表是标量的有序集合。你可以自己构建列表，从内置函数和子例程中获取它们作为返回值，或者从其他列表中提取它们。\n\
  \n数组是一个包含列表的变量，但它本身不是列表。它是列表的容器。\n\n部分混淆源于共享的语法。你可以使用相同的语法从列表和数组中提取单个元素：\n\n```\n\
  (localtime)[5]; # 年份\n$array[5];\n```\n\n你也可以使用相同的语法对列表和数组进行切片：\n\n```\n(localtime)[\
  \ 5, 4, 3 ]; # 年、月、日\n@array[ 5, 4, 3 ];\n```\n\n### 逗号运算符\n\n虽然你可以拥有一个数组（它是一个变量）并在标量上下文中使用它，但不存在标量上下文中的列表这种东西。如果你在标量上下文中使用数组，你会得到数组中元素的个数：\n\
  \n```\nmy @array = qw( Buster Mimi Roscoe );\nmy $count = @array; # 3\n```\n\n列表始终只是列表。它没有标量解释。考虑一下你是如何构建列表的。你用逗号运算符（是的，它是一个运算符）分隔一系列标量：\n\
  \n```\n( 'Buster', 'Mimi', 'Roscoe' )\n```\n\n这是一个列表吗？嗯，你实际上还不知道。你必须在期望列表的表达式里使用这一系列标量。将其赋值给数组或在`foreach`循环中使用它，会提供列表上下文：\n\
  \n```\nmy @cats = ( 'Buster', 'Mimi', 'Roscoe' );\nforeach ( qw( Buster Mimi Roscoe\
  \ ) ) {\n    ...;\n}\n```\n\n（`qw()`引号不会改变任何东西。它只是一个语法快捷方式。）\n\n如果你将相同的字面文本赋值给一个标量变量呢？那时你有一个列表吗？`$scalar`中会出现什么？\n\
  \n```\nmy $scalar = ( 'Buster', 'Mimi', 'Roscoe' );\nmy $scalar = qw( Buster Mimi\
  \ Roscoe );\n```\n\n许多人猜测`$scalar`会得到值 3，因为他们认为右边是一个包含三个元素的列表。但右边并没有列表；他们有的是由逗号运算符分隔的一系列标量。标量上下文中的逗号运算符返回其最右边的元素。Perl\
  \ 将值`Roscoe`赋给`$scalar`。\n\n人们搞错这个概念是因为他们测试的方式不对。常见的尝试列表是什么？\n\n```\nmy $scalar\
  \ = ( 1, 2, 3 );\n```\n\n在这种情况下，右边标量的数量恰好与右边最后一个元素相同，但你仍然没有列表。\n\n### 列表上下文中的赋值\n\
  \nPerl 的另一个暗角是赋值运算符。大多数人认为他们理解它，但没有意识到它和其他运算符一样有返回值。在列表上下文中，赋值运算符返回右边元素的数量。它并不是赋值那个数量；它只是返回值，几乎没有人用它做任何事：\n\
  \n```\nmy $elements = my @array = localtime;\n```\n\n赋值运算符是右结合的，所以最右边的赋值运算符先工作，将`localtime`产生的列表赋值给`@array`。这部分操作有自己的结果，然后将其赋值给`$elements`。如果你用分组括号写出操作顺序，它看起来像：\n\
  \n```\nmy $elements = ( my @array = localtime );\n```\n\n这里起作用的规则是：标量上下文中的列表赋值返回赋值右边元素的数量。这是真的；在`perlop`中阅读相关内容。这是一个非常重要的概念，你应该再读一遍：标量上下文中的列表赋值返回赋值右边元素的数量。\n\
  \n知道这个规则后，你可以利用它。如果你想计算某个产生列表的东西的元素个数，你可以先将其赋值给一个列表，然后再赋值给一个标量，就像之前的`localtime`例子那样。然而，由于规则是右结合的，你实际上可以在中间提供空列表（不赋值给任何变量）：\n\
  \n```\nmy $elements = () = localtime;\n```\n\n有时这被称为 goatse 运算符，并且通常不加空格地写，使其看起来像山羊的头（或者别的什么）：\n\
  \n```\nmy $elements =()= localtime;\n```\n\n当你想要计算全局匹配或`split`产生的元素个数，但又不想对这些元素做任何操作时，这就很有用。你将空列表赋值以设置上下文，然后保存赋值的结果：\n\
  \n```\nmy $count =()= m/(...)/g;\nmy $count =()= split /:/, $line;\n```\n\n### 需要记住的要点\n\
  \n- 列表是标量的集合。\n- 数组是存储列表的容器变量。\n- 尽管许多操作对列表和数组看起来相同，但有些是不同的。\n\n## 第 10 条 想要空数组时不要赋值`undef`\n\
  \nPerl 中未初始化的标量变量的值是`undef`，这是一个表示没有值的特殊值。你可以通过将`undef`赋值给标量变量或使用`undef()`函数将其重置为未初始化状态：\n\
  \n```\nmy $toast = undef;\nundef $history;\n```\n\n然而，未初始化的数组变量的值是`()`，即空列表。如果你将`undef`赋值给一个数组变量，你实际得到的是一个包含一个元素（即`undef`）的列表。不要将`undef`赋值给数组变量！由于在\
  \ Perl 中，单元素列表求值为真，即使那个元素是`undef`，你也可能在代码中制造一些难以发现的问题：\n\n```\n@still_going = undef;\n\
  if (@still_going) { ... }\n```\n\n避免这种情况最简单的方法是，当你想要清空数组变量时，将空列表`()`赋值给它：\n\n```\n\
  my @going_gone = ();\n```\n\n你也可以使用`undef`函数：\n\n```\nundef @going_gone;\n```\n\n\
  `defined`运算符是唯一能区分`undef`与 0 或空字符串`''`的方法。`defined`运算符可以作用于任何值，只要变量不是未定义的，它就返回真：\n\
  \n```\nif ( defined($a) ) { ... }\nif ( defined(@a) ) { ... }\n```\n\n你可以将`undef`赋值给数组的一个元素，但这不会改变数组的大小，它只是替换了给定元素或一组元素的值，可能会产生一个稀疏数组：\n\
  \n```\n$sparse[3] = undef;\n@sparse[ 1, 5, 7 ] = ();\n```\n\n通过向数组添加未定义的值，你可能会消耗相当多的内存：\n\
  \n```\n@sparse[ 0 .. 99 ] = ();\n```\n\n注意，`undef`是一个完全合理的元素值。你不能通过将`undef`值赋值给数组末尾的元素来缩短数组。\n\
  \n```\nmy @a = 1 .. 10;\n$a[9] = undef;\nprint scalar(@a), \"\\n\"; # \"10\"\n```\n\
  \n要实际缩短数组而不给它赋一个全新的值，你必须使用像`pop`这样的数组运算符：\n\n```\nmy $val = pop @a;\nprint scalar(@a),\
  \ \"\\n\" # \"9\"\n```\n\n或者`splice`：\n\n```\nsplice @a, -2;\nprint scalar(@a),\
  \ \"\\n\"; # \"7\"\n```\n\n或者赋值给`$#array_name`：\n\n```\n$#a = 4;\nprint scalar(@a),\
  \ \"\\n\"; # \"5\"\n```\n\n与数组类似，你不能通过将`undef`赋值给哈希来取消定义它。实际上，将任何包含奇数个元素的列表赋值给哈希都会产生一条警告信息：\n\
