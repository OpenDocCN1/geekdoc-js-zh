  ### 要记住的事项\n\n- 内联其他语言的代码以访问第三方库。\n- 在通过内联其他语言的代码进行优化之前，先改进你的 Perl 算法。\n\n## 第 86\
  \ 项。使用 XS 实现底层接口和速度。\n\n\n\n\nXS 是一种胶水语言，用于将 Perl 与 C 或 C++ 代码连接起来。它通过一个特殊的预处理器为你处理数据类型转换和其他细节。\n\
  \n借助 XS，你可以用 C 或 C++ 编写函数，并从 Perl 脚本中调用它们。在 XSUB（即连接 Perl 和 C 的子程序）内部，你可以完全访问 Perl\
  \ 的内部机制。你可以创建变量、修改它们的值、执行 Perl 代码，或者做任何你想做的事情。\n\n许多过去你不得不使用 XS 的场景，现在都可以通过 `Inline`\
  \ 系列模块（第 85 条）更优雅地处理。请务必也考虑用它们进行跨语言集成。\n\n下载地址：<www.wowebook.com>\n\n一个 XS 模块实际上是一个动态加载的可共享库。创建它的过程很复杂，充满了细节。幸运的是，通过\
  \ XS 接口，你可以获得一组工具，它们会为你处理大部分细节。\n\n对于相当简单的情况，你只需运行 `x2hs` 来获取一组样板文件；添加一些 Perl 和\
  \ XS 代码；然后运行 `make`。有用于构建共享库、测试、构建发行包和安装的 make 目标。\n\nXSUB 提供了一种便捷的方式，将操作系统支持的特性添加到\
  \ Perl 中——它们比 `syscall` 好用得多。你还可以使用 XSUB 来加速那些大部分时间都花在少数子程序上的脚本。当然，你也可以使用 XSUB 为你现有的\
  \ C 或 C++ 库添加 Perl 接口。\n\n假设你需要一个子程序，它返回列表的副本，但所有元素顺序随机。在 Perl 中，你可以编写一个费雪-耶茨洗牌算法：\n\
  \n```\nsub shuffle2 {\n    my @result = @_;\n    my $n = @result;\n    while ( $n\
  \ > 1 ) {\n        my $i = rand $n;\n        $n--;\n        @result[ $i, $n ] =\
  \ @result[ $n, $i ];\n    }\n    @result;\n}\n```\n\n如果效率对你的问题很重要，Perl 并不总是完成某项任务的最佳工具。你可以用\
  \ XS 重写这个函数，以获得 C 语言的速度。\n\n### 生成样板文件\n\n要开始实现你的 C 语言洗牌函数，请使用 `h2xs` 生成一组样板文件：\n\
  \n```\n% h2xs -A -n List::Shuffle\nWriting List-Shuffle/ppport.h\nWriting List-Shuffle/lib/List/Shuffle.pm\n\
  Writing List-Shuffle/Shuffle.xs\nWriting List-Shuffle/Makefile.PL\nWriting List-Shuffle/README\n\
  Writing List-Shuffle/t/List-Shuffle.t\nWriting List-Shuffle/Changes\nWriting List-Shuffle/MANIFEST\n\
  ```\n\n`h2xs` 程序会为你创建所有需要的文件存根，以便创建你的 C 胶水代码。\n\n### 编写和测试 XSUB\n\nXS 源代码放在以 `.xs`\
  \ 结尾的文件中。XS 编译器 `xsubpp` 会将 XS 编译成带有与 Perl 接口所需胶水代码的 C 代码。不过，你可能永远不需要自己调用 `xsubpp`，因为它会通过生成的\
  \ `Makefile` 自动调用。\n\nXS 源文件以一段 C 代码序言开始。序言之后是一个 `MODULE` 指令，用于设置 Perl 命名空间：\n\n\
  ```\nMODULE = List::Shuffle PACKAGE = List::Shuffle\n```\n\n这标志着实际 XS 源代码的开始。在尝试实现洗牌函数之前，先尝试一个简单的\
  \ XSUB，它只调用 C 标准库的 `log` 函数并返回结果：\n\n```\ndouble\nlog(x)\ndouble x\n```\n\n返回类型（`double`）单独一行，位于行首。接下来是函数名（`log`）和参数名列表（`(x)`）。返回类型和函数名之后的行通常缩进以提高可读性。在这个例子中，XSUB\
  \ 主体只有一行，声明 `x` 的类型是 `double`。\n\n在这样简单的情况下，`xsubpp` 会生成代码，创建一个名为 `log()` 的 Perl\
  \ 子程序，该子程序调用同名的 C 函数。生成的代码还包括必要的胶水代码，用于将 Perl 参数转换为 C 的 `double`，并将结果转换回来。（要了解其工作原理，请查看\
  \ `xsubpp` 生成的 C 代码——它实际上相当易读。）下面是一个稍微复杂的例子，它调用 UNIX 的 `realpath()` 函数（并非所有系统都可用）：\n\
  \n```\nchar *\nrealpath(filename)\nchar *filename\nPREINIT:\n    char realname[1024];\
  \ /* 或使用 MAXPATHLEN */\nCODE:\n    RETVAL = realpath(filename, realname);\nOUTPUT:\n\
  \    RETVAL\n```\n\n这会创建一个 Perl 函数，它接受一个字符串参数并返回一个字符串值。XS 胶水代码负责将 Perl 字符串转换为 C\
  \ 的 `char *` 类型，再转换回来。当你在 Perl 中使用它时，它看起来和其他子程序没什么区别：`my $realname = realpath($filename);`\n\
  \n`CODE` 部分包含用于计算子程序结果的代码。`PREINIT` 部分包含 `CODE` 部分中使用的变量声明；它们应该放在这里，而不是 `CODE` 部分。`RETVAL`\
  \ 是 `xsubpp` 提供的一个“魔法”变量，用于保存返回值。最后，`OUTPUT` 部分列出了 XSUB 返回的值。通常这包括 `RETVAL`。它还可以包括被修改并通过引用调用方式返回的输入参数。\n\
  \n这些例子都返回单个标量值。为了编写返回标量列表的 `shuffle` 函数，你必须使用 `PPCODE` 部分，并自行处理参数和返回值的弹出与压入。这并没有听起来那么困难。要开始，请在\
  \ `Shuffle.xs` 中的 `MODULE` 行之后插入以下代码：\n\n```\nPROTOTYPES: DISABLE\n\nvoid\nshuffle(...)\n\
  PPCODE:\n{\n    int i, n;\n    SV **array; /* SV 是“标量值”类型 */\n    SV *tmp;\n\n \
  \   /* 分配存储空间 */\n    array = New(0, array, items, SV *);\n\n    for (i = 0; i <\
  \ items; i++) {\n        /* 复制输入参数 */\n        array[i] = sv_mortalcopy(ST(i));\n\
  \    }\n\n    n = items;\n    while (n > 1) { /* 洗牌 */\n        i = rand() % n;\n\
  \        tmp = array[i];\n        array[i] = array[--n];\n        array[n] = tmp;\n\
  \    }\n\n    for (i = 0; i < items; i++) {\n        XPUSHs(array[i]); /* 将结果压入栈\
  \ */\n    }\n\n    Safefree(array); /* 释放存储空间 */\n}\n```\n\n`PROTOTYPES: DISABLE`\
  \ 指令会关闭后续 XSUB 的 Perl 原型处理。\n\n这里的策略是将输入参数复制到一个临时数组中，进行洗牌，然后将结果压入栈。参数将是标量值，Perl\
  \ 内部使用 `SV *` 类型表示它们。在这个 XSUB 中，你使用 `PPCODE` 块而不是 `CODE` 块，以禁用栈上返回值的自动处理。传入的参数数量在魔法变量\
  \ `items` 中，参数本身在 `ST(0)`、`ST(1)` 等中。\n\n栈上的 `SV` 指针指向传递给 `shuffle()` 函数的实际值。你不需要这些，而是需要副本，因此你使用\
  \ `sv_mortalcopy()` 函数为每个传入的标量创建一个引用计数的克隆。\n\n这些标量被放入一个用 Perl 内部 `New()` 函数分配的数组中，然后你进行洗牌。洗牌后，你使用\
  \ `XPUSHs()` 函数将返回值逐个压入栈，并释放用于保存指针数组的临时存储空间。如果这一切看起来有些粗略（很可能如此），请查阅 `perlguts` 和\
  \ `perlxs` 手册页以获取更多详细信息。\n\n此时，你可以保存 `Shuffle.xs` 并构建它：\n\n```\n% make\n```\n\n\
  你会看到几行难以理解的输出，因为 `Shuffle.xs` 正在编译，构建的其他部分也在运行。如果构建成功，接下来创建一个测试脚本。\n\n打开测试脚本模板 `t/List-Shuffle.t`，添加一些行来测试你的新洗牌函数：\n\
  \n```\n# List-Shuffle.t\nuse Test::More tests => 2;\nBEGIN { use_ok('List::Shuffle')\
  \ }\nmy @shuffle = shuffle 1 .. 10;\ndiag \"@shuffle\";\npass 'shuffled';\n```\n\
