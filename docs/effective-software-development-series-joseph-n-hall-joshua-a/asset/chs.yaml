  \ from my_table');\n    $sth->execute();\n    while ( my ($row) = $sth->fetchrow_arrayref()\
  \ ) {\n        $results{ $row->[0] } += $row->[1];\n    }\n    $sth->finish();\n\
  \    $dbh->disconnect();\n    return \\%results;\n}\n\n1;\n```\n\n你可以创建一个用于测试的 SQLite\
  \ 数据库（条目 93），但 SQL 中的 `calculate()` 方法调用使得这很困难，因为它特定于你的生产数据库。尽管你可能考虑依赖注入（条目 89），但在某些情况下，你需要更多，尤其是当你无法控制需要测试的代码时。\n\
  \nptg\n\n### 使用 Test::MockObject\n\n在你的 `MySum` 情况下，最简单的方法是模拟数据库层。由于代码编写不佳并直接访问\
  \ `DBI`，你必须创建一个假的 `DBI` 对象来替代真实对象。\n\n首先创建一个“假”模块。你不想加载 `DBI`，因此必须欺骗 Perl，让它认为你已经加载了它。使用\
  \ `fake_module` 即可实现：\n\n```perl\nuse MySum;\nuse Test::More qw(no_plan);\nuse Test::Deep;\n\
  use Test::MockObject;\n\nmy $dbi_mock = Test::MockObject->new;\nmy $sth_mock = Test::MockObject->new;\n\
  \n$dbi_mock->fake_module( 'DBI',\n    connect => sub { $dbi_mock } );\nDownload\
  \ from <www.wowebook.com>\n**326** ❘ *第 10 章 测试*\n```\n\n一旦你欺骗了 Perl，让它认为已经加载了 `DBI`，你就可以告诉它如何响应方法。每当调用\
  \ `DBI->prepare` 时，你希望返回假的语句句柄 `$sth_mock`，并且希望 `disconnect` 始终返回真值：\n\n```perl\n\
  $dbi_mock->set_always( 'prepare', $sth_mock );\n$dbi_mock->set_true('disconnect');\n\
  ```\n\n类似地，你希望 `$sth_mock` 对象返回一些假数据。你假设 SQL 查询将返回你需要的内容；你不是在测试数据库或查询，而是在测试求和功能：\n\
  \n```perl\n$sth_mock->set_true( 'execute', 'finish' );\n$sth_mock->set_series(\n\
  \    'fetchrow_arrayref',\n    [ first => 40 ],\n    [ first => 70 ],\n    [ second\
  \ => 100 ]\n);\n```\n\n现在你可以调用 `sum_values_per_key`。即使它试图创建一个真实的 `DBI` 对象，`Test::MockObject`\
  \ 也会拦截这次尝试，并使用你模拟的方法：\n\n```perl\ncmp_deeply(\n    MySum->sum_values_per_key(\n\
  \        'dbi:Oracle:testdb', 'user',\n        'password', { RaiseError => 1 }\n\
  \    ),\n    { first => 110, second => 100 },\n    'sum values'\n);\n```\n\n你并不总是需要完全模拟一个对象才能运行测试。有时只需重写一两个方法即可。对于这种情况，使用\
  \ `Test::MockObject::Extends` 来选择性地替换方法：\n\n```perl\nuse Test::More 'no_plan';\n\
  use Test::MockObject::Extends;\nuse DateTime;\n\nmy $dt =\n    DateTime->new( year\
  \ => 1979, month => 10, day => 22 );\nDownload from <www.wowebook.com>\n*条目 92.\
  \ 模拟对象和接口以聚焦测试* ❘ **327**\n\n$dt = Test::MockObject::Extends->new($dt);\n$dt->set_always(\
  \ year => 2009 );\n\nis( $dt->year, 2009, 'year overridden' );\nis( $dt->month,\
  \ 10, 'month untouched' );\n```\n\n### 通过符号表重新定义方法\n\n有时 `Test::MockObject` 和 `Test::MockObject::Extends`\
  \ 的方法可能过于繁琐。如果必要，你不应该害怕修改符号表。\n\n如果你只需要重新定义 `DateTime` 中 `year` 方法的返回值，你可以替换该子例程的定义。最好在一个小范围内进行，以限制破坏。由于这对代码来说通常是个坏主意，Perl\
  \ 会警告你的替换。当你确实想这样做时，可以关闭 `redefine` 类别的警告：\n\n```perl\nuse Test::More 'no_plan';\n\
  use DateTime;\n\nptg\n\nmy $dt =\n    DateTime->new( year => 1979, month => 10,\
  \ day => 22 );\n\n{\n    no warnings qw/redefine/;\n    local *DateTime::year =\
  \ sub { return 2009 };\n    use warnings;\n\n    is( $dt->year, 2009, 'year overridden'\
  \ );\n    is( $dt->month, 10, 'month untouched' );\n}\n```\n\n现在每次调用 `year` 都会返回你的值\
  \ **2009**。\n\n有时你想保留原始子例程，只是在其周围添加更多代码。在这种情况下，你可以包装代码，但仍然使用原始代码。\n\n在重新定义方法之前，你将类型全局变量的\
  \ `CODE` 部分赋值给一个变量，从而保留原始定义。在这里，你将其保存在 `$original` 中，之后可以使用 `&$original` 再次调用它，使用前面的\
  \ `&` 且不带括号，以便它使用 `@_` 的当前值：\n\n```perl\nuse Test::More 'no_plan';\nuse DateTime;\n\
  Download from <www.wowebook.com>\n**328** ❘ *第 10 章 测试*\n\nmy $dt =\n    DateTime->new(\
  \ year => 1979, month => 10, day => 22 );\n\n{\n    no warnings qw/redefine/;\n\
  ```\n\n\n\n\n```\nmy $original = *DateTime::year{CODE};\n\nlocal *DateTime::year\
  \ = sub {\n\nmy $year = &$original;\n\nprint STDERR \"The real year is $year\\n\"\
  ; return 2009;\n\n};\n\nuse warnings;\n\nis( $dt->year, 2009, 'year overridden'\
  \ );\n\nis( $dt->month, 10, 'month untouched' );\n\n}\n```\n\n尽管你已经覆盖了该方法，但输出显示你仍然调用了原始方法：\n\
  \n```\nThe real year is 1979\nok 1 - year overridden\nok 2 - month untouched\n1..2\n\
  ```\n\n如果你真的想做这类事情，可能不希望手动操作；`Hook::LexWrap` 模块可以为你处理所有细节。\n\n### 覆盖 Perl 内置函数\n\
  \n有时你需要模拟的不是模块，而是像 `time` 这样的 Perl 内置函数。如果你不介意完全覆盖该方法，可以使用 `subs` 编译指令定义自己的版本，并优先使用它：\n\
  \n```\nmy $fixed_time = 1234567890;\nuse subs qw(time);\n```\n\n## 第 92 条：模拟对象和接口以聚焦测试\n\
  \n```\nsub time {\n    return $fixed_time;\n}\n\nis( time, $fixed_time, 'frozen\
  \ in time' );\n```\n\n如果你需要更精细的控制，可以在 `CORE::GLOBAL` 命名空间中覆盖方法，Perl 在此保存所有内置函数的定义。不过有一个技巧：你必须在\
  \ `BEGIN` 块中完成，然后才能使用它：\n\n```\nmy $fixed_time = 1234567890;\n\nBEGIN {\n    *CORE::GLOBAL::time\
  \ = sub { CORE::time };\n}\n\nok( time > $fixed_time, 'system time' );\n\n{\n  \
  \  no warnings qw(redefine);\n    local *CORE::GLOBAL::time = sub { $fixed_time\
  \ };\n    is( time, $fixed_time, 'frozen in time' );\n}\n```\n\n当你需要模拟那些在测试期间需要阻止的常规操作时，这尤其方便。例如，你知道\
  \ `unlink` 会删除文件，但你可能希望保留它们以便查看内容：\n\n```\nBEGIN {\n    *CORE::GLOBAL::unlink =\
  \ sub {\n        print \"Not unlinking @_\";\n    };\n}\n```\n\n现在任何调用 `unlink`\
  \ 的代码都会调用你的版本。\n\n### 要点回顾\n\n- `Test::MockObject` 允许你伪造类和方法。\n- 通过向类型全局变量赋值来重新定义子程序。\n\
  - 通过 `CORE::GLOBAL` 命名空间覆盖 Perl 内置函数。\n\n## 第 93 条：使用 SQLite 创建测试数据库\n\n与数据库管理系统交互的代码给测试带来了有趣的挑战。一种常见策略是创建数据库的测试版本，并在测试中连接到它。你可以用已知的数据集加载测试数据库，然后针对它编写测试。你的测试代码很简单，几乎不需要模拟对象（第\
  \ 92 条）。测试环境更接近生产环境。听起来很棒，不是吗？\n\n连接到数据库的实时测试实例适合集成测试。然而，对于需要在开发过程中反复执行的单元测试，连接到测试数据库带来的问题比解决的问题更多。\n\
  \n建立与 Oracle 或 MySQL 等数据库管理系统的连接可能很慢，以至于打乱你的开发流程，尤其是当你的测试反复连接和断开数据库时。测试套件执行时间增加一两秒可能会打断你的思路，并阻止你频繁运行测试。\n\
  \n同时运行多个测试可能会引入竞态条件。如果你并行运行测试，或者在持续构建运行时手动运行测试，最终可能导致一个测试更改了另一个测试所依赖的数据。这会导致看似随机的失败，难以追踪。\n\
  \n你的损坏代码还可能破坏生产数据库中的数据。\n\n意外地以错误用户身份登录或连接到错误的凭据，可能导致你在生产数据库上运行测试并造成严重破坏。\n\n###\
  \ 本地测试数据库\n\nSQLite 不是一个 Perl 项目，而是一个实现本地数据库的基于 C 的库。根据 SQLite 网站（http://www.sqlite.org/）的说法：\n\
  \n“SQLite 是一个软件库，实现了自包含、无服务器、零配置、事务性 SQL 数据库引擎。”这听起来非常适合测试数据库。\n\nSQLite 允许你与数据库交互，而无需完整的数据库管理系统开销。由于\
  \ SQLite 是一个本地库，所有数据库通信都在与测试相同的应用程序空间中本地进行。没有网络延迟，也没有握手。\n\n假设你的生产代码通常连接到 MySQL：\n\
  ```\nmy $dbh = DBI->connect( 'dbi:mysql:my_database', 'user', 'password',\n    {\
  \ other => 'settings' }\n);\n```\n\n你只需要更改连接参数即可改用 SQLite：\n```\nmy $dbh = DBI->connect(\
  \ 'dbi:SQLite:database.db', q{}, q{},\n    { other => 'settings' }\n);\n```\n\n\
  SQLite 会创建（或读取）一个名为 `database.db` 的文件。SQLite 支持许多流行数据库管理系统中常见的 SQL 结构。\n\n在某些情况下，当\
  \ SQLite 不支持某个 SQL 结构时，它至少会静默接受该 SQL，这样你的代码就不会出错。\n\n你还可以通过在 `connect` 中不指定文件名来创建内存中的\
  \ SQLite 数据库。通过这种设置，每次调用 `connect` 都会得到一个空数据库，你需要在测试时创建表并填充数据：\n```\nmy $dbh = DBI->connect(\
  \ 'dbi:SQLite:', q{}, q{},\n    { RaiseError => 1 } );\n$dbh->do( 'create table\
  \ test_table '\n    . '( id integer, value varchar )' );\n```\n\nSQLite 在测试中非常方便，但它并不局限于仅用于测试的应用程序。许多开源和商业工具将\
  \ SQLite 作为其产品背后的数据存储。它是一个轻量级且经过验证的库，你绝对应该了解一下。\n\n### 要点回顾\n\n- 不要使用生产数据库来测试你的代码。\n\
  - 在测试中使用 SQLite 替代生产数据库。\n- 使用 SQLite 创建内存中的测试数据库。\n\n## 第 94 条：使用 Test::Class 进行更结构化的测试\n\
  \n`Test::More` 提供了出色的工具包，但在结构上非常松散。许多程序员自己设计组织系统。有时这很有效，并且恰到好处。有时这最终会变成一次糟糕的重新发明轮子的练习。来自\
  \ xUnit 背景的人通常对这种明显的缺乏纪律感到沮丧。\n\n幸运的是，`Test::Class` 模块提供了任何使用过 xUnit 风格框架的人都熟悉的结构。`Test::Class`\
  \ 是一个面向对象的测试框架，与其他 `Test::Builder` 模块协同工作，为测试代码提供一定程度的组织。\n\n与其他 xUnit 风格测试一样，你在类中创建方法作为测试基础设施：\n\
  \n```\npackage MyTest;\n\nuse base 'Test::Class'; # 继承测试框架\nuse Test::More; # 不需要计划\n\
  \nuse My::Class::Under::Test;\n\nmy %test_data = (\n    123 => 'hello',\n    456\
  \ => 'world',\n);\n\nsub connect_to_database : Test(startup) {\n    my ($self) =\
  \ shift;\n    $self->{dbh} = connect_to_database;\n    $self->{insert_sth} =\n \
  \       $self->{dbh}\n            ->prepare( 'insert into test_table (key, value)\
  \ '\n                . 'values (?, ?)' );\n    $self->{delete_sth} =\n        $self->{dbh}\n\
  \            ->prepare('delete from test_table where key = ?');\n}\n\nsub disconnect_from_database\
  \ : Test(shutdown) {\n    my ($self) = shift;\n    $self->{insert_sth}->finish if\
  \ $self->{insert_sth};\n    $self->{delete_sth}->finish if $self->{delete_sth};\n\
  \    $self->{dbh}->disconnect if $self->{dbh};\n}\n\nsub insert_test_data : Test(setup)\
  \ {\n    my ($self) = shift;\n    for my ( $key, $value ) ( each %test_data ) {\n\
  \        $self->{insert_sth}->execute( $key, $value );\n    };\n}\n```\n\n### 要点回顾\n\
  \n- `Test::MockObject` 允许你伪造类和方法。\n- 通过向类型全局变量赋值来重新定义子程序。\n- 通过 `CORE::GLOBAL` 命名空间覆盖\
  \ Perl 内置函数。\n\n\n\n\n```perl\nsub create_an_object_to_test : Test(setup) {\n\n\
  my ($self) = shift;\n\n$self->{object} = My::Class::Under::Test->new;\n\n}\n\nsub\
  \ clean_up_after_running_a_test_method : Test(teardown)\n\n{\n\nmy ($self) = shift;\n\
  \nfor my ($key) ( keys %test_data ) {\n\n$self->{delete_sth}->execute($key);\n\n\
  };\n\n}\n\nsub do_a_single_test : Test {\n\nmy ($self) = shift;\n\nis(\n\nscalar(\
  \ keys %test_data ),\n\n$self->{object}->row_count,\n\n'all data accounted for'\n\
  \n);\n\n}\n\nsub run_a_fixed_number_of_tests : Test(2) {\n\nmy ($self) = shift;\n\
  \nisa_ok( $self->{object}, 'My::Class::Under::Test' ); can_ok( $self->{object},\
  \ qw(get row_count) );\n\n}\n```\n\n下载自 <www.wowebook.com>\n\n**334** ❘ *第 10 章\
  \ 测试*\n\n```perl\nsub run_a_dynamic_number_of_tests : Tests {\n\nmy ($self) = shift;\n\
  \nfor my ( $key, $value ) ( each %test_data ) {\n\nis(\n\n$test_data{$key}, $self->{object}->get($key),\n\
  \n\"lookup by key $key\"\n\n);\n\n};\n\n}\n```\n\n每个测试方法都带有一个属性（本书不讨论属性，但你可以阅读 *perlsub*\
  \ 文档了解）。这些属性都有特殊的含义，即使你不知道属性如何工作，也很容易推断出来：\n\n`Test(startup)`\n\n启动方法在每个测试套件运行期间执行一次，且在所有其他方法之前执行。你可以在其中执行开销较大的操作，并设置可在所有测试中使用的数据结构，而无需重新填充。\n\
  \n`Test(shutdown)`\n\n关闭方法在每个测试套件运行期间执行一次，但在所有其他方法之后执行。你可以在测试程序结束前使用这些方法进行最终清理。\n\
  \n`Test(setup)`\n\n设置方法在每个测试方法之前执行一次。例如，如果你有六个测试方法，则设置方法会执行六次，每次恰好在测试方法之前。你使用设置方法来构建每次运行测试时需要刷新的数据和对象。\n\
  \n`Test(teardown)`\n\n拆卸方法与设置方法相反。它们恰好在每个测试方法之后执行，你可以在每次测试后使用它们进行清理。\n\n下载自 <www.wowebook.com>\n\
  \n*第 95 条 在项目开始时就开始测试* ❘ **335**\n\n`Test[n]`\n\n测试方法包含要执行的实际测试。你可以声明一个测试（`Test`）、多个测试（`Test(n)`）或未知数量的测试（`Tests`）。\n\
  \n现在你已经将所有测试放入方法中，除非你调用它们，否则它们不会运行。`Test::Class` 框架提供了一个名为 `runtests` 的方法来处理这个问题；你只需调用它即可。\n\
  \n你可以创建一个额外的 `.t` 文件来为你完成此操作，或者使用 modulino 技术（第 91 条）在将模块作为程序调用时运行测试：\n\n```perl\n\
  __PACKAGE__->runtests() unless caller;\n```\n\n这允许你直接运行测试模块：\n\n```bash\n% prove\
  \ test/MyTest.pm\n```\n\n最后一点说明：这个示例展示了测试连接到数据库，以便紧凑地说明 `Test::Class` 中的所有钩子。如果你设置了测试数据库或模拟对象（第\
  \ 92 条），则不必连接到生产数据库。\n\n**要记住的事情**\n\n- 使用 `Test::Class` 模块在 Perl 中实现 xUnit 功能。\n\
  - 向模块中添加特殊的测试方法。\n- 正常运行单元测试，或将模块作为程序调用。\n\n## 第 95 条 在项目开始时就开始测试。\n\n敏捷方法和测试驱动开发（TDD）是非常流行的开发实践。无论你是\
  \ TDD 的坚定拥护者，还是认为它只是最新的潮流，你都可以从中汲取一些宝贵的经验。如果你在编码时不考虑测试，那么在开发周期后期添加测试将会非常困难。\n\n\
  在真正的测试驱动开发中，你总是先编写测试，然后编写使测试通过的代码。在 TDD 中，你首先编写一个测试，该测试运行你尚未编写的代码：\n\n下载自 <www.wowebook.com>\n\
  \n**336** ❘ *第 10 章 测试*\n\n```perl\nuse Test::More tests => 3;\n\nBEGIN { use_ok('UpperCaser')\
  \ }\n\nmy $uc = UpperCaser->new();\n\nis( $uc->uc('addison clark'), 'ADDISON CLARK'\
  \ ); is( $uc->uc_first('ella & ginger'), 'Ella & Ginger' );\n```\n\n现在，你逐步处理 `prove`（第\
  \ 87 条）发出的错误消息，沿途编写足够的代码来修复每个新错误。首先，在模块存在之前运行测试：\n\n```bash\n% prove t/uc.t\n\n\
  # Error: Can't locate UpperCaser.pm in @INC\n```\n\n测试无法加载模块，因为它还不存在，所以你创建了模块文件，但尚未添加任何代码。现在测试失败，因为它找不到\
  \ `new` 方法：\n\n```bash\n% prove t/uc.t\n\nt/uc.t .. 1/3 Can't locate object method\
  \ \"new\" via ↵\npackage \"UpperCaser\" at t/uc.t line 7.\n```\n\n你实现了 `new`，因此测试找到了该方法，但\
  \ `new` 尚未执行任何操作。下一个方法失败，因为它从未获得对象：\n\n```bash\n% prove t/uc.t\n\nt/uc.t .. 1/3\
  \ Can't call method \"uc\" on an undefined ↵\nvalue at t/uc.t line 8.\n```\n\n你实现了\
  \ `new`，使其返回它能返回的最小对象，现在对象找不到你尚未实现的 `uc` 方法：\n\n```bash\n% prove t/uc.t\n\nt/uc.t\
  \ .. 1/3 Can't locate object method \"uc\" via package↵\n\"UpperCaser\" at t/uc.t\
  \ line 8.\n```\n\n你修复了这个问题，然后在下一个方法调用时失败：\n\n```bash\n% prove t/uc.t\n\nCan't locate\
  \ object method \"uc_first\" via package \"Upper↵\nCaser\" at t/uc.t line 9.\n```\n\
  \n最后，你通过尽可能简单地实现 `uc_first` 来修复最后一个方法调用。由于它尚未完成其工作，你得不到预期的输出：\n\n下载自 <www.wowebook.com>\n\
  \n*第 95 条 在项目开始时就开始测试* ❘ **337**\n\n```bash\n% prove t/uc.t\n\nt/uc.t .. 1/3\n\n\
  # Failed test at t/uc.t line 8.\n\n# got: undef\n\n# expected: 'ADDISION CLARK'\n\
  \n# Failed test at t/uc.t line 9.\n\n# got: undef\n\n# expected: 'Ella & Ginger'\n\
  \n# Looks like you failed 2 tests of 3.\n```\n\n你让 `uc` 完成其应有的工作，只剩下一个方法需要完全实现：\n\
  \n```bash\n% prove t/uc.t\n\nt/uc.t .. 1/3\n\n# Failed test at t/uc.t line 9.\n\n\
  # got: undef\n\n# expected: 'Ella & Ginger'\n\n# Looks like you failed 1 test of\
  \ 3.\n```\n\n最后，当你完全实现 `uc_first` 后，所有测试都通过了：\n\n```bash\n% prove t/uc.t\n\nt/uc.t\
  \ .. ok\n\nAll tests successful.\n\nFiles=1, Tests=3, 0 wallclock secs ( 0.03 usr\
  \ 0.01 sys↵\n+ 0.02 cusr 0.00 csys = 0.06 CPU)\n\nResult: PASS\n```\n\n所有测试通过后，你得到了一段经过测试的漂亮代码，看起来像这样：\n\
  \n```perl\npackage UpperCaser;\n\nuse warnings;\n\nuse strict;\n\nsub new {\n\n\
  bless {}, shift;\n\n}\n\nsub uc {\n\nmy ( $self, $word ) = @_;\n\nreturn uc $word;\n\
  \n}\n\nsub uc_first {\n\nmy ( $self, $word ) = @_;\n\nreturn join ' ', map { ucfirst\
  \ } split /\\s/, $word;\n\n}\n\n1;\n```\n\n这种开发形式通常是程序员工作流程的重大改变。它保证你为代码编写了测试。但它也可能令人望而生畏，以至于许多人在尝试几天（或几分钟）后就放弃了。不过，不要这么快就放弃！\n\
  \n即使你不想遵循 TDD，你仍然应该为代码编写自动化测试。在开发代码后尽快编写这些测试，以免积累太多未经测试的工作。时机很重要，因为你一定会做一些最终使测试变得困难的事情。当测试代码变得困难时，调试也会变得困难，而且可能使用起来也很困难。测试可以帮助你在问题变得过大之前发现它们。\n\
  \n考虑一个反例，下面这段代码下载了英文维基百科的主页，并打印出当前活跃的文章数量：\n\n```perl\nsub print_number_of_wiki_entries\
  \ {\n\nmy $agent = LWP::UserAgent->new();\n\n$agent->agent('Mozilla/5.0');\n\nmy\
  \ $response =\n\n$agent->get('http://en.wikipedia.org/wiki/Main_Page'); if ( $response->is_success\
  \ ) {\n\nif ( $response->decoded_content =~\n\nm{>([\\d,]*)</a> articles} )\n\n\
  {\n\nprint\n\n\"There are $1 English articles on Wikipedia\\n\";\n\n}\n\n}\n\n}\n\
  ```\n\n下载自 <www.wowebook.com>\n\n*第 95 条 在项目开始时就开始测试* ❘ **339**\n\n\n\n\n\n这段代码非常简单，测试起来应该很容易，对吧？不幸的是，有几个陷阱让测试变得具有挑战性。\n\
  \n首先，这个子程序创建了一个新的 `LWP::UserAgent`，而不是从参数列表中获取它，因此你无法提供自己的用户代理进行依赖注入（Item 89）。\n\
  \n其次，这个子程序需要互联网连接以及对维基百科的访问权限。更糟糕的是，该子程序直接将结果打印到标准输出，这意味着要测试方法的输出，你需要以某种方式拦截标准输出流（Item\
  \ 55）。\n\n如果你先编写测试，就可以避免大部分问题。在测试每个部分时，你会发现这些问题并绕过它们。\n\n不过，由于这是一个小代码块，你可以重构它使其更易于测试。\n\
  \n一个快速的改进是简单地将打印语句从子程序中移除，改为返回一个字符串：\n\n```\nsub get_number_of_wiki_entries {\n\
  \    my $agent = LWP::UserAgent->new();\n    $agent->agent('Mozilla/5.0');\n   \
  \ my $response =\n        $agent->get('http://en.wikipedia.org/wiki/Main_Page');\n\
  \    if ( $response->is_success ) {\n        if ( $response->decoded_content =~\n\
  \            m{>([\\d,]*)</a> articles} )\n        {\n            return \"There\
  \ are $1 English articles on Wikipedia\";\n        }\n    }\n}\n```\n\n现在你可以通过字符串比较来测试该方法：\n\
  \n```\nuse Test::More tests => 1;\nlike(\n    ToughToTestRefactored::get_number_of_wiki_entries(),\n\
  \    qr\"There are [\\d,]* English articles on Wikipedia\",\n    'found number of\
  \ wiki entries'\n);\n```\n\n你还可以将下载部分与数据解析部分分离，这样分两步进行：\n\n```\nsub get_wikipedia_main_page\
  \ {\n    my $agent = LWP::UserAgent->new();\n    $agent->agent('Mozilla/5.0');\n\
  \    my $response =\n        $agent->get('http://en.wikipedia.org/wiki/Main_Page');\n\
  \    if ( $response->is_success ) {\n        return $response->decoded_content;\n\
  \    }\n    return;\n}\n\nsub get_number_of_wiki_entries {\n    my $html = shift;\n\
  \    if ( $html =~ m{>([\\d,]*)</a> articles} ) {\n        return \"There are $1\
  \ English articles on Wikipedia\";\n    }\n    return;\n}\n```\n\n现在你可以将下载与 HTML\
  \ 解析分开测试：\n\n```\nuse Test::More tests => 2;\nmy $html = get_wikipedia_main_page();\n\
  ok( $html, 'got data back from Wikipedia' );\nlike(\n    get_number_of_wiki_entries($html),\n\
  \    qr\"There are [\\d,]* English articles on Wikipedia\",\n    'found number of\
  \ wiki entries'\n);\nmy $count = get_number_of_wiki_entries($html);\nis( $count,\
  \ ... );\n```\n\n但仍然存在烦人的网络调用，如果你离线，这很难测试。与其创建自己的用户代理，不如使用调用者在参数列表中提供的用户代理：\n\n\
  ```\nsub get_wikipedia_main_page {\n    my $agent = shift;\n    $agent->agent('Mozilla/5.0');\n\
  \    my $response =\n        $agent->get('http://en.wikipedia.org/wiki/Main_Page');\n\
  \    if ( $response->is_success ) {\n        return $response->decoded_content;\n\
  \    }\n    return;\n}\n```\n\n现在你可以创建一个模拟对象（Item 92）来替代真实的用户代理，从而完全避免网络：\n\n```\n\
  use LWP::UserAgent;\nuse HTTP::Response;\nuse Test::MockObject::Extends;\n\nmy $agent\
  \ = LWP::UserAgent->new();\n$agent = Test::MockObject::Extends->new($agent);\n$agent->mock(\n\
  \    'get',\n    sub {\n        HTTP::Response->new(\n            200, '',\n   \
  \         [ 'Content-Type', 'test/html' ],\n            'blah <a>123,456</a> articles'\n\
  \        );\n    }\n);\n\nmy $html = get_wikipedia_main_page($agent);\nok( $html,\
  \ 'got data back from Wikipedia' );\nlike(\n    get_number_of_wiki_entries($html),\n\
  \    qr\"There are [\\d,]* English articles on Wikipedia\",\n    'found number of\
  \ wiki entries'\n);\n```\n\n你已经将过程分解为多个步骤，并独立测试了它们。为了回到单一步骤，你将它们包装在另一个子程序中：\n\n\
  ```\nsub print_number_of_wiki_entries {\n    print get_number_of_wiki_entries(\n\
  \        get_wikipedia_main_page( LWP::UserAgent->new() )\n    ),\n    \"\\n\";\n\
  }\n```\n\n想象一下，如果你必须等待几周，并且添加了几十个额外的依赖项，这个过程会有多困难。不要给自己制造不必要的工作：尽早测试。\n\n### 要记住的事情\n\
  \n- 在开始编码之前编写测试。\n- 只编写足够通过测试的代码，然后编写更多测试。\n- 将代码重构为易于测试的小块。\n\n## Item 96. 衡量你的测试覆盖率。\n\
  \n很难追踪你测试了代码的哪些部分，以及哪些部分还需要编写测试。你可以很容易地看到你的测试实例化了模块并调用了一些方法，但要确保测试了所有方法，这是一项繁琐的记账工作。更复杂的是，考虑任何给定子程序中的不同执行分支。你执行了代码中的哪些路径，跳过了哪些路径？\n\
  \n例如，以下模块有一个方法，其中包含一个 if-elsif 结构中的两个分支：\n\n```\npackage MyModule;\nuse warnings;\n\
  use strict;\n\nsub do_that_thing {\n    my ( $class, $argument ) = @_;\n    if (\
  \ $argument =~ /x/ ) {\n        return 1;\n    }\n    elsif ( $argument =~ /y/ )\
  \ {\n        return 2;\n    }\n    return 3;\n}\n1;\n```\n\n你立即开始测试这个模块（Item 95），并认为你覆盖了所有分支：\n\
  \n```\nuse Test::More tests => 2;\nuse MyModule;\n\nis( MyModule->do_that_thing('xyz'),\
  \ 1, 'got 1 back' );\nis( MyModule->do_that_thing('abc'), 3, 'got 3 back' );\n```\n\
  \n你运行 `prove`（Item 87），看到所有测试都通过了：\n\n```\n% prove -Ilib t/my_module.t\nt/my_module.t\
  \ .. ok\nAll tests successful.\nFiles=1, Tests=2, 0 wallclock secs ( 0.03 usr 0.01\
  \ ↵\nsys + 0.02 cusr 0.00 csys = 0.06 CPU)\nResult: PASS\n```\n\n然而，从这些结果中很难看出你跳过了代码的一个完整分支。你从未测试过\
  \ `elsif`，因为你没有给子程序任何会触发该块的数据。你的测试结果只和你的测试本身一样好。\n\n### 让 Devel::Cover 监视你的测试\n\n\
  这个问题的解决方案是 `Devel::Cover`，它可以监视测试运行时的行为，收集统计数据，然后呈现给你。如果模块使用 `ExtUtils::Makemaker`，你可以通过环境变量激活覆盖率测试：\n\
  \n```\n% HARNESS_PERL_SWITCHES=-MDevel::Cover make test\n```\n\n如果你使用 `Module::Build`，则使用特殊的\
  \ `testcover` 动作：\n\n```\n% ./Build testcover\n```\n\n无论使用哪种方法，`Devel::Cover` 都会收集信息并将其放入\
  \ `cover_db/` 目录中。要处理这些信息，你运行 `cover` 命令。它会打印结果的文本摘要，我们稍微调整了格式以适应页面：\n\n```\n% cover\n\
  1..2\nDevel::Cover 0.65: Collecting coverage data for branch,↵\ncondition, pod,\
  \ statement, subroutine and time.\nok 1 - got 1 back\nok 2 - got 3 back\nDevel::Cover:\
  \ Writing coverage database to /Users/jmcadams↵\n/development/effective-perl-programming/second↵\n\
  T_edition/esting/code/cover_db/runs/1254690988.30080↵\n.46156\n----------------------------\
  \ ------ ------ ------ ↵\nFile                      stmt   bran   cond   ↵\n----------------------------\
  \ ------ ------ ------ ↵\nlib/MyModule.pm           90.9   75.0   n/a    ↵\nt/my_module.t\
  \             100.0  n/a    n/a    ↵\nTotal                     96.0   75.0   n/a\
  \    ↵\n---------------------------- ------ ------ ------ ↵\n------ ------ ------\
  \ ------\nsub    pod    time   total\n------ ------ ------ ------\n100.0  0.0  \
  \  25.7   84.2\n100.0  n/a    74.3   100.0\n100.0  100.0  91.9\n------ ------ ------\
  \ ------\nWriting HTML output to /Users/Snuffy/MyModule/↵\ncover_db/coverage.html\
  \ ...\n```\n\n覆盖率测试分为几个类别：\n\n- 语句覆盖率——你测试了代码中的每一条语句。\n- 分支覆盖率——你测试了每个分支（例如，if-elsif-else\
  \ 结构中的每个块）。\n\n\n\n\n\n■ 条件覆盖——测试每个条件的每个部分（例如 `$a && $b` 的每一侧）。\n\n■ 子例程覆盖——测试所有子例程。\n\
  \n■ Pod——用 Pod 为每个子例程编写文档（条目 82）。\n\n文本报告会给出每种覆盖类型的摘要。\n\n`Devel::Cover` 还会生成多个\
  \ HTML 文件，方便你查找未覆盖的代码。`cover` 会在其输出底部给出 `cover_db/coverage.html` 的路径。你可以通过 HTML\
  \ 页面深入查看代码，了解每一行代码的覆盖情况，并决定从何处着手提高覆盖率。\n\n随着你向项目中添加更多代码，覆盖率指标会包含一些你并不关心的文件数据。例如，第三方模块和测试文件通常也会被纳入覆盖率指标。为了避免结果中的这些干扰，你可以向\
  \ `Devel::Cover` 传递参数，告诉它忽略哪些文件、关注哪些文件：\n\n```\n% HARNESS_PERL_SWITCHES=-MDevel::Cover=-ignore,\\\
  .t, \\\n+select,MyModule.pm make test\n```\n\n如果你希望命令行更简洁，可以使用 `PERL5OPT` 环境变量：\n\
  \n```\n% export \\\nPERL5OPT=-MDevel::Cover=-ignore,\\.t,+select,.*\\.pm\n% make\
  \ test\n```\n\n不过，不要一直保留这些选项。`Devel::Cover` 会增加程序的运行开销，因此除非你明确检查代码覆盖率，否则不应让它执行。它还会累积数据，占用越来越多的磁盘空间。要清除之前收集的数据：\n\
  \n```\n% cover -delete\n```\n\n### 难以覆盖的代码\n\n如果能让所有覆盖率指标都达到 100%，那将非常完美，但有时这似乎不可能。如果你是一位格外谨慎的程序员，可能会编写防护代码来检查所有可能的失败情况：\n\
  \n```\nsub very_careful {\n    my ($file) = shift;\n    open my ($fh), '<', $file\n\
  \        or die \"Could not open $file\\n\";\n    if ( print $fh \"Hello there!\\\
  n\" ) {\n    }\n    else {\n        warn \"Could not print!\\n\";\n        unless\
  \ ( unlink $file ) {\n            die \"Could not unlink $file: $!\\n\";\n     \
  \   }\n    }\n    die \"Could not close $file: $!\\n\"\n        unless close($fh);\n\
  }\n```\n\n为了实现完全覆盖，你必须在测试中制造每一种失败情况。你必须确保在一次测试中 `open` 失败，在另一次测试中 `print` 失败，以此类推。你可以尝试设置复杂的情境来触发这些失败，但更简单的方法是创建模拟对象并覆盖内置函数（条目\
  \ 92）来测试每种失败模式。\n\n你也可以考虑是否能够接受低于 100% 的覆盖率，或者是否有其他方式重构代码，使其更易于测试。通常，难以测试的代码是代码难以维护或容易出错的信号。最后，你还可以从经济角度考虑：为了获得收益，你需要付出多少工作？也许\
  \ 99% 的覆盖率已经足够，你可以把精力放在更重要的事情上。\n\n### 要点回顾\n\n- `Devel::Cover` 使用多种指标报告你测试了多少代码。\n\
  - 模拟某些功能以获得完整的测试覆盖率。\n- 不必过分追求 100% 完美的测试覆盖率。\n\n## 条目 97. 将 CPAN Testers 作为你的 QA\
  \ 团队\n\nCPAN Testers（http://cpantesters.org/）是一个由志愿者组成的临时团队，他们会自动且以编程方式测试上传到 CPAN\
  \ 的每个发行版。他们使用各种 Perl 版本（有些相当老旧）以及各种操作系统和配置。测试完一个发行版后，他们会上传结果，并将结果发送给发行版作者（条目 68）。有些人会配置自己的\
  \ CPAN 工具链使用 `CPAN::Reporter`，以便在安装每个模块时上传测试报告。\n\n虽然通过将代码上传到 CPAN（条目 70）可以从 CPAN\
  \ Testers 获得最大价值，但你也可以使用测试者所用的相同工具在内部测试代码。\n\n### 设置你的 CPAN Testers 偏好\n\nCPAN Testers\
  \ 的输出内容繁多，有时令人不知所措，但你可以调整他们通知你的方式和时机。CPAN Testers 允许作者设置接收其模块测试报告的首选项（https://prefs.cpantesters.org/）。你使用与\
  \ PAUSE 账户（条目 70）相同的用户名和密码。你可以为所有模块设置通知偏好，也可以为每个发行版单独设置。\n\n### 使用开发者版本\n\n你不必等到代码达到生产就绪状态才使用\
  \ CPAN Testers。按照惯例，PAUSE 会将任何包含下划线的版本字符串视为开发者版本：\n\n```\nour $VERSION = '1.001_001';\n\
  ```\n\nPAUSE 不会索引开发者版本，但仍会将发行版放入你的 CPAN 目录。由于开发者版本不会出现在索引文件中，因此 `cpan` 等 CPAN 工具不会安装它们。然而，CPAN\
  \ Testers 会注意到上传，直接下载并测试。通常在上传后几小时内你就会收到测试报告。这样，你可以尝试新功能，将其作为开发者版本上传，然后观察 CPAN Testers\
  \ 的结果。\n\n大部分收益来自 CPAN Testers 使用的各种平台。例如，你可能有一段棘手的 C 代码，需要在不同平台和编译器上使用正确的类型。与其自己测试所有组合，不如上传并等待报告。\n\
  \n处理版本号的一种策略是：从上一个生产版本开始使用开发者版本。假设上一个公开发布版本是 1.23。在准备下一个公开发布版本的过程中，你从 `1.23_001`\
  \ 开始，然后是 `1.23_002`，依此类推。当你准备好发布下一个公开版本时，将版本号提升到 1.24，然后重新开始这个过程。\n\n### 搭建你自己的烟雾测试器\n\
  \n你可以搭建自己的持续集成系统（条目 98），但也可以使用 CPAN Testers 所用的相同工具（不过，如果你希望将模块保留在真正的 CPAN 之外，可能需要搭建自己的\
  \ CPAN）。CPAN Testers 的烟雾测试工具页面（http://wiki.cpantesters.org/wiki/SmokeTools）提供了详细信息，但你需要查看以下系统之一：\n\
  \n- `CPAN::Reporter`\n- `CPANPLUS::YACSmoke`\n- `CPAN::YACSmoke`\n- `POE::Component::CPAN::YACSmoke`\n\
  \n安装后，你可以根据具体需求配置或修改这些工具。如果你不想将测试报告发送到公共测试者数据库，可以只发送给自己。完整的设置超出了本书的范围，但 CPAN Testers\
  \ 是一个乐于助人的群体。你可以通过他们的邮件列表（`testers@cpan.org`）获得帮助。\n\n### 要点回顾\n\n- 配置你的 CPAN Testers\
  \ 通知偏好。\n- 使用开发者版本让 CPAN Testers 检查你的开发代码。\n- 搭建你自己的烟雾测试工具。\n\n## 条目 98. 搭建持续构建系统\n\
  \n在开发代码时，你可能会陷入“隧道视野”，只运行当前正在开发的模块的测试。然而，一个模块的变更导致另一个模块的测试失败的情况并不少见。你应该定期运行整个测试套件，或者更好的是，让测试套件自动定期运行。\n\
  \n**持续集成**系统是一种框架，负责定期构建你的代码并执行与该代码打包的测试。这些框架可以简单到在本地调度 `prove` 调用，也可以复杂到使用像 Cruise\
  \ Control 这样的全功能系统来监控你的版本控制系统，并在每次新提交时运行测试套件。\n\n### 定期运行 prove\n\n\n\n\n\n# 第 98\
  \ 条 建立持续构建系统\n\n最简单的系统之一就是定期将测试套件的运行结果通过电子邮件发送给自己。只需安排将 `prove` 命令的结果通过邮件发送给你：\n\
  \n```\n# 在 crontab 中\n\nprove -I/path/to/code/lib /path/to/code/t/*t | \\\nsendmail\
  \ -t me@example.com -s \"构建结果\"\n```\n\n当然，如果你一段时间内没有做任何更改，你会反复收到相同的邮件。此外，如果构建失败，你可能会在很长时间后才发现问题。\n\
  \nptg\n\n### 使用预提交钩子\n\n考虑在源代码控制系统中添加一个预提交钩子。这个钩子可以在允许你提交任何更改之前验证所有测试是否通过。对于大多数现代版本控制系统来说，设置钩子非常简单。\n\
  \n例如，使用 `Git`，你可以在名为 `.git/hooks/pre-commit` 的可执行文件中添加一些代码。几行 shell 代码就可以在每次提交时运行\
  \ `prove`：\n\n```\n#!/bin/sh\nset -e\nprove -b t/*t\n```\n\n如果你使用像 `ExtUtils::MakeMaker`\
  \ 这样的构建系统，你可以强制 `Git` 在每次提交时运行完整的构建和测试套件：\n\n```\n#!/bin/sh\nset -e\nperl Makefile.PL\
  \ && make test && make realclean\n```\n\n下载自 <www.wowebook.com>\n\n`Subversion`\
  \ 可以在几乎相同的位置使用相同的钩子，即 `[repo]/hooks/pre-commit`，其中 `[repo]` 是你的 `Subversion` 仓库的位置。\n\
  \n其他支持预提交钩子的源代码控制系统也可以利用类似的设置。请查阅你的版本控制系统的文档以了解详细信息。\n\n随着测试套件的增长，每次提交都运行所有测试可能会变得烦人，尤其是当你频繁提交时。你需要决定你和你的团队愿意等待多长时间来获得结果，以保持构建和测试套件的正常运行。\n\
  \n### 使用 Smolder 聚合测试结果\n\n`Smolder` 是一个基于 Perl 的聚合测试结果的好选择。使用 `Smolder`，你可以通过 `prove`\
  \ 或常规构建脚本运行测试，归档结果，然后上传到 `Smolder` 服务器进行分析和展示。\n\n要开始运行 Smolder，请从 http://sourceforge.net/projects/smolder/\
  \ 下载，并按照 `INSTALL` 文件中的说明在你的系统上启动并运行服务器。\n\n设置完成后，通过 `prove` 或测试脚本运行测试，并将归档结果发送到你的\
  \ `Smolder` 服务器：\n\n```\n% prove --archive=/tmp/build.tgz \\\n/path/to/tests/t/*t\
  \ && smolder_smoke_signal \\\n--server smolder.example.com --username username \\\
  \n--password password --file /tmp/build.tgz \\\n--project MyProject\n```\n\n服务器将通过一个漂亮的\
  \ Web 界面显示你的测试结果，跟踪历史记录，并且只在出现问题时才通知你。\n\n你甚至可以利用像 `SmokeRunner::Multi` 这样的模块来监控仓库中的分支，在发生更改时运行测试，并自动将结果上传到\
  \ Smolder。这个功能与流行的持续构建系统 Cruise Control 中的功能非常相似。\n\n前面的两个例子只是定期针对本地磁盘上的代码运行测试。这可能不太好，因为你可能有本地更改导致测试失败，在问题解决之前，你的电子邮件或构建聚合器会报告测试失败。你可以快速拼凑一些东西来自动从版本控制系统中检出代码并针对该代码运行测试。但在开始拼凑这样的系统之前，花点时间研究一下监控版本控制系统的持续构建系统。\n\
  \nptg\n\n### Cruise Control\n\n`Cruise Control` (http://cruisecontrol.sourceforge.net/)\
  \ 是一个 Java 框架，用于执行代码的持续集成和测试。只需对 Perl 项目稍作修改，你就可以在 `Cruise Control` 中快速运行它。\n\n\
  ### 使用 Ant 构建\n\n为了让你的项目在 `Cruise Control` 中运行，最好能够使用 `Apache Ant` 构建和测试它。如果你的项目使用\
  \ `Module::Build` 作为构建脚本，那么 Ant 的 `build.xml` 文件大致如下：\n\nptg\n\n```\n<project name=\"\
  myproject\" default=\"all\">\n<macrodef name=\"module.build\">\n<attribute name=\"\
  action\" default=\"build\" />\n<sequential>\n<exec executable=\"/usr/bin/perl\"\n\
  failonerror=\"true\">\n<arg value=\"Build\" />\n<arg value=\"@{action}\" />\n<env\
  \ key='PERL5LIB' path=\"lib:${env.PERL5LIB}\" />\n<env key=\"PERL_TEST_HARNESS_DUMP_TAP\"\
  \npath=\"/project_dir/target/test-results/\"/>\n</exec>\n</sequential>\n</macrodef>\n\
  <target name=\"all\"\ndepends=\"clean, configure, build, test\"/>\n<target name=\"\
  clean\">\n<module.build action=\"clean\"/>\n</target>\n<target name=\"configure\"\
  >\n<exec executable=\"/usr/bin/perl\" failonerror=\"true\">\n<arg value=\"Build.PL\"\
  />\n<env key='PERL5LIB' path=\"lib:${env.PERL5LIB}\" />\n</exec>\n</target>\n<target\
  \ name=\"build\" depends=\"configure\">\n<module.build action=\"build\"/>\n</target>\n\
  <target name=\"test\" depends=\"build\">\n<module.build action=\"test\"/>\n</target>\n\
  </project>\n```\n\n起初，这个文件可能看起来令人生畏，但实际上它非常简单。它所做的就是定义一个项目，在本例中是 `myproject`。然后它封装了一些构建目标，用于清理、运行\
  \ `Build.PL`、构建项目和测试项目。项目名称由你决定。你应该给它起一个对你和你的团队有意义的名字。\n\nptg\n\n你还需要调整 `PERL_TEST_HARNESS_DUMP_TAP`\
  \ 环境变量。这个变量告诉测试工具将测试输出的副本存储在哪里。`Cruise Control` 最终会从这里收集每次测试运行的信息。这将是一个易变的目录，因此你可能希望将其放在主源代码树之外，或者让版本控制系统忽略它。\n\
  \n完成 `build.xml` 文件后，你应该能够使用 ant 配置、构建、测试和清理项目：\n\n```\n% ant configure\n% ant build\n\
  % ant test\n% ant clean\n```\n\n这个 `build.xml` 文件基于 `TAP::Formatter::TeamCity` 文档中更健壮的\
  \ `build.xml`。如果你需要更多灵活性，请务必查看它。\n\n下载自 <www.wowebook.com>\n\n### 格式化输出\n\n让项目使用\
  \ ant 构建和测试是一个重要的步骤，但这并不是为了让 `Cruise Control` 与你的构建系统正确配合而需要对代码进行的唯一更改。此时，你可以设置\
  \ `Cruise Control` 来了解你的测试套件整体是通过还是失败，但仅此而已。为了让 `Cruise Control` 解释你的测试结果并给出逐个测试的结果，你需要从测试中输出\
  \ JUnit 测试输出 XML 而不是 TAP。\n\n如果你有幸使用 `Module::Build`，这很容易：只需继承 `Module::Build`，重写一个方法，然后让你的\
  \ `Build.PL` 文件使用你的子类。\n\n首先，创建一个子类，重写 `tap_harness_args`，并将 `TAP::Formatter::JUnit`\
  \ 设为首选格式化器：\n\n```\npackage MyModuleBuild;\nuse parent 'Module::Build';\nsub tap_harness_args\
  \ {\nreturn { formatter_class => 'TAP::Formatter::JUnit' };\n}\n1;\n```\n\n然后，修改你的\
  \ `Build.PL` 文件以使用 `MyModuleBuild`：\n\n```\nuse MyModuleBuild;\nmy $build = MyModuleBuild->new(\n\
  module_name => 'MyModule',\ndist_version => 1,\n);\n$build->create_build_script;\n\
  ```\n\n现在，当你运行 `ant test` 时，你应该会在屏幕上看到一些 JUnit XML，并在你分配给 `PERL_TEST_HARNESS_DUMP_TAP`\
  \ 环境变量的目录中找到一些 XML 文件。\n\n如果你没有使用 `Module::Build`，更改输出格式化器就不那么容易了。你可能希望将测试目标改为只使用\
  \ `prove`：\n\n下载自 <www.wowebook.com>\n\n\n\n\n<target name=\"test\" depends=\"compile\"\
  >\n  <exec executable=\"/usr/bin/prove\" failonerror=\"true\">\n    <arg value=\"\
  --formatter=TAP::Formatter::JUnit\"/>\n    <arg value=\"t/\"/>\n    <env key=\"\
  PERL_TEST_HARNESS_DUMP_TAP\" path=\"/project_dir/target/test-results/\"/>\n  </exec>\n\
  </target>\n\n### 设置 Cruise Control\n\n现在你已经使用 Ant 构建项目并生成 JUnit 测试输出 XML，可以开始使用\
  \ *Cruise Control* 了。首先需要下载并安装该框架。在其项目页面上找到下载链接。\n\n下载 *Cruise Control* 后，解压下载的文件。将生成的文件夹移动到系统中你习惯存放可执行文件的位置。默认情况下，*Cruise\
  \ Control* 会使用该文件夹存储数据，因此请确保它有足够的空间增长。\n\n通过编辑 *Cruise Control* 基础目录中的 `config.xml`\
  \ 文件来配置系统。删除示例项目，并为你的项目添加一个条目：\n\n```xml\n<cruisecontrol>\n  <project name=\"myproject\"\
  >\n    <listeners>\n      <currentbuildstatuslistener file=\"/cc_dir/projects/myproject/status.txt\"\
  />\n    </listeners>\n    <bootstrappers>\n      <antbootstrapper anthome=\"apache-ant-1.7.0\"\
  \ buildfile=\"/project_dir/build.xml\" target=\"clean\"/>\n    </bootstrappers>\n\
  \    <modificationset quietperiod=\"0\">\n      <filesystem folder=\"/project_dir/\"\
  />\n    </modificationset>\n    <schedule interval=\"300\">\n      <ant anthome=\"\
  apache-ant-1.7.0\" antWorkingDir=\"/project_dir/\" buildfile=\"/project_dir/build.xml\"\
  />\n    </schedule>\n    <log>\n      <merge dir=\"/project_dir/test-results/t/\"\
  />\n    </log>\n  </project>\n</cruisecontrol>\n```\n\n为你的项目命名一个在 *Cruise Control*\
  \ 界面中能识别的名称。将 `/cc_dir` 替换为你的 *Cruise Control* 路径。所有出现 `myproject` 的地方，都替换为你的项目名称。\n\
  \n所有出现 `project_dir` 的地方，都替换为你的 Perl 源代码路径。\n\n设置好 `config.xml` 后，启动 *Cruise Control*：\n\
  \n```bash\n% ./cruisecontrol.sh\n```\n\n现在你应该能够导航到 `http://localhost:8080` 查看你的持续构建系统运行情况。有了基本设置后，你可以自定义\
  \ *Cruise Control* 以更好地适应你的开发环境。\n\n### 其他选项\n\n还有许多其他持续构建系统可以与你的开发集成。Test::AutoBuild\
  \ 是一个基于 Perl 的系统，与 Perl 项目配合良好。*Hudson* 是另一个流行的基于 Java 的服务器，可以读取 Test::Harness 输出的特殊格式结果。\n\
  \n你可能受到公司已标准化系统的限制，也可能从零开始。重要的不是使用什么系统，而是你有一个可用的系统。\n\n### 需要记住的事项\n\n- 使用持续集成系统自动运行测试。\n\
  - 使用功能完善的、适用于 Perl 项目的持续构建系统。\n- 任何持续构建系统都比不存在的完美系统要好。\n\n## 警告\n\nPerl 在发现可疑代码时能提供很大帮助，并让你知晓。你可能从其他语言中学到的大多数调试技巧同样适用于\
  \ Perl。当你的程序输出大量警告时，从第一个警告开始处理。\n\n启用警告有多种方式。旧式 Perl 在命令行中使用 `-w` 开关：\n\n```bash\n\
  % perl -w program.pl\n```\n\n你也可以在程序内部的 shebang 行中使用命令行开关：\n\n```perl\n#!perl -w\n\
  ```\n\n现代 Perl 在代码中使用 `warnings` 编译指令（条目 99）。\n\n```perl\nuse warnings;\n```\n\n\
  处理警告的技巧不仅在于理解 Perl 试图告诉你什么，还在于它何时告诉你。有些问题 Perl 仅通过查看代码就能发现，而另一些问题则需要等到某些可疑情况发生。\n\
  \n除此之外，Perl 还有一个名为**污点检查**的出色功能，可以跟踪整个程序中的外部数据，并防止程序将其传递给外部程序。此功能用于防止他人向你的程序提供恶意数据，从而诱骗程序对其他程序执行异常操作。\n\
  \n不要轻视这些警告；它们表明你的程序存在脆弱性。但这并不意味着你必须完全解决每个警告的根源。Perl 提供了在作用域内关闭警告的功能。如果你理解警告，接受其指示的风险，并且仍然需要保持代码不变，你可以告诉\
  \ Perl 不要抱怨。\n\n### 条目 99. 启用警告，让 Perl 发现可疑代码。\n\n当 Perl 在编译或运行代码时发现可疑情况，它可以向你发出警告。警告是一种宝贵的开发工具，你不应忽视。如果你不习惯编写无警告的代码，经过\
  \ Perl 持续不断的“骚扰”几个月后，你将开始编写更好的代码，看到的警告也会越来越少。\n\n即便如此，你仍然应该使用 Perl 的警告。\n\n为了与 Perl\
  \ 起步时的快速脚本保持向后兼容，Perl 的警告默认是关闭的。有几种方法可以启用警告。从 Perl 5.6 开始，你可以按文件启用警告，这是推荐的方式：\n\n\
  ```perl\nuse warnings; # 在每个文件顶部添加此行\n```\n\n如果你尚未在项目文件中添加 `use warnings` 行，可以使用\
  \ `-w` 开关启用所有文件的所有警告。你可以在命令行中这样做，以便在一次运行中启用它们：\n\n```bash\n% perl -w myscript\n\
  ```\n\n你也可以通过在 shebang 行中添加 `-w` 标志在程序内部启用它们：\n\n```perl\n#!/usr/bin/perl -w\n```\n\
  \n你还可以有选择地启用或禁用警告（条目 100）。\n\n#### 编译时警告\n\nPerl 可以在编译时发现一些可疑问题。考虑一个简单的程序，其中只有一个加法语句：\n\
  \n```perl\nuse warnings;\n$foo = 1;\n1 + 2;\n```\n\n当你使用 `-w` 启用警告并使用 `-c` 检查语法时，perl\
  \ 会告诉你加法是无用的，因为你没有使用其结果，并且只使用一次的变量可能是拼写错误：\n\n```bash\n% perl -cw program.pl\nUseless\
  \ use of a constant in void context\nName \"main::foo\" used only once: possible\
  \ typo\n/home/snuffy/program.pl syntax OK\n```\n\n#### 运行时警告\n\n运行时警告来自 perl 无法仅通过检查源代码捕获的问题，因此通常最令人烦恼。考虑打印哈希的键和值：\n\
  \n```perl\nuse warnings;\nforeach my $cat ( keys %microchips ) {\n    print \"$cat\
  \ --> $microchips{$cat}\\n\";\n}\n```\n\n你能仅通过查看代码看出警告可能来自哪里吗？perl 也不能，至少直到它开始遍历一个包含未定义值的哈希时才能发现：\n\
  \n```perl\nmy %microchips = (\n    'Mimi'   => 123,\n    'Buster' => undef,\n  \
  \  'Roscoe' => 345,\n);\n```\n\n当 perl 遇到 Buster 的键时，它会打印一个未定义值并发出警告：\n\n```\nUse\
  \ of uninitialized value $microchips{\"Buster\"} in concatenation (.) or string\n\
  ```\n\n虽然令人烦恼，但这个警告比以前已经好多了。从 Perl 5.10 开始，警告会告诉你哪个值未定义，这里是 `$microchips{\"Buster\"\
  }`。\n\n由于无法通过查看源代码捕获运行时警告，捕获这些警告的最佳方法是使用严格的测试套件，使用意外数据和异常情况覆盖所有条件（条目 96）。\n\n####\
  \ 使用 diagnostics 获取更多信息\n\n如果你刚开始接触警告，可能会遇到不理解的情况。即使你已经使用 Perl 一段时间，仍然可能遇到晦涩的警告。`diagnostics`\
  \ 编译指令可以提供更长的、更详细的解释。要使用它，只需添加：\n\n```perl\nuse diagnostics;\n```\n\n这将导致 Perl 在每条警告后输出详细的解释，这对于学习警告的含义以及如何修复它非常有价值。\n\
  \n\n\n\n\n# 第 11 章 警告\n\n如果你长期使用 Perl，可能会遇到之前从未见过的警告。要了解更多关于某个警告的信息，可以查阅 `perldiag`\
  \ 文档，那里有详细的错误解释。大多数解释都会指出可能触发该警告的问题。\n\n不过，有一种更简单的方法来获取详细信息，无需翻阅文档。你可以使用 `diagnostics`\
  \ 编译指令，将简短的错误信息转换为详细的说明：\n\n```\n# use warnings;\n\nuse diagnostics;\n\n$foo = 1;\n\
  ```\n\n现在程序的输出会详细得多：\n\n```\n% perl -c program.pl\n\nName \"main::foo\" used only\
  \ once: possible typo ...\n```\n\n(W once) 拼写错误通常表现为独特的变量名。如果你有充分的理由使用独特的名称，那么只需再次提及它即可抑制该消息。`our`\
  \ 声明就是为此目的而提供的。\n\nptg\n\n注意：此警告检测仅使用过一次的符号，因此 `$c`、`@c`、`%c`、`*c`、`&c`、`sub c{}`、`c()`\
  \ 和 `c`（文件句柄或格式）被视为相同；如果程序只使用了一次 `$c`，但也使用了其他任何符号，则不会触发此警告。\n\n### 生产环境中的警告\n\n\
  在生产环境中启用警告是一个有争议的问题，因此如果你提到这一点，请准备好有人会尖叫或跳脚。这就像大括号风格、制表符与空格、可口可乐与百事可乐之争一样。\n\n请自行决定你站在哪一边。\n\
  \n运行时警告会给程序带来轻微的速度损失，而且向用户展示意外或虚假的警告信息也不是好主意。通常，警告是给开发者看的，而不是给用户看的。\n\n你应该为发布到外界的应用程序代码关闭警告。由于你可以有选择地启用警告并检查它们是否已启用（条目\
  \ 100），因此当你需要调试程序时，可以重新打开它们。\n\n一个主要问题是警告在不同 Perl 版本之间会发生变化。不仅会出现新的警告，而且有些之前无害的警告可能会变成致命错误。你在部署应用程序时愿意承担这种风险吗？\n\
  \n那些坚持“始终开启所有警告”的人，可能不是那些在周末凌晨被叫去工作，发现 Perl 升级导致原本无警告且运行正常的应用程序开始大量输出新警告并填满磁盘的人——尽管应用程序仍然运行良好，而且也没有人监控这些警告。\n\
  \n如果你想保留警告，那没问题，但你也可以随时重新启用它们。这是一个完全可逆的决定。在企业级应用中，你应该使用类似 `Log::Log4perl`（条目 113）的工具来记录经过充分测试的关键代码的消息，并配合适当的测试套件，在部署前捕获所有警告。\n\
  \nptg\n\n### 要点回顾\n\n- 使用 `perl -cw` 检查编译时警告。\n- 使用 `use warnings` 启用每个文件的警告。\n\
  - 使用 `use diagnostics` 获取特定警告的更多信息。\n\n## 条目 100. 使用词法警告有选择地开启或关闭提示。\n\n警告会指出代码中的“异味”，这些异味虽然不足以让程序停止运行，但你仍需关注。\n\
  \n你可能并不在意 `$number` 未初始化。当 Perl 将其转换为数字时，它会变成零，这对于加法来说完全没问题：`my $number;`\n\n```\n\
  my $value = $number + 2;\n```\n\n然而，当你启用警告时，Perl 会抱怨：`Use of uninitialized value\
  \ $number in addition (+)`\n\n下载自 <www.wowebook.com>\n\n你并不真正在意 `$number` 没有值，因为结果仍然是正确的。这是一个简单的例子，但你会遇到这样的情况：消除警告比忽略它更痛苦。在这些情况下，你可以暂时关闭警告。\n\
  \n`warnings` 编译指令是词法作用域的，因此你可以将问题代码包裹在一个块中，并临时取消导入它：\n\n```\n{\n    no warnings;\n\
  \    my $number;\n    my $value = $number + 2;\n}\n```\n\n但这有一个小问题：它会关闭所有警告。你可能会因此错过其他重要的警告。\n\
  \n`warnings` 编译指令将警告分组为类别，你可以有选择地启用或禁用它们。完整列表请参阅 `warnings` 文档。在这种情况下，你可以只关闭未初始化警告：\n\
  \nptg\n\n```\n{\n    no warnings 'uninitialized';\n    my $number;\n    my $value\
  \ = $number + 2;\n}\n```\n\n### 将某些警告变为致命错误\n\n你可能非常讨厌某些问题，以至于希望它们成为致命错误而不是警告。例如，当\
  \ Perl 无法完全将字符串转换为数字时，你通常会得到一个警告：\n\n```\nuse warnings;\nmy $sum = '123buster' +\
  \ 5;\nprint \"The sum is $sum\\n\";\n```\n\n你会收到警告，但 Perl 会继续运行并给出结果：`Argument \"\
  123buster\" isn't numeric in addition (+)` `The sum is 128`\n\n下载自 <www.wowebook.com>\n\
  \n如果这种情况绝不应在你的代码中出现，你可以将其设为致命错误：\n\n```\nuse warnings FATAL => 'numeric';\nmy $sum\
  \ = '123buster' + 5;\nprint \"The sum is $sum\\n\";\n```\n\n现在，你只会收到警告，因为程序在尝试添加非数字值时停止了：\n\
  \n`Argument \"123buster\" isn't numeric in addition (+)`\n\n### 在模块中使用预定义的警告类别\n\
  \n你也可以基于词法警告设置来发出警告。不要使用 `warn` 来发出消息，而是使用 `warnings` 编译指令中的 `warnif`。你还可以指定警告的类别：\n\
  \n```\nsub create {\n    warnings::warnif( 'deprecated',\n        'create is deprecated,\
  \ use new instead' );\n    ...;\n}\n```\n\nptg\n\n如果你正在使用 `Carp`（条目 102），可以在触发 `carp`\
  \ 之前检查警告类别是否已启用：\n\n```\nuse Carp;\n\nsub create {\n    carp('create is deprecated,\
  \ use new instead')\n        if warnings::enabled('deprecated');\n    ...;\n}\n\
  ```\n\n尽管 `warnif` 会尊重致命警告的请求，但你在调用 `carp` 之前无法检查某个特定类别的警告是否应为致命错误。\n\n### 创建你自己的警告类别\n\
  \n词法警告不止于此。如果你发现没有预定义的类别能满足你的需求，你可以定义自己的类别，并像处理预定义类别一样响应开启或关闭它们的请求。\n\n下载自 <www.wowebook.com>\n\
  \n### 要点回顾\n\n- 使用 `no warnings` 在作用域内禁用警告。\n- 如果你知道要忽略某些警告，可以有选择地禁用这些类别的警告。\n-\
  \ 将某些警告提升为致命错误。\n\n## 条目 101. 使用 `die` 生成异常。\n\n有些人保留着老式 C 程序员的习惯，在每个函数后返回一个成功代码。例如，为了从子例程中发出错误信号，他们可能会返回\
  \ `undef`：\n\n```\nsub do_work {\n    my $task = shift;\n    if ( $task < 0 ) {\n\
  \        return; # 错误，返回 undef\n    }\n    ...;\n}\n```\n\nptg\n\n这种方法虽然可行，但你需要做大量工作来检查子例程是否成功：\n\
  \n```\nmy $value = do_work($task);\nif ( defined $value ) {\n    print \"It worked\
  \ and I got [$value]!\\n\";\n}\nelse {\n    print \"Something went wrong, but I\
  \ don't know what!\\n\";\n}\n```\n\n在发生错误时，你知道出了问题，但不知道具体是什么问题。你可以在遇到问题场景时使用 `die`，这样就能给出有意义的错误信息：\n\
  \n```\nsub do_work {\n    my $task = shift;\n    if ( $task < 0 ) {\n        die(\"\
  Task [$task] should be greater than zero\");\n    }\n    ...;\n}\n```\n\n下载自 <www.wowebook.com>\n\
  \n\n\n\n\n这算不上多大的变化，但它还有另一个好处：它迫使你去处理问题，因为否则程序会停止。你可以通过 `eval` 来捕获这种情况。如果 `do_work`\
  \ 失败，`eval` 会捕获它并将 die 消息放入 `$@` 中：\n\n```\nmy $value = eval { do_work(@tasks) };\n\
  if ($@) {\n    # 处理错误\n}\n```\n\n你必须在 `eval` 之后立即检查 `$@`，在其它任何东西有机会改变它之前（条款 103）。\n\
  \n`eval`-`if` 惯用法的作用类似于其他语言中的 `try`-`catch`，尽管 Perl 中也可以使用 `try`-`catch`（条款 103）。\n\
  \n不过，它还能做得更好。你可以用引用（reference）来 `die`，这个引用可以是一个代表错误的对象。例如，你可以有一个错误记录模块来创建错误对象：\n\
  \n```\nsub do_work {\n    my $task = shift;\n    if ( $task < 0 ) {\n        die\
  \ MyErrors->fatal(\"任务应大于 0\");\n    }\n    ...;\n}\n```\n\n当 `eval` 失败并且你在 `$@`\
  \ 中找到了你的对象时，你可以像处理任何其他对象一样处理它。这给了你更大的灵活性：\n\n```\nmy $value = eval { do_work(@tasks)\
  \ };\nif ( my $error = $@ and ref $error ) {\n    print \"我在级别 \", $error->level,\
  \ \" 发现了一个错误\\n\";\n    print \"消息是 \", $error->message, \"\\n\";\n}\n```\n\n在遇到问题时调用\
  \ `die` 并不适用于所有情况。如果你使用 `autodie`（条款 27）来处理 Perl 内置函数的错误，你也不需要显式地这样做。对于更高级的异常处理，可以使用像\
  \ `Try::Tiny`（条款 103）这样的模块。\n\n### 要记住的事项\n\n- 使用 `die` 来生成异常。\n- 给 `die` 传递一个引用或对象，以传递结构化的错误信息。\n\
  - 使用 `eval` 捕获异常。\n\n## 条款 102. 使用 Carp 获取堆栈跟踪。\n\n如果你的代码将要 `die` 或发出警告，那么它最好能在失败时提供尽可能多的关于当前情况的信息。最有价值的信息之一就是调用栈。\n\
  \n不幸的是，Perl 内置的 `die` 和 `warn` 函数并不提供这些信息。\n\n下面是一系列调用 `randomly_fail` 的子程序，其中一些子程序相互调用。当你运行这个程序时，你不知道它会在哪里失败。\n\
  \n```\nsub randomly_fail {\n    die '哎呀！' if int( rand(100) ) % 10 == 0;\n}\n\n\
  sub caller_one {\n    randomly_fail();\n}\n\nsub caller_two {\n    caller_one();\n\
  \    randomly_fail();\n}\n\nsub caller_three() {\n    caller_two();\n    randomly_fail();\n\
  }\n\nwhile (1) {\n    caller_three();\n}\n```\n\n当你运行程序时，你会看到它（如预期地）死掉了；但你不知道在哪里，也不知道程序运行了多久：\n\
  \n```\n% perl randomly_fail.pl\n哎呀！ at die.pl line 2.\n```\n\n这不是一个很有信息量的错误消息。当然它是在第\
  \ 2 行死掉的：那里就是 `die` 所在的位置。你早就知道了！`warn` 也是同样的情况。\n\n### Carp 提供更多信息\n\n`Carp` 是一个核心模块，它提供的错误消息比\
  \ `die` 或 `warn` 更有用。分别用 `croak` 和 `carp` 替代 `warn` 和 `die`，你将得到从调用函数视角出发的完整堆栈跟踪。\n\
  \n错误消息告诉你的不是代码停止的位置，而是上一级的位置。你会知道是谁调用了这个子程序：\n\n```\npackage Bar;\nuse Carp;\nsub\
  \ fail { croak \"呱呱！\" }\npackage main;\nBar::fail();\n```\n\n尽管这个程序在第 3 行停止，但实际上是第\
  \ 7 行通过调用 `Bar::fail` 导致了问题，所以 `croak` 报告的是：\n\n```\n呱呱！ at carp.pl line 7\n```\n\
  \n当调用者位于不同的包中时，你会得到这样的消息。`Carp` 通过向上遍历调用栈直到发现包变化来完成它的工作。\n\n如果 `Carp` 在调用栈中没有发现包的变化，它会给你一个完整的堆栈跟踪。现在，你可以通过将第一个例子中的\
  \ `die` 改为 `croak` 来改进它：\n\n```\nuse Carp;\n\nsub randomly_fail {\n    croak '哎呀'\
  \ if int( rand(100) ) % 10 == 0;\n}\n\nsub caller_one {\n    randomly_fail();\n\
  }\n\nsub caller_two {\n    caller_one();\n    randomly_fail();\n}\n\nsub caller_three()\
  \ {\n    caller_two();\n    randomly_fail();\n}\n\nwhile (1) {\n    caller_three();\n\
  }\n```\n\n运行程序几次，你会看到每次运行导致失败的事件链：\n\n```\n% perl carp.pl\n哎呀 at carp.pl line 4\n\
  main::randomly_fail() called at carp.pl line 8\nmain::caller_one() called at carp.pl\
  \ line 12\nmain::caller_two() called at carp.pl line 17\nmain::caller_three() called\
  \ at carp.pl line 22\n\n% perl carp.pl\n哎呀 at carp.pl line 4\nmain::randomly_fail()\
  \ called at carp.pl line 18\nmain::caller_three() called at carp.pl line 22\n```\n\
  \n如果这是一个你实际维护的有趣程序，那么你现在就有办法追踪失败了。\n\n### confess 总是提供回溯\n\n你不必停留在同一个包中来获取完整的堆栈回溯。如果你将\
  \ `croak` 改为 `confess`，你会得到一切：\n\n```\npackage Bar;\nuse Carp;\nsub fail { confess\
  \ \"呱呱！\" }\npackage main;\nBar::fail();\n```\n\n现在，即使程序在不同于调用者的包中死掉，你也能得到堆栈回溯：\n\
  \n```\n呱呱！ at carp.pl line 3\nBar::fail() called at carp.pl line 7\n```\n\n这使得 `confess`\
  \ 成为一个很好的调试工具，但你可能不希望在生产环境中使用它。如果你不是在调试，坚持使用 `croak`。你可以通过将 `$Carp::Verbose` 设置为真值来将\
  \ `croak` 变成 `confess`，这意味着你可以局部化它的效果：\n\n```\n{\n    local $Carp::Verbose = 1;\n\
  \    Bar::fail();\n}\n```\n\n如果你想将所有 `croak` 改为 `confess`，你也可以直接修改 `Carp` 的导入：\n\
  \n```\nuse Carp 'verbose';\n```\n\n这样，你的代码使用 `croak`，但当你需要调试程序时，你可以选择性地临时获得完整的堆栈跟踪。\n\
  \n### 要记住的事项\n\n- 使用 `Carp` 获取导致错误或警告的代码信息。\n- 使用 `confess` 获取完整的堆栈回溯。\n\n## 条款\
  \ 103. 正确处理异常。\n\nPerl 没有内置的异常处理机制，因此你必须用 `eval` 和 `if` 来模拟它（条款 101）：\n\n```\nmy\
  \ $value = eval { die \"抛出一个错误\"; };\nif ($@) {\n    warn \"我捕获了一个错误：$@\";\n}\n\
  ```\n\n有一个大问题。你可以用任何你喜欢的值来 `die`，包括假值。在这种情况下，`$@` 是假的，`if` 不会捕获它：\n\n```\nmy $value\
  \ = eval { die ''; };\nif ($@) {\n    warn \"我应该已经捕获了一个错误：$@\";\n}\n```\n\n### Try::Tiny\
  \ 做得对\n\n正确的方法最好由 `Try::Tiny` 模块展示。CPAN 上有几个异常处理模块，但这个模块很小，没有有问题的依赖。如果你想用标准 Perl\
  \ 完成它的工作，你只需要遵循它的示例。\n\n首先，你必须正确处理 `$@`。这比大多数人想象的要棘手。你需要避免两个问题：你不想改变 `$@` 的值，以免影响包裹你的另一个\
  \ `eval` 层级；你也不希望嵌套的 `eval`（即使它隐藏在函数调用后面）改变你的 `$@`。你需要在开始处理之前局部化 `$@`。一旦你执行了 `eval`，立即将\
  \ `$@` 保存到你自己的变量中，这样其他东西就不会改变它。这是 `Try::Tiny` 中展示解决方案核心的片段：\n\n```\nmy ( $error,\
  \ $failed );\n{\n    local $@;    # 保护上层的变化\n    $failed = not eval {\n        die\
  \ \"抛出一个错误\";\n        return 1;\n    };\n    $error = $@; # 保护来自下层的变化\n}\nif ($failed)\
  \ {\n    warn \"捕获了一个错误：$error\";\n}\n```\n\n`Try::Tiny` 模块为你处理了样板代码，并提供了常见的 `try`/`catch`\
  \ 语法：\n\n```\nuse Try::Tiny;\ntry {\n    die \"抛出一个错误\";\n}\ncatch {\n    warn \"\
  捕获了一个错误：$_\";\n};\n```\n\n\n\n\n\n请注意，`catch` 块以分号结尾。它是一个 Perl 语句，就像 `eval` 一样。此外，它将错误存储在\
  \ `$_` 而不是 `$@` 中（原因如前所述，它不得不进行那些复杂的操作）。\n\n你也可以使用引用（条款 101）来 `die`，然后使用 `given-when`\
  \ 语法（条款 24）来过滤错误：\n\n```\nptg\n\nuse Try::Tiny;\n\nuse 5.010;\n\ntry {\n\ndie MyError->new(...);\n\
  \n}\n\ncatch {\n\nwhen ( $_->type eq 'IO' ) { ... }\n\nwhen ( $_->type eq 'Fatal'\
  \ ) { ... }\n\ndefault { ... };\n\n};\n```\n\n如果你想忽略错误，只需不捕获它们即可：`use Try::Tiny;`\n\
  \n```\ntry {\n\ndie \"throw an error\";\n\n};\n```\n\n下载自 <www.wowebook.com>\n\n\
  ### Try::Tiny 的陷阱\n\n有时，你看起来在使用 `Try::Tiny`，但实际上并没有。这个示例忘记加载模块，但仍然是有效的 Perl 语法，不会报错，即使在严格模式下也是如此（条款\
  \ 3）：\n\n```\nuse strict;\n\ntry {\n\ndie \"throw an error\"; # 总是会 die\n\n}\n\n\
  catch {\n\nwarn \"Caught an error: $_\";\n\n};\n```\n\n此外，由于 `try-catch` 中的块实际上是\
  \ Perl 的子例程，你不应该在它们里面使用 `return`，因为那会导致混乱：\n\n```\ntry {\n\ndie \"throw an error\"\
  ;\n\nreturn; # 错误！\n\n}\n\nptg\n\ncatch {\n\nwarn \"Caught an error: $_\";\n\n};\n\
  ```\n\n### 需要记住的事项\n\n- 使用 `eval` 捕获错误并在 `$@` 中检查它们。\n- 处理 `$@` 很棘手，但 `Try::Tiny`\
  \ 能正确处理。\n\n## 条款 104. 使用污点检查追踪危险数据。\n\n污点检查是 Perl 的一个运行时特性，用于追踪程序内部的数据流。Perl 将来自用户输入或外部世界（如命令行参数、环境变量、文件或流输入）的数据标记为“已污染”。你将无法将这些数据传递给外部程序，因为当你尝试这样做时，Perl\
  \ 会停止你的程序。\n\n你可以使用 `-T` 开关启用污点检查：\n\n```\n% perl -T program.pl\n```\n\n下载自 <www.wowebook.com>\n\
  \n你也可以在 shebang 行中启用它：\n\n```\n#!perl -T\n```\n\n在某些情况下，例如在 `setuid` 下运行时，Perl 会自动为你打开污点检查。\n\
  \n如果你在命令行上指定了 `-T` 并尝试显式使用 `perl` 运行程序，你会得到一个错误：\n\n```\n% perl program.pl\n\n\"\
  -T\" is on the #! line, it must also be used on the ↵\n\ncommand line\n```\n\n为了让你了解污点检查的工作原理，考虑一个程序，它从用户那里获取一个\
  \ glob 模式并将其传递给外部的 `grep` 程序：\n\n```\n#!perl -T\n\nprint \"Enter a grep pattern:\
  \ \";\n\nchomp( my $pattern = <STDIN> );\n\nprint `grep $pattern *`;\n```\n\n```\n\
  ptg\n```\n\n如果你在启用污点检查的情况下运行此程序，Perl 会在它有机会做任何事情之前停止它：\n\n```\nInsecure dependency\
  \ in `` while running with -T switch\n```\n\n你直接从标准输入获取了变量 `$pattern` 中的数据，它可能是任何内容。将用户输入直接发送到\
  \ shell 是一个坏主意——假设用户输入了带有特殊字符的内容，例如启动新命令的 `;`：\n\n```\n% perl program.pl\n\nenter\
  \ pattern: ; rm *\n```\n\n在污点检查下，你必须先净化数据，然后才能将其用于外部进程。唯一被认可的净化数据的方法是使用带有捕获变量的正则表达式匹配。净化数据的最佳方法是构建一个非常具体的模式，只匹配你允许的内容（Mark\
  \ Jason Dominus 称之为“普鲁士方法”）。例如，如果你希望用户只在他们的 `grep` 模式中输入字母、`.` 和 `*` 量词，那么你只匹配这些字符：\n\
  \n```\n#!perl -T\n\n下载自 <www.wowebook.com>\n\nmy $tainted_data = <STDIN>;\n\nmy\
  \ $untainted_data = do {\n\nif ( $tainted_data =~ m/^([a-z.*])$/i ) {\n\n$1;\n\n\
  }\n\nelse {\n\ndie\n\n\"The pattern can only contain letters, ., or *!\\n\";\n\n\
  }\n\n};\n\nprint `grep '$untainted_data' *`;\n```\n\n在这个例子中，如果输入不完全符合你的预期，你就会失败。如果你遗漏了本应允许的内容，你不会遇到安全问题，但你必须调整你的正则表达式。反过来——如果你忘记排除本应排除的内容——你仍然会有问题。如果这是一种过于严格的方法，你必须自己决定要严格到什么程度。然而，在处理外部程序时，\n\
  \n```\nptg\n\n偏执是一种美德。\n```\n\n你以为你已经修复了所有问题，但现在当你运行程序时，你得到了一个不同的错误：\n\n```\nInsecure\
  \ $ENV{PATH} while running with -T switch\n```\n\nPerl 需要找到 `grep` 程序，因此它必须开始查找\
  \ `$ENV{PATH}`，但这也来自程序外部，因此它也被污染了。当 Perl 尝试使用它时，污点检查会介入并停止程序。要解决这个问题，你可以将 `$ENV{PATH}`\
  \ 设置为空字符串，这样它就不再被污染，并使用你想要的命令的绝对路径（这确保你得到你想要的命令）：\n\n```\n$ENV{PATH} = '';\n\n...;\n\
  \nprint `/usr/bin/grep '$untainted_data' *`;\n```\n\n你也可以将 `$ENV{PATH}` 设置为绝对路径，但这些目录不能由运行你的程序的所有者或组写入。这需要更多的工作。\n\
  \n下载自 <www.wowebook.com>\n\n有关污点检查的更多信息，请参阅 `perlsec` 文档或 `Mastering Perl` 中的“安全”章节。¹\
  \ 如果你想为现有程序添加污点检查，请从污点警告开始（条款 105）。\n\n### 需要记住的事项\n\n- 使用污点检查防止外部数据影响外部命令。\n- 使用正则表达式和捕获来净化数据。\n\
  - 在你的程序中，将 `PATH` 环境变量调整为可信目录。\n\n## 条款 105. 从污点警告开始处理遗留代码。\n\n污点检查是一种 Perl 开发工具，可帮助你找到程序中你将“不可信”数据传递给外部世界的位置（条款\
  \ 104）。\n\n一旦启用，任何来自程序外部的输入都是“已污染的”，包括命令行参数、CGI 输入、文件数据、`%ENV` 中的值等。Perl 用一个特殊标志标记这些数据。任何\n\
  \n```\nptg\n\n从已污染值派生出的数据也是已污染的，当你尝试将这些数据传递到程序外部时，Perl 会终止你的程序。\n```\n\n对于较旧的代码，启用污点检查可能意味着你需要花费很长时间才能让代码重新正常工作，因为你必须追踪所有需要调整、重写或绕过的内容。\n\
  \n你仍然希望让你的遗留代码对污点安全，因此 Perl 提供了 `-t` 开关。它执行与它的“大哥” `-T` 相同的工作，但在发现问题时仅发出警告。你可以在命令行上使用它：\n\
  \n```\n% perl -t program.pl\n```\n\n或者，与任何命令行开关一样，你可以在 shebang 行中使用 `-t`：\n\n```\n\
  #!/usr/bin/perl -t\n```\n\n现在用污点警告运行同一个程序：\n\n```\n#!perl -t\n\nsystem(\"ls -l\"\
  );\n```\n\n1. brian d foy, `Mastering Perl` (Sebastopol, CA: O’Reilly Media, 2007).\n\
  \n下载自 <www.wowebook.com>\n\n污点检查会发出两个警告，而不是在第一个问题上就终止，并且仍然会运行操作：\n\n```\nInsecure\
  \ $ENV{PATH} while running with -t switch...\n\nInsecure dependency in system while\
  \ running with -t ↵\n\nswitch...\n\n...\n```\n\n你在不安全的遗留代码上启用此功能，并观察输出日志以识别问题点，而不会造成太多停机时间。当你发现问题时，你可以修复它们。\n\
  \n在这种情况下，污点检查不喜欢 `$ENV{PATH}` 中的设置。运行程序的人可以将 `PATH` 设置为他喜欢的任何内容。因此，程序无法知道它将运行哪个\
  \ `ls`。你需要将 `$ENV{PATH}` 设置为一个绝对路径列表，这些路径指向运行脚本的所有者和组没有写入权限的目录。简单的方法是完全不依赖 `$ENV{PATH}`。相反，在\
  \ `system` 调用中指定命令的路径：\n\n```\n#!perl -t\n\nptg\n\n$ENV{PATH} = ''; # 或者 '/bin'\
  \ 或其他安全目录 system(\"/bin/ls\");\n```\n\n现在你已经消除了这两个污点警告。\n\n\n\n\n\n一旦你确信程序是安全的，就可以将代码升级为完整的\
  \ `-T` 模式。你的程序在极少数情况下仍可能崩溃，但至少不会每次运行都挂掉，因为你已经修复了大部分问题。\n\n*请记住，* `-t` *只是用于让遗留代码达到标准的工具。*\
  \ `-t` 不适用于新项目，新项目从一开始就应该使用 `-T`。\n\n### 需要记住的事项\n\n- 在遗留代码中谨慎使用污点检查。\n- 使用 `-t`\
  \ 开关在遗留代码上启用污点警告。\n- 在新代码中使用 `-T` 进行完整的污点检查。\n\n下载自 <www.wowebook.com>\n\n# 12 ❘\
  \ 数据库\n\nPerl 的 `DBI` 模块使得与几乎所有流行的数据库服务器（以及许多不那么流行的服务器）交互变得极其简单。虽然操作机制相当简单直接，但仍存在许多高级陷阱。\n\
  \n数据库交互是一个专门的课题，因为它需要的知识远不止 Perl 本身。你必须了解查询语言、数据库服务器的特性，以及许多其他 Perl 之外的知识。这是一个极其庞大的话题，值得单独写一本书。不过，有一些技巧可以立即提升你的\
  \ Perl 数据库使用体验。\n\n我们有意忽略了一些主题，例如 KiokuDB、CouchDB 等文档数据库系统，以及 `DBIx::Class` 等对象关系映射器（ORM）。所有这些主题也都值得单独成书，并且是你应该进一步研究的方向。\n\
  \n## 第 106 条 准备 SQL 语句以复用工作并节省时间\n\n数据库查询涉及几个步骤：构造查询、数据库服务器解析并规划如何处理、数据库服务器执行处理，最后获取结果。其中任何一个步骤都可能成为瓶颈。\n\
  \nPerl 的 `DBI` 模块允许你进行一次性查询：\n\n```perl\nuse DBI;\nmy $dbh = DBI->connect(...);\n\
  my $rv = $dbh->do('DROP TABLE table');\nmy $array = $dbh->selectall_arrayref('SELECT\
  \ * FROM table');\n```\n\n**377**\n\n下载自 <www.wowebook.com>\n\n**378** ❘ *第 12 章\
  \ 数据库* 你可能会很快将那个 `selectall_arrayref` 转换成一个循环，执行相同的 `SELECT`，但针对特定记录：\n\n```perl\n\
  foreach my $id (@ids) {\n    my $array = $dbh->selectall_arrayref(\n        \"SELECT\
  \ * FROM table WHERE id = $id\");\n}\n```\n\n尽管这个查询简单易处理，但想象一下更复杂的查询，涉及多个表、复杂的连接或子查询。循环的每次迭代都从头开始，即使查询的大部分细节没有变化。\n\
  \n如果你重复执行相同的查询（尽管可能使用不同的值），在第一次查询之后，你可以跳过构造查询以及数据库服务器解析和规划处理步骤。在复杂查询中，这两个步骤可能占用大部分时间。一位同事构造了一个耗时五分钟的查询，尽管他尽力优化，但时间仍然太长。由于他需要多次调用这个查询，程序花费了很长时间才完成。他最终发现，其中\
  \ 90%的时间只是数据库在规划查询，一旦规划完成，实际运行非常快。他的问题根本不是查询速度。\n\n与其重复发出一次性查询，你可以**准备**一个查询，即构建并规划查询但不实际执行。你可以根据需要多次复用这个准备好的查询，而无需重新执行创建工作。`prepare`\
  \ 方法为你处理所有细节，你可以使用占位符（第 107 条）来代表稍后填充的数据。`prepare` 命令返回一个语句句柄，你将其存储在 `$sth` 中：\n\
  \n```perl\nuse DBI;\nmy $dbh = DBI->connect(...)\n    or die '无法连接到数据库';\nmy $sth\
  \ = $dbh->prepare('SELECT * FROM table WHERE id = ?');\n```\n\n使用占位符构造查询允许数据库缓存该查询。如果你的数据库针对缓存进行了优化，它会解析查询并存储执行计划，以便后续查询使用预先计算好的执行计划。\n\
  \n下载自 <www.wowebook.com>\n\n*第 106 条 准备 SQL 语句以复用工作并节省时间* ❘ **379**\n\n当你准备运行查询时，调用语句句柄上的\
  \ `execute` 方法，传入参数以填充占位符。在循环中，每次执行查询时，数据库都会命中缓存，不会重新解析查询，从而加快速度：\n\n```perl\nforeach\
  \ my $id (@ids) {\n    my $array = $dbh->execute($id);\n}\n```\n\n### 准备多个语句以处理不同情况\n\
  \n一旦你准备了一个查询，就必须原样使用它。如果需要更改参数数量、表名或其他内容，你需要准备不同的查询。不过，你可以准备任意数量的查询，并在需要时选择合适的查询。\n\
  \n假设你想选择列表中所有值对应的记录。在 SQL 中，你可以使用 `IN`：\n\n```sql\nSELECT * FROM table WHERE id\
  \ IN ( ... )\n```\n\n但 `IN` 列表中有多少个项呢？你必须在 `prepare` 语句中使用固定数量的占位符。以下语句恰好接受两个参数：\n\
  \n```perl\nmy $sth = $dbh->prepare(\n    'SELECT * FROM table WHERE id IN ( ?, ?\
  \ )'\n);\n```\n\n然而，在你的程序中，你可能需要一次处理 1 到 10 个参数。由于 `DBI` 不会为你处理可变参数数量，你必须自己处理。下面是一个围绕数据库句柄的包装器（使用依赖注入，第\
  \ 89 条）。当你在 `MyDBI::VariadicPrepare` 中构造一个新对象时，它会创建几个准备好的查询。每个查询处理不同数量的参数，你将每个查询的语句句柄作为对象哈希的一部分存储：\n\
  \n```perl\npackage MyDBI::VariadicPrepare::Cache;\nsub new {\n    my ( $class, $dbh\
  \ ) = @_;\n    my $self = bless { dbh => $dbh }, $class;\n    for my $num ( 1 ..\
  \ 10 ) {\n        $self->{ 'sth_' . $num } = $self->{dbh}->prepare(\n          \
  \  sprintf(\n                'SELECT value FROM my_table WHERE id IN (%s)',\n  \
  \              join( ',', ('?') x $num ) )\n        );\n    }\n    return $self;\n\
  }\n```\n\n与其直接调用 `execute`，不如提供一个包装子程序，根据参数数量选择正确的准备好的语句：\n\n```perl\nsub do_something\
  \ {\n    my ( $self, @values ) = @_;\n    if ( @values > 10 ) {\n        die '我只能支持\
  \ 10 个或更少的值';\n    }\n    $self->{ 'sth_' . @values }->execute(@values);\n}\n```\n\
  \n这种方法可行，但很丑陋。此外，在这个特定例子中，你将自己限制在 `SELECT` 语句的十个值以内。更糟糕的是，你可能永远不会使用预先计算的大部分 `prepare`\
  \ 语句，从而浪费大量时间来准备复杂冗长但从未使用的语句句柄。\n\n别担心；有更好的方法。\n\n### DBI 可以为你缓存\n\n`DBI` 可以通过其\
  \ `prepare_cached` 方法为你缓存准备好的语句，而不是你自己手动缓存。该方法为你处理客户端缓存，使代码更简洁高效。\n\n你无需提前做任何工作或自己管理缓存：\n\
  \n```perl\nuse DBI;\nmy $dbh = DBI->connect(...)\n    or die '无法连接到数据库';\nmy $sth\
  \ = $dbh->prepare_cached(\n    sprintf( 'SELECT value FROM my_table WHERE id IN\
  \ (%s)',\n        join( ',', ('?') x $num ) )\n);\n```\n\n每次调用 `prepare_cached`\
  \ 时，`DBI` 都会搜索其语句句柄缓存。如果找到已准备好的匹配查询，则返回它；否则，创建一个新的语句句柄。第一次创建语句句柄时，你需要承担 `DBI` 和数据库服务器必须完成的工作开销，但你只为你实际使用的查询付费。\n\
  \n\n\n\n\n不过这里有一个注意事项。如果你在完成一个查询之前，同时运行两个使用相同语句句柄的查询，可能会得到奇怪的结果。第二个查询会替换第一个查询的工作。如果你想同时运行多个查询，必须准备两个独立的语句句柄（因此不能使用\
  \ `prepare_cached`）。\n\n## 并非每条语句都需要缓存\n\n有些情况下，准备 SQL 语句并不会带来太多好处。如果你有一条静态的 SQL\
  \ 语句，它会重复执行且不依赖额外参数，那么每次执行该语句时数据库都应该能命中缓存。准备操作并非必要。下面两个循环的性能表现相似：\n\n```\nmy $query\
  \ = 'select count(*) from my_table';\n\nforeach ( 1 .. 100 ) {\n    my $array =\
  \ $dbh->selectrow_array($query);\n}\n\nforeach ( 1 .. 100 ) {\n    my $sth = $dbh->prepare_cached($query);\n\
  \    my $array = $sth->fetchrow_array;\n}\n```\n\n不过，由于它们的性能相近，你无需担心那些缓存了不需要缓存的查询的异常情况。\n\
  \n**要点回顾**\n\n-   通过缓存语句句柄来节省准备时间。\n-   使用 `prepare_cached` 缓存语句句柄。\n-   并非每条语句都需要缓存，但缓存也无妨。\n\
  \n## 第 107 条：使用 SQL 占位符实现自动值引用\n\n在 SQL 中使用占位符来代表值是一种良好的实践，你应该严格遵守。SQL 占位符不仅能让你的代码运行更快，还能帮助保护代码免受\
  \ SQL 注入攻击。正确使用它非常简单，你没有理由不这样做。\n\n当你动态构建 SQL 语句时，有两个主要因素会发生变化，从而使语句变得动态：查询本身的结构，以及查询所引用的数据值。\n\
  \n### 不要将变量直接插入查询中\n\n对于快速编写的程序，你可能会想用 `selectall_arrayref` 写一条一次性语句，直接发送数据库查询并获取结果：\n\
  \n```\nuse DBI;\nmy $dbh->connect( ... );\nmy $rows = $dbh->selectall_arrayref(\n\
  \    \"select v1, v2 from my_table where id = '$id'\"\n);\n```\n\n这种技术有两个主要缺点，应该让你避免在除最短程序之外的任何地方使用它。\n\
  \n首先，`selectall_arrayref` 每次都会创建一个全新的查询字符串传递给数据库。由于大多数数据库管理系统会精确匹配执行计划缓存中的字符串，因此运行此查询时几乎不可能命中缓存。这可能会导致代码运行速度明显变慢，尤其是当你拥有需要数秒解析的复杂查询时（第\
  \ 106 条）。\n\n其次，它容易受到 **SQL 注入** 攻击，即插入的变量 `$id` 的值包含意外但最终合法的 SQL 代码。如果 `$id` 的值类似于\
  \ `\"1' or 'a'='a\"` 会怎样？这个值实际上绕过了查询的过滤逻辑，导致从 `my_table` 返回所有数据。如果 `my_table` 包含敏感信息，这可能会带来麻烦。\n\
  \n### 动态数据值的占位符\n\n要在使用同一条语句的不同调用中包含变化的数据，你可以使用 **占位符**。用 `?` 表示占位符，代表稍后填充的数据。\n\
  \n在 `selectall_arrayref` 中，你指定带有占位符的语句、该查询的 DBI 设置（本例中是一个空哈希引用），然后是与查询一起使用的数据：\n\
  \n```\nmy $rows = $dbh->selectall_arrayref(\n    'select v1, v2 from my_table where\
  \ id = ?',\n    {}, $id );\n```\n\n尽管不同的数据库驱动可能以不同方式处理占位符，但这可以防止 SQL 注入。驱动要么将数据与查询分开发送到服务器，要么在将数据插入查询时进行适当的引用和转义。\n\
  \n更常见的情况是，你想多次运行同一条查询，因此你可以用占位符准备它，然后针对每次运行使用数据执行它：\n\n```\nmy $sth = $dbh->prepare(\n\
  \    'select v1, v2 from my_table where id = ?');\nforeach my $id (@ids) {\n   \
  \ $sth->execute($id);\n    ...;\n}\n```\n\n你甚至可以提前准备语句并预先缓存它们（第 106 条）。\n\n### 创建动态\
  \ SQL 元素\n\n占位符只能将数据值插入查询。你不能将占位符用于查询的其他部分，例如表名。\n\n要使用在运行时决定的表名，你可以使用 DBI 的 `quote_identifier`\
  \ 来确保表名是有效的标识符：\n\n```\nmy $table = get_table_name();\nmy $sth = $dbh->prepare(\n\
  \    sprintf( 'select * from %s',\n        $dbh->quote_identifier($table) )\n);\n\
  ```\n\n不过，这并不会检查 `$table` 中的值是否是一个已存在的表。如果你的数据库驱动支持 `table_info` 方法，你可以检查一些已存在的表名。更多细节请参阅\
  \ DBI 文档。\n\n**要点回顾**\n\n-   不要将变量直接插入 SQL 语句。\n-   使用占位符将数据与查询一起发送。\n-   占位符仅适用于数据，不适用于标识符。\n\
  \n## 第 108 条：绑定返回列以加快数据访问速度\n\n当你从 DBI 语句句柄中获取数据时，你可能会将值赋给变量。这很容易编写，也是你首次实现数据库查询时最便捷的方式：\n\
  \n```\nuse DBI;\nmy $dbh = DBI->connect(...);\nmy $sth =\n    $dbh->prepare('select\
  \ one, two, three from my_table');\n$sth->execute;\nwhile ( my ( $one, $two, $three\
  \ ) = $sth->fetchrow_array )\n{\n    ...;\n}\n```\n\n这稍微有些低效，但对于少量记录来说，这完全没问题。不过，如果你需要处理数千条记录，你可能会注意到速度略有下降。将值复制到变量中的微小低效确实会累积起来。\n\
  \n与其赋值给新变量，你可以将引用 **绑定** 到语句句柄。这允许数据库访问层直接将返回的数据写入你的变量，从而在处理循环中每行每列减少一次数据复制。使用 `bind_columns`，你为所有选择的列传递引用：\n\
  \n```\nuse DBI;\nmy $dbh = DBI->connect(...);\nmy $sth =\n    $dbh->prepare('select\
  \ one, two, three from my_table');\n$sth->execute;\nmy ( $one, $two, $three );\n\
  $sth->bind_columns( \\$one, \\$two, \\$three );\nwhile ( $sth->fetchrow_arrayref\
  \ ) {\n    ...;\n}\n```\n\n传递引用列表可能不太方便或可读性差，因此你也可以一次绑定一列。`bind_col` 方法接受一个参数编号（从\
  \ 1 开始）和一个要绑定的引用。你应该始终在 `execute` 之后调用 `bind_col`：\n\n```\nuse DBI;\nmy $dbh = DBI->connect(...);\n\
  my $sth =\n    $dbh->prepare('select one, two, three from my_table');\n$sth->execute;\n\
  $sth->bind_col( 1, \\my $one );\n$sth->bind_col( 2, \\my $two );\n$sth->bind_col(\
  \ 3, \\my $three );\nwhile ( $sth->fetchrow_arrayref ) {\n    ...;\n}\n```\n\n使用\
  \ `bind_col` 你还能获得更大的控制权。如果你知道列的数据类型，可以在第三个参数中将其指定为该列的属性。DBI 模块导出了 `:sql_types`\
  \ 标签，其中包含数据类型的常量：\n\n```\nuse DBI qw(:sql_types);\n$sth->bind_col( 1, \\my $one,\
  \ { TYPE => SQL_DATETIME } );\n```\n\n作为快捷方式，当数据类型是唯一属性时，你可以使用标量作为第三个参数：\n\n```\n\
  use DBI qw(:sql_types);\n$sth->bind_col( 1, \\my $one, SQL_DATETIME );\n```\n\n\
  一旦你绑定了列，你应该会看到一些适度的性能提升。\n\n**要点回顾**\n\n-   将值复制到变量中略微低效。\n-   将列绑定到引用以加快对返回结果的访问。\n\
  -   在知道列数据类型时指定它。\n\n\n\n\n\n## 第 109 条 复用数据库连接\n\n建立数据库连接通常是一项非常昂贵的操作。\n\n应避免在代码中创建过多连接，并尽可能缓存数据库连接。这不仅能减少查询所需的时间，还能为其他可能需要连接数据库的人保留连接资源。对于高流量的网站来说，这一点尤为重要。你不仅不希望在一个程序中多次连接数据库，更不希望每分钟将该程序运行数百次。\n\
  \n### 连接过多\n\n许多程序员没有将代码中的数据库功能集成到更高层次的设计中。也许他们的程序最初只是一个小项目，后来逐渐演变，但从未摆脱最初的不良决策。例如，下面的示例仅在需要查询时才连接数据库，但在查询完成后立即关闭连接：\n\
  \n```perl\nsub find_value {\n    my ($id) = @_;\n    my $dbh =\n        DBI->connect(\
  \ $dsn, $user, $password, %options );\n    my ($value) = $dbh->selectall_array(\n\
  \        'select value from my_table where id = ?',\n        {}, $id );\n    return\
  \ $value;\n}\n```\n\n如果你只调用 `find_value` 一两次，可能不会注意到问题。但如果多次调用，你的程序就会花费大量时间建立数据库连接，而本可以用这些时间做其他事情。\n\
  \n### 共享数据库连接\n\n与其每次查询都建立连接，不如只连接一次并保存数据库句柄。具体做法很大程度上取决于你的应用需求。你可以将连接作为数据的一部分保存：\n\
  \n```perl\npackage MyApp::Foo;\nsub new {\n    my ($class) = @_;\n    my $self =\
  \ bless {}, $class;\n    $self->{dbh} = DBI->connect(...);\n    return $self;\n\
  }\n```\n\n当需要查询数据库时，从对象数据中获取数据库连接：\n\n```perl\nsub find_value {\n    my $self =\
  \ shift;\n    my ($value) =\n        $self->{dbh}->selectall_array(\n          \
  \  'select value from my_table where id = ?',\n            {}, $id );\n    return\
  \ $value;\n}\n```\n\n这种方法适用于短生命周期的程序，但对于长时间运行的程序则存在问题。数据库可能会因空闲而关闭连接，网络可能出现故障，或者许多其他问题。在你的方法中，你只能假设自己拥有一个打开的数据库连接。\n\
  \n### 每个对象一个连接\n\n你可以通过封装数据库句柄来解决这个问题，这始终是一个良好的编程实践。不要直接访问对象数据，而是调用一个方法来获取数据库句柄。你不需要关心该方法做了什么或如何实现，只要它能提供一个有效的数据库连接即可。你可以创建一个\
  \ `get_dbh` 方法，使用 DBI 的 `ping` 方法来检查连接。如果 `ping` 返回假，则尝试重新连接：\n\n```perl\npackage\
  \ MyApp::Foo;\nsub connect_to_database {\n    DBI->connect(...) or die ...;\n}\n\
  sub get_dbh {\n    my ($self) = @_;\n    unless ( $self->{dbh}->ping ) {\n     \
  \   $self->{dbh} = $self->connect_to_database;\n    }\n    $self->{dbh};\n}\n```\n\
  \n但这仍然可能浪费数据库连接，因为每个对象都需要一个连接。\n\n### 每个类一个连接\n\n如果类中的每个对象都应共享同一个数据库连接，你可以使用类变量来保存数据库句柄。其机制与每个对象一个连接类似，但使用的是整个类都能访问的词法变量：\n\
  \n```perl\npackage MyApp::Foo;\nmy $dbh;\nsub connect_to_database {\n    DBI->connect(...)\
  \ or die ...;\n}\nsub get_dbh {\n    my ($self) = @_;\n    unless ( $dbh->ping )\
  \ {\n        $dbh = $self->connect_to_database;\n    }\n    $dbh;\n}\n```\n\n请记住，`$dbh`\
  \ 是一个文件作用域的变量，因此文件中的任何内容都可以访问它，即使你切换了包。\n\n### 更大规模的需求\n\n有时，即使是每个类一个连接也会浪费资源，你可能希望在整个应用程序甚至跨多个进程之间共享连接。非常大的应用程序和系统可能需要更复杂的连接管理。\n\
  \n`Apache::DBI` 模块展示了如何通过提供一个围绕 DBI 的包装器来在同一进程内共享数据库句柄，从而为你处理连接缓存。即使你没有使用 Apache，也可以根据需求调整其代码。在添加\
  \ Apache2 支持之前的 `Apache::DBI` 版本可能更容易转换为你的特定需求。\n\n如果这还不够，可以考虑 `DBD::Gofer` 模块。它设置了一个代理，其唯一任务是管理\
  \ DBI 连接。它在单独的进程中维护这些连接，为你提供了灵活性、缓存、可伸缩性、限流以及许多其他功能。设置完成后，你只需修改对 `DBI->connect`\
  \ 的调用，使其连接到 `DBD::Gofer` 设置的代理服务器：\n\n```perl\nuse DBI;\nmy $normal_dsn = \"dbi:...\"\
  ;\nmy $dbh = DBI->connect(\n    \"dbi:Gofer:transport=$transport;...;dsn=$original_dsn\"\
  ,\n    $user, $passwd, \\%attributes\n);\n```\n\n注意你的新数据源名称：字符串前面的部分是给 `DBD::Gofer`\
  \ 用的。一旦它剥离了前面的部分，`DBD::Gofer` 就会使用 dsn 的其余部分来建立实际的数据库连接。“普通”的非 Gofer dsn 必须放在最后。\n\
  \n一旦你从 `DBD::Gofer` 获得了数据库句柄，就可以像平常一样使用它。程序的其余部分并不关心你正在使用它，甚至不会注意到。\n\n### 需要记住的要点\n\
  \n- 不要每次查询都连接数据库。\n- 在对象、类或进程之间共享数据库连接。\n- 使用 `DBD::Gofer` 模块作为 DBI 代理来共享连接。\n\n\
  # 13 杂项\n\n有许多条目无法放入其他章节，与其他许多条目一样，它们都是值得深入探讨的主题，每个都可以单独成篇。被归入杂项章节并不丢人；其中一些是未来章节的构想。其他条目则是孤立的主题，尽管独特，但可能是强大的技术。无论如何，我们认为它们值得了解。\n\
  \n## 第 110 条 编译并安装你自己的 Perl\n\n有时 Perl 因其自身的成功而受苦。它几乎随每个继承 UNIX 或 Linux 血统的操作系统版本一起提供，包括\
  \ Mac OS X。许多这些系统将 Perl 用于其正常操作，或者以包的形式提供 `perl`。即便如此，你也可以找到大多数平台的预编译 Perl。\n\n\
  Windows 上的 Perl 通常使用来自 ActiveState (http://www.activestate.com/)、cygwin (http://www.cygwin.com/)\
  \ 或 Strawberry Perl (http://www.strawberryperl.com/) 的预编译二进制文件。人们不再需要自己编译 Perl 了。\n\
  \n然而，编译并使用你自己的 `perl` 有很多好处。由于许多操作系统依赖 `perl` 进行日常维护任务，你应避免任何可能破坏该 `perl` 的操作。例如，如果你升级了一个核心模块，系统的重要部分可能会停止工作。你可能希望假装系统自带的\
  \ `perl` 根本不存在。\n\n此外，作为 Perl 开发者，你应该安装多个版本的 `perl`，以便针对每个版本进行测试。安装和维护不同的版本很容易。本条目涵盖了基础知识，但你的系统可能有额外要求。Perl\
  \ 发行版中有几个 README 文件，提供了针对特定操作系统的说明。\n\n### 编译你的 Perl\n\n\n\n\n\n## 第 110 条 编译并安装你自己的\
  \ `perl`\n\n要编译 `perl`，你需要一个 C 编译器以及通常随附的构建工具。你还需要 `make` 或其变体之一。你不需要任何特殊权限，并且可以将\
  \ `perl` 安装到你自己的用户目录中。本条假设你已经准备好了所有这些。\n\n首先，下载你想要测试的 `perl` 版本。你可以在 CPAN 上找到所有\
  \ `perl` 发行版（http://www.cpan.org/src/README.html）。\n\n解压发行版后，进入其目录。现在需要选择安装位置。在本例中，你将把所有\
  \ `perl` 放在 `/usr/local/perls` 下，每个新安装都会在该目录下拥有自己的子目录。\n\n`Configure` 脚本会检查你的系统并准备\
  \ `perl` 源代码以供编译。`-des` 开关接受所有默认答案并给出简洁输出。`-D` 开关用于覆盖某个答案，这里覆盖的是 `prefix`，它设置了安装位置。\n\
  \n```\n% ./Configure -des -Dprefix=/usr/local/perls/perl-5.10.1\n```\n\nptg\n\n\
  在本例中，你已将构建配置为将所有内容安装到 `/usr/local/perls/perl-5.10.1` 下。通过接受默认值，你不会将 `perl` 移动到 `/usr/bin`，所以不用担心搞乱任何东西。你最好使用非特权账户执行此操作，这样系统会阻止你做任何太糟糕的事情。\n\
  \n如果你想查看所有可配置项，不要接受任何默认值；而是亲自完成整个过程（一生中尝试一次）：\n\n```\n% ./Configure\n```\n\n运行 `Configure`\
  \ 后，无论你使用了哪些选项，都可以开始构建源代码了。根据你的系统，你需要一个 `make` 变体：\n\n```\n% make all\n```\n\n构建完成后，你可以测试它，这可能需要一些时间：\n\
  \n```\n% make test\n```\n\n最后，安装它。你应该会看到它将文件复制到你之前在 `prefix` 中指定的目录：\n\nDownload\
  \ from <www.wowebook.com>\n\n```\n% make install\n```\n\n安装完那个 `perl` 后，尝试安装另一个。你可以启用不同的特性，例如线程。你可以更改\
  \ `prefix` 以注明这个 `perl` 的有趣特性：\n\n```\n% ./Configure -des -Dusethreads\n-Dprefix=/usr/local/perls/perl-5.10.1-threaded\n\
  ```\n\n### 使用你的 `perl`\n\n安装 `perl` 后，无需额外配置即可使用它，尽管你必须使用你想要使用的 `perl` 的路径。例如，你可以查看默认模块搜索路径：\n\
  \n```\n% /usr/local/perls/perl-5.10.1/bin/perl -V\n```\n\n你的新 `perl` 的所有工具、额外程序和模块都会出现在你的\
  \ `prefix` 目录下。如果你希望 `cpan` 为此 `perl` 安装模块，请调用该 `perl` 对应的 `cpan`。它位于你的 `prefix`\
  \ 下的 `bin/` 目录中：\n\nptg\n\n```\n% /usr/local/perls/perl-5.10.1/bin/cpan LWP::Simple\n\
