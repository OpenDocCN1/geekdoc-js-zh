  \ 基础*\n\n你也可以将这些存储在数组中，但为了保持每个点的数据在一起，你必须将它们存储为**元组**，每个点有自己的数组引用：\n\n```\nmy @points\
  \ = ( [ 1, 1 ], [ 2, 4 ] );\n```\n\n然后遍历所有点就很容易了：\n\n```\nforeach my $point (@points)\
  \ {\n    print \"x: $point->[0] y: $point->[1]\\n\";\n}\n```\n\n### 避免使用变量组\n\n\
  另一种常见的初学者模式是使用几个不同的变量来记录逻辑上属于一起的信息。为了处理一个人的数据，新手程序员可能会创建三个单独的标量变量：\n\n```\nmy $person_name\
  \ = 'George';\nmy $person_id = '3';\nmy $person_age = 29;\n```\n\nptg\n\n尽管这个初学者使用了三个变量，但这些数据实际上与同一个人相关联，并且变量本身通过公共前缀`person`连接。每当初学者需要处理这些数据时，都必须单独传递每个值，并希望变量按正确顺序使用：\n\
  \n\n\n\n\n# 第 1 章 Perl 基础\n\n## 条目 14 使用 `bignum` 处理大数\n\n`some_sub( $person_name,\
  \ $person_id, $person_age );` 当你看到这种模式时，请将其转换为哈希。变量名中 `person` 之后的部分成为哈希键：\n\n```\n\
  my %person = (\n    id   => 3,\n    name => 'George',\n    age  => 29,\n);\n```\n\
  \n现在你无需担心如何传递关于 George 的所有信息，因为你可以始终只传递哈希的引用：`some_sub( \\%person );`\n\n如果你有一个人员列表，可以将它们收集到数组中：`my\
  \ @persons = ( \\%person1, \\%person2 );`\n\n这个例子与初学者一开始遇到的问题相同：每个哈希都有一系列变量名。如果你在创建数组元素时直接创建哈希引用，则无需构造命名哈希：`my\
  \ @persons = ( { id => 1, ... }, { id => 2, ... }, ... );`\n\n**要点记住**\n\n- 避免使用一系列名称相似的标量变量来分组数据。\n\
  - 使用集合变量类型来分组相关联的数据。\n- 使用哈希将数据与其含义关联起来。\n\n尽管 Perl 试图向你隐藏其底层架构细节，但在某些情况下，例如它能表示的最大（或最小）数字，它不得不让这些细节暴露出来。编译为\
  \ 32 位 `perl` 仍然很常见，其整数范围限制在 32 位。试试这个 Perl 单行命令：\n\n```\n% perl -le 'print 1234567890123456789012345';\n\
  ```\n\n你得到的不是预期的数字，而是指数表示法：\n\n```\n1.23456789012346e+24\n```\n\n试试这个计算阶乘的程序：\n\n\
  ```\nmy $factorial = 1;\nforeach my $num ( 1 .. $ARGV[0] ) {\n    $factorial *=\
  \ $num;\n}\nprint \"$factorial\\n\";\n```\n\n在 32 位 `perl` 上，它在 18! 时就会变成指数表示法：\n\
  \n```\n% perl factorial.pl 17\n355687428096000\n```\n\n```\n% perl factorial.pl\
  \ 18\n6.402373705728e+15\n```\n\n这些仍然是正确、精确的数字，但在 21!（51,090,942,171,709,440,000）时，`perl`\
  \ 开始丢失数字：\n\n```\n% perl factorial.pl 21\n5.10909421717094e+19\n```\n\n### 获取所有数字\n\
  \n你可以通过使用 `bignum` 编译指示来修复 `perl` 的不精确性：`use bignum;`\n\n```\nmy $factorial = 1;\n\
  foreach my $num ( 1 .. $ARGV[0] ) {\n    $factorial *= $num;\n}\nprint \"$factorial\\\
  n\";\n```\n\n现在你的程序可以处理更大的数字：\n\n```\n% perl factorial.pl 100\n93326215443944152681699238856266700490715968264381621\n\
  46859296389521759999322991560894146397615651828625369\n7920827223758251185210916864000000000000000000000000\n\
  ```\n\n现在你可以处理任意大的数字，仅受系统资源限制。整数和浮点值通过为每个值选择正确的对象类型并在必要时进行转换来自动处理。你可能会因为超出底层系统原生硬连线数据类型的范围而付出运行时性能代价，但这是为了得到正确结果所必须付出的。\n\
  \n### 限制 `bignum` 的作用范围\n\n使用 `bignum` 编译指示后，所有数字和数学运算都会使用大数。有时你可能不希望这样，因为 `bignum`\
  \ 会将数字转换为 `Math::BigInt` 或 `Math::BigFloat` 的对象。这会对性能产生显著影响，因为所有数学运算现在都需要方法调用。\n\
  \n如果你希望程序的大部分使用 `bignum`，可以在某个作用域内用 `no` 将其关闭：\n\n```\n{\n    no bignum;\n    #\
  \ 这里的数字是普通类型\n    my $sum = $n + $m;\n}\n```\n\n如果你只想在程序的一小部分使用 `bignum`，可以在词法作用域内启用它：\n\
  \n```\n{\n    use bignum;\n    # 这里的数字是大数类型\n    my $sum = $n + $m;\n}\n```\n\n\
  如果你只需要对程序中的某些对象使用 `bignum`，可以自己创建这些对象，并像处理其他对象一样处理它们，这样它们的特殊处理只适用于特定数字：`use Math::BigInt;`\n\
  \n```\nmy $big_factorial = Math::BigInt->new(1);\nforeach my $num ( 1 .. $ARGV[0]\
  \ ) {\n    $big_factorial *= $num;\n}\nprint \"$big_factorial\\n\";\n```\n\n当你自己创建对象时，程序中的其他数字仍然使用内置的大小。\n\
  \n**要点记住**\n\n- Perl 的内置数字精度受限于本地架构。\n- `bignum` 编译指示为你提供任意精度的数字。\n- 有选择地使用 `bignum`，使其仅应用于程序的一部分。\n\
  \n# 第 2 章 惯用 Perl\n\nPerl 是由语言学家设计的语言，与任何人类语言一样，Perl 是一种充满惯用法的语言。\n\n我们所说的惯用 Perl，是\
  \ Perl 程序员（至少我们希望是大多数）在经验和实验之后自然形成的一种优雅与习惯的混合体。\n\n究竟什么是惯用法，什么纯粹是风格或观点问题，尚有争议。在\
  \ Perl 中，表达简单和复杂算法的方式有很多种。然而，有些方式显然比其他方式更“正确”。尽管 Perl 的座右铭可能是“不止一种方法来做一件事”，但它的推论是“但大多数方法是错的”，或者“有些方法比其他的更好”。\n\
  \n惯用法和约定在 Perl 中非常重要。在像 C、Bourne shell 或 C shell 这样简单的语言中，它们不那么重要。在 C 编程中，你需要学习的技巧并不多。你可能觉得我们这么说很疯狂，但如果你看看当地书店的编程区，你会发现所有关于如何在\
  \ C 中做巧妙事情的书都很薄。而关于 C++ 的书则很厚。尽管在 shell 编程方面需要学习很多细节，但一本全面的 shell 编程指南也是一本薄书。\n\n\
  Perl 则不然。Perl 是一种富有表现力的语言，而且通常很简洁。\n\nLarry Wall 设计该语言时，允许频繁使用的结构以非常紧凑的方式编码。有时 Perl\
  \ 程序员会谈论 Perl 的 **Huffman 编码**：最常用的结构需要的击键次数最少。Perl 的非常高级特性如 `<>`、正则表达式和 `grep`\
  \ 尤其强大。例如：\n\n```\n# 交换 $a 和 $b\n( $a, $b ) = ( $b, $a );\n\n# 从文件或标准输入读取行\n# 并按排序顺序打印它们\n\
  print sort <>;\n\n# 打印所有包含单词 joebloe 的行\nprint grep /\\bjoebloe\\b/, <>;\n\n# 将\
  \ @n 中所有能被 5 整除的数字\n# 复制到 @div5\nmy @div5 = grep { not $_ % 5 } @n;\n\n# 将 \"123.234.0.1\"\
  \n# 转换为整数 0xb7ae0010 的一种方法\n$bin_addr = pack 'C4', split /\\./, $str_addr;\n```\n\
  \n你可以用其他方式编写所有这些示例，但当你以其他语言的风格编写时，结果会更长且效率更低。\n\n例如，你可以在 Perl 中显式地重现 `<>` 的功能，但结果会是一个相当长的\
  \ Perl 程序，从而掩盖了程序中“有趣”的部分。生成的程序也会因为其长度和复杂性而更难调试和维护。\n\n在某种程度上，惯用法和风格是重叠的。有些惯用法，如\
  \ `print sort <>`，是无可争议的，但肯定存在灰色地带：\n\n```\n# 逐行打印 %h 中的键值对\nforeach my $key ( sort\
  \ keys %h ) {\n    print \"$key: $h{$key}\\n\";\n}\n\n# 另一种打印键值对的方法\nprint map \"\
  $_: $h{$_}\\n\", sort keys %h;\n```\n\n上面的第一个例子是非常朴素的 Perl。它高效、可读，并且只使用了语言的基本特性。第二个例子更短，有些人可能会认为它“酷”度更高，因为它使用了巧妙的\
  \ `map` 运算符和列表上下文，而不是平凡的 `foreach` 循环。\n\n然而，在留下像第二个例子这样的代码供后人参考之前，你应该考虑自己和潜在的读者，因为它确实更晦涩（但也不是\
  \ *那么* 晦涩），甚至可能效率更低。\n\n\n\n\n每个 Perl 程序员都需要掌握一些基本惯用法，并学会识别其他惯用法。程序员应始终使用那些能产生高效、简洁且可读性强的代码的惯用法。其他更复杂的惯用法可能适用也可能不适用，这取决于程序员、读者以及所编写程序的性质。下载自\
  \ <www.wowebook.com>\n\n*第 15 条：使用* `$_` *实现优雅与简洁* ❘ 53\n\n在本章中（你是否曾好奇它何时才能真正开始？），我们将向你展示许多\
  \ Perl 惯用法。你肯定希望学习并使用那些简单的惯用法。除此之外，你还需要权衡“朴素”与“巧妙”之间的取舍。\n\n你的 Perl 代码风格由你自己决定。如果你愿意，可以编写非常朴素的\
  \ Perl。\n\n编写朴素的 Perl 就像用砌块建造房屋一样。它可行、简单、略显单调，而且难以构建复杂的形状。\n\n另一方面，你可能想尝试使用 Perl\
  \ 提供的所有巧妙特性。继续用房屋作类比，你可能是那种在 Home Depot 花更多时间研究电动工具，而不是在现场钉钉子的建造者。你可能喜欢用最新技术建造各种酷炫的功能。这没问题，只要你能意识到有时一把锤子就足够了。\n\
  \n或者，过一段时间后，你可能会处于两者之间。\n\nptg\n\n有时你需要 `s/\\G0/ /g`，而有时你只需要 `$a = $b`。\n\n## 第\
  \ 15 条：使用 `$_` 实现优雅与简洁。\n\n“美元下划线”，即 `$_`——你可能喜欢它，也可能讨厌它，但无论如何，如果你想成为一名熟练的 Perl\
  \ 程序员，就需要理解它。\n\n`$_` 是许多运算符以及某些控制结构的默认参数。以下是一些示例：\n\n```\n### $_ 作为默认参数\nprint\
  \ $_;   # print 的默认参数\nprint;      # ... 相同效果\nprint \"found it\"\n    if $_ =~\
  \ /Rosebud/;   # 匹配与替换\nprint \"found it\"\n    if /Rosebud/;         # 相同效果\n```\n\
  \n下载自 <www.wowebook.com>\n\n```\n$mod_time = -M $_;   # 大多数文件句柄测试\n$mod_time = -M;\
  \      # 相同效果\nforeach $_ (@list) { do_something($_) }   # foreach\nforeach (@list)\
  \ { do_something($_) }      # 相同效果\nwhile ( defined( $_ = <STDIN> ) ) {\n    # while；特殊情况\n\
  \    print $_;\n}\nwhile (<STDIN>) { print }   # 相同效果\n```\n\n如第 7 条所述，最后一个示例说明了一种特殊情况：单独将行输入运算符\
  \ `<filehandle>` 作为 `while` 循环的条件，是读取文件中的一行到 `$_` 直到文件末尾的快捷方式。它会自动检查是否返回了内容，因为行输入运算符通过返回\
  \ `undef` 来告知你已完成。\n\n这看起来可能有些随意和随机，但通过查阅 Perl 文档，很容易记住 `$_` 的用法。你不需要记住完整的列表，因为可以随时查阅。例如，`split`\
  \ 对 `$_` 是否有特殊行为？只需查一下即可。\n\n`$_` 是一个普通的标量变量——大部分情况下。你可以使用它、打印它、更改它的值等，就像对待普通标量一样。不过，有几点需要注意。\n\
  \n### `$_` 与主包\n\n在 Perl 5.10 之前，`$_` 始终位于包 `main` 中。即使（或尤其）你在其他包中也是如此：\n\n```\n\
  package foo;\n$_ = \"OK\\n\";   # 这仍然表示 $main::_\npackage main;\nprint;        \
  \ # 输出 \"OK\"\n```\n\n实际上，所有特殊变量（`[$@%]`-标点符号及其他一些变量）都具有此属性。如果你愿意，可以使用像 `$foo::_`\
  \ 这样的变量，但它没有特殊属性，也不是*那个* `$_`。\n\n下载自 <www.wowebook.com>\n\n### 局部化 `$_`\n\n在 Perl\
  \ 5.10 之前，你只能使用 `local` 来局部化 `$_`。大多数情况下，当你处理特殊变量时，希望限制其影响，使你的更改不会超出预期范围。使用 `local`，你拥有自己的\
  \ `$_`，直到当前作用域结束：\n\n```\n{\n    local $_;\n    # ... 使用你的 $_ 版本进行操作\n    some_sub();\
  \   # 使用你的 $_\n}\n```\n\n使用 `local`，你的更改会影响直到作用域结束的所有内容，包括你调用的任何子程序。你的 `$_` 版本在整个程序中都是可见的。\n\
  \n从 Perl 5.10 开始，你可以使用词法 `$_`，这样你的更改只影响作用域内的代码，而作用域外的任何内容都看不到它。即使你在同一作用域内调用 `some_sub`，它也不会看到词法作用域的\
  \ `$_` 的值：\n\n```\n{\n    my $_;\n    #... 使用你的 $_ 版本进行操作\n    some_sub();   # 不使用你的\
  \ $_\n}\n```\n\n### 编程风格与 `$_`\n\n奇怪的是，当你使用 `$_` 时，你可能不会经常看到它。你能数出下面这段代码中它*没有*出现多少次吗？\n\
  \n```\nwhile (<>) {            # 1\n    foreach (split) {   # 2 和 3\n        $w5++\
  \ if /^\\w{5}$/   # 4\n    }\n}\n```\n\n下载自 <www.wowebook.com>\n\n```\n# 查找以 .txt\
  \ 结尾且小于 5000 字节的文件\n@small_txt =\n    grep { /\\.txt$/ and (-s) < 5000 } @files;\
  \   # 5 和 6\n```\n\n有些 Perl 程序员可能认为 `$_` 更多是助长混淆而非优雅。甚至有一本书[¹] 说：“许多 Perl 程序员编写的程序中，对\
  \ `$_` 的引用像一条无形的线贯穿其中。过度使用 `$_` 的程序难以阅读，并且比显式引用你自己命名的标量变量的程序更容易出错。”然而，下面哪个看起来更顺眼？\n\
  \n```\nwhile ( defined( $line = <STDIN> ) ) {\n    print $line if $line =~ /Perl/;\n\
  }\nwhile (<STDIN>) { print if /Perl/ }\n```\n\n这里并没有混淆。如果你学了一点 Perl 并知道如何使用文档，任何困惑都应该是短暂的。\n\
  \n### 需要记住的要点\n\nptg\n\n- Perl 将 `$_` 用作许多操作的默认变量。\n- 当你可以链式操作时，使用默认变量来避免临时变量。\n\
  - 在使用 `$_` 之前将其局部化，以免干扰其他代码。\n\n## 第 16 条：了解 Perl 的其他默认参数。\n\n`$_` 并不是 Perl 中唯一的默认参数。还有其他几个。与\
  \ `$_` 一样，阅读并参考文档始终是最好的指南。\n\n### `@_` 作为默认参数\n\n在子程序内部，`shift` 使用 `@_` 作为默认参数。当你在子程序中对\
  \ `shift` 不提供参数时，实际上是在从 `@_` 中取出最左边的元素：\n\n[¹]: David Till, *Teach Yourself Perl\
  \ 5 in 21 Days* (Berkeley, CA: Sams Publishing, 1996).\n\n下载自 <www.wowebook.com>\n\
  \n```\nsub foo {\n    my $x = shift;\n    ...;\n}\n```\n\nPerl 语法中一个有趣的怪癖出现在你尝试通过引用传递数组参数，并在一条语句中将该引用转换为数组时：\n\
  \n```\nbar( \\@bletch );\nsub bar {\n    my @a = @{shift};\n    ...;\n}\n```\n\n\
  在这个例子中，`@{shift}` 指的是变量 `@shift`，而不是函数。如果你启用了 `strict`（第 3 条），Perl 会捕获到这一点：`Global\
  \ symbol @shift requires explicit package name ...`\n\n你需要在花括号内放入其他内容，让 Perl 知道该标识符不是变量名。由于\
  \ `shift` 是一个函数，你可以用括号调用 `shift` 来让 perl 知道：\n\n```\nmy @a = @{ shift() };\n```\n\
  \n或者，你可以使用一元 `+` 运算符。在这种情况下，它充当无操作（占位符，不执行任何操作），但它确实让 perl 知道 `shift` 不是普通字符串：\n\
  \n```\nmy @a = @{ +shift };\n```\n\n然而，如果你不尝试内联解引用，而是将工作分开，就永远不需要处理这种歧义语法。\n\n###\
  \ `@ARGV` 作为默认参数\n\n在子程序外部，`shift` 使用 `@ARGV` 作为默认参数。了解这一点后，你可以编写自定义的命令行参数处理——例如，将以连字符开头的任何字符串作为命令行选项处理，其他所有内容作为文件处理：\n\
  \n```\nforeach (shift) {\n    if (/^-(.*)/) {\n        process_option($1);\n   \
  \ }\n}\n```\n\n\n\n\n```\nelse {\n    process_file($_);\n}\n```\n\n当然，你不应该自己这样做。相反，你应该使用众多可用的参数处理器之一，比如\
  \ `Getopt::Long`。\n\n另外请注意，`shift` 运算符总是使用 `@ARGV` 或 `main::@_`，即使你的默认包不是 `main`。\n\
  \n### 其他使用 `$_` 的函数\n\n其他几个内置函数默认使用 `$_`：`-X` 文件测试（除了 `-t`）、`abs`、`alarm`、`chomp`、`chop`、`chr`、`chroot`、`cos`、`defined`、`eval`、`exp`、`glob`、`hex`、`int`、`lc`、`lcfirst`、`log`、`lstat`、`oct`、`ord`、`pos`、`print`、`quotemeta`、`read-link`、`ref`、`require`、仅标量上下文中的\
  \ `reverse`、`rmdir`、`say`、`sin`、`split`、`sqrt`、`stat`、`study`、`uc`、`ucfirst` 和 `unlink`。\n\
  \nptg\n\n### STDIN 作为默认值\n\n与其他默认使用 `$_` 的文件测试运算符不同，`-t` 运算符默认使用文件句柄 `STDIN`。`-t`\
  \ 以 UNIX 的 `isatty()` 函数的方式测试文件句柄，以确定该文件句柄是否是交互式的——也就是说，它的输入是来自人类在键盘上打字，还是来自其他（很可能是自动化的）来源。以下两个对\
  \ `-t` 的调用是等价的：\n\n```\nprint \"You're alive!\" if -t STDIN;\nprint \"You're alive!\"\
  \ if -t;\n```\n\n使用 `-t` 运算符来帮助修改程序的行为，具体取决于它是否在交互式运行。例如，你可以在 CGI 脚本中使用 `-t`，如果脚本是从命令行运行的，则启动一个特殊的调试模式。你可能还想查看\
  \ `IO::Interactive` 模块，它做同样的事情，但也处理了一些特殊情况。\n\n下载自 <www.wowebook.com>\n\n*第 16 条：了解\
