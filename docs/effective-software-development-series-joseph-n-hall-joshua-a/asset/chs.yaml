  \ 获取程序启动的时间，减去文件被修改或访问的时间，并以天为单位返回结果。正值表示过去，负值表示程序启动之后的时间。这看起来很奇怪，但它使得以人类可理解的方式衡量文件年龄变得容易。如果你想查找过去七天内未被修改的文件，可以查找\
  \ `-M` 值大于 7 的文件：\n\n```\nmy $old_files = grep { -M > 7 } glob '*';\n```\n\n如果你想查找程序启动后修改过的文件，可以查找负值。在这个例子中，如果\
  \ `-M` 返回小于零的值，`map` 会提供一个包含文件名和修改年龄（以天为单位）的匿名数组；否则，它返回空列表：\n\n```\nmy @new_files\
  \ = map { -M < 0 ? [ $_, -M ] : () } glob '*';\n```\n\n**重用工作**\n\n如果你想查找所有由运行程序的用户拥有且可执行的文件，可以在\
