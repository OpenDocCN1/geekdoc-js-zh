  \nmy $text =\n'my email address is josh+spam@example.com, okay';\nif ( $text =~\
  \ /$RE{Email}{Address}{-keep}/ ) {\n    $text = $RE{ws}{crop}->subs($1);\n    ptg\n\
  \    print \"$text\\n\";\n}\n```\n\n**需要记住的事项**\n\n- 使用 `Regex::Common` 而不是自己编写复杂的正则表达式。\n\
  - 加载插件以扩展 `Regex::Common` 中可用的正则表达式。\n\n下载自 <www.wowebook.com>\n\n# 4 ❘ 子程序\n\n\
  Perl 作为一种动态语言，其强大之处很大程度上源于其灵活的子程序。定义子程序几乎不需要做什么。你无需告诉它将要接收多少个参数，也无需说明你将传递什么类型的数据。你可以向子程序传递任意列表，然后稍后再决定如何处理。尽管\
  \ Perl 非常宽容，允许你尽可能晚地做出决定，但即便如此，你仍然有很多方法可以避免自己变得*过于*灵活。\n\n你甚至不必提前定义子程序。你可以在运行时创建新的子程序，甚至可以在之后重新定义它们。你可以编写能够创建其他子程序的子程序。每个这样的子程序都可以保留自己的私有数据。你可以将这些子程序存储为引用，像传递其他数据一样传递它们。\n\
  \n当你利用 Perl 子程序的能力时，许多复杂的问题会变得非常简单。\n\n## 条目 43. 理解 `my` 和 `local` 的区别\n\n`my` 和\
  \ `local` 之间的区别是 Perl 中较为微妙和困难的方面之一。之所以微妙，是因为能够观察到 `my` 和 `local` 功能差异的情况并不常见。之所以困难，是因为它们行为上的差异可能出乎意料且难以理解。\n\
  \n人们有时会将 `my` 和 `local` 的区别描述为：“`my` 变量只影响声明它们的子程序，而 `local` 变量则影响从该子程序调用的所有子程序。”\n\
  \n但这是错误的：`my` 与子程序无关，`local` 与子程序无关，当然它们之间的区别也与子程序无关。看起来可能如此，但事实——正如你将看到的——完全是另一回事。尽管如此，我们仍在本节中讨论\
  \ `local` 和 `my`，因为它们在子程序中的使用极其重要。\n\n145\n\n下载自 <www.wowebook.com>\n\n146 ❘ *第\
  \ 4 章 子程序*\n\n### 全局变量\n\n在 Perl 中，所有变量、子程序以及其他可命名的实体默认都具有包作用域（或简称为“全局作用域”）。也就是说，它们存在于当前包的符号表中。单独的括号、子程序或文件并不会创建局部变量。\n\
  \n在大多数情况下，Perl 在编译阶段将全局名称放入相应的包符号表中。编译时不可见的名称会在执行时插入。让我们运行一个名为 `tryme` 的程序来观察：\n\
  \n```\nprint join \" \", keys %::;\n$compile_time;          # 编译时创建\n${\"run_time\"\
  };          # 软引用，运行时创建\n```\n\n运行该程序时，你会看到 Perl 在符号表中跟踪的所有内容：\n\n```\nARGV 0 FileHandle::\
  \ @ stdin STDIN \" stdout STDOUT $\nstderr STDERR _<perlmain.c compile_time DynaLoader::\
  \ _<tryme ENV main:: INC DB:: _ /\n```\n\nptg\n\n注意，在这个例子中，标识符 `compile_time` 在执行到变量\
  \ `$compile_time` 之前就已经出现在符号表中了。如果你之前对 Perl 的编译器特性有所怀疑，这个例子应该能让你确信。\n\n从你编程生涯（或爱好，或任何你喜欢的描述方式）开始，你可能就被告知全局变量是不好的。好的程序不应该使用大量全局变量，因为全局变量会创建隐藏的接口，使代码难以阅读和修改，甚至让编译器难以优化你的代码。\n\
  \n如果你编写过几百行以上的程序，尤其是在团队协作中，你至少会部分同意这一点。你应该看到 Perl 需要一种支持局部变量的机制。\n\n当然，Perl 确实支持局部变量，而且实际上比大多数语言更慷慨。大多数语言只提供一种创建局部变量的机制，而\
  \ Perl 提供了两种不同的机制。\n\n### 使用 `my` 进行词法（编译时）作用域\n\nPerl 的 `my` 运算符创建具有词法作用域的变量。使用\
  \ `my` 创建的变量从声明点开始存在，直到封闭作用域的结束。封闭作用域是一对花括号、一个文件或一个 `eval` 字符串。\n\n作用域是词法的，因为它完全由编译时对程序文本的检查决定。换句话说，只需查看源代码即可确定\
  \ `my` 变量的作用域。以下代码同时使用了全局和词法的 `$a`：\n\n```\n$a = 3.1415926;   # 全局\n{\n    my $a\
  \ = 2.7183;   # 词法\n    print $a;         # 2.7183\n}\nprint $a;             # 3.1415926\n\
  ```\n\n这里，花括号外使用的变量 `$a` 是全局的 `$a`。花括号内的变量 `$a` 是词法的 `$a`，其作用域限定在这些花括号内。\n\n这是大多数常用编程语言处理作用域的方式。但这是\
  \ Perl，所以听到还有一些复杂之处时你不应感到惊讶。事实上，复杂之处不止一点点。\n\n重新审视你对符号表的检查。以下程序与本节开头的程序类似，但顺序稍有调整。这次使用\
  \ `my`：\n\n```\nmy $compile_time;   # 词法变量\n$compile_time;\nprint join \" \", keys(%::);\n\
  ```\n\n这次运行时，输出中看不到 `compile_time`：\n\n```\nARGV 0 FileHandle:: @ stdin STDIN \"\
  \ stdout STDOUT $\nstderr STDERR _<perlmain.c DynaLoader:: _<tryme ENV main:: INC\n\
  DB:: _ /\n```\n\n让我们再看另一个例子：\n\n```\n$compile_time;      # 不是 my 变量\nmy $compile_time;\
  \   # 但这是 my 变量\nprint join \" \", keys(%::);\n```\n\n运行这个例子时，输出中出现了 `compile_time`：\n\
  \n```\nARGV 0 FileHandle:: @ stdin STDIN \" stdout STDOUT $\nstderr STDERR _<perlmain.c\
  \ compile_time DynaLoader:: _<tryme ENV main:: INC DB:: _ /\n```\n\n下载自 <www.wowebook.com>\n\
  \n148 ❘ *第 4 章 子程序*\n\n这些例子表明，`my` 变量并不“存活”在符号表中。在第一个 `my $compile_time` 的例子中，文件中只有一个名为\
  \ `$compile_time` 的变量，它从未进入包符号表。在另一个例子中，有两个独立的名为 `$compile_time` 的变量：符号表中的全局变量，以及不在符号表中的\
  \ `my $compile_time`。\n\n你始终可以通过限定名称访问包变量的值。限定名称（包含 `::` 的名称）总是指向符号表中的变量。例如：\n\n\
  ```\n# 限定名称 vs. my 变量\n{\n    my $a = 3.1416;\n    $main::a = 2.7183;\n    print\
  \ \"(inside) a = $a\\n\";\n    print \"(inside) main::a = $main::a\\n\";\n    print\
  \ \"(inside) ::a = $::a\\n\";\n}\nprint \"(outside) a = $a\\n\";\n```\n\nptg\n\n\
  输出显示了 Perl 在每个步骤中认为 `$a` 是什么：\n\n```\n(inside) a = 3.1416\n(inside) main::a = 2.7183\n\
  (inside) ::a = 2.7183\n(outside) a = 2.7183\n```\n\n符号表还用于其他各种用途，包括软引用和 typeglob。由于\
  \ `my` 变量不在符号表中，因此无法通过这两种技术访问它们。以下演示涉及软引用，即使词法变量在作用域内，软引用也始终使用符号表变量：\n\n```\n# 软引用\
  \ vs. my 变量\nmy $a = 3.1416;\n${'a'} = 2.7183;\nprint \"my a = $a\\n\";\nprint \"\
  {a} = ${'a'}\\n\";\n```\n\n\n\n\n# 第 43 条 理解*my*与*local*的区别 ❘ **149**\n\n当你运行这段代码时，你会看到\
  \ Perl 在每个 print 语句中使用的`$a`的不同版本：\n\n从<www.wowebook.com>下载\n\n```\nmy a = 3.1416\n\
  {a} = 2.7183\n```\n\n类型团（typeglobs）的工作方式相同。事实上，如本例所示，类型团、软引用和限定变量名永远不会指向词法（`my`）变量：\n\
  \n```perl\n# typeglobs vs. my variables\n$a = 2.7183;\nmy $a = 3.1416;\n*alias =\
  \ *a;\nprint \"my a = $a\\n\";\nprint \"alias = $alias\\n\";\nprint \"{a} = ${'a'}\\\
  n\";\nprint \"::a = $::a\\n\";\n```\n\n输出显示了 Perl 在每个步骤中认为`$a`是什么：\n\n```\nmy a\
  \ = 3.1416\nalias = 2.7183\n{a} = 2.7183\n::a = 2.7183\n```\n\nptg\n\n注意，`*alias`类型团指向全局的`*a`，即使类型团赋值出现在`my\
  \ $a`之后。赋值出现在哪里并不重要——类型团总是指向符号表中的条目，而`my`变量不会出现在那里。\n\n其余的“细节”要等到你了解更多关于`local`变量之后才能看到。\n\
  \n### 使用 local 进行运行时作用域\n\nPerl 的另一种作用域机制是`local`，它比`my`存在的时间长得多。事实上，`my`是在 Perl\
  \ 5 中才引入的。你可能会想，`local`到底有什么问题，以至于 Larry Wall 觉得有必要添加一种完全不同的作用域机制来取代它？\n\n为了回答这个问题，让我们看看`local`是如何工作的。在某个时刻，你会开始看到`my`的优点。\n\
  \n`local`是一种运行时作用域机制。与`my`在编译期间在私有符号表中创建新变量不同，`local`具有运行时效果：它将参数的值保存在运行时栈中，然后在执行线程离开包含作用域时恢复这些值。\n\
  \n从<www.wowebook.com>下载\n\n**150** ❘ *第 4 章 子程序*\n\n乍一看，`local`和`my`似乎做的事情非常相似。下面是一个与上一节类似的例子，只是将`my`替换为`local`：\n\
  \n```perl\n# your basic use of 'local'\n$a = 3.1416;\n{\n    local $a = 2.7183;\n\
  \    print $a;   # 2.7183;\n}\nprint $a;   # 3.1416;\n```\n\n虽然这看起来与使用`my`的例子相似，并且产生相同的输出，但在\
  \ Perl 内部发生了非常不同的事情。\n\n对于`my`，正如你所看到的，Perl 创建了一个单独的变量，在运行时无法通过名称访问。换句话说，它永远不会出现在包符号表中。在执行内部块期间，外部的全局`$a`继续存在，其值为\
  \ 3.1416，位于符号表中。\n\n然而，对于`local`，Perl 将`$a`的当前内容保存在运行时栈上。Perl 用新值替换`$a`的内容。当程序退出封闭块时，Perl\
  \ 恢复由`local`保存的值。在整个示例中，只有一个名为`$a`的变量。\n\n为了更好地说明这一点，使用软引用窥视符号表：\n\n```perl\n$a\
  \ = $b = 3.1416;\n{\n    local $a = 2.7183;\n    my $b = 2.7183;\n    print \"IN:\
  \ local a = $a, my b = $b\\n\";\n    print \"IN: {a} = ${'a'}, {b} = ${'b'}\\n\"\
  ;\n}\nprint \"OUT: local a = $a, my b = $b\\n\";\n```\n\n运行这段代码会产生：\n\n从<www.wowebook.com>下载\n\
  \n*第 43 条 理解*my*与*local*的区别 ❘ **151**\n\n```\nIN: local a = 2.7183, my b = 2.7183\n\
  IN: {a} = 2.7183, {b} = 3.1416\nOUT: local a = 3.1416, my b = 3.1416\n```\n\n多么有趣。使用软引用来查看全局`$a`的技巧，在`my`中有效，但在`local`中似乎没有效果。这是理所当然的。`my`创建了一个不同的变量，而`local`则临时保存了现有变量的值。\n\
  \n由于`local`是一种运行时机制，而不是编译时机制，因此你可以观察到`local`对全局变量所做的更改，这些更改超出了包含`local`运算符的词法作用域。最著名的例子是嵌套子程序调用：\n\
  \n```perl\n$a = 3.1416;\nsub print_a { print \"a = $a\\n\" }\nsub localize_a {\n\
  \    print \"entering localize_a\\n\";\n    local $a = 2.7183;\n    print_a();\n\
  \    ptg\n    print \"leaving localize_a\\n\";\n}\nprint_a();\nlocalize_a();\nprint_a();\n\
  ```\n\n运行这段代码会得到：\n\n```\na = 3.1416\nentering localize_a\na = 2.7183\nleaving localize_a\n\
  a = 3.1416\n```\n\n这是一个经常被引用的例子，它导致人们将`local`描述为与子程序调用有关，但如前所述，事实并非如此。\n\n### 何时使用\
  \ my\n\n一般来说，如果有选择，你应该使用`my`而不是`local`。原因之一是`my`比`local`更快。将值保存在栈上需要一些时间：\n\n从<www.wowebook.com>下载\n\
  \n**152** ❘ *第 4 章 子程序*\n\n```perl\nuse Benchmark;\ntimethese(\n    1_000_000,\n\
  \    {\n        'local' => q{ local $a = $_; $a *= 2; },\n        'my'    => q{\
  \ my $a = $_; $a *= 2; },\n    }\n);\n```\n\n输出显示`my`相当快：\n\n```\nBenchmark: timing\
  \ 1000000 iterations of local, my...\n    local: ( 0.98 usr + 0.01 sys = 0.99 CPU)\
  \ ↵\n            @ 1010101.01/s\n    my:    ( 0.55 usr + -0.00 sys = 0.55 CPU) ↵\n\
  \            @ 1818181.82/s\n```\n\n`my`也更容易理解，并且不会产生`local`那种奇怪的“非局部”副作用。\n\n使用`my`的另一个原因是，它创建的词法变量构成了\
  \ Perl 中闭包的基础（第 49 条）。\n\nptg\n\n### 何时使用 local\n\n使用`local`（或者至少熟悉它）的一个令人信服的理由是，存在大量使用它的古老\
  \ Perl 4 风格代码。用`my`替换`local`并不像用文本编辑器进行搜索替换那么简单——你必须逐一检查每个`local`的使用，看它是否利用了`local`的某个“特性”。如果代码运行良好，最好保持使用`local`的代码不变。\n\
  \n此外，有些事情必须用`local`来完成。\n\n大多数`$`标点变量——或其他 Perl 特殊处理的变量——只能使用`local`进行局部化（尽管 Perl\
  \ 5.10 引入了词法`$_`：第 15 条）。尝试用`my`局部化一个特殊变量是错误的：\n\n```perl\nmy $contents = do { my\
  \ $/; open ... };   # ERROR!\n```\n\n你可以在许多其他不能使用`my`的情况下使用`local`，例如在另一个包中的变量上：\n\
  \n从<www.wowebook.com>下载\n\n*第 43 条 理解*my*与*local*的区别 ❘ **153**\n\n```perl\npackage\
  \ foo;\n$a = 3.1416;\n{\n    package main;\n    local $foo::a = 2.7183;\n    package\
  \ foo;\n    print \"foo::a = $a\\n\";\n}\npackage foo;\nprint \"foo::a = $a\\n\"\
  ;\n```\n\n```\n% tryme foo::a=2.7183 foo::a=3.1416\n```\n\n你也可以在数组和哈希的元素上使用`local`。是的，这很奇怪，但却是事实。你甚至可以在切片上使用`local`：\n\
  \n```perl\n@a = qw(Jolly Green Giant);\n{\n    local ( @a[ 0, 1 ] ) = qw(Grumbly\
  \ Purple);\n    ptg\n    print \"@a\\n\";\n}\nprint \"@a\\n\";\n```\n\n这会输出：\n\n\
  ```\nGrumbly Purple Giant\nJolly Green Giant\n```\n\n你也可以在类型团上使用`local`（第 118 条）。理论上，`local`可以用于几乎任何值，但当前实现存在限制。例如，在撰写本文时，你不能在解引用值（如`$$a`）上使用`local`。\n\
  \n### local 和 my 作为列表运算符\n\n`local`和`my`在语法上有一个相同之处：它们都可以应用于单个标量、数组和哈希：\n\n```perl\n\
  # some examples of local and my\nlocal $scalar;\nmy @array;\nlocal %hash;\n```\n\
  \n你可以在局部化变量的同时对其进行初始化：\n\n```perl\nlocal $scalar = 3.1416;\nmy @array = qw(Mary\
  \ had a little lamb);\nlocal %hash = ( H => 1, He => 2, Li => 3 );\n```\n\n如果你在`my`和`local`的参数周围使用括号，那么参数就变成了一个列表，Perl\
  \ 会在列表上下文中评估赋值：\n\n```perl\nlocal ( $foo, $bar, $bletch ) = @a;   # 从@a 中取前 3 个元素\n\
  ```\n\n注意常见的列表赋值“陷阱”：\n\n```perl\n# 错误——不要忘记括号！\n# $bletch 得到@a 的大小；只有$foo 被局部化！\n\
  local $foo, $bar, $bletch = @a;\n\n# 错误——局部化了@a 和@b，但只有@a 获得了值\nmy ( @a, @b ) =\
  \ @c;\n\nptg\n\n# 错误——读取了标准输入的全部内容\nmy ($a) = <STDIN>;\n```\n\n### 需要记住的事项\n\n-\
  \ 使用`my`创建对作用域私有的词法变量。\n\n\n\n\n\n■ 使用`local`给全局变量赋予临时值。\n\n■ 对大多数特殊变量使用`local`。\n\
  \n## Item 44. 避免直接使用`@_`，除非必要\n\n与许多编程语言不同，Perl 没有内置对命名或“形式”参数的支持。子程序的参数总是通过一个名为`@_`的单一数组变量传递。子程序的作者需要为参数命名并检查其一致性。\n\
  \n通常，你应该总是通过复制参数并为其命名来开始一个子程序。首选方法是使用`my`：\n\n```\nsub digits_gone {\n    my ($str)\
  \ = @_;\n    $str =~ tr/0-9//d;   # 从字符串中移除数字\n    $str;                 # 返回转换后的字符串\n\
  }\n```\n\n读取传递给子程序的参数的惯用方法是使用`shift`逐个获取，或者使用列表赋值一次性读取所有参数：\n\n```\nsub char_count\
  \ {\n    my $str = shift;\n    my @chars = @_;\n    my @counts;\n    for (@chars)\
  \ {\n        push @counts, eval \"\\$str =~ tr/$_//\";\n    }\n    @counts;   #\
  \ 返回计数列表\n}\n```\n\n`@_`中的元素实际上是传入值的别名。修改`@_`的元素会修改对应的子程序参数——这是一种“按引用调用”的语义。子程序不仅可以修改其参数，而且如果参数是只读的，尝试这样做可能会失败：\n\
  \n```\nsub txt_file_size {\n    $_[0] .= '.txt' unless /\\.txt$/;\n    -s $_[0];\n\
  }\n```\n\n如果你尝试以`txt_file_size \"test\"`调用此子程序，它会失败并显示错误消息，因为它试图修改只读值“test”。\n\n\
  有时这种别名“特性”确实很有用。例如，你可以编写修改其参数的子程序，这对于清理数据特别有用：\n\n```\nsub normalize_in_place {\n\
  \    my $max = 0;\n    for (@_) { $max = abs($_) if abs($_) > $max }\n    return\
  \ unless $max;\n    # 注意 $_ 是“别名的别名”——工作正常！\n    for (@_) { $_ /= $max }\n    return;\
  \   # 空返回\n}\n\nmy ( $x, $y, $z ) = 1 .. 3;\nnormalize_in_place $x, $y, $z;\nprintf(\
  \ ( \"%.2g \" x 3 ) . \"\\n\", $x, $y, $z );\n```\n\n输出显示对`normalize_in_place`的调用影响了`$x`、`$y`和`$z`的值：\n\
  \n```\n0.33 0.67 1\n```\n\n如果你希望优化速度，直接使用`@_`而不复制可能会更快，因为复制值需要大量时间。如果这样做，请记住数组下标通常较慢，因此尽量使用`foreach`、`grep`和`map`等结构，这些结构允许你迭代数组而无需重复下标其元素。当然，最好的方法是编写两个或多个不同版本并用`Benchmark`测试它们。\n\
  \n尽管子程序参数作为别名传递，但任何数组参数都会被“扁平化”为一个列表。你可以修改数组参数的元素，但不能修改数组本身：\n\n```\nsub no_bad\
  \ {\n    for $i ( 0 .. $#_ ) {\n        if ( $_[$i] =~ /^bad$/ ) {\n           \
  \ splice @_, $i, 1;\n            print \"in no_bad: @_\\n\";\n            return;\n\
  \        }\n    }\n    return;\n}\n\nmy @a = qw(ok better fine great bad good);\n\
  no_bad @a;\nprint \"after no_bad: @a\\n\";\n```\n\n输出显示你可以在`no_bad`内部修改`@_`，但一旦子程序返回，`@a`恢复为其原始值：\n\
  \n```\nin no_bad: ok better fine great good\nafter no_bad: ok better fine great\
  \ bad good\n```\n\n最后，关于一个略有不同的话题：不带参数调用的子程序通常具有空的`@_`。但是，如果你使用`&`且不带括号调用子程序，它会继承当前的`@_`：\n\
  \n```\nsub inner {\n    print \"\\@_ = @_\\n\";\n}\n\nsub outer {\n    &inner; \
  \  # 这是唯一有效的语法\n}\n\nouter 1 .. 3;   # 输出 @_ = 1 2 3\n```\n\n**需要记住的事项**\n\n- 避免更改`@_`中的值，因为这会更改原始数据。\n\
  - 如果不需要修改`@_`中的数据，则不要将其复制到变量中。\n\n## Item 45. 使用`wantarray`编写返回列表的子程序\n\n你可能已经知道子程序可以返回标量值或列表值。也许你两种子程序都写过。你也可能理解标量上下文和列表上下文的重要性（Item\
  \ 12）。在闲暇时，你甚至可能好奇像下面这样的代码是如何工作的：\n\n```\nsub sorted_text_files {\n    my $dir =\
  \ shift;\n    opendir my ($dh), $dir or die \"eh?: $!\";\n    # 与 wantarray 无关，但我们必须在此处添加目录前缀才能使其工作\n\
  \    my @files = grep { -T } map { \"$dir/$_\" } readdir $dh;\n    sort @files;\n\
  }\n```\n\n你可以通过在`print`调用中使用`sorted_text_files`来获取排序后的文件列表：\n\n```\nprint join '\
  \ ', sorted_text_files '/etc';\n```\n\n由于输出符合预期，你可能不觉得这有什么神奇之处。但是，如果你在标量上下文中使用`sorted_text_files`，情况就不同了：\n\
  \n```\nprint join ' ', scalar( sorted_text_files '/etc' );\n```\n\n在这种情况下，你得不到任何输出。\n\
  \n如果将最后一行`sort @files`改为`@files = sort @files`，情况可能会更明显。现在，你得到的不是一个空值，而是一个数字。\n\n\
  你看到的是 Perl 评估子程序返回值的方式的结果。子程序返回值的上下文（列表或标量）由你调用子程序的上下文决定。Perl 在调用子程序时记录上下文，并将该上下文应用于最终作为返回值的表达式。\n\
  \n在需要知道调用上下文的情况下，你可以使用`wantarray`运算符，如果子程序调用出现在列表上下文中，则返回真（是的，`wantarray`命名不佳，因为它暗示必须是数组）。假设你想修改`sorted_text_files`子程序，使其在标量上下文中返回一个连接后的文件名列表。你可以这样重写：\n\
  \n```\nsub sorted_text_files {\n    my $dir = shift;\n    opendir my ($dh), $dir\
  \ or die \"eh?: $!\";\n    # 与 wantarray 无关，但我们必须在此处添加目录前缀才能使其工作\n    my @files\
  \ = grep { -T } map { \"$dir/$_\" } readdir $dh;\n    if (wantarray) {   # 列表还是标量上下文？\n\
  \        sort @files;   # 列表上下文——返回列表\n    }\n    else {\n        join ' ', sort\
  \ @files;   # 标量上下文——返回字符串\n    }\n}\n```\n\n`wantarray`有时也用于回答问题。如果你想找出`grep`的块参数是在标量上下文还是列表上下文中求值，可以使用类似下面的代码：\n\
  \n```\nsub how { print wantarray ? \"arrayish\" : \"scalarish\" }\ngrep { how()\
  \ } 1;\n```\n\n其输出基本解决了问题：\n\n```\nscalarish\n```\n\n### 空上下文\n\n还有第三种上下文，即空上下文，在这种情况下，你对子程序的返回值不做任何操作：\n\
  \n```\nsorted_text_files('/etc');\n```\n\n在这种情况下，`sorted_text_files`实际上不需要做任何工作，因为结果不会被使用。此时，`wantarray`返回`undef`，你可以立即返回以跳过所有工作：\n\
  \n```\nsub sorted_text_files {\n    return unless defined wantarray;\n    # 其余代码与之前相同\n\
  }\n```\n\n### 更精细的控制\n\n如果你还想了解更多关于子程序返回数据的处理情况，可以使用`Contextual::Return`。通过 Damian\
  \ Conway 的魔法，你可以了解更多关于数据将如何处理的信息。以下是其文档的摘录：\n\n```\nuse Contextual::Return;\n\n\
  sub handle_everything {\n    return SCALAR { 'thirty-twelve' }\n           BOOL\
  \   { 1 }\n           NUM    { 7 * 6 }\n           STR    { 'forty-two' }\n    \
  \       LIST   { 1, 2, 3 }\n           HASHREF { { name => 'foo', value => 99 }\
  \ }\n           ARRAYREF { [ 3, 2, 1 ] }\n           GLOBREF { \\*STDOUT }\n   \
  \        CODEREF {\n               die \"Don't use this result as code!\";\n   \
  \        };\n}\n```\n\n\n\n\n\n虽然 `Contextual::Return` 非常酷，但不要过度使用它。\n\n### 要记住的事项\n\
  \n- 允许子例程响应上下文。\n- `wantarray` 函数会告诉你子例程的上下文。\n- 若要对返回值进行更精细的控制，请尝试使用 `Contextual::Return`。\n\
  \n## 条目 46. 传递引用而非副本。\n\n“普通旧式”子例程参数传递方法有两个缺点：(1) 即使可以修改数组或哈希的元素，也无法修改数组或哈希参数本身；(2)\
  \ 将数组或哈希复制到 `@_` 中需要时间。使用引用可以克服这两个缺点（条目 58）。\n\n### 传递引用参数\n\n当你向子例程传递参数时，Perl 会将\
  \ `@_` 别名化到这些参数上。这样做是为了效率。当你将参数存储到变量中时，Perl 会进行复制。传递的参数越多，Perl 需要做的工作就越多。例如，你可以编写一个子例程来对数字列表求和。它直接从参数中获取列表：\n\
  \n```perl\nsub sum {\n    my @numbers = @_;   # 现在进行复制\n    my $sum = 0;\n    foreach\
  \ my $num (@numbers) { $sum += $num }\n    $sum;\n}\n```\n\n如果有人想用大量数字调用这个子例程呢？\n\
  \n```perl\nsum( 1 .. 100_000 );\n```\n\nPerl 必须在 `sum` 中复制 `@numbers` 中的 100,000\
  \ 个元素，尽管它不会改变任何值。Perl 做了大量无谓的工作。如果你只传递一个东西——数组的引用，Perl 就不必做所有这些工作。对子例程稍作修改即可解决这个问题：\n\
  \n```perl\nsub sum {\n    my ($numbers_ref) = @_;   # 现在进行复制\n    my $sum = 0;\n\
  \    foreach my $num (@$numbers_ref) { $sum += $num }\n    $sum;\n}\n```\n\n由于 Perl\
  \ 的参数列表始终是扁平列表，子例程对原始结构一无所知。如果你从两个或多个数组构建参数列表，子例程只会看到整个列表。为了保持它们的独立性，你可以将它们作为数组引用传递：\n\
  \n```perl\nprocess_arrays( \\@arrayA, \\@arrayB );\n```\n\n在子例程中，你将获得一个数组引用列表，可以独立处理它们：\n\
  \n```perl\nsub process_arrays {\n    my (@array_refs) = @_;   # 所有数组的引用\n    foreach\
  \ my $ref (@array_refs) {\n        ... 处理数组 ...;\n    }\n}\n```\n\n你可以对任何你喜欢的引用类型执行此操作。你的子例程只需对接收到的参数做正确的事情：\n\
  \n```perl\nprocess_refs( \\@array, \\%hash, \\&sub_name );\n```\n\n不过，这不仅仅适用于数组和哈希。如果你有非常大的字符串，可以传递标量引用来避免在子例程中复制字符串。这个例子在子例程中原地处理字符串，无需复制：\n\
  \n```perl\nprocess_big_string( \\$string );\n\nsub process_big_string {\n    my\
  \ $string_ref = shift;\n    $string_ref =~ s/\\bPERL\\b/Perl/g;\n}\n```\n\n### 返回引用参数\n\
  \n同样的复制问题也出现在另一个方向上。当你返回值时，调用者只会得到一个扁平列表。你可以返回任何类型的引用。当数据结构很大时尤其如此。\n\n下面是一个子例程，它读取整个文件并返回一个包含文件内容的标量引用：\n\
  \n```perl\nmy $string_ref = slurp_file($file);\nprint \"文件内容为：\\n$$string_ref\\\
  n\";\n\nsub slurp_file {\n    my $file = shift;\n    open my ($fh), '<', $file or\
  \ die;\n    local $/;\n    my $string = <$fh>;\n    \\$string;\n}\n```\n\n你也可以从子例程返回多个东西，并且它们可以保持各自的独立性，就像向子例程传递参数一样：\n\
  \n```perl\nmy ( $array_ref, $hash_ref ) = make_data_structure();\n\nsub make_data_structure\
  \ {\n    # ...\n    return \\@array, \\%hash;\n}\n```\n\n### 为速度传递类型团\n\n在引用出现之前，程序员有时在需要按值传递数组或哈希时，会求助于传递类型团（条目\
  \ 118）。下面是一个使用类型团构造子例程的示例，该子例程通过引用接收两个数组：\n\n```perl\nsub two_arrays {\n    local\
  \ *a1 = shift;   # 创建私有的 a1 和 a2\n    local *a2 = shift;\n    # 现在，对 @a1 和 @a2 做任何操作\
  \ ...\n}\n\nour @a = 1 .. 3;\nour @b = 4 .. 6;\ntwo_arrays *a, *b;\n```\n\n现在没有理由再这样编写代码了，但如果你处理大量遗留代码，可能会遇到类似的情况。\n\
  \n### 在引用参数上使用 local *\n\n为了速度而通过引用接收参数的子例程，有时会因为不断解引用这些参数而失去部分速度优势。对于某些人来说，语法可能会变得分散注意力或难以理解。\n\
  \n下面是一个子例程，它接收两个数组，并返回由两个数组中逐对比较的最大元素组成的列表：\n\n```perl\nsub max_v {\n    my ( $a,\
  \ $b ) = @_;\n    my $n = @$a > @$b ? @$a : @$b;   # 元素个数\n    my @result;\n   \
  \ for ( my $i = 0 ; $i < $n ; $i++ ) {\n        push @result, $$a[$i] > $$b[$i]\
  \ ? $$a[$i] : $$b[$i];\n    }\n    @result;\n}\n```\n\n那些双美元符号不太美观，对吧？\n\n解决这个问题的一种方法是将变量别名化到数组上。将引用赋值给类型团会产生创建与引用类型对应的别名变量的效果：\n\
  \n```perl\nsub max_v_local {\n    local ( *a, *b ) = @_;\n    my $n = @a > @b ?\
  \ @a : @b;\n    my @result;\n    for ( my $i = 0 ; $i < $n ; $i++ ) {\n        push\
  \ @result, $a[$i] > $b[$i] ? $a[$i] : $b[$i];\n    }\n    @result;\n}\n```\n\n一旦你理解了第一个赋值的意思，这个子例程就更容易阅读了，而且它可能比第一个版本执行得更快。当我测试这个例子时，我看到了大约\
  \ 10% 的速度提升——不算巨大，但很显著。\n\n### 要记住的事项\n\n- 在传递大型数据结构或字符串时，使用引用来避免过多的复制。\n- 向子例程传递引用，以便操作原始数据。\n\
  - 当需要完整传递数组或哈希时，传递引用。\n\n## 条目 47. 使用哈希传递命名参数。\n\n尽管 Perl 没有提供自动为函数参数命名的方法（换句话说，没有“形式参数”[条目\
  \ 48]），但有很多方法可以用同时提供名称和值的参数列表来调用函数。\n\n所有这些机制都要求被调用的函数在处理参数列表时做一些额外的工作。换句话说，这个特性也不是\
  \ Perl 内置的，但这其实是因祸得福。不同的命名参数实现适用于不同的场景。Perl 使得编写和使用几乎任何你想要的实现变得容易。\n\n一种简单的命名参数方法是从参数列表构建一个哈希：\n\
  \n```perl\nsub uses_named_params {\n    my %param = (\n        foo => 'val1',\n\
  \        bar => 'val2',\n    );\n    my %input = @_;   # 将参数作为哈希读入\n    # 将读入的参数与默认值合并\n\
  \    @param{ keys %input } = values %input;\n    # 现在，使用 $param{foo}, $param{bar}\
  \ 等\n    ...\n}\n```\n\n你可以像构建哈希一样，用键值对调用 `uses_named_params`：\n\n```perl\nuses_named_params(\
  \ bar => 'myval1', bletch => 'myval2' );\n```\n\n代码行数不多，对吧？而且都很简单。这是哈希的自然应用。\n\n\
  你可能希望允许人们使用位置参数或命名参数来调用子例程。在这种情况下，最简单的方法是在参数名称前加上减号。检查第一个参数是否以减号开头。如果是，则将参数作为命名参数处理。下面是一种直接的方法：\n\
  \n```perl\nsub uses_minus_params {\n    my %param = ( -foo => 'val1', -bar => 'val2'\
  \ );\n    my %input;\n    if ( substr( $_[0], 0, 1 ) eq '-' ) {\n        # 将命名参数作为哈希读入\n\
  \        %input = @_;\n    }\n    else {\n        my @name = qw(-foo -bar);\n  \
  \  }\n}\n```\n\n\n\n\n\n# 第 4 章 子程序\n\n```\n# 给位置参数命名并保存到哈希中\n%input = map { $name[$_],\
  \ $_[$_] } 0 .. $#_;\n}\n```\n\n下载自 <www.wowebook.com>\n\n166 | 第 4 章 子程序\n\n```\n\
  # 用输入覆盖默认值\n@param{ keys %input } = values %input;\n# 使用 $param{-foo}, $param{-bar}\n\
  }\n```\n\n你可以使用命名参数或位置参数来调用这个子程序（不过最好选择一种方法并坚持使用）：`uses_minus_params( -foo => 'myval1',\
  \ -xtra => 'myval2' ); uses_minus_params( 'myval1', 'myval2' );`\n\n避免使用单字符参数名——例如\
  \ `-e` 和 `-x`。除了过于简短外，它们还是文件测试操作符（条款 51）。\n\n如果你使用这种方法处理命名参数，在子程序内部通过一个键以减号开头的哈希来引用参数（例如\
  \ `$param{-foo}`、`$param{-bar}`）。一开始你可能会觉得使用减号开头的标识符作为参数或键有点奇怪（“这真的是 Perl 吗？”），但实际上\
  \ Perl 会将减号开头的裸字视为以减号开头的字符串。\n\nptg\n\n这种方法通常很方便，但也有一些缺点。首先，尽管以减号开头的标识符在 Perl 中会得到一些特殊处理，但它并不会像在\
  \ `=>` 左侧或单独放在花括号内那样被强制视为字符串。因此，你必须对像 `-print` 这样的参数进行引号处理，以免它变成 `-1`（同时还会打印 `$_`\
  \ 的值）。其次，如果你想使用位置参数风格，并且需要传递一个负数的第一个参数，你必须将其作为带有前导空格的字符串提供，或者采用其他同样笨拙的方式。\n\n在很多应用中这些问题并不构成麻烦，但也有更多应用会遇到其中一个或两个问题。在这种情况下，你可能需要采用另一种技术，即通过匿名哈希传递命名参数：\n\
  \n```\nsub uses_anon_hash_params {\n    my %param = ( foo => 'val1', bar => 'val2'\
  \ );\n    my %input;\n    if ( ref $_[0] eq 'HASH' ) {\n        # 将命名参数作为哈希读入\n\
  \        %input = %{ shift() };\n    }\n```\n\n下载自 <www.wowebook.com>\n\n*条款 47.\
  \ 使用哈希传递命名参数* | 167\n\n```\n    else {\n        my @name = qw(foo bar);\n      \
  \  # 给位置参数命名并保存到哈希中\n        %input = map { $name[$_], $_[$_] } 0 .. $#_;\n    }\n\
  \    # 用输入覆盖默认值\n    @param{ keys %input } = values %input;\n    # 使用 $param{foo},\
  \ $param{bar} ... 例如：\n    for ( keys %param ) {\n        print \"$_: $param{$_}\\\
  n\";\n    }\n}\n```\n\n现在使用命名参数和位置参数的语法如下：`uses_anon_hash_params( { foo => 3, test\
  \ => 10 } ); uses_anon_hash_params( -123, 345 );`\n\n```\n# 甚至 ...\nptg\nuses_anon_hash_params\
  \ { foo => 3, test => 10 };\n```\n\n在子程序开头有这样一段相当复杂的样板代码。如果你有多个接受命名参数的子程序，你可能希望创建一个完成大部分工作的子程序。\n\
  \n下面是一个实现匿名哈希技术的子程序：\n\n```\nsub do_params {\n    my ( $arg, $default ) = @_;\n\
  \    my %param = @$default;\n    my %input;\n    if ( ref $$arg[0] eq 'HASH' ) {\n\
  \        # 命名参数 -- 将其转换为哈希\n        %input = %{ $$arg[0] };\n    }\n    else {\n\
  \        # 位置参数 -- 命名它们\n        %input = map { $$default[ $_ * 2 ], $$arg[$_] }\
  \ 0 .. $#_;\n    }\n```\n\n下载自 <www.wowebook.com>\n\n168 | 第 4 章 子程序\n\n```\n  \
  \  # 覆盖默认值\n    @param{ keys %input } = values %input;\n    \\%param;\n}\n```\n\n\
  下面是如何使用它的示例：\n\n```\nsub uses_anon_hash_params {\n    # 参数列表和默认值的引用\n    my $param\
  \ = do_params \\@_,\n        [ foo => 'val1', bar => 'val2' ];\n    # do_params\
  \ 返回一个哈希引用\n    # 现在，使用 $$param{foo}, $$param{bar} -- 例如：\n    for ( keys %$param\
  \ ) {\n        print \"$_: $$param{$_}\\n\";\n    }\n}\n```\n\n这里展示的每种技术都有其自身的优缺点。选择最适合你应用的技术，如果没有完全合适的，可以根据需要进行调整。\n\
  \n**要记住的事项**\n\n- 使用哈希来命名子程序参数。\n- 通过合并哈希来设置参数的默认值。\n- 选择位置参数或命名参数，并坚持你的选择。\n\n\
  ## 条款 48. 使用原型获得特殊的参数解析\n\nPerl 支持子程序原型，但它们不像大多数语言中的命名、类型化的形式参数。相反，它们是一种机制，允许程序员编写参数处理方式类似于内置函数的子程序。不要将\
  \ Perl 的原型视为验证数据的方法；它们的作用是给 Perl 提供如何解析代码的提示。\n\n下载自 <www.wowebook.com>\n\n*条款 48.\
  \ 使用原型获得特殊的参数解析* | 169\n\n### 你自己的 pop\n\n考虑实现一个 `pop2` 函数，它从数组末尾移除并返回两个元素。假设你希望它能像内置的\
  \ `pop` 一样使用：\n\n```\nmy @a = 1 .. 10;\nmy $item = pop @a;\n```\n\n你希望你的版本也能类似地工作，从传入的数组中移除两个元素：\n\
  \n```\nmy ( $item1, $item2 ) = pop2 @a;\n```\n\n通常，如果你想实现类似 `pop2` 的功能，你会使用引用以便能够修改参数（条款\
  \ 46）：\n\n```\nsub pop2_ref { splice @{ $_[0] }, -2, 2 }\n```\n\n但你必须用数组的引用来调用它，而不是数组名：\n\
  \n```\nmy @a = 1 .. 10;\nmy ( $item1, $item2 ) = pop2_ref \\@a;\n```\n\nptg\n\n\
  为了编写一个能像内置操作符 `pop` 那样获得参数列表特殊处理的函数，你必须使用原型。\n\n原型出现在子程序声明或定义的开头：\n\n```\nsub pop2\
  \ (\\@) { splice @{ $_[0] }, -2, 2 }\n```\n\n原型由原型原子组成。原型原子是字符，可能前面带有反斜杠，表示子程序接受的参数类型。在这个例子中，`\\\
  @` 原子表示子程序 `pop2` 接受一个命名的数组参数。反斜杠原子（如 `\\$` 或 `\\@`）告诉 Perl 将相应的参数作为引用传递，因此这里 `pop2`\
  \ 的数组参数将作为引用传递，而不是作为值列表。\n\n原型还会在适当的时候调用参数类型和数量检查。例如，如果你尝试对非数组值调用 `pop2`，它将无法工作：\n\
  \n```\nmy @popped = pop2 %hash;\n```\n\n下载自 <www.wowebook.com>\n\n170 | 第 4 章 子程序\n\
  \n**表 4-1** 子程序原型字符及其含义\n\n| 原型字符 | 含义 |\n|---------|------|\n| `\\$`, `\\@`, `\\\
  %`, `\\&`, `\\*` | 返回对变量名或以 `$`、`@`、`%` 等开头的参数的引用 |\n| `$` | 强制标量上下文 |\n| `@`, `%`\
  \ | 吞掉剩余参数；强制列表上下文 |\n| `&` | 代码引用；如果是第一个参数，`sub` 关键字可选 |\n| `*` | 类型团 |\n| `;`\
  \ | 分隔必需参数和可选参数 |\n\n结果是一个编译时错误，因为 Perl 知道哈希不属于那里：\n\n```\nType of arg 1 to main::pop2\
  \ must be array ↵\n(not private hash)\n```\n\n表 4-1 显示了可以在原型中使用的字符。\n\n### 多个数组参数\n\
  \nptg\n\n那么，一个接受两个数组参数并将它们“混合”成单个列表的子程序呢？从第一个数组中取一个元素，然后从第二个数组中取一个，再从第一个数组中取一个，以此类推：\n\
  \n```\nsub blend (\\@\\@) {\n    local ( *a, *b ) = @_;   # 比大量解引用更快\n    my $n\
  \ = $#a > $#b ? $#a : $#b;\n    my @res;\n    for my $i ( 0 .. $n ) {\n        push\
  \ @res, $a[$i], $b[$i];\n    }\n    # 也可以这样写：\n    # map { $a[$_], $b[$_] } 0..$n;\n\
  \    # 但 for 和 push 更快\n    @res;\n}\n# 示例用法\nblend @a, @b;\nblend @{ [ 1 .. 10\
  \ ] }, @{ [ 11 .. 20 ] };\n```\n\n下载自 <www.wowebook.com>\n\n*条款 49. 创建闭包以锁定数据* |\
  \ 171\n\n类似地，你可以编写一个像 `foreach` 那样遍历列表元素，但每次处理 *n* 个元素的子程序：\n\n```\n# for_n: 每次遍历列表的\
  \ n 个元素\nsub for_n (&$@) {\n    my ( $sub, $n, @list ) = @_;\n    my $i;\n    while\
  \ ( $i < $#list ) {\n        &$sub( @list[ $i .. ( $i + $n - 1 ) ] );\n    }\n}\n\
  ```\n\n\n\n\n\n```\n$i += $n;\n\n}\n\n}\n\n# sample usage\n\n@a = 1 .. 10;\n\nfor_n\
  \ { print \"$_[0], $_[1]\\n\" } 2, @a;\n```\n\n在你要与世界分享的代码中使用像 `\\@` 和 `\\%` 这样的原子时要小心，因为其他程序员可能不会期望子程序在没有显式反斜杠的情况下通过引用接收参数。请充分记录此类行为。\n\
  \nptg\n\n顺便提一下，你不需要自己实现 `blend` 或 `for_n`，因为 `List:: MoreUtils` 中的 `mesh` 和 `natatime`\
  \ 可以为你完成这些工作（第 26 条）。\n\n### 要记住的事项\n\n- 使用原型创建你自己的数组或哈希操作符。\n- 使用原型创建接收独立数组作为参数的子程序。\n\
  - 避免过度使用原型，尤其是在可能引起混淆的情况下。\n\n## 第 49 条 创建闭包以锁定数据。\n\n在 Perl 中，**闭包**是指引用已超出作用域的词汇变量的子程序。这些数据不会消失，因为子程序仍然持有对它们的引用。你可以使用闭包将数据限制在命名子程序或新的匿名子程序中。\n\
  \n下载自 <www.wowebook.com>\n\n**172** ❘ *第 4 章 子程序* **命名子程序的私有数据**\n\n有时你的子程序需要一些只有它们自己能看见的数据。与任何数据一样，你希望将它们的可见性限制在尽可能小的作用域内。你可以直接将数据放在子程序内部：\n\
  \n```\nsub some_sub {\n    my $application_root = '/path/to/my/app';\n    # 对 %hash\
  \ 进行操作\n}\n```\n\n如果这样做，Perl 每次调用该子程序时都必须重新创建这个标量。如果你不需要更改数据，那就是一种浪费。也许它对性能影响不大，但从哲学上讲，这既丑陋又多余。\n\
  \n你可以在子程序外部定义 `$application_root`，但仍然希望限制其作用域。你可以通过将 `$application_root` 的定义和子程序包裹在一个块中来实现。你需要在定义子程序之前定义\
  \ `$application_root`，以便子程序可以引用它，因此你需要将其包裹在 `BEGIN` 块中：\n\n```\nBEGIN {\n    my\
  \ $application_root = '/path/to/my/app';\n    sub some_sub {\n        ...;\n   \
  \ }\n}\n```\n\n在 Perl 5.10 及更高版本中，你可以使用 `state` 变量实现相同的效果。\n\n这是一种非常常见的模式，以至于它现在已成为一个特性。当你第一次运行子程序时，Perl\
  \ 定义 `state` 变量并为其赋值。在后续调用中，Perl 会忽略该行，变量保持上一次运行子程序时的值：\n\n```\nuse 5.010;\nsub\
  \ some_sub {\n    state $application_root = '/path/to/my/app';\n    # 对 $application_root\
  \ 进行操作\n}\n```\n\n下载自 <www.wowebook.com>\n\n*第 49 条 创建闭包以锁定数据* ❘ **173**\n\n`state`\
  \ 变量在维护子程序多次调用之间的变量值时更为有用：\n\n```\nuse 5.010;\nsub show_letter {\n    state $letter\
  \ = 'a';\n    print \"Letter is \", $letter++, \"\\n\";\n}\nforeach ( 0 .. 5 ) {\n\
  \    show_letter();\n}\n```\n\n输出显示了 `$letter` 的递增过程：\n\n```\nLetter is a\nLetter\
  \ is b\nLetter is c\nLetter is d\n```\nptg\n```\nLetter is e\nLetter is f\n```\n\
  \n### 子程序引用的私有数据\n\n匿名闭包与使用 `state` 变量几乎相同，但它们可能更有用，因为你可以创建任意数量的闭包，并且可以按需设置每个子程序。如果你想创建一个与前面示例功能相同的匿名闭包，大部分操作是相同的，尽管这一切都发生在运行时：\n\
  \n```\nmy $session = do {\n    my $application_root = '/path/to/my/app';\n    sub\
  \ {\n        ...;\n    }\n};\n```\n\n然而，更有用的是按需创建闭包的方法。即使你有一个匿名子程序，你仍然完成了与设置命名子程序相同的所有工作。这不够灵活。相反，你可以使用一个**工厂**来生成子程序：\n\
  \n```\nmy $session = closure_factory('/path/to/my/app');\nsub closure_factory {\n\
  \    my $application_root = shift;\n    sub {\n        ...;\n    }\n}\n```\n\n你可以创建任意多个这样的闭包。考虑一组独立的计数器，它们由同一个工厂子程序（一个用于创建其他子程序的子程序的花哨名称）创建：\n\
  \n```\nsub make_cycle {\n    my ( $min, $max ) = @_;\n    my @numbers = $min ..\
  \ $max;\n```\nptg\n```\n    my $cursor = 0;\n    sub { $numbers[ $cursor++ % @numbers\
  \ ] }\n}\nmy $cycle_5_10 = make_cycle( 5, 9 );\nmy $cycle_f_m = make_cycle( 'f',\
  \ 'm' );\n```\n\n当你调用其中一个闭包时，它不会影响你从同一工厂创建的其他闭包：\n\n```\nforeach ( 0 .. 10 ) {\n\
  \    print $cycle_5_10->(), $cycle_f_m->();\n}\n```\n\n输出显示闭包独立运行，交错输出：\n\n```\n\
  5f6g7h8i9j5k6l7m8f9g5h\n```\n\n下载自 <www.wowebook.com>\n\n*第 49 条 创建闭包以锁定数据* ❘ **175**\n\
  \n### 闭包可以共享数据\n\n你不必将超出作用域的数据限制在单个闭包中。只要你在这些数据仍在作用域内时创建子程序，它们就会共享这些引用。考虑 `File::Find::Closures`\
  \ 模块，它提供了与 `File::Find` 配合使用的便捷子程序。`find` 子程序期望一个子程序引用来完成其魔法：\n\n```\nuse File::Find\
  \ qw(find);\nuse File::Find::Closures qw(find_by_regex);\nmy ( $wanted, $reporter\
  \ ) = find_by_regex(qr/*.pl/);\nfind( $wanted, @search_dirs );\nmy @files = $reporter->();\n\
  ```\n\n`find_by_regex` 为你处理了两个重要细节，每个细节由各自的闭包处理。首先，它创建了 `find` 所需的回调函数。在同一作用域中，它定义了\
  \ `@files` 数组来存储收集到的文件列表。为了访问该数组，它创建了第二个闭包：\n\n```\n# 来自 File::Find::Closures\n\
  sub find_by_regex {\n    require File::Spec::Functions;\n    require Carp;\n   \
  \ require UNIVERSAL;\n    my $regex = shift;\n    unless ( UNIVERSAL::isa( $regex,\
  \ ref qr// ) ) {\n        Carp::croak \"参数必须是一个正则表达式\";\n    }\n    my @files =\
  \ ();\n    sub {\n        push @files,\n            File::Spec::Functions::canonpath($File::Find::name)\
  \ if m/$regex/;\n    }, sub { wantarray ? @files : [@files] }\n}\n```\n\n下载自 <www.wowebook.com>\n\
  \n**176** ❘ *第 4 章 子程序* **要记住的事项**\n\n- 使用词汇变量使数据对子程序私有。\n- 在 Perl 5.10 或更高版本中，使用\
  \ `state` 变量处理私有数据。\n- 创建生成器（“工厂”）子程序，为你生成新的子程序。\n\n## 第 50 条 用子程序创建新的子程序。\n\n如果你经常使用相同的参数调用同一个子程序，你可以创建一个新的子程序来记住部分参数。这被称为子程序的**柯里化**。\n\
  \n假设你有一个子程序，用于过滤列表中匹配某个模式的元素，然后对结果进行排序：\n\n```\nsub my_sorted_grep {\n    my ( $pattern,\
