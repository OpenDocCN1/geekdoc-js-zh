  \    { also_private => [qr/^[A-Z_]+$/], },\n);\n```\n\n### 检查拼写\n\n完美的拼写很少是你编写代码时优先考虑的事项。然而，代码中文本的正确拼写可以为你的发行版增添一点额外的光彩。尽管其他人可能不会注意到你的所有文档拼写是否正确，但他们一定会注意到拼写错误的时候。\n\
