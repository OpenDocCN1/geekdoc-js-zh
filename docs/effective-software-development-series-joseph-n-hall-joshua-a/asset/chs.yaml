  \ time）并想知道其字符串形式，也可以使用类似的别名：\n\n```\nalias e2t=\"perl -le 'print localtime( shift\
  \ )'\"\n```\n\n### `-n` 开关\n\n`-n` 开关会在你通过 `-e` 指定的程序外面包裹一个 `while` 循环。这个 `while`\
  \ 会遍历你指定的文件中的每一行：\n\n```\n% perl -ne \"print\" fileA fileB\n```\n\n这个一行命令等同于下面的完整程序，其中\
  \ `-e` 中的部分位于 `while` 块内：\n\n```\nwhile (<>) {\n    print;\n}\n```\n\n这允许你修改输入的行以生成新的输出。假设你想给每一行添加行号，只需在输出中加入\
  \ `$.` 这个特殊变量：\n\n```\n% perl -ne 'print qq($.: $_)' fileA\n```\n\n下载自 <www.wowebook.com>\n\
  \n**430** ❘ *第 13 章 杂项* 在这个一行命令中，你使用了单引号，这样 UNIX shell 就不会把 `$.` 和 `$_` 当作 shell\
  \ 变量。在 Windows 上你可以将其改为双引号，但在 UNIX 上你必须转义 `$`，这会让事情变得非常混乱：\n\n```\n% perl -ne \"\
  print qq(\\$.: \\$_)\" fileA\n```\n\n如果你只想输出一定范围内的行，也很容易。翻转运算符（标量上下文中的 `..`）在其左侧为真之前一直为假，然后保持为真直到其右侧为真。当你只给它数字时，它会将\
  \ `$.` 与这些数字进行比较。下面这一行会输出第 4 到第 7 行（包含两端）：\n\n```\n% perl -ne 'print qq($.: $_)\
  \ if 4 .. 7' fileA\n```\n\n如果你只想要奇数行，也很简单，使用取模运算符 `%`：\n\n```\n% perl -ne 'print\
  \ qq($.: $_) if $. % 2' fileA\n```\n\n由于 `-n` 将你的代码包裹在 `while(<>) {` 和 `}` 中，你可以在此基础上玩一些额外技巧。它只是将虚拟的花括号放在\
  \ `-e` 的内容周围，但你的整个程序不必都在那个 `while` 中。例如，你可以自己结束 `while` 并开始另一个块。在这个例子中，你使用了一个 `END`\
  \ 块（第 119 条），它利用了 `-n` 提供的最后一个右括号：\n\n```\n% perl -nle '$count++ } END { print $count'\
  \ *.pl\n```\n\n如果你把这个程序完整写出来，会得到下面的脚本，尽管看起来格式有点奇怪：\n\n```\nwhile( <> ) {\n    $count++\
  \ } END { print $count\n}\n```\n\n类似地，你可能想在开始时运行一次某些操作，因此可以使用 `BEGIN` 块（第 119 条）：\n\
  \n```\n% perl -nle '$count++ } \\\nBEGIN { print q(Counting ) . @ARGV . q( files)\
  \ } \\\nEND { print $count' *.pl\n```\n\n### `-p` 开关\n\n`-p` 开关类似于 `-n` 开关，但它会在每次循环迭代结束时自动打印\
  \ `$_` 的值。\n\n下载自 <www.wowebook.com>\n\n*第 120 条 使用 Perl 一行命令创建迷你程序* ❘ **431**\n\
  \n```\n% perl -pe 's/buster/Buster/g' fileA fileB\n```\n\n`-p` 会将这个程序转换成下面的 `while`\
  \ 循环，将你的代码插入到循环顶部，并在循环结束前添加一个 `print`：\n\n```\nwhile (<>) {\n    s/buster/Buster/g;\n\
  \    print;\n}\n```\n\n假设你想将所有行尾符改为 UNIX 行尾符。你只需提供修改行的部分，`-p` 会处理输出：\n\n```\n% perl\
  \ -pe 's/\\012?\\015/\\n/g' file-dox.txt > \\\nfile-unix.txt\n```\n\n### `-i` 开关\n\
  \n`-i` 开关启用一些特殊魔法，让你可以原地处理文件。使用 `-i` 时，Perl 会重命名原始文件，用新名称打开它进行读取，然后以原始名称打开一个新文件进行写入。当你从重命名的文件中读取行时，可以修改它们并写入原始文件名，从而逐行转换文件。如果你想将所有冒号改为制表符，可以使用\
  \ `-pi`：\n\n```\n% perl -pi -e 's/:/\\t/' fileA fileB\n```\n\n单独使用 `-i` 开关会覆盖原始数据。Perl\
  \ 不会保留原始文件的副本。如果你想在操作出错时保留备份，可以给 `-i` 指定一个文件扩展名，例如 `.old`。这样 Perl 会将原始数据保存为 `fileA.old`\
  \ 和 `fileB.old`。\n\n```\n% perl -pi.old -e 's/:/\\t/' fileA fileB\n```\n\n你可以通过全局替换来递增文件中的所有数字：\n\
  \n```\n% perl -pi.bak -e 's/(\\d+)/ 1 + $1 /ge' fileA\n```\n\n你还可以只递增那些周围有非单词字符的数字：\n\
  \n```\n% perl -pi.bak -e 's/\\b(\\d+)\\b/ 1 + $1 /ge' fileA\n```\n\n或者你可能想将所有制表符扩展为空格。这有点棘手，因为你不能简单地将每个制表符替换为固定数量的空格。你只想将制表符扩展到下一个制表位，因此需要做一些巧妙计算来算出距离制表位还有多远：\n\
  \n```\n% perl -pi -e 's/\\t/ q( ) x (4 - pos() % 4) /ge' tabs.txt\n```\n\n使用 `-0`\
  \ 开关，你可以指定输入记录分隔符（八进制或十六进制）。如果指定 `00`，则开启段落模式。要重新换行段落，你可以将每段连续空白替换为单个空格，然后找到第 73\
  \ 个字符之前的第一个空格，将其替换为换行符。在打印 `$_` 之前，再添加一个额外的换行符来分隔段落：\n\n```\n% perl -000 -pi.bak\
  \ -e \\\n's/\\s+/ /g; s/(.{50,73})\\s/$1\\n/g; $_.=qq(\\n\\n)'\n```\n\n这个例子非常适合使用\
  \ `\\K`，它不会将模式中 `\\K` 之前的部分包含在替换中：\n\n```\n% perl5.10.1 -000 -pe \\\n's/\\s+/ /g;\
  \ s/(.{50,73})\\K\\s/\\n/g; $_.=qq(\\n\\n)'\n```\n\n### `-M` 开关\n\n你可以通过 `-M` 从命令行加载模块：\n\
  \n```\n% perl -MLWP::Simple -e \"getprint 'http://www.example.com'\"\n% perl -MFile::Spec::Functions\
  \ -le \\\n'print catfile( @ARGV )' a b c\n```\n\n如果你想导入一个符号，可以在模块名后面加上等号，然后跟上导入列表：\n\
  \n```\n% perl -MList::Util=shuffle -le \\\n\"print for( shuffle(@ARGV) )\" a b c\n\
  ```\n\n如果你想加载多个模块，可以使用多个 `-M`：\n\n```\n% perl -MList::Util=shuffle -MList::MoreUtils=uniq\
  \ \\\n-le \"print for( shuffle( uniq @ARGV) )\" a b c a h g\n```\n\n### `-a` 和 `-F`\
  \ 开关\n\n`-a` 开关会为你拆分一行，并将结果放入 `@F` 中。默认情况下，它按空白字符拆分。使用之前看到的 `END` 技巧，但这次结合 `for`，你可以得到一个词频表：\n\
  \n```\n% perl -anle '$S{$_}++ for @F } \\\nfor( keys %S ) { print qq($_ $S{$_})'\n\
  ```\n\n如果你想按单词出现次数排序列表，也很容易：\n\n```\n% perl -anle '$S{$_}++ for @F } \\\nfor( sort\
  \ { $S{$b} <=> $S{$a} } keys %S ) \\\n{ print qq($_: $S{$_})'\n```\n\n这对于以空白分隔的单词来说没问题，但如果它们是由其他字符（比如冒号）分隔的呢？`-F`\
  \ 开关允许你更改 `-a` 使用的拆分模式：\n\n```\n% perl -aF: -nle '$S{$_}++ for @F } \\\nfor( sort\
  \ { $S{$b} <=> $S{$a} } keys %S ) \\\n{ print qq($_: $S{$_})'\n```\n\n如果你只想统计部分单词，比如每行的第\
  \ 1 到第 3 个单词，那么只需使用 `@F` 的一个切片：\n\n```\n% perl -aF: -nle '$S{$_}++ for @F[0..2]\
  \ } \\\nfor( sort { $S{$b} <=> $S{$a} } keys %S ) \\\n{ print qq($_: $S{$_})'\n\
  ```\n\n### 需要记住的要点\n\n- 直接在命令行上编写简短的程序。\n\n\n\n\n■ 备份你原地修改的任何文件。\n\n■ 有关所有 perl\
