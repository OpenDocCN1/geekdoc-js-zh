  \n**60** ❘ *第 2 章 地道的 Perl* **第 17 条：了解常见的简写和语法怪癖。**\n\nPerl 是一种“人性化”的语言，因为它具有依赖于上下文的语法。你可以利用这一点，省略解释器可以推断的内容——默认参数、`$_`、可选标点符号等。Perl\
  \ 会根据上下文推断出你的真实意图（通常如此）。\n\nPerl 也是一种非常高级的语言，具有极其丰富和多样的语法，但有时各种语法特性可能无法很好地配合。在某些情况下，你可能需要借助某种语法技巧来帮助\
  \ Perl。沿着这些思路，这里有一些建议和一些需要注意的事项。\n\n### 使用列表赋值交换值\n\nPerl 没有专门的运算符来交换两个变量中的值，但你总是可以使用列表赋值达到同样的效果。Perl\
  \ 在赋值之前会先计算右侧的值：\n\n```\n( $b, $a ) = ( $a, $b );  # 交换 $a 和 $b\n```\n\nptg\n\n\
  ```\n( $c, $a, $b ) = ( $a, $b, $c );  # 轮换 $a、$b 和 $c\n```\n\n切片提供了一种方便的语法来排列数组的内容：\n\
  \n```\n@a[ 1, 3, 5 ] = @a[ 5, 3, 1 ];  # 打乱一些元素\n```\n\n你可以重新排列索引，从而交换数组中偶数编号和奇数编号的元素：\n\
  \n```\n@a[ map { $_ * 2 + 1, $_ * 2 } 0 .. ( $#a / 2 ) ] = @a;\n```\n\n### 使用 `[\
  \ ]` 或 `( )[]` 强制列表上下文\n\n在某些情况下，你可能需要强制 Perl 在列表上下文中计算表达式。例如，如果你想分割由正则表达式捕获捕获到的字符串，你可能会先这样写：\n\
  \n```\n# 在 + 上分割 $_，直到 :\nmy ($str) = /([^:]*)/;\nmy @words = split /\\+/, $str;\n\
  ```\n\n要在不使用临时变量 `$str` 的情况下用一个表达式写出这个操作，你必须借助技巧，因为模式匹配在 `split` 施加的标量上下文中不会返回正确的值类型。字面切片内部是列表上下文：\n\
  \n```\nmy @words = split /\\+/, (/([^:]*)/)[0];\n```\n\n如果你想一步获取字面列表的引用，请使用匿名数组构造器\
  \ `[]`。将引用运算符 `\\` 应用于字面列表实际上会创建一个引用列表，而不是数组的引用（第 61 条）：\n\n```\nmy $wordlist_ref\
  \ = \\( split /\\++/, $str );  # 错误\nmy $wordlist_ref = [ split /\\++/, $str ];\
  \   # 正确\n```\n\n### 使用 `=>` 创建键值对\n\n`=>`（胖箭头）运算符是逗号运算符的同义词。功能上有一个小区别：如果 `=>` 左侧的参数本身是一个标识符，Perl\
  \ 总是将其视为字符串，并且不会将其解释为函数调用。因此，你可以在 `=>` 左侧放心使用诸如 `time` 之类的东西：\n\n```\nmy @a = (\
  \ time => 'flies' );  # \"time\" 被当作字面量\nptg\nprint \"@a\\n\";  # \"time flies\"\
  \n\nmy @b = ( time, 'flies' );  # time 运算符\nprint \"@b\\n\";  # \"862891055 flies\"\
  \n```\n\n如果你喜欢，可以使用 `=>` 让初始化器更美观。这在创建哈希的初始化器时尤其合适。它们有助于你清晰地展示哈希的键和值：\n\n```\nmy\
  \ %elements = (\n    'Ag' => 47,\n    'Au' => 79,\n    'Pt' => 78,\n);\n```\n\n\
  当你不必引用键时，它会更美观一些：\n\n```\nmy %elements = (\n    Ag => 47,\n    Au => 79,\n    Pt\
  \ => 78,\n);\n```\n\n下载自 <www.wowebook.com>\n\n**62** ❘ *第 2 章 地道的 Perl*\n\n有时你根本不需要\
  \ `=>`。如果你的键和值中没有空格，你可以使用引号单词运算符（第 21 条）：\n\n```\nmy %elements = qw(\n    Ag 47\n\
  \    Au 79\n    Pt 78\n);\n```\n\n### 使用 `=>` 运算符模拟命名参数\n\n你可以为函数调用模拟命名参数。你可以设置子程序以使用哈希参数。为了快速构建这个哈希，将默认值放在前面，子程序参数放在后面。在这个例子中，`%params`\
  \ 为 `align` 提供了一个默认值：\n\n```\nsub img {\n    my %params = ( align => 'middle', @_\
  \ );\n    # 将哈希的键和值写出为 HTML 标签\n    ptg\n    print \"<img \",\n        (\n     \
  \       join ' ', map { \"$_=\\\"$param{$_}\\\"\" }\n                keys %param\n\
  \        ),\n        \">\";\n}\n```\n\n当你调用 `img` 子程序时，传入你想要设置的键值对：\n\n```\nimg(\
  \ src => 'icon.gif', align => 'top' );\n```\n\n在这种情况下，你传入了 `align => 'top'`，它替换了\
  \ `%params` 中的默认设置，你得到了正确对齐的 `img` 标签：\n\n```\n<img src=\"icon.gif\" align=\"top\"\
  \ />\n```\n\n不过，在实际应用中不要遵循我们简单的 HTML 创建示例。请改用某个 HTML 模块。\n\n下载自 <www.wowebook.com>\n\
  \n*第 17 条：了解常见的简写和语法怪癖* ❘ **63**\n\n### 使用 `=>` 表示方向\n\n最后，这是 `=>` 作为语法“糖”的另一个有趣用法。使用\
  \ `rename`，你可以显示从原始文件名到新文件名的方向：\n\n```\nrename \"$file.c\" => \"$file.c.old\";\n\
  ```\n\n不要将 `=>` 与 `->` 混淆，后者用于引用下标（第 58 条）或方法调用。\n\n### 注意 `{ }` 内部的内容\n\n圆括号、方括号、尖括号和花括号在\
  \ Perl 中都有多种含义。Perl 使用括号（或其他符号）的内容以及周围的上下文来确定如何处理它们。通常结果是有意义的，但有时可能会让你感到惊讶。\n\n\n\
  \n\n\n特别要注意花括号，它们可能是 Perl 中最勤劳的两个字符。花括号用于包围代码块、界定变量名、创建匿名哈希，以及用于哈希元素和解引用语法。如果深入思考，会让人头晕目眩。解释器能够区分匿名哈希构造器和代码块，这相当令人惊讶！\n\
  \n如果你在花括号内无缘无故看到一个加号，那很可能*是有*原因的。Perl 的一元加号对其参数没有影响，但它确实能解决一些语法问题。假设你有一个返回数组引用的子程序。如果你只把子程序名放在\
  \ `{}` 中，就会创建一个软引用（用 `strict` 捕获它：第 3 条）：`my @a = @{func_returning_aryref};` # 错误！\n\
  \n以下用法能达到你的预期，因为你给了 Perl 一个提示，表明 `func_returning_aryref` 是一个子程序名：\n\n```\nmy @a\
  \ = @{ func_returning_aryref() };   # 正确——括号\nmy @a = @{ &func_returning_aryref\
  \ };    # 正确——与号\nmy @a = @{ +func_returning_aryref };    # 正确——一元加号\n```\n\n如果不走运，你可能还会遇到哈希构造器与代码块混淆的情况。假设你有一个子程序，返回一个键值对列表，你想在匿名哈希构造器中使用它。由于花括号是\
  \ Perl 中重载最多的字符之一，你可能需要给 Perl 一些额外的提示，表明你想要的用途。作为更大表达式的一部分，Perl 知道 `key_value_pairs()`\
  \ 必须在哈希构造器中：\n\n```\nmy $hashref = eval {\n    return { key_value_pairs() }   #\
  \ 正确\n};\n```\n\n你可以使用一元 `+` 来提示 Perl，你的左花括号是匿名哈希构造器的开始：\n\n```\nmy $hashref = eval\
  \ {\n    +{ key_value_pairs() }   # 正确\n};\n```\n\n然而，单独使用时，Perl 会猜测 `key_value_pairs()`\
  \ 是在一个代码块中，不幸的是，在这种情况下这个猜测是错误的：\n\n```\nmy $hashref = eval {\n    { key_value_pairs()\
  \ }   # 可能不正确\n};\n```\n\n最后，Perl 认为花括号内单独出现（可能被空白包围）的标识符是一个字符串。如果它是一个函数名，除非标识符之外还有其他内容，否则该函数不会被调用：\n\
  \n```\n${shift} = 10;   # 设置 $shift = 10\nsub soft { ${ +shift } = 10; }   # 软引用！\n\
  soft 'a';   # 设置 $a = 10\n```\n\n由于这种混淆，你不应该自己使用这些结构，当你遇到别人使用它们时，应该好好教训他们一顿。\n\n\
  ### 使用 `@{[ ]}` 或 `eval {}` 来复制列表\n\n有时你可能希望对列表的副本执行破坏性操作，而不是对原始列表。例如，如果你想找出哪些 `.h`\
  \ 文件缺失，可以将 `.c` 文件名改为 `.h` 文件名，然后检查哪些文件存在：\n\n```\nmy @cfiles_copy = @cfiles;\n\
  my @missing_h =\n    grep { s/\\.c$/\\.h/ and not -e } @cfiles_copy;\n```\n\nPerl\
  \ 没有提供复制对象的函数，但如果你需要创建一个未命名的列表副本，可以将列表放入匿名列表构造器 `[]` 中，然后立即解引用：\n\n```\nmy @missing_h\
  \ =\n    grep { s/\\.c$/\\.h/ and !-e } @{ [@cfiles] };\n```\n\n另一种复制对象的方法是将它放入\
  \ `eval` 块中，该块返回其最后一个表达式的求值结果：\n\n```\nmy @missing_h =\n    grep { s/\\.c$/\\.h/\
  \ and !-e } eval { @cfiles };\n```\n\n在这种情况下使用 `eval` 的块形式，而不是字符串形式，因为块形式效率高得多。\n\
  \n不过，要考虑是否真的需要复制。在这些简单的例子中，你做了额外的工作来避免 `grep` 内部的一点混乱。你也可以在 `grep` 中将元素保存到另一个变量：\n\
  \n```\nmy @missing_h = grep {\n    my $h = $_;\n    $h =~ s/\\.c$/\\.h/ and !( -e\
  \ $h )\n} @cfiles;\n```\n\n请注意，所有这些技术都只进行浅复制。如果任何列表元素是引用，副本可能与原始数据共享数据。如果你需要一个完全独立、深层的副本，请使用\
  \ `Storable` 中的 `dclone`：\n\n```\nuse Storable qw(dclone);\nmy $copy_ref = dclone(\
  \ \\@array );\n```\n\n现在 `$copy_ref` 与 `@array` 没有任何共同之处。\n\n你必须根据问题决定哪种方式更有意义，但通常复制列表的机制会掩盖你正在做的事情。\n\
  \n### 要记住的事项\n\n- Perl 的语法融合了多种来源，因此有很多古怪之处。\n- 使用 `=>` 来显示数据之间的关系。\n- 使用 `dclone`\
  \ 来创建数组的深层副本。\n\n## 第 18 条。避免过多的标点符号。\n\nPerl 程序往往充满标点符号，常常达到令人望而生畏、杂乱无章的程度。过多的标点符号会降低程序的可读性，明智的程序员会利用\
  \ Perl 的变化，使程序能够比以往使用更少的标点符号。\n\n### 调用子程序时不使用括号\n\n你可以使用不同级别的标点符号来调用子程序：前面加与号、不加与号但在函数名后加括号、或者既不加与号也不加括号。最后一种风格仅在函数调用之前已经声明或定义了该函数时才有效。\n\
  \n```\n&myfunc( 1, 2, 3 );\nmyfunc( 1, 2, 3 );\nmyfunc 1, 2, 3;\n```\n\n传统的 `&`\
  \ 语法有其用途：它是调用名称是关键字（如 `&for`）的子程序的唯一方法。不带与号或括号的“列表操作符”语法，如果函数的定义或声明在词法上出现在函数调用之前，则有效。这通常没问题，但有一些陷阱。\n\
  \n除非 Perl 已经看到了子程序定义，否则你不能使用列表操作符语法调用子程序：\n\n```\nmyfunc 1, 2, 3;   # 错误\nsub myfunc\
  \ { }\n```\n\n此外，定义必须在词法上出现在使用之前，因为这是 Perl 看到并解析它的顺序。你不能用 `BEGIN` 块来欺骗 `perl`：\n\
  \n```\nmyfunc 1, 2, 3;   # 错误\nBEGIN {\n    sub myfunc { }\n}\n```\n\n另外，子程序的定义需要在编译时就存在，因此\
  \ `eval` 内部的定义是行不通的：\n\n```\neval \"sub myfunc {}\";\nmyfunc 1, 2, 3;   # 错误\n```\n\
  \n一个在词法上位于子程序调用之前的 `BEGIN` 块可以使一切正常，即使有点奇怪：\n\n```\nBEGIN { eval \"sub myfunc {}\"\
  \ }   # 可行——但奇怪\nmyfunc 1, 2, 3;\n```\n\n你也可以预先声明子程序名，稍后再定义。Perl 现在知道 `myfunc` 是一个子程序，因此可以正确解析源代码：\n\
  \n```\nuse subs qw(myfunc);\nmyfunc 1, 2, 3;\nsub myfunc { }\n```\n\n### 使用 `and`\
  \ 和 `or` 代替 `&&` 和 `||`\n\n另一个有用的特性是增加了超低优先级的短路逻辑操作符 `and` 和 `or`。优先级表中没有比这些操作符更低的。（还有不那么令人兴奋的\
  \ `not` 和通常无用的 `xor`。）这些操作符让你可以在各种情况下去掉括号，因为你不需要对表达式进行分组。\n\n最低优先级的 `and` 和 `or`\
  \ 操作符允许你省略列表操作符、赋值和绑定周围的括号。在每种情况下，你觉得哪个看起来更好？\n\n```\nprint(\"hello, \") && print\
  \ \"goodbye.\";\nprint \"hello, \" and print \"goodbye.\";\n( my $size = -s $file\
  \ ) || die \"$file has zero size.\\n\";\nmy $size = -s $file or die \"$file has\
  \ zero size.\\n\";\n( my $word =~ /magic/ ) || $mode = 'peon';\nmy $word =~ /magic/\
  \ or $mode = 'peon';\nopen( my ($fh), '>', $file )\n    || die \"Could not open\
  \ $file: $!\";\nopen my ($fh), '>', $file\n    or die \"Could not open $file: $!\"\
  ;\n```\n\n\n\n\n\n请记住，你总是可以删除右花括号前的分号。在由单个语句组成的代码块中，这很可能是个好主意，尤其是作为 `map`、`grep`、`do`、`eval`\
  \ 等函数的参数时：\n\n```\nmy @caps = map { uc $_; } @words; # 不必要的分号\nmy @caps = map {\
  \ uc $_ } @words; # 看起来更整洁\n```\n\n另一种去除多余括号和花括号的方法是使用表达式修饰符，即“反向条件”语法。一旦你习惯了，它就会很方便：\n\
  \n```\nif (/^__END__$/) { last } # 平庸的写法\nlast if /^__END__$/; # 这样看起来不是更好吗？\n```\n\
  \nptg\n\n### 需要记住的事项\n\n■ 避免过度使用圆括号或花括号。\n\n■ 对 Perl 子程序使用列表操作符语法。\n\n■ 使用低优先级的\
  \ `and` 或 `or` 来避免优先级问题。\n\n## 第 19 条。格式化列表以便于维护。\n\n尽管我们告诉过你要避免过多的标点符号（第 18 条），但\
  \ Perl 中至少有一个部分特别希望你使用额外的标点符号。\n\nLarry Wall 在设计 Perl 时，希望创造一种能够容忍其他语言中常见语法错误的语言。如果人们反复犯同样的错误，有时解决方案就是让这个错误不再成为错误。\n\
  \nPerl 允许你在列表的最后一项后面添加一个尾随逗号：\n\n```\nmy @cats = ( 'Buster Bean', 'Mimi', ); # 不是错误\n\
  ```\n\n下载自 <www.wowebook.com>\n\n*第 19 条。格式化列表以便于维护* ❘ **69**\n\n当你添加另一个元素时，你不需要记得添加逗号，因为它已经在那里了：\n\
  \n```\nmy @cats = ( 'Buster Bean', 'Mimi', 'Roscoe' );\n```\n\n当你格式化列表，使每个元素独占一行时，这更有意义：\n\
  \n```\nmy @cats = (\n    'Buster Bean',\n    'Mimi',\n    'Roscoe',\n);\n```\n\n\
  如果你需要添加或删除一个元素，只要你在每个元素后面都加上逗号，就不需要修改其他行或干扰其他元素。你甚至可以临时注释掉一个元素：\n\n```\nmy @cats\
  \ = (\n    'Buster Bean',\n#    'Mimi',\n    'Roscoe',\nptg\n);\n```\n\n这对于用列表构造的哈希来说效果更好。你将一个键值对放在一行，并对齐列：\n\
  \n```\nmy %spacers = (\n    husband   => \"George\",\n    wife      => \"Jane\"\
  ,\n    daughter  => \"Judy\",\n    son       => \"Elroy\",\n);\n```\n\n如果你的列表元素不包含空白，你也可以使用\
  \ `qw` 操作符，这样就不需要输入逗号或引号：\n\n```\nmy %spacers = qw(\n    husband   George\n    wife\
  \      Jane\n    daughter  Judy\n    son       Elroy\n);\n```\n\n下载自 <www.wowebook.com>\n\
  \n**70** ❘ *第 2 章 地道的 Perl*\n\n### 需要记住的事项\n\n■ 每个列表元素使用一行，使数据更易于阅读和编辑。\n\n■ 在列表中使用尾随逗号，这样在添加更多元素时就不会忘记添加逗号。\n\
  \n■ 将哈希键和值对齐为列，使其更易于维护。\n\n## 第 20 条。适当地使用 `foreach`、`map` 和 `grep`。\n\n在 Perl 中，有几种不同的方式可以遍历列表中的元素。\n\
  \nPerl 程序员普遍倾向于避免在遍历列表时使用 C 风格的 `for` 循环和下标。使用下标的循环往往比不使用下标的循环慢，因为 Perl 评估下标需要花费大量时间。C\
  \ 风格的工作量太大：\n\n```\nfor ( my $i = 0 ; $i <= @array ; $i++ ) {\n    print \"I saw\
  \ $array[$i]\\n\";\n}\n```\n\nptg\n\n大多数程序员使用 `foreach`、`map` 或 `grep` 来代替。`foreach`、`map`\
  \ 和 `grep` 的功能有所重叠，但每个都有其主要的用途。这些结构很容易被滥用——你可以用其中任何一个编写几乎任何类型的循环——但这样做可能会让你和将来查看你代码的其他人感到困惑。你应该适当地使用它们。\n\
  \n### 使用 `foreach` 以只读方式遍历列表的每个元素\n\n如果你只想遍历列表中的元素，请使用 `foreach`：\n\n```\nforeach\
  \ my $cost (@cost) {\n    $total += $cost;\n}\n\nforeach my $file ( glob '*' ) {\n\
  \    print \"$file\\n\" if -T $file;\n}\n```\n\n请记住，如果没有指定控制变量，`foreach` 默认使用 `$_`：\n\
  \n下载自 <www.wowebook.com>\n\n*第 20 条。适当地使用 `foreach`、`map` 和 `grep`* ❘ **71**\n\n\
  ```\nforeach ( 1 .. 10 ) { # 打印前 10 个平方数\n    print \"$_: \", $_ * $_, \"\\n\";\n\
  }\n```\n\n另外，你总是可以使用更短的关键字 `for` 来代替 `foreach`——Perl 知道你的意思：\n\n```\nfor (@lines)\
  \ { # 打印以 From: 开头的第一行\n    print, last if /^From:/;\n}\n```\n\n### 使用 `map` 基于另一个列表的内容创建一个新列表\n\
  \n如果你想创建一个列表的转换副本，请使用 `map`。下面两行将文件名列表转换为文件大小列表。请记住，大多数文件测试操作符默认使用 `$_`（第 51 条）：\n\
  \n```\nmy @sizes = map { -s } @files;\nmy @sizes = map -s, @files;\n```\n\n`map`\
  \ 在列表上下文中评估其转换表达式或代码块。有时 ptg 返回空列表或包含多个元素的列表可能很有用。使用匹配操作符可以很优雅。\n\n以下两个示例都在 `map`\
  \ 内部使用了匹配操作符 `m//` 和圆括号。在列表上下文中，`m//` 返回正则表达式捕获的子字符串列表，如果匹配失败则返回空列表。\n\n这个 `map`\
  \ 找出所有以 `.txt` 结尾的文件名（不含扩展名）。由于匹配操作符处于列表上下文，它返回圆括号中匹配的内容列表：\n\n```\nmy @stem = map\
  \ { /(.*)\\.txt$/ } @files;\n```\n\n这个 `map` 做了类似的事情，用于在电子邮件标题列表中查找 `From:` 地址。它只返回那些匹配成功的元素：\n\
  \n```\nmy ($from) = map /^From:\\s+(.*)$/, @message_lines;\n```\n\n为了提高效率，`$_` 实际上是当前迭代元素的别名。如果你在\
  \ `map` 的转换表达式中修改 `$_`，你就会修改输入数据。这通常被认为是不好的风格，而且——谁知道呢？——你甚至可能因此把自己搞糊涂。如果你想修改列表的内容，请使用\
  \ `foreach`。（稍后会详细介绍。）\n\n下载自 <www.wowebook.com>\n\n**72** ❘ *第 2 章 地道的 Perl*\n\n\
  你还应该确保 `map` 返回一个合理的值——不要仅仅将 `map` 用作控制结构。下面的例子违反了关于 `map` 的三条规则。首先，`tr///` 修改了\
  \ `$_`，从而修改了 `@elems`。其次，`map` 的返回值是 `tr///` 返回的无意义列表——每个元素中由 `tr///` 删除的数字个数。第三，你没有对输出列表做任何操作，而这正是\
  \ `map` 的要点：\n\n```\nmap { tr/0-9//d } @elems; # 很可能是错误的\n```\n\n这返回了一个合理的值，但 `tr///`\
  \ 仍然修改了 `@elems`（第 114 条）：\n\n```\nmy @digitless = map { tr/0-9//d; $_ } @elems;\
  \ # 不好的风格\n```\n\n如果你必须在 `map` 内部使用 `tr///`、`s///` 或类似操作，请使用词法变量以避免修改 `$_`。在这个例子中，你将\
  \ `$_` 的值保存到 `$x` 中，以便修改它：\n\n```\nmy @digitless = map {\n    ( my $x = $_ ) =~\
  \ tr/0-9//d;\n    $x\n} @elems;\n```\n\nptg\n\n### 使用 `foreach` 修改列表的元素\n\n如果你确实想修改列表中的元素，请使用\
  \ `foreach`。与 `map` 和 `grep` 一样，控制变量是当前迭代元素的别名。修改控制变量会修改该元素：\n\n```\n# 将 @nums 的所有元素乘以\
  \ 2\nforeach my $num (@nums) {\n    $num *= 2;\n}\n\n# 从 @ary 的元素中删除数字\nforeach\
  \ (@ary) { tr/0-9//d }\n\n# 使用 s/// 的较慢版本\nforeach (@elems) { s/\\d//g }\n\n# 将\
  \ $str1、$str2 和 $str3 转换为大写\nforeach ( $str1, $str2, $str3 ) {\n    $_ = uc $_;\n\
  }\n```\n\n下载自 <www.wowebook.com>\n\n*第 21 条。了解字符串引用的不同方式* ❘ **73**\n\n### 使用 `grep`\
  \ 选择列表中的元素\n\n`grep` 操作符有一个特定的用途，即选择或计数列表中的元素。不过，如果你看到一些对 `grep` 更具创意的滥用，你可能不会知道这一点，这些滥用通常来自那些认为\
  \ `foreach` 循环不如 `grep` 酷的程序员。当你尝试编写高效的 Perl 时，我们希望你能更接近正道。\n\n以下是在列表上下文中使用 `grep`\
  \ 的传统方式：\n\n```\nprint grep /joseph/i, @lines;\n```\n\n\n\n\n顺便提一下，Perl 在标量上下文中计算\
  \ `grep` 的“选择”表达式或块参数，这与 `map` 的转换表达式不同。这很少会造成差异，但了解一下总是好的。\n\n在标量上下文中，`grep` 返回所选元素的数量，而不是元素本身：\n\
  \n```\nmy $has_false = grep !$_, @array;\nmy $has_undef = grep !defined($_), @array;\n\
  ```\n\nptg\n\n**需要记住的事项**\n\n- 当你需要将一个列表转换为另一个列表时，使用 `map`。\n- 使用 `grep` 来过滤列表。\n\
  - 当你想要原地修改变量时，使用 `foreach`。\n\n## 第 21 条 了解字符串引用的不同方式\n\nPerl 提供了多种不同的字符串引用方式。\n\
  \n有单引号，其中除了转义的反斜杠和单引号外，所有内容都保持“原样”：\n\n```\n'Isn\\'t she \"lovely\"?' # Isn't she\
  \ \"lovely\"?\n```\n\n另一方面，双引号支持多种转义序列。有常见的 `\\t`、`\\n`、`\\r` 等，来自 C 语言：\n\n```\n\
  \"Testing\\none\\n\\two\\n\\three\"\n# Testing\n# one wo\n# hree\n```\n\n下载自 <www.wowebook.com>\n\
  \n**74** ❘ *第 2 章 地道的 Perl* 还有八进制和十六进制的 ASCII 转义，如 `\\101` 和 `\\x41`：\n\n```\n\"\
  \\x50\\x65\\x72\\x6c\\x21\" # Perl!\n```\n\n你可以使用 `\\x{}` 指定 Unicode 码点（第 74 条）：\n\
  \n```\n\"There be pirates! \\x{2620}\";\n```\n\n如果你使用 `charnames` 模块，还可以使用 Unicode\
  \ 字符名称：\n\n```\nuse charnames;\nmy $str = \"There be pirates! \\N{SKULL AND CROSSBONES}\"\
  ;\n```\n\n双引号还支持对以 `$` 和 `@` 开头的变量和下标表达式的内容进行插值。\n\n```\nforeach $key ( sort keys\
  \ %hash ) {\n    print \"$key: $hash{$key}\\n\";\n}\n```\n\n数组和切片的元素通过连接 `$\"` 特殊变量的内容来插值——通常是一个空格：\n\
  \n```\nmy @n = 1 .. 3;\nprint \"testing @n\\n\"; # testing 1 2 3\n```\n\n如果你的变量名出现在其他合法标识符字符旁边，你可以使用\
  \ `{}` 来界定名称：\n\n```\nprint \"testing @{n}sies\\n\"; # testing 1 2 3sies\n```\n\n\
  `\\u`、`\\U`、`\\l`、`\\L`、`\\E` 转义序列用于改变双引号字符串中字符的大小写：\n\n```\nmy $v = \"very\";\n\
  print \"I am \\u$v \\U$v\\E tired!\\n\"; # I am Very VERY tired!\n```\n\n这还没有涵盖双引号插值的所有细微差别。完整的描述，包括所有细节，可以在\
  \ `perlop` 文档中找到。\n\n## 替代引用：q、qq 和 qw\n\n有时，使用单引号或双引号以外的字符来包围字符串会很有帮助，尤其是当这些字符作为文字文本出现在字符串中时。自然地，Perl\
  \ 允许你使用任何标点字符来包围字符串。只需在你喜欢的字符前加上 `q` 表示单引号字符串，或 `qq` 表示双引号字符串：\n\n```\nq*A 'starring'\
  \ role*\n# A 'starring' role\n\nqq|Don't \"quote\" me!| # Don't \"quote\" me!\n\
  ```\n\n如果你在字符串中使用了新的分隔符，你仍然需要转义它，不过如果你能选择不同的分隔符，就可以避免这种情况：\n\n```\nq*Make this \\\
  *bold\\**\n# Make this *bold*\n```\n\n如果你使用“可匹配的”分隔符（`(`、`[`、`<` 或 `{` 之一），那么字符串的结束符就是对应的闭合分隔符。以下都是等价的：\n\
  \n```\nqq<Don't \"quote\" me!>\nqq[Don't \"quote\" me!]\nqq{Don't \"quote\" me!}\n\
  qq(Don't \"quote\" me!)\n```\n\nPerl 在查找闭合分隔符时会跟踪嵌套：\n\n```\nqq<Don't << quote >>\
  \ me!>\n# Don't << quote >> me!\n```\n\nptg\n\n**使用 `q{}` 和/或 `qq{}` 引用源代码**\n\n\
  你选择的分隔符可以向其他程序员暗示你在做什么。当你的字符串实际上是源代码时，比如用于 `Benchmark` 的片段，请使用花括号：\n\n```\nuse Benchmark;\n\
  our $b = 1.234;\ntimethese(\n    1_000_000,\n    {\n        control => q{ my $a\
  \ = $b },\n        sin     => q{ my $a = sin $b },\n        log     => q{ my $a\
  \ = log $b },\n    }\n);\n```\n\n下载自 <www.wowebook.com>\n\n**76** ❘ *第 2 章 地道的 Perl*\n\
  \n## 使用 qw() 创建无逗号、无引号的列表\n\n最后，作为创建字符串列表的简写方式，你可以使用 `qw`（“引用单词”）。Perl 将 `qw` 引号内的字符串按空白分割，返回一个字符串列表：\n\
  \n```\n@ISA = qw( Foo Bar Bletch );\n```\n\n这在功能上等同于你自己引用值并用逗号分隔：\n\n```\n@ISA =\
  \ ( 'Foo', 'Bar', 'Bletch' );\n```\n\n不要错误地在 `qw` 引号内无意中包含逗号，因为它们会被视为引用字符串的一部分。在这个例子中，你最终得到的是“Foo,”、“Bar,”和“Bletch”，除了“Bletch”之外都带有额外的逗号：\n\
  \n```\n@ISA = qw( Foo, Bar, Bletch );\n```\n\n当你启用警告（第 99 条）这样做时，你会得到类似这样的信息：\n\n\
  ```\nPossible attempt to separate words with commas ...\n```\n\nptg\n\n## 替代引用：“here\
  \ doc”字符串\n\nPerl 的 **here doc** 或 **here document** 字符串提供了另一种引用文本的方式。你们中的许多人可能已经熟悉\
  \ here doc——Perl 的 here doc 功能源自同名的 UNIX shell 功能。Here doc 对于引用长段文本或源代码非常有用。\n\n\
  Here doc 字符串以 `<<` 后跟一个标识符开始，当该标识符在后面的文本中单独出现在一行时结束。字符串从 `<<` 的下一行开始。如果标识符被引用了（使用单引号、双引号或反引号），引号的类型决定了\
  \ here doc 中字符串的类型。默认是双引号字符串：\n\n```\nprint <<EOT; # ; 结束语句 = 注释被忽略！\nDear $j $h,\n\
  You may have just won $m!\nEOT\n```\n\n如果你想要单引号字符串，可以在 here doc 标识符周围使用单引号（`'`）：\n\
  \n```\nprint <<'XYZZY'; # 这次是单引号……\nDear $j $h,\nYou may have just won $m!\nXYZZY\n\
  ```\n\n有时 here doc 看起来可能很奇怪，因为你可以同时使用多个。内容会堆叠在一起：\n\n```\nprint <<\"HERE\", <<\"\
  THERE\";\nThis is in the HERE here doc\nHERE\nThis is in the THERE here doc\nTHERE\n\
  ```\n\nHere doc 作为子例程的参数时也可能看起来很奇怪，因为文本出现在子例程调用之外：\n\n```\nsome_sub( <<\"HERE\"\
  , <<\"THERE\" );\nThis is in the HERE here doc\nHERE\nThis is in the THERE here\
  \ doc\nTHERE\n```\n\n虽然你可以这样做，但这对其他人来说阅读起来相当混乱，所以你应该避免这样做。\n\n**需要记住的事项**\n\n- 使用\
  \ `q()` 或 `qq()` 进行通用引用。\n- 使用 `qw()` 自动引用列表。\n- 使用 here doc 引用多行字符串。\n\n## 第 22\
  \ 条 了解多种排序方式\n\n在最基本的层面上，Perl 中的排序非常简单。Perl 的 `sort` 操作符接受一个元素列表，并返回该列表的有序副本：\n\n\
  ```\nmy @elements = sort qw(\n    hydrogen\n    helium\n    lithium\n);\n```\n\n\
  Perl 使用的排序顺序是 UTF-8 排序顺序（除非你指定了 `use locale` 或 `use bytes`），这意味着通过比较每个元素的第一个、第二个、第三个及后续字符的\
  \ UTF-8 值（实际上只是编码的数值）来排序。不过，请确保你知道什么是字符（第 77 条）。\n\n这会导致一些有趣且意想不到的结果，尤其是在数字和大小写方面：\n\
  \n```\nprint join ' ', sort 1 .. 10;\nprint join ' ', sort qw( my Dog has Fleas\
  \ );\n```\n\n如果默认的 UTF-8 比较不是你想要的，你需要编写自己的比较子例程。\n\nptg\n\n### 比较（排序）子例程\n\nPerl\
  \ 的排序子例程并不是一个完整的排序算法。更合适的名称可能是“比较子例程”。\n\n排序子例程与普通子例程的不同之处在于，参数是通过硬编码的包变量 `$a` 和\
  \ `$b` 传递的，而不是作为 `@_` 的元素。`$a` 和 `$b` 对于排序子例程来说是局部化的，就好像在子例程的开头有一个隐式的 `local($a,\
  \ $b)` 一样（但不要自己这样做）。\n\n\n\n\n`$a`和`$b`从`use strict vars`中获得“豁免”——它们不必显式声明（第 3 条）。它们属于当前包，而不是像特殊变量那样属于主包。\n\
  \nPerl 在排序过程中反复调用`sort`子程序。它的工作是比较`$a`和`$b`，并根据`$a`是否小于、等于或大于`$b`返回`-1`、`0`或`1`。\n\
  \nPerl 的内置排序行为就像元素是用`cmp`运算符比较一样。这里你使用了一个名为`utf8ly`的命名子程序来指定排序顺序：\n\nDownload from\
  \ <www.wowebook.com>\n\n## 第 22 条 学习多种排序方式 ❘ **79**\n\n```\nsub utf8ly { $a cmp\
  \ $b }\n\nmy @list = sort utf8ly @list;\n```\n\n使用排序子程序的一种更简洁的方式是将其写成一个排序块。只需将子程序的主体放在排序子程序名称的位置：\n\
  \n```\nmy @list = sort { $a cmp $b } ( 16, 1, 8, 2, 4, 32 );\n```\n\n要改变排序顺序，改变`$a`和`$b`的比较方式。例如，将`cmp`运算符替换为`<=>`以进行数值排序：\n\
  \n```\nmy @list = sort { $a <=> $b } ( 16, 1, 8, 2, 4, 32 );\n```\n\n你可以通过在进行比较之前将每个字符串转换为小写来实现不区分大小写的排序：\n\
  \n```\nmy @list = sort { lc($a) cmp lc($b) } qw(This is a test);\n# ('a', 'is',\
  \ 'test', 'This')\n```\n\n你可以通过交换`$a`和`$b`将升序排序变为降序：\n\n```\nmy @list = sort { $b\
  \ cmp $a } @list;\n```\n\nptg\n\n你甚至可以使用`$a`和`$b`来计算用于比较的值，比如根据文件的修改时间对文件名进行排序：\n\
  \n```\nmy @list = sort { -M $a <=> -M $b } @files;\n```\n\n有时会出现需要根据哈希的对应值对其键进行排序的情况。有一个简洁的惯用法，通过使用`$a`和`$b`来访问值：\n\
  \n```\nmy %elems = ( B => 5, Be => 4, H => 1, He => 2, Li => 3 );\nsort { $elems{$a}\
  \ <=> $elems{$b} } keys %elems;\n```\n\n最后，你可能希望按多个键排序。有一个使用`or`运算符的标准惯用法。下面是一个稍微牵强的例子，如果姓氏相同，则按名字排序：\n\
  \n```\nmy @first = qw(John Jane Bill Sue Carol);\nmy @last = qw(Smith Smith Jones\
  \ Jones Smith);\nmy @index = sort {\n    $last[$a] cmp $last[$b]   # 姓氏，然后\n   \
  \ or\n    $first[$a] cmp $first[$b] # 名字\n} 0 .. $#first;\n\nfor (@index) {\n  \
  \  print \"$last[$_], $first[$_]\\n\"; # Jones, Bill\n}                        \
  \            # Jones, Sue\n                                     # Smith, Carol,\
  \ etc.\n```\n\n在前面的例子中，你实际上是在排序一个索引列表。这是相当常见的做法。注意在排序子程序中使用短路布尔运算符`or`。每次 Perl 调用排序子程序时，它首先计算`or`左侧的表达式。如果计算结果为非零的“真”值——在这种情况下，意味着`$a`与`$b`比较不相等——那么`or`返回该值，你就完成了。否则，Perl\
  \ 计算右侧的比较并返回该值。\n\n注意，如果 Perl 的`or`运算符（或其优先级更高的表亲`||`）只返回`1`或`0`，那么这种方法就行不通了。正是由于`or`返回左侧或右侧实际计算出的值，才使得这种方法有效。\n\
  \nptg\n\n### 高级排序：普通方式\n\n有时比较两个键需要大量的处理。例如，让我们根据密码条目的第三个字段`uid`进行排序：\n\n```\nopen\
  \ my ($passwd), '<', '/etc/passwd' or die;\nmy @by_uid =\n    sort { ( split /:/,\
  \ $a )[2] <=> ( split /:/, $b )[2] }\n    <$passwd>;\n```\n\n乍一看这似乎没问题。它确实按要求的顺序对行进行了排序。然而，每次调用排序子程序时，它都会执行相对复杂的`split`操作两次。\n\
  \n`sort`通常对每个键多次调用子程序。基于比较的排序算法每次排序执行大约*n log n*次比较，其中*n*是排序的元素数量。为了使排序运行得更快，你必须使比较运行得更快。如果键在比较之前需要显著的转换，你应该找到一种方法来缓存转换的结果。\n\
  \nDownload from <www.wowebook.com>\n\n*第 22 条 学习多种排序方式* ❘ **81**\n\n在前面的例子中，你可以在执行排序之前创建一个比较值的哈希，然后按哈希的值进行排序：\n\
  \n```\nopen my ($passwd), '<', '/etc/passwd' or die;\nmy @passwd = <$passwd>;\n\
