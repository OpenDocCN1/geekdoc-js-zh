  \ 条 使用 File::Spec 或 Path::Class 处理路径。\n\nPerl 运行在数百种不同的平台上，几乎成为软件工程的一条定律：你编写的任何有用程序都会从你最偏好的系统迁移到你最不喜欢的系统。如果你需要处理文件路径，请使用能够为你处理所有可移植性细节的模块之一。这不仅更安全，也更简单。\n\
  \n#### 使用 File::Spec 实现可移植性\n\n\n\n\n\n`File::Spec` 模块随 Perl 一同提供，最便捷的使用方式是通过其函数接口。它会自动将几个子程序导入当前命名空间：\n\
  \n```\nuse File::Spec::Functions;\n```\n\n要构造一个新路径，你需要卷（可能不需要）、目录和文件名。卷和文件名很容易处理：\n\
  \n下载自 <www.wowebook.com>\n\n## 第 56 条 使用 File::Spec 或 Path::Class 处理路径 ❘ 193\n\n\
  ```\nmy $volume = 'C:';\nmy $file = 'perl.exe';\n```\n\n你需要做一些工作来从各部分创建目录，但这并不算太糟。`rootdir`\
  \ 函数能帮你起步，而 `catdir` 则根据本地系统将所有部分组合在一起：\n\n```\nmy $directory =\ncatdir( rootdir(),\
  \ qw(strawberry perl bin) );\n```\n\n如果你习惯使用 Windows 或 UNIX，可能不会意识到某些系统（如 VMS）会将路径的目录部分格式化为与文件名部分相同。不过，如果你使用\
  \ `File::Spec`，就无需过多担心这一点。\n\n现在你有了三个部分，可以用 `catpath` 将它们组合起来：\n\n```\nmy $full_path\
  \ =\ncatpath( $volume, $directory, $file );\n```\n\n在类 UNIX 文件系统上，`catpath` 会忽略卷参数，因此如果你不关心这部分，可以使用\
  \ `undef` 作为占位符：\n\nptg\n\n```\nmy $full_path =\ncatpath( undef, $directory, $file\
  \ );\n```\n\n如果你认为你的程序只会在本地系统上运行，这看起来可能有点傻。如果你不想处理可移植路径，那就别告诉任何人你的实用程序，这样你就永远不需要迁移它。\n\
  \n`File::Spec` 还有许多其他函数，用于组合和拆分路径，以及获取常见路径（如父目录、临时目录、空设备等）的本地表示。\n\n## 如果可能，请使用\
  \ Path::Class\n\n`Path::Class` 模块是对 `File::Spec` 的封装，并为那些自己处理起来非常麻烦的事情提供了便捷方法。首先，你需要构造一个文件或目录对象。在\
  \ Windows 上，只需将 Windows 路径传递给 `file`，它就能自动识别。`file` 函数假定路径是针对本地文件系统的：\n\n下载自 <www.wowebook.com>\n\
