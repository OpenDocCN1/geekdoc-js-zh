  - 设置本地文档服务器，通过 Web 浏览器阅读本地文档。\n\n## 第 2 条 在需要时启用新的 Perl 特性\n\n从 Perl 5.10 开始，你必须显式启用新特性。这确保了最新版本的\
  \ Perl 可以向后兼容，同时允许人们使用所有最新的炫酷特性开始新工作。\n\n例如，Perl 5.10 添加了一个内置函数 `say`，它与 `print`\
