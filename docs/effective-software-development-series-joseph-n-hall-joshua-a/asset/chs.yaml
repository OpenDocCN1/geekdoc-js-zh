  \ UTF-8 的字符集。在我们的例子中，我们使用了 iTerm，需要将终端偏好设置改为 UTF-8，同时设置 `$LANG` 环境变量。\n\n### 未知编码\n\
  \n如果你有一个字符串，你知道它是一种编码，但需要转换为另一种编码，可以使用 `Encode` 的 `from_to`。这个函数会修改传入字符串的内容。\n\n\
  ```perl\nuse Encode qw(from_to);\nfrom_to( $string, 'iso-8859-1', 'utf8' );\n```\n\
  \n或者，你可能有一堆混合了 ASCII、Latin-1 和 Unicode 的字符串。为什么？因为生活有时很艰难。`Encoding::FixLatin` 中的\
  \ `fix_latin` 例程会尽力修复，但可能并不总是有效，因为它必须做出一些猜测：\n\n```perl\nuse Encoding::FixLatin\
  \ qw(fix_latin);\nmy $utf8_string = fix_latin($stew_string);\n```\n\n即使 `fix_latin`\
  \ 看起来有效，它也可能不会返回你需要的字符串。由于它需要猜测看到的内容并处理多种编码，`fix_latin` 可能会遇到在多种编码中都有效但结果不同的字节序列。\n\
  \n### 命令行参数\n\n如果你在命令行上接受参数，你的程序可能会根据 Perl 无法控制的各种会话设置以不同的编码接收它们。你需要正确解码参数以确保得到你想要的内容。\n\
  \n首先，你可以使用 `I18N::Langinfo` 模块获取正确的代码集。`langinfo` 子程序知道如何从区域设置中获取各种数据。使用 `CODESET`\
  \ 常量，它可以获取编码的名称：\n\n```perl\nuse I18N::Langinfo qw(langinfo CODESET);\nmy $codeset\
  \ = langinfo(CODESET);\n```\n\n一旦有了代码集，你就可以将命令行参数从它们当前的编码转换为 Perl 的内部编码：\n\n```perl\n\
  use Encode qw(decode);\n@ARGV = map { decode $codeset, $_ } @ARGV;\n```\n\n### 编码字符串\n\
  \n你可以解码任何你喜欢的字节序列，但这并不保证它是一个有效的字符串。例如，Unicode 中有一些称为**组合字符**的字符，它们会修改其后的字符。\n\n\
  从这句芬兰语短语开始，其中还包含一个瑞典名字。这是一个 UTF-8 字符串，因为 Perl 源代码是 UTF-8 编码的：\n\n```perl\nuse utf8;\n\
  # (Åke 是个相当魁梧的家伙)\nmy $phrase = 'Åke on aika körmy';\n```\n\n现在你想把它转换成字节。使用 `encode`：\n\
  \n```perl\nuse Encode;\nmy $bytes = encode( 'utf8', $phrase );\nprint\n    join\
  \ ':', map { sprintf '%02x', ord($_) }\n    split //, $bytes;\n```\n\n字节字符串看起来像：\n\
  \n```\nc5:6b:65:20:6f:6e:20:61:69:6b:61:20:6b:f6:72:6d:79\n```\n\n编码字符串的前两个字节是 `\\\
  xc5\\x6b`，它们构成了带圆圈的 A 大写字母。如果你反转这两个字节，`decode` 会尽力尝试，但失败后会用**替换字符** `0xFFFD` 替换无法解码的部分。\n\
  \n```perl\nmy $not_a_with_ring =\n```\n\n\n\n\n\n`decode( 'utf8', \"\\x6b\\xc5\"\
  \ );` #`\\x6b\\xfffd` 这很可能不是你想要的。现在你得到的字符串并非你所期望的数据。相反，你希望知道是否发生了错误。你可以向 `decode`\
  \ 传递第三个参数，告诉它如何处理无效的字节串。`Encode` 提供了四个常量，你可以用它们来告诉 `decode` 如何处理错误：\n\n- `FB_DEFAULT`\
  \ 用替换字符串替换无效序列。\n- `FB_CROAK` 遇到错误时立即终止。\n- `FB_QUIET` 立即停止，保留部分解码的字符串。\n- `FB_WARN`\
  \ 与 `FB_QUIET` 类似，但会发出警告。\n\n由于 `decode` 可能会终止，你可以将其包裹在 `eval` 中以捕获错误：\n\n```\n\
  my $a_with_ring =\neval { decode( 'utf8', \"\\x6b\\xc5\", FB_CROAK ) }\nor die \"\
  Could not decode string: $@\";\n```\n\n现在你有了检测无效编码的方法。如果 `eval` 失败，你的字符串也会失败。\n\n\
  ### 需要记住的事项\n\n- 使用 `Encode` 解码字节并为字符串设置编码。\n- 使用 `Encoding::FixLatin` 猜测字节串可能代表的编码。\n\
  - 在使用命令行参数之前先解码它们。\n\n## 第 76 条：匹配 Unicode 字符和属性。\n\nUnicode 让你在正则表达式中匹配字符时拥有更大的灵活性。除了你可能已经知道的相当有限的字符类之外，你现在不仅可以匹配字面字符，还可以匹配字符的*属性*。Unicode\
  \ 字符对自身有一些了解。\n\n### 匹配特定字符\n\n匹配特定字符很简单。你可以通过其名称或十六进制值来匹配它。如果你知道码点，可以直接在 `\\x{}`\
  \ 中使用它：\n\n```\nif ( $string =~ /\\x{263a}/ ) {\n    print \"I matched a smiley!\\\
  n\";\n}\n```\n\n你可以直接在正则表达式中使用 `\\N{NAME}` 语法（第 74 条）：\n\n```\nuse charnames ':full';\n\
  if ( $string =~ /\\N{A_TILDE}/ ) {\n    print \"I found an A with a tilde!\\n\"\
  ;\n}\n```\n\n你始终可以使用长名称，这些名称指定了脚本、大小写、字母、各种修饰标记等：\n\n```\nuse charnames ':full';\n\
  if ( $string =~ /\\N{LATIN CAPITAL LETTER A WITH TILDE}/ ) {\n    print \"I found\
  \ an A with a tilde!\\n\";\n}\n```\n\n假设你有一个阿拉伯语短语，并且想知道它是否包含 hamza 字符。Patrick Abi\
  \ Salloum 提供了这个短语，他告诉我们这与骆驼穿越沙漠有关：\n\n```\nuse charnames ':full';\nuse utf8;\nmy\
  \ $phrase = 'إجتاز الجمل الصحراء';\nif ( $phrase =~ m/\\N{ARABIC LETTER HAMZA}/\
  \ ) {\n    print \"I matched a HAMZA!\\n\";\n}\n```\n\n匹配时要小心。如果你正在寻找一个字素簇（第 77\
  \ 条），你可能会被构成该字素簇的实际字符组合所迷惑。\n\n### 匹配属性\n\n在正则表达式内部，`\\p{PROPERTY}` 匹配具有该属性的字符，而其补集\
  \ `\\P{PROPERTY}` 匹配不具有该属性的字符。例如，Unicode 字符知道它是大写、标题大小写、小写还是其他（你可以在 `perlunicode`\
  \ 或 `perluniprops` 文档中看到所有属性）。这是 POSIX 括号表达式（如 `[[:digit:]]` 等）的 Unicode 版本。\n\n\
  要匹配一个字母，你可以使用 `Letter` 属性。这会匹配 Unicode 认为是字母的任何内容，无论哪种语言：\n\n```\nmy ($letters)\
  \ = /(\\p{Letter}+)/;\n```\n\n许多属性都有简写名称。你可以使用 `\\p{L}` 代替 `\\p{Letter}`：\n\n```\n\
  my ($letters) = /(\\p{L}+)/;\n```\n\n`Letter` 是一个字符类，你可以匹配特定类型的 `Letter`。如果你只想要大写字母：\n\
  \n```\nmy ($uppers) = /(\\p{UppercaseLetter}+)/;\nmy ($uppers) = /(\\p{Lu}+)/;\n\
  ```\n\n类似地，要匹配一个数字，无论它以何种形式出现：\n\n```\nmy ($number) = /(\\p{Number}+)/;\n```\n\n\
  实际上，有很多属于数字类型的字符，其中大部分你可能意想不到。你可以自己查看它们：\n\n```\nuse utf8;\nbinmode STDOUT, ':utf8';\n\
  foreach my $point ( 0 .. 65535 ) {\n    my $string = chr $point;\n    next unless\
  \ $string =~ /\\p{Number}/;\n    print \"$point --> $string\\n\";\n}\n```\n\n你可能不想匹配其中的大多数数字，因此有一些扩展属性来处理更具体的集合：\n\
  \n```\nmy ($number) = /(\\p{ASCIIHexDigit}+)/;\n```\n\n既然你有了 Unicode，就有更多类型的空白字符。你可以匹配所有这些字符，也许用空格替换每个字符：\n\
  \n```\n$string =~ s/\\p{Whitespace}/ /g;\n```\n\n也许你只想在 Unicode 的某个区块内进行匹配。如果你想要希腊区块中的内容：\n\
  \n```\nif ( $string =~ /\\p{InGreekExtended}/ ) {\n    print \"I found some greek!\\\
  n\";\n}\n```\n\n### 定义你自己的属性\n\n属性本身只是应该匹配的 Unicode 码点的特殊列表。只要你愿意花功夫制作这个列表，你就可以定义自己的属性。你只需在任何你喜欢的包中定义一个以\
  \ `In` 或 `Is` 开头的子程序。然后，将子程序的完整包规范放入 `\\p{}` 中。\n\n```\nsub MyProperties::IsMyFavoriteLetters\
  \ {\n    return <<\"CODE_POINTS\";\n33\n37\n62\\t6D\nCODE_POINTS\n}\n\nforeach (qw(\
  \ 137 Buster XYZ )) {\n    if( /\\p{MyProperties::IsMyFavoriteLetters}/ ) {\n  \
  \      print \"I found my favorite letters in [$_]!\\n\";\n    }\n}\n```\n\n由于最喜欢的字母实际上是\
  \ `[37b-m]`，只有两个元素匹配成功：\n\n```\nI found some of my favorite letters in [137]!\n\
  I found some of my favorite letters in [Buster]!\n```\n\n你可以在属性定义中使用多种数据，包括码点范围、对现有区块属性的引用、对其他类似子程序的引用等。这些引用可以包含或排除字符集，因此你可以构建（或移除）你所需的内容。它非常灵活，在\
  \ `perlunicode` 中有完整解释。\n\n### 需要记住的事项\n\n- 通过名称匹配 Unicode 字符。\n- 精确匹配 Unicode 字符或通过其属性匹配。\n\
  - 将自定义属性定义为任意的 Unicode 字符集。\n\n## 第 77 条：使用字素簇而非字符。\n\n**字素簇**（grapheme），Unicode\
  \ 术语表（http://www.unicode.org/glossary/）将其定义为“在特定书写系统背景下最小可区分的书写单位”，是大多数人认为的字符。处理\
  \ Unicode 的程序员可能会看到，字素簇在实现上由一个或多个字符组成。Unicode 并非为每一种可能的组合都提供一个码点，但它有组合字符的概念，用于修饰另一个字符，例如添加重音符号。\n\
  \n假设你想创建带分音符（或 Unicode 中的“分音符”）的小写字母“a”的字素簇，即 *ä*。Unicode 有两种方法来实现这一点。\n\n首先，你可以使用\
  \ Unicode 已经提供的**预组合**版本，因为它是一个常见字符：\n\n```\nuse charnames ':full';\nmy $precomposed\
  \ =\n    \"\\N{LATIN SMALL LETTER A WITH DIAERESIS}\"; # 长度为 1\nprint \"Length of\
  \ precomposed string is \"\n    . length($precomposed) . \"\\n\";\n```\n\n另一种方法使用**复合字符**，你将它们组合起来创建字素簇。你从一个字符开始，然后用一个组合字符修饰它：\n\
  \n```\nmy $composed =\n    \"\\N{LATIN SMALL LETTER A}\" . \"\\N{COMBINING DIAERESIS}\"\
  ;\n```\n\n现在的问题是，这个字符串的长度是 2，因为你用了两个字符来构成一个字素簇：\n\n```\nprint \"Length of composed\
  \ string is \"\n    . length($composed) . \"\\n\";\n```\n\n更糟糕的是，这两个字符串并不相同。Perl\
  \ 按字符而非字素簇进行比较，导致此示例中的条件为假：\n\n```\nunless ( $precomposed eq $composed ) {\n   \
  \ print \"The strings are different!\\n\";\n}\n```\n\n\n\n\n你是否已经把这个加入你的 Unicode\
  \ 恐怖清单了？你不能再盲目地比较两个字符串了。从逻辑上讲，这些字符串是相同的，尽管它们的表示形式不同。一个用于显示字符的小子程序可以帮助你了解发生了什么：\n\
  \n```\nsub show_chars {\n    my $phrase = shift;\n    my $string = '';\n    foreach\
  \ my $char ( split //, $phrase ) {\n        my $name = charnames::viacode( ord $char\
  \ );\n        $string .= \"$name\\n\\t\";\n    }\n    ptg\n    return $string;\n\
  }\n```\n\n现在，用 `show_chars` 检查你的字符串：\n\n```\nmy $precomposed = \"\\N{LATIN SMALL\
  \ LETTER A WITH DIAERESIS}\";\nmy $composed = \"\\N{LATIN SMALL LETTER A}\" . \"\
  \\N{COMBINING DIAERESIS}\";\nprint \"precomposed:\\n\\t\", show_chars($precomposed),\
  \ \"\\n\";\nprint \"composed:\\n\\t\", show_chars($composed), \"\\n\";\n```\n\n\
  输出显示了字符串的差异：\n\n```\nprecomposed:\n    LATIN SMALL LETTER A WITH DIAERESIS\ncomposed:\n\
  \    LATIN SMALL LETTER A\n    COMBINING DIAERESIS\n```\n\n不过，解决方案即将到来。你可以通过规范化字符串来解决这个问题。\n\
  \n## 第 77 条：使用字素簇而非字符\n\n### 规范化 Unicode 字符串\n\n有个好消息。为了解决字符-字素簇问题，Unicode 引入了**分解**的概念。你可以使用\
  \ `Unicode::Normalize` 将预组合版本分解为其组成部分。这是一项非平凡的任务，我们在此略过，只需知道规范化形式 D（`NFD`）函数接受组合字符并返回分解后的字符即可：\n\
  \n```\nuse Unicode::Normalize;\nmy $decomposed = NFD($precomposed);\nprint \"decomposed:\\\
  n\\t\", show_chars($decomposed), \"\\n\";\nprint \"Decomposed and composed are the\
  \ same!\\n\"\n    if $decomposed eq $composed;\n```\n\n现在你已经将单字符版本转换为双字符版本，并且可以比较字符串了：\n\
  \n```\ndecomposed:\n    LATIN SMALL LETTER A\n    COMBINING DIAERESIS\nptg\nDecomposed\
  \ and composed are the same!\n```\n\n### 正则表达式中的字素簇\n\n不过，这里还是有一线希望的。正则表达式理解字素簇的概念。你可以使用\
  \ `\\X` 匹配单个字素簇，无论它使用多少个字符：\n\n```\nmy $composed = \"\\N{LATIN SMALL LETTER A}\"\
  \ . \"\\N{COMBINING DIAERESIS}\";\nmy ($matched) = $composed =~ /(\\X)/;\nprint\
  \ \"matched:\\n\\t\", show_chars($matched), \"\\n\";\n```\n\n匹配输出显示 `\\X` 匹配了两个字符，正如你所预期的那样：\n\
  \n```\nmatched:\n    LATIN SMALL LETTER A\n    COMBINING DIAERESIS\n```\n\n`\\X`\
  \ 实际上只是两个 Unicode 属性（“非标记”和“标记”）组合的简写形式（`(?:\\P{M}\\p{M}*)`）（第 76 条）。\n\n知道了这一点，如果你想要单独处理字素簇，现在就可以获取字素簇列表了。有两种简单的方法：\n\
  \n```\n# 分隔符保留模式\nmy @graphemes = split /(\\X)/, $phrase;\n\n# 正向预查\nmy @graphemes\
  \ = split /(?=\\X)/, $phrase;\n```\n\n在比较字素簇时你仍然需要小心，因为 Perl 会逐字符比较，这意味着你仍然面临同样的问题。不过，至少你知道你拥有一个完整的字素簇。\n\
  \n**要点总结**\n\n- 记住，视觉上相同的字形可能有不同的表示形式。\n- 分解预组合字符以规范化你的 Unicode 字符串。\n- 使用 `\\X`\
  \ 匹配整个字素簇。\n\n## 第 78 条：在数据库中使用 Unicode 时要小心\n\n不幸的是，阅读本节并不会让你的生活更轻松，因为我们并没有所有的答案。不同的数据库服务器对数据的处理方式不同，而且这些问题不是\
  \ Perl 能够解决的。任何接触或存储你数据的东西都有可能搞砸一切。\n\n`DBI` 模块是 Unicode 透明的。也就是说，它不关心数据是什么，只是将其传递给程序。数据库驱动程序，即特定的\
  \ `DBD`，需要为你处理细节。其中一些已经在连接中支持 Unicode：\n\n```\nmy $dbh = DBI->connect( # MySQL\n\
  \    'DBI:mysql:test', 'username', 'pass',\n    { mysql_enable_utf8 => 1 }\n);\n\
  ```\n\n```\nmy $dbh = DBI->connect( # PostgreSQL\n    'DBI:Pg:test', 'username',\
  \ 'pass',\n    { pg_enable_utf8 => 1 }\n);\n```\n\n不过，不要被误导。这仅仅是告诉驱动程序假设数据是 UTF-8\
  \ 编码的。数据实际上可能并不是 UTF-8 编码的。\n\n你必须确保设置好数据库模式以处理 UTF-8。\n\n有些数据库服务器允许你在特定列上设置 Unicode\
  \ 属性，或者将所有列视为特定编码。然而，即使它们这样做了，也可能不会验证放入这些记录中的数据。如果你传入一个格式错误的 UTF-8 八位字节字符串，服务器可能会毫无怨言地接受它。当你再次取出数据时，服务器会告诉你它给你的是一个\
  \ UTF-8 字符串，即使该字符串是无效的（第 75 条）。\n\n你可能还需要考虑表中的列长度。也许你设置了一个 `varchar(16)`，但那是 16\
  \ 个字符，还是 16 个八位字节？当你有一个包含 16 个字素簇的名字时会发生什么（第 77 条）？\n\n我们能给出的最佳答案是一个需要注意的事项清单。你需要关注整个往返过程。\n\
  \n- 如果你希望在数据库中使用 Unicode 编码，请确保传入有效的 Unicode 字符串。\n- 通过检查数据库服务器的各种设置，确保它以 Unicode\
  \ 格式存储数据。\n- 当数据返回给你时，检查数据。\n\n**要点总结**\n\n- 设置数据库以处理 Unicode 列和数据。\n- `DBI` 模块是\
  \ Unicode 透明的。\n- 在连接数据库时启用数据库的 Unicode 功能。\n\n# 9 ❘ 发行版\n\n尽管你分发的任何东西都可以合理地称为“发行版”，但在\
  \ Perl 中，这对大多数人来说具有特殊含义。对于 Perl 来说，发行版通常指一组 Perl 文件和支持文件，包括一个可以安装它们的构建程序。\n\nPerl\
  \ 发行版是许多技能和技术的结晶，所有这些都打包在一个漂亮的包中，你可以将其放到 CPAN 上、通过电子邮件发送、放入版本控制中，或者做任何你喜欢的事情。要完整介绍构建发行版的集体智慧，可能需要一整本书。当这些建议与其他章节契合时，你会在本书的其他地方找到它们。本章包含那些在其他地方没有找到归宿的发行版建议。\n\
  \n关于发行版，人们有很多不同的观点，因此就像大括号和缩进风格一样，有很多可以争论的地方。实现方法不止一种（但请记住，大多数都是错误的）。\n\n## 第 79\
  \ 条：使用 Module::Build 作为你的发行版构建工具\n\n最初有 `ExtUtils::MakeMaker`，它还不错，嗯，至少够用。它从 `Makefile.PL`\
  \ 中获取值，并将其转换为用于构建 Perl 发行版的 `Makefile`。来自 UNIX 世界的 `Makefile` 给那些不依赖相同工具的其他操作系统带来了问题。此外，生成的\
  \ `Makefile` 必须费尽心思才能创建可移植的代码。\n\n如果有人要安装一个 Perl 模块，你可以相当肯定他已经安装了 Perl。与 `make`\
  \ 不同，Perl 非常可移植。与其处理 `Makefile` 的麻烦，不如享受 Perl 的强大功能。当你想要开始一个新的发行版时，请使用 `Module::Build`\
  \ 而不是 `ExtUtils::MakeMaker`。\n\n### 最终用户的视角\n\n从最终用户的角度来看，迁移到 `Module::Build` 几乎不需要他们做出任何改变（如果有的话）。如果他们习惯使用\
  \ `ExtUtils::MakeMaker` 安装你的模块：\n\n```\n% perl Makefile.PL\n% make\n% make test\n\
  % make install\n```\n\n使用 `Module::Build` 构建和安装发行版的步骤类似：\n\n```\n% perl Build.PL\n\
  % ./Build\n% ./Build test\n% ./Build install\n```\n\n\n\n\n\n大多数人如果使用 `cpan` 或 `cpanp`\
  \ 来处理安装，可能根本不会注意到这一点。\n\nptg\n\n**从模块作者的角度来看**\n\n幸运的是，开始使用 `Module::Build` 并不困难。假设你有一个名为\
  \ `MyModule` 的模块。最小的 `Build.PL` 文件指定了模块的名称，以及它应该在哪里找到版本信息：\n\n```\nuse Module::Build;\n\
  \nmy $build = Module::Build->new(\n    dist_name          => ‘MyDist’,\n    dist_version_from\
  \  => ‘lib/MyModule.pm’,\n);\n\n$build->create_build_script;\n```\n\n你可以添加更多关于你的发行版的信息。最常见的补充之一是要求依赖模块，你可以根据流程中需要依赖的部分，在\
  \ `configure_requires`、`build_requires` 或 `requires` 中指定它们。\n\n`Module::Build` 允许你通过\
  \ `recommends` 指定安装所需的模块集，以及通过 `conflicts` 指定如果安装了可能会与你的模块产生问题的模块：\n\n下载自 <www.wowebook.com>\n\
  \n*第 79 条：使用* `Module::Build` *作为你的发行版构建工具* ❘ **277**\n\n```\nuse Module::Build;\n\
  \nmy $build = Module::Build->new(\n    dist_name          => ‘MyDist’,\n    dist_version_from\
  \  => ‘lib/MyModule.pm’,\n    requires           => { ‘Some::Module’ => 1.23, },\n\
  \    recommends         => { ‘Some::Module_XS’ => 4.56, },\n);\n\n$build->create_build_script;\n\
  ```\n\n你甚至可以非常精确地排除某个特别棘手的模块版本，通过指定严格的版本要求：`requires => { ‘Volatile::Module’ =>\
  \ ‘<= 1.2, !1.3, >= 1.4’, }`。当你分发一个试图统一某个问题空间中许多类似实现接口的包装模块时，这种需求和推荐功能会变得非常强大。\n\
  \n**自定义操作**\n\nptg\n\n`Module::Build` 围绕**操作**展开，这些操作类似于 `make` 中的构建目标。例如，当你执行 `./Build\
  \ test` 时，你正在运行 `test` 操作。\n\n要修改现有操作，请继承 `Module::Build` 并重写与该操作相关的 `ACTION_` 子程序。例如，要自定义\
  \ `test` 操作，你可以重写 `ACTION_test`。\n\n假设你想创建一个名为 `critique` 的操作，该操作对你的代码调用 `Perl::Critic`。修改你的\
  \ `Build.PL` 文件，提供一个包含 `ACTION_critique` 方法的子类：\n\n```\nuse Module::Build;\n\nmy\
  \ $class = Module::Build->subclass(\n    class => “Module::Build::Custom”,\n   \
  \ code => <<’SUBCLASS’ );\nsub ACTION_critique {\n    my $self = shift;\n    $self->depends_on(“test”);\n\
  \    $self->do_system(qw(perlcritic lib/));\n}\nSUBCLASS\n\nmy $build = $class->new(\n\
  \    dist_name          => ‘MyDist’,\n    dist_version_from  => ‘lib/MyModule.pm’,\n\
  \    requires           => {\n        ‘Some::Module’ => 1.23,\n    },\n    recommends\
  \         => {\n        ‘Some::Module_XS’ => 4.56,\n    },\n);\n\n$build->create_build_script;\n\
  ```\n\n下载自 <www.wowebook.com>\n\n**278** ❘ *第 9 章 发行版*\n\n**要记住的事情**\n\n- 对于新的发行版开发，使用\
  \ `Module::Build`。\n- 继承 `Module::Build` 来创建新的操作。\n- 使用 `Module::Build->new` 的 `subclass`\
  \ 参数来自定义其行为。\n\nptg\n\n**第 80 条：不要手动创建发行版。**\n\n当你创建一个新的发行版时，你会发现自己编写了大量的样板代码。本书的第一版使用了\
  \ `h2xs` 工具来生成这些样板（第 86 条）。虽然 `h2xs` 仍然可以完成这项工作，但它最初是为了创建将 Perl 连接到 C 所需的 XS 粘合代码而设计的。如果你不需要这个功能，目前有更好的方法来启动你的发行版。\n\
  \n**从 Module::Starter 开始**\n\n使用 `Module::Starter` 只需向 `module-starter` 提供一些参数即可：\n\
  \n```\n% module-starter\n    --module=Foo::Bar,Foo::Baz \\\n    --author=”John Doe”\
  \ \\\n    --email=”me@example.com”\nCreated starter directories and files\n```\n\
  \n下载自 <www.wowebook.com>\n\n*第 80 条：不要手动创建发行版* ❘ **279**\n\n`module-starter` 程序会创建几乎每个发行版中都会出现的文件：\n\
  \n```\n./Foo-Bar/Changes\n./Foo-Bar/ignore.txt\n./Foo-Bar/lib/Foo/Bar.pm\n./Foo-Bar/lib/Foo/Baz.pm\n\
  ./Foo-Bar/Makefile.PL\n./Foo-Bar/MANIFEST\n./Foo-Bar/README\n./Foo-Bar/t/00-load.t\n\
  ./Foo-Bar/t/boilerplate.t\n./Foo-Bar/t/pod-coverage.t\n./Foo-Bar/t/pod.t\n```\n\n\
  这省去了你自己做的大量工作。有了这些代码，你可以导航到 `Foo-Bar` 目录，并在你的新 `Foo::Bar` 发行版上运行构建。\n\n如果你更喜欢 `Module::Build`\
  \ 或 `Module::Install` 而不是默认的 `ExtUtils::MakeMaker`，你可以通过 `--builder` 命令行选项告诉 `module-starter`\
  \ 你想要哪一个：\n\n```\n% module-starter \\\n    --module=Foo::Bar,Foo::Baz \\\n    --author=”John\
  \ Doe” \\\n    --email=”me@example.com” \\\n    --builder=Module::Build\nCreated\
  \ starter directories and files\n```\n\n你可以使用 `~/.module-starter/config` 文件来存储重复的选项，这样你就不必每次运行\
  \ `module-starter` 时都输入它们：\n\n```\nauthor: John Doe\nemail: me@example.com\nlicense:\
  \ artistic\nbuilder: Module::Install\n```\n\n现在你可以只使用 `--module` 选项来运行 `module-starter`：\n\
  \n```\n% module-starter --module=Foo::Bar,Foo::Baz\n```\n\n下载自 <www.wowebook.com>\n\
  \n**280** ❘ *第 9 章 发行版*\n\n***`Module::Starter` 的插件***\n\n在创建了你的发行版并用几个模块初始化之后，你很可能想要添加更多模块。默认情况下，`Module::Starter`\
  \ 无法做到这一点。然而，`Module::Starter::Smart` 插件可以。\n\n要激活一个插件，安装它并在你的 `~/.module-starter/config`\
  \ 文件中添加一行。这会保留基本的 `Module::Starter` 设置，并添加 `Module::Starter::Smart`：\n\n```\nplugins:\
  \ Module::Starter::Simple Module::Starter::Smart\n```\n\n从包含你的发行版基础目录的目录中，再次运行 `module-starter`\
  \ 来添加另一个模块文件：\n\n```\n% module-starter --module=Foo::Buzz --dist=Foo-Bar\nCreated\
  \ starter directories and files\n```\n\n这会将 `Buzz.pm` 添加到你的 `Foo-Bar/lib/Foo/` 目录，并将\
  \ `lib/Foo/Buzz.pm` 添加到你的 `MANIFEST` 中。不幸的是，`Module::Starter::Smart` 不会向你的 `00-load.t`\
  \ 文件添加 `use_ok`，所以记得手动添加。\n\n***扩展 `Module::Starter`***\n\n如果 `Module::Starter`\
  \ 不完全符合你的需求，你可以轻松地为其编写一个插件。\n\n在内部，`Module::Starter` 从左到右加载你列出的插件，动态地使左边的每个插件成为右边模块的继承父类。在列表的末尾，它使\
  \ `Module::Starter` 成为最终的继承者，并对其调用 `create_distro`。\n\n通常，这意味着会调用 `Module::Starter::Simple`\
  \ 中的 `create_distro`。这个方法会调用一组其他方法，你可以选择重写这些方法。作为示例，请查看 `Module::Starter::Plugin::Template`\
  \ 的文档。在插件列表中，最右边的插件在继承中胜出，并对给定方法的行为拥有优先发言权。在它完成工作后，它可以依次调用其父类上的方法，继续继承链，或者它可以劫持整个方法。\n\
  \n下载自 <www.wowebook.com>\n\n*第 80 条：不要手动创建发行版* ❘ **281**\n\n在下一个示例中，你将看到如何创建一个插件，该插件将你的公司许可证放入\
  \ `README` 文件，并生成你用 `Module::Starter` 创建的模块。\n\n```\npackage Module::Starter::Plugin::CorporateLicense;\n\
  use subs qw/\n    _license_blurb\n    _README_license\n    _module_license\n/;\n\
  \nsub _license_blurb {\n    return <<’LICENSE’;\nThis program is distributed under\
  \ the Nameless\nCorporate License\n\nThis software is developed as is with little\
  \ regard to quality. Should this software eat your homework or take away your birthday,\
  \ please call our support line where we will jerk you around until you give up.\n\
  LICENSE\n}\n\nsub _README_license {\n    my $self = shift;\n    my $year = $self->_thisyear();\n\
  \    my $license_blurb = $self->_license_blurb();\n    return <<”HERE”;\nCOPYRIGHT\
  \ AND LICENCE\n\nCopyright © $year Nameless Corporation\n\n$license_blurb\nHERE\n\
  }\n\nsub _module_license {\n    my $self = shift;\n    my $module = shift;\n   \
  \ my $rtname = shift;\n    my $license_blurb = $self->_license_blurb();\n    my\
  \ $year = $self->_thisyear();\n```\n\n\n\n\n```\nmy $content = qq[\n\n=head1 版权与许可\n\
  \n版权所有 © $year 无名公司\n\n下载自 <www.wowebook.com>\n\n**282** ❘ *第 9 章 发行版* $license_blurb\n\
  \n];\n\nreturn $content;\n\n}\n```\n\n现在，将你的插件添加到 `~/.module-starter/config` 中：\n\
  \n```\nplugins: Module::Starter::Simple Module::Starter::Smart\nModule::Starter::Plugin::CorporateLicense\n\
  ```\n\n下次生成发行版时，你将获得自己的许可文本，而不是默认文本。\n\n### 使用 Distribution::Cooker\n\n你可能会觉得为了达到目的而处理\
  \ `Module::Starter` 及其插件工作量太大。相反，你可以从一个你喜欢的发行版设置开始，并将其作为新发行版的模板。你甚至可以用 `Module::Starter`\
  \ 来设置那个模板发行版。\n\n`Distribution::Cooker` 中的 `dist_cooker` 程序会读取一个包含 Template Toolkit\
  \ 模板的目录，处理它们，然后生成最终的发行版。它实际上是 `ttree` 程序的一个花哨封装：\n\n```\n% dist_cooker\nttree 2.9\
  \ (Template Toolkit 版本 2.20)\n源目录: /Users/Snuffy/.templates/modules\n目标目录: /Users/Snuffy/Dev/Perl/Foo\n\
  包含路径: [ ]\n忽略: [ \\b(CVS|RCS)\\b, ^#, (\\.git|\\.svn)\\b ]\n复制: [ \\.png$, \\.gif$\
  \ ]\n接受: [ ]\n后缀: [ ]\n...\n```\n\n`~/.dist_cookerrc` 配置文件使用 INI 格式：\n\n```\n[user]\n\
  name = Joe Snuffy\npause_id = bdfoy\nemail = snuffy@example.com\n下载自 <www.wowebook.com>\n\
  *第 81 条 选择一个好的模块名* ❘ **283**\n[license]\nperl = 1\n[templates]\ndir = /Users/Snuffy/.templates/modules\n\
  module = lib/Foo.pm\nscript = bin/script.pl\n```\n\n该配置说明模板目录是 `/Users/Snuffy/.templates/modules`。你可以将任何你想要的文件放入该目录，`dist_cooker`\
  \ 会处理它们。`dist_cooker` 程序提供了几个模板变量，例如 `module` 和 `module_file`，你无需额外设置即可使用。下面是一个\
  \ `README` 模板示例：\n\n```\n你可以使用通常的 Perl 方式安装：\nperl Makefile.PL\nmake\nmake test\n\
  make install\n文档在模块文件中。安装文件后，你可以用 perldoc 阅读它。\nperldoc [% module %]\n如果你想在安装前阅读，可以直接在模块文件上使用\
  \ perldoc。\nperldoc lib/[% module_file %]\n```\n\n这使得你可以轻松地按照自己的需求精确生成发行版，而且通常几乎不需要编写代码。代码越少，错误越少。\n\
  \n**需要记住的事项**\n\n- 使用代码生成器为你完成重复的样板工作。\n- 通过插件自定义你的 `Module::Starter` 输出。\n- 使用\
  \ `Distribution::Cooker` 从自定义模板创建新的发行版。\n\n## 第 81 条 选择一个好的模块名。\n\n为你的 Perl 包取一个好名字是你所能做的最重要的事情之一。选择一个好名字，人们自然会在\
  \ CPAN 上找到它。\n\n下载自 <www.wowebook.com>\n\n**284** ❘ *第 9 章 发行版* 选择一个糟糕的名字，否则你优秀的代码可能永远无人下载。想象一下你的模块某天发布到\
  \ CPAN 上。人们看到你的模块名会立刻知道它的功能吗？它的名字能与其他已在 CPAN 上的模块和谐共存吗？\n\n对于命名你的包，并没有一套正式的规则，甚至也没有不那么严格的指导方针。你的模块可以使用任何它喜欢的名字，但和所有名字一样，一个好名字能带来长远的好处。\n\
  \n`modules@perl.org`（PAUSE 管理员的邮件列表）和 `module-authors@perl.org` 邮件列表可以帮助你选择一个好名字。他们不仅通常擅长命名，而且对\
  \ CPAN 上已有的内容也相当了解。他们可以帮助你选择一个名字，使你的模块与其他所有模块一起被放置在正确的位置。\n\n### 命名目标\n\n一个模块名必须在几个字符内传达相当多的信息，而且一旦选定，在人们开始使用后很少有机会更改。模块名不是为你自己取的；你不需要名字，因为你创建了它并理解它。名字是为其他人取的，而那些人没有你所拥有的任何上下文。你的名字需要传达三件事：上下文、关键特性和区分特征。\n\
  \n### 提供上下文\n\nCPAN 大多缺乏上下文，除了“这是 Perl 中的某个东西”。我们可以对模块进行分类，但这种分类存在于模块之外，一旦有人下载、写博客或在代码中使用它，分类就会消失。作为一个维护程序员，看到以下代码你会怎么想：\n\
  \n```\nuse XYZ::WWR::JKL;\n```\n\n你可能会认为这是一个愚蠢的例子，但我们见过没有元音字母且没有可识别缩写的模块名。即使你的名字对你和你的行业有意义，它对其他人也有意义吗？CPAN\
  \ 远不止任何一个主题。\n\n模块提供的任务或特性有其上下文，通常由创建它的作者赋予，作者为了满足某种需求而创建它。在作者看来，模块的功能和名字的含义总是显而易见的。其他人没有那个上下文，而名字需要提供它。\n\
  \n下载自 <www.wowebook.com>\n\n*第 81 条 选择一个好的模块名* ❘ **285**\n\n例如，在 Debian Linux 发行版中，包管理器被称为\
  \ `dpkg`。然而，仅作为名字，对于不使用 Debian 的人来说毫无意义。在 Debian 的上下文中，它完全合理。但在 Perl 的上下文中，它毫无意义，因此人们需要额外的线索。\n\
  \n几乎任何缩写或首字母缩略词都会产生歧义。如果你的缩写在 Google 搜索结果的第一页不是关于你的主题，那么你很可能选错了名字。\n\n### 描述关键特性\n\
  \n有些模块是为特定任务设计的。其他模块执行通用任务集。你的名字应该描述通用程度。一个 HTML 模块是做什么的？嗯，从名字上你确实看不出来。那么 `HTML::Parser`、`HTML::TreeBuilder`\
  \ 和 `HTML::SimpleLinkExtor` 呢？这些名字提供了更多关于模块能为你做什么的信息。当你选择名字时，你也应该对他人表现出同样的善意。\n\n\
  ### 区分特征\n\nCPAN 上的许多模块以不同的方式实现相似的目标，或者以相同的方式实现不同的目标。你能在 CPAN 上找到多少个 `Config` 和\
  \ `Getopt` 模块？仅从名字你能分辨出它们各自的功能吗？如果你的模块将与其他模块位于同一个命名空间下，你的模块有何不同？为什么人们应该使用你的模块而不是名字非常相似的模块？\n\
  \n### 一些命名惯例\n\nCPAN 是管理有序的混乱，许多惯例是随着时间的推移发展起来的。这些并非所有当前的惯例，甚至这些惯例也可能演变。\n\n###\
  \ App\n\n你可以将应用程序作为 Perl 发行版分发。通常，这类发行版放在 `App` 命名空间下，例如 `App::Ack`、`App::Cpan`\
  \ 和 `App::Prove`。该命名空间暗示它是一个即用型程序，而不是一个模块。\n\n下载自 <www.wowebook.com>\n\n**286**\
  \ ❘ *第 9 章 发行版*\n\n### Local\n\n按照惯例，顶级 `Local` 命名空间永远不应与 CPAN 上的任何内容冲突。这让你可以确信，你在\
  \ `Local` 下选择的名称不会与外部世界的任何内容冲突。\n\n### 活跃项目\n\n一些项目，例如 `Moose`、`DBI`、`DateTime`\
  \ 和 `Catalyst`，试图在其各自的命名空间下组织活动，以确保所有内容协同工作。如果你想为这样的项目添加一个模块，请在其邮件列表上讨论。\n\n###\
  \ 应避免的名称\n\nCPAN 自 1995 年以来一直存在，随着时间的推移，各种管理员发现或遵循了某些惯例，以使设计上的无政府状态不那么混乱。作为一个进化过程，它在历史上是不一致的，但在现代是最优的。也就是说，回顾过去作为例子……\n\
  \n\n\n\n人们未必是最好的参照。别人做了某事，并不意味着你也该这么做。\n\n### 顶级命名空间\n\n通常来说，顶级命名空间是不好的，除非该命名空间是多个模块的汇聚点，或者是一个能描述更偏向应用场景的富有想象力的名称。你可能会觉得\
  \ `DB` 是个好名字，因为它是代码中的数据库部分，但它并没有说明具体做什么。而且它恰好也是 Perl 调试器使用的命名空间。记住，名称应尽可能提供上下文，而\
  \ `DB` 显然做不到这一点（无论哪种情况）。\n\n这并不意味着所有顶级命名空间都不好。像 `Moose`、`Catalyst` 或 `DBI` 这样的框架，它们围绕某个概念提供功能，而非针对某个特定的底层或通用任务。它们不处于层级结构中，因为它们足够全面，可以独立存在。\n\
  \n### Net\n\n`Net` 命名空间是滥用最严重的命名空间之一。它最初被设计为存放那些知道如何与各种已定义的网络协议（如 FTP、HTTP、NNTP\
  \ 等）通信的代码，但人们开始用它来存放那些仅仅使用网络却对网络一无所知的代码。与网站交互的模块确实使用了网络，但它们并非*关于*网络的，它们在 `WWW` 或\
  \ `WebService` 下有更好的归属。如果你是在实现一个网络协议而非应用协议，那么 `Net` 可能适合你。否则，就不适合。\n\n### 避免使用 Simple、Easy、Reduced、Tiny\n\
  \nSimple、Easy、Reduced 和 Tiny 这些词是 CPAN 上最糟糕的命名部分之一。它们都表明某个模块是另一个模块的变体，但为什么这个变体值得关注？它通常缺少或隐藏了一些特性，不如原版灵活，而且在大多数情况下，是针对作者所需的特定任务定制的。但那个任务是什么？对你来说简单，并不意味着对下一个程序员也简单。\n\
  \n### 避免使用“API”、“Interface”等\n\n你的模块是一个 API？这还用说？不要在名称中浪费空间去告诉人们他们已经知道的事情。如果你的代码不是某种接口，那它就不会很有用。\n\
  \n### 以自己名字命名模块\n\n许多人因为对自己的模块功能没有其他想法，就直接用自己的名字命名。他们可能确实有很好的名字，但这无助于任何人理解代码的功能，即使他们在后面加上\
  \ `Util` 也无济于事。`Snuffy::Util` 是做什么的？除非这些工具是用来操作 Snuffy 的，否则就是在浪费模块名称的空间。\n\n**需要记住的事项**\n\
  \n- 使用模块名称来传达其功能。\n- 避免使用模糊且无描述性的名称。\n- 在 `modules@perl.org` 上征求命名空间的建议。\n\n## 第\
  \ 82 条：使用 Pod 嵌入文档。\n\n许多软件开发人员，尤其是那些从事大型项目的人，会遵循编码规范，要求他们在函数定义的开头添加块注释，提供该函数的关键信息——概述、输入、输出、前置条件、变更历史等。如果这些嵌入的注释格式足够精确，脚本就可以解析、提取并重新格式化为文档。\n\
  \n因此，源文件本身就可以作为编程参考。这是一件好事，因为它允许开发人员在每次修改代码时同步调整文档，而无需定位和编辑单独的文档。有时，这几乎是开发人员能够正确管理的全部文档。\n\
  \nPerl 源代码可以包含以 **Pod**（即“Plain Old Documentation”）格式嵌入的文档。Perl 解析器在编译和解释脚本时会忽略\
  \ Pod 部分，而 Perl 发行版附带的其它程序可以扫描源文件中的文档部分，并将其格式化为 man 页面、HTML、纯文本或其它多种格式。\n\n### Pod\
  \ 基础\n\nPod 是一种非常简单的标记语言，旨在易于转换为其他格式（文本、HTML 等）。即使情况最糟，Pod 的原始形式也易于阅读。\n\n一个 Pod\
  \ 文档由空行分隔的段落组成。共有三种不同类型的段落：\n\n#### 逐字文本\n\n缩进的段落将原样重现——不换行，不对转义序列进行特殊解释，什么都不做。能够显示不同字体的转换器通常会用等宽字体显示逐字文本。\n\
  \n#### Pod 命令\n\n命令是以字符 `=` 开头的一行，后跟一个标识符，再跟一些可选文本。当前定义的命令（并非所有转换器都能理解）包括：\n\n-\
  \ `=head1` `=head2`（一级、二级标题）\n\n```\n=head1 理解包和模块。\n=head2 包\n```\n\n- `=item`（项目符号或编号列表中的一项）\n\
  \n```\n=item 1 ... 编号项\n=item * ... 项目符号项\n=item B<注意> ... 加粗的“其他”项\n```\n\n- `=over\
  \ N`/`=back`（缩进 N 个空格/从缩进“返回”）\n\n```\n=over 4\n=item * 狗\n=back\n```\n\n- `=pod`/`=cut`（Pod\
  \ 开始/Pod 结束）\n\n```\n=pod\n=cut\n```\n\n- `=for X`（下一段落为 X 格式）\n\n```\n=for html\n\
  ```\n\n- `=begin X`/`=end X`（X 格式开始和结束的括号）\n\n```\n=begin comment\n如果你能读到这句话，说明你正在使用文本转换器。\n\
  =end comment\n```\n\n#### 填充文本\n\n既不是逐字文本也不是 Pod 命令的段落被视为普通文本。格式化工具通常会将其转换为两端对齐的段落，如果可能的话使用比例字体。在填充文本中，可以识别多种特殊格式化序列：\n\
  \n- 用 `I<text>` 制作*斜体*文本：你能让 John 为你工作，那将 `I<非常>` 幸运。\n- 用 `B<text>` 制作**粗体**文本：你能让\
  \ Heather 为你工作，那将 `B<非常非常>` 幸运。\n- 用 `C<text>` 显示内联代码：现在，将 5 加到 `C<$d[$a,$b]>`\n\
  - 用 `S<text>` 强制不换行空格：`S<foreach $k (keys %hash)>`\n- 用 `E<code>` 嵌入特殊字符：小于号 `E<lt>`\
  \ 在 Pod 中是特殊的。这将是一个双引号 `E<34>`\n- 用 `L<text>` 创建交叉引用：\n  - `L<name>` — man 页面\n\
  \  - `L<name/ident>` — man 页面中的条目\n  - `L<name/\"sec\">` — man 页面中的章节\n  - `L<\"\
  sec\">` — 本 man 页面中的章节\n- 用 `F<lname>` 标记文件名：小心不要删除 `F<config.dat>`！\n- 用 `X<text>`\
  \ 标记索引条目\n\n请注意，某些 Pod 格式化工具会识别函数名（标识符后跟括号）以及其他特殊结构“在上下文中”，并自动对其应用适当的格式。此外，大多数 Pod\
  \ 格式化工具可以将直引号转换为“智能”匹配引号，双连字符转换为长破折号，等等。\n\n以下是一个 Pod 文件示例：\n\n```\n=head1 我的 Pod\
  \ 示例\n\n=head2 我的二级标题\n\nI<Pod> 是一种简单、有用的标记语言，适用于 Perl 程序员以及寻找编写“Plain Old Documentation”方法的其他人。使用\
  \ Pod，你可以：\n\n=over 4\n\n=item 1\n\n创建可以轻松转换为多种不同格式的文档。\n\n=item 2\n\n将文档直接嵌入到 Perl\
  \ 程序中。\n\n=item 3\n\n让你的朋友惊叹，让你的敌人恐惧。（可能。）\n\n=back\n\n作者：Joseph N. Hall\n\n日期：1997\n\
  ```\n\n当被转换时——这里由我的 `pod2mif` 过滤器处理——会得到：\n\n转换后的 Pod 文件\n\n我的 Pod 示例\n\n我的二级标题\n\
  \nPod 是一种简单、有用的标记语言，适用于 Perl 程序员以及寻找编写“Plain Old Documentation”方法的其他人。使用 Pod，你可以：\n\
  \n创建可以轻松转换为多种不同格式的文档。\n\n\n\n\n将文档直接嵌入 Perl 程序。\n\n让你的朋友惊叹，让敌人胆寒。（也许吧。）作者：Joseph\
  \ N. Hall\n\n日期：1997\n\n### Pod 格式的手册页\n\n尽管你可以将 Pod 用于多种不同目的，但用 Pod 编写的手册页应遵循特定约定，以便与其他\
  \ UNIX 手册页相似。变量和函数名应使用*斜体*。程序名称以及命令行开关应使用**粗体**。手册页应有合适的骨架。传统上，一级标题以大写字母显示。按传统顺序，最重要的一级标题包括：\n\
  \n- **NAME**——程序/库/其他内容的名称。\n- **SYNOPSIS**——用法简要示例。\n- **DESCRIPTION**——详细描述，必要时可分成若干节。\n\
  - **EXAMPLES**——展示如何使用。\n- **SEE ALSO**——对其他手册页等的引用。\n- **BUGS**——尚需完善之处。\n- **AUTHOR**——你的名字闪亮登场。\n\
  \n有关手册页布局的更多信息，请参阅 `pod2man` 文档。\n\n下载自 <www.wowebook.com>\n\n**292** ❘ *第 9 章 发行版*\
  \ **需要记住的要点**\n\n- POD 允许你将文档直接嵌入 Perl 代码中。\n- POD 段落有三种类型：填充文本、逐字文本和命令。\n- 使用人们期望的通用文档结构。\n\
  \n### 第 83 条 将发行版限制在正确的平台上。\n\n大多数情况下，你应努力使模块在任何操作系统和 Perl 版本上都有用，但有时这行不通。某些模块，例如\
  \ `Win32::Process`，只能在 Windows 上运行。也许你需要使用不向后兼容的 Perl 特性。尽早捕获不兼容问题，以便向用户提供良好的错误消息，告诉他们该怎么做。\n\
  \n如果你将作品上传到 CPAN，或使用 CPAN 工具链在内部发布，你的错误消息可以让工具知道发生了什么，从而做出适当响应。CPAN Testers 有一份作者指南（http://wiki.cpantesters.org/wiki/CPANAuthorNotes），可以为你提供帮助。\n\
  \nptg\n\n#### 使用正确的 Perl 版本\n\n`use` 关键字不仅仅用于加载库。如果你给它一个 Perl 版本号，它会要求运行该代码的 perl\
  \ 解释器版本大于或等于你指定的版本。如果你需要使用 Perl 5.10 的特性，请明确说明：`use 5.010;`\n\n当 perl 尝试编译该语句并发现版本不匹配时，它会停止编译。无论如何，你应该已经在\
  \ 5.10 代码中包含了这条语句，因为它会启用所有 5.10 的特性。`use` 的这种特性启用功能是 Perl 5.10 新增的。\n\n请记住，Perl\
  \ 版本在次版本和点版本中各使用三位数字。人们说“Perl 5 10 1”，可能会写成 Perl 5.10.1，但在 perl 内部，那是 5.010001。\n\
  \n如果你需要使用较早版本的 Perl，例如因为你需要某个仅适用于特定 perl 的外部库，请使用 `$]` 特殊变量。将检查放在 `BEGIN` 块中，以便程序尽早检查版本。\n\
  \n下载自 <www.wowebook.com>\n\n*第 83 条 将发行版限制在正确的平台上* ❘ **293**\n\n你可以检查特定的 Perl 版本：\n\
  \n```\nBEGIN {\n    die \"This is perl $], but you need 5.008005\"\n        unless\
  \ $] == 5.008005;\n}\n```\n\n你可以检查 Perl 版本必须小于某个版本，例如整个 5.10 系列：\n\n```\nBEGIN {\n\
  \    die \"This is perl $], but you need a version\"\n        . 'less than 5.010'\n\
  \        unless $] < 5.010;\n}\n```\n\n你可以检查 Perl 版本介于两个版本之间（包含两端）：\n\n```\nBEGIN\
  \ {\n    die \"This is perl $], but you need between \"\n        . '5.0006002 and\
  \ 5.008008'\n        unless $] >= 5.0006002 and $] <= 5.008008;\n}\n```\n\nptg\n\
  \n你也可以在代码内部这样做，以便根据 perl 版本让程序走不同路径或加载不同模块。\n\n如果你正在创建 `Makefile.PL` 或 `Build.PL`，可以将\
  \ Perl 版本指定为先决条件：\n\n```\n# For Build.PL\nmy $mb =\n    Module::Build->new( ...,\n\
  \        requires => { 'perl' => 5.008001, },\n    );\n\n# For Makefile.PL\nWriteMakefile(\
  \ ...,\n    MIN_PERL_VERSION => '5.010001',\n);\n```\n\n#### 检查操作系统\n\n如果你的代码仅适用于某些操作系统，你也可以进行检查。如果必须使用标准\
  \ Perl，你可以查看 `$OSNAME`（`$^O` 特殊变量的长版本：参见 `perlvar` 文档）：\n\n下载自 <www.wowebook.com>\n\
  \n**294** ❘ *第 9 章 发行版*\n\n```\nuse English qw($OSNAME);\ndie 'Unsupported OS: You\
  \ have $OSNAME but '\n    . \"I need Windows!\\n\"\n    unless $OSNAME eq 'MSWin32';\n\
  ```\n\n不过，使用 `Devel::CheckOS` 会更简单，因为它能识别操作系统的*家族*。前面的示例使用了一种需要你知道正确特殊字符串的技术，并且只代表一个操作系统。`Devel::CheckOS`\
  \ 的文档（http://search.cpan.org/~dcantrell/Devel-CheckOS-1.61/lib/Devel/CheckOS.pm）中对该变量的使用评价道：“`$^O`\
  \ 既愚蠢又丑陋，它把裤子当帽子戴”。\n\n```\nuse Devel::CheckOS qw(os_is);\ndie 'OS unsupported!\
  \ You need Windows to run '\n    . \"this program!\\n\"\n    unless os_is('MicrosoftWindows');\n\
