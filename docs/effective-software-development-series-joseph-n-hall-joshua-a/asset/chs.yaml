  \n下载自 <www.wowebook.com>\n\n## 第 11 条 想要元素时避免使用切片\n\n### 要点\n\n- 记住 `undef` 是一个标量值。\n\
  - 不要给数组赋值 `undef` 来清空它；这会产生一个单元素列表。\n- 使用 `exists` 检查键是否存在于哈希中；不要依赖其值。\n\n## 第 11\
  \ 条 想要元素时避免使用切片\n\n`@a[1]` 是数组元素还是数组切片？它是切片。刚开始学习 Perl 的人遇到的一个反直觉因素就是数组元素和数组切片的区别。即使你知道区别，也不难意外地输入\
  \ `@` 而不是 `$`。\n\n一本关于 Perl 的入门书籍或课程通常会告诉你，标量变量名以 `$` 开头，数组变量名以 `@` 开头。当然，这是一个过于简化的说法（第\
  \ 4 条）。\n\n要访问数组 `@a` 的第 `$n` 个元素，应使用语法 `$a[$n]`，而不是 `@a[$n]`。这看起来可能有些奇怪。然而，这是一种一致的语法。标量值（而非变量）以\
  \ `$` 开头，即使这些值来自数组或哈希。\n\nptg\n\n因此，`@a[$n]` 并不表示数组 `@a` 的第 `$n` 个元素。相反，它是另一种东西，称为**切片**。切片是一种同时访问多个元素的快捷方式。无需重复使用不同索引的同一变量：\n\
  \n```perl\nmy @giant = qw( fee fie foe fum );\nmy @queue = ( $giant[1], $giant[2]\
  \ );\n```\n\n你可以使用切片以更易读的方式完成相同任务：\n\n```perl\nmy @giant = qw( fee fie foe fum );\n\
  my @queue = @giant[ 1, 2 ];\n```\n\n你甚至可以使用数组来提供索引：\n\n```perl\nmy @fifo = ( 1,\
  \ 2 );\nmy @queue = @giant[ @fifo ];\n```\n\n现在，`@a[1]` 与 `@a[1, 2]`、`@a[2, 10]`、`@a[5,\
  \ 3, 1]`、`@a[3..7]` 等一样，都是切片：`@a[1]` 是一个列表，而不是标量值。它只是一个包含一个元素的列表。\n\n下载自 <www.wowebook.com>\n\
  \n**38** ❘ *第 1 章 Perl 基础* 注意单元素切片。如果使用不当，它们是危险的家伙。在标量上下文中使用的切片会返回切片中的最后一个值，这使得单元素切片在某些情况下表现得像标量值。\n\
  \n例如：\n\n```perl\nmy $jolly = @giant[3];\n```\n\n这里本意可能是 `my $jolly = $giant[3]`。单元素切片\
  \ `@giant[3]` 某种程度上仍然可以，因为在标量上下文中 `@giant[3]` 求值为其最后一个（此处也是唯一一个）元素 `$giant[3]`。\n\
  \n尽管单元素切片在赋值右侧的行为有点像数组元素，但在赋值左侧的行为却大不相同。由于单元素切片是一个列表，对单元素切片的赋值是列表赋值，因此赋值右侧在列表上下文中求值。\n\
  \n如果你启用了警告（为什么你不启用呢？第 99 条），Perl 会对此情况发出警告：\n\n```perl\nuse warnings;\nptg\nmy @giant\
  \ = qw( fee fie foe fum );\nmy $jolly = @giant[3];\n```\n\n虽然操作结果符合预期，将 \"fum\"\
  \ 赋值给了 `$jolly`，但原因并不正确。因此，你会收到一条警告消息，告诉你可能无意中使用了切片：`Scalar value @giant[3] better\
  \ written as $giant[3] at ...`\n\n### 左值切片\n\n切片具有赋值左侧变量名列表的所有特征。你甚至可以在赋值表达式的左侧使用它，或者在其他需要左值的地方使用。使用命名变量而不是切片作为左侧表达式看起来非常不同，但完成相同的任务：\n\
  \n```perl\n( $giant[1], $giant[2] ) = ( \"tweedle\", \"dee\" );\n@giant[ 1, 2 ]\
  \ = ( \"tweedle\", \"dee\" );\n```\n\n下载自 <www.wowebook.com>\n\n**39** ❘ *第 1 章\
  \ Perl 基础* 无意中在列表上下文中求值操作符可能会产生戏剧性（且不幸）的结果。一个很好的例子是行输入操作符，当赋值给切片或在列表上下文中赋值时，会导致立即读取整个\
  \ STDIN：\n\n```perl\n@info[0] = <STDIN>;\n( $info[0] ) = <STDIN>;\n```\n\n这会从标准输入读取所有行，将第一行赋值给\
  \ `@info` 的元素 0，并忽略其余行！将 `<STDIN>` 赋值给 `@info[0]` 会在列表上下文中求值 `<STDIN>`。在列表上下文中，`<STDIN>`\
  \ 会读取标准输入的所有行，并将它们作为列表返回。\n\n### 不要混淆切片和元素\n\n切片和元素之间的另一个区别是，元素访问的方括号中的表达式在标量上下文中求值，而切片则在列表上下文中求值。这导致了另一个更难以解释的怪异行为示例。\n\
  \n假设你想在数组 `@text` 的末尾添加一行包含 `'EOF'` 的内容。你可以写成 `$text[@text] = 'EOF'`。如果你写成 `@text[@text]`\
  \ 呢？你会犯一个严重错误，但看起来却非常无辜：\n\n```perl\nchomp( @text = <STDIN> );\n@text[@text] = 'EOF';\n\
  ```\n\nPerl 将方括号内的数组 `@text` 在列表上下文中解释。在标量上下文中，它返回 `@text` 中的元素个数，但在列表上下文中，它返回数组本身的内容。结果是一个包含与行数相同元素的切片。\n\
  \n这些行的内容被解释为整数索引——如果它们是文本，很可能全部变成零，因此切片看起来像 `@text[0, 0, 0, 0, 0, ...]`。然后 `EOF`\
  \ 被赋值给切片的第一个元素，其余元素被赋值为 `undef`，这意味着这很可能只是用 `undef` 覆盖了 `@text` 的第一个元素，其他元素保持不变。\n\
  \n真是一团糟！\n\n养成在程序中查找像 `@a[0]` 这样的单元素切片的习惯。单元素切片通常不是你想要的（尽管它们偶尔可用于技巧），而赋值左侧的单元素切片几乎肯定是错误的。`Perl::Critic`（第\
  \ 112 条）是一个可以帮助你找到这些情况的工具。\n\n### 切片的有趣和实用之处\n\n初学 Perl 的程序员通常不会（有意）使用切片，除非是从结果列表中选择元素：\n\
  \n```perl\nmy ( $uid, $gid ) = ( stat $file )[ 4, 5 ];\nmy $last = ( sort @list\
  \ )[-1];\nmy $field_two = ( split /:/ )[1];\n```\n\n然而，切片可以用于一些相当有趣（且奇怪）的用途。例如，这里有两种略有不同的方法来反转\
  \ `@list` 的第 5 到第 9 个元素：\n\n```perl\n@list[ 5 .. 9 ] = reverse @list[ 5 .. 9 ];\n\
  @list[ reverse 5 .. 9 ] = @list[ 5 .. 9 ];\n```\n\nptg\n\n切片提供了一种方便的方法来交换两个元素：\n\
  \n```perl\n@a[ $n, $m ] = @a[ $m, $n ];   # 交换 $a[$m] 和 $a[$n]\n@item{ 'old', 'new'\
  \ } =\n    @item{ 'new', 'old' };      # 交换 $item{old} 和 $item{new}\n```\n\n###\
  \ 使用切片重新排序数组\n\n切片也用于排序（第 22 条）。\n\n给定两个并行数组 `@uid` 和 `@name`，此示例根据 `@uid` 的数值内容对\
  \ `@name` 进行排序。排序对 `@name` 中的索引进行排序，使用该排序后的列表作为切片，然后将切片赋值回 `@name`：\n\n```perl\n\
  @name =\n    @name[ sort { $uid[$a] <=> $uid[$b] } 0 .. $#name ];\n```\n\n尽管这可行，但对同事来说并不是一件特别好的事情。\n\
  \n下载自 <www.wowebook.com>\n\n**41** ❘ *第 1 章 Perl 基础*\n\n### 快速轻松地创建哈希\n\n\n\n\n\
