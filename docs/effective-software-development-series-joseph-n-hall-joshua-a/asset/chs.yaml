  \n下载自 <www.wowebook.com>\n\n**86** ❘ *第 2 章 地道的 Perl*\n\n## 条目 24. 使用 given-when\
  \ 实现 switch 语句。\n\n几乎从 Perl 诞生以来，Perl 程序员就一直在抱怨 Perl 似乎唯一没有从 C 中偷来的东西：它的 switch\
  \ 语句。从 Perl 5.10 开始，Perl 不仅修复了这个问题，而且像大多数 Perl 事物一样，它让它变得好得多。\n\n### 减少输入\n\nPerl\
  \ 给 switch 起了一个新名字，称之为 `given-when`。与其大多数设计一样，Perl 考虑了人们如何相互交谈：“如果我被给予这个，当它是这个时，我就做这个。”你可能已经通过一系列\
  \ `if-elsif-else` 语句来做到这一点：\n\n```\nmy $dog = 'Spot';\nif ( $dog eq 'Fido' ) { ...\
  \ }\nelsif ( $dog eq 'Rover' ) { ... }\nelsif ( $dog eq 'Spot' ) { ... }\nelse {\
  \ ... }\n```\n\n你想测试 `$dog` 的不同可能性，然后在找到正确条件时运行一些代码。你必须为每个分支重复代码结构。对于像 Perl 这样的高级语言来说，这太麻烦了。相反，你可以使用\
  \ `given-when`，它为你处理了大部分输入：\n\n```\nuse 5.010;\ngiven ($dog) {\n    when ('Fido')\
  \ { ... }\n    when ('Rover') { ... }\n    when ('Spot') { ... }\n    default {\
  \ ... };\n};\n```\n\n这少了很多输入！Perl 为你处理了一些技巧。首先，它**主题化**了 `$dog`，这是 Perl 的说法，表示它将默认变量\
  \ `$_` 设置为 `$dog` 的值。这样，你就不必像第一个例子那样一遍又一遍地输入 `$dog`。其次，Perl 自动将主题 `$_` 与你提供的项进行比较。如果你喜欢做额外的工作，这和你自己做是一样的：\n\
  \n```\nuse 5.010;\ngiven ($dog) {\n    my $_ = $dog;\n    when ( $_ eq 'Fido' )\
  \ { ... }\n    when ( $_ eq 'Rover' ) { ... }\n    when ( $_ eq 'Spot' ) { ... }\n\
  \    default { ... };\n};\n```\n\n### 智能匹配\n\n`given-when` 结构比一连串的条件要强大得多。前面的例子使用了\
  \ `eq` 字符串比较。然而，在之前的例子中，Perl 是如何知道使用那个比较的呢？\n\n除非你在 `when` 中显式指定了比较，否则 Perl 实际上使用的是智能匹配\
  \ `~~`（条目 23）：\n\n```\nuse 5.010;\ngiven ($dog) {\n    when ( $_ ~~ 'Fido' ) { ...\
  \ }\n    when ( $_ ~~ 'Rover' ) { ... }\n    when ( $_ ~~ 'Spot' ) { ... }\n   \
  \ default { ... };\n};\n```\n\n智能匹配根据操作数的类型来决定如何比较它们。在这种情况下，Perl 看到标量变量 `$_` 和字面字符串\
  \ `'Fido'`。Perl 假设你想要字符串比较，并且它就这样做了。\n\n你可以在任何地方使用智能匹配，但当你没有指定自己的比较时，`when` 会使用它。\n\
  \n如果你在智能匹配中使用其他东西，你会得到不同的比较。*perlsyn* 文档有一个所有可能性的表格，但这里有一些有趣的例子：\n\n```\n$dog ~~\
  \ /$regex/    # $dog 匹配正则表达式\n$dog ~~ %Dogs       # $dog 是 %Dogs 中的一个键\n$dog ~~\
  \ @Dogs       # $dog 是 @Dogs 中的一个元素\n@Dogs ~~ /$regex/   # @Dogs 中的某个项匹配正则表达式\n\
  %Dogs ~~ /$regex/   # %Dogs 中的某个键匹配正则表达式\n```\n\n`when` 块增加了额外的魔法，假设左侧的操作数是主题 `$_`。这两者是相同的：\n\
  \n```\nwhen (RHS) { ... }\nwhen ( $_ ~~ RHS ) { ... }\n```\n\n### 多个分支\n\n默认情况下，当一个\
  \ `when` 块匹配时，就结束了。Perl 不会尝试任何其他 `when` 块。这正是你对 `if-elsif-else` 结构的期望。每个 `when`\
  \ 块的末尾有一个隐式的 `break`，告诉它跳出循环：\n\n```\nuse 5.010;\ngiven ($dog) {\n    when ('Fido')\
  \ { ...; break }\n    when ('Rover') { ...; break }\n    when ('Spot') { ...; break\
  \ }\n    default { ... };\n};\n```\n\n\n\n\n\n## 第 24 条 使用 `given-when` 实现 switch\
  \ 语句\n\n然而，借助 `continue`，你可以先执行一个 `when` 块，然后继续尝试下一个。在下面的例子中，你可以测试 `$dog` 中的名字是否匹配每个\
  \ `when`：\n\n```perl\nuse 5.010;\n\nmy $dog = 'Spot';\n\ngiven ($dog) {\n\nwhen\
  \ (/o/) { say '名字中包含字母\"o\"'; continue }\n\nwhen (/t/) { say '名字中包含字母\"t\"'; continue\
  \ }\n\nwhen (/d/) { say '名字中包含字母\"d\"'; continue }\n\n}\n```\n\n### 穿插代码\n\n`if-elsif-else`\
  \ 的另一个缺点是，你无法在条件之间插入中间代码。你必须先匹配一个条件，然后才能执行任何代码。而使用 `given-when`，你可以在 `when` 部分周围插入任意代码，包括修改主题变量的代码：\n\
  \n```perl\nuse 5.010;\n\nmy $dog = 'Spot';\n\ngiven ($dog) {\n\nsay \"我正在处理 [$_]\"\
  ;\n\nwhen (/o/) { say '名字中包含字母\"o\"'; continue }\n\nsay \"继续查找字母 t\";\n\nwhen (/t/)\
  \ { say '名字中包含字母\"t\"'; continue }\n\n$_ =~ tr/p/d/;\n\nwhen (/d/) { say '名字中包含字母\"\
  d\"'; continue }\n\n}\n```\n\n### 对列表进行切换\n\n你也可以在 `foreach` 循环中使用 `when`。它的作用与在\
  \ `given` 中相同，只不过你可以对输入列表中的每个元素尝试条件匹配：\n\n```perl\nuse 5.010;\n\nmy $count = 0;\n\
  \nforeach (@array) {\n\nwhen (/[aeiou]$/) { $vowels_count++ }\n\nwhen (/[^aeiou]$/)\
  \ { $count++ }\n\n}\n\nsay \"\\@array 中包含 $count 个以辅音结尾的单词和 $vowel_count 个以元音结尾的单词\"\
  ;\n```\n\n### 要点回顾\n\n- 如果你需要 switch 语句，请使用 `given-when`。\n- `when` 中的智能匹配运算符默认使用\
  \ `$_`。\n- 除了 `given`，你还可以在其他循环结构中使用 `when`。\n\n## 第 25 条 使用 `do {}` 创建内联子例程\n\n\
  `do {}` 语法允许你将多个语句组合成一个表达式。它有点像内联子例程。例如，要快速读取整个文件，你可以将输入记录分隔符 `$/`（第 43 条）局部化，用词法文件句柄（第\
  \ 52 条）打开文件，读取数据，并将其存储到标量中，所有这些都在一个块内完成：\n\n```perl\nmy $file = do {\n\nlocal $/;\n\
  \nopen my ($fh), '<', $filename or die;\n\n<$fh>;\n\n};\n```\n\n使用 `do` 块时，`local`\
  \ 和 `my` 的作用域仅限于该块；它们不会影响其他任何内容。最后一个求值的表达式 `<$fh>` 就是该块的返回值，就像传统子例程一样。你将这个值一次性赋值给\
  \ `$file`，而 `$file` 在块外声明，以获得合适的作用域。\n\n考虑一下不使用 `do {}` 的相同操作。你希望让某些变量在块内临时生效，但最终需要将内容带出块外。你必须额外做一些工作来赋值\
  \ `$file`，而且需要输入两次：\n\n```perl\nmy $file;\n\n{\n\nlocal $/;\n\nopen my ($fh), '<',\
  \ $filename or die;\n\n$file = join '', <$fh>;\n\n}\n```\n\n在仅用于设置正确值的 `if-elsif-else`\
  \ 链中，你可以节省一些代码。假设你需要选择千位分隔符和小数点分隔符的本地化设置。你可以声明一些变量，然后根据条件对这些变量进行赋值：\n\n```perl\n\
  my ( $thousands_sep, $decimal_sep );\n\nif ( $locale eq 'European' ) {\n\n( $thousands_sep,\
  \ $decimal_sep ) = qw( . , );\n\n}\n\nelsif ( $locale eq 'English' ) {\n\n( $thousands_sep,\
  \ $decimal_sep ) = qw( , . );\n\n}\n```\n\n这有点凌乱，因为你必须多次输入变量名，导致代码密集且掩盖了任务本身。使用\
  \ `do`，你可以利用最后一个求值表达式作为结果这一特性，从而省去多余的变量输入：\n\n```perl\nmy ( $thousands_sep, $decimal_sep\
  \ ) = do {\n\nif ( $locale eq 'European' ) { qw( . , ) }\n\nelsif ( $locale eq 'English'\
  \ ) { qw( , . ) }\n\n};\n```\n\n有时你可能想用 `do` 将一些错误处理移开，以降低其重要性。例如，如果你需要遍历一个文件列表，但不想因为无法打开某个文件而停止，你可以在\
  \ `open` 中捕获失败，并在 `or` 的右侧运行一个表达式：\n\n```perl\nforeach my $file (@files) {\n\nopen\
  \ my ($fh), '<', $file or do { warn ...; next };\n\n... 执行其他操作 ...;\n\n}\n```\n\n\
  如果你的 `do {}` 变得比几个语句更长，那么最好将其移入一个独立的子例程中，所以不要过度使用这个惯用法。\n\n`do` 还有另一种用法，尽管相当罕见。有时你希望在首次测试条件之前先执行\
  \ `while` 块。考虑提示用户输入一个字符串，并持续提示直到他们正确输入。你需要先获取他们的第一次输入才能进行测试，因此你会重复一些代码：\n\n```perl\n\
  print \"请输入 'hello': \";\n\nchomp( my $typed = <STDIN> );\n\nwhile ( $typed ne 'hello'\
  \ ) {\n\nprint \"请输入 'hello': \";\n\nchomp( $typed = <STDIN> );\n\n}\n```\n\n当你需要在检查条件之前先执行一些代码时，可以通过将\
  \ `while` 作为 `do {}` 的表达式修饰符来消除重复代码：\n\n```perl\nmy $typed;\n\ndo {\n\nprint \"\
  请输入 'hello': \";\n\nchomp( $typed = <STDIN> );\n\n} while ( $typed ne 'hello' );\n\
  ```\n\n你确实需要声明 `$typed`，这有点难看，但比之前的例子要好一些。\n\n### 要点回顾\n\n- `do` 块返回最后一个求值的表达式。\n\
  - 在任何可以使用表达式的地方都可以使用 `do`。\n- 利用 `do` 块的作用域来局部化变量。\n\n## 第 26 条 使用 `List::Util`\
  \ 和 `List::MoreUtils` 简化列表操作\n\n掌握 Perl 的关键之一在于知道如何处理列表。事实上，Mark Jason Dominus 在《高阶\
  \ Perl》的前言中提到，Perl 更像 Lisp 而不是 C。Perl 内置了 `map`、`grep` 和 `foreach` 等函数，你可以用它们来构建复杂的列表处理逻辑。有些列表操作非常常见，你可以使用\
  \ `List::Util` 或 `List::MoreUtils` 中快速、用 C 实现的版本来完成。\n\n### 快速找到最大值\n\n如果你需要找出列表中的最大数字，你可以很容易地用纯\
  \ Perl 实现：\n\n```perl\nmy @numbers = 0 .. 1000;\n\nmy $max = $numbers[0];\n\nforeach\
  \ (@numbers) {\n\n$max = $_ if $_ > $max;\n\n}\n```\n\n但在纯 Perl 中，这相对较慢。Perl 自带的\
  \ `List::Util` 模块提供了一个用 C 实现的 `max` 例程，可以为你完成这项工作：\n\n```perl\nuse List::Util qw(max);\n\
  \nmy $max_number = max( 0 .. 1000 );\n```\n\n`maxstr` 例程对字符串执行相同的操作：\n\n```perl\n\
  use List::Util qw(maxstr);\n\nmy $max_string = maxstr( qw( Fido Spot Rover ) );\n\
  ```\n\n类似地，你也可以用纯 Perl 轻松地对数字列表求和：\n\n```perl\nmy $sum = 0;\n\nforeach ( 1 .. 1000\
  \ ) {\n\n$sum += $_;\n\n}\n```\n\n但使用 `List::Util` 的 `sum` 更简单、更快：\n\n```perl\n\
  use List::Util qw(sum);\n\nmy $sum = sum( 1 .. 1000 );\n```\n\n### 归约列表\n\n还有另一种求和的方法。`List::Util`\
  \ 的 `reduce` 函数（同样用 C 实现）可以更快地为你完成这项工作，并且语法更优雅：\n\n```perl\nuse List::Util qw(reduce);\n\
  \nmy $sum = reduce { $a + $b } 1 .. 1000;\n```\n\n`reduce` 接受一个块，就像 `sort` 一样，但工作方式不同。它从输入列表中取出前两个元素，并将它们分别别名为\
  \ `$a` 和 `$b`。此时输入列表少了两个元素。`reduce` 将操作的结果（这里是加法）放回到输入列表的开头。然后重复这个过程，直到列表中只剩下一个元素，这个元素就是\
  \ `reduce` 的结果——在本例中，就是 `$sum`。\n\n了解了这一点，你可以设计出其他没有现成函数的归约操作，例如计算所有数字的乘积：\n\n```perl\n\
  my $product = reduce { $a * $b } 1 .. 1000;\n```\n\n### 判断是否有元素匹配\n\n\n\n\n\n# 第\
  \ 2 章 地道的 Perl\n\n## 第 26 条 使用 List::Util 和 List::MoreUtils 简化列表操作\n\n在纯 Perl 中，找出列表中*第一个*满足某个条件的元素相当繁琐。但判断*是否存在*某个元素满足条件却很容易。例如，你可以轻松检查\
  \ `@list` 中是否包含大于 1000 的元素：\n\n```\nmy $found_a_match = grep { $_ > 1000 } @list;\n\
  ```\n\n然而，如果 `@list` 有 1 亿个元素，而第一个元素就是 1001，上述代码仍然会检查每一个元素，即使你已经得到了答案。你可以通过自己终止循环来解决这个问题，但你真的想写那么多代码吗？\n\
  \n```\nmy $found_a_match = 0;\nforeach my $elem (@list) {\n    $found_a_match =\
  \ $elem if $elem > 1000;\n    last if $found_a_match;\n}\n```\n\n`List::Util` 的\
  \ `first` 例程为你完成了所有这些工作，并且还能告诉你该值是什么。它的优势在于一旦知道答案就会停止，无需扫描整个列表来检查是否有数字大于 1000：\n\
  \n```\nuse List::Util qw(first);\nmy $found_a_match = first { $_ > 1000 } @list;\n\
  ```\n\n在 `List::MoreUtils` 模块中（大多数情况下你需要从 CPAN 自行安装），还有一些额外的便捷函数：\n\n```\nuse List::MoreUtils\
  \ qw(any all none notall);\nmy $found_a_match = any { $_ > 1000 } @list;\nmy $all_greater\
  \ = all { $_ > 1000 } @list;\nmy $none_greater = none { $_ > 1000 } @list;\nmy $all_greater\
  \ = notall { $_ % 2 } @list;\n```\n\n### 同时遍历多个列表\n\n有时你有多个相互关联的列表，希望同时遍历它们。通常的做法是使用索引，这会在代码的核心逻辑周围包裹一些结构代码。如果你想创建一个新列表\
  \ `@c`，其中包含 `@a` 和 `@b` 对应元素之和，你可以遍历索引并累加每个数组中的对应值：\n\n```\nmy @a = (...);\nmy @b\
  \ = (...);\nmy @c;\nforeach my $i ( 0 .. $#list ) {\n    my ( $a, $b ) = ( $a[$i],\
  \ $b[$i] );\n    push @c, $a + $b;\n}\n```\n\n与其编写这些额外的代码来处理数组，不如使用 `List::MoreUtils`\
  \ 中的 `pairwise` 例程：\n\n```\nuse List::MoreUtils qw(pairwise);\nmy @c = pairwise\
  \ { $a + $b } @a, @b;\n```\n\n如果你只有两个数组，`pairwise` 例程很好用；但如果超过两个，你可以使用 `each_array`\
  \ 创建一个迭代器，虽然仍需一些工作，但依然更简单：\n\n```\nuse List::MoreUtils qw(each_array);\nmy $ea =\
  \ each_array( @a, @b, @c );\nmy @d;\nwhile ( my ( $a, $b, $c ) = $ea->() ) {\n \
  \   push @d, $a + $b + $c;\n}\n```\n\n### 合并数组\n\n如果你需要合并两个或多个数组，可以用复杂的方式实现，但 `List::MoreUtils`\
  \ 的 `mesh` 例程能让它变得简单：\n\n```\nuse List::MoreUtils qw(mesh);\nmy @odds = qw/1 3 5\
  \ 7 9/;\nmy @evens = qw/2 4 6 8 10/;\nmy @numbers = mesh @odds, @even; # 返回 1 2\
  \ 3 4 ...\n```\n\n### 还有更多\n\n你只看到了 `List::Util` 和 `List::MoreUtils` 模块能为你做的一部分事情，它们不仅能减少你输入的代码量，还能向其他程序员表明你的意图。请查阅它们的文档，了解这些模块还能为你做些什么。\n\
  \n### 要点\n\n- 使用 `List::Util` 和 `List::MoreUtils` 模块进行常见的列表操作。\n- 使用 `List::MoreUtils`\
  \ 的 `all`、`any`、`none` 或 `notall` 从列表中筛选元素。\n- 使用 `pairwise` 或 `each_array` 同时处理多个列表。\n\
  \n## 第 27 条 使用 autodie 简化错误处理\n\nPerl 的许多内置函数都是系统调用，可能因程序无法控制的原因而失败，因此你必须检查它们是否成功。例如，当你尝试打开文件时，必须确保\
  \ `open` 成功后才能使用文件句柄：\n\n```\nopen my ($fh), '<', $file\n    or die \"Could not\
  \ open $file: $!\";\n```\n\n所有的错误检查会让代码变得杂乱，但你不得不反复这样做。为了省去这些输入，你可以使用 `autodie`\
  \ 编译指令（从 Perl 5.10.1 开始内置，同时也在 CPAN 上，因此你可以自行安装）：\n\n```\nuse autodie;\nopen my\
  \ ($fh), '<', $file; # 自动为你 die\n```\n\n默认情况下，`autodie` 适用于它处理的所有函数，主要是所有与系统交互的内置函数。如果你只想让它应用于某些特定函数，可以告诉\
  \ `autodie` 只处理这些函数，或者处理某个组中的所有函数：\n\n```\nuse autodie qw(open close);      # 仅特定函数\n\
  use autodie qw(:filesys);        # 组中的所有函数\n```\n\n你也不必在整个文件中应用 `autodie`。它是一个词法编译指令，像\
  \ `strict` 一样，只在其作用域内生效：\n\n```\n{\n    use autodie;\n    open my ($fh), '<', $file;\
  \ # 自动为你 die\n}\n```\n\n或者，你可以在整个文件中应用 `autodie`，然后在某个作用域内关闭它：\n\n```\nuse autodie;\n\
  {\n    no autodie; # 在此作用域内恢复正常\n    chdir('/usr/local') or die \"Could not change\
  \ to $dir\";\n}\n```\n\n当 `autodie` 为你引发错误时，它会将 `$@`（`eval` 错误变量）设置为一个 `autodie::exception`\
  \ 对象的实例：\n\n```\nuse autodie;\neval { open my ($fh), '<', $file };\nmy $error =\
  \ $@; # 立即保存 $@，以防它发生变化\n```\n\n你可以查询错误以了解其来源。`autodie` 足够智能，能够对错误进行分类，因此你在处理它们时有一定的灵活性。`autodie::exception`\
  \ 对象知道如何处理智能匹配运算符（第 23 条），因此你可以构建一个从具体到通用的处理程序层次结构。你可以匹配特定的错误类型或错误类别（这些在 `autodie`\
  \ 文档中列出）：\n\n```\nuse 5.010;\nuse autodie;\neval { open my ($fh), '<', $file };\n\
  my $error = $@; # 立即保存 $@，以防它发生变化\ngiven ($error) {\n    when (undef) { say \"No\
  \ error\"; }\n    when ('open') { say \"Error from open\"; }\n    when (':io') {\
  \ say \"Non-open, IO error.\"; }\n    when (':all') { say \"All other autodie errors.\"\
  \ }\n    default { say \"Not an autodie error at all.\" };\n}\n```\n\n如果你没有 Perl\
  \ 5.10，则需要做更多工作来处理 `autodie` 错误：\n\n```\n# 来自 autodie 文档\nif ( $error and $error->isa('autodie::exception')\
  \ ) {\n    if ( $error->matches('open') ) {\n        print \"Error from open\\n\"\
  ;\n    }\n    if ( $error->matches(':io') ) {\n        print \"Non-open, IO error.\\\
  n\";\n    }\n}\nelsif ($error) { # 非 autodie 异常\n    ...;\n}\n```\n\n### 要点\n\n\
  - 使用 `autodie` 自动处理内置函数的错误。\n- 指定 `autodie` 的子集以限制其影响。\n- 使用 `eval` 捕获 `autodie`\
  \ 异常。\n\n# 3 正则表达式\n\nPerl 的正则表达式本身就是一门语言，而且这门语言几乎和 Perl 一样复杂，甚至可能更复杂。你不必使用所有功能，但正则表达式的一些特性会让你的生活轻松很多。本章将介绍其中一些更受欢迎的特性。\n\
  \n尽管 Perl 的正则表达式引擎包含许多优化以提高效率，但有时也很容易写出运行速度远低于预期的匹配和替换。效率可能不总是你的首要目标。事实上，在软件开发中，效率很少应该是你的首要目标。通常，程序员的首要任务是开发出充分、健壮且正确的解决方案。不过，时刻考虑效率也没有坏处。\n\
  \n现在 Perl 已经支持 Unicode，Perl 的正则表达式不仅处理字节，还处理字符和字素簇，拥有许多相关特性。不仅如此，正则表达式还可以处理字符属性。我们将大部分内容留到第\
  \ 8 章“Unicode”中讨论，因此你会在那里看到不少正则表达式的内容。\n\n\n\n\n\n## 第 28 条 了解正则表达式运算符的优先级\n\n正则表达式中的“表达式”一词，是因为正则表达式是使用类似于算术表达式的语法规则构建和解析的。正则表达式的用途截然不同，这是事实；但理解它们之间的相似性将帮助你编写更好的正则表达式，从而编写更好的\
  \ Perl 代码。\n\n正则表达式由原子和运算符组成。`原子`通常是单个字符的匹配。例如：\n\n```\na   # matches the letter\
  \ a\n\\$  # matches the character $\n```\n\n**99**\n\n下载自 <www.wowebook.com>\n\n\
  **100** ❘ *第 3 章 正则表达式*\n\n```\n\\n      # matches newline\n[a-z]   # matches a\
  \ lowercase letter\n.       # matches any character except \\n\n\\1      # arbitrary\
  \ length--backreference to 1st capture\n```\n\n还有一些特殊的“零宽度”原子。例如：\n\n```\n\\b  \
  \ # word boundary--transition from \\w to \\W\n^    # matches start of a string\n\
  \\A   # absolute beginning of string\n\\Z   # end of a string or newline at end\
  \ --\n     # might or might not be zero-width\n\\z   # absolute end of string with\
  \ nothing after it\n```\n\n原子通过正则表达式运算符进行修改或连接。\n\n与算术表达式一样，这些运算符之间存在优先级顺序。\n\n\
  ### 正则表达式优先级\n\n幸运的是，只有四个优先级级别。想象一下，如果像算术表达式那样有那么多级别会怎样！\n\n括号和其他分组运算符具有最高优先级。\n\
  \n表 3-1 展示了正则表达式运算符的优先级顺序。\n\n重复运算符与其参数紧密绑定，参数可以是单个原子或分组运算符：\n\n```\nab*c      #\
  \ matches ac, abc, abbc, abbbc, etc.\nabc*      # matches ab, abc, abcc, abccc,\
  \ etc.\nab(c)*    # same thing and capture the c\nab(?:c)*  # same thing but don't\
  \ capture the c\nabc{2,4}  # matches abcc, abccc, abcccc\n(abc)*    # matches empty\
  \ string, abc, abcabc, etc.\n```\n\n**表 3-1** 正则表达式运算符优先级，从高到低\n\n| 优先级 | 运算符 |\
  \ 描述 |\n|--------|--------|------|\n| 最高 | `() (?:)` 等 | 括号和其他分组 |\n| | `? + * {m,n}\
  \ +? ++` 等 | 重复 |\n| | `^ $ abc \\G \\b \\B [abc]` | 序列、字面字符、字符类、断言 |\n| 最低 | `a|b`\
  \ | 选择 |\n\n下载自 <www.wowebook.com>\n\n*第 28 条 了解正则表达式运算符的优先级* ❘ **101**\n\n将两个原子并排放置称为`序列`。序列是一种运算符，尽管它没有标点符号。为了说明这一点，假设序列实际上用圆点符号（•）表示。上面的例子将变成：\n\
  \n```\na•b*•c      # matches ac, abc, abbc, abbbc, etc.\na•b•c*      # matches ab,\
  \ abc, abcc, abccc, etc.\na•b•(c)*    # same thing and capture the c\na•b•(?:c)*\
  \  # same thing but don't capture the c\na•b•c{2,4}  # matches abcc, abccc, abcccc\n\
  (a•b•c)*    # matches empty string, abc, abcabc, etc.\n```\n\n现在运算符的优先级是否更明显了？\n\
  \n优先级表中的最后一项是选择。让我们继续使用“•”符号一会儿：\n\n```\ne•d|j•o       # matches ed or jo\n(e•d)|(j•o)\
  \   # same thing\ne•(d|j)•o     # matches edo or ejo\ne•d|j•o{1,3}  # matches ed,\
  \ jo, joo, jooo\n```\n\n像 `^` 和 `\\b` 这样的零宽度原子与其他原子的分组方式相同：\n\n```\n^e•d|j•o$  \
  \   # matches ed at beginning, jo at end\n^(e•d|j•o)$   # matches exactly ed or\
  \ jo\n```\n\n很容易忘记优先级。去除多余的括号是一项崇高的追求，尤其是在正则表达式中，但注意不要去除过多：\n\n```\n# who sent me\
  \ this email?\n/^Sender|From:\\s+(.*)/;   # WRONG! -- this would match:\n      \
  \                    # X-Not-Really-From: faker\n```\n\n该模式本意是匹配邮件头中的 `Sender:`\
  \ 和 `From:` 行，但实际上匹配了不同的内容。下面添加了一些括号以明确优先级：\n\n```\n/(^Sender)|(From:\\s+(.*))/;\n\
  ```\n\n添加一对括号，或者可能是非捕获括号 `(?:)`（第 32 条），可以解决这个问题：\n\n```\n# better, this time\n\
  /^(Sender|From):\\s+(.*)/;   # $1 contains Sender or From\n/^(?:Sender|From):\\\
  s+(.*)/; # $1 contains the data\n```\n\n下载自 <www.wowebook.com>\n\n**102** ❘ *第 3\
  \ 章 正则表达式*\n\n### 双引号插值\n\nPerl 正则表达式与双引号字符串一样，会受到相同的插值处理。变量名以及像 `\\U` 和 `\\Q` 这样的字符串转义不是正则表达式原子，也永远不会被正则表达式解析器看到。插值发生在\
  \ Perl 解析正则表达式之前的单次传递中：\n\n```\n/te(st)/;       # matches test in $_\n/\\Ute(st)/;\
  \     # matches TEST\n/\\Qte(st)/;     # matches te(st)\n$x = 'test';\n/$x*/;  \
  \        # matches tes, test, testt, etc.\n/test*/;        # same thing as above\n\
  ```\n\n双引号插值和单独的正则表达式解析阶段相结合，会产生许多常见的“陷阱”。例如，如果你忘记插值变量不是原子，可能会发生以下情况：\n\n```\n#\
  \ read in a pattern and match it twice\nchop( $pat = <STDIN> );          # for example,\
  \ bob\nprint \"matched\\n\" if /$pat{2}/;  # WRONG--/bob{2}/\nprint \"matched\\\
  n\" if /($pat){2}/;# CORRECT--/(bob){2}/\nprint \"matched\\n\" if /$pat$pat/; #\
  \ brute force way\n```\n\n在这个例子中，如果用户输入了 `bob`，第一个正则表达式将匹配 `bobb`，因为 `$pat` 的内容在正则表达式被解释之前就已经展开了。\n\
  \n上述三个正则表达式还有另一个潜在陷阱。假设用户输入了字符串 `hello :-)`。这将导致运行时致命错误。将此字符串插值到 `/($pat){2}/` 的结果是\
  \ `/(hello :-)){2}/`，除了毫无意义之外，括号还不平衡。Perl 会告诉你正则表达式错误的位置：`Unmatched ) in regex;\
  \ marked by <-- HERE in m/(hello :-)) <-- HERE {2}/`\n\n你可以使用 `qr//`（第 40 条）来捕获这个错误。\n\
  \n如果你不希望像括号、星号、句点等特殊字符被解释为正则表达式元字符，请使用 `quotemeta` 运算符或转义 `\\Q`。`quotemeta` 和 `\\\
  Q` 都会在任何不是字母、数字或下划线的字符前面加上反斜杠。\n\n在下面的代码中，你从标准输入读取一个字符串，对其进行引用，然后使用该字符串进行匹配。如果输入的字符串是\
  \ `hello :-)`，引用后它将变成 `hello\\ \\:\\-\\)`，从而可以安全地用于正则表达式匹配。\n\n```\nchomp( $pat\
  \ = <STDIN> );\nmy $quoted = quotemeta $pat;\nprint \"matched\\n\" if /($quotemeta){2}/;\n\
  ```\n\n或者，你可以在表达式本身中使用 `\\Q` 和 `\\E` 进行元字符引用：\n\n```\nchomp( $pat = <STDIN> );\n\
  print \"matched\\n\" if /(\\Q$pat\\E){2}/;\n```\n\n与正则表达式相关的几乎所有事情一样，元字符引用中的微小错误都可能导致奇怪的\
  \ bug：\n\n```\n# this actually means /hello \\ \\:\\-\\)\\{2\\}/--fatal error\n\
  print \"matched\\n\" if /(\\Q$pat){2}/;   # WRONG! no \\E\n```\n\n### 需要记住的事项\n\n\
  - 注意正则表达式的优先级。\n- 使用括号对正则表达式的部分进行分组。\n- 使用 `\\Q` 或 `quotemeta` 将元字符用作字面字符。\n\n##\
  \ 第 29 条 使用正则表达式捕获\n\n尽管正则表达式对于判断一个字符串是否看起来像某种模式很方便，但它们最大的用途在于帮助你解析字符串的内容。要使用正则表达式拆分字符串，你需要使用正则表达式捕获。\n\
  \n### 捕获变量：$1、$2、$3……\n\n大多数情况下，使用正则表达式进行解析涉及使用正则表达式捕获变量 `$1`、`$2`、`$3` 等。`捕获变量`与正则表达式中的括号相关联，也称为\n\
  \n下载自 <www.wowebook.com>\n\n\n\n\n\n# 第 3 章 正则表达式\n\n### 捕获缓冲区\n\n正则表达式中的每一对圆括号都会“捕获”其内容所匹配的部分，并将其“记忆”在一个捕获变量中。\n\
  \n例如，你可以解析一个 URL，将主机名与路径分开：\n\n```\n$_ = 'http://www.perl.org/index.html';\nif (m#^http://([^/]+)(.*)#)\
  \ {\n    print \"host = $1\\n\";   # www.perl.org\n    print \"path = $2\\n\"; \
  \  # /index.html\n}\n```\n\n只有成功的匹配才会影响捕获变量。不成功的匹配不会改变捕获变量，即使匹配的一部分看起来可能成功。继续前面的代码示例，一个新的不成功匹配会让\
  \ `$1` 和 `$2` 保持它们在以下表达式求值之前的值：\n\n```\n$_ = 'ftp://ftp.uu.net/pub/';\nif (m#^http://([^/]+)(.*)#)\
  \ {\n    print \"host = $1\\n\";   # 仍然是 www.perl.org\n    print \"path = $2\\n\"\
  ;   # 仍然是 /index.html\n}\n```\n\n当一对圆括号内的表达式匹配字符串中的多个不同位置时，对应的捕获变量包含最后一次匹配的内容：\n\
  \n```\n$_ = 'ftp://ftp.uu.net/pub/systems';\nif (m#^ftp://([^/]+)(/[^/]*)+#) {\n\
  \    print \"host = $1\\n\";      # ftp.uu.net\n    print \"fragment = $2\\n\";\
  \  # /systems\n}\n```\n\n捕获变量按照左括号的顺序分配，无论嵌套与否。在涉及嵌套括号的情况下，数左括号来确定特定括号组对应哪个捕获变量：\n\
  \n```\n$_ = 'ftp://ftp.uu.net/pub/systems';\nif (m#^ftp://([^/]+)((/[^/]*)+)#) {\n\
  \    print \"host = $1\\n\";      # ftp.uu.net\n    print \"path = $2\\n\";    \
  \  # /pub/systems\n    print \"fragment = $3\\n\";  # /systems\n}\n```\n\n“数左括号”规则适用于所有正则表达式，甚至包括涉及分支的情况：\n\
  \n```\n$_ = 'ftp://ftp.uu.net/pub';\nif (m#^((http)|(ftp)|(file)):#) {\n    print\
  \ \"protocol = $1\\n\";  # ftp\n    print \"http = $2\\n\";      # 空字符串\n    print\
  \ \"ftp = $3\\n\";       # ftp\n    print \"file = $4\\n\";      # 空字符串\n}\n```\n\
  \n特殊变量 `$+` 包含最后一个非空缓冲区的值：\n\n```\nprint \"\\$+ = $+\\n\";   # ftp，来自 $3\n```\n\n\
  还有更多的花样！捕获变量会被每个新作用域自动局部化。一个独特之处在于，这些局部化变量会从外部作用域复制值。这与通常的局部化变量重新初始化形成对比：\n\n```\n\
  $_ = 'ftp://ftp.uu.net/pub';\nif (m#^([^:]+)://(.*)#) {\n    print \"\\$1, \\$2\
  \ = $1, $2\\n\";   # ftp, ftp.uu.net/pub\n    {\n        # $1 和 $2 从外部开始取值\n   \
  \     print \"\\$1, \\$2 = $1, $2\\n\";   # ftp, ftp.uu.net/pub\n        if ( $2\
  \ =~ m#([^/]+)(.*)# ) {\n            print \"\\$1, \\$2 = $1, $2\\n\";   # ftp.uu.net,\
  \ /pub\n        }\n    }\n    # 退出块后，旧的 $1 和 $2 恢复\n    print \"\\$1, \\$2 = $1,\
  \ $2\\n\";   # ftp, ftp.uu.net/pub\n}\n```\n\n所使用的局部化机制是 `local`，而不是 `my`（第 43 条）。\n\
  \n### 编号反向引用\n\n正则表达式可以通过反向引用来使用捕获缓冲区。原子 `\\1`、`\\2`、`\\3` 等匹配对应缓冲区的内容。\n\n反向引用一个显而易见（但不一定有用）的应用是解决简单的单词谜题。例如，以下表达式匹配一个重复的单词字符：\n\
  \n```\n/(\\w)\\1/;\n```\n\n而以下表达式匹配两个或更多重复的单词字符：\n\n```\n/(\\w)\\1+/;\n```\n\n重要的是要数清楚嵌套括号的数量。例如，以下表达式匹配连续成对的重复单词字符，由于嵌套，必须反向引用\
  \ `\\2`：\n\n```\n/((\\w)\\2){2,}/;\n```\n\n你可以重复使用反向引用。以下示例查找同一个元音重复出现四次的情况。第一行展示了冗长的方式，以便看到重复的反向引用。第二行更符合习惯用法：\n\
  \n```\n/([aeiou]).*\\1.*\\1.*\\1/;\n/([aeiou])(.*\\1){3}/;\n```\n\n虽然你可能不常用到它们，但反向引用是一个强大的特性。有时它们可以方便地以简化的方式处理分隔符。你可以用它们找到匹配的引号：\n\
  \n```\nq/\"stuff\"/ =~ /(['\"]).*\\1/;\n```\n\n你可能不希望使用贪婪的正则表达式，因为那样会吃掉太多引号。非贪婪（第\
  \ 34 条）版本效果更好：\n\n```\nq/\"stuff\",\"more\"/ =~ /(['\"]).*?\\1/;\n```\n\n你甚至可以更花哨地处理转义引号：\n\
  \n```\nq/\"stuff\\\"more/ =~ /(['\"])(\\\\\\1|.)*?\\1/;\n```\n\n不幸的是，这种方法很快失效：你不能用它来匹配圆括号（即使不考虑嵌套），而且有更快的方法来处理嵌入的转义。\n\
  \n### 替换中的捕获\n\n捕获变量和匹配变量经常用于替换。替换字符串中的变量 `$1`、`$2`、`$&` 等指的是匹配部分中的捕获缓冲区，而不是来自之前的语句。了解这一点后，你可以执行诸如使用替换交换两个单词之类的功能：\n\
  \n```\ns/(\\S+)\\s+(\\S+)/$2 $1/;\n```\n\n尝试使用映射转义值的哈希进行简单的 HTML 实体转义：\n\n```\n\
  my %ent = { '&' => 'amp', '<' => 'lt', '>' => 'gt' };\n$html =~ s/([&<>])/&$ent{$1};/g;\n\
  ```\n\n你甚至可以使用替换来压缩单词，例如“缩写”新闻组名称：\n\n```\n$newsgroup =~ s/(\\w)\\w*/$1/g;\n```\n\
  \n在某些替换中，如果你关注要丢弃的内容而不是保留的内容，则不需要捕获变量。在以下两种消除前导空白的方法中，使用第二种版本，因为它做的工作更少：\n\n```\n\
  s/^\\s*(.*)/$1/;   # 浪费\ns/^\\s+//;         # 更好\n```\n\n你可以使用 `/e`（求值）选项来帮助解决一些棘手的问题，即需要在替换过程中计算替换字符串。这里，将所有不存在的文件名替换为“未找到”消息：\n\
  \n```\ns/(\\S+\\.txt)\\b/-e $1 ? $1 : \"<$1 not found>\"/ge;\n```\n\n使用 `/e` 的替换有时可以通过使用匹配分隔符以及可能的\
  \ `/x` 选项（第 37 条）来更易读地编写：\n\n```\ns{\n    (\\S+\\.txt)\\b   # 所有以 .txt 结尾的文件名\n\
  }{\n    -e $1 ? $1 : '<$1 not found>'\n}gex;\n```\n\n### 列表上下文中的匹配\n\n在列表上下文中，匹配运算符返回一个列表，其值对应于捕获缓冲区的内容。如果匹配不成功，匹配运算符返回一个空列表。这不会改变捕获变量的行为：`$1`、`$2`、`$3`\
  \ 等仍然照常设置。\n\n这是匹配运算符最有用的特性之一。它允许你一步完成扫描和拆分字符串。这使得诸如拆分 RFC 2822 头部之类的任务变得简单紧凑：\n\
  \n```\nmy ( $name, $value ) = /^([^:]*):\\s*(.*)/;\n```\n\n你可以选择性地返回所需内容。以下代码返回\
  \ `Subject:` 行，去掉任何 `Re:` 部分：\n\n```\nmy ( $bs, $subject ) = /^subject:\\s+(re:\\\
  s*)?(.*)/i;\n```\n\n结果可以被切片以仅提供你想要的信息：\n\n```\nmy $subject = (/^subject:\\s+(re:\\\
  s*)?(.*)/i)[1];\n```\n\n或者，你可以让 `Re:` 周围的圆括号变为非捕获：\n\n```\nmy ($subject) = /^subject:\\\
  s+(?:re:\\s*)?(.*)/i\n```\n\n在 `map` 中使用匹配更加简洁。这里用一行非常紧凑的代码提取日期：\n\n```\nmy ($date)\
  \ = map { /^Date:\\s+(.*)/ } @msg_hdr;\n```\n\n注意，失败的匹配返回空列表这一特性变得非常方便。\n\n### 使用正则表达式进行分词\n\
  \n**分词**（Tokenizing）一个字符串——将其划分为词法元素，如空白、数字、标识符、运算符等——为正则表达式捕获提供了一个有趣的应用。\n\n如果你在\
  \ Perl 中编写过（或尝试编写过）计算机语言解析器，你可能会发现 Perl 似乎缺少一些使任务更容易的特性。事实上，有时它可能看起来相当困难。\n\n\n\n\
  \n问题在于，当你对字符串进行“词法分析”时，你想要找出多个可能的模式中哪一个匹配字符串的开头。然而，Perl 擅长的是找出单个模式在字符串中的匹配位置。这两者并不能很好地相互映射。\n\
  \n以解析包含数字、括号以及运算符 `+`、`-`、`*` 和 `/` 的简单算术表达式为例。我们忽略空白字符，假设你已经预先将其替换掉了。\n\n一种解析算术的方法是通过一系列条件，每个条件将其匹配结果推入一个数组：\n\
  \n```\nmy @tokens;\n\nwhile ($_) {\n\nif (/^(\\d+)/) {\n\npush @tokens, 'num', $1;\n\
  \n}\n\nelsif (/^([+\\-\\/*()])/) {\n\npush @tokens, 'punct', $1;\n\n}\n\nelsif (/^([\\\
  d\\D])/) {\n\ndie \"invalid char $1 in input\";\n\n}\n\n$_ = substr( $_, length\
  \ $1 );\n\n}\n```\n\n这种方法虽然看起来丑陋，但效率还算不错。使用 `^` 锚定的正则表达式执行速度非常快，因为 Perl 只尝试在字符串开头进行匹配，而不是可能在每个位置都尝试。\n\
  \n然而，如果你开始向这样的词法分析器输入长字符串，它会因为末尾的 `substr` 操作而显著变慢。你可能会考虑用一个名为 `$pos` 的变量来跟踪当前起始位置，然后做类似这样的操作：\n\
  \n```\nif ( substr( $_, $pos ) =~ /^(\\d+)/ ) { ... }\n```\n\n这可能不会快多少，而且在短字符串上甚至可能更慢。\n\
  \n一种效果不错且不会因待词法分析文本长度而受到过度影响的方法，依赖于匹配运算符的 `/g` 选项在标量上下文中的行为。每次在标量上下文中执行 `/g` 匹配时，正则表达式引擎会从前一次匹配的结束位置之后开始寻找匹配。这允许你使用单个正则表达式，并且无需显式跟踪当前位置：\n\
  \n```\n# the m//g method\n\nwhile (\n\n/\n\n(\\d+) | # number\n\n([+\\-\\/*()])\
  \ | # punctuation\n\n(\\D) # something else\n\n/xg\n\n)\n\n{\n\nif ( $1 ne \"\"\
  \ ) {\n\npush @tok, 'num', $1;\n\n}\n\nelsif ( $2 ne \"\" ) {\n\npush @tok, 'punct',\
  \ $2;\n\n}\n\nelse {\n\ndie \"invalid char $3 in input\";\n\n}\n\n}\n```\n\n###\
  \ 要记住的事项\n\n- 仅在成功匹配后使用捕获变量。\n- 通过在列表上下文中使用匹配运算符来保存捕获列表。\n\n## 第 30 条：使用更精确的空白字符类。\n\
  \n空白是一个看似简单但充满陷阱的棘手话题。有水平空白，我们通常将其视为单词分隔符，以及各种使文本易于阅读的排版空白。\n\n类似地，我们对“行”的概念通常由某种垂直空白来定义。计算机并不特别关心行，程序之所以知道行，是因为它们根据程序决定的行分隔符将字符分组在一起。\n\
  \nPerl 的正则表达式有多种方式让你精确指定需要匹配的空白类型。\n\n### 水平空白\n\n在 Perl 5.10 之前，有两个预定义的字符类用于处理空白。`\\\
  s` 匹配所有空白，其补集 `\\S` 匹配所有非空白字符。由于这种宽泛的空白分类，如果你不注意，很容易无意中操作到你不想要的字符。假设你想将连续的空白替换为单个空格。你可能会尝试直接匹配\
  \ `\\s+`：\n\n```\nmy $string = <<'HERE';\n\nThis is a line\n\nThis is another line\n\
  \nAnd a final line\n\nHERE\n\n$string =~ s/\\s+/ /g;\n```\n\n由于行尾也是空白，你最终会将每个行尾替换为一个空格。结果不是四行单倍行距的单词，而是一行：\n\
  \n```\nThis is a line This is another line And a final line\n```\n\n为了避免这种情况，你可以精确指定你想要的字符：\n\
  \n```\n$string =~ s/[ \\t]+/ /g;\n```\n\n你可能会认为将所有空格和制表符替换为空格就能解决问题，但如果字符串包含 Unicode\
  \ 字符集中的其他几种水平空白字符呢？这种限制性的替换无法移除那些空格。\n\n从 Perl 5.10 开始，你可以使用 `\\h` 字符类来匹配任何水平空白：\n\
  \n```\nuse 5.010;\n\n$string =~ s/\\h+/ /g;\n```\n\n现在你可以折叠所有水平空白，同时保持行尾不变。\n\n\
  与 Perl 的其他字符类快捷方式一样，`\\h` 有一个相反的 `\\H`，它匹配所有非水平空白字符，包括垂直空白和所有非空白字符。\n\n### 垂直空白\n\
  \n就像有时你只想匹配水平空白一样，你可能也需要只匹配垂直空白。这包括回车、换行、换页、垂直制表符以及 Unicode 的行分隔符和段落分隔符。例如，如果你想检查字符串是否是多行字符串，你可以使用\
  \ `\\v` 匹配任何垂直空白：\n\n```\nuse 5.010;\n\nif ( $string =~ m/\\v/ ) {\n\nsay 'Found\
  \ a multiline string';\n\n}\n```\n\n无论分隔符是什么，要将多行字符串拆分为行，你可以在 `split` 模式中使用 `\\\
  v`：\n\n```\nmy @lines = split /\\v/, $multi_line_string;\n```\n\n`\\v` 的相反是 `\\\
  V`，它匹配所有非垂直空白，包括水平空白和所有非空白字符。\n\n### 任意行尾\n\n行尾是计算中一个长期令人烦恼的问题。有换行符和回车符。有些文件仅使用换行符来结束一行，有些文件则使用回车符后跟换行符。\n\
  \n许多网络协议也期望使用回车-换行对。Unicode 引入了额外的行尾字符。\n\n假设你的任务是处理任意行尾，甚至同时处理所有行尾。你可以匹配可选的回车后跟换行的序列，以便将每个行尾规范化为单个换行符：\n\
  \n```\n$string =~ s/(?:\\r?\\n)/\\n/g;\n```\n\n然而，这并不完全有效，因为 `\\r` 和 `\\n` 实际上是逻辑字符，不一定在每个系统上都映射到相同的位（Mac\
  \ Classic，说的就是你）。你可以将表达式改为使用字符类，以便匹配单个出现或两个连续出现的任一字符：\n\n```\n$string =~ s/[\\r\\\
  n]{1,2}/\\n/g;\n```\n\n然而，这可能会将本应结束两个独立行的 `\\n\\n` 变成一行。此外，它仍然无法处理 Unicode 行尾。\n\
  \n为了处理各种行尾，你可以使用一个相当复杂的正则表达式，其中包含一些你可能没想到是行尾的字符，例如垂直制表符 `0x0B` 和换页符 `0x0C`：\n\n\
  ```\n$string =~\n\ns/(?>\\x0D\\x0A?|[\\x0A-\\x0C\\x85\\x{2028}\\x{2029}])/\\n/g;\n\
  ```\n\nPerl 5.10 引入了 `\\R` 字符类，它做了同样的事情，而不需要你经历所有这些：\n\n```\nuse 5.010;\n\n$string\
  \ =~ s/\\R/\\n/g;\n```\n\n现在，你的每个行尾都只是一个换行符。\n\n### 非换行符\n\nPerl 5.12 引入了一个新的字符类快捷方式用于非换行符：`\\\
  N`。\n\n通常，你可以使用 `.` 匹配任何非换行符，例如：\n\n```\nif ( $string =~ m/(.+)/ ) { ... }\n```\n\
  \n然而，如果有人添加了 `/s` 标志，也许是在盲目地转换为“最佳实践”，那么 `.` 突然会匹配换行符，从而破坏你的代码：\n\n```\nif ( $string\
  \ =~ m/(.+)/xsm ) { ... } # BROKEN!\n```\n\n如果你知道只需要非换行符，你可以使用 `\\N` 显式匹配它们，而不是依赖\
  \ `/s` 的副作用：\n\n```\nuse 5.012;\n\nif ( $string =~ m/(\\N+)/ ) { ... }\n```\n\n\n\
  \n\n下载自 <www.wowebook.com>\n\n# 第 3 章 正则表达式\n\n`\\N` 的补集，奇怪的是，并不是一个字符类快捷方式。它只是 `\\\
  n`，即换行符。记住这一点，以备下次参加 Perl 琐事挑战。\n\n### 需要记住的要点\n\n- 使用 `\\h` 匹配水平空白。\n- 使用 `\\v`\
  \ 匹配垂直空白。\n- 使用 `\\N` 匹配非换行符。\n\n## 第 31 条 使用命名捕获来标记匹配结果\n\n如果你不必记住所有带编号的变量就能获取匹配到的字符串部分，那该多好啊？想想你不得不忍受的那些烦恼。例如，假设你写了一个正则表达式来匹配几个名字：\n\
  \n```perl\n$_ = 'Buster and Mimi';\nif (/(\\S+) and (\\S+)/) {\n    my ( $first,\
  \ $second ) = ( $1, $2 );\n    ...;\nptg\n}\n```\n\n后来需求变了，你不得不添加更多括号，但你忘记了编号变量的变化。这种事我们谁都遇到过：\n\
  \n```perl\n$_ = 'Buster or Mimi';\nif (/(\\S+) (and|or) (\\S+)/) {\n    my ( $first,\
  \ $second ) = ( $1, $2 ); # 哎呀！\n    ...;\n}\n```\n\n想象一下这个例子中又添加了几个捕获组的情况。\n\n\
  如果你不必记住哪个编号对应哪个捕获组呢？如果你使用的是 Perl 5.10 或更高版本，那你就走运了，因为你可以使用命名捕获语法。不再只是用括号，而是使用 `(?<LABEL>)`\
  \ 语法。你的匹配结果会出现在 `%+` 哈希中，标签作为键：\n\n```perl\nuse 5.010;\n$_ = 'Buster and Mimi';\n\
  if (/(?<first>\\S+) and (?<second>\\S+)/) {\n    my ( $first, $second ) = ( $+{first},\
  \ $+{second} );\n    ...;\n}\n```\n\n现在，如果你再添加一组括号，也不会出问题，因为匹配结果不依赖于顺序：\n\n```perl\n\
  use 5.010;\n$_ = 'Buster and Mimi';\nif (/(?<first>\\S+) (and|or) (?<second>\\S+)/)\
  \ {\n    my ( $first, $second ) = ( $+{first}, $+{second} );\n    ...;\n}\n```\n\
  \n这对反向引用也同样适用。不再使用 `\\1`、`\\2` 等，而是使用 `\\k<label>` 来引用命名捕获：\n\n```perl\nuse 5.010;\n\
  $_ = 'Buster and Buster';\nif (/(?<first>\\S+) (and|or) \\k<first>/) {\n    say\
  \ '我找到了同一个名字两次！';\n}\n```\n\n即使你给其中一些捕获组起了名字，Perl 仍然会在编号变量中跟踪它们，因此匹配后你可以使用任意一种方式。\n\
  \nPerl 5.10 还引入了相对反向引用，这样你就不必记住每个捕获组的绝对位置了。使用 `\\g`，你可以指定你想要捕获组的绝对编号：\n\n```perl\n\
  if (/(?<first>\\S+) (and|or) \\g1/) {\n    say '我找到了同一个名字两次！';\n}\n```\n\n在这种情况下，你仍然需要数一下捕获组的数量，以确保你得到了正确的那个。更好的做法是使用相对反向引用。如果你知道想要的匹配结果位于两个捕获组之前，你可以使用负数来引用它的位置，不过你需要用花括号把数字括起来：\n\
  \n```perl\nif (/(?<first>\\S+) (and|or) \\g{-2}/) {\n    say '我找到了同一个名字两次！';\n}\n\
  ```\n\n### 需要记住的要点\n\n- 从 Perl 5.10 开始，你可以为捕获组命名。\n- 在 `%+` 哈希中查找你命名的捕获结果。\n- 使用相对反向引用，避免计算绝对捕获位置。\n\
  \n## 第 32 条 当你只需要分组时，使用非捕获括号\n\nPerl 正则表达式中的括号有两个不同的用途：分组和捕获。虽然这通常很方便，或者至少无关紧要，但有时也会碍事。例如，如果你想匹配电子邮件的\
  \ `Subject:` 行，忽略可能的回复前缀，你可能会使用两组括号：\n\n```perl\nmy ( $bs, $subject ) = /^subject:\\\
  s+(re:\\s*)?(.*)/i\n```\n\n你需要第一组括号来进行分组（这样 `?` 才能正确工作），但它们却碍事，从捕获的角度看。你希望的是能够分组而不产生捕获。\n\
  \nPerl 为此提供了一个特性。无捕获括号 `(?:)` 像括号一样分组，但不会创建反向引用或捕获变量。如果你只是用括号进行分组，你不需要括号匹配内容的副本。通过使用\
  \ Perl 的无捕获括号，你可以节省制作副本所需的时间：\n\n```perl\nmy ($subject) = /^subject:\\s+(?:re:\\\
  s*)?(.*)/i;\n```\n\n有些模式会使用嵌套括号，比如当你尝试用 `(\\w+(\\.\\w+)*)` 匹配主机名时。在这个模式中，记住内层括号的内容毫无意义，所以如果你想节省一点时间，就使用无捕获括号：\n\
  \n```perl\nmy ($host) = m/(\\w+(?:\\.\\w+)*)/;\n```\n\n节省的时间通常并不多，除非括号匹配了大段文本，而且无捕获括号并不会提高可读性。但有时，每一点速度提升都有帮助。要了解具体有多少，请对你的正则表达式进行基准测试（第\
  \ 41 条）。\n\n无捕获括号在 map 内部匹配的结构中也很有用，你在列表上下文中使用匹配，这样它会返回一个捕获列表：\n\n```perl\nmy @subjects\
  \ =\n    map { /^subject:\\s+(?:re:\\s*)?(.*)/i } @headers;\n```\n\n你还可以使用无捕获括号来禁用\
  \ `split` 中的**分隔符保留模式**。通常，你给 `split` 的模式中的捕获也会出现在输出列表中：\n\n```perl\nmy $string\
  \ = '1:2:3:4';\nmy @items = split /(:)/, $string;\n```\n\n在分隔符保留模式下，你也会得到捕获。在这个例子中，`@items`\
  \ 现在包含列表 `qw(1 : 2 : 3 : 4)`，包括数字和冒号。当你想知道元素之间是什么时，这可能很有用，但更多时候这是一个错误。\n\n假设你想用\
  \ `:` 或 `;` 来分割字符串，它们周围可能有可选的空白。你必须使用括号来隔离 `,|;`，这样你才能修剪两边的空白：\n\n```perl\nmy $string\
  \ = '1:2; 3: 4 ;5';\nmy @items = split /\\s*(,|;)\\s*/, $string;\n```\n\n你可能并不想保留这些分隔符，但现在你却有了它们！哎呀。要把它们从输出列表中排除，请使用非捕获括号：\n\
  \n```perl\nmy @items = split /\\s*(?:,|;)\\s*/, $string;\n```\n\n### 需要记住的要点\n\n\
  - 当你只需要分组元素时，使用非捕获括号。\n- 在 `split` 中使用非捕获括号，以避免分隔符保留模式。\n\n## 第 33 条 注意匹配变量\n\n\
  匹配变量（`` $` ``、`$&` 和 `$'`）会给你的 Perl 程序带来速度惩罚，因为它们会导致 Perl 执行一些额外的簿记工作。在一次成功匹配后，它们分别表示字符串中匹配之前的部分、匹配的部分以及匹配之后的部分：\n\
  \n```perl\n'My cat is Buster Bean' =~ m/Buster/;\nprint <<\"HERE\";\nPrematch: $`\n\
  match: $&\nPostmatch: $'\nHERE\n```\n\n在输出中，你会看到匹配周围的字符串部分：\n\n```\nPrematch: My\
  \ cat is\nmatch: Buster\nPostmatch: Bean\n```\n\n当你需要计算替换字符串时，匹配变量可以帮助进行文本操作。例如，假设你想替换\
  \ HTML 注释：\n\n```perl\n# 替换某些 HTML 注释\nwhile (<OLD>) {\n    if ( /<!--\\s*(.*?)\\\
  s*-->/ and ok_to_replace($1) ) {\n        $_ = $` . html_data($1) . $';\n    }\n\
  \    print NEW $_;\n}\n```\n\n### 性能问题\n\n有些人抱怨使用匹配变量会使 Perl 程序运行得更慢。这是真的——他们确实在抱怨。\n\
  \n但匹配变量确实会带来性能问题。它们可能对某个特定的匹配有用，但只要 Perl 在源代码中的任何地方看到这些变量之一，它就会开启记住这些部分所需的特殊记账功能，并且会对每一次匹配都这样做，无论你是否需要。这种额外的工作会显著降低你的程序速度。\n\
  \n```perl\n'My cat is Buster Bean' =~ m/Buster/;\nprint \"I matched $&\\n\";\nwhile\
  \ (<>) {\n    next unless /Bean/; # 每次匹配都有性能惩罚！\n}\n```\n\n## 第 34 条 当节俭最佳时，避免贪婪\n\
  \n（注：原文在第 34 条处突然结束，内容不完整。提供的文本只到第 33 条，末尾有一个“第 34 条”标题。由于第 34 条的完整内容缺失，我们只包含给出的部分。）\n\
  \n下载自 <www.wowebook.com>\n\n\n\n\n即使你无意使用这些变量，也可能会得到它们。\n\n例如，提供与 Perl 特殊变量等效的长名称的\
  \ `English` 模块使用了 `$``、`$&` 和 `$'`。仅仅加载该模块就足以触发问题：\n\n```\nuse English; # 哎呀！现在所有操作都变慢了\n\
  ```\n\n当你使用该模块时，可以告诉它不要处理这些匹配变量：`use English qw(-no_match_vars);`\n\n### 使用 `/p`\
  \ 标志\n\nPerl 5.10 引入了一种新方法，可以完成相同的事情，但只将其应用于一个匹配操作符，而不是所有操作符。当你对匹配操作符使用 `/p` 时，Perl\
  \ 会设置 `${^PREMATCH}`、`${^MATCH}` 和 `${^POSTMATCH}` 变量，但仅针对该次匹配。你不会遭受全局性能损失：\n\n\
  ```\nuse 5.010;\n\n'My cat is Buster Bean' =~ m/\\s\\w+\\sBean/p;\n\nsay \"I matched\
  \ ${^MATCH}\";\n\nwhile (<>) {\n    next unless /Bean/; # 没有性能损失！\n}\n```\n\n###\
  \ 需要记住的事项\n\n- 避免使用匹配变量，它们会降低性能。\n- 使用 `English` 模块时，不要意外地使用匹配变量。\n- 在 Perl 5.10\
  \ 中，使用 `/p` 标志启用每次匹配的变量。\n\n## 第 34 条：当节俭最佳时，避免贪婪。\n\n**贪婪** 并非指金钱，至少在正则表达式方面不是。它是用来描述大多数正则表达式引擎（包括\
  \ Perl 的）匹配行为的术语。一般规则是，Perl 正则表达式会在字符串中第一个能找到任何长度匹配的位置，返回“最左最长”的匹配。像 `*` 和 `+` 这样的重复操作符会“吞噬”字符串中的字符，直到匹配更多字符导致匹配失败：\n\
  \n```\n$_ = \"Greetings, planet Earth!\\n\";\n\n/\\w+/;   # 匹配 Greetings\n/\\w*/;\
  \   # 匹配 Greetings\n/n[et]*/; # 匹配 Greetings 中的 n\n/n[et]+/; # 匹配 planet 中的 net\n\
  /G.*t/;  # 匹配 Greetings, planet Eart\n```\n\n这通常是期望的行为，但并非总是如此。如果你只想匹配单引号之间的文本呢？在这个例子中，你匹配了太多内容：\n\
  \n```\n# 匹配单引号字符串——不对！\n$_ = \"This 'test' isn't successful?\";\nmy ($str) = /('.*')/;\
  \   # 匹配 \"test' isn\"\n```\n\nPerl 会继续匹配，超出你认为的模式结束位置。但实际上并非如此：`.` 匹配了 `'` 字符，直到最后一个\
  \ `'` 出现。\n\n你可以通过从匹配字符串内允许的字符中排除单引号来修复单引号字符串的例子：\n\n```\n# 匹配单引号字符串，老式方法\n$_ =\
  \ \"This 'test' isn't successful?\";\nmy ($str) = /('[^']*')/;   # 匹配 'test'\n```\n\
  \n幸运的是，Perl 有非贪婪的重复操作符。这是一个强大且非常有用的特性，它允许你为以前需要复杂甚至不可能实现的正则表达式的情况编写简单的正则表达式。\n\n\
  你可以通过在重复操作符（`*`、`+`、`{m,n}`）后面加上问号（`?`）使其变为**非贪婪**。然后该操作符将匹配导致模式匹配的最短字符串，而不是最长的。这使得上面的例子变得非常简单：\n\
  \n```\n# 匹配单引号字符串，非贪婪方式\n$_ = \"This 'test' isn't successful?\";\nmy ($str) = /('.*?')/;\
  \   # 匹配 'test'\n```\n\n现在你可以尝试更复杂的操作，比如匹配一个包含字符转义的双引号字符串（让我们支持 `\\\"`、`\\\\` 和\
  \ `\\123`）：\n\n```\n# 一个双引号字符串\n$_ = 'a \"double-quoted \\\"string\\042\"';\nmy\
  \ ($str) = /(\"(\\\\[\"\\\\]|\\\\\\d{1,3}|.)*?\")/;\nprint $str;   # \"double-quoted\
  \ \\\"string\\042\"\n```\n\n非贪婪匹配的唯一问题是它可能有点慢。不要不必要地使用非贪婪操作符，但要用它们来避免编写可能无法正确工作的复杂正则表达式。\n\
  \n### 需要记住的事项\n\n- 记住 Perl 的量词会匹配它们能匹配的最长字符串。\n- 避免编写匹配超出你意图的模式。\n- 使用 `?` 使你的量词变为非贪婪。\n\
  \n## 第 35 条：使用零宽断言匹配字符串中的位置。\n\n有时你需要匹配字符串中的一个条件，而不是字符。你可以匹配单词边界、字符串的开头或结尾，或者字符串中行的开头或结尾。Perl\
  \ 的正则表达式有**锚点**，可以将匹配约束到这些位置。这些锚点也称为**零宽断言**，因为它们指定了一个条件，但不消耗任何字符。\n\n### 使用 `\\\
  b` 匹配单词边界\n\n考虑以下模式匹配，它想从 `who` 命令的输出中提取用户名和终端：\n\n```\n# 起初看起来无害……\nmy @who = `who`;\n\
  $_ = pop @who;\nmy ( $user, $tty ) = /(\\w+)\\s+(\\w+)/;\n```\n\n这在像 `joebloe ttyp0\
  \ ...` 这样的输入上工作正常，但在像 `webmaster-1 ttyp1 ...` 这样的字符串上根本不会匹配，并且在 `joebloe pts/10`\
  \ 上会返回奇怪的结果。你可能应该匹配任何非空白字符：\n\n```\nmy ( $user, $tty ) = /(\\S+)\\s+(\\S+)/;\n```\n\
  \n如果你的正则表达式中 `\\w` 紧邻 `\\s`，或者 `\\W` 紧邻 `\\S`，那么很可能有问题。至少，你应该非常仔细地检查这样的正则表达式。\n\n\
  另一个需要注意的是包含标点字符的“单词”。假设你想在文本字符串中搜索一个完整的单词：\n\n```\nprint \"输入要搜索的单词：\";\nmy $word\
  \ = <STDIN>;\nprint \"找到\\n\" if $text =~ /\\b\\Q$word\\E\\b/;\n```\n\n这对于像 `hacker`\
  \ 甚至 `Perl5-Porter` 这样的输入工作正常，但对于像 `goin'` 这样的单词，或者任何不以 `\\w` 字符开头和结尾的单词，则会失败。如果\
  \ `$text` 包含 `isn't`，它也会将 `isn` 视为可匹配的单词。`\\b` 匹配 `\\w` 和 `\\W` 字符之间的转换——而不是 `\\\
  s` 和 `\\S` 字符之间的转换。如果你想支持搜索由空白分隔的单词，你必须这样写：\n\n```\nprint \"输入要搜索的单词：\";\nmy $word\
  \ = <STDIN>;\nprint \"找到\\n\" if $text =~ /(^|\\s)\\Q$word\\E($|\\s)/;\n```\n\n\
  单词边界锚点 `\\b` 及其逆操作 `\\B` 是零宽断言。它们不是唯一的零宽断言（`^`、`\\A` 等是其他的），但它们是最容易出错的。如果你不确定 `\\\
  b` 和 `\\B` 会在你的字符串中匹配什么，可以尝试替换它们：\n\n```\nmy $text = q(What's a \"word\" boundary?);\n\
  ( my $btext = $text ) =~ s/\\b/:/g;\n( my $Btext = $text ) =~ s/\\B/:/g;\nprint\
  \ \"$btext\\n$Btext\\n\";\n```\n\n当你运行该程序时，你会看到 Perl 认为每个单词边界处都有一个冒号：\n\n```\n%\
  \ tryme\n:What:':s:\n:a: \":word:\" :boundary:?\nW:h:a:t's a :\"w:o:r:d\": b:o:u:n:d:a:r:y?:\n\
  ```\n\n字符串两端的结果尤其值得注意。注意，如果字符串的最后一个（或第一个）字符不是 `\\w` 字符，那么字符串末尾就没有单词边界。字符串的开头和结尾是虚拟的非单词字符。还要注意，连续的\
  \ `\\W` 字符（如空格和双引号）之间以及连续的 `\\w` 字符之间都没有单词边界。\n\n### 使用 `^` 或 `\\A` 匹配开头\n\n`^`\
  \ 锚点通常匹配字符串的开头。许多人错误地认为它是“行首”锚点，因为他们只在单行字符串上使用它。这个正则表达式只会匹配第一个单词，即使它带有 `/g` 标志：\n\
  \n```\nmy $string = <<'HERE';\nThis is a line\nThat is another line\nAnd a final\
  \ line\nHERE\n\nmy (@matches) = $string =~ m/^(\\w+)/g;   # 只有 'This'\nprint \"\
  @matches\\n\";\n```\n\n输出显示你只进行了一次匹配：\n\n```\nThis\n```\n\n\n\n如果你想匹配所有行的第一个单词，可以使用\
  \ `/m` 标志开启多行模式。`/m` 会改变 `^` 锚点的行为，使其匹配字符串开头或行结尾之后的位置：\n\n```\nmy (@matches) = $string\
  \ =~ m/^(\\w+)/mg;\n```\n\n现在输出显示了所有行开头的单词：This That And\n\n在多行模式下，如果你只想匹配字符串的开头，请使用\
  \ `\\A` 锚点。在下面的例子中，你匹配的是字符串开头以 `T` 开头的单词，或者任何其他行开头不以 `T` 开头的单词：\n\n```\nmy (@matches)\
  \ = $string =~ m/\n( # $1 开始\n(?: # 非捕获括号\n\\A T # 字符串开头后跟 T\n| # --或--\n^ [^T]\
  \ # 行开头且不是 T\n)\n\\w+ # 单词的剩余部分\n) # $1 结束\n/xmg;\n```\n\n输出显示只匹配了两个单词，每个锚点类型各一个：This\
  \ And\n\n你还可以利用行开头锚点做一些更巧妙的事情，例如通过从 here 文档中每行匹配两个字段来初始化 `%scores` 哈希：\n\n```\n\
  my %scores = <<'EOF' =~ /^(.*?):\\s*(.*)/mg;\nfred: 205\nbarney: 195\ndino: 30\n\
  EOF\n```\n\n## 使用 `$` 或 `\\Z` 匹配结尾\n\n`$` 通常匹配字符串的结尾，但会为末尾可能存在的换行符留出余地：\n\n```\n\
  if ( \"some text\\n\" =~ /text$/ ) {\n    print \"Matched 'text'\\n\";\n}\n```\n\
  \n上面的例子匹配成功，就好像换行符不存在一样。如果字符串中没有换行符，它仍然有效：\n\n```\nif ( \"some text\" =~ /text$/\
  \ ) {\n    print \"Matched 'text'\\n\";\n}\n```\n\n然而，如果你真正想要的是字符串的绝对结尾，你需要明确指定，也许使用负向先行断言来确保末尾没有换行符：\n\
  \n```\nif ( \"some text\\n\" =~ /text(?!\\n)$/ ) { # 失败\n    print \"Matched 'text'\\\
  n\";\n}\n```\n\n这里，`(?!\\n)` 确保 `$` 之后没有换行符，这足以强制 `$` 具有字符串结尾的含义。\n\n不过，你不需要这么麻烦，因为\
  \ `\\z` 锚点也能达到同样的效果。下面的匹配会失败，因为 `text` 后面有换行符，所以 `text` 不在字符串的绝对结尾：\n\n```\nif (\
  \ \"some text\\n\" =~ /text\\z/ ) { # 失败\n    print \"Matched 'text'\\n\";\n}\n\
  ```\n\n你也可以使用 `\\Z` 锚点，它匹配字符串的结尾，但也允许可能存在的换行符，就像 `$` 一样。下面的字符串匹配成功，因为 `\\Z` 可以忽略换行符：\n\
  \n```\nif ( \"some text\\n\" =~ /text\\Z/m ) { # 再次成功\n    print \"Matched 'text'\\\
  n\";\n}\n```\n\n通过在正则表达式中添加 `/m` 后缀，`$` 也可以匹配中间换行符之前的位置：\n\n```\nprint \"fred\\\
  nquit\\ndoor\\n\" =~ /(..)$/mg;\n```\n\n上面的例子和下面的例子都会输出 `editor`（每行的最后两个字符）：\n\n\
  ```\nprint \"fred\\nquit\\ndoor\" =~ /(..)$/mg; # 相同\n```\n\n### 需要记住的事项\n\n- 使用\
  \ `\\b` 匹配单词字符和非单词字符之间的边界。\n- 使用 `\\A` 或 `\\z` 匹配字符串的绝对开头或结尾。\n- 使用 `^` 或 `$` 在多行模式下匹配每一行的开头或结尾。\n\
  \n## 第 36 条：避免对简单的字符串操作使用正则表达式\n\n正则表达式很强大，但它们并不是执行所有字符串操作的最高效方式。虽然正则表达式可用于执行提取子串或转换字符等字符串操作，但它们更适合更复杂的操作。Perl\
  \ 中的简单字符串操作应由专用运算符处理，例如 `index`、`rindex`、`substr` 和 `tr///`。\n\n请记住，所有正则表达式匹配，即使是简单的匹配，都必须操作捕获变量。如果你只需要比较或子串，操作捕获变量就是浪费时间。因此，即使没有其他原因，只要可能，你也应该优先使用专用字符串运算符而不是正则表达式匹配。\n\
  \n### 使用字符串比较运算符比较字符串\n\n如果你要比较两个字符串是否相等，请使用字符串比较运算符，而不是正则表达式：\n\n```\n# 快速方式\n\
  if ( $answer eq 'yes' ) { something_wonderful() }\n```\n\n字符串比较运算符至少比正则表达式匹配快两倍，尤其是在你不使用锚点的情况下：\n\
  \n```\n# 慢速方式\nif ( $answer =~ /^yes$/ ) { something_wonderful() }\n```\n\n```\n\
  # 没有锚点更慢（而且可能错误）\nif ( $answer =~ /yes/ ) { something_wonderful() }\n```\n\n一些更复杂的比较如果避免使用正则表达式也会更快。例如，你不需要仅仅为了不区分大小写而使用正则表达式：\n\
  \n```\n# 这个更快 ...\nif ( lc($answer) eq 'yes' ) { something_wonderful() }\n```\n\n\
  ```\n# ... 比这个快\nif ( $answer =~ /^yes$/i ) { something_wonderful() }\n```\n\n###\
  \ 使用 `index` 和 `rindex` 查找子串\n\n`index` 运算符在较长的字符串中定位较短字符串的出现位置。`rindex` 运算符定位最右边的出现位置，但仍然从左开始计算字符位置：\n\
  \n```\n# 在 $big_str 中查找 $little_str 的位置，从 0 开始\nmy $pos = index $big_str, $little_str;\n\
  \n# 在 $big_str 中查找最右边的 $little_str\nmy $pos = rindex $big_str, $little_str;\n```\n\
  \n`index` 运算符非常快——它使用 Boyer-Moore 算法进行搜索。Perl 也会将类似 index 的正则表达式编译成 Boyer-Moore\
  \ 搜索。你可以使用匹配运算符，然后查看 `$'`（匹配前的字符串部分）的长度（尽管匹配运算符会更慢）：\n\n```\n$big_str =~ /\\Q$little_str/;\
  \ # 不要这样做\nmy $pos = length $';\n```\n\n```\n# 是的，pos 运算符确实有用；但仍然很慢\n$big_str =~\
  \ /\\Q$little_str/g; # 或者 /og，也许\nmy $pos = pos($big_str) - length($big_str);\n\
  ```\n\n使用正则表达式匹配带来的开销使得 `index` 对于短字符串比 `m//` 快几倍，即使匹配使用了 `/o` 选项。\n\n### 使用 `substr`\
  \ 提取和修改子串\n\n`substr` 运算符根据给定的起始位置和长度提取字符串的一部分。如果没有提供长度，则提取字符串的剩余部分。\n\n```\n# 提取\
  \ \"Perl\"\nmy $perl = substr \"It's a Perl World\", 7, 4;\n\n# 提取 \"Perl World\"\
  \nmy $perl_world = substr \"It's a Perl World\", 7;\n```\n\n`substr` 运算符比执行相同操作的正则表达式快得多：\n\
  \n```\n# 慢速方式\nmy ($perl) = ( \"It's a Perl World\" =~ /^.{7}(.{4})/ );\n```\n\n\
  `substr` 最巧妙的地方在于，你可以将其放在表达式的左侧来进行替换。`substr` 所引用的文本会被右侧的字符串值替换：\n\n```\n# 改变世界\n\
  my $world = \"It's a Perl World\";\nsubstr( $world, 7, 4 ) = \"Mad Mad Mad Mad\"\
  ;\n```\n\n你可以结合 `index` 和 `substr` 来执行类似 `s///` 的替换，但就这个目的而言，`s///` 通常更快：\n\n```\n\
  # 查找 Perl，然后替换它：\nsubstr( $world, index( $world, \"Perl\" ), 4 ) = \"Mad Mad Mad\
  \ Mad\";\n\n# 更简洁且可能更快\n$world =~ s/Perl/Mad Mad Mad Mad Mad/;\n```\n\n### 音译单个字符\n\
  \n如果你想将所有出现的某个字符更改为另一个字符，你不需要替换运算符，因为它需要正则表达式引擎的所有开销，并且具有你不关心的额外副作用：\n\n```\n$string\
  \ =~ s/a/b/g;\n```\n\n不要忘记 Perl 的 `tr///` 运算符。它不使用正则表达式，因为它将字面字符更改为其他字符。你不需要 `/g`\
  \ 标志（`tr///` 没有这个标志），因为它总是更改所有字符：\n\n```\n$string =~ tr/a/b/;\n```\n\n\n\n\n\n音译操作符匹配两侧对应的字符，进行一对一的替换。你甚至可以使用范围来指定字符。以下是\
  \ Perl 版本的 ROT-13，将每个字母在字母表中移动 13 位：\n\n```\n$string =~ tr/a-mA-Mn-zN-Z/n-zN-Za-mA-M/;\n\
  ```\n\n如果只想音译字符串的一部分，可以将其与作为左值的`substr`结合使用：\n\n```\nsubstr( $string, 0, 10 ) =~\
  \ tr/a/b/;\n```\n\n**需要记住的事项**\n\n- 不要用正则表达式解决所有问题。\n- 使用 Perl 的众多字符串操作符来完成它们的工作。\n\
  - 使用音译操作符来替换单个字符。\n\n下载自 <www.wowebook.com>\n\n## 第 37 条 让正则表达式可读\n\n正则表达式通常杂乱且令人困惑。不可否认——正则表达式具有非常紧凑且视觉上分散注意力的外观。它们本身就是一种“小语言”。然而，这种小语言并非由`foreach`和`while`这样的单词组成，而是使用`\\\
  w`、`[a-z]`和`+`这样的原子。\n\n正则表达式的概念本身就令人困惑。普通的编程任务通常或多或少直接转化为代码。你可能会想“从 1 数到 10”，然后写出像下面这样的`foreach`循环：\n\
  \n```\nforeach my $i ( 1 .. 10 ) {\n    print \"$i\\n\";\n}\n```\n\n完成特定任务的正则表达式可能看起来不像一系列直接的指令。你可能会想“找到单引号字符串”，然后得到类似这样的东西：\n\
  \n```\n/'(?:\\\\'|.)*?'/\n```\n\n你可以让正则表达式更（对人类）可读，如果你打算与他人共享程序，或者自己后续进一步开发，这一点尤其重要。保持正则表达式简单是一个起点，但你可以使用一些\
  \ Perl 正则表达式特性来帮助使复杂的正则表达式更易于理解。\n\n### 为正则表达式添加空白和注释\n\n通常，正则表达式中的空白是有意义的。在这个例子中，正则表达式中的字面空格匹配字符串中的空格：\n\
  \n```\nmy ( $a, $b, $c ) = /^(\\w+) (\\w+) (\\w+)/;\n```\n\n下面模式中的字面换行符匹配字符串中的换行符：\n\
  \n```\n$_ = \"Testing\none\ntwo\";   # $_ 包含嵌入的换行符\ns/<lf>/g;   # 将换行符替换为 <lf>\n\
  print \"$_\\n\";   # Testing<lf>one<lf>two\n```\n\n`/x`标志可以应用于模式匹配和替换，它告诉正则表达式解析器忽略空白（只要它前面没有反斜杠），包括注释。你可以利用这一点来展开表达式的逻辑部分，并对正则表达式的各部分进行分组。这个用于查找单引号字符串（包括任何转义引号）的模式，在你能轻松看到各部分时看起来好多了：\n\
  \n```\nmy ($str) = /( ' (?: \\\\' | . )*? ' )/x;\n```\n\n当正则表达式包含复杂的交替和几层分组时，这一点尤其有用。使用`/x`，你可以格式化正则表达式以显示其结构，解释每个部分的目的，并显示你想要匹配的文本示例。当字面空白没有意义时，你可以在模式内部添加\
  \ Perl 注释：\n\n```\nmy ($str) = m/\n    (\n        # $1 开始\n        \"\n        #\
  \ 双引号字符串开始\n        (?:\n            \\\\\\W |          # 特殊字符，\\+\n           \
  \ \\\\x[0-9a-fA-F]{2} |   # 十六进制，\\xDE\n            \\\\[0-3][0-7]{2} |     # 八进制\
  \ \\0377\n            [^\"\\\\]          # 普通字符\n        )*\n        \"\n    ) \
  \  # $1 结束\n/x;\n```\n\n### 将复杂的正则表达式分解成片段\n\n正则表达式受双引号插值的影响（第 28 条）。你可以利用这个特性来编写由变量构建的正则表达式。在某些情况下，这可以使它们更易读。使用`qr//`（第\
  \ 40 条），你可以创建子模式，然后组合成更大的正则表达式：\n\n```\nmy $num   = qr/[0-9]+/;\nmy $word  = qr/[a-zA-Z_]+/;\n\
  my $space = qr/[ ]+/;\n\n$_ = \"Testing 1 2 3\";\nmy @split = /($num | $word | $space)/gxo;\n\
  print join( \":\", @split ), \"\\n\";   # Testing: :1: :2: :3\n```\n\n这个示例创建的模式是`/([0-9]+\
  \ | [a-zA-Z_]+ | [ ])/gxo`。我们使用了`/o`（“编译一次”）标志（第 39 条），因为 Perl 无需多次编译这个正则表达式。\n\n\
  你可以重写之前的双引号字符串示例，这次使用子模式来表示各部分，然后将它们组合成`$whole`中的最终正则表达式：\n\n```\nmy $whole = do\
  \ {\n    # 转义字符如 \\\", \\$\n    my $spec_ch = qr/\\\\ \\W/x;\n    # 十六进制转义：\\xab\n\
  \    my $hex_ch  = qr/\\\\x [0-9a-fA-F]{2} /x;\n    # 八进制转义：\\123\n    my $oct_ch\
  \  = qr/\\\\ [0-3][0-7]{2} /x;\n    # 普通字符\n    my $char    = qr/[^\\\"\\\\]/;\n\
  \n    qr/\n        (\n            \"\n            (?: $spec_ch | $hex_ch | $oct_ch\
  \ | $char )*\n            \"\n        )\n    /xo;\n};\n```\n\n... 这是实际的正则表达式 ...\n\
  \n```\nmy ($str) = /$whole/o;\n```\n\n如果你好奇以这种方式构建的正则表达式具体是什么样子，可以打印出`$whole`。正则表达式对象会将其字符串化：\n\
  \n```\nprint \"The regex is----\\n$whole\\n----\\n\";\n```\n\n这是一个相当直接的示例，展示了如何使用变量构建正则表达式。关于更复杂的示例——一个可以解析\
  \ RFC 2822 地址的正则表达式，请参阅《精通正则表达式》1 一书。\n\n**需要记住的事项**\n\n- 使用`/x`标志为正则表达式添加无意义的空白和注释。\n\
  - 格式化正则表达式以强调其结构。\n- 从较小的正则表达式构建正则表达式。\n\n## 第 38 条 避免不必要的回溯\n\n正则表达式中的交替通常很慢。由于\
  \ Perl 正则表达式引擎的工作方式，每次正则表达式中的某个备选项匹配失败时，引擎必须在字符串中“回溯”并尝试下一个备选项：\n\n假设你想匹配几个可能的名称之一。你可以尝试一个包含每个名称的交替：\n\
  \n```\nwhile (<>) {\n    print if /\\b(george|jane|judy|elroy)\\b/;\n}\n```\n\n\
  模式匹配找到一个单词边界，然后尝试匹配`george`。如果失败，它会回溯到边界并尝试匹配`jane`；如果失败，则尝试`judy`，然后是`elroy`。如果其中一个名称匹配，它会寻找另一个单词边界。\n\
  \n当许多备选项看起来相似时，回溯尤其糟糕。考虑这个人为的例子，其中备选项以相同的前缀开头：\n\n```\n'aaabbbccg' =~ /\\b(aaabbbccc|aaabbbccd|aaabbbcce|aaabbbccf)\\\
  b/;\n```\n\n匹配操作符尝试第一个备选项，一直测试到最后的`c`，才发现它不匹配最后一个字符。然后它完全回溯，开始第二个备选项，再次一直走到最后才失败。它再次回溯，并继续尝试所有备选项，最终失败。这做了大量工作。\n\
  \n不过有一种方法可以解决这个问题，即构建一个**trie**（如检索中的 trie）。这是一种树，它利用所有备选项的公共前缀来构建一个优化的交替，从而最小化回溯。`Regexp::Trie`模块为你处理细节：\n\
  \n```\nuse Regexp::Trie;\n\nmy $rt = Regexp::Trie->new;\nforeach (qw/foobar foobah\
  \ fooxar foozap fooza/) {\n    $rt->add($_);\n}\nmy $alternation = $rt->regexp;\n\
  print \"$alternation\\n\";\n```\n\n输出显示了模块创建的正则表达式，用于以最少的回溯高效扫描字符串：\n\n```\n(?-xism:foo(?:ba[hr]|xar|zap?))\n\
  ```\n\n当你想在匹配操作符中使用它时，只需将其插值到匹配操作符中：\n\n\n\n\n\n`$string =~ m/$alternation/;`\n\n\
  从 Perl 5.10 开始，正则表达式引擎会自动将每个字符串字面量的分支结构转换为 trie（字典树），因此在某些情况下你无需自行处理细节。\n\n下载自 <www.wowebook.com>\n\
  \n**134** ❘ *第 3 章 正则表达式*\n\n### 使用字符类（`[abc]`）代替分支结构\n\n有些情况下分支结构完全没必要，应当避免使用。例如，用分支结构代替字符类可能会给模式匹配带来巨大的速度损失。你可能会尝试用分支结构匹配\
  \ Perl 变量名的符号（sigil）：\n\n```\nwhile (<>) {\n    push @var, m'(($|@|%|&)\\w+)'g;\n\
  }\n```\n\n既然你要匹配的是单个字符，就应该改用字符类：\n\n```\nwhile (<>) {\n    push @var, m'([$@%&]\\\
  w+)'g;\n}\n```\n\n### 避免量词导致的不必要回溯\n\n考虑模式 `/\\b(\\w*t|\\w*d)\\b/`，它匹配以 t 或 d 结尾的单词。每次使用这个模式时，引擎会先查找单词边界。然后尝试第一个分支，尽可能多地匹配连续的单词字符。接着查找\
  \ t。由于它已经读取了所有单词字符，所以找不到 t，于是必须回退一个字符。如果那个字符是 t，那就太好了——现在它可以查找单词边界，然后完成匹配。如果没有匹配，引擎会继续回退并尝试找到\
  \ t。如果一直回退到初始的单词边界，引擎就会尝试分支的第二部分，在末尾查找 d。\n\n可以看出这是一个非常费力的过程。虽然正则表达式引擎本就是为了处理复杂工作，但这个特定模式让工作变得比实际需要复杂得多。\n\
  \n一个明显的缺点是，如果引擎从一个以 d 结尾的单词开头开始匹配，它必须先走到末尾，然后徒劳地往回搜索 t，之后才开始查找 d。你可以通过去掉分支来修复这个问题：`/\\\
  b\\w*[td]\\b/` 这是一个改进。现在，无论单词以 t、d 还是其他字符结尾，引擎都只扫描一次单词的长度。\n\n下载自 <www.wowebook.com>\n\
  \n## 第 38 条 避免不必要的回溯\n\n**135**\n\n但这并没有完全解决回溯问题。注意，正则表达式引擎不需要从单词末尾回退超过一个字符。如果那个字符不是\
  \ t 或 d，就没有必要继续了，因为即使它在字符串更早的位置找到了一个，那也不是你想要的——单词末尾的 t 或 d。\n\n你可以换一种方式处理这个问题。问问自己：\n\
  \n“如果我要查找以 t 或 d 结尾的单词，我会看哪里？”\n\n很可能，你只会看单词的末尾：\n\n`/[td]\\b/`\n\n现在，这很有趣。这个小小的正则表达式完成了前两个表达式所做的一切，尽管一开始可能不明显。想想看：在\
  \ t 或 d 的左边会有零个或多个 `\\w` 字符。你不在乎它们是什么类型的 `\\w` 字符，所以，如果你愿意，可以说一旦你在单词边界左边有了一个 t 或\
  \ d，你就得到了一个以 t 或 d 结尾的单词。这是模式开头 `*` 量词的一个普遍问题：因为它总是可以匹配零个实例，所以它和不存在是一样的。\n\nptg\n\
  \n自然，这个小小的正则表达式运行速度比前两个快得多——实际上大约快两倍。而且显然没有太多回溯，因为表达式只匹配一个字符！\n\n### 非回溯的占有量词\n\n\
  避免回溯的一种方法是告诉 Perl 不要回溯。Perl 5.10 引入了正则表达式量词的“占有”形式。在任何量词后面加上 `+`，它就不会回溯。该量词会尽可能多地匹配，并且绝不放弃任何内容。如果量词后面的正则部分无法在量词停止的位置匹配，则匹配失败。\n\
  \n假设你想在表示 DNA 序列的字符串中找到一些有趣的东西。你编写了一个正则表达式，尽可能多地匹配三个字母一组，然后是一个 GCG，接着是任意两个字符，最后是一个\
  \ G。也许这是 DNA 乱码或代表变异外星人，但它很好地说明了回溯：\n\n```\nmy $string = 'GCGGCCGCAGCUGCCGCUGCAGCCGCCGCUGCCGCCGCG';\n\
  if ( $string =~ /^(?:GC.)*GCG(..G)/ ) {\n    print \"Matches GCG with XXG afterward!\\\
  n\";\n}\n```\n\n下载自 <www.wowebook.com>\n\n**136** ❘ *第 3 章 正则表达式*\n\n要查看它经历的所有步骤，你可以使用\
  \ `re` 编译指示开启正则调试。你可以自己运行以下程序查看其冗长的输出：\n\n```\nuse re 'debugcolor';\nmy $string\
  \ = 'GCGGCCGCAGCUGCCGCUGCAGCCGCCGCUGCCGCCGCG';\nif ( $string =~ /^(?:GC.)*GCG(..G)/\
  \ ) {\n    print \"Matches GCG with XXG afterward!\\n\";\n}\n```\n\n在这个例子中，`*` 是贪婪的，所以它尽可能多地匹配，几乎到字符串末尾。它发现虽然末尾有一个\
  \ GCG，但后面没有任何内容。它开始回溯，尝试回退三个字符匹配，失败，再次回溯，失败，如此反复，一直回到开头。它在开头找到了 GCG，但所有这些工作都是浪费，因为你实际上希望它在匹配到字符串中最后一个\
  \ GCG 后失败。在这个短例子中还不算太糟，但想象一下更长的 DNA 链，或者在数百万或数十亿个字符串上重复执行。\n\n你可以使用占有量词 `+` 来消除回溯，它适用于任何量词。将其添加到任何量词上，该量词就不会回溯。现在匹配失败得更快：\n\
  \n```\nif ( $string =~ /^(?:GC.)*+GCG(..G)/ ) {\n    print \"Matches GCG with XXG\
  \ afterward!\\n\";\n}\n```\n\n顺便提一下，你也可以用否定字符类来编写模式，这样第一个组就不会匹配到 G：\n\n`/^(?:GC[^G])*GCG(..G)/`\n\
  \n### 要点总结\n\n- 将分支结构转换为 trie 以提高匹配速度。\n- 使用字符类来表示单个字符的多种可能性。\n- 使用占有量词避免正则表达式回溯。\n\
  \n下载自 <www.wowebook.com>\n\n## 第 39 条 只编译一次正则表达式\n\n**137**\n\n大多数模式匹配和替换的正则表达式只编译一次——在编译时，与周围的其余语句一起。在下面的例子中，Perl\
  \ 只编译一次模式 `/\\bmagic_word\\b/`，因为它是一个常量模式。Perl 在运行时反复使用编译后的形式：\n\n```\n# 统计 @big_long_list\
  \ 中 magic_word 的出现次数\nforeach (@big_long_list) {\n    $count += /\\bmagic_word\\\
  b/;\n}\n```\n\n当模式包含插值变量时，例如 `/\\b$magic\\b/`，旧版 Perl 会在每次执行匹配操作时重新编译它。它不知道变量是否发生了变化（尽管在现代\
  \ Perl 中，它知道）：\n\n```\nprint \"请输入魔法词：\";\nchomp( my $magic = <STDIN> );\n\n# 统计\
  \ @big_long_list 中魔法词的出现次数\nforeach (@big_long_list) {\n    $count += /\\b$magic\\\
  b/;\n}\n```\n\n每次在匹配中使用这样的模式时都重新编译是非常浪费的。如果你知道 `$magic` 不会改变，你可以通过在匹配操作符上使用 `/o`\
  \ 标志来告诉 Perl。\n\n```\nprint \"请输入魔法词：\";\nchomp( my $magic = <STDIN> );\n\n# 统计\
  \ @big_long_list 中魔法词的出现次数\nforeach (@big_long_list) {\n    $count += /\\b$magic\\\
  b/o;   # 只编译一次\n}\n```\n\n现在 Perl 只会编译一次正则表达式。如果你更改了 `$magic`，匹配操作符不会察觉。\n\n`/o`\
  \ 标志也适用于替换。替换中的替换字符串正常工作——它可以在每次匹配时变化：\n\n下载自 <www.wowebook.com>\n\n\n\n\n\n# 第\
  \ 3 章 正则表达式\n\n```\nprint \"Give me the magic word: \";\nchomp( my $magic = <STDIN>\
  \ );\nforeach (@big_long_list) {\n    s/\\b$magic\\b/random_word()/eo;\n}\n```\n\
  \n`/o` 标志同样适用于正则表达式引用（第 40 条），它允许你预编译正则表达式。\n\n### 要点记忆\n\n- 在正则表达式中插值变量时要小心。\n\
  - 使用 `/o` 标志仅编译一次正则表达式。\n\n## 第 40 条 预编译正则表达式\n\n快问——你在下面这个 Perl 表达式中看到了几个组成部分？\n\
  \n`/abc/`\n\n这个表达式有两个部分：匹配操作符和匹配操作符内部的正则表达式。匹配操作符将正则表达式应用于目标，但操作符和其中的正则表达式并非不可分割。\n\
  \n你可以使用 `qr//` 在匹配或替换操作符之外创建编译后的正则表达式。它的语法与其他通用引用（第 21 条）完全相同：\n\n```\nmy $name\
  \ = 'Buster';\nmy $regex = qr/\\b$name\\b/;\n```\n\n与匹配操作符中的普通字符串插值一样，正则表达式元字符是特殊的。`$regex`\
  \ 中的值变成了对已编译正则表达式的虚拟引用。它实际上只是一个带有一些魔力的字符串。它看起来像是对 `ref` 的引用，但如果你解引用它，只会得到 `undef`。然而，如果你打印出来看看，输出结果看起来就像你熟悉和喜爱的正则表达式：`(?-xism:\\\
  bBuster\\b)`\n\n你仍然可以使用任何影响模式的标志，例如 `/i`、`/m` 和 `/s`。这个正则表达式不区分大小写，并允许 `.` 匹配换行符，因此两个名字可以跨行出现：\n\
  \n```\nmy $regex = qr/Buster(.*)Mimi/si;\n```\n\n你可以像使用字符串一样，将 `$regex` 编译到匹配或替换操作符中：\n\
  \n```\n# 统计 @big_long_list 中魔法词的出现次数\nforeach (@big_long_list) {\n    $count +=\
  \ /$regex/;   # 只编译一次\n}\n```\n\n你甚至不需要显式地使用匹配操作符，尽管没有它看起来有点奇怪：\n\n```\n$string\
  \ =~ $regex;\n```\n\n你也可以使用 `qr//` 来测试正则表达式在尝试使用之前是否能成功编译。你不必等到尝试应用正则表达式时才发现它是否有效。在\
  \ `eval` 中编译正则表达式：\n\n```\nmy $name = '(';\nmy $regex = eval { qr/\\b$name\\b/ }\n\
  \    or die \"正则表达式失败: $@\";\n```\n\n例如，如果 `$name` 包含一个不匹配的 `(`，你可以捕获这个错误。Perl 会友好地告诉你它被什么搞糊涂了：\n\
  \n```\nUnmatched ( in regex; marked by <-- HERE in m/( <-- HERE /\n```\n\n### 要点记忆\n\
  \n- 使用 `qr//` 预编译正则表达式。\n- 将预编译的正则表达式插值到匹配操作符中。\n- 使用 `eval` 尝试那些可能无法插值为有效正则表达式的匹配。\n\
  \n## 第 41 条 对正则表达式进行基准测试\n\n与 Perl 中的许多其他事情一样，确定如何让模式匹配快速运行的最佳方法之一是编写替代实现并进行相互比较。\n\
  \n使用 `Benchmark` 模块来查看无捕获括号（第 32 条）究竟能带来多大的差异。下面是一个小程序，用于测试从 Apache `access_log`\
  \ 的通用日志格式行中提取请求主机的正则表达式，该日志行看起来像：\n\n```\nwww.example.com - - [01/Dec/2009:21:09:42\
  \ -0600] \"POST / ↵\nHTTP/1.1\" 200 30447\n```\n\n要提取该条目开头的主机名，你可以尝试两个正则表达式以及一个对照组：\n\
  \n```\nuse Benchmark qw(timethese);\n\nmy @data = <>;\n\ntimethese(\n    $ARGV[0]\
  \ || 100,\n    {\n        control => q{\n            foreach (@data) {\n       \
  \         my ($host) = 'www.example.com'\n            }\n        },\n\n        mem\
  \ => q{\n            foreach (@data) {\n                my ($host) = m/(\\w+(\\\
  .\\w+)+)/;\n            }\n        },\n\n        memfree => q{\n            foreach\
  \ (@data) {\n                my ($host) = m/(\\w+(?:\\.\\w+)+)/;\n            }\n\
  \        },\n    }\n);\n```\n\n当我们在 MacBook Air 上使用 Perl 5.10.0 对 100,000 行的 Apache\
  \ `access_log` 进行测试时，无捕获括号的性能提升了约 22%：\n\n```\nBenchmark: timing 100 iterations\
  \ of control, mem, memfree...\ncontrol: 2 secs ( 2.05 usr + 0.02 sys = 2.07 CPU)\n\
  mem: 25 secs (24.36 usr + 0.12 sys = 24.48 CPU)\nmemfree: 20 secs (19.18 usr + 0.12\
  \ sys = 19.30 CPU)\n```\n\n你的结果可能会有所不同，因此你应该始终使用目标平台和设置来测试你的基准。\n\n也许你对仅 22% 的提升并不满意。前两个尝试的正则表达式基本上是相同思路的变体。有时答案是彻底重新思考模式，并用另一种方式描述它。在这种情况下，你要查找的是行首的主机名：\n\
  \n```\ntimethese(\n    $ARGV[0] || 100,\n    {\n        # 与之前相同...\n        anchor\
  \ => q{\n            foreach (@data) { my ($host) = m/^(\\S+)/; }\n        },\n\
  \    }\n);\n```\n\n新的正则表达式比之前的快得多：\n\n```\nBenchmark: timing 100 iterations of anchor,\
  \ control, mem, memfree...\nanchor: 11 secs (10.78 usr + 0.07 sys = 10.85 CPU)\n\
  control: 2 secs ( 2.02 usr + 0.01 sys = 2.03 CPU)\nmem: 25 secs (24.69 usr + 0.19\
  \ sys = 24.88 CPU)\nmemfree: 20 secs (19.34 usr + 0.14 sys = 19.48 CPU)\n```\n\n\
  有时，像锚点或更不具体的模式这样的元素可以带来巨大的差异。\n\n### 要点记忆\n\n- 使用 `Benchmark` 比较正则表达式的性能。\n- 使用对照组作为比较的参考点。\n\
  - 当小的优化不够时，考虑完全不同的方法。\n\n## 第 42 条 不要重新发明正则表达式\n\n在文本中查找数字似乎很容易；你可以从像 `/\\d+/` 这样简单的东西开始。但小数点呢？在这种情况下，还有可能存在的千位分隔符。哦——还有正负号或指数表示法呢？一个简单的问题很快就会失控。\n\
  \n除了作为脑力练习，你为什么要编写一个正则表达式来修剪空白或查找电子邮件地址？这些以及许多其他常见问题的解决方案都很好地打包在 CPAN 上的 `Regexp::Common`\
  \ 模块中，其中包含已经为你创建好的模式：\n\n```\nuse Regexp::Common;\n\nmy $text =\n    '绝对零度在华氏温标上是\
  \ -459.67';\nprint \"$1 是[低于]冰点的！\\n\"\n    if $text =~ /$RE{num}{real}{-keep}/;\n\
  ```\n\n`Regexp::Common` 导出了 `%RE` 哈希，其中包含预构建的正则表达式供你使用，例如本例中的 `$RE{num}{real}` 表达式。最后的\
  \ `{-keep}` 键是 `Regexp::Common` 提供的一点魔法，用于捕获匹配的文本。\n\n对于有倾向的人，甚至还有一个面向对象的接口。访问所需的键并调用\
  \ `match` 方法。面向对象的接口往往会清除捕获，但如果你需要的是脏话过滤器，这可能并不困扰你：\n\n```\nuse Regexp::Common;\n\
  \nmy $text = 'shpx';\n$text =~ tr/A-Za-z/N-ZA-Mn-za-m/;\n\nwhile (<>) {\n    print\
  \ \"你用那张嘴亲你妈妈吗？\\n\"\n        if $RE{profanity}->matches($text);\n}\n```\n\n在这个例子中，你读取输入并责备那些说了不该说的话的人。顺便说一句，如果你在寻找一些初中生式的窃笑，查看脏话正则表达式的源代码不会给你带来任何乐趣。作者很贴心地做了一点混淆，使代码保持\
  \ G 级（大众级）。\n\n在 `Regexp::Common` 中找到你需要的正则表达式可能很困难，因为它们分布在许多子模块中。当你想查看有哪些可用时，这可能会很麻烦，但它确实有一些实际好处。例如，你可以选择不加载某些正则表达式，以减少加载时间和内存占用。\n\
  \n\n\n\n此外，你还可以安装未随核心模块 `Regexp::Common` 一起分发的“插件”模块。例如，`Regexp::Common::Email::Address`\
