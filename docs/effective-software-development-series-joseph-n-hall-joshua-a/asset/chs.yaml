  \n# Perl 基础\n\n如果你有其他语言的经验但刚接触 Perl，你可能仍在发现 Perl 的特性。本节将讨论其中一些特性。特别是，它针对那些仍然适应其他语言的新手\
  \ Perl 程序员可能会困扰的问题。\n\n例如，你应该已经知道 Perl 变量通常由一些标点符号如 `$` 或 `@` 后跟标识符组成。但你知道相同名称的不同类型变量（如\
  \ `$a` 和 `@a`）是否完全独立吗？\n\n它们是独立的（参见本章的条目 5）。\n\n你应该知道 `@a` 是一个数组，但你知道 `$a[$i]` 和\
  \ `@a[$i]` 之间的区别吗？后者是一个切片（条目 9）。\n\nptg\n\n你应该知道数字 0 是假，空字符串 `''` 是假，但你知道由单个空格组成的字符串\
  \ `' '` 是假吗？它是真（条目 7）。\n\nPerl 还有许多其他有趣的怪癖，反映了它从许多其他语言中借鉴精华的传统，并加入了其语言学家创始人 Larry\
  \ Wall 的一些不寻常想法。然而，一旦你开始像 Perl 那样思考，这些怪癖就会变得更有意义。\n\n如果你是一位经验丰富的 Perl 程序员，这些基础条目对你来说大多是复习。不过，你可能会发现一些之前没注意到的有趣细节，或者向同事解释概念的其他方式。\n\
  \n## 条目 1. 查找 Perl 及其模块的文档。\n\nPerl 自带大量文档——比你想要打印出来的还要多。要全部打印出来，你需要用掉几令纸和大量墨粉。在文档达到大约\
  \ 2000 页后（在我们的虚拟打印机上，所以没有树木受到伤害），我们就数不清了。\n\n9\n\n下载自 <www.wowebook.com>\n\n10 ❘\
  \ 第 1 章 Perl 基础 文档文件中有大量有用的信息，因此能够阅读它们，甚至更重要的是，在其中找到信息，是很有价值的。找到所需内容的能力一部分是知识，一部分是工具。\n\
  \n### perldoc 阅读器\n\n`perldoc` 命令在 Perl 树中搜索带有嵌入式文档的 Perl 模块（`.pm`）、纯文档的 `.pod`\
  \ 文件（条目 82）以及已安装的 Perl 程序。`perldoc` 命令格式化并显示它找到的文档。首先，阅读 `perldoc` 自身的文档：\n\n`%\
  \ perldoc perldoc`\n\n```\nPERLDOC(1)                User Contributed Perl Documentation\n\
  \nNAME\n       perldoc - Look up Perl documentation in pod format.\n\nSYNOPSIS\n\
  \       perldoc [-h] [-v] [-t] [-u] [-m] [-l]\n```\n\nptg ... 等等 ...\n\n通常，你给 `perldoc`\
  \ 提供你想要阅读的文档页面名称。`perltoc` 是目录，显示所有页面名称：\n\n`% perldoc perltoc`\n\n你可能对 `perlsyn`\
  \ 感兴趣，这是讨论 Perl 通用语法的页面：\n\n`% perldoc perlsyn`\n\n如果你想阅读关于 Perl 内置函数的内容，可以查看 `perlfunc`：\n\
  \n`% perldoc perlfunc`\n\n你应该至少通读一遍 `perlfunc`，以了解 Perl 提供的所有功能。你不必记住所有内容，但以后你可能会记得\
  \ Perl 有一个内置函数，例如，用于与 `/etc/passwd` 文件交互，即使你不记得那个内置函数叫什么。你还会注意到，滚动输出以找到你需要的内置函数非常烦人。如果你知道你想阅读的内置函数，下载自\
  \ <www.wowebook.com>\n\n可以使用 `-f` 开关指定它，这会只提取该函数的部分：\n\n`% perldoc -f split`\n\n\
  你也可以使用 `perldoc` 阅读模块文档；只需提供模块名称：\n\n`% perldoc Pod::Simple`\n\n如果你想知道该模块安装在哪里，可以使用\
  \ `-l`（字母 ell）开关获取文件位置：\n\n`% perldoc -l Pod::Simple`\n\n如果你想查看原始源代码，请使用 `-m` 开关：\n\
  \n`% perldoc -m Pod::Simple`\n\nPerl 文档附带几个 FAQ 文件，回答了许多常见问题。你可以在线阅读它们，但 `perldoc`\
  \ 还有一个很好的功能，可以使用 `-q` 开关搜索它们。例如，如果你想查找关于随机数的答案，可以尝试：\n\n`% perldoc -q random`\n\n\
  ### 在线文档\n\n\n\n\n\n在我们撰写本文时，`http://perldoc.perl.org/` 是查阅 Perl 文档的最佳网站。它包含了 Perl\
  \ 最近几个版本附带的核心文档，提供 HTML 和 PDF 格式，并且足够智能，能记住你之前查看过的文档。\n\n不过，该网站并未包含所有模块的文档文件。你可以在\
  \ CPAN Search（`http://search.cpan.org/`）或 Kobes’s Search（`http://kobesearch.cpan.org/`）上在线阅读这些文档，这两个网站都提供了\
  \ CPAN 的 Web 界面。有些人觉得这些文档非常方便，甚至会在查看本地系统之前先阅读它们。\n\nCPAN Search 特别有用的一点是，它提供了“其他工具”（Other\
