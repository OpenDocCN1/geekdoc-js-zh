  \nopen my ($data_fh), '<', $data_file or die;\nwhile (<$data_fh>) {\nchomp;\nmy\
  \ @row = split;\n```\n\n下载自 <www.wowebook.com>\n\n197 ❘ 第 57 条 将大部分数据留在磁盘上以节省内存\n\
