  ### 检测日志级别\n\n`Log::Log4perl` 还允许你检查日志级别。尽管 `Log::Log4perl` 会忽略来自较低日志级别的消息，但它仍然需要进行子例程调用，然后检查其配置以决定如何处理。这可能会浪费时间。如果输出不会被注意到，避免昂贵的处理是一个很好的节省周期的方法。你可以调用\
  \ `is_debug` 来检查当前是否处于调试级别：\n\n```perl\nif ( $logger->is_debug() ) {\n    for (@big_array)\
  \ {\n        $logger->debug(\"big array value: $_\");\n    }\n}\n```\n\n每个级别都有类似的方法，`Log::Log4perl`\
  \ 还提供了其他可用于检查配置的方法。\n\n### 获取更多信息\n\n尽管这只是对 `Log::Log4perl` 的简要介绍，但不必担心。`Log::Log4perl`\
