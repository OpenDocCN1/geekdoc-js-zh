  \ 条 使用 prove 实现灵活的测试运行\n\n你为代码编写的测试只是 Perl 程序。由于它们只是 Perl 程序，你可以用 `perl` 执行它们：\n\
  \n```\n% perl t/my_test.t\n```\n\n不过，你必须小心加载的是哪个版本的被测模块。很可能，你正在开发和测试一个已经安装在系统上的模块。毕竟，你编写这个模块是因为你需要使用它，不是吗？\n\
  \n一如既往，`perl` 会搜索 `@INC` 中的路径，并加载它找到的第一个版本的模块。根据搜索路径中的内容，这可能是你之前安装的稳定版本，也可能是你实际打算测试的开发版本。\n\
  \nptg\n\n如何确保始终加载开发版本的模块？\n\n一种方法是在命令行中显式包含开发代码所在的 `lib/` 目录：\n\n```\n% perl -Ilib\
  \ t/my_test.t\n```\n\n另一种选择是，如果你使用构建脚本，可以利用 `blib` 模块。`blib` 模块会搜索当前目录以及向上几级目录，寻找由构建脚本创建的\
  \ `blib` 目录，然后将找到的第一个目录添加到 `@INC` 的前面：\n\n```\n% make; perl -Mblib t/my_test.t\n\
  % ./Build; perl -Mblib t/my_test.t\n```\n\n在确保测试的是正确版本的模块后，你就可以开始运行测试了。然而，用 `perl`\
  \ 运行测试脚本的输出可能会很快变得难以控制：\n\n```\n1..500\nok 1 - testing some code\nok 2 - another\
  \ test\n```\n\n下载自 <www.wowebook.com>\n\n*第 87 条 使用 prove 实现灵活的测试运行* ❘ **309**\n\
  \n```\nok 3 - let's see if this works\nok 4 - everything should be okay here\nok\
  \ 5 - checking some functionality\n...\nok 500 - this should be looking good\n```\n\
  \n幸运的是，`perl` 附带了一个名为 `prove` 的便捷程序。`prove` 命令运行你的测试程序，并能解释它们的输出。`prove` 不会倾倒满屏的输出，而是收集输出并为你提供一份漂亮的摘要。`-b`\
  \ 开关将 `blib/` 目录包含到 `@INC` 中，就像 `-Mblib` 对 `perl` 所做的那样：\n\n```\n% prove -b t/my_test.t\n\
  my_test.t .. ok\nAll tests successful.\nFiles=1, Tests=500, 0 wallclock secs ( 0.09\
  \ usr 0.01 ↵\nsys + 0.09 cusr 0.00 csys = 0.19 CPU)\nResult: PASS\n```\n\n如果任何测试出现问题，`prove`\
  \ 会提供关于该测试的更多信息：\n\nptg\n\n```\n% prove -b t/my_failing_tests.t\nmy_failing_tests.t\
  \ .. 1/500\n# Failed test 'checking some functionality'\n# at my_failing_tests.t\
  \ line 9.\n# Looks like you failed 1 test of 500.\nmy_failing_tests.t .. Dubious,\
  \ test returned 1 (wstat 25↵\n6, 0x100)\nFailed 1/500 subtests\nTest Summary Report\n\
  -------------------\nmy_failing_tests.t (Wstat: 256 Tests: 500 Failed: 1) Failed\
  \ test: 5\nNon-zero exit status: 1\nFiles=1, Tests=500, 0 wallclock secs ( 0.08\
  \ usr 0.01 sy↵\ns + 0.08 cusr 0.00 csys = 0.17 CPU)\nResult: FAIL\n```\n\n如果 `prove`\
  \ 所做的仅仅是解释和总结测试输出，它仍然是一个有价值的工具；然而，`prove` 能做的远不止这些。\n\n下载自 <www.wowebook.com>\n\n\
  **310** ❘ *第 10 章 测试*\n\n### 随机化测试顺序\n\n`prove` 一个非常有用的功能是能够打乱执行测试文件的顺序。如果你有多个测试文件，可以将它们全部传递给\
  \ `prove`，并加上 `--shuffle` 选项，这样测试文件将以伪随机顺序运行。这有助于发现脚本之间的相互依赖关系，例如一个测试文件的数据影响后续测试文件：\n\
  \n```\n% prove --shuffle\n```\n\n`prove` 的另一个强大功能是能够并行运行测试。传入 `-j` 参数，后跟要并行运行的测试数量，`prove`\
  \ 将同时运行多个测试。这可以减少测试运行的实际时间。\n\n`prove` 能够在运行之间保存状态，并使用先前运行的状态，通过 `--state` 标志帮助深入排查问题。\n\
  \n例如，你可能打乱了测试顺序，突然遇到测试失败。由于测试打乱改变了测试执行顺序，你可能不容易重现该失败。但是，如果你在打乱时保存了状态，就可以重新运行相同的打乱顺序：\n\
  \nptg\n\n```\n% prove --shuffle --state=save\n... some failure output...\n% prove\
  \ --state=last t/*t\n```\n\n你还可以执行诸如仅运行上一次运行中失败或通过的测试等操作。你可以按多种顺序运行测试：从最快到最慢、从最慢到最快、从最新到最旧，或者只运行自上次状态修改以来发生变化的测试。如果你需要调查某些测试失败，不必重新运行整个测试套件。\n\
  \n### prove 与其他语言\n\n`prove` 并不关心你的测试是用 Perl 编写的，还是你在测试 Perl 代码。它期望测试输出采用 Test Anywhere\
  \ Protocol (TAP) 格式，该格式起源于 Perl 并已扩展到其他语言。你在本条目第一个输出示例中看到了一个例子。\n\n只要程序输出的结果格式能被\
  \ `prove` 使用的测试框架理解，你就可以使用 `--exec` 参数轻松测试任何其他语言的程序。如果你想用 `ruby` 运行测试文件，这很容易：\n\n\
  ```\n% prove --exec '/usr/bin/ruby -w' t/*t\n```\n\n### 需要记住的事项\n\n- 当你想要专注于某个测试的特性时，运行单个测试。\n\
  - 使用 `prove` 有选择地运行测试组。\n\n\n\n\n\n- 使用 `prove` 也可以运行其他语言的测试。\n\n## 第 88 条：仅在测试有意义时运行它们。\n\
  \n默认的 Perl 发行版设置将所有测试文件放在 `t/` 目录中。构建脚本通常每次都会运行所有测试文件，不过如果你改用 `prove`（第 87 条），则不必如此。\n\
  \n有些测试只是为了确保你完成所有编程任务。其他测试则只在某些特定情况下需要。通过一点测试编排，你可以确保测试仅在应该运行的情况下运行。\n\n### 作者测试\n\
  \n并非所有测试都与代码功能有关。最常见的需要过滤的测试类别是“作者”测试。这些测试包括对嵌入式文档（第 84 条）的检查、对测试本身的测试（第 96 条）以及“质量”测试（第\
  \ 68 条）等。尽管它们对你的发行版质量很重要，但其中任何一个测试失败都不应阻止用户安装你的模块。\n\n#### 使用 `TEST_AUTHOR` 环境变量\n\
  \n防止这些作者测试在你之外的机器上运行的一种常见方法是使用环境变量，例如 `$ENV{TEST_AUTHOR}` 来触发测试：\n\n```perl\nuse\
  \ Test::More;\n\nplan skip_all =>\n    'Set $ENV{TEST_AUTHOR} to enable this test.'\n\
  \    unless $ENV{TEST_AUTHOR};\n```\n\n注意：`TEST_AUTHOR` 是一个相当常见的用于启用作者测试的环境变量。其他开发自己模块的人可能已经设置了该变量，当他们运行你的额外测试时可能会感到惊讶。同样，当你运行他们的测试时，你也可能遇到同样的问题。\n\
  \n你可能会认为可以通过检查 `$ENV{TEST_AUTHOR}` 的值是否等于你的用户名来解决意外的作者测试问题：\n\n```perl\nplan skip_all\
  \ =>\n    'Set $ENV{TEST_AUTHOR} to enable this test.'\n    unless $ENV{TEST_AUTHOR}\
  \ eq 'SNUFFY';\n```\n\n但是，如果其他人（例如你的共同维护者）也想运行这些测试呢？那么他们必须假装成你！这不太友好。\n\n#### 使用\
  \ `xt/` 目录\n\n与其将作者测试放在与代码测试相同的目录中，不如将它们放在另一个目录中。通常这是 `xt/` 目录（用于**额外测试**）。然后你可以在需要时使用\
  \ `prove` 运行这些测试（第 87 条）。\n\n如果你不想冒险分发你的作者测试，并且已将所有这些测试放在一个单独的目录中，你可以使用 `MANIFEST.SKIP`\
  \ 将该目录从发行版中排除，该文件使用 Perl 正则表达式从 `MANIFEST` 中过滤文件：\n\n```\n^xt/\n```\n\n如果你的文件不在单独的目录中，你可以排除特定文件，尽管你必须确保自己维护该列表：\n\
  \n```\nt/pod.t\nt/pod_coverage.t\n```\n\n### 将测试限制在正确的情况下\n\n跳过依赖于操作系统的测试看起来与跳过作者测试几乎相同，只是不使用环境变量，而是依赖\
  \ Perl 中的 `$^O` 变量：\n\n```perl\nuse Test::More;\n\nplan skip_all => 'Skipping Linux-only\
  \ tests'\n    unless $^O eq 'linux';\n```\n\n使用 `skip_all` 会跳过整个文件。然而，你可能只需要跳过测试文件中间的少数几个测试。`Test::More`\
  \ 有一个特殊机制，可以在标记为 `SKIP` 的块中使用：\n\n```perl\nSKIP: {\n    skip 'Skipping Linux-only\
  \ tests', 2\n        unless $^O eq 'linux';\n    ok(...);\n    is(...);\n}\n\nok(\
  \ 1 == 1, 'The universe is stable' );\n\nSKIP: {\n    skip 'Skipping thread-only\
  \ tests', 2\n        unless $Config{'usethreads'} eq 'define';\n    ok(...);\n \
  \   is(...);\n}\n```\n\n你也可以复用那些将发行版限制在正确平台上的概念（第 83 条），来将测试限制在正确的平台上。\n\n### 在自动化环境中跳过测试\n\
  \nCPAN 测试者（第 97 条）会自动测试你上传到 CPAN 的任何模块。这是通过程序化方式完成的，通常没有人在监控测试。你可能不希望在这些情况下运行某些测试。例如，如果你正在创建一个图形界面并期望用户点击按钮，那么自动化测试过程将无法工作。为了解决这个问题，使用另一个\
  \ `SKIP` 块并检查 `AUTOMATED_TESTING` 环境变量的值：\n\n```perl\nSKIP: {\n    skip 'These tests\
  \ needs a real person', 2\n        if $ENV{AUTOMATED_TESTING};\n    test_start_window();\n\
  \    test_button_push();\n}\n```\n\n### 需要记住的要点\n\n- 将你的作者测试放入 `xt/` 目录，以将它们与用户测试分开。\n\
  - 使用 `SKIP` 块在测试不适用时禁用它们。\n- 通过检查 `$ENV{AUTOMATED_TESTING}` 来禁用交互式测试。\n\n## 第 89\
  \ 条：使用依赖注入避免特殊的测试逻辑。\n\n你可能希望在代码运行于生产系统时连接到生产数据库，而在其他情况下连接到测试数据库。也许你不希望在持续构建中运行测试时发送电子邮件（第\
  \ 98 条）。无论场景如何，简单（但错误）的做法是在代码中添加额外的条件逻辑：\n\n```perl\nmy $dbh =\n    ($test_mode)\n\
  \    ? connect_to_mock()\n    : connect_to_prod();\n\nif ( not $testing ) {\n  \
  \  send_nag_email();\n}\n```\n\n我们都做过这种事，即使我们不想承认。这段代码看起来无害，但实际上造成了问题。这些条件分支保证了你无法或不会测试某些代码分支，从而限制了你的测试覆盖率（第\
  \ 96 条）。当你忘记在最终向所有客户发送垃圾邮件的代码周围添加测试检查时，这可能会成为一些尴尬错误的根源。\n\n幸运的是，有一些好的解决方案可以完全避免这个问题。\n\
  \n**控制反转** 是一种优雅的解决方案——具体来说，通过**依赖注入**实现控制反转。作为额外的好处，即使在测试领域之外，依赖注入也是一种良好的编程实践。一旦你掌握了它，你就会开始在代码库中广泛使用依赖注入。\n\
  \n在最简单的形式中，依赖注入在对象外部构造对象的依赖项。主要功能部分来自你在关注对象之外创建的其他对象。\n\n以下是类 `Foo` 的构造函数，它接受新数据库句柄的参数，创建句柄，缓存它，然后返回一个新的\
  \ `Foo` 对象：\n\n```perl\npackage Foo;\n\nsub new {\n    my ( $class, $dsn, $user,\
  \ $password, $parameters ) = @_;\n    my $self = bless {}, $class;\n    $self->{dbh}\
  \ =\n        DBI->connect( $dsn, $user, $password, $parameters );\n    return $self;\n\
  }\n```\n\n要注入 `DBI` 依赖项而不是手动构造它，你只需传递一个已经构造好的数据库句柄：\n\n```perl\npackage Foo;\n\n\
  sub new {\n    my ( $class, $dbh ) = @_;\n    my $self = bless {}, $class;\n   \
  \ $self->{$dbh} = $dbh;\n    return $self;\n}\n```\n\n表面上这似乎是一个微不足道的改动，但它使你的代码更加灵活。在第一个示例中，你可以通过传入有效的\
  \ `DBI` 参数来测试代码，以便登录到某种测试数据库，但这总是会创建一个真实的数据库连接。在第二个示例中，你可以传入任何类型的对象作为数据库句柄。它可以是对测试数据库的引用。它可以是一个模拟对象（第\
  \ 92 条）。它可以是任何能让类 `Foo` 误以为自己在与一个真实的数据库句柄通信的东西。\n\n通常，人们会将工厂设计模式与依赖注入结合使用。你创建一个工厂，为你构造并返回数据库对象：\n\
  \n```perl\npackage DatabaseFactory;\n\nsub new {\n    my ( $class, $dbh ) = @_;\n\
  \    my $self = bless {}, $class;\n    ...\n}\n```\n\n\n\n\n\n```\n$self->{dbh}\
  \ = $dbh;\n\nreturn $self;\n\n}\n\nsub get_dbh {\n\nmy ($self) = @_;\n\nreturn $self;\n\
  \n}\n\nptg\n\nsub set_dbh {\n\nmy ( $self, $dbh ) = @_;\n\n$self->{dbh} = $dbh;\n\
  \n}\n\npackage Foo;\n\nsub new {\n\nmy ( $class, $database_factory ) = @_;\n\nmy\
  \ $self = bless {}, $class;\n\n$self->{database_factory} = $database_factory; return\
  \ $self;\n\n}\n\nsub do_something {\n\nmy ($self) = @_;\n\nmy $dbh = $self->{database_factory}->get_dbh();\n\
  \n}\n```\n\nDownload from <www.wowebook.com>\n\n## 第 90 条：不要在你的方法中要求超过你需要的参数\n\n\
  为了测试，你可以创建一个模拟数据库句柄，并且无需修改目标代码中的任何内容：\n\n```\nmy $dbh = create_new_mock_database_handle();\n\
  my $factory = DatabaseFactory->new($dbh);\nmy $foo = Foo->new($factory);\n$foo->do_something();\n\
  ```\n\n这不仅增加了依赖注入，还在代码中增加了一个额外的层次，允许你执行诸如从工厂返回对象池化，或在执行期间任意时刻更改对象等操作：\n\n```\nmy\
  \ $dbh = create_new_mock_database_handle();\nmy $factory = DatabaseFactory->new($dbh);\n\
  my $foo = Foo->new($factory);\n$foo->do_something();\n$factory->set_dbh(\n    create_modified_mock_database_handle()\
  \ );\n$foo->do_something();\n```\n\n工厂模式可能会很快变得笨重。如果你要进行大量的依赖注入，并且有一个大型应用程序，请考虑使用像\
  \ `Bread::Board` 这样的控制反转框架。\n\n### 需要记住的事项\n\n- 不要在代码中混入测试与生产逻辑。\n- 在使用依赖对象的代码外部构造依赖对象。\n\
  - 创建用于构造依赖对象的工厂。\n\n## 第 90 条：不要在你的方法中要求超过你需要的参数\n\n即使你使用了良好的依赖注入（第 89 条），也要将实际需要的依赖数量保持在最低限度。超过几个依赖就会让你抓狂，并使代码难以维护。\n\
  \n考虑一个检查汽车牌照是否过期的模块。也许这段 Perl 代码存在于交通信号灯上的自动摄像头中。该模块并不代表汽车本身，但它可以使用汽车对象来访问牌照信息：\n\
  \nDownload from <www.wowebook.com>\n\n```\npackage Auto::LicenseChecker;\n# Also\
  \ called City::RevenueGenerator\nuse DateTime ();\n\nsub new {\n    my ( $class,\
  \ $automobile ) = @_;\n    my $self = bless {\n        automobile => $automobile\n\
  \    }, $class;\n}\n\nsub check_expired_license {\n    my ($self) = @_;\n    my\
  \ $licenseplate =\n        $self->{automobile}->get_licenseplate;\n    return $licenseplate->get_expiration\
  \ <\n        DateTime->new->now();\n}\n```\n\nptg\n\n为了构造 `Auto::LicenseChecker`\
  \ 对象，你传入了一个完整的汽车对象作为参数，尽管你只需要车牌。也许你必须先构造一个 `Automobile` 对象，而它要求指定每一个部件才能返回对象：\n\n\
  ```\nuse Test::More tests => 1;\nmy $automobile = Automobile->new(\n    engine =>\
  \ Engine->new,\n    left_front_tire => Tire->new,\n    ...\n    license_plate =>\
  \ LicensePlate->new($number),\n    ...\n);\nmy $checker = Auto::LicenseChecker->new($automobile);\n\
  ok( not $checker->check_expired_license,\n    'legal to drive');\n```\n\n这需要大量工作，占用过多内存，并且为了检查车牌过期日期而需要考虑太多东西。那个摄像头真的关心你的车是否有四个轮胎或一个引擎吗？只要它经过路口，它只想弄清楚你是哪辆车以及如何向你收费。与其给它整个\
  \ `Automobile` 对象，不如只给它车牌对象：\n\n```\npackage Auto::LicenseChecker;\nuse DateTime\
  \ ();\n\nsub new {\n    my ( $class, $licenseplate ) = @_;\n    my $self = bless\
  \ {\n        licenseplate => $licenseplate,\n    }, $class;\n}\n\nsub check_expired_license\
  \ {\n    my ($self) = @_;\n    return $self->{licenseplate}->get_expiration <\n\
  \        DateTime->new()->now();\n}\n```\n\nptg\n\n这减少了测试中需要做的设置工作，因为你可以忽略汽车的大部分部件：\n\
  \n```\nuse Test::More tests => 1;\nmy $plate = LicensePlate->new($license_plate);\n\
  my $checker = Auto::LicenseChecker->new($plate);\nok( not $checker->check_expired_license,\n\
  \    'legal to drive' );\n```\n\n这是另一种情况，测试的困难程度反映了代码使用的困难程度。如果你在测试中需要设置太多东西，那么在生产代码中可能也需要设置太多东西。\n\
  \n### 需要记住的事项\n\n- 只给你的方法提供它们需要的信息。\n- 记住：测试中过多的设置意味着代码中过多的设置。\n\nDownload from\
  \ <www.wowebook.com>\n\n## 第 91 条：将程序编写为模块化程序以便于测试\n\n许多 Perl 程序最初只是几行代码，用于解决当天的问题。你从未想过会再次使用这些代码，因此没有足够谨慎。然后有人发现了它，要求你改进它，最终你拥有一个庞大的程序，似乎运行着整个公司。曾经无辜的代码现在成了一团泥球，而这一切都是你的错。\n\
  \n这种演化的问题是，很难将程序的不同部分分离出来并单独测试。\n\n一个典型的 Perl 程序从头开始运行到结束。如果你想测试某一部分，你必须同时运行所有其他部分。你做的任何事情，比如打印到标准输出或发送警告到标准错误，现在都成了测试问题。\n\
  \n为了解决这个问题，你可以从一开始就把每个程序当作模块来编写，尽管它仍然表现得像一个程序。这种程序被称为**模块化程序（modulino）**，或“小模块”，因为它一开始很小，就像你最初那个无辜的程序一样。\n\
  \nptg\n\n诀窍在于：当你把它当作程序运行时，它表现得像程序；当你把它当作模块使用时，它表现得像模块。也就是说，当你运行它时，它从头到尾执行并完成工作；但当你作为模块加载它时，它除了编译之外什么也不做。\n\
  \n最简单的形式是检查 `caller`。如果你将文件作为模块加载，那么存在一个更高层级（即加载该文件的文件），`caller` 返回真。如果你将其作为程序运行，则没有更高层级，因此\
  \ `caller` 返回假。\n\n你可以利用这一点来决定做什么：\n\n```\npackage MyApplication::Icelandic;\nuse\
  \ warnings;\nuse strict;\nuse utf8;\n\nMyApplication->run unless caller;\n\nsub\
  \ run {\n    print \"Starf þitt byrjar hér.\\n\";\n}\n\n1;\n```\n\nDownload from\
  \ <www.wowebook.com>\n\n这看起来像一个典型的 Perl 程序，但你把所有有趣的内容都放在了 `run` 中，这类似于其他语言中的主例程。`run`\
  \ 这个名字没有特殊含义；有些人喜欢传统的 `main`，有些人喜欢 `activate`，等等。只要你将模块的可执行部分隔离到一个子例程中，从而延迟执行实际工作，直到你准备好为止，你就在构建一个模块化程序。\n\
  \n实际上，你在语言演化中倒退了一步，因为 Perl 试图通过假设整个文件就是你的主例程来节省你的输入。\n\n现在，随着你向程序添加内容，少考虑在 `run`\
  \ 子例程中写一堆语句，多考虑将功能分离到不同的子例程中。\n\n继续这个例子，假设你现在想测试你的模块化程序。代码存在一些使测试变得困难的问题。`run` 方法只输出到默认文件句柄，并且只输出一条硬编码的消息。尽管这段小代码只能做一件事，但它仍然在很大程度上遇到了测试完整程序时遇到的相同问题。\n\
  \nptg\n\n\n\n\n你可以通过将输出目标与 `run` 分离来辅助测试。一种方法是创建一个应用程序对象，在其中将输出文件句柄设置为属性之一：\n\n\
  ```perl\npackage MyModulino;\n\nuse strict;\nuse warnings;\n\n__PACKAGE__->new->run\
  \ unless caller;\n\nsub run {\n    my ($application) = @_;\n    print { $application->{output_fh}\
  \ }\n        \"Your work starts here\\n\";\n}\n\nsub new {\n    my ($class) = @_;\n\
  \    my $application = bless {}, $class;\n    $application->init;\n    Download\
  \ from <www.wowebook.com>\n    **322** ❘ *第 10 章 测试*\n    $application;\n}\n\nsub\
  \ init {\n    my ($application) = @_;\n    $application->{output_fh} = \\*STDOUT;\n\
  }\n\nsub output_fh {\n    my ( $application, $fh ) = @_;\n    if ($fh) { $application->{output_fh}\
  \ = $fh }\n    $application->{output_fh};\n}\n\n1;\n```\n\n现在测试稍微容易一些。你在测试程序中加载这个\
  \ modulino，构造一个新的应用程序对象，并将输出文件句柄设置为标量引用（条目 54）：\n\n```perl\nuse Test::More tests\
