  \ $_ + $. - 1 ) . \": $f[$_]\" } 0 .. 2;\n    }\n}\n```\n\n使用切片赋值维护文本行队列会使代码比等效的一次性读取更慢，但这种方法适用于任意大小的输入。队列也可以用索引变量而不是切片赋值来实现，这样代码会更复杂但运行速度更快。\n\
  \n### 一次性读取文件\n\n如果你的目标只是尽可能快地将文件读入内存，可以考虑清除行分隔符并将整个文件作为单个字符串读取。这比前面两种方法读取文件或流的速度快得多：\n\
  \n```\nmy $contents = do {\n    local $/;\n    open my ($fh1), '<', $file1 or die;\n\
  \    <$fh>;\n};\n```\n\n你也可以直接使用 `File::Slurp` 模块来完成，它可以让你将整个文件读入标量（一大块）或读入数组（逐行）：\n\
  \n```\nuse File::Slurp;\nmy $text = read_file('filename');\nmy @lines = read_file('filename');\n\
  ```\n\n### 使用 read 或 sysread 获得最大速度\n\n最后，如果行边界不重要，`read` 和 `sysread` 操作符对于快速扫描文件非常有用：\n\
  \n```\nopen my ($fh1), '<', $file1 or die;\nopen my ($fh2), '<', $file2 or die;\n\
  my $chunk = 4096; # 要读取的块大小\nmy ( $bytes, $buf1, $buf2, $diff );\nCHUNK: while (\
  \ $bytes = sysread $fh1, $buf1, $chunk ) {\n    sysread $fh2, $buf2, $chunk;\n \
  \   $diff++, last CHUNK if $buf1 ne $buf2;\n}\nprint \"$file1 and $file2 differ\"\
  \ if $diff;\n```\n\n### 要记住的事项\n\n- 如果不需要，避免将整个文件读入内存。\n- 使用 `File::Slurp` 快速读取整个文件。\n\
  - 使用 `read` 或 `sysread` 快速读取文件。\n\nptg\n\n### 第 54 条 打开指向字符串的文件句柄\n\n从 Perl 5.6\
