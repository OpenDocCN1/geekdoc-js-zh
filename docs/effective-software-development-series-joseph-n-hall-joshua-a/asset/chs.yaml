  \ 适合你。\n\n`DBI` 模块是 Perl 的抽象数据库接口。它可以与 CSV、Sqlite、PostgreSQL、Oracle、ODBC 或任何其他流行（以及不那么流行）的数据库服务器一起工作。\n\
  \n对于那些不喜欢直接使用 SQL，或者希望在运行时自动生成跨数据库 SQL 的人来说，`DBIx::Class` 是一个非常流行的对象关系映射器。\n\n电子邮件处理可能很困难，但\
  \ Ricardo Signes 和许多其他人投入了大量工作，通过他的 `Email` 模块使其变得简单且正确。你可以发送邮件、解析邮件、处理 MIME 以及做许多其他事情。\n\
  \n\n\n需要从 shell 脚本中获取环境变量并将其导入当前正在执行的 Perl 程序？`Env::Sourced` 只需一条简单的 use 语句即可完成此任务。\n\
  \n下载自 <www.wowebook.com>\n\n## 第 71 条：了解常用模块\n\n使用 Getopt 系列模块可以轻松解析命令行选项。`Getopt::Long`\
  \ 同时处理命令行参数的长格式和短格式，已成为许多基于 Perl 的命令行程序的标准。\n\n由于许多 Web 浏览器的宽容特性，HTML 文档通常结构松散。`HTML::Parser`\
  \ 是一个宽松的解析器，能够处理真实世界 HTML 文档的解构。`HTML::TreeBuilder` 在更高层次上提供了更有用的功能。\n\n`Image::Magick`\
  \ 是一个强大的软件套件，用于使用同名的流行库创建和编辑图像。\n\n有几个模块处理 JavaScript 对象表示法，而 `JSON::Any` 将它们统一在一个通用接口下。\n\
  \n`Log::Log4perl` 是 Java 日志库 log4j 的 Perl 版本。它处理日志消息的所有细节，包括记录哪些消息以及将它们发送到哪里。它使得在运行时轻松打开或关闭调试输入。\n\
  \n`LWP`（libwww-perl）是一组用于 Web 编程的强大模块。对于许多任务，`LWP::Simple` 模块能以最少的麻烦完成你所需的一切。\n\n\
  如果你正在抓取网页或测试网页，你需要看看 `WWW::Mechanize`，它构建在 LWP 之上。这组模块使得在 Web 上爬取 HTML 链接变得轻而易举。\n\
  \n如果你需要进行大量数值计算或科学计算，那么 Perl 数据语言 `PDL` 适合你。它是 Perl 的一种方言，针对快速数学运算进行了优化，并具有自然的语法。\n\
  \n`Moose` 是 Perl 的下一代对象系统。我们希望能在这里多写一些关于它的内容，但它确实值得单独写一本书。如果你正在开始一个新项目，考虑将它作为所有新代码的模型。更多信息请访问\
  \ http://www.iinteractive.com/moose/。\n\n`POE` 是一个多任务和网络框架，它实现并集成事件循环。它允许在 Perl\
  \ 程序中轻松实现事件驱动的协作式多任务。\n\n我们猜想历史学家回顾当今时代时，会认为 Microsoft Excel 是有史以来最有用的软件。你可以使用 `Spreadsheet::ParseExcel`\
  \ 或 `Spreadsheet::WriteExcel` 模块从 Perl 中读取或创建 Excel 文件。\n\n`Template::Toolkit` 是一个用\
  \ Perl 构建的强大模板系统。它与 Catalyst 等 Web 框架集成良好。更多信息请访问 http://template-toolkit.org/。你可能更喜欢\
  \ `Mason` 或 `Text::Template`。无论你选择什么，模板系统通过将数据移出代码，使你的程序设计更加清晰。\n\n解析分隔数据看似简单，但当你开始担心嵌入的分隔符、转义字符和引号时，它就变成了一项不简单的任务。`Text::CSV_XS`\
  \ 消除了解析分隔文件的麻烦，并且速度很快（第 115 条）。这一点非常重要，以至于我们不得不在另一条中重复强调。\n\n在 Perl 中有多种解析 XML 的方法。`XML::Twig`\
  \ 是较为成熟的系统之一。它可以解析完整文档或流式文档，支持 XPath 等。更多信息请访问 http://xmltwig.com/。\n\n`XML::Compile`\
  \ 使用 XML 模式在 XML 和 Perl 之间进行转换。它处理 XML 的所有字母汤，包括 SOAP 和 WSDL。\n\n`YAML` 是一种基于空格的配置语言，受到许多开发者的欢迎。虽然它让我们联想到\
  \ Python，但它仍然是一种值得了解的便捷格式。不过它确实起源于 Perl，所以也不全是坏事。\n\n下载自 <www.wowebook.com>\n\n\
  # 第 8 章 Unicode\n\n世界曾经如此简单。一切都容纳在 7 位中，你无需担心特殊字符或字符集。那时，字符串是字节序列，每个字节代表一个字符。人们习惯了字节和字符是同一回事的想法，每个人都养成了非常糟糕的习惯，这些习惯至今仍在影响编程。我们将把字节称为**八位字节**。\n\
  \n现在你知道字符和字节不是一回事了。为了获得你需要的所有花哨字符，甚至构建新字符所需的片段，你需要使用 Unicode 字符集（有时简称为 UCS）。这本书太小，无法详细讲解\
  \ Unicode 的所有细节，但你至少需要了解一点才能入门。\n\nUnicode 将字符映射到**码点**，这些码点是代表这些字符的数字。正如 Unicode\
  \ 联盟所说：Unicode 为每个字符提供了一个唯一的数字，无论平台、程序或语言如何。¹\n\n例如，字母 **k** 是 U+006B。这就是它的码点。\n\
  \n暂时（或永远）不要考虑存储。那个码点数字只是浮在那里。Unicode 定义了各种**编码**，将码点转换为八位字节，反之亦然。如果可能，不要过多考虑八位字节表示。相信\
  \ Perl 会为你解决这部分问题。\n\n在 Perl 中，你不再只有字符串，而是有**字符串**（字符序列）和**二进制字符串**（你已经熟悉和喜爱的老式八位字节字符串）。Perl\
  \ 可以处理两者，尽管有时你需要小心确保 Perl 将你的数据视为正确的字符串类型。你的目标始终是处理文本类型，让 Perl 处理其余部分。\n\n1. http://www.unicode.org/standard/WhatIsUnicode.html，检索于\
  \ 2010 年 1 月 24 日\n\n下载自 <www.wowebook.com>\n\n不仅如此，还有不同类型的字符串，因为存在不同的**字符集**，例如\
  \ ISO-8859（拉丁）、CP-1251（Windows）或 UCS。在某些时候，Perl 必须将你的字符串存储为八位字节，因为计算机就是这样做的。Perl\
  \ 将字符**编码**为八位字节。UTF-8 是 UCS 的一种可能编码，也是 Perl 内部使用的编码。同样，Perl 将字节**解码**为字符串以进行反向操作。要查看你的\
  \ perl 支持的所有编码，请尝试以下一行命令：\n\n```\nperl -MEncode -le \"print for Encode->encodings(':all')\"\
  \n```\n\nPerl 尽力使大部分编码和解码过程不可见。当 Perl 知道它正在处理字符串时，它大多会按你的预期行事。它按字符计算长度，并在其他字符串操作中按字符思考。\n\
  \n但有时 Perl 无法推断出编码。例如，你可能直接将字符输入到源代码中、从文件中读取或获取网页，而这些来源都没有给 Perl 提供适当的线索。在这些情况下，你必须显式地给\
  \ Perl 提供缺失的线索。\n\n在 Perl 5.8 之前，Perl 对 Unicode 的支持相当薄弱，说得客气一点。许多人试图通过模块提供更好的支持，但考虑到\
  \ Perl 5.6 首次发布于 2000 年初，我们将忽略旧版本。如果你使用的是古老的 Perl，那你就只能靠自己了。加入现代世界吧！\n\n截至撰写本文时，Perl\
  \ 的 Unicode 支持仍然不完整（要获得 100% 的认可需要支持很多内容），但它拥有你所需的大部分功能，你可能不会错过缺失的部分。\n\n最后一点说明：当我们在源代码、字符串等中谈论“Unicode”时，我们指的是\
  \ UTF-8 编码，这是 Perl 内部使用的编码。如果你的编辑器、终端和其他工具配置正确（这取决于你），那么这主要取决于你输入正确的字符。\n\n## 第\
  \ 72 条：在源代码中使用 Unicode。\n\n\n\n\n\n## 第 72 条 在源代码中使用 Unicode\n\n现代 Perl 允许你使用 Unicode\
  \ 编程。你可以直接在程序源代码中输入 Unicode 字符：\n\n```\nprint '我需要更新我的简历';\n```\n\n这段代码可能会遇到几个问题。首先，你的源代码实际使用的是什么编码？你的编辑器会如何保存它？仅凭屏幕上的字符是无法判断的。是\
  \ UTF-8、ISO-8859 还是其他编码？编辑器的保存方式是否重要？\n\n其次，即使你以 UTF-8 格式保存，下一个修改源代码的人可能不会这样做。他的编辑器如何正确处理编码？即使能正确读取，能否正确保存？\n\
  \n最后，运行程序的人可能忘记告诉 Perl 源代码中使用了 Unicode。否则 Perl 如何知道呢？\n\n`utf8`编译指令告诉 Perl 将源代码解析为\
  \ UTF-8（仅此而已）。以下示例包含一个土耳其语字符串：\n\n```\nuse utf8;\nprint 'Bu iş kârlı'; # '这项业务有利可图'\n\
  ```\n\n你甚至可以在标识符中使用 Unicode。这对于那些经常需要在公式中拼写希腊字母的人来说特别方便：\n\n```\nuse utf8;\nuse\
  \ Math::Trig;\nbinmode STDOUT, ':utf8';\nmy $π = 3.14159265;\nmy $θ = $π / 2;\n\
  printf \"cos(θ) 的值为 %.2f\\n\", cos( $θ );\nprintf \"sin(θ) 的值为 %.2f\\n\", sin( $θ\
  \ );\nmy $α = atan( 1, 1 ) * 180 / $π;\nprintf \"角度为 %.2f\\n\", $α;\n```\n\n包名或子程序名不能这样做，因为它们都需要是有效的文件名（具有往返保证）。例如，包名`Foo::Bar`会转换为`Foo/Bar.pm`，而`AutoSplit`会将子程序名转换为`Foo/Bar/auto/some_sub.al`。在某些子程序名中，你或许可以使用非\
  \ ASCII 字符。例如，你可以将`π`用作常量子程序而不会报错，但这是未定义行为：\n\n```\nsub π () { 3.14159265 }\nprint\
  \ \"π 的值为 \", π, \"\\n\";\n```\n\n然而，如果你尝试使用雪人字符（U+2603），☃，事情可能不会顺利：\n\n```\nsub\
  \ ☃ () { 'snowman' }\n```\n\n错误信息很奇怪，不会立即指向原因：`Illegal declaration of anonymous\
  \ subroutine ...`\n\n`utf8`编译指令是词法作用域的。如果你只想让 Perl 将源代码的一部分解释为 UTF-8，可以在作用域内启用它：\n\
  \n```\n{\n    use utf8;\n    print 'Hyvää päivää'; # 芬兰语\"早上好\"\n}\n```\n\n同样，如果你不想让\
  \ Perl 将源代码的一部分视为 UTF-8，可以在作用域内关闭它：\n\n```\n{\n    no utf8;\n    print 'Hyvää päivää';\
  \ # 现在无法保证！\n}\n```\n\n`utf8`编译指令只告诉 Perl 将源代码解释为 UTF-8。它不会影响输入或输出流，也不会影响其他任何东西（参见第\
  \ 73 条）。它也不会强制你的编辑器或 IDE 做任何特殊处理，也不会对其他工具施加任何魔法。\n\n### 要点\n\n- 使用`utf8`编译指令在源代码中使用\
  \ Unicode 字符。\n- 当部分源代码不是 Unicode 时，取消导入`utf8`。\n- 标识符（子程序和包名除外）可以包含非 ASCII 字符。\n\
  \n## 第 73 条 告诉 Perl 使用哪种编码\n\n当你开始以旧式编程习惯使用 Unicode 时，很可能会看到关于“Wide character in\
  \ . . .”的警告，即 Perl 期望的是 ASCII 字符，却得到了其他内容。\n\n修复这个问题相当简单。你只需告诉文件句柄它们应该使用哪种编码。即使没有看到任何警告，但输入或输出似乎出现乱码，你也需要注意如何告诉\
  \ Perl 处理文件句柄。\n\n仅仅让 Perl 知道你在程序源代码中直接使用了 Unicode 是不够的。当它将这些数据发送给其他程序时，你还需要确保下一个程序能以正确的编码看到这些数据。Perl\
  \ 必须正确编码你的数据，以便数据的下一个消费者能正确解码。\n\n### 设置默认编码\n\n你可以使用`open`编译指令为所有流设置编码。如果你想为所有输入和输出文件句柄使用相同的默认编码，可以同时使用`IO`设置：\n\
  \n```\nuse open IO => ':utf8';\n```\n\n你可以仅为输出句柄设置默认编码，使用`OUT`设置：\n\n```\nuse open\
  \ OUT => ':utf8';\n```\n\n类似地，你可以为所有输入文件句柄设置所需的编码：\n\n```\nuse open IN => ':utf8';\n\
  ```\n\n你甚至可以在同一个`open`调用中分别为输入和输出流设置默认编码：\n\n```\nuse open IN => \":cp1251\", OUT\
  \ => \":shiftjis\";\n```\n\n`-C`开关告诉 Perl 启用各种 Unicode 特性。你可以通过指定所需的特性来选择性启用，而无需修改源代码。如果使用该开关而不带任何说明符，Perl\
  \ 会为所有标准文件句柄以及你自己打开的任何句柄使用 UTF-8：`perl -C program.pl`\n\n你可以更精细地应用`-C`。通过设置`PERL_UNICODE`环境变量可以达到与`-C`相同的效果。详细信息请参阅`perlrun`文档。\n\
  \n### 在选定的文件句柄上设置编码\n\n对于特定的文件句柄，你可以使用`binmode`的双参数形式指定所需的编码：\n\n```\nbinmode STDOUT,\
  \ ':utf8';\nbinmode STDIN, ':utf8';\n```\n\n你也可以在打开文件句柄时进行设置。一般情况下，你需要使用`encoding(...)`来指定：\n\
  \n```\nopen my ($out_fh), '>:encoding(UTF-8)', $filename or die;\nopen my ($in_fh),\
  \ '<:encoding(koi8-r)', $filename or die;\n```\n\n`open`为 UTF-8 提供了一个特殊快捷方式：\n\n\
  ```\nopen my ($out_fh), '>:utf8', $filename or die;\nopen my ($in_fh), '<:utf8',\
  \ $filename or die;\n```\n\n你可以指定 Perl 支持的任何编码：\n\n```\nopen my ($out_fh), '>:encoding(iso-8859-1)',\
  \ $file or die;\n```\n\n### 要点\n\n- 在所有文件句柄上指定编码。\n- 使用`open`编译指令为所有文件句柄设置默认编码。\n\
  - 使用`binmode`为单个文件句柄设置编码。\n\n## 第 74 条 通过码点或名称指定 Unicode 字符\n\n你不必在字符串中直接输入字面字符。Perl\
  \ 提供了多种方式让你将正确的字符放入数据中。对于`0x00`到`0xFF`的字符，你可以使用常规的 Perl 语法，以八进制或十六进制表示：\n\n```\n\
  my $CRLF = \"\\015\\012\";\nmy $CRLF = \"\\x0D\\x0A\";\n```\n\n要创建`0xFF`以上的字面 Unicode\
