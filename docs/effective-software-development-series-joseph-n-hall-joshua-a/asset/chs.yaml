  \n你也可以在程序文本内部启用特性。使用 `use` 指令后跟 Perl 版本，不仅可以确保人们使用兼容的版本运行你的程序（第 83 条），还可以启用该版本的新特性：\n\
  \n```\nuse 5.010; # 使用直到 5.10 的新特性\n```\n\n从 Perl 5.12 开始，你可以通过要求该版本或更高版本来自动启用严格模式（第\
