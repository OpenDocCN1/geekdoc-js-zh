  ).css(\"opacity\", .5); }\n41 }\n```\n\n**9.** 保存所有三个文件，然后在网页浏览器中打开 HTML 文档。尝试点击\
  \ Lessons 和 Docs 按钮，查看动态显示的元素。尝试 Fade 按钮，使内容淡入和淡出。\n\n### 清单 10.4 web_element_manipulation.html\
