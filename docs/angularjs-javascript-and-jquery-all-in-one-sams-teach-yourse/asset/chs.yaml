  \n13. 选择 Run、Run As、Node Application。你应该会看到单词“Hello”打印到控制台窗口，如图 1.10 所示。\n\n   \
  \ ![Image](img/image00777.jpeg)\n\n    **图 1.10** 在 Eclipse 中运行 JavaScript 应用程序。\n\
  \nEclipse 现已设置完毕，你可以开始进行 JavaScript 开发了。\n\n> **注意：** 你也可以通过在控制台提示符下输入以下命令来运行 JavaScript\
  \ 应用程序：\n> \n> ```\n> node <path_to_JavaScript_file>\n> ```\n\n### 使用 Node.js 创建\
  \ Express Web 服务器\n\nNode.js 是一个高度模块化的平台，这意味着 Node.js 本身提供了一个非常高效且可扩展的框架，而外部模块则用于实现大部分所需功能。因此，Node.js\
  \ 提供了一个非常友好的接口来添加和管理这些外部模块。\n\nExpress 就是这些模块之一。Express 模块提供了一个易于实现的 Web 服务器，具有丰富的功能集，例如静态文件、路由、Cookie、请求解析和错误处理。\n\
  \n将 Node.js 用作 Web 开发服务器的最佳方式是使用 Express 模块。在以下练习中，你将构建一个 Node.js/Express Web 服务器，并用它来提供静态文件。\n\
  \n按照以下步骤构建并测试一个能够支持静态文件和服务器端脚本的 Node.js/Express Web 服务器：\n\n1. 打开控制台提示符，导航到你在本书中创建项目文件夹的位置。如果你不知道路径，请在\
  \ Eclipse 中右键单击项目，从菜单中选择 Properties。然后选择 Resource，项目文件夹的完整路径将显示在右侧的 Location 字段中。\n\
  \n2. 在项目文件夹的控制台提示符下，执行以下命令，如图 1.11 所示。该命令会将 Node.js 的 Express 模块 4.6.1 版本安装到名为 node_modules\
  \ 的子文件夹中：\n\n    ```\n    npm install express@4.6.1\n    ```\n\n    ![Image](img/image00778.jpeg)\n\
  \n    **图 1.11** 从控制台提示符安装 Node.js 的 Express npm 模块。\n\n    > **注意：** Node 有时在某些系统上无法自动创建用于存储模块的文件夹。你可能会看到类似以下的错误消息。如果出现这种情况，请在指定的路径中创建\
  \ npm 文件夹，然后 npm install 命令应该可以正常工作：\n    > \n    > 点击此处查看代码图片\n    > \n    > ```\n\
  \    > Error: ENOENT, s≠tat 'C:\\Users\\Brad\\AppData\\Roaming\\npm'\n    > node\
  \ <path_to_JavaScript_file>\n    > ```\n\n3. 执行以下命令安装 Node.js 的 body-parser 模块。该模块可以解析\
  \ HTTP GET 和 POST 请求中的查询参数和请求体。该命令会将 Node.js 的 body-parser 模块 1.6.5 版本安装到名为 node_modules\
  \ 的子文件夹中：\n\n    ```\n    npm install body-parser@1.6.5\n    ```\n\n\n\n\n\n**4.**\
  \ 返回 Eclipse，右键点击项目，选择“刷新”。你应该会看到 `node_modules` 文件夹，其中包含 `body-parser` 和 `express`\
  \ 子文件夹。\n\n**5.** 在项目目录的根目录下创建一个名为 `server.js` 的文件，将清单 1.5 中的内容放入其中，然后保存。这是一个基本的\
  \ Node.js/Express Web 服务器，它将使用项目目录的根目录作为网站根位置来提供静态文件。\n\n**6.** 验证你的 Node.js Web\
  \ 服务器能否正常运行。右键点击 `server.js` 文件，从菜单中选择“运行方式” -> “Node 应用程序”来启动 Web 服务器。控制台窗口（如图\
  \ 1.12 所示）应显示 `server.js` 文件正在运行，并提供一个红色方框用于停止服务器。如果你在 Eclipse 中运行了多个应用程序，可以点击“控制台选择”按钮来选择特定的控制台，如图\
  \ 1.12 所示。\n\n![Image](img/image00779.jpeg)\n\n**图 1.12** 在 Eclipse 中运行 JavaScript\
  \ 应用程序。\n\n**7.** 在 Web 浏览器中访问以下地址来访问服务器。由于 Web 服务器使用 `./` 路径提供静态文件，浏览器中应显示 `server.js`\
  \ 文件的实际内容：\n\n`localhost/server.js`\n\n**8.** 点击控制台窗口中的红色方框来停止 Web 服务器。\n\n* * *\n\
  \n注意\n\n如果你不熟悉 Eclipse，应该花点时间练习同时启动和停止服务器以及运行 `first.js` 应用程序，以了解如何启动和停止应用程序，以及如何在控制台窗口中的多个应用程序之间切换。\n\
