  \ *\n\n* * *\n\n### 验证表单\n\n\n\n\n网页表单最重要的部分之一是验证输入的信息。根据输入的数据类型，验证有多种不同的类型和级别。\n\
  \n例如，有些元素完全是可选的，不需要验证。另一些元素，比如评论，可能是必填的，但内容并不重要。还有一些元素，比如电子邮件地址或日期，可能是必填的，并且必须符合特定的格式要求，甚至可能还有数值范围。\n\
  \n通常，这是由服务器端脚本完成的。这种方法的问题在于，所有数据都必须发送到服务器，然后生成错误信息并返回给用户。\n\n更好的做法是在数据提交到服务器之前，在\
  \ jQuery 代码中验证表单数据。以下各节描述了验证表单数据的不同方法。\n\n## 手动验证网页表单\n\n最基本的表单验证方式是访问表单元素的值，并根据要求检查实际内容。这可以在用户输入数据时通过添加例如\
  \ `blur`、`change` 或 `keypress` 事件处理程序来实现，然后在事件处理程序中检查数据的值。以下代码在 `keypress` 处理程序中实现了验证，检查表单元素的值是否为数字，如果不是，则向标签添加警告文本：\n\
  \n```javascript\n$(\"input:text\").keypress(function (){\n    if(!$.isNumeric($(this).val()))\
  \ {\n      $(\"#validLabel\").html(\"Not a Number\"));\n    }\n  });\n```\n\n你也可以在用户提交表单时通过将验证添加到\
  \ `submit` 处理程序来实现。例如，以下代码向提交处理程序添加了一个验证函数，如果元素不以文本 `\"vfx\"` 开头，则显示一个 `alert` 并且不提交表单：\n\
  \n```javascript\n$(\"form\").submit(function (){\n    if (!$(\"#vfxField\").val().match(\"\
  ^vfx\")){\n      alert(\"Invalid vfx element\");\n      e.preventDefault();\n  \
  \  }\n  });\n```\n\n## 获取 jQuery 验证插件\n\n使用前面章节中的技术，你可以验证几乎任何类型的表单元素。问题在于添加验证需要大量的代码和时间。与其重新发明轮子，不如使用\
  \ jQuery 验证插件，它可以处理大部分验证需求。\n\n作为一个插件，验证器通过在加载 `jQuery.js` 文件之后加载 `.js` 文件来实现。例如：\n\
  \n```html\n<script type=\"text/javascript\" src=\"../js/jquery.min.js\"></script>\n\
  <script type=\"text/javascript\" src=\"js/jquery.validate.min.js\"></script>\n```\n\
  \n该插件可以从以下网址下载：\n\n[`http://jqueryvalidation.org/`](http://jqueryvalidation.org/)\n\
  \n验证插件的文档可以在以下网址找到：\n\n[`http://docs.jquery.com/Plugins/Validation/`](http://docs.jquery.com/Plugins/Validation/)\n\
  \n## 使用 HTML 应用简单的 jQuery 验证\n\n验证器可以通过在 HTML 中使用 `class` 和 `title` 属性来实现。验证器使用一组规则（例如\
  \ `required` 或 `email`）来验证表单元素。将 `class` 属性设置为这些规则中的一个或多个，当在表单上调用 `.validate()`\
  \ 时，就会应用验证。表 13.3 列出了几个验证规则。\n\n![Image](img/image00924.jpeg)![Image](img/image00925.jpeg)\n\
  \n**表 13.3 验证规则及用法**\n\n例如，要验证文本元素包含文本且为电子邮件格式，可以使用以下代码：\n\nHTML：\n\n```html\n<form\
  \ id=\"myForm\">\n  <input type=\"text\" class=\"required email\" />\n</form>\n\
  ```\n\njQuery：\n\n```javascript\n$(document).ready(function(){\n    $(\"#myForm\"\
  ).validate();\n  });\n```\n\n`.ready()` 函数将验证添加到表单，当用户在元素中输入时，如果元素为空，则会显示“此元素为必填项”的消息；如果元素不包含有效的电子邮件地址，则会显示“需要有效的电子邮件地址”，如图\
  \ 13.6 所示。\n\n![Image](img/image00926.jpeg)\n\n**图 13.6** 电子邮件元素的验证消息。\n\n你也可以添加自定义文本消息，而不是使用验证库提供的默认消息。这可以通过将\
  \ `title` 属性设置为你想要显示的消息字符串来实现。例如，以下输入语句添加了 `title` 元素，当元素无效时会显示该消息：\n\n```html\n\
  <input type=\"text\" class=\"required email\"\n  title=\"This Element requires a\
  \ valid Email Address such as name@here.com\"/>\n```\n\n## 应用复杂验证\n\n使用验证库添加验证的更好方法是在\
  \ jQuery 的 `validate` 方法内部进行。`validate` 方法接受一个对象，该对象定义了如何验证表单。本节介绍如何使用 `rules` 和\
  \ `messages` 的值。验证对象支持多个属性；你可以查看文档了解其余属性。\n\n### 添加验证规则\n\n`rules` 方法允许你通过引用元素的\
  \ `name` 属性来定义适用于该元素的不同规则（列于表 13.3）。例如，以下代码使用验证器对象向 `name=\"emailField\"` 的元素添加了\
  \ `required` 和 `email` 规则：\n\nHTML：\n\n```html\n<form id=\"myForm\">\n  <input type=\"\
  text\" name=\"emailField\" />\n</form>\n```\n\njQuery：\n\n```javascript\n$(document).ready(function(){\n\
  \    $(\"#myForm\").validate({\n        emailField: {\n          required:true,\n\
  \          email:true\n        }\n      );\n  });\n```\n\n> **提示**\n> \n> `validate()`\
  \ 方法接受一个 `debug` 选项，该选项会禁用表单提交，允许你在不向服务器提交数据的情况下实现和测试表单验证。要实现表单验证调试模式，请使用以下代码：\n\
  > \n> ```javascript\n> $(form).validate({\n>   debug:true,\n>   other options .\
  \ . .\n> });\n> ```\n\n### 添加验证消息\n\n验证对象的 `messages` 属性允许你指定自定义消息，这些消息将应用于元素的各个规则。`messages`\
  \ 属性也基于元素的 `name` 属性。以下代码演示了如何向验证添加消息：\n\n```javascript\n$(document).ready(function(){\n\
  \  $(\"#simpleForm\").validate(\n    {rules: {\n      emailField: {\n        required:true,\n\
  \        email:true,\n        accept:\"jpg|cvs\"\n        }\n      },\n      messages:\
  \ {\n        emailField: {\n          required:\"Must add Email\",\n          email:\"\
  Email format = me@here.com\"\n        }\n      }\n    }\n  );\n});\n```\n\n`.validate()`\
  \ 方法返回一个 `Validator` 对象，该对象提供了几个对检查表单验证非常有用的方法。表 13.4 列出了 `Validator` 对象可用的方法。以下代码演示了如何使用\
  \ `Validator` 对象通过调用 `.form()` 方法来检查表单的有效性：\n\n```javascript\n$(document).ready(function(){\n\
  \  var validator = $(\"#simpleForm\").validate( ...);\n  if(!validator.form()){\
  \ alert(\"Form is not valid\"));\n});\n```\n\n![Image](img/image00927.jpeg)\n\n\
  **表 13.4 Validator 对象方法**\n\n当在表单元素中检测到错误时，会向表单添加一个标签来显示错误消息。插件会向元素和用于显示消息的新标签添加一个名为\
  \ `error` 的类。这使得样式化消息以及元素变得非常容易。\n\n\n\n\n\n要为元素设置样式，你可以为元素类型添加一条 CSS 规则，并加上 `.error`\
  \ 类。例如，要为有错误的 `input` 元素设置红色文本显示，可以使用以下 CSS 规则：\n\n```css\ninput.error { color:red;\
  \ }\n```\n\n你可以使用相同的方法，通过 `label.error` 选择器为显示的错误消息设置样式。例如，以下代码将错误消息的字体颜色设置为红色：\n\
  \n```css\nlabel.error { color:red; }\n```\n\n### 放置验证消息\n\n验证插件会将错误消息直接放在被验证元素的后面。这通常不是理想的位置。例如，你可能希望验证消息出现在某些元素之前，或者完全不同的位置。\n\
  \n---\n\n> **注意**  \n> jQuery Validation 工具提供了一种简单的方法来本地化 Web 表单验证。如果你包含了本地化文件夹中的\
  \ `messages_##.js` 文件，验证错误消息将被本地化。`messages_##.js` 中的两位数字（`##`）代表两位字符的 ISO 国家代码。\n\
  \n---\n\n一个很好的例子是单选按钮组。如果你验证该组，消息会出现在第一个单选输入元素之后，如图 13.7 所示。这不是理想的位置。相反，你希望错误消息出现在所有单选输入及其标签之后。\n\
  \n![图片](img/image00928.jpeg)\n\n**图 13.7** 在 `.validate()` 方法中使用 `errorPlacement`\
  \ 选项，可以定义错误消息的放置位置。\n\n这时，`Validation` 对象的 `errorPlacement` 属性就派上用场了。`errorPlacement`\
  \ 属性的值是一个函数，该函数被调用来向 Web 表单添加错误元素。`errorPlacement` 函数将接收两个参数。第一个参数是代表新错误消息的 jQuery\
  \ 对象，第二个是代表验证失败的元素的 jQuery 对象。利用这些参数，你可以定义自己的函数，将元素放置在任何你想要的位置。\n\n为了说明这一点，请看以下代码。`errorPlacement`\
  \ 被设置为一个接收 `error` 和 `element` 参数的函数。检查 `element` 是否为单选按钮。如果 `element` 是单选输入，则在表单中最后一个单选输入之后的标签后面插入\
  \ `error`，如图 13.7 所示。如果 `element` 不是单选输入，则立即在 `element` 之后插入 `error`：\n\n```javascript\n\
  $(\"#simpleForm\").validate({\n  rules: {\n    gender: {required:true}\n  },\n \
  \ errorPlacement: function(error, element){\n    if (element.is(\":radio\")){\n\
  \      error.insertAfter($(\"input:radio:last\").next(\"label\"))\n    }\n    else\
  \ {error.insertAfter(element)}\n  }\n});\n```\n\n---\n\n## 动手试一试：使用 jQuery 验证 Web\
  \ 表单\n\n在本例中，你将使用 jQuery 验证插件来验证一个基本的 Web 表单。本示例的目的是帮助你理解如何在自己的脚本中实现验证插件。\n\n示例代码见清单\
  \ 13.10、13.11 和 13.12。按照以下步骤创建带验证的 Web 表单：\n\n**1.** 在 Eclipse 中，创建 `lesson13/form_validation.html`、`lesson13/js/form_validation.js`\
  \ 和 `lesson13/css/form_validation.css` 文件。\n\n**2.** 添加验证插件。你可以从以下位置下载插件，或者将本书网站上的\
  \ `code/lesson13/js/jquery.validation.min.js` 文件复制到项目中的 `lesson13/js/jquery.validation.min.js`：\n\
  \n[`http://jqueryvalidation.org/`](http://jqueryvalidation.org/)\n\n你还需要在清单 13.10\
  \ 中添加以下行来加载验证插件：\n\n```html\n07     <script type=\"text/javascript\" src=\"js/jquery.validate.min.js\"\
  ></script>\n```\n\n**3.** 将清单 13.10 和清单 13.12 中的代码添加到 HTML 和 CSS 文件中。HTML 是一个基本表单，不应包含任何意外内容。CSS\
  \ 确实包含一些针对验证代码的特定格式。第 3 行将 `<input>` 和 `<select>` 元素格式化为红色背景和文本，使其突出显示。第 4 行将消息格式化为红色文本：\n\
  \n```css\n03 input.error, select.error{ background-color:#FFDDDD; color:darkred}\n\
  04 label.error{color:red;}\n```\n\n**4.** 打开 `form_validation.js` 文件，创建一个基本的 `.ready()`\
  \ 函数来实现以下步骤中的处理程序。同时，按如下所示在表单上添加一个 `.validate()` 调用。包含 `rules`、`messages` 和 `errorPlacement`\
  \ 部分。注意，第 2 行定义了 `validationObj` 对象变量，以便稍后使用：\n\n```javascript\n02   var validationObj\
  \ = $(\"#simpleForm\").validate({\n03     rules: {\n. . .\n12     messages: {\n\
  . . .\n17     errorPlacement: function(error, element){\n. . .\n23   });\n```\n\n\
  **5.** 为表单元素添加以下验证规则。所有元素都通过元素的 `name` 属性引用。`password1` 元素有三个规则：`required`、`rangelength`\
  \ 和 `equalTo`。`equalTo` 设置为 `password2` 元素的 `id` 属性。`weapon` 元素使用 `[2,2]` 的 `rangelength`，强制用户恰好选择两种武器：\n\
  \n```javascript\n04       name: { required:true, minlength:5 },\n05       email:\
  \ { required:true, email:true },\n06       password1: { required:true, rangelength:[6,12],\n\
  07                    equalTo:\"#password2\" },\n08       birthDate: { required:true,\
  \ date:true },\n09       class: { required:true, rangelength:[2,2]},\n10       hands:\
  \ {required:true},\n11       armor: {required:true, minlength:2 }},\n```\n\n**6.**\
  \ 添加以下自定义消息，使 `password`、`weapon` 和 `armor` 元素的提示更具体：\n\n```javascript\n13     \
  \    password1: { equalTo:\"密码不匹配\"},\n14         class: { rangelength:\"请选择 2 个职业类型\"\
  },\n15         armor: { minlength:\"至少需要 2 件护甲\"},\n```\n\n**7.** 完成 `errorPlacement`\
  \ 函数。有一个 `hands` 的单选按钮组和一个 `armor` 的复选框组。你希望错误消息显示在组中最后一个元素的 `<label>` 之后，因此修改 `.insertAfter()`\
  \ 方法，查询最后一个 `checkbox` 或 `radio`，然后获取紧随其后的 `label`：\n\n```javascript\n17     errorPlacement:\
  \ function(error, element){\n18       if (element.is(\":radio\")){\n19         error.insertAfter($(\"\
  input:radio:last\").next(\"label\"))}\n20       else if (element.is(\":checkbox\"\
  )){\n21         error.insertAfter($(\"input:checkbox:last\").next(\"label\"))}\n\
  22       else {error.insertAfter(element)}}\n```\n\n**8.** 添加以下行。第 23 行验证表单，这将在页面加载后显示要求。第\
  \ 24 和 25 行是一个提交处理程序。该处理程序通过调用 `.form()` 检查表单是否有效。如果表单无效，则显示一条警告消息，并通过 `.preventDefault()`\
  \ 阻止提交：\n\n```javascript\n24   validationObj.form();\n25   $(\"form\").submit(function(e){\n\
  26     if(!validationObj.form()){\n27       alert(\"表单错误\");\n28       e.preventDefault();\
  \ } });\n```\n\n\n\n\n\n**9.** 保存所有三个文件，然后在网页浏览器中打开 HTML 文档，如图 13.8 所示。你应该会立即看到验证错误。观察填写表单时错误的变化和消失。同时尝试在有错误和无错误的情况下提交表单，以查看提示消息。\n\
