  \  \n\n## 第 18 课：使用 jQuery UI 交互组件实现高级交互  \n\n**本课你将学到：**  \n\n![Image](img/image00767.jpeg)\
  \ 实现拖放功能  \n\n![Image](img/image00767.jpeg) 使元素及其子元素可调整大小  \n\n![Image](img/image00767.jpeg)\
  \ 如何使用边界框选择多个页面元素  \n\n![Image](img/image00767.jpeg) 创建可排序的表格、列表和容器  \n\n一组特殊的 jQuery\
  \ UI 组件旨在为各种元素提供通用交互。这些组件允许你将元素设置为可拖放，并提供排序、框选和调整大小功能。  \n\njQuery UI 交互组件可以附加到元素上，以提供丰富的预定义交互。以下各节将介绍不同的交互组件以及如何在网页中实现它们。\
  \  \n\n### 介绍 jQuery UI 交互  \n\n所有 jQuery UI 交互都基于两个主要组件——`jQuery.widget` 工厂和鼠标组件。`jQuery.widget`\
  \ 工厂为所有组件提供基础功能，包括创建、禁用、启用和选项设置。鼠标组件提供与组件的基础鼠标交互，捕获鼠标事件并允许组件与之交互。  \n\n#### 回顾 jQuery.widget\
  \ 工厂  \n\n`jQuery.widget` 工厂定义了一个接口，所有 jQuery UI 组件都使用该接口。工厂的选项、方法和事件对所有组件都可用。表\
  \ 18.1 列出了工厂中定义并在所有组件中可用的方法和事件。  \n\n![Image](img/image00961.jpeg)  \n\n**表 18.1\
  \ 所有 jQuery UI 组件可用的方法和事件**  \n\n你可以在 [`api.jqueryui.com/jQuery.widget/`](http://api.jqueryui.com/jQuery.widget/)\
  \ 获取有关 `jQuery.widget` 工厂的更多信息。  \n\n#### 理解鼠标交互组件  \n\n鼠标交互组件会自动应用于所有组件。通常，你不需要过多地与之交互。然而，它确实暴露了一些有时非常有用的选项。这些选项如下：\
  \  \n\n![Image](img/image00767.jpeg) cancel——取消特定元素的交互。例如，要取消 `#item1` 中具有 `class=\"\
  label\"` 的元素的鼠标交互，请使用以下代码：  \n\n点击此处查看代码图片  \n\n```  \n$( \"#item1\" ).mouse( \"\
  option\", \"cancel\", \".label\" );  \n```  \n\n![Image](img/image00767.jpeg) delay——延迟\
  \ `mousedown` 事件发生后到交互开始的时间。例如，要为 `#item2` 的鼠标交互添加 1 秒延迟，请使用以下代码：  \n\n点击此处查看代码图片\
  \  \n\n```  \n$( \"#item2\" ).mouse( \"option\", \"delay\", 1000 );  \n```  \n\n\
  ![Image](img/image00767.jpeg) distance——指定 `mousedown` 事件发生后，鼠标必须移动多少像素（以像素为单位）交互才能开始。例如，要将\
  \ `#item3` 的鼠标交互距离设置为 10 像素，请使用以下代码：  \n\n点击此处查看代码图片  \n\n```  \n$( \"#item3\" ).mouse(\
  \ \"option\", \"distance\", 10 );  \n```  \n\n### 使用拖放组件  \n\n现在你已经回顾了组件接口和鼠标交互组件，可以开始了解一些最常见的\
  \ jQuery UI 组件——可拖动和可放置组件。这些组件设计为协同工作。  \n\n你可以将一个元素定义为可拖动，另一个定义为可放置。当可拖动元素被放置到可放置组件上时，你可以应用\
  \ JavaScript 和 jQuery 代码来提供你想要的任何用户交互。  \n\n#### 使用可拖动组件拖动元素  \n\n可拖动组件通过按住鼠标并移动来将元素定义为可拖动。这允许你将元素移动到屏幕上任意位置。\
  \  \n\n可拖动组件会处理滚动元素，并提供多个选项来控制拖动时的外观和感觉。表 18.2 描述了更常见的可拖动选项。以下示例展示了如何将 `draggable`\
  \ 组件附加到具有 `cursor` 和 `opacity` 选项的元素上：  \n\n点击此处查看代码图片  \n\n```  \n$(\"#img1\").draggable({cursor:\"\
  move\", opacity:.5});  \n```  \n\n![Image](img/image00962.jpeg)  \n\n**表 18.2 常见的可拖动组件选项**\
  \  \n\n可拖动组件还提供了额外的事件，以便在拖动开始、进行中和停止时，可以将处理程序附加到元素上。表 18.3 列出了你可以在可拖动项目上访问的事件。以下示例展示了如何添加\
  \ `dragstop` 事件，以便在项目被放置时应用 `bounce` 效果：  \n\n点击此处查看代码图片  \n\n```  \n$(\"#drag1\"\
  ).draggable({cursor:\"move\", opacity:.5});  \n\n$(\"#drag1\").on(\"dragstop\",\
  \ function(){$(this).effect(\"bounce\", 1000); });  \n```  \n\n![Image](img/image00963.jpeg)\
