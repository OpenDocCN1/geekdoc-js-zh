  \n![Image](img/image00948.jpeg)\n\n**图 16.3** 简单的 jQuery UI 日期选择器。\n\n**清单 16.1**\
  \ `date_picker.html` HTML 文档，添加 jQuery UI 库并渲染日期选择器\n\n点击此处查看代码图片\n\n---\n\n```html\n\
