  \ CSS。\n\n# 第四部分：利用 jQuery UI\n\n## 第 16 课 介绍 jQuery UI\n\n本课学习内容：\n\n![Image](img/image00767.jpeg)\
  \ 如何下载并添加 jQuery UI 库\n\n![Image](img/image00767.jpeg) 如何创建自定义 jQuery UI 主题\n\n\
  ![Image](img/image00767.jpeg) jQuery UI 相对于单独使用 jQuery 提供的新功能\n\n![Image](img/image00767.jpeg)\
  \ 使用 jQuery UI 选择器\n\n![Image](img/image00767.jpeg) 如何使用 jQuery UI 动态定位 UI 元素\n\n\
  jQuery UI 是一个构建在 jQuery 之上的附加库。jQuery UI 的目的是提供一组可扩展的交互、效果、小部件和主题，使您能够更轻松地在网页中融入专业的\
  \ UI 元素。在本课中，您将有机会下载 jQuery UI 并将其应用到一些网页中。本课的目的是向您介绍 jQuery 如何与 HTML、CSS、jQuery\
  \ 和 JavaScript 交互。\n\n### jQuery UI 入门\n\n\n\n\njQuery UI 由两部分组成：JavaScript 和 CSS。JavaScript\
  \ 部分扩展了 jQuery，增加了专门用于添加 UI 元素或对这些元素应用效果的额外功能。CSS 部分则对页面元素进行样式化，使开发者无需每次都重新设计样式。\n\
  \njQuery UI 通过提供预构建的 UI 元素（如日历和菜单）以及交互功能（如拖拽和调整大小）来节省开发者的时间，这些功能开箱即用。以下章节将向您介绍该库；您将学习如何下载并将其应用到您的项目中。\n\
  \njQuery UI 库由多个组件组成，这些组件用于构建、管理和与网页上的 UI 元素进行交互。这些元素可以分为以下几类：\n\n![Image](img/image00767.jpeg)\
  \ **JavaScript**——jQuery UI 自带一个 `.js` 文件，该文件与主 jQuery 库挂钩。此文件必须与 jQuery 一起加载到您的网页中，以实现\
  \ jQuery UI 组件。\n\n![Image](img/image00767.jpeg) **CSS**——jQuery UI 包含多个 CSS 文件。主要文件是\
  \ `jquery-ui.css`。这些文件包含所有与 jQuery UI 相关的 CSS 设置，特别是所代表的主题。\n\n![Image](img/image00767.jpeg)\
  \ **图像**——jQuery 还提供了多个用于构建某些 UI 组件的图像。\n\n#### 获取 jQuery UI 库\n\n您可以通过两种方式之一在项目中实现\
  \ jQuery UI。如果您想使用已提供的特定主题，可以在 jQuery CDN 位置 [`code.jquery.com`](https://code.jquery.com)\
  \ 的 jQuery UI 部分中选择一个主题。\n\n例如，以下代码行从 jQuery CDN 位置加载 jQuery UI 库和 Smoothness 主题：\n\
  \n点击此处查看代码图片\n\n```html\n<script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"\
  ></script>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n```\n\n您也可以下载该库以及自定义主题，并将其存储在您自己的 Web 服务器上。在这种情况下，您将使用自己的位置作为 `src` 和 `href`\
  \ 属性的值，而不是 CDN 位置来引用 `jquery-ui.js` 和 `jquery-ui.css` 文件。\n\n可以通过选择要包含的选项（如图 16.1\
  \ 所示）并点击底部的“下载”按钮，从以下位置下载 jQuery 库。这将下载 jQuery UI 文件：\n\n[`http://jqueryui.com/download`](http://jqueryui.com/download)\n\
  \n![Image](img/image00946.jpeg)\n\n**图 16.1** 使用 jQuery UI 下载构建器构建并下载自定义版本的 jQuery\
  \ UI。\n\n#### 使用 ThemeRoller 创建自定义主题\n\n除了基本的 jQuery UI 主题外，您还可以使用 jQuery UI ThemeRoller（如图\
  \ 16.2 所示）来选择一些不同的自定义主题或自定义您自己的主题。主题定义了应用于 jQuery UI 小部件和元素的颜色、边框半径以及其他多种样式。\n\n\
  ![Image](img/image00947.jpeg)\n\n**图 16.2** 使用 jQuery UI ThemeRoller 定义自定义主题。\n\n\
  要访问 jQuery UI ThemeRoller：\n\n1. 在浏览器中打开以下 URL：\n\n   [`jqueryui.com/download/`](http://jqueryui.com/download/)\n\
