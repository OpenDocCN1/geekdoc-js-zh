  \ background-color:#BBDDFF; }\n```\n\n* * *\n\n### 使用可调整大小部件调整元素大小\n\n用户经常需要定义图像、列表、表格等元素的大小和形状。`resizable`\
  \ 部件提供了通过鼠标控制轻松调整图像大小的能力。这允许用户按需调整页面元素的大小。\n\n`resizable` 部件会向页面元素附加多个手柄控件，这些控件与鼠标交互以调整元素大小。你也可以同时调整其他元素的大小。\n\
  \n表 18.6 描述了更常用的可调整大小选项。以下示例展示了如何将 `resizable` 部件附加到元素上，并将 `aspectRatio` 设置为 `true`：\n\
  \n点击此处查看代码图片\n\n```\n$(\"#div1\"). resizable ({aspectRatio:true});\n```\n\n![Image](img/image00968.jpeg)\n\
  \n**表 18.6 常用可调整大小部件选项**\n\n`resizable` 部件还提供了额外的事件，以便在调整大小时将处理程序附加到元素上。表 18.7 列出了可调整大小元素上可访问的事件。以下示例展示了如何添加\
  \ `resizestop` 事件，以便在可调整大小元素完成调整后应用 `pulsate` 效果：\n\n点击此处查看代码图片\n\n```\n$(\"#resize1\"\
  ). resizable ({aspectRatio:true });\n\n$(\"#resize1\").on(\"dropactivate\", function(){$(this).effect(\"\
  pulsate\"); });\n```\n\n![Image](img/image00969.jpeg)\n\n**表 18.7 可调整大小部件事件**\n\n\
  * * *\n\n### 动手实践：创建可调整大小的元素\n\n在本示例中，你将实现 `draggable` 和 `resizable` 元素，允许用户自定义网页上项目的位置和大小。本示例的目的是说明\
  \ `draggable` 和 `resizable` 之间的交互。\n\n示例代码位于清单 18.7、18.8 和 18.9 中。按照以下步骤创建动态网页：\n\
  \n**1.** 在 Eclipse 中，添加 `lesson18/resizable_elements.html`、`lesson18/js/resizable_elements.js`\
