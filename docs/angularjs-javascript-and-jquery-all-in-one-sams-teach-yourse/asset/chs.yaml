  \n**图 27.1** 实现`$http`服务，允许 AngularJS 控制器与 Web 服务器交互。\n\n* * *\n\n#### 使用$cacheFactory\
  \ 服务\n\n`$cacheFactory`服务提供了一个非常方便的存储库，用于临时存储键/值对数据。由于`$cacheFactory`是一个服务，它可以被多个控制器和其他\
  \ AngularJS 组件使用。\n\n创建`$cacheFactory`服务时，你可以指定一个包含`capacity`属性的`options`对象——例如，`{capacity:\
  \ 5}`。通过添加这个`capacity`设置，你将缓存中元素的最大数量限制为五个。当添加新项时，最旧的项会被移除。如果没有指定容量，缓存会持续增长。\n\n\
  清单 27.4 展示了一个基本示例，演示如何在`Module`对象中实现`$cacheFactory`，然后从两个不同的控制器中访问它。`factory()`方法创建了一个可注入的`$cacheFactory`服务对象，该对象在`myController`和`myController2`控制器中被实例化并使用。\n\
  \n**清单 27.4 service_cache.js 在 AngularJS 应用程序中实现$cacheFactory 服务**\n\n点击此处查看代码图片\n\
  \n* * *\n\n```\n01 var app = angular.module('myApp', []);\n02 app.factory('MyCache',\
  \ function($cacheFactory) {\n03   return $cacheFactory('myCache', {capacity:5});\n\
  04 });\n05 app.controller('myController', ['$scope', 'MyCache',\n06            \
  \                     function($scope, cache) {\n07     cache.put('myValue', 55);\n\
