  \n* * *\n\n### 创建日历输入\n\njQuery 提供的日期选择器小部件使你能够实现一个日历界面，用户只需点击鼠标即可选择特定日期。这可以避免用户手动输入日期时出现的许多问题。\n\
  \n日期选择器小部件附加到 `text`、`date` 或 `datetime <input>` 元素上。当用户点击 `<input>` 时，日历会显示出来。你还可以添加一个图标图像来启动日期选择器。\n\
  \n清单 19.4 中的代码创建了一个带有图像图标的日期选择器。效果见图 19.4。以下设置展示了一些可用选项：\n\n![Image](img/image00767.jpeg)\
  \ `onSelect`——指定一个函数，每次选择新日期时都会调用该函数。\n\n![Image](img/image00767.jpeg) `showOn`——设置为“button”，以便在单击按钮图标时启动日期选择器。\n\
  \n\n\n\n![Image](img/image00767.jpeg) `buttonImage`—指定要使用的图像文件的位置。\n\n![Image](img/image00767.jpeg)\
  \ `buttonImageOnly`—当为`true`时，日期选择器仅在点击按钮图标时启动，而不是点击`<input>`。\n\n![Image](img/image00767.jpeg)\
  \ `numberOfMonths`—指定要显示的月份数。\n\n![Image](img/image00767.jpeg) `showButtonPanel`—当为`true`时，在日期选择器底部显示“今天”和“完成”按钮。\n\
  \n![Image](img/image00767.jpeg) `dateFormat`—描述将放入`<input>`字段的格式的`String`。\n\n![Image](img/image00980.jpeg)\n\
