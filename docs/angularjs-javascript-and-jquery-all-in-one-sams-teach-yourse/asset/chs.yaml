  \ 2.10** 查看 DOM 发现，浏览器在`<ul>`标签下看到一个`<ll>`标签，而不是一组`<li>`标签。\n\n**8.** 返回 Eclipse，将第\
  \ 9 行的`<ll>`标签改为`<li>`，并保存页面。\n\n**9.** 在浏览器中重新加载网页。列表现在正确显示。\n\n#### 查看和编辑元素的 DOM\
  \ 属性\n\n调试 HTML 时的另一个重要工具是 DOM 属性编辑器。DOM 属性编辑器非常强大。它允许你查看和编辑 DOM 中每个 HTML 元素的属性、特性、函数、子元素、父元素以及其他所有信息。信息以树形结构显示，因此你可以展开和折叠分组。\n\
  \n可以通过点击开发者工具控制台中的 Elements 选项卡，然后选择 Properties 子选项卡来访问 DOM 编辑器。你也可以在网页上右键单击元素，然后从弹出菜单中选择“检查元素”来启动\
  \ Elements 选项卡。\n\n图 2.11 显示了 DOM 属性编辑器。通过 DOM 属性编辑器，你可以访问有关浏览器环境的各种信息。例如，在图 2.11\
  \ 中，显示了窗口对象的`innerHTML`属性。\n\n![图片](img/image00791.jpeg)\n\n**图 2.11** Chrome 中的主\
  \ DOM 属性编辑器选项卡。\n\n你也可以在 Console 选项卡中通过输入对象名称来查看 DOM 对象的 DOM 属性编辑器。通常我们仅用它来访问浏览器窗口对象以获取信息，例如屏幕尺寸等。要在\
  \ Chrome 的 JavaScript 控制台视图中执行此操作，直接在编辑器中输入单词`window`，如图 2.12 所示。\n\n![图片](img/image00792.jpeg)\n\
  \n**图 2.12** 在 DOM 编辑器中编辑 HTML 元素。\n\n* * *\n\n**自己动手：在 DOM 编辑器中编辑 HTML 元素值**\n\n\
  例如，你可以通过以下步骤使用之前的代码示例进行练习：\n\n**1.** 在 Chrome 中打开文件`html_errors.html`中的修复代码，并打开开发者工具控制台。\n\
  \n**2.** 点击 Elements 选项卡。\n\n**3.** 在元素检查器中展开`<html>`、`<body>`和`<ul>`节点。\n\n**4.**\
  \ 选择第一个`<li>`节点。\n\n**5.** 点击右侧的 Properties 选项卡，如图 2.11 所示。\n\n**6.** 向下滚动，在 DOM\
  \ 属性编辑器中找到`innerHTML`属性。\n\n**7.** 双击`innerHTML`属性右侧的值，并更改文本，如图 2.11 所示。注意，网页中渲染的\
  \ HTML 元素也会随之改变。操作 HTML 节点的任何可编辑属性就是这么简单。\n\n* * *\n\n### 调试 CSS\n\n作为调试动态网页的一部分，你还需要了解如何调试\
  \ CSS 问题，因为网页的许多动态特性都涉及在 JavaScript 中修改 CSS 布局。\n\n如果你的 JavaScript 脚本修改了 DOM 元素的\
  \ CSS 布局，那么在 Web 浏览器中查看代码将毫无帮助。你需要能够看到浏览器应用于该元素的 CSS。为此，你需要结合使用 CSS 样式编辑器以及元素检查器中的布局编辑器和\
  \ CSS 样式编辑器。\n\n#### 使用 CSS 样式编辑器\n\nCSS 样式编辑器（如图 2.13 所示）提供了对网页中加载的所有元素 CSS 属性的访问。你可以通过选择开发者工具中的\
  \ Elements 选项卡，然后选择 Styles 子选项卡（如图 2.13 所示）来访问 CSS 样式编辑器。\n\n![图片](img/image00793.jpeg)\n\
  \n**图 2.13** 在 CSS 样式编辑器中编辑 CSS 属性。\n\n* * *\n\n**注意**\n\n你可以通过选择开发者工具中的 Sources\
  \ 选项卡，然后选择要查看的 HTML 或 CSS 文件来查看完整的 CSS 文件。\n\n* * *\n\n在 CSS 样式编辑器中，你还可以执行以下操作，如图\
  \ 2.13 所示：\n\n![图片](img/image00767.jpeg) **禁用 CSS 样式**——禁用图标允许你启用/禁用特定的 CSS 属性。\n\
  \n![图片](img/image00767.jpeg) **编辑元素特定的 CSS 属性**——你可以查看和编辑特定于此元素实例的 CSS 属性。\n\n![图片](img/image00767.jpeg)\
  \ **编辑类特定的 CSS 属性**——你可以查看和编辑特定于元素类别的 CSS 属性。\n\n![图片](img/image00767.jpeg) **编辑元素类型特定的\
  \ CSS 属性**——你可以查看和编辑特定于此类型所有元素的 CSS 属性。\n\n\n\n\n\n![Image](img/image00767.jpeg)\
  \ **切换元素状态**—切换元素状态按钮会加载如图 2.14 所示的菜单，允许你将元素状态设置为 `active`、`hover`、`focus` 或 `visited`，以便查看每种状态对应的\
  \ CSS 样式。\n\n![Image](img/image00794.jpeg)\n\n**图 2.14** 设置元素状态以查看特定于 active、hover、focus\
  \ 或 visited 状态的 CSS 属性。\n\n![Image](img/image00767.jpeg) **查看和编辑布局**—如图 2.15 所示的布局编辑器允许你查看和更改元素的外边距、边框、内边距、高度和宽度。\n\
  \n![Image](img/image00795.jpeg)\n\n**图 2.15** 在元素检查器的布局编辑器中查看 CSS 布局属性。\n\n####\
  \ 使用布局编辑器\n\n调试 CSS 时另一个极其强大的工具是元素编辑器中的布局编辑器。如图 2.15 所示的布局编辑器为所选 HTML 元素的 CSS 布局提供了一个易于使用的可视化界面。你可以看到诸如\
  \ `margin` 和 `padding` 等属性的实际值。你还可以双击这些值直接编辑 CSS 属性。\n\n在布局编辑器中，你可以查看和修改以下属性：\n\n\
  ![Image](img/image00767.jpeg) **外边距**—`margin` 是布局编辑器中最外层的盒子。外边距的四个边各有一个值。你可以双击这些值并在布局编辑器中直接更改\
  \ CSS 属性。\n\n![Image](img/image00767.jpeg) **边框**—`border` 是下一个盒子。它也有四个值，你可以更改这些值来调整\
  \ HTML 元素的 CSS 边框属性。\n\n![Image](img/image00767.jpeg) **内边距**—`padding` 是下一个盒子。它也有四个值，你可以更改这些值来调整\
  \ HTML 元素的 CSS 内边距属性。\n\n![Image](img/image00767.jpeg) **内容**—内容是布局编辑器中最内层的盒子。它有两个值：长度和宽度，你可以更改它们来设置\
  \ HTML 元素的 CSS `length` 和 `width` 属性。\n\n* * *\n\n动手试试：编辑 CSS 布局\n\n为了帮助你理解如何使用开发者工具调试和编辑\
  \ CSS 布局，请参考清单 2.3 中的代码。该代码旨在显示一个简单的选项卡式盒子来展示信息。CSS 属性存在一些问题，导致显示效果不佳，如图 2.16 所示。注意选项卡是堆叠的，并且它们之间有间距。\n\
  \n![Image](img/image00796.jpeg)\n\n**图 2.16** 选项卡的 CSS 布局不佳，导致网页不美观。\n\n**清单 2.3**\
  \ `css_errors.html` 一个非常简单的 HTML 文档，包含一些 HTML 语法错误，如图 2.16 所示。\n\n点击此处查看代码图片\n\n\
