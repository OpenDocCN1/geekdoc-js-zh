  \ ridge; }\n```\n\n***\n\n***\n\n### 总结\n\n在本课中，您下载了 jQuery UI 并在几个示例中实现了它。您了解到\
  \ jQuery UI 通过一些附加功能（如新的选择器）扩展了 jQuery，并增强了现有的 jQuery 功能（如元素定位）。\n\n您实现了一些示例，以说明如何在网页中使用\
  \ jQuery。\n\n### 问与答\n\n**问.** 有没有什么功能是 jQuery UI 能实现，而我自己用 jQuery 和 JavaScript\
  \ 无法实现的？\n\n**答.** 没有，但这不是重点。重点是 jQuery 和 jQuery UI 能为您节省大量时间。\n\n**问.** 我可以同时使用多个主题吗？\n\
  \n**答.** 不可以，主题之间会相互冲突。不过，您可以在网站的不同位置使用多个主题，然后动态调整加载哪些 `.css` 文件。这样，一些用户可以使用一个主题，而其他用户可以使用另一个主题。\n\
  \n### 实践练习\n\n实践练习包含一组问题和答案，旨在巩固您对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 小测验\n\n**1.**\
