  \ 添加弹出框\n\n`window` 提供了几种方法，允许你启动弹出窗口，用于警报、提示和通知。弹出窗口会显示，用户需要与弹出窗口交互后才能继续访问网页。\n\
  \n---\n\n注意\n\n通常，使用固定位置的 `<div>` 元素并叠加层比使用这些弹出框要好得多，因为你可以更好地控制它们。你将在本书稍后部分学习如何做到这一点。\n\
  \n---\n\n#### 通知用户\n\n最常见的弹出类型是警报弹出框，用于通知用户发生了某些事情。用户会看到消息，但唯一的选择是关闭弹出消息。\n\n要创建简单的警报消息，请使用\
  \ `window.alert()` 方法，如下所示，并在图 11.2 中显示：\n\n点击此处查看代码图片\n\n```\nwindow.alert(\"It's\
  \ 12/12/12 12:12:12!!!\");\n```\n\n![图片](img/image00909.jpeg)\n\n**图 11.2** JavaScript\
  \ 弹出框。\n\n#### 请求用户确认\n\n下一个最常见的弹出类型是确认弹出框，用于通知用户即将发生某些事情。用户会看到消息，然后可以选择点击“确定”允许操作发生，或点击“取消”拒绝操作。\n\
  \n要创建允许用户以“是”或“否”响应的确认对话框，请使用 `window.confirm()` 方法，如下所示，并在图 11.2 中显示：\n\n点击此处查看代码图片\n\
  \n```\nvar response = window.confirm(\"Are you sure?\");\nif (response == true)\
  \ { do something; }\nelse { don't do something; }\n```\n\n#### 提示用户输入\n\n另一种弹出类型是提示框。提示框显示一个文本框，允许用户在弹出框中输入文本字符串。该字符串会返回给\
  \ JavaScript 代码，并可以以多种方式使用。\n\n要创建允许用户输入单个文本字符串作为输入的提示对话框，请使用 `window.prompt()`\
  \ 方法，如下所示，并在图 11.2 中显示：\n\n点击此处查看代码图片\n\n```\nvar response = window.prompt(\"What\
  \ is the airspeed velocity of an unlaiden swallow?\");\nif (response == \"African\
  \ or European?\"){ pass }\nelse { no pass }\n```\n\n### 设置定时器\n\nJavaScript 的另一个有用功能是能够设置定时器，在特定时间后或按特定间隔执行函数或计算表达式。\n\
  \n使用定时器可以延迟代码的执行，使其不必在事件触发或页面加载的精确时刻发生。\n\n#### 添加延迟定时器\n\n要延迟代码执行一定时间，请使用 `setTimeout(code,\
  \ ms)` 方法，其中 `code` 是一个语句或函数，将在时间到期时执行。`ms` 是毫秒数。例如，要在 10 秒后执行名为 `myTimer()` 的函数，可以使用以下代码：\n\
  \n点击此处查看代码图片\n\n```\nvar timerId = setTimeout(myTimer, 10000);\n```\n\n在时间耗尽且代码执行之前的任何时刻，你可以通过调用\
  \ `clearTimeout(id)` 方法（使用 `setTimeout()` 返回的 id）来清除定时器。例如：\n\n```\nclearTimeout(timerId);\n\
  ```\n\n#### 添加重复定时器\n\n你也可以使用 `setInterval(code, ms)` 方法启动一个按固定间隔触发的定时器。该方法同样接受\
  \ `code` 语句或函数名以及毫秒数作为参数。例如，以下代码创建一个每分钟触发一次并调用函数 `checkStatus()` 的定时器：\n\n点击此处查看代码图片\n\
  \n```\nvar timerId = setInterval(checkStatus, 60000);\n```\n\n你也可以使用 `clearInterval()`\
  \ 方法关闭间隔定时器，如下所示：\n\n```\nclearInterval(timerId);\n```\n\n---\n\n### 自己动手：创建简单的定时器和对话框\n\
  \n在本例中，你将创建一个简单的网页，显示一个时钟并每秒更新一次。该网页还会每隔几秒弹出一条通知消息，直到你让它停止。这个练习应该能让你牢固掌握定时器和警报。示例代码如清单\
  \ 11.4、11.5 和 11.6 所示。按照以下步骤实现示例：\n\n**1.** 在 Eclipse 中，创建 `lesson11/clock.html`、`lesson11/js/clock.js`\
  \ 和 `lesson11/css/clock.css` 文件。\n\n**2.** 将清单 11.4 和清单 11.6 中显示的代码添加到 HTML 和 CSS\
  \ 文件中。这些只是基本内容。\n\n**3.** 打开 `clock.js` 文件，添加以下 `ready()` 函数，该函数为网页添加一个超时定时器和一个间隔定时器：\n\
  \n点击此处查看代码图片\n\n```\n01 $(document).ready(function(){\n02   setTimeout(continueNotify,\
  \ 3000);\n03   setInterval(displayTime, 1000);\n04 });\n```\n\n**4.** 添加以下 `continueNotify()`\
  \ 函数，该函数将在 3 秒后执行。该函数提示用户是否希望继续接收通知；如果用户同意，则重置超时定时器，使函数在另外 3 秒后再次运行：\n\n点击此处查看代码图片\n\
  \n```\n05 function continueNotify(){\n06   var result = confirm(\"Do you wIsh to\
  \ continue\\nto receive notifications?\");\n07   if (result==true) { setTimeout(continueNotify,\
  \ 3000); }\n08 }\n```\n\n**5.** 添加以下 `displayTime()` 函数，该函数将在间隔定时器触发时每秒运行一次。此函数用当前时间字符串更新\
  \ `#clock` 元素。`padNumber()` 函数用于为小于 10 的数字添加前导零：\n\n点击此处查看代码图片\n\n```\n13 function\
