  \ *\n\n##### 使用 jQuery 事件辅助函数分配事件处理程序\n\n\n\n\n除了使用 `addEventListener()` 方法添加事件处理程序外，jQuery\
  \ 还提供了辅助函数，让你能够设置事件处理程序。这些辅助函数以事件命名，因此有助于让代码看起来更简洁。\n\n辅助函数使用与 `addEventListener()`\
  \ 类似的语法，但无需指定事件类型：\n\n`.<event type>( [eventData], handler(eventObject))`\n\n`eventData`\
  \ 参数是可选的，与 `addEventListener()` 一样，它会设置事件对象的 `data` 值。`handler` 参数是必需的，用于指定要调用的函数。将\
  \ `<event type>` 替换为表 9.3 中列出的事件名称。例如，以下两条 jQuery 语句是为 click 事件分配处理程序的等效方式：\n\n\
  ```\nobj.click( dataObj, function myHandler(e){...});\nobj.addEventListener(\"click\"\
  , dataObj, function myHandler(e){...});\n```\n\n除了基于事件类型名称的辅助函数外，jQuery 还提供了一个额外的辅助函数，用于鼠标悬停事件。`hover()`\
  \ 辅助函数允许你同时为 `mouseenter` 和 `mouseleave` 事件设置处理程序。例如：\n\n```\nobj.hover(function\
  \ enterHandler(e){...}, function leaveHandler(e){...});\n```\n\n等价于\n\n```\nobj.addEventListener(\"\
  mouseenter\", function enterHandler(e){...});\nobj.addEventListener(\"mouseleave\"\
  , function leaveHandler (e){...});\n```\n\n你也可以通过只指定一个处理程序来为 `mouseenter` 和 `mouseleave`\
  \ 设置相同的处理程序。例如：\n\n```\nobj.hover(function hoverHandler(e){...});\n```\n\n### 手动触发事件\n\
  \nJavaScript 和 jQuery 允许你手动触发事件。这提供了诸多优势，例如模拟用户交互、将页面元素交互绑定在一起，或与自定义事件进行交互。\n\n\
  以下部分描述了如何在 JavaScript 和 jQuery 中触发事件。\n\n#### 在 JavaScript 中触发事件\n\n在 JavaScript\
  \ 中触发事件的最简单方法是使用 DOM 对象上附加的事件方法（如果存在）。简单事件如 `click`、`select`、`blur` 和 `focus` 在支持它们的\
  \ DOM 对象上都有对应的方法。例如，你可以使用以下语法在大多数 DOM 对象上触发 `click` 事件：\n\n`obj.click();`\n\n在 JavaScript\
  \ 中触发事件的更高级方法是创建一个事件对象，然后使用 `document.dispatchEvent()` 调用来触发事件机制。这种方法对事件信息提供了更多的控制，并且是触发许多事件的唯一方式。`dispatchEvent()`\
  \ 方法涉及三个步骤。\n\n第一步是使用 `document.createEvent()` 方法创建一个事件对象。`createEvent()` 方法要求你指定所创建对象的\
  \ `type`。表 9.4 列出了 `createEvent()` 接受的一些常见事件类型。例如，要创建一个鼠标 `click` 事件对象，请使用以下语句：\n\
  \n```\nvar clickEvent = document.createEvent(\"MouseEvents\");\n```\n\n![Image](img/image00895.jpeg)\n\
  \n**表 9.4 `createEvent()` 支持的常见事件类型**\n\n下一步是通过调用事件的初始化函数来为事件对象设置值。表 9.4 列出了事件类型对应的初始化函数及其支持的参数。\n\
  \n例如，要初始化 click 事件对象，请使用以下语句。类型指定为 `\"click\"`，`bubbling` 和 `cancelable` 属性均为 true。这里使用\
  \ `window` 作为 `view` 元素。坐标无关紧要，因此保持为 0，额外的键盘键也无关紧要，因此设置为 false。`button` 参数设置为 0\
  \ 表示左键单击，并且未指定相关目标：\n\n```\nclickEvent.initMouseEvent(\"click\", true, true, window,\
  \ 0, 0, 0, 0, 0, 0,\n                            false, false, false, false, 0,\
  \ null);\n```\n\n大多数情况下，初始化函数的参数应该是不言自明的。不过，你可能需要检查某些特定参数。你可以在 [www.w3.org/TR/DOM-Level-2-Events/events.html](http://www.w3.org/TR/DOM-Level-2-Events/events.html)\
  \ 找到事件对象和方法的定义。\n\n最后一步是在要触发事件的 HTML 对象上调用 `dispatchEvent()`。例如，以下代码查找一个对象，然后触发\
  \ `click` 事件：\n\n```\nvar obj = document.getElementById(\"someId\");\nobj.dispatchEvent(clickEvent);\n\
  ```\n\n* * *\n\n**警告**\n\n在 IE9 之前，IE 使用不同的方法来创建和触发事件。你需要使用 `createEventObject()`\
  \ 代替 `createEvent()`，使用 `fireEvent()` 代替 `dispatchEvent()`。如果你需要触发事件并支持早期 IE 浏览器，应查阅\
  \ MSDN 上关于使用 `fireEvent()` 的文档。\n\n* * *\n\n* * *\n\n#### 动手试一试：在 JavaScript 中手动触发事件\n\
  \n在本例中，你将逐步完成使用 `<span>` 元素的事件处理程序来触发另一个元素上的 click 事件的过程。结果将是你可以单击 span 元素来选中或取消选中复选框。请按照以下步骤创建清单\
  \ 9.7、9.8 和 9.9 中所示的文件：\n\n1. 在 Eclipse 中，创建 `lesson09/manual_event.html`、`lesson09/js/manual_event.js`\
  \ 和 `lesson09/css/manual_event.css` 文件。\n\n2. 将清单 9.7 中的代码添加到 HTML 文件中。这只是一个基本的\
  \ HTML 文件，加载了额外的 JavaScript 和 CSS 文件。网页中添加了两个复选框和两个 `<span>` 元素。\n\n3. 将清单 9.9 中的\
  \ CSS 添加到 CSS 文件中。这段代码将 `<span>` 元素样式化为按钮。\n\n4. 打开 `manual_event.js` 文件，并添加以下 `onloadHandler()`\
  \ 初始化函数，该函数为两个 `<span>` 元素都附加了事件监听器：\n\n```\n01 function onloadHandler(){\n02  \
  \ var employee = document.getElementById(\"Employee\");\n03   employee.addEventListener('click',\
  \ simpleClick, false);\n04   var registered = document.getElementById(\"Registered\"\
  );\n05   registered.addEventListener('click', eventClick, false);\n06 }\n```\n\n\
  5. 创建添加到第一个按钮的 `simpleClick()` 处理函数。该代码使用事件中的 `target.id` 来查找对应的复选框元素。然后对复选框对象调用\
  \ `click()` 函数，就像鼠标点击它一样触发 `click` 事件：\n\n```\n07 function simpleClick(e){\n08 \
  \  var cb = document.getElementById(\"check\"+e.target.id);\n09   cb.click();\n\
  10 }\n```\n\n6. 为第二个按钮添加以下 `eventClick()` 处理函数。这段代码首先创建一个 `\"MouseEvents\"` 对象，然后使用适当的参数将其初始化为\
  \ `\"click\"` 类型。该代码还使用事件中的 `target.id` 来查找对应的复选框元素，然后对复选框元素的对象调用 `dispatchEvent()`，触发鼠标\
  \ `click` 事件：\n\n```\n11 function eventClick(e){\n```\n\n\n\n\n```\n12     var event\
  \ = document.createEvent(\"MouseEvents\");\n13     event.initMouseEvent(\"click\"\
  , true, true, window,\n14                           0, 0, 0, 0, 0, false, false,\n\
  15                           false, false, 0, null);\n16     var cb = document.getElementById(\"\
  check\"+e.target.id);\n17     cb.dispatchEvent(event);\n18 }\n```\n\n**7.** 保存所有三个文件，然后在网页浏览器中打开\
  \ HTML 文档，如图 9.4 所示。尝试操作复选框和按钮。注意，按钮与复选框的交互方式与直接点击复选框相同。\n\n![Image](img/image00896.jpeg)\n\
  \n**图 9.4** 一个简单的网页，通过 `<span>` 元素触发复选框的点击事件。\n\n**清单 9.7 manual_event.html HTML\
  \ 文件，加载 CSS 和 JavaScript，并定义复选框和 <span> 元素**\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 <!DOCTYPE\
  \ html>\n02 <html>\n03   <head>\n04     <title>Manual Event</title>\n05     <meta\
  \ charset=\"utf-8\" />\n06     <script type=\"text/javascript\" src=\"js/manual_event.js\"\
  ></script>\n07     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/manual_event.css\"\
