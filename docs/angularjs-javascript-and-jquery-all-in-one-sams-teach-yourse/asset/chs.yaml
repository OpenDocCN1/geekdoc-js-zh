  ```\n\n---\n\n### 使用 Sortable 小部件对元素进行排序\n\njQuery UI 提供的最酷的交互之一就是 `sortable` 小部件。sortable\
  \ 小部件允许你拖拽并重新排列在列表、表格或容器中流动的 HTML 元素的顺序。\n\n当你拖拽一个项目时，`sortable` 小部件会重新定位其他元素。你还可以将多个可排序容器连接起来，这样你就可以将一个项目从一个可排序容器拖拽到另一个。\n\
  \n表 18.10 描述了更常见的 sortable 选项。下面展示了一个将 `sortable` 小部件附加到元素上并将 `tolerance` 指定为 `fit`\
  \ 的示例：\n\n点击此处查看代码图片\n\n`$(\"#ul1\").sortable({tolerance:\"fit\"});`\n\n![Image](img/image00974.jpeg)\n\
  \n**表 18.10 常见的 Sortable 小部件选项**\n\n---\n\n> **注意**\n> 要使用 `sortable` 对表格行进行排序，你需要使\
  \ `<tbody>` 可排序，而不是 `<table>`。\n\n---\n\n`sortable` 小部件还提供了额外的事件，以便在排序时可以将处理程序附加到可排序元素或其子元素上。表\
  \ 18.11 列出了你可以在可排序项目上访问的事件。\n\n![Image](img/image00975.jpeg)\n\n**表 18.11 Sortable\
  \ 小部件事件**\n\n---\n\n> **提示**\n> jQuery UI 会将 `.ui-sortable-helper` 类添加到正在排序的辅助元素上。你可以在\
  \ CSS 中为辅助类定义自己的设置，以控制在 `sortable` 中移动元素时的外观。\n\n---\n\n每个 `sortable` 事件都会传递 `event`\
  \ 对象以及一个 `ui` 对象，该对象将附加以下值：\n\n![Image](img/image00767.jpeg) `helper` — 表示正在拖拽的辅助对象的\
  \ jQuery 对象。\n\n![Image](img/image00767.jpeg) `item` — 表示正在排序的实际对象的 jQuery 对象。\n\
  \n![Image](img/image00767.jpeg) `offset` — 当前偏移量的 `{top, left}` 对象。\n\n![Image](img/image00767.jpeg)\
  \ `originalPosition` — 原始位置的 `{top, left}` 对象。\n\n![Image](img/image00767.jpeg)\
  \ `position` — 当前位置的 `{top, left}` 对象。\n\n![Image](img/image00767.jpeg) `sender`\
  \ — 当从一个可排序对象拖拽到另一个时，项目来源的可排序对象。\n\n例如，以下代码将 `#list1` 连接到 `#list2`，然后添加一个 `sortreceived`\
  \ 事件，该事件将在发送者和接收者上都添加一个 `pulsate` 效果：\n\n点击此处查看代码图片\n\n```\n$(\"#list1\").sortable({connectWith:\"\
  #list2\"});\n$(\"#list1\").on(\"sortreceived\", function(e, ui){\n  ui.sender.effect(\"\
  pulsate\");\n  $(this).effect(\"pulsate \"); });\n```\n\n---\n\n**动手实践：实现可排序元素**\n\
  \n在本示例中，你在一个列表和一个表格上实现 `sortable`。有两个列表连接在一起，因此你可以从一个列表排序到另一个列表。本示例的目的是提供一些使用可排序元素以及处理排序事件的实际示例。\n\
  \n示例的代码在清单 18.13、18.14 和 18.15 中。请按照以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，添加 `lesson18/sortable_elements.html`、`lesson18/js/sortable_elements.js`\
  \ 和 `lesson18/css/sortable_elements.css` 文件。\n\n**2.** 将清单 18.13 和清单 18.15 中显示的代码添加到\
  \ HTML 和 CSS 文件中。注意清单 18.15 的第 13 行，添加了 `.ui-sortable-helper` 类来在排序时设置元素样式。\n\n\
  **3.** 打开 `sortable_elements.js` 文件并添加一个 `.ready()` 函数。\n\n**4.** 添加包含图片 `name`\
  \ 和 `src` 位置的 `images` 数组，以及清单 18.14 第 1–21 行中显示的 `buildLists()` 函数。`buildLists()`\
  \ 函数使用该数组填充 `#sorter1` 和 `#sortTable` 中的元素。\n\n**5.** 添加以下行，使 `#sorter1` 可排序并将其连接到\
  \ `#sorter2`：\n\n点击此处查看代码图片\n\n```\n24   $(\"#sorter1\").sortable(\n25       {cursor:\"\
  move\", connectWith:\"#sorter2\"});\n```\n\n**6.** 添加以下行，在 `#sorter2` 上实现 `sortable`\
  \ 并添加 `sortreceive` 事件处理程序。当项目从另一个列表添加到 `#sorter2` 时，该事件处理程序会在发送者和接收者上都添加一个 `pulsate`\
  \ 效果：\n\n点击此处查看代码图片\n\n```\n26   $(\"#sorter2\").sortable(\n27       {cursor:\"\
  move\", connectWith:\"#sorter1\"});\n28   $(\"#sorter2\").on(\"sortreceive\", function(e,\
