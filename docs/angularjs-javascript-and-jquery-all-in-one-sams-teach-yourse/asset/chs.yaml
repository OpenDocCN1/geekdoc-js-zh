  10 </div>\n```\n\n***\n\n***\n\n#### 处理 AJAX 响应\n\n除了指定 `success` 处理器外，包装方法还允许你通过以下方法附加额外的处理器：\n\
  \n- `![Image](img/image00767.jpeg)` `.done(data, textStatus, jqXHR)` — 当从服务器收到成功响应时调用。\n\
  - `![Image](img/image00767.jpeg)` `.fail(data, textStatus, jqXHR)` — 当从服务器收到失败响应或请求超时时调用。\n\
  - `![Image](img/image00767.jpeg)` `.always(data, textStatus, jqXHR)` — 当从服务器收到响应时始终调用。\n\
  \n例如，以下代码添加了一个在请求失败时调用的事件处理器：\n\n点击此处查看代码图片\n\n```\n$.get(\"/getUser?first=Brad&last=Dayley\"\
  , null, function (data, status, xObj){\n\n  $(\"#email\").html(data.email);\n\n\
  }), \"json\").fail(function(data, status, xObj){\n\n  alert(\"请求失败\");\n\n});\n\
  ```\n\n***\n\n### 动手实践：处理请求成功与失败\n\n在本练习中，你将有机会在基本的 jQuery `.get()` 请求上实现 `.done()`、`.fail()`\
  \ 和 `.always()` AJAX 事件处理器。生成的网页将姓名和颜色发送到服务器端的 Node.js 脚本，该脚本检查 `name=\"Lancalot\"\
  ` 和 `color=\"blue\"`。如果输入了正确的姓名和颜色，请求成功；否则请求失败。本练习的目的是将 AJAX 处理器应用于实际概念。\n\n示例代码位于清单\
  \ 15.5、15.6、15.7 和 15.8 中。请按照以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，创建 `lesson15/ajax_response.html`、`lesson15/js/ajax_response.js`\
  \ 和 `lesson15/css/ajax_response.css` 文件。\n\n**2.** 在项目根目录下创建一个名为 `server_lesson15_ajax_handling.js`\
  \ 的文件，并将清单 15.8 的内容放入其中。此文件将仅作为本示例的 Node.js 网络服务器。\n\n**3.** 如果 `server.js` 网络服务器已为其他示例运行，请停止它。然后使用\
  \ `node` 命令启动 `server_lesson15_ajax_handling.js` 网络服务器，或者如果你使用 Eclipse，则通过“运行方式”->“Node\
  \ 应用程序”启动。\n\n> **注意：** 完成后，不要忘记停止 `server_lesson15_ajax_handling.js` 服务器，并在继续其他练习之前启动正常的\
  \ `server.js`。\n\n**4.** 将清单 15.5 和清单 15.7 中显示的代码添加到 HTML 和 CSS 文件中。HTML 和 CSS 代码定义了一个基本的登录对话框。\n\
  \n**5.** 打开 `ajax_response.js` 文件，并添加以下 `.ready()` 函数，该函数将为输入按钮添加一个点击处理器：\n\n点击此处查看代码图片\n\
  \n```\n09 $(document).ready(function(){\n\n10   $(\"#requestButton\").click(askYourQuestions);\n\
  \n11 });\n```\n\n**6.** 添加以下点击处理器 `askYourQuestions()`，当用户点击请求按钮时调用。该处理器向网络服务器的\
  \ `/request` 路径发出 AJAX `.get()` 请求。注意，来自 `#requestForm` 的数据使用 `.serialize()` 序列化以创建查询字符串。还要注意，`.done()`、`.fail()`\
  \ 和 `.always()` 被附加到 `.get()` 请求上，以处理 AJAX 完成事件：\n\n点击此处查看代码图片\n\n```\n04 function\
  \ askYourQuestions(){\n\n05   $.get(\"/request\",\n\n06    $(\"#requestForm\").serialize()).done(success).fail(failure).always(always);\n\
  \n07   return false;\n\n08 }\n```\n\n**7.** 添加以下三个 AJAX 事件处理器，以处理完成、失败和成功登录尝试：\n\
  \n点击此处查看代码图片\n\n```\n01 function failure(){ alert(\"你不能通过！\"); }\n\n02 function\
  \ success(){ alert(\"你可以通过！\"); }\n\n03 function always(){ alert(\"问题已回答。\"); }\n\
  ```\n\n**8.** 保存所有三个文件，然后在网页浏览器中打开 HTML 文档，如图 15.3 所示。你应该会看到，每当你点击请求按钮时，都会弹出完成提示。当你使用正确的凭据\
  \ `name=\"Lancalot\"` 和 `color=\"blue\"` 时，还应该看到成功提示。\n\n![Image](img/image00939.jpeg)\n\
