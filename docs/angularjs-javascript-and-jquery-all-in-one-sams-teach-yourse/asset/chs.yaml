  \ `<div>` 元素的位置。\n\n## 第 5 课 深入 jQuery 和 JavaScript 语法\n\n本课你将学到：\n\n![Image](img/image00767.jpeg)\
  \ 将 jQuery 和 JavaScript 添加到网页的方法\n\n![Image](img/image00767.jpeg) 创建和操作对象数组\n\n\
