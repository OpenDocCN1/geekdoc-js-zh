  \ top; }\n    </style>\n  </head>\n  <body>\n  <h2>图像缩放窗口</h2>\n  <div ng-controller=\"\
  myController\">\n    <zoomit src=\"/images/flower.jpg\"></zoomit>\n    <hr>\n  \
  \  <zoomit src=\"/images/tiger.jpg\"></zoomit>\n  </div>\n  </body>\n  <script src=\"\
  http://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js\"></script>\n \
