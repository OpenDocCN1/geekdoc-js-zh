  \ div span{\n12   color:blue;\n13   float:right; }\n14 .infoContainer p{\n15   margin:0px;\
  \ padding:0px;\n16   font-size:14px; font-weight:bold;\n17  }\n18 #banner{\n19 \
  \  height:100;\n20   color:white; background-color:blue;\n21   font-size:40px; text-align:center;\n\
  22 }\n23 #menu{ background-color:gray; padding:5px; }\n24 .menuItem{\n25   padding:3px;\
  \ margin-left:3px;\n26   background-image: -moz-linear-gradient(top, #0022ff 0%,\
  \ #AACCFF 85%, #0022ff 100%);\n27   background-image: -webkit-linear-gradient(top,\
  \ #0022ff 0%, #AACCFF 85%, #0022ff 100%);\n28   background-image: -ms-linear-gradient(top,\
  \ #0022ff 0%, #AACCFF 85%, #0022ff 100%);\n29   font:20px bold;\n30   color:white;\n\
  31 }\n32 .imageArea{color:firebrick;}\n```\n\n* * *\n\n* * *\n\n### 动态操作页面元素\n\n\
  在上一节中，你不仅学会了如何访问组件，还学会了如何更改值、属性、特性和 CSS 设置。本节通过讨论一些额外的方法来扩展这些概念，包括添加和删除元素、更改类以及切换可见性，从而动态操作网页。\n\
  \n#### 动态添加页面元素\n\n通常，直到用户登录、从 Web 服务接收到额外信息或发生其他交互时，你才会知道网页上应该包含哪些元素。在这些情况下，你必须在\
  \ jQuery 和 JavaScript 代码中能够即时添加元素。\n\n##### 在 JavaScript 中添加页面元素\n\n有多种方法可以动态添加\
  \ HTML 元素。最基本的方法是将容器对象的 `innerHTML` 属性设置为一个 HTML 字符串。例如，以下代码将现有对象的内容设置为一个新的 `<p>`\
  \ 元素：\n\n点击此处查看代码图片\n\n```javascript\ndomObj.innerHTML = \"<p>Paragraph 1 goes here</p>\"\
  ;\ndomObj.innerHTML += \"<p>Paragraph 2 goes here</p>\";\n```\n\n这种方法的问题在于它容易产生非常丑陋的字符串语句，日后很可能成为主要麻烦。因此，JavaScript\
  \ 提供了一种创建 DOM 对象并将其追加到父对象的方法。\n\n`document.createElement(tag)` 方法允许你创建一个元素对象，而 `document.createTextNode(text)`\
  \ 允许你创建作为元素一部分的文本节点。然后可以在 DOM 对象上调用 `appendChild(object)` 方法来追加新创建的元素和节点。\n\n为了说明这一点，请看以下代码，它向一个名为\
  \ `domObj` 的现有对象添加了几个段落：\n\n点击此处查看代码图片\n\n```javascript\nvar newP = createElement(\"\
  p\");\n```\n\n\n\n\n\n```\nvar newT = createTextNode(\"Paragraph 1 goes here\");\n\
  \nnewP.appendChild(newT);\n\ndomObj.appendChild(newP);\n```\n\n代码量稍多，但流程更安全。此外，创建对象的好处在于你拥有一个实际的\
  \ DOM 对象，可以为其元素添加额外的属性。例如，以下代码允许你在将 `<img>` 元素追加到现有对象之前，先添加该元素并设置 `src` 和 `height`\
  \ 属性：\n\n点击此处查看代码图片\n\n```\nvar newImg = createElement(\"img\");\n\nnewImg.src =\
  \ \"images/sunset.jpg\";\n\nnewImg.height = 200;\n\ndomObj.appendChild(newImg);\n\
  ```\n\n##### 在 jQuery 中添加页面元素\n\n现在来看看如何在 jQuery 中添加新元素。你可以像在 JavaScript 中一样，使用\
  \ `.html()` 方法在 jQuery 中应用相同的 `innerHTML` 快捷方式，该方法会获取或设置 `innerHTML` 字符串。例如：\n\n\
  点击此处查看代码图片\n\n```\n$(\"#myDiv\").html(\"<p>Paragraph 1 goes here</p>\");\n```\n\n\
  然而，这种方法同样存在局限性，应谨慎使用。更好的方法是创建一个新的 jQuery 对象并追加它。以下代码将带你了解这一过程。第一步是通过将标签名称或 HTML\
  \ 字符串传递给 jQuery 对象 `$` 来创建对象。例如，以下语句创建一个新的 jQuery 对象，其中包含一个 `<p>` 元素：\n\n```\nvar\
  \ newP = $(\"<p></p>\");\n```\n\n然后，你可以使用以下方法向段落中添加文本：\n\n点击此处查看代码图片\n\n```\nnewP.html(\"\
  Paragraph 1 goes here\");\n```\n\n接着，你可以使用 `.append(jQueryObject)` 将一个元素追加到一个或多个现有元素中。例如，以下代码将段落添加到所有\
  \ `<div>` 元素中：\n\n```\n$(\"div\").append(newP);\n```\n\n为了说明这一点，以下代码创建一个新的 jQuery\
  \ 对象，其中包含一个 `<img>` 元素，并将其添加到所有 `<li>` 元素中：\n\n点击此处查看代码图片\n\n```\nvar newImg = $(\"\
  <img></img>\");\n\nnewImg.attr(\"src\", \"images/sunset.jpg\");\n\nnewImg.height(30);\n\
  \n$(\"li\").append(newImg);\n```\n\njQuery 还提供了 `.appendTo(target)` 方法，允许你将一个对象追加到另一个对象。其工作方式与\
  \ `.append()` 相同，但方向相反。该方法由子对象调用，而非新的父对象。例如，前面示例中的 `newImg` 对象可以通过以下语句追加：\n\n```\n\
  newImg.appendTo(\"li\");\n```\n\n#### 移除页面元素\n\n页面元素可以通过几种方式移除。最基本的方法是获取父对象，然后对\
  \ DOM 对象设置 `domObj.innerHTML = \"\"`，或对 jQuery 对象调用 `jObj.html(\"\")`。这会擦除父元素内的所有内容，从而移除所有子元素。\n\
  \n尽量设计你的 HTML 组件，以便能够使用 `.html(\"\")` 方法移除元素，因为这能使清理代码保持简单。另一个优点是，向容器中添加新元素更容易，因为你无需处理现有元素。\n\
  \n在 JavaScript 中，你也可以在父元素上调用 `.removeElement(child)`。例如，以下代码获取一个 `id=\"container\"\
  ` 的元素，然后移除一个 `id=\"paragraphA\"` 的子元素：\n\n点击此处查看代码图片\n\n```\nvar parent=document.getElementById(\"\
  container\");\n\nvar child=document.getElementById(\"paragraphA\");\n\nchild.parentNode.removeChild(child);\n\
  ```\n\njQuery 提供了两种移除元素的方法。第一种是 `.empty()`，它等同于 `.html(\"\")`。使用 `.empty()` 会移除所有子元素和文本。第二种方法是\
  \ `.remove([selector])`，它仅基于原始查询和可选的 `selector` 来移除元素。\n\n如果未指定选择器，则移除原始查询中的元素。例如，要移除所有\
  \ `<div>` 元素，请使用以下语句：\n\n```\n$(\"div\").remove()\n```\n\n如果指定了选择器，则会移除原始查询中与该选择器匹配的子元素。例如，要移除\
  \ `<div>` 元素内的 `<p>` 元素，请使用以下语句：\n\n```\n$(\"div\").remove(\"p\");\n```\n\njQuery\
  \ 还提供了一个在移除元素时很有用的额外方法：`.detach([selector])` 方法。detach 方法与 `.remove([selector])`\
  \ 方法的工作方式相同，但有一个重要区别：即使元素已从父元素中移除，实际的元素 DOM 数据也不会被删除。你仍然可以在现有的 jQuery 对象中保留这些元素，并可以将它们重新插入到\
  \ DOM 的其他位置。\n\n例如，以下代码从一个元素中分离所有段落，并将它们追加到另一个元素中：\n\n点击此处查看代码图片\n\n```\nvar ps\
  \ = $(\"#div1\").detach(\"p\");\n\nps.appendTo(\"#div2\");\n```\n\n#### 在 jQuery\
  \ 中替换元素\n\n正如你在前面几节中所看到的，你可以通过 jQuery 轻松添加和移除元素。你还需要了解用其他元素集替换现有元素集的能力。这在 jQuery\
  \ 中是必需的，因为移除元素后，你将无法再执行相同的查询，因为这些元素已经不存在了。\n\n你可以使用三种方法在 jQuery 中替换元素。最简单的是使用 `.html()`。jQuery\
  \ 中的 `.html()` 方法对于用完全不同的内容替换现有元素的内容非常有用。`.html()` 方法接受一个字符串或一个对象，并用该对象或字符串替换 jQuery\
  \ 中元素集的内容。例如，以下语句将所有 `<div>` 元素的内容替换为一个新段落：\n\n点击此处查看代码图片\n\n```\n$(\"div\").html($(\"\
  <p>New Paragraph</p>\"));\n```\n\n另一种用新内容替换文档中元素集的方法是 `.replaceAll(target)` 方法。该方法将匹配\
  \ `target` 选择器的元素集替换为当前元素集。例如，要用 `parentA` 中的 `<span>` 元素替换 `parentB` 中的所有 `<div>`\
  \ 元素，你可以使用以下语句：\n\n点击此处查看代码图片\n\n```\n$(\"#parentA span\").replaceAll(\"#parentB\
  \ div\");\n```\n\n最后一种方法是使用 `.replaceWith(newContent)`，它与 `.replaceAll()` 的作用相反。`.replaceWith()`\
  \ 函数将当前元素集中的元素替换为指定的内容。例如，要用一个新的空白 `<div>` 替换所有 `<div>` 元素，你可以使用以下语句：\n\n点击此处查看代码图片\n\
  \n```\n$(\"div\").replaceWith($(\"<div></div>\"));\n```\n\n#### 在 jQuery 中插入元素\n\
  \njQuery 的另一个重要特性是能够轻松地将元素插入到现有内容中。你已经看到了如何将项目追加到末尾；但是，如果你想将内容插入到中间呢？这时 `.before()`\
  \ 和 `.after()` 方法就派上用场了。\n\n`.after(content [,content])` 方法允许你指定一个元素，该元素应插入到当前 jQuery\
  \ 对象集中每个元素的后面。例如，要在文档中第三个 `<p>` 元素之后插入一个新段落，你可以使用以下语句：\n\n点击此处查看代码图片\n\n```\n$(\"\
  p:eq(2)\").after($(\"<p>New Fourth Paragraph</p>\"));\n```\n\n`.before(content [,content])`\
  \ 方法允许你指定一个元素，该元素应插入到当前 jQuery 对象集中每个元素的前面。例如，要在文档中第三个 `<p>` 元素之前插入一个新段落，你可以使用以下语句：\n\
  \n点击此处查看代码图片\n\n```\n$(\"p:eq(2)\").before($(\"<p>New Third Paragraph</p>\"));\n\
  ```\n\n* * *\n\n注意\n\n`.after()` 和 `.before()` 方法都允许你传入多个要插入的对象，用逗号分隔。这使你能够准备一组对象，然后将它们一起插入到正确的位置。\n\
  \n* * *\n\n#### 更改类\n\n\n\n\n\n丰富交互式网页的一个非常重要的部分是良好的 CSS 设计。JavaScript 和 jQuery\
  \ 可以通过动态添加和移除元素的类来增强 CSS 设计。\n\njQuery 使得添加、移除和切换类变得极其简单。如果你设计好了 CSS 代码，就能非常轻松地应用一些漂亮的效果。\n\
  \n使用`.addClass(className)`方法添加类。例如，要为所有`<span>`元素添加一个名为 active 的类，可以使用以下语句：\n\n\
  ```\n$(\"span\").addClass(\"active\");\n```\n\n使用`.removeClass([className])`方法移除类。例如，要从`<span>`元素中移除\
  \ active 类，可以调用以下代码：\n\n```\n$(\"span\").removeClass(\"active\");\n```\n\n你也可以在不指定`className`的情况下使用\
  \ remove，这会移除元素上的所有类。例如，以下语句会移除所有`<p>`元素上的类：\n\n```\n$(\"p\").removeClass();\n```\n\
  \n你还可以使用`.toggleClass(className [, switch])`方法来切换类的开启和关闭。除了`className`，你还可以为可选的`switch`参数指定`true`或`false`，以指示开启或关闭该类。\n\
  \n例如，要关闭所有`<span>`元素的 active 类和 inactive 类，代码如下：\n\n```\n$(\"span\").toggleClass(\"\
  active\", true);\n$(\"span\").toggleClass(\"inactive\", false);\n```\n\n#### 切换可见性\n\
  \n改变网页外观和感觉的一种简单方法是切换元素的可见性。你可以通过 JavaScript 将`style.display`属性设置为`\"none\"`或`\"\
  \"`来实现；然而，jQuery 提供了更优雅且可扩展的解决方案。\n\n要使用 jQuery 显示一个元素，请调用该对象的`.show()`方法。然后要隐藏该元素，请使用`.hide()`方法。就是这么简单。例如，要隐藏一个名为`jObj`的对象，使用以下语句：\n\
  \n```\njObj.hide();\n```\n\n要再次显示它，使用以下语句：\n\n```\njObj.show();\n```\n\n`.hide()`的一个问题是，应用后该元素将不再占据任何页面空间。这可能正是你想要的，或者在某些情况下，你可能只希望元素不可见，但仍然占据空间。要使元素不可见，将`opacity`\
  \ CSS 属性设置为 0。例如：\n\n```\njObj.css(\"opacity\", \"0\");\n```\n\n要使元素再次可见，将`opacity`设置回\
  \ 1：\n\n```\njObj.css(\"opacity\", \"1\");\n```\n\n---\n\n提示\n\n将不透明度设置得较低但不为 0，可以很好地显示元素当前未激活，同时仍然显示它们。例如，你可以将尚未实现且未激活的菜单和按钮元素的不透明度设置为\
  \ 0.5，这样它们仍然显示，但明显不可点击。\n\n---\n\n---\n\n## 自己动手：动态操作网页元素\n\n现在是将所有内容再次整合起来的时候了。在这个示例中，你从一个基本的网页开始，然后根据用户交互动态添加、修改和移除元素，如图\
  \ 10.2 所示。本示例的目的是让你开始动态添加内容，以及访问现有元素的属性并操作内容、可见性和类。\n\n![图片](img/image00902.jpeg)\n\
  \n**图 10.2** 一个动态构建左侧窗格中显示的元素，然后根据用户选择更改内容的网页。\n\n代码如清单 10.4、10.5 和 10.6 所示。掌握这个示例后，它应该会为你打开更复杂和丰富实现的大门。使用以下步骤来实现该示例：\n\
