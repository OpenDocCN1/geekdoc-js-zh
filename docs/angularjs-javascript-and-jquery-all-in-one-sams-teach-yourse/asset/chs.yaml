  12   $(\"#flip\").click(flip);\n13   stack();\n14 });\n```\n\n---\n\n**注意**\n\n\
  在本练习中，你需要使用 `$(window).load()` 事件处理程序，而不是 `$(document).ready()`，以确保在运行 `stack()`\
  \ 函数之前图片已经加载完成。\n\n---\n\n**6.** 添加以下调整大小处理程序，它接受一个方向参数，并使用该参数通过 `width()` 方法调整宽度来放大或缩小图片。注意，使用\
  \ `topIndex` 变量来确定要调整哪张图片：\n\n[点击此处查看代码图片]\n\n```javascript\n15 function resize(e,\
