  * * *\n\n### 实现样式化菜单\n\n最常用的 jQuery UI 小部件之一是菜单小部件。菜单小部件使您能够将元素树转换为可展开的菜单。通常，菜单是通过使用级联的`<ul>/<li>`元素以及定义链接行为和菜单文本的`<a>`元素来创建的。\n\
  \n* * *\n\n提示\n\n您可以使用`menus`选项自定义用于构建元素的元素标签；例如，`menus:\"div.menuItem\"`。\n\n*\
