  \ JavaScript 代码、CSS 样式以及 jQuery 和 JavaScript 中涉及的各种对象的工具。在本课中，你学习了如何访问这些对象的属性、特性、方法和其他部分，然后修改它们以将交互性和动态性应用到网页中。\n\
  \n你还学习了如何动态创建 HTML 对象并将其添加到网页中，以及如何根据用户交互删除和修改现有元素。\n\n### 问答\n\n**问.** 你展示了如何在\
  \ jQuery 中添加和删除类；在 JavaScript 中是否有相同的方法？\n\n**答.** 是的，但你可能不应该使用它。DOM 对象的 `className`\
  \ 属性包含一个以空格分隔的类列表。你可以通过将新的类名附加到该属性来添加类——例如，`obj.className += \" \" + newClass;`。删除\
  \ `className` 则更困难。你需要使用正则表达式语句，或者拆分字符串、删除类然后重新构建。这些方法比 jQuery 风险大得多，因为你可能会搞乱字符串，导致所有类都无法工作。\n\
  \n**问.** 有没有办法旋转图像元素？\n\n**答.** 是的，在某些浏览器中可以。你可以对 Firefox 和 Chrome 使用 transform\
  \ CSS 属性，对 Internet Explorer 使用 filter 属性。以下代码演示了在 Firefox、IE 和 Chrome 中使用 jQuery\
  \ 将图像旋转 90 度：\n\n点击此处查看代码图片\n\n```\n$(\"img\").css({\n    \"-webkit-transform\"\
  : \"rotate(90deg)\",\n    \"-moz-transform\": \"rotate(90deg)\",\n    \"filter\"\
  : \"progid:DXImageTransform.Microsoft.BasicImage(rotation=1)\"\n});\n```\n\n###\
  \ 实战练习\n\n实战练习包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 小测验\n\n\n\n\n\n\
  **1.** 如何让一个元素在网页浏览器中消失，同时仍然占据空间？\n\n**2.** 哪个 CSS 属性允许你指定当两个元素重叠时，哪个 HTML 元素显示在最上面？\n\
  \n**3.** 鼠标事件的 `screenX`、`pageX` 和 `clientX` 属性之间有什么区别？\n\n**4.** 使用什么 jQuery 代码可以从\
  \ `id=\"container\"` 的元素中移除所有 `<p>` 元素？\n\n**5.** 判断正误：一个 HTML 元素一次只能被分配一个类。\n\n\
  #### 测验答案\n\n**1.** 通过将 CSS 属性 `opacity` 设置为 0。\n\n**2.** `z-index`\n\n**3.** `screenX`\
  \ 相对于屏幕的左边缘，`pageX` 相对于文档的左边缘，`clientX` 相对于浏览器窗口的左边缘。\n\n**4.** `$(\"#container\
  \ p\").remove();`\n\n**5.** 错误。元素可以被分配多个类。\n\n#### 练习\n\n**1.** 打开清单 10.1、10.2 和\
  \ 10.3 中的代码，添加一个带有 `target` 和 `href` 值的链接。然后修改 JavaScript，使其也在网页的信息部分显示这些值，这样你就可以将鼠标悬停在链接上并看到它们。\n\
  \n**2.** 打开清单 10.7、10.8 和 10.9 中的代码，添加四个新按钮。添加两个按钮用于向上和向下移动图像。然后添加两个按钮，分别将图像的不透明度增加\
  \ 0.1 或减少 0.1。你需要确保不透明度停在 0 和 1。\n\n## 第 11 课 使用窗口、浏览器和其他非网页元素\n\n本课你将学到：\n\n![图片](img/image00767.jpeg)\
  \ 为网页添加定时器\n\n![图片](img/image00767.jpeg) 获取和设置 Cookie\n\n![图片](img/image00767.jpeg)\
  \ 创建弹出窗口\n\n动态网页通常需要你访问，甚至在某些情况下操作 HTML 元素之外的内容。JavaScript 提供了一组丰富的对象和函数，允许你访问有关屏幕、浏览器窗口、历史记录等信息。\n\
  \n本课的第一部分描述了 `screen`、`window`、`location` 和 `history` 对象，它们为 JavaScript 提供了访问网页之外信息的接口。第二部分介绍如何利用这些对象来实现\
  \ Cookie、弹出窗口和定时器。\n\n### 理解 Screen 对象\n\n你在之前的课程中已经见过 screen 对象的使用。你曾使用 screen\
  \ 对象获取颜色深度以及屏幕的高度和宽度。随着移动设备和平板电脑的普及，获取屏幕尺寸变得越来越重要。\n\n现在有各种各样的屏幕尺寸，因此你必须能够设计网页和动态交互，将屏幕尺寸考虑在内。\n\
  \n表 11.1 描述了 screen 对象上可用的全部属性。\n\n![图片](img/image00904.jpeg)\n\n**表 11.1 Screen\
  \ 对象属性**\n\n### 使用 Window 对象\n\nwindow 对象是外部对象集中最强大的一个。window 对象提供了对浏览器窗口的访问，允许你获取浏览器窗口的尺寸和位置等信息。\n\
  \n使用 window 对象，你还可以创建和控制新的浏览器窗口，以便在不想离开当前页面的情况下显示额外的网页内容。\n\n以下部分描述了 window 对象的一些方法和属性。\n\
  \n#### 访问 Window 对象属性\n\nwindow 对象为你提供了关于浏览器窗口的重要信息。你可以访问当前窗口或其父窗口的大小和位置。例如，以下代码获取从屏幕左上角到浏览器左上角的像素距离（向下和向左）：\n\
  \n点击此处查看代码图片\n\n```\nvar fromTop = window.self.screenY;\nvar fromLeft = window.self.screenX;\n\
  ```\n\n表 11.2 列出了一些更重要的 window 对象属性及其用途。\n\n![图片](img/image00905.jpeg)\n\n**表 11.2\
  \ Window 对象属性**\n\n#### 使用 Window 对象方法\n\nwindow 对象还提供了一组方法，允许你从 JavaScript 代码中创建和管理额外的子窗口。\n\
  \n例如，以下代码打开一个新的浏览器窗口并加载指定的 URL：\n\n点击此处查看代码图片\n\n```\nvar tempWindow = window.open(\"\
  http://jquery.com\");\n```\n\n之后，从原始网页的 JavaScript 代码中，你可以使用以下语句关闭新窗口：\n\n```\n\
  tempWindow.close();\n```\n\n表 11.3 列出了一些更重要的 window 对象方法及其用途。\n\n![图片](img/image00906.jpeg)\n\
  \n**表 11.3 Window 对象方法**\n\n### 使用浏览器 Location 对象\n\n浏览器 location 对象允许你访问浏览器中的当前位置。这使你能够获取所有\
  \ URL 信息，以及重新加载当前页面或在当前窗口中加载新页面。\n\n例如，以下语句从当前页面获取 URL，然后加载一个不同 URL 的新页面：\n\n点击此处查看代码图片\n\
  \n```\nvar oldURL = location.href;\nlocation.assign(\"http://jquery.com\");\n```\n\
  \n此外，如果 URL 链接到网页上的特定锚点，你可以使用 `location.hash` 获取 URL 的那一部分。你可以利用静态网页中已有的锚点，为链接到特定位置的其他网页提供向后兼容性。你读取锚点哈希，然后调整动态内容以匹配原始网页中该位置的内容：\n\
  \n```\nvar anchor = location.hash;\n```\n\n表 11.4 列出了 location 对象的属性和方法。\n\n![图片](img/image00907.jpeg)\n\
  \n**表 11.4 Location 对象属性和方法**\n\n### 使用浏览器 History 对象\n\nhistory 对象提供了对浏览器导航历史记录的访问，允许你动态地前进和后退，而无需用户点击浏览器的前进和后退按钮。\n\
  \n#### 在浏览器历史中向前导航\n\n要向前移动，你可以使用 `history.forward()` 移动到历史记录中的下一个 URL，或者使用 `history.go(n)`，其中\
  \ `n` 是一个正数，表示向前移动的步数。例如，以下语句向前移动三个 URL：\n\n```\nhistory.go(3);\n```\n\n#### 在浏览器历史中向后导航\n\
  \n要向后移动，你可以使用 `history.back()` 移动到历史记录中的上一个 URL，或者使用 `history.go(n)`，其中 `n` 是一个负数，表示向后移动的步数。例如，以下语句向后移动两个\
  \ URL：\n\n```\nhistory.go(-2);\n```\n\n### 控制外部链接\n\n动态网页编程的一个重要部分还涉及控制网页外部的链接。以下部分描述了一些控制外部链接行为的方法，例如阻止它们发生或强制它们打开新的浏览器窗口。\n\
  \n#### 停止网页上的外部链接\n\n使用一个简单的 jQuery 脚本可以完成的一个有用任务是阻止外部链接的发生。这允许你通过网页中的 `<a>` 元素锁定离开当前页面的链接。\n\
  \n\n\n\n要锁定网页中的外部链接，首先需要为链接到外部的 `<a>` 标签添加点击事件处理程序，然后在点击事件对象上调用 `preventDefault()`。例如，以下代码使用\
  \ jQuery 的 `^=` 选择器语法来查找 `href` 以 `http://` 开头的 `<a>` 标签，然后添加一个点击处理函数，阻止浏览器的默认行为：\n\
  \n点击此处查看代码图片\n\n```\n$('ahref^=\"http://\"').click(function (e){\n    any of your\
  \ own handler code . . .\n    e.preventDefault();\n  });\n```\n\n#### 强制链接在新浏览器窗口中打开\n\
  \n另一个可以用简单 jQuery 脚本完成的有用任务是强制外部链接在新窗口中打开。这样可以让当前窗口保持可用。\n\n要强制外部链接在新窗口中打开，请将链接到外部的\
  \ `<a>` 标签的 `target` 属性设置为 `_blank`。例如，以下代码查找 `href` 以 `http://` 开头的 `<a>` 标签，然后将\
  \ `target` 属性设置为 `_blank`，从而在点击时强制链接在新浏览器窗口中打开：\n\n[点击此处查看代码图片\n\n```\n$('ahref^=\"\
  http://\"').attr(\"target\", \"_blank\");\n```\n\n---\n\n## 动手实践：获取和设置 Cookie\n\n\
  Cookie 允许你在客户端浏览器中静态存储少量信息，是 Web 范式的重要组成部分。通常，Cookie 由服务器端脚本读取；然而，如果能够通过 JavaScript\
  \ 获取和设置 Cookie 而无需额外的服务器通信，也会很有帮助。\n\n你可以通过读取或写入 `document.cookie` 属性来获取和设置 Cookie。`document.cookie`\
  \ 是一个字符串格式，包含 `name`、`value`、`expiration` 和 `path`，格式如下：\n\n`name=value;expiration;path`\n\
  \n帮助你理解如何实现 Cookie 的最简单方法是通过示例展示。下面的示例将带你完成从网页创建简单的 JavaScript 来获取和设置 Cookie 的过程。示例代码如[清单\
  \ 11.1、11.2 和 11.3 所示。请按照以下步骤实现该示例：\n\n**1.** 在 Eclipse 中，创建 `lesson11/cookies.html`、`lesson11/js/cookies.js`\
  \ 和 `lesson11/css/cookies.css` 文件。\n\n**2.** 将清单 11.1、11.2 和 11.3 中的代码添加到 HTML 文件中。你应该能识别出这些\
  \ HTML 组件。HTML 代码包含几个样式化为按钮的 `<span>` 元素、用于输入 Cookie 名称和值的文本输入框，以及一个 Cookie 列表。\n\
  \n**3.** 将清单 11.3 中的 CSS 添加到 CSS 文件中。这段代码为按钮设置了样式。\n\n**4.** 打开 `cookies.js` 文件，添加以下\
  \ `ready()` 函数，该函数为获取、设置和删除 Cookie 的按钮添加点击处理程序。注意，处理程序从名称 `<input>` 字段中获取 Cookie\
  \ 名称：\n\n点击此处查看代码图片\n\n```\n01 $(document).ready(function(){\n02   $(\"#set\").click(function(e){setCookie($(\"\
  #cookieName\").val(),\n03                                         $(\"#cookieValue\"\
  ).val(), 1);});\n04   $(\"#get\").click(function(e){getCookie($(\"#cookieName\"\
  ).val());});\n05   $(\"#delete\").click(function(e){setCookie($(\"#cookieName\"\
  ).val(), \"\", -1);});\n06   displayCookies();\n07 });\n```\n\n**5.** 添加以下 `setCookie()`\
  \ 处理函数，该函数获取日期并用它创建过期时间字符串。然后代码使用 `name`、`value`、`expires` 和根路径作为字符串值设置 `document.cookie`：\n\
  \n点击此处查看代码图片\n\n```\n08 function setCookie(name, value, days) {\n09   var date =\
  \ new Date();\n10   date.setTime(date.getTime()+(days*24*60*60*1000));\n11   var\
  \ expires = \"; expires=\"+date.toGMTString();\n12   document.cookie = name + \"\
  =\" + value + expires + \"; path=/\";\n13   displayCookies();\n14 }\n```\n\n**6.**\
  \ 以下 `getCookie()` 处理程序获取 `document.cookie` 字符串，按 `;` 分割，然后遍历 Cookie 数组，直到找到名称与传入值匹配的\
  \ Cookie。该函数然后将值 `<input>` 字段设置为该 Cookie 的值：\n\n点击此处查看代码图片\n\n```\n15 function getCookie(name)\
  \ {\n16   var cookieStr = $(\"#cookieName\").val() + \"=\";\n17   var cArr = document.cookie.split(';');\n\
  18   for(var i=0;i < cArr.length;i++) {\n19     var cookie = cArr[i];\n20     while\
  \ (cookie.charAt(0)==' '){\n21       cookie = cookie.substring(1, cookie.length);\n\
  22     }\n23     if (cookie.indexOf(cookieStr) == 0){\n24       $(\"#cookieValue\"\
  ).val(cookie.substring(cookieStr.length, cookie.length));\n25       break;\n26     }\n\
  27   }\n28 }\n```\n\n**7.** 添加以下 `displayCookies()` 函数，该函数渲染当前设置的 Cookie 列表：\n\n\
  点击此处查看代码图片\n\n```\n29 function displayCookies(){\n30   $(\"#cookieList\").html(\"\
  \");\n31   var cArr = document.cookie.split(';');\n32   for(var i=0;i < cArr.length;i++)\
  \ {\n33     var cookie = cArr[i];\n34     $(\"#cookieList\").append($(\"<li></li>\"\
  ).html(cookie));\n35   }\n36 }\n```\n\n**8.** 保存所有三个文件，然后在 Web 浏览器中打开 HTML 文档，如图\
  \ 11.1 所示。尝试设置、获取和删除 Cookie。另外，导航离开页面再返回，Cookie 应该仍然存在。\n\n![图片](img/image00908.jpeg)\n\
