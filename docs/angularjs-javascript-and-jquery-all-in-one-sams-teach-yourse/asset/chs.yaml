  \ 总结\n\n在本课中，你学习了如何使用 jQuery 和 JavaScript 对象来查找和导航 DOM 元素。这为实现动态代码增加了一个关键环节，因为你通常希望作用于与搜索元素相关的元素，而不是搜索到的元素本身。\n\
  \n你学习了如何将 jQuery 请求链式连接，以对同一组 DOM 元素应用多个操作。这减少了脚本中所需的语句数量。\n\n你还学习了如何遍历与选择器返回的 jQuery\
  \ 对象相关联的 DOM 元素集。这允许你对集合中的每个单独元素应用不同的操作集，而无需单独查找每个元素。\n\n### 问答\n\n**问.** `$(“div:eq(n)”)`\
  \ 和 `$(“div”).eq(n)` 有什么区别？\n\n**答.** 最大的区别在于 `.eq()` 允许你指定负数并从末尾向前计数。例如，`.eq(-1)`\
  \ 是列表中的最后一个元素。而 `:eq()` 不支持负索引。\n\n**问.** 应该将多少个 jQuery 选项链式连接在一起？\n\n**答.** 好问题。这取决于具体情况。这实际上是性能与可读性/可重用性之间的权衡。请记住，每次\
  \ jQuery 查找背后都有一小段代码，因此你越能重复使用同一个 jQuery 堆栈，效果就越好。在某个点上，当前堆栈中实际包含的内容可能会变得非常混乱；然而，到了那个点，你应该避免未来的麻烦，继续前进。更好的方法是将操作分解为可重用的独立组，并为这些组定义变量名。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。在查看答案之前，请先尝试回答问题。\n\n#### 测验\n\n**1.**\
  \ 你会使用哪个 jQuery 方法来过滤出包含 `<p>` 子元素的元素？\n\n**2.** 你会使用哪个 jQuery 方法来获取 `id=\"middleEarth\"\
  ` 元素之前的所有兄弟 `<p>` 元素？\n\n**3.** `.map()` 和 `.each()` 有什么区别？\n\n#### 测验答案\n\n**1.**\
  \ `.has(\"p\");`\n\n**2.** `$(\"#middleEarth\").prevAll(\"p\");`\n\n\n\n\n\n**3.**\
  \ `.map()` 用于遍历元素集合，并返回一个新对象，其中包含每次迭代指定函数的结果。`.each()` 仅遍历元素并应用指定的函数。\n\n#### 练习\n\
  \n**1.** 扩展 `dom_manipulation.html` 中的 HTML 代码，使其包含更多类似其他部分的 `<div>` 区块。请注意，相同的功能会自动应用于每个区块。\n\
  \n## 第 9 课 应用 JavaScript 和 jQuery 事件构建丰富交互的网页\n\n本课学习内容：\n\n![图片](img/image00767.jpeg)\
  \ 用户和浏览器触发事件的方式\n\n![图片](img/image00767.jpeg) 事件对象上可访问的属性\n\n![图片](img/image00767.jpeg)\
  \ 如何添加能够动态响应事件的处理程序\n\n![图片](img/image00767.jpeg) 向事件处理程序传递额外数据的方法\n\n![图片](img/image00767.jpeg)\
  \ 手动触发事件的方法\n\n![图片](img/image00767.jpeg) 创建自定义事件的方式\n\n![图片](img/image00767.jpeg)\
  \ 如何在代码中实现并触发回调函数\n\nAngularJS、jQuery 和 JavaScript 的主要目标之一是为开发者提供创建极其复杂且高度活跃的网页的能力。交互式网页的核心是事件。事件基本上是指浏览器环境中发生的任何事情，从页面加载，到鼠标移动或点击，到键盘输入，再到窗口大小调整。\n\
  \n理解事件、表示事件的对象以及如何在网页中应用它们，将使你能够创建一些令人惊叹的用户交互。在本课中，你将学习理解事件所需的概念，以及如何利用它们构建丰富、交互式的网页。你将在本书的其余部分使用本课中的概念。\n\
  \nAngularJS 利用了本课讨论的底层 JavaScript 和 jQuery 事件功能，但也提供了额外的功能，例如数据监视，以实现更健壮的事件处理。这些概念将在\
  \ AngularJS 课程部分介绍。\n\n### 理解事件\n\n你已经在本书的几个示例中使用了事件。然而，要充分利用它们，你需要理解从物理交互到 AngularJS、jQuery\
  \ 和 JavaScript 交互（这些交互将修改屏幕元素和数据）的整个过程中发生了什么。以下各节描述了事件过程、涉及的组件以及如何在网页中实现事件。\n\n\
  #### 理解事件过程\n\n事件处理概念在高层面上很容易理解：你点击网页上的一个按钮，然后事情就发生了。本节将深入探讨，以便你理解背后的原理。以下列表描述了用户与网页或浏览器窗口交互时发生的重要事情。\n\
  \n**1. 物理事件发生**——物理事件发生；例如，用户点击或移动鼠标，或按下某个键。\n\n**2. 浏览器中触发事件**——用户交互导致 Web 浏览器触发事件——通常同时触发多个事件。例如，当用户在键盘上按下一个键时，会触发三个事件：`keypressed`、`keydown`\
  \ 和 `keyup` 事件。\n\n**3. 浏览器为事件创建对象**——Web 浏览器为每个触发的事件创建一个独立的对象。这些对象包含可由处理程序使用的事件信息。\n\
  \n**4. 调用用户事件处理程序**——调用用户定义的事件处理程序。你可以使用 JavaScript 创建处理程序，这些处理程序将与事件对象和/或页面元素交互，以提供与\
  \ HTML 元素的交互性。事件处理程序可以在三个阶段中起作用。以下描述了图 9.1 中所示的三个阶段：\n\n![图片](img/image00767.jpeg)\
  \ **捕获阶段**——捕获阶段是从文档直接向下经过每个父元素到达目标 HTML 元素的过程。默认情况下，捕获阶段的事件处理程序行为是禁用的。\n\n![图片](img/image00767.jpeg)\
  \ **目标阶段**——目标阶段发生在事件位于最初触发它的 HTML 元素中时。\n\n![图片](img/image00767.jpeg) **冒泡阶段**——冒泡阶段是从目标\
  \ HTML 元素向上经过每个父元素，一直回到文档的过程。默认情况下，冒泡阶段是启用的。\n\n![图片](img/image00887.jpeg)\n\n**图\
  \ 9.1** 事件首先在捕获阶段从文档向下到目标进行处理，然后在目标阶段，最后在冒泡阶段从目标向上经过文档。\n\n**5. 调用浏览器处理程序**——除了用户事件处理程序之外，浏览器还有默认的处理程序，它们根据触发的事件执行不同的操作。例如，当用户点击链接时，浏览器会调用一个事件处理程序，该处理程序会导航到链接中指定的\
  \ `href` 位置。\n\n#### 查看事件对象\n\n当浏览器检测到事件发生时，它会创建事件对象。如果事件处理程序是由 AngularJS 或 jQuery\
  \ 定义的，则事件对象会转换为 jQuery 事件对象，该对象具有更多属性和方法。因此，你需要了解你正在处理的是哪种事件对象类型。\n\n事件对象为你提供有关事件的附加信息，例如事件类型（例如\
  \ `click` 或 `keypress`）、按下了哪些键、鼠标位置、事件发生在哪个 HTML 元素上等。表 9.1 描述了你将使用的最常用的事件属性。\n\n\
  ![图片](img/image00888.jpeg)![图片](img/image00889.jpeg)\n\n**表 9.1 JavaScript 和 jQuery\
  \ 事件对象属性**\n\n事件还提供了一些方法，允许你对事件的行为进行一些控制——例如，停止传播和默认的 Web 行为。表 9.2 描述了事件对象上的重要方法。\n\
  \n![图片](img/image00890.jpeg)\n\n**表 9.2 JavaScript 和 jQuery 事件对象方法**\n\n#### 回顾事件类型\n\
  \n事件类型是 JavaScript、jQuery 和 AngularJS 用来标识发生的物理事件的关键字。这些关键字用于附加处理程序以指定事件类型。此外，正如你稍后将看到的，这些关键字也用于方法名称中，这些方法可用于附加事件处理程序或手动触发事件。\n\
  \nJavaScript 提供了几种事件类型，对应于动态页面交互期间发生的不同事件。jQuery 事件处理支持所有 JavaScript 事件，并添加了一些自己的事件。表\
  \ 9.3 列出了 JavaScript 和 jQuery 支持的不同事件类型。\n\n![图片](img/image00891.jpeg)![图片](img/image00892.jpeg)\n\
  \n**表 9.3 JavaScript 和 jQuery 事件类型**\n\n### 使用页面加载事件进行初始化\n\n当 HTML 文档加载时，`<script>`\
  \ 标签中指定的 JavaScript 代码将被加载并执行。通常，JavaScript 和 jQuery 逻辑将位于稍后执行的函数中。然而，会有一些代码执行初始化工作，例如将事件处理程序附加到页面元素，甚至向现有元素添加额外的元素。\n\
  \n问题在于，当 JavaScript 代码加载时，HTML 元素对象可能尚未由浏览器构建。如果在 HTML 对象创建之前尝试引用它，将会抛出异常，因此你需要等到页面完全加载。\n\
  \n\n\n\n\n这就是 `load` 事件极其方便的地方。将初始化代码放在页面加载时触发的事件处理程序中，可以确保所有 HTML 对象都已创建，DOM 已完全就绪。\n\
  \n### 使用 JavaScript 的 `onload` 事件\n\n要在 JavaScript 中添加页面加载时运行的初始化代码，请创建一个执行初始化的\
  \ JavaScript 函数。例如，考虑以下 JavaScript 代码，它展示了一个简单的初始化函数骨架：\n\n点击此处查看代码图片\n\n```\nfunction\
  \ onloadHandler(){\n\n  (初始化代码写在这里...)\n\n}\n```\n\n现在你有两种方法可以让 `onloadHandler()`\
  \ 在页面完全加载时触发。第一种是将初始化代码附加到 HTML 中 `<body>` 元素的 `onload` 属性上。例如：\n\n点击此处查看代码图片\n\n\
  ```\n<body onload=\"onloadHandler()\">\n```\n\n第二种方法是在 JavaScript 代码中直接将其赋值给 `window`\
  \ 对象。例如：\n\n点击此处查看代码图片\n\n```\nwindow.onload = onloadHandler;\n```\n\n### 在 jQuery\
  \ 中添加初始化代码\n\n在 jQuery 中，初始化代码可以在两个不同的时间点触发并执行：当 DOM 就绪时，以及当文档及其资源完全加载时。使用哪种选项取决于初始化代码需要完成什么操作。\n\
  \n使用 jQuery 的 `.ready()` 方法会在 DOM 完全就绪时触发初始化代码运行。此时所有 DOM 对象都已创建，页面将显示给用户。但此时所有页面资源（如图像）可能尚未完全下载。这个选项能让你尽快添加交互和功能。以下展示了使用\
  \ `.ready()` 附加简单初始化函数的示例：\n\n点击此处查看代码图片\n\n```\n$(document).ready(function(){\n\
  \n  (初始化代码写在这里...)\n\n}\n```\n\n使用 jQuery 的 `.load()` 方法会在所有页面资源加载并渲染给用户后触发初始化代码运行。有时，如果初始化代码需要用到图像等资源，你可能会使用这个选项。以下展示了使用\
  \ `load()` 附加简单初始化函数的示例：\n\n点击此处查看代码图片\n\n```\n$(window).load(function(){\n\n  (初始化代码写在这里...)\n\
  \n}\n```\n\n* * *\n\n警告\n\n`.ready()` 和 `.load()` 方法与在 `<body>` 标签中使用 `onload=\"\
  ...\"` 属性不兼容。如果你使用 jQuery，请使用 `.ready()` 或 `.load()`；否则，请使用 `onload` 属性。\n\n* *\
  \ *\n\n## 向 DOM 元素添加和移除事件处理程序\n\n为了与网页中发生的事件进行交互，必须为每个你想要交互的特定事件类型添加事件处理程序。事件处理程序是一个\
  \ JavaScript 函数，用于添加、移除或修改 DOM 元素，或执行完成交互所需的任何其他操作。例如，以下代码是一个事件处理程序的示例，它将 `<p>`\
  \ 元素中显示的文本更改为 `\"clicked\"`：\n\n```\nfunction clickHandler(){\n\n  $(\"p\").html(\"\
  clicked\");\n\n}\n```\n\n有几种方法可以向 DOM 元素添加事件处理程序。以下部分将介绍每种方法及其优缺点。\n\n### 在 HTML\
  \ 中分配事件处理程序\n\n向 DOM 元素添加事件处理程序最基本的方法是直接在 HTML 代码中完成。这种方法的优点是简单且易于查看哪个事件处理程序被分配给了特定的\
  \ DOM 对象。\n\n在 HTML 中，通过设置标签语句中处理程序属性的值，将事件处理程序添加到 DOM 对象。对于元素支持的每个事件，都有一个以“on”开头后跟事件名称的属性。例如，`click`\
  \ 事件的属性是 `onclick`，`load` 事件的属性是 `onload`。要查看事件列表，请参见表 9.1。\n\n以下示例展示了在 HTML 代码中向\
  \ DOM 元素添加 `click` 事件处理程序是多么简单：\n\n点击此处查看代码图片\n\n```\n<div onclick=\"clickHandler()\"\
  >点击此处</div>\n```\n\n当 `<div>` 元素被点击时，这将调用以下函数：\n\n```\nfunction clickHandler(){\n\
  \n  $(\"div\").html(\"clicked\");\n\n}\n```\n\n你还可以使用 `event` 关键字将 DOM 事件对象作为参数传递给事件处理程序。这允许你在事件处理程序中访问事件信息；例如：\n\
  \n点击此处查看代码图片\n\n```\n<div onclick=\"clickHandler(event)\">点击此处</div>\n```\n\n当 `<div>`\
  \ 元素被点击时，将调用以下函数，并通过读取 `e.screenX` 将文本更改为显示鼠标光标的 `x` 坐标：\n\n点击此处查看代码图片\n\n```\n\
  function clickHandler(e){\n\n  $(\"div\").html(\"在 X 位置点击: \" + e.screenX);\n\n\
  }\n```\n\n你还可以定义将特定参数传递给事件，从而区分特定功能。参数可以是数字、用单引号括起来的字符串，甚至是 DOM 对象的 `id` 值（此时将传递\
  \ DOM 元素）。例如，以下代码添加了事件处理程序，传递事件对象、`id=\"heading\"` 的 `<h1>` 元素的 DOM 对象，以及一个数字和字符串：\n\
  \n点击此处查看代码图片\n\n```\n<h1 id=\"heading\"></h1>\n\n<div onclick=\"clickHandler(event,heading,1,\"\
  Yes\")\">点击此处</div>\n\n<div onclick=\"clickHandler(event,heading,2,\"No\")\">或点击此处</div>\n\
  ```\n\n点击时，这些元素将调用以下函数，并使用 DOM 对象的 `innerHTML` 属性将文本更改为显示数字、消息和鼠标光标的 x 坐标：\n\n点击此处查看代码图片\n\
  \n```\nfunction clickHandler(e,obj,num,msg){\n\n  obj.innerHTML = \"DIV \" + num\
  \ + \" 说 \" + msg +\" 在 X 位置: \" + e.screenX;\n\n}\n```\n\n不过，这种方法有几个主要缺点。首先，DOM\
  \ 元素必须在 HTML 中定义，并且不能动态移除和重新读取。其次，如果你希望将同一个事件处理程序分配给多个 DOM 元素，则必须在 HTML 中为每个元素的标签添加代码。\n\
  \n通常，你只在 JavaScript 非常少的基本示例中使用 HTML 方法分配事件处理程序。\n\n### 在 JavaScript 中添加事件处理程序\n\
  \n你还可以在 JavaScript 代码中动态地向 DOM 对象添加和移除事件处理程序。这种方法提供了优势：你可以在任何时间点动态添加事件处理程序，而不仅仅是在页面加载时。因此，它允许你为页面加载后创建的元素添加事件监听器。\n\
  \n要在 JavaScript 中添加事件处理程序，请在 DOM 对象上调用 `addEventListener()`。`addEventListener()`\
  \ 函数接受三个参数：第一个是事件 `type`（事件类型定义在表 9.1 中），第二个是要调用的函数，第三个是一个布尔值，如果处理程序应在捕获阶段和冒泡阶段调用，则指定为\
  \ true；如果处理程序仅在冒泡阶段调用，则指定为 false。\n\n使用 `addEventListener()` 的诀窍在于如何将自定义数据传递给处理程序调用。一种方法是将实际函数处理程序包装在一个简单的包装函数中，该函数将参数传递给事件处理程序。以下代码说明了这一点：\n\
  \n点击此处查看代码图片\n\n```\nfunction clickHandler(e,objId,num,msg){\n\n  var obj = document.getElementById(objId);\n\
  \n  obj.innerHTML = \"DIV \" + num + \" 说 \" + msg +\" 在 X 位置: \" + e.screenX;\n\
  \n}\n...\n```\n\n\n\n\n\n`document.getElementById(\"div1\").addEventListener('click',\n\
  \  function(e){\n    clickHandler(e, \"heading\", 1, \"yes\");\n  },false);`\n\n\
  以上代码中的 `addEventListener()` 调用过程如下：指定了事件类型 `'click'`，然后定义了一个新的匿名 `function`（无名称），该函数接受事件对象作为唯一参数，由\
  \ `e` 表示。在包装函数内部，实际的事件处理程序被调用，并传入自定义参数，其中包括用于传递事件对象的 `e` 变量。在示例中，`false` 用于指示处理程序仅在冒泡阶段被调用。\n\
  \n你也可以使用 DOM 对象上的 `removeEventListener()` 函数从事件中移除事件处理程序。你需要指定事件类型和要移除的事件处理程序的名称。例如，以下代码添加了一个事件处理程序，然后将其移除：\n\
  \n点击此处查看代码图片\n\n```\nvar obj = document.getElementById(\"div1\");\nobj.addEventListener('click',\
  \ clickHandler);\nobj.removeEventListener('click', clickHandler);\n```\n\n* * *\n\
  \n**提示**\n\n你也可以使用处理程序属性在 DOM 对象本身上设置访问事件处理程序。处理程序属性为“on”加上事件类型。例如，对于 click 事件，该属性为\
  \ `obj.onclick`。你可以使用 `obj.onclick()` 调用事件处理程序，或直接使用 `obj.onclick = function handler(){\
  \ ...};` 进行赋值。\n\n* * *\n\n* * *\n\n### 自己动手：通过 JavaScript 向 DOM 对象添加事件处理程序\n\n\
  在本例中，你将使用 JavaScript 方法动态地将事件处理程序附加到 DOM 对象上。按照以下步骤创建清单 9.1、9.2 和 9.3 中所示的文件：\n\n\
  1. 在 Eclipse 中，创建 `lesson09`、`lesson09/js` 和 `lesson09/css` 文件夹。\n\n2. 创建 `lesson09/broken_event.html`、`lesson09/js/broken_event.js`\
  \ 和 `lesson09/css/broken_event.css` 文件。\n\n3. 将清单 9.1 中所示的代码添加到 HTML 文件中。你应该能识别出该文件中的几乎所有内容。注意\
  \ `<body>` 标签的 `onload` 事件处理程序被设置为 `onloadHandler()`。\n\n4. 将清单 9.3 中的 CSS 添加到 CSS\
  \ 文件中。现在你也应该能识别出这些 CSS 语句。\n\n5. 打开 `broken_event.js` 文件，并添加以下用于处理点击事件的函数。注意它接受多个参数。第一个参数是\
  \ DOM 事件对象，用于通过 `e.screenX` 获取 x 坐标。它还接受一个对象 id，用于获取要写入的目标对象。其余参数用于写出消息，写入由 `objId`\
  \ 指定的对象的 `innerHTML`：\n\n点击此处查看代码图片\n\n```\n01 function clickHandler(e,objId,num,msg){\n\
  02   var obj = document.getElementById(objId);\n03   obj.innerHTML = \"DIV \" +\
  \ num + \" says \" + msg +\" at X postion: \" + e.screenX;\n04 }\n```\n\n6. 创建以下包装函数，用于向实际的事件处理程序传递参数。包装函数仅接受事件对象作为参数\
  \ `e`。然后它们使用适当的值调用 `clickHandler()` 函数。在本例中，事件处理程序随后通过调用 `removeEventListener()`\
  \ 从目标对象中移除。移除事件处理程序并不常见；此处仅作为示例：\n\n点击此处查看代码图片\n\n```\n05 function yesWrapper(e){\n\
  06   clickHandler(e, \"heading\", 1, \"yes\");\n07   e.target.removeEventListener('click',\
  \ yesWrapper);\n08 }\n09 function noWrapper(e){\n10   clickHandler(e, \"heading\"\
  , 1, \"no\");\n11   e.target.removeEventListener('click', noWrapper);\n12 }\n```\n\
  \n7. 添加以下 `onloadHandler()` 函数，该函数调用 `addEventListener()` 为每个 `<div>` 元素添加 `click`\
  \ 事件处理程序：\n\n点击此处查看代码图片\n\n```\n13 function onloadHandler(){\n14   document.getElementById(\"\
  div1\").addEventListener('click', yesWrapper, false);\n15   document.getElementById(\"\
  div2\").addEventListener('click', noWrapper, false);\n16 }\n```\n\n8. 保存所有三个文件，然后在\
  \ Web 浏览器中打开 HTML 文档，并尝试使用图 9.2 中所示的“Say Yes”和“Say No”按钮。注意按钮只能工作一次，因为事件处理程序已被移除。如果我们没有移除事件处理程序，按钮将继续处理事件并更改\
  \ `<h1>` 元素的文本。\n\n![图片](img/image00893.jpeg)\n\n**图 9.2** 一个简单的 JavaScript 网页，动态地向\
  \ `<div>` 元素添加事件处理程序并响应鼠标点击。\n\n**清单 9.1 broken_event.html HTML 文件，加载 jQuery 和 JavaScript，附加事件处理程序元素以提供用户交互，然后定义示例中使用的\
  \ `<div>` 和 `<h1>` 元素**\n\n点击此处查看代码图片\n\n```\n01 <!DOCTYPE html>\n02 <html>\n03\
  \   <head>\n04     <title>Broken Event</title>\n05     <meta charset=\"utf-8\" />\n\
  06     <script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n07     <script type=\"text/javascript\" src=\"js/broken_event.js\"></script>\n\
  08     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/broken_event.css\"\
  >\n09   </head>\n10   <body onload=\"onloadHandler()\">\n11     <div id=\"div1\"\
  )\">Say Yes</div>\n12     <div id=\"div2\")\">Say No</div>\n13     <h1 id=\"heading\"\
  ></h1>\n14   </body>\n15 </html>\n```\n\n**清单 9.2 broken_event.js JavaScript 代码，定义事件处理程序并动态将其附加到\
  \ `<div>` 元素**\n\n点击此处查看代码图片\n\n```\n01 function clickHandler(e,objId,num,msg){\n\
  02   var obj = document.getElementById(objId);\n03   obj.innerHTML = \"DIV \" +\
  \ num + \" says \" + msg +\" at X postion: \" + e.screenX;\n04 }\n05 function yesWrapper(e){\n\
  06   clickHandler(e, \"heading\", 1, \"yes\");\n07   e.target.removeEventListener('click',\
  \ yesWrapper);\n08 }\n09 function noWrapper(e){\n10   clickHandler(e, \"heading\"\
  , 2, \"no\");\n11   e.target.removeEventListener('click', noWrapper);\n12 }\n13\
  \ function onloadHandler(){\n14   document.getElementById(\"div1\").addEventListener('click',\
  \ yesWrapper, false);\n15   document.getElementById(\"div2\").addEventListener('click',\
  \ noWrapper, false);\n16 }\n```\n\n**清单 9.3 broken_event.css CSS 代码，为 `<div>` 元素设置样式**\n\
  \n点击此处查看代码图片\n\n```\n1 div{\n2   border-radius:5px;\n3   margin:3px;\n4   padding:5px;\n\
  5   background-color:lightgrey;\n6   font-weight:bold;\n7   display:inline-block;\n\
  8   cursor:pointer;\n9 }\n```\n\n* * *\n\n#### 在 jQuery 中应用事件处理程序\n\n将事件处理程序附加到\
  \ DOM 元素的最佳方法是使用 jQuery。使用 jQuery 对象可以轻松选择不同的对象集，并同时将相同的事件处理程序应用于所有对象。\n\n过去，jQuery\
  \ 有几种添加和移除事件处理程序的方法，包括 `bind()/unbind()` 和 `delegate()/undelegate()`。`bind()` 方法模仿了\
  \ `addEventListener()` 的行为，而 `delegate()` 使得可以向 jQuery 对象添加事件，并且当添加额外的子元素时，事件处理程序会自动委托给这些子元素。\n\
  \n从 jQuery 1.7 开始，这些方法都被一对简单的方法 `on()` 和 `off()` 所取代。事件处理程序使用 `on()` 方法附加到 jQuery\
  \ 对象上。`on()` 方法可以通过以下两种格式之一调用：\n\n点击此处查看代码图片\n\n```\non(events [, selector] [, data],\
  \ handler(eventObject))\non(events-map [, selector][, data])\n```\n\n\n\n\n\n以下列表描述了在向\
  \ jQuery 对象添加事件处理程序时，可以添加到 `on()` 方法的每个参数的作用：\n\n![Image](img/image00767.jpeg) `events`——一个或多个以空格分隔的事件类型以及可选的命名空间（用点语法表示）；例如，`\"\
  click\"`、`\"mouseenter mouseleave\"` 或 `\"keydown.myPlugin\"`。事件类型列表可在表 9.1 中找到。\n\
  \n![Image](img/image00767.jpeg) `events-map`——一个映射对象，其中字符串键指定一个或多个以空格分隔的事件类型，值则指定事件触发时调用的处理函数；例如，`{'click':myhandler}`\
  \ 或 `{'click':function myHandler(e){return true;}}`。\n\n![Image](img/image00767.jpeg)\
  \ `selector`——可选。选择器字符串，指定哪些后代元素在事件触发时也应调用事件处理程序。这替代了 `delegate()` 方法的功能。如果你将事件处理程序添加到一组始终存在于页面中的父对象上，那么任何匹配选择器的后代元素在事件触发时都会调用该处理程序，即使它们是在事件绑定之后才添加的。\n\
  \n![Image](img/image00767.jpeg) `data`——可选。可以是一个数字、字符串或对象，当事件触发时，它会作为 `event` 对象的\
  \ `data` 部分（即 `event.data`）传递给处理程序。\n\n![Image](img/image00767.jpeg) `handler(eventObject)`——如果你不使用\
  \ `events-map`，则需要指定事件触发时要执行的处理函数。\n\n要使用 jQuery 从元素中移除事件处理程序，请调用 jQuery 对象的 `off()`\
  \ 方法。`off()` 方法的语法如下之一：\n\n点击此处查看代码图片\n\n```\noff(events [, selector] [, handler(eventObject)])\n\
  off(events-map [, selector])\n```\n\n如果未指定处理程序，`off()` 函数将移除指定事件的所有事件处理程序。以下示例展示了如何使用\
  \ `on()` 为所有 `<div>` 元素添加事件处理程序，然后使用 `off()` 将其移除：\n\n点击此处查看代码图片\n\n```\n$(\"div\"\
  ).on(\"click\",clickHandler);\n$(\"div\").off(\"click\",clickHandler);\n```\n\n\
  * * *\n\n注意\n\n`on()` 和 `off()` 方法适用于所有 jQuery 事件类型，包括你自定义的事件。jQuery 还提供了一些简单的辅助函数（将在本课后面讨论），以便更轻松地为某些事件附加处理程序。\n\
  \n* * *\n\n提示\n\n通常你希望事件处理程序只运行一次，即事件首次发生时。jQuery 提供了非常有用的 `one()` 方法，它会添加一个事件，然后在首次触发后自动移除它。`one()`\
  \ 方法使用与 `on()` 方法相同的语法。\n\n* * *\n\n## 动手试一试：使用 jQuery 添加事件处理程序\n\n在本例中，你将使用 jQuery\
  \ 方法动态地将事件处理程序附加到 DOM 对象。按照以下步骤创建清单 9.4、9.5 和 9.6 中所示的文件：\n\n1. 在 Eclipse 中，创建 `lesson09/working_event.html`、`lesson09/js/working_event.js`\
