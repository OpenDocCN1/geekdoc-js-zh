  47     </div>\n48   </body>\n49 </html>\n```\n\n---\n\n### 动手试一试：为 HTML 元素添加边框\n\
  \n另一个可以通过修改来彻底改变 HTML 组件外观的 CSS 属性是 `border` 属性。所有容器元素（如 `<div>`、`<span>` 和 `<p>`）都允许你通过\
  \ CSS 定义边框样式。\n\n表 4.2 描述了 CSS 中可修改的一些属性，用于定义各种边框样式。\n\n![图像](img/image00838.jpeg)\n\
  \n**表 4.2 定义边框样式的 CSS 属性**\n\n你可以使用以下语法在单个属性设置中为 `border-width`、`border-color` 和\
  \ `border-style` 属性指定不同的值：\n\n点击此处查看代码图片\n\n```\nproperty: top right bottom left;\n\
  border-width: 1px 2px 1px 2px;\nborder-color: red blue red blue;\n```\n\n你也可以使用位置属性（如\
  \ `border-top` 或 `border-top-width`）来设置单独的边框组件属性。例如，以下 CSS 将仅设置边框的顶部和左侧组件：\n\n```\n\
  border-top: 1px solid black;\nborder-left-color: blue;\nborder-left-style: solid;\n\
  border-left-width: 2px;\n```\n\n以下步骤将引导你通过创建清单 4.4 和清单 4.5 中的代码，为 HTML `<div>` 元素添加多种类型的边框：\n\
  \n1. 在 Eclipse 的 `lesson04` 文件夹中创建一个名为 `borders.html` 的新 HTML 文档。\n\n2. 添加清单 4.4\
  \ 中所示的代码。该代码链接到一个名为 `css/borders.css` 的外部样式表，然后定义了一系列 `<div>` 元素。\n\n3. 在 Eclipse\
  \ 的 `lesson04/css` 文件夹中创建一个名为 `borders.css` 的新 CSS 文档。\n\n4. 将以下行添加到新的 CSS 文件中，为\
  \ `<div>` 元素设置基本间距和大小：\n\n   点击此处查看代码图片\n\n   ```css\n   01 div { width:200px; margin:5px;\
  \ padding:2px; text-align:center}\n   ```\n\n5. 添加清单 4.5 中第 2–8 行代码，为不同的 `<div>`\
  \ 元素定义几种边框样式。\n\n6. 添加以下 CSS 规则，为其中两个 `<div>` 元素创建圆角边框：\n\n   点击此处查看代码图片\n\n   ```css\n\
  \   09 #round { border: 1px solid; border-radius:5px;}\n   10 #veryround { border:\
  \ 1px solid; border-radius:50%;}\n   ```\n\n7. 添加清单 4.5 中第 11–20 行代码。这些代码在 `<div>`\
  \ 元素上创建阴影。第一个是外阴影，第二个包含 `inset` 值，将其定义为内阴影。\n\n8. 添加以下代码行，创建一个混合边框。这旨在向你展示你可以对边框的每一侧进行大量控制。顶部为\
  \ `solid`，右侧有圆角；左侧为 `dotted`，底部为 `ridge`，右侧有圆角：\n\n   点击此处查看代码图片\n\n   ```css\n\
  \   21 #mixed {\n   22   border-top: 1px solid;\n   23   border-top-left-radius:5px;\n\
  \   24   border-left: 1px dotted;\n   25   border-bottom: 5px ridge;\n   26   border-bottom-right-radius:\
  \ 10px;\n   27 }\n   ```\n\n9. 添加以下代码，仅使用带有大圆角和背景色的边框来创建一个美观的按钮：\n\n   点击此处查看代码图片\n\
  \n   ```css\n   28 #button {\n   29   width:150px;\n   30   background-color: #2233FF;\n\
  \   31   color: white;\n   32   border:5px outset blue;\n   33   border-radius:50%;\n\
  \   34 }\n   ```\n\n10. 保存文件，并在 Web 浏览器中打开 HTML 文件。你应该会看到类似于图 4.12 所示的结果。注意仅用几条\
  \ CSS 样式语句就应用了不同的边框样式。\n\n![图像](img/image00839.jpeg)\n\n**图 4.12** 添加 CSS 边框元素可以为\
  \ HTML 元素应用多种边框。\n\n## 清单 4.4 创建一系列由清单 4.5 设置样式的 `<div>` 元素的 HTML\n\n点击此处查看代码图片\n\
  \n```html\n01 <html>\n02   <head>\n03     <title>Borders</title>\n04     <meta charset=\"\
  UTF-8\">\n05     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/borders.css\"\
  >\n06   </head>\n07   <body>\n08     <div id=\"simple\">Simple Border</div>\n09\
  \     <div id=\"dashed\">Dashed Border</div>\n10     <div id=\"dotted\">Dotted Border</div>\n\
