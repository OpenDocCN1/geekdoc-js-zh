  \n**清单 29.2** `tabs.html` AngularJS 局部模板，包含构建选项卡容器的模板代码\n\n点击此处查看代码图片\n\n* * *\n\
  \n```\n01 <div class=\"tabbable\">\n02   <div class=\"tabs\">\n03     <span class=\"\
