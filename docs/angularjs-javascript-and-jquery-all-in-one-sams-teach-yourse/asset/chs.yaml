  \n**图 2.5** JavaScript 控制台显示两条成功的日志消息，没有错误。\n\n#### 调试 HTML 元素\n\n调试 HTML 元素有时可能是一个巨大的挑战。简单的语法错误可能导致浏览器在尝试渲染\
  \ HTML 文档时出现重大问题。此外，HTML 元素具有不会渲染到屏幕上但会影响网页行为的属性值。\n\n元素检查器和 DOM 编辑器可以帮助你查找和修复 HTML\
  \ 代码中的问题。以下部分将通过一些简单示例介绍如何使用这些工具。\n\n#### 检查 HTML 元素\n\n元素检查器使你能够查看浏览器已解析的每个 HTML\
  \ 元素。这让你从浏览器的角度查看 HTML，在出现语法错误的情况下，这通常与预期的不同，从而更容易发现语法错误的位置。\n\n图 2.6 显示了元素检查器的示例。使用元素检查器，你可以使用一些非常有用的功能，如下所述：\n\
  \n![图片](img/image00767.jpeg) **DOM 树**——这是 DOM 树的简单视图。你可以单击箭头图标展开和折叠树的部分。\n\n![图片](img/image00767.jpeg)\
  \ **断点变更**——右键单击元素并选择 **断点**，可以设置不同类型的断点，用于元素被更改、删除或子元素被修改的情况。当 DOM 元素被动态更改时，浏览器会中断到\
  \ JavaScript 调试器中。这有助于你在问题发生时捕获它们。\n\n![图片](img/image00767.jpeg) **作为 HTML 编辑**——右键单击元素并选择\
  \ **作为 HTML 编辑**，可以直接在浏览器中编辑 HTML 代码。浏览器会根据你在此处所做的更改更改渲染的内容。虽然这不会更改项目中的代码，但使用此功能尝试修复问题要容易得多。然后你可以从编辑器中复制代码并粘贴到项目中的实际文件中。\n\
  \n![图片](img/image00767.jpeg) **悬停**——当你在 DOM 树中悬停在 HTML 代码上时，该元素会在浏览器中高亮显示。元素检查器的悬停功能是我最喜欢的之一，因为它提供了一种直观的方式来查看\
  \ DOM 树中的节点与渲染后的网页之间的关系。请注意，在图 2.6 中，当 `<h1>` 元素被悬停时，标题在网页中被高亮显示。\n\n![图片](img/image00786.jpeg)\n\
  \n**图 2.6** Chrome 中的元素检查器页面。\n\n---\n\n注意\n\n当在 DOM 树中悬停元素时，该元素会在网页上高亮显示。悬停高亮显示有颜色编码，浅蓝色表示内容，紫色表示内边距，黄色表示\
  \ HTML 元素的外边距。\n\n---\n\n![图片](img/image00767.jpeg) **面包屑导航**——面包屑导航显示了从根 `<html>`\
  \ 节点到当前在树或编辑视图中选中的节点的层级关系。这使得导航变得容易，尤其是在编辑视图中。\n\n---\n\n## 动手实践：使用元素检查器调试 HTML\n\
  \n\n\n\n\n为了说明如何使用元素检查器，请考虑清单 2.2 中的代码。这是一个基本的 HTML 文档，包含一个电影列表，标题中的“Favorite”一词本应为斜体。然而，查看图\
  \ 2.7 中的渲染版本，显然存在一些问题：所有文字都变成了斜体，并且第一个列表项没有项目符号。这些问题仅由整个文本中的两个字符引起。\n\n![图片](img/image00787.jpeg)\n\
  \n**图 2.7** 此网页存在两个问题：只有“Favorite”一词应为斜体，且第一个列表项缺少项目符号。\n\n* * *\n\n**清单 2.2** `html_errors.html`\
  \ 一个非常简单的 HTML 文档，其中包含一些 HTML 语法错误，如图 2.6 所示\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 <!DOCTYPE\
  \ html>\n02 <html>\n03   <head>\n04     <meta charset=\"utf-8\" />\n05   </head>\n\
  06   <body>\n07     <h1><i></i>Favorite Movies</h1>\n08     <ul>\n09       <ll>Lord\
  \ of the Rings</li>\n10       <li>Harry Potter</li>\n11       <li>Narnia</li>\n\
  12       <li>Hot Lead and Cold Feet</li>\n13     </ul>\n14   </body>\n15 </html>\n\
  ```\n\n* * *\n\n请按照以下步骤使用元素检查器查找并修复 HTML 语法问题：\n\n**1.** 将清单 2.2 中的代码添加到项目`lesson02`文件夹中的新文件`html_errors.html`中，并保存文档。你现在应该已经熟悉这个过程了。\n\
