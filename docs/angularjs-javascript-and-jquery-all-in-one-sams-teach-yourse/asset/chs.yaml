  \ 10px 10px 5px darkgrey; }\n```\n\n* * *\n\n* * *\n\n### 实现带排序和筛选功能的表格\n\n表格是基本的\
  \ HTML 元素。你应该已经熟悉如何添加包含一个或多个 `<th>` 或 `<td>` 元素（提供列值）的表格行。表格是展示可按列或行组织的数据的绝佳方式。\n\
  \n对于少量数据，一个基本的静态 HTML 表格就足够了。但是，如果表格中有大量数据该怎么办？有些网页会滚动显示大量表格数据，导航起来很麻烦，最终还不如使用浏览器的搜索功能来查找所需内容。\n\
  \n一种解决方案是通过 AJAX 请求在服务器端脚本中实现排序和筛选。当处理存储在数据库中的极大量数据或极其复杂的筛选算法时，这通常是最佳方法。然而，对于大多数网页来说，这显得过于繁琐，并且需要大量缓慢的服务器请求，导致网页交互不连贯。\n\
  \n更好的方法是直接在 jQuery 和 JavaScript 中为这些大型表格添加筛选和排序功能。这样用户就可以将数据筛选到特定集合，然后快速按列排序。页面流程更加流畅，并且不需要外部服务器请求。下一节将带你逐步实现表格的列排序和筛选功能。\n\
