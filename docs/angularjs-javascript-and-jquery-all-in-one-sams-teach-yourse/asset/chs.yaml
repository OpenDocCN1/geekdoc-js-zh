  32 </html>\n```\n\n* * *\n\n### 总结\n\n在本课中，你学习了 Web 服务器与浏览器通信的基础知识。你了解了 GET 和 POST\
  \ 请求之间的区别，以及服务器端脚本和客户端脚本的用途。你还学习了 DOM 以及浏览器如何利用它来渲染显示给用户的网页。\n\n你已经搭建了一个良好的 Web\
  \ 开发环境，并创建了第一个项目。在创建第一个项目的过程中，你创建了一个结合了 HTML、CSS、jQuery 和 JavaScript 的动态网页。\n\n\
  ### 问答\n\n**Q.** 哪种更好——客户端脚本还是服务器端脚本？\n\n**A.** 这实际上取决于你想要实现的目标。有些人认为只有某一种方式才是正确的。实际上，往往是两者的结合才能提供最佳方案。一个好的经验法则是：如果与数据的交互更多地基于用户操作（如鼠标点击），则使用客户端脚本；如果数据的验证或错误处理需要与服务器交互，则使用服务器端脚本。\n\
  \n**Q.** 为什么不是所有浏览器都以相同方式处理 JavaScript？\n\n**A.** 为了渲染 HTML 并与 JavaScript 交互，浏览器使用一个引擎来解析来自服务器的数据、构建对象，然后将它们送入图形渲染引擎，由该引擎将它们写入屏幕。由于每个浏览器使用不同的引擎，因此每个浏览器对脚本的解释略有不同，尤其是在尚未标准化的边缘元素上。如果你想支持所有浏览器，需要在每个浏览器中测试你的网页，以确保它们正常工作。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。在查看答案之前，请先尝试回答问题。\n\n#### 小测验\n\n**1.**\
  \ 打开网页时，你会向 Web 服务器发送 GET 还是 POST 请求？\n\n**2.** 哪种类型的脚本可以访问浏览器的鼠标事件：服务器端、客户端，还是两者都可以？\n\
  \n**3.** 判断正误：所有浏览器默认启用 JavaScript 控制台。\n\n**4.** 在定义 DOM 元素的外观时，最好使用哪种类型的脚本？\n\n\
  #### 小测验答案\n\n**1.** GET\n\n**2.** 客户端\n\n**3.** 错误。你必须手动在所有浏览器中启用 JavaScript 调试。在大多数浏览器中按\
  \ F12 会启动开发者工具，允许你调试 JavaScript。\n\n**4.** 在定义 DOM 元素的外观时，CSS 脚本是最简单的选择。\n\n####\
  \ 练习\n\n**1.** 修改你的 first.html 文件，使按钮每次移动时随机改变背景颜色。添加以下两行代码来随机选择颜色：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar colors = new Array(\"#0066AA\", \"#0000FF\", \"#FF0000\", \"\
  #00FF00\");\nvar color = colors[Math.floor((Math.random()*4))];\n```\n\n然后修改 JavaScript\
  \ 中的 CSS 更改，加入 background-color，如下所示：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elusiveText\"\
  ).css({\"top\": y + \"px\", \"left\": x + \"px\", \"background-color\": color})\n\
  ```\n\n**2.** 在 first.html 文件中添加另一个 `<span>` 元素，使其行为与第一个相同。为此，在适当位置添加以下两行代码。你应该能判断它们应该放在哪里：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#elusiveText2\").css({\"top\": x + \"px\", \"\
  left\": y + \"px\"})\n```\n\n```html\n<span id=\"elusiveText2\" onmouseover=\"moveIt()\"\
  >Click Me</span>\n```\n\n## 第 2 课 在网页中调试 JavaScript\n\n本课你将学到：\n\n- ![图片](img/image00767.jpeg)\
  \ 如何找到 JavaScript 脚本输出的信息\n- ![图片](img/image00767.jpeg) 如何调试 HTML 元素的问题\n- ![图片](img/image00767.jpeg)\
  \ 更轻松地发现和修复 CSS 布局问题的方法\n- ![图片](img/image00767.jpeg) 在 Web 浏览器中实时查看和编辑 DOM 的方法\n\
  - ![图片](img/image00767.jpeg) 如何快速发现并修复 JavaScript 中的问题\n- ![图片](img/image00767.jpeg)\
  \ 可用于分析浏览器与 Web 服务器之间网络流量的信息\n\n编写 JavaScript 应用程序时的一个主要挑战是发现并修复脚本中的问题。简单的语法错误或无效值可能会导致大量挫折和时间浪费。因此，一些优秀的工具被创建出来，帮助你快速轻松地找到脚本中的问题。在本课中，你将学习通过浏览器开发者工具调试\
  \ JavaScript 的一些基础知识。\n\n本课使用 Chrome 开发者工具来演示如何调试网页中的 JavaScript。如果你已经熟悉使用开发者工具调试\
  \ HTML、CSS 和 JavaScript，可以跳过本课，直接进入下一课。\n\n尽管 Chrome、IE 和 Firefox 中的开发者工具控制台略有不同，但大多数原理在浏览器之间是相同的，你应该能够同样应用这些概念。另外，如果你在示例中不认识某些代码元素，请不要惊慌。它们将在后续课程中介绍，但在你深入编码之前，你应该能够进行调试。\n\
  \n### 查看开发者工具控制台\n\n你需要熟悉的第一个调试工具是开发者工具控制台。控制台是你与 JavaScript 脚本输出交互的界面。错误和日志消息会在发生时显示在\
  \ JavaScript 控制台中。\n\n例如，当脚本中的错误导致浏览器无法解析时，错误会显示在控制台中。除了错误之外，通过使用 `console.log`\
  \ 语句，你可以添加自己的调试语句，这些语句会显示在 JavaScript 控制台中。\n\n在 Chrome 中，可以通过按 F12 或 Ctrl+Shift+i（Windows）或\
  \ Cmd-Shift-i（Mac）访问开发者工具。\n\n* * *\n\n注意\n\n除了 `console.log`，你还可以使用 `console.error()`、`console.assert()`\
  \ 以及其他多种语句将信息记录到 JavaScript 控制台。\n\n* * *\n\n#### 理解浏览器开发者工具控制台\n\n打开开发者工具后，你会看到一系列选项卡。控制台选项卡（如图\
  \ 2.1 所示）充当 JavaScript 输出的接口。`console.log()` 和错误消息会显示在这里。\n\n![图片](img/image00781.jpeg)\n\
  \n**图 2.1** Chrome 中的 JavaScript 控制台显示日志消息和错误。\n\n\n\n\n\n请注意，在图 2.1 的消息部分中，有两种类型的消息。一种是日志语句，另一种是错误。两者都在右侧显示了行号。如果单击行号，将直接跳转到代码。\n\
  \n在错误消息中，文本的顶部部分指的是发生的错误，底部显示的是实际的 JavaScript 代码行。这在调试时非常有用，因为通过查看错误和单行代码，你通常就能发现问题。\n\
  \n---\n\n## 动手实践：使用 JavaScript 控制台查找错误\n\n理解控制台最简单的方法就是调试一个实际的脚本。考虑代码清单 2.1 中的 HTML\
  \ 代码，其中包含几个错误。按照以下步骤将代码清单添加到 Eclipse 项目中：\n\n**1.** 右键单击项目，从菜单中选择 **新建**、**文件夹**。\n\
