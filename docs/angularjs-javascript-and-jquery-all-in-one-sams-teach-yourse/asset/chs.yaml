  \ 和 CSS 文件中。这些文件非常基础，因为表格主体将动态生成。\n\n**3.** 将清单 15.15 的内容添加到 `parkdata.xml` 文件中并保存。\n\
  \n**4.** 打开 `load_xml.js` 文件，添加以下 `.ready()` 函数，该函数将向服务器发送 `.get()` 请求以获取 `lesson15/data/parkdata.xml`\
  \ 文件，并调用 `updateTable()` AJAX 请求完成事件处理程序。XML 文件的内容见清单 15.15：\n\n```\n13 $(document).ready(function(){\n\
