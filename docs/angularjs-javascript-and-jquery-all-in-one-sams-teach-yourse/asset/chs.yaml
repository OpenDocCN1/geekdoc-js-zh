  \n* * *\n\n## 创建自定义过滤器\n\nAngularJS 允许你创建自己的自定义过滤器提供程序，然后像使用内置过滤器一样在表达式、控制器和服务中使用它。AngularJS\
  \ 提供了 `filter()` 方法来创建过滤器提供程序，并将其注册到依赖注入服务器。\n\n`filter()` 方法接受过滤器的名称作为第一个参数，一个函数作为第二个参数。过滤器函数应接受表达式输入作为第一个参数，以及其后任意数量的附加参数。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nfilter('myFilter', function(){\n  return function(input,\
  \ param1, param2){\n    return <<修改后的输入>>;\n  };\n});\n```\n\n在过滤器函数内部，你可以以任何方式更改输入的值。过滤器函数返回的任何值都将作为表达式结果返回。\n\
  \n* * *\n\n**动手实践：创建并实现自定义过滤器**\n\n在本练习中，你将构建并使用一个自定义 AngularJS 过滤器，该过滤器对文本中的单词进行屏蔽。本练习的目的是演示如何构建和使用自定义\
  \ AngularJS 模板。\n\n清单 23.11 和 23.12 中的代码创建了一个自定义过滤器函数，该函数从字符串中屏蔽单词，并允许将替换值作为可选参数。\n\
  \n按照以下步骤构建创建并应用自定义过滤器的应用程序：\n\n1. 添加 `lesson23/filter_custom.html` 和 `lesson23/filter_custom.js`\
  \ 文件。\n2. 将 清单 23.11 和 清单 23.12 中显示的代码添加到 HTML 和 JavaScript 文件中。\n3. 清单 23.11 中的以下代码定义了一个名为\
  \ `censor` 的过滤器。注意，过滤器返回一个函数，该函数接受输入和替换值，然后遍历被屏蔽的单词，并将文本替换为替换值：\n\n点击此处查看代码图片\n\n\
  ```javascript\n02   .filter('censor', function() {\n03     return function(input,\
  \ replacement) {\n04       var cWords = ['bad', 'evil', 'dark'];\n05       var out\
  \ = input;\n06       for(var i=0; i<cWords.length; i++){\n07         var regex =\
  \ new RegExp(cWords[i], \"gi\");\n08         out = out.replace(regex, replacement);\n\
  09       }\n10       return out;\n11     };\n12   })\n```\n\n4. 以下代码实现了应用程序的控制器。注意，`censorFilter`\
  \ 被注入到控制器中。同时查看名为 `filterText` 的函数，该函数手动将 `censorFilter` 应用于一段文本：\n\n点击此处查看代码图片\n\
  \n```javascript\n13   .controller('myController', ['$scope', 'censorFilter',\n14\
  \                               function($scope, myCensorFilter) {\n15     $scope.censorText\
  \ = \"***\";\n16     $scope.phrase=\"This is a bad phrase.\";\n17     $scope.txt\
  \ = \"Click to filter out dark and evil.\";\n18     $scope.filterText = function(){\n\
