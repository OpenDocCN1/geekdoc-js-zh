  \ 如何使用 jQuery 创建动态迷你图\n\n在本课中，你将享受创建一些更高级页面元素的乐趣。本课的目的是让你有机会以更高级的方式应用本书迄今为止所学的一切。你在本课中构建的元素包括图片库、交互式表格、树形视图、覆盖层、均衡器和迷你图。\n\
  \n以下各节以示例形式编写，首先解释高级元素中使用的一些概念，然后你逐步自行实现它们。你将能够应用本课中学到的概念，在自己的网页中实现各种类型的高级元素。\n\n\
  ### 添加图片库\n\n网页中最具视觉交互性的组件之一就是图片库。一张图片胜过千言万语。图片能让用户比任何其他类型的视觉元素更快地做出决策。应用图片以帮助用户做出决策的最佳方式是提供一个交互式图库。\n\
  \n交互式图库应能让用户快速浏览多张图片，然后轻松选择一张以进入网页的下一步。因此，必要的组件是图片缩略图和控件。缩略图应该是原始图片的小版本，让你可以一次提供多个选项供选择。控件则是你用来在缩略图中导航的任何手段。\n\
  \n实现图片库最有效的方法是创建一个滑块，其中包含缩略图，并带有箭头，用户可以通过箭头滑动浏览缩略图，直到找到并点击所需的图片。滑块是一个不错的选择，因为它们可以垂直或水平方式实现，以适应网页的设计。\n\
  \n要实现滑块，你需要创建一个固定大小且溢出隐藏的容器 `<div>` 元素，然后是一个包含所有缩略图的子 `<div>` 元素。子 `<div>` 的位置可以调整，以显示滑块中不同的图片集。以下部分描述了这一过程。\n\
