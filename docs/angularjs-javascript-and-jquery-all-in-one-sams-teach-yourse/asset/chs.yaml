  \n点击此处查看代码图片\n\n```\n{{myNewPhrase | censor:\"XXX\" }}<br>\n```\n\n## 第 24 课 在 AngularJS\
  \ 视图中实现指令\n\n本课你将学到：\n\n![Image](img/image00767.jpeg) AngularJS 指令与 HTML 的关系\n\n\
  ![Image](img/image00767.jpeg) 在网页中实现 AngularJS 指令的方法\n\n![Image](img/image00767.jpeg)\
  \ 使用 AngularJS 指令与鼠标和键盘事件交互\n\n![Image](img/image00767.jpeg) AngularJS 指令扩展了哪些表单元素\n\
  \n![Image](img/image00767.jpeg) 如何在 AngularJS 应用程序中构建表单交互\n\nAngularJS 最强大的特性之一是指令。指令扩展了\
  \ HTML 的行为，使你能够创建具有特定于应用程序功能的自定义 HTML 元素、属性和类。AngularJS 提供了几个内置指令。事实上，AngularJS\
  \ 库的大部分都是内置指令。这些指令提供了与表单元素交互、将作用域中的数据绑定到视图以及处理浏览器事件的能力。\n\n本课讨论内置指令以及如何在 AngularJS\
  \ 模板中实现它们。你将学习如何在 AngularJS 模板中应用这些指令，并在后端控制器中支持它们，从而快速将渲染后的视图转变为交互式应用程序。\n\n##\
  \ 理解指令\n\n指令是 AngularJS 模板标记和支持性 JavaScript 代码的组合。AngularJS 指令标记可以是 HTML 属性、元素名称或\
  \ CSS 类。JavaScript 指令代码定义了 HTML 元素的模板数据和行为。\n\nAngularJS 编译器遍历模板 DOM 并编译所有指令。然后，它通过将指令与作用域结合来链接指令，从而生成一个新的实时视图。该实时视图包含指令中定义的\
  \ DOM 元素和功能。\n\n## 使用内置指令\n\n你在 HTML 元素中需要实现的大部分 AngularJS 功能都包含在内置指令中。这些指令由库提供，并在加载\
  \ AngularJS JavaScript 库时可用。\n\n指令为 AngularJS 应用程序提供了多种支持。以下各节描述了大多数 AngularJS 指令，它们分为以下几类：\n\
  \n![Image](img/image00767.jpeg) 支持 AngularJS 功能的指令\n\n![Image](img/image00767.jpeg)\
  \ 扩展表单元素的指令\n\n![Image](img/image00767.jpeg) 将页面元素绑定到作用域模型中值的指令\n\n![Image](img/image00767.jpeg)\
  \ 将页面事件绑定到控制器的指令\n\n以下各节均包含一个表格，列出了相关指令及其基本描述。你现在不需要理解所有这些指令；这些表格更多是作为参考。后续的章节和课程将提供使用其中许多指令的示例代码。\n\
  \n#### 支持 AngularJS 功能的指令\n\n有几个指令为 AngularJS 功能提供支持。这些指令的功能从引导应用程序到确保 AngularJS\
  \ 所需的布尔表达式在 DOM 中得以保留，无所不包。\n\n表 24.1 列出了这些指令，并描述了每个指令的行为和用法。\n\n![Image](img/image01009.jpeg)![Image](img/image01010.jpeg)![Image](img/image01011.jpeg)\n\
  \n**表 24.1 支持 AngularJS 模板功能的指令**\n\n表 24.1 中的指令在代码的不同部分以不同方式使用。你已经在之前的示例中看到过其中一些，例如\
  \ `ngApp` 和 `ngController`。有些指令相当直观，比如在模板中实现 `<img>` 元素时使用 `ng-src` 而不是 `src`。其他指令将在后续课程的各种示例中使用。\n\
  \n\n\n\n我确实想在此处给你一个使用 `ngInclude` 指令的例子。这个小小的指令使用起来很简单，并且可以用于多种目的，特别是当你试图将 AngularJS\
  \ 引入现有系统时。在这个例子中，我们通过从服务器加载不同的部分 HTML 文件，使用 `ngInclude` 来切换基本网页顶部的横幅栏。\n\n---\n\n\
  ## 自己动手：使用 `ng-include` 动态更改内容\n\n清单 24.1 中的代码实现了一个基本的 AngularJS 控制器，它将一个 HTML 文件名存储在名为\
  \ `titleBar` 的变量中。清单 24.2 中的代码实现了一个 AngularJS 模板，该模板在顶部包含几个用于切换页面的链接，以及第 24 行的一个\
  \ `<div>` 元素，该元素使用 `ng-include` 将 div 的内容更改为 `titleBar` 指定的文件。\n\n按照以下步骤构建使用 `ng-include`\
  \ 在两个部分模板之间快速切换的应用程序：\n\n1. 添加 `lesson24/directive_angular_include.html`、`lesson24/large_title.html`、`lesson24/small_title.html`\
  \ 和 `lesson24/js/directive_angular_include.js` 文件。\n\n2. 将清单 24.1、清单 24.2、清单 24.3\
  \ 和清单 24.4 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 清单 24.1 中的代码实现了一个简单的应用程序，它将 `titleBar`\
  \ 的作用域值设置为 `small_tile.html`，这是小横幅的 AngularJS 部分模板。\n\n4. 清单 24.2 中的代码实现了加载应用程序的\
  \ AngularJS 模板。清单 24.2 中的以下行创建了链接，这些链接将作用域中的 `titleBar` 值设置为清单 24.3 和 24.4 中列出的两个模板部分文件之一：\n\
  \n点击此处查看代码图片\n\n```html\n22     [<a ng-click=\"titleBar='large_title.html'\">Make\
  \ Title Large</a>]\n23     [<a ng-click=\"titleBar='small_title.html'\">Make Title\
  \ Small</a>]\n```\n\n5. 清单 24.2 中的以下代码行使用 `ng-include` 指令，用 `titleBar` 设置到的任何模板部分来填充\
  \ `<div>` 元素的内容：\n\n点击此处查看代码图片\n\n```html\n24     <div ng-include=\"titleBar\"></div>\n\
  ```\n\n6. 标题栏的不同版本位于清单 24.3 和 24.4 所示的文件中。基本上，这些文件包含一个 `<p>` 元素，该元素被分配了 `large`\
  \ 或 `small` 类。类定义位于清单 24.2 的 `<style>` 元素中。\n\n7. 在浏览器中打开 `directive_angular_include.html`\
  \ 文件。图 24.1 显示了两个标题横幅。当点击链接切换横幅时，原始 `<div>` 元素的内容将被加载的新 HTML 文件替换。\n\n![Image](img/image01012.jpeg)\n\
  \n**图 24.1** 使用 `ng-include` 指令通过不同的 HTML 部分文件动态更改视图。\n\n### 清单 24.1 `directive_angular_include.js`\
  \ 实现一个控制器，用于在作用域中存储标题元素的 HTML 文件名\n\n点击此处查看代码图片\n\n---\n\n```javascript\n01 angular.module('myApp',\
  \ []).\n02   controller('myController', function($scope) {\n03     $scope.titleBar\
  \ = \"small_title.html\";\n04   });\n```\n\n---\n\n### 清单 24.2 `directive_angular_include.html`\
  \ 一个 AngularJS 模板，使用 `ng-include` 指令通过在两个 HTML 文件之间切换来更改页面的标题栏\n\n点击此处查看代码图片\n\n\
  ---\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04  \
  \ <title>AngularJS Data Include Directive</title>\n05   <style>\n06     .large{\n\
  07       background-color: blue; color: white;\n08       text-align: center;\n09\
  \       font: bold 50px/80px verdana, serif;\n10       border: 6px black ridge;\
  \ }\n11     .small{\n12       background-color: lightgrey;\n13       text-align:\
  \ center;\n14       border: 1px black solid; }\n15     a{\n16      color: blue;\
  \ text-decoration: underline;\n17      cursor: pointer; }\n18   </style>\n19 </head>\n\
  20 <body>\n21   <div ng-controller=\"myController\">\n22     [<a ng-click=\"titleBar='large_title.html'\"\
  >Make Title Large</a>]\n23     [<a ng-click=\"titleBar='small_title.html'\">Make\
  \ Title Small</a>]\n24     <div ng-include=\"titleBar\"></div>\n25   </div>\n26\
  \   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n27\
  \   <script src=\"js/directive_angular_include.js\"></script>\n28 </body>\n29 </html>\n\
  ```\n\n---\n\n### 清单 24.3 `small_title.html` 一个包含小版本标题的部分 HTML 文件\n\n---\n\n```html\n\
  01 <p class=\"small\">\n02   This is a Small Title\n03 </p>\n```\n\n---\n\n### 清单\
  \ 24.4 `large_title.html` 一个包含大版本标题的部分 HTML 文件\n\n---\n\n```html\n01 <p class=\"\
  large\">\n02   This is a Large Title\n03 </p>\n```\n\n---\n\n## 扩展表单元素的指令\n\nAngularJS\
  \ 与表单元素深度集成，为应用程序中的表单元素提供数据绑定和事件绑定。为了以正确的方式提供 AngularJS 功能，表单元素在编译时会被扩展。\n\n表 24.2\
  \ 列出了 AngularJS 扩展的表单元素。\n\n![Image](img/image01013.jpeg)![Image](img/image01014.jpeg)![Image](img/image01015.jpeg)![Image](img/image01016.jpeg)\n\
  \n**表 24.2 扩展表单元素以支持 AngularJS 模板功能的指令**\n\n---\n\n## 自己动手：使用 AngularJS 表单指令将表单元素绑定到作用域\n\
  \n清单 24.5 和 24.6 实现了一些基本的 AngularJS 表单元素与作用域的集成。清单 24.5 初始化作用域。清单 24.6 实现了几个常见的表单组件，包括文本框、复选框、单选按钮和一个\
  \ `select` 元素，以说明它们如何在模板中定义并与作用域中的数据交互。\n\n按照以下步骤使用 AngularJS 表单元素构建应用程序，将表单元素绑定到控制器的作用域：\n\
  \n1. 添加 `lesson24/directive_form.html` 和 `lesson24/js/directive_form.js` 文件。\n\n\
  2. 将清单 24.5 和清单 24.6 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 清单 24.5 中的代码实现了一个基本的作用域，其中包含一个名为\
  \ `cameras` 的对象数组，该数组将用于动态填充模板中的 `<select>` 元素。它还提供了名为 `cameraObj`、`cameraName`、`cbValue`\
  \ 和 `someText` 的值，这些值将绑定到模板中的各种表单元素。\n\n4. 清单 24.6 中的代码实现了几个 AngularJS 表单元素，这些元素与作用域交互以获取和设置值。以下代码行将\
  \ `text input` 的值绑定到作用域中的 `someText` 变量，然后在网页中 `input` 框旁边显示该值：\n\n点击此处查看代码图片\n\n\
  ```html\n09     <input type=\"text\" ng-model=\"someText\"> {{someText}}<hr>\n```\n\
  \n5. 以下代码行将 `checkbox` 元素的值绑定到作用域值 `cbValue`，然后根据复选框是否被选中将 `cbValue` 的值更改为不同的字符串：\n\
  \n点击此处查看代码图片\n\n```html\n10     <input type=\"checkbox\" ng-model=\"cbValue\"\n\
  11            ng-true-value=\"'Checked'\" ng-false-value=\"'Not Checked'\">\n```\n\
  \n\n\n\n\n12     复选框：`{{cbValue}}`<hr>\n\n**6.** 以下几行代码定义了一个单选按钮组，其值绑定到 `cameraName`，然后在网页中单选按钮组之后显示该值：\n\
  \n点击此处查看代码图片\n\n```\n13     <input type=\"radio\"\n14       ng-model=\"cameraName\"\
  \ value=\"Canon\"> Canon<br/>\n15     <input type=\"radio\"\n16       ng-model=\"\
  cameraName\" value=\"Nikon\"> Nikon<br/>\n17     Selected Camera: {{cameraName}}\
  \ <hr>\n```\n\n**7.** 以下几行代码使用作用域中定义的相机数组，在 `<select>` 元素中构建选项组和选项，然后显示当前选中相机关联的对象：\n\
  \n点击此处查看代码图片\n\n```\n18     <select ng-model=\"camera\"\n19       ng-options=\"\
  c.model group by c.make for c in cameras\">\n20     </select>\n21     {{camera|json}}\n\
  ```\n\n**8.** 在浏览器中打开 `directive_form.html`，尝试更改表单元素的值，如图 24.2 所示。\n\n![Image](img/image01017.jpeg)\n\
  \n**图 24.2** 在 AngularJS 模板视图中实现表单指令元素。\n\n**清单 24.5 directive_form.js 为表单指令实现控制器**\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\n01 angular.module('myApp', []).\n02   controller('myController',\
  \ function($scope) {\n03     $scope.cameras = [\n04       {make:'Canon', model:'70D',\
  \ mp:20.2},\n05       {make:'Canon', model:'6D', mp:20},\n06       {make:'Nikon',\
  \ model:'D7100', mp:24.1},\n07       {make:'Nikon', model:'D5200', mp:24.1}];\n\
  08     $scope.cameraObj=$scope.cameras[0];\n09     $scope.cameraName = 'Canon';\n\
  10     $scope.cbValue = '';\n11     $scope.someText = '';\n12   });\n```\n\n* *\
  \ *\n\n**清单 24.6 directive_form.html 一个实现了多个表单元素指令的 AngularJS 模板**\n\n点击此处查看代码图片\n\
  \n* * *\n\n```\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04   <title>AngularJS\
  \ Form Directives</title>\n05 </head>\n06 <body>\n07   <div ng-controller=\"myController\"\
  >\n08     <h2>Forms Directives</h2>\n09     <input type=\"text\" ng-model=\"someText\"\
  > {{someText}}<hr>\n10     <input type=\"checkbox\" ng-model=\"cbValue\"\n11            ng-true-value=\"\
  'Checked'\" ng-false-value=\"'Not Checked'\">\n12     Checkbox: {{cbValue}}<hr>\n\
  13     <input type=\"radio\"\n14       ng-model=\"cameraName\" value=\"Canon\">\
  \ Canon<br/>\n15     <input type=\"radio\"\n16       ng-model=\"cameraName\" value=\"\
  Nikon\"> Nikon<br/>\n17     Selected Camera: {{cameraName}} <hr>\n18     <select\
  \ ng-model=\"camera\"\n19       ng-options=\"c.model group by c.make for c in cameras\"\
  >\n20     </select>\n21     {{camera|json}}\n22   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n23   <script src=\"js/directive_form.js\"></script>\n24 </body>\n25\
  \ </html>\n```\n\n* * *\n\n* * *\n\n#### 将模型绑定到页面元素的指令\n\nAngularJS 模板允许你将作用域中的数据直接绑定到\
  \ HTML 元素显示的内容。你可以通过多种方式将数据绑定到视图，包括以下几种：\n\n![Image](img/image00767.jpeg) **值：**\
  \ 你可以直接在作用域中表示表单元素的值。例如，文本输入可以是作用域中的 `String` 变量，而复选框则由 `Boolean` 值表示。\n\n![Image](img/image00767.jpeg)\
  \ **HTML：** 你可以通过如下表达式在元素的 HTML 输出中表示作用域中数据的值：\n\n`<p>{{myTitle}}</p>`\n\n![Image](img/image00767.jpeg)\
  \ **属性：** HTML 元素属性的值可以通过在定义中使用表达式来反映作用域中的数据，例如：\n\n点击此处查看代码图片\n\n`<a ng-href=\"\
  /{{hash}}/index.html\">{{hash}}</a>`.\n\n![Image](img/image00767.jpeg) **可见性：**\
  \ 元素的可见性可以反映视图中的作用域。例如，当基于作用域的表达式为 `true` 时，元素可见；否则不可见。\n\n![Image](img/image00767.jpeg)\
  \ **存在性：** 你可以根据作用域中的值从编译后的 DOM 中省略元素。\n\n表 24.3 列出了将作用域中的数据直接绑定到视图中元素的指令。\n\n![Image](img/image01018.jpeg)![Image](img/image01019.jpeg)![Image](img/image01020.jpeg)![Image](img/image01021.jpeg)![Image](img/image01022.jpeg)\n\
  \n**表 24.3 将作用域中的数据绑定到 HTML 元素的值、表达式、可见性和存在性的指令**\n\n* * *\n\n#### 动手实践：使用 AngularJS\
  \ 指令动态与页面元素交互\n\n在本例中，你将使用一些 AngularJS 指令来动态与页面元素交互。清单 24.7 和 24.8 提供了一些基本 AngularJS\
  \ 绑定指令的示例。清单 24.7 初始化作用域值。清单 24.8 提供了模板中绑定指令的实际实现。\n\n按照以下步骤，使用 AngularJS 元素构建与页面元素交互的应用程序：\n\
  \n**1.** 添加 `lesson24/directive_bind.html` 和 `lesson24/js/directive_bind.js` 文件。\n\
  \n**2.** 将清单 24.7 和清单 24.8 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n**3.** 清单 24.7 中的代码实现了一个基本的作用域，其中包含\
  \ AngularJS 模板将使用的值。`colors` 数组将用于构建单选按钮组，`myStyle` 值将用于设置页面元素的 CSS 样式，`days` 数组将用于创建日期列表，`msg`\
  \ 值将显示在页面上。\n\n**4.** 清单 24.8 中的代码提供了 AngularJS 模板，该模板使用作用域中的值来构建页面元素并与之交互。以下几行代码在作用域中的\
  \ `colors` 值上使用 `ng-repeat` 来创建一组单选按钮 `<input>`。请注意，单选按钮组的值绑定到作用域中的 `myStyle['background-color']`\
  \ 属性。这说明了如何处理不允许使用通常的点表示法（例如 `myStyle.color`）的样式名称。还要注意，单选按钮的值通过 `ng-value` 设置为来自\
  \ `ng-repeat` 循环的 `color` 值：\n\n点击此处查看代码图片\n\n```\n13     <label ng-repeat=\"color\
  \ in colors\">\n14       {{color}}\n15       <input type=\"radio\" ng-model=\"myStyle['background-color']\"\
  \n16              ng-value=\"color\" id=\"{{color}}\" name=\"mColor\">\n17     </label>\n\
  ```\n\n**5.** 以下几行代码使用 `ng-style` 将 `<span>` 元素的 CSS 样式设置为作用域中 `myStyle` 的值。请记住，当你选择其中一个单选按钮时，单选按钮组会设置\
  \ `myStyle` 中的 `background-color`：\n\n点击此处查看代码图片\n\n```\n18     <span class=\"rect\"\
  \ ng-style=\"myStyle\"></span><hr>\n```\n\n**6.** 以下几行代码使用 `ng-repeat` 创建一个日期列表。请注意，当你使用\
  \ `ng-class-even` 设置类名时，类名 `even` 需要用单引号括起来，因为它是一个字符串：\n\n点击此处查看代码图片\n\n```\n19     <li\
  \ ng-repeat=\"day in days\">\n20       <span ng-class-even=\"'even'\">{{day}}</span>\n\
  21     </li><hr>\n```\n\n**7.** 以下几行代码使用 `ng-model` 将复选框的值（true/false）绑定到作用域中的 `checked`\
  \ 值。`ng-if` 指令从作用域中读取 `checked` 的值，并决定是否将作用域中的 `msg` 值绑定到段落元素：\n\n点击此处查看代码图片\n\n\
  \n\n\n22     显示消息：<input type=\"checkbox\" ng-model=\"checked\" />\n23     <p ng-if=\"\
  checked\" ng-bind=\"msg\"> </p>\n\n**8.** 在浏览器中打开 `directive_bind.html` 文件，尝试更改单选按钮，观察矩形颜色的变化，查看列表中偶数元素的样式，并通过复选框打开和关闭消息。图\
  \ 24.3 显示了最终的网页。\n\n![Image](img/image01023.jpeg)\n\n**图 24.3** 在 AngularJS 模板视图中实现数据绑定指令。\n\
  \n**清单 24.7 directive_bind.js 实现带有作用域模型的控制器以支持数据绑定指令**\n\n点击此处查看代码图片\n\n---\n\n\
  ```javascript\n01 angular.module('myApp', []).\n02   controller('myController',\
  \ function($scope) {\n03     $scope.colors=['red','green','blue'];\n04     $scope.myStyle\
  \ = { \"background-color\": 'blue' };\n05     $scope.days=['Monday', 'Tuesday',\
  \ 'Wednesday',\n06                  'Thursday', 'Friday'];\n07     $scope.msg=\"\
  Dynamic Message from the model\";\n08   });\n```\n\n---\n\n**清单 24.8 directive_bind.html\
  \ 一个实现了多个数据绑定指令的 AngularJS 模板**\n\n点击此处查看代码图片\n\n---\n\n```html\n01 <!doctype html>\n\
  02 <html ng-app=\"myApp\">\n03 <head>\n04   <title>AngularJS Data Binding Directives</title>\n\
  05   <style>\n06     .even{background-color:lightgrey;}\n07     .rect{display:inline-block;\
  \ height:40px; width:100px;}\n08   </style>\n09 </head>\n10 <body>\n11   <div ng-controller=\"\
  myController\">\n12     <h2>Data Binding Directives</h2>\n13     <label ng-repeat=\"\
  color in colors\">\n14       {{color}}\n15       <input type=\"radio\" ng-model=\"\
  myStyle['background-color']\"\n16              ng-value=\"color\" id=\"{{color}}\"\
  \ name=\"mColor\">\n17     </label>\n18     <span class=\"rect\" ng-style=\"myStyle\"\
  ></span><hr>\n19     <li ng-repeat=\"day in days\">\n20       <span ng-class-even=\"\
  'even'\">{{day}}</span>\n21     </li><hr>\n22     Show Message: <input type=\"checkbox\"\
  \ ng-model=\"checked\" />\n23     <p ng-if=\"checked\" ng-bind=\"msg\"> </p>\n24\
  \   </div>\n25   <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n26   <script src=\"js/directive_bind.js\"></script>\n27 </body>\n28\
  \ </html>\n```\n\n---\n\n---\n\n#### 将页面事件绑定到控制器的指令\n\nAngularJS 模板允许你将浏览器事件绑定到控制器代码。这意味着你可以从作用域的角度处理用户输入。然后，你可以直接将浏览器事件的处理程序实现到相应的作用域中。`event`\
  \ 指令的工作方式与普通的浏览器事件处理程序非常相似，区别在于它们直接链接到作用域上下文。\n\n表 24.4 列出了将页面和设备事件绑定到 AngularJS\
  \ 模型的指令。每个指令都允许你指定一个表达式，通常是作用域中定义的函数，如第 23 课（“使用 AngularJS 模板创建视图”）所述。例如，以下是作用域中名为\
  \ `setTitle` 的函数：\n\n点击此处查看代码图片\n\n```javascript\n$scope.setTitle = function(title){\n\
  \  $scope.title = title;\n};\n```\n\n![Image](img/image01024.jpeg)\n\n**表 24.4 将页面/设备事件绑定到\
  \ AngularJS 模型功能的指令**\n\n你可以通过使用以下 `ng-click` 指令，将作用域中的 `setTitle()` 函数直接绑定到视图中的输入按钮：\n\
  \n点击此处查看代码图片\n\n```html\n<input type=\"button\" ng-click=\"setTitle('New Title')\"\
  >\n```\n\n你可以使用 `$event` 关键字将 JavaScript `Event` 对象传递给事件表达式。这使你能够访问事件的相关信息，以及停止传播和执行通常可以使用\
  \ JavaScript `Event` 对象完成的所有其他操作。例如，以下 `ng-click` 指令将鼠标点击事件传递给 `myClick()` 处理函数：\n\
  \n点击此处查看代码图片\n\n```html\n<input type=\"button\" ng-click=\"myClick($event)\">\n\
  ```\n\n以下部分提供了一些使用 AngularJS 事件指令与浏览器事件交互的示例。\n\n---\n\n动手试一试：使用焦点和失焦事件\n\nAngularJS\
