  \n###### 添加路径\n\n另一个示例是使用路径绘制一些更复杂的形状。路径是一系列相互连接的线条。这些线条可以是直线、抛物线弧或贝塞尔曲线。要创建路径，请在\
  \ `<svg>` 元素中添加一个 `<path>` 元素，并定义 `d` 属性。`d` 属性包含一系列命令，告诉浏览器如何在屏幕上渲染路径。以下是较常用命令的列表：\n\
  \n![Image](img/image00767.jpeg) `M x,y` — 指定移动到坐标 `x,y`。大写 `M` 表示绝对坐标；小写 `m` 表示相对坐标。\n\
  \n![Image](img/image00767.jpeg) `h n` — 指定绘制一条水平线，长度为 `n` 像素。该值可以为正或负。负值表示向左。大写\
  \ `H` 是绝对坐标，小写 `h` 是相对坐标。\n\n![Image](img/image00767.jpeg) `v n` — 指定绘制一条垂直线，长度为\
  \ `n` 像素。该值可以为正或负。负值表示向上。大写 `V` 是绝对坐标，小写 `v` 是相对坐标。\n\n![Image](img/image00767.jpeg)\
  \ `l x,y` — 从当前坐标绘制一条线到坐标 `x,y`。你可以通过空格分隔指定额外的坐标集，以添加更多线段。大写 `L` 是绝对坐标，小写 `l` 是相对坐标。\n\
  \n![Image](img/image00767.jpeg) `c x1 y1 x2 y2 x y` — 从当前坐标到 `x,y` 绘制一条贝塞尔曲线，使用\
  \ `x1,y1` 作为曲线起点的控制点，`x2,y2` 作为曲线终点的控制点。图 3.12 说明了控制点的工作原理。大写 `C` 是绝对坐标，小写 `c` 是相对坐标。\n\
  \n![Image](img/image00818.jpeg)\n\n**图 3.12** 控制点定义了曲线的形状。\n\n![Image](img/image00767.jpeg)\
  \ `a rx ry x-axis-rotation large-arc-flag sweep-flag x y` — 从当前坐标到 `x,y` 绘制一条弧线。椭圆的大小和方向由两个半径\
  \ `rx, ry` 以及 `x-axis-rotation` 值定义，该值指定弧线 `x` 轴的角度。`large-arc-flag` 和 `sweep-flag`\
  \ 设置为 `0` 或 `1`，定义渲染到屏幕上的抛物线曲线的哪一部分。大写 `A` 是绝对坐标，小写 `a` 是相对坐标。\n\n![Image](img/image00767.jpeg)\
  \ `z` — 闭合路径，这意味着最后一个坐标将连接到路径的起点。\n\n以下清单 3.7 中的代码演示了如何使用两条路径创建一个分离的饼图，如图 3.13 所示。注意，`<path>`\
  \ 数据以 `M` 命令开始，移动到特定的绝对坐标。然后 `h50` 命令向右绘制一条 `50` 像素的线；接着，`a` 命令绘制一条弧线，在两个方向上半径均为\
  \ `50` 像素，向上 `50` 像素并向右 `50` 像素。最后，`z` 命令闭合弧线，你就得到了第一块饼。下一个 `<path>` 元素以相同方式绘制饼的主要部分：\n\
