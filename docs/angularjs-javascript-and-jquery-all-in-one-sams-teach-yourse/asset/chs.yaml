  \ `phrase` 值应用过滤器：\n\n点击此处查看代码图片\n\n```html\n09       {{phrase | censor:censorText}}<br>\n\
  ```\n\n6. 清单 23.12 中的以下代码行通过将字符串 `\"happy\"` 作为替换字符串传入，对字符串应用过滤器：\n\n点击此处查看代码图片\n\
