  \n可见性效果的应用方式与你在本课前面学到的 `.effect()` 函数相同。你从表 17.1 中指定一个效果，然后设置所需的选项，如果你想控制动画，还可以包含一个\
  \ `easing` 函数。\n\n以下是你可以使用 jQuery UI 添加效果的不同元素可见性切换方法列表：\n\n![Image](img/image00767.jpeg)\
  \ `.hide( effect [, options ] [, duration ] [, complete ] )` — 在隐藏元素时应用带有选项的效果。\n\
  \n![Image](img/image00767.jpeg) `.show( effect [, options ] [, duration ] [, complete\
  \ ] )` — 在显示元素时应用带有选项的效果。\n\n![Image](img/image00767.jpeg) `.toggle( effect [, options\
  \ ] [, duration ] [, complete ] )` — 根据对象的当前可见性显示或隐藏它，并在执行时应用指定的效果。\n\n* * *\n\n\
