  color\",\"red\")`。然后，当用户点击“添加图片”按钮时，使用 `.css()` 更改文本的颜色。\n\n**2.** 打开清单 16.5、16.6\
  \ 和 16.7 中的代码，并修改它，使图像在层叠时相互重叠。最简单的方法是在 `.position()` 设置中添加负值。\n\n## 第 17 课 使用 jQuery\
  \ UI 效果\n\n本课你将学到：\n\n![Image](img/image00767.jpeg) 使用 jQuery UI 库应用效果的方法\n\n![Image](img/image00767.jpeg)\
  \ 缓动效果如何使动画变化变得可变\n\n![Image](img/image00767.jpeg) 在隐藏/显示元素时添加酷炫效果的方法\n\n![Image](img/image00767.jpeg)\
  \ 如何将效果应用于类更改\n\n![Image](img/image00767.jpeg) 在重新定位元素时应用动画效果\n\njQuery UI 提供了一套丰富的动画类型效果，可以应用于网页上的元素。动画元素之所以好，有几个原因。一是给用户留下网站具有交互性和使用乐趣的印象。二是帮助用户理解动态脚本中发生的视觉变化。\n\
  \n在本课中，你将看到 jQuery UI 在动画效果方面提供的改进。你将能够直接将效果应用于元素，或者在更改类、可见性或位置时应用效果。\n\n### 应用\
  \ jQuery UI 效果\n\n本节的目的是向你介绍 jQuery UI 提供的效果。本节讨论每种效果以及如何使用 `.each()` 方法应用它们。你还将了解大量的缓动函数，这些函数为效果动画期间值的应用提供了可变方面。\n\
  \n#### 理解 jQuery UI 效果\n\njQuery UI 效果只是对 CSS 位置、大小和可见性属性的动画。动画变化的实现方式是为了创建视觉效果，给用户更好的体验。\n\
  \n例如，假设用户尝试使用无效密码登录。除了表单验证消息外，你还可以使用 jQuery UI 效果使登录按钮抖动，这将更好地吸引用户的注意力，让用户知道登录失败。这些是对网页的细微更改，但它们可以对用户体验产生很大影响。\n\
  \n表 17.1 列出了可以应用的效果及其值，以操作它们。这应该让你了解 jQuery UI 可能实现的效果。你将在本课后面实现其中一些效果。\n\n![Image](img/image00953.jpeg)![Image](img/image00954.jpeg)![Image](img/image00955.jpeg)\n\
  \n**表 17.1 jQuery UI 效果**\n\n#### 设置效果动画缓动\n\n缓动函数设置了效果在动画过程中使用的值路径。你已经在 jQuery\
  \ 动画中看到了 linear 和 swing 缓动。jQuery UI 添加了大量新的缓动函数，可以提供一些有趣的动画效果。\n\n说明缓动如何工作的最简单方法是向你展示发布在以下位置的图表，如图\
  \ 17.1 所示。将图表的水平轴视为持续时间，左侧为 0，右侧为完成。将图表的垂直轴视为效果过渡的完成程度。例如，在淡出过渡中，底部将完全不透明，顶部将完全透明：[`api.jqueryui.com/easings/`](http://api.jqueryui.com/easings/)\n\
  \n![Image](img/image00956.jpeg)\n\n**图 17.1** jQuery UI 缓动函数。\n\n#### 向 jQuery 对象添加效果\n\
  \n有多种方法可以将效果应用于 jQuery 对象。效果可以作为另一个过渡的一部分添加，例如类更改或可见性更改。你也可以使用 `.effect()` 方法将效果应用于元素。`.effect()`\
  \ 方法具有以下语法：\n\n点击此处查看代码图片\n\n```\n.effect( effect [, options ] [, duration ] [,\
  \ complete ] )\n```\n\n在 `.effect()` 方法中，`effect` 是效果的名称，`options` 是一个包含选项值的对象。表\
  \ 17.1 列出了可以应用于每个效果的效果名称和选项。`duration` 以毫秒为单位指定，你可以添加一个可选的 `complete` 处理函数，该函数将在效果应用后执行。\n\
  \n以下示例说明了将 `size` 效果应用于元素的完整语法：\n\n点击此处查看代码图片\n\n```\n(\"img\").effect(\"size\"\
  ,\n\n               {to:{height:100, width:100}, origin:[\"right\",\"top\"], scale:\"\
  box\"},\n\n               3000,\n\n               function(){alert(\"effect complete\"\
  );});\n```\n\n---\n\n### 自己动手：添加 jQuery UI 效果\n\n在此示例中，你将多个效果应用于 `<img>` 元素。你向网页添加四张图片，并在用户点击每张图片时应用不同的效果。该示例的目的是让你熟悉如何实现不同的效果、设置效果\
  \ `options` 以及应用 `complete` 函数。\n\n该示例的代码位于清单 17.1、17.2 和 17.3 中。使用以下步骤创建动态网页：\n\
  \n**1.** 在 Eclipse 中，创建 `lesson17`、`lesson17/js` 和 `lesson17/css` 文件夹，然后添加 `lesson17/jquery_effects.html`、`lesson17/js/jquery_effects.js`\
  \ 和 `lesson17/css/jquery_effects.css` 文件。\n\n**2.** 将清单 17.1 和清单 17.3 中显示的代码添加到\
