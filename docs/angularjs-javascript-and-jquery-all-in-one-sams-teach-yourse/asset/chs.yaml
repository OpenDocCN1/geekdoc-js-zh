  ```\n\n* * *\n\n* * *\n\n### 使用高级 jQuery AJAX\n\n本课已涵盖的概念应能满足您大部分的 AJAX 需求。然而，它们并未涵盖\
  \ jQuery AJAX 接口的全部功能。以下部分将讨论 jQuery 内置的一些额外 AJAX 功能。\n\n#### 回顾全局设置\n\njQuery 提供了\
  \ `.ajaxSetup()` 方法，允许您指定在整个脚本中全局配置 AJAX 请求的选项。表 15.3 列出了调用 `.ajaxSetup()` 时可以指定的一些选项。例如，以下代码设置了请求的默认全局\
  \ URL：\n\n点击此处查看代码图片\n\n```\n$.ajaxSetup({url:\"service.php\", accepts:\"json\"\
  })\n```\n\n#### 使用全局事件处理程序\n\njQuery 提供了创建全局事件处理程序的方法，这些处理程序会在事件（例如所有 AJAX 请求的初始化或完成）时被调用。全局事件会在每个\
  \ AJAX 请求上触发。表 15.2 列出了可用于注册全局事件处理程序的方法。\n\n![Image](img/image00943.jpeg)\n\n**表\
  \ 15.2 jQuery 全局 AJAX 事件处理程序注册方法**\n\n下面是一个使用全局事件处理程序设置表单类别的示例：\n\n点击此处查看代码图片\n\n\
  ```\n$(document).ajaxStart(function(){\n  $(\"form\").addClass(\"processing\");\n\
  });\n$(document).ajaxComplete(function(){\n  $(\"form\").removeClass(\"processing\"\
  );\n});\n```\n\n* * *\n\n注意\n\n无论 `global` 的值如何，跨域脚本或 JSONP 请求永远不会触发全局事件。\n\n* *\
  \ *\n\n#### 实现低级 AJAX 请求\n\n本课中您一直在使用的所有 AJAX 请求包装方法，底层都是通过 `.ajax(url [, settings])`\
  \ 接口处理的。这个接口使用起来稍微复杂一些，但它为您提供了更大的灵活性和对 AJAX 请求的控制。\n\n`.ajax()` 方法的调用方式与 `.get()`\
  \ 和 `.post()` 相同；但是，settings 参数允许您设置发起请求时使用的各种设置。\n\n表 15.3 列出了可应用于 `.ajax()` 方法的一些常见设置。\n\
  \n![Image](img/image00944.jpeg)\n\n**表 15.3 .ajax() 请求方法中可用的常见设置**\n\n以下代码展示了使用\
  \ `.ajax()` 接口的一个简单示例：\n\n点击此处查看代码图片\n\n```\n$.ajax({\n  url:\"setEmail\",\n  type:\"\
  get\",\n  accepts:\"json\",\n  contentType: 'application/x-www-form-urlencoded;\
  \ charset=UTF-8',\n  data: {\"first\":\"Brad\", \"last\":\"Dayley\"}\n}).fail(function(){\
  \ alert(\"request Failed\"); });\n```\n\n`.ajax()` 方法返回一个 `jqXHR` 对象，该对象提供了一些额外的功能，尤其是在处理响应时。表\
  \ 15.4 列出了附加在 `jqXHR` 对象上的一些方法和属性。\n\n![Image](img/image00945.jpeg)\n\n**表 15.4\
  \ .ajax() 返回的 jqXHR 对象的常见方法和属性**\n\n### 总结\n\nAJAX 是 jQuery/JavaScript 与 Web 服务器之间的基本通信框架。使用\
  \ AJAX，您可以从 Web 服务器获取额外数据，并利用这些数据动态更新网页，而无需完全重新加载页面。这使您能够为用户提供更好的体验。\n\n在本课中，您学习了\
  \ AJAX 的方方面面。您通过几个示例实践了 `GET` 和 `POST` 请求，以及处理不同类型的数据（如 HTML、JSON 和 XML）。\n\n###\
  \ 问答\n\n**问. 为什么要有 GET 和 POST 请求，而不是只有一种请求？**\n\n**答.** 答案是优化。虽然您可以用 `POST` 请求完成所有操作，但通过使用参数直接放在\
  \ URL 中的 `GET` 请求，可以在 Web 服务器和浏览器层面进行优化，尤其是在缓存方面。\n\n**问. 除了 JSONP，还有其他发送跨域请求的方法吗？**\n\
  \n**答.** 是的。Flash 和 Silverlight 都有允许发送跨域请求的机制。HTML5 还引入了 `postMessage` 接口，旨在允许跨域请求。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固您对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 测验\n\n**1.**\
  \ 您会使用 `GET` 还是 `POST` 请求在 Web 服务器上设置新密码？\n\n**2.** 判断对错：仅当 AJAX 请求成功时，才会调用 `.done()`\
  \ 事件处理函数。\n\n**3.** 对于 XML 数据，响应数据会被转换为哪种数据类型？\n\n**4.** 对于 JSON 数据，响应数据会被转换为哪种数据类型？\n\
  \n**5.** 是否可以通过 jQuery 指定随 `GET` 请求发送的请求头？\n\n#### 测验答案\n\n**1.** `POST`。\n\n**2.**\
  \ 对。\n\n**3.** DOM 对象。\n\n**4.** 基本 JavaScript 对象。\n\n**5.** 可以。您可以使用带有 `headers`\
  \ 参数的 `.ajax()`，或者使用 `.ajaxSetup()` 全局设置 `headers` 参数。\n\n#### 练习\n\n**1.** 修改清单\
  \ 15.9、15.10、15.11 和 15.12 中的示例。在 JSON 文件中为每个图像添加一个额外的日期值。然后，在网页上将日期值与图像一起显示，将其包含在图像标题中。\n\
