  \ 事件类型指定了 `clickHandler()`。此外，还传递了一个对象，该对象将 `heading` 和 `answer` 属性添加到事件对象的数据中。这就是我们在步骤\
  \ 4 中使用的值的来源：\n\n点击此处查看代码图片\n\n```\n$(\"#div1\").on({\"click\":clickHandler},\n\
  \              {\"objId\":\"heading\", \"answer\":\"yes\"});\n```\n\n7. 添加以下 jQuery\
