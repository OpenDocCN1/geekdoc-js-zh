  \ 19.10 中的代码，添加一个名为“滑块”的新标签页。然后让它链接到包含滑块示例的 `widgets_slider_bars.html` 文件。\n\n#\
  \ 第五部分：使用 AngularJS 构建 Web 应用程序\n\n## 第 20 课 AngularJS 入门\n\n本课你将学到：\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 应用程序的组件\n\n![Image](img/image00767.jpeg) AngularJS 生命周期的各个阶段\n\n![Image](img/image00767.jpeg)\
  \ 如何在网页中引导 AngularJS\n\n![Image](img/image00767.jpeg) AngularJS 全局 API 提供了哪些功能\n\
  \n![Image](img/image00767.jpeg) 如何构建 AngularJS 应用程序\n\nAngularJS 是一个 JavaScript\
  \ 框架，它提供了一种非常结构化的方法来创建网站和 Web 应用程序。本质上，AngularJS 是一个基于轻量级 jQuery 构建的 JavaScript\
  \ 库——这种组合使 AngularJS 能够提供 JavaScript 和 jQuery 的最佳功能，同时强制实施结构化的模型-视图-控制器（MVC）框架。\n\
  \nAngularJS 是大多数 Web 应用程序的完美客户端库，因为它提供了一种非常清晰和结构化的方法。有了清晰、结构化的前端，您会发现实现干净、结构良好的服务器端逻辑要容易得多。\n\
  \n\n\n\n\n本课程将向您介绍 AngularJS 以及 AngularJS 应用程序所涉及的主要组件。在尝试实现 AngularJS 应用程序之前，理解这些组件至关重要，因为该框架与传统的\
  \ JavaScript Web 应用程序编程有所不同。\n\n在您充分掌握 AngularJS 应用程序的组件和生命周期之后，您将逐步学习如何构建一个基本的\
  \ AngularJS 应用程序。这将为您进入后续课程做好准备，这些课程将更详细地介绍如何实现 AngularJS。\n\n* * *\n\n注意\n\n本书中的示例基于\
  \ AngularJS 1.x。Google 已经发布了 AngularJS 2，并让我们对其有了初步了解（尽管正式发布似乎还有很长的路要走）。AngularJS\
  \ 2 将是 AngularJS 1 的重大升级。对开发者影响最大的变化似乎集中在自定义指令上，而这是 AngularJS 1.x 中最复杂的部分。问题是：我还应该学习\
  \ AngularJS 1.x 吗？简单的答案是：是的。据我们所知，AngularJS 1.x 的大部分知识将延续到 AngularJS 2，因为代码结构和关注点分离的核心概念是相同的。同时，为\
  \ AngularJS 2 做准备的一个好方法是尽可能保持代码的模块化。Google 已经表示，您可以将 AngularJS 1.x 包裹在 AngularJS\
  \ 2 中运行，而模块化的代码将允许您逐个部分进行更新。\n\n* * *\n\n## 为什么选择 AngularJS？\n\nAngularJS 是一个基于\
  \ JavaScript 和轻量级 jQuery 构建的 MVC 框架。MVC 框架将代码中的业务逻辑与视图和模型分离开来。如果没有这种分离，当您试图同时管理这三者以及复杂的函数迷宫时，基于\
  \ JavaScript 的 Web 应用程序很快就会变得难以控制。\n\nAngularJS 提供的所有功能，您都可以使用 JavaScript 和 jQuery\
  \ 自行实现，甚至也可以尝试使用其他 MVC JavaScript 框架。然而，AngularJS 拥有大量功能，并且其框架设计使得以正确方式实现 MVC 变得容易。以下是选择\
  \ AngularJS 的一些理由。\n\nAngularJS 框架强制正确实现 MVC，并且使正确实现 MVC 变得简单：\n\n![Image](img/image00767.jpeg)\
  \ AngularJS HTML 模板的声明式风格使 HTML 的意图更加直观，并使 HTML 更易于维护。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 的模型部分是基本的 JavaScript 对象，使其易于操作、访问和实现。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 采用声明式方法扩展 HTML 的功能，通过在 HTML 声明与背后的 JavaScript 功能之间建立直接链接来实现。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 提供了一个非常简单且灵活的过滤器接口，使您能够在数据从模型传递到视图时轻松格式化数据。\n\n![Image](img/image00767.jpeg)\
  \ AngularJS 应用程序通常只使用传统 JavaScript 应用程序所需代码的一小部分，因为您只需关注逻辑，而无需关注所有细枝末节，例如数据绑定。\n\
  \n![Image](img/image00767.jpeg) AngularJS 比传统方法需要更少的文档对象模型（DOM）操作，并引导您将操作放在应用程序中的正确位置。基于呈现数据来设计应用程序比基于\
  \ DOM 操作更容易。\n\n![Image](img/image00767.jpeg) AngularJS 提供了多个内置服务，并使您能够以结构化和可重用的方式实现自己的服务。这使得您的代码更易于维护和测试。\n\
  \n![Image](img/image00767.jpeg) 由于 AngularJS 框架中职责的清晰分离，测试您的应用程序甚至使用测试驱动的方法进行开发都变得容易。\n\
  \n## 理解 AngularJS\n\nAngularJS 提供了一个基于模型-视图-控制器（MVC）模型的非常结构化的框架。该框架使您能够构建健壮、易于理解和维护的结构化应用程序。如果您不熟悉\
  \ MVC 模型，以下段落将提供一个快速概要，帮助您理解基础知识。这绝非完整描述，仅旨在为您提供足够的参考，以了解 AngularJS 如何应用 MVC 原则。如果您想了解有关\
  \ MVC 的更多信息，维基百科网站是一个很好的资源。\n\n在 MVC 中，有三个组件：模型是数据源，视图是渲染后的网页，控制器处理两者之间的交互。其思想是，当模型发生变化时，视图会自动用新数据更新。当用户与视图交互时，控制器处理这些交互，这通常会导致模型更新，进而再次更新视图。\n\
  \nMVC 的一个主要目的是在 JavaScript 代码中分离职责，以保持代码清晰且易于理解。AngularJS 是目前最好的 MVC 框架之一，因为它使实现\
  \ MVC 变得非常容易。\n\n要开始使用 AngularJS，您首先需要了解将要实现的各种组件以及它们如何相互交互。以下各节将讨论 AngularJS 应用程序中涉及的各种组件、它们的用途以及各自负责的内容。\n\
  \n#### 模块\n\nAngularJS 引入了模块的概念，用于表示应用程序中的组件。模块提供了一个命名空间，使您能够根据模块名称引用指令、作用域和其他组件。这使得打包和重用应用程序的各个部分变得更加容易。\n\
  \nAngularJS 中的每个视图或网页都通过 `ng-app` 指令分配一个模块。（指令将在本课程后面讨论。）但是，您可以将其他模块作为依赖项添加到主模块中，从而形成一个高度结构化和组件化的应用程序。主\
  \ AngularJS 模块类似于 C# 和 Java 中的根命名空间。\n\n#### 作用域与数据模型\n\nAngularJS 引入了作用域的概念。作用域只是用于填充网页上呈现的视图的数据的\
  \ JavaScript 表示。数据可以来自任何来源，例如数据库、远程 Web 服务、客户端 AngularJS 代码，或者由 Web 服务器动态生成。\n\n\
  作用域的一个伟大特性是它们只是普通的 JavaScript 对象，这意味着您可以在 AngularJS 代码中轻松地根据需要操作它们。此外，您可以嵌套作用域来组织数据，以匹配它们所使用的上下文。\n\
  \n#### 带有模板和指令的视图\n\nHTML 网页基于 DOM，其中每个 HTML 元素都由一个 DOM 对象表示。Web 浏览器读取 DOM 对象的属性，并根据\
  \ DOM 对象的属性知道如何在网页上渲染 HTML 元素。\n\n大多数动态 Web 应用程序使用直接的 JavaScript 或基于 JavaScript\
  \ 的库（如 jQuery）来操作 DOM 对象，以更改用户视图中渲染的 HTML 元素的行为和外观。\n\nAngularJS 引入了一个新概念，即组合包含指令的模板，这些指令将\
  \ HTML 标签和属性直接与后台的 JavaScript 代码扩展，以扩展 HTML 的能力。指令有两个部分。第一部分是添加到 HTML 模板中的额外属性、元素和\
  \ CSS 类。第二部分是扩展 DOM 正常行为的 JavaScript 代码。\n\n\n\n\n\n使用指令的优势在于，视觉元素的预期逻辑由 HTML 模板指示，因此易于理解，且不会隐藏在大量的\
  \ JavaScript 代码中。AngularJS 的最佳特性之一是，内置的 AngularJS 指令处理了大部分必要的 DOM 操作功能，使你能够将作用域中的数据直接绑定到视图中的\
  \ HTML 元素。\n\n你还可以创建自己的 AngularJS 指令，以实现 Web 应用程序中所需的任何自定义功能。实际上，你应该使用自己的自定义指令来执行\
  \ Web 应用程序所需的任何直接 DOM 操作。\n\n### 表达式\n\nAngularJS 的一个强大特性是能够在 HTML 模板中添加表达式。AngularJS\
  \ 会计算表达式，然后将结果动态添加到网页中。由于表达式与作用域相关联，你可以使用利用作用域中值的表达式，并且随着模型的变化，表达式的值也会随之变化。\n\n\
  ### 控制器\n\nAngularJS 通过实现控制器来完成 MVC 框架。控制器通过设置作用域中的初始状态或值，以及向作用域添加行为来增强作用域。例如，你可以添加一个对作用域中的值求和的函数来提供总计值，这样如果作用域背后的模型数据发生变化，总计值也会随之变化。\n\
  \n你可以通过使用指令将控制器添加到 HTML 元素，然后在后台将其实现为 JavaScript 代码。\n\n### 数据绑定\n\nAngularJS 的最佳特性之一是内置的数据绑定。数据绑定是将模型中的数据与网页中显示的内容链接起来的过程。AngularJS\
  \ 提供了一个非常清晰的接口，用于将模型数据链接到网页中的元素。\n\n在 AngularJS 中，数据绑定是一个双向过程：当网页上的数据发生变化时，模型会更新；当模型中的数据发生变化时，网页会自动更新。这样，模型始终是呈现给用户的数据的唯一来源，而视图则是模型的一个投影。\n\
  \n### 服务\n\n服务是 AngularJS 环境中的主要工作单元。服务是单例对象，为 Web 应用程序提供功能。例如，Web 应用程序的一项常见任务是向\
  \ Web 服务器执行 AJAX 请求。AngularJS 提供了一个 HTTP 服务，其中包含了访问 Web 服务器的所有功能。\n\n服务功能完全独立于上下文或状态，因此可以轻松地被应用程序的组件使用。AngularJS\
  \ 提供了许多用于基本用途的内置服务组件，例如 HTTP 请求、日志记录、解析和动画。你还可以创建自己的服务，并在代码中重复使用它们。\n\n### 依赖注入\n\
  \n依赖注入是一个过程，其中代码组件定义了对其他组件的依赖。当代码初始化时，依赖的组件在组件内部变得可访问。AngularJS 应用程序大量使用依赖注入。\n\n\
  依赖注入的一个常见用途是消费服务。例如，如果你正在定义一个需要通过 HTTP 请求访问 Web 服务器的模块，你可以将 HTTP 服务注入到该模块中，然后该功能在模块代码中可用。此外，一个\
  \ AngularJS 模块通过依赖注入来消费另一个模块的功能。\n\n### 编译器\n\nAngularJS 提供了一个 HTML 编译器，它会在 AngularJS\
  \ 模板中发现指令，并使用 JavaScript 指令代码构建出扩展的 HTML 元素。当 AngularJS 库被引导加载时，AngularJS 编译器会被加载到浏览器中。加载后，编译器会搜索浏览器中的\
  \ HTML DOM，并将任何后台 JavaScript 代码链接到 HTML 元素，然后最终的应用程序视图会呈现给用户。\n\n## AngularJS 生命周期概述\n\
  \n现在你已经了解了 AngularJS 应用程序中涉及的组件，你需要了解生命周期中发生的事情，它包含三个阶段：引导、编译和运行时。理解 AngularJS 应用程序的生命周期有助于更轻松地理解如何设计和实现代码。\n\
  \n每次在浏览器中加载网页时，AngularJS 应用程序的生命周期的三个阶段都会发生。以下部分描述了 AngularJS 应用程序的这些阶段。\n\n####\
  \ 引导阶段\n\nAngularJS 生命周期的第一阶段是引导阶段，发生在 AngularJS JavaScript 库被下载到浏览器时。AngularJS\
  \ 初始化其自身的必要组件，然后初始化你的模块，即 `ng-app` 指令指向的模块。模块被加载，任何依赖项被注入到你的模块中，并在模块内的代码中可用。\n\n\
  #### 编译阶段\n\nAngularJS 生命周期的第二阶段是 HTML 编译阶段。最初加载网页时，浏览器中会加载一个静态形式的 DOM。在编译阶段，静态\
  \ DOM 被替换为表示 AngularJS 视图的动态 DOM。\n\n此阶段涉及两个部分：遍历静态 DOM 并收集所有指令，然后将指令链接到 AngularJS\
  \ 内置库或自定义指令代码中的适当 JavaScript 功能。指令与作用域结合，生成动态或实时的视图。\n\n#### 运行时数据绑定阶段\n\nAngularJS\
  \ 应用程序的最后阶段是运行时阶段，该阶段一直持续到用户重新加载或导航离开网页。此时，作用域中的任何变化都会反映在视图中，而视图中的任何变化都会直接更新到作用域中，使作用域成为视图数据的唯一来源。\n\
  \nAngularJS 的行为与传统的数据绑定方法不同。传统方法将模板与从引擎接收的数据结合，然后在每次数据变化时操作 DOM。AngularJS 只编译一次\
  \ DOM，然后根据需要链接编译后的模板，这使得它比传统方法高效得多。\n\n## 职责分离\n\n设计 AngularJS 应用程序时极其重要的一点是职责分离。选择结构化框架的全部原因是为了确保代码实现良好、易于理解、可维护和可测试。Angular\
  \ 提供了一个非常结构化的框架供你使用，但你仍然需要确保以适当的方式实现 AngularJS。\n\n以下是实现 AngularJS 时应遵循的一些规则：\n\n\
  ![Image](img/image00767.jpeg) 视图充当应用程序的官方呈现结构。将任何呈现逻辑表示为视图 HTML 模板中的指令。\n\n![Image](img/image00767.jpeg)\
  \ 如果需要执行任何 DOM 操作，请在内置或你自己的自定义指令 JavaScript 代码中执行——而不是在其他地方。\n\n![Image](img/image00767.jpeg)\
  \ 将任何可重用的任务实现为服务，并通过依赖注入将它们添加到你的模块中。\n\n![Image](img/image00767.jpeg) 确保作用域反映模型的当前状态，并且是视图所消费数据的唯一来源。\n\
  \n![Image](img/image00767.jpeg) 确保控制器代码仅用于增强作用域数据，而不包含任何业务逻辑。\n\n![Image](img/image00767.jpeg)\
  \ 在模块命名空间内定义控制器，而不是全局定义。这可以确保你的应用程序能够轻松打包，并防止全局命名空间被过度占用。\n\n## 将 AngularJS 与现有\
  \ JavaScript 和 jQuery 集成\n\n\n\n\n\nAngularJS 基于 JavaScript 和 jQuery 这一事实，使得人们很容易尝试将其添加到现有应用中，以提供数据绑定或其他功能。然而，这种方法几乎总是会导致难以维护的问题代码。不过，使用\
  \ AngularJS 并不意味着你必须完全抛弃现有代码。通常，你可以有选择地提取可用的 JavaScript/jQuery 组件，并将其转换为指令或服务。\n\
  \n这也引出了另一个问题：何时使用完整版的 jQuery，而不是 AngularJS 自带的 jQuery lite？我知道很多人对此有强烈的看法。一方面，你希望实现尽可能简洁明了。但另一方面，有时你可能需要完整版\
  \ jQuery 才提供的功能。我们的建议是：按需使用。如果你需要 AngularJS jQuery lite 未提供的功能，就加载完整库。关于加载 jQuery\
  \ 而非 jQuery lite 的具体机制，将在本课后面讨论。\n\n以下步骤提供了一种将 AngularJS 集成到现有 JavaScript 和 jQuery\
  \ 应用中的方法：\n\n**1.** 从头开始编写至少一个使用模型、自定义 HTML 指令、服务和控制器的小型 AngularJS 应用。换句话说，在这个应用中，确保你对\
  \ AngularJS 的职责分离有实际的理解。\n\n**2.** 识别代码中的模型部分。具体来说，尝试将增强模型中模型数据的代码分离到控制器函数中，将访问后端模型数据的代码分离到服务中。\n\
  \n**3.** 识别视图中操作 DOM 元素的代码。尝试将 DOM 操作代码分离到定义良好的自定义指令组件中，并为它们提供 HTML 指令。同时，识别 AngularJS\
  \ 已提供内置支持的指令。\n\n**4.** 识别其他基于任务的函数，并将其分离到服务中。\n\n**5.** 将指令和控制器隔离到模块中，以组织代码。\n\n\
  **6.** 使用依赖注入来适当地连接服务和模块。\n\n**7.** 更新 HTML 模板以使用新的指令。\n\n显然，在某些情况下，使用现有代码（即使有）可能并不合理。然而，通过执行上述步骤，你将进入使用\
  \ AngularJS 实现项目的设计阶段，然后可以做出明智的决策。\n\n## 将 AngularJS 添加到你的环境中\n\nAngularJS 是一个客户端\
  \ JavaScript 库，这意味着要在你的环境中实现 AngularJS，你只需提供一种方法，让客户端通过 HTML 模板中的 `<script>` 标签获取\
  \ `angular.js` 库文件。\n\n提供 `angular.js` 库的最简单方法是使用内容分发网络（CDN），它提供了一个从第三方下载库的 URL。这种方法的缺点是你必须依赖第三方来提供库，如果客户端无法连接到该第三方\
  \ URL，你的应用将无法工作。例如，以下 `<script>` 标签从 Google APIs CDN 加载 `angular.js` 库：\n\n点击此处查看代码图片\n\
  \n```\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
  ></script>\n```\n\n另一种提供 `angular.js` 库的方法是从 AngularJS 网站（[`angularjs.org`](http://angularjs.org)）下载，并使用你自己的\
  \ Web 服务器将文件提供给客户端。这种方法需要更多的工作，并且还需要你的 Web 服务器提供额外的带宽；然而，如果你希望更好地控制客户端获取库的方式，这可能是一个更好的选择。\n\
  \n## 在 HTML 文档中引导 AngularJS\n\n要在你的网页中实现 AngularJS，你需要引导 HTML 文档。引导包括两个部分。第一部分是使用\
  \ `ng-app` 指令定义应用模块，第二部分是在 `<script>` 标签中加载 `angular.js` 库。\n\n`ng-app` 指令告诉 AngularJS\
  \ 编译器将该元素视为编译的根节点。`ng-app` 指令通常加载在 `<html>` 标签中，以确保整个网页都被包含在内；不过，你也可以将其添加到其他容器元素中，只有该容器内的元素才会被纳入\
  \ AngularJS 编译，从而纳入 AngularJS 应用功能。\n\n在可能的情况下，你应该将 `angular.js` 库作为 HTML `<body>`\
  \ 中的最后一个标签（如果不是最后一个的话）来包含。当 `angular.js` 脚本加载时，编译器启动并开始搜索指令。最后加载 `angular.js` 可以让网页加载得更快。\n\
  \n以下是在 HTML 文档中实现 `ng-app` 和 `angular.js` 引导的示例：\n\n点击此处查看代码图片\n\n```\n<!doctype\
  \ html>\n<html ng-app=\"myApp\">\n  <body>\n    <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n    <script src=\"/lib/myApp.js\"></script>\n  </body>\n</html>\n```\n\
  \n## 使用全局 API\n\n在实现 AngularJS 应用时，你会发现需要定期执行一些常见的 JavaScript 任务，例如比较对象、深拷贝、遍历对象以及转换\
  \ JSON 数据。AngularJS 在全局 API 中提供了许多这类基本功能。\n\n当 `angular.js` 库加载后，全局 API 即可使用，你可以通过\
  \ `angular` 对象来访问它们。例如，要创建一个名为 `myObj` 的对象的副本，你可以使用以下语法：\n\n点击此处查看代码图片\n\n```\n\
  var myCopy = angular.copy(myObj);\n```\n\n以下代码展示了如何使用 `forEach()` 全局 API 遍历对象数组的示例：\n\
  \n点击此处查看代码图片\n\n```\nvar objArr = [{score: 95}, {score: 98}, {score: 92}];\nvar\
  \ scores = [];\n\nangular.forEach(objArr, function(value, key){\n  this.push(key\
  \ + '=' + value);\n}, scores);\n\n// scores == ['score=95', 'score=98', 'score=92']\n\
  ```\n\n表 20.1 列出了全局 API 中提供的一些最实用的工具。你将在本书的许多示例中看到它们的使用。\n\n![Image](img/image00988.jpeg)![Image](img/image00989.jpeg)\n\
  \n**表 20.1 AngularJS 中提供的实用全局 API 工具**\n\n* * *\n\n动手试一试：创建一个基本的 AngularJS 应用\n\n\
  现在你已经了解了 AngularJS 框架中的基本组件、AngularJS 框架的意图和设计，以及如何引导 AngularJS，你可以开始实现一个 AngularJS\
  \ 应用了。本节将引导你完成一个非常基本的 AngularJS 应用，该应用实现了 HTML 模板、AngularJS 模块、控制器、作用域和表达式。\n\n\
