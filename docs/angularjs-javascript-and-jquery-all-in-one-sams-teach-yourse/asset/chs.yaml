  ***\n\n### 摘要\n\n事件管理能力是大多数 AngularJS 应用程序中最关键的组成部分之一。你可以在 AngularJS 应用程序中使用事件来提供用户与元素的交互，以及应用程序组件之间的通信，以便知道何时执行特定任务。本课首先简要讨论了浏览器和用户交互事件，以及它们与整体应用程序架构的关系。\n\
  \n接下来，本课介绍了如何使用 `$watch`、`$watchGroup` 和 `$watchCollection` 方法来监视作用域中的值。使用监视器可以让你在作用域值发生变化时采取行动，而无需在每个可能改变这些值的位置放置代码。\n\
  \n作用域被组织成层次结构，根作用域在应用程序级别定义。每个控制器实例也会获得一个子作用域实例。在本课中，你学习了如何从作用域内发出或广播事件，然后实现监听这些事件并在触发时执行的处理程序。\n\
  \n### 问答\n\n**问. AngularJS 何时处理监视器？**\n\n**答.** AngularJS 使用一个摘要循环，它基本上是一个循环，用于检查作用域正在监视的变量是否发生变化。\n\
  \n**问. 这是否意味着我所有的作用域值都被监视了？**\n\n**答.** 不，那可能会导致严重的性能下降。只有你通过监视函数指定的变量才会被检查。\n\n\
  ### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 测验\n\n1. 同时监视作用域中多个值的最佳方法是什么？\n\
  \n2. 由 `$emit` 触发的事件在作用域层次结构中是向上还是向下传播？\n\n3. 由 `$broadcast` 触发的事件在作用域层次结构中是向上还是向下传播？\n\
  \n4. 在浏览器事件中，用于阻止默认行为的函数叫什么？\n\n#### 测验答案\n\n1. 使用 `$watchGroup`\n\n2. 向上\n\n3.\
  \ 向下\n\n4. `preventDefault()`\n\n#### 练习\n\n**1.** 修改清单 26.1 和 26.2 中的代码，添加一个比率值，表示命中次数除以命中次数加未命中次数。修改现有的监视器，使得每次按下“命中”或“未命中”按钮时更新比率。\n\
