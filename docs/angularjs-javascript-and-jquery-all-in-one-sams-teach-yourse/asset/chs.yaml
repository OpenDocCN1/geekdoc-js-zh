  08 .label{\n09   font-size:25px;\n10   margin:10px;\n11 }\n```\n\n* * *\n\n### 总结\n\
  \n在本课中，你学习了如何使用 jQuery 和 JavaScript 对象来查找和访问 DOM 元素。这是动态编程中最关键的部分，因为你必须能够高效地访问 DOM\
  \ 元素，才能动态地操作它们。你学习了 JavaScript DOM 对象的基本语法和结构，以及这些对象附带的一些方法和属性。\n\n### 问答\n\n**问.\
  \ 何时应该使用 `getObjectById()` 而不是 `$(\"#id\")`？**\n\n**答.** 你很可能很少会用到 `getObjectById()`。唯一可能使用它的情况是，当你不希望花时间将\
  \ jQuery 库链接到 HTML 文档时。jQuery 的可扩展性要强得多。\n\n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，再查看答案。\n\
  \n#### 测验\n\n**1.** 如何将名为 `myDiv` 的 DOM 对象转换为 jQuery 对象？\n\n**2.** 判断正误：jQuery 选择器返回一个\
  \ DOM 对象列表。\n\n**3.** 如何判断一个对象是否为 jQuery 对象？\n\n**4.** 如果你想要所有 `class=\"heading\"\
  ` 的元素，应该使用哪个 jQuery 选择器？\n\n**5.** 要获取所有作为 `<div>` 元素子元素的 `<p>` 元素，应该使用哪个 jQuery\
  \ 选择器？\n\n**6.** 如何获取 jQuery 对象所表示的 DOM 元素的 JavaScript 数组？\n\n#### 测验答案\n\n**1.**\
  \ 使用 `$(myDiv)` 创建一个新的 jQuery 对象，其中 DOM 元素作为集合中的唯一项。\n\n**2.** 错误。jQuery 选择器返回一个包含一组\
  \ DOM 元素的 jQuery 对象。\n\n**3.** 测试它是否设置了 `jquery` 属性。\n\n**4.** `$(\".heading\")`\n\
  \n**5.** `$(\"div p\")`\n\n**6.** 在 jQuery 对象上使用 `get()` 方法。\n\n#### 练习\n\n**1.**\
  \ 在 `jquery_selectors.html` 示例中添加一个额外的按钮，该按钮仅选择列表中的第一个和最后一个项。你需要添加必要的 HTML 和 JavaScript\
  \ 代码来实现。\n\n## 第 8 课：使用 jQuery 导航和操作 jQuery 对象及 DOM 元素\n\n本课你将学到：\n\n![图片](img/image00767.jpeg)\
  \ 链式调用 jQuery 操作以提高效率\n\n![图片](img/image00767.jpeg) 过滤 jQuery 对象中 DOM 元素的方法\n\n\
  ![图片](img/image00767.jpeg) 使用 jQuery 对象遍历 DOM 的方法\n\n![图片](img/image00767.jpeg)\
  \ 遍历 jQuery 对象集合中的每个元素\n\njQuery 选择器返回一个 jQuery 对象，该对象表示零个或多个与选择器定义匹配的元素。简单的选择器在很多情况下都很出色。然而，随着你的网页变得越来越复杂，你会发现选择器并不能满足所有需求。\n\
  \n\n\n\njQuery 对象提供了额外的功能，并增强了选择器结果，使您能够轻松地细化所表示的 DOM 元素列表、在 DOM 树中导航以查找其他元素，以及操作\
  \ HTML 元素的值。以下各节将介绍如何将 jQuery 操作链接在一起，以高效地查找、筛选和导航网页中的 DOM 元素。\n\n### 链式调用 jQuery\
  \ 对象操作\n\njQuery 对象的一大优点是可以将多个 jQuery 操作链接到单个语句中。每个连续的语句都将对链中前一个操作的结果进行操作。这有助于减少和简化选择器，并减少\
  \ CSS 中所需的类和 ID 定义数量。\n\n可以将链式 jQuery 操作的结果视为一个 jQuery 对象栈，每个对象代表一组 DOM 元素。链中的每个操作都会将一个\
  \ jQuery 对象放入栈中，但当前操作仅应用于栈顶的 jQuery 对象。\n\n为了帮助说明这一点，请考虑以下语句。代码首先查找 `id=\"content\"\
  ` 的 `<div>` 元素，然后查找其中的第一个 `<p>` 元素，并将 `font-weight` 更改为 `bold`。接着查找 `<p>` 内部的 `<span>`\
  \ 元素，并将 `color` 设置为 `red`：\n\n```javascript\nvar $contentDiv = $(\"div#content\"\
  );\nvar $firstP = $contentDiv.children(\"p:first\");\n$firstP.css(\"font-weight\"\
  ,\"bold\");\nvar $spans = $firstP.children(\"span\");\n$spans.css(\"color\",\"red\"\
  );\n```\n\n前面的代码用了五行来完成所有任务。下面这一行链式 jQuery 操作实现了相同的功能，但只用了一行：\n\n```javascript\n\
  $(\"div#content\").children(\"p:first\").css(\"font-weight\",\"bold\").children(\"\
  span\"). css(\"color\",\"red\");\n```\n\n由于每个操作都返回一个 jQuery 对象，因此您可以按需链接任意多个 jQuery\
  \ 操作。即使 `.css()` 操作旨在修改 DOM 对象而非查找它们，它仍然返回相同的 jQuery 对象，以便您对结果执行其他操作。\n\n### 筛选\
  \ jQuery 对象结果\n\njQuery 对象提供了一组很好的方法，允许您修改查询中表示的 DOM 对象。当您试图在 jQuery 选择器结果中精确定位一组特定元素时，缩小结果范围非常有用。表\
  \ 8.1 提供了一些链式 jQuery 选择器的示例。\n\n![Image](img/image00878.jpeg)\n\n**表 8.1 用于筛选所表示\
  \ DOM 元素的 jQuery 对象方法及示例**\n\n* * *\n\n提示\n\n与 CSS 选择器相同的 jQuery 选择器能够使用原生 DOM 方法\
  \ `querySelectorAll()`，该方法对 DOM 对象进行了一些高级优化。其他 jQuery 选择器无法利用这种优化，因此最好先使用基于 CSS\
  \ 的选择器，然后添加筛选器作为链式选择器。例如，与其使用 `$(\"div:animated\")`，不如使用 `$(\"div\").filter(\":animated\"\
  )`：[`api.jquery.com/category/selectors/jquery-selector-extensions/`](http://api.jquery.com/category/selectors/jquery-selector-extensions/)\n\
  \n* * *\n\n### 使用 jQuery 对象遍历 DOM\n\n附加到 jQuery 对象的另一组重要方法是 DOM 遍历方法。DOM 遍历使您能够根据元素与其他元素的关系来选择元素。\n\
  \nDOM 有时被称为 DOM 树，因为它以树形结构组织，文档为根节点，节点可以有父节点、兄弟节点和子节点。为了更好地理解这一点，请查看以下 HTML 代码：\n\
  \n```html\n<body>\n  <div>\n    <p>段落 1</p>\n    <p>段落 2</p>\n    <ul>\n       <li>项目\
  \ 1</li>\n        <li>项目 2</li>\n      </ul>\n </div>\n</body>\n```\n\n`<p>` 元素和\
  \ `<ul>` 元素互为兄弟节点，它们都是 `<div>` 元素的子节点。`<div>` 元素是 `<p>` 和 `<ul>` 元素的父节点，`<ul>` 元素是\
  \ `<li>` 元素的父节点，依此类推。\n\njQuery DOM 遍历方法使您能够从 DOM 的一层移动到另一层来选择元素——例如，如果您想访问所有作为\
  \ `<div>` 元素子元素的 `<p>` 元素，或者想找到作为 `<input>` 元素兄弟元素的 `<label>` 元素。\n\njQuery 对象提供了一组令人难以置信的方法，允许您以几乎无数种方式遍历\
  \ DOM，方法是使用 jQuery 对象中当前的 DOM 元素选择来选中树中的其他 DOM 元素集。表 8.2 列出了可用于遍历 DOM 的方法。\n\n![Image](img/image00879.jpeg)![Image](img/image00880.jpeg)![Image](img/image00881.jpeg)![Image](img/image00882.jpeg)\n\
  \n**表 8.2 用于遍历 DOM 以选择元素的 jQuery 对象方法及示例**\n\n### 了解一些额外的 jQuery 对象方法\n\n在筛选 jQuery\
  \ 对象或使用它遍历 DOM 时，您应该了解一些额外的方法。表 8.3 列出了一组方法，您可以结合筛选和遍历元素使用这些方法，以迭代 jQuery 对象中的 DOM\
  \ 元素、向集合中添加额外元素、结束筛选以及测试项目。您会发现，随着 jQuery 代码变得越来越自然，您会越来越频繁地使用这些方法。\n\n![Image](img/image00883.jpeg)![Image](img/image00884.jpeg)\n\
  \n**表 8.3 用于处理 jQuery 对象的一些额外方法及示例**\n\n* * *\n\n注意\n\n在使用 jQuery 方法中的函数迭代 DOM 元素时，您可以使用\
  \ `this` 关键字来访问当前正在迭代的 DOM 对象。这是一个 DOM 对象，而不是 jQuery 对象。如果您需要使用 DOM 对象的 jQuery 形式，请改用\
  \ `$(this)`。但请记住，在浏览器的渲染引擎中构建 DOM 对象的 jQuery 形式需要消耗资源，因此只有在需要其提供的功能时才创建 jQuery 形式。\n\
  \n* * *\n\n#### 使用 .each()\n\n`.each(function)` 方法是最重要的 jQuery 对象方法之一，因为它允许您遍历 jQuery\
  \ 集合中的所有元素，并对每个元素单独执行操作。这与简单地对查询中的所有项目应用相同操作不同。\n\n`.each()` 方法允许您指定一个函数，该函数将为 jQuery\
  \ 对象集合中的每个元素运行。该函数将接收一个索引号作为第一个参数。在函数内部，`this` 变量将指向当前的 DOM 元素。\n\n以下代码片段说明了如何使用\
  \ `.each()`。它遍历所有段落元素，并设置内容，包括元素的索引号：\n\n```javascript\n$(\"p\").each(function (idx){\n\
  \    $(this).html(\"这是段落 \" + idx);\n  });\n```\n\n注意，`idx` 作为索引号传入；0 表示第一个 `<p>`\
  \ 元素，1 表示第二个，依此类推。还要注意，`this` 通过 `$(this)` 转换为 jQuery 对象，以便调用 `.html()` 方法。\n\n\
  #### 使用 .map()\n\n`.map(function)` 方法也会遍历 jQuery 对象集合中的每个元素。虽然与 `.each()` 非常相似，但有一个很大的区别：`.each()`\
  \ 会返回相同的 jQuery 对象，而 `.map()` 会返回一个新的 jQuery 对象，其中包含每次迭代返回的值。\n\n以下代码片段说明了如何使用 `.map()`。它将遍历所有\
  \ `<li>` 元素，并返回元素文本的逗号分隔字符串：\n\n点击此处查看代码图像\n\n\n\n\n\n```\nvar liValues = $(\"li\"\
  ).map(function (idx){\n    return $(this).html();\n  }).get().join(\",\");\n```\n\
  \n请注意，每次迭代时，函数都会返回 `<li>` 元素中的 HTML 内容。调用 `.get()` 可以返回由 `.map()` 返回的新 jQuery 对象的\
  \ JavaScript 数组版本，然后对该数组调用 `.join(\",\")` 以构建逗号分隔的字符串。\n\n* * *\n\n## 动手实践：使用 jQuery\
  \ 的 .map() 和 .each() 方法导航、访问和操作 DOM 元素\n\n在本示例中，你将学习使用 jQuery 选择器查找所有段落元素的过程。然后使用\
  \ `.map()` 函数读取内容，并用它创建一个新的 `<span>` 框。你还将使用 `.each()` 遍历 `<p>` 元素并重新设置它们的样式。完整的示例文件可在清单\
