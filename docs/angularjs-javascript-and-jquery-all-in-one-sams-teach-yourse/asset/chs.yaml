  \ `innerHTML` 文本设置为 `inElement.value`，即文本框中输入的内容。\n\n13. 创建一个名为 `lesson07/css/dom_objects.css`\
  \ 的文件，并添加清单 7.3 中所示的代码。这会对输出元素进行一些样式设置。\n\n14. 保存这三个文件，然后在 Web 浏览器中打开 `dom_objects.html`\
  \ 文件，查看如图 7.1 所示的网页。尝试输入一些文本并单击“Update”按钮。\n\n![图片](img/image00867.jpeg)\n\n**图\
  \ 7.1** 一个简单的 JavaScript 网页，允许用户输入文本并更新组件。\n\n**清单 7.1 dom_objects.html HTML 文件，加载\
  \ JavaScript 并将事件处理程序附加到按钮元素以更新页面**\n\n```\n01 <!DOCTYPE html>\n02 <html>\n03  \
  \ <head>\n04     <title>DOM Objects</title>\n05     <meta charset=\"utf-8\" />\n\
  06     <script type=\"text/javascript\" src=\"js/dom_objects.js\"></script>\n```\n\
  \n\n\n\n\n```html\n07     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/dom_objects.css\"\
  >\n\n08   </head>\n\n09   <body>\n\n10     <input id=\"textIn\" type=\"text\"/>\n\
  \n11     <input type=\"button\" onclick=\"textChange()\" value=\"Update\" /><br>\n\
  \n12     <span class=\"heading\"></span>\n\n13     <p id=\"p1\"></p>\n\n14     <span\
  \ class=\"heading\"></span>\n\n15     <p id=\"p2\"></p>\n\n16   </body>\n\n17 </html>\n\
  ```\n\n---\n\n### 清单 7.2 dom_objects.js JavaScript 文件包含一个函数，展示了通过 id、tag 和 class\
  \ 属性访问变量的示例\n\n点击此处查看代码图片\n\n---\n\n```javascript\n01 function textChange(){\n\n\
  02   var inElement = document.getElementById(\"textIn\");\n\n03   var outElements\
  \ = document.getElementsByTagName(\"p\");\n\n04   var headingElements = document.getElementsByClassName(\"\
  heading\");\n\n05   for(var i=0; i<outElements.length; i++){\n\n06     var outItem\
  \ = outElements[i];\n\n07     headingElements[i].innerHTML = \"Updating \" + (i+1)\
  \ +\n\n08                                    \" to \" + inElement.value;\n\n09     outItem.innerHTML\
  \ = inElement.value;\n\n10   }\n\n11 }\n```\n\n---\n\n### 清单 7.3 dom_objects.css\
  \ 样式表，用于设置 `<p>` 元素的样式\n\n---\n\n```css\n01 p{\n\n02   font-weight:bold;\n\n03   font-size:50px;\n\
  \n04   margin:5px;\n\n05   color:blue;\n\n06 }\n```\n\n---\n\n---\n\n### 使用 jQuery\
  \ 选择器\n\n与 JavaScript 不同，jQuery 允许你通过选择器以无数种方式查找 HTML 元素。没错，就像 CSS 选择器一样。实际上，大多数\
  \ jQuery 选择器都源自 CSS，从而在两者之间提供了更无缝的过渡。\n\n正如你将在后续章节中看到的，jQuery 选择器使得选择几乎任何一组 HTML\
  \ 元素变得非常容易。不过请记住，jQuery 选择器返回的是 jQuery 对象，而不是 DOM 对象。\n\njQuery 选择器语法非常直接。加载 jQuery\
  \ 库后，使用 `$(selector)`。例如：\n\n`$(\"#myElement\")`\n\n---\n\n**注意**\n\njQuery 选择器语法中使用了多个元字符。如果你想将任何元字符（如\
  \ ``!\"#$%&'()*+,./:;<=>?@[\\]^`{|}~ )``）用作类名/ID/名称的一部分，则需要使用 `\\\\` 两个反斜杠对其进行转义。例如，如果你有一个\
  \ `id=\"my.element\"` 的元素，则应使用选择器 `$(\"#my\\\\.element\")`。\n\n---\n\n与 CSS 选择器一样，向你介绍\
  \ jQuery 选择器的最佳方式是通过一些示例。接下来的章节将带你了解不同类型的 jQuery 选择器示例。这些章节只是浅尝辄止。你可以随时访问以下位置查看选择器文档：\n\
  \n[`http://api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)\n\
  \n#### 应用基本选择器\n\n最常用的选择器是基本选择器。基本选择器关注 HTML 元素的 id 属性、class 属性和标签名称。表 7.3 列出了一些示例，展示如何定义一些基本选择器。\n\
  \n![Image](img/image00868.jpeg)\n\n**表 7.3 使用基本 jQuery 选择器的示例**\n\n#### 应用属性选择器\n\
  \n使用 jQuery 选择器的另一种方式是通过 HTML 元素的属性值来选择元素。它可以是默认属性，也可以是添加到 HTML 元素中的属性。属性值在选择器语法中用\
  \ `[]` 方括号括起来表示。表 7.4 展示了一些应用属性选择器的方式。\n\n![Image](img/image00869.jpeg)![Image](img/image00870.jpeg)\n\
  \n**表 7.4 使用属性 jQuery 选择器的示例**\n\n#### 应用内容选择器\n\n另一组有用的 jQuery 选择器是内容过滤选择器。这些选择器允许你根据\
  \ HTML 元素内部的内容来选择元素。表 7.5 展示了使用内容选择器的示例。\n\n![Image](img/image00871.jpeg)\n\n**表\
  \ 7.5 使用内容 jQuery 选择器的示例**\n\n#### 应用层次选择器\n\n一组重要的 jQuery 选择器是层次选择器。这些选择器允许你根据\
  \ DOM 层次结构选择 HTML 元素。这使你能够编写更具内容感知能力的动态代码，仅根据 DOM 树中的父元素、子元素或周围的其他元素来选择元素。表 7.6\
  \ 展示了一些层次选择器的示例。\n\n![Image](img/image00872.jpeg)\n\n**表 7.6 使用层次 jQuery 选择器的示例**\n\
  \n---\n\n**注意**\n\n在设计 jQuery 选择器时，最好尽可能具体。例如，如果你想选择所有 `class=\"menu\"` 的 `span`\
  \ 元素，并且这些元素仅位于 `id=\"menuDiv\"` 的 `<div>` 元素下，那么 `$(\"div#menuDiv .menu\")` 将比 `$(\"\
  .menu\")` 高效得多，因为它会在检查菜单 class 属性之前将搜索范围限制在 `<div>` 元素内。\n\n---\n\n#### 应用表单选择器\n\
  \n在处理动态 HTML 表单时，一组极其有用的选择器是表单 jQuery 选择器。这些选择器允许你根据表单元素的状态选择表单中的元素。表 7.7 展示了一些表单选择器的示例。\n\
  \n![Image](img/image00873.jpeg)\n\n**表 7.7 使用属性 jQuery 选择器的示例**\n\n#### 应用可见性选择器\n\
  \n如果你使用可见性来控制网页组件的流程和交互，使用可见性 jQuery 选择器可以轻松选择隐藏或可见的 HTML 元素。表 7.8 展示了一些可见性选择器的示例。\n\
  \n![Image](img/image00874.jpeg)\n\n**表 7.8 使用属性 jQuery 选择器的示例**\n\n#### 应用过滤选择器\n\
  \n通常你需要将 jQuery 选择器细化到更具体的子集。实现这一目标的一种方法是使用过滤选择器。过滤选择器在选择器语句末尾附加一个过滤器，以限制选择器返回的结果。表\
  \ 7.9 展示了一些向选择器添加过滤器的示例。\n\n![Image](img/image00875.jpeg)![Image](img/image00876.jpeg)\n\
  \n**表 7.9 使用过滤 jQuery 选择器的示例**\n\n---\n\n## 自己动手：使用 jQuery 访问 DOM 对象\n\n在此示例中，你将使用\
