  \n![Image](img/image01052.jpeg)\n\n**图 28.3** 使用自定义的 AngularJS 服务，这些服务实现了`$http`以提供对服务器上数据的检索和更新访问。\n\
  \n* * *\n\n### 总结\n\n\n\n\n\nAngularJS 自定义服务是单例对象，你可以将其注册到依赖注入器中。注册到依赖注入器后，控制器、指令以及其他\
  \ AngularJS 组件（包括其他服务）都可以使用它们。AngularJS 提供了多种创建自定义服务的方法，复杂度各不相同。`value` 和 `constant`\
  \ 方法用于创建简单的服务。而 `factory` 和 `service` 方法则允许你创建更复杂的服务。\n\n本课重点介绍了那些工具，它们使你在需要为应用程序提供基于任务的功能时，能够实现自己的自定义\
  \ AngularJS 服务。你学习了四种方法或类型的自定义 AngularJS 服务，包括 `value`、`constant`、`factory` 和 `service`。\n\
  \n本课展示了实现每种自定义 AngularJS 服务类型的示例。你还看到了在多个控制器中实现自定义 AngularJS 服务的示例。本课的最后一个示例向你展示了如何实现一个独立的、使用\
  \ `$http` 与服务器交互的自定义 AngularJS 服务，以及如何在另一个模块中注入并使用它。\n\n### 问答\n\n**问. 是否可以在单元测试中模拟\
  \ AngularJS 服务？**\n\n**答.** 可以。你可以使用类似 Jasmine 测试驱动开发框架来模拟服务提供者。\n\n**问. `value`\
  \ 服务和 `constant` 服务有什么区别？**\n\n**答.** 它们的行为几乎相同。唯一的实际区别是 `value` 服务不能注入到模块的配置块中。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，再查看答案。\n\n#### 小测验\n\n**1.**\
  \ 如果你想为单个变量定义初始值，你会使用哪个 AngularJS 服务提供者？\n\n**2.** 服务提供者有多少种类型？\n\n**3.** 判断正误：服务在模块中只能使用一次。\n\
  \n#### 小测验答案\n\n**1.** `value` 服务提供者。\n\n**2.** `value`、`constant`、`factory` 和 `service`。\n\
  \n**3.** 错误。服务可以注入到模块的多个组件中。\n\n#### 练习\n\n**1.** 修改清单 28.1 和 28.2 中的代码，添加让用户向屏蔽词列表中添加新词的功能。向\
  \ `CensorObj` 对象添加一个函数，允许用户向 `cWords` 列表中添加单词。向控制器添加一个函数，该函数将调用该方法来添加要屏蔽的新词。最后，向模板添加一个文本输入框和按钮，并连接到作用域。\n\
  \n**2.** 修改清单 28.3 和 28.4 中的代码，向时间服务添加本地时间，并在页面上显示。你需要向 `TimeObj` 添加一个获取本地时间并返回的函数。然后为本地时间添加一个控制器，并像其他城市一样在模板中实现该控制器。\n\
