  \n你已经学会了如何使用 JavaScript 向网页添加几种类型的对话框。问题在于内置对话框的功能极其有限。你可以打开一个新的弹出窗口以获得更多控制，但弹出窗口本身也有问题，最大的问题是用户讨厌它们，通常会在浏览器中禁用它们。\n\
  \n更好的选择是使用 jQuery 和 JavaScript 创建自己的对话框元素。实现对话框需要两样东西：一个`overlay`元素，用于遮住网页背后发生的一切；以及一个`dialog`组件，提供对话框交互。\n\
  \n`overlay`需要具有比下方主网页元素更高的`z-index`。`overlay`还应该有一定透明度，以便用户能看到背景中的网页，但无法点击`overlay`下方的任何网页元素。\n\
  \n`dialog`需要具有比`overlay`更高的`z-index`，以便在显示`overlay`时可见。`dialog`还需要有关闭方式，使`dialog`和`overlay`元素隐藏。你可以在`dialog`中包含任何其他你希望提供用户交互的内容。\n\
  \n`dialog`和`overlay`需要处于固定位置，并且初始时隐藏。当你想显示`dialog`时，取消隐藏`overlay`和`dialog`，然后在显示完`dialog`后隐藏它们。下一节将带你完成这个过程。\n\
  \n* * *\n\n#### 自己动手：使用 jQuery 和 JavaScript 中的覆盖层添加动态对话框\n\n本练习的目的是让你能够实现自己的自定义对话框，并使用覆盖层遮住网页的其余部分。示例代码见清单\
  \ 14.10、14.11 和 14.12。\n\n按照以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，创建`lesson14/dynamic_dialog.html`、`lesson14/js/dynamic_dialog.js`和`lesson14/css/dynamic_dialog.css`文件。\n\
  \n**2.** 将清单 14.10 和清单 14.12 中的代码添加到 HTML 和 CSS 文件中。HTML 代码实现了一个基本网页，但有两个例外。注意`overlay`和`dialog\
  \ <div>`元素。这些元素不属于主网页，将用于仅使用 jQuery 和 JavaScript 模拟弹出对话框。\n\n**3.** 打开`dynamic_dialog.js`文件，添加以下`.ready()`函数，该函数隐藏`overlay`和`dialog\
  \ <div>`元素，然后添加一个点击处理程序来显示它们，以及另一个点击处理程序来更新网页并隐藏对话框：\n\n点击此处查看代码图片\n\n```\n13 $(document).ready(function(){\n\
  14   $(\"#overlay, #dialog\").hide();\n15   $(\"span\").click(function(){\n16  \
  \   $(\"#overlay, #dialog\").show(); });\n17   $(\"#updateB\").click(update);\n\
  18 });\n```\n\n**4.** 添加以下`click`处理程序`update()`，该函数根据在`dialog <div>`中获取的信息更新网页的值。这说明了对话框与网页其余部分之间的交互：\n\
