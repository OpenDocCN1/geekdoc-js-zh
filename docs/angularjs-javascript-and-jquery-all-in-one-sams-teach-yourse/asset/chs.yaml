  +e.target.id);\n19     cb.dispatchEvent(event);\n20 }\n```\n\n* * *\n\n**清单 9.9\
  \ manual_event.css CSS 代码，为 <span> 元素设置样式**\n\n* * *\n\n```\n01 span{\n02   border-radius:5px;\n\
  03   margin:3px;\n04   padding:5px;\n05   background-color:#C0C0C0;\n06   border:3px\
  \ ridge;\n07   display:inline-block;\n08   cursor:pointer;\n09 }\n```\n\n* * *\n\
  \n* * *\n\n#### 使用 jQuery 手动触发事件\n\n现在你已经了解了如何从 JavaScript 触发事件，接下来你将发现，如果能够使用 jQuery，它会让你的工作变得多么轻松。jQuery\
  \ 也支持两种手动触发事件的方法。\n\n与 JavaScript 类似，jQuery 对象也拥有与许多事件类型对应的方法，你可以直接调用这些方法。例如，大多数元素都有\
  \ `click()` 和 `dblclick()` 方法。表单元素还额外提供了 `blur()`、`focus()`、`keypress()`、`keydown()`\
  \ 和 `keyup()` 等方法，可用于触发特定事件。例如，以下语句会触发所有 `<span>` 元素的 `click` 事件：\n\n`$(\"span\"\
  ).click();`\n\njQuery 还提供了一种通过 `trigger()` 方法触发事件并指定事件对象值的方式。`trigger()` 方法有两种不同的语法，如下所示：\n\
  \n点击此处查看代码图片\n\n`trigger(eventType [, extraParameters])`\n\n`trigger( eventObject)`\n\
  \n以下是使用第一种方法触发所有 `class=\"checkbox\"` 元素的 `click` 事件的示例：\n\n点击此处查看代码图片\n\n`$(\"\
  .checkbox\").trigger(\"click\");`\n\n以下是使用第二种方法作用于所有 `class=\"bigText\"` 的输入项的示例。该方法为\
  \ `keypress` 事件传入一个简单的事件对象，并将事件对象的 `charCode` 属性设置为 13（即回车键）：\n\n点击此处查看代码图片\n\n\
  `$(\"input.bigText\").trigger({'type':'keypress', 'charCode':13});`\n\n注意，这比 JavaScript\
  \ 方法简单得多，因为 `trigger()` 接受一个简单的对象，其中包含适当的属性名称，用于设置你希望传入事件对象的任何值。偶尔你可能不得不使用 JavaScript\
  \ 方法，但应尽可能使用 jQuery。\n\n* * *\n\n动手实践：在 jQuery 中手动触发事件\n\n在本例中，你将逐步学习如何使用 `<span>`\
  \ 元素的事件处理器来触发文本 `<input>` 元素上的 `keypress` 事件。结果是，点击 `<span>` 将触发与 `<input>` 元素中按键相同的处理器。按照以下步骤创建清单\
  \ 9.10、9.11 和 9.12 中所示的文件：\n\n**1.** 在 Eclipse 中，创建 `lesson09/card_suits.html`、`lesson09/js/card_suits.js`\
  \ 和 `lesson09/css/card_suits.css` 文件。\n\n**2.** 将清单 9.10 中的代码添加到 HTML 文件中。这是一个基本的\
  \ HTML 文件，加载了额外的 jQuery、JavaScript 和 CSS 文件。其中包含一个 `<p>` 元素、一个 `<input>` 元素以及一系列充当按钮的\
  \ `<span>` 元素。\n\n**3.** 将清单 9.12 中的 CSS 添加到 CSS 文件中。这段代码将 `<span>` 元素样式化为按钮，并将\
  \ `<p>` 元素样式化为提供良好的格式。\n\n**4.** 打开 `card_suits.js` 文件，添加以下 `ready()` 初始化函数，该函数为\
  \ `<input>` 元素附加一个 `keypress` 事件处理器，并为所有 `<span>` 元素附加一个 `click` 处理器：\n\n点击此处查看代码图片\n\
  \n```\n09 $(document).ready(function(){\n10   $(\"input\").keypress(function (e){inputHandler(e)});\n\
  11   $(\"span\").click(function (e){spanHandler(e)});\n12 });\n```\n\n**5.** 创建\
  \ `inputHandler()` 处理器函数，该函数从事件对象中获取 `charCode`，并将字符串形式追加到 `<p>` 元素中。此时，当你在文本 `<input>`\
  \ 中键入内容时，它也会显示在 `<p>` 元素中：\n\n点击此处查看代码图片\n\n```\n01 function inputHandler(e){\n\
  02   var chr = String.fromCharCode(e.charCode);\n03   $(\"p\").append(chr);\n04\
  \ }\n```\n\n**6.** 添加以下 `spanHandler()` 处理器函数，该函数获取 `<span>` 元素的 `innerHTML`，并将第一个字符转换为代码。第\
  \ 7 行随后在 `<input>` 元素上触发一个 `keypress` 事件，将按钮的字符代码作为 `charCode` 值传入。这样用户就可以点击按钮，并利用文本\
  \ `<input>` 的事件处理器应用纸牌符号：\n\n点击此处查看代码图片\n\n```\n05 function spanHandler(e){\n06\
  \   var chrCode = e.target.innerHTML.charCodeAt(0);\n07   $(\"input\").trigger({'type':'keypress',\
  \ 'charCode':chrCode});\n08 }\n```\n\n**7.** 保存所有三个文件，然后在网页浏览器中打开 HTML 文档，如图 9.5\
  \ 所示。在输入框中键入一些文本，并点击 `<span>` 元素，注意结果是一样的。\n\n![Image](img/image00897.jpeg)\n\n\
  **图 9.5** 一个简单的网页，通过 `<span>` 元素的事件处理器触发 `<input>` 元素的 `keypress` 事件。\n\n\n\n\n\n\
  ## 清单 9.10 card_suits.html HTML 文件，加载 CSS 和 JavaScript，并定义 `<p>`、文本 `<input>` 和\
  \ `<span>` 元素\n\n[点击此处查看代码图片]\n\n* * *\n\n```html\n01 <!DOCTYPE html>\n02 <html>\n\
