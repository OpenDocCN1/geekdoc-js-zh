  31       $scope.$emit('CharacterDeleted', $scope.currentName);\n32     };\n33  \
  \ });\n```\n\n**7.** 清单 26.4 中的 AngularJS 模板代码实现了嵌套的 `ng-controller` 语句，这些语句生成了作用域层次结构并显示角色的作用域值。此代码还包含一些非常基本的\
  \ CSS 样式，使 span 看起来像按钮，并将元素定位在页面上。\n\n**8.** 在浏览器中加载 `scope_events.html` 文件。图 26.2\
  \ 显示了生成的网页。当您单击角色名称时，会显示该角色的信息，当您单击“删除”按钮时，该角色会从按钮和信息部分中删除。\n\n![图片](img/image01035.jpeg)\n\
  \n**图 26.2** 使用 `$broadcast()` 和 `$emit()` 通过作用域层次结构发送更改和删除事件。\n\n#### 清单 26.3 scope_events.js\
  \ 在作用域层次结构中实现 $emit() 和 $broadcast() 事件\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 angular.module('myApp',\
  \ []).\n02   controller('Characters', function($scope) {\n03     $scope.names =\
  \ ['Frodo', 'Aragorn', 'Legolas', 'Gimli'];\n04     $scope.currentName = $scope.names[0];\n\
  05     $scope.changeName = function() {\n```\n\n\n\n\n\n```javascript\n06      \
  \ $scope.currentName = this.name;\n\n07       $scope.$broadcast('CharacterChanged',\
