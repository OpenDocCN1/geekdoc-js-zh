  \n* * *\n\n### 总结\n\nAngularJS 提供了许多工具，通过使用带有内置和自定义指令的模板来扩展 HTML 的能力。在本课中，您看到了多种以简单而结构化的方式在网页中实现丰富交互元素的方法。\n\
  \n在本课中，您还了解了几种自定义指令。选项卡面板和可展开/折叠示例展示了实现相互嵌套并相互交互的指令的方法。拖放示例向您展示了一种与 HTML5 拖放事件交互的方式，以及如何在控制器和自定义指令之间共享作用域。星级评分示例向您展示了如何仅使用\
  \ AngularJS 作用域、控制器和模板来构建交互性。缩放视图字段示例向您展示了如何将 HTML `<img>` 元素的概念扩展为一个包含额外缩放元素的元素，该元素与图片中的鼠标点击进行交互。\n\
  \n本书到此结束。我们希望您和我们一样喜欢学习 AngularJS、jQuery 和 JavaScript。我们热爱这些技术，因为它们让您能够轻松创建出色、动态且高度交互的网页和\
  \ Web 应用程序。这些技术是强大的工具，因为它们让您能够快速高效地创建结构良好、可重用的代码。阅读本书后，您应该对 JavaScript、jQuery 和\
  \ AngularJS 框架有了很好的理解，从而有信心投入并编写自己的 Web 应用程序。祝您编码愉快！\n\n### 问答\n\n**问.** 学习 AngularJS\
  \ 额外功能的好来源在哪里？\n\n**答.** 最好且最新的来源是 AngularJS 网站 [angularjs.org](http://angularjs.org)。对于简单的内容，您可以查看\
  \ [w3schools.com](http://w3schools.com) 提供的内容。\n\n### 实践\n\n实践部分包含一组问题和答案，旨在巩固您对本课时所学内容的理解。请先尝试回答问题，然后再查看答案。\n\
  \n#### 测验\n\n**1.** 您可以使用哪个 AngularJS 指令来隐藏或显示元素？\n\n**2.** 哪个 AngularJS 指令用于标记在使用了嵌入（transclusion）的指令中嵌入\
  \ DOM 元素的插入点？\n\n**3.** 在自定义指令定义中，`template` 和 `templateUrl` 有什么区别？\n\n#### 测验答案\n\
  \n**1.** `ng-show`\n\n**2.** `ng-transclude`\n\n**3.** `template` 设置包含实际的 HTML 片段，而\
  \ `templateUrl` 设置包含指令要使用的模板的 URL 路径。\n\n#### 练习\n\n**1.** 修改清单 29.1、29.2、29.3 和\
  \ 29.4 中的代码，添加一些包含不同内容的额外选项卡。\n\n**2.** 修改清单 29.7、29.8 和 29.9 中的代码，使其在自定义缩放区域中同时显示鼠标的当前页面坐标。\n\
