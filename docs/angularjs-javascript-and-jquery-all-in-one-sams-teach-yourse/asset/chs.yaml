  \ #FFFFFF);\n10   border:3px ridge white; box-shadow: 5px 5px 5px #888888;\n11 \
  \  padding:3px; cursor:pointer; }\n```\n\n***\n\n***\n\n#### 使用 jQuery UI 定位 UI\
  \ 元素\n\njQuery UI 提供的一大优势是能够相对于其他元素定位元素并处理碰撞。这是通过扩展 `.position()` 方法来实现的，该方法允许传入一个选项对象，用于定义\
  \ jQuery 元素与其他元素或事件位置之间的相对位置。\n\n例如，要将元素 `#div1` 定位到 `#div2` 的右侧，可以使用以下代码：\n\n点击此处查看代码图片\n\
  \n```\n$(\"#div1\").position(\"my:\"left\", at:\"right\", of:\"#div2\");\n```\n\n\
  非常简单。表 16.1 描述了 jQuery UI 为 `.position()` 方法提供的选项。\n\n![Image](img/image00950.jpeg)![Image](img/image00951.jpeg)\n\
  \n**表 16.1 使用 jQuery UI .position() 定位元素时的选项设置**\n\n***\n\n动手实践：使用 jQuery UI 在网页上定位图片\n\
  \n帮助您理解 jQuery UI 定位的最佳方式是让您亲自动手实践。在本例中，您将使用 jQuery UI 的 position 方法定位静态图片元素以及一个随鼠标移动的动态图片元素。您还将添加一些碰撞保护，以防止图片离开\
  \ `<div>` 元素。\n\n该示例的代码位于清单 16.5、16.6 和 16.7 中。请按照以下步骤创建动态网页：\n\n1. 在 Eclipse 中，创建\
  \ `lesson16/dynamic_positioning.html`、`lesson16/js/dynamic_positioning.js` 和 `lesson16/css/dynamic_positioning.css`\
  \ 文件。\n\n2. 将清单 16.5 和清单 16.7 中的代码添加到 HTML 和 CSS 文件中。\n\n3. 打开 `dynamic_positioning.js`\
  \ 文件并添加一个 `.load()`。\n\n4. 在 `.load()` 函数内部，添加以下代码行，将 `#img2` 定位到 `#img1` 的右下角，并将\
  \ `#img3` 定位到 `#img2` 的右下角：\n\n点击此处查看代码图片\n\n```\n02   $(\"#img2\").position(\n\
  03       {my:\"left top\", at:\"right bottom\", of:\"#img1\"});\n04   $(\"#img3\"\
  ).position(\n05       {my:\"left top\", at:\"right bottom\", of:\"#img2\"});\n```\n\
  \n5. 添加以下 `mousemove` 事件处理程序，使 `#img3` 随鼠标移动而重新定位。注意，`collision` 被设置为 `\"flip\"\
  `，并且指定了 `within` 为 `<div>` 元素，这样图片就不会被重新定位到外部：\n\n点击此处查看代码图片\n\n```\n06   $(\"div\"\
  ).mousemove(function(e) {\n07     $(\"#img4\").position({ my:\"left top\", at:\"\
  center\", of:e,\n08                           collision:\"flip\", within:\"div\"\
  \ });\n09   })\n```\n\n6. 保存所有三个文件，然后在 Web 浏览器中打开 HTML 文档，如图 16.5 所示。您应该会看到页面上放置了三张图片，第四张图片会随着鼠标光标移动而跟踪。\n\
