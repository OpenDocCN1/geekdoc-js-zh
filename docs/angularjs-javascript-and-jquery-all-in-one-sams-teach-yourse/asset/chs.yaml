  \ 14 行定义的`menuselect`事件处理程序。此外，菜单的宽度在第 20 行的 CSS 代码中通过设置`.ui-menu`类的`width`值来定义。视觉效果见图\
  \ 19.6。\n\n![Image](img/image00982.jpeg)\n\n**图 19.6** 样式化的 jQuery 菜单。\n\n**清单 19.6**\
