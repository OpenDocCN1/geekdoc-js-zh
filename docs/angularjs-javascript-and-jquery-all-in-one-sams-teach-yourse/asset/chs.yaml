  \ 为动态设计准备 CSS 样式\n\nAngularJS、jQuery 和 JavaScript 最酷的功能之一是能够动态调整 CSS 样式。在本书稍后的部分，你将学习如何实现这一点以创建一些炫酷的效果。在本节中，趁你对\
  \ CSS 还记忆犹新，我们将介绍为动态样式做准备的概念。\n\n\n\n\n\n在定义 CSS 样式规则时，请记住有几种方法可以动态应用样式。你可以设计 CSS，使得动态代码的实现更加简单。以下各节将介绍你之后会学到的一些方法。\n\
  \n#### 准备动态地向 HTML 元素添加类\n\n动态调整 HTML 元素样式的最简单方法是更改与该元素关联的 CSS 规则。更改 CSS 规则最简便的方式是为你想要使用的不同规则使用\
  \ `class` 选择器。这样，通过 AngularJS、jQuery 和 JavaScript，你可以添加一个 `class` 来应用样式，或移除一个 `class`\
  \ 来删除样式。\n\n这带来了两个主要优势。首先，动态代码更加简单，因为添加和移除类很容易。其次，调整将要应用的 CSS 样式也很容易，因为这些调整将在 `.css`\
  \ 文件或 `<style>` 标签内完成。\n\n使用动态类规则要求类选择器的规则在网页加载的 CSS 代码中某处完全定义。同时还需要思考如何实现每条 CSS\
  \ 规则。\n\n例如，考虑为一个被样式化为按钮的 `<span>` 元素添加动态交互。你希望该按钮能够有四种不同状态：抬起、按下、非活跃和状态变化。你可以为这些按钮状态的类创建不同的\
  \ CSS 规则选择器。当按钮处于抬起状态时，分配给 `<span>` 的 `class` 属性为 up；当用户点击按钮时，你可以将 `class` 改为 state\
  \ changing；当鼠标释放时，再将 `class` 改为 down。\n\n#### 准备直接调整 CSS 属性\n\n你也可以通过 AngularJS、jQuery\
  \ 和 JavaScript 直接访问并修改一个或一组元素的特定 CSS 属性。这样做的好处是，你可以在 `.css` 文件或 `<style>` 标签中创建静态\
  \ CSS 定义，然后动态更改部分属性值。\n\n将 JavaScript 与 CSS 属性值结合使用的一个绝佳示例是在网页上移动元素。例如，假设你为一个滚动横幅定义了一个\
  \ HTML 图片元素，该横幅应在屏幕上水平滚动。你可以定义静态 CSS 样式，将横幅定位在浏览器窗口中的固定位置。然后，由于 CSS 已经定义了渲染固定横幅所需的所有属性，你只需通过\
  \ AngularJS、jQuery 和 JavaScript 调整 CSS 位置属性来滚动横幅即可。\n\n### 总结\n\n本课讨论了如何使用 CSS 快速轻松地改变网页的外观和感觉。理解这些概念对于实现\
  \ JavaScript、jQuery 和 AngularJS 以创建动态网页和富互联网应用至关重要。\n\n你学习了 CSS 规则的结构，以及如何定义选择器以将\
  \ CSS 规则应用于特定的 HTML 元素集。你还了解了一些常见的 CSS 设计和布局样式。\n\n你学习了如何设置文本样式、应用颜色和背景图像，以及在 HTML\
  \ 元素周围创建酷炫的边框。你还学习了如何理解并控制页面上 HTML 元素的流动，以及如何应用固定定位。\n\n### 问答\n\n**Q.** 对于 HTML\
  \ 元素，使用固定尺寸和位置更好，还是应该尽量根据内容尺寸更多地使用 HTML 流式布局？\n\n**A.** 这是一个棘手的问题。对于大多数网页，建议尽量使用流式布局，并在元素内部采用相对定位。原因在于，浏览网页的显示器尺寸差异很大。如果你需要支持从移动设备到\
  \ 36 英寸显示器的各种屏幕，流式布局能让内容更容易适应浏览器大小。然而，如果你设计的动态网页更像一个 Web 应用，则可以使用更多固定尺寸来支持平均尺寸的显示器，然后利用本书后面学到的\
  \ jQuery Mobile 技术实现移动版本。\n\n**Q.** 为什么还要费心使用 CSS？难道不能直接从 jQuery 和 JavaScript 应用\
  \ CSS 样式吗？\n\n**A.** 当然可以，CSS 能做的所有事情都可以通过 JavaScript 实现。但是，维护这些更改会更困难，尤其是在多人参与设计的情况下。通常，一些最优秀的网页设计师可能完全不懂\
  \ jQuery 或 JavaScript。另外，想想维护多个版本的 CSS 文件并对其进行调整以应用不同皮肤是多么容易。\n\n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，再查看答案。\n\
