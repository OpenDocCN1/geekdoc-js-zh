  \ 对象提供了对浏览器系统当前时间的访问。这在很多方面都很有用，例如在页面上显示时间、通过 AJAX 与服务器比较时间、计时某些事件等。\n\n要获取系统当前时间，请使用以下语法：\n\
  \n```\nvar cDate = new Date();\ndocument.write(cDate);\n```\n\n日期的字符串版本将类似于以下内容：\n\
  \n点击此处查看代码图片\n\n```\nMon Dec 10 2012 17:30:27 GMT-0700 (Mountain Standard Time)\n\
  ```\n\n您可以使用字符串或基于以下语法的一组值来创建 `Date` 对象：\n\n点击此处查看代码图片\n\n```\nDate(year, month,\
  \ day, lessons, minutes, seconds, milliseconds)\n```\n\n例如，以下代码将创建相同的 `Date` 对象：\n\
  \n点击此处查看代码图片\n\n```\nvar d1 = Date(\"2012, 12, 12, 12, 12, 12, 00\");\nvar d2 =\
  \ Date(\"December 12, 2012 12:12:12\");\n```\n\nJavaScript 允许您使用常规逻辑比较（`<`、`>`、`==`\
  \ 等）来比较日期。例如，您可以使用以下代码将浏览器上的当前时间与服务器发送的时间戳“December 12, 2012 12:12:12”进行比较：\n\n\
  点击此处查看代码图片\n\n```\nvar currentTime = new Date();\nvar serverTime = new Date(\"December\
  \ 12, 2012 12:12:12\");\nif (currentTime>serverTime){\n    alert(\"Mayans Wrong?\"\
  );\n}\n```\n\n#### Math\n\n`Math` 对象实际上是一个数学库的接口，提供了大量节省时间的功能。数学库内容太多，无法在本书中一一介绍，但表\
  \ 6.6 向您介绍了一些更有用的函数。\n\n![图片](img/image00862.jpeg)\n\n**表 6.6** 在 JavaScript 中使用\
  \ Math 对象\n\n#### RegExp\n\n在动态处理用户输入甚至从 Web 服务器返回的数据时，正则表达式是一个重要的工具。正则表达式允许您快速匹配文本中的模式，然后对这些模式进行操作。\n\
  \nJavaScript 允许您创建一个 `RegExp` 对象，用于使用以下语法匹配字符串中的模式：\n\n点击此处查看代码图片\n\n```\nvar re\
  \ = new RegExp(pattern,modifiers);\n```\n\n或者更简单地：\n\n```\nvar re =/pattern/modifiers;\n\
  ```\n\n`pattern` 是标准的正则表达式模式，`modifiers` 定义了应用表达式的范围。以下是 JavaScript 中可用的修饰符列表：\n\
  \n![图片](img/image00767.jpeg) i——执行不区分大小写的匹配。\n\n![图片](img/image00767.jpeg) g——对所有实例执行全局匹配，而不仅仅是第一个。\n\
  \n![图片](img/image00767.jpeg) m——执行多行匹配，而不是在第一个 `LF/CR` 字符处停止。\n\n以下示例展示了如何使用正则表达式与字符串的\
  \ `replace()` 函数进行不区分大小写的搜索“yourself”并将其替换为“Your Friends”：\n\n点击此处查看代码图片\n\n```\n\
  var myStr = \"Teach Yourself jQuery & JavaScript in 24 Lessons\";\nvar re = /yourself/i;\n\
  var newStr = myStr.replace(re, \"Your Friends\");\n```\n\n`newStr` 的值：\n\n点击此处查看代码图片\n\
  \n```\nTeach Your Friends jQuery & JavaScript in 24 Lesson\n```\n\n如果您不熟悉正则表达式，建议进行一些研究。有一些关于该主题的好书以及网络上的多个资源。\n\
  \n### 创建自定义对象\n\n到目前为止，您已经看到使用内置 JavaScript 对象有几个优点。当您开始编写使用越来越多数据的代码时，您会发现希望构建自己的自定义对象，并具有特定的属性和方法。以下各节将带您完成构建自定义\
  \ JavaScript 对象的过程。\n\n#### 定义 JavaScript 对象\n\nJavaScript 对象可以通过几种方式定义。最简单的是即时方法，即创建一个通用对象，然后根据需要向其中添加属性。\n\
  \n例如，要创建一个用户对象并分配名字和姓氏，请使用以下代码：\n\n```\nvar user = new Object();\nuser.first=\"\
  Brad\";\nuser.last=\"Dayley\";\n```\n\n您还可以通过直接赋值实现相同的效果，使用以下语法，其中对象包含在 `{}` 大括号中，属性使用\
  \ `property:value` 语法定义，如下所示：\n\n点击此处查看代码图片\n\n```\nvar user = {'first':'Brad','last':'Dayley'};\n\
  ```\n\n\n\n\n\n前两种方法对于不需要重复使用的简单对象非常有效。更好的方法是将对象封装在自身的函数块内。这样做的好处是，你可以将与对象相关的所有代码都保留在对象自身的作用域内。例如：\n\
  \n点击此处查看代码图片\n\n```\nfunction User(first, last){\n\n  this.first = first;\n\n  this.last\
  \ = last;\n\n}\n\nvar user = new User(\"Brad\", \"Dayley\");\n```\n\n这些方法的最终结果本质上是相同的。你得到一个对象，其属性可以使用点语法进行引用，如下所示：\n\
  \n点击此处查看代码图片\n\n```\ndocument.write(user.first + \" \" + user.last);\n```\n\n####\
  \ 向 JavaScript 对象添加方法\n\n如果存在特定于自定义对象的代码，你希望将这些代码作为方法附加到对象本身。根据对象的创建方式，有几种方法可以实现这一点。\n\
  \n第一种方法是定义一个静态函数，然后将其分配为对象的属性。以下是在动态定义对象时分配静态函数的示例：\n\n点击此处查看代码图片\n\n```\nvar user\
  \ = new Object();\n\nuser.first=\"Brad\";\n\nuser.last=\"Dayley\";\n\nuser.getFullName\
  \ = makeFullName;\n\nvar user2 = {'first':'Brad', 'last':'Dayley',\n\n         \
  \    'getFullName':makeFullName};\n\nfunction makeFullName(){\n\n  return this.first\
  \ + \" \" + this.last;\n\n}\n\ndocument.write(user.getFullName());\n```\n\n函数 `makeFullName()`\
  \ 将对象的 `first` 和 `last` 属性合并并以字符串形式返回。注意，该函数使用 `this` 关键字访问属性。`this` 指向对象的当前实例。还要注意，将\
  \ `makeFullName()` 赋值给 `getFullName` 时省略了 `()` 括号；这会将 `user.getFullName` 设置为函数本身，而不是其返回的值。\n\
  \n如果你使用更好的封装方法创建对象，则可以使用以下语法在对象内部定义函数。注意，`getFullName` 被设置为一个新定义的函数，该函数以与静态函数 `makeFullName()`\
  \ 相同的方式返回值：\n\n点击此处查看代码图片\n\n```\nfunction User(first, last){\n\n  this.first =\
  \ first;\n\n  this.last = last;\n\n  this.getFullName = function(){\n\n      return\
  \ this.first + \" \" + this.last;\n\n    };\n\n}\n```\n\n#### 使用原型对象模式\n\n创建对象的更高级方法是使用原型模式。原型模式是通过在对象的\
  \ `prototype` 属性中定义函数来实现的，而不是在对象本身中定义。原型模式更好的原因是，在 `prototype` 中定义的函数只在 JavaScript\
  \ 加载时创建一次，而不是每次创建新对象时都创建。\n\n以下示例展示了实现原型模式所需的代码。注意，你定义了对象 `UserP`，然后将 `UserP.prototype`\
  \ 设置为包含 `getFullName()` 函数。你可以在 `prototype` 中包含任意数量的函数。每次创建新对象时，这些函数都将可用：\n\n点击此处查看代码图片\n\
  \n```\nfunction UserP(first, last){\n\n  this.first = first;\n\n  this.last = last;\n\
  \n}\n\nUserP.prototype = {\n\n  getFullName: function(){\n\n      return this.first\
  \ + \" \" + this.last;\n\n    }\n\n};\n```\n\n要调用 `getFullName()` 函数，你可以使用类似以下代码：\n\
  \n点击此处查看代码图片\n\n```\nvar me = UserP(\"Brad\", \"Dayley\");\n\nvar myFullName = me.getFullName();\n\
  ```\n\n* * *\n\n### 动手实践：创建和使用自定义对象\n\n在本节中，你将使用原型模式创建并使用一个自定义 JavaScript 对象数组。按照以下步骤构建\
