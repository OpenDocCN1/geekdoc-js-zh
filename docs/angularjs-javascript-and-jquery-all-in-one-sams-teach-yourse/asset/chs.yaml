  18   </body>\n19 </html>\n```\n\n* * *\n\n* * *\n\n### 理解 JavaScript 语法\n\n与其他计算机语言一样，JavaScript\
  \ 基于严格的语法，其中特定的单词在浏览器解释脚本时具有不同的含义。本节旨在引导你了解创建变量、处理数据类型以及在 JavaScript 中使用循环和函数来操作网页的基础知识。\n\
  \n* * *\n\n**提示**\n\n对于本课中的简单 JavaScript 示例，你可以通过在控制台提示符下使用 `node` 命令启动 Node.js\
  \ 来调出 Node.js 解释器，从而进行测试。在解释器中，你可以输入 JavaScript 代码，并在输入每一行时执行它。\n\n* * *\n\n####\
  \ 创建变量\n\nJavaScript 的起点是变量。变量是一种为数据命名的方式，这样你就可以使用该名称临时存储和访问 JavaScript 文件中的数据。变量可以指向简单数据类型，例如数字或字符串，也可以指向更复杂的数据类型，例如对象。\n\
  \n要在 JavaScript 中定义变量，必须使用 `var` 关键字，然后为变量指定一个名称；例如：\n\n```\nvar myData;\n```\n\n\
  你也可以在同一行中为变量赋值。例如，以下代码行创建了一个变量 `myString`，并将其赋值为“Some Text”：\n\n```\nvar myString\
  \ = \"Some Text\";\n```\n\n这与以下代码效果相同：\n\n```\nvar myString;\nmyString = \"Some\
  \ Text\";\n```\n\n声明变量后，你可以使用该名称给变量赋值并访问变量的值。例如，以下代码将一个字符串存储到 `myString` 变量中，然后在给\
  \ `newString` 变量赋值时使用它：\n\nClick here to view code image\n\n```\nvar myString =\
  \ \"Some Text\";\nvar newString = myString + \" Some More Text\";\n```\n\n你的变量名应该描述其中存储的数据，以便在程序后期易于使用。创建变量名的唯一规则是必须以字母、`$`\
  \ 或 `_` 开头，并且不能包含空格。还要记住变量名区分大小写，因此 `myString` 与 `MyString` 是不同的。\n\n#### 理解 JavaScript\
  \ 数据类型\n\nJavaScript 使用数据类型来确定如何处理分配给变量的数据。变量类型将决定你可以对变量执行哪些操作，例如循环或执行。以下列表描述了本书中将使用的最常见的变量类型：\n\
  \n![Image](img/image00767.jpeg) **字符串**——将字符数据存储为字符串。字符数据由单引号或双引号指定。引号中包含的所有数据都将分配给字符串变量。例如：\n\
  \nClick here to view code image\n\n```\nvar myString = 'Some Text';\nvar anotherString\
  \ = \"Some Other Text\";\n```\n\n![Image](img/image00767.jpeg) **数字**——将数据存储为数值。数字在计数、计算和比较中很有用。示例如下：\n\
  \n```\nvar myInteger = 1;\nvar cost = 1.33;\n```\n\n![Image](img/image00767.jpeg)\
  \ **布尔值**——存储一个位，值为 true 或 false。布尔值通常用于标志。例如，你可以在某些代码的开头将变量设置为 false，然后在完成时检查它，以查看代码执行是否到达了某个位置。以下展示了定义\
  \ true 和 false 变量的示例：\n\n```\nvar yes = true;\nvar no = false;\n```\n\n![Image](img/image00767.jpeg)\
  \ **数组**——索引数组是一系列独立的不同数据项，全部存储在一个变量名下。数组中的项可以通过基于零的索引使用 `[index]` 来访问。以下是创建简单数组然后访问第一个元素（索引为\
  \ 0）的示例：\n\nClick here to view code image\n\n```\nvar arr = [\"one\", \"two\", \"\
  three\"]\nvar first = arr[0];\n```\n\n![Image](img/image00767.jpeg) **关联数组/对象**——JavaScript\
  \ 确实支持关联数组的概念，即通过名称而不是索引值来访问数组中的项。然而，更好的方法是使用对象字面量。当你使用对象字面量时，可以使用 `object.property`\
  \ 语法访问对象中的项。以下示例展示了如何创建和访问对象字面量：\n\nClick here to view code image\n\n```\nvar obj\
  \ = {\"name\":\"Brad\", \"occupation\":\"Hacker\", \"age\", \"Unknown\"};\n```\n\
  \n\n\n\n\n```\nvar name = obj.name;\n```\n\n![Image](img/image00767.jpeg) Null——有时，你没有一个值可以存入变量，可能是因为它尚未创建，或者你不再使用它。此时，你可以将变量设置为\
  \ `null`。这样，你可以在代码中检查变量的值，并且仅当它不为 `null` 时才使用它：\n\n```\nvar newVar = null;\n```\n\
  \n---\n\n> **注意：** JavaScript 是一种无类型语言，这意味着你不需要告诉浏览器变量的数据类型；解释器会自动确定变量的正确数据类型。\n\
  \n---\n\n#### 使用运算符\n\nJavaScript 运算符提供了修改变量值的能力。你已经熟悉 `=` 运算符，因为你在本书中已经多次使用它。JavaScript\
  \ 提供了多种运算符，可以分为两类——算术运算符和赋值运算符。\n\n##### 算术运算符\n\n算术运算符用于在变量和直接值之间执行运算。表 5.1 列出了算术运算及其应用后的结果。\n\
  \n![Image](img/image00848.jpeg)\n\n**表 5.1 展示 JavaScript 的算术运算符以及基于 y=4 开始的结果**\n\
  \n---\n\n> **提示：** `+` 运算符也可以用于将字符串或字符串与数字相加。这使你能够快速拼接字符串，并将数值数据添加到输出字符串中。表 5.1\
  \ 显示，当数值和字符串值相加时，数值会被转换为字符串，然后两个字符串被拼接在一起。\n\n---\n\n##### 赋值运算符\n\n赋值运算符用于给变量赋值。你可能已经习惯了\
  \ `=` 运算符，但还有几种形式允许你在赋值时操作数据。表 5.2 列出了赋值运算及其应用后的结果。\n\n![Image](img/image00849.jpeg)\n\
  \n**表 5.2 展示 JavaScript 的赋值运算符以及基于 x=10 开始的结果**\n\n#### 应用比较运算符和条件运算符\n\n条件语句是一种将逻辑应用于应用程序的方式，使得只有在正确条件下才会执行特定代码。这是通过对变量值应用比较逻辑来实现的。以下部分描述了\
  \ JavaScript 中可用的比较方式以及如何在条件语句中应用它们。\n\n##### 比较运算符\n\n比较运算符评估两个数据，如果评估正确则返回 true，如果评估不正确则返回\
  \ false。比较运算符将运算符左侧的值与右侧的值进行比较。\n\n帮助你理解比较的最简单方法是提供一个包含一些示例的列表。表 5.3 列出了比较运算符及其一些示例。\n\
  \n![Image](img/image00850.jpeg)\n\n**表 5.3 展示 JavaScript 的比较运算符以及基于 x=10 开始的结果**\n\
  \n你可以使用逻辑运算符将多个比较链接在一起。表 5.4 列出了逻辑运算符以及如何使用它们将比较链接在一起。\n\n![Image](img/image00851.jpeg)\n\
  \n**表 5.4 展示 JavaScript 的比较运算符以及基于 x=10 和 y=5 开始的结果**\n\n##### If\n\n`if` 语句允许你根据比较的评估结果来分离代码执行。语法如下所示，条件运算符放在\
  \ `()` 括号中，如果条件评估为 true 则执行的代码放在 `{}` 大括号中：\n\n```\nif(x==5){\n\n  do_something();\n\
  \n}\n```\n\n除了仅在 `if` 语句块内执行代码外，你还可以指定一个 `else` 块，该块仅在条件为 false 时执行。例如：\n\n```\n\
  if(x==5){\n\n  do_something();\n\n} else {\n\n  do_something_else();\n\n}\n```\n\
  \n你还可以将 `if` 语句链接在一起。为此，添加一个条件语句以及一个 `else` 语句。例如：\n\n```\nif(x<5){\n\n  do_something();\n\
  \n} else if(x<10) {\n\n  do_something_else();\n\n} else {\n\n  do_nothing();\n\n\
  }\n```\n\n##### switch\n\n另一种条件逻辑是 `switch` 语句。`switch` 语句允许你只评估一次表达式，然后根据该值执行多个代码段中的一个。\n\
  \n`switch` 语句的语法如下：\n\n```\nswitch(expression){\n\n  case value:\n\n    <要执行的代码>\n\
  \n    break;\n\n  case value2:\n\n    <要执行的代码>\n\n    break;\n\n  default:\n\n    <如果既不是\
  \ value 也不是 value2 则执行的代码>\n\n}\n```\n\n这是它的工作原理。`switch` 语句会完整评估表达式并得到一个值。该值可以是字符串、数字、布尔值，甚至是对象。然后将\
  \ `switch` 的值与每个 `case` 语句指定的值进行比较。如果值匹配，则执行 `case` 语句中的代码。如果没有值匹配，则执行 `default`\
  \ 代码。\n\n---\n\n> **注意：** 通常，每个 `case` 语句末尾会包含一个 `break` 命令，以表示跳出 `switch` 语句。如果没有找到\
  \ `break`，代码执行将继续到下一个 `case` 语句。\n\n---\n\n---\n\n#### 自己动手：在 JavaScript 中应用 If\
  \ 条件逻辑\n\n为了帮助你巩固使用 JavaScript 条件逻辑，请按照以下步骤将条件逻辑构建到动态网页的 JavaScript 中。HTML 文档的最终版本如清单\
  \ 5.3 所示：\n\n1. 在 `lesson05` 文件夹中创建一个名为 `if_logic.html` 的源文件。\n2. 在 `lesson05` 下创建一个名为\
  \ `images` 的文件夹。\n3. 将你自己的 `day.png` 和 `night.png` 图片添加到项目中的 `./images` 文件夹，或者从本书网站下载。\n\
  4. 添加常用的基本元素（`html`、`head`、`body`）。\n5. 添加以下 `<script>` 元素，使用 `Date().getLessons()`\
  \ JavaScript 代码获取课时值。该代码使用 `if` 语句判断一天中的时间，并执行两项操作：在屏幕上写入问候语，并设置 `timeOfDay` 变量的值：\n\
  \n```\n06     <script>\n07       function writeIt(){\n08         var lesson = new\
  \ Date().getLessons();\n09         var timeOfDay;\n10         if(lesson>=7 && lesson<12){\n\
  11           document.write(\"早上好！\");\n12           timeOfDay=\"morning\";\n13\
  \         } else if(lesson>=12 && lesson<18) {\n14           document.write(\"下午好！\"\
  );\n15           timeOfDay=\"day\";\n16         } else {\n17           document.write(\"\
  晚上好！\");\n18           timeOfDay=\"night\";\n19         }\n32       }\n33     </script>\n\
  ```\n\n6. 现在添加以下 `switch` 语句，使用 `timeOfDay` 的值来确定在网页中显示哪张图片：\n\n```\n20        \
  \ switch(timeOfDay){\n21           case \"morning\":\n22           case \"day\"\
  :\n23             document.write(\"<img src='images/day.png' />\");\n24        \
  \     break;\n25           case \"night\":\n26             document.write(\"<img\
  \ src='images/night.png' />\");\n27             break;\n28           default:\n\
  29             document.write(\"<img src='images/day.png' />\");\n30         }\n\
  ```\n\n7. 保存文件并在网页浏览器中查看。根据当前时间，输出应类似于图 5.3。\n\n![Image](img/image00852.jpeg)\n\n\
  **图 5.3** 当 body 加载时执行函数 `writeIt()`，并更改网页上显示的问候语和图片。\n\n**清单 5.3 `if_logic.html`\
  \ 在 JavaScript 内部使用条件逻辑的简单示例**\n\n---\n\n```\n01 <!DOCTYPE html>\n02 <html>\n03\
  \   <head>\n04     <title>If 逻辑</title>\n```\n\n\n\n\n\n```html\n<meta charset=\"\
  utf-8\" />\n<script>\n  function writeIt(){\n    var hour = new Date().getHours();\n\
  \    var timeOfDay;\n    if(hour>=7 && hour<12){\n      document.write(\"Good Morning!\"\
  );\n      timeOfDay=\"morning\";\n    } else if(hour>=12 && hour<18) {\n      document.write(\"\
  Good Day!\");\n      timeOfDay=\"day\";\n    } else {\n      document.write(\"Good\
  \ Night!\");\n      timeOfDay=\"night\";\n    }\n    switch(timeOfDay){\n      case\
  \ \"morning\":\n      case \"day\":\n        document.write(\"<img src='../images/day.png'\
  \ />\");\n        break;\n      case \"night\":\n        document.write(\"<img src='../images/night.png'\
  \ />\");\n        break;\n      default:\n        document.write(\"<img src='../images/day.png'\
  \ />\");\n    }\n  }\n</script>\n</head>\n<body onload=\"writeIt()\">\n</body>\n\
  </html>\n```\n\n---\n\n## 实现循环\n\n循环是一种多次执行同一段代码的手段。当你需要对一组 DOM 对象执行相同任务，或者动态创建项目列表时，循环非常有用。\n\
  \nJavaScript 提供了执行 `for` 和 `while` 循环的功能。以下各节将介绍如何在 JavaScript 中实现循环。\n\n### while\
  \ 循环\n\nJavaScript 中最基本的循环类型是 `while` 循环。`while` 循环测试一个表达式，并持续执行其 `{}` 大括号内的代码，直到表达式求值为\
  \ false。\n\n例如，下面的 `while` 循环会一直执行，直到 `i` 的值等于 5：\n\n```javascript\nvar i = 1;\n\
  while (i<5){\n  document.write(\"Iteration \" + i + \"<br>\");\n  i++;\n}\n```\n\
  \n在浏览器中输出的结果如下：\n\nIteration 1\n\nIteration 2\n\nIteration 3\n\nIteration 4\n\n\
  ### do/while 循环\n\n另一种 `while` 循环是 `do`/`while` 循环。当你希望循环内的代码至少执行一次，并且表达式必须在代码至少执行一次后才能测试时，这种循环非常有用。\n\
  \n例如，下面的 `do`/`while` 循环会一直执行，直到 `day` 的值等于 `Wednesday`：\n\n```javascript\nvar days\
  \ = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\nvar i=0;\n\
  do{\n  var day=days[i++];\n  document.write(\"It's \" + day + \"<br>\");\n} while\
  \ (day != \"Wednesday\");\n```\n\n在浏览器中输出的结果如下：\n\nIt's Monday\n\nIt's Tuesday\n\
  \nIt's Wednesday\n\n### for 循环\n\nJavaScript 的 `for` 循环允许你通过使用 `for` 语句来执行特定次数的代码，该语句将三个语句合并为一个，语法如下：\n\
  \n```javascript\nfor (语句 1; 语句 2; 语句 3;){\n  要执行的代码;\n}\n```\n\n`for` 语句在执行循环时按如下方式使用这三个语句：\n\
  \n**语句 1** — 在循环开始前执行，且只执行一次。用于初始化将在循环中用作条件的变量。\n\n**语句 2** — 在每次循环迭代前求值的表达式。如果表达式求值为\
  \ true，则执行循环；否则，`for` 循环执行结束。\n\n**语句 3** — 在循环内代码执行后，每次迭代都会执行。通常用于递增语句 2 中使用的计数器。\n\
  \n为了说明 `for` 循环，请看下面的示例。该示例不仅展示了一个基本的 `for` 循环，还展示了将一个循环嵌套在另一个循环中的能力：\n\n```javascript\n\
  for (var x=1; x<=3; x++){\n  for (var y=1; y<=3; y++){\n    document.write(x + \"\
  \ X \" + y + \" = \" + (x*y) + \"<br>\");\n  }\n}\n```\n\n在浏览器中输出的结果如下：\n\n1 X 1\
  \ = 1\n\n1 X 2 = 2\n\n1 X 3 = 3\n\n2 X 1 = 2\n\n2 X 2 = 4\n\n2 X 3 = 6\n\n3 X 1\
  \ = 3\n\n3 X 2 = 6\n\n3 X 3 = 9\n\n### for/in 循环\n\n另一种 `for` 循环是 `for`/`in` 循环。`for`/`in`\
  \ 循环可以在任何可迭代的数据类型上执行。大多数情况下，你会在数组和对象上使用 `for`/`in` 循环。下面的示例展示了 `for`/`in` 循环在简单数组上的语法和行为：\n\
  \n```javascript\nvar days = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\"\
  , \"Friday\"];\nfor (var idx in days){\n  document.write(\"It's \" + days[idx] +\
  \ \"<br>\");\n}\n```\n\n注意，变量 `idx` 在每次循环迭代中从数组起始索引调整到最后一个索引。输出结果如下：\n\nIt's Monday\n\
  \nIt's Tuesday\n\nIt's Wednesday\n\nIt's Thursday\n\nIt's Friday\n\n### 中断循环\n\n\
  在处理循环时，有时需要在代码内部中断执行，而不必等待下一次迭代。有两种方法可以实现：使用 `break` 和 `continue` 关键字。\n\n`break`\
  \ 关键字会完全停止 `for` 或 `while` 循环的执行。而 `continue` 关键字会停止循环内代码的执行，并继续下一次迭代。请考虑以下示例：\n\
  \n如果 `day` 是 `Wednesday`，则使用 `break`：\n\n```javascript\nvar days = [\"Monday\",\
  \ \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\nfor (var idx in days){\n\
  \  if (days[idx] == \"Wednesday\")\n    break;\n  document.write(\"It's \" + days[idx]\
  \ + \"<br>\");\n}\n```\n\n当值为 `Wednesday` 时，循环完全停止执行：\n\nIt's Monday\n\nIt's Tuesday\n\
  \n如果 `day` 是 `Wednesday`，则使用 `continue`：\n\n```javascript\nvar days = [\"Monday\"\
  , \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\nfor (var idx in days){\n\
  \  if (days[idx] == \"Wednesday\")\n    continue;\n  document.write(\"It's \" +\
  \ days[idx] + \"<br>\");\n}\n```\n\n注意，由于 `continue`，`Wednesday` 的写入没有执行；但循环执行完成了：\n\
  \nIt's Monday\n\nIt's Tuesday\n\nIt's Thursday\n\nIt's Friday\n\n## 创建函数\n\nJavaScript\
  \ 最重要的部分之一是让代码可被其他代码重用。为此，你将代码组合成执行特定任务的函数。函数是一系列代码语句组合成一个单独的块，并赋予一个名称。然后可以通过引用该名称来执行块中的代码。\n\
  \n### 定义函数\n\n函数使用关键字 `function` 定义，后跟描述函数用途的函数名、`()` 圆括号中的零个或多个参数列表，以及 `{}` 大括号中的一个或多个代码语句块。例如，以下是一个函数定义，它向浏览器写入\
  \ \"Hello World\"：\n\n```javascript\nfunction myFunction(){\n  document.write(\"\
  Hello World\");\n}\n```\n\n要执行 `myFunction()` 中的代码，你只需在主 JavaScript 中或另一个函数内添加以下行：\n\
  \n```javascript\nmyFunction();\n```\n\n### 向函数传递变量\n\n通常，你需要向函数传递特定的值，这些值将在函数执行代码时使用。值以逗号分隔的形式传递给函数。函数定义需要在\
  \ `()` 圆括号中有一个变量名列表，该列表与传入的数量匹配。例如，以下函数接受两个参数：`name` 和 `city`，并使用它们构建输出字符串：\n\n\
  ```javascript\nfunction greeting(name, city){\n  document.write(\"Hello \" + name);\n\
  \  document.write(\". How is the weather in \" + city);\n}\n```\n\n\n\n\n要调用 `greeting()`\
  \ 函数，我们需要传入一个 `name` 值和一个 `city` 值。该值可以是直接值，也可以是先前定义的变量。为了说明这一点，以下代码将使用一个 `name`\
  \ 变量和一个直接字符串作为 `city` 来执行 `greeting()` 函数：\n\n```\nvar name = \"Brad\";\ngreeting(name,\
  \ \"Florence\");\n```\n\n##### 从函数返回值\n\n通常，函数需要向调用代码返回一个值。添加 `return` 关键字后跟一个变量或值，将从函数返回该值。例如，以下代码调用一个函数来格式化字符串，将函数返回的值赋给一个变量，然后将该值写入浏览器：\n\
  \n点击此处查看代码图片\n\n```\nfunction formatGreeting(name, city){\n  var retStr = \"\";\n\
  \  retStr += \"Hello <b>\" + name + \"</b><br>\";\n  retStr += \"Welcome to \" +\
  \ city + \"!\";\n return retStr;\n}\nvar greeting = formatGreeting(\"Brad\", \"\
  Rome\");\ndocument.write(greeting);\n```\n\n你可以在函数中包含多个 `return` 语句。当函数遇到 `return`\
  \ 语句时，函数的代码执行会立即停止。如果 `return` 语句包含要返回的值，则返回该值。以下示例展示了一个函数，它测试输入并在输入为零时立即返回：\n\n\
  点击此处查看代码图片\n\n```\nfunction myFunc(value){\n  if (value == 0)\n    return;\n  code_to_execute_if_value_nonzero;\n\
  }\n```\n\n---\n\n#### 动手实践：创建 JavaScript 函数\n\n为了巩固对函数的理解，请按照以下步骤将一些函数集成到 JavaScript\
