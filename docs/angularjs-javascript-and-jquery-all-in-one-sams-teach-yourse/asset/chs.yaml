  \ 作为替换字符串传入：\n\n点击此处查看代码图片\n\n```html\n11       <p ng-click=\"filterText()\">{{txt}}</p>\n\
  ```\n\n8. 在浏览器中加载 `filter_custom.html` 文件，查看如图 23.6 所示的行为。\n\n![图片](img/image01008.jpeg)\n\
