  \ jQuery 确实使其相当容易。响应中的 XML 数据作为 DOM 对象返回，可以转换为 jQuery，并使用 jQuery 丰富的选项进行搜索/导航。例如，来自服务器的以下\
  \ XML 响应：\n\n点击此处查看代码图片\n\n```xml\n<person><first>Brad</first><last>Dayley</last></person>\n\
  ```\n\n可以在响应数据中按如下方式访问：\n\n点击此处查看代码图片\n\n```javascript\nvar name  = $(data).find(\"\
  first\").text() + \" \" + $(data).find(\"last\").text();\n```\n\n与 JSON 类似，如果响应数据对象以字符串形式出现，你可以使用\
  \ `.parseXML()` 来获取 DOM 对象。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar data = $.parseXML(\"\
  <person><first>Brad</first><last>Dayley</last></person>\");\nvar name  = $(data).find(\"\
  first\").text() + \" \" + $(data).find(\"last\").text();\n```\n\n\n\n\n\n在本练习中，你将有机会处理来自\
  \ AJAX 请求的 XML 数据。生成的网页包含一个基本表格，其单元格数据来源于服务器上 `lesson15/data/parkdata.xml` 文件中的\
  \ XML 数据。本练习的目的是让你熟悉使用 AJAX 请求返回的 XML 数据来动态填充页面。\n\n示例代码位于清单 15.13、15.14、15.15 和\
  \ 15.16 中。请按照以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中创建 `lesson15/load_xml.html`、`lesson15/js/load_xml.js`、`lesson15/css/load_xml.css`\
