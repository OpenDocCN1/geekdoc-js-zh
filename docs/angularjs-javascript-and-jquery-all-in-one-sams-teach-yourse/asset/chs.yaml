  \n在本课中，你实现了几个更高级的网页元素。你学习了实现图片画廊的基础知识、如何为表格添加排序和筛选功能，以及如何动态创建树形视图。你还实现了一些图形元素，例如迷你图和均衡器显示。\n\
  \n### 问答\n\n**问.** 在你的示例中，你使用数组填充了图片滑块。这是最佳方法吗？\n\n**答.** 不一定。示例中这样做是为了简单起见。你也可以使用位于\
  \ Web 服务器上的静态文件来获取文件列表，或者使用 AJAX 请求向服务器端脚本发送请求，该脚本返回要显示的图片列表。\n\n**问.** 绘制图表类型数据（如迷你图）时，使用\
  \ `<canvas>` 元素还是 `<svg>` 元素更好？\n\n**答.** 我使用了 `<canvas>`，因为它实现变化线条很简单。`<svg>` 图表对于本书来说篇幅过大。缺点是，如果在网页上放大，画布会变得模糊。为了获得最佳图表效果，你应该使用\
  \ `<svg>`，这样用户可以放大，且图像依然清晰。\n\n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\
  \n#### 小测验\n\n**1.** 如何使用 jQuery 移动图片画廊中的滑块？\n\n**2.** 创建自定义对话框时，为什么要同时使用覆盖层元素？\n\
  \n**3.** 如何让对话框显示在其他元素之上？\n\n#### 小测验答案\n\n**1.** 滑块实际上只是一个大的 `<div>`。要调整位置，可以使用\
  \ `.css()` 或 `.animate()` 方法更改相对位置。\n\n**2.** 覆盖层可以防止用户在对话框关闭之前点击网页的其他部分。\n\n**3.**\
  \ 将 `z-index` 设置为更高的值。\n\n#### 练习\n\n**1.** 修改清单 14.4、14.5 和 14.6 中的代码，使得当列按升序排列时，数值列的筛选器会筛选出小于指定值的项；当列按降序排列时，筛选出大于指定值的项。\n\
  \n**2.** 修改清单 14.7、14.8 和 14.9 中的代码，添加“全部展开”和“全部折叠”按钮。这些按钮应展开或折叠树中的所有元素。\n\n**3.**\
  \ 本练习面向更高级的 CSS 和 HTML 用户。在清单 14.1、14.2 和 14.3 的代码中，将滑块修改为垂直方向。你需要更改定位代码，将调整 `left`\
  \ 改为调整 `top`，在页面上移动元素，并进行大量 CSS 修改，才能使滑块看起来正确。\n\n## 第 15 课 通过 JavaScript 和 jQuery\
  \ AJAX 请求访问服务器端数据\n\n本课你将学到：\n\n![Image](img/image00767.jpeg) 使用 AJAX 请求将数据加载到页面元素中\n\
  \n![Image](img/image00767.jpeg) 发送 AJAX GET 和 POST 请求\n\n![Image](img/image00767.jpeg)\
  \ 如何为 GET 和 POST 请求序列化参数\n\n![Image](img/image00767.jpeg) 如何处理 Web 服务器 AJAX 响应中的\
  \ JSON 和 XML 数据\n\n![Image](img/image00767.jpeg) 实现 AJAX 事件处理器以处理完成、成功和失败事件\n\n\
  在本课中，你将探索使用 jQuery 和 JavaScript 中的 AJAX 请求与服务器进行异步通信的世界。AJAX 通信是大多数网站最重要的组成部分之一。它允许\
  \ jQuery 和 JavaScript 从服务器获取额外数据并更新页面，而无需重新加载或加载新网页。\n\n接下来的部分将尝试揭开 AJAX 的神秘面纱，并提供一些实用示例。学完本课后，你将能够以多种方式实现\
  \ AJAX。AngularJS 将 jQuery 和 JavaScript 的 AJAX 组件封装成一个非常易用的服务，名为 `$http`，你将在 AngularJS\
  \ 课程部分学习它。这里不包含该内容，因为你需要先了解 AngularJS 服务的工作原理，然后才能使用它。\n\n### 让 AJAX 变得简单\n\n尽管\
  \ AJAX 很重要，但一开始可能会让人望而生畏。面对各种通信术语，很容易感到困惑。其实大可不必。如果你退一步，从高层次审视 AJAX 的基础知识，理解起来会更容易。\n\
  \nAJAX 是从 jQuery 或 JavaScript 向 Web 服务器发出的请求。该请求可以向服务器发送数据，服务器会以成功或失败作为响应，并可能附带额外数据。仅此而已——不多也不少。以下部分将帮助你理清请求/响应过程。\n\
  \n#### 厘清 AJAX 与页面请求的区别\n\n第一步是定义 AJAX 与普通页面链接请求之间的区别。你已经熟悉页面链接：点击链接时，会出现一个新网页。即使所有控件、表格、图形等都相同，只是某些数据发生了变化，通常也是如此。在表单提交的情况下，数据没有变化，但网页仍然必须从服务器重新加载。\n\
  \n* * *\n\n注意\n\n不要将服务器端动态创建网页与 AJAX 混淆。动态创建网页仍然是传统的旧方法——只是管理起来稍微容易一些。每次向服务器发回请求仍然需要返回一个完整的新网页。唯一的优点是网页是在内存中生成的，而不是从磁盘读取的。\n\
  \n* * *\n\nAJAX 则完全不同。AJAX 请求不会向服务器请求新网页。相反，AJAX 请求只发送和接收必要的数据片段。如果从 Web 服务器接收到的新数据需要更新网页，那么\
  \ jQuery 和 JavaScript 可以更新页面元素，正如你已经看到的那样。\n\n以下是 AJAX 请求的一些优点：\n\n![Image](img/image00767.jpeg)\
  \ 从 Web 服务器请求的数据更少。\n\n![Image](img/image00767.jpeg) 允许用户在请求处理过程中继续使用网页。\n\n![Image](img/image00767.jpeg)\
  \ 在向服务器发出请求之前，可以在客户端捕获并处理错误。\n\n图 15.1 展示了在浏览器中更新数据的两种方法之间的区别。\n\n![Image](img/image00936.jpeg)\n\
  \n**图 15.1** AJAX 请求与传统页面链接的对比。\n\n#### 理解服务器端服务，如 Node.js、ASP、PHP 和 MySQL\n\n下一步是理解\
  \ AJAX 请求是如何处理的。不需要了解太多细节。你需要理解的是，对于你发送到 Web 服务器的每个 AJAX 请求，都会有一个进程读取该请求，执行一些工作，然后发回响应。\n\
  \n\n\n\n后端进程可以是返回静态 HTML、文本、XML 或 JSON 文件的 Web 服务器。后端进程通常是在服务器上运行的 ASP、JSP、PHP、Python\
  \ 或 Node.js 脚本，用于从内存、文件、数据库和其他来源读取数据。后端进程也可以是集成到 Web 服务器中的众多其他框架。\n\n对于在浏览器中运行的\
  \ AJAX 脚本来说，这些都不重要。唯一重要的是服务器返回状态和数据。\n\n#### 理解异步通信\n\n你需要清楚异步通信的概念。当你从 Web 服务器请求一个网页时，通信对于你的浏览器来说是同步的。这意味着浏览器会等待\
  \ HTML 文档从服务器下载完成后，才开始渲染它并获取所需的额外资源。\n\n* * *\n\n提示\n\n你可以使用 jQuery 和 JavaScript\
  \ 进行同步 AJAX 请求。jQuery 的 `.ajax()` 方法和 JavaScript 的 `send()` 函数都有一个布尔字段允许这样做。不过，你不应该使用它，因为这可能导致浏览器锁定，从而让用户非常不满。实际上，在\
  \ jQuery 1.8 及更高版本中，该选项已被弃用。\n\n* * *\n\n当你发送 AJAX 请求时，AJAX 通信是不同的。控制权会立即返回给 jQuery\
  \ 或 JavaScript，它们可以执行其他操作。只有当请求完成或超时时，浏览器中才会触发事件，让你能够处理请求数据。\n\n#### 理解跨域请求\n\n\
  当你向不同域名的独立服务器发送 AJAX 请求时，就会发生跨域请求。浏览器会阻止这种情况，出于多种安全原因，这样做是正确的。\n\n阻止跨域请求的唯一问题是，你经常需要从当前网站外部的服务获取数据。有几种方法可以解决这个问题。\n\
  \n克服跨域限制的第一种方法是让 Web 服务器充当其他服务器或服务的代理，这意味着不通过 JavaScript 直接通信，而是将请求发送到服务器，让服务器为你执行。唯一的缺点是它需要额外的服务器端脚本，并且你会付出额外的时间代价，因为数据必须先下载到\
  \ Web 服务器，然后再下载到 Web 浏览器。\n\n另一种选择是所谓的按需 JavaScript，它被 JSON with Padding (JSONP)\
  \ 所使用。这种方法利用了你可以使用以下语法从另一个网站下载脚本作为资源的事实：\n\n```\n<script type=\"text/javascript\"\
  \n        src=\"http://new.domain.com/getData?jsonp=parseData\">\n</script>\n```\n\
  \n关键在于，`src` 属性指定的地址不能直接返回 JSON 响应。如果浏览器检测到脚本中的数据是 JSON（如下所示），它会抛出跨域错误：\n\n```\n\
  { \"title\": \"photoA\", \"rating\": 7 };\n```\n\n相反，第三方服务必须支持 JSONP，在这种情况下，它会用请求指定的函数调用来填充响应，如下所示。这样，你就可以通过调用该函数从\
  \ JavaScript 访问数据：\n\n```\nparseData({ \"title\": \"photoA\", \"rating\": 7 });\n\
  ```\n\n* * *\n\n注意\n\n另一种可能有用的处理跨域通信的方法是在响应头中包含 `ACCESS-CONTROL-ALLOW-ORIGIN:*`\
  \ 头。如果你正在设置自己的服务器，这很容易做到。\n\n* * *\n\n#### 了解 GET 与 POST 请求\n\n本节将阐明 GET 和 POST\
  \ 请求。发送到 Web 服务器的两种主要请求类型是 GET 和 POST。两者之间只有几个区别，但它们很重要。GET 请求将参数作为 URL 的一部分传递，而\
  \ POST 请求则将参数作为请求数据的一部分传递。\n\n为了帮助你快速理解，下面展示了在 GET 和 POST 请求中向服务器发送名字和姓氏所涉及的基本 URL\
  \ 和数据：\n\nGET 请求 URL：\n\n```\nhttp://localhost/code/example1.html?first=Brad&last=Dayley\n\
  ```\n\nGET 请求数据：\n\n<empty>\n\nPOST 请求 URL：\n\n```\nhttp://localhost/code/example1.html\n\
  ```\n\nPOST 请求数据：\n\n```\nfirst=Brad\nlast=Dayley\n```\n\n你应该使用哪种请求类型？基本规则是：使用 GET\
  \ 从服务器检索信息，如果要在服务器上更改数据，则使用 POST。\n\n#### 理解响应数据类型——二进制与文本与 XML 与 JSON\n\n清楚服务器可能返回的响应数据类型非常重要。返回给\
  \ AJAX 请求的数据要么是某种二进制格式，要么是文本格式。通常，二进制格式用于图像、zip 文件等。而文本格式可以是纯文本、HTML、XML、JSON 等。\n\
  \n这意味着什么？这里可能会有点棘手。当浏览器收到服务器的响应时，它会尝试确定接收到的数据类型，并创建适当的响应对象供你使用。\n\n对于 XML 和 HTML\
  \ 数据，会创建一个 DOM 对象；而对于 JSON，会创建一个 JavaScript 对象。对于纯文本或二进制对象，会构建一个提供对原始文本或二进制数据访问的对象。你将在接下来的章节中看到这是如何工作的。\n\
  \n### 实现 AJAX\n\n现在你已经掌握了 AJAX 的概念，可以开始实现基本细节了。要实现 AJAX 请求，你需要访问 HTTP 请求对象，格式化需要发送到服务器的数据，发送请求，然后处理响应。\n\
  \nJavaScript 和 jQuery 都有向 Web 服务器发送 AJAX 请求的方法。你将在接下来的章节中看到这两种方法。jQuery 能够完成 JavaScript\
  \ 所能做的一切，但方式更简单、更可扩展。\n\n以下章节讨论并提供了一些实现基本 AJAX 请求的示例。\n\n#### 从 JavaScript 实现 AJAX\n\
  \n要在 JavaScript 中实现 AJAX 请求，你需要访问一个新的 `window.XMLHttpRequest` 对象。表 15.1 描述了 `XMLHttpRequest`\
  \ 对象的重要方法和属性。\n\n![Image](img/image00937.jpeg)\n\n**表 15.1 XMLHttpRequest 对象的重要方法和属性**\n\
  \n为了说明这一点，请查看以下代码，它向服务器发送一个 GET AJAX 请求，以根据名字和姓氏参数获取电子邮件地址：\n\n```\nvar xmlhttp\
  \ = new XMLHttpRequest();\nxmlhttp.onreadystatechange=function() {\n  if (xmlhttp.readyState==4\
  \ && xmlhttp.status==200)\n    { document.getElementById(\"email\").innerHTML=xmlhttp.responseText;}\n\
  \  }\nxmlhttp.open(\"GET\",\"/getUserEmail?userid=brad\",true);\nxmlhttp.send();\n\
  ```\n\n以下代码说明了如何向服务器发送一个基本的 POST AJAX 请求来设置电子邮件地址。请注意，对于 POST 请求，添加的 `Content-length`\
  \ 和 `Content-type` 头确保数据在服务器端被正确处理。`Content-length` 被设置为 `params` 字符串的长度：\n\n```\n\
  var xmlhttp = new XMLHttpRequest();\nvar params = \"first=Brad&last=Dayley&email=brad@dayleycreations.com\"\
  ;\nhttp.setRequestHeader(\"Content-type\", \"text/plain\");\nhttp.setRequestHeader(\"\
  Content-length\", params.length);\nxmlhttp.onreadystatechange=function() {\n  if\
  \ (xmlhttp.readyState==4 && xmlhttp.status==200)\n    { alert(\"Email Updated\"\
  );\n  }\nxmlhttp.open(\"POST\",\"/setUserEmail\",true);\nxmlhttp.send(params);\n\
  ```\n\n* * *\n\n注意\n\n\n\n在早于 IE7 的 Internet Explorer 浏览器中，你需要使用以下代码行来创建 `xmlhttp`\
  \ 对象，因为 `window` 对象不支持 `XMLHttpRequest` 属性：\n\n点击此处查看代码图像\n\n```\nxmlhttp=new ActiveXObject(\"\
  Microsoft.XMLHTTP\");\n```\n\n* * *\n\n## 来自 jQuery 的 AJAX\n\n本节介绍如何从 jQuery 实现\
  \ AJAX 请求。jQuery 提供了非常易用的包装方法来实现 AJAX 请求，包括 `.load()`、`.get()` 和 `.post()`。\n\n\
  这些辅助函数是对 `.ajax()` 接口的封装，后者将在后面讨论。这些辅助函数如下：\n\n![图片](img/image00767.jpeg) `.load(url\
  \ [, data ] [, success(data, textStatus, jqXHR) ] )`——该方法用于将数据直接加载到由 jQuery 对象表示的元素中。\n\
  \n![图片](img/image00767.jpeg) `.getScript (url [, data ] [, success(data, textStatus,\
  \ jqXHR) ] ) )`——该方法用于加载并立即执行一个 JavaScript/jQuery 脚本。\n\n![图片](img/image00767.jpeg)\
  \ `.getJSON(url [, data ] [, success(data, textStatus, jqXHR) ] ) )`——该方法用于通过 JSONP\
  \ 请求从不同域的服务器加载 JSON 格式的数据。\n\n![图片](img/image00767.jpeg) `.get(url [, data ] [,\
  \ success(data, textStatus, jqXHR) ] [, dataType ]) )`——该方法用于向服务器发送通用的 GET 请求。\n\
  \n![图片](img/image00767.jpeg) `.post(url [, data ] [, success(data, textStatus, jqXHR)\
  \ ] [, dataType ]) )`——该方法用于向服务器发送通用的 POST 请求。\n\n这些方法中的每一个都允许你指定请求的 `url`。`.load()`\
  \ 方法用于将数据直接加载到由 jQuery 对象表示的元素中。`.get()` 和 `.post()` 方法用于发送 GET 和 POST 请求。\n\n`data`\
  \ 参数可以是一个字符串或基本的 JavaScript 对象。例如，在下面的示例中，`obj`、`objString` 和 `formString` 都是有效的\
  \ data 参数：\n\n点击此处查看代码图像\n\n```\nvar obj ={\"first\":\"Brad\", \"last\":\"Dayley\"\
  };\nvar objString = $.param(obj);\nvar formString = $(\"form\").serialize();\n```\n\
  \n你还可以指定在服务器响应成功时执行的函数。例如，下面的成功处理程序将 `#email` 元素的值设置为响应数据：\n\n点击此处查看代码图像\n\n```\n\
  $.get(\"/getEmail?first=Brad&last=Dayley\", null, function (data, status, xObj){\n\
  \  $(\"#email\").html(data);\n}));\n```\n\n`.get()` 和 `.post()` 方法还允许你指定一个 `dataType`\
  \ 参数作为字符串，例如 `\"xml\"`、`\"json\"`、`\"script\"`、`\"html\"` 等，用于格式化服务器响应数据的预期格式。例如，要指定\
  \ JSON 响应类型，你可以使用以下代码：\n\n点击此处查看代码图像\n\n```\n$.get(\"/getUser?first=Brad&last=Dayley\"\
  , null, function (data, status, xObj){\n  $(\"#email\").html(data.email);\n}), \"\
  json\");\n```\n\n* * *\n\n## 动手实践：从 jQuery 发送 AJAX 请求\n\n在本练习中，你将有机会使用 jQuery 的\
  \ `.load()` 方法实现一些简单的 AJAX 请求。生成的网页包含一个左侧导航，该导航使用 AJAX 请求从 Web 服务器加载 lorem ipsum\
  \ 文章数据，并将结果填充到网页中。本练习的目的是让你有机会了解 `.load()` 方法的工作原理。\n\n示例代码位于清单 15.1、15.2、15.3 和\
  \ 15.4 中。请按照以下步骤创建动态网页：\n\n1. 在 Eclipse 中，创建 `lesson15`、`lesson15/js` 和 `lesson15/css`\
  \ 文件夹，然后添加 `lesson15/load_content.html`、`lesson15/js/load_content.js` 和 `lesson15/css/load_content.css`。你还需要创建\
  \ `lesson15/data` 文件夹，并在其中创建文件 `article1.html`、`article2.html`、`article3.html` 和\
  \ `article4.html`。你也可以从本书的网站下载这些文件。\n\n2. 清单 15.4 展示了 `article#.html` 文件的数据格式示例。\n\
  \n3. 将清单 15.1 和清单 15.3 中的代码添加到 HTML 和 CSS 文件中。这些文件中的代码你应该很熟悉，只是 `<span>` 元素增加了一个\
  \ `article` 属性，如下所示。该属性在 jQuery 中用于标识点击 span 时应加载哪篇文章：\n\n点击此处查看代码图像\n\n```\n15\
  \         <span class=\"navItem\"\n16               article=\"article1\">响应式网页设计</span>\n\
  ```\n\n4. 现在打开 `load_content.js` 文件，并添加以下 `.ready()` 方法，该方法为网页左侧导航项添加了一个点击处理程序 `setArticle()`：\n\
  \n点击此处查看代码图像\n\n```\n4 $(document).ready(function(){\n5   $(\".navItem\").click(setArticle);\n\
  6 });\n```\n\n5. 添加以下点击处理程序 `setArticle()`，它调用 jQuery AJAX 方法 `.load()`，并用从服务器加载的新数据填充\
  \ `#content <div>`。请注意，读取了 span 中的 `article` 属性，并添加了 `.html` 扩展名，以便 `.load()` 方法为每个链接请求不同的文章：\n\
  \n点击此处查看代码图像\n\n```\n1 function setArticle(){\n2   $(\"#content\").load(\"data/\"\
  +$(this).attr(\"article\")+\".html\");\n3 }\n```\n\n6. 保存所有三个文件，然后在 Web 浏览器中打开 HTML\
  \ 文档，如图 15.2 所示。你应该能够点击左侧导航项并加载不同的文章。\n\n![图片](img/image00938.jpeg)\n\n**图 15.2**\
  \ 使用 AJAX 请求填充文章内容的文章查看器。\n\n* * *\n\n### 清单 15.1 load_content.html 添加菜单和内容的 HTML\
  \ 文档\n\n点击此处查看代码图像\n\n* * *\n\n```\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n\
  04     <title>加载内容</title>\n05     <meta charset=\"utf-8\" />\n06     <script type=\"\
  text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
