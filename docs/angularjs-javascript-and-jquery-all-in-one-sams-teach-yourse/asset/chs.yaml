  >\n08     <h2>Keyboard Event Directives</h2>\n09     <input type=\"text\"\n10  \
  \       ng-keydown=\"keyState='Pressed'\"\n11         ng-keyup=\"keyPressed($event)\"\
  ><hr>\n12     Keyboard State:<br>\n13       {{keyState}}<hr>\n14     Last Key:<br>\n\
  15       {{keyInfo|json}}<hr>\n16     Stored String:<br>\n17       {{storedString}}<hr>\n\
  18     Recorded Key Strokes:<br>\n19       {{keyStrokes}}\n20   </div>\n21   <script\
  \ src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n22   <script\
