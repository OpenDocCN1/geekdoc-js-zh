  \n### 问答\n\n**问：** 有没有办法将 `<img>` 元素从一个源动画切换到另一个源，使得两个元素的部分同时可见？\n\n**答：** 不能直接实现，但有一个技巧可以使用。使用两个\
  \ `<img>` 元素，并同时动画化它们的 `opacity` 属性变化。当一个消失时，另一个就会变得可见。\n\n**问：** 有没有办法创建自定义缓动函数？\n\
  \n**答：** 可以。你可以创建一个自定义缓动函数并将其附加到 `$.easing`。该函数需要接受以下参数，并基于这些参数返回一个新值：\n\n![图片](img/image00767.jpeg)\
  \ `tPercent`——动画经过的时间百分比，范围从 0.0 到 1.0。\n\n![图片](img/image00767.jpeg) `tMS`——自动画开始以来的毫秒数。\n\
  \n![图片](img/image00767.jpeg) `startValue`——属性的起始值。\n\n![图片](img/image00767.jpeg)\
  \ `endValue`——属性的结束值。\n\n![图片](img/image00767.jpeg) `tTotal`——动画的持续时间。\n\n```javascript\n\
  \   $.easing.myCustom = function(tPercent, tMS, startValue, endValue, tTotal) {\n\
  \n       var newValue= <你的代码在这里>...\n\n      return newValue;\n\n   }\n```\n\n###\
