  31     font-size:20px;\n32 }\n```\n\n---\n\n---\n\n### 动态重新排列网页元素\n\n网页交互中最酷的功能之一就是根据用户操作重新排列元素。例如，你可以让元素变大或变小，或者改变其位置。这些内容在本课的第一部分（获取和设置元素属性）中已经介绍过。本节将进一步扩展这些概念，讨论使用\
  \ `z-index` 定位页面元素的最后一种方法；然后通过一个示例演示重新排列元素的不同方法。\n\n#### 调整 z-index\n\n`z-index`\
  \ 是一个 CSS 属性，用于指定 HTML 元素相对于其他元素的位置，它不是垂直或水平方向，而是向用户方向投射，就像屏幕上堆叠的纸张一样。当浏览器渲染页面时，`z-index`\
  \ 最高的元素会显示在其他元素之上。\n\n在 jQuery 中，使用 `.css()` 方法获取和设置 `z-index`。例如，要获取某个元素的 `z-index`，可以使用以下代码：\n\
  \n[点击此处查看代码图片]\n\n```javascript\nvar zIndex = $(\"#item\").css(\"z-index\");\n```\n\
  \n要将某个元素的 `z-index` 设置为 10，可以使用以下语句：\n\n[点击此处查看代码图片]\n\n```javascript\n$(\"#item\"\
  ).css(\"z-index\", \"10\");\n```\n\n---\n\n#### 动手试一试：动态重新排列页面元素\n\n在本示例中，你将学习如何使用\
  \ jQuery 和 JavaScript 移动、调整大小和重新排列图片。之所以使用图片，是因为它们是最常被重新排列的元素之一。你可以将这些相同的原理应用于任何\
  \ HTML 元素。示例代码如清单 10.7、10.8 和 10.9 所示。请按照以下步骤实现该示例：\n\n**1.** 在 Eclipse 中创建文件 `lesson10/rearranging_elements.html`、`lesson10/js/rearranging_elements.js`\
  \ 和 `lesson10/css/rearranging_elements.css`。\n\n**2.** 将清单 10.7 中的代码添加到 HTML 文件中。你应该能识别出这些\
  \ HTML 组件。HTML 代码包含几个将被样式化为按钮的 `<span>` 元素，以及三张图片，当用户点击按钮时，这些图片将被重新排列。\n\n**3.**\
  \ 将清单 10.9 中的 CSS 代码添加到 CSS 文件中。这段代码为按钮设置样式，并为图片添加边框。\n\n**4.** 打开 `rearranging_elements.js`\
  \ 文件，添加以下全局定义，这些定义将在后续用于跟踪平铺和堆叠图片时的起始坐标，以及当前具有最高 `z-index` 的图片和最大图片索引：\n\n```javascript\n\
  01 var startX = startY = 60;\n02 var topIndex, maxIndex;\n```\n\n**5.** 添加以下 `load()`\
  \ 函数。第 3 行和第 4 行将当前顶部索引和最大索引设置为文件数量减 1（使其从零开始）。然后第 6–12 行为每个按钮添加点击处理程序：\n\n[点击此处查看代码图片]\n\
  \n```javascript\n03 $(window).load(function(){\n04   topIndex = $(\".photo\").length-1;\n\
