  \ alt=\"总有一天我会去那里\"/>\n```\n\n* * *\n\n### 创建自定义小部件\n\n创建自定义小部件是一个相当简单的过程。`$.widget()`\
  \ 工厂需要一个名称，然后是下面显示的原型对象。小部件工厂将处理所有设置，以便小部件可以应用于页面元素。\n\n清单 19.12 中的代码展示了自定义小部件的基本框架。要创建小部件，请遵循以下步骤：\n\
  \n**1.** 将 `custom.mywidget` 替换为您自己的名称。\n\n**2.** 添加带有默认值的选项。\n\n**3.** 在 `_create()`、`_refresh()`、`_destroy()`、`_setOptions()`\
  \ 和 `_setOption()` 中添加任何附加代码。\n\n**4.** 向原型对象添加附加属性或方法以实现小部件。\n\n**清单 19.12** widgets_custom.html\
  \ 实现自定义小部件的 jQuery 代码框架\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 $.widget(\"custom.mywidget\"\
  , {\n02   options : {\n03     // 自定义选项\n04   },\n05   _create: function() {\n06     //\
  \ 创建代码\n07   },\n08   _refresh: function() {\n09     // 元素刷新时调用的刷新代码\n10   },\n\
  11   _destroy: function() {\n12     // 小部件销毁时调用的清理代码\n13   },\n14   _setOptions:\
  \ function() {\n15     // _super 和 _superApply 负责保持正确的 this 上下文\n16     this._superApply(\
  \ arguments );\n17     this._refresh();\n18   },\n19   _setOption: function( key,\
  \ value ) {\n20     // 设置单个选项值的覆盖代码\n21     this._super( key, value );\n22   }\n\
  23 });\n```\n\n* * *\n\n### 总结\n\njQuery UI 包含大量内置小部件，这些小部件提供了传统 HTML 元素所缺乏的一些非常需要的功能和样式。在本课中，您了解了这些小部件以及如何在页面上实现它们，包括自动完成元素、按钮、日期选择器、对话框、菜单、进度条、滑块、微调器、标签页和工具提示。\n\
  \n### 问答\n\n**问.** 什么是 Globalize 插件，我为什么要使用它？\n\n**答.** Globalize 插件是一个项目，它简化了国际化网页以匹配不同区域设置的货币、时间和其他值格式的过程。如果您计划建立一个需要本地化元素的网站，至少值得查看一下。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固您对本课所学内容的理解。在查看答案之前，请先尝试回答问题。\n\n#### 测验\n\n**1.**\
  \ 如何从元素 `#mySlider` 获取滑块的值？\n\n**2.** 判断正误：日期选择器小部件必须附加到 `<input>` 元素上。\n\n**3.**\
  \ 如何为 jQuery UI 样式化的按钮、复选框或单选按钮附加事件处理程序？\n\n**4.** 如何填充自动完成元素的可能值？\n\n#### 测验答案\n\
  \n**1.** `$(\"#mySlider\").slider(\"value\");`\n\n**2.** 错误。\n\n**3.** 使用 jQuery\
  \ 或 JavaScript 的常规方式。\n\n**4.** 将 source 选项的值设置为一个 JavaScript 值数组。\n\n#### 练习\n\n\
