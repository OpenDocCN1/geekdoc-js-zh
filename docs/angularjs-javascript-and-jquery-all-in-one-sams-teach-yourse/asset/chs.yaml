  * * *\n\n### 调试 JavaScript\n\n你已经学会了在 JavaScript 控制台中查找 JavaScript 及其他脚本的异常错误。但如果你的脚本没有引发任何浏览器错误，只是没有按预期方式工作，该怎么办？所有浏览器都提供了非常出色的集成调试器来帮助你。以下部分介绍如何使用\
  \ Chrome 开发者工具调试 JavaScript。\n\n#### 导航 JavaScript 调试器\n\nJavaScript 调试器允许你查看随网页加载到浏览器中的\
  \ JavaScript 脚本。除了查看脚本外，你还可以设置断点、监视变量值以及查看调用堆栈，就像使用其他调试器一样。\n\n图 2.21 显示了开发者工具中可用的\
  \ JavaScript 调试器的组件。通过 JavaScript 调试器，你可以访问以下功能：\n\n![Image](img/image00767.jpeg)\
  \ **JavaScript 视图**—显示实际的 JavaScript 代码。\n\n![Image](img/image00767.jpeg) **源文件选择菜单**—此菜单显示源文件列表，包括随网页加载的\
  \ JavaScript 脚本。你可以点击此菜单选择要在视图中加载的 JavaScript 文件。\n\n\n\n\n\n![Image](img/image00767.jpeg)\
  \ **异常时暂停** — 选中此选项后，如果发生 JavaScript 异常，浏览器将进入调试器并停止执行。\n\n![Image](img/image00767.jpeg)\
  \ **监视** — 如图 2.21 所示的“监视”窗格会列出当前代码执行时可用的函数、变量、属性等。这是一个极其有价值的窗口。从这里，你可以看到代码执行时变量和对象的值。此外，你还可以通过单击监视列表顶部的加号图标，向“监视”窗格添加自己的表达式。“监视”窗格的一个强大功能是，你可以双击变量值并更改执行中使用的值。这是测试假设场景的好方法。\n\
  \n![Image](img/image00767.jpeg) **调用堆栈** — “调用堆栈”窗格提供了导致当前执行代码行的函数调用历史记录。“调用堆栈”窗格最有价值的方面之一是，你可以通过展开函数名称来查看传递给每个函数的参数值。你还可以单击函数名称，该文件将加载到\
  \ JavaScript 视图中，并且该行代码会高亮显示。\n\n![Image](img/image00767.jpeg) **断点** — 断点允许你指定在执行\
  \ JavaScript 时在何处停止。设置断点后，浏览器会在执行该行代码之前停止执行并进入调试器。你可以通过单击 JavaScript 视图中代码行的左侧来设置断点。断点用红点表示。要移除断点，请单击它。“断点”窗格会显示已设置的断点列表。你可以通过取消选中断点旁边的复选框来禁用断点。你也可以通过单击“禁用断点”按钮来禁用断点。\n\
  \n![Image](img/image00767.jpeg) **当前执行行** — 当前执行的代码行用黄色箭头表示。\n\n![Image](img/image00767.jpeg)\
  \ **恢复** — 这允许脚本继续正常执行，直到遇到另一个断点（如果存在）。\n\n![Image](img/image00767.jpeg) **单步进入**\
  \ — 单击此图标时，代码前进一行。如果该行代码正在执行另一个函数，你将进入该函数的第一行代码。\n\n![Image](img/image00767.jpeg)\
  \ **单步跳过** — 单击此图标时，代码前进一行。如果该行代码正在执行另一个函数，则该函数会被执行，然后你将进入当前函数的下一行代码。如果在单步跳过函数时遇到断点，浏览器将在脚本中的该位置停止执行。\n\
  \n![Image](img/image00767.jpeg) **单步跳出** — 单击此图标时，当前函数完成执行，你将进入调用函数的下一行代码。\n\n![Image](img/image00801.jpeg)\n\
  \n**图 2.21** 开发者工具 JavaScript 调试器提供了代码、监视、堆栈和断点视图。\n\n* * *\n\n### 动手实践：使用 JavaScript\
  \ 调试器\n\n以下示例将帮助你更熟悉 JavaScript 调试器。请考虑清单 2.4 中的代码。这是一个基本的网页，包含一个按钮和一个计数字符串。HTML\
  \ 包含两个 `<div>` 元素。第一个 `<div id=\"clicker\" onclick=\"countIt()\">` 用于一个简单的按钮。单击按钮时，会调用\
  \ JavaScript 函数 `countIt()`。第二个 `<div id=\"counter\">` 用于显示数字。\n\nJavaScript 本应在每次单击按钮时将数字增加\
  \ 1。但 JavaScript 代码存在一个问题：数字不会超过 2。\n\n### 清单 2.4 debug.html — 一个包含 JavaScript 错误的非常简单的\
  \ HTML 文档\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n\
  04     <meta charset=\"utf-8\" />\n05     <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n06     <script>\n07       function incCount(){\n08         var cnt =\
  \ 1;\n09         cnt += 1;\n10         return cnt;\n11       }\n12       function\
  \ countIt(){\n13         $(\"#counter\").html(incCount);\n14       }\n15     </script>\n\
  16     <style>\n17       #clicker{\n18         background-color: #0066AA;\n19  \
  \       color: #FFFFFF;\n20         font-weight: bold;\n21         border:2px solid,\
  \ #C0C0C0;\n22         width: 65px;\n23       }\n24     </style>\n25   </head>\n\
  26   <body>\n27     <div id=\"clicker\" onclick=\"countIt()\">Click Me</div>\n28\
  \     <div id=\"counter\">1</div>\n29   </body>\n30 </html>\n```\n\n* * *\n\n按照以下步骤在\
  \ JavaScript 调试器中设置断点并调试问题：\n\n1. 将清单 2.4 中的代码添加到项目 lesson02 文件夹中的新文件 debug.html\
  \ 中，并保存文档。\n\n2. 打开 Chrome。\n\n3. 在 Chrome 中打开以下 URL 并加载开发者工具。注意单个按钮和计数值 1：\n\n\
  \   点击此处查看代码图片\n\n   http://localhost/lesson02/debug.html\n\n4. 单击开发者工具中的“Sources”选项卡，然后从脚本选择菜单中选择\
  \ debug.html。你应该会在调试器的“Sources”区域看到清单 2.4 中的代码。注意，设置计数器 div 中值的函数位于第 7–11 行。\n\n\
  5. 通过单击行号左侧在第 8 行设置一个断点。应该会出现一个蓝色箭头，如图 2.22 所示。\n\n   ![Image](img/image00802.jpeg)\n\
  \n   **图 2.22** 开发者工具中的 JavaScript 调试器因断点而停在第 8 行。作用域变量显示 `cnt` 变量的值为 undefined。\n\
  \n6. 现在单击网页上的按钮。你应该会看到调试器中的第 8 行被高亮显示。脚本已在该行停止执行。此函数将决定放入计数器的值。注意，“作用域变量”选项卡中 `cnt`\
  \ 变量的值为 undefined。\n\n7. 单击“单步跳过”图标。你应该会看到 `cnt` 的值变为 1。\n\n8. 再次单击“单步跳过”图标。现在 `cnt`\
  \ 的值变为 2，正如预期，由 `cnt += 1;` 行更改。\n\n9. 单击“恢复”按钮，让脚本完成执行。\n\n10. 注意网页上的值已变为 2。到目前为止一切顺利。\n\
  \n11. 再次单击网页上的按钮。调试器应再次激活，并停在与步骤 6 相同的位置。注意 `cnt` 的值再次变为 undefined。\n\n12. 单击“单步跳过”图标；`cnt`\
  \ 变为 1。再次单击“单步跳过”，`cnt` 变为 2。每次单击按钮时，`cnt` 都会被重置为 undefined，然后设置为 1，再递增到 2。\n\n\
  13. 要修复此问题，请在 Eclipse 中交换原始文件中的第 7 行和第 8 行，使 `cnt` 的定义发生在 `incCount()` 的定义之前。这样，在脚本加载时（函数定义之前）只定义一次变量\
  \ `cnt` 并设置其值。保存文件。\n\n14. 在 Chrome 中单击第 8 行的断点以清除它，然后重新加载网页。\n\n15. 在第 9 行添加一个断点，如图\
  \ 2.23 所示。\n\n    ![Image](img/image00803.jpeg)\n\n    **图 2.23** 将断点从函数定义更改为函数中的第一行。\n\
  \n16. 单击网页中的按钮，JavaScript 应再次中断——这次在第 9 行。这次你不应该在“作用域变量”窗格中看到 `cnt` 变量，如图 2.24 所示。\n\
  \n    ![Image](img/image00804.jpeg)\n\n    **图 2.24** 为 `cnt` 添加一个新的监视表达式，这样你就不必每次都展开\
  \ Window 元素。\n\n\n\n\n\n**17.** 无需每次调试时都展开 Window 元素，只需点击图 2.24 所示监视列表顶部的“新建监视表达式”，输入\
  \ `cnt`，然后按回车。这会在顶部为 `cnt` 变量添加一个新的监视表达式，如图 2.24 所示。\n\n**18.** 点击“单步跳过”图标，`cnt`\
  \ 将变为 2。然后点击“继续”按钮恢复执行。\n\n**19.** 再次点击网页中的按钮，这次 `cnt` 变量将显示为 2。当你点击“单步跳过”按钮时，`cnt`\
  \ 变量将变为 3。\n\n**20.** 程序似乎运行正常，因此点击第 9 行的断点以移除断点，然后点击“继续”按钮恢复执行。\n\n**21.** 现在每次点击按钮，数字都会递增。你刚刚完成了\
  \ JavaScript 的调试。\n\n这是一个非常基础的示例，但设计得简单，以便于你跟随步骤并熟悉调试器的工作方式。在本书的练习中，你可能会多次用到调试器。请记住基本步骤：设置断点，并在单步执行代码时观察变量。\n\
  \n* * *\n\n#### 那么如何调试 jQuery 或 AngularJS？\n\n一个经常被问到的问题，即使是经验丰富的 JavaScript 调试人员也会问，就是如何调试\
  \ jQuery 或 AngularJS。答案很简单。AngularJS、jQuery 以及众多 JavaScript 插件和版本都只是额外的 JavaScript\
  \ 代码。要调试 AngularJS 或 jQuery，请在项目中使用库的非压缩版本。你将在本书后面学习如何做到这一点。\n\n下载非压缩版本的原因是压缩版本不可读。所有内容都挤在一行中，在调试器中显示不佳。非压缩版本则以可读的格式呈现。\n\
  \n* * *\n\n注意\n\n即使你无法获得 JavaScript 文件的非压缩版本，你也可以随时在 Eclipse 中打开该文件，然后从主菜单中选择“文件”->“格式化”。Eclipse\
  \ 会自动将文件格式化为可读形式。大多数 IDE 都具备此类功能。\n\n* * *\n\n当 AngularJS、jQuery 或任何其他 JavaScript\
  \ 库被格式化后，你可以像调试其他 JavaScript 文件一样调试它们。\n\n### 分析网络流量\n\n开发者工具中一个非常有用的工具是网络流量分析器，它常用于调试\
  \ JavaScript。网络流量分析器（如图 2.25 所示）可通过点击开发者工具中的“Net”选项卡来访问。流量分析器显示从浏览器到 Web 服务器的每个请求的信息。这使你能更好地了解正在传输的数据、请求是否发生以及是否按正确顺序发生。\n\
  \n![Image](img/image00805.jpeg)\n\n**图 2.25** 加载 [amazon.com](http://amazon.com)\
  \ 所需的网络流量。\n\n图 2.25 显示了加载 [amazon.com](http://amazon.com) 网页所涉及的流量。有大量请求，每个请求在流量列表中由一行表示。对于每个请求，流量中显示以下内容：\n\
  \n![Image](img/image00767.jpeg) **URL 路径** — 请求的 URL 非常有用。你可以右键单击 URL 并复制它，甚至可以在另一个标签页或窗口中打开它。这允许你调试单个请求，而不是整个网页加载。\n\
  \n![Image](img/image00767.jpeg) **方法** — 请求中使用的 HTTP 方法类型。\n\n![Image](img/image00767.jpeg)\
  \ **状态** — 你可以使用状态来确定请求是否成功以及是否仍在运行。例如，网页可能看起来不正常，因为某个图片请求加载失败，这在开发者工具的“Net”选项卡中很容易诊断。\n\
  \n![Image](img/image00767.jpeg) **类型** — 请求检索到的数据类型。\n\n![Image](img/image00767.jpeg)\
  \ **发起者** — 请求的发起位置。\n\n![Image](img/image00767.jpeg) **大小** — 大小也很有用，因为它允许你快速找到需要大量磁盘空间和网络带宽的请求。\n\
  \n![Image](img/image00767.jpeg) **延迟** — 以毫秒为单位显示请求的延迟时间。\n\n![Image](img/image00767.jpeg)\
  \ **时间线** — 显示请求所花费的时间（毫秒）。这对于诊断响应缓慢的网页以及与速度相关的其他问题非常有用。\n\n* * *\n\n注意\n\n“网络”选项卡顶部有一个选项，允许你禁用浏览器缓存。当你在\
  \ Web 服务器上更新文件以调试和修复问题时，此选项非常有用。选中此选项后，浏览器将始终从 Web 服务器获取最新内容。\n\n* * *\n\n对于某些复杂的网页，你可能会有太多流量，无法调试所有请求。“Net”选项卡中的筛选选项允许你仅查看特定类型的请求，例如\
  \ HTML、CSS 或 JS。XHR 筛选器代表 `XMLHttpRequest`，这是 AJAX 中使用的通信方式。选择 XHR 筛选器将仅显示 AJAX\
  \ 通信。\n\n当你展开一个请求时，如图 2.26 所示，你会获得关于该请求的大量附加信息。展开请求中可用的选项卡取决于请求类型和响应类型，但以下是一些最有用的项目：\n\
  \n![Image](img/image00767.jpeg) **标头** — 显示发送的 HTML 请求和响应标头。如果你通过 AJAX 访问需要发送特定标头的服务，这非常有用。\n\
  \n![Image](img/image00767.jpeg) **预览** — 显示请求数据的预览。如果是 POST 请求，它会显示发送到服务器的 POST\
  \ 请求中的参数值。\n\n![Image](img/image00767.jpeg) **响应** — 根据响应的内容而变化。例如，如果你从 Web 服务器下载\
  \ JavaScript 文件，它会显示原始 JavaScript；对于 HTML 文件，它会显示 HTML。\n\n![Image](img/image00767.jpeg)\
  \ **Cookie** — 显示请求中涉及的 Cookie 及其值。\n\n![Image](img/image00767.jpeg) **计时** — 显示请求的计时信息，包括发送时间、等待时间和下载时间。\n\
  \n![Image](img/image00806.jpeg)\n\n**图 2.26** 展开请求会提供附加选项卡，其中包含有关请求和服务器响应的更多信息。\n\
  \n### 总结\n\n在本课中，你学习了多种调试动态网页问题的方法。你学习了如何将脚本中的消息输出到 JavaScript 控制台。你学习了如何使用元素检查器查看浏览器在加载网页时构建的\
  \ HTML 元素。\n\n你还跟随了几个调试 HTML、CSS 和 JavaScript 问题的示例。你在本课中学到的方法在完成本书以及未来的项目中会非常有用，因为它们能节省大量时间，并避免因那些总是悄然出现的简单语法问题而感到沮丧。\n\
  \n### 问答\n\n**问. 有没有办法调试服务器端脚本？**\n\n**答.** 有的。这实际上超出了本书的范围；不过，大多数优秀的语言都有远程调试问题的方法。如果你正在尝试调试\
  \ PHP 服务器端脚本，请查看 ZEND 的功能，网址为 [www.zend.com/en/community/pdt](http://www.zend.com/en/community/pdt)。如果你正在使用\
  \ Python 服务器端脚本，请查看 PyDev，网址为 [pydev.org](http://pydev.org)。\n\n**问. 有没有办法调试 Cookie？**\n\
  \n\n\n\n\n**A.** 关于调试 Cookie，你只需要知道 Cookie 是否启用、浏览器中设置了哪些 Cookie、Cookie 的值是什么以及它们的过期时间。所有这些信息都可以在开发者工具的\
  \ Cookies 选项卡中找到。Chrome 和 Internet Explorer 的开发者控制台中都有类似的功能。\n\n### 工作坊\n\n工作坊包含一组问答，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\
