  \ 对象如何提供一种创建更清晰、更高效代码的方法。你学习了对象如何支持将属性和方法附加到单个变量名上。\n\n你还了解了一些内置对象，例如 `Array` 和\
  \ `String`。这些内置对象提供了属性和方法，可以用很少的代码实现快速功能——例如，使用 `Date` 对象获取系统时间、比较时间，以及创建基于时间的浏览器输出。\n\
  \n最后，你有机会创建并操作自己的 JavaScript 对象，包括属性和方法。创建自定义对象将帮助你组织脚本，使其更高效。\n\n### 问答\n\n**Q.\
  \ 内置对象、自定义对象、DOM 对象和 jQuery 对象之间有什么区别？**\n\n**A.** 区别仅在于它们的定义方式。内置对象是自动定义的，有时作为语言的一部分可用；例如数组或字符串，它们在赋值语句期间自动实例化。DOM\
  \ 对象也是 JavaScript 语言内置的。你可以在 JavaScript 中创建它们的实例，但它们也会根据 HTML 文件中的标签创建。jQuery 对象是在\
  \ jQuery 库中定义和创建的。在底层，它们都只是 JavaScript 对象。每个对象都有可用于简化 JavaScript 任务的属性和方法。\n\n**Q.\
  \ `new` 关键字用于创建对象的新实例，但我如何销毁对象实例以释放内存等？**\n\n**A.** 当变量超出作用域时，JavaScript 会自动为你清理内存。要清理\
  \ JavaScript 对象的实例，使其超出作用域即可。例如，如果它是数组的一部分，你可以使用 `pop()` 函数将其移除；或者，如果你想释放整个对象数组，可以将数组变量设置为\
  \ null。\n\n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 小测验\n\
