  \n### 总结\n\n在本课中，你学习了 Web 动画的基础知识，以及如何将它们应用于对元素所做的更改。大多数动画都可以通过 jQuery 对象上的 `.animate()`\
  \ 方法完成。你了解了动画队列、如何停止动画并清除队列，以及如何延迟动画。\n\njQuery 还提供了一些辅助函数，例如 `fadeIn()`/`fadeOut()`\
  \ 和 `show()`/`hide()`，它们简化了一些常见的动画任务。你还学习了如何创建一些实用的页面元素，以及一个用于消磨时间、让纸飞机飞行的简单应用。\n\
  \n### 问答\n\n**问. 有没有办法全局禁用所有动画？**\n\n**答.** 有。你可以将 `jQuery.fx.off` 设置为 `true`，使所有动画直接跳转到最终状态并禁用动画。如果你想在测试时禁用动画，或者允许用户在较慢的设备上禁用动画，这个功能非常有用。将该值设置为\
  \ `false` 可重新启用动画。\n\n**问. 有没有办法控制完成动画所需的步数？**\n\n**答.** 某种程度上可以。你可以将 `jQuery.fx.interval`\
  \ 设置为步与步之间的毫秒数。这控制了动画运行的帧率。不过，使用此设置时要小心；降低数值会使过渡更平滑，但也会占用更多系统资源。\n\n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\
  \n#### 测验\n\n**1.** 是否可以控制动画发生的时间？\n\n**2.** 如何对颜色变化进行动画处理？\n\n**3.** 判断正误：仅对 `width`\
  \ 属性进行动画处理将始终保持图像的宽高比。\n\n**4.** 判断正误：无法对静态元素进行移动动画处理。\n\n**5.** 有没有办法在所有动画完成后执行一个函数？\n\
  \n#### 测验答案\n\n**1.** 可以，部分实现。使用 `.delay()` 方法或 `setTimeout()`，你可以将动画延迟一段时间。\n\n\
  **2.** 必须使用十六进制颜色值，例如 `#ffffff`。\n\n**3.** 错误。如果 `height` 为 `auto`，那么该说法正确；但如果 `height`\
  \ 是具体值，则会忽略宽高比。\n\n**4.** 错误。你可以对 `margins` 和 `padding` 进行动画处理，以实现一些移动动画效果。\n\n\
  **5.** 可以，使用 `.promise()` 方法。\n\n#### 练习\n\n1. 打开清单 12.1 中的代码。在 `#title <div>` 中添加第二个\
