  \ AngularJS 应用程序，定义支持星级评分的元素。\n\n**2.** 将清单 29.14 中的代码添加到`rating.js`文件中。该文件实现了我们用于更改星级评分的\
  \ AngularJS 应用程序。注意，使用的数据来自`$scope.items`。这些数据可能来自服务、数据库或其他来源。数组`$scope.stars`在模板中用于在网页上显示星星。控制器代码中唯一需要的函数是`adjustRating`，当用户通过点击星星更改评分时调用该函数。\n\
  \n**清单 29.14** `rating.js` AngularJS 应用程序，提供在视图中支持星级评分的数据和功能\n\n点击此处查看代码图片\n\n```\n\
