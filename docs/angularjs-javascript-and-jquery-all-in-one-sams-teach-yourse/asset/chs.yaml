  \n   ```\n   13       Limit Array: {{ days | limitTo:3 }}<br>\n   ```\n\n9. 以下几行代码使用\
  \ `limit`、`uppercase` 和 `lowercase` 过滤器来修改作用域中字符串变量 `word` 的显示方式：\n\n   点击此处查看代码图片\n\
