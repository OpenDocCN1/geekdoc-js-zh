  \ 实现 JavaScript 函数以编写更简洁的代码\n\n在本书中，你将看到多个使用 jQuery 和 JavaScript 执行各种动态任务的示例。jQuery\
  \ 并不会取代 JavaScript，而是通过提供一个抽象层来增强它，用于执行某些常见任务，例如查找元素或值、更改元素的属性和属性值，以及与浏览器事件交互。\n\
  \nAngularJS 使用 JavaScript 和 jQuery 语法来提供其功能。在深入学习 AngularJS 之前，理解 jQuery 和 JavaScript\
  \ 语法对你来说非常重要。这就是为什么先介绍这些内容，而 AngularJS 将在后面的课程中讲解。\n\n\n\n\n在本课中，你将学习 JavaScript\
  \ 的基本结构和语法，以及如何使用 jQuery 来简化某些开发任务。本课的目的是帮助你熟悉 JavaScript 语言语法，这也是 jQuery 语言语法。\n\
  \n### 向网页添加 jQuery 和 JavaScript\n\n浏览器本身已内置了 JavaScript 支持。这意味着你只需将自己的 JavaScript\
  \ 代码添加到网页中，即可实现动态网页。而 jQuery 是一个额外的库，你需要在添加 jQuery 脚本之前，先将 jQuery 库添加到网页中。\n\n####\
  \ 加载 jQuery 库\n\n由于 jQuery 库是一个 JavaScript 脚本，你可以使用 `<script>` 标签将 jQuery 加载到网页中。jQuery\
  \ 既可以下载到你的代码目录，然后托管在你的 Web 服务器上，也可以使用 [jQuery.com](http://jQuery.com) 上提供的托管版本。以下语句展示了每种方式的示例；唯一的区别是第一个从\
  \ jQuery CDN 源加载，第二个从 Web 服务器加载：\n\n```\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n<script src=\"includes/js/jquery-latest.min.js\"></script>\n```\n\n\
  > **警告**\n> \n> 请记住，你需要将加载 jQuery 库的 `<script>` 元素放在任何使用它的脚本元素之前。否则，这些库将无法链接到 jQuery\
  \ 代码。\n\njQuery 库的下载文件可在以下位置找到：\n\n[`http://jquery.com/download/`](http://jquery.com/download/)\n\
  \njQuery 库的托管链接可在以下位置找到：\n\n[`http://code.jquery.com/`](http://code.jquery.com/)\n\
  \n#### 实现你自己的 jQuery 和 JavaScript\n\njQuery 代码作为 JavaScript 脚本的一部分实现。要将 jQuery 和\
  \ JavaScript 添加到网页中，首先添加一个加载 jQuery 库的 `<script>` 标签，然后添加你自己的包含自定义代码的 `<script>`\
  \ 标签。\n\nJavaScript 代码可以添加到 `<script>` 元素内部，或者 `<script>` 元素的 `src` 属性可以指向一个单独的\
  \ JavaScript 文档的位置。无论哪种方式，JavaScript 都会以相同的方式加载。\n\n以下是一对 `<script>` 语句的示例，它们加载\
  \ jQuery 并使用它。`document.write()` 函数直接将文本写入浏览器进行渲染：\n\n```\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n<script>\n  function writeIt(){\n    document.write(\"jQuery Version\
  \ \" + $().jquery + \" loaded.\");\n  }\n</script>\n```\n\n> **注意**\n> \n> `<script>`\
  \ 标签不需要添加到 HTML 文档的 `<head>` 部分；它们也可以添加到 body 中。将简单的脚本直接内联到使用它们的 HTML 元素中会很有用。\n\
  \n#### 访问 HTML 事件处理程序\n\n那么，在将 JavaScript 添加到网页后，如何让它执行呢？答案是将其绑定到浏览器事件。每次加载页面或元素、用户移动或点击鼠标、或键入字符时，都会触发一个\
  \ HTML 事件。\n\n每个受支持的事件都是接收该事件的对象的属性。如果你将该属性值设置为一个 JavaScript 函数，那么当事件被触发时，浏览器将执行你的函数。\n\
  \n例如，以下代码将在 HTML 页面的 body 加载时执行 `writeIt()` 函数：\n\n```\n<body onload=\"writeIt()\"\
  >\n```\n\n> **自己动手：实现 JavaScript 和 jQuery**\n> \n> 这些是基本步骤。现在是时候自己动手了。按照以下步骤将 jQuery\
  \ 添加到你的项目中，并在网页中动态使用它：\n> \n> 1. 在 Eclipse 中，创建一个名为 `lesson05` 的源文件夹。\n> 2. 在与 `lesson05`\
