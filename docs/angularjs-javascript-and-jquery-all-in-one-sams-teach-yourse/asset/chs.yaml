  \ 添加迷你走势图\n\n本节的目的是帮助你了解一种方法，即利用一些新的 HTML5 元素，结合动态的 jQuery 和 JavaScript 与数据的交互，为用户提供丰富的体验，并通过视觉指示器展示数据趋势。数据可以来自多种来源，包括网页上运行的\
  \ JavaScript 或通过 AJAX 请求收集的外部服务。\n\n在本节中，你将实现一系列迷你走势图。迷你走势图是一种小型图表，它会根据 Web 服务器的最新值频繁更新。迷你走势图元素为你提供了一种很好的方式，让你了解如何使用新的\
  \ HTML 元素为用户提供数据趋势的出色视觉指示器。以下各节将引导你完成实现迷你走势图的过程。\n\n* * *\n\n## 动手实践：使用简单的 jQuery、JavaScript\
  \ 和 CSS 创建动态迷你走势图\n\n本练习的目的是演示如何实现新的 HTML5 图形元素，以便在网页上渲染有用的视觉组件。在本练习中，你将使用 `<canvas>`\
  \ 元素来实现迷你走势图，并使用 jQuery 和 JavaScript 动态更新它们。示例代码见清单 14.16、14.17 和 14.18。\n\n请按照以下步骤创建动态网页：\n\
  \n**1.** 在 Eclipse 中，创建 `lesson14/dynamic_sparkline.html`、`lesson14/js/dynamic_sparkline.js`\
  \ 和 `lesson14/css/dynamic_sparkline.css` 文件。\n\n**2.** 将清单 14.16 和清单 14.18 中所示的代码添加到\
  \ HTML 和 CSS 文件中。HTML 和 CSS 相当基础。注意，其中只包含 `<div>`、`<span>`、`<label>` 和 `<canvas>`\
  \ 元素。\n\n**3.** 打开 `dynamic_sparkline.js` 文件，添加以下 `.ready()` 函数，该函数填充用于迷你走势图的数据，并启动\
  \ `adjValues()` 定时器函数。你还需要添加清单 14.17 中所示的 `adjValues()` 和 `getRandomArray()` 函数。这些函数会填充并持续更新用于迷你走势图的值。注意，数据数组通过\
  \ `.data()` 方法存储在 `<div>` 元素中：\n\n点击此处查看代码图像\n\n```\n34 $(document).ready(function(){\n\
  35   $(\"div\").each(function(){\n36     $(this).data(\"valueArr\", getRandomArray());\
  \ });\n37   adjValues();\n38 });\n```\n\n**4.** 添加以下 `renderSpark()` 函数，该函数使用数据数组中的一组值，在画布上绘制一系列线条以创建迷你走势图。第\
  \ 14 行有点小技巧：将画布的宽度设置为其当前值会擦除画布上的当前数据，因此在绘制新走势图之前会先擦除上一个走势图：\n\n点击此处查看代码图像\n\n```\n\
  13 function renderSpark(c, lineValues){\n14   c.width = c.width;\n15   var xAdj\
  \ = c.width/lineValues.length;\n16   var ctx = c.getContext(\"2d\");\n17   ctx.fillStyle\
