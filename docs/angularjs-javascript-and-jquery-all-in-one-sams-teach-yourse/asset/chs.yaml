  26 </html>\n```\n\n---\n\n## 动手实践：实现简单的时间服务\n\n在此示例中，您将构建一个简单的时间服务，为不同城市生成本地时间对象。然后，在\
  \ AngularJS 模板中，您将在多个控制器中使用该时间服务。目的是让您了解重用 AngularJS 服务是多么容易。\n\n清单 28.3 中的代码使用函数\
  \ `TimeService()` 实现了一个名为 `TimeService` 的自定义服务，以生成用于多个控制器显示不同时间的服务。清单 28.4 中的代码实现了加载并运行该应用程序的\
  \ AngularJS 模板。\n\n请按照以下步骤构建实现自定义时间服务和控制器的应用程序：\n\n1. 添加 `lesson28/service_custom_time.html`\
  \ 和 `lesson28/js/service_custom_time.js` 文件。\n\n2. 将 清单 28.3 和 清单 28.4 中显示的代码添加到\
  \ HTML 和 JavaScript 文件中。\n\n3. 清单 28.3 中的以下代码实现了一个名为 `TimeService` 的基本时间服务，该服务使用一个定义\
  \ UTC 偏移量的 `cities` 对象来获取时间。请注意，`getTZDate()` 方法接受一个城市名称，然后根据 UTC 时间和偏移量计算数据。`getCitIes()`\
  \ 函数返回该服务支持的城市列表。\n\n4. 清单 28.3 中的其余应用程序实现了多个控制器，包括 `LAController`、`NYController`、`LondonController`\
  \ 和 `TimeController`。这些控制器注入了 `TimeService` 服务，并使用它来设置某个城市的当前时间，或者对于 `TimeController`\
  \ 来说，设置所有城市的时间。\n\n5. 在浏览器中打开 清单 28.4 中的 `service_custom_time.html` 文件。该文件实现了一个\
  \ AngularJS 模板，显示 `LAController`、`NYController`、`LondonController` 和 `TimeController`\
  \ 控制器的时间。对于 `TimeController`，所有时间都使用 `ng-repeat` 显示在表格中。图 28.2 显示了生成的 AngularJS\
  \ 应用程序网页。请注意显示的不同时间。\n\n   ![图片](img/image01051.jpeg)\n\n   图 28.2 在多个控制器中使用自定义\
  \ AngularJS 服务来显示不同城市的时间。\n\n### 清单 28.3 service_custom_time.js 在多个控制器中实现和使用自定义\
  \ AngularJS 服务\n\n点击此处查看代码图片\n\n---\n\n```js\n01 var app = angular.module('myApp',\
  \ []);\n02 function TimeService() {\n```\n\n\n\n\n\n```javascript\nvar cities =\
  \ { 'Los Angeles': -8,\n               'New York': -5,\n               'London':\
  \ 0,\n               'Paris': 1,\n               'Tokyo': 9 };\nthis.getTZDate =\
  \ function(city){\n  var localDate = new Date();\n  var utcTime = localDate.getTime()\
  \ +\n                localDate.getTimezoneOffset() *\n                60*1000;\n\
  \  return new Date(utcTime +\n                 (60*60*1000 *\n                 \
  \ cities[city]));\n};\nthis.getCities = function(){\n  var cList = [];\n  for (var\
  \ key in cities){\n    cList.push(key);\n  }\n  return cList;\n};\napp.service('TimeService',\
  \ [TimeService]);\napp.controller('LAController', ['$scope', 'TimeService',\n  \
  \                              function($scope, timeS) {\n  $scope.myTime = timeS.getTZDate(\"\
  Los Angeles\").toLocaleTimeString();\n}]);\napp.controller('NYController', ['$scope',\
  \ 'TimeService',\n                                function($scope, timeS) {\n  $scope.myTime\
  \ = timeS.getTZDate(\"New York\").toLocaleTimeString();\n}]);\napp.controller('LondonController',\
  \ ['$scope', 'TimeService',\n                                    function($scope,\
  \ timeS) {\n  $scope.myTime = timeS.getTZDate(\"London\").toLocaleTimeString();\n\
  }]);\napp.controller('TimeController', ['$scope', 'TimeService',\n             \
  \                     function($scope, timeS) {\n  $scope.cities = timeS.getCities();\n\
  \  $scope.getTime = function(cityName){\n    return timeS.getTZDate(cityName).toLocaleTimeString();\n\
  \  };\n}]);\n```\n\n---\n\n## 清单 28.4 service_custom_time.html AngularJS 模板，演示如何将自定义\
