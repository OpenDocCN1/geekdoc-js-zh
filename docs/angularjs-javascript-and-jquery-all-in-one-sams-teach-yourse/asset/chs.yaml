  \n**14.** 保存这三个文件，并在 Web 浏览器中打开 `jquery_selectors.html` 文件，查看如图 7.2 所示的网页。尝试点击不同的按钮，观察按钮、标题和列表项的变化。\n\
  \n![图片](img/image00877.jpeg)\n\n**图 7.2** 一个简单的 JavaScript 网页，使用 jQuery 根据用户交互动态更改页面元素。\n\
  \n**清单 7.4** `jquery_selectors.html` HTML 文件，加载 jQuery 和 JavaScript，并附加事件处理程序元素以提供用户交互\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n04   \
