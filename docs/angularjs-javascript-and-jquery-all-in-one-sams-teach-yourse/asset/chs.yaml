  \n## 第 3 课 理解动态网页结构\n\n本课你将学到：\n\n![Image](img/image00767.jpeg) 如何构建基本的动态网页\n\n\
  ![Image](img/image00767.jpeg) 在网页中添加 CSS 和 JavaScript 的位置\n\n![Image](img/image00767.jpeg)\
  \ 块级元素与内联元素的区别\n\n![Image](img/image00767.jpeg) 如何在网页中添加图片\n\n![Image](img/image00767.jpeg)\
  \ 如何构建 Web 表单\n\n![Image](img/image00767.jpeg) 如何在网页中添加指向特定位置的链接\n\n![Image](img/image00767.jpeg)\
  \ 如何在网页中构建表格\n\n![Image](img/image00767.jpeg) HTML5 SVG 图形能做什么\n\n![Image](img/image00767.jpeg)\
  \ 使用 HTML5 为动态音频和视频做准备的方法\n\n在本书的后续章节中，你将大量使用 HTML、CSS、jQuery 和 JavaScript。为此，本课旨在完成两项任务。第一项是让你熟悉（如果你还不熟悉的话）一些重要的\
  \ HTML 基础知识，以便你能轻松理解示例。\n\n第二项是帮助你理解如何设计 HTML，以便日后使用 jQuery 和 JavaScript 更容易地为网页添加动态效果。理解如何设计\
  \ HTML 元素，将有助于你日后轻松添加炫酷效果，并动态更新存储在列表或表格中的数据。\n\n以下各节将讨论 HTML 的基础知识，以及它们与 jQuery\
  \ 和 JavaScript 的关系。\n\n### 使用 HTML/HTML5 元素构建动态网页\n\n你已经在第 1 课和第 2 课中看到了一些 HTML\
  \ 代码示例。现在是时候更深入地理解语法，以及哪些 HTML 元素和属性对动态网页至关重要了。\n\n要正确构建动态网页，你需要理解 HTML 语法、一些基本的\
  \ HTML 元素，以及如何组织和结构化这些元素。以下各节将涵盖这些主题。\n\n### 理解 HTML 结构\n\nHTML 文档由三个主要部分组成：`<!DOCTYPE>`\
  \ 标签、`head` 和 `body`。每个部分都在帮助浏览器将 HTML 文档渲染为网页方面扮演着特定角色。\n\n`<!DOCTYPE>` 标签必须是 HTML\
  \ 文件中的第一条语句；它告诉浏览器如何读取文件的其余部分。虽然这个标签并非严格必需，但建议在 HTML 文档中包含它。`<!DOCTYPE>` 元素有几种形式；下面列出其中几种：\n\
  \n![Image](img/image00767.jpeg) **HTML5**——用于 HTML5 文档的版本：\n\n```\n<!DOCTYPE html>\n\
  ```\n\n![Image](img/image00767.jpeg) **HTML 4.01 Strict**——强制严格遵守 HTML 4.01 标准，并会移除已弃用的元素（如\
  \ `<font>`）：\n\n点击此处查看代码\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \ \"http://www.w3.org/TR/html4/\nstrict.dtd\">\n```\n\n![Image](img/image00767.jpeg)\
  \ **HTML 4.01 Transitional**——对 HTML 4.01 标准放宽要求，允许使用已弃用的元素（如 `<font>`）：\n\n点击此处查看代码\n\
  \n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\" \"http://www.\n\
  w3.org/TR/html4/loose.dtd\">\n```\n\n`head` 和 `body` 组件包含在 HTML 标签内。`head` 元素的目的是包含用于解析\
  \ HTML 文档但不会在浏览器窗口中渲染的元素，例如脚本和元数据。`body` 标签的目的是包含将渲染到浏览器窗口并由用户查看的元素。\n\n以下代码展示了一个基本\
  \ HTML 文档结构的示例，包含一个 `head` 元素和一个 `body` 元素：\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n\
      <meta charset=\"UTF-8\" />\n  </head>\n  <body>\n    <h1>新页面</h1>\n  </body>\n\
  </html>\n```\n\n在处理 HTML 元素时，语法至关重要。如果浏览器无法正确解析文档，页面将无法正确呈现给用户。\n\n* * *\n\n提示\n\
  \n大多数 Web 开发 IDE 和编辑器都内置了 HTML 语法的错误检查以及代码补全功能。这些功能以多种方式呈现，例如高亮或下划线标记代码、代码行内显示警告图标，或在另一个窗格中列出潜在问题列表。请注意\
  \ IDE 试图告诉你的可能问题。\n\n* * *\n\n一个 HTML 元素由以下三个主要部分组成：\n\n![Image](img/image00767.jpeg)\
  \ **标签**——标签用 `<>` 括起来，告诉浏览器要解析和渲染哪种类型的 HTML 元素。例如，段落元素的标签是 `<p>`，无序列表的标签是 `<ul>`，列表项的标签是\
  \ `<li>`。\n\n![Image](img/image00767.jpeg) **内容**——HTML 元素的内容部分可以是另一个 HTML 元素、纯文本或空内容。为了定义\
  \ HTML 元素内部包含的内容，在内容末尾添加一个结束标签。下面的例子完美地说明了这一点。注意其中有几个 `<li>` 元素——每个都有开始标签 `<li>`、一些内容，然后是结束标签\
  \ `</li>`。`<li>` 标签的内容是它们之间的文本。还有一个开始和结束的 `<ul>` 和 `</ul>` 标签。`<ul>` 元素的内容是其中所有的\
  \ `<li>` 元素：\n\n```\n<ul>\n  <li>美国纽约</li>\n  <li>法国巴黎</li>\n  <li>意大利罗马</li>\n\
    <li>英国伦敦</li>\n</ul>\n```\n\n![Image](img/image00767.jpeg) **属性**——属性提供了一种附加元素额外信息的方式，浏览器可以使用这些信息。这些信息可用于定义浏览器如何渲染元素，或提供标识或分类元素的方法。以下示例展示了如何向段落元素添加\
  \ `align` 属性，以告诉浏览器在渲染时将文本居中。注意属性值使用等号赋值，并且值用双引号括起来：\n\n\n\n\n\n点击此处查看代码图片\n\n<p\
  \ align=\"center\">这是一段居中的文本。</p>\n\n* * *\n\n**注意**\n\n如果某个属性的值需要包含双引号，那么常规的 `attribute=\"\
  value\"` 赋值方式将无法生效。在这种情况下，你可以在赋值时使用单引号。例如，`attribute='some \"quoted\" value'`。\n\
  \n* * *\n\n如果某个元素没有结束标签，你可以在第一个标签的末尾加上 `/`，并完全省略结束标签。例如，以下两种写法对浏览器来说都是可接受的：\n\n\
  `<p align=\"center\"></p>`\n\n`<p align=\"center\" />`\n\n### 实现 HTML 头部元素\n\nHTML\
  \ 的 `<head>` 元素被设计为网页非可视化元素的容器。`<head>` 元素中的标签会被浏览器解析到 DOM 中，但不会渲染到浏览器窗口。\n\n以下各节将介绍一些比较重要的\
  \ `<head>` 元素，以及它们与使用 jQuery 和 JavaScript 的关系。\n\n### <title>\n\n`<title>` 元素在所有\
  \ HTML 文档中应该是必需的。即使没有它，浏览器仍然会渲染页面，但在网页中包含 title 元素有很多理由，包括 `<title>` 元素可以：\n\n-\
  \ ![Image](img/image00767.jpeg) 定义显示在浏览器工具栏/标签页中的标题。\n- ![Image](img/image00767.jpeg)\
  \ 提供网页添加到收藏夹时显示的标题。\n- ![Image](img/image00767.jpeg) 决定搜索引擎显示网页时的标题。\n\n以下代码展示了如何为网页添加标题：\n\
  \n```\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Page</title>\n```\n\n`<title>`\
  \ 元素的值可以很容易地通过 jQuery 和 JavaScript 更改。例如，清单 3.1 中的代码使用 JavaScript 在网页加载后更改其标题。\n\
  \n**清单 3.1 page_title.html JavaScript 代码在页面加载后更改 <title> 值**\n\n点击此处查看代码图片\n\n```\n\
  01 <!DOCTYPE html>\n02 <html>\n03   <head>\n04     <title>Page</title>\n05     <meta\
  \ charset=\"UTF-8\" />\n06     <script>\n07       function appendTitle(newTitle){\n\
  08         document.title += newTitle;\n09       }\n10     </script>\n11   </head>\n\
  12   <body onload=\"appendTitle('... Loaded')\">\n13   </body>\n14 </html>\n```\n\
  \n注意在图 3.1 中，标签页中的标题已变为 Page...Loaded。\n\n![Image](img/image00807.jpeg)\n\n**图 3.1**\
  \ JavaScript 函数已更改了浏览器标签页中显示的网页标题。\n\n#### <meta>\n\n`<meta>` 标签有多种用途。浏览器使用 `<meta>`\
  \ 标签来确定诸如渲染网页时使用哪种字符集等信息。搜索引擎爬虫使用 `<meta>` 标签来确定网页内容的目的，以便进行更优化的搜索。介绍它的最佳方式是向你展示一些语法示例。\n\
  \n在 HTML5 网页中设置字符集所需的 meta 标签如下：\n\n```\n<meta charset=\"UTF-8\">\n```\n\n在 HTML\
  \ 4 网页中设置字符集所需的 `<meta>` 标签如下：\n\n点击此处查看代码图片\n\n```\n<meta http-equiv=\"content-type\"\
  \ content=\"text/html; charset=UTF-8\">\n```\n\n为搜索引擎定义关键字的 `<meta>` 标签如下，其中 `content`\
  \ 的值是你希望搜索引擎在查找网页时使用的关键字：\n\n点击此处查看代码图片\n\n```\n<meta name=\"keywords\" content=\"\
  HTML, CSS, jQuery, JavaScript\">\n```\n\n告诉浏览器每 60 秒刷新一次网页的 `<meta>` 标签如下：\n\n点击此处查看代码图片\n\
  \n```\n<meta http-equiv=\"refresh\" content=\"300\">\n```\n\n#### <style>\n\n`<style>`\
  \ 标签允许你直接在 HTML 文档中添加 CSS 代码。`<style>` 标签内的所有内容都会被当作 CSS 文档处理，并由浏览器用于渲染网页。\n\n作为语法示例，清单\
  \ 3.2 中的 HTML 文件包含 CSS，将 `<h1>` 元素的背景设为黑色、前景设为白色，如图 3.2 所示。\n\n![Image](img/image00808.jpeg)\n\
  \n**图 3.2** 该 `<h1>` 元素的样式已被 HTML 文档中的 CSS 样式脚本反转。\n\n**清单 3.2 reversed_text.html\
  \ 使用 <style> 标签向 HTML 文档添加 CSS**\n\n点击此处查看代码图片\n\n```\n01 <html>\n02   <head>\n\
  03     <meta charset=\"UTF-8\">\n04     <style type=\"text/css\">\n05       h1 {\n\
  06         background-color:black;\n07         color:white;\n08       }\n09    \
  \ </style>\n10   </head>\n11   <body>\n12     <h1>CSS Reversed Text</h1>\n13   </body>\n\
  14 </html>\n```\n\n#### <script>\n\n`<script>` 标签使你能够直接在 HTML 文档中添加 JavaScript 代码，或链接到外部的独立\
  \ JavaScript 文件。如果包含内联 JavaScript 代码，`<script>` 标签内的所有内容都会被当作 JavaScript 文档处理，并在\
  \ HTML 文档解析时加载到浏览器中。如果包含指向外部文件的链接，该文件将从 Web 服务器下载并由浏览器加载。\n\n* * *\n\n**警告**\n\n\
  使用 `<script>` 标签时，脚本会按照解析顺序加载。这意味着任何后续具有相同全局变量或函数名的脚本都会覆盖已加载的脚本。在向网页添加多个脚本时，应小心不要覆盖你不打算覆盖的全局变量和函数名。\n\
  \n* * *\n\n例如，清单 3.3 中的 HTML 文档包含两个 `<script>` 元素：一个用于加载外部 jQuery 库，另一个包含简单的 JavaScript\
  \ 和 jQuery 函数，将 `<h1>` 元素的背景设为黑色、前景设为白色，如图 3.3 所示。\n\n![Image](img/image00809.jpeg)\n\
  \n**图 3.3** 该 `<h1>` 元素的样式已被 HTML 文档中直接使用 jQuery 的 JavaScript 函数反转。\n\n**清单 3.3\
  \ js_reversed_text.html 使用 <script> 标签向 HTML 文档添加 JavaScript 和 jQuery**\n\n点击此处查看代码图片\n\
  \n```\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n04     <meta charset=\"UTF-8\"\
  >\n05     <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
  06     <script>\n07       function reverseText(){\n08         $(\"h1\").css(\"background-color\"\
  , \"black\");\n09         $(\"h1\").css(\"color\", \"white\");\n10       }\n11 \
  \    </script>\n12   </head>\n13   <body onload=\"reverseText()\">\n14     <h1>JavaScript\
  \ Reversed Text</h1>\n15   </body>\n16 </html>\n```\n\n#### <noscript>\n\n虽然现在这种情况不常发生，但偶尔有人会在浏览器中禁用\
  \ JavaScript。如果 JavaScript 被禁用，任何 JavaScript（以及随之而来的 jQuery 脚本）都不会被执行。这可能会给用户带来非常糟糕的体验。\n\
  \n`<noscript>` 标签允许你提供在 `<body>` 元素中的内容之前渲染的元素。这样你就可以在 JavaScript 被禁用的情况下显示警告消息或页面的替代形式。\n\
  \n`<noscript>` 标签支持与 `<body>` 标签相同的子元素类型。例如，以下代码在 JavaScript 启用时加载 JavaScript 文件，但如果未启用，则在网页顶部添加一个\
  \ `<h3>` 标题，警告用户该网页将无法正常运行：\n\n点击此处查看代码图片\n\n```\n<head>\n  <script src=\"DynamicPage.js\"\
  ></script>\n  <noscript>\n    <h3>此网页使用了 JavaScript，但您的浏览器禁用了它。该网页可能无法正常运行。</h3>\n\
  \  </noscript>\n</head>\n```\n\n#### <link>\n\n\n\n\n\n`<link>` 标签允许你将独立的资源链接到当前文档。大多数情况下，它用于\
  \ CSS 文件。这意味着当浏览器加载 HTML 文档时，链接的 CSS 文件会从 Web 服务器下载并一同加载。例如，下面的 head 块将加载两个不同的 CSS\
  \ 文档：\n\n点击此处查看代码图片\n\n```\n<head>\n  <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"styleA.css\">\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"styleB.css\"\
  >\n</head>\n```\n\n除了 CSS 文件，你还可以将图标、帮助文档、许可证和搜索等内容链接到网页。例如，以下代码链接了一个图标，当网页加载时，该图标会显示在浏览器标签页中：\n\
  \n点击此处查看代码图片\n\n```\n<link rel=\"icon\" type=\"image/png\" href=\"http://example.com/myicon.png\"\
  >\n```\n\n### 添加 HTML 主体元素\n\n大多数添加到 body 块中的 HTML 元素都会由浏览器渲染并显示在屏幕上供用户查看。每个 HTML\
  \ 主体元素标签都提供了不同的选项，帮助你以有意义且优雅的方式在网页上展示信息。\n\n在接下来的章节中，你将看到一些在 jQuery 和 JavaScript\
  \ 编程时对 HTML 元素有用的特定属性。你还会学习一些常见元素的语法，这些元素将在本书后续内容中频繁出现，以便你更容易理解示例。\n\n#### 使用重要的主体元素属性\n\
  \n每个不同的主体元素都有一些仅适用于该元素的属性。然而，有些属性对所有元素都很重要且通用。这些属性如下：\n\n![Image](img/image00767.jpeg)\
  \ `id`——这是一个字符串标识符，在网页上的所有元素中必须唯一。CSS、JavaScript 和 jQuery 使用它来识别、访问和修改网页上的特定元素。\n\
  \n![Image](img/image00767.jpeg) `class`——`class` 属性允许你指定多个元素的分组。此选项在 CSS 样式化中大量使用，可以一次性为多个\
  \ HTML 元素设置诸如 `background-color` 之类的样式。在 jQuery 中，它也用于根据类值选择多个元素。\n\n![Image](img/image00767.jpeg)\
  \ `style`——`style` 属性允许你将 CSS 定义直接放置在 HTML 对象内部的 HTML 代码中。`style` 中的值会覆盖所有其他 CSS\
  \ 指令。\n\n以下代码演示了如何向 HTML 元素添加 `id`、`class` 和 `style` 属性的语法。注意，类 \"`heading`\" 和\
  \ \"`content`\" 被多次使用，但每个元素的 `id` 属性都不同。还要注意，对于第一个标题，添加了一个额外的 style 属性，强制第一个标题始终为粗体：\n\
  \n点击此处查看代码图片\n\n```\n<div id=\"Div1\">\n  <p id=\"Div1Heading\" class=\"heading\"\
  \ style=\"font-weight:bold\">Heading Text</p>\n  <p id =\"Div1Content\" class =\"\
  content\">Some Content</p>\n</div>\n<div id=\"Div2\">\n  <p id=\"Div2Heading\" class=\"\
  heading\">Another Heading Text</p>\n  <p id =\"Div2Content\" class =\"content\"\
  >Some More Content</p>\n</div>\n```\n\n#### 理解块级元素与内联元素\n\n请记住，浏览器通过解析 HTML 文档中的每个元素并将其与任何子元素一起渲染，从而将网页显示到屏幕上。块级元素和内联元素的区别在于浏览器为元素分配的空间大小。\n\
  \n块级元素会获得可用的完整宽度来在浏览器中渲染该项。这意味着之前的任何元素都会显示在其上方，之后的元素则会显示在其下方。`<div>` 和 `<p>` 是块级元素的例子。\n\
  \n内联元素只获得足够的宽度来在页面上显示该元素。这意味着只要空间足够，多个内联元素会在浏览器中并排显示。`<span>`、`<a>` 和 `<img>` 是内联元素的一些例子。\n\
  \n以下代码及其渲染版本（如图 3.4 所示）说明了块级标签和内联标签之间的区别。注意，`<p>` 标签占据了浏览器屏幕的完整宽度，而 `<span>` 标签只占用显示文本和边距所需的空间：\n\
  \n```\n<p>Paragraph A</p>\n<p>Paragraph B</p>\n<p>Paragraph C</p>\n<span>Span A</span>\n\
  <span>Span B</span>\n<span>Span CA</span>\n```\n\n![Image](img/image00810.jpeg)\n\
  \n**图 3.4** 块级元素 `<p>` 占据整个宽度，而内联元素 `<span>` 只使用它需要的宽度。\n\n尽管元素默认是块级或内联的，但你始终可以通过设置\
  \ `display` CSS 样式来更改它们。例如，将 `<span>` 的 display 设置为 block 如下所示，将使其表现得像 `<div>` 元素：\n\
  \n点击此处查看代码图片\n\n```\n<span style=\"{display:block;}\">Span Text</span>\n```\n\n\
  以下是你可以为 display 样式设置的值列表：\n\n![Image](img/image00767.jpeg) `block`——将元素渲染为块级元素。\n\
  \n![Image](img/image00767.jpeg) `inline`——将元素渲染为内联元素。\n\n![Image](img/image00767.jpeg)\
  \ `none`——即使元素已被解析并存在于 DOM 中，也不会将其渲染到屏幕上。\n\n你还可以通过使用以下换行标签之一来强制项目在其他项目下方渲染：\n\n\
  ![Image](img/image00767.jpeg) `<br>`——添加一个换行，使之后的内容在当前内容下方渲染，即使它们是内联的。\n\n![Image](img/image00767.jpeg)\
  \ `<hr>`——类似于 `<br>`，但还会导致浏览器在当前内容下方渲染一条水平线。\n\n这些标签不需要结束标签。例如，以下代码创建了一组三个 `<span>`\
  \ 元素，它们首先由 `<br>` 标签分隔，然后由 `<hr>` 标签分隔。渲染结果如图 3.5 所示。注意，`<br>` 插入了一个换行，而 `<hr>`\
  \ 插入了一个换行并在内容之间渲染了一条线：\n\n点击此处查看代码图片\n\n```\n<span>Text on</span>\n<span> Line 1</span><br>\n\
  <span>Text on Line 2</span><hr>\n<span>New section on Line 3</span>\n```\n\n![Image](img/image00811.jpeg)\n\
  \n**图 3.5** 使用 `<br>` 添加换行，`<hr>` 添加换行并在内容之间渲染一条线。\n\n#### 创建容器元素\n\n容器元素用于多种目的，例如对元素或文本集进行分组和格式化。这允许你将格式和尺寸应用于容器，并使其影响容器内的所有项目。尽管几乎任何\
  \ HTML 元素都可以用作容器，但主要有三个：`<p>`、`<div>` 和 `<span>`。\n\n容器元素本身不会改变其中文本或数据的外观。例如，以下所有内容中的文本在浏览器中渲染效果相同：\n\
  \n```\nSome Text\n<p>Some Text <p>\n<div>Some Text </div>\n<span>Some Text</span>\n\
  ```\n\n* * *\n\n#### 自己动手：使用容器元素进行分组和样式化\n\n容器元素通常用于将元素分组以进行布局和样式设置。以下练习创建了清单 3.4\
  \ 中的代码。该代码旨在向你介绍分组和样式化元素：\n\n1. 首先在 Eclipse 项目中创建一个名为 `lesson03` 的文件夹。\n2. 在 `lesson03`\
  \ 文件夹中创建一个名为 `css_styling.html` 的新 HTML 文档（与本书网站上的文件名一致）。\n3. 添加适当的 `<html>`、`<head>`\
  \ 和 `<body>` 标签。\n4. 添加以下 `<div>` 元素，并将其 `class` 属性设置为 \"`heading`\"。\n\n这将是你的标题项的容器：\n\
  \n点击此处查看代码图片\n\n```\n20     <div class=\"heading\">\n21       <p>Heading A</p>\n\
  22       <p>Heading B</p>\n```\n\n\n\n\n\n```\n<p>Heading C</p>\n</div>\n```\n\n\
  **5.** 添加第二个 `<div>` 元素，并将 `class` 属性设置为 `content`。这是内容项的容器：\n\n```\n<div class=\"\
  content\">\n  <p>Paragraph A</p>\n  <p>Paragraph B</p>\n  <p>Paragraph C</p>\n</div>\n\
  ```\n\n**6.** 保存文件，并在 Web 浏览器中加载以下 URL，以查看未格式化的代码，如图 3.6 所示：\n\n`http://localhost/lesson03/css_styling.html`\n\
  \n![Image](img/image00812.jpeg)\n\n**图 3.6** 使用 `<div>` 容器元素可以轻松更改网页不同区域中 `<p>`\
  \ 元素的外观和行为。\n\n**7.** 返回 Eclipse，在文件的头部添加一个 `<style>` 标签。\n\n**8.** 在 `<style>`\
  \ 标签内，添加以下代码，为内容元素设置灰色背景和边缘内边距：\n\n```\n.content p{\n  background-color:#C0C0C0;\n\
  \  padding: 3px;\n}\n```\n\n**9.** 添加以下额外规则来设置标题元素的样式。此规则将标题容器中的 `<p>` 元素更改为内联显示，并带有粗体白色文本和黑色背景：\n\
  \n```\n.heading p{\n  display: inline;\n  background-color:black;\n  color: white;\n\
  \  font-weight:bold;\n  padding:3px;\n}\n```\n\n**10.** 保存文档，然后在 Web 浏览器中重新加载。注意在图\
  \ 3.6 中，`heading` 类的 `<div>` 元素中的元素呈现为内联，带有黑色背景和白色文本；而 `content` 类的 `<div>` 元素中的元素呈现为灰色背景，并保持块级样式。\n\
  \n**清单 3.4 css_styling.html 使用 `<style>` 标签向 HTML 文档添加 CSS**\n\n```\n<html>\n  <head>\n\
  \    <title>CSS Styling</title>\n    <meta charset=\"UTF-8\">\n    <style type=\"\
  text/css\">\n      .content p{\n        background-color:#C0C0C0;\n        padding:\
  \ 3px;\n      }\n      .heading p{\n        display: inline;\n        background-color:black;\n\
  \        color: white;\n        font-weight:bold;\n        padding:3px;\n      }\n\
  \    </style>\n  </head>\n  <body>\n    <div class=\"heading\">\n      <p>Heading\
  \ A</p>\n      <p>Heading B</p>\n      <p>Heading C</p>\n    </div>\n    <div class=\"\
  content\">\n      <p>Paragraph A</p>\n      <p>Paragraph B</p>\n      <p>Paragraph\
  \ C</p>\n    </div>\n  </body>\n</html>\n```\n\n在 JavaScript 和 jQuery 开发中，你将大量使用容器元素来分组、格式化和控制动态网页的各个方面。\n\
  \n## 添加链接元素\n\n网页通常包含一系列指向其他页面的链接。使用锚点标签 `<a>` 可以轻松向网页添加链接。`<a>` 标签有三个用途：\n\n###\
  \ 链接到外部网页\n\n在网页上显示一个链接。当用户点击该链接时，浏览器会向服务器请求链接中的网页。以下是向外部网页添加链接的示例：\n\n```\n<a href=\"\
  http://www.dayleycreations.com/\">Dayley Creations</a>\n```\n\n### 链接到当前网页中的位置\n\
  \n在网页上显示一个链接。当用户点击该链接时，浏览器会向下滚动到该位置，使链接到的锚点可见：\n\n```\n<a href=\"#local link\">链接到下方某段文本</a>\n\
  ```\n\n### 网页锚点\n\n在网页内部添加一个链接，该链接可以被当前页面或其他网页直接链接到。要定义锚点，需要使用 `id` 属性。例如，为上述链接添加锚点，请使用以下代码：\n\
  \n```\n<a id=\"local_link\">页面锚点</a>\n```\n\n在使用 JavaScript 构建链接元素时，网页锚点非常有用。例如，你可以动态更改链接的\
  \ `url` 属性，以控制链接将用户带到何处。\n\n## 使用图像元素\n\n网页最强大的功能之一就是能够显示图像以及其他图形和文本。图像使用 `<img>`\
  \ 标签显示。\n\n`<img>` 标签中要显示的实际图像文件由 `src` 属性决定。图像在屏幕上的大小由 `height` 和 `width` 属性决定。\n\
  \n以下代码展示了以不同大小和空白显示图像的示例，如图 3.7 所示。注意，当仅指定 `height` 或 `width` 时，图像会按比例缩放以保持宽高比；但当同时指定两者时，图像会被拉伸以适应特定的高度和宽度设置：\n\
  \n```\n<img src=\"/images/peak.jpg\" height=\"200px\"/>\n<img src=\"/images/peak.jpg\"\
  \ width=\"200px\"/>\n<img src=\"/images/peak.jpg\" height=\"200px\" width=\"200px\"\
  />\n```\n\n![Image](img/image00813.jpeg)\n\n**图 3.7** 使用 `<img>` 向网页添加图像并指定高度和宽度。\n\
  \n在使用 jQuery 和 JavaScript 创建动态网页时，你也会经常处理图像，因为它们允许你快速调整大小、移动、隐藏和添加到网页中。这使你的图像能够与鼠标操作和其他用户输入进行交互。\n\
  \n## 应用列表元素\n\n列表元素允许你将一组项目组合在一起，并让浏览器自动使用项目符号或数字进行格式化。有序列表使用 `<ol>` 标签创建，无序列表使用\
  \ `<ul>` 标签创建。列表中的项目包含在 `<li>` 标签中。例如，以下代码渲染为图 3.8：\n\n```\n<ul>\n  <li>黄石</li>\n\
  \  <li>优胜美地</li>\n  <li>冰川</li>\n  <li>拱门</li>\n  <li>锡安</li>\n</ul>\n```\n\n![Image](img/image00814.jpeg)\n\
  \n**图 3.8** 使用 `<ul>` 和 `<li>` 标签向网页添加列表。\n\n## 创建表格元素\n\n表格元素是较为复杂的 HTML 元素之一。它们用于在屏幕上以行和列的形式组织其他元素。它们可用于多种目的，从布局整个网页到简单的数据表格。本节介绍本书所需的基础知识。\n\
  \n表格通过一系列定义表格、表头、主体和单元格的标签构建。以下是构建表格时可使用的各种标签：\n\n- `<table>` — 作为所有其他表格元素的容器，并定义整个表格。\n\
  - `<thead>` — 此元素不是必需的，但它很有用，因为它允许你分组和定义表格中的表头元素，或者通过 `id` 属性直接从 jQuery 或 JavaScript\
  \ 引用表头元素的父元素。\n- `<tbody>` — 此元素也不是必需的，但它有助于定义表格的整体主体，或者通过 `id` 属性直接从 jQuery 或 JavaScript\
  \ 引用主体元素的父元素。\n- `<th>` — 定义表格中的单个表头单元格。\n- `<td>` — 定义表格中的一个单元格。\n\n\n\n\n\n- ![Image](img/image00767.jpeg)\
  \ `<tr>` — 定义表格中的一行。它是 `<th>` 和/或 `<td>` 元素或单元格元素的容器。\n- ![Image](img/image00767.jpeg)\
  \ `<caption>` — 提供标题内容的容器。标题内容可以是文本或其他 HTML 元素。\n- ![Image](img/image00767.jpeg)\
  \ `<colgroup>` — 允许你将表格中的一列或多列放入一个组中，以便统一设置格式。如果你希望通过 `id` 属性从 jQuery 或 JavaScript\
  \ 访问特定的列集合，这也很有用。\n- ![Image](img/image00767.jpeg) `<col>` — 指定 `<colgroup>` 元素中单个列的列属性。\n\
  - ![Image](img/image00767.jpeg) `<tfoot>` — 此元素不是必需的，但它很有用，因为它允许你对表格中的页脚元素进行分组和定义，或者通过\
  \ `id` 属性直接从 jQuery 或 JavaScript 引用页脚元素的父元素。\n\n在 HTML 4 中，可以在表格元素上设置多个属性。其中许多属性在\
  \ HTML5 中已被弃用，因为它们用于设置大小、对齐和颜色，而这些应该通过 CSS 样式来完成。以下是你在表格元素上仍然需要使用的一些重要属性：\n\n- ![Image](img/image00767.jpeg)\
  \ `border` — 指定表格单元格是否应有边框。\n- ![Image](img/image00767.jpeg) `colspan` — 指定一个单元格应跨越的列数。这允许单个\
  \ `<td>` 或 `<th>` 元素在表格中占据多列。\n- ![Image](img/image00767.jpeg) `rowspan` — 指定一个单元格应跨越的行数。这允许单个\
  \ `<td>` 或 `<th>` 元素在表格中占据多行。\n- ![Image](img/image00767.jpeg) `headers` — 添加到 `<td>`\
  \ 或 `<th>` 元素中。允许你指定一个或多个 `<th>` 元素的 `id` 值。这会创建与标题元素的关联，可以通过 jQuery 和 JavaScript\
  \ 访问。\n\n* * *\n\n## 动手实践：创建 HTML 表格\n\n解释表格最简单的方法就是向你展示一个创建基本表格的示例。按照以下步骤创建 清单\
  \ 3.5 中的表格代码：\n\n**1.** 在 lesson03 文件夹中创建一个名为 `tables.html` 的新 HTML 文档（与本书网站上的文件名一致）。\n\
  \n**2.** 添加适当的 `<html>`、`<head>` 和 `<body>` 标签。\n\n**3.** 添加以下 `<table>` 元素，并将 `border`\
  \ 属性设置为 1：\n\n点击此处查看代码图片\n\n```\n08     <table border=1></table>\n```\n\n**4.**\
  \ 在 `<table>` 元素内部添加以下 `<caption>` 元素，为表格添加标题：\n\n点击此处查看代码图片\n\n```\n09     <caption>Favorite\
  \ World Sites</caption>\n```\n\n**5.** 通过向 `<table>` 元素添加以下 `<thead>` 元素来创建表格标题。注意，第三个\
  \ `<th>` 将 `colspan` 设置为 2，以便它覆盖最后两列，如 图 3.9 所示：\n\n点击此处查看代码图片\n\n```\n10     <thead>\n\
  11       <th>Monument</th>\n12       <th>location</th>\n13       <th colspan=2>century</th>\n\
  14     </thead>\n```\n\n![Image](img/image00815.jpeg)\n\n**图 3.9** 一个 HTML 表格示例，显示了行和列中的标题以及一个标题。\n\
  \n**6.** 添加以下 `<tr>` 元素。注意，在下面的示例中，每个 `<tr>` 元素都包含四个单元格。第一个单元格是行标题，因为它使用了 `<th>`\
  \ 标签。接下来的两个单元格是 `<td>` 元素中的简单文本，但在第四个单元格中，`<td>` 元素包含一个 `<img>` 元素（.jpg 文件可以在本书网站上找到）：\n\
  \n点击此处查看代码图片\n\n```\n15     <tr>\n16       <th>Delicate Arch</th>\n17       <td>Utah</td>\n\
  18       <td>March 1, 1872</td>\n19       <td><img src=\"/images/arch.jpg\" width=\"\
  100\" />\n20     </tr>\n```\n\n**7.** 保存文档，并在 Web 浏览器中打开以下 URL，查看 图 3.9 中显示的渲染结果：\n\
  \n点击此处查看代码图片\n\n```\nhttp://localhost/lesson03/tables.html\n```\n\n**清单 3.5 tables.html**\
  \ 生成带有标题、行和列的表格的 HTML\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 <!DOCTYPE html>\n02 <html>\n\
  03 <head>\n04   <title>Tables</title>\n05   <meta Charset=\"UTF-8\">\n06 </head>\n\
