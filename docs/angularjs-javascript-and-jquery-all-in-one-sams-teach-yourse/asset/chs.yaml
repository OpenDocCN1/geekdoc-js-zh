  \ jQuery UI 的 draggable 和 droppable 小部件，将某些元素设置为可拖动、另一些设置为可放置，从而创建了一些拖放元素。\n\n添加\
  \ selectable 小部件后，你可以绘制一个边界框或套索来选中多个项目。你使用 resizable 小部件使容器（如 `<div>`）可调整大小，并且还调整了内部内容的大小。\n\
  \n最后，你学习了如何实现 sortable 小部件来对 `<div>` 和 `<tbody>` 中的项目进行排序。可排序容器中的元素也可以从一个容器拖到另一个容器。\n\
  \n### 问答\n\n**问：是否可以创建自定义的交互小部件？**\n\n**答：** 可以。使用 jQuery UI 的 `jquery.widget` 工厂，你可以创建自定义小部件，并在原型中提供你需要的任何功能。\n\
  \n**问：有没有办法阻止鼠标事件发生在使用 jQuery UI 小部件扩展的项目内部的元素上？**\n\n**答：** 有。以下代码会取消元素 `#myList`\
  \ 中具有 `class=\"notSelectable\"` 的项目的鼠标事件：\n\n```\n$(\"#myList\").mouse({ cancel:\"\
  .notSelectable\"});\n```\n\n### 实践练习\n\n实践练习包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\
  \n#### 小测验\n\n**1.** 当使一个项目可拖动时，应该使用哪个选项来在拖动时保持原始项目不动？\n\n**2.** 当一个可拖动的项目准备被放入可放置区域时，会触发哪个可放置事件？\n\
  \n**3.** 判断对错：在使用 resizable 小部件调整图像大小时，无法保持固定的宽高比。\n\n**4.** 有没有办法限制 selectable\
  \ 小部件选中的项目？\n\n#### 小测验答案\n\n**1.** 将 `helper` 设置为 `\"clone\"` 或其他 DOM 对象。\n\n**2.**\
  \ `dropover`\n\n**3.** 错误。你可以设置 `aspectRatio` 选项来固定宽高比。\n\n**4.** 可以。使用 `filter`\
  \ 选项。\n\n#### 练习\n\n**1.** 打开清单 18.7、18.8 和 18.9 中的代码，为 `#resize2` 添加一个 `resize`\
  \ 处理程序。根据元素调整后的宽度和高度更改 `font-size` 属性。\n\n**2.** 打开清单 18.13、18.14 和 18.15 中的代码，修改\
  \ `#sortTable` 元素，使其与 `#sorter2` 连接。你需要移除 `axis` 限制，并更改 `#sort2` 的 `width` 以处理额外的宽度。\n\
  \n## 第 19 课：使用 jQuery UI 小部件为网页添加丰富的交互\n\n本课你将学到：\n\n- ![Image](img/image00767.jpeg)\
  \ 添加自动完成、滑块和微调框元素\n- ![Image](img/image00767.jpeg) 如何在表单中添加 `datepicker` 日历\n- ![Image](img/image00767.jpeg)\
  \ 美化对话框和按钮的方法\n- ![Image](img/image00767.jpeg) 实现工具提示\n- ![Image](img/image00767.jpeg)\
  \ 使用自定义菜单和选项卡面板组织网页\n- ![Image](img/image00767.jpeg) 如何在工作流程中应用状态栏\n\njQuery UI\
  \ 提供了大量预构建的小部件，为 HTML 元素提供了扩展功能。这些小部件使表单和其他输入控件更加直观易用，例如用于选择日期的日历视图和可展开的菜单。\n\n\
  本课将向你介绍这些内置小部件，帮助你入门。本课的目的是让你了解有哪些小部件可用，以及如何将它们应用到你的网页中。示例非常基础，因此你还应查阅 jQuery UI\
  \ 网站上的文档，以获取有关你可能想使用的特定小部件的更多信息：[`api.jqueryui.com/category/widgets/`](http://api.jqueryui.com/category/widgets/)。\n\
  \n\n\n\n本课没有包含“自己尝试”部分，因为示例都很基础且易于理解。每个列表项的代码以及配套图片都可以在本书网站 `code/lesson19` 中找到。\n\
  \n### 回顾小部件\n\n在开始之前，本节回顾了如何在小部件元素上访问选项和属性值，因为这和普通的 jQuery 对象略有不同。\n\n创建小部件时，选项在传递给构造函数的对象中指定。例如，以下代码为滑块小部件设置了\
  \ `min` 和 `max` 选项：\n\n点击此处查看代码图片\n\n```\n$(\"#mySlider\").slider({min:2, max:10});\n\
  ```\n\n之后要访问这些选项，需要在 `.slider()` 调用中指定 `\"options\"` 作为参数。例如，以下代码设置并获取了 `max` 选项：\n\
  \n点击此处查看代码图片\n\n```\nvar slider = $(\"#mySlider\").slider({min:2, max:10});\n\n\
  slider.slider(\"option\", \"max\", 100);\n\nvar currentMax = slider.slider(\"option\"\
  , \"max\");\n```\n\n小部件的属性值以类似的方式访问。例如，以下代码获取并设置了滑块上 `value` 属性的值：\n\n点击此处查看代码图片\n\
  \n```\nvar value = $(\"#mySlider\").slider(\"value\");\n\n$(\"#mySlider\").slider(\"\
  value\", value+5 );\n```\n\n实际上，`value` 和 `options` 是滑块小部件上的方法，当作为第一个参数传入时会被调用。\n\
  \n### 添加可展开的手风琴元素\n\n手风琴小部件将成对的标题和内容组合成一个可展开的手风琴视图。手风琴小部件应用于一个容器元素，并识别所有标题。`header`\
