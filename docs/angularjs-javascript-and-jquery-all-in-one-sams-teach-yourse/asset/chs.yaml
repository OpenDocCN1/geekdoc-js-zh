  ---\n\n---\n\n## 动手实践：实现嵌套指令\n\n最后一个示例展示了如何将指令相互嵌套并让它们交互。嵌套指令是为彼此相关的自定义元素提供父级上下文和容器的绝佳方式。在本例中，外部指令\
  \ `myPhotos` 充当容器，可以包含名为 `myPhoto` 的子指令。\n\n其思路是，你可以添加一个 `<my-photos></my-photos>`\
  \ 元素，然后在其中添加 `<my-photo></my-photo>` 元素。每个 `myPhoto` 元素都会被添加到 `myPhotos` 控制器的作用域中，从而可以显示照片标题，并轻松切换每个\
  \ `myPhoto` 元素的 `active` 属性。\n\n请按照以下步骤，使用操作 DOM 的自定义指令构建应用程序：\n\n1. 添加 `lesson25/directive_custom_photos.html`、`my_photos.html`\
  \ 和 `lesson25/js/directive_custom_photos.js` 文件。\n\n2. 将清单 25.5、清单 25.6 和清单 25.7\
  \ 中所示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 以下来自清单 25.5 的代码行实现了 `myPhotos` 指令。`myPhotos`\
  \ 指令被设计为稍后定义的 `myPhoto` 指令的容器。请注意，以下代码行定义了一个控制器，该控制器为 `myPhotos` 指令提供功能，包括一个 `addPhoto()`\
  \ 函数：\n\n   点击此处查看代码图片\n\n   ```\n   02 .directive('myPhotos', function() {\n  \
  \ 03   return {\n   04     restrict: 'E',\n   05     transclude: true,\n   06  \
  \   scope: {},\n   07     controller: function($scope) {\n   08       var photos\
  \ = $scope.photos = [];\n   09       $scope.select = function(photo) {\n   10  \
  \       angular.forEach(photos, function(photo) {\n   11           photo.selected\
  \ = false;\n   12         });\n   13         photo.selected = true;\n   14     \
  \  };\n   15       this.addPhoto = function(photo) {\n   16         photos.push(photo);\n\
  \   17       };\n   18     },\n   19     templateUrl: 'my_photos.html'\n   20  \
  \ };\n   21 })\n   ```\n\n4. 以下来自 `myPhotos` 指令的代码行指定了在渲染该指令时应使用 `my_photos.html`\
  \ 作为模板：\n\n   点击此处查看代码图片\n\n   ```\n   19     templateUrl: 'my_photos.html'\n  \
  \ ```\n\n5. 以下来自清单 25.7 的代码行实现了由 `myPhotos` 指令加载的部分模板。它生成一个 `<div>` 容器，然后使用 `myPhotos`\
  \ 作用域中的 `photos` 数组构建一个链接列表，这些链接通过 `ng-click` 绑定到 `select()` 函数。`<div ng-transclude></div>`\
  \ 为 `myPhoto` 子元素提供了容器：\n\n   点击此处查看代码图片\n\n   ```\n   01 <div>\n   02   <div  class=\"\
  imgList\" >\n   03       <li ng-repeat=\"photo in photos\"\n   04             ng-class=\"\
  {active:photo.selected}\">\n   05         <a href=\"\" ng-click=\"select(photo)\"\
  >{{photo.title}}</a>\n   06       </li>\n   07   </div>\n   08   <div class=\"imgView\"\
  \ ng-transclude></div>\n   09 </div>\n   ```\n\n6. 以下来自清单 25.5 的代码定义了 `myPhoto`\
