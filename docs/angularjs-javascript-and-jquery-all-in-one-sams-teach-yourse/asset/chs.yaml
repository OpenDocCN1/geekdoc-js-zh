  ```\n\n* * *\n\n### 智能表单流程控制\n\n动态表单控制的另一个重要方面是动态帮助用户浏览网页表单。这在处理更复杂的网页表单时尤其重要。帮助用户浏览网页表单的方式包括：自动改变焦点、隐藏不再相关的元素、在需要时显示新元素，以及禁用不可更改的元素。\n\
  \n使用这些方法可以让网页表单具有交互性和丰富的体验，从而使用户更容易填写表单。以下各节讨论网页表单控制的基本概念。\n\n#### 自动聚焦和失焦表单元素\n\
  \n网页表单的一个很好的流程控制功能是，当你知道用户准备输入某个元素时，自动聚焦该元素。例如，如果用户选择了年份，下一个元素是月份选择，那么自动将月份设为活动状态是合理的。\n\
  \n要在 jQuery 中设置元素的焦点，可以对该对象调用 `.focus()` 方法。例如，以下代码为 `id=\"nextInput\"` 的对象设置焦点：\n\
  \n```\n$(\"#nextInput\").focus();\n```\n\n你也可以通过调用 `.blur()` 方法，将用户导航离开某个元素，使其失焦：\n\
  \n```\n$(\"#nextInput\").blur();\n```\n\n#### 智能隐藏和显示元素\n\n为网页表单提供流程控制的另一个好技巧是动态隐藏和显示元素。实际上，少即是多，意味着你不必向用户展示超出他们需要填写的元素。\n\
  \n例如，如果表单同时包含男装尺码和女装尺码的元素，不要同时显示两者。等待用户选择性别，然后显示相应的尺码元素。\n\n在 jQuery 中，可以使用 `.show()`\
  \ 和 `.hide()` 方法来显示和隐藏表单元素。或者，如果你只想让元素不可见但仍占据空间，可以将 CSS 的 `opacity` 属性设置为 0 或 1。\n\
  \n#### 禁用元素\n\n禁用网页元素仍会显示它们，但用户无法与之交互。通常，只有在希望用户仍然能看到元素的值时，禁用表单元素才比隐藏它更有意义。\n\n\
  要禁用表单元素，需要设置 `disabled` 属性。在 JavaScript 中，可以直接在 DOM 对象上设置。在 jQuery 中，使用 `.prop()`\
  \ 方法。例如：\n\n点击此处查看代码图片\n\n```\n$(\"#deadElement\").prop(\"disabled\", \"disabled\"\
  );\n```\n\n要重新启用禁用的元素，移除 `disabled` 值。例如：\n\n点击此处查看代码图片\n\n```\n$(\"#deadElement\"\
  ).prop(\"disabled\", \"\");\n```\n\n#### 控制提交和重置\n\n\n\n\n表单流程控制的另一个重要方面是动态拦截 `submit`\
  \ 和 `reset` 事件，并根据各种条件执行操作。例如，在允许提交表单之前，你可能需要验证表单值。\n\n你可以通过为表单附加一个 `submit` 事件处理程序来控制表单提交功能。在事件处理程序内部，你可以访问事件的相关信息以及将要提交的表单数据。你可以执行所需的任何任务，然后允许表单提交或\
  \ `reset`，或者阻止浏览器的默认操作。\n\n以下代码演示了如何通过调用事件的 `.preventDefault()` 方法来停止表单提交：\n\n点击此处查看代码图像\n\
  \n```js\n$(\"form\").submit(function(e){\n\n    alert(\"抱歉，尚未实现。\");\n\n    e.preventDefault();\n\
  \n  });\n```\n\n由于某些原因，jQuery 没有为表单的 `reset` 事件提供事件处理程序。要在 jQuery 中解决这个问题，请将重置按钮的输入\
  \ `type` 从 `reset` 改为 `button`。然后为按钮事件添加一个 `click` 处理程序，在该处理程序中调用表单 DOM 元素的 `.reset()`\
  \ 方法。以下代码基于用户提示实现了这一点：\n\n点击此处查看代码图像\n\n```js\n$(\"#resetB\").click(function(e){\n\
  \n    if(confirm(\"你确定吗？\")){ $(\"form\").get(0).reset(); }\n\n  });\n```\n\n---\n\
  \n## 动手实践：为表单添加动态流程控制\n\n现在你已经有机会回顾了表单流程控制的概念，可以自己尝试一下了。在本练习中，你将为一个用于接收付款的电子商务网页表单添加一些基本的流程控制。\n\
  \n本练习的目的是让你在用户与表单交互时，获得隐藏、显示、禁用和自动聚焦网页元素的经验。示例代码位于清单 13.4、13.5 和 13.6 中。\n\n请按照以下步骤创建动态网页：\n\
  \n1. 在 Eclipse 中，创建 `lesson13/form_flow.html`、`lesson13/js/form_flow.js` 和 `lesson13/css/form_flow.css`\
  \ 文件。\n\n2. 将清单 13.4 和清单 13.6 中所示的代码添加到 HTML 和 CSS 文件中。虽然 HTML 和 CSS 代码很多，但你现在应该能够理解它们。这些代码定义并样式化了一个基本的付款表单。\n\
  \n3. 打开 `form_flow.js` 文件，创建清单 13.4 中所示的 `.ready()` 函数。你应该能认出前几行只是添加点击处理程序，稍后会讨论。添加接下来显示的行，并实现提交和重置表单的流程控制。`submit`\
  \ 处理程序显示一条消息，说明表单提交功能尚未实现，并阻止默认提交。重置按钮的 `click` 处理程序在调用 `.reset()` 重置表单之前，会向用户显示一条提示消息：\n\
  \n   点击此处查看代码图像\n\n   ```js\n   40   $(\"form\").submit(function(e){\n   41    \
