  > ```\n\n### 访问 DOM\n\nJavaScript（尤其是 jQuery）最重要的方面之一是能够访问和操作 DOM。通过更改元素的样式、大小、位置和值，访问\
  \ DOM 可以使网页变得动态。\n\n在接下来的部分中，你将学习如何通过传统的 JavaScript 方法以及使用 jQuery 选择器的改进方法来访问 DOM。这些部分只是简要介绍。随着课程的深入，你将获得大量练习。\n\
  \n#### 使用传统 JavaScript 访问 DOM\n\n传统上，JavaScript 使用全局 `document` 对象来访问网页中的元素。访问元素的最简单方法是通过\
  \ `id` 直接引用它。例如，如果你有一个 `id=\"question\"` 的段落，你可以通过以下 JavaScript 的 `getElementById()`\
  \ 函数访问它：\n\n```\nvar q = document.getElementById(\"question\");\n...\n<p id=\"question\"\
  >你更喜欢哪种方法？</p>\n```\n\n另一个可用于访问 DOM 元素的有用 JavaScript 函数是 `getElementsByTagName()`。它返回一个与标签名称匹配的\
  \ DOM 元素的 JavaScript 数组。例如，要获取所有 `<p>` 元素的列表，请使用以下函数调用：\n\n```\nvar paragraphs =\
  \ document.getElementsByTagName(\"p\");\n```\n\n#### 使用 jQuery 选择器访问 HTML 元素\n\n\
  访问 HTML 元素是 jQuery 最大的优势之一。jQuery 使用与 CSS 选择器非常相似的选择器来访问 DOM 中的一个或多个元素；因此得名 jQuery。jQuery\
  \ 返回单个元素或一个 jQuery 化对象的数组。jQuery 化意味着额外的 jQuery 功能已添加到 DOM 对象中，从而可以更轻松地进行操作。\n\n\
  \n\n\n\n使用 jQuery 选择器的语法是 `$(\"selector\").action()`，其中 selector 替换为有效的选择器，action\
  \ 替换为附加到 DOM 元素上的 jQuery 操作。\n\n例如，以下命令会查找 HTML 文档中的所有段落元素，并将 CSS 的 `font-weight`\
  \ 属性设置为 `bold`：\n\nClick here to view code image\n\n```\n$(\"p\").css('font-weight',\
  \ 'bold');\n```\n\n* * *\n\n## 动手尝试：使用 jQuery 和 JavaScript 访问 DOM 元素\n\n现在为了巩固概念，你将通过一个快速示例来学习如何使用\
