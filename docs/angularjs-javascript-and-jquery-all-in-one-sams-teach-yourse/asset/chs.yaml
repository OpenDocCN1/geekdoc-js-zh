  ></script>\n17     <script src=\"js/scope_template.js\"></script>\n18   </body>\n\
  19 </html>\n```\n\n* * *\n\n#### 作用域与后端服务器数据的关系\n\nAngularJS 应用程序使用的数据通常来自后端数据源，例如数据库。在这种情况下，作用域仍然是\
  \ AngularJS 应用程序数据的权威来源。在与来自服务器端的数据交互时，应遵循以下规则：\n\n- ![图片](img/image00767.jpeg)\
  \ 通过 AngularJS 服务从数据库或其他后端源访问数据，这将在第 27 课“在 Web 应用程序中实现 AngularJS 服务”中讨论。这包括读取和更新数据。\n\
  \n- ![图片](img/image00767.jpeg) 确保从服务器读取的数据更新作用域，进而更新视图。避免直接从数据库操作 HTML 值的诱惑，这可能导致作用域与视图不同步。\n\
  \n- ![图片](img/image00767.jpeg) 对数据库或其他后端源所做的更改也应反映在作用域中。你可以先更新作用域，然后使用服务更新数据库，或者先更新数据库，然后使用数据库的结果重新填充作用域中的适当值。\n\
  \n#### 作用域生命周期\n\n当应用程序在浏览器中加载时，作用域数据会经历一个生命周期。理解这个生命周期将帮助你理解作用域与其他 AngularJS 组件（尤其是模板）之间的交互。\n\
  \n作用域数据经历以下生命周期阶段：\n\n1. 创建\n2. 监视器注册\n3. 模型变更\n4. 变更观察\n5. 作用域销毁\n\n以下各节将描述这些生命周期阶段。\n\
  \n##### 创建阶段\n\n创建阶段发生在作用域初始化时。引导应用程序会创建一个根作用域。当遇到 `ng-controller` 或 `ng-repeat`\
  \ 指令时，模板链接会创建子作用域。\n\n\n\n\n\n在创建阶段，还会创建一个与浏览器事件循环交互的摘要循环。摘要循环负责将模型的变化更新到 DOM 元素，并执行任何已注册的监听器函数。虽然你通常不需要手动执行摘要循环，但可以通过在作用域上执行\
  \ `$digest()` 方法来实现。例如，以下代码会评估任何异步变化，然后在作用域上执行监听函数：\n\n```\n$scope.$digest()\n```\n\
  \n#### 监听器注册阶段\n\n监听器注册阶段会为模板中表示的作用域值注册监听器。这些监听器会自动将模型变化传播到 DOM 元素。\n\n你也可以通过使用\
  \ `$watch()` 方法在作用域值上注册自己的监听函数。该方法接受一个作用域属性名作为第一个参数，一个回调函数作为第二个参数。当作用域中的属性发生变化时，旧值和新值会传递给回调函数。\n\
  \n例如，以下代码为作用域中的属性 `watchedItem` 添加了一个监听器，并在每次变化时递增一个计数器：\n\n```\n$scope.watchedItem\
  \ = 'myItem';\n$scope.counter = 0;\n$scope.$watch('watchedItem', function(newValue,\
  \ oldValue) {\n  $scope.watchedItem = $scope.counter + 1;\n});\n```\n\n#### 模型变更阶段\n\
  \n模型变更阶段发生在作用域中的数据发生变化时。当你在 AngularJS 代码中进行更改时，一个名为 `$apply()` 的作用域函数会更新模型，并调用 `$digest()`\
  \ 函数来更新 DOM 和监听器。这就是在 AngularJS 控制器中或通过 `$http`、`$timeout` 和 `$interval` 服务所做的更改自动更新到\
  \ DOM 的方式。\n\n你应该始终尝试在 AngularJS 控制器或这些服务内部对作用域进行更改。但是，如果你必须在 AngularJS 领域之外对作用域进行更改，则需要调用作用域上的\
  \ `scope.$apply()` 来强制正确更新模型和 DOM。`$apply()` 方法接受一个表达式作为唯一参数。该表达式会被评估并返回，然后调用 `$digest()`\
  \ 方法来更新 DOM 和监听器。\n\n#### 变更观察阶段\n\n变更观察阶段发生在 `$digest()` 方法被摘要循环、`$apply()` 调用或手动执行时。当\
  \ `$digest()` 执行时，它会评估所有监听器以检测变化。如果某个值发生了变化，`$digest()` 会调用 `$watch` 监听器并更新 DOM。\n\
  \n#### 作用域销毁阶段\n\n`$destroy()` 方法会将作用域从浏览器内存中移除。当子作用域不再需要时，AngularJS 库会自动调用此方法。`$destroy()`\
  \ 方法会停止 `$digest()` 调用并移除监听器，从而允许浏览器垃圾回收器回收内存。\n\n## 实现作用域层次结构\n\n作用域的一个强大特性是它们按层次结构组织。层次结构有助于保持作用域的组织性，并与它们所代表的视图上下文相关。在\
  \ AngularJS 模块级别有一个根作用域，然后可以在子组件（如控制器或指令）中实现子作用域。子作用域可以相互嵌套，形成层次结构。\n\n---\n\n**顺便一提**\n\
  \n`$digest()` 方法利用作用域层次结构将作用域变化传播到相应的监听器和 DOM 元素。\n\n---\n\n作用域层次结构是根据 AngularJS\
  \ 模板中 `ng-controller` 语句的位置自动创建的。例如，以下模板代码定义了两个 `<div>` 元素，它们创建了互为兄弟的控制器实例：\n\n\
  ```\n<div ng-controller=\"controllerA\"> . . . </div>\n<div ng-controller=\"controllerB\"\
  > . . . </div>\n```\n\n然而，以下模板代码定义了控制器，其中 `controllerA` 是 `controllerB` 的父级：\n\n\
  ```\n<div ng-controller=\"controllerA\">\n  <div ng-controller=\"controllerB\">\
  \ . . . </div>\n</div>\n```\n\n作用域层次结构的工作方式类似于面向对象语言中对象继承的工作方式。你可以从控制器访问父作用域的值，但不能访问兄弟或子作用域的值。如果在子作用域中添加一个属性名，它不会覆盖父作用域，而是在子作用域中创建一个同名但值不同的属性。\n\
  \n---\n\n#### 动手实践：实现嵌套控制器和作用域\n\n在本例中，你将观察嵌套控制器中作用域的行为。清单 22.5 和 22.6 实现了一个基本的嵌套作用域层次结构，以演示作用域在层次结构中的工作方式。清单\
  \ 22.5 创建了一个包含三个控制器的应用程序，每个控制器定义了两个作用域项。它们都共享公共作用域属性 `title` 以及作用域属性 `valueA`、`valueB`\
  \ 和 `valueC`。清单 22.6 在 AngularJS 模板中创建了这三个控制器。\n\n按照以下步骤构建包含嵌套控制器和作用域的应用程序：\n\n\
  1. 添加 `lesson22/scope_hierarchy.html` 和 `lesson22/js/scope_hierarchy.js` 文件。\n\n\
  2. 将清单 22.5 和清单 22.6 中的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 清单 22.5 中的代码实现了三个控制器：`LevelA`、`LevelB`\
  \ 和 `LevelC`。定义了三个控制器，每个控制器都有一个 `title`、`value` 和用于递增 `value` 的 `inc()` 函数。以下代码显示了\
  \ `LevelA` 的定义：\n\n```\n02   controller('LevelA', function($scope) {\n03     $scope.title\
  \ = \"Level A\"\n04     $scope.valueA = 1;\n05     $scope.inc = function() {\n06\
  \       $scope.valueA++;\n07     };\n08   }).\n```\n\n4. 在清单 22.6 中，以下三个 `<div>`\
  \ 元素是嵌套的，这也嵌套了分配给它们的控制器：\n\n```\n07   <div ng-controller=\"LevelA\">\n. . .\n10\
  \     <div ng-controller=\"LevelB\"><hr>\n. . .\n15       <div ng-controller=\"\
  LevelC\"><hr>\n. . .\n21       </div>\n22     </div>\n23   </div>\n```\n\n5. `LevelA\
  \ <div>` 中的以下模板代码显示来自 `LevelA` 的 `title` 和 `valueA` 值，并在单击按钮时调用 `LevelA` 的 `inc()`\
  \ 函数：\n\n```\n08     <h3>{{title}}</h3>\n09     ValueA = {{valueA}} <input type=\"\
  button\" ng-click=\"inc()\" value=\"+\" />\n```\n\n6. `LevelB <div>` 中的以下模板代码显示来自\
  \ `LevelB` 的 `title` 和 `valueB` 值，以及来自 `LevelA` 作用域的 `valueA` 值。此外，当单击此处定义的按钮时，调用的是\
  \ `LevelB` 的 `inc()` 函数：\n\n```\n11       <h3>{{title}}</h3>\n12       ValueA =\
  \ {{valueA}}<br>\n13       ValueB = {{valueB}}\n14       <input type=\"button\"\
  \ ng-click=\"inc()\" value=\"+\" />\n```\n\n7. `LevelC <div>` 中的以下模板代码显示来自 `LevelB`\
  \ 的 `title` 和 `valueC` 值，以及来自 `LevelA` 作用域的 `valueA` 值和来自 `LevelB` 作用域的 `valueB`\
  \ 值。此外，当单击此处定义的按钮时，调用的是 `LevelC` 的 `inc()` 函数：\n\n```\n16        <h3>{{title}}</h3>\n\
  17         ValueA = {{valueA}}<br>\n18         ValueB = {{valueB}}<br>\n19     \
  \    ValueC = {{valueC}}\n20         <input type=\"button\" ng-click=\"inc()\" value=\"\
  +\" />\n```\n\n\n\n\n\n**8.** 图 22.3 展示了渲染后的 AngularJS 应用程序。注意，三个作用域中`title`属性的值各不相同。这是因为在层级结构中，每一层都会创建一个新的`title`属性。\n\
  \n![Image](img/image00999.jpeg)\n\n**图 22.3** 实现控制器层级结构，从多个作用域层级渲染结果。\n\n#### 清单\
  \ 22.5 scope_hierarchy.js 实现基本作用域层级结构，可访问每一层的属性\n\n```\nangular.module('myApp',\
  \ []).\n  controller('LevelA', function($scope) {\n    $scope.title = \"Level A\"\
  \n    $scope.valueA = 1;\n    $scope.inc = function() {\n      $scope.valueA++;\n\
  \    };\n  }).\n  controller('LevelB', function($scope) {\n    $scope.title = \"\
  Level B\"\n    $scope.valueB = 1;\n    $scope.inc = function() {\n      $scope.valueB++;\n\
  \    };\n  }).\n  controller('LevelC', function($scope) {\n    $scope.title = \"\
  Level C\"\n    $scope.valueC = 1;\n    $scope.inc = function() {\n      $scope.valueC++;\n\
  \    };\n  });\n```\n\n---\n\n#### 清单 22.6 scope_hierarchy.html 实现控制器层级结构并从多个作用域层级渲染结果的\
  \ HTML 模板代码\n\n```\n<!doctype html>\n<html ng-app=\"myApp\">\n<head>\n<title>AngularJS\
  \ Scope Hierarchy</title>\n</head>\n<body>\n  <div ng-controller=\"LevelA\">\n \
  \   <h3>{{title}}</h3>\n    ValueA = {{valueA}} <input type=\"button\" ng-click=\"\
  inc()\" value=\"+\" />\n    <div ng-controller=\"LevelB\"><hr>\n      <h3>{{title}}</h3>\n\
  \      ValueA = {{valueA}}<br>\n      ValueB = {{valueB}}\n      <input type=\"\
  button\" ng-click=\"inc()\" value=\"+\" />\n      <div ng-controller=\"LevelC\"\
  ><hr>\n        <h3>{{title}}</h3>\n        ValueA = {{valueA}}<br>\n        ValueB\
  \ = {{valueB}}<br>\n        ValueC = {{valueC}}\n        <input type=\"button\"\
  \ ng-click=\"inc()\" value=\"+\" />\n      </div>\n    </div>\n  </div>\n  <script\
  \ src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n  <script src=\"\
  js/scope_hierarchy.js\"></script>\n</body>\n</html>\n```\n\n---\n\n### 总结\n\n作用域是\
  \ AngularJS 应用程序中数据的权威来源。作用域与模板视图、控制器、模块和服务直接关联，并充当将应用程序各部分粘合在一起的胶水。作用域也代表了数据库或其他服务器端数据源。\n\
  \n作用域的生命周期与浏览器事件循环相关联，因此浏览器中的变化可以改变作用域，而作用域中的变化也会反映在绑定到该作用域的 DOM 元素中。你还可以添加自定义的监视函数，当作用域发生变化时，这些函数会收到通知。\n\
  \n作用域按层级组织，根作用域在应用程序级别定义。每个控制器实例也会获得一个子作用域实例。从子作用域中，你可以访问存储在父作用域层级中的数据。\n\n### 问答\n\
  \n**问：** 作用域是否必须与数据模型完全匹配——例如，来自服务器的数据？\n\n**答：** 不需要。AngularJS 应用程序的作用域应与应用程序本身所需的内容匹配。然而，尽可能使其与后端数据保持一致，可以使代码更易于维护。\n\
  \n**问：** 是否可以从 AngularJS 应用程序外部修改作用域？\n\n**答：** 可以。你始终可以使用`angular.element(<dom_element>).scope()`来访问作用域。不过，通常最好只在应用程序内部修改作用域。\n\
  \n### 实践\n\n本节包含一组问题和答案，旨在巩固你对本课时所学内容的理解。请先尝试回答问题，再查看答案。\n\n#### 小测验\n\n1. 作用域生命周期的阶段有哪些？\n\
  \n2. 通常应该在何处修改作用域？\n\n3. 修改作用域中的值是否会自动更新视图中表达式内的引用？\n\n4. 在以下示例中，控制器 B 是控制器 A 和/或\
  \ C 的父级、同级还是子级？\n\n```\n<div ng-controller=\"controllerA\">\n  <div ng-controller=\"\
  controllerB\">\n    <div ng-controller=\"controllerC\">. . . </div>\n  </div>\n\
  </div>\n```\n\n#### 小测验答案\n\n1. 创建、注册监视、模型变更、变更观察和作用域销毁。\n\n2. 通常，作用域值的修改在控制器或指令代码中进行。\n\
  \n3. 是的。变更会被检测到，从而更新 DOM，进而更新浏览器视图。\n\n4. B 是 C 的父级，是 A 的子级。\n\n#### 练习\n\n1. 修改清单\
  \ 22.1 和清单 22.2 中的示例，添加一个按钮，当点击时，将作用域中`current`的值重置为`start`的值。\n\n2. 修改清单 22.3 和\
  \ 22.4 中的示例，向作用域添加另一个名为`multiplyValues()`的函数，该函数将值相乘而不是相加。你还需要在模板中添加相应的表达式和按钮以暴露该功能。\n\
  \n## 第 23 课 使用 AngularJS 模板创建视图\n\n本课学习内容：\n\n- ![Image](img/image00767.jpeg) 如何以及何时使用\
  \ AngularJS 表达式\n- ![Image](img/image00767.jpeg) 如何创建 AngularJS 模板\n- ![Image](img/image00767.jpeg)\
  \ 使用内置 AngularJS 过滤器的方法\n- ![Image](img/image00767.jpeg) 如何创建自定义 AngularJS 过滤器\n\
  \nAngularJS 模板提供了一个框架，用于向用户呈现应用程序视图。AngularJS 模板包含表达式、过滤器和指令，这些元素为 DOM 元素定义了额外的功能和行为。模板构建在普通\
  \ HTML 之上，并通过添加额外的元素和属性来扩展 HTML 的功能。\n\n本课重点介绍 AngularJS 模板，以及表达式和过滤器。表达式使你能够在模板中的\
  \ HTML 代码旁边实现类似 JavaScript 的代码。过滤器使你能够在显示数据值之前对其进行修改——例如，格式化文本。\n\n## 理解模板\n\nAngularJS\
  \ 模板相当直观，但功能强大且易于扩展。模板基于标准 HTML 文档，但通过三个附加组件扩展了 HTML 功能：\n\n- ![Image](img/image00767.jpeg)\
  \ **表达式：** 表达式是在作用域上下文中求值的类似 JavaScript 的代码片段。表达式由`{{}}`括号表示。表达式的结果会被添加到编译后的 HTML\
  \ 网页中。表达式可以放在普通 HTML 文本中，也可以放在属性值中，如下所示：\n\n  ```\n  <p>{{1+2}}</p>\n  href=\"/myPage.html/{{hash}}\"\
  \n  ```\n\n- ![Image](img/image00767.jpeg) **过滤器：** 过滤器转换放置在网页上的数据的外观。例如，过滤器可以将作用域中的数字转换为货币字符串或时间字符串。\n\
  \n- ![Image](img/image00767.jpeg) **指令：** 指令是 HTML 元素的新名称或 HTML 元素内的属性名称。它们添加并修改\
  \ HTML 元素的行为，为 AngularJS 应用程序提供数据绑定、事件处理和其他支持。\n\n\n\n\n\n以下代码片段展示了如何实现指令、表达式和过滤器。`ng-model=\"\
  msg\"` 属性是一个指令，它将 `<input>` 元素的值绑定到作用域中的 `msg`。`{{}}` 括号中的代码是一个表达式，它应用了 `uppercase`\
  \ 过滤器：\n\n```\n<div>\n  <input ng-model=\"msg\">\n  {{msg | uppercase}}\n</div>\n\
  ```\n\n当你将 AngularJS 网页加载到浏览器中时，你加载的是原始状态，其中包含模板代码和 HTML 代码。初始 DOM 由该网页构建。当 AngularJS\
  \ 应用启动时，AngularJS 模板会编译到 DOM 中，动态调整 DOM 元素的值、事件绑定以及其他属性，使其与模板中的指令、表达式和过滤器相匹配。\n\n\
  在编译过程中，HTML 标签和属性会被规范化，以支持 AngularJS 区分大小写而 HTML 不区分大小写的事实。规范化做了两件事：\n\n- ![Image](img/image00767.jpeg)\
  \ 去除元素和属性开头的 `x-` 和 `data-` 前缀。\n- ![Image](img/image00767.jpeg) 将包含 `:`、`-` 或 `_`\
  \ 的名称转换为驼峰式命名。\n\n例如，以下所有写法都会规范化为 `ngModel`：\n\n- `ng-model`\n- `data-ng-model`\n\
  - `x-ng:model`\n- `ng_model`\n\n## 使用表达式\n\n使用表达式是在 AngularJS 视图中表示作用域数据的最简单方式。表达式是封装在括号内的代码块：`{{expression}}`。AngularJS\
  \ 编译器将表达式编译为 HTML 元素，从而显示表达式的结果。例如，请看以下表达式：\n\n```\n{{1+5}}\n{{'One' + 'Two'}}\n\
  ```\n\n基于这些表达式，网页会显示以下值：\n\n```\n6\nOneTwo\n```\n\n表达式绑定到数据模型，这带来了两大好处。首先，你可以在表达式中使用作用域内定义的属性名和函数。其次，由于表达式绑定到作用域，当作用域中的数据发生变化时，表达式也会随之变化。例如，假设作用域包含以下值：\n\
  \n```\n$scope.name='Brad';\n$scope.score=95;\n```\n\n你可以直接在模板表达式中引用 `name` 和 `score`\
  \ 值，如下所示：\n\n```\nName: {{name}}\nScore: {{score}}\nAdjusted: {{score+5}}\n```\n\
  \nAngularJS 表达式在多个方面与 JavaScript 表达式相似，但存在以下差异：\n\n- ![Image](img/image00767.jpeg)\
  \ **属性求值：** 属性名是针对作用域模型求值的，而不是针对全局 JavaScript 命名空间。\n- ![Image](img/image00767.jpeg)\
  \ **更宽容：** 当表达式遇到未定义或 null 变量类型时，不会抛出异常，而是将其视为没有值。\n- ![Image](img/image00767.jpeg)\
  \ **无流程控制：** 表达式不允许使用 JavaScript 条件语句或循环。此外，你不能在表达式内部抛出错误。\n\nAngularJS 将用于定义指令标签中属性值的字符串作为表达式进行求值。这使你可以在定义中包含表达式类型的语法。例如，当你在模板中设置\
  \ `ng-click` 指令的值时，你指定了一个表达式。在该表达式内部，你可以引用作用域变量并使用其他表达式语法，如下所示：\n\n点击此处查看代码图片\n\n\
  ```\n<span ng-click=\"scopeFunction()\"></span>\n<span ng-click=\"scopeFunction(scopeVariable,\
  \ 'stringParameter')\"></span>\n<span ng-click=\"scopeFunction(5*scopeVariable)\"\
  ></span>\n```\n\n由于 AngularJS 模板表达式可以访问作用域，你还可以在 AngularJS 表达式内部对作用域进行修改。例如，以下 `ng-click`\
  \ 指令会更改作用域模型中 `msg` 的值：\n\n点击此处查看代码图片\n\n```\n<span ng-click=\"msg='clicked'\"></span>\n\
  ```\n\n以下各节将带你了解一些利用 AngularJS 表达式功能的示例。\n\n* * *\n\n## 动手实践：使用基本表达式\n\n在本练习中，你将看到\
  \ AngularJS 表达式如何处理字符串和数字的渲染。本练习的目的是说明 AngularJS 如何对包含字符串、数字以及基本数学运算符的表达式进行求值。\n\
  \n清单 23.1 中的代码是一个简单的 AngularJS 应用，带有一个名为 `myController` 的控制器。该控制器为空，因为没有任何表达式访问作用域。\n\
  \n清单 23.2 中的代码是一个 AngularJS 模板，其中包含几种用 `{{}}` 括号包裹的表达式。有些表达式是数字或字符串，有些包含 `+` 操作来组合字符串和/或数字，还有一个应用了\
  \ `===` 运算符来比较两个数字。\n\n请按照以下步骤构建使用基本表达式的应用：\n\n**1.** 添加 `lesson23/expressions_basic.html`\
  \ 和 `lesson23/js/expressions_basic.js` 文件。\n\n**2.** 将清单 23.1 和清单 23.2 中显示的代码添加到\
  \ HTML 和 JavaScript 文件中。\n\n**3.** 清单 23.1 中的以下代码实现了一个基本的 AngularJS 控制器：\n\n点击此处查看代码图片\n\
  \n```\n01 angular.module('myApp', [])\n02   .controller('myController', function($scope)\
  \ {\n03   });\n```\n\n**4.** 清单 23.2 中的以下代码行使用表达式括号 `{{}}` 显示一个数字：\n\n```\n14  \
  \     {{5}}<hr>\n```\n\n**5.** 清单 23.2 中的以下代码行使用表达式括号 `{{}}` 显示一个字符串：\n\n点击此处查看代码图片\n\
  \n```\n16       {{'My String'}}<hr>\n```\n\n**6.** 清单 23.2 中的以下代码行使用表达式括号 `{{}}`\
  \ 通过拼接字符串来显示一个字符串：\n\n点击此处查看代码图片\n\n```\n18       {{'String1' + ' ' + 'String2'}}<hr>\n\
  ```\n\n**7.** 清单 23.2 中的以下代码行使用表达式括号 `{{}}` 通过相加数字来显示一个数字：\n\n```\n20       {{5+5}}<hr>\n\
  ```\n\n**8.** 清单 23.2 中的以下代码行使用表达式括号 `{{}}` 通过相加来显示一个字符串和数字。相加 `{{5+5}}` 会显示 `10`，但相加\
