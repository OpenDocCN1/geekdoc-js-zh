  16   }\n```\n\n* * *\n\n* * *\n\n* * *\n\n## 自己动手：通过 CSS 添加背景\n\n更改元素的背景属性是彻底改变外观和感觉的绝佳方式。你应该了解几个背景属性，例如：\n\
  \n![Image](img/image00767.jpeg) `background-attachment`——可以设置为 `scroll` 或 `fixed`，分别表示背景随页面其余部分滚动或固定不动。\n\
  \n![Image](img/image00767.jpeg) `background-color`——允许你使用常规颜色命令定义背景颜色；例如：\n\n点击此处查看代码图片\n\
  \n```\n#top-left {background-color:rgb(255,255,0);}\n```\n\n\n\n\n\n![Image](img/image00767.jpeg)\
  \ `background-size`——允许你指定元素背景的大小。其值可以是像素或百分比表示的宽度/高度组合，`cover` 会缩放背景以填充元素区域，而 `contain`\
  \ 会缩放图像使整个图像适应元素。请记住，使用 `cover` 时，如果尺寸比例不同，图像的某些部分可能不会在元素中显示。以下示例将大小设置为宽 200 像素、高\
  \ 100 像素，宽为元素宽度的 20%、高为元素高度的 200%，以及完全包含在元素尺寸内：\n\n点击此处查看代码图片\n\n```\n#top-left\
  \ {background-size:200px 100px;}\n#top-left {background-position:20% 100%;}\n#top-left\
  \ {background-position:contain;}\n```\n\n![Image](img/image00767.jpeg) `background-position`——设置背景在元素中的位置，例如左上角、底部居中等等。你也可以为背景图像的左上角指定宽度和高度的位置坐标（像素或百分比）。例如，以下代码将背景图像放置在中间、向右\
  \ 10%向下 50%、以及向右 100 像素向下 20 像素：\n\n点击此处查看代码图片\n\n```\n#top-left {background-position:center\
  \ center;}\n#top-left {background-position:10% 50%;}\n#top-left {background-position:100px\
  \ 20px;}\n```\n\n![Image](img/image00767.jpeg) `background-image`（`url`）——允许你指定一个图像的\
  \ `url`，该图像将作为背景应用。例如：\n\n点击此处查看代码图片\n\n```\n#rocs{background-image:url(\"images/rocks.png\"\
  );}\n```\n\n![Image](img/image00767.jpeg) `background-image`（渐变）——在 CSS3 中，你还可以指定一个渐变，使背景填充不同颜色的过渡。指定渐变时，可以设置位置、大小和颜色。每个浏览器都有自己的特定属性名称。这很难描述，因此下面给出几个示例。\n\
  \n以下是一个定义水平线性渐变的 CSS 示例。图 4.8 展示了渐变的实际应用效果。注意位置设置为顶部。它从顶部的蓝色开始，到 70%处变为白色，然后到底部（100%）变为绿色：\n\
  \n点击此处查看代码图片\n\n```\nbackground-image: -moz-linear-gradient(top, blue 0%, white\
  \ 70%, green 100%);\n```\n\n![Image](img/image00833.jpeg)\n\n**图 4.8** 创建线性背景图像渐变。\n\
  \n![Image](img/image00767.jpeg) 以下 CSS 代码定义了图 4.9 中所示的径向渐变。辐射中心设置为距左侧 50%、距顶部 50%；`circle`\
  \ 确保它不会被扭曲成椭圆，`contain` 将其缩放到合适的大小。颜色从中心的白色开始，到 75%处变为蓝色，然后使用 `rgba()` 颜色设置在外围变为透明白色：\n\
  \n点击此处查看代码图片\n\n```\nbackground-image: -moz-radial-gradient(50% 50%, circle contain,white,blue\n\
  75%,rgba(255,255,255,0));\n```\n\n![Image](img/image00834.jpeg)\n\n**图 4.9** 创建径向背景图像渐变。\n\
  \n![Image](img/image00767.jpeg) `background-repeat`——你可以使用此选项重复背景图像多次。其值包括：`repeat`（在所有方向重复）、`repeat-y`（垂直方向重复）、`repeat-x`（水平方向重复）。你也可以指定\
  \ `no-repeat` 仅显示一次图像。重复图像用于边框以及作为条和按钮的设计元素。图 4.10 展示了以下代码中不同 `background-repeat`\
  \ 值的效果：\n\n点击此处查看代码图片\n\n```\nbody{\n  background-size:50px 50px;\n  margin:5px;\n\
  \  background-image: -moz-radial-gradient(20px 20px, circle contain,white,blue 75%,white);\n\
  \  background-repeat:repeat;\n}\n```\n\n![Image](img/image00835.jpeg)\n\n**图 4.10**\
  \ 在图像中使用重复图像。\n\n* * *\n\n按照以下步骤创建 HTML 文档并向文本元素添加 CSS 样式。这些是包含几个 `<div>` 和 `<span>`\
