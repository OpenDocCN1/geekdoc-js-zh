  **4.** 添加以下行，将 `draggable` 添加到主 `<div>` 元素：\n\n点击此处查看代码图片\n\n```\n2   $(\"#resize1,\
  \ #resize2, #resize3\").draggable();\n```\n\n**5.** 添加以下行，在 `#resize1` 上实现 `resizable`\
  \ 部件。注意 `aspectRatio` 为 true，因此调整大小时将强制保持宽高比不变。`alsoResize` 选项设置为 `#resize1` 中包含的图像，以便\
