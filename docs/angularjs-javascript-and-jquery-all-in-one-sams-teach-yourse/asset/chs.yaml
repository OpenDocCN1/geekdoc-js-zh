  \ 中的以下代码行定义了 `mouseMove()` 事件处理程序。注意，事件信息被传递到处理程序中，并允许我们在 `mouseInfo` 中设置 `clientX`、`clientY`、`screenX`\
  \ 和 `screenY` 信息：\n\n点击此处查看代码图片\n\n```\n11     $scope.mouseMove = function(event){\n\
  12       $scope.mouseInfo.clientX = event.clientX;\n13       $scope.mouseInfo.clientY\
  \ = event.clientY;\n14       $scope.mouseInfo.screenX = event.screenX;\n15     \
  \  $scope.mouseInfo.screenY = event.screenY;\n16     };\n```\n\n6.  清单 24.14 中的以下代码行将\
  \ `ng-mouseenter`、`ng-mouseleave`、`ng-mouseclick`、`ng-mousedown` 和 `ng-mouseup`\
  \ 指令应用于一个 `<img>` 元素，并在事件触发时设置作用域中的 `mouseState` 值。它们还将 `ng-click` 和 `ng-mousemove`\
  \ 事件绑定到作用域中的 `mouseClick($event)` 和 `mouseMove($event)`。注意，`$event` 用于将浏览器的鼠标事件传递给处理程序：\n\
  \n点击此处查看代码图片\n\n```\n16     <img\n17         src=\"/images/img3.jpg\"\n18      \
  \   ng-mouseenter=\"mouseState='Entered'\"\n19         ng-mouseleave=\"mouseState='Left'\"\
  \n20         ng-mouseclick=\"mouseState='Clicked'\"\n21         ng-mousedown=\"\
  mouseState='Down'\"\n22         ng-mouseup=\"mouseState='Up'\"\n23         ng-click=\"\
  mouseClick($event)\"\n24         ng-mousemove=\"mouseMove($event)\"></img><hr>\n\
