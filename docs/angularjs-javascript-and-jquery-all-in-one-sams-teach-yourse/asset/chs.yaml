  \     res.send(400, \"Invalid Answers!\");\n13   }\n14 });\n15 app.listen(80);\n\
  ```\n\n---\n\n#### 处理响应数据\n\n你已经了解了响应可以生成的不同数据类型。你将处理的四种主要类型是脚本、文本、JSON 和 XML/HTML。脚本和文本通过\
  \ `.load()` 和 `.getScript()` 方法简单处理。JSON 和 XML/HTML 可能稍微复杂一些。\n\n以下各节将引导你完成处理来自服务器的响应中的\
  \ JSON 和 XML 数据的过程。\n\n---\n\n### 动手试一试：处理 JSON 响应数据\n\nJSON 数据是 jQuery AJAX 响应中最容易处理的数据类型。这是因为响应数据以对象形式存在，因此你可以通过点号命名来访问它。例如，来自服务器的以下\
  \ JSON 响应：\n\n点击此处查看代码图片\n\n```json\n{\"first\":\"Brad\", \"last\":\"Dayley\"}\n\
  ```\n\n可以在响应数据中按如下方式访问：\n\n点击此处查看代码图片\n\n```javascript\nvar name  = data.first +\
  \ \" \" + data.last;\n```\n\n即使响应数据对象以字符串形式出现，你也可以使用 `.parseJSON()` 来获取 JavaScript\
  \ 对象。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar data = $.parseJSON('{\"first\":\"Brad\"\
  , \"last\":\"Dayley\"}');\nvar name  = data.first + \" \" + data.last;\n```\n\n\
  在本练习中，你将处理来自 AJAX 请求的 JSON 数据。生成的网页包含多个带有标题的图片。图片标题和图片文件名来自服务器上位于 `lesson15/data/images.json`\
  \ 的 JSON 文件。本练习的目的是让你熟悉使用从 AJAX 请求返回的 JSON 数据来动态填充页面。\n\n该示例的代码在清单 15.9、15.10、15.11\
  \ 和 15.12 中。使用以下步骤创建动态网页：\n\n1. 在 Eclipse 中，创建 `lesson15/load_json.html`、`lesson15/js/load_json.js`、`lesson15/css/load_json.css`\
  \ 和 `lesson15/data/images.json` 文件。\n\n2. 将清单 15.9 和清单 15.12 中显示的代码添加到 HTML 和 CSS\
  \ 文件中。这些文件非常基础，因为图片元素将动态生成。\n\n3. 将清单 15.11 的内容添加到 `images.json` 文件中。\n\n4. 打开 `load_json.js`\
  \ 文件，添加以下 `.ready()` 函数，该函数向服务器发出 `.get()` 请求以获取 `lesson15/data/images.json` 文件，并调用\
  \ `updateImages()` AJAX 请求完成事件处理程序。JSON 文件的内容可以在清单 15.11 中看到：\n\n点击此处查看代码图片\n\n\
  ```javascript\n10 $(document).ready(function(){\n11   $.get(\"data/images.json\"\
  , updateImages);\n12 });\n```\n\n5. 添加以下 AJAX 请求完成事件处理程序 `updateImages()`。请注意，JSON\
  \ 响应 `data` 已被转换为一个 JavaScript 对象数组，你可以遍历该数组并创建图片元素，然后将它们添加到网页中：\n\n点击此处查看代码图片\n\
  \n```javascript\n01 function updateImages(data){\n02   for (i=0; i<data.length;\
  \ i++){\n03     var imageInfo =data[i];\n04     var img = $('<img />').attr(\"src\"\
  , \"images/\"+imageInfo.image);\n05     var title = $(\"<p></p>\").html(imageInfo.title);\n\
  06     var div = $(\"<div></div>\").append(img, title);\n07     $(\"#images\").append(div);\n\
