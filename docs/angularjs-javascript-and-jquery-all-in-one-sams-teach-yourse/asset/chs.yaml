  \ 1);\n12       $scope.currentName = $scope.names[0];\n13       $scope.$broadcast('CharacterChanged',\
  \ $scope.currentName);\n14     });\n```\n\n**6.** 清单 26.3 中的以下代码行定义了一个名为 `Character`\
  \ 的子作用域控制器。`CharacterChanged` 事件由 `$scope.$on('Character-Changed')` 事件处理程序处理，并设置作用域中的\
  \ `currentInfo` 值，这将更新页面元素。`deleteChar()` 函数从 `Character` 作用域中移除角色，并使用 `$emit` 将\
  \ `CharacterDeleted` 事件向上发送到父作用域，以便在 `Characters` 控制器中处理：\n\n点击此处查看代码图片\n\n```\n\
  16   controller('Character', function($scope) {\n17     $scope.info = {'Frodo':\
  \ { weapon: 'Sting',\n18                               race: 'Hobbit'},\n19    \
  \                'Aragorn': { weapon: 'Sword',\n20                             \
  \    race: 'Man'},\n21                    'Legolas': { weapon: 'Bow',\n22      \
  \                           race: 'Elf'},\n23                    'Gimli': { weapon:\
  \ 'Axe',\n24                               race: 'Dwarf'}};\n25     $scope.currentInfo\
  \ = $scope.info['Frodo'];\n26     $scope.$on('CharacterChanged', function(event,\
  \ newCharacter){\n27       $scope.currentInfo = $scope.info[newCharacter];\n28 \
