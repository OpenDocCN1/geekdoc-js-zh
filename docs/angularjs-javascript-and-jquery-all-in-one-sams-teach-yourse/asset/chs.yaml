  >Round Trip</label><br>\n27       <textarea rows=\"10\" cols=\"30\">comments</textarea><br>\n\
  28       <input di='newsCB' type=\"checkbox\" name=\"news\" value=\"news\">\n29\
  \         <label for=\"newsCB\">\n30           I would like to enroll into the frequent\
  \ flyer miles program\n31         </label><br>\n32       <button type=\"submit\"\
  \ name=\"SubmitButton\"\n33               value=\"Submit\">Submit</button>\n34 \
  \      <button type=\"reset\" name=\"ResetButton\"\n35               value=\"Reset\"\
  >Reset</button>\n36     </form>\n37   </body>\n38 </html>\n```\n\n* * *\n\n* * *\n\
  \n### 添加一些高级 HTML5 元素\n\nHTML5 添加了几个更高级的元素，可用于增强动态网页。以下部分将介绍一些图形和媒体元素，因为它们与 JavaScript/jQuery\
  \ 编程有直接关系。\n\n#### 使用 HTML5 图形元素\n\n两个主要的 HTML5 图形元素是 `<svg>` 和 `<canvas>`。这两个元素可以通过\
  \ jQuery 和 JavaScript 添加和操作。这允许你通过脚本直接在浏览器窗口中绘制，从而动态更改网页中的复杂图形。\n\n这意味着你可以在浏览器中动态添加图形元素，而无需从服务器加载文件。\n\
  \n##### 在 HTML5 中创建 SVG 图形\n\n\n\n\n\n`<svg>` 元素允许你向网页中添加可缩放矢量图形。可缩放矢量图形由一系列构成路径的线条、弧线和填充组成。当浏览器渲染时，这些路径可以生成从简单到复杂的图形。使用矢量图形的优势在于，即使在浏览器中缩放，它们也能保持清晰的边缘。在屏幕显示和打印时，它们看起来更锐利。\n\
  \n添加 SVG 图形可能会变得极其复杂；下一节将介绍涉及的 HTML 元素，以便你理解属性和样式属性。通过 JavaScript 和 jQuery，你将能够出于各种原因访问这些属性，例如在网页中创建和动画化图形。\n\
  \n###### 添加基本几何形状\n\n首先，你将创建一些基本的几何形状。以下来自清单 3.7 的代码创建了一系列简单的椭圆和一个圆，如图 3.11 所示。在\
  \ `<ellipse>` 元素中，你使用 `cx` 和 `cy` 坐标指定椭圆的中心；然后使用 `rx` 和 `ry` 属性指定水平和垂直方向的半径。注意，你还指定了\
  \ `stroke` 颜色和宽度，以及 `fill` 颜色：\n\n点击此处查看代码图像\n\n```\n08     <svg xmlns=\"http://www.w3.org/2000/svg\"\
