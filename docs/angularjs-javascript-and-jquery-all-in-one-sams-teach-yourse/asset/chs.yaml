  \n---\n\n### 为类过渡添加效果\n\njQuery UI 效果的一个非常重要的部分是能够在向元素应用类时对过渡进行动画处理。这是通过向类过渡函数添加持续时间并指定缓动函数来控制动画效果来实现的。任何正在变化的数值类属性都将在类过渡的每一步中进行动画处理。\n\
  \n> **注意**\n> \n> 颜色可能比较棘手；jQuery UI 无法对从红色到蓝色的过渡进行动画处理，但可以对从 `#FF0000` 到 `#0000FF`\
  \ 的过渡进行动画处理。如果要为颜色过渡添加动画效果，请使用它们的十六进制数值。\n\n以下是类过渡方法的列表，您可以通过设置 `duration` 和 `easing`\
  \ 值来对 jQuery 对象应用效果：\n\n![图片](img/image00767.jpeg) `.addClass( `className` [, `duration`\
  \ ] [, `easing` ] [, `complete` ] )` — 添加类并对数值类属性的变化进行动画处理。\n\n![图片](img/image00767.jpeg)\
  \ `.removeClass( `className` [, `duration` ] [, `easing` ] [, `complete` ] )` —\
  \ 移除类并对数值类属性的变化进行动画处理。\n\n![图片](img/image00767.jpeg) `.switchClass( `removeClassName`,\
  \ `addClassName` [, `duration` ] [, `easing` ] [, `complete` ] )` — 首先移除 `removeClassName`\
  \ 并对数值类属性的变化进行动画处理，然后添加 `addClassName` 并对数值类属性的变化进行动画处理。\n\n![图片](img/image00767.jpeg)\
  \ `.toggleClass( `className` [, `switch` ] [, `duration` ] [, `easing` ] [, `complete`\
  \ ] )` — 如果对象尚未拥有该类则添加，如果已拥有则移除。任何数值类属性的变化都将根据 `easing` 函数进行动画处理。\n\n---\n\n###\
  \ 动手实践：为类过渡应用缓动\n\n现在开始为类变化添加一些效果。在此示例中，您通过将不同的缓动函数应用于装扮成按钮的 `<span>` 元素来应用动画效果。本示例的目的是展示每个类过渡如何应用缓动函数。\n\
  \n示例代码位于清单 17.4、17.5 和 17.6 中。请按照以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，添加 `lesson17/class_transitions.html`、`lesson17/js/class_transitions.js`\
  \ 和 `lesson17/css/class_transitions.css` 文件。\n\n**2.** 将清单 17.4 和清单 17.6 中显示的代码添加到\
  \ HTML 和 CSS 文件中。注意 CSS 文件中定义的不同类样式。这些样式将用于对类变化进行动画处理。\n\n**3.** 现在打开 `class_transitions.js`\
  \ 文件，并添加以下 `.ready()` 函数，该函数为 HTML 文档中的每个 `<span>` 元素实现一个 `click` 处理程序。这些 `click`\
  \ 处理程序为不同的按钮元素调用 `.addClass()`、`.removeClass()`、`.switchClass()` 和 `.toggleClass()`\
  \ 方法：\n\n点击此处查看代码图片\n\n```javascript\n01 $(document).ready(function(){\n02   $(\"\
  #btn1\").click(function(e) {\n03     $(this).addClass( \"round\", 2000, \"easeInElastic\"\
  ); });\n04   $(\"#btn2\").click(function(e) {\n05     $(this).switchClass( \"active\"\
  , \"inactive\", 2000,\n06                          \"easeInOutElastic\"); });\n\
  07   $(\"#btn3\").click(function(e) {\n08     $(this).toggleClass( \"round\", 2000,\
  \ \"easeOutQuart\"); });\n09   $(\"#btn4\").click(function(e) {\n10     $(this).removeClass(\
  \ \"round\", 2000, \"easeInCirc\"); });\n11 });\n```\n\n**4.** 保存所有三个文件，然后在 Web\
