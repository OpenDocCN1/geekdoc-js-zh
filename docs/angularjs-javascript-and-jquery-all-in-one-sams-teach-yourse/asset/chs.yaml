  \n* * *\n\n* * *\n\n* * *\n\n## 动手实践：处理 AngularJS 元素中的鼠标事件\n\nAngularJS 提供了多个鼠标事件指令，使您能够轻松地通过鼠标交互增强\
  \ AngularJS 应用程序。最常用的鼠标事件指令是`ngClick`，用于鼠标点击时。然而，您还有其他几个鼠标事件，可用于创建丰富的交互组件。清单 24.13\
