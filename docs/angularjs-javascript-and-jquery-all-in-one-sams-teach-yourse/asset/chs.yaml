  \n## 引言\n\n欢迎阅读《*AngularJS、JavaScript 和 jQuery 三合一*》。本书旨在帮助你快速进入使用 JavaScript、jQuery\
  \ 和 AngularJS 进行动态 Web 应用程序开发的世界。本书涵盖了 JavaScript 语言、jQuery 库和 AngularJS 框架的基础知识，以及如何使用它们来构建设计良好、可重用的\
  \ Web 应用程序组件。\n\n如今，数十亿人使用互联网，一种快速增长的趋势是用具有丰富交互元素的单页应用程序取代传统的网站（即一个页面链接到另一个页面等）。\n\
  \n主要原因是用户对点击、等待然后在网页之间来回导航变得越来越不耐烦。相反，他们希望网站的行为更像他们在电脑和移动设备上习惯使用的应用程序。\n\n事实上，在接下来的\
  \ 24 小时内，互联网上将新增数百万个新网页。这些页面中的大多数将使用 HTML 编写，使用 CSS 来设计元素样式，并使用 JavaScript 来提供用户界面与后端服务之间的交互。\n\
  \n当你完成本书的课程后，你将实际理解如何将 JavaScript 与强大的 jQuery 库以及令人兴奋的 AngularJS 框架结合起来，在你的网页中提供丰富的用户交互。你将获得宝贵的技能，添加动态代码，使网页能够立即响应鼠标点击和手指滑动，与后端服务交互以从\
  \ Web 服务器存储和检索数据，并创建健壮的互联网应用程序。\n\n书中的每一课都提供了创建专业 Web 应用程序所需的基础知识。本书包含一些使用 HTML\
  \ 和 CSS 的基础知识，即使你以前从未使用过它们，也能让你入门。书中提供了代码示例，你可以随着理解的加深来实现和扩展这些示例。事实上，在本书的第一课中，你就将使用\
  \ jQuery 和 JavaScript 创建一个动态网页。\n\n所以，拉把椅子，坐好，享受使用 AngularJS、jQuery 和 JavaScript\
  \ 编程丰富互联网应用的旅程吧。\n\n### 谁应该阅读本书\n\n本书面向已经了解 HTML 基础知识并曾使用现代编程语言进行过一些编程的读者。了解 JavaScript\
  \ 将使本书更容易理解，但并非必需，因为本书涵盖了 JavaScript 的基础知识。\n\n### 为什么你应该阅读本书\n\n本书将教你如何创建功能强大、交互性强的\
  \ Web 应用程序，这些应用程序具有结构良好、易于重用且易于维护的代码库。本书的典型读者希望学习 JavaScript、jQuery 和 AngularJS，以构建高度交互的\
  \ Web 应用程序。典型读者还希望利用 AngularJS 创新的模型-视图-控制器（MVC）方法来扩展 HTML，并实现设计良好、结构清晰的网页和 Web\
  \ 应用程序。\n\n### 你将从此书中学到什么\n\n阅读本书将使你能够在网页和应用程序中构建丰富、动态的交互。网站不再是由包含图片和格式化文本的 HTML\
  \ 页面组成的简单静态内容。相反，网站已经变得更加动态，单个页面就能提供广泛的功能和交互。\n\n使用 AngularJS、jQuery 和 JavaScript，你可以将逻辑直接构建到\
  \ Web 应用程序中，从而能够从客户端应用程序与用户交互。这些技术还允许你与 Web 服务器上的后端 Web 服务交互，以创建全面的客户端 Web 应用程序。以下是你在阅读本书时将学到的一些内容：\n\
