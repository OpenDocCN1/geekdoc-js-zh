  \njQuery UI 的一个出色特性是它对按钮样式的处理。说实话，HTML 按钮样式已经过时且丑陋。使用 jQuery UI，你可以快速为按钮、复选框和单选按钮元素设置样式。\n\
  \n要样式化单个元素，只需在表示它的 jQuery 对象上调用 `.button(options)`。要样式化一组单选按钮或复选框，则调用 `.buttonset()`。\n\
