  \n## 第 27 课 在 Web 应用程序中实现 AngularJS 服务\n\n本课你将学习：\n\n- ![Image](img/image00767.jpeg)\
  \ 如何从 AngularJS 向 Web 服务器发送 HTTP GET 和 PUT 请求\n- ![Image](img/image00767.jpeg) 如何实现浏览器警报\n\
  - ![Image](img/image00767.jpeg) 如何在 AngularJS 代码中实现定时器\n- ![Image](img/image00767.jpeg)\
  \ 如何从 AngularJS 操作 Cookie\n- ![Image](img/image00767.jpeg) 如何使用 `$animate` 服务\n\n\
  AngularJS 功能中最基本的组成部分之一是其内置服务。服务为你的应用程序提供基于任务的功能。可以将服务视为执行一个或多个相关任务的可重用代码块。AngularJS\
  \ 提供了几个内置服务，还允许你创建自己的自定义服务。\n\n本课介绍 AngularJS 服务。你将看到并实现一些内置服务，例如用于 Web 服务器通信的 `$http`、用于存储和检索浏览器\
  \ Cookie 的 `$cookieStore`，以及提供动画功能的 `$animate`。\n\n## 理解 AngularJS 服务\n\nAngularJS\
  \ 服务是单例对象，这意味着只会创建一个实例。服务的目的是提供一段简洁的代码来执行特定任务。服务可以简单到提供一个值定义，也可以复杂到提供与 Web 服务器的完整\
  \ HTTP 通信。\n\n\n\n\n服务为可复用的功能提供了一个容器，这些功能可被 AngularJS 应用程序直接使用。服务通过 AngularJS 的依赖注入机制进行定义和注册。这使得你可以将服务注入到模块、控制器以及其他服务中。\n\
  \n* * *\n\n顺便提一下\n\n第 21 课，“理解 AngularJS 应用程序动态”，讨论了依赖注入。如果你还没有阅读过该课程，建议在继续学习本课之前先阅读它。\n\
  \n* * *\n\n## 使用内置服务\n\nAngularJS 提供了多个内置服务。这些服务会自动注册到依赖注入器中；因此，你可以通过依赖注入轻松地将它们整合到\
  \ AngularJS 应用程序中。\n\n表 27.1 描述了一些最常用的内置服务，让你了解可用的服务。后续章节将更详细地介绍其中一些服务。\n\n![Image](img/image01036.jpeg)![Image](img/image01037.jpeg)![Image](img/image01038.jpeg)\n\
  \n**表 27.1 AngularJS 内置的常用服务**\n\n#### 使用 `$http` 服务发送 HTTP GET 和 PUT 请求\n\n`$http`\
  \ 服务使你能够直接从 AngularJS 代码与 Web 服务器进行交互。`$http` 服务底层使用了浏览器的 `XMLHttpRequest` 对象，但运行在\
  \ AngularJS 框架的上下文中。\n\n使用 `$http` 服务有两种方式。最简单的方法是使用以下与标准 HTTP 请求对应的内置快捷方法之一：\n\n\
  ![Image](img/image00767.jpeg) `delete(url, [config])`\n\n![Image](img/image00767.jpeg)\
  \ `get(url, [config])`\n\n![Image](img/image00767.jpeg) `head(url, [config])`\n\n\
  ![Image](img/image00767.jpeg) `jsonp(url, [config])`\n\n![Image](img/image00767.jpeg)\
  \ `post(url, data, [config])`\n\n![Image](img/image00767.jpeg) `put(url, data, [config])`\n\
  \n![Image](img/image00767.jpeg) `patch(url, data, [config])`\n\n##### 配置 `$http`\
  \ 请求\n\n在这些方法中，`url` 参数是 Web 请求的 URL。可选的 `config` 参数是一个 JavaScript 对象，用于指定执行请求时使用的选项。表\
  \ 27.2 列出了可以在 `config` 参数中设置的属性。\n\n![Image](img/image01039.jpeg)![Image](img/image01040.jpeg)\n\
  \n**表 27.2 可在 `$http` 服务请求的 `config` 参数中定义的属性**\n\n你也可以通过直接将 `config` 参数传递给 `$http(config)`\
  \ 方法来指定请求、URL 和数据。例如，以下两行代码是等效的：\n\n```\n$http.get('/myUrl');\n\n$http({method:\
  \ 'GET', url:'/myUrl'});\n```\n\n##### 实现 `$http` 响应回调函数\n\n当你使用 `$http` 对象调用请求方法时，会返回一个带有\
  \ promise 方法 `success()` 和 `error()` 的对象。你可以向这些方法传递一个回调函数，该函数在请求成功或失败时被调用。这些方法接受以下参数：\n\
  \n![Image](img/image00767.jpeg) `data`：响应数据。\n\n![Image](img/image00767.jpeg) `status`：响应状态码。\n\
  \n![Image](img/image00767.jpeg) `header`：响应头。\n\n![Image](img/image00767.jpeg) `config`：请求配置。\n\
  \n以下是一个在 `get()` 请求上实现 `success()` 和 `error()` 方法的简单示例：\n\n```\n$http({method: 'GET',\
  \ url: '/myUrl'}).\n  success(function(data, status, headers, config) {\n    //\
  \ 处理成功\n  }).\n  error(function(data, status, headers, config) {\n    // 处理失败\n\
  \  });\n```\n\n* * *\n\n##### 动手实践：实现一个简单的 HTTP 服务器并使用 `$http` 服务访问它\n\n在本示例中，你将实现一个使用\
  \ `$http` 服务访问和更新 Web 服务器数据的 AngularJS 应用程序。本练习的目的是让你熟悉使用 `$http.get()` 和 `$http.post()`\
  \ 请求。\n\n清单 27.1 到 27.3 中的代码实现了一个简单的 Node.js Web 服务以及访问它的 AngularJS 应用程序。Web 服务器包含一个简单的\
  \ JavaScript 对象，其中包含商品和数量，用于模拟商店的库存。Web 应用程序允许用户告诉服务器补货、购买和使用商品。该示例非常基础，以便代码易于理解，但它包含了\
  \ `GET` 和 `POST` 请求以及错误处理示例。\n\n请按照以下步骤构建带有 `POST` 和 `GET` 请求处理程序的自定义 Web 服务器，并构建一个访问该服务器的\
