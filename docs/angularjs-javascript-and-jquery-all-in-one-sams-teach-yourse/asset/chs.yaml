  09 });\n```\n\n* * *\n\n* * *\n\n### 在 AngularJS 应用中使用 jQuery 或 jQuery Lite\n\n\
  你将在 AngularJS 应用中至少使用 jQuery lite，因此理解 jQuery、jQuery lite 和 AngularJS 之间的交互非常重要。即使你不是\
  \ jQuery 开发者，理解这些交互也能帮助你编写更好的 AngularJS 应用。如果你是 jQuery 开发者，理解这些交互将使你能够在 AngularJS\
  \ 应用中充分利用你的 jQuery 知识。\n\n以下各节描述了 jQuery lite 的实现，并简要介绍了你将在 AngularJS 应用中看到的 jQuery/jQuery\
  \ lite 交互。后续课程将通过一些在 AngularJS 应用中使用 jQuery 对象的实际示例来进一步扩展这一主题。\n\n#### 什么是 jQuery\
  \ Lite？\n\njQuery lite 是 jQuery 的精简版本，直接内置于 AngularJS 中。其目的是提供 jQuery 的所有有用功能，同时将其限制在\
  \ AngularJS 的职责分离范式内。\n\n表 20.2 列出了 jQuery lite 中可用的 jQuery 方法以及可能适用的任何限制。这些限制是必要的，例如强制仅在自定义指令内操作元素等。\n\
  \n![图片](img/image00991.jpeg)![图片](img/image00992.jpeg)\n\n**表 20.2 jQuery Lite 支持的\
  \ jQuery 方法**\n\n表 20.3 列出了 AngularJS 添加到 jQuery lite 对象中的额外事件和方法。\n\n![图片](img/image00993.jpeg)\n\
  \n**表 20.3 添加到 jQuery Lite 对象的方法和事件**\n\n#### 直接访问 jQuery 或 jQuery Lite\n\n对于大多数\
  \ AngularJS 应用，内置于 AngularJS 的 jQuery lite 库已经足够。然而，如果你需要完整版 jQuery 的额外功能，请在加载 AngularJS\
  \ 库之前加载 jQuery 库。例如：\n\n点击此处查看代码图片\n\n```\n<script src=\"http://code.jquery.com/jquery-1.11.0.min.js\"\
  ></script>\n```\n\n\n\n\n\n`<script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>`\n\n* * *\n\n## 顺便一提\n\n如果你决定在 AngularJS 中使用完整版的 jQuery，请确保在 HTML 中将\
  \ jQuery 库的 `<script>` 标签放在 AngularJS 库的 `<script>` 标签之前。否则，AngularJS 将无法正确绑定到 jQuery\
  \ 库。\n\n* * *\n\n无论加载的是 jQuery lite 还是完整版的 jQuery 库，在 AngularJS 启动时，都可以通过 `angular`\
  \ 变量的 `element` 属性从 AngularJS 代码中访问 jQuery。本质上，`angular.element` 将是 jQuery 应用中通常使用的\
  \ `jQuery` 变量的别名。描述这种关系的最佳方式之一如下：\n\n```\nangular.element() === jQuery() === $()\n\
  ```\n\n通常情况下，你会在 AngularJS 为你创建的 jQuery 对象中使用 jQuery 或 jQuery lite 的功能。\n\n例如，当你在\
  \ AngularJS 中创建指令（如本书后面所述）时，会向链接函数传递一个元素。如下所示，该元素是一个 jQuery 或 jQuery lite 对象，你可以相应地使用\
  \ jQuery 功能：\n\n```\nangular.module('myApp', [])\n .directive('myDirective', function()\
  \ {\n      . . .\n      link: function(scope, elem, attrs, photosControl) {\n  \
  \      //elem 是一个 jQuery lite 对象\n        elem.addClass(...);\n      }\n    };\n\
  ```\n\n另一个访问 jQuery 功能的例子来自 AngularJS 绑定上触发的事件。例如，考虑以下代码，它使用 `ngClick` 绑定将 `<div>`\
  \ 元素上的浏览器点击事件绑定到 AngularJS 代码中的 `clicked()` 函数：\n\n```\n<div ng-click=\"clicked($event)\"\
  >点击我</div>\n```\n\n你可以使用以下 AngularJS 代码访问该对象的 jQuery 版本：\n\n```\n$scope.clicked\
  \ = function(event){\n  var jQueryElement = angular.element(event.target);\n};\n\
  ```\n\n请注意，必须使用 `angular.element()` 方法将 `target` DOM 对象转换为 jQuery 对象。\n\n### 总结\n\
  \nAngularJS 是一个 JavaScript 库框架，为创建网站和 Web 应用程序提供了非常结构化的方法。AngularJS 将 Web 应用程序组织成非常清晰的\
  \ MVC 风格。AngularJS 作用域为应用程序的数据模型提供上下文绑定，并由基本的 JavaScript 对象组成。AngularJS 利用带有指令的模板来扩展\
  \ HTML 功能，使你能够实现完全自定义的 HTML 组件。\n\n在本课中，你了解了 AngularJS 应用程序中的不同组件以及它们如何相互交互。你还学习了\
  \ AngularJS 应用程序的生命周期，包括引导、编译和运行时阶段。在本课结束时，你逐步完成了一个实现基本 AngularJS 应用程序的示例，包括模板、模块、控制器和作用域。\n\
