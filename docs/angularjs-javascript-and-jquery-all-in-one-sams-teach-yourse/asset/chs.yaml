  7. 然后，以下行使用 AngularJS 表达式显示 `valueA` 与 `valueB` 相加的结果：\n\n   点击此处查看代码图片\n\n   ```html\n\
  \   11       Live Expression Value: {{valueA + valueB}}<br><br>\n   ```\n\n8. 清单\
  \ 22.4 中的以下代码行实现了一个输入按钮，当点击它时会调用 `addValues()`，并传入 `valueA` 和 `valueB` 的值：\n\n \
