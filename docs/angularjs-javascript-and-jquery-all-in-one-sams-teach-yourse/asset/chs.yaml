  \n## 第 7 课：使用 JavaScript 和 jQuery 对象访问 DOM 元素\n\n本课你将学到：\n\n![Image](img/image00767.jpeg)\
  \ jQuery 与 JavaScript DOM 对象的区别\n\n![Image](img/image00767.jpeg) 如何判断一个对象是 jQuery\
  \ 对象还是 DOM 对象\n\n![Image](img/image00767.jpeg) 如何从 DOM 对象获取 jQuery 对象\n\n![Image](img/image00767.jpeg)\
  \ 如何从 jQuery 对象获取 DOM 对象\n\n![Image](img/image00767.jpeg) 如何使用 jQuery 选择器快速查找 DOM\
  \ 元素\n\n动态 Web 开发最重要的部分是能够快速高效地访问 DOM 元素。JavaScript 本身提供了访问 DOM 元素的功能。有时这很有用；然而，这正是\
  \ jQuery 真正脱颖而出的地方，你也会理解为什么在 JavaScript 之上还需要 jQuery。\n\n在接下来的部分中，你将学习 jQuery 和\
  \ JavaScript DOM 对象的基本结构，如何判断一个对象是 jQuery 对象还是 DOM 对象，以及如何在它们之间切换。本课其余部分将讨论使用 jQuery\
  \ 和 JavaScript 查找和访问 DOM 元素的方法。\n\n### 理解 DOM 对象与 jQuery 对象的区别\n\n你需要理解 DOM 对象和\
  \ jQuery 对象之间的区别，以及如何操作和使用它们，以便在创建动态网页时更高效。在本节中，你将了解这些类型的对象以及如何在它们之间切换。\n\n####\
  \ 介绍 JavaScript DOM 对象\n\nDOM 对象是 Web 浏览器用于在网页上渲染元素的对象。因此，DOM 对象拥有大量的函数和属性。使用 DOM\
  \ 对象的优势在于你可以直接访问操作 HTML 元素所需的一切。\n\nDOM 对象的缺点是，大多数附加的函数和属性是浏览器需要的，在你使用 JavaScript\
  \ 时并不一定有用。这意味着 DOM 对象有很多属性和方法，会拖累你的调试环境，例如 Chrome 开发工具或其他 JavaScript 控制台。\n\n表 7.1\
  \ 列出了你应该了解的一些重要的 DOM 对象属性和方法。该列表并不全面，旨在让你了解可以从 DOM 对象访问哪些内容。\n\n![Image](img/image00864.jpeg)![Image](img/image00865.jpeg)\n\
  \n**表 7.1 附加到 DOM 对象的一些常用属性/方法**\n\n#### 介绍 jQuery 对象\n\njQuery 对象本质上是一组 DOM 元素的包装对象。jQuery\
  \ 对象仍然是 JavaScript 对象，并提供对 DOM 元素的访问——但方式更简单、更便捷，通常也更高效。\n\n最重要的是要记住，jQuery 对象可能代表单个\
  \ DOM 对象，也可能代表一组 DOM 对象。因此，如果你对 jQuery 对象应用一个操作，它可能会应用于多个 DOM 对象。\n\n\n\n\n\njQuery\
  \ 对象最大的优势在于它能够轻松搜索网页中的 HTML 元素。另一个优势是 jQuery 库封装了专门的方法和属性，使 JavaScript 和 jQuery\
  \ 开发者能够更方便地操作和处理不同的对象组。对 jQuery 对象调用方法可以应用于一个或多个 DOM 元素，而无需遍历列表。\n\n表 7.2 列出了一些你应该了解的\
  \ jQuery 对象的重要方法。该列表并不全面，旨在让你了解可以从 jQuery 对象访问哪些内容。\n\n![图片](img/image00866.jpeg)\n\
  \n**表 7.2 jQuery 对象上一些较常用的方法**\n\n#### 判断对象是 DOM 还是 jQuery\n\n有时，你可能会遇到一个对象，但不确定它是\
  \ jQuery 对象、DOM 对象还是其他 JavaScript 对象。有一种简单的方法可以区分。\n\n要判断一个对象是否为 jQuery 对象，请使用以下\
  \ `if` 语法检查该对象是否具有 `jquery` 属性：\n\n```\nif( obj.jquery ) {\n\n  ...\n```\n\n要判断一个对象是否为\
  \ DOM 对象，请使用以下 `if` 语法检查该对象是否具有 `nodeType` 属性：\n\n```\nif( obj.nodeType ) {\n\n\
    ...\n```\n\n#### 在 DOM 和 jQuery 之间转换对象\n\n如果你有一个 jQuery 对象，但想使用针对 DOM 对象的代码，或者反过来，该怎么办？答案是将其转换为另一种类型的对象。\n\
  \n`.get()` 方法以 DOM 对象数组的形式返回 jQuery 元素集的 JavaScript 版本。使用以下代码调用 `get()` 函数，该函数返回\
  \ jQuery 对象所表示的 HTML 元素的 DOM 对象：\n\n```\nvar domObj = jqueryObj.get();\n```\n\n\
  相反，`$()` 或 `jquery()` 方法从 JavaScript 创建一个新的 jQuery 对象。使用以下代码执行 `$()` 函数，将 DOM 对象包装为\
  \ jQuery 对象：\n\n```\nvar jqueryObj = $(domObj);\n```\n\n### 从 JavaScript 访问 DOM\
  \ 对象\n\n为了能够从 JavaScript 操作 HTML 元素，首先需要获取 DOM 对象的访问权限。你可以使用几种方法来实现这一点。\n\n####\
  \ 通过 ID 查找 DOM 对象\n\n最简单的方法是使用 `getElementById(id)` 函数，通过 `id` 属性的值查找 HTML 元素。`getElementById(id)`\
  \ 在 DOM 中搜索具有匹配 `id` 属性的对象。\n\n例如，以下代码搜索 `id=\"container\"` 的 HTML 元素：\n\n```\n\
  var containerObj = document.getElementById(\"container\");\n```\n\n#### 通过类名查找 DOM\
  \ 对象\n\n你也可以使用 `getElementsByClassName(class)` 通过 `class` 属性搜索 HTML 元素。该函数返回一个具有匹配\
  \ `class` 属性的 DOM 对象列表。然后，你可以使用 JavaScript 循环遍历该列表，并对每个 DOM 元素应用更改。\n\n例如，以下代码检索\
  \ `class=\"myClass\"` 的 HTML 元素列表，然后遍历它们：\n\n```\nvar objs = document.getElementsByClassName(\"\
  myClass\");\n\nfor (var i=0; i<objs.length; i++){\n\n  var htmlElement = objs[i];\n\
  \n  ...\n\n}\n```\n\n#### 通过标签名查找 DOM 对象\n\n另一种搜索 HTML 元素的方式是通过 HTML 标签，使用 `getElementsByTagName(tag)`。该函数返回一个具有匹配\
  \ HTML 标签的 DOM 对象列表。然后，你可以使用 JavaScript 循环遍历该列表，并对每个 DOM 元素应用更改。\n\n例如，以下代码检索 `<div>`\
  \ HTML 元素列表，然后遍历它们：\n\n```\nvar objs = document.getElementsByTagName(\"div\");\n\
  \nfor (var i=0; i<objs.length; i++){\n\n  var htmlElement = objs[i];\n\n  ...\n\n\
  }\n```\n\n* * *\n\n**动手实践：使用 JavaScript 访问 DOM 对象**\n\n在本示例中，你将使用 JavaScript 查找不同的元素，读取值并向它们写入值。这是一个基础示例，旨在让你有机会使用\
  \ JavaScript 访问 DOM 对象。示例中使用的完整脚本如清单 7.1、7.2 和 7.3 所示：\n\n1. 在 Eclipse 中，创建一个名为\
  \ `lesson07` 的源文件夹。在 `lesson07` 文件夹内，创建 `js` 和 `css` 文件夹。\n\n2. 在 `lesson07` 文件夹中创建一个名为\
