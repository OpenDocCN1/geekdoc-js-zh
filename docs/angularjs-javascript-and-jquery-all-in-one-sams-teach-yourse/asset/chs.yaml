  ---\n\n## 实现元素移动\n\n另一个值得动画化的动态效果是元素的重定位——具体来说，就是将元素从一个位置移动到另一个位置。用户讨厌当他们执行某个操作时，页面元素突然出现在另一个位置。通过动画化移动过程，用户可以看清元素去了哪里，并在思维上做出必要的调整。\n\
  \n以下各节描述了动画化元素重定位的方法。你还有机会实现一些代码，以巩固这些概念。\n\n### 对静态元素进行位置变化动画\n\n你不能直接改变静态页面元素的位置，因为它们只是随周围元素流动。但是，你可以对\
  \ `margin` 和 `padding` 属性进行动画。例如，以下代码通过动画化 `margin-left` 属性，将所有 `<p>` 元素向右移动：\n\n\
  ```\n$(\"p\").animate({\"margin-left\":30}, 1000);\n```\n\n### 对非静态元素进行位置变化动画\n\n\
  你进行的大部分移动动画将针对非静态元素，通常会是固定定位的元素，因为移动它们更简单、更安全，无需担心其他元素的位置。\n\n无论如何，无论是固定定位、绝对定位还是相对定位的元素，你动画化的都是相同的两个值：`top`\
  \ 和 `left`。要动画化垂直移动，使用 `top`；要动画化水平移动，使用 `left`。例如，以下语句将元素向右移动 10 像素，然后向下移动 10 像素：\n\
  \n```\nvar position = $(\"#element\").offset();\n$(\"#element\").animate({top:position.top+10},\
  \ 1000);\n$(\"#element\").animate({top:position.left+10}, 1000);\n```\n\n你也可以通过同时动画化\
  \ `top` 和 `left` 来实现对角线方向的移动。例如，以下代码在同一动画中向下移动 10 像素并向右移动 100 像素：\n\n```\nvar position\
  \ = $(\"#element\").offset();\n$(\"#element\").animate({top:position.top+10, top:position.left+100},\
  \ 1000);\n```\n\n---\n\n## 动手实践：使用 jQuery 动画创建简单的飞碟应用\n\n在本例中，你将创建一个简单的 Web 应用，提供控制飞碟在一组卫星周围飞行的功能。练习的目的是让你有机会使用一些移动动画技术，让飞碟在页面中移动。示例代码见清单\
  \ 12.13、12.14 和 12.15。\n\n按照以下步骤创建动态网页：\n\n1. 在 Eclipse 中创建 `lesson12/interactive_animation.html`、`lesson12/js/interactive_animation.js`\
  \ 和 `lesson12/css/interactive_animation.css` 文件。\n\n2. 将清单 12.13 和清单 12.15 中的代码添加到\
  \ HTML 和 CSS 文件中。HTML 代码显示一组用于控制的图像。你可以使用几个 `<span>` 元素作为控制按钮之间的间隔。其余图像是飞碟和卫星。每个卫星都有自己的\
  \ id，以便在 CSS 中定位。\n\n3. 打开 `interactive_animation.js` 文件，添加以下全局变量和基本的 `load()` 函数。这些变量存储浏览器窗格的\
  \ `height` 和 `width`，以便你知道何时停止动画。第 4 行也使用这些变量将飞机图像定位在网页中央。\n\n\n\n\n\n```\n01 var\
  \ rightEdge = window.innerWidth;\n02 var bottomEdge = window.innerHeight;\n03 $(window).load(function(){\n\
  $(\"#ship\").offset({top:bottomEdge/2, left:rightEdge/2});\n...\n22 });\n```\n\n\
  4. 为控制按钮添加以下处理程序。请注意，每个处理程序首先更改飞机的图片 `src`，停止当前动画，然后对 `left` 或 `top` 属性进行动画处理以移动飞机。`#stop`\
  \ 处理程序停止所有动画并清除动画队列：\n\n点击此处查看代码图片\n\n```\n05   $(\"#up\").click(function(){\n06\
