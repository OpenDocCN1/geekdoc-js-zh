  \ 用于设置页面元素样式的 CSS 代码**\n\n点击此处查看代码图片\n\n***\n\n```\n01 img {\n02     width:60px;\
  \ margin-right:20px; vertical-align:middle; }\n03 div {\n04     margin-top:15px;\
  \ border:1px dotted;\n05     width:400px; font-size:35px;}\n06 span {\n07     background-image:\
  \ -moz-linear-gradient(top , #B1B1B1, #FFFFFF);\n08   background-image: -webkit-linear-gradient(top\
