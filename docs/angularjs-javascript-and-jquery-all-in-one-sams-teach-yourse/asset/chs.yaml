  \ 如何使用简单的 AngularJS 代码实现星级评分视图\n\n本书之前的 AngularJS 课程旨在教你 AngularJS 应用程序不同组件的机制和基本实现。你已经学习了作用域/模型、视图、控制器、指令和服务。本课稍微转换一下方向，提供一些示例来帮助你巩固\
  \ AngularJS 中的实现方式。\n\nAngularJS 期望的结构比普通 JavaScript 甚至 jQuery 要多得多。然而，它仍然在框架内提供了很大的灵活性。因此，尽可能多地了解\
  \ AngularJS 中不同的实现角度是一个好主意。\n\n这就是为什么整节课都致力于一系列以不同方式实现 AngularJS 的示例。本课中的示例并非完美无缺——有些比另一些更完善——但它们确实提供了实现自定义指令和利用内置指令的不同视角。目的不是为你提供立即可重用的代码，而是为你提供一些不同的视角和基本框架，以便你在设计自己的实现时可以在此基础上进行构建。\n\
  \n* * *\n\n### 动手实践：构建选项卡视图\n\n在本示例中，你将构建两个自定义 AngularJS 指令，一个充当选项卡组，另一个充当选项卡组中的各个面板。本示例的目标是让你了解如何在彼此内部嵌套自定义指令，以及两者之间的一些通信。\n\
  \n按照以下步骤构建选项卡视图 AngularJS 应用程序：\n\n**1.** 在你的代码位置创建以下文件夹和文件结构。`server.js` 文件和 images\
  \ 文件夹是在第 1 课“动态 Web 编程简介”中创建的。你需要从本书的网站获取图像，或者提供你自己的图像：\n\n![Image](img/image00767.jpeg)\
