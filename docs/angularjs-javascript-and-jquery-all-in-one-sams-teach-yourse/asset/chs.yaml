  ></script>\n07     <script type=\"text/javascript\" src=\"js/card_suits.js\"></script>\n\
  08     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/card_suits.css\">\n\
  09   </head>\n10   <body>\n11     <p>牌面与花色：</p>\n12     <input type=\"text\" />\n\
  13     <span>&#9824;</span>\n14     <span>&#9827;</span>\n15     <span>&#9829;</span>\n\
  16     <span>&#9830;</span>\n17   </body>\n18 </html>\n```\n\n* * *\n\n## 清单 9.11\
  \ card_suits.js JavaScript 代码，从 `<span>` 元素的事件处理器触发 `<input>` 元素的 `keypress` 事件\n\
  \n[点击此处查看代码图片]\n\n* * *\n\n```javascript\n01 function inputHandler(e){\n02   var\
  \ chr = String.fromCharCode(e.charCode);\n03   $(\"p\").append(chr);\n04 }\n05 function\
  \ spanHandler(e){\n06   var chrCode = e.target.innerHTML.charCodeAt(0);\n07   $(\"\
  input\").trigger({'type':'keypress', 'charCode':chrCode});\n08 }\n09 $(document).ready(function(){\n\
  10   $(\"input\").keypress(function (e){inputHandler(e)});\n11   $(\"span\").click(function\
  \ (e){spanHandler(e)});\n12 });\n```\n\n* * *\n\n## 清单 9.12 card_suits.css CSS 代码，为\
  \ `<span>` 和 `<p>` 元素设置样式\n\n[点击此处查看代码图片]\n\n* * *\n\n```css\n01 span{\n02   border-radius:5px;\n\
  03   margin:3px;padding:5px;\n04   background-color:#C0C0C0;\n05   border:3px ridge;\n\
  06   display:inline-block;\n07   cursor:pointer;\n08 }\n09 p{\n10   border:4px outset\
  \ steelblue;\n11   padding:3px;\n12   color:white;background-color:skyblue;\n13\
  \   font-size:30px;font-weight:bold;\n14 }\n```\n\n* * *\n\n## 创建自定义事件\n\nJavaScript\
  \ 和 jQuery 事件处理机制的一个极其强大的方面是能够添加自定义事件。这解决了内置事件都绑定到 DOM 元素和浏览器支持的特定行为的问题。如果你希望每当数组中的项目数大于\
  \ 100 时触发一个事件，该怎么办？\n\n自定义事件使你能够扩展可以添加到元素上的事件。自定义事件并不直接对应于与用户的物理交互，而是对应于基于用户正在执行的操作在你的代码中发生的事件。\n\
  \n创建自定义事件的优势在于，你可以使用已经就位的事件处理系统，该系统允许你添加/移除事件、让事件冒泡以及触发事件。\n\n以下各节描述了在 JavaScript\
  \ 和 jQuery 中可以用来添加自定义事件的不同方法。\n\n### 使用 JavaScript 添加自定义事件\n\n在 JavaScript 中添加自定义事件类似于触发事件，你需要创建一个自定义事件对象，然后对其进行初始化。以下代码展示了创建基本自定义事件的示例：\n\
  \n[点击此处查看代码图片]\n\n```javascript\nvar myEvent = document.createEvent(\"CustomEvent\"\
  );\nmyEvent .initCustomEvent(\n  \"worldEnds\",\n  true,\n  false,\n  {\n      'fire':\
  \ false,\n      'ice': false,\n      'time': new Date()\n  }\n);\n```\n\n第一个参数定义了\
  \ `type` 名称，第二个参数将 `bubbles` 属性设置为 true，第三个参数将 `cancelable` 设置为 false，第四个参数定义了事件的\
  \ `details`。`fire`、`ice` 和 `time` 的值将通过事件对象的 `details` 属性可用。\n\n创建事件后，你可以通过调用 DOM\
  \ 对象上的 `dispatchEvent()` 方法来触发该事件。例如：\n\n[点击此处查看代码图片]\n\n```javascript\nvar obj\
  \ = document.getElementById(\"#notify\");\nobj.dispatchEvent(myEvent);\n```\n\n\
  可以使用 `addEventListener()` 方法以常规方式将事件的事件处理器添加到 DOM 元素。例如：\n\n[点击此处查看代码图片]\n\n```javascript\n\
  document.addEventListener(\"worldEnds \", endOfWorldHandler, false);\n```\n\n###\
  \ 使用 jQuery 添加自定义事件\n\n在 jQuery 中添加自定义事件是一个简单的过程。只需调用 `$.event.trigger()` 并传入新的事件对象即可。你必须为事件对象指定一个\
  \ `type` 属性，但之后你可以为事件对象定义任何你想要的默认值。例如，以下代码定义了一个新事件：\n\n[点击此处查看代码图片]\n\n```javascript\n\
  var custEvent = $.Event(\"worldEnds\", {\n  fire: false,\n  ice: false,\n  time:\
  \ new Date()\n});\n```\n\n下一行代码在事件系统中触发该事件：\n\n```javascript\n$.event.trigger(custEvent);\n\
  ```\n\n将事件添加到系统后，你可以为其附加事件处理器。例如：\n\n[点击此处查看代码图片]\n\n```javascript\n$(document).on(\"\
  worldEnds\", endOfWorldHandler);\n```\n\n## 实现回调\n\n虽然回调并非真正的事件，但它们有一些相似之处。回调是一个可以在\
  \ jQuery 中注册，然后从代码中在特定时间触发的函数。当回调列表被触发时，每个函数都会按顺序执行。\n\n回调的一个有用示例是，如果你希望用户可以选择指定在后台进程（例如通过\
  \ AJAX 下载数据）完成时收到通知。如果用户选择启用通知，则可以添加一个回调。然后，每当下载完成时，回调函数就会执行并向用户显示通知。\n\n### 理解回调机制\n\
  \n回调机制通过调用 `$.Callbacks(flags)` 来创建一个 `callbacks` 对象。`flags` 属性的目的是提供指定当不同回调函数执行时应发生的行为的能力。`flags`\
  \ 的可能值如下：\n\n![Image](img/image00767.jpeg) once——添加的函数仅触发一次。\n\n![Image](img/image00767.jpeg)\
  \ memory——当添加新函数时，它们会立即以与上次触发回调时相同的值被触发。\n\n![Image](img/image00767.jpeg) unique——允许回调函数仅被添加一次。\n\
  \n![Image](img/image00767.jpeg) stopOnFalse——如果某个被触发的函数返回 false，则停止触发其他回调函数。\n\n\
  `callbacks` 对象支持使用 `add(functionName)` 方法添加函数，以及使用 `remove(functionName)` 方法移除函数。要触发回调列表，请调用\
  \ `fire()` 方法。你还可以使用 `disable()` 方法禁用该列表。\n\n理解实现回调的最简单方法是看一些示例。以下代码定义了一个回调列表，该列表要求函数名称唯一，并且如果其中一个函数返回\
  \ false 则停止：\n\n[点击此处查看代码图片]\n\n```javascript\nfunction functionA(){return true;}\n\
  function functionB(){return true;}\nfunction functionC(){return true;}\nvar callbacks\
  \ = $Callbacks(\"unique stopOnFalse\");\ncallbacks.add(functionA);\ncallbacks.add(functionB);\n\
  callbacks.fire()\ncallbacks.remove(functionB);\ncallbacks.add(FunctionC);\ncallbacks.fire();\n\
  callbacks.disable();\ncallbacks.fire();\n```\n\n第一次触发 `callbacks` 时，执行了 `functionA`\
  \ 和 `functionB`。第二次触发时，由于 `functionB` 已被移除，执行了 `functionA` 和 `functionC`。第三次触发时，由于列表已被禁用，没有执行任何函数。\n\
  \n### 使用 Deferred 对象\n\n\n\n\njQuery 提供了一种有趣的方式来实现回调，即 deferred 对象。deferred 对象是一个包含一组函数的对象，这些函数可以在稍后执行。实际传递给函数的参数只有在\
  \ deferred 对象被解析且函数执行时才会添加。\n\n这允许你将一组函数应用于一个可以在任何时候调用的单一对象。\n\n以下代码演示了如何创建一个包含多个函数的简单\
  \ deferred 对象，然后执行这些函数：\n\n点击此处查看代码图片\n\n```javascript\nvar resultString = \"\"\
  ;\n\nfunction function1(n1, n2, p3) { resultString += \"Problem: \"; }\n\nfunction\
  \ function2(n1, n2) { resultString += n1 + \" + \"; }\n\nfunction function3(n1,\
  \ n2) { resultString += n2 + \" = \"; }\n\nvar deferredObj = $.Deferred();\n\ndeferredObj.done(\
  \ [function1, function2], function3).done(function(n1, n2) {\n\n    resultString\
  \ += n1 + n2;\n\n    $(\"div\").append(resultString);\n\n  });\n\ndeferredObj.resolve(5,6);\n\
  ```\n\n上述代码的执行过程如下：定义的三个函数都向 `resultString` 变量添加内容。创建了一个名为 `deferredObj` 的新 deferred\
  \ 对象。调用 `.done(functions [, functions])` 方法将函数添加到 deferred 对象中。使用了三种方式来添加函数。第一个参数是一个要执行的函数列表，第二个参数是单个函数，第三个参数是一个匿名函数。\n\
  \n这些函数直到调用 `.resolve(args)` 时才会执行。注意，`.resolve()` 的参数与函数所需的参数相匹配。每个函数按顺序执行。结果是以下字符串被追加到\
  \ `<div>` 元素中：\n\n`Problem: 5 + 6 = 11`\n\n### 总结\n\n本课重点介绍了在网页中实现事件处理的不同方式。事件处理是交互式网页的核心。JavaScript\
  \ 和 jQuery 在如何创建事件并将其添加到 DOM 元素方面有所不同。你学习了在两者中添加事件处理程序的方法。\n\n你还学习了如何访问事件对象以及将自定义对象传递给事件处理程序，并且学习了如何创建和触发自定义事件。\n\
  \n### 问与答\n\n**问. 什么时候更适合使用 JavaScript 而不是 jQuery 来创建和触发自定义函数？**\n\n**答.** 永远不会。好吧，也不一定。目前\
  \ jQuery 在事件方面拥有更多的跨浏览器支持。此外，创建所需的对象也更容易。基于这些原因，你应该几乎总是使用 jQuery。如果由于向后兼容等原因，你的环境无法使用\
  \ jQuery，那么再使用 JavaScript。\n\n**问. 使用自定义事件难道不能完成回调所能做的所有事情吗？**\n\n**答.** 不太容易。请记住，你可以创建任意数量的回调列表，并设置不同的标志，只触发与特定列表绑定的函数。试图在事件处理程序中管理所有这些很快就会失控。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 小测验\n\n**1.**\
  \ `<body>` 标签的哪个 HTML 属性可用于在页面加载完成后调用 JavaScript 代码？\n\n**2.** 判断正误：事件只会触发其发生的目标元素上的处理函数。\n\
  \n**3.** 什么时候应该使用 `.ready()` 方法而不是 `.load()` 方法？\n\n**4.** 判断正误：鼠标事件只能由鼠标移动或鼠标点击触发。\n\
  \n#### 小测验答案\n\n**1.** `onload`。\n\n**2.** 错误。大多数事件会通过祖先对象向上冒泡，一直到达文档对象。\n\n**3.**\
  \ 当你只需要 DOM 加载完成时，使用 `.ready()`。如果你还需要其他资源（如图像）加载完成，则使用 `.load()`。\n\n**4.** 错误。在\
  \ jQuery 和 JavaScript 中都可以手动触发鼠标事件。\n\n#### 练习\n\n**1.** 扩展清单 9.10、9.11 和 9.12 中的示例，为其他非标准字符添加额外的按钮。你需要从网上获取\
  \ Unicode 字符代码。\n\n**2.** 扩展清单 9.7、9.8 和 9.9 中的示例，添加另一个按钮来触发所有复选框的事件。\n\n## 第 10\
  \ 课：使用 JavaScript 和 jQuery 动态访问和操作网页\n\n本课你将学到：\n\n![Image](img/image00767.jpeg)\
  \ 跟踪鼠标位置及其他信息\n\n![Image](img/image00767.jpeg) 操作页面元素的大小及其他属性\n\n![Image](img/image00767.jpeg)\
  \ 如何动态显示和隐藏元素\n\n![Image](img/image00767.jpeg) 页面元素的层叠\n\n![Image](img/image00767.jpeg)\
  \ 动态创建 DOM 元素并将其添加到网页中\n\n![Image](img/image00767.jpeg) 在 jQuery 中添加和移除类\n\n![Image](img/image00767.jpeg)\
  \ 修改网页布局\n\n本课内容非常丰富。到目前为止，你已经掌握了实现高度动态和交互式网页所需的大部分工具。在本课中，你将更进一步，学习如何使用这些工具以及一些新工具来访问网页元素的信息。然后，你将利用这些信息来操作和排列它们。\n\
  \n能够访问和修改不同页面元素的属性和值，将使你能够将基本网页转变为真正的 Web 应用程序。\n\n在本课中，你将了解到 JavaScript 和 jQuery\
  \ 用于网页操作的方法非常开放。你可以从 JavaScript 代码的任何位置操作任何页面元素。这样做的好处是，只需少量 JavaScript/jQuery 代码就能轻松转换页面。缺点是你需要自律，保持代码易于维护，以便知道所有操作来自何处。AngularJS\
  \ 采用了一种截然不同的方法，你将在 AngularJS 课程部分学到。现在，先享受快速而简单的动态网页操作之旅吧。\n\n### 访问浏览器和页面元素的值\n\
  \njQuery 和 JavaScript 的核心基础之一是对 DOM 对象的访问，这些对象代表网页上的元素。本节将指导你访问元素的属性值、位置、大小和其他属性，并展示如何修改其中的许多属性。\n\
  \n#### 获取鼠标位置\n\n鼠标移动是你将处理的最常见的网页交互之一。通常，你需要根据鼠标的位置对页面上的元素进行调整。\n\n当鼠标事件被触发时，可以从事件对象中获取鼠标位置。请记住，事件指定了三个鼠标坐标。表\
  \ 10.1 描述了每个坐标。\n\n![Image](img/image00898.jpeg)\n\n**表 10.1 指定鼠标位置的事件对象属性**\n\n\
  以下代码展示了如何从名为 `e` 的事件对象中获取鼠标坐标并将其应用于字符串变量：\n\n点击此处查看代码图片\n\n```javascript\nvar screenPosition\
  \ = e.screenX + \", \" + e.screenY;\nvar pagePosition = e.pageX + \", \" + e.pageY;\n\
  var browserPosition = e.clientX + \", \" + e.clientY;\n```\n\n#### 获取和设置值\n\n\n\n\
  \n几个 HTML 元素，尤其是输入元素，都有关联的值。在 jQuery 和 JavaScript 中访问元素的值都是一件简单的事情。\n\n在 JavaScript\
  \ 中，可以通过直接访问对象的 `value` 属性来获取值。例如：\n\n点击此处查看代码图片\n\n```\ndomObject.value = 5;\n\n\
  var value = domObject.value;\n```\n\n而 jQuery 则提供了 `.val()` 方法来获取和设置值。例如，以下代码设置并获取了一个表示\
  \ HTML `<input>` 元素（其 `id` 为 `\"textInput\"`）的 jQuery 对象的值：\n\n点击此处查看代码图片\n\n```\n\
  $(\"#textInput\").val(5);\n\nvar value = $(\"#textInput \").val();\n```\n\n####\
  \ 在 jQuery 中获取和设置属性（Attributes）与特性（Properties）\n\nDOM 对象可以直接访问其所代表的 HTML 元素的 DOM\
  \ 对象属性和 DOM 元素特性。这在 jQuery 中并不合理，因为 jQuery 对象通常代表多个具有不同属性的元素。因此，jQuery 提供了 `.attr()`\
  \ 和 `.prop()` 方法来获取和设置这些元素的属性和特性。\n\n`.attr(attribute, [value])` 方法允许你仅指定属性名来获取当前值，也可以指定一个可选值来设置当前值。例如，以下代码获取了某个\
  \ `id` 为 `\"bannerImg\"` 的图片元素的 `src` 值：\n\n点击此处查看代码图片\n\n```\nvar state = $(\"\
  #bannerImg\").attr(\"src\");\n```\n\n然后，以下语句设置了所有 `<img>` 元素的 `src` 属性值：\n\n点击此处查看代码图片\n\
  \n```\n$(\"img\").attr(\"src\",\"images/default.jpg\");\n```\n\n`.prop(property,\
  \ [value])` 方法允许你指定特性名来获取当前值，也可以指定一个可选值来设置当前值。例如，以下代码获取了某个 `id` 为 `\"firstCheckbox\"\
  ` 的元素的选中状态：\n\n点击此处查看代码图片\n\n```\nvar state = $(\"#firstCheckbox\").prop(\"checked\"\
  );\n```\n\n而以下语句会将所有 `<input>` 元素的 `checked` 值设置为 `true`：\n\n点击此处查看代码图片\n\n```\n\
  $(\"input\").prop(\"checked\", true);\n```\n\n* * *\n\n**注意**\n\n在 jQuery 中，特性（property）和属性（attribute）的唯一区别在于：属性是定义\
  \ HTML 结构的值，而特性是影响对象动态状态的值。例如，在 `<input>` 元素中，`\"type\"` 是一个属性，因为它定义了结构；而 `\"checked\"\
  ` 是一个特性，因为它只影响状态。\n\n* * *\n\n#### 获取和设置 CSS 属性\n\n动态 Web 编程的另一个重要方面是 CSS 的动态操作。\n\
  \nJavaScript 允许你通过 DOM 对象的 style 属性访问 CSS 属性。例如，你可以使用以下代码从 DOM 对象中获取元素的 `color`\
  \ 和 `background-color` CSS 属性。注意，你需要使用 `style[\"background-color\"]` 语法，因为 `style.background-color`\
  \ 在 JavaScript 中无效：\n\n点击此处查看代码图片\n\n```\nvar domObj = document.getElementById(\"\
  banner\");\n\nvar color = domObj.style.color;\n\nvar color = domObj.style.[\"background-color\"\
  ];\n```\n\n另一个例子是，你可以使用以下代码为元素设置 `position`、`top` 和 `left` CSS 属性：\n\n点击此处查看代码图片\n\
  \n```\ndomObj.style.position = \"absolute\";\n\ndomObj.style.top = \"100px\";\n\n\
  domObj.style.left = \"100px\";\n```\n\njQuery 也使得使用 `.css(property, [value])` 方法获取和设置\
  \ CSS 值变得极其简单。例如，以下代码检索了某个元素的 `cursor` CSS 属性值：\n\n点击此处查看代码图片\n\n```\n$(\"#buttonA\"\
  ).css(\"cursor\");\n```\n\n然后，以下代码设置了 `border-radius` 值：\n\n点击此处查看代码图片\n\n```\n\
  $(\"#buttonA\").css(\"border-radius\", \"10px 15px\");\n```\n\n`.css()` 方法还允许你传递一个包含属性和值的映射对象。这使你能够一次性设置多个设置项。例如，以下代码使用\
  \ `.css()` 同时设置了 `margin`、`padding`、`float` 和 `font-weight` 属性：\n\n点击此处查看代码图片\n\n\
  ```\n$(\"span\").css({margin:0, padding:2, float:\"left\", \"font-weight\":\"bold\"\
  });\n```\n\n注意，属性名可以用引号括起来，也可以不用。如果属性名包含 `–` 或其他在 JavaScript 对象名中无效的字符，则需要使用引号。值可以是数字或字符串。对于表示距离的数值，可以用\
  \ `px`、`cm` 或 `%` 表示；默认单位是 `px`，因此如果你想指定像素，只需输入数字即可。如果你想指定 `cm`、`%` 或其他值类型，则需要使用字符串——例如\
  \ `\"100%\"`。\n\n#### 获取和设置元素尺寸\n\n动态操作 HTML 元素时的另一个重要方面是获取元素的尺寸。jQuery 使这变得非常简单。表\
  \ 10.2 展示了 jQuery 对象中提供的用于获取元素高度和宽度的方法。\n\n![图片](img/image00899.jpeg)\n\n**表 10.2\
  \ 用于获取和设置元素尺寸的 jQuery 对象方法**\n\n* * *\n\n**警告**\n\n高度和宽度方法仅返回 jQuery 对象集合中第一个元素的尺寸。对于单个对象集合来说，这不是问题。只需记住，集合中的其他对象可能具有不同的尺寸。\n\
  \n* * *\n\n#### 获取和设置元素位置\n\n除了 HTML 元素的尺寸，你通常还需要获取它们的位置。在处理 HTML 元素时，有两种位置类型。第一种是相对于整个文档的位置。第二种是相对于作为偏移父元素的\
  \ HTML 元素的位置。哪个元素是偏移父元素取决于 CSS 中的位置设置。\n\njQuery 提供了 `.position([position])` 方法来获取相对于偏移父元素的位置。`.offset([position])`\
  \ 方法提供了相对于文档的位置。这两个方法都可以不带参数调用。它们返回一个简单的对象，包含 `left` 和 `right` 属性，分别表示距离左侧和顶部的像素数（使用\
  \ `.position()` 时相对于偏移父元素，使用 `.offset()` 时相对于文档）。它们也可以带一个简单的 `position` 参数调用，该参数是一个包含\
  \ `left` 和 `right` 属性的对象。当使用 `position` 参数调用时，它们会设置元素的位置。\n\n例如，以下代码将获取某个 `id` 为\
  \ `\"myElement\"` 的元素相对于文档顶部和左侧的像素数，以及相对于偏移父元素的像素数。注意，为了将语句放在一行，你在调用后直接引用了 `top`\
  \ 和 `left` 属性：\n\n点击此处查看代码图片\n\n```\nvar pixelsFromPageTop = $(\"#myElement\").offset().top;\n\
  \nvar pixelsFromPageLeft = $(\"#myElement\"). offset ().left;\n\nvar pixelsFromParentTop\
  \ = $(\"#myElement\").position().top;\n\nvar pixelsFromParentLeft = $(\"#myElement\"\
  ). position ().left;\n```\n\n要将该元素的位置设置为恰好位于文档左上角下方 10 像素、右侧 10 像素处，请使用以下语句，该语句定义了一个包含\
  \ `left` 和 `top` 值的简单对象，并将其传递给 `.offset()` 方法：\n\n点击此处查看代码图片\n\n```\n$(\"#myElement\"\
  ).offset({\"top\":10,\"left\":10});\n```\n\n#### 访问类\n\n\n\n获取与 HTML 元素关联的类的最简单方法是查看\
  \ DOM 对象的 `className` 属性。`className` 属性是一个字符串，包含附加到该元素的类名。请记住，一个元素可能附加了多个类名。在这种情况下，名称之间会用空格分隔。\n\
  \n以下示例展示了如何从 jQuery 中获取 `id=\"mainList\"` 元素的 `className` 属性：\n\n点击此处查看代码图片\n\n\
  ```\nvar class = $(\"#mainList\").get().className;\n```\n\n## 获取浏览器和屏幕的尺寸及颜色信息\n\
  \n动态操作网页的一个重要部分是能够访问有关屏幕和浏览器的信息。本节重点介绍尺寸和颜色功能。\n\n获取屏幕或浏览器窗口的尺寸，可以让你根据屏幕或浏览器窗口的可用区域调整\
  \ HTML 元素的大小。\n\n你可以使用 JavaScript 中的 `Screen` 对象访问屏幕尺寸。`Screen` 对象提供了 `width` 和\
  \ `height` 属性，即屏幕分辨率尺寸。例如，以下代码将屏幕的 `width` 和 `height` 存储在变量中：\n\n点击此处查看代码图片\n\n\
  ```\nvar sWidth = screen.width;\nvar sHeight = screen.height;\n```\n\n要获取屏幕（以及 Web\
  \ 浏览器）支持的颜色，请使用 `Screen` 对象的 `colorDepth` 属性。该属性返回支持的位数——例如 8、16、24。以下是获取屏幕支持的颜色深度的示例：\n\
  \n点击此处查看代码图片\n\n```\nvar colorBits = screen.colorDepth;\n```\n\n即使屏幕很大，浏览器窗口也可能没有占满整个屏幕。虽然浏览器窗口为超出窗口大小的网页提供了滚动条，但通常随着浏览器大小的变化，调整页面上的元素大小或布局会显得更好。\n\
  \n浏览器尺寸可以通过 JavaScript 中 window 对象的 `innerWidth`、`outerWidth`、`innerHeight` 和 `outerHeight`\
  \ 属性访问。`innerHeight` 和 `innerWidth` 值指的是网页实际可用的区域。`outerWidth` 和 `outerHeight` 指的是总区域，包括浏览器菜单、边框和工具栏。以下是获取网页显示区域尺寸的示例：\n\
  \n点击此处查看代码图片\n\n```\nvar pageWidth = window.innerWidth;\nvar pageHeight = window.innerHeight;\n\
  ```\n\n* * *\n\n### 动手实践：使用 jQuery 和 JavaScript 获取屏幕、浏览器、鼠标和元素信息\n\n现在是将所有内容整合在一起的时候了。在本示例中，你将构建一个包含一些不同\
  \ HTML 元素的基本网页。其中一个元素是一个 `<div>`，用于显示屏幕、浏览器、鼠标和元素信息，并且每次鼠标移动时都会更新。代码如列表 10.1、10.2\
  \ 和 10.3 所示。乍一看可能代码很多，但实际上它非常基础，并且将帮助你了解如何从 jQuery 和 JavaScript 获取当前状态的信息。\n\n按照以下步骤实现该示例：\n\
