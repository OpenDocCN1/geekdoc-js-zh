  ```\n\n* * *\n\n### 总结\n\nAngularJS 模板实现起来很简单，但功能非常强大且扩展性强。本课讨论了 AngularJS 模板的组成部分，以及它们如何协同工作来扩展\
  \ HTML DOM 的行为和功能。表达式是包含在 `{{}}` 括号内或 AngularJS 模板指令定义中的 JavaScript 代码片段。表达式可以访问作用域，因此你可以将作用域值渲染到视图中。\n\
  \n过滤器充当表达式的修饰符，使你能够为特定目的格式化表达式结果。AngularJS 提供了几个内置过滤器，例如用于货币和日期格式化的过滤器。你还可以创建自己的自定义过滤器，在将数据渲染到页面之前应用任何你想要的格式化或修改。你将过滤器作为提供者注入到注入器服务中，因此可以通过依赖注入在控制器和模板中访问它们。这意味着你也可以在\
  \ JavaScript 代码中访问过滤器。\n\n### 问答\n\n**Q.** 为什么使用自定义过滤器而不是控制器中的简单函数？\n\n**A.** AngularJS\
  \ 的理念是尽可能多地在 HTML 模板中表达意图。这使得应用程序更易于设计和跟踪。而且，重用过滤器比重用自定义函数要容易得多。\n\n**Q.** 为什么 HTML\
  \ 标准不将 AngularJS 提供的所有功能都纳入 HTML 规范？\n\n**A.** 随着时间的推移，HTML 很可能会添加 AngularJS 提供的部分功能。然而，要让像\
  \ HTML 这样被广泛采用的规范以开发者所需的速度演进是非常困难的。AngularJS 是次优的选择。\n\n### 实践练习\n\n本实践练习包含一组问题和答案，旨在巩固你对本课时所学内容的理解。在查看答案之前，请先尝试回答问题。\n\
