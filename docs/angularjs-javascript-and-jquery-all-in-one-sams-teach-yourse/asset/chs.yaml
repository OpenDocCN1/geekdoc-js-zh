  13     <div id=\"outset\">Outset Border</div>\n14     <div id=\"ridge\">Ridge Border</div>\n\
  15     <div id=\"round\">Round Border</div>\n16     <div id=\"veryround\">Rounder\
  \ Border</div>\n17     <div id=\"shadow\">Outset shadow</div>\n18     <div id=\"\
  ishadow\">Inset shadow</div>\n19     <div id=\"mixed\">Mixed Border</div>\n20  \
  \   <div id=\"button\">Button</div>\n21   </body>\n22 </html>\n```\n\n## 清单 4.5\
  \ 定义几种边框样式的 CSS 规则\n\n点击此处查看代码图片\n\n```css\n01 div { width:200px; margin:5px; padding:2px;\
  \ text-align:center}\n02 #simple { border:1px solid black; }\n03 #dashed { border:1px\
  \ dashed black; }\n04 #dotted { border:1px dotted gray; }\n05 #groove { border:5px\
  \ groove blue; }\n06 #inset { border:5px inset red; }\n07 #outset { border:5px outset\
  \ blue; }\n08 #ridge { border:5px ridge black; }\n09 #round { border: 1px solid;\
  \ border-radius:5px;}\n10 #veryround { border: 1px solid; border-radius:50%;}\n\
  11 #shadow {\n12   margin:10px;\n13   border:1px solid black;\n14   box-shadow:\
  \ 5px 5px 3px 2px blue;\n15 }\n16 #ishadow {\n17   margin:15px;\n18   border:1px\
  \ solid black;\n19   box-shadow: 5px 5px 3px 2px blue inset;\n20 }\n21 #mixed {\n\
  22   border-top: 1px solid;\n23   border-top-left-radius:5px;\n24   border-left:\
  \ 1px dotted;\n25   border-bottom: 5px ridge;\n26   border-bottom-right-radius:\
  \ 10px;\n27 }\n28 #button {\n29   width:150px;\n30   background-color: #2233FF;\n\
  31   color: white;\n32   border:5px outset blue;\n33   border-radius:50%;\n34 }\n\
  ```\n\n---\n\n##### 光标\n\n\n\n\n浏览器与用户交互的一个重要部分是鼠标光标。你可以通过改变鼠标悬停时光标的样式，让用户了解某个 HTML\
  \ 元素的用途或行为。\n\n`cursor` CSS 属性允许你定义当鼠标悬停在特定元素上时应使用哪种光标。下面是一个将 `cursor` 设置为指针的示例：\n\
  \n```\ndiv { cursor:pointer; }\n```\n\n你可以从多个 `cursor` 值中进行选择。图 4.13 展示了通过 `cursor`\
  \ CSS 属性可用的部分 `cursor` 值示例。\n\n![Image](img/image00840.jpeg)\n\n**图 4.13** 通过 cursor\
  \ CSS 属性可用的部分光标类型示例。\n\n### 不透明度\n\n`opacity` CSS 属性允许你设置 HTML 元素及其内部所有元素的透明度。`opacity`\
  \ 以 0 到 1 之间的小数值指定，其中 0 表示透明，1 表示不透明。\n\n改变 `opacity` 是让用户知道某个 HTML 元素处于非活动状态的好方法。例如，以下\
  \ CSS 和 HTML 定义了两个按钮样式。`button2` 的定义中包含 0.4 的不透明度，使其部分透明。结果如图 4.14 所示。\n\n![Image](img/image00841.jpeg)\n\
  \n**图 4.14** 两个样式化为按钮的 `<span>` 元素，其中一个的 `opacity` 设置为 0.4。\n\nCSS 规则：\n\n```\n\
  #button, #button2 {\n  margin: 5px; padding:3px;\n  text-align: center;\n  background-color:\
  \ #2233FF;\n  color: white;\n  border:5px outset blue;\n  border-radius:50%;\n}\n\
  #button2 { opacity:.4; }\n```\n\nHTML 元素：\n\n```\n<span id=\"button\">Active</span>\n\
  <span id=\"button2\">Inactive</span>\n```\n\n### 可见性\n\n另一个有用的 CSS 属性是 `visibility`。你可以将\
  \ `visibility` 设置为 `hidden`，这样 HTML 元素及其包含的所有元素都不会在浏览器中渲染。然后将其设置为 `visible` 即可在浏览器窗口中显示。这一功能在\
  \ jQuery 和 JavaScript 中非常有用，可以让你动态地显示和隐藏页面元素。\n\n## 应用 CSS 布局属性\n\n创建 HTML 网页时最大的挑战之一是\
  \ HTML 本身并不容易创建美观的布局。因此，许多 CSS 属性都旨在改变元素的大小、位置以及与其他 HTML 元素的关系。\n\n使用 CSS 布局属性，你将能够在网页上正确定位元素，并且借助\
  \ JavaScript、jQuery 和 AngularJS，你可以高效地改变这些位置，为用户提供更像应用程序的体验，而不仅仅是简单的点击式网页。以下各节将介绍改变\
  \ HTML 组件布局的 CSS 属性。\n\n### 理解盒模型\n\nHTML 元素使用盒模型渲染到浏览器窗口中。在盒模型中，HTML 元素的内容由以下四个部分组成，如图\
  \ 4.15 所示：\n\n![Image](img/image00767.jpeg) **内容**——HTML 组件本身的内容\n\n![Image](img/image00767.jpeg)\
  \ **内边距**——组件与边框之间的空间\n\n![Image](img/image00767.jpeg) **边框**——围绕 HTML 元素的边框\n\n\
  ![Image](img/image00767.jpeg) **外边距**——HTML 元素与周围其他元素之间的空间\n\n![Image](img/image00842.jpeg)\n\
  \n**图 4.15** CSS 盒模型包含四个部分：内容、内边距、边框和外边距。\n\n每个部分在网页浏览器中占据的空间大小都可以通过 CSS 设置。\n\n\
  #### 设置内容大小\n\n内容的大小通过指定 `height` 和 `width` CSS 属性的值来设置。大小值可以指定为 `px`、`cm`、`auto`、`%`\
  \ 等。你还可以使用 `max-height`、`max-width`、`min-height` 和 `min-width` 属性来指定最大和最小高度与宽度。\n\
  \n下面是一个设置 `<p>` 元素高度和宽度属性的示例：\n\n```\np {height:100px; width: 50px;}\n```\n\n####\
  \ 在 HTML 内容周围添加内边距\n\n内边距是元素布局的重要组成部分，尤其是在使用边框时。内边距可以防止 HTML 元素内部的内容接触到边框。\n\n可以通过指定\
  \ `padding` 值来为 HTML 元素的所有边添加内边距，例如：\n\n```\npadding:3px;\n```\n\n你也可以分别为元素的每一边指定内边距，例如：\n\
  \n```\npadding:1px 2px 1px 2px;\n```\n\n#### 在 HTML 元素周围添加外边距\n\n外边距的作用与内边距类似，但它位于元素的边框之外，用于防止其他\
  \ HTML 元素接触到边框。可以通过指定 `margin` 值来为 HTML 元素的所有边添加外边距，例如：\n\n```\nmargin:3px;\n```\n\
  \n你也可以分别为元素的每一边指定 `margin`，例如：\n\n```\nmargin:1px 2px 1px 2px;\n```\n\n`margin`\
  \ 属性还支持 `auto` 值。使用 `auto` 会根据 HTML 元素的大小约束，将 `margin` 值平均分配。\n\n### 修改 HTML 元素流\n\
  \n除非另有指定，否则 HTML 元素会流向浏览器窗口的左上角。\n\n正如你在上一课中学到的，有些 HTML 元素是块级元素，有些是行内元素。块级元素占据整个宽度，因此它们之后的元素会流到下一行。行内元素只占据内容所需的空间。\n\
  \n使用 `display` CSS 属性，你可以将元素设置为 `block` 或 `inline`。`display` 属性的另一个值得提及的值是 `inline-block`。`inline-block`\
  \ 允许元素以行内方式显示；但与行内元素不同的是，你仍然可以设置块级属性，例如 `height`、`width` 以及 `margin`。例如：\n\n```\n\
  span {\n  height: 200px; width:200px;\n  display:inline-block;\n}\n```\n\n另一种修改\
  \ HTML 元素流的方法是使用 `float` 属性。`float` 属性允许元素浮动到包含元素的 `left` 或 `right`。其他未浮动的元素将显示在浮动元素旁边，位于远离包含元素边缘的一侧。\n\
  \n使用 `float` 属性时，你需要使用 `clear` 属性来定义浮动元素的哪些边不允许其他元素环绕。为了说明这一点，请考虑以下 CSS 和 HTML 代码。注意在图\
  \ 4.16 中，不包含 `clear:both` 属性的段落元素会渲染在浮动到左侧的图像旁边。\n\n![Image](img/image00843.jpeg)\n\
  \n**图 4.16** 将元素向左或向右浮动会改变流。但是，你需要使用 `clear` 属性来清除不希望在其旁边流动的元素。\n\nCSS 规则：\n\n```\n\
  #image1 {float:left;}\n#image2 {float:right;}\n#cleared {clear:both;}\n```\n\nHTML\
  \ 元素：\n\n```\n<img id=\"image1\" src=\"images/lesson0302.jpg\" width=\"100\" />\n\
  <img id=\"image2\" src=\"images/lesson0303.jpg\" width=\"100\" />\n<p id=\"uncleared\"\
  >Uncleared Line of Text</p>\n<p id=\"cleared\">Cleared Line of Text</p>\n```\n\n\
  ### 通过 CSS 定位 HTML 元素\n\n`position` 属性允许你定义浏览器如何定位元素。默认情况下，元素是静态的，并随文档中的其他元素一起流动。但是，通过更改\
  \ `position` 属性的值，你可以改变这种行为。\n\n以下列表描述了每个非静态位置值：\n\n![Image](img/image00767.jpeg)\
  \ `fixed`——相对于浏览器窗口定位元素。\n\n![Image](img/image00767.jpeg) `absolute`——相对于第一个非静态容器元素定位元素。元素的至少一个容器必须已经定义为非静态位置。\n\
  \n\n\n\n![Image](img/image00767.jpeg) `relative`——将元素相对于其原本的正常位置进行定位。\n\n将 `position`\
  \ 属性改为非静态值后，可以使用 `top`、`left`、`bottom` 和 `right` 属性来设置定位。例如，要将元素的左上角设置为距离浏览器窗口顶部\
  \ 50 像素、距离左上边缘 100 像素，可以使用以下 CSS 代码：\n\n```\nposition:fixed;\ntop:50px;\nleft:100px;\n\
  ```\n\n### Z 轴索引（Z-Index）\n\n当使用非静态定位对 HTML 元素进行定位时，可能会遇到一个元素覆盖另一个元素的情况。`z-index`\
  \ 属性允许你指定哪个元素应位于前面。`z-index` 值较高的元素会位于值较低的元素前面。以下 CSS 规则会使 `<div>` 元素位于 `<p>` 段落元素前面：\n\
  \n```\ndiv { z-index:2; }\np { z-index:1; }\n```\n\n### 溢出（Overflow）\n\n`overflow`\
  \ CSS 属性用于解决试图在网页中显示过大内容的问题。`overflow` 属性可以设置为以下值：\n\n- `visible`——默认行为。\n- `hidden`——如果内容太大，则隐藏元素。\n\
  - `scroll`——在底部和右侧添加滚动条。如果内容超出尺寸限制，滚动条变为可用，从而可以在不影响页面其他部分布局的情况下查看容器的全部内容。\n- `auto`——必要时添加滚动条，使元素保持在你设定的尺寸限制内。\n\
  \n图 4.17 展示了一个列表被限制在 `<ul>` 元素内的示例，该元素应用了以下包含 `overflow` 属性的 CSS 规则：\n\n```\nul{\n\
  \  border:1px solid;\n  height:150px; width:300px;\n  overflow:auto;\n}\nli{ width:800px;\
  \ }\n```\n\n![Image](img/image00844.jpeg)\n\n**图 4.17** 为 `<ul>` 元素添加 `overflow`\
  \ 属性后，列表被限制在滚动条内。\n\n---\n\n### 动手实践：使用 CSS 布局网页组件\n\n在本示例中，你将实践几个布局属性。你将创建两个 `<div>`\
  \ 元素，并按照以下步骤将它们放置在网页的固定位置。完整的 HTML 和 CSS 代码见代码清单 4.6 和代码清单 4.7：\n\n1. 在 Eclipse\
  \ 的 `lesson04` 文件夹中创建一个名为 `web_layout.html` 的新 HTML 文档。\n\n2. 添加代码清单 4.6 所示的代码。该代码链接到一个名为\
  \ `css/web_layout.css` 的外部样式表，然后定义了两个 `<div>` 元素：一个包含一组图片，另一个包含用于显示歌曲信息的 `<p>` 元素。\n\
  \n3. 将代码清单 4.6 中列出的图片文件从本书网站的 `/images` 目录复制到 Eclipse 项目的 `/images` 文件夹中。\n\n4.\
  \ 在 Eclipse 的 `lesson04/css` 文件夹中创建一个名为 `web_layout.css` 的新 CSS 文档。\n\n5. 将以下行添加到新的\
  \ CSS 文件中，为 `<img>` 元素设置基本间距和大小。`margin` 属性使它们之间以及与 div 元素之间留有空间。`float` 属性允许它们浮动到容器的左侧：\n\
  \n   ```\n   01 img{\n   02   width:48px;\n   03   margin:-5px;\n   04   float:left;\n\
  \   05 }\n   ```\n\n6. 添加以下代码行来定义两个 `<div>` 元素的外观。`position` 设置为 `fixed`，但尚未指定定位。我们还添加了\
  \ `padding`，使 `<div>` 内部的内容与边框保持距离：\n\n   ```\n   06 #buttons, #songInfo{\n   07\
  \   position:fixed;\n   08   padding:5px;\n   09   display:inline-block;\n   10\
  \   border:8px ridge blue;\n   11   border:radius 5px;\n   12 }\n   ```\n\n7. 添加以下\
  \ CSS 规则，分别定位 `#songInfo` 和 `#buttons <div>` 元素。注意它们保留了上一步的所有值。注意通过指定浏览器窗口中的 `top`\
  \ 和 `left` 位置来设置元素的位置。还要注意为按钮设置更高的 `z-index` 值，以确保它始终位于 `songInfo` 之上：\n\n   点击此处查看代码图片\n\
  \n   ```\n   13 #songInfo{\n   14   background-color: black;\n   15   top:70px;\n\
  \   16   left:100px;\n   17   height:150px;width:300px;\n   18   z-index:1;\n  \
  \ 19 }\n   20 #buttons{\n   21   background-color: white;\n   22   top:200px;\n\
  \   23   left:120px;\n   24   z-index:2;\n   25 }\n   ```\n\n8. 为标题和年份元素添加以下规则。注意将\
  \ `position` 设置为 `relative`，以便相对于它们在 `<div>` 容器中的正常流动位置进行定位。然后设置 `top` 和 `left`\
  \ 值时，它们是相对于 `<p>` 元素的正常位置的。通过指定负数，可以将元素向上移动：\n\n   ```\n   33 #title{\n   34   color:lime;\n\
  \   35   font-size:15px;\n   36   position:relative;\n   37   left:30px;\n   38\
  \   top:25px;\n   39 }\n   40 #year{\n   41   color:yellow;\n   42   font-size:15px;\n\
  \   43   position:relative;\n   44   left:30px;\n   45   top:-40px;\n   46 }\n \
  \  ```\n\n9. 保存文件并在网页浏览器中打开 HTML 文件。你应该会看到类似于图 4.18 所示的结果。注意 CSS 布局样式已将元素定位在浏览器中的特定位置。\n\
  \n![Image](img/image00845.jpeg)\n\n**图 4.18** 添加 CSS 布局属性后，可以将元素定位在浏览器中的特定位置。\n\n\
  **代码清单 4.6** `web_layout.html` HTML 代码，创建了一对由代码清单 4.7 样式化的 `<div>` 元素，分别用于显示歌曲信息和一组播放控件\n\
  \n点击此处查看代码图片\n\n---\n\n```\n01 <html>\n02   <head>\n03     <title>Layout</title>\n\
  04     <meta charset=\"UTF-8\">\n05     <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"css/web_layout.css\">\n06   </head>\n07   <body>\n08     <div id=\"buttons\"\
  >\n09       <img src=\"../images/skipBack.png\" />\n10       <img src=\"../images/seekBackward.png\"\
  \ />\n11       <img src=\"../images/play.png\" />\n12       <img src=\"../images/stop.png\"\
  \ />\n13       <img src=\"../images/seekForward.png\" />\n14       <img src=\"../images/skipForward.png\"\
  \ />\n15     </div>\n16     <div id=\"songinfo\">\n17     <p id=\"title\">9TH Symphony</p>\n\
  18     <p id=\"artist\">Beethoven</p>\n19     <p id=\"Year\">1824</p>\n20   </div>\n\
  21     <h1>Song Controls</h1>\n22   </body>\n23 </html>\n```\n\n---\n\n**代码清单 4.7**\
  \ `web_layout.css` CSS 代码，用于应用页面布局，将元素放置在固定位置\n\n点击此处查看代码图片\n\n---\n\n```\n01 img{\n\
  02   width:48px;\n03   margin:-5px;\n04   float:left;\n05 }\n06 #buttons, #songInfo{\n\
