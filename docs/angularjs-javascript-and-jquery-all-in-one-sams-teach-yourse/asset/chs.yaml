  \ onload=\"writeIt()\">\n29   </body>\n30 </html>\n```\n\n---\n\n#### 理解变量作用域\n\n\
  当你开始在 JavaScript 应用程序中添加条件、函数和循环时，你需要理解变量作用域。变量作用域简单来说就是：“在当前执行的代码行中，特定变量名的值是什么。”\n\
  \nJavaScript 允许你定义变量的全局版本和局部版本。全局版本在主 JavaScript 中定义，局部版本在函数内部定义。当你在函数中定义局部版本时，会在内存中创建一个新变量。在该函数内部，你将引用局部版本。在该函数外部，你将引用全局版本。\n\
  \n为了更好地理解变量作用域，请考虑以下代码：\n\n点击此处查看代码图片\n\n```\n01 <script>\n02   var myVar = 1;\n\
  03   function writeIt(){\n04     var myVar = 2;\n05     document.write(myVar);\n\
  06     writeMore();\n07   }\n08   function writeMore(){\n09     document.write(myVar);\n\
  10   }\n11 </script>\n```\n\n全局变量 `myVar` 在第 2 行定义。然后在第 4 行，在 `writeIt()` 函数内部定义了一个局部版本。因此，第\
  \ 5 行将写入文档。然后在第 6 行，调用了 `writeMore()`。由于 `writeMore()` 中没有定义 `myVar` 的局部版本，因此第 9\
  \ 行写入的是全局 `myVar` 的值。\n\n#### 添加错误处理\n\nJavaScript 编码的一个重要部分是为可能出现问题的情况添加错误处理。默认情况下，如果由于\
  \ JavaScript 中的问题导致代码异常，脚本会失败并且无法完成加载。这通常不是期望的行为。\n\n##### Try/Catch 块\n\n为了防止代码完全崩溃，请使用\
  \ `try`/`catch` 块来处理代码中的问题。如果 JavaScript 在执行 `try`/`catch` 块中的代码时遇到错误，它会跳转并执行 `catch`\
  \ 部分，而不是停止整个脚本。如果没有发生错误，则会执行所有 `try` 部分，而不会执行任何 `catch` 部分。\n\n例如，以下 `try`/`catch`\
  \ 块将执行任何替换 `your_code_here` 的代码。如果执行该代码时发生错误，则会将错误消息后跟字符串“: happened when loading\
  \ the script”写入文档：\n\n\n\n\n```\ntry {\n\n    your_code_here\n\n} catch (err) {\n\
  \n  document.write(err.message + \": happened when loading the script\");\n\n}\n\
  ```\n\n##### 抛出你自己的错误\n\n你也可以使用 `throw` 语句抛出你自己的错误。下面的代码演示了如何向函数中添加抛出操作以 `throw`\
  \ 一个错误，即使没有发生脚本错误：\n\n```javascript\n01 <script>\n02   function sqrRoot(x) {\n03\
  \     try {\n04       if(x==\"\")    throw \"Can't Square Root Nothing\";\n05  \
  \     if(isNaN(x)) throw \"Can't Square Root Strings\";\n06       if(x<0)      throw\
  \ \"Sorry No Imagination\";\n07       return \"sqrt(\"+x+\") = \" + Math.sqrt(x);\n\
  08     } catch(err){\n09       return err;\n10     }\n11   }\n12   function writeIt(){\n\
  13     document.write(sqrRoot(\"four\") + \"<br>\");\n14     document.write(sqrRoot(\"\
  \") + \"<br>\");\n15     document.write(sqrRoot(\"4\") + \"<br>\");\n16     document.write(sqrRoot(\"\
  -4\") + \"<br>\");\n17   }\n18 </script>\n```\n\n函数 `sqrRoot()` 接受一个参数 `x`。然后它测试\
  \ `x` 以验证它是否为正数，并返回一个包含 `x` 平方根的字符串。如果 `x` 不是正数，则会抛出相应的错误并返回给 `writeIt()`。\n\n#####\
  \ 使用 finally\n\n异常处理中另一个有价值的工具是 `finally` 关键字。`finally` 关键字可以添加到 `try`/`catch` 块的末尾。在\
  \ `try`/`catch` 块执行之后，`finally` 块总是会被执行。无论是否发生错误并被捕获，或者 `try` 块是否完全执行，它都会执行。\n\n\
  下面是一个在网页中使用 `finally` 块的示例：\n\n```javascript\nfunction testTryCatch(value){\n  try\
  \ {\n    if (value < 0){\n      throw \"too small\";\n    } else if (value > 10){\n\
  \      throw \"too big\";\n    }\n    your_code_here\n  } catch (err) {\n    document.write(\"\
  The number was \" + err.message\");\n  } finally {\n    document.write(\"This is\
  \ always written.\");\n  }\n}\n```\n\n### 总结\n\n在本课中，你学习了向网页添加 jQuery 和 JavaScript\
  \ 的基础知识。描述了 JavaScript 以及随之而来的 jQuery 中使用的基本数据类型。你学习了将条件逻辑应用于 JavaScript 应用程序的一些基本语法。你还学习了如何将\
  \ JavaScript 应用程序划分为可在其他位置重用的函数。最后，你学习了一些在浏览器收到异常之前处理脚本中 JavaScript 错误的方法。\n\n###\
  \ 问答\n\n**问.** 何时应该在字符串操作中使用正则表达式？\n\n**答.** 这取决于你对正则表达式的理解。那些经常使用正则表达式并熟悉其语法的人几乎总是更愿意使用正则表达式，因为它们非常灵活。如果你不熟悉正则表达式，则需要花时间弄清楚语法，因此你只会在需要时使用它们。底线是，如果你需要频繁操作字符串，那么学习正则表达式绝对是值得的。\n\
  \n**问.** 我可以同时加载多个版本的 jQuery 吗？\n\n**答.** 当然可以，但实际上没有充分的理由这样做。最后加载的版本会覆盖之前版本的功能。第一个版本中未被覆盖的任何函数可能会因为库的不匹配而完全不可预测。最好的做法是针对特定版本进行开发和测试，并且只在你想向网页添加新功能时才更新到较新版本。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。尝试在查看答案之前回答问题。\n\n#### 测验\n\n**1.** 在\
  \ JavaScript 中，`==` 和 `===` 有什么区别？\n**2.** `break` 和 `continue` 关键字有什么区别？\n**3.**\
  \ 何时应该使用 `finally` 块？\n**4.** 当字符串 \"1\" 与数字 1 相加时（\"1\"+1），结果值是什么？\n\n#### 测验答案\n\
  \n**1.** `==` 只比较相对值；`===` 比较值和类型。\n**2.** `break` 会完全停止执行循环，而 `continue` 只会停止执行当前迭代，然后继续下一次。\n\
  **3.** 当你有代码需要在 `try` 块中出现问题时仍然执行时。\n**4.** 字符串 \"11\"，因为数字被转换为字符串然后拼接。\n\n####\
  \ 练习\n\n**1.** 打开 `js_functions.html` 并修改它以创建一个表格而不是列表。你需要在 `writeIt()` 函数中添加代码，在遍历行星之前写入\
