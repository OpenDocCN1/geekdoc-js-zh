  \ 按钮时才会更新。\n\n    ![图片](img/image00998.jpeg)\n\n    **图 22.2** 一个基本的 AngularJS 模板，它实现了一个控制器，并将多个字段链接到作用域，以提供值的输入和结果的显示。\n\
