  \n**4.** 将文件命名为 `js_errors.html`。\n\n**5.** 输入代码清单 2.1 的内容，或者如果你有网站上的文件，将内容剪切并粘贴到新文件中。\n\
  \n**6.** 保存文件。\n\n---\n\n**代码清单 2.1 js_errors.html 一个包含 JavaScript 错误的非常简单的 HTML\
  \ 文档**\n\n点击此处查看代码图片\n\n---\n\n```\n01 <!DOCTYPE html>\n02 <html>\n03   <head>\n\
  04     <meta charset=\"utf-8\"/>\n05     <script>\n06       fnction loadedFunction(){\n\
  07         console.log(\"Page is Loaded\");\n08       }\n09       function clickItNow(){\n\
  10         console.log(\"User Clicked\");\n11       }\n12     </script>\n13   </head>\n\
