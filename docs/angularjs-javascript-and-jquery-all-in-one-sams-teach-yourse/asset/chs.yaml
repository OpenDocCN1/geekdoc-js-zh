  12 }]);\n```\n\n* * *\n\n#### 使用$window 服务实现浏览器警告\n\n`$window`服务为浏览器的`window`对象提供了一个\
  \ jQuery 包装器，允许你像通常从 JavaScript 中那样访问`window`对象。为了说明这一点，以下代码使用`window`对象的`alert()`方法弹出一个浏览器警告。警告消息从浏览器`window`对象的`$window.screen.availWidth`和`$window.screen.availHeight`属性获取数据：\n\
  \n点击此处查看代码图片\n\n```\nvar app = angular.module('myApp', []);\napp.controller('myController',\
  \ ['$scope', '$window',\n                                function($scope, window)\
  \ {\n    window.alert(\"Your Screen is: \\n\" +\n        window.screen.availWidth\
  \ + \"X\" + window.screen.availHeight);\n  }]);\n```\n\n#### 使用$cookieStore 服务与浏览器\
  \ Cookie 交互\n\nAngularJS 提供了几个用于获取和设置 Cookie 的服务：`$cookie`和`$cookieStore`。Cookie\
  \ 在浏览器中提供临时存储，即使用户离开网页或关闭浏览器，它们也会持久存在。\n\n`$cookie`服务允许你使用点符号获取和更改字符串类型的 Cookie\
  \ 值。例如，以下代码检索名为`appCookie`的 Cookie 的值，然后更改它：\n\n点击此处查看代码图片\n\n```\nvar cookie =\
  \ $cookies.appCookie;\n$cookies.appCookie = 'New Value';\n```\n\n\n\n\n`$cookieStore`\
  \ 服务提供了 `get()`、`put()` 和 `remove()` 函数，用于获取、设置和删除 cookie。`$cookieStore` 服务的一个优秀特性是，它在设置\
  \ cookie 之前会将 JavaScript 对象值序列化为 JSON 字符串，然后在获取时将其反序列化回对象。\n\n要使用 `$cookie` 和 `$cookieStore`\
  \ 服务，你需要完成三件事。首先，在模板中加载 `angular-cookies.js` 库，位置在 `angular.js` 之后、`application.js`\
  \ 之前。例如：\n\n```\n<script src=\"http://code.angularjs.org/1.3.0/angular.min.js\"\
  ></script>\n<script src=\"http://code.angularjs.org/1.3.0/angular-cookies.min.js\"\
  ></script>\n```\n\n***\n\n**顺便提一下**\n\n你也可以从 AngularJS 网站 [`code.angularjs.org/`](http://code.angularjs.org/)*`<version>`*/\
  \ 下载 `angular-cookies.js` 文件，其中 `<version>` 是你正在使用的 AngularJS 版本。根据你使用的 AngularJS\
  \ 版本，你可能还需要下载 `angular-cookies.min.js.map` 文件。\n\n***\n\n其次，在你的应用程序 `Module` 定义中，将\
  \ `ngCookies` 添加到所需列表中。例如：\n\n```\nvar app = angular.module('myApp', ['ngCookies']);\n\
  ```\n\n第三，将 `$cookies` 或 `$cookieStore` 服务注入到你的控制器中。例如：\n\n```\napp.controller('myController',\
  \ ['$scope', '$cookieStore',\n                                function($scope, cookieStore)\
  \ {\n}]);\n```\n\n***\n\n### 动手实践：使用 `$cookieStore` 服务\n\n在本例中，你将使用 `$cookie` 服务从\
  \ AngularJS 应用程序中设置和清除浏览器中的 cookie。清单 27.5 在应用程序中加载了 `ngCookies`，将 `$cookieStore`\
