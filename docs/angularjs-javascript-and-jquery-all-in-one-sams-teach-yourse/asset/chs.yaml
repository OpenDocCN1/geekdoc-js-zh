  \ attrs, expandCtrl) {\n      element.css(\"display\", \"inline-block\");\n    \
  \  element.css(\"width\", scope.listWidth);\n    },\n    templateUrl: 'expand_list.html',\n\
  \  };\n})\n.directive('expandItem', function() {\n  return {\n    require: '^expandList',\n\
  ```\n\n\n\n\n\n```\n42     restrict: 'E',\n43     transclude: true,\n44     scope:\
