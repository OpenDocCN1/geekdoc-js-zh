  \n使用 jQuery 和 JavaScript 实现树形视图非常简单。在网页中使用树形视图的一个很酷的地方在于，它们可以包含你想要显示的任何内容。接下来的部分将带你了解如何使用\
  \ jQuery 和 JavaScript 实现树形视图的过程。\n\n* * *\n\n动手试一试：添加一个带有展开和折叠分支的动态树形视图\n\n本练习的目的是让你有机会实现一个包含不同类型项目的树形视图。树中的每个节点由一系列元素组成，定义如下：\n\
  \n点击此处查看代码图片\n\n```\n<div class=\"tree\">\n  <span></span><label></label>\n  <div\
  \ class=\"content\"></div>\n  <div class=\"tree\">一个或多个子元素</div>\n</div>\n```\n\n\
  `<span>` 元素用于显示折叠或展开的图标。`<label>` 元素显示展开/折叠按钮旁边的文本。`<div class=\"content\">` 元素可以包含你想要添加的任何内容。你还可以添加额外的\
  \ `<div class=\"tree\">` 元素作为子节点。\n\n示例代码位于清单 14.7、14.8 和 14.9 中。按照以下步骤创建动态网页：\n\
  \n**1.** 在 Eclipse 中，添加 `lesson14/dynamic_tree.html`、`lesson14/js/dynamic_tree.js`\
  \ 和 `lesson14/css/dynamic_tree.css` 文件。\n\n**2.** 将清单 14.7 和清单 14.9 中的代码添加到 HTML\
  \ 和 CSS 文件中。这些文件中的代码相当基础，你应该很熟悉。\n\n**3.** 打开 `dynamic_tree.js` 文件，添加以下调用 `addLevels()`\
  \ 的 `.ready()` 函数。添加清单 14.8 中所示的 `addLevels()`、`getRandomItem()` 和 `randInt()` 函数。这段代码用于用随机项目填充树，包括图片和表单元素。这是为了向你展示每个节点的内容可以完全异构：\n\
  \n点击此处查看代码图片\n\n```\n43 $(document).ready(function(){\n44   var root = addLevels($(\"\
  #treeContainer\"), 4);\n45   root.show();\n46 });\n```\n\n**4.** 添加以下 `addItem()`\
  \ 函数，用于向树形视图添加新节点。该函数接受 jQuery 对象 `parentItem` 和 `item`。`item` 参数是一个包含标签和内容值的 JavaScript\
  \ 对象。这些用于构建完整的节点并将其附加到父节点：\n\n点击此处查看代码图片\n\n```\n06 function addItem(parentItem,\
