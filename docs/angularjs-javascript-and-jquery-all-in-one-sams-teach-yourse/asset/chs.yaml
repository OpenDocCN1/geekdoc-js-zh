  \n许多更改可以通过基于元素状态的简单 CSS 设置来实现，例如 `:hover` 或 `:checked`。然而，借助为这些更改添加动画的能力，你可以让表单拥有更丰富的应用程序外观和感觉。\n\
  \n### 自己动手：添加动画元素以改善用户体验\n\n你已经拥有了为 Web 表单添加任何所需图形交互的所有工具。本节的目的是让你了解一些可以做到的事情。示例是一个非常基本的注册表单，但包含一个选择框、样式化的单选按钮和复选框，以及其他一些表单效果。代码的设计目的是让你在同一个示例中看到几种技术，同时代码量最小。在尝试示例时，你可以随意扩展其中任何一项。\n\
  \n该示例的代码位于清单 13.7、13.8 和 13.9 中。使用以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，创建 `lesson13/form_effects.html`、`lesson13/js/form_effects.js`\
  \ 和 `lesson13/css/form_effects.css` 文件。\n\n**2.** 将清单 13.7 和清单 13.9 中显示的代码添加到 HTML\
  \ 和 CSS 文件中。HTML 是一个相当基本的表单。CSS 相当大，并且有一些基于属性值的中级选择器，但你应该能够理解。CSS 通过隐藏单选按钮并仅显示样式化的标签，将单选输入样式化为按钮。复选框也使用了类似的技术，显示图像而不是复选框。\n\
  \n**3.** 打开 `form_effects.js` 文件，创建一个基本的 `.ready()` 函数，以实现以下步骤中的处理程序。\n\n**4.**\
