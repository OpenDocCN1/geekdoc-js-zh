  在此示例中，您仅使用 AngularJS 的作用域、控制器和视图来实现为图像添加星级评分的元素。当您点击一颗星时，评分会在作用域中更改，星星的数量也会随之变化。\n\
  \n本练习的目的是提醒您，许多数据绑定和视图交互可以在基本的 AngularJS 模板中完成，无需自定义指令。\n\n请按照以下步骤构建可展开/折叠的 AngularJS\
  \ 应用程序：\n\n**1.** 在您的代码中创建以下文件夹和文件结构：\n\n![Image](img/image00767.jpeg) `./lesson29`**：**\
