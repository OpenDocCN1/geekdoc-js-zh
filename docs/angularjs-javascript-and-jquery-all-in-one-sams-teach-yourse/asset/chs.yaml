  32 </html>\n```\n\n* * *\n\n* * *\n\n### 总结\n\nAngularJS 指令扩展了 HTML 的行为。你可以将指令作为\
  \ HTML 元素、属性和类应用于 AngularJS 模板。通过使用 JavaScript 代码来定义指令的功能。AngularJS 提供了几个内置指令，用于与表单元素交互、将作用域中的数据绑定到视图，以及与浏览器事件交互。例如，`ngModel`\
  \ 将表单元素的值直接绑定到作用域。当作用域值改变时，元素显示的值也会改变，反之亦然。\n\n### 问答\n\n**问. 是否可以覆盖内置 AngularJS\
  \ 指令的行为？**\n\n**答.** 不能直接覆盖；但是，你可以创建同名的自定义指令，它也会与内置指令一起执行。通常，最好使用不同的名称创建自己的指令。\n\
  \n**问. 为什么 AngularJS 指令使用 `ng` 前缀？**\n\n**答.** 因为它简短且听起来像“angular”。\n\n### 实践\n\n\
  实践部分包含一组问题和答案，旨在巩固你对本课时所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 测验\n\n**1.** AngularJS\
  \ 指令 `ng-required` 的作用是什么？\n\n**2.** AngularJS 指令 `ng-repeat` 的作用是什么？\n\n**3.**\
  \ 你会使用哪个 AngularJS 指令将元素绑定到鼠标点击事件？\n\n**4.** 你会使用哪个 AngularJS 指令将表单元素绑定到获得焦点事件？\n\
  \n#### 测验答案\n\n**1.** 它为表单中的 `<input>` 元素创建一个布尔值。\n\n**2.** 允许你根据作用域中的 JavaScript\
  \ 对象数组动态添加多个 HTML 元素。\n\n**3.** `ng-click`\n\n**4.** `ng-focus`\n\n#### 练习\n\n**1.**\
  \ 修改清单 24.8 中的代码，使得奇数工作日被高亮显示，而不是偶数工作日。\n\n**2.** 修改清单 24.9 和 24.10 中的代码，使得当输入框未获得焦点时，`InputData`\
  \ 对象中的输入值为小写，而当获得焦点时为大写。\n\n## 第 25 课 创建自定义指令以扩展 HTML\n\n本课你将学到：\n\n![图片](img/image00767.jpeg)\
  \ 如何构建自定义指令\n\n![图片](img/image00767.jpeg) 配置自定义指令中作用域的方法\n\n![图片](img/image00767.jpeg)\
  \ 如何在自定义指令中修改 DOM\n\n![图片](img/image00767.jpeg) 使用模板片段向自定义指令中注入 HTML 元素\n\n![图片](img/image00767.jpeg)\
  \ 如何实现相互交互的嵌套自定义指令\n\n与 AngularJS 的许多其他特性一样，你可以通过创建自己的自定义指令来扩展指令功能。自定义指令使你能够自行实现元素的行为，从而扩展\
  \ HTML 的功能。如果你有需要操作 DOM 的代码，应该通过使用自定义指令来实现。与内置指令一样，自定义指令提供了与表单元素交互、将作用域中的数据绑定到视图以及与浏览器事件交互的能力。\n\
  \n\n\n\n\n本课讨论自定义指令的设计与实现。你还将看到几个扩展 HTML 功能的自定义指令的基本示例。\n\n## 理解自定义指令定义\n\n通过调用\
  \ `Module` 对象上的 `directive()` 方法来实现自定义指令。`directive()` 方法接受指令名称作为第一个参数，以及一个提供者函数，该函数返回一个包含构建指令对象所需指令的对象。例如，以下是一个指令的基本定义：\n\
  \n点击此处查看代码图片\n\n```\nangular.module('myApp', []).\n  directive('myDirective', function()\
  \ {\n    return {\n      template: 'Name: {{name}} Score: {{score}}'\n    };\n \
  \ });\n```\n\n表 25.1 列出了可以应用于指令定义返回对象的属性，如上述代码中返回的 `template`。\n\n![Image](img/image01028.jpeg)![Image](img/image01029.jpeg)![Image](img/image01030.jpeg)\n\
  \n**表 25.1 定义 AngularJS 指令功能的指令定义属性**\n\n以下各节将更详细地讨论指令选项。\n\n#### 定义指令视图模板\n\n你可以包含\
  \ AngularJS 模板代码来构建视图组件，这些组件将显示在包含该指令的 HTML 元素中。你可以直接使用 `template` 属性添加模板代码，如下例所示：\n\
  \n点击此处查看代码图片\n\n```\ndirective('myDirective', function() {\n  return {\n    template:\
  \ 'Name: {{name}} Score: {{score}}'\n  };\n});\n```\n\n你可以在自定义模板中指定一个根元素——但只能有一个元素。该元素作为\
  \ AngularJS 模板中定义的任何子元素的根元素，这些子元素将被放置在其中。此外，如果你使用了 `transclude` 标志，该元素应包含 `ngTransclude`。例如：\n\
  \n点击此处查看代码图片\n\n```\ndirective('myDirective', function() {\n  return {\n    transclude:\
  \ true,\n    template: '<div ng-transclude></div>'\n  };\n});\n```\n\n你还可以使用 `templateUrl`\
  \ 属性指定位于 Web 服务器上的 AngularJS 模板的 URL，如下例所示：\n\n点击此处查看代码图片\n\n```\ndirective('myDirective',\
  \ function() {\n  return {\n    templateUrl: '/myDirective.html'\n  };\n});\n```\n\
  \n模板 URL 可以包含任何标准的 AngularJS 模板代码。因此，你可以根据需要使指令变得简单或复杂。\n\n#### 限制指令行为\n\n你可以将指令作为\
  \ HTML 元素、属性或两者来应用。`restrict` 属性允许你限制自定义指令的应用方式。`restrict` 属性可以设置为以下值：\n\n![Image](img/image00767.jpeg)\
  \ A：作为属性名称应用。例如：\n\n```\n<my-directive></my-directive>\n```\n\n![Image](img/image00767.jpeg)\
  \ E：作为元素名称应用。例如：\n\n点击此处查看代码图片\n\n```\n<div my-directive=\"expression\"></div>\n\
  ```\n\n![Image](img/image00767.jpeg) C：作为类名应用。例如：\n\n点击此处查看代码图片\n\n```\n<div class=\"\
  my-directive: expression;\"></div>\n```\n\n![Image](img/image00767.jpeg) M：作为注释应用。例如：\n\
  \n点击此处查看代码图片\n\n```\n<!-- directive: my-directive expression -->\n```\n\n![Image](img/image00767.jpeg)\
  \ AEC：作为属性、元素或类名应用。你也可以使用其他组合，例如 `AE` 或 `AC`。\n\n例如，你可以将以下指令作为属性或元素应用：\n\n点击此处查看代码图片\n\
  \n```\ndirective('myDirective', function() {\n  return {\n    restrict: 'AE',\n\
  \    templateUrl: '/myDirective.html'\n  };\n});\n```\n\n以下展示了如何将指令同时作为元素和属性实现。注意，驼峰命名被替换为带连字符的形式：\n\
  \n```\n<my-directive></my-directive>\n<div my-directive></div>\n```\n\n#### 为指令添加控制器\n\
  \n你可以使用指令定义的 `controller` 属性为指令添加自定义控制器。这使你能够为指令模板提供控制器支持。例如，以下代码添加了一个简单的控制器，用于设置作用域值和函数：\n\
  \n点击此处查看代码图片\n\n```\ndirective('myDirective', function() {\n  return {\n    scope:\
  \ {title: '='},\n    controller: function ($scope){\n      $scope.title = \"new\"\
  ;\n      $scope.myFunction = function(){\n      });\n    }\n  };\n});\n```\n\n你还可以使用\
  \ `require` 选项来确保指令可用的控制器。`require` 选项使用 `require:'^controller'` 语法，指示注入器服务在父级上下文中查找，直到找到该控制器。以下是在指令中要求\
  \ `myController` 控制器的示例：\n\n点击此处查看代码图片\n\n```\ndirective('myDirective', function()\
  \ {\n  return {\n    require: '^myController'\n  };\n});\n```\n\n当你添加 `require`\
  \ 选项时，指定的控制器将作为 `link()` 函数的第四个参数传递。例如：\n\n点击此处查看代码图片\n\n```\ndirective('myDirective',\
  \ function() {\n  return {\n    require: '^myController',\n    link: function(scope,\
  \ element, attrs, injectedMyController){\n          }\n  };\n});\n```\n\n`link`\
  \ 函数将在指令编译且 DOM 构建完成后执行。然后你可以使用 `link` 函数操作指令内的 DOM 元素。\n\n你还可以使用 `require` 选项要求多个控制器，在这种情况下，一个控制器数组将传递给\
  \ `link()` 函数。例如：\n\n点击此处查看代码图片\n\n```\ndirective('myDirective', function() {\n\
  \  return {\n    require: ['^myControllerA', '^myControllerB'],\n    link: function(scope,\
  \ element, attrs, requiredControllers){\n            var controllerA = requiredControllers[0];\n\
  \            var controller = requiredControllers[1];\n          }\n  };\n});\n\
  ```\n\n如果你在 `require` 选项中指定了另一个指令的名称，则该指令的控制器将被链接。例如：\n\n点击此处查看代码图片\n\n```\ndirective('myDirective',\
  \ function() {\n  return {\n    require: '^myOtherDirective',\n    link: function(scope,\
  \ element, attrs, otherDirectiveController){\n          }\n  };\n});\n```\n\n####\
  \ 配置指令作用域\n\n默认情况下，指令与父级共享作用域。这对于大多数需求来说通常是足够的。最大的缺点是，你可能不希望将所有自定义指令属性都包含在父级作用域中，尤其是当父级作用域是根作用域时。\n\
  \n为了解决这个问题，你可以使用 `scope` 属性为指令定义一个单独的作用域。以下各节描述了如何添加继承作用域和隔离作用域。\n\n##### 添加继承作用域\n\
  \n为指令添加作用域的最简单方法是创建一个从父级作用域继承的作用域。其优点是你拥有一个与父级分离的作用域，可以添加额外的值，但缺点是自定义指令仍然可以修改父级作用域中的值。\n\
  \n要为自定义指令创建继承作用域，请将指令的 `scope` 属性设置为 `true`。例如：\n\n点击此处查看代码图片\n\n```\ndirective('myDirective',\
  \ function() {\n  return {\n    scope: true\n  };\n});\n```\n\n##### 添加隔离作用域\n\n\
  \n\n\n有时，你可能希望将指令内部的作用域与指令外部的作用域隔离开来。这样做可以防止指令修改父控制器作用域中的值。指令定义允许你指定一个 `scope` 属性来创建隔离作用域。隔离作用域将指令作用域与外部作用域隔离开，防止指令访问外部作用域，同时也防止外部作用域中的控制器修改指令作用域。例如，以下代码将指令的作用域与外部作用域隔离：\n\
  \n```\ndirective('myDirective', function() {\n  return {\n    scope: { },\n    templateUrl:\
  \ '/myDirective.html'\n  };\n});\n```\n\n使用这段代码，指令拥有一个完全空的隔离作用域。然而，你可能仍然希望将外部作用域中的某些项映射到指令的内部作用域。你可以使用以下前缀来修饰属性名称，从而使局部作用域变量在指令的作用域中可用：\n\
  \n- `@`：将局部作用域字符串绑定到 DOM 属性的值。该属性的值将在指令作用域内可用。\n- `=`：在局部 `scope` 属性和指令 `scope`\
  \ 属性之间创建双向绑定。\n- `&`：将局部作用域中的函数绑定到指令作用域。\n\n如果前缀后面没有属性名称，则使用指令属性的名称。例如：\n\n`title:\
  \ '@'`\n\n等同于：\n\n`title: '@title'`\n\n以下代码展示了如何实现每种方法，将局部值映射到指令的隔离作用域：\n\n```\n\
  angular.module('myApp', []).\n  controller('myController', function($scope) {\n\
  \    $scope.title=\"myApplication\";\n    $scope.myFunc = function(){\n      console.log(\"\
  out\");\n    };\n  }).\n  directive('myDirective', function() {\n    return {\n\
  \      scope: {title: '=', newFunc:\"&myFunc\", info: '@'},\n      template: '<div\
  \ ng-click=\"newFunc()\">{{title}}: {{info}}</div>'\n    };\n  });\n```\n\n以下代码展示了如何在\
  \ AngularJS 模板中定义指令，以提供必要的属性来映射这些属性：\n\n```\n<div my-directive\n     my-func=\"\
  myFunc()\"\n     title=\"title\"\n     info=\"SomeString\"></div>\n```\n\n#### 嵌入元素\n\
  \n嵌入这个概念一开始可能有点难以理解。基本上，它的思想是你可以保留在 AngularJS 模板中定义的自定义指令的内容，并将它们绑定到作用域。其工作原理是：指令的链接函数会接收一个预先绑定到当前作用域的嵌入函数。然后，指令内部的元素可以访问指令外部的作用域。\n\
  \n你可以将 `transclude` 选项设置为以下值：\n\n- `true`：嵌入指令的内容。\n- `'element'`：嵌入整个元素，包括任何在较低优先级定义的指令。\n\
  \n你还必须在指令模板内的元素中包含 `ngTransclude` 指令。以下是一个实现 `transclude` 的示例，用于从 `myDirective`\
  \ 指令模板中访问控制器作用域中的 `title` 变量：\n\n```\nangular.module('myApp', []).\n  directive('myDirective',\
  \ function() {\n    return {\n      transclude: true,\n      scope: {},\n      template:\
  \ '<div ng-transclude>{{title}}</div>'\n    };\n  }).\n  controller('myController',\
  \ function($scope) {\n    $scope.title=\"myApplication\";\n  });\n```\n\n#### 使用链接函数操作\
  \ DOM\n\n当 AngularJS HTML 编译器遇到一个指令时，它会运行该指令的编译函数，该函数返回 `link()` 函数。`link()` 函数会被添加到\
  \ AngularJS 指令列表中。在所有指令编译完成后，HTML 编译器会根据优先级顺序调用 `link()` 函数。\n\n如果你想在自定义指令中修改 DOM，应该使用\
  \ `link()` 函数。`link()` 函数接受与指令关联的 `scope`、`element`、`attributes`、`controller` 和\
  \ `transclude` 函数，使你能够直接在指令内部操作 DOM。`transclude` 函数是一个句柄，绑定到嵌入作用域。\n\n在 `link()`\
  \ 函数内部，你需要处理指令元素上的 `$destroy` 事件，并清理任何必要的内容。`link()` 函数还负责注册 DOM 监听器以处理浏览器事件。\n\n\
  `link()` 函数使用以下语法：\n\n```\nlink: function(scope, element, attributes, [controller],\
  \ [transclude])\n```\n\n`scope` 参数是指令的作用域，`element` 是插入指令的元素，`attributes` 列出了元素上声明的属性，`controller`\
  \ 是由 `require` 选项指定的控制器。`transclude` 参数是嵌入函数的句柄。\n\n嵌入函数提供了对原始元素内容进行嵌入时创建的元素的访问。要访问具有继承作用域的嵌入元素，你可以调用嵌入函数。这允许你在链接函数中访问和操作嵌入元素。例如：\n\
  \n```\nlink: function link(scope, elem, attr, controller, transcludeFn){\n     \
  \   var transcludedElement = transcludeFn();\n      }\n```\n\n你也可以通过指定 `clone` 参数来访问嵌入元素的克隆。例如：\n\
  \n```\nlink: function link(scope, elem, attr, controller, transcludeFn){\n     \
  \   transcludeFn(function(clone){\n          //在此处访问克隆...\n        });\n      }\n\
  ```\n\n你还可以通过同时应用 `scope` 参数和 `clone` 参数，来访问具有不同作用域的嵌入元素克隆。例如：\n\n```\nlink: function\
  \ link(scope, elem, attr, controller, transcludeFn){\n        transcludeFn(scope,\
  \ function(clone){\n          //在此处访问克隆...\n        });\n      }\n```\n\n以下指令展示了一个基本的\
  \ `link()` 函数的实现，它设置了一个作用域变量，向 DOM 元素追加数据，实现了 `$destroy` 事件处理器，并向作用域添加了一个 `$watch`：\n\
  \n```\ndirective('myDirective', function() {\n  return {\n    scope: {title: '='},\n\
  \    require: '^otherDirective',\n    link: function link(scope, elem, attr, controller,\
  \ transclude){\n      scope.title = \"new\";\n      elem.append(\"Linked\");\n \
  \     elem.on('$destroy', function() {\n        //清理代码\n      });\n      scope.$watch('title',\
  \ function(newVal){\n        //监视代码\n      });\n    }\n  };\n```\n\n`link` 属性也可以设置为一个包含\
  \ `pre` 和 `post` 属性的对象，分别指定预链接函数和后链接函数。在前面的示例中，当 `link` 被设置为一个函数时，该函数作为后链接函数执行，意味着它在子元素已经链接之后执行，而预链接函数则在子元素链接之前执行。因此，你应该只在后链接函数中进行\
  \ DOM 操作。事实上，很少需要包含预链接函数。\n\n以下展示了同时包含预链接和后链接函数的语法示例：\n\n```\ndirective('myDirective',\
  \ function() {\n  return {\n  link: {\n    pre: function preLink(scope, elem, attr,\
  \ controller){\n```\n\n\n\n\n\n```\n//prelink code\n\n},\n\npost: function postLink(scope,\
  \ elem, attr, controller){\n\n//postlink code\n\n},\n\n}\n\n};\n```\n\n### 使用编译函数操作\
  \ DOM\n\n`compile` 函数与 `link` 函数非常相似，它有一个主要优势，但也有几个缺点。使用 `compile` 函数的优势（也是主要原因）在于性能。`compile`\
  \ 方法仅在编译模板时执行一次，而 `link` 函数则在每次元素被链接时执行；例如，在 `ng-repeat` 循环中应用多个指令，或者当模型发生变化时。如果你要进行大量的\
  \ DOM 操作，这一点就非常重要。\n\n以下是 `compile` 函数的局限性：\n\n![Image](img/image00767.jpeg) 任何操作都在克隆发生之前应用。这意味着，当自定义指令在\
  \ `ng-repeat` 内部使用时，所有 DOM 操作都将应用于生成的 *所有* 自定义指令。\n\n![Image](img/image00767.jpeg)\
  \ `compile()` 方法无法处理在其自身模板或 `compile()` 函数中递归使用自身的指令，因为这会导致无限循环。\n\n![Image](img/image00767.jpeg)\
  \ `compile()` 方法无法访问作用域。\n\n![Image](img/image00767.jpeg) `transclude` 函数已被弃用并从\
  \ `compile` 函数中移除，因此你无法链接到被嵌入的元素。\n\n`compile()` 方法的语法与 `link()` 方法非常相似。你可以指定一个单一的\
  \ postlink 函数，如下所示：\n\n点击此处查看代码图片\n\n```\ndirective('myDirective', function() {\n\
  \nreturn {\n\ncompile: function compile(scope, elem, attr, controller){\n\n//postlink\
  \ code\n\n}\n\n};\n```\n\n你也可以使用对象来指定 prelink 和 postlink 函数，如下所示：\n\n点击此处查看代码图片\n\
  \n```\ndirective('myDirective', function() {\n\nreturn {\n\ncompile: {\n\npre: function\
  \ preLink(elem, attr){\n\n//prelink code\n\n},\n\npost: function postLink(elem,\
  \ attr){\n\n//postlink code\n\n},\n\n}\n\n};\n```\n\n## 实现自定义指令\n\n你可以定义的自定义指令类型是无限的，这使得\
  \ AngularJS 具有可扩展性。自定义指令是 AngularJS 中最复杂、最难解释和理解的部分。最好的入门方法是向你展示一些自定义指令的示例，让你了解如何实现它们以及如何让它们相互交互。\n\
  \n* * *\n\n### 自己动手：在自定义指令中操作 DOM\n\n在自定义指令中，最常见的任务之一就是操作 DOM。这应该是 AngularJS 应用中唯一操作\
  \ DOM 的地方。在本练习中，你将构建一个基本的自定义指令，该指令会在包含的元素周围应用一个带有标题和页脚的框。这个示例很基础，让你有机会了解如何使用 AngularJS\
  \ 中的一些机制，例如将值设置为自定义指令的属性。\n\n按照以下步骤构建一个包含操作 DOM 的自定义指令的应用程序：\n\n**1.** 添加 `lesson25/directive_custom_dom.html`\
  \ 和 `lesson25/js/directive_custom_dom.js` 文件。\n\n**2.** 将清单 25.1 和清单 25.2 中所示的代码添加到\
  \ HTML 和 JavaScript 文件中。\n\n**3.** 来自清单 25.1 的以下代码行定义了一个简单的应用程序，其中包含一个控制器（仅包含作用域变量\
  \ `title`）和一个名为 `mybox` 的指令：\n\n点击此处查看代码图片\n\n```\n01 angular.module('myApp', [])\n\
  02 .controller('myController', function($scope) {\n03     $scope.title=\"myApplication\"\
  ;\n04   })\n05 .directive('mybox', function() {\n06   return {\n. . .\n18     };\n\
  19   });\n```\n\n**4.** 指令中的以下代码行启用了嵌入：\n\n```\n07     transclude: true,\n```\n\n\
  **5.** 以下代码行将自定义指令限制为仅元素名称：\n\n```\n08     restrict: 'E',\n```\n\n**6.** 以下代码行定义了一个隔离作用域，接受参数\
  \ `title` 和 `bwidth` 作为字符串：\n\n点击此处查看代码图片\n\n```\n09     scope: {title: '@', bwidth:\
  \ '@bwidth'},\n```\n\n**7.** 以下代码行定义了一个 `template`，它添加了标题栏和一个用于存储自定义指令嵌入内容的 `<div\
  \ ng-transclude>`：\n\n点击此处查看代码图片\n\n```\n10     template: '<div><span class=\"titleBar\"\
  >{{title}}' +\n11               '</span><div ng-transclude></div></div>',\n```\n\
  \n**8.** 以下代码行展示了 `link()` 函数，它使用 `append` 来追加一个页脚元素。这也可以在 `template` 中完成；但是，我想说明它也可以在\
  \ `link()` 函数中完成。还要注意，页脚元素的文本来自父作用域的 `title` 值，通过 `scope.$parent.title` 获取。`link`\
  \ 函数还添加了 `border`，并根据作用域中的 `bwidth` 值设置了 `display` 和 `width` 值：\n\n点击此处查看代码图片\n\n\
  ```\n12     link: function (scope, elem, attr, controller, transclude){\n13    \
  \     elem.append('<span class=\"footer\">' + scope.$parent.title + '</span>');\n\
  14         elem.css('display', 'inline-block');\n15         elem.css('width', scope.bwidth);\n\
  16       },\n```\n\n**9.** 清单 25.2 中的代码实现了一个 AngularJS 模板，该模板设置了一些 CSS 样式，然后添加了在清单\
  \ 25.1 中定义的 `<mybox>` 自定义指令。注意，指令的内容从字符串到图像再到段落各不相同。\n\n**10.** 在浏览器中打开 `directive_custom_dom.html`。结果如图\
  \ 25.1 所示。注意，`bwidth` 属性的大小决定了框的宽度，并且所有元素都被相同类型的框包围。\n\n![Image](img/image01031.jpeg)\n\
  \n**图 25.1** 在 AngularJS 模板视图中实现操作 DOM 元素的自定义指令。\n\n**清单 25.1 directive_custom_dom.js\
  \ 实现操作 DOM 的自定义指令**\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 angular.module('myApp', [])\n\
  02 .controller('myController', function($scope) {\n03     $scope.title=\"myApplication\"\
  ;\n04   })\n05 .directive('mybox', function() {\n06   return {\n07     transclude:\
  \ true,\n08     restrict: 'E',\n09     scope: {title: '@', bwidth: '@bwidth'},\n\
