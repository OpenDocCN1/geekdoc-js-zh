  \ Web 开发者的行列，使用它们构建丰富、动态且交互性强的网站和 Web 应用程序。\n\n# 第一部分：AngularJS、jQuery 和 JavaScript\
  \ 开发入门\n\n## 第 1 课 动态 Web 编程入门\n\n本课你将学到：\n\n![Image](img/image00767.jpeg) 为创建动态网页做好准备\n\
  \n![Image](img/image00767.jpeg) 创建适合 AngularJS、jQuery 和 JavaScript 的开发环境\n\n![Image](img/image00767.jpeg)\
  \ 在网页中添加 JavaScript 和 jQuery\n\n![Image](img/image00767.jpeg) 构建支持 jQuery 和 JavaScript\
  \ 的网页\n\n![Image](img/image00767.jpeg) 使用 jQuery 和 JavaScript 创建你的第一个动态网页\n\nJavaScript\
  \ 及其增强版伙伴 jQuery 和 AngularJS 彻底改变了创建丰富交互式网页和基于 Web 的应用程序的格局。JavaScript 长期以来一直是创建动态网页的关键组件。如今，随着\
  \ jQuery 和 AngularJS 库的进步，Web 开发已经发生了永久性的改变。\n\n\n\n\n\n本课程将快速带你了解 jQuery 和 JavaScript\
  \ 开发的世界。最好的起点是确保你理解将要涉足的动态 Web 开发领域。要高效使用 JavaScript 和 jQuery，你需要对 Web 服务器与浏览器的交互，以及\
  \ HTML 和 CSS 有相当不错的理解。\n\n本课程包含几个小节，简要概述了 Web 服务器与浏览器的交互以及所涉及的技术。课程其余部分则致力于搭建和配置一个对\
  \ AngularJS、jQuery 和 JavaScript 友好的开发环境。最后，你将编写包含 JavaScript 和 jQuery 代码的第一个网页。\n\
  \n### 理解 Web 服务器/浏览器范式\n\nJavaScript、jQuery 和 AngularJS 可以与 Web 服务器和浏览器通信中涉及的每个主要组件进行交互。为了帮助你更好地理解这种交互，本节将提供\
  \ Web 服务器/浏览器通信所涉及概念和技术的高层概述。这并非旨在全面详尽；它只是一个高层概述，让你能够在本书后续讨论时，将事物置于正确的上下文中。\n\n\
  #### 了解 Web 服务器到浏览器通信术语\n\n万维网的基本概念你应该非常熟悉：在 Web 浏览器中输入或点击一个地址，信息就会被加载并以可用的形式显示出来。浏览器发送请求，服务器发送响应，浏览器将其显示给用户。\n\
  \n虽然概念简单，但数据从服务器请求并在浏览器中显示需要经过几个步骤。以下小节定义了所涉及的组件、它们之间的交互，以及 JavaScript、jQuery 和\
  \ AngularJS 如何参与其中。\n\n##### Web 服务器\n\nWeb 服务器是 Web 中最关键的组件。没有它，数据将完全不可用。Web 服务器通过发送浏览器随后使用或显示的数据来响应浏览器的请求。不过，Web\
  \ 服务器上会发生很多事情。例如，Web 服务器及其组件会检查请求的格式和有效性。它们还可能检查安全性，以验证请求是否来自允许的用户。为了构建响应，服务器可能会与多个组件甚至其他远程服务器交互以获取必要的数据。\n\
  \n##### 浏览器\n\n下一个最重要的组件是浏览器。浏览器向 Web 服务器发送请求，然后将结果显示给用户。浏览器在底层也有很多事情发生。浏览器必须解析来自服务器的响应，然后决定如何将其呈现给用户。\n\
  \n虽然市面上有多种浏览器，但最流行的三种是 Chrome、Internet Explorer 和 Firefox。在大多数情况下，每个浏览器在显示网页时的行为相同；然而，偶尔会存在一些差异，你需要在你需要支持的每个主流浏览器中仔细测试你的\
  \ JavaScript、jQuery 和 AngularJS 脚本。\n\nJavaScript、jQuery 和 AngularJS 可以深度参与浏览器接收响应到最终输出呈现给用户之间的交互。这些脚本可以改变从服务器返回的数据的格式、内容、外观和行为。以下小节描述了浏览器提供的重要部分。\n\
  \n###### DOM\n\n浏览器通过创建文档对象模型（DOM）将 HTML 文档渲染为网页。DOM 是一个对象树结构，以 HTML 文档为根对象。根可以有多个子对象，这些子对象又可以有多个子对象。例如，一个包含列表的网页会有一个根对象，其下有一个列表子对象，该子对象又包含多个列表项子对象。以下展示了一个简单\
  \ DOM 树的示例，该网页包含一个标题和一个包含三个城市的列表：\n\n点击此处查看代码图片\n\n```\ndocument\n  + html\n    +\
  \ body\n      + h1\n        + text = \"城市列表\"\n      + ul\n        + li\n          +\
  \ text = \"纽约，美国\"\n        + li\n          + text = \"巴黎，法国\"\n        + li\n          +\
  \ text = \"伦敦，英国\"\n```\n\n浏览器知道如何显示 DOM 中的每个节点，并通过读取每个节点并在浏览器窗口中绘制相应的像素来渲染网页。正如你稍后将学到的，JavaScript、jQuery\
  \ 和 AngularJS 使你能够直接与 DOM 交互，读取每个对象、更改这些对象，甚至删除和添加对象。\n\n###### 浏览器事件\n\n浏览器会跟踪多个对\
  \ AngularJS、jQuery 和 JavaScript 程序至关重要的事件——例如，页面加载时、离开页面时、键盘按下时、鼠标移动和点击时。这些事件可供\
  \ JavaScript 使用，允许你根据发生的事件及其位置执行功能。\n\n###### 浏览器窗口\n\n浏览器还提供对浏览器窗口本身的有限访问。这使你能够使用\
  \ JavaScript 确定浏览器窗口的显示大小以及其他重要信息，你可以利用这些信息来决定脚本将执行什么操作。\n\n##### URL\n\n浏览器能够使用统一资源定位符（URL）访问\
  \ Web 服务器上的文件。URL 是访问 Web 服务器上数据的完全唯一地址，它将 URL 链接到特定的文件或资源。Web 服务器知道如何解析 URL 以确定使用哪些文件/资源来构建对浏览器的响应。在某些情况下，你可能需要使用\
  \ JavaScript 来解析和构建 URL，尤其是在动态链接到其他网页时。\n\n##### HTML/HTML5\n\n超文本标记语言（HTML）提供了网页的基本构建块。HTML\
  \ 定义了一组表示放置在网页上的内容的元素。这些元素标签用于在 DOM 中创建对象。每个元素标签对在 DOM 中表示为一个对象。每个元素都包含在一对标签中，语法如下：\n\
  \n`<tag>内容</tag>`\n\n例如：\n\n点击此处查看代码图片\n\n`<p>这是一个 HTML 段落。</p>`\n\nWeb 浏览器知道如何以适当的方式渲染每个标签的内容。例如，标签\
  \ `<p>` 用于表示一个段落。实际显示在屏幕上的文本是 `<p>` 开始标签和 `</p>` 结束标签之间的文本。\n\n网页的格式、外观和感觉由 HTML\
  \ 文件中包含的标签的类型和位置决定。浏览器读取标签，然后按照定义将内容渲染到屏幕上。\n\nHTML5 是 HTML 语言的下一代版本，它融入了更多媒体元素，如音频和视频。它还提供了丰富的矢量图形标签，允许你使用\
  \ JavaScript 直接在网页上绘制清晰锐利的图像。\n\n清单 1.1 展示了一个用于构建包含行星列表的简单网页的 HTML 示例。浏览器将 HTML\
  \ 渲染为 图 1.1 所示的输出。\n\n![图片](img/image00768.jpeg)\n\n**图 1.1** 使用 清单 1.1 中的代码在浏览器中渲染的行星列表。\n\
  \n**清单 1.1 list.html 一个简单的 HTML 文档，展示了在浏览器中渲染列表所需的 HTML 代码**\n\n点击此处查看代码图片\n\n```html\n\
  01 <!DOCTYPE html>\n02 <html>\n03   <head>\n04     <title>服务器端脚本</title>\n05     <meta\
  \ charset=\"utf-8\"/>\n06   </head>\n07   <body>\n08     <ul>\n09       <li>水星</li>\n\
  10       <li>金星</li>\n11       <li>地球</li>\n12       <li>火星</li>\n13     </ul>\n\
  14   </body>\n15 </html>\n```\n\n\n\n\n\n## CSS/CSS3\n\n网页面临的挑战之一是如何让它们看起来精致且专业。浏览器默认提供的通用外观和感觉虽然可用，但与当今互联网用户所期望的时尚、性感的视觉享受相去甚远。\n\
  \n层叠样式表（CSS）提供了一种轻松定义浏览器如何渲染 HTML 元素的方法。CSS 可用于定义网页布局以及单个元素的外观和感觉。\n\nCSS3，即第三层级联样式表，是下一代\
  \ CSS，它融入了更多特效，例如变换和动画。它还为边框、背景和文本提供了丰富的补充功能。\n\n为了说明 CSS，我们在 清单 1.1 的示例中添加了一些 CSS\
  \ 代码。清单 1.2 使用 CSS 修改了列表项的多个属性，包括文本对齐、字体样式，并将列表项目符号从圆点改为勾选标记图像。请注意 CSS 样式如何改变 图\
  \ 1.2 中列表的渲染效果。\n\n![图片](img/image00769.jpeg)\n\n**图 1.2** CSS 代码极大地改变了列表在浏览器中的外观。\n\
  \n**清单 1.2 style.htm 包含一些 CSS 代码的 HTML，位于 <STYLE> 元素中，用于改变列表外观**\n\n```html\n01\
  \ <!DOCTYPE html>\n02 <html>\n03   <head>\n04     <title>Style</title>\n05     <meta\
  \ charset=\"utf-8\" />\n06     <style>\n07       li {\n08         text-align: center;\n\
  09         font-family: \"Times New Roman\", Times, serif;\n10         font-size:\
  \ 30px;\n11         font-style: italic;\n12         font-weight: bold;\n13     \
  \    list-style-image: url('/images/check.png');\n14         list-style-position:\
  \ inside;\n15       }\n16     </style>\n17   </head>\n18   <body>\n19     <ul>\n\
  20       <li>Mercury</li>\n21       <li>Venus</li>\n22       <li>Earth</li>\n23\
  \       <li>Mars</li>\n24     </ul>\n25   </body>\n26 </html>\n```\n\n## HTTP/HTTPS\
  \ 协议\n\n超文本传输协议（HTTP）定义了浏览器与 Web 服务器之间的通信。它规定了可以发出的请求类型，以及这些请求和 HTTP 响应的格式。\n\n\
  超文本传输安全协议（HTTPS）增加了额外的安全层 SSL/TLS，以确保安全连接。当 Web 浏览器通过 HTTPS 连接到 Web 服务器时，服务器会向浏览器提供一个证书。然后用户可以决定是否接受该证书。如果没有证书，Web\
  \ 服务器将不会响应用户的请求，从而确保请求来自安全来源。\n\n以下各节讨论 HTTP 头部以及两种最常见的 HTTP 请求类型：GET 和 PUT。\n\n\
  ### HTTP 头部\n\nHTTP 头部允许浏览器定义向服务器发出的请求以及返回给浏览器的响应的行为和格式。HTTP 头部作为 HTTP 请求和响应的一部分发送。你可以通过\
  \ JavaScript 向 Web 服务器发送 HTTP 请求，因此你需要对所需的头部有所了解。\n\nWeb 服务器读取请求头部，并利用它们来决定如何为浏览器构建响应。作为响应的一部分，Web\
  \ 服务器会包含响应头部，告诉浏览器如何处理响应中的数据。浏览器首先读取头部，并在处理响应和渲染页面时使用这些头部值。\n\n以下是几个常见的头部：\n\n![图片](img/image00767.jpeg)\
  \ ACCEPT——定义响应中可接受的内容类型。\n\n![图片](img/image00767.jpeg) AUTHORIZATION——指定用于验证请求用户身份的认证凭据。\n\
  \n![图片](img/image00767.jpeg) COOKIE——之前由服务器请求在浏览器中设置的 Cookie 值。Cookie 是存储在客户端上的键/值对。它们可以通过服务器请求或\
  \ JavaScript 代码设置，并作为浏览器发出的 HTTP 请求的一部分发送回服务器。\n\n![图片](img/image00767.jpeg) SET-COOKIE——来自服务器的\
  \ Cookie 值，如果启用了 Cookie，浏览器应存储该值。\n\n![图片](img/image00767.jpeg) CONTENT-TYPE——Web\
  \ 服务器响应中包含的内容类型。例如，该字段对于文本可能是“`text/plain`”，对于 .png 图形可能是“`image/png`”。\n\n![图片](img/image00767.jpeg)\
  \ CONTENT-LENGTH——请求或响应正文中包含的数据量。\n\nHTTP 请求和响应中使用了更多头部，但上述列表应该能让你很好地了解它们的用途。\n\n\
  ### GET 请求\n\n最常见的 HTTP 请求类型是 GET 请求。GET 请求通常用于从 Web 服务器检索信息——例如，加载网页或检索要在网页上显示的图像。要检索的文件在浏览器中输入的\
  \ URL 中指定，例如：\n\n`http://www.dayleycreations.com/tutorials.html`\n\nGET 请求完全由头部组成，没有正文数据。但是，可以通过查询字符串将数据传递给\
  \ GET 请求中的服务器。查询字符串作为 URL 的一部分发送到 Web 服务器。查询字符串的格式是在 URL 后指定一个 `?` 字符，然后包含一系列由一个或多个键/值对组成的内容，这些键/值对使用\
  \ `&` 字符分隔，语法如下：\n\n`URL?key=value&key=value&key=value...`\n\n例如，以下 URL 包含一个查询字符串，指定了一个参数\
  \ `gallery`，其值为 `01`，并发送给服务器：\n\n`http://www.dayleycreations.com/gallery.html?gallery=01`\n\
  \n### POST 请求\n\nPOST 请求与 GET 请求的不同之处在于它没有查询字符串。相反，任何需要发送到 Web 服务器的数据都被编码到请求的正文中。POST\
  \ 请求通常用于改变 Web 服务器上数据状态的请求。例如，一个添加新用户的 Web 表单会将表单中输入的信息作为 POST 请求正文的一部分发送到服务器。\n\
  \n## Web 服务器与客户端脚本\n\n最初，网页是静态的，这意味着浏览器渲染的文件与服务器上存储的文件完全相同。问题是，当你尝试构建一个具有用户交互、丰富元素和大数据的现代网站时，支持不同静态网页所需的网页数量会急剧增加。\n\
  \n与其创建充满静态 HTML 文件的 Web 服务器，不如使用脚本从 Web 服务器获取数据并动态构建在浏览器中渲染的 HTML。\n\n这些脚本可以在服务器上运行，也可以在客户端浏览器中运行。以下各节将讨论这两种方法。大多数现代网站都结合使用了服务器端和客户端脚本。\n\
  \n### 客户端脚本\n\n客户端脚本是将 JavaScript 代码与网页一起发送的过程。这些代码在网页加载期间或加载之后执行。\n\n客户端脚本有几个很大的优势。一是数据处理在客户端完成，这使得扩展拥有大量用户的应用程序更加容易。另一个是浏览器事件通常可以在本地处理，无需向服务器发送请求。这使你能够使界面更快地响应用户交互。\n\
  \nJavaScript、jQuery 以及现在的 AngularJS 是目前最常见的客户端脚本形式。在本书中，你将了解为什么会这样。\n\n\n\n\n图 1.3\
  \ 展示了在简单的客户端脚本中，Web 服务器与浏览器之间的数据流动，该脚本使用 JavaScript 将一个空的`<ul>`元素填充为行星列表。请注意，服务器上的文件与发送到浏览器的文件是相同的，但在浏览器中，JavaScript\
  \ 会为每个行星添加`<li>`元素。你目前无需完全理解 JavaScript 代码，只需知道 HTML 是在客户端而非服务器端动态更改的。\n\n![Image](img/image00770.jpeg)\n\
  \n**图 1.3** JavaScript 在浏览器中执行，因此浏览器渲染的 HTML 文档与最初发送的文档不同。\n\n##### 服务器端脚本\n\n服务器端脚本主要有两种类型：服务器端模板和\
  \ AJAX 请求处理程序。这两种方法都需要在服务器上编写代码，以便在将 HTML 文档发送到浏览器之前动态生成它，或者动态生成可供客户端应用程序使用的数据。\n\
  \n##### 服务器端模板\n\n第一种类型是使用 PHP、.Net、Java 或其他类型的应用程序，这些应用程序在服务器上运行，根据客户端的请求动态生成 HTML\
  \ 页面，或至少生成 HTML 页面的部分内容。\n\n这种服务器端脚本的主要优点是数据处理完全在服务器端完成，原始数据永远不会通过互联网传输；此外，问题和数据修复可以在服务器处理过程中本地完成。\n\
  \n这种服务器端脚本的缺点是需要在服务器端进行更多处理，这可能会降低某些应用程序的可扩展性。\n\n图 1.4 展示了在服务器上使用一个简单的 Node.js\
  \ 应用程序，该应用程序将动态创建一个填充行星列表的 HTML 文档。在图 1.3 的示例中，使用了 PHP 代码，Web 服务器的 PHP 引擎会将`<?php>`标签中的代码替换为\
  \ PHP 脚本生成的输出。\n\n![Image](img/image00771.jpeg)\n\n**图 1.4** PHP 脚本在 Web 服务器上执行，因此发送到浏览器的\
  \ HTML 文档与服务器上实际包含的文档不同。\n\n此时你无需理解代码的工作原理，只需知道 HTML 文档是在服务器端而非客户端动态生成的。\n\n* *\
  \ *\n\n注意\n\n在服务器端使用 HTML 模板的方法有很多。由于超出了本书的范围，我们在此不进行介绍。如果你想了解更多关于服务器端脚本的知识，可以进一步研究\
  \ PHP、Ruby on Rails 和 Node.js。\n\n* * *\n\n###### AJAX 处理程序\n\n第二种主要的服务器端脚本是应用程序，它们以原始\
  \ JSON 或 XML 的形式向浏览器返回原始数据，以响应异步 JavaScript 加 XML（AJAX）请求。AJAX 请求旨在允许在浏览器客户端中运行的\
  \ JavaScript 从服务器获取原始数据。\n\nAJAX 减少了用户交互时重新加载网页或加载其他网页的需求。这减少了初始 Web 服务器响应时需要发送的数据量，同时也使网页更具交互性。\n\
  \n作为 AJAX 的简单示例，我们构建了两个脚本——清单 1.3 和清单 1.4。清单 1.3 是一个包含 JavaScript 的 HTML 文档，页面加载后在客户端运行。该\
  \ JavaScript 向服务器发出 AJAX 请求，通过服务器端脚本检索行星列表。清单 1.4 模拟了服务器端脚本可能返回的 JSON 数据。返回的行星列表随后用于填充\
  \ HTML 列表元素中的项目。\n\n**清单 1.3 `ajax.html` 一个简单的 JavaScript 客户端脚本，执行 AJAX 请求到服务器，以检索构建\
  \ HTML 列表元素时使用的行星列表**\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 <!DOCTYPE html>\n02 <html>\n\
  03   <head>\n04     <title>AJAX</title>\n05     <meta charset=\"utf-8\" />\n06 \
  \    <script>\n07       var xmlhttp = new XMLHttpRequest();\n08       function loadPlanets(){\n\
  09         xmlhttp.open(\"GET\",\"/lesson01/data.html\",false);\n10         xmlhttp.send();\n\
  11         var planets = JSON.parse( xmlhttp.responseText );\n12         var ulElement\
  \ = document.getElementById(\"planetList\");\n13         for (var planet in planets){\n\
  14           var listItem = ulElement.appendChild(document.createElement(\"li\"\
  ));\n15           listItem.appendChild(document.createTextNode(planets[planet]));\n\
  16         }\n17       }\n18     </script>\n19   </head>\n20   <body onload=\"loadPlanets()\"\
  >\n21     <ul id=\"planetList\">\n22     </ul>\n23   </body>\n24 </html>\n```\n\n\
  * * *\n\n**清单 1.4 `data.html` 由服务器端脚本生成的动态 JSON 数据**\n\n* * *\n\n```\n01 [\n02 \
  \  \"Mercury\",\n03   \"Venus\",\n04   \"Earth\",\n05   \"Mars\"\n06 ]\n```\n\n\
  * * *\n\n图 1.5 展示了 AJAX 请求/响应过程中发生的通信流程。请注意，会向服务器发出第二个请求以检索城市列表。\n\n![Image](img/image00772.jpeg)\n\
  \n**图 1.5** 使用 AJAX 请求，JavaScript 可以向服务器发送额外的请求，以检索可用于填充网页的附加信息。\n\n### 设置 Web 开发环境\n\
  \n在简要介绍动态 Web 编程之后，现在该切入正题，准备好你的开发环境来编写 jQuery 和 JavaScript。\n\n开发环境在编写 jQuery 和\
  \ JavaScript 项目时至关重要。开发环境应包含以下组件：\n\n![Image](img/image00767.jpeg) **易于使用的 IDE**——IDE\
  \ 提供文本编辑器，让你能够以最简单的方式修改代码。选择一个你感到舒适且可扩展以支持 HTML、CSS、JavaScript、jQuery 和 AngularJS\
  \ 的 IDE。\n\n![Image](img/image00767.jpeg) **开发 Web 服务器**——永远不要直接在实时 Web 服务器上进行开发（尽管我们大多数人都曾这样做过）。需要一个测试开发\
  \ Web 服务器来测试脚本和交互。\n\n![Image](img/image00767.jpeg) **开发 Web 浏览器**——同样，最初应针对你最熟悉或最常用的浏览器进行开发。\n\
  \n为了本书的目的，我们选择使用 Eclipse 作为 IDE，Node.js 作为开发 Web 服务器。这些技术非常容易安装、配置和上手。它们之间也能很好地集成，并且易于扩展。以下各节将引导你完成设置\
  \ Node.js 和 Eclipse 以进行 JavaScript 开发的过程。\n\n#### 设置 Node.js\n\nNode.js 是一个基于 Google\
  \ Chrome V8 引擎的 JavaScript 平台，它使你能够在 Web 浏览器之外运行 JavaScript 应用程序。它是一个非常强大的工具，但本书仅涵盖将其用作\
  \ Web 服务器以支持 Web 应用程序示例的基础知识。\n\n要安装和使用 Node.js，你需要执行以下步骤：\n\n**1.** 访问以下 URL 并点击\
  \ INSTALL。这将下载一个可安装包到你的系统。对于 Windows 系统，你将获得一个.MSI 文件；对于 Mac 系统，你将获得一个.PKG 文件；对于\
  \ Linux 系统，你可以获得一个.tar.gz 文件。\n\n[`http://nodejs.org`](http://nodejs.org)\n\n**2.**\
  \ 安装该包。对于 Windows 和 Mac，只需安装包文件。对于 Linux，请访问以下位置，了解使用包管理器进行安装的说明：\n\n\n\n\n[`https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager`](https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager)\n\
  \n3. 打开终端或控制台窗口。\n\n4. 输入 `node` 启动 Node.js JavaScript shell，你应该会看到一个 `>` 提示符。Node.js\
  \ shell 提供了直接在底层 JavaScript 引擎上执行 JavaScript 命令的能力。\n\n5. 如果找不到 `node` 应用程序，你需要将\
  \ `node` 二进制目录的路径添加到开发系统的 `PATH` 环境变量中（不同平台的操作方法不同）。在 Mac 和 Linux 系统上，二进制目录通常是 `/usr/local/bin/`。在\
  \ Windows 上，二进制目录位于 `<install>/bin` 文件夹中，其中 `<install>` 是你在安装过程中指定的位置。\n\n6. 然后你会看到\
  \ `>` 提示符。输入以下命令，并验证屏幕上是否打印出 Hello，如图 1.6 所示：\n\n    ```\n    console.log(\"Hello\"\
  );\n    ```\n\n    ![Image](img/image00773.jpeg)\n\n    **图 1.6** 启动并使用 Node.js\
  \ 命令提示符。\n\n7. 使用以下命令退出 Node.js 提示符：\n\n    ```\n    process.exit();\n    ```\n\n\
  现在你已经成功安装并配置了 Node.js。\n\n### 将 Eclipse 配置为 Web 开发 IDE\n\nIDE 是使用 JavaScript 进行开发时最重要的方面。IDE\
  \ 将编写 Web 应用程序所需的各种任务集成到单个界面中。实际上，你可以使用任何文本编辑器来编写 HTML、CSS、JavaScript 和 jQuery 代码。但是，你会发现使用一个好的\
  \ IDE 效率更高、更轻松。\n\n我们选择 Eclipse 作为本书的 IDE，因为它是一个出色的通用 IDE，易于配置和设置。如果你愿意，也可以使用自己的\
  \ IDE；不过，如果你不熟悉 Eclipse，这可能是尝试不同 IDE 的好机会。\n\n> **注意：** 你需要安装 Java JRE 或 JDK 才能安装\
  \ Eclipse。\n\n按照以下步骤下载、安装和配置 Eclipse：\n\n1. 安装 Java JRE 或 JDK。对于本书，我们从以下位置下载并安装了\
  \ Java SE Development Kit 8：\n\n    [`www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\n\
  \n2. 下载并解压 Eclipse。解压 Eclipse 文件的位置即为安装位置。对于本书，我们从以下位置安装了 Luna 版本的 Eclipse IDE for\
  \ Java Developers：\n\n    [`www.eclipse.org/downloads/`](http://www.eclipse.org/downloads/)\n\
  \n3. 双击 Eclipse 可执行文件启动 Eclipse。\n\n4. Eclipse 加载完成后，通过选择主菜单中的 Help、Eclipse Marketplace\
  \ 来安装 Eclipse 的 Node.js 插件。然后在 Find 框中输入 `nodeclipse`，点击 Install 安装该包，如图 1.7 所示。在安装过程中，你需要接受许可协议。\n\
  \n    ![Image](img/image00774.jpeg)\n\n    **图 1.7** 为 Eclipse 安装 Nodeclipse 插件。\n\
  \n5. 安装 Nodeclipse 插件后，通过选择主菜单中的 Help、Eclipse Marketplace 来安装 HTML Editor 插件。然后在\
  \ Find 框中输入 `html editor`，点击 Install 安装该包，如图 1.8 所示。在安装过程中，你需要接受许可协议。\n\n    ![Image](img/image00775.jpeg)\n\
  \n    **图 1.8** 为 Eclipse 安装 HTML Editor 插件。\n\n6. 重启 Eclipse 以启用新插件。\n\n7. 验证 `.js`\
  \ 扩展名使用 Nodeclipse 作为默认编辑器，`.html` 扩展名使用 HTML Editor 作为默认编辑器。为此，选择 Window、Preferences，然后选择\
  \ General、Editors、File Associations，点击文件类型查看关联的编辑器，如图 1.9 所示。\n\n    ![Image](img/image00776.jpeg)\n\
  \n    **图 1.9** 在 Eclipse 中设置文件类型的默认编辑器。\n\n8. 通过选择 Window、Preferences，然后在导航窗格中选择\
  \ Nodeclipse，设置 Node.js 可执行文件的路径。Node.js 路径选项位于选项的顶部附近。\n\n9. 通过选择 File、New、Project\
  \ 启动 New Project Wizard，为本书创建一个项目。然后选择 Node、Node.js Project。点击 Next，输入项目名称，例如 LearningJavaScript。然后点击\
  \ Finish 创建项目。\n\n10. 现在，我们将通过从 Eclipse 创建并运行一个 JavaScript 应用程序来验证一切是否正常。选择新项目，然后从主菜单中选择\
  \ File、New JavaScript File。将文件命名为 `first.js`，点击 Finish 创建文件。\n\n11. 在文件中输入以下代码行并保存：\n\
