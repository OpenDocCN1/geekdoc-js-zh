  ></script>\n08     <link rel=\"stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n09     <script>\n10       $(document).ready(function(){\n11         $( \"#datepicker\"\
  \ ).datepicker();\n12       });\n13     </script>\n14   </head>\n15   <body>\n16\
  \     <div id=\"datepicker\"></div>\n17   </body>\n18 </html>\n```\n\n---\n\n###\
  \ 在脚本中应用 jQuery UI\n\n现在您已经加载并准备好 jQuery UI 库，可以了解 jQuery UI 在 jQuery 基础上添加的一些增强功能。本节将介绍一些新功能以及对\
  \ jQuery 库的一些增强。jQuery UI 的核心——即效果、交互和小部件——将在后续课程中介绍。\n\n#### 理解增强的 jQuery UI 功能\n\
  \njQuery UI 在很多方面都是 jQuery 库的扩展。为了让您快速上手并开始实现 jQuery UI 组件，以下部分将讨论 jQuery 的一些重要升级。\n\
  \n##### 添加和删除唯一 ID\n\njQuery UI 为 jQuery 对象提供了几个额外的方法，使您可以轻松地向一组元素添加和删除唯一 ID。当您动态创建大量新元素，并且之后必须通过\
  \ ID 访问它们时，这尤其有用。\n\n\n\n\n要添加唯一 ID，请使用 `.uniqueId()` 方法。该方法会检查集合中的每个元素，如果元素没有 `id`\
  \ 属性，则为其添加一个。新 ID 的前缀为 `\"ui-id-\"`。如果元素已有 `id` 属性，则不会修改。\n\n之后，你可以使用集合上的 `.removeUniqueId()`\
  \ 方法删除这些唯一 ID。只有通过 `.uniqueId()` 创建的 ID 才会被影响。\n\n例如，以下代码为所有 `<div>` 元素添加 `id` 值，随后再删除它们：\n\
  \n```\nvar divs = $(\"div\").uniqueId();\n\n...\n\ndo something\n\n...\n\n$(\"div\"\
  ). removeUniqueId ();\n```\n\n##### 获取滚动父元素\n\njQuery UI 中另一个有用的补充是 `.scrollParent()`\
  \ 方法。该方法会搜索元素的祖先，并返回第一个可滚动的父元素。此方法仅适用于集合中只有一个元素的 jQuery 对象。\n\n##### 获取 zIndex\n\
  \njQuery UI 中另一个有用的补充是 `.zIndex()` 方法。该方法返回元素的数值型 `z-index` 值（如果元素本身有该值），或者返回第一个拥有该值的祖先元素的\
  \ `z-index`。这让你能够快速确定页面上任何元素的堆叠层级。\n\n##### 异步聚焦\n\njQuery UI 扩展了 jQuery 对象的 `.focus(delay\
  \ [, callback])` 方法，允许在设置焦点之前添加一个 `delay`（延迟），并包含一个 `callback`（回调）函数，该函数会在元素获得焦点时执行。`delay`\
  \ 以毫秒为单位指定。\n\n此功能用途广泛，从使用计时器、自动选择表单元素，到强制重新聚焦某个元素。例如，以下代码在将焦点设置到元素 `#timedInput`\
  \ 之前添加了半秒延迟：\n\n```\n$(\"#timedInput\").focus(500, function(){\n  $(this).val(\"\
  Enter Text Now\");\n});\n```\n\n#### 在 jQuery UI 中使用新选择器\n\njQuery UI 的一大特色是能够扩展已经相当全面的\
  \ jQuery 选择器。这些新选择器使得针对 UI 元素需求缩小选择范围变得更加容易。以下各节将讨论每个新选择器。\n\n##### 使用 :data() 选择器\n\
  \njQuery UI 中我最喜欢的选择器之一是 `:data()` 选择器。该选择器允许你根据通过 jQuery 的 `.data()` 方法添加到元素上的特定键来过滤元素。例如，以下代码为所有\
  \ `<span>`、`<div>` 和 `<p>` 元素添加一个 `color` 值，然后使用 `:data()` 选择器为这些元素设置颜色：\n\n```\n\
  $(p).data(\"color\", \"red\");\n$(span).data(\"color\", \"blue\");\n$(div).data(\"\
  color\", \"green\");\n$(\":data(color)\").each(function(){\n  $(this).css({color:$(this).data(\"\
  color\")});\n});\n```\n\n#### :focusable\n\n`:focusable` 选择器允许你将元素限制为仅那些可以接收焦点的元素。例如，以下语句将更改限制为仅那些可以接收焦点的表单元素：\n\
  \n```\n$(\"form:focusable\").each(function(){\n  $(this).css({color:red});\n});\n\
  ```\n\n##### :tabbable\n\n`:tabbable` 选择器与 `:focusable` 选择器类似。它允许你将元素限制为仅那些可以通过\
  \ Tab 键导航到的元素。例如，以下语句将更改限制为仅那些可以通过 Tab 键导航到的表单元素：\n\n```\n$(\"form:tabbable\").each(function(){\n\
  \  $(this).css({color:red});\n});\n```\n\n这个过滤器非常有用，尤其是在你试图排除被禁用的元素时。\n\n---\n\n\
  提示\n\n具有负 tab 索引的元素是 `:focusable` 的，但不是 `:tabbable` 的。\n\n---\n\n---\n\n#### 动手实践：基于数据值应用\
  \ jQuery UI 选择器\n\n在本例中，你将在网页中添加几个 `<div>` 元素。然后在 jQuery 中，为其中一些元素添加图片数据值。使用 `:data()`\
  \ 选择器，你对带有图片数据的元素应用与不带图片数据的元素不同的更改。\n\n示例代码见清单 16.2、16.3 和 16.4。按照以下步骤创建动态网页：\n\n\
  1. 在 Eclipse 中，创建 `lesson16/jquery_image_adder.html`、`lesson16/js/jquery_image_adder.js`\
  \ 和 `lesson16/css/jquery_image_adder.css` 文件。\n\n2. 添加清单 16.2 所示的代码。以下行用于加载 jQuery\
  \ 库、jQuery UI 库和 CSS 文件：\n\n```\n06     <script type=\"text/javascript\" src=\"\
  https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n07     <script type=\"\
  text/javascript\" src=\"http://code.jquery.com/ui/1.11.2/jquery-ui.min.js\"></script>\n\
  08     <script type=\"text/javascript\" src=\"js/jquery_image_adder.js\"></script>\n\
  09     <link rel=\"stylesheet\" type=\"text/css\" href=\"http://code.jquery.com/ui/1.11.2/themes/smoothness/jquery-ui.css\"\
  >\n10     <link rel=\"stylesheet\" type=\"text/css\" href=\"css/jquery_image_adder.css\"\
  >\n```\n\n3. 打开 `jquery_image_adder.js` 文件，添加一个基本的 `.ready()` 函数。\n\n4. 添加以下三行代码。这些行为文档中的某些\
  \ `<div>` 元素添加了 `image` 数据值：\n\n```\n02   $(\"#arch\").data(\"image\", \"images/arch.jpg\"\
  );\n03   $(\"#volcano\").data(\"image\", \"images/volcano.jpg\");\n04   $(\"#pyramid\"\
  ).data(\"image\", \"images/pyramid2.jpg\");\n```\n\n5. 添加以下 `click` 处理函数，该函数首先获取所有具有\
  \ `image` 值的 `<div>` 元素，并使用该 `image` 值设置一个 `<img>` 元素的 `src` 属性，然后将该 `<img>` 元素前置到\
  \ `<div>` 中。接着，函数获取所有没有 `image` 值的 `<div>` 元素，并前置通用的 insert.png 图片：\n\n```\n05 \
  \  $(\"#add\").click(function(){\n06     $(\"div:data(image)\").each(function(){\n\
  07       $(this).prepend(\n08           $('<img></img>').attr(\"src\", $(this).data(\"\
  image\")));\n09     });\n10     $(\"div:not(:data(image))\").each(function(){\n\
  11       $(this).prepend(\n12           $('<img></img>').attr(\"src\", \"/images/insert.png\"\
  ));\n13     });\n14   });\n```\n\n6. 保存所有三个文件，然后在 Web 浏览器中打开 HTML 文档，如图 16.4 所示。当你点击“添加图片”按钮时，应该会看到具有\
