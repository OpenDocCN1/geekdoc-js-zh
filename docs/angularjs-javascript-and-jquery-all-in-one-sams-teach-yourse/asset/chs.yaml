  \ type=\"video/mp4\">\n\n  <source src=\"images/movie.ogg\" type=\"video/ogg\">\n\
  \n  抱歉，您的浏览器不支持 video 标签。\n\n</video>\n\n<audio controls>\n\n  <source src=\"song.mp3\"\
  \ type=\"audio/mp3\">\n\n  抱歉，您的浏览器不支持 audio 元素。\n\n</audio>\n```\n\n![Image](img/image00822.jpeg)\n\
  \n**图 3.16** 渲染后的 `<video>` 元素允许您播放视频。\n\n![Image](img/image00823.jpeg)\n\n**图 3.17**\
  \ 渲染后的 `<audio>` 元素允许您播放歌曲或其他音频。\n\n### 总结\n\n在本课中，您学习了 HTML 网页开发的基础知识。您还了解了如何通过\
  \ jQuery 和 JavaScript 动态访问某些元素，以便更好地设计网页中的交互。此外，您还学习了设计 HTML 元素以支持实现 CSS 布局和样式所需的基础知识。\n\
  \n几个“动手试一试”的演练逐步引导您添加了带样式的容器、表格和 Web 表单。在后续课程中，您将运用本课所学的基础知识来实现动态的 jQuery 和 JavaScript。\n\
  \n### 问答\n\n**问. 为什么有 HTML5 和 HTML 4，而不只是 HTML？我应该使用哪一个？**\n\n**答.** 网络浏览器需要一段时间才能采用较新版本\
  \ HTML 的标准。许多 HTML5 特性在旧版浏览器中无法工作，而一些新版浏览器也只支持部分特性，不支持其他特性。这会导致 HTML 页面出现错误，用户体验极差。因此，在\
  \ HTML5 得到所有浏览器完全支持之前，HTML 4 被保留为另一个标准。选择使用哪一个取决于谁将查看您的网页。如果网页面向互联网上的所有人，您需要继续支持\
  \ HTML 4，直到浏览器完全支持 HTML5。如果网页仅供公司内部用户使用，并且您可以要求使用特定级别的浏览器，那么您可以选择一个完全支持 HTML5 的浏览器及其版本，并利用新特性。\n\
  \n**问. 既然可以通过 JavaScript 动态创建元素，为什么还要费心用元素创建 HTML 文档？**\n\n**答.** 对于动态网页，最佳范式是先用\
  \ HTML 构建基本骨架，再用 CSS 设置样式，最后用 JavaScript 添加交互。之所以应该使用包含完整基本骨架的 HTML 文档，是因为通过 HTML\
  \ 理解和调整网页结构比通过 JavaScript 容易得多。此外，如果您要对网页进行本地化，通常本地化 HTML 文档比本地化动态 JavaScript 字符串更容易。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固您对本课所学内容的理解。请先尝试回答问题，再查看答案。\n\n#### 小测验\n\n**1.**\
  \ 使用哪个 HTML 元素属性来更改元素的背景颜色和大小等内容？\n\n**2.** `<noscript>` 元素用于什么？\n\n**3.** `<canvas>`\
  \ 和 `<svg>` 元素有什么区别？\n\n**4.** 判断正误：HTML 页面不能链接到同一页面上的某个位置。\n\n**5.** 块级元素和内联 HTML\
  \ 元素有什么区别？\n\n#### 小测验答案\n\n**1.** `style`。\n\n**2.** 如果用户的浏览器中未启用 JavaScript，`<noscript>`\
  \ 允许您在 HTML 页面上显示一条消息。\n\n**3.** `<canvas>` 元素以基于像素的图形显示图像，支持 JPEG 和 PNG 等图像；`<svg>`\
  \ 支持基于矢量的图形，以一系列路径的形式呈现，缩放时保持清晰。\n\n**4.** 错误。您可以使用 `<a href\"#` 语法链接到网页上的本地锚点。\n\
  \n**5.** 块级元素占据屏幕的整个宽度，因此其后的元素会排在下方；而多个内联元素可以显示在同一行，因为它们只占据其内容所需的空间。\n\n#### 练习\n\
  \n**1.** 扩展清单 3.5 中的示例，添加一些其他的国家公园。\n\n**2.** 以清单 3.8 中的示例为基础，通过将路径中所有顶部点指向同一点 (100,15)，将立方体改为球体。您需要移除绘制立方体顶部的部分，更改移动指令，并移除一些\
  \ `lineTo()` 函数。\n\n## 第 4 课 添加 CSS/CSS3 样式以实现动态设计与布局\n\n本课学习内容：\n\n- ![Image](img/image00767.jpeg)\
  \ 将 CSS 添加到 HTML 文档\n- ![Image](img/image00767.jpeg) 如何使用 CSS 选择器将样式应用于特定的 HTML\
  \ 元素\n- ![Image](img/image00767.jpeg) 如何将颜色、图像和背景应用于 HTML 元素\n- ![Image](img/image00767.jpeg)\
  \ 在 HTML 元素周围创建漂亮的边框\n- ![Image](img/image00767.jpeg) 使用 CSS 定义网页的外观和布局\n- ![Image](img/image00767.jpeg)\
  \ 设计供 AngularJS、jQuery 和 JavaScript 代码使用的 CSS\n\n动态网页最重要的方面之一是，当用户与页面交互时，能够动态调整元素的设计和布局。本课重点介绍如何将\
  \ CSS 样式添加到 HTML 文档中。CSS 提供了一种轻松将样式更改应用于网页上 HTML 元素的方法。\n\n重要的是，要添加一个初始的良好设计，以便在\
  \ AngularJS、jQuery 和 JavaScript 代码中轻松更改。有了良好的设计，通过 AngularJS、jQuery 和 JavaScript\
  \ 进行的简单样式更改就能显著改变 HTML 组件的外观和行为，从而提供丰富的用户体验。\n\n以下各节将介绍 CSS 语法，以及如何使用 CSS 修改 HTML\
  \ 元素的外观和网页的布局。\n\n### 将 CSS 样式添加到网页\n\n您可以通过多种方式将 CSS 样式添加到网页：作为单独的文件、在 HTML 的 `<head>`\
  \ 元素中、在 HTML 的 `<body>` 元素中、在特定 HTML 元素内部内联，甚至可以通过 AngularJS、jQuery 和 JavaScript\
  \ 动态添加。\n\n您可以根据需要以多种方式应用任意数量的样式。但需要注意的是，样式是按顺序应用的，后应用的样式会覆盖之前样式的值。样式的加载顺序如下：\n\n\
  **1.** 来自头部的 `<link>` 或 `<style>` 元素。位置靠下的元素会覆盖其上方元素的样式。\n\n**2.** 网页正文中的 `<style>`\
  \ 元素。位置靠下的元素会覆盖其上方元素的样式。\n\n* * *\n\n注意\n\n如果在两个不同的 CSS 文件或 `<style>` 部分中为同一元素定义了不同的\
  \ CSS 定义，则最后加载的定义会覆盖之前的定义。这非常有用，但如果并非有意为之，则可能带来麻烦。例如，如果您有一个选择器更改了 `<p>` 元素的多个属性，而后又有一个选择器直接引用了某个特定\
  \ `<p>` 元素的 ID，那么您可能希望将通用定义放在特定定义之前，以便保留特定的属性值。\n\n* * *\n\n**3.** 通过元素的 `style`\
  \ 属性直接应用于 HTML 元素的样式。\n\n**4.** 通过 AngularJS、jQuery 或 JavaScript 动态应用的样式。这些样式会在\
  \ JavaScript 执行时动态应用。\n\n\n\n\n\n以下各节将讨论如何使用每种选项添加样式以及何时使用它们。\n\n### 从文件加载 CSS 样式\n\
  \n通常，加载 CSS 样式的最佳方法是从单独的文件加载，即创建一个扩展名为 `.css` 的文件，然后将其添加到网站中。这有几个优点：\n\n![Image](img/image00767.jpeg)\
  \ 你可以将多个 HTML 文档链接到同一个 CSS 文件。\n\n![Image](img/image00767.jpeg) 你的 HTML 文件会保持更整洁，因为不会有大量额外的\
  \ CSS 代码拖累它们。\n\n![Image](img/image00767.jpeg) 通过更换 CSS 文件，可以轻松地重新设计网站的外观。\n\n要从单独的文件加载\
  \ CSS 样式，你需要将 `.css` 文件添加到网站，然后在 HTML 的 `<head>` 元素中添加一个 `<link>` 元素。当网页加载时，浏览器解析\
  \ `<link>` 元素，向 Web 服务器请求 `.css` 文件，并在渲染 HTML 元素时应用样式。\n\n以下是 `<link>` 元素中使用的语法示例。注意\
  \ `rel` 属性设置为 `stylesheet`，`type` 设置为 `text/css`，`href` 指向 Web 服务器上 `.css` 文件的位置：\n\
  \n点击此处查看代码图片\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/test.css\"\
  >\n```\n\n### 在头部添加 CSS 样式\n\n你也可以直接在网页的 `<head>` 元素中使用 `<style>` 标签添加 CSS 样式。`<style>`\
  \ 标签内的所有文本都将被视为 CSS，被浏览器读取，并在渲染元素时应用。\n\n在头部应用 CSS 样式确实有一些优点，包括：\n\n![Image](img/image00767.jpeg)\
  \ 可以轻松地将样式添加到头部以测试网页，而无需管理额外的 `.css` 文件。\n\n![Image](img/image00767.jpeg) 你可以用特定于该页面的样式覆盖从\
  \ `.css` 文件加载的全局样式。\n\n以下是一个包含带有 CSS 的 `<style>` 元素的 `<head>` 元素示例。注意 `type` 属性设置为\
  \ `text/css`；这不是必需的，但在浏览器支持其他样式类型时，这是一种良好的实践：\n\n点击此处查看代码图片\n\n```\n<html>\n  <head>\n\
  \    <meta charset=\"UTF-8\">\n    <style type=\"text/css\">\n      p{\n       \
  \ background-color:#C0C0C0;\n        padding: 3px;\n      }\n      span{\n     \
  \   font-weight:bold;\n      }\n    </style>\n  </head>\n...\n```\n\n### 在 HTML\
  \ 正文中使用 CSS 样式\n\n你也可以使用 `<script>` 标签直接在 HTML 的 `<body>` 元素中添加 CSS 样式设置。这不是一个好习惯，因为它会使网页样式变得非常难以更改和修复。你应该只在需要快速添加样式进行测试时使用此方法。测试后，应始终将它们移动到\
  \ `<head>` 或单独的文件中。\n\n### 在 HTML 元素中定义 CSS 样式\n\nHTML 元素提供了一个 `style` 属性，允许你直接在\
  \ HTML 语句中设置 CSS 样式。这有优点，但也有一个巨大的缺点。\n\n优点是你可以覆盖全局应用于网站或网页的 CSS 样式。这使得可以自定义特定元素的外观，而无需在其他位置包含特殊规则。\n\
  \n缺点是如果你频繁这样做，当你决定采用不同的网页设计或品牌风格时，更新网站样式会变得非常困难。\n\n以下代码行展示了如何直接在 `<span>` 元素中添加\
  \ CSS `style` 的示例：\n\n点击此处查看代码图片\n\n```\n<span style=\"background-color:blue; color:white\
  \ font-weight:bold\">Styled Text\n</span>\n```\n\n## 向 HTML 元素添加 CSS 样式\n\n你已经在本书前面的示例中看到了一些\
  \ CSS 应用的简单示例。现在是时候向你介绍可以通过 CSS 应用于 HTML 元素的语法和属性了。本节并非详尽无遗，但它将让你了解可以通过 CSS 对 HTML\
  \ 元素做哪些操作。\n\n在阅读和尝试示例时，请记住，你可以通过 AngularJS、jQuery 和 JavaScript 访问 CSS 属性，因此可以在用户与网页交互时动态设置它们。\n\
  \n### 理解基本 CSS 语法\n\nCSS 由一组或多组规则组成，这些规则定义了浏览器在渲染 HTML 元素时使用的属性值。每条规则以一个选择器开头，该选择器定义了要将样式更改应用于哪些\
  \ HTML 元素。然后在 `{}` 大括号内是具体的属性设置。属性值使用 `property:value` 语法设置。每个属性设置之间用分号分隔。\n\n以下列表展示了一个简单的\
  \ CSS 规则示例，该规则设置了 `<p>` 元素的字体样式、背景颜色和宽度：\n\n```\np {\n  font-style:italic;\n  background-color:#DDDDDD;\n\
  \  width:250px;\n}\n```\n\n你应该为每个元素使用单独的行，以使文件更易读、更整洁。只要它们被包含在 `{}` 大括号内，你也可以将多个元素放在同一行。例如：\n\
  \n点击此处查看代码图片\n\n```\np { font-style:italic; background-color:#DDDDDD; width:250px;\
  \ }\n```\n\n* * *\n\n注意\n\n几个 CSS 属性支持单个属性的多个设置。这有助于保持 CSS 文件更简洁，同时保持可读性。例如，以下单个\
  \ CSS 属性设置将字体设置为 `bold`、`italic`、`12` 像素和 `Times New Roman`。多个设置之间用空格分隔。指定了两种字体：`Times\
  \ New Roman` 和 `serif`，因此如果浏览器找不到第一种，它将使用第二种。注意，由于 `Times New Roman` 包含空格，它必须用双引号或单引号括起来。还要注意，两种字体之间用逗号分隔，表示它们仍然是同一设置值的一部分：\n\
  \n点击此处查看代码图片\n\n```\nfont:italic bold 12px \"Times New Roman\",serif;\n```\n\n*\
  \ * *\n\n图 4.1 展示了将背景和颜色更改应用于 `<p>` 元素和 `<span>` 元素的基本 CSS。注意有两条规则——每种元素类型一条。每条规则中列出的属性值仅应用于选择器指定的元素。\n\
  \n![Image](img/image00824.jpeg)\n\n**图 4.1** CSS 规则由一个选择器组成，后跟要应用于 HTML 元素的属性值列表。\n\
  \n* * *\n\n注意\n\n某些 CSS 属性仅在特定类型的浏览器中受支持。CSS 有一种命名约定，允许将浏览器引擎前缀添加到属性名称前，以标识该属性设置针对的浏览器。这有几个好处：一是你可以为不同的浏览器指定不同的\
  \ CSS 属性值；二是你可以仅为支持该功能的浏览器设置 CSS 属性。前缀分别是：`-ms-` 用于 Internet Explorer，`-moz-` 用于\
  \ Firefox，`-webkit-` 用于 Safari 和 Chrome，`-o-` 用于 Opera。以下示例展示了使用前缀设置旋转属性值：\n\n点击此处查看代码图片\n\
  \n```\n-ms-transform:rotate(5deg);         /* IE 9 */\n-moz-transform:rotate(5deg);\
  \        /* Firefox */\n-webkit-transform:rotate(5deg);     /* Safari and Chrome\
  \ */\n-o-transform:rotate(5deg);          /* Opera */\n```\n\n* * *\n\n### 使用 CSS\
  \ 选择器为 HTML 元素设置样式\n\n\n\n\n\nHTML 元素样式化中最重要的部分之一是 CSS 选择器。CSS 选择器用于定义 CSS 规则应用于哪些\
  \ HTML 元素。CSS 选择器起初可能看起来有点令人生畏；然而，当你通过一些示例理解了基本概念后，语法就会变得清晰。\n\n下面的一系列示例将帮助你理解选择器。\n\
  \n要将 CSS 规则应用于所有 `<div>` 元素，请使用以下方式（HTML 元素通过标签名引用）：\n\n```\ndiv {...\n```\n\n要将\
  \ CSS 规则应用于具有 `id` 属性且值为 `myDiv` 的特定 HTML 元素，请使用以下方式（在 CSS 中，`id` 属性使用 `#` 表示）：\n\
  \n```\n#myDiv {...\n```\n\n要将 CSS 规则应用于所有具有 `class` 属性且值为 `container` 的 HTML 元素组，请使用以下方式（在\
  \ CSS 中，`class` 属性使用 `.` 表示）：\n\n```\n.container {...\n```\n\n要将 CSS 规则应用于鼠标悬停时的\
  \ `<span>` 元素，请使用以下方式（在 CSS 中，状态通过 `:state` 表示）：\n\n```\nspan:hover {...\n```\n\n\
  要将 CSS 规则应用于 `target` 属性设置为 `_blank` 的 `<a>` 元素，请使用以下方式（在 CSS 中，属性通过 `[]` 方括号表示）：\n\
  \n```\na[target=_blank]\n```\n\n你还可以使用逗号将多个选择器链接在一起。例如，要将 CSS 规则应用于所有 `<div>`、`<span>`、`<p>`\
  \ 以及 `class=\"menu\"` 的元素，可以使用以下方式：\n\n```\ndiv, span, p, .menu {...\n```\n\n另外请记住，CSS\
  \ 代表层叠样式表。你可能会有不同的选择器应用于多个重叠的对象组。例如，考虑以下选择器。第一个应用于所有 `<div>` 元素，第二个仅应用于“`menu`”类元素（其中一些是\
  \ `<div>` 元素），最后一个仅应用于当前鼠标光标下的“`menu`”类元素。`.menu` 和 `.menu:hover` 规则中的属性设置将覆盖 `div`\
  \ 规则中的设置：\n\n```\ndiv {...\n```\n\n```\n.menu {...\n```\n\n```\n.menu:hover{...\n\
  ```\n\n表 4.1 列出了几种类型的选择器；它展示了一个示例并描述了选择器的工作方式。你可以用选择器做更多的事情，远不止前面示例和表 4.1 中展示的内容，但这些应该能让你了解我们在本书其余练习中如何使用选择器。\n\
  \n![Image](img/image00825.jpeg)![Image](img/image00826.jpeg)\n\n**表 4.1 一些更常用的 CSS\
  \ 选择器列表**\n\n#### 使用 CSS 设计属性\n\n大多数 CSS 属性旨在改变 HTML 项目的外观。不幸的是，开箱即用的 HTML 元素看起来相当平淡。然而，通过添加颜色、边框、背景、图像和其他设计属性，你可以仅用少量\
  \ CSS 代码就显著改变 HTML 元素的外观。\n\n以下部分介绍了改变 HTML 组件外观的 CSS 属性。\n\n##### CSS 颜色\n\n通过\
  \ CSS 应用的最常用设置之一是颜色属性。大多数元素都有一个颜色属性，用于定义浏览器渲染它们时使用的颜色——例如，表格边框、列表项目符号或段落中的文本字符。\n\
  \n你可以使用多种方法来设置精确的颜色，以支持定义颜色的人的不同背景和情况。颜色值可以通过以下方法之一指定：\n\n![Image](img/image00767.jpeg)\
  \ **名称**——CSS 颜色名称，例如 `red`、`blue`、`green` 或 `yellow`。有 147 个预定义的颜色名称，例如 `aqua`、`crimson`\
  \ 和 `silver`。你可以在 [www.w3.org/TR/css3-color/#svg-color](http://www.w3.org/TR/css3-color/#svg-color)\
  \ 找到颜色名称列表。\n\n![Image](img/image00767.jpeg) **十六进制**——你可以指定一个十六进制数，表示颜色中包含的红、绿、蓝的量。语法为\
  \ `#RRGGBB`。值 `00` 表示不含该颜色，值 `FF` 表示包含全部该颜色。例如，红色为 `#FF0000`，绿色为 `#00FF00`，蓝绿色为\
  \ `#00FFFF`。\n\n![Image](img/image00767.jpeg) **RGB**——与十六进制类似，但你可以指定 0 到 255 之间的值。例如，蓝绿色为\
  \ `rgb(0, 255, 255)`。\n\n![Image](img/image00767.jpeg) **RGBA**——与 RGB 相同；但你可以额外指定一个控制不透明度的\
  \ alpha 参数，其中 `0.0` 表示完全透明，`1.0` 表示不透明。例如：`rgba(0, 255, 255, 0.5)` 表示 50% 不透明度的蓝绿色。\n\
  \n![Image](img/image00767.jpeg) **HSL**——允许你基于色相/饱和度/亮度色彩方案指定颜色。例如，色相为 `100`、饱和度为\
  \ `45%`、亮度为 `75%` 的颜色将是 `hsl(100, 45%, 75%)`。\n\n![Image](img/image00767.jpeg) **HSLA**——与\
  \ HSL 相同，但你可以额外指定一个控制不透明度的 alpha 参数，其中 `0.0` 表示完全透明，`1.0` 表示不透明。例如，80% 透明度的颜色将是\
  \ `hsla(100, 45%, 75%, .20)`。\n\n例如，以下 CSS 规则都将 `<p>` 元素的文本颜色定义为蓝色，并且完全可以互换：\n\n\
  点击此处查看代码\n\n```\np {color:blue;}\np {color:#0000FF;}\np {color:rgb(0,0,255);}\n\
  p {color:rgba(0,0,255,1.0);}\np {color:hsl(240,100%,50%);}\np {color:hsl(240,100%,50%,1.0);}\n\
  ```\n\n* * *\n\n自己动手：通过 CSS 应用文本样式\n\nCSS 提供了几个属性，使你能够定义 HTML 元素中文本的外观。以下是你可能会遇到的一些常见文本属性：\n\
  \n![Image](img/image00767.jpeg) `color`——允许你设置文本的颜色和透明度。\n\n![Image](img/image00767.jpeg)\
  \ `font`——允许你设置用于渲染文本的字体的各种属性。可以设置的属性有 `font-style`、`font-variant`、`font-weight`、`font-size`\
  \ 和 `font-family`。`font` 属性允许将这些设置放在一行中，或者作为一系列单独的属性。例如，以下两行是等效的，并产生如图 4.2 所示的输出：\n\
  \n点击此处查看代码\n\n```\n#roman{font: italic bold 30px \"Times New Roman\", serif}\n#roman{\n\
  \  font-family:\"Times New Roman\", serif;\n  font-style:italic;\n  font-weight:bold;\n\
  \  font-size: 30px;\n  }\n```\n\n![Image](img/image00827.jpeg)\n\n**图 4.2** 更改字体样式、粗细、大小和字体系列。\n\
  \n* * *\n\n注意\n\n字体系列按照 `font-family` 属性中指定的顺序应用。使用找到的第一个字体。最好始终提供一个通用字体（如 serif）作为后备，以防你指定的字体在浏览器系统上不存在。\n\
  \n* * *\n\n![Image](img/image00767.jpeg) `text-align`——允许你将文本对齐方式设置为 `right`、`left`\
  \ 或 `centered`。例如，以下 CSS 设置会渲染出如图 4.3 所示的输出：\n\n点击此处查看代码\n\n```\n#align-left{text-align:left}\n\
  #align-center{text-align:center}\n#align-right{text-align:right}\n```\n\n![Image](img/image00828.jpeg)\n\
  \n**图 4.3** 更改对齐方式会重新定位浏览器中的文本。\n\n![Image](img/image00767.jpeg) `letter-spacing`——允许你指定单词中字母之间的间距量。该值可以是正数或负数，并且可以指定为\
  \ `px/pt/cm`。图 4.4 展示了使用以下 CSS 设置将字母间距收紧 1 像素的示例：\n\n```\n#tight{letter-spacing:-1px}\n\
  ```\n\n![Image](img/image00829.jpeg)\n\n**图 4.4** 将字母间距改为 1px 会收紧文本。\n\n![Image](img/image00767.jpeg)\
  \ `word-spacing`——允许你指定单词之间的间距量。该值可以是正数或负数，并且可以指定为 `px/pt/cm`。\n\n\n\n\n\n![Image](img/image00767.jpeg)\
  \ `line-height`——允许你控制行与行之间的间距。你可以将值指定为一个数字（乘以文本高度）、一个带有 `em`/`px`/`pt`/`cm` 后缀的数值，或者一个百分比（相对于行高的百分比）。图\
  \ 4.5 展示了使用以下 CSS 设置将行间距收紧到正常高度 50% 的示例：\n\n```\n#half-height{line-height:50%}\n\
  ```\n\n![Image](img/image00830.jpeg)\n\n**图 4.5** 将行高改为 50% 会收紧文本行。\n\n![Image](img/image00767.jpeg)\
  \ `text-decoration`——允许你使用 `overline`、`underline` 或 `line-through` 值在文本下方、上方或中间添加线条。你也可以指定\
  \ `blink` 值让文本在浏览器中闪烁。以下 CSS 代码行会使元素呈现下划线和删除线，如图 4.6 所示：\n\n点击此处查看代码图片\n\n```\n\
  #underline{text-decoration:underline;}\n\n#strike-through{text-decoration:line-through;}\n\
  ```\n\n![Image](img/image00831.jpeg)\n\n**图 4.6** 将文本改为下划线或删除线。\n\n![Image](img/image00767.jpeg)\
  \ `text-indent`——允许你指定首行缩进量，可以是一个具体值（如 `20px`），也可以是元素宽度的百分比（如 `20%`）。\n\n![Image](img/image00767.jpeg)\
  \ `text-transform`——允许你改变文本的大小写：使用 `capitalize` 将每个单词的首字母大写，`uppercase` 将所有字母大写，或\
  \ `lowercase` 移除所有大写字母。\n\n![Image](img/image00767.jpeg) `text-overflow`——允许你定义当文本宽度超过元素允许尺寸时的行为。选项有：`clip`（直接裁剪文本）、`ellipsis`（添加\
  \ ... 表示被裁剪的文本），或一个字符串（替换被裁剪的文本）。例如，以下 CSS 代码行会在文本过长时裁剪并在末尾追加字符串“`(more)`”：\n\n\
  点击此处查看代码图片\n\n```\n#overflow{text-overflow:\" (more)\";}\n```\n\n按照以下步骤创建一个 HTML\
