  \ 元素样式化为列表标题。\n\n**7.** 打开 `jquery_selectors.js` 文件，以便为 `<span>` 元素添加事件处理程序。\n\n\
  **8.** 添加一个名为 `setEven()` 的 JavaScript 函数，作为事件处理程序。\n\n**9.** 添加以下代码行，使用 jQuery\
