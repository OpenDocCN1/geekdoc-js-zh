  )){\n   16     $(\"#nameB\").val($(\"#name\").val());\n   17     $(\"#addrB\").val($(\"\
  #addr\").val());\n   18     $(\"#cityB\").val($(\"#city\").val());\n   19     $(\"\
  #stateB\").val($(\"#state\").val());\n   20     $(\"#zipB\").val($(\"#zip\").val());\n\
  \   21     $(\"#addrB, #cityB, #stateB, #zipB\").prop(\"disabled\", \"disabled\"\
  );\n   22   } else{ $(\"#addrB, #cityB, #stateB, #zipB\").prop(\"disabled\", \"\"\
  ); }\n   23 }\n   ```\n\n5. 添加以下函数，以便在用户选择信用卡或 PayPal 时更新付款部分。请注意，当用户选择信用卡时，PayPal\
  \ 信息被隐藏，信用卡信息显示；如果选择 PayPal，则相反。同时注意，在这两种情况下，焦点都会切换到用户开始输入付款信息的区域中的第一个文本元素。这样，用户就不需要按\
  \ Tab 键或点击下一个元素：\n\n   点击此处查看代码图像\n\n   ```js\n   24 function updatePaymentType(){\n\
  \   25   if(this.id == \"ppal\"){\n   26     $(\"#ccInfo\").hide();\n   27     $(\"\
