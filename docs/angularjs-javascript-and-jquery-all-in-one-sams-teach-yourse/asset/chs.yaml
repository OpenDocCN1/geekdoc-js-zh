  \n按照以下步骤构建一个应用程序，该程序利用元素上的`ngKeydown`和`ngKeyup`指令与页面元素进行交互：\n\n1. 添加`lesson24/directive_mouse_events.html`和`lesson24/js/directive_mouse_events.js`文件。\n\
  \n2. 将清单 24.13 和清单 24.14 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 清单 24.13 中的代码实现了一个控制器，该控制器将当前鼠标位置信息存储在`mouseInfo`中，将上次点击位置信息存储在`lastClickinfo`中。\n\
  \n4. 清单 24.13 中的以下代码行定义了`mouseClick()`事件处理函数。注意，事件信息被传递到处理函数中，使我们能够设置`lastClickInfo`中的`clientX`、`clientY`、`screenX`和`screenY`信息：\n\
  \n   点击此处查看代码图片\n\n   ```\n   05     $scope.mouseClick = function(event){\n   06\
  \       $scope.lastClickInfo.clientX = event.clientX;\n   07       $scope.lastClickInfo.clientY\
