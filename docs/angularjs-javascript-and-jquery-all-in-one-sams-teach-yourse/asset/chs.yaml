  \ 5 点到 6 点之间，你可以添加消息“该回家了”并带有一个家庭图标。你需要在 switch 语句中添加一些额外的 case，并相应地设置 `timeOfDay`\
  \ 值。\n\n## 第 6 课 理解并使用 JavaScript 对象\n\n本课你将学到：\n\n![Image](img/image00767.jpeg)\
  \ 如何访问 JavaScript 对象\n![Image](img/image00767.jpeg) 创建和操作字符串\n![Image](img/image00767.jpeg)\
  \ 对 JavaScript 数组进行排序\n![Image](img/image00767.jpeg) 搜索数组和字符串\n![Image](img/image00767.jpeg)\
  \ 如何创建自己的自定义对象\n\nJavaScript 中的大部分代码都围绕对象展开。对象是一种方便且简单的方式，可以将功能和数据分组在一起，用于各种目的。对象使您能够更轻松地编写清晰且易于实现的代码。\n\
  \n在 jQuery 和 JavaScript 中，你将使用四种主要类型的对象：DOM、内置、用户定义和 jQuery。你还将在 AngularJS 中使用这些类型的对象，以及\
  \ AngularJS 部分后续课程中描述的一些其他对象。\n\n以下部分定义了对象语法，带你了解最常见的内置对象，并向你展示如何创建自己的自定义对象。DOM\
  \ 对象和 jQuery 对象将在后续课程中介绍。\n\n* * *\n\n提示\n\n对于本课中的简单 JavaScript 示例，你可以通过在控制台提示符下使用\
  \ `node` 命令启动 Node.js 来调出 Node.js 解释器进行测试。在解释器中，你可以输入 JavaScript 代码，并在输入每一行时执行它。\n\
  \n* * *\n\n### 使用对象语法\n\n要有效地使用 JavaScript 中的对象，你需要了解它们的结构和语法。对象实际上是一个容器，用于将多个值以及在某些情况下的函数分组在一起。对象的值称为*属性*，函数称为*方法*。对象语法非常直接——你使用对象名称，然后是一个点，然后是属性或方法名称。\n\
  \n#### 创建新的对象实例\n\n要使用 JavaScript 对象，你必须首先创建该对象的一个实例。对象实例使用 `new` 关键字和对象构造函数名称创建。例如，要创建一个\
  \ `Number` 对象，你可以使用以下代码行：\n\n\n\n\n```\nvar x = new Number(\"5\");\n```\n\n####\
  \ 访问对象属性\n\n几乎所有 JavaScript 对象的值都可以通过标准的点号命名语法来访问。例如，考虑一个变量名为 `user` 的对象，它包含一个属性\
  \ `firstName`。以下语句访问了 user 对象的 `firstName` 属性的值：\n\n`user.FirstName`\n\n#### 访问对象方法\n\
  \n许多 JavaScript 对象也拥有方法。对象方法是一个作为名称附加到对象上的函数。可以通过使用点号语法引用方法名来调用该函数。例如，如果名为 `user`\
  \ 的对象有一个名为 `getFullName()` 的方法，那么可以通过以下语句调用该函数：\n\n`user.getFullName()`\n\n####\
  \ 为对象赋予新值和新方法\n\nJavaScript 中关于对象最酷的一点是，你可以随时使用点号语法为它们赋予新的属性和方法值。无论是内置对象还是你自己定义的自定义对象，都可以这样做。之后可以使用相同的点号语法访问该值。\n\
  \n以下是一个向主文档对象添加方法和属性的示例，该对象我们在多个示例中一直在使用。注意，我们定义了一个简单的函数，它将 `document.me` 属性写入浏览器。然后我们为\
  \ `document.me` 赋值，并将函数 `writeMe()`（不带 `()`）赋值为 `document.writeMe`。此时，我们可以调用 `document.writeMe`\
  \ 并访问属性 `document.me`：\n\n点击此处查看代码图片\n\n```\n<script>\n\n  function writeMe(){\n\
  \n    document.write(document.me);\n\n  }\n\n  document.me = \"Brad Dayley\";\n\n\
    document.writeMe = writeMe;\n\n  document.writeMe();\n\n</script>\n```\n\n* *\
  \ *\n\n警告\n\n如果你为对象赋予新值，同名的现有属性或方法将被覆盖。在为对象赋值时，请注意不要意外覆盖现有的属性或方法。\n\n* * *\n\n###\
  \ 理解内置对象\n\nJavaScript 有几个内置对象，它们提供了一组特定的功能。使用这些内置对象可以节省时间，因为它们提供了已经编码并测试过的方法来处理数据。以下部分并未涵盖所有\
  \ JavaScript 对象，但涵盖了本书所需的那些对象。\n\n#### Number\n\n`Number` 对象提供了处理数字时有用的功能。创建数字对象与仅仅为变量赋值一个数字不同。当你创建一个\
  \ `Number` 对象时，你还会获得一组可以与其一起使用的方法。\n\n`Number` 对象提供了表 6.1 中列出的方法。根据以下对象创建，查看表 6.1\
  \ 中每个方法的输出结果：\n\n点击此处查看代码图片\n\n```\nvar x = new Number(\"5.55555555\");\n```\n\n\
  ![Image](img/image00854.jpeg)\n\n**表 6.1 使用内置 Number 对象方法**\n\n我们选择将数字 `5.555555555`\
  \ 作为字符串而不是数字传入，以说明 `Number()` 可以接受字符串、数字或表示字符串或数字的变量。该字符串必须是数字字符串，否则 `Number` 对象的值将为\
  \ `NaN`（非数字）。\n\n在创建 Number 对象之前，最好先测试值。要测试一个值并确定它是否为数字，请使用 `isNaN()` 函数。如果该值是数字或可以成为数字的字符串，`isNaN()`\
  \ 返回 `false`。\n\n* * *\n\n注意\n\n检查数字时可以使用十六进制字符串。如果你在处理十六进制颜色值（例如 `#e0ffff`）时，这非常有用。在\
  \ JavaScript 中使用的字符串格式是 `\"0xe0ffff\"`。\n\n* * *\n\n#### String\n\n`String` 对象是\
  \ JavaScript 中最常用的对象。每当你定义一个具有字符串数据类型的变量时，JavaScript 会自动创建一个 `String` 对象。例如：\n\n\
  ```\nvar myStr = \"Teach Yourself jQuery & JavaScript in 24 Lessons\";\n```\n\n\
  当你创建字符串时，有些特殊字符不能直接添加到字符串中。对于这些字符，JavaScript 提供了一组转义码，如表 6.2 所述。\n\n![Image](img/image00855.jpeg)\n\
  \n**表 6.2 JavaScript 字符串中使用的转义码**\n\n要获取字符串的长度，可以使用 `String` 对象的 length 属性，例如：\n\
  \n```\nvar numOfChars = myStr.length;\n```\n\n`String` 对象有几个函数，允许你以各种方式访问和操作字符串。用于字符串操作的方法在表\
  \ 6.3 中描述。\n\n![Image](img/image00856.jpeg)![Image](img/image00857.jpeg)\n\n**表\
  \ 6.3 用于操作 JavaScript 字符串的 String 对象方法**\n\n为了帮助你开始使用 `String` 对象提供的功能，以下部分描述了可以使用\
  \ `String` 对象方法完成的一些常见任务。\n\n##### 合并字符串\n\n多个字符串可以通过使用 `+` 操作符或对第一个字符串使用 `concat()`\
  \ 函数来合并。例如，在以下代码中，`sentence1` 和 `sentence2` 将相同：\n\n点击此处查看代码图片\n\n```\nvar word1\
  \ = \"Today \";\nvar word2 = \"is \";\nvar word3 = \"tomorrows\\' \";\nvar word4\
  \ = \"yesterday.\";\nvar sentence1 = word1 + word2 + word3 + word4;\nvar sentence2\
  \ = word1.concat(word2, word3, word4);\n```\n\n##### 在字符串中搜索子字符串\n\n要判断一个字符串是否是另一个字符串的子字符串，可以使用\
  \ `indexOf()` 方法。例如，以下代码仅在字符串包含单词“think”时才将其写入浏览器：\n\n点击此处查看代码图片\n\n```\nvar myStr\
  \ = \"I think, therefore I am.\";\nif (myStr.indexOf(\"think\") != -1){\n  document.write(myStr);\n\
  }\n```\n\n##### 替换字符串中的单词\n\n另一个常见的 `String` 对象任务是用另一个子字符串替换一个子字符串。要替换字符串中的单词/短语，请使用\
  \ `replace()` 方法。以下代码将文本 `\"<username>\"` 替换为变量 username 的值：\n\n点击此处查看代码图片\n\n```\n\
  var username = \"Brad\";\nvar output = \"<username> please enter your password:\
  \ \";\noutput = output.replace(\"<username>\", username);\n```\n\n##### 将字符串拆分为数组\n\
  \n字符串的一个常见任务是使用分隔符将其拆分为数组。例如，以下代码使用 `split()` 方法在 `\":\"` 分隔符处将时间字符串拆分为其基本部分的数组：\n\
  \n```\nvar t = \"12:10:36\";\nvar tArr = t.split(\":\");\nvar lesson = tArr[0];\n\
  var minute = tArr[1];\nvar second = tArr[2];\n```\n\n* * *\n\n动手试一试：在 JavaScript\
