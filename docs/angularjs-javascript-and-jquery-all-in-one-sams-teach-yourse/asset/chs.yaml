  \n### 添加画布以实现动态设计\n\n`<canvas>` 元素还允许你动态地向网页添加和操作图像类图形。画布允许你通过 JavaScript 在浏览器屏幕的某个区域上绘制颜色、线条、文本和图像。\n\
  \n`<svg>` 元素与 `<canvas>` 元素的区别在于，图形并非以路径形式存储，而是以逐像素映射的方式存储，每个像素具有不同的颜色和不透明度。\n\n\
  使用 `<canvas>` 元素完成的大部分工作将在 jQuery 和 JavaScript 脚本中完成。在 HTML 中，你只需添加一个带有 `id` 属性的\
  \ canvas 元素，以便从脚本中访问它。为了理解 `<canvas>` 元素与 JavaScript 之间的关系，请参考清单 3.8 中的代码。\n\ncanvas\
  \ 元素仅定义了一个可供绘制的容器。所有工作都在 `<script>` 元素中完成。在脚本中，前两行获取 `myCanvas` 元素并获取一个 `2d` 上下文对象。上下文对象是提供在画布上绘制方法的图形对象。这段代码设置了将由\
  \ `stroke()` 调用渲染的线条宽度和颜色：\n\n```\n11       var c=document.getElementById(\"myCanvas\"\
  );\n12       var ctx=c.getContext(\"2d\");\n13       ctx.lineWidth=\"1\";\n14       ctx.strokeStyle=\"\
  blue\";\n```\n\n其余的 JavaScript 代码在画布上绘制了一个立方体的三个面。对于每个面，`beginPath()` 调用开始一条新路径。然后使用\
  \ `createLinearGradient()` 和 `addColorStop()` 创建渐变填充并设置上下文填充样式：\n\n```\n17       var\
  \ grd=ctx.createLinearGradient(100,50,100,5);\n18       grd.addColorStop(0,\"blue\"\
  );\n19       grd.addColorStop(1,\"white\");\n20       ctx.fillStyle=grd;\n```\n\n\
  接下来，要构建立方体的面，首先调用 `moveTo()` 移动到画布上的特定坐标，然后通过一系列 `lineTo()` 添加线条。此时，画布上仍未写入任何内容。要将像素写入画布，可以使用\
  \ `stroke()` 和/或 `fill()` 调用来绘制线条和填充颜色。结果如图 3.15 所示。\n\n![Image](img/image00821.jpeg)\n\
  \n**图 3.15** 使用 JavaScript 在画布上绘制像素。\n\n**清单 3.8 在 <canvas> 元素上绘制立方体的 JavaScript\
  \ 与 HTML 代码**\n\n```\n01 <html>\n02   <head>\n03     <title>HTML 5 Canvas</title>\n\
  04     <meta charset=\"UTF-8\" />\n05   </head>\n06   <body>\n07     <canvas id=\"\
  myCanvas\" width=\"300\" height=\"300\">\n08       抱歉，您的浏览器不支持 HTML5 Canvas\n09     </canvas>\n\
  10     <script>\n11       var c=document.getElementById(\"myCanvas\");\n12       var\
  \ ctx=c.getContext(\"2d\");\n13       ctx.lineWidth=\"1\";\n14       ctx.strokeStyle=\"\
  blue\";\n15       // 顶部\n16       ctx.beginPath();\n17       var grd=ctx.createLinearGradient(100,50,100,5);\n\
  18       grd.addColorStop(0,\"blue\");\n19       grd.addColorStop(1,\"white\");\n\
  20       ctx.fillStyle=grd;\n21       grd.addColorStop(0,\"blue\");\n22       ctx.moveTo(1,25);\n\
  23       ctx.lineTo(100,5);\n24       ctx.lineTo(200,25);\n25       ctx.lineTo(100,50);\n\
  26       ctx.fill();\n27       ctx.stroke();\n28       // 左侧\n29       ctx.beginPath();\n\
  30       var grd=ctx.createLinearGradient(75,100,60,25);\n31       grd.addColorStop(0,\"\
  red\");\n32       grd.addColorStop(1,\"white\");\n33       ctx.fillStyle=grd;\n\
  34       ctx.moveTo(1,25);\n35       ctx.lineTo(100,50);\n36       ctx.lineTo(100,165);\n\
  37       ctx.lineTo(1,125);\n38       ctx.lineTo(1,25);\n39       ctx.fill();\n\
  40       ctx.stroke();\n41       // 右侧\n42       ctx.beginPath();\n43       var\
  \ grd=ctx.createLinearGradient(200,50,125,175);\n44       grd.addColorStop(0,\"\
  yellow\");\n45       grd.addColorStop(1,\"white\");\n46       ctx.fillStyle=grd;\n\
  47       ctx.moveTo(100,50);\n48       ctx.lineTo(200,25);\n49       ctx.lineTo(200,125);\n\
  50       ctx.lineTo(100,165);\n51       ctx.fill();\n52       ctx.stroke();\n53     </script>\n\
  54   </body>\n55 </html>\n```\n\n本节仅浅尝辄止地介绍了 `<canvas>` 元素。如果你想了解更多关于 HTML5 中画布图形的知识，可以在这里找到一些不错的文档和示例：[www.w3schools.com/tags/ref_canvas.asp](http://www.w3schools.com/tags/ref_canvas.asp)。\n\
  \n#### 添加媒体元素\n\n你还应该了解的其他 HTML5 元素包括 `<video>` 和 `<audio>` 标签。这些标签允许你以音频和视频的形式向网页添加媒体元素。使用\
  \ jQuery 和 JavaScript，你可以引用这些元素并动态操作它们。这使你能够更改大小、在媒体加载完成时通知用户，或仅控制播放。\n\n\n\n\n\n\
  以下代码展示了 `<video>` 和 `<audio>` 标签的示例，图 3.16 和 3.17 展示了渲染后的组件：\n\n点击此处查看代码图片\n\n```html\n\
