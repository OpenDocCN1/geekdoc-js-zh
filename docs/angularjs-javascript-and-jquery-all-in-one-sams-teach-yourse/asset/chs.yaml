  \ float:left;\n13 }\n14 #container { width:610px; }\n```\n\n***\n\n### 创建调整大小动画\n\
  \n\n\n\n\n与使用 `height` 和 `width` 创建滑动效果类似，你也可以用它们来创建缩放动画。滑动与缩放的区别在于，缩放时保持图像的宽高比，使元素整体看起来在变大或缩小，而不是像展开或收拢那样。\n\
  \n创建缩放动画的技巧是：要么在 `.animate()` 语句中同时指定 `height` 和 `width`，要么在 CSS 设置中将其中一个设为 `auto`，然后只对另一个有具体值的属性进行动画。\n\
  \n例如，以下代码展示了一个图像在 1 秒内放大到 500 像素，然后在 5 秒内缓慢缩小回 400 像素的缩放动画：\n\n```\n$(\"img\").animate({height:500,\
  \ width:500}, 1000).animate({height:500, width:500},\n5000);\n```\n\n---\n\n## 动手实践：使用缩放动画创建简单的图片画廊视图\n\
  \n在本例中，你将创建一个简单的图片画廊视图，该视图在同一动画中缩放图像并改变透明度。练习的目的是让你有机会使用本节讨论的一些缩放技术。示例代码见清单 12.10、12.11\
  \ 和 12.12。\n\n按照以下步骤创建动态网页：\n\n1. 在 Eclipse 中创建 `lesson12/animated_resize.html`、`lesson12/js/animated_resize.js`\
  \ 和 `lesson12/css/animated_resize.css` 文件。\n\n2. 将清单 12.10 和清单 12.12 中的代码添加到 HTML\
  \ 和 CSS 文件中——只是一个包含 `<img>` 元素的基本 `<div>`。在 CSS 文件中，`<img>` 元素的样式宽度设置为 `100px`，但未设置高度。这样我们就可以在不使用\
  \ `height` 属性的情况下对尺寸进行动画。\n\n3. 现在打开 `animated_resize.js` 文件，添加一个基本的 `load()` 函数，该函数为\
  \ `<img>` 元素添加 `mouseover` 和 `mouseout` 处理程序。在 `mouseover` 时，通过增加 `width` 和 `opacity`\
  \ 来触发动画，在 `mouseout` 时则相反：\n\n   ```\n   $(window).load(function(){\n     $(\"img\"\
  ).mouseover(function(){\n         $(this).animate({width:\"200px\", opacity:1},\
  \ 1000);\n       });\n     $(\"img\").mouseout(function(){\n         $(this).animate({width:\"\
