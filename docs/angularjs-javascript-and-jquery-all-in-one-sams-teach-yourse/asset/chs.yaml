  mouseover\");` 等方法关闭鼠标悬停和鼠标移出事件处理程序。\n\n**3.** 打开清单 12.13、12.14 和 12.15 中的代码。修改代码，添加四个用于对角线移动的新按钮。你还需要为这些按钮添加处理程序，通过在同一动画中设置\
  \ top 和 left 属性来应用移动动画。\n\n## 第 13 课：在 jQuery 和 JavaScript 中与 Web 表单交互\n\n本课你将学到：\n\
  \n![Image](img/image00767.jpeg) 如何获取和设置表单元素的值\n\n![Image](img/image00767.jpeg) 动态构建表单元素\n\
  \n![Image](img/image00767.jpeg) 如何使用表单元素动画帮助用户导航表单\n\n![Image](img/image00767.jpeg)\
  \ 如何自动聚焦元素以方便用户\n\n![Image](img/image00767.jpeg) 创建一个基本的电子商务 Web 表单\n\n![Image](img/image00767.jpeg)\
  \ 验证 Web 表单的简单方法\n\nWeb 表单是动态 Web 编程中不可或缺的一部分。你可能只会在信用卡支付、在线注册等场景中想到表单；然而，任何时候你需要用户输入实际数据时，都会使用\
  \ Web 表单来收集数据输入。\n\nWeb 表单对用户来说可能是积极的体验，也可能是消极的体验。请思考一下。用户知道他们需要输入数据。如果因为表单笨重或难以理解而导致数据输入困难，他们会讨厌它，并产生糟糕的体验。如果表单优雅地引导他们快速高效地完成输入，那么他们会说：“哇！太简单了。”\n\
  \n那么，如何给用户带来良好的体验呢？\n\n**1.** 使用动态编程来访问他们正在输入的数据，以提供适合他们操作的动态工作流。\n\n**2.** 提供视觉效果，例如高亮或展开元素，帮助引导他们浏览页面。\n\
  \n**3.** 提供内联验证，让他们在开始出错时尽快知道。\n\n接下来的章节将逐一介绍这些概念。学完这些内容后，你将能够实现一些出色的 Web 表单。\n\n\
  ***\n\n注意\n\njQuery 和 JavaScript 在处理 Web 表单时提供了许多强大的功能。AngularJS 在 JavaScript 和\
  \ jQuery 的基础上增加了将 Web 表单元素绑定到网页数据模型中值的能力。你将在 AngularJS 课程部分了解更多相关内容。\n\n***\n\n\
  ### 访问表单元素\n\n与 Web 表单交互最重要的部分是能够访问它们所代表的数据。访问表单数据允许你获取和设置值、更改选择，以及序列化数据以供其他方式使用。\n\
  \n表单元素有多种类型。不幸的是，没有一种单一的标准方法来获取和设置元素所代表的值。以下各节描述了访问每种类型表单元素中数据的方法。\n\n#### 获取和设置表单元素的值\n\
  \n获取表单元素所代表的值取决于表单元素的类型。例如，文本元素代表其中的文本，而选择元素代表所选元素的值。\n\n在以下各节中，表单元素根据获取表单值的方法被分为几组。例如，所有文本元素无论类型如何，都以相同的方式访问。\n\
  \n##### 访问表单元素属性\n\n不同的元素有许多相同的属性，也有一些特定于元素类型的属性。在实现动态代码时，你需要访问以下几个属性：\n\n![Image](img/image00767.jpeg)\
  \ `id`——用于查询和标识表单元素。\n\n![Image](img/image00767.jpeg) `name`——有多种用途。对于单选输入，此属性用于将元素分组，以便一次只能选择一个。对于表单的序列化和提交，`name`\
  \ 属性用作元素值的名称。\n\n![Image](img/image00767.jpeg) `type`——用于标识 `<input>` 元素的类型。\n\n\
  ![Image](img/image00767.jpeg) `value`——存储与元素关联的值。对于文本元素，该值显示在文本框中；对于按钮，它是按钮中的字符串；对于\
  \ `<option>` 元素，它是与选项关联的值。\n\n![Image](img/image00767.jpeg) `checked`——用于访问单选或复选框\
  \ `<input>` 元素的选择状态。\n\n这些属性可以在 JavaScript 中通过属性名直接访问。例如，要获取和设置 value 属性，你可以使用以下代码：\n\
  \n```\ndomObj.value = \"新文本\";\nvar newValue = domObj.value;\n```\n\n在 jQuery 中，有三种方法可以获取表单对象的属性和特性：`.attr()`、`.prop()`\
  \ 和 `.val()` 方法。`.attr()` 方法用于访问与 HTML 属性（如 `id`、`name` 和 `type`）对应的 DOM 对象属性，而\
  \ `.prop()` 方法用于访问更偏向 JavaScript 的 DOM 对象属性，例如 `<select>` 元素的 `selectedIndex`。\n\
  \n***\n\n警告\n\n`.attr()`、`.prop()` 和 `.val()` 方法仅获取匹配的 jQuery 集合中第一个元素的值。如果你处理的是集合中的多个元素，可能需要使用\
  \ `.map()` 或 `.each()` 方法来获取所有元素的值。\n\n***\n\njQuery 提供了 `.val()` 方法来访问表单元素所代表的值。在\
  \ jQuery 中，可以使用 jQuery 对象的 `.val()` 方法访问该值。例如，以下语句设置所有 `type=\"text\"` 的 `<input>`\
  \ 元素的值，然后获取第一个元素的值：\n\n点击此处查看代码图片\n\n```\n$(\"input:text\").val(\"新文本\");\nvar newValue\
  \ = $(\"input:text\").val();\n```\n\n##### 访问文本输入元素\n\n最常见的表单元素类型是文本输入。这些元素包括 `<textarea>`\
  \ 元素以及具有以下 `type` 属性值的 `<input>` 元素：`color`、`date`、`datetime`、`datetime-local`、`email`、`month`、`number`、`password`、`range`、`search`、`tel`、`text`、`time`、`url`\
  \ 和 `week`。\n\n尽管这些元素在使用上略有不同，但它们都呈现相同的基本文本框，并且以相同的基本方式访问。每个元素都有一个 value 属性，可以在\
  \ HTML 中设置，该值将在渲染图像时显示在文本框中。例如，以下代码展示了一个带有初始值的文本表单元素的基本示例，如图 13.1 所示：\n\n点击此处查看代码图片\n\
  \n```\n<input type=\"text\" value=\"初始文本\"/>\n```\n\n![Image](img/image00917.jpeg)\n\
  \n**图 13.1** 一个带有初始值的简单文本输入。\n\n该值可以通过 JavaScript 直接访问 value 属性来获取。例如，以下代码设置文本输入元素的值，然后获取该值：\n\
  \n点击此处查看代码图片\n\n```\ntextDomObj.value = \"新文本\";\nvar newValue = textDomObj.value;\n\
  ```\n\n在 jQuery 中，可以使用 jQuery 对象的 `.val()` 方法访问该值。例如，以下语句设置所有 `type=\"text\"` 的\
  \ `<input>` 元素的值，然后获取第一个元素的值：\n\n点击此处查看代码图片\n\n```\n$(\"input:text\").val(\"新文本\"\
  );\nvar newValue = $(\"input:text\").val();\n```\n\n##### 访问复选框输入\n\n\n\n\n\n复选框输入元素根据元素是否被选中而具有布尔值。通过获取\
  \ `checked` 属性的值来访问该值。如果元素被选中，则 `checked` 的值为 `true` 或 `\"checked\"`；否则，值为 `undefined`\
  \ 或 `false`。\n\n你可以通过以下方式在 JavaScript 中获取和设置复选框元素的状态：\n\n```\ndomObj.checked = true;\n\
  domObj.checked = false;\nvar state = domObj.checked;\n```\n\n使用 jQuery 判断某个项是否被选中时，情况略有不同。请记住，在\
  \ jQuery 中你可能同时处理多个复选框，因此判断 jQuery 对象所代表的对象是否被选中的最安全方法是使用 `.is()` 方法。例如：\n\n```\n\
  jObj.is(\":checked\");\n```\n\n要将表示复选框的 jQuery 对象的状态设置为选中，可以按如下方式设置 `checked` 属性：\n\
  \n```\njObj.prop(\"checked\", true);\n```\n\n要将表示复选框的 jQuery 对象的状态设置为未选中，方法类似。你需要使用\
  \ `prop()` 移除 `checked` 属性，并将其值设置为 `false`。例如：\n\n点击此处查看代码图片\n\n```\njObj.prop(\"\
  checked\", false);\n```\n\n##### 访问单选输入\n\n单个单选输入的工作方式与复选框相同。你可以用同样的方式访问 `checked`\
  \ 状态。\n\n然而，单选输入几乎总是以组的形式使用。单选输入组所代表的值不是布尔值，而是当前选中元素的 `value` 属性。\n\n在提交表单或序列化表单数据时，单选输入组的值会自动填充。要在代码中获取单选输入组的值，你需要先访问组中的所有元素，找出哪个被选中，然后从该对象中获取\
  \ `value` 属性。以下代码将在 jQuery 中获取按 `name=\"myGroup\"` 分组的单选输入组的值：\n\n点击此处查看代码图片\n\n\
  ```\nvar groupValue = $(\"input[name=myGroup]\").filter(\":checked\").val();\n```\n\
  \n该代码首先查找 `name=\"myGroup\"` 的 `<input>` 元素，然后过滤出被选中的元素，最后返回其值。\n\n##### 访问选择输入\n\
  \n选择输入实际上是包含一系列 `<option>` 元素的容器输入。选择元素的值是当前选中选项的值（或多个值）。同样，jQuery 和 JavaScript\
  \ 中的提交和序列化会自动处理这一点。然而，手动操作则需要一些代码。\n\n* * *\n\n注意\n\n如果你没有为 `<option>` 元素指定 `value`\
  \ 属性，则返回的值将是 `innerHTML` 的值。例如，以下选项的值为 `\"one\"`：`<option>one</option>`\n\n* * *\n\
  \n在访问 `<select>` 元素时，你可能需要获取几个值。其中之一是元素所代表的完整值。在 jQuery 中使用 `.val()` 方法获取该值非常简单。例如，考虑以下代码：\n\
  \nHTML：\n\n点击此处查看代码图片\n\n```\n<select id=\"mySelect\">\n  <option value=\"one\"\
  >One</option>\n  <option value=\"two\">Two</option>\n  <option value=\"three\">Three</option>\n\
  </select>\n```\n\njQuery：\n\n```\n$(\"#mySelect\").val();\n```\n\n如果选中第一个选项，jQuery\
  \ 语句返回的值如下：\n\n```\n\"one\"\n```\n\n对于多选选择框，`.val()` 方法返回一个值数组，而不是单个值。例如，在多选选择框中，如果选中第一个选项，jQuery\
  \ 语句返回的值如下：\n\n```\n[\"one\"]\n```\n\n在多选选择框中，如果选中前三个选项，jQuery 语句返回的值如下：\n\n```\n\
  [\"one\", \"two\", \"three\"]\n```\n\n你也可以使用 `.val()` 方法来设置选中的元素。例如，以下语句从列表中选择第二个元素：\n\
  \n```\n[\"one\", \"two\", \"three\"]\n$(\"#mySelect\").val(\"two\");\n```\n\n以下语句在多选选择框中选择第二个和第三个选项：\n\
  \n点击此处查看代码图片\n\n```\n[\"one\", \"two\", \"three\"]\n$(\"#mySelect\").val([\"two\"\
  , \"three\"]);\n```\n\n##### 访问按钮输入\n\n大多数情况下，你不需要访问按钮数据，可能除了 `value` 属性（它定义了按钮上显示的文本）之外。添加/移除事件处理程序和\
  \ CSS 属性与其他 HTML 元素相同。\n\n##### 访问文件输入\n\n文件输入是一种有趣且不同的表单元素类型。它同时提供了一个按钮和一个文本框。按钮链接到操作系统的文件浏览器，文本框显示需要上传到\
  \ Web 服务器的文件路径。\n\n文件输入的 `value` 属性将是文件的名称，因此你可以直接从 JavaScript 或使用 jQuery 的 `.val()`\
  \ 方法访问它。\n\n在 Chrome 和 Firefox 中，DOM 对象还提供了一个 `files` 属性，它是一个文件对象数组，表示此元素选中的文件。你可以使用以下代码从\
  \ JavaScript 访问用户选中的文件：\n\nHTML：\n\n点击此处查看代码图片\n\n```\n<input id=fileSelect type=\"\
  file\" />\n```\n\nJavaScript：\n\n点击此处查看代码图片\n\n```\nvar fileSelector = document.getElementById(\"\
  fileSelect\");\nvar fileList = fileSelector.files;\nfor (var i in fileList){\n \
  \ var fileObj = fileList[i];\n  var fileName = fileObj.name;\n  var filePath = fileObj.mozFullPath;\n\
  \  var fileSize = fileObj.size;\n  var fileType = fileObj.type;\n}\n```\n\n* * *\n\
  \n警告\n\n操作文件输入时必须小心，因为这似乎是恶意行为的一个敏感点。如果 Internet Explorer 检测到文件对象被篡改，它将导致页面上的提交事件失败。此外，许多浏览器具有安全设置，会阻止脚本获取部分或全部文件信息。\n\
  \n* * *\n\n每个文件对象包含几个在动态编程中有用的属性。表 13.1 列出了一些最常用的属性。\n\n![图片](img/image00918.jpeg)\n\
  \n**表 13.1 DOM 文件对象的属性**\n\n##### 访问隐藏输入\n\n如果你需要从表单向浏览器提供额外信息，隐藏输入是一个很好的 HTML 元素。隐藏输入不会在表单中显示，但它可以包含一个\
  \ `name` 和 `value` 对，这些值会被提交，或者只是你想存储在表单中并在动态操作期间访问的值。\n\n随表单一起发送的部分是 `name` 和 `value`\
  \ 属性。但是，你可以使用 `.data(key [,value])` 方法向隐藏表单对象或任何 jQuery 中的 HTML DOM 对象附加额外的值。该方法的工作方式类似于\
  \ `.attr()` 和 `.prop()`：如果你想获取值，则传入一个键；如果你想设置值，则传入一个键和一个值。例如，以下代码定义了一个简单的隐藏元素，然后使用\
  \ jQuery 分配提交值以及一个扩展属性：\n\nHTML：\n\n点击此处查看代码图片\n\n```\n<input id=\"invisibleMan\"\
  \ name=\"InvisibleMan\" type=\"hidden\" />\n```\n\njQuery：\n\n点击此处查看代码图片\n\n```\n\
  $(\"#invisibleMan\").val(\"alive\");\n$(\"#invisibleMan\").data(\"hairColor\", \"\
  clear\");\nvar state $(\"#invisibleMan\").val();\nvar state $(\"#invisibleMan\"\
  ).data(\"hairColor\");\n```\n\n#### 序列化表单数据\n\n表单中的许多输入元素可以轻松序列化为字符串或数组。序列化表单数据使得在存储、发送到服务器或根据表单事件动态调整时更容易处理。\n\
  \n\n\n\n要使表单能够序列化，它需要两样东西：一个`name`属性和一个可以赋给该名称的`value`属性。表 13.2 描述了不同类型属性的不同值来源。\n\
  \n![图片](img/image00919.jpeg)\n\n**表 13.2 DOM 文件对象的属性**\n\n##### 将表单转换为查询字符串\n\n\
  最常见的序列化任务之一是将表单数据转换为序列化数组。jQuery 通过`.serialize()`方法让这变得轻而易举。`.serialize()`方法将访问表单，并将名称/值对转换为\
  \ URL 编码的字符串，以便在网络上传输。\n\n例如，查看以下代码，它创建了一个表单，然后根据图 13.2 中设置的值对其进行序列化：\n\nHTML:\n\
  \n```\n<form id=\"simpleForm\">\n\n  <input name=\"title\" type=\"text\" /><br>\n\
  \n  <select name=\"mySelection\" multiple size=3 id=\"mySelect\">\n\n    <option\
  \ value=\"one\">One</option>\n\n    <option value=\"two\">Two</option>\n\n    <option\
  \ value=\"three\">Three</option>\n\n  </select><br>\n\n  <input type=\"radio\" name=\"\
  gender\" value=\"male\">Male</input>\n\n  <input type=\"radio\" name=\"gender\"\
  \ value=\"female\">Female</input><br>\n\n</form>\n```\n\n![图片](img/image00920.jpeg)\n\
  \n**图 13.2** 包含`text`、`select`和`radio`输入框的简单表单。\n\njQuery:\n\n```\nvar qString =\
  \ $(\"#simpleForm\").serialize();\n```\n\n`qString`的值：\n\n```\ntitle=Lumber+Jack&mySelection=one&mySelection=two&gender=male\n\
  ```\n\n##### 将表单转换为 JavaScript 对象\n\n另一个非常有用的序列化技术是将表单数据转换为一个可以访问的 JavaScript 对象。jQuery\
  \ 的`.serializeArray()`方法正是这样做的。所有名称/值对被转换为一个可以通过代码访问的数组。\n\n例如，考虑以下在图 13.2 所示的同一表单上运行的\
  \ jQuery 语句：\n\n```\nvar formArr = $(\"#simpleForm\").serializeArray();\n```\n\n\
  `formArr`的结果值如下：\n\n```\n{0: {\"name\":\"title\", \"value\":\"Lumber Jack\"},\n\
    1: {\"name\":\"mySelection\", \"value\":\"one\"},\n  2: {\"name\":\"mySelection\"\
  , \"value\":\"two\"},\n  3: {\"name\":\"gender\", \"value\":\"male\"}};\n```\n\n\
  ---\n\n## 自己动手：访问和操作表单元素数据\n\n现在你已经有机会回顾了访问和交互表单数据的方法，是时候亲自动手了。在本练习中，你将创建两个表单，一个用于获取数据，另一个用于设置数据。结果将是，当你更新一个表单时，另一个也会随之更新。\n\
  \n本练习的目的是让你有机会以多种方式获取和设置表单元素的值。示例代码位于清单 13.1、13.2 和 13.3 中。\n\n使用以下步骤创建动态网页：\n\n\
  1. 在 Eclipse 中，创建`lesson13`、`lesson13/js`和`lesson13/css`文件夹，然后添加`lesson13/form_manipulation.html`、`lesson13/js/form_manipulation.js`和`lesson13/css/form_manipulation.css`文件。\n\
  \n2. 将清单 13.1 和清单 13.3 中显示的代码添加到 HTML 和 CSS 文件中。有很多 HTML 代码，但都只是定义表单元素。注意有两个表单：`formA`和`formB`。\n\
  \n3. 打开`form_manipulation.js`文件，并添加一个基本的`.ready()`函数，你将在其中添加代码行来实现事件处理程序，以根据`formA`的数据更新`formB`。\n\
  \n4. 添加以下行，将`keyup`处理程序附加到文本输入框，以便当它在`formA`中更改时，`formB`中的值也会更改。值通过`.val()`方法获取和设置：\n\
  \n```\n02   $(\"#formA input:text\").keyup(function(){\n03     $(\"#formB input:text\"\
  ).val($(this).val());});\n```\n\n5. 添加以下行，将`keyup`处理程序附加到文本和`<textarea>`输入框，以便当它们在`formA`中更改时，`formB`中的值也会更改。值通过`.val()`方法获取和设置：\n\
  \n```\n04   $(\"#formA textarea\").keyup(function(){\n05     $(\"#formB textarea\"\
  ).val($(this).val());});\n```\n\n6. 添加以下行，将`change`处理程序附加到单选按钮输入组。注意，要获取另一个表单中的相同单选按钮输入元素，你需要使用`$(\"\
  #formB input[value=\" + $(this).val() + \"]\");`获取具有相同值的输入元素。值通过`.prop()`设置：\n\n\
  ```\n06   $(\"#formA input:radio\").change(function(){\n07       var radioB = $(\"\
  #formB input[value=\" +\n08           $(this).val() + \"]\");\n09       radioB.prop(\"\
  checked\", $(this).is(\":checked\"));\n10     });\n```\n\n7. 添加以下行，将`click`处理程序附加到`formA`中的复选框，并在点击时使用`.prop()`方法选中`formB`中的相同复选框：\n\
  \n```\n11   $(\"#formA input:checkbox\").click(function(){\n12       $(\"#formB\
  \ input:checkbox\").prop(\"checked\",\n13           $(this).prop(\"checked\"));\n\
  14     });\n```\n\n8. 添加以下行，将`click`处理程序附加到`formA`中的选择框，以便当选择改变时，可以调用`.val()`从`formA`获取值并设置`formB`：\n\
  \n```\n15   $(\"#formA select\").change(function(){\n16     $(\"#formB select\"\
  ).val($(this).val());});\n```\n\n9. 添加以下行，将`click`处理程序附加到图像输入框，以便当它被点击时，`formB`中图像输入框的`src`属性将更改为匹配：\n\
  \n```\n20   $(\"#formA input:image\").click(function(e){\n21       $(\"#formB input:image\"\
  ).attr(\"src\", $(this).attr(\"src\"));\n22       e.preventDefault();\n23     });\n\
  ```\n\n10. 添加以下用于重置按钮的点击处理程序。该处理程序通过使用`$(\"#formB\").get(0)`获取`formB` DOM 元素，然后调用`.reset()`函数。接着，它从所有已选中的元素中移除`check`属性，并重置图像元素的`src`属性：\n\
  \n```\n24   $(\"#resetB\").click(function(){\n25       $(\"#formB\").get(0).reset();\n\
  26       $(\"#formB input:checked\").prop(\"checked\", false);\n27       $(\"#formB\
  \ input:image\").attr(\"src\", \"\");\n28     });\n```\n\n11. 添加以下用于序列化按钮的点击处理程序。该处理程序首先在表单上调用`.serialize()`，并将字符串写入到`serialized`段落元素中。然后，它通过调用`.serializeArray()`获取一个序列化数组。使用`jQuery.each()`方法遍历该数组，并将包含名称和值对的新段落追加到`serializedA`段落中：\n\
  \n```\n29   $(\"#serializeB\").click(function(e){\n30       $(\"#serialized\").html($(\"\
  #formA\").serialize());\n31       $(\"#serializedA\").empty();\n32       var arr\
  \ = $(\"#formA\").serializeArray();\n33       jQuery.each(arr, function(i, prop){\n\
  34         $(\"#serializedA\").append($(\"<p>\" + prop.name + \" = \" +\n35    \
  \                                 prop.value + \"</p>\"));\n36       });\n37   \
  \  });\n```\n\n\n\n\n**12.** 保存所有三个文件，然后在网页浏览器中打开 HTML 文档，如图 13.3 所示。你应该能够更改左侧表单中的元素，并看到右侧表单中的元素也随之变化。当你点击“序列化”按钮时，底部的两个\
  \ `<div>` 元素应填充来自 `formA` 的序列化数据。\n\n![图片](img/image00921.jpeg)\n\n**图 13.3** 表单到表单的操作演示，展示了如何读写表单数据以及序列化表单值。\n\
