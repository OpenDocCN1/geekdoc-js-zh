  4   color:#00FF00;\n5   font:30px arial;\n6   padding:5px;\n7   border:5px groove;\n\
  8 }\n```\n\n* * *\n\n* * *\n\n### 总结\n\n本课重点介绍了如何使用 JavaScript 对象访问网页外部的数据。你了解到有\
  \ `screen`、`window`、`browser`、`location` 和 `history` 对象，它们提供了关于物理屏幕、浏览器和客户端历史记录的众多详细信息，以及访问\
  \ cookie 的方法。\n\n你学习了如何打开和关闭浏览器窗口。通过 JavaScript，你还学会了如何创建基本的弹出窗口，以便与用户进行交互。\n\n\
  ### 问答\n\n**Q. 有没有办法找出正在使用的操作系统和浏览器？**\n\n**A.** 有的。`navigator` 对象会通过 `window.navigator.appCodeName`\
  \ 属性显示浏览器。你也可以使用 `window.navigator.platform` 获取操作系统。\n\n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\
  \n#### 小测验\n\n**1.** JavaScript 支持哪三种类型的弹出框？\n\n**2.** 如何使用 JavaScript 找到用于加载网页的完整\
  \ URL？\n\n**3.** 判断正误：你可以向后浏览浏览器历史记录，但不能向前浏览。\n\n#### 小测验答案\n\n**1.** 警告框、确认框和提示框。\n\
  \n**2.** 访问 `location.href` 属性。\n\n**3.** 错误。你可以使用 `history.forward()` 或 `history.go(n)`\
  \ 向前浏览。\n\n#### 练习\n\n**1.** 打开清单 11.1、11.2 和 11.3 中的代码，修改 `ready()` 函数以获取名为 `buttonColor`\
  \ 的 cookie。如果设置了 `buttonColor` cookie，请使用以下 jQuery 代码更改按钮的颜色：\n\n点击此处查看代码图片\n\n\
  ```\n$(\"span\").css(\"color\", getCookie(\"buttonColor\"));\n```\n\n**2.** 打开清单\
  \ 11.4、11.5 和 11.6 中的代码，修改提示框，要求用户输入下次通知前的秒数。如果用户输入 0，则终止通知。否则，在 `setTimeout()`\
  \ 调用中使用该值。请记住，你需要将秒数乘以 1000 才能得到毫秒数。\n\n# 第三部分：使用 jQuery 构建丰富交互的网页\n\n## 第 12 课\
  \ 通过 jQuery 动画和其他特效增强用户交互\n\n本课你将学到：\n\n![Image](img/image00767.jpeg) 理解动画基础\n\n\
  ![Image](img/image00767.jpeg) 创建滑动元素\n\n![Image](img/image00767.jpeg) 使用简单的缩放和透明度动画创建图片画廊\n\
  \n![Image](img/image00767.jpeg) 实现可展开和可折叠的元素\n\n![Image](img/image00767.jpeg) 如何延迟动画以获得更好的效果\n\
  \n![Image](img/image00767.jpeg) 如何为动态 Web 应用实现元素移动动画\n\njQuery 最重要的特性之一就是能够为元素的变化添加动画效果。这给用户带来了流畅、开发完善的应用程序的感觉，而不是笨拙的传统网页。\n\
  \n特别是当你移动、调整大小或动态添加元素到网页时，这一点尤为明显。作为用户，突然看到一堆新东西出现或消失会非常令人沮丧。使用动画进行过渡可以让用户看到元素离开或来自何处，并调整心态以接受这些变化。\n\
  \n本课旨在帮助你理解动画的基础知识。然后你将有机会在一系列实际示例中应用这些新技能。\n\n### 理解 jQuery 动画\n\njQuery 动画是将 HTML\
  \ 元素的属性从一个值逐步修改到另一个值的过程，并且这个过程对用户是可见的。本节将描述该过程以及如何在 CSS 属性上实现动画。\n\n#### 动画化 CSS\
  \ 设置\n\njQuery 中的大多数动画都是通过 `.animate()` 方法完成的。`.animate()` jQuery 方法允许你对一个或多个 CSS\
  \ 属性实现动画。请记住，`.animate()` 方法会同时作用于 jQuery 对象集合中的所有元素。通常你可能只想作用于单个元素，因此需要将集合过滤为一个。\n\
  \n`.animate()` 方法接受一个 CSS 属性对象映射作为第一个参数。你可以在对象中指定多个属性，以同时动画化多个属性。例如，以下代码对 `<img>`\
  \ 元素的 `height` 和 `width` 属性进行动画：\n\n点击此处查看代码图片\n\n```\n$(\"img\").animate({height:100,\
  \ width:100});\n```\n\n* * *\n\n注意\n\n`.animate()` 方法只能动画化具有数值的属性。例如，你不能动画化边框样式，但可以动画化边框大小。\n\
  \n* * *\n\n调用 animate 方法有两种方式。以下展示了两种语法：\n\n点击此处查看代码图片\n\n```\n.animate(properties\
  \ [, duration] [, easing] [, complete])\n.animate(properties, options)\n```\n\n\
  第一种方法允许你将 `duration`、`easing` 和 `complete` 函数作为可选参数指定。第二种方法允许你将选项指定为单个选项映射对象。例如，以下调用\
  \ `.animate()` 并带有 `duration` 和 `easing` 对象映射：\n\n点击此处查看代码图片\n\n```\n$(\"img\").animate({height:100,\
  \ width:100}, {duration:1000, easing:\"linear\"});\n```\n\n* * *\n\n提示\n\n你不能使用颜色名称来动画化颜色变化；但你可以使用十六进制值（例如\
  \ `#ff0000`）来动画化颜色变化。\n\n* * *\n\n表 12.1 描述了 `.animate()` 方法可用的不同选项。这些选项也适用于本课后面讨论的其他一些动画方法。\n\
  \n![Image](img/image00911.jpeg)\n\n**表 12.1 动画选项**\n\n#### 理解动画队列\n\n动画与代码执行是异步发生的，这意味着在动画进行时，代码会继续执行。如果在第一个动画完成之前为对象指定了另一个动画，会发生什么？答案是\
  \ jQuery 会将动画排队，然后按顺序一个接一个地执行，直到所有动画完成；除非你在动画选项中指定了 `queue:false`。\n\n你必须理解动画队列，因为如果你允许用户交互通过移动鼠标或点击来排队太多动画，动画将会变得迟缓并落后于用户的操作。\n\
  \n* * *\n\n警告\n\n\n\n\n你必须注意动画的触发位置。请记住，事件会向上冒泡。如果在冒泡阶段从所有层级执行相同的动画，可能会导致一些非常不理想的结果。为了防止这种情况，你可以使用\
  \ `stopPropagation()` 和 `stopImmediatePropagation()` 方法。\n\n---\n\n### 停止动画\n\n\
  jQuery 允许你停止当前在 jQuery 对象集合中的元素上执行的动画。`.stop([clearQueue] [, jumpToEnd])` 方法提供了几种停止动画的方式。\n\
  \n不带参数调用 `.stop()` 会暂停队列中的动画。下一个启动的动画将重新开始执行队列中的动画。例如，以下代码暂停所有动画：\n\n```\n$(\"*\"\
  ).stop();\n```\n\n调用 `.stop(true)`，并将 `cleareQueue` 选项设置为 `true`，会在当前点停止动画，并从队列中移除所有动画。例如，以下代码停止图片上的所有动画，并从队列中移除这些动画：\n\
  \n```\n$(\"img\").stop(true);\n```\n\n调用 `.stop(true, true)`，并将 `jumpToEnd` 选项设置为\
  \ `true`，会使当前正在执行的动画立即跳转到结束值，清除队列，然后停止所有动画。例如，以下代码停止图片上的所有动画，但先完成当前动画的调整，然后从队列中移除这些动画：\n\
  \n```\n$(\"img\").stop(true, true);\n```\n\n`.stop()` 方法返回 jQuery 对象，因此你可以在其后链式调用其他方法。例如，以下代码停止图片上的所有动画，然后启动一个新动画将\
  \ `opacity` 设置为 `.5`：\n\n```\n$(\"img\").stop(true, true).animate({opacity:.5},\
  \ 1000);\n```\n\n### 延迟动画\n\n实现动画时一个很好的选项是在动画添加到队列之前添加延迟。这可以用于以更高级的方式提供动画，因为你延迟了动画队列的执行，从而让用户获得更好的视觉体验。\n\
  \n`.delay(duration [, queueName])` 方法允许你以毫秒为单位指定延迟 `duration`，以及可选的 `queueName`\
  \ 来指定将延迟应用于哪个队列。例如，以下代码为图片添加一个尺寸动画；然后在尺寸动画完成后，延迟 2 秒，再让 `opacity` 动画到 `1`：\n\n```\n\
  $(\"img\").animate({width:500}, 1000).delay(2000).animate({opacity:1}, 1000);\n\
  ```\n\n---\n\n注意\n\n`.delay()` 方法非常适合在队列的 jQuery 效果之间添加延迟；但它不能替代 JavaScript 的 `setTimeout()`\
  \ 函数，后者在某些用例中可能更合适——尤其是那些需要取消延迟的情况。\n\n---\n\n### 将 .promise() 应用于动画\n\n`.promise([type]\
  \ [, target])` 方法允许你在绑定到 jQuery 对象集合的所有操作完成后应用功能。它通过返回一个新对象来实现这一点，该对象会观察这些操作，并在操作完成之前不执行任何附加的方法。\n\
  \n`.promise()` 返回一个类似于延迟对象（deferred object）的对象。它有一个 `.done()` 方法，允许你传入一个函数，该函数会在\
  \ `.promise()` 功能执行完毕后运行。\n\n例如，以下代码等待动画完成，然后将文本更改为“complete”：\n\n```\n$(\"span\"\
  ).animate({opacity:0}, 30000).promise().done(function(){\n    $(\"p\").html(\"complete\"\
  );\n});\n```\n\n`.promise()` 方法接受两个可选参数。第一个是 `type`，指定操作的类型。默认类型是 `fx`，适用于动画；因此对于动画，你不需要指定类型。第二个参数是\
  \ `target`，指定一个可选的 jQuery 对象作为返回目标，而不是创建一个新对象。\n\n## 动画显示和隐藏\n\n你已经在第 9 课中看到了 `.show()`\
  \ 和 `.hide()` 方法的实际应用。为这些功能添加动画效果是很常见的做法，因此 jQuery 为这些方法提供了动画选项，让你的工作更轻松。\n\n###\
  \ 动画隐藏 hide()\n\n`.hide([duration] [, easing] [, callback])` 方法提供了可选的 `duration`、`easing`\
  \ 和 `callback` 选项，允许你为隐藏效果添加动画，使元素消失时不会显得突兀。\n\n例如，以下代码应用了 1 秒的动画，使用 `linear` 缓动，并在隐藏元素时执行一个简单的回调函数：\n\
  \n```\n$(\"#box\").hide(1000, \"linear\", function() { $(\"#label\").html(\"Hidden!\"\
  ) });\n```\n\n### 动画显示 show()\n\n`.show([duration] [, easing] [, callback])` 方法提供了可选的\
  \ `duration`、`easing` 和 `callback` 选项，允许你为显示效果添加动画，使元素出现时过渡更平滑。\n\n例如，以下代码应用了 1\
  \ 秒的动画，使用 `linear` 缓动，并在显示元素时执行一个简单的回调函数：\n\n```\n$(\"#box\").show(1000, \"linear\"\
  , function() { $(\"#label\").html(\"Shown!\") });\n```\n\n### 动画切换 toggle()\n\n\
  `.toggle([duration] [, easing] [, callback])` 方法提供了可选的 `duration`、`easing` 和 `callback`\
  \ 选项，允许你在显示和隐藏效果之间切换时添加动画。\n\n例如，以下代码应用了 1 秒的动画，使用 `linear` 缓动，并在元素在隐藏或显示之间切换时执行一个简单的回调函数：\n\
  \n```\n$(\"#switch\").toggle(1000, \"linear\", function() { $(\"#label\").html(\"\
  Switch Toggled!\") });\n```\n\n---\n\n### 动手试一试：使用显示和隐藏动画创建展开/折叠元素\n\n在本例中，你将创建一个简单的网页元素，它提供一个标题栏，左侧有折叠和展开按钮，允许你展开和折叠一张图片。本练习的目的是让你有机会使用显示和隐藏动画。示例代码见清单\
  \ 12.1、12.2 和 12.3。\n\n按照以下步骤创建动态网页：\n\n1. 在 Eclipse 中，创建 `lesson12`、`lesson12/js`\
  \ 和 `lesson12/css` 文件夹，然后添加 `lesson12/image_hide.html`、`lesson12/js/image_hide.js`\
  \ 和 `lesson12/css/image_hide.css` 文件。\n\n---\n\n注意\n\n本课的练习中，你需要使用自己的图片，或者从本书网站获取图片。\n\
  \n---\n\n2. 将清单 12.1 和清单 12.3 中的代码添加到 HTML 和 CSS 文件中。这些只是基本内容——一个包含 `<span>`（用作手柄）的\
  \ `<div>`、一个 `<img>` 和一个页脚 `<div>`。\n\n3. 打开 `image_hide.js` 文件，添加以下 `load()` 函数，该函数为\
  \ `#handle` 元素添加点击处理程序：\n\n```\n01 $(window).load(function(){\n02   $(\"#handle\"\
  ).click(toggleImage);\n03 });\n```\n\n4. 添加以下处理程序来切换图片的可见性。`if` 语句检查 `#handle` 中的文本，然后调用\
  \ `show()` 显示图片或调用 `hide()` 隐藏图片。注意，在 `show()` 中有一个完成函数，用于显示页脚，让用户知道图片已就绪。在 `hide()`\
  \ 中，页脚被隐藏：\n\n```\n04 function toggleImage(){\n05   if ($(\"#handle\").html() ==\
  \ '+'){\n06     $(\"#photo\").show(1000, function(){$(\"#footer\").show();});\n\
  07     $(\"#handle\").html('-');\n08   } else {\n09     $(\"#footer\").hide();\n\
  ```\n\n\n\n\n\n```\n$(\"#photo\").hide(1000);\n$(\"#handle\").html('+');\n}\n}\n\
  ```\n\n**5.** 保存所有三个文件，然后在网页浏览器中打开 HTML 文档，如图 12.1 所示。你应该能够展开和折叠图片，并在适当的时候看到页脚显示。\n\
  \n![图片](img/image00912.jpeg)\n\n**图 12.1** 简单的可展开/折叠图片元素。\n\n**清单 12.1 image_hide.html\
  \ HTML 文件——用于显示可折叠图片元素的基本网页**\n\n点击此处查看代码图片\n\n* * *\n\n```\n<!DOCTYPE html>\n<html>\n\
  \  <head>\n    <title>Image Hide</title>\n    <meta charset=\"utf-8\" />\n    <script\
  \ type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"></script>\n\
  \    <script type=\"text/javascript\" src=\"js/image_hide.js\"></script>\n    <link\
  \ rel=\"stylesheet\" type=\"text/css\" href=\"css/image_hide.css\">\n  </head>\n\
  \  <body>\n    <div>\n      <div id=\"title\"><span id=\"handle\">-</span>Canon</div>\n\
  \      <img id=\"photo\" src=\"/images/liberty.jpg\" width=\"300px\"/>\n      <div\
  \ id=\"footer\">Image Ready</div>\n    </div>\n  </body>\n</html>\n```\n\n* * *\n\
  \n**清单 12.2 image_hide.js jQuery 和 JavaScript 代码——实现可折叠图片**\n\n点击此处查看代码图片\n\n* *\
  \ *\n\n```\n$(window).load(function(){\n  $(\"#handle\").click(toggleImage);\n});\n\
  function toggleImage(){\n  if ($(\"#handle\").html() == '+'){\n    $(\"#photo\"\
  ).show(1000, function(){$(\"#footer\").show();});\n    $(\"#handle\").html('-');\n\
  \  } else {\n    $(\"#footer\").hide();\n    $(\"#photo\").hide(1000);\n    $(\"\
  #handle\").html('+');\n  }\n}\n```\n\n* * *\n\n**清单 12.3 image_hide.css CSS 代码——为可折叠图片元素设置样式**\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\ndiv{ width:300px; text-align:center; }\n#title, #handle,\
  \ #footer{\n  background-color:blue; color:white;\n  font-weight:bold;\n}\n#handle{\n\
  \  display:inline-block; width:20px; float:left;\n  background-color:black; cursor:pointer;\n\
  }\n#footer{\n  font-size:10px; background-color:black;\n  margin-top:-5px\n}\n```\n\
  \n* * *\n\n### 动画化可见性\n\njQuery 还通过附加到 jQuery 对象的淡入淡出方法提供了动画能力。本质上，淡入淡出方法等同于对`opacity`属性使用`.animate()`。\n\
  \n以下各节介绍如何将动画应用于各种淡入淡出方法。\n\n#### fadeIn()\n\n`.fadeIn( [duration] [, easing] [,\
  \ callback])`方法提供了可选的`duration`、`easing`和`callback`选项，允许你将元素的`opacity`从当前值动画淡入到\
  \ 1。\n\n例如，以下代码对所有图片元素应用了持续 1 秒、缓动方式为`swing`的动画：\n\n点击此处查看代码图片\n\n```\n$(\"img\"\
  ).fadeIn(1000, \"swing\");\n```\n\n#### fadeOut()\n\n`.fadeOut( [duration] [, easing]\
  \ [, callback])`方法提供了可选的`duration`、`easing`和`callback`选项，允许你将元素的`opacity`从当前值动画淡出到\
  \ 0。\n\n例如，以下代码对所有图片元素应用了持续 1 秒、缓动方式为`swing`的动画，完成后再次将它们淡入：\n\n点击此处查看代码图片\n\n```\n\
  $(\"img\").fadeOut(1000, \"swing\", function() { $(this).fadeIn(1000);});\n```\n\
  \n#### fadeToggle()\n\n`.fadeToggle( [duration] [, easing] [, callback])`方法提供了可选的`duration`、`easing`和`callback`选项，允许你根据元素的当前`opacity`值，将其从当前值动画淡出到\
  \ 0 或淡入到 1。\n\n例如，以下代码对所有图片元素应用了持续 3 秒、缓动方式为`swing`的动画。当前可见的图片会淡出，当前透明的图片会淡入：\n\n\
  点击此处查看代码图片\n\n```\n$(\"img\").fadeToggle(3000, \"swing\");\n```\n\n#### fadeTo()\n\
  \n`.fadeTo( duration, opacity [, easing] [, callback])`方法提供了`duration`和`opacity`选项，指定最终的不透明度以及动画过渡的时长。它还提供了可选的`easing`和`callback`参数。\n\
  \n例如，以下代码对所有图片应用了持续 2 秒的动画，使其从当前不透明度过渡到 0.5：\n\n```\n$(\"img\").fadeTo(2000, .5);\n\
  ```\n\n* * *\n\n### 动手试一试：使用淡入淡出动画实现图片选择效果\n\n在本例中，你将淡入淡出动画应用于一组图片，当鼠标悬停在图片上时可以改变其透明度。本练习的目的是让你有机会使用本节讨论的一些淡入淡出技术。示例代码见清单\
  \ 12.4、12.5 和 12.6。\n\n按照以下步骤创建图片选择页面：\n\n**1.** 在 Eclipse 中创建`lesson12/image_fade.html`、`lesson12/js/image_fade.js`和`lesson12/css/image_fade.css`文件。\n\
  \n**2.** 将清单 12.4 和清单 12.6 中的代码添加到 HTML 和 CSS 文件中——只是一个包含五个`<img>`元素的基本`<div>`。\n\
  \n**3.** 打开`image_fade.js`文件，添加以下`load()`函数，该函数为所有`<img>`元素添加了`mouseover`和`mouseout`处理程序。`mouseover`处理程序将图片淡入到`opacity`为\
  \ 1，使其完全不透明；`mouseout`处理程序将其淡回至 0.3，使鼠标不在其上时图片透明：\n\n点击此处查看代码图片\n\n```\n$(window).load(function(){\n\
  \  $(\"img\").mouseover(function(){$(this).fadeTo(1000, 1);});\n  $(\"img\").mouseout(function(){$(this).fadeTo(1000,\
  \ .3);});\n});\n```\n\n**4.** 保存所有三个文件，然后在网页浏览器中打开 HTML 文档，如图 12.2 所示。你应该能够将鼠标移到图片上，看到透明度发生变化。\n\
  \n![图片](img/image00913.jpeg)\n\n**图 12.2** 一个简单的图片选择效果，当鼠标移过图片时调整透明度。\n\n**清单 12.4\
  \ image_fade.html HTML 文件——用于显示图片的基本网页**\n\n点击此处查看代码图片\n\n* * *\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n  <head>\n    <title>Image Highlighting and Fading</title>\n  \
  \  <meta charset=\"utf-8\" />\n    <script type=\"text/javascript\" src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
  ></script>\n    <script type=\"text/javascript\" src=\"js/image_fade.js\"></script>\n\
