  ```\n\n---\n\n## 动手实践：实现数据库访问服务\n\n在本例中，你将构建一个中间层数据库访问服务，该服务使用 `$http` 服务连接到模拟的服务器端数据库服务。此练习的目的是说明如何将内置服务与自定义服务结合使用。同时，这也是利用\
  \ `$q` 服务的一个好例子。\n\n请按照以下步骤构建带有数据库模拟的自定义 Web 服务器，实现数据库访问服务器，并构建一个使用该服务的 AngularJS\
  \ 应用程序：\n\n1. 添加 `lesson28/service_custom_db.html`、`lesson28/js/service_custom_db.js`\
  \ 和 `lesson28/js/service_custom_db_access.js` 文件。\n\n2. 将清单 28.6、28.7 和 28.8 中显示的代码添加到\
  \ HTML 和 JavaScript 文件中。\n\n3. 在本例中，我们需要让 Web 服务器提供模拟的数据库访问服务。清单 28.5 实现了 Node.js\
  \ Web 服务器，该服务器处理以下 `GET` 和 `POST` 路由，以获取和设置用户对象以及表数据数组，从而模拟对远程数据库服务的请求：\n\n   -\
  \ `/get/user`：一个 `GET` 路由，返回用户对象的 JSON 版本。\n   - `/get/data`：一个 `GET` 路由，返回表数据数组的\
  \ JSON 版本。\n   - `/set/user`：一个 `POST` 路由，接受请求体中的用户对象并更新服务器上的对象，以模拟存储用户对象。\n   -\
  \ `/set/data`：一个 `POST` 路由，接受请求体中的对象数组并更新数据变量，以模拟存储数据库数据。通常，你不会一次性存储所有表数据，但为了简化本例，我们采用这种方式。\n\
  \n除了理解清单 28.5 提供的路由，以便能够跟踪清单 28.6、28.7 和 28.8 中定义的 AngularJS 应用程序中的交互之外，你无需过多关注该清单中的代码。该服务器非常基础，不处理错误，并动态生成数据以模拟数据库。\n\
  \n---\n\n**顺便提一下**\n\n在启动清单 28.5 中的 `service_db_server.js` 之前，你需要停止正在运行的普通 `server.js`\
  \ HTTP 服务器（完成此练习后，不要忘记停止 `service_db_server.js` 并重新加载 `server.js`）。此外，你应该将清单 28.5\
  \ 中的 `service_db_server.js` 文件放在清单 28.6 中 `service_db_access.html` 的父文件夹中，以便 Node.js\
  \ 静态路由中的路径正确匹配。结构应类似于：\n\n点击此处查看代码图片\n\n- `./service_db_server.js`\n- `./lesson28/service_custom_db.html`\n\
  - `./lesson28/js/service_custom_db_access.js`\n- `./lesson28/js/service_custom_db.js`\n\
  \n---\n\n## 清单 28.5 service_db_server.js 实现一个 Node.js Express 服务器，支持 GET 和 POST\
  \ 路由，为 AngularJS 控制器模拟数据库服务\n\n点击此处查看代码图片\n\n---\n\n```javascript\nvar express =\
  \ require('express');\nvar bodyParser = require('body-parser');\nvar app = express();\n\
  app.use('/', express.static('./'));\napp.use(bodyParser.urlencoded({ extended: true\
  \ }));\napp.use(bodyParser.json());\nvar user = {\n             first: 'Christopher',\n\
  \             last: 'Columbus',\n             username: 'cc1492',\n            \
  \ title: 'Admiral',\n             home: 'Genoa'\n           };\nvar data = [];\n\
  function r(min, max){\n  var n = Math.floor(Math.random() * (max - min + 1)) + min;\n\
  \  if (n<10){ return '0' + n; }\n  else { return n; }\n}\nfunction p(start, end,\
  \ total, current){\n  return Math.floor((end-start)*(current/total)) + start;\n\
  }\nfunction d(plusDays){\n  var start = new Date(1492, 7, 3);\n  var current = new\
  \ Date(1492, 7, 3);\n  current.setDate(start.getDate()+plusDays);\n  return current.toDateString();\n\
  }\nfunction makeData(){\n  var t = 70;\n  for (var x=0; x < t; x++){\n    var entry\
  \ = {\n      day: d(x),\n      time: r(0, 23) + ':' + r(0, 59),\n      longitude:\
  \ p(37, 25, t, x) + '\\u00B0 '+ r(0,59) + ' N',\n      latitude: p(6, 77, t, x)\
  \ + '\\u00B0 '+ r(0,59) + ' W'\n    };\n    data.push(entry);\n  }\n}\nmakeData();\n\
  app.get('/get/user', function(req, res){\n  res.json(user);\n});\napp.get('/get/data',\
  \ function(req, res){\n  res.json(data);\n});\n```\n\n\n\n\n\n```\n48 app.post('/set/user',\
  \ function(req, res){\n49   console.log(req.body.userData);\n50   user = req.body.userData;\n\
  51   res.json({ data: user, status: \"User Updated.\" });\n52 });\n53 app.post('/set/data',\
  \ function(req, res){\n54   data = req.body.data;\n55   res.json({ data: data, status:\
  \ \"Data Updated.\" });\n56 });\n57 app.listen(80);\n```\n\n* * *\n\n### 4. 添加清单\
  \ 28.6 中的代码，该代码实现了一个名为`dbAccess`的模块和一个名为`DBService`的自定义服务。创建服务对象的`DBAccessObj()`函数提供了`getUserData()`和`updateUser()`方法，用于通过`$http`请求从服务器检索和更新用户对象。`getData`和`updateData()`方法为表格数据提供类似功能。注意，`$q`服务用于延迟对`$http`请求的响应，因为请求不会立即返回。\n\
  \n#### 清单 28.6 service_custom_db_access.js 实现一个自定义的 AngularJS 服务，该服务利用`$http`和`$q`服务与服务器上存储的数据进行交互\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\n01 var app = angular.module('dbAccess', []);\n02 function\
  \ DBAccessObj($http, $q) {\n03   this.getUserData = function(){\n04     var deferred\
  \ = $q.defer();\n05     $http.get('/get/user')\n06     .success(function(response,\
  \ status, headers, config) {\n07       deferred.resolve(response);\n08     });\n\
  09     return deferred.promise;\n10   };\n11   this.updateUser = function(userInfo){\n\
  12     var deferred = $q.defer();\n13     $http.post('/set/user', { userData: userInfo}).\n\
  14     success(function(response, status, headers, config) {\n15       deferred.resolve(response);\n\
  16     });\n17     return deferred.promise;\n18   };\n19   this.getData = function(){\n\
  20     var deferred = $q.defer();\n21     $http.get('/get/data')\n22     .success(function(response,\
  \ status, headers, config) {\n23       deferred.resolve(response);\n24     });\n\
  25     return deferred.promise;\n26   };\n27   this.updateData = function(data){\n\
  28     var deferred = $q.defer();\n29     $http.post('/set/data', { data: data}).\n\
  30     success(function(response, status, headers, config) {\n31       deferred.resolve(response);\n\
  32     });\n33     return deferred.promise;\n34   };\n35 }\n36 app.service('DBService',\
  \ ['$http', '$q', DBAccessObj]);\n```\n\n* * *\n\n### 5. 添加清单 28.7 中的代码，该代码实现了应用程序模块。注意，在第\
  \ 1 行，`dbAccess`模块被注入到`myApp`模块中，以提供对`DBService`服务的访问。`DBService`在第 2 行被注入到控制器中，然后在第\
  \ 6、12、18 和 23 行被用于调用服务器上的获取和设置数据，并将其分配给作用域中的`$scope.userInfo`和`$scope.data`值。注意，`$q`服务的`then()`函数用于处理延迟的响应。为简单起见，只实现了`successCallback`函数。通常你还需要实现一个`errorCallback`函数。\n\
  \n#### 清单 28.7 service_custom_db.js 实现一个 AngularJS 应用程序，该应用程序从清单 28.6 中注入模块和服务，以利用数据库访问服务\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\n01 var app = angular.module('myApp', ['dbAccess']);\n\
  02 app.controller('myController', ['$scope', 'DBService',\n03                  \
  \               function($scope, db) {\n04   $scope.status = \"\";\n05   $scope.getUser\
  \ = function(){\n06     db.getUserData().then(function(response){\n07       $scope.userInfo\
  \ = response;\n08       $scope.status = \"User Data Retrieve.\";\n09     });\n10\
  \   };\n11   $scope.getData = function(){\n12     db.getData().then(function(response){\n\
  13       $scope.data = response;\n14       $scope.status = \"User Data Retrieve.\"\
  ;\n15     });\n16   };\n17   $scope.updateUser = function(){\n18     db.updateUser($scope.userInfo).then(function(response){\n\
  19       $scope.status = response.status;\n20     });\n21   };\n22   $scope.updateData\
  \ = function(){\n23     db.updateData($scope.data).then(function(response){\n24\
  \       $scope.status = response.status;\n25     });\n26   };\n27   $scope.getUser();\n\
  28   $scope.getData();\n29 }]);\n```\n\n* * *\n\n### 6. 添加清单 28.8 中的代码，该代码实现了一个\
