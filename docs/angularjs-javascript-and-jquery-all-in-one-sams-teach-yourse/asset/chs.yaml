  \n5. 清单 22.4 中的以下几行实现了数字输入框，并将它们绑定到 `valueA` 和 `valueB` 的值：\n\n   点击此处查看代码图片\n\n\
  \   ```html\n   08       ValueA: <input type=\"number\" ng-model=\"valueA\" /><br>\n\
  \   09       ValueB: <input type=\"number\" ng-model=\"valueB\" /><br><br>\n   ```\n\
  \n6. 以下行使用简单的 AngularJS 表达式在模板中显示 `valueA` 和 `valueB` 的值：\n\n   点击此处查看代码图片\n\n \
