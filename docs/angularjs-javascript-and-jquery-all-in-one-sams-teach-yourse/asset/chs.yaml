  \ `./images`**：** 包含示例中使用的图像的文件夹。\n\n![Image](img/image00767.jpeg) `./lesson29`**：**\
  \ 项目文件夹。\n\n![Image](img/image00767.jpeg) `./lesson29/tabbable.html`**：** 项目的 AngularJS\
  \ 模板。\n\n![Image](img/image00767.jpeg) `./lesson29/tabs.html`**：** 选项卡组的 AngularJS\
  \ 部分模板。\n\n![Image](img/image00767.jpeg) `./lesson29/panel.html`**：** 选项卡组中每个单独面板的\
  \ AngularJS 部分模板。\n\n![Image](img/image00767.jpeg) `./lesson29/js/tabbable.js`**：**\
  \ 支持自定义选项卡指令的 AngularJS 应用程序。\n\n**2.** 将清单 29.1 中的代码添加到 `tabbable.js` 文件中。这是一个\
  \ AngularJS 应用程序，它定义了两个指令：`myTabs` 和 `myPane`。请注意，`directive` 函数只是返回一个定义指令的对象。当在\
  \ HTML 中遇到该指令时，AngularJS 会使用此对象创建该指令的实例。\n\n还要注意，模板中使用的 HTML 来自部分文件，通过指令定义中的 `templateUrl`\
  \ 选项引用。另外，还使用了 `transclude` 选项，这使我们能够保留 AngularJS 模板中 `myPane` 元素的内容。\n\n两个指令之间的通信是通过在\
  \ `myPane` 的定义中要求 `myTabs` 指令来实现的。这导致 `myTabs` 中定义的控制器被传递到 `myPane` 的 `link` 函数中。请注意，在第\
  \ 30 行，我们能够调用 `addPane()` 将 `myPane` 指令的作用域添加到 `myTabs` 指令的列表中。可见选项卡通过 `myTabs`\
  \ 控制器函数中的 `select()` 方法进行更改。\n\n**清单 29.1 tabbable.js AngularJS 应用程序，定义了两个可以嵌套以提供选项卡面板视图的自定义指令**\n\
  \n点击此处查看代码\n\n* * *\n\n```javascript\n01 var app = angular.module('myApp', []);\n\
  02 app.directive('myTabs', function() {\n03   return {\n04     restrict: 'E',\n\
  05     transclude: true,\n```\n\n\n\n\n\n```\n06     scope: {},\n07     controller:\
  \ function($scope) {\n08       var panes = $scope.panes = [];\n09       $scope.select\
  \ = function(pane) {\n10         angular.forEach(panes, function(pane) {\n11   \
  \        pane.selected = false;\n12         });\n13         pane.selected = true;\n\
  14       };\n15       this.addPane = function(pane) {\n16         if (panes.length\
  \ == 0) {\n17           $scope.select(pane);\n18         }\n19         panes.push(pane);\n\
  20       };\n21     },\n22     templateUrl: 'tabs.html'\n23   };\n24 });\n25 app.directive('myPane',\
  \ function() {\n26   return { require: '^myTabs', restrict: 'E',\n27     templateUrl:\
  \ 'pane.html',\n28     transclude: true, scope: { title: '@' },\n29     link: function(scope,\
  \ element, attrs, tabsCtrl) {\n30       tabsCtrl.addPane(scope);\n31     }\n32 \
  \  };\n33 });\n```\n\n* * *\n\n**3.** 将清单 29.2 中的代码添加到`table.html`文件中。这是一个 AngularJS\
