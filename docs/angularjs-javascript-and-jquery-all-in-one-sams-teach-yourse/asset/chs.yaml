  \ 和 JavaScript 代码——实现图片选择淡入淡出**\n\n点击此处查看代码图片\n\n* * *\n\n```\n$(window).load(function(){\n\
  \  $(\"img\").mouseover(function(){$(this).fadeTo(1000, 1);});\n  $(\"img\").mouseout(function(){$(this).fadeTo(1000,\
  \ .3);});\n});\n```\n\n* * *\n\n**清单 12.6 image_fade.css CSS 代码——为可折叠图片元素设置样式**\n\
  \n* * *\n\n```\ndiv{padding:0px;}\nimg{\n  float:left;\n  opacity:.3;\n  height:\
  \ 100px;\n}\n```\n\n* * *\n\n### 滑动元素\n\n\n\n\n一种常见的动画是滑动效果。滑动效果能让元素从起始边缘到结束边缘，从占据零空间过渡到占据空间。使用滑动动画可以给用户带来更丰富的体验，因为菜单、图片和其他元素可以被“隐藏”起来，直到用户将鼠标悬停或点击它们。\n\
  \n你可以通过几种方式创建滑动元素。一种方法是使用 jQuery 内置的滑动方法。第二种方法是动画化高度和宽度属性。以下各节将分别介绍这些方法。\n\n####\
  \ 动画化 `slideUp()`、`slideDown()` 和 `slideToggle()`\n\n`.slideUp( duration [, easing]\
  \ [, callback])`、`.slideDown( duration [, easing] [, callback])` 和 `.slideToggle(\
  \ duration [, easing] [, callback])` 方法提供了 `duration`、`easing` 和 `callback` 参数，让你能够在垂直方向上动画化滑动效果。\n\
  \n例如，以下代码应用了 1 秒的动画将元素向下滑动，然后延迟 3 秒后再将元素向上滑动：\n\n点击此处查看代码图片\n\n```\n$(\"#menu\"\
  ).slideDown(1000).delay(3000).slideUp(1000);\n```\n\n你也可以用类似的方式动画化 `.slideToggle()`\
  \ 方法。例如，以下代码使用滑动动画来动画化一个 `<div>` 元素的可见性：\n\n```\n$(\"div\").slideToggle(1000);\n\
  ```\n\n#### 使用宽度和高度滑动\n\n我们也喜欢使用宽度和高度属性来创建滑动元素。你可以通过动画化高度来创建垂直滑动动画，通过动画化宽度来创建水平滑动动画。\n\
  \n这里有几个技巧。如果你想要完整的滑动效果而不仅仅是调整大小效果，你需要为元素同时提供宽度和高度值。另外，如果你希望元素在页面上保留空间，就不能将值一直动画化到\
  \ 0。不过，你可以动画化到 0.1，另一个维度将保留其空间。\n\n以下示例展示了一个动画，通过将 `height` 改为 100 来向下滑动，然后通过将 `height`\
  \ 改为 0.1 再向上滑动：\n\n点击此处查看代码图片\n\n```\n$(\"img\").animate({height:100}, 1000);\n\
  $(\"img\").animate({height:.1}, 1000);\n```\n\n***\n\n### 动手实践：使用滑动动画实现动态菜单\n\n\
  在本例中，你将创建一个简单的网页元素，它提供一个带有滑动效果的标题栏，从而显示一个图片菜单。当你将鼠标悬停在菜单中的每个项目上时，一张图片会向下滑动，当你离开菜单时，图片会向上滑动。本练习的目的是让你有机会使用本节讨论的一些滑动技术。示例代码见清单\
  \ 12.7、12.8 和 12.9。\n\n按照以下步骤创建动态网页：\n\n**1.** 在 Eclipse 中，创建 `lesson12/sliding_images.html`、`lesson12/js/sliding_images.js`\
  \ 和 `lesson12/css/sliding_images.css` 文件。\n\n**2.** 将清单 12.7 和清单 12.9 中所示的代码添加到\
  \ HTML 和 CSS 文件中——仅包含基本内容：一个包含 `<p>` 作为标题栏的 `<div>`，以及一个包含用于菜单的 `<span>` 和 `<img>`\
  \ 元素的内部 `<div>`。\n\n**3.** 打开 `sliding_images.js` 文件并添加一个基本的 `$(window).load()`\
  \ 函数。在 `load()` 函数内部，添加以下代码行来隐藏内部的 `<div>`：\n\n```\n02   $(\"div div\").hide();\n\
  ```\n\n**4.** 添加以下语句，为 `<span>` 元素添加 `mouseover` 和 `mouseout` 处理程序。在 `mouseover`\
  \ 时，获取 `<span>` 的索引，然后用它找到对应的 `<img>` 元素，并将 `height` 动画化为 100，从而使图片向下滑动。在 `mouseout`\
  \ 时，执行相反操作，将 `height` 设置为 1 使其向上滑动：\n\n点击此处查看代码图片\n\n```\n03   $(\"span\").mouseover(function(){\n\
  04     var i = $(this).index(\"span\");\n05     $(\"img\").eq(i).animate({height:100},\
  \ 1000);\n06     });\n07   $(\"span\").mouseout(function(){\n08     var i = $(this).index(\"\
  span\");\n09     $(\"img\").eq(i).animate({height:.1}, 1000);\n10     });\n```\n\
  \n**5.** 添加以下语句，为 `#container` 元素添加 `mouseenter` 和 `mouseleave` 处理程序。在 `mouseenter`\
  \ 时，首先停止事件传播，以便在冒泡过程中只应用一次滑动切换。然后停止 `#images` 元素上的所有动画，并使用 `slideToggle()` 来动画化整个菜单的滑动。`mouseleave`\
  \ 时执行相同操作。结果是，当鼠标位于 `#container` 元素上时，菜单向下滑动，当鼠标离开时，菜单向上滑动：\n\n点击此处查看代码图片\n\n```\n\
  11   $(\"#container\").mouseenter(function(e){\n12       e.stopPropagation();\n\
  13       $(\"#images\").stop(true).slideToggle(1000);\n14     });\n15   $(\"#container\"\
  ).mouseleave(function(e){\n16       e.stopPropagation();\n17       $(\"#images\"\
  ).stop(true).slideToggle(1000);\n18       });\n```\n\n**6.** 保存所有三个文件，然后在 Web 浏览器中打开\
  \ HTML 文档，如图 12.3 所示。你应该能够展开菜单，并且当鼠标悬停在每个菜单项上时，图片会向下滑动，离开时图片会向上滑动。\n\n![Image](img/image00914.jpeg)\n\
