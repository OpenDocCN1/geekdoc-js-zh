  \ 模板，它初始化了清单 22.3 中定义的 `SimpleTemplate` 控制器，并提供了用于设置 `valueA` 和 `valueB` 值的数字输入框，以及一个用于计算\
  \ `valueC` 值的按钮。\n\n按照以下步骤构建应用程序并实现作用域与模板之间的交互：\n\n1. 添加 `lesson22/scope_template.html`\
  \ 和 `lesson22/js/scope_template.js` 文件。\n\n2. 将清单 22.3 和清单 22.4 中显示的代码添加到 HTML 和\
  \ JavaScript 文件中。\n\n3. 以下代码来自清单 22.3，用于在作用域中定义 `valueA`、`valueB` 和 `valueC` 的值：\n\
  \n   点击此处查看代码图片\n\n   ```javascript\n   03     $scope.valueA = 5;\n   04     $scope.valueB\
