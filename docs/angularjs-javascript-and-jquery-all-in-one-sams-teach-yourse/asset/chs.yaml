  \ src=\"js/zooming.js\"></script>\n</html>\n```\n\n---\n\n5. 在浏览器中加载`zooming.html`文件。图\
  \ 29.3 显示了网页上带有视图区域的图像。当您点击图像中的某个特定点时，缩放视图区域会更新。\n\n![Image](img/image01055.jpeg)\n\
  \n**图 29.3** 实现一个自定义 AngularJS 指令，该指令提供一个带有缩放视图取景器的图像。\n\n---\n\n---\n\n动手实践：实现可展开和可折叠元素\n\
  \n在本例中，您将使用自定义 AngularJS 指令在网页上构建可以展开和收缩的元素。每个元素都有一个标题和一个顶部的展开/折叠按钮。当点击折叠按钮时，元素的内容将被隐藏。当点击展开按钮时，内容将再次显示。\n\
  \n本练习的目的是巩固实现相互嵌套并相互通信的自定义 AngularJS 指令。在本例中，您还将看到作用域如何与控制器隔离，但在展开容器和容器中的项目之间共享。\n\
  \n请按照以下步骤构建可展开/可折叠的 AngularJS 应用程序：\n\n1. 在您的代码中创建以下文件夹和文件结构：\n\n![Image](img/image00767.jpeg)\
  \ `./server.js`：提供静态项目文件的 Node.js 网络服务器。\n\n![Image](img/image00767.jpeg) `./images`：包含示例中使用的图像的文件夹。\n\
  \n![Image](img/image00767.jpeg) `./lesson29`：项目文件夹。\n\n![Image](img/image00767.jpeg)\
  \ `./lesson29/expand.html`：实现自定义可展开指令的 AngularJS 模板。\n\n![Image](img/image00767.jpeg)\
  \ `./lesson29/expand_list.html`：可展开元素指令的 AngularJS 局部模板。\n\n![Image](img/image00767.jpeg)\
  \ `./lesson29/expand_item.html`：可展开元素中每个单独项目的 AngularJS 局部模板。\n\n![Image](img/image00767.jpeg)\
  \ `lesson29/js/expand.js`：支持可展开元素指令的 AngularJS 应用程序。\n\n2. 将清单 29.10 中的代码添加到`expand.js`文件中。这是一个\
  \ AngularJS 应用程序，定义了`expandList`和`expandItem`自定义 AngularJS 指令。使用`transclude`选项来保留在模板中定义的内容。\n\
  \n请注意，在`expandList`指令中，作用域是隔离的，但接受属性`title`和`exwidth`，它们被设置为作用域中的`title`和`listWidth`。注意在第\
  \ 27 行，`listWidth`值用于设置添加到展开列表中的项目的样式宽度。此外，在第 34 行，`listWidth`用于设置可展开列表的`css`属性`width`。\n\
  \n`expandItem`指令需要`expandList`指令来提供对`expandList`指令作用域中`addItem()`函数的访问。请注意，`myStyle`属性用于构建一个样式对象，该对象将被设置为展开列表中项目的`ng-style`。\n\
  \n展开和折叠的工作方式是：使用`ng-hide`将`myHide`值绑定到展开列表中的每个项目，如清单 29.11 所示的模板中。`expandList`作用域中的`items`属性为每个添加的`expandItem`元素提供了一个作用域列表。然后，当点击展开/折叠按钮时，只需在`collapse()`函数中将每个项目作用域中的`myHide`值设置为`true`或`false`，即可显示或隐藏展开元素中的项目。\n\
  \n清单 29.10 expand.js AngularJS 应用程序，实现`expandList`和`expandItem`自定义指令以提供可展开和可折叠元素\n\
  \n点击此处查看代码图片\n\n---\n\n```\nangular.module('myApp', [])\n.controller('myController',\
  \ ['$scope', function($scope) {\n  $scope.items = [1,2,3,4,5];\n}])\n.directive('expandList',\
  \ function() {\n  return {\n    restrict: 'E',\n    transclude: true,\n    scope:\
  \ {title: '@', listWidth: '@exwidth'},\n    controller: function($scope) {\n   \
  \   $scope.collapsed = false;\n      $scope.expandHandle = \"-\";\n      items =\
  \ $scope.items = [];\n      $scope.collapse = function() {\n        if ($scope.collapsed){\n\
  \          $scope.collapsed = false;\n          $scope.expandHandle = \"-\";\n \
  \       } else {\n          $scope.collapsed = true;\n          $scope.expandHandle\
  \ = \"+\";\n        }\n        angular.forEach($scope.items, function(item) {\n\
