  05   transition:all ease 2.5s;\n06 }\n07 .shrink,\n08 .shrink-add.shrink-add-active\
  \ {\n09   width:100px;\n10 }\n11 .start-class,\n12 .grow,\n13 .grow-add.grow-add-active\
