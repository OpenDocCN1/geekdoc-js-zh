  \ AngularJS 版本的索引，以便查看哪些版本是最新的，并知道从哪里加载它们。\n\n## 第 21 课 理解 AngularJS 应用程序动态\n\n\
  本课你将学到：\n\n![Image](img/image00767.jpeg) AngularJS 如何使用依赖注入\n\n![Image](img/image00767.jpeg)\
  \ 如何在 AngularJS 中创建依赖提供者\n\n![Image](img/image00767.jpeg) AngularJS 应用程序的配置块用于什么\n\
  \n![Image](img/image00767.jpeg) AngularJS 应用程序的运行块用于什么\n\n理解 AngularJS 最重要的方面之一是依赖注入及其与模块的关系。依赖是许多服务器端语言中的常见概念，但在\
  \ AngularJS 之前，JavaScript 中并没有真正实现太多。\n\n依赖注入允许 AngularJS 模块保持非常清晰、有组织的形式，同时更轻松地访问其他模块的功能。如果正确实现，它还能显著减少代码量。\n\
  \n本课提供了依赖注入的基本概述，然后描述了如何创建提供功能的模块，以及如何在其他模块和其他 AngularJS 组件（如控制器）中使用这些功能。\n\n###\
  \ 了解模块和依赖注入\n\n当你开始编写 AngularJS 应用程序时，理解 AngularJS 世界中模块和依赖注入的基础知识至关重要。对于某些人来说，尤其是那些来自更开放、无拘无束的\
  \ JavaScript 背景的人，这似乎是一个难以掌握和正确实现的概念。\n\n本节将向你介绍 AngularJS 模块和依赖注入背后的概念。理解模块如何利用依赖注入来访问其他模块的功能，将使你更容易在\
  \ AngularJS 框架内实现代码。\n\n#### 理解模块\n\nAngularJS 模块是容器，使你能够将代码划分并组织成简洁、清晰、可重用的块。模块本身不提供直接功能，但它们包含提供功能的其他对象的实例，例如控制器、过滤器、服务和动画。\n\
  \n你通过定义模块提供的对象来构建模块。然后，通过依赖注入将模块链接在一起，构建一个完整的应用程序。\n\nAngularJS 建立在模块原则之上。AngularJS\
  \ 提供的大部分功能都内置在一个名为 `ng` 的模块中，该模块包含了本书中使用的大部分指令和服务。\n\n#### 依赖注入\n\n\n\n\n依赖注入可能是一个难以完全掌握的概念。然而，它是\
  \ AngularJS 中非常重要的一部分，一旦你理解了基础知识，AngularJS 的实现就会变得相当清晰。依赖注入在大多数服务器端语言中是一种广为人知的设计模式，但在\
  \ AngularJS 之前，它并未在 JavaScript 框架中得到广泛应用。\n\nAngularJS 依赖注入的思想是定义并动态地将依赖对象注入到另一个对象中，从而提供依赖对象所拥有的全部功能。\n\
  \n我喜欢用一个虚拟房间的类比来解释依赖注入。如果你只是想创建一个虚拟房间，你会定义四面墙、一个地板和一个天花板作为基础。然而，这样的房间对于大多数用途来说并不实用。如果你想让这个房间成为餐厅，你需要一张桌子和几把餐椅；但如果你想让房间成为客厅，你可能需要沙发和电视。\n\
  \n所以在虚拟世界中，你会定义一种创建沙发、餐椅、餐桌、电视、灯具、画作、边桌等对象的方法。请记住，这仅仅是创建这些对象的一种方式，而不是沙发或桌子对象的实际实例。\n\
  \n然后，依赖注入允许你通过声明在创建房间时应将哪些类型的对象注入其中，来轻松定义你可能想要的任何类型的房间。\n\n例如，你可以定义类似 `LivingRoom`\
  \ 等于 `[sofa, table, TV]` 注入到 `Room` 中。这只是一个定义，因此在你创建 `LivingRoom` 实例之前，并不存在 `Room`、`sofa`、`table`\
  \ 或 `TV` 的实例；而在创建 `LivingRoom` 实例时，`sofa`、`table` 和 `TV` 对象会被创建并自动注入到新创建的 `LivingRoom`\
  \ 中，以提供你坐下观看虚拟电影所需的客厅功能。\n\nAngularJS 通过使用提供者和注入器服务来实现依赖注入。提供者定义了如何创建具有特定功能的可注入对象。注入器服务创建可注入对象的实例，并将其提供给使用它们的新创建对象。\n\
  \n##### 提供者\n\n提供者本质上是一种定义，说明如何创建具有所有必要功能的对象实例。提供者应作为 AngularJS 模块的一部分来定义。模块将提供者注册到注入器服务中。在\
  \ AngularJS 应用程序中，每个提供者的对象只会创建一个实例。\n\n##### 注入器\n\n注入器服务负责跟踪提供者对象的实例。每个注册了提供者的模块都会创建一个注入器服务实例。\n\
  \n当需要某个提供者的对象被创建时，会发出一个依赖请求，要求获取该提供者对象的实例。注入器服务首先检查该实例是否已存在于注入器缓存中。如果存在，则返回该实例。如果缓存中未找到实例，则使用提供者定义创建一个新实例，将其存储在缓存中，然后返回。\n\
  \n### 定义 AngularJS 模块对象\n\n创建 AngularJS 模块是一个简单的过程，涉及调用 `angular.module()` 方法。该方法会创建一个\
  \ `Module` 对象的实例，将其注册到注入器服务中，然后返回新创建的 `Module` 对象的实例，你可以使用它来实现提供者功能。`angular.module()`\
  \ 方法使用以下语法：\n\n```\nangular.module(name, [requires], [configFn])\n```\n\n`name`\
  \ 参数是模块在注入器服务中注册的名称。`requires` 参数是一个模块名称数组，这些模块会被添加到注入器服务中供当前模块使用。如果你需要另一个模块的功能，则需要将其添加到\
  \ `requires` 列表中。默认情况下，`ng` 模块会自动添加到每个实例化的模块中，因此你无需在列表中显式指定 `ng` 即可访问 AngularJS\
  \ 的提供者。\n\n所有依赖项的实例都会自动注入到模块的实例中。依赖项可以是模块、服务以及注入器服务中注册的任何其他对象。`configFn` 参数是在模块配置阶段调用的另一个函数。配置函数将在下一节中描述。\n\
  \n以下是一个创建 AngularJS 模块的示例，该模块依赖于 `$window` 和 `$http` 服务。该定义还包含一个配置函数，用于添加一个名为 `myValue`\
  \ 的 `value` 提供者：\n\n```\nvar myModule = angular.module('myModule', ['$window', '$http'],\
  \ function(){\n    $provide.value('myValue', 'Some Value');\n});\n```\n\n如果你没有指定\
  \ `requires` 参数，则不会创建新的 `Module` 对象，而是返回已创建的实例。例如，以下代码会覆盖之前定义的实例：\n\n```\nvar myModule2\
  \ = angular.module('myModule', []);\n```\n\n然而，以下代码会返回之前创建的实例，因为参数列表中的 `require`\
  \ 数组没有列出任何依赖项：\n\n```\nvar myModule3 = angular.module('myModule');\n```\n\n## 在\
  \ AngularJS 模块中创建提供者\n\nAngularJS 为各种对象和服务提供了许多内置提供者。例如，`$window` 服务有一个提供者，它构建了\
  \ AngularJS 服务对象，使你能够与 JavaScript 中的底层 `Window` 对象进行交互。除了这些提供者之外，你还可以创建自己的提供者，将功能注入到\
  \ AngularJS 应用程序组件中。\n\n`Module` 对象提供了几个辅助方法，用于添加提供者，作为使用 `config()` 方法的替代方案。这些方法使用起来更简单，代码也更清晰。你可以向\
  \ AngularJS 模块添加两种类型的提供者对象。每种方法都接受两个参数：将在依赖注入器中注册的名称，以及定义如何构建特定对象的提供者函数。以下各节将更详细地描述这些方法。\n\
  \n#### 专门的 AngularJS 对象提供者\n\n`Module` 对象提供了特殊的构造方法，用于为需要在模块中实现的 AngularJS 对象添加提供者。这些专门的方法允许你为以下类型的对象添加定义：\n\
  \n![Image](img/image00767.jpeg) `animation(name, animationFactory)`\n\n![Image](img/image00767.jpeg)\
  \ `controller(name, controllerFactory)`\n\n![Image](img/image00767.jpeg) `filter(name,\
  \ filterFactory)`\n\n![Image](img/image00767.jpeg) `directive(name, directiveFactory)`\n\
  \n这些是专门的方法，因为 AngularJS 中为这些提供者方法定义了相应的 `animation`、`controller`、`filter` 和 `directive`\
  \ 对象。\n\n每个对象将在后续课程中更详细地介绍。现在，先快速看一下基本的控制器定义：\n\n```\nvar mod = angular.module('myMod',\
  \ []);\n\nmod.controller('myController', function($scope) {\n  $scope.someValue\
  \ = 'Some Value';\n});\n```\n\n创建了一个名为 `mod` 的简单模块，然后调用了 `controller()` 方法，传入了 `myController`\
  \ 以及一个 `controllerFactory` 函数。`controllerFactory` 函数接受 `$scope` 变量作为参数。这是因为 AngularJS\
  \ 有一个内置的控制器对象，并且知道所有控制器对象都必须将作用域对象作为第一个参数接收。\n\n#### 服务提供者\n\n\n\n\n服务提供者是一种独特的提供者类别，因为生成的提供者对象并没有特定的格式。相反，提供者作为一种服务来提供功能。AngularJS\
  \ 提供了一些特定的创建方法来构建服务，并通过以下方法暴露它们：\n\n![Image](img/image00767.jpeg) `value(name, object)`：这是所有提供者中最基础的一个。`object`\
  \ 参数直接赋值给 `name`，因此在注入器中，`name` 值与 `object` 值之间存在直接关联。\n\n![Image](img/image00767.jpeg)\
  \ `constant(name, object)`：这与 `value()` 方法类似，但该值不可更改。此外，`constant()` 方法会在其他提供者方法之前被应用。\n\
  \n![Image](img/image00767.jpeg) `factory(name, factoryFunction)`：此方法使用 `factoryFunction`\
  \ 参数构建一个对象，该对象将由注入器提供。\n\n![Image](img/image00767.jpeg) `service(name, serviceFactory)`：此方法引入了对提供者对象实现更面向对象方法的概念。AngularJS\
  \ 的许多内置功能都是通过服务提供者提供的。\n\n![Image](img/image00767.jpeg) `provider(name, providerFactory)`：此方法是所有其他方法的核心。虽然它提供了最多的功能，但由于其他方法更简单，因此并不常用。\n\
  \n后续课程将更详细地介绍这些对象。现在，先来看一个关于基本 `value` 和 `constant` 定义的简单示例：\n\n点击此处查看代码图片\n\n```\n\
  var mod = angular.module('myMod', []);\nmod.constant(\"cID\", \"ABC\");\nmod.value('counter',\
  \ 0);\nmod.value('image', {name:'box.jpg', height:12, width:20});\n```\n\n创建了一个名为\
  \ `mod` 的简单模块，然后定义了 `constant()` 和两个 `value()` 提供者。这些方法中定义的值被注册到 `myMod` 模块的注入器服务中，之后可以通过名称访问。\n\
  \n## 实现提供者与依赖注入\n\n在定义了模块和相应的提供者之后，你可以将该模块作为依赖项添加到其他模块、控制器以及各种 AngularJS 对象中。你可以设置依赖于提供者的对象的\
  \ `$inject` 属性值。`$inject` 属性包含一个提供者名称数组，这些提供者将被注入到该对象中。\n\n例如，以下代码定义了一个接受 `$scope`\
  \ 和 `appMsg` 参数的基本控制器。然后将 `$inject` 属性设置为一个数组，其中包含 `$scope`（提供作用域访问权限的 AngularJS\
  \ 作用域服务）和自定义的 `appMsg`。`$scope` 和 `appMsg` 都被注入到 `myController` 函数中：\n\n点击此处查看代码图片\n\
  \n```\nvar myController = function($scope, appMsg) {\n  $scope.message = appMsg;\n\
  };\ncontroller['$inject'] = ['$scope', 'appMsg'];\nmyApp.myController('controllerA',\
  \ controller);\n```\n\n当实现某些对象时，这种方法可能会变得有些笨拙，因此 AngularJS 还提供了一种更优雅的注入依赖项的方法，使用以下语法代替普通的构造函数：\n\
  \n点击此处查看代码图片\n\n```\n[providerA, providerB, . . ., function(objectA, objectB, .\
  \ . .) {} ]\n```\n\n例如，前面的代码也可以这样写：\n\n点击此处查看代码图片\n\n```\nmyApp.controller('controllerA',\
  \ ['$scope', 'appMsg', function($scope, appMsg) {\n  $scope.message = appMsg;\n\
  }]);\n```\n\n在继续之前，理解依赖注入至关重要，因此以下部分提供了在 AngularJS 应用程序中实现依赖注入的示例清单。\n\n* * *\n\n\
  ### 动手实践：将内置提供者注入控制器\n\n在本节中，你将学习如何将 AngularJS 内置的一些提供者注入到你的控制器中。清单 21.1 中显示的代码实现了一个基本控制器，该控制器注入了\
  \ `$scope` 和 `$window` 提供者。清单 22.2 中的代码显示了加载 AngularJS 应用程序的 HTML 模板。\n\n以下描述了使用依赖注入从\
  \ AngularJS 提供者向控制器添加功能的重要方面：\n\n1. 添加 `lesson21/inject_builtin.html` 和 `lesson21/js/inject_builtin.js`\
  \ 文件。\n\n2. 将清单 21.1 和清单 21.2 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 以下代码行定义了一个使用\
  \ AngularJS 内置的 `$scope` 和 `$window` 提供者的控制器。注意，在 `function()` 定义中，参数名称也是 `$scope`\
  \ 和 `$window`。这不是必须的，但可能有助于理解代码：\n\n   点击此处查看代码图片\n\n   ```\n   02 myMod.controller('controllerA',\
  \ '$scope', '$window',\n   03                                   function($scope,\
  \ $window) {\n   ```\n\n4. [清单 21.1 中的以下代码行使用由 `$scope` 提供者创建的 `$scope` 对象在控制器的作用域中设置一个值：\n\
  \n   点击此处查看代码图片\n\n   ```\n   04   $scope.message = \"My Module Has Loaded!\";\n\
  \   ```\n\n5. 清单 21.2 中的以下代码行使用注入到控制器中的 `$window` 对象在浏览器中显示一个警告框：\n\n   点击此处查看代码图片\n\
  \n   ```\n   05   $window.alert($scope.message);\n   ```\n\n6. 当你在浏览器中加载 `inject_builtin.html`\
  \ 时，你应该会看到一个类似于图 21.1 的页面，其中包含生成的网页和警告消息。\n\n   ![Image](img/image00994.jpeg)\n\n\
  \   **图 21.1** 实现 `$window` 服务的依赖注入，以显示来自 `$scope` 的警告消息。\n\n**清单 21.1** `inject_builtin.js`\
  \ 在控制器中实现内置服务的依赖注入\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 var myMod = angular.module('myApp',\
  \ []);\n02 myMod.controller('controllerA', ['$scope', '$window',\n03           \
  \                        function($scope, $window) {\n04   $scope.message = \"My\
  \ Module Has Loaded!\";\n05   $window.alert($scope.message);\n06 }]);\n```\n\n*\
  \ * *\n\n**清单 21.2** `inject_builtin.html` 使用 HTML 代码实现一个实现依赖注入的 AngularJS 模块\n\n\
  点击此处查看代码图片\n\n* * *\n\n```\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 \
  \  <head>\n04     <title>AngularJS 依赖注入</title>\n05   </head>\n06   <body>\n07 \
  \    <div ng-controller=\"controllerA\">\n08       <h2>此页面有一个警告框</h2>\n09     </div><hr>\n\
  10     <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n\
  11     <script src=\"js/inject_builtin.js\"></script>\n12   </body>\n13 </html>\n\
  ```\n\n* * *\n\n* * *\n\n### 动手实践：将一个模块注入另一个模块\n\n在本示例中，你将学习如何将一个模块的功能注入到另一个模块中。清单\
  \ 21.3 中的代码实现了两个模块 `myMod` 和 `myApp`，然后使用依赖注入将 `myMod` 的功能注入到 `myApp` 中。清单 21.4\
  \ 显示了将 `myApp` 模块作为 AngularJS 应用程序实现的 HTML。注意，它同时使用了 `controllerA` 和 `controllerB`\
  \ 控制器。它们之所以能被使用，是因为 `myMod` 模块被注入到了 `myApp` 模块中。\n\n按照以下步骤构建模块并实现依赖注入：\n\n1. 添加\
  \ `lesson21/inject_custom.html` 和 `lesson21/js/inject_custom.js` 文件。\n\n2. 将清单 21.3\
  \ 和清单 21.4 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n\n\n\n3. 以下代码行定义了 `myMod` 模块：\n\n\
  ```\n01 var myMod = angular.module('myMod', []);\n```\n\n4. 以下代码行为 `myMod` 定义了一个名为\
  \ `modMsg` 的值提供器，其中包含一个简单的字符串：\n\n```\n02 myMod.value('modMsg', 'Hello from My Module');\n\
  ```\n\n5. 以下代码行定义了 `controllerB`，并将 `$scope` 和 `modMsg` 提供器注入其中，然后设置了将在模板中显示的 `message`\
  \ 值：\n\n```\n03 myMod.controller('controllerB', ['$scope', 'modMsg',\n04                                  function($scope,\
  \ msg) {\n05   $scope.message = msg;\n06 }]);\n```\n\n6. 然后，以下代码行将 `myApp` 定义为以\
  \ `myMod` 作为可注入提供器的模块。其余行与前面步骤中定义的 `value` 提供器和控制器类似：\n\n```\n07 var myApp = angular.module('myApp',\
  \ ['myMod']);\n```\n\n7. 请注意，在清单 21.4 的以下行中，只有 `myApp` 模块被引导，但来自 `myMod` 的 `controllerB`\
  \ 能够被使用，因为它被注入到了 `myApp` 中：\n\n```\n02 <html ng-app=\"myApp\">\n. . .\n07     <div\
  \ ng-controller=\"controllerA\">\n. . .\n11     <div ng-controller=\"controllerB\"\
  >\n```\n\n8. 图 21.2 显示了生成的网页，其中每个模块的控制器显示不同的消息。\n\n![Image](img/image00995.jpeg)\n\
  \n**图 21.2** 实现依赖注入，为模块和控制器提供额外功能。\n\n**清单 21.3 inject_custom.js 在控制器和模块定义中实现依赖注入**\n\
  \n```\n01 var myMod = angular.module('myMod', []);\n02 myMod.value('modMsg', 'Hello\
  \ from My Module');\n03 myMod.controller('controllerB', ['$scope', 'modMsg',\n04                                  function($scope,\
  \ msg) {\n05   $scope.message = msg;\n06 }]);\n07 var myApp = angular.module('myApp',\
  \ ['myMod']);\n08 myApp.value('appMsg', 'Hello from My App');\n09 myApp.controller('controllerA',\
  \ ['$scope', 'appMsg',\n10                                  function($scope, msg)\
  \ {\n11   $scope.message = msg;\n12 }]);\n```\n\n**清单 21.4 inject_custom.html 使用\
  \ HTML 代码实现依赖于另一个模块的 AngularJS 模块**\n\n```\n01 <!doctype html>\n02 <html ng-app=\"\
  myApp\">\n03   <head>\n04     <title>AngularJS Dependency Injection</title>\n05   </head>\n\
  06   <body>\n07     <div ng-controller=\"controllerA\">\n08       <h2>Application\
  \ Message:</h2>\n09       {{message}}\n10     </div><hr>\n11     <div ng-controller=\"\
  controllerB\">\n12       <h2>Module Message:</h2>\n13       {{message}}\n14     </div>\n\
  15     <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n\
  16     <script src=\"/js/injector_custom.js\"></script>\n17   </body>\n18 </html>\n\
  ```\n\n* * *\n\n## 将配置块和运行块应用于模块\n\n现在你已经理解了模块与依赖注入之间的关系，需要了解实现 AngularJS 模块的过程。AngularJS\
  \ 模块分两个阶段实现：配置阶段和运行阶段。以下部分将讨论这些阶段以及向 AngularJS 模块添加提供器的基本过程。\n\n### 添加配置块\n\nAngularJS\
  \ 模块的配置阶段在模块定义时执行。在此阶段，任何定义的提供器都会注册到依赖注入器中。你应该只将配置和提供器代码放在配置块内。\n\n通过调用 `Module`\
  \ 对象实例上的 `config()` 方法来实现配置块，语法如下：\n\n`config(function([injectable, . . .]))`\n\n\
  传入一个带有可注入参数的函数。可注入参数通常是提供器服务函数，例如 `$provide`。\n\n以下是一个基本配置块的示例：\n\n```\nvar myModule\
  \ = angular.module('myModule', []).\n  config(function($provide, $filterProvider)\
  \ {\n    $provide.value(\"startTime\", new Date());\n    $filterProvider.register('myFilter',\
  \ function(){});\n});\n```\n\n注意，`$provide` 和 `$filterProvider` 服务被传入 `config` 函数。它们用于向注入器服务注册一个名为\
  \ `startTime` 的值提供器和一个名为 `myFilter` 的过滤器提供器。\n\n### 添加运行块\n\n整个配置块完成后，AngularJS\
  \ 模块的运行阶段可以执行。在此阶段，你可以实现实例化模块所需的任何代码。不能在运行块中实现任何提供器代码，因为此时整个模块应该已经配置完毕并注册到依赖注入器中。\n\
  \n运行块是放置需要在应用程序根级别执行的事件处理程序（例如身份验证处理程序）的好地方。\n\n通过调用 `Module` 对象的 `run()` 方法来实现\
  \ `run` 块，语法如下：\n\n`run(function([injectable, . . .]))`\n\n传入一个带有实例 `injectable`\
  \ 参数的函数。`injectable` 参数应该只是注入器的实例，因为配置应该已经完成。\n\n以下是延续上一个示例的 `run` 块的基本实现：\n\n```\n\
  myModule.run(function(startTime) {\n  startTime.setTime((new Date()).getTime());\n\
  });\n```\n\n注意，之前在 `config()` 部分定义的 `startTime` 实例被传入 `run()` 函数。这允许 `run()` 函数将\
  \ `startTime` 提供器更新为一个新值。\n\n* * *\n\n## 自己动手：实现配置块和运行块\n\n在本示例中，你将学习如何实现非常基本的配置块和运行块。清单\
  \ 21.5 中的代码使用 `config()` 方法实现了两个提供器 `configTime` 和 `runTime`，它们是 JavaScript 的 `Date`\
  \ 对象，将用于在配置时和运行时显示时间值。\n\n按照以下步骤构建应用程序并实现配置块和运行块：\n\n1. 添加 lesson21/config_run_blocks.html\
  \ 和 lesson21/js/config_run_blocks.js 文件。\n\n2. 将清单 21.5 和清单 21.6 中的代码添加到 HTML 和\
  \ JavaScript 文件中。\n\n3. 以下来自清单 21.5 的代码实现了配置块，定义了两个名为 `configTime` 和 `runTime` 的\
  \ `value` 提供器。注意，在第 5–7 行，实现了一个简单的循环来注入延迟，模拟配置期间可能引起的延迟：\n\n```\n02 myModule.config(function($provide)\
  \ {\n03     $provide.value(\"configTime\", new Date());\n04     $provide.value(\"\
  runTime\", new Date());\n05     for(var x=0; x<1000000000; x++){\n06       var y\
  \ = Math.sqrt(Math.log(x));\n07     }\n08 });\n```\n\n4. 然后，以下代码定义了更改 `runTime`\
  \ 值的运行块：\n\n```\n09 myModule.run(function(configTime, runTime) {\n10   runTime.setTime((new\
  \ Date()).getTime());\n11 });\n```\n\n\n\n\n\n**5.** 在以下几行中，控制器被定义并注入了 `configTime`\
  \ 和 `runTime`，它们被添加到作用域值中：\n\n点击此处查看代码图片\n\n```\n12 myModule.controller('controllerA',['$scope',\
  \ 'configTime', 'runTime',\n13     function($scope, configTime, runTime){\n14  \
  \ $scope.configTime = configTime;\n15   $scope.runTime = runTime;\n16 }]);\n```\n\
  \n**6.** 来自清单 21.6 的模板显示了 `configTime` 和 `runTime` 的值，如图 21.3 所示。\n\n![图片](img/image00996.jpeg)\n\
  \n**图 21.3** 实现配置和运行块，这些块设置并利用 JavaScript Date 对象来显示每个块的执行时间。\n\n**清单 21.5 config_run_blocks.js\
  \ 在 AngularJS 模块中实现配置和运行块**\n\n点击此处查看代码图片\n\n```\n01 var myModule = angular.module('myApp',\
  \ []);\n02 myModule.config(function($provide) {\n03     $provide.value(\"configTime\"\
  , new Date());\n04     $provide.value(\"runTime\", new Date());\n05     for(var\
  \ x=0; x<1000000000; x++){\n06       var y = Math.sqrt(Math.log(x));\n07     }\n\
  08 });\n09 myModule.run(function(configTime, runTime) {\n10   runTime.setTime((new\
  \ Date()).getTime());\n11 });\n12 myModule.controller('controllerA',['$scope', 'configTime',\
  \ 'runTime',\n13     function($scope, configTime, runTime){\n14   $scope.configTime\
  \ = configTime;\n15   $scope.runTime = runTime;\n16 }]);\n```\n\n**清单 21.6 run_blocks.html\
  \ 使用 HTML 代码显示在 AngularJS 模块的配置和运行块中生成的 configTime 和 runTime 值**\n\n点击此处查看代码图片\n\
  \n```\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03   <head>\n04     <title>AngularJS\
  \ Configuration and Run Blocks</title>\n05   </head>\n06   <body>\n07     <div ng-controller=\"\
  controllerA\">\n08       <hr>\n09       <h2>Config Time:</h2>\n10       {{configTime}}\n\
  11       <hr>\n12       <h2>Run Time:</h2>\n13       {{runTime}}\n14     </div><hr>\n\
  15     <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"></script>\n\
  16     <script src=\"js/config_run_blocks.js\"></script>\n17   </body>\n18 </html>\n\
  ```\n\n### 总结\n\n依赖注入使你能够定义可注入到其他 AngularJS 组件中的提供者功能。提供者功能包含在模块内部，并通过注入器服务进行注册。提供者定义了如何构建功能，以便当另一个组件声明对提供者的依赖时，可以创建并注入提供者对象的实例。\n\
  \nAngularJS 提供了一个相当健壮的依赖注入模型，使你能够定义不同类型的服务提供者。使用依赖注入而非全局定义，可以使你的代码更加模块化且更易于维护。在本课中，你了解了依赖注入模型，并看到了如何在模块和控制器组件中实现它。\n\
  \n### 问答\n\n**问.** AngularJS 应用程序的控制器和指令代码会在运行块之前还是之后执行？\n\n**答.** 执行顺序是：配置块、运行块、指令编译、控制器、指令链接。\n\
  \n### 实践\n\n实践部分包含一组问题和答案，旨在巩固你对本课时所学内容的理解。请先尝试回答问题，然后再查看答案。\n\n#### 测验\n\n**1.**\
  \ 哪个块先执行——运行块还是配置块？\n\n**2.** 你会将提供者代码放在运行块还是配置块中？\n\n**3.** 如何将 `$scope` 和 `$http`\
  \ 服务注入到控制器中？\n\n**4.** 判断正误：你可以将一个控制器注入到另一个控制器中。\n\n#### 测验答案\n\n**1.** 配置块先执行。\n\
  \n**2.** 你应该将提供者代码放在配置块中，因为可注入对象的实例应在执行运行块之前创建。\n\n**3.** 使用类似于以下代码的方式：\n\n点击此处查看代码图片\n\
  \n```\napp.controller('myController', ['$scope', '$http'], function($scope, $http)\
  \ { ...\n```\n\n**4.** 正确\n\n#### 练习\n\n**1.** 修改清单 21.1 中的代码，在弹出警告中显示 screenX 和\
  \ screenY 的值。你可以通过在消息中添加以下代码来实现：\n\n点击此处查看代码图片\n\n```\n+ ' ' + $window.screenX +\
  \ 'x'+ $window.screenY\n```\n\n**2.** 修改清单 21.3 和 21.4 中的代码，添加第三个名为 controllerC\
  \ 的控制器，用于显示第三条消息。\n\n## 第 22 课 将作用域实现为数据模型\n\n本课你将学到：\n\n![图片](img/image00767.jpeg)\
  \ 作用域如何与数据模型关联\n\n![图片](img/image00767.jpeg) 作用域如何与 AngularJS 模板关联\n\n![图片](img/image00767.jpeg)\
  \ 嵌套控制器中的作用域层次结构如何工作\n\n![图片](img/image00767.jpeg) 理解作用域的生命周期\n\nAngularJS 应用程序最重要的方面之一就是作用域。作用域不仅提供了模型中表示的数据，还将\
  \ AngularJS 应用程序的所有其他组件（如模块、控制器、服务和模板）绑定在一起。本课解释了作用域与其他 AngularJS 组件之间的关系。\n\n作用域提供了绑定机制，使得当模型数据发生变化时，DOM\
  \ 元素和其他代码能够被更新。在本课中，你将了解根作用域和子作用域。你还将学习作用域层次结构以及如何实现它们。\n\n## 理解作用域\n\n在 AngularJS\
  \ 中，作用域充当应用程序的数据模型。它是任何以某种方式依赖数据的应用程序中最关键的部分之一，因为它充当了将视图、业务逻辑和服务器端数据粘合在一起的胶水。理解作用域的工作原理可以使你设计出更高效、代码更少且更易于理解的\
  \ AngularJS 应用程序。\n\n以下部分讨论了作用域与应用程序、控制器、模板和服务器端数据之间的关系。还有一节涵盖了作用域的生命周期，以帮助你了解作用域在应用程序生命周期中是如何构建、操作和更新的。\n\
  \n#### 根作用域与应用程序之间的关系\n\n当应用程序启动时，会创建一个根作用域。根作用域在应用程序级别存储数据，你可以通过 `$rootScope` 服务访问它。根作用域数据应在模块的\
  \ `run()` 块中初始化，但你也可以在模块的组件中访问它。为了说明这一点，以下代码在根作用域级别定义了一个值，然后在控制器中访问它：\n\n点击此处查看代码图片\n\
  \n```\nangular.module('myApp', [])\n.run(function($rootScope) {\n    $rootScope.rootValue\
  \ = 5;\n})\n.controller('myController', function($scope, $rootScope) {\n  $scope.value\
  \ = 10;\n  $scope.difference = function() {\n        return $rootScope.rootValue\
  \ - $scope.value;\n    };\n});\n```\n\n#### 作用域与控制器之间的关系\n\n\n\n\n控制器是旨在通过增强作用域来提供业务逻辑的代码片段。你可以通过应用程序的\
  \ `Model` 对象上的 `controller()` 方法来创建控制器。该函数将控制器注册为模块中的提供者，但不会创建控制器的实例。实例的创建发生在 `ng-controller`\
  \ 指令在 AngularJS 模板中被链接时。\n\n`controller()` 方法接受控制器名称作为第一个参数，依赖项数组作为第二个参数。例如，以下代码定义了一个控制器，它使用依赖注入来访问名为\
  \ `start` 的 `value` 提供者：\n\n```\nangular.module('myApp', []).\n  value('start',\
  \ 200).\n  controller('Counter', ['$scope', 'start',\n                         \
  \ function($scope, startingValue) {\n  }]);\n```\n\n注意，`value()` 和 `controller()`\
  \ 方法通过点号 `.` 符号链式调用。你会在 AngularJS 应用中经常看到这种用法。当在 AngularJS 中创建控制器的新实例时，也会创建一个特定于该控制器的新子作用域，并且可以通过注入到上述\
  \ `Counter` 控制器中的 `$scope` 服务来访问它。同样在前面的示例中，`start` 提供者被注入到控制器中，并作为 `startingValue`\
  \ 传递给控制器函数。参数注入基于它们在传递给 `controller()` 函数的数组中的位置。\n\n控制器必须初始化创建并添加到其中的作用域的状态。控制器还负责附加到该作用域的任何业务逻辑。这可能意味着处理作用域的更新变化、操作作用域值，或根据作用域状态发出事件。\n\
  \n---\n\n## 自己动手：实现一个基本控制器\n\n在本示例中，你将有机会实际操作控制器代码。清单 22.1 展示了如何实现一个控制器，它利用依赖注入、初始化一些值，并使用\
  \ `inc()`、`dec()` 和 `calcDiff()` 函数实现基本的业务逻辑。清单 22.2 展示了一个基本的 AngularJS HTML 模板，它提供了查看和操作作用域中存储的值的视图。\n\
  \n按照以下步骤构建应用程序并实现应用和控制器：\n\n1. 添加 `lesson22/scope_controller.html` 和 `lesson22/js/scope_controller.js`\
  \ 文件。\n\n2. 将清单 22.1 和清单 22.2 中的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 以下来自清单 22.1 的代码实现了一个\
  \ AngularJS 模块，并带有一个名为 `Counter` 的控制器：\n\n   ```\n   01 angular.module('myApp',\
  \ []).\n   02   value('start', 200).\n   03   controller('Counter', '$scope', 'start',\n\
  \   04                           function($scope, start) {\n   ```\n\n4. 然后以下几行在\
  \ `Counter` 控制器的 `$scope` 中定义了值：\n\n   ```\n   05     $scope.start = start;\n  \
  \ 06     $scope.current = start;\n   07     $scope.difference = 0;\n   08     $scope.change\
  \ = 1;\n   ```\n\n5. 注意，在以下几行中，定义了操作 `current` 和 `difference` 值的函数 `inc()`、`dec()`\
  \ 和 `calcDiff()`：\n\n   ```\n   09     $scope.inc = function() {\n   10       $scope.current\
  \ += $scope.change;\n   11       $scope.calcDiff();\n   12     };\n   13     $scope.dec\
  \ = function() {\n   14       $scope.current -= $scope.change;\n   15       $scope.calcDiff();\n\
  \   16     };\n   17     $scope.calcDiff = function() {\n   18       $scope.difference\
  \ = $scope.current - $scope.start;\n   19     };\n   ```\n\n6. 清单 22.2 中的代码实现了一个\
  \ AngularJS 模板，它提供了一个数字输入来设置作用域中的 `change` 值，以及调用 `inc()` 和 `dec()` 来改变当前值的 + 和\
  \ – 按钮。该模板还使用简单的 AngularJS 过滤器显示起始值、当前值和差值。图 22.1 展示了网页的运行效果。你可以设置增量/减量值，然后点击 +/-\
  \ 按钮来递减当前值，并查看作用域中差值的变化。\n\n![图片\n\n**图 22.1** 一个基本的 AngularJS 应用程序，它在作用域中存储初始值和当前值，然后显示差值以说明作用域数据交互。\n\
  \n**清单 22.1 `scope_controller.js` 实现一个基本控制器，该控制器使用依赖注入、初始化作用域值并实现业务逻辑**\n\n---\n\
  \n```\n01 angular.module('myApp', []).\n02   value('start', 200).\n03   controller('Counter',\
  \ ['$scope', 'start',\n04                           function($scope, start) {\n\
  05     $scope.start = start;\n06     $scope.current = start;\n07     $scope.difference\
  \ = 0;\n08     $scope.change = 1;\n09     $scope.inc = function() {\n10       $scope.current\
  \ += $scope.change;\n11       $scope.calcDiff();\n12     };\n13     $scope.dec =\
  \ function() {\n14       $scope.current -= $scope.change;\n15       $scope.calcDiff();\n\
  16     };\n17     $scope.calcDiff = function() {\n18       $scope.difference = $scope.current\
  \ - $scope.start;\n19     };\n20   }]);\n```\n\n---\n\n**清单 22.2 `scope_controller.html`\
  \ HTML 模板，使你能够看到作用域中的数据根据递增和递减值动态变化**\n\n---\n\n```\n01 <!doctype html>\n02 <html\
  \ ng-app=\"myApp\">\n03   <head>\n04     <title>AngularJS Basic Scope</title>\n\
  05   </head>\n06   <body>\n07     <div ng-controller=\"Counter\">\n08       <span>Change\
  \ Amount:</span>\n09       <input type=\"number\" ng-model=\"change\"><hr>\n10 \
  \      <span>Starting Value:</span>\n11       {{start}}\n12       <br>\n13     \
  \  <span>CurrentValue:</span>\n14       {{current}}\n15       <button ng-click='inc()'>+</button>\n\
  16       <button ng-click='dec()'>-</button><hr>\n17       <span>Difference:</span>\n\
  18       {{difference}}\n19     </div>\n20     <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n21     <script src=\"js/scope_controller.js\"></script>\n22   </body>\n\
  23 </html>\n```\n\n---\n\n---\n\n#### 作用域与模板之间的关系\n\n模板为 AngularJS 应用程序提供了视图。HTML\
  \ 元素通过 `ng-controller` 属性被定义为控制器。在控制器 HTML 元素及其子元素内部，该控制器的作用域可用于表达式和其他 AngularJS\
  \ 功能。\n\n作用域中的值可以使用 `ng-model` 指令直接链接到模板中 `<input>`、`<select>` 和 `<textarea>` 元素的值。该指令将元素的值链接到作用域中的属性名。当用户更改输入元素的值时，作用域会自动更新。例如，以下代码将\
  \ `<input>` 元素的数字值链接到名为 `valueA` 的作用域：\n\n```\n<input type=\"number\" ng-model=\"\
  valueA\" />\n```\n\n你可以通过使用 `{{expression}}` 语法将作用域属性甚至函数添加到模板的表达式。括号内的代码会被求值，结果会显示在渲染后的视图中。例如，如果作用域包含名为\
  \ `valueA` 和 `valueB` 的属性，你可以在模板的表达式里引用这些属性，如下所示：\n\n```\n{{valueA + valueB}}\n\
  ```\n\n\n\n\n在模板中定义 AngularJS 指令时，你也可以使用作用域属性和函数。例如，`ng-click` 指令将浏览器点击事件绑定到作用域中名为\
  \ `addValues()` 的函数，并传递作用域中 `valueA` 和 `valueB` 属性的值：\n\n点击此处查看代码图片\n\n```html\n\
  <span ng-click=\"addValues(valueA, valueB\")>添加值 {{valueA}} & {{valueB}}</span>\n\
  ```\n\n请注意，在这段代码中，`{{}}` 括号是必需的。然而，在 `addValues()` 函数调用中，它们不是必需的。这是因为 `ng-click`\
  \ 和其他 AngularJS 指令会自动将其作为表达式求值。\n\n* * *\n\n## 自己动手：在 AngularJS 模板中查看作用域值\n\n在本例中，你将所有这些概念整合到一个非常基础的示例中，以便轻松理解模型与作用域之间的关系。清单\
