  div\").toggle();\n03   $(this).toggleClass(\"collapse\");\n04   return false;\n\
  05 }\n```\n\n**6.** 保存所有三个文件，然后在 Web 浏览器中打开 HTML 文档，如图 14.3 所示。你应该能够展开和折叠树形视图的层级。\n\
