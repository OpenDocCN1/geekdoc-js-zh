  \ 方法。通过使用不同的 `easing`，你可以改变动画的过渡速率，从而调整动画效果。其中一个最好的例子是将弹跳过渡应用于改变元素位置的动画。\n\n通过一个示例最能说明这一点。在本示例中，你将对一个图像的移动应用多种动画效果。图像是一个简单的球，点击后会在屏幕上移动。在最终位置，球会撞到一根针，并使用\
  \ `explode` 效果“爆开”。本示例的目的是让你了解这些效果如何应用于动画过程。\n\n示例代码见清单 17.10、17.11 和 17.12。请按照以下步骤创建动态网页：\n\
  \n1. 在 Eclipse 中，添加 `lesson17/animation_effects.html`、`lesson17/js/animation_effects.js`\
  \ 和 `lesson17/css/animation_effects.css` 文件。\n2. 将清单 17.10 和清单 17.12 中的代码添加到 HTML\
  \ 和 CSS 文件中。`<img>` 元素设置为 `fixed` 定位，以便通过更改 CSS 位置来动画化其移动。\n3. 打开 `animation_effects.js`\
  \ 文件，并添加清单 17.11 顶部的 `coords` 数组。该数组提供了定位坐标和缓动函数名称，这些将被 `click` 处理程序使用。\n4. 以下 `.ready()`\
  \ 函数为球添加了 `click` 处理程序：\n\n```javascript\n14 $(document).ready(function(){\n15 \
  \  $(\"#ball\").click(reposition);\n16 });\n```\n\n5. 添加以下 `click` 处理程序 `reposition()`\
  \ 代码。该函数会弹出一个坐标，并在 `.animate()` 调用中使用这些值来动画化球的移动。缓动值通过 `coord` 对象的 `easing` 属性设置。注意，`callback`\
  \ 处理程序会循环回到 `reposition()` 函数。当没有更多坐标时，会对球应用 `explode` 效果：\n\n```javascript\n07\
