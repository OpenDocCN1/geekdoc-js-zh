  31 </html>\n```\n\n---\n\n### 使用`$q`服务提供延迟响应\n\nAngularJS 提供的一个极其有用的服务是`$q`服务。`$q`服务是一个\
  \ promise/deferred 响应实现。由于并非所有服务都能立即响应请求，因此需要将响应延迟到服务准备好响应时。这就是`$q`服务的用武之地。其思想是，你可以发出一个请求，而不是直接获得响应，你将得到一个服务将响应的承诺。然后，请求应用可以分配一个回调函数，该函数应在延迟请求成功完成或失败时执行。\n\
  \n要利用`$q`服务进行延迟响应，首先需要使用以下语法创建一个 deferred 对象：\n\n```javascript\nvar deferred = $q.defer();\n\
  ```\n\n获得 deferred 对象后，你可以通过访问`promise`属性来传递 promise。例如，以下行将`promise`返回给调用应用：\n\n\
  点击此处查看代码图片\n\n```javascript\nfunction makeDeferredRequest(){\n  var deferred = $q.defer();\n\
  \  return deferred.promise;\n}\n```\n\n然后，请求应用可以在`promise`对象上调用`then()`方法，使用以下语法注册`successCallback`、`errorCallback`和`notifyCallback`函数：\n\
  \n点击此处查看代码图片\n\n```javascript\npromise.then(successCallback, [errorCallback], [notifyCallback])\n\
  ```\n\n以下展示了`then()`函数的示例实现：\n\n点击此处查看代码图片\n\n```javascript\nvar promise = makeDeferredRequest();\n\
  promise.then(\n  function successCallback(value){\n    //handle success\n  },\n\
  \  function errorCallback(value){\n    //handle error\n  },\n  function notifyCallback(value){\n\
  \    //handle notify\n  },\n```\n\n从 deferred 服务端，你可以使用表 27.6 中描述的方法来通知请求应用请求的状态。\n\
  \n![Image](img/image01049.jpeg)\n\n**表 27.6** `$q`服务的 deferred 对象上可用的方法\n\n第 28\
  \ 课（创建你自己的自定义 AngularJS 服务）中的“实现数据库访问服务”一节展示了使用`$q`服务处理远程数据库请求的延迟响应的良好示例。\n\n###\
  \ 总结\n\nAngularJS 服务是单例对象，你可以将其注册到依赖注入器中。控制器和其他 AngularJS 组件（包括其他服务）可以使用它们。AngularJS\
  \ 以服务的形式提供了许多后端功能，例如`$http`，它使你能够轻松地将 Web 服务器通信集成到 AngularJS 应用中。\n\n在本课中，你还学习了几个内置服务，例如`$cookieStore`、`$q`、`$window`、`$location`、`$animate`和`$cacheFactory`。这些以及其他\
  \ AngularJS 服务可用于轻松地将功能注入到你的控制器、指令和自定义服务中。\n\n### 问答\n\n**问.** AngularJS 提供的内置服务是否作为单例运行？\n\
  \n**答.** 是的，但它们是惰性单例，意味着只有在某个组件依赖它时才会被实例化。\n\n### 实践\n\n#### 测验\n\n**1.** `$rootElement`\
  \ AngularJS 服务的作用是什么？\n\n**2.** 我应该使用哪个 AngularJS 服务来向服务器发送和接收请求？\n\n**3.** 应该使用哪个\
  \ AngularJS 服务来从 URL 获取查询字符串？\n\n**4.** 哪个 AngularJS 服务允许你处理异步请求的延迟操作？\n\n#### 测验答案\n\
  \n**1.** `$rootElement`提供对 AngularJS 应用根元素的访问。\n\n**2.** `$http`\n\n**3.** `$location`\n\
  \n**4.** `$q`\n\n#### 练习\n\n1. 修改清单 27.5 和清单 27.6 中的代码，添加并管理第二个用于收藏蛋糕的 cookie。你应该实现与\
  \ cookie 相同样式的单选按钮组。\n\n\n\n\n**2.** 修改清单 27.7、27.8 和 27.9 中的代码，为图像移动添加动画效果。你需要将图像的位置改为绝对定位，并添加一个名为\
  \ `.slideRight` 的新类。然后实现一个类似于 `.fadeOut` 的动画，使用 jQuery 来动画化位置而非透明度。\n\n## 第 28 课：创建你自己的自定义\
  \ AngularJS 服务\n\n### 本课你将学到：\n\n![Image](img/image00767.jpeg) 有哪些方法可用于创建 AngularJS\
  \ 自定义服务\n\n![Image](img/image00767.jpeg) 如何使用工厂提供者（factory provider）定义自定义服务\n\n\
  ![Image](img/image00767.jpeg) 如何使用服务提供者（service provider）定义自定义服务\n\n![Image](img/image00767.jpeg)\
  \ 如何构建一个使用全部四种自定义服务的应用程序\n\n![Image](img/image00767.jpeg) 如何实现一个异步数据库访问服务\n\nAngularJS\
  \ 在内置服务中提供了大量功能；然而，你还需要能够实现自己的自定义服务，以提供特定的功能。当你需要为应用程序提供基于任务的功能时，就应该实现自定义服务。\n\n\
  在实现自定义服务时，你需要将服务视为一块可重用的代码，用于执行一个或多个相关任务。然后你可以将它们设计并分组到自定义模块中，这些模块可以轻松地被多个 AngularJS\
  \ 应用程序使用。\n\n本课介绍 AngularJS 自定义服务。然后通过几个自定义 AngularJS 服务实现的示例，让你更清楚地了解如何设计和构建自己的服务。\n\
  \n### 理解 AngularJS 自定义服务\n\nAngularJS 允许你创建自己的自定义服务，为需要它们的 AngularJS 组件提供功能。正如你在上一课中所见，内置的\
  \ AngularJS 服务为 AngularJS 应用程序提供了多种功能。使用自定义服务，你可以通过多种方式定制、增强和扩展这些功能。\n\n你可能会在代码中实现四种主要类型的服务：`value`、`constant`、`factory`\
  \ 和 `service`。以下各节将介绍这些服务。\n\n#### 定义 value 服务\n\n你可以使用非常简单的 `value` 服务来定义一个单一的值，并将其作为服务提供者注入。`value`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`object` 是你想提供的任何 JavaScript 对象：\n\n`value(name, object)`\n\
  \n例如：\n\n点击此处查看代码图片\n\n```\nvar app = angular.module('myApp', []);\napp.value('myValue',\
  \ {color:'blue', value:'17'});\n```\n\n#### 定义 constant 服务\n\n`constant` 服务与 `value`\
  \ 服务基本相同，区别在于 `constant` 服务在构建 `Module` 对象的配置阶段可用，而 `value` 服务则不可用。`constant` 方法使用以下语法，其中\
  \ `name` 是服务名称，`object` 是你想提供的任何 JavaScript 对象：\n\n`constant(name, object)`\n\n\
  例如：\n\n点击此处查看代码图片\n\n```\nvar app = angular.module('myApp', []);\napp.constant('myConst',\
  \ \"Constant String\");\n```\n\n#### 使用工厂提供者构建 factory 服务\n\n`factory` 方法提供了在服务中实现功能的能力。它还可以依赖于其他服务提供者，使你能够构建模块化的代码。`factory`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`factoryProvider` 是一个构建工厂服务的提供者函数：\n\n`factory(name,\
  \ factoryProvider)`\n\n与 `value` 或 `constant` 服务不同，你可以向 `factory` 方法注入其他服务，并且它返回带有相应功能的服务对象。该功能可以是一个复杂的\
  \ JavaScript 服务、一个值或一个简单的函数。例如，以下代码实现了一个 `factory` 服务，该服务返回一个将两个数相加的函数：\n\n点击此处查看代码图片\n\
  \n```\nvar app = angular.module('myApp', []);\napp.constant('myConst', 10);\napp.factory('multiplier',\
  \ ['myConst', function (myConst) {\n  return function(value) { return value + myConst;\
  \ };\n}]);\n```\n\n#### 使用对象定义 service 服务\n\n`service` 方法提供了在服务中实现功能的能力。`service`\
  \ 方法与 `factory` 方法具有相同的功能；然而，`service` 方法的实现方式与 `factory` 方法不同。选择哪一个取决于语义。\n\n`service`\
  \ 方法接受一个构造函数作为第二个参数，并使用它来创建一个新的对象实例。`service` 方法使用以下语法，其中 `name` 是服务名称，`constructor`\
  \ 是一个构造函数：\n\n`service(name, constructor)`\n\n`service` 方法也可以接受依赖注入。以下代码实现了一个基本的服务方法，它提供了\
  \ `add()` 函数和 `multiply()` 函数：\n\n点击此处查看代码图片\n\n```\nvar app = angular.module('myApp',\
  \ []);\napp.constant('myConst', 10);\n\nfunction ConstMathObj(myConst) {\n  this.add\
  \ = function(value){ return value + myConst; };\n  this.multiply = function(value){\
  \ return value * myConst; };\n}\n\napp.service('constMath', ['myConst', ConstMathObj]\
  \ );\n```\n\n注意，首先创建了 `ConstMathObj` 构造函数，然后 `service()` 方法调用它，并使用依赖注入插入 `myConst`\
  \ 服务。\n\n### 将自定义服务集成到你的 AngularJS 应用程序中\n\n当你开始为应用程序实现 AngularJS 服务时，你会发现有些服务非常简单，而另一些则会变得非常复杂。服务的复杂性通常反映了它所提供的底层数据和功能的复杂性。本节的目的在于提供一些不同类型自定义服务的基本示例，以说明如何实现和使用它们。\n\
  \n以下各节都包含一个示例，用以说明自定义服务的不同方面。第一个示例旨在展示如何实现不同类型的服务。第二个示例展示了服务的可重用性，第三个示例则展示了服务交互的不同视角。\n\
  \n* * *\n\n自己动手：实现一个使用全部四种服务的简单应用程序\n\n在本例中，你将构建 `constant`、`value`、`factory` 和\
  \ `service` 服务。目的是学习如何实现每一种服务，以及如何在应用程序中使用多种类型的服务。\n\n清单 28.1 中的代码展示了如何将 `value`、`constant`、`factory`\
  \ 和 `service` 服务集成到一个模块中。清单 28.2 中的代码实现了加载并运行该应用程序的 AngularJS 模板。\n\n按照以下步骤构建使用全部四种服务的应用程序：\n\
  \n1. 添加 `lesson28/service_custom_censor.html` 和 `lesson28/js/service_custom_censor.js`\
  \ 文件。\n\n2. 将清单 28.1 和清单 28.2 中所示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 清单 28.1 中的以下行创建了一个名为\
  \ `censorWords` 的简单 `value` 服务，其中包含要审查的单词数组：\n\n点击此处查看代码图片\n\n```\n02 app.value('censorWords',\
  \ [\"can't\", \"quit\", \"fail\"]);\n```\n\n4. 以下行创建了一个名为 `repString` 的 `constant`\
  \ 服务，其中包含用于替换审查单词的字符串：\n\n\n\n\n\n点击此处查看代码图片\n\n```\n03 app.constant('repString',\
  \ \"****\");\n```\n\n5. 以下代码实现了一个名为 `censorF` 的 `factory` 服务，该服务注入了 `censorWords`\
  \ 和 `repString`。该服务返回一个函数，该函数接受一个输入字符串，并使用 replace 将 `censorWords` 列表中的任何单词替换为 `repString`\
  \ 的值：\n\n   点击此处查看代码图片\n\n   ```js\n   04 app.factory('censorF', ['censorWords',\
  \ 'repString',\n   05                         function (cWords, repString) {\n \
  \  06   return function(inString) {\n   07     var outString = inString;\n   08\
  \     for(i in cWords){\n   09       var regex = new RegExp(cWords[i], \"ig\");\n\
  \   10       outString = outString.replace(regex, repString);\n   11     }\n   12\
  \     return outString;\n   13   };\n   14 }]);\n   ```\n\n6. 以下代码通过首先定义一个名为 `CensorObj`\
  \ 的函数，然后将其与 `censorWords` 和 `repString` 一起注入到 `app.service()` 方法中，实现了一个名为 `censorS`\
  \ 的 `service` 服务。与 `factory` 服务类似，该服务也接受一个字符串并返回审查后的结果：\n\n   点击此处查看代码图片\n\n   ```js\n\
  \   15 function CensorObj(cWords, repString) {\n   16   this.censor = function(inString){\n\
  \   17     var outString = inString;\n   18     for(i in cWords){\n   19       var\
  \ regex = new RegExp(cWords[i], \"ig\");\n   20       outString = outString.replace(regex,\
  \ repString);\n   21     }\n   22     return outString;\n   23   };\n   24   this.censoredWords\
  \ = function(){\n   25     return cWords;\n   26   };\n   27 }\n   28 app.service('censorS',\
  \ ['censorWords', 'repString', CensorObj]);\n   ```\n\n7. 控制器在第 27–37 行定义，并注入了 `censorF`\
  \ 和 `censorS`。请注意，在以下几行中，可以直接在控制器内部调用 `censorF` 和 `censorS`：\n\n   点击此处查看代码图片\n\n\
  \   ```js\n   36     $scope.censoredByFactory = censorF(newValue);\n   37     $scope.censoredByService\
  \ = censorS.censor(newValue);\n   ```\n\n8. 在浏览器中打开 清单 28.2 中的 `service_custom_censor.html`\
  \ 文件，加载显示审查单词并提供文本输入以输入短语的 AngularJS 模板。该短语显示两次，一次由 `censorF` 审查，一次由 `censorS` 审查。图\
  \ 28.1 展示了正在运行的 AngularJS 应用程序。\n\n   ![图片](img/image01050.jpeg)\n\n   图 28.1 在\
  \ AngularJS 控制器中使用多个自定义服务来审查短语中的单词。\n\n### 清单 28.1 service_custom_censor.js 在 AngularJS\
  \ 控制器中实现和使用多个自定义服务\n\n点击此处查看代码图片\n\n---\n\n```js\n01 var app = angular.module('myApp',\
  \ []);\n02 app.value('censorWords', [\"can't\", \"quit\", \"fail\"]);\n03 app.constant('repString',\
  \ \"****\");\n04 app.factory('censorF', ['censorWords', 'repString',\n05       \
