  \ 事件处理程序 `filterColumn()`，该处理程序将根据在该列输入框中输入的文本对列进行筛选。`input` 和 `column` 参数在第 65\
  \ 行传递给处理程序。使用 `.each()` 方法获取每一行指定列的单元格值。对于数值列，如果该值小于输入值，则隐藏该行。对于字符串列，如果在单元格的字符串值中未找到输入的字符串值，则隐藏该行：\n\
  \n点击此处查看代码图片\n\n```javascript\n30 function filterColumn(input, column){\n31   $(\"\
  tbody tr\").show().each(function(){\n32     var header = $(\"th:eq(\"+ column +\"\
  )\");\n33     var filterVal = input.val();\n34     var rowVal = this.cells[column].innerHTML;\n\
  35     if(header.data(\"numeric\") ){\n36       if(parseFloat( filterVal ) > parseFloat(\
  \ rowVal )) {\n37         $(this).hide(); }}\n38     else {\n39       if(rowVal.indexOf(filterVal)\
  \ < 0) { $(this).hide(); }}\n40   });\n41 }\n```\n\n### 5. 添加以下 `compare()` 函数，该函数接受两个行元素\
  \ `a` 和 `b`、一个 `column` 编号、一个 `numeric` 标志以及一个排序 `order` 值。该代码比较行 `a` 和行 `b` 的列值，并根据单元格值的大小关系返回正确的排序值：\n\
  \n点击此处查看代码图片\n\n```javascript\n04 function compare(a, b, column, numeric, order){\n\
  05   var aValue = a.cells[column].innerHTML;\n06   var bValue = b.cells[column].innerHTML;\n\
  07   if (numeric) { aValue = parseFloat(aValue );\n08                  bValue =\
  \ parseFloat(bValue ); }\n09   if (aValue < bValue) return order;\n10   if (aValue\
  \ > bValue) return -order;\n11   return 0;\n12 }\n```\n\n### 6. 添加以下 `click` 处理程序\
  \ `sortColumn()`，当用户单击列标题时，该处理程序将对列进行排序。该处理程序使用 `compare()` 函数对表格行进行排序，然后按正确顺序将它们重新追加到表格中。该处理程序还会为该列的标题和单元格元素设置正确的类：\n\
  \n点击此处查看代码图片\n\n```javascript\n13 function sortColumn(header, column){\n14   var\
  \ rows = $(\"tbody tr\");\n15   rows.sort(function(a, b){\n16       return compare(a,\
  \ b, column, header.data(\"numeric\"),\n17                      header.data(\"order\"\
  ));\n18     });\n19   $(rows).each(function(){ $(\"tbody\").append($(this)); });\n\
  20   header.data(\"order\", -header.data(\"order\"));\n21   $(\"span\").removeClass(\"\
  ascending descending\");\n22   $(\"td\").removeClass(\"sortColumn\");\n23   if(header.data(\"\
  order\") > 0) {\n24     header.children(\"span\").addClass(\"ascending\"); }\n25\
  \   else {\n26     header.children(\"span\").addClass(\"descending\"); }\n27   $(\"\
  tbody tr td:nth-child(\"+ (column + 1) +\")\")\n28     .addClass(\"sortColumn\"\
  );\n29 }\n```\n\n### 7. 保存所有三个文件，然后在 Web 浏览器中打开 HTML 文档，如图 14.2 所示。你应该能够更改列的排序顺序，并使用文本输入框筛选显示的行。\n\
