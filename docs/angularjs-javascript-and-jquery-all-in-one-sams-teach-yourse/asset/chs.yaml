  \ 清单 23.8 filters.html 一个 AngularJS 模板，实现了多种过滤器以修改渲染视图中显示的数据\n\n点击此处查看代码图片\n\n```\n\
  01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03   <head>\n04     <title>AngularJS\
  \ Filters</title>\n05   </head>\n06   <body>\n07     <div ng-controller=\"myController\"\
  >\n08       <h2>Basic Filters</h2>\n09       Number: {{123.45678|number:3}}<br>\n\
  10       Currency: {{123.45678|currency:\"$\"}}<br>\n11       Date: {{ currentDate\
  \ | date:'yyyy-MM-dd HH:mm:ss Z'}}<br>\n12       JSON: {{ JSONObj | json }}<br>\n\
