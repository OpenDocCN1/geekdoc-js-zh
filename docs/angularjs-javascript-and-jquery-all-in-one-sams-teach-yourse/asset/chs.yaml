  \ Arch</th>\n17       <td>Utah</td>\n18       <td>March 1, 1872</td>\n19       <td><img\
  \ src=\"/images/arch.jpg\" width=\"100\" />\n20     </tr>\n21     <tr>\n22     \
  \  <th>Washington Monument</th>\n23       <td>Washington D.C.</td>\n24       <td>March\
  \ 1, 1872</td>\n25       <td><img src=\"/images/washington.jpg\" width=\"100\" />\n\
  26     </tr>\n27     <tr>\n28       <th>Tikal</th>\n29       <td>Guatemala</td>\n\
  30       <td>November 19, 1919</td>\n31       <td><img src=\"/images/pyramid.jpg\"\
  \ width=\"100\" />\n32     </tr>\n33   </table>\n34 </body>\n35 </html>\n```\n\n\
  * * *\n\n### 实现表单元素\n\nHTML 中另一组非常有用的标签是表单标签。这些标签提供了渲染用户输入表单的基本构建块，使你能够从用户那里获取输入。浏览器知道如何渲染表单元素，以显示文本框、按钮和列表等内容。\n\
  \n以下是在 jQuery 和 JavaScript 中用于创建动态表单元素的一些常见表单标签：\n\n- ![Image](img/image00767.jpeg)\
  \ `<form>` — 这是表单的根元素。所有其他元素都包含在其中。\n- ![Image](img/image00767.jpeg) `<fieldset>`\
  \ — 作为一个容器，允许你将多个表单元素分组在一起。在 HTML5 中，你可以设置 fieldset 的 `disabled` 属性，以禁用它接受用户输入。你还可以使用\
  \ jQuery 和 JavaScript 访问 fieldset 的子元素，并通过代码修改它们。\n- ![Image](img/image00767.jpeg)\
  \ `<legend>` — 告诉浏览器为 fieldset 添加一个标题。\n- ![Image](img/image00767.jpeg) `<label>`\
  \ — 允许你将标签元素与表单中的 `<input>` 元素关联起来，方法是将 `for` 属性设置为 `<input>` 元素的 `id` 属性值。这样做的好处是，输入元素的鼠标事件也会在\
  \ `<label>` 上触发。\n- ![Image](img/image00767.jpeg) `<input>` — input 标签实际上是多种输入组件的包装器。浏览器渲染的输入类型取决于\
  \ `type` 属性的值。以下是可以指定在 input 标签中的类型元素列表：`button`、`checkbox`、`color`、`date`、`datetime`、`email`、`file`、`hidden`、`image`、`month`、`number`、`password`、`radio`、`range`、`reset`、`search`、`submit`、`tel`、`text`、`time`、`url`\
  \ 和 `week`。\n- ![Image](img/image00767.jpeg) `<textarea>` — 与其他输入不同，它提供了一个可调整大小的区域，用户可以在其中输入多行文本。`cols`\
  \ 和 `rows` 属性定义了初始大小。\n- ![Image](img/image00767.jpeg) `<select>` — 作为下拉列表项的容器。\n\
  - ![Image](img/image00767.jpeg) `<option>` — 在 `<select>` 元素内部使用，用于定义列表中的单个项。选中项的\
  \ `value` 属性也是 `<select>` 元素的 `value`。\n- ![Image](img/image00767.jpeg) `<button>`\
  \ — 定义一个可点击的按钮元素。按钮的 `type` 属性告诉浏览器是使用该按钮提交表单、重置值，还是作为简单的输入按钮。\n\n表单元素具有一组不同的属性，用于访问和修改元素的外观和行为。以下是一些比较重要的属性：\n\
  \n\n\n\n\n![Image](img/image00767.jpeg) `name` — 此选项指定在提交表单时可使用的名称。\n\n![Image](img/image00767.jpeg)\
  \ `value` — 此选项指定表单元素的值。对于 `text <input>` 等元素，你在 `value` 中指定的内容将作为文本添加到渲染后的文本框中。`value`\
  \ 属性也可以通过 JavaScript 访问，因此你可以直接从 JavaScript 获取任何表单元素的值。\n\n![Image](img/image00767.jpeg)\
  \ `disabled` — 添加此属性后，元素会显示，但会呈现为禁用状态，用户无法与该表单元素交互。当你通过 JavaScript 或 jQuery 启用或禁用元素时，该值会被动态修改。`disabled`\
  \ 属性是布尔类型，因此无需包含值。以下示例展示了如何包含 `disabled` 属性：\n\n点击此处查看代码图片\n\n```\n<input type=\"\
  text\" disabled />\n```\n\n* * *\n\n## 动手实践：为网页添加表单\n\n在本示例中，你将向网页添加一个包含不同元素的表单。完成的示例如清单\
  \ 3.6 所示，渲染出的网页表单如图 3.10 所示，包含多种表单元素。通过以下示例中学习的基础知识，你将能够创建几乎任何你需要的自定义表单：\n\n1. 在\
  \ `lesson03` 文件夹中创建一个名为 `forms.html` 的新 HTML 文档（与本书网站上的文件名一致）。\n\n2. 添加适当的 `<html>`、`<head>`\
  \ 和 `<body>` 标签。\n\n3. 添加一个 `<form>` 元素。\n\n4. 在 `<form>` 元素内部，添加以下 `<fieldset>`\
  \ 来请求信息。`<fieldset>` 包含一个提供标题的 `<legend>` 元素；两个基本的 `text <input>` 标签，用于姓名、出发地、目的地和日期；然后是一个包含四个\
  \ `<option>` 子元素的 `<select>` 元素，用于提供航空公司下拉列表。图 3.10 显示了渲染后的 `<fieldset>`，周围有边框并包含这些元素。\n\
  \n点击此处查看代码图片\n\n```\n08        <fieldset>\n09           <legend>Contact Info:</legend>\n\
  10           Name: <input type=\"text\" name=\"name\">\n11             Origin: <input\
  \ type=\"text\" name=\"address\"><br>\n12             Destination: <input type=\"\
  text\" name=\"city\">\n13             Flight Date: <input type=\"text\" name=\"\
  zip\"><br>\n14         <select name=\"Airline\">\n15           <option value=\"\
  DA\">Delta</option>\n16           <option value=\"PJ\">Private Jet</option>\n17\
  \           <option value=\"Heli\">Helicopter</option>\n18           <option value=\"\
  EG\">Eagles</option>\n19         </select>\n20       </fieldset>\n```\n\n5. 接下来，添加单选按钮以选择单程或往返。在表单中添加以下\
  \ `<label>` 和 `<input>` 字段。`<input>` 元素的 `type` 属性设置为 `radio`。另外，请注意 `<label>` 元素包含一个\
  \ `for` 属性，将其链接到 `radio <input>` 元素。由于 `<label>` 与 `<input>` 关联，当你点击标签时，会切换单选按钮。\n\
  \n点击此处查看代码图片\n\n```\n21       <input id=\"One WayRB\" type=\"radio\"\n22       \
  \       name=\"travelPlan\" value=\"One way\">\n23       <label for=\"One WayRB\"\
  >One Way</label>\n24       <input id=\"Round TripRB\" type=\"radio\"\n25       \
  \       name=\"travelPlan\" value=\"round trip\">\n26       <label for=\"Round TripRB\"\
  >Round Trip</label><br>\n```\n\n6. 通过添加以下 `<textarea>` 元素来添加评论元素。请注意，`rows` 和 `cols`\
  \ 属性定义了大小，并且我们在文本区域中初始包含了单词“`comments`”，而不是在外部添加标签。末尾的 `<br>` 标签使后续表单元素显示在新行上：\n\
  \n点击此处查看代码图片\n\n```\n27       <textarea rows=\"10\" cols=\"30\">comments</textarea><br>\n\
  ```\n\n7. 通过添加以下 `<input>` 和 `<label>` 来提供一个复选框，用于启用常旅客里程。`<input>` 元素的 `type` 设置为\
  \ `checkbox`，以便浏览器将其渲染为复选框。此外，`<label>` 元素使用 `for` 属性，使用户可以点击复选框或标签来切换其选中状态：\n\n\
  点击此处查看代码图片\n\n```\n28       <input di='newsCB' type=\"checkbox\" name=\"news\" value=\"\
  news\">\n29         <label for=\"newsCB\">\n30           I would like to enroll\
  \ into the frequent flyer miles program\n31         </label><br>\n```\n\n8. 添加以下代码以包含两个按钮元素：一个\
  \ `submit` 按钮和一个 `reset` 按钮。点击提交按钮时，浏览器会提交表单。点击重置按钮时，表单中的值会被重置：\n\n点击此处查看代码图片\n\n\
  ```\n32       <button type=\"submit\" name=\"SubmitButton\"\n33               value=\"\
  Submit\">Submit</button>\n34       <button type=\"reset\" name=\"ResetButton\"\n\
  35               value=\"Reset\">Reset</button>\n```\n\n9. 保存文档，并在 Web 浏览器中打开以下\
  \ URL 以查看渲染结果，如图 3.10 所示：\n\n点击此处查看代码图片\n\n```\nhttp://localhost/lesson03/forms.html\n\
  ```\n\n![Image](img/image00816.jpeg)\n\n**图 3.10** 一个 HTML 表单示例，展示了由清单 3.6 创建的各种表单元素。\n\
  \n**清单 3.6 forms.html** 生成包含文本、单选和选择输入的 HTML 表单\n\n点击此处查看代码图片\n\n* * *\n\n```\n\
  01 <html>\n02   <head>\n03     <title>Forms</title>\n04     <meta charset=\"UTF-8\"\
