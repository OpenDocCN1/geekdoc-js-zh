  ```\n\n---\n\n#### 数组\n\n`Array` 对象提供了一种存储和处理一组其他对象的方法。数组可以存储数字、字符串或其他 JavaScript\
  \ 对象。你可以使用几种方法来创建 JavaScript 数组；例如，以下语句创建了同一个数组的三个相同版本：\n\n```\nvar arr = [\"one\"\
  , \"two\", \"three\"];\nvar arr2 = new Array();\narr2[0] = \"one\";\narr2[1] = \"\
  two\";\narr3[2] = \"three\";\nvar arr3 = new Array();\narr3.push(\"one\");\narr3.push(\"\
  two\");\narr3.push(\"three\");\n```\n\n要获取数组中的元素数量，可以使用 `Array` 对象的 `length` 属性。例如：\n\
  \n```\nvar numOfItems = arr.length;\n```\n\n数组是基于零索引的，这意味着第一个元素位于索引 0，依此类推。你可以通过使用\
  \ `length` 属性进行减法来反向访问数组。例如，在以下代码中，变量 `first` 的值将是 Monday，变量 `last` 的值将是 Friday：\n\
  \n```\nvar week = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"\
  ];\nvar first = week[0];\nvar last = week[week.length-1];\n```\n\n`Array` 对象有几个内置函数，允许你以各种方式访问和操作数组。表\
  \ 6.4 描述了附加到 `Array` 对象的方法，这些方法使你能够操作数组内容。\n\n![Image](img/image00859.jpeg)\n\n\
  **表 6.4** 用于操作 JavaScript 数组的 Array 对象方法\n\n为了帮助你开始使用 `Array` 对象提供的功能，以下部分描述了可以使用\
  \ `Array` 对象方法完成的一些常见任务。\n\n##### 合并数组\n\n你可以像合并 `String` 对象一样合并数组，使用 `+` 语句或 `concat()`\
  \ 方法。在以下代码中，`arr3` 最终与 `arr4` 相同：\n\n```\nvar arr1 = [1,2,3];\nvar arr2 = [\"three\"\
  , \"four\", \"five\"]\nvar arr3 = arr1 + arr2;\nvar arr4 = arr1.concat(arr2);\n\
  ```\n\n---\n\n提示\n\n你可以合并一个数字数组和一个字符串数组。数组中的每个项目将保持其自身的对象类型。然而，当你使用数组中的项目时，需要跟踪包含多种数据类型的数组，以免出现问题。\n\
  \n---\n\n##### 遍历数组\n\n你可以使用 `for` 或 `for`/`in` 循环遍历数组。以下代码演示了使用每种方法遍历数组中的每个项目：\n\
  \n```\nvar week = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"\
  ];\nfor (var i=0; i<week.length; i++){\n  document.write(\"<li>\" + week[i] + \"\
  </li>\");\n}\nfor (dayIndex in week){\n  document.write(\"<li>\" + week[dayIndex]\
  \ + \"</li>\");\n}\n```\n\n##### 将数组转换为字符串\n\n`Array` 对象的一个有用功能是能够使用 `join()` 方法将字符串的元素组合成一个由特定分隔符分隔的\
  \ `String` 对象。例如，以下代码将时间组件连接成 12:10:36 的格式：\n\n```\nvar timeArr = [12,10,36];\n\
  var timeStr = timeArr.join(\":\");\n```\n\n##### 检查数组是否包含某个项目\n\n通常，你需要检查数组是否包含某个特定项目。你可以通过使用\
  \ `indexOf()` 方法来实现。如果在列表中未找到该项目，将返回 –1。以下函数在 week 数组中存在某个项目时向浏览器写入一条消息：\n\n```\n\
  function message(day){\n  var week = [\"Monday\", \"Tuesday\", \"Wednesday\", \"\
