  ```\n\n* * *\n\n* * *\n\n### 摘要\n\nAngularJS 最强大的功能之一就是能够创建自己的自定义指令。使用 `Module`\
  \ 对象上的 `directive()` 方法，在代码中实现自定义指令非常简单。然而，由于指令的实现方式多种多样，它们也可能非常复杂。本课让你初步了解了 AngularJS\
  \ 中自定义指令的能力。试着花些时间练习示例并编写一些自己的指令，尽可能熟悉它们的工作原理。\n\n### 问答\n\n**问. 有没有办法确保我为自定义指令选择的名称不会被其他人使用？**\n\
  \n**答.** 目前没有办法强制执行这一点。最好的方法是使用一个独特的缩写作为自定义 AngularJS 指令的前缀。\n\n**问. 将自定义指令实现为标签、属性、类或注释名称哪种更好？**\n\
  \n**答.** 最佳实践是在合理的情况下使用标签名称或属性名称，而不是注释和类名称。\n\n### 实践练习\n\n本练习包含一组问题和答案，旨在巩固你对本课所学内容的理解。请先尝试回答问题，然后再查看答案。\n\
  \n#### 小测验\n\n**1.** 判断正误：在自定义指令中使用作用域时，该作用域必须与父作用域共享。\n\n**2.** 判断正误：属性 `'type'`\
  \ 可以设置为非 HTML 根节点的字符串。\n\n**3.** 当向指令添加控制器时，指示注入器服务在父级上下文中查找控制器的语法是什么？\n\n**4.**\
  \ 在自定义指令中操作 DOM 应使用哪个（些）函数？\n\n#### 小测验答案\n\n**1.** 错误。作用域可以共享父作用域、继承父作用域，或者拥有自己的独立作用域。\n\
  \n**2.** 正确。`'type'` 不仅可用于 HTML，还可用于 `svg` 和 `math` 元素。\n\n**3.** 在指令中使用 `require:\
  \ '^controllerName'` 选项。\n\n**4.** `link` 和 `compile` 函数。\n\n#### 练习\n\n**1.** 修改清单\
  \ 25.1 和 25.2 中的示例代码。添加一个类似于 `bwidth` 参数的 `bheight` 参数，用于设置盒子的高度和宽度。\n\n**2.** 修改清单\
  \ 25.3 和 25.4 中的示例代码。添加一个名为 `movit` 的新指令，用于改变元素在页面上的 x 和 y 位置。你需要将元素设置为绝对定位。\n\n\
  **3.** 修改清单 25.6 中的示例代码，创建第二个 `<my-photos>` 块，并包含 10 到 15 张额外的图片，以便你了解重用自定义指令是多么容易。\n\
  \n## 第 26 课 使用事件与模型中的数据进行交互\n\n本课你将学到：\n\n![Image](img/image00767.jpeg) 如何使用 `$watch`\
  \ 跟踪作用域变量\n\n![Image](img/image00767.jpeg) 如何使用 `$watchCollection` 跟踪变化\n\n![Image](img/image00767.jpeg)\
  \ 如何触发自定义事件\n\n![Image](img/image00767.jpeg) 如何处理自定义事件\n\n![Image](img/image00767.jpeg)\
  \ 如何实现自定义事件\n\n事件是大多数 AngularJS 应用程序中最关键的组成部分之一。事件使用户能够与元素交互，也让应用程序知道何时执行特定任务。本课讨论你将在\
  \ AngularJS 应用程序中使用和处理的多种事件类型。\n\n具体来说，本课讨论四种类型的事件，包括浏览器事件、用户交互事件、基于作用域的事件和自定义事件。你在之前的课程中已经接触过其中一些。之所以将这部分内容放在这里，是因为前面的课程为接下来的讨论提供了背景。\n\
  \n###### 浏览器事件\n\n浏览器本身会触发若干事件。从某种程度上说，这些也是用户交互事件；但为了讨论方便，我将它们分开。浏览器事件包括文档加载完成时的\
  \ ready 事件、浏览器窗口大小改变时的 resize 事件等。\n\n了解用户视图何时发生变化非常有用。你已经知道如何使用 `.on()` 函数为事件添加处理程序；问题在于将处理程序放在哪里。我见过的最佳解决方案是在整个应用程序的\
  \ run 块中注册一个处理程序。然后，任何信息都可以通过作用域模型或缓存服务提供给后续组件。\n\n## 用户交互事件\n\n你已经接触过用户交互事件。这些事件包括鼠标和键盘事件，以及其他事件如\
  \ focus 和 blur 事件。通常有两个地方可以实现用户事件交互。一个是使用 `ng` 事件指令（如 `ng-click`）以及视图和控制器代码中的简单交互。第二个地方是在自定义指令的\
  \ link 函数中添加用户事件交互。\n\n你在之前的课程中已经接触过这两种方法；在本课中，你将看到可以选择使用哪一种。使用内置的 `ng` 事件指令（如 `ngClick`）的优点是，对于简单需求，你无需增加创建自定义指令的复杂性。\n\
  \n不过，使用 `ng` 事件指令也有几个缺点。一是你不应该在控制器中进行 DOM 操作，而控制器正是你可以为 `ng` 指令定义处理程序的地方。另一个缺点是，每次需要该功能时，你都必须模板中实现\
  \ `ngClick` 代码。例如，考虑以下为元素添加鼠标事件处理程序的模板代码：\n\n点击此处查看代码图片\n\n```\n<span\n  ng-mouseenter=\"\
  mouseEntered(event)\"\n  ng-mouseleave=\"mouseLeft(event)\"\n  ng-click=\"clicked(event)\"\
  >\n<span>\n```\n\n这段代码不算太糟，但如果有多个位置需要相同的功能呢？如果它们都在 `ng-repeat` 块中，那还好办，否则就很麻烦。一个好的经验法则是：如果你要在多个地方使用该功能，并且肯定会在多个应用程序中重用它，那么你应该定义一个实现这些处理程序的自定义指令。\n\
  \n### 添加 $watches 以跟踪作用域变化事件\n\n你将使用的另一个常见事件不是由浏览器触发的，而是由模型中的数据变化触发的。这种能力使你能够对模型变化做出反应，而无需在值可能发生变化的每个点添加代码。这种能力非常有用，因为模型中的数据可能以各种方式变化——用户输入、服务更新等。\n\
  \n#### 使用 $watch 跟踪作用域变量\n\n\n\n\n要添加处理作用域值变化的能力，你需要使用 AngularJS 内置的 `$watch` 功能，在作用域中为变量添加一个\
  \ `$watch`。作用域中的 `$watch` 函数使用以下语法：\n\nClick here to view code image\n\n```\n$watch(watchExpression,\
  \ listener, [objectEquality])\n```\n\n`watchExpression` 是要监视的作用域中的表达式。该表达式会在每次 `$digest()`\
  \ 时被调用，并返回将被监视的值。`listener` 定义了一个函数，当 `watchExpression` 的值变为新值时，该函数会被调用。如果 `watchExpression`\
  \ 被改为它已经设置的值，则不会调用监听器。`objectEquality` 是一个布尔值，当为 true 时，将使用 `angular.equals()` 函数来判断相等性，而不是更严格的\
  \ `==!` 运算符。使用 `objectEquality` 时要小心，因为在复杂对象上，它可能会导致内存和性能消耗增加。\n\n以下示例展示了如何在作用域变量\
  \ `score` 上添加 `$watch`：\n\nClick here to view code image\n\n```\n$scope.score =\
  \ 0;\n\n$scope.$watch('score', function(newValue, oldValue) {\n\n  if(newValue >\
  \ 10){\n\n    $scope.status = 'win';\n\n  }\n\n});\n```\n\n#### 使用 $watchGroup 跟踪多个作用域变量\n\
  \nAngularJS 还提供了使用 `$watchGroup` 方法监视表达式数组的功能。`$watchGroup` 方法的工作方式与 `$watch` 相同，只是第一个参数是一个要监视的表达式数组。监听器将收到一个数组，其中包含被监视变量的新值和旧值。例如，如果你想监视变量\
  \ `score` 和 `time`，可以这样使用：\n\nClick here to view code image\n\n```\n$scope.score\
  \ = 0;\n\n$scope.time = 0;\n\n$scope.$watchGroup(['score', 'time'], function(newValues,\
  \ oldValues) {\n\n  if(newValues[0] > 10){\n\n    $scope.status = 'win';\n\n  }\
  \ else if (newValues[1] > 5{\n\n    $scope.status = 'times up';\n\n});\n```\n\n\
  #### 使用 $watchCollection 跟踪作用域中对象属性的变化\n\n你还可以使用 `$watchCollection` 方法监视对象的属性。`$watchCollection`\
  \ 方法将对象作为第一个参数，并监视该对象的属性。如果是数组，则会监视数组中的各个值。例如：\n\nClick here to view code image\n\
  \n```\n$scope.scores = [5, 10, 15, 20];\n\n$scope.$watchGroup('scores', function(newValue,\
  \ oldValue) {\n\n  $scope.newScores = newValue;\n\n});\n```\n\n* * *\n\n### 动手实践：在控制器中实现监视\n\
  \n在本例中，你将有机会在控制器中实现一个监视、一个监视组和一个监视集合，以跟踪变化并动态更新视图。清单 26.1 和 26.2 中的代码演示了一个简单的示例，实现了\
  \ `$watch`、`$watchGroup` 和 `$watchCollection` 方法。\n\n清单 26.1 中的代码实现了一个控制器，该控制器在作用域中存储了值\
  \ `myColor`、`hits` 和 `misses`，以及一个名为 `myObj` 的对象。清单 26.2 中的代码实现了一个 AngularJS 模板，该模板提供了更改值并查看更新后的监视项的交互。\n\
  \n按照以下步骤构建监视作用域值的应用程序：\n\n1. 添加 `lesson26/scope_watch.html` 和 `lesson26/js/scope_watch.js`\
  \ 文件。\n2. 将 清单 26.1 和 清单 26.2 中显示的代码添加到 HTML 和 JavaScript 文件中。\n3. 清单 26.1 中的代码首先设置了几个作用域值，包括将被监视的\
  \ `myColor`、`hits` 和 `misses`。控制器还定义了 `setColor()`、`hit()` 和 `miss()` 函数，允许从浏览器更改这些值。\n\
  4. 清单 26.1 中的以下代码行在作用域中的 `myColor` 值上实现了一个 `$watch`，这样每次 `myColor` 改变时，`myObj.color`\
  \ 值也会随之调整。\n5. 清单 26.1 中的以下代码行在作用域中的 `hits` 和 `misses` 值上实现了一个 `$watchGroup`，这样每次它们改变时，`myObj.hits`\
  \ 和 `myObj.misses` 的值也会改变。\n6. 清单 26.1 中的以下代码行在作用域中的 `myObj` 对象上实现了一个 `$watchCollection`，这样每次\
  \ `myObj` 改变时，作用域中的 `changes` 值就会递增，以跟踪 `myColor`、`hits` 和 `misses` 变化的次数。\n7. 清单\
  \ 26.2 中的代码实现了一个 AngularJS 模板，使用户能够使用鼠标选择颜色并递增 `hits` 和 `misses` 变量。对象和变化值显示在底部，展示了\
  \ `$watch` 方法如何检测并更新作用域的变化。\n8. 在浏览器中打开 `scope_watch.html` 文件，更改颜色并递增 hits 和 misses，以查看\
  \ `myObj` 和 `changes` 中被监视的值的变化。图 26.1 显示了渲染后的 AngularJS 网页。\n\n![Image](img/image01034.jpeg)\n\
  \n**图 26.1** 使用 `$watch()`、`$watchGroup()` 和 `$watchCollection()` 处理程序监视作用域变量的值。\n\
  \n**清单 26.1 scope_watch.js 实现 `$watch()`、`$watchGroup()` 和 `$watchCollection()`\
  \ 处理程序以监视作用域变量的值**\n\nClick here to view code image\n\n* * *\n\n```\n01 angular.module('myApp',\
  \ [])\n02 .controller('myController', function ($scope) {\n03   $scope.mColors =\
  \ ['red', 'green', 'blue'];\n04   $scope.myColor = '';\n05   $scope.hits = 0;\n\
  06   $scope.misses = 0;\n07   $scope.changes = 0;\n08   $scope.myObj = {color: '',\
  \ hits: '', misses: ''};\n09   $scope.setColor = function (color){\n10     $scope.myColor\
  \ = color;\n11   };\n12   $scope.hit = function (){\n13     $scope.hits += 1;\n\
  14   };\n15   $scope.miss = function (){\n16     $scope.misses += 1;\n17   };\n\
  18   $scope.$watch('myColor', function (newValue, oldValue){\n19     $scope.myObj.color\
  \ = newValue;\n20   });\n21   $scope.$watchGroup(['hits', 'misses'], function (newValue,\
  \ oldValue){\n22     $scope.myObj.hits = newValue[0];\n23     $scope.myObj.misses\
  \ = newValue[1];\n24   });\n25   $scope.$watchCollection('myObj', function (newValue,\
  \ oldValue){\n26     $scope.changes += 1;\n27   });\n28 });\n```\n\n* * *\n\n**清单\
  \ 26.2 scope_watch.html HTML 模板代码，提供与 清单 26.1 中定义的作用域和控制器的视图和交互**\n\nClick here\
  \ to view code image\n\n* * *\n\n```\n01 <!doctype html>\n02 <html ng-app=\"myApp\"\
  >\n03   <head>\n04     <title>AngularJS Scope Variable Watch</title>\n05     <style>\n\
  06       span { cursor: pointer; }\n07     </style>\n08   </head>\n09   <body>\n\
  10     <h2>Watching Values in the AngularJS Scope</h2>\n11     <div ng-controller=\"\
  myController\">\n12       Select Color:\n13       <span ng-repeat=\"mColor in mColors\"\
  >\n14         <span ng-style=\"{color: mColor}\"\n15               ng-click=\"setColor(mColor)\"\
  >\n16           {{mColor}}</span>\n17       </span><hr>\n18       <span ng-click=\"\
  hit()\">[+]</span>\n19       Hits: {{hits}}<br>\n20       <span ng-click=\"miss()\"\
  >[+]</span>\n21       misses: {{misses}}<hr>\n22       Object: {{myObj|json}} <br>\n\
  23       Number of Changes: {{changes}}\n24     </div>\n25     <script src=\"http://code.angularjs.org/1.3.8/angular.min.js\"\
  ></script>\n26     <script src=\"js/scope_watch.js\"></script>\n27   </body>\n28\
  \ </html>\n```\n\n* * *\n\n### 发出和广播自定义事件\n\n\n\n\n作用域的一个强大特性是能够在作用域层次结构中发出和广播事件。事件使您能够向作用域中的不同层级发送通知，告知某个事件已发生。事件可以是您选择的任何内容，例如值已更改或达到阈值。这在许多情况下非常有用，例如让子作用域知道父作用域中的值已更改，反之亦然。\n\
  \n#### 向父作用域层次结构发出自定义事件\n\n要从作用域发出事件，请使用 `$emit()` 方法。此方法通过父作用域层次结构向上发送事件。任何已注册该事件的祖先作用域都会收到通知。`$emit()`\
  \ 方法使用以下语法，其中 `name` 是事件名称，`args` 是传递给事件处理函数的零个或多个参数：\n\n点击此处查看代码图片\n\n```\nscope.$emit(name,\
  \ [args, . . .])\n```\n\n#### 向子作用域层次结构广播自定义事件\n\n您还可以通过使用 `$broadcast()` 方法，通过子作用域层次结构向下广播事件。任何已注册该事件的后代作用域都会收到通知。`$broadcast()`\
  \ 方法使用以下语法，其中 `name` 是事件名称，`args` 是传递给事件处理函数的零个或多个参数：\n\n点击此处查看代码图片\n\n```\nscope.$broadcast(name,\
  \ [args, . . .])\n```\n\n#### 使用监听器处理自定义事件\n\n要处理发出或广播的事件，请使用 `$on()` 方法。`$on()`\
  \ 方法使用以下语法，其中 `name` 是要监听的事件的名称：\n\n```\nscope.$on(name, listener)\n```\n\n`listener`\
  \ 参数是一个函数，它接受 `event` 作为第一个参数，并将 `$emit()` 或 `$broadcast()` 方法传递的任何参数作为后续参数。`event`\
  \ 对象具有以下属性：\n\n![图片](img/image00767.jpeg) `targetScope`：调用 `$emit()` 或 `$broadcast()`\
  \ 的作用域。\n\n![图片](img/image00767.jpeg) `currentScope`：当前正在处理事件的作用域。\n\n![图片](img/image00767.jpeg)\
  \ `name`：事件的名称。\n\n![图片](img/image00767.jpeg) `stopPropagation()`：一个函数，用于阻止事件在作用域层次结构中向上或向下传播。\n\
  \n![图片](img/image00767.jpeg) `preventDefault()`：一个函数，用于阻止浏览器事件中的默认行为，但仅执行您自己的自定义代码。\n\
  \n![图片](img/image00767.jpeg) `defaultPrevented`：一个布尔值，如果调用了 `event.preventDefault()`，则为\
  \ `true`。\n\n---\n\n#### 动手实践：在嵌套控制器中实现自定义事件\n\n在此示例中，您将使用自定义事件在两个控制器（一个嵌套在另一个中）之间通信更改。清单\
  \ 26.3 和 清单 26.4 中的代码提供了一个 AngularJS 应用程序和模板，演示了如何使用 `$emit()`、`$broadcast()` 和\
  \ `$on()` 在作用域层次结构中向上和向下发送和处理事件。\n\n在示例中，父作用域中存储了一个角色列表。您可以轻松单击列表中的角色，以显示子作用域中包含的角色信息。您还可以删除子作用域中的角色，这将从父作用域的列表中移除该角色。\n\
  \n请按照以下步骤构建具有嵌套控制器和作用域的应用程序：\n\n**1.** 添加 `lesson26/scope_events.html` 和 `lesson26/js/scope_events.js`\
  \ 文件。\n\n**2.** 将 清单 26.3 和 清单 26.4 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n**3.** 清单\
  \ 26.3 中的以下代码行实现了名为 `Characters` 的父作用域控制器。作用域中定义了一个角色名称数组，并且 `currentName` 值设置为该数组的第一个元素：\n\
  \n点击此处查看代码图片\n\n```\n02   controller('Characters', function($scope) {\n03     $scope.names\
  \ = ['Frodo', 'Aragorn', 'Legolas', 'Gimli'];\n04     $scope.currentName = $scope.names[0];\n\
  ...\n15   }).\n```\n\n**4.** 以下 `changeName()` 函数更改作用域中的 `currentName` 值，然后广播一个\
  \ `CharacterChanged` 事件。请注意，`changeName()` 使用 `this` 关键字来访问 `name` 属性。`name` 属性来自一个动态子作用域，该子作用域是由于在\
  \ 清单 26.4 中使用了以下指令来生成多个元素而创建的：\n\n点击此处查看代码图片\n\n```\n05     $scope.changeName =\
  \ function() {\n06       $scope.currentName = this.name;\n07       $scope.$broadcast('CharacterChanged',\
  \ this.name);\n08     };\n```\n\n**5.** 以下 `CharacterDeleted` 事件由 `$scope.$on('CharacterDeleted')`\
  \ 事件处理程序处理，并从列表中移除该角色，这将在网页中反映出来：\n\n点击此处查看代码图片\n\n```\n05     $scope.changeName\
  \ = function() {\n09     $scope.$on('CharacterDeleted', function(event, removeName){\n\
