  * * *\n\n* * *\n\n# 动手试一试：为图片添加缩放视图区域\n\n在本例中，你将使用自定义 AngularJS 指令替换`<img>`元素，并提供一个自动缩放视图区域，该区域显示在页面中图片的旁边。当你点击图片时，缩放视图区域将更新为图片的放大局部。\n\
  \n本练习的目的是向你展示 AngularJS 自定义指令如何通过具有丰富功能的新元素来扩展 HTML。此示例还说明了另一种情况，即你需要使用完整版 jQuery\
  \ 而非 jQuery lite 来获取图片的尺寸以及鼠标在图片中的位置。\n\n按照以下步骤构建缩放视图 AngularJS 应用程序：\n\n**1.**\
  \ 在你的代码中创建以下文件夹和文件结构：\n\n![Image](img/image00767.jpeg) `./lesson29/zooming.html`：项目的\
  \ AngularJS 模板。\n\n![Image](img/image00767.jpeg) `./lesson29/zoomit.html`：包含图片和缩放视图区域元素定义的\
  \ AngularJS 局部模板。\n\n![Image](img/image00767.jpeg) `./lesson29/js/zooming.js`：支持自定义标签指令的\
  \ AngularJS 应用程序。\n\n**2.** 将清单 29.7 中的代码添加到`zooming.js`文件中。这是一个 AngularJS 应用程序，它定义了一个名为`zoomit`的自定义\
  \ AngularJS 指令。`zoomit`指令仅通过`restrict: 'E'`限制为元素。另请注意，模板定义中的`src`属性被注入到`scope`中。\n\
  \n`zoomit`指令的功能在`controller`函数中实现。注意，创建了一个名为`zInfo`的对象，它包含`background-image`和`background-position`属性。`zInfo`作用域值将用于在清单\
  \ 29.8 的`zoomit.html`局部模板中设置缩放视图区域的`ng-style`属性。设置`background-image`和`background-position`属性可将图片添加到背景并定位缩放区域。\n\
  \n`imageClick()`函数会抑制默认的点击行为，然后将`event.target`元素作为 jQuery 对象获取。这里我们需要完整版 jQuery\
  \ 来获取图片在页面上的`height`、`width`和当前`offset`。然后我们可以计算鼠标点击位置相对于左侧的百分比`posX`和相对于顶部的百分比`posY`，并相应地设置`background-position`样式。\n\
  \n**清单 29.7 zooming.js AngularJS 应用程序，定义了一个名为 zoomit 的自定义 AngularJS 指令，该指令实现了一个带有缩放视图区域的`<img>`元素**\n\
  \n点击此处查看代码图片\n\n* * *\n\n```javascript\n01 angular.module('myApp', [])\n02 .controller('myController',\
  \ ['$scope', function($scope) {\n03 }])\n04 .directive('zoomit', function() {\n\
  05   return {\n06     restrict: 'E',\n07     scope: { src: '@'},\n08     controller:\
  \ function($scope) {\n09         $scope.zInfo = {\n10             \"background-image\"\
  : \"url(\" + $scope.src + \")\",\n11             \"background-position\": \"top\
  \ right\"\n12         };\n13         $scope.imageClick= function(event){\n14   \
  \        event.preventDefault();\n15           //使用完整版 jQuery 获取 offset、width 和\
  \ height\n```\n\n\n\n\n\n```\nvar elem = angular.element(event.target);\nvar posX\
  \ = Math.ceil((event.pageX - elem.offset().left) /\n                     elem.width()\
  \ * 100);\nvar posY = Math.ceil((event.pageY - elem.offset().top) /\n          \
  \           elem.height() * 100);\n$scope.pos = posX + \"% \" + posY + \"%\";\n\
  $scope.zInfo[\"background-position\"] = posX + \"% \" +\n                      \
  \               posY + \"%\";\n  };\n},\nlink: function(scope, element, attrs) {\n\
  \  },\ntemplateUrl: 'zoomit.html'\n  };\n});\n```\n\n---\n\n3. 将清单 29.8 中的代码添加到`zoomit.html`文件中。这段代码实现了`zoomit.html`局部模板，添加了`<img>`元素和一个`<div>`元素，该`<div>`将缩放后的图像作为背景。请注意，`ng-click`方法被设置为作用域中的`imageClick()`函数，并传递了`$event`。同时注意，`ng-style`被设置为作用域中的`zInfo`。\n\
  \n清单 29.8 zoomit.html AngularJS 局部模板，为图像和缩放视图区域实现`<img>`和`<div>`元素\n\n点击此处查看代码图片\n\
  \n---\n\n```\n<div>\n  <img src=\"{{src}}\"\n       ng-click=\"imageClick($event)\"\
  />\n  <div class=\"zoombox\"\n       ng-style=\"zInfo\"></div>\n</div>\n```\n\n\
  ---\n\n4. 将清单 29.9 中的代码添加到`zooming.html`文件中。这段代码包含 AngularJS 模板代码，为缩放视图区域和图像提供样式。请注意，`<zoomit>`元素像其他元素一样被添加，并且`src`属性的设置方式与`<img>`元素相同。还要注意，完整的\
  \ jQuery 库是在 AngularJS 库之前加载的。\n\n清单 29.9 zooming.html AngularJS 模板，为`<zoomit>`自定义\
  \ AngularJS 指令设置样式并实现\n\n点击此处查看代码图片\n\n---\n\n```\n<!DOCTYPE html>\n<html ng-app=\"\
  myApp\">\n  <head>\n    <title>Magnify</title>\n    <style>\n      .zoombox {\n\
  \        display: inline-block;\n        border: 3px ridge black;\n        width:\
