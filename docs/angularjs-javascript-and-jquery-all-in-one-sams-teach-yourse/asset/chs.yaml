  \ </html>\n```\n\n* * *\n\n* * *\n\n## 使用过滤器\n\nAngularJS 的一个强大特性是能够实现过滤器。过滤器是一种提供者，它挂接到表达式解析器中，并修改表达式的结果以便在视图中显示——例如，格式化时间或货币值。\n\
  \n你可以在表达式中使用以下语法实现过滤器：\n\n```\n{{ expression | filter}}\n```\n\n如果你将多个过滤器链接在一起，它们将按照你指定的顺序执行：\n\
  \n点击此处查看代码图片\n\n```\n{{ expression | filter | filter }}\n```\n\n某些过滤器允许你以函数参数的形式提供输入。你可以使用以下语法添加这些参数：\n\
  \n点击此处查看代码图片\n\n```\n{{ expression | filter:parameter1:parameter2 }}\n```\n\n此外，你可以通过依赖注入将过滤器（即提供者）添加到控制器和服务中。过滤器提供者的名称是过滤器名称加上`Filter`。例如，货币过滤器提供者名为`currencyFilter`。过滤器提供者作为一个函数，第一个参数是表达式，之后是任何其他参数。以下代码定义了一个控制器，它注入了`currencyFilter`并使用它来格式化结果。请注意，`currencyFilter`被添加到控制器的依赖注入中，并作为函数调用：\n\
  \n点击此处查看代码图片\n\n```\ncontroller('myController', ['$scope', 'currencyFilter',\n \
  \                           function($scope, myCurrencyFilter){\n  $scope.getCurrencyValue\
  \ = function(value){\n    return myCurrencyFilter(value, \"$USD\");\n  };\n}]);\n\
  ```\n\n#### 使用内置过滤器\n\nAngularJS 提供了几种类型的过滤器，使你能够轻松地在 AngularJS 模板中格式化字符串、对象和数组。表\
  \ 23.1 列出了 AngularJS 提供的内置过滤器。\n\n![图片](img/image01003.jpeg)![图片](img/image01004.jpeg)![图片](img/image01005.jpeg)\n\
  \n**表 23.1** 修改 AngularJS 模板中表达式的过滤器\n\n* * *\n\n动手试一试：使用过滤器控制数据的渲染方式\n\n在本例中，你将尝试使用\
  \ AngularJS 内置过滤器。清单 23.7 中的代码定义了一个 AngularJS 应用程序，其作用域中包含各种类型的数据。清单 23.8 中的代码实现了一个\
  \ AngularJS 模板，该模板使用一些基本过滤器来显示这些值。\n\n请按照以下步骤创建应用程序并在 AngularJS 表达式中实现过滤器：\n\n**1.**\
  \ 添加`lesson23/filters.html`和`lesson23/js/filters.js`文件。\n\n**2.** 将清单 23.7 和清单 23.8\
  \ 中所示的代码添加到 HTML 和 JavaScript 文件中。\n\n**3.** 以下代码实现了一个控制器，其作用域值包括日期、对象、字符串和数组对象：\n\
  \n点击此处查看代码图片\n\n```\n02   .controller('myController', function($scope) {\n03   \
  \  $scope.currentDate = new Date();\n04     $scope.JSONObj = { title: \"myTitle\"\
  \ };\n05     $scope.word=\"Supercalifragilisticexpialidocious\";\n06     $scope.days=['Monday',\
  \ 'Tuesday', 'Wednesday',\n07                  'Thursday', 'Friday'];\n08   });\n\
