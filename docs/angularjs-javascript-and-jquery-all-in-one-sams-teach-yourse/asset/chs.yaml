  ### 应用 Selectable 小部件\n\n用户另一个常见需求是能够使用边界框轻松选择页面上的多个项目。`selectable` 小部件提供了这一功能，允许用户通过鼠标在可选择的元素内部绘制一个框（或“套索”）来圈选可选择的子元素。框内的项目将在列表中被选中。\n\
  \n表 18.8 描述了更常用的 selectable 选项。以下展示了如何将 `selectable` 小部件附加到一个元素，并将 `tolerance` 指定为\
  \ `fit` 的示例：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#ul1\"). selectable ({tolerance:\"\
  fit\"});\n```\n\n![Image](img/image00971.jpeg)\n\n**表 18.8 常用的 Selectable 小部件选项**\n\
  \nselectable 小部件还提供了额外的事件，以便在更改选择时可以将处理程序附加到 selectable 元素或其子元素上。表 18.9 列出了可以在 selectable\
  \ 项目上访问的事件。\n\n![Image](img/image00972.jpeg)\n\n**表 18.9 Selectable 小部件事件**\n\n\
  每个 selectable 事件都会传递事件对象以及一个 `ui` 对象，该对象将为每个代表 selectable 元素的事件提供一个值。例如，以下代码向一个元素添加了\
  \ `selectableselected` 事件，然后访问了 `selected` 属性：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#list1\").selectable();\n$(\"#list1\").on(\"selectableselected\", function(e,\
  \ ui){ ui.selected.effect(\"shake\");\n});\n```\n\n* * *\n\n> **注意：** `.ui-selecting`\
  \ 类会被附加到当前正在被选择的子元素上。当子元素被选中后，`.ui-selected` 类会被附加。这允许你在 CSS 中定义一些基本样式，而无需在 selectable\
  \ 事件处理程序中添加/移除类。\n\n* * *\n\n### 动手实践：创建可选择的集合\n\n在本示例中，你将在 `<list>` 和一组图片上实现 `selectable`。本示例的目的是让你了解实现\
  \ `selectable` 小部件的几种方式。你将有机会应用一些选项，并使用不同的事件处理程序与选择过程进行交互。\n\n示例代码位于清单 18.10、18.11\
  \ 和 18.12 中。按照以下步骤创建动态网页：\n\n1. 在 Eclipse 中，添加 `lesson18/selectable_sets.html`、`lesson18/js/selectable_sets.js`\
  \ 和 `lesson18/css/selectable_sets.css` 文件。\n\n2. 将清单 18.10 和清单 18.12 中所示的代码添加到 HTML\
  \ 和 CSS 文件中。注意在清单 18.12 中，为 `#set1` 和 `#set2` 都添加了 `.ui-selected` 和 `.ui-selecting`\
  \ 类。\n\n3. 打开 `selectable_sets.js` 文件并添加一个 `.ready()` 函数。\n\n4. 添加以下行来填充 `#set1`\
  \ 列表：\n\n   点击此处查看代码图片\n\n   ```javascript\n   02   for(var i=0; i<100; i++){\n\
  \   03     $(\"#set1\").append($(\"<p></p>\").html(\"Item \"+i)); }\n   ```\n\n\
  5. 添加以下行来在 `#set1` 上实现 `selectable`，以及 `selectablestart`、`selectableselecting` 和\
  \ `selectablestop` 事件处理程序。注意在 `selectable selecting` 事件处理程序中，使用 `ui.selecting.innerHTML`\
  \ 值来更新正在被选择的项目列表：\n\n   点击此处查看代码图片\n\n   ```javascript\n   04   $(\"#set1\").selectable({\
  \ filter:\"p\" });\n   05   $(\"#set1\").on(\"selectablestart\", function(e, ui){\n\
  \   06     $(\"span\").html(\"Selecting \"); });\n   07   $(\"#set1\").on(\"selectableselecting\"\
  , function(e, ui){\n   08     $(\"span\").append(ui.selecting.innerHTML+\", \");\
  \ });\n   09   $(\"#set1\").on(\"selectablestop\", function(e, ui){\n   10     $(\"\
  span\").html(\"Selection Complete\"); });\n   ```\n\n6. 添加以下行来在 `#set2` 上实现 selectable，`#set2`\
  \ 是一个包含图片的 `<div>`。在 `selectablestop` 事件处理程序内部，使用 `.ui-selected` 类属性来找到被选中的图片。在第\
