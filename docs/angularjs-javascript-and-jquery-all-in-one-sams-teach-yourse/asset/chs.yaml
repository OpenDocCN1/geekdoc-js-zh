  \ </html>\n```\n\n***\n\n#### 使用 `$interval` 和 `$timeout` 服务实现定时器\n\nAngularJS 的\
  \ `$interval` 和 `$timeout` 服务允许你延迟执行代码一段时间。这些服务与 JavaScript 的 `setInterval` 和 `setTimeout`\
  \ 功能交互，但位于 AngularJS 框架内。\n\n`$interval` 和 `$timeout` 服务使用以下语法：\n\n```\n$interval(callback,\
  \ delay, [count], [invokeApply]);\n$timeout(callback, delay, [invokeApply]);\n```\n\
  \n参数说明如下：\n\n![Image](img/image00767.jpeg) `callback`：在延迟到期时执行。\n\n![Image](img/image00767.jpeg)\
  \ `delay`：指定在回调函数执行之前等待的毫秒数。\n\n\n\n\n\n![Image](img/image00767.jpeg) `count`：表示重复间隔的次数。\n\
  \n![Image](img/image00767.jpeg) `invokeApply`：是一个布尔值，如果为 `true`，则函数仅在 AngularJS\
  \ 事件循环的 `$apply()` 块中执行。默认值为 `true`。\n\n当你调用 `$interval()` 和 `$timeout()` 方法时，它们会返回一个\
  \ promise 对象，你可以使用该对象来取消超时或间隔。要取消现有的 `$timeout` 或 `$interval`，请调用 `cancel()` 方法。例如：\n\
  \n点击此处查看代码图片\n\n```\nvar myInterval = $interval(function(){$scope.seconds++;}, 1000,\
  \ 10, true);\n\n. . .\n\n$interval.cancel(myInterval);\n```\n\n如果你使用 `$timeout`\
  \ 或 `$interval` 创建了超时或间隔，则必须在 `scope` 或 `elements` 指令被销毁时，通过 `cancel()` 显式销毁它们。最简单的方法是为\
  \ `$destroy` 事件添加一个监听器。例如：\n\n点击此处查看代码图片\n\n```\n$scope.$on('$destroy', function(){\n\
  \n  $scope.cancel(myInterval);\n\n});\n```\n\n#### 使用 `$animate` 服务\n\n`$animate`\
  \ 服务提供了动画检测钩子，你可以在执行 DOM 的 enter、leave 和 move 操作以及 `addClass` 和 `removeClass` 操作时使用这些钩子。你可以通过\
  \ CSS 类名或 AngularJS 中的 `$animate` 服务来使用这些钩子。\n\n要实现动画，你需要向要添加动画的元素添加一个支持动画的指令。表\
  \ 27.3 列出了支持动画的指令及其支持的动画事件类型。\n\n![Image](img/image01043.jpeg)\n\n**表 27.3 支持动画的\
  \ AngularJS 指令**\n\n##### 在 CSS 中实现动画\n\n要在 CSS 中实现动画，你需要在要添加动画的元素中包含 `ngClass`\
  \ 指令。AngularJS 将 `ngClass` 值作为附加 CSS 类的根名称，这些类将在动画过程中被添加和移除到元素上。\n\n动画事件会在定义了 `ngClass`\
  \ 指令的元素上被调用。表 27.4 列出了在动画过程中被添加和移除的附加类。\n\n![Image](img/image01044.jpeg)\n\n**表\
  \ 27.4 动画过程中自动添加和移除的 AngularJS 指令**\n\n要实现基于 CSS 的动画，你需要为表 27.4 中列出的附加类添加相应的 CSS\
  \ 过渡代码。为了说明这一点，以下代码片段为用户定义的名为 `.img-fade` 的类实现了添加类和移除类的过渡，该动画将图像的 `opacity` 更改为\
  \ `.1`，持续时间为 2 秒：\n\n点击此处查看代码图片\n\n```\n.img-fade-add, .img-fade-remove {\n\n  -webkit-transition:all\
  \ ease 2s;\n\n  -moz-transition:all ease 2s;\n\n  -o-transition:all ease 2s;\n\n\
    transition:all ease 2s;\n\n}\n\n.img-fade, .img-fade-add.img-fade-add-active {\n\
  \n   opacity:.1;\n\n}\n```\n\n请注意，过渡被添加到 `.img-fade-add` 和 `.img-fade-remove` 类，但实际的类定义应用于\
  \ `.img-fade`。你还需要类定义 `.img-fade-add.img-fade-add-active` 来设置过渡的结束状态。\n\n##### 在\
  \ JavaScript 中实现动画\n\n实现 AngularJS CSS 动画非常简单，但你也可以使用 jQuery 在 JavaScript 中实现动画。JavaScript\
  \ 动画提供了对动画更直接的控制。此外，JavaScript 动画不需要浏览器支持 CSS3。\n\n要在 JavaScript 中实现动画，你需要在加载 `angular.js`\
  \ 库之前，在模板中包含 jQuery 库。例如：\n\n点击此处查看代码图片\n\n```\n<script src=\"http://code.jquery.com/jquery-1.11.0.min.js\"\
  ></script>\n```\n\n* * *\n\n顺便提一下\n\n如果你想充分利用 jQuery 动画的全部功能，则必须包含完整的 jQuery 库。如果你决定包含\
  \ jQuery 库，请确保在 HTML 代码中先于 AngularJS 库加载它。\n\n* * *\n\n你还需要在应用程序的 `Module` 对象定义中包含\
  \ `ngAnimate` 依赖项。例如：\n\n点击此处查看代码图片\n\n```\nvar app = angular.module('myApp', ['ngAnimate']);\n\
  ```\n\n然后，你可以在 `Module` 对象上使用 `animate()` 方法来实现动画。`animate()` 方法返回一个对象，该对象为你要处理的\
  \ `enter`、`leave`、`move`、`addClass` 和 `removeClass` 事件提供了函数。这些函数将待动画化的元素作为第一个参数传入。然后你可以使用\
  \ jQuery 的 `animate()` 方法来为元素添加动画。\n\njQuery 的 `animate()` 方法使用以下语法，其中 `cssProperties`\
  \ 是一个 CSS 属性更改的对象，`duration` 以毫秒为单位指定，`easing` 是缓动方法，`callback` 是动画完成时执行的函数：\n\n\
  点击此处查看代码图片\n\n```\nanimate(cssProperties, [duration], [easing], [callback])\n```\n\
  \n例如，以下代码通过将 `opacity` 设置为 `0` 来为元素添加 `fadeClass` 类动画：\n\n点击此处查看代码图片\n\n```\napp.animation('.fadeClass',\
  \ function() {\n\n  return {\n\n    addClass : function(element, className, done)\
  \ {\n\n      jQuery(element).animate({ opacity: 0}, 3000);\n\n    },\n\n  };\n\n\
  });\n```\n\n* * *\n\n动手试一试：使用 AngularJS 为元素添加动画\n\n在本练习中，你将有机会使用 AngularJS 结合 CSS\
  \ 和 jQuery 来实现动画。本练习的目的是向你展示每种方法的工作原理。\n\n清单 27.7、27.8 和 27.9 实现了一个基本的动画示例，该示例使用\
  \ JavaScript 方法对图像应用淡入/淡出动画，并使用 CSS 过渡动画来实现图像大小的变化。\n\n按照以下步骤构建应用动画的 AngularJS 应用程序：\n\
  \n**1.** 添加 `lesson27/service_animation.html`、`lesson27/js/service_animation.js`\
  \ 和 `lesson27/js/service_animation.css` 文件。\n\n**2.** 将清单 27.7、清单 27.8 和清单 27.9\
  \ 中显示的代码添加到 HTML、JavaScript 和 CSS 文件中。\n\n**3.** 清单 27.7 中的以下代码行将 AngularJS 动画服务注入到应用程序中，以便可以使用它：\n\
  \n点击此处查看代码图片\n\n```\n01 var app = angular.module('myApp', ['ngAnimate']);\n```\n\
  \n**4.** 清单 27.7 中的以下代码行通过应用程序上的 `animation()` 方法实现了淡入和淡出动画。请注意，通过挂钩 `addClass`\
  \ 和 `removeClass` 事件，然后对元素的 opacity 使用 `jQuery.animate()` 方法，相同的类 `.fadeOut` 被用于同时应用淡入和淡出动画：\n\
  \n点击此处查看代码图片\n\n```\n05 app.animation('.fadeOut', function() {\n\n06   return {\n\
  \n07     enter : function(element, parentElement, afterElement, doneCallback) {},\n\
  \n08     leave : function(element, doneCallback) {},\n\n09     move : function(element,\
  \ parentElement, afterElement, doneCallback) {},\n\n10     addClass : function(element,\
  \ className, done) {\n\n11       jQuery(element).animate({ opacity: 0}, 3000);\n\
  \n12     },\n\n13     removeClass : function(element, className, done) {\n\n14       jQuery(element).animate({\
  \ opacity: 1}, 3000);\n\n15     }\n\n16   };\n```\n\n\n\n\n\n**5.** 以下来自清单 27.9\
  \ 的 CSS 代码行，通过将 CSS 动画应用于 AngularJS 类过渡的`–add`和`–add-active`，实现了当元素被赋予`shrink`和`grow`类时图像的缩小和放大动画：\n\
