  \n* * *\n\n* * *\n\n动手实践：实现可拖放元素\n\n在本例中，你将使用自定义 AngularJS 指令实现一组可拖动的元素，这些元素包含可以拖放到一组可放置的图像元素上的单词。当单词被拖放到图像上时，它会被追加到图像下方显示的单词列表中。\n\
  \n本练习的目的是向你展示如何使用 HTML5 拖放事件。该示例仅使用事件，实际的拖放功能是使用 AngularJS 机制构建的。原因是演示 AngularJS\
  \ 的使用（此外，HTML5 拖放实现得并不完善，需要修改）。本例中演示的另一件事是在 AngularJS 指令中将新元素追加到现有元素。\n\n按照以下步骤构建拖放\
  \ AngularJS 应用程序：\n\n**1.** 在你的代码中创建以下文件夹和文件结构：\n\n![Image](img/image00767.jpeg)\
  \ `./lesson29`**：**项目文件夹。\n\n![Image](img/image00767.jpeg) `./lesson29/dragdrop.html`**：**项目的\
  \ AngularJS 模板。\n\n![Image](img/image00767.jpeg) `./lesson29/js/dragdrop.js`**：**支持自定义拖放指令的\
  \ AngularJS 应用程序。\n\n**2.** 将清单 29.5 中的代码添加到`dragdrop.js`文件中。这是一个 AngularJS 应用程序，定义了两个新的自定义\
  \ AngularJS 指令：`dragit`和`dropit`。注意，在父作用域中定义了`dragStatus`和`dropStatus`变量；这些变量在自定义指令中更新。这是可能的，因为指令中没有定义隔离作用域，所以它们共享父控制器作用域。\n\
  \n注意，在`dragit`指令内部，使用`attr()`方法将 HTML5 的`draggable`属性添加到`dragit`元素上。同样在`dragit`指令中，实现了`dragstart`、`drag`和`dragend`事件处理程序。对于`dragstart`和`drag`，默认行为是允许拖动开始并触发`dragenter`/`dragleave`事件。然而，`dragend`阻止了默认行为，以便我们的自定义\
  \ AngularJS 代码可以处理放置操作。\n\n在`dropit`指令内部，实现了`dragover`、`dragleave`、`dragenter`和`drop`。注意，在`drop`中，我们使用`append`方法将一个`<p>`元素追加到`dropit`元素上。段落中的值来自作用域，并在`dragit`指令的`dragstart`期间设置。同样，这是可能的，因为指令中没有定义隔离作用域。\n\
  \n**清单 29.5** `dragdrop.js` AngularJS 应用程序，实现了`dragit`和`dropit`自定义 AngularJS 指令以提供拖放功能\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\n01 var app = angular.module('myApp', []);\n02 app.controller('myController',\
  \ function($scope) {\n03   $scope.dragStatus = \"none\";\n04   $scope.dropStatus\
  \ = \"none\";\n05   $scope.dropValue = \"\";\n06 })\n07 .directive('dragit', function($document,\
  \ $window) {\n08   function makeDraggable(scope, element, attr) {\n09     angular.element(element).attr(\"\
  draggable\", \"true\");\n10     element.on('dragstart', function(event) {\n11  \
  \     element.addClass('dragItem');\n12       scope.$apply(function(){\n13     \
  \    scope.dragStatus = \"Dragging \" + element.html();\n14         scope.dropValue\
  \ = element.html();\n15       });\n16       event.dataTransfer.setData('Text', element.html());\n\
  17     });\n```\n\n\n\n\n\n```\n18     element.on('drag', function(event) {\n19\
  \       scope.$apply(function(){\n20         scope.dragStatus = \"X: \" + event.pageX\
  \ +\n21                             \" Y: \" + event.pageY;\n22       });\n23  \
  \   });\n24     element.on('dragend', function(event) {\n25       event.preventDefault();\n\
  26       element.removeClass('dragItem');\n27     });\n28   }\n29   return {\n30\
  \     link: makeDraggable\n31   };\n32 })\n33 .directive('dropit', function($document,\
  \ $window) {\n34   return {\n35     restrict: 'E',\n36     link: function makeDroppable(scope,\
  \ element, attr){\n37       element.on('dragover', function(event) {\n38       \
  \  event.preventDefault();\n39         scope.$apply(function(){\n40           scope.dropStatus\
  \ = \"Drag Over\";\n41         });\n42       });\n43       element.on('dragleave',\
  \ function(event) {\n44         event.preventDefault();\n45         element.removeClass('dropItem');\n\
  46         scope.$apply(function(){\n47           scope.dropStatus = \"Drag Leave\"\
  ;\n48         });\n49       });\n50       element.on('dragenter', function(event)\
  \ {\n51         event.preventDefault();\n52         element.addClass('dropItem');\n\
  53         scope.$apply(function(){\n54           scope.dropStatus = \"Drag Enter\"\
  ;\n55         });\n56       });\n57       element.on('drop', function(event) {\n\
  58         event.preventDefault();\n59         element.removeClass('dropItem');\n\
  60         scope.$apply(function(){\n61           element.append('<p>' +\n62   \
  \            event.dataTransfer.getData('Text') + '</p>');\n63           scope.dropStatus\
  \ = \"Dropped \" + scope.dropValue;\n64         });\n65       });\n66     }\n67\
  \   };\n68 });\n```\n\n* * *\n\n**3.** 将清单 29.6 中的代码添加到`dragdrop.html`文件中。这将实现显示`dragStatus`和`dropStatus`值的\
