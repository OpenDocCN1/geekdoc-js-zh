  最常用的键盘事件指令是`ngKeydown`和`ngKeyup`事件，它们分别在键盘按键按下和释放时触发。键盘事件有助于在用户打字时更紧密地与之交互。最常见的键盘交互可能是在用户按下键盘上的回车键时执行某个操作。清单\
  \ 24.11 和 24.12 中的代码演示了`ngKeydown`和`ngKeyup`指令的用法。\n\n按照以下步骤构建一个应用程序，该程序利用元素上的`ngKeydown`和`ngKeyup`指令与页面元素进行交互：\n\
  \n1. 添加`lesson24/directive_keyboard_events.html`和`lesson24/js/directive_keyboard_events.js`文件。\n\
  \n2. 将清单 24.11 和清单 24.12 中显示的代码添加到 HTML 和 JavaScript 文件中。\n\n3. 清单 24.11 中的代码实现了一个控制器，该控制器为按键按下和释放事件提供了模型和键盘处理函数。`storedString`变量用于存储用户在输入框中按下回车键时文本输入的值。`keyInfo`变量存储最后按下的键的`keyCode`，而`keyStrokes`数组记录之前按下的键的`keyCode`。\n\
  \n4. 清单 24.11 中的以下代码行实现了`keyPressed()`函数。当在输入字段中按下键时，将调用此函数。注意，我们检查`keyCode`是否为\
  \ 13（表示按下了回车键），如果是，则记录`storedString`并重置其他变量。如果按下的不是回车键，则存储`keyCode`，将其添加到`keyStrokes`数组，并设置`keyState`。\n\
  \n5. 清单 24.12 中的以下代码行将`ng-keydown`和`ng-keyup`指令分配给一个`<input>`元素。当触发`ng-keydown`时，作用域中的`keyState`变量被更新；当触发`ng-keyup`时，调用`keyPressed()`处理函数。\n\
  \n6. 在浏览器中打开`directive_keyboard_events.html`文件，并尝试在文本框中输入。图 24.5 展示了 AngularJS 网页的运行情况。注意，当你在文本输入中键入每个字符时，模型中的`keyPressed`值会被更新，当按下回车键时，单词被存储，按键记录被重置。\n\
  \n![Image](img/image01026.jpeg)\n\n**图 24.5** 在 AngularJS 模板视图中实现键盘事件指令。\n\n###\
  \ 清单 24.11 `directive_keyboard_events.js` 实现一个带有作用域数据和事件处理器的控制器，以支持来自视图的按键按下和释放事件\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\n01 angular.module('myApp', []).\n02   controller('myController',\
  \ function($scope) {\n03     $scope.storedString = '';\n04     $scope.keyInfo =\
  \ {};\n05     $scope.keyStrokes = [];\n06     $scope.keyState = 'Not Pressed';\n\
  07     $scope.keyPressed = function(event){\n08       if (event.keyCode == 13){\n\
  09         var element = angular.element(event.target);\n10         $scope.storedString\
  \ = element.val();\n11         element.val('');\n12         $scope.keyInfo.keyCode\
  \ = event.keyCode;\n13         $scope.keyStrokes = [];\n14         $scope.keyState\
  \ = 'Enter Pressed';\n15       } else {\n16         $scope.keyInfo.keyCode = event.keyCode;\n\
  17         $scope.keyStrokes.push(event.keyCode);\n18         $scope.keyState =\
  \ 'Not Pressed';\n19       }\n20     };\n21   });\n```\n\n### 清单 24.12 `directive_keyboard_events.html`\
  \ 一个实现`ngKeydown`和`ngKeyup`指令的 AngularJS 模板\n\n点击此处查看代码图片\n\n* * *\n\n```\n01 <!doctype\
