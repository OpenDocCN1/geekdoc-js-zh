  \n### 为什么将 AngularJS、jQuery 和 JavaScript 放在同一本书中？\n\n我们决定将 AngularJS、jQuery 和 JavaScript\
  \ 放在同一本书中的原因是它们彼此相关。我们多次被问到诸如“我应该使用 AngularJS 还是 jQuery？”或“我应该使用 JavaScript 还是 jQuery？”之类的问题。我们将它们视为一个协同工作得很好的技术栈。\n\
  \nJavaScript 是浏览器支持的基础语言。jQuery 通过更强大且用户友好的语法扩展了 JavaScript。AngularJS 是 jQuery 的扩展（或至少是\
  \ jQuery 的精简版本），它提供了一个极其强大的 MVC 框架，具有强大的数据绑定功能。\n\n理解这三种技术以及它们如何协同工作将使你成为更好的 Web\
  \ 开发人员，即使你使用其他 JavaScript 框架或库进行开发，因为它们提供了所有优秀 Web 应用程序所需的基本功能。你可能会决定简单的 JavaScript\
  \ 适合某个领域的需求，或者 jQuery/jQueryUI 为某些 Web 表单提供了完美的功能，或者你需要 AngularJS 的强大功能用于你的 Web\
  \ 应用程序。无论哪种方式，你都将拥有技能和理解，能够选择并实现正确的技术。\n\n### 什么是 JavaScript？\n\nJavaScript 是一种与其他编程语言非常相似的编程语言。JavaScript\
  \ 与其他编程语言最大的区别在于浏览器内置了一个可以解析和执行该语言的解释器。这意味着你可以编写能够直接访问浏览器事件和文档对象模型（DOM）对象的复杂应用程序。\n\
  \n访问 DOM 意味着你可以添加、修改或删除网页中的元素，而无需重新加载页面。访问浏览器使你可以访问鼠标移动和点击等事件。这就是 JavaScript 能够提供动态列表和拖放等功能的原因。\n\
  \n### 什么是 jQuery？\n\njQuery 是一个基于 JavaScript 构建的库。底层代码是 JavaScript；然而，jQuery 将许多\
  \ JavaScript 代码简化为易于使用的功能。使用 jQuery 的两个主要优点是选择器和内置函数。\n\n选择器可以快速访问网页上的特定元素，例如列表或表格。它们还可以访问元素组，例如所有段落或某个类的所有段落。这使你可以快速轻松地访问特定的\
  \ DOM 元素。\n\n\n\n\njQuery 还提供了一套丰富的内置功能，让你能用更少的代码轻松完成更多任务。例如，隐藏屏幕上的元素或为元素调整大小添加动画效果等任务，只需一行代码即可实现。\n\
  \n### 什么是 AngularJS？\n\nAngularJS 是由 Google 开发的一个客户端框架。它使用 JavaScript 编写，并包含一个精简版的\
  \ jQuery 库，称为 jQuery lite。AngularJS 的核心理念是提供一个框架，让你能够使用 MVC 架构轻松实现设计良好、结构清晰的网页和应用程序。\n\
  \nAngularJS 提供了处理浏览器中用户输入、在客户端操作数据以及控制元素在浏览器视图中显示方式的所有功能。以下是 AngularJS 提供的一些优势：\n\
  \n![Image](img/image00767.jpeg) **数据绑定**——AngularJS 通过其强大的作用域机制，提供了一种非常简洁的方法将数据绑定到\
  \ HTML 元素。\n\n![Image](img/image00767.jpeg) **可扩展性**——AngularJS 架构使你能够轻松扩展该语言的几乎每个方面，以实现你自己的自定义功能。\n\
  \n![Image](img/image00767.jpeg) **简洁**——AngularJS 强制你编写干净、逻辑清晰的代码。\n\n![Image](img/image00767.jpeg)\
  \ **可重用代码**——可扩展性与简洁代码的结合，使得在 AngularJS 中编写可重用代码变得非常容易。事实上，在创建自定义服务时，该语言通常会强制你这样做。\n\
  \n![Image](img/image00767.jpeg) **支持**——Google 在这个项目上投入了大量资源，这使其在其他类似项目失败的情况下仍具有优势。\n\
  \n![Image](img/image00767.jpeg) **兼容性**——AngularJS 基于 JavaScript，并且与 jQuery 关系密切。这使得你可以更轻松地将\
  \ AngularJS 集成到你的环境中，并在 AngularJS 框架的结构内重用现有代码的片段。\n\n### 超越 AngularJS、jQuery 和\
  \ JavaScript\n\n本书涵盖的内容不止 jQuery 和 JavaScript，因为要创建真正有用的 Web 应用程序，你需要了解的不仅仅是语言结构。本书的目标是让你在短短\
  \ 29 个简短、轻松的课程中掌握创建功能完备、交互式 Web 应用程序所需的基本技能。本书涵盖以下关键技能和技术：\n\n![Image](img/image00767.jpeg)\
  \ HTML 是目前创建网页的最新推荐标准。本书中的所有示例均使用最新的推荐版本 HTML5 进行验证。\n\n![Image](img/image00767.jpeg)\
  \ CSS 是格式化网页元素的标准方法。你不仅将学习如何编写 CSS 和 CSS3，还将学习如何使用 jQuery 和 JavaScript 动态地实时修改它。\n\
  \n![Image](img/image00767.jpeg) JavaScript 是在网页中提供交互的最佳方法，无需从服务器加载新页面。它是大多数优秀 Web\
  \ 应用程序所基于的标准语言。\n\n![Image](img/image00767.jpeg) jQuery 和 jQueryUI 是 JavaScript\
  \ 中最流行、最强大的库之一。jQuery 提供了对网页元素的快速访问以及一套强大的 Web 应用程序交互功能。jQuery 还提供了额外的 UI 库，为 Web\
  \ 应用程序提供丰富的 UI 组件。\n\n![Image](img/image00767.jpeg) AJAX 是 Web 应用程序与 Web 服务器及其他服务交互的标准方法。本书包含多个使用\
  \ AJAX 与 Web 服务器、Google、Facebook 及其他流行 Web 服务交互的示例。\n\n### 代码示例\n\n本书中的许多示例都提供了以下元素：\n\
