  ### 总结\n\n在本课中，你学习了如何访问表单元素所代表的数据。利用这些数据，你可以通过自动设置值、自动聚焦下一个元素、显示新的必要元素或隐藏不必要的元素来提供动态工作流。\n\
  \n你还学习了如何为元素应用一些出色的视觉效果，从而更好地引导用户。部分效果可以通过 CSS 实现；然而，jQuery 提供了更多的变化和控制。\n\nWeb\
  \ 表单的验证是动态编程中最关键的部分之一。通过在浏览器端使用 jQuery 捕获问题，而不是在表单提交到服务器之后，你可以节省大量用户时间。\n\n### 问答\n\
  \n**Q. 有没有办法使用 jQuery Validation 插件创建自己的验证规则？**\n\n**A.** 可以。你可以在 `.validate()`\
  \ 返回的 `Validator` 对象上调用 `.addMethod(name, function(value, element, parameters) [,message])`\
  \ 方法。你指定的 `name` 将成为新规则；该函数将被调用，当前值和元素将作为 `value` 参数传递给它。如果元素值有效，函数应返回 `true` 或\
  \ `false`。可选的 message 参数是显示的消息。\n\n**Q. 有没有办法隐藏 `<select>` 元素上难看的滚动条？**\n\n**A.**\
  \ 实际上没有。有很多变通方法，比如添加一个 `<div>` 来遮盖它。你可以创建一个与元素大小完全相同的 `<div>`，并使用 CSS 裁剪来尝试隐藏它。不过，没有一个是完美的解决方案。\n\
  \n### 实践\n\n#### 测验\n\n**1.** 如何从 jQuery 中访问 `<select>` 元素的值？\n\n**2.** 如何从 jQuery\
  \ 中禁用表单元素？\n\n**3.** 列出两种从 jQuery 判断复选框是否被选中的方法。\n\n**4.** 以下语句的作用是什么？\n\n`$(\"\
  input:text\").blur();`\n\n#### 测验答案\n\n**1.** 在表示该元素的 jQuery 对象上调用 `.val()` 方法。\n\
  \n\n\n\n2. 在表示它的 jQuery 对象上调用 `.prop(\"disabled\",\"disabled\")`。\n\n3. 在 jQuery\
  \ 对象上调用 `.prop(\"checked\")` 或 `.is(\":selected\")`。\n\n4. 它会移除所有类型为 `text` 的 `<input>`\
  \ 元素的焦点。\n\n#### 练习\n\n1. 打开清单 13.1、13.2 和 13.3 中的代码，并修改代码，使 `formB` 也能更新 `formA`\
  \ 中的某些元素。\n\n2. 打开清单 13.4、13.5 和 13.6 中的代码，并修改代码，使得当用户选择新年份时，月份元素自动获得焦点。\n\n3. 打开清单\
  \ 13.10、13.11 和 13.12 中的代码，并添加一个新的复选框组，用于技能选择，例如射箭、策略、近战，或者自行设定。添加验证规则，要求用户必须选择两到四项技能。\n\
