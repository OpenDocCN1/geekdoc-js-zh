    \n## TUTORIAL: How to Combine all .js files in all folders that are in our js\
    \ folder.\n\n### Getting things ready:\n\nCollege of Scripting Music & Science\n\
    CollegeOfScripting.weebly.com\n\n![](img/a5e700354e2f5d8a8c279b4edad9e6c6_16_0.png)[](img/a5e700354e2f5d8a8c279b4edad9e6c6_16_1.png)\n\
    \nChristopher Topalian\n\nWe should add two new lines at the end of every script.\
    \ This way they will combine nicely with a line break in between each script.\n\
    \nStep One: Open our js folder\n\nStep Two: Type in the address bar of the js\
    \ folder, cmd, press Enter. This opens our js folder in the command prompt\n\n\
    Step Three: Type the command shown below in the command prompt and then press\
    \ Enter\n`for /r \"%CD%\" %i in (*.js) do type \"%i\" >> main.js`\n\nCollege of\
    \ Scripting Music & Science\nCollegeOfScripting.weebly.com\n\n![](img/a5e700354e2f5d8a8c279b4edad9e6c6_17_0.png)[](img/a5e700354e2f5d8a8c279b4edad9e6c6_17_1.png)\n\
    \nChristopher Topalian\n\nNow we have a newly created .js file named main.js that\
    \ has all of our js files included into one file. This makes it easy to upload\
    \ our application and easy to find out how many lines of code our project is.\n\
    \nTo use our main.js file, we include it in our html file code:\n`<script src='js/main.js'></script>`\n\
    \nHappy Scripting :-)\n\nCollege of Scripting Music & Science\nCollegeOfScripting.weebly.com\n\
    \n![](img/a5e700354e2f5d8a8c279b4edad9e6c6_18_0.png)[](img/a5e700354e2f5d8a8c279b4edad9e6c6_18_1.png)\n\
