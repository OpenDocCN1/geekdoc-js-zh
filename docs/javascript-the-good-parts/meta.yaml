    # # Options


    The implementation of JSLint accepts an option object that allows you to determine
    the subset of JavaScript that is acceptable to you. It is also possible to set
    those options within the source of a script.


    An option specification can look like this:


    ```

    /*jslint nomen: true, evill: false */

    ```


    An option specification starts with /*jslint. Notice that there is no space before
    the j. The specification contains a sequence of name/value pairs, where the names
    are JSLint options and the values are true or false. An option specification takes
    over the option object. All of the options default to false. Table C-1 lists the
    options available using JSLint.


    Table C-1. JSLint options


    | Option | Meaning |

    |---|---|n| adsafe | true if rules be enforced |

    | bitwise | true if bitwise operators should not be allowed |

    | browser | true if the standard browser globals should be predefined |

    | cap | true if uppercase HTML should be allowed |

    | debug | true if debugger statements should be allowed |

    | eqeqeq | true if == should be required |

    | evil | true if eval should be allowed |

    | forin | true if unfiltered for in statements should be allowed |

    | fragment | true if fragments should be allowed |

    | glovar | true if var should not be allowed to declare global variables |

    | laxbreak | true if statement breaks should not be checked |

    | nomen | true if names should be checked |

    | on | true if HTML event handlers should be allowed |

    | passfail | true if the scan should stop on first error |

    | plusplus | true if ++ and -- should not be allowed |

    | rhino | true if the Rhino environment globals should be predefined |

    | undef | true if undefined global variables are errors |

    | white | true if strict whitespace rules apply |

    | widget | true if the Yahoo! Widgets globals should be predefined |'
  - "[PAGE 133]\n\n# JSLint comment\n\n![](img/03300178c40ed5b3e760309f69ee3125_133_0.png)\n\
    \noption\n\n![](img/03300178c40ed5b3e760309f69ee3125_133_1.png)\n\n# Semicolon\n\
    \nJavaScript uses a C-like syntax, which requires the use of semicolons to delimit\
    \ statements. JavaScript attempts to make semicolons optional with a semicolon\
    \ insertion mechanism. This is dangerous.\n\nLike C, JavaScript has ++ and - and\
    \ ( operators, which can be prefixes or suffixes. The disambiguation is done by\
    \ the semicolon.\n\nIn JavaScript, a linefeed can be whitespace, or it can act\
    \ as a semicolon. This replaces one ambiguity with another.\n\nJSLint expects\
    \ that every statement be followed by ; except for for, function, if, switch,\
    \ try, and while. JSLint does not expect to unnecessary semicolons or the empty\
    \ statement.\n\n# Line Breaking\n\nAs a further defense against the masking of\
    \ errors by the semicolon insertion mechanism, JSLint expects long statements\
    \ to be broken only after one of these punctuation characters or operators:\n\n\
    ```\n, ; : { ( } [ = < ? ! + - * % ^ | & 8\n = != <= < ? += -= * %= ^= |= = =\
    \ << >> | &&\n=== != == <= >= >>> >>>\n```\n\nJSLint does not expect to see a\
    \ long statement broken after an identifier, a string, a number, a closer, or\
    \ a suffix operator:\n\n```\n) ] ++\n```"
  - "[PAGE 134]\n\nJSLint allows you to turn on the “Tolerate sloppy line breaking”\
    \ (laxbreak) option. Semicolon insertion can mask copy/paste errors. If you always\
    \ break lines after operators, JSLint can do a better job of finding those errors.\n\
    \n# Comma\n\nThe comma operator can lead to excessively tricky expressions. It\
    \ can also mask some programming errors.\nJSLint expects to see the comma used\
    \ as a separator, but not as an operator (except in the initialization and incrementation\
    \ parts of the for statement). It does not expect to see el elements in array\
    \ literals. Extra commas should not be used. A comma should not appear after the\
    \ last element of an array literal or object literal because it can be misinterpreted\
    \ by some browsers.\n\n# Required Blocks\n\nJSLint expects that if and for statements\
    \ will be made with blocks—that is, with statements enclosed in braces ({}).\n\
    JavaScript allows an to be written like this:\n\n```\nif (condition)\n  statement;\n\
    ```\n\nThat form is known to contribute to mistakes in projects where many programmers\
    \ are working on the same code. That is why JSLint expects the use of a block:\n\
    \n```\nif (condition) {\n  statements;\n}\n```\n\nExperience shows that this form\
    \ is more resilient.\n\n# Forbidden Blocks\n\nIn many languages, a block introduces\
    \ a scope. Variables introduced in a block are not visible outside of the block.\n\
    \nIn JavaScript, blocks do not introduce a scope. There is only function-scope.\
    \ A variable introduced anywhere in a function is visible everywhere in the function.\
    \ JavaScript’s blocks confuse experienced programmers and lead to errors because\
    \ the familiar syntax makes a false promise.\n\nJSLint expects blocks with function,\
    \ if, switch, while, for, do, and try statements and nowhere else. An exception\
    \ is made for an unblocked statement on else or for in."
  - "[PAGE 135]\n\n# Expression Statements\n\nAn expression statement is expected\
