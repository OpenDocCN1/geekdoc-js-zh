    # CHAPTER 1

    ## Good Parts


    ...setting the attractions of my

    good parts aside I have no other charms.

    —William Shakespeare, The Merry Wives of Windsor


    When I was a young journeyman programmer, I would learn about every feature of
    the languages I was using, and I would attempt to use all of those features when
    I wrote. I suppose it was a way of showing off, and I suppose it worked because
    I was the guy you went to if you wanted to know how to use a particular feature.


    Eventually I figured out that some of those features were more than they were
    worth. Some of them were poorly specified, and so were more likely to cause portability
    problems. Some resulted in code that was difficult to read or modify. Some induced
    me to write in a manner that was too tricky and error-prone. And some of those
    features were design errors. Sometimes language designers make mistakes.


    Most programming languages contain good parts and bad parts. I discovered that
    I could be a better programmer by using only the good parts and avoiding the bad
    parts. After all, how can you build something out of bad parts?


    It is rarely possible for standards committees to remove imperfections from a
    language because doing so would cause the breakage of all the bad programs that
    depend on bad parts. They are powerless to do anything except have more features
    on top of the existing pile of imperfections. And the new features do not always
    interact harmoniously, producing more bad parts.


    But you have the power to define your own subset. You can write better programs
    by relying exclusively on the good parts.


    JavaScript is a language with more than its share of bad parts. It went from nonexistence
    to global adoption in an alarmingly short period of time. It never had an interval
    in the lab when it could be tried out and polished. It went straight into Netscape
    Navigator 2 just as it was, and it was very rough. When Java™ applets failed,
    JavaScript became the “Language of the Web” by default. JavaScript’s popularity
    is almost completely independent of its qualities as a programming language.

