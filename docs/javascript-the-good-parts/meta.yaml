    \ (a) {\n  b();\n  c();\n}\n```\n\nbut it means:\n\n```\nif (a) {\n  b();\n  c();\n\
    }\n```\n\nCode that appears to mean one thing but actually means another is likely\
    \ to cause bugs. A pair of braces is really cheap protection against bugs that\
