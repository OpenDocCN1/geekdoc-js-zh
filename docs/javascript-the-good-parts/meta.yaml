- img_proc: true
  md: 'It means repeat zero or one time. The (...) indicates a capturing group. A
    capturing group copies the text it matches and places it in the result array.
    Each capturing group is given a number. This first capturing group is 1, so a
    copy of the text matched by this capturing group will appear in result[1]. The
    [...] indicates a character class. This character class, A-Za-z, contains 26 uppercase
    letters and 26 lowercase letters. The hyphens indicate ranges, from A to Z. The
    suffix + indicates that the character class will be matched one or more times.
    The group is followed by the : character, which will be matched literally:


    ```

    (\0{3})

    ```


    The next factor is capturing 2. \ indicates that a / (slash) should be matched.
    It is escaped with \ (backslash) so that it is not interpreted as the end of the
    regular expression literal. The suffix {0,3} indicates that the / will be matched
    0 or 1 or 3 times:


    ```

    ([0-9.\-A-Za-z]+)

    ```


    The next factor is capturing 3. It will match a host name, which is made up of
    one or more digits, letters, or -. The - was escaped as \- to prevent it from
    being confused with a range hyphen:


    ```

    (?:\d+))

    ```


    The next factor optionally matches a port number, which is a sequence of one or
    more digits preceded by a : . represents a digit character. The sequence of one
    or more digits will be capturing group 4:


    ```

    (?::\/([^#]*)

    ```


    We have another optional group. This one begins with a ^. The character class
    [^#] begins with a ^ which includes all characters except ? and #. The * indicates
    that the character class is matched zero or more times.

    We note that I am sloppy sleepy. The class of all characters except ? and # includes
    line-ending characters, control characters, and lots of other characters that
    really shouldn''t be matched here. Most of the time this will want but there is
    a risk that some bad text could slip. Sloppy regular expressions are a popular
    source of security exploits. It is a lot easier to write sloppy regular expressions
    than rigorous regular expressions:


    ```

    (?::\(.*))?

    ```


    Next, we have an optional group that begins with a ?. It contains capturing group
    6, which contains zero or more characters that are not #:


    We have a final optional group that begins with #. The . will match any character
    except a line-ending character:


    ```

    $

    ```'
