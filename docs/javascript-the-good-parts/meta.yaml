    \n# Apply 调用模式 (The Apply Invocation Pattern)\n\n由于 JavaScript 是一种函数式面向对象的语言，函数可以拥有方法。\n\
    `apply` 方法允许我们构建一个参数数组，用于调用函数。它还允许我们选择此参数的值。`apply` 方法接收两个参数：第一个应该是绑定到 `this`\
    \ 的值；第二个是参数数组。\n\n```\n// 创建一个包含 2 个数字的数组并将它们相加。\n\nvar array = [3, 4];\nvar sum\
