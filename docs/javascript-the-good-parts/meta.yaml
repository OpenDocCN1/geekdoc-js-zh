  md: "JavaScript is often sent directly to the public. It should always be of publication\
    \ quality. Neatness counts. By writing in a clear and consistent style, your programs\
    \ become easier to read.\n\nProgrammers can debate endlessly on what constitutes\
    \ good style. Most programmers are firmly rooted in what they're used to, such\
    \ as the prevailing style that they went to school, or at their first job. Some\
    \ have profitable careers with no sense of style at all. Isn't that style doesn't\
    \ matter? And even if style doesn't matter, isn't one style good as any other?\n\
    \nIt turns out that style matters in programming for the same reason that it matters\
    \ in writing. It matters for better reading.\n\nComputer programs are sometimes\
    \ thought of as a write-only medium, so it matters little how it is written as\
    \ long as it works. But it turns out that the likelihood of a program work is\
    \ significantly enhanced by our ability to read it, which also increases the likelihood\
    \ that it actually works as intended. It is also the nature of software to be\
    \ extensively modified over its productive life. If we can read understand it,\
    \ then we can modify and improve it.\n\nThroughout this book I have used a consistent\
    \ style. My intention was to make the code examples as easy to read as possible.\
    \ I used whitespace consistently to give you more cues about the meaning of my\
    \ programs.\n\nI indented the contents of blocks and object literals four spaces.\
    \ I placed a space between if and so that the if didn't look like a function invocation.\
    \ In others I make (adjacent with the preceding symbol). I put spaces around all\
    \ infix operators except for , and [, which do not get spaces because they have\
    \ higher precedence. I use a space after every comma and colon.\n\nI put at most\
    \ one statement on a line. Multiple statements on a line can be misled. If a statement\
    \ doesn't fit on a line, I will break it after a comma or a binary operator. That\
    \ gives more protection against copy/paste errors that are masked by semicolon\
    \ insertion. (The tragedy of semicolon insertion will be revealed in Appendix\
    \ A.) I indent the remainder of the statement an extra four spaces, or eight spaces\
    \ if four is the condition part of an if statement.\n\nI always use blocks with\
    \ structured statements such as if and while because it is less error prone. I\
    \ have seen:\n\n```\nif (a)\n  b();\n```\n\nbecome:\n\n```\nif (a)\n  b();\n \
    \ c();\n```"
