    \n```javascript\nfunction createCounter() {\n  var count = 0;\n  return function\
    \ () {\n    count++;\n    return count;\n  };\n}\n\nvar counter = createCounter();\n\
    console.log(counter()); // 1\nconsole.log(counter()); // 2\nconsole.log(counter());\
    \ // 3\n```\n\nEach time `createCounter` is called, a new `count` variable is\
    \ created, and the returned function has its own private closure.\n\n```javascript\n\
    var counter2 = createCounter();\nconsole.log(counter2()); // 1\nconsole.log(counter2());\
    \ // 2\n```\n"
