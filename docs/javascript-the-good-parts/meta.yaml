    \b was intended to be a word-boundary anchor that would make it easier to match
    on word boundaries. Unfortunately, it uses \w to find word boundaries, so it is
    completely useless for multilingual applications. This is not a good part.


    \1 is a reference to the text that was captured by group 1 so that it can be matched.
    For example, you could search text for duplicated words with:


    ```

    var doubled_words =

    /([A-Za-z\u00C0-\u1FFF\u2800-\uFFFD]-)+\s+\1/gi;

    ```


    doubled words looks for occurrences of words (strings containing 1 or more letters)
    followed by whitespace followed by the same word.


    \2 is a reference to group 2, \3 is a reference to group 3, and so on.


    # Regexp Group


    There are four kinds of groups:


    # Capturing


    A capturing group is a regexp wrapped in parentheses. The characters that match
    the group will be captured. Every capture group is given a number. The first capturing
    ( in the regular expression is group 1. The second capturing ( in the regular
    expression is group 2.'
