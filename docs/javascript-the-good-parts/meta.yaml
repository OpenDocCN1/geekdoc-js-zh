  md: "```\nvar quo = function (status) {\n  return {\n    get_status: function ()\
    \ {\n      return status;\n    }\n  };\n}\n// Make an instance of quo.\nvar myQuo\
    \ = quo(\"amazed\");\ndocument.writeln(myQuo.get_status());\n```\n\nThis quo function\
    \ is designed to be used without the new prefix, so the name is not capitalized.\
    \ When we call quo, it returns a new object containing a get_status method. A\
    \ reference to that object is stored in myquo. The get_status method still has\
    \ privileged access to quo's status even though quo has already returned. get_status\
    \ does not have access to a copy of the parameter; it has access to the parameter\
    \ itself. This is possible because the function has access to the context in which\
    \ it was created. This is called closure.\n\nLet's look at a more useful example:\n\
    \n```\n// Define a function that sets a DOM node's color\n// to yellow and then\
    \ fades it to white.\nvar fade = function (node) {\n  var level = 1;\n  var step\
    \ = function () {\n    var hex = level.toString(16);\n    node.style.backgroundColor\
    \ = '#FFFF' + hex + hex;\n    if (level < 15) {\n      level += 1;\n      setTimeout(step,\
    \ 100);\n    }\n  };\n  setTimeout(step, 100);\n}\n\nfade(document.body);\n```\n\
    \nWe call fade, passing document.body (the node created by the HTML <body> tag).\
    \ fade sets level to 1. It defines a step function, passing it the step function\
    \ and a time (100 milliseconds). It returns—fade has finished.\n\nSuddenly, about\
    \ 10th of a second later, the step function gets invoked. It makes a base 16 character\
    \ from fade's level. It modifies the background color of fade's node. It then\
    \ looks at fade's level. If it hasn't gotten to white yellow, then it increments\
    \ fade's level and uses setTimeout to schedule itself to run again."
