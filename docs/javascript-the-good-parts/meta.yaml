  md: 'I want to avoid idioms that look like mistakes. I once found a bug in my


    I never allow switch cases to fall through to the next case. Once code caused
    by an unintended fall through immediately after making a vigorous speech about
    which fall through was sometimes useful. I was fortunate in that I was able to
    learn from the experience. When reviewing the features of a language, I now pay
    special attention to features that are sometimes useful but occasionally dangerous.
    Those are the worst parts because it is difficult to tell whether they are being
    used correctly. That is a place where bugs hide.


    Quality was not a motivating concern in the design, implementation, or standardization
    of JavaScript. That puts a greater burden on the users of the language to resist
    the language''s weaknesses.


    JavaScript provides support for large programs, but it also provides forms and
    idioms that work against large programs. JavaScript provides conveniences for
    the use of global variables, but global variables become increasingly problematic
    as programs scale in complexity.


    I use a single global variable to contain an application or library. Every object
    has its own namespace, so it is easy to use objects to organize my code. Use of
    closure provides further information hiding, increasing the strength of my modules.'
