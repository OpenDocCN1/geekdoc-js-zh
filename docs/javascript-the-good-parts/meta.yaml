- md: "\nFortunately, JavaScript has some extraordinarily good parts. In JavaScript,\
    \ there is a beautiful, elegant, highly expressive language that is buried under\
    \ a steaming pile of good intentions and blunders. The best nature of JavaScript\
    \ is so effectively hidden for many years the prevailing opinion of JavaScript\
    \ was that it was an unsightly, incompetent toy. My intention here is to expose\
    \ the goodness in JavaScript as an outstanding, dynamic programming language.\
    \ JavaScript is a block of marble, and I chip away the features that are not beautiful\
    \ until the language’s true nature reveals itself. I believe that the subset carved\
    \ out is vastly superior to the language as a whole, being more reliable, readable,\
    \ and maintainable.\n\nThis book will not attempt to fully describe the language.\
    \ Instead, I will focus on the good parts with occasional warnings to avoid the\
    \ bad. The subset that will be described here can be used to construct reliable,\
    \ readable programs small and large. By focusing on just the good parts, we can\
    \ reduce learning time, increase robustness, and save some time.\n\nPerhaps the\
    \ greatest benefit of studying the good parts is that you can avoid the need to\
    \ unlearn the bad parts. Unlearning bad patterns is very difficult. It is a painful\
    \ task that most of us face with extreme reluctance. Sometimes languages are subsetted\
    \ to make them work better for students. In this case, I am subsetting JavaScript\
    \ to make it work better for professionals.\n\n## Why JavaScript?\n\nJavaScript\
    \ is an important language because it is the language of the web browser. Its\
    \ association with the browser makes it one of the most popular programming languages\
    \ in the world. At the same time, it is one of the most despised. The API of the\
    \ browser, the Document Object Model (DOM) is quite awful, and JavaScript is unfairly\
    \ blamed. The DOM would be painful to work with with any language. The DOM is\
    \ poorly specified and inconsistently implemented. This means that I writing a\
    \ Good parts about the DOM would be extremely challenging.\n\nJavaScript is most\
    \ despised because it's not some OTHER LANGUAGE. If you are in some OTHER LANGUAGE\
    \ and you have to program in an environment that only supports JavaScript, then\
    \ that is annoying. Most people in that situation do not bother to learn JavaScript\
    \ first, and they are surprised when JavaScript turns out to have significant\
    \ differences from the OTHER LANGUAGE they would rather be using, and those differences\
    \ matter.\n\nThe amazing thing about JavaScript is that it is possible to get\
    \ done with without knowing much about the language, or even knowing much about\
    \ programming. It is a language with enormous expressive power. It is even better\
    \ when you know what're doing. Programming is difficult business. It should never\
    \ be undertaken in ignorance.\n\n## Analyzing JavaScript\n\nJavaScript is built\
    \ on some very good ideas and a few bad ones.\n\nThe very good ideas include functions,\
    \ loose typing, dynamic objects, and an expressive literal notation. The bad include\
    \ a programming model based on global variables.\n\nJavaScript's functions are\
    \ first class objects with (mostly) lexical scoping. JavaScript is the first lambda\
    \ language to go mainstream. Deep down, JavaScript has more in common with Lisp\
    \ and Scheme than Java. It is Lisp in C's clothing. This makes JavaScript a remarkably\
    \ powerful language.\n\nThe fashion in most programming languages today demands\
    \ strong typing. The theory is that strong typing allows a compiler to detect\
    \ a large class of errors at compile time. The sooner we can detect and repair\
    \ errors, the less they cost us. JavaScript is a loosely typed language, so JavaScript\
    \ compilers are unable to detect type errors. This can be alarming to people who\
    \ are coming from JavaScript from strongly typed languages. But it turns out that\
    \ I found in my work the sorts of errors that strong type checking are not the\
    \ errors I worry about. On the other hand, I find loose typing liberating. I do\
    \ not need to form complex class hierarchies. And I never have to cast or wrestle\
    \ with the system to get the behavior that I want.\n\nJavaScript has a very powerful\
    \ object notation. Objects can be created by listing their components. This notation\
    \ was the inspiration for JSON, the popular data interchange format. (There will\
