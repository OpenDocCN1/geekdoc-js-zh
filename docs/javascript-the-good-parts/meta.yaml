    \n  },\n  arrival: {\n    IATA: \"LAX\",\n    time: \"2004-09-23 10:42\",\n  \
    \  city: \"Los Angeles\"\n  }\n};\n```\n\n# 获取\n\n可以通过将字符串表达式封装在 `[ ]` 后缀中从对象中检索值。如果字符串表达式是常量，并且它是合法的\
