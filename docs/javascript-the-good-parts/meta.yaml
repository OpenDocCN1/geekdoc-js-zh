- md: "\n# JavaScript: The Good Parts\n\n![](img/03300178c40ed5b3e760309f69ee3125_0_0.png)\n\
    \n# Web Authoring & Design\n\n# O'REILLY®\n\n# JavaScript: The Good Parts\n\n\
    Most programming languages contain good and bad components, but JavaScript has\
    \ more than its share of the latter. This authoritative book scrapes the most\
    \ horrendous features to reveal a subset of JavaScript that is more reliable,\
    \ readable, and maintainable than the language as a whole — subset you can use\
    \ to create truly extensible and efficient code.\n\nAuthor Douglas Crockford,\
    \ considered the JavaScript expert by many in the development community, identifies\
    \ the abundance of good ideas that make JavaScript an outstanding object-oriented\
    \ programming language. Unfortunately, these good ideas (such as functions, loose\
    \ typing, dynamic objects, and an expressive object literal notation) are mixed\
    \ in bad and downright awful ideas (such as a programming model based on global\
    \ variables).\n\nWhen Java failed, JavaScript became the language of the Web by\
    \ default; its popularity is almost completely independent of its qualities as\
    \ a programming language. In *JavaScript: The Good Parts*, Crockford digs through\
    \ a pile of good intentions and blunders to give you a detailed look at all of\
    \ the genuinely elegant parts of JavaScript, including:\n\n- Inheritance\n- Objects\n\
    - Functions\n- Arrays\n- Regular expressions\n- Style\n- Beautiful features\n\n\
    With *JavaScript: The Good Parts*, you will discover a beautiful, elegant, lightweight,\
    \ and highly expressive language that lets you create effective code, whether\
    \ you are managing object libraries or just trying to get Ajax to run fast. If\
    \ you develop sites or applications for the Web, this book is an absolute must.\n\
    \nDouglas Crockford is a senior JavaScript architect who is well known for introducing\
    \ and maintaining the JSON (JavaScript Object Notation) format. He speaks regularly\
    \ at conferences about advanced JavaScript topics, and he also serves on the ECMAScript\
    \ committee.\n\n![](img/03300178c40ed5b3e760309f69ee3125_1_0.png)\n\nwww.oreilly.com\n\
    US $29.99 CAN $29.99\nISBN: 978-0-596-51774-8\n\nFree online edition for 45 days\
    \ with purchase of this book.\nDetails on last page.\n\n9780596517748\n\n# JavaScript:\
