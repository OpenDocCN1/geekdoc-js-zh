    \ of an array are all required to be of the same type. JavaScript allows an array\
    \ to contain any mixture of values:\n\n```\nvar misc = {\n  'string', 98.6, true,\
    \ false, null, undefined,\n  ['nested', 'array'], {object: true}, NaN\n};\nmisc.length\
    \ // 10\n```\n\n# Length\n\nEvery array has a length property. Unlike most other\
    \ languages, JavaScript's array length is not an upper bound. If you store an\
    \ element with a subscript that is greater than or to the current length, the\
    \ length will increase to contain the new element. There is no array bounds error.\n\
    \nThe length property is the largest integer property in the array plus one. This\
    \ is not necessarily the number of properties in the array:\n\n```\nvar myArray\
    \ = [];\nmyArray.length // 0\n\nmyArray[100000] = true;\nmyArray.length // 100001\n\
    // myArray contains one property.\n```\n\nThe [] postfix subscript operator converts\
    \ its expression to a string using the expression's toString method if it is.\
    \ That string will be used as the property name. The string looks like a positive\
    \ integer that is greater or equal to the array's length and is less than 4,294,967,295,\
    \ then the length of the array is set to the new subscript plus one."
  - '[PAGE 75]


    The length can be set explicitly. Making length larger does not allocate more
    space for the array. Making the length smaller will cause all properties with
    a subscript that is greater or equal to the new length to be deleted:


    ```

    numbers.length = 3;

    // numbers is [''zero'', ''one'', ''two'']

    ```


    A new element can be appended to the end of an array by assigning to the array''s
    current length:


    ```

    numbers[numbers.length] = ''shi'';

    // numbers is [''zero'', ''one'', ''two'', ''shi'']

    ```


    It is sometimes convenient to use the push method to accomplish the thing:


    ```

    numbers.push(''go'');

    // numbers is [''zero'', ''one'', ''two'', ''shi'', ''go'']

    ```


    # Delete


    Since JavaScript''s arrays are really objects, the delete operator can be used
    to remove elements from an array:


    ```

    delete numbers[2];

    // numbers is [''zero'', ''one'', undefined, ''shi'', ''go'']

    ```


    Unfortunately, that leaves a hole in the array. This is because the elements to
    the right of the deleted element retain their original names. What you usually
    want is to decrement the number of each of the elements to the right.


    Fortunately, JavaScript''s arrays have a splice method. It can do surgery on an
    array, deleting some number of elements and replacing them with other elements.
    The first argument is an ordinal in the array. The second argument is the number
    of elements to delete. Any additional arguments get inserted into the array at
    that point:",:


    ```

    numbers.splice(2, 1);

    // numbers is [''zero'', ''one'', ''shi'', ''go'']

    ```


    The property whose value is ''shi'' has its key changed from ''4'' to ''3''. Because
    every property after the deleted property must be removed and reinserted with
    a new key, this might not go quickly for large arrays.


    # Enumeration


    Since JavaScript''s arrays are really objects, the for in statement can be used
    to iterate over all the properties of an array. Unfortunately, for in makes no
    guarantee about the order of the properties, and most array applications expect
    the elements to be produced in numerical order. Also, there is still the problem
    with unexpected properties being dredged up from the prototype chain.'
- md: "\nFortunately, the for statement avoids these problems. JavaScript's for statement\
    \ is similar to that in most C-like languages. It is controlled by three clauses—the\
    \ first initializes the loop, the second is the while condition, and the third\
    \ does the increment:\n\n```\nvar i;\nfor (i = 0; i < myArray.length; i += 1)\
    \ {\n  document.writeln(myArray[i]);\n}\n```\n\n## Confusion\n\nA common error\
    \ in JavaScript programs is to use an object when an array is required or when\
    \ an object is required. The rule is simple: if the property names are small sequential\
