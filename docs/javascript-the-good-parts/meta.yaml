    The values produced by typeof are ''number'', ''string'', ''boolean'', ''undefined'',
    ''function'', and ''object''. If the operand is an array or null, then the result
    is ''object'', which is wrong. There will be more about typeof in Chapter 6 and
    Appendix A.


    If the operand of ! is truthy, it produces false. Otherwise, it produces true.

    The + operator adds or concatenates. If you want it to add, make sure both operands
    are numbers.


    The / operator can produce a noninteger result even if operands are integers.

    The && operator produces the value of its first operand if the first operand is
    falsy. Otherwise, it produces the value of the second operand.'
