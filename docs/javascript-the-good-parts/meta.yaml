    };\n\n// Give all instances of Quo a public method\n```"
- md: "\n```javascript// called get_status.\n\nQuo.prototype.get_status = function\
    \ () {\n  return this.status;\n}\n\n// Make an instance of Quo.\nvar myQuo = new\
    \ Quo(\"confused\");\ndocument.writeln(myQuo.get_status()); // confused\n```\n\
    \nFunctions that are intended to be used with the new prefix are called constructors.\
    \ By convention, they are kept in variables with a capital name. If a constructor\
    \ is called without the new prefix, very bad things happen without a compile-time\
    \ or runtime warning, so the capitalization convention is really important.\n\n\
    Use of this style of constructor functions is not recommended. We will see better\
    \ alternatives in the next chapter.\n\n# The Apply Invocation Pattern\n\nBecause\
    \ JavaScript is a functional object-oriented language, functions can have methods.\n\
    The apply method lets us construct an array of arguments to use to invoke a function.\
    \ It also lets us choose the value of this. The apply method takes two parameters.\
    \ The first is the value that should be bound to this. The second is an array\
    \ of parameters.\n\n```\n// Make an array of 2 numbers and add them.\n\nvar array\
    \ = [3, 4];\nvar sum = add.apply(null, array); // sum is 7\n```\n\n```\n// Make\
    \ an object with a status member.\n\nvar statusObject = {\n  status: 'A-OK'\n\
    }\n```\n\n```\n// statusObject does not inherit from Quo.prototype,\n// but we\
    \ can invoke the get_status method on\n// statusObject even though statusObject\
    \ does not have\n// a get_status method.\n```\n\n```javascript\nvar status = Quo.prototype.get_status.apply(statusObject);\n\
    // status is 'A-OK!'\n```\n\n# Arguments\n\nA bonus parameter that is available\
    \ to functions when they are invoked is the arguments array. It gives the function\
    \ access to all of the arguments that were supplied with the invocation, including\
    \ excess arguments that were not assigned to parameters. This makes it possible\
    \ to write functions that take an unspecified number of parameters.\n\n```\n//\
    \ Make a function that adds a lot of stuff.\n\n// Note that defining the variable\
    \ sum inside of\n// the function does not interfere with the sum\n// defined outside\
    \ of the function. The function\n// only sees the inner one.\n\nvar sum = function\
    \ () {\n  var i, sum = 0;\n  for (i = 0; i < arguments.length; i += 1) {\n   \
    \ sum += arguments[i];\n  }\n  return sum;\n};\n```\n\n```javascript\ndocument.writeln(sum(4,\
    \ 8, 15, 16, 23, 42)); // 108\n```\n\nThis is not a particularly useful pattern.\
    \ In Chapter 6, we will see how we can add a similar method to an array.\n\nBecause\
    \ of a design error, arguments is not really an array. It is an array-like object.\
    \ arguments has a length property, but it lacks all of the array methods. We will\
    \ see a consequence of that design error at the end of this chapter.\n\n# Return\n\
    \nWhen a function is invoked, it begins execution with the first statement, and\
    \ ends when it hits the } that closes the function body. That causes the function\
    \ to return control to the part of the program that invoked the function.\n\n\
    The return statement can be used to cause the function to return early. When return\
    \ is executed, the function returns immediately without executing the remaining\
    \ statements.\n\nA function always returns a value. If the return value is not\
    \ specified, then undefined is returned.\n\nIf the function was invoked with the\
    \ new prefix and the return value is not an object, then this (the new object)\
    \ is returned instead.\n\n# Exceptions\n\nJavaScript provides an exception handling\
    \ mechanism. Exceptions are unusual (but not completely unexpected) mishaps that\
    \ interfere with the normal flow of a program. When such a mishap is detected,\
    \ your program should throw an exception:\n\n```javascript\nvar add = function\
    \ (a, b) {\n  if (typeof a != 'number' || typeof b != 'number') {\n    throw {\n\
    \      name: 'TypeError',\n      message: 'add needs numbers'\n    };\n  }\n \
    \ return a + b;\n}\n```\n\nThe throw statement interrupts execution of the function.\
    \ It should be given an exception object containing a name property that identifies\
    \ the type of the exception, and a descriptive message property. You can also\
    \ add other properties.\n\nThe exception object will be delivered to the catch\
    \ clause of a try statement:\n\n```javascript\n// Make a try_it function that\
    \ calls the new add\n// function incorrectly.\n\nvar try_it = function () {\n\
    \  try {\n    add(\"seven\");\n  } catch (e) {\n    document.writeln(e.name +\
    \ ': ' + e.message);\n  }\n};\n\ntry_it();\n```\n\nIf an exception is thrown within\
    \ a try block, control will go to its catch clause.\n\nA try statement has a single\
    \ catch block that will catch all exceptions. If your handling depends on the\
    \ type of the exception, then the exception handler will have to inspect the name\
    \ to determine the type of the exception.\n\n# Augmenting Types\n\nJavaScript\
    \ allows the basic types of the language to be augmented. In Chapter 3, we saw\
    \ that adding a method to Object.prototype makes that method available to all\
    \ objects. This also works for functions, arrays, strings, regular expressions,\
    \ and booleans.\n\nFor example, augmenting Function.prototype, we can make a method\
    \ available to all functions:\n\n```javascript\nFunction.prototype.method = function\
    \ (name, func) {\n  this.prototype[name] = func;\n  return this;\n};\n```\n\n\
    By augmenting Function.prototype with a method name, we no longer have to type\
    \ the name of the prototype property. That bit of ugliness can now be hidden.\n\
    \nJavaScript does not have a separate integer type, so it is sometimes necessary\
    \ to extract the integer part of a number. The method JavaScript provides to do\
    \ that is ugly. We can fix it by adding an integer method to Number.prototype.\
    \ It uses either Math.ceil or Math.floor, depending on the sign of the number:\n\
    \n```javascript\nNumber.prototype.integer = function () {\n  return Math[this\
    \ < 0 ? 'ceil' : 'floor'](this);\n};\n```\n\n```javascript\ndocument.writeln((-10/3).integer());\
    \ // -3\n```\n\nJavaScript lacks a method that removes spaces from the ends of\
    \ a string. That is an easy oversight to fix:\n\n```javascript\nString.prototype.trim\
    \ = function () {\n  return this.replace(/^\\s+|\\s+$/g, '');\n};\n```\n\n```javascript\n\
    document.writeln(\" \" + \"  neat  \".trim() + \" \");\n```\n\nOur method uses\
    \ a regular expression. We will see much more about regular expressions in Chapter\
    \ 7.\n\nBy augmenting the basic types, we can make significant improvements to\
    \ the expressiveness of the language. Because of the dynamic nature of JavaScript,\
    \ we can add methods to objects at runtime. We saw a couple of ways to mitigate\
    \ this: we can use hasOwnProperty to screen out hidden properties, and\n\n```javascript\n\
    Object.prototype.method = function (name, func) {\n  if (!this[name]) {\n    this[name]\
    \ = func;\n  }\n};\n```\n\n# Recursion function\n\nA recursive function is a function\
    \ that calls itself, either directly or indirectly. Recursion is a powerful programming\
    \ technique in which a problem is divided into similar subproblems, each solved\
    \ with a trivial solution. Generally, a recursive function calls itself to solve\
    \ its subproblems.\n\nThe Towers of Hanoi is a famous puzzle. The equipment includes\
    \ three posts and a set of discs of various diameters. The setup stacks all discs\
    \ on the source post with smaller discs on top. The goal is to move the stack\
    \ to the destination post by moving one disc at a time, never placing a larger\
    \ disc on a smaller disc. This has a recursive solution:\n\n```javascript\nvar\
    \ hanoi = function (disc, src, aux, dst) {\n  if (disc > 0) {\n    hanoi(disc\
    \ - 1, src, dst, aux);\n    document.write('Move disc ' + disc + ' from ' + src\
    \ + ' to ' + dst + '\\n');\n    hanoi(disc - 1, aux, src, dst);\n  }\n}\n\nhanoi(3,\
    \ 'Src', 'Aux', 'Dst');\n```\n\nIt produces this solution for three discs:\n\n\
    - Move disc 1 from Src to Dst\nMove disc 2 from Src to Aux\nMove disc 1 from Dst\
    \ to Aux\nMove disc 3 from Src to Dst\nMove disc 1 from Aux to Src\nMove disc\
    \ 2 from Aux to Dst\nMove disc 1 from Src to Dst\n\nThe Hanoi function moves a\
    \ stack of discs from one post to another, using the auxiliary post necessary.\
    \ It breaks the problem into three subproblems. First, it unlocks the bottom disc\
    \ by moving the substack above it to the auxiliary post. It can then move the\
    \ bottom disc to the destination post. Finally, it can move the substack from\
    \ the auxiliary post to the destination post. The movement of the substack is\
    \ handled by calling itself recursively to work out those subproblems.\n\nThe\
    \ Hanoi function passed the number of the disc it is to move and the three posts\
    \ it is to use. When it calls itself, it is to deal with the disc that is above\
    \ the disc it is currently working. Eventually, it will be called with a nonexistent\
    \ disc number. In that case, it does nothing. That act of nothingness gives us\
    \ confidence that the function does not recurse forever.\n\nRecursive functions\
    \ can be very effective in mapping tree structures such as the browser's Document\
    \ Object Model (DOM). Each recursive call gives a smaller piece of the tree to\
    \ work on.\n"
