    \nScope in a programming language controls the visibility and lifetimes of variables\
    \ and parameters. This is an important service to the programmer because it reduces\
    \ name collisions and provides automatic memory management:\n\n```\nvar foo =\
    \ function () {\n  var a = 3, b = 5;\n```\n\n```\nvar bar = function () {\n  var\
    \ b = 7, c = 11;\n```\n\n```\n// At this point, a is 3, b is 7, and c is 11\n\
    ```\n\n```\na += b + c;\n```\n\n```\n// At this point, a is 21, b is 7, and c\
    \ is 11\n```\n\n```\n};\n```\n\n```\n// At this point, a is 3, b is 5, and c is\
    \ not defined\n```\n\n```\nbar();\n```\n\n```\n// At this point, a is 21, b is\
    \ 7, and c is 5\n```\n\n```\n};\n```\n\nMost languages with C syntax have block\
    \ scope. All variables defined in a block (a list of statements wrapped with curly\
    \ braces) are not visible from outside of the block. The variables defined in\
    \ a block can be released when execution of the block is finished. This is a good\
    \ thing.\n\nUnfortunately, JavaScript does not have block scope even though its\
    \ block syntax suggests that it does. This confusion can be a source of errors.\n\
    \nJavaScript does function scope. That means the parameters and variables defined\
    \ in a function are not visible outside of the function, and that a variable defined\
    \ anywhere within a function is visible everywhere within the function.\n\nIn\
    \ many modern languages, it is recommended that variables be declared as late\
    \ as possible, at the first point of use. That turns out to be bad advice for\
    \ JavaScript because it lacks block scope. So instead, it is best to declare all\
    \ of the variables in a function at the top of the function body."
