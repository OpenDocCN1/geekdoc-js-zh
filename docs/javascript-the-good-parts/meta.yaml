  md: "# Object Specifiers\n\nIt sometimes happens that a constructor is given a very\
    \ large number of parameters. This can be troublesome because it can be very difficult\
    \ to remember the order of the arguments. In such cases, it can be much friendlier\
    \ if we write the constructor to accept a single object specifier instead. That\
    \ object contains the specification of the object to be constructed. So, instead\
    \ of:\n\n```\nvar myObject = maker(f, 1, m, c, s);\n\nwe can write:\n\nvar myObject\
    \ = maker({\n  first: f,\n  last: 1,\n  state: s,\n  city: c\n});\n```\n\nThe\
    \ arguments can now be listed in any order, arguments can be left out if the constructor\
    \ is smart about defaults, and the code is much easier to read.\n\nThis can have\
    \ a secondary benefit when working with JSON (see Appendix E). JSON text can only\
    \ describe data, but sometimes the data represents an object, and it would be\
    \ useful to associate the data with its methods. This can be done trivially if\
    \ the constructor takes an object specifier because we can simply pass the JSON\
    \ object to the constructor and it will return a fully constituted object.\n\n\
    # Prototype\n\nIn a purely prototypal pattern, we dispense with classes. We focus\
    \ instead on the objects. Prototype inheritance is conceptually simpler than classical\
    \ inheritance: a new object can inherit the properties of an old object. This\
    \ is perhaps unfamiliar, but it is really easy to understand. You start by making\
    \ a useful object. You can make many more objects that are like that. The classification\
    \ process of breaking an application down into a set of nested abstract classes\
    \ can be completely avoided.\n\nLet's start by using an object literal to make\
    \ a useful object:\n\n```\nvar myMamm = {\n  name : 'Herb the Mammal',\n  get_name\
    \ : function () {\n    return this.name;\n  },\n  says : function () {\n    return\
    \ this.saying || '';\n  }\n};\n```"
