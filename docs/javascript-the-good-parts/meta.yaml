  md: '# CHAPTER 1

    Good Parts


    ...setting the attractions of my

    good parts aside I have no other charms.

    —William Shakespeare, The Merry Wives of Windsor


    When I was a young journeyman programmer, I would learn about every feature of
    the languages I was using, and I would attempt to use all of those features when
    I wrote. I suppose it was a way of showing off, and I suppose it worked because
    I was the guy you went to if you wanted to know how to use a particular feature.


    Eventually I figured out that some of those features were more than they were
    worth. Some of them were poorly specified, and so were more likely to cause portability
    problems. Some resulted in code that was difficult to read or modify. Some induced
    me to write in a manner that was too tricky and error-prone. And some of those
    features were design errors. Sometimes language designers make mistakes.


    Most programming languages contain good parts and bad parts. I discovered that
    I could be a better programmer by using only the good parts and avoiding the bad
    parts. After all, how can you build something out of bad parts?


    It is rarely possible for standards committees to remove imperfections from a
    language because doing so would cause the breakage of all the bad programs that
    depend on bad parts. They are powerless to do anything except have more features
    on top of the existing pile of imperfections. And the new features do not always
    interact harmoniously, producing more bad parts.


    But you have the power to define your own subset. You can write better programs
    by relying exclusively on the good parts.


    JavaScript is a language with more than its share of bad parts. It went from nonexistence
    to global adoption in an alarmingly short period of time. It never had an interval
    in the lab when it could be tried out and polished. It went straight into Netscape
    Navigator 2 just as it was, and it was very rough. When Java™ applets failed,
    JavaScript became the “Language of the Web” by default. JavaScript’s popularity
    is almost completely independent of its qualities as a programming language.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Fortunately, JavaScript has some extraordinarily good parts. In JavaScript,
    there is a beautiful, elegant, highly expressive language that is buried under
    a steaming pile of good intentions and blunders. The best nature of JavaScript
    is so effectively hidden for many years the prevailing opinion of JavaScript was
    that it was an unsightly, incompetent toy. My intention here is to expose the
    goodness in JavaScript as an outstanding, dynamic programming language. JavaScript
    is a block of marble, and I chip away the features that are not beautiful until
    the language’s true nature reveals itself. I believe that the subset carved out
    is vastly superior to the language as a whole, being more reliable, readable,
    and maintainable.


    This book will not attempt to fully describe the language. Instead, I will focus
    on the good parts with occasional warnings to avoid the bad. The subset that will
    be described here can be used to construct reliable, readable programs small and
    large. By focusing on just the good parts, we can reduce learning time, increase
    robustness, and save some time.


    Perhaps the greatest benefit of studying the good parts is that you can avoid
    the need to unlearn the bad parts. Unlearning bad patterns is very difficult.
    It is a painful task that most of us face with extreme reluctance. Sometimes languages
    are subsetted to make them work better for students. In this case, I am subsetting
    JavaScript to make it work better for professionals.


    # Why JavaScript?


    JavaScript is an important language because it is the language of the web browser.
    Its association with the browser makes it one of the most popular programming
    languages in the world. At the same time, it is one of the most despised. The
    API of the browser, the Document Object Model (DOM) is quite awful, and JavaScript
    is unfairly blamed. The DOM would be painful to work with any language. The DOM
    is poorly specified and inconsistently implemented. This means that I writing
    a Good parts about the DOM would be extremely challenging.


    JavaScript is most despised because it''s not some OTHER LANGUAGE. If you are
    in some OTHER LANGUAGE and you have to program in an environment that only supports
    JavaScript, then that is annoying. Most people in that situation do not bother
    to learn JavaScript first, and they are surprised when JavaScript turns out to
    have significant differences from the OTHER LANGUAGE they would rather be using,
    and those differences matter.


    The amazing thing about JavaScript is that it is possible to get done with without
    knowing much about the language, or even knowing much about programming. It is
    a language with enormous expressive power. It is even better when you know what
    you''re doing. Programming is difficult business. It should never be undertaken
    in ignorance.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Analyzing JavaScript


    JavaScript is built on some very good ideas and a few bad ones.


    The very good ideas include functions, loose typing, dynamic objects, and an expressive
    literal notation. The bad include a programming model based on global variables.


    JavaScript''s functions are first class objects with (mostly) lexical scoping.
    JavaScript is the first lambda language to go mainstream. Deep down, JavaScript
    has more in common with Lisp and Scheme than Java. It is Lisp in C''s clothing.
    This makes JavaScript a remarkably powerful language.


    The fashion in most programming languages today demands strong typing. The theory
    is that strong typing allows a compiler to detect a large class of errors at compile
    time. The sooner we can detect and repair errors, the less they cost us. JavaScript
    is a loosely typed language, so JavaScript compilers are unable to detect type
    errors. This can be alarming to people who are coming from JavaScript from strongly
    typed languages. But it turns out that I found in my work the sorts of errors
    that strong type checking are not the errors I worry about. On the other hand,
    I find loose typing liberating. I do not need to form complex class hierarchies.
    And I never have to cast or wrestle with the system to get the behavior that I
    want.


    JavaScript has a very powerful object notation. Objects can be created by listing
    their components. This notation was the inspiration for JSON, the popular data
    interchange format. (There will be more about JSON in Appendix E.)


    A controversial feature in JavaScript is prototypical inheritance. JavaScript
    has a classfree object system in which objects inherit properties directly from
    other objects. This is really powerful, but it is unfamiliar to classically trained
    programmers. If you attempt to apply classical design patterns to JavaScript,
    you will be frustrated. But if you learn to work with JavaScript''s prototyp nature,
    your efforts will be rewarded.


    JavaScript is much maligned for its choice of key ideas. For the most part, though,
    those were good, or unusual. But JavaScript depends on global variables for linkage.
    For the top-level variables of all compilation units are tossed together in a
    common namespace called the global object. This is a bad thing because global
    variables are evil, and in JavaScript they are fundamental. Frankly, as we will
    see, JavaScript also gives us the tools to mitigate this problem.


    In a few cases, we can''t ignore the bad parts. There are some unavoidable parts,
    which will be called out as they occur. They will also be summarized in Appendix
    A. But we will succeed in avoiding most of the bad parts in this book, summarizing
    much of what was left out in Appendix B. If you want to learn more about the bad
    parts and how to use them wisely, consult any other JavaScript book.'
  merge: -1
  pgno: 18
- img_proc: true
  md: "The standard that JavaScript (aka jScript) is the third edition of The ECMAScript\
    \ Programming Language, which is available from http://www.ecma-international.org/publications/files/ecma-st/ECMA-262.pdf.\
    \ The language described in this book is a proper subset of ECMAScript. This book\
    \ does not describe the language because it leaves out the bad parts. The treatment\
    \ here is not exhaustive. it avoids the edge cases. You should, too. There is\
    \ danger and misery at the edges.\n\nAppendix C describes a programming tool JSLint,\
    \ a JavaScript parser that can analyze a JavaScript program and report on the\
    \ bad parts it contains. JSLint provides a degree of rigor that is generally lacking\
    \ in JavaScript development. It can give you confidence that your programs contain\
    \ only the good parts.\n\nJavaScript is a language of contrasts. It contains many\
    \ errors and sharp edges, so you might wonder, \"Why should I use JavaScript?\
    \ There are two answers. The first is that you don't have a choice. The Web has\
    \ become an important platform for application development, and JavaScript is\
    \ the only language that is found in all browsers. It is unfortunate that Java\
    \ failed in that environment; if it hadn't, there be a choice for people desiring\
    \ a strongly typed classical language. But Java did fail and JavaScript is flourishing,\
    \ so there is evidence that JavaScript did something right.\n\nThe other answer\
    \ is, despite its deficiencies, JavaScript is really good. It is light-weight\
    \ and expressive. And once you get the hang of it, functioning programming is\
    \ a lot of fun.\n\nBut in order to use the language well, you must be well informed\
    \ about its limitations. I will pound on you with some brutality. Don't let that\
    \ discourage you. The good parts are good enough to compensate for the bad parts.\n\
    \n# A Simple Testing Ground\n\nIf you have a web browser and any text editor,\
    \ you have everything you need to run JavaScript programs. First, make an HTML\
    \ file with a name like program.html:\n\n```\n<html><body><pre><script src=\"\
    program.js\"></script></pre></body></html>\n```\n\nThen, make a file in the same\
    \ directory with a name like program.js:\n\nNext, open your HTML file in your\
    \ browser to see the result. Throughout the book, a method method is used to define\
    \ new methods. This is its definition:\n\n```\nFunction.prototype.method = function\
    \ (name, func) {\n  this.prototype[name] = func;\n  return this;\n};\n```\n\n\
    It will be explained in Chapter 4."
