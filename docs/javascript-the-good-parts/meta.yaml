    # RegExp


    The exec(string) method is the most powerful (and slowest) of the methods that
    use regular expressions. If it successfully matches the regex and the string,
    it returns an array. The 0 element of the array will contain the substring that
    matched the regex. The 1 element is the text captured by group 1, the 2 is the
    text captured by group 2, and so on. If the match fails, it returns null.


    If the regex has a g flag, it is a little more complicated. The searching begins
    not at position 0 of the string, but at regex.lastIndex (which is initially zero).
    If the match is successful, regex.lastIndex will be set to the position of the
    first character after the match. An unsuccessful match resets regex.lastIndex
    to 0.


    This allows you to search for several occurrences of a pattern in a string by
    calling exec in a loop. There are a couple things to watch out for. If you exit
    the loop, you must reset regex.lastIndex to 0 before entering the loop again.
    Also, the ^ factor matches when regex.lastIndex is 0.


