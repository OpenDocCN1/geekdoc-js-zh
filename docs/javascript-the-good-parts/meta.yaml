    ## switch 穿透 (Fall Through)


    `switch` 语句是模仿 FORTRAN IV 的计算 go to 语句的。除非显式中断流，否则每个 `case` 都会进入下一个 `case`。


    曾经有人给我写信，建议当一个 `case` 穿透到另一个 `case` 时，JSLint 应该给出警告。他指出这是一个常见的错误来源，而且在代码中很难看出这种错误。我回答说这些都是事实，但通过穿透获得的紧凑性收益超过了发生错误的概率。


    第二天，他报告说 JSLint 存在一个错误。JSLint 误判了一个错误。我进行了调查，发现我的代码确实有一个 `case` 发生了穿透。在那一刻，我悟道了。我不再使用有意的穿透。这种自律让发现无意的故障变得容易。


    语言中最糟糕的特性是那些明显危险或无用的特性。那些是很容易避免的。最糟糕的特性是那些具有吸引力的诱惑，即既有用又危险的特性。


    ## 无块语句


    `if` 或 `while` 或 `do for` 语句可以接受一个块或单个语句。单条语句的形式是另一种具有吸引力的诱惑。它具有节省两个字符的优点，但这是一个很可疑的优点。它模糊了程序的结构，使得代码的后续维护者可以很容易插入
    bug。例如：


    ```

    if (ok)

    t = true;

    ```


    可以变成：


    ```

    if (ok)

    t = true;

    advance();

    ```


    看起来像是：


    ```

    if (ok)

    t = true;

    advance();

    ```


    但实际上含义是：


    ```

    if (ok)

    t = true;

    advance();

    ```


    表面上在做一件事但实际上做另一件事的程序很难写正确。自律且一致地使用块会让正确更容易。


    ## ++


    递增和递减运算符使得以极其简洁风格编写成为可能。在 C 等语言中，它们使得编写处理晦涩字符串的单行成为可能：


    ```

    for (p = src, q = dest; !*p; p++, q++) *q = *p;

    ```


    它们还鼓励了一种事实证明是鲁莽的编程风格。大多数由于此类代码导致的缓冲区溢出 bug 造成了严重的安全漏洞。


    在我自己的实践中，我观察到当我使用 `++` 和 `--` 时，我的代码倾向于过于紧凑、过于晦涩。因此，出于自律，我不再使用它们了。我认为结果是，我的编码风格变得更整洁了。


    ## 位运算符


    JavaScript 拥有与 Java 相同的位运算符：


    | 运算符 | 描述 |

    | :--- | :--- |

    | & | 与 (and) |

    | \| | 或 (or) |

    | ^ | 异或 (xor) |

    | ~ | 非 (not) |

    | >> | 有符号右移 |

    | >>> | 无符号右移 |

    | << | 左移 |


    在 Java 中，位运算符与整数一起工作。JavaScript 没有整数。它只有双精度浮点数。因此，位运算符根据其业务将数字操作数转换为整数，然后再转换回来。在大多数语言中，这些运算符非常接近硬件且非常快。在
    JavaScript 中，它们非常远离硬件且非常慢。JavaScript 很少用于位操作。


    因此，在 JavaScript 程序中，`&` 更有可能是误打的 `&&` 运算符。位运算符的存在减少了语言的一些冗余，使得 bug 更容易隐藏。


    ## 函数语句对比函数表达式


    JavaScript 既有函数语句（function statement），也有函数表达式（function expression）。这很令人困惑，因为它们看起来可能完全一样。函数语句是带有函数返回值的
    `var` 语句的简写。


    该语句：


    ```

    function foo() {}

    ```


    含义与以下内容基本相同：


    ```

    var foo = function() {};

    ```


    在整本书中，我一直使用第二种形式，因为它清楚地表明 `foo` 是一个包含函数值的变量。要用好这种语言，理解函数是有值的很重要。


    函数语句会被提升（hoisting）。这意味着无论函数被放在哪里，它都会被移动到定义所在的作用域的顶部。这放宽了在使用前声明函数的限制，我认为这导致了代码的松散。它还禁止在
    `if` 语句使用函数语句。事实证明，大多数浏览器允许在 `if` 语句使用函数语句，但它们的解释方式各异。这创建了可移植性问题。


    语句中的第一个元素不能是函数表达式，因为官方语法假设以 `function` 单词开头的语句是函数语句。解决方法是将函数表达式封装在括号中：


    ```

    function () {\ var hidden_variable;


    // 这个函数可能会对

    // 环境产生一些影响，但不会引入新的

    // 全局变量。

    }();

    ```


    ## 类型包装器


    JavaScript 有一组带类型的包装器。例如：

    `new Boolean(false)`

    产生一个具有 `valueOf` 方法的对象，该方法返回包装的值。这事实证明是完全没必要的而且偶尔会引起困惑。不要使用 `Boolean` 或 `new Number`
    或 `new String`。

    也避免 `new Object` 和 `new Array`。改用 `{}` 和 `[]`。


    ## new


    JavaScript 的 `new` 运算符创建一个并自自操作数原型成员的新对象，然后调用操作数，并将新对象绑定到其。这让操作数（最好是一个构造函数）在返回给请求者之前有一个自定义新对象的机会。

    如果你忘记使用 `new` 运算符，你得到的是一个普通的函数调用，它绑定到全局对象而不是新对象。这意味着你的函数在尝试初始化新成员时会破坏全局变量。这是非常糟糕的。没有编译时警告。没有运行时警告。

    按照习惯，打算配合 `new` 的函数应该以大写字母开头，而大写字母开头的名字应仅用于带有 `new` 前缀的构造函数。这为我们提供了一个视觉线索，有助于发现语言本身热于忽略的昂贵错误。

    更好的拷贝策略是完全不使用 `new`。


    ## void


    在许多语言中，`void` 是一个没有值的类型。在 JavaScript 中，`void` 是一个运算符，接受一个操作数并返回 `undefined`。这没有用，而且非常困惑。避免
    `void`。


    ## 附录 C

    JSLint


    > 什么样的错误让我们的耳目失灵？——威廉·莎士比亚，《喜剧》


    当 C 还是一个年轻的编程语言时，有一些常见的编程错误没有被原始编译器捕获，因此开发了一个名为 JSLint 的辅助程序，它可以扫描源文件寻找问题。


    随着 C 的成熟，语言的定义被加强以消除一些不安全性，批评者也更擅长发布警告。JSLint 不再需要了。


    JavaScript 是一个年轻的语言。它最初是为了在网页中执行小任务，这些任务对于 Java 来说太重且笨拙。但 JavaScript 是一种非常强大的语言，现在被用于更大的项目。许多旨在让语言易于使用的特性对于大型项目是有问题的。JavaScript
    需要 JSLint：JSLint 语法检查器和验证器。


    JSLint 是一个 JavaScript 的代码质量工具。它接受源代码并进行扫描。如果发现问题，它会返回一个描述问题的信息以及在源码中的大致位置。问题不一定是语法错误，尽管它通常是。JSLint
    还会查看一些风格规范以及结构性问题。它并不证明你的程序是正确的。它只是提供了另一个帮助发现问题的视角。


    JSLint 定义了 JavaScript 的专业子集，这比 ECMAScript 语言规范第三版定义的语言更严格。该子集与第 9 章的风格建议密切相关。


    JavaScript 是一个粗糙的语言，但在内部存在一个优雅的、更好的语言。JSLint 帮助用这种更好的语言进行编程，并避免大部分的粗糙。


    可以在 http://www.JSLint.com/ 找到 JSLint。


