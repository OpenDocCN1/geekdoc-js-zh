    \ j < n; j += 1) {\n            a[j] = initial;\n        }\n        mat[i] = a;\n\
    \    }\n    return mat;\n}\n\n// Make a 4 * 4 matrix filled with zeros.\n\n```javascript\n\
    var myMatrix = Array.matrix(4, 4, 0);\ndocument.writeln(myMatrix[3][3]); // 0\n\
    ```\n\n// Method to make an identity matrix.\n\n```javascript\nArray.identity\
    \ = function (n) {\n    var i, mat = Array.matrix(n, n, 0);\n    for (i = 0; i\
    \ < n; i += 1) {\n        mat[i][i] = 1;\n    }\n    return mat;\n}\n\nmyMatrix\
    \ = Array.identity(4);\n\n```javascript\ndocument.writeln(myMatrix[3][3]); //\
    \ 1\n```\n\n## CHAPTER 7\n\n## Regular Expressions\n\n> Whereas the contrary bringeth\
    \ bliss,\n> And is a pattern of celestial peace.\n> Whom should we match with\
    \ Henry, being a king...\n—William Shakespeare, The First Part of Henry the Sixth\n\
    \nMany of JavaScript's features were borrowed from other languages. The syntax\
    \ came from Java, functions came from Scheme, and prototypal inheritance came\
    \ from Self. JavaScript's Regular Expression feature was borrowed from Perl.\n\
    \nA regular expression is the specification of the syntax of a simple language.\
    \ Regular expressions are used with methods to search, replace, and extract information\
    \ from strings. The methods that work with regular expressions are regex.exec,\
    \ regex.test, string.match, string.replace, string.search, and string.split. These\
    \ will all be described in Chapter 8. Regular expressions usually have a significant\
    \ performance advantage over equivalent string operations in JavaScript.\n\nRegular\
    \ expressions came from the mathematical study of formal languages. Ken Thompson\
    \ adapted Stephen Kleene's theoretical work on type-3 languages into a practical\
    \ pattern matcher that could be embedded in tools such as text editors and programming\
    \ languages.\n\nThe syntax of regular expressions in JavaScript conforms to the\
