    \ Object.prototype，这是标准 JavaScript 自带的对象。\n\n当你创建一个新对象时，JavaScript 提供了一种选择哪个对象作为其原型的方法。实现这一点的机制既杂乱又复杂，但可以显著简化。我们将为\
