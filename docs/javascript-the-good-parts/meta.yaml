    // it returns the result of calling itself.\n\n// JavaScript does not currently\
    \ optimize this form.\n\nvar factorial = function factorial(i, a) {\n  a = a ||\
    \ i;\n  if (i < 2) {\n    return a;\n  }\n  return factorial(i - 1, a * i);\n\
    };\n\ndocument.writeln(factorial(4)); // 24\n```\n\n## Scope\n\nScope in a programming\
    \ language controls the visibility and lifetimes of variables and parameters.\
    \ This is an important service to the programmer because it reduces name collisions\
    \ and provides automatic memory management:\n\n```javascript\nvar foo = function\
    \ () {\n  var a = 3, b = 5;\n\n  var bar = function () {\n    var b = 7, c = 11;\n\
    \    // At this point, a is 3, b is 7, and c is 11\n    a += b + c;\n    // At\
    \ this point, a is 21, b is 7, and c is 11\n  };\n\n  // At this point, a is 3,\
    \ b is 5, and c is not defined\n  bar();\n  // At this point, a is 21, b is 7,\
    \ and c is 5\n};\n```\n\nMost languages with C syntax have block scope. All variables\
    \ defined in a block (a list of statements wrapped with curly braces) are not\
    \ visible from outside of the block. The variables defined in a block can be released\
    \ when execution of the block is finished. This is a good thing.\n\nUnfortunately,\
    \ JavaScript does not have block scope even though its block syntax suggests that\
    \ it does. This confusion can be a source of errors.\n\nJavaScript does function\
    \ scope. That means the parameters and variables defined in a function are not\
    \ visible outside of the function, and that a variable defined anywhere within\
    \ a function is visible everywhere within the function.\n\nIn many modern languages,\
    \ it is recommended that variables be declared as late as possible, at the first\
    \ point of use. That turns out to be bad advice for JavaScript because it lacks\
    \ block scope. So instead, it is best to declare all of the variables in a function\
    \ at the top of the function body.\n\n## Closure\n\nThe good news about scope\
    \ is that inner functions get access to the parameters and variables of the functions\
    \ they are defined within (with the exception of this and arguments). This is\
    \ a very good thing.\n\nOur getElementsByAttribute worked because it declared\
    \ a results variable, and the inner function that it passed to walk_the_DOM also\
    \ had access to the results variable.\n\nA more interesting case is when the inner\
    \ function has a longer lifetime than its outer function.\n\nEarlier, we made\
    \ a myObject that had a value and an increment method. Suppose we wanted to protect\
    \ the value from unauthorized changes.\n\nInstead of initializing myObject with\
