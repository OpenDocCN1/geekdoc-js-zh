  md: "# Functional\n\nOne weakness of the inheritance patterns we have seen so far\
    \ is that we get no privacy. All properties of an object are visible. We get no\
    \ private variables and no private methods. Sometimes that doesn't matter, but\
    \ sometimes it matters a lot. In frustration, some unformed programmers have adopted\
    \ a pattern of pretend privacy. If they have a property that they wish to make\
    \ private, give it an odd-looking name, with the hope that other users of the\
    \ code will pretend that they cannot see the odd looking members. Fortunately,\
    \ we have a much better alternative in an application of the module pattern.\n\
    \nWe start by making a function that will produce objects. We will give it a name\
    \ that starts with a lowercase letter because it will not require the use of the\
    \ new prefix. The function contains four steps:\n\n+   1. It creates a new object.\
    \ There are lots of ways to make an object. It can make an object literal, or\
    \ it can call a constructor function with the new prefix, or it can use the Object.create\
    \ method to make a new instance from an existing object, or it can call any function\
    \ that returns an object.\n\n+   2. It optimally defines private instance variables\
    \ and methods. These are ordinary variables of the function.\n\n+   3. It augments\
    \ new object with the vars. These methods will have privileged access to the parameters\
    \ and the vars defined in the second step.\n\n+   4. It returns that new object.\n\
    \nHere is a pseudocode template for a functional constructor (boldface text added\
    \ for emphasis):\n\n```\nvar constructor = function (spec, my) {\n    var that,\
    \ other private instance variables;\n    my = my || {};\n\n    Add variables and\
    \ functions to my\n\n    that = a new object;\n\n    Add privileged methods to\
    \ that\n\n    return that;\n}\n```\n\nThe spec object contains all of the information\
    \ that the constructor needs to make an instance. The contents of the spec can\
    \ be copied into private variables or transformed by other functions. The methods\
    \ can access information from spec as they need it. (A simplification is to replace\
    \ spec with a single value. This is useful when the object being constructed does\
    \ not need a whole spec object.)"
