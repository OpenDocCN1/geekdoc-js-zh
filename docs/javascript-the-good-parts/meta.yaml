    \ number of each of the elements to the right.\n\n## Length\n\nThe length can\
    \ be set explicitly. Making length larger does not allocate more space for the\
    \ array. Making the length smaller will cause all properties with a subscript\
    \ greater or to the new length to be deleted:\n\n```javascript\nnumbers.length\
    \ = 3;\n// numbers is ['zero', 'one', 'two']\n```\n\nA new element can be appended\
