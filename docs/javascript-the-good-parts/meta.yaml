  md: '# About the Author


    Douglas Crockford is a senior JavaScript architect at Yahoo! who is well known
    for discovering and popularizing the JSON (JavaScript Object Notation) format.
    He is the world''s foremost living authority on JavaScript. He speaks regularly
    at conferences about advanced web technology, and he also serves on the ECMAScript
    committee.


    # Colophon


    The animal on the cover of JavaScript: The Good Parts is a Plain Tiger butterfly
    (Danaus chrysipp). Outside of Asia, the insect is also known as the African Monarch.
    It is a medium-size butterfly characterized by bright orange wings with six spots
    and animating black-and-white stripes.


    Its striking looks have been noted by many scientists and artists. The writer
    Vladimir Nabokov—who was also a noted lepidopterist—had admired words for the
    butterfly in another scathing New York Times book review of Alice Ford''s Butterflies,
    Motions, and Other Studies (The Studio Publications). In the book, Ford labels
    drawings previous to and during Audubon''s time in the 19th century as "scientifically-cailly
    [sic] unsophisticated.


    In response to Ford, Nabokov writes, "The unsophistication is all her own. She
    might have looked up John Audubon''s prodigious representations of North American
    lepidoptera, 1797, and the splendid plates of 18th- and early-19th-century German
    lepidopterists. She might have traveled back some 33 centuries to the times of
    Thrombosis IV or Amenoph III and, instead of the obvious scarab, found there frescoes
    with a marvelous Egyptian butterfly (subtly combining the pattern of our Painted
    Lady and the body of an African ally of the Monarch."


    While the Plain Tiger''s beauty is part of its charm, its looks can also be deadly.
    During its larval stages, the butterflies ingest alkaloids that are poisonous
    to birds—its main predator—which are often attracted to the insect''s markings.
    After ingesting the Plain Tiger, a bird will vomit—occasionally fatally. If the
    bird lives, it will let other birds avoid the insect, which can also be recognized
    by its leisurely, meandering pattern of flying low to the earth.


    The cover image is from Dover''s Animals. The cover font is Adobe Garamond. The
    text font is Linotype Birka; the heading font is Adobe Myriad Condensed; and the
    code font is LucasFont''s TheSans Mono Condensed.'
  merge: -1
