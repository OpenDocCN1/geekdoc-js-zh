    \ `in` 语句，并创建一个包含名称的数组：\n\n```javascript\nvar i;\nvar properties = [\n  'first-name',\n\
    \  'middle-name',\n  'last-name',\n  'profession'\n];\nfor (i = 0; i < properties.length;\
    \ i += 1) {\n  document.writeln(properties[i] + ': ' + another_stooge(properties[i]));\n\
    }\n```\n\n通过使用这种替代 `for in`，我们能够获得想要的属性，而无需担心可能会从原型链中挖掘出什么。\n\n# 删除\n\n可以使用 `delete`\
    \ 运算符从对象中删除属性。如果对象中有该属性，它将将其移除。它不会触碰任何原型链接。\n\n从对象中移除属性可能会允许原型链接中的属性显示出来：\n\n\
    ```javascript\nanother_stooge.nickname // 'Moe'\n```\n\n```javascript\n// 从 another_stooge\
    \ 中移除 nickname，显示\n// 原型的 nickname。\ndelete another_stooge.nickname;\n\nanother_stooge.nickname\
    \ // 'Curly'\n```\n\n# 全局抑制\n\nJavaScript 允许定义包含你应用程序所有资源的全局变量。不幸的是，全局变量会削弱程序的韧性并应该避免。\n\
    \n减少全局变量使用的一种方法是为你的应用程序创建一个全局变量：\n\n```javascript\nvar MYAPP = {};\n```\n\n该变量随后成为你应用程序的容器：\n\
    \n```javascript\nMYAPP.stooge = {\n  \"first-name\": \"Joe\",\n  \"last-name\"\
    : \"Howard\"\n}\n\nMYAPP.flight = {\n  airline: \"Oceanic\",\n  number: 815,\n\
    \  departure: {\n    IATA: \"SYD\",\n    time: \"2004-09-22 14:55\",\n    city:\
    \ \"Sydney\"\n  },\n  arrival: {\n    IATA: \"LAX\",\n    time: \"2004-09-23 10:42\"\
    ,\n    city: \"Los Angeles\"\n  }\n}\n```\n\n通过将你的全局足迹减少到单个名称，你显著减少了与其他应用程序、插件或库发生不良交互的概率。你的程序变得更容易阅读，因为显然\
    \ MYAPP.stooge 指的是顶层结构。在下一章中，我们将看到使用闭包进行信息隐藏的方法，这是另一种有效的全局抑制技术。\n\n"
