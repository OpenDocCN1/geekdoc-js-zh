  md: '# throw statement


    ![](img/03300178c40ed5b3e760309f69ee3125_29_0.png)


    The throw statement raises an exception. If the throw statement is in a try block,
    then control goes to the catch clause. Otherwise, the function invocation is abandoned,
    and control goes to the catch clause of the try in the calling function.


    The expression is usually an object literal containing a name property and a message
    property. The catcher of the exception can use that information to determine what
    to do.


    # return statement


    ![](img/03300178c40ed5b3e760309f69ee3125_29_1.png)


    The return statement causes the early return from a function. It can also specify
    the value to be returned. If a return expression is not specified, then the return
    value will be undefined.


    JavaScript does not allow a line end between the return and the expression.


    # break statement


    ![](img/03300178c40ed5b3e760309f69ee3125_29_2.png)


    The break statement causes the exit from a loop statement or a switch statement.
    It can optionally have a label that will cause an exit from the labeled statement.


    JavaScript does not allow a line end between the break and the label.


    # expression statement


    ![](img/03300178c40ed5b3e760309f69ee3125_29_3.png)'
