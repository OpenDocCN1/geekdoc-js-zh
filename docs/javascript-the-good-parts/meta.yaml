  mdcn: "\n幸运的是，`for` 语句避免了这些问题。JavaScript 的 `for` 语句与大多数 C 类语言中的语句相似。它由三个子句控制：第一个初始化循环，第二个是\
    \ `while` 条件，第三个执行递增：\n\n```javascript\nvar i;\nfor (i = 0; i < myArray.length;\
    \ i += 1) {\n  document.writeln(myArray[i]);\n}\n```\n\n## 混淆\n\nJavaScript 程序中常见的错误是在需要数组的地方使用了对象，或者在需要对象的地方使用了数组。规则很简单：如果属性名是连续的小整数，你就应该使用数组。否则，请使用对象。\n\
    \nJavaScript 本身对数组和对象之间的区别也感到困惑。\n`typeof` 操作符报告数组的类型为 'object'，这并没有什么帮助。\n\n\
    JavaScript 没有一种好的机制来区分数组和对象。我们可以通过定义自己的 `is_array` 函数来弥补这一缺陷：\n\n```javascript\n\
    var is_array = function (value) {\n  return value &&\n    typeof value === 'object'\
    \ &&\n    value.constructor === Array;\n}\n```\n\n遗憾的是，它无法识别在不同窗口或帧中构造的数组。如果我们想准确检测那些外部数组，必须多下点功夫：\n\
    \n```javascript\nvar is_array = function (value) {\n  return value &&\n    typeof\
    \ value === 'object' &&\n    typeof value.length === 'number' &&\n    typeof value.splice\
    \ === 'function' &&\n    ! (value.propertyIsEnumerable('length'));\n}\n```\n\n\
    首先，询问该值是否为真（truthy）。我们这样做是为了拒绝 `null` 和 `false` 值。\n其次，询问 `typeof` 是否为 'object'。对于对象、数组以及（奇怪地）`null`\
    \ 都是真。第三，询问该值是否具有数字类型的 `length` 属性。这对于数组始终为真，但对于对象通常不是。第四，询问该值是否包含 `splice` 方法。这对于所有数组来说又是真。最后，我们询问该属性是否是枚举的（`length`\
    \ 是否会被 `for` 循环产生）？这对于所有数组来说都是假。这是我发现的针对数组最可靠的测试。遗憾的是，它是如此复杂。\n\n有了这样的测试，就可以编写出函数：当传递单个值时执行某项操作，当传递值数组时执行许多项操作。\n\
    \n## 方法\n\nJavaScript 提供了一组用于操作数组的方法。这些方法是存储在 `Array.prototype` 中的函数。在第 3 章中，我们看到\
    \ `Object.prototype` 可以被扩展。`Array.prototype` 也可以很好地扩展。\n\n例如，假设我们想添加一个数组方法，允许我们对数组进行计算：\n\
    \n```javascript\nArray.prototype.reduce = function (f, value) {\n  var i;\n  for\
    \ (i = 0; i < this.length; i += 1) {\n    value = f(this[i], value);\n  }\n  return\
    \ value;\n}\n```\n\n通过向 `Array.prototype` 添加一个函数，每个数组都继承了该方法。在这种情况下，我们定义了一个接收一个函数和一个起始值的方法。对于数组的每个元素，它都会带上元素和当前值调用函数，计算出一个新值。完成后，它返回该值。如果我们传入一个将两个数相加的函数，它就会计算和。如果我们传入一个将两个数相的函数，它就会计算乘积：\n\
    \n```javascript\n// 创建一个数字数组。\n\nvar data = [4, 8, 15, 16, 23, 42];\n\n// 定义两个简单的函数。一个将相加两个数\n\
    // 另一个将相乘两个数。\n\nvar add = function (a, b) {\n  return a + b;\n};\n\nvar mult\
    \ = function (a, b) {\n  return a * b;\n}\n```\n\n```javascript\n// 调用 data 的\
    \ reduce 方法，传入\n// add 函数。\n\nvar sum = data.reduce(add, 0); // sum 是 108\n```\n\
    \n```javascript\n// 再次调用 reduce 方法，这次传入\n// multiply 函数。\n\nvar product = data.reduce(mult,\
    \ 1); // product 是 7418880\n```\n\n因为数组实际上是一个对象，我们可以直接向单个数组上添加方法：\n\n```javascript\n\
    // 给 data 数组添加一个总和函数。\n\ndata.total = function () {\n  return this.reduce(add,\
    \ 0);\n}\n\nvar total = data.total(); // total 是 108\n```\n\n由于字符串 'total' 不是整数，因此向数组添加\
    \ `total` 属性不会改变其长度。数组在属性名是整数时最有用，但它们仍然是对象，而对象可以接受任何字符串作为属性名。\n\n在数组上使用第 3 章的\
    \ `Object.create` 方法没有用，因为它产生的不是数组。产生的对象将继承数组的值和方法，但它将没有特殊属性。\n\n## 维度\n\nJavaScript\
    \ 数组通常是不初始化的。如果你用 `[]` 请求一个新数组，它将是空的。如果你访问某个元素，你将得到 `undefined` 值。如果你意识到这一点，并在尝试检索每个元素之前自然地设置每个元素，那么一切都是好的。如果你正在实现的算法假设每个元素从从已知值（如\
    \ 0）开始，你必须自己准备数组。JavaScript 应该提供某种形式的 `Array.dim` 方法来这样做，但我们可以轻松修正这一疏漏：\n\n```javascript\n\
    Array.dim = function (dimension, initial) {\n  var a = [], i;\n  for (i = 0; i\
    \ < dimension; i += 1) {\n    a[i] = initial;\n  }\n  return a;\n}\n\n// 创建一个包含\
    \ 10 个零的数组。\n\n```javascript\nvar myArray = Array.dim(10, 0);\n```\n\nJavaScript\
    \ 没有多于一个维度的数组，但像大多数 C 语言一样，它可以拥有数组的数组：\n\n```javascript\nvar matrix = [\n  [0,\
    \ 1, 2],\n  [3, 4, 5],\n  [6, 7, 8]\n];\nmatrix[2][1] // 7\n```\n\n要创建一个二维数组或数组的数组，你必须自己构建数组：\n\
    \n```javascript\nfor (i = 0; i < n; i += 1) {\n    my_array[i] = [];\n}\n```\n\
    \n// 注意：Array.dim(n, []) 在这里不起作用。\n// 每个元素将获得同一个数组的引用，这会非常糟糕。\n\n空矩阵的单元格最初将具有值\
    \ `undefined`。如果你想让它们拥有不同的值，必须显式地设置它们。再次，JavaScript 应该对矩阵提供更好的支持。我们也可以修正这一点：\n\
    \n```javascript\nArray.matrix = function (m, n, initial) {\n    var a, i, j, mat\
    \ = [];\n    for (i = 0; i < m; i += 1) {\n        a = [];\n        for (j = 0;\
    \ j < n; j += 1) {\n            a[j] = initial;\n        }\n        mat[i] = a;\n\
    \    }\n    return mat;\n}\n\n// 创建一个填充零的 4 * 4 矩阵。\n\n```javascript\nvar myMatrix\
    \ = Array.matrix(4, 4, 0);\ndocument.writeln(myMatrix[3][3]); // 0\n```\n\n//\
    \ 创建单位矩阵的方法。\n\n```javascript\nArray.identity = function (n) {\n    var i, mat\
    \ = Array.matrix(n, n, 0);\n    for (i = 0; i < n; i += 1) {\n        mat[i][i]\
    \ = 1;\n    }\n    return mat;\n}\n\nmyMatrix = Array.identity(4);\n\n```javascript\n\
    document.writeln(myMatrix[3][3]); // 1\n```\n\n## 第 7 章\n\n## 正则表达式\n\n> 与此相反带来了福气，\n\
    > 是一条天堂和平的路径。\n> 我们应该与亨利匹配，他是一个国王……\n—威廉·莎士，《亨利六世第一部》\n\nJavaScript 的许多功能借自其他语言。语法来自\
    \ Java，函数来自 Scheme，而原型继承来自 Self。JavaScript 的正则表达式功能借自 Perl。\n\n正则表达式是简单语言语法的规范。正则表达式配合方法对字符串进行搜索、替换和提取信息。与正则表达式工作的方法有\
    \ `exec`、`test`、`match`、`replace`、`search` 和 `split`。这些将在将在 章详细介绍。正则表达式通常比 JavaScript\
    \ 等效字符串操作具有显著的性能优势。\n\n正则表达式源于对形式语言的研究。肯·汤普将斯蒂芬·克莱尼对类型3 语言的理论工作转化为实用的模式匹配器，可以嵌入到文本编辑器和编程语言等工具中。\n\
    \nJavaScript 中正则表达式的语法符合贝尔实验室的原始配方，并带有 Perl 的一些重新解释和扩展。编写正则表达式的规则异常地复杂，因为它们在某些位置将字符解释为运算符，在不同的位置将其解释为字面量。更难于编写的是，这使得正则表达式难以阅读且修改起来危险。要正确阅读它们，必须对正则表达式的全复杂性有相当全面的理解。为了缓解这一点，我稍微简化了规则。按照这里的呈现，正则表达式将稍微不那么简洁，但也会更容易被正确使用。这本身是是件好事，因为正则表达式可能非常难以维护和调试。\n\
    \n"
