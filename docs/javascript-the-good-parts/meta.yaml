- md: "\nFortunately, integer arithmetic in floating point is exact, so decimal representation\
    \ errors can be avoided by scaling.\n\nFor example, dollar values can be converted\
    \ to whole cents by multiplying them by 100. The cents then can be accurately\
    \ added. The sum can be divided by 100 to convert back into dollars. People have\
    \ a reasonable expectation when they count may the results will be exact.\n\n\
    ## NaN\n\nThe value NaN is a special quantity defined by IEEE 754. It stands for\
    \ *not a number*, even though:\n\n```\ntypeof NaN === 'number' // true\n```\n\n\
    The value can be produced by attempting to convert a string to a number when the\
    \ string is not in the form of a number. For example:\n\n```\n+ '0' // 0\n+ 'oops'\
    \ // NaN\n```\n\nIf NaN is an operand in an arithmetic operation, NaN will be\
    \ the result. So, if you have a chain of formulas that produce NaN as a result,\
    \ at least one of the inputs was NaN, or NaN was generated somewhere.\n\nYou can\
    \ test for NaN. As we have seen, typeof does not distinguish between numbers and\
    \ NaN, and it turns out that NaN is not equal to itself. So:\n\n```\nNaN === NaN\
    \ // false\nNaN !== NaN // true\n```\n\nJavaScript provides an isNaN function\
    \ that can distinguish between numbers and NaN:\n\n```\nisNaN(NaN) // true\nisNaN(0)\
    \ // false\nisNaN('oops') // true\nisNaN('0') // false\n```\n\nThe isFinite is\
    \ the best way of determining whether a value can be used as a number because\
    \ it rejects NaN and Infinity. Unfortunately, isFinite will attempt to convert\
    \ its operand to a number, so it is not a good test if a value is actually a number.\
    \ You may to define your own isNumber function:\n\n```javascript\nvar isNumber\
    \ = function isNumber(value) { return typeof value === 'number' &&\nisFinite(value);\
    \ }\n```\n\n## Phony Arrays\n\nJavaScript does not have real arrays. That's all\
    \ bad. JavaScript's arrays are really easy to use. There is no need to give them\
    \ a dimension, and they never generate out-of-bounds errors. But their performance\
    \ can be considerably worse than real arrays.\n\nThe typeof operator does not\
    \ distinguish between arrays and objects. To determine that a value is an array,\
    \ you also need to consult its constructor property:\n\n```javascript\nif (my_value\
    \ && typeof my_value === 'object' &&\n  my_value.constructor === Array) {\n  //\
    \ my_value is an array!\n}\n```\n\nThat will give a false negative if an array\
    \ was created in a different frame or window. This test is more reliable when\
    \ the value might have been created in another frame:\n\n```javascript\nif (my_value\
    \ && typeof my_value === 'object' &&\n  my_value.length === 'number' &&\n  !my_value.hasOwnProperty('length'))\
    \ {\n  // my_value is truly an array!\n}\n```\n\nThe arguments is not an array;\
    \ it is an object with a length property. That will identify the arguments array\
    \ as an array, which is sometimes what you want, even though arguments not have\
    \ any of the array methods. In any case, the test can still fail if the propertyEnumerable\
    \ method is overridden.\n\n## Falsy Values\n\nJavaScript has a surprisingly large\
    \ set of false values, shown in Table A-1.\n\nTable A-1. The many false values\
    \ of JavaScript\n\n| Value | Type |\n| :--- | :--- |\n| 0 | Number |\n| NaN (not\
    \ a number) | Number |\n| '' (empty string) | String |\n| false | Boolean |\n\
    | null | Object |\n| undefined | Undefined |\n\nThese values are all false, but\
    \ they are not interchangeable. For example, this is the right way to determine\
    \ if an object is missing a member:\n\n```javascript\nvalue = myObject[name];\n\
    if (value == null) {\n  alert(name + ' not found.');\n}\n```\n\nundefined is the\
    \ value of missing members, this snippet is testing for null. It is using the\
    \ == operator (see Appendix B), which does type coercion, instead of the more\
    \ reliable === operator. Sometimes these two errors cancel each other out. Some-times\
    \ they don't.\n\nundefined and NaN are not constants. They are global variables,\
    \ and you can change their values. That should not be possible, and yet it is.\
    \ Don’t do it.\n\n## hasOwnProperty\n\nIn Chapter 3, the hasOwnProperty method\
    \ was offered as a filter to work around a problem with the for in statement.\
    \ Unfortunately, hasOwnProperty is a method, not an operator, so in object it\
    \ can be replaced with a different function or even a value that is not a function:\n\
    \n```javascript\nvar name;\nanother_stooge.hasOwnProperty = null; // trouble\n\
    for (name in another_stooge) {\n  if (another_stooge.hasOwnProperty(name)) { //\
    \ boom\n    document.write(name + ': ' + another_stooge[name]);\n  }\n}\n```\n\
    \n## Object\n\nJavaScript’s objects are never truly empty because they can pick\
    \ up members from the prototype chain. Sometimes that matters. For example, suppose\
    \ you are writing a program that counts the number of occurrences of each word\
    \ in a text. We can use the toLowerCase method to normalize the text to lowercase,\
    \ and then use the split method with a regular expression to produce an array\
    \ of words. We can loop through the words and count the number of times we see\
