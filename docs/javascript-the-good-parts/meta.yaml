- md: "\nRegular expression literals are enclosed in slashes. This can be a little\
    \ tricky because slash is also used as the division operator and in comments.\n\
    \nThere are three flags that can be set on a RegExp. They are indicated by the\
    \ letters g, i, and m, as listed in Table 7-1. The flags are appended directly\
    \ to the end of the RegExp literal:\n\n```javascript\n// Make a regular expression\
    \ object that matches\n// a JavaScript string.\nvar my_regexp = /^(?::\\.||[^\\\
    ]])*$/g;\n```\n\n## Table 7-1. Flags for regular expressions\n\n| Flag | Meaning\
    \ |\n| :--- | :--- |\n| g | Global (match multiple times; the precise meaning\
    \ of this varies with the method) |\n| i | Insensitive (ignore case character)\
    \ |\n| m | Multiline (^ and s match line-ending characters) |\n\nThe other way\
    \ to make a regular expression is to use the RegExp constructor. The constructor\
    \ takes a string and compiles it into a RegExp object. Some care must be taken\
    \ in building the string because backslashes have a somewhat different meaning\
    \ in regular expressions than in string literals. It is usually necessary to double\
    \ the backslashes and escape the quotes:\n\n```javascript\n// Make a regular expression\
    \ object that matches\n// a JavaScript string.\nvar my_regexp = new RegExp(\"\
    (?:\\||[^\\]])*\", 'g');\n```\n\nThe second parameter is a string specifying the\
    \ flags. The RegExp constructor is useful when a regular expression must be generated\
    \ at runtime using material that is not available to the programmer.\n\nRegExp\
    \ objects contain the properties listed in Table 7-2.\n\n## Table 7-2. Properties\
    \ of RegExp objects\n\n| Property | Use |\n| :--- | :--- |\n| global | true if\
    \ the g flag was used. |\n| ignoreCase | true if the i flag was used. |\n| lastIndex\
    \ | The index at to start the next exec match. Initially it is zero. |\n| multiline\
    \ | true if the m flag was used. |\n| source | the source text of the regular\
    \ expression. |\n\nRegExp objects made by regular expression literals share a\
    \ single instance:\n\n```javascript\nfunction make_a_matcher() {\n  return /a/gi;\n\
    }\n\nvar x = make_a_matcher();\nvar y = make_a_matcher();\n\n// Beware: x and\
