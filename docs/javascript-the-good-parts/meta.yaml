    : \"I'm sorry. Moe, it was an accident!\"\n}\n```\n\n# # Using JSON Securely\n\
    \nJSON is particularly easy to use in web applications because JSON is JavaScript.\
    \ A JSON text can be turned into a useful data structure with the eval function:\n\
    \n```\nvar myData = eval(`(' + JSONText + ')`);\n```\n\nThe concatenation of the\
    \ parentheses around the JSON text is a workaround for an ambiguity in JavaScript's\
    \ grammar.\n\nThe eval function has horrendous security problems, however. Is\
    \ it safe to use to parse a JSON text? The best technique for obtaining data from\
    \ a server in a web browser is through XMLHttpRequest. XMLHttpRequest can obtain\
    \ only data from the same server that produced the HTML. Evaluating text from\
    \ that server is less secure than the original HTML, but assumes the server is\
    \ malicious. What if the server is simply incompetent?\n\nAn incompetent server\
    \ might not do the JSON encoding correctly. If it builds JSON by slashing some\
    \ strings rather than using a proper JSON encoder, it could unintentionally send\
    \ dangerous material. If it acts as a proxy and passes JSON text without determining\
    \ whether it is well formed, then it could send dangerous material again.\n\n\
    The danger can be avoided by using JSON.parse instead of eval (see http://www.JSON.org/json2.js).\
    \ JSON.parse will throw an exception if the text contains anything dangerous.\
    \ It is recommended that you always use JSON.parse instead of eval to defend against\
    \ server incompetence. It is also good practice for the day when the browser provides\
    \ safe data access to other servers."
