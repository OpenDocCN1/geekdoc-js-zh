  md: "Fortunately, the conventional for statement avoids these problems. JavaScript's\
    \ for\nstatement is similar to that in most C-like languages. It is controlled\
    \ by three\nclauses—the first initializes the loop, the second is the while condition,\
    \ and the third\ndoes the increment:\n\n```\nvar i;\nfor (i = 0; i < myArray.length;\
    \ i += 1) {\n  document.writeln(myArray[i]);\n}\n```\n\n# # Confusion\n\nA common\
    \ error in JavaScript programs is to use an object when an array is required\n\
    or when an object is required. The rule is simple: use the property names\narere\
    \ small sequential integers, you should use an array. Otherwise, use an object.\n\
    \nJavaScript itself is confused about the difference between arrays and objects.\n\
    The typeof operator reports that the type of an array is 'object', which isn't\
    \ very helpful.\n\nJavaScript does not have a good mechanism for distinguishing\
    \ between arrays and\nobjects. We can work around that deficiency by defining\
    \ our own is_array function:\n\n```\nvar is_array = function (value) {\n  return\
    \ value &&\n    typeof value === 'object' &&\n    value.constructor === Array;\n\
    }\n```\n\nUnfortunately, it fails to identify arrays that were constructed in\
    \ a different window\nor frame. If we want to accurately detect those foreign\
    \ arrays, we have to work a lit-\nter handler:\n\n```\nvar is_array = function\
    \ (value) {\n  return value &&\n    typeof value === 'object' &&\n    typeof value.length\
    \ === 'number' &&\n    typeof value.splice === 'function' &&\n    ! (value.propertyIsEnumerable('length'));\n\
    }\n```\n\nFirst, ask if the value is truthy. We do this to reject null and false\
    \ values.\nSecond, ask if the typeof is 'object'. This will be true for objects,\
    \ arrays,\nand (weirdly) null. Third, ask if the value has a length property that\
    \ is a number.\nThis will always be true for arrays, but usually not for objects.\
    \ Fourth, ask if the\nvalue contains a splice method. This will again true for\
    \ all arrays. Finally, we ask\nif the property is enumerable (will length produced\
    \ by a for loop)?\nThat will be false for all arrays. This is the most reliable\
    \ test for arrays that I have\nfound. It is unfortunately that it is so complicated.\n\
    \nHaving such a test, it is possible to write functions that do one thing when\
    \ passed\nsingle value and lots of things when passed an array of values."
