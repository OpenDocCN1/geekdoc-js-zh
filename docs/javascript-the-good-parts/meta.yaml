    \ 权威的 JavaScript 和 HTML 菜谱、学习 JavaScript。\n\n**oreilly.com** oreilly.com 不仅仅是\
    \ O'Reilly 书籍的完整目录。你还将找到新闻、活动、文章、博客、示例章节和代码示例的链接。\n\noreillynet.com 是对开源和新兴技术感兴趣开发者的必备门户，包括新平台、专业编程语言和操作系统。\n\
