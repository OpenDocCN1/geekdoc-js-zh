  md: "JSLint allows you to turn on the “Tolerate sloppy line breaking” (laxbreak)\
    \ option. Semicolon insertion can mask copy/paste errors. If you always break\
    \ lines after operators, JSLint can do a better job of finding those errors.\n\
    \n# Comma\n\nThe comma operator can lead to excessively tricky expressions. It\
    \ can also mask some programming errors.\nJSLint expects to see the comma used\
    \ as a separator, but not as an operator (except in the initialization and incrementation\
    \ parts of the for statement). It does not expect to see el elements in array\
    \ literals. Extra commas should not be used. A comma should not appear after the\
    \ last element of an array literal or object literal because it can be misinterpreted\
    \ by some browsers.\n\n# Required Blocks\n\nJSLint expects that if and for statements\
    \ will be made with blocks—that is, with statements enclosed in braces ({}).\n\
    JavaScript allows an to be written like this:\n\n```\nif (condition)\n  statement;\n\
    ```\n\nThat form is known to contribute to mistakes in projects where many programmers\
    \ are working on the same code. That is why JSLint expects the use of a block:\n\
    \n```\nif (condition) {\n  statements;\n}\n```\n\nExperience shows that this form\
    \ is more resilient.\n\n# Forbidden Blocks\n\nIn many languages, a block introduces\
    \ a scope. Variables introduced in a block are not visible outside of the block.\n\
    \nIn JavaScript, blocks do not introduce a scope. There is only function-scope.\
    \ A variable introduced anywhere in a function is visible everywhere in the function.\
    \ JavaScript’s blocks confuse experienced programmers and lead to errors because\
    \ the familiar syntax makes a false promise.\n\nJSLint expects blocks with function,\
    \ if, switch, while, for, do, and try statements and nowhere else. An exception\
    \ is made for an unblocked statement on else or for in."
  merge: -1
