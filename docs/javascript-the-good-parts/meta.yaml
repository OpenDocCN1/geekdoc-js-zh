    \ 子集。也可以在脚本源码中设置这些选项。\n\n选项规范如下：\n\n```javascript\n/*jslint nomen: true, evill:\
    \ false */\n```\n\n选项规范以 `/*jslint` 开头。注意 `j` 之前没有空格。该规范包含一系列名称/值对，其中名称是 JSLint\
    \ 选项，值是 `true` 或 `false`。选项规范将接管选项对象。所有选项默认为 `false`。表 C-1 列出了使用 JSLint 时可用的选项。\n\
    \n表 C-1. JSLint 选项\n\n| 选项 | 含义 |\n|---|---|\n| adsafe | 如果强制执行规则则为 true |\n|\
