  md: "# # Enumeration\n\nThe for in statement can loop over all of the property names\
    \ in an object. The enumeration will include all of the properties—including functions\
    \ and prototype properties that you might not be interested in—so it is necessary\
    \ to filter out the values you don't. The most common filters are the hasOwnProperty\
    \ method and using typeof to exclude functions:\n\n```\nvar name;\nfor (name another_stooge)\
    \ {\n  if (typeof another_stooge[name] === 'function') {\n    document.writeln(name\
    \ + ': ' + another_stooge[name]);\n  }\n}\n```\n\nThere is no guarantee on the\
    \ order of the names, so be prepared for the names in any order. If you want to\
    \ assure that the properties appear in a particular order, it is best to avoid\
    \ the for in statement entirely and make an array containing the names of the\
    \ properties in the correct order:\n\n```\nvar i;\nvar properties = [\n  'first-name',\n\
    \  'middle-name',\n  'last-name',\n  'profession'\n];\nfor (i = 0; i < properties.length;\
    \ i += 1) {\n  document.writeln(properties[i] + ': ' + another_stooge(properties[i]));\n\
    }\n```\n\nBy using instead of for in, we were able to get the properties we wanted\
