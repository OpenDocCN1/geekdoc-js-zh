  md: "# Arguments\n\nA bonus parameter that is available to functions when they are\
    \ invoked is the arguments array. It gives the function access to all of the arguments\
    \ that were supplied with the invocation, including excess arguments that were\
    \ not assigned to parameters. This makes it possible to write functions that take\
    \ an unspecified number of parameters.\n\n```\n// Make a function that adds a\
    \ lot of stuff.\n\n// Note that defining the variable sum inside of\n// the function\
    \ does not interfere with the sum\n// defined outside of the function. The function\n\
    // only sees the inner one.\n\nvar sum = function () {\n  var i, sum = 0;\n  for\
    \ (i = 0; i < arguments.length; i += 1) {\n    sum += arguments[i];\n  }\n  return\
    \ sum;\n};\n```\n\n```\ndocument.writeln(sum(4, 8, 15, 16, 23, 42)); // 108\n\
    ```\n\nThis is not a particularly useful pattern. In Chapter 6, we will see how\
    \ we can add a similar method to an array.\n\nBecause of a design error, arguments\
    \ is not really an array. It is an array-like object. arguments has a length property,\
    \ but it lacks all of the array methods. We will see a consequence of that design\
    \ error at the end of this chapter.\n\n# Return\n\nWhen a function is invoked,\
    \ it begins execution with the first statement, and ends when it hits the } that\
    \ closes the function body. That causes the function to return control to the\
    \ part of the program that invoked the function.\n\nThe return statement can be\
    \ used to cause the function to return early. When return is executed, the function\
    \ returns immediately without executing the remaining statements.\n\nA function\
    \ always returns a value. If the return value is not specified, then undefined\
    \ is returned.\n\nIf the function was invoked with the new prefix and the return\
    \ value is not an object, then this (the new object) is returned instead."
