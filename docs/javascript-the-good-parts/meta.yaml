    \n有时，一个文件依赖于在其他定义的全局变量和函数。你可以通过在文件中包含注释来让 JSLint 识别这些内容，注释中列出程序依赖但在程序或脚本文件中未定义的全局函数和对象。\n\
    \n全局声明（global declaration）可以用于列出所有你有意作为全局变量使用的名称。JSLint 可以利用这些信息来识别拼写错误和遗漏的声明。全局声明如下：\n\
