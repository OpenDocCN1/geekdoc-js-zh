    \    if (typeof actual === 'string' &&\n        (actual === value || typeof value\
    \ !== 'string')) {\n      results.push(node);\n    }\n  });\n\n  return results;\n\
    };\n```\n\nSome languages offer the tail recursion optimization. This means that\
