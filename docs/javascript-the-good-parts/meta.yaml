    \n// Note: Array.dim(n, []) will not work here.\n// Each element would get a reference\
    \ to the same\n// array, which would be very bad.\n\nThe cells of an empty matrix\
    \ will initially have the value undefined. If you want them to have a different\
    \ value, you must explicitly set them. Again, JavaScript should have provided\
    \ better support for matrices. We can correct that, too:\n\n```\nArray.matrix\
    \ = function (m, n, initial) {\n    var a, i, j, mat = [];\n    for (i = 0; i\
    \ < m; i += 1) {\n        a = [];\n        for (j = 0; j < n; j += 1) {\n    \
    \        a[j] = initial;\n        }\n        mat[i] = a;\n    }\n    return mat;\n\
    }\n```\n\n// Make a 4 * 4 matrix filled with zeros.\n\n```\nvar myMatrix = Array.matrix(4,\
    \ 4, 0);\ndocument.writeln(myMatrix[3][3]); // 0\n```\n\n// Method to make an\
    \ identity matrix.\n\n```\nArray.identity = function (n) {\n    var i, mat = Array.matrix(n,\
    \ n, 0);\n    for (i = 0; i < n; i += 1) {\n        mat[i][i] = 1;\n    }\n  \
