    ```javascript\nstooge.profession = 'actor';\nanother_stooge.profession // 'actor'\n\
    ```\n\n我们将在第 6 章看到更多关于原型链的内容。\n\n# 反射\n\n可以通过尝试检索属性并检查获得的值来轻松检查对象以具有哪些属性。`typeof`\
