    # switch statement


    ![](img/03300178c40ed5b3e760309f69ee3125_27_0.png)


    The switch statement performs a multiway branch. It compares the expression for
    equality with all of the specified cases. The expression can produce a number
    or a string. When an exact match is found, the statements of the matching case
    clause are executed. If there is no match, the optional default statements are
    executed.


    # case clause


    ![](img/03300178c40ed5b3e760309f69ee3125_27_1.png)


    A case clause contains one or more case expressions. The case expressions need
    not to be constants. The statement following a case clause should be a disruptive
    statement to prevent fall through into the next case. The break statement can
    be used to exit from a switch.


    # while statement


    ![](img/03300178c40ed5b3e760309f69ee3125_27_2.png)


    The while statement performs a simple loop. If the expression is falsy, the loop
    will break. While the expression is truthy, the block will be executed.


    The for statement is a more complicated looping statement. It comes in two forms.

    The conventional form is controlled by three optional clauses: the initialization,
    the condition, and the increment. First, the initialization is done, which typically
    initializes the loop variable. Then, the condition is evaluated. Typically, this
    tests the loop variable against a completion criterion. If the condition is omitted,
    a condition of true is assumed. If the condition is falsy, the loop breaks. Otherwise,
    the block is executed, and the increment executes, and the loop repeats with the
    condition.'
