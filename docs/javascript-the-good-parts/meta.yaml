  mdcn: "\n功能（Features）是有文档成本的。每一个功能都会增加手册的页数，提高培训成本。那些为少数用户提供价值的功能会给所有用户带来成本。因此，在设计产品和编程语言时，我们希望确保核心功能——即好的部分——是正确的，因为那里是我们创造大部分价值的地方。\n\
    \n我们都能使用的产品中发现好的部分。我们推崇简单性，当别人没有提供简单性时，我们会自己创造它。我的微波炉有很多功能，但我使用的只有“烹饪”和“时钟”。而且设置时钟是一件苦差。我们通过寻找并坚持好的部分，来应对功能驱动设计带来的复杂性。\n\
    \n如果产品和编程语言在设计时只包含好的部分，那就太好了。\n\n# 附录 A\n\n## 糟糕的部分\n\n> 这在言语和行动上都将证明是糟糕的。\n——威廉·莎士比亚，《提尔斯的珀特里克》\n\
    \n在本章中，我将介绍 JavaScript 中那些无法轻易避免的问题功能。你必须意识到这些问题并做好应对的准备。\n\n## 全局变量\n\nJavaScript\
    \ 最糟糕的特性之一是它对全局变量的依赖。全局变量是在每个作用域内可见的变量。全局变量在非常小的程序中可能是一种便利，但随着程序扩大，它们会迅速变得难以管理。因为全局变量可以被程序的任何部分在任何时间修改，它们会显著增加程序的行为。使用全局变量会降低使用它们的程序的可靠性。\n\
    \n全局变量使得在同一个程序中运行独立的子程序变得更加困难。如果子程序恰好拥有同名的全局变量，它们将相互干扰并可能导致失败，且通常以难以诊断的方式发生。\n\
    \n许多语言都有全局变量。例如，Java 的静态成员就是全局变量。JavaScript 的问题不仅在于它允许它们的存在更在于它要求它们存在。JavaScript\
    \ 没有链接器。所有的编译单元都被加载到一个共同的全局对象中。\n\n定义全局变量有三种方法。第一是将 var 语句放置在任何函数之外：\n\n```\n\
    var foo = value;\n```\n\n第二种是直接向全局对象添加属性。全局对象是所有全局变量的容器。在网页浏览器中，全局对象名为 `window`。\n\
    \n```javascript\nwindow.foo = value;\n```\n\n第三种是在不声明的情况下使用变量。这被称为隐式全局（implied\
    \ global）：\n\n```javascript\nfoo = value;\n```\n\n这原本是为了给初学者提供便利，让他们无需在运行变量之前声明它们。遗憾的是，忘记声明变量是一个非常常见的错误。JavaScript\
    \ 将忘记声明的变量变为全局的策略会产生非常难以发现的 bug。\n\n# 作用域\n\nJavaScript 的语法源自 C。在所有其他 C 类语言中，块（一组用花括号括起来的语句）会创建一个作用域。在块中声明的变量在块外不可见。JavaScript\
    \ 使用块的语法，但不提供块级作用域：在块中声明的变量在包含块的函数任何地方都是可见的。这对于有其他语言经验的程序员来说可能会感到。\n\n在大多数语言中，最好的做法是在第一次使用的地方声明变量。这在\
    \ JavaScript 中被证明是一个坏习惯，因为它没有块级作用域。最好在每个函数的顶部声明所有变量。\n\n# 分号自动插入\n\nJavaScript\
    \ 有一种机制，尝试通过自动插入分号来纠正错误的程序。不要依赖这种机制。它可能会掩盖更严重的错误。\n\n它有时会在不该的地方插入分号。考虑分号自动插入对\
    \ `return` 语句的影响。如果 `return` 语句返回一个值，该值表达式必须与冒号在同一行：\n\n```javascript\nreturn\
    \ {\n  status: true;\n};\n```\n\n这看起来返回的是一个包含 `status` 成员的对象。遗憾的是，分号自动插入将其变成了一个返回\
    \ `undefined` 的语句。程序并没有警告分号自动插入导致了对程序的误解。如果将 `{` 放置在上一行的末尾，而不是下一行的开头，就可以避免这个问题：\n\
    \n```javascript\nreturn {\n  status: true\n};\n```\n\n# 保留字\n\n以下单词在 JavaScript\
    \ 中是保留字：\n\n```\nabstract boolean break byte case catch char class const continue\
    \ debugger default\ndelete delete double else enum extends false finally float\
    \ for function goto\nif implements in instanceof int interface native new null\
    \ package\nprotected public return short static switch switch synchronized this\
    \ throws\ntransient true try typeof var void while with\n```\n\n这些单词中的大部分在语言中并没有被使用。\n\
    \n它们不能用于命名变量或参数。当保留字用作对象字面量中的键（keys）时，必须加上引号。它们可以使用点符号表示（t dot notation），因此有时需要使用括号：\n\
    \n```javascript\nvar method;             // 没问题\nvar class;               // 非法\n\
    object = {box: value};   // 没问题\nobject = {case: value};  // 非法\nobject = {'case':\
    \ value}; // 没问题\nobject.box = value;       // 没问题\nobject.case = value;     //\
    \ 非法\nobject['case'] = value;  // 没问题\n```\n\n# Unicode\n\nJavaScript 设计时，人们预计\
    \ Unicode 最多会有 65,536 个字符。现在它已经增长到拥有超过 100 万个字符的容量。\n\nJavaScript 的字符是 16 位的。这足以覆盖原始的\
    \ 65,536 个（现在被称为基础语言平面），剩余的百万个字符中的许多可以用对字符来表示。Unicode 认为这一对是一个单一字符，而 JavaScript\
    \ 认为这一对是两个不同的字符。\n\n# typeof\n\n`typeof` 操作符返回一个标识其操作数类型的字符串。所以：\n\n```javascript\n\
    typeof 98.6\n```\n\n产生 'number'。遗憾的是。\n\n```javascript\ntypeof null\n```\n\n返回\
    \ 'object' 而不是 'null'。测试一个值是否为对象时存在更大的问题。`typeof` 无法区分 null 和对象，但你可以推断 null 是假的（falsy），而所有对象都是真的（truthy）：\n\
    \n```javascript\nif (my_value && typeof my_value === 'object') {\n  // my_value\
    \ 是对象或数组\n}\n```\n\n不同的实现对正则表达式对象的类型存在争议。某些实现报告：\n\n```javascript\ntypeof /a/\n\
    ```\n\n是 'object'，而另一些说它是 'function'。报告 'regexp' 可能更有用，但标准不允许这样做。\n\n# parseInt\n\
    \n`parseInt` 是一个将字符串转换为整数的函数。它在遇到非数字时停止，因此 `parseInt(\"16\")` 和 `parseInt(\"16\
    \ tons\")` 产生相同的结果。如果函数能以某种方式告诉我们额外的文本就好了，但它并没有。\n\n如果字符串的第一个字符是 0，字符串将以八进制而不是\
    \ 10 进制进行求值。在八进制中，8 和 9 不是数字，所以 `parseInt(\"08\")` 和 `parseInt(\"09\")` 的结果都是\
    \ 0。这个错误会导致解析日期的程序出现 bug。幸运的是，`parseInt` 可以接受一个进制（radix）参数，因此 `parseInt(\"08\"\
    , 10)`产生 8。我建议你始终提供进制参数。\n\n`+` 操作符可以相加也可以拼接。这取决于参数的类型。如果任一操作数为空字符串，它会产生转换为字符串的结果。如果两个操作数都是数字，它会产生和。否则，它将两者都转换为字符串并拼接。这种复杂的行为是\
    \ bug 的常见来源。如果你打算进行加法，请确保两个操作数都是数字。\n\n# 浮点\n\n二进制浮点数在处理小数方面非常无力，所以 `0.1 + 0.2`\
    \ 不等于 `0.3`。这是 JavaScript 中经常被报告的 bug，是采用 IEEE 二进制浮点运算标准（IEEE 754）的意外后果。该标准适用于许多应用程序，但它违反了许多你在中学中学到的关于数字的知识。\n"
