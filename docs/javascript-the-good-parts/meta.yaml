    \ of that design error at the end of this chapter.\n\n# Return\n\nWhen a function\
    \ is invoked, it begins execution with the first statement, and ends when it hits\
    \ the } that closes the function body. That causes the function to return control\
    \ to the part of the program that invoked the function.\n\nThe return statement\
    \ can be used to cause the function to return early. When return is executed,\
    \ the function returns immediately without executing the remaining statements.\n\
    \nA function always returns a value. If the return value is not specified, then\
    \ undefined is returned.\n\nIf the function was invoked with the new prefix and\
    \ the return value is not an object, then this (the new object) is returned instead."
  - "[PAGE 47]\n\n# Exceptions\n\nJavaScript provides an exception handling mechanism.\
    \ Exceptions are unusual (but not completely unexpected) mishaps that interfere\
    \ with the normal flow of a program. When such a mishap is detected, your program\
    \ should throw an exception:\n\n```\nvar add = function (a, b) {\n  if (typeof\
    \ a != 'number' || typeof b != 'number') {\n    throw {\n      name: 'TypeError',\n\
    \      message: 'add needs numbers'\n    };\n  }\n  return a + b;\n}\n```\n\n\
    The throw statement interrupts execution of the function. It should be given an\
    \ exception object containing a name property that identifies the type of the\
    \ exception, and a descriptive message property. You can also add other properties.\n\
    \nThe exception object will be delivered to the catch clause of a try statement:\n\
    \n```\n// Make a try_it function that calls the new add\n// function incorrectly.\n\
    \nvar try_it = function () {\n  try {\n    add(\"seven\");\n  } catch (e) {\n\
    \    document.writeln(e.name + ': ' + e.message);\n  }\n};\n\ntry_it();\n```\n\
    \nIf an exception is thrown within a try block, control will go to its catch clause.\n\
    \nA try statement has a single catch block that will catch all exceptions. If\
    \ your handling depends on the type of the exception, then the exception handler\
    \ will have to inspect the name to determine the type of the exception.\n\n# Augmenting\
    \ Types\n\nJavaScript allows the basic types of the language to be augmented.\
    \ In Chapter 3, we saw that adding a method to Object.prototype makes that method\
    \ available to all objects. This also works for functions, arrays, strings, regular\
    \ expressions, and booleans.\n\nFor example, augmenting Function.prototype, we\
    \ can make a method available to all functions:"
  - "[PAGE 48]\n\n```\nFunction.prototype.method = function (name, func) {\n  this.prototype[name]\
    \ = func;\n  return this;\n};\n```\n\nBy augmenting Function.prototype with a\
    \ method name, we no longer have to type the name of the prototype property. That\
    \ bit of ugliness can now be hidden.\n\nJavaScript does not have a separate integer\
    \ type, so it is sometimes necessary to extract the integer part of a number.\
    \ The method JavaScript provides to do that is ugly. We can fix it by adding an\
    \ integer method to Number.prototype. It uses either Math.ceil or Math.floor,\
    \ depending on the sign of the number:\n\n```\nNumber.method('integer', function\
    \ () {\n  return Math[this < 0 ? 'ceil' : 'floor'](this);\n});\n```\n\n```\ndocument.writeln((-10/3).integer());\
    \ // -3\n```\n\nJavaScript lacks a method that removes spaces from the ends of\
    \ a string. That is an easy oversight to fix:\n\n```\nString.method('trim', function\
    \ () {\n  return this.replace(/^\\s+|\\s+$/g, '');\n});\n```\n\n```\ndocument.writeln(\"\
    \" \" + .neat.trim() + \" \"\");\n```\n\nOur method uses a regular expression.\
    \ We will see much more about regular expressions in Chapter 7.\n\nBy augmenting\
    \ the basic types, we can make significant improvements to the expressiveness\
    \ of the language. Because of the dynamic nature of JavaScript prototypal inheritance,\
    \ all values are immediately endowed with the new methods, even values that were\
    \ created before the methods were created.\n\nThe prototypes of the basic types\
    \ are public structures, so care must be taken when mixing libraries. One defensive\
    \ technique is to add a method only if the method is known to be missing:\n\n\
    ```\n// Add a method conditionally.\n```\n\n```\nFunction.prototype.method = function\
    \ (name, func) {\n  if (!this.prototype[name]) {\n    this.prototype[name] = func;\n\
    \  }\n};\n```\n\nAnother concern is that for the in statement interacts badly\
    \ with prototypes. We saw a couple of ways to mitigate this in Chapter 3: we can\
    \ use the hasOwnProperty method to screen out hidden properties, and we can look\
    \ for specific types."
  - "[PAGE 49]\n\n# Recursion function\n\nA recursive function is a function that\
    \ calls itself, either directly or indirectly. Recursion is a powerful programming\
    \ technique in which a problem is divided into a set of similar subproblems, each\
    \ solved with a trivial solution. Generally, a recursive function calls itself\
    \ to solve its subproblems.\n\nThe Towers of Hanoi is a famous puzzle. The equipment\
    \ includes three posts and a set of discs of various diameters with holes in their\
    \ centers. The setup stacks all of discs on the source post with smaller discs\
    \ on top of larger discs. The goal is to move the stack to the destination post\
    \ by moving one disc at a time to another, never placing a larger disc on a smaller\
    \ disc. This has a trivial recursive solution:\n\n```\nvar hanoi = function (disc,\
    \ src, aux, dst) {\n  if (disc > 0) {\n    hanoi(disc - 1, src, dst, aux);\n \
    \   document.write('Move disc ' + disc + ' from ' + src + ' to ' + dst + '\\n');\n\
    \    hanoi(disc - 1, aux, src, dst);\n  }\n}\n\nhanoi(3, 'Src', 'Aux', 'Dst');\n\
    ```\n\nIt produces this solution for three discs:\n\n+   Move disc 1 from Src\
    \ to Dst\nMove disc 2 from Src to Aux\nMove disc 1 from Dst to Aux\nMove disc\
    \ 3 from Src to Dst\nMove disc 1 from Aux to Src\nMove disc 2 from Aux to Dst\n\
    Move disc 1 from Src to Dst\n\nThe Hanoi function moves a stack of discs from\
    \ one post to another, using the auxiliary post necessary. It breaks the problem\
    \ into three subproblems. First, it unlocks the bottom disc by moving the substack\
    \ above it to the auxiliary post. It can then move the bottom disc to the destination\
    \ post. Finally, it can move the substack from the auxiliary post to the destination\
    \ post. The movement of the substack is handled by calling itself recursively\
    \ to work out those subproblems.\n\nThe Hanoi function passed the number of the\
    \ disc it is to move and the three posts it is to use. When it calls itself, it\
    \ is to deal with the disc that is above the disc it is currently working. Eventually,\
    \ it will be called with a nonexistent disc number. In that case, it does nothing.\
    \ That act of nothingness gives us confidence that the function does not recurse\
    \ forever.\n\nRecursive functions can be very effective in mapping tree structures\
    \ such as the browser's Document Object Model (DOM). Each recursive call gives\
    \ a smaller piece of the tree to work on:"
