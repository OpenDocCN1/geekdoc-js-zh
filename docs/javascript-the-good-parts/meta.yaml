  md: '# parse_number


    ![](img/03300178c40ed5b3e760309f69ee3125_85_0.png)


    The *i* flag causes case to be ignored when matching letters. The only letter
    in our pattern is e. We want e to also match E. We could have written the e factor
    as `[Ee]` or `(?:E|e)`, but we didn''t have to because we used the *i* flag:


    -?


    The `?` suffix on the minus sign indicates that the minus sign is optional:


    `\d` means the same as `[0-9]`. It matches a digit. The `+` suffix causes it to
    match one or more digits:


    `(?:|\d*)`


    The `(?:...)` indicates an optional noncapturing group. It is usually better to
    use noncapturing groups instead of the less ugly capturing groups because capturing
    has a performance penalty. The group will match a decimal followed by zero or
    more digits:


    `(?:e[+\-]?\d*)`


    This is another optional noncapturing group. It matches e (or E), an optional
    sign, and one more digits.


    # Construction


    There are two ways to make a RegExp object. The preferred way, as we saw in the
    examples, is to use a regular expression literal.


