  mdcn: "\n\n# with 语句\n\n`with` 语句旨在为访问深度嵌套对象中的成员提供简便方法。遗憾的是，在设置新成员时，它的行为非常糟糕。永远不要使用\
    \ `with` 语句。请改用 `var`。\n\nJSLint 不期望看到 `with` 语句。\n\n=\n\nJSLint 不期望在 `or` 或 `while`\
    \ 语句的条件部分看到赋值赋值语句。这是因为更有可能是：\n\n```javascript\nif (a = b) {\n  ...\n}\n```\n\n\
    原本意图是：\n\n```javascript\nif (a == b) {\n  ...\n}\n```\n\n如果你确实打算进行赋值，请将其用另一组括号括起来：\n\
    \n```javascript\nif ((a = b)) {\n  ...\n}\n```\n\n# == 和 !=!\n\n`==` 和 `!=` 运算符在比较之前会进行类型转换。这是糟糕的，因为它会导致\
    \ `'\\f\\rn\\t' == 0` Result为真。它可能会掩盖类型错误。\n\n在与以下任何值比较时，请务必使用 `===` 或 `!==` 运算符，它们不会进行转换：\n\
    \n```\n0 '' undefined null false true\n```\n\n如果你想使用，请使用短形式。与其写：\n\n```javascript\n\
    (foo != 0)\n```\n\n不如写：\n\n```javascript\n(foo)\n```\n\n与其写：\n\n```javascript\n\
    (foo == 0)\n```\n\n不如写：\n\n```javascript\n(!foo)\n```\n\n始终优先使用 `===` 和 `!==`\
    \ 运算符。有一个“不允许 == 和 !==” (eqeqeq) ，它要求在所有情况下都使用 `===` 和 `!==`。\n\n# 标签 (Labels)\n\
    \nJavaScript 允许任何语句带有标签，标签具有独立的命名空间。JSLint 则严格得多。\n\nJSLint 只期望与 `break` 交互的语句带有标签：`switch`、`while`、`do`\
    \ 和 `for`。JSLint 期望标签与变量和参数区分开。\n\n# 不可达\n\nJSLint 期望 `return`、`break`、`continue`\
    \ 或 `throw` 语句后面会跟着 `} case` 或 `default`。\n\n# 混淆的正号和减号\n\nJSLint 期望 `+` 后面不会跟着\
    \ `+` 或 `++`，且 `-` 后面不会跟着 `-` 或 `--`。一个位置错误的空格可以将 `+` 变成 `++`，这是一个难以发现的错误。使用括号可以避免混淆。\n\
    \n# ++ 和 --\n\n`++`（自增）和 `--`（自减）运算符被认为会导致代码糟糕，产生过度复杂。在引发病毒和其他安全威胁方面，它们的危害性仅次于错误的架构。JSLint\
    \ 的 `plus` 选项禁止了使用这些运算符。\n\n# 位运算符\n\nJavaScript 没有整数类型，但它确实有位运算符。位运算符会将操作数从浮点数转换为整数再反之，因此它们不像在\
    \ C 或或其他语言中那样高效。它们在浏览器应用程序中很少用。它们与逻辑运算符的相似性可能会掩盖一些编程错误。位运算选项禁止使用这些运算符。\n\n# eval\
    \ 是邪恶的\n\n`eval` 函数及其它的（`Function`、`setTimeout` 和 `setInterval`）提供了访问 JavaScript\
    \ 编译器的权限。这有时是有用的，但在大多数情况下，它意味着极其糟糕的代码。`eval` 函数是 JavaScript 中被误用最频繁的特性。\n\n# void\n\
    \n在大多数 C 类语言中，`void` 是一个类型。在 JavaScript 中，`void` 是一个前缀运算符，始终返回 `undefined`。JSLint\
    \ 不期望看到 `void`，因为它令人混淆且没用。\n\n# 正则表达式\n\n正则表达式使用简洁且晦涩的符号书写。JSLint 会寻找可能导致移植性问题。它还尝试通过建议显式转义来解决视觉歧义。\n\
    \nJavaScript 的正则表达式字面量语法重载了 `/` 字符。为了避免歧义，JSLint 期望正则表达式字面量之前的字符是 `(`、`=` 或 `:`\
    \ 或 `,`。\n\n# 构造函数和 new\n\n构造函数是设计为配合 `new` 前缀一起使用的函数。`new` 前缀根据函数的原型创建一个新对象，并将其绑定到函数的隐含\
    \ `this` 参数上。如果你忽略了使用 `new` 前缀，将不会创建新对象，而这将绑定到全局对象。这是一个严重的错误。\n\nJSLint 强制执行约定，即构造函数的首字母应大写。JSLint\
    \ 不期望看到首字母大写的函数被调用，除非它有 `new` 前缀。JSLint 不期望对名称不以大写字母函数使用 `new` 前缀。\n\nJSLint 不期望看到\
    \ `new Number`、`new String` 或 `new Boolean`。\n\nJSLint 不期望看到 `new Object`（应使用\
    \ `{}`）。\n\nJSLint 不期望看到 `new Array`（应使用 `[]`）。\n\n# 未查找\n\nJSLint 不进行流分析来确定变量在在使用之前是否已赋值。这是因为变量被赋予了一个值（`undefined`），这对于许多应用程序来说是一个合理的默认值。\n\
    \nJSLint 不进行任何形式的全局分析。它不会尝试判断用于 `new` 的函数是否真的是构造函数（除了通过强制大小写约定外），或者方法名拼写是否正确。\n\
    \n# HTML\n\nJSLint 能够处理 HTML 文本。它可以检查包含 `<script></script>` 标签和事件处理器中的 JavaScript\
    \ 内容。它还检查 HTML 内容，寻找已知会干扰 JavaScript 的问题：\n\n- 所有标签名必须是小写。\n- 所有可以有闭合标签的标签（如 `</p>`）都必须有闭合标签。\n\
    - 所有标签都正确嵌套。\n- 实体 `&lt;` 必须用于字面量 `<`。\n\nJSLint 不像 XHTML 要求的那样盲目追求从性，但比流行的浏览器更严格。\n\
    \nJSLint 还会检查字符串字面量中出现 `</` 的情况。你应该始终写 `<`。额外的反斜杠会被 JavaScript 编译器忽略，但不会被 HTML\
    \ 解析器忽略。这种技巧本不应该是必要的，但它们确实存在。\n\n有一个选项允许使用大写标签名。还有一个选项允许使用内联 HTML 事件处理程序。\n\n\
    # JSON\n\nJSLint 还可以检查 JSON 数据结构是否正确。如果第一个字符是 `{` 或 `[`，它将严格执行 JSON 规则。参见附录 E。\n\
    \n# 报告\n\n如果 JSLint 能够完成扫描，它会生成函数报告。它会列出每个函数的以下内容：\n\n- 开始的行号。\n- 它的名称。对于匿名函数，JSLint\
    \ 会“猜”名称。\n- 参数。\n- 闭包（Closure）：在函数内部声明但被其内部函数使用的变量和参数。\n- 变量（Variables）：在函数内部声明且仅供该函数使用的变量。\n\
    - 未使用（Unused）：在函数内部声明但未使用的变量。这可能是错误的指示。。\n- 外部（Outer）：该函数使用但在另一个函数中声明的变量。\n- 全局（Global）：该函数使用的全局变量。\n\
    \n"
