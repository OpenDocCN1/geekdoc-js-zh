    ```\n\nIt is sometimes convenient to use the push method to accomplish the thing:\n\
    \n```javascript\nnumbers.push('go');\n// numbers is ['zero', 'one', 'two', 'shi',\
    \ 'go']\n```\n\n## Enumeration\n\nSince JavaScript's arrays are really objects,\
    \ the for in statement can be used to iterate over all the properties of an array.\
