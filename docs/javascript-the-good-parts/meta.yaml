  - "[PAGE 35]\n\n# CHAPTER 3\n\n# Objects\n\n> Upon a homely love Love can wink.\n\
    \n> —William Shakespeare, The Two Gentlemen of Verona\n\nThe simple types of JavaScript\
    \ are numbers, strings, booleans (true and false), null, and undefined. All other\
    \ values are objects. Numbers, strings, and booleans are object-like in that they\
    \ have methods, but they are immutable. Objects in JavaScript are mutable collections.\
    \ In JavaScript, arrays, functions are objects, regular expressions are objects,\
    \ and, of course, objects are objects.\n\nAn object is a container of properties,\
    \ where a property has a name and a value. A property name can be any string,\
    \ including the empty string. A property value can be any JavaScript value except\
    \ for undefined.\n\nObjects in JavaScript are class-free. There is no constraint\
    \ on the names of new properties or on the values of properties. Objects are useful\
    \ for collecting and organizing data. Objects can contain other objects, so they\
    \ can easily represent tree or graph structures.\n\nJavaScript includes a prototype\
    \ linkage feature that allows one object to inherit the properties of another.\
    \ When used well, this can reduce object initialization time and memory consumption.\n\
    \n# Object Literals\n\nObject literals provide a very convenient notation for\
    \ creating new object values. An object literal is a pair of curly braces surrounding\
    \ zero or more name/value pairs. An object literal can appear anywhere an expression\
    \ can appear:\n\n```\nvar empty_object = {\n  \"first-name\": \"Jerome\",\n  \"\
    last-name\": \"Howard\"\n};\n```"
- md: "\nA property's name can be any string, including the empty string. The quotes\
    \ around a property's name in an object literal are optional if the name would\
    \ be a legal JavaScript name and not a reserved word. So quotes are required around\
    \ \"first-name\", but are optional first_name. Commas are used to separate the\
    \ pairs.\n\nA property's value can be obtained from any expression, including\
    \ another object literal. Examples:\n\n```javascript\nvar flight = {\n  airline:\
    \ \"Oceanic\",\n  number: 815,\n  departure: {\n    IATA: \"SYD\",\n    time:\
    \ \"2004-09-22 14:55\",\n    city: \"Sydney\"\n  },\n  arrival: {\n    IATA: \"\
    LAX\",\n    time: \"2004-09-23 10:42\",\n    city: \"Los Angeles\"\n  }\n};\n\
    ```\n\n# Retrieval\n\nValues can be retrieved from an object by wrapping a string\
    \ expression in a [ ] suffix. If the string expression is a constant, and if it\
    \ is a legal JavaScript name and not a reserved word, the . notation can be used.\
    \ The . notation is preferred because it is more compact and it reads better:\n\
    \n```javascript\nstooge[\"first-name\"] // \"Joe\"\nflight.departure.IATA // \"\
    SYD\"\n```\n\nThe undefined value is produced if an attempt is made to retrieve\
    \ a nonexistent member:\n\n```javascript\nstooge[\"middle-name\"] // undefined\n\
    flight.status // undefined\nstooge[\"FIRST-NAME\"] // undefined\n```\n\nThe ||\
    \ operator can be used to fill default values:\n\n```javascript\nvar middle =\
    \ stooge[\"middle-name\"] || \"none\";\nvar status = flight.status || \"unknown\"\
    ;\n```\n\nAttempting to retrieve values from undefined will throw a TypeError\
    \ exception. This can be guarded against with the && operator:\n\n```javascript\n\
    flight.equipment // undefined\nflight.equipment.model // throw \"TypeError\"\n\
    flight.equipment && flight.equipment.model // undefined\n```\n\n# Update\n\nA\
    \ value in an object can be updated by assignment. If the property name already\
    \ exists in the object, the property value is replaced:\n\n```javascript\nstooge['first-name']\
    \ = 'Jerome';\n// If the object does not already have that property name, the\
    \ object is augmented:\nstooge['middle-name'] = 'Lester';\nstooge.nickname = 'Curly';\n\
    flight.equipment = {\n  model: 'Boeing 777'\n};\nflight.status = 'overdue';\n\
    ```\n\n# Reference\n\nObjects are passed by reference. They are not copied:\n\n\
    ```javascript\nvar x = stooge;\nx.nickname = 'Curly';\nvar nick = stooge.nickname;\n\
    // nick is 'Curly' because x and stooge\n// are references to the same object\n\
    a = {}, b = {}, c = {};\n// a, b, and c each refer to a\n// different empty object\n\
    a = b = c = {};\n// a, b, and c all refer to\n// the same empty object\n```\n\n\
    # Prototype\n\nEvery object is linked to a prototype object from which it can\
    \ inherit properties. All objects created from object literals are linked to Object.prototype,\
    \ an object that comes with standard JavaScript.\n\nWhen you make a new object,\
    \ JavaScript provides to to select the object that should be its prototype. The\
    \ mechanism to do this is messy and complex, but it can be significantly simplified.\
    \ We will add a create method to the Object function. The create method creates\
    \ a new object that uses an old object as its prototype. There will be much more\
    \ about functions in the next chapter.\n\n```javascript\nif (typeof Object.create\
    \ != 'function') {\n  Object.create = function (o) {\n    var F = function ()\
    \ {\n      F.prototype = o;\n      return new F();\n    };\n  }\n}\nvar another_stooge\
    \ = Object.create(stooge);\n```\n\nThe prototype link has no effect on updating.\
    \ When we make changes to an object, the object's prototype is not touched:\n\n\
    ```javascript\nanother_stooge['first-name'] = 'Harry';\nanother_stooge['middle-name']\
    \ = 'Mose';\nanother_stooge.nickname = 'Moe';\n```\n\nThe prototype link is only\
    \ on retrieval. If we try to retrieve a property value from an object, and if\
    \ the object lacks the property name, then JavaScript attempts to retrieve the\
    \ property value from the prototype object. And if that is lacking the property,\
    \ then it goes up its prototype, and so on until it finally falls out with Object.\
    \ If the desired property exists nowhere in the prototype chain, then the result\
    \ is the undefined value. This is called delegation.\n\nThe prototype relationship\
    \ is a dynamic relationship. If we add a new property to a prototype, that property\
    \ will immediately be visible in all of the objects that are based on that prototype:\n\
    \n```javascript\nstooge.profession = 'actor';\nanother_stooge.profession // 'actor'\n\
    ```\n\nWe will see more about the prototype chain in Chapter 6.\n\n# Reflection\n\
    \nIt is easy to inspect an object to determine what properties it has by attempting\
    \ to retrieve the properties and examining the values obtained. The typeof operator\
    \ can be very helpful in determining the type of a property:\n\n```javascript\n\
    typeof flight.number // 'number'\ntypeof flight.status // 'string'\ntypeof flight.arrival\
    \ // 'object'\ntypeof flight.manifest // 'undefined'\n```\n\nSome care must be\
    \ taken because any property on the prototype chain can produce a value:\n\n```javascript\n\
    typeof flight.toString // 'function'\ntypeof flight.constructor // 'function'\n\
    ```\n\nThere are two approaches to dealing with these undesired properties. The\
    \ first is to have your program look for and reject function values. Generally,\
    \ when you are reflecting, you are interested in data, and so you should be aware\
    \ that some values could be functions.\n\nThe other approach is to use the hasOwnProperty\
    \ method, which returns true if the object has a particular property. The hasOwnProperty\
    \ method does not look at the prototype:\n\n```javascript\nflight.hasOwnProperty('number')\
    \ // true\nflight.hasOwnProperty('constructor') // false\n```\n\n# Enumeration\n\
    \nThe for in statement can loop over all of the property names in an object. The\
    \ enumeration will include all of the properties—including functions and prototype\
    \ properties that you might not be interested in—so it is necessary to filter\
    \ out the values you don't. The most common filters are the hasOwnProperty method\
    \ and using typeof to exclude functions:\n\n```javascript\nvar name;\nfor (name\
    \ in another_stooge) {\n  if (typeof another_stooge[name] === 'function') {\n\
    \    document.writeln(name + ': ' + another_stooge[name]);\n  }\n}\n```\n\nThere\
    \ is no guarantee on the order of the names, so be prepared for the names in any\
    \ order. If you want to assure that the properties appear in a particular order,\
    \ it is best to avoid the in statement entirely and make an array containing the\
    \ names:\n\n```javascript\nvar i;\nvar properties = [\n  'first-name',\n  'middle-name',\n\
    \  'last-name',\n  'profession'\n];\nfor (i = 0; i < properties.length; i += 1)\
    \ {\n  document.writeln(properties[i] + ': ' + another_stooge(properties[i]));\n\
    }\n```\n\nBy using instead of for in, we were able to get the properties we wanted\
    \ without worrying what might be dredged up from the prototype chain.\n\n# Delete\n\
    \nThe delete operator can be used to remove a property from an object. It will\
    \ remove a property from the object if it has one. It will not touch any of the\
    \ prototype linkage.\n\nRemoving a property from an object may allow a property\
    \ from the prototype linkage to shine through:\n\n```javascript\nanother_stooge.nickname\
    \ // 'Moe'\n```\n\n```javascript\n// Remove nickname from another_stooge, revealing\n\
    // the nickname of the prototype.\ndelete another_stooge.nickname;\n\nanother_stooge.nickname\
    \ // 'Curly'\n```\n\n# Global Abatement\n\nJavaScript makes it easy to define\
    \ global variables that can hold all of the assets of your application. Unfortunately,\
    \ global variables weaken the resiliency of programs and should be avoided.\n\n\
    One way to minimize the use of global variables is to create a single global variable\
    \ for your application:\n\n```javascript\nvar MYAPP = {};\n```\n\nThat variable\
    \ then becomes the container for your application:\n\n```javascript\nMYAPP.stooge\
    \ = {\n  \"first-name\": \"Joe\",\n  \"last-name\": \"Howard\"\n}\n\nMYAPP.flight\
    \ = {\n  airline: \"Oceanic\",\n  number: 815,\n  departure: {\n    IATA: \"SYD\"\
    ,\n    time: \"2004-09-22 14:55\",\n    city: \"Sydney\"\n  },\n  arrival: {\n\
    \    IATA: \"LAX\",\n    time: \"2004-09-23 10:42\",\n    city: \"Los Angeles\"\
    \n  }\n}\n```\n\nBy reducing your global footprint to a single name, you significantly\
    \ reduce the chance of bad interactions with other applications, widgets, or libraries.\
    \ Your program becomes easier to read because it is obvious that MYAPP.stooge\
    \ refers to a top-level structure. In the next chapter, we will see ways to use\
    \ closure for information hiding, which is another effective global abatement\
    \ technique.\n"
