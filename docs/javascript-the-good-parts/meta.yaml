    \n# # Scope\n\nScope in a programming language controls the visibility and lifetimes\
    \ of variables and parameters. This is an important service to the programmer\
    \ because it reduces name collisions and provides automatic memory management:\n\
    \n```\nvar foo = function () {\n  var a = 3, b = 5;\n```\n\n```\nvar bar = function\
    \ () {\n  var b = 7, c = 11;\n```\n\n```\n// At this point, a is 3, b is 7, and\
    \ c is 11\n```\n\n```\na += b + c;\n```\n\n```\n// At this point, a is 21, b is\
    \ 7, and c is 11\n```\n\n```\n};\n```\n\n```\n// At this point, a is 3, b is 5,\
    \ and c is not defined\n```\n\n```\nbar();\n```\n\n```\n// At this point, a is\
    \ 21, b is 7, and c is 5\n```\n\n```\n};\n```\n\nMost languages with C syntax\
    \ have block scope. All variables defined in a block (a list of statements wrapped\
    \ with curly braces) are not visible from outside of the block. The variables\
    \ defined in a block can be released when execution of the block is finished.\
    \ This is a good thing.\n\nUnfortunately, JavaScript does not have block scope\
    \ even though its block syntax suggests that it does. This confusion can be a\
    \ source of errors.\n\nJavaScript does function scope. That means the parameters\
    \ and variables defined in a function are not visible outside of the function,\
    \ and that a variable defined anywhere within a function is visible everywhere\
    \ within the function.\n\nIn many modern languages, it is recommended that variables\
    \ be declared as late as possible, at the first point of use. That turns out to\
    \ be bad advice for JavaScript because it lacks block scope. So instead, it is\
    \ best to declare all of the variables in a function at the top of the function\
    \ body."
  - "[PAGE 52]\n\n# Closure\n\nThe good news about scope is that inner functions get\
    \ access to the parameters and variables of the functions they are defined within\
    \ (with the exception of this and arguments). This is a very good thing.\n\nOur\
    \ getElementsByAttribute worked because it declared a results variable, and the\
    \ inner function that it passed to walk_the_DOM also had access to the results\
    \ variable.\n\nA more interesting case is when the inner function has a longer\
    \ lifetime than its outer function.\n\nEarlier, we made a myObject that had a\
    \ value and an increment method. Suppose we wanted to protect the value from unauthorized\
    \ changes.\n\nInstead of initializing myObject with an object literal, we will\
    \ initialize myObject by calling a function that returns an object literal. That\
    \ function defines a local variable. That variable is always available to the\
    \ increment and getValue methods, but the function's scope keeps it hidden from\
    \ the rest of the program:\n\n```\nvar myObject = function () {\n  var value =\
    \ 0;\n\n  return {\n    increment: function (inc) {\n      value += typeof inc\
    \ === 'number' ? inc : 1;\n    },\n    getValue: function () {\n      return value;\n\
    \    }\n  };\n}();\n```\n\nWe are not assigning a function to myObject. We are\
    \ assigning the result of invoking that function. Notice the `()` on the last\
    \ line. The function returns an object containing two methods, and these methods\
    \ continue to enjoy the privilege of access to the value variable.\n\nThe quo\
    \ constructor from earlier in this chapter produced an object with a status property\
    \ and a get_status method. But that doesn't seem very interesting. Why would you\
    \ call a getter on a property you could access directly? It would be more useful\
    \ if the status property were private. So, let's define a different kind of quo\
    \ to do that:\n\n```\n// Create a maker function called quo. It makes\n// object\
    \ with a get_status method and a private\n// status property.\n```"
  - "[PAGE 53]\n\n```\nvar quo = function (status) {\n  return {\n    get_status:\
    \ function () {\n      return status;\n    }\n  };\n}\n// Make an instance of\
    \ quo.\nvar myQuo = quo(\"amazed\");\ndocument.writeln(myQuo.get_status());\n\
    ```\n\nThis quo function is designed to be used without the new prefix, so the\
    \ name is not capitalized. When we call quo, it returns a new object containing\
    \ a get_status method. A reference to that object is stored in myquo. The get_status\
    \ method still has privileged access to quo's status even though quo has already\
    \ returned. get_status does not have access to a copy of the parameter; it has\
    \ access to the parameter itself. This is possible because the function has access\
    \ to the context in which it was created. This is called closure.\n\nLet's look\
    \ at a more useful example:\n\n```\n// Define a function that sets a DOM node's\
    \ color\n// to yellow and then fades it to white.\nvar fade = function (node)\
    \ {\n  var level = 1;\n  var step = function () {\n    var hex = level.toString(16);\n\
    \    node.style.backgroundColor = '#FFFF' + hex + hex;\n    if (level < 15) {\n\
    \      level += 1;\n      setTimeout(step, 100);\n    }\n  };\n  setTimeout(step,\
    \ 100);\n}\n\nfade(document.body);\n```\n\nWe call fade, passing document.body\
    \ (the node created by the HTML <body> tag). fade sets level to 1. It defines\
    \ a step function, passing it the step function and a time (100 milliseconds).\
    \ It returns—fade has finished.\n\nSuddenly, about 10th of a second later, the\
    \ step function gets invoked. It makes a base 16 character from fade's level.\
    \ It modifies the background color of fade's node. It then looks at fade's level.\
    \ If it hasn't gotten to white yellow, then it increments fade's level and uses\
    \ setTimeout to schedule itself to run again."
  - "[PAGE 54]\n\nSuddenly, the step function invoked again. But this time, fade's\
    \ level is 2. fade returned a while ago, but its variables continue to live as\
    \ long as they are needed one or more of fade's inner functions.\n\nIt is important\
    \ to understand that the inner function has access to the actual variables of\
    \ the outer functions and not copies in order to avoid the following problem:\n\
    \n```\n// BAD EXAMPLE\n\n// Make a function that assigns event handler functions\
    \ to an array of nodes\nwrong way.\n// When you click on a node, an alert box\
    \ is supposed to display the ordinal of the\nnode.\n// But it always displays\
    \ the number of nodes instead.\n```\n\n```\nvar add_the_handlers = function (nodes)\
    \ {\n  var i;\n  for (i = 0; i < nodes.length; i += 1) {\n    nodes[i].onclick\
    \ = function (e) {\n      alert(i);\n    }\n  }\n}\n```\n\nThe add_the_handlers\
    \ function was intended to give each handler a unique number (i). It fails because\
    \ the handler functions are bound to the variable i, not the value of the variable\
    \ i at the time the function was made:\n\n```\n// BETTER EXAMPLE\n\n// Make a\
    \ function that assigns event handler functions to an array of nodes\nright way.\n\
    // When you click on a node, an alert box will display the ordinal of the node.\n\
    ```\n\n```\nvar add_the_handlers = function (nodes) {\n  var i;\n  for (i = 0;\
    \ i < nodes.length; i += 1) {\n    nodes[i].onclick = function (i) {\n      return\
    \ function (e) {\n        alert(i);\n      };\n    }(i);\n  }\n}\n```\n\nNow,\
    \ instead of assigning a function to onclick, we define a function and immediately\
    \ invoke it, passing in i. That function will return an event handler function\
    \ that is bound to the value of i that was passed in, not to the i defined in\
    \ add_the_handlers. That returned function is assigned to onclick."
- md: "\n# Callbacks\n\nFunctions can make it easier to deal with discontinuous events.\
    \ For example, suppose there is a sequence that begins with a user interaction,\
    \ making a request of the server, and finally displaying the server’s response.\
    \ The naive way to write that would be:\n\n```\nrequest = prepare_the_request();\n\
    response = send_request_synchronously(request);\ndisplay(response);\n```\n\nThe\
    \ problem with this approach is that a synchronous request over the network will\
    \ leave the client in a frozen state. If either the network or the server is slow,\
    \ the degradation in responsiveness will be unacceptable.\n\nA better approach\
    \ is to make an asynchronous request, providing a callback function that will\
    \ be invoked when the server’s response is received. An asynchronous function\
    \ returns immediately, so the client isn’t blocked:\n\n```\nrequest = prepare_the_request();\n\
    send_request_synchronously(request, function (response) {\n  display(response);\n\
    });\n```\n\nWe pass a function parameter to the send_request_asynchronously function\
    \ that will be called when the response is available.\n\n# Module\n\nWe can use\
    \ functions and closure to make modules. A module is a function or object that\
    \ presents an interface but hides its state and implementation. By using functions\
    \ to produce modules, we can almost completely eliminate our use of global variables,\
    \ thereby mitigating one of JavaScript’s worst fears.\n\nFor example, we want\
    \ to augment String with a deentity method. Its job is to look for HTML entities\
    \ in a string and replace them with their equivalents. It makes sense to keep\
    \ the names of the entities and their equivalents in an object. But where should\
    \ we keep the object? We could put it in a global variable, global variables are\
    \ evil. We could define it in the function itself, but that has a runtime cost\
    \ because the literal must be evaluated every time the function is invoked. The\
    \ ideal approach is to put it in a closure, and perhaps provides an extra method\
    \ that can add additional methods:\n\n```\nString.method('deentity', function\
    \ () {\n  // The entity table. It maps entity names to\n  // characters.\n  var\
    \ entity = {\n    quot: \"\",\n    lt: '<',\n    gt: '>'\n  };\n\n  // Return\
    \ the deentity method.\n  return function () {\n    // This is the deentity method.\
    \ It calls the string\n    // replace method, looking for substrings that start\n\
    \    // with '&' and end with ';'. If the characters in\n    // are between in\
    \ the entity table, then replace the\n    // entity with the character from the\
    \ table. It uses\n    // a regular expression (Chapter 7).\n    return this.replace(/([^;]+)/g,\
    \ function (a, b) {\n      var r = entity[b];\n      return typeof r === 'string'\
    \ ? r : a;\n    });\n  };\n});\n```\n\nThe last line. We immediately invoke the\
    \ function we just made with the () operator. Invocation creates and returns the\
    \ function that becomes the deentityify method.\n\n```\ndocument.writer('&lt;&quot;'.deentityify());\
    \ // <>\"\n```\n\nThe module pattern takes advantage of function scope and closure\
    \ to create relationships that are binding and private. In this example, only\
    \ the deentityify method has access to the entity data structure.\n\nThe general\
    \ pattern of a module is a function that defines private variables and functions;\
    \ creates privileged functions which, through closure, will have access to the\
    \ private variables and functions; and returns the privileged functions or stores\
    \ them in an accessible place.\n\nUse of the module pattern can eliminate the\
    \ use of global variables. It promotes hiding and good design practices. It is\
    \ very effective in encapsulations and other singletons.\n\nIt can also be used\
    \ to produce objects that are secure. Let’s suppose we want to make an object\
    \ that produces a serial number:\n\n```javascript\nvar serial_maker = function\
    \ () {\n  // Produce an object that produces unique strings. A\n  // unique string\
    \ is made up of two parts: a prefix\n  // and a sequence number. The object comes\
    \ with\n  // methods for setting the prefix and sequence\n  // number, and a gensym\
    \ method that produces unique\n  // strings.\n  var prefix = '';\n  var seq =\
    \ 0;\n  return {\n    set_prefix: function (p) {\n      prefix = String(p);\n\
    \    },\n    set_seq: function (s) {\n      seq = s;\n    },\n    gensym: function\
    \ () {\n      var result = prefix + seq;\n      seq += 1;\n      return result;\n\
    \    }\n  };\n};\n\nvar seqer = serial_maker();\nseqer.set_prefix('Q');\nseqer.set_seq(1000);\n\
    var unique = seqer.gensym(); // unique is \"Q1000\"\n```\n\nThe methods do not\
    \ have use of this or. As a result, there is no way to promise the seqer. It isn't\
    \ possible to get or change the prefix or seq except permitted by the methods.\
    \ The seqer object is mutable, the methods could be replaced, but that still does\
    \ not give access to its secrets. seqer is simply a collection of functions, and\
    \ those functions are capabilities that grant specific powers to use or modify\
    \ the secret state.\n\nIf passed seqer.gensym to a third party's function, that\
    \ function would be able to generate unique strings, but would be unable to change\
    \ the prefix or seq.\n\n# Cascade\n\nSome methods do not have a return value.\
    \ For example, it is typical for methods that set or change the state of an object\
    \ to return nothing. If we have these methods return this instead of undefined,\
    \ we can enable cascades. In a cascade, we can call many methods on the same object.\
    \ This allows for more concise code:\n\n```javascript\nelement.style.set('color',\
    \ 'red')\n         .set('border', '1px solid black')\n         .set('margin',\
    \ '10px');\n```\n\n# Curry\n\nFunctions can be curried to transform a function\
    \ that takes multiple arguments into a series of functions that each take a single\
    \ argument. This is useful when you want to fix some of the arguments early.\n\
    \n```javascript\nvar curry = function (fn) {\n  return function (a) {\n    return\
    \ function (b) {\n      return fn(a, b);\n    };\n  };\n};\n\nvar add = function\
    \ (a, b) {\n  return a + b;\n};\n\nvar curriedAdd = curry(add);\nvar addFive =\
    \ curriedAdd(5);\nconsole.log(addFive(10)); // 15\n```\n\n# Memoization\n\nFunctions\
    \ can use objects to remember the results of previous operations, making it possible\
    \ to avoid unnecessary work. This optimization is called memoization.\n\nLet's\
    \ say we want a recursive function to compute Fibonacci numbers. A Fibonacci number\
    \ is the sum of the previous Fibonacci numbers. The first two are 0 and 1:\n\n\
    ```javascript\nvar fibonacci = function (n) {\n  return n < 2 ? n : fibonacci(n\
    \ - 1) + fibonacci(n - 2);\n};\n\nfor (var i = 0; i < 10; i++) {\n  console.log('//'\
    \ + i + ': ' + fibonacci(i));\n}\n\n// 0: 0\n// 1: 1\n// 2: 1\n// 3: 2\n// 4:\
    \ 3\n// 5: 5\n// 6: 8\n// 7: 13\n// 8: 21\n// 9: 34\n// 10: 55\n```\n\nThis works,\
    \ but it is doing a lot of unnecessary work. The Fibonacci function is called\
    \ 453 times. We call it 11 times, and it calls itself 442 times in computing values\
    \ that were probably already computed. If we memoize the function, we can significantly\
    \ reduce its workload.\n\nWe will keep our memoized results in a memo array that\
    \ we can hide in a closure. When our function is called, it first looks to see\
    \ if it already knows the result. If it does, it immediately return it:\n\n```javascript\n\
    var fibonacci = function () {\n  var memo = [0, 1];\n  var fib = function (n)\
    \ {\n    var result = memo[n];\n    if (typeof result !== 'number') {\n      result\
    \ = fib(n - 1) + fib(n - 2);\n      memo[n] = result;\n    }\n    return result;\n\
    \  };\n  return fib;\n};\n```\n"
  mdcn: "\n\n# 回调函数 (Callbacks)\n\n函数可以使处理不连续事件变得更容易。例如，假设有一个序列：从用户交互开始，向服务器发送请求，最后显示服务器的响应。这种操作的最简单写法是：\n\
    \n```\nrequest = prepare_the_request();\nresponse = send_request_synchronously(request);\n\
    display(response);\n```\n\n这种方法的问题在于，网络上的同步请求会让客户端处于冻结状态。如果网络或服务器速度缓慢，响应速度的下降将是不可接受的。\n\
    \n更好的方法是发送异步请求，提供一个回调函数，该会在接收到服务器响应时被调用。异步函数会立即返回，因此客户端不会被阻塞：\n\n```\nrequest\
    \ = prepare_the_request();\nsend_request_synchronously(request, function (response)\
    \ {\n  display(response);\n});\n```\n\n我们向 `send_request_asynchronously` 函数传递了一个函数参数，该参数在响应可用时会被调用。\n\
    \n# 模块 (Module)\n\n我们可以使用函数和闭包来创建模块。模块是一个呈现接口但隐藏其状态和实现的函数或对象。通过使用函数产生模块，我们几乎可以完全消除对全局变量的使用，从而缓解\
    \ JavaScript 最令人担忧的问题之一。\n\n例如，我们想为 `String` 增加一个 `deentity` 方法。它的作用是查找字符串中的 HTML\
    \ 实体并将其替换为等效字符。将实体及其等效名称存储在一个对象中是合理的。但我们应该把这个对象放在哪里呢？我们可以把它放在全局变量中，但全局变量是危险的。我们可以将其定义在函数内部，但这会有运行时成本，因为每次调用函数时都必须对字面量求值。理想的方法是将它放在闭包中，并可能提供一个可以添加额外方法的方法：\n\
    \n```\nString.method('deentity', function () {\n  // 实体表。它将实体名称映射到\n  // 字符。\n\
    \  var entity = {\n    quot: \"\",\n    lt: '<',\n    gt: '>'\n  };\n\n  // 返回\
    \ deentity 方法。\n  return function () {\n    // 这是 deentity 方法。它调用字符串\n    // replace\
    \ 方法，查找以 '&' 开头并 ';' 结尾的子字符串。\n    // 如果中间的字符位于实体表中，则将实体\n    // 替换为表中的字符。它使用了\n\
    \    // 正则表达式（第 7 章）。\n    return this.replace(/([^;]+)/g, function (a, b) {\n\
    \      var r = entity[b];\n      return typeof r === 'string' ? r : a;\n    });\n\
    \  };\n});\n```\n\n最后一行。我们使用 `()` 运算符立即调用了刚刚创建的函数。调用创建并返回了作为 `deentityify` 方法的函数。\n\
    \n```\ndocument.writer('&lt;&quot;'.deentityify()); // <>\"\n```\n\n模块模式利用函数作用域和闭包来创建绑定且私有的关系。在这个示例中，只有\
    \ `deentityify` 方法可以访问实体数据结构。\n\n模块的通用模式是一个定义私有变量和函数的函数；创建特权函数，这些特权函数通过闭包访问私有变量和函数；并返回特权函数或将它们存储在可访问的地方。\n\
    \n模块模式的使用可以消除对全局变量的使用。它促进了隐藏和良好的设计实践。在封装和其他单例模式中非常有效。\n\n它还可以用于产生安全的对象。假设我们想创建一个生成序列号的对象：\n\
    \n```javascript\nvar serial_maker = function () {\n  // 创建一个生成唯一字符串的对象。一个\n  //\
    \ 唯一字符串由两部分组成：前缀\n  // 和序列号。该对象带有设置前缀\n  // 和序列号的方法，以及一个生成唯一\n  // 字符串的 gensym\
    \ 方法。\n  var prefix = '';\n  var seq = 0;\n  return {\n    set_prefix: function\
    \ (p) {\n      prefix = String(p);\n    },\n    set_seq: function (s) {\n    \
    \  seq = s;\n    },\n    gensym: function () {\n      var result = prefix + seq;\n\
    \      seq += 1;\n      return result;\n    }\n  };\n};\n\nvar seqer = serial_maker();\n\
    seqer.set_prefix('Q');\nseqer.set_seq(1000);\nvar unique = seqer.gensym(); //\
    \ unique is \"Q1000\"\n```\n\n方法无法使用 `this`。因此，没有办法可以获取 `seqer`。除非方法允许，否则无法获取或更改前缀或\
    \ `seq`。`seqer` 对象是可变的，方法可以被替换，但仍然无法访问其内部秘密。`seqer` 仅仅是函数的集合，而这些函数是授予使用或修改私有状态特定权限的能力。\n\
    \n如果将 `seqer.gensym` 传递给第三方的函数，该函数将能够生成唯一字符串，但无法更改前缀或 `seq`。\n\n# 链式调用 (Cascade)\n\
    \n某些方法没有返回值。例如，设置或更改状态的方法通常不返回任何内容。如果我们让这些方法返回 `this` 而不是 `undefined`，就可以实现级联调用。在级联中，我们可以在同一个对象上调用多个方法。这使得代码更加简洁：\n\
    \n```javascript\nelement.style.set('color', 'red')\n         .set('border', '1px\
    \ solid black')\n         .set('margin', '10px');\n```\n\n# 柯里化 (Curry)\n\n函数可以柯里化，将一个接受多个参数的函数转换为一系列每个接受单个参数的函数。当你想要提前固定某些参数时，这种方法非常有用。\n\
    \n```javascript\nvar curry = function (fn) {\n  return function (a) {\n    return\
    \ function (b) {\n      return fn(a, b);\n    };\n  };\n};\n\nvar add = function\
    \ (a, b) {\n  return a + b;\n};\n\nvar curriedAdd = curry(add);\nvar addFive =\
    \ curriedAdd(5);\nconsole.log(addFive(10)); // 15\n```\n\n# 记忆化 (Memoization)\n\
    \n函数可以使用对象来记住之前操作的结果，从而避免不必要的工作。这种优化被称为记忆化。\n\n假设我们想要一个递归函数来计算斐波那契数。斐波那契数是两个一个斐波那契数的和。前两个是\
    \ 0 和 1：\n\n```javascript\nvar fibonacci = function (n) {\n  return n < 2 ? n\
    \ : fibonacci(n - 1) + fibonacci(n - 2);\n};\n\nfor (var i = 0; i < 10; i++) {\n\
    \  console.log('//' + i + ': ' + fibonacci(i));\n}\n\n// 0: 0\n// 1: 1\n// 2:\
