  md: "# Closure\n\nThe good news about scope is that inner functions get access to\
    \ the parameters and variables of the functions they are defined within (with\
    \ the exception of this and arguments). This is a very good thing.\n\nOur getElementsByAttribute\
    \ worked because it declared a results variable, and the inner function that it\
    \ passed to walk_the_DOM also had access to the results variable.\n\nA more interesting\
    \ case is when the inner function has a longer lifetime than its outer function.\n\
    \nEarlier, we made a myObject that had a value and an increment method. Suppose\
    \ we wanted to protect the value from unauthorized changes.\n\nInstead of initializing\
    \ myObject with an object literal, we will initialize myObject by calling a function\
    \ that returns an object literal. That function defines a local variable. That\
    \ variable is always available to the increment and getValue methods, but the\
    \ function's scope keeps it hidden from the rest of the program:\n\n```\nvar myObject\
    \ = function () {\n  var value = 0;\n\n  return {\n    increment: function (inc)\
    \ {\n      value += typeof inc === 'number' ? inc : 1;\n    },\n    getValue:\
    \ function () {\n      return value;\n    }\n  };\n}();\n```\n\nWe are not assigning\
    \ a function to myObject. We are assigning the result of invoking that function.\
    \ Notice the `()` on the last line. The function returns an object containing\
    \ two methods, and these methods continue to enjoy the privilege of access to\
    \ the value variable.\n\nThe quo constructor from earlier in this chapter produced\
    \ an object with a status property and a get_status method. But that doesn't seem\
    \ very interesting. Why would you call a getter on a property you could access\
    \ directly? It would be more useful if the status property were private. So, let's\
    \ define a different kind of quo to do that:\n\n```\n// Create a maker function\
    \ called quo. It makes\n// object with a get_status method and a private\n// status\
    \ property.\n```"
