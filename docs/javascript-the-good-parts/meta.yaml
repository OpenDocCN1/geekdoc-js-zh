    var another_stooge = Object.create(stooge);

    ```


    The prototype link has no effect on updating. When we make changes to an object,
    the object''s prototype is not touched:


    ```

    another_stooge[''first-name''] = ''Harry'';

    another_stooge[''middle-name''] = ''Mose'';

    another_stooge.nickname = ''Moe'';

    ```


    The prototype link is only on retrieval. If we try to retrieve a property value
    from an object, and if the object lacks the property name, then JavaScript attempts
    to retrieve the property value from the prototype object. And if that is lacking
    the property, then it goes up its prototype, and so on until it finally falls
    out with Object. If the desired property exists nowhere in the prototype chain,
    then the result is the undefined value. This is called delegation.


    The prototype relationship is a dynamic relationship. If we add a new property
    to a prototype, that property will immediately be visible in all of the objects
    that are based on that prototype:


    ```

    stooge.profession = ''actor'';

    another_stooge.profession // ''actor''

    ```


    We will see more about the prototype chain in Chapter 6.


    # Reflection


    It is easy to inspect an object to determine what properties it has by attempting
    to retrieve the properties and examining the values obtained. The typeof operator
    can be very helpful in determining the type of a property:


    ```

    typeof flight.number // ''number''

    typeof flight.status // ''string''

    typeof flight.arrival // ''object''

    typeof flight.manifest // ''undefined''

    ```


    Some care must be taken because any property on the prototype chain can produce
    a value:


    ```

    typeof flight.toString // ''function''

    typeof flight.constructor // ''function''

    ```


    There are two approaches to dealing with these undesired properties. The first
    is to have your program look for and reject function values. Generally, when you
    are reflecting, you are interested in data, and so you should be aware that some
    values could be functions.


    The other approach is to use the hasOwnProperty method, which returns true if
    the object has a particular property. The hasOwnProperty method does not look
    at the prototype:


    ```

    flight.hasOwnProperty(''number'') // true

    flight.hasOwnProperty(''constructor'') // false

    ```'
