  mdcn: "\n\n# JavaScript：好用\n\n![](img/03300178c40ed5b3e760309f69ee3125_0_0.png)\n\
    \n# 网页创作与设计\n\n# O'REILLY®\n\n# JavaScript：好用\n\n大多数编程语言都包含优秀和糟糕的组件，但 JavaScript\
    \ 的后者比例远超寻常。这本权威著作剔除了那些最令人糟糕的特性，揭示了一个比该语言整体更可靠、可读且易于维护的 JavaScript 子集——你可以使用这个子集来创建出真正可扩展且高效的代码。\n\
    \n作者 Douglas Crockford 被开发社区的许多人视为 JavaScript 专家，他指出了许多让 JavaScript 成为卓越面向对象编程语言的绝良想法。遗憾的是，这些优秀的想法（如函数、松散类型、动态对象和表现丰富的对象字面量表示法）与许多糟糕甚至极其离谱的想法（例如基于全局变量的编程模型）混杂在一起。\n\
    \n当 Java 失败时，JavaScript 默认成为了 Web 语言；它的流行程度几乎完全与其作为编程语言的品质无关。在*JavaScript: The\
    \ Good Parts*中，Crockford 从一堆良好的意图和失误中进行挖掘，为你详细展示了 JavaScript 所有真正优雅的部分，包括：\n\n\
    - 继承\n- 对象\n- 函数\n- 数组\n- 正则表达式\n- 风格\n- 优美的特性\n\n通过*JavaScript: The Good Parts*，你将发现一种美丽、优雅、轻量且高效的语言，无论你是在管理对象库还是仅仅试图让\
    \ Ajax 运行更快，它都能让你创建高效的代码。如果你为 Web 网站或应用程序，这本书是必读。\n\nDouglas Crockford 是一位高级 JavaScript\
    \ 架构师，因引入和维护 JSON（JavaScript 对象表示）格式而闻名。他经常在会议上就高级 JavaScript 主题演讲，并担任 ECMAScript\
    \ 委员会成员。\n\n![](img/03300178c40ed5b3e760309f69ee3125_1_0.png)\n\nwww.oreilly.com\n\
