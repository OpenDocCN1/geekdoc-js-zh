    \ values are objects. Numbers, strings, and booleans are object-like in that they\
    \ have methods, but they are immutable. Objects in JavaScript are mutable collections.\
    \ In JavaScript, arrays, functions are objects, regular expressions are objects,\
    \ and, of course, objects are objects.\n\nAn object is a container of properties,\
    \ where a property has a name and a value. A property name can be any string,\
    \ including the empty string. A property value can be any JavaScript value except\
    \ for undefined.\n\nObjects in JavaScript are class-free. There is no constraint\
    \ on the names of new properties or on the values of properties. Objects are useful\
    \ for collecting and organizing data. Objects can contain other objects, so they\
    \ can easily represent tree or graph structures.\n\nJavaScript includes a prototype\
    \ linkage feature that allows one object to inherit the properties of another.\
    \ When used well, this can reduce object initialization time and memory consumption.\n\
    \n# Object Literals\n\nObject literals provide a very convenient notation for\
    \ creating new object values. An object literal is a pair of curly braces surrounding\
    \ zero or more name/value pairs. An object literal can appear anywhere an expression\
    \ can appear:\n\n```\nvar empty_object = {\n  \"first-name\": \"Jerome\",\n  \"\
    last-name\": \"Howard\"\n};\n```"
