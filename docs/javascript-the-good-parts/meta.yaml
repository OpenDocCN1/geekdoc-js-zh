    \n你可以将 `/*members*/` 注释复制到你的脚本文件中。JSLint 将根据列表检查所有属性名称的拼写。这样，你就可以让 JSLint 为你检查了：\n\
    \n```javascript\n/*members doTell, iDoDeclare, mercySakes,\nmyGoodness, ohGoon,\
