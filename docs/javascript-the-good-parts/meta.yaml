  md: "# Exceptions\n\nJavaScript provides an exception handling mechanism. Exceptions\
    \ are unusual (but not completely unexpected) mishaps that interfere with the\
    \ normal flow of a program. When such a mishap is detected, your program should\
    \ throw an exception:\n\n```\nvar add = function (a, b) {\n  if (typeof a != 'number'\
    \ || typeof b != 'number') {\n    throw {\n      name: 'TypeError',\n      message:\
    \ 'add needs numbers'\n    };\n  }\n  return a + b;\n}\n```\n\nThe throw statement\
    \ interrupts execution of the function. It should be given an exception object\
    \ containing a name property that identifies the type of the exception, and a\
    \ descriptive message property. You can also add other properties.\n\nThe exception\
    \ object will be delivered to the catch clause of a try statement:\n\n```\n//\
    \ Make a try_it function that calls the new add\n// function incorrectly.\n\n\
    var try_it = function () {\n  try {\n    add(\"seven\");\n  } catch (e) {\n  \
    \  document.writeln(e.name + ': ' + e.message);\n  }\n};\n\ntry_it();\n```\n\n\
    If an exception is thrown within a try block, control will go to its catch clause.\n\
    \nA try statement has a single catch block that will catch all exceptions. If\
    \ your handling depends on the type of the exception, then the exception handler\
    \ will have to inspect the name to determine the type of the exception.\n\n# Augmenting\
    \ Types\n\nJavaScript allows the basic types of the language to be augmented.\
    \ In Chapter 3, we saw that adding a method to Object.prototype makes that method\
    \ available to all objects. This also works for functions, arrays, strings, regular\
    \ expressions, and booleans.\n\nFor example, augmenting Function.prototype, we\
    \ can make a method available to all functions:"
  merge: -1
  pgno: 47
- img_proc: true
  md: "```\nFunction.prototype.method = function (name, func) {\n  this.prototype[name]\
    \ = func;\n  return this;\n};\n```\n\nBy augmenting Function.prototype with a\
    \ method name, we no longer have to type the name of the prototype property. That\
    \ bit of ugliness can now be hidden.\n\nJavaScript does not have a separate integer\
    \ type, so it is sometimes necessary to extract the integer part of a number.\
    \ The method JavaScript provides to do that is ugly. We can fix it by adding an\
    \ integer method to Number.prototype. It uses either Math.ceil or Math.floor,\
    \ depending on the sign of the number:\n\n```\nNumber.method('integer', function\
    \ () {\n  return Math[this < 0 ? 'ceil' : 'floor'](this);\n});\n```\n\n```\ndocument.writeln((-10/3).integer());\
    \ // -3\n```\n\nJavaScript lacks a method that removes spaces from the ends of\
    \ a string. That is an easy oversight to fix:\n\n```\nString.method('trim', function\
    \ () {\n  return this.replace(/^\\s+|\\s+$/g, '');\n});\n```\n\n```\ndocument.writeln(\"\
    \" \" + .neat.trim() + \" \"\");\n```\n\nOur method uses a regular expression.\
    \ We will see much more about regular expressions in Chapter 7.\n\nBy augmenting\
    \ the basic types, we can make significant improvements to the expressiveness\
    \ of the language. Because of the dynamic nature of JavaScript prototypal inheritance,\
    \ all values are immediately endowed with the new methods, even values that were\
    \ created before the methods were created.\n\nThe prototypes of the basic types\
    \ are public structures, so care must be taken when mixing libraries. One defensive\
    \ technique is to add a method only if the method is known to be missing:\n\n\
    ```\n// Add a method conditionally.\n```\n\n```\nFunction.prototype.method = function\
    \ (name, func) {\n  if (!this.prototype[name]) {\n    this.prototype[name] = func;\n\
    \  }\n};\n```\n\nAnother concern is that for the in statement interacts badly\
    \ with prototypes. We saw a couple of ways to mitigate this in Chapter 3: we can\
    \ use the hasOwnProperty method to screen out hidden properties, and we can look\
    \ for specific types."
