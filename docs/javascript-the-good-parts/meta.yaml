  md: "# Recursion function\n\nA recursive function is a function that calls itself,\
    \ either directly or indirectly. Recursion is a powerful programming technique\
    \ in which a problem is divided into a set of similar subproblems, each solved\
    \ with a trivial solution. Generally, a recursive function calls itself to solve\
    \ its subproblems.\n\nThe Towers of Hanoi is a famous puzzle. The equipment includes\
    \ three posts and a set of discs of various diameters with holes in their centers.\
    \ The setup stacks all of discs on the source post with smaller discs on top of\
    \ larger discs. The goal is to move the stack to the destination post by moving\
    \ one disc at a time to another, never placing a larger disc on a smaller disc.\
    \ This has a trivial recursive solution:\n\n```\nvar hanoi = function (disc, src,\
    \ aux, dst) {\n  if (disc > 0) {\n    hanoi(disc - 1, src, dst, aux);\n    document.write('Move\
    \ disc ' + disc + ' from ' + src + ' to ' + dst + '\\n');\n    hanoi(disc - 1,\
    \ aux, src, dst);\n  }\n}\n\nhanoi(3, 'Src', 'Aux', 'Dst');\n```\n\nIt produces\
    \ this solution for three discs:\n\n+   Move disc 1 from Src to Dst\nMove disc\
    \ 2 from Src to Aux\nMove disc 1 from Dst to Aux\nMove disc 3 from Src to Dst\n\
    Move disc 1 from Aux to Src\nMove disc 2 from Aux to Dst\nMove disc 1 from Src\
    \ to Dst\n\nThe Hanoi function moves a stack of discs from one post to another,\
    \ using the auxiliary post necessary. It breaks the problem into three subproblems.\
    \ First, it unlocks the bottom disc by moving the substack above it to the auxiliary\
    \ post. It can then move the bottom disc to the destination post. Finally, it\
    \ can move the substack from the auxiliary post to the destination post. The movement\
    \ of the substack is handled by calling itself recursively to work out those subproblems.\n\
    \nThe Hanoi function passed the number of the disc it is to move and the three\
    \ posts it is to use. When it calls itself, it is to deal with the disc that is\
    \ above the disc it is currently working. Eventually, it will be called with a\
    \ nonexistent disc number. In that case, it does nothing. That act of nothingness\
    \ gives us confidence that the function does not recurse forever.\n\nRecursive\
    \ functions can be very effective in mapping tree structures such as the browser's\
    \ Document Object Model (DOM). Each recursive call gives a smaller piece of the\
    \ tree to work on:"
  merge: -1
