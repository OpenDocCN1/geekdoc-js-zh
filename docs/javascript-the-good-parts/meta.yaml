  md: '# CHAPTER 7


    # Regular Expressions


    > Whereas the contrary bringeth bliss,

    And is a pattern of celestial peace.

    Whom should we match with Henry, being a king...

    —William Shakespeare, The First Part of Henry the Sixth


    Many of JavaScript''s features were borrowed from other languages. The syntax
    came from Java, functions came from Scheme, and prototypal inheritance came from
    Self. JavaScript''s Regular Expression feature was borrowed from Perl.


    A regular expression is the specification of the syntax of a simple language.
    Regular expressions are used with methods to search, replace, and extract information
    from strings. The methods that work with regular expressions are regex.exec, regex.test,
    string.match, string.replace, string.search, and string.split. These will all
    be described in Chapter 8. Regular expressions usually have a significant performance
    advantage over equivalent string operations in JavaScript.


    Regular expressions came from the mathematical study of formal languages. Ken
    Thompson adapted Stephen Kleene''s theoretical work on type-3 languages into a
    practical pattern matcher that could be embedded in tools such as text editors
    and programming languages.


    The syntax of regular expressions in JavaScript conforms to the original formulations
    from Bell Labs, with some reinterpretation and extension from Perl. The rules
    for writing regular expressions are surprisingly complex because they interpret
    characters in some positions as operators, and in different positions as literals.
    Worse being hard to write, this makes regular expressions hard to read and dangerous
    to modify. It is necessary to have a fairly complete understanding of the full
    complexity of regular expressions to correctly read them. To mitigate this, I
    have simplified the rules a little. As presented here, regular expressions will
    be slightly less terse, but they will also be easier to use correctly. And that
    is a slightly good thing because regular expressions can be very difficult to
    maintain and debug.'
  merge: -1
