    expression preceded by new, a refinement preceded by delete, an expression wrapped
    in parentheses, an expression preceded by a prefix operator, or an expression
    followed by:


    +   * An infix operator and another expression

    * The ? operator followed by another expression, then by :, and then by yet another
    expression

    * An invocation

    * A refinement


    The ternary operator takes three operands. If the first operand is truthy, it
    produces the value of the second operand. But if the first operand is falsy, it
    produces the value of the third operand.


    Expressions | 15'
