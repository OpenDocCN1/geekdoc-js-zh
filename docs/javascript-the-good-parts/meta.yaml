    \ | 如果应该预定义 Yahoo! Widgets 全局变量则为 true |\n\n## JSLint 注释\n\noption\n\n## 分号\n\n\
    JavaScript 使用类 C 语法，需要使用分号来分隔语句。JavaScript 尝试通过分号插入机制使分号变为可选。这是很危险的。\n\n像 C 语言一样，\
    \ JavaScript 拥有 `++`、`-` 和 运算符，它们可以是前缀或后缀。歧义通过分号来消除。\n\n在 JavaScript 中，换行符可以是空格，也可以充当分号。这用另一种歧义取代了另一种。\n\
    \nJSLint 要求每个语句后面都跟着 `;`，`for`、`function`、`if`、`switch`、`try` 和 `while` 除外。JSLint\
    \ 不期望出现多余的分号或空语句。\n\n## 换行\n\n为了防止分号插入机制掩盖错误，JSLint 要求长语句仅在以下标点符号或运算符之后进行断行：\n\
    \n```\n, ; : { ( } [ = < ? ! + - * % ^ | & 8\n= != <= < ? += -= * %= ^= |= = =\
    \ << >> | &&\n=== != == <= >= >>> >>>\n```\n\nJSLint 不期望在标识符、字符串、数字、闭合符或后缀运算符之后看到长语句的断行：\n\
    \n```\n) ] ++\n```\n\nJSLint 允许你开启“容忍糟糕换行”（laxbreak）选项。分号插入可能会掩盖复制/粘贴错误。如果你始终在运算符后换行，JSLint\
    \ 可以更好地找到这些错误。\n\n## 逗号\n\n逗号运算符会导致极其复杂的表达式。它还会掩盖某些编程错误。\n\nJSLint 期望看到逗号作为分隔符，而不是运算符（`for`\
    \ 语句的初始化和递增部分除外）。它不期望在数组字面量中看到空元素（el）。不应使用额外的逗号。数组字面量或对象字面量的最后一个元素之后不应出现逗号，因为某些浏览器可能会产生误解。\n\
    \n## 要求的块\n\nJSLint 期望如果使用 `for` 语句，应该使用块——即使用大括号 (`{}`)。JavaScript 允许这样写：\n\n\
    ```javascript\nif (condition)\n  statement;\n```\n\n这种形式认为在许多程序员编写同一份代码的项目中会导致错误。这就是为什么\
    \ JSLint 期望使用块：\n\n```javascript\nif (condition) {\n  statements;\n}\n```\n\n\
    经验表明，这种形式更具健壮性。\n\n## 禁止的块\n\n在许多语言中，块会引入作用域。在块中引入的变量在块外部可见。\n\n在 JavaScript 中，块不引入作用域。只有函数作用域。在函数任何地方引入的变量在函数的任何地方都是可见的。\n\
    \nJSLint 期望仅在 `function`、`if`、`switch`、`while`、`for`、`do` 和 `try` 语句在使用块，其他地方例外。`else`\
    \ 或 `for in` 的无块语句例外。\n\n## 表达式语句\n\n期望表达式语句是赋值、函数/方法调用或 `delete`。所有其他表达式语句都被视为错误。\n\
    \n## for in 语句\n\n`for in` 语句允许遍历对象所有属性的名称。不幸的是，它还会遍历所有通过原型链继承的成员。这产生了一个坏副作用：当你感兴趣的是数据成员时，它却提供了方法函数。\n\
    \n每个 `for` 语句的体都应该封装在一个带有过滤的 `if` 语句中。它可以选择特定类型或范围的值，可以排除函数，或者可以排除原型上的属性。例如：\n\
    \n```javascript\nfor (name in object) {\n  if (object.hasOwnProperty(name)) {\n\
    \    ...\n  }\n}\n```\n\n## switch 语句\n\n`switch` 语句中的常见错误是忘记在每个 `case` 之后放置 `break`\
    \ 语句，导致意外的穿透。ESLint 期望在下一个 `case` 或 `default` 之前的语句是以下这些之一：`break`、`return` 或\
    \ `throw`。\n\n## var 语句\n\nJavaScript 允许 `var` 定义发生在函数内的任何地方。JSLint 则更为严格。\n\n\
    JSLint 期望：\n\n- `var` 只被声明一次，且在在使用之前声明。\n- 函数在在使用之前声明。\n- 参数不会也被声明为 `var`。\n\n\
    JSLint 不期望：\n\n- 将参数数组（arguments array）声明为 `var`。\n- 在块中声明变量。因为 JavaScript 块没有块作用域。这可能会导致意想不到的后果，因此请在函数体的顶部定义所有变量。\n"
