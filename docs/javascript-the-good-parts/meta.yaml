- md: "\n# CHAPTER 4\n\n## Functions\n\nWhy, every fault's condemn'd ere it done:\n\
    Mine were the very cipher of a function...\n—William Shakespeare, Measure for\
    \ Measure\n\nThe best thing about JavaScript is its implementation of functions.\
    \ It got almost everything right. But, as you should expect with JavaScript, it\
    \ didn't get everything right.\n\nA function encloses a set of statements. Functions\
    \ are the fundamental modular unit of JavaScript. They are used for code reuse,\
    \ information hiding, and composition. Functions are used to specify the behavior\
    \ of objects. Generally, the craft of programming is the factoring of a set of\
    \ requirements into a set of functions and data structures.\n\n## Function Objects\n\
    \nFunctions in JavaScript are objects. Objects are collections of name/value pairs\
    \ having a hidden link to a prototype object. Objects produced from object literals\
    \ are linked to Object.prototype. Function objects are linked to Function.prototype.\
    \ Every function is also created with additional hidden properties: the function's\
    \ context and the code that implements the function's behavior.\n\nEvery function\
    \ is also created with a prototype property. Its value is an object with a constructor\
    \ property whose value is the function. This is distinct from the hidden link\
    \ to Function.prototype. The meaning of this convoluted construction will be revealed\
    \ in the next chapter.\n\nSince functions are objects, they can be used like any\
    \ other value. Functions can be stored in variables, objects, and arrays. Functions\
    \ can be passed as arguments to functions, and functions can be returned from\
    \ functions. Also, since functions are objects, functions can have methods.\n\n\
    The thing that is special about functions is that they can be invoked.\n\n## Function\
    \ Literal\n\nFunction objects are created with function literals:\n\n```javascript\n\
    // Create a variable called add and store a function\n// in it adds two numbers.\n\
    \nvar add = function (a, b) {\n  return a + b;\n}\n```\n\nA function literal has\
    \ four parts. The first part is the reserved word function.\n\nThe optional second\
    \ part is the function's name. The function can use its name to itself recursively.\
    \ The name can also be used by debuggers and development tools to identify the\
    \ function. If a function is not given a name, as shown in the previous example,\
    \ it is said to be *anonymous*.\n\nThe third part is the set of parameters of\
    \ the function, wrapped in parentheses. Within the parentheses is a set of zero\
    \ or more parameter names, separated by commas. These will be defined as variables\
    \ in the function. Unlike ordinary variables, instead of being initialized to\
    \ undefined, they will be initialized to the arguments supplied when the function\
    \ is invoked.\n\nThe fourth part is a set of statements wrapped in curly braces.\
    \ These statements are the body of the function. They are executed when the function\
    \ is invoked.\n\nA function literal can appear anywhere that an expression can\
    \ appear. Functions can be defined inside of other functions. An inner function\
    \ of course has access to its parameters and variables. An inner function also\
    \ enjoys the parameters and variables of the functions it is nested within. The\
    \ function object created by a function literal contains a link to that outer\
    \ context. This is called *closure*. This is the source of enormous expressive\
    \ power.\n\n## Invocation\n\nInvoking a function suspends the execution of the\
    \ current function, passing control and parameters to the new function. In addition\
    \ to the declared parameters, every function receives two additional parameters:\
    \ this and arguments. This parameter is very important in object oriented programming,\
    \ and its value is determined by the *invocation pattern*. There are four patterns\
    \ of invocation in JavaScript: the method invocation pattern, the function invocation\
    \ pattern, the constructor invocation pattern, and the apply invocation pattern.\
    \ The patterns differ in how the bonus parameter this is initialized.\n\nThe invocation\
    \ operator is a pair of parentheses that follow any expression that produces a\
    \ function value. The parentheses can contain zero or more expressions, separated\
    \ by commas. Each expression produces one argument value. Each of the argument\
    \ values will be assigned to the function's parameter names. There is no runtime\
    \ error when the number of arguments and the number of parameters do not match.\
    \ If there are too many argument values, the extra argument values will be ignored.\
    \ If there are too few argument values, the undefined value will be substituted\
    \ for the missing values. There is no type checking on the argument values: any\
    \ type of value can be passed to any parameter.\n\n## The Method Invocation Pattern\n\
    \nWhen a function is stored as a property of an object, we call it a *method*.\
    \ When a method is invoked, this is bound to that object. If an invocation expression\
    \ contains a refinement (this, is, a ... [script] expression), it is invoked as\
    \ method:\n\n```javascript\n// CreateObject. It has a value and an increment\n\
    // method. The increment method takes an optional\n// parameter. If the argument\
    \ is not a number, then 1\n// is used as the default.\n\nvar myObject = {\n  value:\
    \ 0,\n  increment: function (inc) {\n    this.value += typeof inc === 'number'\
    \ ? inc : 1;\n  }\n};\n\nmyObject.increment();\ndocument.println(myObject.value);\
    \ // 1\n\nmyObject.increment(2);\ndocument.println(myObject.value); // 3\n```\n\
    \nA method can use this access to the object so that it can retrieve values from\
    \ the object or modify the object. The binding of this to object happens at invocation\
    \ time. This very late binding makes functions that use this highly reusable.\
    \ Methods that get their object context from this are called *public methods*.\n\
    \n## The Function Invocation Pattern\n\nWhen a function is not the property of\
    \ an object, it is invoked as a function:\n\n```javascript\nvar sum = add(3, 4);\
    \ // sum is 7\n```\n\nWhen a function is invoked with this pattern, this is bound\
    \ to the global object. This was a mistake in the design of the language. Had\
    \ the language been designed correctly, when the inner function is invoked, this\
    \ would still be bound to the this variable of the outer function. A consequence\
    \ of this error is that a method cannot employ an inner function to help it do\
    \ its work because the inner function does not share the method's access to the\
    \ object as this is bound to the wrong value. Fortunately, there is an easy workaround.\
    \ If the method defines a variable and assigns the value of this, the inner function\
    \ will have access to this through that variable. By convention, the name of that\
    \ variable is that with a double method.\n\n```javascript\n// Augment gameObject\n\
    myObject.double = function () {\n  var that = this; // Workaround.\n\n  var helper\
    \ = function () {\n    that.value = add(that.value, that.value);\n  };\n\n  helper();\
    \ // Invoke helper as a function.\n};\n\n// Invoke double as a method.\nmyObject.double();\n\
    document.writeln(myObject.getValue()); // \n```\n\n## The Constructor Injection\
    \ Pattern\n\nJavaScript is a prototypical inheritance language. That means that\
    \ objects can inherit properties from other objects. The language is class-free.\n\
    \nThis is a radical departure from the current fashion. Most languages today are\
    \ classical. Prototypal inheritance is powerfully expressive, but is not widely\
    \ understood. JavaScript itself is not confident in its prototypical nature, so\
    \ it offers an object-making syntax that is reminiscent of the classical languages.\
    \ Few programmers found prototypal inheritance to be acceptable, and classically\
    \ inspired syntax obscures the language's true prototypical nature. It is the\
    \ worst of both worlds.\n\nIf a function is invoked with the new prefix, a new\
    \ object will be created with a hidden link to the value of the function's prototype\
    \ member, and this will be bound to that new object.\n\nThe new prefix also changes\
    \ the behavior of the return statement. We will see more about that next.\n\n\
    ```javascript\n// Create a constructor function called Quo.\n// It makes an object\
    \ with a status property.\n\nvar Quo = function (string) {\n  this.status = string;\n\
    };\n\n// Give all instances of Quo a public method\n```\n"
  mdcn: "\n\n# 第 4 章\n\n## 函数\n\n为何，每一处错误在发生前就已受到定罪：\n我的错误恰恰是一个函数的零值……\n——威廉·莎士比亚，《越界之量》\n\
    \nJavaScript 最棒的一点在于它对函数的实现。它几乎做对了一了一切。但是，正如你对 JavaScript 的预期那样，它并不是面面都正确。\n\n\
    函数封装了一组语句。函数是 JavaScript 基本的模块单元。它们被用于代码重用、信息隐藏和组合。函数用于指定对象的行为。通常情况下，编程的艺术是将一组需求拆解为一组函数和数据结构。\n\
    \n## 函数对象\n\nJavaScript 中的函数是对象。对象是键/值对的集合，并有一个指向原型对象的隐藏链接。从对象字面量产生的对象链接到 `Object.prototype`。函数对象则链接到\
    \ `Function.prototype`。每个函数在创建时还带有额外的隐藏属性：函数的上下文（context）以及实现函数行为的代码。\n\n每个函数还被带有一个\
    \ `prototype` 属性。它的值是一个对象，该对象包含一个 `constructor` 属性，该属性的值就是函数本身。这与指向 `Function.prototype`\
    \ 的隐藏链接是不同的。这种复杂构造的意义将在下一章中揭示。\n\n由于函数是对象，它们可以像任何其他值一样使用。函数可以存储在变量、对象和数组中。函数可以作为参数传递给函数，也可以从函数返回。此外，由于函数是对象，函数也可以拥有方法。\n\
    \n函数之所以特殊，在于它们是可以被调用（invoked）。\n\n## 函数字面量\n\n函数对象是通过函数字面量创建的：\n\n```javascript\n\
    // 创建一个名为 add 的变量并在其中存储\n// 加两个数字的函数。\n\nvar add = function (a, b) {\n  return\
    \ a + b;\n}\n```\n\n一个函数字面量包含四个部分。第一部分是关键字 `function`。\n\n可选的第二部分是函数的名称。函数可以使用该名称进行递归调用。调试器和开发工具也可以使用该名称来识别函数。如果函数没有命名（如上一个示例所示），它被称为*匿名*（anonymous）函数。\n\
    \n第三部分是函数的参数列表，包裹在括号中。括号内是一组零或多个由逗号分隔的参数名称。这些将在函数内部定义为变量。与普通变量不同，它们不会被初始化为 `undefined`，而是初始化为调用函数时提供的参数。\n\
    \n第四部分是包裹在花括号中的一组语句。这些语句是函数的体体。它们在函数被调用时执行。\n\n函数字面量可以出现在任何允许表达式的地方。函数可以定义在其他函数内部。当然，内部函数可以访问其参数和变量。内部函数还可以访问其所嵌套的函数的参数和变量。由函数字面量创建的函数对象包含一个指向该外部上下文的链接。这被称为*闭包*（closure）。这是巨大表达能力的源泉。\n\
    \n## 调用\n\n调用函数会暂停当前函数的执行，并将控制权和参数传递给新函数。除了声明参数外，每个函数都会接收两个额外的参数：`this` 和 `arguments`。这个参数在面向对象的编程中非常重要，它的值由*调用模式*（invocation\
    \ pattern）决定。JavaScript 有四种调用模式：方法调用模式、函数调用模式、构造函数调用模式和 `apply` 调用模式。这些模式的区别在于额外参数\
    \ `this` 的初始化方式。\n\n调用操作是一对跟在任何产生函数值的表达式后面的括号。括号内可以包含零或多个由逗号分隔的表达式。每个表达式产生一个参数值。每个参数值都将被赋值给函数的参数名称。当参数数量与参数个数不匹配时，不会发生运行时错误。如果参数值过多，多余的参数将被忽略。如果参数值太少，将用\
    \ `undefined` 替换缺失的值。对参数值不进行类型检查：任何类型的值都可以传递给任何参数。\n\n## 方法调用模式\n\n当一个函数被存储为对象的属性时，我们称其为*方法*（method）。当方法被调用时，`this`\
    \ 会绑定到该对象。如果调用表达式包含细化操作（`this, is, a ... [script]` 表达式），它将作为方法被调用：\n\n```javascript\n\
    // 创建对象 myObject。它有一个 value 值和一个 increment\n// 方法。increment 方法接受一个可选\n// 参数。如果参数不是数字，则使用\
    \ 1\n// 作默认值。\n\nvar myObject = {\n  value: 0,\n  increment: function (inc) {\n\
    \    this.value += typeof inc === 'number' ? inc : 1;\n  }\n};\n\nmyObject.increment();\n\
    document.println(myObject.value); // 1\n\nmyObject.increment(2);\ndocument.println(myObject.value);\
    \ // 3\n```\n\n方法可以利用这种对对象的访问，从而从对象中检索值或修改对象。这种对对象的绑定发生在调用时。这种极晚绑定使得使用这种机制的函数高度可用。通过这种获取对象上下文的方法被称为*公共方法*（public\
    \ methods）。\n\n## 函数调用模式\n\n当函数不是对象的属性时，它是作为函数被调用的：\n\n```javascript\nvar sum\
    \ = add(3, 4); // sum 是 7\n```\n\n当用这种模式调用函数时，`this` 会绑定到全局对象。这是语言设计中的一个错误。如果语言设计得正确，当内部函数被调用时，`this`\
    \ 应该仍然绑定到外部函数的 `this` 变量上。这个错误的结果是方法无法利用内部函数来帮助完成工作，因为内部函数没有共享方法对对象的访问权限，因为 `this`\
    \ 绑定到了错误的值。幸运的是，有一个简单的变通方法。如果方法定义了一个变量并将 `this` 的值赋值给它，内部函数将通过该变量访问 `this`。按照惯例，该变量的名称通常带有双下划线。\n\
    \n```javascript\n// 增强 gameObject\nmyObject.double = function () {\n  var that\
    \ = this; // 变通方法。\n\n  var helper = function () {\n    that.value = add(that.value,\
    \ that.value);\n  };\n\n  helper(); // 作为函数调用 helper。\n};\n\n// 作为方法调用 double。\n\
    myObject.double();\ndocument.writeln(myObject.getValue()); // \n```\n\n## 构造函数注入模式\n\
    \nJavaScript 是一种原型继承的语言。这意味着对象可以从其他对象继承属性。该语言没有类的概念。\n\n这是对当前时尚的激进偏离。今天大多数语言都是经典的（基于类的）。原型继承具有强大的表达力，但并没有被广泛理解。JavaScript\
    \ 本身对自己的原型特性并不自信，因此它提供了一种类似于经典语言的创建对象的语法。很少有程序员认为原型继承是可接受的，而受经典启发的语法掩盖了语言真正的原型本质。这是一种兼得必失的产物。\n\
    \n如果使用 `new` 前缀调用函数，将创建一个新对象，该对象包含一个指向函数 `prototype` 成员值的隐藏链接，并且该链接将绑定到新对象。\n\n\
    `new` 前缀还改变了 `return` 语句的行为。我们将在后面看到更多内容。\n\n```javascript\n// 创建一个名为 Quo 的构造函数。\n\
    // 它创建一个带有 status 属性的对象。\n\nvar Quo = function (string) {\n  this.status = string;\n\
    };\n\n// 给所有 Quo 的实例添加一个公共方法\n```\n"
