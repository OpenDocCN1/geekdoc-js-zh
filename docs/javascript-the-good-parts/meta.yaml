    \nA noncapturing group has a (?: prefix. A noncapturing group simply matches;\
    \ it does not capture the matched text. This has the advantage of slight faster\
    \ performance. Noncapturing groups do not interfere with the numbering of capturing\
    \ groups.\n\n# Positive lookahead\n\nA positive lookahead group has a (?= prefix.\
    \ It is like a noncapturing group except that after the match, the text is rewound\
    \ to where the group started, effectively matching nothing. This is not a good\
    \ part.\n\n# Negative lookahead\n\nA negative lookahead group has a (! prefix.\
    \ It is like a positive lookahead group, except that it matches only if it fails\
    \ to match. This is not a good part.\n\n# Regex Class\n\n# regexp class\n\n![](img/03300178c40ed5b3e760309f69ee3125_90_1.png)\n\
    \nA regexp class is a convenient way of specifying one or set of characters. For\
