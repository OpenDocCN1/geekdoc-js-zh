  md: '# Regexp factor


    ![](img/03300178c40ed5b3e760309f69ee3125_88_0.png)


    A regex factor can be a character, a parenthesized group, a character class, or
    an escape sequence. All characters are treated literally except for the control
    characters and the special characters:


    \/ [ \( \) { } \? * \| . ^


    which must be escaped with a prefix if they are to be matched literally. When
    in doubt, any special character can be given a \ prefix to make it literal. The
    \ prefix does not make hex characters or digits literal.


    Anescapescap . matches any character except a line-ending character.


    An unescaped ^ matches the beginning of the text lastIndex property is zero. It
    can also match line-ending characters when the m flag is specified.


    An unescaped $ matches the end of the text. It can also match line-ending characters
    when the m flag is specified.


    # Regexp Escape


    The backslash character indicates escapement in regexp factors as well as in strings,
    but in regexp factors, it works a little differently.


    As in strings, \f is the feedchar, \n is the newline character, \r is the carriage
    return, \t is the tab character, and \u allows for specifying a Unicode character
    as a 16-bit hex. In regexp factors, \b is not the backspace character.


    \d is the same as [0-9]. It matches a digit. \D is the opposite: [^0-9].


    \s is the same as [\f\n\t\u0008\u0020\u00a0\u2028\u2029]. \S is the opposite:
    [^\f\n\t\u0008\u0020\u00a0\u2028\u2029]


    \w is the same as [0-9A-Z-a-z]. \W is the opposite: [^0-9A-Z-a-z]. This is supposed
    to represent the characters that appear in words. Unfortunately, the class is
    useless for virtually any real language. If you need to match a class of letters,
    you must specify your own class.'
