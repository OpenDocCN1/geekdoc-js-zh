    # Preface


    > If we offend, it is with our good will

    > That you should think, we come not to offend,

    > But with good will. To show our simple skill,

    > That is the true beginning of our end.

    > William Shakespeare, A Midsummer Night''s Dream


    This is a book about the JavaScript programming language. It is intended for programmers
    who, by happenstance or curiosity, venturing into JavaScript for the first time.
    It is also intended for programmers who have been working with JavaScript at a
    novice level and are now ready for a more sophisticated relationship with the
    language. JavaScript is a surprisingly powerful language. Its unconventionality
    presents some challenges, being a small language, it is easily mastered.


    My goal here is to help you to learn to think in JavaScript. I will show you the
    components of the language and start you on the process of discovering the ways
    components can be put together. This is not a reference book. It is not exhaustive
    about the language and its quirks. It doesn''t contain everything you''ll ever
    need to know. That you can easily find online. Instead, this book contains the
    things that are really important.


    This is not a book for beginners. Someday hope to write a JavaScript: The First
    Parts book, but this is not that book. This is not a book about Ajax or web programming.
    The focus is exclusively on JavaScript, which is just one of the languages the
    web developer must master.


    This is not a book for dummies. This book is small, but it is dense. There is
    a lot of material packed into it. Don''t be discouraged if it takes multiple readings
    to get it. Your efforts will be rewarded.


    # Conventions Used in This Book


    The following typographical conventions are used in this book:


    *Italic*

    Indicates new terms, URLs, filenames, and file extensions.


    Constant width

    Indicates computer coding in a broad sense. This includes commands, options, variables,
