    某些全局变量是可以预定义的（参见“选项”部分）。选择“Assume a browser”（browser） 选项来重新定义网络浏览器提供的标准全局属性，例如\
    \ `window` 和 `document alert`。选择“Assume Rhino”（rhino） 选项来重新定义 Rhino 环境提供的全局属性。选择“Assume\
    \ a Yahoo Widget”（widget） 选项来定义 Yahoo! 环境提供的全局属性。\n\n## 成员\n\n由于 JavaScript 是一种松散的动态对象语言，无法在编译时确定属性名称是否拼写正确。JSLint\
    \ 在这方面提供帮助。\n\n在报告的底部，JSLint 会显示一个 `/*members*/` 注释。它包含了所有使用点表示法（dot notation）、下标表示法（subscript\
