  md: '# CHAPTER 9


    # # Style


    Here is a silly stately style indeed!

    —William Shakespeare, *The First Part of Henry the Sixth*


    Computer programs are the most complex things that humans make. Programs are made
    up of a huge number of parts, expressed as functions, statements, and expressions
    that are arranged in sequences that must be virtually free of error. The runtime
    behavior has usually expected to be modified over the course of its productive
    life. The process of convert-ing one correct program into a different correct
    program is extremely challenging.


    Good programs have a structure that anticipates—but is not overly burdened by—the
    possible modifications that will be required in the future. Good programs also
    have a clear presentation. If a program is expressed well, then we have the best
    chance of being able to understand it so that it can be successfully modified
    or repaired.


    These concerns are true for all programming languages, and are especially true
    for JavaScript. JavaScript’s loose typing and excessive error tolerance provide
    little compile-time assurance of our programs’ quality, so to compensate, we should
    code with strict discipline.


    JavaScript contains a large set of weak or problematic features that can undermine
    our attempts to write good programs. We should obviously avoid JavaScript’s worst
    features. Surprisingly, perhaps, we should also avoid the features that are often
    useful but occasionally hazardous. Such features are attractive nuisances, and
    by avoiding- them, a large class of potential errors is avoided.


    The long-term value of software to an organization is in direct proportion to
    the quality of the codebase. Over its lifetime, a program will be handled by many
    pairs of hands and eyes. If a program is able to clearly communicate its structure
    and characteristics, it is less likely to break when it is modified in the never-too-distant
    future.'
  merge: -1
  pgno: 109
