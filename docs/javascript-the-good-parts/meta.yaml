  md: "# Methods\n\nJavaScript provides a set of methods for acting on arrays. The\
    \ methods are functions stored in Array.prototype. In Chapter 3, we saw that Object.prototype\
    \ can be augmented. Array.prototype can be augmented well.\n\nFor example, suppose\
    \ we want to add an array method that will allow us to do computation on an array:\n\
    \n```\nArray.method('reduce', function (f, value) {\n  var i;\n  for (i = 0; i\
    \ < this.length; i += 1) {\n    value = f(this[i], value);\n  }\n  return value;\n\
    }\n```\n\nBy adding a function to Array.prototype, every array inherits the method.\
    \ In this case, we defined a method that takes a function and a starting value.\
    \ For each element of the array, it calls the function with an element and the\
    \ value, computes a new value. When it is finished, it returns the value. If we\
    \ pass in a function that adds two numbers, it computes the sum. If we pass in\
    \ a function that multiplies two numbers, it computes the product:\n\n```\n//\
    \ Create an array of numbers.\n\nvar data = [4, 8, 15, 16, 23, 42];\n\n// Define\
    \ two simple functions. One will add two\n// The other will multiply two numbers.\n\
    \nvar add = function (a, b) {\n  return a + b;\n};\n\nvar mult = function (a,\
    \ b) {\n  return a * b;\n}\n```\n\n```\n// Invoke the data's reduce method, passing\
    \ in the\n// add function.\n\nvar sum = data.reduce(add, 0); // sum is 108\n```\n\
    \n```\n// Invoke the reduce method again, this time passing\n// in the multiply\
    \ function.\n\nvar product = data.reduce(mult, 1); // product is 7418880\n```\n\
    \nBecause an array is really an object, we can add methods directly to an individual\
    \ array:"
