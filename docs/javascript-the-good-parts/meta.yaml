  md: "# Expression Statements\n\nAn expression statement is expected to be an assignment,\
    \ a function/method call, or delete. All other expression statements are considered\
    \ errors.\n\n# for in Statement\n\nThe for in statement allows looping through\
    \ the names of all of all the properties of an object. Unfortunately, it also\
    \ loops through all the members that were inherited through the prototype chain.\
    \ This has the bad side effect of serving up method functions when the interest\
    \ is in the data members.\n\nThe body of every for statement should be wrapped\
    \ in an if statement that does filtering. if it can select a particular type or\
    \ range of values, it can exclude functions, or it can exclude properties from\
    \ the prototype. For example:\n\n```\nfor (name in object) {\n  if (object.hasOwnProperty(name))\
    \ {\n    ...\n  }\n```\n\n# switch Statement\n\nA common error in switch statements\
    \ is to forget to place a break statement after each case, resulting in unintended\
    \ fall-through. ESLint expects that the statement before the next case or default\
    \ is one of these: break, return, or throw.\n\n# var Statement\n\nJavaScript allows\
    \ var definitions to occur anywhere within a function. JSLint is stricter.\n\n\
    JSLint expects that:\n\n+   - A var will be declared only once, and that it will\
    \ be declared before it is used.\n- A function will be declared before it is used.\n\
    - Parameters will not also be declared as vars.\n\nJSLint does not expect:\n\n\
    +   - The arguments array to be declared as a var.\n- That a variable will be\
    \ declared in a block. This is JavaScript blocks do not have block scope. This\
    \ can have unexpected consequences, so define all variables at the top of the\
    \ function body."
