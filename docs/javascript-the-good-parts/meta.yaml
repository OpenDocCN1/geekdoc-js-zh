  md: '# APPENDIX E


    # JSON


    Farewell; the leisure and the fearful time

    Cuts off the ceremonial vows of love

    And ample interchange of sweet discourse,

    Which so long sunder''d friends shoulddwell upon:

    God give us leisure for these rites of love!

    Once, adieu: valiant, and speed of well!

    —William Shakespeare, The Tragedy of Richard the Third


    JavaScript Object Notation (JSON) is a lightweight data interchange format. It
    is based on JavaScript''s object literal notation, one of JavaScript''s best parts.
    Even though it is a subset of JavaScript, it is language independent. It can be
    used to exchange data between programs written in all modern programming languages.
    It is a text format, so it is readable by humans and machines. It is easy to implement
    and use. There is a lot of material about JSON at http://www.JSON.org.


    # JSON Syntax


    JSON has six kinds of values: objects, arrays, strings, numbers, booleans (true
    and false), and the special value null. Whitespace (spaces, tabs, carriage returns,
    and newline characters) may be inserted before or after any value. This can make
    JSON easier for humans to read. Whitespace may be omitted to reduce transmission
    or storage costs.


    A object is an unordered container of name/value pairs. A name can be any string.
    A value can be any JSON value, including arrays and objects. JSON objects can
    be nested to any depth, but generally is most effective to keep them relatively
    flat. Most languages have a feature that maps easily to JSON objects, such as
    an object, struct, record, dictionary, hash table, property list, or associative
    array.


    The JSON array is an ordered sequence of values. A value can be any JSON value,
    including arrays and objects. Most languages have a feature that maps easily onto
    JSON arrays, such as an array, vector, list, or sequence.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '![](img/03300178c40ed5b3e760309f69ee3125_152_0.png)


    ![](img/03300178c40ed5b3e760309f69ee3125_152_1.png)


    ![](img/03300178c40ed5b3e760309f69ee3125_152_2.png)


    A JSON string is wrapped in double quotes. The \ character is used for escapement.
    JSON allows the / character to be escaped so that JSON can be embedded in HTML
    <script> tags. HTML does not allow the sequence </script> except to terminate
    the <script> tag. JSON allows </> which produces the result but does not confuse
    HTML.


    JSON numbers are like JavaScript numbers. A leading zero is not allowed on integers
    because some languages use it to indicate octal. That kind of radix confusion
    is not desirable in a data interchange format. A number can be an integer, real,
    or scientific.


    That''s it. That is all of JSON. JSON''s design goals were to be minimal, portable,
    textual, and a subset of JavaScript. The less we need to agree on in order to
    interoperate, the more easily we can interoperate.'
  merge: -1
