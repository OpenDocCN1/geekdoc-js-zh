    # CHAPTER 7


    # Regular Expressions


    > Whereas the contrary bringeth bliss,

    And is a pattern of celestial peace.

    Whom should we match with Henry, being a king...

    —William Shakespeare, The First Part of Henry the Sixth


    Many of JavaScript''s features were borrowed from other languages. The syntax
    came from Java, functions came from Scheme, and prototypal inheritance came from
    Self. JavaScript''s Regular Expression feature was borrowed from Perl.


    A regular expression is the specification of the syntax of a simple language.
    Regular expressions are used with methods to search, replace, and extract information
    from strings. The methods that work with regular expressions are regex.exec, regex.test,
    string.match, string.replace, string.search, and string.split. These will all
    be described in Chapter 8. Regular expressions usually have a significant performance
    advantage over equivalent string operations in JavaScript.


    Regular expressions came from the mathematical study of formal languages. Ken
    Thompson adapted Stephen Kleene''s theoretical work on type-3 languages into a
    practical pattern matcher that could be embedded in tools such as text editors
    and programming languages.


    The syntax of regular expressions in JavaScript conforms to the original formulations
    from Bell Labs, with some reinterpretation and extension from Perl. The rules
    for writing regular expressions are surprisingly complex because they interpret
    characters in some positions as operators, and in different positions as literals.
    Worse being hard to write, this makes regular expressions hard to read and dangerous
    to modify. It is necessary to have a fairly complete understanding of the full
    complexity of regular expressions to correctly read them. To mitigate this, I
    have simplified the rules a little. As presented here, regular expressions will
    be slightly less terse, but they will also be easier to use correctly. And that
    is a slightly good thing because regular expressions can be very difficult to
    maintain and debug.'
- md: "\nToday's regular expressions are not strictly regular, but they can be very\
    \ useful. Regular expressions tend to be extremely terse, even cryptic. They are\
    \ easy to use in their simplest form, but they can quickly become bewildering.\
    \ JavaScript's regular expressions are difficult to read because they do not allow\
    \ comments or whitespace. All of the parts of a regular expression are pushed\
    \ tightly together, making them almost indecipherable. This is a particular concern\
    \ when they are used in security applications for scanning and validation. If\
    \ you cannot read and understand a expression, can you have confidence that it\
    \ will work correctly for all inputs? Yet, despite their obvious drawbacks, regular\
    \ expressions are widely used.\n\n## An Example\n\nHere is an example. It is a\
    \ regular expression that matches URLs. The pages of this book are not infinitely\
    \ wide, so I broke it into two lines. In a JavaScript program, the regular expression\
    \ must be on a single line. Whitespace is significant:\n\n```javascript\nvar parse_url\
    \ = /^((?:([A-Za-z]+):)?{0,3})\\([0-9.\\-A-Za-z]+\\)(?::(\\d+))?(?:/([^\\s#]*))?(?:#(.*))?(?:\\\
    ?(.*))?$/\n```\n\n```javascript\nvar url = \"http://www.ora.com/goodparts?#fragment\"\
    ;\n```\n\nLet's call parse_url's exec method. If it successfully matches the string\
    \ that we pass to, it will return an array containing parts extracted from the\
    \ url:\n\n```javascript\nvar url = \"http://www.ora.com/goodparts?#fragment\"\
    ;\nvar result = parse_url.exec(url);\nvar names = ['url', 'scheme', 'slash', 'host',\
    \ 'port', 'path', 'query', 'hash'];\nvar blanks = ' ';\n\nfor (var i = 0; i <\
    \ names.length; i += 1) {\n  document.writeln(names[i] + ': ' +\n  blanks.substring(names[i].length),\
    \ result[i]);\n}\n```\n\nThis produces:\n\n```\nurl: http://www.ora.com:80/goodparts?#fragment\n\
    scheme: http\nslash: /\nhost: www.ora.com\nport: 80\npath: goodparts\nquery: q\n\
    hash: fragment\n```\n\nIn Chapter 2, we used railroad diagrams to describe the\
    \ JavaScript language. We can also use them to describe the languages defined\
    \ by regular expressions. That may make it easier to see what a regular expression\
    \ does. This is a railroad diagram for parse_url.\n\n### parse_url\n\n![](img/03300178c40ed5b3e760309f69ee3125_82_0.png)\n\
    \nRegular expressions cannot be broken into smaller pieces the way that functions\
    \ can, so the track representing parse_url is a long one.\n\nLet's factor parse_url\
    \ into its parts to see how it works: \n\n^ \nThe ^ indicates the beginning of\
    \ the string. It is an anchor that prevents exec from skipping over a non-URL-like\
    \ prefix:\n\n```javascript\n(?::([A-Za-z]+):)\n```\n\nThis factor matches a scheme\
    \ name, but only if it is followed by a : (colon). The (?:|...) indicates a noncapturing\
    \ group. The suffix ? indicates that the group is optional.\n\nIt means repeat\
    \ zero or one time. The (...) indicates a capturing group. A capturing group copies\
    \ the text it matches and places it in the result array. Each capturing group\
    \ is given a number. This first capturing group is 1, so a copy of the text matched\
    \ by this capturing group will appear in result[1]. The [...] indicates a character\
    \ class. This character class, A-Za-z, contains 26 uppercase letters and 26 lowercase\
    \ letters. The hyphens indicate ranges, from A to Z. The suffix + indicates that\
    \ the character class will be matched one or more times. The group is followed\
    \ by the : character, which will be matched literally:\n\n```javascript\n(\\0{3})\n\
    ```\n\nThe next factor is capturing 2. \\ indicates that a / (slash) should be\
    \ matched. It is escaped with \\ (backslash) so that it is not interpreted as\
    \ the end of the regular expression literal. The suffix {0,3} indicates that the\
    \ / will be matched 0 or 1 or 3 times:\n\n```javascript\n([0-9.\\-A-Za-z]+)\n\
    ```\n\nThe next factor is capturing 3. It will match a host name, which is made\
    \ up of one or more digits, letters, or -. The - was escaped as \\- to prevent\
    \ it from being confused with a range hyphen:\n\n```javascript\n(?:\\d+))\n```\n\
    \nThe next factor optionally matches a port number, which is a sequence of one\
    \ or more digits preceded by a : . represents a digit character. The sequence\
    \ of one or more digits will be capturing group 4:\n\n```javascript\n(?::\\/([^#]*)\n\
    ```\n\nWe have another optional group. This one begins with a ^. The character\
    \ class [^#] begins with a ^ which includes all characters except ? and #. The\
    \ * indicates that the character class is matched zero or more times.\n\nWe note\
    \ that I am sloppy sleepy. The class of all characters except ? and # includes\
    \ line-ending characters, control characters, and lots of other characters that\
    \ really shouldn't be matched here. Most of the time this will want but there\
    \ is a risk that some bad text could slip. Sloppy regular expressions are a popular\
    \ source of security exploits. It is a lot easier to write sloppy regular expressions\
    \ than rigorous regular expressions:\n\n```javascript\n(?::/(.*))?\n```\n\nNext,\
    \ we have an optional group that begins with a ?. It contains capturing group\
    \ 6, which contains zero or more characters that are not #:\n\nWe have a final\
    \ optional group that begins with #. The . will match any character except a line-ending\
    \ character:\n\n```javascript\n$\n```\n\n$ S represents the end of the string.\
    \ It assures that there was no extra material after the end of the URL.\n\nThose\
    \ are the factors of the regular expression parse_url.\n\nIt is possible to make\
    \ regular expressions that are more complex than parse_url, but I wouldn't recommend\
    \ it. Regular expressions are best when they are short and simple. Only then can\
    \ we have confidence that they are working correctly and that they could be successfully\
    \ modified if necessary.\n\nThere is a very high degree of compatibility between\
    \ JavaScript language processors. The part of the language that least portable\
    \ is the implementation of regular expressions. Regular expressions that are very\
    \ complicated or convoluted are likely to have portability problems. Nested regular\
    \ expressions can also suffer performance problems in some implementations. Simplicity\
    \ is the best strategy.\n\nLet's look at another example: a regular expression\
    \ that matches numbers. Numbers can have an integer part with an optional minus\
    \ sign, an optional fractional part, and an exponent part:\n\n```javascript\n\
    var parse_number = /-?\\d+(?:\\.\\d+*)?(?:e[+\\-]?\\d*)?/;\n```\n\nvar test =\
    \ function (num) {\n  document.writeln(parse_number.test(num));\n};\n\n```\ntest('1');\
    \               // true\ntest('number');         // false\ntest('98.6');     \
    \       // true\ntest('123.21.860');      // false\ntest('123.45E-67');     //\
    \ true\ntest('123.450-67');      // false\n```\n\nLet's break down parse_number:\n\
    \n```javascript\n/^$/i\n```\n\nWe use ^ and $ to anchor the regular expression.\
    \ If we had omitted the anchors, the regular expression would tell us if a string\
    \ contains a number. With the anchors, it tells us if the string contains only\
    \ a number.\n\n- When you press them all together, it is visually confusing: ^(?:([A-Za-z]+)?(?:/(0,3))?([0-9.\\\
    -A-Za-z]+)?(?::(\\d+))?(?:/([^#]*)?)?(?::(#]*)?)?(?::.*))$/\n\n### parse_number\n\
    \n![](img/03300178c40ed5b3e760309f69ee3125_85_0.png)\n\nThe *i* flag causes case\
    \ to be ignored when matching letters. The only letter in our pattern is e. We\
    \ want e to also match E. We could have written the e factor as `[Ee]` or `(?:E|e)`,\
    \ but we didn't have to because we used the *i* flag:\n\n-?\n\nThe `?` suffix\
    \ on the minus sign indicates that the minus sign is optional:\n\n\\d means the\
    \ same as [0-9]. It matches a digit. The + suffix causes it to match one or more\
    \ digits:\n\n(?|\\d*)\n\nThe (?:...) indicates an optional noncapturing group.\
    \ It is usually better to use noncapturing groups instead of the less ugly capturing\
    \ groups because capturing has a performance penalty. The group will match a decimal\
    \ followed by zero or more digits:\n\n(?:e[+\\-]?\\d*)\n\nThis is another optional\
    \ noncapturing group. It matches e (or E), an optional sign, and one more digits.\n\
    \n## Construction\n\nThere are two ways to make a RegExp object. The preferred\
    \ way, as we saw in the examples, is to use a regular expression literal.\n\n\
    ![](img/03300178c40ed5b3e760309f69ee3125_85_1.png)\n"
  mdcn: "\n如今的正则表达式并不是严格意义上的正则，但它们非常有用。正则表达式往往极其简练，甚至有些晦涩。在最简单的形式下，它们很容易使用，但很快就会变得令人困惑。JavaScript\
    \ 的正则表达式很难阅读，因为它们不允许包含注释或空格。正则表达式的所有部分都紧紧地挤在一起，这使得它们几乎无法识别。当这些正则用于安全应用程序中进行扫描和验证时，这是一个特别令人关注的问题。如果你无法读取和理解一个表达式，你又如何信心它对所有输入都能正常工作呢？然而，尽管有这些明显的缺点，正则表达式仍然被广泛使用。\n\
    \n## 示例\n\n这是一个示例。这是一个匹配 URL 的正则表达式。由于本书的页面不是无限宽的，所以我将其分成了两行。在 JavaScript 程序中，正则表达式必须在单行内。空格是有意义的：\n\
    \n```javascript\nvar parse_url = /^((?:([A-Za-z]+):)?{0,3})\\([0-9.\\-A-Za-z]+\\\
    )(?::(\\d+))?(?:/([^\\s#]*))?(?:#(.*))?(?:\\?(.*))?$/\n```\n\n```javascript\n\
    var url = \"http://www.ora.com/goodparts?#fragment\";\n```\n\n让我们调用 `parse_url`\
    \ 的 `exec` 方法。如果它成功匹配了我们传递的字符串，它将返回一个包含从 url 中提取部分的数组：\n\n```javascript\nvar url\
    \ = \"http://www.ora.com/goodparts?#fragment\";\nvar result = parse_url.exec(url);\n\
    var names = ['url', 'scheme', 'slash', 'host', 'port', 'path', 'query', 'hash'];\n\
    var blanks = ' ';\n\nfor (var i = 0; i < names.length; i += 1) {\n  document.writeln(names[i]\
    \ + ': ' +\n  blanks.substring(names[i].length), result[i]);\n}\n```\n\n产生的结果如下：\n\
    \n```\nurl: http://www.ora.com:80/goodparts?#fragment\nscheme: http\nslash: /\n\
    host: www.ora.com\nport: 80\npath: goodparts\nquery: q\nhash: fragment\n```\n\n\
    在第 2 章中，我们使用铁道图（railroad diagrams）来描述 JavaScript 语言。我们也可以用它们来描述由正则表达式定义的语言。这可能让我们更容易看到一个正则表达式在做什么。这里是\
    \ `parse_url` 的铁道图。\n\n### parse_url\n\n![](img/03300178c40ed5b3e760309f69ee3125_82_0.png)\n\
    \n正则表达式无法像函数那样拆分成更小的部分，因此代表 `parse_url` 的轨道很长。\n\n让我们将 `parse_url` 分解为它的各个部分，看看它是如何工作的：\n\
    \n^ \n`^` 表示字符串的开始。它是一个锚点，防止 `exec` 跳过非 URL 格式的前缀：\n\n```javascript\n(?::([A-Za-z]+):)\n\
    ```\n\n这个部分匹配方案名称（scheme name），但前提是它后面跟着一个 `:`（冒号）。`(?:|...)` 表示一个非捕获组。后缀 `?`\
    \ 表示该组是可选的。\n\n它表示重复零或一次。`(...)` 表示一个捕获组。捕获组会复制它匹配的文本并将其放入结果数组中。每个捕获组都被分配一个数字。第一个捕获组是\
    \ 1，因此由此捕获组匹配的文本副本将出现在 `result[1]` 中。`[...]` 表示一个字符类。这个字符类 `A-Za-z` 包含 26 个大写字母和\
    \ 26 个小写字母。连字符 `-` 表示范围，从 A 到 Z。后缀 `+` 表示该字符类将被匹配一次或多次。该组后面跟着 `:` 字符，该字符将进行字面匹配：\n\
    \n```javascript\n(\\0{3})\n```\n\n下一个部分是捕获组 2。`\\/` 表示应该匹配一个 `/`（斜杠）。它用 `\\`（反斜杠）进行了转义，以确保它不会被解释为正则表达式字面量的结束。后缀\
    \ `{0,3}` 表示 `/` 将被匹配 0 次、1 次或3 次：\n\n```javascript\n([0-9.\\-A-Za-z]+)\n```\n\
    \n下一个部分是捕获组 3。它将匹配主机名，主机名由一个或多个数字、字母或 `-` 组成。`-` 被转义为 `\\-`，以防止它与范围连字符混淆：\n\n\
    ```javascript\n(?:\\d+))\n```\n\n下一个部分可选地匹配端口号，端口号是由一个或多个数字组成的序列，前面有一个 `:`。`.`\
    \ 表示一个数字字符。这一个或多个数字的序列将是捕获组 4：\n\n```javascript\n(?::\\/([^#]*)\n```\n\n我们有另一个可选组。这个组以\
    \ `^` 开头。字符类 `[^#]` 以 `^` 开头，包含 `?` 和 `#` 之外的所有字符。`*` 表示该字符类被匹配零次或多次。\n\n我们注意，我这里写得很粗率。除了\
    \ `?` 和 `#` 之外的所有字符类包含了行结束符、控制字符以及许多实际上不应该在这里被匹配的字符。大多数情况下这是我们所需要的，但存在某些糟糕文本溜进去的风险。粗率的正则表达式是安全漏洞的常见来源。编写粗率的正则表达式比编写严谨的正则表达式要容易得多：\n\
    \n```javascript\n(?::/(.*))?\n```\n\n接下来，我们有一个以 `?` 开头的可选组。它包含捕获组 6，该组包含零或多个非\
    \ `#` 字符：\n\n我们有一个最后的以 `#` 开头的可选组。`.` 将匹配除行结束符外的任意字符：\n\n```javascript\n$\n```\n\
    \n`$` 表示字符串的结束。它确保在 URL 结束之后没有额外的材料。\n\n这些就是 `parse_url` 正则表达式的组成部分。\n\n可以编写比\
    \ `parse_url` 更复杂的正则表达式，但我并不建议这样做。正则表达式在短而简单时效果最好。只有这样，我们才能确信它们运行正常，并在必要时成功地修改它们。\n\
    \nJavaScript 语言处理器之间具有很高的兼容性。语言中不可移植的部分是正则表达式的实现。非常复杂或复杂的正则表达式可能会有移植性问题。嵌套正则表达式在某些实现中还会遇到性能问题。简单是最好的策略。\n\
    \n让我们看另一个例子：匹配数字的正则表达式。数字可以包含带有可选负号的整数部分、可选的小数部分和一个指数部分：\n\n```javascript\nvar\
    \ parse_number = /-?\\d+(?:\\.\\d+*)?(?:e[+\\-]?\\d*)?/;\n```\n\nvar test = function\
    \ (num) {\n  document.writeln(parse_number.test(num));\n};\n\n```\n\n```\ntest('1');\
    \               // true\ntest('number');         // false\ntest('98.6');     \
    \       // true\ntest('123.21.860');      // false\ntest('123.45E-67');     //\
    \ true\ntest('123.450-67');      // false\n```\n\n让我们拆解 `parse_number`：\n\n```javascript\n\
    /^$/i\n```\n\n我们使用 `^` 和 `$` 来锚定正则表达式。如果我们省略锚点，正则表达式将告诉我们字符串是否包含数字。有了锚点，它告诉我们字符串是否仅包含数字。\n\
    \n- 当你把它们全部挤在一起时，视觉上很混乱：`^(?:([A-Za-z]+)?(?:/(0,3))?([0-9.\\-A-Za-z]+)?(?::(\\\
    d+))?(?:/([^#]*)?)?::(#]*)?(?::.*))$/\n\n### parse_number\n\n![](img/03300178c40ed5b3e760309f69ee3125_85_0.png)\n\
    \n*i* 标志导致在匹配字母时忽略大小写。模式中唯一的字母是 `e`。我们希望 `e` 也能匹配 `E`。我们可以将 `e` 部分写为 `[Ee]` 或\
    \ `(?:E|e)`，但我们不需要，因为我们使用了 *i* 标志：\n\n-?\n\n负号上的 `?` 后缀表示负号是可选的：\n\n\\d 等同于 `[0-9]`。它匹配一个数字。`+`\
    \ 后缀导致它匹配一个或多个数字：\n\n(?|\\d*)\n\n`(?:...)` 表示一个可选的非捕获组。通常使用非捕获组比不漂亮的捕获组更好，因为捕获会有性能开销。该组将匹配小数后的零或多个数字：\n\
    \n(?:e[+\\-]?\\d*)\n\n这是另一个可选的非捕获组。它匹配 `e`（或 `E`）、可选的符号以及更多的数字。\n\n## 构造\n\n有两种方法可以创建\
    \ `RegExp` 对象。正如示例所示，首选方法是使用正则表达式字面量。\n\n![](img/03300178c40ed5b3e760309f69ee3125_85_1.png)\n"
