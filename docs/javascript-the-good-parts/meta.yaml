    \ look more closely at the elements that make up regular expressions.\n\n# # Regexp\
    \ Choice\n\n![](img/03300178c40ed5b3e760309f69ee3125_87_0.png)\n\nA regexp choice\
    \ contains one or more regexp sequences. The sequences are separated by the |\
    \ (vertical bar) character. The choice matches if any of the sequences match.\
    \ It attempts to match each of the sequences in order. So:\n\n\"into\".match(/in/int/)\n\
    matches in the line into. It wouldn't match int because the match of in was successful.\n\
    \n# # Regexp Sequence\n\n![](img/03300178c40ed5b3e760309f69ee3125_87_1.png)\n\n\
    A regexp sequence contains one or more regexp factors. Each factor can optionally\
    \ be followed by a quantifier that determines how many times the factor is allowed\
    \ to appear. If there is no quantifier, then the factor will be matched one time."
