    \ is confused about the difference between arrays and objects.\nThe typeof operator\
    \ reports that the type of an array is 'object', which isn't very helpful.\n\n\
    JavaScript does not have a good mechanism for distinguishing between arrays and\
    \ objects. We can work around that deficiency by defining our own is_array function:\n\
    \n```javascript\nvar is_array = function (value) {\n  return value &&\n    typeof\
    \ value === 'object' &&\n    value.constructor === Array;\n}\n```\n\nUnfortunately,\
    \ it fails to identify arrays that were constructed in a different window or frame.\
    \ If we want to accurately detect those foreign arrays, we have to work a little\
    \ harder:\n\n```javascript\nvar is_array = function (value) {\n  return value\
    \ &&\n    typeof value === 'object' &&\n    typeof value.length === 'number' &&\n\
    \    typeof value.splice === 'function' &&\n    ! (value.propertyIsEnumerable('length'));\n\
    }\n```\n\nFirst, ask if the value is truthy. We do this to reject null and false\
    \ values.\nSecond, ask if the typeof is 'object'. This will be true for objects,\
    \ arrays, and (weirdly) null. Third, ask if the value has a length property that\
    \ is a number. This will always be true for arrays, but usually not for objects.\
    \ Fourth, ask if the value contains a splice method. This will again be true for\
    \ all arrays. Finally, we ask if the property is enumerable (will length be produced\
    \ by a for loop)? That will be false for all arrays. This is the most reliable\
    \ test for arrays that I have found. It is unfortunately that it is so complicated.\n\
    \nHaving such a test, it is possible to write functions that do one thing when\
    \ passed single value and lots of things when passed an array of values.\n\n##\
    \ Methods\n\nJavaScript provides a set of methods for acting on arrays. The methods\
    \ are functions stored in Array.prototype. In Chapter 3, we saw that Object.prototype\
    \ can be augmented. Array.prototype can be augmented well.\n\nFor example, suppose\
    \ we want to add an array method that will allow us to do computation on an array:\n\
    \n```javascript\nArray.prototype.reduce = function (f, value) {\n  var i;\n  for\
    \ (i = 0; i < this.length; i += 1) {\n    value = f(this[i], value);\n  }\n  return\
    \ value;\n}\n```\n\nBy adding a function to Array.prototype, every array inherits\
    \ the method. In this case, we defined a method that takes a function and a starting\
    \ value. For each element of the array, it calls the function with an element\
    \ and the value, computes a new value. When it is finished, it returns the value.\
    \ If we pass in a function that adds two numbers, it computes the sum. If we pass\
    \ in a function that multiplies two numbers, it computes the product:\n\n```javascript\n\
    // Create an array of numbers.\n\nvar data = [4, 8, 15, 16, 23, 42];\n\n// Define\
    \ two simple functions. One will add two\n// The other will multiply two numbers.\n\
    \nvar add = function (a, b) {\n  return a + b;\n};\n\nvar mult = function (a,\
    \ b) {\n  return a * b;\n}\n```\n\n```javascript\n// Invoke the data's reduce\
    \ method, passing in the\n// add function.\n\nvar sum = data.reduce(add, 0); //\
    \ sum is 108\n```\n\n```javascript\n// Invoke the reduce method again, this time\
    \ passing\n// in the multiply function.\n\nvar product = data.reduce(mult, 1);\
    \ // product is 7418880\n```\n\nBecause an array is really an object, we can add\
    \ methods directly to an individual array:\n\n```javascript\n// Give the data\
    \ array a total function.\n\ndata.total = function () {\n  return this.reduce(add,\
    \ 0);\n}\n\nvar total = data.total(); // total is 108\n```\n\nSince the string\
    \ 'total' is not an integer, adding a total property to an array does not change\
    \ its length. Arrays are most useful when the property names are integers, but\
    \ they are still objects, and objects can accept any string as a property name.\n\
    \nIt is not useful to use the Object.create method from Chapter 3 on arrays because\
    \ it produces not an object. The object produced will inherit the array's values\
    \ and methods, but it will not have the special property.\n\n## Dimensions\n\n\
    JavaScript arrays usually are not initialized. If you ask for a new array with\
    \ [], it will be empty. If you are accessing an element, you will get the undefined\
    \ value. If you are aware of that, if you naturally set every element before you\
    \ attempt to retrieve it, then all is well. If you are implementing algorithms\
    \ that assume every element starts with a known value (such as 0), you must prep\
    \ the array yourself. JavaScript should have provided some form of an Array.dim\
    \ method to do this, but we can easily correct this oversight:\n\n```javascript\n\
    Array.dim = function (dimension, initial) {\n  var a = [], i;\n  for (i = 0; i\
    \ < dimension; i += 1) {\n    a[i] = initial;\n  }\n  return a;\n}\n\n// Make\
    \ an array containing 10 zeros.\n\n```javascript\nvar myArray = Array.dim(10,\
    \ 0);\n```\n\nJavaScript does not have arrays of more than one dimension, but\
    \ like most C languages, it can have arrays of arrays:\n\n```javascript\nvar matrix\
    \ = [\n  [0, 1, 2],\n  [3, 4, 5],\n  [6, 7, 8]\n];\nmatrix[2][1] // 7\n```\n\n\
    To make a two-dimensional array or an array of arrays, you must build the arrays\
    \ yourself:\n\n```javascript\nfor (i = 0; i < n; i += 1) {\n    my_array[i] =\
    \ [];\n}\n```\n\n// Note: Array.dim(n, []) will not work here.\n// Each element\
    \ would get a reference to the same\n// array, which would be very bad.\n\nThe\
    \ cells of an empty matrix will initially have the value undefined. If you want\
    \ them to have a different value, you must explicitly set them. Again, JavaScript\
