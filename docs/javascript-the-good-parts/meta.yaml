    \  '3': 'three', '4': 'four', '5': 'five',\n  '6': 'six', '7': 'seven', '8': 'eight',\n\
    \  '9': 'nine'\n};\n```\n\nproduces a similar result. Both numbers and number_object\
    \ are objects containing 10 properties, and those properties have exactly the\
    \ same names and values. But there are also significant differences. number inherits\
    \ from Array.prototype, whereas number_object inherits from Object.prototype,\
    \ so numbers inherits a larger set of useful methods. Also, numbers gets the generic\
