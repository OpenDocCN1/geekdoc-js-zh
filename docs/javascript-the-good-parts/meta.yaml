    group copies the text it matches and places it in the result array. Each capturing
    group is given a number. This first capturing group is 1, so a copy of the text
    matched by this capturing group will appear in result[1]. The [...] indicates
    a character class. This character class, A-Za-z, contains 26 uppercase letters
    and 26 lowercase letters. The hyphens indicate ranges, from A to Z. The suffix
    + indicates that the character class will be matched one or more times. The group
    is followed by the : character, which will be matched literally:


