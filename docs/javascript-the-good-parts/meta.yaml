    \n由于一个设计错误，`arguments` 并不是真正的数组。它是一个类对象（array-like object）。`arguments` 拥有 `length`\
    \ 属性，但缺少所有的数组方法。我们将在在本末看到这一设计错误产生。\n\n# 返回 (Return)\n\n当函数被调用时，它从第一条语句开始执行，并在遇到关闭函数体的\
    \ `}` 时结束。这导致函数将控制权交回给调用该函数的程序部分。\n\n`return` 语句可以导致函数提前返回。当执行 `return` 时，函数会立即返回，不再执行剩余的语句。\n\
    \n函数总是会返回一个值。如果没有指定返回值，则返回 `undefined`。\n\n如果调用函数时使用了 `new` 前缀且返回值不是对象，则返回 `this`（即该新对象）。\n\
    \n# 异常 (Exceptions)\n\nJavaScript 提供了异常处理机制。异常是干扰程序正常流程的异常（但并非完全出乎意料）故障。当检测到此类意外状况时，你的程序应该抛出一个异常：\n\
    \n```javascript\nvar add = function (a, b) {\n  if (typeof a != 'number' || typeof\
    \ b != 'number') {\n    throw {\n      name: 'TypeError',\n      message: 'add\
    \ needs numbers'\n    };\n  }\n  return a + b;\n}\n```\n\n`throw` 语句会中断函数的执行。它应该接收一个异常对象，该对象包含一个标识异常类型的\
    \ `name` 属性和一个描述性的 `message` 属性。你也可以添加其他属性。\n\n异常对象将被传递给 `try` 语句的 `catch` 语句：\n\
    \n```javascript\n// 创建一个 try_it 函数，错误地调用新的 add\n// 函数。\n\nvar try_it = function\
    \ () {\n  try {\n    add(\"seven\");\n  } catch (e) {\n    document.writeln(e.name\
    \ + ': ' + e.message);\n  }\n};\n\ntry_it();\n```\n\n如果在 `try` 块内抛出异常，控制将转移到它的\
    \ `catch` 语句。\n\n`try` 语句有一个 `catch` 块可以捕获所有异常。如果你的处理取决于异常的类型，那么异常处理器将必须检查 `name`\
    \ 来确定异常的类型。\n\n# 扩展类型 (Augmenting Types)\n\nJavaScript 允许对语言的基本类型进行扩展。在第 3 章中，我们看到向\
    \ `Object.prototype` 添加方法可以让该方法对所有对象可用。这对于函数、数组、字符串、正则表达式和布尔值也是如此。\n\n例如，通过扩展\
    \ `Function.prototype`，我们可以让所有函数拥有一个方法：\n\n```javascript\nFunction.prototype.method\
    \ = function (name, func) {\n  this.prototype[name] = func;\n  return this;\n\
    };\n```\n\n通过在 `Function.prototype` 上扩展一个方法名，我们再也不需要输入原型属性的名称。那部分丑陋的代码现在可以隐藏起来。\n\
    \nJavaScript 没有单独的整数类型，因此有时需要提取数字的整数部分。JavaScript 提供的实现此功能的方法很难。我们可以通过向 `Number.prototype`\
    \ 添加一个整数方法来修复它。它根据数字的正负使用 `Math.ceil` 或 `Math.floor`：\n\n```javascript\nNumber.prototype.integer\
    \ = function () {\n  return Math[this < 0 ? 'ceil' : 'floor'](this);\n};\n```\n\
    \n```javascript\ndocument.writeln((-10/3).integer()); // -3\n```\n\nJavaScript\
    \ 缺少一个移除字符串端空格的方法。这是一个容易修复的疏忽：\n\n```javascript\nString.prototype.trim = function\
    \ () {\n  return this.replace(/^\\s+|\\s+$/g, '');\n};\n```\n\n```javascript\n\
    document.writeln(\" \" + \"  neat  \".trim() + \" \");\n```\n\n我们的方法使用了正则表达式。我们将在第\
    \ 7 章中学习更多关于正则表达式。\n\n通过扩展基本类型，我们可以显著提高语言的表达能力。由于 JavaScript 的动态性质，可以在运行时添加方法。我们看到了缓解此问题的方法：使用\
    \ `hasOwnProperty` 来过滤隐藏属性：\n\n```javascript\nObject.prototype.method = function\
    \ (name) {\n  if (!this[name]) {\n    this[name] = arguments[1];\n  }\n};\n```\n\
    \n# 递归函数 (Recursion function)\n\n递归函数是直接或间接调用自身的函数。递归是一种强大的编程技术，其中问题被划分为子问题，每个子问题通过简单的解决方案解决。通常，递归函数通过调用自己来解决其子问题。\n\
    \n汉诺塔是一个著名的谜。设备包括三个柱子和一组直径不同的盘子。初始设置是将所有盘放在源柱子上。目标是通过每次移动一个盘子将栈移动到目标位置，且不将大盘放在小盘子上。这有一个递归解决方案：\n\
    \n```javascript\nvar hanoi = function (disc, src, aux, dst) {\n  if (disc > 0)\
