- md: "\n# with Statement\n\nThe with statement was intended to provide a shorthand\
    \ in accessing members in deeply nested objects. Unfortunately, it behaves very\
    \ badly when setting new members. Never use the with statement. Use a var instead.\n\
    \nJSLint does not expect to see a with statement.\n\n=\n\nJSLint does not expect\
    \ to see an assignment statement in the condition part of an or while statement.\
    \ This is because it is more likely that:\n\n```javascript\nif (a = b) {\n  ...\n\
    }\n```\n\nwas intended to be:\n\n```javascript\nif (a == b) {\n  ...\n}\n```\n\
    \nIf you really intend an assignment, wrap it in another set of parentheses:\n\
    \n```javascript\nif ((a = b)) {\n  ...\n}\n```\n\n# == and !=!\n\nThe == and !=\
    \ operators do type coercion before comparing. This is bad because it causes '\\\
    f\\rn\\t' == 0 to be true. It can mask type errors.\n\nWhen comparing to any of\
    \ the following values, always use the === or !== operators, which do not do coercion:\n\
    \n```\n0 '' undefined null false true\n```\n\nIf you want the, use the short form.\
    \ Instead of:\n\n```javascript\n(foo != 0)\n```\n\njust say:\n\n```javascript\n\
    (foo)\n```\n\nAnd instead of:\n\n```javascript\n(foo == 0)\n```\n\nsay:\n\n```javascript\n\
    (!foo)\n```\n\nUse of the === and !== operators is always preferred. There is\
    \ a “Disallow == and !==” (eqeqeq) option, which requires the use of === and !==\
    \ in all cases.\n\n# Labels\n\nJavaScript allows any statement to have a label,\
    \ and labels have a separate namespace. JSLint is stricter.\n\nJSLint expects\
    \ labels only on statements that interact with break: switch, while, do, and for.\
    \ JSLint expects labels to be distinct from variables and parameters.\n\n# Unreachable\n\
    \nJSLint expects a return, break, continue, or throw statement will be followed\
    \ by a } case or default.\n\n# Confusing Pluses and Minuses\n\nJSLint expects\
    \ that + will not be followed by + or ++, and that - will not be followed by -\
    \ or --. A misplaced space can turn + into ++, an error that is difficult to see.\
    \ Use parentheses to avoid confusion.\n\n# ++ and --\n\nThe ++ (increment) and\
    \ -- (decrement) operators have been known to contribute to bad code causing excessive\
    \ trickiness. They are second only to faulty architecture in enabling viruses\
    \ and other security menaces. The JSLint option plus prohibits the use of these\
    \ operators.\n\n# Bitwise Operators\n\nJavaScript does not have an integer type,\
    \ but it does have bitwise operators. The bitwise operators convert their operands\
    \ from floating-point to integers and back, so they are not efficient as they\
    \ are in C or other languages. They are rarely useful in browser applications.\
    \ The similarity to the logical operators can mask some programming errors. The\
    \ bitwise option prohibits the use of these operators.\n\n# eval Is Evil\n\nThe\
    \ eval function and its relatives (Function, setTimeout, and setInterval) provide\
    \ access to the JavaScript compiler. This is sometimes useful, but in most cases\
    \ it indicates the presence of extremely bad coding. The eval function is the\
    \ most misused feature of JavaScript.\n\n# void\n\nIn most C-like languages, void\
    \ is a type. In JavaScript, void is a prefix operator that always returns undefined.\
    \ JSLint does not expect to see void because it is confusing and not very useful.\n\
    \n# Regular Expressions\n\nRegular expressions are written in a terse and cryptic\
    \ notation. JSLint looks for problems that may cause portability problems. It\
    \ also attempts to resolve visual ambiguities by recommending explicit escapement.\n\
    \nJavaScript's syntax for regular expression literals overloads the / character.\
    \ To avoid ambiguity, JSLint expects that the character preceding a regular expression\
    \ literal is a ( or = : or , character).\n\n# Constructors and new\n\nConstructors\
    \ are functions that are designed to be used with the new prefix. The new prefix\
    \ creates a new object based on the function's prototype, and binds that to the\
    \ function's implied this parameter. If you neglect to use the new prefix, no\
    \ new object will be made, and this will be bound to the global object. This is\
    \ a serious mistake.\n\nJSLint enforces the convention that constructor functions\
    \ be given names with initial uppercase letters. JSLint does not expect to see\
    \ a function invocation with an initial uppercase name unless it has the new prefix.\
    \ JSLint does not expect to see the new prefix used with functions whose names\
    \ do not start with initial uppercase.\n\nJSLint does not expect to see new Number,\
    \ new String, or new Boolean.\n\nJSLint does not expect to see new Object (use\
    \ {}) instead).\n\nJSLint does not expect to see new Array (use []) instead).\n\
    \n# Not Looked For\n\nJSLint does not flow analysis to determine that variables\
    \ are assigned values before they are used. This is because variables are given\
    \ a value (undefined) that is a reasonable default for many applications.\n\n\
    JSLint does not do any kind of global analysis. It does not attempt to determine\
    \ that functions used with new are really constructors (except by enforcing capitalization\
    \ conventions), or that method names are spelled correctly.\n\n# HTML\n\nJSLint\
    \ is able to handle HTML text. It can inspect the JavaScript content contained\
    \ within <script></script> tags and event handlers. It also inspects the HTML\
    \ content, looking for problems that are known to interfere with JavaScript:\n\
    \n- All tag names must be in lowercase.\n- All tags that can take a close tag\
    \ (such as </p>) must have a close tag.\n- All tags are correctly nested.\n- The\
    \ entity &lt; must be used for literal <.\n\nJSLint is less the syophantic conformity\
    \ demanded by XHTML, but more strict than the popular browsers.\n\nJSLint also\
    \ checks for the occurrence of </ in string literals. You should always write\
    \ < instead. The extra backslash is ignored by the JavaScript compiler, but not\
    \ by the HTML parser. Tricks like this should not be necessary, and yet they are.\n\
    \nThere is an option that allows use of uppercase tag names. There is also an\
    \ option that allows the use of inline HTML event handlers.\n\n# JSON\n\nJSLint\
    \ can also check that JSON data structures are well formed. If the first character\
    \ is { or [, then it strictly enforces the JSON rules. See Appendix E.\n\n# Report\n\
    \nIf JSLint is able to complete its scan, it generates a function report. It lists\
    \ the following for each function:\n\n- The line number on which it starts.\n\
    - Its name. In the case of anonymous functions, JSLint will “guess” the name.\n\
    - The parameters.\n- Closure: the variables and parameters that are declared in\
    \ the function that are used by its inner functions.\n- Variables: the variables\
    \ declared in the function are used only by the function.\n- Unused: the variables\
    \ that are declared in the function that are not used. This may be an indicator\
    \ of an error.\n- Outer: variables used by this function that are declared in\
    \ another function.\n- Global: global variables that are used by this function.\n\
    - Label: statement labels that are used by this function.\n\nThe report will also\
    \ include a list of all the member names that were used.\n\n# APPENDIX D\nSyntax\
    \ Diagrams\n\n> Thou map of woe, that thus dost talk in signs!\n—William Shakespeare,\
    \ The Tragedy of Titus Andronicus\n\n![](img/03300178c40ed5b3e760309f69ee3125_140_0.png)\n\
    ![](img/03300178c40ed5b3e760309f69ee3125_140_1.png)\n![](img/03300178c40ed5b3e760309f69ee3125_140_2.png)\n\
    ![](img/03300178c40ed5b3e760309f69ee3125_140_3.png)\n\ndisruptive statement\n\n\
    ![](img/03300178c40ed5b3e760309f69ee3125_141_0.png)\ndo statement\n\n![](img/03300178c40ed5b3e760309f69ee3125_141_1.png)\n\
    escaped character\n\n![](img/03300178c40ed5b3e760309f69ee3125_141_2.png)\nexponent\n\
    \n![](img/03300178c40ed5b3e760309f69ee3125_141_3.png)\n\n126 | Appendix D: Syntax\
    \ Diagrams\n\n![](img/03300178c40ed5b3e760309f69ee3125_142_0.png)\n\n![](img/03300178c40ed5b3e760309f69ee3125_143_0.png)\n\
    ![](img/03300178c40ed5b3e760309f69ee3125_143_1.png)\n![](img/03300178c40ed5b3e760309f69ee3125_143_2.png)\n\
    ![](img/03300178c40ed5b3e760309f69ee3125_143_3.png)\n\n# infix operator\n\n![](img/03300178c40ed5b3e760309f69ee3125_144_0.png)\n\
    \n# integer\n\n![](img/03300178c40ed5b3e760309f69ee3125_144_1.png)\n\n# invocation\n\
