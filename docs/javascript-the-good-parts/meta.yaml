- md: "\nFeatures have a documentation cost. Every feature adds pages to the manual,\
    \ increasing training costs. Features that offer value to a minority of users\
    \ impose a cost on all users. So, in designing products and programming languages,\
    \ we want to get the core features—the good parts—right because that is where\
    \ we create most of the value.\n\nWe all find the good parts in the products that\
    \ we use. We value simplicity, and when simplicity isn't offered to us, we make\
    \ it ourselves. My microwave oven has tons of features, but the only ones I use\
    \ are cook and the clock. And setting the clock is a struggle. We cope with the\
    \ complexity of feature-driven design by finding and sticking with the good parts.\n\
    \nIt would be nice if products and programming languages were designed to have\
    \ only good parts.\n\n# APPENDIX A\n\n## Awful Parts\n\n> That will prove awful\
    \ both in deed and word.\n——William Shakespeare, Pericles, Prince of Tyre\n\n\
    In this chapter, I present the problematic features of JavaScript that are not\
    \ easily avoided. You must be aware of these things and be prepared to cope.\n\
    \n## Global Variables\n\nThe worst of JavaScript's bad features is its dependence\
    \ on global variables. A global variable is a variable that is visible in every\
    \ scope. Global variables can be a convenience in very small programs, but they\
    \ quickly become unwieldy as programs get larger. Because a global variable can\
    \ be changed by any part of the program at any time, they can significantly complicate\
    \ the behavior of the program. Use of global variables degrades the reliability\
    \ of the programs that use them.\n\nGlobal variables make it harder to run independent\
    \ subprograms in the same program. If the subprograms happen to have global variables\
    \ that share the same names, then they will interfere with each other and likely\
    \ fail, usually difficult to diagnose ways.\n\nLots of languages have global variables.\
    \ For example, Java's static members are global variables. The problem with JavaScript\
    \ isn't just that it allows them, it requires them. JavaScript does not have a\
    \ linker. All compilation units are loaded into a common global object.\n\nThere\
    \ are three ways to define global variables. The first is to place a var statement\
    \ outside of any function:\n\n```\nvar foo = value;\n```\n\nThe second is to add\
    \ a property directly to the global object. The global object is the container\
    \ of all global variables. In web browsers, the global object goes by the name\
    \ window.\n\n```javascript\nwindow.foo = value;\n```\n\nThe third is to use a\
    \ variable without declaring it. This is called implied global:\n\n```javascript\n\
    foo = value;\n```\n\nThis was intended as a convenience to beginners by making\
    \ it unnecessary to declare variables before using them. Unfortunately, forgetting\
    \ to declare a variable is a very common mistake. JavaScript’s policy of making\
    \ forgotten variables global creates bugs that can be very difficult to find.\n\
    \n# Scope\n\nJavaScript’s syntax comes from C. In all other C-like languages,\
    \ a block (a set of statements wrapped in curly braces) creates a scope. Variables\
    \ declared in a block are not visible outside of the block. JavaScript uses the\
    \ block syntax, but does not provide block scope: a variable declared in a block\
    \ is everywhere in the function containing the block. This can be surprising to\
    \ programmers with experience in other languages.\n\nIn most languages, it is\
    \ generally best to declare variables at the site of first use. That turns out\
    \ to be a bad practice in JavaScript because it does not have block scope. It\
    \ is better to declare all variables at the top of each function.\n\n# Semicolon\
    \ Insertion\n\nJavaScript has a mechanism that tries to correct faulty programs\
    \ by automatically inserting semicolons. Do not depend on this. It can mask more\
    \ serious errors.\n\nIt sometimes inserts semicolons in places where they are\
    \ not welcome. Consider the consequences of semicolon insertion on the return\
    \ statement. If a return statement returns a value, that value expression must\
    \ begin on the same line as the:\n\n```javascript\nreturn {\n  status: true;\n\
    };\n```\n\nThis appears to return an object containing a status member. Unfortunately,\
    \ semicolon insertion turns it into a statement that returns undefined. There\
    \ is no warning that semicolon insertion caused the misinterpretation of the program.\
    \ The problem can be avoided if the { is placed at the end of the previous line\
    \ and not at the beginning of the next line:\n\n```javascript\nreturn {\n  status:\
    \ true\n};\n```\n\n# Reserved Words\n\nThe following words are reserved in JavaScript:\n\
    \n```\nabstract boolean break byte case catch char class const continue debugger\
    \ default\ndelete delete double else enum extends false finally float for function\
    \ goto\nif implements in instanceof int interface native new null package\nprotected\
    \ public return short static switch switch synchronized this throws\ntransient\
    \ true try typeof var void while with\n```\n\nMost of these words are not used\
    \ in the language.\n\nThey cannot be used to name variables or parameters. When\
    \ reserved words are used keys in object literals, they must be quoted. They can\
    \ be used with t dot notation, so it is sometimes necessary to use the bracket\
    \ instead:\n\n```javascript\nvar method;             // ok\nvar class;       \
    \        // illegal\nobject = {box: value};   // ok\nobject = {case: value}; \
    \ // illegal\nobject = {'case': value}; // ok\nobject.box = value;       // ok\n\
    object.case = value;     // illegal\nobject['case'] = value;  // ok\n```\n\n#\
    \ Unicode\n\nJavaScript was designed at a time when Unicode was expected to have\
    \ at most 65,536 characters. It has grown to have a capacity of more than 1 million\
    \ characters.\n\nJavaScript’s characters are 16 bits. That is enough to cover\
    \ the original 65,536 (which is now known as the Basic Multilingual Plane) of\
    \ the remaining million characters can be represented as a pair of characters.\
    \ Unicode considers the pair to be a single character. JavaScript thinks the pair\
    \ to distinct characters.\n\n# typeof\n\nThe typeof operator returns a string\
    \ that identifies the type of its operand. So:\n\n```javascript\ntypeof 98.6\n\
    ```\n\nproduces 'number'. Unfortunately.\n\n```javascript\ntypeof null\n```\n\n\
    returns 'object' instead of 'null'. A bigger problem testing a value for objectness.\
    \ typeof cannot distinguish between null and objects, but you can reason null\
    \ is falsy and all objects are truthy:\n\n```javascript\nif (my_value && typeof\
    \ my_value === 'object') {\n  // my_value is an object or an array\n}\n```\n\n\
    Implementations disagree on the type of regular expression objects. Some implementations\
    \ report that:\n\n```javascript\ntypeof /a/\n```\n\nis 'object', and others say\
