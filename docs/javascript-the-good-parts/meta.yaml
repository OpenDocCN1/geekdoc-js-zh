  md: "$ S represents the end of the string. It assures that there was no extra material\
    \ after the end of the URL.\n\nThose are the factors of the regular expression\
    \ parse_url.\n\nIt is possible to make regular expressions that are more complex\
    \ than parse_url, but I wouldn't recommend it. Regular expressions are best when\
    \ they are short and simple. Only then can we have confidence that they are working\
    \ correctly and that they could be successfully modified if necessary.\n\nThere\
    \ is a very high degree of compatibility between JavaScript language processors.\
    \ The part of the language that least portable is the implementation of regular\
    \ expressions. Regular expressions that are very complicated or convoluted are\
    \ likely to have portability problems. Nested regular expressions can also suffer\
    \ performance problems in some implementations. Simplicity is the best strategy.\n\
    \nLet's look at another example: a regular expression that matches numbers. Numbers\
    \ can have an integer part with an optional minus sign, an optional fractional\
    \ part, and an exponent part:\n\n```\nvar parse_number = /-?\\d+(?:\\.\\d+*)?(?:e[+-]?\\\
    d+)?/;\n\nvar test = function (num) {\n  document.writeln(parse_number.test(num));\n\
    };\n```\n\n```\ntest('1');               // true\ntest('number');         // false\n\
    test('98.6');            // true\ntest('123.21.86.100');  // false\ntest('123.45E-67');\
    \     // true\ntest('123.450-67');      // false\n```\n\nparse_number successfully\
