    frustrates JSLint (see Appendix C), so the tool''s ability to detect problems
    is significantly reduced.


    The eval function also compromises the security of your application because it
    grants too much authority to the eval''d text. And it compromises the performance
    of the language as a whole in the same way that the statement does.


    The Function constructor is another form of eval, and should similarly be avoided.


    The browser provides setTimeout and setInterval functions that can take string
    or function arguments. When given, setTimeout and setInterval act as eval. The
    string argument form should also be avoided.


    # continue Statement


    The continue statement jumps to the top of the loop. I have never seen a piece
    of code that was not improved by refactoring to remove the continue statement.


    # switch Fall Through


    The switch statement was modeled after the FORTRAN IV computed go to statement.
    Each case falls into the next case unless you explicitly disrupt the flow.


    Someone wrote to me once suggesting that JSLint should give a warning when a case
    falls into another case. He pointed out that this is a very common source of errors,
    and it is a difficult error to see in the code. I answered that all was true,
    but that the benefit of compactness obtained by falling through than compensated
    for the chance of error.


    The next day, he reported that there was an error in JSLint. was misidentifying
    an error. I investigated, and it turned out that I had a case that was falling
    through. In that moment, I achieved enlightenment. I no longer use intentional
    fall through. That discipline makes it much easier to find the unintentional faults.


    The worst features of a language are the features that are obviously dangerous
    or useless. Those are easily avoided. The worst features are the attractive nuisances,
    features that are both useful and dangerous.


    # Block-less Statements


    An if or while or do for statement can take a block or a single statement. The
    single statement form is another attractive nuisance. It offers the advantage
    of saving two characters, a dubious advantage. It obscures the program''s structure
    so that subsequent manipulators of the code can easily insert bugs. For example:'
  - '[PAGE 127]


    ```

    if (ok)

    t = true;

    ```


    can become:


    ```

    if (ok)

    t = true;

    advance();

    ```


    which looks like:


    ```

    if (ok)

    t = true;

    advance();

    ```


    but which actually means:


    ```

    if (ok)

    t = true;

    advance();

    ```


    Programs that appear to do one thing but actually do another are much harder to
    get right. A disciplined and consistent use of blocks makes it easier to get right.


    # ++


    The increment and decrement operators make it possible to write in an extremely
    terse style. In languages such as C, they made it possible to write one-liners
    that could do cryptic strings:


    ```

    for (p = src, q = dest; !*p; p++, q++) *q = *p;

    ```


    They also encourage a programming style that, as it turns out, is reckless. Most
    of the buffer overrun bugs that created terrible security vulnerabilities due
    to code like this.


    In my own practice, I observed that when I used ++ and --, my code tended to be
    too tight, too cryptic, too cryptic. So, as a matter of discipline, I don''t use
    them anymore. I think that as a result, my coding style has become cleaner.


    # Bitwise Operators


    JavaScript has the same set of bitwise operators as Java:


    ```

    and

    |

    xor

    ~

    ot

    >> signed right shift

    >>> unsigned right shift

    << left shift

    ```'
  - '[PAGE 128]


    In Java, the bitwise operators work with integers. JavaScript doesn''t have integers.
    It only has double precision floating-point numbers. So, the bitwise operators
    convert their number operands into integers, by their business, and they convert
    them back. In most languages, these operators are very close to the hardware and
    very fast. In JavaScript, they are very far from the hardware and very slow. JavaScript
    is rarely used for doing bit manipulation.


    As a result, in JavaScript programs, it is more likely that & is a mistyped &&
    operator. The presence of the bitwise operators reduces some of the language''s
    redundancy, making it easier for bugs to hide.


    # The function Statement Versus the function Expression


    JavaScript has a function statement as well as a function expression. This is
    confusing because they can look exactly the same. A function statement is shorthand
    for a var statement with a function value.


    The statement:


    ```

    function foo() {}

    ```


    means about the same thing as:


    ```

    var foo = function() {};

    ```


    Throughout this book, I have been using the second form because it makes clear
    that foo is a variable containing a function value. To use the language well,
    it is important to understand that functions are values.


    function statements are subject to hoisting. This means regardless of where a
    function is placed, it is moved to the top of the scope in which it is defined.
    This relaxes the requirement that functions should be declared before used, which
    I think leads to slipperiness. It also prohibits the use of function statements
    in if statements. It turns out that most browsers allow function statements in
    if statements, but they vary in how that are interpreted. That creates portability
    problems.


    The first thing in a statement cannot be a function expression because the official
    grammar assumes that a statement that starts with the word function is a function
    statement. The hangout is to wrap the function expression in parentheses:


    ```

    function () {\ var hidden_variable;


    // This function can have some impact on

    // the environment, but introduces no new

    // global variables.

    }();

    ```'
  - '[PAGE 129]


    # Typed Wrappers


    JavaScript has a set of typed wrappers. For example:

    new Boolean(false)

    roduces an object that has a valueOf method that returns the wrapped value. This
    turns out to be completely unnecessary and occasionally confusing. Don''t use
    Boolean or new Number or new String.

    Also avoid new Object and new Array. Use {} and [] instead.


    # new


    JavaScript''s new operator creates a new object that inherits from the operand''s
    prototype member, and then calls the operand, binding the new object to this.
    This gives the operand (which had better be a constructor function) a chance to
    customize the new object before it is returned to the requester.

    If you forget to use the new operator, you instead get an ordinary function call,
    and this is bound to the global object instead of a new object. That means that
    your function will be clobbering global variables when it attempts to initialize
    the new members. That is a very bad thing. There is no compile-time warning. There
    is no runtime warning.

    By convention, functions that are intended to be used with new should be given
    names with initial capital letters, and names with initial capital letters should
    be used only with constructor functions that take the new prefix. This gives us
    a visual cue that can help spot expensive mistakes that the language itself is
    keen to overlook.

    An better copying strategy is to not use new at all.


    # void


    In many languages, void is a type that has no values. In JavaScript, void is an
    operator that takes an operand and returns undefined. This is not useful, and
    it is very confusing. Avoid void.'
  - '[PAGE 130]


    # APPENDIX C

    JSLint


    > What error drives our eyes and ears amiss?—William Shakespeare, The Comedy of
    Errors


    When C was a young programming language, there were several common programming
    errors that were not caught by the primitive compilers, so an accessory program
    called JSLint was developed that would scan a source file, looking for problems.


    As C matured, the definition of the language was strengthened to eliminate some
    insecurities, and critics got better at issuing warnings. JSLint is no longer
    needed.


    JavaScript is a young-for-its language. It was originally intended to do small
    tasks in web pages, tasks for which Java was too heavy and clumsy. But JavaScript
    is a very capable language, and it is now being used in larger projects. Many
    of the features that were intended to make the language easy to use are troublesome
    for larger projects. JSLint for JavaScript is needed: JSLint syntax syntax checker
    and verifier.


    JSLint is a code quality tool for JavaScript. It takes a source text and scans
    it. If it finds a problem, it returns a message describing the problem and an
    approximate location within the source. The problem is not necessarily a syntax
    error, although it is often. JSLint looks at some style conventions as well as
    structural problems. It does not prove that your program is correct. It just provides
    another set of eyes to help spot problems.


    JSLint defines a professional subset of JavaScript, a stricter language than that
    defined by the third edition of the ECMAScript Language Specification. The subset
    is closely related to the style recommendations from Chapter 9.


    JavaScript is a sloppy language, but inside it there is an elegant, better language.
    JSLint helps you to program in that better language and to avoid most of the slop.


    JSLint can be found at http://www.JSLint.com/.'
