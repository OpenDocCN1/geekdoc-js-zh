- md: "\n# Object Specifiers\n\nIt sometimes happens that a constructor is given a\
    \ very large number of parameters. This can be troublesome because it can be very\
    \ difficult to remember the order of the arguments. In such cases, it can be much\
    \ friendlier if we write the constructor to accept a single object specifier instead.\
    \ That object contains the specification of the object to be constructed. So,\
    \ instead of:\n\n```\nvar myObject = maker(f, 1, m, c, s);\n```\n\nwe can write:\n\
    \n```\nvar myObject = maker({\n  first: f,\n  last: 1,\n  state: s,\n  city: c\n\
    });\n```\n\nThe arguments can now be listed in any order, arguments can be left\
    \ out if the constructor is smart about defaults, and the code is much easier\
    \ to read.\n\nThis can have a secondary benefit when working with JSON (see Appendix\
    \ E). JSON text can only describe data, but sometimes the data represents an object,\
    \ and it would be useful to associate the data with its methods. This can be done\
    \ trivially if the constructor takes an object specifier because we can simply\
    \ pass the JSON object to the constructor and it will return a fully constituted\
    \ object.\n\n# Prototype\n\nIn a purely prototypal pattern, we dispense with classes.\
    \ We focus instead on the objects. Prototype inheritance is conceptually simpler\
    \ than classical inheritance: a new object can inherit the properties of an old\
    \ object. This is perhaps unfamiliar, but it is really easy to understand. You\
    \ start by making a useful object. You can make many more objects that are like\
    \ that. The classification process of breaking an application down into a set\
    \ of nested abstract classes can be completely avoided.\n\nLet's start by using\
    \ an object literal to make a useful object:\n\n```\nvar myMamm = {\n  name :\
    \ 'Herb the Mammal',\n  get_name : function () {\n    return this.name;\n  },\n\
    \  says : function () {\n    return this.saying || '';\n  }\n};\n```\n\nOnce we\
    \ have an object that we like, we can make more instances with the Object.method\
    \ from Chapter 3. We can then customize the new instances:\n\n```\nvar myCat =\
    \ Object.create(myMammal);\nmyCat.name = 'Henrietta';\nmyCat.saying = 'meow'\n\
    myCat.purr = function (n) {\n  var s = '';\n  for (i = 0; i < n; i += 1) {\n \
    \   if (s) {\n      s += 'r';\n    }\n  }\n  return s;\n};\nmyCat.get_name = function\
    \ () {\n  return this.says(s) + ' ' + this.name + ' ' + this.says(s);\n};\n```\n\
    \nThis is differential inheritance. By customizing a new object, we specify the\
    \ differences from the object on which it is based.\n\nSometimes it is useful\
    \ for data structures to inherit from other data structures. Here is an example:\
    \ Suppose we are parsing a language like JavaScript or TeX in which a pair of\
    \ curly braces indicates a scope. Items defined in a scope are not visible outside\
    \ of the scope. In a sense, an inner scope inherits from its outer scope. JavaScript\
    \ objects are very good at representing this relationship. The block function\
    \ is called when a left brace is encountered. The parse function will look up\
    \ symbols from scope, and augment scope when it defines new symbols:\n\n```\n\
    var block = function () {\n// Remember the current scope. Make a new scope that\n\
    // includes everything from the current one.\n\nvar oldScope = scope;\nscope =\
    \ Object.create(scope);\n\n// Advance past the left curly brace.\n\nadvance('(');\n\
    \n// Parse using the new scope.\n\nparse(scope);\n\n// Advance past the right\
    \ curly brace and discard the\n// new scope, restoring the old one.\n\nadvance}');\n\
    scope = oldScope;\n};\n```\n\n# Functional\n\nOne weakness of the inheritance\
    \ patterns we have seen so far is that we get no privacy. All properties of an\
    \ object are visible. We get no private variables and no private methods. Sometimes\
    \ that doesn't matter, but sometimes it matters a lot. In frustration, some unformed\
    \ programmers have adopted a pattern of pretend privacy. If they have a property\
    \ that they wish to make private, give it an odd-looking name, with the hope that\
    \ other users of the code will pretend that they cannot see the odd looking members.\
    \ Fortunately, we have a much better alternative in an application of the module\
    \ pattern.\n\nWe start by making a function that will produce objects. We will\
    \ give it a name that starts with a lowercase letter because it will not require\
    \ the use of the new prefix. The function contains four steps:\n\n- 1. It creates\
    \ a new object. There are lots of ways to make an object. It can make an object\
    \ literal, or it can call a constructor function with the new prefix, or it can\
    \ use the Object.create method to make a new instance from an existing object,\
    \ or it can call any function that returns an object.\n\n- 2. It optimally defines\
    \ private instance variables and methods. These are ordinary variables of the\
    \ function.\n\n- 3. It augments new object with the vars. These methods will have\
    \ privileged access to the parameters and the vars defined in the second step.\n\
    \n- 4. It returns that new object.\n\nHere is a pseudocode template for a functional\
    \ constructor (boldface text added for emphasis):\n\n```\nvar constructor = function\
    \ (spec, my) {\n    var that, other private instance variables;\n    my = my ||\
    \ {};\n\n    Add variables and functions to my\n\n    that = a new object;\n\n\
    \    Add privileged methods to that\n\n    return that;\n}\n```\n\nThe spec object\
    \ contains all of the information that the constructor needs to make an instance.\
    \ The contents of the spec can be copied into private variables or transformed\
    \ by other functions. The methods can access information from spec as they need\
    \ it. (A simplification is to replace spec with a single value. This is useful\
    \ when the object being constructed does not need a whole spec object.)\n\nThe\
    \ object is a container of secrets that are shared by the constructors in the\
    \ inheritance chain. The use of the object is optional. If a object is not passed\
    \ in, then my object is made.\n\nNext, declare the private instance variables\
    \ and private methods for the object. This is done by declaring private variables.\
    \ The variables and inner functions of the constructor become private members\
    \ of the instance. The inner functions have access to spec and my by that and\
    \ the private variables.\n\nNext, add the secrets to the object. This is done\
    \ by assignment:\n\n```\nmy.member = value;\n```\n\nNow, we make a new object\
    \ and assign it to that. There are lots of ways to make a new object. We can use\
    \ an object literal. We can call a pseudoclassical constructor with the new operator.\
    \ We can use the Object.create method on a prototype object. Or, we can call another\
    \ constructor, passing a spec object (possibly the same spec that was passed to\
    \ this constructor) and the object. The object allows the other constructor to\
    \ share the material that we put into it. The other constructor may also put its\
    \ own shared secrets into my so that our constructor can take advantage of it.\n\
    \nNext, we augment that, adding the privileged methods that make up the object's\
    \ interface. Or, more securely, we can define the functions first as private methods,\
    \ and assign them to that:\n\n```\nvar methodical = function () {\n  ...\n}\n\
    that.methodical = methodical;\n```\n\nThe advantage of defining methodical in\
    \ two steps is that if other methods want to call methodical, they can call methodical()\
    \ instead of that.methodical(). If the instance is damaged or tampered with so\
    \ that that.methodical is replaced, the methods that call methodical will continue\
    \ to work the same because their private methods is not affected by modification\
    \ of the instance.\n\nFinally, we return that.\n\nLet's apply this pattern to\
    \ our mammal example. We don't need my here, so we'll leave it out, but use a\
    \ spec object.\n\nThe name and saying properties are now completely private. They\
    \ are accessible only via the privileged get_name and says methods:\n\n```\nvar\
    \ mammal = function (spec) {\n  var that = {};\n\n  that.get_name = function ()\
    \ {\n    return spec.name;\n  };\n\n  that.says = function () {\n    return spec.saying\
    \ || '';\n  };\n\n  return that;\n};\n```\n\n```\nvar myMammal = mammal({name:\
    \ 'Herb'});\n```\n\nIn the pseudoclassical pattern, the Cat constructor had to\
    \ duplicate work that was done by the Mammal constructor. That isn't the functional\
    \ pattern because the Cat constructor will call the Mammal constructor, letting\
    \ Mammal do most of the work of object creation, so Cat only concern itself with\
    \ the differences:\n\n```\nvar cat = function (spec) {\n  spec.saying = spec.saying\
    \ || 'meow';\n  var that = mammal(spec);\n  that.purr = function (n) {\n    var\
    \ s = '';\n    for (i = 0; i < n; i += 1) {\n      if (s) {\n        s += '-';\n\
    \      }\n      s += 'r';\n    }\n    return s;\n  };\n  that.get_name = function\
    \ () {\n    return that.says(spec) + ' ' + spec.name +\n      ' ' + that.says();\n\
    \  };\n  return that;\n};\n```\n\n```\nvar myCat = cat({name: 'Henrietta'});\n\
    ```\n\nThe functional pattern also gives a way to deal with super methods. We\
    \ will make a superior method that takes a method and returns a function that\
    \ invokes that method. The function will invoke the original method even if the\
    \ property is changed:\n\n```\nObject.method('superior', function (name) {\n \
    \ var that = this;\n  method = that[name];\n  return function () {\n    return\
    \ method.apply(that, arguments);\n  };\n});\n```\n\nLet's try it out on a coolcat\
    \ that is just like cat except except it has a cooler get_name method that calls\
    \ the super. It requires just a bit of preparation. We will declare a super_get_name\
    \ variable and assign it the result of invoking the superior method:\n"
  mdcn: "\n\n# 对象限定符\n\n有时，构造函数会接收非常大量的参数。这可能会带来麻烦，因为非常很难记住参数的顺序。在这种情况下，如果我们编写构造函数来接受单个对象限定符，而不是多个参数，将会要友好得多。该对象包含了要构造对象的规格说明。因此，而不是：\n\
    \n```\nvar myObject = maker(f, 1, m, c, s);\n```\n\n我们可以这样写：\n\n```\nvar myObject\
    \ = maker({\n  first: f,\n  last: 1,\n  state: s,\n  city: c\n});\n```\n\n现在参数可以以任何顺序列出，如果构造函数对默认值处理得很智能，就可以省略某些参数，而且代码更易于读。\n\
    \n在处理 JSON 时，这可以产生次要的好处（见附录 E）。JSON 文本只能描述数据，但有时数据代表一个对象，将数据与其方法关联将非常有用。如果构造函数接受一个对象限定符，就可以很容易地实现这一点，因为我们只需将\
    \ JSON 对象传递给构造函数，它就会返回一个完全构造的对象。\n\n# 原型\n\n在纯的原型模式中，我们放弃了类。我们转而关注对象。原型继承在概念上比经典继承更简单：一个新对象可以继承旧对象的属性。这可能让人感到陌生，但实际上非常容易理解。你从创建一个实用的对象开始。你可以创建许多许多那样的对象。可以完全避免将应用程序分解为一组嵌套抽象类的分类过程。\n\
    \n让我们先从使用对象字面量创建一个实用的对象开始：\n\n```\nvar myMamm = {\n  name : 'Herb the Mammal',\n\
    \  get_name : function () {\n    return this.name;\n  },\n  says : function ()\
    \ {\n    return this.saying || '';\n  }\n};\n```\n\n一旦我们有了喜欢的对象，就可以使用第 3 章中的 `Object.method`\
    \ 创建更多实例。然后我们可以自定义这些新实例：\n\n```\nvar myCat = Object.create(myMammal);\nmyCat.name\
    \ = 'Henrietta';\nmyCat.saying = 'meow'\nmyCat.purr = function (n) {\n  var s\
    \ = '';\n  for (i = 0; i < n; i += 1) {\n    if (s) {\n      s += 'r';\n    }\n\
    \  }\n  return s;\n};\nmyCat.get_name = function () {\n  return this.says(s) +\
    \ ' ' + this.name + ' ' + this.says(s);\n};\n```\n\n这是差异化继承。通过自定义新对象，我们指定了它与所基础对象之间的差异。\n\
    \n有时，数据结构继承其他数据结构是有用的。这里有一个例子：假设我们正在解析像 JavaScript 或 TeX 这样的语言，其中大括号表示一个范围。在范围内定义的项在范围外不可见。在某种意义上，内部范围继承自它的外部范围。JavaScript\
    \ 对象非常擅表示这种关系。当遇到左括号时，调用 `block` 函数。`parse` 函数将从范围查找符号，并在定义新符号时扩展范围：\n\n```\n\
    var block = function () {\n// 记住当前范围。创建一个新的范围，\n// 包含来自当前范围的所有内容。\n\nvar oldScope\
