    \ an alert box will display the ordinal of the node.\n```\n\n```\nvar add_the_handlers\
    \ = function (nodes) {\n  var i;\n  for (i = 0; i < nodes.length; i += 1) {\n\
    \    nodes[i].onclick = function (i) {\n      return function (e) {\n        alert(i);\n\
