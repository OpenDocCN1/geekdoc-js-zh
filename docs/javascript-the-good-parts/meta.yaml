    \ characters that\nshould be escaped in a character class:\n\n- / [\\ ] ^\n\n\
    # Regexp Quantifier\n\nA regexp factor may have a regexp quantifier suffix that\
    \ determines how many times\nt factor should match. A number wrapped in curly\
