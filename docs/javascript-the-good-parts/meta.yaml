- img_proc: true
  md: "The invocation operator is a pair of parentheses that follow any expression\
    \ that produces a function value. The parentheses can contain zero or more expressions,\
    \ separated by commas. Each expression produces one argument value. Each of the\
    \ argument values will be assigned to the function's parameter names. There is\
    \ no runtime error when the number of arguments and the number of parameters do\
    \ not match. If there are too many argument values, the extra argument values\
    \ will be ignored. If there are too few argument values, the undefined value will\
    \ be substituted for the missing values. There is no type checking on the argument\
    \ values: any type of value can be passed to any parameter.\n\n# The Method Invocation\
    \ Pattern\n\nWhen a function is stored as a property of an object, we call it\
    \ a *method*. When a method is invoked, this is bound to that object. If an invocation\
    \ expression contains a refinement (this, is, a ... [script] expression), it is\
    \ invoked as method:\n\n```\n// CreateObject. It has a value and an increment\n\
    // method. The increment method takes an optional\n// parameter. If the argument\
    \ is not a number, then 1\n// is used as the default.\n\nvar myObject = {\n  value:\
