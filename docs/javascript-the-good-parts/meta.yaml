  md: "There is another danger in the interaction between external data and innerHTML.\
    \ A common Ajax pattern is for the server to send an HTML text fragment that gets\
    \ assigned to the innerHTML property of an HTML element. This is a very bad practice.\
    \ If the HTML text contains a <script> tag or its equivalent, an evil script will\
    \ run. This could lead to severe incompetence.\n\nWhat specifically is the danger?\
    \ If an evil script gets to your page, it gets access to all of the state and\
    \ capabilities of the page. It can interact with your server, and your server\
    \ will not be able to distinguish the evil requests from legitimate requests.\
    \ The evil script has access to the global object, which gives it access to all\
    \ of the data in the application except variables hidden in closures. It has access\
    \ to the document object, which gives it access to everything that the user sees.\
    \ It also gives the evil script the capability to dialog with the user. The browser's\
    \ location bar and all of the anti-phishing chrome will tell the user that the\
    \ data should be trusted. The document object also gives the evil script access\
    \ to the network, allowing it to load more evil scripts, or to probe for sites\
    \ within your firewall, or to send the secrets it has learned to any server in\
    \ the world.\n\nThis is a direct consequence of JavaScript's global object, which\
    \ is far and away the worst part of JavaScript's many bad parts. These dangers\
    \ are not caused by Ajax or JSON or XMLHttpRequest or Web 2.0 (whatever that is).\
    \ These dangers have been in the browser since the introduction of JavaScript,\
    \ and will remain until JavaScript is replaced. Be careful.\n\n# A JSON Parser\n\
