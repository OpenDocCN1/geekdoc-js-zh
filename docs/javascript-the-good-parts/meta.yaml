  md: "# CHAPTER 6\n\n# Arrays\n\n> The I'll chase hence, thou wolf in sheep's array.\n\
    —William Shakespeare, The First Part of Henry the Sixth\n\nAn array is a linear\
    \ allocation of memory in which elements are accessed by integers that are used\
    \ to compute offsets. Arrays can be very fast data structures. Unfortunately,\
    \ JavaScript does not have anything like this kind of array.\n\nInstead, JavaScript\
    \ provides an object that has some array-like characteristics. It converts subscripts\
    \ into strings that are used to make properties. It is significantly slower than\
    \ a real array, but it can be more convenient to use. Retrieval and updating properties\
    \ works the same as with objects, except that there is a special trick with integer\
    \ property names. Arrays have their own literal format. Arrays also have a much\
    \ more useful set of built-in methods, described in Chapter 8.\n\n# Array Literals\n\
    \nArray literals provide a very convenient notation for creating new array values.\
    \ An array literal is a pair of square brackets surrounding zero or more values\
    \ separated by commas. An array literal can appear anywhere an expression can\
    \ appear. The first value will get the property name '0', the second value will\
    \ get the property name '1', and so on:\n\n```\nvar empty = [];\nvar numbers =\
    \ [\n  'zero', 'one', 'two', 'three', 'four',\n  'five', 'six', 'seven', 'eight',\
    \ 'nine'\n];\n\nempty[1] // undefined\nnumbers[1] // 'one'\n\nempty.length //\
    \ 0\nnumbers.length // 10\n```"
