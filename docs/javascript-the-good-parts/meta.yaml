- md: "\n## refinement\n\n## regexp choice\n\n## regexp class\n\n## regexp class escape\n\
    \n## regexp literal\n\n## regexp quantifier\n\n## regexp sequence\n\n## return\
    \ statement\n\n## statements\n\n## string literal\n\n## switch statement\n\n##\
    \ throw statement\n\n## var statements\n\n## while statement\n\n## APPENDIX E\n\
    \n## JSON\n\nFarewell; the leisure and the fearful time\nCuts off the ceremonial\
    \ vows of love\nAnd ample interchange of sweet discourse,\nWhich so long sunder'd\
    \ friends should dwell upon:\nGod give us leisure for these rites of love!\nOnce,\
    \ adieu: valiant, and speed of well!\n—William Shakespeare, The Tragedy of Richard\
    \ the Third\n\nJavaScript Object Notation (JSON) is a lightweight data interchange\
    \ format. It is based on JavaScript's object literal notation, one of JavaScript's\
    \ best parts. Even though it is a subset of JavaScript, it is language independent.\
    \ It can be used to exchange data between programs written in all modern programming\
    \ languages. It is a text format, so it is readable by humans and machines. It\
    \ is easy to implement and use. There is a lot of material about JSON at http://www.json.org.\n\
    \n## JSON Syntax\n\nJSON has six kinds of values: objects, arrays, numbers, booleans\
    \ (true and false), and the special value null. Whitespace (spaces, tabs, carriage\
    \ returns, and newline characters) may be inserted before or after any value.\
    \ This can make JSON easier for humans to read. Whitespace may be omitted to reduce\
    \ transmission or storage costs.\n\nAn object is an unordered container of name/value\
    \ pairs. A name can be any string. A value can be any JSON value, including arrays\
    \ and objects. JSON objects can be nested to any depth, but generally most effective\
    \ to keep them flat. Most languages have a feature that maps easily to JSON objects\
    \ such as an object, struct, dictionary, hash table, property, or associative\
    \ array.\n\nThe JSON array is an ordered sequence of values. A value can be any\
    \ JSON value, including arrays and objects. Most languages have a feature that\
    \ maps easily onto JSON arrays such as an array, vector, or list.\n\nA JSON string\
    \ is wrapped in double quotes. The \\ character is used for escaping. JSON allows\
    \ the / character to be escaped so that JSON can be embedded in HTML <script>\
    \ tags. HTML does not allow the sequence </script> except to terminate the <script>\
    \ tag. JSON numbers are like JavaScript numbers. A leading zero is not allowed\
    \ on integers because some languages use it to indicate octal. That kind of radix\
    \ confusion is not desirable in a data interchange format. A number can be an\
    \ integer, real, or scientific. That's it. That is all of JSON. JSON's design\
    \ goals were to be minimal, portable, and a subset of JavaScript. The less we\
    \ need to agree on in order to interoperate, the more easily we can interoperate.\n\
