    # CHAPTER 9


    # # Style


    Here is a silly stately style indeed!

    —William Shakespeare, *The First Part of Henry the Sixth*


    Computer programs are the most complex things that humans make. Programs are made
    up of a huge number of parts, expressed as functions, statements, and expressions
    that are arranged in sequences that must be virtually free of error. The runtime
    behavior has usually expected to be modified over the course of its productive
    life. The process of convert-ing one correct program into a different correct
    program is extremely challenging.


    Good programs have a structure that anticipates—but is not overly burdened by—the
    possible modifications that will be required in the future. Good programs also
    have a clear presentation. If a program is expressed well, then we have the best
    chance of being able to understand it so that it can be successfully modified
    or repaired.


    These concerns are true for all programming languages, and are especially true
    for JavaScript. JavaScript’s loose typing and excessive error tolerance provide
    little compile-time assurance of our programs’ quality, so to compensate, we should
    code with strict discipline.


    JavaScript contains a large set of weak or problematic features that can undermine
    our attempts to write good programs. We should obviously avoid JavaScript’s worst
    features. Surprisingly, perhaps, we should also avoid the features that are often
    useful but occasionally hazardous. Such features are attractive nuisances, and
    by avoiding- them, a large class of potential errors is avoided.


    The long-term value of software to an organization is in direct proportion to
    the quality of the codebase. Over its lifetime, a program will be handled by many
    pairs of hands and eyes. If a program is able to clearly communicate its structure
    and characteristics, it is less likely to break when it is modified in the never-too-distant
    future.'
- md: "\nJavaScript is often sent directly to the public. It should always be of publication\
    \ quality. Neatness counts. By writing in a clear and consistent style, your programs\
    \ become easier to read.\n\nProgrammers can debate endlessly on what constitutes\
    \ good style. Most programmers are firmly rooted in what they're used to, such\
    \ as the prevailing style that they went to school, or at their first job. Some\
    \ have profitable careers with no sense of style at all. Isn't that say style\
    \ doesn't matter? And even if style doesn't matter, isn't one style good as any\
    \ other?\n\nIt turns out that style matters in programming for the same reason\
    \ that it matters in writing. It matters for better reading.\n\nComputer programs\
    \ are sometimes thought of as a write-only medium, so it matters little how it\
    \ is written as long as it works. But it turns out that the likelihood of a program\
    \ working is significantly enhanced by our ability to read it, which also increases\
    \ the likelihood that it actually works as intended. It is also the nature of\
    \ software to be extensively modified over its productive life. If we can read\
    \ and understand it, then we can modify and improve it.\n\nThroughout this book\
    \ I have used a consistent style. My intention was to make the code examples as\
    \ easy to read as possible. I used whitespace consistently to give you more cues\
    \ about the meaning of my programs.\n\nI indented the contents of blocks and object\
    \ literals four spaces. I placed a space between if and so that the if didn't\
    \ look like a function invocation. In others I make ( (adjacent with the preceding\
    \ symbol). I put spaces around all infix operators except for , and [, which do\
    \ not get spaces because they have higher precedence. I use a space after every\
    \ comma and colon.\n\nI put at most one statement on a line. Multiple statements\
    \ on a line can be misleading. If a statement doesn't fit on a line, I will break\
    \ it after a comma or a binary operator. That gives more protection against copy/paste\
    \ errors that are masked by semicolon insertion. (The tragedy of semicolon insertion\
    \ will be revealed in Appendix A.) I indent the remainder of the statement an\
    \ extra four spaces, or eight spaces if four is the condition part of an if statement.\n\
    \nI always use blocks with structured statements such as if and while because\
    \ it is less error prone. I have seen:\n\n```javascript\nif (a)\n  b();\n```\n\
    \nbecome:\n\n```javascript\nif (a)\n  b();\n  c();\n```\n\nwhich is an error that\
    \ is very difficult to spot. It looks like:\n\n```javascript\nif (a) {\n  b();\n\
    \  c();\n}\n```\n\nbut it means:\n\n```javascript\nif (a) {\n  b();\n}\n  c();\n\
    ```\n\nCode that appears to mean one thing but actually means another is likely\
    \ to cause bugs. A pair of braces is really cheap protection against bugs that\
    \ can be expensive to fix.\n\nI always use the K&R style, putting the { at the\
    \ end of a line near the front, because it avoids a horrible design blender in\
    \ JavaScript's return statement.\n\nI included some comments. I like to put comments\
    \ in my programs to leave information that will be read at a later time by people\
