    \ has pleased me,\" +\n\"When I am in heaven I shall desire\" +\n\"and praise\
    \ my Constructor.\";\n\nvar words = text.toLowerCase().split(/\\s+/);\nfor (i\
    \ = 0; i < words.length; i++) {\n  word = words[i];\n  // count occurrences\n\
