  md: 'The operators at the top of the operator precedence list in Table 2-1 have
    higher precedence. They bind the tightest. The operators at the bottom have the
    lowest precedence. parentheses can be used to alter the normal precedence, so:


    ```

    2 + 3 * 5 === 17

    (2 + 3) * 5 === 25

    ```


    # Table 2-1. Operator precedence


    | Refinement and invocation |

    | --- |

    | Unary operators |

    | delete new typeof + ! |

    | Multiplication, division, modulo |

    | Addition/concatenation, subtraction |

    | Inequality |

    | Equality |

    | Logical and |

    | Logical or |

    | Ternary |


