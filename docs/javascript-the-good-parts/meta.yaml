    > 我很好地了解它：

    > 我很久以前就在语法书中读过它。

    —威廉·莎士比亚，《提图斯·安德洛尼库悲》


    本章介绍了 JavaScript 有用部分的语法，简要概述了该语言的结构。我们将使用铁路轨道图（railroad diagrams）来表示语法。


    解释这些图的规则非常简单：


    *   你从左边缘开始，沿着轨道到右边缘。

    *   在移动过程中，你会在椭圆中遇到字面量，在矩形中遇到规则或描述。

    *   任何通过遵循轨道可以形成的序列都是合法的。

    *   任何无法通过遵循轨道形成的序列都是非法的。

    *   两端各有一个杠的铁路轨道图允许在任意标记之间插入空格。两端各有两个杠的铁路轨道图则不允许。


    本章介绍的有用部分的语法比整个语言的语法要简单得多。


    # 空格


    空格可以以格式字符或注释的形式存在。空格通常是不起作用的，但有时需要使用空格来分隔字符序列，否则这些字符将合并成单个标记。例如：


    ```

    var that = this;

    ```


    `var` 和 `that` 之间的空格不能删除，但其他空格可以删除。


    ![](img/03300178c40ed5b3e760309f69ee3125_21_0.png)


    JavaScript 提供了两种形式的注释：用 `/* */` 形成的块注释和用 `//` 的行注释。应该大量使用注释来提高程序的可读性。确保注释始终准确描述代码。过时的注释比没有注释更糟糕。


    `/* */` 形式的块注释来自一种名为 PL/I 的语言。PL/I 选择这些奇怪的组合作为注释符号，是因为它们在那种语言的程序中不太出现，除非是在字符串字面量中。在
    JavaScript 中，这些组合也可能正则表达式字面量中，因此块注释对于注释掉代码块是不安全的。例如：


    ```

    /*

    var rm_a = /*.match(s);

    */

    ```


    会导致语法错误。因此，建议避免使用 `/* */` 注释，而改用 `//` 注释。在书中，将专门使用 `//`。


    # 名称


    名称是一个字母，后面可选跟随一个或多个字母、数字或下划线。名称不能是以下这些保留字之一：


    ```

    abstract

    boolean break byte

    case catch char class const

    debugger default delete double

    else enum export extends

    false final finally float for function

    goto

    if implements import instanceof int interface

    long

    native new null

    package private protected public

    return

    short static super switch synchronized

    this throws transient try typeof

    var volatile void

    while with

    ```


    # name


    ![](img/03300178c40ed5b3e760309f69ee3125_22_0.png)


    此列表中的大多数保留字在语言中并没有使用。该列表没有包含本应被保留但未被的单词，例如 `undefined`、`NaN` 和 `Infinity`。不允许使用保留字作为变量或参数的名称。不允许将保留字作为对象字面量中对象属性的名称，或精细化中点之后的名称。


    名称用于语句、变量、参数、属性名、操作符和标签。


    # 数字


    ![](img/03300178c40ed5b3e760309f69ee3125_22_1.png)


    JavaScript 只有一种数字类型。在内部表示为 64 位浮点数，类似于 Java 的 `double`。与大多数编程语言不同，它没有单独整数类型，因此
    `1` 和 `1.0` 是相同的值。这是一个巨大的便利，因为完全避免了短整数的溢出问题，你对数字只需要知道它是一个数字即可。避免了一大类数值类型错误。


    ![](img/03300178c40ed5b3e760309f69ee3125_23_0.png)

