  - "[PAGE 81]\n\nToday's regular expressions are not strictly regular, but they can\
    \ be very useful. Regular expressions tend to be extremely terse, even cryptic.\
    \ They are easy to use in their simplest form, but they can quickly become bewildering.\
    \ JavaScript's regular expressions are difficult to read because they do not allow\
    \ comments or whitespace. All of the parts of a regular expression are pushed\
    \ tightly together, making them almost indecipherable. This is a particular concern\
    \ when they are used in security applications for scanning and validation. If\
    \ you cannot read and understand a expression, can you have confidence that it\
    \ will work correctly for all inputs? Yet, despite their obvious drawbacks, regular\
    \ expressions are widely used.\n\n# # An Example\n\nHere is an example. It is\
    \ a regular expression that matches URLs. The pages of this book are not infinitely\
    \ wide, so I broke it into two lines. In a JavaScript program, the regular expression\
    \ must be on a single line. Whitespace is significant:\n\n```\nvar parse_url =\
    \ /^((?:([A-Za-z]+):)?\\{0,3})\\([0-9\\.--A-Za-z]+\\)(?::(\\d+))?(?:/([^\\s#]*))?(?:#(.*))?(?:\\\
    ?(.*))?$/\n```\n\n```\nvar url = \"http://www.ora.com/goodparts?#fragment\";\n\
    ```\n\nLet's call parse_url's exec method. If it successfully matches the string\
    \ that we pass to, it will return an array containing parts extracted from the\
    \ url:\n\n```\nvar url = \"http://www.ora.com/goodparts?#fragment\";\n```\n\n\
    ```\nvar result = parse_url.exec(url);\n```\n\n```\nvar names = ['url', 'scheme',\
    \ 'slash', 'host', 'port', 'path', 'query', 'hash'];\n```\n\n```\nvar blanks =\
    \ ' '\n```\n\n```\nfor (var i = 0; i < names.length; i += 1) {\n  document.writeln(names[i]\
    \ + ': ' +\n  blanks.substring(names[i].length), result[i]);\n}\n```\n\nThis produces:\n\
    \n```\nurl: http://www.ora.com:80/goodparts?#fragment\nscheme: http\nslash: /\n\
    host: www.ora.com\nport: 80\npath: goodparts\nquery: q\nhash: fragment\n```"
  - "[PAGE 82]\n\nIn Chapter 2, we used railroad diagrams to describe the JavaScript\
    \ language. We can also use them to describe the languages defined by regular\
    \ expressions. That may make it easier to see what a regular expression does.\
    \ This is a railroad diagram for parse_url.\n\n# parse_url\n\n![](img/03300178c40ed5b3e760309f69ee3125_82_0.png)\n\
    \nRegular expressions cannot be broken into smaller pieces the way that functions\
    \ can, so the track representing parse_url is a long one.\n\nLet's factor parse_url\
    \ into its parts to see how it works: \n\n^ \nThe ^ indicates the beginning of\
    \ the string. It is an anchor that prevents exec from skipping over a non-URL-like\
    \ prefix:\n\n```\n(?::([A-Za-z]+):)\n```\n\nThis factor matches a scheme name,\
    \ but only if it is followed by a : (colon). The (?|\\...) indicates a noncapturing\
    \ group. The suffix ? indicates that the group is optional."
