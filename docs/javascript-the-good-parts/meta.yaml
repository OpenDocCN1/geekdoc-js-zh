  - "[PAGE 65]\n\n# Object Specifiers\n\nIt sometimes happens that a constructor is\
    \ given a very large number of parameters. This can be troublesome because it\
    \ can be very difficult to remember the order of the arguments. In such cases,\
    \ it can be much friendlier if we write the constructor to accept a single object\
    \ specifier instead. That object contains the specification of the object to be\
    \ constructed. So, instead of:\n\n```\nvar myObject = maker(f, 1, m, c, s);\n\n\
    we can write:\n\nvar myObject = maker({\n  first: f,\n  last: 1,\n  state: s,\n\
    \  city: c\n});\n```\n\nThe arguments can now be listed in any order, arguments\
    \ can be left out if the constructor is smart about defaults, and the code is\
    \ much easier to read.\n\nThis can have a secondary benefit when working with\
    \ JSON (see Appendix E). JSON text can only describe data, but sometimes the data\
    \ represents an object, and it would be useful to associate the data with its\
    \ methods. This can be done trivially if the constructor takes an object specifier\
    \ because we can simply pass the JSON object to the constructor and it will return\
    \ a fully constituted object.\n\n# Prototype\n\nIn a purely prototypal pattern,\
    \ we dispense with classes. We focus instead on the objects. Prototype inheritance\
    \ is conceptually simpler than classical inheritance: a new object can inherit\
    \ the properties of an old object. This is perhaps unfamiliar, but it is really\
    \ easy to understand. You start by making a useful object. You can make many more\
    \ objects that are like that. The classification process of breaking an application\
    \ down into a set of nested abstract classes can be completely avoided.\n\nLet's\
    \ start by using an object literal to make a useful object:\n\n```\nvar myMamm\
    \ = {\n  name : 'Herb the Mammal',\n  get_name : function () {\n    return this.name;\n\
    \  },\n  says : function () {\n    return this.saying || '';\n  }\n};\n```"
  - "[PAGE 66]\n\nOnce we have an object that we like, we can make more instances\
    \ with the Object. method from Chapter 3. We can then customize the new instances:\n\
    \n```\nvar myCat = Object.create(myMammal);\nmyCat.name = 'Henrietta';\nmyCat.saying\
    \ = 'meow'\nmyCat.purr = function (n) {\n  var s = '';\n  for (i = 0; i < n; i\
    \ += 1) {\n    if (s) {\n      s += 'r';\n    }\n  }\n  return s;\n};\nmyCat.get_name\
    \ = function () {\n  return this.says(s) + ' ' + this.name + ' ' + this.says(s);\n\
    };\n```\n\nThis is differential inheritance. By customizing a new object, we specify\
    \ the differences from the object on which it is based.\n\nSometimes it is useful\
    \ for data structures to inherit from other data structures. Here is an example:\
    \ Suppose we are parsing a language like JavaScript or TeX in which a pair of\
    \ curly braces indicates a scope. Items defined in a scope are not visible outside\
    \ of the scope. In a sense, an inner scope inherits from its outer scope. JavaScript\
    \ objects are very good at representing this relationship. The block function\
    \ is called when a left brace is encountered. The parse function will look up\
    \ symbols from scope, and augment scope when it defines new symbols:\n\n```\n\
    var block = function () {\n// Remember the current scope. Make a new scope that\n\
