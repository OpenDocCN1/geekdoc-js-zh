    \ later in this chapter.\n\n```\nvar a = ['a', 'b', 'c'];\nvar b = ['x', 'y',\
    \ 'z'];\nvar c = a.concat(b, true);\n// c is ['a', 'b', 'x', 'y', 'z', true]\n\
    ```\n\n### array.join(separator)\n\nThe join method makes a string from an array.\
    \ It does this by making a string of each of the array's elements, and then concatenating\
