  md: "# JSLint comment\n\n![](img/03300178c40ed5b3e760309f69ee3125_133_0.png)\n\n\
    option\n\n![](img/03300178c40ed5b3e760309f69ee3125_133_1.png)\n\n# Semicolon\n\
    \nJavaScript uses a C-like syntax, which requires the use of semicolons to delimit\
    \ statements. JavaScript attempts to make semicolons optional with a semicolon\
    \ insertion mechanism. This is dangerous.\n\nLike C, JavaScript has ++ and - and\
    \ ( operators, which can be prefixes or suffixes. The disambiguation is done by\
    \ the semicolon.\n\nIn JavaScript, a linefeed can be whitespace, or it can act\
    \ as a semicolon. This replaces one ambiguity with another.\n\nJSLint expects\
    \ that every statement be followed by ; except for for, function, if, switch,\
    \ try, and while. JSLint does not expect to unnecessary semicolons or the empty\
    \ statement.\n\n# Line Breaking\n\nAs a further defense against the masking of\
    \ errors by the semicolon insertion mechanism, JSLint expects long statements\
    \ to be broken only after one of these punctuation characters or operators:\n\n\
    ```\n, ; : { ( } [ = < ? ! + - * % ^ | & 8\n = != <= < ? += -= * %= ^= |= = =\
    \ << >> | &&\n=== != == <= >= >>> >>>\n```\n\nJSLint does not expect to see a\
    \ long statement broken after an identifier, a string, a number, a closer, or\
    \ a suffix operator:\n\n```\n) ] ++\n```"
