  trans: "\n\n上述命令将询问多个问题，例如项目的位置以及如何启动项目。这包括对如“blog”等示例模板的选择。为了本教程的目的，只需选择一个空项目即可。\n\
    \n### 启动模板\n\nAstro 提供了丰富的[启动模板](https://docs.astro.build/en/install/auto/#starter-templates)，你可能想要查看这些模板，还有大量的[主题](https://astro.build/themes/)\
    \ 供选择。\n\n流程的下一步一步是确保依赖项已安装。Astro 默认支持 TypeScript，安装程序会提示我们选择计划编写 TypeScript 还是仅\
    \ JavaScript。\n\n接下来让我们来看一些关键的文件夹和文件。好消息是，在空项目安装中，这些文件的数量很少。\n\n## 项目结构\n\n`src`\
    \ 文件夹是构建整个应用程序的地方。默认情况下，`src` 文件夹包含一个 `pages` 文件夹和一个 `env.d.ts` 文件。如前所述，Astro\
    \ 开箱支持 TypeScript，且 `env.d.ts` 文件包含一个指向适当 Astro 类型定义的 [三斜杠指令](https://www.typescriptlang.org/docs/handbook/triple-slash-directives.html)。\n\
    \nAstro 使用基于文件系统的路由。这本质上意味着放在 `pages` 文件夹中的每个文件夹和文件都将作为一个路由。因此，在 `src/pages` 中添加\
    \ `about.astro` 将创建 `/about` 页面。添加一个新的 `countries` 文件夹以及 `singapore.astro` 文件将创建路由\
    \ `/countries/singapore`——依此类推。\n\nAstro 真正令人惊叹的地方在于，这些页面之间的链接不需要第三方依赖或专用组件。相反，可以使用标准的\
    \ `<a href=\"/about\">` 元素。\n\n### 文件扩展名\n\n我们不需要使用 `.astro` 扩展名。Astro 也可以使用 `.md`、`.mdx`\
    \ 和 `.html` 扩展，以及 `.js` 和 `.ts`（用于 API 端点，稍后详细介绍）。对于本教程，我们将坚持创建 `.astro` 文件和组件。\n\
    \n最后一个需要提的文件是 `astro.config.mjs`，在其中我们可以指定 Astro 的某些行为或添加插件。我们将在本系列的后续中回到此文件，并探索一些可用选项。\n\
    \n讨论 Astro 建议的一些命名规范也是重要的。其中一些仅仅是建议。然而，Astro 预留了一些文件夹名称。与构建 React 项目类似，Astro 项目包含多个组件（可以是\
    \ `.astro` 或其他）。因此，将这些存储在中心化位置是有意义的。Astro 文档建议将它们存储在 `src/components` 中。\n\n在接下来的章节中，我们将讨论\
    \ Astro 中的布局（layouts），它可以用于定义整个应用程序的 UI 结构。Astro 再次建议使用 `src/layouts` 处理与 UI 结构相关的文件。\n\
    \n样式是现代 Web 应用的重要部分，`src/styles` 可用于存储 CSS 甚至是 Sass 文件。\n\n`public` 文件夹可以存储图像和字体等资源。\n\
    \n最后但同样重要的是，除了 `src/pages`，Astro 预留的另一个文件夹名称是 `src/content`。该位置用于内容集合（content\
    \ collections），我们稍后会进行探索。\n\n现在我们已经讨论了文件夹结构，让我们讨论一下哪些文件放入哪些文件夹。我们将从查看 Astro 文件是如何构造的开始。（\
    \ Astro 文件具有 `.astro` 扩展名，称为“Astro 组件”。）\n\n## Astro 文件的结构\n\n一个 `.astro` 组件有两个部分：脚本（script）和模板（template）。组件脚本通常位于顶部，它被所谓的代码围栏（code\
    \ fence）隔开——即“脚本”部分顶部和底部的三横线：`---`。（如果你在 Markdown 中用过 `frontmatter`，语法完全相同。）\n\
    \n组件脚本基本上是构建构建期间使用 Node.js 运行时执行的 JavaScript 代码。通常，我们可以在这里导入其他组件（可以是 Astro 组件或其他\
    \ React 组件！）、进行数据导入、执行 Fetch API 请求、创建模板中使用的变量，甚至安全地使用 API 密钥或写入数据库。这里需要理解的关键是，编写在\
    \ Astro 组件这部分的 JavaScript（或 TypeScript）代码永远不会到达客户端。\n\n在脚本部分创建的任何变量都可以通过大括号在模板部分引用。（我们稍后会看到一个示例。）\n\
    \nAstro 组件的第二部分是模板。这是应该添加 HTML 标签的地方，基于此，Astro 将构建过程中生成最终输出。除了标准的 HTML 元素外，在模板的范围内我们可以使用\
    \ JavaScript 表达式、Astro 组件（或来自任何其他[支持框架](https://docs.astro.build/en/guides/integrations-guide/#official-integrations)\
    \ 的组件）以及特殊的 Astro 指令。如果需要客户端 JavaScript，模板也可以自然地接受 `<script>` 元素。\n\n这是一个示例 `.astro`\
    \ 文件的外观，显示了脚本部分和 HTML 模板部分：\n\n```\n---\nconst name = 'Jack'\n---\n<h1>Hello there,\
    \ {name}</h1>\n```\n\n### 放置 JavaScript\n\n默认情况下，任何添加到 `<script>` 元素中的 JavaScript\
    \ 都会被打包，并使用 `type=\"module\"` 属性添加到静态生成页面的 `<head>` 中。如果你希望你的 JavaScript 是内联的，请添加\
    \ `<script is:inline>`。更多细节请见下一节。\n\n## 客户端 JavaScript 与构建时\n\n让我们快速检查组件脚本部分添加\
    \ JavaScript 与 `<script>` 元素的区别。\n\n这里是一种方案：\n\n```\n---\nconst copyrightYear\
    \ = new Date().getFullYear();\n---\n<small>Copyright, {copyrightYear}</small>\n\
    ```\n\n这是另一种方案：\n\n```html\n<small>Copyright</small>\n<script>\ndocument.querySelector('small').insertAdjacentText('beforeend',`\
    \ ${new Date().getFullYear()}`);\n</script>\n```\n\n在 Astro 中使用哪种方案来显示年份？两者似乎都能工作，并且都能显示年份。\n\
    \n然而，存在一个关键区别。假设我们使用第一种方案并在 2024 年 12 月 29 日构建并部署项目。然后两年内没有再次构建。当年份过期后，打开页面仍然显示\
    \ 2024。为什么？因为放在代码围栏 `---` 之间的 JavaScript 代码是在构建期间执行的。然而，方案二将始终显示正确的年份，因为该代码是在请求时执行的。也就是说，每当有人查看页面时，该\
    \ JavaScript 运行。\n\n## Astro Astro 组件\n\n现在我们已经熟悉 Astro 组件的样子，让我们也讨论这些组件的样式。Astro\
    \ 开箱支持 CSS、Sass 和 Less。类似于在组件中添加 `<script>` 元素，添加 `<style>` 元素也是可能的。好消息是？CSS 规则默认限制在定义它们的组件。这意味着在单个页面或组件级别定义的样式不会污染应用程序的其他部分，CSS\
    \ 规则仅适用于页面/组件。尽管如此，通过向 `<style>` 元素添加 `is:global` 属性也可以创建全局样式。\n\n看这个示例：\n\n```\n\
    <style is:global>\np {\n  font-weight: bold;\n}\n</style>\n```\n\n在上面的代码示例中，由于\
    \ `is:global` 指令的作用，整个项目中的所有落都会加粗。这两种方法也可以通过使用 `<style>` 元素和 `:global()` CSS 选择器结合起来。\n\
    \n此外，可以通过 `<style>` 元素上的 `define:vars` 属性从 Astro 组件的脚本部分使用 CSS 变量。\n\n"
- fmt: "\n```javascript\n---\nconst important = `#f00`;\n---\n<style define:vars={{\
    \ important }}>\np {\n  color: var(--important);\n}\n</style>\n<p>Important message</p>\n\
    ```\n\nIn the code above, we’re defining a variable in JavaScript (`important`)\
    \ and then reusing it as a CSS variable within the Astro template by way of the\
    \ `define:vars` directive on the `<style>` element.\n\nLastly, if we have external\
    \ stylesheets and we’ve placed them in our `public` folder, we can easily import\
    \ them from within the component using the standard ESM `import` syntax:\n\n```js\n\
    ---\nimport '../path/to/style.css'\n---\n<p>some html...</p>\n```\n\nLet’s also\
    \ talk about Astro in the context of a larger ecosystem. Astro integrates with\
    \ tools such as [Tailwind](https://tailwindcss.com) (a utility-first CSS framework)\
    \ and [Partytown](https://partytown.builder.io) (a library designed to assist\
    \ moving resource intensive scripts—such as third-party scripts—to a web worker,\
    \ therefore relieving the main thread to process app specific JavaScript instead).\n\
    \n## Custom Integrations\n\nIt’s worth noting that we can build a custom integration\
    \ as well via Astro’s [Integrations API](https://docs.astro.build/en/reference/integrations-reference/).\n\
    \nThe easiest way to use Tailwind (and other officially supported integrations)\
    \ is by using the `npx astro add [integration]` command: `npx astro add tailwind`.\
    \ This command automatically installs a compatible version of Tailwind, generates\
    \ a custom `tailwind.config.cjs` file, and updates the `astro.config.mjs` to look\
    \ like this, making it really easy to add Tailwind to a project:\n\n```js\nimport\
    \ { defineConfig } from 'astro/config';\n\nimport tailwind from \"@astrojs/tailwind\"\
    ;\n\n// https://astro.build/config\nexport default defineConfig({\n  integrations:\
    \ [tailwind()]\n});\n```\n\n## Demo\n\nThroughout this book, we’ll be referencing\
    \ a sample app, which you can also take a look at by visiting [stackblitz.com](https://stackblitz.com/github/tpiros/sitepoint-astro).\
    \ For the purposes of consolidating what you’ve learned in this first chapter,\
    \ it would be good to review the file and folder structure as well as the Tailwind\
    \ setup in this demo.\n\n## Conclusion\n\nIn this chapter, we got an introduction\
    \ to Astro, a modern frontend framework. Astro’s rising popularity is attributed\
    \ to its innovative approach to web development, prioritizing performance, seamless\
    \ developer experience, and the ability to integrate with other frameworks and\
    \ tools.\n\nSome of the key takeaways from this chapter are:\n\n* **Islands**.\
    \ Astro’s island architecture allows us to create islands of interactivity—loading\
    \ JavaScript where and when needed in our app.\n* **Project structure**. Our overview\
    \ of the project structure of an Astro project showed the key files and folders\
    \ found in an Astro project.\n* **File anatomy**. We explored the anatomy of a\
    \ `.astro` file, discussing what the script and template sections of a typical\
    \ `.astro` file look like.\n* **Styling**. We briefly touched on how to use styles\
    \ in Astro.\n\nAnd that’s it for the first chapter in this Astro series. Now that\
    \ we’ve covered the basic concepts, we’ll next take a look at Astro’s options\
    \ for rendering and layouts.\n\n# Chapter 2: Rendering Options in Astro: Building\
    \ a Layout\n\nIn the previous tutorial, we looked at the basics of Astro: its\
    \ folder structure, how components work, and how styling works.\n\nThis tutorial\
    \ will focus on layouts and the various rendering options available at our disposal\
    \ with Astro. Rendering plays a critical part in any web application, since its\
    \ goal is to display the final output to the end user. With Astro, we have the\
    \ flexibility to choose between two primary rendering modes: **static site generation**\
    \ (SSG) and **server-side rendering** (SSR). The former is ideal for generating\
    \ highly optimized, pre-built HTML during the build process, resulting in lightning-fast\
    \ load times and SEO-friendly websites. The latter enables dynamic content generation\
    \ on the server, striking a balance between performance and flexibility.\n\n##\
    \ Layouts in Astro\n\nWhile each `.astro` page (route) has the potential to contain\
    \ a fully-fledged HTML document, it’s inefficient to duplicate that structure,\
    \ especially when certain elements—such as `<meta>` and `<title>` elements—may\
    \ vary depending on the currently viewed page. (The inefficiency comes from the\
    \ fact that we would have to potentially add the same HTML structure to each `.astro`\
    \ page.)\n\nTherefore, it’s advisable to establish an overarching layout that\
    \ can be used across all pages. Although not mandatory, organizing the layout\
    \ files within the `src/layouts` folder makes sense, enabling the addition of\
    \ multiple layout files—such as one for navigation and another for a footer, or\
    \ even splitting up the layout for parts of the page (for example, a separate\
    \ layout for the overall page and for the blog).\n\nConsider the following as\
    \ an example of a basic website that would encompass common UI elements:\n\n*\
    \ `layouts/Layout.astro`: the primary layout file\n* `layouts/Head.astro`: a section\
    \ for custom `<head>` elements, potentially unique for each page\n* `layouts/Nav.astro`:\
    \ a navigation bar\n* `layouts/Footer.astro`: a footer section\n\n![Common UI\
    \ elements on a page](Images/2_4.png)\n\nHere’s a glimpse of the `layouts/Layout.astro`\
    \ file:\n\n```astro\n---\nimport Head from './Head.astro';\nimport Nav from './Nav.astro';\n\
    const {\n  title = 'Footie is the best',\n  description = 'An online football\
    \ magazine',\n} = Astro.props;\n\nimport Footer from './Footer.astro';\n---\n\n\
    <html lang=\"en\">\n  <title>{title}</title>\n  <meta name=\"description\" content={description}>\n\
    \  <body>\n    <Nav />\n    <div>\n      <main>\n        <slot />\n      </main>\n\
    \    </div>\n    <Footer />\n  </body>\n</html>\n```\n\n#### Mixing HTML Elements\
    \ and Astro Components\n\nNote that, in the example above, we’re mixing HTML elements\
    \ with Astro components. The ones that are capitalized (`Nav` and `Footer`) are\
    \ Astro components that are imported in the top part of sample layout file.\n\n\
    ### Astro.props\n\nThere are a few key takeaways here. Take note of the `import`\
    \ function and the usage of `Astro.props`. We can easily import any other component\
    \ using the `import` keyword. The special built-in `Astro.props` object allows\
    \ us to send properties to components and access them. In the code above, default\
    \ values are set if `Astro.props` lacks the `title` or `description` keys (the\
    \ default values are `Footie is the best` and `An football magazine`). This is\
    \ good practice, and we’re leveraging JavaScript’s default params intermixed with\
    \ object destructuring. However, if there are `props` sent, Astro will pick them\
    \ up. Let’s take a look at this by examining the code below:\n\n```js\n<!-- Uses\
    \ the defaults -->\n<Layout />\n\n<!-- Sets title to \"My Title,\" while description\
    \ retains its default value -->\n<Layout title=\"My Title\" />\n```\n\nThe first\
    \ `<Layout />` component doesn’t have any `props` attached to it, so it will resort\
    \ to using the previously mentioned default values. In the second scenario, however,\
    \ the `title` prop is sent with the value of `My Title`, which means that the\
    \ page will display the appropriate title.\n\n#### Global Object Properties\n\n\
    Multiple properties are available from the built-in global object [Astro](https://docs.astro.build/en/reference/api-reference/#astro-global).\n\
    \nLastly, take note of the `<slot />` element, which serves as the insertion point\
    \ for content from individual `.astro` pages. More on shortly.\n\nPlease also\
    \ pay attention to the `<Head>` Astro component. Suppose the property and variable\
    \ holding the value we wish to send to the property share the same name. In that\
    \ case, we can employ a simpler syntax:\n\n```js\nconst title = 'my title';\n\n\
    <Head title={title} />\n<!-- Can be simplified to \U0001F447 -->\n<Head {title}\
    \ />\n```\n\n### Slot\n\nLet’s talk a bit more about the built-in `<slot />` element.\
    \ Once the layouts are ready, the content from Astro files in the `src/pages`\
    \ folder will be injected where the element mentioned above is placed.\n"
