  trans: "\n\n现在我们已经知道了如何查询数据，让我们来讨论如何实际上以格式化的方式显示它们。Astro 提供了一个名为 `render()` 的方便方法，可以将整个\
    \ Markdown 内容渲染到一个名为 `<Content />` 的内置 Astro 组件中。我们如何构建和显示内容，也将取决于我们使用的是静态站点生成（SSG）还是服务器端渲染（SSR）模式。\n\
    \n对于预渲染，我们可以使用 `getStaticPaths()` 方法：\n\n```\n// /src/pages/posts/[...slug].astro\n\
    ---\nimport { getCollection } from 'astro:content';\n\nexport async function getStaticPaths()\
    \ {\n  const blogEntries = await getCollection('blog');\n  return blogEntries.map(entry\
    \ => ({\n    params: { slug: entry.slug }, props: { entry },\n  }));\n}\n\nconst\
    \ { entry } = Astro.props;\nconst { Content } = await entry.render();\n---\n<h1>{entry.data.title}</h1>\n\
    <Content />\n```\n\n在上面的代码中，我们使用了 `getStaticPaths()`。（我们在本书的第二章中介绍过这个方法，它是处理动态路由的一种方式。）然后我们依赖\
    \ `Astro.props` 来捕获 `entry`，它是一个包含条目元数据、`id`、`slug` 以及一个 `render()` 方法的对象。该方法负责在\
    \ Astro 模板中将 Markdown 条目渲染为 HTML，它通过创建一个 `<Content />` 组件来实现。这令人惊叹的是，我们现在只需要将\
    \ `<Content />` 组件添加到我们的模板中，就能看到 Markdown 内容被渲染成 HTML 了。\n\n## 渲染选项\n\n作为一个回顾，或者以防你错过了内容，本书的第二章讨论了可用的各种渲染选项。\n\
    \n对于 SSR，需要遵循稍微不同的方法。不再使用 `getStaticPaths()`，而是可以利用 `Astro.params`，因为内容将在请求时被拉取并渲染：\n\
    \n```\n---\nimport { getEntry } from 'astro:content';\n\nconst { slug } = Astro.params;\n\
    const entry = await getEntry('blog', slug);\nconst { Content } = await entry.render();\n\
    ---\n<h1>{entry.data.title}</h1>\n<Content />\n```\n\n## 在 Astro 中集成 Tailwind\
    \ CSS\n\n在入门教程中，我们讨论了如何将 Tailwind CSS 与 Astro 集成。Tailwind 有一个[排版插件](https://tailwindcss.com/docs/typography-plugin)\
    \ (`@tailwindcss/typography`)，可以为从 Markdown 渲染的 HTML 添加样式。如果你还没有查看，建议你检查一下。请查看下面的截图。左侧是没有使用排版插件的\
    \ Markdown 渲染模板，右侧是使用了它的模板。\n\n![带有和不带排版插件的渲染模板](img/typography.png)\n\n## 视图过渡\
    \ (View Transitions)\n\n[View Transitions API](https://developer.mozilla.org/en-US/docs/Web/API/View_Transitions_API)了一种在不同\
    \ DOM 状态之间生成动画过渡的方法，同时在单次操作中更新 DOM 内容。这在 Web 上通常是很的，但有了这个新的 API，可以用非常简单的方式处理过渡。[研究](https://developer.chrome.com/blog/view-transitions-case-studies/#redbus)表明，使用\
    \ View Transitions API 可以提高网站的感知性能。\n\nAstro 原生支持视图过渡，并为目前不支持该 API 的浏览器提供了内置的备备机制。\n\
    \n这种开箱即用的方案支持内置动画、前进和后退导航的动画，以及对无障碍（通过 `prefers-reduced-motion`）的自动支持，等等许多功能。\n\
    \n### 减少运动\n\n`prefers-reduced-motion` 媒体查询很重要，因为它允许网页开发者通过尊重用户对减少运动的偏好来创建更具包容性和无障碍的用户体验，从而使运动敏感或前庭功能障碍的人士受益。\n\
    \n### 浏览器对视图过渡的支持\n\n虽然 View Transition API 是一项伟创新并且值得尝试，但请记住它仍然处于实验阶段，并且目前[只有部分浏览器支持](https://caniuse.com/view-transitions)。\n\
    \n演示视图过渡的最佳方法之一是利用视频元素，该元素将在页面切换之间保持其状态。（请注意，我们也可以在利用 `client:*` 指令的组件之间持久化状态。）这种示例可以在此视频](https://player.vimeo.com/video/884466855?h=fdaebb6dba&badge=0&autopause=0&quality_selector=1&player_id=0&app_id=58479)中所示。\n\
    \n假设我们有一个如下内容的 `<Video />` 组件：\n\n```\n---\n// src/components/Video\nconst src\
    \ = 'https://res.cloudinary.com/tamas-demo/video/upload/f_auto,q_auto/imagecon/ship.mp4';\n\
    const {\n  autoplay = false,\n  controls = true,\n  loop = false\n} = Astro.props;\n\
    ---\n\n<video {controls} {autoplay} {loop} transition:persist>\n  <source {src}\
    \ />\n</video>\n```\n\n在上面的代码中，我们从 Cloudinary 获取了一个视频。此外，我们允许视频在结束后自动播放并循环（重新），并为用户提供了控制按钮。这些设置由发送到此视频组件的属性决定，如果没有提供这些属性，将使用默认值。\n\
    \n请注意 `transition:persist` 指令。通过此指令，我们在过渡之间维持视频播放器的状态：在导航到下一页时，面的其他部分将显示更新的内容。我们可以在\
    \ `index.astro` 和 `about.astro` 页面上使用此组件：\n\n```\n// src/pages/index.astro\n---\n\
    import Video from '../components/Video.astro';\n---\n<!-- 一其他 HTML -->\n<Video\
    \ />\n```\n\n最后，我们需要启用页面过渡，可以按页面启用，也可以为整个项目全局启用。假设我们有某种布局文件，可以通过从 `astro:transitions`\
    \ 导入 `ViewTransitions` 来轻松启用它：\n\n```\n// src/layouts/Layout.astro\n---\nimport\
    \ { ViewTransitions } from 'astro:transitions';\n---\n<html lang=\"en\">\n  <head>\n\
    \    <title>我的网站！</title>\n    <ViewTransitions />\n  </head>\n  <body>\n    <slot\
    \ />\n  </body>\n</html>\n```\n\n总之，实验性的 View Transitions API 通过 CSS 伪元素、JavaScript\
    \ 以及之前和当前 DOM 状态的快照简化了不同页面或元素之间的视觉过渡。它提供了一个增强页面感知性能的新机会，减少了对复杂的自定义 JavaScript\
    \ 和 CSS 的依赖。\n\n## Demo\n\n我们在 StackBlitz 上为本教程部署的演示](https://stackblitz.com/github/tpiros/sitepoint-astro)\
    \ 使用内容集合。查看 `src/pages/posts.astro`、`src/content` 文件夹以及 `src/pages/posts/[...slug].astro`\
    \ 以检查实现细节。\n\n## 总结\n\n在本章中，我们深入探讨了 Astro 的两个核心功能：内容集合和视图过渡。内容集合允许高效的内容管理和数据验证，特别是在处理\
    \ `.md` 或 `.mdx` 文件时。而视图过渡则提供了一种无缝增强用户导航的方法，同时保持了出色的性能。\n\n在本系列的下一章中，我们将查看 Astro\
    \ 内置的 `Image` 组件，它允许创建高性能的图像资源。\n\n"
- fmt: "\nImage optimization is (or rather, should be) an important discussion point,\
    \ as the heaviest resources on a web page are generally image (or video) assets.\
    \ Therefore, optimizing images plays a crucial part in web development. Today,\
    \ there are multiple image formats. There are also many tools for converting images\
    \ between formats so that they become smaller in terms of kilobytes, resulting\
    \ in better experiences for users. This result is measured by the [Largest Contentful\
    \ Paint](https://web.dev/articles/lcp) metric, which is part of [Core Web Vitals](https://web.dev/explore/learn-core-web-vitals).\n\
    \nFortunately, Astro provides us with some incredibly handy tools right out of\
    \ the box that make image optimization a snap. Let’s take a look!\n\n# The Image\
    \ component\n\nAstro provides a built-in `<Image />` component that utilizes the\
    \ [Sharp](https://www.npmjs.com/package/sharp) library or [Squoosh](https://www.npmjs.com/package/@squoosh/lib)\
    \ behind the scenes to optimize images (the default is `Sharp`). This is an excellent\
    \ starting point if you want to achieve quick improvements in your image performance.\
    \ The component takes an image (which is an unoptimized image asset) and produces\
    \ an optimized version of it. The good news is that, even without changing any\
    \ defaults, you can get a lot of savings right out of the box.\n\n## Switching\
    \ from Sharp to Squoosh\n\nTo change from `sharp` to `squoosh`, you need to edit\
    \ your `astro.config.mjs` file:\n\n```\nimport { defineConfig, squooshImageService\
    \ } from 'astro/config';\n\nexport default defineConfig({\n  image: {\n    service:\
    \ squooshImageService(),\n  },\n});\n```\n\n## Squoosh CLI\n\nWhile we could choose\
    \ the Squoosh CLI as an alternative to the default Sharp library, unfortunately\
    \ Squoosh CLI is no longer actively maintained.\n\nTo use the `<Image />` component,\
    \ we first simply place our image assets in the `src` folder (subfolders can be\
    \ created as needed). Then, in any of our `.astro` files, we import them—along\
    \ with the `<Image />` component—like this:\n\n```\nimport { Image } from 'astro:assets';\n\
    import spain from '~/assets/spain.jpeg';\n```\n\nIn the code above, we’re importing\
    \ both the `Image` component as well as an image (`spain.jpeg`).\n\n## Storing\
    \ Images in the public Folder\n\nWe can also store images in the `public` folder,\
    \ but that’s always going to be served from the `build` folder without any processing.\n\
    \nWhen we’re ready to display the image(s), we can add the following code:\n\n\
    ```\n<Image src={spain} width={400} alt=\"Some Text\" />\n```\n\nIn the code above,\
    \ we’re using the previously imported `Image` component and setting its source\
    \ (`src`) attribute to be equal to the image we’ve also imported earlier. We’re\
    \ also adding a `width` and `alt` attribute to the component.\n\n## Cumulative\
    \ Layout Shift\n\nAlways add a `width` or `height` property to your image to reduce\
    \ your Cumulative Layout Shift (which is measured by the Core Web Vitals).\n\n\
    `Cumulative Layout Shift` measures the visual stability of a page by quantifying\
    \ the unexpected layout shifts that occur during the page’s loading time.\n\n\
    As an additional exercise, we can run `console.log(spain)` to see the properties\
    \ accessible from the imported image object. Also, inspect the network panel in\
    \ the browser’s developer tools to observe the new image weight, as well as the\
    \ image headers, which should now be set to a so-called “next-gen” image format\
    \ such as `.webp`.\n\nDuring the production build of our Astro project, we’ll\
    \ find details about image optimization in the build log for all our image assets,\
    \ highlighting the savings as well as the time it took for the tool to optimize\
    \ the image:\n\n```\n generating optimized images\n  ▶ /_astro/spain.9abbae23_ZpzbJG.webp\
    \ (before: 2724kB, after: 24kB) (+78ms) (1/1)\n```\n\n## getImage\n\nAstro also\
    \ has a [`getImage()` method](https://docs.astro.build/en/reference/api-reference/#getimage)\
    \ that can do on-demand image optimization without using the `<Image />` component.\
    \ But remember that this method only works with server-only APIs.\n\n# Performance\n\
    \nChanging the width of the image via the image component actually generates an\
    \ image with the given width (as opposed to just shrinking the original image\
    \ down with CSS in the browser), which therefore yields further bandwidth savings.\
    \ Generally speaking, it’s bad practice to transfer the image at its original\
    \ size over the network and shrink it down using CSS only on the client side.\n\
    \n## Don’t Be Lazy\n\nBy default, the `<Image />` component will generate an `<img>`\
    \ element that has the `loading=\"lazy\"` attribute added to it. In my opinion,\
    \ this is really dangerous, as it can cause performance issues related to the\
    \ Largest Contentful Paint Core Web Vital metric. If an image element is being\
    \ considered for the LCP calculation—in other words, if the image is the largest\
    \ element that loads for the page and it’s “above the fold”—we shouldn’t set the\
    \ image to load lazily. Be careful!\n\nFor more advanced image manipulation—such\
    \ as generating thumbnails, cropping, or adding overlays—we may need to use a\
    \ service like [Cloudinary](https://cloudinary.com). In fact, since Cloudinary\
    \ provides a Node.js SDK that has the capacity to generate a fully optimized image\
    \ and render it via the `<img>` element, it works charmingly with an Astro project\
    \ as well.\n\n```\n---\nimport { Image } from 'astro:assets';\nimport { v2 as\
    \ cloudinary } from 'cloudinary';\n\ncloudinary({\n  cloud_name: process.env.CLOUDINARY_CLOUD_NAME,\n\
    \  api_key: process.env.CLOUDINARY_API_KEY,\n  api_secret: process.env.CLOUDINARY_API_SECRET,\n\
    });\n\nconst cloudinaryImage = cloudinary.image(\"sample-demo\", {\n  transformation:\
    \ [\n    { width: 800, crop: \"scale\" },\n    { color: \"#ff00\", font_family:\
    \ \"Roboto\", font_size: 70, font_weight: \"bold\", overlay: \"Munich, Germany\"\
    \ },\n    { gravity: \"south\", y: 20 }\n  ]\n});\n---\n\n<div set:html={cloudinaryImage}></div>\n\
    ```\n"
  raw: "Image optimization is (or rather, should be) an important discussion point,\
    \ as the heaviest resources on a web page are generally image (or video) assets.\
    \ Therefore, optimizing images plays a crucial part in web development. Today,\
    \ there are multiple image formats. There are also many tools for converting images\
    \ between formats so that they become smaller in terms of kilobytes, resulting\
    \ in better experiences for users. This result is measured by the [Largest Contentful\
    \ Paint](https://web.dev/articles/lcp) metric, which is part of [Core Web Vitals](https://web.dev/explore/learn-core-web-vitals).\n\
    \nFortunately, Astro provides us with some incredibly handy tools right out of\
    \ the box that make image optimization a snap. Let’s take a look!\n\n## The Image\
    \ component\n\nAstro provides a built-in `<Image />` component that utilizes the\
    \ [Sharp](https://www.npmjs.com/package/sharp) library or [Squoosh](https://www.npmjs.com/package/@squoosh/lib)\
    \ behind the scenes to optimize images (the default is Sharp). This is an excellent\
    \ starting point if you want to achieve quick improvements in your image performance.\
    \ The component takes an image (which is an unoptimized image asset) and produces\
    \ an optimized version of it. The good news is that, even without changing any\
    \ defaults, you can get a lot of savings right out of the box.\n\n#### Switching\
    \ from Sharp to Squoosh\n\nTo change from `sharp` to `squoosh`, you need to edit\
    \ your `astro.config.mjs` file:\n\n```\nimport { defineConfig, squooshImageService\
    \ } from 'astro/config';\n\nexport default defineConfig({\n  image: {\n    service:\
    \ squooshImageService(),\n  },\n});\n```\n\n#### Squoosh CLI\n\nWhile we could\
    \ choose the Squoosh CLI as an alternative to the default Sharp library, unfortunately\
    \ Squoosh CLI is no longer actively maintained.\n\nTo use the `<Image />` component,\
    \ we first simply place our image assets in the `src` folder (subfolders can be\
    \ created as needed). Then, in any of our `.astro` files, we import them—along\
    \ with the `<Image />` component—like this:\n\n```\nimport { Image } from 'astro:assets';\n\
    import spain from '~/assets/spain.jpeg';\n```\n\nIn the code above, we’re importing\
    \ both the `Image` component as well as an image (`spain.jpeg`).\n\n#### Storing\
    \ Images in the public Folder\n\nWe can also store images in the `public` folder,\
    \ but that’s always going to be served from the `build` folder without any processing.\n\
    \nWhen we’re ready to display the image(s), we can add the following code:\n\n\
    ```\n<Image src={spain} width={400} alt=\"Some Text\" />\n```\n\nIn the code above,\
    \ we’re using the previously imported `Image` component and setting its source\
    \ (`src`) attribute to be equal to the image we’ve also imported earlier. We’re\
    \ also adding a `width` and `alt` attribute to the component.\n\n#### Cumulative\
    \ Layout Shift\n\nAlways add a `width` or `height` property to your image to reduce\
    \ your Cumulative Layout Shift (which is measured by the Core Web Vitals).\n\n\
    **Cumulative Layout Shift** measures the visual stability of a page by quantifying\
    \ the unexpected layout shifts that occur during the page’s loading time.\n\n\
    As an additional exercise, we can run `console.log(spain)` to see the properties\
    \ accessible from the imported image object. Also, inspect the network panel in\
    \ the browser’s developer tools to observe the new image weight, as well as the\
    \ image headers, which should now be set to a so-called “next-gen” image format\
    \ such as `.webp`.\n\nDuring the production build of our Astro project, we’ll\
    \ find details about image optimization in the build log for all our image assets,\
    \ highlighting the savings as well as the time it took for the tool to optimize\
    \ the image:\n\n```\n generating optimized images\n  ▶ /_astro/spain.9abbae23_ZpzbJG.webp\
    \ (before: 2724kB, after: 24kB) (+78ms) (1/1)\n```\n\n#### getImage\n\nAstro also\
    \ has a [`getImage()` method](https://docs.astro.build/en/reference/api-reference/#getimage)\
    \ that can do on-demand image optimization without using the `<Image />` component.\
    \ But remember that this method only works with server-only APIs.\n\n## Performance\n\
    \nChanging the width of the image via the image component actually generates an\
    \ image with the given width (as opposed to just shrinking the original image\
    \ down with CSS in the browser), which therefore yields further bandwidth savings.\
    \ Generally speaking, it’s bad practice to transfer the image at its original\
    \ size over the network and shrink it down using CSS only on the client side.\n\
    \n#### Don’t Be Lazy\n\nBy default, the `<Image />` component will generate an\
    \ `<img>` element that has the `loading=\"lazy\"` attribute added to it. In my\
    \ opinion, this is really dangerous, as it can cause performance issues related\
    \ to the Largest Contentful Paint Core Web Vital metric. If an image element is\
    \ being considered for the LCP calculation—in other words, if the image is the\
    \ largest element that loads for the page and it’s “above the fold”—we shouldn’t\
    \ set the image to load lazily. Be careful!\n\nFor more advanced image manipulation—such\
    \ as generating thumbnails, cropping, or adding overlays—we may need to use a\
    \ service like [Cloudinary](https://cloudinary.com). In fact, since Cloudinary\
    \ provides a Node.js SDK that has the capacity to generate a fully optimized image\
    \ and render it via the `<img>` element, it works charmingly with an Astro project\
    \ as well. Here’s how this would look:\n\n```\n---\nimport { Image } from 'astro:assets';\n\
    import { v2 as cloudinary, config } from 'cloudinary';\n\nconfig({\n  cloud_name:\
    \ 'tamas-demo',\n  api_key: import.meta.env.CLOUDINARY_API_KEY,\n  api_secret:\
    \ import.meta.env.CLOUDINARY_API_SECRET,\n  secure: true\n});\n\nconst cloudinaryImage\
    \ = cloudinary.image(\"r6bswlzed6oisy4bu4sb\", {\n  transformation: [\n    { width:\
    \ 800, crop: \"scale\" },\n    { color: \"#ff0\", overlay: {font_family: \"Roboto\"\
    , font_size: 70, font_weight: \"bold\", text: \"Munich, Germany\" } },\n    {\
    \ flags: \"layer_apply\", gravity: \"south\", y: 20 }\n  ]\n})\n---\n\n<div class=\"\
    py-6\" set:html={cloudinaryImage}></div>\n```\n\nIn the code above, we’re importing\
    \ Astro’s `Image` component, as well as the Cloudinary Node.js SDK. Since this\
    \ is a third-party service, we need to configure it by adding our Cloudinary username\
    \ (`cloud_name`), the API key, and the secret—all of which can all be found in\
    \ our Cloudinary account’s dashboard.\n\nUsing the Cloudinary Node.js SDK, we’re\
    \ creating an image transformation. Each object in the `transformation` array\
    \ modifies the image. The first object crops the image to a width of `800`. The\
    \ second object overlays the image with text, using the Roboto font face at a\
    \ size of `70px`. The overlay text is “Munich, Germany”. The last object places\
    \ the text overlay at the bottom part of the image (`south`), `20px` from the\
    \ bottom (`y: 20`).\n\nThe code above generates an actual `<img>` element, and\
    \ from this point usage of the `set:html` directive is required. Also note that\
    \ the code is using environment variables that live in a `.env` file. The resulting\
    \ image will have a text overlay (where the text overlay has a few separate settings\
    \ such as color and font face) carefully placed within the image. All of this\
    \ is generated at build time, so the result will be an image with the text already\
    \ overlaid.\n\n#### Environment Variable Rules\n\nIt’s worth noting here that\
    \ the rules governing environment variables are consistent with those outlined\
    \ in the [Vite documentation](https://vitejs.dev/guide/env-and-mode.html).\n\n\
    ## Deployment\n\nNow that we’ve gone through the steps of preparing our Astro\
    \ site, we come to the topic of deployment, as we get ready to show our project\
    \ to the world. Astro deployment couldn’t be easier: we simply run the `npm run\
    \ dev` command, which will result in the creation of a folder called `dist` in\
    \ the root project folder.\n\n### Local Preview\n\nIf we want to see what our\
    \ site looks like after a build, we can run `npx http-server dist/` (or use any\
    \ other way) to serve the content of the `dist` folder. I also recommend opening\
    \ up a few files in that folder to see what the Astro build has produced."
