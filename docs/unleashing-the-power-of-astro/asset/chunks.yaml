  trans: "\n\n图像优化是一个（或者说，应该是）一个重要的讨论点，因为网页上最重的资源通常是图像（或视频）资产。因此，优化图像在 Web 开发中起着至关重要的作用。今天有多种图像格式，也有许多工具可以在格式之间转换图像，以减小其字节数，从而为用户提供更好的体验。这种结果通过[最大内容绘制](https://web.dev/articles/lcp)\
    \ 指标来衡量，该指标是[核心 Web 指标](https://web.dev/explore/learn-core-web-vitals)的一部分。\n\n\
    幸运的是，Astro 为我们提供了一些非常实用的箱箱工具，让图像优化变得轻而易。让我们来看看！\n\n# Image 组件\n\nAstro 提供了一个内置的\
    \ `<Image />` 组件，它在后台利用 [Sharp](https://www.npmjs.com/package/sharp) 库或 [Squoosh](https://www.npmjs.com/package/@squoosh/lib)\
    \ 来优化图像（默认使用 `Sharp`）。如果你想快速提高图像性能，这是一个极佳的起点。该组件接收一个图像（未优化的图像资产）并生成其优化版本。好消息是，即使不更改任何默认设置，你也可以获得大量的节省。\n\
    \n## 从 Sharp 切换到 Squoosh\n\n要从 `sharp` 切换到 `squoosh`，你需要编辑你的 `astro.config.mjs`\
    \ 文件：\n\n```\nimport { defineConfig, squooshImageService } from 'astro/config';\n\
    \nexport default defineConfig({\n  image: {\n    service: squooshImageService(),\n\
    \  },\n});\n```\n\n## Squoosh CLI\n\n虽然选择 Squoosh CLI 作为默认 Sharp 库的替代方案，但遗憾的是\
    \ Squoosh CLI 不再活跃维护。\n\n要使用 `<Image />` 组件，我们首先将图像资产放在 `src` 文件夹中（根据需要创建子文件夹）。然后在我们的任何\
    \ `.astro` 文件中，像这样导入它们——连同 `<Image />` 组件：\n\n```\nimport { Image } from 'astro:assets';\n\
    import spain from '~/assets/spain.jpeg';\n```\n\n在上面的代码中，我们同时导入了 `Image` 组件和图像（`spain.jpeg`）。\n\
    \n## 在 public 文件夹中存储图像\n\n我们也可以将图像存储在 `public` 文件夹中，但它们始终从 `build` 文件夹中提供，而不经过任何处理。\n\
    \n当我们准备好显示图像时，可以添加以下代码：\n\n```\n<Image src={spain} width={400} alt=\"Some Text\"\
    \ />\n```\n\n在上面的代码中，我们使用了之前导入的 `Image` 组件，并将其源（`src`）属性设置为我们之前导入的图像。我们还为组件添加了\
    \ `width` 和 `alt` 属性。\n\n## 累计布局偏移\n\n始终为你的图像添加 `width` 或 `height` 属性，以减少累计布局偏移（Cumulative\
    \ Layout Shift，由核心 Web 指标衡量）。\n\n`Cumulative Layout Shift` 通过量化页面加载期间发生的意外布局偏移来衡量页面的视觉稳定性。\n\
    \n作为一个额外的练习，我们可以运行 `console.log(spain)` 来查看从导入图像对象可以访问的属性。此外，检查浏览器开发者工具中的网络面板以观察新的图像权重，以及图像头，这些头现在应该被设置为所谓的“下一代”图像格式，例如\
    \ `.webp`。\n\n在 Astro 项目的生产构建期间，我们将在构建日志中找到所有图像资产的优化详细信息，突出显示节省的空间以及工具优化图像所需的时间：\n\
    \n```\n generating optimized images\n  ▶ /_astro/spain.9abbae23_ZpzbJG.webp (before:\
    \ 2724kB, after: 24kB) (+78ms) (1/1)\n```\n\n## getImage\n\nAstro 还有一个 [`getImage()\
    \ 方法](https://docs.astro.build/en/reference/api-reference/#getimage)，可以在不使用 `<Image\
    \ />` 组件的情况下进行按需图像优化。但请记住，该方法仅适用于服务器端 API。\n\n# 性能\n\n通过图像组件更改图像宽度实际上会生成一个具有给定宽度的图像（而不是仅仅在浏览器中使用\
    \ CSS 缩小原始图像），从而进一步节省了带宽。通常情况下，通过网络以原始大小传输图像并仅在客户端使用 CSS 将其缩小是一种不良的做法。\n\n## 不要偷懒\n\
    \n默认情况下，`<Image />` 组件将生成一个带有 `loading=\"lazy\"` 属性的 `<img>` 元素。在我看来，这是非常危险的，因为可能会导致与最大内容绘制核心\
    \ Web 指标相关的性能问题。如果一个图像元素被用于 LCP 计算——也就是说，如果该图像是页面加载的最大元素且位于“折线以上”——我们就不应该将图像设置为懒加载加载。小心！\n\
    \n对于更高级的图像处理——例如生成缩略图、裁剪或添加叠加层——我们可能需要使用如 [Cloudinary](https://cloudinary.com)\
    \ 服务。事实上，由于 Cloudinary 提供了 Node.js SDK，能够生成完全优化的图像并通过 `<img>` 元素进行渲染，它与 Astro\
    \ 项目的配合也十分完美。\n\n```\n---\nimport { Image } from 'astro:assets';\nimport { v2\
    \ as cloudinary } from 'cloudinary';\n\ncloudinary({\n  cloud_name: process.env.CLOUDINARY_CLOUD_NAME,\n\
    \  api_key: process.env.CLOUDINARY_API_KEY,\n  api_secret: process.env.CLOUDINARY_API_SECRET,\n\
    });\n\nconst cloudinaryImage = cloudinary.image(\"sample-demo\", {\n  transformation:\
    \ [\n    { width: 800, crop: \"scale\" },\n    { color: \"#ff00\", font_family:\
    \ \"Roboto\", font_size: 70, font_weight: \"bold\", overlay: \"Munich, Germany\"\
    \ },\n    { gravity: \"south\", y: 20 }\n  ]\n});\n---\n\n<div set:html={cloudinaryImage}></div>\n\
    ```\n\n"
