    \ work under the hood in frameworks such as React and Angular. Usually, when a\
    \ project is created, some components don’t necessarily require JavaScript, as\
    \ the component isn’t interactive. For example, think about a navigation bar.\
    \ Built out as a component, it may contain little apart from text, HTML and some\
    \ styling. However, due to the nature of a framework such as React, we must load\
    \ all the JavaScript. Otherwise, the component will fail to function.\n\nWhen\
    \ speaking of an Astro **island**, we refer to an interactive piece of UI element—“interactive”\
    \ in the sense that it requires some JavaScript code to be run in order for it\
    \ to be fully functional. Still, at the same time, Astro can also work with static\
