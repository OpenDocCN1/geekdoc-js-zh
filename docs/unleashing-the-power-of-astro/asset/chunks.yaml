    ;\n\n// https://astro.build/config\nexport default defineConfig({\n  integrations:\
    \ [tailwind()]\n});\n```\n\n## 演示\n\n在本书中，我们将引用一个示例应用，你也可以通过访问 [stackblitz.com](https://stackblitz.com/github/tpiros/sitepoint-astro)\
    \ 来查看。为了巩固你在第一章中学到的知识，回顾此演示中的文件和文件夹结构以及 Tailwind 设置将很有帮助。\n\n## 总结\n\n在本章中，我们介绍了\
    \ Astro，这是一个现代前端框架。Astro 的日益流行归功于其创新的 Web 开发方法，优先考虑性能、无缝的开发者体验以及与其他框架和工具集成的能力。\n\
    \n本章的一些要点包括：\n\n* **岛屿 (Islands)**。Astro 的岛屿架构允许我们创建交互性岛屿——在应用程序需要的地方和时候加载 JavaScript。\n\
    *   **项目结构**。我们对 Astro 项目的项目结构的概述展示了 Astro 项目中常见的关键文件和文件夹。\n*   **文件剖析**。我们探索了\
    \ `.astro` 文件的剖析，讨论了典型的 `.astro` 文件的脚本部分和模板部分看起来是什么。\n*   **样式化**。我们简要提到了如何在 Astro\
    \ 中使用样式。\n\n这个 Astro 系列的第一章就到此了。现在我们已经涵盖了基本概念，接下来将查看 Astro 的渲染选项和布局方案。\n\n# 第\
    \ 2 章：Astro 中的渲染选项：构建布局\n\n在之前的教程中，我们查看了 Astro 的基础知识：它的文件夹结构、组件如何工作以及样式化如何工作。\n\
    \n本教程将重点关注布局（Layouts）以及 Astro 提供的各种渲染选项。渲染在任何 Web 中都起着至关重要的作用，因为它的目标是将最终输出显示给最终用户。通过\
    \ Astro，我们可以灵活地在两种主要的渲染模式之间选择：**静态站点生成** (SSG) 和**服务器端渲染** (SSR)。前者适合在构建过程中生成高度优化的预构建\
    \ HTML，从而实现极快的加载速度和 SEO 友好的网站。后者允许在服务器上生成动态内容，在性能和灵活性之间取得平衡。\n\n## Astro 中的布局\n\
    \n虽然每个 `.astro` 页面（路由）都有包含完整 HTML 文档的潜力，但重复这种结构是效的，特别是当某些元素——例如 `<meta>` 和 `<title>`\
    \ 元素可能会根据当前查看的页面而变化时。（低效源于我们可能需要向每个 `.astro` 页面添加相同的 HTML 结构。）\n\n因此，建议建立一个可在所有页面使用的总览布局。虽然不是强制的，但在\
    \ `src/layouts` 文件夹中组织布局文件是有意义的，这允许添加多个布局文件——例如一个用于导航，另一个用于页脚，甚至为页面的部分拆分布局（例如，为整个页面和博客分开设置布局）。\n\
    \n考虑以下内容作为包含常用 UI 元素的基础网站示例：\n\n* `layouts/Layout.astro`：主布局文件\n* `layouts/Head.astro`：用于自定义\
    \ `<head>` 元素的部分，每个页面可能唯一\n* `layouts/Nav.astro`：导航栏\n* `layouts/Footer.astro`：页脚部分\n\
    \n![页面上的常用 UI 元素](img/2_4.png)\n\n这里是 `layouts/Layout.astro` 文件的预览：\n\n```astro\n\
    ---\nimport Head from './Head.astro';\nimport Nav from './Nav.astro';\nconst {\n\
    \  title = 'Footie is the best',\n  description = 'An online football magazine',\n\
    } = Astro.props;\n\nimport Footer from './Footer.astro';\n---\n\n<html lang=\"\
    en\">\n  <title>{title}</title>\n  <meta name=\"description\" content={description}>\n\
    \  <body>\n    <Nav />\n    <div>\n      <main>\n        <slot />\n      </main>\n\
    \    </div>\n    <Footer />\n  </body>\n</html>\n```\n\n#### 混合 HTML 元素与 Astro\
    \ 组件\n\n注意在上面的例子中，我们混合了 HTML 元素和 Astro 组件。大写的那些（`Nav` 和 `Footer`）是位于布局文件顶部的 Astro\
    \ 组件。\n\n### Astro.props\n\n这里有几个要点。注意 `import` 函数和 `Astro.props` 的用法。特殊的内置 `Astro.props`\
    \ 对象允许我们向组件发送属性并访问它们。当 `Astro.props` 缺少 `title` 或 `description` 键时，会设置默认值（`Footie\
    \ is the best` 和 `An football magazine`）。这是良好的做法，我们利用了 JavaScript 的默认参数。但是，如果发送了\
    \ props，Astro 会获取它们。让我们通过查看下面的代码来看：\n\n```js\n<!-- 使用默认值 -->\n<Layout />\n\n<!--\
    \ 将 title 设置为 \"My Title\"，description 保持默认值 -->\n<Layout title=\"My Title\" />\n\
    ```\n\n第一个 `<Layout />` 组件没有任何 `props`，因此它将诉诸之前提到的默认值。在第二种情况下，发送了值为 `My Title`\
    \ 的 `title` prop，这意味着页面将显示正确的标题。\n\n#### 全局对象属性\n\n从内置全局对象 [Astro](https://docs.astro.build/en/reference/api-reference/#astro-global)\
    \ 可以获得多个属性。\n\n最后，注意 `<slot />` 元素，它是来自 `.astro` 页面内容的插入点。稍后详细介绍。\n\n### Slot\n\
    \n让我们再多谈谈内置的 `<slot />` 元素。一旦布局就绪，`src/pages` 文件夹中 Astro 文件的内容将插入到上述元素所在的位置。\n\
    \n请同时也注意 `<Head>` Astro 组件。假设属性和持有我们要发送到属性的变量具有相同的名称。在这种情况下，我们可以采用更简单的语法：\n\n\
    ```js\nconst title = 'my title';\n\n<Head title={title} />\n<!-- 可以简化为 \U0001F447\
    \ -->\n<Head {title} />\n```\n\n"
