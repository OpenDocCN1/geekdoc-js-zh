  trans: "\n\nAstro 2 版本中的一个显著特性是引入了内容集合（content collections）。这一功能在处理 `.md` 或 `.mdx`\
    \ 文件时被证明特别有价值。内容集合使我们能够有效地管理内容，同时还为 Astro 项目中的所有内容提供了数据验证和 TypeScript 类型安全。\n\n\
    从 Astro 3 版本开始，并随着 4 版本新增新功能，视图过渡（view transitions）也是 Astro 的一部分。事实上，Astro 是第一个实现这一新\
    \ Web 特性的框架。`View transitions` 是一种用户导航辅助工具：它们能够将用户的注意力无缝引导至页面的核心信息，从而提供丰富的用户体验。通过视图过渡，可以在不牺牲性能的情况下提升用户体验。\n\
    \n## 开始使用内容集合\n\n为了使用内容集合，Astro 指定了一个特殊文件夹：`src/content`。随后，我们可以在此位置创建子文件夹，每个子文件夹生成一个独立的内容集合。例如，我们可以创建如\
    \ `src/content/dev-blog` 和 `src/content/corporate-blog` 这样的集合。\n\n![我们的集合架构](img/4.png)\n\
    \n每个内容集合都可以在配置文件——`/src/content/config.js`（或 `.ts`）中配置，在其中，我们可以选择使用 [Zod](https://zod.dev)\
    \ 使用集合模式（schemas）。\n\nZod 是一种“带有静态类型推断的 TypeScript 优先模式验证”，已集成到 Astro 中。以下是其实现形式的示例：\n\
    \n```javascript\n// src/content/config.js\nimport { z, defineCollection } from\
    \ 'astro:content';\n\nconst devBlogCollection = defineCollection({\n  schema:\
    \ z.object({\n    title: z.string(),\n    author: z.string().default('The Dev\
    \ Team'),\n    tags: z.array(z.string()),\n    date: z.date(),\n    draft: z.boolean().default(true),\n\
    \    description: z.string(),\n  }),\n});\n\nconst corporateBlogCollection = defineCollection({\n\
    \  schema: z.object({\n    title: z.string(),\n    author: z.string(),\n    date:\
    \ z.date(),\n    featured: z.boolean(),\n    language: z.enum(['en', 'es']),\n\
    \  }),\n});\n\nexport const collections = {\n  devblog: devBlogCollection,\n \
    \ corporateblog: corporateBlogCollection,\n};\n```\n\n在上面的代码中，我们定义了两个内容集合——一个用于“开发者博客”，另一个用于“企业博客”。`defineCollection`\
    \ 方法允许我们为任何给定的集合创建 `schema`。对于“开发者博客”，我们创建了一个模式，其中该类别的文章必须具有标题（字符串）、作者（字符串，默认为“The\
    \ Dev Team”）、标签（字符串数组）、日期（日期类型）、草稿（默认为 `true` 的布尔值）和描述（字符串）。\n\n对于“企业博客”，我们的模式略有不同：标题和作者都是字符串类型。日期（数据类型）也是内容所必需的，还有精选（布尔值）标记和语言（枚举），语言可以设置为\
    \ `en` 或 `es`。\n\n最后，我们导出了包含两个属性 `devblog` 和 `corporateblog` 的 `collections` 对象。这些属性将在后文中使用。\n\
    \n### Markdown 文件与前置元数据（Frontmatter）\n\n本教程中关于内容集合的示例假设 `.md` 文件还包含了与配置文件中指定的模式匹配的\
    \ `frontmatter`。例如，一个示例“企业博客”文章看起来如下：\n\n```markdown\n---\ntitle: 'Buy!!'\nauthor:\
    \ 'Jack from Marketing'\ndate: 2023-07-19\nfeatured: true\nlanguage: 'en'\n---\n\
    \n# Some Marketing Promo\n\nThis is the best product!\n```\n\n### Slug 的生成\n\n\
    Astro 会根据文件名自动为文章生成 slug。例如，`first-post.md` 的 slug 将是 `first-post`。然而，如果我们在 `frontmatter`\
    \ 中提供了 `slug` 条目，Astro 将尊重它并使用我们自定义的 slug。\n\n请记住，在 `export const collections`\
    \ 对象中指定的属性必须与内容所在的文件夹名称相匹配。（另外注意，它们是区分大小大小的！）\n\n### 查询数据\n\n一旦我们准备好了所有的 Markdown\
    \ 文件（在本文中，它们位于 `src/content/devblog` 和 `src/content/corporateblog` 下）以及 `config.js`\
    \ 文件，我们就可以开始从集合中查询数据了，这是一个非常直接的过程：\n\n```javascript\n---\nimport { getCollection\
    \ } from 'astro:content';\nconst allDevPosts = await getCollection('devblog');\n\
    const allCorporatePosts = await getCollection('corporateblog');\n---\n<pre>{JSON.stringify(allDevPosts)}</pre>\n\
    <pre>{JSON.stringify(allCorporatePosts)}</pre>\n```\n\n如上所示，可以使用 `getCollection`\
    \ 方法从给定的集合中检索所有条目（再次引用之前导出的集合名称）。在上面的示例中，我们从“开发者博客”（`devblog`）和“企业博客”（`corporateblog`）中检索了所有文章。在模板中，我们简单地使用\
    \ `JSON.stringify()` 返回原始数据。\n\n我们应该检查通过 `JSON.stringify()` 显示的数据，并应该注意，除了 `frontmatter`\
    \ 数据外，我们还会获得 `id`、`slug` 和 `body` 属性，其中后者包含文章的内容。\n\n我们还可以通过迭代在 `frontmatter`\
    \ 中过滤草稿或特定语言的文章：\n\n```javascript\nimport { getCollection } from 'astro:content';\n\
    \nconst spanishEntries = await getCollection('corporateblog', ({ data }) => {\n\
    \  return data.language === 'es';\n});\n```\n\n`getCollection` 返回所有文章，但我们也可以使用\
    \ `getEntry` 从集合中返回单个条目：\n\n```javascript\nimport { getEntry } from 'astro:content';\n\
    \nconst singleEntry = await getEntry('corporateblog', 'article-1');\n```\n\n###\
    \ getCollection vs getEntries\n\n虽然有两种方法可以从集合中返回多篇文章，但它们之间存在细微的。`getCollection()`\
    \ 通过集合名称检索内容条目列表，而 `getEntries()` 则从同一个集合中检索多个集合条目。\n\nAstro 文档提供了一个示例，说明在使用引用实体（例如，相关文章列表）时使用\
    \ `getEntries()` 来获取内容。相关文章的概念是指引用集合中的文章数组。这可以通过在使用 `defineCollection` 方法时向模式添加以下内容来实现：\n\
    \n```javascript\nimport { defineCollection, reference, z } from 'astro:content';\n\
    \nconst devblog = defineCollection({\n  type: 'content',\n  schema: z.object({\n\
    \    title: z.string(),\n    relatedPosts: z.array(reference('blog')),\n  }),\n\
    });\n```\n\n在上面的代码中，我们还导入了 `reference` 并在向模式中添加 `relatedPosts` 时使用了它。（注意，我们可以为它起任何名称，例如\
    \ `recommendedPosts` 或 `followupPosts`。）\n\n要使用这些 `relatedPosts`，应该在 Markdown\
    \ 的 `frontmatter` 部分添加适当的 slug 值：\n\n```markdown\n---\ntitle: \"This is a post\"\
    \nrelatedPosts:\n\n- A related post # `src/content/devblog/a-related-post.md\n\
    ```\n\n引用实体在内容集合的 `config.js` 文件中定义，并使用 Zod 的 `reference` 方法：\n\n```javascript\n\
    const blog = defineCollection({\n  type: 'content',\n  schema: z.object({\n  \
    \  title: z.string(),\n    relatedPosts: z.array(reference('blog')).optional(),\n\
    \    author: reference('author'),\n  }),\n});\n\nconst author = defineCollection({\n\
    \  type: 'data',\n  schema: z.object({\n    name: z.string(),\n  }),\n});\n```\n\
    \n同时注意 `type: 'content'` 和 `type: 'data'` 的用法。在这种情况下，集合包含了内容创作格式（如 Markdown，`type:\
    \ 'content'`）和数据格式（如 JSON 或 YAML，`type: 'data'`）。\n\n### 显示内容\n\n"
- fmt: "\nNow that we know how to query data, let’s discuss how to actually display\
    \ it in a formatted way. Astro provides a convenient method called `render()`\
    \ to render the entire content of the Markdown into a built-in Astro component\
    \ called `<Content />`. How we build and display the content is also going to\
    \ be driven by whether we have static site generation or server-side rendering\
    \ mode.\n\nFor pre-rendering, we can use the `getStaticPaths()` method:\n\n```\n\
    // /src/pages/posts/[...slug].astro\n---\nimport { getCollection } from 'astro:content';\n\
    \nexport async function getStaticPaths() {\n  const blogEntries = await getCollection('blog');\n\
    \  return blogEntries.map(entry => ({\n    params: { slug: entry.slug }, props:\
    \ { entry },\n  }));\n}\n\nconst { entry } = Astro.props;\nconst { Content } =\
    \ await entry.render();\n---\n<h1>{entry.data.title}</h1>\n<Content />\n```\n\n\
    In the code above, we’re using `getStaticPaths()`. (We covered this method in\
    \ the second chapter of this book as a way to cater for dynamic routes.) We then\
    \ rely on `Astro.props` to capture the `entry`, which is going to be an object\
    \ that contains the metadata about the entry, an `id`, a `slug`, and a `render()`\
    \ method. This method is responsible for rendering the Markdown entry to HTML\
    \ in the Astro template, and it does so by creating a `<Content />` component.\
    \ What’s amazing about this is that all we need to do now is add the `<Content\
    \ />` component to our template and we’ll be able to see the Markdown content\
    \ rendered into HTML.\n\n## Rendering Options\n\nAs a refresher, or in case you\
    \ missed it, the second chapter of this book discusses the various rendering options\
    \ available.\n\nFor SSR, a slightly different approach needs to be followed. Instead\
    \ of using `getStaticPaths()`, `Astro.params` can be utilized, as the content\
    \ will be pulled and rendered at request time:\n\n```\n---\nimport { getEntry\
    \ } from 'astro:content';\n\nconst { slug } = Astro.params;\nconst entry = await\
    \ getEntry('blog', slug);\nconst { Content } = await entry.render();\n---\n<h1>{entry.data.title}</h1>\n\
    <Content />\n```\n\n## Integrating Tailwind CSS with Astro\n\nIn the introductory\
    \ tutorial, we talked about integrating Tailwind CSS with Astro. Tailwind has\
    \ a [typography plugin](https://tailwindcss.com/docs/typography-plugin) (`@tailwindcss/typography`)\
    \ that can be used to add styling to HTML rendered from Markdown. I recommend\
    \ that you check it out if you haven’t already. Please take a look at the screenshot\
    \ below. On the left is the rendered template from Markdown without the typography\
    \ plugin, and on the right is the rendered template with it.\n\n![The rendered\
    \ template with and without the typography plugin](Images/typography.png)\n\n\
    ## View Transitions\n\nThe [View Transitions API](https://developer.mozilla.org/en-US/docs/Web/API/View_Transitions_API)\
    \ offers a convenient way to generate animated transitions between various DOM\
    \ states while simultaneously updating the DOM content in a single operation.\
    \ Achieving this has traditionally been difficult on the Web, but with this new\
    \ API, transitions can be handled in a rather easy way. [Studies](https://developer.chrome.com/blog/view-transitions-case-studies/#redbus)\
    \ have shown that using the View Transitions API leads to a faster perceived site\
    \ performance.\n\nAstro supports view transitions out of the box, with a built-in\
    \ fallback mechanism for browsers that don’t currently support the API.\n\nThe\
    \ out-of-the-box solution supports built-in animations, animations for forward\
    \ and backward navigation, and automatic support for accessibility (via `prefers-reduced-motion`),\
    \ amongst many other things.\n\n### Prefers Reduced Motion\n\nThe `prefers-reduced-motion`\
    \ media query is important, as it allows web developers to create more inclusive\
    \ and accessible user experiences by respecting user preferences for reduced motion,\
    \ benefiting individuals with motion sensitivity or vestibular disorders.\n\n\
    ### Browser Support for View Transitions\n\nWhile the View Transition API is a\
    \ great innovation and is worth trying out, keep in mind that it’s still experimental\
    \ and currently has [only partial browser support](https://caniuse.com/view-transitions).\n\
    \nOne of the best ways to demonstrate view transitions is to utilize a video element\
    \ that will maintain its state between page transitions. (Do note that we can\
    \ also persist state between components that utilize the `client:*` directives\
    \ as well.) An example of this is shown in [this video](https://player.vimeo.com/video/884466855?h=fdaebb6dba&badge=0&autopause=0&quality_selector=1&player_id=0&app_id=58479).\n\
    \nLet’s assume that we have a `<Video />` component with this content:\n\n```\n\
    ---\n// src/components/Video\nconst src = 'https://res.cloudinary.com/tamas-demo/video/upload/f_auto,q_auto/imagecon/ship.mp4';\n\
    const {\n  autoplay = false,\n  controls = true,\n  loop = false\n} = Astro.props;\n\
    ---\n\n<video {controls} {autoplay} {loop} transition:persist>\n  <source {src}\
    \ />\n</video>\n```\n\nIn the code above, we’re grabbing a video from Cloudinary.\
    \ Additionally, we’re allowing the video to automatically play and loop (start\
    \ over) when it finishes, and we’re providing control buttons for the user. These\
    \ settings are determined by properties sent to this video component, and if these\
    \ properties aren’t provided, default values are used.\n\nPlease take note of\
    \ the `transition:persist` directive. With this directive, we’ll maintain the\
    \ state of the video player between transitions: while navigating to the next\
    \ page, other parts of the page will show the updated content. We can use this\
    \ component on both the `index.astro` and `about.astro` pages:\n\n```\n// src/pages/index.astro\n\
    ---\nimport Video from '../components/Video.astro';\n---\n<!-- some other HTML\
    \ -->\n<Video />\n```\n\nLastly, we need to enable page transitions, which we\
    \ can either do per page or globally for the entire project. Assuming that we\
    \ have a layout file of some sort, we can easily enable it, by importing `ViewTransitions`\
    \ from `astro:transitions`:\n\n```\n// src/layouts/Layout.astro\n---\nimport {\
    \ ViewTransitions } from 'astro:transitions';\n---\n<html lang=\"en\">\n  <head>\n\
    \    <title>My site!</title>\n    <ViewTransitions />\n  </head>\n  <body>\n \
    \   <slot />\n  </body>\n</html>\n```\n\nIn summary, the experimental View Transitions\
    \ API simplifies visual transitions between various pages or elements through\
    \ CSS pseudo-elements, JavaScript, and snapshots of the previous and current DOM\
    \ states. It presents a fresh chance to enhance the perceived performance of a\
    \ page, minimizing reliance on intricate custom JavaScript and CSS.\n\n## Demo\n\
    \nThe [demo that we’ve deployed on StackBlitz](https://stackblitz.com/github/tpiros/sitepoint-astro)\
    \ for this tutorial utilizes content collections. Take a look at `src/pages/posts.astro`,\
    \ the `src/content` folder and `src/pages/posts/[...slug].astro` to check out\
    \ the implementation details.\n\n## Conclusion\n\nIn this chapter, we delved into\
    \ two essential features in Astro: content collections and view transitions. Content\
    \ collection allows for efficient content management and data validation, particularly\
    \ when working with `.md` or `.mdx` files. View transitions, on the other hand,\
    \ provide a seamless way to enhance user navigation, all while maintaining excellent\
    \ performance.\n\nIn the next chapter in this series, we’ll take a look at the\
    \ built-in `Image` component in Astro, which allows for creating performant image\
    \ assets.\n"
