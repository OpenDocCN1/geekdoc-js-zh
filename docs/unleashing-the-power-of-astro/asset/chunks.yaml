  trans: "\n\n## 获取执行\n\n在启用服务端渲染（SSR）时，fetch 调用会在请求时执行；而在未启用 SSR（即 Astro 正常的静态站点渲染模式）时，fetch\
    \ 调用会在构建时执行\n\n让我们来看看它是如何运作的。在任何 `.astro` 页面中，我们可以直接使用类似下面的代码来获取数据：\n\n```\n---\n\
    const response = await fetch('an-api-endpoint');\nconst data = await response.json();\n\
    ---\n<pre>{JSON.stringify(data)}</pre>\n```\n\n上述代码向端点发送了 Fetch API 请求，将数据解析为\
    \ JSON 对象，然后使用简单的 `JSON.stringify` 方法显示数据。\n\n让我们创建另一个示例，通过获取真实数据来查看如何遍历结果。虽然世界上有很多免费的\
    \ REST API 可用，但我选择的是使用 [星球大战 API](https://swapi.dev)：\n\n```\n---\nconst response\
    \ = await fetch('https://swapi.dev/api/people');\nconst data = await response.json();\n\
    const characters = data.results;\n---\n<h1>Star Wars Characters</h1>\n<ul\n  {characters.map(({name})\
    \ => (\n    <li>{name}</li>\n  ))}\n</ul>\n```\n\n上述代码向上述 REST API 发起请求，处理数据，并使用标准的\
    \ JavaScript `map()` 方法遍历结果。\n\n注意，我们也可以消费作为项目一部分创建的 API 端点。（我们在上一节中介绍过服务器端点。）要实现此点，我们需要引用完整的\
    \ URL，但幸运的是 Astro 通过一个内置全局对象暴露了该内容：`Astro.url`。这是引用自定义构建的 API 调用时的代码写法：\n\n```\n\
    ---\nconst response = await fetch(`${Astro.url.origin}/api/endpoint`);\nconst\
    \ data = await response.json();\n---\n<pre>{JSON.stringify(data)}</pre>\n```\n\
    \n这使得检索数据变得极其简单。\n\n## 使用 GraphQL\n\n有时项目中的需求可能要求使用 GraphQL 而不是 REST API。（GraphQL\
    \ 是一种用于 API 的查询语言，允许客户端精确地请求它们所需的数据，与通常暴露一组具有预定义数据结构的固定端点的传统 REST API 相比，它有助于更高效、更灵活的数据检索。）\n\
    \nAstro 也可以无缝地与 GraphQL 端点交互并利用 Fetch API，因此我们仍然可以在不向项目添加任何额外依赖的情况下执行 GraphQL\
    \ 查询：\n\n```\n---\nconst method = 'POST';\nconst query = `{\n  query getDestination($id:\
    \ ID) {\n      destination($id) {\n        capital,\n        flag\n      }\n \
    \   }\n  }\n}`;\nconst variables = {\n  id: 'italy'\n}\n\nconst options = {\n\
    \  method,\n  body: {\n    query,\n    variables\n  }\n}\nconst response = await\
    \ fetch('/graphql/endpoint', options);\nconst data = await response.json();\n\
    ---\n<pre>{JSON.stringify(data)}</pre>\n```\n\n在上面的代码中，我们正在构建一个 GraphQL 查询，以从\
    \ GraphQL 服务获取关于目的地的信息。作为查询的一部分，我们请求了首都是旗帜。由于这是一个参数化的 GraphQL 查询，我们还指定了 `id` 的取值。\n\
    \n接下来，我们创建了一个 `options` 对象，它将确保我们的 Fetch API 请求使用 `POST` HTTP 方法，并将 GraphQL 查询及其变量作为请求体的一部分发送。代码的其余部分是非常自言易懂的：我们发起请求，处理响应，并使用\
    \ `JSON.stringify()` 将其显示。\n\n## 从服务器端点检索数据\n\n如上一节所述，Astro 可以创建服务器 API 端点，也可以消费从这些服务器端点返回的数据。\n\
    \n假设我们已经添加了 `src/pages/api/products.json`（一个服务器 API 端点）。在这种情况下，我们可以通过在任何 `src/pages/`\
    \ 页面中添加类似的内容来轻松访问它，如下所示：\n\n```\n---\nconst response = await fetch(`${Astro.url.origin}/api/products.json`);\n\
    const products = await response.json();\n---\n<ul>\n  {products.map((data) =>\
    \ <li>{data.name}</li>)}\n</ul>\n```\n\n在这段代码中，我们向 Astro 端点发送请求，获取结果并将其存储在 `products`\
    \ 中。由于返回的数据是一个数组，我们可以使用 `map()` 方法进行遍历。\n\n### 受边界保护的敏感数据\n\n请记住，由于 `---` 边界之间的代码是在构建时执行的，因此在获取数据中使用\
    \ API 密钥和其他方法也是安全的。\n\n## 表单\n\n虽然处理表单数据不一定与数据检索直接相关，但在这里提到它是值得的。在 Astro 中，我们不仅可以依靠\
    \ `Astro.request` 来检查传入的方法（通过 `.method` 属性）是否为 `POST` 方法，还可以访问从 UI 界面发送的 `formData`。\n\
    \n### formData 和 SSR\n\n注意，`formData` 只有在启用服务端渲染时可用。\n\n你可以在 `.astro` 文件的脚本部分访问任何形式的表单数据：\n\
    \n```\n---\nif (Astro.request.method === 'POST') {\n  const data = await Astro.request.formData();\n\
    \  const name = data.get('name');\n  // 处理 'data'\n}\n---\n<h1>Form</h1>\n<form\
    \ method=\"post\">\n  <input type=\"text\" name=\"name\" />\n  <button>Submit</button>\n\
    </form>\n```\n\n"
- fmt: "\nOne of the notable additions in Astro version 2 was the introduction of\
    \ content collections. This feature proves particularly valuable when working\
    \ with `.md` or `.mdx` files. Content collections empower us to effectively manage\
    \ our content while also enabling data validation and TypeScript type safety for\
    \ all the content within an Astro project.\n\nSince Astro version 3, and with\
    \ added features in version 4, view transitions are also part of Astro. In fact,\
    \ Astro was the first framework to implement this new web feature. `View transitions`\
    \ serve as a user navigation aid: they enable the seamless redirection of user\
    \ attention towards the core message of a web page, allowing for a rich user experience.\
    \ With view transitions, the user experience can be improved with no cost to performance.\n\
    \n## Getting Started with Content Collections\n\nTo make use of content collections,\
    \ Astro designates a special folder: `src/content`. Subsequently, we can create\
    \ subfolders within this location, each generating individual content collections.\
    \ For instance, we could create collections such as `src/content/dev-blog` and\
    \ `src/content/corporate-blog`.\n\n![The architecture of our collections](Images/4.png)\n\
    \nEach content collection can be configured in a config file—`/src/content/config.js`\
    \ (or `.ts`)—where we have the option to employ collection schemas using [Zod](https://zod.dev).\n\
    \nZod is a “TypeScript-first schema validation with static type inference” that’s\
    \ integrated into Astro. Here’s an example of how this would take shape:\n\n```javascript\n\
    // src/content/config.js\nimport { z, defineCollection } from 'astro:content';\n\
    \nconst devBlogCollection = defineCollection({\n  schema: z.object({\n    title:\
    \ z.string(),\n    author: z.string().default('The Dev Team'),\n    tags: z.array(z.string()),\n\
    \    date: z.date(),\n    draft: z.boolean().default(true),\n    description:\
    \ z.string(),\n  }),\n});\n\nconst corporateBlogCollection = defineCollection({\n\
    \  schema: z.object({\n    title: z.string(),\n    author: z.string(),\n    date:\
    \ z.date(),\n    featured: z.boolean(),\n    language: z.enum(['en', 'es']),\n\
    \  }),\n});\n\nexport const collections = {\n  devblog: devBlogCollection,\n \
    \ corporateblog: corporateBlogCollection,\n};\n```\n\nIn the code above, we’re\
    \ defining two content collections—one for a “developer blog” and one for a “corporate\
    \ blog”. The `defineCollection` method allows us to create a `schema` for any\
    \ given collection. For the “developer blog”, we’re creating a schema where the\
    \ articles for this blog category must have a title (string), author (string defaulting\
    \ to “The Dev Team”), tags (array of strings), date (date type), draft (Boolean\
    \ defaulting to `true`) and a description (string).\n\nFor the “corporate blog”,\
    \ our schema is a little bit different: we have a string for both the title and\
    \ the author. Date (data type) is also going to be required by the content, as\
    \ well as the featured (Boolean) flag and a language (enum), which can either\
    \ be set to `en` or `es`.\n\nLastly, we’re exporting a `collections` object with\
    \ two properties, `devblog` and `corporateblog`. These will be used later on.\n\
    \n### Markdown Files and Frontmatter\n\nThe examples in this tutorial about content\
    \ collection assume that the `.md` files also include `frontmatter` matching the\
    \ schema specified above in the configuration file. As an example, this is what\
    \ a sample “corporate blog” post would look like:\n\n```markdown\n---\ntitle:\
    \ 'Buy!!'\nauthor: 'Jack from Marketing'\ndate: 2023-07-19\nfeatured: true\nlanguage:\
    \ 'en'\n---\n\n# Some Marketing Promo\n\nThis is the best product!\n```\n\n###\
    \ Slug Creation\n\nAstro will automatically generate slugs for posts based on\
    \ the file name. For example, the slug for `first-post.md` will be `first-post`.\
    \ However, if we provide a `slug` entry in our `frontmatter`, Astro will respect\
    \ that and use our custom slug.\n\nBear in mind that the properties specified\
    \ in the `export const collections` object must match the folder names where the\
    \ content is going to live. (Also note that they’re case sensitive!)\n\n### Querying\
    \ Data\n\nOnce we have all the Markdown files in place (in our case, that would\
    \ be under `src/content/devblog` and `src/content/corporateblog`) and our `config.js`\
    \ file ready, we can start to query data from the collections, which is a straightforward\
    \ process:\n\n```javascript\n---\nimport { getCollection } from 'astro:content';\n\
    const allDevPosts = await getCollection('devblog');\nconst allCorporatePosts =\
    \ await getCollection('corporateblog');\n---\n<pre>{JSON.stringify(allDevPosts)}</pre>\n\
    <pre>{JSON.stringify(allCorporatePosts)}</pre>\n```\n\nAs seen above, the `getCollection`\
    \ method can be used to retrieve all the entries from a given collection (again,\
    \ referencing the exported collection names from earlier). In the example above,\
    \ we retrieve all the posts from both the “developer blog” (`devblog`) and from\
    \ the “corporate blog” (`corporateblog`). In the template, we simply return the\
    \ raw data using `JSON.stringify()`.\n\nWe should also examine the data that’s\
    \ being displayed via `JSON.stringify()`, and we should take note that, other\
    \ than the `frontmatter` data, we also get an `id`, a `slug`, and a `body` property\
    \ returned to use where the latter contains the post’s content.\n\nWe can also\
    \ filter for drafts or posts in a particular language in the `frontmatter` by\
    \ iterating through:\n\n```javascript\nimport { getCollection } from 'astro:content';\n\
    \nconst spanishEntries = await getCollection('corporateblog', ({ data }) => {\n\
    \  return data.language === 'es';\n});\n```\n\n`getCollection` returns all the\
    \ posts, but we can also use `getEntry` to return a single entry from a collection:\n\
    \n```javascript\nimport { getEntry } from 'astro:content';\n\nconst singleEntry\
    \ = await getEntry('corporateblog', 'article-1');\n```\n\n### getCollection vs\
    \ getEntries\n\nWhile there are two ways to return multiple posts from collections,\
    \ there’s a subtle difference between the two of them. `getCollection()` retrieves\
    \ a list of content entries by collection name, while `getEntries()` retrieves\
    \ multiple collection entries from the same collection.\n\nThe Astro documentation\
    \ gives the example of `getEntries()` being used to retrieve content when using\
    \ reference entities (for example, a list of related posts). The concept of related\
    \ posts is where we can reference an array of posts from a collection. This can\
    \ be achieved by adding the following to the schema when using the `defineCollection`\
    \ method:\n\n```javascript\nimport { defineCollection, reference, z } from 'astro:content';\n\
    \nconst devblog = defineCollection({\n  type: 'content',\n  schema: z.object({\n\
    \    title: z.string(),\n    relatedPosts: z.array(reference('blog')),\n  }),\n\
    });\n```\n\nIn the code above, we’re also importing `reference` and using that\
    \ when adding `relatedPosts` to our schema. (Note that we can call this whatever\
    \ we want, such as `recommendedPosts` or `followupPosts`.)\n\nTo use these `relatedPosts`,\
    \ the appropriate slug values should be added to the `frontmatter` part of the\
    \ Markdown:\n\n```markdown\n---\ntitle: \"This is a post\"\nrelatedPosts:\n\n\
    - A related post # `src/content/devblog/a-related-post.md\n```\n\nReference entities\
    \ are defined in the `config.js` file for the content collection and use the `reference`\
    \ method from Zod:\n\n```javascript\nconst blog = defineCollection({\n  type:\
    \ 'content',\n  schema: z.object({\n    title: z.string(),\n    relatedPosts:\
    \ z.array(reference('blog')).optional(),\n    author: reference('author'),\n \
    \ }),\n});\n\nconst author = defineCollection({\n  type: 'data',\n  schema: z.object({\n\
    \    name: z.string(),\n  }),\n});\n```\n\nAlso, notice the usage of `type: 'content'`\
    \ and `type: 'data'`. In this case, the collection encompasses both content authoring\
    \ formats such as Markdown (`type: 'content'`) and data formats like JSON or YAML\
    \ (`type: 'data'`).\n\n### Displaying the Content\n"
