    \ the \"slot\"</p>\n</Layout>\n```\n\n## Components\n\nApart from layout components,\
    \ a recommended practice is to create a `src/components` folder for storing various\
    \ components. In Astro, we can include components of any “type”—including both\
    \ `.astro` and `.jsx` components, for example. One of the powerful features of\
    \ Astro is that a component created in another framework can be added.\n\nTo do\
    \ this, we first need to install the appropriate integration. (For React, it would\
    \ be `@astrojs/react`, as explained [in the docs](https://docs.astro.build/en/guides/integrations-guide/react/).)\
    \ After the installation, we can take a look at an example of adding a React component\
    \ to Astro:\n\n```javascript\nimport { useState } from 'react';\n\nconst Counter\
    \ = () => {\n  const [counter, setCounter] = useState(0);\n\n  const increment\
    \ = () => {\n    setCounter(counter + 1);\n  };\n\n  const decrement = () => {\n\
    \    setCounter(counter - 1);\n  };\n\n  return (\n    <div>\n      <h1>Counter:\
    \ {counter}</h1>\n      <button onClick={increment}> + </button>\n      <button\
    \ onClick={decrement}> - </button>\n    </div>\n  );\n};\n\nexport default Counter;\n\
    ```\n\nThe code above is a React component with a counter that can be incremented\
    \ and decremented. Let’s add this to Astro now:\n\n```astro\n---\nimport Counter\
    \ from '../components/Counter.jsx';\n---\n<Counter client:only=\"react\" />\n\
    ```\n\nNotice `client:only=\"react\"`, which is one of the [client directives](https://docs.astro.build/en/reference/directives-reference/).\
    \ There are multiple ways to use these, and we’ll get back to them at the end\
    \ of this chapter.\n\n## Routing\n\nAs previously discussed, Astro routing revolves\
    \ around files in the `src/pages` folder. In this chapter, we’ll cover three types\
    \ of routes: static routes, dynamic routes, and server endpoints (API routes).\n\
    \n### Static Routes\n\nStatic routes are pretty straightforward: `.astro` files\
    \ become routes in the `src/pages` folder. For example:\n\n* `src/pages/about.astro`\
    \ becomes `example.com/about`\n* `src/pages/destinations/london.astro` becomes\
    \ `example.com/destinations/london`\n\nPlease recall from the previous chapter\
    \ that `.md`, `.mdx`, and `.html` files can also generate routes. For instance,\
    \ `/src/pages/hello.md` becomes `example.com/hello`.\n\n### Dynamic Routes\n\n\
    Dynamic routes are helpful when it’s impractical to manually create routes due\
    \ to dynamic changes. For example, what if we’re working on a page that lists\
    \ destinations, and there are over 100 destinations (or an unknown number of them)?\
    \ Creating individual `.astro` files for each possible route combination isn’t\
    \ viable.\n\nInstead, we can instruct Astro to use dynamic routes: `src/pages/[destination]`\
    \ would then become `src/pages/*`, effectively handling all potential variations\
    \ such as `example.com/london`, `example.com/singapore` and so on. (Note that\
    \ the route actually requires the `[]` characters.)\n\nTo facilitate dynamic routes,\
    \ Astro requires some information on how to generate files for dynamic routes.\
    \ This is achieved through the built-in `getStaticPaths()` method. It returns\
    \ an array of objects, each containing a mandatory `params` object. This object\
    \ should match the dynamic route definition (such as `destination` in our case):\n\
    \n```astro\n---\nconst { destination } = Astro.params;\n\nexport function getStaticPaths()\
    \ {\n  const destinations = [\n    'london',\n    'rome',\n    'sanfrancisco',\n\
    \    'singapore',\n    'cairo',\n    'medellin',\n  ];\n  // ☝\U0001F3FC remember,\
    \ since this JavaScript is executed on the server, we could pull this data from\
    \ a REST API endpoint as well\n  return destinations.map((destination) => ({ params:\
    \ { destination } }));\n}\n---\n<h1>Welcome to: {destination}</h1>\n```\n\nFor\
    \ situations where multiple parameters need to be handled (such as `/src/pages/[city]-[country].astro`),\
    \ we can pass multiple props to the params object:\n\n```javascript\nreturn [{\
    \ params: { city: 'london', country: 'uk' } }];\n```\n\n#### 404 Pages\n\nIf there’s\
    \ a page that doesn’t match a route, Astro will generate a 404 page. Customizing\
    \ the content of this page is possible by creating a `404.astro` page in the `src/pages`\
    \ folder.\n\n#### Rest Params\n\nAstro also supports rest parameters in dynamic\
    \ URL routing, as seen in `src/pages/destinations/[...path].astro`. This offers\
    \ greater flexibility. For example, we could match a path with any combination\
    \ such as `example.com/destinations/london` and `example.com/london` as well as\
    \ `example.com/destinations/favourites/rome`.\n\n#### Path Undefined\n\nReturning\
    \ `{params: { path: undefined }}` in `getSTaticPaths()` effectively matches `example.com/destinations/`.\n\
    \n## Server-side Rendering\n\nBefore we continue with our discussion on routing,\
    \ let’s divert a little bit to discuss another very important aspect of Astro:\
    \ server-side rendering.\n\nTo recap, the default behavior of Astro is static\
    \ site generation. This means that all the pages are built during build time.\
    \ However, there can be situations when this isn’t the right approach; things\
    \ that are dynamic in nature require server-side rendering. Imagine we had a small\
    \ ecommerce site, and after each successful purchase we had to rebuild our entire\
    \ site to show a modified stock count for a product. This wouldn’t only be unviable,\
    \ but there would be times when incorrect stock information would be shown. Server-side\
    \ rendering solves this problem, because the page content is rendered at the request\
    \ time, which means that the most up-to-date information can arrive from the server.\n\
    \nEarlier we talked about the `astro.config.mjs` file before. This is the place\
    \ where we can switch on server-side rendering:\n\n```javascript\nimport { defineConfig\
    \ } from 'astro/config';\nimport nodejs from '@astrojs/node';\n\nexport default\
    \ defineConfig({\n  output: 'server',\n  adapter: nodejs(),\n});\n```\n\n`output:\
    \ 'server'` is the key here, but also take note of the `adapter` setting. An adapter\
    \ is needed because server-side rendering requires a runtime where server-side\
    \ code is going to be executed.\n\n#### Adding the Node Adapter\n\nWe also need\
    \ to run the `npx astro add node` command to install and let Astro automatically\
    \ configure the `nodejs()` adapter for our project.\n\nThe key takeaway here is\
    \ that, with this setting, we’re now switching off Astro’s default static rendering\
    \ mechanism and swapping it out for server-side rendering—for all the pages.\n\
    \nBut what if we have pages where we don’t want to utilize SSR? Luckily, Astro\
    \ allows us to selectively turn off SSR and re-enable the default rendering behavior\
    \ on a per-route basis. Make sure the following is added on the top of any page\
    \ route:\n\n```astro\n---\nexport const prerender = true;\n---\n<p>This page is\
    \ pre-rendered at build time</p>\n```\n\n### Hybrid Rendering\n\nEven better,\
    \ we can do the same, but in reverse, so to speak: as opposed to setting the `output:\
    \ 'server'` option, we can set `output: 'hybrid'`, which means that the default\
    \ behavior is kept (static site generation at build time), and then we can add\
    \ the following to page routes where we explicitly want to have SSR enabled:\n\
    \n```astro\n---\nexport const prerender = false;\n---\n<p>This is now server-rendered</p>\n\
    ```\n\n## Server-side Rendering Routes\n\nNow let’s continue our discussion on\
    \ routes. For server-side rendered pages, `getStaticPaths()` shouldn’t be used,\
    \ as the content is rendered at request time, not at build time.\n\n### Endpoints\n"
