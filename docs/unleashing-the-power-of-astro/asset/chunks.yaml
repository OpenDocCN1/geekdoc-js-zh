    ```\n\nThe code above makes a Fetch API request to an endpoint, parses the data\
    \ to a JSON object, and then uses a simple `JSON.stringify` method to display\
    \ the data.\n\nLet’s create another example where we fetch real data to see how\
    \ to iterate through the results. While there are plenty of free REST APIs available\
    \ out there, my choice is to use the [Star Wars API](https://swapi.dev):\n\n```\n\
    ---\nconst response = await fetch('https://swapi.dev/api/people');\nconst data\
    \ = await response.json();\nconst characters = data.results;\n---\n<h1>Star Wars\
    \ Characters</h1>\n<ul>\n  {characters.map(({name}) => (\n    <li>{name}</li>\n\
    \  ))}\n</ul>\n```\n\nThe code above makes the request to the aforementioned REST\
    \ API, processes the data, and iterates through the results by using the standard\
    \ JavaScript `map()` method.\n\nNote that we can also consume an API endpoint\
    \ created as part of the project. (We covered server endpoints in the previous\
    \ chapter.) To do this, we need to reference the full URL, but luckily Astro exposes\
    \ that via a built-in global object: `Astro.url`. This is how the code looks when\
    \ referencing a custom-built API call:\n\n```\n---\nconst response = await fetch(`${Astro.url.origin}/api/endpoint`);\n\
    const data = await response.json();\n---\n<pre>{JSON.stringify(data)}</pre>\n\
    ```\n\nThis makes it incredibly easy to retrieve data.\n\n## Working with GraphQL\n\
    \nSometimes there may be a requirement in a project to use GraphQL instead of\
    \ a REST API. (GraphQL is a query language for APIs that enables clients to request\
    \ precisely the data they need, facilitating more efficient and flexible data\
    \ retrieval compared to traditional REST APIs, which typically expose a set of\
    \ fixed endpoints with pre-defined data structures.)\n\nAstro can also seamlessly\
    \ interact with GraphQL endpoints and utilize the Fetch API, so again, we can\
    \ execute GraphQL queries with no additional dependencies added to a project:\n\
    \n```\n---\nconst method = 'POST';\nconst query = `{\n  query getDestination($id:\
    \ ID) {\n      destination($id) {\n        capital,\n        flag\n      }\n \
    \   }\n  }\n}`;\nconst variables = {\n  id: 'italy'\n}\n\nconst options = {\n\
    \  method,\n  body: {\n    query,\n    variables\n  }\n}\nconst response = await\
    \ fetch('/graphql/endpoint', options);\nconst data = await response.json();\n\
    ---\n<pre>{JSON.stringify(data)}</pre>\n```\n\nIn the code above, we’re constructing\
    \ a GraphQL query to get information from a GraphQL service about a destination.\
    \ As part of the query, we’re requesting the capital and the flag. Since this\
    \ is a parameterized GraphQL query, we’re also specifying what the `id` should\
    \ be.\n\nNext, we create an `options` object, which will make sure that our Fetch\
    \ API request is using the HTTP method of `POST`, and that the GraphQL query and\
    \ its variable are sent as part of the request body. The rest of the code is pretty\
    \ self explanatory: we make the request, process the response, and display that\
    \ using `JSON.stringify()`.\n\n## Data Retrieval from a Server Endpoint\n\nAs\
    \ discussed in the previous chapter, Astro can create server API endpoints, and\
    \ it’s possible to consume data returned from these server endpoints as well.\n\
    \nSuppose we’ve added `src/pages/api/products.json.js` (a server API endpoint).\
    \ In that case, we can easily access it on any `src/pages/` page by adding something\
    \ similar to a `.astro` file, like so:\n\n```\n---\nconst response = await fetch(`${Astro.url.origin}/api/products.json`);\n\
    const products = await response.json();\n---\n<ul>\n  {products.map((data) =>\
    \ <li>{data.name}</li>)}\n</ul>\n```\n\nIn this block of code, we’re making a\
    \ request against an Astro server endpoint, grabbing the results, and storing\
    \ them in a `products` variable. Since the data we get back is an array, we can\
    \ iterate through that using the `map()` method.\n\n#### Sensitive Data Protected\
    \ by Fences\n\nRemember that, since the code between the `---` fences is executed\
    \ at build time, it’s safe to use API keys and other methods even for data fetching.\n\
    \n## Forms\n\nThough working with form data isn’t necessarily directly related\
    \ to data retrieval, it’s still worth mentioning it here. With Astro, we can rely\
    \ on `Astro.request` not only to check if the incoming method (via the `.method`\
    \ property) is a `POST` method, but we can also access `formData` sent from the\
    \ UI interface.\n\n#### formData and SSR\n\nNote that `formData` is only available\
    \ if we have server-side rendering enabled.\n\nYou can access any form of data\
    \ in the script section of `.astro` files:\n\n```\n---\nif (Astro.request.method\
    \ === 'POST') {\n  const data = await Astro.request.formData();\n  const name\
    \ = data.get('name');\n  // Process 'data' or 'name,' e.g., send it to a server\
    \ via `fetch()`\n}\n---\n<h1>Form</h1>\n  <form method=\"post\">\n  <input type=\"\
    text\" name=\"name\" />\n  <button>Submit</button>\n</form>\n```\n\nThe code above\
    \ first checks if the request method is using the HTTP `POST` method. Since we’re\
    \ using `method=\"post\"` on the form in the HTML template, the `if` clause will\
    \ trigger and we’ll be able to access the data from the form by using `Astro.request.formData()`.\
    \ Once we have that data, we can use the `get()` method to grab the value from\
    \ `<input type=\"text\" name=\"name\" />`. Please note that the input’s `name`\
    \ attribute matches the value passed to the `get()` method.\n\n## Headless CMS\n\
    \nOften data will be coming from a CMS of some sort. The good news (yet again!)\
    \ is that Astro can also be [integrated with various Headless CMS providers](https://docs.astro.build/en/guides/cms/).\n\
    \nIt’s worth noting that these out-of-the-box integrations are great, but we can\
    \ also work with a CMS that isn’t on the list. One prominent example is [Strapi](https://strapi.io),\
    \ which exposes its data via API endpoints (as well as GraphQL queries)—meaning\
    \ that we can simply use that CMS by utilizing the Fetch API in Astro for even\
    \ greater flexibility.\n\n## Demo\n\nThe demo for this tutorial series on [stackblitz.com](https://stackblitz.com/github/tpiros/sitepoint-astro).\
    \ Take a look at `characters.astro` to see how a Fetch API request is done.\n\n\
    ## Conclusion\n\nIn this chapter, we dived deep into the realm of data retrieval\
    \ with Astro. Data fetching—a fundamental pillar of web applications—opens the\
    \ door to dynamic content, enabling the integration of data from sources like\
    \ content management systems and providing the means for personalization by fetching\
    \ user-specific information.\n\nThe beauty of Astro lies in its native support\
    \ for modern web APIs and top-level `await`, allowing effortless use of the Fetch\
    \ API without any third-party dependencies. With server-side rendering, fetch\
    \ calls occur at request time, whereas in Astro’s default static site rendering\
    \ mode they take place at build time.\n\nWe also delved into the world of GraphQL,\
    \ demonstrating how Astro seamlessly interacts with GraphQL endpoints, utilizing\
    \ the Fetch API to execute GraphQL queries as well.\n\nLastly, we highlighted\
    \ Astro’s versatility in working with headless content management systems. Whether\
    \ through out-of-the-box integrations or custom interactions with CMS providers\
    \ like Strapi, Astro offers flexibility and ease in integrating external data\
    \ sources, further expanding its capabilities in data retrieval for web applications.\n\
    \nIn the next chapter, we’ll learn how to work with content collections in Astro.\n\
    \n# Chapter 4: Getting Started with Content Collections and View Transitions in\
    \ Astro\n\nIn this chapter, we’ll take a look at content collections and view\
    \ transitions."
