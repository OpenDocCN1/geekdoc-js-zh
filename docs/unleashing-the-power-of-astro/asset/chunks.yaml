    \ and accessible user experiences by respecting user preferences for reduced motion,\
    \ benefiting individuals with motion sensitivity or vestibular disorders.\n\n\
    #### Browser Support for View Transitions\n\nWhile the View Transition API is\
    \ a great innovation and is worth trying out, keep in mind that it’s still experimental\
    \ and currently has [only partial browser support](https://caniuse.com/view-transitions).\n\
    \nOne of the best ways to demonstrate view transitions is to utilize a video element\
    \ that will maintain its state between page transitions. (Do note that we can\
    \ also persist state between components that utilize the `client:*` directives\
    \ as well.) An example of this is shown in [this video](https://player.vimeo.com/video/884466855?h=fdaebb6dba&badge=0&autopause=0&quality_selector=1&player_id=0&app_id=58479).\n\
    \nLet’s assume that we have a `<Video />` component with this content:\n\n```\n\
    ---\n// src/components/Video\nconst src = 'https://res.cloudinary.com/tamas-demo/video/upload/f_auto,q_auto/imagecon/ship.mp4';\n\
    const {\n  autoplay = false,\n  controls = true,\n  loop = false\n} = Astro.props;\n\
    ---\n\n<video {controls} {autoplay} {loop} transition:persist>\n  <source {src}\
    \ />\n</video>\n```\n\nIn the code above, we’re grabbing a video from Cloudinary.\
    \ Additionally, we’re allowing the video to automatically play and loop (start\
    \ over) when it finishes, and we’re providing control buttons for the user. These\
    \ settings are determined by properties sent to this video component, and if these\
    \ properties aren’t provided, default values are used. These variables are then\
    \ added to the HTML `<video>` and `<source>` elements.\n\nPlease take note of\
    \ the `transition:persist` directive. With this directive, we’ll maintain the\
    \ state of the video player between transitions: while navigating to the next\
    \ page, the video will keep on playing, while other parts of the page will show\
    \ the updated content. We can use this component on both the `index.astro` and\
    \ `about.astro` pages:\n\n```\n// src/pages/index.astro\n---\nimport Video from\
    \ '../components/Video.astro';\n---\n<!-- some other HTML -->\n<Video />\n```\n\
    \nLastly, we need to enable page transitions, which we can either do per page\
    \ or globally for the entire project. Assuming that we have a layout file of some\
    \ sort, we can easily enable it, by importing `ViewTransitions` from `astro:transitions`:\n\
    \n```\n// src/layouts/Layout.astro\n---\nimport { ViewTransitions } from 'astro:transitions';\n\
    ---\n<html lang=\"en\">\n  <head>\n    <title>My site!</title>\n    <ViewTransitions\
    \ />\n  </head>\n  <body>\n    <slot />\n  </body>\n</html>\n```\n\nIn summary,\
    \ the experimental View Transitions API simplifies visual transitions between\
    \ various pages or elements through CSS pseudo-elements, JavaScript, and snapshots\
    \ of the previous and current DOM states. It presents a fresh chance to enhance\
    \ the perceived performance of a page, minimizing reliance on intricate custom\
    \ JavaScript and CSS.\n\n## Demo\n\nThe [demo that we’ve deployed on StackBlitz](https://stackblitz.com/github/tpiros/sitepoint-astro)\
    \ for this tutorial utilizes content collections. Take a look at `src/pages/posts.astro`,\
    \ the `src/content` folder and `src/pages/posts/[...slug].astro` to check out\
    \ the implementation details.\n\n## Conclusion\n\nIn this chapter, we delved into\
    \ two essential features in Astro: content collections and view transitions. Content\
    \ collection allows for efficient content management and data validation, particularly\
    \ when working with `.md` or `.mdx` files. View transitions, on the other hand,\
    \ provide a seamless way to enhance user navigation, all while maintaining excellent\
    \ performance.\n\nIn the next chapter in this series, we’ll take a look at the\
    \ built-in `Image` component in Astro, which allows for creating performant image\
    \ assets.\n\n# Chapter 5: Image Optimization and Deploying Our First Astro Site\n\
    \nIn this final chapter, we’ll look at the image optimization options offered\
    \ by Astro, and we’ll learn how to deploy a production-ready site built with Astro."
