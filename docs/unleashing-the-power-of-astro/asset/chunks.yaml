    取决于我们是否开启了静态站点生成模式或服务器端渲染模式，我们可以使用的部署提供商类型会发生变化。例如，静态站点可以轻松地部署到 GitHub Pages 或
    Cloudflare Pages，而利用 SSR 的站点可以部署到 Netlify 或 Vercel。有关提供的完整且可筛选部署选项列表，请[参考 Astro
    文档](https://docs.astro.build/en/guides/deploy/)。


    此外，请记住，当使用 Astro 的 SSR 模式时，我们需要相应地[安装并配置适配器](https://docs.astro.build/en/guides/server-side-rendering/#adding-an-adapter)。


    ## 结论


    由于这是最后一章，让我们总结一下我们学到的内容。


    Astro 是一个现代前端框架，允许开发者创建高性能的网站。它将静态站点生成的优势与动态交互性相结合，使其成为构建快速高效 Web 应用的强大选择。Astro
    对性能和开发者体验的关注，使得该框架在寻求新颖 Web 开发方式的开发者中变得越来越流行。


    在书中，我们研究了 Astro 多能的渲染模型，该模型融合了静态站点生成和服务器端渲染。它允许开发者选择内容的渲染方式和时，提供了极佳的灵活性。


    我们还研究了 Astro 的数据获取功能。Astro 支持顶层 `await`，使得从 API 或其他源获取数据变得简单。开发者可以使用 `Fetch API`
    和现代 Web API，而无需第三方依赖。


    我们还讨论了内容集合（content collections），这是管理内容的一项重要功能，特别是在处理 Markdown（`.md` 或 `.mdx`）文件时。它让开发者能够轻松在
    Astro 项目中维护和验证内容，同时确保 TypeScript 的类型安全。在该章中，我们还探索了 `View Transition API`——这是一个浏览器实验性功能，通过结合
    CSS 伪元素、JavaScript 和 DOM 状态快照，简化页面或元素之间的视觉过渡。


    在最后一章中，我们查看了 Astro 的图像优化能力，以减少图像对 Web 应用的性能影响。Astro 内置的图像优化功能允许开发者在不影响加载时间的情况下创建具有视觉吸引力的网站。


    希望你喜欢这一系列关于 Astro 的文章，并且像我一样对 Astro 热热。学习过程的最后一步是付诸实践。今天就去尝试 Astro 吧！


    '
