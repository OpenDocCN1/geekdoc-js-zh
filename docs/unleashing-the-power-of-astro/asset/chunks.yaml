  trans: "\n\nAstro 有两种类型的端点：静态（Static）和 API/服务器（Server）。可以通过向 `src/pages` 目录添加 `.js`\
    \ 或 `.ts` 文件来创建静态端点，这些文件会在构建时被调用以生成静态文件。还需要注意的是，在构建过程中扩展名会被移除。例如，`src/pages/destinations.json.js`\
    \ 将变为 `/destinations.json`。\n\n端点可以访问 `request` 和 `params` 对象，并且应该导出一个 `GET` 函数。此外，还支持动态路由（通过\
    \ `[]` 文件命名约定）。将之前的示例使用 `getStaticPaths()` 重构为端点，其如下所示：\n\n```\n// src/pages/api/[destination].json.js\n\
    const destinations = [\n  'london',\n  'rome',\n  'sanfrancisco',\n  'singapore',\n\
    \  'cairo',\n  'medellin',\n];\n\nexport const GET = ({ params }) => {\n  const\
    \ { destination } = params;\n  const [myDestination] = destinations.filter(\n\
    \    (destination) => destination === destination\n  );\n  return new Response(\n\
    \    JSON.stringify({\n      destination: myDestination,\n    })\n  );\n};\n\n\
    export function getStaticPaths() {\n  return destinations.map((destination) =>\
    \ {\n    return {\n      params: {\n        destination,\n      },\n    };\n \
    \ });\n}\n```\n\n### 使用 api 文件夹\n\n注意，使用 `api` 文件夹并不是强制的，但它提供了良好的关注点分离，我们强烈建议使用它来存储\
    \ API 端点。\n\n### 访问 request 对象\n\n端点也可以访问 `request` 对象，但在静态模式下，`request.url` 是该对象唯一的可用属性。\n\
    \n### 服务器端点\n\n要创建服务器端点（API 路由），我们需要在 Astro 的配置文件启用 SSR 模式。\n\n在页面目录中添加 `.js`\
    \ 或 `.ts` 文件可以创建 REST API 端点，它们不仅可以使用 `GET` 方法，还可以访问所有其他 CRUD 方法（`POST`、`PUT`,`DELETE`）。\n\
    \n### 处理 GET、POST 和 DELETE 请求\n\n处理 HTTP 删除请求时，在 Astro 中使用 `del`，因为 `delete` 是\
    \ JavaScript 的内置关键字。\n\n下面的示例说明了如何在 Astro 中处理 HTTP `GET`、`POST` 和 `DELETE` 请求。`GET`\
    \ 方法接受参数（注意路由的定义方式：`src/pages/api/[id].json.js`）。由于路由中有 `[id]`，我们可以对 `params`\
    \ 对象进行解构并获取 `id` 的值。`GET` 方法中的其余代码执行了一个假设的数据库查询，并返回一个带有查询数据的响应。\n\n`POST` 方法检查请求中是否发送了\
    \ `Authorization` 请求头。如果没有，我们返回 HTTP 状态码 401（未授权）。注意我们在这里简化了代码，身份验证/授权需要更多步骤)。如果一切正常，我们解析作为请求部分发送的数据，执行一个假设的数据库插入，并返回成功的\
    \ 201 消息：\n\n```\n// src/pages/api/[id].json.js\nimport { getCityData, addCity\
    \ } from './fake-db.js';\n\nexport const GET = async ({ params }) => {\n  const\
    \ { id } = params;\n  const cityData = await getCityData(id);\n  return new Response(JSON.stringify(cityData),\
    \ {\n    status: 200,\n    headers: {\n      'Content-Type': 'application/json',\n\
    \    },\n  });\n};\n\nexport const POST = async ({ request }) => {\n  if (!request.headers.get('Authorization'))\
    \ {\n    return new Response(null, { status: 401 });\n  }\n  const body = await\
    \ request.json();\n  const city = body.city;\n  await addCity(city);\n  return\
    \ new Response(\n    JSON.stringify({\n      message: 'City added',\n    }),\n\
    \    {\n      status: 201,\n    }\n  );\n};\n\nexport const DEL = ({ request })\
    \ => {\n  // Handle HTTP delete\n};\n```\n\n### 使用 request 对象\n\n注意，充分利用 `request`\
    \ 对象来实现授权并接收传入的数据（这些可能来自表单）是非常重要的。\n\n## 交互式组件的水化（Hydration）\n\n在上一章中，我们讨论了 Astro\
    \ 的孤屿架构，这基本上是将 Web 应用程序分解为孤立岛的方法，每个岛负责渲染页面的特定部分。此外，这种架构还可以决定哪些元素需要加载 JavaScript。\n\
    \n本章将讨论的最后一点是 Astro 如何水化交互式组件。通过 Astro，我们可以控制客户端 JavaScript 何时以及如何加载。\n\n### 水化策略总结\n\
    \n-   `client:load`: 该选项优先级高，适用于关键元素。JavaScript 在初始加载期间加载。\n-   `client:idle`:\
    \ 该选项具有中等优先级，非常适合可以等待浏览器触发 `requestIdle` 的组件。\n-   `client:visible`: 这种低优先级选择适用于初始隐藏在视图中的组件。JavaScript\
    \ 在组件变得可见时加载。\n-   `client:media`: 最适用于仅在特定屏幕尺寸下可见的组件。当 在指定的媒体查询触发时加载 JavaScript。\n\
    -   `client:only`: 此属性跳过 HTML 渲染，仅在客户端进行渲染。然而，我们必须指定要加载的框架。\n\n"
- fmt: "\n## Fetch Execution\n\nWith server-side rendering enabled, fetch calls are\
    \ executed at request time, while without SSR (Astro’s normal operation of static\
    \ site rendering), fetch calls are executed at build time.\n\nLet’s take a look\
    \ at how this works in action. In any `.astro` page, we can simply use code similar\
    \ to this to fetch data:\n\n```\n---\nconst response = await fetch('an-api-endpoint');\n\
    const data = await response.json();\n---\n<pre>{JSON.stringify(data)}</pre>\n\
    ```\n\nThe code above makes a Fetch API request to an endpoint, parses the data\
    \ to a JSON object, and then uses a simple `JSON.stringify` method to display\
    \ the data.\n\nLet’s create another example where we fetch real data to see how\
    \ to iterate through the results. While there are plenty of free REST APIs available\
    \ out there, my choice is to use the [Star Wars API](https://swapi.dev):\n\n```\n\
    ---\nconst response = await fetch('https://swapi.dev/api/people');\nconst data\
    \ = await response.json();\nconst characters = data.results;\n---\n<h1>Star Wars\
    \ Characters</h1>\n<ul\n  {characters.map(({name}) => (\n    <li>{name}</li>\n\
    \  ))}\n</ul>\n```\n\nThe code above makes the request to the aforementioned REST\
    \ API, processes the data, and iterates through the results by using the standard\
    \ JavaScript `map()` method.\n\nNote that we can also consume an API endpoint\
    \ created as part of the project. (We covered server endpoints in the previous\
    \ chapter.) To do this, we need to reference the full URL, but luckily Astro exposes\
    \ that via a built-in global object: `Astro.url`. This is how the code looks when\
    \ referencing a custom-built API call:\n\n```\n---\nconst response = await fetch(`${Astro.url.origin}/api/endpoint`);\n\
    const data = await response.json();\n---\n<pre>{JSON.stringify(data)}</pre>\n\
    ```\n\nThis makes it incredibly easy to retrieve data.\n\n## Working with GraphQL\n\
    \nSometimes there may be a requirement in a project to use GraphQL instead of\
    \ a REST API. (GraphQL is a query language for APIs that enables clients to request\
    \ precisely the data they need, facilitating more efficient and flexible data\
    \ retrieval compared to traditional REST APIs, which typically expose a set of\
    \ fixed endpoints with pre-defined data structures.)\n\nAstro can also seamlessly\
    \ interact with GraphQL endpoints and utilize the Fetch API, so again, we can\
    \ execute GraphQL queries with no additional dependencies added to a project:\n\
    \n```\n---\nconst method = 'POST';\nconst query = `{\n  query getDestination($id:\
    \ ID) {\n      destination($id) {\n        capital,\n        flag\n      }\n \
    \   }\n  }\n}`;\nconst variables = {\n  id: 'italy'\n}\n\nconst options = {\n\
    \  method,\n  body: {\n    query,\n    variables\n  }\n}\nconst response = await\
    \ fetch('/graphql/endpoint', options);\nconst data = await response.json();\n\
    ---\n<pre>{JSON.stringify(data)}</pre>\n```\n\nIn the code above, we’re constructing\
    \ a GraphQL query to get information from a GraphQL service about a destination.\
    \ As part of the query, we’re requesting the capital and the flag. Since this\
    \ is a parameterized GraphQL query, we’re also specifying what the `id` should\
    \ be.\n\nNext, we create an `options` object, which will make sure that our Fetch\
    \ API request is using the HTTP method of `POST`, and that the GraphQL query and\
    \ its variable are sent as part of the request body. The rest of the code is pretty\
    \ self explanatory: we make the request, process the response, and display that\
    \ using `JSON.stringify()`.\n\n## Data Retrieval from a Server Endpoint\n\nAs\
    \ discussed in the previous chapter, Astro can create server API endpoints, and\
    \ it’s possible to consume data returned from these server endpoints as well.\n\
    \nSuppose we’ve added `src/pages/api/products.json.js` (a server API endpoint).\
    \ In that case, we can easily access it on any `src/pages/` page by adding something\
    \ similar to a `.astro` file, like so:\n\n```\n---\nconst response = await fetch(`${Astro.url.origin}/api/products.json`);\n\
    const products = await response.json();\n---\n<ul\n  {products.map((data) => <li>{data.name}</li>)}\n\
    </ul>\n```\n\nIn this block of code, we’re making a request against an Astro server\
    \ endpoint, grabbing the results, and storing them in a `products` variable. Since\
    \ the data we get back is an array, we can iterate through that using the `map()`\
    \ method.\n\n### Sensitive Data Protected by Fences\n\nRemember that, since the\
    \ code between the `---` fences is executed at build time, it’s safe to use API\
    \ keys and other methods even for data fetching.\n\n## Forms\n\nThough working\
    \ with form data isn’t necessarily directly related to data retrieval, it’s still\
    \ worth mentioning it here. With Astro, we can rely on `Astro.request` not only\
    \ to check if the incoming method (via the `.method` property) is a `POST` method,\
    \ but we can also access `formData` sent from the UI interface.\n\n### formData\
    \ and SSR\n\nNote that `formData` is only available if we have server-side rendering\
    \ enabled.\n\nYou can access any form of data in the script section of `.astro`\
    \ files:\n\n```\n---\nif (Astro.request.method === 'POST') {\n  const data = await\
    \ Astro.request.formData();\n  const name = data.get('name');\n  // Process 'data'\n\
    }\n---\n<h1>Form</h1>\n<form method=\"post\">\n  <input type=\"text\" name=\"\
    name\" />\n  <button>Submit</button>\n</form>\n```\n"
