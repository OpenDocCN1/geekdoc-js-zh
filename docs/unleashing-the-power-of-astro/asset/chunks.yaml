    \ Pty. Ltd.\n\n电子书 ISBN: 978-1-925836-60-8\n\n* **作者：** Tamas Piros\n* **封面设计：**\
    \ Volodymyr Boyarinov\n* **技术编辑：** Joan León\n* **系列编辑：** Oliver Lindberg\n\n\
    ## 权利声明\n\n版权所有。未经出版商事先书面许可，不得将此书的任何部分以任何形式或通过任何手段复制、存储在检索系统中或传输，但批判性文章或评论中包含的简短引用除外。\n\
    \n## 免责声明\n\n作者和出版商已尽一切努力确保书中信息的准确性。然而，本书中所包含的信息按现状出售，且不提供任何明示或暗示的保证。无论是作者还是 SitePoint\
    \ Pty. Ltd. 或其经销商或分销商，对于因遵循书中的说明或此处描述的软件或硬件产品而直接或间接造成的任何损害均不承担责任。\n\n## 商标公告\n\
    \n本书并非对每一个出现的商标名称都标注为商标，而是仅以编辑方式使用这些名称，旨在维护所有者的利益，无侵犯商标的意图。\n\n![SitePoint logo](img/sitepoint-logo-2012.png)\n\
    \nSitePoint Pty. Ltd. 出版\n\n71 Balmain Street, Cremorne, VIC, 3121\n\nAustralia\n\
    \n网站：www.sitepoint.com\n邮箱：books@sitepoint.com\n\n## 关于 SitePoint\n\nSitePoint\
    \ 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 获取我们的博客、书籍、通讯通讯、文章和社区论坛。你可以在那里找到关于 JavaScript、PHP、设计等信息。\n\n## 关于作者\n\nTamas\
    \ 是 Web 技术 Google 开发者专家（GDE），也是一位资深的开发者布道师。他是现代 Web 技术的热热支持者，帮助人们理解并解锁 Web 开发中最新且最大的功能。\n\
    \n# 前言\n\n## 谁应该读这本书？\n\n本书适用于想要学习使用 Astro 构建网站的开发者。它假设读者已经熟悉 JavaScript、HTML\
    \ 和 CSS。对其他前端框架有一定的了解将有所帮助，但并非必须。\n\n## 使用的惯例\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\
    \n```\n <h1>A Perfect Summer's Day</h1>\n<p>这是一个适合在公园散步的美好日子。\n鸟儿在歌唱，孩子们都回学校上学了。</p>\
    \ \n```\n\n你会发现我们在整本书中使用了特定的布局样式来表示不同类型的信息。请关注以下项目。\n\n### 提示、备注和警告\n\n#### 嘿，你！\n\
    \n提示（Tips）提供了有用的小贴士。\n\n#### 咳，打扰一下……\n\n备注（Notes）是与主题相关但并非至关重要的补充说明。你可以将它们看作额外的信息片段。\n\
    \n#### 确保你始终……\n\n……注意这些重要的要点。\n\n#### 注意！\n\n警告（Warnings）突出了在学习过程中可能会让你绊倒的任何“坑”。\n\
    \n## 补充材料\n\n* [`www.sitepoint.com/community/`](https://www.sitepoint.com/community/)\
    \ 是 SitePoint 的论坛，用于在使用任何棘手问题寻求帮助。\n* `books@sitepoint.com` 是我们的电子邮箱地址，如果你需要联系我们报告问题或出于任何其他原因。\n\
    \n# 第 1 章：入门 Astro \n\n[Astro](https://astro.build) 是一个现代静态站点生成器，允许开发者构建快速、优化的网站——在当今用户需求高、且快速发展的生态系统中，这是一个关键需求。Astro\
    \ 的故事可以追溯到 2021 年，当时 Fred K. Schott 发布了该框架的第一版本。在编写本教程时，Astro 已经处于第 4 版本，并添加了许多惊叹的功能。\n\
    \nAstro 在其短的存在时间内[获得了人气](https://2022.stateofjs.com/en-US/libraries/rendering-frameworks/)，原因如下：\n\
    \n* 它具有创新的网站创建方法，强调性能\n* 它流畅的开发者体验\n* 它无缝融合各种其他框架的能力\n\n部分归功于 [来自 Vercel 的新每月赞助](https://astro.build/blog/vercel-official-hosting-partner/)，并且由于它是第一个[实现\
    \ View Transitions API](https://thenewstack.io/dev-news-astro-3-0-state-of-css-and-react-opinions/)\
    \ 的框架，Astro 是一个不可忽视的力量。\n\n本教程是系列教程的第一篇，将介绍 Astro 并引导一些基础知识——如渲染、内容集合、数据获取和图像优化。\n\
    \n## Astro 的核心概念\n\n一个框架如何在性能方面脱颖而出？让我们从讨论 Astro 的一个核心概念开始，称为 Astro Islands（岛屿，或组件岛屿）。为了更好地理解这种\
    \ Web 架构风格，让我们退一步讨论纯基于组件的开发。如果你以前用过 React、Vue 或 Angular，你可能创建过组件。`Components`\
    \ 封装了功能：React 应用程序只是以逻辑方式组合的一组组件。我最喜欢的类比是组件就像乐高积木：我们使用它们来构建项目。\n\n在 React 和 Angular\
    \ 等框架中，组件底层的工作方式存在一个显著的问题。通常，在创建项目时，某些组件并不需要 JavaScript，因为它们是非交互。例如，考虑一个导航栏。作为组件构建，它可能只包含文本和样式。然而，由于\
    \ React 等框架的性质，我们必须加载 JavaScript。否则，组件将无法运行。\n\n当我们谈论 `island`（岛屿）时，指的是交互式的 UI\
    \ 元素——“交互”是指需要运行某些 JavaScript 代码才能完全正常工作。尽管如此，我们 同时也可以处理静态（即非交互）组件。回到我们之前的例子，我们可以有一个不需要零字节\
    \ JavaScript 的非交互导航栏，而另一个交互组件同时加载一些 JavaScript。\n\n![典型网页中的 Astro 岛屿](img/1_1.png)\n\
    \n这种架构模式技术也称为部分注水或选择性注水（hydration），与 Web 应用如何加载和渲染内容有关。这两种技术都涉及有目的地地加载和渲染关键部分，延迟加载不重要的组件。其目的是在提供快速的初始页面加载和允许响应式用户体验之间取得平衡。\n\
    \n总结：Astro 使用交互性和非交互性组件来创建站点。\n\nAstro 的默认行为是不发送任何客户端 JavaScript。这并不意味着我们不能在 Astro\
    \ 项目中使用 JavaScript。恰恰相反。但它的岛屿架构意味着只在需要的地方加载客户端 JavaScript。\n\n## 开始使用 Astro\n\n\
    没有什么比创建一个项目来更适合探索 Astro 了？而且再简单不过了：我们只需要执行 `npm create astro@latest` 即可创建一个全新的项目。\n\
    \n#### npm\n\n上面的命令指的是 `npm`，即 Node 包管理器。在处理 Astro 之前，确保你的电脑上安装了最新版本的 Node.js\
    \ 和 `npm`。如果你需要帮助，请查看这篇[关于安装和使用 npm 的全面教程](https://www.sitepoint.com/npm-guide/)。\n\
    \n"
- fmt: "\nThe above command will ask multiple questions, such as the project’s location\
    \ and how to start a project. This includes a choice of sample templates such\
    \ as “blog”. For the purposes of this tutorial, just choose an empty project.\n\
    \n### Starter Templates\n\nAstro offers a wide range of [starter templates](https://docs.astro.build/en/install/auto/#starter-templates),\
    \ which you may like to check out, as well as an extensive range of [themes](https://astro.build/themes/).\n\
    \nThe next step in the process is to make sure that the dependencies are installed.\
    \ Astro also supports TypeScript by default, and the installer will prompt us\
    \ to select whether we plan to write TypeScript or just JavaScript.\n\nLet’s next\
    \ look at some of the key folders and files. The good news is that there’s only\
    \ a small number of these within an empty project installation.\n\n## Project\
    \ Structure\n\nThe `src` folder is where the entire application will be built.\
    \ By default, the `src` folder contains a `pages` folder and an `env.d.ts` file.\
    \ As stated earlier, Astro has TypeScript support out of the box, and the `env.d.ts`\
    \ file has a [triple slash directive](https://www.typescriptlang.org/docs/handbook/triple-slash-directives.html)\
    \ that points to the appropriate Astro typings.\n\nAstro uses file system-based\
    \ routing. This essentially means that every folder and file placed in the `pages`\
    \ folder will act as a route. Therefore, adding `about.astro` to `src/pages` will\
    \ create the `/about` page. Adding a new `countries` folder, along with a `singapore.astro`\
    \ file, will create the route `/countries/singapore`—and so on.\n\nWhat’s really\
    \ amazing about Astro is that linking between these pages doesn’t require a third-party\
    \ dependency or a dedicated component. Instead, a standard `<a href=\"/about\"\
    >` element can be used.\n\n### File Extensions\n\nWe don’t need to use the `.astro`\
    \ extension. Astro can also use `.md`, `.mdx`, and `.html` extensions, as well\
    \ as `.js` and `.ts` (for API endpoints, but more on this later). For this tutorial,\
    \ we’ll stick to creating `.astro` files and components.\n\nThe last file that\
    \ needs mentioning is `astro.config.mjs`, where we can specify some of Astro’s\
    \ behavior or add plugins. We’ll return to this file later in the series and explore\
    \ some of the options available.\n\nIt’s also important to discuss some naming\
    \ conventions Astro suggests. Some of these are just suggestions. However, Astro\
    \ reserves some folder names. Similarly to building a project with React, an Astro\
    \ project comprises multiple components (either `.astro` or others). Therefore,\
    \ it makes sense to store these in a centralized location. Astro’s documentation\
    \ suggests storing these in `src/components`.\n\nIn the following chapter, we’ll\
    \ talk about layouts in Astro, which can be used to define the UI structure of\
    \ the entire application. Astro again suggests using `src/layouts` for files related\
    \ to UI structures.\n\nStyling is an important part of modern web applications,\
    \ and `src/styles` could be used to store CSS or even Sass files.\n\nThe `public`\
    \ folder can store assets such as images and fonts.\n\nLast but not least, apart\
    \ from `src/pages`, the other folder name that’s reserved by Astro is `src/content`.\
    \ This location is to be used by content collections, which we’ll explore later.\n\
    \nNow that we’ve discussed the folder structure, let’s also discuss what files\
    \ go into some folders. We’ll start by looking at how an Astro file is constructed.\
    \ (An Astro file has a `.astro` extension, referring to an “Astro component”.)\n\
    \n## Anatomy of an Astro File\n\nAn `.astro` component has two parts: a script\
    \ and a template. The component script usually goes on top, and it’s separated\
    \ by what’s called a code fence—three dashed lines at the top and the bottom of\
    \ the “script” section: `---`. (If you’ve used `frontmatter` in Markdown, the\
    \ syntax is exactly the same.)\n\nThe component script is basically JavaScript\
    \ code executed using a Node.js runtime during build time. Typically, we can import\
    \ other components in here (either other Astro components or React components\
    \ as well!), do data imports, execute Fetch API requests, create variables that\
    \ would be used in the template, and even safely use API keys or write to a database.\
    \ The key thing to understand here is that the JavaScript (or TypeScript) code\
    \ written in this part of an Astro component will never make it to the client.\n\
    \nAny variable created in the script section can be referenced in the template\
    \ section by using curly braces. (We’ll see an example of this later.)\n\nThe\
    \ second part of an Astro component is the template. This is where the HTML tags\
    \ should be added, and based on this, Astro will generate its final output during\
    \ the build process. Apart from standard HTML elements, in this part of the template\
    \ we can use JavaScript expressions, Astro components (or components from any\
    \ other [supported framework](https://docs.astro.build/en/guides/integrations-guide/#official-integrations)),\
    \ and special Astro directives. The template can also naturally accept a `<script>`\
    \ element if client-side JavaScript is required.\n\nThis is how a sample `.astro`\
    \ file might look, showing both the script and the HTML template parts:\n\n```\n\
    ---\nconst name = 'Jack'\n---\n<h1>Hello there, {name}</h1>\n```\n\n### Placing\
    \ JavaScript\n\nBy default, any JavaScript added to the `<script>` element will\
    \ be bundled and added to the `<head>` of the statically generated page using\
    \ the `type=\"module\"` attribute. Add `<script is:inline>` if you want your JavaScript\
    \ to be inline. See the next section for more details.\n\n## Client-side JavaScript\
    \ vs Build-time\n\nLet’s check quickly to understand the concept of JavaScript\
    \ added in the script part of an component versus a `<script>` element.\n\nHere’s\
    \ one option:\n\n```\n---\nconst copyrightYear = new Date().getFullYear();\n---\n\
    <small>Copyright, {copyrightYear}</small>\n```\n\nHere’s another option:\n\n```\n\
    <small>Copyright</small>\n<script>\ndocument.querySelector('small').insertAdjacentText('beforeend',`\
    \ ${new Date().getFullYear()}`);\n</script>\n```\n\nWhich option would we use\
    \ to display the copyright year in Astro? Both of them work (seemingly) correctly,\
    \ and both of them will display the current year.\n\nHowever, there’s a crucial\
    \ difference. Imagine we end up using the first solution and build our project\
    \ on December 29, 2024 and deploy it. Then we don’t do another build for two years.\
    \ Opening the page will still display 2024 once that year has expired. Why? Because\
    \ the JavaScript code placed between the code fence `---` executes during build\
    \ time. The second solution, however, will always display the correct year, as\
    \ that code executes at the request time. That is, every time someone views the\
    \ page, that piece of JavaScript will run.\n\n## Styling an Astro Component\n\n\
    Now that we have a good idea of what an Astro component looks like, let’s also\
    \ discuss styling these components. Astro, out of the box, supports CSS, Sass\
    \ and Less. Similar to how adding a `<script>` element is possible in a component,\
    \ adding a `<style>` element is also possible. And the good news? CSS rules are\
    \ scoped by default to the component where they’re defined. This means that the\
    \ styles defined at the individual page or component level don’t pollute the rest\
    \ of the application and the CSS rules will only apply to the necessary pages/components.\
    \ That said, global styles can also be created by adding the `is:global` attribute\
    \ to the `<style>` element.\n\nTake this example:\n\n```\n<style is:global>\n\
    p {\n  font-weight: bold;\n}\n</style>\n```\n\nIn the code sample above, all paragraphs\
    \ will be bold in the entire project because of the `is:global` directive. These\
    \ two approaches can also be combined by using the `<style>` element and the `:global()`\
    \ CSS selector.\n\nFurthermore, CSS variables can be used from the script part\
    \ of an Astro component by utilizing the `define:vars` attribute on the `<style>`\
    \ element.\n"
