  trans: "\n要将布局应用到 `Astro` 文件，我们需要导入它并像使用其他组件一样使用它：\n\n```\n---\nimport Layout from\
    \ '../layouts/Layout.astro';\n---\n<Layout title=\"Welcome\">\n  <p>一些将注入到“插槽”中的内容</p>\n\
    </Layout>\n```\n\n## Components\n\n除了布局组件外，推荐的做法是创建一个 `src/components` 文件夹来存储各种组件。在\
    \ Astro 中，我们可以包含任何“类型”的组件——例如，同时包含 `.astro` 和 `.jsx` 组件。Astro 的强大功能之一是它可以添加在其他框架中创建的组件。\n\
    \n要做到这一点，我们首先需要安装相应的集成方案。（对于 React，将使用 `@astrojs/react`，正如[文档中](https://docs.astro.build/en/guides/integrations-guide/react/)所解释的那。）安装完成后，我们可以查看一个将\
    \ React 组件添加到 Astro 的示例：\n\n```javascript\nimport { useState } from 'react';\n\
    \nconst Counter = () => {\n  const [counter, setCounter] = useState(0);\n\n  const\
    \ increment = () => {\n    setCounter(counter + 1);\n  };\n\n  const decrement\
    \ = () => {\n    setCounter(counter - 1);\n  };\n\n  return (\n    <div>\n   \
    \   <h1>Counter: {counter}</h1>\n      <button onClick={increment}> + </button>\n\
    \      <button onClick={decrement}> - </button>\n    </div>\n  );\n};\n\nexport\
    \ default Counter;\n```\n\n上面的代码是一个带有计数器的 React 组件，计数器可以增加和减少。现在让我们把它添加到 Astro\
    \ 中：\n\n```astro\n---\nimport Counter from '../components/Counter.jsx';\n---\n\
    <Counter client:only=\"react\" />\n```\n\n注意 `client:only=\"react\"`，它是[客户端指令](https://docs.astro.build/en/reference/directives-reference/)\
    \ 之一。有多种方法使用这些指令，我们将在本章末尾再讨论它们。\n\n## Routing\n\n正如之前讨论的，Astro 路由围绕 `src/pages`\
    \ 文件夹中的文件展开。在本章中，我们将涵盖三类型的路由：静态路由、动态路由和服务器端点（API 路由）。\n\n### Static Routes\n\n\
    静态路由非常直观：`.astro` 文件变为 `src/pages` 文件夹中的路由。例如：\n\n* `src/pages/about.astro` 变为\
    \ `example.com/about`\n* `src/pages/destinations/london.astro` 变为 `example.com/destinations/london`\n\
    \n请回想上一章，`.md`、`.mdx` 和 `.html` 文件也可以生成路由。例如，`/src/pages/hello.md` 变为 `example.com/hello`。\n\
    \n### Dynamic Routes\n\n当由于动态变化无法手动创建路由时，动态路由会非常有用。例如，如果我们正在制作一个列出目的地的页面，而有 100\
    \ 多个目的地（或者数量未知），该怎么办？为每种可能的路由组合创建单独的 `.astro` 文件是不可行的。\n\n相反，我们可以指示 Astro 使用动态路由：`src/pages/[destination]`\
    \ 将会变为 `src/pages/*`，从而有效地处理所有潜在的变体，例如 `example.com/london`、`example.com/singapore`\
    \ 等。（注意，路由实际上需要 `[]` 字符。）\n\n为了方便动态路由，Astro 需要一些关于如何为动态路由生成文件的信息。这是通过内置的 `getStaticPaths()`\
    \ 方法实现的。它返回一个对象数组，每个对象包含一个强制性的 `params` 对象。该对象应该匹配动态路由定义（在我们的案例中为 `destination`）：\n\
    \n```astro\n---\nconst { destination } = Astro.params;\n\nexport function getStaticPaths()\
    \ {\n  const destinations = [\n    'london',\n    'rome',\n    'sanfrancisco',\n\
    \    'singapore',\n    'cairo',\n    'medellin',\n  ];\n  // ☝\U0001F3FC记住，由于这段\
    \ JavaScript 是在服务器上执行的，我们也可以从 REST API 端点拉取这些数据\n  return destinations.map((destination)\
    \ => ({ params: { destination } }));\n}\n---\n<h1>Welcome to: {destination}</h1>\n\
    ```\n\n对于需要处理多个参数的情况（例如 `/src/pages/[city]-[country].astro`），我们可以向 `params` 对象传递多个\
    \ prop：\n\n```javascript\nreturn [{ params: { city: 'london', country: 'uk' }\
    \ }];\n```\n\n#### 404 Pages\n\n如果存在一个不匹配路由的页面，Astro 将生成一个 404 页面。通过在 `src/pages`\
    \ 文件夹中创建 `404.astro` 页面，可以自定义该页的内容。\n\n#### Rest Params\n\nAstro 在动态 URL 路由中也支持剩余参数，如\
    \ `src/pages/destinations/[...path].astro` 所示。这提供了更大的灵活性。例如，我们可以匹配任何组合的路径，如 `example.com/destinations/london`\
    \ 和 `example.com/london` 以及 `example.com/destinations/favourites/rome`。\n\n####\
    \ Path Undefined\n\n在 `getStaticPaths()` 中返回 `{params: { path: undefined }}` 可以有效匹配\
    \ `example.com/destinations/`。\n\n## Server-side Rendering\n\n在我们继续讨论路由之前，让我们稍微转向讨论\
    \ Astro 的另一个非常重要的方面：服务器端渲染。\n\n回顾一下，Astro 的默认行为是静态站点生成。这意味着所有页面都在构建期间期间生成。然而，在某些情况下这种方法并不适用；动态性质的内容需要服务器端渲染。假设我们有一个小型电子商务网站，每次购买后我们都必须重建整个网站来显示修改后的库存。这不仅不可行，而且会出现显示错误库存信息的情况。服务器端渲染解决了这个问题，因为页面内容是在请求时渲染的，这意味着可以获取最新的信息。\n\
    \n之前我们提到了 `astro.config.mjs` 文件。这是我们开启服务器端渲染的地方：\n\n```javascript\nimport { defineConfig\
    \ } from 'astro/config';\nimport nodejs from '@astrojs/node';\n\nexport default\
    \ defineConfig({\n  output: 'server',\n  adapter: nodejs(),\n});\n```\n\n`output:\
    \ 'server'` 是这里的关键，但请注意 `adapter` 设置。服务器端渲染需要一个执行服务器端代码的运行时。\n\n#### Adding the\
    \ Node Adapter\n\n我们还需要运行 `npx astro add node` 命令来安装并让 Astro 自动为项目配置 `nodejs()`\
    \ 适配器。\n\n这里的关键在于通过此设置，我们现在关闭了 Astro 默认的静态渲染机制，将其替换为服务器端渲染——针对所有页面。\n\n但如果我们某些页面不需要\
    \ SSR 呢？幸运 Astro 允许我们根据路由选择地关闭 SSR。确保在任何页面路由顶部添加以下内容：\n\n```astro\n---\nexport\
    \ const prerender = true;\n---\n<p>此页面在构建期间进行预渲染</p>\n```\n\n### Hybrid Rendering\n\
    \n甚至更好，我们可以反向操作，可以这么说：与设置 `output: 'server'` 相反，我们可以设置 `output: 'hybrid'`，这意味着保留默认行为（构建期间的静态站点生成），然后在显式启用\
    \ SSR 的页面路由添加以下内容：\n\n```astro\n---\nexport const prerender = false;\n---\n<p>此页面现在是服务器渲染的</p>\n\
    ```\n\n## Server-side Rendering Routes\n\n现在让我们继续讨论路由。对于服务器端渲染的页面，不应使用 `getStaticPaths()`，因为内容是在请求时渲染的，而不是在构建期间。\n\
    \n### Endpoints\n\n"
- fmt: "\nThere are two types of endpoints in Astro: Static and API/Server. Static\
    \ endpoints can be created by adding `.js` or `.ts` files to the `src/pages` directory,\
    \ which will be called at build time to produce static files. It should also be\
    \ noted that, during the build process, the extensions are removed. So, for example,\
    \ `src/pages/destinations.json.js` will become `/destinations.json`.\n\nEndpoints\
    \ have access to both the `request` and `params` objects, and they should export\
    \ a `GET` function. Furthermore, dynamic routes are also supported (via the `[]`\
    \ file naming notation). Recreating an earlier example to be an endpoint using\
    \ `getStaticPaths()` would look like this:\n\n```\n// src/pages/api/[destination].json.js\n\
    const destinations = [\n  'london',\n  'rome',\n  'sanfrancisco',\n  'singapore',\n\
    \  'cairo',\n  'medellin',\n];\n\nexport const GET = ({ params }) => {\n  const\
    \ { destination } = params;\n  const [myDestination] = destinations.filter(\n\
    \    (destination) => destination === destination\n  );\n  return new Response(\n\
    \    JSON.stringify({\n      destination: myDestination,\n    })\n  );\n};\n\n\
    export function getStaticPaths() {\n  return destinations.map((destination) =>\
    \ {\n    return {\n      params: {\n        destination,\n      },\n    };\n \
    \ });\n}\n```\n\n### Using the api Folder\n\nNote that using the `api` folder\
    \ isn’t mandatory, but it also provides a good separation of concerns, and it’s\
    \ highly recommended that we use it for storing API endpoints.\n\n### Accessing\
    \ the request Object\n\nThe endpoint also has access to the `request` object,\
    \ but in static mode `request.url` is the only available property from that object.\n\
    \n### Server Endpoints\n\nTo create server endpoints (API routes), we need to\
    \ enable SSR mode in Astro’s configuration file.\n\nAdding a `.js` or `.ts` file\
    \ to the pages directory creates REST API endpoints that can not only operate\
    \ with `GET` methods but also have access to all other CRUD methods (`POST`, `PUT`,\
    \ `DELETE`).\n\n### Handling GET, POST and DELETE Requests\n\nFor handling HTTP\
    \ delete requests, use `del` in Astro, as `delete` is a JavaScript built-in keyword.\n\
    \nHere’s an example illustrating how to handle HTTP `GET`, `POST` and `DELETE`\
    \ requests in Astro. The `GET` method accepts parameters (note how the route is\
    \ defined: `src/pages/api/[id].json.js`). Since we have `[id]` in the route, we\
    \ can destructure the `params` object and retrieve the value of `id`. The rest\
    \ of the code in the `GET` method makes a hypothetical database lookup and returns\
    \ a response with the queried data.\n\nThe `POST` method checks if the `Authorization`\
    \ header was sent as part of the request. If it wasn’t, we return an HTTP status\
    \ code of 401 (Unauthorized). (Note that we’re simplifying the code here and authentication/authorization\
    \ requires more steps). If everything’s fine, we parse the data sent as part of\
    \ the request and do a hypothetical database insert and return a success 201 message:\n\
    \n```\n// src/pages/api/[id].json.js\nimport { getCityData, addCity } from './fake-db.js';\n\
    \nexport const GET = async ({ params }) => {\n  const { id } = params;\n  const\
    \ cityData = await getCityData(id);\n  return new Response(JSON.stringify(cityData),\
    \ {\n    status: 200,\n    headers: {\n      'Content-Type': 'application/json',\n\
    \    },\n  });\n};\n\nexport const POST = async ({ request }) => {\n  if (!request.headers.get('Authorization'))\
    \ {\n    return new Response(null, { status: 401 });\n  }\n  const body = await\
    \ request.json();\n  const city = body.city;\n  await addCity(city);\n  return\
    \ new Response(\n    JSON.stringify({\n      message: 'City added',\n    }),\n\
    \    {\n      status: 201,\n    }\n  );\n};\n\nexport const DEL = ({ request })\
    \ => {\n  // Handle HTTP delete\n};\n```\n\n### Using the request Object\n\nNote\
    \ that it’s important to use the `request` object to its fullest to achieve authorization\
    \ and to accept incoming data—which could come from a form.\n\n## Hydration of\
    \ Interactive Components\n\nIn the previous chapter we talked about Astro’s island\
    \ architecture, which basically is a way to break down a web application into\
    \ isolated islands that are each responsible for rendering specific parts of the\
    \ page. Furthermore, this architecture can also dictate which elements require\
    \ JavaScript to be loaded.\n\nThe last thing we’ll discuss in this chapter is\
    \ how Astro hydrates interactive components. With Astro, we can control when and\
    \ how client-side JavaScript is loaded.\n\n### Summary of Hydration Strategies\n\
    \n- `client:load`: This option has high priority and is suitable for crucial elements.\
    \ The JavaScript is loaded during the initial load.\n- `client:idle`: This option\
    \ has medium priority and is perfect for components that can afford to wait until\
    \ the browser fires `requestIdle`.\n- `client:visible`: This low-priority choice\
    \ is ideal for components initially hidden from view. The JavaScript is loaded\
    \ when it becomes visible.\n- `client:media`: This is best suited for components\
    \ visible only under specific screen sizes. The JavaScript is loaded when the\
    \ specified media query triggers.\n- `client:only`: This attribute bypasses HTML\
    \ rendering and exclusively renders on the client. However, we must specify the\
    \ framework to load.\n"
  raw: "There are two types of endpoints in Astro: Static and API/Server. Static endpoints\
    \ can be created by adding `.js` or `.ts` files to the `src/pages` directory,\
    \ which will be called at build time to produce static files. It should also be\
    \ noted that, during the build process, the extensions are removed. So, for example,\
    \ `src/pages/destinations.json.js` will become `/destinations.json`.\n\nEndpoints\
    \ have access to both the `request` and `params` objects, and they should export\
    \ a `GET` function. Furthermore, dynamic routes are also supported (via the `[]`\
    \ file naming notation). Recreating an earlier example to be an endpoint using\
    \ `getStaticPaths()` would look like this:\n\n```\n// src/pages/api/[destination].json.js\n\
    const destinations = [\n  'london',\n  'rome',\n  'sanfrancisco',\n  'singapore',\n\
    \  'cairo',\n  'medellin',\n];\n\nexport const GET = ({ params }) => {\n  const\
    \ { destination } = params;\n  const [myDestination] = destinations.filter(\n\
    \    (destination) => destination === destination\n  );\n  return new Response(\n\
    \    JSON.stringify({\n      destination: myDestination,\n    })\n  );\n};\n\n\
    export function getStaticPaths() {\n  return destinations.map((destination) =>\
    \ {\n    return {\n      params: {\n        destination,\n      },\n    };\n \
    \ });\n}\n```\n\n#### Using the api Folder\n\nNote that using the `api` folder\
    \ isn’t mandatory, but it also provides a good separation of concerns, and it’s\
    \ highly recommended that we use it for storing API endpoints.\n\n#### Accessing\
    \ the request Object\n\nThe endpoint also has access to the `request` object,\
    \ but in static mode `request.url` is the only available property from that object.\n\
    \n#### Server Endpoints\n\nTo create server endpoints (API routes), we need to\
    \ enable SSR mode in Astro’s configuration file.\n\nAdding a `.js` or `.ts` file\
    \ to the pages directory creates REST API endpoints that can not only operate\
    \ with `GET` methods but also have access to all other CRUD methods (`POST`, `PUT`,\
    \ `DELETE`).\n\n#### Handling GET, POST and DELETE Requests\n\nFor handling HTTP\
    \ delete requests, use `del` in Astro, as `delete` is a JavaScript built-in keyword.\n\
    \nHere’s an example illustrating how to handle HTTP `GET`, `POST` and `DELETE`\
    \ requests in Astro. The `GET` method accepts parameters (note how the route is\
    \ defined: `src/pages/api/[id].json.js`). Since we have `[id]` in the route, we\
    \ can destructure the `params` object and retrieve the value of `id`. The rest\
    \ of the code in the `GET` method makes a hypothetical database lookup and returns\
    \ a response with the queried data.\n\nThe `POST` method checks if the `Authorization`\
    \ header was sent as part of the request. If it wasn’t, we return an HTTP status\
    \ code of 401 (Unauthorized). (Note that we’re simplifying the code here and authentication/authorization\
    \ requires more steps). If everything’s fine, we parse the data sent as part of\
    \ the request and do a hypothetical database insert and return a success 201 message:\n\
    \n```\n// src/pages/api/[id].json.js\nimport { getCityData, addCity } from './fake-db.js';\n\
    \nexport const GET = async ({ params }) => {\n  const { id } = params;\n  const\
    \ cityData = await getCityData(id);\n  return new Response(JSON.stringify(cityData),\
    \ {\n    status: 200,\n    headers: {\n      'Content-Type': 'application/json',\n\
    \    },\n  });\n};\n\nexport const POST = async ({ request }) => {\n  if (!request.headers.get('Authorization'))\
    \ {\n    return new Response(null, { status: 401 });\n  }\n  const body = await\
    \ request.json();\n  const city = body.city;\n  await addCity(city);\n  return\
    \ new Response(\n    JSON.stringify({\n      message: 'City added',\n    }),\n\
    \    {\n      status: 201,\n    }\n  );\n};\n\nexport const DEL = ({ request })\
    \ => {\n  // Handle HTTP delete\n};\n```\n\n#### Using the request Object\n\n\
    Note that it’s important to use the `request` object to its fullest to achieve\
    \ authorization and to accept incoming data—which could come from a form.\n\n\
    ## Hydration of Interactive Components\n\nIn the previous chapter we talked about\
    \ Astro’s island architecture, which basically is a way to break down a web application\
    \ into isolated islands that are each responsible for rendering specific parts\
    \ of the page. Furthermore, this architecture can also dictate which elements\
    \ require JavaScript to be loaded.\n\nThe last thing we’ll discuss in this chapter\
    \ is how Astro hydrates interactive components. With Astro, we can control when\
    \ and how client-side JavaScript is loaded for our components. The following options\
    \ can be used:\n\n*   `client:load`. This option has a high priority and is suitable\
    \ for crucial elements that require immediate interactivity. The JavaScript code\
    \ for the component is loaded during the initial page load.\n\n*   `client:idle`.\
    \ With a medium priority, this option is perfect for components that can afford\
    \ to wait. The JavaScript code for the component is loaded either after the browser\
    \ fires the `requestIdleCallback` or the `load` event.\n\n*   `client:visible`.\
    \ With low priority, this option is ideal for components initially hidden from\
    \ view and not immediately visible above the fold. The component’s JavaScript\
    \ is loaded when it becomes visible in the viewport, utilizing the [`IntersectionObserver`](https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API).\n\
    \n*   `client:media`. This low-priority choice is best suited for components visible\
    \ only under specific screen sizes. The JavaScript is loaded when the specified\
    \ CSS media query triggers, such as `client:media=\"(min-width: 400px)\"`.\n\n\
    *   `client:only`. This attribute bypasses HTML server rendering and exclusively\
    \ renders on the client. However, we must specify the framework to load, because\
    \ Astro doesn’t have this information by default. For instance, use `<MyReactComponent\
    \ client:only=\"react\" />`.\n\n## Demo\n\nPlease take a look at the [demo app\
    \ for this chapter](https://stackblitz.com/github/tpiros/sitepoint-astro) and\
    \ see if you can determine whether static site rendering of server-side rendering\
    \ is being used!\n\n## Conclusion\n\nIn this chapter, we shifted our focus to\
    \ layouts and explored the diverse rendering options that Astro has to offer.\
    \ Rendering is critical for any web app, as it determines the final presentation\
    \ of content to end users. We explored how to create layouts in Astro and how\
    \ to work with routes to create a compelling web application. We also looked at\
    \ how to create and work with static site generation and server-side rendering\
    \ in Astro.\n\nIn the next chapter, we’ll explore how to fetch data using Astro.\n\
    \n# Chapter 3: Fetching and Using Data with Astro\n\nIn this third part of our\
    \ Astro series, we’ll explore how to retrieve data in Astro. Data fetching is\
    \ a fundamental aspect of web applications, as it allows for the creation of dynamic\
    \ content—such as data coming from a content management system (CMS). It also\
    \ caters for personalization, where applications retrieve user-specific information\
    \ such as preferences or profile information.\n\nIn this series so far we’ve learned\
    \ quite a few things about Astro, such as how its project structure works, how\
    \ to create routes and components, and how to work with both static site generation\
    \ and server-side rendering.\n\nIn this chapter, we’ll examine how Astro’s capabilities\
    \ extend beyond rendering web content to efficiently handling the retrieval and\
    \ integration of dynamic data, enhancing the overall user experience and functionality\
    \ of web applications. You’ll be happy to hear that this is also incredibly straightforward.\n\
    \nRemember that we have a code fence (the content enclosed between `---` lines\
    \ at the top of each `.astro` page). Inside it, we can write JavaScript or TypeScript\
    \ code, and this opens up a lot of possibilities.\n\nWhat’s even better news is\
    \ the fact that, out of the box, Astro supports [top-level `await`](https://v8.dev/features/top-level-await)\
    \ and all modern web APIs. This allows us to effortlessly use the [Fetch API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API)\
    \ to request data. And having zero third-party dependencies is always a good thing!"
