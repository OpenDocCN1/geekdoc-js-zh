    \ schema specified above in the configuration file. As an example, this is what\
    \ a sample “corporate blog” post would look like:\n\n```\n---\ntitle: 'Buy!!'\n\
    author: 'Jack from Marketing'\ndate: 2023-07-19\nfeatured: true\nlanguage: 'en'\n\
    ---\n\n# Some Marketing Promo\n\nThis is the best product!\n```\n\n### Slug Creation\n\
    \nAstro will automatically generate slugs for posts based on the file name. For\
    \ example, the slug for `first-post.md` will be `first-post`. However, if we provide\
    \ a `slug` entry in our `frontmatter`, Astro will respect that and use our custom\
    \ slug.\n\nBear in mind that the properties specified in the `export const collections`\
    \ object must match the folder names where the content is going to live. (Also\
    \ note that they’re case sensitive!)\n\n### Querying Data\n\nOnce we have all\
    \ the Markdown files in place (in our case, that would be under `src/content/devblog`\
    \ and `src/content/corporateblog`) and our `config.js` file ready, we can start\
    \ to query data from the collections, which is a straightforward process:\n\n\
    ```\n---\nimport { getCollection } from 'astro:content';\nconst allDevPosts =\
    \ await getCollection('devblog');\nconst allCorporatePosts = await getCollection('corporateblog');\n\
    ---\n<pre>{JSON.stringify(allDevPosts)}</pre>\n<pre>{JSON.stringify(allCorporatePosts)}</pre>\n\
    ```\n\nAs seen above, the `getCollection` method can be used to retrieve all the\
    \ entries from a given collection (again, referencing the exported collection\
    \ names from earlier). In the example above, we retrieve all the posts from both\
    \ the “developer blog” (`devblog`) and from the “corporate blog” (`corporateblog`).\
    \ In the template, we simply return the raw data using `JSON.stringify()`.\n\n\
    We should also examine the data that’s being displayed via `JSON.stringify()`,\
    \ and we should take note that, other than the `frontmatter` data, we also get\
    \ an `id`, a `slug`, and a `body` property returned to use where the latter contains\
    \ the post’s content.\n\nWe can also filter for drafts or posts written in a particular\
    \ language in the `frontmatter` section by iterating through all articles like\
    \ this:\n\n```\nimport { getCollection } from 'astro:content';\n\nconst spanishEntries\
    \ = await getCollection('corporateblog', ({ data }) => {\n  return data.language\
    \ === 'es';\n});\n```\n\n`getCollection` returns all the posts, but we can also\
    \ use `getEntry` to return a single entry from within a collection:\n\n```\nimport\
    \ { getEntry } from 'astro:content';\n\nconst singleEntry = await getEntry('corporateblog',\
    \ 'pr-article-1');\n```\n\n### getCollection vs getEntries\n\nWhile there are\
    \ two ways to return multiple posts from collections, there’s a subtle difference\
    \ between the two of them. `getCollection()` retrieves a list of content collection\
    \ entries by collection name, while `getEntries()` retrieves multiple collection\
    \ entries from the same collection.\n\nThe Astro documentation gives the example\
    \ of `getEntries()` being used to retrieve content when using reference entities\
    \ (for example, a list of related posts).\n\nThe concept of related posts is where\
    \ we can reference an array of posts from a collection. This can be achieved by\
    \ adding the following to the schema when using the `defineCollection` method:\n\
    \n```\nimport { defineCollection, reference, z } from 'astro:content';\n\nconst\
    \ devblog = defineCollection({\n  schema: z.object({\n    title: z.string(),\n\
    \    relatedPosts: z.array(reference('blog')),\n  }),\n});\n```\n\nIn the code\
    \ above, we’re also importing `reference` and using that when adding `relatedPosts`\
    \ to our schema. (Note that we can call this whatever we want, such as `recommendedPosts`\
    \ or `followupPosts`.)\n\nTo use these `relatedPosts`, the appropriate slug values\
    \ should be added to the `frontmatter` part of the Markdown:\n\n```\ntitle: \"\
    This is a post\"\nrelatedPosts:\n\n- A related post # `src/content/devblog/a-related-post.md\n\
    ```\n\nReference entities are defined in the `config.js` file for the content\
    \ collection and use the `reference` method from Zod:\n\n```\nconst blog = defineCollection({\n\
    \  type: 'content',\n  schema: z.object({\n    title: z.string(),\n    relatedPosts:\
    \ z.array(reference('blog')).optional(),\n    author: reference('author'),\n \
    \ }),\n});\n\nconst author = defineCollection({\n  type: 'data',\n  schema: z.object({\n\
    \    name: z.string(),\n  }),\n});\n```\n\nAlso, notice the usage of `type: 'content'`\
    \ and `type: 'data'`. In this case, the collection encompasses both content authoring\
    \ formats such as Markdown (`type: 'content'`) and data formats like JSON or YAML\
    \ (`type: 'data'`).\n\n### Displaying the Content"
