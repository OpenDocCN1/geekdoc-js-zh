    Depending on whether we have static site generation mode or server-side rendering
    mode switched on, the type of deployment provider that we can use changes. For
    example, a static site can be easily deployed to GitHub Pages or Cloudflare Pages,
    while a site utilizing SSR can be deployed to Netlify or Vercel. For a full, filterable
    list of the various deployment options on offer, [refer to the Astro documentation](https://docs.astro.build/en/guides/deploy/).


    Also, bear in mind that, when using SSR mode with Astro, we need to [install an
    adapter and configure it](https://docs.astro.build/en/guides/server-side-rendering/#adding-an-adapter)
    appropriately.


    ## Conclusion


    Since this is the last chapter, let’s summarize what we’ve learned.


    Astro is a modern frontend framework allowing developers to create performant
    websites. It combines the benefits of static site generation with dynamic interactivity,
    making it a powerful choice for building fast and efficient web applications.
    Astro’s focus on performance and developer experience has led to a framework that’s
    gaining popularity among developers looking for a fresh approach to web development.


    In this book, we looked at Astro’s versatile rendering model, which blends static
    site generation and server-side rendering. It allows developers to choose how
    and when content is rendered, providing excellent flexibility.


    We also looked at Astro’s data fetching features. Astro supports top-level `await`,
    making it easy to fetch data from APIs or other sources. Developers can use the
    `Fetch API` and modern web APIs without the need for third-party dependencies.


    We also talked about content collections, a valuable feature for managing content,
    especially when working with Markdown (`.md` or `.mdx`) files. This empowers developers
    to maintain and validate content easily within an Astro project while ensuring
    TypeScript type safety. In that chapter, we also explored the `View Transition
    API`-an experimental feature in browsers that simplifies visual transitions between
    pages or elements by combining CSS pseudo-elements, JavaScript, and DOM state
    snapshots.


    In this final chapter, we looked at Astro’s capabilities for image optimization,
    minimizing the performance impact of images on web apps. Astro’s built-in image
    optimization capabilities enable developers to create visually appealing websites
    without compromising load times.


    I hope you’ve enjoyed reading this series on Astro, and that you’re as enthusiastic
    about Astro as I am. The last step in your learning process is to get your hands
    dirty. Go and try out Astro today!

    '
