  md: 'the same space it would take up if it were visible, but the user won''t see
    it on the page. This allows us to measure the tooltip''s dimensions, then reposition
    without the user seeing it flash up in its original position.


    In order to detect whether the layer displays outside of the viewport, we use
    the position of the cursor relative to the viewport. This could theoretically
    be obtained by using clientX/clientY, but remember: Safari gives an incorrect
    value for property. Instead, we use our cross-browser values cursorPosition and
    subtracting the scrolling (which is the equivalent of clientX/clientY). The size
    of the viewport is obtained using the getViewportsize function we created in Chapter
    7, then, for each dimension, we check whether the cursor position plus the size
    of the layer is greater than the viewport size (minus an allowance for scrollbars).


    If part of the layer is going to appear outside the viewport, position it by subtracting
    its dimensions from the viewport size; otherwise, it''s positioned normally, using
    the cursor position.


    The only other exception to notice is that if the layer would normally appear
    outside the viewport in both dimensions, when we are positioning vertically, this
    prevents the layer from appearing directly on top of the cursor and triggering
    a mouseout event. It also prevents the target element from being totally obscured
    by the tooltip, which would prevent the user from clicking on it.


    ![](img/ea2a6d5786c46a059cd7778099fdcd56_122_0.png)


    # Measuring Visible Tooltip Dimensions


    In order for the dimensions of the tooltip to be measured it must first be appended
    to the document. This will automatically make it appear on the page, so to prevent
    the user seeing it in the wrong position, we need to hide it. We do so by setting
    its visibility to "hidden" until we have finalized the tooltip''s position.


    We can''t use the more familiar display property here, because objects with display
    set to "none" are not rendered at all, so they have no dimensions to measure.


