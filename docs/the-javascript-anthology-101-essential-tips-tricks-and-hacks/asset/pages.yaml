  md: "# Not (quite) the Genuine Article\n\n![](img/ea2a6d5786c46a059cd7778099fdcd56_101_0.png)\n\
    \nAlthough the DOM 0 event handler false mimics the ability to add multiple event\
    \ listeners for one type on an element, it does not provide exact replication\
    \ of the W3C event model, because specific handlers cannot be removed from an\
    \ element.\n\nWhereas DOM 0 handlers allowed the cancellation of an element's\
    \ default action by returning false, W3C event listeners achieve this slightly\
    \ differently. To cancel a default action in this model, we need to modify the\
    \ event object. Internet Explorer requires you to set its returnValue property\
    \ to false; standards-based implementations offer preventDefault method to do\
    \ the same thing. We can create a small function that figures out the difference\
    \ for us:\n\n```\nfunction stopDefaultAction(event) {\n  event.returnValue = false;\n\
    \n  if (typeof event.preventDefault != \"undefined\") {\n    event.preventDefault();\n\
    \  }\n}\n```\n\nWe can call this function whenever we want to cancel the default\
    \ action:\n\n```\nfunction engage(event) {\n  if (typeof event == \"undefined\"\
    ) {\n    event = window.event;\n  }\n\n  alert(\"Engage!\");\\n\n  stopDefaultAction(event);\n\
    \n  return false;\n}\n```\n\nYou still need to return false after executing stopDefaultAction\
    \ in order to ensure that browsers don't support the W3C event model will also\
    \ prevent the default action."
