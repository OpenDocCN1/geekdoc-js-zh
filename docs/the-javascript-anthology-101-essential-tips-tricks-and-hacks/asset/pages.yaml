  md: "once per click, as the event’s propagation is stopped by the listener the first\
    \ time it is called.\n\n# Finding the Size of an Element\n\nThere are so many\
    \ variables that affect the size of an element—content length, CSS rules, font\
    \ family, font size, line height, text zooming …the list goes on. Add to this\
    \ that browsers interpret CSS dimensions and font sizes consistently, and you\
    \ can never predict the dimensions at which an element will be rendered. The only\
    \ consistent way to determine an element’s size is to measure once it’s rendered\
    \ by the browser.\n\n# Solution\n\nYou can tell straight that it’s going to be\
    \ useful to know exactly how big an element is. Well, the W3C can’t help: there’s\
    \ no standardized way to determine the size of an element. Frankly, the browser-makers\
    \ have more or less settled on some DOM properties that let us figure out.\n\n\
    Although box differences mean that Internet Explorer includes padding and borders\
    \ inconsistently as part of an element’s CSS dimensions, the offsetWidth andHeight\
    \ properties will consistently return an element’s width—including padding and\
    \ borders—across all browsers.\n\nLet’s imagine that an element’s dimensions were\
    \ specified in CSS like this:\n\n```\n#enterprise\n{\n  width: 350px;\n  height:\
    \ 150px;\n  margin: 25px;\n  border: 25px solid #000000;\n  padding: 25px;\n}\n\
    ```\n\nWe can determine that element’s exact pixel width in JavaScript by checking\
    \ the corresponding offsetWidth and offsetHeight properties:"
