  md: "# # 5 Navigating the Document Object Model\n\nBrowsers give JavaScript programs\
    \ access to the elements on a web page via the Document Object Model (DOM)—an\
    \ internal representation of the headings, paragraphs, lists, styles, IDs, classes,\
    \ and all the other data to be found in the HTML on your page.\n\nThe DOM can\
    \ be thought of as a tree consisting of interconnected nodes. Each tag in an HTML\
    \ document is represented by a node, any tags that are nested inside that tag\
    \ are nodes that are connected to it as children, or branches in the tree. There\
    \ are several other types of nodes; the most useful are the element node, document\
    \ node, text node, and attribute node. The document node represents the document\
    \ itself, and is the root of the DOM tree. Text nodes represent the text contained\
