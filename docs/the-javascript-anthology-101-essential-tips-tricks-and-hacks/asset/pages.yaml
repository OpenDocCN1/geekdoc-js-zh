  md: '# About the Authors


    James Edwards (aka brothercake^1) is a freelance web developer based in the United
    Kingdom, specializing in advanced DHTML programming and accessible web development.
    He is an outspoken advocate of standards-based development, a part-time moderator,
    and author of the Ultimate Drop Down Menu³ system—the first commercial DHTML menu
    to be WCAG-compliant.


    Cameron Adams has a degree in law and in science; naturally he chose a career
    in web development. His has business cards, "Web Technologist" because he likes
    to have a hand in graphic design, JavaScript, CSS, PHP, and anything else that
    takes his fancy that morning. While running his owns business—themaninblue.com⁷—he''s
    consulted and worked for numerous government departments, nonprofit organizations,
    large corporations, and tiny startups. Cameron lives in Melbourne, Australia,
    where coding marathons likes to play soccer and some tunes for his irritate neighbors.


    # About the Expert Reviewers


    Bobby de Sluis in the Netherlands and works at Blast Radius⁴ in Amsterdam, where
    he manages the interface development department. He''s a client-side web technologies
    and design specialist, occasionally writing about these topics on his personal
    web site.³ Bobby is an evangelist of unobtrusive JavaScript, progressive enhancement,
    and the use of best practices, and has contributed to many notable sites, including
    A List Apart and CSS Zen Garden. He spends his scarce time with his wife Anita
    and newly-born daughter, Sofia.


    Derek Featherstone is a well-known instructor, author, speaker, and developer
    with expertise in accessibility consulting. Derek delivers technical training
    that is engaging, informative, and immediately applicable. A high-quality instructor,
    he draws on his background as a former school teacher, plus years running his
    web development and accessibility consultancy Further Ahead.⁶ Derek blogs at boxofchocolates.ca.


    # About the Technical Editor


