  md: "# Communicating Between Frames\n\n# The First Test\n\n> note\n\nWe getAttribute\
    \ as the first test for rel because attribute-specific properties are only reliable\
    \ if you know for certain that the attribute in question has been assigned a value.\
    \ We can't go straight to testing target.rel as a string, which might be null\
    \ or undefined. This was discussed in more detail in “Reading and Writing the\
    \ Attributes of an Element” in Chapter 5.\n\n# Communicating Between Frames\n\n\
    If you are working in a framed environment, it may be necessary to have scripts\
    \ communicate between frames, either reading or writing properties, or calling\
    \ functions in different documents.\n\nIf you have a choice about or not to use\
    \ frames, I'd strongly advise against doing so, because they have many usability\
    \ and accessibility problems, quite apart from the fact that they're conceptually\
