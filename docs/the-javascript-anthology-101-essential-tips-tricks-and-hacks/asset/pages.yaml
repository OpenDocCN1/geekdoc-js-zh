  md: "# Chapter 1: Getting Started with JavaScript\n\nIn theory, you can put any\
    \ amount of information in an alert dialog, although a very long string of data\
    \ could create such a wide dialog that some of the information would be clipped\
    \ or outside the window. You can avoid this by formatting the output with escape\
    \ characters, such as \\n for a line break.\n\n# Using try-catch\n\nThe try-catch\
    \ construct is an incredibly useful way to get a script just to \"try something,\"\
    \ leaving you to handle any errors that may result. The basic construct looks\
    \ like this:\n\n```\ntry\n{\n  some code\n}\ncatch (err)\n{\n  this gets run if\
    \ the try{} block results in an error\n}\n```\n\nIf you're not sure where an error's\
    \ coming from, you can wrap a try-catch around a large block of code to trap the\
    \ general failure, tighten it progressively chunks of code until that block. For\
    \ example, you could wrap a try brace around the first half of a function (at\
    \ a convenient point in the code), then the second half, to see where the error\
    \ occurs; you could divide the suspect half again, at a convenient point, and\
    \ keep going until you isolate the problematic line.\n\ncatch has a single argument\
    \ (I've called it err in this case), which receives the error object; we can query\
    \ properties of that object, such as name and message, to get details about the\
    \ error.\n\nOften, I use a for-in iterator to run through the entire object and\
    \ find out what it says:\n\n```\nfor (var i in err)\n{\n  alert(i + ': ' + err[i]);\n\
    }\n```\n\nOrder the print version of this book to get all 588 pages!"
