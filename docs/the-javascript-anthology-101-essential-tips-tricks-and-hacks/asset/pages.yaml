    # Discussion


    Communication between frames is only allowed for documents in the same domain

    —for security reasons, it''s not possible to work with a document that was

    loaded from a different domain than the script. It wouldn''t, for example, for

    malicious site owner to load a site that you visit regularly into a frame, and

    steal the personal data you enter.


    In fact, some browsers let users disallow all scripts from communicating between

    rames, just to eradicate any possibility of a cross-site scripting vulnerability,

    and there''s no way to work around this preference if your script finds itself
    running

    in a browser so configured.


    If you have users who are complaining of problems (and they can''t or won''t

    change their settings to allow cross-frame scripting), the safest thing to do
    is

    s to avoid cross-frame scripting altogether.


    Alternative methods of passing data between pages are discussed in Chapter 6

    and Chapter 8.


