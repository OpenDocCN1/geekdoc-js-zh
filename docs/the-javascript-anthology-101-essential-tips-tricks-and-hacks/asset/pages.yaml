  md: "# 13\nBasic Dynamic HTML\n\nDynamic HTML isn’t a single piece of technology\
    \ that you can point to and say, \n“This is DHTML.\". The term is a descriptor\
    \ that encompasses all of the technologies that let you / create new elements\
    \ without refreshing the page, change the color of those elements, and make them\
    \ expand, contract, and zoom around the screen.\n\nDHTML uses HTML, the DOM, and\
    \ CSS in combination with a client-side scripting language—JavaScript—to bring\
    \ life to what was traditionally a static medium. In previous chapters, we learned\
    \ that we can use JavaScript to manipulate parts of a page to achieve some very\
    \ handy results. DHTML provides solutions to much more complex problems by assembling\
    \ these into a coherent whole—one that satisfies real-world needs, rather than\
    \ programming puzzles.\n\nThis chapter explores few of the tools we need in order\
    \ to create effective user interfaces with HTML. It then discusses a couple of\
    \ small widgets in preparation for the more complex modules we’ll consider throughout\
    \ the rest of this book.\n\n# Handling Events\n\nAny interaction that users have\
    \ with a web page—whether they’re moving the mouse or tapping the keyboard—will\
    \ cause the browser to generate an event."
