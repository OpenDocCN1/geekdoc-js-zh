    # Attaining the Correct Dimensions


    In order to correctly determine the dimensions of an element you wish to wait
    until the browser has finished rendering otherwise the dimensions may be differ
    from those the user ends seeing. There''s no guaranteed to ensure that a browser
    has finished rendering an element, but it''s normally safe to assume that a window''s
    load event has been fired, all elements have been rendered.


    ![](img/ea2a6d5786c46a059cd7778099fdcd56_111_0.png)


    # Discussion


    It is possible to retrieve the dimensions of an element minus its borders, including
    its padding. These values are accessed using the clientWidth and clientHeight
    properties, and for the example element used above their values would be 300 and
    100 in Internet Explorer 5/5.5, and 400 and 200 in all other browsers.


    There is no property that will allow you to retrieve an element''s width without
    borders or padding.


