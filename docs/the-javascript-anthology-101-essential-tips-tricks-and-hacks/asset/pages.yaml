  md: '# #1 Getting Started with JavaScript


    As we hope to demonstrate in many practical solutions throughout this book, JavaScript
    is an amazingly useful language that offers many unique benefits. With a little
    consideration for how scripted functionality degrades, you can use JavaScript
    to bring a whole range of functional, design and usability improvements to your
    web sites.


    Let''s begin with an introduction to JavaScript, exploring what it''s for, and
    how we can use it.


    # ## JavaScript Defined


    JavaScript is a scripting language that''s used to add interactivity and dynamic
    behaviors to web pages and applications. JavaScript can interact with other components
    of a web page, such as HTML and CSS, to make them change in real time, or respond
    to user events.


    You''ll undoubtedly seen JavaScript in the source code of web pages. It might
    have been inline code in an HTML element, like this:


    ```

    <a href="page.html" onclick="open(''page.html''); return false;">

    ```


    It might have appeared as a script element linking to another file:'
