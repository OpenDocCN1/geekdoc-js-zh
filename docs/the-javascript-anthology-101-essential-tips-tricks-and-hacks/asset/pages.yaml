  md: '# ### Table 13.1. DOM 0 event handlers


    | DOM 0 Event Handler | W3C DOM Event | Indicated Action |

    |---|---|---|n| onblur | blur | Remove focus from an element by clicking outside
    or tabbing away from it. |

    | onfocus | focus | Focus the cursor on an element. |

    | onchange | change | Remove focus from an element after changing its content.
    |

    | onmouseover | mouseover | Move the mouse pointer over an element. |

    | onmouseout | mouseout | Move the mouse pointer out of an element. |

    | onmousemove | mousemove | Move the mouse pointer while it is over an element.
    |

    | onmousedown | mousedown | Press a mouse button while the pointer is over an
    element. |

    | mousemouseup | mouseup | Release a mouse button while the pointer is over an
    element. |

    | onclick | click | Press and release the main mouse button or keyboard equivalent
    (Enter key) while the pointer is over an element. |

    | ondblclick | dblclick | Double-click the main mouse button while the pointer
    is over an element. |

    | onkeydown | keydown | Press a keyboard key while an element has focus. |

    | onkeyup | keyup | Release a keyboard key while an element has focus. |

    | onkeypress | keypress | Press and release a keyboard key while an element has
    focus. |

    | onsubmit | submit | Request a form to be submitted. |

    | onload | load | Finish loading a page and all associated assets (e.g., images).
    |

    | onunload | unload | Request a new page to replace the currently-displayed page,
    or close the window |


    Using DOM 0 event handlers, once you have a reference to the element whose events
    you want to handle, it’s a simple matter of assigning a handling function to the
    appropriate property:'
