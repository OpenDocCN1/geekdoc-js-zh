    # What is Event Bubbling, and How do I control it?


    You may have noticed that we needed to supply a third argument to the W3C Standard
    `addEventListener` method, and that a `capture` argument was included in our `attachEventListener`
    function to cater for this. This argument determines the phase of the event cycle
    which the listener operates.


    Suppose you have two elements, one inside the other:


    ```

    <p>

    <a href="timely_death.html">Nameless Ensign</a>

    </p>

    ```


    When a user clicks on the link, click events will be registered on both the paragraph
    and the hyperlink. The question is, which one receives the event first?


    The event cycle contains two phases, and each answers this question in a different
    way. In the `capture` phase, events work from the outside in, so the paragraph
    would receive the click first. In the `bubble` phase, events work from the inside
    out, so the anchor would receive the click before the paragraph.


    Internet Explorer and Opera only support bubbling, which is why `attach` doesn’t
    require a third argument. For browsers that support `addEventListener`, if the
    third argument is `true`, the event will be caught during the capture phase; if
    it is `false`, the event will be caught during the bubble phase.


    In browsers that support both phases, the capture phase occurs first and is always
    followed by the bubble phase. It’s possible for an event to be handled in both
    the capture and bubbling phases, provided you set up listeners for each phase.


    These phases also highlight the fact that nested elements are affected by the
    same event. If you no longer want an event to continue propagating up or down
    the hierarchy (depending upon the phase) after an event listener has been triggered,
    you can stop it. In Internet Explorer, this involves setting the `cancelBubble`'
