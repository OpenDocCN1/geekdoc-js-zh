  md: '# JavaScript Best Practices


    JavaScript best practices place a strong emphasis on the question of what you
    should do for people whose browsers don''t support scripting, what you have scripting
    turned off, or who are unable to interact with the script for another reason (e.g.,
    the user makes use of an assistive technology that does not support scripting).


    That final issue is the most difficult to address, and we''ll be focusing on solutions
    to this problem in Chapter 16. In this section, I''d like to look at three core
    principles of good JavaScript:


    +   - progressive enhancement providing for users who don''t have JavaScript

    - unobtrusive scripting separating content from behavior

    - consistent coding using braces and semicolon terminators


    The first principle ensures we''re thinking about the bigger picture whenever
    we use a script on our site. The second point makes easier maintenance on our
    end, and better usability and graceful degradation for the user. The third principle
    makes code easier to read and maintain.


    # Providing for Users who Don’t Have JavaScript (Progressive Enhancement)


    There are several reasons why users might not have JavaScript:


    +   - They''re using a device that doesn''t support scripting at all, or supports
    it in a limited way.

    - They''re behind a proxy server or firewall that filters out JavaScript.

    - They have JavaScript switched off deliberately.


    The first point covers a surprisingly large and ever-growing range of devices,
    including small-screen devices like PDAs, mid-screen devices including WebTV


    > Graceful degradation means that if JavaScript is not supported, the browser
    can naturally fall on, or "degrade" to, non-scripted functionality.'
