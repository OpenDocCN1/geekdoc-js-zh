  md: "```\nelse {\n  internalText += getInternalText(elementChildren[i]);\n}\nreturn\
    \ internalText;\n```\n\ninnerText extracts all of the text inside an element—including\
    \ all of its descendant elements—by recursively calling itself for each child\
    \ element and concatenating the resultant values together. This allows us to access\
    \ the text inside a table cell, irrespective of whether it is wrapped in elements\
    \ like spans, strengths, or ems. Any text nodes that are purely whitespace (spaces,\
    \ tabs, or new lines) are ignored by a regular expression check.\n\nWhen sortColumn\
    \ finds a row in the copy whose sorted table cell value is “less” than the one\
    \ we’re scanning, we insert a copy of the scanned row into the copied tbody. For\
    \ a column in ascending order, we simply reverse this comparison: the value of\
    \ the row in the copy must be “greater” than that of the scanned row.\n\nHowever,\
    \ before a comparison is made, we check whether the contents of the sorted table\
    \ cell can be interpreted as an integer or a float; if so, the comparison values\
    \ are converted. This makes sure that tables that contain numbers are sorted properly;\
    \ string comparisons produce different results than number comparisons.\n\nOnce\
    \ all of our original rows have been copied into the new tbody, that element is\
    \ used to replace the old one, and we have our sorted table!\n\nUsing the sortableDescending\
    \ and sortableAscending classes, which are assigned to the currently sorted table\
    \ heading cells, we can use CSS to inform the user which column the table is sorted\
    \ on, and how it is sorted, as shown in Figure 13.2 and Figure 13.3."
