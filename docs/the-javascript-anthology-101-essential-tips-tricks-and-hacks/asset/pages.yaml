  md: "font sizes—content lengths, it's often impossible to hard-code the position\
    \ of an element before you load a page. JavaScript offers a method to ascertain\
    \ any element's position after the page has been rendered, so you can know exactly\
    \ where your elements are located.\n\n# Solution\n\nThe offsetTop and offsetLeft\
    \ properties tell the distance between the top of an element and the top of its\
    \ offsetParent. But what is offsetParent? Well, it varies widely for different\
    \ elements and different browsers. Sometimes it's the immediate containing element;\
    \ other times it's the html1 element; at other times it's nonexistent.\n\nThankfully,\
    \ the solution is to follow the trail of offsetParents and add up their offset\
    \ positions that will give the element's accurate absolute position on the page\
    \ in every browser.\n\nIf the element in question has no offsetParent, then the\
    \ offset position of the element itself is zero; otherwise, we add the offsets\
    \ of the element to those of its offsetParent, then repeat the process for its\
    \ offsetParent (if any):\n\n```\nfunction getPosition(theElement) {\n  var positionX\
    \ = 0;\n  var positionY = 0;\n  while (theElement != null) {\n    positionX +=\
    \ theElement.offsetLeft;\n    positionY += theElement.offsetTop;\n    theElement\
    \ = theElement.offsetParent;\n  }\n  return [positionX, positionY];\nn\n```\n\n\
    # IE 5 for Mac Bug\n\nInternet Explorer 5 for Mac doesn't take the body's margin\
    \ or padding into account when calculating the offset dimensions, so if you desire\
    \ accurate measurements in this browser, you will have zero margins and padding\
    \ on the body."
