    # Reading and Writing the Attributes of an Element


    The most frequently used parts of an HTML element are its attributes—id, class,
    href, title, or any of a hundred other pieces of information that can be included
    in an HTML tag. JavaScript is able not only to read these values, but to write
    them as.


    # Solution


    Two methods exist for reading and writing an element''s attributes. getAttribute
    allows you to read the value of an attribute, while setAttribute allows you to
    write it.


    Consider this HTML:


    ```

    <a id="antares" href="antares.html" title="A far away place">

    Antares</a>

    ```


    We would be able to read the attributes of the element like:


    ```

    var anchor = document.getElementById("antares");

    var anchorId = anchor.getAttribute("id");

    var anchorTitle = anchor.getAttribute("title");

    ```


    The value of the variable anchorId would be "antares", and the value of the variable
    anchorTitle would be "A far away place".'
