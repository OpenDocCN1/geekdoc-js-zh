    a site. They’re particularly useful in situations like highlighting elements:
    a class can be added that highlights an element without disturbing any of the
    other visual properties that may have been applied to the element by other classes.
    However, if you are assigning classes in JavaScript you must be careful that you
    don’t inadvertently overwrite previously assigned classes.


