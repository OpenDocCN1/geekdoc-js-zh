  md: '# Working with Windows and Frames


    This chapter is about simple window and frame manipulation, including tasks like
    opening popups, communicating between frames, and finding out the page’s scrolling
    position.


    Plenty of people feel that window manipulation is akin to the Dark Side. They
    believe that a window is part of the user’s GUI, and since JavaScript is a document
    scripting language, it has no business manipulating windows.


    I’m generally inclined to agree, yet I know that opinion is sometimes a luxury.
    If your clients ask for something specific, you can’t necessarily change their
    minds, or have the freedom to turn down work on the basis of such a principle.
    In this chapter, we’ll cover a range of practical window and frame manipulation
    tasks while remaining sensitive to the usability and accessibility issues that
    arise from their use.


    Note, though, there are limits, and some varieties of window scripting are particularly
    unfriendly. We won''t be dealing with aggressive tactics like closing or modifying
    the user’s primary window, moving windows around the screen, or opening full-screen
    “chromeless” windows. These are exactly the kinds of abuses that have given JavaScript
    a bad name.


    > ¹The techniques involved in reading data from an iframe will be covered in Chapter
    18.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Chapter 7: Working with Windows and Frames


    Through most of this chapter we''ll be looking closely at the properties and methods
    of the window object. These are implemented by different browsers in a variety
    of ways, most of which have been used in the days since JavaScript was standardized.


    We''ll have quite a few branches to deal with, but we''ll avoid the dreaded browser
    sniffing by careful use of object detection, the process of detecting an object
    or feature to test for compatibility, rather than detecting specific browsers.


    # Using Popup Windows


    Should you use popup windows? The most considered answer I have is: not if you
    can help it. Popup windows have gained a bad reputation from marketers aggressive
    use of them, but even requested popups can be barriers to good usability.


    I won''t say that popups are never appropriate, but I will say that they''re seldom
    so. Nevertheless, there are situations where popping up a new window is arguably
    the most appropriate solution: an online survey might make the content more approachable;
    HTML games are another, as the viewport may need to be of a known size.


    I''ll qualify my opinion by discussing the problems that popups create, providing
    a pragmatic method for using them that mitigates these problems as much as possible.


    # What’s Wrong with Popups?


    The main problem with most popup window scripts is that they don''t consider the
    needs of the user—they address only the needs of the designer. The results? We''ve
    all seen them:


    +   - popups that are generated from links, though those links do nothing scripting
    is not available


    +   - popup windows that don''t have a status bar, so you can''t necessarily tell
    whether the document has loaded or stalled, is still loading, etc.


    +   - popups that don''t give users the ability to resize the window, and popups
    that fail to generate scrollbars for content that might be outside the window


    +   - windows that are "chromeless", or open to the full size of the user''s screen'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'These issues are not just questions of usability, but of accessibility as well.
    For example, screen-reader users may not be notified by their devices that a new
    window has opened. This could obviously cause confusion if they attempted to go
    back in the browser history (they can''t). The same thing might happen for a sighted
    user if a window opens at full-size: you and may be familiar with the taskbar
    to monitor open windows, but not all computer users—they may not even realize
    that a new window has popped up.


    If you''re going to use popups, looking out for these issues, being generally
    sensitive to their impacts, will make the popups friendlier to users, and less
    of a strain on your conscience.


    Also, bear in mind that, from a developer''s perspective, popup windows are not
    guaranteed to work: most browsers now include options to suppress popup windows,
    and in some cases, suppression occurs even if the popup is generated in response
    to an event.


    You may be able to allow for this as you would for situations in scripting was
    not supported: by ensuring the underlying trigger for the popup still does something
    useful if the popup fails. Or you might have your code open a window and then
    check its closed property, to see if it''s actually displayed (we''ll look at
    this technique in the next solution).


    But neither of these approaches is guaranteed to work with every browser and popup
    blocker out there, so for this as much as the usability reasons, it''s simpler
    and better to avoid using popups whenever you can.


    # How Do I Minimize the Problems?


    What we need to do establish some golden rules for the ethical use of popups:


    +   - Make sure any triggering link degrades properly when scripting is not available.

    - Always include the status bar.

    - Always include a mechanism to overflow the content: either allow window resizing,
    or allow scrollbars to appear, or both.

    - Don not open windows that are larger than 640x480 pixels.'
