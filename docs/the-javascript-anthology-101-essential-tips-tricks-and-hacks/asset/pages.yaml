  md: '# Understanding a Browser’s Built-in Error Reporting


    Opera, Mozilla browsers (such as Firefox), and Internet Explorer all have decent
    bug reporting functionality built in, but Opera and Mozilla’s debugging tools
    are the most useful.


    Opera


    Open the JavaScript console from Tools > Advanced > JavaScript console. You can
    also open it automatically when an error occurs by going to Tools > Preferences
    > Advanced > Content, clicking the JavaScript options button to open its dialog,
    and checking Open JavaScript console on error.


    Firefox and other Mozilla browsers


    Open the JavaScript console from Tools > JavaScript console.


    Internet Explorer for Mac


    Go to Tools > Internet Explorer > Advanced and uncheck the option Disable script
    debugging, check the option Display a notification about every script error, to
    make a dialog popup whenever an error occurs.


    Internet Explorer for Mac


    Go to Explorer > Preferences > Web Browser > Web Content and check the Show reporting
    alerts option.


    Safari doesn’t include bug reporting by default, but recent versions have a “secret”
    Debug menu, including a JavaScript console, which can be enabled by entering the
    following terminal command:


    ```

    $ defaults write com.apple.safari IncludeDebugMenu -bool true

    ```


    You can also use an extension Safari Enhancer, which includes an option to jump
    JavaScript messages to the Mac OS Console; but these messages are not very helpful.


    Understanding the various browsers’ console can take a little practice, because
    each browser gives them different information. Here’s an example of an error—a
    mistyped function call:


    > ⁶ The $ represents the command prompt, and is not to be typed.

    ⁷ http://www.lordofthecows.com/safari_enhancer.php'
