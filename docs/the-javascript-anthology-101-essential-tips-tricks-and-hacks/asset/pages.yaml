  md: "# The Problem with scroll\n\nscroll is not the most reliable of events; it\
    \ may not fire at all in Konqueror Safari 1.0, or when the user navigates with\
    \ a mouse wheel in Firefox. And if it does fire, it may so continually and rapidly\
    \ (as it does in Internet Explorer), which can be slow and inefficient if the\
    \ script you use to respond to the event is very complex.\n\nIf you have difficulties\
    \ of this kind, you may find it better to use the setInterval function instead\
    \ of an onscroll event handler. setInterval will allow you to call the function\
    \ at a predictable interval, rather than in response to an event. You can find\
    \ out about this kind of scripting in Chapter 14, but here's a comparable example:\n\
    \n```\nwindow.setInterval(function() {\n  var scrollpos = getScrollingPosition();\n\
    \  document.title = 'left=' + scrollpos[0] + ' top=' + scrollpos[1];\n}, 250);\n\
    ```\n\n# Discussion\n\nThe only real complication here is that IE 5 actually does\
    \ recognize the document.scrollTop property, but its value is always zero, so\
    \ we have to check the value as well as looking for the existence of the property.\n\
    \nOtherwise, it doesn't really matter which browser we is using; all matters is\
    \ that our script gets through one of the compatibility tests and returns a useful\
    \ value. However, the properties used by each browser are shown here for reference:\n\
    \n+   - window.pageYOffset is used by Firefox and other Mozilla browsers, Konqueror,\
    \ and Opera.\n\n+   - document.documentElement.scrollTop is used by IE 6 in standards-compliant\
    \ mode.\n\n+   - document.body.scrollTop is used by IE 5, and IE 6 in \"Quirks\"\
    \ mode.\n\nThis list doesn't tell the complete story, but it's intended primarily\
    \ to describe the ordering of the tests. More recent Mozilla browsers (such as\
    \ Firefox) also supportElement.scrollTop and body.scrollTop, by the same render-"
