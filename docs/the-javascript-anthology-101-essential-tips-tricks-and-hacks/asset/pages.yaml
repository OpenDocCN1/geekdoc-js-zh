  md: "# Chapter 1: Getting Started with JavaScript\n\nJavaScript, instead of combining\
    \ them, when we look at the HTML we're less likely to forget that its core function\
    \ should be to describe the content of the page, independent of any scripting.\n\
    \nAndy Clarke refers to the web standards trifle⁴ which is a useful analogy. A\
    \ trifle looks like a good web site: when you look at the bowl, you can see all\
    \ the separate layers that make up the dessert. The opposite of this might be\
    \ a fruit cake: when you look at the cake, you can't tell what different ingredient\
    \ is. All you can see is a mass of cake.\n\n# Discussion\n\nIt's important to\
    \ note that when you bind an event handler to an element like this, you can't\
    \ do it until the element actually exists. If you put the preceding script in\
    \ the head section of a page as it is, it will report errors and fail to work,\
    \ because the content div has not been rendered at the point at which the script\
    \ is processed.\n\nThe most direct solution is to put the code inside a load event\
    \ handler. It will always be safe there because the load event doesn't fire until\
    \ after the document has been fully rendered:\n\n```\nwindow.onload = function()\n\
    {\n  var contentDiv = document.getElementById('content');\n  :\n};\n```\n\nOr\
    \ more clearly, with a bit more typing:\n\n```\nwindow.onload = init;\n\nfunction\
    \ init()\n{\n  var contentDiv = document.getElementById('content');\n  :\n}\n\
    ```\n\nThe problem with the load event handler is that only one script on a page\
    \ can use it; if two or more scripts attempt to install load handlers, each script\
    \ will override the handler of the one that came before it. The solution to this\n\
    \n> ⁴http://www.stuffandsnonsense.co.uk/archives/web_standards_trifle.html"
