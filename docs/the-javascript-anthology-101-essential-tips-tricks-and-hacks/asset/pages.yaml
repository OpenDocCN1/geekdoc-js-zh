  md: "# Chapter 13: Basic Dynamic HTML\n\n# The W3C Event Model and Anonymous Functions\n\
    \nThe W3C event model doesn't allow for the removal of anonymous functions, so\
    \ if you need to remove an event listener, hang onto a reference to the function\
    \ in question.\n\nIn browsers that don't support W3C event listeners, this function\
    \ removes all event handlers on the given event: it's not possible to remove just\
    \ one of them and leave the others.\n\n# Discussion\n\n# Referencing the Target\
    \ Element\n\nQuite often, you'll want to use the object that was the target of\
