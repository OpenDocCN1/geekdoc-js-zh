    # DOM 0 Collections


    Many "special" elements in an HTML document can be accessed by even more direct
    means. The body of the document can be accessed as document.body. A collection
    of all the forms in document.forms. All of the images in a document may be found
    in document.images.


    In fact, most of these collections have been around since before the DOM was standardized
    by the W3C, and are commonly referred to as DOM 0 properties.


    Because the initial implementations of these features were not standardized, these
    collections have occasionally proven unreliable in browsers that are moving towards
    standards compliance. Early versions of some Mozilla browsers (e.g., Firefox),
    for example, did not support these collections on XHTML documents.


    Today''s browsers generally do a good job of supporting these collections; however,
    if you run into problems, it''s worth noting the more verbose getElementsByTagName
    method of accessing the relevant elements. Instead of document.body, for example,
    you could use:


    ```

    var body = document.getElementsByTagName("body")[0];

    ```


    # Discussion


    If you really need to step through the DOM hierarchy element by element, each
    node has several properties that enable you to access related nodes:


    +   - node.childNodes: a collection that contains source-order references to each
    of the children of the specified node, including both elements and text nodes


    +   - node.firstChild: the first child node of the specified node'
