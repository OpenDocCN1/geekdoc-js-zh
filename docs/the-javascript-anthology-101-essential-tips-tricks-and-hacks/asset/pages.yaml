  md: '# Accessing Elements


    Access provides control, control is power, and you''re a power programmer, right?
    So you need access to everything that''s on a web page. Fortunately, JavaScript
    gives you access to any element on a page using just a few methods and properties.


    # Solution


    Although it''s possible to navigate an HTML document like a road map—starting
    from home and working your way towards your destination one node at time—this
    is an inefficient way of finding an element because it requires a lot of code,
    and any changes in the structure of the document will usually mean you have to
    rewrite your scripts. If you want to find something quickly and easily, the method
    that you should tattoo the back of your hand is document.getElementById.


    Assuming you have the correct markup in place, getElementById will allow you to
    immediately access any element by its unique attribute value. For instance, imagine
    your page contains this:


    ```

    <p>

    <a id="sirius" href="sirius.html">Journey to the stars*</a>

    </p>

    ```


    You can use the element''s id to get direct access to the element itself:


    ```

    var elementRef = document.getElementById("sirius");

    ```


    The value of the variable elementRef will now be referred to the element—any operations
    that you perform on elementRef will affect that hyperlinking.


    getElementById is good for working with a specific element; however sometimes
    you''ll want to work with a group of elements. In order to retrieve a group of
    elements on the basis of their tag names, you can use the method getElementsByTagName.


    As seen from its name, getElementsByTagName takes a tag name and returns all elements
    of that type. Assume that we have this HTML code:'
