  md: '# Chapter 13: Basic Dynamic HTML


    Sometimes, we overwrite our code to respond to this interaction, so we listen
    for these events, which let us know when we should execute our code.


    # Solution


    There are two ways to handle events: the short way, and the W3C way. Each has
    its pros and cons, but both allow you to execute a specified function when an
    event occurs on a particular element.


    # The Short Way: Using Event Handlers


    The short way of handling an event is to use the DOM 0 event handlers that are
    assigned as shortcut properties of every element. Much as we saw in Chapter 5
    when we discussed DOM 0 attribute shortcuts, these event handlers are not future-proof.
    However, they do offer some advantages over standard W3C event listeners.


    +   - Every browser''s that currently in operation supports DOM 0 event handlers
    without the need for code branching.

    - Each function executed by a DOM 0 event handler has access to the exact element
    to which the event handler was assigned. (As you''ll see later, this is not always
    available in W3C event listeners.)


    The main problem with utilizing DOM 0 event handlers is that they are not designed
    to work with multiple scripts. Every time you assign a DOM 0 event handler, you
    overwrite any previously assigned handler for that. This can interfere with the
    operation of multiple scripts that require event handling on the same element.
    With W3C event listeners, you can add any number of event listeners on the same
    element, and enjoy the ability to remove any of them at any time.


    If you can be certain that your code will not interfere with someone else''s event
    handling (e.g., you''re placing on elements that are created dynamically in your
    own script), it will be safe to use DOM 0 event handlers. But—all things being
    equal—it is safer to use the W3C event listeners wherever practical, as we do
    in this book.


    A number of DOM 0 event handlers are available via the browser; Table 13.1 lists
    the most commonly used handlers.


