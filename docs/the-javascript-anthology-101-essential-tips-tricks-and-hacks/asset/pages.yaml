    # Discussion


    The method above works for simple and complex layouts; however, you may run into
    problems when one or more of an element''s ancestors has its CSS position property
    set to something other than static (the default).


    There are so many possible combinations of nested positioning and browser differences
    that it''s almost impossible to write a script that takes them all into account.
    If you are working with an interface that uses a lot of relative or absolute positioning,
    it''s probably easiest to experiment with specific cases and special functions
    to deal with them. Here are a few of the differences that you might encounter:


    +   - In Internet Explorer for Windows and Mozilla/Firefox, any element parent
    is relatively positioned will not include the parent''s border in its offset;
    however, the parent''s offset will only measure to the edge of its border. Therefore,
    the sum of these values will not include the border distance.


    +   - In Opera and Safari, any absolutely or relatively positioned element offsetParent
    will include the body''s margin in its offset. The body''s offset will include
    its own margin as well.


    +   - In Internet Explorer for Windows, any absolutely positioned element inside
    a relatively positioned element will include the relatively positioned element''s
    margin in its offset. The relatively positioned element will include its margin
    as well.


