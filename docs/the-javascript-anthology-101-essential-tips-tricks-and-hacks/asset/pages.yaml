  md: '# Chapter 5: Navigating the Document Object Model


    ```

    <p class="introduction">For centuries, the stars have been

    more to humankind than just burning balls of gas ...</p>

    </body>

    </html>

    ```


    The DOM for this page could be visualized as Figure 5.1.


    Every page has a document node, but its descendants are derived from the content
    of the document itself. Through the use of element nodes, text nodes, and attribute
    nodes, every piece of information on a page is accessible via JavaScript.


    The DOM isn''t just restricted to HTML and JavaScript, though. Here''s how the
    W3C DOM specification site² explains the matter:


    The Document Object Model is a platform and language-neutral interface that will
    allow programs and scripts to dynamically access and update the content, structure
    and style of documents.


    So, even though the mixture of JavaScript and HTML is the most common combination
    of technologies in which the DOM is utilized, the knowledge you gain from this
    chapter can be applied to a number of different programming languages and document
    types.


    In order to make you a “master of your DOMain,” this chapter will explain how
    to find any element you''re looking for on a web page, then change it, rearrange
    it, or erase it completely.


    > ² http://www.w3.org/DOM/'
