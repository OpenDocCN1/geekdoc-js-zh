    # Displaying a Tooltip when you Mouse Over an Element


    Tooltips are a helpful feature in most browsers, but they can be a restrictive
    if you plan to use them as parts of your interface. If you''d like to use layers
    that appear when you want them to, aren''t truncated, and can contain more than
    plain text, why not make your own enhanced tooltip?


    # Solution


    For this example, we''ll apply a class, hastoolip, on all the elements for which
    we''d like tooltips to appear. We''ll get the information that''s going to appear
    in the tooltip from each element''s title attribute:


    ```

    <p>These are the voyages of the <a class="hastoolip" href="enterprise.html" title="USS
    Enterprise (NCC-1701)">-starship Enterprise</a>.</p>

    ```


    From our exploration of browser earlier in this chapter, you''ll probably already
    realized that we need to set up some event listeners to let us know when the layer
    should appear and disappear.'
