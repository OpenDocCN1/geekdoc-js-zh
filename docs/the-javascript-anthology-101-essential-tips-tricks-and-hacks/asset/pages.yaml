  md: "# Solution\n\nThe usual suspect is the window object's load event handler,\
    \ because only one script on a page can use this event; if two or more scripts\
    \ are using it, the last one will override those that came before.\n\nWe could\
    \ call multiple functions from inside a single load handler, like this:\n\n```\n\
    window.onload = function() {\n  firstFunction();\n  secondFunction();\n}\n```\n\
    \nBut, if we used this code, we'd be tied to a single piece of code from which\
    \ we'd have to do everything we need to load. A better solution would provide\
    \ a means of adding load event handlers that don't conflict with other handlers.\n\
    \nWhen the following single function is called, it will allow us to assign any\
    \ number of load event handlers, without any of them conflicting:\n\n```\nfunction\
    \ addLoadListener(fn) {\n  if (typeof window.addEventListener !== 'undefined')\
    \ {\n    window.addEventListener('load', fn, false);\n  } else if (typeof document.addEventListener\
    \ !== 'undefined') {\n    document.addEventListener('load', fn, false);\n  } else\
    \ if (typeof window.attachEvent !== 'undefined') {\n    window.attachEvent('onload',\
    \ fn);\n  } else {\n    var oldfn = window.onload;\n    if (typeof window.onload\
    \ !== 'function') {\n      window.onload = fn;\n    }\n    window.onload = oldfn();\n\
    \  }\n}\n```"
  merge: -1
