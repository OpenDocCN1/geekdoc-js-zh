  md: "# Separating Content from Behavior (Unobtrusive Scripting)\n\nSeparating content\
    \ from behavior means keeping different aspects of a web page’s construction apart.\
    \ Jeffrey Zelman famously refers to this as the “three-legged stool” of web development—comprising\
    \ content (HTML), presentation (CSS), and behavior (JavaScript)—which emphasizes\
    \ not just the difference in each aspect’s functioning, but also the fact that\
    \ they should be separated from one another.\n\nGood separation makes for sites\
    \ that are easier to maintain, are more accessible, and degrade well in older\
    \ or lower-spec browsers.\n\n# Solution\n\nAt one extreme, which is directly opposed\
    \ to the ideal of separating content from behavior, we can create inline code\
    \ inside attribute handlers. This is very messy, and generally should be avoided:\n\
    \n```\n<div id=\"content\"\n  onmouseover=\"this.style.borderColor='red'\n  onmouseout=\"\
    this.style.borderColor='black\">\n```\n\nWe can improve the situation by taking\
    \ the code that does the work and abstract it into a function:\n\n```\n<div id=\"\
    content\"\n  onmouseover=\"changeBorder('red')\n  onmouseout=\"changeBorder('black')\"\
    >\n```\n\nDefining a function to do the work for us lets us provide most of our\
    \ code in a separate JavaScript file:\n\n```\nfunction changeBorder(element, to)\n\
    {\n  element.style.borderColor = to;\n}\n```\n\n> ³Zeldman, J. Designing with\
    \ Web Standards. New Riders, 2003."
  merge: -1
  pgno: 31
- img_proc: true
  md: "# Separating Content from Behavior (Unobtrusive Scripting)\n\nBut a much better\
    \ approach is to avoid using inline event handlers completely. Instead, we can\
    \ make use of the Document Object Model (DOM) to bind the event handlers to elements\
    \ in the HTML document. The DOM is a standard programming interface by which languages\
    \ like JavaScript can access the contents of HTML documents, removing the need\
    \ for any JavaScript code to appear in the HTML document itself. In this example,\
    \ our HTML code would look like the following:\n\n```\n<div id=\"content\">\n\
    ```\n\nHere’s the scripting we’d use:\n\n```\nfunction changeBorder(element, to)\
    \ {\n  element.style.borderColor = to;\n}\n\nvar contentDiv = document.getElementById('content');\n\
    \ncontentDiv.onmouseover = function() {\n  changeBorder('red');\n};\n\ncontentDiv.onmouseout\
    \ = function() {\n  changeBorder('black');\n}\n```\n\nThis approach allows us\
    \ to add, remove, or change event handlers without having to edit the HTML, and\
    \ since the document itself doesn't rely on or refer to the scripting at all,\
    \ browsers that don't understand JavaScript will not be affected by it. This solution\
    \ also provides the benefits of reusability, because we can bind the same functions\
    \ to other elements as needed, without having to edit the HTML.\n\nThis solution\
    \ hinges on our ability to access elements through the DOM, which we’ll cover\
    \ deep in Chapter 5.\n\n# The Benefits of Separation\n\n> note By practicing good\
    \ separation of content and behavior, we gain not only a practical benefit in\
    \ terms of smoother degradation, but also the advantage of thinking in terms of\
    \ separation. Since we’ve separated the HTML and"
