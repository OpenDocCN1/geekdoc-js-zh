  md: '# Chapter 1: Getting Started with JavaScript


    all—a restriction that prevents malicious scripts from making users upload a file
    they didn''t choose.


    There are quite a few examples of similar security restrictions, which we''ll
    expand on they arise in the applications we''ll cover in this book. But to summarize,
    here''s a list of JavaScript''s major limitations and security restrictions, including
    those we''ve already seen. JavaScript cannot:


    +   - open and read files directly (except under specific circumstances, as detailed
    in Chapter 18).


    +   - create or edit files on the user''s computer (except cookies, which are
    discussed in Chapter 8).


    +   - read HTTP POST data.


    +   - read system settings, or any other data from the user''s computer that is
    not available through language or host objects.¹


    +   - modify the value of a file input field.


    +   - alter the display of a document that was loaded from a different domain.


    +   - close or modify the toolbars and other elements of a window that was not
    opened by script (i.e., the main browser window).


    Ultimately, JavaScript might not be supported at all.


    It''s worth bearing in mind that many browsers include options that allow greater
    precision than simply enabling or disabling JavaScript. For example, Opera includes
    options to disapp scripts from closing windows, moving windows, writing to the
    status bar, receiving right-clicks ... the list goes on. There''s little you can
    do to work around this, but mostly, you won''t need to–such options have evolved
    to suppress “annoying” scripts (status bar scrollers, right-click scripts, etc.)
    so if you stay away from those kinds of scripts, the issue will come up only rarely.'
