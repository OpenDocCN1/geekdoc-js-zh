  md: "```\ntargetTable.replaceChild(newTbody, targetTbody);\nstopDefaultAction(event);\n\
    return false;\n```\n\nThe first loop that occurs after all the structural variables\
    \ have been defined sets the respective states for each of the table heading cells\
    \ when one of them is clicked. Not only are classes maintained to identify the\
    \ heading cell on which the table is sorted, but a special sortOrder is maintained\
    \ upon each cell to determine the order in which column is sorted. Initially a\
    \ column will be sorted in descending order, but if a heading cell is clicked\
    \ twice consecutively, the sort order will be changed to reflect an ascending\
    \ sequence. Each heading cell remembers the sort order state it exhibited most\
    \ recently, and the column is returned to state when its heading cell is re-selected.\
    \ The title of the hyperlink for a clicked heading cell is also rewritten upon\
    \ the current sort order, and what the sort order would be if the user clicked\
    \ on it again.\n\nThe second loop sorts all the rows that are contained in the\
    \ body of the table. A copy of the original tbody is created to store the reordered\
    \ table rows, and initially this is empty. As each row in the original tbody is\
    \ scanned, the contents of the table cell on which we're sorting is compared with\
    \ the rows already in the copy.\n\nIn order to find the contents of the table\
    \ cell, we use the function getInternalText:\n\n```\nfunction getInternalText(target)\
    \ {\n  var elementChildren = target.childNodes;\n  var internalText = \"\";\n\n\
    \  for (var i = 0; i < elementChildren.length; i++) {\n    if (elementChildren[i].nodeType\
    \ == 3) {\n      if (!/\\s*$/.test(elementChildren[i].nodeValue)) {\n        internalText\
    \ += elementChildren[i].nodeValue;\n      }\n    }\n  }\n}\n```\n\n> File: sort_tables_by_columns.js\
    \ (excerpt)"
