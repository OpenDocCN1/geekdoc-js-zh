  md: "# Writing to the Page or Window\n\nIf you're examining a great deal of data\
    \ while debugging, or you're dealing with data that's formatted in a complicated\
    \ way, it's often better to write data directly to a page or popup window than\
    \ to try to deal with lots of alert dialogs. If you're examining data in a loop,\
    \ in particular, you could end up generating hundreds of dialogs, each of which\
    \ you'll have to dismiss manage—a very tedious process.\n\nIn these kinds of situations,\
    \ you can use an element's innerHTML property to write the data to the page. Here's\
    \ an example in which we build the list using an array (data), then write it into\
    \ a data\n\n```\nvar test = document.getElementById('testdiv');\ntest.innerHTML\
    \ += '<ul>';\nfor (var i = 0; i < data.length; i++) {\n  test.innerHTML += '<li>'\
    \ + i + ' = ' + data[i] + '</li>';\n}\ntest.innerHTML += '</ul>';\n```\n\nFile:\
    \ debugging-writing.js (excerpt)\n\nWe can also write the data into a popup, which\
    \ is useful if there's no convenient place to put it on the page:\n\n```\nvar\
    \ win = window.open('', win, 'width=320,height=240');\nwin.document.open();\n\
    win.document.write('<ul>');\nfor (var i = 0; i < data.length; i++) {\n  win.document.write('<li>'\
    \ + i + ' = ' + data[i] + '</li>');\n}\nwin.document.write('</ul>');\nwin.document.close();\n\
    ```\n\nFile: debugging-writing.js (excerpt)\n\nYou can format the output however\
