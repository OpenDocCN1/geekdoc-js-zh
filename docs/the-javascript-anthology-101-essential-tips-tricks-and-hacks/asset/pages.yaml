    \ alternative, which avoids this problem, is always to put the script in an external\
    \ JavaScript file. Here's what it looks like:\n\n```\n<script type=\"text/javascript\"\
    \ src=\"what-is-javascript.js\">\\n</script>\n```\n\nThis loads an external JavaScript\
    \ file named what-is-javascript.js. The file should contain the code that you\
    \ would otherwise put inside the script element, like this:\n\n```\nfunction saySomething(message)\n\
    {\n  alert(message);\n}\n\nsaySomething('Hello world!');\n```\n\nWhen you use\
    \ this method, browsers that don't understand the script element will ignore it\
    \ and render no contents (since the element is empty), browsers that do understand\
    \ it will load and process the script. This helps to keeping content and separate,\
    \ and is far more easily maintained—you can use the same script on multiple pages\
    \ without having to maintain copies of the code in multiple documents.\n\n# Discussion\n\
    \nYou may question the recommendation of not using code directly inside the script\
