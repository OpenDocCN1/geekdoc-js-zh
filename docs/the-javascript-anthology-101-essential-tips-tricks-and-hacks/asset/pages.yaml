  md: "# Chapter 1: Getting Started with JavaScript\n\n```\n{\n  oldfn();\n  fn();\n\
    }\n```\n\nOnce this function is in place, we can use it any number of times:\n\
    \n```\naddEventListener(firstFunction)\naddEventListener(secondFunction)\naddEventListener(twentyThirdFunction);\n\
    ```\n\nYou get the idea!\n\n# # Discussion\n\nJavaScript includes methods for\
    \ adding (removing) event listeners, which operate like event handlers, but allow\
    \ multiple listeners to subscribe to a single event on an element. Unfortunately,\
    \ the syntax for event listeners is completely different in Internet Explorer\
    \ than it is in other browsers: where IE uses a proprietary method, others implement\
    \ the W3C Standard. We'll come across this dichotomy frequently, and we'll discuss\
    \ it in detail in Chapter 13.\n\nThe W3C method is addEventListener('load', firstFunction,\
    \ false);\n\n```\nwindow.addEventListener('load', firstFunction, false);\n```\n\
    \nThe IE method is attachEvent('onload', firstFunction);\n\n```\nwindow.attachEvent('onload',\
    \ firstFunction);\n```\n\nAs you can see, the standard takes the name of the event\
    \ (without the \"on\" prefix), followed by the function that's to be called when\
    \ the event occurs, and an argument that controls event bubbling (see Chapter\
    \ 13 for more details on this). The IE method takes the event handler name (including\
    \ the \"on\" prefix), followed by the name of the function.\n\nTo put these together,\
    \ we need to add some tests to check for the existence of each method before we\
    \ try to use it. We can do this using the JavaScript operator typeof, which identifies\
    \ different types of data (as \"string\", \"number\", \"boolean\", \"object\"\
    , \"array\", \"function\", or \"undefined\\). A method that doesn't exist will\
    \ return \"undefined\"."
