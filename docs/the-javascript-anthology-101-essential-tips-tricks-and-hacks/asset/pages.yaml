  md: "As you probably gathered, I'm not overly impressed by Internet Explorer's error\
    \ reporting, but it is vastly better than nothing: at least you know that an error\
    \ has occurred.\n\n# Using alert\n\nThe alert function is a very useful means\
    \ of analyzing errors—you can use it at any point in a script to probe objects\
    \ and variables to see if they contain the data you expect. For example, if you\
    \ have a function that has several conditional branches, you can add an alert\
    \ within each condition to find out which is being executed:\n\n```\nfunction\
    \ checkAge(years)\n{\n  if (years < 13)\n  {\n    alert('less than 13');\n   \
    \ : other scripting\n  }\n  else if (years >= 13 && years <= 21)\n  {\n    alert('13\
    \ to 21');\n    : other scripting\n  }\n  else\n  {\n    alert('older');\n   \
    \ : other scripting\n  }\n}\n```\n\nMaybe the value for years is not coming back\
    \ as a number, like it should. You could add to the start of your script an alert\
    \ that tests the variable to see what type it is:\n\n```\nfunction checkAge(years)\n\
    {\n  alert(typeof years);\n  :\n```"
