  md: "# Safari and W3C Event Listeners\n\nDue to a bug in Safari, it's impossible\
    \ to cancel the default action of clicking a hyperlink in that browser using W3C\
    \ event listeners. To achieve the cancellation, you'll have to use DOM  event\
    \ handlers with a return value of false.\n\n# Checking for attachEvent\n\nInternet\
    \ Explorer for Windows actually passes an event object to the event-handling function\
    \ when attachEvent is used to attach an event listener. However, we still need\
    \ to check for the existence of this object for any browsers use the old event\
    \ model.\n\nOne of the advantages of W3C event listeners is that you can remove\
    \ an individual listener from an element without disturbing any other listeners\
    \ on the same event. This is not possible with the DOM 0 handlers.\n\nInternet\
    \ Explorer uses the detachEvent method, while the standards-compliant browsers\
    \ specify a method called removeEventListener. Each of these methods operates\
    \ fairly similarly to its listener-counterpart: event type must be supplied along\
    \ with the function that was assigned to handle that event type. The standard\
    \ method also demands to know whether the event handler was registered to respond\
    \ during the capture or bubble phase.\n\nHere's a function that supports this\
    \ approach across browsers:\n\n```\nfunction detachEventListener(target, eventType,\
    \ functionRef, capture)\n  if (typeof target.removeEventListener != \"undefined\"\
    ) {\n    target.removeEventListener(eventType, functionRef, capture);\n  } else\
    \ if (typeof target.dispatchEvent != \"undefined\") {\n    target.dispatchEvent(\"\
    on\" + eventType, functionRef);\n  } else {\n    target[\"on\" + eventType] =\
    \ null;\n  }\n}\n```"
