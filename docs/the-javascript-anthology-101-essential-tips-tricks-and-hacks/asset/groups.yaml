- md: "\n# Creating Elements and Text Nodes\n\nWhen you're traversing the DOM node\
    \ by node using the above properties, you should always allow for these whitespace\
    \ nodes. Usually, this means checking that the node you've retrieved is an element\
    \ node, not just a whitespace node that separating elements.\n\nThere are two\
    \ easy ways to check whether a node is an element node or a text node. The nodeName\
    \ property of a text node will always be \"text\", whereas the nodeName of an\
    \ element node will identify the element type. However, in distinguishing text\
    \ nodes from element nodes, it's easier to check the nodeType property. Element\
    \ nodes have a nodeType of 1, whereas text nodes have a nodeType of 3. You can\
    \ use this knowledge as a test when retrieving elements:\n\n```\nvar star2 = document.getElementById(\"\
    star1\").nextSibling;\nwhile (star2.nodeType == \"3\") {\n  star2 = star2.nextSibling;\n\
    }\n```\n\nFile: access_element4.js (excerpt)\n\nUsing these DOM properties, it's\
    \ possible to start your journey at the root html element, and end up buried in\
    \ the legend of some deeply-nested fieldset—it's all just a matter of following\
    \ the nodes.\n\n# Creating Elements and Text Nodes\n\nJavaScript doesn't have\
    \ the ability to modify existing elements in the DOM; it can also create new elements\
    \ and place them anywhere within a page's structure.\n\n# Solution\n\ncreateElement\
    \ the aptly named method that allows you to create new elements. It only takes\
    \ one argument—the type (as a string) of the element you wish to create—and returns\
    \ a reference to the newly-created element:\n\nFile: create_elements.js (excerpt)\n\
    \n```\nvar newAnchor = document.createElement(\"a\");\n```\n\nThe variable newAnchor\
    \ will be a new element, ready to be inserted into the page.\n\n# Specifying Namespaces\
    \ in Documents with an XML MIME Type\n\nIf you're coding JavaScript for use in\
    \ documents with a MIME type of application/xhtml+xml (or some other XML MIME\
    \ type), you should use the method createElementNS, instead of createElement,\
    \ to specify the namespace for which you're creating the element:\n\n```\nvar\
    \ newAnchor = document.createElementNS(\n  \"http://www.w3.org/1999/xhtml\", \"\
    a\");\n```\n\nThis distinction applies to a number of DOM methods, such as removeElement/removeElementNS\
    \ and getAttribute/getAttributeNS, however, we won't see the namespace-enhanced\
    \ versions of these methods in this book.\n\nSimon Wilson provides a brief explanation\
    \ of working with JavaScript and different MIME types on his web site.\n\nThe\
    \ text inside an element is actually a child node of the element, so it must be\
    \ created separately. Text nodes are different from element nodes, so they have\
    \ their own creation method, createTextNode:\n\n```\nFile: create_elements.js\
    \ (excerpt)\nvar anchorText = document.createTextNodeNode(\"monoceros\");\n```\n\
    \nIf you're modifying an text node, you can access the text via its nodeValue\
    \ property. This allows you to get and set the text inside a text node:\n\n```\n\
    var textNode = document.createTextNodeNode(\"monoceros\");\nvar oldText = textNode.nodeValue;\n\
    textNode.nodeValue = \"pixys\";\n```\n\nThe value of the oldText is now \"monoceros\"\
    , and the text inside textNode is now \"pixys\".\n\nYou can insert either an element\
    \ node or a text node as the last child of an existing element using its appendChild\
    \ method. This method will place the new node after all of the element's existing\
    \ children.\n\nConsider this fragment of HTML:\n\n```html\n<p id=\"starLinks\"\
    >\n<a href=\"sirius.html\">Sirius</a>\n</p>\n```\n\nWe can use DOM methods to\
    \ create and insert another link at the end of the paragraph:\n\n```\nvar anchorText\
    \ = document.createTextNode(\"monoceros\");\nvar newAnchor = document.createElement(\"\
    a\");\nnewAnchor.appendChild(anchorText);\nvar parent = document.getElementById(\"\
    starLinks\");\nvar newChild = parent.appendChild(newAnchor);\n```\n\nThe value\
    \ of the newChild will be a reference to the newly inserted element.\n\nIf we\
    \ need to translate the state of the DOM after this code had executed into HTML\
    \ code, it would look like this:\n\n```html\n<p id=\"starLinks\">\n<a href=\"\
    sirius.html\">Sirius</a>a>monoceros</a>\n</p>\n```\n\nWe don't specify any attributes\
    \ for the new element, so it doesn't link anywhere at the moment. The process\
    \ for specifying attributes is explained shortly in “Reading and Writing the Attributes\
    \ of an Element\".\n\n# Discussion\n\nThere are three basic ways by which a new\
    \ element or text node can be inserted into a web page. The approach you will\
    \ depend depend upon the point at which you want the new node to be inserted:\
    \ the last child of an element, before another node, or as the replacement for\
    \ a node. The process of appending an element as the last child was explained\
    \ above. You can insert the node before an existing node using the `insertBefore`\
    \ method of its parent element, and you can replace a node using the `replaceChild`\
    \ method of its parent element.\n\nIn order to use insertBefore, you need to have\
    \ references to the node you're going to insert, and to the node before which\
    \ you wish to insert it. Consider this HTML code:\n\n```html\n<p id=\"starLinks\"\
    >\n<a id=\"sirius\" href=\"sirius.html\">Sirius</a>\n</p>\n```\n\nWe can insert\
    \ new link before the existing one by calling insertBefore from its parent element\
    \ (the paragraph):\n\n```\nvar anchorText = document.createTextNode(\"monoceros\"\
    );\n\nvar newAnchor = document.createElement(\"a\");\nnewAnchor.appendChild(anchorText);\n\
    \nvar existingAnchor = document.getElementById(\"sirius\");\nvar parent = existingAnchor.parentNode;\n\
    var newChild = parent.insertBefore(newAnchor, existingAnchor);\n```\n\nThe value\
    \ of the variableChild will be a reference to the newly inserted element.\n\n\
    If we were to translate into HTML the state of the DOM after this operation, we\
    \ would look like this:\n\n```html\n<p id=\"starLinks\">\n<a>monoceros</a><a id=\"\
    sirius\" href=\"sirius.htm\">Sirius</a>\n</p>\n```\n\nInstead, we could replace\
    \ the existing link entirely using replaceChild:\n\n```\nvar anchorText = document.createTextNode(\"\
    monoceros\");\n\nvar newAnchor = document.createElement(\"a\");\nnewAnchor.appendChild(anchorText);\n\
    \nvar existingAnchor = document.getElementById(\"sirius\");\nvar parent = existingAnchor.parentNode;\n\
    var newChild = parent.replaceChild(newAnchor, existingAnchor);\n```\n\nThe DOM\
    \ would look like this:\n\n```html\n<p id=\"starLinks\">\n<a>monoceros</a>\n</p>\n\
    ```\n\n# Changing the Type of an Element\n\nAre your ordered lists feeling a bit\
    \ unordered? Do your headings have paragraph envy? Using a little JavaScript knowledge,\
    \ it's possible to change the type of an element entirely, while preserving the\
    \ structure of its children.\n\n# Solution\n\nThere's no straightforward, simple\
    \ way to change the type of an element. In order to achieve this feat you'll have\
    \ to perform a bit of a juggling act.\n\nLet's assume that we want to change this\
    \ paragraph into a div:\n\n```html\n<p id=\"starLinks\">\n<a href=\"sirius.html\"\
    >Sirius</a>\n<a href=\"achanan.html\">Achanan</a>\n<a href=\"hadar.html\">Hadar</a>\n\
    </p>\n```\n\nWe need to create a new div, move each of the paragraph's children\
    \ into it, then swap the new for the old:\n\n```\nvar div = document.createElement(\"\
    div\");\nvar paragraph = document.getElementById(\"starLinks\");\n\nfor (var i\
    \ = 0; i < paragraph.childNodes.length; i++) {\n  var clone = paragraph.childNodes[i].cloneNode(true);\n\
    \  div.appendChild(clone);\n}\nparagraph.parentNode.replaceChild(div, paragraph);\n\
    ```\n\nThe only unfamiliar line here should be the point at which a clone is created.\
    \ The cloneNode method produces an identical copy of the node from which it's\
    \ called. By passing this method the argument true, we indicate that we want all\
    \ of element's children to be copied.\n\n# Navigating the DOM\n\n> The elements\
    \ in a collection are updated automatically when a change occurs in the DOM—even\
    \ if you copy that collection into a variable before the change occurs. So, if\
    \ you remove from the DOM an element that was contained in a collection with which\
    \ you had been working, the element reference will also be removed from the collection.\
    \ This will change the length of the collection as well as the indices of any\
    \ elements that appear after the removed element.\n\nWhen performing operations\
    \ that affect the node structure of the DOM—as moving a node to a new parent element—you\
    \ have to be careful about iterative processes. The code uses a while loop that\
    \ only accesses the first child of the paragraph, because each time a child is\
    \ relocated, the length of the childNodes collection will decrease by one, and\
    \ all the elements in the collection will shift along. A for loop with a counter\
    \ variable would not handle all the children correctly because it would assume\
    \ the contents of the collection would remain the same throughout the loop.\n\n\
    DOM nodes can only belong to one parent element at a time, so adding the nodes\
    \ to the div removes them from the paragraph:\n\n```\nFile change_type_of_element2.js\
    \ (excerpt)\nvar div = document.createElement('div');\nvar paragraph = document.getElementById(\"\
    starLinks\");\n\nwhile (paragraph.childNodes.length > 0) {\n  div.appendChild(paragraph.firstChild);\n\
    }\nparagraph.parentNode.replaceChild(div, paragraph);\n```\n"
  mdcn: "\n\n# 创建元素和文本节点\n\n当你使用上述属性逐个遍历 DOM 节点时，应该始终考虑到这些空白节点。通常，这意味着要检查你获取的节点是否为元素节点，而不仅仅是用于分隔元素的空白节点。\n\
    \n有两种简单的方法可以检查一个节点是元素节点还是文本节点。文本节点的 `nodeName` 属性始终为 \"text\"，而元素节点的 `nodeName`\
    \ 则会标识元素的类型。然而，在区分文本节点和元素节点时，检查 `nodeType` 属性更为简单。元素节点的 `nodeType` 为 1，而文本节点的\
    \ `nodeType` 为 3。你可以在获取元素时将这一知识作为测试条件：\n\n```\nvar star2 = document.getElementById(\"\
    star1\").nextSibling;\nwhile (star2.nodeType == \"3\") {\n  star2 = star2.nextSibling;\n\
    }\n```\n\n文件：access_element4.js（节选）\n\n使用这些 DOM 属性，你可以从根 `html` 元素开始你的旅程，并最终埋没在某个深度嵌套的\
    \ `fieldset` 传奇中——这只是遵循节点路径的问题。\n\n# 创建元素和文本节点\n\nJavaScript 并没有修改 DOM 中现有元素的能力；它还可以创建新元素并将其放置在页面结构的任何位置。\n\
    \n# 解决方案\n\n`createElement` 是一个名副其实的方法，允许你创建新元素。它只接受一个参数——你想要创建的元素类型（字符串形式）——并返回新创建的元素的引用：\n\
    \n文件：create_elements.js（节选）\n\n```\nvar newAnchor = document.createElement(\"\
    a\");\n```\n\n变量 `newAnchor` 将是一个新元素，准备好插入到页面中。\n\n# 在具有 XML MIME 文档中指定命名空间\n\n\
    如果你正在为 MIME 类型为 `application/xhtml+xml`（或其他其他 XML MIME 类型）的文档编写 JavaScript，你应该使用\
    \ `createElementNS` 方法而不是 `createElement`，来为你正在创建的元素指定命名空间：\n\n```\nvar newAnchor\
    \ = document.createElementNS(\n  \"http://www.w3.org/1999/xhtml\", \"a\");\n```\n\
    \n这种区别适用于许多 DOM 方法，例如 `removeElement`/`removeElementNS` 以及 `getAttribute`/`getAttributeNS`，但我们不会在本书书中看到这些方法的命名空间增强版本。\n\
    \nSimon Wilson 在他的网站上简要解释了如何让 JavaScript 与不同的 MIME 类型工作。\n\n元素内部的文本实际上是该元素的子节点，因此必须单独创建。文本节点与元素节点不同，因此它们有自己的创建方法\
    \ `createTextNodeNode`：\n\n```\nFile: create_elements.js (节选)\nvar anchorText\
    \ = document.createTextNodeNode(\"monoceros\");\n```\n\n如果你正在修改文本节点，可以通过它的 `nodeValue`\
    \ 属性访问文本。这允许你获取和设置文本节点内部的文本：\n\n```\nvar textNode = document.createTextNodeNode(\"\
    monoceros\");\nvar oldText = textNode.nodeValue;\ntextNode.nodeValue = \"pixys\"\
    ;\n```\n\n现在 `oldText` 的值是 \"monoceros\"，而 `textNode` 内部的文本现在是 \"pixys\"。\n\n\
    你可以使用现有元素的 `appendChild` 方法将元素节点或文本节点作为最后一个子节点插入。该方法将将新节点放置在元素元素所有现有子节点之后。\n\n\
    考虑这段 HTML 片段：\n\n```html\n<p id=\"starLinks\">\n<a href=\"sirius.html\">Sirius</a>\n\
    </p>\n```\n\n我们可以使用 DOM 方法在段落末尾创建并插入另一个链接：\n\n```\nvar anchorText = document.createTextNode(\"\
    monoceros\");\nvar newAnchor = document.createElement(\"a\");\nnewAnchor.appendChild(anchorText);\n\
    var parent = document.getElementById(\"starLinks\");\nvar newChild = parent.appendChild(newAnchor);\n\
    ```\n\n`newChild` 的值形成插入元素的引用。\n\n如果我们需要将此代码执行后 DOM 的状态翻译成 HTML 代码，它看起来是这样：\n\n\
    ```html\n<p id=\"starLinks\">\n<a href=\"sirius.html\">Sirius</a><a>monoceros</a>\n\
    </p>\n```\n\n我们没有为新元素指定任何属性，因此它目前没有链接到任何地方。指定属性的过程将在稍后的“读取和写入元素的属性”中进行解释。\n\n\
    # 讨论\n\n有三种基本方法可以将新元素或文本节点插入到网页中。你将采用的方法取决于你想要插入新节点的位置：元素的最后一个子节点、另一个节点之前，或者作为某个节点的替换。上述将元素作为最后一个子节点进行追加的过程在文文中已作解释。你可以使用其父元素的\
    \ `insertBefore` 方法在现有节点之前插入节点，并可以使用其父元素的 `replaceChild` 方法替换节点。\n\n为了使用 `insertBefore`，你需要拥有要插入的节点引用，以及你想要在其之前插入的节点引用。考虑这段\
