    \ page. Fortunately, JavaScript gives you access to any element on a page using\
    \ just a few methods and properties.\n\n### Solution\n\nAlthough it's possible\
    \ to navigate an HTML document like a road map—starting from home and working\
    \ your way towards your destination one node at time—this is an inefficient way\
    \ of finding an element because it requires a lot of code, and any changes in\
    \ the structure of the document will usually mean you have to rewrite your scripts.\
    \ If you want to find something quickly and easily, the method that you should\
    \ tattoo the back of your hand is document.getElementById.\n\nAssuming you have\
    \ the correct markup in place, getElementById will allow you to immediately access\
    \ any element by its unique attribute value. For instance, imagine your page contains\
    \ this:\n\n```html\n<p>\n<a id=\"sirius\" href=\"sirius.html\">Journey to the\
    \ stars*</a>\n</p>\n```\n\nYou can use the element's id to get direct access to\
    \ the element itself:\n\n```javascript\nvar elementRef = document.getElementById(\"\
    sirius\");\n```\n\nThe value of the variable elementRef will now be referred to\
    \ the element—any operations that you perform on elementRef will affect that hyperlinking.\n\
    \ngetElementById is good for working with a specific element; however sometimes\
    \ you'll want to work with a group of elements. In order to retrieve a group of\
    \ elements on the basis of their tag names, you can use the method getElementsByTagName.\n\
    \nAs seen from its name, getElementsByTagName takes a tag name and returns all\
    \ elements of that type. Assume that we have this HTML code:\n\n```html\n<ul>\n\
    \  <li><a href=\"sirius.html\">Sirius</a></li>\n  <li><a href=\"canopus.html\"\
    >Canopus</a></li>\n  <li><a href=\"arcturus.html\">Arcturus</a></li>\n  <li><a\
    \ href=\"vega.html\">Vega</a></li>\n</ul>\n```\n\nWe can retrieve a collection\
    \ that contains each of the hyperlinks like so:\n\n```javascript\nvar anchors\
    \ = document.getElementsByTagName(\"a\");\n```\n\nThe value of the variable anchors\
    \ will be a collection of elements. Collections are similar to arrays that each\
    \ of the items in a collection is referenced using square bracket, and the items\
    \ are indexed numerically starting at zero. The collection returned by getElementsByTagName\
    \ sorts the elements by their source, so we can reference each of the links like:\n\
    \n```javascript\nanchorArray[0] = the element for \"Sirius\"\nanchorArray[1] =\
    \ the element for \"Canopus\"\nanchorArray[2] = the element for \"Arcturus\"\n\
    anchorArray[3] = the element for \"Vega\"\n```\n\nUsing this collection you can\
    \ iterate through the elements and perform an operation on them, such as assigning\
    \ a class using the element nodes' className property.\n\n```javascript\nvar anchors\
    \ = document.getElementsByTagName(\"a\");\n\nfor (var i = 0; i < anchors.length;\
    \ i++) {\n  anchors[i].className = \"starLink\";\n}\n```\n\nUnlike getById, which\
    \ may be called on the document node only, the getElementsByTagName method is\
    \ available from every single element node. You can limit the scope of the getElementsByTagName\
    \ method by executing it on a particular element. getElementsByTagName will only\
    \ return elements that are descendants of the method which was called.\n\nIf we\
    \ have two lists, but want to assign a new class to the links in one list only,\
    \ we can target those elements by calling getElementsByTagName on their parent\
    \ list:\n\n```html\n<ul id=\"planets\">\n  <li>\n    <a href=\"mercury.html\"\
    >Mercury</a>\n  </li>\n  <li>\n    <a href=\"venus.html\">Venus</a>\n  </li>\n\
    \  <li>\n    <a href=\"earth.html\">Earth</a>\n  </li>\n  <li>\n    <a href=\"\
    mars.html\">Mars</a>\n  </li>\n</ul>\n<ul id=\"stars\">\n  <li><a href=\"sirius.html\"\
    >Sirius</a></li>\n  <li><a href=\"canopus.html\">Canopus</a></li>\n  <li><a href=\"\
    arcturus.html\">Arcturus</a></li>\n  <li><a href=\"vega.html\">Vega</a></li>\n\
    </ul>\n```\n\nTo target the list, we need to obtain a reference to the parent\
    \ element, then call getElementsByTagName:\n\n```javascript\nvar starsList = document.getElementById(\"\
    stars\");\nvar anchors = starsList.getElementsByTagName(\"a\");\n```\n\n### Discussion\n\
    \nIf you really need to step through the DOM element by element, each node has\
    \ several properties that enable you to access related nodes:\n\n- childNodes:\
    \ a collection that contains source-order references to each of the children of\
    \ the node, including both elements and text nodes\n- firstChild: the first child\
    \ node of the node\n- lastChild: the last child node of the node\n- parentNode:\
    \ a reference to the parent element of the specified node\n- nextSibling: the\
    \ next node in the document that has the same parent as the specified node\n-\
    \ previousSibling: the previous element that's on the same level as the specified\
    \ node\n\nIf any of these properties do not exist for a specific node (e.g., the\
    \ last node of a parent will not have a next sibling), they will have a value\
    \ of null.\n\nTake a look at this simple page:\n\nFile: access_element4.html (excerpt)\n\
    \n```html\n<div id=\"outerGalaxy\">\n  <ul id=\"starList\">\n    <li id=\"star1\"\
    >Rigel</li>\n    <li id=\"star2\">Altair</li>\n    <li id=\"star3\">Betelgeuse</li>\n\
    \  </ul>\n</div>\n```\n\nThe list item with ID star2 could be referenced using\
    \ any of these expressions:\n\n```javascript\ndocument.getElementById(\"star1\"\
    ).nextSibling;\ndocument.getElementById(\"star3\").previousSibling;\ndocument.getElementById(\"\
    starList\").childNodes[1];\ndocument.getElementById(\"star1\").parentNode.childNodes[1];\n\
    ```\n\n### Whitespace Nodes\n\nSome browsers will create whitespace nodes between\
    \ the element nodes in any DOM structure that was interpreted from a text string\
    \ (e.g., an HTML file). Whitespace nodes are nodes that contain only whitespace\
    \ (tabs, spaces, new lines) to help format the code in the way it was written\
    \ in the source file.\n"
  mdcn: "\n\n## 第 5 章：导航文档对象模型 (DOM)\n\n```html\n<p class=\"introduction\">几个年来，恒星对人类来说不仅仅是燃烧的气体球\
    \ ...</p>\n</body>\n</html>\n```\n\n此页面的 DOM 可以视化为图 5.1 所示。\n\n每个页面都有一个文档节点，但它的后代节点源自文档本身的内容。通过使用元素节点、文本节点和属性节点，页面上的每条信息都可以通过\
    \ JavaScript 进行访问。\n\n不过，DOM 并不限于 HTML 和 JavaScript。以下是 W3C DOM 规范² 如何解释这一点的：\n\
    \n文档对象模型（DOM）是一个平台和语言中立的接口，允许程序和脚本动态地访问和更新文档的内容、结构和样式。\n\n因此，尽管 JavaScript 和 HTML\
    \ 的混合是利用 DOM 最常用的技术组合，但你在本章中获得的知识可以应用于许多不同的编程语言和文档类型。\n\n为了让你成为“DOM 大师（DOMain\
    \ master）”，本章将解释如何在网页上找到你寻找的任何元素，然后对其进行修改、重新排序或完全删除。\n\n> ² http://www.w3.org/DOM/\n\
    \n## 图 5.1. 简单 HTML 页面的 DOM 结构，视化为树形层次结构\n\n![](img/ea2a6d5786c46a059cd7778099fdcd56_56_0.png)\n\
    \n## 访问元素\n\n访问提供了控制，控制就是力量，而你是一个强大的程序员，对吧？所以你需要访问网页上的所有内容。幸运的是，JavaScript 允许你通过仅几个方法和属性访问页面上的任何元素。\n\
    \n### 解决方案\n\n虽然可以像路线图一样导航 HTML 文档——从家开始，一个节点一个节点地走向目的地——但这并不是寻找元素的高效方法，因为需要大量代码，而且文档结构的任何变化通常意味着你必须重写脚本。如果你想快速方便地找到某个东西，你应该纹在手背上的方法是\
    \ `document.getElementById`。\n\n假设你已经放置了正确的标记，`getElementById` 将允许你通过其唯一属性值立即访问任何元素。例如，假设你的页面包含以下内容：\n\
    \n```html\n<p>\n<a id=\"sirius\" href=\"sirius.html\">星际之旅*</a>\n</p>\n```\n\n\
    你可以使用元素的 `id` 直接访问元素本身：\n\n```javascript\nvar elementRef = document.getElementById(\"\
    sirius\");\n```\n\n变量 `elementRef` 的值现在将指向该元素——对 `elementRef` 执行的任何操作都将影响该超链接。\n\
    \n`getElementById` 适用于处理特定元素；但有时你可能想处理一组元素。为了根据标签名检索一组元素，你可以使用 `getElementsByTagName`\
    \ 方法。\n\n正如其名所示，`getElementsByTagName` 接受一个标签名并返回该类型的所有元素。假设我们有以下 HTML 代码：\n\n\
    ```html\n<ul>\n  <li><a href=\"sirius.html\">天户座</a></li>\n  <li><a href=\"canopus.html\"\
    >南宿老人星</a></li>\n  <li><a href=\"arcturus.html\">大角二星</a></li>\n  <li><a href=\"\
    vega.html\">织女星</a></li>\n</ul>\n```\n\n我们可以像下面这样获取一个包含每个超链接的集合：\n\n```javascript\n\
    var anchors = document.getElementsByTagName(\"a\");\n```\n\n变量 `anchors` 的值将是一个元素集合。集合与数组相似，集合中的每个项目都使用方括号引用，并且项目从零开始进行数字索引。`getElementsByTagName`\
    \ 返回的集合按其源对元素排序，因此我们可以这样引用每个链接：\n\n```javascript\nanchorArray[0] = \"天户座\"的元素\n\
    anchorArray[1] = \"南宿老人星\"的元素\nanchorArray[2] = \"大角二星\"的元素\nanchorArray[3] =\
    \ \"织女星\"的元素\n```\n\n使用此集合，你可以遍历元素并对它们执行操作，例如使用元素节点的 `className` 属性分配类。\n\n```javascript\n\
    var anchors = document.getElementsByTagName(\"a\");\n\nfor (var i = 0; i < anchors.length;\
    \ i++) {\n  anchors[i].className = \"starLink\";\n}\n```\n\n与可能仅在文档节点上调用的 `getById`\
    \ 不同，`getElementsByTagName` 方法在每个元素节点上都可用。你可以通过在特定元素上执行该方法来限制 `getElementsByTagName`\
    \ 方法的范围。`getElementsByTagName` 将仅返回被调用方法的后代元素。\n\n如果我们有两个列表，但只想为其中一个列表中的链接分配新类，我们可以通过在它们的父列表上调用\
    \ `getElementsByTagName` 来定位这些元素：\n\n```html\n<ul id=\"planets\">\n  <li>\n  \
    \  <a href=\"mercury.html\">水星</a>\n  </li>\n  <li>\n    <a href=\"venus.html\"\
    >金星</a>\n  </li>\n  <li>\n    <a href=\"earth.html\">地球</a>\n  </li>\n  <li>\n\
    \    <a href=\"mars.html\">火星</a>\n  </li>\n</ul>\n<ul id=\"stars\">\n  <li><a\
    \ href=\"sirius.html\">天户座</a></li>\n  <li><a href=\"canopus.html\">南宿老人星</a></li>\n\
    \  <li><a href=\"arcturus.html\">大角二星</a></li>\n  <li><a href=\"vega.html\">织女星</a></li>\n\
    </ul>\n```\n\n为了定位该列表，我们需要获取父元素的引用，然后调用 `getElementsByTagName`：\n\n```javascript\n\
    var starsList = document.getElementById(\"stars\");\nvar anchors = starsList.getElementsByTagName(\"\
    a\");\n```\n\n变量 `anchors` 的值将是一个元素集合。集合与数组相似，集合中的每个项目都使用方括号引用，并且项目从零开始进行数字索引。`getElementsByTagName`\
    \ 返回的集合按其源对元素排序，因此我们可以这样引用每个链接：\n\n```javascript\nanchorArray[0] = \"天户座\"的元素\n\
