    indicator arrows, open and close timers, and automatic repositioning (so that
    a menu never runs off the page''s edge). This chapter also includes solutions
    for the problem of menus overlapping elements in Windows IE 5 and IE 6.


    # Chapter 16: JavaScript and Accessibility


    This chapter provides an overview of the current state of play regarding JavaScript
    and accessibility. It''s focused on ideas and techniques for making scripts accessible
    to the keyboard, and also touches on how scripting may impact on people with learning
    or cognitive disabilities. We''ll also examine a range of different scripts, including
    AJAX applications, to see how they behave with screen readers.


    # Chapter 17: Using JavaScript with Flash


    In this chapter, we will look at the narrow alliance between these two technologies,
    learning to detect whether a user uses the Flash plugin, and mastering communication
    between JavaScript and Flash.


    # Chapter 18: Building Web Applications with JavaScript


    This chapter delves into the exciting area of online application design, including
    data retrieval using XMLHttpRequest, as well as the older technique of using iframes.
    We''ll also talk about creating custom dialogues, building editable elements like
    rich-text entry fields, and controlling and creating text selections to generate
    an auto-complete search field.'
