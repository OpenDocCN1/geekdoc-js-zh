    \ a script can begin exciting things, you have to load it into a web page. There\
    \ are two techniques for doing this, one of which is distinctly better than the\
    \ other.\n\n# Solution\n\nThe first and most direct technique is to write code\
    \ directly inside a script element, as we've seen before:\n\n```\n<script type=\"\
