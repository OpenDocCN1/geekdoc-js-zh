    \ = function() {\n  var size = viewportSize();\n  alert('视口大小: [' + size[0] +\
    \ ', ' + size[1] + ']');\n};\n```\n\n# 总结\n\n在本章中，我们从实用的角度介绍了窗口和框架操作的基础。我们还讨论了创建用户友好且可访问脚本时可以采用的原则和技术。无疑这类工作将继续充满争议，而且显然我们需要某种定位机制，尽管框架的使用正在缓慢消失，但日益复杂的界面出现让这些问题依然存在。\n\
    \n我相当喜欢 XLink 标准中的 `show` 属性，它有 `new` 和 `replace` 等值³。这些建议了一个目标过程（分别是打开新窗口和替换当前窗口内容），但它们并没有实际定义行为。它们将控制发生什么交给了用户代理，例如，*new*\
