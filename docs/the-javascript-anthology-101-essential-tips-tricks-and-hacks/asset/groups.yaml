    \ a hyperlink—this allows users to select a column to sort the table by—and an\
    \ event listener is set on these links to monitor click events, and execute sortColumn\
    \ in response. The title attribute of each link is also set, providing the user\
    \ with information on what will happen when the link is clicked.\n\nThe sortColumn\
    \ function is fairly lengthy, owing to the fact that it must navigate and rearrange\
    \ the entire table structure each time a heading cell is clicked:\n\nFile: sort_tables_by_columns.js\
    \ (excerpt)\n\n```javascript\nfunction sortColumn(event) {\n  if (typeof event\
