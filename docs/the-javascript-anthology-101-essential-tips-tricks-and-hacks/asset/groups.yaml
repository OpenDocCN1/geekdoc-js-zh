  - '[PAGE 37]


    # Chapter 1: Getting Started with JavaScript


    to an old, outdated practice that makes an assumption about the document that
    might not be true: it assumes that the page is served to a non-validating parser.


    All the examples in this book are provided in HTML (as opposed to XHTML), so this
    assumption is reasonable, but if you''re working with XHTML (correctly served
    with a MIME type of application/xhtml+xml), the comments in your code may be discarded
    by a validating XML parser before the document is processed by the browser, in
    which case commented scripts will no longer work at all. For the sake of ensuring
    forwards compatibility (and the associated benefits to your own coding habits
    as much as individual projects), I strongly recommend that you avoid putting comments
    around code this way. Your JavaScript should always be housed in external JavaScript
    files.


    # The language Attribute


    The language attribute is no longer necessary. In the days Netscape 4 and its
    contemporaries were the dominant browsers, the <script> tag''s language attribute
    had the role of sniffing for up-level support (for example, by specifying javascript1.3),
    and impacted on small aspects of the script interpreter worked.


    But specifying a version of JavaScript is pretty meaningless now that JavaScript
    ECMAScript, and the language attribute has been deprecated in favor of the type
    attribute. This attribute specifies the MIME type of included files, such as scripts
    and style sheets, and is the only one you need to use:


    ```

    <script type="text/javascript">

    ```


    Technically, the value should be text/ecmascript, but Internet Explorer doesn''t
    understand that. Personally, I''d be happier if it did, simply javascript is (ironically)
    a word I have great difficulty typing—I''ve lost count of the number of times
    a script failure occurred because I''d typed type="text/javascript".


    # Getting Multiple Scripts to Work on the Same Page


    When multiple scripts don''t work together, it''s almost always the scripts want
    to assign event handlers for the same event on a given element. Since each element
    can have only one handler for each event, the scripts override another''s event
    handlers.'
  - "[PAGE 38]\n\n# Solution\n\nThe usual suspect is the window object's load event\
    \ handler, because only one script on a page can use this event; if two or more\
    \ scripts are using it, the last one will override those that came before.\n\n\
    We could call multiple functions from inside a single load handler, like this:\n\
    \n```\nwindow.onload = function() {\n  firstFunction();\n  secondFunction();\n\
    }\n```\n\nBut, if we used this code, we'd be tied to a single piece of code from\
    \ which we'd have to do everything we need to load. A better solution would provide\
    \ a means of adding load event handlers that don't conflict with other handlers.\n\
    \nWhen the following single function is called, it will allow us to assign any\
