  - "[PAGE 104]\n\n<p>\nThese are the voyages of the <a id=\"mylink\" href=\"enterprise.html\"\
    >starship Enterprise</a></a>.\n</p>\n\nIf a click listener was placed on the paragraph\
    \ and a user clicked on the link, the paragraph's click event handler would be\
    \ executed, the event target that was accessible through the above-mentioned properties\
    \ would be the hyperlink. Some browsers (most notably, Safari) go so far as to\
    \ count the text inside link as the target node.\n\nWe can write a function that\
    \ returns the event target irrespective of which property has been implemented,\
    \ but this does not solve the problem of finding the element to which we originally\
    \ applied the event listener.⁵ The best resolution to this quandary is to iterate\
    \ upwards from the event target provided by the browser until we find an element's\
    \ *likely* to be the element to which we attached an event listener. To do this,\
    \ we can perform checks against the element's tag name, class, and other attributes.\n\
    \nThe abstracting event function would look like this:\n\n```\nfunction getcurrentTarget(event)\
    \ {\n  var targetElement = null;\n\n  if (typeof event.target != \"undefined\"\
    ) {\n    targetElement = event.target;\n  } else {\n    targetElement = event.srcElement;\n\
    \  }\n\n  while (targetElement.nodeType == 3 &&\n         targetElement.parentNode\
    \ != null) {\n    targetElement = targetElement.parentNode;\n  }\n```\n\n> ⁵The\
    \ W3C Standard specifies another property currentTarget lets you get the element\
    \ to which the listener was assigned, but there is no Internet Explorer equivalent.\
    \ Browsers that support currentTarget also set up the eventhandler variable with\
    \ the same value, but again, without Internet Explorer support, this isn't particularly\
    \ useful."
