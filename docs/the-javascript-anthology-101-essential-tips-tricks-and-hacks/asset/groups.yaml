    # Working with Windows and Frames


    This chapter is about simple window and frame manipulation, including tasks like
    opening popups, communicating between frames, and finding out the page’s scrolling
    position.


    Plenty of people feel that window manipulation is akin to the Dark Side. They
    believe that a window is part of the user’s GUI, and since JavaScript is a document
    scripting language, it has no business manipulating windows.


    I’m generally inclined to agree, yet I know that opinion is sometimes a luxury.
    If your clients ask for something specific, you can’t necessarily change their
    minds, or have the freedom to turn down work on the basis of such a principle.
    In this chapter, we’ll cover a range of practical window and frame manipulation
    tasks while remaining sensitive to the usability and accessibility issues that
    arise from their use.


    Note, though, there are limits, and some varieties of window scripting are particularly
    unfriendly. We won''t be dealing with aggressive tactics like closing or modifying
    the user’s primary window, moving windows around the screen, or opening full-screen
    “chromeless” windows. These are exactly the kinds of abuses that have given JavaScript
    a bad name.


    > ¹The techniques involved in reading data from an iframe will be covered in Chapter
    18.'
- md: "\n## Chapter 7: Working with Windows and Frames\n\nThrough most of this chapter\
    \ we'll be looking closely at the properties and methods of the window object.\
    \ These are implemented by different browsers in a variety of ways, most of which\
    \ have been used in the days since JavaScript was standardized.\n\nWe'll have\
    \ quite a few branches to deal with, but we'll avoid the dreaded browser sniffing\
    \ by careful use of object detection, the process of detecting an object or feature\
    \ to test for compatibility, rather than detecting specific browsers.\n\n## Using\
    \ Popup Windows\n\nShould you use popup windows? The most considered answer I\
    \ have is: not if you can help it. Popup windows have gained a bad reputation\
    \ from marketers' aggressive use of them, but even requested popups can be barriers\
    \ to good usability.\n\nI won't say that popups are never appropriate, but I will\
    \ say that they're seldom so. Nevertheless, there are situations where popping\
    \ up a new window is arguably the most appropriate solution: an online survey\
    \ might make the content more approachable; HTML games are another, as the viewport\
    \ may need to be of a known size.\n\nI'll qualify my opinion by discussing the\
    \ problems that popups create, providing a pragmatic method for using them that\
    \ mitigates these problems as much as possible.\n\n## What’s Wrong with Popups?\n\
    \nThe main problem with most popup window scripts is that they don't consider\
    \ the needs of the user—they address only the needs of the designer. The results?\
    \ We've all seen them:\n\n- popups that are generated from links, though those\
    \ links do nothing if scripting is not available\n- popup windows that don't have\
    \ a status bar, so you can't necessarily tell whether the document has loaded\
    \ or stalled, is still loading, etc.\n- popups that don't give users the ability\
    \ to resize the window, and popups that fail to generate scrollbars for content\
    \ that might be outside the window\n- windows that are \"chromeless\", or open\
    \ to the full size of the user's screen\n\nThese issues are not just questions\
    \ of usability, but of accessibility as well. For example, screen-reader users\
    \ may not be notified by their devices that a new window has opened. This could\
    \ obviously cause confusion if they attempted to go back in the browser history\
    \ (they can't). The same thing might happen for a sighted user if a window opens\
    \ at full-size: you may be familiar with the taskbar to monitor open windows,\
    \ but not all computer users—they may not even realize that a new window has popped\
    \ up.\n\nIf you're going to use popups, looking out for these issues, being generally\
    \ sensitive to their impacts, will make the popups friendlier to users, and less\
    \ of a strain on your conscience.\n\nAlso, bear in mind that, from a developer's\
    \ perspective, popup windows are not guaranteed to work: most browsers now include\
    \ options to suppress popup windows, and in some cases, suppression occurs even\
    \ if the popup is generated in response to an event.\n\nYou may be able to allow\
    \ for this as you would for situations in scripting was not supported: by ensuring\
    \ the underlying trigger for the popup still does something useful if the popup\
    \ fails. Or you might have your code open a window and then check its closed property,\
    \ to see if it's actually displayed (we'll look at this technique in the next\
    \ solution).\n\nBut neither of these approaches is guaranteed to work with every\
    \ browser and popup blocker out there, so for as much as the usability reasons,\
    \ it's simpler and better to avoid using popups whenever you can.\n\n## How Do\
    \ I Minimize the Problems?\n\nWhat we need to do is establish some golden rules\
    \ for the ethical use of popups:\n\n- Make sure any triggering link degrades properly\
    \ when scripting is not available.\n- Always include the status bar.\n- Always\
    \ include a mechanism to overflow the content: either allow window resizing, or\
    \ allow scrollbars to appear, or both.\n- Do not open windows that are larger\
    \ than 640x480 pixels.\n\nBy limiting the size of the popups, you ensure that\
    \ they’re smaller than users' primary windows on the vast majority of monitors.\
    \ This increases the likelihood that user will resize the popup to be a new window.\n\
    \n## Solution\n\nHere’s a generic popup function that’s based on the guidelines\
    \ above:\n\nFile: make-popup.js (excerpt)\n\n```javascript\nfunction makePopup(url,\
    \ width, height, overflow)\n{\n  if (width > 640) { width = 640; }\n  if (height\
    \ > 480) { height = 480; }\n\n  if (overflow == '' || !/(scroll|resizebot)/.test(overflow))\
    \ {\n    overflow = 'both';\n  }\n\n  var win = window.open(url, '',\n    'width='\
    \ + width + ',height=' + height +\n    ',scrollbars=' + /(scroll|bot)/.test(overflow)\
    \ ?\n      'yes' : 'no') +\n    ',resize=' + /(resizebot)/.test(overflow) ?\n\
    \      'yes' : 'no') +\n    ',status=yes,toolbar=no,menubar=no,location=no'\n\
    \  );\n\n  return win;\n}\n```\n\nAs well as limiting the window size, this script\
    \ serves to create a popup that doesn’t have an overflow, so if you don’t specify\
    \ \"scroll\", \"resize\", or \"both\" for overflow argument, the default setting\
    \ of \"both\" will be used.\n\n## The Ternary Operator\n\nThis script uses a shortcut\
    \ called ternary operator to evaluate two possible outcomes. The ternary operator\
    \ uses characters like this:\n\n```javascript\nif (outlook == 'optimistic') {\n\
    \  glass = 'half-full';\n} else {\n  glass = 'half-empty';\n}\n```\n\n## How Do\
    \ I Minimize the Problems?\n\nThe window.open method can take a number of arguments—in\
    \ addition to the URL and name—which specify whether the window should have decorations,\
    \ such as the menu bar, tool bar, or address (location) bar. For example:\n\n\
    ```javascript\nvar win = window.open('page.html', 'winName',\n      'width=640,height=480',\n\
    \      ',scrollbars=yes,resizable=yes,status=yes,\n      'toolbar=no,menubar=no,location=no');\n\
    ```\n\nIn our makePopup function, the menubar, toolbar, and location arguments\
    \ are all preset to no because these elements are rarely useful for popup windows.\
    \ Popups are mostly used for one-page interfaces, or those in which history is\
    \ discouraged, as our survey example, or the login procedure for a bank site.\n\
    \nFile: make-popup.js (excerpt)\n\n```javascript\ndocument.getElementById('survey_link').onclick\
    \ = function() {\n  var survey = makePopup('cpanel.html', 640, 480, 'scroll');\n\
    \n  if (survey.closed) {\n    // handle failure\n  }\n};\n```\n\n## Discussion\n\
    \nYou can change these arguments if you need to, but the status argument should\
    \ always be set to yes, because turning it off degrades usability. (I know—I've\
    \ mentioned it already, but I'm saying again because it's important!)\n\nThe resizable\
    \ argument may have any effect—in some browsers, by design or as a result of user\
    \ preferences, it's not possible to create non-resizable windows, even if you\
    \ set this value to no. In fact, in Opera 8 for Mac OS X, it is not possible to\
    \ create custom-sized windows at all—a created window will appear as a new tab\
    \ in the current window. That specific exception might not be significant in itself,\
    \ but it serves to illustrate the general point that control over the properties\
    \ of a created window is not absolutely guaranteed.\n\nOnce a new window is open,\
    \ you can bring it into focus using the object's focus method. This isn't usually\
    \ necessary—generally, it happens by default—but the technique may be useful when\
    \ you're scripting with multiple windows:\n\n```javascript\nvar cpanel = makePopup('cpanel.html',\
    \ 480, 240, 'resize');\ncpanel.focus();\n```\n\nAlternatively, you may want to\
    \ create a popup but keep the focus in the primary window (the so-called 'popunder').\
    \ You can take the focus away from a window using its blur method:\n\n```javascript\n\
    var cpanel = makePopup('cpanel.html', 480, 240, 'resize');\ncpanel.blur();\n```\n\
    \nHowever, in that you can't predict where the focus will go to next, so it's\
    \ more reliable to refocus the primary window.\n"
  mdcn: "\n\n## 第 7 章：处理窗口与框架\n\n在本章的大部分内容中，我们将仔细研究窗口对象的属性和方法。这些内容由不同的浏览器以各种方式实现，其中大多数方法自\
    \ JavaScript 标准化以来一直被广泛使用。\n\n我们会有很多分支需要处理，但我们将通过仔细使用“对象检测”（object detection）来避免可怕的“浏览器嗅探”。对象检测是通过检测某个对象或特征来测试兼容性，而不是检测特定的浏览器。\n\
    \n## 使用弹出窗口\n\n你应该使用弹出窗口吗？我经过深思后的答案是：如果可以，尽量不要。弹出窗口因为营销人员的激进使用而声声，但即使是用户请求的弹出窗口也可能是良好可用性的障碍。\n\
    \n我不会说弹出窗口永远不适用，但我会说它们很少适用。尽管如此，在某些情况下，弹出一个新窗口可以说是是最合适的解决方案：在线调查可能会让内容更易于理解；HTML\
    \ 游戏是另一个例子，因为视口可能需要固定的尺寸。\n\n我会通过讨论弹出窗口产生的问题来限定我的观点，并提供一种实用的使用方法，以尽可能减轻这些问题。\n\
    \n## 弹出窗口有什么问题？\n\n大多数弹出窗口脚本的主要问题是它们没有考虑用户的需求——它们只考虑设计者的需求。结果是什么？我们都见过它们：\n\n\
    - 从链接生成的弹出窗口，尽管在不支持脚本的情况下这些链接将不起任何作用。\n- 没有状态栏的弹出窗口，因此你无法判断文档是已经加载完成还是停滞、仍在加载中等。\n\
    - 不允许用户调整窗口大小的弹出窗口，以及未能为可能超出窗口的内容生成滚动条的弹出窗口。\n- “无框”（chromeless）窗口，或以用户屏幕全屏打开的窗口。\n\
    \n这些问题不仅是可用性问题，也是可访问性问题。例如，屏幕阅读器用户可能不会收到设备通知新窗口已打开。如果他们尝试在浏览器历史记录中返回（他们做不到），这显然会引起困惑。视力用户如果窗口全屏打开，也可能发生同样的情况：你可能熟悉任务栏以监控打开的窗口，但并不是所有电脑用户都如此——他们可能甚至没有意识到新窗口弹出了。\n\
    \n如果你打算使用弹出窗口，留意这些问题并对它们的影响保持敏感，将会让弹出窗口对用户更友好，并减轻你的良心负担。\n\n此外，请记住，从开发者的角度来看，弹出窗口并不保证能正常工作：大多数浏览器现在都包含了抑制弹出窗口的选项，在某些情况下，即使弹出窗口是响应事件生成的，它也会被抑制。\n\
    \n你可能像处理不支持脚本的情况那样处理这种情况：通过确保即使弹出窗口失败，底层的触发器仍然执行某些有用操作。或者你可能会让代码打开一个窗口，然后检查它的\
    \ `closed` 属性以查看它是否实际显示（我们将在下一个解决方案中研究这种技术）。\n\n但这两种方法都不能保证在每个浏览器和弹出窗口拦截器上有效，因此出于可用性考虑，尽可能避免使用弹出窗口更为简单且更好。\n\
    \n## 如何将问题最小化？\n\n我们需要做的是为合理使用弹出窗口建立一些黄金准则：\n\n- 确保任何触发链接在不支持脚本时都能正确降级处理。\n- 始终包含状态栏。\n\
    - 始终包含处理内容溢出的机制：要么允许调整窗口大小，要么允许滚动条出现，或者兼具。\n- 不要打开大于 640x480 像素的窗口。\n\n通过限制弹出窗口的大小，你可以确保它们在绝大多数显示器上比用户的主窗口小。这增加了用户将弹出窗口调整为新窗口的概率。\n\
    \n## 解决方案\n\n这是一个基于上述指南的通用弹出窗口函数：\n\n文件：make-popup.js（节选）\n\n```javascript\nfunction\
    \ makePopup(url, width, height, overflow)\n{\n  if (width > 640) { width = 640;\
    \ }\n  if (height > 480) { height = 480; }\n\n  if (overflow == '' || !/(scroll|resizebot)/.test(overflow))\
    \ {\n    overflow = 'both';\n  }\n\n  var win = window.open(url, '',\n    'width='\
    \ + width + ',height=' + height +\n    ',scrollbars=' + /(scroll|bot)/.test(overflow)\
    \ ?\n      'yes' : 'no') +\n    ',resize=' + /(resizebot)/.test(overflow) ?\n\
    \      'yes' : 'no') +\n    ',status=yes,toolbar=no,menubar=no,location=no'\n\
    \  );\n\n  return win;\n}\n```\n\n除了限制窗口大小外，该脚本用于创建一个没有溢出问题的弹出窗口，因此如果你没有为 `overflow`\
    \ 参数指定 \"scroll\"、resize\" 或 \"both\"，将使用默认设置 \"both\"。\n\n## 三元运算符\n\n此脚本使用一种称为“三元运算符”的快捷方式来评估两种可能的结果。三元运算符使用如下字符：\n\
    \n```javascript\nif (outlook == 'optimistic') {\n  glass = 'half-full';\n} else\
    \ {\n  glass = 'half-empty';\n}\n```\n\n## 如何将问题最小化？\n\n`window.open` 方法可以接受多个参数——除了\
    \ URL 和名称之外——还可以指定窗口是否应该具有装饰，如菜单栏、工具栏或地址（location）栏。例如：\n\n```javascript\nvar\
    \ win = window.open('page.html', 'winName',\n      'width=640,height=480',\n \
    \     ',scrollbars=yes,resizable=yes,status=yes,\n      'toolbar=no,menubar=no,location=no');\n\
    ```\n\n在我们的 `makePopup` 函数中，菜单栏、工具栏和位置参数都预设置为 no，因为这些元素对于弹出窗口很少用。弹出窗口主要用于单页界面，或者不建议使用历史记录的界面（如调查示例），或银行网站的登录程序。\n\
    \n文件：make-popup.js（节选）\n\n```javascript\ndocument.getElementById('survey_link').onclick\
    \ = function() {\n  var survey = makePopup('cpanel.html', 640, 480, 'scroll');\n\
    \n  if (survey.closed) {\n    // 处理失败\n  }\n};\n```\n\n## 讨论\n\n你可以根据需要更改这些参数，但状态参数应该始终设置为\
    \ yes，因为关闭它会降低可用性。（我知道——我已经提过了，但我再次强调是因为这很重要！）\n\n`resizable` 参数可能会产生任何影响——在某些浏览器中，由于设计或用户偏好，无法创建不可调整的窗口，即使你将其设置为\
    \ no。事实上，在 Mac OS X 的 Opera 8 中，无法创建自定义尺寸的窗口——创建窗口将作为当前窗口的新标签页出现。这个特定的异常本身可能并不重要，但它说明了一个观点：对创建窗口属性的控制并不是绝对保证性的。\n\
    \n一旦打开新窗口，你可以使用对象的 `focus` 方法将其置顶。这通常不是必要的——通常情况下，它是默认发生的——但这种技术在处理多个窗口脚本时可能有用：\n\
    \n```javascript\nvar cpanel = makePopup('cpanel.html', 480, 240, 'resize');\n\
    cpanel.focus();\n```\n\n或者，你可能想创建一个弹出窗口但保持焦点留在主窗口（所谓的“后弹出”popunder）。你可以使用 `blur`\
    \ 方法从窗口中取消焦点：\n\n```javascript\nvar cpanel = makePopup('cpanel.html', 480, 240,\
    \ 'resize');\ncpanel.blur();\n```\n\n然而，在这种情况下你无法预测焦点将移动到哪里，因此重新聚焦主窗口更为可靠。\n\n"
