    \nOrder the print version of this book to get all 588 pages! \n 233"
  - "[PAGE 99]\n\n# Chapter 13: Basic Dynamic HTML\n\nIn the W3C specification, an\
    \ event can be added to an element using the element's addEventListener, but Internet\
    \ Explorer for Windows chooses to use a method called attachEvent, which has a\
    \ slightly different syntax.^3\n\nTo add event listener in every browser except\
    \ Internet Explorer, you would write code similar to this:\n\n```\nvar mylink\
    \ = document.getElementById(\"mylink\");\\mylink.addEventListener(\"click\", event,\
    \ false);\n```\n\nTo support Internet Explorer, you'd need this code:\n\n```\n\
    var mylink = document.getElementById(\"mylink\");\\mylink.attachEvent(\"onclick\"\
    , engage);\n```\n\nAs well as the differing function names, it's important to\
    \ note that Internet Explorer uses the DOM 0 handler name for the event—\"onclick\"\
    —rather the true name: \"click\". The extra argument specifies whether the listener\
    \ is applied during the capture (true) or bubble (false) event propagation phase.\
    \ Event propagation is explained in more detail in the discussion below, but bubble\
    \ is really the most useful choice, and ensures the same behavior in standards-compliant\
    \ browsers in Internet Explorer.\n\nThe differences between these two approaches\
    \ are fairly easy to work around using aning function. We can also provide a fallback\
    \ for browsers that don't support W3C listeners to work at the same time:\n\n\
    ```\n// File: handle_events.js (excerpt)\nfunction attachEventListener(target,\
    \ eventType, functionRef) {\n    if (typeof target.addEventListener !== \"undefined\"\
    ) {\n        target.addEventListener(eventType, functionRef, capture);\n    }\
    \ else if (typeof target.attachEvent !== \"undefined\") {\n        target.attachEvent(\"\
    on\" + eventType, functionRef);\n    }\n}\n```\n\n> ^3Internet Explorer for Mac\
    \ doesn't support either of these event models, so we have to rely on the DOM\
    \ 0 handlers to work in this browser.\n\nOrder the print version of this book\
    \ to get all 588 pages!"
