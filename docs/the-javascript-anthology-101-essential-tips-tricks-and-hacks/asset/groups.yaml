    We can use four references for cross-frame scripting:


    +   - window or self refers to the current framed page.

    - parent refers to the page that contains the frame that contains the current
    page.

    - top refers to the page at the very top of the hierarchy of frames, which will
    be the same as parent if there''s only one frameset in the hierarchy.

    - The frames collection is an associative array of all frames in the current page.


    Let''s say we have a script inFrame that wants to communicate the page in navigationFrame.
    Both pages are contained in a single frameset—the only one in the hierarchy—so
    we could successfully make any of the following references from within contentFrame:


    +   - parent.frames[0]

    - top.frames[0]

    - parent.frames[''navigationFrame'']

    - top.frames[''navigationFrame'']


    The frames collection is an associative array (like the forms collection we saw
    in Chapter 6, so each element can be accessed by either index or name. It''s generally
    better to use the name (unless you have a good reason not to) so you won''t have
    to edit your code later if the frame order changes. By the same token, parent
    references in a complex nested frameset can change if the hierarchy changes, so
    I recommend that developers always start referencing from top. Of the above options,
    the reference I prefer, is, top.frames[''navigationFrame''].


    Now that we have a reference to the frame, we can call a function in the other
