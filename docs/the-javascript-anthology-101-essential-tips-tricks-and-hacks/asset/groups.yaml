  - '[PAGE 30]


    Providing Users who Don''t Have JavaScript (Progressive Enhancement)


    # # Discussion


    The "traditional" approach to this scenario would be to generate a separate, dynamic
    menu in pure JavaScript, and to have fallback content inside a noscript element:


    ```

    <script type="text/javascript" src="menu.js"></script>

    ```


    ```

    <noscript>

    <ul>

    <li><a href="/">Home</a></li>

    <li><a href="/about">About</a></li>

    <li><a href="/contact">Contact</a></li>

    </ul>

    </noscript>

    ```


    But, as we''ve already seen, a wide range of devices will fail this not, because
    JavaScript support is no longer an all-or-nothing proposition. The above approach
    provides default content to all devices, and scripts functionality only if it
    works.


    This scripting approach is popularly referred to as progressive enhancement, and
    it''s a methodology we will be using throughout this book.


    # # Don''t Ask!


    ![](img/ea2a6d5786c46a059cd7778099fdcd56_30_0.png)


    Neither this technique nor the noscript element should be used to add a message
    that reads, "Please turn on JavaScript to continue." At best, a message is presumptive
    ("Why should I?"), at worst it may be unhelpful ("I can''t!") or meaningless ("What''s
    JavaScript?"). Just like splash pages that say, "Please upgrade your browser,"
    are as useful to the average web as a road sign reads, "Please use a different
    car."


    Occasionally, you may be faced with a situation in which equivalent functionality
    cannot be provided without JavaScript. In such cases, it''s okay to have a static
    message that informs the user of this incompatibility (in nontechnical terms,
    of course). But, for the most part, try to avoid providing this kind of message
    unless it''s literally the only way.


