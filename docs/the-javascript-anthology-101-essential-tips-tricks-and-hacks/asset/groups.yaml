    # Discussion


    In its journey from the free-roaming Netscape wilderness to the more

    defined, standards-based terrain of the modern age, the DOM standard has picked

    up a fair amount of extra syntax for dealing with HTML. One of the most pervas-

    ive of these extras is the mapping between DOM properties and HTML attributes.


    When a document is parsed into its DOM, special attribute nodes are created

    for an element''s attributes. These are not accessible as "children" of

    element; they are accessible only via the two methods mentioned above. However,

    as throwback to the original DOM implementations (called DOM 0, where the

    zero suggests these features came prior to standards), current DOM specs contain

    additional functionality thatspecific to HTML. In particular, attributes are

    accessible directly as properties of an element. The href attribute of a hyperlink

    is accessible through link.getAttribute("href") as well as through link.href.


    This shortcut is not only cleaner and more readable: in some situations

    it Internet Explorer 6 and versions below will not propagate

    changes made via setAttribute to the visual display of an element. Any

    changes that are made to the class, id, or style of an element using

    setAttribute will not affect the way it''s displayed. In order for those changes

    to effect, they must be made via the element''s attribute-specific prop-

    erties.


    To confuse matters, the values that are returned when an attribute-specific

    property is read vary between browsers, the most notable occurring in

    Konqueror. If an attribute doesn''t exist, Konqueror will return null as the value

    of attribute-specific property, while all other browsers will return an empty

    string. In a more specific case, some browsers will return link.getAttrib-

    ute("href") as an absolute URL (e.g., "http://www.example.com/ant-")


