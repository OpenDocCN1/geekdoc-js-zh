    # Preface


    To many people, the word "JavaScript" conjures up memories of annoying popups,
    irritating mouse-trails, and frustrating no-right-click clicks. If you''ve ever
    been on the receiving end of such a script, you''ll know how tedious they can
    be. Yet JavaScript is a mature, professional scripting language that''s used on
    the majority of modern web sites, and is a key component in almost all web-based
    applications. Hang on! Are we talking about the technology here?


    As with many stories, both perceptions are reasonably accurate: JavaScript does
    have a dubious reputation, it earned mainly in the first dot boom when it was
    used for little else than opening popups, shielding from casual scrutiny, and
    adding pointless whiz-bang effects. In recent years, as both the web development
    community and the world at large have become more aware of accessibility issues,
    JavaScript has been singled out as a case of many problems, though in reality,
    it''s not the technology that''s at fault—it''s poorly planned and careless use
    that has given JavaScript this reputation.


    With increasing popularity of remote scripting techniques (popularly referred
    to as "AJAX"), JavaScript is enjoying something of a renaissance. Designers, developers,
    and programmers from many different disciplines are becoming interested—and impressed
    bywhat was once the domain of specialists. Browser vendors and other technology
    companies are taking another look at the potential of this powerful language,
    as the line between the Web and the desktop becomes increasingly blurred.


    JavaScript is a key component in the development of a raft of new applications,
    and there''s never been a better time to take an interest in it.


    # Who Should Read this Book?


    Anyone who''s involved or interested in building web sites or web applications
    should read this webbook.


    If you''re a webmaster looking for copy-and-paste solutions to everyday needs,
    we have those solutions for you. If you''re already an experienced JavaScript
    programmer, you''ll find this in this book scripts and discussions that sit on
    the bleeding edge of current practice. If you''re a designer with an interest
    in the coding side of things, or a student who''s just beginning to get into it,
    you''ll find rich and beautiful examples to give you insight and ideas.'
