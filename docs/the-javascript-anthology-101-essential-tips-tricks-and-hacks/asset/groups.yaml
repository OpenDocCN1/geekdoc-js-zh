    }\n```\n\nYou'll note that, in the function assignment (button.onclick = engage),\
    \ parentheses do not follow the function name. Their inclusion would execute the\
    \ function immediately, and assign the return value as the event handler. By omitting\
    \ the parentheses, you can assign the function itself to the handler. This also\
    \ means that you cannot supply arguments directly to the handling function: the\
    \ function must obtain its information through other means.\n\n# Anonymous Functions\n\
    \nInstead of supplying a reference to a named function, you can supply an anonymous\
    \ function for an event handler:\n\n```\nvar myylink = document.getElementById(\"\
    mylink\");\nmylink.onclick = function() {\n  alert(\"Engage!\");\n\n  return false;\n\
    }\n```\n\nDepending on whether you need to reuse the handling function (and your\
    \ coding preferences), this can be an easier way of writing event handler code.\n\
    \nThe return value of the handling function determines whether the default action\
    \ for that event occurs. So, in the preceding code, if button were a hyperlink,\
    \ its default action when clicked would be to navigate to its href location. By\
    \ returning false, the engage function does not allow the default action to occur,\
    \ and the hyperlink navigation will not take place. If the return value were true,\
    \ the default action would occur after the event handling function's code had\
    \ executed.\n\nOrder the print version of this book to get all 588 pages!"
  - "[PAGE 98]\n\nWhen an event occurs, detailed information about the how, why, and\
