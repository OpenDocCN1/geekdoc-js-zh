  mdcn: "\n由于字体大小和内容长度等因素，在加载页面之前通常无法硬编码元素的位置。JavaScript 提供了一种方法在页面渲染后确定任何元素位置的方法，这样你就能确切知道你的元素所在的位置。\n\
    \n## 解决方案\n\n`offsetTop` 和 `offsetLeft` 属性告诉我们元素顶部与其 `offsetParent`（偏移父）顶部之间的距离。但什么是\
