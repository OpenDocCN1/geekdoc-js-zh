  - "[PAGE 94]\n\n# 13\nBasic Dynamic HTML\n\nDynamic HTML isn’t a single piece of\
    \ technology that you can point to and say, \n“This is DHTML.\". The term is a\
    \ descriptor that encompasses all of the technologies that let you / create new\
    \ elements without refreshing the page, change the color of those elements, and\
    \ make them expand, contract, and zoom around the screen.\n\nDHTML uses HTML,\
    \ the DOM, and CSS in combination with a client-side scripting language—JavaScript—to\
    \ bring life to what was traditionally a static medium. In previous chapters,\
    \ we learned that we can use JavaScript to manipulate parts of a page to achieve\
    \ some very handy results. DHTML provides solutions to much more complex problems\
    \ by assembling these into a coherent whole—one that satisfies real-world needs,\
    \ rather than programming puzzles.\n\nThis chapter explores few of the tools we\
    \ need in order to create effective user interfaces with HTML. It then discusses\
    \ a couple of small widgets in preparation for the more complex modules we’ll\
    \ consider throughout the rest of this book.\n\n# Handling Events\n\nAny interaction\
    \ that users have with a web page—whether they’re moving the mouse or tapping\
    \ the keyboard—will cause the browser to generate an event."
- md: "\n# Chapter 13: Basic Dynamic HTML\n\nSometimes, we overwrite our code to respond\
    \ to this interaction, so we listen for these events, which let us know when we\
    \ should execute our code.\n\n## Solution\n\nThere are two ways to handle events:\
    \ the short way, and the W3C way. Each has its pros and cons, but both allow you\
    \ to execute a specified function when an event occurs on a particular element.\n\
    \n## The Short Way: Using Event Handlers\n\nThe short way of handling an event\
    \ is to use the DOM 0 event handlers that are assigned as shortcut properties\
    \ of every element. Much as we saw in Chapter 5 when we discussed DOM 0 attribute\
    \ shortcuts, these event handlers are not future-proof. However, they do offer\
    \ some advantages over standard W3C event listeners.\n\n- Every browser's that\
    \ currently in operation supports DOM 0 event handlers without the need for code\
    \ branching.\n- Each function executed by a DOM 0 event handler has access to\
    \ the exact element to which the event handler was assigned. (As you'll see later,\
    \ this is not always available in W3C event listeners.)\n\nThe main problem with\
    \ utilizing DOM 0 event handlers is that they are not designed to work with multiple\
    \ scripts. Every time you assign a DOM 0 event handler, you overwrite any previously\
    \ assigned handler for that. This can interfere with the operation of multiple\
    \ scripts that require event handling on the same element. With W3C event listeners,\
    \ you can add any number of event listeners on the same element, and enjoy the\
    \ ability to remove any of them at any time.\n\nIf you can be certain that your\
    \ code will not interfere with someone else's event handling (e.g., you're placing\
    \ on elements that are created dynamically in your own script), it will be safe\
    \ to use DOM 0 event handlers. But—all things being equal—it is safer to use the\
    \ W3C event listeners wherever practical, as we do in this book.\n\nA number of\
    \ DOM 0 event handlers are available via the browser; Table 13.1 lists the most\
    \ commonly used handlers.\n\n### Table 13.1. DOM 0 event handlers\n\n| DOM 0 Event\
    \ Handler | W3C DOM Event | Indicated Action |\n|---|---|---|\n| onblur | blur\
    \ | Remove focus from an element by clicking outside or tabbing away from it.\
    \ |\n| onfocus | focus | Focus the cursor on an element. |\n| onchange | change\
    \ | Remove focus from an element after changing its content. |\n| onmouseover\
    \ | mouseover | Move the mouse pointer over an element. |\n| onmouseout | mouseout\
    \ | Move the mouse pointer out of an element. |\n| onmousemove | mousemove | Move\
    \ the mouse pointer while it is over an element. |\n| onmousedown | mousedown\
    \ | Press a mouse button while the pointer is over an element. |\n| mousemouseup\
    \ | mouseup | Release a mouse button while the pointer is over an element. |\n\
    | onclick | click | Press and release the main mouse button or keyboard equivalent\
    \ (Enter key) while the pointer is over an element. |\n| ondblclick | dblclick\
    \ | Double-click the main mouse button while the pointer is over an element. |\n\
    | onkeydown | keydown | Press a keyboard key while an element has focus. |\n|\
    \ onkeyup | keyup | Release a keyboard key while an element has focus. |\n| onkeypress\
    \ | keypress | Press and release a keyboard key while an element has focus. |\n\
    | onsubmit | submit | Request a form to be submitted. |\n| onload | load | Finish\
    \ loading a page and all associated assets (e.g., images). |\n| onunload | unload\
    \ | Request a new page to replace the currently-displayed page, or close the window\
    \ |\n\nUsing DOM 0 event handlers, once you have a reference to the element whose\
    \ events you want to handle, it’s a simple matter of assigning a handling function\
    \ to the appropriate property:\n\n```javascript\nFile: handle_events.js (excerpt)\n\
    var mylink = document.getElementById(\"mylink\");\nmylink.onclick = engage;\n\n\
    function engage() {\n  alert(\"Engage!\");\n\n  return false;\n}\n```\n\nYou'll\
    \ note that, in the function assignment (button.onclick = engage), parentheses\
    \ do not follow the function name. Their inclusion would execute the function\
    \ immediately, and assign the return value as the event handler. By omitting the\
    \ parentheses, you can assign the function itself to the handler. This also means\
    \ that you cannot supply arguments directly to the handling function: the function\
    \ must obtain its information through other means.\n\n## Anonymous Functions\n\
    \nInstead of supplying a reference to a named function, you can supply an anonymous\
    \ function for an event handler:\n\n```javascript\nvar mylink = document.getElementById(\"\
    mylink\");\nmylink.onclick = function() {\n  alert(\"Engage!\");\n\n  return false;\n\
    }\n```\n\nDepending on whether you need to reuse the handling function (and your\
    \ coding preferences), this can be an easier way of writing event handler code.\n\
    \nThe return value of the handling function determines whether the default action\
    \ for that event occurs. So, in the preceding code, if button were a hyperlink,\
    \ its default action when clicked would be to navigate to its href location. By\
    \ returning false, the engage function does not allow the default action to occur,\
    \ and the hyperlink navigation will not take place. If the return value were true,\
    \ the default action would occur after the event handling function's code had\
    \ executed.\n\nWhen an event occurs, detailed information about the how, why,\
    \ and where of event is written to the event. In Internet Explorer, this takes\
    \ the form of a global object, for example:\n\n```javascript\nFile: handle_events.js\
    \ (excerpt)\nfunction engage(event) {\n  if (typeof event == \"undefined\") {\n\
    \    event = window.event;\n  }\n\n  alert(\"The coordinates of your click: \"\
    \ + event.screenX + \", \" + event.screenY);\n\n  return false;\n}\n```\n\nThe\
    \ differences between these two approaches are fairly easy to work around using\
    \ a wrapping function. We can also provide a fallback for browsers that don't\
    \ support W3C listeners to work at the same time:\n\n## The W3C Way (Event Listeners)\n\
    \nAlthough the DOM event handlers are quick and easy, they have limitations (aside\
    \ from the fact that they eventually become deprecated). The main advantage of\
    \ W3C event listeners is that they natively support the addition and removal of\
    \ multiple functions for the same event. Event listeners also have the capability\
    \ to respond to events in several phases. In the W3C specification, an event can\
    \ be added to an element using the addEventListener, but Internet Explorer for\
    \ Windows chooses to use a method called attachEvent, which has a slightly different\
    \ syntax.\n\nTo add event listener in every browser except Internet Explorer,\
    \ you would write code similar to this:\n\n```javascript\nvar mylink = document.getElementById(\"\
    mylink\");\nmylink.addEventListener(\"click\", engage, false);\n```\n\nTo support\
    \ Internet Explorer, you'd need this code:\n\n```javascript\nvar mylink = document.getElementById(\"\
    mylink\");\nmylink.attachEvent(\"onclick\", engage);\n```\n\nAs well as the differing\
    \ function names, it's important to note that Internet Explorer uses the DOM 0\
    \ handler name for the event—\"onclick\"—rather the true name: \"click\". The\
    \ extra argument specifies whether the listener is applied during the capture\
    \ (true) or bubble (false) event propagation phase. Event propagation is explained\
    \ in more detail in the discussion below, but bubble is really the most useful\
    \ choice, and ensures the same behavior in standards-compliant browsers in Internet\
    \ Explorer.\n"
  mdcn: "\n\n# 第 13 章：基础动态 HTML\n\n有时，为了响应这种交互，我们会重写代码，因此我们监听这些事件，这些事件能让我们知道何时应该执行代码。\n\
