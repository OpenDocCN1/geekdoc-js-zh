    # #1 Getting Started with JavaScript


    As we hope to demonstrate in many practical solutions throughout this book, JavaScript
    is an amazingly useful language that offers many unique benefits. With a little
    consideration for how scripted functionality degrades, you can use JavaScript
    to bring a whole range of functional, design and usability improvements to your
    web sites.


    Let''s begin with an introduction to JavaScript, exploring what it''s for, and
    how we can use it.


