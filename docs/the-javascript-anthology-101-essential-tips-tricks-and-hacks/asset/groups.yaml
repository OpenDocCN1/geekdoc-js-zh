    # Summary


    The two main pillars of HTML are the capturing of events, and the reorganization
    and creation of page elements via the DOM. Using these principles, it''s possible
    to capture many of the different ways that users interact with a page and make
    the interface respond accordingly.


    As can be seen by the number and quality of JavaScript-enhanced web applications
    that are now available, the features HTML can bring to new interfaces represents
    one of the biggest growth areas for innovative JavaScript. The foundations and
    basic examples shown in this chapter give you a sense of the power that it can
    deliver inside a user''s browser. We''ll expand upon this further in the following
    chapters as we build some really interesting interfaces.


    # What’s Next?


    If you''ve enjoyed these chapters from The JavaScript Anthology: 101 Tips, Tricks
    & Hacks, why not order yourself a copy?


    The JavaScript Anthology: 101 Tips, Tricks & Hacks is the ultimate toolkit for
    web developers using JavaScript. It''s a collection of over 100 thoroughly-tested,
    customizable, and elegant solutions that will enable you to easily add usable
    and accessible interactivity to your site.


    As JavaScript guru Bobby van der Slu says, “The JavaScript Anthology is the cookbook
    of modern JavaScript, discussing only best practice solutions—a useful, timesaving,
    and practical reference for your desk."


    The JavaScript Anthology: 101 Essential Tips, Tricks & Hacks also includes download
    access to all of the best practice code samples throughout the book—plug them
    right into your own projects without retyping!


    In the rest of the book, you''ll find solutions that will:


    - Search and replace text using regular expressions

    - Validate email addresses on your web forms

    - Make a slideshow of images

    - Make a style sheet switcher

    - Build an accessible drop-down menu system

    - Construct drag ''n drop interfaces using AJAX

    - Use JavaScript and Flash together

    - Make your JavaScript accessible

    - Use XMLHttpRequest to build AJAX applications

    - Optimize your JavaScript code so that it runs faster

    - And much more!


    On top of that, order direct from sitepoint.com and you''ll receive a free 17”
    x 24” poster of your choice!


