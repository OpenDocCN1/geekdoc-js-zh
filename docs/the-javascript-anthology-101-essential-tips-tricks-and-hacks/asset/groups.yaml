    \ finds a row in the copy whose sorted table cell value is “less” than the one\
    \ we’re scanning, we insert a copy of the scanned row into the copied tbody. For\
    \ a column in ascending order, we simply reverse this comparison: the value of\
    \ the row in the copy must be “greater” than that of the scanned row.\n\nHowever,\
    \ before a comparison is made, we check whether the contents of the sorted table\
    \ cell can be interpreted as an integer or a float; if so, the comparison values\
    \ are converted. This makes sure that tables that contain numbers are sorted properly;\
