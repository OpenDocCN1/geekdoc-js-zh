    \ paragraph);\n```\n\n# Take Caring the Node Structure of the DOM\n\n> The elements\
    \ in a collection are updated automatically when a change occurs in the DOM—even\
    \ if you copy that collection into a variable before the change occurs. So, if\
    \ you remove from the DOM an element that was contained in a collection with which\
    \ you had been working, the element reference will also be removed from the collection.\
    \ This will change the length of the collection as well as the indices of any\
