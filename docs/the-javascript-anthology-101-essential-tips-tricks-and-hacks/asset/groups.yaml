- md: "\n```javascript\nvar cpanel = makePopup('cpanel.html', 480, 240, 'resize');\n\
    self.focus();\n```\n\n## Opening Off-site Links in a New Window\n\nIn the strict\
    \ versions of HTML 4 and XHTML, the target attribute for links no longer exists.\
    \ One interpretation of this is that web pages simply shouldn't open in new windows;\
    \ another is that targeting doesn't have semantics and therefore shouldn't be\
    \ defined in HTML.2\n\nThere are other interpretations, and the arguments are\
    \ long (sometimes tedious), but it suffices to say that you may find needing a\
    \ solution to this problem. Whatever your personal views be, it's a common request\
    \ of web development clients.\n\n## Solution\n\nThis script identifies links by\
    \ the rel attribute value external. The rel attribute is a way of describing the\
    \ relationship between a link and its target,3, so its use for identifying links\
    \ that point to another site is semantically-dubious:\n\nFile: offsite-links.html\
    \ (excerpt)\n\n```html\n<a href=\"http://www.google.com/*\" rel=\"external\">Google\
    \ (offsite)</a>\n```\n\nIf each link is identified like that, a single document.onclick\
    \ handler can process clicks on all such links:\n\nFile: offsite-links.js\n\n\
    ```javascript\ndocument.onclick = function(e)\n{\n  var target = e ? e.target\
    \ : window.test.srcElement;\n\n  while (target && /\\/[a-z]+$/.test(target.nodeName))\
    \ {\n    target = target.parentNode;\n}\nif (target && target.getAttribute('rel')\n\
    && target.rel == 'external')\n{\n  var external = window.open(target.href);\n\
    \  return external.closed;\n}\n}\n```\n\n> 2The CSS3 working draft includes a\
    \ set of target properties for link presentation [http://www.w3.org/TR/2004/WD-css3-hyperlinks-20040224/],\
    \ which could eventually see this mechanism added to CSS inside. Personally, I\
    \ hope this never gets the draft stage, because it has nothing to do with CSS:\
    \ interface control is no more appropriate in a design language than it is in\
    \ a semantic markup language!\nhttp://www.w3.org/TR/REC-html40/struct.html#h-12.1.2\n\
    \nOrder the print version of this book to get all 588 pages! 133\n\n## Discussion\n\
    \nUsing a single, document-wide event handler is the most efficient approach—it's\
    \ better than iterating through all the links and binding a handler to each one\
    \ individually. We can find which element was actually clicked by referencing\
    \ the event target property. For more about events and event properties, see Chapter\
    \ 13, but here's a brief summary of the situation.\n\nTwo completely different\
    \ event models are employed by current browsers. The script establishes which\
    \ one should be used by looking for e—the event argument that's used by Mozilla,\
    \ and has adopted by most browsers—as opposed to the window.event object used\
    \ by Internet Explorer. It saves the object property that appropriate to the model\
    \ in use: either target for Mozilla-like browsers, or srcElement for IE.\n\nThe\
    \ target object (if it is not null) can be one of three: a link element node,\
    \ an element text node inside a link, or some other node. We want the first two\
    \ cases to be handled by our script, but clicks arising from the last situation\
    \ may be safely ignored. What we do follow the trail of parent nodes from the\
    \ event until until we find a link, or get to the body element.\n\nOnce we have\
    \ a unified target link, we need simply check for a rel attribute with the correct\
    \ value; if it exists, we can open a window with the link's href, and all of that\
    \ is successful (as judged by the new window object's closed property), the handler\
    \ will return false, preventing the original link from being followed.\n\nPassing\
    \ a link to window.open without defining arguments will create a window with default\
    \ decorations—as will a link with target=\"blank\".\n\n## Communicating Between\
    \ Frames\n\n### The First Test\n\n> note\n\nWe use getAttribute as the first test\
    \ for rel because attribute-specific properties are only reliable if you know\
    \ for certain that the attribute in question has been assigned a value. We can't\
    \ go straight to testing target.rel as a string, which might be null or undefined.\
    \ This was discussed in more detail in “Reading and Writing the Attributes of\
    \ an Element” in Chapter 5.\n\n## Communicating Between Frames\n\nIf you are working\
    \ in a framed environment, it may be necessary to have scripts communicate between\
    \ frames, either reading or writing properties, or calling functions in different\
    \ documents.\n\nIf you have a choice about or not to use frames, I'd strongly\
    \ advise against doing so, because they have many usability and accessibility\
    \ problems, quite apart from the fact that they're conceptually broken (they create\
    \ within the browser frames that cannot be addressed⁴). But with your use of popups,\
    \ in some cases you may not have a choice about your use of frames. So if you\
    \ really use them, here's what you'll need to.\n\n## Solution\n\nLet's begin with\
    \ a simple frameset document:\n\n```html\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML\
    \ 4.01 Frameset//EN\"\n  \"http://www.w3.org/TR/html4/frameset.dtd\">\n<html>\n\
    \  <head>\n    <title>A frameset document</title>\n  </head>\n  <frameset cols=\"\
    200,*\">\n    <frame src=\"navigation.html\" name=\"navigationFrame\">\n    <frame\
    \ src=\"content.html\" name=\"contentFrame\">\n  </frameset>\n  <p>This frameset\
    \ contains:</p>\n  <ul>\n    <li><a href=\"navigation.html\">Navigation</a></li>\n\
    \    <li><a href=\"content.html\">Main content</a></li>\n  </ul>\n</frameset>\n\
    </html>\n```\n\n> We use getAttribute as the first test for rel because attribute-specific\
    \ properties are only reliable if you know for certain that the attribute in question\
    \ has been assigned a value. We can't go straight to testing target.rel as a string,\
    \ which might be null or undefined. This was discussed in more detail in “Reading\
    \ and Writing the Attributes of an Element” in Chapter 5.\n\n⁴ http://www.w3.org/TR/2004/WD-css3-hyperlinks-20040224/\n\
    \nOrder the print version of this book to get all 588 pages! 133\n"
  mdcn: "\n\n```javascript\nvar cpanel = makePopup('cpanel.html', 480, 240, 'resize');\n\
    self.focus();\n```\n\n## 在新窗口中打开站外链接\n\n在 HTML 4 和 XHTML 的严格版本中，链接的 `target` 属性已不再存在。对此的一种解释是，网页不应该在新窗口中打开；另一种解释是目标定位（targeting）没有语义，因此不应该在\
    \ HTML 中定义。²\n\n还有其他的解释，而且论点也很长（有时很乏味），但只需说你可能会发现需要此问题的解决方案。无论你的个人观点如何，这 Web 开发客户的一个常见需求。\n\
    \n## 解决方案\n\n此脚本通过 `rel` 属性值 `external` 来识别链接。`rel` 属性是描述链接与其目标之间关系的一种方式，因此用它识别指向另一个网站的链接在语义上是有疑的：\n\
    \n文件：offsite-links.html（节录）\n\n```html\n<a href=\"http://www.google.com/*\" rel=\"\
    external\">Google (站外)</a>\n```\n\n如果每个链接都是这样识别的，那么单个 `document.onclick` 处理程序就可以处理所有此类链接的点击：\n\
    \n文件：offsite-links.js\n\n```javascript\ndocument.onclick = function(e)\n{\n  var\
    \ target = e ? e.target : window.test.srcElement;\n\n  while (target && /\\/[a-z]+$/.test(target.nodeName))\
    \ {\n    target = target.parentNode;\n}\nif (target && target.getAttribute('rel')\n\
    && target.rel == 'external')\n{\n  var external = window.open(target.href);\n\
    \  return external.closed;\n}\n}\n```\n\n> ²2 CSS3 工作草案包含了一组用于链接展示的 `target` 属性\
    \ [http://www.w3.org/TR/2004/WD-css3-hyperlinks-20040224/]，这最终可能会看到这种机制被添加到 CSS\
    \ 内部。就个人而言，我希望它永远不要进入草案阶段，因为它与 CSS 无关：界面控制在设计语言中的不合适程度并不亚于它在语义标记语言中的程度！\nhttp://www.w3.org/TR/REC-html40/struct.html#h-12.1.2\n\
    \n订购本书的印刷版以获取全部 588 页！133\n\n## 讨论\n\n使用单一的文档级事件处理器是最有效的方法——它比遍历所有链接并为每个链接单独绑定处理程序要好。我们可以通过引用事件目标（target）属性找到实际点击的是哪个元素。有关事件和事件属性的更多信息，请参见第\
    \ 13 章，但这里是对这种情况的简要总结。\n\n当前浏览器采用了两种完全不同的事件模型。该脚本通过查找 `e` 来确定应该使用哪一个——`e` 是 Mozilla\
    \ 使用并被大多数浏览器采用的事件参数——相对于 Internet Explorer 使用的 `window.event` 对象。它保存了适用于所用模型的对象属性：对于类\
    \ Mozilla 浏览器是 `target`，对于 IE 则是 `srcElement`。\n\n`target` 对象（如果不为 `null`）可以是三者之一：链接元素节点、链接内部的元素文本节点或其他节点。我们希望由脚本处理前两种情况，但源于最后一种情况的点击可以安全地忽略。我们确实顺着事件的父节点路径追踪，直到找到链接或到达\
    \ `body` 元素。\n\n一旦我们获得了一个统一的目标链接，只需检查是否存在具有正确值的 `rel` 属性；如果存在，我们就可以使用链接的 `href`\
    \ 打开窗口，并且所有这一切都成功（通过新窗口对象的 `closed` 属性判断），处理程序将返回 `false`，从而防止原始链接被跳转。\n\n在不定义参数的情况下向\
    \ `window.open` 传递链接将创建一个带有默认装饰的窗口——带有 `target=\"_blank\"` 的链接也是如此。\n\n## 帧之间的通信\n\
    \n### 第一次测试\n\n> 笔记\n\n我们使用 `getAttribute` 作为 `rel` 的第一次测试，是因为只有当你确定所讨论的属性已赋值时，特定属性的属性才是可靠的。我们不能直接测试作为字符串的\
    \ `target.rel`，因为它可能是 `null` 或 `undefined`。这在第 5 章的“读取和写入元素属性”中进行了更详细的讨论。\n\n\
    ## 帧之间的通信\n\n如果你在框架环境中工作，可能需要脚本在帧之间进行通信，无论是读取或写入属性，还是在不同的文档中调用函数。\n\n如果你可以选择或不使用帧，我强烈建议不要使用，因为它们有许多可用性和无障碍性问题，更不用说在概念上是行错误的（它们在浏览器内部创建了无法寻址的帧⁴）。但由于你使用了弹出窗口，某些情况下你可能无法选择是否使用帧。因此，如果你真的使用它们，你需要这样做。\n\
    \n## 解决方案\n\n```html\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML 4.01 Frameset//EN\"\
    \n  \"http://www.w3.org/TR/html4/frameset.dtd\">\n<html>\n  <head>\n    <title>一个\
    \ frameset 文档</title>\n  </head>\n  <frameset cols=\"200,*\">\n    <frame src=\"\
    navigation.html\" name=\"navigationFrame\">\n    <frame src=\"content.html\" name=\"\
    contentFrame\">\n  </frameset>\n  <p>这个 frameset 包含：</p>\n  <ul>\n    <li><a href=\"\
    navigation.html\">导航</a></li>\n    <li><a href=\"content.html\">主内容</a></li>\n\
    \  </ul>\n</frameset>\n</html>\n```\n\n⁴ http://www.w3.org/TR/2004/WD-css3-hyperlinks-20040224/\n\
    \n"
