    \n# 解决方案\n\n我们需要的属性通过三种不同的方式实现，就像我们在前一节（“让页面滚动到特定位置”）中看到的页面滚动属性一样。正如在该示例中所示，我们可以使用对象测试来确定哪种实现有效，包括针对\
