    # Making the Page Scroll to a Particular Position


    All current browsers implement the same (nonstandard) methods for scrolling a
    page. At least something here is simple!


    # Solution


    There are two methods that can be used to scroll the page (or rather, the window
    or frame), either by a particular amount (window.scrollY), or to a particular
    point (window.scrollTo):


    ```

    //scroll down 200 pixels

    window.scrollBy(0, 200);

    ```


    ```

    //scroll across 200 pixels

    window.scrollBy(200, 0);

    ```


    ```

    //scroll to 300 from the edge and 100 from the top

    window.scrollTo(300, 100);

