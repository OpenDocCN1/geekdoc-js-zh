    c4\">\n      4/10\n    </td>\n  </tr>\n</tbody></table>\n```\n\n## Sorting Tables\
    \ by Column\n\nFirst, we need to set up event listeners on each of our table heading\
    \ cells. These will listen for clicks to our columns, and trigger a sort on the\
    \ column that was clicked:\n\n```javascript\nfunction initSortableTables() {\n\
    \  if (identifyBrowser() != \"ie5mac\") {\n    var tables = getElementsByAttribute(\"\
    class\", \"sortableTable\");\n    for (var i = 0; i < tables.length; i++) {\n\
    \      var ths = tables[i].getElementsByTagName(\"th\");\n      for (var k = 0;\
    \ k < ths.length; k++) {\n        var newA = document.createElement(\"a\");\n\
    \        newA.setAttribute(\"href\", \"#\");\n        newA.setAttribute(\"title\"\
    , \"Sort by this column in descending order\");\n        for (var m = 0; m < ths[k].childNodes.length;\
    \ m++) {\n          newA.appendChild(ths[k].childNodes[m]);\n        }\n     \
    \   ths[k].appendChild(newA);\n        attachEventListener(newA, \"click\", sortColumn,\
    \ false);\n      }\n    }\n  }\n  return true;\n}\n```\n\nInternet Explorer 5\
