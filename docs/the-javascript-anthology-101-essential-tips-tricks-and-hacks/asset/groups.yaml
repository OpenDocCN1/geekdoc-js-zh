    \ like JavaScript can access the contents of HTML documents, removing the need\
    \ for any JavaScript code to appear in the HTML document itself. In this example,\
    \ our HTML code would look like the following:\n\n```html\n<div id=\"content\"\
    >\n```\n\nHere’s the scripting we’d use:\n\n```javascript\nfunction changeBorder(element,\
    \ to) {\n  element.style.borderColor = to;\n}\n\nvar contentDiv = document.getElementById('content');\n\
    \ncontentDiv.onmouseover = function() {\n  changeBorder('red');\n};\n\ncontentDiv.onmouseout\
    \ = function() {\n  changeBorder('black');\n}\n```\n\nThis approach allows us\
    \ to add, remove, or change event handlers without having to edit the HTML, and\
