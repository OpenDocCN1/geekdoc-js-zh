    # Using Braces and Semicolons (Consistent Coding Practice)


    problem is to respond to the load event in a more modern way; we''ll look at this

    shortly, in “Getting Multiple Scripts to Work on the Same Page”.


    In many JavaScript operations, braces and semicolons are optional, so is there

    any value to including them when they’re not essential?


    # Solution


    Although braces and semicolons are often optional, you should always include

    them. This makes code easier to read—by others, and by yourself in future—and

    helps you avoid problems as you reorganize the code in your scripts

    (which will often render an optional semicolon essential).


    For example, this code is perfectly valid:


    ```

    if (something) alert(''something'')

    else alert(''nothing'')

    ```


    This code valid thanks to a process in the JavaScript interpreter called semi-colon
    insertion. Whenever the interpreter finds two code fragments that are

    separated by one or more line breaks, and those fragments wouldn''t make sense

    if they were on a single line, the interpreter treats them as though a semicolon

    existed between them. By a similar mechanism, the braces that normally surround

    t code to be executed in if-else statements may be inferred from the syntax,

    even though they’re not present. Think of this process as the interpreter adding

    t missing code elements for you.


    Even those code elements are not always necessary, it’s easier to remember

    to use them when they are required, and easier to read the resulting code, if
    you

    do use them consistently.


    Our example above would be better written with this:


    ```

    if (something) { alert(''something''); }

    else { alert(''nothing''); }

    ```'
- md: "\n## Chapter 1: Getting Started with JavaScript\n\nThis version represents\
    \ the ultimate in code readability:\n\n```\nif (something) {\n  alert('something');\n\
    } else {\n  alert('nothing');\n}\n```\n\nFile: semicolons-braces.js (excerpt)\n\
    \n## Using Function Literals\n\nAs you become experienced with the intricacies\
    \ of the JavaScript language, it will become common for you to use function literals\
    \ to create anonymous functions as needed, and assign them to JavaScript variables\
    \ and object properties. In this context, the function definition should be followed\
    \ by a semicolon, which terminates the variable assignment:\n\n```\nvar saySomething\
    \ = function(message) {\n  ;\n};\n```\n\n## Adding a Script to a Page\n\nBefore\
    \ a script can begin exciting things, you have to load it into a web page. There\
    \ are two techniques for doing this, one of which is distinctly better than the\
    \ other.\n\n## Solution\n\nThe first and most direct technique is to write code\
    \ directly inside a script element, as we've seen before:\n\n```\n<script type=\"\
    text/javascript\">\nfunction saySomething(message) {\n  alert(message);\n}\n\n\
    saySomething('Hello world!');\n</script>\n```\n\nThe problem with this method\
    \ is that in legacy and text-only browsers—those that don't support the script\
    \ element at all—the contents may be rendered as literal text.\n\nA better alternative,\
    \ which avoids this problem, is always to put the script in an external JavaScript\
    \ file. Here's what it looks like:\n\n```\n<script type=\"text/javascript\" src=\"\
    what-is-javascript.js\"></script>\n```\n\nThis loads an external JavaScript file\
    \ named what-is-javascript.js. The file should contain the code that you would\
    \ otherwise put inside the script element, like this:\n\n```javascript\nfunction\
    \ saySomething(message)\n{\n  alert(message);\n}\n\nsaySomething('Hello world!');\n\
    ```\n\nWhen you use this method, browsers that don't understand the script element\
    \ will ignore it and render no contents (since the element is empty), browsers\
    \ that do understand it will load and process the script. This helps to keep content\
    \ and separate, and is far more easily maintained—you can use the same script\
    \ on multiple pages without having to maintain copies of the code in multiple\
    \ documents.\n\n## Discussion\n\nYou may question the recommendation of not using\
    \ code directly inside the script element. \"No problem,\" you might say. \"I'll\
    \ just put HTML comments around it.\" \"Well, I'd have to disagree with that:\
    \ using HTML comments to \"hide\" code is a very bad habit that we should avoid\
    \ falling into.\n\n## Putting HTML Comments Around Code\n\nA validating parser\
    \ is not required to read comments, much less to process them. The fact that commented\
    \ JavaScript works at all is an anachronism—a throwback to an old, outdated practice\
    \ that makes an assumption about the document that might not be true: it assumes\
    \ that the page is served to a non-validating parser.\n\nAll the examples in this\
    \ book are provided in HTML (as opposed to XHTML), so this assumption is reasonable,\
    \ but if you're working with XHTML (correctly served with a MIME type of application/xhtml+xml),\
    \ the comments in your code may be discarded by a validating XML parser before\
    \ the document is processed by the browser, in which case commented scripts will\
    \ no longer work at all. For the sake of ensuring forwards compatibility (and\
    \ the associated benefits to your own coding habits as much as individual projects),\
    \ I strongly recommend that you avoid putting comments around code this way. Your\
    \ JavaScript should always be housed in external JavaScript files.\n\n## The language\
    \ Attribute\n\nThe language attribute is no longer necessary. In the days Netscape\
    \ 4 and its contemporaries were the dominant browsers, the <script> tag's language\
    \ attribute had the role of sniffing for up-level support (for example, by specifying\
    \ javascript1.3), and impacted on small aspects of the script interpreter worked.\n\
    \nBut specifying a version of JavaScript is pretty meaningless now that JavaScript\
    \ ECMAScript, and the language attribute has been deprecated in favor of the type\
    \ attribute. This attribute specifies the MIME type of included files, such as\
    \ scripts and style sheets, and is the only one you need to use:\n\n```\n<script\
    \ type=\"text/javascript\">\n```\n\nTechnically, the value should be text/ecmascript,\
    \ but Internet Explorer doesn't understand that. Personally, I'd be happier if\
    \ it did, simply javascript is (ironically) a word I have great difficulty typing—I've\
    \ lost count of the number of times a script failure occurred because I'd typed\
    \ type=\"text/javascript\".\n\n## Getting Multiple Scripts to Work on the Same\
    \ Page\n\nWhen multiple scripts don't work together, it's almost always the scripts\
    \ want to assign event handlers for the same event on a given element. Since each\
    \ element can have only one handler for each event, the scripts override another's\
    \ event handlers.\n\n## Solution\n\nThe usual suspect is the window object, because\
    \ only one script can have a handler. By normally, for browsers that don't support\
    \ any of these methods (Mac IE 5, in practice), the fallback solution is to chain\
    \ multiple old-style event handlers together so they'll get called when the event\
