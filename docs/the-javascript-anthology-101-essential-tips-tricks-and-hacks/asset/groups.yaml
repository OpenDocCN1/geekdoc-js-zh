    ;\n        targetA.setAttribute(\"title\",\n        \"Sort by this column in ascending\
    \ order\");\n      }\n    }\n    targetTrChildren[i].clicked = true;\n  } else\
    \ {\n    targetTrChildren[i].clicked = false;\n    if (targetTrChildren[i].sortOrder\
    \ == \"ascending\") {\n      targetTrChildren[i].firstChild.setAttribute(\"Sort\
    \ by this column in ascending order\");\n    } else {\n      targetTrChildren[i].firstChild.setAttribute(\"\
    Sort by this column in descending order\");\n    }\n  }\n  var newBody = document.createElement(\"\
