  mdcn: "\n\n## 第1章：JavaScript 入门\n\n这个版本代表了代码可读性的极点：\n\n```\nif (something) {\n \
    \ alert('something');\n} else {\n  alert('nothing');\n}\n```\n\n文件：semicolons-braces.js（节选）\n\
    \n## 使用函数字面量\n\n当你对 JavaScript 语言的复杂性变得熟悉后，你经常会使用函数字面量来需要创建匿名函数，并将它们赋值给 JavaScript\
    \ 变量和对象属性。在这种情况下，函数定义后面应该跟一个分号，用以终止变量赋值：\n\n```\nvar saySomething = function(message)\
    \ {\n  ;\n};\n```\n\n## 向页面添加脚本\n\n在脚本开始执行激动人心的操作之前，你必须将其加载到网页中。实现这一操作有两种技术，其中一种明显优于另一种。\n\
    \n## 解决方案\n\n第一种最直接的方法是直接在 `<script>` 元素内部编写代码，正如我们之前看到的：\n\n```\n<script type=\"\
    text/javascript\">\nfunction saySomething(message) {\n  alert(message);\n}\n\n\
    saySomething('Hello world!');\n</script>\n```\n\n这种方法的问题在于，在遗留和纯文本浏览器中——那些完全不支持\
    \ `<script>` 元素的浏览器——内容可能会被渲染为字面文本。\n\n另一种更好的替代方案（可以避免这个问题）是始终将脚本放在外部 JavaScript\
    \ 文件中。它的样子如下：\n\n```\n<script type=\"text/javascript\" src=\"what-is-javascript.js\"\
    ></script>\n```\n\n这加载了一个名为 `what-is-javascript.js` 的外部 JavaScript 文件。该文件应该包含你原本要放在\
    \ `<script>` 元素内部的代码，如下：\n\n```javascript\nfunction saySomething(message)\n{\n\
    \  alert(message);\n}\n\nsaySomething('Hello world!');\n```\n\n当你使用这种方法时，不理解 `<script>`\
    \ 元素的浏览器将忽略它且不渲染任何内容（因为元素是空的），而理解它的浏览器则会加载并处理脚本。这有助于保持内容分离，并且更易维护——你可以在多个页面上使用同一个脚本，而无需在多个文档中维护代码副本。\n\
    \n## 讨论\n\n你可能会对不直接在 `<script>` 元素内部使用代码的建议产生疑问。“没问题，”你可能会说，“我只需要在它周围加上 HTML 注释就行了。“好吧，我不同意：使用\
    \ HTML 注释来“隐藏”代码是一种我们应该避免掉入的糟糕习惯。”\n\n## 在代码周围添加 HTML 注释\n\n验证解析器不需要读取注释，更不用说处理它们。带注释的\
    \ JavaScript 能够运行这本身就是一种过时的现象——是对旧、过时做法的回溯，这种做法对文档做了一个可能不真实的假设：它假设页面是提供给非验证解析器的。\n\
    \n书中的所有示例都是以 HTML 格式（而非 XHTML）提供的，因此这个假设是合理的，但如果你正在处理 XHTML（使用 MIME 类型 `application/xhtml+xml`\
    \ 正确提供），你的代码中的注释可能会在浏览器处理文档之前被验证 XML 解析器丢弃，在这种情况下，带注释的脚本将完全无法工作。为了确保向后兼容（以及对你个人编码习惯和单个项目的相关好处），我强烈建议你避免以这种方式在代码周围添加注释。你的\
    \ JavaScript 应该始终放在外部 JavaScript 文件中。\n\n## language 属性\n\n`language` 属性不再必要了。在\
    \ Netscape 4 及其同时期浏览器占据主导的时代，`<script>` 标签的 `language` 属性的作用探测高级别支持（例如通过指定 `javascript1.3`），并影响脚本解释器工作的某些细微方面。\n\
    \n但现在 JavaScript ECMAScript 已经存在，指定 JavaScript 版本已经毫无意义，且 `language` 属性已被废弃，取而代之的是\
    \ `type` 属性。该属性指定包含的文件（如脚本和样式表）的 MIME 类型，是你唯一需要的属性：\n\n```\n<script type=\"text/javascript\"\
    >\n```\n\n从技术上讲，该值应该是 `text/ecmascript`，但 Internet Explorer 并不理解它。对我个人而言，如果它能理解我会更开心，（讽刺的是）`javascript`\
    \ 是一个我打起来非常困难的单词——我数不清因为我写了 `type=\"text/javascript\"` 而导致脚本失败的次数了。\n\n## 让多个脚本在同一页面工作\n\
    \n当多个脚本无法协同工作时，几乎总是因为脚本想要为给定元素上的同一个事件分配事件处理器。由于每个元素对应每个事件只能有一个处理器，这些脚本会覆盖另一个脚本的事件处理器。\n\
    \n## 解决方案\n\n常见的“嫌疑人”是 `window` 对象，因为只有一个脚本可以拥有处理器。通常，对于不支持这些任何方法的浏览器（实践中是 Mac\
    \ IE 5），回退方案是将多个旧式事件处理器链式起来，这样它们在事件发生时就会被调用。我们通过动态构建一个新的事件处理器来实现：当事件发生时，在调用分配的处理器之前调用任何现有处理器。\n\
    \n```javascript\nvar oldfn = window.onload;\nif (typeof window.onload != 'function')\
    \ {\n  window.onload = fn;\n} else {\n  window.onload = function() {\n    oldfn();\n\
    \    fn();\n  }\n}\n```\n\n为了将这些整合在一起，我们需要添加一些测试来检查每个方法是否存在。我们可以使用 JavaScript\
    \ 运算符 `typeof` 来实现，它可以识别不同类型的数据（如 `\"string\"`、`\"number\"`、`\"boolean\"`、`\"\
    object\"`、`\"array\"`、`\"function\"` 或 `\"undefined\"`）。不存在的方法将返回 `\"undefined\"\
    `。\n\n```javascript\nfunction addListener(fn) {\n  if (typeof window.addEventListener\
    \ != 'undefined') {\n    window.addEventListener('load', false);\n  } else if\
    \ (typeof document.addEventListener != 'undefined') {\n    document.addEventListener('load',\
    \ false);\n  } else if (typeof window.attachEvent != 'undefined') {\n    window.attachEvent('onload',\
    \ fn);\n  } else {\n    window.onload = fn;\n  }\n}\n```\n\n还有一个额外的复杂之处：在 Opera\
    \ 中，触发多个监听器的事件来自 `document` 对象而非 `window`。但我们不能直接使用 `document`，因为它在旧版 Mozilla\
    \ 浏览器（如 Netscape 6）中不起作用。为了处理这些差异，我们需要依次测试 `window.addEventListener`、`document.addEventListener`，然后\
    \ `window.dispatchEvent`。\n\n如你所见，标准接收事件名称（不带 \"on\" 前缀），紧接着是事件发生时要调用的函数。\n\n\
    如果你不理解它的工作原理——我们将在第 13 章中更详细地探讨涉及的技术。在那里，我们将学习事件监听器不仅适用于 `load` 事件，还适用于任何类型的事件驱动脚本。\n\
    \n"
