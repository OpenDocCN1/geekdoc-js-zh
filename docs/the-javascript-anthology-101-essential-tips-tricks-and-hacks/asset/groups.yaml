  mdcn: "\n\n## 写入页面或窗口\n\n如果你在调试时正在检查大量数据，或者正在处理格式非常复杂的数据，那么将数据直接写入页面或弹出窗口通常比尝试处理大量的警框对话框（alert\
    \ dialogs）要好。特别是当你在循环中检查数据时，你可能会生成数百个对话框，每个对话框你都必须关闭并管理——这是一个非常繁琐的过程。\n\n在这些情况下，你可以使用元素的\
    \ `innerHTML` 属性将数据写入页面。这里有一个示例，我们使用数组（`data`）构建列表，然后将其写入数据中：\n\n```javascript\n\
    var test = document.getElementById('testdiv');\ntest.innerHTML += '<ul>';\nfor\
