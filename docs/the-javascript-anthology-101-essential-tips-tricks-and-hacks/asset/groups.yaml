  - "[PAGE 29]\n\n# Chapter 1: Getting Started with JavaScript\n\nand the Sony PSP,\
    \ as well as JavaScript browsers such as Opera 5 and Netscape 4.\n\nThe last point\
    \ in the list is arguably the least likely (apart from other developers devil's\
    \ advocate), but the reasons aren't all important: some users simply don't have\
    \ JavaScript, and we should accommodate them. There's no way to quantify the number\
    \ of users who have fallen into this category, because detecting JavaScript support\
    \ from the server is notoriously unreliable, but the figures I've seen put the\
    \ proportion of users who have JavaScript switched off between 5% and 20%, depending\
    \ on whether you search engine robots as \"users.\"\n\n# Solution\n\nThe long-standing\
    \ approach to this issue is to use the HTML noscript element, the contents of\
    \ which are rendered by browsers that don't support the script element at all,\
    \ and browsers that support it but have scripting turned off.\n\nAlthough it's\
    \ a sound idea, this solution has become less useful over time, because noscript\
    \ cannot differentiate by capability. A browser that offers limited JavaScript\
    \ support is not going to be able to run a complicated script, but devices are\
    \ script-capable browsers, so they won't parse the noscript element either. These\
    \ browsers would end up with nothing.\n\nA better approach to this is to begin\
    \ with static HTML, then use scripting to modify or add dynamic behaviors within\
    \ that static content.\n\nLet's look at a simple example. The preferred technique\
    \ for making HTML menus as an unordered list as the main structure. We'll be devoting\
    \ the whole of Chapter 15 to this, but this short example illustrates the point:\n\
    \n```\n<ul id=\"menu\">\n  <li><a href=\"/Home\">Home</a></li>\n  <li><a href=\"\
    /about\">About</a></li>\n  <li><a href=\"/contact\">Contact</a></li>\n  <li>......</li>\n\
    </ul>\n\n<script type=\"text/javascript\" src=\"menu.js\"></script>\n```\n\nThe\
    \ list of links is plain HTML, so it exists for all users, whether or not scripting\
    \ enabled. If scripting is supported, our menu.js script can apply dynamic behaviors,\
    \ but if scripting isn't supported, the content still appears. We haven't differentiated\
    \ between devices explicitly—we've just provided content that's dynamic if the\
    \ browser can handle it, and static if not."
- md: "\nProviding Users who Don't Have JavaScript (Progressive Enhancement)\n\n##\
    \ Discussion\n\nThe \"traditional\" approach to this scenario would be to generate\
    \ a separate, dynamic menu in pure JavaScript, and to have fallback content inside\
    \ a noscript element:\n\n```html\n<script type=\"text/javascript\" src=\"menu.js\"\
    ></script>\n```\n\n```html\n<noscript>\n<ul>\n<li><a href=\"/\">Home</a>/a></li>\n\
    <li><a href=\"/about\">About</a>/a></li>\n<li><a href=\"/contact\">Contact</a>/a></li>\n\
    </ul>\n</noscript>\n```\n\nBut, as we've already seen, a wide range of devices\
    \ will fail this test not, because JavaScript support is no longer an all-or-nothing\
    \ proposition. The above approach provides default content to all devices, and\
    \ scripts functionality only if it works.\n\nThis scripting approach is popularly\
    \ referred to as progressive enhancement, and it's a methodology we will be using\
    \ throughout this book.\n\n## Don't Ask!\n\n![](img/ea2a6d5786c46a059cd7778099fdcd56_30_0.png)\n\
    \nNeither this technique nor the noscript element should be used to add a message\
    \ that reads, \"Please turn on JavaScript to continue.\" At best, a message is\
    \ presumptive (\"Why should I?\"), at worst it may be unhelpful (\"I can't!\"\
    ) or meaningless (\"What's JavaScript?\"). Just like splash pages that say, \"\
    Please upgrade your browser,\" are as useful to the average web as a road sign\
    \ reads, \"Please use a different car.\"\n\nOccasionally, you may be faced with\
    \ a situation in which equivalent functionality cannot be provided without JavaScript.\
    \ In such cases, it's okay to have a static message that informs the user of this\
    \ incompatibility (in non-technical terms, of course). But, for the most part,\
    \ try to avoid providing this kind of message unless it's literally the only way.\n\
    \nOrder the print version of this book to get all 588 pages!\n\n7\n\n## Separating\
    \ Content from Behavior (Unobtrusive Scripting)\n\nSeparating content from behavior\
    \ means keeping different aspects of a web page’s construction apart. Jeffrey\
