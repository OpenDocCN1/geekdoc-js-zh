- md: "\n## Discussion\n\nThere's no easy way to copy the attributes of an element\
    \ to its replacement.⁴ If you want the new element to have the same id, class,\
    \ href, and so on, you'll have to copy the values over manually:\n\n```\ndiv.id\
    \ = paragraph.getAttribute(\"id\");\ndiv.className = paragraph.className;\n```\n\
    \n## Removing an Element or Text Node\n\nOnce an element has outlived its usefulness,\
    \ it's time to give it the chop. You can use JavaScript to remove any element\
    \ cleanly from the DOM.\n\n## Solution\n\nThe remove method removes any child\
    \ node from its parent, and returns a reference to the referred object.\n\nLet's\
    \ start off with this HTML:\n\n```html\n<p>\n  <a id=\"sirius\" href=\"sirius.html\"\
    >Sirius</a>\n</p>\n```\n\nWe could use removeChild to remove the hyperlink from\
    \ its parent like so:\n\n```javascript\nvar anchor = document.getElementById(\"\
    sirius\");\nvar parent = anchor.parentNode;\nvar removedChild = parent.removeChild(anchor);\n\
    ```\n\nThe variable removedChild would be a reference to the element, but that\
    \ element will not be located anywhere in the DOM: it will be available in memory,\
    \ much as if we had just created it using createElement. This allows us to relocate\
    \ it to another position on the page, it we, or can simply link the variable\n\
    \n> ⁴If you look at the DOM specification, it looks like this. Unfortunately,\
    \ Internet Explorer's support for the relevant properties and methods is just\
    \ not up to the task.\n\n## Chapter 5: Navigating the Document Object Model\n\n\
    disappear at the end of the script, and the reference will be lost altogether—effectively\
    \ deleting it. Following the above code, the DOM will end up like this:\n\n```html\n\
    <p>\n</p>\n```\n\nOf course, you don't need to assign the return value from removeChild\
    \ to a variable. You can just execute it and forget about the element altogether:\n\
    \n```javascript\nvar anchor = document.getElementById(\"sirius\");\nvar parent\
    \ = anchor.parentNode;\nparent.removeChild(anchor);\n```\n\n## Discussion\n\n\
    If the element you're deleting has children that you wish to preserve (i.e., you\
    \ just want to “unwrap\" them by removing your parent), you must rescue those\
    \ children to make sure they stay in the document when their parent is removed.\
    \ You can achieve this using the already-mentioned insertBefore method, which,\
    \ when used on elements that are already contained in the DOM, first moves them,\
    \ then inserts them at the appropriate point.\n\nThe paragraph in the following\
    \ HTML contains multiple children:\n\n```html\n<div id=\"starContainer\">\n<p\
    \ id=\"starLinks\">\n  <a href=\"aldebaran.html\">Aldebaran</a>\n  <a href=\"\
    castor.html\">Castor</a>\n  <a href=\"pollux.html\">Pollux</a>\n</p>\n</div>\n\
    ```\n\nWe can loop through the paragraph's childNodes collection, and relocate\
    \ each of its children individually before removing the element:\n\n```javascript\n\
    var parent = document.getElementById(\"starLinks\");\nvar container = document.getElementById(\"\
    starContainer\");\n\nwhile (parent.childNodes.length > 0) {\n  container.insertBefore(parent.childNodes[0],\
    \ parent);\n}\n```\n\n```javascript\ncontainer.removeChild(parent);\n```\n\nThe\
    \ page's DOM will now look like this:\n\n```html\n<div id=\"starContainer\">\n\
    <a href=\"alebaran.htm\">Aldebaran</a>\n<a href=\"castor.htm\">Castor</a>\n<a\
    \ href=\"pollux.htm\">Pollux</a>\n</div>\n```\n\n## Reading and Writing the Attributes\
    \ of an Element\n\nThe most frequently used parts of an HTML element are its attributes—id,\
    \ class, href, title, or any of a hundred other pieces of information that can\
    \ be included in an HTML tag. JavaScript is able not only to read these values,\
    \ but to write them as.\n\n## Solution\n\nTwo methods exist for reading and writing\
    \ an element's attributes. getAttribute allows you to read the value of an attribute,\
    \ while setAttribute allows you to write it.\n\nConsider this HTML:\n\n```html\n\
    <a id=\"antares\" href=\"antares.html\" title=\"A far away place\">\nAntares</a>\n\
    ```\n\nWe would be able to read the attributes of the element like:\n\n```javascript\n\
    var anchor = document.getElementById(\"antares\");\nvar anchorId = anchor.getAttribute(\"\
    id\");\nvar anchorTitle = anchor.getAttribute(\"title\");\n```\n\nThe value of\
    \ the variable anchorId would be \"antares\", and the value of the variable anchorTitle\
    \ would be \"A far away place\".\n\nTo change the attributes of the hyperlink,\
    \ we use setAttribute, passing it the name of the attribute to be changed, and\
    \ the value we want to change it to:\n\nFile: read_write_attributes2.js (excerpt)\n\
    \n```javascript\nvar anchor = document.getElementById(\"antares\");\n\nanchor.setAttribute(\"\
    title\", \"Not that far away\");\n\nvar newTitle = anchor.getAttribute(\"title\"\
    );\n```\n\nThe value of the variableTitle will be \"Not that far away\".\n\n##\
    \ Discussion\n\nIn its journey from the free-roaming Netscape wilderness to the\
    \ more defined, standards-based terrain of the modern age, the DOM standard has\
    \ picked up a fair amount of extra syntax for dealing with HTML. One of the most\
    \ pervasive of these extras is the mapping between DOM properties and HTML attributes.\n\
    \nWhen a document is parsed into its DOM, special attribute nodes are created\
    \ for an element's attributes. These are not accessible as \"children\" of element;\
    \ they are accessible only via the two methods mentioned above. However, as a\
    \ throwback to the original DOM implementations (called DOM 0, where the zero\
    \ suggests these features came prior to standards), current DOM specs contain\
    \ additional functionality specific to HTML. In particular, attributes are accessible\
    \ directly as properties of an element. The href attribute of a hyperlink is accessible\
    \ through link.getAttribute(\"href\") as well as through link.href.\n\nThis shortcut\
    \ is not only cleaner and more readable: in some situations Internet Explorer\
    \ 6 and versions below will not propagate changes made via setAttribute to the\
    \ visual display of an element. Any changes that are made to the class, id, or\
    \ style of an element using setAttribute will not affect the way it's displayed.\
    \ In order for those changes to take effect, they must be made via the element's\
    \ attribute-specific properties.\n\nTo confuse matters, the values that are returned\
    \ when an attribute-specific property is read vary between browsers, the most\
    \ notable occurring in Konqueror. If an attribute doesn't exist, Konqueror will\
    \ return null as the value of attribute-specific property, while all other browsers\
    \ will return an empty string. In a more specific case, some browsers will return\
    \ link.getAttribute(\"href\") as an absolute URL (e.g., \"http://www.example.com/antares.html\"\
    ), while others return the actual value (e.g., \"antares.html\"). In this case,\
    \ it's safer to use the dot property.\n\nSo, what's the general solution to these\
    \ problems?\n\nThe basic rule is this: if you are certain that an attribute has\
    \ been assigned a value, it's safe to use the dot property method to access it.\
    \ If you're unsure whether or not an attribute has been set, you should first\
    \ use one of the DOM methods to ensure that it has a value, then use the dot property\
    \ to obtain its value.\n\nFor reading an unverified attribute, use the following:\n\
    \n```javascript\nvar anchor = document.getElementById(\"sirius\");\nif (anchor.getAttribute(\"\
    title\") &&\n    anchor.title == \"Not the satellite radio\")\n{\n```\n\nThis\
    \ makes sure that the attribute exists, and is not null, before fetching its value.\n\
    \nFor writing to an unverified attribute, use the following code:\n\n```javascript\n\
    var anchor = document.getElementById(\"sirius\");\nanchor.setAttribute(\"title\"\
    , \"\");\nanchor.title = \"Yes, the satellite radio\";\n```\n\nThis code makes\
    \ sure that the attribute is created correctly, and is then set in such a way\
    \ that Internet Explorer will not have problems if the attribute affects the visual\
    \ display of the element.\n\nThis rule has a few exceptions for attributes whose\
    \ existence you can guarantee. The most notable of these are \"must-have\" attributes\
    \ are style and class, which will always be valid for any given element; thus,\
    \ you can immediately reference them as properties (element.style and element.className\
    \ respectively).\n\nclass is one of two attributes that get a little tricky, because\
    \ class is a reserved word in JavaScript. As a property, it is written element.className,\
    \ but using\n"
  mdcn: "\n\n## 讨论\n\n没有简单的方法可以将一个元素的属性复制到它的替换元素。⁴ 如果你希望新元素具有相同的 `id`、`class`、`href`\
    \ 等属性，你必须手动复制这些值：\n\n```\ndiv.id = paragraph.getAttribute(\"id\");\ndiv.className\
    \ = paragraph.className;\n```\n\n## 移除元素或文本节点\n\n一旦一个元素失去了它的用处，就是时候删除它了。你可以使用\
    \ JavaScript 从 DOM 中干净地移除任何元素。\n\n## 解决方案\n\n`remove` 方法从其父元素中删除任何子节点，并返回被引用对象的引用。\n\
    \n让我们从这段 HTML 开始：\n\n```html\n<p>\n  <a id=\"sirius\" href=\"sirius.html\">Sirius</a></a>\n\
    </p>\n```\n\n我们可以像这样使用 `removeChild` 来从其父元素中移除该超链接：\n\n```javascript\nvar anchor\
    \ = document.getElementById(\"sirius\");\nvar parent = anchor.parentNode;\nvar\
    \ removedChild = parent.removeChild(anchor);\n```\n\n变量 `removedChild` 将是该元素的引用，但该元素将不再位于\
    \ DOM 的任何位置：它将存在于内存中，就像我们刚刚使用 `createElement` 创建它一样。这允许我们将其重新移动到页面的其他位置，或者简单地让该变量在脚本结束时消失，引用将完全丢失——从而有效地删除了它。\n\
    \n> ⁴ 如果你查看 DOM 规范，它看起来是这样的。遗憾的是，Internet Explorer 对相关属性和方法的支持无法胜任。\n\n## 第 5\
    \ 章：遍历文档对象模型\n\n遵循上述代码，DOM 最终将变成这样：\n\n```html\n<p>\n</p>\n```\n\n当然，你不需要将 `removeChild`\
    \ 的返回值赋值给变量。你只需要执行它并完全忘记该元素即可：\n\n```javascript\nvar anchor = document.getElementById(\"\
    sirius\");\nvar parent = anchor.parentNode;\nparent.removeChild(anchor);\n```\n\
    \n## 讨论\n\n如果你要删除的元素拥有你希望保留的子节点（即，你只是想通过移除父元素来“解开”它们），你必须救出这些子节点，以确保它们在父元素被移除时仍停留在文档中。你可以使用前面提到的\
    \ `insertBefore` 方法来实现这一点，该方法用在已经包含在 DOM 中的元素上时，会先移动它们，然后将插入到适当的位置。\n\n以下 HTML\
    \ 中的段落包含多个子节点：\n\n```html\n<div id=\"starContainer\">\n<p id=\"starLinks\">\n\
    \  <a href=\"aldebaran.html\">Aldebaran</a>\n  <a href=\"castor.html\">Castor</a>\n\
    \  <a href=\"pollux.html\">Pollux</a>\n</p>\n</div>\n```\n\n我们可以遍历段落的 `childNodes`\
    \ 集合，并在移除元素之前逐个重新定位每个子节点：\n\n```javascript\nvar parent = document.getElementById(\"\
