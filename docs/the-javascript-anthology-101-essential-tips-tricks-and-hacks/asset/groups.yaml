  - "[PAGE 31]\n\n# Separating Content from Behavior (Unobtrusive Scripting)\n\nSeparating\
    \ content from behavior means keeping different aspects of a web page’s construction\
    \ apart. Jeffrey Zelman famously refers to this as the “three-legged stool” of\
    \ web development—comprising content (HTML), presentation (CSS), and behavior\
    \ (JavaScript)—which emphasizes not just the difference in each aspect’s functioning,\
    \ but also the fact that they should be separated from one another.\n\nGood separation\
    \ makes for sites that are easier to maintain, are more accessible, and degrade\
    \ well in older or lower-spec browsers.\n\n# Solution\n\nAt one extreme, which\
    \ is directly opposed to the ideal of separating content from behavior, we can\
    \ create inline code inside attribute handlers. This is very messy, and generally\
    \ should be avoided:\n\n```\n<div id=\"content\"\n  onmouseover=\"this.style.borderColor='red'\n\
    \  onmouseout=\"this.style.borderColor='black\">\n```\n\nWe can improve the situation\
    \ by taking the code that does the work and abstract it into a function:\n\n```\n\
    <div id=\"content\"\n  onmouseover=\"changeBorder('red')\n  onmouseout=\"changeBorder('black')\"\
    >\n```\n\nDefining a function to do the work for us lets us provide most of our\
    \ code in a separate JavaScript file:\n\n```\nfunction changeBorder(element, to)\n\
    {\n  element.style.borderColor = to;\n}\n```\n\n> ³Zeldman, J. Designing with\
    \ Web Standards. New Riders, 2003."
  - "[PAGE 32]\n\n# Separating Content from Behavior (Unobtrusive Scripting)\n\nBut\
    \ a much better approach is to avoid using inline event handlers completely. Instead,\
    \ we can make use of the Document Object Model (DOM) to bind the event handlers\
    \ to elements in the HTML document. The DOM is a standard programming interface\
    \ by which languages like JavaScript can access the contents of HTML documents,\
    \ removing the need for any JavaScript code to appear in the HTML document itself.\
    \ In this example, our HTML code would look like the following:\n\n```\n<div id=\"\
    content\">\n```\n\nHere’s the scripting we’d use:\n\n```\nfunction changeBorder(element,\
    \ to) {\n  element.style.borderColor = to;\n}\n\nvar contentDiv = document.getElementById('content');\n\
    \ncontentDiv.onmouseover = function() {\n  changeBorder('red');\n};\n\ncontentDiv.onmouseout\
    \ = function() {\n  changeBorder('black');\n}\n```\n\nThis approach allows us\
    \ to add, remove, or change event handlers without having to edit the HTML, and\
    \ since the document itself doesn't rely on or refer to the scripting at all,\
    \ browsers that don't understand JavaScript will not be affected by it. This solution\
    \ also provides the benefits of reusability, because we can bind the same functions\
    \ to other elements as needed, without having to edit the HTML.\n\nThis solution\
    \ hinges on our ability to access elements through the DOM, which we’ll cover\
    \ deep in Chapter 5.\n\n# The Benefits of Separation\n\n> note By practicing good\
    \ separation of content and behavior, we gain not only a practical benefit in\
    \ terms of smoother degradation, but also the advantage of thinking in terms of\
    \ separation. Since we’ve separated the HTML and"
  - "[PAGE 33]\n\n# Chapter 1: Getting Started with JavaScript\n\nJavaScript, instead\
    \ of combining them, when we look at the HTML we're less likely to forget that\
    \ its core function should be to describe the content of the page, independent\
    \ of any scripting.\n\nAndy Clarke refers to the web standards trifle⁴ which is\
    \ a useful analogy. A trifle looks like a good web site: when you look at the\
    \ bowl, you can see all the separate layers that make up the dessert. The opposite\
    \ of this might be a fruit cake: when you look at the cake, you can't tell what\
    \ different ingredient is. All you can see is a mass of cake.\n\n# Discussion\n\
    \nIt's important to note that when you bind an event handler to an element like\
    \ this, you can't do it until the element actually exists. If you put the preceding\
    \ script in the head section of a page as it is, it will report errors and fail\
    \ to work, because the content div has not been rendered at the point at which\
    \ the script is processed.\n\nThe most direct solution is to put the code inside\
    \ a load event handler. It will always be safe there because the load event doesn't\
    \ fire until after the document has been fully rendered:\n\n```\nwindow.onload\
    \ = function()\n{\n  var contentDiv = document.getElementById('content');\n  :\n\
    };\n```\n\nOr more clearly, with a bit more typing:\n\n```\nwindow.onload = init;\n\
    \nfunction init()\n{\n  var contentDiv = document.getElementById('content');\n\
    \  :\n}\n```\n\nThe problem with the load event handler is that only one script\
    \ on a page can use it; if two or more scripts attempt to install load handlers,\
    \ each script will override the handler of the one that came before it. The solution\
    \ to this\n\n> ⁴http://www.stuffandsnonsense.co.uk/archives/web_standards_trifle.html"
