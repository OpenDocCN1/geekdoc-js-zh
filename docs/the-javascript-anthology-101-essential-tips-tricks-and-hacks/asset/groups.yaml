    \ the form of a global window.event object, but in other browsers the object is\
    \ passed as an argument to the event-handling function. This difference is fairly\
    \ easy to access within the handling function:\n\nFile: handle_events2.js (excerpt)\n\
    \n```\nfunction engage(event) {\n  if (typeof event == \"undefined\") {\n    event\
