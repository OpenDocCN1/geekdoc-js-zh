    # 关于作者


    James Edwards（headcakecake）是一位位于英国的自由职业开发人员，专注于 DHTML 编程和无障碍开发。他是基于标准的倡导者，同时也是《Ultimate
    DHTML Menu》的作者，该书符合 WCAG。


    Cameron Adams 拥有法律和科学学位；自然而然选择了 Web 开发行业。他拥有许多技术名片，“网络技术专家”，在经营自己的业务——themanblue.com
    时，他为许多政府部门、非营利组织、大型公司和初创公司提供过咨询。Cameron 住在澳大利亚墨尔本。


    # 关于专家评审员


    Bobby van de Sluis 在荷兰阿姆斯特特的 Blast Radius 管理开发部门。他是一位客户端技术和设计专家，偶尔在他的个人网站上编写这些主题。他是原生
    JavaScript、渐进增强和使用最佳实践的传播者，并为 A List 和 CSS Zen Garden 等许多知名网站贡献过内容。他和妻子 Anita
    以及刚出生 Sofia。


    Derek Featherstone 是一位知名的讲师、作者、演讲者和开发者，在无障碍咨询方面拥有专业知识。Derek 提供的技术培训具有参与性、信息量实用性。作为一名优秀的导师，他利用了过去教师的背景，以及经营
    Web 开发和无障碍咨询公司 Further Ahead 的经验。Derek 在 boxofchocolates.ca 写博客。


    # 关于技术编辑


    作为 SitePoint的技术总监，Kevin Yank 监督所有的技术出版物——书籍、文章、时通讯和博客。他为 SitePoint 写了 50 多篇文章，并因其著作《Build
    Your Database Driven Website Using PHP & MySQL》闻名。Kevin 住在澳大利亚墨尔本，喜欢表演即兴喜剧剧和驾驶轻型飞机。


