  - '[PAGE 64]


    ```

    <p id="starLinks">

    <a href="sirius.html">Sirius</a>

    </p>

    ```


    We can use DOM methods to create and insert another link at the end of the paragraph:


    ```

    var anchorText = document.createTextNode("monoceros");

    var newAnchor = document.createElement("a");

    newAnchor.appendChild(anchorText);

    var parent = document.getElementById("starLinks");

    var newChild = parent.appendChild(newAnchor);

    ```


    The value of the newChild will be a reference to the newly inserted element.


    If we need to translate the state of the DOM after this code had executed into
    HTML code, it would look like this:


    ```

    <p id="starLinks">

    <a href="sirius.html">Sirius</a><a>monoceros</a>

    </p>

    ```


    We don''t specify any attributes for the new element, so it doesn''t link anywhere
    at the moment. The process for specifying attributes is explained shortly in “Reading
    and Writing the Attributes of an Element".


    # # Discussion


    There are three basic ways by which a new element or text node can be inserted
    into a web page. The approach you will depend depend upon the point at which you
    want the new node to be inserted: the last child of an element, before another
    node, or as the replacement for a node. The process of appending an element as
    the last child was explained above. You can insert the node before an existing
    node using the `insertBefore` method of its parent element, and you can replace
    a node using the `replaceChild` method of its parent element.'
  - '[PAGE 65]


    In order to use insertBefore, you need to have references to the node you''re
    going to insert, and to the node before which you wish to insert it. Consider
    this HTML code:


    ```

    <p id="starLinks">

    <a id="sirius" href="sirius.html">Sirius</a>

    </p>

    ```


    We can insert new link before the existing one by calling insertBefore from its
    parent element (the paragraph):


    ```

    var anchorText = document.createTextNode("monoceros");


    var newAnchor = document.createElement("a");

    newAnchor.appendChild(anchorText);


    var existingAnchor = document.getElementById("sirius");

    var parent = existingAnchor.parentNode;

    var newChild = parent.insertBefore(newAnchor, existingAnchor);

    ```


    The value of the variableChild will be a reference to the newly inserted element.


    If we were to translate into HTML the state of the DOM after this operation, we
    would look like this:


    ```

    <p id="starLinks">

    <a>monoceros</a><a id="sirius" href="sirius.htm">Sirius</a>

    </p>

    ```


    Instead, we could replace the existing link entirely using replaceChild:


    ```

    var anchorText = document.createTextNode("monoceros");


    var newAnchor = document.createElement("a");

    newAnchor.appendChild(anchorText);


    var existingAnchor = document.getElementById("sirius");

    var parent = existingAnchor.parentNode;

    var newChild = parent.replaceChild(newAnchor, existingAnchor);

    ```


    The DOM would look like this:'
