    \ content (HTML), presentation (CSS), and behavior (JavaScript)—which emphasizes\
    \ not just the difference in each aspect’s functioning, but also the fact that\
    \ they should be separated from one another.\n\nGood separation makes for sites\
    \ that are easier to maintain, are more accessible, and degrade well in older\
    \ or lower-spec browsers.\n\n## Solution\n\nAt one extreme, which is directly\
    \ opposed to the ideal of separating content from behavior, we can create inline\
    \ code inside attribute handlers. This is very messy, and generally should be\
    \ avoided:\n\n```html\n<div id=\"content\"\n  onmouseover=\"this.style.borderColor='red'\"\
    \n  onmouseout=\"this.style.borderColor='black'\">\n```\n\nWe can improve the\
    \ situation by taking the code that does the work and abstract it into a function:\n\
    \n```html\n<div id=\"content\"\n  onmouseover=\"changeBorder('red')\"\n  onmouseout=\"\
    changeBorder('black')\">\n```\n\nDefining a function to do the work for us lets\
    \ us provide most of our code in a separate JavaScript file:\n\n```javascript\n\
    function changeBorder(element, to)\n{\n  element.style.borderColor = to;\n}\n\
    ```\n\n> ³Zeldman, J. Designing with Web Standards. New Riders, 2003.\n\n## Separating\
    \ Content from Behavior (Unobtrusive Scripting)\n\nBut a much better approach\
    \ is to avoid using inline event handlers completely. Instead, we can make use\
    \ of the Document Object Model (DOM) to bind the event handlers to elements in\
