    \ \" + event.screenX + \", \" + event.screenY);\n\n  return false;\n}\n```\n\n\
    The event allows you to find out a range of details, such as which element was\
    \ clicked, whether any keys were pressed, the coordinates of the event (e.g.,\
    \ where the cursor was located when the mouse button was clicked), and the type\
    \ of event that triggered the function. Quite few of the event property names\
    \ are consistent across all browsers, but a few differ. The Mozilla properties\
    \ can be viewed at the Gecko DOM Reference¹, while the Internet Explorer event\
    \ properties can be seen at MSDN². For whose names vary between browsers, the\
    \ potential for associated problems can normally be rectified with a little object\
    \ detection; we will discuss this in detail later this chapter.\n\n# The W3C Way\
    \ (Event Listeners)\n\nAlthough the DOM event handlers are quick and easy, they\
    \ have limitations (aside from the fact that eventually will become deprecated).\
    \ The main advantage of the W3C event listeners is that they natively support\
    \ the addition and removal of multiple handling functions for the same event on\
    \ a single element. Event listeners also have the capability to respond to events\
    \ in several phases (though most browsers don't support this capability).\n\n\
