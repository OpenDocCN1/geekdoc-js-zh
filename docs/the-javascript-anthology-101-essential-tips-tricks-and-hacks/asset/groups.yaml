    # Discussion


    This practice has advantages quite apart from the benefits of obfuscation. Scripts
    that are stripped of comments and unnecessary whitespace are smaller; therefore,
    they’re faster loading, and may process more quickly.


    But please remember that the code must remain strictly formatted using semicolon
    line terminators and braces (as we discussed in “Using Braces and Semicolons (Consistent
    Coding Practice"); otherwise, the removal of line breaks will make lines of code
    run together, and ultimately cause errors.


    Before you start compression, remember to make a copy of the script. I know it
    seems obvious, but I’ve made this mistake plenty of times, and it’s all the more
    jarring for being so elementary! What I do these days is write and maintain scripts
    in their fully spaced and commented form, then run them through a bunch of search/replace
    just before they’re published. Usually, I keep two copies of a script, named myscript.js
    and myscript-commented.js, or something similar.


    We’ll come back to this in Chapter 20, where we’ll discuss this among a range
    of techniques for improving the speed and efficiency of scripts, as well as reducing
    the amount of physical space they require.


    # Debugging a Script


    Debugging is the process of finding and (hopefully) fixing bugs. Most browsers
    have some kind of bug reporting built in, and a couple of external debuggers are
    also worth investigating.'
