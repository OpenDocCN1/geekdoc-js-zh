    # Preface


    To many people, the word "JavaScript" conjures up memories of annoying popups,
    irritating mouse trails, frustrating clicks. If you''ve ever been on the receiving
    end of such a script, you''ll know how tedious they can be. Yet JavaScript is
    a mature, professional scripting language that is used on the majority of web
    sites, and is a key component in almost all web-based applications. Wait! Are
    we talking about the technology here?


    As with stories, both perceptions are reasonably accurate: JavaScript does have
    a dubious reputation earned mainly in the first boom when it was used for little
    else than popups, shielding from casual scrutiny and adding pointless effects.
    In recent years, as both the web development community and the world at large
    have become more aware of accessibility issues, JavaScript has been singled out
    as the cause of many problems, though in reality, it is not the technology that
    is at fault—it is poorly planned and careless use that has given JavaScript this
    reputation.


    With increasing popularity of remote scripting techniques (commonly referred to
    as "AJAX"), JavaScript is enjoying a renaissance. Designers, developers, and programmers
    from many disciplines are becoming interested in what was once the domain of specialists.
    Browser vendors and other technology companies are taking another look at the
    potential of this powerful language, as the line between the Web and the desktop
    becomes increasingly blurred. JavaScript is a key component in the development
    of a raft of new applications, and there has never been a better time to take
    an interest in it.


    # Who Should Read this Book?


    Anyone who is involved or interested in building web sites or web applications
    should read this book. If you''re a webmaster looking for copy-and-paste solutions
    to everyday needs, we have those solutions for you. If you''re already an experienced
    JavaScript programmer, you''ll find in this book scripts and discussions that
    sit on the bleeding edge of current practice. If you''re a designer with an interest
    in the coding side of things, or a student who is just beginning to get into it,
    you''ll find rich and beautiful examples to give you insight and ideas. Whatever
    your current JavaScript knowledge, we hope you''ll find this book a useful and
    inspirational resource for modern, best practice scripting.


    ## What’s in this Book?


    ### Chapter 1: Getting Started With JavaScript


    This chapter is slightly more theoretical than the rest, provides an overview
    of JavaScript’s capabilities and limitations, and the rest introduces some core
    practices that we will be using through the rest of the book. It’s not a beginners’
    tutorial, nor a ground-up summary of the language, but it focuses on finding the
    best ways to perform basic tasks, including practical solutions for the problems
    that are encountered as we try to make scripts work together.


    ### Chapter 2: Working with Numbers


    This chapter looks at techniques for using and processing numbers in JavaScript.
    It covers basic computation, number rounding, the generation and constraint of
    random, and the use of currency values, ordinals, and other formatted numbers.


    ### Chapter 3: Working with Strings


    Text is the meat and drink of the Web, and processing is one of the most common
    tasks in web scripting. This chapter looks at ways of manipulating strings to
    find information, store data, and prepare text for output, and includes a thorough
    introduction to regular expressions in JavaScript.


    ### Chapter 4: Working with Arrays


    This chapter introduces one of the most powerful data-storage structures in JavaScript:
    the array. We’ll talk about reading and writing data from an array, sorting and
    processing arrays, and using multidimensional arrays. We’ll also discuss a similar
    structure: the object literal.


    ### Chapter 5: Navigating the Document Object Model


    The DOM is an interface for manipulating individual parts of a document. This
    chapter introduces and explores the DOM, and looks at how to create and read the
    data from elements, attributes, and text.


    ### Chapter 6: Processing and Validating Forms


    In this chapter, we look at reading and writing data from different kinds of forms,
    address the tasks of validating and processing form data, and discuss techniques
    for improving the usability of form-based interfaces.


    ### Chapter 7: Working with Windows and Frames


    This chapter takes a cautious look at manipulating windows and frames. These are
    the most controversial parts of the language, as they have the potential to create
    serious usability and accessibility barriers, as this chapter is centered firmly
    on techniques to avoid them.


    ### Chapter 8: Working with Cookies


    Cookies are the simplest and most reliable method for maintaining state-persistence
    in JavaScript—they allow pages and applications to remember who you are and what
    you are doing. In this chapter, we introduce cookies and how to use them effectively.


    ### Chapter 9: Working with Dates and Times


    It won''t win any prizes for glamour, but this chapter shows how to use the date
    and time in JavaScript, how to compare and process dates and times, and how to
    output the final data in different formats and conventions.


    ### Chapter 10: Working with Images


    Images are an important part of most web designs, and this chapter explores the
    basic techniques involved in scripting for them. We move from simple tasks like
    preloading, randomly selecting, swapping, and cross-fading images to more complex
    slide show, progress indicator, and image-based clock scripts.


    ### Chapter 11: Detecting Browser Differences


    This short chapter outlines techniques for dealing with different browsers and
    rendering modes. In it, we explain when and where it is appropriate to use browser
    detection and object detection, and how you can combine these techniques to get
    the most robust information.


    ### Chapter 12: Using JavaScript with CSS


    In this chapter, we look at how to read and write styles from a single element
    or group of elements, how to read and write CSS rules to an existing created style
    sheet, and how to build a style switcher.


    ### Chapter 13: Dynamic HTML


    DHTML uses the DOM, and CSS to bring static content to life, and although the
    term HTML is disparaged in some quarters, we still believe it''s a useful and
    relevant way of describing this kind of scripting. In this chapter, we cover event-handling
    in all its flavors, detecting the position and size of an object, tracking the
    mouse, and making elements appear and disappear.

