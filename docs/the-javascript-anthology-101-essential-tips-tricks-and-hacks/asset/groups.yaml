    \ DOM 0 属性快捷方式时所看到的，这些事件处理程序并不具备未来的兼容性。不过，它们与标准的 W3C 事件监听器相比，确实具有一些优势。\n\n- 目前运行的所有浏览器都支持\
    \ DOM 0 事件处理程序，而不需要代码分支。\n- 由 DOM 0 事件处理程序执行的每个函数都可以访问分配给该处理程序的精确元素。（正如你稍后将看到的，这在\
    \ W3C 事件监听器中并不总是可用。）\n\n使用 DOM 0 事件处理器的主要问题是它们并不是为与多个脚本协作而设计的。每当你分配一个 DOM 0 事件处理程序，它就会覆盖之前分配给该元素的处理程序。这可能会干扰多个在同一元素上需要事件处理的脚本的操作。使用\
