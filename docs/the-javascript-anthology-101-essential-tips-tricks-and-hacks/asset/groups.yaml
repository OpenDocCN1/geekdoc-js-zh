- md: "\n## Chapter 5: Navigating the Document Object Model\n\ngetAttribute/setAttribute,\
    \ we write element.getAttribute(\"class\"), except in Internet Explorer, where\
    \ we still use element.getAttribute(\"className\").\n\nThe other attribute we\
    \ have to watch out for is the `for` of a label. It follows the same rules as\
    \ class, but its property form is `html`. Using getAttribute/setAttribute, we\
    \ write element.getAttribute(\"for\"), but in Internet Explorer it's element.getAttribute(\"\
    htmlFor\").\n\n## Getting all Elements with a Particular Attribute Value\n\nThe\
    \ ability to find all the elements that have a particular attribute can be pretty\
    \ handy when you need to modify all elements that have the same class or title,\
    \ for example.\n\n## Solution\n\nIn order to find elements with a particular attribute\
    \ value, we need to check every element on the page for that attribute. This is\
    \ a very calculation-intensive operation, so it shouldn't be undertaken. If you\
    \ wanted to find all elements with `type=\"checkbox\"`, you're better off limiting\
    \ your search to input elements:\n\n```javascript\nvar inputs = document.getElementsByTagName(\"\
    input\");\nfor (var i = 0; i < inputs.length; i++) {\n  if (inputs.getAttribute(\"\
    type\") == \"checkbox\") {\n    // ...\n  }\n}\n```\n\nThis will require less\
    \ calculation than iterating through every element on the page and checking its\
    \ type. However, the function presented in this solution—getElementsByTagName—is\
    \ ideal when you need to find a number of elements of different types that have\
    \ the same attribute value.\n\nThe easiest way to check every element on a page\
    \ is to loop through the collection returned by `getElementsByTagName(\"*\")`.\
    \ The only problem with this method is that Internet Explorer 5.0 and 5.5 do not\
    \ support the asterisk for tag selection. Luckily, these browsers support the\
    \ `document.all` property, which is an array containing all the elements on the\
    \ page. getElementsByAttribute handles this issue with a simple code branch, then\
    \ proceeds to check the elements for a given attribute value, adding matches to\
    \ an array to be returned:\n\nFile: get_elements_by_attribute.js (excerpt)\n\n\
    ```javascript\nfunction getElementsByAttribute(attribute, attributeValue) {\n\
    \  var myArray = new Array();\n  var matchedArray = new Array();\n\n  if (document.all)\
    \ {\n    elementArray = document.all;\n  } else {\n    elementArray = document.getElementsByTagName(\"\
    *\");\n  }\n\n  for (var i = 0; i < myArray.length; i++) {\n    if (attribute\
    \ == \"class\") {\n      var pattern = new RegExp(\"(^| )\" + attributeValue +\
    \ \"( |$)\");\n      if (pattern.test(elementArray[i].className)) {\n        matchedArray[matchedArray.length]\
    \ = myArray[i];\n      }\n    } else if (attribute == \"for\") {\n      if (elementArray[i].getAttribute(\"\
    htmlFor\") || myArray[i].getAttribute(\"for\")) {\n        if (elementArray[i].htmlFor\
    \ == attributeValue) {\n          matchedArray[matchedArray.length] = myArray[i];\n\
    \        }\n      }\n    } else if (elementArray[i].getAttribute(attribute) ==\
    \ attributeValue) {\n      matchedArray[matchedArray.length] = elementArray[i];\n\
    \    }\n  }\n  return matchedArray;\n}\n```\n\nA lot of the code in getElementsByAttribute\
    \ deals with the browser differences in attribute handling that were mentioned\
    \ earlier in this chapter, in “Reading and Writing the Attributes of Element”.\
    \ The necessary techniques used if the required attribute is class or for. As\
    \ an added bonus when checking for a match on the class attribute, if an element\
    \ has been assigned multiple classes, the function automatically checks each of\
    \ these to see whether it matches the required value.\n\n## Adding and Removing\
    \ Multiple Classes to/from an Element\n\nCombining multiple classes is a very\
    \ useful CSS technique. It provides a very primitive means of inheritance by allowing\
    \ a number of different styles to be combined on the one element, allowing you\
    \ to mix and match different effects throughout a site. They’re particularly useful\
    \ in situations like highlighting elements: a class can be added that highlights\
    \ an element without disturbing any of the other visual properties that may have\
    \ been applied to the element by other classes. However, if you are assigning\
    \ classes in JavaScript you must be careful that you don’t inadvertently overwrite\
    \ previously assigned classes.\n\n## Solution\n\nThe class for every element is\
    \ accessible via its `className` property. Allows you to read and write the classes\
    \ that are currently applied to that element. Because it’s just one string, the\
    \ most difficult part of working with `className` is that you need to deal with\
    \ the syntax to represent multiple classes.\n\nThe names in an element’s `className`\
    \ are separated by spaces. The first class name is not preceded by anything, and\
    \ the last name is not followed by anything. This makes it easy to add a class\
    \ to the list naively: just concatenate a space and the new class name to the\
    \ end of `className`. However, you’ll want to avoid adding a class name that already\
    \ exists in the list, as this will make removing the class harder. You'll also\
    \ want to avoid using a space at the beginning of the `className` value, because\
    \ this will cause errors in Opera 7:\n\n```javascript\nfunction addClass(target,\
    \ classValue) {\n  var pattern = new RegExp(\"(^| )\" + classValue + \"( |$)\"\
    );\n\n  if (!pattern.test(target.className)) {\n    if (target.className == \"\
    \") {\n      target.className = classValue;\n    } else {\n      target.className\
    \ += \" \" + classValue;\n    }\n  }\n\n  return true;\n}\n```\n\nFirst, addClass\
    \ creates a regular expression containing the class to be added. It then uses\
    \ this pattern to test the current className. If the class name doesn't already\
    \ exist, we assign it to the value, or we append to the existing value.\n\n##\
    \ Separating Classes\n\nSome regular expression examples for finding classes use\
    \ the word boundary character `\\b` to separate classes. However, this will not\
    \ work with all class names, such as those containing hyphens. The process for\
    \ removing a class uses a regular expression that is identical to the one we use\
    \ to add class:\n\n```javascript\nfunction removeClass(target, classValue) {\n\
    \  var removedClass = target.className;\n  var pattern = new RegExp(\"(^| )\"\
    \ + classValue + \"( |$)\");\n\n  removedClass = removedClass.replace(pattern,\
    \ \"$1\");\n  removedClass = removedClass.replace(/ $$/, \"\");\n\n  target.className\
    \ = removedClass;\n\n  return true;\n}\n```\n\n## Summary\n\nThis chapter introduced\
    \ the basic but powerful tools that you'll need in order to manipulate the Document\
    \ Object Model. It's important that you understand the DOM—the skeleton beneath\
    \ everything you see—as you manipulate any page. Knowing how to create, edit,\
    \ and delete parts of the DOM is crucial to the remainder of this book. Once you've\
    \ mastered these techniques, you'll be well on your way to becoming a proficient\
    \ JavaScript programmer.\n\n## Working with Windows and Frames\n\nThis chapter\
    \ is about simple window and frame manipulation, including opening popups, communicating\
    \ between frames, and finding out the page’s scrolling position.\n\nPlenty of\
    \ people feel that window manipulation is akin to the Dark Side. They believe\
    \ that a window is part of the user’s GUI, and since JavaScript is a document\
    \ scripting language, it has no business manipulating windows.\n\nI’m generally\
    \ inclined to agree, yet I know that opinion is sometimes a luxury. If your clients\
    \ ask for something specific, you can’t necessarily change their minds, or have\
    \ the freedom to turn down work on the basis of such a principle. In this chapter,\
    \ we’ll cover a range of practical window and frame manipulation tasks while remaining\
    \ sensitive to the usability and accessibility issues that arise from their use.\n\
    \nNote, though, there are limits, and some varieties of window scripting are particularly\
    \ unfriendly. We won't be dealing with aggressive tactics like closing or modifying\
    \ the user’s primary window, moving windows around the screen, or opening full-screen\
    \ “chromeless” windows. These are exactly the kinds of abuses that have given\
    \ JavaScript a bad name.\n\n¹The techniques involved in reading data from an iframe\
    \ will be covered in Chapter 18.\n"
  mdcn: "\n\n## 第 5 章：导航文档对象模型\n\n使用 getAttribute/setAttribute，我们编写 `element.getAttribute(\"\
    class\")`，但在 Internet Explorer 中，我们仍然使用 `element.getAttribute(\"className\")`。\n\
    \n另一个我们需要注意的属性是 label 的 `for`。它遵循与 class 相同的规则，但其属性形式为 `html`。使用 getAttribute/setAttribute\
    \ 时，我们编写 `element.getAttribute(\"for\")`，但在 Internet Explorer 中它是 `element.getAttribute(\"\
    htmlFor\")`。\n\n## 获取具有特定属性值的所有元素\n\n当你需要修改所有相同类（class）或标题（title）的元素时，查找所有具有特定属性的元素会非常有用。\n\
    \n## 解决方案\n\n为了找到具有特定属性值的元素，我们需要检查页面上的每一个元素是否具有该属性。这是一个非常耗费计算的操作，因此不应该被执行。如果你想找到所有\
    \ `type=\"checkbox\"` 的元素，最好将搜索范围限制在 `input` 元素：\n\n```javascript\nvar inputs\
    \ = document.getElementsByTagName(\"input\");\nfor (var i = 0; i < inputs.length;\
    \ i++) {\n  if (inputs.getAttribute(\"type\") == \"checkbox\") {\n    // ...\n\
    \  }\n}\n```\n\n这比遍历页面上的每个元素并检查其类型所需的计算量要少。然而，本解决方案中提供的函数——`getElementsByTagName`——在需要找到多个具有相同属性值的不同类型的元素时是理想理想的。\n\
    \n检查页面上每个元素最简单的方法是遍历 `getElementsByTagName(\"*\")` 返回的集合。这种方法唯一的问题是 Internet Explorer\
    \ 5.0 和 5.5 不支持使用星号进行标签选择。幸运的是，这些浏览器支持 `document.all` 属性，它是一个包含页面上所有元素的数组。`getElementsByAttribute`\
    \ 通过一个简单的代码分支处理了这个问题，然后继续检查元素是否具有指定的属性值，并将匹配项添加到数组中返回：\n\n文件：get_elements_by_attribute.js\
    \ (节选)\n\n```javascript\nfunction getElementsByAttribute(attribute, attributeValue)\
    \ {\n  var myArray = new Array();\n  var matchedArray = new Array();\n\n  if (document.all)\
    \ {\n    elementArray = document.all;\n  } else {\n    elementArray = document.getElementsByTagName(\"\
    *\");\n  }\n\n  for (var i = 0; i < myArray.length; i++) {\n    if (attribute\
    \ == \"class\") {\n      var pattern = new RegExp(\"(^| )\" + attributeValue +\
    \ \"( |$)\");\n      if (pattern.test(elementArray[i].className)) {\n        matchedArray[matchedArray.length]\
    \ = myArray[i];\n      }\n    } else if (attribute == \"for\") {\n      if (elementArray[i].getAttribute(\"\
    htmlFor\") || myArray[i].getAttribute(\"for\")) {\n        if (elementArray[i].htmlFor\
    \ == attributeValue) {\n          matchedArray[matchedArray.length] = myArray[i];\n\
    \        }\n      }\n    } else if (elementArray[i].getAttribute(attribute) ==\
    \ attributeValue) {\n      matchedArray[matchedArray.length] = elementArray[i];\n\
    \    }\n  }\n  return matchedArray;\n}\n```\n\n`getElementsByAttribute` 中的大量代码处理了本章之前“读取和写入元素属性”中提到的浏览器处理属性的差异。如果所需的属性是\
    \ `class` 或 `for`，则使用了必要的技术。作为额外奖励，在检查类属性的匹配项时，如果一个元素被分配了多个类，函数会自动检查这些类中的每一个，查看它们是否符合所需的值。\n\
    \n## 向元素添加和移除多个类\n\n组合多个类是一种非常有用的 CSS 技术。它通过允许在一个元素上组合多个不同的样式，提供了一种非常原始的继承方式，允许你在整个网站中混合和匹配不同的效果。它们在高亮元素等情况下特别有用：可以添加一个类来高亮元素，而不会干扰其他类可能应用到该元素的任何其他视觉属性。然而，如果你在\
    \ JavaScript 中分配类，必须小心不要无意中覆盖了之前分配的类。\n\n## 解决方案\n\n每个元素的类都可以通过其 `className` 属性访问。这允许你读取和写入当前应用到该元素的类。由于它只是一个字符串，处理\
    \ `className` 最困难的部分是需要处理表示多个类的语法。\n\n元素 `className` 中的名称由空格隔开。第一个类名之前没有任何内容，最后一个名称之后也没有任何内容。这使得天真（naive）地向列表中添加类变得非常简单：只需将一个空格和新类名连接到\
    \ `className` 的末尾即可。然而，你希望避免添加列表中已经存在的类名，因为这会使删除类变得困难。你还希望避免在 `className` 值的开头使用空格，因为这会在\
    \ Opera 7 中导致错误：\n\n```javascript\nfunction addClass(target, classValue) {\n \
    \ var pattern = new RegExp(\"(^| )\" + classValue + \"( |$)\");\n\n  if (!pattern.test(target.className))\
    \ {\n    if (target.className == \"\") {\n      target.className = classValue;\n\
    \    } else {\n      target.className += \" \" + classValue;\n    }\n  }\n\n \
    \ return true;\n}\n```\n\n首先，`addClass` 创建了一个包含要添加的类的正则表达式。然后，它使用该模式测试当前的 `className`。如果类名尚不存在，我们将其赋值给该值，或者附加到现有值之后。\n\
    \n## 分离类\n\n某些查找类的正则表达式示例使用边界字符 `\\b` 来分隔类。然而，这对于所有类名都不起作用，例如包含连字符的类名。移除类的过程使用了与我们添加类时完全相同的正则表达式：\n\
    \n```javascript\nfunction removeClass(target, classValue) {\n  var removedClass\
    \ = target.className;\n  var pattern = new RegExp(\"(^| )\" + classValue + \"\
    ( |$)\");\n\n  removedClass = removedClass.replace(pattern, \"$1\");\n  removedClass\
    \ = removedClass.replace(/ $$/, \"\");\n\n  target.className = removedClass;\n\
    \n  return true;\n}\n```\n\n## 总结\n\n本章介绍了你操作文档对象模型（DOM）所需的基础但强大的工具。在操作任何页面时，理解\
    \ DOM——你所看到的一切之下的骨架——是关重要的。知道如何创建、编辑和删除 DOM 的部分对于本书的剩余部分至关重要。一旦你掌握了这些技术，你就向成为熟练的\
    \ JavaScript 程序员迈出了一步。\n\n## 处理窗口和框架\n\n本章关于窗口和框架的操作，包括弹出窗口、帧之间的通信以及页面滚动位置。\n\n\
    许多人认为窗口操作类似于“黑暗面”。他们认为窗口是用户界面界面的一部分，而由于 JavaScript 是一种文档脚本语言，它没有权利操作窗口。\n\n¹从\
    \ iframe 中读取数据的技术将在第 18 章中讨论。\n\n"
