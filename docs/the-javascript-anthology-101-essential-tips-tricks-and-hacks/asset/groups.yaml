    # ActiveX 又是怎样的？


    如果你已经对微软的 JScript 非常熟悉了，你可能会想：“但是 JavaScript 可以利用 ActiveX 完成其中一些事情”，而这确实如此——ActiveX
    并不是 ECMAScript 的一部分。ActiveX 是一种 Windows 特有的机制，允许 Internet Explorer 访问 COM（Windows
    脚本技术顶层的组件对象模型），并且通常只在受信任的环境中（如内网）中运行。我们将会遇到一些特定的例外情况——例如在 IE 中无需特殊安全设置即可运行的 ActiveX
    控件的示例（如 Flash 插件和 `XMLHttpRequest`），但对于大多数情况，使用 ActiveX 进行脚本编写超出了本书的讨论范围。


    通常，运行客户端的计算机性能可能没有服务器那么强大，因此 JavaScript 不是处理大量数据处理的最佳工具。但在客户端进行数据处理的即时性使得这种方案在小量处理时具有吸引力，因为可以立即收到响应；例如，表单验证就是客户端处理的理想候选者。


    但从“哪种更好”的角度来比较服务器端和客户端语言是误导的。两者没有优劣之分——它们是针对不同任务的工具，它们之间的功能交叉很小。然而，客户端与服务器端脚本之间交互的增加正在产生一种新的脚本语言，它使用如
    `XMLHttpRequest` 等技术来请求服务器数据、运行服务器端脚本，然后在客户端管理结果。我们将在第 18 章中深入研究这些技术。


    # 安全限制


    由于 JavaScript 在高度敏感的数据和程序领域内运行，其功能受到了了限制，以确保它不会被恶意使用。因此，许多操作 JavaScript 根本不被允许。例如，它无法读取你计算机中的大多数系统设置，无法与硬件直接交互，无法导致程序运行。


    此外，某些对于特定元素通常允许的特定交互在 JavaScript 中是不被允许的，这取决于该元素的属性。例如，更改表单 `<input>` 的值通常没有问题，但如果它是文件输入字段（例如
    `<input type="file">`），则完全不允许向其写入——这种限制防止了恶意脚本强制使用户上传他们未选择的文件。


    类似的安全限制例子还有很多，我们将在书中涵盖的应用中根据出现的情况进行详细说明。但总而言之，这里是 JavaScript 的主要限制和安全限制列表，包括我们已经看到的。JavaScript
    无法：


    - 直接打开并读取文件（特定情况下除外，详见第 18 章）。

    - 在用户的计算机上创建或编辑文件（cookie 除外，第 8 章将讨论）。

    - 读取 HTTP POST 数据。

    - 读取系统设置，或从用户计算机读取任何其他通过语言或主机对象无法获取的数据。¹

    - 修改文件输入字段的值。

    - 更改从不同域名加载的文档的显示。

    - 关闭或修改不是由脚本打开的窗口的工具栏和其他元素（即主浏览器窗口）。


    最终，JavaScript 可能完全不受支持。


    值得注意的是，许多浏览器都包含了一些选项，允许实现比简单的启用或禁用 JavaScript 更高的精度。例如，Opera 包含了阻止脚本关闭窗口、移动窗口、写入状态栏、接收右键点击等选项……列表非常长。对于如何绕过这一点你几乎做不了什么，但大多数情况下，你并不需要这样做——此类选项已经演变为可以抑制“烦人”的脚本（状态栏滚动文字、右键脚本等），因此只要你避开这类脚本，问题就会很少出现。


    # JavaScript 最佳实践


    JavaScript 最佳实践非常强调你应该为人们做什么的问题。JavaScript 最佳实践非常强调你应该为人们做什么的问题。 核心核心原则。在本节中，我想看看良好的
    JavaScript 的三个核心原则：


    - 渐进式增强（progressive enhancement）

    - 非侵入式脚本（unobtrusive scripting）

    - 一致性编码（consistent coding）


    # 为没有 JavaScript 的用户提供支持（渐进式增强）


    用户可能没有 JavaScript 有以下几个原因：


    - 他们使用的设备完全不支持脚本，或者以有限的方式支持脚本。

    - 他们处于代理服务器或防火墙之后，这些过滤了 JavaScript。

    - 他们故意关闭了 JavaScript。


    第一点涵盖了出奇的大范围设备，包括


    > 优雅降级意味着如果不支持 JavaScript，浏览器可以自然地“退化”到非脚本功能。


    最后一点在列表中可能是不可能的（除了其他开发者），但这些都是重要的：有些用户没有 JavaScript，我们应该考虑到他们。无法量化这一类用户数量，因为从服务器检测
    JavaScript 是不可靠的，但我看到的数字在 5% 到 20% 之间，取决于你是否将搜索引擎机器人视为“用户”。

