    \ += elementChildren[i].nodeValue;\n      }\n    } else {\n      internalText\
    \ += getInnerText(elementChildren[i]);\n    }\n  }\n  return internalText;\n}\n\
    ```\n\n`innerText` 通过对每个子元素递归调用自身并合并结果值，提取元素内部的所有文本——包括其所有后代元素。这允许我们访问表格单元格内的文本，无论它是否被封装在\
    \ `span`、`strong` 或 `em` 等元素中。任何纯空白文本节点都会通过正则表达式检查被忽略。\n\n当 `sortColumn` 在副本中找到某行的排序表格单元格值“小于”我们正在扫描的行时，我们将该行的复制插入到副本的\
    \ `tbody` 中。对于升序列，我们简单地反转这一比较：副本中行的值必须“大于”被扫描行的值。\n\n然而，在进行比较之前，我们会检查排序表格单元格的内容是否可以被解释为整数或浮点数；如果是，则对比较值进行转换。这确保了包含数字的表格可以得到正确排序；字符串比较的结果与数字比较不同。\n\
    \n一旦我们所有的原始行都复制到新的 `tbody` 中，就会使用该元素替换旧元素，我们便得到了排序后的表格！\n\n"
