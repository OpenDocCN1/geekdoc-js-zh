    If we want to retrieve the element that was clicked upon, we then make a call\
    \ to getEventTarget:\n\nFile: handle_events7.js (excerpt)\n\n```\nvar mylink =\
    \ document.getElementById(\"mylink\");\naddEventListener(mylink, \"click\", engage,\
    \ false);\nfunction engage(event) {\n  if (typeof event == \"undefined\") {\n\
    \    event = window.event;\n  }\n  var target = getEventTarget(event);\n  while(target.node.toLowerCase()\
    \ != \"a\") {\n    target = target.parentNode;\n  }\n  var href = target.getAttribute(\"\
    href\");\n  alert(\"Engage: \" + href);\n  return true;\n}\n```\n\nBecause we\
    \ know, in this case, that the event-handling function will be attached only to\
    \ links (<a> tags), we can iterate upwards from the event target, checking for\
    \ a node name of “a”. The first one we will be the link to which the handler was\
    \ assigned; this ensures that we aren't working with some element inside the link\
    \ (such as a strong or span)."
- md: "\n## The W3C Way (Event Listeners)\n\nObviously, this method of target finding\
    \ is not ideal, and cannot be 100% accurate unless you have knowledge of the exact\
    \ HTML you'll be working with. Recently, much effort has gone into resolving this\
    \ problem, and quite a few of the proposed solutions offer the same variable as\
    \ is available under DOM event handlers, and in browsers that support the W3C\
    \ Standard for event listeners (Internet Explorer).\n\nOne solution is to make\
    \ the event listening function a method of the target object in Internet Explorer.\
    \ Then, when the method is called, this will naturally point to the object for\
    \ which the method was called. This requires both the attachEventListener and\
    \ detachEventListener to be modified:\n\n```javascript\nfile: handle_events8.js\
    \ (excerpt)\nfunction attachEventListener(target, eventType, functionRef,\ncapture)\n\
    {\n  if (typeof target.addEventListener != \"undefined\") {\n    target.addEventListener(eventType,\
    \ functionRef, capture);\n  } else if (typeof target.attachEvent != \"undefined\"\
    ) {\n    var functionString = eventType + functionRef;\n    target[\"e\" + functionString]\
    \ = functionRef;\n    target[functionString] = function(event) {\n      if (typeof\
    \ event == \"undefined\") {\n        event = window.event;\n      }\n      target[\"\
    e\" + functionString](event);\n    }\n    target.attachEvent(\"on\" + eventType,\
    \ target[functionString]);\n  }\n} else {\n  eventType = \"on\" + eventType;\n\
    \  if (typeof target[eventType] == \"function\") {\n    var oldEventListener =\
    \ target[eventType];\n    target[eventType] = function() {\n      oldListener();\n\
    \      return functionRef();\n    }\n  } else {\n    target[eventType] = functionRef;\n\
    \  }\n}\nfunction detachEventListener(target, eventType, functionRef, capture)\
    \ {\n  if (typeof target.removeEventListener != \"undefined\") {\n    target.removeEventListener(eventType,\
    \ functionRef, capture);\n  } else if (typeof target.detachEvent != \"undefined\"\
    ) {\n    var functionString = eventType + functionRef;\n    target.detachEvent(\"\
    on\" + eventType, target[functionString]);\n    target[\"e\" + functionString]\
    \ = null;\n    target[functionString] = null;\n  } else {\n    target[\"on\" +\
    \ eventType] = null;\n  }\n}\n```\n\nThe line of thinking was well represented\
    \ in entries to Peter Paul Koch’s addEventListener competition.6\n\nAnother solution\
    \ by Dean Edwards totally eschews the W3C event model in favor of implementing\
    \ DOM 0 event handlers with independent add and remove abilities.7\n\n6 http://www.quirksmode.org/blog/archives/2005/10/_and_the_winner_1.html\n\
    7 http://dean.edwards.name/weblog/2005/10/add-event/\n\nAlthough both of these\
    \ solutions may prove to be well written and robust, they’re largely untested\
    \ as of this writing, we’ll stick with the approach whose flaws we know and can\
    \ handle: the one presented in the main solution. Besides, in practice, the process\
    \ of iterating to find an event's target isn’t as unreliable as it may appear\
    \ to.\n\n## What is Event Bubbling, and How do I control it?\n\nYou may have noticed\
    \ that we needed to supply a third argument to the W3C Standard `addEventListener`\
    \ method, and that a `capture` argument was included in our `attachEventListener`\
    \ function to cater for this. This argument determines the phase of the event\
    \ cycle which the listener operates.\n\nSuppose you have two elements, one inside\
    \ the other:\n\n```html\n<p>\n<a href=\"timely_death.html\">Nameless Ensign</a>\n\
    </p>\n```\n\nWhen a user clicks on the link, click events will be registered on\
    \ both the paragraph and the hyperlink. The question is, which one receives the\
    \ event first?\n\nThe event cycle contains two phases, and each answers this question\
    \ in a different way. In the `capture` phase, events work from the outside in,\
    \ so the paragraph would receive the click first. In the `bubble` phase, events\
    \ work from the inside out, so the anchor would receive the click before the paragraph.\n\
    \nInternet Explorer and Opera only support bubbling, which is why `attach` doesn’t\
    \ require a third argument. For browsers that support `addEventListener`, if the\
    \ third argument is `true`, the event will be caught during the capture phase;\
    \ if it is `false`, the event will be caught during the bubble phase.\n\nIn browsers\
    \ that support both phases, the capture phase occurs first and is always followed\
    \ by the bubble phase. It’s possible for an event to be handled in both the capture\
    \ and bubbling phases, provided you set up listeners for each phase.\n\nThese\
    \ phases also highlight the fact that nested elements are affected by the same\
    \ event. If you no longer want an event to continue propagating up or down the\
    \ hierarchy (depending upon the phase) after an event listener has been triggered,\
    \ you can stop it. In Internet Explorer, this involves setting the `cancelBubble`\
    \ property of the event object to true; in the W3C model, you must instead call\
    \ its stopPropagation method:\n\n```javascript\nfunction stopEvent(event)\n{\n\
    \  if (typeof event.stopPropagation != \"undefined\") {\n    event.stopPropagation();\n\
    \  } else {\n    event.cancelBubble = true;\n  }\n}\n```\n\nIf we didn't want\
    \ an event to propagate further than this event handler, we could use this code:\n\
    \n```javascript\nvar mylink = document.getElementById(\"mylink\");\naddEventListener(mylink,\
    \ \"click\", engage, false);\nvar paragraph = document.getElementsByTagName(\"\
    p\")[0];\naddEventListener(paragraph, \"click\", engage, false);\nfunction engage(event)\n\
    {\n  if (typeof event == \"undefined\") {\n    event = window.event;\n  }\n  alert(\"\
    She canna take no more cap'n!\");\n}\nfunction stopEvent(event) {\n  return true;\n\
    }\n```\n\nAlthough we have assigned the engage function to listen for the click\
    \ event on both the link and the paragraph that contains it, the function will\
    \ only be called once per click, as the event’s propagation is stopped by the\
    \ listener the first time it is called.\n\n## Finding the Size of an Element\n\
    \nThere are so many variables that affect the size of an element—content length,\
    \ CSS rules, font family, font size, line height, text zooming …the list goes\
    \ on. Add to this that browsers interpret CSS dimensions consistently, and you\
    \ can never predict the size of an element. The only way to determine the size\
    \ of an element is to measure it.\n\n## Solution\n\nIt is possible to retrieve\
    \ the dimensions of an element minus its borders, including its padding. These\
    \ values are accessed using the clientWidth and clientHeight properties. Let’s\
    \ imagine that an element were specified in CSS like this:\n\n```css\n#enterprise\n\
    \  width: 350px;\n  height: 150px;\n  margin: 25px;\n  border: 25px solid #000000;\n\
    \  padding: 25px;\n}\n```\n\nWe can determine that element’s exact pixel in JavaScript\
    \ by checking the corresponding offsetWidth and offsetHeight properties:\n\n```javascript\n\
    file: find_size_element.js (excerpt)\nvar starShip = document.getElementById(\"\
    enterprise\");\nvar pixelWidth = starShip.offsetWidth;\nvar pixelHeight = starShip.offsetHeight;\n\
    ```\n\nIn Internet Explorer 6, Opera, Mozilla, Safari, the variable pixelWidth\
    \ will be set to 450, and the variable pixelHeight will be set to 250. In Internet\
    \ Explorer 5/5.5, pixelWidth will be 350 and pixelHeight 150, because the box\
    \ model used in these browsers will render the element. The values are different\
    \ across browsers, but only because the actual rendered differs. The offset dimensions\
    \ consistently calculate the pixel dimensions of the element.\n\nIf we did not\
    \ detect the dimensions of the element, and instead left its display up to the\
    \ default block rendering (avoiding the box model guys), the values would be comparable\
    \ between browsers.\n\n## Attaining the Correct Dimensions\n\nIn order to correctly\
    \ determine the dimensions of an element you wish to wait until the browser has\
    \ finished rendering otherwise the dimensions may differ from those the user sees.\
    \ There's no guarantee to ensure that a browser has finished rendering an element,\
    \ but it's normally safe to assume that a window's load event has been fired,\
    \ all elements have been rendered.\n\n![](img/ea2a6d5786c46a059cd7778099fdcd56_111_0.png)\n\
    \n## Discussion\n\nIt is possible to retrieve the dimensions of an element minus\
    \ its borders, including its padding. These values are accessed using the clientWidth\
    \ and clientHeight properties, and for the example element used above their values\
    \ would be 300 and 100 in Internet Explorer 5/5.5, and 400 and 200 in all other\
    \ browsers. There is no property that will allow you to retrieve an element's\
    \ width without borders or padding.\n\n## Finding the Position of an Element\n\
    \nKnowing the exact position of an element is very helpful when you wish to position\
    \ other elements relative to it. However, because of different sizes,\n"
  mdcn: "\n\n## W3C 方法（事件监听器）\n\n显然，这种寻找目标的方法并不是理想的，除非你完全了解要处理的精确 HTML 代码，否则无法保证 100%\
    \ 准确。最近，人们在解决这个问题上投入了精力，许多提出的解决方案都提供了与 DOM 事件处理器中相同的变量，并且在支持 W3C 事件监听器标准的浏览器（Internet\
    \ Explorer）中可用。\n\n一种解决方案是将事件监听函数成为 Internet Explorer 中目标对象的方法。这样，当该方法被调用时，它自然地指向调用该方法的对象。这需要同时修改\
    \ `addEventListener` 和 `detachEventListener`：\n\n```javascript\nfile: handle_events8.js\
    \ (excerpt)\nfunction attachEventListener(target, eventType, functionRef,\ncapture)\n\
    {\n  if (typeof target.addEventListener != \"undefined\") {\n    target.addEventListener(eventType,\
    \ functionRef, capture);\n  } else if (typeof target.attachEvent != \"undefined\"\
    ) {\n    var functionString = eventType + functionRef;\n    target[\"e\" + functionString]\
    \ = functionRef;\n    target[functionString] = function(event) {\n      if (typeof\
    \ event == \"undefined\") {\n        event = window.event;\n      }\n      target[\"\
    e\" + functionString](event);\n    }\n    target.attachEvent(\"on\" + eventType,\
    \ target[functionString]);\n  }\n} else {\n  eventType = \"on\" + eventType;\n\
    \  if (typeof target[eventType] == \"function\") {\n    var oldEventListener =\
    \ target[eventType];\n    target[eventType] = function() {\n      oldListener();\n\
    \      return functionRef();\n    }\n  } else {\n    target[eventType] = functionRef;\n\
    \  }\n}\nfunction detachEventListener(target, eventType, functionRef, capture)\
    \ {\n  if (typeof target.removeEventListener != \"undefined\") {\n    target.removeEventListener(eventType,\
    \ functionRef, capture);\n  } else if (typeof target.detachEvent != \"undefined\"\
    ) {\n    var functionString = eventType + functionRef;\n    target.detachEvent(\"\
    on\" + eventType, target[functionString]);\n    target[\"e\" + functionString]\
    \ = null;\n    target[functionString] = null;\n  } else {\n    target[\"on\" +\
    \ eventType] = null;\n  }\n}\n```\n\n这种思路在 Peter Paul Koch 的 `addEventListener`\
    \ 竞赛条目中得到了很好的体现。6\n\nDean Edwards 的另一种解决方案完全摒弃了 W3C 事件模型，转而采用实现具有独立添加和移除能力的 DOM\
    \ 0 事件处理器。7\n\n6 http://www.quirksmode.org/blog/archives/2005/10/_and_the_winner_1.html\n\
    7 http://dean.edwards.name/weblog/2005/10/add-event/\n\n尽管这两个解决方案可能被证明是写得很好且健壮的，但在本文运行时它们在很大程度上尚未经过测试，我们将坚持使用已知并可以处理其缺陷的方法：即主解决方案中介绍的方法。此外，在实践中，迭代寻找事件目标的过程并不像表面看起来那么不可靠。\n\
    \n## 什么是事件冒泡，我该如何控制它？\n\n你可能注意到，我们需要为 W3C 标准的 `addEventListener` 方法提供第三个参数，并且我们的\
    \ `attachEventListener` 函数中包含了一个 `capture` 参数来满足此需求。该参数决定了监听器运行的事件周期阶段。\n\n假设你有两个元素，一个嵌套在另一个里面：\n\
    \n```html\n<p>\n<a href=\"timely_death.html\">Nameless Ensign</a>\n</p>\n```\n\
    \n当用户点击链接时，点击事件将在段落和超链接上同时注册。问题是，哪一个先接收到事件？\n\n事件周期包含两个阶段，每个阶段以不同的方式回答了这个问题。在\
    \ `capture`（捕获）阶段，事件从外向内工作，因此段落会先接收到点击。在 `bubble`（冒泡）阶段，事件从内向外工作，因此锚会在段落之前接收到点击。\n\
    \nInternet Explorer 和 Opera 只支持冒泡，这就是为什么 `attach` 不需要第三方参数。对于支持 `addEventListener`\
    \ 的浏览器，如果第三个参数为 `true`，事件将在捕获阶段被捕获；如果是 `false`，事件将在冒泡阶段被捕获。\n\n在支持这两个阶段的浏览器中，捕获阶段首先发生，随后总是是冒泡阶段。事件可能会在捕获和冒泡阶段同时被处理，前提是你为每个阶段都设置了监听器。\n\
    \n这些阶段还突显了嵌套元素受到相同事件影响的事实。如果你在事件监听器触发后，不再希望事件继续沿层级结构向上或向下传播（取决于阶段），你可以停止它。在 Internet\
    \ Explorer 中，这涉及将事件对象的 `cancelBubble` 属性设置为 `true`；而在 W3C 模型中，你必须调用它的 `stopPropagation`\
    \ 方法：\n\n```javascript\nfunction stopEvent(event)\n{\n  if (typeof event.stopPropagation\
    \ != \"undefined\") {\n    event.stopPropagation();\n  } else {\n    event.cancelBubble\
    \ = true;\n  }\n}\n```\n\n如果我们不希望事件传播到此事件处理器之外，我们可以使用以下代码：\n\n```javascript\n\
    var mylink = document.getElementById(\"mylink\");\naddEventListener(mylink, \"\
    click\", engage, false);\nvar paragraph = document.getElementsByTagName(\"p\"\
    )[0];\naddEventListener(paragraph, \"click\", engage, false);\nfunction engage(event)\n\
    {\n  if (typeof event == \"undefined\") {\n    event = window.event;\n  }\n  alert(\"\
    She canna take no more cap'n!\");\n}\nfunction stopEvent(event) {\n  return true;\n\
    }\n```\n\n尽管我们分配了 `engage` 函数来监听链接以及包含它的段落的点击事件，但每次点击函数只会被调用一次，因为事件的传播在监听器第一次被调用时就被停止了。\n\
    \n## 获取元素的尺寸\n\n影响元素尺寸的变量非常多——内容长度、CSS 规则、字体族、字体大小、行高、文本缩放……列表非常长。此外，由于浏览器对 CSS\
    \ 尺寸的解释并不一致，你永远无法预测元素的大小。确定元素尺寸的唯一方法是测量。\n\n## 解决方案\n\n可以获取元素除去边框（包括内边距）后的尺寸。这些值通过\
    \ `clientWidth` 和 `clientHeight` 属性访问。让我们假设元素在 CSS 中是这样指定的：\n\n```css\n#enterprise\n\
    \  width: 350px;\n  height: 150px;\n  margin: 25px;\n  border: 25px solid #000000;\n\
    \  padding: 25px;\n}\n```\n\n我们可以通过检查对应的 `offsetWidth` 和 `offsetHeight` 属性使用 JavaScript\
    \ 获取该元素的像素尺寸：\n\n```javascript\nfile: find_size.js (excerpt)\nvar starShip = document.getElementById(\"\
    enterprise\");\nvar pixelWidth = starShip.offsetWidth;\nvar pixelHeight = starShip.offsetHeight;\n\
    ```\n\n在 Internet Explorer 6、Opera、Mozilla 和 Safari 中，`pixelWidth` 将设置为 450，`pixelHeight`\
    \ 将设置为 250。在 Internet Explorer 5/5 中，`pixelWidth` 为 350，`pixelHeight` 为 150，因为这些浏览器使用的盒模型会渲染元素。这些值在浏览器之间不同，仅仅是因为实际渲染方式不同。偏移尺寸始终计算的是元素的像素尺寸。\n\
    \n如果我们不检测元素的尺寸，而是交给默认块渲染（避免使用盒模型），这些值在浏览器之间将具有可比性。\n\n## 获取正确的尺寸\n\n为了正确确定元素的尺寸，你希望等待浏览器完成渲染，否则尺寸可能与用户看到的不同。没有方法可以确保浏览器已完成元素的渲染，但通常可以假设窗口的加载事件已触发，所有元素都已渲染。\n\
    \n![](img/ea2a6d5786c46a059cd7778099fdcd56_111_0.png)\n\n## 讨论\n\n可以获取元素除去边框（包括内边距）后的尺寸。这些值通过\
    \ `clientWidth` 和 `clientHeight` 属性访问，对于上述示例元素，在 Internet Explorer 5/5 中这些值分别为\
    \ 300 和 100，在所有其他浏览器中均为 400 和 200。没有任何属性允许你获取不含边框或内边距元素宽度。\n\n## 获取元素的位置\n\n知道元素的精确位置对于当你想要相对于它定位其他元素时非常有帮助。然而，由于尺寸不同，\n\
    \n"
