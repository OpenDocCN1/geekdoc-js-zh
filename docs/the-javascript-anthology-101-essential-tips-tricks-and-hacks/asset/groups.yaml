- md: "\n# Chapter 1: Getting Started with JavaScript\n\n## Hiding JavaScript Source\
    \ Code\n\nIf you've ever created something that you're proud of, you'll understand\
    \ the desire to protect your intellectual property. But JavaScript on the Web\
    \ is an open-source language by nature; it comes to the browser in its source\
    \ form, so if the browser can run it, a person can read it.\n\nThere are a few\
    \ applications on the Web that claim to offer source-code encryption, but in reality,\
    \ there's nothing you can do to encrypt source-code that another coder couldn't\
    \ decrypt in seconds. In fact, some of these programs actually cause problems:\
    \ they often obfuscate code in such a way to make it slower, less efficient, or\
    \ just plain broken. My advice? Stay away from them like the plague.\n\nBut still,\
    \ the desire to hide code remains. There is something that you can do if not outright\
    \ encrypt, the code that your users can see.\n\n## Solution\n\nCode that has been\
    \ stripped of all comments and unnecessary whitespace is very difficult to read,\
    \ and as you might expect, extracting individual bits of functionality from such\
    \ code is extremely difficult. The simple technique of compressing your scripts\
    \ in this way can put off all the most determined hacker. For example, this code:\n\
    \n```javascript\nvar oldfn = window.onload;\nif (typeof window.onload != 'function')\n\
    {\n  window.onload = fn;\n}\nelse{\n  window.onload = function() {\n    oldfn();\n\
    \    fn();\n  };\n}\n```\n\nWe can compress that code into the following two lines\
    \ by removing unnecessary whitespace:\n\n```javascript\nvar oldfn=window.onload;if(typeof\
    \ window.onload=='function') {window.onload=fn;}else{window.onload=function()\
    \ {oldfn();fn();}}\n```\n\nremember that important word—unnecessary. Whitespace\
    \ is essential, as the single spaces after var and typeof.\n\n## Discussion\n\n\
    This practice has advantages quite apart from the benefits of obfuscation. Scripts\
    \ that are stripped of comments and unnecessary whitespace are smaller; therefore,\
    \ they’re faster loading, and may process more quickly.\n\nBut please remember\
    \ that the code must remain strictly formatted using semicolon line terminators\
    \ and braces (as we discussed in “Using Braces and Semicolons (Consistent Coding\
    \ Practice\"); otherwise, the removal of line breaks will make lines of code run\
    \ together, and ultimately cause errors.\n\nBefore you start compression, remember\
    \ to make a copy of the script. I know it seems obvious, but I’ve made this mistake\
    \ plenty of times, and it’s all the more jarring for being so elementary! What\
    \ I do these days is write and maintain scripts in their fully spaced and commented\
    \ form, then run them through a bunch of search/replace just before they’re published.\
    \ Usually, I keep two copies of a script, named myscript.js and myscript-commented.js,\
    \ or something similar.\n\nWe’ll come back to this in Chapter 20, where we’ll\
    \ discuss this among a range of techniques for improving the speed and efficiency\
    \ of scripts, as well as reducing the amount of physical space they require.\n\
    \n## Debugging a Script\n\nDebugging is the process of finding and (hopefully)\
    \ fixing bugs. Most browsers have some kind of bug reporting built in, and a couple\
    \ of external debuggers are also worth investigating.\n\n## Understanding a Browser’s\
    \ Built-in Error Reporting\n\nOpera, Mozilla browsers (such as Firefox), and Internet\
    \ Explorer all have decent bug reporting built in, but Opera and Mozilla’s debugging\
    \ tools are the most useful.\n\n- **Opera**: Open the JavaScript console from\
    \ Tools > Advanced. You can also open it automatically when an error occurs by\
    \ going to Tools > Preferences > Content, clicking the JavaScript button to open\
    \ its dialog, and checking Open console on error.\n- **Firefox**: Open the JavaScript\
    \ console from Tools > Advanced and uncheck the option Disable script, check the\
    \ option Display a notification about every error.\n- **Internet Explorer for\
    \ Mac**: Go to Preferences > Preferences > Web Content and check Show reporting\
    \ alerts.\n- **Safari**: doesn’t include bug reporting by default, but recent\
    \ versions have a “secret” Debug menu, which can be enabled by entering the following\
    \ terminal command:\n```bash\n$ defaults write com.apple.safari true\n```\n\n\
    Understanding the various browsers’ console can take a little practice, because\
    \ each browser gives different information. Here’s an example of an error—a mistyped\
    \ function call:\n\n```javascript\nfunction saySomething(message) {\n  alert(message);\n\
    }\nsaySomething('Hello world');\n```\n\nFirefox gives a concise but very accurate\
    \ error report, which includes the line number at which the error occurred, and\
    \ a description, as shown in Figure 1.1.\n\nAs Figure 1.2 illustrates, Opera gives\
    \ an extremely verbose report, including a backtrace to the event from which the\
    \ error originated, a notification of the line where it occurred, and a description.\
    \ A backtrack helps when an error occurs in code that was originally called by\
    \ other code; for example, an event-handler calls on to a second function, and\
    \ it's at this point that the error occurs. Opera's console will trace this process\
    \ back through each stage to its origin.\n\nInternet Explorer gives the fairly\
    \ basic kind of report in Figure 1.3. It provides the number of the line at which\
    \ the interpreter encountered the error (this may or not be close to the true\
    \ location of the actual problem). Internet Explorer is particularly bad at locating\
    \ errors in external files. Often, the line number it will report will actually\
    \ be the line at which the script is loaded in the HTML file, a summary of the\
    \ error type, though it doesn't explain the specifics of the error itself.\n\n\
    As you probably gathered, I'm not overly impressed by Internet Explorer's error\
    \ reporting, but it is vastly better than nothing: at least you know that an error\
    \ has occurred.\n\n## Using alert\n\nThe alert function is a very useful means\
    \ of analyzing errors—you can use it at any point in a script to probe objects\
    \ and variables to see if they contain the data. For example, if you have a function\
    \ that has several conditional branches, you can add an alert within each condition\
    \ to find out which is being executed:\n\n```javascript\nfunction checkAge(years)\n\
    {\n  if (years < 13)\n  {\n    alert('less than 13');\n  }\n  else if (years >=\
    \ 13 && years <= 21)\n  {\n    alert('13 to 21');\n  }\n  else\n  {\n    alert('older');\n\
    \  }\n}\n```\n\nMaybe the value for years is not coming back as a number, like\
    \ it should. You could add to the start of your script an alert that tests the\
    \ variable to see what type it is:\n\n```javascript\nfunction checkAge(years)\n\
    {\n  alert(typeof years);\n}\n```\n\nIn theory, you can put any amount of information\
    \ in an alert dialog, although a very long string of data could create such a\
    \ wide dialog that some of the information would be clipped or outside the window.\
    \ You can avoid this by formatting the output with escape characters, such as\
    \ \\n for a line break.\n\n## Using try-catch\n\nThe try-catch construct is an\
    \ incredibly useful way to get a script just to \"try something,\" leaving you\
    \ to handle any errors that may result. The basic construct looks like this:\n\
    \n```javascript\ntry\n{\n  some code\n}\ncatch (err)\n{\n  this gets run if the\
    \ try{} block results in an error\n}\n```\n\nIf you're not sure where an error's\
    \ coming from, you can wrap a try-catch around a large block of code to trap the\
    \ general failure, tighten it progressively chunks of code until you isolate the\
    \ problematic line. For example, you could wrap a try brace around the first half\
    \ of a function (at a convenient point in the code), then the second half, to\
    \ see where the error occurs; you could divide the suspect half again, at a convenient\
    \ point, and keep going.\n"
  mdcn: "\n\n# 第 1 章：JavaScript 入门\n\n## 隐藏 JavaScript 源代码\n\n如果你曾经创建过让你感到自豪的东西，你就会理解保护知识产权的愿。但\
    \ Web 上的 JavaScript 本质上是一种开源语言；它以源码的形式传输到浏览器，因此只要浏览器可以运行它，任何人就可以读取它。\n\nWeb 上有一些应用程序声称能提供源代码加密，但实际上，你无法对源代码进行任何加密处理，以至于另一个程序员无法在几秒钟内解密。事实上，其中一些程序实际上会引起问题：它们往往会混淆代码，导致代码运行变慢、效率降低，或者直接损坏。我的建议是？像远离瘟疫一样远离它们。\n\
    \n尽管如此，隐藏代码的愿依然存在。虽然不能完全加密用户看到的代码，但你仍然可以做一些事情。\n\n## 解决方案\n\n剥除了所有注释和不必要空格的代码非常难以阅读，正如你所预期的，从此类代码中提取单个功能单元是非常困难的。通过这种方式压缩脚本的简单技术就能击退所有最有决心的黑客。例如，这段代码：\n\
    \n```javascript\nvar oldfn = window.onload;\nif (typeof window.onload != 'function')\n\
    {\n  window.onload = fn;\n}\nelse{\n  window.onload = function() {\n    oldfn();\n\
    \    fn();\n  };\n}\n```\n\n我们可以通过删除不必要的空格，将这段代码压缩为以下两行：\n\n```javascript\nvar\
    \ oldfn=window.onload;if(typeof window.onload=='function') {window.onload=fn;}else{window.onload=function()\
    \ {oldfn();fn();}}\n```\n\n记住那个重要的词——不必要的。空格是必不可少的，例如 `var` 和 `typeof` 后的空格。\n\
    \n## 讨论\n\n除了混淆的好处外，这种做法还有许多优点。剥离注释和不必要空格的脚本更小；因此，它们的加载速度更快，处理也可能更快。\n\n但请记住，代码必须保持使用分号行终止符和括号的严格格式（正如我们在“使用括号和分号（一致编码实践）”中讨论的那样），否则删除换行符会导致代码行连在一起，最终导致错误。\n\
    \n在开始压缩之前，记得为脚本创建一个副本。我知道这看起来很显而易见，但我犯过很多次错误，而且由于如此基础的错误反而更令人脸脸！我现在的做法是按照完全带有空格和注释的形式编写并维护脚本，然后在发布前不久对它们运行一系列搜索/替换。通常，我会保留脚本的两个副本，命名为\
    \ `myscript.js` 和 `myscript-commented.js` 或类似的名称。\n\n我们将在第 20 章回到这个问题，届时我们将此讨论放在提高脚本速度和效率、以及减少其所需物理空间的一系列技术中。\n\
    \n## 调试脚本\n\n调试是发现并（希望）修复 bug 的过程。大多数浏览器都内置了某种错误报告功能，一些外部调试器也值得研究。\n\n## 理解浏览器内置的错误报告\n\
    \nOpera、Mozilla 浏览器（如 Firefox）和 Internet Explorer 均内置了相当不错的错误报告，但 Opera 和 Mozilla\
    \ 的调试工具最有用。\n\n- **Opera**：从“工具 (Tools) > 高级 (Advanced)”打开 JavaScript 控制台。你也可以通过“工具\
    \ (Tools) > 选项 (Preferences) > 内容 (Content)”，点击 JavaScript 按钮打开对话框，并勾选“错误时打开控制台\
    \ (Open console on error)”在发生错误时自动打开它。\n- **Firefox**：从“工具 (Tools) > 高级 (Advanced)”打开\
    \ JavaScript 控制台，取消勾选“禁用脚本 (Disable script)”，勾选“显示每个错误的通知 (Display a notification\
    \ about every error)”。\n- **Internet Explorer for Mac**：前往“选项 (Preferences) >\
    \ 选项 (Preferences) > 网络内容 (Web Content)”并勾选“显示报告警告 (Show reporting alerts)”。\n\
    - **Safari**：默认不包含错误报告，但最近版本有一个“秘密”调试（Debug）菜单，可以通过输入以下终端命令启用：\n```bash\n$ defaults\
    \ write com.apple.safari true\n```\n\n理解各种浏览器的控制台需要一些练习，因为每个浏览器提供的信息不同。这里有一个错误的示例——一个写错误的函数调用：\n\
    \n```javascript\nfunction saySomething(message) {\n  alert(message);\n}\nsaySomething('Hello\
    \ world');\n```\n\nFirefox 给出一个简洁但非常准确的错误报告，包含了错误发生的行号和描述，如图 1.1 所示。\n\n如图 1.2\
    \ 所示，Opera 提供了一个极其详尽的报告，包括到错误源头事件的回溯（backtrace）、发生行的号通知以及描述。当错误发生在最初由其他代码调用的代码时，回溯非常有帮助；例如，一个事件处理器调用了第二个函数，而错误正发生在这个点上。Opera\
    \ 的控制台会将此过程追溯到每个阶段，直到源头。\n\nInternet Explorer 提供了图 1.3 所示的相当基础的报告。它提供了解释器遇到错误的行号（这可能接近或不接近实际问题的真实位置）。Internet\
    \ Explorer 在定位外部文件中的错误方面特别糟糕。通常，它报告的行号实际上是脚本在 HTML 文件中加载的行号，以及错误类型的摘要，尽管它并没有解释错误本身的具体细节。\n\
    \n正如你可能猜到的那样，我对 Internet Explorer 的错误报告并不印象深刻，但它比比没有要好得多：至少你知道发生了错误。\n\n## 使用\
    \ alert\n\n`alert` 函数是分析错误的一种非常有用的手段——你可以在脚本的任何点使用它来探测对象和变量，查看它们是否包含数据。例如，如果你有一个多个条件分支的函数，你可以在每个条件内添加\
    \ `alert` 来找出是哪一个被执行了：\n\n```javascript\nfunction checkAge(years)\n{\n  if (years\
    \ < 13)\n  {\n    alert('less than 13');\n  }\n  else if (years >= 13 && years\
    \ <= 21)\n  {\n    alert('13 to 21');\n  }\n  else\n  {\n    alert('older');\n\
    \  }\n}\n```\n\n也许 `years` 的值没有像预期的那样返回数字。你可以在脚本开头添加一个 `alert` 来测试变量查看它是什么类型：\n\
    \n```javascript\nfunction checkAge(years)\n{\n  alert(typeof years);\n}\n```\n\
    \n在理论上，你可以在 `alert` 对话框中放入任何信息，尽管非常长的数据字符串可能会导致对话框过宽，使得部分信息被截断或超出窗口。你可以通过转义字符格式化输出（例如用于换行的\
    \ `\\n`）避免这种情况。\n\n## 使用 try-catch\n\n`try-catch` 结构是一种非常有用的方法，可以让脚本仅仅“尝试”某些操作，由你处理可能产生的任何错误。基本结构如下：\n\
    \n```javascript\ntry\n{\n  some code\n}\ncatch (err)\n{\n  如果 try{} 块产生错误，则运行此处代码\n\
    }\n```\n\n如果你不确定错误来自哪里，可以用 `try-catch` 包裹一大块代码，以捕获一般性失败，逐步缩小代码块范围，直到隔离出问题行。例如，你可以对函数的前半部分（在代码中方便的地方）包裹一个\
    \ `try` 括号，然后是后半部分，以查看错误发生在哪里；你可以再次在方便的地方划分可疑的半部分，并继续下去。\n\n"
