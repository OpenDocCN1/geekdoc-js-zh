    \ addLoadListener(fn) {\n  if (typeof window.addEventListener !== 'undefined')\
    \ {\n    window.addEventListener('load', fn, false);\n  } else if (typeof document.addEventListener\
    \ !== 'undefined') {\n    document.addEventListener('load', fn, false);\n  } else\
