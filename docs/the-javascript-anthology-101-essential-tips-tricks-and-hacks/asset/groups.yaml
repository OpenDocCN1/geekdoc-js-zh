- md: "\n## Writing to the Page or Window\n\nIf you're examining a great deal of data\
    \ while debugging, or you're dealing with data that's formatted in a complicated\
    \ way, it's often better to write data directly to a page or popup window than\
    \ to try to deal with lots of alert dialogs. If you're examining data in a loop,\
    \ in particular, you could end up generating hundreds of dialogs, each of which\
    \ you'll have to dismiss and manage—a very tedious process.\n\nIn these kinds\
    \ of situations, you can use an element's innerHTML property to write the data\
    \ to the page. Here's an example in which we build the list using an array (data),\
    \ then write it into a data\n\n```javascript\nvar test = document.getElementById('testdiv');\n\
    test.innerHTML += '<ul>';\nfor (var i = 0; i < data.length; i++) {\n  test.innerHTML\
    \ += '<li>' + i + ' = ' + data[i] + '</li>';\n}\ntest.innerHTML += '</ul>';\n\
    ```\n\nFile: debugging-writing.js (excerpt)\n\nWe can also write the data into\
    \ a popup, which is useful if there's no convenient place to put it on the page:\n\
    \n```javascript\nvar win = window.open('', win, 'width=320,height=240');\nwin.document.open();\n\
    win.document.write('<ul>');\nfor (var i = 0; i < data.length; i++) {\n  win.document.write('<li>'\
    \ + i + ' = ' + data[i] + '</li>');\n}\nwin.document.write('</ul>');\nwin.document.close();\n\
    ```\n\nFile: debugging-writing.js (excerpt)\n\nYou can format the output however\
    \ you like, and use it to structure data in any way that makes it easier for you\
    \ to find the error.\n\nWhen you're working with smaller amounts of data, you\
    \ can gain a similar advantage by writing the data to the main title element:\n\
    \n## Chapter 1: Getting Started with JavaScript\n\n```javascript\ndocument.title\
    \ = '0' + data[0];\n```\n\nThis final approach is most useful when tracking data\
    \ that changes continually or rapidly, as a value is being processed by a setInterval\
    \ function (an asynchronous timer we'll meet properly in Chapter 14).\n\n## Using\
    \ an External Debugger\n\nI can recommend two debuggers:\n\n- Venman9 for Mozilla\
    \ and Firefox\n- Microsoft Script Debugger10 for Windows Internet Explorer\n\n\
    External debuggers are a far more detailed way to analyze your scripts, and have\
    \ much greater capabilities than their in-browser counters. External debuggers\
    \ can do things like stopping the execution of the script at specific points,\
    \ or watching particular properties that you're informed of any change to them,\
    \ however it may be caused. They also include features that allow you “step through”\
    \ code line by line, in order to find errors that occur only briefly, or are otherwise\
    \ difficult to isolate.\n\nExternal debuggers are complex pieces of software,\
    \ and it can take time for developers to learn how to use them. They can be very\
    \ useful for highlighting logical errors, and valuable as learning tools in their\
    \ own right, but they're limited in their ability to help with browser incompatibilities:\
    \ they're only useful if the bug you're looking for is in the browser that the\
    \ debugger supports!\n\n## Strict Warnings\n\nIf you open the JavaScript console\
    \ in Firefox you'll see that it includes options to show Errors and Warnings.\
    \ Warnings notify you of code, though it is not erroneous per se, does by automatic\
    \ error handling, uses deprecated syntax, or is in some way untrue to the ECMAScript\
    \ specification.¹¹\n\nFor the example, the variable fruit is defined in the code\
    \ below:\n\n```javascript\n9 http://www.mozilla.org/projects/venman/\n10 http://msdn.microsoft.com/scripting/\n\
    11 To see these warnings, it may be necessary to enable script reporting by typing\
    \ in the address about:config and setting javascript.options.strict to true.\n\
    ```\n\n## Strict Warnings\n\n```javascript\nvar fruit = 'mango';\n\nif (basket.indexOf('apple')\
    \ != -1) {\n  var fruit = 'apple';\n}\n```\n\nWe should have omitted the second\
    \ var, because var is used to declare a variable for the first time, which we've\
    \ already done. Figure 1.4 shows how the JavaScript console will highlight our\
    \ error as a warning.\n\n## Figure 1.4. The JavaScript warnings console in Firefox\n\
    \n![](img/ea2a6d5786c46a059cd7778099fdcd56_50_0.png)\n\nThere are several coding\
    \ missteps that can cause warnings like this. For example:\n\n- re-declaring a\
    \ variable\n\nThis produces the warning, “redeclaration of var name,” as we just\
    \ saw.\n\n- failing to declare a variable in the first place\nThis oversights\
    \ the warning, “assignment to undeclared variable name.\"\n\nThis might arise,\
    \ for example, if the first line of our code read simply fruit = 'mango';\n\n\
    ## Chapter 1: Getting Started with JavaScript\n\n- assuming the existence of an\
    \ object\nThis assumption produces a warning \"reference to undefined property\
    \ name.\"\n\nFor example, a test condition like if (document.getElementById) assumes\
    \ the existence of the getElementById method, and banks on the fact that JavaScript's\
    \ automatic error-handling capabilities convert a nonexistent to false in browsers\
    \ which this method does not exist. To achieve the same end without seeing a warning,\
    \ we would be more specific, using if (typeof document.getElementById != 'undefined').\n\
    \nThere are also some function-related warnings, and a range of other warnings\
