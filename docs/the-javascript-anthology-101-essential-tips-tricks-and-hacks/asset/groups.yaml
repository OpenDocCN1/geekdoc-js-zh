    \n```\n<p id=\"*starLinks\">\n<a href=\"sirius.html\">Sirius</a>\n<a href=\"achanan.html\"\
    >Achanan</a>\n<a href=\"hadar.html\">Hadar</a>\n</p>\n```\n\nWe need to create\
    \ a new div, move each of the paragraph's children into it, then swap the new\
    \ element for the old:\n\n```\nvar div = document.createElement(\"div\");\nvar\
    \ paragraph = document.getElementById(\"starLinks\");\n\nfor (var i = 0; i < paragraph.childNodes.length;\
    \ i++) {\n  var clone = paragraph.childNodes[i].cloneNode(true);\n  div.appendChild(clone);\n\
    }\nparagraph.parentNode.replaceChild(div, paragraph);\n```\n\nThe only unfamiliar\
