  mdcn: "\n\n为没有 JavaScript 的用户提供服务（渐进增强）\n\n## 讨论\n\n处理这种情况的“传统”方法是用纯 JavaScript\
    \ 生成一个独立的动态菜单，并在 `noscript` 元素中包含回退内容：\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"menu.js\"></script>\n```\n\n```html\n<noscript>\n<ul>\n<li><a href=\"\
    /\">首页</a></li>\n<li><a href=\"/about\">关于</a></li>\n<li><a href=\"/contact\"\
    >联系我们</a></li>\n</ul>\n</noscript>\n```\n\n但是，正如我们已经看到的，大量的设备将无法通过这项测试，并不是因为 JavaScript\
    \ 支持已不再是一个“全有全无”的命题。上述方法为所有设备提供了默认内容，并且只有在脚本正常工作时才提供脚本功能。\n\n这种脚本方法通常被称为渐进增强（progressive\
    \ enhancement），它是我们在整本书中将使用的方法论。\n\n## 不要询问！\n\n![](img/ea2a6d5786c46a059cd7778099fdcd56_30_0.png)\n\
    \n这种技术或 `noscript` 元素都不应该用于添加类似“请开启 JavaScript 以继续”的消息。在最好的情况下，这种消息是自以为是的（“我为什么要这样做？”），最坏的情况下可能是没用的（“我做不到！”）或毫无意义的（“什么是\
    \ JavaScript？”）。就像写着“请升级您的浏览器”的启动页面对普通网页来说就像写着“请使用其他汽车”的路牌一样没用。\n\n偶尔，你可能会面临在没有\
    \ JavaScript 的提供等等功能的情况。在这种情况下，使用一个静态消息告知用户这种不兼容性（当然，是用非技术术语）是可以接受的。但在大多数情况下，除非是唯一的方法，否则请尽量避免提供此类消息。\n\
    \n订购本书的纸质版以获取全部 588 页！\n\n7\n\n## 将内容与行为分离（无干扰脚本）\n\n将内容与行为分离意味着将网页构建的不同维度分开。Jeffrey\
    \ Zelman（杰塞尔曼）著名地将其称为 Web 开发的“三脚架”——由内容（HTML）、表现（CSS）和行为（JavaScript）组成——这不仅强调了每个方面功能的差异，还强调了它们之间应该是相互分离的。\n\
    \n良好的分离使得网站更容易维护、更具访问性，并在旧或低配置的浏览器中实现良好的降级。\n\n## 解决方案\n\n在极端情况下（直接背离分离内容与行为的理念），我们可以在属性处理程序内部创建内联代码。这非常混乱，通常应该应该避免：\n\
    \n```html\n<div id=\"content\"\n  onmouseover=\"this.style.borderColor='red'\"\
    \n  onmouseout=\"this.style.borderColor='black'\">\n```\n\n我们可以通过将执行任务的代码提取并抽象为函数来改进这种情况：\n\
    \n```html\n<div id=\"content\"\n  onmouseover=\"changeBorder('red')\"\n  onmouseout=\"\
    changeBorder('black')\">\n```\n\n定义一个函数为我们工作，让我们能够将大部分代码放在单独的 JavaScript 文件中：\n\
    \n```javascript\nfunction changeBorder(element, to)\n{\n  element.style.borderColor\
    \ = to;\n}\n```\n\n> ³Zeldman, J. Designing with Web Standards. New Riders, 2003.\n\
    \n## 将内容与行为分离（无干扰脚本）\n\n但更好的方法是完全避免使用内联事件处理器。相反，我们可以利用文档对象模型（DOM）将事件处理器绑定到 HTML\
    \ 文档中的元素。DOM 是一种标准的编程接口，JavaScript 等语言可以通过它访问 HTML 文档的内容，从而消除了在 HTML 文档本身出现任何\
    \ JavaScript 代码的需求。在示例中，我们的 HTML 代码将如下：\n\n```html\n<div id=\"content\">\n```\n\
    \n这是我们将使用的脚本：\n\n```javascript\nfunction changeBorder(element, to) {\n  element.style.borderColor\
    \ = to;\n}\n\nvar contentDiv = document.getElementById('content');\n\ncontentDiv.onmouseover\
    \ = function() {\n  changeBorder('red');\n};\n\ncontentDiv.onmouseout = function()\
    \ {\n  changeBorder('black');\n}\n```\n\n这种方法允许我们在不编辑 HTML 的情况下添加、删除或更改事件处理器，由于文档本身完全不依赖或引用脚本，不理解\
    \ JavaScript 的浏览器将不受其影响。这种解决方案还提供了可重用的优势，因为我们可以根据需要将相同的函数绑定到其他元素上，而无需编辑 HTML。\n\
    \n该解决方案取决于我们通过 DOM 访问元素的能力，我们将在第 5 章中详细介绍。\n\n## 分离的好处\n\n> note 通过实践内容和行为的良好分离，我们不仅在平滑降级方面获得了实际益处，还从分离的角度思考获得了优势。由于我们\n\
    \n## 第 1 章：开始学习 JavaScript\n\nJavaScript 通过实践内容和行为的良好分离，我们不仅在平滑降级方面获得了实际益处，还从分离的角度思考获得了优势。由于我们……（注：原文后续存在大量重复文本，此处已按要求“不要重复输出原文”进行逻辑处理）\n\
    \n"
