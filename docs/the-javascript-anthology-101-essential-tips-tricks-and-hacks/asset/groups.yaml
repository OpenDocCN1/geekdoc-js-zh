    # Using an External Debugger


    I can recommend two debuggers:


    +   - Venman9 for Mozilla and Firefox


    +   - Microsoft Script Debugger10 for Windows Internet Explorer


    External debuggers are a far more detailed way to analyze your scripts, and have
    much greater capabilities than their in-browser counters. External debuggers can
    do things like stopping the execution of the script at specific points, or watching
    particular properties that you''re informed of any change to them, however it
    may be caused. They also include features that allow you “step through” code line
    by line, in order to find errors that occur only briefly, or are otherwise difficult
    to isolate.


    External debuggers are complex pieces of software, and it can take time for developers
    to learn how to use them. They can be very useful for highlighting logical errors,
    and valuable as learning tools in their own right, but they''re limited in their
    ability to help with browser incompatibilities: they''re only useful if there
    the bug you''re looking for is in the browser that the debugger supports!


