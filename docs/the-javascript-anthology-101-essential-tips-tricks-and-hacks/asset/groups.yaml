  - "[PAGE 63]\n\n# Specifying Namespaces in Documents with an XML MIME Type\n\nIf\
    \ you're coding JavaScript for use in documents with a MIME type of application/xhtml+xml\
    \ (or some other XML MIME type), you should use the method createElementNS, instead\
    \ of createElement, to specify the namespace for which you're creating the element:\n\
    \n```\nvar newAnchor = document.createElementNS(\n  \"http://www.w3.org/1999/xhtml\"\
    , \"a\");\n```\n\nThis distinction applies to a number of DOM methods, such as\
    \ removeElement/removeElementNS and getAttribute/getAttributeNS, however, we won't\
    \ see the namespace-enhanced versions of these methods in this book.\n\nSimon\
    \ Wilson provides a brief explanation of working with JavaScript and different\
    \ MIME types on his web site.\n\nThe text inside an element is actually a child\
