  }\n\nexports.add = addPlot;\n\nexports.getBoundingPlots = getBoundingPlots;\n\n\
  exports.removeAllPlots = removeAllPlots;\n```\n\n* * *\n\n到目前为止，地块模块看起来与区域模块类似。当你添加一个地块时，需要额外存储三个属性：\n\
  \n![Image](img/00002.jpeg) 地块编号（`.number` 属性）。每次添加新地块时，地块编号都会递增（增加 1）。存储对象的 `.plotCounter`\
