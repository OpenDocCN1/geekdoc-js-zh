  ```\n\n* * *\n\n`addZone()` 函数大大简化了，而 `getBoundingZones()` 函数现在调用 `region.getBoundingZones()`。完成重构后，你就可以开始处理玩家地块了。对于玩家地块，你需要能够执行以下几项操作。\n\
  \n![图片](img/00002.jpeg) 操作员需要能够创建地块。\n\n![图片](img/00002.jpeg) 玩家需要能够认领地块。\n\n![图片](img/00002.jpeg)\
