  雪球大战\n\n在彩色区域内：\n\n/jsp snowball\n\n这些告示牌是使用 Drone 的 `sign()` 函数创建的，该函数可以轻松制作带有信息的告示牌或悬挂式告示牌。\n\
  \n#### 保护竞技场\n\n竞技场使用 `zonemaker()` 函数进行保护，该函数接受三个参数：材质、宽度和长度。如果未提供材质，则区域会被保护，但不会放置边界方块。对于这个竞技场，你只需要保护它，不需要放置边界，因此调用方式如下：\n\
  \n点击此处查看代码图片\n\n```\nthis.zonemaker( null, 24, 32 );\n```\n\n当传入 `null` 而不是材质时，不会构建边界，但该区域会阻止非操作员破坏或放置方块。\n\
  \n### 让玩家轻松开始游戏\n\n\n\n\n创建了核心游戏代码和游戏场地后，下一步是添加一些简单的机制来启动和停止游戏以及选择队伍。Drone 的 `snowballArena()`\
  \ 函数不仅创建了游戏场地，还在场地外创建了一个等待区，该区域被划分为三个彩色区域——每个队伍一个。想要玩游戏的玩家只需移动到三个彩色区域之一——他们选择的区域很重要，因为一旦游戏开始，这将是他们所属的队伍。\n\
  \n等待区中的任何玩家都可以在至少有一个其他彩色区域有其他玩家时，通过发出以下命令来启动游戏：\n\n`/jsp snowball`\n\n让我们通过编写处理此命令的代码来完成游戏。在\
  \ `snowball` 文件夹中，创建一个名为 `command.js` 的新文件，并输入 **清单 19.3** 中所示的代码。\n\n此模块还使用了你在第\
  \ 18 章中开发的 `protection/region` 模块，以及你在本章前面开发的游戏模块。\n\n### 玩家在哪里？\n\n雪球命令首先检查调用该命令的玩家的位置。如果发出\
  \ `/jsp snowball` 命令的玩家不在三个彩色等待区之一，则游戏不会开始（你不希望任何人随意开始游戏——只有那些想玩游戏的人才能启动它）。你使用第\
  \ 18 章中的 `region.contains()` 函数来检查玩家是否位于三个彩色等待区之一。\n\n* * *\n\n**清单 19.3** 新命令 `/jsp\
  \ snowball`\n\n点击此处查看代码图片\n\n```\nvar region = require('protection/region');\nvar\
  \ fireworks = require('fireworks');\nvar utils = require('utils');\nvar cm = Packages.net.canarymod;\n\
  var cmLocation = cm.api.world.position.Location;\nvar game = require('./game');\n\
  var arenas = persist('snowball-arenas', []);\n\nfunction snowball( params, sender\
  \ ){\n  var duration = 60; // 秒\n  var i;\n  var arena = null;\n  var gameOn = false;\n\
  \  var allPlayers = utils.players();\n  var player;\n  var teams = {red: [], blue:[],\
  \ yellow:[]};\n  var spawns = [];\n  var spawn = null;\n\n  for ( i = 0; i < arenas.length;\
  \ i++ ) {\n    arena = arenas[i];\n    if ( region.contains(arena.redZone,sender.location)\n\
  \        || region.contains(arena.blueZone,sender.location)\n        || region.contains(arena.yellowZone,sender.location)\n\
  \       ) {\n      // 游戏开始！\n      gameOn = true;\n      break;\n    }\n  }\n\n\
  \  if (!gameOn){\n    echo( sender,\n        '你必须在一个彩色区域中发出此命令' );\n    return;\n\
  \  }\n\n  for (i = 0;i < allPlayers.length; i++) {\n    player = allPlayers[i];\n\
  \    var playerLoc = player.location;\n    inZone = false;\n    if (region.contains(\
  \ arena.redZone, playerLoc) ) {\n      teams.red.push( player.name );\n      inZone\
  \ = arena.redSpawn;\n    } else if ( region.contains( arena.blueZone, playerLoc)\
  \ ) {\n      teams.blue.push( player.name );\n      inZone = arena.blueSpawn;\n\
  \    } else if ( region.contains( arena.yellowZone, playerLoc) ) {\n      teams.yellow.push(\
  \ player.name );\n      inZone = arena.yellowSpawn;\n    }\n    if ( inZone ) {\n\
  \      var spawnLoc = new cmLocation( playerLoc.world,\n                       \
  \              inZone.x,\n                                     inZone.y,\n     \
  \                                inZone.z,\n                                   \
  \  0,\n                                     0);\n      spawns.push( {\n        participant:\
  \ player,\n        oldLocation: playerLoc,\n        newLocation: spawnLoc\n    \
  \  } );\n    }\n  }\n\n  if ( (teams.red.length == 0 && teams.blue.length == 0)\n\
  \      || (teams.red.length == 0 && teams.yellow.length == 0)\n      || (teams.blue.length\
  \ == 0 && teams.yellow.length == 0)\n     ) {\n    echo( sender,\n      '需要多于一个队伍才能开始游戏。'\
  \ +\n      '需要有人选择不同的颜色。');\n    return;\n  }\n\n  function returnPlayers( gameData,\
  \ winningTeam) {\n    var spawn;\n    for (var i = 0;i < spawns.length; i++) {\n\
  \      spawn = spawns[i];\n      var player = spawn.participant;\n      player.teleportTo(spawn.oldLocation);\n\
  \      if (gameData.teams[winningTeam].indexOf( '' + player.name) > -1) {\n    \
  \        fireworks.firework( spawn.oldLocation );\n      }\n    }\n  }\n\n  for\
  \ (i = 0;i < spawns.length; i++) {\n    spawn = spawns[i];\n    spawn.participant.teleportTo(spawn.newLocation);\n\
  \  }\n\n  game.SnowballFight(duration, teams, returnPlayers);\n}\n\ncommand( snowball\
  \ );\n```\n\n### 谁想玩？\n\n如果玩家在其中一个等待区，你会保留对该等待区场地的引用。然后你遍历服务器上的所有玩家，如果有任何玩家位于场地的某个彩色区域中，你就将他们添加到相应的队伍中。\n\
  \n点击此处查看代码图片\n\n```\nfor (i = 0;i < allPlayers.length; i++) {\n    player = allPlayers[i];\n\
  \    var playerLoc = player.location;\n    inZone = false;\n    if (region.contains(\
  \ arena.redZone, playerLoc) ) {\n      teams.red.push( player.name );\n      inZone\
  \ = arena.redSpawn;\n    } else if ( region.contains( arena.blueZone, playerLoc)\
  \ ) {\n      teams.blue.push( player.name );\n      inZone = arena.blueSpawn;\n\
  \    } else if ( region.contains( arena.yellowZone, playerLoc) ) {\n      teams.yellow.push(\
  \ player.name );\n      inZone = arena.yellowSpawn;\n    }\n    if ( inZone ) {\n\
  \      var spawnLoc = new cmLocation( playerLoc.world,\n                       \
  \              inZone.x,\n                                     inZone.y,\n     \
  \                                inZone.z,\n                                   \
  \  0,\n                                     0);\n      spawns.push( {\n        participant:\
  \ player,\n        oldLocation: playerLoc,\n        newLocation: spawnLoc\n    \
  \  } );\n    }\n  }\n```\n\n`spawns` 数组是一个列表，包含玩家及其在游戏开始前的位置。你需要保留这些位置列表，因为当游戏开始时，你会将玩家传送到场地内（见\
  \ **图 19.3**），并希望在游戏结束时将每个玩家送回他们原来的位置。每个场地还有三个重生点，游戏开始时玩家将被传送到这些点。\n\n![Image](img/00092.jpeg)\n\
  \n**图 19.3** 雪球大战等待区\n\n### 有多少队伍？\n\n接下来，雪球命令函数检查有多少队伍有玩家。如果只有一个队伍，则游戏不会开始。\n\n\
  点击此处查看代码图片\n\n```\nif ( (teams.red.length == 0 && teams.blue.length == 0)\n  ||\
  \ (teams.red.length == 0 && teams.yellow.length == 0)\n  || (teams.blue.length ==\
  \ 0 && teams.yellow.length == 0))\n{\n  echo(player, '需要多于一个队伍才能开始游戏。' +\n     \
  \      '需要有人选择不同的颜色。');\n  return;\n}\n```\n\n### 启动和停止游戏\n\n最后——假设发出命令的玩家想玩，并且有足够的队伍/玩家可以玩——你将玩家传送到场地内，并使用\
  \ `game.SnowballFight()` 函数开始游戏，该函数映射到本章前面定义的 `start()`。你还使用 `setTimeout()` 函数安排了一个延迟函数调用。当游戏结束时，`returnPlayers()`\
  \ 函数将被调用，并将每个玩家送回游戏开始前所在的等待区。获胜队伍的每个玩家上方会燃放烟花，这样所有玩家和观众都能知道哪支队伍赢得了比赛。\n\n### 总结\n\
  \n\n\n\n在本章中，你从零开始构建了一个玩家对战小游戏。你复用了之前章节中编写的许多函数，并充分利用了`Drone`对象来创建一个用于游戏的竞技场。这是本书中你为\
  \ Minecraft 添加的最复杂的新功能，但也是与朋友一起玩时非常有趣的一个功能。\n\n玩游戏很有趣，但编写自己的游戏会带来巨大的成就感，尤其是当你看到朋友们玩你创建的游戏时！\n\
  \n### 结论\n\n虽然本书到此结束，但你才刚刚开始探索 Minecraft 插件开发的世界。我写这本书的目的是为你提供一个坚实的基础，让你能够开始开发自己的\
  \ Minecraft 插件。我试图涵盖所有基础知识以及一些高级主题，并在此过程中提供示例。关于 Minecraft 插件开发还有很多需要学习的地方，但我希望这本书能给你信心，让你开始创建自己的插件。\n\
  \n写这本书的过程非常有趣，我希望你喜欢阅读它，并在此过程中学到一些编程知识。\n\n## 附录 A. ScriptCraft 变量\n\n在本附录中，我将介绍\
  \ ScriptCraft 提供的变量。\n\n### `server`变量\n\n`server`变量是 ScriptCraft 提供的全局变量。它引用`net.canarymod.api.Server`对象，这是一个代表\
  \ Minecraft 服务器的 Java 对象。有关此对象所有可用方法的完整详细信息，请参阅 *[`ci.visualillusionsent.net/job/CanaryLib/javadoc/net/canarymod/api/Server.html`](https://ci.visualillusionsent.net/job/CanaryLib/javadoc/net/canarymod/api/Server.html)*。\n\
  \n### `__plugin`变量\n\n这个全局变量是对 ScriptCraft 插件的引用。某些 CanaryMod API 方法需要一个`net.canarymod.plugin.Plugin`对象作为参数。如果你需要从\
  \ JavaScript 调用这些方法，应在需要`net.canarymod.plugin.Plugin`类型对象的地方提供`__plugin`变量。\n\n\
  ### `self`变量\n\n`self`变量是一个*短生命周期*变量，仅在执行`/js`命令期间短暂存在。`self`变量指的是*发送者*，即发出`/js`命令的玩家或控制台操作员。你绝不要在模块中使用`self`变量——*尤其是在多人模式下*！它不应在任何延迟执行的函数中使用，因为它在游戏内或服务器提示符的作用域之外不存在。\n\
  \n## 附录 B. 将 ScriptCraft 与其他插件一起使用\n\nScriptCraft 可用于与其他 CanaryMod 插件协作并控制它们。ScriptCraft\
  \ 与其他插件交互有两种方式：\n\n![Image](img/00003.jpeg) 通过发出插件命令\n\n![Image](img/00003.jpeg)\
  \ 通过使用插件的方法和类\n\n### 发出命令\n\n`server.executeVanillaCommand()`方法可用于发出内置命令（如`/time\
  \ set`）或插件提供的命令。ScriptCraft 可用于驱动其他插件提供的命令。\n\n许多插件提供自己的命令集，所有这些命令都可以由服务器发出。更多信息请参阅\
  \ *[`ci.visualillusionsent.net/job/CanaryLib/javadoc/net/canarymod/api/Server.html`](https://ci.visualillusionsent.net/job/CanaryLib/javadoc/net/canarymod/api/Server.html)*。\n\
  \n### 使用插件方法和类\n\n访问和使用另一个插件的另一种方式是通过你想要控制的插件提供的 Java 方法和类。你可以使用以下代码获取任何插件（将`otherPlugin`替换为你想要使用的插件名称）：\n\
  \n```\nvar Canary = Packages.net.canarymod.Canary;\nvar otherPlugin = Canary.manager().\n\
  getPlugin('otherPluginName');\n```\n\n一旦你获得了插件对象，就可以调用它的任何方法来与该插件协作。对于任何给定的插件，你需要参考该插件的\
  \ API 参考文档来查看有哪些可用方法。\n\n## 附录 C. 事件参考\n\n下表列出了事件模块中所有可用于注册事件监听器的函数。每个函数旁边都显示了等效的\
