  \ `scriptcraft/modules/protection/` 文件夹下新建一个名为 `plots.js` 的文件，并输入 **清单 18.8** 中的代码。\n\
  \n* * *\n\n**清单 18.8** 地块管理模块\n\n点击此处查看代码图片\n\n```\nvar region = require('./region');\n\
  \nvar store = persist('plots',{plotCounter: 1, plots: []});\n\nfunction addPlot(\
