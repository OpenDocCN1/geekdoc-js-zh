  \                                 team[i]);\n    player = server.getPlayer( team[i]\
  \ );\n    player.mode = cmCreative;\n    player.inventory.addItem( ball.type.id,\
  \ ball.amount,\n0 );\n  }\n}\n```\n\n启动游戏的下一步是遍历游戏中的所有队伍，并对每个队伍调用 `scoreboard.addTeam()`\
  \ 函数。`scoreboard.addTeam()` 函数接受两个参数：队伍名称和队伍颜色。由于在本游戏中，队伍以颜色命名，因此我们将队伍名称同时用作名称和颜色：\n\
  \n点击此处查看代码图片\n\n```\nscoreboard.addTeam( teamName, teamName );\n```\n\n### 显示分数\n\
  \n`updateScoreboard()` 函数在游戏开始时被调用一次。它也会在游戏过程中每秒从 `loop()` 函数内部被调用。\n\n### 结束游戏\n\
  \n`end()` 函数负责结束游戏。游戏开始时分配给玩家的所有雪球都会被移除。事件监听器被注销，每位玩家的主记分板被恢复。\n\n### 创建竞技场\n\n\
  到目前为止，你已经创建了一个供操作员使用的 JavaScript 函数，用于开始一场新的雪球大战游戏。游戏可以运行，但通过构建一个竞技场来增加趣味性，并让玩家能够轻松有趣地加入、开始游戏和选择队伍，可以使游戏更加有趣。让我们再次使用\
  \ Drone 来构建一个 24×24 格大小的雪地竞技场，并添加一些墙壁，使其成为一个有趣的游戏场所。竞技场将有一面玻璃墙，以便观众观看，并且在围墙竞技场外有三个大型彩色等候区，玩家只需在其中某个彩色区域等待即可选择队伍。整个竞技场和等候区将使用你在第\
  \ 18 章中开发的区域生成器和区域模块来防止破坏，因此如果你尚未添加该章节的保护模块，建议现在添加。\n\n稍后，你将添加功能，使任何在彩色区域等待的玩家都可以使用\
