  \n现在，让我们通过添加认领地块的函数来进一步充实地块模块。将 **清单 18.9** 中的代码添加到你的 `plots.js` 文件中。\n\n* * *\n\
  \n**清单 18.9** 认领地块\n\n点击此处查看代码图片\n\n```\nfunction claim( player, plotNumber) {\n\
