  \n**表 D.1** 物品参考\n\n## 附录 E. 函数声明与函数表达式\n\n在 JavaScript 中，定义函数的两种最常见方式是使用*函数声明*和*函数表达式*。函数声明如下所示：\n\
  \n```\nfunction myFunction(){\n\n}\n```\n\n而函数表达式如下所示：\n\n```\nvar myFunction =\
  \ function(){\n\n};\n```\n\n在本书中，我使用*函数声明*而不是*函数表达式*来定义函数。我这样做是因为：\n\n![Image](img/00002.jpeg)\
  \ 这是一本面向初学者的书。每当 JavaScript 中有两种或更多可能的方法来做某件事时，我努力只呈现最简单的方法，这样初学者就不会被 JavaScript\
  \ 灵活的语法所困扰。\n\n\n\n\n![图片](img/00002.jpeg) 函数声明*要求*函数必须有一个名称，而函数表达式则不需要。命名函数——即在定义时被赋予名称，而不仅仅是赋值给一个命名变量的函数——可以调用自身，因为其名称在函数体内保证在作用域内。无论函数是作为表达式还是声明定义，最佳实践都是为其命名。\n\
  \n![图片](img/00002.jpeg) 函数声明在输入时比等效的函数表达式略短。\n\n![图片](img/00002.jpeg) 命名函数在讨论递归主题时非常有用，并且在\
  \ ScriptCraft 中也被广泛使用。\n\n即使你在 JavaScript 编程中变得更加熟练后决定使用函数表达式，为函数命名也是一个好主意。\n\n\
