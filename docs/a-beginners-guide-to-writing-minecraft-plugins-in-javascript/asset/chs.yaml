  * * *\n\n### 重构\n\n在深入探讨创建、认领和共享玩家地块的机制之前，让我们思考一下什么是玩家地块，以及它与你已经创建的安全区域有何相似之处。区域和地块都是世界中的*区域*，其中适用某些规则。一个区域有一个起点，并沿两个方向（x\
  \ 轴和 z 轴）延伸。因此，区域和地块实际上只是土地的地块（或区域）。对于任何放置或破坏的方块，你需要测试该方块是否位于给定区域内。区域和地块之间会有很多共同点，所以让我们*重构*你已经编写的代码。*重构*是修改已编写代码的过程，使其更具可重用性。重构的目标是改进代码，避免重复编写相同的代码。接下来，你将把之前创建的\
  \ `zones.js` 模块中的一些代码提取出来，移到一个新的、更可重用的模块 `region.js` 中。在你的编辑器中，在 `scriptcraft/modules/protection/`\
  \ 文件夹中创建一个名为 `region.js` 的新文件，并编辑该文件，使其与 **清单 18.6** 中的代码一致。\n\n你会注意到 `create()`\
  \ 函数与 `zones.js` 模块中的 `addZone()` 函数类似。这是因为除了 `addZones()` 函数中的 `store.push(result);`\
  \ 语句在 `create()` 函数中不存在之外，它们是一样的。如果你想走捷径，我建议将 `addZone()` 函数的主体复制并粘贴到 `create()`\
  \ 函数中，然后从 `create()` 函数中删除 `store.push(result);` 这一行。`contains()` 函数可以直接从 `zones.js`\
  \ 文件复制到 `region.js` 文件中，无需修改。\n\n保存对 `region.js` 文件的更改后，编辑你的 `zones.js` 文件，使其看起来像\
  \ **清单 18.7**。\n\n* * *\n\n**清单 18.6** 区域管理模块\n\n点击此处查看代码图片\n\n```\nfunction create(\
  \ a, b ){\n\n  var result = {\n\n    startX: 0,\n\n    startZ: 0,\n\n    extentX:\
  \ 0,\n\n    extentZ: 0\n\n  };\n\n  if (a.x < b.x){\n\n    result.startX = a.x;\n\
  \n    result.extentX = (b.x - a.x);\n\n  } else {\n\n    result.startX = b.x;\n\n\
  \    result.extentX = (a.x - b.x);\n\n  }\n\n  if (a.z < b.z){\n\n    result.startZ\
  \ = a.z;\n\n    result.extentZ = (b.z - a.z);\n\n  } else {\n\n    result.startZ\
  \ = b.z;\n\n    result.extentZ = (a.z - b.z);\n\n  }\n\n  return result;\n\n}\n\n\
  function contains(region, location){\n\n  if ( ( location.x >= region.startX &&\n\
  \n         location.x <= (region.startX + region.extentX)\n\n       )\n\n      \
  \ &&\n\n       ( location.z >= region.startZ &&\n\n         location.z <= (region.startZ\
  \ + region.extentZ)\n\n       )\n\n     ) {\n\n    return true;\n\n  }\n\n  return\
  \ false;\n\n}\n\nfunction getBoundingRegions(regions, location ){\n\n  var i = 0;\n\
  \n  var result = [];\n\n  for (i = 0; i < regions.length; i++ ){\n\n    if ( contains(regions[i],\
  \ location) ){\n\n      result.push(regions[i]);\n\n    }\n\n  }\n\n  return result;\n\
  \n}\n\nexports.create = create;\n\nexports.contains = contains;\n\nexports.getBoundingRegions\
  \ = getBoundingRegions;\n```\n\n* * *\n\n**清单 18.7** 使用区域模块的区域\n\n点击此处查看代码图片\n\n\
  ```\nvar region = require('./region');\n\nvar store = persist( 'zones', [] );\n\n\
  function addZone( a, b ){\n\n  var result = region.create(a,b);\n\n  store.push(result);\n\
