  ```\n\n接下来，你检查放置方块的玩家是否为管理员。\n\n`isOp()`函数在玩家是管理员（拥有管理权限的玩家或控制台操作员）时返回`true`。\n\n\
  如果玩家是管理员，那么你不想干扰放置方块的正常事件流程；也就是说，你不想禁止管理员放置方块。\n\n最后，你使用`items.tnt()`函数，将材质作为参数传入，以测试该材质是否为\
  \ TNT。如果是，则取消该事件。\n\n### 禁止放置熔岩\n\n阻止放置熔岩的过程略有不同，但原理相同。如果事件涉及将熔岩倒入世界，则取消该事件。熔岩不是玩家可以手持的材质；相反，它是通过桶携带并倒出的。你要监听的事件不是*方块放置*，而是*物品使用*事件。在你的编辑器中，在`scriptcraft/plugins/protection`文件夹中创建一个名为`no-lava.js`的新文件，然后输入清单\
  \ 18.2 中的代码。\n\n* * *\n\n**清单 18.2** 阻止放置熔岩\n\n点击此处查看代码图片\n```\nvar items = require('items');\n\
  \nfunction noLava( event ){\n\n  if ( isOp( event.player) ) {\n\n    return;\n\n\
  \  }\n\n  if (items.lavaBucket( event.item ) ) {\n\n    event.setCanceled();\n\n\
  \  }\n\n}\n\nevents.itemUse( noLava );\n```\n\n* * *\n\n### 玩家地块\n\n阻止放置 TNT 和熔岩在一定程度上为玩家创建了一个安全的协作服务器。正如前面的示例所示，在创建一个不可能发生恶意破坏的安全环境时，你很容易做得过火，从而阻止任何玩家放置或移除方块。你真正想要的是能够创建*地块*，让玩家可以在其中建造，并与其他信任的玩家协作，而无需担心恶意破坏。\n\
  \n在本章的后续部分，你将开发一组函数，使管理员能够构建一个*安全区域*，在该区域内，除管理员外，任何人都不能放置或破坏方块。在这个安全区域内，将会有地块——小块土地——可以被玩家认领，认领后即可在上面建造。你还需要提供某种方式让玩家认领地块，并且需要维护一个玩家及其地块的注册表。你将设定每个玩家只能认领一个地块。\n\
  \n### 安全区域\n\n创建安全服务器的第一步是添加创建安全区域的能力。在这些安全区域之外，任何玩家都可以放置和破坏方块，但在安全区域内，只有管理员才能这样做。为了简单起见，你将安全区域定义为一个宽度和长度沿\
  \ y 轴无限延伸的区域。因此，一个区域只需使用三维空间中的两个点即可定义——左下角和右上角（图 18.1）：\n\n![Image](img/00087.jpeg)\n\
  \n**图 18.1** 安全区域\n\n安全区域从世界中的一个位置开始，沿 x 轴和 z 轴延伸，因此一个区域有一个起始位置和一个*范围*，即它延伸的距离。在测试被破坏或放置的方块是否在区域内时，你需要使用这些信息。你需要三个不同的组件来管理安全区域：\n\
  \n![Image](img/00002.jpeg) 一个模块，负责创建区域、存储区域（持久化），以及检查给定的方块或位置是否在安全区域内。\n\n![Image](img/00002.jpeg)\
  \ 一种轻松创建安全区域的方法。你将为第 12 章中讨论的`Drone`对象添加一个新扩展，以便无需直接处理位置即可创建区域。\n\n![Image](img/00002.jpeg)\
  \ 一些事件监听器，用于禁止在安全区域内放置和破坏方块。\n\n第一步是创建一个共享模块。打开编辑器，如果`scriptcraft/modules`文件夹中还没有`protection`文件夹，则创建一个。在该文件夹中创建一个名为`zones.js`的新文件，并输入清单\
  \ 18.3 中的代码。\n\n该模块允许你添加区域，这些区域将在启动时（或首次使用模块时）加载，并在服务器关闭时自动保存。\n\n* * *\n\n**清单\
  \ 18.3** 安全区域管理模块\n\n点击此处查看代码图片\n```\nvar store = persist( 'zones', [] );\n\nfunction\
  \ addZone( a, b ){\n\n  var result = {\n\n    startX: 0,\n\n    startZ: 0,\n\n \
  \   extentX: 0,\n\n    extentZ: 0\n\n  };\n\n  if (a.x < b.x){\n\n    result.startX\
  \ = a.x;\n\n    result.extentX = (b.x - a.x);\n\n  } else {\n\n    result.startX\
  \ = b.x;\n\n    result.extentX = (a.x - b.x);\n\n  }\n\n  if (a.z < b.z){\n\n  \
  \  result.startZ = a.z;\n\n    result.extentZ = (b.z - a.z);\n\n  } else {\n\n \
  \   result.startZ = b.z;\n\n    result.extentZ = (a.z - b.z);\n\n  }\n\n  store.push(result);\n\
  \n  return result;\n\n}\n\nfunction contains( zone, location){\n\n  if ( ( location.x\
  \ >= zone.startX &&\n\n         location.x <= (zone.startX + zone.extentX)\n\n \
  \      )\n\n       &&\n\n       ( location.z >= zone.startZ &&\n\n         location.z\
  \ <= (zone.startZ + zone.extentZ)\n\n       )\n\n     ) {\n\n    return true;\n\n\
  \  }\n\n  return false;\n\n}\n\nfunction getBoundingZones( location ){\n\n  var\
  \ i = 0;\n\n  var result = [];\n\n  var zone = null;\n\n  for (i = 0; i < store.length;\
  \ i++ ){\n\n    zone = store[i];\n\n    if (contains( location, zone ) ){\n\n  \
  \    result.push(zone);\n\n    }\n\n  }\n\n  return result;\n\n}\n\nexports.add\
  \ = addZone;\n\nexports.getBoundingZones = getBoundingZones;\n```\n\n* * *\n\n持久化对于安全区域来说绝对是必要的——你希望它们能够持久存在。模块的`add()`函数接受两个参数，两者均为`net.canarymod.api.world.position.Location`类型，并存储它们的二维坐标（`x`和`z`属性）。另一个函数`getBoundingZones()`将返回给定位置所包含的所有区域列表。区域可以重叠，因此一个位置可能位于多个安全区域内。\n\
  \n\n\n\n接下来，让我们创建一个名为 `zonemaker()` 的新 Drone 扩展。在你的编辑器中，切换到 `scriptcraft/plugins`\
  \ 文件夹，并创建另一个名为 `protection` 的子文件夹；然后创建一个名为 `zonemaker.js` 的新文件，并输入 **清单 18.4** 中的代码。\n\
  \n正如你在第 12 章中所见，可以扩展 `Drone` 对象来构建任何你想要的东西。在这里，你想要构建一个边界框，除了操作员之外，任何人都不能在其中放置或破坏方块。除了用你选择的任何材料构建边界框外，`zonemaker()`\
  \ 函数还会获取 `Drone` 的起始位置和最远角落位置，并调用 `zones.add()` 函数来添加一个新的安全区域。保存此文件（以及 `zones.js`\
  \ 文件）后，你可以通过重新加载插件（使用 `/js refresh()` 命令）来测试它，然后在游戏内提示符下，指向地面并输入以下命令：\n\n点击此处查看代码图片\n\
  \n`/js zonemaker( blocks.brick.chiseled, 20 , 20 )`\n\n* * *\n\n**清单 18.4** 基于 Drone\
  \ 的区域创建器\n\n点击此处查看代码图片\n\n```\nvar Drone = require('../drone/drone').Drone;\n\n\
  var zones = require('protection/zones');\n\nfunction zonemaker( material, width,\
  \ length ) {\n\n  var startLoc = this.getLocation();\n\n  this.chkpt('zonemaker');\n\
  \n  if (material != null){\n\n    this.box0( material ,width, 1, length);\n\n  }\n\
  \n  var endLoc = this.fwd(length - 1).right(width - 1).getLocation();\n\n  zones.add(startLoc,endLoc);\n\
  \n  this.move('zonemaker');\n\n}\n\nDrone.extend(zonemaker);\n```\n\n* * *\n\n应该会出现一个类似于\
  \ **图 18.2** 所示的边界框。\n\n![图片](img/00088.jpeg)\n\n**图 18.2** 一个安全区域（带边框）\n\n目前，你仍然可以在该区域内破坏和放置方块。下一步“保护”安全区域是添加事件处理程序，以禁止放置和破坏方块。在你的编辑器中，在\
  \ `scriptcraft/plugins/protection/` 文件夹中创建一个名为 `events.js` 的新文件，并输入 **清单 18.5**\
  \ 中的代码。\n\n在清单 18.5 中，你监听两个事件，如果被放置或破坏的方块位于安全区域内，则取消这些事件。如果玩家是操作员，则立即返回，因为操作员应该能够放置和破坏方块。保存这些文件，然后使用\
  \ `/js refresh()` 命令重新加载插件。接着，暂时对自己使用 `/deop`，并尝试在你之前创建的安全区域内放置或破坏方块。你应该无法做到。当你确认非操作员玩家无法破坏方块后，通过在服务器控制台提示符下输入\
  \ `/op` 命令重新启用你的操作员权限。\n\n到目前为止，你已经有一种创建安全区域的方法，非操作员无法在其中破坏或放置方块。接下来需要做的是提供一种方法，在这个安全区域内创建玩家地块，玩家在认领地块后可以在此建造。\n\
  \n* * *\n\n**清单 18.5** 保护的事件处理\n\n点击此处查看代码图片\n\n```\nvar zones = require('protection/zones');\n\
  \nfunction onPlace( event ) {\n\n  if ( isOp(event.player) ) {\n\n    return;\n\n\
  \  }\n\n  var block = event.blockPlaced;\n\n  var boundingZones = zones.getBoundingZones(block.location);\n\
  \n  if (boundingZones.length == 0){\n\n    return;\n\n  }\n\n  event.setCanceled();\n\
