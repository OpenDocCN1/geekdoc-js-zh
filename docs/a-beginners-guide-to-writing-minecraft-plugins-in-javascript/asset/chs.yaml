  \ [TAB]`\n\n如果你在输入 `/jsp share` 后按空格键再按 Tab 键，你会注意到玩家名称列表会作为命令的可能补全项显示出来。\n\n###\
  \ 动态命令选项\n\n我已经介绍过 `command()` 函数，包括如何使用它来添加供玩家使用的新自定义命令，以及如何为其提供用于 Tab 补全的选项列表。`command()`\
  \ 函数既可以接受静态选项列表（如之前在第 15 章中的 `icecream` 和 `chatcolor` 示例所示），也可以接受另一个函数作为参数。如果 options\
  \ 参数是一个列表，则该列表将用于 Tab 补全。如果 options 参数是一个函数，则该函数将被执行，并应返回一个用于 Tab 补全的字符串列表。在清单 18.14\
  \ 中，你将 `utils.playerNames` 函数作为第二个参数传递给 `command()`。这意味着每当玩家执行 `/jsp share` 命令并按下空格键后跟\
  \ Tab 键时，都会调用 `utils.playerNames()` 函数。如果你无法预先知道自定义命令的可能选项，那么提供一个在玩家执行命令时返回选项列表的函数是可行的方法。在前面的示例中，你无法预知执行命令时有哪些玩家在线，因此提供静态的玩家名称列表是行不通的。这就是为什么你将\
  \ `utils.playerNames` 函数作为第二个参数传递。\n\n### 更新事件处理以容纳受信任的玩家\n\n接下来，你必须更新与保护相关的事件处理代码。你希望允许玩家在位于领地内且在该领地的\
  \ `.sharedWith` 列表中时放置或破坏方块。打开 `scriptcraft/plugins/protection/events.js` 文件，添加新的\
  \ `playerIsTrusted()` 函数，并更新 `playerCanBuild()` 函数，如 **清单 18.15** 所示。\n\n* * *\n\
  \n**清单 18.15** 受信任玩家的事件处理\n\n点击此处查看代码图片\n\n```\n/*\n\n 玩家能否在某个位置建造？\n\n*/\n\nfunction\
  \ playerCanBuild( player, location ) {\n\n  // 检查玩家是否在该位置拥有领地\n\n  // 或者是否受信任\n\n\
    var result = playerOwnsPlot( player, location ) ||\n\n    playerIsTrusted( player,\
  \ location );\n\n  return result;\n\n}\n\nfunction playerIsTrusted( player, location)\
  \ {\n\n  var playerName = ''+ player.name;\n\n  var boundingPlots = plots.getBoundingPlots(\
  \ location );\n\n  for (var i = 0;i < boundingPlots.length; i++){\n\n    var plot\
  \ = boundingPlots[i];\n\n    var sharedWith = plot.sharedWith;\n\n    if (!sharedWith\
  \ ) {\n\n      continue;\n\n    }\n\n    for (var j = 0; j < sharedWith.length;\
  \ j++){\n\n      if (sharedWith[j] == playerName){\n\n        return true;\n\n      }\n\
  \n    }\n\n  }\n\n  return false;\n\n}\n```\n\n* * *\n\n在这个修订版的 `events.js` 文件中，有一个新的\
  \ `playerIsTrusted()` 函数。如果玩家被信任可以在领地上工作，该函数返回 `true`。这个函数中有两个值得注意的地方。第一个是你如何使用玩家的名称来测试玩家是否在\
  \ `sharedWith` 列表中。\n\n#### Java 字符串与 JavaScript 字符串\n\nJavaScript 中的 `String` 类型和\
  \ Java 中的 `String` 类型——它们名称相同——但略有不同，因此有些操作可以用 JavaScript 字符串完成，但不能用 Java 字符串，反之亦然。当比较两个字符串——一个是\
  \ JavaScript `String` 类型，另一个是 Java `String` 类型时——最安全的方法是将 Java 字符串转换为 JavaScript\
  \ 字符串。将 Java 字符串转换为 JavaScript 字符串最简单的方法是在 Java 字符串前面插入一个空的 JavaScript 字符串，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nvar jsString = '' + javaString;\n```\n\n这就是你在 `playerIsTrusted()`\
  \ 函数的第一个语句中所做的：\n\n点击此处查看代码图片\n\n```\nvar playerName = '' + player.name;\n```\n\n\
  这将 `player.name` 的值赋给一个名为 `playerName` 的新 JavaScript 变量。`player` 变量是一个 Java 对象，因此它的所有\
  \ `String` 属性都是 Java 字符串。Java 在不同平台和版本上比较 Java 和 JavaScript 字符串时的行为并不一致，因此如果你想要比较字符串或使用标准的\
  \ JavaScript 字符串操作，应该通过在 Java 字符串前面加上 `''`（一个空的 JavaScript 字符串）来将其转换为 JavaScript\
  \ 字符串。\n\n#### 循环中的循环\n\n\n\n\n关于 `playerIsTrusted()` 函数，第二点需要注意的是它使用了嵌套循环。**嵌套**循环就是循环中的循环。在这个例子中，你遍历所有地块，对于每个地块，再遍历该地块的所有受信任玩家。\n\
  \n点击此处查看代码图片\n\n```\nfor (var i = 0;i < boundingPlots.length; i++){\n  var plot\
  \ = boundingPlots[i];\n  var sharedWith = plot.sharedWith;\n  if (!sharedWith )\
  \ {\n    continue;\n  }\n  for (var j = 0; j < sharedWith.length; j++){\n    if\
  \ (sharedWith[j] == playerName){\n      return true;\n    }\n  }\n}\n```\n\n在最内层循环中，你使用了与最外层循环不同的循环变量。最外层循环使用\
  \ `i` 变量作为索引和计数器，而最内层循环使用 `j` 变量。这一点很重要。当你有嵌套循环时，必须小心不要在内部循环中重复使用外部循环的索引变量。这是一个常见的错误——我在编写这段代码时也犯过。\n\
  \n嵌套循环可以有任意多层，但如果你发现自己编写的函数包含多层嵌套循环，就应该考虑重构该函数，使其更易于阅读和理解。\n\n### 总结\n\n在本章中，我逐步引导你完成了为服务器添加保护的过程。从你使用的代码量和文件数量可以看出，保护服务器并非易事！然而，如果你将问题分解成更小的问题，并逐一解决，就会变得更容易。编程是一个迭代过程——你编写一些代码，测试它，边进行边修改，逐步改进代码，一点一点地添加新功能，直到它达到你想要的效果。在本章中，你反复回顾了之前编写的代码，每次都逐步改进和添加内容。这就是编程的典型方式。即使是世界上最好的程序员，也不可能第一次就得到完美的解决方案！\n\
  \n虽然本章创建的代码并非一个全面的保护插件，但它为构建功能更完善的服务保护插件提供了良好的基础。要使这个插件更好，还需要解决一些突出的功能，比如地块被遗弃后应该如何处理？目前，玩家无法判断一个带有建筑的地块是否已被遗弃。理想情况下，当地块被遗弃时，应该放置一个标志，上面写着“此地块可用”。这只是众多可能的改进之一；我相信你还能想到更多！\n\
  \n## 第 19 章 打雪仗！\n\n在本章中，你将创建一个名为“打雪仗”的玩家对战小游戏（见**图 19.1**）。游戏的目标是尽可能多地用雪球击中对手，同时避免自己被击中或击中自己队伍的成员。在游戏中，玩家可以组成对抗队伍。\n\
  \n![图片](img/00090.jpeg)\n\n**图 19.1** 打雪仗\n\n为了提供示例代码，游戏将保持简单，你可以根据自己的需求进行调整和扩展，创建自己的小游戏。\n\
  \n游戏将通过一个 JavaScript 函数启动，其持续时间和队伍结构将作为参数传递。如果没有传递参数，则默认游戏持续时间为 60 秒，每个玩家将被分配到三个队伍之一。\n\
  \n首先，我将在一个 JavaScript 模块中呈现游戏，其中包含一个供操作员用来启动游戏的函数。在本章后面，我将介绍玩家如何通过游戏内机制启动游戏。我还将介绍如何为游戏创建竞技场，以及玩家用来启动游戏的命令。\n\
  \n### 游戏规则\n\n在开始编码之前，我们先制定一些打雪仗小游戏的规则。\n\n**1.** 游戏开始时，每个玩家将获得一定数量的雪球。\n\n**2.**\
  \ 每个玩家都是一个队伍的成员。最多可以有三个队伍：红队、蓝队和黄队。每个玩家的名字以其队伍的颜色显示。\n\n**3.** 如果玩家击中对手，则获得一分。\n\
  \n**4.** 如果玩家击中自己队伍的成员，则扣一分。\n\n**5.** 游戏期间将显示玩家及其得分的记分板。\n\n**6.** 游戏结束时，记分板将在屏幕上停留几秒钟，以便玩家查看每个队伍的最终得分。获胜队伍上方将燃放烟花。\n\
  \n### 后勤保障\n\n为了让游戏顺利进行，玩家应该彼此靠近。在本章后面，你将构建一个特殊的游戏竞技场，使其更有趣。Minecraft 小游戏的许多乐趣来自于游戏的期待感和围绕它的仪式感。例如，许多玩家对战小游戏都有一个等待区，玩家在那里等待进入小游戏，或在游戏开始前选择参与队伍。启动游戏的机制因小游戏而异。最初，你将保持简单——只有操作员可以使用\
  \ `/js SnowballFight()` 命令启动打雪仗小游戏。稍后你将改进游戏，使任何玩家都可以启动。\n\n### 计分\n\n在第 11 章中，你使用\
  \ JavaScript 数组创建了一个简单的排行榜，按玩家跳跃次数排序。Minecraft 有一些内置命令，可以让你轻松创建并显示一个带有排行榜（即*记分板*）的游戏内半透明侧边栏。\n\
  \n#### `/scoreboard` 命令\n\n`/scoreboard` 命令提供了一种简洁的方式，用于指定在游戏内列表视图、侧边栏视图以及玩家头顶上方显示的内容。例如，回顾前一章的排行榜代码，你可以使用\
  \ Minecraft 中的以下内置命令显示相同的排行榜：\n\n点击此处查看代码图片\n\n```\n/scoreboard objectives add Jumping\
  \ stat.jump\n/scoreboard objectives setdisplay sidebar Jumping\n```\n\n请注意，一旦运行这些命令，无论你或服务器上的任何其他玩家何时跳跃，记分板都会更新。\n\
  \n这是一个非常棒的功能，你肯定会在打雪仗游戏中使用它。\n\n#### 从 JavaScript 执行命令\n\n可以使用 `server.dispatchCommand()`\
  \ 方法从 JavaScript 执行任何内置命令。要执行上面提到的记分板命令，你可以使用以下代码：\n\n点击此处查看代码图片\n\n```\nserver.executeVanillaCommand(server,\n\
  \  'scoreboard objectives add Jumping stat.jump');\nserver.executeVanillaCommand(server,\n\
  \  'scoreboard objectives setdisplay sidebar Jumping');\n```\n\n当你想要从 JavaScript\
  \ 调用内置命令或其他插件提供的命令时，`server.executeVanillaCommand()` 方法非常有用。附录中包含了更多关于通过 JavaScript\
  \ 使用其他插件的信息。\n\n#### ScriptCraft 的记分板模块\n\nScriptCraft 提供了一个用于处理记分板的模块。我们将使用这个模块在游戏开始时添加队伍，并在游戏过程中更新分数。\n\
  \n### 游戏源代码\n\n我们要讲的内容很多，所以让我们直接开始编写核心游戏代码。在你的编辑器中，在 `scriptcraft/plugins/` 文件夹中创建一个名为\
  \ `snowball` 的新文件夹。在 `snowball` 文件夹中，创建一个名为 `game.js` 的新文件，并输入**清单 19.1**中所示的代码。\n\
  \n* * *\n\n**清单 19.1** 打雪仗核心游戏源代码\n\n点击此处查看代码图片\n\n```\nvar items = require('items');\n\
  var utils = require('utils');\nvar scoreboard = require('minigames/scoreboard');\n\
  var cm = Packages.net.canarymod;\nvar cmSnowball = cm.api.entity.EntityType.SNOWBALL;\n\
  var cmCreative = cm.api.GameMode.CREATIVE;\n\nfunction start( duration, teams, onGameOver\
  \ ) {\n  var players;\n  var i;\n```\n\n\n\n\n```javascript\nvar game;\n\nvar teamName;\n\
  \nvar ball;\n\nif ( typeof duration == 'undefined' ) {\n\n  duration = 60;\n\n}\n\
  \nif ( typeof teams == 'undefined' ) {\n\n  teams =  {};\n\n  players = utils.players();\n\
  \n  var teamNames = ['red','blue','yellow'];\n\n  var playerCount = players.length;\n\
  \n  for ( i = 0; i < playerCount; i++ ) {\n\n    var playerName = players[i].name;\n\
  \n    teamName = teamNames[ i % playerCount ];\n\n    if (teams[ teamName ] == undefined){\n\
  \n      teams[ teamName ] = [];\n\n    }\n\n    teams[ teamName ].push(playerName);\n\
  \n  }\n\n}\n\ngame = {\n\n  teams: teams,\n\n  duration: duration,\n\n  teamScores:\
  \ {},\n\n  eventListener: null,\n\n  onGameOver: onGameOver\n\n};\n\nfunction loop(){\n\
  \n  if ( game.duration-- ){\n\n    updateScoreboard( game );\n\n    setTimeout(\
  \ loop, 1000 );\n\n  } else {\n\n    end( game );\n\n  }\n\n}\n\nfunction onSnowballHit(\
  \ event ) {\n\n  var snowball = event.projectile;\n\n  if (snowball.entityType !=\
  \ cmSnowball ){\n\n    return;\n\n  }\n\n  var thrower = snowball.thrower;\n\n \
  \ //var thrower = snowball.handle.j().getCanaryEntity();\n\n  var damaged = event.entityHit;\n\
  \n  if (damaged == null){\n\n    // snowball did not hit another player\n\n    return;\n\
  \n  }\n\n  var throwerTeam = getPlayerTeam( thrower, game.teams );\n\n  var damagedTeam\
  \ = getPlayerTeam( damaged, game.teams );\n\n  if ( !throwerTeam || !damagedTeam\
  \ ) {\n\n    return; // thrower/damagee wasn't in game\n\n  }\n\n  if ( throwerTeam\
  \ != damagedTeam ) {\n\n    game.teamScores[ throwerTeam ]++;\n\n  } else {\n\n\
  \    game.teamScores[ throwerTeam ]--;\n\n  }\n\n} // end onSnowballHit\n\nscoreboard.create('snowball',\
  \ 'Snowball Fight!');\n\nball = items.snowBall(1);\n\nfor ( teamName in game.teams\
  \ ) {\n\n  scoreboard.addTeam( teamName, teamName );\n\n  game.teamScores[ teamName\
  \ ] = 0;\n\n  team = game.teams[ teamName ];\n\n  for ( i = 0; i < team.length;\
  \ i++ ) {\n\n    scoreboard.addPlayerToTeam( 'snowball', teamName, team[i]);\n\n\
  \    player = server.getPlayer( team[i] );\n\n    player.mode = cmCreative;\n\n\
  \    player.inventory.addItem( ball.type.id, ball.amount, 0 );\n\n  }\n\n}\n\nupdateScoreboard(game);\n\
  \ngame.eventListener = events.projectileHit( onSnowballHit );\n\nsetTimeout(loop,\
  \ 1000);\n\n}\n\nfunction updateScoreboard( game ) {\n\nvar teamName;\n\nvar team;\n\
  \nvar teamScore;\n\nvar i;\n\nfor (teamName in game.teamScores) {\n\n  teamScore\
  \ = game.teamScores[ teamName ];\n\n  team = game.teams[ teamName ];\n\n  for (i\
  \ = 0;i < team.length; i++){\n\n    scoreboard.updateScore( 'snowball', team[i],\
  \ teamScore);\n\n  }\n\n}\n\n}\n\nfunction end( game ) {\n\nvar teamName;\n\nscoreboard.remove('snowball');\n\
  \nvar winningTeam;\n\nvar highestScore = 0;\n\nfor ( teamName in game.teams ) {\n\
  \n  if (game.teamScores[teamName] > highestScore){\n\n    highestScore = game.teamScores[teamName];\n\
  \n    winningTeam = teamName;\n\n  }\n\n  scoreboard.removeTeam( teamName );\n\n\
  }\n\nserver.broadcastMessage('The ' + winningTeam + ' team won!');\n\ngame.eventListener.unregister();\n\
