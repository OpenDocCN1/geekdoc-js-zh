  \ null;\n\n}\n\nfor ( teamName in teams ) {\n\n  team = teams[ teamName ];\n\n \
  \ for ( i = 0; i < team.length; i++ ) {\n\n    if ( team[i] == player.name ) {\n\
  \n      return teamName;\n\n    }\n\n  }\n\n}\n\nreturn null;\n\n}\n\nexports.SnowballFight\
  \ = start;\n```\n\n* * *\n\n### 运行游戏\n\n保存文件后，使用 `/js refresh()` 命令重新加载插件。然后，当有两名或更多玩家连接到服务器时，执行以下命令：\n\
  \n`/js SnowballFight()`\n\n游戏将开始。每位玩家会获得一定数量的雪球，一旦有玩家用雪球击中另一名玩家，记分板就会更新。小游戏中的每位参与者都能看到记分板。游戏将持续\
  \ 60 秒。游戏结束时，记分板会保留几秒钟，让胜利者享受这一刻。\n\n### 分配队伍\n\n小游戏通过 `start()` 函数创建，该函数接受三个参数：`duration`、`teams`\
  \ 和 `onGameOver`。如果未提供 `duration` 和 `teams` 参数，则默认时长为 60 秒，队伍由服务器上的所有玩家组成。`start()`\
  \ 函数中的以下代码段创建了最多三个队伍，每位玩家依次被分配到某个队伍：\n\n点击此处查看代码图片\n\n```javascript\nif ( typeof\
  \ teams == 'undefined' ) {\n\n    teams =  {};\n\n    players = utils.players();\n\
  \n    var teamNames = ['red','blue','yellow'];\n\n    var playerCount = players.length;\n\
  \n    for ( i = 0; i < playerCount; i++ ) {\n\n      var playerName = players[i].name;\n\
  \n      teamName = teamNames[ i % playerCount ];\n\n      if (teams[ teamName ]\
  \ == undefined){\n\n        teams[ teamName ] = [];\n\n      }\n\n      teams[ teamName\
  \ ].push(playerName);\n\n    }\n\n  }\n```\n\n如果游戏开始时在线玩家有八位，`teams` 对象可能看起来像这样：\n\
  \n点击此处查看代码图片\n\n```javascript\n{\n\n   red: ['sean', 'moe', 'curly'],\n\n   blue:\
  \ ['walter', 'larry', 'oliver'],\n\n   yellow: ['john', 'paul']\n\n}\n```\n\n在这个游戏中，理想情况下最多只有三个队伍，每个队伍的名称是以下三种颜色之一：红色、蓝色、黄色。尽量避免使用绿色和红色队伍，因为某些玩家可能难以区分这些颜色。每位玩家的名字会以其队伍的颜色显示，以便玩家更容易分辨谁是敌人，谁是自己人。接下来，创建一个名为\
  \ `game` 的变量，用于存储游戏状态，并会传递给模块中的其他函数。\n\n### 游戏循环\n\n`loop()` 函数通过 `setTimeout()`\
  \ 函数每秒调用一次，它会将游戏的持续时间计数器减 1，更新记分板，并在 1 秒后再次调度自身。如果游戏的持续时间计数器为 0，则表示时间已到，游戏结束，此时会调用\
  \ `end()` 函数。\n\n### 作用域与函数\n\n你可能想知道为什么 `loop()` 函数要声明在 `start()` 函数内部。`loop()`\
  \ 函数必须声明在 `start()` 函数内部，因为它需要使用 `game` 变量。由于 `game` 变量和 `loop()` 函数都声明在 `start()`\
  \ 函数内部，因此 `loop()` 函数可以访问 `game` 变量。如果 `loop()` 函数声明在 `start()` 函数外部，它将无法访问 `game`\
  \ 变量，因为变量对其声明所在的函数是私有的。通常，你会将 `loop()` 函数声明在 `start()` 函数外部，并将 `game` 变量作为参数传递，但这里你通过\
  \ `setTimeout()` 调用来调度 `loop()`。实际上，在 JavaScript 中有几种处理作用域和函数的方法，但我认为将 `loop()`\
  \ 函数声明在 `start()` 函数内部，使其能够访问并操作 `game` 变量，是最简单的方法。\n\n### 监听雪球击中事件\n\n接下来，声明一个新的事件处理函数\
  \ `onSnowballHit()`，它将在每次发生 `projectile hit` 事件时被调用。`events.projectileHit()` 函数可用于监听游戏中的抛射物击中事件。在你的场景中，你只关心小游戏参与者投掷的雪球。`getPlayerTeam()`\
  \ 函数会返回玩家所属的队伍。如果投掷者和被击中的玩家不在同一队伍，则投掷者所在队伍的得分增加；否则，得分减少。\n\n点击此处查看代码图片\n\n```javascript\n\
  if ( throwerTeam != damagedTeam ) {\n\n  game.teamScores[ throwerTeam ]++;\n\n}\
  \ else {\n\n  game.teamScores[ throwerTeam ]--;\n\n}\n```\n\n### 开始游戏\n\n\n\n\n\
  `start()` 函数的主体部分位于模块末尾。以下三条语句负责启动游戏、监听事件以及启动游戏循环：\n\n点击此处查看代码图片\n\n```\ngame.eventListener\
  \ = events.projectileHit( onSnowballHit );\nsetTimeout(loop, 1000);\n```\n\n`start()`\
  \ 函数负责初始化游戏的记分板和队伍分数，并为每位玩家分配雪球。\n\n### 初始化并更新记分板\n\n`start()` 函数中的第一组语句使用记分板模块的\
  \ `create()` 函数来初始化小游戏的记分板、添加队伍和队员，并为每位玩家分配雪球。每位玩家被设置为创造模式，以便在游戏过程中拥有无限数量的雪球。\n\n\
  点击此处查看代码图片\n\n```\nscoreboard.create('snowball', 'Snowball Fight!');\nball = items.snowBall(1);\n\
  for ( teamName in game.teams ) {\n  scoreboard.addTeam( teamName, teamName );\n\
