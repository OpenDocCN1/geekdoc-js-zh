  \n**表 C.5** 世界事件\n\n## 附录 D. 物品参考\n\n**`items`模块**提供了一套有用的函数，用于创建物品堆（即通常存储在玩家库存中的对象集合）。本附录中的每个函数都可以通过三种方式调用：\n\
