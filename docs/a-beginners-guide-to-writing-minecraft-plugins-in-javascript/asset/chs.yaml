  \n让我们从新的 `/jsp share` 命令开始。再次打开你的 `claim.js` 文件，并添加 **清单 18.14** 中所示的代码。\n\n* *\
  \ *\n\n**清单 18.14** `/jsp share` 命令\n\n点击此处查看代码图片\n\n```\nvar utils = require('utils');\n\
