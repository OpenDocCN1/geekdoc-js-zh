    # Don’t Be Greedy


    Always be on the lookout for queries like this:


    ```

    SELECT * FROM table

    ```


    Generally speaking, you will never need to display the complete contents of a
    table to a user and, more importantly, queries like this endanger your application.
    If you have a table that gathers stats, for example, it will grow quickly. A SELECT
    * FROM stats, which looked fine when you developed your application, will eventually
    bring it to a grinding halt.


    You should always be able to apply a limiting clause to a query, such as a WHERE
    clause, which fetches for the last week only, or if you’re using MySQL, a LIMIT
    clause, which returns a limited set of results, allowing you to build a paging
    result interface for your visitors.


    Using SELECT * FROM table will select all the columns from a table. For a table
    with many fields, this may be unnecessary; consider limiting the query to the
    columns you need only (e.g. SELECT title, date FROM articles).


