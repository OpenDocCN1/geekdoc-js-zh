    # How do I use HTTP authentication with PHP?


    Hypertext Transfer Protocol[1] (HTTP) defines its own authentication mechanisms,
    named "Basic" and "Digest" authentication, which are defined in RFC 2617[2]. If
    you run PHP on an Apache server, you can take advantage of the basic authentication
    mechanism (digest authentication is on the list of features to be released) using
    PHP header function and a couple of predefined variables. A general discussion
    of these features is provided in the PHP Manual[3].


    # Heads Up


    The first thing to understand is what actually happens when your browser sends
    a request to a Web server to give it a Web page. HTTP is the protocol for communication
    between a browser and a Web server. When your browser sends a request to a Web
    server, it uses an HTTP request to tell the server which page it wants. The server
    then replies with an HTTP response that describes the type and characteristics
    of the document being sent, then delivers the document itself.


    +   [1] ftp://ftp.isi.edu/in-notes/rfc2617.txt

    [2] ftp://ftp.isi.edu/in-notes/rfc2617.txt

    [3] http://www.php.net/features.http-auth'
