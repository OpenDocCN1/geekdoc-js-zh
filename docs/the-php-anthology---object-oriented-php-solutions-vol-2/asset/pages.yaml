    # # How do I build a user registration system?


    Having an authentication system is fine, but how do you fill it with users in
    the first place? If only yourself and a few friends will access your site, you
    can probably create accounts for all users through your database administration
    interface. However, for a site that’s intended to become a flourishing community
    to which anyone and everyone is free to sign up, you’ll want to automate this
    process. You’ll want to allow visitors to register themselves, but you’ll probably
    need some level of “screening” so that you have at least little information about
    the people who have signed up (such as a way to confirm their identity). A common
    and effective screening approach is to have the registration confirm their email
    address.


    The purpose of the screening mechanism is to give you the ability to make difficult
    for users who have “broken the rules” and lose their account privileges to create
    new accounts. You have (at least one of) their email addresses—if they try to
    register again using that address, you can deny them access. Beware though; a
    new type of Internet service is becoming popular. Pioneered by Mailinator[5],
    these services provide users with temporary email addresses they can use for registrations.


    Here, we will put together a registration system that validates new registrations
    using their email addresses; they’ll receive an email that asks them to confirm
    their registration via a URL.


