    # How do I set up automated tests of my code?


    > “If it''s not tested, it''s broken.”

    Bruce Eckel, Thinking in Java


    Next time you write PHP code—even just a small app—for your own interest, keep
    a note of how much time you spend hunting bug. I don''t mean parsing errors and
    the actual situations in which the logic of your code doesn''t perform as you
    expected it. My guess is that you''ll probably find yourself horrified by the
    amount of energy you waste troubleshooting. If I told you, by putting in a little
    extra effort-front, you could more or less completely eliminate the time you waste
    on bugs, and end up with code about which you feel a lot more secure? All you
    need to be tested...


    Unit Testing is a practical approach to development advocated by the Extreme Programming
    (XP) methodology[16]. Much of Extreme programming addresses issues related to
    project management, but Unit Testing, in particular, has struck a nerve among
    developers in every programming language you care to name—and is rapidly becoming
    a required development practice.


    In the crud terms, Unit Testing involves writing code that stakes data into your
    real code, and examines what gets back to see if the result is what''s supposed
    to be. Before we go any further with the theory, though, let''s put Unit Testing
    in context.


    The general testing lifecycle of a good software project could be characterized
    as follows:


    +   - Unit testing testing each piece of code

    - System or integration testing testing the code within the type of environment
    in it will be used

    - Acceptance testing testing the application from an end user perspective


    [16] http://www.extremeprogramming.org/


