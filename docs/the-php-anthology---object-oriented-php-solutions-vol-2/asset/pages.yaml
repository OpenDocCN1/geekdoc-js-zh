    \ for the query\n$login = mysql_escape_string($_POST[USER_LOGIN_VAR]);\n$password\
    \ = mysql_escape_string($password);\n```\n\n```\n// Query to count number of users\
    \ with this combination\n$sql = \"SELECT COUNT(*) AS num_users\nFROM . USER_TABLE\
    \ . \" \nWHERE . USER_LOGIN = '$login' AND . USER_TABLE_PASSW = '$password\";\n\
    ```\n\n```\n$result = $this->db->query($sql);\n$row = $result->fetch();\n```\n\
    \n```\n// If there isn't exactly one entry, redirect\nif ($row['num_users'] !=\
    \ 1) {\n  $this->redirect();\n} Else as a valid user; set the session variables\n\
    \  $this->storeAuth($login, $password);\n}\n```\n\nThe login method first checks\
