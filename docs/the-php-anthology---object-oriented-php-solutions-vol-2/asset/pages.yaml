  md: "# Most Probable First\n\n# The Performance Cost of OOP\n\nSome people writing\
    \ PHP applications still rail against the idea of using classes and objects to\
    \ build applications. They're opposed to this philosophy because of the cost in\
    \ performance entails, and yes, it's true—using an object oriented approach to\
    \ solve a problem will be a little slower than the equivalent web code. What is\
    \ important to remember about OOP is that it improves your performance as a developer;\
    \ if you have infinite time to waste, lucky you! But for the rest of us, the object\
    \ oriented paradigm far outstrips procedural coding in terms of reduced development\
    \ times.\n\n# Most Probable First\n\nA core aspect of any PHP application will\
    \ typically be some sort of control structure, such as an if-else statement. Often,\
    \ these are written in a manner that suits the way humans think, but this may\
    \ not produce the most effective code in terms of speed and performance. By placing\
    \ the most probable condition first, you can help PHP complete an if-else statement\
    \ faster.\n\nFor example, let's say we have a function, isBlue, which checks to\
    \ see if a variable passed to it has the value 'blue'. If most of the time, the\
    \ value is given the function 'red', rather than 'blue', it would be better to\
    \ react to that condition first.\n\nThe following example serves as a test to\
