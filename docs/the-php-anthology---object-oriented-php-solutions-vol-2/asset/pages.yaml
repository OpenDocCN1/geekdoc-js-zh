    \  header('HTTP/1.1 401 Unauthorized');\n  header('WWW-Authenticate: Basic realm=\"\
    PHP Secured\"');\n  exit('Unauthorized!');\n}\n```\n\necho 'You\\re in';\n?>\n\
    \nThe first script checks to see if an authentication has been sent by the browser;\
    \ if it hasn't, the script sends the Authorization Required headers and terminates.\
    \ if login details were submitted, it checks that the submitted user actually\
    \ exists. If we hadn't checked this, we'd get a PHP notice stating the array didn't\
    \ exist when performing the third check on PHP configurations (see Volume I, Chapter\
    \ 10). The third check ensures that the user name and password combination in\
    \ the $users array matches the details by the Web browser.\n\nNote that we could\
    \ also have checked the user name and password against a table in a database—something\
    \ we'll look at in \"How do I authenticate users with sessions?\"\n\n# When to\
    \ Send Headers\n\nIn PHP, the moment your script outputs anything that's not for\
    \ display, the web server finishes sending the headers and begins to send the\
    \ content itself. You cannot send further HTTP headers once—the page itself has\
    \ begun to be sent. This means that if you use the header function or session_start\
    \ after the body has begun, you'll get an error message like:\n\n> Warning: Cannot\
    \ add header information - headers already sent by (output started at...\n\n![](img/6a0950c1e66e475bee8d64cd7301788c_26_0.png)"
