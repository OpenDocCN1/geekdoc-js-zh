  md: '# # Access Control


    One of the side effects of building your site with PHP, as opposed to plain HTML,
    is that you''ll be building dynamic Web applications rather than static Web pages.
    Your site will let you “do” things that weren''t possible with plain HTML. But
    how can you ensure that only you, or those to whom you give permission, are able
    to “do things,” and prevent the Internet’s raging hordes from running riot your
    site?


    In this chapter, we''ll be looking at the mechanisms you can employ with PHP to
    build authentication systems and control access to the parts of the site you regard
    as private.


    One word of warning before I go any further: any system you build, which involves
    the transfer of data from a Web page over the Internet, in clear text by default.¹
    What this means is if someone is “listening in” on the network between the client’s
    Web browser and the Web server, which is possible using a tool known as a packet
    sniffer, they will be able to read the user name and password sent via your form.
    The chances of this happening are fairly small, typically only trusted organizations
    like ISPs have the access require to intercept packets. However, there is still
    a risk, and it’s one you should take seriously.


    > *Web servers that require Secure Socket Layer (SSL) connections will safely
    encrypt the data during transit. This is the best way to protect sensitive data
    in today''s Web applications.'
  merge: -1
  pgno: 20
- img_proc: true
  md: "# Chapter 1: Access Control\n\nIn addition to strategies for building access\
    \ control systems for your site, in this chapter you will find plenty of references\
    \ to useful information (there are more in Appendix C). I cannot stress enough\
    \ the importance of a little healthy paranoia in building Web-based applications.\
    \ The SitePoint Forums frequently receive visits from would-be developers who\
    \ get their fingers burned when it came to site security.\n\nThis chapter requires\
    \ handling the MySQL tables, in addition to the user table from Volume I, Chapter\
    \ 9. Note that you will find the SQL code to create all of these, with sample\
    \ data, in the code archive in the sql/ directory.\n\nFirst, you'll need a table\
    \ for storing temporary sign up information:\n\n```\nCREATE TABLE signup (\nsignup_id\
    \ INT(11) NOT NULL AUTO_INCREMENT,\n VARCHAR(50) NOT NULL DEFAULT '',\npassword\
    \ VARCHAR(50) NOT NULL DEFAULT '',\nemail VARCHAR(50) DEFAULT NULL,\nfirstname\
    \ VARCHAR(50) DEFAULT NULL,\nlastname VARCHAR(50) DEFAULT NULL,\nsignature TEXT\
    \ NOT NULL,\nconfirm_code VARCHAR(40) NOT NULL DEFAULT '',\ncreated INT(11) NOT\
    \ NULL DEFAULT '0',\nPRIMARY KEY (signup_id),\nUNIQUE KEY confirm_code (confirm_code),\n\
    UNIQUE KEY user_login (login),\nUNIQUE KEY user_email (email)\n)\n```\n\nYou'll\
    \ need a table for storing groups:\n\n```\nCREATE TABLE collection (\ncollection_id\
    \ INT(11) NOT NULL auto_increment,\nname VARCHAR(50) NOT NULL DEFAULT '',\ndescription\
    \ TEXT NOT NULL,\nPRIMARY KEY (collection_id)\n)\n```\n\nNext, there's a look\
    \ up table between users and groups:\n\n```\nCREATE TABLE user2collection (\n\
    user INT(11) NOT NULL DEFAULT '0',\ncollection_id INT(11) NOT NULL DEFAULT '0'\n\
    )\n```\n\n> Note that I've called this table collection. The name \"group\" would\
