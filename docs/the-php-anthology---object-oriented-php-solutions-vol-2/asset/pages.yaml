  md: "# The Factory Method\n\nThere are a couple of factors that you should be aware\
    \ of when considering design patterns can be applied in PHP 4:\n\n+   - Some of\
    \ the problems the GoF were aiming to address simply raise their heads in the\
    \ development of Web-based applications for the Apache/PHP environment, where\
    \ an application remains memory-resident for only as long as it takes to build\
    \ a Web page. The Memento pattern is one example.\n\n+   - PHP 4 doesn't support\
    \ some of the features found in other languages (e.g. Java), such as static class\
    \ member variables. As such, trying to apply some patterns results in awkward\
    \ workarounds that cause more problems than they solve. One of the main drivers\
    \ behind PHP 5 was to make PHP well suited to design patterns.\n\nEnough said.\
    \ Time for some patterns!\n\n# The Factory Method\n\nIn most programming languages\
    \ that support the object oriented paradigm, it's possible to use class methods\
    \ or functions to create and return new objects. An example in PHP might be:\n\
    \n```\n<?php\n// PHP Function which creates an object\nfunction createSomeObject()\
    \ {\n    return new SomeClass();\n}\n// Get an instance of SomeClass\n$someObject\
    \ = &createSomeObject();\n```\n\nIt may be unclear why anyone would want to do\
    \ what we've done in this. Rest assured there are a number of specific problems\
    \ that can be solved with this approach, which is known as the factory method\
    \ pattern. The following situations and examples should make things clear.\n\n\
    Imagine that you're working on an application. Within it, you create objects from\
    \ a given class in many places—including other classes. You're aware, that there\
    \ may be a need to use a different class at some future time. If you use a function\
    \ or class method to create the object for you, changing the class from\n\n> 2The\
    \ Singleton pattern, for instance.\n\nClick here to order the PHP Anthology Volume\
    \ I & II and get 25% off! 313"
