  md: '# Preface


    If I had one goal in mind while writing The PHP Anthology: Object Oriented PHP
    Solutions, it was to demonstrate just how easy it is to create intricate and powerful
    Web applications with an object oriented approach. In many cases, the more common
    procedural approach would result in unmanageable and bug-ridden "spaghetti code."


    In The PHP Anthology: Object Oriented PHP Solutions, Volume I, I laid the ground
    work by introducing that approach and demonstrating its application to relatively
    simple issues in Web development. With The PHP Anthology: Object Oriented PHP
    Solutions, Volume II, I hope to blow your socks off by tackling traditionally
    complex problems with those same principles—to great effect.


    In examining the solutions here, you''ll see how putting together your application
    with well designed classes is like stacking building blocks, fitting perfectly
    atop the other. Thanks to the principles of object oriented programming (OOP),
    "blocks" of code needn''t be concerned with the specifics of the other blocks
    in the structure.


    One particular example in Chapter 3 looks at converting HTML content to Adobe''s
    Portable Document Format (PDF), using less than eight separate classes in conjunction
    to fetch content from a database, parse the HTML, and finally, output the PDF.
    The solution involves a number of steps, but by breaking it down into manageable
    components in the form of classes, the complexity is reduced to the simple interactions
    between them.


    Other issues tackled in this volume, either head-on, or as a side-effect of specific
    solutions, include:


    +   - Layered application structure and the principles of N-Tier design


    +   - Providing and consuming Web services using XML-RPC and SOAP


    +   - Professional development techniques, such as API documentation and unit
    testing


    +   - Software design patterns, and how to apply them in PHP'
  merge: -1
