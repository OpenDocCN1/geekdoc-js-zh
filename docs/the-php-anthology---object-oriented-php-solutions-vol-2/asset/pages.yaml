  md: '# Chapter 6: Development Technique


    faster processors etc. at the problem); it may also be solved with Caching (see
    Chapter 5).


    That said, it''s important to know the techniques you can use to optimize your
    code without either breaking it or sacrificing the design. Looking for ways to
    optimize code should be a final stage of design.


    Here, we''ll look at some specific examples that are common to PHP applications,
    and suggest alternative approaches to structure the code and help performance.


    I''ll be introducing you to the Xdebug extension[1], which also allows you to
    profile your code—a powerful technique for finding bottlenecks in your development.
    Profiling involves examining what your code does at runtime from the perspective
    of the work the PHP engine has to perform in order to execute it. With Xdebug
    you can generate a report of how your code performs; perhaps you''ll format it
    to show the function calls that take the most time to execute first, so you can
    focus on optimizing those functions without breaking your overall design.


    The online documentation does a good job of explaining how to install Xdebug:
    it is easy to set up on all common operating systems where PHP is used—Linux,
    Windows and Mac. Note that on Windows systems, Xdebug often requires you to have
    the latest stable release of PHP installed; this, Xdebug can be installed as an
    extension like any other. For example, you could simply add the following to your
    php.ini file:


    ```

    extension = xdebug-4.3.2-1.2.0-win32.dll

    ```


    Some of the "common optimizations" suggested here have popped elsewhere in this
    book, highlighting mistakes, or in presenting specific solutions for problems
    that, while obscure, yield better performance without requiring radical alterations
    to your code.


    > [1] http://www.xdebug.org/'
