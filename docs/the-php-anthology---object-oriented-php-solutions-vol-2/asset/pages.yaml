  md: "```\n<?php\n/**\n * Writes a cache file\n * @param string string contents of\
    \ the buffer\n * @param string filename to use when creating cache file\n * @return\
    \ void\n */\nfunction writeCache($content, $filename) {\n    $fp = fopen('./cache/'\
    \ . $filename, 'w');\n    fwrite($fp, $content);\n    fclose($fp);\n}\n\n/**\n\
    \ * Checks for cache files\n * @param string filename of the cache file to check\
    \ for\n * @param int maximum age of the file in seconds\n * @return mixed either\
    \ the contents of the cache or false\n */\nfunction readCache($filename, $expiry)\
    \ {\n    if (file_exists('./cache/' . $filename)) {\n        if ((time() - $expiry)\
    \ > filemtime('./cache/' . $filename)) {\n            return FALSE;\n        }\n\
    \        $cache = file_get_contents('./cache/' . $filename);\n        return implode('',\
    \ $cache);\n    }\n    return FALSE;\n}\n```\n\nThe first two functions we defined,\
    \ writeCache and readCache, are used to create cache files and check for their\
    \ existence, respectively. The writeCache function takes its first argument, as\
    \ well as a filename that should be used when creating the cache file. The readCache\
    \ function takes a filename of a cache file as its first argument, along with\
    \ the time in seconds which the cache should be regarded as expired. If it finds\
    \ a valid cache file, the script will return it; otherwise it returns FALSE to\
    \ instruct the caller that no cache exists or it is out of date.\n\nFor the purposes\
    \ of this example, I used a procedural approach. However, I wouldn't recommend\
    \ doing this in practice, as it will result in very messy code (see later solutions\
    \ for better alternatives) and is likely to cause issues with file"
