  md: '```

    // Get the contents of

    $buffer = ob_get_contents();


    // Stop buffering and clean out the buffer

    ob_end_clean();


    // Echo some text normally

    echo ''2. A normal echo<br />'';


    // Echo the contents from the buffer

    echo $buffer;

    ?>

    ```


    The buffer itself stores the output as a string. So, in the above script, we commence
    buffering with ob_start and use echo to display something. We then use ob_get_contents
    to fetch the echo statement placed in the buffer, and store it in a string. The
    ob_end_clean function stops the output buffer and trashes the contents; the alternative
    is ob_end_flush, which displays the contents of the buffer.


    The above script displays:


    +   2. A normal echo

    1. Place this in the buffer


    In other words, we captured the output of the first echo, then sent it to the
    browser after the second echo. This simple example suggests, output buffering
    can be a very powerful tool when it comes to building your site; it provides a
    solution for caching, as we''ll see in a moment, and it is an excellent way to
    hide errors from your site''s visitors (see Volume I, Chapter 10). It even provides
    a possible alternative to buffer redirection in situations such as user authentication.


    # HTTP Headers and Output Buffering


    Output buffering can solve the most common problem associated with the header
    function, not to mention set_cookie. Normally, if you call any of these functions
    after page output has begun, you''ll get a nasty error message. With output buffering
    turned on, the output types can escape the HTTP headers. Using ob_start at the
    very beginning of your page''s execution, you can send headers at whichever point
    like, without encountering the usual errors. You can then write out the buffered
    page content all at once, when you''re sure there are no more HTTP headers required.


    ![](img/6a0950c1e66e475bee8d64cd7301788c_103_0.png)'
