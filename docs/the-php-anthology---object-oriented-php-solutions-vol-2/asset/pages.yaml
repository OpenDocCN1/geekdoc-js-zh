    # Private, Protected and Public


    In programming languages like Java and C+, it’s common to define class methods
    and member variables as being private (or, sometimes, protected, where Java is
    concerned). This tells a compiler that any code that accesses instances of the
    class is not allowed to use these methods or variables directly. Attempts to do
