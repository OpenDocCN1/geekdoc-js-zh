  md: '# Chapter 6: Development Technique


    # Mock Objects


    One area of Unit Testing is that you may be wondering about dealing with situations
    where one class uses another. What about classes that make use of data from an
    external source, such as a database? These will surely require you to execute
    the tests in an environment where there''s a database with some sample data we
    can use, right? Well, not necessarily! In fact, one tenet of Unit Testing is that
    you should only test the particular unit in question—not other classes at the
    same time. In particular, the tests should be isolated, as much as possible, from
    external environments like databases. Otherwise, these external environments will
    reduce the scope of the test to a specific case. Testing against databases and
    other external data sources is more part of the integration tests that happen
    as the next step in the test lifecycle.


    To solve this problem, the answer is to use mock objects. Mock objects are objects
    that simulate the behavior of a real object. From the perspective of the API,
    they should be indistinguishable from the real thing as far as any other objects
    using the mock are concerned. Using mock objects with our test scripts, we can
    even do things like set up test data for the mock when a particular method is
    called.


    Let''s say, for example, that we have a class designed to fetch articles from
    our database; the class uses others to do the work of connecting to the database
    and fetching the result, as we say in Volume I, Chapter 3 with the MySQL and MySQLResult
    classes. Let''s imagine we want to test the Articles class created in Chapter
    3 without having any real database connections. To do so, we''d create mock objects
    for the MySQL and MySQLResult classes, which we then give to the Articles class
    in exactly the same way as the real database objects would.


    Mock objects are extremely important for Unit Testing, they allow you to break
    the dependencies between classes so you can test one at a time. Without mock objects,
    things can get pretty convoluted. For a fairly complex application, the class
    you''re testing on another class, which, in turn, depends on another class, and
    so on. You''ll be uncertain if a bug you''ve found is really part of the class
    you''re testing, or is caused by one of the other units on which the class directly
    or indirectly relies.


