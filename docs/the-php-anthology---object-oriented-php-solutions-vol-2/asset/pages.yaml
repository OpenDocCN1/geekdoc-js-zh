  md: '# Chapter 7: Design Patterns


    My own opinion of design patterns is that they provide a shortcut to discovering
    the way you''d probably end up solving a particular problem, provided you had
    enough time to experiment with all the possible ways you might structure your
    code. In other words, they''re down-to-earth descriptions of how a group of programmers
    could solve the problems they faced.


    Talking about what design patterns are something I generally prefer to avoid.
    It''s like trying to explain the concept of snow to someone who grew up in the
    Sahara desert; you''ve never seen for yourself, it''s not going to make much sense.
    Reading the solutions in this chapter, which look at specific examples using real
    code, is, in my opinion, a better way to grasp the concepts.


    But, to give you a rough idea of what this chapter is headed, consider this: in
    your Web building experience, have you ever had a feeling of deja vu? Have you
    ever said to yourself, "I''ve done this before," or "I''m sure I saw a really
    good solution to this problem. Now, where was it?


    What the Gang of Four with Design Patterns identified three common patterns that
    develop deja vu, and provide guidelines for how we could best solve each time.
    It has shown that the Gang of Four (GoF) got it easy to maintain, yet their solutions
    typically helps developers write applications that are cases that occur in the
    real world. The adage "design is dead," often quoted these days in discussions
    of the visual design of Websites, can also be applied to object oriented programming,
    thanks to design patterns. If you can learn to solve the problem in the first
    place, the solution is just a matter of identifying and applying the right pattern.


    A welcome side-effect of studying design patterns is that they help people learn
    how to get the most out of the object oriented paradigm. In this chapter, you
    may find that object oriented PHP becomes much richer, rather than overwhelmed
    by a whole load of new syntaxes that you have no idea to do with.


    Although the Gang of Four laid out a catalog of twenty patterns, we''ll only cover
    the five that I''ve found to be used or useful in PHP 4, to give you a taste of
    what design patterns are about. In more depth analysis of object oriented programming
    being beyond the scope of this book. This is not to say that other patterns cannot
    be used applied in PHP, but I have included here the patterns that can be easily
    applied to any PHP application, and do not suggest some sort of framework that
    affects the structure of your application.


    > The Model-View-Controller (MVC) pattern, the Command Pattern and the Template
    Method, to name a few.


