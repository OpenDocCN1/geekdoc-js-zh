    Notice that the code that appears after the PEARDBAdapter is instantiated is exactly
    the same as it was when I used my MySQL server—the arguments are the same! I needed
    to modify two lines of code (the include and the object creation); the rest of
    my application could happily keep on running. Now, with the power of PEAR:DB at
    my disposal, I can modify my application to run on any database it supports.


    As you can see, the adapter pattern offers a powerful technique to help you manage
    third party libraries for use in your code—without needing to rewrite anything.
    Adapters can be useful if you are writing brand new code that uses third party
    party, they allow you to customize the API to your needs. The trick to using an
    adapter pattern is to find the commonalities between the API your code expects
    (or needs), and the API that the third party provides, then use your adapter class
    as a translator between the two.


    > ⁴The practical extent of this portability can depend on other factors. For example,
    different databases support different forms of SQL. For example, the LIMIT 0,5
    in the query is not supported by most databases, although recent versions of PostgreSQL
    do allow it.


