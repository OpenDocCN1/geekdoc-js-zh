  md: "# How do I build a permissions system?\n\nusers to change their email address,\
    \ you'll need to examine the registration procedure used earlier in this chapter,\
    \ and modify the $signup class. You should make sure that users confirm a new\
    \ email address before you allow them to change it.\n\n# # How do I build a permissions\
    \ system?\n\nSo far, you've already got an authentication system, which provides\
    \ a global security system for your site. But are all your site's members equal?\
    \ You probably don't want all of users to have access to and delete articles,\
    \ for example. To deal with this, you need to add to the security system further\
    \ complexity that allows you to assign \"permissions\" to limited groups of members,\
    \ permitting only these users to perform particular actions.\n\nRather than assigning\
    \ permissions to particular accounts, which would quickly become a nightmare to\
    \ administer, the way we will build a permissions system is to think in terms\
    \ of Users, Groups and Permissions. Users (accounts) will be assigned to Groups,\
    \ which will have names like \"Administrators,\"Authors,\",\"Managers,\" and so\
    \ on. Permissions reflect actions that users will be allowed to perform within\
    \ the site, and they will also be assigned to Groups. From an administration perspective,\
    \ managing all this will be easy, and as it will be a simple matter to see which\
    \ Permissions a particular Group has, and which users are assigned to that.\n\n\
    To build the relationships I've described requires the construction of many-to-many\
    \ relationships between tables. This is explained as follows:\n\n+   - A User\
    \ can belong to many Groups.\n- A Group may have many Users.\n- A Permission can\
    \ be assigned to many Groups.\n- A Group may have many Permissions.\n\nIn practical\
    \ terms, the way to build many-to-many relationships in MySQL is to use a lookup\
    \ table, which relates to two other tables. The lookup table stores two column\
    \ index, each column the key of the two related tables. For example, here is the\
    \ definition of the user2collection lookup table:\n\n```\nCREATE TABLE user2collection\
    \ (\n  user_id INT(11) NOT NULL DEFAULT '0',\n  collection_id INT(11) NOT NULL\
    \ DEFAULT '0',\n```\n\nClick here to order The PHP Anthology Volume I & II and\
    \ get 25% off! 61"
