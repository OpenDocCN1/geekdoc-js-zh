  md: "# Chapter 1: Access Control\n\nFirst, let's develop a class for sessions. All\
    \ code will use this class to access sessions, rather than using the $ SESSION\
    \ variable directly. This has the advantage that if we ever want to switch to\
    \ an alternative session handling mechanism, such as one we've built ourselves,\
    \ we simply need to modify the class, rather than rewriting a lot of code. We\
    \ can provide an interface to the $ SESSION variable with a few simple methods:\n\
    \n```\nFile: Session/Session.php (in SPLIB)\n<?php\n/**\n * A wrapper around PHP's\
    \ session functions\n * <code>\n * $session = new Session();\n * $session->set('message','Hello\
    \ World!');\n * echo ($session->get('message')); // Displays 'Hello World!'\n\
    \ * </code>\n * @package SPLIB\n * @access public\n */\nclass Session {\n/**\n\
    \ * Session constructor<br />\n * Starts the session with session_start()\n *\
    \ <b>Note:</b> that the session has already started,\n * session_start() does\
    \ nothing\n * @access public\n */\nfunction Session()\n{\n    session_start();\n\
    }\n/**\n * Sets a session variable\n * @param string name of variable\n * @param\
    \ mixed value of variable\n * @return void\n * @access public\n */\nfunction set($name,\
    \ $value)\n{\n    $_SESSION[$name] = $value;\n}\n/**/\n```\n\n12 Click here to\
