    \ Now, all you need to do is build an interface to control Users, Groups and Permissions!\n\
    \n# # How do I store sessions in MySQL?\n\nAs discussed earlier in this chapter,\
    \ the default behavior of sessions in PHP on the server side is to create a temporary\
    \ file in which session data is stored. This is usually kept in the temporary\
    \ directory of the operating system and, as, presents a security risk to your\
    \ applications, especially if you are using a shared server. It's a good idea\
    \ to be aware of the alternative; using a custom session handler provides an alternative\
    \ store which is fully under your control.\n\nIn this solution, I'll provide you\
    \ with a custom session handler that will store all session data in MySQL in a\
    \ manner that will require no modification of any code. The custom handler is\
    \ a port of the PostgreSQL Session Handler for PHP[10], written by Jon Parise,\
    \ and is supplied with the code for this chapter, in the subdirectory mysql_session_handler.\n\
    \nTo install it, the first thing you need is to modify the mysql_session_handler.php,\
    \ changing the lines that identify your database connection, shown here in bold:\n\
    \n> File: mysql_session_handler/mysql_session_handler.php (excerpt)\n\n```\nfunction\
    \ mysql_session_open($save_path, $session_name) {\n    global $mysql_session_handle;\n\
    \n    /* See: http://www.php.net/manual/function.mysql-connect.php */\n    $host\
    \ = 'localhost';\n    $user = 'harry';\n    $pass = 'secret';\n    /* See: http://www.php.net/manual/function.mysql-select-db.php\
    \ */\n    $dbas = 'sitepoint';\n\n    $mysql_session_handle = mysql_connect($host,\
    \ $user, $pass);\n    mysql_select_db($dbas, $mysql_session_handle);\n    return\
    \ $mysql_session_handle;\n}\n```\n\n[10] http://www.csh.rit.edu/~jon/projects/pgsql_session_handler/"
