  md: '# Appendix A: PHP Configuration


    # Table A.1. Key Security and Portability Settings


    | Setting | Notes |

    | --- | --- |

    | register_globals (default: off) | Automatically creates global variables from
    incoming HTTP request variables, as GET and POST. For security and portability,
    it is highly recommended that you switch this off. See http://www.php.net/register_globals
    for more details. |

    | magic_quotes_gpc (default: off) | Automatically escapes quotes in incoming HTTP
    request variables with a backslash, helping prevent SQL injection attacks. If
    you know you''re doing, it''s usually better to switch this functionality off
    and handle this escaping when inserting into a database, given the problems this
    feature can cause you with, as well as the performance overhead they introduce.
    See Volume I, Chapter 1 for information on making your scripts compatible with
    this feature. |

    | call_time_pass_reference (default: off) | Allows you to use variable references
    at call time (e.g. htmlentities($string)). To keep code clean and understandable,
    and ensure portability, this functionality switched off. |

    | short_open_tag (default: on) | Allows you to start a block of PHP code with
    just <? instead of <?php. Also lets you write PHP expressions with <?, which is
    identical to <?php echo. While convenient, these shortcuts are not XML compliant,
    and can cause the PHP processor to get confused when it encounters XML processing
    instructions such as <?xml version="1.0"?. Many people have short_open_tag switched
    off, so, for maximum portability, avoid the shortcuts and switch this feature
    off during development. |'
  merge: -1
  pgno: 215
- img_proc: true
  md: '| Setting | Notes |

    | --- | --- |

    | asp_tags (default: off) | Allows ASP style tags (< ... %>) as an alternative
    to the PHP open and close tags (<?php ?>). Few people use these, for maximum portability,
    it''s best to avoid them, and switch this feature off during development. |

    | error_reporting (default: E_ALL & -E_NOTICE) | When developing, and for maximum
    portability it''s best to set this to E_ALL, that PHP will inform you of situations
    where, for example, a $_GET variable your code relies upon not been initialized.
    This forces you to write code that is more secure and contains fewer logic errors,
    also ensures that your code will run nearly on other servers configured this way.
    |

    | display_errors (default: on) | Determines whether PHP sends error messages to
    the Web browser. When running your application in a live environment, it''s generally
    better to switch this off, instead using PHP''s logging mechanism to capture errors
    to a file, for example. |

    | open_basedir (default: not set) | Allows you to restrict PHP file operations
    to a given directory or below. This can be a good idea to prevent a script that
    is used to display the contents of files, for example, from being used to access
    sensitive files elsewhere on your server. |

    | allow_url_fopen (default: on) | Allows you to specify remote file locations
    for use with functions like fopen (e.g. fopen(''http://www.sitepoint.com'',''r''));
    It''s a handy tool but also potentially a security risk for a badly written script.
    Switch it off if you know you don''t need it. |


