  md: "# Chapter 6: Development Technique\n\nThe mock object class contains the same\
    \ methods as the class it simulates—in the case of the Stamp class, this is simply\
    \ the constructor, stamp. The mock object class, when instantiated as an object,\
    \ now fully simulates the Stamp API (as the generated code is pretty complex,\
    \ you may just want to take my word for this).\n\nNow, let me show you how to\
    \ create correctly a mock object like this for use in your testing:\n\n```\n<?php\n\
    if (defined('SIMPLE_TEST')) {\n    // Modify this line to point at your simplest\
    \ installation\n    define('SIMPLE_TEST', '../simpletest/');\n}\n\nrequire_once\
    \ SIMPLE_TEST . 'unit_tester.php';\nrequire_once SIMPLE_TEST . 'mock_objects.php';\n\
    require_once SIMPLE_TEST . 'reporter.php';\n\n// Create a MockStamp\nMock::generate('Stamp');\n\
    \n```\n\nUsing the Mock::generate method, the mock object class is generated above,\
    \ and is then automatically made available for instantiation. Now, for the StampCollection\
    \ test script:\n\n```\n// Create the test class\nclass TestOfStampCollection extends\
    \ UnitTestCase {\n    function TestOfStampCollection() {\n        $this->TestCase('StampCollection');\n\
    \    }\n}\n\n// Test adding with the add method\nfunction testAdd() {\n    //\
    \ Create the MockStamp object\n    $mockStamp = &new MockStamp($this);\n\n   \
    \ // Set the member variables\n    $mockStamp->name = 'Penny Black';\n    $mockStamp->price\
    \ = 3500;\n}\n\n// Create the StampCollection\n\n```"
