  md: '# Nesting Buffers


    You can nest one buffer within another practically ad infinitum simply by calling
    ob_start more than once. This can be useful if you have multiple operations that
    use the output buffer, such as one that catches the PHP error messages, and another
    that deals with caching. Care needs to be taken to make sure that ob_end_flush
    or ob_end_clean is called every time ob_start is used.


    # How do I implement a simple server side caching system?


    Now that we have a grasp of the ideas behind output buffering, it''s time to see
    how we can put this process into action in a manner that will be easy to maintain.
    To do this, we''ll use a little help from PEAR::Cache_Lite (version 1.1 was used
    in the examples here).


    As mentioned, in the interests of keeping your code maintainable and having a
    reliable caching mechanism, it''s a good idea to delegate the responsibility of
    caching logic to classes you trust. Cache_Lite provides a solid but easy to use
    library for caching, handling issues such as file locking, creating, checking
    for, and deleting cache, controlling the output buffer, and directly caching the
    results from function and class method calls. More to the point, Cache_Lite should
    be relatively easy to apply to any application, requiring only minor modifications.


    There are three main classes in Cache_Lite. The first is base class Cache_Lite,
    which deals purely with creating and fetching cache files but makes no use of
    output buffering. This can be used for caching operations in which you have no
    need for output buffering, storing the contents of a template you''ve parsed in
    PHP. The examples here will not use Cache_Lite directly, but will insist focus
    on the two subclasses. Cache_Lite_Function can be used to call a function or class
    method and cache the result; this might prove useful for storing a MySQL query
    result, for example. The Cache_Lite_Output class uses PHP''s output control functions
    to catch the output generated by your script, and store it in cache; it allows
    you to perform tasks such as those we completed in the previous solution.


    Here''s an example of how you might use Cache_Lite to accomplish the task completed
    in the last solution. When instantiating any of Cache_Lite''s classes, we must
    first provide an array of options that determine the behavior'
  merge: -1
