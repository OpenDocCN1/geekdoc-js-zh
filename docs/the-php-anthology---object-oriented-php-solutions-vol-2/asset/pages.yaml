  md: '# 7 Design Patterns


    With a grasp of object oriented programming under your belt, thanks to Volume
    I, Chapter 2, I''ll bet you''re wide-eyed and wondering what to do with all this
    great new stuff that''s supposed to help you write maintainable, well-designed
    PHP applications, right? This is a common problem for developers coming to grips
    with the object oriented paradigm. It takes a long time to do anything really
    useful with OOP, many of their early attempts being no more than long sections
    of procedural code wrapped in a few class methods.


    Thankfully, object oriented programming has been around for quite some time and
    is supported by many languages; overcoming such problems is well-trodden territory.
    More importantly, our OOP code ancestors were kind enough to put together a catalog
    of best practices, known as design patterns, which worked over and over again,
    and could be readily applied to solving problems in a uniform manner. The landmark
    publication was the book, Design Patterns (Addison-Wesley, ISBN: 0-201-63361-2)
    by the “Gang of Four”(Erich Gamma, Richard Helm, Ralph Johnson and John Vlissides),
    which have become a modern classic in IT literature—indeed, such a thing is possible.
    Search Amazon for “Design Patterns,” and you can''t miss it. While you''re browsing
    Amazon, it''s also worth looking at Martin Fowler''s Patterns of Enterprise Application
    Architecture (Addison-Wesley, ISBN: 0-321-12742-0), which provides further patterns,
    many of which relate directly to the problems developers encounter when building
    Web-based applications.'
