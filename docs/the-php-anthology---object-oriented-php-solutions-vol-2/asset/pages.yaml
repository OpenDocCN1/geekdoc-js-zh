    ![](img/6a0950c1e66e475bee8d64cd7301788c_135_4.png)


    The names of the tiers themselves vary, as N-Tier is not a well-defined standard.
    For example, the application logic layer is sometimes referred to as the business
    logic layer, while the presentation layer is often confused with the presentation
    logic layer. In general, what happens at each layer is fairly agreed upon, as
    the diagram suggests; vendors like Sun and Microsoft will generally refer to a
    very similar five tier structure, using their own technologies, of course.


    # The Principles of N-Tier


    When we talk about an N-Tier application, a few general principles are inferred;
    these principles apply to the tiers themselves.'
