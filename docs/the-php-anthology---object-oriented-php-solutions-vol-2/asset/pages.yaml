  md: "```\n$stampCollection = &new StampCollection();\n```\n\n```\n// Add the MockStamp\
    \ to the StampCollection\n$stampCollection->add($mockStamp);\n```\n\n```\n// Get\
    \ a copy of the stamp back\n$stampCopy = $stampCollection->fetch();\n```\n\n```\n\
    // Compare the names of the stamps\n$this->assertEquals($stampCopy->name, $mockStamp->name);\n\
    ```\n\n```\n}\n```\n\nHere, we're basically performing a \"round trip\" with an\
    \ instance of StampCollection. We create a MockStamp object, using the add method\
    \ to add it to the StampCollection; then, we get a copy back with the fetch method.\
    \ Finally, we use the assertEquals SimpleTest to compare the values of the MockStamp\
    \ and the copy we retrieved from StampCollection. What happens? Take a look at\
    \ Figure 6.9.\n\n# Figure 6.9. Forgery Doesn't Pay\n\n# StampCollection\n\nFail:\
    \ testadd->Equal assertion [NULL] [String; Penny Black] by type\n\n> 1/1 test\
    \ cases complete: 0 passes and 1 fails.\n\nHow! could such a simple operation\
    \ have gone wrong? Time to take a close out at our StampCollection class. Here's\
    \ the problem, in the add method:\n\n```\nfunction add($Stamp)\n{\n  $this->collection[]\
    \ = $stamp;\n}\n```\n\nIt looks like we've mistakenly used the string append operator\
    \ (.= to add the stamp to the end of the array. We should have used the assignment\
    \ operator (=) instead! This is a case where a serious logic bug slips through\
    \ the cracks of PHP's error checking without so much as a warning, thanks to SimpleTest,\
    \ the bug could be found and fixed. What's more, we now have test scripts in place"
