  md: '# The Factory Method


    as a Number or Period class, without having to modify the buildStats method. Without
    too much work, we can build a package that allows us to perform all sorts of statistical
    analyses of text documents, the factory method allows us to add functionality
    in stages.


    Now, imagine you''ve developed a package of classes that you''ve distributed to
    a group of users. Here, the factory method can help you provide these users with
    a simple API for getting to the "parts" of the package they need for their particular
    circumstances, and which allows them to switch "parts" with minimum effort.


    A good example of this is the PEAR::DB package, which provides a database layer
    to help you write applications that can be used with different vendors'' database
    software. When working with DB, you''ll only work with one type of database at
    a time, so you''ll only need to use the classes in PEAR::DB relative to that database.


    The DB::connect method does this. It uses a factory method to give you objects
    which you can connect the database you''re interested in; to create these objects,
    you simply provide the method with an identifying string (the DSN). For example,
    we could use the following to connect to MySQL:


    ```

    $dsn = ''mysql:harryf:secret@localhost/sitepoint'';

    $db = DB::connect($dsn);

    ```


    The dsn variable contains no instance of DB_MySQL. We would modify the dsn variable
    to postgresql://harry:secret@localhost/sitepoint to connect to PostgreSQL instead,
    we''d get back an instance of DB_Pg. The factory method DB::connect allows us
    to avoid dealing with the question of which class to instantiate; should we require
    our application to run on a database that''s different from that which it was
    originally designed, the modifications would be reduced.


    One final approach to applying the factory method pattern—an approach seasoned
    programmers might regard as the "true" factory method—is to have multiple factory
    methods in an inheritance hierarchy of factory classes. This allows you to get
    back from the factory different objects, depending on which subclass factory method
    was called.


    To illustrate, let''s imagine we use an email package where the body of the email
    message is handled by separate classes, a plain text message and an HTML email
    each representing a single class. We want to be able to create instances of these
    classes without explicitly identifying them in our code, so that we can send emails
    to a list of customers based on whether they declared a preference for


