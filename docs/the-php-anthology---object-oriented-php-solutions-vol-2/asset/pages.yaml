  md: '# Chapter 1: Access Control


    # How do I deal with members who forget their passwords?


    In the last solution, I was happy to explain just how great human beings are in
    comparison to computers. Unfortunately, though, we have a tendency to “age out”
    important information such as the password we need to log into a site. A feature
    that allows users to retrieve forgotten passwords is an essential time saver.
    Overlook this, and you can expect a waste of time changing passwords for people
    who have forgotten them.


    If you encrypt passwords in your database, you will need a mechanism that generates
    a new password that, preferably, is easy to remember. If you’re storing passwords
    as-is, without encryption, it’s probably acceptable to simply send the password
    to the user’s registered email address you’ve already confirmed as reliable than
    the “Secret Question” approach. This common tactic asks simple questions to refresh
    their memories, as, “Where were you born?” and “What’s your date of birth?” Ask
    yourself how many organizations, both on and offline, you’ve given that information
    to. Some applications, such as forums, even make your birthday for all to see,
    should you provide it. Details like this may well be common knowledge.


    To solve the problem, we’ll build a general AccountMaintenance class, which will
    do some of the work for us, then supply it with the information it needs to fetch
    an unencrypted password, or generate a new (memorable) password. The typical approach
    used to generate memorable passwords is inspired by the Secure Memorable Password
    Generator found at Codewakers.com[8].


