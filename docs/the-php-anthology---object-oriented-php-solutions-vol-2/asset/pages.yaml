  md: 'of disk read/writes by reconstructing the cache files straight into an array
    to which your code has access. We''ll be sticking to the normal Cache-Lite mechanism
    here, but memoryCaching may be worth further investigation if you use a large
    site. The default value is TRUE (disabled).


    # onlyMemoryCaching


    If this is enabled, the only caching mechanism will be used. The default value
    is TRUE (disabled).


    # memoryCachingLimit


    This places a limit on the number of cache files that will be stored in the memory
    array. The more cache files you have, the more memory will be used by memory caching,
    so it may be a good idea to enforce a limit that prevents your server from having
    too much work to do. Of course, this places no restriction on the size of each
    cache file, so one or two massive files may cause a problem. The default value
    is 1000.


    # Purging the Cache


    Cache_Lite''s in-built lifetime mechanism for cache files provides a good foundation
    for keeping your cache files up to date, but there will be circumstances in which
    you need the files to be updated immediately. For such cases, the methods remove
    and clean can handle it. The remove method is designed to delete a specific cache
    file; it takes the cache ID and group name of the file. To delete the page cache
    file, we have used:


    ```

    $cache->remove(''body'', ''Dynamic'');

    ```


    Using the clean method, we can delete all the files in our cache directory simply
    by calling the method with no arguments; alternatively, we can specify a group
    of cache files to delete. If we wanted to delete both the header and footer created
    above, we could do so like:


    ```

    $cache->clean(''Static'');

    ```


    The remove and clean methods should obviously be called in response to events
    within an application. For example, if you have a forum application, you might
    want to remove the relevant cache files when a visitor posts a new message. Although
    it may seem like this solution entails a lot of code modifications, with care
    it can be applied to your application in a general manner.'
