    \ such as being able to move backward and forward through the collection or performing\
    \ multiple iterations over a collection simultaneously, creates the need for a\
    \ more complex API. A general \"profile\" of a more advanced iterator looks like\
    \ this:\n\n```\n<?php\nclass Iterator {\n    function Iterator() {...}\n\n   \
    \ // Resets the collection\n    function reset() {...}\n\n    // Moves the collection\
    \ point forward\n    // (but typically returns no value)\n    function next()\
    \ {...}\n\n    // Sometimes isFinal() or isValid();\n    // used to check for\
    \ the end of the collection\n    function hasMore() {...}\n\n    // Gets the current\
    \ value from the collection\n    function current() {...}\n}\n?>\n```\n\nThe above\
    \ class shows the methods commonly provided by more advanced iterators. The detail\
    \ (i.e. what happens inside the class) will vary between iterators, depending\
    \ on the problem each is intended to solve.\n\nIf you're interested in exploring\
    \ other types of iterators in PHP, the best approach is to examine open source\
    \ class libraries that you use, such as Eclipse[1] and eXtremePHP[2].\n\n# The\
    \ Strategy Pattern\n\nThe strategy pattern is used in situations where there is\
    \ a common problem that can be solved by one of many algorithms. It can help eliminate\
    \ long-winded if-else or switch structures, if the problem repeats itself within\
    \ an application, also removes the need to reproduce the same code for each solution.\n\
    \n+   [1] http://www.students.cs.uu.nl/people/voostind/eclipse/\n[2] https://sourceforge.org/projects/extremephp/\n\
