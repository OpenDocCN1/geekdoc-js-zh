  md: '# How do I build a permissions system?


    The User class fetches data on a "need to know" basis. That is, it fairly safe
    to assume that the basic, available user information is retrieved shortly after
    instantiation; hence, the use of the populate method—otherwise, we wouldn''t have
    created the object in the first place. The data pertaining to permissions, however
    may not be needed every time the User class is instantiated. It''s likely that
    we''ll only check permissions on a restricted number of pages, so we can save
    ourselves a query when the user visits public pages, leaving the checkPermission
    method to be called explicitly needed. This approach is known as lazy fetching,
    and can be a useful approach to reducing unnecessary queries and performance overhead.


    Having seen the class, let''s consider a demonstration. This login form script
    (13.php) is the same as 11.php, but it sends the post data to a different URL.
    Let''s look at a simple example of the permissions in action: first, we''ll set
