  md: '# Appendix D: Working with PEAR


    PEAR[1], the PHP Extension and Application Repository, is the brainchild of SOAP
    de Stig Bakken, and was inspired by Perl''s CPAN[2].


    As a project, it was originally conceived in 1999 and reached its first stable
    release in January 2003. It serves two purposes. First, it provides a library
    of PHP classes for solving common "architectural" problems, a number of which
    you''ve seen in this book. Second, under the "PECL" (PHP Extension Code Library),
    PEAR provides a repository for extensions to PHP. PEAR was originally intended
    to store "non standard" extensions that lay on the fringes of PHP, but it has
    since evolved into the default repository for all extensions not included in the
    core PHP distribution. Here, I''ll be concentrating on the PHP classes that PEAR
    provides.


    Those who submit and maintain the PEAR repository are all volunteers. Originally
    a small community of developers, the release of the first version of PEAR has
    seen their numbers grow significantly, and receive a greater focus from the PHP
    community as a whole. There''s still a lot of work to do to raise the standards
    to in which there is still much room for improvement. If you''re struggling, a
    good place to start is PHPKitchen''s list of PEAR Tutorials[3]. That said, PEAR
    already offers significant value in terms of reducing the effort required in developing
    PHP applications.


    But what does PEAR actually mean to you? Considering the capabilities of PEAR::SOAP,
    which was conceived in Chapter 2, writing the "application" code that would use
    is clearly a waste of time. Browsing the list of packages[4], you''ll see that
    PEAR provides you many more classes, categorized by subject, to help prevent you
    having to reinvent wheels. It''s important to understand the focus of PEAR classes
    is architectural issues, not application-level classes. In other words, PEAR is
    not Hotscripts; you won''t find complete applications there; rather, you''ll find
    code that can be reused in many different applications. Also important is that
    the PEAR developer community does its best to maintain and support the library,
    compared to say, projects available via SourceForge[5], which are often individual


    +   [1] http://pear.net/

    [2] http://www.cpan.org/

    [3] http://www.phpkitchen.com/index.php?page=2003041204203962

    [4] http://www.pear.net/packages.php

    [5] http://www.sourceforge.net/'
