  md: '# The Top Security Vulnerabilities


    contains the session ID. In general, it''s better to handle sessions with cookies.

    If you''re working with your own cookie-based authentication, store an

    identifying session ID in the cookie only, not the user name and password.


    # Cross Site Scripting (XSS)


    By using the legitimate mechanisms your site provides, it''s possible for attack-

    ers to post on your site, for example, JavaScript that results in other users

    giving away their session IDs, thereby allowing the attacker to hijack your

    session. Less serious, but equally embarrassing, is simply posting HTML that

    "scrambles" the layout of your page, perhaps closing a tag prematurely.

    We use a "deny all ''little" approach, or, better yet, employ a separate

    markup language as BBCode (Volume I, Chapter 5), while eliminating

    HTML with PHP functions like strip_tags and htmlentities. If you really

    want allow HTML to be posted, consider building a filter based on

    PEAR::XML_HTMLSax[5] (see Chapter 2).


    # Command Injection


    Command injection occurs when an attacker is able to influence the way PHP

    interacts with external systems, such as the file system or database. A SQL

    injection is one prime example, which occurs when an attacker uses a form or

    URL to modify a database query. This was discussed in detail in Volume

    I, Chapter 3. The bottom line is: escape all data you receive from a user before

    ou use it in a.


    # Error Handling


    An experienced attacker will be able to gain a lot of important information

    about your system from your error messages. Although this comes under the

    heading of "security by obscurity" (which is no substitute for a really

    secure application), for a live site, it''s a good idea to instruct PHP to log
    error

    messages to a file, rather than display them to the browser. See Volume I,

    Appendix A details.


    # Insecure Use of Cryptography


    First of all, when it comes to cryptography, don''t roll your yours. Second, re-

