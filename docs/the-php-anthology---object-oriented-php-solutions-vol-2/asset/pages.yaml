  md: "# Chapter 7: Design Patterns\n\n```\n$subscribers = &new Subscribers();\n$rssfeed\
    \ = &new RSSFeed();\n\n// Create the observable\n$article = &new Article();\n\n\
    // Add the observers to the observable\n$article->addObserver($cache);\n$article->addObserver($subscribers);\n\
    $article->addObserver($rssfeed);\n```\n\nA simple form demonstrates the interaction\
    \ of the objects:\n\n```\nif (isset($_POST['publish'])) {\n  $article->publish();\n\
    } else if (isset($_POST['delete'])) {\n  $article->delete();\n} else {\n  <form\
    \ action=\"<?php echo $_SERVER['PHP_SELF'];?>\" method=\"post\">\n  <textarea\
    \ name=\"article\" cols=\"50\" rows=\"5\">\nThis is a sample article\n  </textarea><br\
    \ />\n  <input type=\"submit\" name=\"publish\" value=\"Publish Article\"><br\
    \ />\n  <input type=\"submit\" name=\"delete\" value=\"Delete Article\"><br />\n\
    </form>\n<?php\n}\n```\n\nIf we click the Publish button, the code executes the\
    \ Article class's method; behind the scenes, the observers respond to the event,\
    \ displaying:\n\nPublishing article.\nRefreshing cache\nNotifying subscribers\
    \ by email\nUpdating the RSS Feed\n\nThe observer pattern is a powerful but easy-to-use\
    \ mechanism for executing multiple routines without specifically calling them\
    \ in our code. We can add or remove observers easily, without making serious modifications\
    \ to the main logic of the application. it’s easy to reuse the observers on other\
    \ observables, and add their capabilities to other parts of our site, as a forum."
