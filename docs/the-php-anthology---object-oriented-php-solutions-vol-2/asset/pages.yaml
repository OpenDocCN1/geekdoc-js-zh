  md: "# Chapter 7: Design Patterns\n\nPEAR::DB result object and wraps it in the\
    \ second class, which adapts fetch to fetchRow.\n\nFile: Database/PEARDBAdapter.php\
    \ (in SPLIB) (excerpt)\n\n```\n// Include PEAR::DB\nrequire 'DB.php';\nn// Adapter\
    \ for PEAR::DB MySQL connections\nclass PEARDBAdapter {\n    // Instance of PEAR::DB\n\
    \    var $db;\n\n    function PEARDBAdapter($host, $dbUser, $dbPass, $dbName)\
    \ {\n        $dsn = \"mysql://$dbUser:$dbPass@host$dbName\";\n        $this->db\
    \ = &DB::connect($dsn);\n    }\n\n    // Query factory method\n    function query($sql)\
    \ {\n        // Call the PEAR::DB query() method\n        $result = &&$this->db->query($sql);\n\
    \n        // Wrap the result in a PEARDBResultAdapter\n        return new PEARDBResultAdapter($result);\n\
    \    }\n```\n\nThe PEARDBAdapter class acts as a wrapper for the main PEAR::DB\
    \ class, most importantly, providing a query method that catches the DB_Result\
    \ object created by a query, and placing it inside a PEARDBResultAdapter (see\
    \ below).\n\nHere's the PEARDBResultAdapter class:\n\nFile: Database/PEARDBAdapter.php\
    \ (in SPLIB) (excerpt)\n\n```\n// Adapter for PEAR::DB Result\nclass PEARDBResultAdapter\
    \ {\n    // Instance of PEAR::DB Result\n    var $result;\n\n    function PEARDBResultAdapter(&$result)\
    \ {\n        $this->result = &&$result;\n    }\n```\n\n344 Click here to order\
    \ the PHP Anthology Volume I & II and get 25% off!"
