    # Figure 6.1. Most Probably Faster


    | Time Taken | Number of Calls | Function Name | Location |

    |---|---|---|---|

    | 0.0019927025 | 50 | *isblueslow() | c:\docs\phprecipes\developmenttechnique\1.php:32
