    running in a live environment; the impact to a database table which now contains
    megabytes of data, for example, might itself clear only once your application''s
    live and online.


    # How do I structure my application into layers?


    The term N-Tier may or may not be familiar to you, but it makes as a very useful
    measure of the design of your application. The “N” means “number of”, while “tier”
    refers to the layers in your application being tiers on a wedding cake.


    Let''s step back into the past for a moment. In the old days of client-server
    computing on corporate networks, applications shared by multiple users were generally
    built with two tiers: a central database or file server, and a desktop application
    that accessed the central resource. This worked well for small groups of users,
    but as applications were distributed regional and international networks and user
    bases, all sorts of problems ensued. The database became overloaded, client side
    upgrades and maintenance became more expensive, and network'
