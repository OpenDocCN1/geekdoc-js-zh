  md: 'paradigm: that users of a class should only access objects of that class via
    the public doorways—its public methods and variables.


    PHP 4 does not restrict what you can and cannot access inside an object. You''re
    free to “talk” to any method or member variable you want to. Whether you should
    access them directly is another question altogether. Often, the developer who
    built the class will provide member variables and methods that are meant for internal
    use, only for storing some temporary data about the state of the object while
    it''s in use. As a result, there is no enforcement of object privacy in PHP 4,
    many developers will use comments to mark a class or variable as private, thereby
    telling other developers not to use it.


    These access control markers will be spotted by an API documentation parser; the
    generated documentation will indicate which methods and variables are intended
    for public use, and which are private.


