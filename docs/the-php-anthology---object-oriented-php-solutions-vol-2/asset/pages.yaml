    # How do I let users change their passwords?


    You''re now able to deal with people who have forgotten their passwords. What
    about people who want to change their passwords?


    A good "test of design" for many PHP applications is whether users can change
    their passwords without needing to log back into the application afterwards. It''s
    important to consider your site''s users if you want to stick around. Changing
    their passwords should not require users to log back in, provided you construct
    your application carefully.


    Going back to the session-based authentication mechanism we saw earlier in this
    chapter, you''ll remember that the login and password are stored in session variables
    and rechecked on every new page by the Auth class. The trick is to change the
    value of the password in both the session variable and the database when users
    change their passwords.


    First first! Let''s build a new login page using QuickForm:


    ```

    <<?php

    Include QuickForm class

    require_once ''HTML/QuickForm.php'';


    If $_GET[''from''] comes from the Auth class

    if (isset($_GET[''from''])) {

    $target = $_GET[''from''];

    } else {

    // Default URL: usually index.php

    $target = ''12.php'';

    }


    // Instantiate the QuickForm class

    $form = new HTML_QuickForm(''loginForm'', ''POST'', $target);


    // Add a header to the form

    $form->addHeader(''Please Login'');

    ```'
