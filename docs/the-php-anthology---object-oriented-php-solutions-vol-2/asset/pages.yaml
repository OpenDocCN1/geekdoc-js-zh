  md: "For example, let's say we want to analyze a text document to ascertain how\
    \ many vowels and consonants it contains. We might parse the document, create\
    \ objects to represent the elements of the document in we're interested. We can\
    \ then go back and analyze these objects to get the statistics we're interested\
    \ in.\n\nTo start, let's put together a class, TextStats, which will parse documents\
    \ using a character by character approach, taking advantage of PHP's ability to\
    \ treat strings as arrays:\n\n```\n/**\n * Class for Analyzing Text\n */\nclass\
    \ TextStats {\n    /**\n     * The document to analyze\n     */\n    var $doc;\n\
    \    /**\n     * An array of Vowel and Consonant objects\n     */\n    var $chars\
    \ = array();\n\n    function TextStats($doc) {\n        $this->doc = $doc;\n \
    \       $this->buildStats();\n    }\n\n    /**\n     * Calls a factory method\
    \ to get a Vowel or Consonant\n     */\n    function buildStats() {\n        $length\
    \ = strlen($this->doc);\n        for ($i=0; $i<$length; $i++) {\n            //\
    \ Factory method called here\n            if ($char = &Factory::getChar($this->doc[$i]))\
    \ {\n                $this->chars[] = $char;\n            }\n        }\n    }\n\
    }\n```"
  merge: -1
  pgno: 172
- img_proc: true
  md: "# Chapter 7: Design Patterns\n\nOf particular interest in the above section\
    \ of code is the buildStats method, which statically calls the factory method,\
    \ getChar, in the CharFactory class. Using this approach, we can leave to the\
    \ factory method the task of working out what to do with the current character;\
    \ this keeps the buildStats method very simple.\n\nTo finish off the TextStats\
    \ class, we add a couple of methods to determine how many vowels and consonants\
    \ the document contains:\n\n```\n/**\n * Find out how many Vowels in document\n\
    \ */\nfunction numVowels()\n{\n  $vowels = 0;\n  reset($this->chars);\n  foreach\
    \ ($this->chars as $char) {\n    if (is_a($char, 'Vowel')) {\n      $vowels++;\n\
    \    }\n  }\n  return $vowels;\n}\n\n/**\n * Find out how many Consonants in document\n\
    \ */\nfunction numConsonants()\n{\n  $consonants = 0;\n  reset($this->chars);\n\
    \  foreach ($this->chars as $char) {\n    if (is_a($char, 'Consonant')) {\n  \
    \    $consonants++;\n    }\n  }\n  return $consonants;\n}\n```\n\nNow, let's look\
    \ at the factory method itself. It takes a single character as its argument and\
    \ examines it first with a regular expression. Should it decide that the character\
    \ is a letter of the alphabet, then it performs a second character to see"
  merge: -1
  pgno: 173
- img_proc: true
  md: "whether the letter is a vowel. The factory method then creates an instance\
