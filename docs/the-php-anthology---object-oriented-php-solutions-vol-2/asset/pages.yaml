    \ | +getBody() |\n\n| TextBody | HtmlBody |\n| | |\n\n| EmailSender |\n| +numConsonants(in\
    \ : string, in body : object) \n\nThat should give you a feel for the types of\
    \ problems factory methods can help you deal with, as well as the different approaches\
    \ you can take to apply them. You should also have a better idea about what the\
    \ concept of Design Patterns actually means; it’s really nothing mysterious—just\
    \ good sense.\n\n# # The Iterator Pattern\n\n> Iterate, v. t. To utter or to second\
    \ once or many times; to repeat.\n—Webster’s 1913 Dictionary\n\nAn iterator is\
    \ an API (a group of methods) that makes it possible to access collections in\
    \ a uniform manner. By collections, I mean data sets such as arrays, query results\
    \ from MySQL, the lines in a file, or any other data structure that can be thought\
    \ of as a group of data items. The common way to talk about an iterator in action\
    \ is to say you’re iterating over a collection.\n\nWhat an iterator allows you\
    \ to do is write code that accesses a collection in such a way that it doesn’t\
    \ actually matter what that collection contains."
