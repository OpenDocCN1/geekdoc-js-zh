  md: "# PEAR::PHPUnit: http://pear.net/package/PHPUnit\n\nIntended as the test framework\
    \ for PEAR, PHPUnit is likely to become the facto Unit Test tool once PHP 5 arrives.\
    \ However, the current version (0.6.2) has a number of bugs and is on hold, pending\
    \ the release of PHP 5.\n\n# SimpleTest: http://www.lastcraft.com/simple_test.php\n\
    \nDeveloped by Marcus Baker, this is my own test framework of choice, and the\
    \ one I used to test the code for this book. Although the current version is still\
    \ Alpha, what's missing advanced functionality; I found the core to be very stable,\
    \ as well as an excellent study of design patterns applied in PHP. More importantly,\
    \ it has some important features, in particular Mock Objects (see below) and “Web\
    \ test” tools (these are still work in progress), which, at a trivial level, can\
    \ find broken links on your site, for example. More importantly, they can be an\
    \ essential element in confirm your site's security.\n\nSimpleTest is the test\
    \ framework we'll be using here, to demonstrate how unit testing works.\n\nFirst,\
