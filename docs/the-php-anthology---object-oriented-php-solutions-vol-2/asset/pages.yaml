  md: "```\n$this->colors = array('red', 'green', 'blue');\n// This method iterates\
    \ over the colors array\nfunction fetch() {\n  // Use the each() function to get\
    \ the current value and step\n  // forward\n  $color = each($this->colors);\n\n\
    \  // If $color wasn't false...\n  if ($color) {\n    // Return the value\n  \
    \  return $color['value'];\n  }\n  \n  // If $color is false (reached the end\
    \ of the array)...\n  } else {\n    // Reset the colors array\n    reset($this->colors);\n\
    \    // Return false\n    return FALSE;\n  }\n}\n```\n\nNow, although the class\
    \ doesn't do anything useful, as we'll momentarily, the fetch method makes it\
    \ possible to iterate over the contents of the $colors array in a very similar\
    \ manner to a foreach loop.\n\nLet's take a closer at the fetch method. The first\
    \ thing we do is to use PHP’s each function to pull the current element from the\
    \ $colors array. Each function automatically moves an array pointer forward after\
    \ it's returned the current value, which makes it a handy function for iterating\
    \ over arrays. The value returned from each is a little unusual, though; it's\
    \ both an associative array with the keys 'key' and 'value', an indexed array\
    \ where element 0 is the key name and element 1 is the value. Here's what each\
    \ returns for the first element of $colors array:\n\n# Array\n\n+   [0] => 0\n\
    [1] => red\n[key] => 0\n[value] => red"
