    }\n```\n\nThe resetPassword method, when given a combination of a login and an\
    \ email address, identifies the corresponding row in the user table, and calls\
    \ the generatePassword method (which we will discuss in a moment) to create a\
    \ new password. It updates the user table with the new password (using md5 to\
    \ encrypt it), and returns the new password in an array containing the user details.\
    \ If you're using a different table structure, you will need to modify this method.\n\
    \nNote that we use both login and email to identify the row, so it's a little\
    \ more difficult for other people to reset your members' passwords. There's no\
    \ risk in individuals stealing the new password (unless they have control over\
    \ a member's email account), it will certainly irritate people if their password\
    \ was continually reset. Requiring the login name and email of the user makes\
    \ it a little more complex.\n\nOf the next two methods, addWords is used to supply\
    \ the class with an indexed array of words to build memorable passwords, while\
    \ generatePassword constructs a random password from this list, separators that\
    \ could be any number from 0 to 9, or an underscore character. The password itself\
    \ will contain two words chosen from random, as well as two random separators.\
    \ The order in which these elements appear in the password is also random. The\
    \ passwords this system generates like \"7correct9computer\" and \"48outclothes,\"\
    \ which are relatively easy for users to remember.\n\nClick here to order The\
