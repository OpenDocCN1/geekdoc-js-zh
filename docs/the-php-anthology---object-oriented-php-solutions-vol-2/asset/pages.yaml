    As we can see, after only few iterations, isBlue turned out to be almost twice
    as long as isBlueFast. Of course, the results would be unpredictable; it could
    be that on a particular run the values were ''blue'', which would make isBlueSlow
    quicker. By designing the code to reflect the most probable input, you can improve
    the overall performance of the application on average.


    Note that when we called xdebug_dump_function_profile, we passed the constant
    XDEBUG_PROFILE_NC, which tells Xdebug to merge all function calls from the same
    line into single entry in the output. There are a number of different profiling
    modes Xdebug provides to give you different "views" of what''s actually happening
    in your PHP script. These modes range from a list of slowest function calls in
    order of execution time, to averages for each function. See the Xdebug documentation
    for further details.


    Although this example may seem trivial, it''s common for applications to have
    many such "probable conditions"; by weighting all code to the most probable outcome,
    the end effect for a large application can be a significant increase in performance.


