  md: "# Chapter 1: Access Control\n\nOnce you've done that, the next step is to override\
    \ some php.ini settings with a .htaccess file containing:\n\nFile: mysql_session_handler/.htaccess\n\
    \n```\nphp_value session.save_handler 'user'\nphp_value session.save_path 'php_sessions'\n\
    php_value auto_prepend_file '/path/to/mysql_session_handler.php'\n```\n\nThe first\
    \ line tells PHP that rather than using its default session handling mechanism,\
    \ it will be told to handle sessions by your own code. The session.save_path refers\
    \ to the name of the table where sessions are stored. The last line tells PHP\
    \ to execute the mysql_session_handler php every time any script is executed.\n\
    \nFinally, you need to create a table called php_sessions with the structure:\n\
    \n```\nCREATE TABLE php_sessions (\n  session_id VARCHAR(40) NOT NULL DEFAULT\
    \ '',\n  last_active INT(11) NOT NULL DEFAULT '0',\n  data TEXT NOT NULL,\n  PRIMARY\
    \ KEY (session_id)\n```\n\nWith the .htaccess file placed in your web root directory,\
    \ all PHP scripts will store the session data in MySQL rather than in files.\n\
    \nThe data stored by sessions has a format that looks like this:\n\n```\nmyVar|s:11:\"\
    Hello World\";ip_address|s:9:\"127.0.0.1\"\n```\n\nVariables are separated by\
    \ semicolon or {} in the case of arrays, while within each variable, the name\
    \ and value are separated by |. The value itself is stored in a serialized format\
    \ (see the PHP Manual[11] for details).\n\nSo the above example corresponds to\
    \ two variables:\n\n> ⁴The PHP configuration setting auto_prepend_file can only\
    \ be set in php.ini or by a .htaccess file. If you can't use .htaccess in that,\
    \ you'll need to include mysql_session_handler.php in all your scripts, which\
    \ is best done by adding it to a script that is already included by all others,\
    \ such as where you need central configuration information. The configuration\
    \ values session.save_handler and session_save_path can both be controlled with\
    \ the ini_set function (see Appendix A for more details). These will also need\
    \ to be included in every script.\n\n[11] http://www.php.net/serialize\n\nClick\
    \ here to order The PHP Anthology Volume I & II and get 25% off!"
