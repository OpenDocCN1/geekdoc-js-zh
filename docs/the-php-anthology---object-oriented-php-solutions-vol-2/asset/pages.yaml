  md: '# Further Reading


    You can even register a single observer with multiple observables, so that it
    reacts to events from any of them!


    A hybrid form of the observer pattern is commonly used when parsing XML documents
    with SAX. Rather than a single update method, the observer has multiple methods,
    such as startElementHandler and endElementHandler, which are called on the basis
    of their context within the XML document. PEAR::Log also uses a of observer pattern
    to allow the triggering of events on log updates.


    It''s likely that the observer pattern will become more widely used in PHP applications.
    Much like Java, PHP 5 provides interface classes, which can be implemented by
    a class that already has a parent it extends. This allows the observable and observer
    APIs to be implemented without disturbing any class hierarchy.


