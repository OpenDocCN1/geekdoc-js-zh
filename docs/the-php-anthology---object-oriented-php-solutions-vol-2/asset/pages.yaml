  md: "# Chapter 1: Access Control\n\n```\n}\n  exit();\n}\n```\n\nUnless you tell\
    \ it not, this method will send the from variable via the query string to the\
    \ script to the browser is redirected. This allows the login form to return the\
    \ users to the location from which they came; it saves the users from having to\
    \ navigate back to that point, which might be useful if, for example, a session\
    \ times out. Note that in the logout method we specified that redirect should\
    \ not provide the from variable. If it did, the script might return users to the\
    \ URL they used to log out, putting them in a loop from which they couldn't in.\n\
    \nOne important note to make is that the redirection URL (which is set by the\
    \ constructor) should be absolute, not relative. According to the HTTP specification,\
    \ an absolute URL must be provided when a Location header is used. Later, on we\
    \ put this class into. I am going to break that rule and use a relative URL, because\
    \ I can't guess the script's location on your server. Because most recent browsers\
    \ understand it (even though shouldn't). On a live site, make sure you provide\
    \ a full, absolute URL.\n\nFinally, and most importantly, we use exit to terminate\
    \ all further processing. This prevents the calling script sending the protected\
    \ content that follows the authentication code. Although we sent a header that\
    \ should redirect the browser, we cannot rely on it. If the request was sent by,\
    \ for instance, a Perl script pretending to be a Web browser, whoever was using\
    \ the script, no doubt, have total control over its behavior and could easily\
    \ ignore the instruction to redirect elsewhere. The exit statement is critical.\n\
    \nOverall, this approach saves us from our own mistakes: if a user is not valid,\
    \ script execution halts and the user is redirected to \"safe\" page. The alternative\
    \ approach might be to build conditional statements into a page, like this:\n\n\
    ```\nif ($auth->login()) {\n  echo 'You are logged in';\n} else {\n  echo 'Invalid\
    \ login';\n}\n```\n\nHowever, this isn't really a good idea. In a more complex\
    \ scenario, which involves multiple file inclusions, and classes take responsibility\
    \ for different parts of"
