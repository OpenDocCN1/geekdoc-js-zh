  md: '# How do I set up automated tests of my code?


    That theory probably doesn''t apply to the majority of PHP projects, unless you
    knock up a simple application in a matter of minutes. However, you''re planning
    to delete the source file at the end of the day, it''s likely that the code will
    gradually take a life of its own, becoming a critical component of your site and
    a source of panic when you realize you didn''t test it carefully.


    What Unit Testing for to automate the code testing process. Near the start of
    any new piece of code, you write a script that is designed to test it on what
    you want to do. The tests in place, you''re able to re-execute them as many times
    as you like; they''ll give you a very good idea of whether the code is broken,
    and, if there is a problem, a clear indication of where it lies.


    As projects grow to comprise numerous integrated components that rely on one to
    another, being able to automatically to test each piece becomes essential to the
    success of the project. All you have to do is invest the energy in writing the
    test scripts up-front...


    There are two approaches to testing: **black box testing** (which is really what
    I''m talking about here) and **white box testing**.


    Black box testing outside the code that''s being tested (the code is referred
    to as a black box), passing data to the code and examining what it gets back.
    This approach is particularly useful for classes that have a clear API. It also
    means that you don''t have to mess with the code you''re testing.


    White box testing takes the view that everything, and perhaps should, be tested,
    so there''s no hiding APIs for those nasty bugs! It generally requires implanting
    the tests directly into the code being tested. In some cases it''s essential—a
    class method may return the correct value but some operation performed "behind
    the scenes" could have gone horribly wrong. You may already have used white box
    testing without realizing it, for instance, when using print statements inside
    a class to find out what it''s doing internally.


    # Gray Box Testing


    The weaker encapsulation of PHP 4 (i.e. its lack of support for private/protected
    classes) provides one potential advantage. It makes possible for us to use a hybrid
    of black box and white box testing (gray box?) by accessing class member variables
    directly for test purposes, which can help pinpoint problems more accurately.
    You probably won''t impress any object oriented purists, though...


    ![](img/6a0950c1e66e475bee8d64cd7301788c_156_0.png)'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Chapter 6: Development Technique


    # Test Infected


    Using Unit Testing as a development habit involves more than just adding tests
    to a project as an afterthought. In fact, the Extreme Programming methodology
    advocates writing the test scripts before developing the meat of your code. The
    argument behind this is that writing the test scripts helps you analyze the design
    of your classes'' APIs without having to sit down and decide, "now, I''m going
    to analyze the API."


    The general process of development with Unit Tests looks like this:


    +   1. Design your API, perhaps with blank classes.

    2. Create a test suite, modifying your API design as required to take into account
    this deeper insight.

    3. Fill in the "blanks" of your class; write the code that does the real work.

    4. Execute the test suite.

    5. Fix logic errors, then repeat step 4 ad infinitum.


    At first glance, this is clearly more than the sort of development process you''ll
    be used to if you''re not writing Unit Tests today. The mission you have to set
    yourself to be "test infected" by continually turning it until you can''t code
    without the warm glow it gives you. Gradually, this approach will start to become
    a habit and, I promise, you will be wondering how you ever managed to code anything
    without it! If it goes to plan, you will become so good at Unit Testing that it
    will save you time over the old trial-and-error coding method!


    # Test Drive


    Now that we know what Unit Testing is supposed to involve, it''s time to put it
    into practice with an example. The first problem to overcome, though, is selecting
    a Unit framework to help you. There are at least five that I''m aware of, which
    can be confusing, as they all have more or less the same name. On the list of
    either "very stable or actively developed" are:


    PhpUnit: http://phpunit.de/

    This is probably the most stable test framework in PHP, though seemingly

    o longer being developed.'
