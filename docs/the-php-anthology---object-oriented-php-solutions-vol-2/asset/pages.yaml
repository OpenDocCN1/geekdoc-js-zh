    \ to call the add method that whichever factory class has been created. Once we've\
    \ stored an instance of either HtmlBody or TextBody in the $body reference, we\
    \ simply pass it to the $sender to handle the email sent to the customer.\n\n\
    ```\n// Create the sender\n$sender = &new EmailSender();\n\n// Loop through the\
    \ customers\nforeach ($customers as $customer) {\n    // Decide which factory\
    \ class to create\n    switch ($customer['emailpreferred']) {\n        case 'html':\n\
    \            // Create the factory\n            $factory = &new HtmlFactory();\n\
    \            // Call the factory method\n            $body = &&factory->getBody($htmltext);\n\
    \            break;\n        case 'text':\n            // Create the factory\n\
    \            $factory = &new TextFactory();\n            // Call the factory method\n\
    \            $body = &&factory->getBody($plaintext);\n            break;\n   \
    \ }\n    // \"Send\" the message\n    $sender->sendMessage($customer['email'],\
