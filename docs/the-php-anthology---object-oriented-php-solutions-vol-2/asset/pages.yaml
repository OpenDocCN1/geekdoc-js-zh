  md: '# Chapter 1: Access Control


    This means


    To keep the session ID completely hidden, you''ll need to use SSL to encrypt the
    conversation. What''s more, you should only use the cookie method of passing the
    session ID. If you pass it in the URL, you may give away the session ID upon referring
    the visitor to another site, thanks to the referrer header in the HTTP request.


    The PHP creates for the purpose of storing session information are, by default,
    stored in the temporary directory of the operating system when PHP is running.
    On Unix systems such as Linux, this will mean that others on the server can read
    the files. They may not be able to identify which virtual host and PHP script
    are the owners of the session but, depending on the information you place, they
    may be able to guess.


    This is a serious cause for concern on shared PHP systems; the most effective
    solution is to store your sessions in a database, rather than the server''s directory.
    We''ll look more closely at custom session handlers later in this chapter, but
    a partial solution is to set the session.save_path option to a directory that''s
    not available to the public. You''ll need to contact your hosting company in order
    to have the correct permissions for that directory, so that ''nobody'' or ''wwwuser''
    with PHP runs has access to read, write, and delete files in that directory.


    # Session IDs and Cross-Site Scripting


    One final warning using a common Web security exploit, cross-site scripting (XSS),
    it''s possible for an attacker to place a JavaScript on your site that will cause
    visitors to give away their session ID to a remote Website, allowing their sessions
    to be hijacked. Whether you post any HTML, make check and validate very carefully
    (Appendix C for XSS and Volume 1, Chapter 5 for an HTML filtering mechanism).


    Remember the golden rules: never rely on client technologies (such as JavaScript)
    to handle security and never trust anything you get from a browser.


