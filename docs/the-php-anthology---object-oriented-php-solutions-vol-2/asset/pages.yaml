  md: "```\n/**\n * Add a list of words to generate passwords\n * @param array\n *\
    \ @return void\n * @access public\n */\nfunction addWords($words) \n{\n    $this->words\
    \ = $words;\n}\n```\n\n```\n/**\n * Generates a random but memorable password\n\
    \ * @return string the password\n * @access private\n */\nfunction generatePassword()\
    \ \n{\n  rand((double)microtime() * 1000000);\n  $separators = range(0,9);\n \
    \ $separators[] = '-';\n  $count = count($this->words);\n  if ($count == 0) {\n\
    \    return FALSE;\n  }\n  $password = array();\n  for ($i = 0; $i < 4; $i++)\
    \ {\n    if ($i % 2 == 0) {\n      shuffle($this->words);\n      $password[$i]\
    \ = trim($this->words[0]);\n    } else {\n      shuffle($separators);\n      $password[$i]\
    \ = $separators[0];\n    }\n  }\n  shuffle($password);\n  return implode('', $password);\n\
    }\n```\n\nFirst, we add to the form a new field for the user to enter their login\
