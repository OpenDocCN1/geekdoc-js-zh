  md: 'Now, you may be fairly overwhelmed by the tests we''ve completed. Why bother
    testing simple variable assignments like this? The Stamp class is very basic,
    after all. While that''s true at the moment, this test script defines how we expect
    the Stamp API to behave, and by having the test written for it, we''ve essentially
    set the API “in concrete”. This is important because other code will depend on
    the Stamp class to perform in a particular way. In some point in the future, we
    could decide to make a few minor modifications to the Stamp constructor, for instance,
    change the type of the price from an integer to a string; although, technically,
    this won''t break the Stamp class, it will change the API (remember the tags in
    the method that describe the types), which may cause issues. Simple Unit Tests
    like these will catch these kinds of mistakes.


    In short, the idea is to write the simplest set of tests that will ensure that
    the behavior of the class will exactly match its API documentation.


