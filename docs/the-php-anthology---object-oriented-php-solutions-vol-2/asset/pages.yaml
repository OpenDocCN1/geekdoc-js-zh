  md: "# Cache_Lite Options\n\nWhen instantiating Cache_Lite (or any of its subclasses,\
    \ such as Cache_Lite_Output), there are a number of ways to control its behavior.\
    \ These should be placed in an array and passed to the constructor as in the previous\
    \ example:\n\n```\n// Define options for Cache_Lite\n$options = array(\n  'cacheDir'\
    \     => './cache/',\n  'writeControl' => TRUE,\n  'readControl'  => TRUE,\n \
    \ 'readControlType' => 'md5'\n);\n\n// Instantiate Cache_Lite_Output\n$cache =\
    \ new Cache_Lite_Output($options);\n```\n\nIn the current version (1.1) the available\
    \ options:\n\n+   **cacheDir** This is the directory in which the cache files\
    \ will be placed. This defaults to the current script execution directory.\n\n\
    +   **caching** This option switches on or off the cache behavior of Cache_Lite.\
    \ If you have numerous Cache_Lite calls in your code and want to disable that\
    \ for debugging, for example, this will be important. The default value is TRUE\
    \ (caching enabled).\n\n+   **lifetime** This represents the default lifetime\
    \ (in seconds) of cache files. It can be changed using the setLifetime method.\
    \ The default value is 3600 (one hour).\n\n+   **fileNameProtection** With this\
    \ option activated, Cache_Lite uses an MD5 encryption hash to generate the filename\
    \ for the cache file. This protects you from error when you try to use IDs or\
    \ group names containing characters aren't valid for filenames; it must be turned\
    \ on when you use Cache_Lite_Function. The default is TRUE (enabled)."
