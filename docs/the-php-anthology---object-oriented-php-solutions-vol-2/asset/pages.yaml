- img_proc: true
  md: 'Once the session has been established, it will continue until it is specifically
    destructed by PHP (in response to a user clicking "Log out", for example), or
    the session has been inactive for longer than a given period of time (24 minutes
    by default), at which point it becomes flagged for garbage collection and will
    be deleted the next PHP checks for outdated sessions.


    The following HTTP response headers show a server passing a session cookie to
    a browser, as a result of the session_start function in a PHP script:


    ```

    HTTP/1.1 200 OK

    Date: Wed, 26 Feb 2003 02:23:08 GMT

    Server: Apache/1.3.27 (Unix) PHP/4.3.1

    X-Powered-By: PHP/4.3.1

    Set-Cookie: PHPSESSID=ce558537fb4faee349bb8d48c5dcc63; path=/

    Connection: close

    Content-Type: text/html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.0 Strict//EN"

    "http://www.w3.org/TR/xhtml1/xhtml1-strict.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    ```


    Note that I''ve said sessions are stored on the server as files. It''s possible
    to store sessions using other means, such as a database or ever shared memory.
    This can be useful for displaying "Who is Online" type information as well as
    load balancing multiple Web servers using a single session repository, allowing
    visitors to (unnowingly) swap servers while maintaining their session.


    # Session Security


    Sessions are very useful, but there are some security considerations you should
    take into account when using them in your applications:


    +   By default, all browser has to do gain control of a session is pass valid
    session ID to PHP. In an ideal world, you could store the IP address that registered
    the session, and double check it on every new request that used the associated
    session ID. Unfortunately, some ISPs, such as AOL, assign users a new IP on every
    page request, so this type of security mechanism would soon start throwing valid
    users out of the system. As such, it''s important to design your application in
    a manner that assumes that one of users will eventually have his or her session
    "hijacked." The user''s account is only exposed as long as the session expired,
    your focus should be on preventing the hijackers from doing damage while they''re
    in the system.'
