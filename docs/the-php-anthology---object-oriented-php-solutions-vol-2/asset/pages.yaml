  md: "# Chapter 7: Design Patterns\n\n```\n/* Constructs the Observable object\n\
    \ */\nfunction Observable() {\n    $this->observers = array();\n}\n```\n\n```\n\
    /**\n * Calls the update() function using the reference to each\n * registered\
    \ observer, passing an optional argument for the\n * event - used by children\
    \ of Observable\n * @return void\n */\nfunction notifyObservers($arg = NULL) {\n\
    \    $keys = array_keys($this->observers);\n    foreach ($keys as $key) {\n  \
    \      $this->observers[$key]->update($this, $arg);\n    }\n}\n```\n\n```\n/**\n\
    \ * Attaches an observer to the observable\n * @return void\n */\nfunction addObserver(&$observer)\
    \ {\n    $this->observers[] = &&$observer;\n}\n```\n\nLet's take a moment to review\
    \ the methods here. addObserver is used to register an object with the observable,\
    \ and add it to the internal array of observers. This is used before the observable\
    \ class does anything, and sets the scene for the observers to respond to events.\n\
    \nThe notifyObservers method is used by the observable to tell all observers that\
    \ something has happened. It takes an optional argument, so that, if need, the\
    \ observable can tell observers something about the event efficiently. This method\
    \ calls the update method for each observer, passing a reference to the observable\
    \ with the argument:\n\n```\n$this->observers[$key]->update($this, $arg);\n```\n\
