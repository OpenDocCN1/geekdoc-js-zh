  md: '# Chapter 5: Caching


    If you have a central script that''s included in every page visitor views, you
    can simply wait for incoming events (e.g. a variable like $_GET[''newPost''])
    and have some code respond by deleting the required cache files. This keeps the
    cache removal mechanism clean and easier to maintain. You might also consider
    using the php.ini setting auto_prepend_file to include this in every PHP script.


    # Caching Function Calls


    In Chapter 2, we looked at accessing remote Web services with SOAP and XML-RPC.
    Because Web services are accessed over a network, it''s often a very good idea
    to cache results so that they can be fetched, rather than repeating the same slow
    request multiple times. A simple approach might be use PHP sessions, as we considered
    in that chapter, but as solution operates on per visitor basis, the opening requests
    for each visitor will still be slow. This is where Cache_Lite can come in very
    handy.


    # PEAR uses Cache-Lite


    > > note

    The PEAR Web installer (see Appendix D) takes advantage of Cache-Lite by caching
    the XML-RPC requests it makes to the PEAR server.


    How do I consume SOAP Web services with PHP? In Chapter 2, we built a client for
    a SOAP Web service based on a WSDL file; the service provided weather information
    for airports around the world. Here''s the code that fetched the data from the
    remote server:


    ```

    $countries = $stationInfo->listCountries();

    ```


    and


    ```

    $country = $stationInfo->searchByCountry($_GET[''country'']);

    ```


    In both cases, these correspond to a request for data that''s made over the network.
    Using Cache_Lite_Function, we could cache the results so the data returned from
    the service could be reused; this would avoid unnecessary calls and significantly
    improve performance. That we''re focusing on only the relevant code here. At the
    top, we use Cache_Lite_Function:


    ```

    // File: 5.php (excerpt)

    // Include PEAR::Cache_Lite_Function

    require_once ''Cache/Lite/Function.php'';

    ```'
