    \ result set, an XML document, a text file, a directory, or just a plain old array\
    \ without needing to modify the code of the table-generating class. Using iterators,\
    \ such a thing is possible. Iterators allow you to write a table-generating class\
    \ that could be reused to display many different types of data from different\
    \ sources.\n\nTo begin with, consider the normal process of looping through an\
    \ array:\n\n```\n<?php\n$colors = array('red', 'green', 'blue');\necho '<b>First\
    \ iteration:</b><br />';\nforeach ($colors as $color) {\n    echo $color . '<br\
    \ />';\n}\n\necho '<b>Second iteration:</b><br />';\nforeach ($colors as $color)\
    \ {\n    echo $color . '<br />';\n}\n?>\n```\n\nThe foreach construct, which is\
    \ built into PHP, effectively acts as a simple iterator. It steps through an array\
    \ by element, and, when it reaches the end of the array, it automatically returns\
    \ to the start. This explains why it is possible to use foreach twice without\
    \ needing to use PHP's reset function to reset the array pointer in the example\
    \ above. Unfortunately, this won't work for an object for which you have defined\
    \ your own data access methods.\n\nHere's an example that allows me to achieve\
    \ the same result using a method that will perform the iteration for me:\n\n```\n\
    <?php\nclass Colors {\n    // An array where the colors are stored\n    var $colors;\n\
    \    function Colors() {\n\n```\n\n> ³At least, not with PHP 4; with PHP 5, a\
    \ new extension, known as the Standard PHP Library (SPL), will make it possible\
    \ to access objects with foreach."
