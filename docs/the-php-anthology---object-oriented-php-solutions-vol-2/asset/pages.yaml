  md: "# The Observer Pattern\n\nThe **observer pattern** is a useful solution for\
    \ triggering events upon a specified occurrence within your application.\n\nFor\
    \ example, you may have a back end administration tool that allows authorized\
    \ users to add articles to your Website. When an article is published, a number\
    \ of things may need to happen in addition to storing the content in the database;\
    \ for instance, you may need to refresh the site's cached HTML files, send an\
    \ email to subscribers to inform them of the new content, and update a static\
    \ XML document that contains your site's RSS feed, which others use to stay up-to-date\
    \ about the content you publish. The observer pattern makes triggering these additional\
    \ features easy and modular.\n\nThe terminology of the observer pattern is that\
    \ the object doing the work (in this case, perhaps it's a class called Article)\
    \ is the **observable**, while the objects that respond to changes in the observable\
    \ (i.c. the cache-, email-, and RSS-related classes) are known as **observers**.\
    \ The general process of using the observer pattern is to attach the observers\
    \ to the observable. Then, when changes occur in the observable, it notifies the\
    \ observers, leaving them to take further action.\n\nUnderstanding how the observer\
    \ pattern works in practice can be a little confusing. Look at the base classes\
    \ required to implement it, but it doesn't make sense at first glance; using the\
    \ observer pattern is a lot easier than understanding it!\n\nFirst, let's look\
    \ at the base Observable class:\n\n```\n<?php\n/**\n * Base Observer class\n *\
    \ @abstract\n */\nclass Observable {\n    /**\n * Array of Observers\n * @access\
    \ private\n * @var array\n */\n    var $observers;\n\n/**\n```"
