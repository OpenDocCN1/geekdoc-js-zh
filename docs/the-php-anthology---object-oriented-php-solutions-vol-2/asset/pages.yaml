    \ */\nfunction sessionAuth($login, $password)\n{\n    $this->session->set(USER_LOGIN_VAR,\
    \ $login);\n    $this->session->set(USER_PASSW_VAR, $password);\n\n    // Create\
    \ a session variable to use to confirm sessions\n    $hashKey = md5($this->hashKey\
    \ . $login . $password);\n    $this->session->set('login_hash', $hashKey);\n}\n\
    ```\n\nThe storeAuth method is used to add the user name and password to the session,\n\
    with a hash. This is comprised of a seed value using the Auth\nclass (remember\
    \ the $hashKey parameter required by the constructor?), as\nthe user name and\
