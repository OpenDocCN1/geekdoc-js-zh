    \ digest. A particular string will always produce the same digest, but it is practically\
    \ impossible to guess a string that will produce a given digest. By storing only\
    \ the MD5 digest of your users' passwords in the database, you can verify their\
    \ login credentials without actually storing the passwords on your server! The\
