  md: '# Preface


    When dealing with these more advanced subjects, my goal is not to provide all
    the answers (many are worthy of books in themselves), but to open doors to new
    concepts for you to explore further on your own.


    My hope is that this book will enrich your understanding of PHP and motivate you
    to raise your development practices to a professional level, allowing you to change
    your job description from "PHP hacker" to "PHP developer."


    # Who should read this book?


    This book, The PHP Anthology: Object Oriented PHP Solutions, Volume II, builds
    on the first book, The PHP Anthology: Object Oriented PHP Solutions, Volume I,
    to provide practical solutions that are commonly required in today''s online applications.
    So, if you build Websites and Web applications with PHP, then this book is for
    you.


    For experienced PHP developers, reading The PHP Anthology: Object Oriented PHP
    Solutions, Volume I before you start this book is a good idea, as many of the
    solutions presented here build on knowledge introduced in that volume. It should
    be possible for the PHP veteran to begin with this second book, referring to the
    code archive to fill any gaps.


    # What’s covered in this book?


    In summary, here''s what you''ll find in each of the chapters in this volume:


    +   Chapter 1: Access Control

    Beginning with basic HTTP authentication, moving on to application level authentication,
    this chapter looks at ways to control access to your site. Later solutions look
    at implementing a user registration system and creating a fine-grained access
    control system with users, groups and permissions.


    +   Chapter 2: XML

    With XML rapidly becoming an essential part of almost all Web-based applications,
    this chapter begins by exploring the SAX and DOM APIs to help parse an RSS feed,
    before examining the generation of your own RSS feed with DOM. Following that,
    we will see how XPath can be used to reduce the coding effort involved in parsing
    XML, then move on to XML transformations using XSLT. Finally, this chapter shows
    how Web services be built using PHP, XML-RPC and SOAP.'
  merge: -1
  pgno: 15
- img_proc: true
  md: "# Chapter 3: Alternative Content Types\n\nWith the wide range of media now\
    \ in use on the Internet, there's often a need to be able to use PHP to render\
    \ content types other than (X)HTML. This chapter begins by looking at PDF generation\
    \ using PHP, and how to convert content that contains embedded HTML markup into\
    \ PDF form. \nFollowing that, we'll look at generating SVG images with PHP, and\
    \ learn how to “WAP enable” a Website quickly and efficiently. Finally, this chapter\
    \ looks at how XUL can be applied to build more powerful administrative interfaces\
    \ to your application, reducing load on your server and speeding admin\n\n# Chapter\
    \ 4: Stats and Tracking\n\nHere, we will look at the all-important process of\
    \ gathering statistical information from visitors to your site. We will experiment\
    \ with various mechanisms we can use to capture data, and help you lay the foundations\
    \ that can become critical in improving the experience you offer users.\n\n# Chapter\
    \ 5: Caching\n\nThis chapter takes the fundamental view that “HTML is fastest,”\
    \ and shows how you can take advantage of caching on both the client and server\
    \ to reduce bandwidth usage and dramatically improve performance.\n\n# Chapter\
    \ 6: Development Technique\n\nThe goal of this chapter is to examine some of the\
    \ techniques that have proved themselves in helping development projects succeed.\
    \ The discussion covers common optimizations you might apply to your code, a summary\
    \ of N-Tier application design, how to add API documentation to your work, and\
    \ how to reduce bugs with unit testing.\n\n# Chapter 7: Design Patterns\n\nThe\
    \ notion of software Design Patterns has been widely accepted as a useful approach\
    \ to application design. This chapter introduces them as a concept, then illustrates\
    \ their implementation with five common patterns applied to “real” problems in\
    \ PHP: The Factory Method, The Iterator Pattern, The Strategy Pattern, The Adapter\
    \ Pattern, and the Observer Pattern.\n\n# The Book’s Website\n\nLocated at http://www.sitepoint.com/books/phpant1/,\
    \ the Website supporting this book will give you access to the following facilities:\n\
    \nClick here to order The PHP Anthology Volume I & II and get 25% off!"
