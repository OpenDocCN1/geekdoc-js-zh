- img_proc: true
  md: "# Chapter 7: Design Patterns\n\nwhich object is created will require you to\
    \ modify only the method that creates it.\n\nFor example, in Chapter 1 we developed\
    \ the class Auth, which creates an instance of the Session class:\n\n```\nClass\
    \ Auth {\n    function Auth($$db, $redirect, $hashKey, $md5 = TRUE) {\n      \
    \  $this->db = $$db;\n        $this->redirect = $redirect;\n        $this->hashKey\
    \ = $$hashKey;\n        $this->md5 = $$md5;\n        $this->session = &new Session();\
    \ // Session created\n        $this->login();\n}\n```\n\nWhat happens, instead,\
    \ we use a function createSession, to create the object for us? In that case,\
    \ we can replace the Session class with other class of a different name without\
    \ having to modify the Auth class:\n\n```\nClass Auth {\n    function Auth($$db,\
    \ $redirect, $hashKey, $md5 = TRUE) {\n        $this->db = $$db;\n        $this->redirect\
    \ = $redirect;\n        $this->hashKey = $$hashKey;\n        $this->md5 = $$md5;\n\
    \        $this->session = &createSession(); // Fetch new object\n        $this->login();\n\
    }\n```\n\nThis is particularly useful when writing tests that use mock objects\
    \ (see Chapter 6). In this case, we can modify the behavior of the createSession\
    \ function in the test script so MockSession is used by Auth, rather than the\
    \ real Session class.\n\nAnother problem to which the factory method can provide\
    \ a solution occurs when the choice of class will depend on runtime circumstances\
    \ that you can't predict in advance. You might wish to avoid writing conditional\
    \ logic at the point where the object is created, in order to help keep the code\
    \ maintainable and allow the same conditions to be used elsewhere in your application.\
    \ Using a factory method, you can separate the task of instantiating the objects\
    \ from the code that needs to use them.\n\nClick here to order The PHP Anthology\
    \ Volume I & II and get 25% off!"
