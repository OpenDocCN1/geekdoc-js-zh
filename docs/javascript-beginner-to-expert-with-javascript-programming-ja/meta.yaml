    # ## Statements in JavaScript


    Statements in JavaScript programming language are composed of the following.


    +   * Values

    * Operators

    * Expressions

    * Keywords, and

    * Comments.


    # ## Values in JavaScript


    The following are the two types of values in JavaScript.


    +   * Fixed values, and

    * Variable values.


    Literals are the fixed values and the variable values are known as variables.'
