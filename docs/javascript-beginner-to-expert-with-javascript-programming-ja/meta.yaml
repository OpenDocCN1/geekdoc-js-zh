    \ function.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Parameterized Function</title>\n<script type=\"text/javascript\">\n\
    ```\n\n```javascript\nfunction sayHelloToJavaScript(message,entity,lang) {\n \
    \ alert(message+\" to the \"+entity+\" world of \"+lang+\"!\");\n}\n</script>\n\
    </head>\n<body>\n  <input type=\"button\" onclick=\"sayHelloToJavaScript('Welcome','World','JavaScript');\"\
    \ value=\"Call JavaScript\"/>\n  <p>Body section of the HTML document.</p>\n</body>\n\
    </html>\n```\n\n## Output\n\nWhen we execute the above HTML program, the following\
