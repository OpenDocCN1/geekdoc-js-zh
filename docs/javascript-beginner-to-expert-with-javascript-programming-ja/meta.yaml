    \ the JavaScript support in Internet Explorer\n\nTo off or disable the JavaScript\
    \ support in Internet Explorer, follow the above steps and select to disable the\
    \ radio button under scripting caption.\n\n## Enabling the JavaScript support\
    \ in Mozilla Firefox\n\nThe following are the steps to turn on or enable JavaScript\
    \ support in Mozilla Firefox.\n\nOpen a new tab and type *about:config* in the\
    \ address bar.\n\nThere will find the following warning dialog Select and click\
    \ on the button “I’ll be careful, I promise!” as shown below.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_27_0.png)\n\
    \nHere, we will observe the list of configure options in the browser. In the search\
    \ bar, type javascript.enabled as shown below.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_27_1.png)\n\
    \nHere, we can find the option to enable or disable the javascript by right-clicking\
