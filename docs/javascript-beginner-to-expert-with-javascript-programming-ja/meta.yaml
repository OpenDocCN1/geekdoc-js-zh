- md: "\n## Chapter 10\n## JavaScript Loops\n\nWhen any program is executed, it runs\
    \ sequentially. The statement which appears first in the sequence is executed\
    \ first then the next statement and so on till the last statement of the program.\
    \ Many times there is a requirement to run same block of code in a program multiple\
    \ times then there arises a need of a control structure known as loops.\n\nA loop\
    \ makes a statement or group of statements in a block of code to execute multiple\
    \ times if the condition is true and exits the loop when the condition becomes\
    \ false. Such loop is illustrated in the below diagram.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_64_0.png)\n\
    \nLike any other programming language, the JavaScript support looping and the\
    \ following types of loops and the loop control statements.\n\n- While loop\n\
    - Do...while loop\n- For loop\n- for...in loop\n\n## Loop control statements\n\
    \n### While loop statement\n\nWhile loop is the most basic loop in JavaScript\
    \ language. This loop execute a statement or piece of code block repeatedly as\
    \ long as an expression is held true. The loop terminates, once an expression\
    \ is false. The following is the syntax and the example of while loop statement.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>While\
    \ Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar counter\
    \ = 0;\ndocument.write(\"Entering while Loop!\");\nwhile (counter < 5) {\ndocument.write(\"\
    Current Counter is : \" + counter + \"<br />\");\ncounter++;\n}\ndocument.write(\"\
    Exiting while Loop!\");\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The counter will write 5 times on the HTML page as it held\
    \ its condition true 5 times. \n\n![](img/80ff2aec61ff33d32cd503fad02658a7_66_0.png)\n\
    \n### Do...while loop statement\n\nThe do...while loop is similar to that of the\
    \ while loop except that the condition check in case of do...while loop happens\
    \ at the end of the loop. This means that the code block inside the loop will\
    \ always be executed at least once, even if the condition is false. The following\
    \ is the syntax and the example of while loop statement.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Do While Loop</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvar counter = 0;\ndocument.write(\"\
    Entering while Loop!\");\ndo {\ndocument.write(\"Current Counter is : \" + counter\
    \ + \"<br/>\");\ncounter++;\n}\nwhile (counter < 5)\ndocument.write(\"Exiting\
    \ while Loop!\");\n\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The counter will write 5 times on the HTML page as it held\
    \ its condition true 5 times including the first no check condition.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_67_0.png)\n\
    \n### For loop statement\n\nThe ‘for’ loop is very important and mostly used looping\
    \ statement in JavaScript programming. The command has the following three important\
    \ parts.\n\n- **Loop initialization** — it is where we initialize our counter\
    \ value to a starting value. This statement is executed before the looping begins.\n\
    - **Test statement** — it has the actual condition which is evaluated to be true\
    \ or false. If this condition evaluates to true, the block of code inside the\
    \ loop will be executed, otherwise, if false the control will exit the loop.\n\
    - **Iteration statement** — it is place where we increase or decrease the counter\
    \ value which was initialized in the first statement.\n\nThe good part of loop\
    \ is that we can put all of these three statement parts in a single line which\
    \ is separated by semicolons. The following is the syntax and the example.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>For\
    \ Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"\
    Entering while Loop!\");\nfor(counter = 0;counter < 5; counter++) {\ndocument.write(\"\
    Current Counter is : \" + counter + \"<br />\");\n}\ndocument.write(\"Exiting\
    \ while Loop!\");\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The counter will write 5 times on the HTML page as it held\
    \ its condition 5 times till the counter value becomes 5 and the loop exits.\n\
    \n![](img/80ff2aec61ff33d32cd503fad02658a7_69_0.png)\n\n### for...in loop statement\n\
    \nThe for...in loop is used only in the special cases where there is need to loop\
    \ through an object's properties. The for...in loop is the syntax and the example\
    \ of for...in loop.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>For In Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nvar prop;\ndocument.write(\"Object properties of navigator:<br />\");\nfor\
    \ (prop in navigator) {\n  document.write(prop + \": \" + navigator[prop] + \"\
    <br />\");\n}\n</script>\n<p>We are inside body section...</p>\n</body>\n</html>\n\
    ```\n\n### Output\n\nWhen we execute the above HTML program, the following will\
    \ be the output. In the output, we can see all the properties of navigator object\
    \ displayed.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_70_0.png)\n\n## Summary\
    \ of Loops\n\n| Loop Type | Description |\n|---|---|\n| while loop | While loop\
    \ type, repeats a statement or group of statements while a given condition is\
    \ true. |\n| for loop | For loop type executes a sequence of statements multiple\
    \ times. |\n| nested loops | It is a loop within a loop. In JavaScript, we can\
    \ use while loop in for loop. |\n\n## Loop control statements\n\nLoop control\
    \ statements in JavaScript are used to change execution from normal sequence.\
    \ When such execution leaves a scope, all automatic objects that were created\
    \ in that scope are destroyed. In JavaScript language, the following loop control\
    \ statements are supported.\n\n| Control Statement | Description |\n|---|---|\n\
    | break statement | The break statement in JavaScript is used to terminate the\
    \ loop and transfers execution to the statement following it. |\n| continue statement\
    \ | The continue statement in JavaScript is used to cause the loop to skip the\
    \ remainder of its body and immediately retest its condition. |\n\nLet's understand\
    \ these loop statement in a better way with the help of the following example.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Loop\
    \ Control Statement</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n    var counter = 0;\n    document.write(\"Entering while Loop!<br>\");\n\n\
    \    while (counter < 5){\n      if (counter == 3){\n        counter++;\n    \
    \    continue;\n      }\n      if (counter == 4){\n        break;\n      }\n \
    \   }\n    document.write(\"Current Counter is : \" + counter + \"<br />\");\n\
    \n    counter++;\n    document.write(\"Exiting while Loop!\");\n  </script>\n\
    \  <p>We are inside body section...</p>\n</body>\n</html>\n```\n\n### Output\n\
    \nWhen we execute the above HTML program, the following will be the output. In\
    \ the output, we can see that the counter value are printed 3 times (0, 1 and\
    \ 2) and then the loop exited. This is because when the counter value has become\
    \ 3, we are executing continue loop control statement where it has incremented\
    \ the counter to 4 and has skipped the document writing part and recheck the condition.\
    \ When the counter value has become 4, we are executing the break loop control\
    \ statement which will eventually exit out from the current loop skipping down\
    \ document writing statement again.\n"
  mdcn: "\n\n## 第 10 章\n## JavaScript 循环\n\n当任何程序执行时，它都是按顺序运行的。序列中第一个出现的语句首先执行，然后是下一条，依此类推，直到程序的最后一条语句。很多时候，需要在程序中多次运行同一块代码，这时就需要一种被称为“循环”的控制结构。\n\
    \n循环使得代码块中的一个语句或一组语句在条件为真时执行多次，并在条件变为假时退出循环。下图展示了这种循环。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_64_0.png)\n\
    \n与任何其他编程语言一样，JavaScript 支持循环以及以下类型的循环和循环控制语句。\n\n- While 循环\n- Do...while 循环\n\
    - For 循环\n- for...in 循环\n\n## 循环控制语句\n\n### While 语句\n\nWhile 循环是 JavaScript 语言中最基础的循环。只要表达式保持为真，该循环就会重复执行语句或代码块。一旦表达式为假，循环就会终止。以下是\
    \ while 语句的语法和示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>While Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nvar counter = 0;\ndocument.write(\"Entering while Loop!\");\nwhile (counter\
    \ < 5) {\ndocument.write(\"Current Counter is : \" + counter + \"<br />\");\n\
    counter++;\n}\ndocument.write(\"Exiting while Loop!\");\n</script>\n<p>We are\
    \ inside body section...</p>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上面的 HTML\
    \ 程序时，输出将如下所示。计数器会在 HTML 页面上写入 5 次，因为它其条件保持了 5 次为真。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_66_0.png)\n\
    \n### Do...while 循环语句\n\nDo...while 循环与 while 循环相似，不同在于 do...while 循环的条件检查发生在循环末尾。这意味着即使条件为假，循环内部的代码块也将至少执行一次。以下是\
    \ while 语句的语法和示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Do While Loop</title>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\nvar counter = 0;\ndocument.write(\"Entering while Loop!\"\
    );\ndo {\ndocument.write(\"Current Counter is : \" + counter + \"<br/>\");\ncounter++;\n\
    }\nwhile (counter < 5)\ndocument.write(\"Exiting while Loop!\");\n\n</script>\n\
    <p>We are inside body section...</p>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上面的\
    \ HTML 程序时，输出将如下所示。计数器会在 HTML 页面上写入 5 次，因为包括第一次没有检查条件外，其条件保持了 5 次为真。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_67_0.png)\n\
    \n### For 循环语句\n\n‘for’循环是 JavaScript 编程中非常重要且常用的循环语句。该命令包含以下三个重要部分：\n\n- **循环初始化（Loop\
    \ initialization）** —— 这是我们将计数器值初始化为起始值。该语句在循环开始之前执行。\n- **测试语句（Test statement）**\
    \ —— 它包含实际条件，该条件会被求值为真或假。如果该条件为真，将执行循环内部的代码块；否则，如果为假，控制将退出循环。\n- **迭代语句（Iteration\
    \ statement）** —— 这是我们增加或减少在第一个语句中初始计数器值的地方。\n\n循环的好处是，我们可以将这三个语句部分放在同一行，并用分号隔开。以下是语法和示例。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>For\
    \ Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"\
    Entering while Loop!\");\nfor(counter = 0;counter < 5; counter++) {\ndocument.write(\"\
    Current Counter is : \" + counter + \"<br />\");\n}\ndocument.write(\"Exiting\
    \ while Loop!\");\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### 输出\n\n当我们执行上面的 HTML 程序时，输出将如下所示。计数器会在 HTML 页面上写入 5 次，因为它在计数器值达到\
    \ 5 之前条件保持了 5 次。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_69_0.png)\n\n###\
    \ for...in 循环语句\n\nfor...in 循环用于遍历对象的属性的特殊情况。for...in 循环的语法和示例。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>For In Loop</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvar prop;\ndocument.write(\"\
    Object properties:<br />\");\nfor (prop in navigator) {\n  document.write(prop\
    \ + \": \" + navigator[prop] + \"<br />\");\n}\n</script>\n<p>We are inside body\
    \ section...</p>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上面的 HTML 程序时，输出将如下所示。在输出中，我们可以看到\
    \ navigator 的所有属性。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_70_0.png)\n\n##\
    \ 循环总结\n\n| 循环类型 | 描述 |\n|---|---|\n| while 循环 | While 循环类型在条件为真时重复语句或一组语句。 |\n\
    | for 循环 | For 循环类型多次执行语句。 |\n| 嵌套循环 | 循环中的循环。在 JavaScript 中，我们可以在 for 循环中使用 while\
    \ 循环。 |\n\n## 循环控制语句\n\nJavaScript 中的循环控制语句用于改变执行顺序。当执行离开作用域时，在该作用域中创建的所有对象都会被销毁。JavaScript\
    \ 语言支持以下循环控制语句。\n\n| 控制语句 | 描述 |\n|---|---|\n| break | break 语句终止循环并将执行转移到其后面的语句。\
    \ |\n| continue | continue语句用于跳过循环体的剩余部分并立即重新测试条件。 |\n\n让我们通过以下示例更好地理解这些循环语句。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Loop\
    \ Control Statement</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n    var counter = 0;\n    document.write(\"Entering while Loop!<br>\");\n\n\
    \    while (counter < 5){\n      if (counter == 3){\n        counter++;\n    \
    \    continue;\n      }\n      if (counter == 4){\n        break;\n      }\n \
    \   }\n    document.write(\"Current Counter is : \" + counter + \"<br />\");\n\
    \n    counter++;\n    document.write(\"Exiting while Loop!\");\n  </script>\n\
    \  <p>We are inside body section...</p>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上面的\
    \ HTML 程序时，输出将如下所示。在输出中，我们可以看到计数器值打印了 3 次（0、1和2），然后循环退出了。这是因为当计数器值变为 3 时，我们执行了\
    \ continue 循环控制语句，它将计数器增加到 4 并跳过了文档写入部分重新检查条件。当计数器值变为 4 时，我们执行了 break 循环控制语句，它最终将退出当前循环并再次跳过方的文档写入语句。\n\
    \n"
