  md: '# Variable Names in JavaScript


    The rules should be obeyed while naming the variables in JavaScript language.


    No of the variable name which are reserved keywords. These keywords are mentioned
    in the last section of this chapter. E.g. finally, goto, etc. variable names are
    invalid.


    Variable names in JavaScript language should never start with a number (0-9).
    However, they can begin with a letter or an underscore character. E.g. 10name
    is an invalid variable but _10name is a valid name.


    Variable names in JavaScript are case-sensitive. E.g. Address and address are
    treated as two different variables names in JavaScript language.


    # Reserved Words in JavaScript


    The following is a list of all the reserved words in JavaScript language. These
    reserved words cannot be used as JavaScript variables, loop labels, functions,
    or any object names.


    | abstract | debugger | final | instanceof | Public |

    |---|---|---|---|--|

    | boolean | default | finally | int | Return |

    | break | delete | float | interface | Short |

    | byte | do | for | long | Static |'
