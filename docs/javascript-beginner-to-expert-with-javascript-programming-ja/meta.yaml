    \ in Mozilla Firefox\n\nThe following are the steps to turn off or disable the\
    \ JavaScript support in Mozilla Firefox. If javascript is disabled then it can\
    \ be enabled upon clicking toggle, after following the similar steps as explained\
    \ before.\n\n## Enabling or disabling the JavaScript support in Google Chrome\n\
    \nThe following are the steps to enable or disable the JavaScript support in Google\
    \ Chrome.\n\nClick on the Chrome menu present at the top right hand corner of\
    \ the Chrome\n"
  mdcn: "\n通常，所有的 JavaScript 语句都以分号结束。但当每个 JavaScript 语句单独放在一行上时，这些分号是可选的。在每个 JavaScript\
    \ 语句的末尾使用分号被认为是一种良好的编程习惯。\n\n## 大写敏感\n\nJavaScript 语言是一种大小写敏感的语言。这意味着关键字、变量、函数名、标识符等应该保持一致的字母大小写。例如，从\
    \ JavaScript 语言的角度来看，标识符 `learn` 和 `LEARN` 是不同的。\n\n## JavaScript 中的注释\n\n以下是\
    \ JavaScript 语言中支持的注释样式。\n\n- 单行注释声明为 `//`（双斜杠）。\n- 多行注释声明为 `/* 位于多行上的 JavaScript\
    \ 语句 */`。它也适用于单行注释。\n- 它还能识别 HTML 注释（起始序列）`<!--`。JavaScript 将其视为单行注释，就像处理 `//`\
    \ 注释一样。\n- HTML 的结束序列 `-->` 不被 JavaScript 识别，因此，它应该写成 `-->`。\n\n以下是一个涵盖各种 JavaScript\
    \ 注释的示例。\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>JavaScript Comments</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n<!-- 起始序列单行注释 --\n  HTML 注释的结束序列-->\n\n// 这是一个单行注释。\n\n/*\n * 这是 JavaScript\
    \ 中的一个多行注释\n*/\n</script>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出将是以下内容（空白），因为\
    \ JavaScript 解释器忽略了所有注释。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_19_0.png)\n\
    \n## JavaScript 语法\n\n与任何其他编程语言一样，JavaScript 语法有一套特定的构建的规则。\n\n## JavaScript 程序\n\
    \nJavaScript 程序是一系列由浏览器程序解析并执行的指令。这些系列程序指令被称为“语句”。\n\nJavaScript 是一种基于面向对象的编程语言。\n\
    \nJavaScript 语句通常用分号隔开，但在语句末尾放置分号是可选的。\n\n```\n<DOCTYPE html>\n<html\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n  <title>JavaScript Syntax</title>\n  <script type=\"\
    text/javascript\">\n    var a = 101;\n    var b = 300;\n    var sum = a + b;\n\
    \  </script>\n</head>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"\
    sum of a + b = \"+sum);\n```\n\n```\n</script>\n</body>\n</html>\n```\n\n## 输出\n\
    \n当我们执行上述 HTML 程序时，输出将是以下内容。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_21_0.png)\n\
    \n## JavaScript 中的语句\n\nJavaScript 编程语言中的语句由以下部分组成：\n\n- 值\n- 运算符\n- 表达式\n- 关键字，以及\n\
    - 注释。\n\n## JavaScript 中的值\n\n以下是 JavaScript 中的两种值：\n\n- 固定值，以及\n- 变量值。\n\n字面量是固定值，而变量值被称为变量。\n\
    \n## JavaScript 中的字面量\n\n以下是在 JavaScript 中编写字面量或固定值的规则。\n\n 数字 数字可以带小数也可以不带小数。\n\
    - 字符串是写在单引号或双引号内的文本。\n\n## JavaScript 中的变量\n\n以下是用于在 JavaScript 中存储数据值的变量值编写规则。\n\
    \nJavaScript 语言使用 `var` 关键字来声明变量。\n\n变量的值通过等号赋值。\n\n## JavaScript 中的运算符\n\n以下是\
    \ JavaScript 中使用的运算符。\n\n赋值运算符 `=` 用于赋值。\n\n算术运算符 `+-*/` 用于加、减、乘、除运算。\n\n## JavaScript\
    \ 中的表达式\n\nJavaScript 表达式是由表达式组合而成的，并可以计算出一个值。一个表达式可以包含值、运算符和变量。以下是一个关于 JavaScript\
    \ 表达式的示例：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>JavaScript Expressions</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nvar a = 101;\nvar b = 300;\nvar sum = a + b;\ndocument.write(\"sum of a + b\
    \ = \" + sum);\n</script>\n</body>\n</html>\n```\n\n当执行上述 HTML 程序时，输出将是：\n\n`sum\
    \ of a + b = 401`\n\n"
