    # Prompt Dialog Box


    In JavaScript language, a prompt dialog box is used when we want to pop-up a text
    box that accepts the user input. Thus, it allows the system to interact with the
    user. The user is required to enter the required data into the field and then
    click on the OK button.


    Such a dialog box is displayed by using a method known as “prompt()”. It accepts
    the following two parameters.


    +   - A label that we want to display in the text box.

    - A default string which is display in the text box.


    The prompt dialog box has the following two buttons.


    +   - The OK button.

    - The Cancel button.


    When the user clicks on the OK button, the window method “prompt()” will return
    the value which was entered by the user in the text box. Otherwise, if the user
    clicks on the Cancel button, then the window method “prompt()” will return a null
    value.


    The following is an example on the prompt dialogue box.'
