- md: "\n## Chapter 11\n\n## JavaScript Functions\n\nA function may be defined as\
    \ a block of code that is well organized and reusable multiple times to perform\
    \ a number of operations in a program that demands high modularity and reusability.\
    \ It eliminates the need of writing the same piece of code again and again and\
