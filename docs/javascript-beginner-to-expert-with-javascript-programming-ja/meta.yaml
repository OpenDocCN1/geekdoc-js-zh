    Welcome to JavaScript First Program\");\n</script>\n<body>\n</html>\n```\n\n#\
    \ Explanation of the JavaScript code <body> ... </body> tags\n\nHere, we have\
    \ injected the JavaScript code between <body> ... </body> tags of the HTML. In\
    \ the JavaScript code/script, we first declared the two attributes as discussed\
    \ before and then with the help of the document object we are writing the message\
