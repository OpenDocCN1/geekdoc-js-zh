    \n# 目录\n\n- 引言\n- 第 1 章 JavaScript 编程简介\n- 第 2 章 开发环境 IDE 搭建\n- 第 3 章我的第一个 JavaScript\
    \ 程序\n- 第 4 章 JavaScript 语法\n- 第 5 章 JavaScript 的启用与禁用\n- 第 6 章 JavaScript 的位置\n\
    - 第 7 章 JavaScript 变量\n- 第 8 章 JavaScript 运算符\n- 第 9 章 JavaScript 决策\n- 第 10 章\
    \ JavaScript 循环\n- 第 11 章 JavaScript 函数\n- 第 12 章 JavaScript 事件\n- 第 13 章 对话框\n\
    - 第 14 章 JavaScript Void 关键字\n- 第 15 章 JavaScript 对象\n- 结论\n\n# 第 1 章\n\n# JavaScript\
    \ 语言简介\n\n欢迎 JavaScript 世界，由 Brendan Eich 于 1995 年发明，它至今仍然是全球最常用的脚本语言。它是一种高级的、解释型的、跨平台且开源的编程语言。在系列教程中，我们将通过实际示例来学习\
    \ JavaScript。在开始之前，让我们先回顾一些基础知识。\n\nJavaScript 是一种面向对象（OOP）的脚本语言，主要用于 Web 编程。它负责让网页具有交互性；简单来说，“它告诉网页执行什么操作”。就像\
    \ HTML 定义网页的内容、CSS 定义布局一样，JavaScript 负责让该网页正常工作。JavaScript 程序是指令集，在编码时按照它们编写的顺序执行，我们应该注意逻辑顺序。不要将\
    \ Java 和 JavaScript 混淆，它们在设计方面技术上是两种不同的语言，但它们的标准库和语法是相似的。\n\n现在，让我们学习如何在你的计算机上安装这种奇的语言并编写我们的第一个\
    \ JavaScript 程序。\n\n# 第 2 章\n\n# 开发 IDE 搭建\n\n在整个教程中，我们将使用 eclipse 作为开发 IDE 来实际演示\
    \ JavaScript 程序示例。以下是安装 eclipse 和为 JavaScript 配置开发环境的步骤。\n\n请遵循以下步骤：\n\n1. 从下方链接下载\
    \ eclipse。选择最新稳定版本的 eclipse，并确保如果你的机器是 64 位的，则选择 64 位的 eclipse。在本教程中使用 eclipse\
    \ MARS.1 版本。\n\nhttps://eclipse.org/downloads\n\n2. 点击 eclipse.exe 打开 eclipse，它会要求你选择一个本地目录作为工作空间（workspace），如下方的所示。\n\
    \n3. 在任何可用驱动器上选择或创建一个目录并点击 OK 按钮启动 eclipse。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_9_0.png)\n\
    \n4. 在 eclipse 中，导航至 File -> New -> Static Web Project（静态 Web 项目）。点击下方所示的链接。\n\
    \n5. 它将打开一个对话框，要求你输入项目名称。请输入项目名称并点击下方所示的‘Finish’按钮。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_10_0.png)\n\
    \n# 静态 Web 项目 (Static Web Project)\n\n仅为简单内容（HTML 文件）创建 Web 项目。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_11_0.png)\n\
    \n6. 在 Eclipse 的左侧（项目管理器），展开项目目录并右键点击‘WebContent’文件夹。要在当前项目中添加文件，请导航至 New -> HTML\
    \ File，如下所示。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_12_0.png)\n\n7. 它将打开一个对话框，要求你输入文件名。输入文件名并点击下方所示的‘Finish’按钮。\n\
    \n到此时，你已经完成了 JavaScript 的开发设置。在下一章中，我们将使用该设置开发我们的第一个 JavaScript 程序。\n\nimg/80ff2aec61ff33d32cd503fad02658a7_13_0.png)\n\
    \n# 第 3 章\n\n# 我的第一个 JavaScript 程序\n\nJavaScript 是一种脚本语言，可以注入网页的任何位置的 <script>...</script>\
    \ 标签中，但通常建议放置在 <head>...</head> 区域。\n\n在解析网页上的标记文本（HTML）时，当浏览器程序遇到 <script> 标签时，它开始解释这些标签（直到\
    \ </script>）之间的文本。script 标签接受以下两个属性：\n\nLanguage 属性指定我们使用的脚本语言类型。其值为 JavaScript\
    \ 语言的“javascript”。在 HTML 的最新版本中，该属性已弃用。\n\nType 属性指示正在使用的脚本语言类型，其值将设置为 JavaScript\
    \ 语言的“text/javascript”。\n\n# 我的第一个 JavaScript 程序\n\n在上一章中，我们创建了一个 html 文件 (MyJavaScriptProgram.html)。让我们使用它编写我们的第一个\
    \ JavaScript 程序，如下所示。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>My First JavaScript Program</title>\n</head>\n<body>\n```\n\
    \n```html\n<script language=\"javascript\" type=\"text/javascript\">\ndocument.write(\"\
    Welcome to JavaScript First Program\");\n</script>\n</body>\n</html>\n```\n\n\
    # JavaScript 代码 <body>...</body> 标签的解释\n\n在这里，我们将 JavaScript 代码注入到 HTML 的 <body>...</body>\
    \ 标签之间。在 JavaScript 代码（script）中，我们首先声明了之前之前讨论过的两个属性，然后通过 document 对象的帮助，在网页上写下“Welcome\
    \ to JavaScript First Program”的消息。\n\n# 输出\n\n当我们执行上面的 HTML 程序时，将得到如下输出。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_16_0.png)\n\
    \n# 空格与换行\n\n我们可以在 JavaScript 程序中自由地使用空格、制表符和换行，因为浏览器解析器在解析 JavaScript 代码时会忽略这些内容。此外，我们可以自由地格式化和缩进我们的\
    \ JavaScript 程序，使脚本非常易于维护、阅读和理解。\n\n"
