    \ 函数，显示一个警报，其消息是从定义 JavaScript 函数的 HTML head 部分获取的。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_77.png)\n\
    \n## return 语句\n\n函数可以返回一个值，`return` 语句是可选的。`return` 语句用于我们想要函数返回一个值时。通过以下示例演示\
    \ `return` 的用法。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
