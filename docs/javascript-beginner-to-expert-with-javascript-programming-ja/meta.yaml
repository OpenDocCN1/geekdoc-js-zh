- md: "\n## Chapter 13\n\n## JavaScript Dialogue Boxes\n\nDialogue boxes are used\
    \ in JavaScript to raise a warning using alert, or ask for a confirmation, or\
    \ to accept an input from the user. To support these features, JavaScript has\
    \ three types of dialogue boxes as follows.\n\n- Alert Dialogue Box\n- Confirmation\
    \ Dialogue Box\n- Prompt Dialogue Box\n\n### Alert Dialog Box\n\nWhen we want\
    \ to display a warning message to the users in a dialogue box, then we use an\
    \ alert dialogue box. E.g., when we validate a form using onSubmit event we do\
    \ not accept any input from the user and just need to display a warning message,\
    \ in this case we use an alert box to display such a warning message. Alert box\
    \ has just one “OK” button to click and proceed.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>On Submit Events</title>\n\
    <script type=\"text/javascript\">\nfunction validation() {\n  if(document.form1.textbox1.value\
    \ != \"\") {\n    alert('Validation Passed');\n    return false;\n  }\n```\n\n\
    ```html\n}\nelse{\n    alert('Text Box field cannot be empty!');\n    return false;\n\
    }\n</script>\n</head>\n<body>\n<form name=\"form1\" method=\"GET\" action=\"onClickEvent.html\"\
    \ onsubmit=\"return validation()\">\n<input type=\"text\" name=\"textbox1\" />\n\
    <input type=\"submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n\
    ### Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output. Here, we see an alert dialogue box.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_95_0.png)\n\
    \n### Confirmation Dialog Box\n\nIn JavaScript language, a confirmation dialog\
    \ box is used when we need to take user’s opinion on any option. It displays a\
    \ dialog box that has two buttons: OK button and Cancel button.\n\nWhen the user\
    \ clicks on the OK button, the window method “confirm()” will return a true value.\
    \ Otherwise, if the user clicks on the Cancel button, then “confirm()” method\
    \ will return a false value. The following is an example on the confirmation dialogue\
    \ box.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Confirm Box</title>\n<script type=\"text/javascript\">\n  function showAlert()\
    \ {\n    confirm(\"This is an confirm dialogue box example!\");\n  }\n</script>\n\
    </head>\n<body>\n<p>Confirm box demo example.</p>\n<input type=\"button\" onclick=\"\
    showAlert();\" value=\"Call JavaScript\">\n</body>\n</html>\n```\n\n### Output\n\
    \nWhen we execute the above HTML program, the following will be the output. Here,\
    \ we see a confirmation dialogue box.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_97_0.png)\n\
    \n### Prompt Dialog Box\n\nIn JavaScript language, a prompt dialog box is used\
    \ when we want to pop-up a text box that accepts the user input. Thus, it allows\
    \ the system to interact with the user. The user is required to enter the required\
    \ data into the field and then click on the OK button.\n\nSuch a dialog box is\
    \ displayed by using a method known as “prompt()”. It accepts the following two\
    \ parameters.\n\n- A label that we want to display in the text box.\n- A default\
    \ string which is display in the text box.\n\nThe prompt dialog box has the following\
    \ two buttons.\n\n- The OK button.\n- The Cancel button.\n\nWhen the user clicks\
    \ on the OK button, the window method “prompt()” will return the value which was\
    \ entered by the user in the text box. Otherwise, if the user clicks on the Cancel\
    \ button, then the window method “prompt()” will return a null value.\n\nThe following\
    \ is an example on the prompt dialogue box.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n<script type=\"\
    text/javascript\">\nfunction showAlert(){\n  prompt(\"This is an prompt dialogue\
    \ box example!\");\n}\n</script>\n</head>\n<body>\n<p>Prompt dialogue box demo\
    \ example.</p>\n<input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"\
    />\n</body>\n</html>\n```\n\n### Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. Here, we see a prompt dialogue box.\n\nPrompt\
    \ dialogue box demo example.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_99_0.png)\n\
    \n## Chapter 14\n\n## JavaScript Void Keyword\n\nIn JavaScript language, the void\
    \ keyword can be used as a unary operator which is appeared before its single\
    \ operand, and may be of any type. This unary operator specifies an expression\
    \ which is required to be evaluated without any return value.\n\nThe following\
    \ is the syntax and an example of the void keyword.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n\
    </head>\n<body>\n<p>Click here</p>\n<a href=\"javascript:void(alert('Hello'))\"\
    >Click</a>\n</body>\n</html>\n```\n\n### Output\n\nWhen we execute the above HTML\
    \ program, the following will be the output. Here, we see an alert dialogue box.\n\
    \n## Chapter 15\n\n## JavaScript Objects\n\nJavaScript language is an Object Oriented\
    \ (OOP) based language which provides the following capabilities of the programmer:\n\
    \n- **Encapsulation** — is the concept with which we can store all information\
    \ that includes data and methods, together in an object.\n- **Aggregation** —\
    \ is the concept which enables to store one object inside another.\n- **Inheritance**\
    \ — is the concept that enables a class to inherit or re-use the properties and\
    \ methods of another class (parent class).\n- **Polymorphism** — is the concept\
    \ that enables the programmer to write one function/method that execute different\
    \ ways but defined with same name. Also known as method overloading.\n- **Objects**\
    \ — are composed of attributes. An attribute can be a function or a property.\n\
    \n### Object Properties in JavaScript\n\nObject properties in JavaScript can be\
    \ any of the primitive data types (Number, String and Boolean), or any of the\
    \ abstract data types (such as an object). Object properties are the variables\
    \ which are used internally in the object’s methods. They can also be used as\
    \ globally visible variables therefore, can be used throughout the page. The following\
    \ is the syntax and example.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Objects Example</title>\n<script type=\"text/javascript\"\
    >\nobjectName.objectProperty = propertyValue;\nvar str = document.title;\n</script>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\nHere we are assigning the ‘propertyValue’\
    \ variable value to the object property attribute ‘objectProperty’. The object\
    \ is referred with the name as ‘objectName’.\n\nIn the next statement of the above\
    \ example, we are storing the value of the document title using the “title” property\
    \ of the document object into “str” variable.\n\n### Object Methods in JavaScript\n\
    \nObjects Methods are the functions with which the object do manipulation or required\
    \ executions. In JavaScript, the function differs from the method in the following\
    \ way: A function is a standalone unit of statements whereas a method is attached\
    \ to an object that can be referenced by the “this” keyword.\n\nMethods can be\
    \ used to display the object contents on the HTML page. They can perform a complex\
    \ mathematical operations on objects properties attributes and the input parameters\
    \ passed to the object method. E.g., during this tutorial, we have used the “write”\
    \ method of the document object where we pass the string or text as a parameter\
    \ to be\n"
  mdcn: "\n\n## 第 13 章\n\n## JavaScript 对话框\n\n对话框在 JavaScript 中用于通过 `alert` 弹出警告、或者请求用户确认，或者接受用户的输入。为了支持这些功能，JavaScript\
    \ 有以下三种类型的对话框：\n\n- 警告对话框 (Alert Dialogue Box)\n- 确认对话框 (Confirmation Dialogue\
    \ Box)\n- 提示对话框 (Prompt Dialogue Box)\n\n### 警告对话框\n\n当我们想在对话框中向用户显示警告消息时，我们就使用警告对话框。例如，当我们使用\
    \ `onSubmit` 事件验证表单时，我们不接受用户的任何输入，只需要显示警告消息，在这种情况下，我们使用警告框来显示此类警告消息。警告框只有一个“OK”按钮可以点击并继续。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>On\
    \ Submit Events</title>\n<script type=\"text/javascript\">\nfunction validation()\
    \ {\n  if(document.form1.textbox1.value != \"\") {\n    alert('Validation Passed');\n\
    \    return false;\n  }\n```\n\n```html\n}\nelse{\n    alert('Text Box field cannot\
    \ be empty!');\n    return false;\n}\n</script>\n</head>\n<body>\n<form name=\"\
    form1\" method=\"GET\" action=\"onClickEvent.html\" onsubmit=\"return validation()\"\
    >\n<input type=\"text\" name=\"textbox1\" />\n<input type=\"submit\" value=\"\
    Submit\" />\n</form>\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，将得到如下输出。在这里，我们看到了一个警告对话框。\n\
    \n![](img/80ff2aec61ff33d32cd503fad02658a7_95_0.png)\n\n### 确认对话框\n\n在 JavaScript\
    \ 语言中，当我们对任何选项获取用户的意见时，就会使用确认对话框。它显示一个包含两个按钮的对话框：OK 按钮和取消按钮。\n\n当用户点击 OK 按钮时，窗口方法\
    \ “confirm()` 将返回一个 `true` 值。否则，如果用户点击取消按钮，那么 “confirm()” 方法将返回一个 `false` 值。以下是确认对话框的一个示例。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Confirm\
    \ Box</title>\n<script type=\"text/javascript\">\n  function showAlert() {\n \
    \   confirm(\"This is an confirm dialogue box example!\");\n  }\n</script>\n</head>\n\
    <body>\n<p>Confirm box demo example.</p>\n<input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\">\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上述 HTML\
    \ 程序时，将得到如下输出。在这里，我们看到了一个确认对话框。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_97_0.png)\n\
    \n### 提示对话框\n\n在 JavaScript 语言中，当我们想要弹出一个接受用户输入的文本框时，就会使用提示对话框。因此，它允许系统与用户进行交互。用户需要在字段中输入所需的数据，然后点击\
    \ OK 按钮。\n\n此类对话框通过使用名为 “prompt()”的方法显示。它接受以下两个参数：\n\n- 我们想在文本框中显示的标签。\n- 显示在文本框中的默认字符串。\n\
    \n提示对话框有以下两个按钮：\n\n- OK 按钮。\n- 取消按钮。\n\n当用户点击 OK 按钮时，窗口方法 “prompt()” 将返回用户在文本框中输入的值。否则，如果用户点击取消按钮，那么窗口方法\
    \ “prompt()” 将返回一个 `null` 值。\n\n以下是提示对话框的一个示例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n<script type=\"\
    text/javascript\">\nfunction showAlert(){\n  prompt(\"This is an prompt dialogue\
    \ box example!\");\n}\n</script>\n</head>\n<body>\n<p>Prompt dialogue box demo\
    \ example.</p>\n<input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"\
    />\n</body>\n</html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，将得到如下输出。在这里，我们看到了一个提示对话框。\n\
    \nPrompt dialogue box demo example.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_99_0.png)\n\
    \n## 第 14 章\n\n## JavaScript void 关键字\n\n在 JavaScript 语言中，`void` 关键字可以作为一元运算符使用，出现在其单个操作数之前，该操作数可以是任何类型。该一元运算符指定一个不需要返回值的表达式。\n\
    \n以下是 `void` 关键字的语法和示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Void Example</title>\n</head>\n<body>\n<p>Click here</p>\n\
    <a href=\"javascript:void(alert('Hello'))\">Click</a>\n</body>\n</html>\n```\n\
    \n### 输出\n\n当我们执行上述 HTML 程序时，将得到如下输出。在这里，我们看到了一个警告框。\n\n## 第 15 章\n\n## JavaScript\
    \ 对象\n\nJavaScript 语言是一种基于面向对象 (OOP) 的语言，提供了以下能力：\n\n- **封装 (Encapsulation)**\
    \ —— 这种概念允许我们将数据和方法整合在一起存储在对象中。\n- **聚合 (Aggregation)** —— 这种概念允许我们将一个对象存储在另一个对象内部。\n\
    - **继承 (Inheritance)** —— 这种概念允许类继承或重用另一个类（父类）的属性和方法。\n- **多态 (Polymorphism)**\
    \ —— 这种概念允许程序员编写具有相同名称但执行方式不同的函数/方法。称为方法重载。\n- **对象 (Objects)** —— 对象由属性组成。属性可以是函数，也可以是属性。\n\
    \n### JavaScript 对象属性\n\nJavaScript 中的对象属性可以是任何原始数据类型（数字、字符串和布尔值），可以是任何抽象数据类型（如对象）。对象属性是对象方法内部使用的变量。它们也可以作为全局可见变量，因此可以在整个页面中使用。以下是语法和示例。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Objects\
    \ Example</title>\n<script type=\"text/javascript\">\nobjectName.objectProperty\
    \ = propertyValue;\nvar str = document.title;\n</script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n在这里，我们将 `propertyValue` 变量的值赋值给对象属性 `objectProperty`。该对象通过名称 `objectName`\
    \ 进行引用。\n\n在上述示例的下一条语句中，我们使用 document 对象的 `title` 属性将文档标题的值存储到变量 `str` 中。\n\n\
    ### JavaScript 对象方法\n\n对象方法是对象执行操作或所需执行的函数。在 JavaScript 中，函数与方法的区别在于：函数是一个独立的语句单元，而方法是附加到对象上的，可以通过\
    \ `this` 关键字进行引用。\n\n方法可以用于在 HTML 页面上显示对象内容。它们可以对对象属性和传递给对象方法的输入参数执行复杂的数学运算。例如，在教程期间，我们使用了\
    \ document 对象的 “write” 方法，我们将字符串或文本作为参数传递以\n\n"
