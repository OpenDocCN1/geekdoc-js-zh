    \ statements.\n\nJavaScript is an object oriented based programming language.\n\
    \nJavaScript statements are usually separated by semicolons, however placing a\
    \ semicolon at the end statement is optional.\n\n```\n<DOCTYPE html>\n<html\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n  <title>JavaScript Syntax</title>\n  <script\
    \ type=\"text/javascript\">\n    var a = 101;\n    var b = 300;\n    var sum =\
    \ a + b;\n  </script>\n</head>\n<body>\n  <script type=\"text/javascript\">\n\
    \    document.write(\"sum of a + b = \"+sum);\n```\n\n```\n</script>\n</body>\n\
    </html>\n```\n\n## Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_21_0.png)\n\n\
    ## Statements in JavaScript\n\nStatements in JavaScript programming language are\
    \ composed of the following.\n\n- Values\n- Operators\n- Expressions\n- Keywords,\
    \ and\n- Comments.\n\n## Values in JavaScript\n\nThe following are the two types\
    \ of values in JavaScript.\n\n- Fixed values, and\n- Variable values.\n\nLiterals\
    \ are the fixed values and the variable values are known as variables.\n\n## Literals\
    \ in JavaScript\n\nThe following are the rules for writing literals or fixed values\
    \ in JavaScript.\n\n- Numbers are defined with or without decimals.\n- Strings\
    \ are the text that are written within single or double quotes.\n\n## Variables\
    \ in JavaScript\n\nThe following are the rules for writing variable values which\
    \ are used to store data values in JavaScript.\n\nJavaScript language uses the\
    \ var keyword to declare the variables.\n\nThe value to a variable is assigned\
    \ by an equal sign.\n\n## Operators in JavaScript\n\nThe following are the operators\
    \ used in JavaScript language.\n\n**Assignment operator (=)** is used to assign\
    \ values to a variable.\n\n**Arithmetic operators (+-*/)** are used for arithmetic\
    \ operations such as addition, subtraction, multiplication, and division.\n\n\
    ## Expressions in JavaScript\n\nAny expression in JavaScript language is a combination\
    \ of values, variables, and operators. These together do computation. The computation\
    \ is called an evaluation.\n\nAn expressions may also contain variable values\
    \ such as numbers and strings. E.g., “Java” + “Script” will concatenate to “JavaScript”.\n\
    \nLet’s understand this with the help of the following example.\n\n```\n<!DOCTYPE\
    \ html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n```\n\n## JS Expressions\n\
    \n```\n<script type=\"text/javascript\">\n    var a = 101; //variable, assignment\
    \ operator and literal as number.\n    var b = 300;\n    var addition = a + b;\n\
    \    var str1 = \"Java\"; //variable, assignment operator and literal as String.\n\
    \    var str2 = \"Script\";\n    var str3 = str1 + str2;\n</script>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\n    document.write(\"Addition of a\
    \ + b = \"+addition);\n    document.write(\"<br>Concat of str1 + str2 = \"+str3);\n\
    </script>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML\
    \ program, the following will be the output. The output shows the addition and\
    \ the concatenation operation.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_24_0.png)\n\
    \n## Keywords in JavaScript\n\nKeywords in JavaScript language are used to identify\
    \ the actions which are required to be performed. The var keyword directs the\
    \ browser to create a new variable as JavaScript Identifiers. In JavaScript language,\
    \ the identifiers are used to name variables (and keywords, and functions, and\
    \ labels).\n\nIn JavaScript language, the first character must be a letter, an\
    \ underscore (_), or a dollar sign ($) always. The subsequent characters may be\
    \ letters, digits, underscores, or dollar signs.\n\n## Camel Case and JavaScript\n\
    \nThere are the following three ways of joining multiple words into one variable\
    \ name.\n\n- **Hyphens** — E.g., first-address, second-address, visa-passport,\
    \ city-name, etc.\n- **Underscore** — E.g., first_address, second_address, visa_passport,\
    \ city_name, etc.\n- **Camel Case** — E.g., FirstAddress, SecondAddress, VisaPassport,\
    \ InterName, etc. In JavaScript programming languages, the camel case starts with\
    \ lowercase letter.\n\n## Character Set in JavaScript\n\nJavaScript language uses\
    \ the Unicode character set and it covers all the characters, punctuations, and\
    \ symbols.\n\n# Chapter 5\n\n# JavaScript Enabling and Disabling\n\nWeb browsers\
    \ such as Internet Explorer, Mozilla Firefox, Google Chrome, Opera, etc. come\
    \ with built-in support for JavaScript. We can enable or disable the browser manually.\
    \ In this chapter we are going to discuss about the procedure of enabling and\
    \ disabling JavaScript in these browsers.\n\n## Enabling the JavaScript support\
    \ in Internet Explorer\n\nThe following are the steps to turn on or enable JavaScript\
    \ support in Internet Explorer.\n\n- Navigate as Tools Internet Options from the\
