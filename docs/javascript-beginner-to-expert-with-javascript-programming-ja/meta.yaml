    \n## Function Parameters\n\nTill this point, we have used the functions which\
    \ were without the input parameters. In a JavaScript function, we can pass different\
    \ parameters while calling it. The values of the passed parameters can be used\
    \ inside the function and we can do the manipulation on these parameters. A function\
