    # # Chapter 12


    # # JavaScript Events


    JavaScript Events are the means through which JavaScript interacts with the HTML
    document. These events are triggered when any value is manipulated on the HTML
    page either by the user or the browser. E.g. when we load an HTML page, it is
    known as an event. Similarly, when we click a button on the page, it is also an
    event. We can think of other examples of events such as pressing any key, submitting
    a form through button, changing the size of a window.


    Programmers can use these JavaScript events to trigger and execute JavaScript
    coded responses. These responses includes closing of a window on button click,
    displaying alert message to user, validating the form data, etc.


    JavaScript events are the part of the Document Object Model (DOM) Level 3. All
    HTML web element contains a set of events which are capable of triggering JavaScript
    function code.


    The following are the few examples to understand the relation between Event and
    invoking JavaScript function code.


    # onclick Event Type


    It is the most frequently used event type that triggers a JavaScript code when
    we left click the button of mouse on HTML page or web element. Here, we can put
    our validation, etc., against this event type. The following example demonstrates
    this event.


    ```

    <DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>On Click Events</title>

    <script type="text/javascript">

    ```'
