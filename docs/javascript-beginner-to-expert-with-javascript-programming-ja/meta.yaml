    \ {\n  concatStr = concatString(message,entity,lang);\n  document.write(concatStr);\n\
    }\n</script>\n</head>\n<body>\n<input type=\"button\" onclick=\"writeToDoc('Welcome\
    \ to the World of ','JavaScript!');\" value=\"Call JavaScript\">\n<p>Body section\
    \ of the HTML document.</p>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. Here, we are calling\
