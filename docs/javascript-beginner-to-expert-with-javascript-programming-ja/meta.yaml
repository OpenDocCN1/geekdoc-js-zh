    \n## Chapter 12\n\n## JavaScript Events\n\nJavaScript Events are the means through\
    \ which JavaScript interacts with the document. E.g. when we load a page, it is\
    \ known as an event. Similarly, when we click a button, it is also an event. Programmers\
    \ can use these events to trigger and execute JavaScript responses.\n\nThe following\
    \ are a few examples:\n\n## onclick Event Type\n\nIt is the most frequently used\
    \ event type that triggers JavaScript code when we click a button. We can put\
    \ our validation, etc., against this event type. The following example demonstrates\
    \ this event.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>On Click Events</title>\n<script type=\"text/javascript\">\n```\n\n\
    ```javascript\nfunction showAlert() {\n  alert(\"This is an alert on event!\"\
    );\n}\n</script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\" />\n</body>\n</html>\n```\n\n## Output\n\nWhen we\
    \ execute the above HTML program, the following will be the output. We are invoking\
    \ a JavaScript function \"showAlert\" through a button onclick event which is\
    \ displaying a message on an alert box.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_82_0.png)\n\
    \n## onsubmit Event Type\n\nIt is an event type that comes into play while we\
    \ submit a HTML form. We can also put our form validation against this event type.\
    \ In the following example, we are demonstrating how onsubmit event is triggered.\
    \ We can call a \"validate()\" function before submitting form data to the webserver.\
    \ The form will be submitted only if the \"validate()\" function returns true,\
    \ otherwise it will not be submitted at all.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>On Submit Events</title>\n<script\
    \ type=\"text/javascript\">\nfunction validation() {\nif(document.form1.textbox1.value\
    \ != \"\") {\n  alert('Validation Passed');\n  return true;\n}\nelse{\n  alert('Text\
    \ Box field cannot be empty!');\n  return false;\n}\n</script>\n</head>\n<body>\n\
    <form name=\"form1\" method=\"GET\" action=\"onClickEvent.html\" onsubmit=\"return\
    \ validation()\">\n<input type=\"text\" name=\"textbox1\"/>\n<input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n"
  mdcn: "\n\n## 第 11 章\n\n## JavaScript 函数\n\n函数可以定义为一段代码，该代码组织良好且可以多次重用，用于在需要高度模块化和可重用性的程序中执行许多操作。它消除了反复编写相同代码段的需求，并帮助程序员编写模块化代码。通过函数的概念，程序员可以将一个大程序拆分为许多较小且易于管理的函数，从而最终减少冗余。\n\
    \n与任何其他编程语言一样，JavaScript 语言也支持使用函数来编写模块化代码所需的特性。从这些教程开始，我们一直在使用像 `alert()` 和 `write()`\
    \ 这样的函数，这让我们对函数的操作有了一点提示。这些函数是 JavaScript 的内置函数。在 JavaScript 语言中，我们可以像在本章将要学习的其他任何编程语言一样编写自己的函数。\n\
    \n## 函数定义\n\n函数可以在代码的任何地方使用，我们只需要定义它们一次。在 JavaScript 中，我们通过使用 `function` 关键字来定义函数，后面跟着一个唯一的函数名、一个参数列表（可以是空的）以及用大括号括起来语句块。以下是\
    \ JavaScript 函数的语法和示例。\n\n```html\n<!DOCTYPE html>\n<<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Function Definition</title>\n<script type=\"text/javascript\"\
    >\n```\n\n```javascript\nfunction sayHelloToJavaScript() {\n    alert(\"Welcome\
    \ to the world of JavaScript!\");\n}\n</script>\n</head>\n<body>\n\n</body>\n\
    </body>\n</html>\n```\n\n## 调用函数\n\n我们可以在脚本的后续或 HTML 网页元素上调用 JavaScript 函数，我们只需要像下面的代码所示编写该函数的名称。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Function\
    \ Definition</title>\n<script type=\"text/javascript\">\nfunction sayHelloToJavaScript()\
    \ {\n    alert(\"Welcome to the world of JavaScript!\");\n}\n</script>\n</head>\n\
    <body>\n</body>\n```\n\n```html\n<body>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述\
