    \ JavaScript 函数，显示一个警报，其消息是从定义 JavaScript 函数的 HTML head 部分获取的。\n\n![](img/80ff2aec61ff33d32cd50fad02658a7_78.png)\n\
    \n## 第 12 章\n\n## JavaScript 事件\n\nJavaScript 事件是 JavaScript 与文档交互的手段。例如，当我们加载页面时，这就是一个事件。同样，当我们点击按钮时，这也是一个事件。程序员可以使用这些事件来触发并执行\
    \ JavaScript 响应。\n\n以下是一些示例：\n\n## onclick 事件类型\n\n这是最常用的事件类型，在我们点击按钮时触发 JavaScript\
    \ 代码。我们可以在此事件类型上编写验证。以下示例演示了该事件。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>On Click Events</title>\n<script type=\"\
    text/javascript\">\n```\n\n```javascript\nfunction showAlert() {\n  alert(\"This\
    \ is an alert!\");\n}\n</script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"\
    showAlert();\" value=\"Call JavaScript\"\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述\
    \ HTML 程序时，输出将如下所示。我们在按钮的点击事件上调用 JavaScript 函数 `showAlert`，显示一个警报框消息。\n\n![](img/80ff2aec61ff33d32cd50fad02658a7_82.png)\n\
    \n## onsubmit 事件类型\n\n这是在我们提交 HTML 表单时生效的事件类型。我们也可以在此事件类型上编写表单验证。在以下示例中，我们演示了\
    \ `onSubmit` 事件是如何触发的。在提交表单数据到 Web 服务器之前，我们可以调用 `validate()` 函数。只有当 `validate()`\
    \ 函数返回 `true` 时，表单才会提交，否则完全不会提交。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>On Submit Events</title>\n<script type=\"\
    text/javascript\">\nfunction validation() {\nif(document.form1.textbox1.value\
    \ != \"\") {\n  alert('Validation Passed');\n  return true;\n}\nelse{\n  alert('Text\
    \ Box field cannot be empty!');\n  return false;\n}\n</script>\n</head>\n<body>\n\
    <form name=\"form1\" method=\"GET\" action=\"onClickEvent.html\" onsubmit=\"return\
    \ validation()\">\n<input type=\"text\" name=\"textbox1\"/>\n<input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n"
