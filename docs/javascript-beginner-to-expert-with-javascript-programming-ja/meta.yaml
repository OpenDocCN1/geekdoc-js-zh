    \ now.)\n\n[content]\n# Chapter 7\n\n# JavaScript Variables\n\n# ### Datatypes\
    \ in JavaScript\n\nIt is the characteristic of every programming language to support\
    \ operations on the set of data types. These are the actual values which are defined\
    \ and manipulated in any programming language. Like any other programming language,\
    \ the JavaScript language allows us to work with the following three primitive\
    \ types.\n\n- Numbers, e.g. 1, 23, 10.50, 23.8990 etc.\n- Strings or text data,\
    \ e.g. \"JavaScript\", \"This is my language\", etc.\n- Boolean, as it could be\
    \ either true or false.\n\nApart from these three primitive datatypes, JavaScript\
    \ language also defines the following two trivial types. Each of which defines\
    \ only a single value.\n\n- Null.\n- Undefined.\n\nAlso, JavaScript language supports\
    \ a composite data type known as object. JavaScript objects will be covered in\
    \ detail later in this tutorial.\n\nThis is to be that the JavaScript language\
    \ does not make a distinction between integer values and floating-point values.\
    \ JavaScript considers all numbers as the floating-point values. JavaScript represents\
    \ numbers by using the 64-bit floating-point format which is defined by the IEEE\
    \ 754 standard.\n\n# ### Variables in JavaScript\n\nAs discussed earlier, the\
    \ JavaScript language has variables as data containers where we can place data\
    \ into these containers and refer this data by simply naming the container. We\
    \ declare JavaScript variable with the var keyword as shown below.\n[/content]\
