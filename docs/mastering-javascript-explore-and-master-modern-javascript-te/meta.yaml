  md: "# Functions, Closures, and Modules\n\n```\nreturn 'trueMoo';\n}\nelse {\n \
    \ sayMoo = function() {\n    return 'falseMoo';\n  }\n}\nfoo();\n```\n\nIf you\
    \ are curious to know why you should not use function declarations in conditional\
    \ blocks, read on; otherwise, you can skip the following paragraph.\n\nFunction\
    \ declarations are allowed to appear only in the program or function body. They\
    \ cannot appear in a block ({ ... }). Blocks can only contain statements and not\
    \ function declarations. Due to this, almost all implementations of JavaScript\
    \ behave different from this. It is always advisable to never use function declarations\
    \ in a conditional block.\n\nFunction expressions, on the other hand, are very\
    \ popular. A very common pattern among programmers is to fork function definitions\
    \ based on some kind of condition. As such forks usually happen in the same scope,\
    \ it is almost always necessary to use function expressions.\n\n# The arguments\
    \ parameter\n\nThe arguments parameter is a collection of all the arguments passed\
    \ to the function. The collection has a property named length that counts the\
    \ count of arguments, and the individual argument values can be obtained using\
    \ an array indexing notation. Okay, we lied a bit. The arguments parameter is\
    \ not a JavaScript array, and if you try to use array methods on arguments, you\
    \ will fail miserably. You can think of arguments as an array-like structure.\
    \ This makes it possible to write functions that take an unspecified number of\
    \ parameters. The following snippet shows how you can pass a variable number of\
    \ arguments to the function and iterate through them using arguments array:\n\n\
    ```\nvar sum = function () {\n  var i, total = 0;\n  for (i = 0; i < arguments.length;\
    \ i += 1) {\n    total += arguments[i];\n  }\n  return total;\n};\nconsole.log(sum(1,2,3,4,5,6,7,8,9));\
    \ // prints 45\nconsole.log(sum(1,2,3,4,5)); // prints 15\n```"
