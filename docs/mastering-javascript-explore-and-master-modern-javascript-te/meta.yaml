  md: '# Chapter 1


    When a non-String value is coerced into a String, JavaScript uses the toString()
    method to do this. All primitives have a natural string form—null has a string
    form of "null", undefined has a string of "undefined", and so on. For Java developers,
    this is analogous to a class having a toString() method that returns a string
    representation of the class. We will see exactly how this works in case of objects.


    So essentially you can do something to the following:


    ```

