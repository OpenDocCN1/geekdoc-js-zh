  md: "# Chapter 7\n\n```\n//We can skip one of them\nvar [d,f]=fn();\nconsole.log(d,f);\
    \ ///1 3\n//Rest of the values are not used\nvar [e,] = fn();\nconsole.log(e);\
    \ ///1\n```\n\nLet's discuss how objects' destructuring works. Let's say that\
    \ you have a function f that returns an object as follows:\n\n```\nfunction f()\
    \ {\n  return\n    a: 'a'\n    b: 'b'\n    c: 'c'\n}\n```\n\nWhen we destructure\
    \ the object returned by this function, we can use the simpler syntax as we saw\
    \ earlier; the difference is that we use instead of []:\n\n```\nvar { a, b, c:\
    \ c } = f();\nconsole.log(a,b,c); /// a b c\n```\n\nSimilar to arrays, we use\
    \ pattern matching to assign variables to their corresponding values returned\
    \ by the function. There is an even shorter way of writing this if you are using\
    \ the same variable as the one being matched. The following example would just\
    \ fine:\n\n```\nvar { a,b,c } = f();\n```\n\nHowever, you would mostly be using\
    \ a different variable name from the one returned by the function. It is important\
    \ to remember that the syntax is source: destination and the usual destination:\
    \ source. Carefully observe the following example:\n\n```\n//this is target: source\
    \ - which is incorrect\nvar { x: a, b: y, c: z } = f();\nconsole.log(x,y,z); //\
    \ x is undefined, y is undefined z is undefined\n//this is source: target - correct\n\
    var { a: x, b: y, c: z } = f();\nconsole.log(x,y,z); // a b c\n```\n\nThis is\
    \ the opposite of the target = source way of assigning values and will take some\
    \ time in getting used to.\n\n# [ 169 ]"
