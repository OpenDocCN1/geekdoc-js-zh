  md: "# Object-Oriented JavaScript\n\nIt does not propagate to all the instances\
    \ of Employee. This is because when you create an instance of the Employee object,\
    \ this instance gets a local value for the name. When you set the TeamLead.prototype\
    \ has a local value for the name property. Therefore, when JavaScript looks up\
    \ the name property of the json object, which is an instance of TeamLead, it finds\
    \ the local value for this property in TeamLead.prototype. It does not try to\
    \ do further lookups up to Employee.prototype.\n\nIf you want the value of a property\
    \ changed at runtime and have the new value be inherited by all the descendants\
    \ of the object, you cannot define the property in the object's constructor function.\
    \ To achieve this, you need to add it to the constructor's prototype. For example,\
    \ let's revisit the earlier example but with a slight change:\n\n```\nfunction\
    \ Employee() {\n  this.dept = 'None';\n  this.salary = 0.00;\n}\n\nEmployee.prototype.name\
    \ = '';\nfunction Manager() {\n  this.reports = [];\n}\n\nManager. = new Employee();\n\
    var sandy = new Manager();\nvar karen = new Manager();\n```\n\n```\nEmployee.prototype.name\
    \ = \"Junk\";\n\nconsole.log(sandy.name);\nconsole.log(karen.name);\n```\n\nYou\
    \ will see that the name property of both sandy and karen has changed to Junk.\
    \ This is because the name is declared outside the constructor function. So, when\
    \ you change the value of name in the Employee's prototype, it propagates to all\
    \ the descendants. In this example, we are modifying Employee's prototype after\
    \ the sandy and karen objects are created. If you changed the prototype before\
    \ the sandy and karen objects were created, the value would still have changed\
    \ to Junk.\n\nAll native JavaScript objects—Object, Array, String, Number, RegExp,\
    \ and Function—have prototype properties that can be extended. This means that\
    \ we can extend the functionality of the language itself. For example, the following\
    \ snippet extends the String object to add a reverse() method to reverse a string.\
    \ This method does not exist in the native String object but by manipulating String's\
    \ prototype, we add this method to String:"
