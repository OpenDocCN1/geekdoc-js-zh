  md: "Were you expecting something shiny? No, this is really the most ordinary case\
    \ of a closure. We are declaring a variable in the global scope and declaring\
    \ a function in the global scope. In the function, we are able to access the variable\
    \ declared in the global scope - outer. Essentially, the outer scope for the outerFn()\
    \ function is a closure and always available to outerFn(). This is a good start\
    \ but perhaps you are not sure why this is such a great thing.\n\nLet's make it\
    \ bit more complex:\n\n```\nvar outer = 'Outer'; //Variable declared in global\
    \ scope\nvar copy;\nfunction outerFn() { //Function declared in global scope\n\
    \  var inner = 'Inner'; //Variable has function scope only, can not be\n  //accessed\
    \ from outside\n\n  function innerFn() { //Inner function within Outer function,\n\
    \    //both global context and\n    //context are available hence can access\n\
    \    //outer' and 'inner'\n    console.log(outer);\n    console.log(inner);\n\
    \  }\n  copy=innerFn(); //Store reference to inner function,\n  //because 'copy'\
    \ itself is declared\n  //in global context, it will be available\n  //outside\
    \ also\n}\noutnerFn();\ncopy(inner); //Cant invoke innerFn() directly but can\
    \ invoke via a\n//variable declared in global scope\n```\n\nLet's analyze the\
    \ preceding example. In innerFn(), the outer variable is available as it's part\
    \ of the global context. We're executing the inner function after the outer function\
    \ has been executed via copying a reference to the function to a global reference\
    \ variable, copy. When innerFn() executes, the scope in outerFn() is gone and\
    \ not visible at the point where we're invoking the function through the copy\
    \ variable. So shouldn't the following line fail?\n\n```\nconsole.log(inner);\n\
    ```"
