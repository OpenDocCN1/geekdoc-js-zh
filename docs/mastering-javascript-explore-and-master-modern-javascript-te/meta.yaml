  md: "A function declaration is processed when execution enters the context in which\
    \ it appears before any step-by-step code is executed. The function that it creates\
    \ is given a proper name (functionTwo() in the preceding example) and this name\
    \ is put in the scope where the declaration appears. As it's processed before\
    \ any step-by-step code in the same context, calling functionTwo() before it works\
    \ without an error.\n\nHowever, functionOne() is an anonymous function expression,\
    \ evaluated when it's reached in the step-by-step execution of the code (also\
    \ called runtime execution); we have to declare it before we invoke it.\n\nSo\
    \ essentially, the function declaration of functionTwo() was hoisted while the\
    \ function expression of functionOne() was executed when line-by-line execution\
    \ encountered it.\n\n> Both function declarations and variable declarations are\
    \ hoisted but functions are hoisted first, and then variables.\n\nOne thing to\
    \ remember is that you should never use function declarations conditionally. This\
    \ behavior is non-standardized and can behave differently across platforms. The\
    \ following example shows such snippet where we try to use function declarations\
    \ conditionally. We are trying to assign function body to function sayMoo() but\
    \ such a conditional code is not guaranteed to work across all browsers and can\
    \ result in unpredictable results:\n\n```\n// Never do this - different browsers\
    \ will behave differently\nif (true) {\n  function sayMoo() {\n    return 'trueMoo';\n\
    \  }\n} else {\n  function sayMoo() {\n    return 'falseMoo';\n  }\n}\nfoo();\n\
    ```\n\nHowever, it's perfectly safe and, in fact, smart to do the same with function\
    \ expressions:\n\n```\nvar sayMoo;\nif (true) {\n  sayMoo = function() {\n```"
