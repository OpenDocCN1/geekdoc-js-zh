  md: "# Chapter 8\n\n```\n<title>DOM</title>\n<script>\nwindow.onload = function()\
    \ {\n  var greeting = document.getElementById(\"greeting\");\n  alert(greeting.innerHTML);//\
    \ // shows \"Hello World\" alert\n}\n</script>\n</head>\n<body>\n<p id=\"greeting\"\
    >Hello World!</p>\n<p id=\"identify\">Earthlings</p>\n</body>\n</html>\n```\n\n\
    What we discussed so far was the basics of DOM traversal in JavaScript. When the\
    \ DOM gets complex and you want sophisticated operations on the DOM, these traversal\
    \ and access functions seem limiting. With this basic knowledge with us, it's\
    \ time to get introduced to a fantastic library for DOM traversal (among other\
    \ things) called jQuery.\n\njQuery is a lightweight library designed to make common\
    \ browser operations easier. Common operations such as DOM traversal and manipulation,\
    \ event handling, animation, and Ajax can be tedious if done using pure JavaScript.\
    \ jQuery provides you with easy-to-use and shorter helper mechanisms to help you\
    \ develop these common operations very easily and quickly. jQuery is a feature-rich\
    \ library, but as far as this chapter goes, we will focus primarily on DOM manipulation\
    \ and events.\n\nYou can add jQuery to your HTML by adding the script directly\
    \ from a content delivery network (CDN) or manually downloading the file and adding\
    \ it to the script tag. The following example shows how to download jQuery from\
    \ Google's CDN:\n\n```\n<html>\n<head>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js\"\
    ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n— 185 —"
