  md: "# Testing and Debugging\n\n+   - toContain(): This checks whether an element\
    \ is part of an array. This is not an exact object match as toBe(). For example,\
    \ look at the following code:\n- expect(1, [2, 3]).toBe(3)\n- expect(\"astronomy\
    \ is a science\").toContain(\"science\")\n- toBeDefined() and toBeUndefined():\
    \ These matches are handy to check whether a variable is undefined (or not).\n\
    - toBeNull(): This checks whether a variable's value is null.\n- toBeGreaterThan()\
    \ and toBeLessThan(): These matches perform numeric comparisons (then working\
    \ on strings):\n- expect(2).toBeGreaterThan(1)\n- expect(1).toBeLessThan(2)\n\
    - expect(\"a\").toBeLessThan(\"b\")\n\nOne interesting feature of Jasmine is the\
    \ spies. When you are writing a large system, it is not possible to make sure\
    \ all systems are always available and correct. At the same time, you don't want\
    \ your unit tests to fail due to a dependency that may be broken or unavailable.\
    \ To simulate a situation where all dependencies are available for a unit of code\
    \ that we want to test, we mock these dependencies to give the response that we\
    \ want. Mocking is an important aspect of testing and most testing frameworks\
    \ support for mocking. Jasmine allows mocking using a feature spy. spies essentially\
    \ stub the functions that we may not have; at the time of writing the test case\
    \ as part of the functionality, we need to track that we are executing these dependencies\
    \ and not ignoring them.\nConsider the following example:\n\n```\ndescribe(\"\
    mocking configurator\", function() {\n  var configurator = null;\n  var responseJSON\
    \ = {};\n\nbeforeEach(function() {\n  configurator = {\n    submitPOSTRequest:\
    \ function(payload) {\n      //This is a mock service that will eventually be\
    \ replaced\n      //by a real service\n      console.log(payload);\n      return\
    \ {\"status\": \"200\"};\n    }\n  });\n\n  spyOn(configurator, 'submitPOSTRequest').returnValue({\"\
    status\": \"200\"});\n  configurator.submitPOSTRequest({\n```\n\n— 152 —"
