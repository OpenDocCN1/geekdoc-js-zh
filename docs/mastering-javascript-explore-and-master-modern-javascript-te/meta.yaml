  md: "# Object literals\n\nObject literals are everywhere in JavaScript. You would\
    \ think that there is no scope of improvement there. However, ES6 wants to improve\
    \ this too. ES6 introduces several shortcuts to create a syntax around object\
    \ literals:\n\n```\nvar firstName = \"Albert\", lastname = \"Einstein\"\nperson\
    \ = {\n  firstName: firstName,\n  lastname: lastname\n};\n```\n\nIf you intend\
    \ to use the same property name as the variable that you are assigning, you can\
    \ use the concise property notation of ES6:\n\n```\nvar firstName = \"Albert\"\
    , lastname = \"Einstein\"\nperson = {\n  firstName,\n  lastname\n};\n```\n\nSimilarly,\
    \ you are assigning functions to properties as follows:\n\n```\nvar person = {\n\
    \  getName: function(){\n    //..\n  },\n  getAge: function(){\n    //..\n  }\n\
    };\n```\n\nInstead of the preceding lines, you can say the following:\n\n```\n\
    var person = {\n  getName() {\n    //..\n  },\n  getAge() {\n    //..\n  }\n};\n\
    ```"
  merge: -1
