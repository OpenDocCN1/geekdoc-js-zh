  md: "# For..of loops\n\nES6 adds a new iteration mechanism in form of the for..of\
    \ loop, which loops over the set of values produced by its iterator.\n\nThe value\
    \ that we iterate over for..of is an iterable.\n\nLet's compare for..of to for..in:\n\
    \n```\nvar list = ['Sunday', 'Monday', 'Tuesday'];\nfor (let i in list) {\n  console.log(i);\
    \ //0 1 2\n}\nfor (let i of list) {\n  console.log(i); //Sunday Monday Tuesday\n\
    }\n```\n\nAs you can see, using the for..in loop, you can iterate over indexes\
    \ of the list array, while the for..of loop lets you iterate over the values stored\
    \ in the list.\n\n# Arrow functions\n\nOne of the most interesting new parts of\
    \ ECMAScript 6 is arrow functions. are, as the name suggests, functions defined\
    \ with a new syntax that uses an arrow (=>) as part of the syntax. Let's first\
    \ see how arrow functions look:\n\n```\n//Traditional Function\nfunction multiply(a,b)\
    \ {\n  return a*b;\n}\n//Arrow\nvar multiply = (a,b) => a*b;\nconsole.log(multiply(1,2));\
    \ //2\n```\n\nThe arrow function definition consists of a parameter list (of zero\
    \ or more parameters and surrounding { . } if there's not exactly one parameter),\
    \ followed by the => marker, which is followed by a function body."
  merge: -1
  pgno: 194
- img_proc: false
  md: "The body of the function can be enclosed by { .. } if there's more than one\
    \ expression in the body. If there's only one expression, and you omit the surrounding\
    \ { .. }, there's an implied return in front of the expression. There are several\
    \ variations of how you can write arrow functions. The following are the most\
    \ commonly used:\n\n```\n// single argument, single statement\n/arg => expression;\n\
    var f1 = x => console.log(\"Just X\");\nf1(); //Just X\n```\n\n```\n// multiple\
    \ arguments, single statement\n//([arg1, arg2]) => expression;\nvar f2 = (x,y)\
    \ => x*y;\nconsole.log(f2(2,2)); //4\n```\n\n```\n// single argument, multiple\
    \ statements\n//arg => {\n  statements;\n}\nvar f3 = x => {\nif(x>5) {\n  console.log(x);\n\
    } else {\n  console.log(x+5);\n}\nf3(6); //6\n```\n\n```\n// multiple arguments,\
    \ multiple statements\n//([arg], {arg}) => {\n  statements;\n}\nvar f4 = (x,y)\
    \ => {\nif(x!=0 && y!=0) {\n  return x*y;\n}\nconsole.log(f4(2,2)); //4\n```"
