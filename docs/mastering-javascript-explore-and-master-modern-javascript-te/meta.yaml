  md: '# JavaScript Primer


    Strict equality is always the correct equality check to use. Make it a rule to
    always use === instead of ==.


    | Condition | Output |

    | --- | --- |

    | "" === "0" | false |

    | 0 === "" | false |

    | 0 === 0 | false |

    | false === "false" | false |

    | false === "0" | false |

    | false === undefined | false |

    | false === null | false |

    | null === undefined | false |


    In case of comparing objects, we get results as follows:


    | | Output |

    | --- | --- |

    | {} === {}; | false |

    | new String(''bah'') === ''bah''; | false |

    | new Number(1) === 1; | false |

    | var bar = {}; | true |

    | bar === bar; |


    The following are further examples that you should try on either JS Bin or Node
    REPL:


    ```

    var n = 0;

    var o = new String("0");

    var s = "0";

    var b = false;


    console.log(n === n); // true - same values for numbers

    console.log(o === o); // true - non numbers are compared for the

    values

    console.log(s === s); // true - ditto


    console.log(n === o); // false - no implicit type conversion, types

    are different

    console.log(o === s); // false - types are different

    console.log(b === s); // false - types are different

    console.log(null === undefined); // false

    console.log(o === null); // false

    console.log(undefined); // false

    ```


    You can use !== to handle the Not Equal To while doing strict equality checks.'
