  md: "```\nSubject.prototype.notify = function () {\n  var args = Array.prototype.slice.call\
    \ (arguments, 0);\n  for (var i = 0; i<this.observer_list.length; i++) {\n   \
    \ this.observer_list[i].update(args);\n  }\n  return Subject;\n}\n();\n```\n\n\
    This is a fairly straightforward implementation of a Subject. The important fact\
    \ about the notify() method is in the way in which all observer objects' update\
    \ methods are called to broadcast the update.\n\nNow let's define a simple object\
    \ that creates random tweets. This object providing an interface to add and remove\
