  md: "You can't use jQuery before the page is completely loaded. As jQuery will need\
    \ to know all the nodes of the DOM structure, the entire DOM has to be in-memory.\
    \ To ensure that the page is completely loaded and in a state where it's ready\
    \ to be manipulated, we can use the $ (document).ready() function. Here, the IIFE\
    \ is executed after the entire document is ready.\n\n```\n$$(document).ready(function()\
    \ {\n  $('#greeting').html('Hello World Martian');\n});\n```\n\nThis snippet shows\
    \ how you can associate a function to jQuery's .ready() function. This will be\
    \ executed when the document is ready. We are using $ (document) to create a jQuery\
    \ object from our page's document. We are calling the .ready() function on the\
    \ jQuery object and passing the function we want to execute.\n\nThis is a very\
    \ common thing to do when using jQuery—so much that it has its own shortcut. You\
    \ can replace the entire ready() call with a short {}\n\n```\n$(function() {\n\
    \  $('#greeting').html('Hello World Martian');\n});\n```\n\nThe most important\
    \ function in jQuery is $(). This function typically accepts a CSS selector as\
    \ its parameter and returns a new jQuery object pointing to the corresponding\
    \ elements on the page. The three primary selectors are the tag name, ID, and\
    \ Class. They can be used either on their own or in combination with others. The\
    \ following simple examples illustrate how these three selectors appear in code:\n\
    \n| Selector | CSS Selector | jQuery Selector | Output from the selector |\n|\
    \ Tag | p() | $('#p') | This selects all the p tags from the document. |\n| Id\
    \ | #div_1 | $('#div_1') | This selects single elements that have a div_1 ID.\
    \ The symbol used to identify the ID is #. |\n| Class | .bold_fonts | $('.bold_fonts')\
    \ | This selects all the elements in the document that have the CSS class bold_fonts.\
    \ The symbol used to identify the class match is \\.\". |"
