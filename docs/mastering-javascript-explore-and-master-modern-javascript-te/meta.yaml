  md: '# # ECMAScript 6


    So far, we have taken a detailed tour of the JavaScript programming language.
    I am sure that you must have gained significant insight into the core of the language.
    What we saw so far was per the **ECMAScript 5 (ES5)** standards. **ECMAScript
    6 (ES6)** or **ECMAScript 2015 (ES2015)** is the latest version of the ECMAScript
    standard. This standard is evolving in its scope and the last round of modifications
    was done in June, 2015. ES2015 is significant in its scope and the recommendations
    of ES2015 are being implemented in most JavaScript engines. This is great news.
    ES6 introduces a huge number of features that add syntactic forms and helps enrich
    the language significantly. The pace at which ECMAScript standards keep evolving
    makes it a bit difficult for browsers and JavaScript engines to support new features.
    It is also a practical reality that most programmers have to write code that can
    be supported by older browsers. The notorious Internet Explorer 6 was once the
    most widely used browser in the world. To make sure that your code is compatible
    with the most number of browsers is a daunting task. So, while you want to jump
    to the next set of awesome ES6 features, you will have to consider the fact that
    several ES6 features may not be supported by the popular of browsers or JavaScript
    frameworks.


    This may look like a dire scenario, but things are not dark. **Node.js** uses
    the latest version of the V8 engine that supports majority of ES6 features. Facebook''s
    **React** also supports them. Mozilla Firefox and Google Chrome are two of the
    most used browsers today and they support a majority of ES6 features.


    To avoid such pitfalls and unpredictability, certain solutions have been proposed.
    The most useful among these are polyfills/shims and transpilers.'
  merge: -1
  pgno: 181
- img_proc: false
  md: "ECMAScript 6\n\n# # Shims\n\nPolyfills (also known as shims) are patterns to\
    \ define behavior for a new version in a compatible format supported by an older\
    \ version of the environment. There's a great collection of ES6 sh called ES6\
    \ shim (https://github.com/paulmillr/es6-shim); I would highly recommend a study\
    \ of these shims. From the ES6 shim collection, consider the following example\
    \ of a shim.\n\nThe Number.isFinite() method of the ECMAScript 2015 (ES6) standard\
    \ determines whether the value is a finite number. The equivalent shim for it\
    \ would look something as follows:\n\n```\nvar isFinite = Number.isFinite || function\
    \ isFinite(value) {\n    return typeof value == 'number' && globalIsFinite(value);\n\
    };\n```\n\nThe shim first checks if the Number.isFinite() method is available;\
    \ if not, it fills it up with an implementation. This is a pretty nifty technique\
    \ to fill gaps in specifications. Standards are constantly updated with newer\
    \ features, and, hence, it is a strategy to keep the most updated shims in your\
    \ project.\n\n> The endsWith() polyfill is described in detail at https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/endsWith()\
    \ is part of ES6 but can be polyfilled essentially for pre-ES6 environments.\n\
    \nShims, however, cannot polyfill syntactic changes. For this, we can consider\
    \ transpilers as an.\n\n# # Transpilers\n\nTranspiling is a technique that combines\
    \ both compilation and transformation. The goal is to write ES6-compatible code\
    \ and use a tool that transpiles this code into a valid and elegant ES5 code.\
    \ We will be looking at the most complete and popular transpiler for ES6 called\
    \ Babel (https://babeljs.io/).\n\nBabel can be used in various ways. You can install\
    \ it as a module and invoke it from the command line or import it in your web\
    \ page. Babel's setup is exhaustive and well-documented at https://babeljs.io/docs/setup/.\
    \ Babel also has a great Read-Eval-Print-Loop (REPL). We will Babel REPL for most\
    \ of the examples in this chapter. An in-depth understanding of various ways which\
    \ Babel can be used out of the scope of this book. However, I would urge you to\
    \ start using Babel as part of your development workflow.\n\n— 164 —"
  merge: -1
  pgno: 182
- img_proc: false
  md: "We will cover the most important part of ES6 specifications in this chapter.\
    \ You should explore all the features of ES6 if possible and make them part of\
    \ your development workflow.\n\n# ES6 syntax changes\n\nES6 brings in significant\
    \ syntactic changes to JavaScript. These changes need careful study and some getting\
    \ used to it. In this section, we will study some of the most important syntax\
    \ changes and see how you can use Babel to start using some of newer constructs\
    \ in your code right away.\n\n# Block scoping\n\nWe discussed earlier that variables\
    \ in JavaScript are function-scoped. Variables created in a nested scope are available\
    \ to the entire function. Several programming languages provide you with a default\
    \ block scope where any variable declared within a block of code (usually delimited\
    \ by {}) is scoped only within this block. To achieve a similar block scope in\
    \ JavaScript, a prevalent method is to use immediately-invoked function expressions\
    \ (IIFE). Consider the following example:\n\n```\nvar a = 1;\nfunction blockscope()\
    \ {\n  var a = 2;\n  console.log(a); // 2\n}\nconsole.log(a); // 1\n```\n\nUsing\
    \ the IIFE, we are creating a block scope for the variable. When a variable is\
    \ declared in the IIFE, its scope is restricted within the function. This is the\
    \ traditional way of simulating block scope. ES6 supports block scoping without\
    \ using IIFEs. In ES6, you can encapsulate any statement in a block defined by\
    \ {}. Instead of using var, you declare a variable let to define the block scope.\
    \ The preceding example can be rewritten using ES6 block scopes as:\n\n```\n\"\
    use strict\";nvar a = 1;\n{\n  let a = 2;\n  console.log(a); // 2\n}\nconsole.log(a);\
    \ // 1\n```"
  merge: -1
  pgno: 183
- img_proc: false
  md: "# ECMAScript 6\n\nUsing standalone brackets {} may seem unusual in JavaScript,\
    \ but this convention is fairly common to create a block scope in many languages.\
    \ The block scope kicks in other constructs such as { } or for () { } as well.\n\
    \nWhen you use a block scope in this way, it is generally preferred to use the\
    \ variable declaration on top of the block. One difference between variables declared\
    \ using var and let is that variables declared with var are attached to the entire\
    \ function scope, while variables declared using let are attached to the block\
    \ scope and they are not initialized until they appear in the block. Hence, you\
    \ cannot access a variable declared with let earlier than its declaration, whereas\
    \ with variables declared using var, the ordering doesn't matter:\n\n```\nfunction\
    \ foo() {\n  console.log(foo); // ReferenceError\n  let foo = 5000;\n}\n```\n\n\
    One specific use of let is in loops. When we use a variable declared in a for\
    \ loop, it is scoped to the global or parent scope. We can create a blockscoped\
    \ variable in the for loop by declaring a variable using let. Consider the following\
    \ example:\n\n```\nfor (let i = 0; i<5; i++) {\n  console.log(i);\n}\nconsole.log(i);\
    \ // i is not defined\n```\n\nAs i is created using let, it is scoped in the for\
    \ loop. You can see that the variable is not available outside the scope.\n\n\
    One more use of block scopes in ES6 is the ability to create constants. Using\
    \ the const keyword, you can create constants in the block scope. Once the value\
    \ is set, you cannot change the value of such a constant:\n\n```\nif(true) {\n\
    \  const a=1;\n  console.log(a);\n  a=100; // \"\"a\" is read-only, you will get\
    \ a TypeError\n}\n```\n\nA constant has to be initialized while being declared.\
    \ The same block scope rules apply to functions also. When a function is declared\
    \ inside a block, it is available only within that scope."
  merge: -1
  pgno: 184
