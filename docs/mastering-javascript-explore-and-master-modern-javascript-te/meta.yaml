    \ the instance property takes precedence. The rules governing the precedence of\
    \ the initialization are as follows:\n\n+   - Properties are tied to the object\
    \ instance for the prototype\n- Properties are tied to the object instance in\
    \ the constructor function\n\nThis example brings to us the use of this keyword.\
    \ It is easy to get confused by this keyword because it behaves differently in\
    \ JavaScript. In other OO languages such as Java, this keyword refers to the current\
    \ instance of the class. In JavaScript, the value of this is determined by the\
    \ invocation context of a function and where it is called. Let's see how this\
    \ behavior needs to be carefully understood:\n\n+   - When this is used in a global\
    \ context: When this is called in a global context, it is bound to the global\
    \ context. For example, in the case of a browser, the global context is usually\
    \ window. This is true for functions also. If you use this in a function that\
    \ is defined in the global context, it is still bound to the global context because\
    \ the function is part of the global context:\nfunction globalAlias() {\n  return\
    \ this;\n}\nconsole.log(globalAlias()); //[object Window]\n\n When this is used\
    \ in an object method: In this case, this is assigned or bound to the enclosing\
    \ object. Note that the enclosing object is the immediate parent if you are nesting\
    \ the objects:\nvar f = {\n  name: \"f\",\n  func: function () {\n    return this;\n\
    \  }\n};\nconsole.log(f.func());\n//prints\n//[object Object] {\n  // func function\
    \ () {\n    // return this;\n  },\n  // name: \"f\"\n}\n\n[ 105 ]"
