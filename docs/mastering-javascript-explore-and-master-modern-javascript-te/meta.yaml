    A few special values are also defined as part of the Number type. The first two
    are MAX_VALUE and Number.MIN_VALUE, which define the outer bounds of the Number
    value set. All ECMScript numbers must fall between these two values, without exception.
    A calculation can, however, result in a number that does not fall between these
    two numbers. When a calculation results in a number greater than MAX_VALUE, it
    is assigned a value of Number.POSITIVE_INFINITY, meaning that it has no numeric
    value. Likewise, a calculation that results in a number less than Number.MIN_VALUE
    is assigned a value of Number.NEGATIVE_INFINITY, which also has no numeric value.
    If a calculation returns an infinite value, the result cannot be used in any further
    calculations. You can use the isFinite() method to verify if the result is an.


