  md: "Whether a function execution is sequential or asynchronous depends on the context\n\
    in which it is executed:\n\n```\nvar i=0;\nfunction add(num) {\n  console.log(i);\n\
    \  i=i+num;\n}\n\nadd(100);\nconsole.log(i);\n```\n\nIf you run this program using\
    \ Node, you will see the following output (assuming\nthat your file is named app.js):\n\
    \n```\n-Chapter9 node app.js\n0\n100\n```\n\nThis is what all are used to. This\
    \ is traditional synchronous code execution where\ne line is executed in a sequence.\
    \ The code here defines a function and then on the\nnext line calls this function,\
    \ without waiting for anything. This is sequential control\nflow.\n\nThings will\
    \ be different if we introduced I/O to this sequence. If we try to read\nsome\
