  md: '# Chapter 9


    The preceding screen shows you the timeline view when we try to render https://twitter.com/
    in the browser. The timeline view gives you an overall view of which operation
    took how much time in execution:


    ![](bbox=[0.196, 0.212, 0.821, 0.33])


    +   * Composite Layers

    * Rasterize Paint

    * Recalculate Style

    * Update Layer Tree

    * Composite Layers

    * Timerired (5)

    * Receive Response (twitter.com/)

    * Receive Data (twitter.com/)

    * Event (unload)

    * Function Call (extensions-unload_eve...)

    * Function Call (extensions-unload_eve...)

    * GC Event (1009 KB collected)

    * Function Call (extensions-unload_eve...)

    * Function Call (extensions-unload_eve...)


    In the preceding screenshot, we see the progressive execution of various JavaScript
    functions, network calls, resources, and other operations rendering the Twitter
    home page. This view gives us a very good idea about which operations might be
    taking longer. When we identify which operations, we can optimize them for performance.
    The **Memory** view is a great tool to understand how memory is used during the
    lifetime of your application in the browser. The **Memory** view shows a graph
    of the memory used by your application over time and maintains a counter of the
    number of documents, DOM nodes, and event listeners that are held in the memory.
    The **Memory** view can help detect memory leaks and give you enough hints to
    understand what operations are required:


    ![](bbox=[0.176, 0.66, 0.821, 0.75])


    JavaScript performance is a fascinating subject and deserves its own dedicated
    text. I would urge you to explore Chrome''s DevTools and understand how best to
    use the tools to detect and diagnose performance problems in your code.


    [ 221 ]'
  merge: -1
