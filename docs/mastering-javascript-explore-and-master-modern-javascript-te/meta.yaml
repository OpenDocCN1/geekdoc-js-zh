  md: "It is natural for us to think of code execution happening from top to bottom,\
    \ line by line. This is how most of JavaScript code is executed but with some\
    \ exceptions.\n\nConsider the following code:\n\n```\nconsole.log( a );\nvar a\
    \ = 1;\n```\n\nIf you say this is an invalid code and will result in undefined\
    \ when we call console.log(), you are absolutely correct. However, what about\
    \ this?\n\n```\na = 1;\nvar a;\nconsole.log( a );\n```\n\nWhat would be the output\
    \ of the printing code? It is natural to expect undefined as the var statement\
    \ comes after a = 1, and it would seem natural to assume that the variable is\
    \ defined and assigned the default undefined. However, the output will be 1.\n\
    \nWhen you see var a = 1, JavaScript splits it into two statements: var a and\
    \ a = 1. The first statement, the declaration, is processed during the compilation\
    \ phase. The second statement, the assignment, is left in for the execution phase.\n\
    \nSo the preceding snippet would be executed as follows:\n\n```\nvar a; //-----Compilation\
    \ phase\n\na = 1; //------execution phase\nconsole.log( a );\n```\n\nThe first\
    \ snippet is actually executed as follows:\n\n```\nvar a; //-----Compilation phase\n\
    \nconsole.log( a );\na = 1; //------execution phase\n```\n\nSo, we can see, variable\
    \ and function declarations are moved up to the top of the code during compilation\
    \ phase—this is also popularly known as hoisting. It is very important to remember\
    \ that only the declarations themselves are hoisted, while any assignments or\
    \ other executable logic are left in place. The following snippet shows how function\
    \ declarations are hoisted:\n\n```\nfoo();\nfunction foo() {\n  console.log(a);\
    \ // undefined\n  var a = 1;\n}\n```"
  merge: -1
